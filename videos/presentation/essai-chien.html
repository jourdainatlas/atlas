<!doctype html><meta charset="utf-8"><body style="margin:0;background:#121418"><canvas id="c" width="2000" height="1100"></canvas><script src="chien.js"></script><script>
const ctx = document.getElementById('c').getContext('2d'), K = 9.5;
const poses = [
 { n: 'debout', p: {} }, { n: 'trot 0', p: { allure: 'trot', phase: 0.4, queue: { a: -0.35, amp: 0.25 } } }, { n: 'trot 1', p: { allure: 'trot', phase: 2.0 } }, { n: 'trot 2', p: { allure: 'trot', phase: 3.6 } },
 { n: 'galop 0', p: { allure: 'galop', phase: 0 } }, { n: 'galop 1', p: { allure: 'galop', phase: 1.6, queue: { a: -0.05, amp: 0.1 } } }, { n: 'galop 2', p: { allure: 'galop', phase: 3.2 } }, { n: 'galop 3', p: { allure: 'galop', phase: 4.8 } },
 { n: 'assis', p: { assis: 1, queue: { a: -0.35, amp: 0.4, courbe: -0.12 } } }, { n: 'mi-assis', p: { assis: 0.5 } }, { n: 'assis gauche', p: { assis: 1, face: -1 } }, { n: 'nez en l air', p: { tete: -0.42, cou: 0.15, queue: { a: 0.35, amp: 0.4 } } },
 { n: 'élan', p: { bas: 2.4, tang: -0.14 } }, { n: 'saut .25', p: { allure: 'vol', vol: 0.25, saut: 9, tang: 0.35, tete: -0.2 } }, { n: 'saut .6', p: { allure: 'vol', vol: 0.6, saut: 12, tang: -0.05 } }, { n: 'saut .9', p: { allure: 'vol', vol: 0.9, saut: 4, tang: -0.3, tete: 0.1 } },
];
poses.forEach((q, i) => { const cx = 250 + (i % 4) * 500, cy = 240 + Math.floor(i / 4) * 270;
  ctx.strokeStyle = '#2b2f37'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx - 220, cy); ctx.lineTo(cx + 220, cy); ctx.stroke();
  ctx.save(); ctx.translate(cx, cy); ctx.scale(K, K); CHIEN.dessiner(ctx, { x: 0, face: 1, t: 0.3 + i, ...q.p }); ctx.restore();
  ctx.fillStyle = '#90979f'; ctx.font = '22px sans-serif'; ctx.fillText(q.n, cx - 220, cy + 34); });
</script>
