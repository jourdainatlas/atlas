# Publication automatique de l'atlas sur GitHub Pages et, si les secrets OVH_* sont enregistrés,
# sur l'hébergement web OVHcloud (job « ovh », MEMO_atlas_apropos.md §64).
#
# À chaque modification enregistrée sur la branche main (par exemple un fichier
# du dossier contenu/), GitHub exécute ce script : il vérifie le contenu,
# construit la page, puis la met en ligne. Si une vérification échoue
# (cycle, terme inconnu, formule LaTeX incorrecte...), rien n'est publié et
# l'erreur est affichée dans l'onglet « Actions » du dépôt.

name: Publier ATLAS

on:
  push:
    branches: [main]
  workflow_dispatch:        # permet aussi de lancer la publication à la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          npm ci

      - name: Vérifier le contenu et construire la page
        run: sh construire.sh

      - name: Préparer la publication
        uses: actions/configure-pages@v5

      - name: Envoyer la page construite
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Mettre en ligne
        id: deploiement
        uses: actions/deploy-pages@v4

  ovh:
    # Envoi du même site sur l'hébergement OVHcloud, par SFTP (outils/publier_ovh.py). Sauté tant que le secret
    # OVH_HOTE n'existe pas ; indépendant de la publication GitHub Pages (un échec de l'un n'arrête pas l'autre).
    needs: construire
    runs-on: ubuntu-latest
    env:
      OVH_HOTE: ${{ secrets.OVH_HOTE }}
      OVH_UTILISATEUR: ${{ secrets.OVH_UTILISATEUR }}
      OVH_MOT_DE_PASSE: ${{ secrets.OVH_MOT_DE_PASSE }}
      OVH_PORT: "22"
      OVH_DOSSIER: atlas
    steps:
      - name: Récupérer les fichiers
        if: env.OVH_HOTE != ''
        uses: actions/checkout@v4

      - name: Récupérer le site construit
        if: env.OVH_HOTE != ''
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: archive

      - name: Envoyer sur OVHcloud
        if: env.OVH_HOTE != ''
        run: |
          mkdir site && tar -xf archive/artifact.tar -C site
          pip install paramiko==5.1.0
          python3 outils/publier_ovh.py site
