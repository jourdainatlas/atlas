# Niveau 1 : structure interne du nœud « Analyse complexe ».
# Séries et séries entières ; l'exponentielle réelle, le cosinus, le sinus et π, construits en analyse réelle
# (ar-exp, ar-trigo), sont reliés à ℂ : exp prolongée par sa série, exp(it) = cos t + i sin t par la
# caractérisation de tg-addition (vi), π/2 plus petit zéro positif de cos par tg-cercle (2 nov. 2026).
# On en tire la forme polaire, l'intégrale curviligne,
# le théorème de Cauchy pour les ouverts convexes, la formule de Cauchy, l'analyticité des fonctions
# holomorphes, le théorème de Liouville, qui démontre enfin d'Alembert-Gauss, et les zéros isolés.
# anc-residus (sous-graphe, 29 oct. 2026) traite l'indice d'un lacet, les séries de Laurent, les
# singularités isolées, le théorème des résidus pour un ouvert convexe privé d'un nombre fini de points,
# le principe de l'argument, le théorème de Rouché et des calculs d'intégrales réelles.
# anc-conforme (sous-graphe, 30 oct. 2026) traite le principe du maximum, l'application ouverte, le lemme de
# Schwarz, les automorphismes du disque, Montel, Hurwitz et le théorème de représentation conforme de Riemann.

graphe: anc
titre: Analyse complexe
conteneur: anc

entrees:
  c: [cx-suites]
  analyse-reelle: [cx-suites]
  met: [cx-suites]

noeuds:
  - id: cx-suites
    etiquette: Suites et séries complexes
    nature: proposition
    titre: Suites, séries et parties compactes de ℂ
    texte: |
      Une suite $(z_n)$ de nombres complexes [[limite-suite|converge]] vers $z$ si $|z_n - z| \to 0$, le module jouant le rôle de la [[valeur-absolue|valeur absolue]] ({{c-calcul|Conjugué, module}}). La [[serie-complexe|série]] $\sum z_n$ converge si la suite de ses sommes partielles $S_N = \sum_{n \leqslant N} z_n$ converge ; elle converge [[serie-absolument-convergente|absolument]] si $\sum |z_n|$ converge.
    enonce: |
      (i) $(z_n)$ converge si et seulement si $(\operatorname{Re} z_n)$ et $(\operatorname{Im} z_n)$ convergent ; toute suite de Cauchy de $\lex{ensemble-complexes}{\mathbb C}$ converge.

      (ii) Une série absolument convergente converge, et $\big|\sum z_n\big| \leqslant \sum |z_n|$.

      (iii) Si $|q| < 1$, la série géométrique $\sum q^n$ converge absolument, de somme $\frac{1}{1 - q}$.

      (iv) Toute partie fermée et bornée de $\mathbb C$ est [[compact|compacte]].
    preuve: |
      (i) Pour $w = a + ib$, on a $|w| = \sqrt{a^2 + b^2}$ ({{c-calcul|Conjugué, module}}), de sorte que $|z - w|$ est la distance $d_2$ ({{me-espace|Espaces métriques}}) entre les couples des [[partie-reelle|parties réelles]] et imaginaires de $z$ et de $w$ : l'application $a + ib \mapsto (a, b)$ est une bijection de $\mathbb C$ sur $\lex{n-uplet}{\mathbb R^2}$ qui préserve les distances.

      Les deux énoncés sont donc ceux du nœud {{me-rn|L'espace ℝⁿ}}, (i) et (ii), pour $n = 2$ et la distance $d_2$.

      (ii) Pour $M < N$, $|S_N - S_M| \leqslant \sum_{M < n \leqslant N} |z_n|$, par l'inégalité triangulaire ; si $\sum |z_n|$ converge, la suite $(S_N)$ est de Cauchy, donc converge par (i). L'inégalité passe à la limite.

      (iii) $(1 - q) \sum_{n \leqslant N} q^n = 1 - q^{N+1}$.

      Il reste à voir que $|q|^N \to 0$. Si $q \neq 0$, écrivons $1/|q| = 1 + h$ avec $h > 0$ ; par récurrence, $(1 + h)^N \geqslant 1 + Nh$, donc $|q|^N \leqslant \frac{1}{1 + Nh}$, qui tend vers $0$ par la propriété d'Archimède ({{ar-archimede|Archimède, densité de ℚ}}).

      ```schema cx-suites
      Les sommes partielles $S_N$ de la série géométrique de raison $q = 0{,}6 + 0{,}6i$, de module $|q| \approx 0{,}85$, reliées dans l'ordre, s'enroulent autour de la somme $\frac{1}{1 - q} = \frac{10 + 15i}{13}$, en rouge. L'identité $(1 - q)S_N = 1 - q^{N+1}$ donne $\big|S_N - \frac{1}{1 - q}\big| = \frac{|q|^{N+1}}{|1 - q|}$ : le cercle pointillé, de ce rayon pour $N = 3$, passe par $S_3$ et contient toutes les sommes suivantes.
      ```

      (iv) L'identification de (i) préserve les distances, donc les boules, les ouverts, les fermés, les [[partie-bornee|parties bornées]] et les compacts. C'est alors le nœud {{me-rn|L'espace ℝⁿ}}, (iii), pour $n = 2$.
    remarques:
      - |
        L'erreur la plus répandue est de croire qu'une série convergente l'est absolument. La série $\sum (-1)^n/(n+1)$ converge, puisque ses sommes partielles d'indices pairs décroissent, que celles d'indices impairs croissent, et que leur écart tend vers $0$ ; mais $\sum 1/(n+1)$ diverge. En effet, pour $k \in \mathbb N$, les $2^k$ termes d'indices $n$ tels que $2^k \leqslant n + 1 < 2^{k+1}$ sont chacun strictement supérieurs à $2^{-k-1}$, et leur somme dépasse $\frac12$ ; la somme partielle des $2^K - 1$ premiers termes dépasse donc $\frac K2$, et les sommes partielles ne sont pas majorées. Toutes les séries de ce graphe seront absolument convergentes, ce qui évite cette difficulté.

  - id: cx-convergence-uniforme
    etiquette: Convergence uniforme
    nature: proposition
    titre: Convergence uniforme et intégrale des fonctions complexes
    texte: |
      Une suite de fonctions $f_n : A \to \lex{ensemble-complexes}{\mathbb C}$ [[convergence-uniforme|converge uniformément]] vers $f$ si $\sup_{x \in A} |f_n(x) - f(x)| \to 0$. Pour $h : [a, b] \to \mathbb C$ continue, on pose $\int_a^b h = \int_a^b \operatorname{Re} h + i \int_a^b \operatorname{Im} h$, avec l'intégrale de Riemann ({{ar-riemann|Intégrale de Riemann}}).
    enonce: |
      (i) Une limite uniforme de fonctions continues est continue.

      (ii) *Critère de Weierstrass.* Si $|f_n(x)| \leqslant M_n$ pour tout $x \in A$ et si $\sum M_n$ converge, la série $\sum f_n$ converge uniformément sur $A$.

      (iii) L'intégrale est [[application-a-lineaire|$\mathbb C$-linéaire]], et $\big|\int_a^b h\big| \leqslant 2(b - a)\sup |h|$. Par suite, si $h_n \to h$ uniformément sur $[a, b]$, avec $h_n$ continues, alors $\int_a^b h_n \to \int_a^b h$.

      (iv) Si $F : [a, b] \to \mathbb C$ est dérivable de dérivée continue, $\int_a^b F' = F(b) - F(a)$.
    preuve: |
      (i) Soit $x_0 \in A$ et $\varepsilon > 0$. On choisit $n$ tel que $|f_n - f| < \varepsilon/3$ sur $A$, puis un voisinage de $x_0$ où $|f_n(x) - f_n(x_0)| < \varepsilon/3$ ; sur ce voisinage, $|f(x) - f(x_0)| < \varepsilon$ par l'inégalité triangulaire.

      (ii) Pour chaque $x$, la série converge [[serie-absolument-convergente|absolument]] ({{cx-suites|Suites et séries complexes}}), et le reste vérifie $\big|\sum_{n > N} f_n(x)\big| \leqslant \sum_{n > N} M_n$, qui tend vers $0$ indépendamment de $x$.

      (iii) La linéarité réelle vient de celle de l'intégrale de Riemann ; pour la multiplication par $i$, $\int ih = \int (-\operatorname{Im} h) + i\int \operatorname{Re} h = i\int h$.

      Comme $|\operatorname{Re} h|, |\operatorname{Im} h| \leqslant |h|$, la positivité de l'intégrale donne
      $$\begin{aligned} \Big|\int h\Big| &\leqslant \Big|\int \operatorname{Re} h\Big| + \Big|\int \operatorname{Im} h\Big| \\ &\leqslant 2(b - a)\sup |h|. \end{aligned}$$
      On applique cette inégalité à $h_n - h$.

      (iv) On travaille sur la [[partie-reelle|partie réelle]] et la [[partie-imaginaire|partie imaginaire]]. La fonction $G(x) = \int_a^x F' - F(x)$ est dérivable de dérivée nulle ({{ar-tfa|Théorème fondamental de l'analyse}}).

      Une fonction réelle $g$ de dérivée nulle est constante : pour $x < y$, la fonction
      $$t \mapsto g(t) - g(x) - \frac{g(y) - g(x)}{y - x}(t - x)$$
      s'annule en $x$ et en $y$, et le théorème de Rolle ({{ar-deriv|Dérivabilité}}) fournit $c$ avec $0 = g'(c) = \frac{g(y) - g(x)}{y - x}$. Donc $G(b) = G(a)$.
    remarques:
      - |
        Le facteur $2$ de (iii) est grossier, mais suffit ici. Une fois l'exponentielle construite, on obtiendra l'inégalité optimale $\big|\int h\big| \leqslant \int |h|$ ({{cx-integrale-chemin|Intégrale curviligne}}).

  - id: cx-series-entieres
    etiquette: Séries entières
    nature: théorème
    titre: Séries entières et rayon de convergence
    texte: |
      Une [[serie-entiere|série entière]] est une [[serie-complexe|série]] $\sum a_n z^n$, où $(a_n)$ est une suite de complexes. Son **rayon de convergence** est $R = \sup\{r \geqslant 0 : (a_n r^n) \text{ est bornée}\}$, éventuellement infini.
    enonce: |
      (i) *Lemme d'Abel.* Si $(a_n r^n)$ est bornée et $0 \leqslant \rho < r$, la série converge [[serie-absolument-convergente|absolument]] et uniformément sur le disque fermé $|z| \leqslant \rho$.

      (ii) La série converge absolument pour $|z| < R$ et diverge pour $|z| > R$. Sa somme est continue sur le disque ouvert $D(0, R)$.

      ```schema cx-series-entieres
      Pour $|z| = \rho < R$, on choisit $r$ entre $\rho$ et $R$ avec $(a_n r^n)$ bornée, et le lemme d'Abel donne la convergence absolue et uniforme sur le disque fermé de rayon $\rho$, en rouge. Au-delà du cercle de rayon $R$ la série diverge ; sur ce cercle, le rayon ne dit rien.
      ```

    preuve: |
      (i) Si $|a_n r^n| \leqslant M$, alors $|a_n z^n| \leqslant M(\rho/r)^n$ pour $|z| \leqslant \rho$ ; la série géométrique de raison $\rho/r < 1$ converge ({{cx-suites|Suites et séries complexes}}), et le critère de Weierstrass s'applique ({{cx-convergence-uniforme|Convergence uniforme}}).

      (ii) Si $|z| < R$, il existe $r$ avec $|z| < r$ et $(a_n r^n)$ bornée, par définition de la borne supérieure ; (i) s'applique avec $\rho = |z|$. Si $|z| > R$, la suite $(a_n z^n)$ n'est pas bornée, donc ne tend pas vers $0$, et la série diverge, puisque le terme général $S_n - S_{n-1}$ d'une série convergente tend vers $0$.

      Tout point de $D(0, R)$ est dans un disque $|z| \leqslant \rho$ avec $\rho < R$, sur lequel la convergence est uniforme : la somme y est continue.
    remarques:
      - |
        Sur le cercle $|z| = R$, tout peut arriver : $\sum z^n$ diverge en tout point du cercle unité, tandis que $\sum z^n/(n+1)^2$ converge en tout point. Le rayon ne dit rien du bord.

  - id: cx-holomorphe
    etiquette: Fonctions holomorphes
    nature: proposition
    titre: Dérivabilité complexe
    texte: |
      Soit $U$ un [[ouvert]] de $\lex{ensemble-complexes}{\mathbb C}$, muni de la distance $|z - w|$ du nœud {{cx-suites|Suites et séries complexes}}, et $f : U \to \mathbb C$. Elle est dérivable au sens complexe en $z_0$ si $\frac{f(z) - f(z_0)}{z - z_0}$ a une limite $f'(z_0)$ quand $z \to z_0$ ; elle est [[holomorphe]] sur $U$ si elle l'est en tout point.
    enonce: |
      (i) $f$ est dérivable en $z_0$ si et seulement si $f(z) = f(z_0) + (z - z_0)\big(\ell + \varepsilon(z)\big)$ avec $\varepsilon(z) \to 0$, et alors $\ell = f'(z_0)$ ; $f$ est alors continue en $z_0$.

      (ii) Sommes, produits, quotients à dénominateur non nul et composées de fonctions holomorphes sont holomorphes, avec les formules usuelles. Les polynômes sont holomorphes sur $\mathbb C$.

      (iii) Si $f$ est holomorphe sur $U$ et $\gamma : [a, b] \to U$ dérivable, alors $(f \circ \gamma)'(t) = f'(\gamma(t))\,\gamma'(t)$.
    preuve: |
      (i) C'est la définition, en posant $\varepsilon(z) = \frac{f(z) - f(z_0)}{z - z_0} - \ell$ ; la continuité vient de ce que $(z - z_0)(\ell + \varepsilon(z)) \to 0$.

      (ii) Pour un produit,
      $$\begin{aligned} fg(z) - fg(z_0) &= (f(z) - f(z_0))g(z) \\ &\quad + f(z_0)(g(z) - g(z_0)) ; \end{aligned}$$
      on divise par $z - z_0$ et l'on utilise la continuité de $g$.

      Pour une composée $g \circ f$, l'écriture (i) appliquée à $g$ en $f(z_0)$ donne $g(f(z)) - g(f(z_0)) = (f(z) - f(z_0))\big(g'(f(z_0)) + \eta(f(z))\big)$, avec $\eta(w) \to 0$ quand $w \to f(z_0)$ et $\eta(f(z_0)) = 0$, de sorte que l'égalité vaut aussi aux points où $f(z) = f(z_0)$. Par continuité de $f$ en $z_0$, $\eta(f(z)) \to 0$ ; on divise par $z - z_0$.

      Le quotient s'obtient par $1/g$, composée de $g$ et de $w \mapsto 1/w$, dont la dérivée se calcule directement : pour $w \neq w_0$, tous deux non nuls,
      $$\frac{1/w - 1/w_0}{w - w_0} = -\frac{1}{w w_0},$$
      qui tend vers $-\frac{1}{w_0^2}$ quand $w \to w_0$. Les polynômes s'obtiennent par sommes et produits à partir de $z \mapsto z$.

      (iii) C'est le calcul de la composée, la variable réelle $t$ remplaçant $z$.
    remarques:
      - |
        La condition est bien plus forte que la dérivabilité des parties réelle et imaginaire : la limite doit être la même dans toutes les directions. La conjugaison $z \mapsto \bar z$ n'est holomorphe nulle part, puisque son taux d'accroissement vaut $1$ le long de l'axe réel et $-1$ le long de l'axe imaginaire.

  - id: cx-derivation-series
    etiquette: Dérivation terme à terme
    nature: théorème
    titre: Une série entière est holomorphe
    enonce: |
      Soit $f(z) = \sum a_n z^n$ de rayon $R > 0$. Alors $f$ est holomorphe sur $D(0, R)$, et $f'(z) = \sum_{n \geqslant 1} n a_n z^{n-1}$, série de même rayon. Par récurrence, $f$ est indéfiniment dérivable, et $a_n = f^{(n)}(0)/n!$.
    preuve: |
      *Rayons.* Si $r < r' < R$, la suite $(a_n r'^n)$ est bornée, et $u_n = n^2 (r/r')^n$ tend vers $0$ : le rapport $u_{n+1}/u_n = (1 + \frac1n)^2 \frac{r}{r'}$ tend vers $r/r' < 1$, donc reste inférieur à un $\kappa < 1$ à partir d'un rang, et $u_n$ est dominée par une suite géométrique de raison $\kappa$.

      Ainsi $(n^2 a_n r^n)$ est bornée : les séries $\sum n a_n z^{n-1}$ et $\sum n(n-1) a_n z^{n-2}$ ont un rayon au moins $R$, par la définition du rayon ({{cx-series-entieres|Séries entières}}). Elles n'en ont pas un plus grand, puisque $|a_n z^n| \leqslant |z| \cdot |n a_n z^{n-1}|$ pour $n \geqslant 1$.

      *Une majoration.* Pour $|z|, |z + h| \leqslant \rho$, on a
      $$(z + h)^k - z^k = h\sum_{j < k} (z + h)^j z^{k-1-j},$$
      donc $|(z + h)^k - z^k| \leqslant k|h|\rho^{k-1}$.

      En écrivant
      $$\begin{aligned} &(z + h)^n - z^n - nz^{n-1}h \\ &\quad = h\sum_{k < n} z^{n-1-k}\big((z + h)^k - z^k\big), \end{aligned}$$
      on obtient
      $$\begin{aligned} &\big|(z + h)^n - z^n - nz^{n-1}h\big| \\ &\quad \leqslant \frac{n(n-1)}{2}\,|h|^2 \rho^{n-2}. \end{aligned}$$

      *Dérivabilité.* Soit $|z| < \rho < R$ et $h$ assez petit pour que $|z + h| \leqslant \rho$. Alors
      $$\begin{aligned} &\Big|\frac{f(z + h) - f(z)}{h} - \sum_n n a_n z^{n-1}\Big| \\ &\quad \leqslant |h| \sum_n \frac{n(n-1)}{2}|a_n|\rho^{n-2}, \end{aligned}$$
      et la dernière série converge, puisque $\rho < R$. Le membre de droite tend vers $0$ avec $h$ : $f$ est dérivable au sens complexe en $z$ ({{cx-holomorphe|Dérivabilité complexe}}). La dérivée $n$-ième en $0$ s'obtient en itérant et en évaluant en $0$.
    remarques:
      - |
        Le coefficient $a_n$ est déterminé par les dérivées de $f$ en $0$ : une série entière de rayon non nul est entièrement fixée par le comportement de sa somme au voisinage d'un point. C'est le germe du principe des zéros isolés, en fin de graphe.

  - id: cx-exponentielle
    etiquette: Exponentielle
    nature: théorème
    titre: La fonction exponentielle
    texte: |
      L'[[exponentielle]] réelle a été construite en analyse réelle comme la réciproque du logarithme ({{ex-exponentielle|Exponentielle}}), et le nœud {{ex-serie|Série de l'exponentielle}} l'a écrite comme somme de la [[serie-complexe|série]] $\sum x^n/n!$. Pour $z \in \lex{ensemble-complexes}{\mathbb C}$, on pose
      $$\exp z = \sum_{n \geqslant 0} \frac{z^n}{n!} ;$$
      le point (iv) montre que c'est un prolongement de l'exponentielle réelle, ce qui justifie la notation.
      Les fonctions $\cos$ et $\sin$ sont le cosinus et le sinus réels du nœud {{tg-prolongement|Cosinus et sinus sur ℝ}}.
    enonce: |
      (i) La série a un rayon infini ; $\exp$ est holomorphe sur $\mathbb C$, et $\exp' = \exp$.

      (ii) $\exp(z + w) = \exp z \exp w$ ; en particulier $\exp z \neq 0$ et $\exp(-z) = 1/\exp z$.

      (iii) $\overline{\exp z} = \exp \bar z$. Pour tout réel $t$,
      $$\exp(it) = \cos t + i\sin t ;$$
      en particulier $|\exp(it)| = 1$, ce qui redonne $\cos^2 t + \sin^2 t = 1$.

      (iv) Sur $\lex{ensemble-reels}{\mathbb R}$, $\exp$ coïncide avec l'exponentielle réelle du nœud {{ex-exponentielle|Exponentielle}} : elle y est strictement positive et [[application-croissante|strictement croissante]]. Les fonctions $\cos$ et $\sin$ sont dérivables, avec $\cos' = -\sin$ et $\sin' = \cos$.
    preuve: |
      (i) Pour tout $r > 0$, $r^n/n! \to 0$, puisque le rapport de deux termes consécutifs, $r/(n + 1)$, devient inférieur à $\frac12$ : la suite est bornée, et $R = +\infty$. Le nœud {{cx-derivation-series|Dérivation terme à terme}} donne $\exp' = \sum_{n \geqslant 1} \frac{n z^{n-1}}{n!} = \exp$.

      (ii) Fixons $a \in \mathbb C$ et posons $g(z) = \exp(z)\exp(a - z)$, holomorphe de dérivée $\exp(z)\exp(a - z) - \exp(z)\exp(a - z) = 0$.

      Pour $z$ fixé, $t \mapsto g(tz)$, sur $[0, 1]$, a une dérivée nulle ({{cx-holomorphe|Fonctions holomorphes}}), donc est constante ({{cx-convergence-uniforme|Convergence uniforme}}, (iv)) : $g(z) = g(0) = \exp a$. Avec $a = z + w$, on obtient l'égalité, et $\exp(z)\exp(-z) = \exp 0 = 1$.

      (iii) La conjugaison passe aux sommes partielles, puis à la limite.

      Pour $t$ réel, posons $F(t) = \exp(it)$, $C(t) = \operatorname{Re} F(t)$ et $S(t) = \operatorname{Im} F(t)$. Par (i) et la dérivée d'une composée ({{cx-holomorphe|Fonctions holomorphes}}, (iii)), appliquée au chemin $t \mapsto it$, la fonction $F$ est dérivable, de dérivée $F'(t) = i\exp(it)$ : le taux d'accroissement $\frac{F(t + h) - F(t)}{h}$, pour $h$ réel non nul, tend vers $iF(t)$ quand $h$ tend vers $0$.

      Comme $|\operatorname{Re} w| \leqslant |w|$ et $|\operatorname{Im} w| \leqslant |w|$, les [[partie-reelle|parties réelle]] et imaginaire de ce taux, qui sont les taux d'accroissement de $C$ et de $S$, tendent vers celles de $iF(t) = iC(t) - S(t)$. Ainsi $C$ et $S$ sont dérivables ({{de-derivee|Dérivabilité en un point}}), et
      $$C' = -S, \qquad S' = C.$$
      De plus $F(0) = \exp 0 = 1$, donc $C(0) = 1$ et $S(0) = 0$. La caractérisation du nœud {{tg-addition|Formules d'addition}}, (vi), donne $C = \cos$ et $S = \sin$ : c'est l'égalité $\exp(it) = \cos t + i\sin t$.

      Enfin, par la conjugaison et (ii), $|\exp(it)|^2 = \exp(it)\,\overline{\exp(it)} = \exp(it)\exp(-it) = 1$.

      (iv) Pour $x$ réel, les sommes partielles $\sum_{k \leqslant n} x^k/k!$ sont réelles, et elles convergent vers l'exponentielle réelle de $x$ ({{ex-serie|Série de l'exponentielle}}, (i)) ; la limite d'une suite de $\mathbb C$ étant unique, les deux exponentielles coïncident sur $\mathbb R$. Elle y est donc strictement positive et strictement croissante ({{ex-exponentielle|Exponentielle}}, (i)). Les dérivées de $\cos$ et de $\sin$ sont celles du nœud {{tg-prolongement|Cosinus et sinus sur ℝ}}, (iii), que la preuve de (iii) retrouve.
    remarques:
      - |
        L'égalité (iii) est la formule d'Euler. Beaucoup d'exposés la prennent pour définition du cosinus et du sinus, en posant $\cos t = \operatorname{Re}\exp(it)$ et $\sin t = \operatorname{Im}\exp(it)$ ; la caractérisation du nœud {{tg-addition|Formules d'addition}}, (vi), montre que cette voie et celle de l'analyse réelle, par l'arc tangente, mènent aux mêmes fonctions. Ce qui compte n'est pas la construction, mais les deux relations $C' = -S$ et $S' = C$ avec les conditions initiales, qui déterminent les fonctions.
      - |
        Les formules d'addition du cosinus et du sinus ({{tg-addition|Formules d'addition}}, (iii)) sont maintenant les parties réelle et imaginaire de $\exp(i(s + t)) = \exp(is)\exp(it)$. L'analyse réelle les obtenait par l'unicité des solutions de $y'' + y = 0$ ; ici, une seule identité sur $\mathbb C$ les contient toutes les deux.
      - |
        L'erreur la plus répandue est de transporter à $\mathbb C$ les propriétés de l'exponentielle réelle. Sur $\mathbb R$, elle est injective et à valeurs strictement positives ; sur $\mathbb C$, elle n'est pas injective, puisque $\exp(2i\pi) = \exp 0$, et elle prend toutes les valeurs non nulles : tout $w \neq 0$ s'écrit $|w|\exp(i\theta)$ ({{cx-pi|Le nombre π}}, (iii)), et $|w| = \exp(\ln|w|)$ par la surjectivité de l'exponentielle réelle sur $]0, +\infty[$ ({{ex-exponentielle|Exponentielle}}), d'où $w = \exp(\ln|w| + i\theta)$. Seul le module garde une trace de la partie réelle : $|\exp(x + iy)| = \exp x$, par (ii) à (iv).

  - id: cx-pi
    etiquette: Le nombre π
    nature: théorème
    titre: Le nombre π et la périodicité de l'exponentielle
    texte: |
      Le nombre [[pi|$\pi$]] a été défini en analyse réelle, comme le double de la borne supérieure de l'arc tangente ({{tg-arctan|Arc tangente, π}}). Ce nœud le relie à l'exponentielle complexe du nœud {{cx-exponentielle|Exponentielle}}.
    enonce: |
      (i) Le plus petit zéro strictement positif de $\cos$ est $\frac\pi2$, et $0 < \frac\pi2 < 2$.

      (ii) $\exp(i\pi/2) = i$, $\exp(i\pi) = -1$, $\exp(2i\pi) = 1$, et $\exp(z) = 1$ si et seulement si $z \in 2i\pi\lex{ensemble-entiers-relatifs}{\mathbb Z}$.

      (iii) L'application $t \mapsto \exp(it)$ est surjective de $\lex{ensemble-reels}{\mathbb R}$ sur le cercle unité $\mathbb U = \{w : |w| = 1\}$. Tout complexe non nul s'écrit donc $z = |z|\exp(i\theta)$, avec $\theta$ unique modulo $2\pi$.
    preuve: |
      (i) Par le nœud {{tg-cercle|Paramétrage du cercle}}, (i), les zéros du cosinus sont les réels $\frac\pi2 + m\pi$, $m \in \mathbb Z$, et le plus petit d'entre eux qui soit strictement positif est $\frac\pi2$. Par {{tg-arctan|Arc tangente, π}}, (iii), $\pi > 0$ ; par le point (ii) du même nœud, toutes les valeurs de l'arc tangente sont majorées par $1 + \arctan 1$, donc aussi leur borne supérieure $\frac\pi2$, et $1 + \arctan 1 < 2$.

      (ii) Par {{cx-exponentielle|Exponentielle}}, (iii), $\exp(i\pi/2) = \cos\frac\pi2 + i\sin\frac\pi2 = i$, puisque $\cos\frac\pi2 = 0$ et $\sin\frac\pi2 = 1$ ({{tg-prolongement|Cosinus et sinus sur ℝ}}, (i) et (ii)). En élevant au carré puis à la puissance quatrième ({{cx-exponentielle|Exponentielle}}, (ii)), $\exp(i\pi) = i^2 = -1$ et $\exp(2i\pi) = 1$. Pour tout entier $k$, on en déduit $\exp(2ik\pi) = 1$, par récurrence pour $k \geqslant 0$ et par $\exp(-z) = 1/\exp z$ pour $k < 0$.

      Réciproquement, soit $z = x + iy$, avec $x$ et $y$ réels, tel que $\exp z = 1$. Par {{cx-exponentielle|Exponentielle}}, (ii) et (iii), $\exp z = \exp x\,\exp(iy)$, de module $\exp x\,|\exp(iy)| = \exp x$, puisque $\exp x$ est un réel strictement positif ({{cx-exponentielle|Exponentielle}}, (iv)). Donc $\exp x = 1 = \exp 0$, et $x = 0$ par stricte croissance. Il reste $\cos y + i\sin y = 1$, d'où $\cos y = 1$, et $y \in 2\pi\mathbb Z$ par {{tg-cercle|Paramétrage du cercle}}, (ii).

      (iii) Soit $w = a + ib \in \mathbb U$, avec $a$ et $b$ réels. Alors $a^2 + b^2 = |w|^2 = 1$ ({{c-calcul|Conjugué, module}}), et le point $(a, b)$ est sur le cercle unité $\lex{sphere-unite}{S^1}$ de $\mathbb R^2$. Par {{tg-cercle|Paramétrage du cercle}}, (iii), il existe $t \in [0, 2\pi[$ tel que $(\cos t, \sin t) = (a, b)$, c'est-à-dire $\exp(it) = w$, par {{cx-exponentielle|Exponentielle}}, (iii).

      Si $z \neq 0$, le complexe $z/|z|$ est de module $1$ : il s'écrit $\exp(i\theta)$, et $z = |z|\exp(i\theta)$. Si de plus $z = |z|\exp(i\theta')$, alors $\exp(i(\theta - \theta')) = 1$, et $\theta - \theta' \in 2\pi\mathbb Z$ par (ii).
    remarques:
      - |
        La série permet aussi de localiser $\frac\pi2$ sans l'arc tangente. Pour $t$ réel, les termes d'indice pair de la série de $\exp(it)$ sont les réels $\frac{(it)^{2k}}{(2k)!} = (-1)^k \frac{t^{2k}}{(2k)!}$, et ceux d'indice impair sont imaginaires purs ; en passant à la limite dans les parties réelles des sommes partielles, ce qui est permis puisque $|\operatorname{Re} w| \leqslant |w|$, on obtient
        $$\cos t = \sum_k (-1)^k \frac{t^{2k}}{(2k)!}.$$
        En $t = 2$, les termes $\frac{4^k}{(2k)!}$ décroissent à partir de $k = 1$, puisque leur rapport $\frac{4}{(2k+1)(2k+2)}$ est inférieur à $1$ ; en les groupant deux à deux à partir de $k = 3$, on obtient une somme négative, et $\cos 2 \leqslant 1 - 2 + \frac23 = -\frac13 < 0$. Le théorème des valeurs intermédiaires place donc un zéro du cosinus dans $]0, 2[$, ce qui redonne $\pi < 4$.

        ```schema cx-pi
        Le graphe de $\cos$, en rouge, part de $\cos 0 = 1$ et passe sous l'axe avant $x = 2$ : la somme des trois premiers termes, $1 - \frac{x^2}{2} + \frac{x^4}{24}$, en bleu pointillé, vaut $-\frac13$ en $2$, et le regroupement des termes suivants place $\cos 2$ en dessous. Le premier point où la courbe rouge coupe l'axe est $\frac\pi2$.
        ```

        C'est par ce calcul que les exposés qui construisent la trigonométrie par l'exponentielle complexe définissent $\pi$, comme le double du plus petit zéro strictement positif du cosinus. Le point (i) montre que cette définition et celle de l'analyse réelle, par l'aire sous la courbe de $\frac{1}{1 + t^2}$, donnent le même nombre.
      - |
        Numériquement, le plus petit zéro positif de $\cos$ vaut $1{,}5707963\ldots$, d'où $\pi = 3{,}14159265\ldots$ On retrouve la constante d'Archimède, définie sans aucune géométrie ; le point (ii) en fait la demi-période de $t \mapsto \exp(it)$.
      - |
        Le point (iii) identifie le cercle unité du plan à $\mathbb R/2\pi\mathbb Z$, comme le faisait déjà, sans nombres complexes, le nœud {{tg-cercle|Paramétrage du cercle}}, (iv) ; ce quotient est homéomorphe au cercle $\mathbb R/\mathbb Z$ de la {{topalg|topologie algébrique}} par $t \mapsto 2\pi t$. La fonction « argument » $\theta$ existe localement, mais pas continûment sur tout le cercle ({{ta-consequences|Conséquences}}).

  - id: cx-integrale-chemin
    etiquette: Intégrale curviligne
    nature: proposition
    titre: Intégrale le long d'un chemin
    texte: |
      Un [[chemin-c1-morceaux|chemin de classe $C^1$ par morceaux]] est une application continue $\gamma : [a, b] \to \lex{ensemble-complexes}{\mathbb C}$ dont la restriction à chaque segment $[t_{j-1}, t_j]$ d'une subdivision $a = t_0 < \cdots < t_m = b$ est dérivable, de dérivée continue, les dérivées aux extrémités étant prises à droite ou à gauche.

      Pour $f$ continue sur l'image de $\gamma$, l'[[integrale-curviligne|intégrale curviligne]] est
      $$\int_\gamma f = \int_a^b f(\gamma(t))\,\gamma'(t)\,dt,$$
      somme des intégrales sur les morceaux ; la [[longueur-chemin|longueur]] de $\gamma$ est $L(\gamma) = \int_a^b |\gamma'|$.
    enonce: |
      (i) Pour $h : [a, b] \to \mathbb C$ continue, $\big|\int_a^b h\big| \leqslant \int_a^b |h|$. Par suite, $\big|\int_\gamma f\big| \leqslant L(\gamma)\sup_\gamma |f|$.

      (ii) Si $F$ est holomorphe sur un ouvert contenant l'image de $\gamma$, de dérivée $f = F'$ continue, alors $\int_\gamma f = F(\gamma(b)) - F(\gamma(a))$ ; en particulier, $\int_\gamma f = 0$ si $\gamma$ est fermé.

      (iii) Pour le cercle $C(c, r) : t \mapsto c + r\exp(it)$, $t \in [0, 2\pi]$, on a $\int_{C(c,r)} \frac{dz}{z - c} = 2i\pi$, et $\int_{C(c,r)} (z - c)^n\,dz = 0$ pour tout entier $n \neq -1$.
    preuve: |
      (i) Écrivons $\int h = \rho\exp(i\theta)$ avec $\rho \geqslant 0$ ({{cx-pi|Le nombre π}}). Alors $\rho = \exp(-i\theta)\int h = \int \exp(-i\theta) h$ est réel, donc égal à sa [[partie-reelle|partie réelle]] $\int \operatorname{Re}(\exp(-i\theta)h) \leqslant \int |h|$. On applique ceci à $h = (f \circ \gamma)\gamma'$.

      (ii) Sur chaque morceau, $(F \circ \gamma)' = (f \circ \gamma)\gamma'$ ({{cx-holomorphe|Fonctions holomorphes}}), et l'on applique (iv) du nœud {{cx-convergence-uniforme|Convergence uniforme}} ; les termes intermédiaires se télescopent.

      (iii) $\gamma'(t) = ir\exp(it)$, donc
      $$\int \frac{dz}{z - c} = \int_0^{2\pi} \frac{ir\exp(it)}{r\exp(it)}\,dt = 2i\pi.$$
      Pour $n \neq -1$, $(z - c)^n$ a pour primitive $(z - c)^{n+1}/(n + 1)$, holomorphe hors de $c$, et le chemin est fermé.

      ```schema cx-integrale-chemin
      En chaque point $\gamma(t)$ du cercle, la vitesse $\gamma'(t) = ir\exp(it)$, en rouge, est le rayon $\gamma(t) - c$, en bleu, multiplié par $i$ : même longueur $r$, tournée d'un quart de tour dans le sens direct. Le quotient $\gamma'(t)/(\gamma(t) - c)$ vaut donc $i$ en tout point, et l'intégrale est $i$ fois la longueur $2\pi$ de l'intervalle des paramètres.
      ```
    remarques:
      - |
        Le point (iii) montre que $1/z$ n'a pas de primitive holomorphe sur $\mathbb C \setminus \{0\}$ : sinon son intégrale sur le cercle serait nulle. C'est la version analytique de l'absence d'« angle continu » de la {{ta-consequences|topologie algébrique}} : une primitive de $1/z$ serait un logarithme, dont la partie imaginaire serait un argument continu.
      - |
        Le nombre $\frac{1}{2i\pi}\int_\gamma \frac{dz}{z - c}$ a un sens pour tout chemin fermé qui évite $c$ : c'est l'indice du chemin, entier qui compte ses tours autour de $c$, et (iii) dit qu'il vaut $1$ pour le cercle ({{rs-indice|Indice d'un lacet}}).

  - id: cx-goursat
    etiquette: Lemme de Goursat
    nature: théorème
    titre: Lemme de Goursat
    texte: |
      Pour trois points $a, b, c$, on note $T$ le triangle plein qu'ils engendrent et $\partial T$ le chemin fermé qui parcourt $[a, b]$, $[b, c]$, $[c, a]$.
    enonce: |
      (i) Si $f$ est holomorphe sur un ouvert $U$ contenant $T$, alors $\int_{\partial T} f = 0$.

      (ii) Le même résultat vaut si $f$ est seulement continue sur $U$ et holomorphe sur $U \setminus \{p\}$.
    preuve: |
      (i) Joignons les milieux des côtés : $T$ se découpe en quatre triangles de demi-taille, et $\int_{\partial T} f$ est la somme des quatre intégrales, les côtés intérieurs étant parcourus deux fois en sens opposés. L'une d'elles, notée $T_1$, vérifie $\big|\int_{\partial T_1} f\big| \geqslant \frac14\big|\int_{\partial T} f\big|$.

      En itérant, on obtient des triangles emboîtés $T_n$, de périmètre $L 2^{-n}$ et de [[diametre|diamètre]] $d\,2^{-n}$, avec
      $$\Big|\int_{\partial T} f\Big| \leqslant 4^n\Big|\int_{\partial T_n} f\Big|.$$
      Un sommet de chaque $T_n$ forme une suite de Cauchy, dont la limite $z_0$ appartient à tous les $T_n$, fermés ({{cx-suites|Suites et séries complexes}}).

      ```schema cx-goursat
      À gauche, $T$ est découpé par les milieux de ses côtés en quatre triangles parcourus dans le sens direct : chaque côté intérieur porte deux flèches opposées, et ses deux contributions se compensent. À droite, les triangles emboîtés $T_1 \supset T_2 \supset T_3 \supset T_4$ sont ceux que retient la règle de la preuve, en prenant chaque fois l'intégrale de plus grand module, pour la fonction non holomorphe $f(z) = \bar w\,(1 - |w|^2/16)$ avec $w = z - 2 - i$ ; ils se resserrent sur le point $z_0$.
      ```

      Écrivons $f(z) = f(z_0) + f'(z_0)(z - z_0) + (z - z_0)\varepsilon(z)$ ({{cx-holomorphe|Fonctions holomorphes}}). Les deux premiers termes ont une primitive, et leur intégrale sur $\partial T_n$ est nulle ({{cx-integrale-chemin|Intégrale curviligne}}).

      Soit $\eta > 0$, et $n$ assez grand pour que $|\varepsilon| \leqslant \eta$ sur $T_n$. Alors
      $$\Big|\int_{\partial T_n} f\Big| \leqslant L 2^{-n} \cdot d\,2^{-n} \cdot \eta,$$
      d'où $\big|\int_{\partial T} f\big| \leqslant Ld\eta$ pour tout $\eta > 0$.

      (ii) Si $p \notin T$, c'est (i). Si $p$ est un sommet, disons $p = a$, choisissons $b'$ sur $[a, b]$ et $c'$ sur $[a, c]$ proches de $a$ : $T$ se découpe en $[a, b', c']$, $[b', b, c]$ et $[b', c, c']$, dont les deux derniers ne contiennent pas $p$.

      ```schema cx-goursat-2
      Lorsque $p$ est le sommet $a$, les points $b'$ et $c'$ découpent $T$ en trois triangles de même orientation. Les deux grands ne contiennent pas $p$, et leur intégrale est nulle par (i) ; il ne reste que le petit triangle rouge, dont le périmètre tend vers $0$ quand $b'$ et $c'$ se rapprochent de $a$.
      ```

      L'intégrale sur $\partial T$ est donc celle sur le petit triangle, majorée par son périmètre fois $\sup_T |f|$, qui tend vers $0$. Si $p$ est sur un côté ou à l'intérieur, on découpe $T$ en deux ou trois triangles de sommet $p$.
    remarques:
      - |
        Goursat (« Sur la définition générale des fonctions analytiques, d'après Cauchy », *Trans. Amer. Math. Soc.* 1, 1900) a montré que l'on n'a pas besoin de supposer $f'$ continue, contrairement aux démonstrations antérieures : celle de Cauchy (1825), par déformation du chemin, et la sienne propre de 1884. La voie par la formule de Green, que Cauchy énonce sans démonstration en 1846 et que Riemann démontre en 1851, demande elle aussi cette continuité. Toute la théorie repose sur cet argument de découpage, proche de la preuve de Bolzano-Weierstrass par dichotomie ({{ar-bw|Bolzano-Weierstrass}}).

  - id: cx-cauchy-convexe
    etiquette: Cauchy, ouverts convexes
    nature: théorème
    titre: Théorème de Cauchy pour un ouvert convexe
    texte: |
      Une partie $C$ de $\mathbb C$ est [[partie-convexe-complexe|convexe]] si $(1 - t)a + tb \in C$ pour tous $a, b \in C$ et $t \in [0, 1]$ ; comme la bijection $a + ib \mapsto (a, b)$ de $\mathbb C$ sur $\mathbb R^2$ respecte la somme et la multiplication par un réel, cela revient à la [[partie-convexe|convexité]] de l'image de $C$ dans $\mathbb R^2$.
    enonce: |
      Soit $U$ un ouvert convexe, $p \in U$, et $f$ continue sur $U$, holomorphe sur $U \setminus \{p\}$. Alors $f$ a une primitive holomorphe sur $U$, et $\int_\gamma f = 0$ pour tout [[chemin-c1-morceaux|chemin fermé $C^1$ par morceaux]] de $U$.
    preuve: |
      Fixons $a \in U$ et posons $F(z) = \int_{[a, z]} f$, intégrale sur le segment de $a$ à $z$, contenu dans $U$ par convexité. Pour $z + h \in U$, le triangle de sommets $a, z, z + h$ est dans $U$, et le lemme de Goursat ({{cx-goursat|Lemme de Goursat}}) donne
      $$F(z + h) - F(z) = \int_{[z, z+h]} f.$$

      ```schema cx-cauchy-convexe
      Le triangle de sommets $a$, $z$, $z + h$ est contenu dans l'ouvert convexe $U$, et l'intégrale de $f$ sur son bord est nulle : le segment bleu, qui donne $F(z)$, suivi du côté rouge $[z, z + h]$, a la même intégrale que le segment vert, qui donne $F(z + h)$.
      ```

      Comme $\int_{[z, z+h]} f(z)\,dw = h f(z)$,
      $$\begin{aligned} &\Big|\frac{F(z + h) - F(z)}{h} - f(z)\Big| \\ &\quad = \frac{1}{|h|}\Big|\int_{[z, z+h]} \big(f(w) - f(z)\big)\,dw\Big| \\ &\quad \leqslant \sup_{w \in [z, z+h]} |f(w) - f(z)|, \end{aligned}$$
      qui tend vers $0$ par continuité de $f$ ({{cx-integrale-chemin|Intégrale curviligne}}). Donc $F' = f$, et l'intégrale sur un chemin fermé est nulle.
    remarques:
      - |
        La convexité sert à tracer les segments. Elle ne peut pas être supprimée : sur la couronne $\{1 < |z| < 3\}$, la fonction $1/z$ est holomorphe, mais son intégrale sur le cercle de rayon $2$ vaut $2i\pi$. Ce sont les « trous » de l'ouvert, mesurés par le {{ta-groupe-fondamental|groupe fondamental}}, qui font obstacle.
      - |
        Le théorème s'étend pourtant à la couronne sous une forme affaiblie : l'intégrale sur un cercle centré n'y dépend plus du rayon ({{rs-couronne|Cauchy sur une couronne}}). C'est le point de départ des séries de Laurent et du théorème des résidus, qui mesure exactement la contribution de chaque « trou » ponctuel ({{rs-theoreme|Théorème des résidus}}).

  - id: cx-formule-cauchy
    etiquette: Formule de Cauchy
    nature: théorème
    titre: Formule intégrale de Cauchy
    enonce: |
      Soit $f$ holomorphe sur un ouvert $U$ contenant le disque fermé $\overline D(c, r)$.

      (i) Il existe $s > 0$ tel que le disque ouvert $D(c, r + s)$ soit contenu dans $U$.

      (ii) Pour tout $z$ tel que $|z - c| < r$,
      $$f(z) = \frac{1}{2i\pi}\int_{C(c, r)} \frac{f(w)}{w - z}\,dw.$$
    preuve: |
      (i) Le disque fermé est compact ({{cx-suites|Suites et séries complexes}}) et contenu dans l'ouvert $U$. Considérons tous les disques ouverts $D(u, t)$ tels que $u \in \overline D(c, r)$, $t > 0$ et $D(u, 2t) \subset U$. Ils recouvrent le disque fermé, puisque chacun de ses points $u$ est le centre d'un disque ouvert contenu dans $U$. On en extrait un nombre fini, $D(u_1, t_1), \dots, D(u_n, t_n)$, qui le recouvrent encore, et l'on pose $s = \min_j t_j$ ; aucun choix n'intervient, puisque la famille est définie sans désigner un rayon pour chaque point.

      Si $|z - c| < r + s$, il existe un point $u$ du disque fermé avec $|z - u| < s$ : le point $z$ lui-même, ou $c + r\frac{z - c}{|z - c|}$. Ce point $u$ appartient à un $D(u_j, t_j)$, donc $|z - u_j| < t_j + s \leqslant 2t_j$, et $z \in U$.

      (ii) Soit $s$ comme en (i) ; le disque $D(c, r + s)$, contenu dans $U$, est [[partie-convexe-complexe|convexe]].

      *Le noyau.* Soit $g(w) = \frac{f(w) - f(z)}{w - z}$ pour $w \neq z$ et $g(z) = f'(z)$ : elle est continue sur $D(c, r + s)$ et holomorphe hors de $z$. Par le théorème de Cauchy convexe ({{cx-cauchy-convexe|Cauchy, ouverts convexes}}), $\int_{C(c,r)} g = 0$, d'où
      $$\int_{C(c,r)} \frac{f(w)}{w - z}\,dw = f(z)\int_{C(c,r)} \frac{dw}{w - z}.$$

      *Le calcul.* Pour $w$ sur le cercle,
      $$\frac{1}{w - z} = \frac{1}{w - c}\cdot\frac{1}{1 - q}$$
      avec $q = \frac{z - c}{w - c}$, de module $\frac{|z - c|}{r} < 1$ constant. La série géométrique converge donc uniformément sur le cercle ({{cx-convergence-uniforme|Convergence uniforme}}) :
      $$\frac{1}{w - z} = \sum_n \frac{(z - c)^n}{(w - c)^{n+1}}.$$

      En intégrant terme à terme, seul le terme $n = 0$ contribue ({{cx-integrale-chemin|Intégrale curviligne}}), et $\int_{C(c,r)} \frac{dw}{w - z} = 2i\pi$.

      ```schema cx-formule-cauchy
      Le cercle $C(c, r)$, parcouru dans le sens direct, et le disque convexe $D(c, r + s)$, en pointillé, sont contenus dans l'ouvert $U$. Pour $w$ sur le cercle, le quotient $q = \frac{z - c}{w - c}$ a pour module $\frac{|z - c|}{r}$, qui ne dépend pas de $w$ et reste $< 1$ : c'est ce qui rend uniforme la convergence de la série géométrique.
      ```

    remarques:
      - |
        La formule est saisissante : les valeurs de $f$ sur un cercle déterminent toutes ses valeurs à l'intérieur. Aucune fonction dérivable d'une variable réelle n'a de propriété comparable ; c'est la rigidité propre aux fonctions holomorphes.

  - id: cx-analytique
    etiquette: Analyticité
    nature: théorème
    titre: Les fonctions holomorphes sont analytiques
    enonce: |
      Soit $f$ holomorphe sur $U$ et $\overline D(c, r) \subset U$. Pour $|z - c| < r$,
      $$f(z) = \sum_{n \geqslant 0} c_n (z - c)^n,$$
      $$c_n = \frac{1}{2i\pi}\int_{C(c,r)} \frac{f(w)}{(w - c)^{n+1}}\,dw,$$
      et $|c_n| \leqslant M r^{-n}$, où $M = \sup_{C(c,r)} |f|$ ([[inegalites-cauchy|inégalités de Cauchy]]). En particulier, $f'$ est holomorphe, et $f$ est indéfiniment dérivable. Les coefficients sont $c_n = f^{(n)}(c)/n!$ ; ils ne dépendent donc pas de $r$.
    preuve: |
      Dans la formule de Cauchy ({{cx-formule-cauchy|Formule de Cauchy}}, (ii)), on remplace $\frac{1}{w - z}$ par la série géométrique
      $$\sum_n \frac{(z - c)^n}{(w - c)^{n+1}},$$
      qui converge uniformément sur le cercle ; multipliée par $f(w)$, bornée sur le cercle, elle converge encore uniformément, et l'on intègre terme à terme ({{cx-convergence-uniforme|Convergence uniforme}}).

      L'inégalité vient de (i) du nœud {{cx-integrale-chemin|Intégrale curviligne}} : la [[longueur-chemin|longueur]] du cercle est $2\pi r$, et $|f(w)/(w - c)^{n+1}| \leqslant M r^{-n-1}$.

      Les inégalités montrent que la suite $(c_n r^n)$ est bornée : la série entière $g(u) = \sum_n c_n u^n$ a un rayon au moins $r$, et $f(z) = g(z - c)$ sur $D(c, r)$. Une série entière est indéfiniment dérivable ({{cx-derivation-series|Dérivation terme à terme}}), et la translation $z \mapsto z - c$ ne change pas les taux d'accroissement ; donc $f$ est indéfiniment dérivable sur $D(c, r)$, avec $f^{(n)}(c) = g^{(n)}(0) = n!\,c_n$. Les coefficients ne dépendent donc pas de $r$.
    remarques:
      - |
        C'est le phénomène annoncé dans l'édifice : une fonction holomorphe, supposée seulement dérivable une fois au sens complexe, est automatiquement développable en série entière, donc indéfiniment dérivable. En analyse réelle, $x \mapsto x|x|$ est dérivable une fois sans l'être deux.

  - id: cx-liouville
    etiquette: Liouville
    nature: théorème
    titre: Théorème de Liouville et d'Alembert-Gauss
    texte: |
      Une **fonction entière** est une fonction holomorphe sur $\lex{ensemble-complexes}{\mathbb C}$ tout entier.
    enonce: |
      (i) *Liouville.* Une fonction entière bornée est constante.

      (ii) *D'Alembert-Gauss.* Tout [[polynome-constant|polynôme non constant]] de $\lex{anneau-polynomes}{\mathbb C[X]}$ a une [[racine-polynome|racine]] dans $\mathbb C$.
    preuve: |
      (i) Si $|f| \leqslant M$ sur $\mathbb C$, les [[inegalites-cauchy|inégalités de Cauchy]] ({{cx-analytique|Analyticité}}) en $c = 0$ donnent, les $c_n = f^{(n)}(0)/n!$ ne dépendant pas de $r$, $|c_n| \leqslant M r^{-n}$ pour tout $r > 0$ ; pour $n \geqslant 1$, on fait tendre $r$ vers l'infini : $c_n = 0$. Le développement, valable sur tout disque, donc sur $\mathbb C$, se réduit à $f = c_0$.

      (ii) Soit $P = \sum_{k \leqslant d} a_k X^k$ avec $d \geqslant 1$ et $a_d \neq 0$, et supposons qu'il n'ait pas de racine. Pour
      $$|z| \geqslant \rho = \max\Big(1, \frac{2}{|a_d|}\sum_{k < d} |a_k|\Big),$$
      on a
      $$\begin{aligned} |P(z)| &\geqslant |a_d||z|^d - \sum_{k < d}|a_k||z|^{d-1} \\ &\geqslant \frac{|a_d|}{2}|z|^d \geqslant \frac{|a_d|}{2}. \end{aligned}$$

      Sur le disque fermé $\overline D(0, \rho)$, compact ({{cx-suites|Suites et séries complexes}}), la fonction continue $|P|$ atteint son minimum $m_0$ ({{tr-compacts|Compacts de ℝ}}, (iii)), qui est strictement positif puisque $P$ ne s'annule pas.

      Ainsi $|P|$ est minorée sur $\mathbb C$ par $m = \min\big(m_0, \frac{|a_d|}{2}\big) > 0$, et $1/P$ est entière et bornée par $1/m$ ; par (i), elle est constante, donc $P$ aussi : contradiction.
    remarques:
      - |
        Le théorème de d'Alembert-Gauss, admis au nœud {{c-dalembert|D'Alembert-Gauss}} de la branche ℂ, est ainsi démontré, avec ses deux conséquences. Il ne pouvait l'être plus tôt dans l'atlas : il fallait la compacité des disques et la formule de Cauchy, qui viennent toutes deux de l'analyse.
    admis:
      - lieu: remarque
        statut: cite
        objet: Théorème de d'Alembert-Gauss, démontré ici
        renvoi: c-dalembert

  - id: cx-zeros-isoles
    etiquette: Zéros isolés
    nature: théorème
    titre: Principe des zéros isolés
    enonce: |
      Soit $U$ un ouvert [[connexe]] et $f$ holomorphe sur $U$, non identiquement nulle. Les zéros de $f$ sont isolés : chaque zéro $a$ a un voisinage où $f$ ne s'annule qu'en $a$. Par suite, deux fonctions holomorphes sur $U$ qui coïncident sur une partie ayant un [[point-accumulation|point d'accumulation]] dans $U$ sont égales. On appelle point d'accumulation d'une partie $A$ un point $a$ tel que tout disque $D(a, \rho)$ contienne un point de $A$ distinct de $a$.
    preuve: |
      Soit $A$ l'ensemble des points de $U$ où toutes les dérivées $f^{(n)}$, $n \geqslant 0$, s'annulent. Il est fermé dans $U$, comme intersection des fermés $(f^{(n)})^{-1}(\{0\})$, les dérivées étant continues ({{cx-analytique|Analyticité}}).

      Il est ouvert : si $c \in A$, le développement de $f$ sur un disque centré en $c$ a tous ses coefficients nuls, puisque ce sont les $f^{(n)}(c)/n!$ ({{cx-analytique|Analyticité}}), et $f$ est nulle sur ce disque, ainsi que ses dérivées. $U$ étant connexe et $f$ non identiquement nulle, $A$ est vide ({{t-connexe|Connexité}}).

      Soit $a$ un zéro de $f$, et $k$ le plus petit entier tel que $f^{(k)}(a) \neq 0$, qui existe puisque $a \notin A$. Les coefficients $c_n = f^{(n)}(a)/n!$ du développement de $f$ en $a$ sont nuls pour $n < k$, et, sur un disque centré en $a$, $f(z) = (z - a)^k g(z)$ avec
      $$g(z) = \sum_{n \geqslant k} c_n (z - a)^{n - k},$$
      somme d'une série entière qui a le même rayon que celle de $f$, puisque $c_n \rho^{n-k} = \rho^{-k} c_n \rho^n$ pour $\rho > 0$, donc continue sur le disque ({{cx-series-entieres|Séries entières}}, (ii)), et non nulle en $a$ puisque $g(a) = c_k$ ; elle est donc non nulle au voisinage de $a$. Ainsi $f$ ne s'annule qu'en $a$ près de $a$.

      Pour la seconde affirmation, soient $f_1$ et $f_2$ les deux fonctions ; on applique ce qui précède à leur différence $h = f_1 - f_2$. Elle s'annule sur la partie considérée, donc aussi, par continuité, en son point d'accumulation $a \in U$ ; et ce zéro $a$ n'est pas isolé, puisque tout voisinage de $a$ contient d'autres points de la partie. Par la première affirmation, $h$ est identiquement nulle.

      ```schema cx-zeros-isoles
      La fonction $f(z) = \exp(2i\pi/z) - 1$ est holomorphe sur l'ouvert connexe $U = \mathbb C \setminus \{0\}$, et ses zéros sont les points $\pm\frac1n$, puisque $\exp w = 1$ exactement pour $w \in 2i\pi\mathbb Z$. Chacun est isolé, comme le montrent, pour les six premiers, les disques bleus qui n'en contiennent qu'un, mais ils s'accumulent en $0$, hors de $U$ : $f$ coïncide avec la fonction nulle sur une partie infinie sans être nulle, et le point d'accumulation doit donc être pris dans $U$.
      ```
    remarques:
      - |
        Une fonction holomorphe sur un ouvert connexe est donc déterminée par ses valeurs sur n'importe quel petit segment. C'est ce qui justifie que $\exp$, $\cos$, $\sin$ soient les seuls prolongements holomorphes possibles des fonctions réelles du même nom. En analyse réelle, au contraire, une fonction indéfiniment dérivable peut être nulle sur $]{-\infty}, 0]$ sans l'être partout.
      - |
        L'entier $k$ de la démonstration est l'ordre du zéro $a$. Le chapitre {{anc-residus|Théorème des résidus}} en fait un objet d'étude ({{rs-singularites|Singularités isolées}}) : le principe de l'argument compte les zéros d'une fonction, chacun avec son ordre, par une intégrale, et le théorème de Rouché en déduit leur nombre dans un disque sans les calculer.

  - id: anc-residus
    etiquette: Résidus
    nature: chapitre
    titre: Théorème des résidus
    sous: anc-residus
    texte: |
      Une fonction holomorphe sur une couronne $\{r_1 < |z - c| < r_2\}$ se développe en série de Laurent, somme d'une série entière en $z - c$ et d'une série entière en $\frac{1}{z - c}$. Près d'un point où elle n'est pas définie, ce développement classe la singularité : fausse, quand la fonction se prolonge, ce qui arrive dès qu'elle est bornée (Riemann) ; pôle, quand son module tend vers l'infini ; essentielle sinon, et l'image de tout petit disque épointé est alors dense (Casorati-Weierstrass).

      Le coefficient de $\frac{1}{z - c}$ est le résidu. Le théorème des résidus calcule l'intégrale d'une fonction holomorphe sur un ouvert convexe privé d'un nombre fini de points, le long d'un lacet qui les évite, comme $2i\pi$ fois la somme des résidus pondérés par l'indice du lacet en chaque point, entier qui compte ses tours. Il en découle le principe de l'argument, le théorème de Rouché, qui localise les racines d'un polynôme, et le calcul d'intégrales réelles. La version homologique, pour un ouvert quelconque, est énoncée en remarque et admise. Aucune forme du choix n'intervient.
    admis:
      - lieu: texte
        statut: cite
        objet: Forme homologique du théorème des résidus
        renvoi: rs-theoreme

  - id: anc-conforme
    etiquette: Représentation conforme
    nature: chapitre
    titre: Représentation conforme
    sous: anc-conforme
    texte: |
      Le module d'une fonction holomorphe non constante sur un ouvert connexe n'a pas de maximum local : c'est le principe du maximum, conséquence de la formule de Cauchy, qui donne sur le disque unité le lemme de Schwarz, puis la liste des automorphismes du disque. Par le théorème de Rouché, une fonction holomorphe non constante sur un ouvert connexe est ouverte, et une fonction holomorphe injective est biholomorphe sur son image.

      Les inégalités de Cauchy rendent normale toute famille localement bornée de fonctions holomorphes : de toute suite on extrait une suite qui converge uniformément sur tout compact (théorème de Montel), et le théorème de Hurwitz contrôle les zéros des limites. Ces outils démontrent le théorème de représentation conforme de Riemann : un ouvert connexe non vide, distinct de $\mathbb C$, dans lequel toute fonction holomorphe sans zéro a une racine carrée holomorphe, est biholomorphe au disque unité. La démonstration suit l'itération de Koebe par racines carrées, qui n'utilise aucune forme du choix ; la simple connexité, notion de la topologie algébrique, n'est évoquée qu'en remarque.

