# Niveau 2 : structure interne du chapitre « β et récurrence dans PA » (nœud cal-beta-pa du graphe calc, après
# cal-peano). Deuxième des quatre sous-lots qui démontreront la formule naturelle de démontrabilité et les
# conditions (D2), (D3) dans PA (point (ii) de l-incompletude, levé au dernier, cal-sigma-pa) : bornes
# strictes ; multiple commun sans factorielle et modules 1 + (i + 1)b deux à deux étrangers sans nombres premiers ;
# graphe de β, Δ₀ et fonctionnel dans PA ; lemme chinois pour une famille bornée de modules et prolongement d'une
# suite codée par β ; définitions fonctionnelles des fonctions primitives récursives (formules de cal-rp-forme-sigma),
# PA démontre l'existence, l'unicité et les équations de définition ; fonctions usuelles (addition, multiplication,
# prédécesseur, soustraction tronquée, sg, sommes et produits bornés) ; formule naturelle d'une relation primitive
# récursive et clauses de clôture de cal-pr-cloture démontrées dans PA.
# Tout est démontré dans le système de l-deduction, avec les règles de cal-rp-calcul et de cal-pa-recurrence.
# Aucune forme de l'axiome du choix. Identifiants « cal-bp- ».

graphe: cal-beta-pa
titre: β et récurrence dans PA
conteneur: cal-beta-pa

entrees:
  cal-peano: [cal-bp-modules]

noeuds:
  - id: cal-bp-modules
    etiquette: Modules de Gödel
    nature: lemme
    titre: Bornes strictes, multiples communs et modules de Gödel dans l'arithmétique de Peano
    texte: |
      Les conventions sont celles de {{cal-pa-ordre|Ordre dans PA}} et de {{cal-pa-bezout|Bézout, lemme chinois}} : $\Gamma$ est un ensemble fini de formules, $\Gamma \vdash_{\mathsf{PA}} \varphi$ signifie $\mathsf{PA} \cup \Gamma \vdash \varphi$, et l'on raisonne par chaînes d'égalités, avec les lois de {{cal-pa-lois|Lois de + et ×}}. Dans les énoncés, les variables liées des formules $t \leqslant u$, $t \mid u$, $t \equiv u \pmod m$, $t \perp u$ et des bornes ne figurent dans aucun des termes ; dans les preuves, les lettres $a$, $c$, $d$, $e$, $g$ désignent des variables qui ne figurent nulle part ailleurs.

      Pour une formule $\varphi$, une variable $x$ et un terme $t$ où ne figurent ni $x$ ni la variable liée $z$ de la borne, on note $\forall x < t\ \varphi$ la formule $\forall x \leqslant t\ (x = t \vee \varphi)$, et $\exists x < t\ \varphi$ la formule $\neg\forall x < t\ \neg\varphi$. C'est l'écriture qu'emploie déjà, pour la minimisation et pour la récurrence primitive, le point (ii) de {{cal-rp-forme-sigma|Forme Σ₁ des r.e.}} : comme $x = t$ est atomique, $\forall x < t\ \varphi$ est une formule Δ₀ si $\varphi$ en est une, et une formule de la classe $\mathcal S$ de ce nœud si $\varphi$ y est. Dans $\mathcal N$, elle dit que $\varphi$ est satisfaite pour toute valeur de $x$ strictement inférieure à celle de $t$.

      Pour des termes $b$ et $i$, on note $m(b, i)$ le terme $S(S\,i \times b)$, dont la valeur dans $\mathcal N$ est $1 + (i + 1)b$, le module de la {{cal-beta|fonction β}}. Par $\mathrm Q_1$, on a $\vdash_{\mathsf{PA}} \neg(m(b, i) = 0)$, et le point (i) de {{cal-pa-lois|Lois de + et ×}} donne $\vdash_{\mathsf{PA}} m(b, i) = S\,i \times b + S\,0$. Pour des termes $b$ et $n$, on note enfin $K(b, n)$ la formule $\forall k \leqslant n\ (k = 0 \vee k \mid b)$, où $k$ ne figure ni dans $b$ ni dans $n$ : dans $\mathcal N$, elle dit que tout entier non nul au plus égal à $n$ divise $b$.
    enonce: |
      (i) **Bornes strictes.** Soit $\varphi$ une formule, $x$ une variable et $t$ un terme où ne figurent ni $x$ ni $z$.

      (a) Si $x$ n'est libre dans aucune formule de $\Gamma$ et si $\Gamma \cup \{x < t\} \vdash_{\mathsf{PA}} \varphi$, alors $\Gamma \vdash_{\mathsf{PA}} \forall x < t\ \varphi$. En particulier, $\vdash_{\mathsf{PA}} \forall x < 0\ \varphi$.

      (b) Si $u$ est un terme substituable à $x$ dans $\varphi$ et ne contient pas $z$, alors $\vdash_{\mathsf{PA}} \forall x < t\ \varphi \to (u < t \to \varphi[u/x])$.

      (c) Si $t$ est substituable à $x$ dans $\varphi$, alors $\vdash_{\mathsf{PA}} \forall x < S\,t\ \varphi \leftrightarrow \big(\forall x < t\ \varphi \wedge \varphi[t/x]\big)$.

      (ii) **Multiple commun.** Pour toutes variables distinctes $M$ et $b$,
      $$\vdash_{\mathsf{PA}} \exists b\, \big(\neg(b = 0) \wedge K(b, M)\big).$$

      (iii) **Modules étrangers.** Pour toutes variables distinctes $b$, $n$, $i$ et $j$,
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\big(K(b, n) \wedge i < j \wedge j \leqslant n\big) \\ &\to m(b, i) \perp m(b, j). \end{aligned}$$
    preuve: |
      (i) (a) Raisonnons sous les hypothèses de $\Gamma$ et sous $x \leqslant t$. Sous l'hypothèse supplémentaire $x = t$, la disjonction $x = t \vee \varphi$ est immédiate. Sous l'hypothèse $\neg(x = t)$, la première équivalence du point (v) de {{cal-pa-ordre|Ordre dans PA}} donne $x < t$, puis $\varphi$ par hypothèse, et encore $x = t \vee \varphi$. Le raisonnement par cas, sur la tautologie $x = t \vee \neg(x = t)$, donne $\Gamma \cup \{x \leqslant t\} \vdash_{\mathsf{PA}} x = t \vee \varphi$, et le point (vii) (b) du même nœud donne $\Gamma \vdash_{\mathsf{PA}} \forall x < t\ \varphi$, puisque $x$ n'est libre dans aucune formule de $\Gamma$. Pour la borne $0$, l'hypothèse $x < 0$ contredit $\neg(x < 0)$, point (v) du même nœud, et l'instance $P \to (\neg P \to Q)$ donne $\varphi$.

      (b) Le terme $u$ est substituable à $x$ dans $x = t \vee \varphi$, et $(x = t \vee \varphi)[u/x]$ est $u = t \vee \varphi[u/x]$, puisque $x$ ne figure pas dans $t$. Le point (vii) (a) de {{cal-pa-ordre|Ordre dans PA}} donne donc $\vdash \forall x < t\ \varphi \to \big(u \leqslant t \to (u = t \vee \varphi[u/x])\big)$, et la première équivalence du point (v) donne $\vdash_{\mathsf{PA}} u < t \to (u \leqslant t \wedge \neg(u = t))$. L'instance $(A \to (B \to (C \vee D))) \to ((E \to (B \wedge \neg C)) \to (A \to (E \to D)))$ conclut.

      (c) Sous l'hypothèse $\forall x < S\,t\ \varphi$ et sous $x < t$, le point (v) de {{cal-pa-ordre|Ordre dans PA}} donne $x \leqslant t$, puis $x < S\,t$, et (b), avec le terme $x$, donne $\varphi$ ; comme $x$ n'est pas libre dans l'hypothèse, (a) donne $\forall x < t\ \varphi$. De $t \leqslant t$, le même point tire $t < S\,t$, et (b), avec le terme $t$, donne $\varphi[t/x]$. Réciproquement, sous les hypothèses $\forall x < t\ \varphi$, $\varphi[t/x]$ et $x < S\,t$, on a $x \leqslant t$. Si $x = t$, le remplacement d'un terme ({{cal-rp-calcul|Calcul à variables libres}}, (v)), appliqué à $\varphi$ avec les termes $t$ et $x$, et la symétrie de l'égalité donnent $\varphi$ ; sinon, $x < t$ et (b) donnent $\varphi$. La variable $x$ n'est libre ni dans $\forall x < t\ \varphi$ ni dans $\varphi[t/x]$, puisqu'elle ne figure pas dans $t$, et (a) conclut.

      (ii) Récurrence sur $M$, par le point (iii) de {{cal-pa-recurrence|Récurrence dans PA}}, avec $\Gamma$ vide ; on note $\psi$ la formule $\exists b\, (\neg(b = 0) \wedge K(b, M))$.

      *Cas $0$.* Par le point (vii) (d) de {{cal-pa-ordre|Ordre dans PA}}, $K(S\,0, 0)$ équivaut à $0 = 0 \vee 0 \mid S\,0$, qui découle de la réflexivité de l'égalité. Avec l'instance $\neg(S\,0 = 0)$ de $\mathrm Q_1$, l'introduction de l'existentiel, avec le terme $S\,0$, donne $\psi[0/M]$.

      *Pas.* Sous l'hypothèse $\psi$, l'élimination avec une variable nouvelle $c$ permet de supposer $\neg(c = 0)$ et $K(c, M)$. Par l'intégrité ({{cal-pa-lois|Lois de + et ×}}, (iv)), $c \times S\,M = 0$ donnerait $c = 0$ ou $S\,M = 0$, que l'hypothèse et $\mathrm Q_1$ excluent : donc $\neg(c \times S\,M = 0)$. Par le point (i) de {{cal-pa-bezout|Bézout, lemme chinois}}, $k \mid c \to k \mid c \times S\,M$, d'où $(k = 0 \vee k \mid c) \to (k = 0 \vee k \mid c \times S\,M)$, et le point (vii) (e) de {{cal-pa-ordre|Ordre dans PA}} donne $K(c \times S\,M, M)$. Enfin $S\,M \mid c \times S\,M$, avec le témoin $c$. Le point (vii) (d) réunit ces deux formules en $K(c \times S\,M, S\,M)$, et l'introduction de l'existentiel, avec le terme $c \times S\,M$, donne $\psi[S\,M/M]$. On élimine $c$, qui n'est libre ni dans $\psi$ ni dans la conclusion, et le théorème de la déduction décharge l'hypothèse de récurrence.

      (iii) Écrivons $m_i$ et $m_j$ pour $m(b, i)$ et $m(b, j)$, et raisonnons sous les trois hypothèses, puis sous $d \mid m_i$ et $d \mid m_j$, pour une variable $d$ nouvelle.

      *Une différence.* L'élimination de $i < j$, c'est-à-dire de $S\,i \leqslant j$, avec un témoin $a$ donne $a + S\,i = j$. Les chaînes
      $$\begin{aligned} S\,j \times b &= S(a + S\,i) \times b \\ &= (S\,a + S\,i) \times b \\ &= S\,a \times b + S\,i \times b, \\ m_j &= S(S\,a \times b + S\,i \times b) \\ &= S\,a \times b + S(S\,i \times b) \\ &= m_i + S\,a \times b \end{aligned}$$
      emploient la congruence, le point (i) de {{cal-pa-lois|Lois de + et ×}}, la distributivité, $\mathrm Q_5$ et la commutativité. Par le point (i) de {{cal-pa-bezout|Bézout, lemme chinois}}, $d \mid m_i + S\,a \times b$ et $d \mid m_i$ donnent $d \mid S\,a \times b$.

      *L'entier $d$ est étranger à $b$.* Sous les hypothèses $e \mid d$ et $e \mid b$, pour une variable $e$ nouvelle, la transitivité de la divisibilité donne $e \mid m_i$, et $e \mid b$ donne $e \mid b \times S\,i$, c'est-à-dire $e \mid S\,i \times b$ par la commutativité et le remplacement. Comme $m_i = S\,i \times b + S\,0$, le point (i) de {{cal-pa-bezout|Bézout, lemme chinois}} donne $e \mid S\,0$, puis $e = S\,0$. Le théorème de la déduction décharge $e \mid d$ et $e \mid b$, et la généralisation en $e$, qui n'est libre dans aucune des hypothèses restantes, donne $d \perp b$, donc $b \perp d$ par la symétrie établie au nœud {{cal-pa-bezout|Bézout, lemme chinois}}. De plus $\neg(d = 0)$ : sinon $0 \mid m_i$ donnerait $m_i = 0$, contraire à $\mathrm Q_1$.

      *L'entier $d$ divise $S\,a$, puis $b$.* La commutativité donne $d \mid b \times S\,a$, et le lemme d'Euclide ({{cal-pa-bezout|Bézout, lemme chinois}}, (iv)), appliqué aux termes $b$, $S\,a$ et au module $d$, donne $d \mid S\,a$. La chaîne $i + S\,a = S(i + a) = S(a + i) = a + S\,i = j$ donne $S\,a \leqslant j$, avec le témoin $i$, puis $S\,a \leqslant n$ par la transitivité. Le point (vii) (a) de {{cal-pa-ordre|Ordre dans PA}}, appliqué à $K(b, n)$ avec le terme $S\,a$, donne $S\,a = 0 \vee S\,a \mid b$, et $\mathrm Q_1$ exclut le premier cas. La transitivité donne $d \mid b$, puis $d \mid S\,i \times b$ comme ci-dessus.

      *Conclusion.* De $d \mid S\,i \times b + S\,0$ et $d \mid S\,i \times b$, le point (i) de {{cal-pa-bezout|Bézout, lemme chinois}} tire $d \mid S\,0$, puis $d = S\,0$. On élimine $a$, qui n'est libre ni dans les hypothèses ni dans $d = S\,0$ ; le théorème de la déduction décharge $d \mid m_i$ et $d \mid m_j$, et la généralisation en $d$, qui n'est libre dans aucune des trois hypothèses, donne $m_i \perp m_j$.
    remarques:
      - |
        La preuve du lemme de la {{cal-beta|fonction β}} prend pour $b$ une factorielle et raisonne sur un nombre premier qui diviserait deux modules. Ni l'une ni l'autre notion n'est ici disponible, et l'erreur la plus répandue serait d'écrire $b = M!$ : la factorielle n'est pas un symbole du langage de $\mathsf{PA}$, et l'écrire par une formule demanderait de coder des suites, c'est-à-dire la fonction $\beta$ elle-même, que ce chapitre met en place. Le point (ii) n'affirme que l'existence d'un multiple commun ; dans $\mathcal N$, le témoin que construit sa récurrence est d'ailleurs $1 \times 1 \times 2 \times \cdots \times M$, c'est-à-dire $M!$, mais $\mathsf{PA}$ n'a jamais à nommer cette fonction. De même, le point (iii) remplace le nombre premier par le lemme d'Euclide pour des étrangers, qui ne parle que de diviseurs communs.
      - |
        L'hypothèse $K(b, n)$ ne peut pas être omise. Pour $b = 1$ et $n = 2$, les modules sont $2$, $3$ et $4$, et $m(1, 0) = 2$ divise $m(1, 2) = 4$ ; l'entier $2$, qui ne divise pas $b$, est la différence $j - i$ qui échappe à l'hypothèse. Un calcul sur tous les $b \leqslant 60$ et $n \leqslant 6$ confirme que les modules sont deux à deux étrangers dès que $K(b, n)$ est vraie. L'hypothèse est suffisante sans être nécessaire : pour $b = 6$ et $n = 4$, l'entier $4$ ne divise pas $b$, et pourtant les modules $7$, $13$, $19$, $25$ et $31$ sont deux à deux étrangers ; c'est la forme dont la preuve a besoin, parce que $j - i$ y parcourt tous les entiers de $1$ à $n$.
      - |
        On ne peut pas écrire la borne stricte $\forall x \leqslant t - 1$ : le langage n'a pas de soustraction, et la formule $\forall x \leqslant t\ (x = t \vee \varphi)$ en tient lieu, comme au nœud {{cal-rp-forme-sigma|Forme Σ₁ des r.e.}}. Le point (i) (c) est l'outil de récurrence sur la borne de ce chapitre : il ajoute un indice à la fois, comme le point (vii) (d) de {{cal-pa-ordre|Ordre dans PA}} pour les bornes larges.

  - id: cal-bp-beta
    etiquette: Graphe de β dans PA
    nature: proposition
    titre: Le graphe de la fonction β, formule Δ₀ fonctionnelle dans l'arithmétique de Peano
    texte: |
      Les conventions sont celles de {{cal-bp-modules|Modules de Gödel}}. Soit $a$, $b$, $i$ et $u$ des variables distinctes. On reprend la formule $B(a, b, i, u)$ de {{cal-rp-forme-sigma|Forme Σ₁ des r.e.}},
      $$\begin{aligned} &\exists q\ \exists r\ \big(a = q \times m(b, i) + u \\ &\qquad \wedge r + u = S\,i \times b\big), \end{aligned}$$
      où $q$ et $r$ sont des variables distinctes, différentes de $a$, $b$, $i$ et $u$ ; elle est dans la classe $\mathcal S$ de ce nœud, qui montre qu'elle définit dans $\mathcal N$ le [[graphe-application|graphe]] de la [[fonction-beta|fonction β]] : $u$ est le reste de la division de $a$ par $1 + (i + 1)b$. Pour des termes $a'$, $b'$, $t$, $s$ où ne figurent ni $q$ ni $r$, on note $B(a', b', t, s)$ la formule obtenue en leur substituant simultanément $a$, $b$, $i$ et $u$ ({{cal-rp-calcul|Calcul à variables libres}}) ; les théorèmes ci-dessous valent alors pour elle, par le point (iv) de {{cal-pa-recurrence|Récurrence dans PA}}.

      On note $B_0(a, b, i, u)$ la formule
      $$\begin{aligned} &\exists q \leqslant a\ \big(a = q \times m(b, i) + u\big) \\ &\wedge \exists r \leqslant S\,i \times b\ (r + u = S\,i \times b), \end{aligned}$$
      où les quantifications bornées sont celles de {{cal-rp-sigma1|Σ₁-complétude}}, avec des variables liées de borne distinctes de toutes les autres. Ses [[formule-atomique|formules atomiques]] sont des égalités, ses bornes $a$ et $S\,i \times b$ ne contiennent ni $q$ ni $r$, et la conjonction et la quantification existentielle bornée abrègent des formules écrites avec $\neg$, $\to$ et $\forall q \leqslant a$, $\forall r \leqslant S\,i \times b$ : c'est une [[formule-delta0|formule Δ₀]].
    enonce: |
      Soit $a$, $b$, $i$, $u$, $u'$ et $c$ des variables distinctes, différentes de $q$, de $r$ et des variables liées des bornes.

      (i) **Forme Δ₀.** $\vdash_{\mathsf{PA}} B(a, b, i, u) \leftrightarrow B_0(a, b, i, u)$.

      (ii) **Fonctionnalité.** $\vdash_{\mathsf{PA}} \exists u\, B(a, b, i, u)$ et
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\big(B(a, b, i, u) \wedge B(a, b, i, u')\big) \\ &\to u = u'. \end{aligned}$$

      (iii) **Bornes.** $\vdash_{\mathsf{PA}} B(a, b, i, u) \to (u \leqslant a \wedge u \leqslant S\,i \times b)$.

      (iv) **Reconnaissance d'un reste.**
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\big(c \equiv u \pmod{m(b, i)} \\ &\quad \wedge u \leqslant S\,i \times b\big) \to B(c, b, i, u). \end{aligned}$$
    preuve: |
      On écrit $m$ pour le terme $m(b, i)$, qui n'est pas nul par $\mathrm Q_1$. Par le point (v) de {{cal-pa-ordre|Ordre dans PA}}, $t < m$, qui est $t < S(S\,i \times b)$, équivaut à $t \leqslant S\,i \times b$ pour tout terme $t$. Une hypothèse $B(a, b, i, u)$ s'élimine, avec deux variables nouvelles $g$ et $e$, sous la forme $a = g \times m + u$ et $e + u = S\,i \times b$.

      (i) Sous les hypothèses $a = g \times m + u$ et $e + u = S\,i \times b$, le point (vi) de {{cal-pa-ordre|Ordre dans PA}}, avec $\neg(m = 0)$, donne $g \leqslant g \times m$, le point (i) donne $g \times m \leqslant g \times m + u$, et la transitivité et le remplacement donnent $g \leqslant a$. Le point (vii) (a) du même nœud, avec le terme $g$, donne $\exists q \leqslant a\ (a = q \times m + u)$. De même, $e \leqslant e + u$ et le remplacement donnent $e \leqslant S\,i \times b$, puis $\exists r \leqslant S\,i \times b\ (r + u = S\,i \times b)$. On élimine $e$ et $g$, ce qui donne $B \to B_0$. Réciproquement, le point (vii) (c) du même nœud ramène chacun des deux membres de $B_0$ à une formule $\exists q\, (q \leqslant a \wedge \cdots)$, et la monotonie de {{cal-pa-recurrence|Récurrence dans PA}}, (ii), donne $\exists q\, (a = q \times m + u)$ et $\exists r\, (r + u = S\,i \times b)$ ; sous les hypothèses $a = g \times m + u$ et $e + u = S\,i \times b$, deux introductions donnent $B$, et deux éliminations concluent.

      (ii) *Existence.* Le point (iii) de {{cal-pa-division|Plus petit élément, division}}, appliqué au terme $a$ et au module $m$, avec deux variables nouvelles, et l'élimination fournissent $g$ et $d$ tels que $g \times m + d = a$ et $d < m$. Alors $d \leqslant S\,i \times b$, et l'élimination fournit $e$ tel que $e + d = S\,i \times b$. Avec la symétrie de l'égalité, $a = g \times m + d$, et trois introductions de l'existentiel, avec les termes $e$, $g$ et $d$, donnent $\exists u\, B(a, b, i, u)$. On élimine $e$, $d$ et $g$.

      *Unicité.* Sous les hypothèses $B(a, b, i, u)$ et $B(a, b, i, u')$, l'élimination fournit $a = g \times m + u$, $e + u = S\,i \times b$, $a = g' \times m + u'$ et $e' + u' = S\,i \times b$. Les deux dernières égalités de chaque paire donnent $u \leqslant S\,i \times b$ et $u' \leqslant S\,i \times b$, donc $u < m$ et $u' < m$. La chaîne $g \times m + u = a = g' \times m + u'$ et l'unicité de la division ({{cal-pa-division|Plus petit élément, division}}, (iii)) donnent $u = u'$.

      (iii) Sous les hypothèses $a = g \times m + u$ et $e + u = S\,i \times b$, la symétrie donne $g \times m + u = a$, d'où $u \leqslant a$, avec le témoin $g \times m$, et $u \leqslant S\,i \times b$, avec le témoin $e$.

      (iv) L'élimination des hypothèses fournit $c + p \times m = u + p' \times m$ et $e + u = S\,i \times b$, pour des variables nouvelles $p$, $p'$ et $e$. Le point (iii) de {{cal-pa-division|Plus petit élément, division}}, appliqué au terme $c$ et au module $m$, fournit $g$ et $d$ tels que $g \times m + d = c$ et $d < m$. La chaîne
      $$\begin{aligned} &(g + p) \times m + d \\ &\quad = g \times m + d + p \times m \\ &\quad = c + p \times m \\ &\quad = u + p' \times m \\ &\quad = p' \times m + u, \end{aligned}$$
      avec $d < m$ et $u < m$, et l'unicité de la division donnent $d = u$. Alors $c = g \times m + u$ par le remplacement et la symétrie, et deux introductions, avec les termes $g$ et $e$, donnent $B(c, b, i, u)$. On élimine les variables introduites, qui ne figurent pas dans la conclusion.
    remarques:
      - |
        La clause $r + u = S\,i \times b$, qui dit $u < m$, est indispensable à l'unicité, et l'erreur la plus répandue est de la croire superflue parce que le reste « va de soi ». Sans elle, la formule $\exists q\, (a = q \times m + u)$ est satisfaite dans $\mathcal N$ par tous les $u \leqslant a$ congrus à $a$ modulo $m$ : pour $a = 7$, $b = 1$ et $i = 1$, donc $m = 3$, par $u = 1$, $u = 4$ et $u = 7$. Ce cas et la fonctionnalité de $B$ ont été vérifiés par un calcul exhaustif sur $a < 60$, $b < 8$, $i < 6$, ainsi que l'équivalence de $B$ et de $B_0$ dans $\mathcal N$.
      - |
        La seconde remarque du nœud {{cal-pa-division|Plus petit élément, division}} annonçait ce résultat : la formule $B$ définit une fonction aux yeux de $\mathsf{PA}$, et non seulement dans $\mathcal N$. Dans l'arithmétique de Robinson, il faut ajouter à une formule qui définit un graphe la clause du plus petit témoin pour obtenir une fonction, comme au nœud voisin {{cal-dg-fonctions|Représentation des fonctions}} ; ici l'unicité est un théorème, celui de la division euclidienne, et aucune clause n'est à ajouter. La forme Δ₀ du point (i) servira au chapitre suivant, où la complétude pour les énoncés Σ₁ sera établie à l'intérieur de $\mathsf{PA}$ par une récurrence sur la construction des formules Δ₀.

  - id: cal-bp-prolongement
    etiquette: Prolongement d'une suite
    nature: proposition
    titre: Lemme chinois borné et prolongement d'une suite codée par β dans l'arithmétique de Peano
    texte: |
      Les conventions sont celles de {{cal-bp-modules|Modules de Gödel}} et de {{cal-bp-beta|Graphe de β dans PA}}. Dans $\mathcal N$, un couple $(a, b)$ code la suite des valeurs $\beta(a, b, 0), \beta(a, b, 1), \dots$ ; le lemme de la {{cal-beta|fonction β}} dit que toute suite finie est ainsi codée. Une suite finie n'est pas un objet du langage de $\mathsf{PA}$, et ce lemme ne s'y écrit pas tel quel. Ce qui s'écrit, et que l'on démontre ici, c'est qu'une suite déjà codée peut être prolongée d'un terme arbitraire : c'est tout ce dont aura besoin la récurrence primitive.
    enonce: |
      (i) **Lemme chinois borné.** Soit $b$, $n$, $i$, $u$ et $c$ des variables distinctes, et $\theta$ une formule où $c$ ne figure pas. Alors
      $$\begin{aligned} \vdash_{\mathsf{PA}} \big(&K(b, n) \wedge \forall i \leqslant n\ \exists u\ \theta\big) \\ \to \exists c\ &\forall i \leqslant n\ \exists u\ \big(\theta \\ &\wedge c \equiv u \pmod{m(b, i)}\big). \end{aligned}$$

      (ii) **Prolongement.** Pour des variables distinctes $a$, $b$, $n$, $x$, $a'$, $b'$, $i$ et $u$, différentes des variables liées de $B$,
      $$\begin{aligned} \vdash_{\mathsf{PA}} \exists a'\, \exists b'\, \Big(&\forall i < n\ \forall u\ \big(B(a, b, i, u) \\ &\qquad \to B(a', b', i, u)\big) \\ &\wedge B(a', b', n, x)\Big). \end{aligned}$$
    preuve: |
      (i) Notons $\Gamma$ l'ensemble des deux hypothèses, $K(b, n)$ et $\forall i \leqslant n\ \exists u\ \theta$, écrivons $m_t$ pour $m(b, t)$, et soit $j$, $l$ et $P$ des variables nouvelles. Notons $A(j)$ la formule $\forall i < j\ \big(m_i \mid P \wedge \exists u\, (\theta \wedge c \equiv u \pmod{m_i})\big)$, $C(j)$ la formule $\forall l \leqslant n\ (l < j \vee P \perp m_l)$, et $L(j)$ la formule
      $$\begin{aligned} j \leqslant S\,n \to {}&\exists c\, \exists P\, \big(\neg(P = 0) \\ &\wedge A(j) \wedge C(j)\big). \end{aligned}$$
      Dans $\mathcal N$, $L(j)$ dit qu'un multiple commun $P$ des $j$ premiers modules, étranger à tous les suivants, et un entier $c$ qui réalise les $j$ premières congruences existent. Montrons $\Gamma \vdash_{\mathsf{PA}} L(j)$ par récurrence sur $j$, qui n'est pas libre dans $\Gamma$.

      *Cas $0$.* Prenons $c = 0$ et $P = S\,0$. On a $\neg(S\,0 = 0)$ par $\mathrm Q_1$, $A(0)$ par le point (i) (a) de {{cal-bp-modules|Modules de Gödel}}, et $S\,0 \perp m_l$, puisque $d \mid S\,0$ donne $d = S\,0$ ({{cal-pa-bezout|Bézout, lemme chinois}}, (i)) ; le point (vii) (b) de {{cal-pa-ordre|Ordre dans PA}} donne $C(0)$, et deux introductions donnent $L(0)$.

      *Pas.* Sous les hypothèses de $\Gamma$, $L(j)$ et $S\,j \leqslant S\,n$ : la formule $S\,j \leqslant S\,n$ est $j < S\,n$, qui équivaut à $j \leqslant n$ par le point (v) de {{cal-pa-ordre|Ordre dans PA}}, et le point (ii) donne $j \leqslant S\,n$. Le [[modus-ponens|modus ponens]] dans $L(j)$, puis l'élimination, fournissent $c_0$ et $P_0$ tels que $\neg(P_0 = 0)$, $A(j)$ et $C(j)$, écrites avec $c_0$ et $P_0$. Le point (vii) (a) de {{cal-pa-ordre|Ordre dans PA}}, appliqué à $C(j)$ avec le terme $j$, donne $j < j \vee P_0 \perp m_j$, et $\neg(j < j)$, qui découle de la dernière formule du point (v) et de $j \leqslant j$, donne $P_0 \perp m_j$. Le même point, appliqué à la seconde hypothèse de $\Gamma$ avec le terme $j$, et l'élimination fournissent $e$ tel que $\theta[j/i][e/u]$. Le lemme chinois pour deux modules ({{cal-pa-bezout|Bézout, lemme chinois}}, (v)), appliqué aux modules $P_0$ et $m_j$ et aux termes $c_0$ et $e$, fournit $c_1$ tel que $c_1 \equiv c_0 \pmod{P_0}$ et $c_1 \equiv e \pmod{m_j}$. Posons $P_1 = P_0 \times m_j$ ; par l'intégrité, $\neg(P_1 = 0)$.

      Montrons $A(S\,j)$ avec $c_1$ et $P_1$, par le point (i) (a) de {{cal-bp-modules|Modules de Gödel}}, sous l'hypothèse $i < S\,j$, qui donne $i \leqslant j$ par le point (v) de {{cal-pa-ordre|Ordre dans PA}}. Si $i = j$ : $m_j \mid P_1$, avec le témoin $P_0$, donne $m_i \mid P_1$ par le remplacement, et $\theta[e/u] \wedge c_1 \equiv e \pmod{m_i}$ s'obtient de $\theta[j/i][e/u]$ et de $c_1 \equiv e \pmod{m_j}$ par le remplacement d'un terme et la symétrie, puisque $\theta[j/i][e/u] = \theta[e/u][j/i]$ ; l'introduction, avec le terme $e$, donne le second membre. Si $\neg(i = j)$ : alors $i < j$, et le point (i) (b) du même nœud, appliqué à $A(j)$, donne $m_i \mid P_0$, donc $m_i \mid P_1$, et $\exists u\, (\theta \wedge c_0 \equiv u \pmod{m_i})$. Par le point (ii) de {{cal-pa-bezout|Bézout, lemme chinois}}, $m_i \mid P_0$ et $c_1 \equiv c_0 \pmod{P_0}$ donnent $c_1 \equiv c_0 \pmod{m_i}$, puis, par la transitivité, $c_0 \equiv u \pmod{m_i} \to c_1 \equiv u \pmod{m_i}$ ; cette dernière hypothèse ne contient pas $u$, et la monotonie de {{cal-pa-recurrence|Récurrence dans PA}}, (ii), donne $\exists u\, (\theta \wedge c_1 \equiv u \pmod{m_i})$.

      Montrons $C(S\,j)$ avec $P_1$. Sous l'hypothèse $l \leqslant n$ : si $l \leqslant j$, alors $l < S\,j$. Sinon, l'ordre total donne $j \leqslant l$, et $\neg(j = l)$, puisque $j = l$ donnerait $l \leqslant j$ par la réflexivité et le remplacement ; donc $j < l$ ; alors $\neg(l < j)$, et $C(j)$ donne $P_0 \perp m_l$. Le point (iii) de {{cal-bp-modules|Modules de Gödel}}, appliqué aux variables $j$ et $l$, donne $m_j \perp m_l$, et la seconde formule du lemme d'Euclide ({{cal-pa-bezout|Bézout, lemme chinois}}, (iv)), avec $\neg(m_l = 0)$, donne $P_0 \times m_j \perp m_l$. Dans les deux cas, $l < S\,j \vee P_1 \perp m_l$, et le point (vii) (b) de {{cal-pa-ordre|Ordre dans PA}} conclut.

      Deux introductions, avec les termes $c_1$ et $P_1$, donnent $\exists c\, \exists P\, (\neg(P = 0) \wedge A(S\,j) \wedge C(S\,j))$. On élimine $c_1$, $e$, $c_0$ et $P_0$, qui ne figurent pas dans cette formule, et le théorème de la déduction, qui décharge $S\,j \leqslant S\,n$, donne $\Gamma \cup \{L(j)\} \vdash_{\mathsf{PA}} L(S\,j)$. Le point (iii) de {{cal-pa-recurrence|Récurrence dans PA}} donne $\Gamma \vdash_{\mathsf{PA}} \forall j\, L(j)$.

      *Conclusion.* Le terme $S\,n$ est substituable à $j$ dans $L(j)$, et $S\,n \leqslant S\,n$ ; l'axiome (2) et l'élimination fournissent $c$ et $P$ tels que $A(S\,n)$. Sous l'hypothèse $i \leqslant n$, on a $i < S\,n$, et le point (i) (b) de {{cal-bp-modules|Modules de Gödel}} donne $\exists u\, (\theta \wedge c \equiv u \pmod{m_i})$ ; le point (vii) (b) de {{cal-pa-ordre|Ordre dans PA}} donne $\forall i \leqslant n\ \exists u\, (\theta \wedge c \equiv u \pmod{m_i})$, l'introduction de $\exists c$ conclut, et l'on élimine $P$.

      (ii) Soit $M$ le terme $n + a + x$. Par le point (i) de {{cal-pa-ordre|Ordre dans PA}} et la transitivité, $n \leqslant M$, $a \leqslant M$ et $x \leqslant M$. Le point (ii) de {{cal-bp-modules|Modules de Gödel}}, écrit avec une variable nouvelle à la place de $b$ et instancié par le terme $M$, et l'élimination fournissent $b_1$ tel que $\neg(b_1 = 0)$ et $K(b_1, M)$, et le point (vii) (e) de {{cal-pa-ordre|Ordre dans PA}}, avec $n \leqslant M$, donne $K(b_1, n)$.

      *Le multiple majore les valeurs.* On raisonne par cas sur $M = 0 \vee \neg(M = 0)$. Si $M = 0$, alors $M \leqslant b_1$ par le point (i) du même nœud. Sinon, le point (vii) (a), appliqué à $K(b_1, M)$ avec le terme $M$, donne $M \mid b_1$, et l'élimination fournit $g$ tel que $g \times M = b_1$ ; on a $\neg(g = 0)$, puisque $g = 0$ donnerait $b_1 = 0 \times M = 0$, et le point (vi) donne $M \leqslant M \times g = b_1$. Pour tout terme $t$, le même point donne $b_1 \leqslant b_1 \times S\,t$, et la transitivité donne $M \leqslant S\,t \times b_1$.

      *Les valeurs à réaliser.* Soit $\theta$ la formule $(i = n \wedge u = x) \vee (\neg(i = n) \wedge B(a, b, i, u))$. Sous l'hypothèse $i \leqslant n$ : si $i = n$, l'introduction avec le terme $x$ donne $\exists u\, \theta$ ; sinon, le point (ii) de {{cal-bp-beta|Graphe de β dans PA}} donne $\exists u\, B(a, b, i, u)$, et la monotonie, sous l'hypothèse $\neg(i = n)$ où $u$ n'est pas libre, donne $\exists u\, \theta$. Le point (vii) (b) donne $\forall i \leqslant n\ \exists u\, \theta$, et le point (i), appliqué à la variable $b_1$, fournit $c_1$ tel que $\forall i \leqslant n\ \exists u\, \big(\theta \wedge c_1 \equiv u \pmod{m(b_1, i)}\big)$.

      *Ce sont les valeurs de β.* Sous l'hypothèse $i \leqslant n$, le point (vii) (a) et l'élimination fournissent $e$ tel que $\theta[e/u]$ et $c_1 \equiv e \pmod{m(b_1, i)}$. Dans les deux cas de $\theta[e/u]$, on a $e \leqslant M$ : si $e = x$, par ce qui précède ; si $B(a, b, i, e)$, par le point (iii) de {{cal-bp-beta|Graphe de β dans PA}}, qui donne $e \leqslant a$. Donc $e \leqslant S\,i \times b_1$, et le point (iv) du même nœud donne $B(c_1, b_1, i, e)$.

      Pour $i < n$, sous l'hypothèse $B(a, b, i, u)$ : on a $i \leqslant n$ et $\neg(i = n)$, donc $B(a, b, i, e)$, et l'unicité du point (ii) du même nœud donne $u = e$, puis $B(c_1, b_1, i, u)$ par le remplacement. On élimine $e$, qui ne figure ni dans les hypothèses $i < n$ et $B(a, b, i, u)$ ni dans la conclusion ; le théorème de la déduction et la généralisation en $u$, qui n'est libre dans aucune hypothèse restante, donnent $\forall u\, (B(a, b, i, u) \to B(c_1, b_1, i, u))$, et le point (i) (a) de {{cal-bp-modules|Modules de Gödel}} donne la première formule de la conclusion, avec $c_1$ et $b_1$. Pour $i = n$, le même raisonnement, mené avec le terme $n$ et $n \leqslant n$, fournit $e$ tel que $\theta[n/i][e/u]$ et $B(c_1, b_1, n, e)$ ; la formule $\theta[n/i][e/u]$ donne $e = x$, puisque $\neg(n = n)$ est exclu, et le remplacement donne $B(c_1, b_1, n, x)$, formule où $e$ ne figure pas.

      Deux introductions, avec les termes $c_1$ et $b_1$, donnent la conclusion, et l'on élimine $c_1$ et $b_1$.
    remarques:
      - |
        La preuve suit celle du lemme de la {{cal-beta|fonction β}}, mais chaque objet y change de nature. Le produit $m_0 \cdots m_l$ des modules déjà traités, qui ne se nomme pas dans $\mathsf{PA}$, devient une variable $P$ dont la formule de récurrence garantit qu'elle est un multiple commun de ces modules et qu'elle est étrangère à chacun des suivants. Bézout dans $\mathbb Z$ devient le lemme chinois pour deux modules de {{cal-pa-bezout|Bézout, lemme chinois}}, sans entiers négatifs. L'erreur la plus répandue serait de faire porter la récurrence sur $j \leqslant n$ : la conclusion porte sur $n + 1$ modules, et c'est pourquoi la formule $L(j)$ est écrite sous l'hypothèse $j \leqslant S\,n$.
      - |
        Dans $\mathcal N$, pour $a = b = 1$, qui code la suite $(1)$ puisque $\beta(1, 1, 0) = 1$, et pour $n = 1$, $x = 2$, on trouve $M = 4$, et le multiple commun $b' = 24$ convient ; les modules sont $25$ et $49$, et $a' = 51$ donne $\beta(51, 24, 0) = 1$ et $\beta(51, 24, 1) = 2$. Ce calcul, et le prolongement par la méthode de la preuve pour tous les $a \leqslant 12$, $b \leqslant 4$, $n \leqslant 3$ et $x \leqslant 6$, ont été vérifiés par un programme. La croissance est rapide : $b'$ est un multiple de tous les entiers jusqu'à $n + a + x$, et $a$ majore déjà les termes de la suite qu'il code.

  - id: cal-bp-fonctions
    etiquette: Fonctions p.r. dans PA
    nature: théorème
    titre: Les fonctions primitives récursives dans l'arithmétique de Peano
    texte: |
      Les conventions sont celles de {{cal-bp-modules|Modules de Gödel}}, et $\mathcal S$ est la classe de {{cal-rp-forme-sigma|Forme Σ₁ des r.e.}}. On note $v$ une suite $v_1, \dots, v_n$ de variables distinctes, avec $n \geqslant 1$, et $\varphi[t/v]$ la substitution simultanée des termes $t_1, \dots, t_n$ de {{cal-rp-calcul|Calcul à variables libres}}.

      Soit $f : \mathbb N^n \to \mathbb N$ et $w$ une variable distincte des $v_k$. Une *définition fonctionnelle* de $f$ dans $\mathsf{PA}$, avec les variables $v_1, \dots, v_n, w$, est une formule $\varphi$ de $\mathcal S$, de variables libres parmi $v_1, \dots, v_n, w$, dans laquelle aucune de ces variables n'est quantifiée, et telle que :

      (a) $\varphi$ définit le [[graphe-application|graphe]] de $f$ dans $\mathcal N$ avec les variables $v_1, \dots, v_n, w$, au sens de {{cal-definissable|Définissabilité}} ;

      (b) $\vdash_{\mathsf{PA}} \exists w\, \varphi$ ;

      (c) $\vdash_{\mathsf{PA}} (\varphi \wedge \varphi[w'/w]) \to w = w'$ pour toute variable $w'$ qui ne figure pas dans $\varphi$.

      Pour des termes $t_1, \dots, t_n$ et $s$ dont aucune variable n'est quantifiée dans $\varphi$, on écrit $f(t_1, \dots, t_n) = s$ pour la formule $\varphi[t_1, \dots, t_n, s / v_1, \dots, v_n, w]$. C'est une notation attachée à la formule $\varphi$, et non à la seule fonction $f$ ; quand le contexte ne la précise pas, il s'agit d'une définition que fournit le point (vi) pour la construction fixée de $f$, et le point (vii) montre que le choix de ses variables n'importe pas, à l'équivalence près dans $\mathsf{PA}$.

      Une *construction* d'une fonction [[fonction-primitive-recursive|primitive récursive]] $f$ est une suite finie de fonctions, terminée par $f$, dont chacune est une [[fonctions-base|fonction de base]] ou s'obtient, par une composition ou une récurrence primitive indiquée, à partir de fonctions qui la précèdent. Toute fonction primitive récursive en a une, par le [[induction-primitives|principe d'induction]] de {{cal-pr-definition|Primitives récursives}} : l'ensemble des fonctions qui en ont une contient les fonctions de base et il est stable par les deux opérations.
    enonce: |
      (i) **Substitution dans $\mathcal S$.** Si $\varphi$ est une formule de $\mathcal S$, $v$ une variable et $t$ un terme dont aucune variable n'est quantifiée dans $\varphi$, alors $\varphi[t/v]$ est dans $\mathcal S$ ; il en est de même d'une substitution simultanée de tels termes.

      (ii) **Notation fonctionnelle.** Soit $\varphi$ une définition fonctionnelle de $f$ avec les variables $v, w$, et $t_1, \dots, t_n$, $s$, $s'$ des termes dont aucune variable n'est quantifiée dans $\varphi$, où $w$ ne figure pas dans les $t_k$. Alors $\vdash_{\mathsf{PA}} \exists w\ f(t_1, \dots, t_n) = w$ et
      $$\begin{aligned} \vdash_{\mathsf{PA}} \big(&f(t_1, \dots, t_n) = s \\ &\wedge f(t_1, \dots, t_n) = s'\big) \to s = s'. \end{aligned}$$

      (iii) **Fonctions de base, composition.** Les formules $w = 0$, $w = S\,v_1$ et $w = v_k$ sont des définitions fonctionnelles de $Z$ et de $S$, avec les variables $v_1, w$, et de la [[projection-produit|projection]] $P^n_k$, avec les variables $v_1, \dots, v_n, w$. Soit $h = f \circ (g_1, \dots, g_m)$, $\varphi_f$ une définition fonctionnelle de $f$ avec des variables $z_1, \dots, z_m, w$, et, pour chaque $j$, $\varphi_j$ une définition fonctionnelle de $g_j$ avec les variables $v, z_j$, où les $z_j$ sont distinctes entre elles et des variables $v_k$ et $w$, et où aucune des variables $v_k$, $z_j$, $w$ n'est quantifiée dans $\varphi_f$ ni dans les $\varphi_j$. Alors
      $$\begin{aligned} \exists z_1 \cdots \exists z_m\, \big(&\varphi_1 \wedge (\cdots \\ &\wedge (\varphi_m \wedge \varphi_f) \cdots)\big) \end{aligned}$$
      est une définition fonctionnelle de $h$ avec les variables $v, w$. Avec la notation de (ii), $h(v) = w$ est la formule $\exists z_1 \cdots \exists z_m\, \big(g_1(v) = z_1 \wedge \cdots \wedge g_m(v) = z_m \wedge f(z) = w\big)$.

      (iv) **Récurrence primitive.** Soit $h$ obtenue par récurrence primitive à partir de $f$, d'[[arite|arité]] $n$, et de $g$, d'arité $n + 2$. Soit $a$, $b$, $i$, $s$, $s'$, $y$, $w$ des variables distinctes entre elles et des $v_k$, $\varphi_f$ une définition fonctionnelle de $f$ avec les variables $v, s$, et $\varphi_g$ une définition fonctionnelle de $g$ avec les variables $v, i, s, s'$, où aucune des variables $v_k$, $a$, $b$, $i$, $s$, $s'$, $y$, $w$ n'est quantifiée dans $\varphi_f$ ni dans $\varphi_g$, et où les variables liées des formules $B$ et des bornes sont distinctes de toutes celles-là. Soit $X$ la formule $\exists s\, \exists s'\, \big(B(a, b, i, s) \wedge B(a, b, S\,i, s') \wedge \varphi_g\big)$ et $H$ la formule
      $$\begin{aligned} \exists a\, \exists b\, \big(&\exists s\, (\varphi_f \wedge B(a, b, 0, s)) \\ &\wedge \forall i < y\ X \wedge B(a, b, y, w)\big). \end{aligned}$$
      Alors $H$ est une définition fonctionnelle de $h$ avec les variables $v, y, w$, et, pour toute variable $u$ qui ne figure pas dans $H$,
      $$\begin{aligned} &\vdash_{\mathsf{PA}} h(v, 0) = w \leftrightarrow f(v) = w, \\ &\vdash_{\mathsf{PA}} h(v, S\,y) = w \\ &\qquad \leftrightarrow \exists u\, \big(h(v, y) = u \\ &\qquad\qquad \wedge g(v, y, u) = w\big). \end{aligned}$$
      Sans paramètre, quand $h(0) = c$ et $h(y + 1) = g(y, h(y))$, la formule $\exists s\, (\varphi_f \wedge B(a, b, 0, s))$ est remplacée par $B(a, b, 0, \underline c)$, et la première équation par $\vdash_{\mathsf{PA}} h(0) = w \leftrightarrow w = \underline c$.

      (v) **Identification.** Sous les hypothèses de (iv), soit $\psi$ une formule de variables libres parmi $v_1, \dots, v_n, y, w$, où ni $y$, ni $w$, ni $u$ ne sont quantifiées et où $u$ ne figure pas. Si $\vdash_{\mathsf{PA}} \psi[0/y] \leftrightarrow f(v) = w$ et $\vdash_{\mathsf{PA}} \psi[S\,y/y] \leftrightarrow \exists u\, (\psi[u/w] \wedge g(v, y, u) = w)$, alors $\vdash_{\mathsf{PA}} h(v, y) = w \leftrightarrow \psi$. Il en est de même sans paramètre, avec $w = \underline c$ à la place de $f(v) = w$.

      (vi) **Toute fonction primitive récursive.** Pour toute construction d'une fonction primitive récursive $f$ d'arité $n$, toutes variables distinctes $v_1, \dots, v_n, w$ et toute partie finie $V$ de l'ensemble des variables, les clauses (iii) et (iv), appliquées le long de la construction, fournissent une définition fonctionnelle de $f$ avec les variables $v, w$ dont aucune variable liée n'est dans $V$.

      (vii) **Indépendance des variables.** Soit $\varphi$ et $\varphi'$ deux définitions que fournit (vi) pour une même construction de $f$, avec les variables $v_1, \dots, v_n, w$ et $v'_1, \dots, v'_n, w'$ et des parties finies quelconques. Pour toutes variables distinctes $v''_1, \dots, v''_n, w''$ qui ne sont quantifiées ni dans $\varphi$ ni dans $\varphi'$,
      $$\vdash_{\mathsf{PA}} \varphi[v'', w''/v, w] \leftrightarrow \varphi'[v'', w''/v', w'].$$
      En particulier, si $v_1, \dots, v_n, w$ ne sont pas quantifiées dans $\varphi'$, alors $\vdash_{\mathsf{PA}} \varphi \leftrightarrow \varphi'[v, w/v', w']$ : une notation $f(t) = s$ ne dépend, à l'équivalence près dans $\mathsf{PA}$, que de la construction, et non des variables avec lesquelles sa définition a été écrite.
    preuve: |
      (i) L'ensemble des formules $\varphi$ de $\mathcal S$ telles que $\varphi[t/v]$ soit dans $\mathcal S$ pour toute variable $v$ et tout terme $t$ dont aucune variable n'est quantifiée dans $\varphi$ contient les formules Δ₀, par le point (i) de {{cal-rp-sigma1|Σ₁-complétude}}, et il est stable par $\wedge$ et $\vee$, qui commutent à la substitution. Soit $\varphi = \exists x\, \varphi_1$, avec $\varphi_1$ dans cet ensemble : si $v = x$, la variable $v$ n'est pas libre et $\varphi$ ne change pas ; sinon, $\varphi[t/v] = \exists x\, \varphi_1[t/v]$, puisque $x$, quantifiée dans $\varphi$, ne figure pas dans $t$. Soit $\varphi = \forall x \leqslant r\ \varphi_1$, écrite avec la variable liée $z$ : comme au point (i) de {{cal-rp-sigma1|Σ₁-complétude}}, $\varphi$ ne change pas si $v = x$, devient $\forall x \leqslant r\ \varphi_1[t/z]$ si $v = z$, et devient $\forall x \leqslant r[t/v]\ \varphi_1[t/v]$ sinon, où $r[t/v]$ ne contient ni $x$ ni $z$. Dans chaque cas, la formule obtenue est dans $\mathcal S$, et l'ensemble considéré contient $\mathcal S$. Une substitution simultanée s'obtient, comme au point (iv) de {{cal-pa-recurrence|Récurrence dans PA}}, par des substitutions successives de variables nouvelles puis des termes, qui sont chacune de cette forme.

      (ii) Par le point (iv) de {{cal-pa-recurrence|Récurrence dans PA}}, appliqué à (b) et aux termes $t_k$, qui ne contiennent aucune variable quantifiée dans $\exists w\, \varphi$, on a $\vdash_{\mathsf{PA}} (\exists w\, \varphi)[t/v]$, qui est $\exists w\, \varphi[t/v]$ puisque $w$ est distincte des $v_k$ : c'est $\exists w\ f(t) = w$. Soit $w'$ une variable qui ne figure ni dans $\varphi$, ni dans les $t_k$, ni dans $s$ et $s'$. Le même point, appliqué à (c) et aux termes $t_1, \dots, t_n, s, s'$ substitués à $v_1, \dots, v_n, w, w'$, donne la seconde formule, puisque $w'$ ne figure pas dans $\varphi$ et que $\varphi[w'/w][t, s, s'/v, w, w'] = \varphi[t, s'/v, w]$.

      (iii) *Fonctions de base.* Les trois formules sont atomiques, donc Δ₀, et elles définissent les graphes annoncés. L'introduction de l'existentiel, avec le terme $0$, $S\,v_1$ ou $v_k$, et la réflexivité de l'égalité donnent (b) ; la symétrie et la transitivité donnent (c), par exemple $(w = S\,v_1 \wedge w' = S\,v_1) \to w = w'$.

      *Composition.* La formule, notée $\varphi_h$, est dans $\mathcal S$, puisque $\mathcal S$ est stable par $\wedge$ et par $\exists$ ; ses variables libres sont parmi les $v_k$ et $w$, et aucune d'elles n'y est quantifiée. Par la définition de la {{l-satisfaction|satisfaction}} et le {{l-coincidence|lemme de coïncidence}}, $\varphi_h$ est satisfaite sous une [[valuation-structure|valuation]] $\sigma$ si et seulement s'il existe des entiers $e_1, \dots, e_m$ tels que $g_j(\sigma(v)) = e_j$ pour chaque $j$ et $f(e_1, \dots, e_m) = \sigma(w)$, c'est-à-dire si et seulement si $h(\sigma(v)) = \sigma(w)$ : c'est (a).

      Pour (b), le point (ii), appliqué à chaque $g_j$, et l'élimination fournissent des variables nouvelles $e_j$ telles que $g_j(v) = e_j$, puis, appliqué à $f$ avec les termes $e_1, \dots, e_m$, une variable nouvelle $e_0$ telle que $f(e_1, \dots, e_m) = e_0$. Les introductions successives de $\exists z_m$, …, $\exists z_1$, avec les termes $e_m$, …, $e_1$, puis de $\exists w$, avec le terme $e_0$, donnent $\exists w\, \varphi_h$, et l'on élimine les $e_j$.

      Pour (c), soit $w'$ une variable qui ne figure pas dans $\varphi_h$ ; comme $w$ n'est libre que dans $\varphi_f$, la formule $\varphi_h[w'/w]$ est $\exists z_1 \cdots \exists z_m\, (\varphi_1 \wedge \cdots \wedge \varphi_m \wedge \varphi_f[w'/w])$. Sous les hypothèses $\varphi_h$ et $\varphi_h[w'/w]$, l'élimination fournit des variables nouvelles $e_j$ et $e'_j$ telles que $g_j(v) = e_j$, $f(e) = w$, $g_j(v) = e'_j$ et $f(e') = w'$. Le point (ii) donne $e_j = e'_j$ pour chaque $j$, le remplacement d'un terme ({{cal-rp-calcul|Calcul à variables libres}}, (v)), appliqué $m$ fois, donne $f(e) = w'$, et le point (ii) donne $w = w'$. On élimine les variables introduites.

      (iv) Notons $A(a, b)$ la formule $\exists s\, (\varphi_f \wedge B(a, b, 0, s))$ et $R(a, b, y)$ la formule $\forall i < y\ X$, de sorte que $H$ est $\exists a\, \exists b\, \big(A(a, b) \wedge R(a, b, y) \wedge B(a, b, y, w)\big)$. Pour des variables $a'$, $b'$ qui n'y sont pas quantifiées, $A(a', b')$ et $R(a', b', y)$ s'obtiennent en les substituant à $a$ et $b$, et $X(t)$ désigne $X[t/i]$, écrite avec $a$, $b$ ou avec d'autres variables selon le contexte. La formule $B$ est dans $\mathcal S$, et, par (i), $B(a, b, 0, s)$, $B(a, b, S\,i, s')$ et $B(a, b, y, w)$ aussi ; comme $i = y$ est atomique, $H$ est dans $\mathcal S$. Ses variables libres sont parmi les $v_k$, $y$ et $w$, et aucune d'elles n'y est quantifiée. La variable $y$ ne figure pas dans $X$ : la formule $h(v, 0) = w$ est donc $\exists a\, \exists b\, (A(a, b) \wedge R(a, b, 0) \wedge B(a, b, 0, w))$, et $h(v, S\,y) = w$ s'obtient de même avec $S\,y$. Par le point (ii) de {{cal-bp-beta|Graphe de β dans PA}}, $B(a, b, t, e)$ et $B(a, b, t, e')$ donnent $e = e'$ : c'est l'*unicité de* $B$. On écrit $f(v) = e$ pour $\varphi_f[e/s]$ et $g(v, t, e) = e'$ pour $\varphi_g[t, e, e'/i, s, s']$, comme en (ii).

      *Les équations, de droite à gauche.* Sous l'hypothèse $f(v) = w$, le prolongement ({{cal-bp-prolongement|Prolongement d'une suite}}, (ii)), écrit avec des variables liées distinctes de $w$ et instancié par les termes $0$, $0$, $0$, $w$ substitués à $a$, $b$, $n$, $x$, et l'élimination fournissent $a_0$ et $b_0$ tels que $B(a_0, b_0, 0, w)$. L'introduction, avec le terme $w$, donne $A(a_0, b_0)$, et le point (i) (a) de {{cal-bp-modules|Modules de Gödel}} donne $R(a_0, b_0, 0)$ ; deux introductions donnent $h(v, 0) = w$.

      Sous les hypothèses $h(v, y) = u$ et $g(v, y, u) = w$, l'élimination fournit $a_0$ et $b_0$ tels que $A(a_0, b_0)$, $R(a_0, b_0, y)$ et $B(a_0, b_0, y, u)$. Le prolongement, instancié par $a_0$, $b_0$, $S\,y$, $w$ et écrit avec des variables liées nouvelles, et l'élimination fournissent $a_1$ et $b_1$ tels que $B(a_1, b_1, S\,y, w)$ et tels que, par le point (i) (b) de {{cal-bp-modules|Modules de Gödel}} et l'axiome (2), $B(a_0, b_0, t, e) \to B(a_1, b_1, t, e)$ pour tout terme $t$ tel que $t < S\,y$ et tout terme $e$ qui est une variable ou un terme clos, et qui est donc substituable. L'élimination de $A(a_0, b_0)$ fournit $e_0$ tel que $f(v) = e_0$ et $B(a_0, b_0, 0, e_0)$ ; comme $0 \leqslant y$, on a $0 < S\,y$, donc $B(a_1, b_1, 0, e_0)$, l'introduction donne $A(a_1, b_1)$, et l'on élimine $e_0$, qui ne figure pas dans $A(a_1, b_1)$. Pour $R(a_1, b_1, S\,y)$, le point (i) (c) de {{cal-bp-modules|Modules de Gödel}} demande $X(y)$ et $R(a_1, b_1, y)$, avec $a_1$ et $b_1$. D'une part, $y < S\,y$ donne $B(a_1, b_1, y, u)$, et, avec $B(a_1, b_1, S\,y, w)$ et $g(v, y, u) = w$, deux introductions, avec les termes $w$ et $u$, donnent $X(y)$. D'autre part, sous l'hypothèse $i < y$, la formule $R(a_0, b_0, y)$ et le point (i) (b) du même nœud donnent $X(i)$, avec $a_0$ et $b_0$, et l'élimination fournit $e$ et $e'$ tels que $B(a_0, b_0, i, e)$, $B(a_0, b_0, S\,i, e')$ et $g(v, i, e) = e'$. Le point (v) de {{cal-pa-ordre|Ordre dans PA}} donne $i < S\,y$ et, puisque $i < y$ est $S\,i \leqslant y$, $S\,i < S\,y$ ; les deux formules $B$ passent à $a_1$, $b_1$, et deux introductions donnent $X(i)$ ; le point (i) (a) donne $R(a_1, b_1, y)$. Deux introductions, avec $a_1$ et $b_1$, donnent $h(v, S\,y) = w$, et l'on élimine les variables introduites.

      *Existence.* Montrons $\vdash_{\mathsf{PA}} \exists w\ h(v, y) = w$ par récurrence sur $y$. Le point (b) pour $\varphi_f$ et le renommage donnent $\exists w\ f(v) = w$, et la première équation, de droite à gauche, et la monotonie de {{cal-pa-recurrence|Récurrence dans PA}}, (ii), donnent le cas $0$. Sous l'hypothèse $\exists w\ h(v, y) = w$, l'élimination avec la variable $u$ donne $h(v, y) = u$ ; le point (ii), appliqué à $g$ avec les termes $v, y, u$, et l'élimination donnent $g(v, y, u) = e$, puis $h(v, S\,y) = e$ par la seconde équation, de droite à gauche, et l'introduction conclut.

      *Unicité.* Soit $a'$, $b'$ et $j$ des variables nouvelles. Sous les hypothèses $A(a, b)$, $R(a, b, y)$, $A(a', b')$ et $R(a', b', y)$, montrons par récurrence sur $j$ la formule $j \leqslant y \to \exists s\, \big(B(a, b, j, s) \wedge B(a', b', j, s)\big)$. Pour $0$ : l'élimination dans $A(a, b)$ et dans $A(a', b')$ fournit $e$ et $e'$ tels que $f(v) = e$, $B(a, b, 0, e)$, $f(v) = e'$ et $B(a', b', 0, e')$ ; le point (ii) donne $e = e'$, d'où $B(a', b', 0, e)$, et l'introduction conclut. Pour le pas, sous l'hypothèse de récurrence et sous $S\,j \leqslant y$, c'est-à-dire $j < y$, on a $j \leqslant y$, et l'élimination fournit $k$ tel que $B(a, b, j, k)$ et $B(a', b', j, k)$. Le point (i) (b) de {{cal-bp-modules|Modules de Gödel}}, appliqué à $R(a, b, y)$ et à $R(a', b', y)$ avec le terme $j$, et l'élimination fournissent $e$, $e'$, $d$, $d'$ tels que $B(a, b, j, e)$, $B(a, b, S\,j, e')$, $g(v, j, e) = e'$, $B(a', b', j, d)$, $B(a', b', S\,j, d')$ et $g(v, j, d) = d'$. L'unicité de $B$ donne $e = k = d$, le remplacement donne $g(v, j, e) = d'$, et le point (ii), appliqué à $g$, donne $e' = d'$ ; d'où $B(a', b', S\,j, e')$, et l'introduction donne la formule pour $S\,j$. La variable $j$ n'est libre dans aucune des quatre hypothèses, et le point (iii) de {{cal-pa-recurrence|Récurrence dans PA}} conclut.

      Soit alors $w'$ une variable qui ne figure pas dans $H$. Sous les hypothèses $h(v, y) = w$ et $h(v, y) = w'$, l'élimination fournit $a$, $b$, $a'$, $b'$ tels que les quatre hypothèses précédentes, $B(a, b, y, w)$ et $B(a', b', y, w')$. Ce qui précède, avec $y \leqslant y$, et l'élimination fournissent $k$ tel que $B(a, b, y, k)$ et $B(a', b', y, k)$ ; l'unicité de $B$ donne $w = k = w'$.

      *Les équations, de gauche à droite.* Sous l'hypothèse $h(v, 0) = w$, l'élimination fournit $A(a, b)$ et $B(a, b, 0, w)$, puis $e$ tel que $f(v) = e$ et $B(a, b, 0, e)$ ; l'unicité de $B$ donne $e = w$, et le remplacement donne $f(v) = w$. Sous l'hypothèse $h(v, S\,y) = w$, l'élimination fournit $A(a, b)$, $R(a, b, S\,y)$ et $B(a, b, S\,y, w)$. Le point (i) (c) de {{cal-bp-modules|Modules de Gödel}} donne $R(a, b, y)$ et $X(y)$, et l'élimination fournit $e$ et $e'$ tels que $B(a, b, y, e)$, $B(a, b, S\,y, e')$ et $g(v, y, e) = e'$. L'unicité de $B$ donne $e' = w$, donc $g(v, y, e) = w$ ; deux introductions donnent $h(v, y) = e$, et l'introduction, avec le terme $e$, donne $\exists u\, (h(v, y) = u \wedge g(v, y, u) = w)$.

      *Dans $\mathcal N$.* La structure $\mathcal N$ est un modèle de $\mathsf{PA}$ ({{cal-rp-godel-rosser|Gödel-Rosser}}, (iii)), et le {{l-correction|théorème de correction}} y rend vrais les théorèmes précédents. Par l'existence, l'unicité et le {{l-substitution|lemme de substitution}}, pour tout $(x, k) \in \mathbb N^{n+1}$, il existe un unique entier $\tilde h(x, k)$ tel que $H$ soit satisfaite sous une valuation qui vaut $x$ en $v$, $k$ en $y$ et $\tilde h(x, k)$ en $w$. La première équation et le fait que $\varphi_f$ définit $f$ donnent $\tilde h(x, 0) = f(x)$ ; la seconde et le fait que $\varphi_g$ définit $g$ donnent $\tilde h(x, k + 1) = g(x, k, \tilde h(x, k))$. Par l'unicité de la récurrence primitive ({{cal-pr-definition|Primitives récursives}}), $\tilde h = h$, et $H$ définit le graphe de $h$.

      *Sans paramètre.* On remplace $A(a, b)$ par $B(a, b, 0, \underline c)$ et $f(v) = w$ par $w = \underline c$. Sous l'hypothèse $w = \underline c$, le prolongement donne $B(a_0, b_0, 0, w)$, puis $B(a_0, b_0, 0, \underline c)$ par le remplacement ; dans le second cas de droite à gauche, $B(a_0, b_0, 0, \underline c)$ et $0 < S\,y$ donnent $B(a_1, b_1, 0, \underline c)$ ; le cas $0$ de l'unicité prend le terme $\underline c$ ; et $B(a, b, 0, \underline c)$, $B(a, b, 0, w)$ donnent $w = \underline c$. Le reste ne change pas, et la valeur de $\underline c$ dans $\mathcal N$ est $c$.

      (v) Soit $\chi$ la formule $\forall w\, (h(v, y) = w \leftrightarrow \psi)$ ; montrons $\vdash_{\mathsf{PA}} \chi$ par récurrence sur $y$. Le point (iv) et la première hypothèse donnent $h(v, 0) = w \leftrightarrow \psi[0/y]$, et la généralisation en $w$ donne $\chi[0/y]$. Sous l'hypothèse $\chi$, l'axiome (2), avec le terme $u$, donne $h(v, y) = u \leftrightarrow \psi[u/w]$, et la monotonie de {{cal-pa-recurrence|Récurrence dans PA}}, (ii), appliquée dans les deux sens sous cette hypothèse où $u$ n'est pas libre, donne $\exists u\, (h(v, y) = u \wedge g(v, y, u) = w) \leftrightarrow \exists u\, (\psi[u/w] \wedge g(v, y, u) = w)$. Avec la seconde équation de (iv) et la seconde hypothèse, $h(v, S\,y) = w \leftrightarrow \psi[S\,y/y]$, et la généralisation en $w$, qui n'est pas libre dans $\chi$, donne $\chi[S\,y/y]$. Le point (iii) de {{cal-pa-recurrence|Récurrence dans PA}} et l'axiome (2), avec le terme $w$, concluent. Sans paramètre, la preuve est la même.

      (vi) Par récurrence sur la longueur de la construction, on montre l'assertion pour toutes les fonctions qui y figurent, tous les choix de variables et toutes les parties finies $V$ à la fois. Pour une fonction de base, les formules de (iii) n'ont pas de variable liée. Pour une composition, on prend des variables $z_1, \dots, z_m$ distinctes, hors de $V$ et différentes des $v_k$ et de $w$, et l'on obtient, par l'hypothèse de récurrence, des définitions $\varphi_j$ et $\varphi_f$ avec les variables indiquées, dont aucune variable liée n'est dans $V$ ni parmi les $v_k$, les $z_j$ et $w$ ; la clause (iii) s'applique. Pour une récurrence primitive, on prend de même $a$, $b$, $i$, $s$, $s'$ et les variables liées de $B$ et des bornes hors de $V$ et des variables libres, puis $\varphi_f$ et $\varphi_g$ dont les variables liées évitent toutes celles-là ; la clause (iv) s'applique. En prenant à chaque étape les premières variables convenables dans l'ordre $x_0, x_1, \dots$ du langage, on obtient une formule déterminée, sans aucun choix : c'est la *définition naturelle* de $f$ associée à la construction, aux variables et à $V$.

      (vii) Observons d'abord que les clauses (iii) et (iv) commutent à la substitution de variables : si $v''$, $w''$ (et $y''$ pour une récurrence) sont des variables distinctes qui ne sont pas quantifiées dans la formule obtenue, la substituer à $v$, $w$ (et $y$) revient à appliquer la même clause aux formules composantes où l'on a substitué $v''$ à $v$, avec les variables $w''$ (et $y''$), puisque ces variables ne rencontrent aucun quantificateur. Une formule ainsi substituée est encore une définition fonctionnelle : elle est dans $\mathcal S$ par (i), (b) et (c) passent par le point (iv) de {{cal-pa-recurrence|Récurrence dans PA}}, et (a) par le {{l-substitution|lemme de substitution}}.

      On raisonne par récurrence sur la longueur de la construction, l'énoncé portant sur tous les choix de variables à la fois. Pour une fonction de base, les deux formules substituées sont la même formule, par exemple $w'' = v''_k$. Pour une composition, $\varphi[v'', w''/v, w]$ est $\exists z_1 \cdots \exists z_m\, (\varphi_1[v''/v] \wedge \cdots \wedge \varphi_f[w''/w])$, et de même pour $\varphi'$, avec des variables $z'_j$. Soit $\zeta_1, \dots, \zeta_m$ des variables distinctes qui ne figurent dans aucune des deux formules. Le renommage du point (iii) de {{cal-rp-calcul|Calcul à variables libres}}, appliqué dans les deux sens comme au point (ii) de {{cal-pa-sigma|Collection et forme Σ₁}}, et la monotonie de {{cal-pa-recurrence|Récurrence dans PA}}, (ii), remplacent les $z_j$ par les $\zeta_j$ ; l'hypothèse de récurrence, appliquée aux $g_j$ avec les variables $v'', \zeta_j$ et à $f$ avec les variables $\zeta, w''$, et la monotonie remplacent chaque $\varphi_j[v'', \zeta_j/v, z_j]$ par $\varphi'_j[v'', \zeta_j/v', z'_j]$ et $\varphi_f[\zeta, w''/z, w]$ par $\varphi'_f[\zeta, w''/z', w']$ ; un dernier renommage ramène les $\zeta_j$ aux $z'_j$. Pour une récurrence primitive, notons $H''$ et $\psi$ les deux formules substituées, écrites avec $v''$, $y''$, $w''$. Par l'observation initiale, $H''$ est la formule de (iv) construite sur $\varphi_f[v''/v]$ et $\varphi_g[v''/v]$, et $\psi$ celle construite sur $\varphi'_f[v''/v']$ et $\varphi'_g[v''/v']$ ; le point (iv), appliqué à $\psi$, donne ses deux équations avec ces dernières formules, et l'hypothèse de récurrence, appliquée à $f$ et à $g$ avec les variables $v'', w''$ et $v'', y'', u, w''$, où $u$ est une variable nouvelle, les transforme en les équations écrites avec $\varphi_f[v''/v]$ et $\varphi_g[v''/v]$. Le point (v), appliqué à $H''$ et à $\psi$, conclut. Le cas sans paramètre est le même.
    remarques:
      - |
        Ce sont les formules de la preuve du point (ii) de {{cal-rp-forme-sigma|Forme Σ₁ des r.e.}}, pour les fonctions de base, la composition et la récurrence primitive, à une différence d'écriture près : ce nœud changeait les variables d'une formule par une formule $\exists v_1 \cdots \exists v_n\, (v_1 = w_{\alpha(1)} \wedge \cdots \wedge \varphi)$, alors qu'ici la construction fournit directement une formule pour chaque choix de variables. La preuve citée vérifiait leur sens dans $\mathcal N$ ; ici, c'est $\mathsf{PA}$ qui démontre qu'elles définissent des fonctions et qu'elles satisfont les équations de définition. On n'a pas pris la formule du plus petit témoin du nœud voisin {{cal-dg-fonctions|Représentation des fonctions}} : elle part d'une formule quelconque qui représente le graphe dans $\mathsf Q$, et rien n'y relie la formule à la composition ou à la récurrence qui définit $f$, alors que ce sont ces liens qu'emploieront les conditions de dérivabilité.
      - |
        L'erreur la plus répandue est de croire qu'une formule qui définit le graphe de $f$ dans $\mathcal N$ suffit à raisonner sur $f$ dans une théorie : la première remarque du nœud {{cal-dg-fonctions|Représentation des fonctions}} en donne un contre-exemple dans $\mathsf Q$. Ici, l'existence demande le prolongement d'une suite codée, et l'unicité une récurrence sur l'indice $j$ qui compare deux codes $(a, b)$ et $(a', b')$ de la même suite. La formule dépend aussi de la construction choisie : deux constructions d'une même fonction donnent deux formules qui ont le même sens dans $\mathcal N$, mais rien de ce qui précède n'assure que $\mathsf{PA}$ démontre leur équivalence. C'est pourquoi la première remarque du nœud voisin {{cal-dg-prov|Démontrabilité (D1)}} dit que les conditions (D2) et (D3) dépendent de la façon dont la formule de démontrabilité est écrite.
      - |
        Le point (v) est la forme interne à $\mathsf{PA}$ de l'unicité de la récurrence primitive, établie au nœud {{cal-pr-definition|Primitives récursives}} à partir du {{n-recdef|théorème de définition par récurrence}} : deux formules qui satisfont les mêmes équations sont équivalentes dans $\mathsf{PA}$. Le nœud suivant l'emploie pour reconnaître, dans les définitions naturelles de l'addition et de la multiplication, les termes $x + y$ et $x \times y$ du langage.

  - id: cal-bp-usuelles
    etiquette: Fonctions usuelles dans PA
    nature: proposition
    titre: Addition, soustraction tronquée, signe, sommes et produits bornés dans l'arithmétique de Peano
    texte: |
      Les conventions sont celles de {{cal-bp-fonctions|Fonctions p.r. dans PA}}. Chaque fonction de ce nœud est prise avec la construction indiquée ci-dessous, qui est celle qu'écrivent les preuves de {{cal-pr-definition|Primitives récursives}} et de {{cal-pr-cloture|Clôture}}, et avec une définition naturelle du point (vi) de {{cal-bp-fonctions|Fonctions p.r. dans PA}}, pour des variables dont aucune n'est quantifiée dans les définitions employées : il suffit de les mettre dans la partie $V$. Les énoncés valent pour toutes ces définitions, puisque les preuves n'emploient que les points (ii) à (v) de ce nœud-là ; quand deux définitions d'une même construction, écrites avec des variables différentes, interviennent dans une même preuve, par exemple celle de $f$ et celle qui figure à l'intérieur de $\Sigma_f$, le point (vii) du même nœud les identifie. On note $\mathrm{add}$ et $\mathrm{mul}$ l'addition et la multiplication, fonctions primitives récursives, pour les distinguer des symboles $+$ et $\times$ du langage, et $\mathbf 1$ la fonction $S \circ Z$.

      Les constructions sont les suivantes. L'addition s'obtient par récurrence primitive à partir de $P^1_1$ et de $S \circ P^3_3$, la multiplication à partir de $Z$ et de $\mathrm{add} \circ (P^3_3, P^3_1)$. Le prédécesseur $\mathrm{pr}$ s'obtient sans paramètre, à partir de $0$ et de $P^2_1$, et la soustraction tronquée $x \mathbin{\dot{-}} y$ à partir de $P^1_1$ et de $\mathrm{pr} \circ P^3_3$. Le signe est $\overline{\mathrm{sg}} = {\dot{-}} \circ (\mathbf 1, P^1_1)$, qui calcule $1 \mathbin{\dot{-}} x$, et $\mathrm{sg} = {\dot{-}} \circ (\mathbf 1, \overline{\mathrm{sg}})$, qui calcule $1 \mathbin{\dot{-}} (1 \mathbin{\dot{-}} x)$. Pour une fonction primitive récursive $f$ d'[[arite|arité]] $n + 1$, donnée avec une construction, où $f(v, z) = w$ désigne l'une de ses définitions naturelles, la somme $\Sigma_f(v, y) = \sum_{z < y} f(v, z)$ s'obtient par récurrence primitive à partir de $Z \circ P^n_1$ et de $\mathrm{add} \circ \big(P^{n+2}_{n+2}, f \circ (P^{n+2}_1, \dots, P^{n+2}_{n+1})\big)$, et le produit $\Pi_f(v, y) = \prod_{z < y} f(v, z)$ à partir de $\mathbf 1 \circ P^n_1$ et de $\mathrm{mul} \circ \big(P^{n+2}_{n+2}, f \circ (P^{n+2}_1, \dots, P^{n+2}_{n+1})\big)$. Pour $n = 0$, la somme et le produit s'obtiennent sans paramètre, à partir des entiers $0$ et $1$ et de $\mathrm{add} \circ (P^2_2, f \circ P^2_1)$ et $\mathrm{mul} \circ (P^2_2, f \circ P^2_1)$ ; les énoncés et les preuves ci-dessous ne changent pas.
    enonce: |
      (i) **Égalités et termes.** Si $z$ ne figure pas dans le terme $t$ et si $t$ est substituable à $z$ dans $\chi$, alors $\vdash \exists z\, (z = t \wedge \chi) \leftrightarrow \chi[t/z]$. Soit $h = f \circ (g_1, \dots, g_m)$, avec des définitions comme au point (iii) de {{cal-bp-fonctions|Fonctions p.r. dans PA}}. Si $\vdash_{\mathsf{PA}} g_j(v) = z_j \leftrightarrow z_j = t_j$ pour chaque $j$, où les $t_j$ sont des termes de variables parmi les $v_k$, alors $\vdash_{\mathsf{PA}} h(v) = w \leftrightarrow f(t_1, \dots, t_m) = w$, et, si de plus $\vdash_{\mathsf{PA}} f(z) = w \leftrightarrow w = t$, alors $\vdash_{\mathsf{PA}} h(v) = w \leftrightarrow w = t[t_1, \dots, t_m / z_1, \dots, z_m]$. La même preuve élimine celles des variables $z_j$ pour lesquelles $g_j$ est ainsi donnée par un terme. Enfin, pour des variables $e_1, \dots, e_m$ qui ne figurent dans aucune des définitions, $\{g_1(v) = e_1, \dots, g_m(v) = e_m\} \vdash_{\mathsf{PA}} h(v) = w \leftrightarrow f(e_1, \dots, e_m) = w$ : on calcule $h$ sur les *valeurs* $e_j$.

      (ii) **Addition, multiplication.** $\vdash_{\mathsf{PA}} \mathrm{add}(x, y) = w \leftrightarrow w = x + y$, $\vdash_{\mathsf{PA}} \mathrm{mul}(x, y) = w \leftrightarrow w = x \times y$ et $\vdash_{\mathsf{PA}} \mathbf 1(x) = w \leftrightarrow w = S\,0$.

      (iii) **Prédécesseur, soustraction tronquée.**
      $$\begin{aligned} &\vdash_{\mathsf{PA}} \mathrm{pr}(y) = w \\ &\quad \leftrightarrow \big((y = 0 \wedge w = 0) \vee y = S\,w\big), \\ &\vdash_{\mathsf{PA}} x \mathbin{\dot{-}} y = w \\ &\quad \leftrightarrow \big((x \leqslant y \wedge w = 0) \\ &\qquad \vee (y \leqslant x \wedge w + y = x)\big). \end{aligned}$$

      (iv) **Signes.**
      $$\begin{aligned} &\vdash_{\mathsf{PA}} \overline{\mathrm{sg}}(x) = w \\ &\quad \leftrightarrow \big((x = 0 \wedge w = S\,0) \\ &\qquad \vee (\neg(x = 0) \wedge w = 0)\big), \\ &\vdash_{\mathsf{PA}} \mathrm{sg}(x) = w \\ &\quad \leftrightarrow \big((x = 0 \wedge w = 0) \\ &\qquad \vee (\neg(x = 0) \wedge w = S\,0)\big). \end{aligned}$$

      (v) **Sommes et produits bornés.** Pour une fonction primitive récursive $f$ d'arité $n + 1$, donnée avec une construction,
      $$\begin{aligned} &\vdash_{\mathsf{PA}} \Sigma_f(v, y) = 0 \\ &\qquad \leftrightarrow \forall z < y\ f(v, z) = 0, \\ &\vdash_{\mathsf{PA}} \neg(\Pi_f(v, y) = 0) \\ &\qquad \leftrightarrow \forall z < y\ \neg(f(v, z) = 0), \end{aligned}$$
      et, si $\vdash_{\mathsf{PA}} f(v, z) = w \to (w = 0 \vee w = S\,0)$, alors $\vdash_{\mathsf{PA}} \Pi_f(v, y) = w \to (w = 0 \vee w = S\,0)$.
    preuve: |
      (i) Sous l'hypothèse $z = t \wedge \chi$, le remplacement d'un terme ({{cal-rp-calcul|Calcul à variables libres}}, (v)), appliqué à $\chi$ avec les termes $z$ et $t$, donne $\chi[t/z]$, où $z$ n'est pas libre puisqu'elle ne figure pas dans $t$ ; l'élimination de $z$ donne un sens. Pour l'autre, $(z = t \wedge \chi)[t/z]$ est $t = t \wedge \chi[t/z]$, et l'introduction, avec le terme $t$, et $\vdash t = t$ concluent. De même, si $z$ n'est pas libre dans $\alpha$, l'introduction et l'élimination donnent $\vdash \exists z\, (\alpha \wedge \chi) \leftrightarrow (\alpha \wedge \exists z\, \chi)$.

      La formule $h(v) = w$ est $\exists z_1 \cdots \exists z_m\, (g_1(v) = z_1 \wedge \cdots \wedge g_m(v) = z_m \wedge f(z) = w)$. Par la monotonie de {{cal-pa-recurrence|Récurrence dans PA}}, (ii), et la règle des tautologies, elle équivaut à la formule où chaque $g_j(v) = z_j$ est remplacée par $z_j = t_j$. Aucune $z_l$ ne figure dans les égalités $z_j = t_j$ pour $j \neq l$ : la seconde équivalence ci-dessus fait sortir chacune d'elles de la [[portee-quantificateur|portée]] des $\exists z_l$ suivants, et la première, appliquée de l'intérieur vers l'extérieur, élimine $z_m$, …, $z_1$. Les termes $t_j$ ne contiennent aucune $z_l$, et leurs variables ne sont pas quantifiées dans $\varphi_f$ : le résultat est $f(t_1, \dots, t_m) = w$, puis $w = t[t_1, \dots, t_m / z_1, \dots, z_m]$ sous la seconde hypothèse, par le point (iv) de {{cal-pa-recurrence|Récurrence dans PA}}.

      Pour la dernière assertion, sous les hypothèses $g_j(v) = e_j$ et $h(v) = w$, l'élimination fournit des variables nouvelles $d_j$ telles que $g_j(v) = d_j$ et $f(d_1, \dots, d_m) = w$ ; le point (ii) de {{cal-bp-fonctions|Fonctions p.r. dans PA}} donne $d_j = e_j$, et le remplacement donne $f(e_1, \dots, e_m) = w$. Réciproquement, sous les hypothèses $g_j(v) = e_j$ et $f(e_1, \dots, e_m) = w$, les introductions de $\exists z_m$, …, $\exists z_1$, avec les termes $e_m$, …, $e_1$, donnent $h(v) = w$.

      (ii) Par (i), $(S \circ P^3_3)(x, y, u) = w$ équivaut à $w = S\,u$, et $P^1_1(x) = w$ est $w = x$. Appliquons le point (v) de {{cal-bp-fonctions|Fonctions p.r. dans PA}} à $\psi = (w = x + y)$ : $\psi[0/y]$ équivaut à $w = x$ par $\mathrm Q_4$, et $\psi[S\,y/y]$ équivaut à $w = S(x + y)$ par $\mathrm Q_5$, c'est-à-dire, par (i), à $\exists u\, (u = x + y \wedge w = S\,u)$, qui équivaut par la monotonie à $\exists u\, (\psi[u/w] \wedge g(x, y, u) = w)$. Pour la multiplication, (i) et ce qui précède donnent $\mathrm{add}(P^3_3, P^3_1)(x, y, u) = w \leftrightarrow w = u + x$ ; avec $\psi = (w = x \times y)$, $\mathrm Q_6$ et $\mathrm Q_7$ donnent de même les deux hypothèses du point (v). Enfin $\mathbf 1(x) = w$ est $\exists z\, (z = 0 \wedge w = S\,z)$, qui équivaut à $w = S\,0$ par (i).

      (iii) *Prédécesseur.* Soit $\psi$ la formule $(y = 0 \wedge w = 0) \vee y = S\,w$. La formule $\psi[0/y]$ équivaut à $w = 0$, puisque $0 = S\,w$ est exclu par $\mathrm Q_1$ et la symétrie. La formule $\psi[S\,y/y]$ équivaut à $y = w$, par $\mathrm Q_1$, $\mathrm Q_2$ et la congruence. Comme $g(y, u) = w$ est ici $w = y$, il reste à voir que $\exists u\, (\psi[u/w] \wedge w = y)$ équivaut à $w = y$ : par (i), elle équivaut à $w = y \wedge \exists u\, \psi[u/w]$, et $\exists u\, \psi[u/w]$ est démontrable, avec le terme $0$ si $y = 0$, et par l'instance $\neg(y = 0) \to \exists u\, (y = S\,u)$ de $\mathrm Q_3$ et la monotonie sinon. Le point (v) de {{cal-bp-fonctions|Fonctions p.r. dans PA}}, sans paramètre, conclut.

      *Soustraction tronquée.* Par (i) et ce qui précède, $g(x, y, u) = w$ équivaut à $(u = 0 \wedge w = 0) \vee u = S\,w$. Soit $\psi$ la formule $(x \leqslant y \wedge w = 0) \vee (y \leqslant x \wedge w + y = x)$. Pour $\psi[0/y]$ : $x \leqslant 0$ donne $x = 0$ ({{cal-pa-ordre|Ordre dans PA}}, (ii)), donc $w = x$ dans le premier cas, et $w + 0 = x$ donne $w = x$ dans le second ; réciproquement, $w = x$ donne le second cas, avec $0 \leqslant x$. Pour $\psi[S\,y/y]$, on raisonne par cas sur $x \leqslant y \vee y < x$, qui découle des points (iv) et (v) du même nœud.

      Si $x \leqslant y$ : alors $\psi[u/w]$ équivaut à $u = 0$, puisque, dans le second cas, l'[[relation-antisymetrique|antisymétrie]] donne $x = y$, puis $u + y = 0 + y$ et $u = 0$ par la simplification. Par (i), $\exists u\, (\psi[u/w] \wedge g(x, y, u) = w)$ équivaut à $(0 = 0 \wedge w = 0) \vee 0 = S\,w$, c'est-à-dire à $w = 0$. De son côté, $x \leqslant S\,y$ est vrai et $S\,y \leqslant x$, qui avec $x \leqslant y$ donnerait $y < y$, est exclu : $\psi[S\,y/y]$ équivaut aussi à $w = 0$.

      Si $y < x$, c'est-à-dire $S\,y \leqslant x$ : alors $x \leqslant y$ est exclu, et $\psi[u/w]$ équivaut à $u + y = x$. Le cas $u = 0$ donnerait $x = y$, exclu ; par (i), $\exists u\, (u + y = x \wedge u = S\,w)$ équivaut à $S\,w + y = x$, c'est-à-dire à $w + S\,y = x$ ({{cal-pa-lois|Lois de + et ×}}, (i)). De son côté, le second cas de $\psi[S\,y/y]$ se réduit à $w + S\,y = x$, et le premier, $x \leqslant S\,y \wedge w = 0$, donne $x = S\,y$ par l'antisymétrie, donc $w + S\,y = 0 + S\,y = x$ : $\psi[S\,y/y]$ équivaut à $w + S\,y = x$. Dans les deux cas, la seconde hypothèse du point (v) de {{cal-bp-fonctions|Fonctions p.r. dans PA}} est établie, et ce point conclut.

      (iv) Par (i) et (ii), $\overline{\mathrm{sg}}(x) = w$ équivaut à $S\,0 \mathbin{\dot{-}} x = w$, c'est-à-dire, par (iii) et le point (iv) de {{cal-pa-recurrence|Récurrence dans PA}}, à $(S\,0 \leqslant x \wedge w = 0) \vee (x \leqslant S\,0 \wedge w + x = S\,0)$. Si $x = 0$ : le premier cas est exclu, puisque $S\,0 \leqslant 0$ donnerait $S\,0 = 0$, et le second se réduit, avec $0 \leqslant S\,0$, à $w + 0 = S\,0$, c'est-à-dire à $w = S\,0$. Si $x = S\,k$, par l'instance de $\mathrm Q_3$ : $0 \leqslant k$ donne $S\,0 \leqslant S\,k$ par le point (v) de {{cal-pa-ordre|Ordre dans PA}}, et le premier cas se réduit à $w = 0$ ; le second, par le point (ii) du même nœud, donne $x \leqslant 0$ ou $x = S\,0$, le premier cas donnant $S\,k = 0$, contraire à $\mathrm Q_1$, d'où $x = S\,0$, puis $S\,w = w + S\,0 = S\,0$ et $w = 0$ par $\mathrm Q_2$. La formule équivaut donc à $w = 0$. Pour $\mathrm{sg}$, (i) donne $\mathrm{sg}(x) = w \leftrightarrow \exists e\, (\overline{\mathrm{sg}}(x) = e \wedge S\,0 \mathbin{\dot{-}} e = w)$, et $S\,0 \mathbin{\dot{-}} e = w$ équivaut à $\overline{\mathrm{sg}}(e) = w$ par ce qui précède, la définition de $\dot{-}$ qui figure dans celle de $\mathrm{sg}$ étant identifiée à celle de $\overline{\mathrm{sg}}$ par le point (vii) de {{cal-bp-fonctions|Fonctions p.r. dans PA}}. Si $x = 0$, l'unique valeur $e$ est $S\,0$, et $\overline{\mathrm{sg}}(S\,0) = w$ équivaut à $w = 0$ ; sinon, $e = 0$, et $\overline{\mathrm{sg}}(0) = w$ équivaut à $w = S\,0$.

      (v) Par (i) et (ii), la fonction initiale de $\Sigma_f$ est donnée par $w = 0$, et $g(v, y, u) = w$ équivaut à $\exists e\, (f(v, y) = e \wedge w = u + e)$ ; pour $\Pi_f$, ce sont $w = S\,0$ et $\exists e\, (f(v, y) = e \wedge w = u \times e)$. Ici $f(v, y) = e$ est, par (i), la définition de $f$ qui figure dans la construction de $\Sigma_f$ ou de $\Pi_f$, écrite avec les variables $v, y, e$ ; par le point (vii) de {{cal-bp-fonctions|Fonctions p.r. dans PA}}, elle équivaut dans $\mathsf{PA}$ à la définition de $f$ de l'énoncé, où l'on a substitué $y$ et $e$ à $z$ et $w$, ce qui permet d'écrire les conclusions avec celle-ci.

      *Somme.* Montrons $\Sigma_f(v, y) = 0 \leftrightarrow \forall z < y\ f(v, z) = 0$ par récurrence sur $y$. Pour $0$, la première équation de {{cal-bp-fonctions|Fonctions p.r. dans PA}} donne $\Sigma_f(v, 0) = 0$, et le point (i) (a) de {{cal-bp-modules|Modules de Gödel}} donne $\forall z < 0\ f(v, z) = 0$. Pour le pas, la seconde équation donne $\Sigma_f(v, S\,y) = 0 \leftrightarrow \exists u\, \exists e\, (\Sigma_f(v, y) = u \wedge f(v, y) = e \wedge 0 = u + e)$. Par le point (ii) de {{cal-pa-lois|Lois de + et ×}} et $0 + 0 = 0$, $0 = u + e$ équivaut à $u = 0 \wedge e = 0$, et (i) donne l'équivalence avec $\Sigma_f(v, y) = 0 \wedge f(v, y) = 0$. L'hypothèse de récurrence et le point (i) (c) de {{cal-bp-modules|Modules de Gödel}}, appliqué à la formule $f(v, z) = 0$, concluent.

      *Produit.* De même, $\Pi_f(v, 0) = 0$ équivaut à $0 = S\,0$, exclu par $\mathrm Q_1$. Pour le pas, $\Pi_f(v, S\,y) = 0$ équivaut à $\exists u\, \exists e\, (\Pi_f(v, y) = u \wedge f(v, y) = e \wedge 0 = u \times e)$ ; par l'intégrité et les égalités $0 \times e = 0$, $u \times 0 = 0$ ({{cal-pa-lois|Lois de + et ×}}, (iii), (iv)), $0 = u \times e$ équivaut à $u = 0 \vee e = 0$, et l'existence des valeurs $u$ et $e$, point (ii) de {{cal-bp-fonctions|Fonctions p.r. dans PA}}, et (i) donnent l'équivalence avec $\Pi_f(v, y) = 0 \vee f(v, y) = 0$. La contraposition, l'hypothèse de récurrence et le point (i) (c) de {{cal-bp-modules|Modules de Gödel}} concluent.

      *Valeurs 0 et 1.* Sous l'hypothèse sur $f$, montrons $\forall w\, \big(\Pi_f(v, y) = w \to (w = 0 \vee w = S\,0)\big)$ par récurrence sur $y$. Pour $0$, $\Pi_f(v, 0) = w$ équivaut à $w = S\,0$. Pour le pas, sous l'hypothèse $\Pi_f(v, S\,y) = w$, l'élimination fournit $u$ et $e$ tels que $\Pi_f(v, y) = u$, $f(v, y) = e$ et $w = u \times e$ ; l'hypothèse de récurrence, instanciée par $u$, et l'hypothèse sur $f$ donnent $u, e \in \{0, S\,0\}$ au sens des disjonctions, et $u \times 0 = 0$, $u \times S\,0 = u$ donnent $w = 0 \vee w = S\,0$ dans les quatre cas.
    remarques:
      - |
        L'addition et la multiplication du langage sont des symboles, alors que celles de {{cal-pr-definition|Primitives récursives}} sont des fonctions construites par récurrence ; leurs définitions naturelles sont de longues formules, qui passent par la fonction $\beta$. Le point (ii) dit que $\mathsf{PA}$ les démontre équivalentes à $w = x + y$ et à $w = x \times y$ : on retrouve, à l'intérieur de $\mathsf{PA}$, le fait que les axiomes $\mathrm Q_4$ à $\mathrm Q_7$ sont les équations qui définissent l'addition et la multiplication par récurrence, comme chez Grassmann (troisième remarque du nœud {{cal-pa-lois|Lois de + et ×}}). L'erreur la plus répandue est de croire que cette identification va de soi : elle demande le point (v) du nœud précédent, c'est-à-dire une récurrence dans $\mathsf{PA}$.
      - |
        Les caractérisations (iii) et (iv) ont été vérifiées sur les entiers par un calcul : pour $x, y, w \leqslant 40$, la formule de (iii) vaut exactement quand $w = x \mathbin{\dot{-}} y$, et elle satisfait les deux équations de récurrence de la soustraction tronquée ; la variante $y \leqslant x \wedge w + y = x$, sans le premier cas, viole la seconde dès $x = y = 0$, ce qui montre que le cas $x \leqslant y$ n'est pas une précaution. Les sommes et les produits de (v) servent au nœud suivant, où ils traduisent les quantifications bornées de {{cal-pr-cloture|Clôture}}.

  - id: cal-bp-relations
    etiquette: Relations p.r. dans PA
    nature: théorème
    titre: Formule naturelle d'une relation primitive récursive et clauses de clôture dans l'arithmétique de Peano
    texte: |
      Les conventions sont celles de {{cal-bp-usuelles|Fonctions usuelles dans PA}}. Soit $R \subset \mathbb N^n$ une relation primitive récursive ({{cal-pr-cloture|Clôture}}), donnée avec une construction de sa [[fonction-caracteristique-relation|fonction caractéristique]] $\chi_R$, et $v_1, \dots, v_n$, $w$ des variables distinctes. Avec la définition naturelle de $\chi_R$, la *formule naturelle* de $R$ est la formule $\hat R(v)$ :
      $$\exists w\, \big(\chi_R(v) = w \wedge \neg(w = 0)\big).$$
      Elle est dans $\mathcal S$, puisque $\neg(w = 0)$ est Δ₀, et, comme $\chi_R$ ne prend que les valeurs $0$ et $1$, elle définit $R$ dans $\mathcal N$. Pour des termes $t_k$ dont aucune variable n'est quantifiée dans $\hat R$, on note $\hat R(t_1, \dots, t_n)$ la formule $\hat R[t/v]$ ; dans chaque énoncé, la variable liée $w$ de $\hat R$ et les variables liées de la définition de $\chi_R$ sont prises distinctes de toutes les variables qui y figurent par ailleurs, ce qui est permis par le choix de la partie $V$ et par le point (vii) de {{cal-bp-fonctions|Fonctions p.r. dans PA}}. On dit que $\chi_R$ est *booléenne dans* $\mathsf{PA}$ si $\vdash_{\mathsf{PA}} \chi_R(v) = w \to (w = 0 \vee w = S\,0)$.

      Les constructions sont celles des preuves de {{cal-pr-cloture|Clôture}}, écrites avec les fonctions du nœud précédent : $\chi_\leqslant = \overline{\mathrm{sg}} \circ {\dot{-}}$, $\chi_< = \mathrm{sg} \circ {\dot{-}} \circ (P^2_2, P^2_1)$, $\chi_= = \overline{\mathrm{sg}} \circ \mathrm{add} \circ \big({\dot{-}},\ {\dot{-}} \circ (P^2_2, P^2_1)\big)$ ; $\chi_{\neg R} = \overline{\mathrm{sg}} \circ \chi_R$, qui calcule $1 \mathbin{\dot{-}} \chi_R$, $\chi_{R \wedge R'} = \mathrm{mul} \circ (\chi_R, \chi_{R'})$, $\chi_{R \vee R'} = \mathrm{sg} \circ \mathrm{add} \circ (\chi_R, \chi_{R'})$, et $\chi_R \circ (g_1, \dots, g_m)$ pour la relation $R(g_1(v), \dots, g_m(v))$ ; pour $R \subset \mathbb N^{n+1}$, de variables $v, z$, $\chi_{\exists z < y\, R} = \mathrm{sg} \circ \Sigma_{\chi_R}$ et $\chi_{\forall z < y\, R} = \Pi_{\chi_R}$. La définition par cas et la minimisation bornée sont précisées dans l'énoncé.
    enonce: |
      (i) **Négation.** $\vdash_{\mathsf{PA}} \neg\hat R(v) \leftrightarrow \chi_R(v) = 0$, formule de $\mathcal S$. Si $\chi_R$ est booléenne, $\vdash_{\mathsf{PA}} \hat R(v) \leftrightarrow \chi_R(v) = S\,0$.

      (ii) **Relations de base.** Pour les relations $x = y$, $x < y$ et $x \leqslant y$, avec les variables $v_1, v_2$, les formules naturelles vérifient $\vdash_{\mathsf{PA}} \hat R(v_1, v_2) \leftrightarrow v_1 = v_2$, $v_1 < v_2$ et $v_1 \leqslant v_2$ respectivement, et leurs fonctions caractéristiques sont booléennes.

      (iii) **Connecteurs, substitution.** On a $\vdash_{\mathsf{PA}} \widehat{\neg R} \leftrightarrow \neg\hat R$, $\vdash_{\mathsf{PA}} \widehat{R \wedge R'} \leftrightarrow (\hat R \wedge \hat R')$, $\vdash_{\mathsf{PA}} \widehat{R \vee R'} \leftrightarrow (\hat R \vee \hat R')$, et, pour la relation $R(g_1(v), \dots, g_m(v))$, la formule naturelle équivaut dans $\mathsf{PA}$ à $\exists z_1 \cdots \exists z_m\, \big(g_1(v) = z_1 \wedge \cdots \wedge g_m(v) = z_m \wedge \hat R(z)\big)$. Les fonctions caractéristiques de $\neg R$ et de $R \vee R'$ sont booléennes ; celle de $R \wedge R'$ l'est si $\chi_R$ et $\chi_{R'}$ le sont, celle de $R(g_1(v), \dots, g_m(v))$ si $\chi_R$ l'est.

      (iv) **Quantifications bornées.** Pour $R \subset \mathbb N^{n+1}$, avec les variables $v, z$, et une variable $y$ distincte, $\vdash_{\mathsf{PA}} \widehat{\exists z < y\, R} \leftrightarrow \exists z < y\ \hat R$ et $\vdash_{\mathsf{PA}} \widehat{\forall z < y\, R} \leftrightarrow \forall z < y\ \hat R$. La première fonction caractéristique est booléenne, la seconde l'est si $\chi_R$ l'est.

      (v) **Définition par cas.** Soit $R_1, \dots, R_k \subset \mathbb N^n$ des relations dont les fonctions caractéristiques sont booléennes, $g_1, \dots, g_k$ des fonctions primitives récursives d'[[arite|arité]] $n$, et $f$ la composée, par $\mathrm{add}$ et $\mathrm{mul}$, qui calcule $(\cdots(g_1 \cdot \chi_{R_1} + g_2 \cdot \chi_{R_2}) + \cdots) + g_k \cdot \chi_{R_k}$, comme au point (ii) de {{cal-pr-cloture|Clôture}}. Pour chaque $i$,
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\Big(\hat R_i(v) \wedge \bigwedge_{l \neq i} \neg\hat R_l(v)\Big) \\ &\to \big(f(v) = w \leftrightarrow g_i(v) = w\big). \end{aligned}$$

      (vi) **Minimisation bornée.** Pour $R \subset \mathbb N^{n+1}$, avec les variables $v, z$, soit $\mu$ la fonction $\mu z < y\, R(v, z)$, construite comme au point (iv) de {{cal-pr-cloture|Clôture}} : $\mu = \Sigma_p$, où $p(v, t) = \Pi_{f'}(v, S\,t)$ et $f' = \overline{\mathrm{sg}} \circ \chi_R$, qui calcule $1 \mathbin{\dot{-}} \chi_R$. Soit $y$, $w$, $u$ des variables distinctes entre elles et des $v_k$ et de $z$, et supposons que la variable liée de $\hat R$ et les variables liées de la définition de $\chi_R$ soient distinctes de $w$, de $y$ et de $u$. Alors
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\mu(v, y) = w \leftrightarrow \Big(\big(w < y \wedge \hat R(v, w) \\ &\quad \wedge \forall z < w\ \neg\hat R(v, z)\big) \\ &\vee \big(w = y \wedge \forall z < y\ \neg\hat R(v, z)\big)\Big). \end{aligned}$$
    preuve: |
      (i) Sous les hypothèses $\chi_R(v) = e$, $\neg(e = 0)$ et $\chi_R(v) = 0$, le point (ii) de {{cal-bp-fonctions|Fonctions p.r. dans PA}} donne $e = 0$, contradiction ; l'élimination de $e$ donne $\hat R(v) \to \neg(\chi_R(v) = 0)$. Réciproquement, ce point fournit $e$ tel que $\chi_R(v) = e$ ; si $e = 0$, le remplacement donne $\chi_R(v) = 0$, et sinon l'introduction donne $\hat R(v)$. La formule $\chi_R(v) = 0$ est dans $\mathcal S$ par le point (i) du même nœud. Si $\chi_R$ est booléenne, $\chi_R(v) = e$ et $\neg(e = 0)$ donnent $e = S\,0$, et réciproquement $\chi_R(v) = S\,0$ et $\neg(S\,0 = 0)$ donnent $\hat R(v)$.

      Dans la suite, pour une fonction caractéristique donnée par une composition $f \circ (g_1, \dots, g_m)$, on raisonne sous des hypothèses $g_j(v) = e_j$, dont les variables $e_j$ existent par le point (ii) de {{cal-bp-fonctions|Fonctions p.r. dans PA}} et s'éliminent à la fin : le point (i) de {{cal-bp-usuelles|Fonctions usuelles dans PA}} ramène alors la valeur de la composée à $f(e_1, \dots, e_m)$, c'est ce qu'on appelle l'écrire avec les valeurs $e_j$. La définition de $\chi_R$ qui figure dans celle de $\chi_{\neg R}$, de $\chi_{R \wedge R'}$, de $\chi_{R \vee R'}$, de $\chi_R \circ (g_1, \dots, g_m)$, de $\Sigma_{\chi_R}$, de $\Pi_{\chi_R}$ ou de $f'$ est écrite avec d'autres variables que celle qui sert à $\hat R$ ; le point (vii) de {{cal-bp-fonctions|Fonctions p.r. dans PA}} les identifie, et l'on emploie librement l'une pour l'autre. On emploie (i) pour passer de $\hat R$ à $\neg(\chi_R(v) = 0)$ et de $\neg\hat R$ à $\chi_R(v) = 0$.

      (ii) Par le point (iv) de {{cal-bp-usuelles|Fonctions usuelles dans PA}}, $\neg(\overline{\mathrm{sg}}(e) = 0)$ équivaut à $e = 0$, et $\neg(\mathrm{sg}(e) = 0)$ à $\neg(e = 0)$ ; les valeurs de $\overline{\mathrm{sg}}$ et de $\mathrm{sg}$ sont $0$ ou $S\,0$, ce qui donne les trois fonctions booléennes. Par le point (iii) du même nœud, $v_1 \mathbin{\dot{-}} v_2 = 0$ équivaut à $v_1 \leqslant v_2 \vee (v_2 \leqslant v_1 \wedge 0 + v_2 = v_1)$, donc à $v_1 \leqslant v_2$, puisque le second cas donne $v_1 = v_2$. Ainsi $\hat R(v_1, v_2)$ équivaut à $v_1 \leqslant v_2$ pour $\chi_\leqslant$, et à $\neg(v_2 \leqslant v_1)$ pour $\chi_<$, qui équivaut à $v_1 < v_2$ par les points (iv) et (v) de {{cal-pa-ordre|Ordre dans PA}}. Pour $\chi_=$, $\hat R(v_1, v_2)$ équivaut à $(v_1 \mathbin{\dot{-}} v_2) + (v_2 \mathbin{\dot{-}} v_1) = 0$, écrite avec les valeurs $e$, $e'$ des deux différences, puis, par le point (ii) de {{cal-pa-lois|Lois de + et ×}}, à $e = 0 \wedge e' = 0$, c'est-à-dire à $v_1 \leqslant v_2 \wedge v_2 \leqslant v_1$, qui équivaut à $v_1 = v_2$ par l'[[relation-antisymetrique|antisymétrie]] et la réflexivité.

      (iii) Par (i) et le point (iv) de {{cal-bp-usuelles|Fonctions usuelles dans PA}}, $\widehat{\neg R}$ équivaut à $\neg(\overline{\mathrm{sg}}(\chi_R(v)) = 0)$, écrite avec la valeur $e$ de $\chi_R(v)$, donc à $e = 0$, c'est-à-dire à $\chi_R(v) = 0$, et à $\neg\hat R$. Pour $R \wedge R'$, avec les valeurs $e$ et $e'$, $\neg(e \times e' = 0)$ équivaut à $\neg(e = 0) \wedge \neg(e' = 0)$ par l'intégrité et $0 \times e' = 0$, $e \times 0 = 0$ ; pour $R \vee R'$, $\neg(\mathrm{sg}(e + e') = 0)$ équivaut à $\neg(e + e' = 0)$, donc à $\neg(e = 0) \vee \neg(e' = 0)$ par le point (ii) de {{cal-pa-lois|Lois de + et ×}}. Pour la substitution, $\exists w\, (\exists z\, (\cdots \wedge \chi_R(z) = w) \wedge \neg(w = 0))$ équivaut à $\exists z\, (\cdots \wedge \hat R(z))$ par les règles du point (i) de {{cal-bp-usuelles|Fonctions usuelles dans PA}} et l'échange de deux [[quantificateur-existentiel|quantificateurs existentiels]], qui découle de l'introduction et de l'élimination. Les valeurs de $\overline{\mathrm{sg}}$ et de $\mathrm{sg}$ sont $0$ ou $S\,0$ ; un produit de deux éléments de $\{0, S\,0\}$ y est encore, par $e \times 0 = 0$ et $e \times S\,0 = e$ ; et une instance de $\chi_R(z) = w \to (w = 0 \vee w = S\,0)$ donne la dernière assertion.

      (iv) Par (i) et le point (iv) de {{cal-bp-usuelles|Fonctions usuelles dans PA}}, $\widehat{\exists z < y\, R}$ équivaut à $\neg(\Sigma_{\chi_R}(v, y) = 0)$, donc, par le point (v) du même nœud, à $\neg\forall z < y\ \chi_R(v, z) = 0$. Par (i), $\chi_R(v, z) = 0$ équivaut à $\neg\hat R(v, z)$, et le point (vii) (e) de {{cal-pa-ordre|Ordre dans PA}}, appliqué sous la borne aux deux implications, donne $\neg\forall z < y\ \neg\hat R(v, z)$, qui est $\exists z < y\ \hat R$. De même, $\widehat{\forall z < y\, R}$ est $\exists w\, (\Pi_{\chi_R}(v, y) = w \wedge \neg(w = 0))$, qui équivaut par (i) à $\neg(\Pi_{\chi_R}(v, y) = 0)$, donc à $\forall z < y\ \neg(\chi_R(v, z) = 0)$, c'est-à-dire à $\forall z < y\ \hat R$. Les assertions sur les fonctions booléennes viennent de $\mathrm{sg}$ et du point (v) du même nœud.

      (v) Par récurrence sur $k$, les points (i) et (ii) de {{cal-bp-usuelles|Fonctions usuelles dans PA}} montrent que, sous les hypothèses $g_l(v) = y_l$ et $\chi_{R_l}(v) = c_l$, avec les valeurs $y_l$ et $c_l$, la formule $f(v) = w$ équivaut à $w = (\cdots(y_1 \times c_1 + y_2 \times c_2) + \cdots) + y_k \times c_k$, et $g_i(v) = w$ à $w = y_i$. Sous l'hypothèse supplémentaire $\hat R_i(v) \wedge \bigwedge_{l \neq i} \neg\hat R_l(v)$, le point (i), le caractère booléen et l'unicité des valeurs donnent $c_i = S\,0$ et $c_l = 0$ pour $l \neq i$ ; les égalités $y \times 0 = 0$, $y \times S\,0 = y$, $0 + t = t$ et $t + 0 = t$ ({{cal-pa-lois|Lois de + et ×}}) réduisent la somme à $y_i$, d'où $f(v) = w \leftrightarrow g_i(v) = w$. On élimine enfin les valeurs, qui existent par le point (ii) de {{cal-bp-fonctions|Fonctions p.r. dans PA}} et ne figurent pas dans la conclusion.

      (vi) Notons $N(t)$ la formule $\forall z < t\ \neg\hat R(v, z)$ et $\psi$ le second membre. Par le point (iv) de {{cal-bp-usuelles|Fonctions usuelles dans PA}}, $f'$ est booléenne et $\neg(f'(v, z) = 0)$ équivaut à $\chi_R(v, z) = 0$, donc à $\neg\hat R(v, z)$. Par les points (v) et (i) du même nœud, $p$ est booléenne et $\neg(p(v, t) = 0)$ équivaut à $N(S\,t)$ ; ainsi $p(v, t) = S\,0 \leftrightarrow N(S\,t)$ et $p(v, t) = 0 \leftrightarrow \neg N(S\,t)$. Par le point (i) du même nœud, $g(v, y, u) = w$ équivaut à $\exists e\, (p(v, y) = e \wedge w = u + e)$. Appliquons le point (v) de {{cal-bp-fonctions|Fonctions p.r. dans PA}} à $\psi$.

      Pour $0$ : $w < 0$ est exclu, et $N(0)$ est démontrable ({{cal-bp-modules|Modules de Gödel}}, (i) (a)), donc $\psi[0/y]$ équivaut à $w = 0$. Pour $S\,y$, le point (i) (c) du même nœud donne $N(S\,y) \leftrightarrow (N(y) \wedge \neg\hat R(v, y))$, et l'on raisonne par cas.

      Si $N(S\,y)$ : alors $p(v, y) = S\,0$, et le second membre de la seconde hypothèse équivaut à $\exists u\, (\psi[u/w] \wedge w = u + S\,0)$. Sous $N(y)$, la formule $\psi[u/w]$ équivaut à $u = y$, puisque $u < y$ et $\hat R(v, u)$ contrediraient $N(y)$ ; le tout équivaut donc à $w = S\,y$. De même, $\psi[S\,y/y]$ équivaut à $w = S\,y$, puisque $w < S\,y$ et $\hat R(v, w)$ contrediraient $N(S\,y)$.

      Si $\neg N(S\,y)$ : alors $p(v, y) = 0$, et le second membre équivaut à $\exists u\, (\psi[u/w] \wedge w = u + 0)$, c'est-à-dire à $\psi$, par (i) de {{cal-bp-usuelles|Fonctions usuelles dans PA}} et $\mathrm Q_4$ ; il reste à voir $\psi[S\,y/y] \leftrightarrow \psi$, dont les seconds cas sont exclus pour $S\,y$. Sous $N(y)$, on a $\hat R(v, y)$ ; $\psi$ équivaut à $w = y$, et $\psi[S\,y/y]$ aussi : $w = y$ en est un témoin, et, si $w < S\,y$ et $\hat R(v, w)$ et $N(w)$, alors $w < y$ contredirait $N(y)$, donc $w = y$. Sous $\neg N(y)$, $\psi$ se réduit à son premier cas, $w = y$ étant exclu, et les premiers cas pour $y$ et pour $S\,y$ sont équivalents : $w < y$ donne $w < S\,y$, et réciproquement $w < S\,y$ donne $w < y$ ou $w = y$, et $w = y$ avec $N(w)$ contredirait $\neg N(y)$.
    remarques:
      - |
        On a pris $\neg(w = 0)$ plutôt que $w = S\,0$ dans la formule naturelle. Les clauses (i), (iii) et (iv) valent ainsi sans savoir que $\chi_R$ ne prend que les valeurs $0$ et $1$ : cette propriété est vraie dans $\mathcal N$, mais sa démonstration dans $\mathsf{PA}$ dépend de la construction, et elle n'est assurée ici que pour les constructions des points (ii) à (iv). La définition par cas, seule, en a besoin, parce qu'elle multiplie par la valeur de $\chi_{R_i}$. L'erreur la plus répandue est de croire que la négation d'une formule de $\mathcal S$ reste dans $\mathcal S$ : ce n'est pas le cas en général, et c'est l'unicité de la valeur qui place ici $\neg\hat R$ dans $\mathcal S$, sous la forme $\chi_R(v) = 0$.
      - |
        Le point (vi) a été vérifié sur les entiers, pour toutes les relations $R \subset \{0, \dots, 5\}$ et tous $y \leqslant 7$ : la formule de droite vaut exactement quand $w$ est le plus petit $z < y$ qui vérifie $R$, ou $y$ s'il n'y en a pas, et elle satisfait les deux équations de récurrence de la somme ; une variante sans la clause $\forall z < w\ \neg\hat R(v, z)$ les viole, et la valeur de la somme serait alors confondue avec celle d'un témoin quelconque.
      - |
        Ce nœud fixe la convention des chapitres suivants. Une relation primitive récursive y est toujours donnée avec la construction de sa fonction caractéristique que fournissent les preuves de {{cal-pr-cloture|Clôture}} et des nœuds de l'{{cal-syntaxe|arithmétisation de la syntaxe}}, et elle est écrite dans $\mathsf{PA}$ par sa formule naturelle. La formule naturelle de démontrabilité d'une théorie $T$ dont les axiomes forment un ensemble récursivement énumérable sera ainsi $\exists p\ \widehat{D}(p, v)$, où $D(p, c)$ est la relation primitive récursive « $\mathrm{Dem}_{T'}(p, c)$ et $c$ code un énoncé », avec la relation $\mathrm{Dem}_{T'}$ du nœud {{cal-sx-demonstrations|Démonstrations}} pour la théorie $T'$ à axiomes primitifs récursifs du {{cal-craig|théorème de Craig}}, qui a les mêmes théorèmes que $T$, et l'ensemble primitif récursif des codes des énoncés du nœud {{cal-theoremes|Théorèmes r.e.}}, (i). La clause « $c$ code un énoncé » est indispensable : $\mathrm{Dem}_{T'}(p, c)$ porte sur une formule quelconque, et $\exists p\ \mathrm{Dem}_{T'}(p, c)$ définit l'ensemble des codes des formules démontrables, qui contient par exemple le code de $x_0 = x_0$, alors qu'une {{cal-dg-prov|formule de démontrabilité}} doit définir l'ensemble $\mathrm{Th}(T)$ des codes des énoncés démontrés. Pour $T = \mathsf{PA}$, dont les axiomes forment déjà un ensemble primitif récursif, on peut prendre $T' = T$ ; en général, la « définition naturelle de l'ensemble des axiomes » de l'énoncé de {{l-incompletude|Incomplétude}} passera par la construction de Craig. C'est une formule de $\mathcal S$, que le point (ii) du nœud {{cal-pa-sigma|Collection et forme Σ₁}} ramène, dans $\mathsf{PA}$, à une formule $\exists y\, \delta$ ; les points (iii) à (vi) permettront de démontrer dans $\mathsf{PA}$ les propriétés des démonstrations codées dont ont besoin les conditions (D2) et (D3).

