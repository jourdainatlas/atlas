# Niveau 2 : structure interne du chapitre « Σ₁-complétude formalisée et troisième condition de dérivabilité »
# (nœud cal-sigma-pa du graphe calc, après cal-instances-pa et cal-diagonal). Derniers sous-lots (C3c, C4) de la
# démonstration, dans PA, des conditions de dérivabilité de la formule naturelle de démontrabilité : gabarits à
# plusieurs places ; propriétés locales des lettres (paramètres non quantifiés) ; substitution lettre à lettre dans
# un code variable ; instanciation, (D1), (D2) et introduction de ∃ à plusieurs paramètres ; valeurs des termes sous
# Prf ; Σ₁-complétude formalisée pour les formules Δ₀ propres et les formules ∃yδ ; (D3), théorème de Löb et second
# théorème pour la formule naturelle. Lève le dernier admis a-faire de l'édifice (point (ii) de l-incompletude).
# Constructions : celles de cal-pr-codage, cal-pr-cloture, cal-sx-*, cal-tarski (i) et des chapitres cal-syntaxe-pa,
# cal-instances-pa, lues littéralement. Tout est démontré dans le système de l-deduction, avec les règles de
# cal-rp-calcul, cal-pa-recurrence et des chapitres cal-peano, cal-beta-pa, cal-syntaxe-pa, cal-instances-pa.
# Aucune forme de l'axiome du choix. Identifiants « cal-sg- ». Dépend de cal-diagonal par cal-dg-second seulement.

graphe: cal-sigma-pa
titre: Σ₁-complétude formalisée et (D3)
conteneur: cal-sigma-pa

entrees:
  cal-instances-pa: [cal-sg-gabarits]
  cal-diagonal: [cal-sg-d3]

noeuds:
  - id: cal-sg-gabarits
    etiquette: Gabarits à plusieurs places
    nature: proposition
    titre: Gabarits à plusieurs places et codes des instances à plusieurs paramètres
    texte: |
      Les conventions sont celles de {{cal-ip-substitution|Substitution dépliée}} et de {{cal-ip-instances|Formules des instances}}. Un *gabarit à $r$ places* est une suite finie $G = (g_0, \dots, g_{m-1})$ dont chaque terme est un entier ou l'un des signes $\diamond_1, \dots, \diamond_r$, qui peuvent ne pas tous y figurer. Pour des termes fonctionnels $\tau_1, \dots, \tau_r$, notés $\bar\tau$, on définit le terme fonctionnel $\llbracket G \rrbracket(\bar\tau)$ par récurrence sur $m$ : la suite vide donne $0$ ; si $G'$ est $G$ suivi de l'entier $c$, alors $\llbracket G' \rrbracket(\bar\tau) = \mathrm{aj}\big(\llbracket G \rrbracket(\bar\tau), \underline c\big)$ ; si $G'$ est $G$ suivi du signe $\diamond_i$, alors $\llbracket G' \rrbracket(\bar\tau) = \mathrm{conc}\big(\llbracket G \rrbracket(\bar\tau), \tau_i\big)$. Pour $r = 1$, ce sont les gabarits de {{cal-ip-substitution|Substitution dépliée}}. Le terme $\tau_i$ ne figure dans $\llbracket G \rrbracket(\bar\tau)$ que si $\diamond_i$ figure dans $G$ : ajouter ou retirer une place qui ne figure pas ne change pas le terme fonctionnel. On note $GH$ la suite $G$ suivie de la suite $H$, $G[H/\diamond_i]$ le gabarit obtenu en remplaçant chaque signe $\diamond_i$ de $G$ par la suite $H$, et $\bar\tau[\sigma]_i$ la suite $\bar\tau$ dont le $i$-ième terme est remplacé par $\sigma$.

      Soit $\bar x = (x_1, \dots, x_r)$ une suite de variables distinctes, avec $x_i = a_{k_i}$. Pour un mot $w = a_{c_0} \cdots a_{c_{m-1}}$, le gabarit $G_{\bar x}(w)$ a pour terme de rang $j$ le signe $\diamond_i$ si $c_j = k_i$, et l'entier $c_j$ si $c_j$ n'est aucun des $k_i$ : on marque, lettre à lettre, toutes les lettres $x_i$. On pose $\ulcorner w \urcorner_{\bar x}(\bar\tau) = \llbracket G_{\bar x}(w) \rrbracket(\bar\tau)$ et, pour des termes $s_1, \dots, s_r$ du langage,
      $$\begin{aligned} &\ulcorner w[\dot s_1, \dots, \dot s_r/\bar x] \urcorner \\ &\quad = \ulcorner w \urcorner_{\bar x}\big(\mathrm{num}(s_1), \dots, \mathrm{num}(s_r)\big), \end{aligned}$$
      abrégé $\ulcorner w[\dot{\bar s}/\bar x] \urcorner$ ; quand les $s_i$ sont les variables $x_i$ elles-mêmes, on écrit $\ulcorner w(\dot{\bar x}) \urcorner$. Pour $r = 0$, c'est un terme fonctionnel clos, dont $\mathsf{PA}$ démontre l'égalité avec le chiffre $\underline{\ulcorner w \urcorner}$, par le texte de {{cal-ip-substitution|Substitution dépliée}} ; on les emploie l'un pour l'autre.

      Les $x_i$ sont des *paramètres* de $w$ si aucune d'elles n'est quantifiée dans $w$, au sens de {{cal-rp-calcul|Calcul à variables libres}} ; pour une formule, c'est dire qu'aucune lettre $\forall$ n'est suivie d'une lettre $x_i$, puisque chaque lettre $\forall$ d'une formule est suivie de la variable de son bloc ({{cal-sx-libres|Variables libres}}). Chaque lettre $x_i$ est alors une [[occurrence|occurrence]] libre : elle ne suit pas une lettre $\forall$, et aucun bloc $\forall x_i$ ne la lie. Ainsi $G_{\bar x}(w)$ marque exactement les occurrences libres des $x_i$ ; pour $r = 1$, c'est le gabarit $G_k(w)$ de {{cal-ip-substitution|Substitution dépliée}}, de sorte que $\ulcorner w[\dot y/x] \urcorner$ est le [[code-mot|code]] de {{cal-ip-instances|Formules des instances}}. Pour des termes $t_i$, le mot de code $\ulcorner w \urcorner_{\bar x}(\ulcorner t_1 \urcorner, \dots, \ulcorner t_r \urcorner)$ est la substitution simultanée $w[t_1, \dots, t_r/\bar x]$, et, pour des entiers $n_1, \dots, n_r$, le point (iv) de {{cal-sp-termes|Termes fonctionnels}} donne $\vdash_{\mathsf{PA}} \ulcorner w[\dot{\bar y}/\bar x] \urcorner[\underline{n_1}, \dots, \underline{n_r}/\bar y] = \underline{\ulcorner w[\underline{n_1}, \dots, \underline{n_r}/\bar x] \urcorner}$.

      La définition lettre à lettre rend le calcul des gabarits immédiat. On a $G_{\bar x}(uv) = G_{\bar x}(u)\, G_{\bar x}(v)$ pour des mots $u$ et $v$ ; en notation préfixée, avec $(c)$ pour le gabarit réduit à l'entier $c$,
      $$\begin{aligned} G_{\bar x}(\neg\varphi) &= (1)\, G_{\bar x}(\varphi), \\ G_{\bar x}({\to}\, \varphi\, \psi) &= (2)\, G_{\bar x}(\varphi)\, G_{\bar x}(\psi), \\ G_{\bar x}(\forall z\, \varphi) &= (3)(c)\, G_{\bar x}(\varphi), \\ G_{\bar x}({=}\, t\, u) &= (0)\, G_{\bar x}(t)\, G_{\bar x}(u), \end{aligned}$$
      pour $z = a_c$ hors de $\bar x$, de même pour $S$, $+$ et $\times$, et $G_{\bar x}(x_i) = (\diamond_i)$. Enfin, si $u$ est une variable hors de $\bar x$ qui ne figure pas dans $w$, et $x$ une variable hors de $\bar x$ qui n'est pas quantifiée dans $w$, alors $G_{\bar x, u}(w[u/x]) = G_{\bar x, x}(w)$ : renommer un paramètre ne change pas le gabarit, donc $\ulcorner w[u/x] \urcorner_{\bar x, u}(\bar\tau, \tau)$ et $\ulcorner w \urcorner_{\bar x, x}(\bar\tau, \tau)$ sont le même terme fonctionnel.
    enonce: |
      Soit $G$ et $H$ des gabarits à $r$ places, $\bar\tau$ une suite de $r$ termes fonctionnels et $\bar x = (x_1, \dots, x_r)$ une suite de variables distinctes.

      (i) **Concaténation.** $\vdash_{\mathsf{PA}} \llbracket GH \rrbracket(\bar\tau) = \mathrm{conc}\big(\llbracket G \rrbracket(\bar\tau), \llbracket H \rrbracket(\bar\tau)\big)$ et, si $\diamond_i$ figure dans $G$, $\vdash_{\mathsf{PA}} \tau_i \leqslant \llbracket G \rrbracket(\bar\tau)$.

      (ii) **Remplissage.** $\vdash_{\mathsf{PA}} \llbracket G[H/\diamond_i] \rrbracket(\bar\tau) = \llbracket G \rrbracket\big(\bar\tau[\llbracket H \rrbracket(\bar\tau)]_i\big)$. On a $\vdash_{\mathsf{PA}} \llbracket (4) \rrbracket = \mathrm{num}(0)$ et, pour tout terme fonctionnel $\rho$, $\vdash_{\mathsf{PA}} \llbracket (5)(\diamond_j) \rrbracket\big(\bar\tau[\mathrm{num}(\rho)]_j\big) = \mathrm{num}(S\,\rho)$.

      (iii) **Substitution d'un terme.** Soit $w$ un mot, $x_i$ un paramètre de $w$ et $s$ un terme. Alors
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\ulcorner w[s/x_i] \urcorner_{\bar x}(\bar\tau) \\ &= \ulcorner w \urcorner_{\bar x}\big(\bar\tau[\ulcorner s \urcorner_{\bar x}(\bar\tau)]_i\big). \end{aligned}$$
      En particulier, $\vdash_{\mathsf{PA}} \ulcorner w[0/x_i] \urcorner_{\bar x}(\bar\tau) = \ulcorner w \urcorner_{\bar x}(\bar\tau[\mathrm{num}(0)]_i)$ et, si $\tau_j$ est $\mathrm{num}(\rho)$, $\vdash_{\mathsf{PA}} \ulcorner w[S\,x_j/x_i] \urcorner_{\bar x}(\bar\tau) = \ulcorner w \urcorner_{\bar x}(\bar\tau[\mathrm{num}(S\,\rho)]_i)$.

      (iv) **Formation.** Si les $x_i$ sont des paramètres du terme $t$ et de la formule $\varphi$, alors $\mathsf{PA}$ démontre
      $$\begin{aligned} &\big(\widehat{\mathrm{Tm}}(\tau_1) \wedge \cdots \wedge \widehat{\mathrm{Tm}}(\tau_r)\big) \\ &\quad \to \big(\widehat{\mathrm{Tm}}(\ulcorner t \urcorner_{\bar x}(\bar\tau)) \wedge \widehat{\mathrm{Fm}}(\ulcorner \varphi \urcorner_{\bar x}(\bar\tau))\big). \end{aligned}$$
      En particulier, pour des variables $y_1, \dots, y_r$, $\vdash_{\mathsf{PA}} \widehat{\mathrm{Fm}}(\ulcorner \varphi[\dot{\bar y}/\bar x] \urcorner)$.
    preuve: |
      (i) La preuve du point (i) de {{cal-ip-substitution|Substitution dépliée}} s'applique mot pour mot, le signe $\diamond_i$ et le terme $\tau_i$ prenant la place de $\diamond$ et de $\tau$ : par récurrence sur la longueur de $H$, en [[metatheorie|métathéorie]], avec le point (iv) de {{cal-sp-concatenation|Concaténation dans PA}} et l'associativité ({{cal-ip-facteurs|Facteurs dans PA}}, (ii)), puis, si $G = G_1 \diamond_i G_2$, $\llbracket G \rrbracket(\bar\tau) = \mathrm{cc}(\llbracket G_1 \rrbracket(\bar\tau), \tau_i, \llbracket G_2 \rrbracket(\bar\tau))$, qui est au moins $\tau_i$ par le point (iv) de {{cal-ip-facteurs|Facteurs dans PA}}.

      (ii) Notons $\bar\tau' = \bar\tau[\llbracket H \rrbracket(\bar\tau)]_i$, et raisonnons par récurrence sur la longueur de $G$, en métathéorie. Si $G$ est vide, les deux membres valent $0$. Si $G$ est $G_1$ suivi de l'entier $c$, alors $G[H/\diamond_i]$ est $G_1[H/\diamond_i]$ suivi de $c$, et les deux membres sont $\mathrm{aj}(\cdot, \underline c)$ appliqué à deux termes égaux par l'hypothèse de récurrence. Si $G$ est $G_1$ suivi de $\diamond_j$ avec $j \neq i$, on conclut de même, puisque $\tau'_j = \tau_j$. Si $G$ est $G_1$ suivi de $\diamond_i$, alors $G[H/\diamond_i]$ est $G_1[H/\diamond_i]$ suivi de $H$, et (i) et l'hypothèse de récurrence donnent
      $$\begin{aligned} &\llbracket G[H/\diamond_i] \rrbracket(\bar\tau) \\ &\quad = \mathrm{conc}\big(\llbracket G_1 \rrbracket(\bar\tau'), \llbracket H \rrbracket(\bar\tau)\big), \end{aligned}$$
      qui est $\mathrm{conc}(\llbracket G_1 \rrbracket(\bar\tau'), \tau'_i) = \llbracket G \rrbracket(\bar\tau')$. Cela vaut même si $\diamond_i$ figure dans $H$, puisque $H$ est évalué en $\bar\tau$ et non en $\bar\tau'$.

      Le terme $\llbracket (4) \rrbracket = \mathrm{aj}(0, \underline 4)$ est clos, de valeur $\langle 4 \rangle = 9$, et $\vdash_{\mathsf{PA}} \mathrm{num}(0) = \underline 9$ par le point (iii) de {{cal-ip-formation|Formation dans PA}} ; le point (iv) de {{cal-sp-termes|Termes fonctionnels}} conclut. De même, $\llbracket (5)(\diamond_j) \rrbracket(\bar\tau[\mathrm{num}(\rho)]_j) = \mathrm{conc}(\mathrm{aj}(0, \underline 5), \mathrm{num}(\rho))$, et $\mathrm{aj}(0, \underline 5) = \underline{\langle 5 \rangle}$ par un calcul clos ; l'équation $\mathrm{num}(S\,x) = \mathrm{conc}(\underline{\langle 5 \rangle}, \mathrm{num}(x))$ du même point (iii), où l'on substitue $\rho$ à $x$ ({{cal-sp-termes|Termes fonctionnels}}, (ii) (b)), conclut.

      (iii) Comme $x_i$ est un paramètre de $w$, chaque lettre $x_i$ de $w$ est une occurrence libre, par le texte, et $w[s/x_i]$ s'obtient en remplaçant chacune de ces lettres par le mot $s$. Lettre à lettre, $G_{\bar x}(w[s/x_i])$ est donc $G_{\bar x}(w)[G_{\bar x}(s)/\diamond_i]$, et (ii) donne l'égalité. Pour $s = 0$, $G_{\bar x}(0) = (4)$ ; pour $s = S\,x_j$, $G_{\bar x}(S\,x_j) = (5)(\diamond_j)$ ; la seconde partie de (ii) conclut.

      (iv) Par récurrence sur la construction de $t$, puis de $\varphi$, en métathéorie, sous les hypothèses $\widehat{\mathrm{Tm}}(\tau_i)$, exactement comme au point (i) de {{cal-ip-instances|Formules des instances}}, avec les égalités de gabarits du texte et (i) à la place du point (iii) de {{cal-ip-substitution|Substitution dépliée}}. Si $t$ est $x_i$, $\ulcorner t \urcorner_{\bar x}(\bar\tau) = \mathrm{conc}(0, \tau_i) = \tau_i$, qui code un terme par hypothèse ; si $t$ est $0$ ou une variable hors de $\bar x$, c'est un terme fonctionnel clos, et $\widehat{\mathrm{Tm}}$ en est un calcul clos ; les cas $S$, $+$, $\times$ et le cas atomique découlent des points (i) et (ii) de {{cal-ip-formation|Formation dans PA}}. Les cas $\neg\varphi$ et ${\to}\, \varphi\, \psi$ découlent du point (ii) du même nœud. Dans $\forall z\, \varphi$, la variable $z = a_c$ est quantifiée, donc hors de $\bar x$, les $x_i$ sont des paramètres de $\varphi$, et $\ulcorner \forall z\, \varphi \urcorner_{\bar x}(\bar\tau) = \mathrm{conc}(\underline{\langle 3, c \rangle}, \ulcorner \varphi \urcorner_{\bar x}(\bar\tau))$, par (i) et le calcul clos $\llbracket (3)(c) \rrbracket = \underline{\langle 3, c \rangle}$ ; le même point (ii) conclut, avec $c \geqslant 8$. La dernière formule s'en déduit, puisque $\vdash_{\mathsf{PA}} \widehat{\mathrm{Tm}}(\mathrm{num}(y_i))$ ({{cal-ip-formation|Formation dans PA}}, (iii)).
    remarques:
      - |
        Le gabarit $G_{\bar x}(w)$ ne demande de connaître ni les sous-formules ni les portées : il suffit de lire les lettres. C'est ce qui le distingue du gabarit $G_k(w)$ de {{cal-ip-substitution|Substitution dépliée}}, défini par les occurrences libres, donc par la relation $\mathrm{Lib}$ ; les deux coïncident quand la variable n'est pas quantifiée. L'erreur la plus répandue serait d'oublier cette condition. Pour $\varphi = {\to}\, {=}\, x_0\, 0\, \forall x_0\, {=}\, x_0\, x_1$, le gabarit lettre à lettre $G_{(x_0)}(\varphi) = (2, 0, \diamond_1, 4, 3, \diamond_1, 0, \diamond_1, 9)$ marque aussi la lettre du bloc et l'occurrence liée, et le mot de code $\ulcorner \varphi \urcorner_{(x_0)}(\mathrm{num}(1))$ est ${\to}\, {=}\, S\, 0\, 0\, \forall\, S\, 0\, {=}\, S\, 0\, x_1$, qui n'est pas une formule, puisque la lettre $\forall$ y est suivie de $S$. C'est pourquoi le chapitre ne substitue qu'à des paramètres, et pourquoi le nœud {{cal-sg-delta0|Σ₁-complétude formalisée}} renommera d'abord les variables liées.
      - |
        Pour $\psi = (x_0 = x_1)$ et $\bar x = (x_0, x_1)$, on a $G_{\bar x}(\psi) = (0, \diamond_1, \diamond_2)$ et $\ulcorner \psi[\dot a, \dot b/\bar x] \urcorner = \mathrm{cc}(\underline{\langle 0 \rangle}, \mathrm{num}(a), \mathrm{num}(b))$ ; pour $a = b = 0$, c'est $\langle 0, 4, 4 \rangle = 2^{18} \cdot 9 = 2\,359\,296$, code de $0 = 0$, puisque $\langle 0, 4 \rangle = 18$. Le point (ii) est l'outil de tous les calculs de codes du chapitre : il dit que remplir une place par le code du chiffre de $S\,\rho$ revient à y écrire la lettre $S$ suivie du chiffre de $\rho$, et le point (iii) en tire que substituer $S\,x_j$ à $x_i$ dans le mot revient à changer la valeur de la place. Ces égalités de gabarits ont été vérifiées au niveau des mots, pour des centaines de formules tirées au hasard dont les paramètres ne sont pas quantifiés.

  - id: cal-sg-lettres
    etiquette: Propriétés locales des lettres
    nature: proposition
    titre: Propriétés locales des lettres d'un code dans l'arithmétique de Peano
    texte: |
      Les conventions sont celles de {{cal-sg-gabarits|Gabarits à plusieurs places}}. Pour un entier $k \geqslant 8$, des termes fonctionnels $N$ et $\tau$ et des variables $m$, $i$ qui n'y figurent pas, on note $\mathrm{Ab}_k(N)$, $\mathrm{Nq}_k(N)$, $\mathrm{Bl}_k(N)$ et $\mathrm{Ch}(\tau)$ les formules fonctionnelles
      $$\begin{aligned} &\forall m < \mathrm{lg}(N)\ \neg\big((N)^m = \underline k\big), \\[4pt] &\forall i < \mathrm{lg}(N)\ \big(S\,i < \mathrm{lg}(N) \\ &\quad \to \neg((N)^i = \underline 3 \wedge (N)^{S\,i} = \underline k)\big), \\[4pt] &\forall i < \mathrm{lg}(N)\ \big((N)^i = \underline 3 \to (S\,i < \mathrm{lg}(N) \\ &\quad \wedge \underline 8 \leqslant (N)^{S\,i} \wedge \neg((N)^{S\,i} = \underline k))\big), \\[4pt] &\forall m < \mathrm{lg}(\tau)\ \big((\tau)^m = \underline 4 \vee (\tau)^m = \underline 5\big). \end{aligned}$$
      Dans $\mathcal N$, la première dit que la lettre $a_k$ ne figure pas dans le mot de [[code-mot|code]] $N$ ; la deuxième, qu'aucune lettre $\forall$ n'y est immédiatement suivie de $a_k$ ; la troisième, que toute lettre $\forall$ y est suivie d'une variable autre que $a_k$ ; la dernière, que le mot de code $\tau$ n'a que les lettres $0$ et $S$. Pour le code d'une formule, la deuxième et la troisième disent toutes deux que $a_k$ n'est pas quantifiée, puisque chaque lettre $\forall$ d'une formule est suivie de la variable de son bloc ({{cal-sx-libres|Variables libres}}). On emploie les règles des quantifications bornées strictes du point (i) de {{cal-bp-modules|Modules de Gödel}} et de la preuve de {{cal-sp-derivabilite|Deuxième condition (D2)}}, et l'on écrit avec les valeurs, au sens de {{cal-sp-termes|Termes fonctionnels}}.
    enonce: |
      Soit $k \geqslant 8$ un entier, et $M$, $N$, $v$, $\tau$, $T$ des termes fonctionnels.

      (i) **Concaténation.** $\mathsf{PA}$ démontre $\mathrm{Ab}_k(\mathrm{aj}(N, v)) \leftrightarrow \big(\mathrm{Ab}_k(N) \wedge \neg(v = \underline k)\big)$,
      $$\begin{aligned} &\big(\mathrm{Ab}_k(M) \wedge \mathrm{Ab}_k(N)\big) \\ &\quad \to \mathrm{Ab}_k(\mathrm{conc}(M, N)), \\ &\mathrm{Nq}_k(\mathrm{conc}(M, N)) \\ &\quad \to \big(\mathrm{Nq}_k(M) \wedge \mathrm{Nq}_k(N)\big), \\ &\big(\mathrm{Bl}_k(M) \wedge \mathrm{Bl}_k(N)\big) \\ &\quad \to \mathrm{Bl}_k(\mathrm{conc}(M, N)), \end{aligned}$$
      $\mathrm{Bl}_k(N) \to \mathrm{Nq}_k(N)$ et $\mathrm{Ab}_k(N) \to \mathrm{Nq}_k(N)$.

      (ii) **Chiffres.** $\vdash_{\mathsf{PA}} \mathrm{Ch}(\tau) \to \big(\mathrm{In}(\tau) \wedge \mathrm{Ab}_k(\tau) \wedge \mathrm{Bl}_k(\tau)\big)$, et, pour une variable $x$, $\vdash_{\mathsf{PA}} \mathrm{Ch}(\mathrm{num}(x))$.

      (iii) **Codes remplis.** Soit $w$ un terme ou une formule, $\bar x = (x_1, \dots, x_r)$ des paramètres de $w$, $\bar\tau$ une suite de $r$ termes fonctionnels, et supposons que la variable $a_k$ n'est pas quantifiée dans $w$. Alors
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\big(\mathrm{Ch}(\tau_1) \wedge \cdots \wedge \mathrm{Ch}(\tau_r)\big) \\ &\to \mathrm{Bl}_k(\ulcorner w \urcorner_{\bar x}(\bar\tau)), \end{aligned}$$
      et, si l'entier $k$ ne figure pas dans $G_{\bar x}(w)$, la même formule vaut avec $\mathrm{Ab}_k$.

      (iv) **Substituabilité.** $\vdash_{\mathsf{PA}} \big(\mathrm{In}(T) \wedge \mathrm{Bl}_k(N)\big) \to \widehat{\mathrm{Sbl}}(T, \underline k, N)$. En particulier, si $\bar x$ et $a_k$ sont des paramètres d'une formule $\varphi$, avec $a_k$ hors de $\bar x$, alors, pour des variables $y$ et $y_1, \dots, y_r$, $\vdash_{\mathsf{PA}} \widehat{\mathrm{Sbl}}(\mathrm{num}(y), \underline k, \ulcorner \varphi[\dot{\bar y}/\bar x] \urcorner)$ et $\vdash_{\mathsf{PA}} \widehat{\mathrm{Sbl}}(\underline 9, \underline k, \ulcorner \varphi[\dot{\bar y}/\bar x] \urcorner)$.
    preuve: |
      (i) Écrivons $l$ et $l'$ pour les valeurs de $\mathrm{lg}(M)$ et de $\mathrm{lg}(N)$. Par le point (ii) de {{cal-sp-concatenation|Concaténation dans PA}}, $\mathrm{conc}(M, N)$ a pour longueur $l + l'$, son terme de rang $j < l$ est $(M)^j$, et son terme de rang $l + s$, pour $s < l'$, est $(N)^s$ ; par le point (iii) du même nœud, tout $j < l + l'$ vérifie $j < l$ ou s'écrit $l + s$ avec $s < l'$. On emploie la transitivité mixte de la preuve de {{cal-ip-facteurs|Facteurs dans PA}}, et $l \leqslant l + l'$ ({{cal-pa-ordre|Ordre dans PA}}, (i)).

      *Absence.* La longueur de $\mathrm{aj}(N, v)$ est $S\,l$, ses termes de rang $m < l$ sont ceux de $N$ et son terme de rang $l$ est $v$ ({{cal-sp-longueur|Longueur dans PA}}, (ii) et (iii)). Le point (i) (c) de {{cal-bp-modules|Modules de Gödel}} décompose $\forall m < S\,l$ en $\forall m < l$ et le rang $l$, et les points (i) (a) et (b) du même nœud, sous l'hypothèse $m < l$, remplacent $(\mathrm{aj}(N, v))^m$ par $(N)^m$ ; d'où la première équivalence. Pour la concaténation, sous l'hypothèse $j < l + l'$, les deux cas donnent $\neg((\mathrm{conc}(M, N))^j = \underline k)$ par l'hypothèse sur $M$ au rang $j$, ou sur $N$ au rang $s$.

      *Préfixe et suffixe.* Sous les hypothèses $\mathrm{Nq}_k(\mathrm{conc}(M, N))$, $i < l$ et $S\,i < l$, les rangs $i$ et $S\,i$ sont inférieurs à $l + l'$, les termes de $\mathrm{conc}(M, N)$ en ces rangs sont $(M)^i$ et $(M)^{S\,i}$, et l'hypothèse, instanciée par $i$, donne $\neg((M)^i = \underline 3 \wedge (M)^{S\,i} = \underline k)$ ; on généralise en $i$. Sous les hypothèses $s < l'$ et $S\,s < l'$, les rangs $l + s$ et $S(l + s) = l + S\,s$, par $\mathrm Q_5$, sont inférieurs à $l + l'$ par la compatibilité ({{cal-pa-ordre|Ordre dans PA}}, (vi)) et la commutativité ({{cal-pa-lois|Lois de + et ×}}), et leurs termes sont $(N)^s$ et $(N)^{S\,s}$ ; on conclut de même.

      *Blocs.* Sous les hypothèses $\mathrm{Bl}_k(M)$, $\mathrm{Bl}_k(N)$, $j < l + l'$ et $(\mathrm{conc}(M, N))^j = \underline 3$, distinguons les deux cas. Si $j < l$, alors $(M)^j = \underline 3$, et l'hypothèse sur $M$ donne $S\,j < l$, puis $\underline 8 \leqslant (M)^{S\,j}$ et $\neg((M)^{S\,j} = \underline k)$ ; comme $S\,j < l + l'$ et que $(\mathrm{conc}(M, N))^{S\,j} = (M)^{S\,j}$, le remplacement donne la conclusion au rang $j$. Si $j = l + s$ avec $s < l'$, alors $(N)^s = \underline 3$, l'hypothèse sur $N$ donne $S\,s < l'$, et le rang $S\,j = l + S\,s$ est inférieur à $l + l'$, de terme $(N)^{S\,s}$ ; on conclut de même. On généralise en $j$.

      Enfin, sous les hypothèses $\mathrm{Bl}_k(N)$, $i < \mathrm{lg}(N)$ et $S\,i < \mathrm{lg}(N)$, si $(N)^i = \underline 3$, l'hypothèse donne $\neg((N)^{S\,i} = \underline k)$ ; la règle des tautologies donne $\neg((N)^i = \underline 3 \wedge (N)^{S\,i} = \underline k)$. Sous les hypothèses $\mathrm{Ab}_k(N)$ et $S\,i < \mathrm{lg}(N)$, l'instance de $\mathrm{Ab}_k(N)$ en $S\,i$ donne de même cette formule.

      (ii) Sous les hypothèses $\mathrm{Ch}(\tau)$ et $m < \mathrm{lg}(\tau)$, on a $(\tau)^m = \underline 4$ ou $(\tau)^m = \underline 5$. Les calculs clos $\underline 4 < \underline 8$, $\underline 5 < \underline 8$, $\neg(\underline 4 = \underline k)$, $\neg(\underline 5 = \underline k)$, $\neg(\underline 4 = \underline 3)$ et $\neg(\underline 5 = \underline 3)$, vrais puisque $k \geqslant 8$, et le remplacement donnent $(\tau)^m < \underline 8$, $\neg((\tau)^m = \underline k)$ et $\neg((\tau)^m = \underline 3)$ ; la généralisation bornée donne $\mathrm{In}(\tau)$ et $\mathrm{Ab}_k(\tau)$, et, l'antécédent $(\tau)^i = \underline 3$ étant réfuté, $\mathrm{Bl}_k(\tau)$. Pour $\mathrm{num}(x)$, le point (iii) de {{cal-ip-formation|Formation dans PA}} donne $\mathrm{lg}(\mathrm{num}(x)) = S\,x$ et, sous l'hypothèse $m < S\,x$, $(\mathrm{num}(x))^m = \underline 4 \vee (\mathrm{num}(x))^m = \underline 5$ ; le remplacement et le point (i) (a) de {{cal-bp-modules|Modules de Gödel}} concluent.

      (iii) *Découpage en blocs.* Un terme ne contient pas la lettre $\forall$. Dans une formule, chaque lettre $\forall$ est suivie de la variable $a_c$ de son bloc ({{cal-sx-libres|Variables libres}}), qui est quantifiée : elle n'est ni l'une des $x_i$, ni $a_k$, et elle reste l'entier $c$ dans $G_{\bar x}(w)$. Le gabarit $G_{\bar x}(w)$ se découpe donc en blocs $B_1, \dots, B_q$, avec $q \geqslant 1$, dont chacun est $(\diamond_i)$, $(c)$ pour un entier $c \neq 3$, ou $(3)(c)$ pour un entier $c \geqslant 8$ différent de $k$ ; les blocs $(3)(c)$ ne se chevauchent pas, puisque $c \neq 3$. Par le point (i) de {{cal-sg-gabarits|Gabarits à plusieurs places}}, $\ulcorner w \urcorner_{\bar x}(\bar\tau)$ est obtenu par concaténations successives des termes $\llbracket B_p \rrbracket(\bar\tau)$, qui sont $\tau_i$, $\underline{\langle c \rangle}$ ou $\underline{\langle 3, c \rangle}$, par $\mathrm{conc}(0, \tau_i) = \tau_i$ et des calculs clos.

      *Chaque bloc.* $\mathrm{Bl}_k(\tau_i)$ découle de $\mathrm{Ch}(\tau_i)$ par (ii). Le code $\underline{\langle c \rangle}$, pour $c \neq 3$, a la longueur $S\,0$ ; sous l'hypothèse $i < S\,0$, les points (v) et (ii) de {{cal-pa-ordre|Ordre dans PA}} donnent $i = 0$, et le calcul clos $\neg((\underline{\langle c \rangle})^0 = \underline 3)$ réfute l'antécédent. Le code $\underline{\langle 3, c \rangle}$ a la longueur $S\,S\,0$ ; sous l'hypothèse $i < S\,S\,0$, on a $i = 0$ ou $i = S\,0$, par le point (v) de {{cal-rp-calculs-q|Calculs dans Q}} ; au rang $0$, les calculs clos $S\,0 < S\,S\,0$, $\underline 8 \leqslant \underline c$ et $\neg(\underline c = \underline k)$, avec $(\underline{\langle 3, c \rangle})^{S\,0} = \underline c$, donnent la conclusion, et au rang $S\,0$, le calcul clos $\neg(\underline c = \underline 3)$ réfute l'antécédent. Enfin $\mathrm{Bl}_k(0)$, puisque $\mathrm{lg}(0) = 0$ et que $\forall i < 0$ est démontrable. Une récurrence sur $q$, en [[metatheorie|métathéorie]], avec la règle des blocs de (i), conclut.

      Pour $\mathrm{Ab}_k$, si $k$ ne figure pas dans $G_{\bar x}(w)$, aucun bloc entier ne contient $k$. Par (i), $\mathrm{Ab}_k(\underline{\langle c \rangle})$ équivaut à $\mathrm{Ab}_k(0) \wedge \neg(\underline c = \underline k)$, et $\mathrm{Ab}_k(\underline{\langle 3, c \rangle})$ s'obtient de même en deux pas ; $\mathrm{Ab}_k(\tau_i)$ découle de (ii), et la règle de concaténation de (i) conclut.

      (iv) Comme au point (ii) de {{cal-ip-instances|Formules des instances}}, mais pour un terme $N$ quelconque à la place du chiffre $\underline n$, la formule naturelle de $\mathrm{Sbl}$ se lit clause par clause, par les points (iii) et (iv) de {{cal-bp-relations|Relations p.r. dans PA}} et les points (ii) (b) et (d) de {{cal-sp-termes|Termes fonctionnels}} : $\widehat{\mathrm{Sbl}}(T, \underline k, N)$ découle de
      $$\begin{aligned} &\forall j < \mathrm{lg}(N)\ \neg\exists i < j \\ &\quad \exists l' < S\,\mathrm{lg}(N)\ \big((N)^i = \underline 3 \\ &\quad \wedge \exists m < \mathrm{lg}(T)\ (T)^m = (N)^{S\,i} \\ &\quad \wedge \Psi\big), \end{aligned}$$
      où $\Psi$ réunit les clauses qui ne servent pas. Il suffit de tirer une contradiction des hypothèses $\mathrm{In}(T)$, $\mathrm{Bl}_k(N)$, $j < \mathrm{lg}(N)$, $i < j$, $(N)^i = \underline 3$, $m < \mathrm{lg}(T)$ et $(T)^m = (N)^{S\,i}$. La transitivité donne $i < \mathrm{lg}(N)$, et $\mathrm{Bl}_k(N)$, instanciée par $i$, donne $\underline 8 \leqslant (N)^{S\,i} = (T)^m$, alors que $\mathrm{In}(T)$, instanciée par $m$, donne $(T)^m < \underline 8$ : le dernier point de (v) de {{cal-pa-ordre|Ordre dans PA}} exclut les deux. Pour la dernière assertion, $\mathrm{In}(\mathrm{num}(y))$ et $\mathrm{Bl}_k(\ulcorner \varphi[\dot{\bar y}/\bar x] \urcorner)$ découlent de (ii) et (iii), et $\underline 9$ est $\mathrm{num}(0)$, par le point (iii) de {{cal-ip-formation|Formation dans PA}}, de sorte que $\mathrm{In}(\underline 9)$ découle de $\mathrm{Ch}(\mathrm{num}(0))$ et du remplacement.
    remarques:
      - |
        Les deux propriétés ne se comportent pas de la même façon, et l'erreur la plus répandue serait de les confondre. La formule $\mathrm{Nq}_k$ passe aux préfixes et aux suffixes, mais pas aux concaténations : $\langle 3 \rangle = 7$, code du mot $\forall$, et $\langle 8 \rangle = 17$, code de $x_0$, la vérifient pour $k = 8$, alors que leur concaténation $\langle 3, 8 \rangle = 2^7 \cdot 17 = 2\,176$, code de $\forall x_0$, ne la vérifie pas. La formule $\mathrm{Bl}_k$, elle, passe aux concaténations mais pas aux préfixes : $\langle 3 \rangle$ ne la vérifie pas, puisque sa lettre $\forall$ n'est suivie de rien, alors que le mot entier $\langle 3, 9 \rangle = 2^7 \cdot 19 = 2\,432$, code de $\forall x_1$, la vérifie pour $k = 8$. On construit donc avec $\mathrm{Bl}_k$, en gardant chaque lettre $\forall$ avec sa variable dans un même bloc, et l'on démonte avec $\mathrm{Nq}_k$, dans la récurrence sur la longueur du nœud suivant {{cal-sg-substitution|Substitution lettre à lettre}}. Ces règles ont été vérifiées par un calcul sur quelques dizaines de milliers de couples de mots courts, tirés au hasard dans un alphabet de huit lettres.
      - |
        La formule $\mathrm{Bl}_k$ est la forme interne à $\mathsf{PA}$ de la phrase « $a_k$ n'est pas quantifiée », pour des codes qui dépendent de variables. Le point (iv) étend ainsi le point (ii) de {{cal-ip-instances|Formules des instances}}, où la lettre qui suit chaque $\forall$ se lisait par un calcul clos dans une formule fixée ; ici, elle se lit sur les blocs, quelles que soient les valeurs des chiffres insérés. C'est la propriété locale des lettres qui, d'après la seconde remarque de {{cal-ip-instanciation|Instanciation formalisée}}, pouvait remplacer la lecture unique démontrée dans $\mathsf{PA}$.

  - id: cal-sg-substitution
    etiquette: Substitution lettre à lettre
    nature: proposition
    titre: Substitution lettre à lettre dans un code variable, dans l'arithmétique de Peano
    texte: |
      Les conventions sont celles de {{cal-sg-lettres|Propriétés locales des lettres}} ; la fonction $\mathrm{Sb}$, le balayage $W$, la relation $C(N, j, k) \iff \mathrm{Lib}(N, j) \wedge (N)^j = k$ et les relations $R_1$, $R_2$ sont pris avec les constructions du texte de {{cal-ip-substitution|Substitution dépliée}}. Soit $k \geqslant 8$ un entier et $T$ une variable.

      *Lecture.* Les formules naturelles se lisent clause par clause : la conjonction, la négation et la disjonction par le point (iii) de {{cal-bp-relations|Relations p.r. dans PA}}, les quantifications bornées par le point (iv), les relations de base par le point (ii), et les substitutions de fonctions par les points (ii) (b) et (d) de {{cal-sp-termes|Termes fonctionnels}} ; ainsi $\mathsf{PA}$ démontre $\hat C(N, j, \underline k) \leftrightarrow \big(\widehat{\mathrm{Lib}}(N, j) \wedge (N)^j = \underline k\big)$, $\widehat{\mathrm{Lib}}(N, j) \leftrightarrow \big(\widehat{\mathrm{Oc}}(N, j) \wedge \neg\widehat{\mathrm{Li}}(N, j)\big)$,
      $$\begin{aligned} &\widehat{\mathrm{Oc}}(N, j) \leftrightarrow \big(j < \mathrm{lg}(N) \wedge \underline 8 \leqslant (N)^j \\ &\qquad \wedge (j = 0 \vee \neg((N)^{j \mathbin{\dot{-}} S\,0} = \underline 3))\big), \\ &\widehat{\mathrm{Li}}(N, j) \leftrightarrow \exists i < j\ \exists l' < S\,\mathrm{lg}(N) \\ &\qquad \big((N)^i = \underline 3 \wedge (N)^{S\,i} = (N)^j \wedge \Psi'\big), \end{aligned}$$
      où $\Psi'$ réunit les clauses $S\,S\,i \leqslant j$, $j < l'$ et $\widehat{\mathrm{Fm}}(\mathrm{sm}(N, S\,S\,i, l'))$, qui ne serviront pas, et où $i + 1$, $i + 2$ sont écrits $S\,i$, $S\,S\,i$ par $\mathrm Q_4$ et $\mathrm Q_5$.

      *Équations du balayage.* Comme au point (ii) de {{cal-ip-substitution|Substitution dépliée}}, le point (iv) de {{cal-bp-fonctions|Fonctions p.r. dans PA}} et la définition par cas de {{cal-bp-relations|Relations p.r. dans PA}}, (v), permise par la booléennité, donnent, pour tous termes fonctionnels $N$ et $j$,
      $$\begin{aligned} &\vdash_{\mathsf{PA}} W(N, T, \underline k, 0) = 0, \\ &\vdash_{\mathsf{PA}} \hat C(N, j, \underline k) \to W(N, T, \underline k, S\,j) \\ &\qquad = \mathrm{conc}\big(W(N, T, \underline k, j), T\big), \\ &\vdash_{\mathsf{PA}} \neg\hat C(N, j, \underline k) \to W(N, T, \underline k, S\,j) \\ &\qquad = \mathrm{aj}\big(W(N, T, \underline k, j), (N)^j\big), \end{aligned}$$
      puisque $\hat R_1(N, T, \underline k, j, u)$ équivaut à $\hat C(N, j, \underline k)$ et $\hat R_2$ à sa négation ; enfin $\vdash_{\mathsf{PA}} \mathrm{Sb}(N, T, \underline k) = W(N, T, \underline k, \mathrm{lg}(N))$, par le point (ii) (d) de {{cal-sp-termes|Termes fonctionnels}}.
    enonce: |
      Soit $M$, $N$, $v$ et $j$ des variables distinctes de $T$.

      (i) **Réduction.** $\vdash_{\mathsf{PA}} \big(\mathrm{Nq}_k(N) \wedge j < \mathrm{lg}(N)\big) \to \big(\hat C(N, j, \underline k) \leftrightarrow (N)^j = \underline k\big)$.

      (ii) **Ajout d'une lettre.** On a $\vdash_{\mathsf{PA}} \mathrm{Sb}(0, T, \underline k) = 0$ et
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\big(\mathrm{Nq}_k(\mathrm{aj}(N, v)) \wedge v = \underline k\big) \\ &\to \mathrm{Sb}(\mathrm{aj}(N, v), T, \underline k) \\ &\qquad = \mathrm{conc}\big(\mathrm{Sb}(N, T, \underline k), T\big), \\ \vdash_{\mathsf{PA}} {}&\big(\mathrm{Nq}_k(\mathrm{aj}(N, v)) \wedge \neg(v = \underline k)\big) \\ &\to \mathrm{Sb}(\mathrm{aj}(N, v), T, \underline k) \\ &\qquad = \mathrm{aj}\big(\mathrm{Sb}(N, T, \underline k), v\big). \end{aligned}$$

      (iii) **Morphisme.** On a
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\mathrm{Nq}_k(\mathrm{conc}(M, N)) \\ &\to \mathrm{Sb}(\mathrm{conc}(M, N), T, \underline k) \\ &\quad = \mathrm{conc}\big(\mathrm{Sb}(M, T, \underline k), \\ &\qquad\quad \mathrm{Sb}(N, T, \underline k)\big), \end{aligned}$$
      et $\vdash_{\mathsf{PA}} \mathrm{Ab}_k(N) \to \mathrm{Sb}(N, T, \underline k) = N$.

      (iv) **Composition.** Soit $w$ un terme ou une formule, $\bar x = (x_1, \dots, x_r)$ et $x = a_k$ des variables distinctes, paramètres de $w$, et $\bar\tau$, $\tau$ des termes fonctionnels. Alors
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\big(\mathrm{Ch}(\tau_1) \wedge \cdots \wedge \mathrm{Ch}(\tau_r)\big) \\ &\to \mathrm{Sb}(\ulcorner w \urcorner_{\bar x}(\bar\tau), \tau, \underline k) \\ &\quad = \ulcorner w \urcorner_{\bar x, x}(\bar\tau, \tau). \end{aligned}$$
      En particulier, pour des variables $y_1, \dots, y_r$ et $y$, $\vdash_{\mathsf{PA}} \mathrm{Sb}(\ulcorner w[\dot{\bar y}/\bar x] \urcorner, \mathrm{num}(y), \underline k) = \ulcorner w[\dot{\bar y}, \dot y/\bar x, x] \urcorner$ ; et, si $x$ ne figure pas dans $w$, $\vdash_{\mathsf{PA}} \mathrm{Sb}(\ulcorner w[\dot{\bar y}/\bar x] \urcorner, \tau, \underline k) = \ulcorner w[\dot{\bar y}/\bar x] \urcorner$.
    preuve: |
      On écrit avec les valeurs, au sens de {{cal-sp-termes|Termes fonctionnels}}, et l'on emploie les règles des quantifications bornées strictes de la preuve de {{cal-sp-derivabilite|Deuxième condition (D2)}}.

      (i) Sous l'hypothèse $\hat C(N, j, \underline k)$, la lecture donne $(N)^j = \underline k$. Réciproquement, raisonnons sous les hypothèses $\mathrm{Nq}_k(N)$, $j < \mathrm{lg}(N)$ et $(N)^j = \underline k$. Le calcul clos $\underline 8 \leqslant \underline k$ et le remplacement donnent $\underline 8 \leqslant (N)^j$. Par l'instance de $\mathrm Q_3$, $j = 0$ ou $j = S\,j'$ ; dans le second cas, $j' < j$, donc $j' < \mathrm{lg}(N)$, et $S\,j' < \mathrm{lg}(N)$, de sorte que $\mathrm{Nq}_k(N)$, instanciée par $j'$, donne $\neg((N)^{j'} = \underline 3 \wedge (N)^{S\,j'} = \underline k)$, donc $\neg((N)^{j'} = \underline 3)$ puisque $(N)^{S\,j'} = (N)^j = \underline k$ ; comme $S\,j' \mathbin{\dot{-}} S\,0 = j'$ ({{cal-bp-usuelles|Fonctions usuelles dans PA}}, (iii)), on obtient $\widehat{\mathrm{Oc}}(N, j)$. Pour $\neg\widehat{\mathrm{Li}}(N, j)$, il suffit, par l'élimination des quantifications bornées strictes, de tirer une contradiction des hypothèses $i < j$, $(N)^i = \underline 3$ et $(N)^{S\,i} = (N)^j$, les clauses $\Psi'$ étant affaiblies. Or $i < j$ s'écrit $S\,i \leqslant j$, d'où $S\,i < \mathrm{lg}(N)$ et $i < \mathrm{lg}(N)$ par la transitivité mixte de la preuve de {{cal-ip-facteurs|Facteurs dans PA}} ; l'instance de $\mathrm{Nq}_k(N)$ en $i$ contredit $(N)^i = \underline 3$ et $(N)^{S\,i} = \underline k$. La lecture donne $\hat C(N, j, \underline k)$.

      (ii) Le point (ii) de {{cal-sp-longueur|Longueur dans PA}} donne $\mathrm{lg}(0) = 0$, et les équations du balayage donnent $\mathrm{Sb}(0, T, \underline k) = W(0, T, \underline k, 0) = 0$. Soit $N' = \mathrm{aj}(N, v)$ et $l$ la valeur de $\mathrm{lg}(N)$, de sorte que $\mathrm{lg}(N') = S\,l$ ; raisonnons sous l'hypothèse $\mathrm{Nq}_k(N')$. Comme $N' = \mathrm{conc}(N, \mathrm{aj}(0, v))$, par les égalités $\mathrm{conc}(N, \mathrm{aj}(0, v)) = \mathrm{aj}(\mathrm{conc}(N, 0), v)$ et $\mathrm{conc}(N, 0) = N$ du point (iv) de {{cal-sp-concatenation|Concaténation dans PA}}, le point (i) de {{cal-sg-lettres|Propriétés locales des lettres}} donne $\mathrm{Nq}_k(N)$.

      Montrons, par récurrence sur $j$, la formule $j \leqslant l \to W(N', T, \underline k, j) = W(N, T, \underline k, j)$, où $j$ n'est pas libre dans l'hypothèse $\mathrm{Nq}_k(N')$. Pour $0$, les deux membres valent $0$. Sous l'hypothèse de récurrence et sous $S\,j \leqslant l$, c'est-à-dire $j < l$, on a $j \leqslant l$ ({{cal-pa-ordre|Ordre dans PA}}, (v)), et l'hypothèse de récurrence donne une valeur commune $u$ des deux balayages au rang $j$. Comme $j < l < S\,l$, le point (i), appliqué à $N'$ et à $N$, et l'égalité $(N')^j = (N)^j$ du point (iii) de {{cal-sp-longueur|Longueur dans PA}} donnent $\hat C(N', j, \underline k) \leftrightarrow \hat C(N, j, \underline k)$. Si $\hat C(N, j, \underline k)$, les équations du balayage donnent la valeur $\mathrm{conc}(u, T)$ aux deux balayages au rang $S\,j$ ; sinon, elles donnent $\mathrm{aj}(u, (N')^j) = \mathrm{aj}(u, (N)^j)$. La récurrence ({{cal-pa-recurrence|Récurrence dans PA}}, (iii)), puis la substitution de $l$ à $j$, donnent $W(N', T, \underline k, l) = W(N, T, \underline k, l) = \mathrm{Sb}(N, T, \underline k)$.

      Enfin $\mathrm{Sb}(N', T, \underline k) = W(N', T, \underline k, S\,l)$. Comme $(N')^l = v$ et $l < S\,l$, le point (i) donne $\hat C(N', l, \underline k) \leftrightarrow v = \underline k$, et les équations du balayage, au rang $l$, donnent $\mathrm{conc}(\mathrm{Sb}(N, T, \underline k), T)$ si $v = \underline k$, et $\mathrm{aj}(\mathrm{Sb}(N, T, \underline k), v)$ sinon.

      (iii) Appliquons la récurrence sur la longueur ({{cal-ip-facteurs|Facteurs dans PA}}, (i)) à la formule $\mathrm{Nq}_k(\mathrm{conc}(M, N)) \to \mathrm{Sb}(\mathrm{conc}(M, N), T, \underline k) = \mathrm{conc}(\mathrm{Sb}(M, T, \underline k), \mathrm{Sb}(N, T, \underline k))$, avec la variable $N$ et une variable nouvelle $v$. Pour $N = 0$, $\mathrm{conc}(M, 0) = M$ et $\mathrm{Sb}(0, T, \underline k) = 0$, et la conclusion est $\mathrm{Sb}(M, T, \underline k) = \mathrm{conc}(\mathrm{Sb}(M, T, \underline k), 0)$, par le point (iv) de {{cal-sp-concatenation|Concaténation dans PA}}. Pour le pas, raisonnons sous l'hypothèse de récurrence et sous $\mathrm{Nq}_k(\mathrm{conc}(M, \mathrm{aj}(N, v)))$. Par le même point (iv), $\mathrm{conc}(M, \mathrm{aj}(N, v)) = \mathrm{aj}(\mathrm{conc}(M, N), v)$, et le point (i) de {{cal-sg-lettres|Propriétés locales des lettres}}, appliqué comme dans la preuve de (ii), donne $\mathrm{Nq}_k(\mathrm{conc}(M, N))$, puis, avec la règle des suffixes, $\mathrm{Nq}_k(\mathrm{aj}(N, v))$. L'hypothèse de récurrence donne $\mathrm{Sb}(\mathrm{conc}(M, N), T, \underline k) = \mathrm{conc}(S_M, S_N)$, où $S_M$ et $S_N$ sont les valeurs de $\mathrm{Sb}(M, T, \underline k)$ et de $\mathrm{Sb}(N, T, \underline k)$. Si $v = \underline k$, (ii), appliqué à $\mathrm{aj}(\mathrm{conc}(M, N), v)$, puis l'associativité ({{cal-ip-facteurs|Facteurs dans PA}}, (ii)) et (ii) appliqué à $\mathrm{aj}(N, v)$, donnent
      $$\begin{aligned} &\mathrm{Sb}(\mathrm{conc}(M, \mathrm{aj}(N, v)), T, \underline k) \\ &\quad = \mathrm{conc}(\mathrm{conc}(S_M, S_N), T) \\ &\quad = \mathrm{conc}(S_M, \mathrm{conc}(S_N, T)) \\ &\quad = \mathrm{conc}\big(S_M, \mathrm{Sb}(\mathrm{aj}(N, v), T, \underline k)\big). \end{aligned}$$
      Si $\neg(v = \underline k)$, on obtient de même $\mathrm{aj}(\mathrm{conc}(S_M, S_N), v) = \mathrm{conc}(S_M, \mathrm{aj}(S_N, v))$, par le point (iv) de {{cal-sp-concatenation|Concaténation dans PA}}, et (ii) conclut.

      Pour l'identité, appliquons la même récurrence à la formule $\mathrm{Ab}_k(N) \to \mathrm{Sb}(N, T, \underline k) = N$. Le cas $0$ est (ii). Sous l'hypothèse $\mathrm{Ab}_k(\mathrm{aj}(N, v))$, le point (i) de {{cal-sg-lettres|Propriétés locales des lettres}} donne $\mathrm{Ab}_k(N)$, $\neg(v = \underline k)$ et $\mathrm{Nq}_k(\mathrm{aj}(N, v))$ ; l'hypothèse de récurrence et (ii) donnent $\mathrm{Sb}(\mathrm{aj}(N, v), T, \underline k) = \mathrm{aj}(N, v)$.

      (iv) Il suffit de traiter une variable $T$, prise hors des $\tau_i$, à la place de $\tau$, puis de substituer $\tau$ par le point (ii) (b) de {{cal-sp-termes|Termes fonctionnels}}, $T$ n'étant libre dans aucune hypothèse. Soit $G = G_{\bar x}(w) = (g_0, \dots, g_{m-1})$, $G'$ le gabarit $G_{\bar x, x}(w)$, qui s'obtient en remplaçant chaque entier $k$ de $G$ par $\diamond_{r+1}$, et, pour $j \leqslant m$, $P_j = \llbracket (g_0, \dots, g_{j-1}) \rrbracket(\bar\tau)$ et $P'_j = \llbracket (g'_0, \dots, g'_{j-1}) \rrbracket(\bar\tau, T)$. Raisonnons sous les hypothèses $\mathrm{Ch}(\tau_i)$. Le point (iii) de {{cal-sg-lettres|Propriétés locales des lettres}}, où $a_k$ n'est pas quantifiée dans $w$, donne $\mathrm{Bl}_k(P_m)$, donc $\mathrm{Nq}_k(P_m)$. Par le point (i) de {{cal-sg-gabarits|Gabarits à plusieurs places}}, pour $j < m$, $P_m = \mathrm{conc}(P_{j+1}, \llbracket (g_{j+1}, \dots, g_{m-1}) \rrbracket(\bar\tau))$ et $P_{j+1} = \mathrm{conc}(P_j, \llbracket (g_j) \rrbracket(\bar\tau))$. La règle des préfixes, appliquée à la première égalité, donne $\mathrm{Nq}_k(P_{j+1})$ ; la règle des suffixes, appliquée à la seconde, donne $\mathrm{Nq}_k(\llbracket (g_j) \rrbracket(\bar\tau))$.

      Montrons $\mathrm{Sb}(P_j, T, \underline k) = P'_j$ par récurrence sur $j$, en [[metatheorie|métathéorie]]. Pour $j = 0$, c'est (ii). Pour le pas, (iii) donne $\mathrm{Sb}(P_{j+1}, T, \underline k) = \mathrm{conc}(P'_j, \mathrm{Sb}(\llbracket (g_j) \rrbracket(\bar\tau), T, \underline k))$, et il reste à calculer le dernier terme. Si $g_j = \diamond_i$, c'est $\mathrm{Sb}(\tau_i, T, \underline k) = \tau_i$, par l'identité de (iii) et $\mathrm{Ab}_k(\tau_i)$ ({{cal-sg-lettres|Propriétés locales des lettres}}, (ii)). Si $g_j$ est un entier $c \neq k$, c'est $\mathrm{Sb}(\mathrm{aj}(0, \underline c), T, \underline k) = \mathrm{aj}(0, \underline c)$, par (ii) et le calcul clos $\neg(\underline c = \underline k)$. Si $g_j = k$, c'est $\mathrm{conc}(0, T) = T$, par (ii) et le point (iv) de {{cal-sp-concatenation|Concaténation dans PA}}. Dans les trois cas, le dernier terme est $\llbracket (g'_j) \rrbracket(\bar\tau, T)$, et (i) de {{cal-sg-gabarits|Gabarits à plusieurs places}} donne $P'_{j+1}$. Pour $j = m$, c'est l'égalité annoncée. Les cas particuliers s'en déduisent par $\mathrm{Ch}(\mathrm{num}(y_i))$ ({{cal-sg-lettres|Propriétés locales des lettres}}, (ii)) ; si $x$ ne figure pas dans $w$, $G'$ est $G$, et les deux [[code-mot|codes]] sont le même terme fonctionnel.
    remarques:
      - |
        Sous l'hypothèse $\mathrm{Nq}_k$, le balayage $W$ ne consulte plus la structure du mot : la condition $C$, qui demandait de savoir quels facteurs sont des formules, se réduit à « la lettre est $a_k$ », et la substitution devient le morphisme qui remplace chaque lettre $a_k$ par le mot de code $T$ et garde les autres. C'est pourquoi on peut la démontrer pour un code variable, par la récurrence sur la longueur, alors que le dépliement de {{cal-ip-substitution|Substitution dépliée}} exigeait un mot fixé. Pour $\psi = (x_0 = x_1)$, l'occurrence de $x_1$ dans $\psi[\underline a/x_0]$ est au rang $a + 2$, qui dépend de $a$, comme le notait la seconde remarque de ce nœud ; le point (iv) donne pourtant $\mathrm{Sb}(\ulcorner \psi[\dot a/x_0] \urcorner, \mathrm{num}(b), \underline 9) = \mathrm{cc}(\underline{\langle 0 \rangle}, \mathrm{num}(a), \mathrm{num}(b))$ pour une variable $a$, sans jamais calculer ce rang.
      - |
        L'hypothèse $\mathrm{Nq}_k$ ne peut pas être omise. Pour le mot $\forall x_0\, {=}\, x_0\, x_0$, de lettres $(3, 8, 0, 8, 8)$, la variable $x_0$ n'a aucune occurrence libre, et $\mathrm{Sb}$ ne change rien, alors que le morphisme remplacerait trois lettres, dont celle du bloc. Les points (i) à (iii) ont été vérifiés par un calcul, avec les définitions de {{cal-sx-libres|Variables libres}} et de {{cal-sx-substitution|Substitution}} appliquées mot pour mot, sur quelques milliers de mots quelconques, et non seulement sur des formules, puisque les énoncés portent sur tous les codes.

  - id: cal-sg-instanciation
    etiquette: Instanciation à plusieurs paramètres
    nature: théorème
    titre: Instanciation formalisée, première et deuxième conditions et introduction de ∃ à plusieurs paramètres
    texte: |
      Les conventions sont celles de {{cal-ip-instanciation|Instanciation formalisée}} et de {{cal-sg-substitution|Substitution lettre à lettre}} : $T$ est une théorie sur la signature de l'arithmétique dont l'ensemble des [[code-mot|codes]] des axiomes est récursivement énumérable, $T'$ la théorie du {{cal-craig|théorème de Craig}}, ou $T$ elle-même si l'ensemble des codes de ses axiomes est [[relation-primitive-recursive|primitif récursif]], $\mathrm{Dem} = \mathrm{Dem}_{T'}$, et $\mathrm{Prf}_T(v) = \exists p\ \widehat{\mathrm{Dem}}(p, v)$ la formule naturelle de démontrabilité des formules. Dans tout le chapitre, les variables qui servent de valeurs aux paramètres, et les variables des termes substitués à celles-ci, sont distinctes de la variable liée $p$, de sorte que $\mathrm{Prf}_T$ n'en capture aucune ; sinon, on renommerait $p$ par le renommage existentiel ({{cal-rp-calcul|Calcul à variables libres}}, (iii)).

      Pour une formule $\alpha$, des variables distinctes $\bar x = (x_1, \dots, x_r)$ et $x = a_k$, et des variables $\bar y = (y_1, \dots, y_r)$ et $y$, on note
      $$\begin{aligned} I = \mathrm{cc}\big(&\underline{\langle 2 \rangle}, \ulcorner (\forall x\, \alpha)[\dot{\bar y}/\bar x] \urcorner, \\ &\ulcorner \alpha[\dot{\bar y}, \dot y/\bar x, x] \urcorner\big), \end{aligned}$$
      terme fonctionnel qui, pour des valeurs $n_1, \dots, n_r$ et $n$ des variables, prend la valeur du code de la formule ${\to}\, \forall x\, \alpha'\ \alpha'[\underline n/x]$, où $\alpha' = \alpha[\underline{n_1}, \dots, \underline{n_r}/\bar x]$ ; on note $\exists x\, \alpha$ la formule $\neg\forall x\, \neg\alpha$.
    enonce: |
      Soit $\alpha$, $\beta$ et $\psi$ des formules, $\bar x = (x_1, \dots, x_r)$ et $x = a_k$ des variables distinctes, et $\bar y = (y_1, \dots, y_r)$, $y$ des variables.

      (i) **Axiomes du groupe (2).** Si $\bar x$ et $x$ sont des paramètres de $\alpha$, alors $\vdash_{\mathsf{PA}} \widehat{\mathrm{Fm}}(I) \wedge \widehat{\mathrm{Ax}}(I)$.

      (ii) **Instanciation formalisée.** Sous la même hypothèse,
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\mathrm{Prf}_T\big(\ulcorner (\forall x\, \alpha)[\dot{\bar y}/\bar x] \urcorner\big) \\ &\to \mathrm{Prf}_T\big(\ulcorner \alpha[\dot{\bar y}, \dot y/\bar x, x] \urcorner\big). \end{aligned}$$

      (iii) **Première condition à plusieurs paramètres.** Si $\bar x$ sont des paramètres de $\psi$ et si $T \vdash \psi$, alors $\vdash_{\mathsf{PA}} \mathrm{Prf}_T(\ulcorner \psi[\dot{\bar y}/\bar x] \urcorner)$.

      (iv) **Deuxième condition à plusieurs paramètres.** Si $\bar x$ sont des paramètres de $\alpha$ et de $\beta$, alors
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\mathrm{Prf}_T\big(\ulcorner (\alpha \to \beta)[\dot{\bar y}/\bar x] \urcorner\big) \\ &\to \Big(\mathrm{Prf}_T\big(\ulcorner \alpha[\dot{\bar y}/\bar x] \urcorner\big) \\ &\qquad \to \mathrm{Prf}_T\big(\ulcorner \beta[\dot{\bar y}/\bar x] \urcorner\big)\Big). \end{aligned}$$

      (v) **Introduction formalisée de $\exists$.** Si $\bar x$ et $x$ sont des paramètres de $\alpha$, alors
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\mathrm{Prf}_T\big(\ulcorner \alpha[\dot{\bar y}, \dot y/\bar x, x] \urcorner\big) \\ &\to \mathrm{Prf}_T\big(\ulcorner (\exists x\, \alpha)[\dot{\bar y}/\bar x] \urcorner\big). \end{aligned}$$

      Ces formules restent démontrables quand on substitue aux $y_i$ et à $y$ des termes, par le point (ii) (b) de {{cal-sp-termes|Termes fonctionnels}}, et toute théorie qui démontre les axiomes de $\mathsf{PA}$ les démontre.
    preuve: |
      On écrit avec les valeurs et l'on emploie les règles des quantifications bornées strictes de la preuve de {{cal-sp-derivabilite|Deuxième condition (D2)}}.

      (i) Soit $E = \ulcorner \alpha[\dot{\bar y}/\bar x] \urcorner$, $A = \ulcorner (\forall x\, \alpha)[\dot{\bar y}/\bar x] \urcorner$ et $B = \ulcorner \alpha[\dot{\bar y}, \dot y/\bar x, x] \urcorner$, de sorte que $I = \mathrm{cc}(\underline{\langle 2 \rangle}, A, B)$. Comme $x$ est hors de $\bar x$, $G_{\bar x}(\forall x\, \alpha) = (3)(k)\, G_{\bar x}(\alpha)$, et le point (i) de {{cal-sg-gabarits|Gabarits à plusieurs places}} et un calcul clos donnent $A = \mathrm{conc}(\underline{\langle 3, k \rangle}, E)$. *Formule.* Les $x_i$ sont des paramètres de $\forall x\, \alpha$, et le point (iv) du même nœud donne $\widehat{\mathrm{Fm}}(A)$ et $\widehat{\mathrm{Fm}}(B)$ ; le point (ii) de {{cal-ip-formation|Formation dans PA}} donne $\widehat{\mathrm{Fm}}(I)$.

      *Lecture de $\mathrm{Ax}$.* Comme au point (ii) de {{cal-ip-instanciation|Instanciation formalisée}}, avec le témoin $g = 0$ des généralisations, $\widehat{\mathrm{Ax}}(I)$ découle de $\widehat{\mathrm{Fm}}(I)$ et de
      $$\begin{aligned} &\exists k' < I\ \exists a' < S\,I\ \exists T < S\,I \\ &\quad \big(\underline 8 \leqslant k' \wedge \widehat{\mathrm{Fm}}(a') \wedge \widehat{\mathrm{Tm}}(T) \\ &\quad \wedge \widehat{\mathrm{Sbl}}(T, k', a') \\ &\quad \wedge I = \mathrm{cc}\big(\mathrm{aj}(\underline{\langle 2, 3 \rangle}, k'), \\ &\qquad a', \mathrm{Sb}(a', T, k')\big)\big). \end{aligned}$$

      *Témoins.* On prend $k' = \underline k$ et $a' = E$, et, pour $T$, le terme $\mathrm{num}(y)$ si $x$ figure dans $\alpha$, le chiffre $\underline 9 = \underline{\ulcorner 0 \urcorner}$ sinon. Le calcul clos $\underline 8 \leqslant \underline k$ est démontrable, et $\widehat{\mathrm{Fm}}(E)$ découle du point (iv) de {{cal-sg-gabarits|Gabarits à plusieurs places}}. Dans le premier cas, $\widehat{\mathrm{Tm}}(\mathrm{num}(y))$ par le point (iii) de {{cal-ip-formation|Formation dans PA}}, $\widehat{\mathrm{Sbl}}(\mathrm{num}(y), \underline k, E)$ par le point (iv) de {{cal-sg-lettres|Propriétés locales des lettres}}, et $\mathrm{Sb}(E, \mathrm{num}(y), \underline k) = B$ par le point (iv) de {{cal-sg-substitution|Substitution lettre à lettre}}. Dans le second, $\widehat{\mathrm{Tm}}(\underline 9)$ est un calcul clos, $\widehat{\mathrm{Sbl}}(\underline 9, \underline k, E)$ découle du même point (iv), et $\mathrm{Sb}(E, \underline 9, \underline k) = E$ par la dernière assertion de (iv) de {{cal-sg-substitution|Substitution lettre à lettre}} ; or $B$ est $E$, puisque la place de $x$ ne figure pas dans $G_{\bar x, x}(\alpha)$. Enfin, le calcul clos $\mathrm{conc}(\underline{\langle 2 \rangle}, \underline{\langle 3, k \rangle}) = \mathrm{aj}(\underline{\langle 2, 3 \rangle}, \underline k)$, les deux membres valant $\langle 2, 3, k \rangle$, et l'associativité ({{cal-ip-facteurs|Facteurs dans PA}}, (ii)) donnent $\mathrm{conc}(\underline{\langle 2 \rangle}, A) = \mathrm{conc}(\mathrm{aj}(\underline{\langle 2, 3 \rangle}, \underline k), E)$, d'où $I = \mathrm{cc}(\mathrm{aj}(\underline{\langle 2, 3 \rangle}, \underline k), E, \mathrm{Sb}(E, T, \underline k))$ dans les deux cas.

      *Bornes.* Soit $K = \mathrm{conc}(\mathrm{aj}(\underline{\langle 2, 3 \rangle}, \underline k), E)$, de sorte que $I = \mathrm{conc}(K, B)$. Par le point (iii) de {{cal-ip-facteurs|Facteurs dans PA}}, $\mathrm{aj}(\underline{\langle 2, 3 \rangle}, \underline k) \leqslant K \leqslant I$, $E \leqslant K$ et $B \leqslant I$. Le calcul clos $\underline k < \mathrm{aj}(\underline{\langle 2, 3 \rangle}, \underline k)$ donne $\underline k < I$, et $E \leqslant I$ donne $E < S\,I$. Dans le premier cas, $\mathrm{num}(y) \leqslant B$ par le point (i) de {{cal-sg-gabarits|Gabarits à plusieurs places}}, puisque la place de $x$ figure dans $G_{\bar x, x}(\alpha)$. Dans le second, le calcul clos $\underline 9 \leqslant \underline{\langle 3, k \rangle}$, vrai puisque $\langle 3, k \rangle = 2^7 (2k + 1) \geqslant 2\,176$, et les inégalités $\underline{\langle 3, k \rangle} \leqslant A \leqslant \mathrm{conc}(\underline{\langle 2 \rangle}, A) \leqslant I$, par le même point (iii), donnent $\underline 9 \leqslant I$. Trois introductions des quantifications bornées strictes concluent.

      (ii) C'est la preuve du point (iii) de {{cal-ip-instanciation|Instanciation formalisée}}, avec le terme $A$ à la place du chiffre $\underline{n_\forall}$ et $B$ à la place de $\gamma$. Sous l'hypothèse $\widehat{\mathrm{Dem}}(q, A)$, pour une variable $q$ nouvelle, distincte des $y_i$ et de $y$, soit $e = \mathrm{aj}(0, I)$. Par (i) et le point (i) de {{cal-ip-instanciation|Instanciation formalisée}}, $\widehat{\mathrm{Dem}}(e, I)$. La formule naturelle de $\mathrm{MP}(a, b, c) \iff b = \mathrm{cc}(\langle 2 \rangle, a, c)$ donne $\widehat{\mathrm{MP}}(A, I, B)$ par la définition de $I$, et $\widehat{\mathrm{Fm}}(B)$ découle du point (iv) de {{cal-sg-gabarits|Gabarits à plusieurs places}}. Le point (iii) de {{cal-sp-derivabilite|Deuxième condition (D2)}}, écrit avec des variables distinctes des $y_i$ et de $y$, où l'on substitue $e$, $q$, $A$, $I$ et $B$, donne $\widehat{\mathrm{Dem}}(\mathrm{aj}(\mathrm{conc}(e, q), B), B)$, puis $\mathrm{Prf}_T(B)$ par l'introduction de l'existentiel. On élimine les valeurs ; l'hypothèse est $\widehat{\mathrm{Dem}}(p, A)[q/p]$, et $q$ ne figure ni dans $\widehat{\mathrm{Dem}}(p, A)$ ni dans la conclusion : la troisième règle du point (i) de {{cal-pa-recurrence|Récurrence dans PA}} la remplace par $\mathrm{Prf}_T(A)$, et le théorème de la déduction conclut.

      (iii) Par récurrence sur $r$, en [[metatheorie|métathéorie]]. Si $T \vdash \psi$, la généralisation, qui vaut pour toute théorie ({{cal-pa-recurrence|Récurrence dans PA}}, (i)), donne $T \vdash \forall x_1 \cdots \forall x_r\, \psi$. Pour $j \leqslant r$, soit $\alpha_j = \forall x_{j+1} \cdots \forall x_r\, \psi$, et montrons $\vdash_{\mathsf{PA}} \mathrm{Prf}_T(\ulcorner \alpha_j[\dot y_1, \dots, \dot y_j/x_1, \dots, x_j] \urcorner)$. Pour $j = 0$, c'est le point (i) de {{cal-ip-instanciation|Instanciation formalisée}}, puisque, sans place, le code est le chiffre $\underline{\ulcorner \alpha_0 \urcorner}$. Pour le pas, $\alpha_j = \forall x_{j+1}\, \alpha_{j+1}$, et $x_1, \dots, x_{j+1}$ sont des paramètres de $\alpha_{j+1}$, puisqu'elles sont distinctes de $x_{j+2}, \dots, x_r$ et ne sont pas quantifiées dans $\psi$ ; (ii), appliqué à $\alpha_{j+1}$, aux paramètres $x_1, \dots, x_j$ et à la variable $x_{j+1}$, et le [[modus-ponens|modus ponens]] donnent le rang $j + 1$. Pour $j = r$, c'est l'énoncé.

      (iv) Par le texte de {{cal-sg-gabarits|Gabarits à plusieurs places}}, $G_{\bar x}({\to}\, \alpha\, \beta) = (2)\, G_{\bar x}(\alpha)\, G_{\bar x}(\beta)$, et le point (i) de ce nœud donne $\ulcorner (\alpha \to \beta)[\dot{\bar y}/\bar x] \urcorner = \mathrm{cc}(\underline{\langle 2 \rangle}, \gamma_\alpha, \gamma_\beta)$, où $\gamma_\alpha$ et $\gamma_\beta$ sont les deux autres codes ; d'où $\widehat{\mathrm{MP}}(\gamma_\alpha, \ulcorner (\alpha \to \beta)[\dot{\bar y}/\bar x] \urcorner, \gamma_\beta)$, et le point (iv) du même nœud donne $\widehat{\mathrm{Fm}}(\gamma_\beta)$. La suite est celle de la seconde formule du point (iv) de {{cal-ip-instanciation|Instanciation formalisée}} : sous les hypothèses $\widehat{\mathrm{Dem}}(p, \cdot)$ et $\widehat{\mathrm{Dem}}(q, \gamma_\alpha)$, pour une variable $q$ nouvelle, la mise bout à bout ({{cal-sp-derivabilite|Deuxième condition (D2)}}, (iii)) donne $\mathrm{Prf}_T(\gamma_\beta)$ ; on élimine $q$, puis $p$, et l'on applique deux fois le théorème de la déduction.

      (v) Soit $u$ une variable qui ne figure pas dans $\alpha$, distincte de $x$ et des $x_i$. Comme $x$ n'est pas quantifiée dans $\alpha$ et que $u$ n'y figure pas, $u$ est substituable à $x$ dans $\alpha$, et le point (iii) de {{cal-rp-calcul|Calcul à variables libres}} donne $\vdash \alpha[u/x] \to \exists x\, \alpha$, donc $T \vdash \alpha[u/x] \to \exists x\, \alpha$ par le point (i) du même nœud. Les variables $\bar x$ et $u$ sont des paramètres de cette formule, où seules $x$ et les variables quantifiées de $\alpha$ sont quantifiées. Par (iii) et (iv), avec les valeurs $\bar y$ et $y$, il vient
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\mathrm{Prf}_T\big(\ulcorner \alpha[u/x][\dot{\bar y}, \dot y/\bar x, u] \urcorner\big) \\ &\to \mathrm{Prf}_T\big(\ulcorner (\exists x\, \alpha)[\dot{\bar y}, \dot y/\bar x, u] \urcorner\big). \end{aligned}$$
      Par le texte de {{cal-sg-gabarits|Gabarits à plusieurs places}}, le premier code est $\ulcorner \alpha[\dot{\bar y}, \dot y/\bar x, x] \urcorner$, puisque renommer un paramètre ne change pas le gabarit, et le second est $\ulcorner (\exists x\, \alpha)[\dot{\bar y}/\bar x] \urcorner$, puisque $u$ ne figure pas dans $\exists x\, \alpha$.

      Une théorie qui démontre les axiomes de $\mathsf{PA}$ démontre tout ce que démontre $\mathsf{PA}$, par le lemme de remplacement de la preuve du {{cal-craig|théorème de Craig}}.
    remarques:
      - |
        Le point (iii) est la forme interne à $\mathsf{PA}$, uniforme en $y_1, \dots, y_r$, de la règle d'instanciation par des chiffres : d'une démonstration de la clôture universelle de $\psi$, on tire, pour toutes valeurs $n_1, \dots, n_r$ des $y_i$, une démonstration de $\psi[\underline{n_1}, \dots, \underline{n_r}/\bar x]$, en ajoutant deux lignes par paramètre, un axiome du groupe (2) et un modus ponens, puisque le code fourni par la preuve de (ii) est $\mathrm{aj}(\mathrm{conc}(\mathrm{aj}(0, I), q), B)$, de longueur $\mathrm{lg}(q) + 2$. La seconde instanciation, qui échappait au nœud {{cal-ip-instanciation|Instanciation formalisée}}, porte sur le code variable $E$ : c'est la composition de {{cal-sg-substitution|Substitution lettre à lettre}} qui permet de la reconnaître.
      - |
        L'hypothèse que les $x_i$ sont des paramètres n'est pas une commodité. Dans la preuve de (v), on ne peut pas prendre $x$ elle-même comme paramètre de la formule $\alpha \to \exists x\, \alpha$, où $x$ est à la fois libre et quantifiée : le gabarit lettre à lettre marquerait la variable du bloc $\forall x$. L'erreur la plus répandue serait de croire que la logique « sous $\mathrm{Prf}_T$ » se transporte sans changement ; elle se transporte, mais au prix de renommages, comme ici par la variable nouvelle $u$, et comme au nœud {{cal-sg-delta0|Σ₁-complétude formalisée}}, où les variables liées des formules Δ₀ sont d'abord rendues distinctes des paramètres.

  - id: cal-sg-valeurs
    etiquette: Valeurs des termes sous Prf
    nature: proposition
    titre: Tables d'addition et de multiplication, valeurs des termes et formules atomiques sous la démontrabilité formalisée
    texte: |
      Les conventions sont celles de {{cal-sg-instanciation|Instanciation à plusieurs paramètres}}, et l'on suppose désormais que $T$ démontre les axiomes de $\mathsf{PA}$ ; elle démontre donc tout ce que démontre $\mathsf{PA}$, par le lemme de remplacement de la preuve du {{cal-craig|théorème de Craig}}, et le point (iii) de {{cal-sg-instanciation|Instanciation à plusieurs paramètres}} s'applique à tout théorème de $\mathsf{PA}$ dont les paramètres ne sont pas quantifiés. Soit $z_1$, $z_2$, $z_3$, $z_4$ des variables distinctes, qui servent de places. Pour un terme $s$ du langage, $\dot s$ désigne, comme au nœud {{cal-sg-gabarits|Gabarits à plusieurs places}}, le terme fonctionnel $\mathrm{num}(s)$ placé dans un code.

      Les égalités de [[code-mot|codes]] de ce nœud et du suivant sont toutes des cas des points (ii) et (iii) de {{cal-sg-gabarits|Gabarits à plusieurs places}} : remplir une place par $\mathrm{num}(0)$, c'est écrire la lettre $0$ ; la remplir par $\mathrm{num}(S\,\rho)$, c'est écrire $S$ suivi du chiffre de $\rho$ ; et une place qui ne figure pas peut être ajoutée ou retirée. On dit qu'on *transporte le code* quand on remplace ainsi un code par un code égal sous $\mathrm{Prf}_T$, par le remplacement ({{cal-sp-termes|Termes fonctionnels}}, (ii) (c)).
    enonce: |
      Soit $a$ et $b$ des variables distinctes.

      (i) **Tables.** $\mathsf{PA}$ démontre
      $$\begin{aligned} &\mathrm{Prf}_T\big(\ulcorner (z_1 + z_2 = z_3) \\ &\qquad [\dot a, \dot b, (a + b)^{\boldsymbol\cdot}/z_1, z_2, z_3] \urcorner\big), \\ &\mathrm{Prf}_T\big(\ulcorner (z_1 \times z_2 = z_3) \\ &\qquad [\dot a, \dot b, (a \times b)^{\boldsymbol\cdot}/z_1, z_2, z_3] \urcorner\big). \end{aligned}$$

      (ii) **Inégalité.** $\vdash_{\mathsf{PA}} \neg(a = b) \to \mathrm{Prf}_T\big(\ulcorner \neg(z_1 = z_2)[\dot a, \dot b/z_1, z_2] \urcorner\big)$.

      (iii) **Valeurs des termes.** Soit $t$ un terme, $\bar x = (x_1, \dots, x_r)$ des variables distinctes qui contiennent celles de $t$, et $z$ une variable hors de $\bar x$. Alors $\vdash_{\mathsf{PA}} \mathrm{Prf}_T\big(\ulcorner (t = z)[\dot{\bar x}, \dot t/\bar x, z] \urcorner\big)$.

      (iv) **Formules atomiques.** Si les variables des termes $t$ et $u$ sont parmi les $x_i$, alors
      $$\begin{aligned} &\vdash_{\mathsf{PA}} t = u \\ &\qquad \to \mathrm{Prf}_T\big(\ulcorner (t = u)(\dot{\bar x}) \urcorner\big), \\ &\vdash_{\mathsf{PA}} \neg(t = u) \\ &\qquad \to \mathrm{Prf}_T\big(\ulcorner \neg(t = u)(\dot{\bar x}) \urcorner\big). \end{aligned}$$
    preuve: |
      Toutes les formules poussées sous $\mathrm{Prf}_T$ par le point (iii) de {{cal-sg-instanciation|Instanciation à plusieurs paramètres}} sont ici sans quantificateur, de sorte que leurs variables en sont des paramètres ; ce sont des instances des axiomes de $\mathsf Q$, ou des formules que démontrent les règles de l'égalité de {{cal-rp-calcul|Calcul à variables libres}}, (vi), et la règle des tautologies. On note $\mathrm{D1}$ et $\mathrm{D2}$ les points (iii) et (iv) de {{cal-sg-instanciation|Instanciation à plusieurs paramètres}}. Une égalité entre valeurs, comme $a + 0 = a$, se transporte dans un code par le remplacement appliqué au terme fonctionnel $\mathrm{num}(\cdot)$.

      (i) *Addition.* Montrons, par récurrence sur $b$, avec le paramètre $a$, la formule $\Phi(b) = \mathrm{Prf}_T(\ulcorner (z_1 + z_2 = z_3)[\dot a, \dot b, (a + b)^{\boldsymbol\cdot}] \urcorner)$. Pour $0$, $\mathrm D1$ appliqué à l'axiome $z_1 + 0 = z_1$ ($\mathrm Q_4$), avec la valeur $a$, donne $\mathrm{Prf}_T(\ulcorner (z_1 + 0 = z_1)[\dot a/z_1] \urcorner)$. Ce code est celui de $\Phi(0)$ : la formule $z_1 + 0 = z_1$ s'obtient de $z_1 + z_2 = z_3$ en substituant $0$ à $z_2$ et $z_1$ à $z_3$, et le point (iii) de {{cal-sg-gabarits|Gabarits à plusieurs places}} donne le code rempli par $\mathrm{num}(a)$, $\mathrm{num}(0)$ et $\mathrm{num}(a)$ ; on transporte enfin $\mathrm{num}(a) = \mathrm{num}(a + 0)$, par $\mathrm Q_4$.

      Pour le pas, soit $c$ la valeur de $a + b$, et considérons, avec les places $z_1, z_2, z_3$ et les valeurs $a, b, c$, les formules $\theta_1 = (z_1 + S\,z_2 = S(z_1 + z_2))$, axiome $\mathrm Q_5$, $\theta_2 = (z_1 + z_2 = z_3 \to S(z_1 + z_2) = S\,z_3)$, et $\theta_3 = (\theta_1 \to (S(z_1 + z_2) = S\,z_3 \to z_1 + S\,z_2 = S\,z_3))$, que démontrent les règles de l'égalité. Par $\mathrm D1$, elles sont démontrables sous $\mathrm{Prf}_T$ avec ces valeurs. L'hypothèse de récurrence, où l'on transporte $\mathrm{num}(a + b) = \mathrm{num}(c)$, et $\mathrm D2$ appliqué à $\theta_2$ donnent $\mathrm{Prf}_T(\ulcorner (S(z_1 + z_2) = S\,z_3)[\dot a, \dot b, \dot c] \urcorner)$ ; deux applications de $\mathrm D2$ à $\theta_3$, avec $\theta_1$, donnent $\mathrm{Prf}_T(\ulcorner (z_1 + S\,z_2 = S\,z_3)[\dot a, \dot b, \dot c] \urcorner)$. Par le point (iii) de {{cal-sg-gabarits|Gabarits à plusieurs places}}, appliqué deux fois, ce code est celui de $z_1 + z_2 = z_3$ rempli par $\mathrm{num}(a)$, $\mathrm{num}(S\,b)$ et $\mathrm{num}(S\,c)$, et l'on transporte $S\,c = S(a + b) = a + S\,b$, par $\mathrm Q_5$ : c'est $\Phi(S\,b)$. La récurrence ({{cal-pa-recurrence|Récurrence dans PA}}, (iii)) conclut.

      *Multiplication.* Même récurrence sur $b$. Pour $0$, $\mathrm D1$ appliqué à $z_1 \times 0 = 0$ ($\mathrm Q_6$) donne le code de $z_1 \times z_2 = z_3$ rempli par $\mathrm{num}(a)$, $\mathrm{num}(0)$, $\mathrm{num}(0)$, et l'on transporte $\mathrm{num}(0) = \mathrm{num}(a \times 0)$. Pour le pas, soit $c$ la valeur de $a \times b$ et $d$ celle de $c + a$, et prenons les places $z_1, z_2, z_3, z_4$ avec les valeurs $a, b, c, d$. L'axiome $\mathrm Q_7$ donne $z_1 \times S\,z_2 = z_1 \times z_2 + z_1$ ; l'hypothèse de récurrence et la formule $z_1 \times z_2 = z_3 \to z_1 \times z_2 + z_1 = z_3 + z_1$ donnent, par $\mathrm D2$, $z_1 \times z_2 + z_1 = z_3 + z_1$ sous $\mathrm{Prf}_T$ ; la table d'addition, où l'on substitue $c$ et $a$ à $a$ et $b$ ({{cal-sp-termes|Termes fonctionnels}}, (ii) (b)), donne $z_3 + z_1 = z_4$, puisque le code de $z_1 + z_2 = z_3$ rempli par $\mathrm{num}(c)$, $\mathrm{num}(a)$, $\mathrm{num}(d)$ est le même terme fonctionnel que celui de $z_3 + z_1 = z_4$ rempli par les quatre valeurs. Deux applications de la transitivité, poussée sous $\mathrm{Prf}_T$ par $\mathrm D1$ et $\mathrm D2$, donnent $z_1 \times S\,z_2 = z_4$, qui est $z_1 \times z_2 = z_3$ rempli par $\mathrm{num}(a)$, $\mathrm{num}(S\,b)$ et $\mathrm{num}(d)$, la place $z_3$ ne figurant plus ; on transporte $d = a \times b + a = a \times S\,b$, par $\mathrm Q_7$.

      (ii) Montrons, par récurrence sur $a$, la formule $\forall b\, \big(\neg(a = b) \to \mathrm{Prf}_T(\ulcorner \neg(z_1 = z_2)[\dot a, \dot b] \urcorner)\big)$. Pour $0$, sous l'hypothèse $\neg(0 = b)$, la symétrie et l'instance $\neg(b = 0) \to \exists w\, (b = S\,w)$ ({{cal-pa-recurrence|Récurrence dans PA}}) permettent de raisonner sous $b = S\,b'$, pour une variable nouvelle $b'$. $\mathrm D1$ appliqué à $\neg(0 = S\,z_2)$, conséquence de $\mathrm Q_1$ et de la symétrie, avec la valeur $b'$, donne un code qui est, par le point (iii) de {{cal-sg-gabarits|Gabarits à plusieurs places}}, celui de $\neg(z_1 = z_2)$ rempli par $\mathrm{num}(0)$ et $\mathrm{num}(S\,b')$ ; on transporte $S\,b' = b$, et l'on élimine $b'$.

      Pour le pas, sous l'hypothèse de récurrence et sous $\neg(S\,a = b)$, distinguons $b = 0$ et $b = S\,b'$. Si $b = 0$, $\mathrm D1$ appliqué à $\neg(S\,z_1 = 0)$, avec la valeur $a$, donne le code de $\neg(z_1 = z_2)$ rempli par $\mathrm{num}(S\,a)$ et $\mathrm{num}(0)$. Si $b = S\,b'$, alors $\neg(a = b')$, puisque $a = b'$ donnerait $S\,a = b$ ; l'hypothèse de récurrence, instanciée par $b'$, donne $\mathrm{Prf}_T(\ulcorner \neg(z_1 = z_2)[\dot a, \dot b'] \urcorner)$, et $\mathrm D1$ et $\mathrm D2$, appliqués à la contraposée $\neg(z_1 = z_2) \to \neg(S\,z_1 = S\,z_2)$ de $\mathrm Q_2$, donnent le code de $\neg(S\,z_1 = S\,z_2)$, c'est-à-dire celui de $\neg(z_1 = z_2)$ rempli par $\mathrm{num}(S\,a)$ et $\mathrm{num}(S\,b')$. On transporte $S\,b' = b$, on généralise en $b$, et la récurrence conclut ; l'instanciation par $b$ donne l'énoncé.

      (iii) Par récurrence sur la construction de $t$, en [[metatheorie|métathéorie]]. Si $t$ est $0$, le code est celui de $0 = z$ rempli par $\mathrm{num}(0)$, c'est-à-dire celui de l'énoncé $0 = 0$, et $\mathrm D1$, sans paramètre, conclut. Si $t$ est $x_i$, c'est le code de $x_i = x_i$, et $\mathrm D1$ appliqué à cette formule conclut. Si $t$ est $S\,t_1$, l'hypothèse de récurrence donne $\mathrm{Prf}_T(\ulcorner (t_1 = z)[\dot{\bar x}, \dot t_1] \urcorner)$ ; $\mathrm D1$ appliqué à $t_1 = z \to S\,t_1 = S\,z$, avec les valeurs $\bar x$ et une variable $y$ à laquelle on substitue ensuite $t_1$, puis $\mathrm D2$, donnent le code de $S\,t_1 = S\,z$ rempli par $\mathrm{num}(t_1)$, qui est celui de $S\,t_1 = z$ rempli par $\mathrm{num}(S\,t_1)$, par le point (ii) de {{cal-sg-gabarits|Gabarits à plusieurs places}}.

      Si $t$ est $t_1 + t_2$, soit $z'$ et $z''$ des variables nouvelles, distinctes. L'hypothèse de récurrence donne les codes de $t_1 = z'$ et de $t_2 = z''$, remplis par $\mathrm{num}(t_1)$ et $\mathrm{num}(t_2)$, et la table d'addition, où l'on substitue $t_1$ et $t_2$ à des variables $a$ et $b$ prises hors de ces termes, donne celui de $z' + z'' = z$, rempli par $\mathrm{num}(t_1)$, $\mathrm{num}(t_2)$ et $\mathrm{num}(t_1 + t_2)$, qui est le même terme fonctionnel que le code de $z_1 + z_2 = z_3$ rempli par ces valeurs. Avec les places $\bar x, z', z'', z$ et ces valeurs, $\mathrm D1$ et $\mathrm D2$ appliqués à $t_1 = z' \to (t_2 = z'' \to t_1 + t_2 = z' + z'')$, puis à la transitivité $t_1 + t_2 = z' + z'' \to (z' + z'' = z \to t_1 + t_2 = z)$, donnent le code de $t_1 + t_2 = z$, où les places $z'$ et $z''$ ne figurent plus. Le cas de $\times$ est le même, avec la table de multiplication.

      (iv) Soit $z$ et $z'$ des variables nouvelles, distinctes. Sous l'hypothèse $t = u$, on transporte $\mathrm{num}(u) = \mathrm{num}(t)$ dans le code que (iii) donne pour $u = z$ ; avec celui de $t = z$, $\mathrm D1$ et $\mathrm D2$ appliqués à $t = z \to (u = z \to t = u)$, avec les places $\bar x, z$ et les valeurs $\bar x, t$, donnent le code de $t = u$, où la place $z$ ne figure pas. Sous l'hypothèse $\neg(t = u)$, le point (ii), où l'on substitue $t$ et $u$ à $a$ et $b$, donne le code de $\neg(z = z')$ rempli par $\mathrm{num}(t)$ et $\mathrm{num}(u)$, et (iii) ceux de $t = z$ et de $u = z'$ ; $\mathrm D1$ et trois applications de $\mathrm D2$ à $t = z \to (u = z' \to (\neg(z = z') \to \neg(t = u)))$, que démontrent les règles de l'égalité, donnent le code de $\neg(t = u)$. Le théorème de la déduction conclut dans les deux cas.
    remarques:
      - |
        Le point (i) n'est pas une conséquence de la première condition appliquée aux égalités vraies $\underline m + \underline n = \underline{m + n}$ : celle-ci donne un théorème de $\mathsf{PA}$ pour chaque couple d'entiers, alors que (i) est un seul théorème, à variables libres $a$ et $b$, qui vaut aussi pour les éléments non standard d'un modèle de $\mathsf{PA}$. L'erreur la plus répandue est de confondre ces deux formes ; c'est la récurrence sur $b$, menée à l'intérieur de $\mathsf{PA}$ et poussée sous $\mathrm{Prf}_T$ par les axiomes $\mathrm Q_4$ et $\mathrm Q_5$, qui donne la forme uniforme, comme la récurrence de {{cal-pa-ordre|Ordre dans PA}} remplaçait l'énumération des cas de {{cal-rp-calculs-q|Calculs dans Q}}.
      - |
        Les codes en jeu sont gigantesques, même pour des énoncés minuscules : pour $0 + 0 = 0$, de lettres $(0, 6, 4, 4, 4)$, on a $\langle 0, 6 \rangle = 26$, $\langle 0, 6, 4 \rangle = 2^{26} \cdot 9 = 603\,979\,776$, puis $\langle 0, 6, 4, 4 \rangle = 2^{603\,979\,776} \cdot 9$, qui a $181\,816\,031$ chiffres décimaux, et le code de l'énoncé en est la puissance de $2$ suivante, multipliée par $9$. Aucune preuve de ce nœud ne calcule ces entiers : elles raisonnent sur des termes fonctionnels, par les égalités de gabarits, et c'est ce qui permet d'énoncer (iii) pour une variable.

  - id: cal-sg-delta0
    etiquette: Σ₁-complétude formalisée
    nature: théorème
    titre: Variantes propres et Σ₁-complétude formalisée dans l'arithmétique de Peano
    texte: |
      Les conventions sont celles de {{cal-sg-valeurs|Valeurs des termes sous Prf}} ; $T$ démontre les axiomes de $\mathsf{PA}$. Les formules Δ₀ et les quantifications bornées $\forall x \leqslant t\ \varphi = \forall x\, \big(\exists z\, (z + x = t) \to \varphi\big)$, où $t$ ne contient ni $x$ ni $z$, sont celles de {{cal-rp-sigma1|Σ₁-complétude}}. Une formule $\delta$ est *propre* si aucune variable n'y est quantifiée deux fois, c'est-à-dire qu'aucune variable ne porte deux blocs $\forall$ de $\delta$, et si aucune variable libre de $\delta$ n'y est quantifiée. Alors, dans toute [[sous-formule|sous-formule]] $\psi$ de $\delta$, aucune variable libre de $\psi$ n'est quantifiée dans $\psi$ : elle serait libre dans $\delta$, ou liée par un bloc extérieur à $\psi$, et donc quantifiée deux fois. Les sous-formules d'une formule propre sont propres.
    enonce: |
      (i) **Variantes propres.** Pour toute formule Δ₀ $\delta$ et toute partie finie $V$ de l'ensemble des variables, il existe une formule Δ₀ propre $\delta'$, de mêmes variables libres que $\delta$, dont aucune variable quantifiée n'est dans $V$, telle que $\vdash \delta \leftrightarrow \delta'$.

      (ii) **Formules Δ₀.** Soit $\delta$ une formule Δ₀ propre où ne figure pas la variable $p$, et $\bar x = (x_1, \dots, x_r)$ des variables distinctes de $p$ et distinctes entre elles, parmi lesquelles figurent toutes les variables libres de $\delta$, et dont aucune n'est quantifiée dans $\delta$. Alors
      $$\begin{aligned} &\vdash_{\mathsf{PA}} \delta \to \mathrm{Prf}_T\big(\ulcorner \delta(\dot{\bar x}) \urcorner\big), \\ &\vdash_{\mathsf{PA}} \neg\delta \to \mathrm{Prf}_T\big(\ulcorner \neg\delta(\dot{\bar x}) \urcorner\big). \end{aligned}$$

      (iii) **Formules Σ₁.** Si de plus $y$ est une variable hors de $\bar x$, distincte de $p$, non quantifiée dans $\delta$, et si les variables libres de $\delta$ sont parmi $\bar x$ et $y$, alors $\vdash_{\mathsf{PA}} \exists y\, \delta \to \mathrm{Prf}_T\big(\ulcorner (\exists y\, \delta)(\dot{\bar x}) \urcorner\big)$.
    preuve: |
      (i) Par récurrence sur la construction des formules Δ₀, l'énoncé portant sur toutes les parties finies $V$ à la fois. Une [[formule-atomique|formule atomique]] est propre, sans variable quantifiée. Si $\delta = \neg\delta_1$, on prend $\neg\delta'_1$, où $\delta'_1$ est donnée par l'hypothèse de récurrence. Si $\delta = (\delta_1 \to \delta_2)$, soit $L$ l'ensemble des variables libres de $\delta$ ; on prend $\delta'_1$ pour la partie $V \cup L$, puis $\delta'_2$ pour la partie $V \cup L$ augmentée des variables quantifiées de $\delta'_1$, et $\delta' = (\delta'_1 \to \delta'_2)$ : chaque variable y est quantifiée au plus une fois, aucune variable de $L$ n'y est quantifiée, et la règle des tautologies donne $\vdash \delta \leftrightarrow \delta'$.

      Soit enfin $\delta = \forall x\, (\exists z\, (z + x = t) \to \psi)$. Soit $x'$ et $z'$ deux variables distinctes, hors de $V$, qui ne figurent pas dans $\delta$. Par le point (i) de {{cal-rp-sigma1|Σ₁-complétude}}, $\psi[x'/x]$ est Δ₀, puisque $x'$ n'est pas quantifiée dans $\psi$ ; soit $\psi'$ la formule que donne l'hypothèse de récurrence pour $\psi[x'/x]$ et la partie $V \cup L \cup \{x, z, x', z'\}$, et $\delta' = \forall x'\, (\exists z'\, (z' + x' = t) \to \psi')$. C'est une quantification bornée d'une formule Δ₀, puisque $t$ ne contient ni $x'$ ni $z'$. Elle est propre : $x'$ et $z'$ y sont quantifiées une fois chacune, les variables quantifiées de $\psi'$ évitent $x'$, $z'$ et $L$, et les variables libres de $\delta'$ sont celles de $t$ et celles de $\psi'$ autres que $x'$, c'est-à-dire celles de $\delta$.

      *Équivalence.* Notons $B = \exists z\, (z + x = t)$. Sous l'hypothèse $\delta$, l'axiome (2), avec le terme $x'$, substituable puisqu'il ne figure pas dans $\delta$, donne $B[x'/x] \to \psi[x'/x]$, où $B[x'/x] = \exists z\, (z + x' = t)$ puisque $x$ ne figure pas dans $t$ ; le renommage du point (iii) de {{cal-rp-calcul|Calcul à variables libres}} donne $\exists z'\, (z' + x' = t) \to \exists z\, (z + x' = t)$, puisque $z$ ne figure pas dans $z' + x' = t$, et l'hypothèse de récurrence donne $\psi[x'/x] \to \psi'$. La règle des tautologies, puis la généralisation en $x'$, qui n'est pas libre dans $\delta$, donnent $\delta \to \delta'$. Réciproquement, sous l'hypothèse $\delta'$, l'axiome (2), avec le terme $x$, substituable puisque $x$ n'est quantifiée ni dans $\psi'$ ni ailleurs dans $\delta'$, donne $\exists z'\, (z' + x = t) \to \psi'[x/x']$. Les [[occurrence|occurrences]] libres de $x'$ dans $\psi[x'/x]$ sont aux places des occurrences libres de $x$ dans $\psi$, dont aucune n'est dans une sous-formule $\forall x\, \chi$ ; ainsi $x$ est substituable à $x'$ dans $\psi[x'/x]$, et $\psi[x'/x][x/x'] = \psi$, comme dans la preuve du renommage citée. L'instanciation du point (ii) de {{cal-rp-calcul|Calcul à variables libres}}, appliquée à $\psi' \to \psi[x'/x]$, donne $\psi'[x/x'] \to \psi$, et le renommage donne $B \to \exists z'\, (z' + x = t)$ ; la règle des tautologies et la généralisation en $x$, qui n'est pas libre dans $\delta'$, donnent $\delta' \to \delta$.

      (ii) Par récurrence sur la construction de $\delta$, en [[metatheorie|métathéorie]], les deux formules à la fois ; les variables nouvelles sont prises distinctes de $p$. On note $\mathrm D1$, $\mathrm D2$ et $\exists$ les points (iii), (iv) et (v) de {{cal-sg-instanciation|Instanciation à plusieurs paramètres}}, que l'on applique à des théorèmes de $\mathsf{PA}$, donc de $T$, dont les variables $\bar x$ sont des paramètres ; les égalités de [[code-mot|codes]] sont celles des points (ii) et (iii) de {{cal-sg-gabarits|Gabarits à plusieurs places}}.

      *Formules atomiques.* C'est le point (iv) de {{cal-sg-valeurs|Valeurs des termes sous Prf}}.

      *Négation.* Si $\delta = \neg\delta_1$, la première formule est la seconde pour $\delta_1$. Pour la seconde, sous l'hypothèse $\neg\neg\delta_1$, on a $\delta_1$, puis $\mathrm{Prf}_T(\ulcorner \delta_1(\dot{\bar x}) \urcorner)$, et $\mathrm D1$ et $\mathrm D2$, appliqués à l'[[instance-tautologie|instance de tautologie]] $\delta_1 \to \neg\neg\delta_1$, donnent $\mathrm{Prf}_T(\ulcorner \neg\neg\delta_1(\dot{\bar x}) \urcorner)$.

      *Implication.* Si $\delta = (\delta_1 \to \delta_2)$, la règle des tautologies donne $\neg\delta_1$ ou $\delta_2$. Dans le premier cas, l'hypothèse de récurrence pour $\delta_1$, et $\mathrm D1$ et $\mathrm D2$ appliqués à $\neg\delta_1 \to (\delta_1 \to \delta_2)$, concluent ; dans le second, on emploie $\delta_2 \to (\delta_1 \to \delta_2)$. Sous l'hypothèse $\neg(\delta_1 \to \delta_2)$, on a $\delta_1$ et $\neg\delta_2$, et l'on emploie $\delta_1 \to (\neg\delta_2 \to \neg(\delta_1 \to \delta_2))$. Les variables libres de $\delta_1$ et de $\delta_2$ sont parmi les $x_i$, et aucune de celles-ci n'est quantifiée dans $\delta_1$ ou dans $\delta_2$.

      *Quantification bornée.* Soit $\delta = \forall x\, (B \to \psi)$, avec $B = \exists z\, (z + x = t)$. Comme $\delta$ est propre, $x$ et $z$ ne sont pas parmi les $x_i$, $x$ n'est pas quantifiée dans $\psi$, $z$ n'est pas libre dans $\psi$, et $\psi$ est propre ; ses variables libres sont parmi $\bar x$ et $x$, et l'hypothèse de récurrence s'applique à $\psi$ avec les paramètres $\bar x, x$. Soit $w$ une variable nouvelle, distincte de $p$, et $\delta_w = \forall x\, (\exists z\, (z + x = w) \to \psi)$, de sorte que $\delta_w[t/w] = \delta$ et que $\bar x, w$ sont des paramètres de $\delta_w$.

      Montrons, par récurrence sur $w$, la formule $\delta_w \to \mathrm{Prf}_T(\ulcorner \delta_w[\dot{\bar x}, \dot w/\bar x, w] \urcorner)$. Pour $0$, le point (vii) (d) de {{cal-pa-ordre|Ordre dans PA}} donne $\delta_0 \leftrightarrow \psi[0/x]$. L'hypothèse de récurrence pour $\psi$, où l'on substitue $0$ à $x$ ({{cal-sp-termes|Termes fonctionnels}}, (ii) (b)), donne $\psi[0/x] \to \mathrm{Prf}_T(\ulcorner \psi \urcorner_{\bar x, x}(\mathrm{num}(\bar x), \mathrm{num}(0)))$, et ce code est $\ulcorner \psi[0/x](\dot{\bar x}) \urcorner$. Le même point (vii) (d) donne $\psi[0/x] \to \delta_0$, et $\mathrm D1$ et $\mathrm D2$, avec les paramètres $\bar x$, donnent $\mathrm{Prf}_T(\ulcorner \delta_0(\dot{\bar x}) \urcorner)$, dont le code est celui de $\delta_w$ rempli par $\mathrm{num}(\bar x)$ et $\mathrm{num}(0)$.

      Pour le pas, sous l'hypothèse de récurrence et sous $\delta_{S\,w}$, le point (vii) (d) de {{cal-pa-ordre|Ordre dans PA}}, permis puisque $S\,w$ est substituable à $x$ dans $\psi$, donne $\delta_w$ et $\psi[S\,w/x]$. L'hypothèse de récurrence donne $\mathrm{Prf}_T(\ulcorner \delta_w[\dot{\bar x}, \dot w] \urcorner)$ ; celle qui porte sur $\psi$, où l'on substitue $S\,w$ à $x$, donne le code de $\psi$ rempli par $\mathrm{num}(\bar x)$ et $\mathrm{num}(S\,w)$, qui est celui de $\psi[S\,w/x]$ rempli par $\mathrm{num}(\bar x)$ et $\mathrm{num}(w)$. Le même point (vii) (d) donne $\delta_w \to (\psi[S\,w/x] \to \delta_{S\,w})$, formule dont $\bar x, w$ sont des paramètres, et $\mathrm D1$ et deux applications de $\mathrm D2$ donnent le code de $\delta_{S\,w}$ rempli par $\mathrm{num}(\bar x)$ et $\mathrm{num}(w)$, c'est-à-dire, par le point (iii) de {{cal-sg-gabarits|Gabarits à plusieurs places}} avec $s = S\,w$, celui de $\delta_w$ rempli par $\mathrm{num}(\bar x)$ et $\mathrm{num}(S\,w)$. La récurrence ({{cal-pa-recurrence|Récurrence dans PA}}, (iii)) conclut.

      Substituons $t$ à $w$ : $t$ y est substituable, puisqu'il ne contient ni $x$ ni $z$, et l'on obtient $\delta \to \mathrm{Prf}_T(\ulcorner \delta_w \urcorner_{\bar x, w}(\mathrm{num}(\bar x), \mathrm{num}(t)))$. Le point (iii) de {{cal-sg-valeurs|Valeurs des termes sous Prf}} donne le code de $t = w$ rempli par $\mathrm{num}(\bar x)$ et $\mathrm{num}(t)$, et $\mathrm D1$ et $\mathrm D2$, appliqués à $t = w \to (\delta_w \to \delta)$, que donnent le remplacement d'un terme ({{cal-rp-calcul|Calcul à variables libres}}, (v)) et la symétrie, avec les places $\bar x, w$ et les valeurs $\bar x, t$, donnent $\mathrm{Prf}_T(\ulcorner \delta(\dot{\bar x}) \urcorner)$, la place $w$ ne figurant pas dans $\delta$.

      *Négation d'une quantification bornée.* Sous l'hypothèse $\neg\delta$, la règle des tautologies et la monotonie ({{cal-pa-recurrence|Récurrence dans PA}}, (ii)) donnent $\neg\forall x\, \neg\neg(B \to \psi)$, et l'élimination avec une variable nouvelle $a$, distincte de $p$ (troisième règle du point (i) du même nœud), permet de raisonner sous $B[a/x]$ et $\neg\psi[a/x]$, puis, par l'élimination de $z$ avec une variable nouvelle $c$, sous $c + a = t$. Soit $u$ une variable nouvelle. Le point (iv) de {{cal-sg-valeurs|Valeurs des termes sous Prf}}, appliqué à la formule atomique $z + u = t$ avec les paramètres $\bar x, z, u$, où l'on substitue $c$ et $a$ à $z$ et $u$, donne le code de $z + u = t$ rempli par $\mathrm{num}(\bar x)$, $\mathrm{num}(c)$ et $\mathrm{num}(a)$ ; le point $\exists$, avec la variable quantifiée $z$ et les paramètres $\bar x, u$, donne celui de $B[u/x] = \exists z\, (z + u = t)$ rempli par $\mathrm{num}(\bar x)$ et $\mathrm{num}(a)$. L'hypothèse de récurrence pour $\psi$, où l'on substitue $a$ à $x$, donne celui de $\neg\psi$ rempli par $\mathrm{num}(\bar x)$ et $\mathrm{num}(a)$, qui est le code de $\neg\psi[u/x]$ avec les places $\bar x, u$, puisque renommer un paramètre ne change pas le gabarit. Enfin, l'axiome (2), avec le terme $u$, et la règle des tautologies donnent $\vdash B[u/x] \to (\neg\psi[u/x] \to \neg\delta)$, dont $\bar x, u$ sont des paramètres ; $\mathrm D1$ et deux applications de $\mathrm D2$ donnent le code de $\neg\delta$, où la place $u$ ne figure pas. On élimine $c$, puis $a$, qui ne figurent pas dans la conclusion.

      (iii) Le point (ii), avec les paramètres $\bar x, y$, donne $\delta \to \mathrm{Prf}_T(\ulcorner \delta[\dot{\bar x}, \dot y/\bar x, y] \urcorner)$, et le point (v) de {{cal-sg-instanciation|Instanciation à plusieurs paramètres}}, où $\bar x$ et $y$ sont des paramètres de $\delta$, donne $\mathrm{Prf}_T(\ulcorner (\exists y\, \delta)(\dot{\bar x}) \urcorner)$. L'élimination de $y$, qui n'est libre ni dans cette conclusion ni dans aucune hypothèse, conclut.
    remarques:
      - |
        Dans l'arithmétique de Robinson, la preuve du point (ii) de {{cal-rp-sigma1|Σ₁-complétude}} examinait, pour une borne de valeur $m$, les $m + 1$ cas $x = \underline k$ ; elle donnait une démonstration pour chaque valeur des variables. Ici, la borne est une variable, et l'énumération est remplacée par une récurrence sur la borne, poussée sous $\mathrm{Prf}_T$ par le point (vii) (d) de {{cal-pa-ordre|Ordre dans PA}}, comme l'annonçait la seconde remarque de ce nœud. L'erreur la plus répandue serait de faire cette récurrence sur le terme $t$ lui-même : il peut contenir les autres variables, et c'est pourquoi on la mène sur une variable nouvelle $w$, remplacée par $t$ à la fin, comme dans la preuve de {{cal-pa-sigma|Collection et forme Σ₁}}.
      - |
        La condition « propre » est la forme que prend ici l'hypothèse sur les paramètres. Dans $\delta = (\forall x \leqslant y\ x = x) \to x = 0$, la variable $x$ est libre et quantifiée, et le code $\ulcorner \delta(\dot x, \dot y) \urcorner$ remplacerait aussi la variable du bloc ; la variante propre $(\forall x' \leqslant y\ x' = x') \to x = 0$, que donne le point (i), n'a plus ce défaut. Comme la variante propre est équivalente à la formule de départ en logique pure, ce renommage ne coûte rien au nœud suivant {{cal-sg-d3|Troisième condition (D3)}} : on démontre la Σ₁-complétude pour la variante, puis on revient à la formule de départ par la première et la deuxième condition.

  - id: cal-sg-d3
    etiquette: Troisième condition (D3)
    nature: théorème
    titre: Troisième condition de dérivabilité, théorème de Löb et second théorème d'incomplétude pour la formule naturelle
    texte: |
      Les conventions sont celles de {{cal-sp-derivabilite|Deuxième condition (D2)}} et de {{cal-sg-delta0|Σ₁-complétude formalisée}} : $T$ est une théorie sur la signature de l'arithmétique dont l'ensemble des [[code-mot|codes]] des axiomes est récursivement énumérable et qui démontre les axiomes de $\mathsf{PA}$, $\mathrm{Pr}_T(v) = \exists p\ \hat D(p, v)$ sa formule naturelle de démontrabilité, $\mathrm{Prf}_T$ celle des formules, et $\exists y\, \delta$ une formule Σ₁ que le point (i) de {{cal-sp-derivabilite|Deuxième condition (D2)}} associe à $\mathrm{Pr}_T$. On note $\bot$ l'énoncé $\neg(0 = 0)$ et $\mathrm{Coh}(T)$ l'énoncé $\neg\mathrm{Pr}_T\,\ulcorner \bot \urcorner$ : c'est l'énoncé qui exprime la cohérence de $T$ dans le second théorème d'incomplétude de la logique, construit à partir de la définition naturelle de l'ensemble des axiomes que fournit la théorie $T'$ du {{cal-craig|théorème de Craig}}.
    enonce: |
      (i) **Forme formalisée de la Σ₁-complétude.** Pour tout énoncé $\sigma$ de la classe $\mathcal S$, $\vdash_{\mathsf{PA}} \sigma \to \mathrm{Pr}_T\,\ulcorner \sigma \urcorner$.

      (ii) **Troisième condition de dérivabilité.** Pour tout énoncé $\varphi$,
      $$\vdash_{\mathsf{PA}} \mathrm{Pr}_T\,\ulcorner \varphi \urcorner \to \mathrm{Pr}_T\,\ulcorner \mathrm{Pr}_T\,\ulcorner \varphi \urcorner \urcorner,$$
      et de même pour la formule $\exists y\, \delta$. La théorie $T$ démontre ces énoncés.

      (iii) **Löb et second théorème.** Les formules $\mathrm{Pr}_T$ et $\exists y\, \delta$ satisfont dans $T$ les conditions de dérivabilité (D1) à (D3). Par conséquent, pour tout énoncé $\varphi$, si $T \vdash \mathrm{Pr}_T\,\ulcorner \varphi \urcorner \to \varphi$, alors $T \vdash \varphi$ ; et, si $T$ est cohérente, $T \nvdash \mathrm{Coh}(T)$.
    preuve: |
      (i) Soit $\sigma$ un énoncé de $\mathcal S$. Le point (ii) de {{cal-pa-sigma|Collection et forme Σ₁}} lui associe une formule $\exists y\, \delta_0$, où $\delta_0$ est Δ₀ et a ses variables libres parmi $y$, telle que $\vdash_{\mathsf{PA}} \sigma \leftrightarrow \exists y\, \delta_0$. Soit $y^*$ la variable $y$ si elle est distincte de $p$, une variable nouvelle sinon ; par le renommage de la preuve de {{cal-pa-sigma|Collection et forme Σ₁}}, (ii), $\vdash \exists y\, \delta_0 \leftrightarrow \exists y^*\, \delta_0[y^*/y]$, et $\delta_0[y^*/y]$ est Δ₀ par le point (i) de {{cal-rp-sigma1|Σ₁-complétude}}. Le point (i) de {{cal-sg-delta0|Σ₁-complétude formalisée}}, avec la partie $\{p, y^*\}$, fournit une formule Δ₀ propre $\delta^*$, de variables libres parmi $y^*$, où ne figure pas $p$ et où $y^*$ n'est pas quantifiée, telle que $\vdash \delta_0[y^*/y] \leftrightarrow \delta^*$ ; la monotonie ({{cal-pa-recurrence|Récurrence dans PA}}, (ii)) donne $\vdash_{\mathsf{PA}} \sigma \leftrightarrow \exists y^*\, \delta^*$.

      Le point (iii) de {{cal-sg-delta0|Σ₁-complétude formalisée}}, sans paramètre et avec la variable $y^*$, donne $\vdash_{\mathsf{PA}} \exists y^*\, \delta^* \to \mathrm{Prf}_T\,\ulcorner \exists y^*\, \delta^* \urcorner$. Comme $T$ démontre les axiomes de $\mathsf{PA}$, $T \vdash \exists y^*\, \delta^* \to \sigma$ ; le point (i) de {{cal-ip-instanciation|Instanciation formalisée}} donne $\vdash_{\mathsf{PA}} \mathrm{Prf}_T\,\ulcorner \exists y^*\, \delta^* \to \sigma \urcorner$, et le point (iv) de {{cal-sg-instanciation|Instanciation à plusieurs paramètres}}, sans paramètre, donne $\vdash_{\mathsf{PA}} \mathrm{Prf}_T\,\ulcorner \exists y^*\, \delta^* \urcorner \to \mathrm{Prf}_T\,\ulcorner \sigma \urcorner$. Enfin, $\sigma$ étant un énoncé, $\vdash_{\mathsf{PA}} \mathrm{Prf}_T\,\ulcorner \sigma \urcorner \leftrightarrow \mathrm{Pr}_T\,\ulcorner \sigma \urcorner$ par le même point (i) de {{cal-ip-instanciation|Instanciation formalisée}}, et la règle des tautologies enchaîne : $\vdash_{\mathsf{PA}} \sigma \to \mathrm{Pr}_T\,\ulcorner \sigma \urcorner$.

      (ii) La formule $\mathrm{Pr}_T$ est dans $\mathcal S$ et n'a pas d'autre variable libre que $v$ ({{cal-sp-derivabilite|Deuxième condition (D2)}}, (i)) ; par le point (i) de {{cal-bp-fonctions|Fonctions p.r. dans PA}}, $\mathrm{Pr}_T\,\ulcorner \varphi \urcorner = \mathrm{Pr}_T[\underline{\ulcorner \varphi \urcorner}/v]$ est un énoncé de $\mathcal S$, puisque le chiffre n'a pas de variable. Le point (i), appliqué à $\sigma = \mathrm{Pr}_T\,\ulcorner \varphi \urcorner$, est la troisième condition. La formule $\exists y\, \delta$ est Σ₁, donc dans $\mathcal S$, et $(\exists y\, \delta)[\underline{\ulcorner \varphi \urcorner}/v]$ est un énoncé de $\mathcal S$ ; le point (i) donne $\vdash_{\mathsf{PA}} (\exists y\, \delta)[\underline{\ulcorner \varphi \urcorner}/v] \to \mathrm{Pr}_T\,\ulcorner (\exists y\, \delta)[\underline{\ulcorner \varphi \urcorner}/v] \urcorner$, et l'équivalence $\vdash_{\mathsf{PA}} \mathrm{Pr}_T \leftrightarrow \exists y\, \delta$, instanciée par le chiffre du code de ce dernier énoncé ({{cal-pa-recurrence|Récurrence dans PA}}, (iv)), donne la troisième condition pour $\exists y\, \delta$. Une théorie qui démontre les axiomes de $\mathsf{PA}$ démontre tout ce que démontre $\mathsf{PA}$, par le lemme de remplacement de la preuve du {{cal-craig|théorème de Craig}}.

      (iii) La théorie $T$ démontre les axiomes de $\mathsf Q$, puisque $\mathsf{PA}$ démontre $\mathrm Q_3$ ({{cal-pa-recurrence|Récurrence dans PA}}). Les deux formules ont leurs variables libres parmi $v$. Si $T \vdash \varphi$, le point (i) de {{cal-sp-derivabilite|Deuxième condition (D2)}} donne $\vdash_{\mathsf{PA}} \mathrm{Pr}_T\,\ulcorner \varphi \urcorner$ et $\vdash_{\mathsf{PA}} (\exists y\, \delta)[\underline{\ulcorner \varphi \urcorner}/v]$, donc ces énoncés sont démontrables dans $T$ : c'est (D1). Le point (iv) du même nœud donne (D2) dans $T$, et (ii) donne (D3) dans $T$. Le point (i) de {{cal-dg-second|Löb et second théorème}} donne le théorème de Löb, et son point (ii), pour la formule $\mathrm{Pr}_T$, donne $T \nvdash \neg\mathrm{Pr}_T\,\ulcorner \bot \urcorner$, c'est-à-dire $T \nvdash \mathrm{Coh}(T)$, si $T$ est cohérente ; il en est de même pour $\exists y\, \delta$.
    remarques:
      - |
        La troisième condition n'est pas une conséquence de la première, et c'est l'erreur la plus répandue sur ce sujet. La première est une règle : si $T$ démontre $\mathrm{Pr}_T\,\ulcorner \varphi \urcorner$, elle démontre $\mathrm{Pr}_T\,\ulcorner \mathrm{Pr}_T\,\ulcorner \varphi \urcorner \urcorner$. La troisième est une implication démontrable, qui vaut même quand $T$ ne démontre pas $\mathrm{Pr}_T\,\ulcorner \varphi \urcorner$ ; c'est sous cette forme que la preuve du théorème de Löb, au nœud {{cal-dg-second|Löb et second théorème}}, l'applique à l'énoncé $\mathrm{Pr}_T\,\ulcorner L \urcorner$, dont la démontrabilité n'est pas acquise. Elle a demandé tout le chapitre : savoir, à l'intérieur de $\mathsf{PA}$, qu'un énoncé Σ₁ entraîne sa propre démontrabilité, c'est refaire la Σ₁-complétude de {{cal-rp-sigma1|Σ₁-complétude}} pour des valeurs quelconques, éventuellement non standard, des variables.
      - |
        La formule $\mathrm{Pr}'$ de la deuxième remarque de {{cal-dg-second|Löb et second théorème}} montre que le second théorème porte sur une formule écrite d'une façon déterminée. La formule naturelle y échappe parce que (D2) et (D3) ont été démontrées en lisant sa construction, clause par clause, et non à partir du seul ensemble qu'elle définit. L'énoncé $\mathrm{Coh}(T)$ est, de son côté, bien déterminé à l'équivalence près dans $\mathsf{PA}$ : la relation $R$ et l'indice $e$ de la construction de Craig sont fixés une fois pour toutes, par le texte de {{cal-sp-derivabilite|Deuxième condition (D2)}}, et le choix des variables des définitions naturelles n'importe pas, par le point (vii) de {{cal-bp-fonctions|Fonctions p.r. dans PA}}. Le point (ii) du nœud {{l-incompletude|Incomplétude}} est entièrement démontré dans l'édifice ; seule son extension à des théories comme $\mathsf{ZFC}$ reste hors du cadre.
      - |
        Pour l'histoire des conditions de dérivabilité, de Hilbert et Bernays (1939) à Löb (1955), on renvoie à la troisième remarque du nœud {{cal-dg-second|Löb et second théorème}}. La démonstration de ce chapitre passe par la Σ₁-complétude formalisée ; elle n'emploie pas la lecture unique démontrée dans $\mathsf{PA}$, mais seulement des substitutions à des paramètres qui ne sont quantifiés nulle part, ce qui la ramène à des calculs lettre à lettre sur les codes.

