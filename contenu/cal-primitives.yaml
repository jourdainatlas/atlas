# Niveau 2 : structure interne du chapitre « Fonctions primitives récursives » (nœud cal-primitives du
# graphe calc). Définition, propriétés de clôture, codages (nombres premiers, mots codés comme dans
# hk-temoins), fonction d'Ackermann et preuve qu'elle n'est pas primitive récursive.
# Les entiers sont ceux de ZF (graphe n) ; l'arithmétique vient de z. Les identifiants commencent par « cal- ».

graphe: cal-primitives
titre: Fonctions primitives récursives
conteneur: cal-primitives

noeuds:
  - id: cal-pr-definition
    etiquette: Primitives récursives
    nature: définition
    titre: Fonctions primitives récursives
    texte: |
      Dans toute la théorie, les entiers sont ceux de $\lex{ensemble-entiers-naturels}{\mathbb N}$, construits dans $\mathsf{ZF}$ ({{n-omega|Construction de ω}}), et une fonction d'arité $n \geqslant 1$ est une [[application]] de $\lex{n-uplet}{\mathbb N^n}$ dans $\mathbb N$. On note $x = (x_1, \dots, x_n)$ un élément de $\mathbb N^n$, et $(x, y)$ l'élément de $\mathbb N^{n+1}$ obtenu en ajoutant $y$ à la fin.
    enonce: |
      Les **fonctions de base** sont la fonction nulle $Z : x \mapsto 0$, définie sur $\mathbb N$, le successeur $S : x \mapsto x + 1$, et les projections $P^n_i : (x_1, \dots, x_n) \mapsto x_i$, pour $1 \leqslant i \leqslant n$.

      **Composition.** Si $f : \mathbb N^m \to \mathbb N$ et $g_1, \dots, g_m : \mathbb N^n \to \mathbb N$, la composée est la fonction $h : \mathbb N^n \to \mathbb N$ définie par
      $$h(x) = f(g_1(x), \dots, g_m(x)).$$

      **Récurrence primitive.** Si $f : \mathbb N^n \to \mathbb N$ et $g : \mathbb N^{n+2} \to \mathbb N$, il existe une unique fonction $h : \mathbb N^{n+1} \to \mathbb N$ telle que, pour tous $x$ et $y$,
      $$\begin{aligned} h(x, 0) &= f(x), \\ h(x, y + 1) &= g(x, y, h(x, y)). \end{aligned}$$
      Sans paramètre, c'est-à-dire pour $n = 0$, on se donne un entier $a$ et $g : \mathbb N^2 \to \mathbb N$, et $h : \mathbb N \to \mathbb N$ est définie par $h(0) = a$ et $h(y + 1) = g(y, h(y))$.

      Les [[fonction-primitive-recursive|fonctions primitives récursives]] forment le plus petit ensemble de fonctions qui contient les fonctions de base et qui est stable par composition et par récurrence primitive.

      **Exemples.** Sont primitives récursives : l'addition, la multiplication, $(x, y) \mapsto x^y$, la factorielle, le prédécesseur $\mathrm{pr}$, nul en $0$ et égal à $x - 1$ si $x \geqslant 1$, la soustraction tronquée $x \mathbin{\dot{-}} y$, égale à $x - y$ si $x \geqslant y$ et à $0$ sinon, et les fonctions $\mathrm{sg}$ et $\overline{\mathrm{sg}}$, définies par $\mathrm{sg}(0) = 0$, $\overline{\mathrm{sg}}(0) = 1$, et $\mathrm{sg}(x) = 1$, $\overline{\mathrm{sg}}(x) = 0$ pour $x \geqslant 1$.
    preuve: |
      *Le plus petit ensemble existe.* Les fonctions d'arité quelconque forment un ensemble, réunion des ensembles d'applications de $\mathbb N^n$ dans $\mathbb N$ pour $n \geqslant 1$. L'intersection des parties de cet ensemble qui contiennent les fonctions de base et sont stables par les deux opérations a encore ces propriétés, et elle est contenue dans chacune d'elles.

      Il en résulte un **principe d'induction** : une propriété vraie des fonctions de base, et conservée par composition et par récurrence primitive, est vraie de toute fonction primitive récursive, puisque l'ensemble des fonctions primitives récursives qui l'ont est stable et contient les fonctions de base.

      *Récurrence primitive.* Fixons $x$. Le {{n-recdef|théorème de définition par récurrence}}, appliqué à l'ensemble $E = \mathbb N \times \mathbb N$, à l'élément $(0, f(x))$ et à l'application $(m, v) \mapsto (m + 1, g(x, m, v))$, fournit une suite $u$ telle que $u(0) = (0, f(x))$ et $u(k + 1) = (m + 1, g(x, m, v))$ si $u(k) = (m, v)$. Par récurrence, la première composante de $u(k)$ est $k$ ; notant $h(x, k)$ la seconde, on obtient les deux égalités voulues. Toute fonction qui les vérifie coïncide avec $h$, par récurrence sur $y$. Le cas sans paramètre est identique.

      *Exemples.* L'addition s'obtient par récurrence primitive à partir de $f = P^1_1$ et de $g(x, y, z) = S(P^3_3(x, y, z))$, puisque $x + 0 = x$ et $x + (y + 1) = S(x + y)$ ({{n-operations|Addition, multiplication}}).

      De même, $x \cdot 0 = Z(x)$ et $x(y + 1) = xy + x$ ; puis $x^0 = S(Z(x))$ et $x^{y+1} = x^y \cdot x$ ; puis $0! = 1$ et $(y + 1)! = y! \cdot S(y)$, ces deux dernières sans paramètre. Dans chaque cas, la fonction $g$ est une composée de projections et de fonctions déjà obtenues.

      Le prédécesseur vérifie $\mathrm{pr}(0) = 0$ et $\mathrm{pr}(y + 1) = y = P^2_1(y, \mathrm{pr}(y))$. La soustraction tronquée vérifie $x \mathbin{\dot{-}} 0 = x$ et $x \mathbin{\dot{-}} (y + 1) = \mathrm{pr}(x \mathbin{\dot{-}} y)$.

      Enfin $\overline{\mathrm{sg}}(x) = 1 \mathbin{\dot{-}} x$ et $\mathrm{sg}(x) = 1 \mathbin{\dot{-}} (1 \mathbin{\dot{-}} x)$, où la constante $1$ est la fonction $S \circ Z$.
    remarques:
      - |
        Une fonction primitive récursive est **totale**, définie en tout point, et se calcule par des boucles dont le nombre de tours est connu avant d'y entrer : pour obtenir $h(x, y)$, on applique $g$ exactement $y$ fois. C'est ce caractère borné qui fait leur force, puisque tout calcul y termine, et leur limite, que le nœud {{cal-ackermann|Ackermann}} met en évidence.
      - |
        L'erreur la plus répandue est de croire que la récurrence primitive autorise n'importe quelle définition récursive. Elle ne permet de définir $h(x, y + 1)$ qu'à partir de $h(x, y)$, avec les **mêmes** paramètres $x$ ; une récurrence qui fait varier le paramètre, comme celle de la fonction d'Ackermann, sort de la classe.

  - id: cal-pr-cloture
    etiquette: Clôture
    nature: proposition
    titre: Propriétés de clôture des fonctions primitives récursives
    texte: |
      Une relation $R \subset \mathbb N^n$ est **primitive récursive** si sa fonction caractéristique $\chi_R$, égale à $1$ sur $R$ et à $0$ ailleurs, l'est. On écrit $R(x)$ pour $x \in R$.
    enonce: |
      (i) Les relations $x = y$, $x < y$ et $x \leqslant y$ sont primitives récursives. Si $R$ et $R'$ le sont, $\neg R$, $R \wedge R'$ et $R \vee R'$ le sont aussi, ainsi que $R(g_1(x), \dots, g_m(x))$ si les $g_j$ sont primitives récursives.

      (ii) **Définition par cas.** Si $R_1, \dots, R_k$ sont des relations primitives récursives qui partagent $\mathbb N^n$, et $g_1, \dots, g_k$ des fonctions primitives récursives, la fonction égale à $g_i(x)$ quand $R_i(x)$ est primitive récursive.

      (iii) **Sommes, produits et quantifications bornés.** Si $f$ et $R$ sont primitives récursives, les fonctions $(x, y) \mapsto \sum_{z < y} f(x, z)$ et $(x, y) \mapsto \prod_{z < y} f(x, z)$, et les relations $\exists z < y\ R(x, z)$ et $\forall z < y\ R(x, z)$ le sont aussi.

      (iv) **Minimisation bornée.** Si $R$ est primitive récursive, la fonction $\mu z < y\, R(x, z)$, égale au plus petit $z < y$ tel que $R(x, z)$, et à $y$ s'il n'y en a pas, est primitive récursive.

      (v) Le quotient $q(x, d)$ et le reste $r(x, d)$ de la [[division-euclidienne|division euclidienne]] de $x$ par $d \geqslant 1$, prolongés par $q(x, 0) = x + 1$ et $r(x, 0) = x$, sont primitifs récursifs. La relation de divisibilité $d \mid x$ et l'ensemble des [[nombre-premier|nombres premiers]] sont primitifs récursifs.
    preuve: |
      (i) On a
      $$\chi_=(x, y) = \overline{\mathrm{sg}}\big((x \mathbin{\dot{-}} y) + (y \mathbin{\dot{-}} x)\big),$$
      puis $\chi_<(x, y) = \mathrm{sg}(y \mathbin{\dot{-}} x)$ et $\chi_\leqslant(x, y) = \overline{\mathrm{sg}}(x \mathbin{\dot{-}} y)$, toutes composées des exemples de {{cal-pr-definition|Primitives récursives}}.

      Ensuite $\chi_{\neg R} = 1 \mathbin{\dot{-}} \chi_R$, $\chi_{R \wedge R'} = \chi_R \cdot \chi_{R'}$ et $\chi_{R \vee R'} = \mathrm{sg}(\chi_R + \chi_{R'})$. La substitution des $g_j$ est une composition.

      (ii) La fonction cherchée est $\sum_{i=1}^{k} g_i \cdot \chi_{R_i}$, puisqu'en chaque point exactement un des $\chi_{R_i}$ vaut $1$ ; c'est une composée d'additions et de multiplications.

      (iii) La somme $s(x, y)$ vérifie $s(x, 0) = 0$ et $s(x, y + 1) = s(x, y) + f(x, y)$ : c'est une récurrence primitive. Le produit se traite de même, avec la valeur initiale $1$. Enfin
      $$\chi_{\exists z < y\, R}(x, y) = \mathrm{sg}\Big(\sum_{z < y} \chi_R(x, z)\Big),$$
      et $\chi_{\forall z < y\, R}(x, y) = \prod_{z < y} \chi_R(x, z)$.

      (iv) Soit $z_0$ le plus petit $z$ tel que $R(x, z)$, s'il existe. Le produit $\prod_{z \leqslant t} \big(1 \mathbin{\dot{-}} \chi_R(x, z)\big)$ vaut $1$ si $t < z_0$, ou si $z_0$ n'existe pas, et $0$ sinon. La somme de ces produits pour $t < y$ compte les $t < y$ inférieurs à $z_0$ :
      $$\begin{aligned} &\mu z < y\, R(x, z) \\ &\quad = \sum_{t < y}\ \prod_{z < t + 1} \big(1 \mathbin{\dot{-}} \chi_R(x, z)\big), \end{aligned}$$
      qui vaut $z_0$ si $z_0 < y$, et $y$ sinon. C'est une fonction primitive récursive par (iii).

      (v) Pour $d \geqslant 1$, le quotient de $x$ par $d$ est le plus petit $q$ tel que $d(q + 1) > x$, et il est au plus $x$ puisque $d(x + 1) > x$. Ainsi
      $$q(x, d) = \mu q < x + 1\, \big(d(q + 1) > x\big),$$
      formule qui donne aussi $q(x, 0) = x + 1$, et $r(x, d) = x \mathbin{\dot{-}} d \cdot q(x, d)$. L'unicité de la division euclidienne ({{z-division|Division euclidienne}}) garantit que ce sont bien le quotient et le reste.

      Enfin $d \mid x$ équivaut à $\exists k < x + 1\ (dk = x)$, et $x$ est premier si et seulement si $x \geqslant 2$ et $\forall d < x\, \big(d \leqslant 1 \vee \neg(d \mid x)\big)$ ; on conclut par (i) et (iii).
    remarques:
      - |
        La minimisation bornée est une recherche qui s'arrête de toute façon à la borne $y$. Retirer la borne change tout : la recherche peut alors ne jamais aboutir, et c'est l'opération qui fera passer aux {{cal-recursives|fonctions récursives}}, partielles en général.

  - id: cal-pr-codage
    etiquette: Codages
    nature: proposition
    titre: Codage des suites finies
    texte: |
      Comme au point (iii) de l'{{hk-temoins|extension par témoins}}, on code une suite finie $(k_0, \dots, k_{m-1})$ d'entiers, vue comme un mot dont les lettres sont des entiers, par l'entier
      $$\langle k_0, \dots, k_{m-1} \rangle,$$
      défini par récurrence sur $m$ : la suite vide a pour code $\langle\, \rangle = 0$, et
      $$\langle k_0, \dots, k_m \rangle = 2^{\langle k_0, \dots, k_{m-1} \rangle}\, (2k_m + 1).$$

      On note $p_0 = 2$, $p_1 = 3$, $p_2 = 5$, … les nombres premiers rangés par ordre croissant, et, pour $x \geqslant 1$, $(x)_i$ l'exposant de $p_i$ dans la décomposition de $x$ ({{z-premiers|Nombres premiers}}) ; on convient que $(0)_i = 0$.
    enonce: |
      (i) La fonction $i \mapsto p_i$ est primitive récursive, ainsi que $(x, i) \mapsto (x)_i$.

      (ii) Tout entier est le code d'une unique suite finie.

      (iii) Les fonctions suivantes sont primitives récursives : l'ajout $\mathrm{aj}(N, k) = 2^N(2k + 1)$, qui ajoute la lettre $k$ à la fin de la suite de code $N$ ; pour $N \geqslant 1$, le code $\mathrm{dbt}(N)$ de la suite privée de son dernier terme et ce dernier terme $\mathrm{dr}(N)$, prolongés par $\mathrm{dbt}(0) = \mathrm{dr}(0) = 0$ ; la longueur $\mathrm{lg}(N)$ de la suite de code $N$ ; son terme de rang $j$, noté $(N)^j$ pour $j < \mathrm{lg}(N)$ ; et la concaténation $\mathrm{conc}(M, N)$, code de la suite de code $M$ suivie de la suite de code $N$.
    preuve: |
      (i) Soit $v$ un nombre premier et $N = v! + 1$. Par le point (ii) de {{z-premiers|Nombres premiers}}, $N$ a un diviseur premier $q \leqslant N$. Si l'on avait $q \leqslant v$, $q$ diviserait $v!$, donc $N - v! = 1$, ce qui est absurde ; ainsi $v < q \leqslant v! + 1$.

      Le nombre premier qui suit $v$ est donc
      $$\mu z < v! + 2\ \big(z > v \wedge z \text{ premier}\big),$$
      fonction primitive récursive de $v$ par les points (iii) à (v) de {{cal-pr-cloture|Clôture}}. Comme $p_0 = 2$ et $p_{i+1}$ est le premier qui suit $p_i$, la fonction $i \mapsto p_i$ s'obtient par récurrence primitive.

      Si $x \geqslant 1$ et $p_i^k \mid x$, alors $k < 2^k \leqslant p_i^k \leqslant x$ ; l'exposant de $p_i$ est donc le plus petit $k < x$ tel que $p_i^{k+1}$ ne divise pas $x$, ce qui s'écrit
      $$(x)_i = \mu k < x\ \neg\big(p_i^{k+1} \mid x\big),$$
      formule qui vaut aussi $0$ pour $x = 0$.

      (ii) L'injectivité est celle du point (iii) de {{hk-temoins|Témoins de Henkin}}. Pour la surjectivité, raisonnons par récurrence forte sur $N$. L'entier $0$ code la suite vide. Tout $N \geqslant 1$ s'écrit $2^n(2k + 1)$ avec $n < N$ ; si $n$ code la suite $s$, alors $N$ code la suite $s$ suivie de $k$.

      (iii) L'ajout est primitif récursif par les exemples de {{cal-pr-definition|Primitives récursives}}. Pour $N = 2^n(2k + 1) \geqslant 1$, le code $n$ de la suite privée de son dernier terme et ce dernier terme $k$ valent
      $$\begin{aligned} \mathrm{dbt}(N) &= (N)_0, \\ \mathrm{dr}(N) &= q\big(q(N, 2^{(N)_0}) \mathbin{\dot{-}} 1,\ 2\big), \end{aligned}$$
      et ces formules donnent $\mathrm{dbt}(0) = \mathrm{dr}(0) = 0$ ; on a $\mathrm{dbt}(N) < N$ si $N \geqslant 1$.

      Les itérés $D(N, 0) = N$ et $D(N, i + 1) = \mathrm{dbt}(D(N, i))$ s'obtiennent par récurrence primitive. Si $N$ code une suite de longueur $m$, $D(N, i)$ code, pour $i \leqslant m$, la suite privée de ses $i$ derniers termes, et vaut donc $0$ exactement à partir de $i = m$ ; comme $D(N, i) \leqslant N \mathbin{\dot{-}} i$ tant qu'il est non nul, on a $m \leqslant N$, et
      $$\mathrm{lg}(N) = \mu i < N + 1\ \big(D(N, i) = 0\big).$$

      Le terme de rang $j$ est le dernier terme de la suite privée de ses $m - 1 - j$ derniers termes, d'où
      $$(N)^j = \mathrm{dr}\big(D(N, \mathrm{lg}(N) \mathbin{\dot{-}} (j + 1))\big).$$

      Enfin $\mathrm{conc}(M, N) = C(M, N, \mathrm{lg}(N))$, où $C(M, N, 0) = M$ et $C(M, N, t + 1) = \mathrm{aj}\big(C(M, N, t), (N)^t\big)$ : on ajoute un à un les termes de la seconde suite.
    remarques:
      - |
        Ces codes sont gigantesques : $\langle 1, 1 \rangle = 2^3 \cdot 3 = 24$, mais une suite de six termes a un code qui s'écrit comme une tour d'exposants. Cela n'a aucune importance ici, où l'on ne demande aux codes que d'exister et d'être manipulés par des fonctions primitives récursives ; l'efficacité des calculs est l'objet d'une autre théorie, la complexité.
      - |
        Deux codages servent dans la suite, chacun là où il est le plus simple. Le code des mots, repris de la démonstration du théorème de complétude, convient aux suites que l'on lit et que l'on prolonge, comme les programmes et les formules. Le codage par exposants, $x = \prod p_i^{(x)_i}$, convient aux suites dont on modifie un terme quelconque, comme le contenu des registres d'une machine : multiplier ou diviser par $p_i$ change le seul terme de rang $i$.

  - id: cal-ackermann-lemme
    etiquette: Croissance d'Ackermann
    nature: lemme
    titre: Croissance de la fonction d'Ackermann
    texte: |
      La [[fonction-ackermann|fonction d'Ackermann]] $A : \mathbb N^2 \to \mathbb N$ est définie par
      $$\begin{aligned} A(0, y) &= y + 1, \\ A(x + 1, 0) &= A(x, 1), \\ A(x + 1, y + 1) &= A\big(x, A(x + 1, y)\big). \end{aligned}$$
      Précisément, on définit par récurrence sur $x$ des applications $A_x : \mathbb N \to \mathbb N$ : $A_0 = S$, et $A_{x+1}$ est l'unique application telle que $A_{x+1}(0) = A_x(1)$ et $A_{x+1}(y + 1) = A_x(A_{x+1}(y))$, fournie par le {{n-recdef|théorème de définition par récurrence}}. On pose $A(x, y) = A_x(y)$.
    enonce: |
      Pour tous $x$, $y$, $x'$ :

      (i) $A(x, y) > y$ ;

      (ii) $A(x, y + 1) > A(x, y)$ : $A$ est strictement croissante en $y$ ;

      (iii) $A(x + 1, y) \geqslant A(x, y + 1)$, et donc $A(x + 1, y) > A(x, y)$ : $A$ est strictement croissante en $x$ ;

      (iv) $A(1, y) = y + 2$, $A(2, y) = 2y + 3$ et $A(3, y) = 2^{y+3} - 3$ ;

      (v) si $k = \max(x, x')$, alors $A\big(x, A(x', y)\big) < A(k + 2, y)$.
    preuve: |
      La seconde ligne du texte fait de $x \mapsto A_x$ une définition par récurrence dans l'ensemble des applications de $\mathbb N$ dans $\mathbb N$, à laquelle s'applique encore le {{n-recdef|théorème de définition par récurrence}}.

      (i) Par récurrence sur $x$. Pour $x = 0$, $y + 1 > y$. Supposons (i) vrai pour $x$, et montrons $A(x + 1, y) > y$ par récurrence sur $y$. On a $A(x + 1, 0) = A(x, 1) > 1 > 0$. Si $A(x + 1, y) > y$, c'est-à-dire $A(x + 1, y) \geqslant y + 1$, alors
      $$\begin{aligned} A(x + 1, y + 1) &= A\big(x, A(x + 1, y)\big) \\ &> A(x + 1, y) \geqslant y + 1. \end{aligned}$$

      (ii) Pour $x = 0$, c'est clair. Sinon, $A(x + 1, y + 1) = A(x, A(x + 1, y)) > A(x + 1, y)$ par (i).

      (iii) Par récurrence sur $y$. Pour $y = 0$, il y a égalité. Si $A(x + 1, y) \geqslant A(x, y + 1)$, alors $A(x + 1, y) > y + 1$ par (i), donc $A(x + 1, y) \geqslant y + 2$, et par (ii)
      $$\begin{aligned} A(x + 1, y + 1) &= A\big(x, A(x + 1, y)\big) \\ &\geqslant A(x, y + 2). \end{aligned}$$
      La seconde inégalité suit : $A(x + 1, y) \geqslant A(x, y + 1) > A(x, y)$.

      (iv) $A(1, 0) = A(0, 1) = 2$ et $A(1, y + 1) = A(1, y) + 1$. Puis $A(2, 0) = A(1, 1) = 3$ et $A(2, y + 1) = A(2, y) + 2$. Enfin $A(3, 0) = A(2, 1) = 5 = 2^3 - 3$ et
      $$A(3, y + 1) = 2A(3, y) + 3 = 2^{y+4} - 3.$$

      (v) Par la croissance en chaque variable, (ii) et (iii), puis par (iii) appliqué à $A(k + 1, y)$ et la définition, et enfin par (iii) :
      $$\begin{aligned} A\big(x, A(x', y)\big) &\leqslant A\big(k, A(k, y)\big) \\ &< A\big(k, A(k + 1, y)\big) \\ &= A(k + 1, y + 1) \\ &\leqslant A(k + 2, y). \end{aligned}$$
    remarques:
      - |
        Wilhelm Ackermann a publié en 1928 (*Mathematische Annalen* 99, « Zum Hilbertschen Aufbau der reellen Zahlen ») une fonction de trois variables, récursive mais non primitive récursive. La version à deux variables donnée ici est due à Rózsa Péter (1935), sous la forme simplifiée de Raphael Robinson (1948).
      - |
        Chaque ligne $A(x + 1, \cdot)$ itère la précédente, puisque $A(x + 1, y) = A_x^{\,y+1}(1)$ : addition, multiplication par $2$, exponentielle, puis tour d'exponentielles. On a ainsi $A(4, 0) = 13$, $A(4, 1) = 2^{16} - 3 = 65\,533$, et $A(4, 2) = 2^{65536} - 3$ s'écrit avec $19\,729$ chiffres.

  - id: cal-ackermann
    etiquette: Ackermann
    nature: théorème
    titre: La fonction d'Ackermann n'est pas primitive récursive
    texte: |
      Pour $x \in \mathbb N^n$, on note $|x| = \max(x_1, \dots, x_n)$.
    enonce: |
      (i) Pour toute [[fonction-primitive-recursive|fonction primitive récursive]] $f$ d'arité $n$, il existe un entier $k$ tel que $f(x) < A(k, |x|)$ pour tout $x \in \mathbb N^n$.

      (ii) La [[fonction-ackermann|fonction d'Ackermann]] n'est pas primitive récursive, ni la fonction $x \mapsto A(x, x)$.
    preuve: |
      (i) Par le principe d'induction de {{cal-pr-definition|Primitives récursives}}, il suffit de vérifier la propriété sur les fonctions de base et de montrer qu'elle se conserve. On emploie sans le dire la croissance de $A$ en chaque variable ({{cal-ackermann-lemme|Croissance d'Ackermann}}, (ii) et (iii)).

      *Fonctions de base.* $Z(x) = 0 < A(0, x)$, $P^n_i(x) \leqslant |x| < A(0, |x|)$, et $S(x) = x + 1 < x + 2 = A(1, x)$.

      *Composition.* Soit $h = f(g_1, \dots, g_m)$, avec $f(u) < A(k_0, |u|)$ et $g_j(x) < A(k_j, |x|)$, et $k$ le plus grand des $k_j$, pour $0 \leqslant j \leqslant m$. Le $m$-uplet $u = (g_1(x), \dots, g_m(x))$ vérifie $|u| < A(k, |x|)$, d'où, par le point (v) du lemme,
      $$\begin{aligned} h(x) &< A(k, |u|) < A\big(k, A(k, |x|)\big) \\ &< A(k + 2, |x|). \end{aligned}$$

      *Récurrence primitive.* Soit $h(x, 0) = f(x)$ et $h(x, y + 1) = g(x, y, h(x, y))$, avec $f(x) < A(k_f, |x|)$ et $g(u) < A(k_g, |u|)$. Posons $k = \max(k_f, k_g) + 1$, et montrons par récurrence sur $y$ que
      $$h(x, y) < A(k, |x| + y).$$

      Pour $y = 0$, c'est l'hypothèse sur $f$. Supposons-le pour $y$. Les trois entiers $|x|$, $y$ et $h(x, y)$ sont strictement inférieurs à $A(k, |x| + y)$, par (i) du lemme et par l'hypothèse. Comme $k_g \leqslant k - 1$,
      $$\begin{aligned} h(x, y + 1) &< A\big(k - 1, A(k, |x| + y)\big) \\ &= A(k, |x| + y + 1). \end{aligned}$$

      Enfin $|x| + y \leqslant 2|(x, y)| < 2|(x, y)| + 3 = A(2, |(x, y)|)$, d'où, par (v) du lemme,
      $$\begin{aligned} h(x, y) &< A\big(k, A(2, |(x, y)|)\big) \\ &< A\big(\max(k, 2) + 2, |(x, y)|\big). \end{aligned}$$

      Sans paramètre, $h(0) = a$ et l'on prend $k_f = a$, puisque $A(a, 0) \geqslant a + 1$ par la croissance en $x$ ; le même calcul s'applique avec $|x| = 0$.

      (ii) Si $A$ était primitive récursive, la fonction $d(x) = A(P^1_1(x), P^1_1(x)) = A(x, x)$ le serait aussi, par composition. Par (i), il existerait $k$ tel que $A(x, x) < A(k, x)$ pour tout $x$ ; pour $x = k$, on obtiendrait $A(k, k) < A(k, k)$.
    remarques:
      - |
        Les premières valeurs, calculées par la définition et vérifiées par le point (iv) du lemme, montrent la croissance de ligne en ligne :
        $$\begin{array}{c|cccccc} A(x, y) & 0 & 1 & 2 & 3 & 4 & 5 \\ \hline x = 0 & 1 & 2 & 3 & 4 & 5 & 6 \\ x = 1 & 2 & 3 & 4 & 5 & 6 & 7 \\ x = 2 & 3 & 5 & 7 & 9 & 11 & 13 \\ x = 3 & 5 & 13 & 29 & 61 & 125 & 253 \end{array}$$
        La démonstration dit plus que l'énoncé : chaque fonction primitive récursive est dominée par une seule ligne $A(k, \cdot)$, et la diagonale $A(x, x)$ finit par dépasser chacune d'elles.
      - |
        La fonction d'Ackermann est pourtant calculable par un procédé mécanique évident, qui déroule la définition. Le nœud {{cal-ackermann-recursive|Ackermann est récursive}} le traduit : elle est récursive, et l'inclusion des fonctions primitives récursives dans les fonctions récursives totales est donc stricte.

