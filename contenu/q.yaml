# Niveau 1 : structure interne du nœud ℚ.
# ℚ est le corps des fractions de ℤ ; son ordre est l'unique ordre de corps qu'il porte.
# On établit aussi que ℚ se plonge dans tout corps ordonné, ce dont la construction de ℝ aura besoin.

graphe: q
titre: Les nombres rationnels
conteneur: q

entrees:
  z: [q-construction]
  ord: [q-ordre]

noeuds:
  - id: q-construction
    etiquette: Construction de ℚ
    nature: théorème
    titre: ℚ, corps des fractions de ℤ
    enonce: |
      L'anneau $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ étant intègre ({{z-anneau|Anneau ℤ}}), son [[corps-fractions|corps des fractions]] est noté $\lex{ensemble-rationnels}{\mathbb Q}$ : c'est le quotient de $\mathbb Z \times (\mathbb Z \setminus \{0\})$ par $(a, b) \sim (c, d) \iff ad = bc$, et $\mathbb Z$ s'y plonge par $a \mapsto a/1$.

      Tout rationnel s'écrit de manière unique $a/b$ avec $b \geqslant 1$ et $a \wedge b = 1$ : c'est son [[ecriture-irreductible|écriture irréductible]].
    preuve: |
      La première partie est le théorème du nœud {{a-fractions|Corps des fractions}}.

      *Existence.* Soit $x = a/b$. Quitte à remplacer $(a, b)$ par $(-a, -b)$, on peut supposer $b \geqslant 1$. Soit $d = a \wedge b$, non nul puisque $b \neq 0$, et $a = da'$, $b = db'$. Alors $a/b = a'/b'$, puisque $ab' = da'b' = a'b$, avec $b' \geqslant 1$.

      Une relation de Bézout $au + bv = d$ donne, après simplification par $d$, $a'u + b'v = 1$, donc $a' \wedge b' = 1$ ({{z-bezout|PGCD, Bézout}}).

      *Unicité.* Si $a/b = a'/b'$ sous forme irréductible, alors $ab' = a'b$. Ainsi $b \mid ab'$ et $b \wedge a = 1$, donc $b \mid b'$ par le lemme de Gauss ; de même $b' \mid b$. Comme $b, b' \geqslant 1$, on a $b = b'$, puis $a = a'$ par intégrité.
    remarques:
      - |
        L'écriture irréductible est un représentant canonique de chaque classe. Elle montre que l'on aurait pu définir $\mathbb Q$ comme un ensemble de couples, mais au prix de l'arithmétique de $\mathbb Z$ ; la construction par quotient ne la demande pas.

        ```schema q-construction
        Chaque classe est formée des points entiers, hors de l'axe $b = 0$, d'une droite passant par l'origine : $(a, b) \sim (c, d)$ signifie que $(a, b)$ et $(c, d)$ sont alignés avec l'origine. Le point rouge est l'écriture irréductible, l'unique point de la droite avec $b \geqslant 1$ et $a \wedge b = 1$.
        ```

  - id: q-ordre
    etiquette: Ordre de ℚ
    nature: proposition
    titre: Corps ordonnés, ordre de ℚ
    texte: |
      Un [[corps-ordonne|corps ordonné]] est un [[corps]] $K$ muni d'un ordre total tel que $x \leqslant y$ entraîne $x + z \leqslant y + z$, et que $0 \leqslant x$ et $0 \leqslant y$ entraînent $0 \leqslant xy$.
    enonce: |
      (i) Dans un corps ordonné, $x^2 \geqslant 0$ pour tout $x$, $1 > 0$, et $x > 0$ entraîne $1/x > 0$. Si $x \leqslant y$ et $z \geqslant 0$, alors $xz \leqslant yz$.

      (ii) Soit $A$ un [[anneau-integre|anneau intègre]] muni d'un ordre total compatible avec ses lois au sens du point (i) de {{z-ordre|Ordre de ℤ}}. La relation « $a/b \geqslant 0$ si et seulement si $ab \geqslant 0$ dans $A$ » définit sur son [[corps-fractions|corps des fractions]] un ordre de corps ordonné, qui prolonge celui de $A$. En particulier, pour $A = \lex{ensemble-entiers-relatifs}{\mathbb Z}$, elle définit sur $\lex{ensemble-rationnels}{\mathbb Q}$ un ordre de corps ordonné, qui prolonge celui de $\mathbb Z$.

      (iii) C'est le seul ordre qui fasse de $\mathbb Q$ un corps ordonné.
    preuve: |
      (i) Si $x \leqslant 0$, alors $0 = x - x \leqslant -x$ en ajoutant $-x$ ; donc $x$ ou $-x$ est positif, et $x^2 = (-x)^2 \geqslant 0$. Ainsi $1 = 1^2 \geqslant 0$, et $1 \neq 0$. Si $x > 0$, alors $1/x = x \cdot (1/x)^2 \geqslant 0$, et $1/x \neq 0$. Enfin $(y - x)z \geqslant 0$.

      (ii) *Deux faits sur $A$.* Les calculs de (i) n'emploient que la compatibilité de l'ordre avec les lois, et valent donc dans $A$ : tout carré y est positif. Si $b \neq 0$, alors $b^2 \neq 0$ par intégrité, donc $b^2 > 0$. De même, si $s > 0$ et $t > 0$, alors $st \geqslant 0$, et $st \neq 0$ par intégrité : $st > 0$. Ainsi un élément $u$ et son produit $uv$ par un $v > 0$ sont de même signe : si $u < 0$, alors $-u > 0$, donc $-uv > 0$.

      *Bonne définition.* Si $a/b = a'/b'$, alors $ab' = a'b$, et $ab \cdot b'^2 = (ab')(bb') = (a'b)(bb') = a'b' \cdot b^2$. Comme $b^2 > 0$ et $b'^2 > 0$, $ab$ et $a'b'$ ont donc le même signe que cette valeur commune.

      Soit $P$ l'ensemble des fractions $\geqslant 0$, et $x \leqslant y$ si $y - x \in P$. $P$ est [[partie-stable|stable par somme]] et par produit : si $ab \geqslant 0$ et $cd \geqslant 0$, alors
      $$(ad + bc)bd = ab\,d^2 + cd\,b^2 \geqslant 0$$
      et $(ac)(bd) = (ab)(cd) \geqslant 0$.

      On a $P \cap (-P) = \{0\}$, car $ab \geqslant 0$ et $-ab \geqslant 0$ donnent $ab = 0$, donc $a = 0$ par intégrité ; et $P \cup (-P)$ est le corps des fractions tout entier, par totalité de l'ordre de $A$. Ces trois propriétés donnent respectivement la transitivité et la compatibilité, l'[[relation-antisymetrique|antisymétrie]], et la totalité ; la réflexivité vient de $0 \in P$.

      Pour $n \in A$, $n/1 \geqslant 0$ équivaut à $n \times 1 \geqslant 0$, c'est-à-dire à $n \geqslant 0$ : l'ordre prolonge celui de $A$, et en particulier celui de $\mathbb Z$ pour $A = \mathbb Z$.

      (iii) Soit $\leqslant'$ un ordre de corps ordonné sur $\mathbb Q$, et $P'$ ses éléments positifs. Par (i), $1 \in P'$, donc tout entier naturel, somme de $1$, appartient à $P'$ ; pour $a \geqslant 0$ et $b > 0$ entiers, $a/b = a \cdot (1/b) \in P'$, encore par (i). Donc $P \subset P'$.

      Si $x \in P' \setminus P$, alors $-x \in P \subset P'$, et $x \in P' \cap (-P') = \{0\} \subset P$ : contradiction. Donc $P' = P$.
    remarques:
      - |
        Le point (i) interdit à certains corps tout ordre compatible : dans {{c|$\mathbb C$}}, $-1 = i^2$ serait positif, et dans $\lex{anneau-zn}{\mathbb Z/p\mathbb Z}$, la somme de $p$ termes égaux à $1$ serait nulle et strictement positive à la fois.

  - id: q-plongement
    etiquette: ℚ dans tout corps ordonné
    nature: théorème
    titre: ℚ se plonge dans tout corps ordonné
    enonce: |
      Pour tout corps ordonné $K$, il existe un unique [[morphisme-anneaux|morphisme d'anneaux]] $\varphi : \lex{ensemble-rationnels}{\mathbb Q} \to K$. Il est injectif et [[application-croissante|strictement croissant]]. Pour $n \in \lex{ensemble-entiers-naturels}{\mathbb N}$ et $x \in K$, on a $\varphi(n)\,x = nx$, le multiple entier de $x$ ({{n-sommes|Sommes finies}}), somme de $n$ termes égaux à $x$.
    preuve: |
      *Sur $\mathbb N$.* Par récurrence ({{n-recdef|Définition par récurrence}}), on pose $\varphi(0) = 0$ et $\varphi(n + 1) = \varphi(n) + 1$. Par récurrence sur $n$, $\varphi(m + n) = \varphi(m) + \varphi(n)$, puis $\varphi(mn) = \varphi(m)\varphi(n)$ par distributivité. Comme $1 > 0$ ({{q-ordre|Ordre de ℚ}}), $\varphi(n + 1) > \varphi(n)$ : $\varphi$ est strictement croissante sur $\mathbb N$.

      Les suites $(\varphi(n))$ et $(n \cdot 1)$ vérifient les mêmes relations de récurrence, donc $\varphi(n) = n \cdot 1$, et $\varphi(n)\,x = (n \cdot 1)\,x = nx$ ({{pol-anneau|Anneau A[X]}}).

      *Sur $\lex{ensemble-entiers-relatifs}{\mathbb Z}$.* On pose $\varphi(-n) = -\varphi(n)$, ce qui est cohérent en $0$. Pour $m, n \in \mathbb N$, on a $\varphi(m - n) = \varphi(m) - \varphi(n)$ : si $n \leqslant m$, on écrit $m = n + k$, et $\varphi(m - n) = \varphi(k) = \varphi(m) - \varphi(n)$ ; sinon $n = m + k$, et $\varphi(m - n) = -\varphi(k) = \varphi(m) - \varphi(n)$.

      Tout entier relatif est de la forme $m - n$ avec $m, n \in \mathbb N$ ({{z-construction|Construction de ℤ}}). L'additivité vient alors de $(m - n) + (m' - n') = (m + m') - (n + n')$, et la multiplicativité de
      $$\begin{aligned} &(m - n)(m' - n') \\ &= (mm' + nn') - (mn' + nm'). \end{aligned}$$
      Enfin, si $x < y$ dans $\mathbb Z$, alors $y - x \in \mathbb N \setminus \{0\}$, et $\varphi(y) - \varphi(x) = \varphi(y - x) > \varphi(0) = 0$.

      *Sur $\mathbb Q$.* Pour $b \neq 0$, $\varphi(b) \neq 0$ ; on pose $\varphi(a/b) = \varphi(a)\varphi(b)^{-1}$. Si $ab' = a'b$, alors $\varphi(a)\varphi(b') = \varphi(a')\varphi(b)$, et les deux quotients coïncident. Les formules de la somme et du produit des fractions montrent que $\varphi$ est un morphisme d'anneaux.

      Si $x = a/b > 0$ avec $b > 0$, alors $a > 0$, donc $\varphi(a) > 0$ et $\varphi(b) > 0$, et $\varphi(x) > 0$ ; ainsi $x < y$ entraîne $\varphi(y) - \varphi(x) = \varphi(y - x) > 0$.

      *Unicité.* Un morphisme d'anneaux $\psi$ vérifie $\psi(1) = 1$, donc $\psi(n) = \varphi(n)$ par récurrence, $\psi(-n) = -\psi(n)$, et $\psi(a/b)\,\psi(b) = \psi(a)$ impose $\psi(a/b) = \varphi(a/b)$.
    remarques:
      - |
        Un corps ordonné contient donc toujours une copie de $\mathbb Q$, et l'on identifie $\mathbb Q$ à son image. En particulier, $1 + 1 + \cdots + 1$ n'y est jamais nul : un corps ordonné est de caractéristique nulle.

  - id: q-archimede
    etiquette: Archimède, densité
    nature: proposition
    titre: ℚ est archimédien et dense
    texte: |
      Un [[corps-ordonne|corps ordonné]] $K$ est [[archimedien|archimédien]] si, pour tous $x > 0$ et $y$ de $K$, il existe $n \in \lex{ensemble-entiers-naturels}{\mathbb N}$ tel que $nx > y$, où $nx$ est le multiple entier de $x$ ({{n-sommes|Sommes finies}}).
    enonce: |
      (i) $\lex{ensemble-rationnels}{\mathbb Q}$ est [[archimedien|archimédien]] : pour tous $x > 0$ et $y$, il existe $n \in \lex{ensemble-entiers-naturels}{\mathbb N}$ tel que $nx > y$.

      (ii) L'ordre de $\mathbb Q$ est [[ordre-dense|dense]] : si $x < y$, alors $x < (x + y)/2 < y$.

      (iii) $\mathbb Q$ n'a ni plus petit ni [[plus-grand-element|plus grand élément]].
    preuve: |
      (i) Écrivons $x = a/b$ et $y = c/d$ avec $a, b, d \geqslant 1$. Pour $n = b(|c| + 1)$, on a $nx = a(|c| + 1) \geqslant |c| + 1 > |c| \geqslant |c|/d \geqslant y$.

      (ii) $2 = 1 + 1 > 0$, donc $1/2 > 0$ ({{q-ordre|Ordre de ℚ}}). De $x < y$ on tire $2x < x + y < 2y$, puis l'encadrement en multipliant par $1/2$.

      (iii) $x - 1 < x < x + 1$.
    remarques:
      - |
        Les points (ii) et (iii) sont exactement les hypothèses de la complétion par les coupures de Dedekind ({{od-coupures|Coupures de Dedekind}}) : c'est ainsi que {{r|$\mathbb R$}} sera construit à partir de l'ordre de $\mathbb Q$.
      - |
        Un corps ordonné n'est pas toujours archimédien. Sur l'anneau intègre $\lex{anneau-polynomes}{\mathbb Q[X]}$ ({{pol-anneau|Anneau A[X]}}, (iii)), soit $\Pi$ l'ensemble des polynômes nuls ou de [[coefficient-dominant|coefficient dominant]] strictement positif, et posons $P \leqslant Q$ si $Q - P \in \Pi$.

        L'ensemble $\Pi$ est stable par somme : si $P, Q \in \Pi$ sont non nuls, de degrés $p \geqslant q$, le coefficient dominant de $P + Q$ est celui de $P$ si $p > q$, et la somme des deux, strictement positive, si $p = q$. Il est stable par produit, le coefficient dominant de $PQ$ étant le produit de ceux de $P$ et de $Q$ ({{pol-anneau|Anneau A[X]}}, (iii)).

        Un polynôme non nul a un coefficient dominant non nul, donc lui ou son opposé appartient à $\Pi$ ; et $P$, $-P$ ne sont tous deux dans $\Pi$ que si $P = 0$, leurs coefficients dominants étant opposés. La relation $\leqslant$ est donc un ordre total sur $\mathbb Q[X]$, compatible avec ses lois au sens de {{z-ordre|Ordre de ℤ}}, (i) : la réflexivité vient de $0 \in \Pi$, la transitivité et la compatibilité avec l'addition de la stabilité par somme, la compatibilité avec le produit de la stabilité par produit, l'antisymétrie de la seconde propriété, et la totalité de la première.

        Par {{q-ordre|Ordre de ℚ}}, (ii), le [[corps-fractions|corps des fractions]] $\mathbb Q(X)$ de $\mathbb Q[X]$ est donc un corps ordonné, où $P/Q \geqslant 0$ si et seulement si $PQ \in \Pi$. Pour tout $n \in \lex{ensemble-entiers-naturels}{\mathbb N}$, le polynôme $X - n$ est [[polynome-unitaire|unitaire]], donc $n < X$ : aucun multiple $n \cdot 1$ ne dépasse $X$, et $\mathbb Q(X)$ n'est pas archimédien. De même, $0 < 1/X < 1/n$ pour $n \geqslant 1$ : d'une part $1 \times X = X$ est unitaire, donc dans $\Pi$ ; d'autre part $1/n - 1/X = (X - n)/(nX)$, et $(X - n) \cdot nX$ a pour coefficient dominant $n > 0$.

  - id: q-irrationnel
    etiquette: Irrationalité de √2
    nature: théorème
    titre: ℚ n'a pas la propriété de la borne supérieure
    enonce: |
      (i) Aucun rationnel $x$ ne vérifie $x^2 = 2$.

      (ii) La partie $A = \{x \in \lex{ensemble-rationnels}{\mathbb Q} : x^2 < 2\}$ est non vide et majorée, mais n'a pas de borne supérieure dans $\mathbb Q$. Ainsi $\mathbb Q$ n'a pas la [[propriete-borne-superieure|propriété de la borne supérieure]].
    preuve: |
      (i) Supposons $x = a/b$ sous forme irréductible ({{q-construction|Construction de ℚ}}) et $a^2 = 2b^2$. Alors $2 \mid a^2$, donc $2 \mid a$ par le lemme d'Euclide ({{z-premiers|Nombres premiers}}) ; écrivons $a = 2c$. Il vient $b^2 = 2c^2$, donc $2 \mid b$, ce qui contredit $a \wedge b = 1$.

      (ii) $1 \in A$, et $2$ majore $A$, puisque $x > 2$ entraîne $x^2 > 4$. Supposons que $s = \sup A$ existe ; alors $s \geqslant 1 > 0$.

      Si $s^2 < 2$, posons $h = \min\big(1, \frac{2 - s^2}{2(2s + 1)}\big) > 0$. Comme $h^2 \leqslant h$, on a
      $$\begin{aligned} (s + h)^2 &\leqslant s^2 + h(2s + 1) \\ &\leqslant s^2 + \frac{2 - s^2}{2} < 2 : \end{aligned}$$
      $s + h \in A$, et $s$ ne majore pas $A$.

      Si $s^2 > 2$, posons $h = \frac{s^2 - 2}{2s} > 0$. Alors
      $$s - h = \frac{s^2 + 2}{2s} > 0$$
      et $(s - h)^2 = 2 + h^2 > 2$. Pour $x \in A$, ou bien $x \leqslant 0 < s - h$, ou bien $0 < x$ et $x^2 < 2 < (s - h)^2$, d'où $x < s - h$. Ainsi $s - h < s$ majore $A$, ce qui contredit la minimalité de $s$.

      Il reste $s^2 = 2$, exclu par (i).
    remarques:
      - |
        La preuve est constructive : elle améliore explicitement tout candidat. Pour $s = 7/5$, dont le carré $49/25$ est inférieur à $2$, on trouve $h = 1/190$ et $s + h = 267/190$, de carré
        $$\frac{71289}{36100} \approx 1{,}9748 < 2.$$

        Pour $s = 3/2$, dont le carré dépasse $2$, on trouve $h = 1/12$ et $s - h = 17/12$, de carré
        $$\frac{289}{144} \approx 2{,}0069 > 2,$$
        qui est un majorant plus petit. Ce second calcul est exactement une étape de la méthode de Héron, $s \mapsto \frac12\big(s + \frac 2s\big)$.
      - |
        La partie $\{x \in \mathbb Q : x \leqslant 0 \text{ ou } x^2 < 2\}$ est une coupure de $\mathbb Q$ qui n'est de la forme $]{\leftarrow}, q[$ pour aucun rationnel $q$ : c'est le nombre $\sqrt 2$ que la construction de {{r|$\mathbb R$}} ajoutera.

        En effet, si elle valait $]{\leftarrow}, q[$, le rationnel $q$ majorerait $A$, qu'elle contient. Pour $m < q$, ou bien $m < 1$, et $1 \in A$ dépasse $m$ ; ou bien $m \geqslant 1$, et $(m + q)/2$, strictement compris entre $m$ et $q$, appartiendrait à la partie en étant strictement positif, donc à $A$. Ainsi $q$ serait la borne supérieure de $A$, ce qu'exclut (ii).

        ```schema q-irrationnel
        En haut, la coupure $\{x \in \mathbb Q : x \leqslant 0 \text{ ou } x^2 < 2\}$ s'arrête sur un trou de $\mathbb Q$ qu'aucun rationnel ne bouche. Le zoom reprend les calculs de la remarque précédente : $7/5$ est amélioré en $267/190$, encore dans $A$, et le majorant $3/2$ en $17/12$, majorant plus petit ; de part et d'autre du trou, tout candidat rationnel peut ainsi être rapproché.
        ```

  - id: q-denombrable
    etiquette: ℚ est dénombrable
    nature: proposition
    titre: ℕ × ℕ, ℤ et ℚ sont dénombrables
    enonce: |
      (i) L'application $(p, q) \mapsto 2^p(2q + 1) - 1$ est une bijection de $\lex{ensemble-entiers-naturels}{\mathbb N} \times \mathbb N$ sur $\mathbb N$. Par suite, pour tout $k \geqslant 1$, $\lex{n-uplet}{\mathbb N^k}$ est [[denombrable]].

      (ii) $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ et $\lex{ensemble-rationnels}{\mathbb Q}$ sont dénombrables, ainsi que $\mathbb Q^k$ pour $k \geqslant 1$.
    preuve: |
      (i) *Injectivité.* Les puissances $2^p$ sont celles du nœud {{n-sommes|Sommes finies}}, dans $(\mathbb N, \cdot)$. Supposons $2^p(2q + 1) = 2^{p'}(2q' + 1)$ avec $p < p'$. Comme $2^{p'} = 2^p \cdot 2 \cdot 2^{p' - p - 1}$ ({{n-sommes|Sommes finies}}, (vi)), en simplifiant par $2^p \neq 0$ ({{n-proprietes|Propriétés des opérations}}), $2q + 1 = 2 \cdot 2^{p' - p - 1}(2q' + 1)$, et l'unicité de la [[division-euclidienne]] par $2$ serait contredite, le reste valant $1$ d'un côté et $0$ de l'autre. Le cas $p' < p$ est symétrique ; donc $p = p'$, puis $2q + 1 = 2q' + 1$ et $q = q'$.

      *Surjectivité.* Montrons par récurrence forte que tout $m \geqslant 1$ s'écrit $2^p(2q + 1)$ : si $m$ est impair, $p = 0$ convient ; sinon $m = 2m'$ avec $1 \leqslant m' < m$, et l'écriture de $m'$ fournit celle de $m$. On l'applique à $m + 1$ pour tout $m \in \mathbb N$.

      Enfin $\mathbb N^{k+1} = \mathbb N^k \times \mathbb N$ est équipotent à $\mathbb N \times \mathbb N$, donc à $\mathbb N$, par récurrence sur $k$.

      (ii) L'application qui envoie $n \geqslant 0$ sur $2n$ et $-n < 0$ sur $2n - 1$ est une bijection de $\mathbb Z$ sur $\mathbb N$.

      Tout rationnel s'écrit de façon unique $p/q$ avec $p \in \mathbb Z$, $q \geqslant 1$ et $p \wedge q = 1$ : c'est son [[ecriture-irreductible|écriture irréductible]] ({{q-construction|Construction de ℚ}}).

      On obtient une injection de $\mathbb Q$ dans $\mathbb Z \times \mathbb N$, donc dans $\mathbb N$ ; comme $\mathbb N \subset \mathbb Q$, le théorème de Cantor-Bernstein ({{r-bernstein|Cantor-Bernstein}}) conclut. Enfin $\mathbb Q^k$ est équipotent à $\mathbb N^k$, donc dénombrable.
    remarques:
      - |
        Aucun choix n'intervient : chaque rationnel est désigné par son écriture irréductible. La bijection $\mathbb N \times \mathbb N \to \mathbb N$ permet de réindexer par $\mathbb N$ une famille indexée par $\mathbb N \times \mathbb N$, ce qu'exigent sans cesse la topologie de $\mathbb R^n$ et la théorie de la {{mes|mesure}}.
      - |
        L'erreur la plus répandue est de croire que la densité de $\mathbb Q$ dans $\mathbb R$ le rend « gros ». Il est dénombrable, alors que $\mathbb R$ ne l'est pas, par l'argument diagonal de Cantor ({{r-cantor|Théorème de Cantor}}) ; en mesure, $\mathbb Q$ est négligeable.

