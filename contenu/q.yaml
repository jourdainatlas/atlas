# Niveau 1 : structure interne du nœud ℚ.
# ℚ est le corps des fractions de ℤ ; son ordre est l'unique ordre de corps qu'il porte.
# On établit aussi que ℚ se plonge dans tout corps ordonné, ce dont la construction de ℝ aura besoin.

graphe: q
titre: Les nombres rationnels
conteneur: q

entrees:
  z: [q-construction]
  ord: [q-ordre]

noeuds:
  - id: q-construction
    etiquette: Construction de ℚ
    nature: théorème
    titre: ℚ, corps des fractions de ℤ
    enonce: |
      L'anneau $\mathbb Z$ étant intègre ({{z-anneau|Anneau ℤ}}), son [[corps-fractions|corps des fractions]] est noté $\mathbb Q$ : c'est le quotient de $\mathbb Z \times (\mathbb Z \setminus \{0\})$ par $(a, b) \sim (c, d) \iff ad = bc$, et $\mathbb Z$ s'y plonge par $a \mapsto a/1$.

      Tout rationnel s'écrit de manière unique $a/b$ avec $b \geqslant 1$ et $a \wedge b = 1$ : c'est son **écriture irréductible**.
    preuve: |
      La première partie est le théorème du nœud {{a-fractions|Corps des fractions}}.

      *Existence.* Soit $x = a/b$. Quitte à remplacer $(a, b)$ par $(-a, -b)$, on peut supposer $b \geqslant 1$. Soit $d = a \wedge b$, non nul puisque $b \neq 0$, et $a = da'$, $b = db'$. Alors $a/b = a'/b'$, puisque $ab' = da'b' = a'b$, avec $b' \geqslant 1$. Une relation de Bézout $au + bv = d$ donne, après simplification par $d$, $a'u + b'v = 1$, donc $a' \wedge b' = 1$ ({{z-bezout|PGCD, Bézout}}).

      *Unicité.* Si $a/b = a'/b'$ sous forme irréductible, alors $ab' = a'b$. Ainsi $b \mid ab'$ et $b \wedge a = 1$, donc $b \mid b'$ par le lemme de Gauss ; de même $b' \mid b$. Comme $b, b' \geqslant 1$, on a $b = b'$, puis $a = a'$ par intégrité.
    remarques:
      - |
        L'écriture irréductible est un représentant canonique de chaque classe. Elle montre que l'on aurait pu définir $\mathbb Q$ comme un ensemble de couples, mais au prix de l'arithmétique de $\mathbb Z$ ; la construction par quotient ne la demande pas.

  - id: q-ordre
    etiquette: Ordre de ℚ
    nature: proposition
    titre: Corps ordonnés, ordre de ℚ
    texte: |
      Un [[corps-ordonne|corps ordonné]] est un [[corps]] $K$ muni d'un ordre total tel que $x \leqslant y$ entraîne $x + z \leqslant y + z$, et que $0 \leqslant x$ et $0 \leqslant y$ entraînent $0 \leqslant xy$.
    enonce: |
      (i) Dans un corps ordonné, $x^2 \geqslant 0$ pour tout $x$, $1 > 0$, et $x > 0$ entraîne $1/x > 0$. Si $x \leqslant y$ et $z \geqslant 0$, alors $xz \leqslant yz$.

      (ii) La relation « $a/b \geqslant 0$ si et seulement si $ab \geqslant 0$ dans $\mathbb Z$ » définit sur $\mathbb Q$ un ordre de corps ordonné, qui prolonge celui de $\mathbb Z$.

      (iii) C'est le seul ordre qui fasse de $\mathbb Q$ un corps ordonné.
    preuve: |
      (i) Si $x \leqslant 0$, alors $0 = x - x \leqslant -x$ en ajoutant $-x$ ; donc $x$ ou $-x$ est positif, et $x^2 = (-x)^2 \geqslant 0$. Ainsi $1 = 1^2 \geqslant 0$, et $1 \neq 0$. Si $x > 0$, alors $1/x = x \cdot (1/x)^2 \geqslant 0$, et $1/x \neq 0$. Enfin $(y - x)z \geqslant 0$.

      (ii) *Bonne définition.* Si $a/b = a'/b'$, alors $ab' = a'b$, et $ab \cdot b'^2 = (ab')(bb') = (a'b)(bb') = a'b' \cdot b^2$. Comme $b^2 > 0$ et $b'^2 > 0$ dans $\mathbb Z$, $ab$ et $a'b'$ ont le même signe ({{z-ordre|Ordre de ℤ}}).

      Soit $P$ l'ensemble des rationnels $\geqslant 0$, et $x \leqslant y$ si $y - x \in P$. $P$ est stable par somme et par produit : si $ab \geqslant 0$ et $cd \geqslant 0$, alors $(ad + bc)bd = ab\,d^2 + cd\,b^2 \geqslant 0$ et $(ac)(bd) = (ab)(cd) \geqslant 0$. On a $P \cap (-P) = \{0\}$, car $ab \geqslant 0$ et $-ab \geqslant 0$ donnent $ab = 0$, donc $a = 0$ ; et $P \cup (-P) = \mathbb Q$ par totalité de l'ordre de $\mathbb Z$. Ces trois propriétés donnent respectivement la transitivité et la compatibilité, l'antisymétrie, et la totalité ; la réflexivité vient de $0 \in P$. Pour $n \in \mathbb Z$, $n/1 \geqslant 0$ équivaut à $n \geqslant 0$.

      (iii) Soit $\leqslant'$ un ordre de corps ordonné sur $\mathbb Q$, et $P'$ ses éléments positifs. Par (i), $1 \in P'$, donc tout entier naturel, somme de $1$, appartient à $P'$ ; pour $a \geqslant 0$ et $b > 0$ entiers, $a/b = a \cdot (1/b) \in P'$, encore par (i). Donc $P \subset P'$. Si $x \in P' \setminus P$, alors $-x \in P \subset P'$, et $x \in P' \cap (-P') = \{0\} \subset P$ : contradiction. Donc $P' = P$.
    remarques:
      - |
        Le point (i) interdit à certains corps tout ordre compatible : dans {{c|$\mathbb C$}}, $-1 = i^2$ serait positif, et dans $\mathbb Z/p\mathbb Z$, la somme de $p$ termes égaux à $1$ serait nulle et strictement positive à la fois.

  - id: q-plongement
    etiquette: ℚ dans tout corps ordonné
    nature: théorème
    titre: ℚ se plonge dans tout corps ordonné
    enonce: |
      Pour tout corps ordonné $K$, il existe un unique morphisme d'anneaux $\varphi : \mathbb Q \to K$. Il est injectif et strictement croissant. Pour $n \in \mathbb N$ et $x \in K$, on note $nx = \varphi(n)\,x$, qui est la somme de $n$ termes égaux à $x$.
    preuve: |
      *Sur $\mathbb N$.* Par récurrence ({{n-recdef|Définition par récurrence}}), on pose $\varphi(0) = 0$ et $\varphi(n + 1) = \varphi(n) + 1$. Par récurrence sur $n$, $\varphi(m + n) = \varphi(m) + \varphi(n)$, puis $\varphi(mn) = \varphi(m)\varphi(n)$ par distributivité. Comme $1 > 0$ ({{q-ordre|Ordre de ℚ}}), $\varphi(n + 1) > \varphi(n)$ : $\varphi$ est strictement croissante sur $\mathbb N$.

      *Sur $\mathbb Z$.* On pose $\varphi(-n) = -\varphi(n)$. L'additivité se vérifie en distinguant les signes : si $m = n + k$ avec $m, n, k \in \mathbb N$, alors $\varphi(m) - \varphi(n) = \varphi(k)$, c'est-à-dire $\varphi(m + (-n)) = \varphi(m) + \varphi(-n)$. La multiplicativité vient des règles de signes, et $\varphi$ reste strictement croissante.

      *Sur $\mathbb Q$.* Pour $b \neq 0$, $\varphi(b) \neq 0$ ; on pose $\varphi(a/b) = \varphi(a)\varphi(b)^{-1}$. Si $ab' = a'b$, alors $\varphi(a)\varphi(b') = \varphi(a')\varphi(b)$, et les deux quotients coïncident. Les formules de la somme et du produit des fractions montrent que $\varphi$ est un morphisme d'anneaux. Si $x = a/b > 0$ avec $b > 0$, alors $a > 0$, donc $\varphi(a) > 0$ et $\varphi(b) > 0$, et $\varphi(x) > 0$ ; ainsi $x < y$ entraîne $\varphi(y) - \varphi(x) = \varphi(y - x) > 0$.

      *Unicité.* Un morphisme d'anneaux $\psi$ vérifie $\psi(1) = 1$, donc $\psi(n) = \varphi(n)$ par récurrence, $\psi(-n) = -\psi(n)$, et $\psi(a/b)\,\psi(b) = \psi(a)$ impose $\psi(a/b) = \varphi(a/b)$.
    remarques:
      - |
        Un corps ordonné contient donc toujours une copie de $\mathbb Q$, et l'on identifie $\mathbb Q$ à son image. En particulier, $1 + 1 + \cdots + 1$ n'y est jamais nul : un corps ordonné est de caractéristique nulle.

  - id: q-archimede
    etiquette: Archimède, densité
    nature: proposition
    titre: ℚ est archimédien et dense
    enonce: |
      (i) $\mathbb Q$ est [[archimedien|archimédien]] : pour tous $x > 0$ et $y$, il existe $n \in \mathbb N$ tel que $nx > y$.

      (ii) L'ordre de $\mathbb Q$ est dense : si $x < y$, alors $x < (x + y)/2 < y$.

      (iii) $\mathbb Q$ n'a ni plus petit ni plus grand élément.
    preuve: |
      (i) Écrivons $x = a/b$ et $y = c/d$ avec $a, b, d \geqslant 1$. Pour $n = b(|c| + 1)$, on a $nx = a(|c| + 1) \geqslant |c| + 1 > |c| \geqslant |c|/d \geqslant y$.

      (ii) $2 = 1 + 1 > 0$, donc $1/2 > 0$ ({{q-ordre|Ordre de ℚ}}). De $x < y$ on tire $2x < x + y < 2y$, puis l'encadrement en multipliant par $1/2$.

      (iii) $x - 1 < x < x + 1$.
    remarques:
      - |
        Les points (ii) et (iii) sont exactement les hypothèses de la complétion par les coupures de Dedekind ({{od-coupures|Coupures de Dedekind}}) : c'est ainsi que {{r|$\mathbb R$}} sera construit à partir de l'ordre de $\mathbb Q$.

  - id: q-irrationnel
    etiquette: Irrationalité de √2
    nature: théorème
    titre: ℚ n'a pas la propriété de la borne supérieure
    enonce: |
      (i) Aucun rationnel $x$ ne vérifie $x^2 = 2$.

      (ii) La partie $A = \{x \in \mathbb Q : x^2 < 2\}$ est non vide et majorée, mais n'a pas de borne supérieure dans $\mathbb Q$. Ainsi $\mathbb Q$ n'a pas la [[propriete-borne-superieure|propriété de la borne supérieure]].
    preuve: |
      (i) Supposons $x = a/b$ sous forme irréductible ({{q-construction|Construction de ℚ}}) et $a^2 = 2b^2$. Alors $2 \mid a^2$, donc $2 \mid a$ par le lemme d'Euclide ({{z-premiers|Nombres premiers}}) ; écrivons $a = 2c$. Il vient $b^2 = 2c^2$, donc $2 \mid b$, ce qui contredit $a \wedge b = 1$.

      (ii) $1 \in A$, et $2$ majore $A$, puisque $x > 2$ entraîne $x^2 > 4$. Supposons que $s = \sup A$ existe ; alors $s \geqslant 1 > 0$.

      Si $s^2 < 2$, posons $h = \min\big(1, \frac{2 - s^2}{2(2s + 1)}\big) > 0$. Comme $h^2 \leqslant h$, on a $(s + h)^2 \leqslant s^2 + h(2s + 1) \leqslant s^2 + \frac{2 - s^2}{2} < 2$ : $s + h \in A$, et $s$ ne majore pas $A$.

      Si $s^2 > 2$, posons $h = \frac{s^2 - 2}{2s} > 0$. Alors $s - h = \frac{s^2 + 2}{2s} > 0$ et $(s - h)^2 = 2 + h^2 > 2$. Pour $x \in A$, ou bien $x \leqslant 0 < s - h$, ou bien $0 < x$ et $x^2 < 2 < (s - h)^2$, d'où $x < s - h$. Ainsi $s - h < s$ majore $A$, ce qui contredit la minimalité de $s$.

      Il reste $s^2 = 2$, exclu par (i).
    remarques:
      - |
        La preuve est constructive : elle améliore explicitement tout candidat. Pour $s = 7/5$, dont le carré $49/25$ est inférieur à $2$, on trouve $h = 1/190$ et $s + h = 267/190$, de carré $71289/36100 \approx 1{,}9748 < 2$. Pour $s = 3/2$, dont le carré dépasse $2$, on trouve $h = 1/12$ et $s - h = 17/12$, de carré $289/144 \approx 2{,}0069 > 2$, qui est un majorant plus petit. Ce second calcul est exactement une étape de la méthode de Héron, $s \mapsto \frac12\big(s + \frac 2s\big)$.
      - |
        La partie $\{x \in \mathbb Q : x \leqslant 0 \text{ ou } x^2 < 2\}$ est une coupure de $\mathbb Q$ qui n'est de la forme $]{\leftarrow}, q[$ pour aucun rationnel $q$ : c'est le nombre $\sqrt 2$ que la construction de {{r|$\mathbb R$}} ajoutera.

