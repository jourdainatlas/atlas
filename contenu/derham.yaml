# Niveau 1 : structure interne du nœud « Théorème de de Rham » (développé le 28 oct. 2026, en degré 1,
# pour les ouverts de ℝⁿ).
# Primitives locales des formes fermées, intégrale d'une 1-forme fermée le long d'un chemin seulement
# continu, invariance par homotopie (découpage d'un carré), intégration sur les chaînes singulières,
# et injectivité de H¹_dR(U) → Hom(H₁(U), ℝ) ; corollaire : H¹(ℝ² ∖ {0}) ≅ ℝ.
# Surjectivité démontrée le 29 oct. 2026 : exponentielle par l'intégrale, fonctions plateau, recouvrement
# localement fini par des cubes, partition de l'unité, chaînes d'accès et périodes locales, recollement ;
# les cycles sont ramenés aux petites chaînes, sans Mayer-Vietoris. Aucun choix.
# Formule de Stokes en tout degré (30 oct. 2026) : intégrales itérées de fonctions continues sur un pavé et
# Fubini (par le théorème de Heine, sans mesure), cubes singuliers lisses, chaînes cubiques et ∂∂ = 0,
# intégrale d'une k-forme sur une chaîne, ∫_c dω = ∫_∂c ω par Fubini et le théorème fondamental sur le cube
# unité ; corollaires : intégrale d'une forme exacte sur un cycle, critère de fermeture (dω comme limite
# d'intégrales sur le bord de petits cubes), Green-Riemann (rectangle, image d'un carré), divergence sur un
# pavé. La version pour une variété compacte orientée à bord n'est pas traitée : variétés à bord et
# changement de variables (chapitre edo-changement) ne sont pas des ancêtres. Aucun choix.
# Tout degré (31 oct. 2026), deux chapitres : derham-cohomologie (formule d'homotopie, partition de l'unité
# pour deux ouverts, Mayer-Vietoris, ℝⁿ ∖ {0}, forme angle solide, champs tangents aux sphères) et
# derham-tout-degre (simplexes lisses et Stokes, cochaînes lisses, complexe double, Čech-de Rham, théorème
# de de Rham par la méthode de Weil, sans choix ; forme duale ⋆). Le nœud de la théorie s'appelle désormais
# « Cohomologie de de Rham ». Chapitre derham-poincare (31 oct.) : support compact et dualité de Poincaré.

graphe: derham
titre: Cohomologie de de Rham
conteneur: derham

entrees:
  geod: [dr-primitives, dr-integrale, dr-degre1, dr-integrale-cubes]
  hom: [dr-chaines, dr-surjectivite, dr-degre1]

noeuds:
  - id: dr-primitives
    etiquette: Primitives locales
    nature: lemme
    titre: Primitives locales d'une forme fermée
    texte: |
      Dans tout ce graphe, $U$ est un ouvert de $\lex{n-uplet}{\mathbb R^n}$ et $\omega$ une forme différentielle fermée de degré $1$ sur $U$ ({{gd-integrale-curviligne|Intégrale d'une 1-forme}}). Une **boule** est une boule ouverte pour la norme $\|\cdot\|_\infty$ ; c'est un ouvert convexe. Une **primitive** de $\omega$ sur un ouvert $V \subset U$ est une fonction $f$ de classe $C^\infty$ sur $V$ telle que $df = \omega$ sur $V$.
    enonce: |
      (i) Sur toute boule $B \subset U$, $\omega$ a une primitive.

      (ii) Deux primitives de $\omega$ sur un ouvert connexe diffèrent d'une constante. En particulier, si $B$ et $B'$ sont deux boules contenues dans $U$, de primitives $f$ et $f'$, la différence $f - f'$ est constante sur $B \cap B'$.
    preuve: |
      (i) Soit $B$ la boule de centre $a$, et $\omega = \sum_i a_i\,dx_i$. La boule $B - a$ est étoilée par rapport à $0$, et la forme $\omega' = \sum_i a_i(y + a)\,dy_i$ y est fermée, puisque ses coefficients sont ceux de $\omega$ translatés, et que $d\omega' $ s'écrit avec les dérivées partielles $\partial_j a_i(y + a) - \partial_i a_j(y + a)$, toutes nulles.

      Par le lemme de Poincaré ({{gd-poincare|Lemme de Poincaré}}), $\omega' = dg$ sur $B - a$. La fonction $f(x) = g(x - a)$ vérifie $\partial_i f(x) = \partial_i g(x - a) = a_i(x)$ : c'est une primitive de $\omega$ sur $B$.

      (ii) Si $f$ et $f'$ sont deux primitives sur un ouvert connexe $V$, alors $d(f - f') = 0$ sur $V$, et $f - f'$ est constante ({{gd-accroissements|Accroissements finis}}, (iii)). L'intersection $B \cap B'$, convexe, est connexe, ou vide.
    remarques:
      - |
        L'hypothèse de connexité de (ii) ne peut pas être levée : sur la réunion de deux boules disjointes, la fonction qui vaut $0$ sur l'une et $1$ sur l'autre a une différentielle nulle. C'est cette liberté, une constante par morceau, qui rendra nécessaire la vérification que l'intégrale ne dépend pas des primitives choisies.

  - id: dr-integrale
    etiquette: Intégrale le long d'un chemin continu
    nature: définition
    titre: Intégrale d'une forme fermée le long d'un chemin continu
    texte: |
      Soit $\gamma : [a, b] \to U$ continu, avec $a < b$. Une **subdivision adaptée** est une suite $a = s_0 < s_1 < \cdots < s_m = b$ et des boules $B_1, \dots, B_m$ contenues dans $U$, munies de primitives $f_1, \dots, f_m$ de $\omega$ ({{dr-primitives|Primitives locales}}), telles que $\gamma([s_{k-1}, s_k]) \subset B_k$. On pose alors
      $$\int_\gamma \omega = \sum_{k=1}^m \Big(f_k\big(\gamma(s_k)\big) - f_k\big(\gamma(s_{k-1})\big)\Big).$$
    enonce: |
      (i) Il existe des subdivisions adaptées, et la somme ne dépend ni de la subdivision, ni des boules, ni des primitives choisies.

      (ii) Si $\gamma$ est de classe $C^1$ par morceaux, $\int_\gamma \omega$ coïncide avec l'intégrale du nœud {{gd-integrale-curviligne|Intégrale d'une 1-forme}}.

      (iii) *Chasles.* Pour $a < c < b$, $\int_\gamma \omega = \int_{\gamma|_{[a,c]}} \omega + \int_{\gamma|_{[c,b]}} \omega$. L'intégrale est linéaire en $\omega$, ne change pas par reparamétrage affine croissant de $[a, b]$, change de signe par reparamétrage affine décroissant, et vaut $0$ pour un chemin constant.

      (iv) Si $\omega = df$ sur $U$, alors $\int_\gamma \omega = f(\gamma(b)) - f(\gamma(a))$.
    preuve: |
      (i) *Existence.* Les images réciproques par $\gamma$ des boules contenues dans $U$ forment un recouvrement ouvert du compact $[a, b]$ ({{me-rn|L'espace ℝⁿ}}, (iii)) ; soit $\eta$ un nombre de Lebesgue ({{me-lebesgue|Nombre de Lebesgue}}). Une subdivision de pas $< \eta$ convient : chaque $[s_{k-1}, s_k]$, de diamètre $< \eta$, est contenu dans l'image réciproque d'une boule $B_k$, qui a une primitive par {{dr-primitives|Primitives locales}}, (i).

      *Indépendance des primitives et des boules.* Si, sur un même intervalle $[s_{k-1}, s_k]$, on remplace $(B_k, f_k)$ par $(B'_k, f'_k)$ avec $\gamma([s_{k-1}, s_k]) \subset B'_k$, les deux extrémités sont dans $B_k \cap B'_k$, où $f_k - f'_k$ est constante ({{dr-primitives|Primitives locales}}, (ii)) : le terme correspondant ne change pas.

      *Indépendance de la subdivision.* Insérer un point $s$ dans $]s_{k-1}, s_k[$, en gardant $(B_k, f_k)$ sur les deux morceaux, ne change pas la somme, qui est télescopique sur ces deux morceaux. Deux subdivisions adaptées ont une subdivision commune plus fine, obtenue en réunissant leurs points ; chaque morceau de celle-ci est contenu dans un morceau de chacune, et peut donc recevoir la boule de l'une ou de l'autre. Par insertions successives, puis changement de boules, les deux sommes sont égales à celle de la subdivision commune.

      (ii) Sur $[s_{k-1}, s_k]$, $\omega = df_k$, et l'intégrale du nœud {{gd-integrale-curviligne|Intégrale d'une 1-forme}}, (i), de $df_k$ le long de ce morceau vaut $f_k(\gamma(s_k)) - f_k(\gamma(s_{k-1}))$ ; on somme, l'intégrale d'un chemin $C^1$ par morceaux étant additive par la relation de Chasles ({{ri-proprietes|Propriétés de l'intégrale}}, (iii)).

      (iii) Une subdivision adaptée contenant $c$ se coupe en deux subdivisions adaptées de $[a, c]$ et de $[c, b]$.

      Pour deux formes fermées $\omega$ et $\omega'$, une même subdivision est adaptée aux deux, toute boule contenue dans $U$ portant une primitive de chacune ; si $f_k$ et $f'_k$ sont ces primitives sur $B_k$, $f_k + \lambda f'_k$ en est une de $\omega + \lambda\omega'$, d'où la linéarité.

      Un reparamétrage affine transporte les subdivisions adaptées, en renversant leur ordre s'il est décroissant, ce qui change chaque terme en son opposé. Pour un chemin constant, chaque terme est nul.

      (iv) La restriction de $f$ à chaque boule est une primitive, et la somme est télescopique.
    remarques:
      - |
        Pour un chemin seulement continu, la formule $\int_a^b \omega_{\gamma(t)}(\gamma'(t))\,dt$ n'a pas de sens, $\gamma$ pouvant n'être dérivable nulle part. La définition contourne la dérivée en remplaçant, sur chaque petit morceau, la forme par la différentielle d'une primitive locale : seules les valeurs de $\gamma$ aux points de la subdivision interviennent. Elle ne vaut que pour une forme **fermée**, la seule qui ait des primitives locales.

  - id: dr-homotopie
    etiquette: Invariance par homotopie
    nature: théorème
    titre: Intégrale sur le bord d'un carré et invariance par homotopie
    enonce: |
      (i) Soit $H : [0, 1]^2 \to U$ continue. Avec les chemins $\beta(s) = H(s, 0)$, $\rho(t) = H(1, t)$, $\theta(s) = H(s, 1)$ et $\lambda(t) = H(0, t)$, les quatre côtés du carré,
      $$\int_\beta \omega + \int_\rho \omega - \int_\theta \omega - \int_\lambda \omega = 0.$$

      (ii) Deux chemins $\gamma$ et $\delta$ de $x$ à $y$, homotopes à extrémités fixes, ont la même intégrale.
    preuve: |
      (i) Les images réciproques par $H$ des boules contenues dans $U$ recouvrent le compact $[0, 1]^2$ ; par le lemme de Lebesgue, appliqué pour la distance $d_\infty$ ({{me-lebesgue|Nombre de Lebesgue}}), il existe $N$ tel que chacun des carrés
      $$Q_{jk} = [\frac{j-1}N, \frac jN] \times [\frac{k-1}N, \frac kN]$$
      soit envoyé par $H$ dans une boule $B_{jk}$, de primitive $f_{jk}$.

      Pour un segment horizontal ou vertical $e$ de la grille, notons $\int_e$ l'intégrale de $\omega$ le long du chemin $H$ restreint à $e$, parcouru dans le sens des coordonnées croissantes.

      Pour un petit carré $Q_{jk}$, de coins $c_0, c_1, c_2, c_3$ dans l'ordre direct à partir du coin inférieur gauche, chaque côté est dans $Q_{jk}$, donc envoyé dans $B_{jk}$, et son intégrale est la différence des valeurs de $f_{jk} \circ H$ à ses extrémités ({{dr-integrale|Intégrale le long d'un chemin continu}}, (i), avec une subdivision réduite à un seul morceau). La somme alternée sur le bord de $Q_{jk}$ vaut donc
      $$\begin{aligned} &\big(f(c_1) - f(c_0)\big) + \big(f(c_2) - f(c_1)\big) \\ &\quad - \big(f(c_2) - f(c_3)\big) \\ &\quad - \big(f(c_3) - f(c_0)\big) = 0, \end{aligned}$$
      où $f = f_{jk} \circ H$.

      En sommant sur les $N^2$ petits carrés, chaque segment intérieur de la grille apparaît deux fois, avec des signes opposés, comme côté droit de l'un et côté gauche du suivant, ou comme côté supérieur et côté inférieur ; son intégrale ne dépend pas du carré qui la calcule ({{dr-integrale|Intégrale le long d'un chemin continu}}, (i)). Il reste les segments du bord, qui reconstituent, par la relation de Chasles (même nœud, (iii)),
      $$\int_\beta \omega + \int_\rho \omega - \int_\theta \omega - \int_\lambda \omega,$$
      qui est donc nul.

      ```schema dr-homotopie
      Chaque petit carré est envoyé par $H$ dans une boule où $\omega$ a une primitive, et la somme alternée sur son bord est nulle. Les segments intérieurs, en gris, sont parcourus une fois dans chaque sens par deux carrés voisins, et leurs contributions s'annulent ; il ne reste que le bord du grand carré, en rouge.
      ```

      (ii) Soit $H$ une homotopie à extrémités fixes, $H(s, 0) = \gamma(s)$, $H(s, 1) = \delta(s)$, $H(0, t) = x$ et $H(1, t) = y$. Les côtés $\rho$ et $\lambda$ sont constants, d'intégrale nulle, et (i) donne $\int_\gamma \omega = \int_\delta \omega$.
    remarques:
      - |
        Le découpage en petits carrés est le même que pour le relèvement des homotopies ({{ta-relevement-homotopies|Relèvement des homotopies}}) : dans les deux cas, une information locale (un feuillet, une primitive) est propagée de proche en proche sur un carré compact. Le résultat dit que l'intégrale d'une forme fermée est un invariant d'homotopie, ce que l'homologie va traduire en termes de chaînes.

  - id: dr-chaines
    etiquette: Intégration sur les chaînes
    nature: théorème
    titre: Intégration d'une forme fermée sur les chaînes singulières
    texte: |
      Un simplexe singulier $\sigma : \Delta_1 \to U$ de dimension $1$ ({{h-singuliere|Homologie singulière}}) définit le chemin $\sigma \circ \alpha$, où $\alpha(s) = (1 - s, s)$ ; on pose $\int_\sigma \omega = \int_{\sigma \circ \alpha} \omega$, et l'on prolonge en un morphisme $C_1(U) \to \mathbb R$, $c \mapsto \int_c \omega$, par la propriété universelle du groupe abélien libre ({{h-complexes|Complexes de chaînes}}, (i)).
    enonce: |
      (i) Pour tout simplexe singulier $\tau : \Delta_2 \to U$, $\int_{\partial \tau} \omega = 0$ : l'intégrale est nulle sur les bords.

      (ii) Si $\omega = df$ est exacte, $\int_z \omega = 0$ pour tout cycle $z \in Z_1(U)$.

      (iii) Par suite, l'application qui associe à $\omega$ le morphisme $[z] \mapsto \int_z \omega$ induit une application linéaire
      $$\Phi : \lex{cohomologie-de-rham}{H^1}(U) \to \operatorname{Hom}\big(\lex{homologie-singuliere}{H_1}(U), \mathbb R\big).$$
    preuve: |
      (i) Soit $H(s, t) = \tau\big(1 - s,\ s(1 - t),\ st\big)$, continue sur $[0, 1]^2$, le triplet ayant des coordonnées positives de somme $1$. Ses côtés sont
      $$\begin{aligned} \beta(s) &= \tau(1 - s, s, 0) = (\tau \circ \delta_2 \circ \alpha)(s), \\ \rho(t) &= \tau(0, 1 - t, t) = (\tau \circ \delta_0 \circ \alpha)(t), \\ \theta(s) &= H(s, 1) = \tau(1 - s, 0, s) \\ &= (\tau \circ \delta_1 \circ \alpha)(s), \end{aligned}$$
      et $\lambda$ est constant en $\tau(e_0)$. Par {{dr-homotopie|Invariance par homotopie}}, (i),
      $$0 = \int_{\tau\delta_2} \omega + \int_{\tau\delta_0} \omega - \int_{\tau\delta_1} \omega - 0 = \int_{\partial\tau} \omega,$$
      puisque $\partial\tau = \tau\delta_0 - \tau\delta_1 + \tau\delta_2$.

      ```schema dr-chaines
      L'application $(s, t) \mapsto (1 - s, s(1 - t), st)$ envoie le carré sur le triangle $\Delta_2$ : le côté inférieur sur l'arête de $e_0$ à $e_1$, le côté droit sur celle de $e_1$ à $e_2$, le côté supérieur sur celle de $e_0$ à $e_2$, et le côté gauche tout entier sur le sommet $e_0$. Le bord du carré devient ainsi le bord $\partial\tau$, avec ses signes.
      ```

      (ii) Pour un simplexe $\sigma$, $\int_\sigma df = f(\sigma(e_1)) - f(\sigma(e_0))$ ({{dr-integrale|Intégrale le long d'un chemin continu}}, (iv)), et $\partial \sigma = \sigma(e_1) - \sigma(e_0)$. Notons $F : C_0(U) \to \mathbb R$ le morphisme qui prolonge $f$ ; alors $\int_c df = F(\partial c)$ pour toute chaîne $c$, par additivité, et cette quantité est nulle si $\partial c = 0$.

      (iii) Pour $\omega$ fermée, $c \mapsto \int_c \omega$ est un morphisme nul sur $B_1(U)$ par (i) : sa restriction à $Z_1(U)$ passe donc au quotient $H_1(U) = Z_1(U)/B_1(U)$ ({{h-complexes|Complexes de chaînes}}) : la formule $[z] \mapsto \int_z \omega$ est bien définie, puisque deux cycles de même classe diffèrent d'un bord, et c'est un morphisme.

      L'application qui à $\omega$ associe ce morphisme est linéaire ({{dr-integrale|Intégrale le long d'un chemin continu}}, (iii)) et nulle sur les formes exactes par (ii) ; elle passe au quotient $Z^1(U)/B^1(U) = H^1(U)$ ({{v-quotient|Espace quotient}}) par le même argument : si $\omega - \omega'$ est exacte, $\omega$ et $\omega'$ ont les mêmes intégrales sur les cycles.
    remarques:
      - |
        L'intégration est un accouplement entre formes et chaînes : c'est pourquoi le théorème compare $H^1$ à un **dual** de l'homologie, et non à l'homologie elle-même. Comme l'intégrale est réelle alors que les chaînes sont à coefficients entiers, ce dual est $\operatorname{Hom}(H_1(U), \mathbb R)$.
      - |
        Lorsque $\tau$ se prolonge en une application de classe $C^\infty$, l'application $H$ de la démonstration, qui contient déjà $\tau$, est un cube singulier lisse, dont le bord est $\partial\tau$ diminué d'un chemin constant, et le point (i) devient un cas de la formule de Stokes : l'intégrale d'une forme fermée sur un bord est celle de sa différentielle, qui est nulle. Cette formule est démontrée en tout degré, pour des cubes plutôt que des simplexes, au nœud {{dr-stokes|Formule de Stokes}} ; la démonstration donnée ici, par les primitives locales, a l'avantage de ne demander que la continuité de $\tau$.

  - id: dr-exp
    etiquette: Une exponentielle réelle
    nature: lemme
    titre: Une fonction égale à sa dérivée, construite par une intégrale
    texte: |
      Pour construire, au nœud suivant, une fonction de classe $C^\infty$ nulle sur une demi-droite sans être nulle, il faut une fonction qui croisse plus vite que tout polynôme. On la construit ici à partir de l'intégrale de Riemann.

      Pour $x > 0$, posons
      $$L(x) = \int_1^x \frac{dt}{t},$$
      avec la convention $\int_1^x = -\int_x^1$ si $x < 1$.
    enonce: |
      (i) $L$ est une bijection strictement croissante et dérivable de $]0, +\infty[$ sur $\lex{ensemble-reels}{\mathbb R}$, avec $L'(x) = 1/x$ et $L(1) = 0$.

      (ii) Sa réciproque $E : \mathbb R \to \,]0, +\infty[$ est dérivable, avec $E' = E$ et $E(0) = 1$ ; elle est donc indéfiniment dérivable, et toutes ses dérivées successives sont égales à $E$.

      (iii) $E(y)\,E(-y) = 1$ pour tout réel $y$.

      (iv) Pour tout $y \geqslant 0$ et tout $m \in \lex{ensemble-entiers-naturels}{\mathbb N}$,
      $$E(y) \geqslant \frac{y^m}{m!}.$$
    preuve: |
      (i) La fonction $t \mapsto 1/t$ est continue sur l'intervalle $]0, +\infty[$. Par le théorème fondamental ({{ar-tfa|Théorème fondamental}}), $L$ est dérivable, de dérivée $x \mapsto 1/x$, strictement positive ; elle est donc continue ({{de-dl1|DL à l'ordre 1}}) et strictement croissante ({{de-monotonie|Monotonie}}, (iii)), et $L(1) = 0$.

      La fonction $x \mapsto L(2x) - L(x)$ a pour dérivée $\frac{2}{2x} - \frac1x = 0$ ({{de-composee|Dérivée d'une composée}}). Elle est donc constante ({{de-monotonie|Monotonie}}, (ii)), égale à sa valeur $L(2)$ en $1$, et $L(2x) = L(x) + L(2)$. Par récurrence, pour $m \in \mathbb N$,
      $$L(2^{\pm m}) = \pm mL(2),$$
      avec $L(2) > L(1) = 0$.

      Soit $y$ réel. La propriété d'Archimède ({{ar-archimede|Archimède}}) donne un entier $m$ tel que $mL(2) > |y|$, d'où $L(2^{-m}) < y < L(2^m)$. L'image de $L$ est un intervalle ({{c-tvi|Valeurs intermédiaires}}) qui contient ces deux valeurs, donc $y$ : $L$ est surjective, et c'est une bijection de $]0, +\infty[$ sur $\mathbb R$ ({{c-bijection|Théorème de la bijection}}).

      (ii) Par le théorème de la bijection, $E$ est continue et strictement croissante. En $b = L(a)$, la dérivée $L'(a) = 1/a$ n'est pas nulle, et le nœud {{de-reciproque|Dérivée d'une réciproque}}, (i), donne
      $$E'(b) = \frac{1}{L'\big(E(b)\big)} = E(b).$$
      Ainsi $E' = E$, qui est elle-même dérivable, et par récurrence $E^{(k)} = E$ pour tout $k$. Enfin $E(0) = 1$, puisque $L(1) = 0$.

      (iii) La fonction $h(y) = E(y)E(-y)$ est dérivable ({{de-operations|Opérations}}, (ii), et {{de-composee|Dérivée d'une composée}}), de dérivée
      $$h'(y) = E(y)E(-y) - E(y)E(-y) = 0.$$
      Elle est donc constante, égale à $h(0) = 1$.

      (iv) Par récurrence sur $m$. Pour $m = 0$, $E(y) \geqslant E(0) = 1$ si $y \geqslant 0$, $E$ étant croissante.

      Si l'inégalité vaut au rang $m$, la fonction $u(y) = E(y) - \frac{y^{m+1}}{(m+1)!}$ a pour dérivée, sur $[0, +\infty[$,
      $$u'(y) = E(y) - \frac{y^m}{m!} \geqslant 0.$$
      Elle est donc croissante ({{de-monotonie|Monotonie}}, (i)), et $u(y) \geqslant u(0) = 1 > 0$.
    remarques:
      - |
        La fonction $E$ est l'exponentielle réelle, et $L$ le logarithme : un calcul numérique de l'intégrale donne $L(2) \approx 0{,}6931$, et la résolution de $L(x) = 1$ donne $E(1) \approx 2{,}7183$. L'atlas définit l'exponentielle par une série en {{cx-exponentielle|analyse complexe}}, qui n'est pas un ancêtre de cette branche. On n'a besoin ici que des propriétés (ii) à (iv), que l'intégrale de Riemann suffit à établir.
      - |
        L'inégalité (iv) est le seul point qui servira. Avec (iii), elle donne, pour $x > 0$ et $m$ fixé,
        $$E(-1/x) = \frac{1}{E(1/x)} \leqslant m!\,x^m.$$
        Cette décroissance plus rapide que toute puissance de $x$, quand $x$ tend vers $0$, est exactement ce qu'exige une fonction $C^\infty$ nulle sur une demi-droite, au nœud suivant.

  - id: dr-plateau
    etiquette: Fonctions plateau
    nature: lemme
    titre: Une fonction plateau sur chaque cube
    texte: |
      Soit $E$ la fonction du nœud {{dr-exp|Une exponentielle réelle}}. On pose $\theta(x) = E(-1/x)$ pour $x > 0$, et $\theta(x) = 0$ pour $x \leqslant 0$.

      Pour $p \in \lex{n-uplet}{\mathbb R^n}$ et $r > 0$, on pose
      $$\psi_{p,r}(y) = \prod_{l=1}^n \theta\big(r^2 - (y_l - p_l)^2\big).$$

      Une [[fonction-plateau|fonction plateau]] sur $\mathbb R^n$ est une fonction de classe $C^\infty$, nulle hors d'une partie compacte, sans être identiquement nulle.
    enonce: |
      (i) $\theta$ est de classe $C^\infty$ sur $\lex{ensemble-reels}{\mathbb R}$ ; elle est nulle sur $]{-\infty}, 0]$ et strictement positive sur $]0, +\infty[$. Toutes ses dérivées successives sont nulles en $0$, et, pour $x > 0$, $\theta^{(k)}(x) = P_k(1/x)\,\theta(x)$, où les polynômes $P_k$ sont définis par $P_0 = 1$ et
      $$P_{k+1}(u) = u^2\big(P_k(u) - P_k'(u)\big).$$

      (ii) $\psi_{p,r}$ est une fonction plateau : elle est de classe $C^\infty$ sur $\mathbb R^n$, strictement positive sur le cube ouvert $B_\infty(p, r)$, et nulle en dehors.
    preuve: |
      (i) *Signe, et dérivées hors de $0$.* $E$ est à valeurs strictement positives, d'où le signe. Sur $]0, +\infty[$, $\theta$ est la composée de $x \mapsto -1/x$ et de $E$, et $\theta'(x) = \frac{1}{x^2}\,\theta(x)$ ({{de-composee|Dérivée d'une composée}}). Si $\theta^{(k)}(x) = P_k(1/x)\,\theta(x)$ sur $]0, +\infty[$, la dérivée de ce produit est
      $$\begin{aligned} &-\frac{1}{x^2}P_k'\Big(\frac1x\Big)\theta(x) + P_k\Big(\frac1x\Big)\frac{\theta(x)}{x^2} \\ &\quad = P_{k+1}\Big(\frac1x\Big)\theta(x). \end{aligned}$$

      *Une majoration.* Soit $P$ un polynôme de degré au plus $d$, dont la somme des valeurs absolues des coefficients vaut $A$. Pour $0 < x \leqslant 1$, chaque terme $c_jx^{-j}$ est majoré en valeur absolue par $|c_j|\,x^{-d}$, donc $|P(1/x)| \leqslant A\,x^{-d}$. Par {{dr-exp|Une exponentielle réelle}}, (iii) et (iv), avec $m = d + 2$,
      $$\theta(x) = \frac{1}{E(1/x)} \leqslant (d+2)!\,x^{d+2}.$$
      Ainsi $|P(1/x)\,\theta(x)| \leqslant A\,(d+2)!\,x^2$ pour $0 < x \leqslant 1$.

      *Récurrence.* Montrons que, pour tout $k$, $\theta$ est $k$ fois dérivable sur $\mathbb R$, avec $\theta^{(k)} = 0$ sur $]{-\infty}, 0]$ et $\theta^{(k)}(x) = P_k(1/x)\,\theta(x)$ pour $x > 0$. C'est vrai pour $k = 0$.

      Supposons-le au rang $k$. Sur $]{-\infty}, 0[$, $\theta^{(k)}$ est nulle, de dérivée nulle ; sur $]0, +\infty[$, elle a la dérivée calculée plus haut. En $0$, le taux d'accroissement
      $$\frac{\theta^{(k)}(h) - \theta^{(k)}(0)}{h}$$
      est nul pour $h < 0$, et majoré en valeur absolue par $A\,(d+2)!\,h$ pour $0 < h \leqslant 1$, par la majoration appliquée à $P_k$ ; il tend vers $0$, et $\theta^{(k+1)}(0) = 0$.

      *Conclusion.* Chaque $\theta^{(k)}$ est dérivable sur $\mathbb R$, donc continue ({{de-dl1|DL à l'ordre 1}}) : $\theta$ est de classe $C^k$ pour tout $k$ au sens du nœud {{de-taylor|Taylor-Lagrange}}.

      C'est aussi la classe $C^k$ du nœud {{gd-classe-ck|Classe Cᵏ}} pour $n = 1$, par récurrence sur $k$, puisque $d\theta(x)(h) = h\,\theta'(x)$ ({{gd-differentielle|Différentielle}}, (ii)) et que $\theta'$ a la même forme que $\theta$ : dérivable en tout point, de dérivée elle-même dérivable à tout ordre.

      (ii) Pour chaque $l$, la fonction $y \mapsto r^2 - (y_l - p_l)^2$ est polynomiale, donc de classe $C^\infty$, et sa composée avec $\theta$ l'est aussi ({{gd-classe-ck|Classe Cᵏ}}, (iii)), ainsi que le produit des $n$ facteurs.

      Chaque facteur est positif, et strictement positif si et seulement si $|y_l - p_l| < r$. Le produit est donc strictement positif si et seulement si $\|y - p\|_\infty < r$, et nul sinon. Il est nul hors du cube fermé $\prod_l [p_l - r, p_l + r]$, fermé et borné, donc compact ({{me-rn|L'espace ℝⁿ}}, (iii)), et il n'est pas nul en $p$.
    remarques:
      - |
        Les premiers polynômes sont $P_1(u) = u^2$, $P_2(u) = u^4 - 2u^3$ et $P_3(u) = u^6 - 6u^5 + 6u^4$, comme on le vérifie en dérivant $\theta$ à la machine. Comme $P_2(u) = u^3(u - 2)$, la dérivée seconde de $\theta$ ne s'annule sur $]0, +\infty[$ qu'en $x = 1/2$ : $\theta$ est convexe sur $]0, 1/2]$, concave au-delà, et c'est en $x = 1/2$ que sa pente, $\theta'(1/2) = 4\theta(1/2) \approx 0{,}541$, est maximale.

        Les valeurs $\theta(1) \approx 0{,}368$, $\theta(1/2) \approx 0{,}135$ et $\theta(1/10) \approx 4{,}5 \cdot 10^{-5}$ montrent à quel point elle est plate près de $0$.

        ```schema dr-plateau
        À gauche, la fonction $\theta$, nulle sur $]{-\infty}, 0]$, qui quitte l'axe sans angle ni saut ; le point rouge, d'abscisse $x = 1/2$, est son unique point d'inflexion. À droite, la fonction plateau $\psi_{0,1}$ sur $\mathbb R$, soit $t \mapsto \theta(1 - t^2)$, strictement positive sur $]{-1}, 1[$ et nulle en dehors ; son maximum, en $0$, vaut $\theta(1) \approx 0{,}368$.
        ```
      - |
        L'erreur la plus répandue est de croire qu'une fonction de classe $C^\infty$ est la somme de sa série de Taylor. Ici toutes les dérivées en $0$ sont nulles, si bien que le polynôme de Taylor en $0$ est nul à tout ordre, alors que $\theta(x) > 0$ pour $x > 0$ : dans la formule de Taylor-Lagrange ({{de-taylor|Taylor-Lagrange}}), le reste porte à lui seul toute la valeur de la fonction. C'est précisément cette souplesse, interdite aux fonctions développables en série entière, qui permettra de recoller des objets locaux.
      - |
        Ce sont les fonctions dont l'absence est signalée au nœud {{gd-formes-varietes|Formes sur une variété}}, où elles manquent pour démontrer qu'une variété orientable porte une forme volume. Elles sont construites ici, en aval de ce nœud, et ne servent dans l'atlas qu'aux partitions de l'unité de ce graphe.

  - id: dr-recouvrement
    etiquette: Recouvrement par des cubes
    nature: lemme
    titre: Un recouvrement localement fini de l'ouvert par des cubes
    texte: |
      Soit $U$ un ouvert non vide de $\lex{n-uplet}{\mathbb R^n}$, muni de $\|\cdot\|_\infty$. Si $U \neq \mathbb R^n$, notons
      $$d(x) = \inf_{a \notin U} \|x - a\|_\infty$$
      et $\delta(x) = \min\big(1, d(x)\big)$ ; si $U = \mathbb R^n$, posons $\delta = 1$.

      Soit $I$ l'ensemble des couples $i = (k, p)$, où $k \in \lex{ensemble-entiers-naturels}{\mathbb N}$ et $p \in 2^{-k-4}\,\lex{ensemble-entiers-relatifs}{\mathbb Z}^n$ vérifient
      $$2^{-k-2} \leqslant \delta(p) \leqslant 2^{1-k}.$$
      On note $p_i = p$, $r_i = 2^{-k-3}$ et $B_i = B_\infty(p_i, r_i)$ : c'est une boule au sens du nœud {{dr-primitives|Primitives locales}}, que l'on appelle aussi un **cube**.

      Une famille de parties de $U$ est [[localement-fini|localement finie]] si tout point de $U$ a un voisinage qui ne rencontre qu'un nombre fini d'entre elles.

      Les démonstrations des points (ii) à (v), et celles du nœud suivant, « Partition de l'unité », n'utilisent de $\delta$ que les propriétés du point (i) et l'inégalité $\delta \leqslant 1$. Elles valent donc pour toute fonction $\delta' : \mathbb R^n \to [0, 1]$ qui a ces propriétés ; le chapitre « Mayer-Vietoris et homotopie » en emploie une autre.
    enonce: |
      (i) $|\delta(x) - \delta(y)| \leqslant \|x - y\|_\infty$ pour tous $x, y$. Pour $x \in U$, $\delta(x) > 0$ et $B_\infty(x, \delta(x)) \subset U$ ; pour $x \notin U$, $\delta(x) = 0$.

      (ii) Chaque cube $B_i$ est contenu dans $U$, et les cubes recouvrent $U$ : plus précisément, tout $x \in U$ vérifie $\|x - p_i\|_\infty \leqslant r_i/4$ pour au moins un indice $i$.

      (iii) Pour $x \in U$, le voisinage $W_x = B_\infty(x, \delta(x)/4)$, contenu dans $U$, ne rencontre qu'un nombre fini de cubes : la famille $(B_i)_{i \in I}$ est localement finie.

      (iv) Si $B_i \cap B_j \neq \varnothing$, le segment $[p_i, p_j]$ est contenu dans $B_i \cup B_j$, et $B_i \cap B_j$ est convexe.

      (v) L'application $(k, p) \mapsto (k, p_1, \dots, p_n)$ est une injection de $I$ dans $\lex{n-uplet}{\mathbb Q^{n+1}}$. Une bijection de $\mathbb N$ sur $\mathbb Q^{n+1}$ étant fixée ({{q-denombrable|ℚ est dénombrable}}, (ii)), on en déduit sur $I$ un [[bon-ordre|bon ordre]] : un ordre total pour lequel toute partie non vide a un plus petit élément.
    preuve: |
      (i) Si $U = \mathbb R^n$, tout est clair. Sinon, pour $a \notin U$,
      $$\|x - a\|_\infty \leqslant \|x - y\|_\infty + \|y - a\|_\infty ;$$
      en passant à la borne inférieure en $a$, $d(x) \leqslant \|x - y\|_\infty + d(y)$, et de même en échangeant $x$ et $y$. L'application $s \mapsto \min(1, s)$ vérifie $|\min(1, s) - \min(1, t)| \leqslant |s - t|$, d'où l'inégalité pour $\delta$.

      Si $x \notin U$, le choix $a = x$ donne $d(x) = 0$. Si $x \in U$, il existe $\varepsilon > 0$ tel que $B_\infty(x, \varepsilon) \subset U$, $U$ étant ouvert ({{me-rn|L'espace ℝⁿ}}, (i)) ; tout $a \notin U$ vérifie alors $\|x - a\|_\infty \geqslant \varepsilon$, et $d(x) \geqslant \varepsilon > 0$. Enfin, si $\|y - x\|_\infty < \delta(x)$, le point $y$ est dans $U$, puisque sinon $d(x) \leqslant \|x - y\|_\infty < d(x)$.

      (ii) *Inclusion.* Pour $i = (k, p)$, $\delta(p) \geqslant 2^{-k-2} > 0$, donc $p \in U$ par (i), et $r_i = 2^{-k-3} < \delta(p)$ : par (i) encore, $B_i \subset B_\infty(p, \delta(p)) \subset U$.

      *Recouvrement.* Soit $x \in U$. La propriété d'Archimède ({{ar-archimede|Archimède}}) donne un entier $N \geqslant 1$ tel que $N\delta(x) > 1$, et $2^{-N} \leqslant 1/N < \delta(x)$ ; soit $k$ le plus petit entier tel que $2^{-k-1} < \delta(x)$ ({{n-ordre|Bon ordre sur ℕ}}). Alors $\delta(x) \leqslant 2^{-k}$ : par minimalité si $k \geqslant 1$, et parce que $\delta \leqslant 1$ si $k = 0$.

      Pour chaque $l$, soit $m_l$ le plus grand entier tel que $m_l \leqslant 2^{k+4}x_l + \frac12$, qui existe par la propriété d'Archimède et le bon ordre ; alors $|2^{k+4}x_l - m_l| \leqslant \frac12$. Le point $p = 2^{-k-4}(m_1, \dots, m_n)$ vérifie donc $\|x - p\|_\infty \leqslant 2^{-k-5}$, et, par (i),
      $$\begin{aligned} \delta(p) &\geqslant \delta(x) - 2^{-k-5} \\ &> 2^{-k-1} - 2^{-k-5} \geqslant 2^{-k-2}, \\ \delta(p) &\leqslant \delta(x) + 2^{-k-5} \\ &\leqslant 2^{-k} + 2^{-k-5} \leqslant 2^{1-k}. \end{aligned}$$
      Ainsi $i = (k, p) \in I$, et $\|x - p\|_\infty \leqslant 2^{-k-5} = r_i/4$ ; en particulier $x \in B_i$.

      (iii) $W_x \subset U$ par (i).

      Soit $y \in W_x \cap B_i$, avec $i = (k, p)$. D'une part $|\delta(y) - \delta(x)| < \delta(x)/4$ par (i). D'autre part $\|y - p\|_\infty < 2^{-k-3}$, donc, toujours par (i),
      $$\begin{aligned} 2^{-k-3} &\leqslant \delta(p) - 2^{-k-3} < \delta(y), \\ \delta(y) &< \delta(p) + 2^{-k-3} < 2^{2-k}. \end{aligned}$$
      On en tire $2^{-k-3} < \frac54\,\delta(x)$ et $2^{2-k} > \frac34\,\delta(x)$, c'est-à-dire
      $$\frac{3}{16}\,\delta(x) < 2^{-k} < 10\,\delta(x),$$
      ce que ne vérifie qu'un nombre fini d'entiers $k$.

      Pour chacun d'eux, $\|p - x\|_\infty < \delta(x)/4 + 2^{-k-3}$, et chaque coordonnée de $2^{k+4}p$ est un entier d'un intervalle borné : il n'y a qu'un nombre fini de tels $p$.

      (iv) Notons $u = p_j - p_i$. Un point commun à $B_i$ et $B_j$ est à distance $< r_i$ de $p_i$ et $< r_j$ de $p_j$, donc $\|u\|_\infty < r_i + r_j$. Pour $t \in [0, 1]$, le point $p_i + tu$ est à distance $t\|u\|_\infty$ de $p_i$ et $(1 - t)\|u\|_\infty$ de $p_j$.

      Si $t \leqslant \frac{r_i}{r_i + r_j}$, la première distance est $< r_i$ ; sinon, $1 - t < \frac{r_j}{r_i + r_j}$, et la seconde est $< r_j$. Enfin, l'intersection de deux convexes est convexe.

      (v) Les coordonnées de $p$ sont des rationnels, et deux couples de même image sont égaux. On pose $i < i'$ si l'image de $i$ a un rang strictement plus petit que celle de $i'$ dans la bijection fixée : c'est un ordre total, et une partie non vide de $I$ a pour plus petit élément celui dont l'image a le plus petit rang ({{n-ordre|Bon ordre sur ℕ}}).
    remarques:
      - |
        Pour $U = \mathbb R^2 \setminus \{0\}$, on a $\delta(x) = \min(1, \|x\|_\infty)$. Au point $x = \big(\frac3{10}, \frac1{10}\big)$, $\delta(x) = \frac3{10}$, d'où $k = 1$. L'arrondi de la preuve donne $p = \big(\frac5{16}, \frac3{32}\big)$, à distance $\frac1{80}$ de $x$, centre d'un cube de rayon $\frac1{16}$, et $\delta(p) = \frac5{16}$ est bien compris entre $\frac18$ et $1$.

        Un dénombrement exhaustif, fait à la machine, montre que $x$ appartient à $44$ cubes, de trois tailles ($k = 0$, $1$ et $2$), et que $W_x$ en rencontre $418$. La famille est localement finie sans être clairsemée : seule compte la finitude, non la petitesse du nombre.
      - |
        L'erreur la plus tentante serait de prendre tous les cubes à centre et rayon rationnels contenus dans $U$. Ils recouvrent $U$, mais chaque point appartient à une infinité d'entre eux, de rayons arbitrairement petits, et la somme du nœud {{dr-partition|Partition de l'unité}} serait infinie. Ici le rayon $r_i$ est lié à $\delta(p_i)$, la distance au bord de $U$ : les cubes rapetissent à l'approche du bord, assez pour rester dans $U$, mais pas davantage, et c'est ce qui assure la finitude locale.
      - |
        Aucun choix n'intervient. Le cube qui contient un point est donné par un arrondi explicite, et l'ordre de (v) permettra, au nœud {{dr-cocycle|Périodes locales}}, de désigner sans choix un élément parmi une infinité de candidats.

  - id: dr-partition
    etiquette: Partition de l'unité
    nature: proposition
    titre: Partition de l'unité subordonnée aux cubes
    texte: |
      On garde les notations du nœud {{dr-recouvrement|Recouvrement par des cubes}}, et l'on pose $\psi_i = \psi_{p_i, r_i}$ pour $i \in I$ ({{dr-plateau|Fonctions plateau}}).

      Une [[partition-unite|partition de l'unité]] subordonnée à la famille $(B_i)_{i \in I}$ est une famille $(\chi_i)_{i \in I}$ de fonctions positives de classe $C^\infty$ sur $U$, telle que $\chi_i$ soit nulle hors de $B_i$, que la famille des parties $\{\chi_i \neq 0\}$ soit localement finie, et que $\sum_i \chi_i = 1$ sur $U$, la somme n'ayant en chaque point qu'un nombre fini de termes non nuls.
    enonce: |
      (i) *La classe $C^\infty$ est locale.* Soit $O$ un ouvert de $\mathbb R^n$, $f : O \to \mathbb R^q$ et $(V_\alpha)$ une famille d'ouverts de réunion $O$. Si chaque restriction $f|_{V_\alpha}$ est de classe $C^\infty$, $f$ l'est.

      (ii) La fonction $S = \sum_{i \in I} \psi_i$ est bien définie sur $U$, et elle y est de classe $C^\infty$ et strictement positive.

      (iii) Les fonctions $\chi_i = \psi_i/S$ forment une partition de l'unité subordonnée à $(B_i)$, et $\chi_i(x) \neq 0$ si et seulement si $x \in B_i$.
    preuve: |
      (i) Montrons par récurrence sur $k$ que $f$ est de classe $C^k$, pour toutes les applications $f$ et tous les $q$ à la fois.

      Pour $k = 0$, la continuité en un point ne dépend que des valeurs de $f$ au voisinage de ce point. Il en va de même de la différentiabilité en $a \in V_\alpha$ : sa définition ({{gd-differentielle|Différentielle}}) ne fait intervenir $f(a + h)$ que pour $h$ petit, de sorte que $f$ est différentiable en $a$, avec $df(a) = d(f|_{V_\alpha})(a)$.

      Si chaque $f|_{V_\alpha}$ est de classe $C^{k+1}$, $f$ est donc différentiable en tout point, et la restriction de $df$ à $V_\alpha$, qui est $d(f|_{V_\alpha})$, vue à valeurs dans $\mathbb R^{qn}$, est de classe $C^k$. Par hypothèse de récurrence, $df$ est de classe $C^k$ sur $O$, et $f$ est de classe $C^{k+1}$ ({{gd-classe-ck|Classe Cᵏ}}).

      (ii) Soit $x \in U$. Sur $W_x$, les $\psi_i$ dont le cube ne rencontre pas $W_x$ sont nulles ({{dr-plateau|Fonctions plateau}}, (ii)), et il n'en reste qu'un nombre fini ({{dr-recouvrement|Recouvrement par des cubes}}, (iii)).

      La somme a donc un sens en chaque point, et sa restriction à $W_x$ est une somme finie de fonctions de classe $C^\infty$, qui l'est ({{gd-classe-ck|Classe Cᵏ}}, (ii)). Les $W_x$ sont des ouverts de réunion $U$, et (i) conclut.

      Enfin $x$ appartient à un cube $B_i$ ({{dr-recouvrement|Recouvrement par des cubes}}, (ii)), où $\psi_i(x) > 0$, les autres termes étant positifs : $S(x) > 0$.

      (iii) La fonction $t \mapsto 1/t$ est de classe $C^\infty$ sur $]0, +\infty[$ : si elle est de classe $C^k$, sa dérivée $-\frac1t \cdot \frac1t$ l'est aussi, comme produit ({{gd-classe-ck|Classe Cᵏ}}, (iii)), et elle est donc de classe $C^{k+1}$. Par composition et produit, $\chi_i = \psi_i \cdot \frac1S$ est de classe $C^\infty$ sur $U$.

      Elle est positive, et non nulle exactement là où $\psi_i$ l'est, c'est-à-dire sur $B_i$. La famille des $B_i$ est localement finie, et $\sum_i \chi_i = S/S = 1$.
    remarques:
      - |
        Une partition de l'unité sert à recoller. Des objets définis chacun sur un cube, par exemple des fonctions $f_i$, se combinent en $\sum_i \chi_i f_i$, définie sur tout $U$ et égale à $f_i$ près d'un point qui n'appartient qu'au cube $B_i$. Le nœud {{dr-surjectivite|Surjectivité}} l'emploie ainsi, avec des constantes en guise d'objets locaux.
      - |
        Pour $U = \mathbb R^2 \setminus \{0\}$ et le point $x = \big(\frac3{10}, \frac1{10}\big)$ du nœud {{dr-recouvrement|Recouvrement par des cubes}}, la somme $S(x)$ compte $44$ termes non nuls, un par cube contenant $x$. Une partition de l'unité n'attribue donc pas chaque point à un seul cube : elle en fait une moyenne pondérée de nombreux cubes, dont les poids $\chi_i(x)$ dépendent de la position de $x$ dans chacun.
      - |
        Une construction analogue, faite carte par carte, fournit des partitions de l'unité sur les variétés séparées à base dénombrable ({{gd-varietes|Variétés}}). C'est l'outil qui manque au nœud {{gd-formes-varietes|Formes sur une variété}} pour démontrer qu'une variété orientable porte une forme volume ; ce résultat y reste admis, ce nœud précédant celui-ci.

  - id: dr-cocycle
    etiquette: Périodes locales
    nature: lemme
    titre: Chaînes d'accès et périodes locales d'un morphisme
    texte: |
      On garde les notations du nœud {{dr-recouvrement|Recouvrement par des cubes}}, et l'on fixe un morphisme $\varphi : \lex{homologie-singuliere}{H_1}(U) \to \mathbb R$.

      Pour deux points $x, y$ de $\lex{n-uplet}{\mathbb R^n}$, $[x, y]$ désigne le simplexe affine $t \mapsto t_0x + t_1y$ ({{h-subdivision|Subdivision barycentrique}}), d'image le segment $[x, y]$ et de bord $y - x$ ; c'est un simplexe singulier de $U$ dès que ce segment est contenu dans $U$.

      Une **chaîne de cubes** de $i$ à $j$ est une suite $(i_0, \dots, i_m)$ d'éléments de $I$, avec $i_0 = i$, $i_m = j$ et $B_{i_{l-1}} \cap B_{i_l} \neq \varnothing$ pour $1 \leqslant l \leqslant m$.

      Être reliés par une chaîne de cubes est une relation d'équivalence sur $I$, par renversement et concaténation des chaînes. On note $b(i)$ le plus petit élément de la classe de $i$, pour l'ordre du nœud {{dr-recouvrement|Recouvrement par des cubes}}, (v).

      La **chaîne d'accès** de $i$ est, parmi les chaînes de cubes de $b(i)$ à $i$ de longueur $m$ minimale, la plus petite pour l'ordre lexicographique.

      On prend le plus petit $i_1$ par lequel commence une telle chaîne, puis, parmi celles qui commencent par $(i_0, i_1)$, le plus petit $i_2$ possible, et ainsi de suite pendant $m$ étapes. À chaque étape, l'ensemble des candidats est non vide, puisque le début déjà construit est celui d'une chaîne de longueur $m$, et il a un plus petit élément par le nœud {{dr-recouvrement|Recouvrement par des cubes}}, (v). La chaîne obtenue est plus petite que toute autre chaîne de cubes de $b(i)$ à $i$ de longueur $m$, au premier indice où elles diffèrent.

      On lui associe la $1$-chaîne
      $$c_i = \sum_{l=1}^m [p_{i_{l-1}}, p_{i_l}],$$
      nulle si $i = b(i)$, et, pour $x \in B_i$,
      $$\kappa_i(x) = c_i + [p_i, x].$$
    enonce: |
      (i) $c_i$ et $\kappa_i(x)$ sont des chaînes de $U$, et $\partial\kappa_i(x) = x - p_{b(i)}$.

      (ii) Si $\tau : \Delta_1 \to U$ est un simplexe singulier à valeurs dans $B_i$, d'extrémités $x = \tau(e_0)$ et $y = \tau(e_1)$, alors $\tau - \kappa_i(y) + \kappa_i(x)$ est un bord de $U$.

      (iii) Si $B_i \cap B_j \neq \varnothing$, alors $b(i) = b(j)$, et, pour $x \in B_i \cap B_j$, $\kappa_i(x) - \kappa_j(x)$ est un cycle dont la classe ne dépend pas de $x$. On pose
      $$a_{ij} = \varphi\big([\kappa_i(x) - \kappa_j(x)]\big).$$

      (iv) Si $x \in B_i \cap B_j \cap B_{j'}$, alors $a_{ij} + a_{jj'} = a_{ij'}$ ; de plus $a_{ii} = 0$.
    preuve: |
      (i) Le segment $[p_{i_{l-1}}, p_{i_l}]$ est contenu dans $B_{i_{l-1}} \cup B_{i_l}$, donc dans $U$ ({{dr-recouvrement|Recouvrement par des cubes}}, (ii) et (iv)), et le segment $[p_i, x]$ dans le cube convexe $B_i$. La somme des bords est télescopique :
      $$\begin{aligned} \partial\kappa_i(x) &= \sum_{l=1}^m (p_{i_l} - p_{i_{l-1}}) + (x - p_i) \\ &= x - p_{b(i)}. \end{aligned}$$

      (ii) La chaîne $\tau + [p_i, x] - [p_i, y]$ est formée de simplexes à valeurs dans $B_i$, et son bord est
      $$(y - x) + (x - p_i) - (y - p_i) = 0 :$$
      c'est un cycle de $B_i$. Le cube $B_i$, convexe, est étoilé et a l'homologie d'un point ({{h-homotopie|Invariance par homotopie}}, (ii)). Donc $H_1(B_i) = 0$, et ce cycle est le bord d'une $2$-chaîne de $B_i$, qui est aussi une chaîne de $U$. Or $\tau + [p_i, x] - [p_i, y] = \tau - \kappa_i(y) + \kappa_i(x)$, les termes $c_i$ se compensant.

      (iii) La suite $(i, j)$ est une chaîne de cubes : $i$ et $j$ ont la même classe, et $b(i) = b(j)$. Par (i), le bord de $\kappa_i(x) - \kappa_j(x)$ est $(x - p_{b(i)}) - (x - p_{b(j)}) = 0$.

      Si $x, y \in B_i \cap B_j$, le simplexe $[x, y]$ est à valeurs dans $B_i \cap B_j$, qui est convexe ({{dr-recouvrement|Recouvrement par des cubes}}, (iv)). Par (ii), appliqué dans $B_i$ puis dans $B_j$, les chaînes $[x, y] - \kappa_i(y) + \kappa_i(x)$ et $[x, y] - \kappa_j(y) + \kappa_j(x)$ sont des bords. Leur différence,
      $$\big(\kappa_i(x) - \kappa_j(x)\big) - \big(\kappa_i(y) - \kappa_j(y)\big),$$
      en est un aussi : les deux cycles ont la même classe.

      (iv) Avec le même point $x$,
      $$\begin{aligned} &\big(\kappa_i(x) - \kappa_j(x)\big) + \big(\kappa_j(x) - \kappa_{j'}(x)\big) \\ &\quad = \kappa_i(x) - \kappa_{j'}(x), \end{aligned}$$
      et $\varphi$ est un morphisme. Pour $a_{ii}$, le cycle est nul.
    remarques:
      - |
        Le nombre $a_{ij}$ est la valeur de $\varphi$ sur un lacet : partir du centre du cube de base, suivre la chaîne d'accès de $i$ jusqu'à $p_i$, aller en $x$, puis revenir par $p_j$ et la chaîne d'accès de $j$, parcourue à rebours. Sur $\mathbb R^2 \setminus \{0\}$, ce lacet fait le tour de l'origine lorsque les deux chaînes d'accès la contournent de part et d'autre.

        ```schema dr-cocycle
        Pour $U = \mathbb R^2 \setminus \{0\}$, les cubes dessinés appartiennent au recouvrement (ici $k = 0$, rayon $\frac18$). Deux chaînes de cubes partent d'un cube pris pour base, grisé, de centre $p_b$ : l'une contourne l'origine par le haut jusqu'au cube $B_i$, en bleu, l'autre par le bas jusqu'au cube $B_j$, en vert. Ce ne sont pas les chaînes d'accès, plus courtes, et dont le cube de base dépend de l'énumération fixée ; la démonstration permet de les mettre à leur place (remarque 2 du nœud {{dr-surjectivite|Surjectivité}}). Avec les segments rouges qui joignent leurs centres au point $x$ de $B_i \cap B_j$, elles forment un lacet qui fait une fois le tour de l'origine, et le nombre qu'il définit vaut $\varphi$ de la classe d'un tour.
        ```
      - |
        L'erreur la plus tentante est de poser directement « $\varphi(\kappa_i(x))$ ». Or $\varphi$ n'est définie que sur les classes de cycles, et $\kappa_i(x)$, de bord $x - p_{b(i)}$, n'en est pas un. Seules les différences $\kappa_i(x) - \kappa_j(x)$, qui reviennent à leur point de départ, ont une valeur ; c'est pourquoi les nombres $a_{ij}$ sont attachés aux paires de cubes qui se rencontrent, et non aux cubes eux-mêmes.
      - |
        Les chaînes d'accès sont désignées sans choix, comme plus petits éléments d'ensembles de suites finies, grâce à l'ordre fixé sur $I$. Choisir arbitrairement un chemin vers chacun des cubes, en nombre infini, serait un usage de l'axiome du choix dénombrable ; la règle du plus petit élément l'évite.

  - id: dr-surjectivite
    etiquette: Surjectivité
    nature: théorème
    titre: Formes fermées de périodes prescrites
    enonce: |
      Soit $U$ un ouvert de $\lex{n-uplet}{\mathbb R^n}$ et $\varphi : \lex{homologie-singuliere}{H_1}(U) \to \mathbb R$ un morphisme. Il existe une forme fermée $\omega$ de degré $1$ sur $U$ telle que
      $$\int_z \omega = \varphi([z])$$
      pour tout cycle $z \in Z_1(U)$. Autrement dit, l'application $\Phi : \lex{cohomologie-de-rham}{H^1}(U) \to \operatorname{Hom}\big(H_1(U), \mathbb R\big)$ du nœud {{dr-chaines|Intégration sur les chaînes}} est surjective.
    preuve: |
      Si $U$ est vide, il n'y a rien à démontrer. Sinon, on reprend les cubes $B_i$ ({{dr-recouvrement|Recouvrement par des cubes}}), la partition de l'unité $(\chi_j)$ ({{dr-partition|Partition de l'unité}}) et les nombres $a_{ij}$ attachés à $\varphi$ ({{dr-cocycle|Périodes locales}}).

      *Primitives locales.* Pour $i \in I$, soit $J_i$ l'ensemble des $j$ tels que $B_i \cap B_j \neq \varnothing$, et, sur $B_i$,
      $$g_i = \sum_{j \in J_i} a_{ij}\,\chi_j.$$
      Sur l'ouvert $W_x \cap B_i$, pour $x \in B_i$, seuls un nombre fini de termes ne sont pas identiquement nuls ; $g_i$ est donc de classe $C^\infty$ sur $B_i$ ({{dr-partition|Partition de l'unité}}, (i)).

      *Leurs différences sont constantes.* Soit $x \in B_i \cap B_{j'}$. Si $\chi_j(x) \neq 0$, alors $x \in B_j$, de sorte que $j \in J_i \cap J_{j'}$ et que $a_{ij} - a_{j'j} = a_{ij'}$ ({{dr-cocycle|Périodes locales}}, (iv)) ; les autres $\chi_j$ sont nulles en $x$. Donc
      $$\begin{aligned} g_i(x) - g_{j'}(x) &= \sum_j (a_{ij} - a_{j'j})\,\chi_j(x) \\ &= a_{ij'}\sum_j \chi_j(x) = a_{ij'}. \end{aligned}$$

      *La forme.* Sur l'ouvert $B_i \cap B_{j'}$, la différence $g_i - g_{j'}$ est constante, donc $dg_i = dg_{j'}$. On définit $\omega$ en posant $\omega_x = dg_i(x)$ pour un $i$ quelconque tel que $x \in B_i$. Ses coefficients sont les $\partial_l g_i$ sur chaque cube ; ils sont de classe $C^\infty$ sur chaque cube, donc sur $U$ ({{dr-partition|Partition de l'unité}}, (i)), et $\omega$ est une forme différentielle de degré $1$.

      Sur chaque cube, $\omega = dg_i$, et $d\omega = d(dg_i) = 0$ ({{gd-formes|Formes différentielles}}, (ii)), puisque $d\omega$ ne dépend en chaque point que des dérivées des coefficients. Ainsi $\omega$ est fermée, et $g_i$ en est une primitive sur la boule $B_i$, au sens du nœud {{dr-primitives|Primitives locales}}.

      *Réduction aux petites chaînes.* Soit $z$ un cycle. Le théorème des petites chaînes ({{h-petites-chaines|Petites chaînes}}), appliqué à l'ensemble des cubes, fournit $\rho$ et $D$ tels que
      $$z - \rho(z) = \partial Dz + D\partial z = \partial Dz.$$
      La chaîne $z' = \rho(z)$ est un cycle, formé de simplexes à valeurs chacun dans un cube, et $[z] = [z']$. L'intégrale étant nulle sur les bords ({{dr-chaines|Intégration sur les chaînes}}, (i)), $\int_z \omega = \int_{z'} \omega$.

      Écrivons $z' = \sum_\tau n_\tau\,\tau$, somme finie. Pour chaque $\tau$, soit $i(\tau)$ le plus petit indice tel que $\tau$ soit à valeurs dans $B_{i(\tau)}$, et $x_\tau = \tau(e_0)$, $y_\tau = \tau(e_1)$. Soit $P$ l'ensemble fini de ces extrémités et, pour $y \in P$, $j(y)$ le plus petit indice tel que $y \in B_{j(y)}$ ({{dr-recouvrement|Recouvrement par des cubes}}, (v)).

      Pour $y \in P$ et $i$ tel que $y \in B_i$, le cycle $\zeta_i(y) = \kappa_i(y) - \kappa_{j(y)}(y)$ vérifie $\varphi([\zeta_i(y)]) = a_{i\,j(y)}$ ({{dr-cocycle|Périodes locales}}, (iii)).

      *Valeur de $\varphi$.* Par {{dr-cocycle|Périodes locales}}, (ii), on a, modulo les bords,
      $$z' \equiv \sum_\tau n_\tau\Big(\kappa_{i(\tau)}(y_\tau) - \kappa_{i(\tau)}(x_\tau)\Big).$$
      Soit $K : \lex{ensemble-entiers-relatifs}{\mathbb Z}^{(P)} \to C_1(U)$ le morphisme qui envoie $y$ sur $\kappa_{j(y)}(y)$ ({{h-complexes|Complexes de chaînes}}, (i)). En écrivant $\kappa_i(y) = \zeta_i(y) + K(y)$, le second membre devient
      $$\begin{aligned} &\sum_\tau n_\tau\Big(\zeta_{i(\tau)}(y_\tau) - \zeta_{i(\tau)}(x_\tau)\Big) \\ &\quad + K\Big(\sum_\tau n_\tau(y_\tau - x_\tau)\Big). \end{aligned}$$
      L'argument de $K$ est $\partial z'$, élément de $\mathbb Z^{(P)} \subset C_0(U)$, qui est nul. Par conséquent
      $$\varphi([z]) = \sum_\tau n_\tau\Big(a_{i(\tau)\,j(y_\tau)} - a_{i(\tau)\,j(x_\tau)}\Big).$$

      *Valeur de l'intégrale.* Chaque $\tau$ est à valeurs dans $B_{i(\tau)}$, où $g_{i(\tau)}$ est une primitive de $\omega$ ; la subdivision réduite à un seul morceau est adaptée ({{dr-integrale|Intégrale le long d'un chemin continu}}), et
      $$\int_\tau \omega = g_{i(\tau)}(y_\tau) - g_{i(\tau)}(x_\tau).$$

      Pour $y \in P$ et $y \in B_i$, le calcul des différences donne
      $$g_i(y) = a_{i\,j(y)} + g_{j(y)}(y).$$
      Avec le morphisme $G : \mathbb Z^{(P)} \to \mathbb R$ qui envoie $y$ sur $g_{j(y)}(y)$,
      $$\begin{aligned} \int_{z'} \omega &= \sum_\tau n_\tau\Big(a_{i(\tau)\,j(y_\tau)} - a_{i(\tau)\,j(x_\tau)}\Big) \\ &\quad + G(\partial z'), \end{aligned}$$
      et $G(\partial z') = 0$.

      *Conclusion.* Les deux valeurs coïncident : $\int_z \omega = \varphi([z])$ pour tout cycle $z$, c'est-à-dire $\Phi([\omega]) = \varphi$. Aucun axiome du choix n'intervient : les indices $i(\tau)$ et $j(y)$ sont des plus petits éléments, et les nœuds utilisés n'en font pas.
    remarques:
      - |
        La forme $\omega$ est localement exacte, de primitive $g_i$ sur chaque cube, sans être exacte en général : deux primitives voisines diffèrent de la constante $a_{ij'}$, et ce sont ces sauts, accumulés le long d'un cycle, qui en forment les périodes.

        Sur $\mathbb R^2 \setminus \{0\}$, avec $\varphi$ valant $1$ sur la classe d'un tour, les $a_{ij'}$ non nuls se trouvent là où se rejoignent des chaînes d'accès venues des deux côtés de l'origine ({{dr-cocycle|Périodes locales}}, schéma). La forme $\omega$ est alors la différentielle d'une « fonction angle » dont le saut de $1$ a été étalé, par la partition de l'unité, sur une bande de cubes.
      - |
        On a programmé la construction dans ce cas, en se limitant aux $7848$ cubes qui rencontrent la couronne $0{,}35 < \|x\|_\infty < 1$ et en prenant des chaînes d'accès obtenues par un parcours en largeur, ce que la démonstration permet, puisqu'elle n'utilise que les propriétés (i) à (iv) du nœud {{dr-cocycle|Périodes locales}}.

        Les nombres $a_{ij}$ obtenus sont des entiers, et l'intégrale de $\omega$ vaut $1$, à $10^{-11}$ près, sur les cercles de centre $0$ et de rayons $0{,}6$ et $0{,}75$, et $0$ sur un petit cercle qui n'entoure pas l'origine : la forme recollée a bien la période prescrite.
      - |
        La démonstration du théorème de de Rham en tout degré procède par recollement le long d'un recouvrement, au moyen de la suite de Mayer-Vietoris ({{h-mayer-vietoris|Mayer-Vietoris}}) et de son analogue pour les formes, ou d'un complexe double qui les généralise : c'est l'objet des chapitres {{derham-cohomologie|Mayer-Vietoris et homotopie}} et {{derham-tout-degre|Théorème de de Rham en tout degré}}. En degré $1$, on a pu s'en passer : le théorème des petites chaînes ramène tout cycle à des morceaux contenus dans des cubes, où les primitives existent, et une partition de l'unité suffit au recollement. Les nombres $a_{ij}$ y forment déjà un cocycle de Čech, au sens du nœud {{dt-cech-de-rham|Čech-de Rham}}.

  - id: dr-degre1
    etiquette: De Rham en degré 1
    nature: théorème
    titre: Théorème de de Rham en degré 1
    enonce: |
      (i) Pour tout ouvert $U$ de $\lex{n-uplet}{\mathbb R^n}$, l'application $\Phi : \lex{cohomologie-de-rham}{H^1}(U) \to \operatorname{Hom}\big(\lex{homologie-singuliere}{H_1}(U), \mathbb R\big)$ est injective : une forme fermée dont l'intégrale est nulle sur tous les cycles est exacte. Comme elle est surjective ({{dr-surjectivite|Surjectivité}}), $\Phi$ est un isomorphisme d'espaces vectoriels.

      (ii) $H^1(\mathbb R^2 \setminus \{0\})$ est de dimension $1$. Une forme fermée sur $\mathbb R^2 \setminus \{0\}$ est exacte si et seulement si son intégrale sur le bord du carré $[-1, 1]^2$ est nulle.
    preuve: |
      (i) Supposons $\int_z \omega = 0$ pour tout cycle $z$. Soit $\gamma$ un chemin fermé formé de segments $[p_0, p_1], \dots, [p_{m-1}, p_m]$, avec $p_m = p_0$, et $\sigma_k$ le simplexe affine $t \mapsto t_0p_{k-1} + t_1p_k$ de $\Delta_1$ dans $U$.

      La chaîne $z = \sum_k \sigma_k$ a pour bord $\sum_k (p_k - p_{k-1}) = 0$ ; c'est un cycle, et $\int_z \omega = \sum_k \int_{[p_{k-1}, p_k]} \omega$ est l'intégrale de $\omega$ le long de $\gamma$ au sens du nœud {{gd-integrale-curviligne|Intégrale d'une 1-forme}} ({{dr-integrale|Intégrale le long d'un chemin continu}}, (ii)). Elle est donc nulle.

      Disons que deux points de $U$ sont **liés** s'ils sont reliés par une ligne brisée contenue dans $U$ ; c'est une relation d'équivalence, par concaténation et renversement des lignes. Chaque classe $V$ est ouverte : une boule centrée en un point $y$ de $V$ et contenue dans $U$ est convexe, et ses points sont liés à $y$ par un segment.

      Fixons une bijection de $\lex{ensemble-entiers-naturels}{\mathbb N}$ sur $\lex{n-uplet}{\mathbb Q^n}$ ({{q-denombrable|ℚ est dénombrable}}, (ii)). Chaque classe $V$, ouverte et non vide, contient une boule, produit d'intervalles ouverts, donc un point de $\mathbb Q^n$, $\mathbb Q$ étant dense dans $\mathbb R$ ({{tr-dense|Densité de ℚ}}), et l'on note $x_V$ le premier d'entre eux dans cette énumération.

      Pour $x \in V$, posons $f(x) = \int_\gamma \omega$, où $\gamma$ est une ligne brisée de $x_V$ à $x$ dans $U$ : la valeur ne dépend pas de $\gamma$, deux telles lignes formant un chemin fermé, d'intégrale nulle.

      Pour $x \in V$ et $t$ assez petit, le segment $[x, x + te_j]$ est dans une boule contenue dans $V$, et, en prolongeant la ligne par ce segment,
      $$f(x + te_j) - f(x) = \int_0^t \omega_{x + se_j}(e_j)\,ds\,;$$
      par le théorème fondamental ({{ar-tfa|Théorème fondamental}}), $\partial_j f(x) = \omega_x(e_j)$.

      Les dérivées partielles de $f$ sont les coefficients de $\omega$, continus, donc $f$ est de classe $C^1$ ({{gd-classe-ck|Classe Cᵏ}}, (i)) ; comme $df = \omega$ est de classe $C^\infty$, $f$ l'est, par la définition récursive de la classe $C^{k+1}$, et $df = \omega$ : $\omega$ est exacte, et $\Phi$ est injective. La construction ne fait aucun choix, l'énumération de $\mathbb Q^n$ étant fixée une fois pour toutes.

      Linéaire, injective et surjective ({{dr-surjectivite|Surjectivité}}), $\Phi$ est un isomorphisme.

      (ii) Soit $U = \mathbb R^2 \setminus \{0\}$, $r(x) = x/\|x\|_2$ et $\iota$ l'inclusion du cercle $\lex{sphere-unite}{S^1}$ dans $U$. On a $r \circ \iota = \mathrm{id}$, et $\iota \circ r$ est homotope à l'identité de $U$ par
      $$F(x, t) = (1 - t)x + t\,\frac{x}{\|x\|_2},$$
      qui ne s'annule pas, comme multiple strictement positif de $x$.

      Donc $H_1(U) \cong H_1(S^1) \cong \lex{ensemble-entiers-relatifs}{\mathbb Z}$ ({{h-homotopie|Invariance par homotopie}}, (ii), et {{h-spheres|Homologie des sphères}}).

      Un morphisme de $\mathbb Z$ dans $\mathbb R$ est déterminé par l'image de $1$ : $\operatorname{Hom}(H_1(U), \mathbb R)$ est de dimension $1$. Par (i), $\dim H^1(U) \leqslant 1$, et $H^1(U) \neq \{0\}$ ({{gd-de-rham|Cohomologie de de Rham}}, (iii)) : la dimension vaut $1$.

      La forme
      $$\omega_0 = \frac{x\,dy - y\,dx}{x^2 + y^2},$$
      fermée et non exacte, engendre donc $H^1(U)$ : toute forme fermée s'écrit $\omega = c\,\omega_0 + df$, avec $c$ réel.

      Notons $\int_\square$ l'intégrale sur le bord du carré $[-1, 1]^2$ parcouru dans le sens direct, qui vaut $c\int_\square \omega_0$ pour cette forme, l'intégrale de $df$ sur un chemin fermé étant nulle. Comme
      $$\int_\square \omega_0 = 4\int_{-1}^1 \frac{dt}{1 + t^2} > 0$$
      ({{gd-integrale-curviligne|Intégrale d'une 1-forme}}, remarque), $\omega$ est exacte si et seulement si $c = 0$, c'est-à-dire si et seulement si $\int_\square \omega = 0$.
    remarques:
      - |
        Les deux moitiés du théorème reposent sur des idées différentes. L'injectivité intègre la forme le long de lignes brisées, ce qui produit une primitive globale dès que toutes les périodes sont nulles. La surjectivité ({{dr-surjectivite|Surjectivité}}) fait le chemin inverse : elle part de primitives locales sur des cubes, dont les écarts sont dictés par les périodes prescrites, et les recolle au moyen d'une partition de l'unité ({{dr-partition|Partition de l'unité}}).

        En (ii), l'injectivité suffit, parce que la dimension de $H^1$ est déjà minorée par la forme $\omega_0$ ; la surjectivité dit, plus généralement, que toute famille de périodes compatible avec les relations entre cycles est atteinte.
      - |
        Sur $\mathbb R^2 \setminus \{0\}$, le théorème retrouve en termes différentiels le fait que le cercle a un seul « trou » : le groupe $H_1$, engendré par la classe d'un tour, est dual de $H^1$, engendré par la forme $\omega_0$, qui mesure l'angle balayé. L'analyse complexe identifie $\int_\square \omega_0$ à $2\pi$.
      - |
        L'erreur la plus répandue est d'oublier que $U$ peut avoir plusieurs morceaux. Sur la réunion de deux disques disjoints, toute forme fermée est exacte, mais une primitive n'est déterminée qu'à une constante près **sur chaque disque** : c'est $H^0$, de dimension $2$, qui compte les morceaux, et non $H^1$. La preuve de (i) construit une primitive sur chaque classe de points liés, avec un point de base fixé sans choix.
      - |
        Ce théorème est le cas $k = 1$ du théorème de de Rham en tout degré ({{dt-theoreme|De Rham en tout degré}}), sous sa forme duale ({{dt-dualite|Périodes sur les cycles}}). Il le précède et va plus loin sur deux points : il porte sur l'homologie singulière continue, et non seulement lisse, et il n'utilise aucun choix, alors que la forme duale en tout degré passe, dans l'atlas, par le lemme de Zorn.

  - id: dr-iterees
    etiquette: Intégrales itérées
    nature: proposition
    titre: Intégrale itérée d'une fonction continue sur un pavé
    texte: |
      Les nœuds qui suivent établissent la formule de Stokes en tout degré. Il faut d'abord intégrer une fonction de plusieurs variables ; la théorie de la mesure n'étant pas un ancêtre de cette branche, on le fait par des intégrales de Riemann successives, ce qui suffit pour les fonctions continues.

      Un **pavé** de $\lex{n-uplet}{\mathbb R^n}$, $n \geqslant 1$, est un produit $P = \prod_{i=1}^n [a_i, b_i]$ de segments, avec $a_i < b_i$ ; son **volume** est $v(P) = \prod_i (b_i - a_i)$. Le **cube unité** est $I^n = [0, 1]^n$. Par convention, $\mathbb R^0$ est réduit à un point, ainsi que tout pavé de $\mathbb R^0$, en particulier $I^0$, et l'intégrale d'une fonction sur un tel pavé est sa valeur en ce point.

      Soit $g$ une fonction réelle continue sur $P$, muni de la topologie induite. On pose $g_0 = g$ et, pour $1 \leqslant j \leqslant n$,
      $$\begin{aligned} &g_j(x_{j+1}, \dots, x_n) \\ &\quad = \int_{a_j}^{b_j} g_{j-1}(t, x_{j+1}, \dots, x_n)\,dt, \end{aligned}$$
      fonction définie sur le pavé $\prod_{i > j}[a_i, b_i]$, et réduite à un nombre pour $j = n$.

      L'**intégrale itérée** de $g$ sur $P$ est ce nombre :
      $$\int_P g = g_n.$$
      On intègre d'abord par rapport à $x_1$, puis à $x_2$, et ainsi de suite ; le nœud suivant montrera que l'ordre est indifférent.
    enonce: |
      (i) *Intégrales à paramètre.* Soit $K$ une partie compacte de $\mathbb R^q$ et $h$ une fonction continue sur $[a, b] \times K$. La fonction $x \mapsto \int_a^b h(t, x)\,dt$ est continue sur $K$. Par suite, chaque $g_j$ est bien définie et continue, et $\int_P g$ a un sens ; ce nombre ne dépend que des valeurs de $g$ sur $P$.

      (ii) L'intégrale itérée est linéaire et croissante en $g$, et $\int_P 1 = v(P)$. Si $m \leqslant g \leqslant M$ sur $P$, alors
      $$m\,v(P) \leqslant \int_P g \leqslant M\,v(P).$$

      (iii) *Changement de variable affine.* Soit $\alpha_P(t) = \big(a_1 + (b_1 - a_1)t_1, \dots, a_n + (b_n - a_n)t_n\big)$, qui envoie $I^n$ sur $P$. Alors
      $$\int_P g = v(P)\int_{I^n} g \circ \alpha_P.$$
    preuve: |
      (i) Le produit $[a, b] \times K$ est fermé et borné dans $\mathbb R^{q+1}$, donc compact ({{me-rn|L'espace ℝⁿ}}, (iii)). Par le théorème de Heine ({{me-heine|Théorème de Heine}}), appliqué pour la distance $d_\infty$, à tout $\varepsilon > 0$ correspond $\delta > 0$ tel que $|h(t, x) - h(t, x')| < \varepsilon$ dès que $\|x - x'\|_\infty < \delta$, quel que soit $t \in [a, b]$.

      Le même théorème, appliqué aux points $(t, x)$ et $(t', x)$, montre que chaque fonction $t \mapsto h(t, x)$ est uniformément continue sur $[a, b]$, donc intégrable ({{ri-continues|Fonctions continues}}, (i)). Pour $x, x' \in K$ tels que $\|x - x'\|_\infty < \delta$, l'inégalité de la moyenne ({{ri-moyenne|Inégalité de la moyenne}}, (i)), appliquée à la différence, donne
      $$\begin{aligned} &\Big|\int_a^b h(t, x)\,dt - \int_a^b h(t, x')\,dt\Big| \\ &\quad \leqslant (b - a)\,\varepsilon. \end{aligned}$$

      Supposons $g_{j-1}$ continue sur $[a_j, b_j] \times K_j$, où $K_j = \prod_{i > j}[a_i, b_i]$ est compact pour la même raison. Ce qui précède montre que $g_j$ est définie et continue sur $K_j$ ; pour $j = n$, $K_n$ est un point et $g_n$ est l'intégrale d'une fonction continue d'une variable. Par récurrence, toutes les $g_j$ sont définies et continues.

      Enfin $g_j$ ne fait intervenir $g_{j-1}$ que sur $[a_j, b_j] \times K_j$ : par récurrence, seules comptent les valeurs de $g$ sur $P$.

      (ii) Si $g \leqslant g'$ sur $P$, alors $g_j \leqslant g'_j$ pour tout $j$, par récurrence et par croissance de l'intégrale ({{ri-proprietes|Propriétés de l'intégrale}}, (ii)) ; la linéarité passe de même d'une étape à la suivante (même nœud, (i)).

      Pour $g = 1$, on trouve $g_j = \prod_{i \leqslant j}(b_i - a_i)$, et $g_n = v(P)$. L'encadrement vient de la croissance appliquée à $m \leqslant g \leqslant M$.

      (iii) *En une variable.* Soit $\varphi$ continue sur $[a, b]$. La fonction
      $$\begin{aligned} s \mapsto &\int_a^{a + (b - a)s} \varphi \\ &- (b - a)\int_0^s \varphi\big(a + (b - a)u\big)\,du \end{aligned}$$
      est dérivable sur $[0, 1]$, de dérivée $(b - a)\varphi(a + (b - a)s) - (b - a)\varphi(a + (b - a)s) = 0$, par le théorème fondamental ({{ar-tfa|Théorème fondamental}}) et la dérivée d'une composée ({{de-composee|Dérivée d'une composée}}).

      Elle est nulle en $0$, donc nulle ({{de-monotonie|Signe de la dérivée}}, (ii)), et sa valeur en $s = 1$ donne
      $$\int_a^b \varphi = (b - a)\int_0^1 \varphi\big(a + (b - a)u\big)\,du.$$

      *En $n$ variables.* Notons $\alpha_i(t) = a_i + (b_i - a_i)t$ et $\tilde g = g \circ \alpha_P$, continue sur $I^n$. Montrons par récurrence sur $j$ que
      $$\begin{aligned} &\tilde g_j(t_{j+1}, \dots, t_n) \\ &\quad = \frac{g_j\big(\alpha_{j+1}(t_{j+1}), \dots, \alpha_n(t_n)\big)}{\prod_{i \leqslant j}(b_i - a_i)}. \end{aligned}$$
      C'est clair pour $j = 0$. Le passage de $j - 1$ à $j$ est la formule en une variable, appliquée sur $[a_j, b_j]$ à la fonction $x \mapsto g_{j-1}\big(x, \alpha_{j+1}(t_{j+1}), \dots, \alpha_n(t_n)\big)$. Pour $j = n$, c'est l'égalité annoncée.
    remarques:
      - |
        Pour $g(x, y) = x + y$ sur $P = [0, 1] \times [0, 2]$, on trouve $g_1(y) = \frac12 + y$, puis $\int_P g = \int_0^2 \big(\frac12 + y\big)\,dy = 3$. Rapporté au volume $v(P) = 2$, c'est la valeur moyenne $\frac32$ de $g$ sur $P$, qui est ici sa valeur au centre $\big(\frac12, 1\big)$, puisque $g$ est affine.
      - |
        Pour les fonctions continues sur un pavé, l'intégrale itérée coïncide avec l'intégrale de Lebesgue, par le théorème de Fubini de la théorie de la mesure ({{m-fubini|Tonelli, Fubini}}). Ce théorème n'est pas un ancêtre de cette branche, et rien ici n'en dépend : la formule de Stokes ne demande que des fonctions continues sur un cube, que l'intégrale de Riemann suffit à traiter.
      - |
        L'erreur la plus répandue est d'appliquer la définition à une fonction qui n'est continue que sur une partie du pavé. Pour $g(x, y) = \frac{x - y}{(x + y)^3}$ sur $[0, 1]^2 \setminus \{(0, 0)\}$, qui n'est bornée sur aucun voisinage de l'origine, les intégrales successives ont encore un sens, la première pour $y > 0$, la seconde après prolongement par continuité en $0$, mais leur valeur dépend de l'ordre ; c'est l'objet de la première remarque du nœud {{dr-fubini|Fubini pour les fonctions continues}}.

  - id: dr-fubini
    etiquette: Fubini (fonctions continues)
    nature: théorème
    titre: Fubini pour les fonctions continues
    enonce: |
      (i) *Deux variables.* Si $h$ est continue sur $[\alpha, \beta] \times [\gamma, \delta]$, alors
      $$\begin{aligned} &\int_\gamma^\delta\Big(\int_\alpha^\beta h(s, t)\,ds\Big)dt \\ &\quad = \int_\alpha^\beta\Big(\int_\gamma^\delta h(s, t)\,dt\Big)ds. \end{aligned}$$

      (ii) *Ordre quelconque.* Soit $P$ un pavé de $\lex{n-uplet}{\mathbb R^n}$ et $g$ continue sur $P$. Pour toute bijection $\pi$ de $\{1, \dots, n\}$ sur lui-même, l'intégrale itérée obtenue en intégrant d'abord par rapport à $x_{\pi(1)}$, puis à $x_{\pi(2)}$, et ainsi de suite, est bien définie et égale à $\int_P g$.

      (iii) En particulier, pour $1 \leqslant i \leqslant n$, notons $P'_i = \prod_{l \neq i}[a_l, b_l]$, pavé de $\mathbb R^{n-1}$, $\iota_{i,t}(y)$ le point $(y_1, \dots, y_{i-1}, t, y_i, \dots, y_{n-1})$ de $\mathbb R^n$, obtenu en insérant $t$ en position $i$, et
      $$G_i(y) = \int_{a_i}^{b_i} g\big(\iota_{i,t}(y)\big)\,dt.$$
      Alors $G_i$ est continue sur $P'_i$, et $\int_P g = \int_{P'_i} G_i$ : on peut intégrer d'abord par rapport à la variable $x_i$.
    preuve: |
      (i) Pour $u \in [\alpha, \beta]$ et $t \in [\gamma, \delta]$, posons
      $$\begin{aligned} K(u, t) &= \int_\alpha^u h(s, t)\,ds, \\ H(s) &= \int_\gamma^\delta h(s, t)\,dt. \end{aligned}$$
      Pour $u > \alpha$, la fonction $t \mapsto K(u, t)$ est continue, par le nœud {{dr-iterees|Intégrales itérées}}, (i), appliqué sur $[\alpha, u] \times [\gamma, \delta]$ ; pour $u = \alpha$, elle est nulle. On peut donc poser $A(u) = \int_\gamma^\delta K(u, t)\,dt$, et l'on veut montrer que $A(\beta) = B(\beta)$, où $B(u) = \int_\alpha^u H$.

      *Dérivée de $B$.* $H$ est continue sur $[\alpha, \beta]$ (même nœud, (i)), et le théorème fondamental ({{ar-tfa|Théorème fondamental}}) donne $B' = H$.

      *Dérivée de $A$.* Soit $\varepsilon > 0$. La fonction $h$ est uniformément continue sur le compact $[\alpha, \beta] \times [\gamma, \delta]$ ({{me-heine|Théorème de Heine}}) : il existe $\eta > 0$ tel que $|h(\xi, t) - h(u, t)| < \varepsilon$ dès que $|\xi - u| < \eta$, quel que soit $t$.

      Pour $u$ et $u + s$ dans $[\alpha, \beta]$, avec $0 < |s| < \eta$, la relation de Chasles ({{ri-proprietes|Propriétés de l'intégrale}}, (v)) donne, pour tout $t$,
      $$\begin{aligned} &K(u + s, t) - K(u, t) - s\,h(u, t) \\ &\quad = \int_u^{u+s} \big(h(\xi, t) - h(u, t)\big)\,d\xi, \end{aligned}$$
      quantité majorée en valeur absolue par $|s|\,\varepsilon$ ({{ri-moyenne|Inégalité de la moyenne}}, (i)). En intégrant en $t$,
      $$\begin{aligned} &\big|A(u + s) - A(u) - s\,H(u)\big| \\ &\quad \leqslant (\delta - \gamma)\,|s|\,\varepsilon. \end{aligned}$$

      Ainsi $A$ est continue sur $[\alpha, \beta]$, et dérivable de dérivée $H(u)$ en tout point intérieur. La fonction $A - B$ est donc continue, de dérivée nulle sur $]\alpha, \beta[$, et nulle en $\alpha$ : elle est nulle ({{de-monotonie|Signe de la dérivée}}, (ii)), et $A(\beta) = B(\beta)$.

      (ii) *Définition.* À chaque étape, on intègre une fonction continue des variables restantes, qui décrivent un produit de segments, par rapport à l'une d'elles : la preuve du nœud {{dr-iterees|Intégrales itérées}}, (i), s'applique telle quelle, l'ordre des coordonnées ne jouant aucun rôle. Toutes les fonctions intermédiaires sont donc définies et continues.

      *Échange de deux intégrations consécutives.* Soient $\pi$ et $\pi'$ deux ordres qui ne diffèrent que par l'échange des positions $p$ et $p + 1$. Les $p - 1$ premières intégrations sont les mêmes, et fournissent une fonction continue $\varphi$ des variables restantes.

      Fixons toutes ces variables sauf $x_{\pi(p)}$ et $x_{\pi(p+1)}$ : par (i), intégrer $\varphi$ par rapport à l'une puis à l'autre, ou dans l'ordre inverse, donne le même nombre. Les deux ordres produisent donc la même fonction des variables non encore intégrées, et les intégrations suivantes, communes, donnent le même résultat.

      *Conclusion.* On passe de l'ordre $\pi$ à l'ordre naturel par un nombre fini de tels échanges : on amène d'abord la variable $x_1$ en première position en l'échangeant successivement avec celles qui la précèdent, puis $x_2$ en deuxième position, et ainsi de suite. L'intégrale ne change à aucune étape.

      (iii) L'ordre $(i, 1, \dots, i - 1, i + 1, \dots, n)$ commence par l'intégration en $x_i$, qui produit la fonction $G_i$ des variables restantes, rangées dans l'ordre et renommées $y_1, \dots, y_{n-1}$, continue par {{dr-iterees|Intégrales itérées}}, (i). Les intégrations suivantes calculent $\int_{P'_i} G_i$, et (ii) conclut.
    remarques:
      - |
        La continuité sur le pavé fermé ne peut pas être omise. Pour $g(x, y) = \frac{x - y}{(x + y)^3}$ sur $[0, 1]^2 \setminus \{(0, 0)\}$, on a, pour $y > 0$,
        $$\int_0^1 \frac{x - y}{(x + y)^3}\,dx = -\frac{1}{(1 + y)^2},$$
        comme on le vérifie en dérivant $x \mapsto -\frac{x}{(x + y)^2}$. En intégrant ensuite en $y$, on trouve $-\frac12$ ; dans l'autre ordre, par symétrie, $+\frac12$.

        La fonction n'est pas définie à l'origine et n'est bornée sur aucun voisinage de l'origine : l'hypothèse de (i) n'est pas satisfaite, et c'est le théorème de Heine qui manque à la démonstration. Le résultat est cohérent avec la symétrie : échanger $x$ et $y$ change $g$ en $-g$ et échange les deux ordres d'intégration. Si l'interversion était permise, les deux valeurs, opposées l'une de l'autre, seraient égales, donc nulles.
      - |
        La démonstration de (i) dérive par rapport à la borne : c'est un argument voisin de celui qui, au nœud {{gd-schwarz|Schwarz, intégrales à paramètre}}, établit la dérivation sous l'intégrale, mais sur un segment fermé plutôt que sur un ouvert, ce qui permet d'appliquer directement le théorème de Heine sur le compact $[\alpha, \beta] \times [\gamma, \delta]$.

  - id: dr-cubes
    etiquette: Cubes singuliers
    nature: définition
    titre: Cubes singuliers lisses, chaînes cubiques et leur bord
    texte: |
      Soit $U$ un ouvert de $\lex{n-uplet}{\mathbb R^n}$ et $k \in \lex{ensemble-entiers-naturels}{\mathbb N}$. Un [[cube-singulier|cube singulier lisse]] de dimension $k$ de $U$ est une application $c : I^k \to U$ qui est la restriction d'une application $\tilde c : W \to U$ de classe $C^\infty$, définie sur un ouvert $W$ de $\mathbb R^k$ contenant $I^k$ ; on dit que $\tilde c$ **prolonge** $c$. Pour $k = 0$, c'est un point de $U$.

      Le mot « singulier » signifie qu'on n'exige de $c$ ni l'injectivité ni une différentielle de rang $k$ : un cube singulier peut écraser $I^k$ sur une courbe, ou sur un point.

      Le groupe des **chaînes cubiques** $Q_k(U)$ est le groupe abélien libre sur l'ensemble des cubes singuliers lisses de dimension $k$ ({{h-complexes|Complexes de chaînes}}) ; on pose $Q_k(U) = 0$ pour $k < 0$.

      Pour $k \geqslant 1$, $1 \leqslant i \leqslant k$ et $\varepsilon \in \{0, 1\}$, l'application affine $\iota_{i,\varepsilon} : \mathbb R^{k-1} \to \mathbb R^k$,
      $$\begin{aligned} &\iota_{i,\varepsilon}(t_1, \dots, t_{k-1}) \\ &\quad = (t_1, \dots, t_{i-1}, \varepsilon, t_i, \dots, t_{k-1}), \end{aligned}$$
      insère $\varepsilon$ en position $i$ ; elle envoie $I^{k-1}$ sur la face $\{t_i = \varepsilon\}$ de $I^k$.

      La **face** $(i, \varepsilon)$ de $c$ est $c_{i,\varepsilon} = c \circ \iota_{i,\varepsilon}$, et le **bord** de $c$ est
      $$\partial c = \sum_{i=1}^k \sum_{\varepsilon = 0}^{1} (-1)^{i+\varepsilon}\, c_{i,\varepsilon}.$$
      Il se prolonge en un morphisme $\partial : Q_k(U) \to Q_{k-1}(U)$, et l'on pose $\partial = 0$ sur $Q_0(U)$.
    enonce: |
      (i) Les faces d'un cube singulier lisse sont des cubes singuliers lisses. Pour $1 \leqslant i \leqslant j \leqslant k - 1$ et $\varepsilon, \eta \in \{0, 1\}$,
      $$\iota_{i,\varepsilon} \circ \iota_{j,\eta} = \iota_{j+1,\eta} \circ \iota_{i,\varepsilon}.$$

      (ii) $\partial \circ \partial = 0$ : les $Q_k(U)$ forment un [[complexe-chaines|complexe de chaînes]].

      (iii) Si $\varphi : U \to V$ est de classe $C^\infty$, où $V$ est un ouvert de $\mathbb R^m$, la formule $\varphi_\#(c) = \varphi \circ c$ définit des morphismes $Q_k(U) \to Q_k(V)$ qui commutent au bord.

      En particulier, si $\tilde c : W \to U$ prolonge $c$ et si $\mathbf 1_k$ désigne le cube de $W$ donné par l'inclusion de $I^k$, alors $c = \tilde c_\#(\mathbf 1_k)$ et $\partial c = \tilde c_\#(\partial \mathbf 1_k)$.
    preuve: |
      (i) Si $\tilde c : W \to U$ prolonge $c$, l'ouvert $\iota_{i,\varepsilon}^{-1}(W)$ de $\mathbb R^{k-1}$ contient $I^{k-1}$, et $\tilde c \circ \iota_{i,\varepsilon}$, composée d'une application affine et d'une application de classe $C^\infty$, est de classe $C^\infty$ ({{gd-classe-ck|Classe Cᵏ}}, (ii) et (iii)) ; elle prolonge $c_{i,\varepsilon}$.

      Les deux membres de l'identité envoient $(t_1, \dots, t_{k-2})$ sur le point qui a $\varepsilon$ en position $i$, $\eta$ en position $j + 1$, et les $t_l$ dans l'ordre aux autres places. À gauche, $\iota_{j,\eta}$ place $\eta$ en position $j$, puis $\iota_{i,\varepsilon}$ insère $\varepsilon$ en position $i \leqslant j$, ce qui décale $\eta$ en position $j + 1$. À droite, $\iota_{i,\varepsilon}$ place $\varepsilon$ en position $i$, puis $\iota_{j+1,\eta}$ insère $\eta$ en position $j + 1 > i$, sans déplacer $\varepsilon$.

      (ii) Pour $k \leqslant 1$, $\partial\partial c$ appartient à $Q_{k-2}(U) = 0$. Pour $k \geqslant 2$,
      $$\begin{aligned} &\partial\partial c = \sum_{i=1}^{k}\sum_{j=1}^{k-1}\sum_{\varepsilon, \eta} \\ &\quad (-1)^{i+\varepsilon+j+\eta}\, c \circ \iota_{i,\varepsilon} \circ \iota_{j,\eta}. \end{aligned}$$

      Séparons les termes où $i \leqslant j$ de ceux où $i > j$. L'application $(i, \varepsilon, j, \eta) \mapsto (j + 1, \eta, i, \varepsilon)$ est une bijection des premiers sur les seconds, de réciproque $(i', \varepsilon', j', \eta') \mapsto (j', \eta', i' - 1, \varepsilon')$.

      Par (i), elle associe à chaque terme un terme de même cube, $c \circ \iota_{j+1,\eta} \circ \iota_{i,\varepsilon} = c \circ \iota_{i,\varepsilon} \circ \iota_{j,\eta}$, et de signe $(-1)^{(j+1)+\eta+i+\varepsilon}$, opposé. Les termes se compensent deux à deux, et $\partial\partial = 0$ sur les chaînes par linéarité.

      (iii) Si $\tilde c$ prolonge $c$, $\varphi \circ \tilde c$ prolonge $\varphi \circ c$ et est de classe $C^\infty$ ({{gd-classe-ck|Classe Cᵏ}}, (iii)) ; les faces de $\varphi \circ c$ sont les $\varphi \circ c_{i,\varepsilon}$. On prolonge $\varphi_\#$ en un morphisme ({{h-complexes|Complexes de chaînes}}, (i)), qui commute au bord, puisque c'est le cas sur chaque cube.

      Enfin $\mathbf 1_k$ est prolongé par l'identité de $W$, ses faces sont les $\iota_{i,\varepsilon}$ restreintes à $I^{k-1}$, et $\tilde c \circ \iota_{i,\varepsilon} = c_{i,\varepsilon}$ sur $I^{k-1}$.
    remarques:
      - |
        Pour $k = 2$, le bord s'écrit $\partial c = c_{2,0} + c_{1,1} - c_{2,1} - c_{1,0}$ : le côté du bas et celui de droite, parcourus dans le sens des coordonnées croissantes, puis le haut et la gauche, affectés du signe moins, c'est-à-dire parcourus en sens inverse. On retrouve le contour du carré dans le sens direct, avec les mêmes signes que les quatre chemins $\beta + \rho - \theta - \lambda$ du nœud {{dr-homotopie|Invariance par homotopie}}.

        ```schema dr-cubes
        Chaque côté du carré $I^2$ est paramétré par $I^1$ dans le sens des coordonnées croissantes (flèches grises) et porte le signe $(-1)^{i+\varepsilon}$. Les deux côtés de signe moins, le haut et la gauche, sont parcourus à rebours : le bord $\partial\mathbf 1_2$, en rouge, fait le tour du carré dans le sens direct.
        ```
      - |
        En dimension $k$, le signe $(-1)^{i+\varepsilon}$ est exactement celui qui oriente chaque face par la normale sortante. La normale sortante à la face $\{t_i = \varepsilon\}$ est $\nu = (-1)^{\varepsilon+1}e_i$, et la paramétrisation $\iota_{i,\varepsilon}$ envoie la base canonique de $\mathbb R^{k-1}$ sur les $e_l$, $l \neq i$, dans l'ordre. Le déterminant de la famille $(\nu, e_1, \dots, e_{i-1}, e_{i+1}, \dots, e_k)$ vaut $(-1)^{\varepsilon+1}(-1)^{i-1} = (-1)^{i+\varepsilon}$, puisque ramener $e_i$ en tête coûte $i - 1$ transpositions.

        ```schema dr-cubes-2
        Les six faces du cube $I^3$, avec leur normale sortante et le signe $(-1)^{i+\varepsilon}$ qu'elles portent dans $\partial\mathbf 1_3$. Une face de signe $+$ est paramétrée dans le sens que fixe la normale sortante, une face de signe $-$ dans le sens contraire : le bord du cube est sa surface orientée vers l'extérieur. La face $t_2 = 0$, tournée vers le lecteur, est grisée.
        ```
      - |
        L'erreur la plus tentante est de croire que l'homologie du complexe $Q$ est l'homologie singulière. Pour $U = \mathbb R^0$, réduit à un point, il y a un seul cube $c_k$ de chaque dimension, constant, et ses faces $(i, 0)$ et $(i, 1)$ sont toutes deux le cube constant de dimension $k - 1$, avec des signes opposés : $\partial c_k = 0$. L'homologie de ce complexe vaut donc $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ en chaque degré, alors que celle d'un point est nulle en degré $k \geqslant 1$ ({{h-degre0|Degré 0, point}}).

        On corrige ce défaut en quotientant par les cubes **dégénérés**, qui ne dépendent pas de l'une des variables ; on retrouve alors l'homologie singulière, ce qui est admis ici, la preuve demandant de passer des cubes lisses aux cubes seulement continus, puis de comparer cubes et simplexes. L'intégration, seule utile ici, ne voit pas ce défaut : elle est nulle sur les cubes dégénérés ({{dr-integrale-cubes|Intégrale sur une chaîne}}, (v)).

  - id: dr-integrale-cubes
    etiquette: Intégrale sur une chaîne
    nature: proposition
    titre: Intégrale d'une forme sur une chaîne cubique
    texte: |
      Soit $U$ un ouvert de $\lex{n-uplet}{\mathbb R^n}$, $\omega$ une [[forme-differentielle|forme différentielle]] de degré $k \geqslant 1$ sur $U$, et $c$ un cube singulier lisse de dimension $k$ de $U$, prolongé par $\tilde c : W \to U$ ({{dr-cubes|Cubes singuliers}}).

      L'image réciproque $\tilde c^*\omega$ ({{gd-formes|Formes différentielles}}) est une forme de degré $k$ sur l'ouvert $W$ de $\mathbb R^k$ ; elle s'écrit $g\,dt_1 \wedge \cdots \wedge dt_k$, avec $g$ de classe $C^\infty$ sur $W$. On pose
      $$\int_c \omega = \int_{I^k} g,$$
      intégrale itérée du nœud {{dr-iterees|Intégrales itérées}}.

      Pour $k = 0$, $\omega$ est une fonction $f$, $c$ est un point, et $\int_c f = f(c)$. On prolonge $c \mapsto \int_c \omega$ en un morphisme $Q_k(U) \to \lex{ensemble-reels}{\mathbb R}$, noté $z \mapsto \int_z \omega$ ({{h-complexes|Complexes de chaînes}}, (i)).
    enonce: |
      (i) Si $\omega = \sum_J a_J\,dx_J$, la somme portant sur les suites $J = (j_1 < \cdots < j_k)$,
      $$g = \sum_J (a_J \circ \tilde c)\,\det\big(\partial_r \tilde c_{j_s}\big)_{1 \leqslant s, r \leqslant k}.$$
      La restriction de $g$ à $I^k$ ne dépend pas du prolongement $\tilde c$ : l'intégrale est bien définie.

      (ii) $\int_z \omega$ est linéaire en $\omega$ et en $z$.

      (iii) Pour $k = 1$, $\int_c \omega = \int_0^1 \omega_{c(t)}\big(c'(t)\big)\,dt$ : c'est l'intégrale du nœud {{gd-integrale-curviligne|Intégrale d'une 1-forme}} le long du chemin $c$, de classe $C^1$.

      (iv) Si $\varphi : U \to V$ est de classe $C^\infty$, où $V$ est un ouvert de $\mathbb R^m$, et si $\eta$ est une forme de degré $k$ sur $V$, alors
      $$\int_{\varphi_\# z} \eta = \int_z \varphi^*\eta$$
      pour toute chaîne $z \in Q_k(U)$.

      (v) Si $c$ est **dégénéré**, c'est-à-dire ne dépend pas de l'une des variables $t_i$ sur $I^k$, alors $\int_c \omega = 0$.
    preuve: |
      (i) Par {{gd-formes|Formes différentielles}}, (iii), $\tilde c^*(a_J\,dx_J) = (a_J \circ \tilde c)\,d\tilde c_{j_1} \wedge \cdots \wedge d\tilde c_{j_k}$, avec $d\tilde c_j = \sum_r \partial_r \tilde c_j\,dt_r$. Le coefficient de $dt_1 \wedge \cdots \wedge dt_k$ est la valeur de cette forme sur la base canonique ({{v-algebre-exterieure|Algèbre extérieure}}, (i)), qui est le déterminant annoncé (même nœud, (ii)).

      *Indépendance.* En un point $x$ du cube ouvert $]0, 1[^k$, la dérivée partielle $\partial_r \tilde c(x)$ est la limite de $\frac{c(x + se_r) - c(x)}{s}$ quand $s \to 0$, et $x + se_r$ reste dans $]0, 1[^k$ pour $s$ petit : elle ne dépend que de $c$. Il en va donc de même de $g(x)$.

      Tout point $p$ de $I^k$ est limite de la suite $p_m = \big(1 - \frac1m\big)p + \frac1{2m}(1, \dots, 1)$, dont les termes, pour $m \geqslant 2$, ont leurs coordonnées dans $\big[\frac1{2m}, 1 - \frac1{2m}\big]$, donc sont dans $]0, 1[^k$. Par continuité de $g$, $g(p)$ est la limite des $g(p_m)$ et ne dépend que de $c$. L'intégrale itérée ne dépendant que des valeurs sur $I^k$ ({{dr-iterees|Intégrales itérées}}, (i)), elle est bien définie.

      (ii) L'image réciproque $\tilde c^*$ est linéaire, ainsi que l'intégrale itérée ({{dr-iterees|Intégrales itérées}}, (ii)) ; la linéarité en $z$ vient de la définition.

      (iii) Pour $k = 1$, (i) donne $g(t) = \sum_j a_j(c(t))\,c_j'(t) = \omega_{c(t)}(c'(t))$ pour $t \in [0, 1]$, et $c$, restriction d'une application $C^\infty$, est de classe $C^1$. L'intégrale itérée sur $I^1$ est l'intégrale de Riemann sur $[0, 1]$.

      (iv) Pour un cube $c$ prolongé par $\tilde c$, $\varphi \circ \tilde c$ prolonge $\varphi \circ c$, et $(\varphi \circ \tilde c)^*\eta = \tilde c^*(\varphi^*\eta)$ ({{gd-formes|Formes différentielles}}, (iii)) : les deux intégrales ont le même coefficient $g$. Pour $k = 0$, $\eta(\varphi(c)) = (\varphi^*\eta)(c)$, puisque $\varphi^*\eta = \eta \circ \varphi$. On conclut par linéarité.

      (v) Si $c$ ne dépend pas de $t_i$, la dérivée partielle $\partial_i \tilde c$ est nulle sur $]0, 1[^k$, par le calcul de l'indépendance. La colonne d'indice $i$ de chaque déterminant de (i) est nulle : $g = 0$ sur $]0, 1[^k$, donc sur $I^k$ par continuité.
    remarques:
      - |
        L'intégrale dépend de la paramétrisation par son orientation. Remplacer $c$ par $c \circ \rho$, où $\rho(t) = (1 - t_1, t_2, \dots, t_k)$, change $\tilde c^*\omega$ en $\rho^*(\tilde c^*\omega)$, dont le coefficient est $-g \circ \rho$. Dans l'intégration en $t_1$, qui vient en premier, $\int_0^1 \varphi(1 - u)\,du = \int_0^1 \varphi$ par le même argument qu'au nœud {{dr-iterees|Intégrales itérées}}, (iii) : l'intégrale change de signe.

        En revanche, l'invariance par un difféomorphisme quelconque $\rho$ de $I^k$ sur lui-même, de jacobien positif, demande la formule du changement de variables ({{cv-changement|Changement de variables}}), qui n'est pas un ancêtre de cette branche ; elle est admise ici pour $k \geqslant 2$. Pour $k = 1$, c'est la règle de substitution, qui découle du théorème fondamental.
      - |
        Pour une forme **fermée** de degré $1$ et un cube lisse $c$ de dimension $1$, l'intégrale de (iii) est aussi celle du nœud {{dr-integrale|Intégrale le long d'un chemin continu}}, (ii) : les deux constructions s'accordent sur les chemins lisses.

        Elles ne font pas le même travail. Celle du nœud {{dr-chaines|Intégration sur les chaînes}} intègre des formes fermées sur des chemins seulement continus, grâce aux primitives locales ; celle-ci intègre des formes quelconques, de tout degré, mais seulement sur des cubes lisses, puisqu'elle dérive $\tilde c$. L'erreur à éviter est de chercher à intégrer une forme qui n'est pas fermée le long d'un chemin seulement continu : aucune des deux définitions ne s'applique.
      - |
        Le point (v) traduit qu'un cube dégénéré n'a pas de volume de dimension $k$ : son image est balayée par une famille de dimension au plus $k - 1$, et la forme $\tilde c^*\omega$, de degré $k$, s'y annule.

  - id: dr-stokes
    etiquette: Formule de Stokes
    nature: théorème
    titre: Formule de Stokes pour les chaînes cubiques
    enonce: |
      Soit $U$ un ouvert de $\lex{n-uplet}{\mathbb R^n}$, $k \geqslant 1$ et $\omega$ une forme différentielle de degré $k - 1$ sur $U$. Pour toute chaîne cubique $z \in Q_k(U)$,
      $$\int_z d\omega = \int_{\partial z} \omega.$$
      C'est la [[formule-stokes|formule de Stokes]]. Pour $k = 1$ et un cube $c$, elle s'écrit $\int_c df = f(c(1)) - f(c(0))$.
    preuve: |
      *Le cube unité.* Soit $W$ un ouvert de $\mathbb R^k$ contenant $I^k$, $\eta$ une forme de degré $k - 1$ sur $W$, et $\mathbf 1_k$ le cube de $W$ donné par l'inclusion de $I^k$ ({{dr-cubes|Cubes singuliers}}). Montrons que $\int_{\mathbf 1_k} d\eta = \int_{\partial \mathbf 1_k} \eta$.

      Par {{v-algebre-exterieure|Algèbre extérieure}}, (i), $\eta$ s'écrit $\sum_{i=1}^k f_i\,dx_1 \wedge \cdots \wedge \widehat{dx_i} \wedge \cdots \wedge dx_k$, où le chapeau signale le facteur omis, avec des $f_i$ de classe $C^\infty$ sur $W$. Les deux membres étant linéaires en $\eta$ ({{gd-formes|Formes différentielles}}, (i), et {{dr-integrale-cubes|Intégrale sur une chaîne}}, (ii)), il suffit de traiter $\eta = f\,dx_1 \wedge \cdots \wedge \widehat{dx_i} \wedge \cdots \wedge dx_k$.

      *Premier membre.* Dans $d\eta = \sum_j \partial_j f\,dx_j \wedge dx_1 \wedge \cdots \wedge \widehat{dx_i} \wedge \cdots \wedge dx_k$, seul le terme $j = i$ subsiste, les autres contenant deux fois le même $dx_j$. Ramener $dx_i$ à sa place coûte $i - 1$ transpositions :
      $$d\eta = (-1)^{i-1}\,\partial_i f\,dx_1 \wedge \cdots \wedge dx_k.$$

      L'image réciproque par l'inclusion ne change pas le coefficient, et le nœud {{dr-fubini|Fubini pour les fonctions continues}}, (iii), permet d'intégrer d'abord en $x_i$.

      Pour $y$ fixé, la fonction $t \mapsto \int_0^t \partial_i f(\iota_{i,s}(y))\,ds - f(\iota_{i,t}(y))$, avec la notation $\iota_{i,s}(y)$ du nœud {{dr-fubini|Fubini pour les fonctions continues}}, (iii), a une dérivée nulle ({{ar-tfa|Théorème fondamental}}), donc est constante ({{de-monotonie|Signe de la dérivée}}, (ii)). Ainsi
      $$\begin{aligned} &\int_0^1 \partial_i f\big(\iota_{i,s}(y)\big)\,ds \\ &\quad = f\big(\iota_{i,1}(y)\big) - f\big(\iota_{i,0}(y)\big), \end{aligned}$$
      d'où
      $$\int_{\mathbf 1_k} d\eta = (-1)^{i-1}\int_{I^{k-1}} \big(f \circ \iota_{i,1} - f \circ \iota_{i,0}\big).$$

      *Second membre.* La face $(j, \varepsilon)$ de $\mathbf 1_k$ est prolongée par $\iota_{j,\varepsilon}$, et $\iota_{j,\varepsilon}^*(dx_l) = d(\iota_{j,\varepsilon})_l$ ({{gd-formes|Formes différentielles}}, (iii)) vaut $dt_l$ si $l < j$, $0$ si $l = j$, et $dt_{l-1}$ si $l > j$.

      Si $j \neq i$, le facteur $dx_j$ figure dans $\eta$, dont l'image réciproque est donc nulle. Si $j = i$, il ne reste que
      $$\iota_{i,\varepsilon}^*\eta = (f \circ \iota_{i,\varepsilon})\,dt_1 \wedge \cdots \wedge dt_{k-1}.$$
      Par conséquent
      $$\begin{aligned} \int_{\partial\mathbf 1_k} \eta &= \sum_{\varepsilon = 0}^1 (-1)^{i+\varepsilon}\int_{I^{k-1}} f \circ \iota_{i,\varepsilon} \\ &= (-1)^{i+1}\int_{I^{k-1}} \big(f \circ \iota_{i,1} - f \circ \iota_{i,0}\big), \end{aligned}$$
      qui est le premier membre, puisque $(-1)^{i+1} = (-1)^{i-1}$. Pour $k = 1$, $\eta = f$ est une fonction, les faces sont les points $0$ et $1$, et les deux membres valent $f(1) - f(0)$.

      *Cas général.* Soit $c$ un cube singulier lisse de dimension $k$ de $U$, prolongé par $\tilde c : W \to U$. Par {{dr-cubes|Cubes singuliers}}, (iii), $c = \tilde c_\#(\mathbf 1_k)$ et $\partial c = \tilde c_\#(\partial \mathbf 1_k)$.

      Par {{dr-integrale-cubes|Intégrale sur une chaîne}}, (iv), et la commutation $\tilde c^* d = d\,\tilde c^*$ ({{gd-formes|Formes différentielles}}, (iii)),
      $$\begin{aligned} \int_c d\omega &= \int_{\mathbf 1_k} \tilde c^*(d\omega) = \int_{\mathbf 1_k} d(\tilde c^*\omega) \\ &= \int_{\partial\mathbf 1_k} \tilde c^*\omega = \int_{\partial c} \omega. \end{aligned}$$
      Les deux membres de la formule sont additifs en $z$, et $\partial$ est un morphisme : elle vaut pour toutes les chaînes.

      Aucun choix n'intervient.
    remarques:
      - |
        Le cube singulier $c(u, v, w) = (u, uv, uvw)$ de $\mathbb R^3$ envoie $I^3$ sur le tétraèdre $\{0 \leqslant z \leqslant y \leqslant x \leqslant 1\}$ ; deux de ses faces sont dégénérées, la face $u = 0$ écrasée sur l'origine et la face $v = 0$ sur un segment de l'axe des $x$.

        Pour $\omega = x\,dy \wedge dz$, on a $d\omega = dx \wedge dy \wedge dz$, et (i) du nœud {{dr-integrale-cubes|Intégrale sur une chaîne}} donne $g = \det dc = u^2v$, d'où $\int_c d\omega = \int_{I^3} u^2v = \frac16$, qui est le volume du tétraèdre.

        Au bord, seules contribuent la face $u = 1$, partie du plan $x = 1$, pour $+\frac12$, et la face $v = 1$, partie du plan $y = x$, pour $-\frac13$ ; les faces $w = 0$ et $w = 1$, contenues dans les plans $z = 0$ et $z = y$, où $dy \wedge dz$ a une image réciproque nulle, et les deux faces dégénérées donnent $0$. On retrouve bien $\frac12 - \frac13 = \frac16$ : c'est le flux du champ $(x, 0, 0)$ à travers la surface du tétraèdre, qui entre par la face oblique et sort par la face $x = 1$. Ces nombres ont été vérifiés par un calcul formel.

        ```schema dr-stokes
        Le tétraèdre image du cube par $c(u, v, w) = (u, uv, uvw)$. Les faces $x = 1$, en bleu, et $y = x$, en vert, sont les seules qui portent un flux du champ $(x, 0, 0)$ : $+\frac12$ et $-\frac13$. La face $u = 0$ du cube est écrasée sur l'origine, la face $v = 0$ sur le segment rouge de l'axe des $x$ ; ces faces dégénérées ne contribuent pas.
        ```
      - |
        La démonstration ne contient qu'une idée : sur le cube unité, $d\eta$ ne fait intervenir que la dérivée de chaque coefficient dans la direction manquante, et le théorème fondamental de l'analyse, appliqué dans cette direction après Fubini, transforme son intégrale en une différence entre deux faces opposées. Le cas d'un cube singulier s'y ramène par image réciproque, parce que $d$ commute à $\tilde c^*$. C'est la présentation de Spivak (*Calculus on Manifolds*, 1965, chapitre 4), qui intègre sur des cubes plutôt que sur des simplexes, parce que Fubini s'y applique directement.
      - |
        La formule porte le nom de Stokes, qui l'a posée en février 1854 à l'examen du prix Smith de Cambridge ; elle figurait dans une lettre de William Thomson à Stokes du 2 juillet 1850. Volterra (1889) puis Poincaré (1899) ont énoncé la forme générale en dimension quelconque, et Élie Cartan l'a écrite avec les formes différentielles extérieures (*Les systèmes différentiels extérieurs et leurs applications géométriques*, 1945). Sources : V. J. Katz, *The History of Stokes' Theorem*, Mathematics Magazine 52 (1979), n° 3.
      - |
        La forme classique de la formule porte sur une variété compacte orientée à bord $M$ de dimension $k$ et une forme $\omega$ de degré $k - 1$ : $\int_M d\omega = \int_{\partial M} \omega$. Elle n'est pas démontrée dans l'atlas, et trois choses manquent pour l'obtenir à partir d'ici.

        La première est la notion même de variété à bord, modelée sur le demi-espace $\{x_k \geqslant 0\}$, avec l'orientation induite sur le bord ; la géométrie différentielle ({{gd-varietes|Variétés}}) ne définit que des variétés sans bord.

        La deuxième est l'intégrale d'une forme de degré maximal sur une variété orientée : définie carte par carte, elle ne dépend pas des cartes grâce à la formule du changement de variables pour un jacobien positif ({{cv-changement|Changement de variables}}), qui n'est pas un ancêtre de cette branche.

        La troisième est une partition de l'unité subordonnée à un atlas, qui se construit comme celle du nœud {{dr-partition|Partition de l'unité}}, faite ici pour les ouverts de $\mathbb R^n$.

        Avec ces outils, la preuve se ramène, carte par carte, au calcul fait ici sur le cube unité : pour une forme à support compact dans un demi-espace, le théorème fondamental appliqué dans la direction $x_k$ ne laisse que l'intégrale sur l'hyperplan $x_k = 0$.

  - id: dr-fermees
    etiquette: Formes exactes et cycles
    nature: corollaire
    titre: Formes exactes sur les cycles, critère de fermeture
    enonce: |
      Soit $U$ un ouvert de $\lex{n-uplet}{\mathbb R^n}$ et $\omega$ une forme différentielle de degré $k \geqslant 0$ sur $U$.

      (i) Si $k \geqslant 1$ et si $\omega = d\eta$ est exacte, alors $\int_z \omega = 0$ pour tout cycle $z \in Q_k(U)$, c'est-à-dire toute chaîne de bord nul. En degré $1$, un cube $c$ de dimension $1$ tel que $c(0) = c(1)$, lacet lisse, est un cycle, et l'intégrale d'une forme exacte le long d'un tel lacet est nulle.

      (ii) $\omega$ est fermée si et seulement si $\int_{\partial c} \omega = 0$ pour tout cube singulier lisse $c$ de dimension $k + 1$ de $U$.

      (iii) Plus précisément, écrivons $d\omega = \sum_J b_J\,dx_J$. Soit $x \in U$, $J = (j_0 < \cdots < j_k)$, et, pour $r > 0$ assez petit, $c_r$ le cube $t \mapsto x + r\sum_{l=0}^{k} t_{l+1}\,e_{j_l}$, de côté $r$, construit sur les directions de $J$. Alors
      $$b_J(x) = \lim_{r \to 0}\ \frac{1}{r^{k+1}}\int_{\partial c_r} \omega.$$
    preuve: |
      (i) Par la formule de Stokes ({{dr-stokes|Formule de Stokes}}), $\int_z d\eta = \int_{\partial z} \eta = 0$, puisque $\partial z = 0$. Pour un cube $c$ de dimension $1$, $\partial c = c(1) - c(0)$, nul si $c(0) = c(1)$.

      (iii) Soit $r_0 > 0$ tel que $B_\infty(x, r_0) \subset U$. Pour $0 < r < r_0$, l'application affine $\tilde c_r(t) = x + r\sum_l t_{l+1} e_{j_l}$, de classe $C^\infty$ sur $\mathbb R^{k+1}$, envoie $I^{k+1}$ dans $B_\infty(x, r_0)$, puisque les coordonnées de $\tilde c_r(t) - x$ sont dans $[0, r]$ ; sa restriction à l'ouvert $\tilde c_r^{-1}(U)$, qui contient $I^{k+1}$, prolonge $c_r$.

      On a $\tilde c_r^*(dx_{j_l}) = r\,dt_{l+1}$, et $\tilde c_r^*(dx_j) = 0$ si $j$ n'est pas dans $J$ ({{gd-formes|Formes différentielles}}, (iii)). Toute suite $J' \neq J$ de $k + 1$ indices contient un indice hors de $J$, de sorte que
      $$\tilde c_r^*(d\omega) = r^{k+1}\,(b_J \circ \tilde c_r)\,dt_1 \wedge \cdots \wedge dt_{k+1}.$$

      Soit $\varepsilon > 0$, et $\rho > 0$ tel que $|b_J(y) - b_J(x)| < \varepsilon$ pour $\|y - x\|_\infty < \rho$. Pour $r < \min(r_0, \rho)$, l'encadrement du nœud {{dr-iterees|Intégrales itérées}}, (ii), donne
      $$\begin{aligned} &\Big|\frac{1}{r^{k+1}}\int_{c_r} d\omega - b_J(x)\Big| \\ &\quad = \Big|\int_{I^{k+1}} \big(b_J \circ \tilde c_r - b_J(x)\big)\Big| \leqslant \varepsilon. \end{aligned}$$
      La formule de Stokes remplace $\int_{c_r} d\omega$ par $\int_{\partial c_r} \omega$.

      (ii) Si $\omega$ est fermée, $\int_{\partial c} \omega = \int_c d\omega = 0$ par la formule de Stokes. Réciproquement, si toutes ces intégrales sont nulles, (iii) donne $b_J(x) = 0$ pour tout $J$ et tout $x$ : $d\omega = 0$.
    remarques:
      - |
        Pour $\omega = x^2\,dy$ sur $\mathbb R^2$, on a $d\omega = 2x\,dx \wedge dy$. Au point $(1, 0)$, le carré $c_r(t) = (1 + rt_1, rt_2)$ donne $\int_{\partial c_r} \omega = r\big((1 + r)^2 - 1\big) = r^2(2 + r)$, seuls les côtés verticaux contribuant ; divisé par $r^2$, cela tend vers $2$, coefficient de $d\omega$ en ce point.

        Le point (iii) donne ainsi un sens géométrique à la différentielle extérieure, sans dériver les coefficients : $d\omega$ mesure, par unité de volume, l'intégrale de $\omega$ sur le bord d'un petit cube. En dimension $2$, c'est la circulation par unité d'aire, que la physique appelle rotationnel.
      - |
        En degré $1$, le point (i) redonne la nullité de l'intégrale d'une forme exacte sur un lacet ({{gd-integrale-curviligne|Intégrale d'une 1-forme}}, (i)) ; la formule $\int_c df = f(c(1)) - f(c(0))$ elle-même est le cas $k = 1$ de la formule de Stokes. Le point (ii), pour un cube $c$ de dimension $2$, dit que l'intégrale d'une forme fermée sur $\partial c = \beta + \rho - \theta - \lambda$ est nulle. C'est le nœud {{dr-homotopie|Invariance par homotopie}}, (i), dans le cas lisse.

        Le nœud {{dr-homotopie|Invariance par homotopie}} va plus loin d'un côté, puisqu'il ne demande à l'homotopie que d'être continue ; la formule de Stokes va plus loin de l'autre, puisqu'elle s'applique à toute forme et donne la valeur $\int_c d\omega$ lorsque la forme n'est pas fermée.
      - |
        Le piège est de voir dans $\partial \circ \partial = 0$ une seconde démonstration de $d \circ d = 0$. Pour toute chaîne $c$, la formule de Stokes donne bien $\int_c d(d\eta) = \int_{\partial\partial c} \eta = 0$, d'où $d(d\eta) = 0$ par (ii) ; mais la démonstration de la formule utilise la commutation $\tilde c^* d = d\,\tilde c^*$, qui repose elle-même sur $d \circ d = 0$ ({{gd-formes|Formes différentielles}}, (iii)). Les deux identités sont duales l'une de l'autre par l'intégration ; aucune ne démontre l'autre ici.
      - |
        Par (ii) et la formule de Stokes, l'intégrale d'une forme fermée de degré $k$ est nulle sur les bords, et l'intégrale sur un cycle ne dépend que de sa classe modulo les bords : on obtient, comme en degré $1$ au nœud {{dr-chaines|Intégration sur les chaînes}}, une application de $\lex{cohomologie-de-rham}{H^k}(U)$ dans le dual de l'homologie du complexe $Q$. Que cette application soit un isomorphisme en tout degré, une fois les cubes dégénérés quotientés, est une forme du théorème de de Rham. C'est sa forme simpliciale qui est démontrée en tout degré, au chapitre {{derham-tout-degre|Théorème de de Rham en tout degré}}, avec des simplexes lisses que l'on intègre en les paramétrant par des cubes ; la forme cubique, avec le complexe $Q$ quotienté par les cubes dégénérés, n'est pas démontrée.

  - id: dr-green
    etiquette: Green-Riemann, divergence
    nature: corollaire
    titre: Formule de Green-Riemann et théorème de la divergence
    enonce: |
      (i) *Green-Riemann sur un rectangle.* Soit $R = [a_1, b_1] \times [a_2, b_2]$ et $P$, $Q$ deux fonctions de classe $C^\infty$ sur un ouvert de $\lex{n-uplet}{\mathbb R^2}$ contenant $R$. Alors
      $$\begin{aligned} &\int_R (\partial_x Q - \partial_y P) \\ &\quad = \int_{a_1}^{b_1} P(x, a_2)\,dx \\ &\qquad + \int_{a_2}^{b_2} Q(b_1, y)\,dy \\ &\qquad - \int_{a_1}^{b_1} P(x, b_2)\,dx \\ &\qquad - \int_{a_2}^{b_2} Q(a_1, y)\,dy. \end{aligned}$$
      Le second membre est $\int_{\partial \alpha_R} (P\,dx + Q\,dy)$, intégrale le long du bord de $R$ parcouru dans le sens direct, où $\alpha_R$ est le cube affine du nœud {{dr-iterees|Intégrales itérées}}, (iii).

      (ii) *Domaine image d'un carré.* Soit $c$ un cube singulier lisse de dimension $2$ d'un ouvert $U$ de $\mathbb R^2$, prolongé par $\tilde c$, et $P$, $Q$ de classe $C^\infty$ sur $U$. Notons $\det d\tilde c = \partial_s \tilde c_1\,\partial_t \tilde c_2 - \partial_t \tilde c_1\,\partial_s \tilde c_2$. Alors
      $$\begin{aligned} &\int_{I^2} \big((\partial_x Q - \partial_y P) \circ c\big)\,\det d\tilde c \\ &\quad = \int_{\partial c} (P\,dx + Q\,dy). \end{aligned}$$
      En particulier,
      $$\int_{I^2} \det d\tilde c = \int_{\partial c} x\,dy = -\int_{\partial c} y\,dx.$$

      (iii) *Divergence sur un pavé.* Soit $K = \prod_{i=1}^n [a_i, b_i]$ un pavé et $F = (F_1, \dots, F_n)$ de classe $C^\infty$ sur un ouvert contenant $K$, de divergence $\operatorname{div} F = \sum_i \partial_i F_i$. Notons $K'_i = \prod_{l \neq i} [a_l, b_l]$ et $\iota_{i,s}(y) = (y_1, \dots, y_{i-1}, s, y_i, \dots, y_{n-1})$, comme au nœud {{dr-fubini|Fubini pour les fonctions continues}}, (iii). Alors
      $$\begin{aligned} &\int_K \operatorname{div} F \\ &\quad = \sum_{i=1}^n \int_{K'_i} \big(F_i \circ \iota_{i,b_i} - F_i \circ \iota_{i,a_i}\big). \end{aligned}$$
      Pour $n = 3$, le second membre est le flux sortant de $F$ à travers les six faces du pavé.
    preuve: |
      (iii) Posons $\omega = \sum_{i=1}^n (-1)^{i-1} F_i\,dx_1 \wedge \cdots \wedge \widehat{dx_i} \wedge \cdots \wedge dx_n$ ; pour $n = 1$, c'est la fonction $F_1$. Comme dans la preuve de la formule de Stokes ({{dr-stokes|Formule de Stokes}}), ramener $dx_i$ à sa place coûte $(-1)^{i-1}$, et
      $$d\omega = \Big(\sum_i \partial_i F_i\Big)\,dx_1 \wedge \cdots \wedge dx_n.$$

      *Intérieur.* L'application affine $\alpha_K$ ({{dr-iterees|Intégrales itérées}}, (iii)), restreinte à l'image réciproque de l'ouvert de définition de $F$, prolonge un cube singulier lisse de dimension $n$. Comme $\alpha_K^*(dx_l) = (b_l - a_l)\,dt_l$, on a $\alpha_K^*(dx_1 \wedge \cdots \wedge dx_n) = v(K)\,dt_1 \wedge \cdots \wedge dt_n$, et
      $$\begin{aligned} \int_{\alpha_K} d\omega &= v(K)\int_{I^n} (\operatorname{div} F) \circ \alpha_K \\ &= \int_K \operatorname{div} F. \end{aligned}$$

      *Faces.* Sur la face $\alpha_K \circ \iota_{l,\varepsilon}$, la coordonnée $l$ est constante, et l'image réciproque de $dx_l$ est nulle : seul subsiste le terme $i = l$ de $\omega$. Or $\alpha_K \circ \iota_{i,\varepsilon} = \iota_{i,s} \circ \alpha_{K'_i}$, avec $s = a_i$ si $\varepsilon = 0$ et $s = b_i$ si $\varepsilon = 1$, et l'image réciproque de $dx_1 \wedge \cdots \wedge \widehat{dx_i} \wedge \cdots \wedge dx_n$ est $v(K'_i)\,dt_1 \wedge \cdots \wedge dt_{n-1}$.

      Le même changement de variable affine, sur $K'_i$, donne
      $$\int_{\alpha_K \circ \iota_{i,\varepsilon}} \omega = (-1)^{i-1}\int_{K'_i} F_i \circ \iota_{i,s}.$$
      Avec le signe $(-1)^{i+\varepsilon}$ du bord, le facteur total est $(-1)^{\varepsilon+1}$ : $+$ pour la face $x_i = b_i$, $-$ pour la face $x_i = a_i$. La formule de Stokes, $\int_{\alpha_K} d\omega = \int_{\partial\alpha_K} \omega$, est l'égalité annoncée ; pour $n = 1$, c'est le théorème fondamental.

      (i) C'est (iii) pour $n = 2$ et $F = (Q, -P)$, dont la divergence est $\partial_x Q - \partial_y P$. La forme $\omega$ de la preuve de (iii) est alors $Q\,dy + P\,dx$, et la formule de Stokes identifie le second membre à $\int_{\partial\alpha_R} (P\,dx + Q\,dy)$.

      (ii) Pour $\omega = P\,dx + Q\,dy$, $d\omega = (\partial_x Q - \partial_y P)\,dx \wedge dy$, et le nœud {{dr-integrale-cubes|Intégrale sur une chaîne}}, (i), donne $\tilde c^*(dx \wedge dy) = \det d\tilde c\;ds \wedge dt$. La formule de Stokes conclut. Pour $P = 0$ et $Q = x$, ou pour $P = -y$ et $Q = 0$, on a $d\omega = dx \wedge dy$.
    remarques:
      - |
        Le cube $c(s, t) = \big(s, t(1 + s^2)\big)$ envoie le carré sur le domaine $D$ situé entre l'axe des $x$ et l'arc de parabole $y = 1 + x^2$, pour $0 \leqslant x \leqslant 1$. Son jacobien vaut $1 + s^2$, et $\int_{I^2} (1 + s^2) = \frac43$, qui est aussi $\int_0^1 (1 + x^2)\,dx$, l'aire de $D$ au sens de l'intégrale de Riemann.

        Par le bord, $\int_{\partial c} x\,dy$ ne reçoit que la contribution $+2$ du côté droit $c(1, t) = (1, 2t)$ et $-\frac23$ de l'arc $c(s, 1) = (s, 1 + s^2)$, sur lequel $x\,dy = 2s^2\,ds$ ; les deux autres côtés donnent $0$. On retrouve $2 - \frac23 = \frac43$ : l'aire a été calculée sans regarder l'intérieur du domaine. Ces valeurs ont été vérifiées par un calcul formel.

        ```schema dr-green
        Le domaine $D$, image du carré par $c(s, t) = (s, t(1 + s^2))$, avec les images des segments $s = \frac14, \frac12, \frac34$ et $t = \frac14, \frac12, \frac34$, en gris. Le bord $\partial c$, en rouge, fait le tour de $D$ dans le sens direct : le bas et le côté droit dans le sens de $s$ et de $t$ croissants, l'arc de parabole et le côté gauche à rebours. Pour la forme $x\,dy$, seuls le côté droit et l'arc contribuent, pour $2$ et $-\frac23$.
        ```
      - |
        L'erreur la plus répandue est de parcourir les quatre côtés dans le sens des coordonnées croissantes, en oubliant les signes $(-1)^{i+\varepsilon}$. Dans l'exemple précédent, on trouverait $2 + \frac23 = \frac83$ au lieu de $\frac43$. Ce sont les signes du bord qui font des quatre côtés un contour fermé, parcouru d'un seul tenant.
      - |
        Lorsque $c$ est un difféomorphisme de jacobien positif de l'intérieur du carré sur son image, le premier membre de (ii) est l'intégrale de $\partial_x Q - \partial_y P$ sur le domaine $c(I^2)$, par la formule du changement de variables ({{cv-changement|Changement de variables}}), qui n'est pas un ancêtre de cette branche. En particulier, $\int_{\partial c} x\,dy$ est alors l'aire du domaine ; c'est le principe du planimètre, instrument qui mesure une aire en suivant son contour.
      - |
        Sur $K = [0, 1] \times [0, 2] \times [0, 3]$, le champ $F = (xy, yz, zx)$ a pour divergence $x + y + z$, d'intégrale $18$ : le volume $6$ multiplié par la valeur $3$ de la divergence au centre, puisqu'elle est affine. Le flux sort par les trois faces $x = 1$, $y = 2$ et $z = 3$, pour $6$, $9$ et $3$, et il est nul à travers les trois autres, où la composante normale s'annule. La somme vaut bien $18$.

        La divergence est celle du théorème de Liouville ({{cv-liouville|Liouville}}) : un champ de divergence nulle a un flux total nul à travers le bord de tout pavé, ce qui est la forme intégrale de la conservation du volume par son flot.
      - |
        La formule plane apparaît sans démonstration dans une note de Cauchy aux *Comptes rendus* (1846), puis, démontrée, dans la thèse de Riemann (1851) ; George Green avait établi en 1828, dans un *Essay on the Application of Mathematical Analysis to the Theories of Electricity and Magnetism* publié à compte d'auteur, une identité pour les fonctions de trois variables sur un solide. Le théorème de la divergence a été présenté par Ostrogradski à Paris en 1826, dans un manuscrit, et publié en 1831 à Saint-Pétersbourg (V. J. Katz, *The History of Stokes' Theorem*, Mathematics Magazine 52, 1979).

  - id: derham-cohomologie
    etiquette: Mayer-Vietoris, homotopie
    nature: chapitre
    titre: Mayer-Vietoris et homotopie
    sous: derham-cohomologie
    texte: |
      La cohomologie de de Rham se calcule comme l'homologie, par des suites exactes et l'invariance par homotopie, mais avec des outils différentiels. Une formule d'homotopie, qui intègre une forme dans la direction du temps, montre que deux applications lissement homotopes induisent la même application en cohomologie. Une partition de l'unité subordonnée à deux ouverts, construite sans choix à partir des cubes du nœud {{dr-recouvrement|Recouvrement par des cubes}}, rend exacte la suite des formes sur $U \cup V$, $U$, $V$ et $U \cap V$, d'où la suite exacte longue de Mayer-Vietoris.

      On en tire la cohomologie de $\mathbb R^n \setminus \{0\}$ : elle est de dimension $1$ en degrés $0$ et $n - 1$, nulle ailleurs, et la forme angle solide, fermée et d'intégrale non nulle sur le bord d'un cube, engendre le degré $n - 1$. Application : sur une sphère de dimension paire, tout champ de vecteurs tangent lisse s'annule. Aucun choix.

  - id: derham-tout-degre
    etiquette: De Rham en tout degré
    nature: chapitre
    titre: Théorème de de Rham en tout degré
    sous: derham-tout-degre
    texte: |
      Pour tout ouvert $U$ de $\mathbb R^n$ et tout degré $k$, l'intégration des formes sur les simplexes singuliers lisses induit un isomorphisme de $\lex{cohomologie-de-rham}{H^k}(U)$ sur la cohomologie des cochaînes lisses à valeurs réelles. La démonstration, due à Weil, compare les deux cohomologies à celle du nerf du recouvrement par les cubes, au moyen de deux complexes doubles : les formes sur les intersections de cubes, dont les rangées sont exactes grâce à une partition de l'unité et les colonnes grâce au lemme de Poincaré sur des pavés, et l'analogue pour les cochaînes. Aucun choix n'y intervient.

      Sous la forme duale, une forme fermée est exacte si et seulement si ses intégrales sur les cycles lisses sont nulles, et toute famille de périodes compatible est atteinte ; le passage au dual de l'homologie utilise ici le lemme de Zorn, sauf en degré $0$ et pour l'injectivité en degré $1$ ; le nœud {{dr-degre1|De Rham en degré 1}} donne sans choix l'énoncé dual en degré $1$ pour l'homologie singulière continue.

  - id: derham-poincare
    etiquette: Support compact, dualité
    nature: chapitre
    titre: Support compact et dualité de Poincaré
    sous: derham-poincare
    texte: |
      Les formes à support compact donnent une seconde cohomologie, $H^k_c(U)$, fonctorielle dans l'autre sens, par extension par zéro, et non invariante par homotopie : $H^n_c(\mathbb R^n) \cong \mathbb R$ par l'intégrale, ce que démontre l'intégration dans les fibres. Elle a sa suite de Mayer-Vietoris, et l'accouplement $\int_U \omega \wedge \eta$ met face à face $H^k(U)$ et $H^{n-k}_c(U)$.

      La dualité de Poincaré affirme que cet accouplement identifie $H^k(U)$ au dual de $H^{n-k}_c(U)$, pour tout ouvert $U$ de $\mathbb R^n$. Elle est démontrée d'abord pour les réunions finies de pavés ouverts, par Mayer-Vietoris et le lemme des cinq en dimension finie, puis pour tout ouvert, par passage à la limite sur les réunions finies de cubes ; les choix de ce passage sont remplacés par des points de norme minimale dans les cochaînes de Čech, de dimension finie. Aucun choix n'intervient.

