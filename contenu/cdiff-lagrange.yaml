# Niveau 2 : structure interne du chapitre « Extrema liés » (nœud cdiff-lagrange du graphe cdiff, créé le
# 30 oct. 2026). Ensemble de niveau Γ = {g = 0} d'une application g : U ⊂ ℝⁿ → ℝᵖ de classe C¹ en un point où
# elle est une submersion : paramétrage local par la forme locale des submersions, espace tangent T_aΓ défini
# par les vitesses des courbes C¹ tracées sur Γ, égal à Ker dg(a). Théorème des extrema liés : df(a) s'annule
# sur Ker dg(a), multiplicateurs de Lagrange uniques, points critiques du lagrangien. Conditions du second ordre
# par la hessienne du lagrangien restreinte à T_aΓ (nécessaire, suffisante), ramenées au chapitre « Formes
# quadratiques » par le paramétrage local ; critère de la hessienne bordée en remarque. Applications : inégalité
# arithmético-géométrique, extrema d'une forme quadratique sur la sphère (valeurs propres), distance à un
# ensemble de niveau.
# Placement : le chapitre a besoin des submersions (gd-submersions) et des conditions d'extremum du second ordre
# (chapitre cdiff-quadratiques), qui sont deux branches distinctes de cdiff ; il en est le point de rencontre.
# Aucune arête nouvelle dans l'édifice. Le théorème spectral (f-spectral-fini, analyse fonctionnelle) n'est pas
# un ancêtre : il n'est cité qu'en remarque. Aucune forme du choix n'intervient.

graphe: cdiff-lagrange
titre: Extrema liés
conteneur: cdiff-lagrange

entrees:
  gd-submersions: [el-niveau]
  cdiff-quadratiques: [el-second-ordre]

noeuds:
  - id: el-niveau
    etiquette: Ensembles de niveau
    nature: proposition
    titre: Ensemble de niveau d'une submersion et espace tangent
    texte: |
      Dans tout le chapitre, $U$ est un ouvert de $\lex{n-uplet}{\mathbb R^n}$, $g = (g_1, \dots, g_p) : U \to \mathbb R^p$ une application de [[classe-ck|classe $C^k$]], avec $k \geqslant 1$, et
      $$\Gamma = \{x \in U : g(x) = 0\}$$
      est l'**ensemble de niveau** $0$ de $g$. Une contrainte de la forme $g(x) = c$ s'y ramène, en remplaçant $g$ par $g - c$.

      On fixe un point $a \in \Gamma$ en lequel $g$ est une [[submersion]], c'est-à-dire en lequel $dg(a)$ est surjective ; cela impose $p \leqslant n$.

      Un vecteur $v \in \mathbb R^n$ est **tangent** à $\Gamma$ en $a$ s'il existe $\varepsilon > 0$ et une courbe $\gamma : \,]{-\varepsilon}, \varepsilon[ \to \mathbb R^n$ de classe $C^1$, à valeurs dans $\Gamma$, telle que $\gamma(0) = a$ et $\gamma'(0) = v$. L'ensemble de ces vecteurs est l'[[espace-tangent-niveau|espace tangent]] $\lex{espace-tangent-niveau}{T_a}\Gamma$ à $\Gamma$ en $a$.
    enonce: |
      (i) *Paramétrage local.* Il existe un ouvert $V \subset U$ contenant $a$, un ouvert $W$ de $\mathbb R^{n-p}$, et deux applications $\psi : W \to \mathbb R^n$ et $\rho : V \to \mathbb R^{n-p}$ de classe $C^k$, telles que
      $$\psi(W) = \Gamma \cap V$$
      et $\rho(\psi(w)) = w$ pour tout $w \in W$. En particulier, $\psi$ est injective, et $d\psi(w)$ est injective pour tout $w \in W$.

      (ii) *Espace tangent.* Le point $w_a = \rho(a)$ appartient à $W$, $\psi(w_a) = a$, et
      $$T_a\Gamma = \operatorname{Ker} dg(a) = d\psi(w_a)(\mathbb R^{n-p}).$$
      C'est donc un sous-espace vectoriel de dimension $n - p$. De plus, tout vecteur de $T_a\Gamma$ est la vitesse en $0$ d'une courbe de classe $C^k$ tracée sur $\Gamma$.
    preuve: |
      (i) Comme $g(a) = 0$, la forme locale des submersions ({{gd-submersions|Submersions}}, (i)) fournit un ouvert $V \subset U$ contenant $a$ et un $C^k$-difféomorphisme $\Phi$ de $V$ sur un ouvert $\Phi(V)$ de $\mathbb R^{n-p} \times \mathbb R^p$ tels que $g(x) = \pi(\Phi(x))$ pour tout $x \in V$, où $\pi(z', z'') = z''$. Notons aussi $\pi'(z', z'') = z'$.

      Posons $W = \{w \in \mathbb R^{n-p} : (w, 0) \in \Phi(V)\}$, ouvert comme image réciproque de l'ouvert $\Phi(V)$ par l'application continue $w \mapsto (w, 0)$, puis $\psi(w) = \Phi^{-1}(w, 0)$ et $\rho = \pi' \circ \Phi$. Ces deux applications sont de classe $C^k$, comme composées d'applications linéaires et de $\Phi$ ou de $\Phi^{-1}$ ({{gd-classe-ck|Classe Cᵏ}}, (ii) et (iii)).

      Pour $x \in V$, on a $x \in \Gamma$ si et seulement si $\pi(\Phi(x)) = 0$, c'est-à-dire si et seulement si $\Phi(x)$ est de la forme $(w, 0)$. Un tel $w$ appartient à $W$, puisque $\Phi(x) \in \Phi(V)$, et $x = \psi(w)$. Réciproquement, $\psi(w) \in V$ et $g(\psi(w)) = \pi(w, 0) = 0$. Donc $\psi(W) = \Gamma \cap V$.

      Enfin $\rho(\psi(w)) = \pi'(w, 0) = w$. Si $\psi(w) = \psi(w')$, on applique $\rho$ et l'on trouve $w = w'$. La règle de la chaîne ({{gd-differentielle|Différentielle}}, (iii) et (iv)) donne
      $$d\rho(\psi(w)) \circ d\psi(w) = \mathrm{id},$$
      si bien que $d\psi(w)$ est injective.

      (ii) Le point $a$ appartient à $\Gamma \cap V = \psi(W)$ : il s'écrit $\psi(w)$ avec $w \in W$, et $\rho(a) = w$. Ainsi $w_a \in W$ et $\psi(w_a) = a$.

      *Première inclusion.* Soit $v \in T_a\Gamma$, et $\gamma$ une courbe comme dans la définition. Elle est à valeurs dans $\Gamma$, donc $g \circ \gamma$ est nulle sur $]{-\varepsilon}, \varepsilon[$. Par la règle de la chaîne ({{gd-differentielle|Différentielle}}, (ii) et (iv)), sa dérivée en $0$ est $dg(a)\gamma'(0)$, qui est donc nulle : $T_a\Gamma \subset \operatorname{Ker} dg(a)$.

      *Seconde inclusion.* Soit $h \in \mathbb R^{n-p}$. L'ouvert $W$ contient $w_a$, donc il existe $\varepsilon > 0$ tel que $w_a + th \in W$ pour $|t| < \varepsilon$. La courbe $\gamma(t) = \psi(w_a + th)$ est de classe $C^k$, à valeurs dans $\psi(W) \subset \Gamma$, et vérifie $\gamma(0) = a$ et $\gamma'(0) = d\psi(w_a)h$. Ainsi $d\psi(w_a)(\mathbb R^{n-p}) \subset T_a\Gamma$.

      *Dimensions.* L'application $d\psi(w_a)$ étant injective, son image est de dimension $n - p$. Comme $dg(a)$ est surjective sur $\mathbb R^p$, son noyau est de dimension $n - p$ par le théorème du rang ({{v-rang|Théorème du rang}}).

      On a donc
      $$d\psi(w_a)(\mathbb R^{n-p}) \subset T_a\Gamma \subset \operatorname{Ker} dg(a),$$
      où les deux sous-espaces extrêmes ont la même dimension : ils sont égaux ({{v-dimension|Dimension}}, (iii)), et $T_a\Gamma$ leur est égal. Tout vecteur de $T_a\Gamma$ est alors de la forme $d\psi(w_a)h$, vitesse de la courbe $C^k$ construite plus haut.
    remarques:
      - |
        Le point (i) dit qu'au voisinage de $a$, l'ensemble $\Gamma$ est décrit sans redondance par $n - p$ paramètres réels : chacune des $p$ équations indépendantes retire un degré de liberté. Pour la sphère $x_1^2 + x_2^2 + x_3^2 = 1$ de $\mathbb R^3$, avec $p = 1$ et $dg(a)h = 2(a_1h_1 + a_2h_2 + a_3h_3)$, l'espace tangent en $a$ est le plan des $h$ tels que $a_1h_1 + a_2h_2 + a_3h_3 = 0$, de dimension $2$.
      - |
        L'hypothèse de submersion ne peut pas être omise : sans elle, $T_a\Gamma$ n'est même pas toujours un sous-espace vectoriel. Pour $g(x, y) = xy$, l'ensemble $\Gamma$ est la réunion des deux axes, et $dg(0, 0) = 0$.

        Les vitesses $(v_1, 0)$ et $(0, v_2)$ sont tangentes en $(0, 0)$, le long des courbes $t \mapsto (tv_1, 0)$ et $t \mapsto (0, tv_2)$.

        En revanche, si $\gamma$ est tracée sur $\Gamma$ avec $\gamma(0) = (0, 0)$ et $\gamma'(0) = (v_1, v_2)$, où $v_1 \neq 0$ et $v_2 \neq 0$, les quotients $\gamma_1(t)/t$ et $\gamma_2(t)/t$ tendent vers $v_1$ et $v_2$, si bien que $\gamma_1(t)\gamma_2(t)$ est non nul pour $t \neq 0$ assez petit, ce qui contredit $\gamma(t) \in \Gamma$.

        L'ensemble $T_{(0,0)}\Gamma$ est donc la réunion des deux axes, qui n'est pas stable par addition, alors que $\operatorname{Ker} dg(0, 0)$ est le plan tout entier.
      - |
        Si $g$ est de classe $C^\infty$ et une submersion en chaque point de $\Gamma$, l'ensemble $\Gamma$ est une sous-variété de dimension $n - p$ ({{gd-sous-varietes|Sous-variétés de ℝⁿ}}, (i)), et $T_a\Gamma$ est son espace tangent au sens du nœud {{gd-tangent-sm|Tangent à une sous-variété}}, défini par des courbes seulement dérivables en $0$.

        Les deux définitions donnent le même espace, puisqu'elles conduisent toutes deux à $\operatorname{Ker} dg(a)$. La géométrie différentielle, qui vient après ce chapitre, en fera le point de départ de la notion de vecteur tangent.

  - id: el-lagrange
    etiquette: Multiplicateurs de Lagrange
    nature: théorème
    titre: Théorème des extrema liés
    texte: |
      Les notations sont celles du nœud {{el-niveau|Ensembles de niveau}}. Soit $f : U \to \lex{ensemble-reels}{\mathbb R}$. On dit que $f$ admet en $a \in \Gamma$ un **maximum local lié**, ou maximum local sous la contrainte $g = 0$, s'il existe $r > 0$ tel que $f(x) \leqslant f(a)$ pour tout $x \in \Gamma$ vérifiant $\|x - a\| < r$ ; c'est un maximum local de la restriction de $f$ à $\Gamma$.

      On définit de même un **minimum local lié**, avec l'inégalité inverse, et un [[extremum-lie|extremum lié]] est l'un ou l'autre ; il est **strict** si l'inégalité est stricte pour $x \neq a$.

      Le **produit scalaire usuel** de $\mathbb R^n$ est $\langle x, y \rangle = \sum_i x_i y_i$. Si $f$ est [[differentiable]] en $a$, son [[gradient]] est le vecteur
      $$\nabla f(a) = \big(\partial_1 f(a), \dots, \partial_n f(a)\big),$$
      de sorte que $df(a)h = \langle \nabla f(a), h \rangle$ pour tout $h$ ({{gd-differentielle|Différentielle}}, (ii)).

      Le [[lagrangien]] associé à $f$ et à la contrainte $g = 0$ est la fonction de $n + p$ variables
      $$\Lambda(x, \mu) = f(x) - \sum_{i=1}^p \mu_i\, g_i(x),$$
      définie sur $U \times \mathbb R^p$.
    enonce: |
      Soit $g : U \to \mathbb R^p$ de classe $C^1$, $a \in \Gamma$ tel que $dg(a)$ soit surjective, et $f : U \to \mathbb R$ différentiable en $a$. On suppose que $f$ admet en $a$ un [[extremum-lie|extremum lié]].

      (i) La différentielle $df(a)$ est nulle sur $T_a\Gamma = \operatorname{Ker} dg(a)$.

      (ii) *Multiplicateurs de Lagrange.* Les formes linéaires $dg_1(a), \dots, dg_p(a)$ sont linéairement indépendantes, et il existe des réels $\lambda_1, \dots, \lambda_p$, uniques, tels que
      $$df(a) = \sum_{i=1}^p \lambda_i\, dg_i(a),$$
      c'est-à-dire $\nabla f(a) = \sum_i \lambda_i \nabla g_i(a)$.

      Ce sont les [[multiplicateurs-lagrange|multiplicateurs de Lagrange]] de $f$ en $a$. Pour $p = 1$, le gradient $\nabla f(a)$ est colinéaire au vecteur non nul $\nabla g(a)$.

      (iii) Indépendamment de tout extremum, si $f$ est différentiable sur $U$, le lagrangien $\Lambda$ est différentiable sur $U \times \mathbb R^p$, et un couple $(b, \mu)$ en est un [[point-critique|point critique]] si et seulement si $g(b) = 0$ et $df(b) = \sum_i \mu_i\, dg_i(b)$. Sous les hypothèses de (ii), $(a, \lambda)$ est donc un point critique de $\Lambda$.
    preuve: |
      (i) Quitte à remplacer $f$ par $-f$, supposons que $f$ admette en $a$ un maximum local lié, de rayon $r$. Soit $h \in \operatorname{Ker} dg(a)$. Par le nœud {{el-niveau|Ensembles de niveau}}, (ii), on a $h \in T_a\Gamma$ : il existe une courbe $\gamma : \,]{-\varepsilon}, \varepsilon[ \to \mathbb R^n$ de classe $C^1$, à valeurs dans $\Gamma$, telle que $\gamma(0) = a$ et $\gamma'(0) = h$.

      La courbe $\gamma$ est continue en $0$ : il existe $\delta \in \,]0, \varepsilon]$ tel que $\|\gamma(t) - a\| < r$ pour $|t| < \delta$. Pour ces $t$, le point $\gamma(t)$ est dans $\Gamma$, et $\varphi(t) = f(\gamma(t))$ vérifie $\varphi(t) \leqslant f(a) = \varphi(0)$.

      La fonction $\varphi$ admet ainsi en $0$, qui n'est pas une extrémité de $]{-\delta}, \delta[$, un maximum local. Elle est dérivable en $0$, de dérivée $df(a)h$, par la règle de la chaîne ({{gd-differentielle|Différentielle}}, (ii) et (iv)). Donc $df(a)h = 0$ ({{de-extremum|Extremum local}}).

      (ii) *Indépendance.* Supposons $\sum_i \mu_i\, dg_i(a) = 0$. Comme $dg(a)$ est surjective, il existe $h$ tel que $dg(a)h = (\mu_1, \dots, \mu_p)$, c'est-à-dire $dg_i(a)h = \mu_i$ pour tout $i$. Alors
      $$0 = \sum_i \mu_i\, dg_i(a)h = \sum_i \mu_i^2,$$
      et tous les $\mu_i$ sont nuls. L'unicité des $\lambda_i$ s'en déduit : la différence de deux familles convenables donne une combinaison nulle.

      *Existence.* Soit $y \in \mathbb R^p$. Il existe $h$ tel que $dg(a)h = y$, et si $h'$ en est un autre, $h - h'$ appartient à $\operatorname{Ker} dg(a)$, où $df(a)$ est nulle par (i) : le réel $df(a)h$ ne dépend que de $y$. On le note $m(y)$. Aucun choix n'intervient : $m(y)$ est défini comme l'unique réel $t$ pour lequel il existe $h$ tel que $dg(a)h = y$ et $df(a)h = t$.

      L'application $m$ est linéaire : si $dg(a)h = y$ et $dg(a)h' = y'$, alors $dg(a)(\alpha h + \beta h') = \alpha y + \beta y'$, donc $m(\alpha y + \beta y') = \alpha\, m(y) + \beta\, m(y')$. Posons $\lambda_i = m(\delta_i)$, où $(\delta_i)$ est la base canonique de $\mathbb R^p$. Pour tout $h \in \mathbb R^n$, on a $dg(a)h = \sum_i dg_i(a)h\; \delta_i$, d'où
      $$df(a)h = m\big(dg(a)h\big) = \sum_i \lambda_i\, dg_i(a)h.$$

      En évaluant cette égalité en $h = e_j$, et puisque $df(a)e_j = \partial_j f(a)$ ({{gd-differentielle|Différentielle}}, (ii)), on obtient $\partial_j f(a) = \sum_i \lambda_i\, \partial_j g_i(a)$ pour tout $j$, c'est-à-dire l'égalité des gradients. Pour $p = 1$, $dg(a)$ est surjective sur $\mathbb R$, donc non nulle, et $\nabla g(a) \neq 0$.

      (iii) L'ensemble $U \times \mathbb R^p$ est un ouvert de $\mathbb R^{n+p}$, image réciproque de $U$ par la projection $(x, \mu) \mapsto x$, qui est continue. L'application $(x, \mu) \mapsto \mu_i\, g_i(x)$ est la composée de $(x, \mu) \mapsto (\mu_i, g_i(x))$, différentiable comme ses deux composantes, et de la multiplication de $\mathbb R \times \mathbb R$, bilinéaire. Par la règle de la chaîne ({{gd-differentielle|Différentielle}}, (iii) et (iv)), $\Lambda$ est différentiable en tout $(b, \mu)$, et
      $$\begin{aligned} d\Lambda(b, \mu)(h, \eta) &= df(b)h - \sum_i \mu_i\, dg_i(b)h \\ &\quad - \sum_i \eta_i\, g_i(b). \end{aligned}$$

      Cette forme est nulle pour tous $(h, \eta)$ si et seulement si elle l'est en $(0, \delta_i)$ pour tout $i$, ce qui donne $g(b) = 0$, et en tout $(h, 0)$, ce qui donne $df(b) = \sum_i \mu_i\, dg_i(b)$.
    remarques:
      - |
        Pour $f(x, y) = xy$ sur le cercle $\Gamma$ d'équation $g(x, y) = x^2 + y^2 - 2 = 0$, on a $\nabla g(x, y) = (2x, 2y)$, non nul sur $\Gamma$ : $g$ est une submersion en tout point de $\Gamma$. Le système $\nabla f = \lambda \nabla g$, $g = 0$ s'écrit $y = 2\lambda x$, $x = 2\lambda y$, $x^2 + y^2 = 2$ ; il a quatre solutions, $(1, 1)$ et $(-1, -1)$ avec $\lambda = \frac12$, $(1, -1)$ et $(-1, 1)$ avec $\lambda = -\frac12$.

        Le cercle est fermé et borné, donc compact ({{me-rn|L'espace ℝⁿ}}, (iii)), et la fonction continue $f$ y atteint son maximum et son minimum ({{tr-compacts|Compacts de ℝ}}, (iii)). Ce sont des extrema liés, qui figurent donc parmi les quatre candidats : le maximum de $xy$ sur le cercle vaut $1$, atteint en $(1, 1)$ et $(-1, -1)$, et le minimum vaut $-1$, atteint en $(1, -1)$ et $(-1, 1)$.

        ```schema el-lagrange
        Les lignes de niveau de $xy$, en rouge où $xy > 0$ et en bleu où $xy < 0$, coupent le cercle $x^2 + y^2 = 2$, en noir, sauf les hyperboles $xy = 1$ et $xy = -1$, qui lui sont tangentes aux quatre points extrémaux. En $(1, 1)$, les gradients $\nabla f = (1, 1)$, en rouge, et $\nabla g = (2, 2)$, en noir, sont colinéaires, avec $\lambda = \frac12$. Au point $(7/5, 1/5)$ du cercle, la ligne de niveau $xy = 7/25$ traverse le cercle, et $\nabla f = (1/5, 7/5)$, en vert, n'est pas colinéaire à $\nabla g = (14/5, 2/5)$ ; les gradients sont dessinés à l'échelle $\frac12$. En se déplaçant sur le cercle, on y fait croître $f$ dans un sens et décroître dans l'autre.
        ```

        C'est l'intuition du théorème : si $\nabla f(a)$ avait une composante non nulle le long de $T_a\Gamma$, un petit déplacement sur $\Gamma$ dans cette direction ferait croître $f$, et un déplacement en sens inverse la ferait décroître.
      - |
        L'erreur la plus répandue est de résoudre le système de Lagrange en oubliant les points de $\Gamma$ où $dg$ n'est pas surjective : ils doivent être examinés à part, car le théorème ne dit rien d'eux. Pour $f(x, y) = x$ sous la contrainte $g(x, y) = x^3 - y^2 = 0$, le point $(0, 0)$ réalise le minimum de $f$ sur $\Gamma$, puisque $x^3 = y^2 \geqslant 0$ entraîne $x \geqslant 0$.

        Pourtant le système $\nabla f = \lambda \nabla g$, $g = 0$, qui s'écrit $1 = 3\lambda x^2$, $0 = -2\lambda y$, $x^3 = y^2$, n'a aucune solution : la première équation impose $\lambda \neq 0$, la deuxième $y = 0$, la troisième $x = 0$, et la première devient $1 = 0$. C'est que $\nabla g(0, 0) = (0, 0)$ : à l'origine, où la courbe forme une pointe, $g$ n'est pas une submersion, et $\nabla f(0, 0) = (1, 0)$ n'est multiple d'aucun $\lambda \nabla g(0, 0)$.
      - |
        Les conditions (i) et (ii) sont nécessaires, non suffisantes : elles désignent des candidats, comme les points critiques au nœud {{fq-points-critiques|Points critiques}}. Le nœud suivant donne, au second ordre, de quoi les départager.
      - |
        La méthode est due à Lagrange, qui l'introduit en statique dans la *Méchanique analitique* (Paris, Veuve Desaint, 1788), dans la partie consacrée à la statique : pour un système soumis à des liaisons, il ajoute à l'équation des vitesses virtuelles les différentielles des équations de condition, multipliées par des coefficients indéterminés, puis égale à zéro le coefficient de chaque différentielle, comme si les variables étaient indépendantes ; il transpose ensuite la méthode aux maxima et minima (P. Bussotti, « On the genesis of the Lagrange multipliers », *J. Optim. Theory Appl.* 117, 2003, p. 453-459).

  - id: el-second-ordre
    etiquette: Second ordre
    nature: théorème
    titre: Conditions du second ordre pour un extremum lié
    texte: |
      Les notations sont celles des nœuds {{el-niveau|Ensembles de niveau}} et {{el-lagrange|Multiplicateurs de Lagrange}}. On suppose $f$ et $g$ de [[classe-ck|classe $C^2$]] sur $U$, $a \in \Gamma$ tel que $dg(a)$ soit surjective, et $\lambda \in \mathbb R^p$ tel que $df(a) = \sum_i \lambda_i\, dg_i(a)$ : c'est le cas, par le théorème des extrema liés, si $f$ admet en $a$ un extremum lié.

      Le [[lagrangien]] à multiplicateurs fixés est $L(x) = \Lambda(x, \lambda) = f(x) - \sum_i \lambda_i\, g_i(x)$. Il est de classe $C^2$ sur $U$, vérifie $dL(a) = 0$, et coïncide avec $f$ sur $\Gamma$. Sa [[matrice-hessienne|matrice hessienne]] en $a$ est
      $$H_L(a) = H_f(a) - \sum_i \lambda_i\, H_{g_i}(a),$$
      et l'on note $Q(v) = {}^tv\,H_L(a)\,v$ sa forme hessienne. C'est la restriction de $Q$ au sous-espace $T_a\Gamma$ qui décide.
    enonce: |
      (i) *Lemme.* Soient $W$, $\psi$ et $w_a$ comme au nœud {{el-niveau|Ensembles de niveau}}, (i) et (ii), avec $k = 2$. La fonction $F = f \circ \psi$ est de classe $C^2$ sur l'ouvert $W$, $w_a$ en est un [[point-critique|point critique]], et pour tout $h \in \mathbb R^{n-p}$
      $$ {}^th\,H_F(w_a)\,h = Q\big(d\psi(w_a)h\big).$$

      (ii) *Condition nécessaire.* Si $f$ admet en $a$ un minimum local lié, alors $Q(v) \geqslant 0$ pour tout $v \in T_a\Gamma$. Si elle y admet un maximum local lié, $Q(v) \leqslant 0$ pour tout $v \in T_a\Gamma$.

      (iii) *Condition suffisante.* Si $Q(v) > 0$ pour tout $v \in T_a\Gamma$ non nul, $f$ admet en $a$ un minimum local lié strict. Si $Q(v) < 0$ pour tout $v \in T_a\Gamma$ non nul, elle y admet un maximum local lié strict.

      (iv) Si $Q$ prend sur $T_a\Gamma$ une valeur strictement positive et une valeur strictement négative, $f$ n'admet pas d'extremum lié en $a$.
    preuve: |
      (i) Le lagrangien $L$ est de classe $C^2$ comme combinaison linéaire de fonctions $C^2$ ({{gd-classe-ck|Classe Cᵏ}}, (ii)), et $dL(a) = df(a) - \sum_i \lambda_i\, dg_i(a) = 0$. Comme $\psi(W) \subset \Gamma$, les $g_i \circ \psi$ sont nulles, et $F = L \circ \psi$. Par composition, $F$ est de classe $C^2$, et la règle de la chaîne donne $dF(w_a) = dL(a) \circ d\psi(w_a) = 0$.

      *Un calcul.* Soit $G$ une fonction réelle de classe $C^2$ sur un ouvert, et $c$ une courbe de classe $C^2$ à valeurs dans cet ouvert, définie sur un intervalle ouvert contenant $0$. Par la règle de la chaîne ({{gd-differentielle|Différentielle}}, (ii) et (iv)),
      $$(G \circ c)'(t) = \sum_j \partial_j G(c(t))\, c_j'(t).$$

      Chaque $\partial_j G$ est de classe $C^1$ : la même règle montre que $t \mapsto \partial_j G(c(t))$ est dérivable, de dérivée $\sum_i \partial_i\partial_j G(c(t))\, c_i'(t)$, et $c_j'$ est dérivable. La dérivée d'un produit ({{de-operations|Opérations}}, (ii)) donne
      $$\begin{aligned} (G \circ c)''(0) &= \sum_{i,j} \partial_i\partial_j G(c(0))\, c_i'(0)\, c_j'(0) \\ &\quad + \sum_j \partial_j G(c(0))\, c_j''(0). \end{aligned}$$

      *Les deux expressions.* Fixons $h$, et $\varepsilon > 0$ tel que $w_a + th \in W$ pour $|t| < \varepsilon$, et posons $\varphi(t) = F(w_a + th)$. Avec $G = F$ et la courbe $t \mapsto w_a + th$, de dérivée seconde nulle, le calcul donne $\varphi''(0) = {}^th\,H_F(w_a)\,h$.

      Mais $\varphi(t) = L(c(t))$, où $c(t) = \psi(w_a + th)$ est de classe $C^2$, avec $c(0) = a$ et $c'(0) = d\psi(w_a)h$, que l'on note $v$. Avec $G = L$, le calcul donne
      $$\varphi''(0) = \sum_{i,j} \partial_i\partial_j L(a)\, v_i v_j = Q(v),$$
      puisque les $\partial_j L(a)$ sont nulles. On égale les deux expressions de $\varphi''(0)$.

      (ii) Supposons que $f$ admette en $a$ un minimum local lié, de rayon $r$. L'application $\psi$ est continue en $w_a$ : il existe $\eta > 0$ tel que $\|\psi(w) - a\| < r$ pour tout $w \in W$ vérifiant $\|w - w_a\| < \eta$. Pour ces $w$, le point $\psi(w)$ est dans $\Gamma$, et $F(w) = f(\psi(w)) \geqslant f(a) = F(w_a)$.

      Ainsi $F$ admet en $w_a$ un minimum local sur l'ouvert $W$, et sa forme hessienne y est positive ({{fq-points-critiques|Points critiques}}, (ii)). Par (i), $Q(d\psi(w_a)h) \geqslant 0$ pour tout $h$, et $d\psi(w_a)(\mathbb R^{n-p}) = T_a\Gamma$ ({{el-niveau|Ensembles de niveau}}, (ii)). Pour un maximum, on remplace $f$ par $-f$, $\lambda$ par $-\lambda$, donc $L$ et $Q$ par leurs opposés.

      (iii) Soit $h \neq 0$. Le vecteur $v = d\psi(w_a)h$ est non nul, $d\psi(w_a)$ étant injective, et il appartient à $T_a\Gamma$ : par (i), ${}^th\,H_F(w_a)\,h = Q(v) > 0$.

      La forme hessienne de $F$ en $w_a$ est donc [[forme-definie-positive|définie positive]], et $F$ admet en ce point critique un minimum local strict ({{fq-extremums|Extrema}}, (i)) : il existe $\eta > 0$ tel que $F(w) > F(w_a)$ pour tout $w \in W$ vérifiant $0 < \|w - w_a\| < \eta$.

      L'application $\rho$ du nœud {{el-niveau|Ensembles de niveau}} est continue en $a$, et $\rho(a) = w_a$ : il existe $r > 0$ tel que la boule $B(a, r)$ soit contenue dans $V$ et que $\|\rho(x) - w_a\| < \eta$ pour $\|x - a\| < r$.

      Soit $x \in \Gamma$ tel que $0 < \|x - a\| < r$. Alors $x \in \Gamma \cap V = \psi(W)$, donc $x = \psi(w)$ avec $w = \rho(x) \in W$, $\|w - w_a\| < \eta$, et $w \neq w_a$ puisque $x \neq a = \psi(w_a)$. Par suite
      $$f(x) = F(w) > F(w_a) = f(a).$$
      Le cas d'un maximum s'en déduit, comme en (ii), en remplaçant $f$ par $-f$.

      (iv) Si $f$ admettait en $a$ un extremum lié, (ii) imposerait à $Q$ d'être de signe constant sur $T_a\Gamma$.
    remarques:
      - |
        L'erreur la plus répandue est d'examiner la hessienne de $f$ au lieu de celle du lagrangien. Pour $f(x, y) = y$ sur le cercle $x^2 + y^2 = 1$, au point $a = (0, -1)$, on trouve $\nabla f(a) = (0, 1)$ et $\nabla g(a) = (0, -2)$, donc $\lambda = -\frac12$. La hessienne de $f$ est nulle, et ne dit rien.

        Celle du lagrangien $L = y + \frac12(x^2 + y^2 - 1)$ est la matrice identité, définie positive : $a$ est un minimum local lié strict, ce qui est bien le cas, puisque $y \geqslant -1$ sur le cercle. La courbure de la contrainte, portée par le terme $-\lambda\, H_g(a)$, compte autant que celle de $f$.
      - |
        La distance d'un point à une parabole montre la condition du second ordre à l'œuvre. Soit $\Gamma$ la parabole $g(x, y) = y - x^2 = 0$, sur laquelle $\nabla g = (-2x, 1)$ ne s'annule pas, et $f(x, y) = x^2 + (y - \frac32)^2$, carré de la distance au point $b = (0, \frac32)$.

        Le système $\nabla f = \lambda \nabla g$ s'écrit $2x = -2\lambda x$ et $2y - 3 = \lambda$. Si $x = 0$, on trouve le point $(0, 0)$, avec $\lambda = -3$ ; sinon $\lambda = -1$, puis $y = 1$, et les points $(1, 1)$ et $(-1, 1)$.

        En $(\pm 1, 1)$, le lagrangien $L = f + g$ a pour hessienne $\begin{pmatrix} 0 & 0 \\ 0 & 2 \end{pmatrix}$ ; l'espace tangent est dirigé par $(1, \pm 2)$, où $Q$ vaut $8 > 0$ : ce sont des minima locaux liés stricts, à distance $\frac{\sqrt 5}{2}$ de $b$.

        En $(0, 0)$, le lagrangien $L = f + 3g$ a pour hessienne $\begin{pmatrix} -4 & 0 \\ 0 & 2 \end{pmatrix}$, l'espace tangent est l'axe des $x$, où $Q(1, 0) = -4 < 0$ : c'est un maximum local lié strict de la distance, qui y vaut $\frac32$, alors que $\nabla f$ et $\nabla g$ y sont colinéaires comme aux deux autres points.

        ```schema el-second-ordre
        Les cercles de centre $b = (0, \frac32)$, en pointillé gris, sont les lignes de niveau de la distance à $b$. Le cercle bleu, de rayon $\frac{\sqrt 5}{2}$, est tangent à la parabole en $(\pm 1, 1)$, et la parabole reste hors du disque près de ces points : ce sont des minima. Le cercle rouge, de rayon $\frac32$, est tangent à la parabole en $(0, 0)$, mais la parabole entre dans le disque de part et d'autre de l'origine : la distance y est localement maximale. Le point $(0, \frac12)$, marqué d'un petit cercle, est la position critique de $b$ sur l'axe : si $b = (0, c)$ est au-dessus, l'origine est un maximum local de la distance, au-dessous un minimum, comme l'établit la fin de la remarque.
        ```

        Le minimum global existe et vaut $\frac{\sqrt 5}{2}$. En effet, la partie de la parabole contenue dans le disque fermé de centre $b$ et de rayon $\frac32$ est fermée et bornée, donc compacte, et non vide ; la distance à $b$ y atteint son minimum, qui est au plus $\frac{\sqrt 5}{2} < \frac32$. Il est donc atteint en un point intérieur au disque, qui est un minimum local lié, donc l'un des trois candidats, et ce ne peut être que $(\pm 1, 1)$. Les points de la parabole hors du disque sont à distance strictement supérieure à $\frac32$, donc à $\frac{\sqrt 5}{2}$ : ce minimum est bien celui de la distance sur toute la parabole.

        Pour un point $b = (0, c)$ quelconque de l'axe, le multiplicateur en $(0, 0)$ vaut $-2c$, et $Q(h, 0) = (2 - 4c)h^2$ : l'origine est un minimum local lié strict de la distance si $c < \frac12$ et un maximum si $c > \frac12$. Pour $c = \frac12$, $Q$ est nulle sur l'espace tangent et le théorème ne conclut pas ; on calcule alors $f(x, x^2) = x^4 + \frac14$, et l'origine est un minimum strict, que seul le quatrième ordre décèle.
      - |
        Pour $n = 2$ et $p = 1$, la condition se lit sur un seul déterminant. Notons $\alpha = \partial_1 g(a)$, $\beta = \partial_2 g(a)$, non tous deux nuls, et $\ell_{ij} = \partial_i\partial_j L(a)$. L'espace tangent est la droite dirigée par $w = (-\beta, \alpha)$. En développant suivant la première ligne,
        $$\begin{aligned} &\det \begin{pmatrix} 0 & \alpha & \beta \\ \alpha & \ell_{11} & \ell_{12} \\ \beta & \ell_{12} & \ell_{22} \end{pmatrix} \\ &\quad = -(\ell_{11}\beta^2 - 2\ell_{12}\alpha\beta + \ell_{22}\alpha^2) = -Q(w). \end{aligned}$$

        Ainsi $a$ est un minimum local lié strict si ce déterminant, dit **hessien bordé**, est strictement négatif, et un maximum local lié strict s'il est strictement positif. Pour la parabole ci-dessus, il vaut $-8$ en $(\pm 1, 1)$ et $4$ en $(0, 0)$.

        En général, si $J$ est la matrice de $dg(a)$ et si ses $p$ premières colonnes forment une matrice inversible, on borde $H_L(a)$ par $J$ et ${}^tJ$, et l'on note $B_j$ le mineur principal dominant d'ordre $j$ de la matrice obtenue.

        La forme $Q$ est définie positive sur $T_a\Gamma$ si et seulement si $(-1)^p B_j > 0$ pour $2p + 1 \leqslant j \leqslant n + p$, et définie négative si et seulement si $(-1)^{j - p} B_j > 0$ pour ces mêmes $j$.

        Ce critère est admis ici : sa démonstration élimine les variables liées puis reprend la récurrence du critère de Sylvester ({{fq-mineurs|Critère de Sylvester}}). On le trouve chez H. B. Mann, « Quadratic forms with linear constraints » (*Amer. Math. Monthly* 50, n° 7, 1943, p. 430-433), et chez G. Debreu, « Definite and semidefinite quadratic forms » (*Econometrica* 20, n° 2, 1952, p. 295-300).

  - id: el-exemples
    etiquette: Applications
    nature: proposition
    titre: Trois applications des extrema liés
    texte: |
      On applique le théorème des extrema liés ({{el-lagrange|Multiplicateurs de Lagrange}}) à trois problèmes classiques. Dans chacun, l'existence d'un extremum vient d'un argument de compacité, ou se suppose, et les multiplicateurs désignent le point où il est atteint.
    enonce: |
      (i) *Inégalité arithmético-géométrique.* Pour tout entier $n \geqslant 1$ et tous réels $x_1, \dots, x_n \geqslant 0$,
      $$x_1 x_2 \cdots x_n \leqslant \Big(\frac{x_1 + \cdots + x_n}{n}\Big)^n,$$
      avec égalité si et seulement si $x_1 = \cdots = x_n$.

      (ii) *Forme quadratique sur la sphère.* Soit $A \in \lex{espace-matrices}{\mathcal M_n}(\mathbb R)$ une matrice symétrique, $n \geqslant 1$, et $q(x) = {}^txAx$. Sur la [[sphere-unite|sphère unité]] $S = \{x \in \mathbb R^n : x_1^2 + \cdots + x_n^2 = 1\}$, la fonction $q$ atteint un maximum $M$ et un minimum $m$, qui sont des [[valeur-propre|valeurs propres]] de $A$, et toute valeur propre réelle de $A$ est comprise entre $m$ et $M$.

      Plus précisément, un point $a \in S$ vérifie $\nabla q(a) = \lambda \nabla g(a)$, pour $g(x) = \sum_i x_i^2 - 1$, si et seulement si $Aa = \lambda a$, et alors $\lambda = q(a)$.

      (iii) *Distance à un ensemble de niveau.* Avec les notations du nœud {{el-niveau|Ensembles de niveau}}, soit $b \in \mathbb R^n$ et $a \in \Gamma$ tel que $dg(a)$ soit surjective. Si la restriction à $\Gamma$ de $x \mapsto \|x - b\|_2$ admet en $a$ un minimum local, alors $a - b$ est combinaison linéaire des gradients $\nabla g_1(a), \dots, \nabla g_p(a)$, et
      $$\langle a - b, v \rangle = 0 \quad \text{pour tout } v \in T_a\Gamma.$$
    preuve: |
      (i) Le cas $n = 1$ est une égalité. Soit $n \geqslant 2$, $\omega = (1, \dots, 1)$, $f(x) = x_1 \cdots x_n$ et $g(x) = x_1 + \cdots + x_n - n$, fonctions polynomiales, donc de classe $C^\infty$ ({{gd-classe-ck|Classe Cᵏ}}, (iii)).

      L'ensemble $U = \,]0, +\infty[^n$ est ouvert, comme intersection des images réciproques de $]0, +\infty[$ par les projections. Sur $U$, $dg(x)h = h_1 + \cdots + h_n$ est surjective, puisqu'elle vaut $1$ en $(1, 0, \dots, 0)$, et l'on note $\Gamma = \{x \in U : g(x) = 0\}$.

      *Existence d'un maximum.* La partie $K = \{x \in \mathbb R^n : x_i \geqslant 0 \text{ pour tout } i,\ g(x) = 0\}$ est fermée, comme intersection d'images réciproques de fermés par des applications continues, et bornée, puisque $0 \leqslant x_i \leqslant n$ ; elle est donc compacte ({{me-rn|L'espace ℝⁿ}}, (iii)), et elle contient $\omega$. La fonction continue $f$ y atteint un maximum $M$ en un point $c$ ({{tr-compacts|Compacts de ℝ}}, (iii)).

      On a $M \geqslant f(\omega) = 1 > 0$, donc tous les $c_i$ sont strictement positifs, et $c \in \Gamma$. Comme $\Gamma \subset K$, la fonction $f$ admet en $c$ un maximum lié.

      *Le point de maximum.* Par le théorème des extrema liés ({{el-lagrange|Multiplicateurs de Lagrange}}, (ii)), il existe $\lambda$ tel que $\nabla f(c) = \lambda\, \omega$, c'est-à-dire
      $$\prod_{j \neq i} c_j = \lambda \quad \text{pour tout } i.$$
      En multipliant par $c_i$, on obtient $M = \lambda c_i$ pour tout $i$. Comme $M > 0$, $\lambda$ n'est pas nul, et tous les $c_i$ valent $M/\lambda$ ; leur somme étant $n$, $c = \omega$ et $M = 1$.

      Ainsi $f \leqslant 1$ sur $K$. Si $x \in K$ vérifie $f(x) = 1$, c'est un point de maximum de $f$ sur $K$, et le raisonnement précédent, appliqué à $x$ au lieu de $c$, donne $x = \omega$.

      *Cas général.* Soient $x_1, \dots, x_n \geqslant 0$ et $s = x_1 + \cdots + x_n$. Si $s = 0$, tous les $x_i$ sont nuls et l'égalité a lieu. Sinon, $y = (n/s)\,x$ appartient à $K$, et $f(y) = (n/s)^n f(x) \leqslant 1$ est l'inégalité annoncée. L'égalité a lieu si et seulement si $y = \omega$, c'est-à-dire si tous les $x_i$ valent $s/n$.

      (ii) La fonction $g$ est polynomiale, et $dg(x)h = 2\langle x, h \rangle$. Pour $x \in S$, $dg(x)x = 2 \neq 0$ : la forme linéaire $dg(x)$ est surjective sur $\mathbb R$.

      La sphère $S$ est fermée, comme image réciproque de $\{1\}$, bornée, puisque $|x_i| \leqslant 1$, et non vide : elle est compacte ({{me-rn|L'espace ℝⁿ}}, (iii)), et la fonction polynomiale $q$ y atteint un maximum $M$ en un point $a$ et un minimum $m$ en un point $a'$ ({{tr-compacts|Compacts de ℝ}}, (iii)).

      Comme $q(x) = \sum_{j,k} a_{jk} x_j x_k$, on a $\partial_j q(x) = \sum_k (a_{jk} + a_{kj}) x_k = 2(Ax)_j$ par symétrie de $A$, donc $\nabla q(x) = 2Ax$ ; et $\nabla g(x) = 2x$. L'égalité $\nabla q(a) = \lambda \nabla g(a)$ équivaut donc à $Aa = \lambda a$, et alors, $a$ étant dans $S$,
      $$\lambda = \lambda\langle a, a \rangle = \langle Aa, a \rangle = q(a).$$

      Le point $a$ est un maximum lié de $q$ ; le théorème des extrema liés ({{el-lagrange|Multiplicateurs de Lagrange}}, (ii)) fournit $\lambda$ tel que $\nabla q(a) = \lambda \nabla g(a)$. Ainsi $Aa = \lambda a$ avec $a \neq 0$ : $\lambda$ est une valeur propre de $A$, et $\lambda = q(a) = M$. De même pour $m$, au point $a'$.

      Enfin, si $Av = \mu v$ avec $v \neq 0$, le vecteur $u = v/\sqrt{\langle v, v \rangle}$ appartient à $S$, et $q(u) = \mu\langle u, u \rangle = \mu$ est compris entre $m$ et $M$.

      (iii) La fonction $f(x) = \|x - b\|_2^2 = \sum_i (x_i - b_i)^2$ est polynomiale, et $\nabla f(x) = 2(x - b)$. Comme $t \mapsto t^2$ est croissante sur $[0, +\infty[$, $f$ admet en $a$ un minimum local lié.

      Le théorème des extrema liés donne des réels $\lambda_i$ tels que $2(a - b) = \sum_i \lambda_i \nabla g_i(a)$. Pour $v \in T_a\Gamma = \operatorname{Ker} dg(a)$ ({{el-niveau|Ensembles de niveau}}, (ii)), on a $\langle \nabla g_i(a), v \rangle = dg_i(a)v = 0$ pour tout $i$, d'où $\langle a - b, v \rangle = 0$.
    remarques:
      - |
        Pour $n = 3$ et la contrainte $x + y + z = 3$, le point $(1, 1, 1)$, de multiplicateur $\lambda = 1$, est le maximum de $xyz$ sur la partie $K$ de (i) ; le second ordre confirme qu'il est un maximum local lié strict sur le plan, et montre pourquoi il faut restreindre la hessienne à l'espace tangent. Le lagrangien $L = xyz - (x + y + z - 3)$ a pour hessienne en $(1, 1, 1)$
        $$H_L = \begin{pmatrix} 0 & 1 & 1 \\ 1 & 0 & 1 \\ 1 & 1 & 0 \end{pmatrix},$$
        indéfinie, avec $Q(1, 1, 1) = 6 > 0$ et $Q(1, -1, 0) = -2 < 0$.

        Mais sur l'espace tangent $T = \{h : h_1 + h_2 + h_3 = 0\}$, on a
        $$\begin{aligned} Q(h) &= 2(h_1h_2 + h_1h_3 + h_2h_3) \\ &= (h_1 + h_2 + h_3)^2 - (h_1^2 + h_2^2 + h_3^2) \\ &= -(h_1^2 + h_2^2 + h_3^2), \end{aligned}$$
        forme définie négative, et le nœud {{el-second-ordre|Second ordre}}, (iii), donne un maximum local lié strict.

        Sur $\mathbb R^3$ tout entier, et non sur l'ouvert $U = \,]0, +\infty[^3$, le système de Lagrange a d'autres solutions, comme $(3, 0, 0)$ avec $\lambda = 0$ ; elles ne sont pas des extrema liés, puisque $xyz$ change de signe au voisinage de ces points sur le plan $x + y + z = 3$. C'est en se restreignant à $U$ que la preuve de (i) les écarte.
      - |
        Le second ordre départage aussi un minimum et un col. Pour $A = \begin{pmatrix} 1 & 0 & 0 \\ 0 & 2 & 0 \\ 0 & 0 & 3 \end{pmatrix}$ et $q(x) = x_1^2 + 2x_2^2 + 3x_3^2$ sur la sphère de $\mathbb R^3$, les points de la sphère où le système de Lagrange est satisfait sont, par (ii), les vecteurs propres unitaires $\pm\delta_1$, $\pm\delta_2$, $\pm\delta_3$, de multiplicateurs $1$, $2$ et $3$.

        Au point $a$ de multiplicateur $\lambda$, le lagrangien $q - \lambda g$ a pour hessienne $2(A - \lambda I_3)$, et l'espace tangent est le plan $\{h : \langle a, h \rangle = 0\}$.

        En $\pm\delta_1$, la restriction de $Q$ au plan engendré par $\delta_2$ et $\delta_3$ est $2h_2^2 + 4h_3^2$, définie positive : c'est un minimum local lié strict, qui vaut $1$. En $\pm\delta_3$, la restriction au plan de $\delta_1$ et $\delta_2$ est $-4h_1^2 - 2h_2^2$, et c'est un maximum, qui vaut $3$.

        En $\pm\delta_2$, la restriction au plan de $\delta_1$ et $\delta_3$ est $-2h_1^2 + 2h_3^2$, indéfinie : par (iv) du nœud {{el-second-ordre|Second ordre}}, il n'y a pas d'extremum lié, ce qui se voit directement, puisque $q$ vaut $2 - x_1^2 < 2$ sur le grand cercle $x_3 = 0$ et $2 + x_3^2 > 2$ sur le grand cercle $x_1 = 0$. Par analogie avec le nœud {{fq-extremums|Extrema}}, on dit, de façon imagée, que $\delta_2$ est un col de $q$ sur la sphère.
      - |
        Le point (ii) contient l'étape décisive du théorème spectral : toute matrice symétrique réelle a une valeur propre réelle, et la plus grande est le maximum de ${}^txAx$ sur la sphère. Le nœud {{f-spectral-fini|Théorème spectral}} de l'analyse fonctionnelle l'obtient sans calcul différentiel, par le quotient de Rayleigh, puis en déduit par récurrence une base orthonormée de vecteurs propres. L'exemple de $xy$ sur le cercle $x^2 + y^2 = 2$ ({{el-lagrange|Multiplicateurs de Lagrange}}) en est un cas : la matrice $\begin{pmatrix} 0 & 1/2 \\ 1/2 & 0 \end{pmatrix}$ a pour valeurs propres $\pm\frac12$, que le carré du rayon, $2$, multiplie par $2$.
      - |
        Le point (iii) dit que le segment qui joint $b$ à un point le plus proche de $\Gamma$ est orthogonal à l'espace tangent. Pour un hyperplan affine $\Gamma = \{x : \langle u, x \rangle = c\}$, avec $u \neq 0$, il donne $a = b + tu$, et la contrainte impose $t = (c - \langle u, b \rangle)/\langle u, u \rangle$.

        Ce candidat est bien le point le plus proche : pour $x \in \Gamma$, le vecteur $x - a$ vérifie $\langle u, x - a \rangle = 0$, donc il est orthogonal à $a - b$, et
        $$\|x - b\|_2^2 = \|x - a\|_2^2 + \|a - b\|_2^2.$$
        On retrouve la distance $|c - \langle u, b \rangle| / \|u\|_2$ d'un point à un hyperplan.

aretes:
