# Niveau 1 : structure interne du nœud « Théorie algébrique des nombres ».
# Entiers algébriques (astuce du déterminant), anneaux d'entiers des corps quadratiques,
# norme et unités, entiers de Gauss et théorème des deux carrés de Fermat, défaut de
# factorialité de ℤ[√−5] et idéaux ; factorisation unique des idéaux dans l'anneau des entiers d'un
# corps quadratique (idéal inverse, démontrée le 29 oct. 2026) ; norme d'un idéal, élément de petite
# norme par le principe des tiroirs, finitude du groupe des classes et calcul pour ℤ[√−5] (démontrés
# le 29 oct. 2026).
# Parents : théorie de Galois (extensions, polynôme minimal, corps finis), géométrie
# algébrique (spectre, idéaux premiers).

graphe: tan
titre: Théorie algébrique des nombres
conteneur: tan

entrees:
  galois: [an-entiers, an-gauss]
  geoalg: [an-ideaux]
  ac: [an-ideaux]

noeuds:
  - id: an-entiers
    etiquette: Entiers algébriques
    nature: théorème
    titre: Entiers algébriques
    texte: |
      Un **corps de nombres** est une [[extension-corps|extension]] finie $K$ de $\lex{ensemble-rationnels}{\mathbb Q}$ contenue dans $\lex{ensemble-complexes}{\mathbb C}$. Un élément $\alpha \in \mathbb C$ est un [[entier-algebrique|entier algébrique]] s'il annule un polynôme **unitaire** à coefficients dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}$. Un sous-groupe $M$ de $(\mathbb C, +)$ est **de type fini** s'il est engendré par un nombre fini d'éléments.
    enonce: |
      (i) $\alpha$ est un entier algébrique si et seulement s'il existe un sous-groupe de type fini $M \neq \{0\}$ de $\mathbb C$ tel que $\alpha M \subset M$.

      (ii) Les entiers algébriques forment un sous-anneau de $\mathbb C$. Pour un corps de nombres $K$, les entiers algébriques de $K$ forment un anneau $\lex{anneau-entiers}{\mathcal O_K}$, l'**anneau des entiers** de $K$.

      (iii) Un nombre rationnel qui est un entier algébrique est un entier : $\mathcal O_{\mathbb Q} = \mathbb Z$.

      (iv) Le polynôme minimal sur $\mathbb Q$ d'un entier algébrique est à coefficients entiers.
    preuve: |
      (i) Si $\alpha^n = -\sum_{k<n} c_k\alpha^k$ avec $c_k \in \mathbb Z$, le groupe $M$ engendré par $1, \alpha, \dots, \alpha^{n-1}$ convient : par récurrence, toute puissance de $\alpha$ y appartient.

      Réciproquement, si $M$ est engendré par $x_1, \dots, x_m$, non tous nuls, écrivons
      $$\alpha x_i = \sum_j a_{ij}x_j,$$
      avec $a_{ij} \in \mathbb Z$. La matrice $\alpha I - A$ annule le vecteur non nul $(x_j)$ de $\lex{n-uplet}{\mathbb C^m}$, donc son déterminant est nul ({{v-det-matrice|Déterminant d'une matrice}}, (ii)) ; or $\det(XI - A)$ est un polynôme unitaire à coefficients entiers, par la formule du déterminant.

      (ii) Si $\alpha$ et $\beta$ sont entiers, de degrés unitaires $n$ et $p$, le groupe $M$ engendré par les $\alpha^i\beta^j$, $i < n$, $j < p$, contient $1$, et il est stable par multiplication par $\alpha$ et par $\beta$, donc par $\alpha \pm \beta$ et $\alpha\beta$ ; on applique (i). Pour $K$, on intersecte avec le corps $K$.

      (iii) Si $r = a/b$ avec $a \wedge b = 1$, $b \geqslant 1$, annule $X^n + \sum_{k<n} c_kX^k$, alors
      $$a^n = -b\sum_{k<n}c_ka^kb^{n-1-k},$$
      et $b$ divise $a^n$ ; par le lemme de Gauss ({{z-bezout|Bézout}}), $b$ divise $1$.

      (iv) Soit $P$ unitaire entier annulant $\alpha$. Le polynôme minimal $\mu$ divise $P$ ; dans un corps de décomposition, ses racines sont des racines de $P$, donc des entiers algébriques. Ses coefficients, fonctions polynomiales symétriques à coefficients entiers de ces racines, sont des entiers algébriques par (ii), et rationnels : ils sont entiers par (iii).
    remarques:
      - |
        Le nombre d'or $\frac{1 + \sqrt 5}{2}$, racine de $X^2 - X - 1$, est un entier algébrique, bien qu'il ait un dénominateur. L'erreur la plus répandue est de croire que $\mathcal O_K$ est toujours $\mathbb Z[\alpha]$ pour un générateur « évident » $\alpha$ de $K$ : pour $K = \mathbb Q(\sqrt 5)$, $\mathbb Z[\sqrt 5]$ est strictement plus petit que $\mathcal O_K$.

  - id: an-quadratiques
    etiquette: Corps quadratiques
    nature: théorème
    titre: Anneaux d'entiers des corps quadratiques
    texte: |
      Soit $d \neq 0, 1$ un entier sans facteur carré et $K = \mathbb Q(\sqrt d)$, de degré $2$. Le **conjugué** de $\alpha = a + b\sqrt d$, $a, b \in \lex{ensemble-rationnels}{\mathbb Q}$, est $\bar\alpha = a - b\sqrt d$ ; sa **trace** est $\alpha + \bar\alpha = 2a$ et sa [[norme-algebrique|norme]] $N(\alpha) = \alpha\bar\alpha = a^2 - db^2$.
    enonce: |
      (i) $\alpha \in K$ est un entier algébrique si et seulement si sa trace et sa norme sont des entiers.

      (ii) $\lex{anneau-entiers}{\mathcal O_K} = \mathbb Z[\sqrt d]$ si $d \equiv 2$ ou $3 \pmod 4$, et $\mathcal O_K = \lex{ensemble-entiers-relatifs}{\mathbb Z}\big[\frac{1 + \sqrt d}{2}\big]$ si $d \equiv 1 \pmod 4$.
    preuve: |
      (i) Si $b = 0$, c'est {{an-entiers|Entiers algébriques}}, (iii). Sinon, $\alpha \notin \mathbb Q$ annule $X^2 - 2aX + (a^2 - db^2)$, qui est donc son polynôme minimal ; on applique {{an-entiers|Entiers algébriques}}, (iv), et la réciproque est immédiate.

      (ii) Soit $\alpha = a + b\sqrt d$ entier. Posons $A = 2a \in \mathbb Z$ ; alors
      $$4N(\alpha) = A^2 - d(2b)^2 \in 4\mathbb Z,$$
      donc $d(2b)^2 \in \mathbb Z$, et, $d$ étant sans facteur carré, $B = 2b \in \mathbb Z$. La condition devient $A^2 \equiv dB^2 \pmod 4$.

      Les carrés valent $0$ ou $1$ modulo $4$. Si $d \equiv 2, 3$, elle force $A$ et $B$ pairs : $a, b \in \mathbb Z$. Si $d \equiv 1$, elle force $A \equiv B \pmod 2$, et
      $$\alpha = \frac{A - B}{2} + B\,\frac{1 + \sqrt d}{2}$$
      avec $\frac{A - B}2 \in \mathbb Z$.

      Réciproquement, ces éléments sont entiers par (i), $\frac{1 + \sqrt d}{2}$ ayant pour trace $1$ et pour norme $\frac{1 - d}{4} \in \mathbb Z$.
    remarques:
      - |
        Pour $d = -1$, on obtient l'anneau $\mathbb Z[i]$ des **entiers de Gauss** ; pour $d = -3$, l'anneau $\mathbb Z[j]$ des entiers d'Eisenstein, où $j = \frac{-1 + \sqrt{-3}}2$ est une racine cubique de l'unité. Ce sont des réseaux du plan complexe, carré et hexagonal.

        ```schema an-quadratiques
        La maille bleue, de sommets $0$, $1$, $1 + \omega$ et $\omega$ pour $\omega = i$ ou $\omega = j$, pave le plan par les translations du réseau. Les points de module $1$, en rouge, sont au nombre de quatre dans $\mathbb Z[i]$ et de six dans $\mathbb Z[j]$ : ce sont les unités que décrit le nœud suivant.
        ```

  - id: an-unites
    etiquette: Norme, unités
    nature: proposition
    titre: Norme et unités
    enonce: |
      (i) La norme est multiplicative : $N(\alpha\beta) = N(\alpha)N(\beta)$.

      (ii) Un élément $\alpha \in \lex{anneau-entiers}{\mathcal O_K}$ est inversible dans $\mathcal O_K$ si et seulement si $N(\alpha) = \pm 1$.

      (iii) Pour $d < 0$, les unités sont en nombre fini : $\pm 1$ en général, $\pm 1, \pm i$ pour $d = -1$, et les six racines sixièmes de l'unité pour $d = -3$.

      (iv) Pour $d = 2$, $1 + \sqrt 2$ est une unité d'ordre infini : $\mathbb Z[\sqrt 2]$ a une infinité d'unités.
    preuve: |
      (i) La conjugaison $\alpha \mapsto \bar\alpha$ est un automorphisme de $K$, puisque $\sqrt d$ et $-\sqrt d$ ont le même polynôme minimal ({{gs-decomposition|Corps de décomposition}}) ; donc $\overline{\alpha\beta} = \bar\alpha\bar\beta$.

      (ii) Si $\alpha\beta = 1$ avec $\beta \in \mathcal O_K$, $N(\alpha)N(\beta) = 1$ avec des normes entières ({{an-quadratiques|Corps quadratiques}}). Réciproquement, si $N(\alpha) = \pm 1$, $\alpha^{-1} = \pm\bar\alpha$, et $\bar\alpha$ est entier, ayant même trace et même norme que $\alpha$.

      (iii) Pour $d < 0$, $N(a + b\sqrt d) = a^2 + |d|b^2$, avec $a, b \in \frac12\lex{ensemble-entiers-relatifs}{\mathbb Z}$ ; l'équation $N = 1$ n'a qu'un nombre fini de solutions, que l'on énumère.

      (iv) $N(1 + \sqrt 2) = 1 - 2 = -1$. Comme $1 + \sqrt 2 > 1$, ses puissances sont strictement croissantes, donc deux à deux distinctes.
    remarques:
      - |
        Les unités de $\mathbb Z[\sqrt 2]$ donnent toutes les solutions de l'équation de Pell-Fermat $x^2 - 2y^2 = \pm 1$ : $(1 + \sqrt 2)^2 = 3 + 2\sqrt 2$, $(1 + \sqrt 2)^3 = 7 + 5\sqrt 2$, et $49 - 50 = -1$.

        ```schema an-unites
        Les puissances $1$, $1 + \sqrt 2$ et $3 + 2\sqrt 2$, placées au point $(x, y)$ quand elles s'écrivent $x + y\sqrt 2$, passent alternativement de l'hyperbole $x^2 - 2y^2 = 1$ à l'hyperbole $x^2 - 2y^2 = -1$, puisque la multiplication par $1 + \sqrt 2$ multiplie la norme par $-1$. Les deux branches s'approchent de l'asymptote $y = x/\sqrt 2$, en pointillé, et la puissance suivante, $7 + 5\sqrt 2$, est déjà hors du cadre.
        ```

        Le théorème des unités de Dirichlet décrit en général le groupe des unités d'un corps de nombres ; il est admis ici.

  - id: an-gauss
    etiquette: Deux carrés
    nature: théorème
    titre: Entiers de Gauss et théorème des deux carrés
    enonce: |
      (i) $\lex{entiers-gauss}{\mathbb Z[i]}$ est euclidien pour la norme : pour $\alpha, \beta \in \mathbb Z[i]$, $\beta \neq 0$, il existe $q, r$ avec $\alpha = \beta q + r$ et $N(r) < N(\beta)$. Il est principal, et le lemme d'Euclide y vaut : un irréductible qui divise un produit divise l'un des facteurs.

      (ii) *Fermat.* Un nombre premier $p$ impair est somme de deux carrés si et seulement si $p \equiv 1 \pmod 4$.
    preuve: |
      (i) Écrivons $\alpha/\beta = x + iy$ avec $x, y \in \lex{ensemble-rationnels}{\mathbb Q}$, et choisissons des entiers $m, n$ avec $|x - m|, |y - n| \leqslant \frac12$. Pour $q = m + in$, on a $N(\alpha/\beta - q) \leqslant \frac14 + \frac14 < 1$, et $r = \alpha - \beta q$ vérifie
      $$N(r) = N(\beta)N(\alpha/\beta - q) < N(\beta).$$

      ```schema an-gauss
      Pour $\alpha = 7 + 5i$ et $\beta = 2 + i$, le quotient $\alpha/\beta = \frac{19 + 3i}{5}$ tombe dans le carré de côté $1$ centré en $q = 4 + i$, lui-même contenu dans le disque où $N(z - q) < 1$. Le reste $r = \alpha - \beta q = -i$ est de norme $1 < N(\beta) = 5$.
      ```

      Comme pour $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ ({{z-ideaux|Idéaux de ℤ}}), un idéal non nul est engendré par un élément de norme minimale.

      Si $\pi$ est irréductible et ne divise pas $\alpha$, l'idéal $(\pi, \alpha)$, engendré par un diviseur de $\pi$, est tout l'anneau : $1 = u\pi + v\alpha$, et si $\pi \mid \alpha\beta$, alors $\pi \mid u\pi\beta + v\alpha\beta = \beta$.

      (ii) Si $p = a^2 + b^2$, les carrés valant $0$ ou $1$ modulo $4$, $p \equiv 1$.

      Réciproquement, si $p \equiv 1 \pmod 4$, le groupe $\lex{corps-fini}{\mathbb F_p}^\times$ est cyclique d'ordre $p - 1$, divisible par $4$ ({{gs-corps-finis|Corps finis}}) : il contient un élément $x$ d'ordre $4$, et $x^2 = -1$. Donc $p$ divise
      $$x^2 + 1 = (x + i)(x - i),$$
      sans diviser aucun facteur, puisque $\frac{x \pm i}{p} \notin \mathbb Z[i]$.

      Par le lemme d'Euclide, $p$ n'est pas irréductible : $p = \alpha\beta$ avec $N(\alpha), N(\beta) > 1$ ({{an-unites|Norme, unités}}). Comme $N(\alpha)N(\beta) = p^2$, $N(\alpha) = p$, et $\alpha = a + bi$ donne $p = a^2 + b^2$.
    remarques:
      - |
        On vérifie $5 = 1 + 4$, $13 = 4 + 9$, $17 = 1 + 16$, $29 = 4 + 25$, $37 = 1 + 36$, $41 = 16 + 25$, alors que $3$, $7$, $11$, $19$, $23$ ne sont sommes d'aucun couple de carrés.

        ```schema an-gauss-2
        Les huit points $\pm 2 \pm 3i$ et $\pm 3 \pm 2i$ du réseau $\mathbb Z[i]$ sont sur le cercle d'équation $|z|^2 = 13$, ce qui traduit $13 = 4 + 9$ ; le cercle $|z|^2 = 7$ ne passe par aucun point du réseau, puisque $7$ n'est somme d'aucun couple de carrés.
        ```

        La démonstration n'exhibe pas la décomposition ; l'algorithme d'Euclide dans $\mathbb Z[i]$, appliqué à $p$ et $x + i$, la calcule.

  - id: an-ideaux
    etiquette: Idéaux
    nature: proposition
    titre: Défaut de factorialité et idéaux
    enonce: |
      (i) Dans $\mathbb Z[\sqrt{-5}]$, $6 = 2 \cdot 3 = (1 + \sqrt{-5})(1 - \sqrt{-5})$ sont deux décompositions en [[element-irreductible|irréductibles]] non associés ({{ac-divisibilite|Divisibilité}}) : l'anneau n'est pas [[anneau-factoriel|factoriel]], et $2$ est irréductible sans être [[element-premier|premier]].

      (ii) L'idéal $\mathfrak p = (2, 1 + \sqrt{-5})$ vérifie $\mathfrak p^2 = (2)$ ; il n'est pas principal.

      (iii) Dans l'anneau des entiers d'un corps quadratique, tout idéal non nul $I$ est d'indice fini, et tout idéal premier non nul est maximal.
    preuve: |
      (i) $N(a + b\sqrt{-5}) = a^2 + 5b^2$ ne prend jamais les valeurs $2$ ni $3$. Les normes de $2$, $3$, $1 \pm \sqrt{-5}$ valent $4$, $9$, $6$ ; une factorisation non triviale de l'un d'eux ferait apparaître un facteur de norme $2$ ou $3$ ({{an-unites|Norme, unités}}) : ils sont irréductibles. Les seules unités sont $\pm 1$, et $2$ n'est associé ni à $1 + \sqrt{-5}$ ni à $1 - \sqrt{-5}$.

      Enfin $2$ divise $(1 + \sqrt{-5})(1 - \sqrt{-5}) = 6$ sans diviser aucun des deux facteurs, puisque $\frac{1 \pm \sqrt{-5}}2 \notin \mathbb Z[\sqrt{-5}]$.

      (ii) $\mathfrak p^2$ est engendré par $4$, $2(1 + \sqrt{-5})$ et $(1 + \sqrt{-5})^2 = -4 + 2\sqrt{-5}$, tous multiples de $2$ ; il contient
      $$2(1 + \sqrt{-5}) - (-4 + 2\sqrt{-5}) - 4 = 2.$$
      Donc $\mathfrak p^2 = (2)$.

      Si $\mathfrak p = (\gamma)$, alors $N(\gamma)^2 = N(2) = 16$ et $N(\gamma) = 4$, puisque $N(\gamma) = 2$ est impossible ; $\gamma$ diviserait $2$ avec un quotient de norme $1$, donc $\gamma = \pm 2$, mais $1 + \sqrt{-5} \notin (2)$.

      (iii) $I$ contient $n = N(\alpha) = \alpha\bar\alpha \neq 0$ pour un $\alpha \in I$ non nul, donc $n\lex{anneau-entiers}{\mathcal O_K} \subset I$, et $\mathcal O_K/n\mathcal O_K$ est fini, $\mathcal O_K$ étant engendré comme groupe par deux éléments.

      Si $\mathfrak p$ est premier, $\mathcal O_K/\mathfrak p$ est un anneau intègre fini ({{a-premier-maximal|Idéaux premiers et maximaux}}), donc un corps, la multiplication par un élément non nul étant injective, donc bijective ; et $\mathfrak p$ est maximal.
    remarques:
      - |
        Kummer et Dedekind ont restauré l'unicité au niveau des idéaux : dans $\mathcal O_K$, tout idéal non nul est, de façon unique, produit d'idéaux premiers. Ce théorème est démontré, pour les corps quadratiques, dans les trois nœuds suivants, jusqu'à {{an-factorisation|Factorisation des idéaux}}.
      - |
        Le point (iii) dit que $\lex{spectre-premier}{\operatorname{Spec}}\mathcal O_K$, en {{geoalg|géométrie algébrique}}, est de dimension $1$ : un point générique, l'idéal nul, et des points fermés, les idéaux maximaux. L'arithmétique des corps de nombres est ainsi la géométrie de « courbes » au-dessus de $\operatorname{Spec}\lex{ensemble-entiers-relatifs}{\mathbb Z}$.

  - id: an-dedekind-lemmes
    etiquette: Trois lemmes
    nature: lemme
    titre: Idéaux de l'anneau des entiers d'un corps quadratique
    texte: |
      Dans ce nœud et les deux suivants, $K = \mathbb Q(\sqrt d)$ est un corps quadratique ({{an-quadratiques|Corps quadratiques}}) et $\mathcal O = \lex{anneau-entiers}{\mathcal O_K}$. Pour un idéal non nul $I$, l'**indice** $[\mathcal O : I]$ est le nombre d'éléments, fini, de l'anneau $\mathcal O/I$ ({{an-ideaux|Idéaux}}, (iii)).

      Le produit $IJ$ de deux idéaux est celui du nœud {{ac-chinois|Lemme chinois}} ; plus généralement, pour deux sous-groupes $M$, $N$ de $K$ stables par multiplication par $\mathcal O$, on note $MN$ l'ensemble des sommes finies $\sum x_iy_i$, $x_i \in M$, $y_i \in N$, et ce produit est associatif et commutatif, pour la même raison.
    enonce: |
      (i) Si $I \subsetneq J$ sont deux idéaux non nuls, $[\mathcal O : J] < [\mathcal O : I]$. Tout idéal non nul est engendré, comme groupe, par une partie finie.

      (ii) Si $I$ est un idéal non nul et $x \in K$ vérifie $xI \subset I$, alors $x \in \mathcal O$.

      (iii) Tout idéal non nul $I$ contient un produit $\mathfrak p_1 \cdots \mathfrak p_r$ d'idéaux premiers non nuls, le produit vide valant $\mathcal O$.
    preuve: |
      (i) Dans le groupe fini $\mathcal O/I$, le sous-groupe $J/I$ a au moins deux éléments, puisque $J \neq I$, et ses classes sont les images réciproques des éléments de $\mathcal O/J$ par la surjection $x + I \mapsto x + J$. Le théorème de Lagrange ({{gs-lagrange|Lagrange}}) donne
      $$\begin{aligned} [\mathcal O : I] &= [\mathcal O : J] \cdot |J/I| \\ &> [\mathcal O : J]. \end{aligned}$$

      Ensuite, $I$ contient l'entier $n = |N(\alpha)| \geqslant 1$ pour un $\alpha \in I$ non nul, comme dans la preuve de {{an-ideaux|Idéaux}}, (iii), donc le groupe $n\mathcal O$, engendré par $n$ et $n\omega$ si $\mathcal O = \mathbb Z + \mathbb Z\omega$ ({{an-quadratiques|Corps quadratiques}}, (ii)) ; et $I$ est la réunion de ses classes modulo $n\mathcal O$, en nombre fini puisque $\mathcal O/n\mathcal O$ est fini. Un représentant de chaque classe, avec $n$ et $n\omega$, engendre $I$ ; ce sont des choix en nombre fini.

      (ii) Par (i), $I$ est un sous-groupe non nul de $\lex{ensemble-complexes}{\mathbb C}$ de type fini, stable par multiplication par $x$ : $x$ est un [[entier-algebrique|entier algébrique]] ({{an-entiers|Entiers algébriques}}, (i)), et, comme il appartient à $K$, il est dans $\mathcal O$.

      (iii) Par récurrence sur l'indice. Si $I = \mathcal O$, le produit vide convient ; si $I$ est premier, $I$ lui-même.

      Sinon, il existe $a, b \notin I$ tels que $ab \in I$. Les idéaux $I + a\mathcal O$ et $I + b\mathcal O$ contiennent strictement $I$, donc sont d'indice plus petit par (i), et contiennent chacun un produit de premiers non nuls par hypothèse de récurrence. Leur produit est contenu dans $I + ab\mathcal O = I$, et contient le produit de ces deux produits.
    remarques:
      - |
        Un anneau intègre est **intégralement clos** si tout élément de son corps des fractions qui annule un polynôme unitaire à coefficients dans l'anneau lui appartient ; $\mathcal O$ l'est, et le point (ii) est la forme sous laquelle cette propriété sert dans la suite, avec l'écriture $\mathcal O = \mathbb Z + \mathbb Z\omega$ utilisée en (i).

        L'anneau $\mathbb Z[\sqrt 5]$, strictement plus petit que $\mathcal O_{\mathbb Q(\sqrt 5)}$, ne l'est pas : le nombre d'or, racine de $X^2 - X - 1$, est dans son corps des fractions sans lui appartenir.

        La forme (ii) y échoue aussi : le nombre d'or $\phi = \frac{1 + \sqrt 5}{2}$ stabilise l'idéal de $\mathbb Z[\sqrt 5]$ engendré par $2$ et $1 + \sqrt 5$, car $\phi \cdot 2 = 1 + \sqrt 5$ et
        $$\phi(1 + \sqrt 5) = 3 + \sqrt 5 = 2 + (1 + \sqrt 5).$$

  - id: an-inverse
    etiquette: Idéal inverse
    nature: théorème
    titre: Tout idéal premier non nul est inversible
    texte: |
      Pour un idéal premier non nul $\mathfrak p$ de $\mathcal O$, on pose $\mathfrak p' = \{x \in K : x\mathfrak p \subset \mathcal O\}$ ; c'est un sous-groupe de $K$ stable par multiplication par $\mathcal O$, qui contient $\mathcal O$.
    enonce: |
      (i) $\mathfrak p'$ n'est pas contenu dans $\mathcal O$.

      (ii) $\mathfrak p\mathfrak p' = \mathcal O$.

      (iii) Pour tout idéal non nul $I$, $I\mathfrak p' \neq I$.
    preuve: |
      (i) Soit $a \in \mathfrak p$ non nul. Par {{an-dedekind-lemmes|Trois lemmes}}, (iii), l'idéal $a\mathcal O$ contient des produits d'idéaux premiers non nuls ; soit $r$ le plus petit nombre de facteurs d'un tel produit ({{n-ordre|Bon ordre sur ℕ}}), et $\mathfrak p_1 \cdots \mathfrak p_r \subset a\mathcal O$ l'un d'eux. On a $r \geqslant 1$, puisque $a$, élément de $\mathfrak p$, n'est pas inversible.

      Comme $\mathfrak p \supset \mathfrak p_1 \cdots \mathfrak p_r$ et que $\mathfrak p$ est premier, $\mathfrak p$ contient l'un des $\mathfrak p_i$ : sinon, des $x_i \in \mathfrak p_i \setminus \mathfrak p$ auraient un produit dans $\mathfrak p$. Disons $\mathfrak p \supset \mathfrak p_1$ ; comme $\mathfrak p_1$ est maximal ({{an-ideaux|Idéaux}}, (iii)) et $\mathfrak p \neq \mathcal O$, $\mathfrak p = \mathfrak p_1$.

      Par minimalité de $r$, $\mathfrak p_2 \cdots \mathfrak p_r \not\subset a\mathcal O$ ; soit $b$ un élément de $\mathfrak p_2 \cdots \mathfrak p_r$ hors de $a\mathcal O$. Alors
      $$b\mathfrak p \subset \mathfrak p_1 \cdots \mathfrak p_r \subset a\mathcal O,$$
      donc $\frac ba\,\mathfrak p \subset \mathcal O$ : $\frac ba \in \mathfrak p'$, et $\frac ba \notin \mathcal O$, puisque $b \notin a\mathcal O$.

      (iii) Si $I\mathfrak p' = I$, tout $x \in \mathfrak p'$ vérifie $xI \subset I$, donc $x \in \mathcal O$ ({{an-dedekind-lemmes|Trois lemmes}}, (ii)), ce que (i) interdit.

      (ii) Comme $1 \in \mathfrak p'$, $\mathfrak p \subset \mathfrak p\mathfrak p' \subset \mathcal O$, et $\mathfrak p\mathfrak p'$ est un idéal. Par maximalité de $\mathfrak p$, il vaut $\mathfrak p$ ou $\mathcal O$, et (iii), appliqué à $I = \mathfrak p$, exclut le premier cas.
    remarques:
      - |
        Dans $\mathbb Z[\sqrt{-5}]$, pour $\mathfrak p = (2, 1 + \sqrt{-5})$, on trouve $\mathfrak p' = \frac12\,\mathfrak p$. En effet, $\mathfrak p^2 = (2)$ ({{an-ideaux|Idéaux}}, (ii)), donc $\frac12\,\mathfrak p \cdot \mathfrak p = \mathcal O$ et $\frac12\,\mathfrak p \subset \mathfrak p'$ ; réciproquement, si $x\mathfrak p \subset \mathcal O$, alors $2x \in x\mathfrak p^2 \subset \mathfrak p$. L'élément $\frac{1 + \sqrt{-5}}2$ de $\mathfrak p'$ n'est pas entier : c'est l'élément $\frac ba$ de la preuve, pour $a = 2$ et $b = 1 + \sqrt{-5}$.
      - |
        L'erreur la plus répandue est de croire que $\mathfrak p'$ est un idéal de $\mathcal O$. Ce n'est qu'un sous-groupe de $K$, stable par $\mathcal O$, et $a\mathfrak p' \subset \mathcal O$ pour tout $a \in \mathfrak p$ non nul : un **idéal fractionnaire**, c'est-à-dire un tel sous-groupe non nul $M$ pour lequel $dM \subset \mathcal O$ avec un $d \neq 0$. Il contient strictement $\mathcal O$ ; c'est précisément en sortant de $\mathcal O$ que l'on trouve un inverse.

  - id: an-factorisation
    etiquette: Factorisation des idéaux
    nature: théorème
    titre: Factorisation unique des idéaux
    enonce: |
      Tout idéal non nul $I$ de $\mathcal O$ s'écrit $I = \mathfrak p_1 \cdots \mathfrak p_r$, produit d'idéaux premiers non nuls, et cette écriture est unique à l'ordre des facteurs près. Par suite, si $I$, $J$, $J'$ sont des idéaux de $\mathcal O$ avec $I \neq \{0\}$ et $IJ = IJ'$, alors $J = J'$.
    preuve: |
      *Existence*, par récurrence sur l'indice $[\mathcal O : I]$. Si $I = \mathcal O$, le produit vide convient. Sinon, parmi les idéaux $J \neq \mathcal O$ qui contiennent $I$, en nombre fini puisqu'ils correspondent à des parties de l'ensemble fini $\mathcal O/I$, prenons-en un d'indice minimal, $\mathfrak p$ ; il est maximal par {{an-dedekind-lemmes|Trois lemmes}}, (i), donc premier ({{a-premier-maximal|Idéaux premiers, maximaux}}, (iii)).

      Alors $I\mathfrak p' \subset \mathfrak p\mathfrak p' = \mathcal O$ est un idéal, il contient $I$ puisque $1 \in \mathfrak p'$, et il est différent de $I$ ({{an-inverse|Idéal inverse}}, (iii)) : il est d'indice plus petit, et s'écrit $\mathfrak p_2 \cdots \mathfrak p_r$ par hypothèse de récurrence. Donc
      $$I = I(\mathfrak p'\mathfrak p) = (I\mathfrak p')\mathfrak p = \mathfrak p\,\mathfrak p_2 \cdots \mathfrak p_r.$$

      *Unicité*, par récurrence sur $r$. Si $\mathfrak p_1 \cdots \mathfrak p_r = \mathfrak q_1 \cdots \mathfrak q_s$ et $r = 0$, alors $\mathcal O = \mathfrak q_1 \cdots \mathfrak q_s$, contenu dans $\mathfrak q_1 \neq \mathcal O$ si $s \geqslant 1$ : donc $s = 0$.

      Si $r \geqslant 1$, alors $s \geqslant 1$ par le cas précédent, les rôles étant échangés, et $\mathfrak p_1$ contient $\mathfrak q_1 \cdots \mathfrak q_s$, donc l'un des $\mathfrak q_j$, comme dans la preuve de {{an-inverse|Idéal inverse}}, (i), et $\mathfrak p_1 = \mathfrak q_j$ par maximalité.

      En multipliant par $\mathfrak p_1'$, qui vérifie $\mathfrak p_1'\mathfrak p_1 = \mathcal O$, on simplifie par $\mathfrak p_1$, et l'hypothèse de récurrence conclut. La simplification par $I$ s'obtient de même, facteur premier par facteur premier.
    remarques:
      - |
        Dans $\mathbb Z[\sqrt{-5}]$, soient $\mathfrak p = (2, 1 + \sqrt{-5})$, $\mathfrak q = (3, 1 + \sqrt{-5})$ et $\mathfrak q' = (3, 1 - \sqrt{-5})$. Ils sont premiers. En effet, pour un nombre premier $\ell$ et un entier $c$ tel que $c^2 \equiv -5 \pmod \ell$, l'application $a + b\sqrt{-5} \mapsto \overline{a + bc}$ est un morphisme d'anneaux surjectif sur le corps $\mathbb Z/\ell\mathbb Z$, comme on le vérifie en développant un produit.

        Pour $(\ell, c) = (2, 1)$, $(3, -1)$ et $(3, 1)$, son noyau contient $\ell$ et $1 \pm \sqrt{-5}$, et il est contenu dans l'idéal correspondant : si $a + bc \equiv 0$, alors
        $$a + b\sqrt{-5} = b(\sqrt{-5} - c) + (a + bc),$$
        où $\sqrt{-5} - c$ vaut $\sqrt{-5} - 1 = (1 + \sqrt{-5}) - 2$, $1 + \sqrt{-5}$ ou $-(1 - \sqrt{-5})$. Les trois idéaux sont donc des noyaux de morphismes surjectifs vers des corps, donc maximaux, puis premiers ({{a-premier-maximal|Idéaux premiers, maximaux}}, (ii) et (iii)).

        Ensuite $\mathfrak q\mathfrak q'$ est engendré par $9$, $3(1 - \sqrt{-5})$, $3(1 + \sqrt{-5})$ et $(1 + \sqrt{-5})(1 - \sqrt{-5}) = 6$, tous multiples de $3$, et contient $9 - 6 = 3$ : $\mathfrak q\mathfrak q' = (3)$. Le même calcul donne $\mathfrak p\mathfrak q = (1 + \sqrt{-5})$ et $\mathfrak p\mathfrak q' = (1 - \sqrt{-5})$, et l'on a vu $\mathfrak p^2 = (2)$ ({{an-ideaux|Idéaux}}, (ii)) ; un calcul des réseaux de $\mathbb Z^2$ correspondants le confirme. Les deux factorisations de $6$ en irréductibles,
        $$6 = 2 \cdot 3 = (1 + \sqrt{-5})(1 - \sqrt{-5}),$$
        sont deux façons de regrouper les quatre facteurs de l'unique factorisation $(6) = \mathfrak p^2\mathfrak q\mathfrak q'$ : $(\mathfrak p^2)(\mathfrak q\mathfrak q')$ et $(\mathfrak p\mathfrak q)(\mathfrak p\mathfrak q')$.

        Aucun des quatre facteurs n'est principal. Pour $\mathfrak p$, c'est {{an-ideaux|Idéaux}}, (ii). Si l'on avait $\mathfrak q = (\gamma)$, $N(\gamma)$ diviserait $N(3) = 9$ et $N(1 + \sqrt{-5}) = 6$ ({{an-unites|Norme, unités}}, (i)), donc $3$ ; or $3$ n'est pas de la forme $a^2 + 5b^2$, et $N(\gamma) = 1$ ferait de $\mathfrak q$ l'anneau tout entier, puis $\mathfrak q' = \mathfrak q\mathfrak q' = (3)$, qui ne contient pas $1 - \sqrt{-5}$. Le cas de $\mathfrak q'$ est symétrique, par conjugaison.

        ```schema an-factorisation
        Les quatre facteurs premiers de $(6)$ dans $\mathbb Z[\sqrt{-5}]$. En haut, on les regroupe en $\mathfrak p^2 = (2)$ et $\mathfrak q\mathfrak q' = (3)$ ; en bas, en $\mathfrak p\mathfrak q = (1 + \sqrt{-5})$ et $\mathfrak p\mathfrak q' = (1 - \sqrt{-5})$. Aucun des quatre facteurs n'est principal, ce qui explique que les éléments, eux, ne se factorisent pas de façon unique.
        ```
      - |
        Deux idéaux non nuls $I$ et $J$ sont dans la même classe s'il existe $\alpha, \beta \in \mathcal O$ non nuls tels que $\alpha I = \beta J$ ; la factorisation et l'idéal inverse font des classes un groupe, le groupe des classes, dont le neutre est la classe des idéaux principaux.

        Ce groupe est fini. C'est l'objet de {{an-classes|Groupe des classes}}, qui compare d'abord la norme d'un produit d'idéaux au produit des normes ({{an-norme-ideal|Norme d'un idéal}}), puis trouve dans tout idéal un élément de petite norme par le principe des tiroirs ({{an-petit-element|Petit élément}}).

        Pour $\mathbb Z[\sqrt{-5}]$, ce groupe a deux éléments ({{an-classes-z5|Classes de ℤ[√−5]}}) : pour tout idéal non principal $I$, l'idéal $\mathfrak pI$ est principal, comme $\mathfrak p\mathfrak q = (1 + \sqrt{-5})$.

  - id: an-norme-ideal
    etiquette: Norme d'un idéal
    nature: proposition
    titre: Norme d'un idéal
    texte: |
      Comme dans les trois nœuds précédents, $K = \mathbb Q(\sqrt d)$ et $\mathcal O = \lex{anneau-entiers}{\mathcal O_K}$. On pose $\omega = \sqrt d$ si $d \equiv 2$ ou $3 \pmod 4$, et $\omega = \frac{1 + \sqrt d}2$ si $d \equiv 1 \pmod 4$, de sorte que $\mathcal O = \lex{ensemble-entiers-relatifs}{\mathbb Z} + \mathbb Z\omega$ ({{an-quadratiques|Corps quadratiques}}, (ii)).

      Cette écriture est unique : $1$ et $\omega$ sont linéairement indépendants sur $\lex{ensemble-rationnels}{\mathbb Q}$, puisque $\sqrt d \notin \mathbb Q$.

      La [[norme-ideal|norme]] d'un idéal non nul $I$ est son indice, $N(I) = [\mathcal O : I]$, nombre d'éléments de l'anneau $\mathcal O/I$. Pour $\beta \in \mathcal O$, on note $\beta\mathcal O$, ou $(\beta)$, l'idéal principal engendré par $\beta$ ; pour un idéal $I$, on a $\beta I = (\beta)I$.
    enonce: |
      (i) *Contenir, c'est diviser.* Si $I \subset J$ sont deux idéaux non nuls, il existe un idéal $L$ tel que $I = JL$.

      (ii) Pour deux idéaux non nuls $I$ et $J$, $N(IJ) = N(I)N(J)$.

      (iii) Pour $\beta \in \mathcal O$ non nul, $N(\beta\mathcal O) = |N(\beta)|$.

      (iv) Un idéal de norme $m$ contient $m$, et il n'y a qu'un nombre fini d'idéaux de norme $m$. Un idéal dont la norme est un nombre premier est premier.
    preuve: |
      (i) Écrivons $J = \mathfrak q_1 \cdots \mathfrak q_s$, produit d'idéaux premiers non nuls ({{an-factorisation|Factorisation des idéaux}}), et posons $J^* = \mathfrak q_1' \cdots \mathfrak q_s'$, où $\mathfrak q_i'$ est le sous-groupe de $K$ défini au nœud {{an-inverse|Idéal inverse}}. Comme $\mathfrak q_i\mathfrak q_i' = \mathcal O$ pour chaque $i$, et que le produit est associatif et commutatif ({{an-dedekind-lemmes|Trois lemmes}}), on a $JJ^* = \mathcal O$.

      Le produit $L = IJ^*$ est un sous-groupe de $K$ stable par multiplication par $\mathcal O$, et il est contenu dans $JJ^* = \mathcal O$ : c'est un idéal de $\mathcal O$. Enfin
      $$JL = (JJ^*)I = I.$$

      (ii) Montrons d'abord $N(M\mathfrak p) = N(M)N(\mathfrak p)$ pour un idéal non nul $M$ et un idéal premier non nul $\mathfrak p$. Comme $M\mathfrak p \subset M$, le théorème de Lagrange donne, comme dans la preuve de {{an-dedekind-lemmes|Trois lemmes}}, (i),
      $$N(M\mathfrak p) = N(M) \cdot |M/M\mathfrak p|.$$

      L'anneau $k = \mathcal O/\mathfrak p$ est un corps, puisque $\mathfrak p$ est maximal ({{an-ideaux|Idéaux}}, (iii), et {{a-premier-maximal|Idéaux premiers, maximaux}}, (ii)). Le groupe $V = M/M\mathfrak p$ est un $k$-[[espace-vectoriel|espace vectoriel]] pour la loi $(x + \mathfrak p)(y + M\mathfrak p) = xy + M\mathfrak p$, bien définie puisque $\mathfrak pM$ et $xM\mathfrak p$ sont contenus dans $M\mathfrak p$ ; les axiomes viennent de ceux de l'anneau $\mathcal O$.

      L'espace $V$ n'est pas nul : si l'on avait $M\mathfrak p = M = M\mathcal O$, la simplification par $M$ ({{an-factorisation|Factorisation des idéaux}}) donnerait $\mathfrak p = \mathcal O$. Soit $y \in M$ hors de $M\mathfrak p$, de classe $\bar y \neq 0$ dans $V$, et soit $A = y\mathcal O + M\mathfrak p$, idéal compris entre $M\mathfrak p$ et $M$.

      Par (i), $A = ML$ pour un idéal $L$, puis $M\mathfrak p = AL_2$ pour un idéal $L_2$. Ainsi $M\mathfrak p = M(LL_2)$, et la simplification par $M$ donne $\mathfrak p = LL_2 \subset L$. Par maximalité de $\mathfrak p$, $L = \mathfrak p$ ou $L = \mathcal O$ ; le premier cas donnerait $A = M\mathfrak p$, contre $y \notin M\mathfrak p$. Donc $A = M$.

      Tout élément de $V$ est ainsi la classe d'un $xy + z$, avec $x \in \mathcal O$ et $z \in M\mathfrak p$, c'est-à-dire $\lambda\bar y$ avec $\lambda = x + \mathfrak p$ : l'application $\lambda \mapsto \lambda\bar y$ de $k$ dans $V$ est surjective. Elle est injective : si $(\lambda - \mu)\bar y = 0$ avec $\lambda \neq \mu$, la multiplication par l'inverse de $\lambda - \mu$ dans $k$ donne $\bar y = 0$. Donc $|V| = |k| = N(\mathfrak p)$.

      Écrivons maintenant $J = \mathfrak p_1 \cdots \mathfrak p_r$ ({{an-factorisation|Factorisation des idéaux}}). Chaque idéal intermédiaire $I\mathfrak p_1 \cdots \mathfrak p_j$ est non nul, puisqu'il contient un produit d'éléments non nuls de $I, \mathfrak p_1, \dots, \mathfrak p_j$ et que $\mathcal O$ est intègre. En appliquant ce qui précède $r$ fois, on obtient
      $$N(IJ) = N(I)N(\mathfrak p_1) \cdots N(\mathfrak p_r),$$
      et, pour $I = \mathcal O$, qui est de norme $1$, $N(J) = N(\mathfrak p_1) \cdots N(\mathfrak p_r)$ : d'où $N(IJ) = N(I)N(J)$.

      (iii) La conjugaison $\sigma : \alpha \mapsto \bar\alpha$ est un automorphisme d'anneau de $K$ ({{an-unites|Norme, unités}}, (i)), qui est sa propre réciproque. Elle envoie $\mathcal O$ dans $\mathcal O$, un élément et son conjugué ayant même trace et même norme ({{an-quadratiques|Corps quadratiques}}, (i)). Elle envoie aussi $\beta\mathcal O$ sur $\bar\beta\mathcal O$, et $\alpha + \beta\mathcal O \mapsto \bar\alpha + \bar\beta\mathcal O$ est une bijection de $\mathcal O/\beta\mathcal O$ sur $\mathcal O/\bar\beta\mathcal O$ : les idéaux $(\beta)$ et $(\bar\beta)$ ont même norme.

      Posons $n = N(\beta) = \beta\bar\beta$ ; c'est un entier ({{an-quadratiques|Corps quadratiques}}), non nul puisque $\bar\beta = \sigma(\beta) \neq 0$. Le produit des idéaux $(\beta)$ et $(\bar\beta)$ est engendré par les produits $\beta x \cdot \bar\beta y = nxy$, avec $x, y \in \mathcal O$ : c'est l'idéal $(n)$.

      Par unicité de l'écriture, $a + b\omega$ appartient à $n\mathcal O$ si et seulement si $n$ divise $a$ et $b$. Chaque classe modulo $n\mathcal O$ contient donc un et un seul élément $a + b\omega$ avec $0 \leqslant a, b < |n|$. Il en contient un, car on réduit $a$ et $b$ modulo $|n|$ par division euclidienne, ce qui retranche un élément de $n\mathcal O$ ; il n'en contient qu'un, car la différence de deux tels éléments a des coordonnées de valeur absolue $< |n|$, non toutes deux nulles, et n'est pas dans $n\mathcal O$. Ainsi $N(n\mathcal O) = n^2$. Par (ii),
      $$\begin{aligned} N(\beta\mathcal O)^2 &= N(\beta\mathcal O)N(\bar\beta\mathcal O) \\ &= N(n\mathcal O) = n^2. \end{aligned}$$

      (iv) Si $N(I) = m$, le groupe additif $\mathcal O/I$ a $m$ éléments, et $m$ fois chacun d'eux est nul ({{gf-cycliques|Groupes cycliques}}, (i)) ; en particulier $m = m \cdot 1$ appartient à $I$. Alors $m\mathcal O \subset I$, et $I$ est la réunion de ses classes modulo $m\mathcal O$ : il est déterminé par une partie de l'ensemble $\mathcal O/m\mathcal O$, qui a $m^2$ éléments par (iii). Il y a donc au plus $2^{m^2}$ idéaux de norme $m$.

      Si $N(I) = \ell$ est un nombre premier, écrivons $I = \mathfrak p_1 \cdots \mathfrak p_r$ ({{an-factorisation|Factorisation des idéaux}}). Par (ii), $\ell = N(\mathfrak p_1) \cdots N(\mathfrak p_r)$, et chaque $N(\mathfrak p_i)$ vaut au moins $2$, puisque $\mathfrak p_i \neq \mathcal O$. Il y a donc un seul facteur, et $I = \mathfrak p_1$ est premier.
    remarques:
      - |
        Dans $\mathbb Z[\sqrt{-5}]$, l'idéal $(1 + \sqrt{-5})$ est de norme $N(1 + \sqrt{-5}) = 6$. On le voit sur le réseau qu'il forme dans le plan, où l'indice devient le nombre de points du réseau $\mathcal O$ dans une maille du sous-réseau ; la preuve de (iii) n'utilise pas cette lecture géométrique, qui demanderait une théorie de l'aire des réseaux.

        ```schema an-norme-ideal
        Le point $(a, b)$ figure $a + b\sqrt{-5}$. Les points rouges forment l'idéal $(\beta)$, $\beta = 1 + \sqrt{-5}$, engendré comme groupe par $\beta$ et $\beta\sqrt{-5} = -5 + \sqrt{-5}$. La maille bleue, comptée avec le sommet $0$ mais sans les trois autres sommets ni les deux côtés opposés à $0$, contient six points, $0$ et les cinq points pleins de la couleur du texte, deux à deux non congrus modulo $(\beta)$ : un par classe, et $N((\beta)) = 6$.
        ```
      - |
        Pour $\mathfrak p = (2, 1 + \sqrt{-5})$, la relation $\mathfrak p^2 = (2)$ ({{an-ideaux|Idéaux}}, (ii)) donne $N(\mathfrak p)^2 = N((2)) = 4$, donc $N(\mathfrak p) = 2$ : l'anneau $\mathcal O/\mathfrak p$ est le corps à deux éléments.
      - |
        La valeur absolue de (iii) n'est pas décorative. Dans $\mathbb Z[\sqrt 2]$, $N(1 + \sqrt 2) = -1$, alors que l'idéal $(1 + \sqrt 2)$, engendré par une unité, est l'anneau entier, de norme $1$. Autrement dit, la norme d'un idéal est un indice, donc un entier positif, même quand celle de ses éléments change de signe.
      - |
        Le point (i) prolonge ce que l'on sait dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ : $b\mathbb Z \subset a\mathbb Z$ si et seulement si $a$ divise $b$. Le piège est le sens de l'inclusion : le diviseur est l'idéal le plus grand.
      - |
        La preuve de (i) repose sur l'idéal inverse, donc sur le point (ii) de {{an-dedekind-lemmes|Trois lemmes}}, dont la remarque de ce nœud montre l'échec dans l'anneau $A = \mathbb Z[\sqrt 5]$, plus petit que l'anneau des entiers. Le point (i) y tombe en défaut.

        Soit $J = (2, 1 + \sqrt 5)$ dans $A$. Comme $(1 + \sqrt 5)^2 = 2(3 + \sqrt 5)$ et $3 + \sqrt 5 = 2 + (1 + \sqrt 5)$, on trouve $J^2 = 2J$. Cet idéal n'est pas inversible : si $JJ' = A$, la multiplication de $J^2 = 2J$ par $J'$ donnerait $J = 2A$, qui ne contient pas $1 + \sqrt 5$.

        L'idéal $2A$ est contenu dans $J$ sans être de la forme $JL$. En effet, un élément $x = a + b\sqrt 5$ vérifie $xJ \subset 2A$ si et seulement si $x(1 + \sqrt 5) = (a + 5b) + (a + b)\sqrt 5$ est dans $2A$, c'est-à-dire si $a \equiv b \pmod 2$, c'est-à-dire si $x \in J$. Si l'on avait $2A = JL$, on aurait donc $L \subset J$, puis $2A = JL \subset J^2 = 2J$, et $2 = 2j$ avec $j \in J$, soit $1 \in J$ : c'est faux, puisque les éléments de $J$ ont des coordonnées de même parité.

  - id: an-petit-element
    etiquette: Petit élément
    nature: lemme
    titre: Un élément de petite norme dans tout idéal
    texte: |
      Avec les notations du nœud précédent, on pose $C_d = 1 + |d|$ si $d \equiv 2$ ou $3 \pmod 4$, et $C_d = 2 + \frac{|d - 1|}4$ si $d \equiv 1 \pmod 4$.
    enonce: |
      Tout idéal non nul $I$ de $\mathcal O$ contient un élément $\alpha \neq 0$ tel que $|N(\alpha)| \leqslant C_d\,N(I)$.
    preuve: |
      Soit $n = N(I)$, et $m$ le plus grand entier tel que $m^2 \leqslant n$, de sorte que $(m + 1)^2 > n$. Les $(m + 1)^2$ éléments $a + b\omega$, avec $0 \leqslant a, b \leqslant m$, sont deux à deux distincts, par unicité de l'écriture ({{an-norme-ideal|Norme d'un idéal}}). Leurs classes dans $\mathcal O/I$, qui n'a que $n$ éléments, ne sont donc pas deux à deux distinctes : c'est le principe des tiroirs ({{n-fini|Ensembles finis}}, (i)).

      Soient $x \neq x'$ deux de ces éléments, de même classe. Leur différence $\alpha = x - x'$ est un élément non nul de $I$, de la forme $a + b\omega$ avec $|a| \leqslant m$ et $|b| \leqslant m$.

      Si $d \equiv 2$ ou $3 \pmod 4$, $N(\alpha) = a^2 - db^2$, et
      $$|N(\alpha)| \leqslant a^2 + |d|b^2 \leqslant (1 + |d|)m^2.$$

      Si $d \equiv 1 \pmod 4$, on écrit $\alpha = a + \frac b2 + \frac b2\sqrt d$, et le développement de $\big(a + \frac b2\big)^2 - \frac{db^2}4$ donne
      $$N(\alpha) = a^2 + ab + \frac{1 - d}4\,b^2,$$
      d'où $|N(\alpha)| \leqslant \big(2 + \frac{|d - 1|}4\big)m^2$.

      Dans les deux cas, $|N(\alpha)| \leqslant C_dm^2 \leqslant C_d\,n$.
    remarques:
      - |
        Dans $\mathbb Z[\sqrt{-5}]$, où $C_{-5} = 6$, prenons $\mathfrak r = (7, 3 + \sqrt{-5})$. Comme $(-3)^2 = 9 \equiv -5 \pmod 7$, l'application $a + b\sqrt{-5} \mapsto \overline{a - 3b}$ est un morphisme surjectif sur $\mathbb Z/7\mathbb Z$, et, comme dans la première remarque de {{an-factorisation|Factorisation des idéaux}}, son noyau est $\mathfrak r$ : donc $N(\mathfrak r) = 7$, et $m = 2$.

        ```schema an-petit-element
        Le point $(a, b)$ figure $a + b\sqrt{-5}$, et le chiffre qui l'accompagne est sa classe $a - 3b$ modulo $7$. Les neuf éléments de la boîte $0 \leqslant a, b \leqslant 2$ n'ont que sept classes : $1$ et $2\sqrt{-5}$ ont la classe $1$, $2$ et $1 + 2\sqrt{-5}$ la classe $2$. Les deux flèches rouges pleines sont la même différence $\alpha = 1 - 2\sqrt{-5}$, que la flèche rouge en pointillé reporte depuis $0$ ; le point $\alpha$ appartient à $\mathfrak r$, dont les points sont cerclés de vert.
        ```

        Ici $|N(\alpha)| = 1 + 20 = 21$, bien en dessous de la borne $C_{-5}N(\mathfrak r) = 42$. Le résultat signifie que $\mathfrak r$ est relié à un idéal plus petit : comme $(\alpha) \subset \mathfrak r$, on a $(\alpha) = \mathfrak rL$ ({{an-norme-ideal|Norme d'un idéal}}, (i)), puis $7N(L) = 21$ par (ii) et (iii) du même nœud, donc $N(L) = 3$. C'est exactement le mécanisme du nœud suivant.
      - |
        La géométrie des nombres de Minkowski, qui compare l'aire d'un convexe symétrique à celle d'une maille du réseau, améliore la constante : pour $d < 0$, on peut remplacer $C_d$ par $\frac2\pi\sqrt{|\Delta|}$, où $\Delta$ vaut $4d$ si $d \equiv 2$ ou $3 \pmod 4$ et $d$ si $d \equiv 1 \pmod 4$. Pour $d = -5$, cette borne vaut environ $2{,}85$ au lieu de $6$. Ce raffinement est admis ici ; la constante $C_d$ suffit pour la finitude et pour le calcul de {{an-classes-z5|Classes de ℤ[√−5]}}.

  - id: an-classes
    etiquette: Groupe des classes
    nature: théorème
    titre: Finitude du groupe des classes
    texte: |
      Deux idéaux non nuls $I$ et $J$ de $\mathcal O$ sont dans la même **classe**, ce que l'on note $I \sim J$, s'il existe $\alpha, \beta \in \mathcal O$ non nuls tels que $\alpha I = \beta J$. On note $[I]$ la classe de $I$, et $\operatorname{Cl}(K)$ l'ensemble des classes.
    enonce: |
      (i) La relation $\sim$ est une [[relation-equivalence|relation d'équivalence]], et le produit $[I][J] = [IJ]$ est bien défini. Il fait de $\operatorname{Cl}(K)$ un [[groupe]] abélien, le [[groupe-classes|groupe des classes]] de $K$, dont le neutre est la classe des idéaux principaux non nuls.

      (ii) Toute classe contient un idéal de norme au plus $C_d$.

      (iii) Le groupe $\operatorname{Cl}(K)$ est fini. Son cardinal $h_K$, le **nombre de classes**, est au plus le nombre des idéaux de norme au plus $C_d$, et $h_K = 1$ si et seulement si $\mathcal O$ est [[anneau-principal|principal]].
    preuve: |
      (i) La relation est réflexive, avec $\alpha = \beta = 1$, et symétrique. Si $\alpha I = \beta J$ et $\gamma J = \delta L$, alors
      $$\gamma\alpha I = \gamma\beta J = \beta\delta L,$$
      où $\gamma\alpha$ et $\beta\delta$ ne sont pas nuls, $\mathcal O$ étant intègre comme sous-anneau de $\lex{ensemble-complexes}{\mathbb C}$ : elle est transitive.

      Si $\alpha I = \beta J$, alors $\alpha(IL) = (\alpha I)L = (\beta J)L = \beta(JL)$. La classe de $IL$ ne dépend donc que de celles de $I$ et de $L$, le produit étant commutatif. Le produit des classes hérite l'associativité et la commutativité du produit des idéaux ({{an-dedekind-lemmes|Trois lemmes}}).

      Un idéal $I$ est dans la classe de $\mathcal O$ si et seulement s'il est principal. En effet, si $\alpha I = \beta\mathcal O$, alors $\beta = \alpha\gamma$ avec $\gamma \in I$, puis $\alpha I = \alpha\gamma\mathcal O$, et $I = \gamma\mathcal O$ en simplifiant par $\alpha \neq 0$ ; réciproquement, $I = \gamma\mathcal O$ vérifie $1 \cdot I = \gamma\mathcal O$. Comme $\mathcal OI = I$, la classe de $\mathcal O$ est neutre.

      Enfin, soit $a \in I$ non nul. Comme $a\mathcal O \subset I$, il existe un idéal $J$ tel que $IJ = a\mathcal O$ ({{an-norme-ideal|Norme d'un idéal}}, (i)) : $[I][J] = [\mathcal O]$, et $[J]$ est l'inverse de $[I]$.

      (ii) Soit $I$ un idéal non nul, $a \in I$ non nul, et $J$ un idéal tel que $IJ = a\mathcal O$, comme en (i). Par {{an-petit-element|Petit élément}}, $J$ contient un $\beta \neq 0$ tel que $|N(\beta)| \leqslant C_d\,N(J)$. Comme $\beta\mathcal O \subset J$, il existe un idéal $L$ tel que $\beta\mathcal O = JL$. Alors
      $$\beta I = (IJ)L = aL,$$
      de sorte que $L$ est dans la classe de $I$.

      Par {{an-norme-ideal|Norme d'un idéal}}, (ii) et (iii), $N(J)N(L) = |N(\beta)| \leqslant C_d\,N(J)$, et $N(L) \leqslant C_d$ puisque $N(J) \geqslant 1$.

      (iii) Les idéaux de norme au plus $C_d$ sont en nombre fini ({{an-norme-ideal|Norme d'un idéal}}, (iv)). Par (ii), l'application qui associe à chacun d'eux sa classe est surjective sur $\operatorname{Cl}(K)$, qui est donc fini, de cardinal au plus leur nombre.

      Si $\mathcal O$ est principal, tous les idéaux non nuls sont dans la classe de $\mathcal O$, et $h_K = 1$. Réciproquement, si $h_K = 1$, tout idéal non nul est principal par (i), et l'idéal nul l'est aussi.
    remarques:
      - |
        Pour $\mathbb Z[i]$, $C_{-1} = 2$. Un idéal de norme $2$ contient $2$ ({{an-norme-ideal|Norme d'un idéal}}, (iv)), donc divise $(2) = (1 + i)^2$, puisque $2 = -i(1 + i)^2$ ; or $(1 + i)$, de norme $2$, est premier ({{an-norme-ideal|Norme d'un idéal}}, (iii) et (iv)). Par unicité de la factorisation, le seul idéal de norme $2$ est $(1 + i)$, qui est principal, et le seul idéal de norme $1$ est l'anneau. Donc $h = 1$ : on retrouve que $\mathbb Z[i]$ est principal ({{an-gauss|Deux carrés}}), sans division euclidienne.
      - |
        La borne ne dit pas que les idéaux de norme au plus $C_d$ sont dans des classes distinctes : il faut encore les comparer. Pour $\mathbb Z[\sqrt{-5}]$, huit idéaux ne donnent que deux classes ({{an-classes-z5|Classes de ℤ[√−5]}}). Le même procédé, mené par machine sur les idéaux de norme au plus $C_d$, donne $h = 1$ pour $d = -1, -2, -3$, $h = 2$ pour $d = -5$ et $-6$, $h = 3$ pour $d = -23$, et $h = 4$ pour $d = -14$ et $-21$.

  - id: an-classes-z5
    etiquette: Classes de ℤ[√−5]
    nature: proposition
    titre: Le groupe des classes de ℤ[√−5]
    enonce: |
      Pour $K = \mathbb Q(\sqrt{-5})$, le [[groupe-classes|groupe des classes]] a deux éléments : la classe des idéaux principaux et celle de $\mathfrak p = (2, 1 + \sqrt{-5})$. Par suite, pour tout idéal non principal $I$, l'idéal $\mathfrak pI$ est principal, et le produit de deux idéaux non principaux est principal.
    preuve: |
      Ici $d = -5 \equiv 3 \pmod 4$, $\mathcal O = \lex{ensemble-entiers-relatifs}{\mathbb Z}[\sqrt{-5}]$ ({{an-quadratiques|Corps quadratiques}}, (ii)) et $C_{-5} = 6$ : toute classe contient un idéal de norme au plus $6$ ({{an-classes|Groupe des classes}}, (ii)).

      Un idéal $I$ de norme $m$ contient $m$, donc divise $(m)$ : on a $(m) = IL$ pour un idéal $L$ ({{an-norme-ideal|Norme d'un idéal}}, (iv) et (i)). En factorisant $I$ et $L$ en idéaux premiers, l'unicité de la factorisation de $(m)$ ({{an-factorisation|Factorisation des idéaux}}) montre que les facteurs premiers de $I$ sont, avec leurs multiplicités, parmi ceux de $(m)$. Il reste à factoriser $(m)$ pour $m \leqslant 6$.

      Soient $\mathfrak q = (3, 1 + \sqrt{-5})$ et $\mathfrak q' = (3, 1 - \sqrt{-5})$. On a $\mathfrak p^2 = (2)$ ({{an-ideaux|Idéaux}}, (ii)) et $\mathfrak q\mathfrak q' = (3)$, puisque $\mathfrak q\mathfrak q'$ est engendré par $9$, $3(1 \pm \sqrt{-5})$ et $6$, tous multiples de $3$, et contient $9 - 6 = 3$.

      Par {{an-norme-ideal|Norme d'un idéal}}, (ii) et (iii), $N(\mathfrak p)^2 = 4$, donc $N(\mathfrak p) = 2$. La conjugaison envoie $\mathfrak q$ sur $\mathfrak q'$, donc $N(\mathfrak q) = N(\mathfrak q')$ comme dans la preuve de (iii) du même nœud ; comme $N(\mathfrak q)N(\mathfrak q') = 9$, ces deux normes valent $3$.

      Ces trois idéaux, de norme première, sont premiers ({{an-norme-ideal|Norme d'un idéal}}, (iv)). De plus $\mathfrak q \neq \mathfrak q'$ : sinon $\mathfrak q$ contiendrait $1 + \sqrt{-5}$ et $1 - \sqrt{-5}$, donc $2$ et $3$, donc $1$. De même, l'idéal $(\sqrt{-5})$, de norme $5$, est premier, et $(5) = (\sqrt{-5})^2$.

      On a donc $(2) = \mathfrak p^2$, $(3) = \mathfrak q\mathfrak q'$, $(4) = \mathfrak p^4$, $(5) = (\sqrt{-5})^2$ et $(6) = \mathfrak p^2\mathfrak q\mathfrak q'$, et la norme d'un produit est le produit des normes. Le seul idéal de norme $1$ est $\mathcal O$. Ceux de norme $2$, $3$, $4$ et $5$ sont respectivement $\mathfrak p$, puis $\mathfrak q$ et $\mathfrak q'$, puis $\mathfrak p^2 = (2)$, puis $(\sqrt{-5})$. Ceux de norme $6$ ont un facteur $\mathfrak p$ et un facteur $\mathfrak q$ ou $\mathfrak q'$ : ce sont $\mathfrak p\mathfrak q$ et $\mathfrak p\mathfrak q'$.

      L'idéal $\mathfrak p\mathfrak q$ est engendré par $6$, $2(1 + \sqrt{-5})$, $3(1 + \sqrt{-5})$ et $(1 + \sqrt{-5})^2$, tous multiples de $1 + \sqrt{-5}$ puisque $6 = (1 + \sqrt{-5})(1 - \sqrt{-5})$ ; il contient
      $$3(1 + \sqrt{-5}) - 2(1 + \sqrt{-5}) = 1 + \sqrt{-5}.$$
      Donc $\mathfrak p\mathfrak q = (1 + \sqrt{-5})$. La conjugaison $\sigma$ fixe $\mathfrak p$ : $\sigma(\mathfrak p) = (2, 1 - \sqrt{-5})$ est contenu dans $\mathfrak p$, puisque $1 - \sqrt{-5} = 2 - (1 + \sqrt{-5})$ appartient à $\mathfrak p$, et contient $\mathfrak p$, puisque $1 + \sqrt{-5} = 2 - (1 - \sqrt{-5})$ appartient à $\sigma(\mathfrak p)$. Elle échange $\mathfrak q$ et $\mathfrak q'$ : elle envoie $\mathfrak p\mathfrak q$ sur $\mathfrak p\mathfrak q' = (1 - \sqrt{-5})$.

      Ainsi, parmi les huit idéaux de norme au plus $6$, les cinq idéaux $\mathcal O$, $(2)$, $(\sqrt{-5})$, $\mathfrak p\mathfrak q$ et $\mathfrak p\mathfrak q'$ sont principaux. L'idéal $\mathfrak p$ ne l'est pas ({{an-ideaux|Idéaux}}, (ii)), et $[\mathfrak p]^2 = [(2)]$ est le neutre. Enfin $[\mathfrak p][\mathfrak q] = [(1 + \sqrt{-5})]$ est le neutre, donc $[\mathfrak q] = [\mathfrak p]^{-1} = [\mathfrak p]$, et de même $[\mathfrak q'] = [\mathfrak p]$.

      Toute classe est donc le neutre ou $[\mathfrak p]$, et ces deux classes sont distinctes : le groupe a deux éléments. Si $I$ n'est pas principal, $[I] = [\mathfrak p]$, et $[\mathfrak pI] = [\mathfrak p]^2$ est le neutre ; de même pour le produit de deux idéaux non principaux.
    remarques:
      - |
        La dichotomie se lit sur les nombres premiers. Soit $\ell$ un nombre premier et $\mathfrak l$ un idéal de norme $\ell$. Si $\mathfrak l$ est principal, engendré par $a + b\sqrt{-5}$, alors $\ell = a^2 + 5b^2$ ({{an-norme-ideal|Norme d'un idéal}}, (iii)). Sinon, $\mathfrak p\mathfrak l$ est principal, engendré par un $\gamma$ de norme $2\ell$, et c'est $2\ell$ qui s'écrit $a^2 + 5b^2$.

        Pour l'idéal $\mathfrak r$ de norme $7$ de {{an-petit-element|Petit élément}}, $7$ n'est pas de la forme $a^2 + 5b^2$ : $\mathfrak r$ n'est pas principal, il est dans la classe de $\mathfrak p$, et l'on trouve en effet $14 = 3^2 + 5 \cdot 1^2$. C'est ce qu'annonçait la relation $(1 - 2\sqrt{-5}) = \mathfrak rL$ avec $N(L) = 3$, puisque $L$, de norme $3$, est $\mathfrak q$ ou $\mathfrak q'$.

        Au contraire, $29 = 3^2 + 5 \cdot 2^2$, et les idéaux de norme $29$ sont principaux : ils divisent $(29) = (3 + 2\sqrt{-5})(3 - 2\sqrt{-5})$, produit de deux idéaux premiers de norme $29$.
      - |
        Ce calcul explique le défaut de factorialité de {{an-ideaux|Idéaux}}. Les éléments irréductibles $2$, $3$ et $1 \pm \sqrt{-5}$ engendrent des produits de deux idéaux premiers non principaux, tous dans la classe de $\mathfrak p$ ; c'est parce que cette classe n'est pas le neutre que les idéaux premiers $\mathfrak p$, $\mathfrak q$, $\mathfrak q'$ ne correspondent à aucun élément, et que $6$ a deux factorisations ({{an-factorisation|Factorisation des idéaux}}).

