# Niveau 1 : structure interne du nœud « Théorie algébrique des nombres ».
# Entiers algébriques (astuce du déterminant), anneaux d'entiers des corps quadratiques,
# norme et unités, entiers de Gauss et théorème des deux carrés de Fermat, défaut de
# factorialité de ℤ[√−5] et idéaux ; factorisation unique des idéaux dans l'anneau des entiers d'un
# corps quadratique (idéal inverse, démontrée le 29 oct. 2026). La finitude du groupe des classes est
# admise et signalée.
# Parents : théorie de Galois (extensions, polynôme minimal, corps finis), géométrie
# algébrique (spectre, idéaux premiers).

graphe: tan
titre: Théorie algébrique des nombres
conteneur: tan

entrees:
  galois: [an-entiers, an-gauss]
  geoalg: [an-ideaux]
  ac: [an-ideaux]

noeuds:
  - id: an-entiers
    etiquette: Entiers algébriques
    nature: théorème
    titre: Entiers algébriques
    texte: |
      Un **corps de nombres** est une [[extension-corps|extension]] finie $K$ de $\lex{ensemble-rationnels}{\mathbb Q}$ contenue dans $\lex{ensemble-complexes}{\mathbb C}$. Un élément $\alpha \in \mathbb C$ est un [[entier-algebrique|entier algébrique]] s'il annule un polynôme **unitaire** à coefficients dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}$. Un sous-groupe $M$ de $(\mathbb C, +)$ est **de type fini** s'il est engendré par un nombre fini d'éléments.
    enonce: |
      (i) $\alpha$ est un entier algébrique si et seulement s'il existe un sous-groupe de type fini $M \neq \{0\}$ de $\mathbb C$ tel que $\alpha M \subset M$.

      (ii) Les entiers algébriques forment un sous-anneau de $\mathbb C$. Pour un corps de nombres $K$, les entiers algébriques de $K$ forment un anneau $\lex{anneau-entiers}{\mathcal O_K}$, l'**anneau des entiers** de $K$.

      (iii) Un nombre rationnel qui est un entier algébrique est un entier : $\mathcal O_{\mathbb Q} = \mathbb Z$.

      (iv) Le polynôme minimal sur $\mathbb Q$ d'un entier algébrique est à coefficients entiers.
    preuve: |
      (i) Si $\alpha^n = -\sum_{k<n} c_k\alpha^k$ avec $c_k \in \mathbb Z$, le groupe $M$ engendré par $1, \alpha, \dots, \alpha^{n-1}$ convient : par récurrence, toute puissance de $\alpha$ y appartient. Réciproquement, si $M$ est engendré par $x_1, \dots, x_m$, non tous nuls, écrivons $\alpha x_i = \sum_j a_{ij}x_j$ avec $a_{ij} \in \mathbb Z$. La matrice $\alpha I - A$ annule le vecteur non nul $(x_j)$ de $\lex{n-uplet}{\mathbb C^m}$, donc son déterminant est nul ({{v-det-matrice|Déterminant d'une matrice}}, (ii)) ; or $\det(XI - A)$ est un polynôme unitaire à coefficients entiers, par la formule du déterminant.

      (ii) Si $\alpha$ et $\beta$ sont entiers, de degrés unitaires $n$ et $p$, le groupe $M$ engendré par les $\alpha^i\beta^j$, $i < n$, $j < p$, contient $1$, et il est stable par multiplication par $\alpha$ et par $\beta$, donc par $\alpha \pm \beta$ et $\alpha\beta$ ; on applique (i). Pour $K$, on intersecte avec le corps $K$.

      (iii) Si $r = a/b$ avec $a \wedge b = 1$, $b \geqslant 1$, annule $X^n + \sum_{k<n} c_kX^k$, alors $a^n = -b\sum_{k<n}c_ka^kb^{n-1-k}$, et $b$ divise $a^n$ ; par le lemme de Gauss ({{z-bezout|Bézout}}), $b$ divise $1$.

      (iv) Soit $P$ unitaire entier annulant $\alpha$. Le polynôme minimal $\mu$ divise $P$ ; dans un corps de décomposition, ses racines sont des racines de $P$, donc des entiers algébriques. Ses coefficients, fonctions polynomiales symétriques à coefficients entiers de ces racines, sont des entiers algébriques par (ii), et rationnels : ils sont entiers par (iii).
    remarques:
      - |
        Le nombre d'or $\frac{1 + \sqrt 5}{2}$, racine de $X^2 - X - 1$, est un entier algébrique, bien qu'il ait un dénominateur. L'erreur la plus répandue est de croire que $\mathcal O_K$ est toujours $\mathbb Z[\alpha]$ pour un générateur « évident » $\alpha$ de $K$ : pour $K = \mathbb Q(\sqrt 5)$, $\mathbb Z[\sqrt 5]$ est strictement plus petit que $\mathcal O_K$.

  - id: an-quadratiques
    etiquette: Corps quadratiques
    nature: théorème
    titre: Anneaux d'entiers des corps quadratiques
    texte: |
      Soit $d \neq 0, 1$ un entier sans facteur carré et $K = \mathbb Q(\sqrt d)$, de degré $2$. Le **conjugué** de $\alpha = a + b\sqrt d$, $a, b \in \lex{ensemble-rationnels}{\mathbb Q}$, est $\bar\alpha = a - b\sqrt d$ ; sa **trace** est $\alpha + \bar\alpha = 2a$ et sa [[norme-algebrique|norme]] $N(\alpha) = \alpha\bar\alpha = a^2 - db^2$.
    enonce: |
      (i) $\alpha \in K$ est un entier algébrique si et seulement si sa trace et sa norme sont des entiers.

      (ii) $\lex{anneau-entiers}{\mathcal O_K} = \mathbb Z[\sqrt d]$ si $d \equiv 2$ ou $3 \pmod 4$, et $\mathcal O_K = \lex{ensemble-entiers-relatifs}{\mathbb Z}\big[\frac{1 + \sqrt d}{2}\big]$ si $d \equiv 1 \pmod 4$.
    preuve: |
      (i) Si $b = 0$, c'est {{an-entiers|Entiers algébriques}}, (iii). Sinon, $\alpha \notin \mathbb Q$ annule $X^2 - 2aX + (a^2 - db^2)$, qui est donc son polynôme minimal ; on applique {{an-entiers|Entiers algébriques}}, (iv), et la réciproque est immédiate.

      (ii) Soit $\alpha = a + b\sqrt d$ entier. Posons $A = 2a \in \mathbb Z$ ; alors $4N(\alpha) = A^2 - d(2b)^2 \in 4\mathbb Z$, donc $d(2b)^2 \in \mathbb Z$, et, $d$ étant sans facteur carré, $B = 2b \in \mathbb Z$. La condition devient $A^2 \equiv dB^2 \pmod 4$. Les carrés valent $0$ ou $1$ modulo $4$. Si $d \equiv 2, 3$, elle force $A$ et $B$ pairs : $a, b \in \mathbb Z$. Si $d \equiv 1$, elle force $A \equiv B \pmod 2$, et $\alpha = \frac{A - B}{2} + B\,\frac{1 + \sqrt d}{2}$ avec $\frac{A - B}2 \in \mathbb Z$. Réciproquement, ces éléments sont entiers par (i), $\frac{1 + \sqrt d}{2}$ ayant pour trace $1$ et pour norme $\frac{1 - d}{4} \in \mathbb Z$.
    remarques:
      - |
        Pour $d = -1$, on obtient l'anneau $\mathbb Z[i]$ des **entiers de Gauss** ; pour $d = -3$, l'anneau $\mathbb Z[j]$ des entiers d'Eisenstein, où $j = \frac{-1 + \sqrt{-3}}2$ est une racine cubique de l'unité. Ce sont des réseaux du plan complexe, carré et hexagonal.

        ```schema an-quadratiques
        La maille bleue, de sommets $0$, $1$, $1 + \omega$ et $\omega$ pour $\omega = i$ ou $\omega = j$, pave le plan par les translations du réseau. Les points de module $1$, en rouge, sont au nombre de quatre dans $\mathbb Z[i]$ et de six dans $\mathbb Z[j]$ : ce sont les unités que décrit le nœud suivant.
        ```

  - id: an-unites
    etiquette: Norme, unités
    nature: proposition
    titre: Norme et unités
    enonce: |
      (i) La norme est multiplicative : $N(\alpha\beta) = N(\alpha)N(\beta)$.

      (ii) Un élément $\alpha \in \lex{anneau-entiers}{\mathcal O_K}$ est inversible dans $\mathcal O_K$ si et seulement si $N(\alpha) = \pm 1$.

      (iii) Pour $d < 0$, les unités sont en nombre fini : $\pm 1$ en général, $\pm 1, \pm i$ pour $d = -1$, et les six racines sixièmes de l'unité pour $d = -3$.

      (iv) Pour $d = 2$, $1 + \sqrt 2$ est une unité d'ordre infini : $\mathbb Z[\sqrt 2]$ a une infinité d'unités.
    preuve: |
      (i) La conjugaison $\alpha \mapsto \bar\alpha$ est un automorphisme de $K$, puisque $\sqrt d$ et $-\sqrt d$ ont le même polynôme minimal ({{gs-decomposition|Corps de décomposition}}) ; donc $\overline{\alpha\beta} = \bar\alpha\bar\beta$.

      (ii) Si $\alpha\beta = 1$ avec $\beta \in \mathcal O_K$, $N(\alpha)N(\beta) = 1$ avec des normes entières ({{an-quadratiques|Corps quadratiques}}). Réciproquement, si $N(\alpha) = \pm 1$, $\alpha^{-1} = \pm\bar\alpha$, et $\bar\alpha$ est entier, ayant même trace et même norme que $\alpha$.

      (iii) Pour $d < 0$, $N(a + b\sqrt d) = a^2 + |d|b^2$, avec $a, b \in \frac12\lex{ensemble-entiers-relatifs}{\mathbb Z}$ ; l'équation $N = 1$ n'a qu'un nombre fini de solutions, que l'on énumère.

      (iv) $N(1 + \sqrt 2) = 1 - 2 = -1$. Comme $1 + \sqrt 2 > 1$, ses puissances sont strictement croissantes, donc deux à deux distinctes.
    remarques:
      - |
        Les unités de $\mathbb Z[\sqrt 2]$ donnent toutes les solutions de l'équation de Pell-Fermat $x^2 - 2y^2 = \pm 1$ : $(1 + \sqrt 2)^2 = 3 + 2\sqrt 2$, $(1 + \sqrt 2)^3 = 7 + 5\sqrt 2$, et $49 - 50 = -1$.

        ```schema an-unites
        Les puissances $1$, $1 + \sqrt 2$ et $3 + 2\sqrt 2$, placées au point $(x, y)$ quand elles s'écrivent $x + y\sqrt 2$, passent alternativement de l'hyperbole $x^2 - 2y^2 = 1$ à l'hyperbole $x^2 - 2y^2 = -1$, puisque la multiplication par $1 + \sqrt 2$ multiplie la norme par $-1$. Les deux branches s'approchent de l'asymptote $y = x/\sqrt 2$, en pointillé, et la puissance suivante, $7 + 5\sqrt 2$, est déjà hors du cadre.
        ```

        Le théorème des unités de Dirichlet décrit en général le groupe des unités d'un corps de nombres ; il est admis ici.

  - id: an-gauss
    etiquette: Deux carrés
    nature: théorème
    titre: Entiers de Gauss et théorème des deux carrés
    enonce: |
      (i) $\lex{entiers-gauss}{\mathbb Z[i]}$ est euclidien pour la norme : pour $\alpha, \beta \in \mathbb Z[i]$, $\beta \neq 0$, il existe $q, r$ avec $\alpha = \beta q + r$ et $N(r) < N(\beta)$. Il est principal, et le lemme d'Euclide y vaut : un irréductible qui divise un produit divise l'un des facteurs.

      (ii) *Fermat.* Un nombre premier $p$ impair est somme de deux carrés si et seulement si $p \equiv 1 \pmod 4$.
    preuve: |
      (i) Écrivons $\alpha/\beta = x + iy$ avec $x, y \in \lex{ensemble-rationnels}{\mathbb Q}$, et choisissons des entiers $m, n$ avec $|x - m|, |y - n| \leqslant \frac12$. Pour $q = m + in$, $N(\alpha/\beta - q) \leqslant \frac14 + \frac14 < 1$, et $r = \alpha - \beta q$ vérifie $N(r) = N(\beta)N(\alpha/\beta - q) < N(\beta)$.

      ```schema an-gauss
      Pour $\alpha = 7 + 5i$ et $\beta = 2 + i$, le quotient $\alpha/\beta = \frac{19 + 3i}{5}$ tombe dans le carré de côté $1$ centré en $q = 4 + i$, lui-même contenu dans le disque où $N(z - q) < 1$. Le reste $r = \alpha - \beta q = -i$ est de norme $1 < N(\beta) = 5$.
      ```

      Comme pour $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ ({{z-ideaux|Idéaux de ℤ}}), un idéal non nul est engendré par un élément de norme minimale. Si $\pi$ est irréductible et ne divise pas $\alpha$, l'idéal $(\pi, \alpha)$, engendré par un diviseur de $\pi$, est tout l'anneau : $1 = u\pi + v\alpha$, et si $\pi \mid \alpha\beta$, alors $\pi \mid u\pi\beta + v\alpha\beta = \beta$.

      (ii) Si $p = a^2 + b^2$, les carrés valant $0$ ou $1$ modulo $4$, $p \equiv 1$. Réciproquement, si $p \equiv 1 \pmod 4$, le groupe $\lex{corps-fini}{\mathbb F_p}^\times$ est cyclique d'ordre $p - 1$, divisible par $4$ ({{gs-corps-finis|Corps finis}}) : il contient un élément $x$ d'ordre $4$, et $x^2 = -1$. Donc $p$ divise $x^2 + 1 = (x + i)(x - i)$, sans diviser aucun facteur, puisque $\frac{x \pm i}{p} \notin \mathbb Z[i]$. Par le lemme d'Euclide, $p$ n'est pas irréductible : $p = \alpha\beta$ avec $N(\alpha), N(\beta) > 1$ ({{an-unites|Norme, unités}}). Comme $N(\alpha)N(\beta) = p^2$, $N(\alpha) = p$, et $\alpha = a + bi$ donne $p = a^2 + b^2$.
    remarques:
      - |
        On vérifie $5 = 1 + 4$, $13 = 4 + 9$, $17 = 1 + 16$, $29 = 4 + 25$, $37 = 1 + 36$, $41 = 16 + 25$, alors que $3$, $7$, $11$, $19$, $23$ ne sont sommes d'aucun couple de carrés.

        ```schema an-gauss-2
        Les huit points $\pm 2 \pm 3i$ et $\pm 3 \pm 2i$ du réseau $\mathbb Z[i]$ sont sur le cercle d'équation $|z|^2 = 13$, ce qui traduit $13 = 4 + 9$ ; le cercle $|z|^2 = 7$ ne passe par aucun point du réseau, puisque $7$ n'est somme d'aucun couple de carrés.
        ```

        La démonstration n'exhibe pas la décomposition ; l'algorithme d'Euclide dans $\mathbb Z[i]$, appliqué à $p$ et $x + i$, la calcule.

  - id: an-ideaux
    etiquette: Idéaux
    nature: proposition
    titre: Défaut de factorialité et idéaux
    enonce: |
      (i) Dans $\mathbb Z[\sqrt{-5}]$, $6 = 2 \cdot 3 = (1 + \sqrt{-5})(1 - \sqrt{-5})$ sont deux décompositions en [[element-irreductible|irréductibles]] non associés ({{ac-divisibilite|Divisibilité}}) : l'anneau n'est pas [[anneau-factoriel|factoriel]], et $2$ est irréductible sans être [[element-premier|premier]].

      (ii) L'idéal $\mathfrak p = (2, 1 + \sqrt{-5})$ vérifie $\mathfrak p^2 = (2)$ ; il n'est pas principal.

      (iii) Dans l'anneau des entiers d'un corps quadratique, tout idéal non nul $I$ est d'indice fini, et tout idéal premier non nul est maximal.
    preuve: |
      (i) $N(a + b\sqrt{-5}) = a^2 + 5b^2$ ne prend jamais les valeurs $2$ ni $3$. Les normes de $2$, $3$, $1 \pm \sqrt{-5}$ valent $4$, $9$, $6$ ; une factorisation non triviale de l'un d'eux ferait apparaître un facteur de norme $2$ ou $3$ ({{an-unites|Norme, unités}}) : ils sont irréductibles. Les seules unités sont $\pm 1$, et $2$ n'est associé ni à $1 + \sqrt{-5}$ ni à $1 - \sqrt{-5}$. Enfin $2$ divise $(1 + \sqrt{-5})(1 - \sqrt{-5}) = 6$ sans diviser aucun des deux facteurs, puisque $\frac{1 \pm \sqrt{-5}}2 \notin \mathbb Z[\sqrt{-5}]$.

      (ii) $\mathfrak p^2$ est engendré par $4$, $2(1 + \sqrt{-5})$ et $(1 + \sqrt{-5})^2 = -4 + 2\sqrt{-5}$, tous multiples de $2$ ; il contient $2(1 + \sqrt{-5}) - (-4 + 2\sqrt{-5}) - 4 = 2$. Donc $\mathfrak p^2 = (2)$. Si $\mathfrak p = (\gamma)$, alors $N(\gamma)^2 = N(2) = 16$ et $N(\gamma) = 4$, puisque $N(\gamma) = 2$ est impossible ; $\gamma$ diviserait $2$ avec un quotient de norme $1$, donc $\gamma = \pm 2$, mais $1 + \sqrt{-5} \notin (2)$.

      (iii) $I$ contient $n = N(\alpha) = \alpha\bar\alpha \neq 0$ pour un $\alpha \in I$ non nul, donc $n\lex{anneau-entiers}{\mathcal O_K} \subset I$, et $\mathcal O_K/n\mathcal O_K$ est fini, $\mathcal O_K$ étant engendré comme groupe par deux éléments. Si $\mathfrak p$ est premier, $\mathcal O_K/\mathfrak p$ est un anneau intègre fini ({{a-premier-maximal|Idéaux premiers et maximaux}}), donc un corps, la multiplication par un élément non nul étant injective, donc bijective ; et $\mathfrak p$ est maximal.
    remarques:
      - |
        Kummer et Dedekind ont restauré l'unicité au niveau des idéaux : dans $\mathcal O_K$, tout idéal non nul est, de façon unique, produit d'idéaux premiers. Ce théorème est démontré, pour les corps quadratiques, dans les trois nœuds suivants, jusqu'à {{an-factorisation|Factorisation des idéaux}}.
      - |
        Le point (iii) dit que $\lex{spectre-premier}{\operatorname{Spec}}\mathcal O_K$, en {{geoalg|géométrie algébrique}}, est de dimension $1$ : un point générique, l'idéal nul, et des points fermés, les idéaux maximaux. L'arithmétique des corps de nombres est ainsi la géométrie de « courbes » au-dessus de $\operatorname{Spec}\lex{ensemble-entiers-relatifs}{\mathbb Z}$.

  - id: an-dedekind-lemmes
    etiquette: Trois lemmes
    nature: lemme
    titre: Idéaux de l'anneau des entiers d'un corps quadratique
    texte: |
      Dans ce nœud et les deux suivants, $K = \mathbb Q(\sqrt d)$ est un corps quadratique ({{an-quadratiques|Corps quadratiques}}) et $\mathcal O = \lex{anneau-entiers}{\mathcal O_K}$. Pour un idéal non nul $I$, l'**indice** $[\mathcal O : I]$ est le nombre d'éléments, fini, de l'anneau $\mathcal O/I$ ({{an-ideaux|Idéaux}}, (iii)). Le produit $IJ$ de deux idéaux est celui du nœud {{ac-chinois|Lemme chinois}} ; plus généralement, pour deux sous-groupes $M$, $N$ de $K$ stables par multiplication par $\mathcal O$, on note $MN$ l'ensemble des sommes finies $\sum x_iy_i$, $x_i \in M$, $y_i \in N$, et ce produit est associatif et commutatif, pour la même raison.
    enonce: |
      (i) Si $I \subsetneq J$ sont deux idéaux non nuls, $[\mathcal O : J] < [\mathcal O : I]$. Tout idéal non nul est engendré, comme groupe, par une partie finie.

      (ii) Si $I$ est un idéal non nul et $x \in K$ vérifie $xI \subset I$, alors $x \in \mathcal O$.

      (iii) Tout idéal non nul $I$ contient un produit $\mathfrak p_1 \cdots \mathfrak p_r$ d'idéaux premiers non nuls, le produit vide valant $\mathcal O$.
    preuve: |
      (i) Dans le groupe fini $\mathcal O/I$, le sous-groupe $J/I$ a au moins deux éléments, puisque $J \neq I$, et ses classes sont les images réciproques des éléments de $\mathcal O/J$ par la surjection $x + I \mapsto x + J$. Le théorème de Lagrange ({{gs-lagrange|Lagrange}}) donne $[\mathcal O : I] = [\mathcal O : J] \cdot |J/I| > [\mathcal O : J]$. Ensuite, $I$ contient l'entier $n = |N(\alpha)| \geqslant 1$ pour un $\alpha \in I$ non nul, comme dans la preuve de {{an-ideaux|Idéaux}}, (iii), donc le groupe $n\mathcal O$, engendré par $n$ et $n\omega$ si $\mathcal O = \mathbb Z + \mathbb Z\omega$ ({{an-quadratiques|Corps quadratiques}}, (ii)) ; et $I$ est la réunion de ses classes modulo $n\mathcal O$, en nombre fini puisque $\mathcal O/n\mathcal O$ est fini. Un représentant de chaque classe, avec $n$ et $n\omega$, engendre $I$ ; ce sont des choix en nombre fini.

      (ii) Par (i), $I$ est un sous-groupe non nul de $\lex{ensemble-complexes}{\mathbb C}$ de type fini, stable par multiplication par $x$ : $x$ est un [[entier-algebrique|entier algébrique]] ({{an-entiers|Entiers algébriques}}, (i)), et, comme il appartient à $K$, il est dans $\mathcal O$.

      (iii) Par récurrence sur l'indice. Si $I = \mathcal O$, le produit vide convient ; si $I$ est premier, $I$ lui-même. Sinon, il existe $a, b \notin I$ tels que $ab \in I$. Les idéaux $I + a\mathcal O$ et $I + b\mathcal O$ contiennent strictement $I$, donc sont d'indice plus petit par (i), et contiennent chacun un produit de premiers non nuls par hypothèse de récurrence. Leur produit est contenu dans $I + ab\mathcal O = I$, et contient le produit de ces deux produits.
    remarques:
      - |
        Un anneau intègre est **intégralement clos** si tout élément de son corps des fractions qui annule un polynôme unitaire à coefficients dans l'anneau lui appartient ; $\mathcal O$ l'est, et le point (ii) est la forme sous laquelle cette propriété sert dans la suite, avec l'écriture $\mathcal O = \mathbb Z + \mathbb Z\omega$ utilisée en (i). L'anneau $\mathbb Z[\sqrt 5]$, strictement plus petit que $\mathcal O_{\mathbb Q(\sqrt 5)}$, ne l'est pas : le nombre d'or, racine de $X^2 - X - 1$, est dans son corps des fractions sans lui appartenir. La forme (ii) y échoue aussi : le nombre d'or $\phi = \frac{1 + \sqrt 5}{2}$ stabilise l'idéal de $\mathbb Z[\sqrt 5]$ engendré par $2$ et $1 + \sqrt 5$, car $\phi \cdot 2 = 1 + \sqrt 5$ et $\phi(1 + \sqrt 5) = 3 + \sqrt 5 = 2 + (1 + \sqrt 5)$.

  - id: an-inverse
    etiquette: Idéal inverse
    nature: théorème
    titre: Tout idéal premier non nul est inversible
    texte: |
      Pour un idéal premier non nul $\mathfrak p$ de $\mathcal O$, on pose $\mathfrak p' = \{x \in K : x\mathfrak p \subset \mathcal O\}$ ; c'est un sous-groupe de $K$ stable par multiplication par $\mathcal O$, qui contient $\mathcal O$.
    enonce: |
      (i) $\mathfrak p'$ n'est pas contenu dans $\mathcal O$.

      (ii) $\mathfrak p\mathfrak p' = \mathcal O$.

      (iii) Pour tout idéal non nul $I$, $I\mathfrak p' \neq I$.
    preuve: |
      (i) Soit $a \in \mathfrak p$ non nul. Par {{an-dedekind-lemmes|Trois lemmes}}, (iii), l'idéal $a\mathcal O$ contient des produits d'idéaux premiers non nuls ; soit $r$ le plus petit nombre de facteurs d'un tel produit ({{n-ordre|Bon ordre sur ℕ}}), et $\mathfrak p_1 \cdots \mathfrak p_r \subset a\mathcal O$ l'un d'eux. On a $r \geqslant 1$, puisque $a$, élément de $\mathfrak p$, n'est pas inversible. Comme $\mathfrak p \supset \mathfrak p_1 \cdots \mathfrak p_r$ et que $\mathfrak p$ est premier, $\mathfrak p$ contient l'un des $\mathfrak p_i$ : sinon, des $x_i \in \mathfrak p_i \setminus \mathfrak p$ auraient un produit dans $\mathfrak p$. Disons $\mathfrak p \supset \mathfrak p_1$ ; comme $\mathfrak p_1$ est maximal ({{an-ideaux|Idéaux}}, (iii)) et $\mathfrak p \neq \mathcal O$, $\mathfrak p = \mathfrak p_1$. Par minimalité de $r$, $\mathfrak p_2 \cdots \mathfrak p_r \not\subset a\mathcal O$ ; soit $b$ un élément de $\mathfrak p_2 \cdots \mathfrak p_r$ hors de $a\mathcal O$. Alors $b\mathfrak p \subset \mathfrak p_1 \cdots \mathfrak p_r \subset a\mathcal O$, donc $\frac ba\,\mathfrak p \subset \mathcal O$ : $\frac ba \in \mathfrak p'$, et $\frac ba \notin \mathcal O$, puisque $b \notin a\mathcal O$.

      (iii) Si $I\mathfrak p' = I$, tout $x \in \mathfrak p'$ vérifie $xI \subset I$, donc $x \in \mathcal O$ ({{an-dedekind-lemmes|Trois lemmes}}, (ii)), ce que (i) interdit.

      (ii) Comme $1 \in \mathfrak p'$, $\mathfrak p \subset \mathfrak p\mathfrak p' \subset \mathcal O$, et $\mathfrak p\mathfrak p'$ est un idéal. Par maximalité de $\mathfrak p$, il vaut $\mathfrak p$ ou $\mathcal O$, et (iii), appliqué à $I = \mathfrak p$, exclut le premier cas.
    remarques:
      - |
        Dans $\mathbb Z[\sqrt{-5}]$, pour $\mathfrak p = (2, 1 + \sqrt{-5})$, on trouve $\mathfrak p' = \frac12\,\mathfrak p$. En effet, $\mathfrak p^2 = (2)$ ({{an-ideaux|Idéaux}}, (ii)), donc $\frac12\,\mathfrak p \cdot \mathfrak p = \mathcal O$ et $\frac12\,\mathfrak p \subset \mathfrak p'$ ; réciproquement, si $x\mathfrak p \subset \mathcal O$, alors $2x \in x\mathfrak p^2 \subset \mathfrak p$. L'élément $\frac{1 + \sqrt{-5}}2$ de $\mathfrak p'$ n'est pas entier : c'est l'élément $\frac ba$ de la preuve, pour $a = 2$ et $b = 1 + \sqrt{-5}$.
      - |
        L'erreur la plus répandue est de croire que $\mathfrak p'$ est un idéal de $\mathcal O$. Ce n'est qu'un sous-groupe de $K$, stable par $\mathcal O$, et $a\mathfrak p' \subset \mathcal O$ pour tout $a \in \mathfrak p$ non nul : un **idéal fractionnaire**, c'est-à-dire un tel sous-groupe non nul $M$ pour lequel $dM \subset \mathcal O$ avec un $d \neq 0$. Il contient strictement $\mathcal O$ ; c'est précisément en sortant de $\mathcal O$ que l'on trouve un inverse.

  - id: an-factorisation
    etiquette: Factorisation des idéaux
    nature: théorème
    titre: Factorisation unique des idéaux
    enonce: |
      Tout idéal non nul $I$ de $\mathcal O$ s'écrit $I = \mathfrak p_1 \cdots \mathfrak p_r$, produit d'idéaux premiers non nuls, et cette écriture est unique à l'ordre des facteurs près. Par suite, si $I$, $J$, $J'$ sont des idéaux de $\mathcal O$ avec $I \neq \{0\}$ et $IJ = IJ'$, alors $J = J'$.
    preuve: |
      *Existence*, par récurrence sur l'indice $[\mathcal O : I]$. Si $I = \mathcal O$, le produit vide convient. Sinon, parmi les idéaux $J \neq \mathcal O$ qui contiennent $I$, en nombre fini puisqu'ils correspondent à des parties de l'ensemble fini $\mathcal O/I$, prenons-en un d'indice minimal, $\mathfrak p$ ; il est maximal par {{an-dedekind-lemmes|Trois lemmes}}, (i), donc premier ({{a-premier-maximal|Idéaux premiers, maximaux}}, (iii)). Alors $I\mathfrak p' \subset \mathfrak p\mathfrak p' = \mathcal O$ est un idéal, il contient $I$ puisque $1 \in \mathfrak p'$, et il est différent de $I$ ({{an-inverse|Idéal inverse}}, (iii)) : il est d'indice plus petit, et s'écrit $\mathfrak p_2 \cdots \mathfrak p_r$ par hypothèse de récurrence. Donc $I = I(\mathfrak p'\mathfrak p) = (I\mathfrak p')\mathfrak p = \mathfrak p\,\mathfrak p_2 \cdots \mathfrak p_r$.

      *Unicité*, par récurrence sur $r$. Si $\mathfrak p_1 \cdots \mathfrak p_r = \mathfrak q_1 \cdots \mathfrak q_s$ et $r = 0$, alors $\mathcal O = \mathfrak q_1 \cdots \mathfrak q_s$, contenu dans $\mathfrak q_1 \neq \mathcal O$ si $s \geqslant 1$ : donc $s = 0$. Si $r \geqslant 1$, alors $s \geqslant 1$ par le cas précédent, les rôles étant échangés, et $\mathfrak p_1$ contient $\mathfrak q_1 \cdots \mathfrak q_s$, donc l'un des $\mathfrak q_j$, comme dans la preuve de {{an-inverse|Idéal inverse}}, (i), et $\mathfrak p_1 = \mathfrak q_j$ par maximalité. En multipliant par $\mathfrak p_1'$, qui vérifie $\mathfrak p_1'\mathfrak p_1 = \mathcal O$, on simplifie par $\mathfrak p_1$, et l'hypothèse de récurrence conclut. La simplification par $I$ s'obtient de même, facteur premier par facteur premier.
    remarques:
      - |
        Dans $\mathbb Z[\sqrt{-5}]$, soient $\mathfrak p = (2, 1 + \sqrt{-5})$, $\mathfrak q = (3, 1 + \sqrt{-5})$ et $\mathfrak q' = (3, 1 - \sqrt{-5})$. Ils sont premiers. En effet, pour un nombre premier $\ell$ et un entier $c$ tel que $c^2 \equiv -5 \pmod \ell$, l'application $a + b\sqrt{-5} \mapsto \overline{a + bc}$ est un morphisme d'anneaux surjectif sur le corps $\mathbb Z/\ell\mathbb Z$, comme on le vérifie en développant un produit. Pour $(\ell, c) = (2, 1)$, $(3, -1)$ et $(3, 1)$, son noyau contient $\ell$ et $1 \pm \sqrt{-5}$, et il est contenu dans l'idéal correspondant : si $a + bc \equiv 0$, alors $a + b\sqrt{-5} = b(\sqrt{-5} - c) + (a + bc)$, où $\sqrt{-5} - c$ vaut $\sqrt{-5} - 1 = (1 + \sqrt{-5}) - 2$, $1 + \sqrt{-5}$ ou $-(1 - \sqrt{-5})$. Les trois idéaux sont donc des noyaux de morphismes surjectifs vers des corps, donc maximaux, puis premiers ({{a-premier-maximal|Idéaux premiers, maximaux}}, (ii) et (iii)). Ensuite $\mathfrak q\mathfrak q'$ est engendré par $9$, $3(1 - \sqrt{-5})$, $3(1 + \sqrt{-5})$ et $(1 + \sqrt{-5})(1 - \sqrt{-5}) = 6$, tous multiples de $3$, et contient $9 - 6 = 3$ : $\mathfrak q\mathfrak q' = (3)$. Le même calcul donne $\mathfrak p\mathfrak q = (1 + \sqrt{-5})$ et $\mathfrak p\mathfrak q' = (1 - \sqrt{-5})$, et l'on a vu $\mathfrak p^2 = (2)$ ({{an-ideaux|Idéaux}}, (ii)) ; un calcul des réseaux de $\mathbb Z^2$ correspondants le confirme. Les deux factorisations de $6$ en irréductibles,
        $$6 = 2 \cdot 3 = (1 + \sqrt{-5})(1 - \sqrt{-5}),$$
        sont deux façons de regrouper les quatre facteurs de l'unique factorisation $(6) = \mathfrak p^2\mathfrak q\mathfrak q'$ : $(\mathfrak p^2)(\mathfrak q\mathfrak q')$ et $(\mathfrak p\mathfrak q)(\mathfrak p\mathfrak q')$. Aucun des quatre facteurs n'est principal. Pour $\mathfrak p$, c'est {{an-ideaux|Idéaux}}, (ii). Si l'on avait $\mathfrak q = (\gamma)$, $N(\gamma)$ diviserait $N(3) = 9$ et $N(1 + \sqrt{-5}) = 6$ ({{an-unites|Norme, unités}}, (i)), donc $3$ ; or $3$ n'est pas de la forme $a^2 + 5b^2$, et $N(\gamma) = 1$ ferait de $\mathfrak q$ l'anneau tout entier, puis $\mathfrak q' = \mathfrak q\mathfrak q' = (3)$, qui ne contient pas $1 - \sqrt{-5}$. Le cas de $\mathfrak q'$ est symétrique, par conjugaison.

        ```schema an-factorisation
        Les quatre facteurs premiers de $(6)$ dans $\mathbb Z[\sqrt{-5}]$. En haut, on les regroupe en $\mathfrak p^2 = (2)$ et $\mathfrak q\mathfrak q' = (3)$ ; en bas, en $\mathfrak p\mathfrak q = (1 + \sqrt{-5})$ et $\mathfrak p\mathfrak q' = (1 - \sqrt{-5})$. Aucun des quatre facteurs n'est principal, ce qui explique que les éléments, eux, ne se factorisent pas de façon unique.
        ```
      - |
        Deux idéaux non nuls $I$ et $J$ sont dans la même **classe** s'il existe $\alpha, \beta \in \mathcal O$ non nuls tels que $\alpha I = \beta J$ ; la factorisation et l'idéal inverse font des classes un groupe, le **groupe des classes**, dont le neutre est la classe des idéaux principaux. Sa finitude reste admise ici ; elle demande de comparer l'indice d'un produit au produit des indices, puis un argument de géométrie des nombres. Pour $\mathbb Z[\sqrt{-5}]$, ce groupe a deux éléments, ce qui est aussi admis : pour tout idéal non principal $I$, l'idéal $\mathfrak pI$ est principal, comme $\mathfrak p\mathfrak q = (1 + \sqrt{-5})$.

