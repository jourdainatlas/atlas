# Niveau 1 : structure interne du nœud « Théorie algébrique des nombres ».
# Entiers algébriques (astuce du déterminant), anneaux d'entiers des corps quadratiques,
# norme et unités, entiers de Gauss et théorème des deux carrés de Fermat, défaut de
# factorialité de ℤ[√−5] et idéaux. La factorisation unique des idéaux dans les anneaux de
# Dedekind et la finitude du groupe des classes sont admises et signalées.
# Parents : théorie de Galois (extensions, polynôme minimal, corps finis), géométrie
# algébrique (spectre, idéaux premiers).

graphe: tan
titre: Théorie algébrique des nombres
conteneur: tan

entrees:
  galois: [an-entiers, an-gauss]
  geoalg: [an-ideaux]

noeuds:
  - id: an-entiers
    etiquette: Entiers algébriques
    nature: théorème
    titre: Entiers algébriques
    texte: |
      Un **corps de nombres** est une [[extension-corps|extension]] finie $K$ de $\lex{ensemble-rationnels}{\mathbb Q}$ contenue dans $\lex{ensemble-complexes}{\mathbb C}$. Un élément $\alpha \in \mathbb C$ est un [[entier-algebrique|entier algébrique]] s'il annule un polynôme **unitaire** à coefficients dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}$. Un sous-groupe $M$ de $(\mathbb C, +)$ est **de type fini** s'il est engendré par un nombre fini d'éléments.
    enonce: |
      (i) $\alpha$ est un entier algébrique si et seulement s'il existe un sous-groupe de type fini $M \neq \{0\}$ de $\mathbb C$ tel que $\alpha M \subset M$.

      (ii) Les entiers algébriques forment un sous-anneau de $\mathbb C$. Pour un corps de nombres $K$, les entiers algébriques de $K$ forment un anneau $\lex{anneau-entiers}{\mathcal O_K}$, l'**anneau des entiers** de $K$.

      (iii) Un nombre rationnel qui est un entier algébrique est un entier : $\mathcal O_{\mathbb Q} = \mathbb Z$.

      (iv) Le polynôme minimal sur $\mathbb Q$ d'un entier algébrique est à coefficients entiers.
    preuve: |
      (i) Si $\alpha^n = -\sum_{k<n} c_k\alpha^k$ avec $c_k \in \mathbb Z$, le groupe $M$ engendré par $1, \alpha, \dots, \alpha^{n-1}$ convient : par récurrence, toute puissance de $\alpha$ y appartient. Réciproquement, si $M$ est engendré par $x_1, \dots, x_m$, non tous nuls, écrivons $\alpha x_i = \sum_j a_{ij}x_j$ avec $a_{ij} \in \mathbb Z$. La matrice $\alpha I - A$ annule le vecteur non nul $(x_j)$ de $\lex{n-uplet}{\mathbb C^m}$, donc son déterminant est nul ({{v-determinant|Déterminant}}, (ii)) ; or $\det(XI - A)$ est un polynôme unitaire à coefficients entiers, par la formule du déterminant.

      (ii) Si $\alpha$ et $\beta$ sont entiers, de degrés unitaires $n$ et $p$, le groupe $M$ engendré par les $\alpha^i\beta^j$, $i < n$, $j < p$, contient $1$, et il est stable par multiplication par $\alpha$ et par $\beta$, donc par $\alpha \pm \beta$ et $\alpha\beta$ ; on applique (i). Pour $K$, on intersecte avec le corps $K$.

      (iii) Si $r = a/b$ avec $a \wedge b = 1$, $b \geqslant 1$, annule $X^n + \sum_{k<n} c_kX^k$, alors $a^n = -b\sum_{k<n}c_ka^kb^{n-1-k}$, et $b$ divise $a^n$ ; par le lemme de Gauss ({{z-bezout|Bézout}}), $b$ divise $1$.

      (iv) Soit $P$ unitaire entier annulant $\alpha$. Le polynôme minimal $\mu$ divise $P$ ; dans un corps de décomposition, ses racines sont des racines de $P$, donc des entiers algébriques. Ses coefficients, fonctions polynomiales symétriques à coefficients entiers de ces racines, sont des entiers algébriques par (ii), et rationnels : ils sont entiers par (iii).
    remarques:
      - |
        Le nombre d'or $\frac{1 + \sqrt 5}{2}$, racine de $X^2 - X - 1$, est un entier algébrique, bien qu'il ait un dénominateur. L'erreur la plus répandue est de croire que $\mathcal O_K$ est toujours $\mathbb Z[\alpha]$ pour un générateur « évident » $\alpha$ de $K$ : pour $K = \mathbb Q(\sqrt 5)$, $\mathbb Z[\sqrt 5]$ est strictement plus petit que $\mathcal O_K$.

  - id: an-quadratiques
    etiquette: Corps quadratiques
    nature: théorème
    titre: Anneaux d'entiers des corps quadratiques
    texte: |
      Soit $d \neq 0, 1$ un entier sans facteur carré et $K = \mathbb Q(\sqrt d)$, de degré $2$. Le **conjugué** de $\alpha = a + b\sqrt d$, $a, b \in \lex{ensemble-rationnels}{\mathbb Q}$, est $\bar\alpha = a - b\sqrt d$ ; sa **trace** est $\alpha + \bar\alpha = 2a$ et sa [[norme-algebrique|norme]] $N(\alpha) = \alpha\bar\alpha = a^2 - db^2$.
    enonce: |
      (i) $\alpha \in K$ est un entier algébrique si et seulement si sa trace et sa norme sont des entiers.

      (ii) $\lex{anneau-entiers}{\mathcal O_K} = \mathbb Z[\sqrt d]$ si $d \equiv 2$ ou $3 \pmod 4$, et $\mathcal O_K = \lex{ensemble-entiers-relatifs}{\mathbb Z}\big[\frac{1 + \sqrt d}{2}\big]$ si $d \equiv 1 \pmod 4$.
    preuve: |
      (i) Si $b = 0$, c'est {{an-entiers|Entiers algébriques}}, (iii). Sinon, $\alpha \notin \mathbb Q$ annule $X^2 - 2aX + (a^2 - db^2)$, qui est donc son polynôme minimal ; on applique {{an-entiers|Entiers algébriques}}, (iv), et la réciproque est immédiate.

      (ii) Soit $\alpha = a + b\sqrt d$ entier. Posons $A = 2a \in \mathbb Z$ ; alors $4N(\alpha) = A^2 - d(2b)^2 \in 4\mathbb Z$, donc $d(2b)^2 \in \mathbb Z$, et, $d$ étant sans facteur carré, $B = 2b \in \mathbb Z$. La condition devient $A^2 \equiv dB^2 \pmod 4$. Les carrés valent $0$ ou $1$ modulo $4$. Si $d \equiv 2, 3$, elle force $A$ et $B$ pairs : $a, b \in \mathbb Z$. Si $d \equiv 1$, elle force $A \equiv B \pmod 2$, et $\alpha = \frac{A - B}{2} + B\,\frac{1 + \sqrt d}{2}$ avec $\frac{A - B}2 \in \mathbb Z$. Réciproquement, ces éléments sont entiers par (i), $\frac{1 + \sqrt d}{2}$ ayant pour trace $1$ et pour norme $\frac{1 - d}{4} \in \mathbb Z$.
    remarques:
      - |
        Pour $d = -1$, on obtient l'anneau $\mathbb Z[i]$ des **entiers de Gauss** ; pour $d = -3$, l'anneau $\mathbb Z[j]$ des entiers d'Eisenstein, où $j = \frac{-1 + \sqrt{-3}}2$ est une racine cubique de l'unité. Ce sont des réseaux du plan complexe, carré et hexagonal.

  - id: an-unites
    etiquette: Norme, unités
    nature: proposition
    titre: Norme et unités
    enonce: |
      (i) La norme est multiplicative : $N(\alpha\beta) = N(\alpha)N(\beta)$.

      (ii) Un élément $\alpha \in \lex{anneau-entiers}{\mathcal O_K}$ est inversible dans $\mathcal O_K$ si et seulement si $N(\alpha) = \pm 1$.

      (iii) Pour $d < 0$, les unités sont en nombre fini : $\pm 1$ en général, $\pm 1, \pm i$ pour $d = -1$, et les six racines sixièmes de l'unité pour $d = -3$.

      (iv) Pour $d = 2$, $1 + \sqrt 2$ est une unité d'ordre infini : $\mathbb Z[\sqrt 2]$ a une infinité d'unités.
    preuve: |
      (i) La conjugaison $\alpha \mapsto \bar\alpha$ est un automorphisme de $K$, puisque $\sqrt d$ et $-\sqrt d$ ont le même polynôme minimal ({{gs-decomposition|Corps de décomposition}}) ; donc $\overline{\alpha\beta} = \bar\alpha\bar\beta$.

      (ii) Si $\alpha\beta = 1$ avec $\beta \in \mathcal O_K$, $N(\alpha)N(\beta) = 1$ avec des normes entières ({{an-quadratiques|Corps quadratiques}}). Réciproquement, si $N(\alpha) = \pm 1$, $\alpha^{-1} = \pm\bar\alpha$, et $\bar\alpha$ est entier, ayant même trace et même norme que $\alpha$.

      (iii) Pour $d < 0$, $N(a + b\sqrt d) = a^2 + |d|b^2$, avec $a, b \in \frac12\lex{ensemble-entiers-relatifs}{\mathbb Z}$ ; l'équation $N = 1$ n'a qu'un nombre fini de solutions, que l'on énumère.

      (iv) $N(1 + \sqrt 2) = 1 - 2 = -1$. Comme $1 + \sqrt 2 > 1$, ses puissances sont strictement croissantes, donc deux à deux distinctes.
    remarques:
      - |
        Les unités de $\mathbb Z[\sqrt 2]$ donnent toutes les solutions de l'équation de Pell-Fermat $x^2 - 2y^2 = \pm 1$ : $(1 + \sqrt 2)^2 = 3 + 2\sqrt 2$, $(1 + \sqrt 2)^3 = 7 + 5\sqrt 2$, et $49 - 50 = -1$. Le théorème des unités de Dirichlet décrit en général le groupe des unités d'un corps de nombres ; il est admis ici.

  - id: an-gauss
    etiquette: Deux carrés
    nature: théorème
    titre: Entiers de Gauss et théorème des deux carrés
    enonce: |
      (i) $\lex{entiers-gauss}{\mathbb Z[i]}$ est euclidien pour la norme : pour $\alpha, \beta \in \mathbb Z[i]$, $\beta \neq 0$, il existe $q, r$ avec $\alpha = \beta q + r$ et $N(r) < N(\beta)$. Il est principal, et le lemme d'Euclide y vaut : un irréductible qui divise un produit divise l'un des facteurs.

      (ii) *Fermat.* Un nombre premier $p$ impair est somme de deux carrés si et seulement si $p \equiv 1 \pmod 4$.
    preuve: |
      (i) Écrivons $\alpha/\beta = x + iy$ avec $x, y \in \lex{ensemble-rationnels}{\mathbb Q}$, et choisissons des entiers $m, n$ avec $|x - m|, |y - n| \leqslant \frac12$. Pour $q = m + in$, $N(\alpha/\beta - q) \leqslant \frac14 + \frac14 < 1$, et $r = \alpha - \beta q$ vérifie $N(r) = N(\beta)N(\alpha/\beta - q) < N(\beta)$. Comme pour $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ ({{z-ideaux|Idéaux de ℤ}}), un idéal non nul est engendré par un élément de norme minimale. Si $\pi$ est irréductible et ne divise pas $\alpha$, l'idéal $(\pi, \alpha)$, engendré par un diviseur de $\pi$, est tout l'anneau : $1 = u\pi + v\alpha$, et si $\pi \mid \alpha\beta$, alors $\pi \mid u\pi\beta + v\alpha\beta = \beta$.

      (ii) Si $p = a^2 + b^2$, les carrés valant $0$ ou $1$ modulo $4$, $p \equiv 1$. Réciproquement, si $p \equiv 1 \pmod 4$, le groupe $\lex{corps-fini}{\mathbb F_p}^\times$ est cyclique d'ordre $p - 1$, divisible par $4$ ({{gs-corps-finis|Corps finis}}) : il contient un élément $x$ d'ordre $4$, et $x^2 = -1$. Donc $p$ divise $x^2 + 1 = (x + i)(x - i)$, sans diviser aucun facteur, puisque $\frac{x \pm i}{p} \notin \mathbb Z[i]$. Par le lemme d'Euclide, $p$ n'est pas irréductible : $p = \alpha\beta$ avec $N(\alpha), N(\beta) > 1$ ({{an-unites|Norme, unités}}). Comme $N(\alpha)N(\beta) = p^2$, $N(\alpha) = p$, et $\alpha = a + bi$ donne $p = a^2 + b^2$.
    remarques:
      - |
        On vérifie $5 = 1 + 4$, $13 = 4 + 9$, $17 = 1 + 16$, $29 = 4 + 25$, $37 = 1 + 36$, $41 = 16 + 25$, alors que $3$, $7$, $11$, $19$, $23$ ne sont sommes d'aucun couple de carrés. La démonstration n'exhibe pas la décomposition ; l'algorithme d'Euclide dans $\mathbb Z[i]$, appliqué à $p$ et $x + i$, la calcule.

  - id: an-ideaux
    etiquette: Idéaux
    nature: proposition
    titre: Défaut de factorialité et idéaux
    enonce: |
      (i) Dans $\mathbb Z[\sqrt{-5}]$, $6 = 2 \cdot 3 = (1 + \sqrt{-5})(1 - \sqrt{-5})$ sont deux décompositions en irréductibles non associés : la factorisation en irréductibles n'est pas unique.

      (ii) L'idéal $\mathfrak p = (2, 1 + \sqrt{-5})$ vérifie $\mathfrak p^2 = (2)$ ; il n'est pas principal.

      (iii) Dans l'anneau des entiers d'un corps quadratique, tout idéal non nul $I$ est d'indice fini, et tout idéal premier non nul est maximal.
    preuve: |
      (i) $N(a + b\sqrt{-5}) = a^2 + 5b^2$ ne prend jamais les valeurs $2$ ni $3$. Les normes de $2$, $3$, $1 \pm \sqrt{-5}$ valent $4$, $9$, $6$ ; une factorisation non triviale de l'un d'eux ferait apparaître un facteur de norme $2$ ou $3$ ({{an-unites|Norme, unités}}) : ils sont irréductibles. Les seules unités sont $\pm 1$, et $2$ n'est associé ni à $1 + \sqrt{-5}$ ni à $1 - \sqrt{-5}$.

      (ii) $\mathfrak p^2$ est engendré par $4$, $2(1 + \sqrt{-5})$ et $(1 + \sqrt{-5})^2 = -4 + 2\sqrt{-5}$, tous multiples de $2$ ; il contient $2(1 + \sqrt{-5}) - (-4 + 2\sqrt{-5}) - 4 = 2$. Donc $\mathfrak p^2 = (2)$. Si $\mathfrak p = (\gamma)$, alors $N(\gamma)^2 = N(2) = 16$ et $N(\gamma) = 4$, puisque $N(\gamma) = 2$ est impossible ; $\gamma$ diviserait $2$ avec un quotient de norme $1$, donc $\gamma = \pm 2$, mais $1 + \sqrt{-5} \notin (2)$.

      (iii) $I$ contient $n = N(\alpha) = \alpha\bar\alpha \neq 0$ pour un $\alpha \in I$ non nul, donc $n\lex{anneau-entiers}{\mathcal O_K} \subset I$, et $\mathcal O_K/n\mathcal O_K$ est fini, $\mathcal O_K$ étant engendré comme groupe par deux éléments. Si $\mathfrak p$ est premier, $\mathcal O_K/\mathfrak p$ est un anneau intègre fini ({{a-premier-maximal|Idéaux premiers et maximaux}}), donc un corps, la multiplication par un élément non nul étant injective, donc bijective ; et $\mathfrak p$ est maximal.
    remarques:
      - |
        Kummer et Dedekind ont restauré l'unicité au niveau des idéaux : dans $\mathcal O_K$, tout idéal non nul est, de façon unique, produit d'idéaux premiers. Ici $(6) = \mathfrak p^2\,\mathfrak q\,\mathfrak q'$ avec $\mathfrak q = (3, 1 + \sqrt{-5})$ et $\mathfrak q' = (3, 1 - \sqrt{-5})$, et les deux factorisations de $6$ regroupent différemment ces quatre facteurs. Ce théorème, et la finitude du **groupe des classes** qui mesure le défaut de principalité, sont admis ici.
      - |
        Le point (iii) dit que $\lex{spectre-premier}{\operatorname{Spec}}\mathcal O_K$, en {{geoalg|géométrie algébrique}}, est de dimension $1$ : un point générique, l'idéal nul, et des points fermés, les idéaux maximaux. L'arithmétique des corps de nombres est ainsi la géométrie de « courbes » au-dessus de $\operatorname{Spec}\lex{ensemble-entiers-relatifs}{\mathbb Z}$.

