# Niveau 1 : structure interne du nœud « Groupes de Lie ».
# Groupes de Lie et exemples matriciels (GLₙ, O(n), SO(n)), exponentielle de matrices comme
# difféomorphisme local, sous-groupes à un paramètre, algèbre de Lie d'un sous-groupe fermé
# (formules de Trotter et du commutateur), théorème de Cartan-von Neumann (démontré, 28 oct. 2026,
# avec le lemme des séries de polynômes, qui rend l'exponentielle C^∞, et le lemme des petits éléments).
# Parents : groupes topologiques, équations différentielles (exponentielle de matrices),
# donc géométrie différentielle.

graphe: lie
titre: Groupes de Lie
conteneur: lie

entrees:
  grtop: [li-definition]
  edo: [li-series, li-exponentielle, li-un-parametre]

noeuds:
  - id: li-definition
    etiquette: Groupes de Lie
    nature: définition
    titre: Groupes de Lie et groupes de matrices
    texte: |
      Un [[groupe-lie|groupe de Lie]] est un groupe $G$ muni d'une structure de [[variete-differentiable|variété différentiable]] pour laquelle la multiplication $G \times G \to G$ et l'inversion $G \to G$ sont des [[application-lisse|applications lisses]], $G \times G$ étant muni de la structure produit ({{gd-varietes|Variétés différentiables}}, (iv)).
    enonce: |
      (i) Un groupe de Lie est un [[groupe-topologique|groupe topologique]].

      (ii) $(\lex{n-uplet}{\mathbb R^n}, +)$ et $\lex{groupe-lineaire}{GL_n}(\lex{ensemble-reels}{\mathbb R})$, ouvert de $\lex{espace-matrices}{\mathcal M_n}(\mathbb R) \cong \mathbb R^{n^2}$, sont des groupes de Lie.

      (iii) Le **groupe orthogonal** $\lex{groupe-orthogonal}{O(n)} = \{A : {}^tAA = I\}$ est une sous-variété de $\mathcal M_n(\mathbb R)$ de dimension $\frac{n(n-1)}2$, et un groupe de Lie ; il en va de même de $SO(n) = O(n) \cap \{\det = 1\}$, ouvert et fermé dans $O(n)$.
    preuve: |
      (i) Une application lisse est continue, et une variété est séparée.

      (ii) La multiplication des matrices est polynomiale en les coefficients, donc $C^\infty$ ; l'inversion est $C^\infty$ sur l'ouvert $GL_n(\mathbb R)$ ({{gd-gl|Groupe linéaire}}).

      (iii) Soit $\mathcal S$ l'espace des matrices symétriques, de dimension $\frac{n(n+1)}2$, et $F(A) = {}^tAA$, de $\mathcal M_n$ dans $\mathcal S$, polynomiale, de différentielle $dF(A)H = {}^tHA + {}^tAH$. Pour $A \in O(n)$ et $S \in \mathcal S$, $H = AS/2$ vérifie ${}^tHA = \frac12 S\,{}^tAA = \frac S2$ et ${}^tAH = \frac S2$, donc $dF(A)H = S$ : $dF(A)$ est surjective, et $O(n) = F^{-1}(I)$ est une sous-variété de dimension $n^2 - \frac{n(n+1)}2 = \frac{n(n-1)}2$ ({{gd-sous-varietes|Sous-variétés de ℝⁿ}}). La multiplication et l'inversion $A \mapsto {}^tA$ y sont des restrictions d'applications $C^\infty$ de l'espace ambiant, donc lisses ({{gd-applications-lisses|Applications lisses}}, (iv)). Enfin $\det A = \pm 1$ sur $O(n)$, et $SO(n)$ est l'image réciproque de l'ouvert $\{\det > 0\}$.
    remarques:
      - |
        $SO(2)$ est le cercle : ses éléments sont les matrices $\begin{pmatrix} a & -b \\ b & a \end{pmatrix}$ avec $a^2 + b^2 = 1$, et la multiplication y est celle des nombres complexes de module $1$. $SO(3)$ est le groupe des rotations de l'espace, de dimension $3$ : une rotation est déterminée par un axe, qui dépend de deux paramètres, et un angle.

  - id: li-series
    etiquette: Séries de polynômes
    nature: lemme
    titre: Séries de fonctions polynomiales indéfiniment dérivables
    texte: |
      Sur $\lex{n-uplet}{\mathbb R^N}$, on note $\|x\|_\infty = \max_i |x_i|$. Pour une suite finie $J = (j_1, \dots, j_m)$ d'indices de $\{1, \dots, N\}$, éventuellement vide, et une fonction $f$ dont les dérivées partielles successives existent, on note $\partial_J f = \partial_{j_1}(\partial_{j_2}(\cdots \partial_{j_m} f))$, avec $\partial_\emptyset f = f$.
    enonce: |
      Soit $(p_k)$ une suite de fonctions polynomiales de $\mathbb R^N$ dans $\lex{ensemble-reels}{\mathbb R}$. On suppose que, pour tout $r > 0$ et toute suite finie d'indices $J$, la série $\sum_k M_k(J, r)$ converge, où
      $$M_k(J, r) = \sup_{\|x\|_\infty \leqslant r} |\partial_J p_k(x)|.$$
      Alors $f = \sum_k p_k$ est de classe $C^\infty$ sur $\mathbb R^N$, et $\partial_J f = \sum_k \partial_J p_k$ pour toute suite finie $J$.
    preuve: |
      *Une variable.* Soit $(u_k)$ une suite de fonctions réelles de classe $C^1$ sur un segment $[a, b]$, telle que $\sum u_k$ et $\sum u_k'$ convergent uniformément sur $[a, b]$, de sommes $S$ et $g$. Montrons que $S$ est dérivable, de dérivée $g$. La fonction $g$ est continue, comme limite uniforme de fonctions continues ({{cx-convergence-uniforme|Convergence uniforme}}, (i)). Pour $t \in [a, b]$, $\sum_{k < K}\big(u_k(t) - u_k(a)\big) = \int_a^t \sum_{k < K} u_k'$ (même nœud, (iv)), et, en faisant tendre $K$ vers l'infini, $S(t) - S(a) = \int_a^t g$ (même nœud, (iii)). Pour $t$ et $t + h$ dans $[a, b]$, avec $h \neq 0$, la relation de Chasles ({{ri-proprietes|Propriétés de l'intégrale}}, (v)) donne
      $$\frac{S(t + h) - S(t)}{h} - g(t) = \frac1h\int_t^{t+h}\big(g - g(t)\big),$$
      de valeur absolue au plus $\sup_{|v - t| \leqslant |h|} |g(v) - g(t)|$ ({{ri-moyenne|Inégalité de la moyenne}}, (i)), qui tend vers $0$ avec $h$ puisque $g$ est continue en $t$.

      *Dérivées partielles.* Disons qu'une fonction est admissible si elle s'écrit $\sum_k p_k$ avec $(p_k)$ comme dans l'énoncé. Soit $f = \sum_k p_k$ admissible. Pour tout $r > 0$, la série converge uniformément sur le cube $C_r = \{\|x\|_\infty \leqslant r\}$, par le critère de Weierstrass (même nœud, (ii)) appliqué avec $J = \emptyset$ ; $f$ est donc continue sur l'intérieur de chaque $C_r$, c'est-à-dire sur $\mathbb R^N$. Soit $x \in \mathbb R^N$, $j \in \{1, \dots, N\}$, $r = \|x\|_\infty + 1$, et $u_k(t) = p_k(x + te_j)$ pour $t \in [-1, 1]$. Ce sont des polynômes en $t$, de dérivées $u_k'(t) = \partial_j p_k(x + te_j)$, et $x + te_j \in C_r$ : on a $|u_k| \leqslant M_k(\emptyset, r)$ et $|u_k'| \leqslant M_k((j), r)$, de sorte que les deux séries convergent uniformément sur $[-1, 1]$. Le premier pas montre que $t \mapsto f(x + te_j)$ est dérivable en $0$, c'est-à-dire que $\partial_j f(x)$ existe, et que $\partial_j f(x) = \sum_k \partial_j p_k(x)$. Enfin, la suite $(\partial_j p_k)$ vérifie encore l'hypothèse, puisque $\partial_J(\partial_j p_k) = \partial_{(J, j)} p_k$ : $\partial_j f$ est admissible.

      *Conclusion.* Montrons par récurrence sur $m$ que toute fonction admissible est de classe $C^m$. Pour $m = 0$, c'est la continuité. Si c'est vrai au rang $m$, une fonction admissible $f$ a des dérivées partielles admissibles, donc continues : elle est de classe $C^1$ ({{gd-classe-ck|Classe Cᵏ}}, (i)), et $df$, dont les composantes dans les bases canoniques sont les $\partial_j f$, est de classe $C^m$ par l'hypothèse de récurrence (même nœud, (ii)) ; $f$ est donc de classe $C^{m+1}$. La formule $\partial_J f = \sum_k \partial_J p_k$ s'obtient en itérant le deuxième pas.
    remarques:
      - |
        L'hypothèse porte sur toutes les dérivées, et pas seulement sur la série elle-même. La série $\sum_{k \geqslant 1} t^k/k^2$ converge uniformément sur $[-1, 1]$, mais sa somme $f$ n'est pas dérivable à gauche en $1$. Sur $]-1, 1[$, elle est dérivable de dérivée $\sum_{k \geqslant 1} t^{k-1}/k$, par le premier pas de la preuve appliqué sur les segments $[-\rho, \rho]$ avec $\rho < 1$ (le lemme lui-même ne s'applique pas, la série divergeant hors de $[-1, 1]$). Pour $0 \leqslant t < 1$, l'égalité des accroissements finis ({{de-taf|Égalité des accroissements finis}}) donne $c \in \,]t, 1[$ tel que $\frac{f(1) - f(t)}{1 - t} = f'(c)$, et, les termes étant positifs, $f'(c) \geqslant \sum_{k \leqslant K} c^{k-1}/k \geqslant \sum_{k \leqslant K} t^{k-1}/k$ pour tout $K$. Quand $t \to 1$, ce minorant tend vers $\sum_{k \leqslant K} 1/k$, aussi grand qu'on veut : le taux tend vers $+\infty$.
      - |
        C'est l'analogue réel, à plusieurs variables, de la dérivation terme à terme des séries entières ({{cx-derivation-series|Dérivation terme à terme}}). On ne peut pas simplement invoquer ce dernier énoncé : une série de polynômes de plusieurs variables n'est pas une série entière d'une variable, et la réorganiser en une telle série demanderait des sommations par paquets que le lemme évite.

  - id: li-exponentielle
    etiquette: Exponentielle
    nature: théorème
    titre: L'exponentielle, difféomorphisme local en 0
    enonce: |
      L'application $\exp : \lex{espace-matrices}{\mathcal M_n}(\lex{ensemble-reels}{\mathbb R}) \to \lex{groupe-lineaire}{GL_n}(\mathbb R)$, $A \mapsto e^A$, est de classe $C^\infty$, avec $d\exp(0) = \mathrm{id}$. Elle induit un $C^\infty$-difféomorphisme d'un voisinage ouvert $V$ de $0$ sur un voisinage ouvert $W$ de $I$ ; on note $\log : W \to V$ sa réciproque, qui vérifie $\log(I + X) = X + \|X\|\varepsilon(X)$ avec $\varepsilon(X) \to 0$.
    preuve: |
      Munissons $\mathcal M_n$ d'une norme subordonnée. En développant le produit non commutatif, $(A + H)^k - A^k - \sum_{j=0}^{k-1}A^jHA^{k-1-j}$ est une somme de produits contenant au moins deux facteurs $H$, de norme au plus $(a + h)^k - a^k - ka^{k-1}h$, où $a = |||A|||$ et $h = |||H|||$. En sommant avec les poids $1/k!$,
      $$\Big|\Big|\Big|e^{A+H} - e^A - \sum_k \frac1{k!}\sum_j A^jHA^{k-1-j}\Big|\Big|\Big| \leqslant e^{a+h} - e^a - he^a,$$
      qui est de la forme $h\,\varepsilon(h)$, par dérivabilité de l'exponentielle réelle. Donc $\exp$ est différentiable, de différentielle $H \mapsto \sum_k \frac1{k!}\sum_j A^jHA^{k-1-j}$, qui dépend continûment de $A$, la série convergeant uniformément sur les parties bornées ; en $A = 0$, elle vaut $H$. Cela montre que $\exp$ est de classe $C^1$, avec $d\exp(0) = \mathrm{id}$.

      *Classe $C^\infty$.* Identifions $\mathcal M_n(\mathbb R)$ à $\mathbb R^{n^2}$ par les coefficients $a_{rs}$. Pour $k \geqslant 1$, le coefficient d'indice $(i, j)$ de $A^k/k!$ est
      $$p_k(A) = \frac1{k!}\sum_{i_1, \dots, i_{k-1}} a_{ii_1}a_{i_1i_2}\cdots a_{i_{k-1}j},$$
      somme de $n^{k-1}$ monômes de degré $k$ à coefficient $1$. Dériver un monôme par rapport à une variable multiplie son coefficient par l'exposant de cette variable, au plus $k$, et abaisse son degré d'une unité ; après $m$ dérivations, il reste $0$ ou un monôme de degré $k - m$ de coefficient au plus $k^m$. Sur le cube $\max_{r,s}|a_{rs}| \leqslant \rho$, toute dérivée partielle d'ordre $m$ de $p_k$ est donc majorée par $c_k = n^{k-1}k^m\rho^{k-m}/k!$ si $k \geqslant m$, et nulle si $k < m$. Le rapport $c_{k+1}/c_k = n\rho\,(1 + 1/k)^m/(k + 1)$ tend vers $0$ ; il est inférieur à $\frac12$ à partir d'un rang $K$, d'où $c_k \leqslant c_K 2^{K-k}$ pour $k \geqslant K$, et $\sum c_k$ converge. Le lemme {{li-series|Séries de polynômes}} montre que chaque coefficient de $e^A$, donc $\exp$, est de classe $C^\infty$.

      On applique alors le théorème d'inversion locale ({{gd-inversion-locale|Inversion locale}}) avec $k = \infty$. Le développement de $\log$ exprime sa différentiabilité en $I$, de différentielle $d\exp(0)^{-1} = \mathrm{id}$.
    remarques:
      - |
        L'exponentielle n'est ni injective ni surjective en général. Les matrices $tJ$, avec $J = \begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}$, ont pour exponentielle la rotation $R_t$ d'angle $t$ : la fonction $t \mapsto R_t$ vérifie $R_t' = JR_t$ et $R_0 = I$, donc $R_t = e^{tJ}$, par la formule des solutions de ({{ed-lineaires|Systèmes linéaires}}, (ii)) appliquée colonne par colonne ; et $e^{2\pi J} = I = e^0$. La matrice $\begin{pmatrix} -1 & 1 \\ 0 & -1 \end{pmatrix}$, de déterminant $1$, n'est l'exponentielle d'aucune matrice réelle ; ce fait est admis ici.

  - id: li-un-parametre
    etiquette: Sous-groupes à un paramètre
    nature: théorème
    titre: Sous-groupes à un paramètre de GLₙ
    texte: |
      Un **sous-groupe à un paramètre** de $\lex{groupe-lineaire}{GL_n}(\lex{ensemble-reels}{\mathbb R})$ est un morphisme de groupes continu $\gamma : (\mathbb R, +) \to GL_n(\mathbb R)$.
    enonce: |
      Les sous-groupes à un paramètre sont exactement les applications $t \mapsto e^{tA}$, $A \in \lex{espace-matrices}{\mathcal M_n}(\mathbb R)$, et $A = \gamma'(0)$.
    preuve: |
      $t \mapsto e^{tA}$ est un morphisme continu ({{ed-lineaires|Systèmes linéaires}}, (ii)). Réciproquement, soit $\gamma$ un morphisme continu. Les intégrales de fonctions matricielles se calculant coefficient par coefficient, $\frac1\varepsilon\int_0^\varepsilon \gamma(s)\,ds \to \gamma(0) = I$ quand $\varepsilon \to 0$ ; par la série de Neumann ({{gd-gl|Groupe linéaire}}), $P = \int_0^\varepsilon \gamma$ est inversible pour un $\varepsilon > 0$. Alors $\gamma(t)P = \int_0^\varepsilon \gamma(t + s)\,ds = \int_t^{t+\varepsilon}\gamma$, d'où $\gamma(t) = \big(\int_t^{t+\varepsilon}\gamma\big)P^{-1}$, dérivable par le théorème fondamental. En dérivant $\gamma(t + h) = \gamma(t)\gamma(h)$ en $h = 0$, $\gamma'(t) = \gamma(t)A$ avec $A = \gamma'(0)$ ; $\gamma$ et $t \mapsto e^{tA}$ sont deux solutions de $Y' = YA$ valant $I$ en $0$, égales par unicité ({{ed-cauchy-lipschitz|Cauchy-Lipschitz}}).
    remarques:
      - |
        L'hypothèse de continuité ne se réduit pas à une formalité : elle force la dérivabilité, à la manière de l'équation fonctionnelle $f(s + t) = f(s)f(t)$ pour une fonction réelle, dont les solutions continues sont les exponentielles. C'est le cinquième problème de Hilbert, résolu en 1952 par Gleason, Montgomery et Zippin, qui demandait jusqu'où va cette rigidité.

  - id: li-algebre
    etiquette: Algèbre de Lie
    nature: théorème
    titre: Algèbre de Lie d'un sous-groupe fermé
    texte: |
      Pour un sous-groupe fermé $G$ de $\lex{groupe-lineaire}{GL_n}(\lex{ensemble-reels}{\mathbb R})$, on pose $\lex{algebre-lie}{\mathfrak g} = \{A \in \lex{espace-matrices}{\mathcal M_n}(\mathbb R) : e^{tA} \in G \text{ pour tout } t \in \mathbb R\}$. Le **crochet** de deux matrices est $[A, B] = AB - BA$.
    enonce: |
      (i) *Trotter.* $\big(e^{A/k}e^{B/k}\big)^k \to e^{A+B}$ et $\big(e^{A/k}e^{B/k}e^{-A/k}e^{-B/k}\big)^{k^2} \to e^{[A,B]}$ quand $k \to \infty$.

      (ii) $\mathfrak g$ est un sous-espace vectoriel de $\mathcal M_n(\mathbb R)$, stable par crochet : c'est l'[[algebre-lie|algèbre de Lie]] de $G$.

      (iii) L'algèbre de Lie de $SL_n(\mathbb R) = \{\det = 1\}$ est l'espace des matrices de trace nulle ; celle de $\lex{groupe-orthogonal}{O(n)}$ est l'espace des matrices antisymétriques, de dimension $\frac{n(n-1)}2$.
    preuve: |
      (i) Pour une matrice $X$, $e^X = I + X + \frac{X^2}2 + R(X)$ avec $|||R(X)||| \leqslant |||X|||^3e^{|||X|||}$. En développant, $e^{A/k}e^{B/k} = I + \frac{A + B}k + O(k^{-2})$, et, pour le produit de quatre facteurs, les termes d'ordre $1$ se compensent ainsi que les carrés, et il reste $I + \frac{[A, B]}{k^2} + O(k^{-3})$. Pour $k$ grand, ces matrices sont dans le voisinage $W$ de $I$ ({{li-exponentielle|Exponentielle}}) ; posons $C_k = \log(e^{A/k}e^{B/k})$. Par le développement de $\log$, $kC_k = A + B + o(1)$, donc $\big(e^{A/k}e^{B/k}\big)^k = (e^{C_k})^k = e^{kC_k} \to e^{A+B}$ par continuité de $\exp$. De même, $k^2\log(\cdots) = [A, B] + o(1)$ pour le commutateur.

      (ii) La stabilité par multiplication par un réel est claire. Si $A, B \in \mathfrak g$, les produits $\big(e^{tA/k}e^{tB/k}\big)^k$ sont dans $G$, et leur limite $e^{t(A+B)}$ aussi, puisque $G$ est fermé. De même pour $[A, B]$, en remplaçant $A$ par $tA$ dans la formule du commutateur, qui donne $e^{t[A,B]}$.

      (iii) Par la formule de Liouville ({{ed-lineaires|Systèmes linéaires}}, (iii)), $\det e^{tA} = e^{t\operatorname{tr}A}$ vaut $1$ pour tout $t$ si et seulement si $\operatorname{tr}A = 0$. Si ${}^tA = -A$, alors ${}^t(e^{tA}) = e^{t\,{}^tA} = e^{-tA} = (e^{tA})^{-1}$ : $e^{tA} \in O(n)$. Réciproquement, en dérivant ${}^t(e^{tA})e^{tA} = I$ en $t = 0$, ${}^tA + A = 0$.
    remarques:
      - |
        La dimension de l'algèbre de Lie de $O(n)$, $\frac{n(n-1)}{2}$, est celle de la sous-variété $O(n)$ trouvée au nœud {{li-definition|Groupes de Lie}} : c'est un premier indice que $\mathfrak g$ est l'espace tangent à $G$ en $I$, ce qu'affirmera le théorème de Cartan.
      - |
        Pour $n = 3$, les matrices antisymétriques s'identifient aux vecteurs de $\mathbb R^3$, et le crochet au produit vectoriel. L'erreur la plus répandue est de croire le crochet associatif : il vérifie seulement l'identité de Jacobi $[A, [B, C]] + [B, [C, A]] + [C, [A, B]] = 0$, que l'on vérifie en développant.

  - id: li-petits
    etiquette: Pas de petits éléments
    nature: lemme
    titre: Aucun élément de G proche de I dans la direction d'un supplémentaire de g
    texte: |
      Dans ce nœud et le suivant, $G$ est un sous-groupe de $\lex{groupe-lineaire}{GL_n}(\lex{ensemble-reels}{\mathbb R})$, fermé pour la topologie induite par $\lex{espace-matrices}{\mathcal M_n}(\mathbb R)$, $\lex{algebre-lie}{\mathfrak g}$ est son algèbre de Lie ({{li-algebre|Algèbre de Lie}}), et $\mathfrak m$ un supplémentaire de $\mathfrak g$ dans $\mathcal M_n(\mathbb R)$.
    enonce: |
      Il existe $r > 0$ tel que, si $Y \in \mathfrak m$ vérifie $|||Y||| < r$ et $e^Y \in G$, alors $Y = 0$.
    preuve: |
      Si $\mathfrak m = \{0\}$, il n'y a rien à démontrer ; supposons $\mathfrak m \neq \{0\}$. Deux faits serviront. D'abord, $e^{mY} = (e^Y)^m$ pour toute matrice $Y$ et tout $m \in \lex{ensemble-entiers-relatifs}{\mathbb Z}$ : pour $m \geqslant 0$, par récurrence à partir de $e^{(s+t)Y} = e^{sY}e^{tY}$ ({{ed-lineaires|Systèmes linéaires}}, (ii)), et pour $m < 0$ parce que $e^{-Y}e^Y = e^0 = I$. Ensuite, l'application $(u, Z) \mapsto e^{uZ}$, de $\mathbb R \times \mathcal M_n(\mathbb R)$ dans $GL_n(\mathbb R)$, est continue, comme composée de $(u, Z) \mapsto uZ$ et de l'exponentielle ({{li-exponentielle|Exponentielle}}).

      Soit $K = \{Z \in \mathfrak m : |||Z||| = 1\}$. C'est une partie fermée et bornée de l'espace $\mathfrak m$, de dimension finie, donc compacte ({{gd-equivalence|Équivalence des normes}}, (ii) et (iv)). Pour $Z \in K$ et $\delta > 0$, notons $B(Z, \delta) = \{Z' \in K : |||Z' - Z||| < \delta\}$, ouvert de $K$. Disons qu'une telle boule est *bonne* s'il existe $t > 0$ tel que $e^{uZ'} \notin G$ pour tout $Z' \in B(Z, \delta)$ et tout réel $u$ vérifiant $|u - t| \leqslant \delta$.

      *Tout point de $K$ est le centre d'une bonne boule.* Soit $Z \in K$. Comme $Z \in \mathfrak m$, $Z \neq 0$ et $\mathfrak g \cap \mathfrak m = \{0\}$, $Z \notin \mathfrak g$ : il existe $t \in \mathbb R$ tel que $e^{tZ} \notin G$, et $t \neq 0$ puisque $e^0 = I \in G$. Comme $e^{-tZ} = (e^{tZ})^{-1}$ et que $G$ est un groupe, on peut supposer $t > 0$. Le complémentaire de $G$ dans $GL_n(\mathbb R)$ est un ouvert qui contient $e^{tZ}$ ; par continuité de $(u, Z') \mapsto e^{uZ'}$ en $(t, Z)$, il existe $\eta > 0$ tel que $e^{uZ'} \notin G$ dès que $|u - t| < \eta$ et $|||Z' - Z||| < \eta$. La boule $B(Z, \eta/2)$ est bonne.

      *Conclusion.* Les bonnes boules forment un recouvrement ouvert du compact $K$ ; il en existe un nombre fini, $B_1, \dots, B_q$, de rayons $\delta_1, \dots, \delta_q$, qui recouvrent $K$, et l'on associe à chacune un réel $t_i$ convenable. Posons $r = \min_i \delta_i > 0$. Soit $Y \in \mathfrak m$ avec $0 < s = |||Y||| < r$ ; montrons que $e^Y \notin G$. Le point $Z' = Y/s$ est dans $K$, donc dans une boule $B_i$. Soit $m$ le plus grand entier tel que $m \leqslant t_i/s$, et $u = ms$ : alors $t_i - s < u \leqslant t_i$, donc $|u - t_i| < s < \delta_i$, et $e^{uZ'} \notin G$. Or $uZ' = mY$, et $e^{mY} = (e^Y)^m$ : si $e^Y$ était dans $G$, ce groupe contiendrait $e^{uZ'}$. Donc $e^Y \notin G$, ce qui démontre le lemme.
    remarques:
      - |
        Le ressort de la preuve est qu'un élément $e^Y$ de $G$, s'il est proche de $I$, a des puissances qui avancent par petits pas dans la direction $Y/|||Y|||$, et ne peuvent donc pas sauter par-dessus une zone interdite.

        ```schema li-petits
        On a pris $t = 3$, $\delta = 0{,}6$ et un pas $s = 0{,}45 < \delta$. Les multiples $kY$, d'abscisses $ks$ sur la demi-droite dirigée par $Z' = Y/s$, avancent de $0{,}45$ à chaque pas ; le plus grand entier $m$ tel que $ms \leqslant t$ est $m = 6$, et $6Y$, d'abscisse $2{,}7$, tombe dans la zone rouge $|u - 3| \leqslant 0{,}6$, où $e^{uZ'}$ n'est pas dans $G$. Pourtant $e^{6Y} = (e^Y)^6$ serait dans $G$ si $e^Y$ y était.
        ```

        La largeur $2\delta$ de la zone rouge dépasse la longueur du pas : c'est pourquoi l'un des multiples y tombe nécessairement.
      - |
        La fermeture de $G$ sert ici deux fois : à travers le nœud précédent, pour que $\mathfrak g$ soit un sous-espace vectoriel et admette un supplémentaire $\mathfrak m$, et dans la preuve, pour affirmer que le complémentaire de $G$ est ouvert, ce qui fournit les bonnes boules. L'exemple de l'enroulement irrationnel, au nœud suivant, montre ce que devient un sous-groupe qui n'est pas fermé.
      - |
        La démonstration habituelle raisonne par l'absurde avec une suite $Y_k \to 0$ d'éléments interdits, dont elle extrait une suite de directions convergente. Choisir un $Y_k$ pour chaque $k$ est un usage du [[choix-denombrable|choix dénombrable]] ; le recouvrement fini du compact $K$ ne demande que des choix en nombre fini, et la preuve ci-dessus n'utilise aucune forme de l'axiome du choix.

  - id: li-cartan
    etiquette: Théorème de Cartan
    nature: théorème
    titre: Théorème de Cartan-von Neumann
    enonce: |
      Tout sous-groupe fermé $G$ de $\lex{groupe-lineaire}{GL_n}(\lex{ensemble-reels}{\mathbb R})$ est une sous-variété de $\lex{espace-matrices}{\mathcal M_n}(\mathbb R)$, de dimension $\dim \lex{algebre-lie}{\mathfrak g}$, donc un groupe de Lie, dont l'espace tangent en $I$ est $\mathfrak g$. L'exponentielle induit un difféomorphisme d'un voisinage ouvert de $0$ dans $\mathfrak g$ sur un voisinage ouvert de $I$ dans $G$.
    preuve: |
      Soit $d = \dim \mathfrak g$, $N = n^2$, $\mathfrak m$ un supplémentaire de $\mathfrak g$, et $(E_1, \dots, E_N)$ une base de $\mathcal M_n(\mathbb R)$ dont les $d$ premiers vecteurs forment une base de $\mathfrak g$ et les suivants une base de $\mathfrak m$. L'application $L(u) = \sum_i u_iE_i$ est un isomorphisme linéaire de $\mathbb R^N$ sur $\mathcal M_n(\mathbb R)$. Pour $u = (x, y) \in \mathbb R^d \times \mathbb R^{N-d}$, posons $X(u) = L(x, 0) \in \mathfrak g$, $Y(u) = L(0, y) \in \mathfrak m$ et
      $$\Psi(u) = e^{X(u)}e^{Y(u)}.$$

      *Un difféomorphisme local.* $\Psi$ est de classe $C^\infty$, comme composée d'applications linéaires, de l'exponentielle ({{li-exponentielle|Exponentielle}}) et du produit des matrices, qui est bilinéaire ({{gd-classe-ck|Classe Cᵏ}}, (ii) et (iii)). Comme $d\exp(0) = \mathrm{id}$ et que la différentielle du produit en $(I, I)$ est $(H, H') \mapsto H + H'$, on a $d\Psi(0)(v) = X(v) + Y(v) = L(v)$ ({{gd-differentielle|Différentielle}}, (iii) et (iv)) : $d\Psi(0) = L$ est inversible. Par inversion locale ({{gd-inversion-locale|Inversion locale}}), il existe un ouvert $V_0$ de $\mathbb R^N$ contenant $0$ et un ouvert $W_0$ contenant $I$ tels que $\Psi$ soit un $C^\infty$-difféomorphisme de $V_0$ sur $W_0$. Soit $r$ le réel fourni par le lemme {{li-petits|Pas de petits éléments}}, $V = \{u \in V_0 : |||Y(u)||| < r\}$, ouvert contenant $0$, et $W = \Psi(V)$, ouvert de $W_0$, donc de $\mathcal M_n(\mathbb R)$, puisque $\Psi$ est un homéomorphisme de $V_0$ sur $W_0$. On note $\Phi : W \to V$ la réciproque de $\Psi$.

      *Redressement en $I$.* Montrons que $\Psi\big(V \cap (\mathbb R^d \times \{0\})\big) = W \cap G$. Si $u = (x, 0) \in V$, alors $\Psi(u) = e^{X(u)}$ est dans $G$, puisque $X(u) \in \mathfrak g$. Réciproquement, soit $h \in W \cap G$ et $u = \Phi(h) \in V$. Comme $e^{X(u)} \in G$, $e^{Y(u)} = e^{-X(u)}h$ est dans $G$, avec $Y(u) \in \mathfrak m$ et $|||Y(u)||| < r$ : le lemme donne $Y(u) = 0$, donc $y = 0$, $L$ étant injective. Ainsi $\Phi(W \cap G) = \Phi(W) \cap (\mathbb R^d \times \{0\})$.

      *Redressement en tout point.* Soit $a \in G$, et $\lambda_a : M \mapsto aM$, isomorphisme linéaire de $\mathcal M_n(\mathbb R)$, de réciproque $\lambda_{a^{-1}}$. L'ouvert $U = \lambda_a(W)$ contient $a$, et $\Phi_a = \Phi \circ \lambda_{a^{-1}}$ est un $C^\infty$-difféomorphisme de $U$ sur $V$. Comme $G$ est un groupe, $h \in U \cap G$ équivaut à $a^{-1}h \in W \cap G$ : $U \cap G = \lambda_a(W \cap G)$, d'où $\Phi_a(U \cap G) = \Phi(W \cap G) = \Phi_a(U) \cap (\mathbb R^d \times \{0\})$. Donc $G$ est une sous-variété de dimension $d$ ({{gd-sous-varietes|Sous-variétés de ℝⁿ}}).

      *Groupe de Lie.* $G$ est une variété ({{gd-varietes|Variétés différentiables}}, (ii)). Par le même nœud, (iv), $G \times G$ est une sous-variété de $\mathcal M_n(\mathbb R)^2 \cong \mathbb R^{2N}$, dont la structure de variété est la structure produit. Le produit $(M, M') \mapsto MM'$ est polynomial sur $\mathcal M_n(\mathbb R)^2$, l'inversion est de classe $C^\infty$ sur l'ouvert $GL_n(\mathbb R)$, qui contient $G$ ({{gd-gl|Groupe linéaire}}, (iii)), et ils envoient $G \times G$, resp. $G$, dans $G$ : leurs restrictions sont lisses ({{gd-applications-lisses|Applications lisses}}, (iv)), et $G$ est un groupe de Lie ({{li-definition|Groupes de Lie}}).

      *Espace tangent.* Par le nœud {{gd-tangent-sm|Tangent à une sous-variété}}, $T_IG = d\Phi(I)^{-1}(\mathbb R^d \times \{0\})$. Comme $d\Phi(I) = d\Psi(0)^{-1} = L^{-1}$ (inversion locale), $T_IG = L(\mathbb R^d \times \{0\}) = \mathfrak g$.

      *L'exponentielle.* Soit $\Omega = \{x \in \mathbb R^d : (x, 0) \in V\}$, ouvert de $\mathbb R^d$. L'application $x \mapsto e^{L(x, 0)}$ est la restriction de $\Psi$ à $\Omega \times \{0\}$, bijection de $\Omega$ sur $W \cap G$ d'après le redressement en $I$ ; c'est la réciproque de la carte $p \circ \Phi$ de $G$, où $p$ est la projection sur les $d$ premières coordonnées ({{gd-varietes|Variétés différentiables}}, (ii)), et une carte est un difféomorphisme sur son image ({{gd-applications-lisses|Applications lisses}}, (iii)). Munissons $\mathfrak g$ de la structure de variété transportée de $\mathbb R^d$ par l'isomorphisme $x \mapsto L(x, 0)$ ; elle ne dépend pas de la base choisie, deux tels isomorphismes différant d'un automorphisme linéaire de $\mathbb R^d$. En transportant $\Omega$ par cet isomorphisme, l'exponentielle induit un difféomorphisme de l'ouvert $L(\Omega \times \{0\})$ de $\mathfrak g$, qui contient $0$, sur l'ouvert $W \cap G$ de $G$, qui contient $I$.
    remarques:
      - |
        L'hypothèse de fermeture est nécessaire. Dans le tore $SO(2) \times SO(2)$, le sous-groupe $\{(R_t, R_{\alpha t}) : t \in \mathbb R\}$, avec $\alpha$ irrationnel, est dense sans être fermé, et ce n'est pas une sous-variété ; ces deux faits sont admis ici (la densité découle de celle de $\mathbb Z + \alpha\mathbb Z$ dans $\mathbb R$, qui se démontre par le principe des tiroirs : parmi les parties fractionnaires de $\alpha, 2\alpha, \dots, (N + 1)\alpha$, deux sont à distance $< 1/N$).

        ```schema li-cartan
        Le tore est dessiné comme un carré dont on identifie les côtés opposés, le point $(R_t, R_{\alpha t})$ ayant pour coordonnées les angles $t$ et $\alpha t$ modulo $2\pi$. Pour $\alpha = 2/3$, la courbe se referme après trois tours et le sous-groupe est fermé ; pour $\alpha = \sqrt 2$, douze tours montrent déjà qu'elle remplit peu à peu le carré sans jamais repasser par son point de départ.
        ```

        C'est le phénomène de l'enroulement irrationnel, parent de la densité des multiples d'un irrationnel modulo $1$ ; la topologie induite par le tore sur ce sous-groupe n'est pas celle de $\mathbb R$.
      - |
        Le théorème redonne le point (iii) du nœud {{li-definition|Groupes de Lie}} sans calcul de différentielle : $O(n)$ est fermé, comme image réciproque de $\{I\}$ par l'application continue $A \mapsto {}^tAA$, donc c'est une sous-variété, de dimension celle de son algèbre de Lie, l'espace des matrices antisymétriques, soit $\frac{n(n-1)}2$ ({{li-algebre|Algèbre de Lie}}, (iii)). Le calcul de $\mathfrak g$ suffit désormais à connaître la dimension d'un groupe de matrices fermé.

