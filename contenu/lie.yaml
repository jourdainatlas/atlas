# Niveau 1 : structure interne du nœud « Groupes de Lie ».
# Groupes de Lie et exemples matriciels (GLₙ, O(n), SO(n)), exponentielle de matrices comme
# difféomorphisme local, sous-groupes à un paramètre, algèbre de Lie d'un sous-groupe fermé
# (formules de Trotter et du commutateur), théorème de Cartan-von Neumann (admis).
# Parents : groupes topologiques, équations différentielles (exponentielle de matrices),
# donc géométrie différentielle.

graphe: lie
titre: Groupes de Lie
conteneur: lie

entrees:
  grtop: [li-definition]
  edo: [li-exponentielle, li-un-parametre]

noeuds:
  - id: li-definition
    etiquette: Groupes de Lie
    nature: définition
    titre: Groupes de Lie et groupes de matrices
    texte: |
      Un [[groupe-lie|groupe de Lie]] est un groupe $G$ muni d'une structure de [[variete-differentiable|variété différentiable]] pour laquelle la multiplication $G \times G \to G$ et l'inversion $G \to G$ sont des [[application-lisse|applications lisses]], $G \times G$ étant muni de la structure produit.
    enonce: |
      (i) Un groupe de Lie est un [[groupe-topologique|groupe topologique]].

      (ii) $(\mathbb R^n, +)$ et $GL_n(\mathbb R)$, ouvert de $\mathcal M_n(\mathbb R) \cong \mathbb R^{n^2}$, sont des groupes de Lie.

      (iii) Le **groupe orthogonal** $O(n) = \{A : {}^tAA = I\}$ est une sous-variété de $\mathcal M_n(\mathbb R)$ de dimension $\frac{n(n-1)}2$, et un groupe de Lie ; il en va de même de $SO(n) = O(n) \cap \{\det = 1\}$, ouvert et fermé dans $O(n)$.
    preuve: |
      (i) Une application lisse est continue, et une variété est séparée.

      (ii) La multiplication des matrices est polynomiale en les coefficients, donc $C^\infty$ ; l'inversion est $C^\infty$ sur l'ouvert $GL_n(\mathbb R)$ ({{gd-gl|Groupe linéaire}}).

      (iii) Soit $\mathcal S$ l'espace des matrices symétriques, de dimension $\frac{n(n+1)}2$, et $F(A) = {}^tAA$, de $\mathcal M_n$ dans $\mathcal S$, polynomiale, de différentielle $dF(A)H = {}^tHA + {}^tAH$. Pour $A \in O(n)$ et $S \in \mathcal S$, $H = AS/2$ vérifie ${}^tHA = \frac12 S\,{}^tAA = \frac S2$ et ${}^tAH = \frac S2$, donc $dF(A)H = S$ : $dF(A)$ est surjective, et $O(n) = F^{-1}(I)$ est une sous-variété de dimension $n^2 - \frac{n(n+1)}2 = \frac{n(n-1)}2$ ({{gd-sous-varietes|Sous-variétés de ℝⁿ}}). La multiplication et l'inversion $A \mapsto {}^tA$ y sont des restrictions d'applications $C^\infty$ de l'espace ambiant, donc lisses ({{gd-applications-lisses|Applications lisses}}, (iv)). Enfin $\det A = \pm 1$ sur $O(n)$, et $SO(n)$ est l'image réciproque de l'ouvert $\{\det > 0\}$.
    remarques:
      - |
        $SO(2)$ est le cercle : ses éléments sont les matrices $\begin{pmatrix} a & -b \\ b & a \end{pmatrix}$ avec $a^2 + b^2 = 1$, et la multiplication y est celle des nombres complexes de module $1$. $SO(3)$ est le groupe des rotations de l'espace, de dimension $3$ : une rotation est déterminée par un axe, qui dépend de deux paramètres, et un angle.

  - id: li-exponentielle
    etiquette: Exponentielle
    nature: théorème
    titre: L'exponentielle, difféomorphisme local en 0
    enonce: |
      L'application $\exp : \mathcal M_n(\mathbb R) \to GL_n(\mathbb R)$, $A \mapsto e^A$, est de classe $C^1$, avec $d\exp(0) = \mathrm{id}$. Elle induit un $C^1$-difféomorphisme d'un voisinage ouvert $V$ de $0$ sur un voisinage ouvert $W$ de $I$ ; on note $\log : W \to V$ sa réciproque, qui vérifie $\log(I + X) = X + \|X\|\varepsilon(X)$ avec $\varepsilon(X) \to 0$.
    preuve: |
      Munissons $\mathcal M_n$ d'une norme subordonnée. En développant le produit non commutatif, $(A + H)^k - A^k - \sum_{j=0}^{k-1}A^jHA^{k-1-j}$ est une somme de produits contenant au moins deux facteurs $H$, de norme au plus $(a + h)^k - a^k - ka^{k-1}h$, où $a = |||A|||$ et $h = |||H|||$. En sommant avec les poids $1/k!$,
      $$\Big|\Big|\Big|e^{A+H} - e^A - \sum_k \frac1{k!}\sum_j A^jHA^{k-1-j}\Big|\Big|\Big| \leqslant e^{a+h} - e^a - he^a,$$
      qui est de la forme $h\,\varepsilon(h)$, par dérivabilité de l'exponentielle réelle. Donc $\exp$ est différentiable, de différentielle $H \mapsto \sum_k \frac1{k!}\sum_j A^jHA^{k-1-j}$, qui dépend continûment de $A$, la série convergeant uniformément sur les parties bornées ; en $A = 0$, elle vaut $H$. On applique le théorème d'inversion locale ({{gd-inversion-locale|Inversion locale}}) avec $k = 1$. Le développement de $\log$ exprime sa différentiabilité en $I$, de différentielle $d\exp(0)^{-1} = \mathrm{id}$.
    remarques:
      - |
        L'exponentielle n'est ni injective ni surjective en général. Les matrices $tJ$, avec $J = \begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}$, ont pour exponentielle la rotation d'angle $t$ ({{ed-lineaires|Systèmes linéaires}}), et $e^{2\pi J} = I = e^0$. La matrice $\begin{pmatrix} -1 & 1 \\ 0 & -1 \end{pmatrix}$, de déterminant $1$, n'est l'exponentielle d'aucune matrice réelle ; ce fait est admis ici.

  - id: li-un-parametre
    etiquette: Sous-groupes à un paramètre
    nature: théorème
    titre: Sous-groupes à un paramètre de GLₙ
    texte: |
      Un **sous-groupe à un paramètre** de $GL_n(\mathbb R)$ est un morphisme de groupes continu $\gamma : (\mathbb R, +) \to GL_n(\mathbb R)$.
    enonce: |
      Les sous-groupes à un paramètre sont exactement les applications $t \mapsto e^{tA}$, $A \in \mathcal M_n(\mathbb R)$, et $A = \gamma'(0)$.
    preuve: |
      $t \mapsto e^{tA}$ est un morphisme continu ({{ed-lineaires|Systèmes linéaires}}, (ii)). Réciproquement, soit $\gamma$ un morphisme continu. Les intégrales de fonctions matricielles se calculant coefficient par coefficient, $\frac1\varepsilon\int_0^\varepsilon \gamma(s)\,ds \to \gamma(0) = I$ quand $\varepsilon \to 0$ ; par la série de Neumann ({{gd-gl|Groupe linéaire}}), $P = \int_0^\varepsilon \gamma$ est inversible pour un $\varepsilon > 0$. Alors $\gamma(t)P = \int_0^\varepsilon \gamma(t + s)\,ds = \int_t^{t+\varepsilon}\gamma$, d'où $\gamma(t) = \big(\int_t^{t+\varepsilon}\gamma\big)P^{-1}$, dérivable par le théorème fondamental. En dérivant $\gamma(t + h) = \gamma(t)\gamma(h)$ en $h = 0$, $\gamma'(t) = \gamma(t)A$ avec $A = \gamma'(0)$ ; $\gamma$ et $t \mapsto e^{tA}$ sont deux solutions de $Y' = YA$ valant $I$ en $0$, égales par unicité ({{ed-cauchy-lipschitz|Cauchy-Lipschitz}}).
    remarques:
      - |
        L'hypothèse de continuité ne se réduit pas à une formalité : elle force la dérivabilité, à la manière de l'équation fonctionnelle $f(s + t) = f(s)f(t)$ pour une fonction réelle, dont les solutions continues sont les exponentielles. C'est le cinquième problème de Hilbert, résolu en 1952 par Gleason, Montgomery et Zippin, qui demandait jusqu'où va cette rigidité.

  - id: li-algebre
    etiquette: Algèbre de Lie
    nature: théorème
    titre: Algèbre de Lie d'un sous-groupe fermé
    texte: |
      Pour un sous-groupe fermé $G$ de $GL_n(\mathbb R)$, on pose $\mathfrak g = \{A \in \mathcal M_n(\mathbb R) : e^{tA} \in G \text{ pour tout } t \in \mathbb R\}$. Le **crochet** de deux matrices est $[A, B] = AB - BA$.
    enonce: |
      (i) *Trotter.* $\big(e^{A/k}e^{B/k}\big)^k \to e^{A+B}$ et $\big(e^{A/k}e^{B/k}e^{-A/k}e^{-B/k}\big)^{k^2} \to e^{[A,B]}$ quand $k \to \infty$.

      (ii) $\mathfrak g$ est un sous-espace vectoriel de $\mathcal M_n(\mathbb R)$, stable par crochet : c'est l'[[algebre-lie|algèbre de Lie]] de $G$.

      (iii) L'algèbre de Lie de $SL_n(\mathbb R) = \{\det = 1\}$ est l'espace des matrices de trace nulle ; celle de $O(n)$ est l'espace des matrices antisymétriques, de dimension $\frac{n(n-1)}2$.
    preuve: |
      (i) Pour une matrice $X$, $e^X = I + X + \frac{X^2}2 + R(X)$ avec $|||R(X)||| \leqslant |||X|||^3e^{|||X|||}$. En développant, $e^{A/k}e^{B/k} = I + \frac{A + B}k + O(k^{-2})$, et, pour le produit de quatre facteurs, les termes d'ordre $1$ se compensent ainsi que les carrés, et il reste $I + \frac{[A, B]}{k^2} + O(k^{-3})$. Pour $k$ grand, ces matrices sont dans le voisinage $W$ de $I$ ({{li-exponentielle|Exponentielle}}) ; posons $C_k = \log(e^{A/k}e^{B/k})$. Par le développement de $\log$, $kC_k = A + B + o(1)$, donc $\big(e^{A/k}e^{B/k}\big)^k = (e^{C_k})^k = e^{kC_k} \to e^{A+B}$ par continuité de $\exp$. De même, $k^2\log(\cdots) = [A, B] + o(1)$ pour le commutateur.

      (ii) La stabilité par multiplication par un réel est claire. Si $A, B \in \mathfrak g$, les produits $\big(e^{tA/k}e^{tB/k}\big)^k$ sont dans $G$, et leur limite $e^{t(A+B)}$ aussi, puisque $G$ est fermé. De même pour $[A, B]$, en remplaçant $A$ par $tA$ dans la formule du commutateur, qui donne $e^{t[A,B]}$.

      (iii) Par la formule de Liouville ({{ed-lineaires|Systèmes linéaires}}, (iii)), $\det e^{tA} = e^{t\operatorname{tr}A}$ vaut $1$ pour tout $t$ si et seulement si $\operatorname{tr}A = 0$. Si ${}^tA = -A$, alors ${}^t(e^{tA}) = e^{t\,{}^tA} = e^{-tA} = (e^{tA})^{-1}$ : $e^{tA} \in O(n)$. Réciproquement, en dérivant ${}^t(e^{tA})e^{tA} = I$ en $t = 0$, ${}^tA + A = 0$.
    remarques:
      - |
        La dimension de l'algèbre de Lie de $O(n)$, $\frac{n(n-1)}{2}$, est celle de la sous-variété $O(n)$ trouvée au nœud {{li-definition|Groupes de Lie}} : c'est un premier indice que $\mathfrak g$ est l'espace tangent à $G$ en $I$, ce qu'affirmera le théorème de Cartan.
      - |
        Pour $n = 3$, les matrices antisymétriques s'identifient aux vecteurs de $\mathbb R^3$, et le crochet au produit vectoriel. L'erreur la plus répandue est de croire le crochet associatif : il vérifie seulement l'identité de Jacobi $[A, [B, C]] + [B, [C, A]] + [C, [A, B]] = 0$, que l'on vérifie en développant.

  - id: li-cartan
    etiquette: Théorème de Cartan
    nature: théorème
    titre: Théorème de Cartan-von Neumann
    enonce: |
      Tout sous-groupe fermé $G$ de $GL_n(\mathbb R)$ est une sous-variété de $\mathcal M_n(\mathbb R)$, donc un groupe de Lie, dont l'espace tangent en $I$ est $\mathfrak g$. L'exponentielle induit un difféomorphisme d'un voisinage de $0$ dans $\mathfrak g$ sur un voisinage de $I$ dans $G$.
    preuve: |
      **Admis.** La difficulté contournée est de montrer qu'au voisinage de $I$, $G$ coïncide avec $\exp(\mathfrak g)$. On choisit un supplémentaire $\mathfrak m$ de $\mathfrak g$, et l'on montre que l'application $(X, Y) \mapsto e^Xe^Y$ de $\mathfrak g \times \mathfrak m$ est un difféomorphisme local, par inversion locale ({{li-exponentielle|Exponentielle}}). Il reste à voir que, si des $e^{Y_k} \in G$ avec $Y_k \in \mathfrak m \setminus \{0\}$ tendaient vers $I$, alors une valeur d'adhérence de $Y_k/|||Y_k|||$ serait dans $\mathfrak g \cap \mathfrak m = \{0\}$, ce qui est absurde ; c'est un argument de compacité de la sphère unité de $\mathfrak m$, combiné à la fermeture de $G$. Les translations à gauche transportent ensuite la structure en tout point.
    remarques:
      - |
        L'hypothèse de fermeture est nécessaire. Dans le tore $SO(2) \times SO(2)$, le sous-groupe $\{(R_t, R_{\alpha t}) : t \in \mathbb R\}$, avec $\alpha$ irrationnel, est dense sans être fermé ; ce n'est pas une sous-variété. C'est le phénomène de l'enroulement irrationnel, parent de la densité des multiples d'un irrationnel modulo $1$ ; la topologie induite par le tore sur ce sous-groupe n'est pas celle de $\mathbb R$.

