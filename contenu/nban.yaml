# Niveau 1 : structure interne du nœud « Théorie analytique des nombres ».
# Objectif : le théorème des nombres premiers, par la méthode de Newman (1980) dans la
# rédaction de Zagier (1997). On construit le logarithme réel et les puissances complexes,
# les outils d'intégration (sommation d'Abel, intégrales impropres), le lemme de Weierstrass
# sur les limites de fonctions holomorphes, la fonction ζ et son prolongement à Re s > 0, le
# produit eulérien, la majoration de Tchebychev θ(x) ≤ x ln 4, la fonction Φ, l'absence de
# zéro de ζ sur Re s = 1, le théorème taubérien de Newman, puis le théorème lui-même.
# La formule de Cauchy de l'atlas ne vaut que pour les disques ; le contour de Newman est
# traité en calculant ∫ dz/z sur ce contour au moyen d'une primitive de 1/z sur Re z < 0.

graphe: nban
titre: Théorie analytique des nombres
conteneur: nban

entrees:
  z: [nb-chebyshev, nb-euler]
  anc: [nb-logarithme, nb-weierstrass, nb-newman]

noeuds:
  - id: nb-logarithme
    etiquette: Logarithme, puissances
    nature: proposition
    titre: Logarithme réel et puissances complexes
    texte: |
      L'[[exponentielle]], restreinte à $\mathbb R$, est strictement croissante et à valeurs strictement positives ({{cx-exponentielle|Exponentielle}}). Sa réciproque est le [[logarithme]] $\ln$. Pour $x > 0$ et $s \in \mathbb C$, on pose $x^s = \exp(s \ln x)$.
    enonce: |
      (i) $\exp$ est une bijection de $\mathbb R$ sur $]0, +\infty[$ ; $\ln$ est continue, dérivable, $\ln' (x) = 1/x$, $\ln 1 = 0$ et $\ln(xy) = \ln x + \ln y$.

      (ii) Pour tout réel $y$, $\exp y \geqslant 1 + y$, avec égalité seulement en $0$. Par suite $\ln x \leqslant x - 1$ et, pour $x \geqslant 1$ et $\varepsilon > 0$, $\ln x \leqslant x^\varepsilon/\varepsilon$ ; en particulier $\ln x / x^\varepsilon \to 0$ quand $x \to +\infty$.

      (iii) $x^{s+t} = x^s x^t$, $(xy)^s = x^s y^s$, $|x^s| = x^{\operatorname{Re} s}$, $\overline{x^s} = x^{\bar s}$, et $x^s$ coïncide avec la puissance usuelle si $s$ est entier. La fonction $x \mapsto x^s$ est dérivable sur $]0, +\infty[$, de dérivée $s\,x^{s-1}$, et $s \mapsto x^s$ est holomorphe sur $\mathbb C$, de dérivée $\ln x \cdot x^s$.
    preuve: |
      (ii) Pour $y \geqslant 0$, tous les termes de la série sont positifs. Pour $-1 < y < 0$, on groupe les termes de rang $\geqslant 2$ par paires : $\frac{y^{2k}}{(2k)!} + \frac{y^{2k+1}}{(2k+1)!} = \frac{y^{2k}}{(2k)!}\big(1 + \frac{y}{2k+1}\big) > 0$. Pour $y \leqslant -1$, $\exp y > 0 \geqslant 1 + y$. L'inégalité $\ln x \leqslant x - 1$ s'obtient avec $y = \ln x$, puis $\ln x = \frac1\varepsilon \ln x^\varepsilon \leqslant \frac1\varepsilon x^\varepsilon$. Enfin $\ln x / x^\varepsilon \leqslant \frac{2}{\varepsilon} x^{-\varepsilon/2}$.

      (i) $\exp$ est continue, strictement croissante, $\exp y \geqslant 1 + y$ n'est pas majorée et $\exp(-y) = 1/\exp y$ tend vers $0$ : par le théorème des valeurs intermédiaires, l'image est $]0, +\infty[$, et la réciproque est continue ({{c-bijection|Bijection continue}}). Pour $x \neq x_0$, avec $u = \ln x$ et $v = \ln x_0$, $\frac{\ln x - \ln x_0}{x - x_0} = \frac{u - v}{\exp u - \exp v}$, qui tend vers $1/\exp v = 1/x_0$ quand $x \to x_0$, puisque $u \to v$ par continuité. L'égalité $\exp(\ln x + \ln y) = xy$ donne la dernière formule.

      (iii) Les trois premières formules découlent de $\exp(a + b) = \exp a \exp b$, de (i) et de $|\exp(a + ib)| = \exp a$ ; la conjugaison commute avec $\exp$. Si $s = m$ est entier, $\exp(m \ln x) = \exp(\ln x)^m = x^m$. Les dérivées viennent de la règle de dérivation d'une composée ({{cx-holomorphe|Fonctions holomorphes}}).
    remarques:
      - |
        Le logarithme complexe n'est pas défini ici : il ne peut l'être continûment sur $\mathbb C \setminus \{0\}$, puisque le tour du cercle augmente l'argument de $2\pi$. On n'en aura besoin que sur le demi-plan $\operatorname{Re} z < 0$, sous la forme d'une primitive de $1/z$, au nœud {{nb-newman|Théorème de Newman}}.

  - id: nb-sommation
    etiquette: Sommation d'Abel
    nature: proposition
    titre: Sommation d'Abel et intégrales impropres
    texte: |
      Une fonction $h : [a, b] \to \mathbb C$ est **continue par morceaux** s'il existe une [[subdivision]] telle que, sur chaque intervalle ouvert, $h$ se prolonge en une fonction continue sur l'intervalle fermé. Ses parties réelle et imaginaire sont intégrables au sens de Riemann. Pour $h$ continue par morceaux sur tout segment de $[a, +\infty[$, l'intégrale $\int_a^{+\infty} h$ **converge** si $\int_a^T h$ a une limite quand $T \to +\infty$.
    enonce: |
      (i) Pour $h$ continue par morceaux, $\big|\int_a^b h\big| \leqslant \int_a^b |h|$. Si $|h| \leqslant g$ sur $[a, +\infty[$ et si $\int_a^{+\infty} g$ converge, alors $\int_a^{+\infty} h$ converge, et $\int_a^{+\infty} h$ converge si et seulement si $\int_x^{y} h \to 0$ quand $x, y \to +\infty$.

      (ii) *Changement de variable.* Si $\varphi : [\alpha, \beta] \to [a, b]$ est de classe $C^1$ et croissante, et $h$ continue par morceaux, $\int_{\varphi(\alpha)}^{\varphi(\beta)} h = \int_\alpha^\beta h(\varphi(u))\varphi'(u)\,du$.

      (iii) *Sommation d'Abel.* Soit $(a_n)_{n \geqslant 1}$ une suite complexe, $A(x) = \sum_{1 \leqslant n \leqslant x} a_n$, et $\varphi$ de classe $C^1$ sur $[1, x]$. Alors
      $$\sum_{1 \leqslant n \leqslant x} a_n \varphi(n) = A(x)\varphi(x) - \int_1^x A(t)\varphi'(t)\,dt.$$
      (iv) *Comparaison série-intégrale.* Si $\varphi$ est positive et décroissante sur $[1, +\infty[$, $\sum_{n=2}^N \varphi(n) \leqslant \int_1^N \varphi \leqslant \sum_{n=1}^{N-1} \varphi(n)$.
    preuve: |
      (i) Pour $h$ continue, c'est le nœud {{cx-integrale-chemin|Intégrale curviligne}}, (i) ; pour $h$ continue par morceaux, on applique ce résultat sur chaque morceau, les valeurs aux points de la subdivision ne modifiant pas les intégrales. Le critère de Cauchy découle de la complétude de $\mathbb C$ ({{cx-suites|Suites et séries complexes}}), appliquée aux suites $\int_a^{T_n} h$ ; la comparaison s'en déduit, puisque $\big|\int_x^y h\big| \leqslant \int_x^y g$.

      (ii) Sur un morceau où $h$ est continue, les deux membres, vus comme fonctions de $\beta$, ont la même dérivée $h(\varphi(\beta))\varphi'(\beta)$ par le théorème fondamental ({{ar-tfa|Théorème fondamental}}) et la dérivation d'une composée, et sont nuls en $\alpha$. On recolle les morceaux par la relation de Chasles.

      (iii) Soit $N = \lfloor x \rfloor$. La fonction $A$ est constante, égale à $A(n)$, sur chaque $[n, n + 1[$, donc
      $$\begin{aligned} \int_1^x A\varphi' = &\sum_{n=1}^{N-1} A(n)\big(\varphi(n + 1) - \varphi(n)\big) \\ &+ A(N)\big(\varphi(x) - \varphi(N)\big), \end{aligned}$$
      par {{cx-convergence-uniforme|Convergence uniforme}}, (iv). En regroupant les termes en $\varphi(n)$, le coefficient de $\varphi(n)$ est $A(n - 1) - A(n) = -a_n$ pour $2 \leqslant n \leqslant N$, celui de $\varphi(1)$ est $-A(1) = -a_1$, et il reste $A(N)\varphi(x) = A(x)\varphi(x)$.

      (iv) Sur $[n, n + 1]$, $\varphi(n + 1) \leqslant \varphi \leqslant \varphi(n)$ ; on intègre et l'on somme.
    remarques:
      - |
        La sommation d'Abel est l'analogue discret de l'intégration par parties : elle transforme une somme pondérée en une intégrale de la fonction sommatoire $A$. C'est ainsi que l'on passe des nombres premiers, comptés par une fonction en escalier, aux fonctions analytiques.

  - id: nb-weierstrass
    etiquette: Limites holomorphes
    nature: théorème
    titre: Limites et intégrales de fonctions holomorphes
    enonce: |
      (i) *Weierstrass.* Soit $U$ un ouvert et $(f_n)$ des fonctions holomorphes sur $U$ qui convergent uniformément sur tout disque fermé contenu dans $U$. La limite $f$ est holomorphe, et $f_n'(z) \to f'(z)$ pour tout $z \in U$.

      (ii) *Intégrales à paramètre.* Si $h : [a, b] \to \mathbb C$ est continue par morceaux et $\lambda : [a, b] \to \mathbb R$ continue, la fonction $F(z) = \int_a^b h(t) \exp\big(z\lambda(t)\big)\,dt$ est holomorphe sur $\mathbb C$.
    preuve: |
      (i) Soit $\overline D(c, r) \subset U$. Pour $|z - c| < r$, la formule de Cauchy ({{cx-formule-cauchy|Formule de Cauchy}}) donne $f_n(z) = \frac1{2i\pi}\int_{C(c, r)} \frac{f_n(w)}{w - z}\,dw$. Comme $f_n \to f$ uniformément sur le cercle, on passe à la limite ({{cx-convergence-uniforme|Convergence uniforme}}, (iii)) : $f(z) = \frac1{2i\pi}\int_{C(c, r)} \frac{f(w)}{w - z}\,dw$, où $f$ est continue comme limite uniforme. La démonstration du nœud {{cx-analytique|Analyticité}} n'utilise que cette représentation et la continuité de $f$ sur le cercle : $f$ est développable en série entière sur $D(c, r)$, donc holomorphe. Enfin, par le même nœud appliqué en $c$, $f_n'(c) = \frac1{2i\pi}\int_{C(c, r)} \frac{f_n(w)}{(w - c)^2}\,dw$, qui tend vers l'intégrale analogue pour $f$, c'est-à-dire $f'(c)$.

      (ii) Soit $B = \sup |h|$ et $\Lambda = \sup |\lambda|$. Pour $|z| \leqslant \rho$, la série $\sum_m h(t)\frac{(z\lambda(t))^m}{m!}$ converge uniformément en $t$, son terme étant majoré par $B\frac{(\rho\Lambda)^m}{m!}$. En intégrant terme à terme, $F(z) = \sum_m c_m z^m$ avec $c_m = \frac1{m!}\int_a^b h\lambda^m$, et $|c_m| \leqslant 2(b - a)B\frac{\Lambda^m}{m!}$ : c'est une série entière de rayon infini, donc une fonction holomorphe ({{cx-derivation-series|Dérivation terme à terme}}).
    remarques:
      - |
        Rien de tel n'est vrai pour les fonctions d'une variable réelle : une limite uniforme de fonctions dérivables n'est pas dérivable en général, comme le montre $\sqrt{x^2 + 1/n} \to |x|$. La rigidité des fonctions holomorphes, exprimée par la formule de Cauchy, est ce qui permet de construire $\zeta$ comme limite de sommes finies.

  - id: nb-zeta
    etiquette: Fonction ζ
    nature: théorème
    titre: La fonction zêta de Riemann et son prolongement
    texte: |
      Pour $\operatorname{Re} s > 1$, la [[fonction-zeta|fonction zêta]] est $\zeta(s) = \sum_{n \geqslant 1} n^{-s}$. On note $\sigma = \operatorname{Re} s$.
    enonce: |
      (i) La série converge uniformément sur chaque demi-plan $\operatorname{Re} s \geqslant \sigma_0 > 1$ ; $\zeta$ est holomorphe sur $\operatorname{Re} s > 1$, et $\zeta'(s) = -\sum_n \ln n \cdot n^{-s}$.

      (ii) La fonction $Z(s) = (s - 1)\zeta(s)$ se prolonge en une fonction holomorphe sur $\operatorname{Re} s > 0$, qui vaut $1$ en $s = 1$ et vérifie $Z(\bar s) = \overline{Z(s)}$.
    preuve: |
      (i) $|n^{-s}| = n^{-\sigma} \leqslant n^{-\sigma_0}$, et $\sum_{n \geqslant 2} n^{-\sigma_0} \leqslant \int_1^{+\infty} x^{-\sigma_0}\,dx = \frac{1}{\sigma_0 - 1}$ ({{nb-sommation|Sommation d'Abel}}, (iv)). Chaque terme est holomorphe ({{nb-logarithme|Logarithme, puissances}}, (iii)) ; le critère de Weierstrass et le nœud {{nb-weierstrass|Limites holomorphes}} concluent, y compris pour la dérivée.

      (ii) Pour $\operatorname{Re} s > 1$, $\int_1^N x^{-s}\,dx = \frac{1 - N^{1-s}}{s - 1}$ tend vers $\frac1{s - 1}$, puisque $|N^{1-s}| = N^{1-\sigma}$. Donc
      $$\zeta(s) - \frac1{s - 1} = \sum_{n \geqslant 1} \varphi_n(s),$$
      $$\varphi_n(s) = \int_n^{n+1} \big(n^{-s} - x^{-s}\big)\,dx.$$
      Chaque $\varphi_n$ est holomorphe sur $\mathbb C$ par {{nb-weierstrass|Limites holomorphes}}, (ii), avec $\lambda(x) = -\ln x$. Pour $x \in [n, n + 1]$ et $\sigma > 0$, $n^{-s} - x^{-s} = s\int_n^x u^{-s-1}\,du$ est de module au plus $|s|\,n^{-\sigma-1}$, d'où $|\varphi_n(s)| \leqslant |s|\,n^{-\sigma-1}$. La série $\sum \varphi_n$ converge donc uniformément sur tout disque fermé contenu dans $\operatorname{Re} s > 0$, vers une fonction holomorphe $\zeta_0$. On pose $Z(s) = 1 + (s - 1)\zeta_0(s)$, qui prolonge $(s - 1)\zeta(s)$ et vaut $1$ en $1$. Enfin $\varphi_n(\bar s) = \overline{\varphi_n(s)}$, puisque $x^{\bar s} = \overline{x^s}$.
    remarques:
      - |
        Le prolongement montre que $\zeta$ a un **pôle simple** de résidu $1$ en $s = 1$ : $\zeta(s) \approx \frac{1}{s - 1}$ près de $1$. C'est l'expression analytique de la divergence de la série harmonique, et, par le produit eulérien, de l'infinité des nombres premiers.
      - |
        Riemann a prolongé $\zeta$ à tout le plan complexe privé de $1$ (1859) et conjecturé que ses zéros non triviaux sont tous sur la droite $\operatorname{Re} s = \frac12$. Cette **hypothèse de Riemann** reste ouverte ; elle équivaut à une estimation très précise de l'erreur dans le théorème des nombres premiers.

  - id: nb-euler
    etiquette: Produit eulérien
    nature: théorème
    titre: Produit eulérien et non-annulation de ζ sur Re s > 1
    texte: |
      Pour $N \geqslant 2$ et $\operatorname{Re} s > 0$, on pose $P_N(s) = \prod_{p \leqslant N} (1 - p^{-s})^{-1}$, produit fini sur les [[nombre-premier|nombres premiers]] $p \leqslant N$.
    enonce: |
      (i) *Euler.* Pour $\operatorname{Re} s = \sigma > 1$, $|\zeta(s) - P_N(s)| \leqslant 2\sum_{n > N} n^{-\sigma}$ : le [[produit-euler|produit eulérien]] converge vers $\zeta$, uniformément sur $\operatorname{Re} s \geqslant \sigma_0 > 1$.

      (ii) $|\zeta(s)| \geqslant 1/\zeta(\sigma) > 0$ pour $\operatorname{Re} s > 1$.

      (iii) Pour $\operatorname{Re} s > 1$, $-\dfrac{\zeta'(s)}{\zeta(s)} = \sum_p \dfrac{\ln p}{p^s - 1}$.

      (iv) La série $\sum_p 1/p$ diverge ; en particulier, il y a une infinité de nombres premiers.
    preuve: |
      (i) Comme $|p^{-s}| < 1$, $(1 - p^{-s})^{-1} = \sum_{k \geqslant 0} p^{-ks}$ ({{cx-suites|Suites et séries complexes}}, (iii)). Pour $K$ fixé, en développant le produit fini $\prod_{p \leqslant N} \sum_{k \leqslant K} p^{-ks}$, et puisque $(p^k q^l)^{-s} = p^{-ks}q^{-ls}$, on obtient $\sum_{n \in S} n^{-s}$, où $S$ est l'ensemble des entiers dont les facteurs premiers sont $\leqslant N$ et d'exposants $\leqslant K$ : l'unicité de la décomposition en facteurs premiers ({{z-premiers|Nombres premiers}}) garantit que chaque $n$ apparaît une fois. Pour $K$ assez grand, $S$ contient $\{1, \dots, N\}$, et $\big|\sum_{n \in S} n^{-s} - \sum_{n \leqslant N} n^{-s}\big| \leqslant \sum_{n > N} n^{-\sigma}$. En faisant tendre $K$ vers l'infini, $|P_N(s) - \sum_{n \leqslant N} n^{-s}| \leqslant \sum_{n > N} n^{-\sigma}$, et l'on ajoute le reste de la série $\zeta$.

      (ii) $|1 - p^{-s}| \leqslant 1 + p^{-\sigma} \leqslant (1 - p^{-\sigma})^{-1}$, donc $|P_N(s)|^{-1} \leqslant P_N(\sigma)$. Par le calcul de (i) à termes positifs, $P_N(\sigma) \leqslant \zeta(\sigma)$. Donc $|P_N(s)| \geqslant 1/\zeta(\sigma)$, et l'inégalité passe à la limite.

      (iii) La dérivée logarithmique d'un produit fini est la somme des dérivées logarithmiques ; celle de $(1 - p^{-s})^{-1}$ est $-\frac{\ln p \cdot p^{-s}}{1 - p^{-s}} = -\frac{\ln p}{p^s - 1}$. Par (i) et le lemme de Weierstrass ({{nb-weierstrass|Limites holomorphes}}), $P_N \to \zeta$ et $P_N' \to \zeta'$, avec $\zeta \neq 0$ par (ii) ; donc $P_N'/P_N \to \zeta'/\zeta$.

      (iv) Pour $s = 1$, le calcul de (i), à termes positifs, donne $P_N(1) \geqslant \sum_{n \leqslant N} \frac1n \geqslant \int_1^{N+1} \frac{dx}{x} = \ln(N + 1)$. D'autre part, pour $0 \leqslant x \leqslant \frac12$, $-\ln(1 - x) = \int_0^x \frac{dt}{1 - t} \leqslant 2x$. Donc $\ln P_N(1) \leqslant 2\sum_{p \leqslant N} \frac1p$, qui tend vers l'infini.
    remarques:
      - |
        Le produit eulérien est la traduction analytique de la décomposition en facteurs premiers : développer $\prod_p (1 + p^{-s} + p^{-2s} + \cdots)$, c'est énumérer une fois chaque entier par sa factorisation. Euler l'a découvert en 1737, pour $s$ réel ; la divergence de $\sum 1/p$ est son corollaire, et donne une preuve analytique de l'infinité des nombres premiers ({{z-premiers|Nombres premiers}}, (iii)).

  - id: nb-chebyshev
    etiquette: Majoration de Tchebychev
    nature: proposition
    titre: La majoration θ(x) ≤ x ln 4
    texte: |
      La [[fonction-tchebychev|fonction de Tchebychev]] est $\theta(x) = \sum_{p \leqslant x} \ln p$, et la [[fonction-compte-premiers|fonction de compte]] des nombres premiers est $\pi(x) = \sum_{p \leqslant x} 1$. Les coefficients binomiaux sont définis par $\binom m0 = \binom mm = 1$ et $\binom{m+1}{k} = \binom mk + \binom m{k-1}$ pour $1 \leqslant k \leqslant m$.
    enonce: |
      (i) $\binom mk$ est un entier, $k!\,(m - k)!\binom mk = m!$, et $\sum_{k=0}^m \binom mk = 2^m$.

      (ii) $\prod_{n + 1 < p \leqslant 2n + 1} p$ divise $\binom{2n+1}{n}$, qui est au plus $4^n$.

      (iii) $\theta(x) \leqslant x \ln 4$ pour tout $x \geqslant 1$.
    preuve: |
      (i) Les trois assertions se démontrent par récurrence sur $m$ à partir de la relation de Pascal ; pour la deuxième, $k!(m + 1 - k)!\big(\binom mk + \binom m{k-1}\big) = (m + 1 - k)\,m! + k\,m! = (m + 1)!$.

      (ii) Par (i), $\binom{2n+1}n = \binom{2n+1}{n+1}$, et ces deux termes figurent dans la somme $2^{2n+1}$ ; donc $2\binom{2n+1}n \leqslant 2^{2n+1}$. Un nombre premier $p$ tel que $n + 1 < p \leqslant 2n + 1$ divise $(2n + 1)! = \binom{2n+1}n\, n!\,(n + 1)!$, mais ne divise aucun facteur de $n!\,(n + 1)!$, tous inférieurs à $p$ ; par le lemme d'Euclide ({{z-premiers|Nombres premiers}}), il divise $\binom{2n+1}n$. Des nombres premiers distincts divisant un entier, leur produit le divise.

      (iii) Montrons $\theta(m) \leqslant m \ln 4$ pour tout entier $m \geqslant 1$, par récurrence forte. C'est vrai pour $m = 1$ et $m = 2$. Si $m > 2$ est pair, il n'est pas premier, et $\theta(m) = \theta(m - 1) \leqslant (m - 1)\ln 4$. Si $m = 2n + 1$ avec $n \geqslant 1$, par (ii),
      $$\begin{aligned} \theta(2n + 1) &= \theta(n + 1) + \sum_{n + 1 < p \leqslant 2n + 1} \ln p \\ &\leqslant (n + 1)\ln 4 + n\ln 4 = m\ln 4. \end{aligned}$$
      Pour $x$ réel, $\theta(x) = \theta(\lfloor x \rfloor) \leqslant \lfloor x \rfloor \ln 4 \leqslant x \ln 4$.
    remarques:
      - |
        L'inégalité est grossière mais suffisante : on calcule $\theta(10^6)/10^6 \approx 0{,}998$, alors que $\ln 4 \approx 1{,}386$. Le rapport $\theta(m)/(m \ln 4)$ ne dépasse pas $0{,}72$ pour $m \leqslant 3000$. Le théorème des nombres premiers affirmera que $\theta(x)/x$ tend vers $1$.
      - |
        La démonstration, due à Erdős (1932), n'utilise que la divisibilité. Tchebychev avait obtenu en 1852 un encadrement de $\theta(x)/x$ entre deux constantes proches de $1$ par une étude plus fine des coefficients binomiaux, sans pouvoir conclure à l'existence d'une limite.

  - id: nb-phi
    etiquette: Fonction Φ
    nature: proposition
    titre: La fonction Φ et la dérivée logarithmique de ζ
    texte: |
      Pour $\operatorname{Re} s > 1$, on pose $\Phi(s) = \sum_p \ln p \cdot p^{-s}$, et pour $\operatorname{Re} s > \frac12$, $\psi(s) = \sum_p \dfrac{\ln p}{p^s(p^s - 1)}$.
    enonce: |
      (i) $\Phi$ est holomorphe sur $\operatorname{Re} s > 1$, et $\psi$ sur $\operatorname{Re} s > \frac12$.

      (ii) Pour $\operatorname{Re} s > 1$,
      $$\Phi(s) - \frac{1}{s - 1} = -\frac{Z'(s)}{Z(s)} - \psi(s).$$
      (iii) Pour $\operatorname{Re} s > 1$, $\displaystyle \Phi(s) = s\int_1^{+\infty} \theta(x)\, x^{-s-1}\,dx$, l'intégrale convergeant.
    preuve: |
      (i) Par {{nb-logarithme|Logarithme, puissances}}, (ii), $\ln p \leqslant p^\varepsilon/\varepsilon$. Sur $\operatorname{Re} s \geqslant \sigma_0 > 1$, avec $\varepsilon = (\sigma_0 - 1)/2$, $|\ln p \cdot p^{-s}| \leqslant \frac1\varepsilon p^{-1-\varepsilon}$, terme d'une série convergente. Sur $\operatorname{Re} s \geqslant \sigma_0 > \frac12$, $|p^s - 1| \geqslant p^{\sigma_0} - 1 \geqslant c\,p^{\sigma_0}$ avec $c = 1 - 2^{-1/2}$, donc le terme de $\psi$ est majoré par $\frac{1}{c\varepsilon} p^{\varepsilon - 2\sigma_0}$, sommable pour $\varepsilon = \sigma_0 - \frac12$. Le lemme de Weierstrass ({{nb-weierstrass|Limites holomorphes}}) conclut.

      (ii) $\frac{\ln p}{p^s - 1} - \frac{\ln p}{p^s} = \frac{\ln p}{p^s(p^s - 1)}$ : par le produit eulérien ({{nb-euler|Produit eulérien}}, (iii)), $\Phi = -\zeta'/\zeta - \psi$. Et $\zeta(s) = Z(s)/(s - 1)$ donne $\zeta'/\zeta = Z'/Z - \frac1{s - 1}$.

      (iii) Appliquons la sommation d'Abel ({{nb-sommation|Sommation d'Abel}}, (iii)) avec $a_n = \ln n$ si $n$ est premier, $0$ sinon, de sorte que $A = \theta$, et $\varphi(t) = t^{-s}$ :
      $$\sum_{p \leqslant x} \ln p \cdot p^{-s} = \theta(x)\,x^{-s} + s\int_1^x \theta(t)\,t^{-s-1}\,dt.$$
      Par la majoration de Tchebychev ({{nb-chebyshev|Majoration de Tchebychev}}), $|\theta(x)x^{-s}| \leqslant \ln 4 \cdot x^{1-\sigma} \to 0$, et $|\theta(t)t^{-s-1}| \leqslant \ln 4 \cdot t^{-\sigma}$, dont l'intégrale converge : on fait tendre $x$ vers l'infini.
    remarques:
      - |
        L'égalité (ii) est le cœur de la méthode : elle relie une somme sur les nombres premiers, $\Phi$, aux zéros de $\zeta$, qui sont les pôles de $Z'/Z$. Le terme $\frac1{s - 1}$ vient du pôle de $\zeta$ en $1$, et c'est lui qui produira le terme principal $x$ dans $\theta(x) \sim x$.

  - id: nb-zeros
    etiquette: ζ sur Re s = 1
    nature: théorème
    titre: ζ ne s'annule pas sur la droite Re s = 1
    enonce: |
      (i) $Z(s) \neq 0$ pour $\operatorname{Re} s \geqslant 1$ ; autrement dit, $\zeta(1 + i\alpha) \neq 0$ pour tout réel $\alpha \neq 0$.

      (ii) La fonction $\Phi(s) - \frac1{s - 1}$ se prolonge en une fonction holomorphe sur un ouvert contenant le demi-plan fermé $\operatorname{Re} s \geqslant 1$.
    preuve: |
      (i) Pour $\operatorname{Re} s > 1$, $\zeta(s) \neq 0$ ({{nb-euler|Produit eulérien}}), et $Z(1) = 1$. Soit $\alpha \neq 0$ et supposons $Z(1 + i\alpha) = 0$.

      *Ordres.* $Z$ n'est pas identiquement nulle sur l'ouvert connexe $\operatorname{Re} s > 0$, puisque $Z(2) \neq 0$. En un point $s_0$, son développement en série entière ({{cx-analytique|Analyticité}}) a donc un coefficient non nul, sans quoi $Z$ serait nulle sur un disque, et partout par le principe des zéros isolés ({{cx-zeros-isoles|Zéros isolés}}). Soit $k \geqslant 0$ l'indice du premier coefficient non nul, l'**ordre** de $s_0$ : $Z(s) = (s - s_0)^k h(s)$ avec $h$ holomorphe près de $s_0$ et $h(s_0) \neq 0$. Alors $\frac{Z'}{Z}(s) = \frac{k}{s - s_0} + \frac{h'}{h}(s)$, et, pour $\varepsilon > 0$ tendant vers $0$, $\varepsilon\frac{Z'}{Z}(s_0 + \varepsilon) \to k$. Notons $\mu \geqslant 1$ l'ordre de $1 + i\alpha$ et $\nu \geqslant 0$ celui de $1 + 2i\alpha$ ; par la symétrie $Z(\bar s) = \overline{Z(s)}$, les points $1 - i\alpha$ et $1 - 2i\alpha$ ont les mêmes ordres, et $1$ est d'ordre $0$.

      *Limites.* Pour $r \in \{-2, \dots, 2\}$ et $s_r = 1 + \varepsilon + ir\alpha$, la formule {{nb-phi|Fonction Φ}}, (ii), donne $\varepsilon\Phi(s_r) = -\varepsilon\frac{Z'}{Z}(s_r) + \frac{\varepsilon}{\varepsilon + ir\alpha} - \varepsilon\psi(s_r)$, qui tend vers $1$ pour $r = 0$, vers $-\mu$ pour $r = \pm 1$, et vers $-\nu$ pour $r = \pm 2$.

      *Positivité.* Pour $p$ premier, posons $w = p^{i\alpha/2}$, de module $1$, de sorte que $\bar w = w^{-1}$ et $w^{-2r} = p^{-ir\alpha}$. En développant $(w + w^{-1})^4 = w^4 + 4w^2 + 6 + 4w^{-2} + w^{-4}$,
      $$\sum_{r=-2}^{2} \binom{4}{2 + r}\Phi(s_r) = \sum_p \frac{\ln p}{p^{1+\varepsilon}}\,(w + \bar w)^4 \geqslant 0,$$
      puisque $w + \bar w = 2\operatorname{Re} w$ est réel. En multipliant par $\varepsilon$ et en faisant tendre $\varepsilon$ vers $0$, on obtient $6 - 8\mu - 2\nu \geqslant 0$, ce qui est impossible pour $\mu \geqslant 1$.

      (ii) L'ensemble $W = \{s : \operatorname{Re} s > \frac12,\ Z(s) \neq 0\}$ est ouvert, par continuité de $Z$, et contient $\operatorname{Re} s \geqslant 1$ par (i). Sur $W$, $-Z'/Z - \psi$ est holomorphe, et coïncide avec $\Phi(s) - \frac1{s - 1}$ sur $\operatorname{Re} s > 1$.
    remarques:
      - |
        L'argument est une version, due à Mertens, de l'inégalité $3 + 4\cos\theta + \cos 2\theta \geqslant 0$ employée par Hadamard et La Vallée Poussin en 1896 ; on l'a écrite avec les coefficients $1, 4, 6, 4, 1$ de $(w + \bar w)^4$, ce qui évite les fonctions trigonométriques. Un zéro sur la droite $\operatorname{Re} s = 1$ rendrait $\Phi$ trop négative en $1 + i\alpha$, alors que le pôle en $1$ ne peut la compenser.

  - id: nb-newman
    etiquette: Théorème de Newman
    nature: théorème
    titre: Le théorème taubérien de Newman
    enonce: |
      Soit $f : [0, +\infty[ \to \mathbb R$ bornée, $|f| \leqslant B$, et continue par morceaux sur tout segment. Pour $\operatorname{Re} z > 0$, l'intégrale $g(z) = \int_0^{+\infty} f(t)e^{-zt}\,dt$ converge. Si $g$ se prolonge en une fonction holomorphe sur un ouvert contenant le demi-plan fermé $\operatorname{Re} z \geqslant 0$, alors $\int_0^{+\infty} f(t)\,dt$ converge et vaut $g(0)$.
    preuve: |
      *Préliminaires.* Pour $z = x + iy$, $|e^{-zt}| = e^{-xt}$. Pour $x > 0$, $|f(t)e^{-zt}| \leqslant Be^{-xt}$, d'intégrale convergente, d'où la convergence de $g(z)$ ({{nb-sommation|Sommation d'Abel}}, (i)), et $|g(z) - g_T(z)| \leqslant B e^{-xT}/x$, où $g_T(z) = \int_0^T f(t)e^{-zt}\,dt$. La fonction $g_T$ est holomorphe sur $\mathbb C$ ({{nb-weierstrass|Limites holomorphes}}, (ii)), et pour $x < 0$, $|g_T(z)| \leqslant \int_0^T Be^{-xt}\,dt \leqslant Be^{-xT}/|x|$.

      *Le contour.* Fixons $R > 0$. Soit $W$ l'ouvert sur lequel $g$ est holomorphe. La distance d'un point au complémentaire de $W$ (prise égale à $1$ si $W = \mathbb C$) est une fonction continue et strictement positive sur le compact $\{iy : |y| \leqslant R + 1\}$ : elle y a un minimum $m > 0$. Sur l'ouvert convexe $U = \{|z| < R + 1,\ \operatorname{Re} z > -m\}$, $g$ est holomorphe. Soit $\delta = \frac12\min(m, R)$, et $\theta_1$ le plus petit réel de $[\frac\pi2, \pi]$ tel que $\cos\theta_1 = -\delta/R$, qui existe par les valeurs intermédiaires puisque $\cos\frac\pi2 = 0$, $\cos\pi = -1$ et $0 < \delta/R < 1$ ; il appartient à $]\frac\pi2, \pi[$. Le contour $C$ parcourt l'arc $\theta \mapsto Re^{i\theta}$, $\theta \in [-\theta_1, \theta_1]$, puis le segment vertical de $Re^{i\theta_1}$ à $Re^{-i\theta_1}$, situé sur la droite $\operatorname{Re} z = -\delta$. On a $\cos > 0$ sur $[0, \frac\pi2[$, et $\cos(\pi - \theta) = -\cos\theta$ puisque $e^{i\pi} = -1$ ; donc $\cos < 0$ sur $]\frac\pi2, \pi]$, et, par le choix de $\theta_1$, $C$ est contenu dans $U$.

      *Indice.* Montrons $\int_C \frac{dz}{z} = 2i\pi$. Sur l'arc, $\frac{dz}{z} = i\,d\theta$, d'où la contribution $2i\theta_1$. Sur le demi-plan convexe $\operatorname{Re} z < 0$, $1/z$ a une primitive holomorphe $L$ ({{cx-cauchy-convexe|Cauchy, ouverts convexes}}), que l'on normalise par $L(-1) = i\pi$. La dérivée de $z e^{-L(z)}$ est nulle, donc $e^{L(z)} = z$. Pour $\theta \in \,]\frac\pi2, \frac{3\pi}2[$, $L(Re^{i\theta}) - \ln R - i\theta$ est continue, à valeurs dans $2i\pi\mathbb Z$ ({{cx-pi|Le nombre π}}, (ii)), nulle en $\theta = \pi$ par le même argument sur la demi-droite des réels négatifs ; elle est donc nulle. Le segment, contenu dans $\operatorname{Re} z < 0$, contribue $L(Re^{i(2\pi - \theta_1)}) - L(Re^{i\theta_1}) = i(2\pi - 2\theta_1)$. Au total, $2i\pi$.

      *Formule de Cauchy.* Posons $F(z) = \big(g(z) - g_T(z)\big)e^{zT}\big(1 + \frac{z^2}{R^2}\big)$, holomorphe sur $U$. La fonction $\frac{F(z) - F(0)}{z}$, prolongée par $F'(0)$, est continue sur $U$ et holomorphe hors de $0$ : son intégrale sur $C$ est nulle ({{cx-cauchy-convexe|Cauchy, ouverts convexes}}). Donc
      $$g(0) - g_T(0) = F(0) = \frac{1}{2i\pi}\int_C F(z)\,\frac{dz}{z}.$$
      Pour $|z| = R$, $\frac1z = \frac{\bar z}{R^2}$, d'où $\big|\frac1z + \frac{z}{R^2}\big| = \frac{2|x|}{R^2}$.

      *Arc droit* $C_+$, où $x \geqslant 0$ : l'intégrande est majoré par $\frac{Be^{-xT}}{x}\,e^{xT}\frac{2x}{R^2} = \frac{2B}{R^2}$, et la longueur est $\pi R$ ; la contribution est au plus $B/R$.

      *Partie gauche* $C_-$, où $x < 0$. Pour le terme en $g_T$, entier, on remplace $C_-$ par le demi-cercle gauche $C'_- = \{Re^{i\theta} : \frac\pi2 \leqslant \theta \leqslant \frac{3\pi}2\}$ : le chemin fermé formé du segment et de l'arc $\theta \in [\theta_1, 2\pi - \theta_1]$ est contenu dans le demi-plan convexe $\operatorname{Re} z < 0$, où l'intégrande est holomorphe, et son intégrale est nulle. Sur $C'_-$, l'intégrande est majoré par $\frac{Be^{-xT}}{|x|}e^{xT}\frac{2|x|}{R^2} = \frac{2B}{R^2}$ : contribution au plus $B/R$. Pour le terme en $g$, l'intégrande est $g(z)\big(\frac1z + \frac{z}{R^2}\big)e^{zT}$, majoré par $M e^{xT}$, avec $M$ indépendant de $T$. Pour $\tau > 0$, découpons $C_-$ en deux petits arcs voisins de $\pm iR$, de paramètres $\theta \in [\frac\pi2, \frac\pi2 + \tau]$ et son symétrique, de longueur totale $2R\tau$, et le reste, sur lequel $x \leqslant -\kappa < 0$ par continuité et compacité. La contribution est au plus $2MR\tau + M\,L(C)\,e^{-\kappa T}$, qui est inférieure à $3MR\tau$ pour $T$ grand.

      *Conclusion.* $\limsup_{T \to +\infty} |g(0) - g_T(0)| \leqslant \frac{2B}{R} + 3MR\tau$ pour tout $\tau$, donc $\leqslant 2B/R$, et $R$ est arbitraire : $g_T(0) = \int_0^T f \to g(0)$.
    remarques:
      - |
        Le théorème est **taubérien** : il remonte d'une information sur la transformée $g$ à une information sur $f$. La réciproque directe, qui passe de la convergence de $\int_0^\infty f$ à la continuité de $g$ en $0$, est facile ; c'est le sens inverse qui demande l'analyse complexe, et l'hypothèse que $g$ est régulière **sur toute la droite** $\operatorname{Re} z = 0$, et pas seulement en $0$.
      - |
        Newman a publié cette démonstration en 1980, et Zagier l'a réduite à quelques pages en 1997. Elle remplace les estimations délicates de Hadamard et de La Vallée Poussin sur la croissance de $\zeta$ par une simple formule de Cauchy, au prix d'une conclusion moins précise : aucune estimation de l'erreur.

  - id: nb-tnp
    etiquette: Théorème des nombres premiers
    nature: théorème
    titre: Le théorème des nombres premiers
    enonce: |
      (i) L'intégrale $\displaystyle \int_1^{+\infty} \frac{\theta(x) - x}{x^2}\,dx$ converge.

      (ii) $\theta(x) \sim x$, c'est-à-dire $\theta(x)/x \to 1$ quand $x \to +\infty$.

      (iii) $\pi(x) \sim \dfrac{x}{\ln x}$.
    preuve: |
      (i) Soit $f(t) = \theta(e^t)e^{-t} - 1$, bornée par $1 + \ln 4$ ({{nb-chebyshev|Majoration de Tchebychev}}) et continue par morceaux, ses sauts étant aux $\ln p$. Pour $\operatorname{Re} z > 0$, le changement de variable $x = e^t$ ({{nb-sommation|Sommation d'Abel}}, (ii)) et {{nb-phi|Fonction Φ}}, (iii), donnent
      $$\begin{aligned} \int_0^{+\infty} f(t)e^{-zt}\,dt &= \frac{\Phi(z + 1)}{z + 1} - \frac1z \\ &= \frac{\Phi(z + 1) - \frac1z}{z + 1} - \frac{1}{z + 1}. \end{aligned}$$
      Par {{nb-zeros|ζ sur Re s = 1}}, (ii), le dernier membre est holomorphe sur un ouvert contenant $\operatorname{Re} z \geqslant 0$. Le théorème de Newman ({{nb-newman|Théorème de Newman}}) montre que $\int_0^{+\infty} f$ converge ; le changement de variable inverse donne (i).

      (ii) Soit $\lambda > 1$, et supposons $\theta(x) \geqslant \lambda x$ pour des $x$ arbitrairement grands. Comme $\theta$ est croissante, pour un tel $x$, par le changement de variable $t = xu$,
      $$\begin{aligned} \int_x^{\lambda x} \frac{\theta(t) - t}{t^2}\,dt &\geqslant \int_x^{\lambda x} \frac{\lambda x - t}{t^2}\,dt \\ &= \int_1^\lambda \frac{\lambda - u}{u^2}\,du = \lambda - 1 - \ln\lambda, \end{aligned}$$
      constante strictement positive ({{nb-logarithme|Logarithme, puissances}}, (ii)), ce qui contredit le critère de Cauchy pour l'intégrale (i). De même, si $\lambda < 1$ et $\theta(x) \leqslant \lambda x$ pour des $x$ arbitrairement grands, $\int_{\lambda x}^x \frac{\theta(t) - t}{t^2}\,dt \leqslant \int_\lambda^1 \frac{\lambda - u}{u^2}\,du = 1 - \lambda + \ln\lambda < 0$. Donc $\theta(x)/x \to 1$.

      (iii) D'une part $\theta(x) \leqslant \pi(x)\ln x$. D'autre part, pour $0 < \varepsilon < 1$, en ne gardant que les $p > x^{1-\varepsilon}$, $\theta(x) \geqslant (1 - \varepsilon)\ln x\,\big(\pi(x) - x^{1-\varepsilon}\big)$, d'où
      $$\frac{\pi(x)\ln x}{x} \leqslant \frac{1}{1 - \varepsilon}\,\frac{\theta(x)}{x} + \frac{\ln x}{x^\varepsilon}.$$
      Par (ii) et {{nb-logarithme|Logarithme, puissances}}, (ii), le rapport $\pi(x)\ln x / x$ a une limite inférieure $\geqslant 1$ et une limite supérieure $\leqslant \frac1{1 - \varepsilon}$ pour tout $\varepsilon$ : il tend vers $1$.
    remarques:
      - |
        Le théorème, conjecturé par Gauss et Legendre vers 1800 au vu des tables, a été démontré en 1896 par Hadamard et par La Vallée Poussin, indépendamment. Les valeurs numériques montrent la lenteur de la convergence : $\pi(10^6) = 78\,498$, et $\pi(x)\ln x/x$ vaut environ $1{,}161$ pour $x = 10^3$ et $1{,}084$ pour $x = 10^6$, alors que $\theta(10^6)/10^6 \approx 0{,}998$ est déjà très proche de $1$.
      - |
        L'erreur la plus répandue est de croire que l'équivalent $\pi(x) \sim x/\ln x$ donne une bonne approximation. Le logarithme intégral $\int_2^x \frac{dt}{\ln t}$ est bien meilleur ; l'écart entre $\pi(x)$ et lui est de l'ordre de $\sqrt x \ln x$ si et seulement si l'hypothèse de Riemann est vraie ({{nb-zeta|Fonction ζ}}).

