# Niveau 1 : structure interne du nœud « Géométrie algébrique ».
# Deux volets : le spectre d'un anneau commutatif et sa topologie de Zariski, puis les ensembles
# algébriques de K^n et le Nullstellensatz, qui relie les deux ; sa forme faible repose sur le lemme de
# Zariski, démontré par l'algèbre linéaire (28 oct. 2026). Les anneaux sont commutatifs.
# Les énoncés qui demandent un idéal maximal ou premier reposent sur le lemme de Zorn et sont marqués ⋆ pour
# un anneau quelconque ; pour un anneau de polynômes en un nombre fini d'indéterminées sur un corps et ses
# quotients, ga-krull-polynomes
# (30 oct. 2026) fournit l'idéal maximal sans choix, si bien que le Nullstellensatz, faible et fort, et le
# dictionnaire sont démontrés dans ZF.

graphe: geoalg
titre: Géométrie algébrique
conteneur: geoalg

entrees:
  alg: [ga-spectre]
  top: [ga-zariski]
  z: [ga-zeros, ga-lemme-zariski, ga-krull-polynomes]
  ordin: [ga-krull]
  alglin: [ga-lemme-zariski, ga-krull-polynomes]
  ac: [ga-zeros]

noeuds:
  - id: ga-spectre
    etiquette: Spectre
    nature: définition
    titre: Spectre premier d'un anneau
    enonce: |
      Le [[spectre-premier|spectre premier]] d'un anneau commutatif $A$ est l'ensemble $\lex{spectre-premier}{\operatorname{Spec}} A$ de ses [[ideal-premier|idéaux premiers]]. Pour une partie $S \subset A$ et un élément $f \in A$, on pose
      $$\lex{partie-v-spectre}{V}(S) = \{\mathfrak p \in \operatorname{Spec} A : S \subset \mathfrak p\},$$
      $$D(f) = \{\mathfrak p \in \operatorname{Spec} A : f \notin \mathfrak p\}.$$
    remarques:
      - |
        L'idée est de voir un élément $f \in A$ comme une « fonction » sur $\operatorname{Spec} A$, dont la valeur en $\mathfrak p$ est la classe de $f$ dans l'anneau intègre $A/\mathfrak p$ ({{a-premier-maximal|Idéaux premiers, maximaux}}). Alors $V(S)$ est le lieu où s'annulent les éléments de $S$, et $D(f)$ celui où $f$ ne s'annule pas.
      - |
        Pour $A = \lex{ensemble-entiers-relatifs}{\mathbb Z}$, les idéaux premiers sont $(0)$ et les $p\mathbb Z$, $p$ premier ({{z-zn|ℤ/nℤ}}) : le spectre a un point par nombre premier, plus un point $(0)$ qui ne correspond à aucun d'eux.

        ```schema ga-spectre
        Chaque nombre premier $p$ donne un point $p\mathbb Z$ de $\operatorname{Spec}\mathbb Z$ ; le point $(0)$, dessiné à l'écart, n'est associé à aucun nombre premier.
        ```

  - id: ga-zariski
    etiquette: Topologie de Zariski
    nature: proposition
    titre: La topologie de Zariski
    enonce: |
      (i) $\lex{partie-v-spectre}{V}(S) = V(I)$, où $I$ est l'idéal engendré par $S$ ; $V(0) = \lex{spectre-premier}{\operatorname{Spec}} A$ et $V(1) = \varnothing$.

      (ii) Pour toute famille d'idéaux, $\bigcap_i V(I_i) = V\big(\bigcup_i I_i\big)$ ; pour deux idéaux, $V(I) \cup V(J) = V(IJ)$, où $IJ$ est l'idéal engendré par les produits $ab$, $a \in I$, $b \in J$.

      (iii) Les parties $V(S)$ sont donc les fermés d'une topologie sur $\operatorname{Spec} A$, la [[topologie-zariski|topologie de Zariski]], dont les $D(f)$ forment une base, avec $D(f) \cap D(g) = D(fg)$.
    preuve: |
      (i) Un idéal contient $S$ si et seulement s'il contient l'idéal engendré par $S$ ({{a-ideal|Idéal}}). Tout idéal premier contient $0$, et aucun ne contient $1$.

      (ii) La première égalité est immédiate. Pour la seconde, $IJ \subset I$ et $IJ \subset J$ donnent $V(I) \cup V(J) \subset V(IJ)$. Réciproquement, soit $\mathfrak p \supset IJ$ et supposons $I \not\subset \mathfrak p$, avec $a \in I \setminus \mathfrak p$. Pour tout $b \in J$, $ab \in \mathfrak p$, donc $b \in \mathfrak p$ puisque $\mathfrak p$ est premier : $J \subset \mathfrak p$.

      (iii) Par (i) et (ii), les $V(S)$ contiennent $\varnothing$ et $\operatorname{Spec} A$, et sont stables par intersection quelconque et réunion finie : leurs complémentaires vérifient les axiomes d'une topologie ({{t-espace|Espace topologique}}).

      Le complémentaire de $V(S)$ est $\bigcup_{f \in S} D(f)$ : les $D(f)$ forment une base. Enfin $fg \notin \mathfrak p$ équivaut, pour $\mathfrak p$ premier, à $f \notin \mathfrak p$ et $g \notin \mathfrak p$.

  - id: ga-points
    etiquette: Points fermés
    nature: proposition
    titre: Adhérence d'un point, points fermés
    choix: |
      Pour un anneau quelconque, le sens « point fermé ⇒ idéal maximal » de (ii) utilise le théorème de Krull, donc le lemme de Zorn, et il ne se démontre pas dans $\mathsf{ZF}$ seul. W. Hodges a construit un modèle de $\mathsf{ZF}$ où un anneau principal $A$ n'a aucun idéal maximal (« Läuchli's algebraic closure of Q », *Math. Proc. Cambridge Philos. Soc.* 79, 1976, p. 289-297, corollaire 10) ; ses idéaux premiers non nuls seraient maximaux ({{ac-principaux|Principal ⇒ factoriel}}, (i)), donc $\operatorname{Spec} A = \{(0)\}$, et $(0)$ y est un point fermé sans être maximal, $A$ n'étant pas un corps. Pour un quotient $A$ d'un anneau de polynômes en un nombre fini d'indéterminées sur un corps, ce sens n'utilise aucun choix, comme on le verra : l'idéal $J$ de la preuve est contenu dans un idéal maximal de $A$ par {{ga-krull-polynomes|Krull sans choix}}, (ii), qui remplace le théorème de Krull ; le cas de $K[X_1, \dots, X_n]$ lui-même est traité au nœud {{ga-correspondance|Dictionnaire}}.
    enonce: |
      (i) L'adhérence de $\{\mathfrak p\}$ dans $\lex{spectre-premier}{\operatorname{Spec}} A$ est $\lex{partie-v-spectre}{V}(\mathfrak p)$.

      (ii) Le point $\mathfrak p$ est fermé si et seulement si $\mathfrak p$ est un [[ideal-maximal|idéal maximal]].

      (iii) Deux points distincts ne sont pas tous deux dans l'adhérence l'un de l'autre : l'un des deux a un voisinage qui ne contient pas l'autre.
    preuve: |
      (i) Un fermé $V(S)$ contient $\mathfrak p$ si et seulement si $S \subset \mathfrak p$, et alors $V(\mathfrak p) \subset V(S)$. Le plus petit fermé contenant $\mathfrak p$ est donc $V(\mathfrak p)$ ({{t-adherence|Intérieur, adhérence}}).

      (ii) $\{\mathfrak p\}$ est fermé si et seulement si $V(\mathfrak p) = \{\mathfrak p\}$, c'est-à-dire si aucun idéal premier ne contient strictement $\mathfrak p$. Si $\mathfrak p$ est maximal, c'est le cas. Réciproquement, si $\mathfrak p$ n'est pas maximal, il est strictement contenu dans un idéal $J \neq A$, lui-même contenu dans un idéal maximal par le théorème de Krull, qui est premier : ce sens utilise donc le lemme de Zorn ({{ga-krull|Théorème de Krull}}).

      (iii) Si $\mathfrak p \neq \mathfrak q$, l'un ne contient pas l'autre, disons $\mathfrak p \mathrel{\not\subset} \mathfrak q$. Alors $\mathfrak q \notin V(\mathfrak p)$, l'adhérence de $\mathfrak p$.
    remarques:
      - |
        L'erreur la plus répandue est de transposer l'intuition des espaces séparés. $\operatorname{Spec} A$ ne l'est presque jamais : si $A$ est intègre, le point $(0)$ a pour adhérence $V(0)$, l'espace tout entier. Il appartient à tout ouvert non vide, et on l'appelle le **point générique**.

        ```schema ga-points
        L'ouvert $D(6)$ de $\operatorname{Spec}\mathbb Z$ est formé des idéaux premiers qui ne contiennent pas $6$ : il exclut $2\mathbb Z$ et $3\mathbb Z$, barrés, et contient tous les autres $p\mathbb Z$, ainsi que le point générique $(0)$.
        ```

  - id: ga-krull
    etiquette: Théorème de Krull
    nature: théorème
    titre: Existence d'idéaux maximaux
    choix: |
      La démonstration utilise le lemme de Zorn. Réciproquement, Hodges a montré en 1979 que l'énoncé « tout anneau commutatif non nul a un idéal maximal » entraîne l'axiome du choix ; cette réciproque est admise ici.
    enonce: |
      Dans un anneau commutatif $A$, tout idéal $I \neq A$ est contenu dans un idéal maximal. En particulier, si $A \neq \{0\}$, alors $A$ possède un idéal maximal, donc un idéal premier ({{a-premier-maximal|Idéaux premiers, maximaux}}), et tout élément non inversible appartient à un idéal maximal.
    preuve: |
      L'ensemble $\mathcal E$ des idéaux $J \neq A$ contenant $I$, ordonné par inclusion, contient $I$. Il est [[inductif-ordre|inductif]] : la réunion d'une chaîne non vide d'idéaux est un idéal, puisque deux éléments de la réunion appartiennent à un même membre de la chaîne, et elle ne contient pas $1$, puisqu'aucun membre ne le contient ({{a-ideal|Idéal}}) ; la chaîne vide est majorée par $I$.

      Le [[lemme-zorn|lemme de Zorn]] ({{o-zorn|Lemme de Zorn}}) fournit un élément maximal de $\mathcal E$, qui est un idéal maximal. Si $A \neq \{0\}$, on l'applique à $I = \{0\}$ ; si $x$ n'est pas inversible, on l'applique à $xA$, qui est différent de $A$.
    remarques:
      - |
        Le choix ne sert ici qu'à traiter un anneau quelconque. Pour un anneau de polynômes $K[X_1, \dots, X_n]$ sur un corps et pour ses quotients, qui sont les anneaux du Nullstellensatz, le nœud {{ga-krull-polynomes|Krull sans choix}} construit un idéal maximal sans aucune forme du choix.

        Le caractère noethérien de ces anneaux ({{ac-hilbert|Base de Hilbert}}) ne suffit pas à lui seul. Un anneau principal est noethérien ({{ac-noetheriens|Anneaux noethériens}}, (iii)), et pourtant W. Hodges a construit un modèle de $\mathsf{ZF}$ où un anneau principal n'a aucun idéal maximal (« Läuchli's algebraic closure of Q », *Math. Proc. Cambridge Philos. Soc.* 79, 1976, p. 289-297, corollaire 10) : pour les anneaux noethériens, $\mathsf{ZF}$ seul ne suffit pas, alors que le choix dépendant suffit, par la condition maximale de {{ac-noetheriens|Anneaux noethériens}}, (ii).

  - id: ga-krull-polynomes
    etiquette: Krull sans choix
    nature: théorème
    titre: Idéaux maximaux d'un anneau de polynômes sur un corps
    texte: |
      Soit $K$ un [[corps]]. Pour $n \geqslant 1$, on écrit $\lex{anneau-polynomes}{K[X_1, \dots, X_n]} = K[X'][X_n]$, avec $K[X'] = K[X_1, \dots, X_{n-1}]$ ({{pol-evaluation|Évaluation}}, (iii)) ; le **degré en $X_n$** d'un polynôme est son degré comme polynôme en $X_n$ à coefficients dans $K[X']$. Pour $n = 0$, l'anneau $K[X_1, \dots, X_0]$ est $K$.
    enonce: |
      (i) Pour tout $n \in \lex{ensemble-entiers-naturels}{\mathbb N}$, tout idéal $J \neq K[X_1, \dots, X_n]$ est contenu dans un [[ideal-maximal|idéal maximal]].

      (ii) Soit $I$ un idéal de $K[X_1, \dots, X_n]$ et $\pi$ la surjection canonique sur $A = K[X_1, \dots, X_n]/I$. Pour tout idéal maximal $\mathfrak M \supset I$, $\pi(\mathfrak M)$ est un idéal maximal de $A$, et $\pi^{-1}(\pi(\mathfrak M)) = \mathfrak M$. Par suite, tout idéal $J \neq A$ de $A$ est contenu dans un idéal maximal de $A$.
    preuve: |
      (i) Par récurrence sur $n$. Pour $n = 0$, le seul idéal de $K$ différent de $K$ est $\{0\}$ ({{a-corps|Corps}}, (ii)), et il est maximal. Soit $n \geqslant 1$ et $J \neq K[X_1, \dots, X_n]$, que l'on note $K[X]$.

      *Un élément de $J$ unitaire en $X_n$ à une constante près.* Si $J = \{0\}$, on le remplace par l'idéal $X_nK[X]$, qui le contient et ne contient pas $1$, puisque ses éléments $X_nQ$ ont un coefficient nul en degré $0$ en $X_n$. On peut donc prendre $f \in J$ non nul.

      En développant les coefficients de $f$ en $X_n$, puis ceux-ci, par récurrence, on écrit $f = \sum_{e \in E} c_e X_1^{e_1} \cdots X_n^{e_n}$, où $E \subset \mathbb N^n$ est fini et non vide et les $c_e \in K$ sont non nuls. Soit $r$ un entier strictement supérieur à tous les $e_i$, et
      $$w(e) = e_n + e_1r + e_2r^2 + \cdots + e_{n-1}r^{n-1}.$$

      Deux éléments distincts de $E$ ont des poids distincts. En effet, $w(e)$ s'écrit en base $r$ avec les chiffres $e_n, e_1, \dots, e_{n-1}$, tous strictement inférieurs à $r$. Si $r^k$ est la plus haute puissance dont les chiffres diffèrent, l'écart sur ce chiffre contribue au moins $r^k$ à la différence des poids, et les écarts sur les chiffres inférieurs au plus $(r - 1)(1 + r + \cdots + r^{k-1}) = r^k - 1$.

      Soit $\varphi$ le morphisme d'anneaux de $K[X]$ dans lui-même qui fixe $K$, envoie $X_i$ sur $X_i + X_n^{r^i}$ pour $i < n$, et $X_n$ sur $X_n$ ({{pol-evaluation|Évaluation}}, (iii)), et $\psi$ celui qui envoie $X_i$ sur $X_i - X_n^{r^i}$. Les composées $\psi \circ \varphi$ et $\varphi \circ \psi$ fixent $K$ et chaque $X_i$, donc sont l'identité par unicité : $\varphi$ est un automorphisme.

      Comme polynôme en $X_n$ à coefficients dans $K[X']$, $X_i + X_n^{r^i}$ est unitaire de degré $r^i$. L'image $\varphi(X_1^{e_1} \cdots X_n^{e_n})$ est donc un produit de polynômes unitaires, unitaire de degré $w(e)$ ({{pol-anneau|Anneau A[X]}}, (ii)). Si $e^*$ est l'élément de $E$ de plus grand poids $N = w(e^*)$, on obtient
      $$\varphi(f) = c\,X_n^N + \sum_{k < N} g_k X_n^k,$$
      avec $c = c_{e^*} \neq 0$ et $g_k \in K[X']$.

      L'idéal $\varphi(J)$ est différent de $K[X]$ et contient $\varphi(f)$. S'il est contenu dans un idéal maximal $\mathfrak M$, alors $J \subset \varphi^{-1}(\mathfrak M)$, idéal maximal, puisque $\varphi$ induit un isomorphisme de $K[X]/\varphi^{-1}(\mathfrak M)$ sur le corps $K[X]/\mathfrak M$ ({{a-anneau-quotient|Anneau quotient}}, {{a-premier-maximal|Idéaux premiers, maximaux}}, (ii)). On peut donc supposer que $J$ contient un polynôme $f = cX_n^N + \sum_{k<N} g_kX_n^k$, avec $c \in K^\times$.

      *Une variable de moins.* L'ensemble $J' = J \cap K[X']$ est un idéal de $K[X']$ qui ne contient pas $1$ ; par hypothèse de récurrence, il est contenu dans un idéal maximal $\mathfrak m'$ de $K[X']$. Soit $Q$ l'idéal de $K[X]$ engendré par $J$ et $\mathfrak m'$, formé des sommes $j + \sum_i a_ih_i$ avec $j \in J$, $a_i \in \mathfrak m'$ et $h_i \in K[X]$.

      Le quotient $M = K[X]/J$ est un $K[X']$-[[module|module]] ({{a-module|Module}}). La division euclidienne par $c^{-1}f$, unitaire en $X_n$ ({{pol-division|Division des polynômes}}, (i)), écrit tout $P \in K[X]$ comme un multiple de $f$ plus un polynôme de degré en $X_n$ inférieur à $N$ : $M$ est engendré par les classes $u_k$ de $X_n^k$, $0 \leqslant k < N$.

      *L'idéal $Q$ ne contient pas $1$.* Montrons d'abord, par récurrence sur $m$, le fait suivant, pour un anneau $R$, un idéal $\mathfrak a$ de $R$ et un $R$-module $V = Rv_1 + \cdots + Rv_m$ : si tout élément de $V$ s'écrit $\sum_j b_jy_j$ avec $b_j \in \mathfrak a$ et $y_j \in V$, il existe $a \in \mathfrak a$ tel que $(1 - a)V = \{0\}$. Pour $m = 0$, $V = \{0\}$ et $a = 0$ convient.

      Pour $m \geqslant 1$, le module quotient $V/Rv_m$ est engendré par $m - 1$ éléments et vérifie la même hypothèse : il existe $b \in \mathfrak a$ tel que $(1 - b)V \subset Rv_m$. En développant sur les $v_l$, on écrit $v_m = \sum_l a_lv_l$ avec des $a_l \in \mathfrak a$, d'où $(1 - b)v_m = \sum_l a_l(1 - b)v_l = c'v_m$ avec $c' \in \mathfrak a$, puisque chaque $(1 - b)v_l$ est dans $Rv_m$.

      Ainsi $(1 - b - c')v_m = 0$, puis $(1 - b - c')(1 - b)V \subset (1 - b - c')Rv_m = \{0\}$, et $(1 - b - c')(1 - b)$ s'écrit $1 - a$ avec $a \in \mathfrak a$.

      Si l'on avait $1 \in Q$, tout $P \in K[X]$ s'écrirait $j + \sum_i a_ih_i$, et la classe de $P$ dans $M$ serait $\sum_i a_i\bar h_i$, avec $a_i \in \mathfrak m'$. Le fait précédent, pour $R = K[X']$, $\mathfrak a = \mathfrak m'$, $V = M$ et les générateurs $u_0, \dots, u_{N-1}$, donnerait $a \in \mathfrak m'$ avec $(1 - a)\bar 1 = 0$, c'est-à-dire $1 - a \in J \cap K[X'] = J' \subset \mathfrak m'$, puis $1 \in \mathfrak m'$, ce qui est exclu.

      *Un idéal maximal contenant $Q$.* L'anneau $B = K[X]/Q$ n'est pas nul, et l'action de $a \in K[X']$ par multiplication n'y dépend que de la classe de $a$ modulo $\mathfrak m'$, puisque $\mathfrak m' \subset Q$ : $B$ est un espace vectoriel sur le corps $F = K[X']/\mathfrak m'$ ({{a-premier-maximal|Idéaux premiers, maximaux}}, (ii)), engendré par les classes de $1, X_n, \dots, X_n^{N-1}$, donc de dimension finie sur $F$, au plus $N$ ({{v-dimension|Dimension}}, (ii)), et ses idéaux en sont des sous-espaces.

      Les dimensions sur $F$ des idéaux de $B$ différents de $B$ forment une partie de $\{0, \dots, N - 1\}$ ({{v-dimension|Dimension}}, (iii)), non vide puisqu'elle contient celle de $\{0\}$. Soit $\mathfrak n$ un tel idéal de dimension maximale. Un idéal $\mathfrak n' \neq B$ qui contiendrait strictement $\mathfrak n$ serait de dimension strictement plus grande ({{v-dimension|Dimension}}, (iii)) : $\mathfrak n$ est un idéal maximal de $B$.

      L'image réciproque $\mathfrak M$ de $\mathfrak n$ dans $K[X]$ est le noyau de la surjection composée $K[X] \to B \to B/\mathfrak n$, à valeurs dans un corps : $\mathfrak M$ est un idéal maximal ({{a-anneau-quotient|Anneau quotient}}, {{a-premier-maximal|Idéaux premiers, maximaux}}, (ii)), et il contient $Q \supset J$.

      (ii) Comme $\pi$ est surjective, $\pi(\mathfrak M)$ est un idéal de $A$ : $\pi(m)\pi(x) = \pi(mx)$. Un élément $x$ tel que $\pi(x) \in \pi(\mathfrak M)$ s'écrit $m + i$ avec $m \in \mathfrak M$ et $i \in I \subset \mathfrak M$ : $\pi^{-1}(\pi(\mathfrak M)) = \mathfrak M$, et $\pi(\mathfrak M) \neq A$ puisque $1 \notin \mathfrak M$.

      Si $\mathfrak N \neq A$ est un idéal qui contient $\pi(\mathfrak M)$, son image réciproque est un idéal qui contient $\mathfrak M$ et ne contient pas $1$ ; elle vaut $\mathfrak M$, et $\mathfrak N = \pi(\pi^{-1}(\mathfrak N)) = \pi(\mathfrak M)$ : $\pi(\mathfrak M)$ est maximal.

      Enfin, si $J \neq A$, l'idéal $\pi^{-1}(J)$ contient $I$ et ne contient pas $1$ ; par (i), il est contenu dans un idéal maximal $\mathfrak M$, et $J = \pi(\pi^{-1}(J)) \subset \pi(\mathfrak M)$.
    remarques:
      - |
        La démonstration n'utilise aucune forme de l'axiome du choix. Elle ne choisit qu'un nombre fini d'objets, dont l'existence est établie : un polynôme non nul $f$, un idéal maximal de $K[X']$, un idéal de dimension maximale parmi des sous-espaces d'un espace de dimension finie. La récurrence porte sur l'énoncé « pour tout idéal $J \neq K[X_1, \dots, X_n]$, il existe un idéal maximal $\mathfrak M \supset J$ », et l'hypothèse de récurrence n'est appliquée qu'à l'idéal $J'$ ; on ne choisit jamais une infinité d'objets à la fois, ce que fait la preuve générale de {{ga-krull|Krull}} en invoquant le lemme de Zorn.
      - |
        Le changement de variables $X_i \mapsto X_i + X_n^{r^i}$ est attribué à Nagata. Il fait de $K[X]/J$ un module engendré par un nombre fini d'éléments sur $K[X']$, et c'est ce qui permet de remonter un idéal maximal de $K[X']$.

        Pour $J = (X_1X_2 - 1)$ dans $K[X_1, X_2]$, on a $r = 2$ et $\varphi(X_1X_2 - 1) = X_2^3 + X_1X_2 - 1$, unitaire en $X_2$. Sans changement de variables, la remontée peut échouer : l'idéal maximal $(X_1)$ de $K[X_1]$ contient $J \cap K[X_1] = \{0\}$, mais $J + (X_1)$ contient $1 = X_1X_2 - (X_1X_2 - 1)$.

        E. Arrondo donne une autre démonstration sans choix, elle aussi par récurrence sur le nombre d'indéterminées, mais par d'autres moyens (ordre lexicographique, résultant, facteur irréductible en une variable) et sans argument de dimension : « The Nullstellensatz without the Axiom of Choice » (arXiv:2009.02837, 2020).

  - id: ga-quasi-compact
    etiquette: Quasi-compacité
    nature: théorème
    titre: Le spectre est quasi-compact
    choix: |
      La démonstration utilise le théorème de Krull, donc le lemme de Zorn. Pour un quotient $A$ d'un anneau de polynômes en un nombre fini d'indéterminées sur un corps, elle n'utilise aucun choix, comme on le verra : l'idéal maximal qui contiendrait $J$ est alors fourni par {{ga-krull-polynomes|Krull sans choix}}, (ii), qui remplace le théorème de Krull.
    enonce: |
      Un espace topologique est [[quasi-compact|quasi-compact]] si de tout recouvrement par des ouverts on peut extraire un recouvrement fini. Pour tout anneau commutatif $A$, l'espace $\lex{spectre-premier}{\operatorname{Spec}} A$ est quasi-compact.
    preuve: |
      Il suffit de traiter un recouvrement par des ouverts de la base, $\operatorname{Spec} A = \bigcup_{i \in I} D(f_i)$ : un recouvrement quelconque se raffine en un tel recouvrement, et une sous-famille finie de celui-ci donne, en prenant pour chacun de ses membres un ouvert du recouvrement initial qui le contient, une sous-famille finie de ce dernier.

      L'égalité dit que $\lex{partie-v-spectre}{V}(\{f_i : i \in I\}) = \varnothing$ ({{ga-zariski|Topologie de Zariski}}). L'idéal $J$ engendré par les $f_i$ est donc égal à $A$ : sinon, il serait contenu dans un idéal maximal ({{ga-krull|Théorème de Krull}}), qui appartiendrait à $V(J)$.

      Ainsi
      $$1 = \sum_{i \in F} a_i f_i$$
      pour une partie finie $F \subset I$ ({{n-sommes|Sommes finies}}), et aucun idéal premier ne contient tous les $f_i$, $i \in F$ : les $D(f_i)$, $i \in F$, recouvrent $\operatorname{Spec} A$.
    remarques:
      - |
        On dit « quasi-compact » et non « compact », car l'atlas réserve ce mot aux espaces séparés ({{t-compact|Compacité}}), ce que le spectre n'est pas. La preuve traduit une propriété algébrique, qu'une combinaison égale à $1$ ne fait intervenir qu'un nombre fini de termes, en une propriété topologique.

  - id: ga-nilradical
    etiquette: Nilradical
    nature: théorème
    titre: Radical d'un idéal et intersection des idéaux premiers
    choix: |
      Pour un anneau quelconque, la démonstration de (i), et donc de (ii), utilise le lemme de Zorn, et (i) ne se démontre pas dans $\mathsf{ZF}$ seul : dans le modèle de Hodges où un anneau principal $A$ n'a pas d'idéal maximal ({{ga-points|Points fermés}}), un élément $a$ non nul et non inversible n'appartient à aucun idéal premier, alors que $1 \notin \sqrt{aA}$. Le point (iii) n'utilise aucun choix, et il rend (i) et (ii) démontrables sans choix pour les quotients d'anneaux de polynômes en un nombre fini d'indéterminées sur un corps.
    texte: |
      Le [[radical-ideal|radical]] d'un idéal $I$ est $\sqrt I = \{x \in A : x^n \in I \text{ pour un } n \in \lex{ensemble-entiers-naturels}{\mathbb N}\}$ ; le radical de $\{0\}$, ensemble des éléments nilpotents, est le **nilradical**. Un idéal est **radical** s'il est égal à son radical.
    enonce: |
      (i) $\sqrt I$ est l'intersection des idéaux premiers qui contiennent $I$ ; c'est donc un idéal.

      (ii) $\lex{partie-v-spectre}{V}(I) \subset V(J)$ si et seulement si $\sqrt J \subset \sqrt I$. Les fermés de $\lex{spectre-premier}{\operatorname{Spec}} A$ correspondent ainsi bijectivement aux idéaux radicaux, par $I \mapsto V(I)$.

      (iii) Soit $K$ un corps, $I$ un idéal de $\lex{anneau-polynomes}{K[X_1, \dots, X_n]}$ et $A = K[X_1, \dots, X_n]/I$. Pour tout idéal $J$ de $A$, $\sqrt J$ est l'intersection des idéaux maximaux de $A$ qui contiennent $J$.
    preuve: |
      (i) Si $x^n \in I \subset \mathfrak p$ avec $\mathfrak p$ premier, alors $x \in \mathfrak p$, par récurrence sur $n$.

      Réciproquement, soit $x \notin \sqrt I$, et $S = \{x^n : n \in \mathbb N\}$, qui ne rencontre pas $I$. L'ensemble des idéaux contenant $I$ et ne rencontrant pas $S$ est non vide et inductif, comme dans la preuve du théorème de {{ga-krull|Krull}} ; soit $\mathfrak p$ un élément maximal.

      Il est premier : si $a, b \notin \mathfrak p$, les idéaux $\mathfrak p + aA$ et $\mathfrak p + bA$ rencontrent $S$, par maximalité, et l'on écrit $x^m = p_1 + ar$, $x^n = p_2 + bs$ ; alors $x^{m + n} \in \mathfrak p + abA$, et $ab \notin \mathfrak p$, sinon $x^{m+n} \in \mathfrak p$.

      Ainsi $x$ n'appartient pas à l'idéal premier $\mathfrak p \supset I$.

      (ii) Les idéaux premiers contenant $I$ sont les éléments de $V(I)$. Si $V(I) \subset V(J)$, l'intersection sur $V(J)$ est contenue dans l'intersection sur $V(I)$, soit $\sqrt J \subset \sqrt I$ par (i). Réciproquement, un premier qui contient $I$ contient $\sqrt I \supset \sqrt J \supset J$. Comme $V(I) = V(\sqrt I)$, deux idéaux radicaux distincts ont des fermés distincts.

      (iii) Un idéal maximal est premier ({{a-premier-maximal|Idéaux premiers, maximaux}}, (iii)) : le premier paragraphe de la preuve de (i), qui ne fait aucun choix, montre que $\sqrt J$ est contenu dans l'intersection. Notons $K[X] = K[X_1, \dots, X_n]$ et $\pi : K[X] \to A$ la surjection canonique ; soit $P \in K[X]$ dont la classe $x = \pi(P)$ n'est pas dans $\sqrt J$. L'idéal $J_0 = \pi^{-1}(J)$ contient $I$, et aucune puissance $P^m$ n'y appartient, puisque $x^m \notin J$ ; en particulier $P \neq 0$.

      Dans $K[X][T] = K[X_1, \dots, X_n, T]$, l'idéal $J_1$ engendré par $J_0$ et $1 - TP$ ne contient pas $1$. Sinon, on écrirait
      $$1 = \sum_k G_k Q_k + H\,(1 - TP)$$
      avec $Q_k \in J_0$. Évaluons en $T = 1/P$, dans le corps des fractions de l'anneau intègre $K[X]$ ({{a-fractions|Corps des fractions}}, {{pol-anneau|Anneau A[X]}}, (iii)), par la propriété universelle ({{pol-evaluation|Évaluation}}, (i)) : $1 = \sum_k G_k(X, 1/P)\, Q_k$. En multipliant par une puissance $P^N$ assez grande pour chasser les dénominateurs, on obtient $P^N \in J_0$, ce qui est exclu.

      Par {{ga-krull-polynomes|Krull sans choix}}, (i), $J_1$ est contenu dans un idéal maximal $\mathfrak M_1$ de $K[X][T]$. Dans le corps $L = K[X][T]/\mathfrak M_1$, la restriction à $K$ de la surjection canonique est injective ({{a-corps|Corps}}, (iii)), et l'on identifie $K$ à son image, sous-corps de $L$. Alors $L$ est engendré comme $K$-algèbre par les classes des $X_i$ et de $T$, donc de dimension finie sur $K$ ({{ga-lemme-zariski|Lemme de Zariski}}).

      Soit $\mathfrak M = \mathfrak M_1 \cap K[X]$, noyau du morphisme $K[X] \to L$. Son image $D \cong K[X]/\mathfrak M$ ({{a-anneau-quotient|Anneau quotient}}) est un sous-anneau intègre de $L$ qui contient $K$, sous-espace de $L$, donc de dimension finie sur $K$ ({{v-dimension|Dimension}}, (iii)) ; pour $y \neq 0$ dans $D$, la multiplication par $y$ est linéaire et injective de $D$ dans $D$, donc surjective ({{v-rang|Théorème du rang}}), et $y$ est inversible dans $D$. Ainsi $D$ est un corps, et $\mathfrak M$ un idéal maximal ({{a-premier-maximal|Idéaux premiers, maximaux}}, (ii)).

      Il contient $J_0 \supset I$, et pas $P$, sans quoi $1 = TP + (1 - TP)$ serait dans $\mathfrak M_1$. Par {{ga-krull-polynomes|Krull sans choix}}, (ii), $\pi(\mathfrak M)$ est un idéal maximal de $A$, qui contient $\pi(J_0) = J$, et pas $x$, puisque $\pi^{-1}(\pi(\mathfrak M)) = \mathfrak M$.
    remarques:
      - |
        L'astuce de la variable supplémentaire $T$, dans (iii), est due à Rabinowitsch (1929). Elle transforme « aucune puissance de $P$ n'est dans $J_0$ » en « un certain idéal ne contient pas $1$ », auquel s'applique l'existence d'idéaux maximaux ; le {{ga-nullstellensatz|Nullstellensatz}} en tirera sa forme forte.
      - |
        Dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, le radical de $12\mathbb Z$ est $6\mathbb Z$ : un entier dont une puissance est multiple de $12 = 2^2 \cdot 3$ est multiple de $2$ et de $3$. Les fermés $V(12\mathbb Z)$ et $V(6\mathbb Z)$ sont égaux, réduits aux deux points $2\mathbb Z$ et $3\mathbb Z$ : le spectre ne voit pas les multiplicités.

  - id: ga-zeros
    etiquette: Ensembles algébriques
    nature: proposition
    titre: Ensembles algébriques affines
    texte: |
      Soit $K$ un corps et $\lex{anneau-polynomes}{K[X]} = K[X_1, \dots, X_n]$ ({{pol-evaluation|plusieurs indéterminées}}). Pour $a \in \lex{n-uplet}{K^n}$, l'évaluation $P \mapsto P(a)$ est un morphisme d'anneaux. Pour $S \subset K[X]$ et $Y \subset K^n$, on pose
      $$\begin{aligned} Z(S) = \{a \in K^n :{} &P(a) = 0 \\ &\text{pour tout } P \in S\}, \end{aligned}$$
      $$\begin{aligned} I(Y) = \{P \in K[X] :{} &P(a) = 0 \\ &\text{pour tout } a \in Y\}. \end{aligned}$$
      Un [[ensemble-algebrique|ensemble algébrique]] est une partie de la forme $Z(S)$.
    enonce: |
      (i) $Z(S) = Z(J)$ où $J$ est l'idéal engendré par $S$, et $I(Y)$ est un idéal radical.

      (ii) $Z(I) \cup Z(J) = Z(IJ)$ et $\bigcap_i Z(S_i) = Z\big(\bigcup_i S_i\big)$ : les ensembles algébriques sont les fermés d'une topologie sur $K^n$, la **topologie de Zariski** de $K^n$.

      (iii) $Y \subset Z(I(Y))$, avec égalité si et seulement si $Y$ est algébrique ; $S \subset I(Z(S))$.

      (iv) Tout ensemble algébrique est de la forme $Z(P_1, \dots, P_k)$ pour un nombre fini de polynômes $P_1, \dots, P_k$.
    preuve: |
      (i) Les polynômes qui s'annulent en $a$ forment le noyau de l'évaluation, qui est un idéal ; $Z(S)$ ne change donc pas si l'on remplace $S$ par l'idéal qu'il engendre. $I(Y)$ est une intersection de tels noyaux. Si $P^m$ s'annule sur $Y$, $P$ aussi, $K$ étant intègre.

      (ii) Si $a \notin Z(I)$, il existe $P \in I$ avec $P(a) \neq 0$ ; pour $Q \in J$, $PQ \in IJ$ s'annule en $a$, donc $Q(a) = 0$ : $a \in Z(J)$. L'autre inclusion et l'égalité des intersections sont immédiates.

      Avec $Z(0) = K^n$ et $Z(1) = \varnothing$, les ensembles algébriques contiennent $\varnothing$ et $K^n$ et sont stables par intersection quelconque et par réunion finie : leurs complémentaires vérifient les axiomes d'une topologie ({{t-espace|Espace topologique}}).

      (iii) Les inclusions sont des tautologies. Si $Y = Z(S)$, alors $S \subset I(Y)$ donne $Z(I(Y)) \subset Z(S) = Y$.

      (iv) Par (i), $Z(S) = Z(J)$, où $J$ est l'idéal engendré par $S$. Par le théorème de la base de Hilbert ({{ac-hilbert|Base de Hilbert}}), $J$ est engendré par un nombre fini de polynômes $P_1, \dots, P_k$, et $Z(J) = Z(P_1, \dots, P_k)$ par (i) encore.
    remarques:
      - |
        Le cercle $Z(X_1^2 + X_2^2 - 1)$ de $\mathbb R^2$ est algébrique ; la courbe $\{(x, y) : y = \sin x\}$ ne l'est pas.

        En effet, un ensemble algébrique rencontre une droite en un nombre fini de points ou la contient tout entière, puisque chaque polynôme, restreint à la droite paramétrée, devient un polynôme en une variable, nul ou à racines en nombre fini ; or cette courbe coupe l'axe $y = 0$ en une infinité de points sans le contenir.

        ```schema ga-zeros
        À gauche, le cercle rencontre la droite $X_2 = \frac{X_1 + 1}2$ en deux points seulement, $(-1, 0)$ et $(\frac35, \frac45)$. À droite, la courbe $y = \sin x$ coupe l'axe $y = 0$ en une infinité de points sans le contenir, ce qu'aucun ensemble algébrique ne peut faire.
        ```
      - |
        Sans hypothèse sur $K$, $Z$ ne distingue pas assez d'idéaux. Sur $\mathbb R$, $Z(X^2 + 1) = \varnothing = Z(1)$, alors que l'idéal engendré par $X^2 + 1$ est maximal et différent de $\mathbb R[X]$. Le Nullstellensatz, au nœud suivant, demande un corps algébriquement clos.

  - id: ga-lemme-zariski
    etiquette: Lemme de Zariski
    nature: lemme
    titre: Lemme de Zariski
    texte: |
      Soit $L$ un [[corps]] et $K$ un sous-corps de $L$ ; $L$ est un [[espace-vectoriel|espace vectoriel]] sur $K$, la multiplication externe étant le produit de $L$. Pour $x_1, \dots, x_n \in L$, on note $K[x_1, \dots, x_n]$ l'image du morphisme d'évaluation $\lex{anneau-polynomes}{K[X_1, \dots, X_n]} \to L$ qui envoie chaque $X_i$ sur $x_i$ ({{pol-evaluation|Évaluation}}, (iii)).

      C'est un sous-anneau de $L$ qui contient $K$ et les $x_i$, et il est contenu dans tout sous-anneau $B$ de $L$ qui les contient : le morphisme de $K[X_1, \dots, X_n]$ dans $B$ qui envoie $X_i$ sur $x_i$, suivi de l'inclusion de $B$ dans $L$, coïncide avec l'évaluation, par l'unicité dans la propriété universelle.

      Pour $n = 0$, on convient que $K[x_1, \dots, x_0] = K$. On dit que $L$ est **engendré comme $K$-algèbre** par $x_1, \dots, x_n$ si $L = K[x_1, \dots, x_n]$.
    enonce: |
      Si le corps $L$ est engendré comme $K$-algèbre par un nombre fini d'éléments, alors $L$ est un $K$-espace vectoriel de [[dimension]] finie.
    preuve: |
      On raisonne par récurrence sur le nombre $n$ de générateurs, l'énoncé étant démontré à chaque rang pour tous les couples $K \subset L$ à la fois. Pour $n = 0$, $L = K$, de dimension $1$. Soit $n \geqslant 1$, $L = K[x_1, \dots, x_n]$, et $x = x_1$. Deux cas se présentent.

      *Cas algébrique : il existe $Q \neq 0$ dans $K[X]$ tel que $Q(x) = 0$.* Pour $P \in K[X]$, la division euclidienne $P = QS + R$, avec $\deg R < \deg Q$ ({{pol-division|Division des polynômes}}, (ii)), donne $P(x) = R(x)$ : $F = K[x]$ est engendré par $1, x, \dots, x^{d-1}$, où $d = \deg Q$, et il est de dimension finie.

      C'est un corps : pour $y \neq 0$ dans $F$, l'application $z \mapsto yz$ de $F$ dans $F$ est $K$-linéaire et injective, puisque $L$ est un corps, donc surjective ({{v-rang|Théorème du rang}}), et $y$ a un inverse dans $F$.

      *Cas transcendant : $P(x) \neq 0$ pour tout $P \neq 0$ de $K[X]$.* L'ensemble
      $$\begin{aligned} F = \{P(x)\,Q(x)^{-1} :{} &P, Q \in K[X],\ \\ &Q \neq 0\} \end{aligned}$$
      est un sous-corps de $L$ : il contient $K$ et $x$, et il est stable par somme, produit et passage à l'inverse d'un élément non nul, puisque
      $$\frac{P(x)}{Q(x)} + \frac{P'(x)}{Q'(x)} = \frac{(PQ' + P'Q)(x)}{(QQ')(x)},$$
      avec $(QQ')(x) = Q(x)Q'(x) \neq 0$.

      Dans les deux cas, $F$ est un sous-corps de $L$ qui contient $K$ et $x$. Le sous-anneau $F[x_2, \dots, x_n]$ de $L$ contient $K$ et $x_1, \dots, x_n$, donc il contient $K[x_1, \dots, x_n] = L$, d'où $F[x_2, \dots, x_n] = L$ : $L$ est engendré comme $F$-algèbre par $n - 1$ éléments, et l'hypothèse de récurrence le rend de dimension finie sur $F$.

      Par le théorème de la base incomplète en dimension finie ({{v-dimension|Dimension}}, (iii)), $L$ a une base $(e_1, \dots, e_m)$ sur $F$ avec $e_1 = 1$.

      *Fin du cas algébrique.* Si $(f_i)$ engendre $F$ sur $K$, les produits $f_ie_j$, en nombre fini, engendrent $L$ sur $K$ : tout $z = \sum_j \lambda_je_j$, avec $\lambda_j = \sum_i \mu_{ij}f_i$ et $\mu_{ij} \in K$, vaut $\sum_{i,j}\mu_{ij}\,f_ie_j$. Donc $L$ est de dimension finie sur $K$.

      *Le cas transcendant est impossible.* Écrivons $x_ke_j = \sum_l a_{kjl}e_l$ pour $2 \leqslant k \leqslant n$, et $e_je_{j'} = \sum_l b_{jj'l}e_l$, avec des coefficients dans $F$, en nombre fini.

      Chacun s'écrit $P(x)/Q(x)$ ; soit $f \in K[X]$ le produit de ces dénominateurs, non nul. Les coefficients sont alors dans
      $$A = \{P(x)\,f(x)^{-k} : P \in K[X],\ k \in \lex{ensemble-entiers-naturels}{\mathbb N}\},$$
      sous-anneau de $F$ qui contient $K$ et $x$.

      L'ensemble $M = Ae_1 + \cdots + Ae_m$ est stable par addition et par multiplication par $A$, et par multiplication par chaque $e_j$, puisque les $b_{jj'l}$ sont dans $A$ ; il est donc stable par produit, et c'est un sous-anneau de $L$.

      Il contient $1 = e_1$, donc $K$ et $x \in A$, ainsi que $x_k = x_ke_1 \in M$ : il contient $K[x_1, \dots, x_n] = L$.

      Soit alors $y \in F$. On a $y = \sum_j \mu_je_j$ avec $\mu_j \in A$, et aussi $y = y\,e_1$ ; par unicité des coordonnées dans la base $(e_j)$ ({{v-libre|Familles libres, bases}}, (i)), $y = \mu_1 \in A$. Ainsi $F = A$.

      Posons $g = 1 + Xf$. Le polynôme $Xf$ est de degré $1 + \deg f \geqslant 1$ ({{pol-anneau|Anneau A[X]}}, (iii)), et ajouter la constante $1$ ne change pas son coefficient d'indice $1 + \deg f$ : $g$ est de degré $1 + \deg f \geqslant 1$, donc non nul, et $g(x) \neq 0$.

      Comme $g(x)^{-1} \in F = A$, il existe $P \in K[X]$ et $k \in \mathbb N$ tels que $g(x)^{-1} = P(x)\,f(x)^{-k}$, c'est-à-dire $f(x)^k = g(x)P(x)$, et, l'évaluation en $x$ étant injective, $f^k = gP$ dans $K[X]$.

      Par la formule du binôme ({{pol-binome|Binôme de Newton}}),
      $$(Xf)^k = (g - 1)^k = gR + (-1)^k$$
      pour un $R \in K[X]$. Or $(Xf)^k = X^kgP$, d'où $(-1)^k = g\,(X^kP - R)$ : le polynôme $g$, de degré au moins $1$, diviserait une constante non nulle, ce qui contredit l'additivité des degrés dans l'anneau intègre $K[X]$.
    remarques:
      - |
        La structure de la preuve tient dans une tour de deux étages.

        ```schema ga-lemme-zariski
        Le corps $F$ engendré par $x = x_1$ s'intercale entre $K$ et $L$, et l'étage supérieur est de dimension finie par récurrence. Si $x$ est algébrique, l'étage inférieur l'est aussi, et les dimensions finies se composent. Si $x$ était transcendant, un nombre fini de dénominateurs, rassemblés en $f$, suffirait à écrire tout élément de $F$ ; l'inverse de $1 + xf(x)$ ne s'écrit pas ainsi.
        ```

        On retrouve, dans le cas transcendant, la raison pour laquelle $\mathbb Q$ n'est pas engendré comme anneau par un nombre fini de fractions : un nombre fini de dénominateurs ne fait apparaître qu'un nombre fini de nombres premiers.
      - |
        L'erreur la plus répandue est d'oublier l'hypothèse que $L$ est un corps. L'anneau $K[X]$ lui-même est engendré comme $K$-algèbre par un seul élément et n'est pas de dimension finie ; la preuve s'arrête alors dès le premier pas : dans le cas transcendant, le corps $F$ des $P(x)/Q(x)$ n'est plus contenu dans $L$, puisque $Q(x)$ n'y est pas inversible.
      - |
        La preuve n'utilise aucune forme de l'axiome du choix : les bases choisies sont en nombre fini, et en dimension finie le théorème de la base incomplète se démontre dans $\mathsf{ZF}$.

  - id: ga-nullstellensatz
    etiquette: Nullstellensatz
    nature: théorème
    titre: Théorème des zéros de Hilbert
    texte: |
      Un corps $K$ est [[corps-algebriquement-clos|algébriquement clos]] si tout polynôme non constant de $\lex{anneau-polynomes}{K[X]}$ a une racine dans $K$. Pour $a \in \lex{n-uplet}{K^n}$, on note $\mathfrak m_a$ l'idéal engendré par $X_1 - a_1, \dots, X_n - a_n$.
    enonce: |
      Soit $K$ algébriquement clos.

      (i) *Forme faible.* Les idéaux maximaux de $K[X_1, \dots, X_n]$ sont exactement les $\mathfrak m_a$, $a \in K^n$. En particulier, un idéal $J \neq K[X]$ a un zéro : $Z(J) \neq \varnothing$.

      (ii) *Forme forte.* Pour tout idéal $J$, $I(Z(J)) = \sqrt J$.
    preuve: |
      (i) Montrons d'abord que $\mathfrak m_a$ est maximal. L'évaluation en $a$ est un morphisme surjectif sur $K$, dont le noyau contient $\mathfrak m_a$.
      Réciproquement, en écrivant chaque $X_i = (X_i - a_i) + a_i$ et en développant, tout $P$ s'écrit $P(a) + R$ avec $R \in \mathfrak m_a$ ; si $P(a) = 0$, alors $P \in \mathfrak m_a$.

      Le noyau est donc $\mathfrak m_a$, et le quotient, isomorphe à $K$ ({{a-anneau-quotient|Anneau quotient}}), est un corps : $\mathfrak m_a$ est maximal ({{a-premier-maximal|Idéaux premiers, maximaux}}).

      Réciproquement, soit $\mathfrak m$ un idéal maximal et $\pi : K[X] \to L = K[X]/\mathfrak m$ la surjection canonique, morphisme d'anneaux ({{a-anneau-quotient|Anneau quotient}}) ; $L$ est un corps ({{a-premier-maximal|Idéaux premiers, maximaux}}). La restriction de $\pi$ à $K$ est injective, son noyau étant un idéal du corps $K$ qui ne contient pas $1$ ; on identifie $K$ à son image, sous-corps de $L$.

      Alors $\pi$ est l'évaluation en $x = (\pi(X_1), \dots, \pi(X_n))$, par unicité dans la propriété universelle, et $L = K[x_1, \dots, x_n]$. Par le lemme de Zariski ({{ga-lemme-zariski|Lemme de Zariski}}), $L$ est de dimension finie $d$ sur $K$.

      Pour chaque $i$, la famille $1, x_i, \dots, x_i^d$, à $d + 1$ éléments, est liée ({{v-dimension|Dimension}}, (ii)) : il existe $P \neq 0$ dans $K[X]$ tel que $P(x_i) = 0$. Comme $K$ est algébriquement clos, $P$ est produit d'une constante non nulle et de facteurs $X - c$, par récurrence sur le degré ({{pol-racines|Racines}}, (i)) ; le produit des $x_i - c$ étant nul dans le corps $L$, l'un des facteurs est nul : $x_i = a_i \in K$.

      Ainsi $X_i - a_i \in \mathfrak m$ pour tout $i$, d'où $\mathfrak m_a \subset \mathfrak m$, et $\mathfrak m = \mathfrak m_a$ par maximalité de $\mathfrak m_a$, puisque $\mathfrak m \neq K[X]$.

      Enfin, si $J \neq K[X]$, il est contenu dans un idéal maximal ({{ga-krull-polynomes|Krull sans choix}}, (i)), de la forme $\mathfrak m_a$, et $a \in Z(J)$.

      (ii) Si $P^m \in J$, $P$ s'annule là où $P^m$ s'annule : $\sqrt J \subset I(Z(J))$.

      Réciproquement, soit $P \in I(Z(J))$. Par (i), un idéal maximal qui contient $J$ est de la forme $\mathfrak m_a$, noyau de l'évaluation en $a$ ; il contient $J$, donc $a \in Z(J)$, puis $P(a) = 0$ et $P \in \mathfrak m_a$.

      Ainsi $P$ appartient à tous les idéaux maximaux qui contiennent $J$, et leur intersection est $\sqrt J$ ({{ga-nilradical|Nilradical}}, (iii), avec $I = \{0\}$).
    remarques:
      - |
        La forme forte se ramène ainsi à la forme faible par l'astuce de Rabinowitsch (1929), mise en œuvre au nœud {{ga-nilradical|Nilradical}}, (iii) : grâce à la variable supplémentaire $T$, un polynôme dont aucune puissance n'est dans $J$ évite un idéal maximal qui contient $J$, c'est-à-dire, par la forme faible, ne s'annule pas en un point de $Z(J)$.
      - |
        Aucune forme du choix n'intervient dans ce nœud : l'idéal maximal qui contient un idéal propre est fourni par {{ga-krull-polynomes|Krull sans choix}}, et non par le théorème de Krull général.
      - |
        Le corps {{c|$\mathbb C$}} est algébriquement clos ; c'est le cadre classique de la géométrie algébrique. L'hypothèse est indispensable, comme le montre l'exemple de $X^2 + 1$ sur $\mathbb R$ ({{ga-zeros|Ensembles algébriques}}).

  - id: ga-correspondance
    etiquette: Dictionnaire
    nature: corollaire
    titre: Le dictionnaire entre algèbre et géométrie
    enonce: |
      Soit $K$ algébriquement clos.

      (i) $Z$ et $I$ sont des bijections réciproques, décroissantes pour l'inclusion, entre les ensembles algébriques de $\lex{n-uplet}{K^n}$ et les idéaux radicaux de $\lex{anneau-polynomes}{K[X_1, \dots, X_n]}$.

      (ii) L'application $a \mapsto \mathfrak m_a$ est une bijection de $K^n$ sur l'ensemble des idéaux maximaux, c'est-à-dire sur les points fermés de $\lex{spectre-premier}{\operatorname{Spec}} K[X]$, et $a \in Z(J)$ si et seulement si $\mathfrak m_a \in \lex{partie-v-spectre}{V}(J)$.
    preuve: |
      (i) Si $J$ est radical, $I(Z(J)) = \sqrt J = J$ par le Nullstellensatz ; si $Y$ est algébrique, $Z(I(Y)) = Y$ ({{ga-zeros|Ensembles algébriques}}). Les deux applications renversent l'inclusion par définition.

      (ii) La forme faible du Nullstellensatz donne la surjectivité ; $\mathfrak m_a = \mathfrak m_b$ entraîne $b \in Z(\mathfrak m_a) = \{a\}$, d'où l'injectivité. Un idéal maximal est un point fermé ({{ga-points|Points fermés}}, (ii), sens direct, sans choix). Réciproquement, soit $\mathfrak p$ un point fermé de $\lex{spectre-premier}{\operatorname{Spec}} K[X]$ ; s'il n'était pas maximal, il serait strictement contenu dans un idéal $J \neq K[X]$, lui-même contenu dans un idéal maximal $\mathfrak M$ ({{ga-krull-polynomes|Krull sans choix}}, (i)), qui est premier ({{a-premier-maximal|Idéaux premiers, maximaux}}, (iii)) et différent de $\mathfrak p$ : on aurait $V(\mathfrak p) \neq \{\mathfrak p\}$, alors que $V(\mathfrak p)$ est l'adhérence de $\mathfrak p$ ({{ga-points|Points fermés}}, (i)). Ce sens n'utilise donc aucun choix.

      Enfin $a \in Z(J)$ signifie que $J$ est contenu dans le noyau de l'évaluation en $a$, qui est $\mathfrak m_a$.
    remarques:
      - |
        Ce dictionnaire est la raison d'être du spectre : il identifie l'espace géométrique $K^n$ aux points fermés de $\operatorname{Spec} K[X]$, et chaque ensemble algébrique à un fermé de Zariski. Grothendieck a pris le spectre de n'importe quel anneau commutatif comme espace de départ ; recollés, ces spectres forment les schémas.
      - |
        Les idéaux premiers non maximaux correspondent aux ensembles algébriques irréductibles, qui ne sont pas réunion de deux fermés plus petits : la droite, le cercle, la surface. Le spectre ajoute à chacun un point générique, qui le représente tout entier.

