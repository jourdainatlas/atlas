# Niveau 1 : structure interne du nœud « Probabilités ».
# Espace probabilisé, indépendance, variables aléatoires et lois, espérance et variance,
# loi faible des grands nombres (et théorème de Weierstrass par les polynômes de Bernstein),
# Borel-Cantelli, modes de convergence, loi forte (moment d'ordre 4), loi du 0-1, nombres
# normaux de Borel ; puis, grâce à l'analyse complexe (exp, π, arctan) : lois de Poisson et
# exponentielle, loi normale, inégalité de Hoeffding, théorème central limite par Lindeberg.

graphe: proba
titre: Probabilités
conteneur: proba

entrees:
  mes: [p-espace, p-independance, p-variables, p-esperance]
  anc: [p-poisson-exp, p-normale]

noeuds:
  - id: p-espace
    etiquette: Espace probabilisé
    nature: définition
    titre: Espaces probabilisés et probabilités conditionnelles
    texte: |
      Un [[espace-probabilise|espace probabilisé]] est un espace mesuré $(\Omega, \mathcal A, P)$ tel que $P(\Omega) = 1$ ; la [[mesure]] $P$ est une **probabilité**, les éléments de $\mathcal A$ sont les **événements**. Si $P(B) > 0$, la **probabilité conditionnelle** de $A$ sachant $B$ est $P(A \mid B) = P(A \cap B)/P(B)$.
    enonce: |
      (i) Si $P(B) > 0$, $A \mapsto P(A \mid B)$ est une probabilité sur $(\Omega, \mathcal A)$.

      (ii) *Probabilités totales.* Si $(B_n)$ est une partition de $\Omega$, finie ou indexée par $\lex{ensemble-entiers-naturels}{\mathbb N}$, en événements de probabilité non nulle, alors $P(A) = \sum_n P(A \mid B_n)\,P(B_n)$ pour tout événement $A$.

      (iii) *Formule de Bayes.* Sous les mêmes hypothèses, si $P(A) > 0$,
      $$P(B_k \mid A) = \frac{P(A \mid B_k)\,P(B_k)}{\sum_n P(A \mid B_n)\,P(B_n)}.$$
    preuve: |
      (i) $P(\Omega \mid B) = 1$, et la σ-additivité de $P$, appliquée aux $A_n \cap B$ disjoints, donne celle de $P(\cdot \mid B)$.

      (ii) Les $A \cap B_n$ sont disjoints, de réunion $A$ ; par σ-additivité, $P(A) = \sum_n P(A \cap B_n)$, et $P(A \cap B_n) = P(A \mid B_n)P(B_n)$.

      (iii) $P(B_k \mid A) = P(A \cap B_k)/P(A)$ ; on écrit le numérateur comme en (ii) et le dénominateur par (ii).
    remarques:
      - |
        Le modèle de Kolmogorov (1933) ne dit pas ce qu'est le hasard : il fixe les règles de calcul, celles de la théorie de la {{mes|mesure}}, et laisse à chaque situation le soin de choisir $\Omega$ et $P$. Tous les théorèmes de cette branche sont des théorèmes d'intégration sur un espace de masse $1$.
      - |
        L'erreur la plus répandue est de confondre $P(A \mid B)$ et $P(B \mid A)$. Pour une maladie de prévalence $1\,\%$, un test qui détecte $99\,\%$ des malades et donne $5\,\%$ de faux positifs, la formule de Bayes donne
        $$\begin{aligned} &P(\text{malade} \mid +) \\ &= \frac{0{,}99 \times 0{,}01}{0{,}99 \times 0{,}01 + 0{,}05 \times 0{,}99} = \frac16 : \end{aligned}$$
        un test positif ne laisse qu'une chance sur six d'être malade, parce que les bien-portants sont beaucoup plus nombreux.

  - id: p-independance
    etiquette: Indépendance
    nature: théorème
    titre: Indépendance d'événements et de tribus
    texte: |
      Des sous-tribus $(\mathcal A_i)_{i \in I}$ de $\mathcal A$ sont [[independance|indépendantes]] si, pour toute partie finie $J \subset I$ et tous $A_j \in \mathcal A_j$,
      $$P\Big(\bigcap_{j \in J} A_j\Big) = \prod_{j \in J} P(A_j).$$
      Des événements $(A_i)$ sont indépendants si les tribus $\{\varnothing, A_i, A_i^c, \Omega\}$ le sont.
    enonce: |
      (i) Soient $(\mathcal C_i)_{i \in I}$ des π-systèmes tels que la formule produit vaille pour toute partie finie $J$ et tous $C_j \in \mathcal C_j$. Alors les tribus $\sigma(\mathcal C_i)$ sont indépendantes. En particulier, des événements sont indépendants dès que la formule produit vaut pour leurs intersections finies.

      (ii) *Regroupement.* Si les $(\mathcal A_i)_{i \in I}$ sont indépendantes et si $I$ est la réunion disjointe de parties $(I_k)_{k \in K}$, les tribus $\mathcal B_k = \sigma\big(\bigcup_{i \in I_k} \mathcal A_i\big)$ sont indépendantes.
    preuve: |
      (i) Fixons $J$ fini, $j_0 \in J$ et des $C_j \in \mathcal C_j$ pour $j \neq j_0$. L'ensemble des $A \in \mathcal A$ tels que
      $$\begin{aligned} &P\big(A \cap \bigcap_{j \neq j_0} C_j\big) \\ &\quad = P(A)\prod_{j \neq j_0} P(C_j) \end{aligned}$$
      est une classe monotone : il contient $\Omega$, par la formule produit pour $J \setminus \{j_0\}$, il est stable par différence $B \setminus A$ avec $A \subset B$, puisque $P$ est finie, et par réunion croissante, par continuité.

      Il contient $\mathcal C_{j_0}$, donc $\sigma(\mathcal C_{j_0})$ par le lemme de Dynkin ({{m-dynkin|Classes monotones}}).

      On remplace ainsi chaque $\mathcal C_j$ par $\sigma(\mathcal C_j)$, l'un après l'autre. Pour des événements, on applique ce résultat aux π-systèmes $\{A_i\}$, qui engendrent $\{\varnothing, A_i, A_i^c, \Omega\}$.

      (ii) Soit $\mathcal C_k$ l'ensemble des intersections finies d'éléments de $\bigcup_{i \in I_k} \mathcal A_i$ : c'est un π-système qui engendre $\mathcal B_k$.

      Une intersection finie d'éléments pris dans des $\mathcal C_k$ distincts est une intersection finie d'éléments de tribus $\mathcal A_i$ d'indices distincts, puisque les $I_k$ sont disjoints et qu'on peut regrouper dans une même $\mathcal A_i$ les facteurs de même indice.

      La formule produit vaut donc pour les $\mathcal C_k$, et l'on applique (i).
    remarques:
      - |
        L'erreur la plus répandue est de croire que l'indépendance deux à deux suffit. Lançons deux pièces équilibrées : les événements « la première donne pile », « la seconde donne pile » et « les deux pièces donnent le même côté » sont deux à deux indépendants, chacun de probabilité $\frac12$ et chaque intersection de deux d'entre eux de probabilité $\frac14$ ; mais l'intersection des trois est de probabilité $\frac14$, et non $\frac18$.

  - id: p-variables
    etiquette: Variables aléatoires
    nature: définition
    titre: Variables aléatoires, lois, fonctions de répartition
    texte: |
      Une [[variable-aleatoire|variable aléatoire]] réelle est une fonction mesurable $X : \Omega \to \lex{ensemble-reels}{\mathbb R}$. Sa [[loi-variable|loi]] est la probabilité $P_X(B) = P(X \in B)$ sur $\lex{tribu-borelienne}{\mathcal B}(\mathbb R)$, et sa **fonction de répartition** est $F_X(x) = P(X \leqslant x)$. La tribu engendrée par $X$ est $\sigma(X) = \{X^{-1}(B) : B \in \mathcal B(\mathbb R)\}$, et des variables sont indépendantes si les tribus qu'elles engendrent le sont.
    enonce: |
      (i) $F_X$ est croissante, continue à droite, de limites $0$ en $-\infty$ et $1$ en $+\infty$, et elle détermine la loi $P_X$.

      ```schema p-variables
      À gauche, la fonction de répartition du nombre $X$ de piles en deux lancers d'une pièce équilibrée : elle saute de $\frac14$, $\frac12$ et $\frac14$ en $0$, $1$ et $2$, et le point plein marque la valeur prise au saut, ce qui traduit la continuité à droite. À droite, celle de la loi uniforme sur $[0, 1]$ est continue, car aucun point n'y a une probabilité non nulle.
      ```

      (ii) Des variables $X_1, \dots, X_n$ sont indépendantes si et seulement si $P(X_1 \leqslant x_1, \dots, X_n \leqslant x_n) = \prod_i F_{X_i}(x_i)$ pour tous $x_i$. Si $X$ et $Y$ sont indépendantes, $\varphi(X)$ et $\psi(Y)$ le sont pour $\varphi, \psi$ boréliennes.

      (iii) Le couple $(X, Y)$ est mesurable pour la tribu produit $\mathcal B(\mathbb R) \otimes \mathcal B(\mathbb R)$, et $X$ et $Y$ sont indépendantes si et seulement si la loi du couple est la [[mesure-produit|mesure produit]] $P_X \otimes P_Y$.
    preuve: |
      (i) $P_X$ est une probabilité, image de $P$ par $X$ : la σ-additivité passe aux images réciproques. La croissance est claire. Si $x_n \downarrow x$, les $\{X \leqslant x_n\}$ décroissent vers $\{X \leqslant x\}$, et la continuité décroissante d'une mesure finie ({{m-mesures|Mesures}}) donne la continuité à droite ; les limites se traitent de même.

      Les demi-droites $]{-\infty}, x]$ forment un π-système qui engendre $\mathcal B(\mathbb R)$ ({{m-tribus|Tribus}}) ; deux lois de même fonction de répartition coïncident par le lemme de Dynkin ({{m-dynkin|Classes monotones}}), appliqué avec $X_n = \,]{-\infty}, n]$, dont la réunion est $\mathbb R$, et les mesures étant finies.

      (ii) Les $\{X_i \leqslant x\}$ forment un π-système engendrant $\sigma(X_i)$, et l'on peut prendre $x_j$ arbitrairement grand pour les indices $j$ hors d'une sous-famille, la continuité croissante faisant tendre $F_{X_j}(x_j)$ vers $1$ ; on applique {{p-independance|Indépendance}}, (i). Ensuite $\sigma(\varphi(X)) \subset \sigma(X)$.

      (iii) $(X, Y)^{-1}(A \times B) = X^{-1}(A) \cap Y^{-1}(B)$ est mesurable, et les pavés engendrent la tribu produit ({{m-tribus|Tribus}}, (iv)). Sur les pavés, l'indépendance s'écrit $P_{(X, Y)}(A \times B) = P_X(A)P_Y(B)$ ; ils forment un π-système, et l'unicité de la mesure produit ({{m-produit|Mesure produit}}) conclut.
    remarques:
      - |
        Une **variable de Bernoulli** de paramètre $p$ vaut $1$ avec probabilité $p$ et $0$ sinon. Le nombre de succès en $n$ épreuves indépendantes suit la **loi binomiale** : $P(S_n = k) = N_{n,k}\, p^k (1 - p)^{n-k}$, où $N_{n,k}$ est le nombre de parties à $k$ éléments de $\{1, \dots, n\}$. Le rang du premier succès suit la **loi géométrique** : $P(T = k) = (1 - p)^{k-1}p$ pour $k \geqslant 1$.
      - |
        Toute probabilité $\mu$ sur $\mathbb R$ est la loi d'une variable : sur $(\mathbb R, \mathcal B(\mathbb R), \mu)$, l'identité convient. La loi uniforme sur $[0, 1]$ est la restriction de la {{m-lebesgue|mesure de Lebesgue}}, de fonction de répartition $x \mapsto x$ sur $[0, 1]$. Construire une **suite** de variables indépendantes est plus délicat ; le nœud {{p-normaux|Nombres normaux}} le fait pour des variables de Bernoulli.

  - id: p-esperance
    etiquette: Espérance, variance
    nature: théorème
    titre: Espérance, variance et inégalités
    texte: |
      L'[[esperance|espérance]] d'une variable positive ou intégrable est $E[X] = \int_\Omega X \, dP$. Si $E[X^2] < +\infty$, la **variance** est $\operatorname{Var} X = E\big[(X - E[X])^2\big] = E[X^2] - E[X]^2$, et la **covariance** de $X$ et $Y$ est $E[XY] - E[X]E[Y]$.
    enonce: |
      (i) *Transfert.* Pour $\varphi : \lex{ensemble-reels}{\mathbb R} \to \mathbb R$ borélienne, positive ou telle que $\varphi(X)$ soit intégrable, $E[\varphi(X)] = \int_{\mathbb R} \varphi \, dP_X$. Il en va de même pour un couple et $\varphi$ mesurable sur $\lex{n-uplet}{\mathbb R^2}$ pour la tribu produit.

      (ii) Si $E[X^2] < +\infty$, $X$ est intégrable, et $E[|XY|] \leqslant \sqrt{E[X^2]\,E[Y^2]}$ (Cauchy-Schwarz).

      (iii) *Markov, Bienaymé-Tchebychev.* Pour $a > 0$, $P(|X| \geqslant a) \leqslant E[|X|]/a$, et $P\big(|X - E[X]| \geqslant a\big) \leqslant \operatorname{Var} X / a^2$.

      (iv) Si $X$ et $Y$ sont indépendantes et intégrables, $XY$ est intégrable et $E[XY] = E[X]\,E[Y]$. Par suite, si $X_1, \dots, X_n$ sont de carré intégrable et deux à deux indépendantes, $\operatorname{Var}(X_1 + \cdots + X_n) = \sum_i \operatorname{Var} X_i$.
    preuve: |
      (i) Pour $\varphi = \mathbf 1_B$, c'est la définition de $P_X$. Par linéarité, la formule vaut pour les fonctions étagées positives, puis pour $\varphi \geqslant 0$ par convergence monotone ({{m-beppo-levi|Convergence monotone}}), en approchant $\varphi$ par une suite croissante d'étagées, et enfin pour $\varphi$ intégrable en séparant $\varphi^+$ et $\varphi^-$. Le cas d'un couple est identique.

      (ii) $|X| \leqslant \frac12(1 + X^2)$. Pour tout réel $t$,
      $$\begin{aligned} 0 &\leqslant E\big[(|X| - t|Y|)^2\big] \\ &= E[X^2] - 2tE[|XY|] + t^2E[Y^2] ; \end{aligned}$$
      si $E[Y^2] > 0$, on prend $t = E[|XY|]/E[Y^2]$, et si $E[Y^2] = 0$, alors $Y = 0$ presque partout et l'inégalité est triviale. La racine carrée existe par le théorème des valeurs intermédiaires ({{c-tvi|Valeurs intermédiaires}}).

      (iii) $a\mathbf 1_{\{|X| \geqslant a\}} \leqslant |X|$, puis on applique la première inégalité à $(X - E[X])^2$ et $a^2$.

      (iv) Par (i) et l'indépendance ({{p-variables|Variables aléatoires}}, (iii)),
      $$\begin{aligned} E[|XY|] &= \int |xy| \, d(P_X \otimes P_Y) \\ &= E[|X|]\,E[|Y|] \end{aligned}$$
      par le théorème de Tonelli, et $E[XY] = E[X]\,E[Y]$ par celui de Fubini ({{m-fubini|Tonelli, Fubini}}).

      En développant le carré, la variance d'une somme est la somme des variances et des covariances, qui sont nulles.
    remarques:
      - |
        Pour une variable de Bernoulli, $E[X] = p$ et $\operatorname{Var} X = p(1 - p)$, qui vaut au plus $\frac14$. Une variable binomiale est une somme de $n$ variables de Bernoulli indépendantes, d'où $E[S_n] = np$ et $\operatorname{Var} S_n = np(1 - p)$, sans aucun calcul de somme.
      - |
        Pour une variable $T$ à valeurs dans $\lex{ensemble-entiers-naturels}{\mathbb N}$, $T = \sum_{k \geqslant 0} \mathbf 1_{\{T > k\}}$, et la convergence monotone donne $E[T] = \sum_{k \geqslant 0} P(T > k)$. Pour la loi géométrique, $P(T > k) = (1 - p)^k$, d'où $E[T] = 1/p$ : il faut en moyenne six lancers pour obtenir un six.

  - id: p-loi-faible
    etiquette: Loi faible des grands nombres
    nature: théorème
    titre: Loi faible des grands nombres et théorème de Weierstrass
    enonce: |
      (i) *Loi faible.* Soient $X_1, X_2, \dots$ des variables deux à deux indépendantes, de même loi, de carré intégrable, d'espérance $m$ et de variance $\sigma^2$, et $S_n = X_1 + \cdots + X_n$. Pour tout $\varepsilon > 0$,
      $$P\Big(\Big|\frac{S_n}{n} - m\Big| \geqslant \varepsilon\Big) \leqslant \frac{\sigma^2}{n\varepsilon^2} \longrightarrow 0.$$

      (ii) *Weierstrass, par Bernstein.* Pour $f : [0, 1] \to \lex{ensemble-reels}{\mathbb R}$ continue, les polynômes
      $$B_nf(x) = \sum_{k=0}^n N_{n,k}\, f\Big(\frac kn\Big)\, x^k (1 - x)^{n-k}$$
      convergent uniformément vers $f$ sur $[0, 1]$. En particulier, toute fonction continue sur un segment est limite uniforme de polynômes.
    preuve: |
      (i) $E[S_n/n] = m$ et $\operatorname{Var}(S_n/n) = \sigma^2/n$ ({{p-esperance|Espérance, variance}}, (iv)) ; on applique l'inégalité de Bienaymé-Tchebychev.

      (ii) Fixons $x \in [0, 1]$. Sur l'ensemble fini $\Omega = \{0, 1\}^n$, muni de toutes ses parties, posons $P(\{\omega\}) = x^{|\omega|}(1 - x)^{n - |\omega|}$, où $|\omega|$ est le nombre de $1$ ; en développant $\prod_i \big(x + (1 - x)\big) = 1$, ces poids ont pour somme $1$.

      Les coordonnées $\omega_i$ sont des variables de Bernoulli de paramètre $x$, indépendantes, car $P(\omega_1 = \varepsilon_1, \dots, \omega_n = \varepsilon_n)$ est le produit des $x^{\varepsilon_i}(1 - x)^{1 - \varepsilon_i}$. Leur somme $S_n$ vérifie $P(S_n = k) = N_{n,k}x^k(1 - x)^{n-k}$, d'où
      $$B_nf(x) = E[f(S_n/n)].$$

      ```schema p-loi-faible
      Pour $x = 0{,}3$, les poids $P(S_n = k)$ sont placés aux points $k/n$ ; ceux de la fenêtre $|k/n - x| < \delta$, avec $\delta = 0{,}15$, sont en bleu, les autres en rouge. La masse rouge, $0{,}300$ pour $n = 10$ et $0{,}0015$ pour $n = 100$, est celle que la preuve majore par Bienaymé-Tchebychev, par $x(1 - x)/(n\delta^2)$, puis par $1/(4n\delta^2)$, qui ne dépend plus de $x$.
      ```

      Soit $\varepsilon > 0$. Par le théorème de Heine ({{c-heine|Théorème de Heine}}), il existe $\delta > 0$ tel que $|u - v| < \delta$ entraîne $|f(u) - f(v)| < \varepsilon$. Soit $\|f\| = \sup |f|$.

      En séparant les cas $|S_n/n - x| < \delta$ et $\geqslant \delta$, et par (i) avec $\sigma^2 = x(1 - x) \leqslant \frac14$,
      $$\begin{aligned} |B_nf(x) - f(x)| &\leqslant E\big[|f(S_n/n) - f(x)|\big] \\ &\leqslant \varepsilon + \frac{2\|f\|}{4n\delta^2}. \end{aligned}$$

      La majoration ne dépend pas de $x$ : pour $n$ assez grand, $|B_nf - f| < 2\varepsilon$ sur $[0, 1]$. Un segment $[a, b]$ se ramène à $[0, 1]$ par une application affine.
    remarques:
      - |
        La convergence est lente. Pour $f(x) = |x - \frac12|$, on calcule $B_nf(\frac12) = E\big[|S_n/n - \frac12|\big] \approx 0{,}123$ pour $n = 10$ et $\approx 0{,}040$ pour $n = 100$ : l'erreur au point de non-dérivabilité décroît comme $1/\sqrt n$, alors que $f(\frac12) = 0$.

        ```schema p-loi-faible-2
        Au point $\frac12$, où $f$ n'est pas dérivable, $B_{10}f$ (en bleu) et $B_{100}f$ (en vert) dépassent $f$ de $0{,}123$ et $0{,}040$ environ, longueurs des segments rouges : multiplier $n$ par $10$ ne divise l'erreur que par un peu plus de $3$, à peu près $\sqrt{10}$.
        ```
      - |
        La démonstration de Bernstein (1912) est le premier exemple d'une preuve probabiliste d'un théorème d'analyse qui ne parle pas de hasard. L'aléa n'y est qu'un moyen de calcul : $B_nf(x)$ est une moyenne de valeurs de $f$ pondérée par des poids qui se concentrent près de $x$.

  - id: p-borel-cantelli
    etiquette: Borel-Cantelli
    nature: lemme
    titre: Lemmes de Borel-Cantelli
    texte: |
      Pour une suite d'événements $(A_n)$, l'événement $\limsup A_n = \bigcap_m \bigcup_{k \geqslant m} A_k$ est formé des $\omega$ qui appartiennent à une infinité de $A_n$.
    enonce: |
      (i) Si $\sum_n P(A_n) < +\infty$, alors $P(\limsup A_n) = 0$ : presque sûrement, seul un nombre fini des $A_n$ est réalisé.

      (ii) Si les $A_n$ sont indépendants et $\sum_n P(A_n) = +\infty$, alors $P(\limsup A_n) = 1$.
    preuve: |
      (i) Pour tout $m$, $P(\limsup A_n) \leqslant P\big(\bigcup_{k \geqslant m} A_k\big) \leqslant \sum_{k \geqslant m} P(A_k)$, reste d'une série convergente.

      (ii) Notons $p_k = P(A_k)$. Les complémentaires $A_k^c$ sont indépendants ({{p-independance|Indépendance}}), et, pour $m \leqslant n$,
      $$\begin{aligned} P\Big(\bigcap_{k=m}^n A_k^c\Big) &= \prod_{k=m}^n (1 - p_k) \\ &\leqslant \prod_{k=m}^n \frac{1}{1 + p_k} \\ &\leqslant \frac{1}{1 + \sum_{k=m}^n p_k}, \end{aligned}$$
      puisque $(1 - p)(1 + p) \leqslant 1$ et qu'en développant, $\prod (1 + p_k) \geqslant 1 + \sum p_k$.

      Le majorant tend vers $0$ quand $n \to \infty$, donc $P\big(\bigcap_{k \geqslant m} A_k^c\big) = 0$ par continuité décroissante. Le complémentaire de $\limsup A_n$ est la réunion dénombrable de ces événements négligeables.
    remarques:
      - |
        Pour des événements indépendants de probabilités $1/n$, une infinité se produit presque sûrement, puisque $\sum 1/n = +\infty$ ; pour des probabilités $1/n^2$, seulement un nombre fini. C'est une loi du tout ou rien : la probabilité de $\limsup A_n$ ne vaut que $0$ ou $1$, ce que la {{p-zero-un|loi du 0-1}} généralisera.
      - |
        La démonstration de (ii) évite l'inégalité $1 - p \leqslant e^{-p}$ que l'on emploie d'ordinaire, bien que l'exponentielle soit disponible ici, l'{{anc|analyse complexe}} étant un parent de cette branche : la minoration $\prod(1 + p_k) \geqslant 1 + \sum p_k$ suffit et reste purement algébrique.

  - id: p-convergences
    etiquette: Modes de convergence
    nature: proposition
    titre: Convergence presque sûre, en probabilité, en moyenne
    texte: |
      Une suite de variables $(X_n)$ converge vers $X$ **presque sûrement** si $P(X_n \to X) = 1$, **en probabilité** si $P(|X_n - X| > \varepsilon) \to 0$ pour tout $\varepsilon > 0$, et **en moyenne** si $E[|X_n - X|] \to 0$.
    enonce: |
      (i) La convergence presque sûre entraîne la convergence en probabilité.

      (ii) La convergence en moyenne entraîne la convergence en probabilité.

      (iii) Si $X_n \to X$ en probabilité, une suite extraite converge presque sûrement.

      (iv) La convergence en probabilité, et même en moyenne, n'entraîne pas la convergence presque sûre.
    preuve: |
      (i) L'événement $\{X_n \to X\}$ est mesurable, comme $\bigcap_k \bigcup_m \bigcap_{n \geqslant m} \{|X_n - X| \leqslant 1/(k+1)\}$. Les événements $B_m = \bigcup_{n \geqslant m} \{|X_n - X| > \varepsilon\}$ décroissent vers un événement disjoint de $\{X_n \to X\}$, donc négligeable, et $P(|X_m - X| > \varepsilon) \leqslant P(B_m) \to 0$ par continuité décroissante.

      (ii) Inégalité de Markov ({{p-esperance|Espérance, variance}}, (iii)).

      (iii) Soit $n_0 = 0$ et, pour $k \geqslant 1$, $n_k$ le **plus petit** entier $n > n_{k-1}$ tel que $P(|X_m - X| > 2^{-k}) \leqslant 2^{-k}$ pour tout $m \geqslant n$ ; il existe par hypothèse, et aucun choix n'intervient. Comme $\sum_k 2^{-k} < +\infty$, le lemme de Borel-Cantelli ({{p-borel-cantelli|Borel-Cantelli}}, (i)) montre que, presque sûrement, $|X_{n_k} - X| \leqslant 2^{-k}$ à partir d'un certain rang.

      (iv) Sur $[0, 1[$ muni de la mesure de Lebesgue, écrivons $n = 2^j + i$ avec $0 \leqslant i < 2^j$, et posons $X_n = \mathbf 1_{[i2^{-j}, (i+1)2^{-j}[}$. Alors $E[X_n] = 2^{-j} \to 0$ ; mais chaque $\omega$ appartient, pour chaque $j$, à l'un des intervalles de longueur $2^{-j}$, si bien que $X_n(\omega) = 1$ pour une infinité de $n$ et $X_n(\omega)$ ne tend vers $0$ pour aucun $\omega$.
    remarques:
      - |
        L'exemple (iv) est une « machine à écrire » : un intervalle de plus en plus étroit balaie $[0, 1[$ indéfiniment.

        ```schema p-convergences
        La ligne $n$ montre l'intervalle où $X_n = 1$, pour $n = 2^j + i$ ; les lignes rouges sont celles de la suite extraite $X_{2^j}$, dont l'intervalle $[0, 2^{-j}[$ finit par ne plus contenir aucun $\omega > 0$. La verticale $\omega = 0{,}7$ rencontre un intervalle à chaque balayage, pour $n = 1$, $3$, $6$ et $13$, si bien que $X_n(\omega) = 1$ une infinité de fois.
        ```

        La suite extraite $X_{2^j}$, qui ne garde que le premier intervalle de chaque balayage, converge bien presque sûrement vers $0$, comme (iii) l'annonçait.

  - id: p-loi-forte
    etiquette: Loi forte des grands nombres
    nature: théorème
    titre: Loi forte des grands nombres
    enonce: |
      Soient $X_1, X_2, \dots$ des variables indépendantes, de même loi, telles que $E[X_1^4] < +\infty$, et $m = E[X_1]$. Alors, presque sûrement,
      $$\frac{X_1 + \cdots + X_n}{n} \longrightarrow m.$$
    preuve: |
      Posons $Y_i = X_i - m$ : $E[Y_i] = 0$, $c = E[Y_i^4] < +\infty$, puisque $Y^4 \leqslant 8(X^4 + m^4)$, et $s = E[Y_i^2]$ vérifie $s^2 \leqslant c$ par Cauchy-Schwarz appliqué à $Y^2$ et $1$. En développant,
      $$E\big[(Y_1 + \cdots + Y_n)^4\big] = \sum_{i, j, k, l} E[Y_iY_jY_kY_l].$$

      Si l'un des indices n'apparaît qu'une fois, disons $i$, la variable $Y_i$ est indépendante du produit des trois autres ({{p-independance|Indépendance}}, (ii)), qui est intégrable puisque $|abc| \leqslant |a|^3 + |b|^3 + |c|^3 \leqslant 3 + a^4 + b^4 + c^4$, et le terme vaut $E[Y_i] \cdot E[\cdots] = 0$ ({{p-esperance|Espérance, variance}}, (iv)).

      Restent les $n$ termes où les quatre indices sont égaux, qui valent $c$, et les $3n(n - 1)$ termes formés de deux paires distinctes, qui valent $s^2$. Donc
      $$\begin{aligned} E\big[(Y_1 + \cdots + Y_n)^4\big] &\leqslant nc + 3n^2c \\ &\leqslant 4n^2c. \end{aligned}$$

      Par l'inégalité de Markov appliquée à la puissance quatrième,
      $$P\Big(\Big|\frac{S_n}{n} - m\Big| \geqslant \varepsilon\Big) \leqslant \frac{4c}{n^2\varepsilon^4},$$
      terme général d'une série convergente, puisque $\frac1{n^2} \leqslant \frac1{n - 1} - \frac1n$ pour $n \geqslant 2$. Par Borel-Cantelli ({{p-borel-cantelli|Borel-Cantelli}}), presque sûrement $|S_n/n - m| < \varepsilon$ à partir d'un certain rang.

      On prend $\varepsilon = 1/(k + 1)$ ; l'intersection de ces événements de probabilité $1$, indexée par $k \in \lex{ensemble-entiers-naturels}{\mathbb N}$, est encore de probabilité $1$.
    remarques:
      - |
        L'hypothèse $E[X^4] < +\infty$ rend la démonstration courte, mais elle n'est pas nécessaire : Kolmogorov a montré que l'intégrabilité suffit, et Etemadi (1981) a même affaibli l'indépendance mutuelle en indépendance deux à deux. Ces versions sont admises ici ; leur démonstration repose sur une troncature des variables.
      - |
        La loi forte justifie l'interprétation fréquentielle des probabilités : la fréquence d'un événement dans une suite d'épreuves indépendantes tend presque sûrement vers sa probabilité. Le théorème central limite ({{p-tcl|Théorème central limite}}) précise la vitesse, en $\sigma/\sqrt n$, et la forme des fluctuations, qui suivent la loi normale.

  - id: p-zero-un
    etiquette: Loi du 0-1
    nature: théorème
    titre: Loi du 0-1 de Kolmogorov
    texte: |
      Pour une suite de variables $(X_n)$, la **tribu asymptotique** est $\mathcal T = \bigcap_n \sigma(X_k : k \geqslant n)$ : ses événements ne dépendent pas d'un nombre fini quelconque de variables.
    enonce: |
      Si les $X_n$ sont indépendantes, tout événement de $\mathcal T$ a pour probabilité $0$ ou $1$.
    preuve: |
      Par regroupement ({{p-independance|Indépendance}}, (ii)), $\sigma(X_1, \dots, X_n)$ est indépendante de $\sigma(X_k : k > n)$, qui contient $\mathcal T$.

      Ainsi $\mathcal T$ est indépendante de chaque $\sigma(X_1, \dots, X_n)$, donc de leur réunion, qui est un π-système, réunion croissante de tribus. Par {{p-independance|Indépendance}}, (i), $\mathcal T$ est indépendante de la tribu engendrée par cette réunion, $\sigma(X_k : k \geqslant 1)$, qui contient $\mathcal T$.

      Pour $A \in \mathcal T$, $P(A) = P(A \cap A) = P(A)^2$, donc $P(A) \in \{0, 1\}$.
    remarques:
      - |
        L'événement « $S_n/n$ converge » est asymptotique, puisque modifier un nombre fini de termes ne change ni la convergence ni la limite. La loi du 0-1 dit, avant tout calcul, qu'il est presque sûr ou presque impossible ; la loi forte tranche. Elle ne dit pas lequel des deux cas a lieu, et c'est là toute sa limite.

  - id: p-normaux
    etiquette: Nombres normaux
    nature: théorème
    titre: Chiffres binaires et nombres normaux de Borel
    texte: |
      Pour $\omega \in [0, 1[$, le $k$-ième chiffre binaire est $d_k(\omega) = \lfloor 2^k\omega \rfloor - 2\lfloor 2^{k-1}\omega \rfloor$, qui vaut $0$ ou $1$, puisque $\lfloor 2y \rfloor - 2\lfloor y \rfloor \in \{0, 1\}$ pour tout réel $y$.
    enonce: |
      (i) Sur $[0, 1[$ muni de la mesure de Lebesgue, les $d_k$ sont des variables de Bernoulli de paramètre $\frac12$, indépendantes.

      (ii) *Borel, 1909.* Pour presque tout $\omega \in [0, 1[$, la proportion de $1$ parmi les $n$ premiers chiffres binaires de $\omega$ tend vers $\frac12$.
    preuve: |
      (i) Par récurrence, $\lfloor 2^n\omega \rfloor = \sum_{k \leqslant n} d_k(\omega) 2^{n-k}$, la somme étant télescopique.

      L'application $(\varepsilon_1, \dots, \varepsilon_n) \mapsto \sum_k \varepsilon_k 2^{n-k}$ est une bijection de $\{0, 1\}^n$ sur $\{0, \dots, 2^n - 1\}$, par l'unicité de la division euclidienne par $2$ ; donc l'événement $\{d_1 = \varepsilon_1, \dots, d_n = \varepsilon_n\}$ est $\{\lfloor 2^n\omega \rfloor = N\}$, c'est-à-dire l'intervalle $[N2^{-n}, (N + 1)2^{-n}[$, de mesure $2^{-n} = \prod_k \frac12$.

      Les $d_k$ sont boréliennes, comme différences de fonctions en escalier. La formule produit pour ces événements entraîne, en sommant sur les valeurs des indices omis, celle de toute sous-famille, d'où l'indépendance par {{p-independance|Indépendance}}, (i).

      (ii) Les $d_k$ sont bornées, donc de moment d'ordre $4$ fini ; on applique la loi forte des grands nombres ({{p-loi-forte|Loi forte}}).
    remarques:
      - |
        Le théorème affirme que presque tout réel est normal en base $2$, sans en exhiber aucun de façon simple. En base $10$, Champernowne a montré en 1933 que $0{,}123456789101112\ldots$, obtenu en écrivant les entiers à la suite, est normal ; on ignore en revanche si $\sqrt 2$ ou $\pi$ le sont.
      - |
        En répartissant les chiffres $d_k$ en une infinité de sous-suites disjointes, au moyen d'une bijection de $\lex{ensemble-entiers-naturels}{\mathbb N} \times \mathbb N$ sur $\mathbb N$ ({{q-denombrable|ℚ est dénombrable}}), et en recomposant chaque sous-suite en un réel, on obtient une suite de variables uniformes indépendantes sur le seul espace $[0, 1[$ : c'est ce que fait le nœud suivant, qui en déduit des suites indépendantes de lois quelconques.

  - id: p-suites-iid
    etiquette: Suites indépendantes
    nature: théorème
    titre: Suites de variables indépendantes de lois données
    texte: |
      On reprend l'espace $\Omega = [0, 1[$, muni de la mesure de Lebesgue, et les chiffres binaires $d_k$ du nœud {{p-normaux|Nombres normaux}}. Pour une fonction de répartition $F$ et $u \in \,]0, 1[$, on pose $G(u) = \inf\{x \in \lex{ensemble-reels}{\mathbb R} : F(x) \geqslant u\}$ : c'est la **fonction quantile** de $F$.
    enonce: |
      (i) Pour $m \in \lex{ensemble-entiers-naturels}{\mathbb N}$, posons $U_m = \sum_{j \geqslant 0} d_{2^m(2j+1)}\,2^{-(j+1)}$. Les $U_m$ sont des variables indépendantes, de loi uniforme sur $[0, 1]$.

      (ii) Si $U$ est une variable de loi uniforme sur $[0, 1]$, la variable $X$ égale à $G(U)$ sur $\{0 < U < 1\}$ et à $0$ ailleurs a pour fonction de répartition $F$.

      (iii) Pour toute suite $(\mu_m)$ de probabilités sur $\mathbb R$, il existe sur $\Omega$ une suite de variables indépendantes $X_m$ de lois $\mu_m$. En particulier, il existe des suites de variables indépendantes et de même loi, de loi quelconque.
    preuve: |
      (i) *Les sous-suites de chiffres.* Tout entier $k \geqslant 1$ s'écrit de manière unique $2^m(2j + 1)$ avec $m, j \in \mathbb N$ ({{q-denombrable|ℚ est dénombrable}}, (i)) : les ensembles $I_m = \{2^m(2j + 1) : j \in \mathbb N\}$ sont disjoints et recouvrent $\mathbb N \setminus \{0\}$.

      Chaque $U_m$ est mesurable, comme limite simple de ses sommes partielles, qui sont des sommes finies de fonctions mesurables ({{m-mesurables|Fonctions mesurables}}, (ii) et (iii)).

      De plus, chaque $d_k$, $k \in I_m$, est mesurable pour la tribu
      $$\mathcal B_m = \sigma\Big(\bigcup_{k \in I_m}\sigma(d_k)\Big),$$
      et le même argument, appliqué sur $(\Omega, \mathcal B_m)$, montre que $U_m$ est $\mathcal B_m$-mesurable : $\sigma(U_m) \subset \mathcal B_m$.

      Les $d_k$ étant indépendants, les $\mathcal B_m$ le sont par regroupement ({{p-independance|Indépendance}}, (ii)), donc aussi les $U_m$.

      *La loi.* Fixons $m$ et posons $e_j = d_{2^m(2j - 1)}$ pour $j \geqslant 1$ : ce sont des variables de Bernoulli de paramètre $\frac12$ indépendantes, et $V = \sum_j e_j2^{-j} = U_m$, à valeurs dans $[0, 1]$.

      Pour $n \geqslant 1$ et $0 \leqslant M < 2^n$, soit $E_M$ l'événement « les $n$ premiers $e_j$ sont les chiffres binaires de $M$ », de probabilité $2^{-n}$ par indépendance ; sur $E_M$, $V \in [M2^{-n}, (M + 1)2^{-n}]$, la queue de la série étant comprise entre $0$ et $2^{-n}$.

      Soit $x = N2^{-n}$ un dyadique de $[0, 1]$. On a $\bigcup_{M < N} E_M \subset \{V \leqslant x\}$, d'où $P(V \leqslant x) \geqslant x$.

      Si $V \leqslant x$ sur $E_M$ avec $M \geqslant N$, alors $V = x$ ; et, pour tout $n' \geqslant n$, l'égalité $V = x$ impose aux $n'$ premiers chiffres d'être ceux de $N2^{n'-n}$ ou de $N2^{n'-n} - 1$, d'où $P(V = x) \leqslant 2 \cdot 2^{-n'}$, puis $P(V = x) = 0$. Ainsi $P(V \leqslant x) = x$ pour tout dyadique $x$ de $[0, 1]$.

      Pour $x \in [0, 1]$ quelconque, des dyadiques $x' \leqslant x \leqslant x''$ arbitrairement proches de $x$ et la croissance de $F_V$ donnent $F_V(x) = x$ ; enfin $F_V = 0$ sur $]{-\infty}, 0[$ et $F_V = 1$ sur $[1, +\infty[$. C'est la fonction de répartition de la loi uniforme, qui est donc la loi de $V$ ({{p-variables|Variables aléatoires}}, (i)).

      (ii) Pour $u \in \,]0, 1[$, l'ensemble $A_u = \{x : F(x) \geqslant u\}$ est non vide et minoré, puisque $F$ tend vers $1$ en $+\infty$ et vers $0$ en $-\infty$ ; il a donc une borne inférieure $G(u)$, par la [[propriete-borne-superieure|propriété de la borne supérieure]] appliquée aux opposés.

      Comme $F$ est croissante, $A_u$ contient toute demi-droite $[x, +\infty[$ issue de l'un de ses points ; il contient donc $G(u) + \frac1k$ pour tout $k \geqslant 1$, et, $F$ étant continue à droite, $F(G(u)) = \lim_k F(G(u) + \frac1k) \geqslant u$ : $G(u) \in A_u$. Donc, pour tout réel $x$, $G(u) \leqslant x$ si et seulement si $u \leqslant F(x)$.

      Par suite $X = h(U)$, où $h(u) = G(u)$ pour $0 < u < 1$ et $h(u) = 0$ sinon, et $\{h \leqslant x\} = B_x$, avec
      $$B_x = \,]0, 1[ \,\cap\, ]{-\infty}, F(x)]$$
      si $x < 0$ et
      $$\begin{aligned} B_x = {}&(]0, 1[ \,\cap\, ]{-\infty}, F(x)]) \\ &\cup (\mathbb R \setminus \,]0, 1[) \end{aligned}$$
      si $x \geqslant 0$ : ces ensembles sont boréliens, donc $h$ est borélienne ({{m-mesurables|Fonctions mesurables}}, (i)), $X$ est mesurable et $\sigma(X) \subset \sigma(U)$.

      Comme $P(U \in \,]0, 1[) = 1$,
      $$P(X \leqslant x) = P(0 < U \leqslant F(x)) = F(x),$$
      $F(x)$ étant dans $[0, 1]$ : la fonction de répartition de $X$ est $F$.

      (iii) Soit $F_m$ la fonction de répartition de $\mu_m$, $G_m$ sa fonction quantile, et $X_m$ construite à partir de $U_m$ comme en (ii). La loi de $X_m$ a pour fonction de répartition $F_m$, donc c'est $\mu_m$ ({{p-variables|Variables aléatoires}}, (i)). Chaque $X_m = h_m(U_m)$ est une fonction borélienne de $U_m$ seul, et $\sigma(X_m) \subset \sigma(U_m)$ par (ii) ; des sous-tribus de tribus indépendantes étant indépendantes, les $X_m$ le sont.
    remarques:
      - |
        La répartition des chiffres est fixée par l'écriture $k = 2^m(2j + 1)$ : $U_0$ utilise les chiffres d'indices impairs $1, 3, 5, \dots$, $U_1$ ceux d'indices $2, 6, 10, \dots$, $U_2$ ceux d'indices $4, 12, 20, \dots$

        ```schema p-suites-iid
        Les vingt-quatre premiers chiffres binaires de $\omega$, colorés selon la variable qui les utilise : le chiffre $d_k$ va à $U_m$, où $2^m$ est la plus grande puissance de $2$ qui divise $k$. Chaque variable reçoit une infinité de chiffres, et deux variables n'en partagent aucun.
        ```

        Ainsi, pour $\omega = 0{,}101101\ldots$ en base $2$, $U_0$ commence par les chiffres $d_1, d_3, d_5 = 1, 1, 0$, et $U_1$ par $d_2, d_6 = 0, 1$, soit $U_0 = 0{,}110\ldots$ et $U_1 = 0{,}01\ldots$ en base $2$.
      - |
        L'erreur la plus répandue est de croire que des variables uniformes construites sur le même $\omega$ sont automatiquement indépendantes. Les variables $\omega \mapsto 2^m\omega - \lfloor 2^m\omega \rfloor$, qui décalent les chiffres de $\omega$, sont toutes uniformes, mais très dépendantes : la deuxième se lit sur la première, dont elle est le double modulo $1$. C'est le partage des chiffres en paquets disjoints qui produit l'indépendance.
      - |
        Le théorème donne un sens aux hypothèses des lois des grands nombres et du théorème central limite, qui portent sur des suites indépendantes de même loi : de telles suites existent. Pour une famille non dénombrable de variables, ou des lois sur des espaces plus généraux, il faut construire une probabilité produit infinie (théorème des produits infinis d'Andersen et Jessen, ou d'Ionescu Tulcea, ou théorème d'extension de Kolmogorov pour des espaces polonais), admis ici ; sur $[0, 1[$ lui-même, une famille non dénombrable de variables indépendantes dont aucune n'est presque sûrement constante est impossible.

        Les étapes propres à cette construction, la répartition des chiffres et la fonction quantile, n'utilisent aucun choix ; seul intervient, en amont, le [[choix-denombrable|choix dénombrable]] sur lequel repose la {{m-lebesgue|mesure de Lebesgue}}.

  - id: p-poisson-exp
    etiquette: Poisson, exponentielle
    nature: théorème
    titre: Lois de Poisson et loi exponentielle
    texte: |
      Une probabilité $\mu$ sur $\lex{ensemble-reels}{\mathbb R}$ a pour **densité** une fonction borélienne $f \geqslant 0$ telle que $\int f\,d\lambda = 1$ si $\mu(B) = \int_B f\,d\lambda$ pour tout borélien $B$ ; c'est bien une probabilité ({{m-beppo-levi|Convergence monotone}}, (iii)).

      La [[loi-poisson|loi de Poisson]] de paramètre $\lambda > 0$ est la loi sur $\lex{ensemble-entiers-naturels}{\mathbb N}$ donnée par $P(X = k) = e^{-\lambda}\lambda^k/k!$. La **loi exponentielle** de paramètre $\lambda > 0$ a pour densité $\lambda e^{-\lambda x}\mathbf 1_{x \geqslant 0}$.
    enonce: |
      (i) Pour tout réel $x$, $(1 + x/n)^n \to e^x$ quand $n \to \infty$.

      (ii) La loi de Poisson est une probabilité, d'espérance et de variance $\lambda$. Si $S_n$ suit la loi binomiale de paramètres $n$ et $\lambda/n$, alors $P(S_n = k) \to e^{-\lambda}\lambda^k/k!$ pour tout $k$.

      (iii) La loi exponentielle est une probabilité, de fonction de répartition $1 - e^{-\lambda x}$ sur $[0, +\infty[$, et elle est **sans mémoire** : $P(X > s + t \mid X > s) = P(X > t)$ pour $s, t \geqslant 0$.

      (iv) Réciproquement, si $X$ est à valeurs dans $]0, +\infty[$, sans mémoire, et $0 < P(X > 1) < 1$, alors $X$ suit une loi exponentielle.
    preuve: |
      (i) En développant,
      $$\Big(1 + \frac xn\Big)^n = \sum_{k=0}^n \frac{x^k}{k!}\prod_{j<k}\Big(1 - \frac jn\Big).$$
      Chaque terme tend vers $x^k/k!$ et est majoré en module par $|x|^k/k!$, terme d'une série convergente. Le théorème de convergence dominée pour la mesure de comptage sur $\mathbb N$ ({{m-convergence-dominee|Convergence dominée}}) donne la limite $\sum_k x^k/k! = e^x$ ({{cx-exponentielle|Exponentielle}}).

      (ii) $\sum_k e^{-\lambda}\lambda^k/k! = e^{-\lambda}e^\lambda = 1$. De même $\sum_k k\,e^{-\lambda}\lambda^k/k! = \lambda$ et $\sum_k k(k-1)e^{-\lambda}\lambda^k/k! = \lambda^2$, d'où $E[X^2] = \lambda^2 + \lambda$ et $\operatorname{Var} X = \lambda$.

      Pour la loi binomiale,
      $$\begin{aligned} &P(S_n = k) \\ &= \frac{\lambda^k}{k!}\prod_{j<k}\frac{n - j}{n}\,\Big(1 - \frac\lambda n\Big)^{n-k} ; \end{aligned}$$
      le produit tend vers $1$, $(1 - \lambda/n)^{-k}$ aussi, et $(1 - \lambda/n)^n \to e^{-\lambda}$ par (i).

      (iii) La fonction $x \mapsto -e^{-\lambda x}$ a pour dérivée $\lambda e^{-\lambda x}$ ; par le théorème fondamental et la comparaison de Riemann et Lebesgue ({{m-riemann|Riemann et Lebesgue}}),
      $$\int_{[0, T]} \lambda e^{-\lambda x}\,dx = 1 - e^{-\lambda T},$$
      qui tend vers $1$ par convergence monotone, puisque $e^{\lambda T} \geqslant 1 + \lambda T$.

      Donc $P(X > t) = e^{-\lambda t}$, et $P(X > s + t)/P(X > s) = e^{-\lambda t}$ par $\exp(a + b) = \exp a \exp b$.

      (iv) Posons $G(t) = P(X > t)$, décroissante, continue à droite ({{p-variables|Variables aléatoires}}), avec $G(s + t) = G(s)G(t)$ et $G(0) = 1$. Soit $q = G(1) \in \,]0, 1[$. La fonction $\exp$ étant continue et strictement croissante sur $\mathbb R$, avec $\exp 0 = 1$ et $\exp(-x) = 1/\exp x \to 0$, il existe un unique $\lambda > 0$ tel que $e^{-\lambda} = q$.

      Par récurrence, $G(m) = q^m$, puis $G(m/n)^n = G(m)$ ; la racine $n$-ième positive étant unique, $G(m/n) = e^{-\lambda m/n}$. Enfin $G$ et $t \mapsto e^{-\lambda t}$ sont continues à droite et coïncident sur les rationnels positifs, qui sont denses : elles sont égales.
    remarques:
      - |
        L'approximation de Poisson explique la fréquence de cette loi : elle compte les événements rares parmi de nombreuses épreuves indépendantes. Pour $n = 100$ et $\lambda = 2$, la loi binomiale donne $0{,}1326$, $0{,}2707$, $0{,}2734$, $0{,}1823$ pour $k = 0, 1, 2, 3$, et la loi de Poisson $0{,}1353$, $0{,}2707$, $0{,}2707$, $0{,}1804$.

        ```schema p-poisson-exp
        Pour $k = 0, \dots, 8$, les bâtons comparent la loi binomiale de paramètres $10$ et $0{,}2$, en vert, et celle de paramètres $100$ et $0{,}02$, en bleu, toutes deux d'espérance $2$, à la loi de Poisson de paramètre $2$, en rouge. À espérance fixée, la loi binomiale se rapproche de la loi de Poisson quand $n$ augmente : pour $n = 100$, l'écart n'est plus visible.
        ```
      - |
        L'absence de mémoire caractérise les durées de vie sans vieillissement, comme celle d'un noyau radioactif : savoir qu'il n'est pas désintégré au temps $s$ ne change rien à la loi de ce qui lui reste à vivre. Elle est l'analogue continu de la loi géométrique du nœud {{p-variables|Variables aléatoires}}.

  - id: p-normale
    etiquette: Loi normale
    nature: théorème
    titre: La loi normale
    texte: |
      La [[loi-normale|loi normale]] $\mathcal N(m, \sigma^2)$, pour $m$ réel et $\sigma > 0$, a pour densité $\dfrac{1}{\sigma\sqrt{2\pi}}\exp\Big(-\dfrac{(x - m)^2}{2\sigma^2}\Big)$. La loi $\mathcal N(0, 1)$ est la loi normale centrée réduite.

      ```schema p-normale
      Les densités de $\mathcal N(0, 1)$ en rouge, $\mathcal N(0, 4)$ en bleu et $\mathcal N(2, \frac14)$ en vert : $m$ place le sommet et $\sigma$ règle la largeur, la hauteur $1/(\sigma\sqrt{2\pi})$ du sommet compensant l'étalement, puisque l'aire totale vaut $1$ pour chacune, ce que montrera (i).
      ```
    enonce: |
      (i) $\displaystyle \int_{\lex{ensemble-reels}{\mathbb R}} e^{-x^2/2}\,dx = \sqrt{2\pi}$ : la loi $\mathcal N(m, \sigma^2)$ est une probabilité.

      (ii) Une variable de loi $\mathcal N(m, \sigma^2)$ a pour espérance $m$ et pour variance $\sigma^2$, et des moments de tout ordre. Si $X$ suit $\mathcal N(0, 1)$, $m + \sigma X$ suit $\mathcal N(m, \sigma^2)$.

      (iii) Si $X$ et $Y$ sont indépendantes, de lois $\mathcal N(0, \alpha)$ et $\mathcal N(0, \beta)$, alors $X + Y$ suit la loi $\mathcal N(0, \alpha + \beta)$.
    preuve: |
      *Préliminaires.* Sur $]{-\frac\pi2}, \frac\pi2[$, $\cos > 0$, puisque $\frac\pi2$ est le plus petit zéro positif de $\cos$ et que $\cos$ est paire ({{cx-pi|Le nombre π}}).

      La fonction $\tan = \sin/\cos$ y est dérivable, de dérivée $1 + \tan^2 > 0$, et tend vers $\pm\infty$ aux bornes, puisque $\sin(\pm\frac\pi2) = \pm 1$ : c'est une bijection croissante sur $\mathbb R$, dont la réciproque $\arctan$ a pour dérivée $\frac{1}{1 + s^2}$. Donc $\int_0^T \frac{ds}{1 + s^2} = \arctan T \to \frac\pi2$.

      Pour les changements de variable affines ou $y = xs$ sur un segment, on dérive les deux membres par rapport à la borne supérieure ({{ar-tfa|Théorème fondamental}}) ; les intégrales sur $[0, +\infty[$ de fonctions continues positives sont des limites d'intégrales sur des segments, par convergence monotone et {{m-riemann|Riemann et Lebesgue}}.

      (i) Soit $J = \int_0^{+\infty} e^{-x^2}\,dx$. Par Tonelli ({{m-fubini|Tonelli, Fubini}}),
      $$J^2 = \int_0^{+\infty}\!\!\int_0^{+\infty} e^{-x^2 - y^2}\,dy\,dx.$$
      Pour $x > 0$ fixé, le changement de variable $y = xs$ donne $\int_0^{+\infty} e^{-x^2(1 + s^2)}\,x\,ds$. En intervertissant à nouveau, et puisque $x e^{-x^2(1+s^2)}$ a pour primitive $-\frac{e^{-x^2(1+s^2)}}{2(1 + s^2)}$,
      $$J^2 = \int_0^{+\infty} \frac{ds}{2(1 + s^2)} = \frac\pi4.$$

      Donc $J = \frac{\sqrt\pi}2$, puis, par parité et le changement de variable $u = \sqrt 2\,x$,
      $$\int_{\mathbb R} e^{-u^2/2}\,du = 2\sqrt 2\,J = \sqrt{2\pi}.$$

      (ii) $|x|^k e^{-x^2/4}$ est borné, d'où l'intégrabilité de $|x|^k e^{-x^2/2}$. Pour $\mathcal N(0, 1)$, l'espérance est nulle par imparité, et l'intégration par parties sur $[-T, T]$, avec $(e^{-x^2/2})' = -xe^{-x^2/2}$, donne $\int x^2 e^{-x^2/2} = \int e^{-x^2/2}$, d'où $E[X^2] = 1$. Le changement de variable affine donne le cas général.

      (iii) La loi du couple a pour densité $f(x)g(y)$ par rapport à $\lambda \otimes \lambda$ ({{p-variables|Variables aléatoires}}, (iii)). Par Tonelli et l'invariance de $\lambda$ par translation ({{m-lebesgue|Mesure de Lebesgue}}),
      $$\begin{aligned} &P(X + Y \leqslant t) \\ &= \int\!\int \mathbf 1_{x \leqslant t - y}f(x)g(y)\,dx\,dy \\ &= \int_{-\infty}^t h(u)\,du, \end{aligned}$$
      avec $h(u) = \int f(u - y)g(y)\,dy$. En complétant le carré,
      $$\begin{aligned} &\frac{(u - y)^2}{\alpha} + \frac{y^2}{\beta} = \frac{u^2}{\alpha + \beta} \\ &\quad + \frac{\alpha + \beta}{\alpha\beta}\Big(y - \frac{\beta u}{\alpha + \beta}\Big)^2, \end{aligned}$$
      et (i), après translation et changement d'échelle, donne
      $$h(u) = \frac{1}{\sqrt{2\pi(\alpha + \beta)}}e^{-u^2/(2(\alpha + \beta))}.$$
    remarques:
      - |
        L'erreur la plus répandue est de croire que deux variables normales ont toujours une somme normale. L'indépendance est essentielle : si $X$ suit $\mathcal N(0, 1)$, $-X$ aussi, mais $X + (-X) = 0$ n'est pas une variable normale.
      - |
        Le calcul de $J$ évite les coordonnées polaires, qui demanderaient la formule du changement de variables en dimension $2$ ; seuls interviennent Tonelli et un changement de variable sur une droite. C'est en cela que l'{{anc|analyse complexe}}, qui fournit $\exp$, $\pi$ et $\arctan$, est un parent de cette branche.

  - id: p-hoeffding
    etiquette: Inégalité de Hoeffding
    nature: théorème
    titre: Moments exponentiels et inégalité de Hoeffding
    enonce: |
      (i) *Chernoff.* Pour toute variable $X$, tout réel $a$ et tout $t > 0$, $P(X \geqslant a) \leqslant e^{-ta}\,E[e^{tX}]$.

      (ii) Si $E[X] = 0$ et $|X| \leqslant 1$, alors $E[e^{tX}] \leqslant \cosh t \leqslant e^{t^2/2}$ pour tout réel $t$, où $\cosh t = \frac12(e^t + e^{-t})$.

      (iii) *Hoeffding.* Si $X_1, \dots, X_n$ sont indépendantes, centrées, à valeurs dans $[-1, 1]$, et $S_n = X_1 + \cdots + X_n$, alors pour tout $a > 0$,
      $$P(S_n \geqslant a) \leqslant e^{-a^2/(2n)}.$$
    preuve: |
      (i) Inégalité de Markov ({{p-esperance|Espérance, variance}}) appliquée à $e^{tX} \geqslant 0$ et à $e^{ta}$, la fonction $\exp$ étant croissante.

      (ii) La fonction $\exp$ est convexe : pour $u < v$ et $\theta \in [0, 1]$, la fonction
      $$\begin{aligned} \varphi(\theta) = {}&(1 - \theta)e^u + \theta e^v \\ &- e^{(1-\theta)u + \theta v} \end{aligned}$$
      est nulle en $0$ et $1$ et de dérivée seconde $-(v - u)^2e^{(1-\theta)u + \theta v} < 0$.

      Si elle prenait une valeur négative, elle atteindrait sur $[0, 1]$ un minimum strictement négatif en un point intérieur $\theta_m$, où $\varphi'(\theta_m) = 0$ ; $\varphi'$ étant décroissante, $\varphi$ décroîtrait sur $[\theta_m, 1]$ ({{ar-deriv|Dérivabilité}}), et $\varphi(1) < 0$, ce qui est absurde.

      Pour $x \in [-1, 1]$, en écrivant $tx = \frac{1 - x}2(-t) + \frac{1 + x}2 t$, on obtient
      $$e^{tx} \leqslant \frac{1 - x}2 e^{-t} + \frac{1 + x}2 e^t,$$
      et en prenant l'espérance, $E[e^{tX}] \leqslant \cosh t$.

      Enfin
      $$\begin{aligned} \cosh t &= \sum_k \frac{t^{2k}}{(2k)!} \\ &\leqslant \sum_k \frac{(t^2/2)^k}{k!} = e^{t^2/2}, \end{aligned}$$
      puisque $(2k)! \geqslant 2^k k!$.

      (iii) Par indépendance ({{p-esperance|Espérance, variance}}, (iv), et regroupement),
      $$E[e^{tS_n}] = \prod_i E[e^{tX_i}] \leqslant e^{nt^2/2}.$$
      Par (i), $P(S_n \geqslant a) \leqslant e^{-ta + nt^2/2}$, et l'on prend $t = a/n$.
    remarques:
      - |
        Pour $n = 100$ et $a = 30$, Hoeffding donne $P(S_n \geqslant 30) \leqslant e^{-4{,}5} \approx 0{,}011$, alors que Bienaymé-Tchebychev ne donne que $\frac{100}{900} \approx 0{,}111$. La décroissance est exponentielle en $a^2/n$, et non polynomiale : c'est ce que gagne l'emploi de $E[e^{tX}]$, qui contrôle tous les moments à la fois.

  - id: p-tcl
    etiquette: Théorème central limite
    nature: théorème
    titre: Théorème central limite (méthode de Lindeberg)
    enonce: |
      Soient $X_1, X_2, \dots$ indépendantes, de même loi, avec $E[X_1] = 0$, $E[X_1^2] = 1$ et $E[|X_1|^3] < +\infty$, et $S_n = X_1 + \cdots + X_n$. Soit $N$ une variable de loi $\mathcal N(0, 1)$.

      (i) Pour toute $f : \lex{ensemble-reels}{\mathbb R} \to \mathbb R$ de classe $C^3$ dont les trois premières dérivées sont bornées,
      $$\begin{aligned} &\Big|E\Big[f\Big(\frac{S_n}{\sqrt n}\Big)\Big] - E[f(N)]\Big| \\ &\leqslant \frac{\|f'''\|_\infty\,\big(E|X_1|^3 + E|N|^3\big)}{6\sqrt n}. \end{aligned}$$

      (ii) Pour tout réel $x$, $P\big(S_n/\sqrt n \leqslant x\big) \to P(N \leqslant x)$.
    preuve: |
      (i) *Taylor.* Pour $f$ de classe $C^3$ et $y, h$ réels,
      $$\begin{aligned} f(y + h) = {}&f(y) + hf'(y) \\ &+ \frac{h^2}2 f''(y) + R, \end{aligned}$$
      avec $|R| \leqslant \|f'''\|_\infty |h|^3/6$.

      En effet, la fonction
      $$\begin{aligned} \varphi(s) = {}&f(y + h) - f(y + s) \\ &- (h - s)f'(y + s) \\ &- \frac{(h - s)^2}2 f''(y + s) \\ &- (h - s)^3K, \end{aligned}$$
      où $K$ est choisi pour que $\varphi(0) = 0$, s'annule aussi en $h$, et $\varphi'(s) = (h - s)^2\big(3K - \frac12 f'''(y + s)\big)$ ; le théorème de Rolle donne $K = f'''(\xi)/6$.

      *Remplacement.* Sur l'espace produit de l'espace de départ et de $(\lex{n-uplet}{\mathbb R^n}, \mathcal N(0, 1)^{\otimes n})$ ({{m-produit|Mesure produit}}), on dispose de variables $Z_1, \dots, Z_n$ de loi $\mathcal N(0, 1)$, indépendantes entre elles et des $X_i$. Par {{p-normale|Loi normale}}, (ii) et (iii), $(Z_1 + \cdots + Z_n)/\sqrt n$ suit la loi $\mathcal N(0, 1)$.

      Posons, pour $0 \leqslant k \leqslant n$,
      $$\begin{aligned} T_k = \frac{1}{\sqrt n}\big(&X_1 + \cdots + X_k \\ &+ Z_{k+1} + \cdots + Z_n\big), \end{aligned}$$
      de sorte que $T_n = S_n/\sqrt n$ et que $T_0$ suit la loi de $N$.

      Avec $W_k = T_k - X_k/\sqrt n = T_{k-1} - Z_k/\sqrt n$, indépendante de $X_k$ et de $Z_k$ ({{p-independance|Indépendance}}, (ii)), la formule de Taylor donne
      $$\begin{aligned} &E[f(T_k)] - E[f(T_{k-1})] \\ &= E\Big[f'(W_k)\frac{X_k - Z_k}{\sqrt n}\Big] \\ &\quad + E\Big[\frac{f''(W_k)}{2}\frac{X_k^2 - Z_k^2}{n}\Big] \\ &\quad + E[R_k - R'_k]. \end{aligned}$$

      Les deux premiers termes sont nuls, par indépendance, puisque $X_k$ et $Z_k$ ont même espérance et même moment d'ordre $2$ ({{p-esperance|Espérance, variance}}, (iv)). Le reste est majoré par
      $$\frac{\|f'''\|_\infty(E|X_1|^3 + E|N|^3)}{6n^{3/2}}.$$
      On somme sur $k$.

      (ii) Soit $h(u) = 1 - 35u^4 + 84u^5 - 70u^6 + 20u^7$ sur $[0, 1]$, prolongée par $1$ sur $]{-\infty}, 0]$ et par $0$ sur $[1, +\infty[$ : elle est de classe $C^3$, ses trois premières dérivées s'annulant en $0$ et en $1$. Pour $\varepsilon > 0$, $f_\varepsilon(y) = h\big((y - x)/\varepsilon\big)$ vérifie $\mathbf 1_{y \leqslant x} \leqslant f_\varepsilon(y) \leqslant \mathbf 1_{y \leqslant x + \varepsilon}$.

      ```schema p-tcl
      La fonction $f_\varepsilon$, en rouge, vaut $1$ jusqu'à $x$ et $0$ à partir de $x + \varepsilon$, et elle décroît entre les deux, puisque $h'(u) = 140u^3(u - 1)^3 \leqslant 0$ sur $[0, 1]$. Elle est donc encadrée par les indicatrices de $]{-\infty}, x]$, en bleu, et de $]{-\infty}, x + \varepsilon]$, en vert, tout en étant de classe $C^3$, ce qui permet de lui appliquer (i).
      ```

      Par (i),
      $$\begin{aligned} &\limsup P(S_n/\sqrt n \leqslant x) \\ &\quad \leqslant E[f_\varepsilon(N)] \leqslant P(N \leqslant x + \varepsilon), \end{aligned}$$
      et de même $\liminf P(S_n/\sqrt n \leqslant x) \geqslant P(N \leqslant x - \varepsilon)$. La fonction de répartition de $N$ est continue, puisque $N$ a une densité : on fait tendre $\varepsilon$ vers $0$.
    remarques:
      - |
        Pour $100$ lancers d'une pièce équilibrée, $P(S \leqslant 55)$ vaut exactement $0{,}86437$ pour la loi binomiale, et l'approximation normale avec correction de continuité, $P(N \leqslant 1{,}1)$, donne $0{,}86433$. C'est le théorème de de Moivre (1733) et Laplace (1812), cas particulier de celui-ci.
      - |
        La méthode est due à Lindeberg (1922) : on remplace les variables une à une par des variables normales, et chaque échange ne coûte qu'un terme d'ordre $n^{-3/2}$. Elle évite les fonctions caractéristiques, qu'introduira l'analyse de Fourier. L'hypothèse $E|X|^3 < +\infty$ simplifie la preuve ; un moment d'ordre $2$ suffit, au prix d'une troncature. Les fonctions caractéristiques en donnent une autre preuve sous la seule hypothèse d'un moment d'ordre $2$, au nœud {{fo-tcl|TCL par Fourier}}.

