# Niveau 1 : structure interne du nœud « Calcul différentiel » (détaché de la géométrie différentielle
# le 28 oct. 2026, à la demande de l'auteur).
# Calcul différentiel dans ℝⁿ : différentielle, accroissements finis, classe Cᵏ, groupe linéaire
# (inversion C^∞ par la comatrice, série de Neumann), inversion locale, submersions, Schwarz et
# intégrales à paramètre. Les normes, leur équivalence en dimension finie et le point fixe de Banach
# sont au graphe « Espaces métriques et normés » (met), parent de celui-ci.
# Les fonctions trigonométriques et l'exponentielle (analyse complexe) ne sont pas des ancêtres de
# ce nœud : les exemples sont polynomiaux ou rationnels.
# Chapitre « Formes quadratiques » (nœud cdiff-quadratiques, sous-graphe contenu/cdiff-quadratiques.yaml,
# 30 oct. 2026), après Schwarz : formes bilinéaires symétriques et formes quadratiques sur un corps où 2 est
# inversible (rang, orthogonalité, bases orthogonales, réduction de Gauss), loi d'inertie de Sylvester et
# signature, formes positives et critère des mineurs, puis formule de Taylor-Young à l'ordre 2, hessienne,
# conditions nécessaires et suffisantes d'extremum local. L'algèbre linéaire n'ayant pas ℝ pour ancêtre, c'est
# ici que les formes quadratiques réelles trouvent leur place, avec leur application aux extremums.

graphe: cdiff
titre: Calcul différentiel
conteneur: cdiff

entrees:
  met: [gd-differentielle, gd-inversion-locale]
  analyse-reelle: [gd-accroissements]
  alglin: [gd-gl]

noeuds:
  - id: gd-differentielle
    etiquette: Différentielle
    nature: définition
    titre: Applications différentiables
    texte: |
      Soit $U$ un ouvert de $\lex{n-uplet}{\mathbb R^n}$, $f : U \to \mathbb R^p$ et $a \in U$. L'application $f$ est [[differentiable]] en $a$ s'il existe $u \in \lex{espace-applications-lineaires}{\mathcal L}(\mathbb R^n, \mathbb R^p)$ et une application $\varepsilon$, définie au voisinage de $0$, nulle et continue en $0$, telles que
      $$f(a + h) = f(a) + u(h) + \|h\|\, \varepsilon(h).$$
      Grâce à l'équivalence des normes, cette condition ne dépend pas des normes choisies. On note $u = df(a)$, la **différentielle** de $f$ en $a$.

      La **dérivée partielle** $\partial_j f(a)$ est, si elle existe, la limite de
      $$\frac{f(a + te_j) - f(a)}{t}$$
      quand $t \to 0$, et la **matrice jacobienne** $J_f(a)$ est la matrice $p \times n$ de coefficients $\partial_j f_i(a)$.
    enonce: |
      (i) Si elle existe, la différentielle est unique, et $f$ est continue en $a$.

      (ii) $f$ est différentiable en $a$ si et seulement si chacune de ses composantes $f_i$ l'est. Les dérivées partielles existent alors, et $df(a)$ a pour matrice $J_f(a)$ : $df(a)(h) = \sum_j h_j\, \partial_j f(a)$. Pour $n = 1$, $f$ est différentiable en $a$ si et seulement si ses composantes sont [[derivable|dérivables]] en $a$, et $df(a)(h) = h f'(a)$.

      (iii) Une application linéaire $u$ est différentiable partout, avec $du(a) = u$. Une application bilinéaire $B : \mathbb R^n \times \mathbb R^m \to \mathbb R^p$ l'est aussi, avec $dB(x, y)(h, k) = B(h, y) + B(x, k)$. La différentielle d'une somme est la somme des différentielles.

      (iv) *Règle de la chaîne.* Si $f$ est différentiable en $a$, à valeurs dans un ouvert $V$ de $\mathbb R^p$, et si $g : V \to \mathbb R^q$ est différentiable en $f(a)$, alors $g \circ f$ est différentiable en $a$ et
      $$d(g \circ f)(a) = dg(f(a)) \circ df(a),$$
      ce qui s'écrit matriciellement $J_{g \circ f}(a) = J_g(f(a))\, J_f(a)$.
    preuve: |
      (i) Si $u$ et $u'$ conviennent, $(u - u')(h) = \|h\|\,\eta(h)$ avec $\eta$ de limite nulle en $0$. Pour $h$ fixé non nul et $t > 0$ petit, la linéarité donne $t\,(u - u')(h) = t\|h\|\,\eta(th)$, donc $(u - u')(h) = \|h\|\,\eta(th)$, qui tend vers $0$ quand $t \to 0$ : $u = u'$. Ensuite $\|f(a + h) - f(a)\| \leqslant \big(|||u||| + \|\varepsilon(h)\|\big)\|h\|$ tend vers $0$.

      (ii) Avec $\|\cdot\|_\infty$ sur $\mathbb R^p$, la condition de différentiabilité pour $f$ équivaut à la conjonction des conditions pour ses $p$ composantes. Si $f$ est différentiable, prenons $h = te_j$ :
      $$\begin{aligned} \frac{f(a + te_j) - f(a)}{t} &= u(e_j) \\ &\quad + \frac{|t|}{t}\|e_j\|\,\varepsilon(te_j), \end{aligned}$$
      qui tend vers $u(e_j)$ ; la $j$-ième colonne de la matrice de $u$ est donc $\partial_j f(a)$.

      Pour $n = 1$, la condition s'écrit $\big(f(a + h) - f(a)\big)/h - v = \pm\varepsilon(h)$ avec $v = u(1)$, c'est-à-dire que le taux d'accroissement tend vers $v$.

      (iii) Pour $u$ linéaire, $\varepsilon = 0$ convient. Pour $B$ bilinéaire,
      $$\begin{aligned} &B(x + h, y + k) - B(x, y) \\ &\quad - B(h, y) - B(x, k) = B(h, k), \end{aligned}$$
      et, en développant sur les bases,
      $$\begin{aligned} \|B(h, k)\| &\leqslant C\,\|h\|_\infty \|k\|_\infty \\ &\leqslant C\,\|(h, k)\|_\infty^2 \end{aligned}$$
      avec $C = \sum_{i,j}\|B(e_i, e_j)\|$, ce qui est de la forme $\|(h, k)\|_\infty\,\varepsilon(h, k)$. L'énoncé sur les sommes est immédiat.

      (iv) Posons $b = f(a)$, $u = df(a)$, $w = dg(b)$, et $k = f(a + h) - b = u(h) + \|h\|\,\varepsilon(h)$. Alors
      $$\begin{aligned} &g(f(a + h)) - g(b) - w(u(h)) \\ &\quad = \|h\|\, w(\varepsilon(h)) + \|k\|\,\eta(k), \end{aligned}$$
      où $\eta$ est l'application associée à $g$ en $b$. On a $\|k\| \leqslant \big(|||u||| + \|\varepsilon(h)\|\big)\|h\|$, et $k \to 0$ quand $h \to 0$, donc $\eta(k) \to 0$. Les deux termes sont de la forme $\|h\|$ fois une quantité qui tend vers $0$.
    remarques:
      - |
        L'erreur la plus répandue est de croire que l'existence des dérivées partielles entraîne la différentiabilité. La fonction $f(x, y) = xy/(x^2 + y^2)$, prolongée par $f(0, 0) = 0$, a des dérivées partielles nulles en $(0, 0)$, puisqu'elle est nulle sur les deux axes ; pourtant $f(t, t) = 1/2$ pour tout $t \neq 0$, si bien que $f$ n'est même pas continue en $(0, 0)$.

        ```schema gd-differentielle
        Sur la droite $y = mx$ privée de l'origine, $f$ vaut constamment $m/(1 + m^2)$ : ce sont les valeurs inscrites au bout des droites, positives en rouge, négatives en bleu. Les axes, en gris, portent la valeur $0$, d'où les dérivées partielles nulles en $(0, 0)$ ; mais les valeurs $1/2$ et $-1/2$ sont prises arbitrairement près de l'origine, cerclée, où $f$ vaut $0$, ce qui interdit la continuité.
        ```
      - |
        Le point (ii) relie la différentielle à la dérivée du nœud {{ar-deriv|Dérivabilité}} : en dimension $1$, la différentielle est l'application linéaire $h \mapsto h f'(a)$, et la dérivée est sa matrice $1 \times 1$.

  - id: gd-accroissements
    etiquette: Accroissements finis
    nature: théorème
    titre: Inégalité des accroissements finis
    enonce: |
      (i) *Égalité des accroissements finis.* Si $f : [a, b] \to \lex{ensemble-reels}{\mathbb R}$ est continue, dérivable sur $]a, b[$, et $a < b$, il existe $c \in \,]a, b[$ tel que $f(b) - f(a) = f'(c)(b - a)$.

      (ii) *Inégalité.* Soit $U$ un ouvert convexe de $\lex{n-uplet}{\mathbb R^n}$, muni d'une norme, et $f : U \to \mathbb R^p$ différentiable, $\mathbb R^p$ étant muni de $\|\cdot\|_\infty$. Si $|||df(z)||| \leqslant M$ pour tout $z \in U$, alors $\|f(y) - f(x)\|_\infty \leqslant M\, \|y - x\|$ pour tous $x, y \in U$.

      (iii) Si $U$ est un ouvert [[connexe]] et si $df(z) = 0$ pour tout $z \in U$, alors $f$ est constante.
    preuve: |
      (i) C'est le théorème {{de-taf|Égalité des accroissements finis}} du chapitre {{ar-deriv|Dérivabilité}}, rappelé ici parce que (ii) l'applique coordonnée par coordonnée.

      (ii) Soient $x, y \in U$ et $i$ fixé. L'ensemble des $t$ tels que $x + t(y - x) \in U$ est un ouvert de $\mathbb R$ contenant $[0, 1]$, par convexité. Sur cet ouvert, $\varphi(t) = f_i\big(x + t(y - x)\big)$ est dérivable, de dérivée $df_i(x + t(y - x))(y - x)$, par la règle de la chaîne ({{gd-differentielle|Différentielle}}, (ii) et (iv)).

      Par (i), il existe $c$ tel que $f_i(y) - f_i(x) = df_i(z)(y - x)$, avec $z = x + c(y - x)$. Ce nombre est la $i$-ième coordonnée de $df(z)(y - x)$, donc
      $$\begin{aligned} |f_i(y) - f_i(x)| &\leqslant \|df(z)(y - x)\|_\infty \\ &\leqslant M\|y - x\|. \end{aligned}$$
      On prend le maximum sur $i$.

      (iii) Fixons $a \in U$ et $A = \{x \in U : f(x) = f(a)\}$, qui est non vide. $A$ est fermé dans $U$, comme image réciproque d'un singleton, fermé dans l'espace séparé $\mathbb R^p$, par l'application continue $f$.

      Tout point $x$ de $U$ est le centre d'une boule $B(x, r) \subset U$, qui est convexe par l'inégalité triangulaire ; par (ii) avec $M = 0$, $f$ est constante sur cette boule. Donc $A$ et $U \setminus A$ sont ouverts, et la connexité de $U$ donne $A = U$.
    remarques:
      - |
        L'erreur la plus répandue est d'écrire une **égalité** des accroissements finis pour une fonction à valeurs vectorielles. Pour $f(t) = (t^2, t^3)$ sur $[0, 1]$, il faudrait $c$ tel que $(1, 1) = (2c, 3c^2)$ ; la première coordonnée impose $c = 1/2$, la seconde $c = 1/\sqrt 3$. Chaque coordonnée a son propre point $c$, et seule l'inégalité survit.

  - id: gd-classe-ck
    etiquette: Classe Cᵏ
    nature: théorème
    titre: Fonctions de classe Cᵏ
    texte: |
      Soit $U$ un ouvert de $\lex{n-uplet}{\mathbb R^n}$. Une application $f : U \to \mathbb R^p$ est [[classe-ck|de classe $C^1$]] si elle est différentiable en tout point et si $df : U \to \lex{espace-applications-lineaires}{\mathcal L}(\mathbb R^n, \mathbb R^p)$ est continue, cet espace étant muni de sa topologie d'espace de dimension finie.

      Par récurrence, $f$ est de classe $C^{k+1}$ si elle est de classe $C^1$ et si $df$, vue comme application à valeurs dans $\mathbb R^{pn}$, est de classe $C^k$ ; elle est de classe $C^\infty$ si elle est de classe $C^k$ pour tout $k$. La classe $C^0$ est celle des applications continues.
    enonce: |
      (i) $f$ est de classe $C^1$ si et seulement si toutes les dérivées partielles $\partial_j f_i$ existent et sont continues sur $U$.

      (ii) Les applications linéaires et bilinéaires sont de classe $C^\infty$. Une application est de classe $C^k$ si et seulement si ses composantes le sont, et une somme d'applications de classe $C^k$ l'est.

      (iii) Pour $k \in \lex{ensemble-entiers-naturels}{\mathbb N} \cup \{\infty\}$, la composée de deux applications de classe $C^k$ est de classe $C^k$. En particulier, les produits de fonctions réelles de classe $C^k$ et les fonctions polynomiales de $n$ variables sont de classe $C^k$, respectivement $C^\infty$.
    preuve: |
      (i) Si $f$ est de classe $C^1$, $\partial_j f(x) = df(x)(e_j)$ est continue en $x$, comme composée de $df$ et de l'évaluation en $e_j$, qui est linéaire.

      Réciproquement, il suffit de traiter le cas $p = 1$ ({{gd-differentielle|Différentielle}}, (ii)). Soit $a \in U$, $r > 0$ tel que $B_\infty(a, r) \subset U$, et $h$ tel que $\|h\|_\infty < r$. Posons $a^{(0)} = a$ et $a^{(j)} = a + h_1e_1 + \cdots + h_je_j$, points du cube $B_\infty(a, r)$.

      La fonction $t \mapsto f(a^{(j-1)} + te_j)$ a pour dérivée $\partial_j f(a^{(j-1)} + te_j)$ ; l'égalité des accroissements finis ({{gd-accroissements|Accroissements finis}}, (i)) donne un point $c_j$ du segment $[a^{(j-1)}, a^{(j)}]$ tel que
      $$f(a^{(j)}) - f(a^{(j-1)}) = h_j\,\partial_j f(c_j),$$
      ce qui vaut encore si $h_j = 0$.

      ```schema gd-classe-ck
      Pour $n = 2$, le chemin de $a$ à $a + h$ suit les axes, d'abord $h_1e_1$ puis $h_2e_2$, sans emprunter la diagonale en pointillé, et reste dans le cube $B_\infty(a, r)$. Les points $c_1$ et $c_2$, placés ici pour $f(x, y) = x^3 + y^3$, $a = 0$ et $h = (1, 3/4)$, sont ceux que fournissent les accroissements finis sur chacun des deux pas ; ils sont à distance au plus $\|h\|_\infty$ de $a$.
      ```

      En sommant,
      $$\begin{aligned} &\Big|f(a + h) - f(a) \\ &\quad - \sum_j h_j\,\partial_j f(a)\Big| \leqslant \|h\|_\infty\, \rho(h), \end{aligned}$$
      où $\rho(h) = \sum_j \big|\partial_j f(c_j) - \partial_j f(a)\big|$ tend vers $0$ avec $h$, puisque $\|c_j - a\|_\infty \leqslant \|h\|_\infty$ et que les dérivées partielles sont continues en $a$. Donc $f$ est différentiable en $a$, et $df$ est continue puisque les coefficients de sa matrice le sont.

      (ii) Une application linéaire a une différentielle constante, donc de classe $C^\infty$. Pour $B$ bilinéaire, $dB(x, y)$ dépend linéairement de $(x, y)$ ({{gd-differentielle|Différentielle}}, (iii)) : $dB$ est linéaire, donc $C^\infty$, et $B$ aussi. La matrice de $df$ a pour lignes celles des $df_i$, et $d(f + g) = df + dg$ ; on conclut par récurrence sur $k$.

      (iii) Montrons par récurrence sur $k \in \mathbb N$ l'énoncé : pour toutes $f : U \to V$ et $g : V \to \mathbb R^q$ de classe $C^k$, $g \circ f$ est de classe $C^k$. Pour $k = 0$, c'est la continuité d'une composée.

      Supposons-le pour $k$, et soient $f, g$ de classe $C^{k+1}$. Par la règle de la chaîne,
      $$d(g \circ f)(x) = c\big(dg(f(x)),\, df(x)\big),$$
      où $c(A, B) = AB$ est le produit matriciel, bilinéaire donc $C^\infty$.

      Par hypothèse de récurrence, $dg \circ f$ est de classe $C^k$, puis $x \mapsto \big(dg(f(x)), df(x)\big)$ l'est par (ii), et sa composée avec $c$ aussi. Donc $d(g \circ f)$ est de classe $C^k$, et $g \circ f$ de classe $C^{k+1}$. Le cas $k = \infty$ s'en déduit.

      Le produit de $f$ et $g$ réelles est la composée de $x \mapsto (f(x), g(x))$ et de la multiplication, bilinéaire ; les polynômes s'obtiennent à partir des projections, linéaires, par sommes et produits.
    remarques:
      - |
        Dans (i), la continuité des dérivées partielles ne peut pas être omise : l'exemple $xy/(x^2 + y^2)$ du nœud {{gd-differentielle|Différentielle}} a des dérivées partielles en tout point, sans même être continu à l'origine.
      - |
        La classe $C^\infty$ est celle qu'adopteront les variétés. On pourrait travailler en classe $C^k$ avec $k \geqslant 1$ fixé ; Whitney a montré en 1936 que toute variété de classe $C^k$, $k \geqslant 1$, porte une structure $C^\infty$ compatible, de sorte que le choix de $C^\infty$ ne restreint pas la théorie.

  - id: gd-gl
    etiquette: Groupe linéaire
    nature: proposition
    titre: Le groupe linéaire et l'inversion des matrices
    texte: |
      Une matrice $A \in \lex{espace-matrices}{\mathcal M_n}(\lex{ensemble-reels}{\mathbb R})$ est inversible s'il existe $B$ telle que $AB = BA = I_n$ ; c'est le cas si et seulement si l'endomorphisme $x \mapsto Ax$ est bijectif, c'est-à-dire si et seulement si $\det A \neq 0$ ({{v-det-matrice|Déterminant d'une matrice}}, (ii)).

      Les matrices inversibles forment un groupe pour le produit, le [[groupe-lineaire|groupe linéaire]] $\lex{groupe-lineaire}{GL_n}(\mathbb R)$. On munit $\mathcal M_n(\mathbb R) \cong \lex{espace-applications-lineaires}{\mathcal L}(\lex{n-uplet}{\mathbb R^n})$ de la norme subordonnée $|||\cdot|||$ à une norme de $\mathbb R^n$.
    enonce: |
      (i) *Série de Neumann.* Si $|||H||| < 1$, la série $\sum_{m \geqslant 0} H^m$ converge, $I - H$ est inversible, d'inverse sa somme, et $|||(I - H)^{-1}||| \leqslant \dfrac{1}{1 - |||H|||}$.

      (ii) $GL_n(\mathbb R)$ est un ouvert de $\mathcal M_n(\mathbb R)$.

      (iii) L'application $\mathrm{inv} : A \mapsto A^{-1}$ est de classe $C^\infty$ sur $GL_n(\mathbb R)$, et
      $$d\,\mathrm{inv}(A)(H) = -A^{-1} H A^{-1}.$$
    preuve: |
      (i) Soit $S_m = \sum_{j=0}^m H^j$. Pour $q > m$,
      $$\begin{aligned} |||S_q - S_m||| &\leqslant \sum_{j=m+1}^q |||H|||^j \\ &\leqslant \frac{|||H|||^{m+1}}{1 - |||H|||}, \end{aligned}$$
      qui tend vers $0$ ; la suite $(S_m)$ est de Cauchy, donc converge vers une matrice $S$, l'espace $\mathcal M_n(\mathbb R)$ étant complet ({{gd-equivalence|Équivalence des normes}}).

      On a $(I - H)S_m = S_m(I - H) = I - H^{m+1}$, qui tend vers $I$ ; la multiplication par une matrice fixée étant linéaire, donc continue, $(I - H)S = S(I - H) = I$. Enfin $|||S_m||| \leqslant 1/(1 - |||H|||)$ pour tout $m$, et l'inégalité passe à la limite.

      (ii) Le déterminant est une fonction polynomiale des $n^2$ coefficients, donc continue ({{gd-classe-ck|Classe Cᵏ}}, (iii)), et $GL_n(\mathbb R)$ est l'image réciproque par $\det$ de l'ouvert $\mathbb R \setminus \{0\}$.

      (iii) La fonction $r(t) = 1/t$ est dérivable sur $\mathbb R \setminus \{0\}$, de dérivée $-r^2$, puisque son taux d'accroissement $-1/\big(t(t + h)\big)$ tend vers $-1/t^2$. Si $r$ est de classe $C^k$, sa dérivée $-r^2$ l'est aussi, comme produit, donc $r$ est de classe $C^{k+1}$ : $r$ est $C^\infty$.

      Par la formule de la comatrice ({{v-comatrice|Comatrice}}), le coefficient $(i, j)$ de $A^{-1}$ est $r(\det A)\, C_{ji}(A)$, produit de deux fonctions $C^\infty$ de $A$, le cofacteur étant polynomial : $\mathrm{inv}$ est de classe $C^\infty$.

      Enfin $A \cdot \mathrm{inv}(A) = I$ est constante sur $GL_n(\mathbb R)$ ; en différentiant ce produit, qui est bilinéaire ({{gd-differentielle|Différentielle}}, (iii) et (iv)), on obtient
      $$H A^{-1} + A\, d\,\mathrm{inv}(A)(H) = 0,$$
      d'où la formule.
    remarques:
      - |
        Pour $n = 1$, la formule redonne la dérivée $-h/a^2$ de $x \mapsto 1/x$. L'erreur la plus répandue est d'écrire $-A^{-2}H$ : le produit des matrices n'étant pas commutatif, $H$ reste pris entre les deux facteurs $A^{-1}$.
      - |
        La série de Neumann donne davantage que le déterminant : un rayon explicite. Si $A$ est inversible et $|||H||| < 1/|||A^{-1}|||$, alors $A + H = A(I + A^{-1}H)$ est inversible par (i). C'est cette forme quantitative qu'emploie l'inversion locale, et elle vaut en dimension infinie, dans les espaces de Banach, où le déterminant n'a plus de sens.

  - id: gd-inversion-locale
    etiquette: Inversion locale
    nature: théorème
    titre: Théorème d'inversion locale
    texte: |
      Soient $U$ et $V$ deux ouverts de $\lex{n-uplet}{\mathbb R^n}$ et $k \geqslant 1$, éventuellement infini. Un [[diffeomorphisme|$C^k$-difféomorphisme]] de $U$ sur $V$ est une bijection $f : U \to V$ de classe $C^k$ dont la réciproque est de classe $C^k$.
    enonce: |
      Soit $U$ un ouvert de $\mathbb R^n$, $f : U \to \mathbb R^n$ de classe $C^k$ avec $k \geqslant 1$, et $a \in U$ tel que $df(a)$ soit inversible. Il existe un ouvert $V \subset U$ contenant $a$ et un ouvert $W$ contenant $f(a)$ tels que $f$ induise un $C^k$-difféomorphisme de $V$ sur $W$. De plus, $d(f^{-1})(y) = df\big(f^{-1}(y)\big)^{-1}$ pour $y \in W$.
    preuve: |
      *Réduction.* Soit $L = df(a)$. L'application $\tilde f(x) = L^{-1}\big(f(a + x) - f(a)\big)$ est de classe $C^k$ sur $U - a$, avec $\tilde f(0) = 0$ et $d\tilde f(0) = I$, et $f$ s'en déduit par composition avec les difféomorphismes affines $x \mapsto x - a$ et $y \mapsto f(a) + Ly$. On suppose donc $a = 0$, $f(0) = 0$, $df(0) = I$, et l'on munit $\mathbb R^n$ de $\|\cdot\|_\infty$.

      *Étape 1.* Posons $g(x) = x - f(x)$, de classe $C^k$, avec $dg(0) = 0$. Par continuité de $dg$, il existe $r > 0$ tel que $B(0, 2r) \subset U$ et $|||dg(x)||| \leqslant \frac12$ sur $B(0, 2r)$. Cette boule est convexe ; l'inégalité des accroissements finis ({{gd-accroissements|Accroissements finis}}, (ii)) y donne $\|g(x) - g(x')\| \leqslant \frac12\|x - x'\|$.

      *Étape 2.* Soit $y$ tel que $\|y\| < r/2$, et $\varphi_y(x) = y + g(x)$. Pour $\|x\| \leqslant r$, on a
      $$\|\varphi_y(x)\| \leqslant \|y\| + \|g(x) - g(0)\| \leqslant r.$$
      Ainsi $\varphi_y$ envoie la boule fermée $\bar B(0, r)$, qui est fermée, dans elle-même, et elle est contractante de rapport $\frac12$.

      Par le théorème du point fixe ({{gd-point-fixe|Point fixe}}), il existe un unique $x \in \bar B(0, r)$ tel que $\varphi_y(x) = x$, c'est-à-dire $f(x) = y$ ; de plus $\|x\| \leqslant \|y\| + \frac12\|x\|$, donc $\|x\| \leqslant 2\|y\| < r$.

      Posons $W = B(0, r/2)$ et $V = B(0, r) \cap f^{-1}(W)$, ouvert contenant $0$. Par ce qui précède, $f : V \to W$ est surjective. Elle est injective : si $f(x) = f(x')$, alors $x - x' = g(x) - g(x')$, de norme au plus $\frac12\|x - x'\|$, donc $x = x'$.

      *Étape 3.* Soit $h : W \to V$ la réciproque. Pour $x, x' \in V$,
      $$\begin{aligned} \|x - x'\| &\leqslant \|f(x) - f(x')\| \\ &\quad + \|g(x) - g(x')\| \\ &\leqslant \|f(x) - f(x')\| + \frac12\|x - x'\|, \end{aligned}$$
      d'où $\|h(y) - h(y')\| \leqslant 2\|y - y'\|$ : $h$ est continue.

      *Étape 4.* Pour $x \in V$, $df(x) = I - dg(x)$ est inversible par la série de Neumann ({{gd-gl|Groupe linéaire}}, (i)).

      Soit $y \in W$, $x = h(y)$, $k$ petit et $u = h(y + k) - x$, de sorte que $\|u\| \leqslant 2\|k\|$. Alors
      $$\begin{aligned} k &= f(x + u) - f(x) \\ &= df(x)u + \|u\|\,\varepsilon(u), \end{aligned}$$
      d'où
      $$\begin{aligned} &h(y + k) - h(y) - df(x)^{-1}k \\ &\quad = -\|u\|\, df(x)^{-1}\varepsilon(u), \end{aligned}$$
      de norme au plus $2\|k\|\;|||df(x)^{-1}|||\;\|\varepsilon(u)\|$. Comme $u \to 0$ quand $k \to 0$, par continuité de $h$, $h$ est différentiable en $y$ et $dh(y) = df(h(y))^{-1}$.

      *Étape 5.* On a donc $dh = \mathrm{inv} \circ df \circ h$. Si $h$ est de classe $C^j$ avec $j < k$, alors $df \circ h$ est de classe $C^j$, puisque $df$ est de classe $C^{k-1}$ et $j \leqslant k - 1$ ; $\mathrm{inv}$ étant $C^\infty$, $dh$ est de classe $C^j$ ({{gd-classe-ck|Classe Cᵏ}}, (iii)), et $h$ de classe $C^{j+1}$. Partant de $j = 0$, on atteint $j = k$, ou toute valeur de $j$ si $k = \infty$.
    remarques:
      - |
        Le théorème est local et ne se globalise pas. Pour $f(x, y) = (x^2 - y^2, 2xy)$, qui est $z \mapsto z^2$ lue dans $\mathbb R^2$, la matrice jacobienne $\begin{pmatrix} 2x & -2y \\ 2y & 2x \end{pmatrix}$ est injective dès que $(x, y) \neq (0, 0)$, mais $f(-x, -y) = f(x, y)$ : $f$ est un difféomorphisme local en tout point de $\mathbb R^2 \setminus \{0\}$ sans être injective sur cet ouvert.
      - |
        L'inversibilité de $df(a)$ est nécessaire pour que la réciproque soit différentiable. L'application $x \mapsto x^3$ est un homéomorphisme de $\lex{ensemble-reels}{\mathbb R}$, de classe $C^\infty$, mais si sa réciproque $h$ était dérivable en $0$, la règle de la chaîne appliquée à $h(x^3) = x$ donnerait $1 = h'(0) \cdot 0$.

  - id: gd-submersions
    etiquette: Submersions
    nature: théorème
    titre: Forme locale des submersions et fonctions implicites
    texte: |
      Une application $F : U \to \mathbb R^q$ de classe $C^k$ sur un ouvert $U$ de $\lex{n-uplet}{\mathbb R^n}$ est une [[submersion]] en $a$ si $dF(a)$ est surjective, ce qui impose $q \leqslant n$.
    enonce: |
      (i) *Forme locale.* Si $F$ est de classe $C^k$, $k \geqslant 1$, et si $dF(a)$ est surjective, il existe un ouvert $V$ contenant $a$ et un $C^k$-difféomorphisme $\Phi$ de $V$ sur un ouvert de $\mathbb R^{n-q} \times \mathbb R^q$ tels que $F(x) = F(a) + \pi(\Phi(x))$ sur $V$, où $\pi(z', z'') = z''$.

      (ii) *Fonctions implicites.* Soit $U$ un ouvert de $\mathbb R^m \times \mathbb R^q$, $F : U \to \mathbb R^q$ de classe $C^k$, et $(a, b) \in U$ tel que $F(a, b) = 0$ et que la différentielle partielle $\partial_y F(a, b) : \ell \mapsto dF(a, b)(0, \ell)$ soit inversible. Il existe un ouvert $A$ de $\mathbb R^m$ contenant $a$, un ouvert $V$ contenant $(a, b)$ et une application $\varphi : A \to \mathbb R^q$ de classe $C^k$ tels que, pour $(x, y) \in V$,
      $$\begin{aligned} &F(x, y) = 0 \\ &\iff \big(x \in A \text{ et } y = \varphi(x)\big). \end{aligned}$$
    preuve: |
      (i) Le noyau $K$ de $dF(a)$ est de dimension $n - q$, par le théorème du rang. Complétons une base $(v_1, \dots, v_{n-q})$ de $K$ en une base de $\mathbb R^n$ ({{v-dimension|Dimension}}, (iii)), et soit $L : \mathbb R^n \to \mathbb R^{n-q}$ l'application qui associe à $x$ ses $n - q$ premières coordonnées dans cette base ; elle est linéaire, et sa restriction à $K$ est bijective.

      Posons $\Phi(x) = \big(L(x), F(x) - F(a)\big)$, de classe $C^k$, avec $d\Phi(a)h = \big(Lh, dF(a)h\big)$. Si $d\Phi(a)h = 0$, alors $h \in K$ et $Lh = 0$, donc $h = 0$ : $d\Phi(a)$ est injective, donc inversible. Le théorème d'inversion locale ({{gd-inversion-locale|Inversion locale}}) fournit $V$, et $\pi \circ \Phi = F - F(a)$ par construction.

      (ii) Posons $\Phi(x, y) = \big(x, F(x, y)\big)$. Alors
      $$\begin{aligned} d\Phi(a, b)(h, \ell) &= \big(h,\, dF(a, b)(h, 0) \\ &\qquad + \partial_y F(a, b)\ell\big)\,; \end{aligned}$$
      s'il est nul, $h = 0$ puis $\partial_y F(a, b)\ell = 0$, donc $\ell = 0$.

      Par inversion locale, $\Phi$ induit un difféomorphisme d'un ouvert $V \ni (a, b)$ sur un ouvert $W \ni (a, 0)$, de réciproque de la forme $\Psi(x, z) = \big(x, \psi(x, z)\big)$ puisque $\Phi$ conserve la première composante.

      Soit $A = \{x : (x, 0) \in W\}$, ouvert comme image réciproque de $W$ par l'application continue $x \mapsto (x, 0)$, et $\varphi(x) = \psi(x, 0)$, de classe $C^k$. Pour $(x, y) \in V$, $F(x, y) = 0$ équivaut à $\Phi(x, y) = (x, 0)$, c'est-à-dire à $(x, 0) \in W$ et $(x, y) = \Psi(x, 0) = (x, \varphi(x))$.
    remarques:
      - |
        Pour $F(x, y) = x^2 + y^2 - 1$ au point $(0, 1)$, $\partial_y F = 2y$ vaut $2$, et l'équation définit localement $y = \sqrt{1 - x^2}$. Au point $(1, 0)$, $\partial_y F$ s'annule, et en effet $y$ n'est fonction de $x$ sur aucun voisinage ; mais $\partial_x F = 2 \neq 0$, et c'est $x$ qui s'exprime en fonction de $y$.

        ```schema gd-submersions
        Dans la boîte bleue, chaque verticale coupe le cercle une seule fois : le cercle y est le graphe de $x \mapsto \sqrt{1 - x^2}$. Près de $(1, 0)$, la verticale $x = 4/5$ le coupe aux deux points $(4/5, 3/5)$ et $(4/5, -3/5)$, si bien que $y$ n'y est pas fonction de $x$ ; dans la boîte verte, le cercle est en revanche le graphe de $y \mapsto \sqrt{1 - y^2}$, au-dessus de l'axe des $y$.
        ```
      - |
        La forme locale (i) dit que, vue dans de bonnes coordonnées, une submersion est une projection. C'est exactement ce qui permettra de « redresser » les ensembles de niveau en sous-espaces affines au nœud suivant.

  - id: gd-schwarz
    etiquette: Schwarz, intégrales à paramètre
    nature: théorème
    titre: Théorème de Schwarz et intégrales à paramètre
    enonce: |
      (i) *Schwarz.* Si $f : U \to \lex{ensemble-reels}{\mathbb R}$ est de classe $C^2$ sur un ouvert $U$ de $\lex{n-uplet}{\mathbb R^n}$, alors $\partial_i\partial_j f = \partial_j\partial_i f$ pour tous $i, j$.

      (ii) *Intégrales à paramètre.* Soit $h : [0, 1] \times U \to \mathbb R$ continue. Alors
      $$F(x) = \int_0^1 h(t, x)\,dt$$
      est continue sur $U$. Si de plus les dérivées partielles $\partial_{x_j} h$ existent et sont continues sur $[0, 1] \times U$, $F$ est de classe $C^1$ et
      $$\partial_j F(x) = \int_0^1 \partial_{x_j} h(t, x)\,dt.$$
      Par récurrence, si $h$ est $C^\infty$ en $x$ avec toutes ses dérivées partielles continues sur $[0, 1] \times U$, $F$ est $C^\infty$.
    preuve: |
      (ii) *Continuité.* Fixons $x_0 \in U$ et $\varepsilon > 0$. Les ouverts produits $V \times W$ de $\mathbb R \times U$ sur lesquels $|h(t, x) - h(t', x_0)| < \varepsilon$ pour tous $(t, x) \in V \times W$ et $(t', x_0) \in V \times W$ recouvrent le compact $[0, 1] \times \{x_0\}$, par continuité de $h$ ; un nombre fini d'entre eux, $V_1 \times W_1, \dots, V_m \times W_m$, suffit, et l'on pose $W = \bigcap_i W_i$.

      Pour $x \in W$ et $t \in [0, 1]$, $t$ appartient à un $V_i$, et $|h(t, x) - h(t, x_0)| < \varepsilon$. Donc $|F(x) - F(x_0)| \leqslant \varepsilon$. Aucun choix n'intervient : la famille des ouverts est définie par compréhension, et l'on n'en extrait qu'un nombre fini.

      *Dérivation.* Par l'égalité des accroissements finis ({{gd-accroissements|Accroissements finis}}, (i)), pour $s \neq 0$ petit,
      $$\begin{aligned} &\frac{h(t, x_0 + se_j) - h(t, x_0)}{s} \\ &\quad = \partial_{x_j} h(t, x_0 + c\,s\,e_j) \end{aligned}$$
      avec $c \in \,]0, 1[$ dépendant de $t$.

      Le même argument de recouvrement, appliqué à $\partial_{x_j} h$, montre que cette quantité est à moins de $\varepsilon$ de $\partial_{x_j} h(t, x_0)$ dès que $|s|$ est petit, uniformément en $t$. On intègre, puis on applique la continuité à $\partial_{x_j} h$ et le nœud {{gd-classe-ck|Classe Cᵏ}}, (i).

      (i) Fixons $a$, et posons, pour $s$ petit,
      $$\begin{aligned} \Delta(s) &= f(a + se_i + se_j) - f(a + se_i) \\ &\quad - f(a + se_j) + f(a), \end{aligned}$$
      avec $i \neq j$.

      La fonction $g(u) = f(u + se_j) - f(u)$ donne $\Delta(s) = g(a + se_i) - g(a)$ ; par l'égalité des accroissements finis appliquée deux fois, d'abord à $\tau \mapsto g(a + \tau e_i)$, puis à $\tau \mapsto \partial_i f(a + c\,s\,e_i + \tau e_j)$, on obtient
      $$\Delta(s) = s^2\,\partial_j\partial_i f(a + c\,s\,e_i + c'\,s\,e_j)$$
      pour des $c, c' \in \,]0, 1[$.

      En échangeant les rôles de $i$ et $j$, $\Delta(s) = s^2\,\partial_i\partial_j f(a + d\,s\,e_i + d'\,s\,e_j)$. On divise par $s^2$ et l'on fait tendre $s$ vers $0$ : les deux dérivées secondes étant continues en $a$, elles y sont égales.

      ```schema gd-schwarz
      Les quatre sommets du carré de côté $s$ entrent dans $\Delta(s)$ avec les signes indiqués. Chacune des deux applications des accroissements finis fournit un point du carré où la dérivée croisée vaut $\Delta(s)/s^2$ : en rouge pour $\partial_j\partial_i f$, en bleu pour $\partial_i\partial_j f$. Ils sont placés ici pour $f(x, y) = xy(x - y)^2 + xy$, $a = 0$ et $s = 1$ (ces points ne sont pas uniques, on en a retenu un), et ils tendent tous deux vers $a$ avec $s$.
      ```
    remarques:
      - |
        L'hypothèse de continuité des dérivées secondes ne peut pas être omise. La fonction
        $$f(x, y) = xy\frac{x^2 - y^2}{x^2 + y^2},$$
        prolongée par $0$ en l'origine, a des dérivées secondes croisées en $(0, 0)$ qui valent $-1$ et $1$ : on calcule $\partial_x f(0, y) = -y$ et $\partial_y f(x, 0) = x$. Le théorème de Schwarz est ce qui donnera $d \circ d = 0$ au nœud {{gd-formes|Formes différentielles}}.
      - |
        Le théorème de Schwarz rend symétrique la matrice des dérivées secondes, ce qu'on appellera la matrice hessienne. Toute matrice carrée définit une forme quadratique ; c'est la symétrie qui fait de la hessienne la matrice de sa forme polaire, et permet de lire sur ses coefficients la forme dont le signe décide des extremums, au chapitre {{cdiff-quadratiques|Formes quadratiques}}.

  - id: cdiff-quadratiques
    etiquette: Formes quadratiques
    nature: chapitre
    titre: Formes quadratiques et extremums
    sous: cdiff-quadratiques
    texte: |
      Une forme quadratique est une application $q(x) = b(x, x)$, où $b$ est une forme bilinéaire, que l'on peut prendre symétrique dès que $2$ est inversible dans le corps de base. Le chapitre en établit d'abord la théorie algébrique sur un tel corps : polarisation, matrice et congruence, rang et noyau, orthogonalité, existence d'une base orthogonale, et réduction de Gauss en une somme de carrés de formes linéaires indépendantes. Quand tout élément du corps est un carré, le rang classe les formes.

      Sur $\lex{ensemble-reels}{\mathbb R}$, la loi d'inertie de Sylvester montre que les nombres de carrés positifs et négatifs ne dépendent pas de la réduction : la signature classe les formes quadratiques réelles. Viennent ensuite les formes positives, l'inégalité de Cauchy-Schwarz, et le critère des mineurs principaux pour reconnaître une matrice définie positive.

      Le chapitre est placé dans le calcul différentiel parce que l'algèbre linéaire n'a pas $\mathbb R$ pour ancêtre, et parce que son application justifie la théorie réelle : la formule de Taylor-Young à l'ordre $2$ fait apparaître la forme hessienne d'une fonction de classe $C^2$, dont la signature décide, en un point critique, s'il y a un minimum, un maximum ou un col. Aucune forme du choix n'intervient.

