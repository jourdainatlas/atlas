# Niveau 1 : structure interne du nœud « Théorie de Galois ».
# Extensions et degrés, éléments algébriques et polynôme minimal, corps de décomposition,
# séparabilité, lemme de Dedekind et théorème d'Artin, extensions galoisiennes, théorème
# fondamental, corps finis, groupes résolubles (Lagrange, Cauchy, non-résolubilité de 𝔖ₙ),
# résolubilité par radicaux (sens direct de Galois, en caractéristique nulle), critère
# d'Eisenstein et polynôme X⁵ − 4X + 2 non résoluble par radicaux.
# Parents : algèbre linéaire (dimension), ℂ (racines, conjugaison), analyse réelle (valeurs
# intermédiaires et Rolle pour compter les racines réelles de l'exemple).

graphe: galois
titre: Théorie de Galois
conteneur: galois

entrees:
  alglin: [gs-extensions]
  c: [gs-abel-ruffini]
  analyse-reelle: [gs-abel-ruffini]

noeuds:
  - id: gs-extensions
    etiquette: Extensions, degré
    nature: théorème
    titre: Extensions de corps et multiplicativité des degrés
    texte: |
      Une [[extension-corps|extension]] $L/K$ est la donnée d'un [[corps]] $L$ et d'un sous-corps $K$ ; $L$ est alors un $K$-espace vectoriel, et le **degré** $[L:K]$ est sa [[dimension]], finie ou non. L'extension est **finie** si son degré l'est. Pour $\alpha_1, \dots, \alpha_n \in L$, $\lex{corps-engendre}{K(\alpha_1, \dots, \alpha_n)}$ désigne le plus petit sous-corps de $L$ contenant $K$ et les $\alpha_i$, intersection des sous-corps qui les contiennent.
    enonce: |
      *Multiplicativité.* Si $K \subset M \subset L$, avec $(m_i)$ une base de $M$ sur $K$ et $(l_j)$ une base de $L$ sur $M$, la famille $(m_il_j)$ est une base de $L$ sur $K$. En particulier $[L:K] = [L:M]\,[M:K]$ quand ces degrés sont finis, et $[M:K]$ divise $[L:K]$.
    preuve: |
      Tout $x \in L$ s'écrit $\sum_j \lambda_j l_j$ avec $\lambda_j \in M$, et chaque $\lambda_j = \sum_i \kappa_{ij} m_i$ avec $\kappa_{ij} \in K$, d'où $x = \sum_{i,j} \kappa_{ij} m_il_j$ : la famille est génératrice. Si $\sum_{i,j} \kappa_{ij} m_il_j = 0$, alors $\sum_j \big(\sum_i \kappa_{ij}m_i\big) l_j = 0$, donc chaque $\sum_i \kappa_{ij}m_i = 0$ par liberté des $l_j$ sur $M$, puis chaque $\kappa_{ij} = 0$ par liberté des $m_i$ sur $K$ ({{v-libre|Familles libres, bases}}).
    remarques:
      - |
        L'erreur la plus répandue est de croire que $[L:K]$ mesure une « taille » au sens du cardinal : $\lex{ensemble-complexes}{\mathbb C}/\lex{ensemble-reels}{\mathbb R}$ est de degré $2$ alors que $\mathbb R/\lex{ensemble-rationnels}{\mathbb Q}$ est de degré infini, puisque $\mathbb R$ n'est pas dénombrable et qu'un $\mathbb Q$-espace de dimension finie l'est. Le degré est une dimension, et c'est la multiplicativité qui le rend si efficace : elle interdit à $\mathbb Q(\sqrt[3]{2})$, de degré $3$, de contenir $\sqrt 2$, de degré $2$.

  - id: gs-algebriques
    etiquette: Polynôme minimal
    nature: théorème
    titre: Éléments algébriques et polynôme minimal
    texte: |
      Un polynôme non constant $P \in \lex{anneau-polynomes}{K[X]}$ est **irréductible** s'il n'est pas produit de deux polynômes de degrés strictement plus petits. Un élément $\alpha \in L$ est **algébrique** sur $K$ s'il annule un polynôme non nul de $K[X]$ ; le [[polynome-minimal|polynôme minimal]] $\mu_\alpha$ est le polynôme unitaire qui engendre l'idéal $\{P \in K[X] : P(\alpha) = 0\}$.
    enonce: |
      (i) Tout idéal de $K[X]$ est engendré par un polynôme. Si $\alpha$ est algébrique, $\mu_\alpha$ existe, est irréductible, et $P(\alpha) = 0$ équivaut à $\mu_\alpha \mid P$.

      (ii) Si $\alpha$ est algébrique de degré $d = \deg\mu_\alpha$, alors $\lex{corps-engendre}{K(\alpha)} = K[\alpha] \cong K[X]/(\mu_\alpha)$, et $(1, \alpha, \dots, \alpha^{d-1})$ est une base de $K(\alpha)$ sur $K$ : $[K(\alpha):K] = d$.

      (iii) Si $P \in K[X]$ est irréductible, $K[X]/(P)$ est un corps, extension de $K$ de degré $\deg P$, dans lequel la classe de $X$ est une racine de $P$ : c'est un **corps de rupture**.

      (iv) Toute extension finie est algébrique, et les éléments de $L$ algébriques sur $K$ forment un sous-corps.
    preuve: |
      (i) Un idéal non nul $I$ contient un polynôme $B \neq 0$ de degré minimal ; pour $P \in I$, la division euclidienne $P = BQ + R$ ({{z-polynomes|Anneaux de polynômes}}) donne $R \in I$ de degré $< \deg B$, donc $R = 0$. L'idéal annulateur de $\alpha$ est engendré par un polynôme qu'on rend unitaire. Si $\mu_\alpha = FG$ avec $\deg F, \deg G < \deg\mu_\alpha$, alors $F(\alpha)G(\alpha) = 0$ dans le corps $L$, et l'un des facteurs annule $\alpha$ sans être multiple de $\mu_\alpha$ : contradiction.

      (ii) L'évaluation $K[X] \to L$, $P \mapsto P(\alpha)$, a pour noyau $(\mu_\alpha)$ et pour image $K[\alpha]$ ; donc $K[\alpha] \cong K[X]/(\mu_\alpha)$ ({{a-anneau-quotient|Anneau quotient}}). L'idéal $(\mu_\alpha)$ est maximal : si $(\mu_\alpha) \subsetneq (Q)$, alors $Q$ divise $\mu_\alpha$ sans lui être associé, donc $Q$ est constant par irréductibilité, et $(Q) = K[X]$. Le quotient est un corps ({{a-premier-maximal|Idéaux premiers et maximaux}}), donc $K[\alpha]$ est un corps contenant $K$ et $\alpha$, égal à $K(\alpha)$. Par division euclidienne par $\mu_\alpha$, tout élément s'écrit de façon unique $R(\alpha)$ avec $\deg R < d$.

      (iii) Même argument appliqué à l'idéal maximal $(P)$ ; $K$ s'y plonge par les constantes, et $P(\bar X) = \overline{P(X)} = 0$.

      (iv) Si $[L:K] = n$, les $n + 1$ éléments $1, \alpha, \dots, \alpha^n$ sont liés, ce qui donne un polynôme annulateur. Si $\alpha$ et $\beta$ sont algébriques, $K(\alpha, \beta)$ est fini sur $K$, de degré au plus $\deg\mu_\alpha \cdot \deg\mu_\beta$ par multiplicativité ({{gs-extensions|Extensions, degré}}) ; il contient $\alpha \pm \beta$, $\alpha\beta$ et $\alpha^{-1}$, qui sont donc algébriques.
    remarques:
      - |
        Le polynôme minimal de $\sqrt 2 + \sqrt 3$ sur $\lex{ensemble-rationnels}{\mathbb Q}$ est $X^4 - 10X^2 + 1$ : en élevant $x - \sqrt 2 = \sqrt 3$ au carré, puis $x^2 - 1 = 2\sqrt 2\,x$ au carré, on obtient ce polynôme, et l'on vérifie qu'il n'a ni racine rationnelle ni facteur de degré $2$ à coefficients rationnels. Ainsi $\mathbb Q(\sqrt 2 + \sqrt 3)$ est de degré $4$, donc égal à $\mathbb Q(\sqrt 2, \sqrt 3)$.

  - id: gs-decomposition
    etiquette: Corps de décomposition
    nature: théorème
    titre: Corps de décomposition
    texte: |
      Un polynôme $P \in \lex{anneau-polynomes}{K[X]}$ de degré $n \geqslant 1$ est **scindé** sur $L$ s'il s'écrit $c\prod_{i=1}^n (X - \alpha_i)$ avec les $\alpha_i \in L$. Un [[corps-decomposition|corps de décomposition]] de $P$ sur $K$ est une extension $L$ telle que $P$ soit scindé sur $L$ et $L = \lex{corps-engendre}{K(\alpha_1, \dots, \alpha_n)}$.
    enonce: |
      (i) *Existence.* Tout polynôme non constant a un corps de décomposition, de degré au plus $n!$ sur $K$.

      (ii) *Prolongement.* Soit $\varphi : K \to K'$ un isomorphisme de corps, $P \in K[X]$, $P'$ son image par $\varphi$, $L$ un corps de décomposition de $P$ sur $K$ et $L'$ un corps de décomposition de $P'$ sur $K'$. Alors $\varphi$ se prolonge en un isomorphisme $L \to L'$. Si de plus $P'$ n'a que des racines simples, le nombre de prolongements est exactement $[L:K]$ ; en général, il est au plus $[L:K]$.

      (iii) *Unicité.* Deux corps de décomposition de $P$ sur $K$ sont isomorphes par un isomorphisme qui fixe $K$.
    preuve: |
      (i) Par récurrence sur $n$. Soit $Q$ un facteur irréductible de $P$, qui existe par récurrence sur le degré ; le corps de rupture $K_1 = K[X]/(Q)$ ({{gs-algebriques|Polynôme minimal}}, (iii)) contient une racine $\alpha_1$, de degré $\leqslant n$, et $P = (X - \alpha_1)P_1$ dans $K_1[X]$ ; un corps de décomposition de $P_1$ sur $K_1$, de degré $\leqslant (n - 1)!$, convient, par multiplicativité.

      (ii) Par récurrence sur $[L:K]$. Si $[L:K] = 1$, $P$ est scindé sur $K$, donc $P'$ sur $K'$, et $L' = K'$. Sinon, soit $\alpha \in L \setminus K$ une racine de $P$, de polynôme minimal $\mu$ de degré $d \geqslant 2$, et $\mu'$ son image par $\varphi$, qui divise $P'$ et est scindé sur $L'$. Un prolongement de $\varphi$ à $K(\alpha) \cong K[X]/(\mu)$ est déterminé par l'image de $\alpha$, qui doit être une racine de $\mu'$ dans $L'$, et toute racine $\beta$ convient, puisque $K'[X]/(\mu') \cong K'(\beta)$. Il y a donc au moins un prolongement, et au plus $d$, exactement $d$ si les racines de $P'$ sont simples. $L$ est un corps de décomposition de $P$ sur $K(\alpha)$, et $L'$ de $P'$ sur $K'(\beta)$, avec $[L:K(\alpha)] = [L:K]/d$ ; par récurrence, chacun de ces prolongements se prolonge à $L$ de $[L:K]/d$ façons au plus, exactement si les racines sont simples. On conclut par multiplicativité.

      (iii) Cas $K' = K$ et $\varphi = \mathrm{id}$ de (ii).
    remarques:
      - |
        Le corps de décomposition de $X^3 - 2$ sur $\lex{ensemble-rationnels}{\mathbb Q}$, vu dans $\lex{ensemble-complexes}{\mathbb C}$, est $\mathbb Q(\sqrt[3]{2}, j)$, où $j$ est une racine primitive cubique de l'unité : il est de degré $6 = 3!$, la borne de (i) étant atteinte. Celui de $X^3 - 3X + 1$ n'est que de degré $3$, une racine suffisant à exprimer les deux autres.

  - id: gs-separabilite
    etiquette: Séparabilité
    nature: proposition
    titre: Polynômes séparables et caractéristique
    texte: |
      La **dérivée** de $P = \sum a_kX^k$ est $P' = \sum k\,a_kX^{k-1}$, où $k\,a_k$ désigne le multiple entier. Un polynôme est [[polynome-separable|séparable]] s'il n'a que des racines simples dans un corps de décomposition. La **caractéristique** d'un corps $K$ est $0$ si le morphisme $\lex{ensemble-entiers-relatifs}{\mathbb Z} \to K$, $n \mapsto n \cdot 1$, est injectif, et sinon le générateur positif de son noyau.
    enonce: |
      (i) $(PQ)' = P'Q + PQ'$, et $\alpha$ est racine multiple de $P$ si et seulement si $P(\alpha) = P'(\alpha) = 0$.

      (ii) $P$ est séparable si et seulement si $P$ et $P'$ sont premiers entre eux dans $\lex{anneau-polynomes}{K[X]}$, c'est-à-dire si $(P, P') = K[X]$.

      (iii) La caractéristique d'un corps est $0$ ou un nombre premier $p$, et le sous-corps engendré par $1$ est alors isomorphe à $\lex{ensemble-rationnels}{\mathbb Q}$ ou à $\lex{anneau-zn}{\mathbb Z/p\mathbb Z}$.

      (iv) En caractéristique nulle, tout polynôme irréductible est séparable.
    preuve: |
      (i) La formule est bilinéaire, donc se vérifie sur les monômes. Si $P = (X - \alpha)^2Q$, $P' = (X - \alpha)\big(2Q + (X - \alpha)Q'\big)$ s'annule en $\alpha$ ; si $P = (X - \alpha)Q$ avec $Q(\alpha) \neq 0$, $P'(\alpha) = Q(\alpha) \neq 0$.

      (ii) L'idéal $(P, P')$ est engendré par un polynôme $D$ ({{gs-algebriques|Polynôme minimal}}, (i)), qui divise $P$ et $P'$, et s'écrit $UP + VP'$. Si $D$ n'est pas constant, une racine de $D$ dans un corps de décomposition de $P$ est racine commune de $P$ et $P'$, donc multiple. Réciproquement, une racine commune $\alpha$ de $P$ et $P'$ annulerait $UP + VP' = 1$.

      (iii) Le noyau est un idéal de $\mathbb Z$, de la forme $n\mathbb Z$ ({{z-ideaux|Idéaux de ℤ}}). Si $n = ab$ avec $1 < a, b < n$, alors $(a \cdot 1)(b \cdot 1) = 0$ dans le corps $K$, contradiction. L'image est $\mathbb Z/p\mathbb Z$ dans le second cas ; dans le premier, $\mathbb Z$ s'injecte dans $K$ et le morphisme se prolonge au corps des fractions $\mathbb Q$ ({{a-fractions|Corps des fractions}}).

      (iv) Si $P$ est irréductible de degré $n \geqslant 1$, $P'$ a pour coefficient dominant $n\,a_n \neq 0$, donc $P' \neq 0$ est de degré $< n$. Un diviseur commun non constant de $P$ et $P'$ serait, par irréductibilité, associé à $P$, et ne pourrait diviser $P'$. On conclut par (ii).
    remarques:
      - |
        En caractéristique $p$, l'irréductibilité ne suffit plus : sur le corps $\mathbb F_p(T)$ des fractions rationnelles, $X^p - T$ est irréductible, mais sa dérivée est nulle, et il s'écrit $(X - \alpha)^p$ dans un corps de décomposition. Les corps finis échappent à ce phénomène, comme le montrera le nœud {{gs-corps-finis|Corps finis}}.

  - id: gs-artin
    etiquette: Dedekind, Artin
    nature: théorème
    titre: Indépendance des caractères et théorème d'Artin
    texte: |
      Pour une extension $L/K$, on note $\lex{groupe-automorphismes}{\operatorname{Aut}}(L/K)$ le groupe des automorphismes du corps $L$ qui fixent chaque élément de $K$. Pour un groupe $G$ d'automorphismes de $L$, le **corps fixe** est $L^G = \{x \in L : \sigma(x) = x \text{ pour tout } \sigma \in G\}$.
    enonce: |
      (i) *Dedekind.* Des morphismes de corps $\sigma_1, \dots, \sigma_n : L \to M$ deux à deux distincts sont linéairement indépendants sur $M$ : si $\sum_i a_i\sigma_i(x) = 0$ pour tout $x \in L$, avec $a_i \in M$, alors tous les $a_i$ sont nuls.

      (ii) *Artin.* Si $G$ est un groupe fini d'automorphismes de $L$, alors $[L:L^G] = |G|$ et $\operatorname{Aut}(L/L^G) = G$.

      (iii) Pour toute extension finie, $|\operatorname{Aut}(L/K)| \leqslant [L:K]$.
    preuve: |
      (i) Supposons une relation non triviale, de longueur minimale $r \geqslant 2$, disons $\sum_{i=1}^r a_i\sigma_i = 0$ avec tous les $a_i \neq 0$. Soit $y$ tel que $\sigma_1(y) \neq \sigma_2(y)$. En appliquant la relation à $yx$ et en retranchant $\sigma_1(y)$ fois la relation, on obtient $\sum_{i=2}^r a_i\big(\sigma_i(y) - \sigma_1(y)\big)\sigma_i = 0$, relation non triviale plus courte : contradiction. Une relation de longueur $1$ est impossible, puisque $\sigma_1(1) = 1$.

      (iii) Si $[L:K] = m$ avec une base $(e_1, \dots, e_m)$ et si $\sigma_1, \dots, \sigma_n$ sont des éléments distincts de $\operatorname{Aut}(L/K)$ avec $n > m$, le système $\sum_i a_i\sigma_i(e_k) = 0$, $1 \leqslant k \leqslant m$, a $n$ inconnues et $m$ équations : il a une solution non nulle dans $L^n$ ({{v-rang|Théorème du rang}}). Par $K$-linéarité, $\sum_i a_i\sigma_i = 0$ sur $L$, ce que (i) interdit.

      (ii) Soit $K = L^G$ et $n = |G|$. L'inégalité (iii) donne $|G| \leqslant [L:K]$, puisque $G \subset \operatorname{Aut}(L/K)$. Réciproquement, soient $x_1, \dots, x_m \in L$ avec $m > n$. Le système $\sum_j \sigma(x_j)y_j = 0$, $\sigma \in G$, de $n$ équations à $m$ inconnues, a des solutions non nulles ; prenons-en une, $y$, ayant le moins possible de coordonnées non nulles, et normalisée par $y_1 = 1$. Pour $\tau \in G$, $\tau(y)$ est encore solution, les équations étant permutées, et $y - \tau(y)$ a moins de coordonnées non nulles, puisque sa première est nulle : donc $\tau(y) = y$, et $y \in \lex{n-uplet}{K^m}$. L'équation de $\sigma = \mathrm{id}$ donne $\sum x_jy_j = 0$ : les $x_j$ sont liés sur $K$. Donc $[L:K] \leqslant n$, et $[L:K] = |G|$. Enfin $G \subset \operatorname{Aut}(L/K)$, de cardinal au plus $[L:K] = |G|$ par (iii).
    remarques:
      - |
        Le théorème d'Artin renverse le point de vue de Galois : au lieu de partir d'un polynôme et de chercher le groupe de ses racines, on part d'un groupe d'automorphismes et l'on regarde ce qu'il fixe. Pour $L = \mathbb Q(\sqrt 2)$ et $G = \{\mathrm{id}, \sigma\}$ avec $\sigma(\sqrt 2) = -\sqrt 2$, on trouve $L^G = \lex{ensemble-rationnels}{\mathbb Q}$ et $[L:\mathbb Q] = 2 = |G|$.

  - id: gs-galoisiennes
    etiquette: Extensions galoisiennes
    nature: théorème
    titre: Extensions galoisiennes
    texte: |
      Une extension finie $L/K$ est [[extension-galoisienne|galoisienne]] si $L^{\lex{groupe-automorphismes}{\operatorname{Aut}}(L/K)} = K$. Son [[groupe-galois|groupe de Galois]] est alors $\lex{groupe-galois}{\operatorname{Gal}}(L/K) = \operatorname{Aut}(L/K)$.
    enonce: |
      Pour une extension finie $L/K$, sont équivalents :

      (a) $L$ est le corps de décomposition sur $K$ d'un polynôme séparable ;

      (b) $|\operatorname{Aut}(L/K)| = [L:K]$ ;

      (c) $L/K$ est galoisienne.

      Dans ce cas, le polynôme minimal de tout $\alpha \in L$ est séparable et scindé sur $L$ : ses racines sont les images $\sigma(\alpha)$, $\sigma \in \operatorname{Gal}(L/K)$.
    preuve: |
      (a) ⇒ (b) : le prolongement de l'identité de $K$ en automorphismes de $L$ se fait de exactement $[L:K]$ façons ({{gs-decomposition|Corps de décomposition}}, (ii), avec $L' = L$).

      (b) ⇒ (c) : par Artin ({{gs-artin|Dedekind, Artin}}), $[L:L^G] = |G| = [L:K]$ pour $G = \operatorname{Aut}(L/K)$, et $K \subset L^G$ ; par multiplicativité, $[L^G:K] = 1$.

      (c) ⇒ (a) : soit $G = \operatorname{Aut}(L/K)$, fini par Artin. Pour $\alpha \in L$, soient $\alpha_1 = \alpha, \dots, \alpha_r$ les éléments distincts de l'orbite $G\alpha$, et $P_\alpha = \prod_i (X - \alpha_i)$. Tout $\sigma \in G$ permute les $\alpha_i$, donc fixe les coefficients de $P_\alpha$, qui sont dans $L^G = K$. Ainsi $\mu_\alpha$ divise $P_\alpha$ ; et tout $\alpha_i = \sigma(\alpha)$ annule $\mu_\alpha$, donc $P_\alpha$ divise $\mu_\alpha$ : $P_\alpha = \mu_\alpha$, séparable et scindé sur $L$. Si $(e_1, \dots, e_m)$ est une base de $L$ sur $K$, le produit des polynômes minimaux distincts des $e_k$, irréductibles et donc deux à deux premiers entre eux, est séparable, et $L$ en est un corps de décomposition.
    remarques:
      - |
        L'extension $\mathbb Q(\sqrt[3]{2})/\lex{ensemble-rationnels}{\mathbb Q}$ n'est pas galoisienne : ses seuls automorphismes fixent $\sqrt[3]2$, puisque les deux autres racines de $X^3 - 2$ ne sont pas réelles, et $|\operatorname{Aut}| = 1 < 3$. L'erreur la plus répandue est d'oublier que le groupe de Galois n'est défini sans ambiguïté que pour une extension galoisienne ; pour une autre, on passe à sa clôture galoisienne, ici $\mathbb Q(\sqrt[3]2, j)$.

  - id: gs-correspondance
    etiquette: Théorème fondamental
    nature: théorème
    titre: La correspondance de Galois
    enonce: |
      Soit $L/K$ galoisienne de groupe $G$.

      (i) Les applications $H \mapsto L^H$ et $M \mapsto \lex{groupe-galois}{\operatorname{Gal}}(L/M)$ sont des bijections réciproques, décroissantes pour l'inclusion, entre les sous-groupes de $G$ et les corps intermédiaires $K \subset M \subset L$. De plus $[L:L^H] = |H|$ et $[L^H:K] = [G:H]$.

      (ii) $M/K$ est galoisienne si et seulement si $\operatorname{Gal}(L/M)$ est distingué dans $G$, et alors $\operatorname{Gal}(M/K) \cong G/\operatorname{Gal}(L/M)$.
    preuve: |
      (i) Pour un corps intermédiaire $M$, $L/M$ est galoisienne, car $L$ est le corps de décomposition sur $M$ du même polynôme séparable ({{gs-galoisiennes|Extensions galoisiennes}}, (a)) ; donc $L^{\operatorname{Gal}(L/M)} = M$. Pour un sous-groupe $H$, Artin ({{gs-artin|Dedekind, Artin}}) donne $\operatorname{Gal}(L/L^H) = H$ et $[L:L^H] = |H|$. Les deux applications sont donc réciproques ; elles renversent évidemment les inclusions. Enfin $[L^H:K] = [L:K]/[L:L^H] = |G|/|H|$ par multiplicativité.

      (ii) Soit $H = \operatorname{Gal}(L/M)$. Pour $\sigma \in G$, $\operatorname{Gal}(L/\sigma(M)) = \sigma H\sigma^{-1}$. Si $H$ est distingué, tout $\sigma$ envoie $M$ dans $M = L^{\sigma H \sigma^{-1}}$, d'où un morphisme de restriction $G \to \lex{groupe-automorphismes}{\operatorname{Aut}}(M/K)$, de noyau $H$ ; son image est d'ordre $|G|/|H| = [M:K]$, donc égale à $\operatorname{Aut}(M/K)$ par Artin, et $M/K$ est galoisienne ({{gs-galoisiennes|Extensions galoisiennes}}, (b)), de groupe $G/H$ ({{a-isomorphisme|Isomorphisme}}). Réciproquement, si $M/K$ est galoisienne et $\alpha \in M$, les racines de $\mu_\alpha$ sont dans $M$, donc $\sigma(\alpha) \in M$ pour tout $\sigma \in G$ : $\sigma(M) = M$, et $\sigma H \sigma^{-1} = H$.
    remarques:
      - |
        Pour $L = \mathbb Q(\sqrt 2, \sqrt 3)$, le groupe de Galois a quatre éléments, déterminés par les signes de $\sqrt 2 \mapsto \pm\sqrt 2$ et $\sqrt 3 \mapsto \pm\sqrt 3$ : c'est $(\lex{anneau-zn}{\mathbb Z/2\mathbb Z})^2$. Ses trois sous-groupes d'ordre $2$ correspondent aux trois corps quadratiques $\mathbb Q(\sqrt 2)$, $\mathbb Q(\sqrt 3)$ et $\mathbb Q(\sqrt 6)$ ; il n'y en a pas d'autre, ce que la correspondance établit sans calcul.

        ```schema gs-correspondance
        On note $\sigma$ l'automorphisme qui change le signe de $\sqrt 2$ et fixe $\sqrt 3$, et $\tau$ celui qui fixe $\sqrt 2$ et change le signe de $\sqrt 3$. Le treillis des sous-groupes est dessiné renversé : chaque sous-groupe $H$ est à la hauteur de son corps fixe $L^H$, de la même couleur, ce qui rend visible le renversement des inclusions.
        ```

  - id: gs-corps-finis
    etiquette: Corps finis
    nature: théorème
    titre: Corps finis
    enonce: |
      (i) Un corps fini $F$ a pour cardinal $q = p^n$, où $p$ est sa caractéristique.

      (ii) Le groupe multiplicatif $F^\times$ est cyclique.

      (iii) Pour tout $p$ premier et tout $n \geqslant 1$, il existe un corps à $p^n$ éléments, unique à isomorphisme près : le corps de décomposition $\lex{corps-fini}{\mathbb F_{p^n}}$ de $X^{p^n} - X$ sur $\mathbb F_p = \lex{anneau-zn}{\mathbb Z/p\mathbb Z}$.

      (iv) $\mathbb F_{p^n}/\mathbb F_p$ est galoisienne, de groupe cyclique d'ordre $n$ engendré par le **Frobenius** $x \mapsto x^p$.
    preuve: |
      (i) La caractéristique n'est pas nulle, $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ ne s'injectant pas dans un ensemble fini ; elle est donc un premier $p$ ({{gs-separabilite|Séparabilité}}), et $F$ est un espace vectoriel de dimension finie $n$ sur $\mathbb F_p$, de cardinal $p^n$.

      (ii) Soit $m = q - 1$. Pour $d \mid m$, notons $\psi(d)$ le nombre d'éléments d'ordre $d$ de $F^\times$. S'il en existe un, $x$, ses puissances $x^k$, $0 \leqslant k < d$, sont $d$ racines distinctes de $X^d - 1$, qui en a au plus $d$ dans le corps $F$ ; les éléments d'ordre $d$ sont donc parmi elles, et sont les $x^k$ avec $k$ premier à $d$ : $\psi(d)$ vaut $0$ ou $\varphi(d)$, nombre d'entiers de $\{1, \dots, d\}$ premiers à $d$. Par le théorème de Lagrange ({{gs-groupes|Groupes résolubles}}, (i)), l'ordre de tout élément divise $m$, d'où $\sum_{d \mid m} \psi(d) = m$. D'autre part $\sum_{d \mid m} \varphi(d) = m$, en classant les éléments de $\mathbb Z/m\mathbb Z$ selon leur ordre. Donc $\psi(m) = \varphi(m) \geqslant 1$.

      (iii) Si $|F| = q$, tout $x \in F^\times$ vérifie $x^{q-1} = 1$, donc tout $x \in F$ annule $X^q - X$, qui a $q$ racines dans $F$ : $F$ est un corps de décomposition de ce polynôme, d'où l'unicité ({{gs-decomposition|Corps de décomposition}}). Pour l'existence, $X^q - X$ a pour dérivée $-1$ en caractéristique $p$, donc est séparable ; ses $q$ racines dans un corps de décomposition forment un corps, car $(x + y)^p = x^p + y^p$ en caractéristique $p$, les coefficients binomiaux intermédiaires étant divisibles par $p$, et donc $(x + y)^q = x^q + y^q$.

      (iv) Le Frobenius $\phi$ est un morphisme d'anneaux injectif, donc bijectif sur l'ensemble fini $F$, qui fixe $\mathbb F_p$. Si $\phi^k = \mathrm{id}$ avec $0 < k < n$, tout $x$ annulerait $X^{p^k} - X$, qui a moins de $p^n$ racines : $\phi$ est d'ordre $n$ dans $\lex{groupe-automorphismes}{\operatorname{Aut}}(F/\mathbb F_p)$, de cardinal au plus $n$ par Artin. Donc $\operatorname{Aut}(F/\mathbb F_p) = \langle\phi\rangle$, d'ordre $n = [F:\mathbb F_p]$.
    remarques:
      - |
        $\mathbb F_4 = \mathbb F_2[X]/(X^2 + X + 1)$ n'est pas $\mathbb Z/4\mathbb Z$, qui n'est pas même intègre, puisque $2 \cdot 2 = 0$. L'erreur la plus répandue est de confondre le corps à $p^n$ éléments avec l'anneau $\mathbb Z/p^n\mathbb Z$ ; ils n'ont le même cardinal que par coïncidence de notation.

  - id: gs-groupes
    etiquette: Groupes résolubles
    nature: théorème
    titre: Lagrange, Cauchy et groupes résolubles
    texte: |
      Un groupe $G$ est [[groupe-resoluble|résoluble]] s'il existe une suite de sous-groupes $G = G_0 \supset G_1 \supset \cdots \supset G_r = \{e\}$, chacun distingué dans le précédent, avec des quotients $G_{i-1}/G_i$ abéliens. Le **commutateur** de $x$ et $y$ est $[x, y] = xyx^{-1}y^{-1}$.
    enonce: |
      (i) *Lagrange.* Si $H$ est un sous-groupe d'un groupe fini $G$, $|H|$ divise $|G|$ ; en particulier l'ordre de tout élément divise $|G|$.

      (ii) *Cauchy.* Si un nombre premier $p$ divise $|G|$, $G$ a un élément d'ordre $p$.

      (iii) Si $N$ est distingué dans $G$, $G/N$ est abélien si et seulement si $N$ contient tous les commutateurs. Un quotient d'un groupe résoluble est résoluble.

      (iv) Pour $n \geqslant 5$, le groupe symétrique $\lex{groupe-symetrique}{\mathfrak S_n}$ n'est pas résoluble.
    preuve: |
      (i) Les classes $xH$ forment une partition de $G$ ({{a-quotient|Groupe quotient}}), et $h \mapsto xh$ est une bijection de $H$ sur $xH$ : $|G| = |H| \cdot |G/H|$, sans choix, $G$ étant fini. Pour un élément $x$ d'ordre $d$, on prend $H = \{e, x, \dots, x^{d-1}\}$.

      (ii) *Argument de McKay.* Soit $E$ l'ensemble des $(x_1, \dots, x_p) \in G^p$ tels que $x_1x_2\cdots x_p = e$ ; il a $|G|^{p-1}$ éléments, $x_p$ étant déterminé par les autres, nombre divisible par $p$. La permutation circulaire des coordonnées préserve $E$, car $x_1(x_2\cdots x_p) = e$ entraîne $(x_2 \cdots x_p)x_1 = e$. Ses orbites ont $1$ ou $p$ éléments, $p$ étant premier ; celles à un élément sont les $(x, \dots, x)$ avec $x^p = e$. Leur nombre est donc divisible par $p$, et, comme $(e, \dots, e)$ en est une, il y a un $x \neq e$ tel que $x^p = e$.

      (iii) $G/N$ est abélien si et seulement si $xyN = yxN$ pour tous $x, y$, c'est-à-dire $[x, y] \in N$. Si $\pi : G \to G/N$ est la projection et $(G_i)$ une suite de résolubilité de $G$, les $\pi(G_i)$ forment une suite de résolubilité de $G/N$, chaque quotient $\pi(G_{i-1})/\pi(G_i)$ étant une image du quotient abélien $G_{i-1}/G_i$.

      (iv) Si $a, b, c, d, e$ sont cinq éléments distincts, $[(a\ b\ d), (a\ c\ e)] = (a\ b\ c)$, comme on le vérifie en suivant les images. Soit $H \subset \mathfrak S_n$ un sous-groupe contenant tous les $3$-cycles, et $N$ distingué dans $H$ avec $H/N$ abélien : par (iii), $N$ contient tous les commutateurs d'éléments de $H$, donc tous les $3$-cycles. Par récurrence, chaque $G_i$ d'une suite de résolubilité de $\mathfrak S_n$ contiendrait tous les $3$-cycles, et $G_r \neq \{e\}$ : contradiction.
    remarques:
      - |
        Pour $n \leqslant 4$, $\mathfrak S_n$ est résoluble : $\mathfrak S_4 \supset \mathfrak A_4 \supset V \supset \{e\}$, où $\mathfrak A_4$ est le noyau de la signature ({{v-permutations|Permutations, signature}}) et $V$ le groupe de Klein des doubles transpositions, a des quotients d'ordres $2$, $3$ et $4$, tous abéliens. C'est la raison profonde de l'existence des formules de Cardan et de Ferrari pour les degrés $3$ et $4$.

  - id: gs-radicaux
    etiquette: Résolubilité par radicaux
    nature: théorème
    titre: Le théorème de Galois sur les radicaux
    texte: |
      On suppose $K$ de caractéristique nulle. Une extension $R/K$ est **radicale** s'il existe une tour $K = K_0 \subset K_1 \subset \cdots \subset K_r = R$ avec $K_i = K_{i-1}(\beta_i)$ et $\beta_i^{m_i} \in K_{i-1}$ pour des entiers $m_i \geqslant 1$. Un polynôme $P \in \lex{anneau-polynomes}{K[X]}$ est **résoluble par radicaux** si son corps de décomposition est contenu dans une extension radicale.
    enonce: |
      Si $P$ est résoluble par radicaux, le groupe de Galois de son corps de décomposition sur $K$ est résoluble.
    preuve: |
      *Réduction à une tour galoisienne.* Soit $R$ radicale contenant le corps de décomposition $L$ de $P$, avec les notations ci-dessus, et $m$ le produit des $m_i$. Soit $\Omega$ un corps de décomposition sur $K$ du produit $Q$ de $X^m - 1$ et des polynômes minimaux des $\beta_i$ sur $K$ ; on plonge $R$ dans $\Omega$ au-dessus de $K$ en envoyant successivement chaque $\beta_i$ sur une racine, dans $\Omega$, de l'image de son polynôme minimal sur $K_{i-1}$, qui divise le polynôme minimal de $\beta_i$ sur $K$ et est donc scindé sur $\Omega$ ({{gs-decomposition|Corps de décomposition}}, (ii)) ; on suppose désormais $R \subset \Omega$. En caractéristique nulle, $Q$ peut être pris séparable, en ne gardant que ses facteurs irréductibles distincts ({{gs-separabilite|Séparabilité}}), si bien que $\Omega/K$ est galoisienne de groupe $G$. Le corps $\Omega$ est engendré sur $K$ par les racines $m$-ièmes de l'unité et par les $\sigma(\beta_i)$, $\sigma \in G$ ({{gs-galoisiennes|Extensions galoisiennes}}). Ajoutons d'abord une racine primitive $m$-ième de l'unité $\zeta$ : $K_0' = K(\zeta)$. Puis ajoutons les $\sigma(\beta_1)$ pour tous les $\sigma$, puis les $\sigma(\beta_2)$, et ainsi de suite ; chaque élément ajouté a une puissance $m_i$-ième dans le corps précédent, puisque $\sigma(\beta_i)^{m_i} = \sigma(\beta_i^{m_i})$ et que $\beta_i^{m_i} \in K(\beta_1, \dots, \beta_{i-1})$. On obtient une tour $K \subset K_0' \subset K_1' \subset \cdots \subset K_s' = \Omega$ où chaque étage ajoute un élément $\gamma$ avec $\gamma^{k} \in$ l'étage précédent, $k \mid m$.

      *Chaque étage est galoisien abélien.* $K(\zeta)$ est le corps de décomposition de $X^m - 1$, dont les racines sont les $\zeta^j$ ; un automorphisme est déterminé par $\zeta \mapsto \zeta^{a}$, et deux tels automorphismes commutent. Pour un étage $E \subset E(\gamma)$ avec $\gamma^k = c \in E$ et $\zeta \in E$, $E(\gamma)$ est le corps de décomposition de $X^k - c$, dont les racines sont les $\zeta^{jm/k}\gamma$ ; un automorphisme envoie $\gamma$ sur $\eta\gamma$ avec $\eta^k = 1$, $\eta \in E$, et deux tels automorphismes commutent. Donc chaque étage est une extension galoisienne de groupe abélien.

      *Conclusion.* Notons $H_j = \lex{groupe-galois}{\operatorname{Gal}}(\Omega/K_j')$, avec $H_{-1} = G$. Comme $K_j'/K_{j-1}'$ est galoisienne, $H_j$ est distingué dans $H_{j-1}$ et $H_{j-1}/H_j \cong \operatorname{Gal}(K_j'/K_{j-1}')$ est abélien ({{gs-correspondance|Théorème fondamental}}, (ii), appliqué à l'extension galoisienne $\Omega/K_{j-1}'$). Donc $G$ est résoluble. Enfin $L/K$ est galoisienne, et $\operatorname{Gal}(L/K) \cong G/\operatorname{Gal}(\Omega/L)$ est un quotient de $G$, résoluble par {{gs-groupes|Groupes résolubles}}, (iii).
    remarques:
      - |
        La réciproque est vraie : un polynôme dont le groupe de Galois est résoluble est résoluble par radicaux. Elle demande la théorie de Kummer, qui montre qu'une extension cyclique de degré $n$, sur un corps contenant les racines $n$-ièmes de l'unité, est engendrée par un radical ; elle est admise ici.

  - id: gs-abel-ruffini
    etiquette: Abel-Ruffini
    nature: théorème
    titre: Un polynôme de degré 5 non résoluble par radicaux
    enonce: |
      (i) *Eisenstein.* Soit $P = \sum_{k=0}^n a_kX^k \in \lex{anneau-polynomes}{\mathbb Z[X]}$ et $p$ premier tel que $p \nmid a_n$, $p \mid a_k$ pour $k < n$, et $p^2 \nmid a_0$. Alors $P$ est irréductible dans $\mathbb Q[X]$.

      (ii) Le groupe de Galois sur $\lex{ensemble-rationnels}{\mathbb Q}$ du polynôme $X^5 - 4X + 2$ est $\lex{groupe-symetrique}{\mathfrak S_5}$ ; ce polynôme n'est donc pas résoluble par radicaux.
    preuve: |
      (i) *Lemme de Gauss.* Si un polynôme de $\mathbb Z[X]$ se factorise dans $\mathbb Q[X]$ en deux facteurs de degrés $\geqslant 1$, il se factorise dans $\mathbb Z[X]$ en facteurs de mêmes degrés. En effet, chassons les dénominateurs : $dP = AB$ avec $A, B \in \mathbb Z[X]$ et $d \geqslant 1$ entier. Si un premier $q$ divise $d$, la réduction modulo $q$ donne $\bar A\bar B = 0$ dans $(\lex{anneau-zn}{\mathbb Z/q\mathbb Z})[X]$, qui est intègre ({{z-polynomes|Anneaux de polynômes}}, (iii), et {{z-zn|ℤ/nℤ}}) : $q$ divise tous les coefficients de $A$ ou tous ceux de $B$, et l'on peut diviser par $q$. On épuise ainsi les facteurs premiers de $d$. *Eisenstein.* Supposons $P = AB$ dans $\mathbb Z[X]$ avec $A = \sum_{i \leqslant r} b_iX^i$ et $B = \sum_{j \leqslant s} c_jX^j$, $r, s \geqslant 1$. Comme $p \mid a_0 = b_0c_0$ et $p^2 \nmid a_0$, $p$ divise exactement l'un des deux, disons $b_0$, et pas $c_0$ ({{z-premiers|Nombres premiers}}). Comme $p \nmid a_n = b_rc_s$, $p \nmid b_r$ ; soit $i \leqslant r < n$ le plus petit indice tel que $p \nmid b_i$. Alors $a_i = b_ic_0 + \sum_{j < i} b_jc_{i-j}$ n'est pas divisible par $p$, alors que $i < n$ : contradiction.

      (ii) $P = X^5 - 4X + 2$ est irréductible par Eisenstein avec $p = 2$. Ses racines complexes existent par le théorème de d'Alembert-Gauss ({{c-dalembert|D'Alembert-Gauss}}) ; soit $L \subset \lex{ensemble-complexes}{\mathbb C}$ son corps de décomposition et $G = \lex{groupe-galois}{\operatorname{Gal}}(L/\mathbb Q)$, qui permute les cinq racines distinctes ({{gs-separabilite|Séparabilité}}, (iv)) et s'identifie à un sous-groupe de $\mathfrak S_5$. On a $P(-2) = -22$, $P(0) = 2$, $P(1) = -1$, $P(2) = 26$ : par les valeurs intermédiaires ({{c-tvi|Valeurs intermédiaires}}), $P$ a au moins trois racines réelles ; $P' = 5X^4 - 4$ n'en a que deux, donc par le théorème de Rolle ({{ar-deriv|Dérivabilité}}), $P$ en a au plus trois. La conjugaison complexe, restreinte à $L$, est un élément de $G$ qui échange les deux racines non réelles et fixe les trois autres : une transposition.

      ```schema gs-abel-ruffini
      Le graphe de $P$ coupe l'axe en trois points, et ne peut le couper davantage puisque $P'$ ne s'annule qu'en $\pm c$, avec $c = (4/5)^{1/4}$. Les deux autres racines $z$ et $\bar z$ sont conjuguées, et la conjugaison complexe les échange en fixant les trois racines réelles.
      ```

      D'autre part $5 = [\mathbb Q(\alpha):\mathbb Q]$ divise $[L:\mathbb Q] = |G|$, donc $G$ contient un élément d'ordre $5$ par Cauchy ({{gs-groupes|Groupes résolubles}}), c'est-à-dire un $5$-cycle. Une transposition $(a\ b)$ et un $5$-cycle engendrent $\mathfrak S_5$ : une puissance du cycle envoie $a$ sur $b$ ; en renumérotant, on a $(1\ 2)$ et $(1\ 2\ 3\ 4\ 5)$, dont les conjugués donnent toutes les transpositions $(i\ i{+}1)$, qui engendrent $\mathfrak S_5$ ({{v-permutations|Permutations, signature}}). Donc $G = \mathfrak S_5$, qui n'est pas résoluble ({{gs-groupes|Groupes résolubles}}, (iv)), et l'on conclut par {{gs-radicaux|Résolubilité par radicaux}}.
    remarques:
      - |
        Le théorème d'Abel-Ruffini n'affirme pas qu'aucune équation de degré $5$ n'est résoluble par radicaux : $X^5 - 2$ l'est évidemment, et $X^5 - 5X + 12$ aussi, son groupe étant le groupe diédral d'ordre $10$. Il affirme qu'il n'existe pas de **formule générale**, et Galois a donné le critère exact : la résolubilité du groupe.
      - |
        L'argument (ii) vaut pour tout polynôme irréductible de degré premier $p$ ayant exactement deux racines non réelles : son groupe est $\mathfrak S_p$. L'analyse réelle y fournit la transposition, et l'algèbre le $p$-cycle ; c'est une rencontre caractéristique des deux disciplines.

