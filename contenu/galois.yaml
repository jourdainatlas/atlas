# Niveau 1 : structure interne du nœud « Théorie de Galois ».
# Extensions et degrés, éléments algébriques et polynôme minimal, corps de décomposition,
# séparabilité, lemme de Dedekind et théorème d'Artin, extensions galoisiennes, théorème
# fondamental, corps finis, résolubilité par radicaux (sens direct de Galois, en caractéristique
# nulle), une transposition et un p-cycle engendrent 𝔖ₚ, le polynôme X⁵ − 4X + 2 et ses racines,
# puis Abel-Ruffini. Les groupes (Lagrange, Cauchy, résolubles, 𝔖ₙ) sont dans le graphe gf. L'arithmétique des polynômes (racines, factorisation,
# dérivée formelle, binôme, Gauss et Eisenstein) est dans le chapitre z-polynomes du graphe z.
# Parents : groupes finis, algèbre linéaire (dimension), ℂ (racines, conjugaison), analyse réelle (valeurs
# intermédiaires et Rolle pour compter les racines réelles de l'exemple).

graphe: galois
titre: Théorie de Galois
conteneur: galois

entrees:
  gf: [gs-corps-finis, gs-radicaux, gs-engendrer-sp]
  alglin: [gs-extensions]
  c: [gs-quintique]
  analyse-reelle: [gs-quintique]

noeuds:
  - id: gs-extensions
    etiquette: Extensions, degré
    nature: théorème
    titre: Extensions de corps et multiplicativité des degrés
    texte: |
      Une [[extension-corps|extension]] $L/K$ est la donnée d'un [[corps]] $L$ et d'un sous-corps $K$ ; $L$ est alors un $K$-espace vectoriel, et le **degré** $[L:K]$ est sa [[dimension]], finie ou non. L'extension est **finie** si son degré l'est.

      Pour $\alpha_1, \dots, \alpha_n \in L$, $\lex{corps-engendre}{K(\alpha_1, \dots, \alpha_n)}$ désigne le plus petit sous-corps de $L$ contenant $K$ et les $\alpha_i$, intersection des sous-corps qui les contiennent.
    enonce: |
      *Multiplicativité.* Si $K \subset M \subset L$, avec $(m_i)$ une base de $M$ sur $K$ et $(l_j)$ une base de $L$ sur $M$, la famille $(m_il_j)$ est une base de $L$ sur $K$. En particulier $[L:K] = [L:M]\,[M:K]$ quand ces degrés sont finis, et $[M:K]$ divise $[L:K]$.
    preuve: |
      Tout $x \in L$ s'écrit $\sum_j \lambda_j l_j$ avec $\lambda_j \in M$, et chaque $\lambda_j = \sum_i \kappa_{ij} m_i$ avec $\kappa_{ij} \in K$, d'où
      $$x = \sum_{i,j} \kappa_{ij} m_il_j :$$
      la famille est génératrice.

      Si $\sum_{i,j} \kappa_{ij} m_il_j = 0$, alors
      $$\sum_j \Big(\sum_i \kappa_{ij}m_i\Big) l_j = 0,$$
      donc chaque $\sum_i \kappa_{ij}m_i = 0$ par liberté des $l_j$ sur $M$, puis chaque $\kappa_{ij} = 0$ par liberté des $m_i$ sur $K$ ({{v-libre|Familles libres, bases}}).
    remarques:
      - |
        L'erreur la plus répandue est de croire que $[L:K]$ mesure une « taille » au sens du cardinal : $\lex{ensemble-complexes}{\mathbb C}/\lex{ensemble-reels}{\mathbb R}$ est de degré $2$ alors que $\mathbb R/\lex{ensemble-rationnels}{\mathbb Q}$ est de degré infini, puisque $\mathbb R$ n'est pas dénombrable et qu'un $\mathbb Q$-espace de dimension finie l'est.

        Le degré est une dimension, et c'est la multiplicativité qui le rend si efficace : elle interdit à $\mathbb Q(\sqrt[3]{2})$, de degré $3$, de contenir $\sqrt 2$, de degré $2$.

  - id: gs-algebriques
    etiquette: Polynôme minimal
    nature: théorème
    titre: Éléments algébriques et polynôme minimal
    texte: |
      Rappelons qu'un polynôme non constant $P \in \lex{anneau-polynomes}{K[X]}$ est [[polynome-irreductible|irréductible]] s'il n'est pas produit de deux polynômes de degrés strictement plus petits ({{pol-irreductibles|Irréductibles}}). Un élément $\alpha \in L$ est **algébrique** sur $K$ s'il annule un polynôme non nul de $K[X]$ ; le [[polynome-minimal|polynôme minimal]] $\mu_\alpha$ est le polynôme unitaire qui engendre l'idéal $\{P \in K[X] : P(\alpha) = 0\}$.
    enonce: |
      (i) Tout idéal de $K[X]$ est engendré par un polynôme. Si $\alpha$ est algébrique, $\mu_\alpha$ existe, est irréductible, et $P(\alpha) = 0$ équivaut à $\mu_\alpha \mid P$.

      (ii) Si $\alpha$ est algébrique de degré $d = \deg\mu_\alpha$, alors $\lex{corps-engendre}{K(\alpha)} = K[\alpha] \cong K[X]/(\mu_\alpha)$, et $(1, \alpha, \dots, \alpha^{d-1})$ est une base de $K(\alpha)$ sur $K$ : $[K(\alpha):K] = d$.

      (iii) Si $P \in K[X]$ est irréductible, $K[X]/(P)$ est un corps, extension de $K$ de degré $\deg P$, dans lequel la classe de $X$ est une racine de $P$ : c'est un **corps de rupture**.

      (iv) Toute extension finie est algébrique, et les éléments de $L$ algébriques sur $K$ forment un sous-corps.
    preuve: |
      (i) La première assertion est le point (i) du nœud {{pol-principal|K[X] principal}}. L'idéal annulateur de $\alpha$ est engendré par un polynôme qu'on rend unitaire. Si $\mu_\alpha = FG$ avec $\deg F, \deg G < \deg\mu_\alpha$, alors $F(\alpha)G(\alpha) = 0$ dans le corps $L$, et l'un des facteurs annule $\alpha$ sans être multiple de $\mu_\alpha$ : contradiction.

      (ii) L'évaluation $K[X] \to L$, $P \mapsto P(\alpha)$, a pour noyau $(\mu_\alpha)$ et pour image $K[\alpha]$ ; donc $K[\alpha] \cong K[X]/(\mu_\alpha)$ ({{a-anneau-quotient|Anneau quotient}}).

      L'idéal $(\mu_\alpha)$ est maximal : si $(\mu_\alpha) \subsetneq (Q)$, alors $Q$ divise $\mu_\alpha$ sans lui être associé, donc $Q$ est constant par irréductibilité, et $(Q) = K[X]$. Le quotient est un corps ({{a-premier-maximal|Idéaux premiers et maximaux}}), donc $K[\alpha]$ est un corps contenant $K$ et $\alpha$, égal à $K(\alpha)$. Par division euclidienne par $\mu_\alpha$, tout élément s'écrit de façon unique $R(\alpha)$ avec $\deg R < d$.

      (iii) Même argument appliqué à l'idéal maximal $(P)$ ; $K$ s'y plonge par les constantes, et $P(\bar X) = \overline{P(X)} = 0$.

      (iv) Si $[L:K] = n$, les $n + 1$ éléments $1, \alpha, \dots, \alpha^n$ sont liés, ce qui donne un polynôme annulateur. Si $\alpha$ et $\beta$ sont algébriques, $K(\alpha, \beta)$ est fini sur $K$, de degré au plus $\deg\mu_\alpha \cdot \deg\mu_\beta$ par multiplicativité ({{gs-extensions|Extensions, degré}}) ; il contient $\alpha \pm \beta$, $\alpha\beta$ et $\alpha^{-1}$, qui sont donc algébriques.
    remarques:
      - |
        Le polynôme minimal de $\sqrt 2 + \sqrt 3$ sur $\lex{ensemble-rationnels}{\mathbb Q}$ est $X^4 - 10X^2 + 1$ : en élevant $x - \sqrt 2 = \sqrt 3$ au carré, puis $x^2 - 1 = 2\sqrt 2\,x$ au carré, on obtient ce polynôme, et l'on vérifie qu'il n'a ni racine rationnelle ni facteur de degré $2$ à coefficients rationnels. Ainsi $\mathbb Q(\sqrt 2 + \sqrt 3)$ est de degré $4$, donc égal à $\mathbb Q(\sqrt 2, \sqrt 3)$.

  - id: gs-decomposition
    etiquette: Corps de décomposition
    nature: théorème
    titre: Corps de décomposition
    texte: |
      Un polynôme $P \in \lex{anneau-polynomes}{K[X]}$ de degré $n \geqslant 1$ est **scindé** sur $L$ s'il s'écrit $c\prod_{i=1}^n (X - \alpha_i)$ avec les $\alpha_i \in L$. Un [[corps-decomposition|corps de décomposition]] de $P$ sur $K$ est une extension $L$ telle que $P$ soit scindé sur $L$ et $L = \lex{corps-engendre}{K(\alpha_1, \dots, \alpha_n)}$.
    enonce: |
      (i) *Existence.* Tout polynôme non constant a un corps de décomposition, de degré au plus $n!$ sur $K$.

      (ii) *Prolongement.* Soit $\varphi : K \to K'$ un isomorphisme de corps, $P \in K[X]$, $P'$ son image par $\varphi$, $L$ un corps de décomposition de $P$ sur $K$ et $L'$ un corps de décomposition de $P'$ sur $K'$. Alors $\varphi$ se prolonge en un isomorphisme $L \to L'$. Si de plus $P'$ n'a que des racines simples, le nombre de prolongements est exactement $[L:K]$ ; en général, il est au plus $[L:K]$.

      (iii) *Unicité.* Deux corps de décomposition de $P$ sur $K$ sont isomorphes par un isomorphisme qui fixe $K$.
    preuve: |
      (i) Par récurrence sur $n$. Soit $Q$ un facteur irréductible de $P$, qui existe par la factorisation en irréductibles ({{pol-irreductibles|Irréductibles}}, (ii)).

      Le corps de rupture $K_1 = K[X]/(Q)$ ({{gs-algebriques|Polynôme minimal}}, (iii)) contient une racine $\alpha_1$, de degré $\leqslant n$, et $P = (X - \alpha_1)P_1$ dans $K_1[X]$ ({{pol-racines|Racines}}, (i)). Un corps de décomposition de $P_1$ sur $K_1$, de degré $\leqslant (n - 1)!$, convient, par multiplicativité.

      (ii) Par récurrence sur $[L:K]$. Si $[L:K] = 1$, $P$ est scindé sur $K$, donc $P'$ sur $K'$, et $L' = K'$.

      Sinon, soit $\alpha \in L \setminus K$ une racine de $P$, de polynôme minimal $\mu$ de degré $d \geqslant 2$, et $\mu'$ son image par $\varphi$, qui divise $P'$ et est scindé sur $L'$.

      Un prolongement de $\varphi$ à $K(\alpha) \cong K[X]/(\mu)$ est déterminé par l'image de $\alpha$, qui doit être une racine de $\mu'$ dans $L'$, et toute racine $\beta$ convient, puisque $K'[X]/(\mu') \cong K'(\beta)$. Il y a donc au moins un prolongement, et au plus $d$, exactement $d$ si les racines de $P'$ sont simples.

      $L$ est un corps de décomposition de $P$ sur $K(\alpha)$, et $L'$ de $P'$ sur $K'(\beta)$, avec
      $$[L:K(\alpha)] = \frac{[L:K]}{d} ;$$
      par récurrence, chacun de ces prolongements se prolonge à $L$ de $[L:K]/d$ façons au plus, exactement si les racines sont simples. On conclut par multiplicativité.

      (iii) Cas $K' = K$ et $\varphi = \mathrm{id}$ de (ii).
    remarques:
      - |
        Le corps de décomposition de $X^3 - 2$ sur $\lex{ensemble-rationnels}{\mathbb Q}$, vu dans $\lex{ensemble-complexes}{\mathbb C}$, est $\mathbb Q(\sqrt[3]{2}, j)$, où $j$ est une racine primitive cubique de l'unité : il est de degré $6 = 3!$, la borne de (i) étant atteinte. Celui de $X^3 - 3X + 1$ n'est que de degré $3$, une racine suffisant à exprimer les deux autres.

        ```schema gs-decomposition
        Les prolongements de l'identité de $\mathbb Q$ à $L = \mathbb Q(\sqrt[3]2, j)$, avec $\alpha = \sqrt[3]2$, se construisent comme dans la preuve de (ii) : l'image de $\alpha$ est l'une des trois racines de $X^3 - 2$, puis celle de $\alpha j$ l'une des deux racines restantes, qui sont celles du transporté de son polynôme minimal $X^2 + \alpha X + \alpha^2$ sur $\mathbb Q(\alpha)$. Les $3 \times 2 = 6 = [L:\mathbb Q]$ feuilles sont six automorphismes distincts, et la dernière ligne donne la permutation qu'ils induisent sur les racines $\alpha$, $\alpha j$, $\alpha j^2$, numérotées $1$, $2$, $3$.
        ```

  - id: gs-separabilite
    etiquette: Séparabilité
    nature: proposition
    titre: Polynômes séparables et caractéristique
    texte: |
      La dérivée $P'$ d'un polynôme $P$ est sa [[derivee-formelle|dérivée formelle]] ({{pol-derivee|Dérivée formelle}}). Un polynôme est [[polynome-separable|séparable]] s'il n'a que des racines simples dans un corps de décomposition. La **caractéristique** d'un corps $K$ est $0$ si le morphisme $\lex{ensemble-entiers-relatifs}{\mathbb Z} \to K$, $n \mapsto n \cdot 1$, est injectif, et sinon le générateur positif de son noyau.
    enonce: |
      (i) $\alpha$ est racine multiple de $P$ si et seulement si $P(\alpha) = P'(\alpha) = 0$.

      (ii) $P$ est séparable si et seulement si $P$ et $P'$ sont premiers entre eux dans $\lex{anneau-polynomes}{K[X]}$, c'est-à-dire si $(P, P') = K[X]$.

      (iii) La caractéristique d'un corps est $0$ ou un nombre premier $p$, et le sous-corps engendré par $1$ est alors isomorphe à $\lex{ensemble-rationnels}{\mathbb Q}$ ou à $\lex{anneau-zn}{\mathbb Z/p\mathbb Z}$.

      (iv) En caractéristique nulle, tout polynôme irréductible est séparable.
    preuve: |
      (i) C'est le point (ii) du nœud {{pol-derivee|Dérivée formelle}}, appliqué dans un corps contenant $\alpha$.

      (ii) L'idéal $(P, P')$ est engendré par le PGCD $D$ de $P$ et $P'$ ({{pol-principal|K[X] principal}}), qui divise $P$ et $P'$, et s'écrit $UP + VP'$. Si $D$ n'est pas constant, une racine de $D$ dans un corps de décomposition de $P$ est racine commune de $P$ et $P'$, donc multiple par (i). Réciproquement, une racine commune $\alpha$ de $P$ et $P'$ annulerait $UP + VP' = 1$.

      (iii) Le noyau est un idéal de $\mathbb Z$, de la forme $n\mathbb Z$ ({{z-ideaux|Idéaux de ℤ}}). Si $n = ab$ avec $1 < a, b < n$, alors $(a \cdot 1)(b \cdot 1) = 0$ dans le corps $K$, contradiction. L'image est $\mathbb Z/p\mathbb Z$ dans le second cas ; dans le premier, $\mathbb Z$ s'injecte dans $K$ et le morphisme se prolonge au corps des fractions $\mathbb Q$ ({{a-fractions|Corps des fractions}}).

      (iv) Si $P$ est irréductible de degré $n \geqslant 1$, $P'$ a pour coefficient dominant $n\,a_n \neq 0$, donc $P' \neq 0$ est de degré $< n$. Un diviseur commun non constant de $P$ et $P'$ serait, par irréductibilité, associé à $P$, et ne pourrait diviser $P'$. On conclut par (ii).
    remarques:
      - |
        En caractéristique $p$, l'irréductibilité ne suffit plus : sur le corps $\mathbb F_p(T)$ des fractions rationnelles, $X^p - T$ est irréductible, mais sa dérivée est nulle, et il s'écrit $(X - \alpha)^p$ dans un corps de décomposition. Les corps finis échappent à ce phénomène, comme le montrera le nœud {{gs-corps-finis|Corps finis}}.

  - id: gs-artin
    etiquette: Dedekind, Artin
    nature: théorème
    titre: Indépendance des caractères et théorème d'Artin
    texte: |
      Pour une extension $L/K$, on note $\lex{groupe-automorphismes}{\operatorname{Aut}}(L/K)$ le groupe des automorphismes du corps $L$ qui fixent chaque élément de $K$. Pour un groupe $G$ d'automorphismes de $L$, le **corps fixe** est $L^G = \{x \in L : \sigma(x) = x \text{ pour tout } \sigma \in G\}$.
    enonce: |
      (i) *Dedekind.* Des morphismes de corps $\sigma_1, \dots, \sigma_n : L \to M$ deux à deux distincts sont linéairement indépendants sur $M$ : si $\sum_i a_i\sigma_i(x) = 0$ pour tout $x \in L$, avec $a_i \in M$, alors tous les $a_i$ sont nuls.

      (ii) *Artin.* Si $G$ est un groupe fini d'automorphismes de $L$, alors $[L:L^G] = |G|$ et $\operatorname{Aut}(L/L^G) = G$.

      (iii) Pour toute extension finie, $|\operatorname{Aut}(L/K)| \leqslant [L:K]$.
    preuve: |
      (i) Supposons une relation non triviale, de longueur minimale $r \geqslant 2$, disons $\sum_{i=1}^r a_i\sigma_i = 0$ avec tous les $a_i \neq 0$. Soit $y$ tel que $\sigma_1(y) \neq \sigma_2(y)$. En appliquant la relation à $yx$ et en retranchant $\sigma_1(y)$ fois la relation, on obtient
      $$\sum_{i=2}^r a_i\big(\sigma_i(y) - \sigma_1(y)\big)\sigma_i = 0,$$
      relation non triviale plus courte : contradiction. Une relation de longueur $1$ est impossible, puisque $\sigma_1(1) = 1$.

      (iii) Si $[L:K] = m$ avec une base $(e_1, \dots, e_m)$ et si $\sigma_1, \dots, \sigma_n$ sont des éléments distincts de $\operatorname{Aut}(L/K)$ avec $n > m$, le système $\sum_i a_i\sigma_i(e_k) = 0$, $1 \leqslant k \leqslant m$, a $n$ inconnues et $m$ équations : il a une solution non nulle dans $L^n$ ({{v-rang|Théorème du rang}}). Par $K$-linéarité, $\sum_i a_i\sigma_i = 0$ sur $L$, ce que (i) interdit.

      (ii) Soit $K = L^G$ et $n = |G|$. L'inégalité (iii) donne $|G| \leqslant [L:K]$, puisque $G \subset \operatorname{Aut}(L/K)$.

      Réciproquement, soient $x_1, \dots, x_m \in L$ avec $m > n$. Le système $\sum_j \sigma(x_j)y_j = 0$, $\sigma \in G$, de $n$ équations à $m$ inconnues, a des solutions non nulles ; prenons-en une, $y$, ayant le moins possible de coordonnées non nulles, et normalisée par $y_1 = 1$.

      Pour $\tau \in G$, $\tau(y)$ est encore solution, les équations étant permutées, et $y - \tau(y)$ a moins de coordonnées non nulles, puisque sa première est nulle : donc $\tau(y) = y$, et $y \in \lex{n-uplet}{K^m}$. L'équation de $\sigma = \mathrm{id}$ donne $\sum x_jy_j = 0$ : les $x_j$ sont liés sur $K$. Donc $[L:K] \leqslant n$, et $[L:K] = |G|$.

      Enfin $G \subset \operatorname{Aut}(L/K)$, de cardinal au plus $[L:K] = |G|$ par (iii).
    remarques:
      - |
        Le théorème d'Artin renverse le point de vue de Galois : au lieu de partir d'un polynôme et de chercher le groupe de ses racines, on part d'un groupe d'automorphismes et l'on regarde ce qu'il fixe. Pour $L = \mathbb Q(\sqrt 2)$ et $G = \{\mathrm{id}, \sigma\}$ avec $\sigma(\sqrt 2) = -\sqrt 2$, on trouve $L^G = \lex{ensemble-rationnels}{\mathbb Q}$ et $[L:\mathbb Q] = 2 = |G|$.

  - id: gs-galoisiennes
    etiquette: Extensions galoisiennes
    nature: théorème
    titre: Extensions galoisiennes
    texte: |
      Une extension finie $L/K$ est [[extension-galoisienne|galoisienne]] si $L^{\lex{groupe-automorphismes}{\operatorname{Aut}}(L/K)} = K$. Son [[groupe-galois|groupe de Galois]] est alors $\lex{groupe-galois}{\operatorname{Gal}}(L/K) = \operatorname{Aut}(L/K)$.
    enonce: |
      Pour une extension finie $L/K$, sont équivalents :

      (a) $L$ est le corps de décomposition sur $K$ d'un polynôme séparable ;

      (b) $|\operatorname{Aut}(L/K)| = [L:K]$ ;

      (c) $L/K$ est galoisienne.

      Dans ce cas, le polynôme minimal de tout $\alpha \in L$ est séparable et scindé sur $L$ : ses racines sont les images $\sigma(\alpha)$, $\sigma \in \operatorname{Gal}(L/K)$.
    preuve: |
      (a) ⇒ (b) : le prolongement de l'identité de $K$ en automorphismes de $L$ se fait de exactement $[L:K]$ façons ({{gs-decomposition|Corps de décomposition}}, (ii), avec $L' = L$).

      (b) ⇒ (c) : par Artin ({{gs-artin|Dedekind, Artin}}), $[L:L^G] = |G| = [L:K]$ pour $G = \operatorname{Aut}(L/K)$, et $K \subset L^G$ ; par multiplicativité, $[L^G:K] = 1$.

      (c) ⇒ (a) : soit $G = \operatorname{Aut}(L/K)$, fini par Artin. Pour $\alpha \in L$, soient $\alpha_1 = \alpha, \dots, \alpha_r$ les éléments distincts de l'orbite $G\alpha$, et
      $$P_\alpha = \prod_i (X - \alpha_i).$$
      Tout $\sigma \in G$ permute les $\alpha_i$, donc fixe les coefficients de $P_\alpha$, qui sont dans $L^G = K$.

      Ainsi $\mu_\alpha$ divise $P_\alpha$ ; et tout $\alpha_i = \sigma(\alpha)$ annule $\mu_\alpha$, donc $P_\alpha$ divise $\mu_\alpha$ : $P_\alpha = \mu_\alpha$, séparable et scindé sur $L$.

      Si $(e_1, \dots, e_m)$ est une base de $L$ sur $K$, le produit des polynômes minimaux distincts des $e_k$, irréductibles et donc deux à deux premiers entre eux, est séparable, et $L$ en est un corps de décomposition.
    remarques:
      - |
        L'extension $\mathbb Q(\sqrt[3]{2})/\lex{ensemble-rationnels}{\mathbb Q}$ n'est pas galoisienne : ses seuls automorphismes fixent $\sqrt[3]2$, puisque les deux autres racines de $X^3 - 2$ ne sont pas réelles, et $|\operatorname{Aut}| = 1 < 3$.

        ```schema gs-galoisiennes
        Les trois racines de $X^3 - 2$ dans $\mathbb C$ sont $\alpha = \sqrt[3]2$, $\alpha j$ et $\alpha j^2$, aux sommets d'un triangle équilatéral inscrit dans le cercle de rayon $\alpha$. Le corps $\mathbb Q(\alpha)$ est contenu dans la droite réelle, qui ne porte que la racine $\alpha$ : un automorphisme de $\mathbb Q(\alpha)$, qui envoie $\alpha$ sur une racine de $X^3 - 2$ appartenant à $\mathbb Q(\alpha)$, fixe donc $\alpha$.
        ```

        L'erreur la plus répandue est d'oublier que le groupe de Galois n'est défini sans ambiguïté que pour une extension galoisienne ; pour une autre, on passe à sa clôture galoisienne, ici $\mathbb Q(\sqrt[3]2, j)$.

  - id: gs-correspondance
    etiquette: Théorème fondamental
    nature: théorème
    titre: La correspondance de Galois
    enonce: |
      Soit $L/K$ galoisienne de groupe $G$.

      (i) Les applications $H \mapsto L^H$ et $M \mapsto \lex{groupe-galois}{\operatorname{Gal}}(L/M)$ sont des bijections réciproques, décroissantes pour l'inclusion, entre les sous-groupes de $G$ et les corps intermédiaires $K \subset M \subset L$. De plus $[L:L^H] = |H|$ et $[L^H:K] = [G:H]$.

      (ii) $M/K$ est galoisienne si et seulement si $\operatorname{Gal}(L/M)$ est distingué dans $G$, et alors $\operatorname{Gal}(M/K) \cong G/\operatorname{Gal}(L/M)$.
    preuve: |
      (i) Pour un corps intermédiaire $M$, $L/M$ est galoisienne, car $L$ est le corps de décomposition sur $M$ du même polynôme séparable ({{gs-galoisiennes|Extensions galoisiennes}}, (a)) ; donc $L^{\operatorname{Gal}(L/M)} = M$.

      Pour un sous-groupe $H$, Artin ({{gs-artin|Dedekind, Artin}}) donne $\operatorname{Gal}(L/L^H) = H$ et $[L:L^H] = |H|$. Les deux applications sont donc réciproques ; elles renversent évidemment les inclusions. Enfin
      $$[L^H:K] = \frac{[L:K]}{[L:L^H]} = \frac{|G|}{|H|}$$
      par multiplicativité.

      (ii) Soit $H = \operatorname{Gal}(L/M)$. Pour $\sigma \in G$, $\operatorname{Gal}(L/\sigma(M)) = \sigma H\sigma^{-1}$.

      Si $H$ est distingué, tout $\sigma$ envoie $M$ dans $M = L^{\sigma H \sigma^{-1}}$, d'où un morphisme de restriction $G \to \lex{groupe-automorphismes}{\operatorname{Aut}}(M/K)$, de noyau $H$ ; son image est d'ordre $|G|/|H| = [M:K]$, donc égale à $\operatorname{Aut}(M/K)$ par Artin, et $M/K$ est galoisienne ({{gs-galoisiennes|Extensions galoisiennes}}, (b)), de groupe $G/H$ ({{a-isomorphisme|Isomorphisme}}).

      Réciproquement, si $M/K$ est galoisienne et $\alpha \in M$, les racines de $\mu_\alpha$ sont dans $M$, donc $\sigma(\alpha) \in M$ pour tout $\sigma \in G$ : $\sigma(M) = M$, et $\sigma H \sigma^{-1} = H$.
    remarques:
      - |
        Pour $L = \mathbb Q(\sqrt 2, \sqrt 3)$, le groupe de Galois a quatre éléments, déterminés par les signes de $\sqrt 2 \mapsto \pm\sqrt 2$ et $\sqrt 3 \mapsto \pm\sqrt 3$ : c'est $(\lex{anneau-zn}{\mathbb Z/2\mathbb Z})^2$. Ses trois sous-groupes d'ordre $2$ correspondent aux trois corps quadratiques $\mathbb Q(\sqrt 2)$, $\mathbb Q(\sqrt 3)$ et $\mathbb Q(\sqrt 6)$ ; il n'y en a pas d'autre, ce que la correspondance établit sans calcul.

        ```schema gs-correspondance
        On note $\sigma$ l'automorphisme qui change le signe de $\sqrt 2$ et fixe $\sqrt 3$, et $\tau$ celui qui fixe $\sqrt 2$ et change le signe de $\sqrt 3$. Le treillis des sous-groupes est dessiné renversé : chaque sous-groupe $H$ est à la hauteur de son corps fixe $L^H$, de la même couleur, ce qui rend visible le renversement des inclusions.
        ```

  - id: gs-corps-finis
    etiquette: Corps finis
    nature: théorème
    titre: Corps finis
    enonce: |
      (i) Un corps fini $F$ a pour cardinal $q = p^n$, où $p$ est sa caractéristique.

      (ii) Le groupe multiplicatif $F^\times$ est cyclique.

      (iii) Pour tout $p$ premier et tout $n \geqslant 1$, il existe un corps à $p^n$ éléments, unique à isomorphisme près : le corps de décomposition $\lex{corps-fini}{\mathbb F_{p^n}}$ de $X^{p^n} - X$ sur $\mathbb F_p = \lex{anneau-zn}{\mathbb Z/p\mathbb Z}$.

      (iv) $\mathbb F_{p^n}/\mathbb F_p$ est galoisienne, de groupe cyclique d'ordre $n$ engendré par le **Frobenius** $x \mapsto x^p$.
    preuve: |
      (i) La caractéristique n'est pas nulle, $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ ne s'injectant pas dans un ensemble fini ; elle est donc un premier $p$ ({{gs-separabilite|Séparabilité}}), et $F$ est un espace vectoriel de dimension finie $n$ sur $\mathbb F_p$, de cardinal $p^n$.

      (ii) Le groupe $F^\times$ est fini, et tout sous-groupe fini du groupe multiplicatif d'un corps est cyclique ({{gf-multiplicatif|Groupe multiplicatif}}, (iii)) : la preuve compte les éléments de chaque ordre, en bornant par $d$ le nombre de racines de $X^d - 1$ ({{pol-racines|Racines}}, (iii)).

      (iii) Si $|F| = q$, tout $x \in F^\times$ vérifie $x^{q-1} = 1$, donc tout $x \in F$ annule $X^q - X$, qui a $q$ racines distinctes dans $F$ et vaut donc $\prod_{x \in F}(X - x)$, les degrés et les coefficients dominants étant égaux ({{pol-racines|Racines}}, (iii)) : $F$ est un corps de décomposition de ce polynôme, d'où l'unicité ({{gs-decomposition|Corps de décomposition}}).

      Pour l'existence, $X^q - X$ a pour dérivée $-1$ en caractéristique $p$, donc est séparable ; ses $q$ racines dans un corps de décomposition forment un corps, car $(x + y)^q = x^q + y^q$ en caractéristique $p$ ({{pol-binome|Binôme de Newton}}, (iv)), tandis que $(xy)^q = x^qy^q$, $(x^{-1})^q = (x^q)^{-1}$ et $(-x)^q = -x^q$, puisque $(-1)^q = -1$ si $p$ est impair et que $-1 = 1$ si $p = 2$.

      (iv) Le Frobenius $\phi$ est un morphisme d'anneaux injectif, donc bijectif sur l'ensemble fini $F$, qui fixe $\mathbb F_p$.

      Si $\phi^k = \mathrm{id}$ avec $0 < k < n$, tout $x$ annulerait $X^{p^k} - X$, qui a au plus $p^k < p^n$ racines ({{pol-racines|Racines}}, (iii)) : $\phi$ est d'ordre $n$ dans $\lex{groupe-automorphismes}{\operatorname{Aut}}(F/\mathbb F_p)$, de cardinal au plus $n$ par Artin. Donc $\operatorname{Aut}(F/\mathbb F_p) = \langle\phi\rangle$, d'ordre $n = [F:\mathbb F_p]$.

      ```schema gs-corps-finis
      On réalise $\mathbb F_8$ comme $\mathbb F_2[X]/(X^3 + X + 1)$, ce polynôme de degré $3$ sans racine dans $\mathbb F_2$ étant irréductible, et l'on note $g$ la classe de $X$. Les sept éléments non nuls sont les puissances de $g$, aux sommets de l'heptagone, comme l'annonce (ii). Le Frobenius envoie $g^k$ sur $g^{2k}$ : il permute circulairement les sommets de chacun des deux triangles, il est donc d'ordre $3 = [\mathbb F_8 : \mathbb F_2]$. Les éléments $0$ et $1$, qui ne portent aucune flèche, sont ses seuls points fixes : il fixe exactement $\mathbb F_2$, comme l'annonce (iv).
      ```
    remarques:
      - |
        $\mathbb F_4 = \mathbb F_2[X]/(X^2 + X + 1)$ n'est pas $\mathbb Z/4\mathbb Z$, qui n'est pas même intègre, puisque $2 \cdot 2 = 0$. L'erreur la plus répandue est de confondre le corps à $p^n$ éléments avec l'anneau $\mathbb Z/p^n\mathbb Z$ ; ils n'ont le même cardinal que par coïncidence de notation.

  - id: gs-radicaux
    etiquette: Résolubilité par radicaux
    nature: théorème
    titre: Le théorème de Galois sur les radicaux
    texte: |
      On suppose $K$ de caractéristique nulle. Une extension $R/K$ est **radicale** s'il existe une tour $K = K_0 \subset K_1 \subset \cdots \subset K_r = R$ avec $K_i = K_{i-1}(\beta_i)$ et $\beta_i^{m_i} \in K_{i-1}$ pour des entiers $m_i \geqslant 1$. Un polynôme $P \in \lex{anneau-polynomes}{K[X]}$ est **résoluble par radicaux** si son corps de décomposition est contenu dans une extension radicale.
    enonce: |
      Si $P$ est résoluble par radicaux, le groupe de Galois de son corps de décomposition sur $K$ est résoluble.
    preuve: |
      *Réduction à une tour galoisienne.* Soit $R$ radicale contenant le corps de décomposition $L$ de $P$, avec les notations ci-dessus, et $m$ le produit des $m_i$.

      Soit $\Omega$ un corps de décomposition sur $K$ du produit $Q$ de $X^m - 1$ et des polynômes minimaux des $\beta_i$ sur $K$.

      On plonge $R$ dans $\Omega$ au-dessus de $K$ en envoyant successivement chaque $\beta_i$ sur une racine, dans $\Omega$, de l'image de son polynôme minimal sur $K_{i-1}$, qui divise le polynôme minimal de $\beta_i$ sur $K$ et est donc scindé sur $\Omega$ ({{gs-decomposition|Corps de décomposition}}, (ii)). On suppose désormais $R \subset \Omega$.

      En caractéristique nulle, $Q$ peut être pris séparable, en ne gardant que ses facteurs irréductibles distincts ({{gs-separabilite|Séparabilité}}), si bien que $\Omega/K$ est galoisienne de groupe $G$. Le corps $\Omega$ est engendré sur $K$ par les racines $m$-ièmes de l'unité et par les $\sigma(\beta_i)$, $\sigma \in G$ ({{gs-galoisiennes|Extensions galoisiennes}}).

      Ajoutons d'abord une racine primitive $m$-ième de l'unité $\zeta$ : $K_0' = K(\zeta)$. Puis ajoutons les $\sigma(\beta_1)$ pour tous les $\sigma$, puis les $\sigma(\beta_2)$, et ainsi de suite.

      Chaque élément ajouté a une puissance $m_i$-ième dans le corps précédent, puisque
      $$\sigma(\beta_i)^{m_i} = \sigma(\beta_i^{m_i})$$
      et que $\beta_i^{m_i} \in K(\beta_1, \dots, \beta_{i-1})$.

      On obtient une tour
      $$K \subset K_0' \subset K_1' \subset \cdots \subset K_s' = \Omega$$
      où chaque étage ajoute un élément $\gamma$ avec $\gamma^{k} \in$ l'étage précédent, $k \mid m$.

      *Chaque étage est galoisien abélien.* $K(\zeta)$ est le corps de décomposition de $X^m - 1$, dont les racines sont les $\zeta^j$ ; un automorphisme est déterminé par $\zeta \mapsto \zeta^{a}$, et deux tels automorphismes commutent.

      Pour un étage $E \subset E(\gamma)$ avec $\gamma^k = c \in E$ et $\zeta \in E$, $E(\gamma)$ est le corps de décomposition de $X^k - c$, dont les racines sont les $\zeta^{jm/k}\gamma$ ; un automorphisme envoie $\gamma$ sur $\eta\gamma$ avec $\eta^k = 1$, $\eta \in E$, et deux tels automorphismes commutent. Donc chaque étage est une extension galoisienne de groupe abélien.

      *Conclusion.* Notons $H_j = \lex{groupe-galois}{\operatorname{Gal}}(\Omega/K_j')$, avec $H_{-1} = G$. Comme $K_j'/K_{j-1}'$ est galoisienne, $H_j$ est distingué dans $H_{j-1}$ et $H_{j-1}/H_j \cong \operatorname{Gal}(K_j'/K_{j-1}')$ est abélien ({{gs-correspondance|Théorème fondamental}}, (ii), appliqué à l'extension galoisienne $\Omega/K_{j-1}'$). Donc $G$ est résoluble.

      Enfin $L/K$ est galoisienne, et $\operatorname{Gal}(L/K) \cong G/\operatorname{Gal}(\Omega/L)$ est un quotient de $G$, résoluble par {{gs-resolubles|Groupes résolubles}}, (ii).

      ```schema gs-radicaux
      Pour $P = X^3 - 2$ sur $\mathbb Q$, on prend l'extension radicale $R = \mathbb Q(\sqrt{-3}, \alpha)$, avec $\beta_1 = \sqrt{-3}$, $m_1 = 2$, et $\beta_2 = \alpha = \sqrt[3]2$, $m_2 = 3$ ; alors $m = 6$, $\zeta = -j^2 = e^{i\pi/3}$ et $\mathbb Q(\zeta) = \mathbb Q(j)$, et $\Omega$, corps de décomposition de $(X^6 - 1)(X^2 + 3)(X^3 - 2)$, est $\mathbb Q(j, \alpha)$. La tour de la preuve est $\mathbb Q \subset \mathbb Q(j) \subset \mathbb Q(j, \alpha) = \Omega$, les adjonctions de $\pm\sqrt{-3}$, de $\alpha j$ et de $\alpha j^2$ n'ajoutant rien. En face de chaque corps figure le groupe de Galois de $\Omega$ sur ce corps ; chaque étage, de degré $2$ puis $3$, a pour groupe le quotient abélien $\mathbb Z/2\mathbb Z$ puis $\mathbb Z/3\mathbb Z$ des deux groupes qui lui font face, et $G \supset H_0 \supset H_s = \{\mathrm{id}\}$ est la suite qui rend $G$ résoluble.
      ```
    remarques:
      - |
        La réciproque est vraie : un polynôme dont le groupe de Galois est résoluble est résoluble par radicaux. Elle demande la théorie de Kummer, qui montre qu'une extension cyclique de degré $n$, sur un corps contenant les racines $n$-ièmes de l'unité, est engendrée par un radical ; elle est admise ici.

  - id: gs-engendrer-sp
    etiquette: Engendrer 𝔖ₚ
    nature: lemme
    titre: Une transposition et un p-cycle engendrent 𝔖ₚ
    texte: |
      Pour des éléments distincts $a_1, \dots, a_k$ de $\{1, \dots, n\}$, le **$k$-cycle** $(a_1\ a_2\ \cdots\ a_k)$ est la permutation qui envoie $a_1$ sur $a_2$, …, $a_{k-1}$ sur $a_k$ et $a_k$ sur $a_1$, et qui fixe les autres éléments ; une transposition est un $2$-cycle ({{v-permutations|Permutations, signature}}).
    enonce: |
      Soit $p$ un nombre premier. Un sous-groupe de $\lex{groupe-symetrique}{\mathfrak S_p}$ qui contient une transposition et un élément d'ordre $p$ est $\mathfrak S_p$ tout entier.
    preuve: |
      Soit $H$ un tel sous-groupe, $\tau = (a\ b)$ la transposition et $\sigma$ l'élément d'ordre $p$. Pour $m \in \lex{ensemble-entiers-naturels}{\mathbb N}$, on a $\sigma^m = \mathrm{id}$ si et seulement si $p$ divise $m$ ({{gf-cycliques|Groupes cycliques}}, (i)).

      *Un élément d'ordre $p$ de $\mathfrak S_p$ est un $p$-cycle.* Pour $i \in \{1, \dots, p\}$, soit $k_i$ le plus petit entier $k \geqslant 1$ tel que $\sigma^k(i) = i$, qui existe puisque $\sigma^p = \mathrm{id}$. En divisant $p$ par $k_i$, $p = k_iq + r$ avec $0 \leqslant r < k_i$, on obtient $\sigma^r(i) = i$, donc $r = 0$ par minimalité : $k_i$ divise $p$, et vaut $1$ ou $p$. Les $k_i$ ne valent pas tous $1$, sans quoi $\sigma = \mathrm{id}$.

      Si $k_i = p$, les éléments $i, \sigma(i), \dots, \sigma^{p-1}(i)$ sont deux à deux distincts, puisque $\sigma^u(i) = \sigma^v(i)$ avec $0 \leqslant u < v < p$ donnerait $\sigma^{v-u}(i) = i$ ; ce sont donc tous les éléments de $\{1, \dots, p\}$, et $\sigma$ envoie chacun sur le suivant et le dernier sur $i$ : c'est le $p$-cycle $(i\ \ \sigma(i)\ \cdots\ \sigma^{p-1}(i))$.

      *Renumérotation.* L'orbite de $a$ sous $\sigma$ est donc tout $\{1, \dots, p\}$, et $b = \sigma^k(a)$ pour un $k$ tel que $1 \leqslant k \leqslant p - 1$. L'élément $\sigma^k$ est encore d'ordre $p$ : si $(\sigma^k)^j = \mathrm{id}$, alors $p$ divise $kj$, donc $j$ par le lemme d'Euclide ({{z-premiers|Nombres premiers}}), puisque $p$ ne divise pas $k$. C'est donc un $p$-cycle qui envoie $a$ sur $b$.

      Numérotons les éléments $a = 1$, $b = 2$, puis $\sigma^k(b) = 3$, et ainsi de suite : $H$ contient $\tau = (1\ 2)$ et $\rho = (1\ 2\ \cdots\ p)$, qui envoie $j$ sur $j + 1$ pour $j < p$ et $p$ sur $1$.

      *Toutes les transpositions.* Pour une permutation $\rho$ et une transposition $(u\ v)$, on a $\rho\,(u\ v)\,\rho^{-1} = (\rho(u)\ \rho(v))$, comme on le vérifie en $\rho(u)$, en $\rho(v)$ et aux autres points. Ainsi $\rho^j\tau\rho^{-j} = (1{+}j\ \ 2{+}j)$ appartient à $H$ pour $0 \leqslant j \leqslant p - 2$ : ce sont toutes les transpositions $(i\ \ i{+}1)$.

      Par la même formule,
      $$(j{-}1\ \ j)\,(i\ \ j{-}1)\,(j{-}1\ \ j) = (i\ \ j)$$
      pour $i < j - 1$ ; par récurrence sur $j - i$, $H$ contient toutes les transpositions.

      ```schema gs-engendrer-sp
      Pour $p = 5$, les sommets du pentagone sont $1, \dots, 5$, et $\rho = (1\ 2\ 3\ 4\ 5)$ le fait tourner d'un cran. La transposition $\tau = (1\ 2)$ est le côté rouge ; ses conjugués $\rho^j\tau\rho^{-j}$ sont les côtés obtenus en tournant, en bleu. Les diagonales, en vert, s'en déduisent par conjugaison, par exemple $(1\ 3) = (2\ 3)(1\ 2)(2\ 3)$.
      ```

      Toute permutation étant un produit de transpositions ({{v-permutations|Permutations, signature}}, (i)), $H = \mathfrak S_p$.
    remarques:
      - |
        L'hypothèse « $p$ premier » est nécessaire : dans $\mathfrak S_4$, la transposition $(1\ 3)$ et le $4$-cycle $(1\ 2\ 3\ 4)$ engendrent le groupe des huit isométries du carré de sommets $1, 2, 3, 4$, et non $\mathfrak S_4$, qui en a vingt-quatre. La preuve échoue à la renumérotation : $3 = \sigma^2(1)$, et $\sigma^2$ n'est pas un $4$-cycle.

  - id: gs-quintique
    etiquette: Le polynôme X⁵ − 4X + 2
    nature: proposition
    titre: Le polynôme X⁵ − 4X + 2 et ses racines
    enonce: |
      Le polynôme $P = X^5 - 4X + 2$ est irréductible sur $\lex{ensemble-rationnels}{\mathbb Q}$. Il a exactement trois racines réelles $r_1 < r_2 < r_3$, toutes simples, et deux racines complexes non réelles, conjuguées, $z$ et $\bar z$. Ainsi $P = (X - r_1)(X - r_2)(X - r_3)(X - z)(X - \bar z)$, et $L = \mathbb Q(r_1, r_2, r_3, z, \bar z) \subset \lex{ensemble-complexes}{\mathbb C}$ est un corps de décomposition de $P$ sur $\mathbb Q$.
    preuve: |
      *Irréductibilité.* Le polynôme $P = X^5 - 4X + 2$ est irréductible sur $\mathbb Q$, corps des fractions de $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, par le critère d'Eisenstein avec $p = 2$ ({{pol-eisenstein|Eisenstein}}, (i)).

      *Trois racines réelles, simples.* On a $P(-2) = -22$, $P(0) = 2$, $P(1) = -1$ et $P(2) = 26$ : par les valeurs intermédiaires ({{c-tvi|Valeurs intermédiaires}}), $P$ a une racine réelle dans chacun des intervalles $]{-2}, 0[$, $]0, 1[$ et $]1, 2[$, soit trois racines $r_1 < r_2 < r_3$.

      La fonction $x \mapsto P(x)$ est dérivable, de dérivée $x \mapsto 5x^4 - 4$ ({{ar-deriv|Dérivabilité}}), qui s'annule en au plus deux réels, puisque $x \mapsto x^4$ est paire et strictement croissante sur $[0, +\infty[$. Entre deux racines réelles de $P$ se trouve une racine de la dérivée, par le théorème de Rolle ({{de-rolle|Rolle}}) ; $P$ a donc au plus trois racines réelles, qui sont $r_1$, $r_2$, $r_3$.

      Elles sont simples : en une racine multiple $r$, on aurait $P(r) = P'(r) = 0$ ({{pol-derivee|Dérivée formelle}}, (ii)), donc $r^4 = \frac45$, puis
      $$0 = r \cdot r^4 - 4r + 2 = 2 - \frac{16}5 r,$$
      soit $r = \frac58$, alors que $\big(\frac58\big)^4 = \frac{625}{4096} \neq \frac45$.

      *Le facteur de degré $2$.* Les $r_i$ sont des racines distinctes de $P$ dans l'anneau intègre $\lex{ensemble-reels}{\mathbb R}$ ; donc $P = (X - r_1)(X - r_2)(X - r_3)\,Q$ avec $Q \in \lex{anneau-polynomes}{\mathbb R[X]}$ ({{pol-racines|Racines}}, (iii)), unitaire de degré $2$ comme le montrent les degrés et les coefficients dominants : $Q = X^2 + \beta X + \gamma$.

      Le polynôme $Q$ n'a pas de racine réelle, car une telle racine serait une racine réelle de $P$, donc l'un des $r_i$, qui serait alors racine double de $P$. Par la résolution du second degré dans $\lex{ensemble-complexes}{\mathbb C}$ ({{c-racines-carrees|Racines carrées complexes}}, (ii)), $Q$ a une racine $z = (-\beta + \delta)/2$, où $\delta^2 = \beta^2 - 4\gamma$, et $z$ n'est pas réel.

      Comme $Q$ est à coefficients réels, $Q(\bar z) = \overline{Q(z)} = 0$ ({{c-calcul|Conjugué, module}}, (ii)), avec $\bar z \neq z$ ; le produit $(X - z)(X - \bar z)$ divise donc $Q$ ({{pol-racines|Racines}}, (iii)), et lui est égal, les deux étant unitaires de degré $2$. Ainsi
      $$\begin{aligned} P = {}&(X - r_1)(X - r_2)(X - r_3) \\ &(X - z)(X - \bar z) \end{aligned}$$
      a cinq racines distinctes dans $\mathbb C$, et $L = \mathbb Q(r_1, r_2, r_3, z, \bar z) \subset \mathbb C$ est un corps de décomposition de $P$ sur $\mathbb Q$.

      ```schema gs-quintique
      Le graphe de $P$ coupe l'axe en trois points, et ne peut le couper davantage, puisque la dérivée ne s'annule qu'en $\pm c$, avec $c = (4/5)^{1/4}$. Les deux autres racines, celles du facteur $Q$ de degré $2$, sont $z$ et $\bar z$ ; la conjugaison complexe les échange en fixant les trois racines réelles.
      ```
    remarques:
      - |
        Le corps $L$ a été construit dans $\mathbb C$ sans le théorème de {{c-dalembert|d'Alembert-Gauss}}, admis au chapitre des nombres complexes : l'analyse réelle a fourni trois racines, et le second degré les deux autres. Un corps de décomposition abstrait aurait suffi pour définir le groupe de Galois de $P$ ({{gs-decomposition|Corps de décomposition}}), mais c'est la conjugaison complexe, donc la présence des racines dans $\mathbb C$, qui fournira la transposition, au nœud {{gs-abel-ruffini|Abel-Ruffini}}.

  - id: gs-abel-ruffini
    etiquette: Abel-Ruffini
    nature: théorème
    titre: Un polynôme de degré 5 non résoluble par radicaux
    enonce: |
      Le groupe de Galois sur $\lex{ensemble-rationnels}{\mathbb Q}$ du polynôme $P = X^5 - 4X + 2$ est $\lex{groupe-symetrique}{\mathfrak S_5}$ ; ce polynôme n'est donc pas résoluble par radicaux.
    preuve: |
      Soit $L \subset \mathbb C$ le corps de décomposition de $P$ obtenu au nœud {{gs-quintique|Le polynôme X⁵ − 4X + 2}}, où $P$ a trois racines réelles $r_1, r_2, r_3$ et deux racines conjuguées $z$, $\bar z$, toutes distinctes.

      *Une transposition.* Le polynôme $P$, qui a cinq racines distinctes dans $L$, est séparable ; donc $L/\mathbb Q$ est galoisienne ({{gs-galoisiennes|Extensions galoisiennes}}, (a)). Soit $G = \lex{groupe-galois}{\operatorname{Gal}}(L/\mathbb Q)$.

      Tout élément de $G$ envoie une racine de $P$ sur une racine de $P$, et il est déterminé par la permutation des racines qu'il induit, puisqu'elles engendrent $L$ : $G$ s'identifie à un sous-groupe de $\mathfrak S_5$.

      La conjugaison complexe est un automorphisme de $\mathbb C$ qui fixe $\mathbb R$ ({{c-automorphismes|Automorphismes}}) ; elle envoie les racines de $P$, polynôme à coefficients réels, sur des racines de $P$, donc $L$ sur $L$. Sa restriction à $L$ est un élément de $G$ qui fixe $r_1$, $r_2$, $r_3$ et échange $z$ et $\bar z$ : c'est une transposition.

      *Un élément d'ordre $5$.* Le polynôme $P$, unitaire, irréductible et annulateur de $r_1$, en est le polynôme minimal, et $[\mathbb Q(r_1):\mathbb Q] = 5$ ({{gs-algebriques|Polynôme minimal}}, (i) et (ii)). Par multiplicativité ({{gs-extensions|Extensions, degré}}), $5$ divise $[L:\mathbb Q] = |G|$ ({{gs-galoisiennes|Extensions galoisiennes}}, (b)), et $G$ contient un élément d'ordre $5$ par le théorème de Cauchy ({{gs-cauchy|Cauchy}}).

      *Conclusion.* Par le lemme du nœud {{gs-engendrer-sp|Engendrer 𝔖ₚ}}, $G = \mathfrak S_5$, qui n'est pas résoluble ({{gs-sn|𝔖ₙ non résoluble}}). Par le théorème de Galois ({{gs-radicaux|Résolubilité par radicaux}}), $P$ n'est pas résoluble par radicaux.
    remarques:
      - |
        Le théorème d'Abel-Ruffini n'affirme pas qu'aucune équation de degré $5$ n'est résoluble par radicaux : $X^5 - 2$ l'est évidemment, et $X^5 - 5X + 12$ aussi, son groupe étant le groupe diédral d'ordre $10$. Il affirme qu'il n'existe pas de **formule générale**, et Galois a donné le critère exact : la résolubilité du groupe.
      - |
        L'argument de ce nœud et du nœud {{gs-quintique|Le polynôme X⁵ − 4X + 2}} vaut pour tout polynôme irréductible sur $\mathbb Q$ de degré premier $p$ ayant exactement $p - 2$ racines réelles : le quotient par les facteurs réels est de degré $2$ sans racine réelle, la conjugaison fournit une transposition, et le théorème de Cauchy un élément d'ordre $p$ ; son groupe est donc $\mathfrak S_p$.

        L'analyse réelle y fournit la transposition, et l'algèbre le $p$-cycle ; c'est une rencontre caractéristique des deux disciplines.

