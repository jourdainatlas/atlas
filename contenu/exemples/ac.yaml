# Exemples du lexique : théorie « Algèbre commutative » (ac).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  divisibilite-anneau:
    - |
      Dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, on a $3 \mid -6$, et $2$ et $-2$ se divisent l'un l'autre sans être égaux : ils sont [[elements-associes|associés]]. La divisibilité n'est donc pas une relation d'ordre sur $\mathbb Z$, faute d'antisymétrie ; elle l'est seulement à association près, c'est-à-dire sur les idéaux $a\mathbb Z$, ordonnés par l'inclusion renversée.
    - |
      Dans un [[corps]], la divisibilité est sans intérêt : tout élément non nul $a$ divise tout $b$, puisque $b = a \cdot a^{-1}b$. Ainsi $\overline 2$ divise $\overline 1$ dans $\lex{anneau-zn}{\mathbb Z/5\mathbb Z}$, car $\overline 2 \cdot \overline 3 = \overline 1$, alors que $2$ ne divise pas $1$ dans $\mathbb Z$. Un même énoncé « $a$ divise $b$ » dépend donc de l'anneau où on le lit.
    - |
      La divisibilité des polynômes dépend de l'anneau des coefficients. Dans $\mathbb Z[X]$, $X + 1$ ne divise pas $X^2 + 1$, puisque le reste de la division par $X + 1$ est la valeur en $-1$, qui vaut $2$ ({{pol-racines|Racines et multiplicités}}, (i)). Dans $(\mathbb Z/2\mathbb Z)[X]$, en revanche,
      $$(X + \overline 1)^2 = X^2 + \overline 2X + \overline 1 = X^2 + \overline 1,$$
      de sorte que $X + \overline 1$ divise $X^2 + \overline 1$ : réduire les coefficients modulo $2$ crée des divisibilités nouvelles.
