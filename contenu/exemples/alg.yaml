# Exemples du lexique : théorie « Structures algébriques » (alg).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  corps:
    - |
      Le plus petit corps a deux éléments. Sur un ensemble $\{0, 1\}$ à deux éléments distincts, posons $0 + 0 = 1 + 1 = 0$, $0 + 1 = 1 + 0 = 1$, et $xy = 1$ si et seulement si $x = y = 1$. On vérifie sur les tables, en parcourant les cas, que l'on obtient un [[anneau-commutatif|anneau commutatif]] ; il est non nul, et son seul élément non nul, $1$, est son propre inverse. C'est donc un corps, dans lequel $1 + 1 = 0$ : la somme de termes égaux à $1$ peut être nulle dans un corps.
    - |
      Les deux conclusions du nœud {{a-corps|Corps}} tombent pour un anneau qui n'est pas un corps. Soit $a \neq b$ et $\mathcal P(\{a, b\})$, muni de la différence symétrique et de l'intersection ({{a-anneau|Anneaux}}, (v)). On a $\{a\} \cap \{b\} = \varnothing$, produit nul de deux éléments non nuls : l'anneau n'est pas [[anneau-integre|intègre]], contrairement au point (i). La restriction $X \mapsto X \cap \{a\}$ est un [[morphisme-anneaux|morphisme d'anneaux]] vers $\mathcal P(\{a\})$, puisque $(X \mathbin{\triangle} Y) \cap \{a\} = (X \cap \{a\}) \mathbin{\triangle} (Y \cap \{a\})$ par la distributivité du point (v), que $(X \cap Y) \cap \{a\} = (X \cap \{a\}) \cap (Y \cap \{a\})$, et qu'elle envoie l'unité $\{a, b\}$ sur l'unité $\{a\}$ ; elle envoie $\{b\}$ sur $\varnothing$ ; elle n'est pas injective, contrairement au point (iii). Pour un seul point, $\mathcal P(\{a\}) = \{\varnothing, \{a\}\}$ est le corps à deux éléments du premier exemple.
    - |
      Dans l'anneau nul $\{0\}$, tout élément non nul est inversible, faute d'élément non nul. C'est la condition $1 \neq 0$ qui l'exclut des corps, et c'est aussi pourquoi le point (ii) de {{a-corps|Corps}} exige $A \neq \{0\}$ : l'anneau nul n'a qu'un idéal, qui est à la fois $\{0\}$ et l'anneau entier, et il satisferait sinon la condition sur les idéaux.

  groupe-abelien:
    - |
      L'ensemble $\lex{ensemble-parties}{\mathcal P}(E)$, muni de la différence symétrique $X \mathbin{\triangle} Y = (X \setminus Y) \cup (Y \setminus X)$, est un groupe abélien. Un point appartient à $(X \mathbin{\triangle} Y) \mathbin{\triangle} Z$ si et seulement s'il appartient à une seule des trois parties ou aux trois, et l'on trouve la même condition pour $X \mathbin{\triangle} (Y \mathbin{\triangle} Z)$ : la loi est associative. Elle est commutative, de neutre $\varnothing$, et chaque partie est son propre symétrique, puisque $X \mathbin{\triangle} X = \varnothing$.
    - |
      Le [[groupe-symetrique|groupe symétrique]] d'un ensemble qui contient trois éléments distincts $a$, $b$, $c$ n'est pas abélien. Notons $\tau_{ab}$ la bijection qui échange $a$ et $b$ et fixe les autres points, et de même $\tau_{bc}$. Alors $\tau_{ab} \circ \tau_{bc}$ envoie $a$ sur $b$, tandis que $\tau_{bc} \circ \tau_{ab}$ envoie $a$ sur $c$ : les deux composées diffèrent. Le seuil de trois éléments est exact : si $E = \{a, b\}$, le groupe symétrique de $E$ n'a que deux éléments, l'identité et $\tau_{ab}$, et il est abélien.
    - |
      Un groupe dans lequel tout élément vérifie $x^2 = e$ est abélien, ce qui explique le premier exemple. On a alors $x^{-1} = x$ pour tout $x$, d'où
      $$xy = (xy)^{-1} = y^{-1}x^{-1} = yx.$$
      La réciproque est fausse. Soit $\rho$ la bijection de $\{a, b, c\}$ qui envoie $a$ sur $b$, $b$ sur $c$ et $c$ sur $a$. Comme $\rho \circ \rho \circ \rho = \mathrm{id}$, les trois bijections $\mathrm{id}$, $\rho$ et $\rho \circ \rho$ forment un groupe pour la composition, abélien puisque ses éléments sont des composées de $\rho$ avec elle-même. Pourtant $\rho \circ \rho$ envoie $a$ sur $c$ : ce n'est pas l'identité.

  morphisme-anneaux:
    - |
      Pour un ensemble $E$, l'ensemble $\lex{ensemble-parties}{\mathcal P}(E)$, muni de la différence symétrique $X \mathbin{\triangle} Y = (X \setminus Y) \cup (Y \setminus X)$ comme addition et de l'intersection comme multiplication, est un anneau commutatif, de zéro $\varnothing$ et d'unité $E$ ({{a-anneau|Anneaux}}, (v)). Pour $F \subset E$, la restriction $X \mapsto X \cap F$ est un morphisme d'anneaux de $\mathcal P(E)$ dans $\mathcal P(F)$. Un point de $F$ appartient en effet à $(X \mathbin{\triangle} Y) \cap F$ si et seulement s'il appartient à une seule des parties $X$ et $Y$, c'est-à-dire à une seule des parties $X \cap F$ et $Y \cap F$ ; la restriction respecte aussi l'intersection, et elle envoie l'unité $E$ sur l'unité $F$ de $\mathcal P(F)$.
    - |
      Dans la même situation, avec $F \neq E$, l'inclusion $X \mapsto X$ de $\mathcal P(F)$ dans $\mathcal P(E)$ respecte la somme et le produit, mais elle envoie l'unité $F$ de $\mathcal P(F)$ sur $F$, qui n'est pas l'unité $E$ de $\mathcal P(E)$. Ce n'est donc pas un morphisme d'anneaux, et $\mathcal P(F)$, partie stable pour les deux lois, n'est pas un [[sous-anneau]] de $\mathcal P(E)$ : la condition $f(1) = 1$ est exactement ce qui manque.
    - |
      L'anneau nul $\{0\}$ est un cas limite. Pour tout anneau $A$, l'application constante $A \to \{0\}$ est un morphisme d'anneaux, puisque l'unité de $\{0\}$ est $0$. En sens inverse, il n'existe aucun morphisme de $\{0\}$ vers un anneau $A$ non nul : il devrait envoyer $0$ à la fois sur $0$ et, puisque $1 = 0$ dans $\{0\}$, sur l'unité de $A$, qui en diffère.

  loi-associative:
    - |
      Sur $\lex{ensemble-parties}{\mathcal P}(E)$, la réunion et l'intersection sont associatives, mais la différence $(X, Y) \mapsto X \setminus Y$ ne l'est pas dès que $E$ est non vide. Pour $X = Y = Z = E$, on trouve
      $$\begin{aligned} (E \setminus E) \setminus E &= \varnothing, \\ E \setminus (E \setminus E) &= E \setminus \varnothing = E. \end{aligned}$$
      Une seule paire de parenthésages qui diffèrent suffit à ruiner l'associativité.
    - |
      Sur tout ensemble $E$, la loi $x \ast y = y$ est associative, puisque $(x \ast y) \ast z$ et $x \ast (y \ast z)$ valent tous deux $z$. Elle n'est pas [[loi-commutative|commutative]] dès que $E$ contient deux éléments distincts $a$ et $b$, car $a \ast b = b$ et $b \ast a = a$ : l'associativité ne donne pas la commutativité.
    - |
      La réciproque est fausse aussi. Sur $E = \{a, b\}$, avec $a \neq b$, posons $x \ast y = b$ si $x = y = a$, et $x \ast y = a$ dans les trois autres cas. Cette loi est commutative par construction, mais
      $$\begin{aligned} (a \ast a) \ast b &= b \ast b = a, \\ a \ast (a \ast b) &= a \ast a = b, \end{aligned}$$
      de sorte qu'elle n'est pas associative. Si l'on lit $a$ comme « vrai » et $b$ comme « faux », c'est la table du [[connecteur]] « non et » de la logique propositionnelle.
