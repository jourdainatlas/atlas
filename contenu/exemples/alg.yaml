# Exemples du lexique : théorie « Structures algébriques » (alg).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  groupe:
    - |
      Un [[monoide|monoïde]] n'est un groupe que si tout élément y a un symétrique. Dans $(\lex{ensemble-parties}{\mathcal P}(E), \cup)$, de neutre $\varnothing$, l'égalité $X \cup Y = \varnothing$ force $X = Y = \varnothing$ : seul $\varnothing$ est [[inversible]], et ce monoïde n'est pas un groupe dès que $E$ est non vide. Le point (i) de {{a-groupe|Groupes}} en extrait tout de même un groupe, celui de ses inversibles, réduit ici à $\{\varnothing\}$.
    - |
      Sur un ensemble $\{e, x\}$ formé de deux éléments distincts, il existe une seule loi de groupe de neutre $e$. La neutralité fixe $ee$, $ex$ et $xe$ ; si l'on avait $xx = x$, c'est-à-dire $xx = xe$, la régularité de $x$ ({{a-monoide|Monoïde}}, (iii)) donnerait $x = e$. Donc $xx = e$. C'est la table de $\mathfrak S(\{a, b\})$, dont les éléments sont l'identité et la bijection $\tau_{ab}$ qui échange $a$ et $b$, avec $\tau_{ab} \circ \tau_{ab} = \mathrm{id}$ : la loi est donc associative, et tout groupe à deux éléments a la même table que ce [[groupe-symetrique|groupe symétrique]].
    - |
      Dans les axiomes, les côtés ne se mélangent pas impunément. Sur un ensemble qui contient deux éléments distincts $a$ et $b$, la loi $x \ast y = y$ est [[loi-associative|associative]] ; tout élément $e$ y est neutre à gauche, puisque $e \ast x = x$, et tout $x$ a un symétrique à droite relativement à $e$, puisque $x \ast e = e$. Ce n'est pourtant pas un groupe, faute de neutre : un neutre $n$ vérifierait $a = a \ast n = n$, et de même $b = n$, alors que $a \neq b$.

  anneau:
    - |
      La commutativité de l'addition, exigée par la définition, découle en fait des autres axiomes. Développons $(1 + 1)(x + y)$ par la distributivité à gauche puis à droite, et dans l'ordre inverse ; l'associativité de l'addition donne
      $$\begin{aligned} (1 + 1)(x + y) &= (x + x) + (y + y) \\ &= x + \big((x + y) + y\big), \\ (1 + 1)(x + y) &= (x + y) + (x + y) \\ &= x + \big((y + x) + y\big). \end{aligned}$$
      En simplifiant par $x$ à gauche et par $y$ à droite dans le [[groupe]] $(A, +)$ ({{a-monoide|Monoïde}}, (iii)), on obtient $x + y = y + x$. L'unité est indispensable à ce calcul. Sur $\mathfrak S(\{a, b, c\})$, prenons la composition pour addition et la loi constante $(x, y) \mapsto \mathrm{id}$ pour produit : ce produit est associatif et distributif des deux côtés, sans unité, et l'addition n'est pas commutative ({{a-groupe|Groupes}}, (ii)).
    - |
      Remplacer la différence symétrique par la réunion ne donne pas un anneau. Sur $\lex{ensemble-parties}{\mathcal P}(E)$, la réunion est associative et commutative, de neutre $\varnothing$, et l'intersection est associative, d'unité $E$, et distributive sur la réunion des deux côtés. Mais $(\mathcal P(E), \cup)$ n'est pas un groupe dès que $E$ est non vide, puisque l'équation $E \cup Y = \varnothing$ n'a pas de solution. C'est la différence symétrique, retenue au point (v) de {{a-anneau|Anneaux}}, qui fournit les opposés.
    - |
      La distributivité à gauche ne découle pas de la distributivité à droite. Soit $G = \mathcal P(\{p\}) = \{\varnothing, P\}$, avec $P = \{p\}$, muni de la différence symétrique, et l'ensemble $G^G$ des [[application|applications]] de $G$ dans $G$, avec la somme $(f + g)(X) = f(X) \mathbin{\triangle} g(X)$ et la composition pour produit. On a toujours $(g + h) \circ f = g \circ f + h \circ f$, par définition de la somme. Mais si $f$ est constante de valeur $P$, alors $f \circ (g + h) = f$, tandis que $f \circ g + f \circ h$ est constante de valeur $P \mathbin{\triangle} P = \varnothing$. Le point (i) de {{a-anneau|Anneaux}} tombe avec elle, puisque $f \circ 0 = f$ n'est pas nul. Si $f$ respecte la différence symétrique, en revanche, l'égalité $f(g(X) \mathbin{\triangle} h(X)) = f(g(X)) \mathbin{\triangle} f(h(X))$ rétablit la distributivité à gauche.

  corps:
    - |
      Le plus petit corps a deux éléments. Sur un ensemble $\{0, 1\}$ à deux éléments distincts, posons $0 + 0 = 1 + 1 = 0$, $0 + 1 = 1 + 0 = 1$, et $xy = 1$ si et seulement si $x = y = 1$. Ce sont les tables de la différence symétrique et de l'intersection sur $\lex{ensemble-parties}{\mathcal P}(\{p\}) = \{\varnothing, \{p\}\}$, en remplaçant $\varnothing$ par $0$ et $\{p\}$ par $1$ : on obtient donc un [[anneau-commutatif|anneau commutatif]] ({{a-anneau|Anneaux}}, (v), avec $E = \{p\}$) ; il est non nul, et son seul élément non nul, $1$, est son propre inverse. C'est donc un corps, dans lequel $1 + 1 = 0$ : la somme de termes égaux à $1$ peut être nulle dans un corps.
    - |
      Les deux conclusions du nœud {{a-corps|Corps}} tombent pour un anneau qui n'est pas un corps. Soit $a \neq b$ et $\mathcal P(\{a, b\})$, muni de la différence symétrique et de l'intersection ({{a-anneau|Anneaux}}, (v)). On a $\{a\} \cap \{b\} = \varnothing$, produit nul de deux éléments non nuls : l'anneau n'est pas [[anneau-integre|intègre]], contrairement au point (i). La restriction $X \mapsto X \cap \{a\}$ est un [[morphisme-anneaux|morphisme d'anneaux]] vers $\mathcal P(\{a\})$, puisque $(X \mathbin{\triangle} Y) \cap \{a\} = (X \cap \{a\}) \mathbin{\triangle} (Y \cap \{a\})$ par la distributivité du point (v), que $(X \cap Y) \cap \{a\} = (X \cap \{a\}) \cap (Y \cap \{a\})$, et qu'elle envoie l'unité $\{a, b\}$ sur l'unité $\{a\}$ ; elle envoie $\{b\}$ sur $\varnothing$ ; elle n'est pas injective, contrairement au point (iii). Pour un seul point, $\mathcal P(\{a\}) = \{\varnothing, \{a\}\}$ est le corps à deux éléments du premier exemple.
    - |
      Dans l'anneau nul $\{0\}$, tout élément non nul est inversible, faute d'élément non nul. C'est la condition $1 \neq 0$ qui l'exclut des corps, et c'est aussi pourquoi le point (ii) de {{a-corps|Corps}} exige $A \neq \{0\}$ : l'anneau nul n'a qu'un idéal, qui est à la fois $\{0\}$ et l'anneau entier, et il satisferait sinon la condition sur les idéaux.

  loi-composition:
    - |
      La réunion, l'intersection, la différence $X \setminus Y$ et la différence symétrique sont des lois de composition interne sur $\lex{ensemble-parties}{\mathcal P}(E)$, et la composition en est une sur l'ensemble $E^E$ des [[application|applications]] de $E$ dans $E$. En revanche, si $E$ contient deux points distincts $a$ et $b$, l'intersection n'est pas une loi sur l'ensemble des parties non vides de $E$, puisque $\{a\} \cap \{b\} = \varnothing$ : le résultat doit rester dans l'ensemble.
    - |
      Une loi doit être définie sur tout $E \times E$. Sur l'ensemble des [[bijection|bijections]] de $E$ sur lui-même, $(f, g) \mapsto f^{-1} \circ g$ est une loi de composition interne, puisque la réciproque d'une bijection et la composée de deux bijections sont des bijections. Sur $E^E$ tout entier, la même formule ne définit rien dès que $E$ contient deux points distincts $a$ et $b$ : l'application constante de valeur $a$ n'est pas [[injection|injective]], et n'a donc pas de réciproque.

  element-neutre:
    - |
      Le neutre dépend de la loi, et non du seul ensemble. Sur $\lex{ensemble-parties}{\mathcal P}(E)$, la partie vide est neutre pour la réunion et pour la différence symétrique, mais elle est absorbante pour l'intersection, puisque $X \cap \varnothing = \varnothing$ ; le neutre de l'intersection est $E$. Sur l'ensemble $E^E$ des applications de $E$ dans $E$, muni de la composition, le neutre est l'[[identite|identité]] de $E$.
    - |
      L'unicité du neutre demande les deux côtés. Sur un ensemble qui contient deux éléments distincts, muni de la loi $x \ast y = y$, tout élément $e$ est neutre à gauche, puisque $e \ast x = x$ : il y a plusieurs neutres à gauche, et aucun neutre. La preuve de {{a-loi|Lois de composition interne}} écrit en effet $e = e \ast e'$, ce qui demande que $e'$ soit neutre à droite. De même, pour la différence $X \setminus Y$ sur $\mathcal P(E)$, avec $E$ non vide, $\varnothing$ est neutre à droite sans l'être à gauche, puisque $\varnothing \setminus E = \varnothing$.
    - |
      Une [[partie-stable|partie stable]] peut avoir pour la loi induite un neutre qui n'est pas celui de la loi. Pour un point $a$ de $E$, les parties de $E$ qui contiennent $a$ forment une partie de $\mathcal P(E)$ stable par réunion. Pour la loi induite, le neutre est $\{a\}$, puisque $X \cup \{a\} = X$ dès que $a \in X$, alors que le neutre $\varnothing$ de la réunion n'appartient pas à cette partie.

  monoide:
    - |
      Sur $\lex{ensemble-parties}{\mathcal P}(E)$, la réunion et l'intersection font deux monoïdes [[loi-commutative|commutatifs]], de neutres respectifs $\varnothing$ et $E$. Dans chacun d'eux, le neutre est le seul élément [[inversible]] : $X \cup Y = \varnothing$ force $X = \varnothing$, et $X \cap Y = E$ force $X = E$. Un monoïde peut ainsi n'avoir que son neutre pour inversible.
    - |
      Une loi associative sans neutre ne fait pas un monoïde, même à l'intérieur d'un monoïde. Supposons que $E$ contienne deux points distincts, et notons $c_x$ l'application constante de valeur $x$. Les constantes forment une [[partie-stable|partie stable]] de $E^E$, puisque $c_x \circ f = c_x$ pour toute $f$, et la loi induite est associative. Elle n'a pourtant pas de neutre : si $c_z$ en était un, on aurait $c_x = c_z \circ c_x = c_z$, donc $x = z$, pour tout $x$, ce qu'exclut l'existence de deux points distincts. Le neutre $\mathrm{id}_E$ de $E^E$ n'est pas constant.

  inversible:
    - |
      Soit $E = \{a, b\}$, avec $a \neq b$. Une application de $E$ dans $E$ est déterminée par les images de $a$ et de $b$ : les éléments du [[monoide|monoïde]] $E^E$ sont l'identité, l'échange $s$ de $a$ et $b$, et les deux constantes $c_a$ et $c_b$. L'identité et $s$ sont inversibles, puisque $s \circ s = \mathrm{id}$. Les constantes ne le sont pas, puisque $c_a \circ g = c_a$ pour toute $g$, et de même pour $c_b$. On retrouve que les inversibles de $E^E$ sont les [[bijection|bijections]] ({{r-inverses|Bijection réciproque}}).
    - |
      L'inverse d'un produit se prend dans l'ordre inverse. Soit $E = \{a, b, c\}$, de points distincts, et $\tau_{ab}$ la bijection qui échange $a$ et $b$ en fixant $c$, de même $\tau_{bc}$. Le produit $\tau_{ab} \circ \tau_{bc}$ envoie $a$ sur $b$, $b$ sur $c$ et $c$ sur $a$ ; son inverse est $\tau_{bc} \circ \tau_{ab}$, qui envoie $a$ sur $c$. Or $\tau_{ab}^{-1} \circ \tau_{bc}^{-1} = \tau_{ab} \circ \tau_{bc}$, chaque échange étant son propre inverse, et ce n'est pas l'inverse cherché : $(\tau_{ab} \circ \tau_{bc}) \circ (\tau_{ab} \circ \tau_{bc})$ envoie $a$ sur $c$, et n'est pas l'identité.
    - |
      Dans un monoïde [[loi-commutative|commutatif]], si $xy$ est inversible, $x$ l'est aussi : pour $z = y(xy)^{-1}$, on a $xz = (xy)(xy)^{-1} = e$, et $zx = xz$. Sans commutativité, la conclusion tombe, et l'axiome de l'infini le montre avant les entiers. Soit $I$ un ensemble [[inductif-successeur|inductif]] et $s : I \to I$, $x \mapsto x \cup \{x\}$. Elle est injective, puisque $x \cup \{x\} = y \cup \{y\}$ avec $x \neq y$ donnerait $x \in y$ et $y \in x$, ce qu'exclut {{zf-bienfonde|Aucun ensemble n'appartient à lui-même}}. Soit $g : I \to I$ l'application qui envoie chaque $x \cup \{x\}$ sur $x$, ce qui a un sens puisque $s$ est injective, et tout autre point sur $\varnothing$. Alors $g \circ s = \mathrm{id}_I$, et pourtant ni $s$ ni $g$ n'est inversible dans $I^I$ : $s$ n'atteint pas $\varnothing$, qui n'a aucun élément alors que $x \cup \{x\}$ contient $x$, et $g$ envoie $\varnothing$ et $\{\varnothing\} = s(\varnothing)$ sur $\varnothing$.

  sous-groupe:
    - |
      Pour un point $c$ d'un ensemble $E$, les bijections de $E$ qui fixent $c$ forment un sous-groupe du [[groupe-symetrique|groupe symétrique]] $\mathfrak S(E)$. Il contient l'identité, et si $g(c) = h(c) = c$, alors $h^{-1}(c) = c$ et $(g \circ h^{-1})(c) = c$, ce qui suffit par le point (i) de {{a-sous-groupe|Sous-groupes}}. Pour $E = \{a, b, c\}$, de points distincts, c'est $\{\mathrm{id}, \tau_{ab}\}$, où $\tau_{ab}$ échange $a$ et $b$ : une bijection qui fixe $c$ laisse $\{a, b\}$ stable, et y induit l'identité ou l'échange.
    - |
      Contenir le neutre et être stable par passage au symétrique ne suffit pas. Dans $\mathfrak S(\{a, b, c\})$, la partie formée de l'identité et des trois bijections $\tau_{ab}$, $\tau_{bc}$, $\tau_{ac}$, qui échangent deux points en fixant le troisième, vérifie ces deux conditions, chaque échange étant son propre symétrique. Ce n'est pas un sous-groupe, puisque $\tau_{ab} \circ \tau_{bc}$ envoie $a$ sur $b$, $b$ sur $c$ et $c$ sur $a$, et ne fixe donc aucun point. Le critère (i) demande aussi $H$ non vide : sans cette hypothèse, la partie vide le satisferait par vacuité.

  morphisme-groupes:
    - |
      Soit $E = \{a, b, c\}$, de points distincts, avec les notations du point (iv) de {{a-groupe|Groupes}} : l'ensemble $C$ des trois échanges $\tau_{ab}$, $\tau_{bc}$, $\tau_{ac}$ a pour complémentaire dans $\mathfrak S(E)$ le [[sous-groupe]] $H = \{\mathrm{id}, \rho, \rho \circ \rho\}$, qui en est un puisque $\rho \circ \rho \circ \rho = \mathrm{id}$. L'application $\varepsilon$ qui envoie $H$ sur $\mathrm{id}$ et $C$ sur $\tau_{ab}$ est un morphisme de $\mathfrak S(E)$ dans lui-même. Par le même point (iv), le produit de deux échanges est l'identité s'ils sont égaux et appartient à $H$ sinon, tandis que le produit d'un élément de $H$ et d'un échange, dans un ordre ou dans l'autre, est un échange. Comme $\tau_{ab} \circ \tau_{ab} = \mathrm{id}$, on a bien $\varepsilon(xy) = \varepsilon(x)\varepsilon(y)$ dans tous les cas.
    - |
      Le passage au symétrique, $x \mapsto x^{-1}$, n'est un morphisme que dans un groupe [[groupe-abelien|abélien]]. S'il en est un, on a $y^{-1}x^{-1} = (xy)^{-1} = x^{-1}y^{-1}$ pour tous $x$ et $y$, et en appliquant cette égalité à $x^{-1}$ et $y^{-1}$, on obtient $yx = xy$. Dans $\mathfrak S(\{a, b, c\})$, avec les notations de l'exemple précédent, l'image de $\tau_{ab} \circ \tau_{bc}$ est $\tau_{bc} \circ \tau_{ab}$, alors que le produit des images est $\tau_{ab}^{-1} \circ \tau_{bc}^{-1} = \tau_{ab} \circ \tau_{bc}$, qui en diffère.
    - |
      Une bijection d'un groupe sur lui-même n'est pas pour autant un morphisme. Pour $g \neq e$, la translation $x \mapsto gx$ est bijective ({{a-groupe|Groupes}}, (iii)), mais elle envoie $e$ sur $g$, alors qu'un morphisme envoie le neutre sur le neutre ({{a-morphisme|Morphismes de groupes}}, (i)). Ainsi, $x \mapsto \tau_{ab} \circ x$ n'est pas un morphisme de $\mathfrak S(\{a, b, c\})$ dans lui-même.

  noyau:
    - |
      Soit $E = \{a, b, c, d\}$, de points distincts, $\tau_{xy}$ la bijection qui échange $x$ et $y$, et $G$ le [[sous-groupe]] de $\mathfrak S(E)$ formé des bijections qui laissent $\{a, b\}$ stable, à savoir $\mathrm{id}$, $\tau_{ab}$, $\tau_{cd}$ et $\tau_{ab} \circ \tau_{cd}$. La [[restriction]] à $\{a, b\}$ est un [[morphisme-groupes|morphisme]] de $G$ dans $\mathfrak S(\{a, b\})$, puisque la restriction d'une composée est la composée des restrictions. Son noyau est $\{\mathrm{id}, \tau_{cd}\}$ : il n'est pas réduit à l'identité, et le morphisme n'est pas injectif, conformément au point (iv) de {{a-morphisme|Morphismes de groupes}}. L'image réciproque de l'échange de $a$ et $b$, $\{\tau_{ab}, \tau_{ab} \circ \tau_{cd}\}$, n'est pas un sous-groupe : seule la fibre du neutre en est un.
    - |
      Un noyau trivial suffit pour conclure à l'injectivité. Prolonger une bijection de $\{a, b\}$ en une bijection de $\{a, b, c\}$ qui fixe $c$ définit un morphisme de $\mathfrak S(\{a, b\})$ dans $\mathfrak S(\{a, b, c\})$, puisque le prolongement d'une composée est la composée des prolongements. Son noyau est $\{\mathrm{id}\}$, puisque seule l'identité se prolonge en l'identité ; il est donc injectif, et son image est le sous-groupe $\{\mathrm{id}, \tau_{ab}\}$.
    - |
      À l'autre extrême, le morphisme constant d'un groupe $G$ dans un groupe $G'$, qui envoie tout sur $e'$, a pour noyau $G$ tout entier. Plus loin, le nœud {{a-distingue|Sous-groupe distingué}} montrera que tout noyau est un sous-groupe distingué, et le nœud {{a-quotient|Groupe quotient}} que, réciproquement, tout sous-groupe distingué est un noyau.

  isomorphisme:
    - |
      Deux groupes à deux éléments sont isomorphes. Si $G = \{e, x\}$ et $G' = \{e', x'\}$, on a nécessairement $xx = e$, car $xx = x = xe$ donnerait $x = e$ par régularité, et de même $x'x' = e'$. La bijection qui envoie $e$ sur $e'$ et $x$ sur $x'$ respecte donc les quatre produits. Ainsi $\mathfrak S(\{a, b\})$ et le [[sous-groupe]] $\{\mathrm{id}, \tau_{bc}\}$ de $\mathfrak S(\{a, b, c\})$, où $\tau_{bc}$ échange $b$ et $c$, ne diffèrent que par le nom de leurs éléments.
    - |
      Deux groupes peuvent être en bijection sans être isomorphes. Soit $E = \{a, b, c, d\}$, de points distincts, $\tau_{xy}$ la bijection qui échange $x$ et $y$, et $\sigma$ celle qui envoie $a$ sur $b$, $b$ sur $c$, $c$ sur $d$ et $d$ sur $a$. Les parties $K = \{\mathrm{id}, \tau_{ab} \circ \tau_{cd}, \tau_{ac} \circ \tau_{bd}, \tau_{ad} \circ \tau_{bc}\}$ et $L = \{\mathrm{id}, \sigma, \sigma \circ \sigma, \sigma \circ \sigma \circ \sigma\}$ sont des sous-groupes de $\mathfrak S(E)$. Dans $K$, le produit de deux éléments distincts autres que $\mathrm{id}$ est le troisième (ainsi $(\tau_{ab} \circ \tau_{cd}) \circ (\tau_{ac} \circ \tau_{bd})$ envoie $a$ sur $d$ et $b$ sur $c$), et chaque élément est son propre symétrique ; dans $L$, on a $\sigma \circ \sigma \circ \sigma \circ \sigma = \mathrm{id}$.

      Tout $y \in K$ vérifie $y \circ y = \mathrm{id}$, tandis que $\sigma \circ \sigma$ envoie $a$ sur $c$. Un isomorphisme $f$ de $K$ sur $L$ donnerait, pour $y = f^{-1}(\sigma)$, $\sigma \circ \sigma = f(y) \circ f(y) = f(y \circ y) = \mathrm{id}$ : il n'en existe donc aucun. Un isomorphisme conserve toute propriété qui s'exprime par la loi, comme celle-ci.
    - |
      Conjuguer par une bijection revient à renommer les points, et fournit un isomorphisme. Pour $g \in \mathfrak S(E)$, l'application $x \mapsto g \circ x \circ g^{-1}$ est un morphisme de $\mathfrak S(E)$ dans lui-même, puisque $(g \circ x \circ g^{-1}) \circ (g \circ y \circ g^{-1}) = g \circ (x \circ y) \circ g^{-1}$, de réciproque $x \mapsto g^{-1} \circ x \circ g$. Sur les échanges, il agit par $g \circ \tau_{xy} \circ g^{-1} = \tau_{g(x)g(y)}$ ({{a-groupe|Groupes}}, (iv)) ; dans $\mathfrak S(\{a, b, c\})$, par exemple, $\tau_{bc} \circ \tau_{ab} \circ \tau_{bc} = \tau_{ac}$. Un isomorphisme peut ainsi envoyer un élément sur un autre que rien, dans la seule loi, ne distingue du premier.

  sous-groupe-distingue:
    - |
      Soit $E = \{a, b, c\}$, de points distincts, avec les notations du point (iv) de {{a-groupe|Groupes}}. Le [[sous-groupe]] $H = \{\mathrm{id}, \rho, \rho \circ \rho\}$ de $\mathfrak S(E)$, qui en est un puisque $\rho \circ \rho \circ \rho = \mathrm{id}$, est distingué. Par ce point (iv), $\rho$ et $\rho \circ \rho$ sont les seules bijections de $E$ qui ne fixent aucun point. Or, si $h$ ne fixe aucun point, $ghg^{-1}$ non plus, puisque $ghg^{-1}(x) = x$ entraînerait $h(g^{-1}(x)) = g^{-1}(x)$ ; les conjugués de $\rho$ et de $\rho \circ \rho$ restent donc dans $H$.
    - |
      Être distingué n'est pas une relation transitive. Soit $E = \{a, b, c, d\}$, de points distincts, $\tau_{xy}$ la bijection qui échange $x$ et $y$, et $K$ formé de l'identité et des trois bijections $\tau_{ab} \circ \tau_{cd}$, $\tau_{ac} \circ \tau_{bd}$, $\tau_{ad} \circ \tau_{bc}$. Le produit de deux de ces trois, distinctes, est la troisième, et chacune est son propre symétrique : $K$ est un sous-groupe, [[groupe-abelien|abélien]] puisque $xy = (xy)^{-1} = y^{-1}x^{-1} = yx$. Les éléments de $K$ autres que $\mathrm{id}$ sont exactement les composées $\tau_{xy} \circ \tau_{zw}$ des échanges de deux paires disjointes. Or $g \circ (\tau_{xy} \circ \tau_{zw}) \circ g^{-1} = \tau_{g(x)g(y)} \circ \tau_{g(z)g(w)}$ ({{a-groupe|Groupes}}, (iv)), et les paires $\{g(x), g(y)\}$ et $\{g(z), g(w)\}$ sont encore disjointes : conjuguer un élément de $K$ redonne un élément de $K$, qui est donc distingué dans $\mathfrak S(E)$.

      Le sous-groupe $H = \{\mathrm{id}, \tau_{ab} \circ \tau_{cd}\}$ est distingué dans $K$, qui est abélien ({{a-distingue|Sous-groupe distingué}}, (iii)). Il ne l'est pas dans $\mathfrak S(E)$, puisque $\tau_{bc} \circ (\tau_{ab} \circ \tau_{cd}) \circ \tau_{bc} = \tau_{ac} \circ \tau_{bd}$ n'appartient pas à $H$.

  groupe-quotient:
    - |
      Un groupe non abélien peut avoir un quotient abélien. Dans $\mathfrak S(\{a, b, c\})$, avec les notations du point (iv) de {{a-groupe|Groupes}}, le sous-groupe $H = \{\mathrm{id}, \rho, \rho \circ \rho\}$ est [[sous-groupe-distingue|distingué]] : par ce point, $\rho$ et $\rho \circ \rho$ sont les seules bijections qui ne fixent aucun point, et un conjugué d'une telle bijection n'en fixe aucun. Le complémentaire de $H$ est l'ensemble $C$ des trois échanges, et pour deux échanges $\tau$ et $\tau'$, le produit $\tau^{-1}\tau' = \tau\tau'$ est l'identité, $\rho$ ou $\rho \circ \rho$, donc appartient à $H$ : $C$ est une seule classe. Le quotient a deux éléments, $H$ et $C$, avec $CC = H$ ; c'est un groupe à deux éléments, donc [[groupe-abelien|abélien]].
    - |
      Le quotient par le sous-groupe trivial ne change rien, et le quotient par le groupe entier écrase tout. Pour $H = \{e\}$, la relation $x^{-1}y \in H$ est l'égalité, chaque classe $x\{e\} = \{x\}$ est réduite à un point, et la [[application-canonique|surjection canonique]] est un morphisme bijectif de $G$ sur $G/\{e\}$. Pour $H = G$, il n'y a qu'une classe, et $G/G$ est un groupe à un seul élément. Entre ces cas limites, un quotient d'un groupe abélien reste abélien, puisque $\pi(x)\pi(y) = \pi(xy) = \pi(yx) = \pi(y)\pi(x)$.

  anneau-integre:
    - |
      L'anneau $\lex{ensemble-parties}{\mathcal P}(E)$ du point (v) de {{a-anneau|Anneaux}} est intègre si et seulement si $E$ n'a qu'un point. Si $E = \varnothing$, c'est l'anneau nul, exclu puisque son unité est nulle. Si $E$ contient deux points distincts $a$ et $b$, alors $\{a\} \cap \{b\} = \varnothing$ est un produit nul de deux éléments non nuls. Si $E = \{p\}$, les seuls éléments sont $\varnothing$ et $E$, et le seul produit de deux éléments non nuls est $E \cap E = E$.
    - |
      Dans un anneau intègre, on simplifie par tout élément non nul : si $a \neq 0$ et $ax = ay$, alors $a(x - y) = ax - ay = 0$ ({{a-anneau|Anneaux}}, (ii)), donc $x = y$. Sans l'intégrité, la simplification tombe. Dans $\mathcal P(\{a, b\})$, avec $a \neq b$, on a $\{a\} \cap \{a\} = \{a\} \cap \{a, b\}$, alors que $\{a\} \neq \{a, b\}$ : l'élément non nul $\{a\}$ ne se simplifie pas.
    - |
      Dans un anneau intègre, les seuls éléments qui vérifient $xx = x$ sont $0$ et $1$, puisque $x(x - 1) = xx - x = 0$ force $x = 0$ ou $x - 1 = 0$. Dans $\mathcal P(E)$, toute partie vérifie $X \cap X = X$ ; si cet anneau est intègre, il n'a donc pas d'autres éléments que $\varnothing$ et $E$, ce qui retrouve le premier exemple par un autre chemin.

  ideal:
    - |
      Dans l'[[anneau-commutatif|anneau commutatif]] $\lex{ensemble-parties}{\mathcal P}(E)$ ({{a-anneau|Anneaux}}, (v)), l'ensemble $\mathcal P(F)$ des parties d'une partie $F$ de $E$ est un idéal. C'est un [[sous-groupe]] additif, puisque la différence symétrique de deux parties de $F$ est contenue dans $F$, et $X \cap Y \subset F$ dès que $Y \subset F$. C'est aussi le noyau de $X \mapsto X \cap (E \setminus F)$, de $\mathcal P(E)$ dans $\mathcal P(E \setminus F)$, qui est un [[morphisme-anneaux|morphisme d'anneaux]] par la distributivité du point (v) et envoie l'unité $E$ sur l'unité $E \setminus F$.
    - |
      Un idéal $I$ de $\mathcal P(E)$ contient, avec $X$, toutes les parties de $X$, puisque $Y = Y \cap X$ pour $Y \subset X$ ; avec $X$ et $Y$, il contient leur réunion $X \cup Y = (X \mathbin{\triangle} Y) \mathbin{\triangle} (X \cap Y)$. En revanche, si $E$ contient deux points distincts $a$ et $b$, le [[sous-anneau]] $\{\varnothing, E\}$ n'est pas un idéal, puisque $\{a\} \cap E = \{a\}$ n'y est pas. Il ne pouvait pas l'être, contenant l'élément inversible $E$ ({{a-ideal|Idéaux}}, (iv)).
    - |
      La somme et l'intersection de deux idéaux en sont, la réunion non. Dans $\mathcal P(E)$, on a $\mathcal P(F) + \mathcal P(G) = \mathcal P(F \cup G)$, puisque toute partie $W$ de $F \cup G$ s'écrit $(W \cap F) \mathbin{\triangle} (W \setminus F)$, avec $W \setminus F \subset G$, et l'on a $\mathcal P(F) \cap \mathcal P(G) = \mathcal P(F \cap G)$. Mais si $a \neq b$, la réunion $\mathcal P(\{a\}) \cup \mathcal P(\{b\}) = \{\varnothing, \{a\}, \{b\}\}$ ne contient pas $\{a\} \mathbin{\triangle} \{b\} = \{a, b\}$.

  ideal-premier:
    - |
      Dans l'anneau $\lex{ensemble-parties}{\mathcal P}(E)$ ({{a-anneau|Anneaux}}, (v)), pour un point $x$ de $E$, l'ensemble $M_x$ des parties qui ne contiennent pas $x$ est un idéal premier. C'est un [[ideal|idéal]], puisqu'une différence symétrique de parties sans $x$ est sans $x$, et que $Y \cap X$ ne contient pas $x$ si $X$ ne le contient pas. Il ne contient pas l'unité $E$, et $X \cap Y$ ne contient pas $x$ si et seulement si $X$ ou $Y$ ne le contient pas. « Ne pas contenir $x$ » joue ici le rôle de « être nul ».
    - |
      Si $E$ contient deux points distincts $a$ et $b$, l'idéal $\mathcal P(E \setminus \{a, b\})$ n'est pas premier : il contient $\{a\} \cap \{b\} = \varnothing$, sans contenir ni $\{a\}$ ni $\{b\}$. Pour $E = \{a, b\}$, c'est l'idéal nul $\{\varnothing\}$ : dire qu'il n'est pas premier, c'est dire que $\mathcal P(\{a, b\})$ n'est pas [[anneau-integre|intègre]], comme le veut le point (i) de {{a-premier-maximal|Idéaux premiers et maximaux}}.
    - |
      Dans un anneau $A$ où $xx = x$ pour tout $x$, comme $\mathcal P(E)$, tout idéal premier $I$ est maximal. L'anneau $A/I$ est intègre ({{a-premier-maximal|Idéaux premiers et maximaux}}, (i)), et ses éléments vérifient encore $\bar x \bar x = \bar x$ ; or, dans un anneau intègre, $x(x - 1) = 0$ force $x = 0$ ou $x = 1$. Ainsi $A/I = \{\bar 0, \bar 1\}$, dont le seul élément non nul est son propre inverse : c'est un [[corps]], et $I$ est maximal par le point (ii).

  ideal-maximal:
    - |
      Pour un point $x$ de $E$, l'idéal $M_x$ des parties de $E$ qui ne contiennent pas $x$ est maximal dans $\lex{ensemble-parties}{\mathcal P}(E)$. L'application $X \mapsto X \cap \{x\}$, de $\mathcal P(E)$ sur $\mathcal P(\{x\})$, est un [[morphisme-anneaux|morphisme d'anneaux]] surjectif de noyau $M_x$, par la distributivité du point (v) de {{a-anneau|Anneaux}}. Le quotient $\mathcal P(E)/M_x$ est donc isomorphe à $\mathcal P(\{x\}) = \{\varnothing, \{x\}\}$ ({{a-anneau-quotient|Anneau quotient}}), qui est un [[corps]], puisque son seul élément non nul est son propre inverse. On conclut par le point (ii) de {{a-premier-maximal|Idéaux premiers et maximaux}}.
    - |
      Pour $E = \{a, b, c\}$, de points distincts, les idéaux de $\mathcal P(E)$ sont les $\mathcal P(F)$, pour $F \subset E$. Un idéal $I$ contient en effet, avec $X$, toutes ses parties, et avec $X$ et $Y$, leur réunion $(X \mathbin{\triangle} Y) \mathbin{\triangle} (X \cap Y)$. Soit $F$ la réunion des éléments de $I$. Si $a \in F$, soit $X_a$ un élément de $I$ qui contient $a$, et $X_a = \varnothing$ sinon ; de même pour $X_b$ et $X_c$. Alors $F = X_a \cup X_b \cup X_c$ appartient à $I$, et $I = \mathcal P(F)$. Comme $\mathcal P(F) \subset \mathcal P(G)$ équivaut à $F \subset G$, les idéaux maximaux sont les $\mathcal P(F)$ où $F$ ne manque qu'un point de $E$.
      ```schema lex-ideal-maximal-2
      Les huit idéaux de $\mathcal P(E)$, pour $E = \{a, b, c\}$, rangés par inclusion : chaque trait monte d'un idéal à un idéal qui le contient sans intermédiaire. Les trois idéaux maximaux, en rouge, sont juste sous l'anneau entier ; l'idéal nul, en bas, n'est pas maximal, puisque $\{\varnothing\} \subsetneq \mathcal P(\{a\}) \subsetneq \mathcal P(\{a, b\})$.
      ```
    - |
      L'anneau nul n'a aucun idéal maximal, puisqu'il n'a aucun idéal distinct de lui-même ; dans un corps, au contraire, $\{0\}$ est le seul idéal maximal ({{a-corps|Corps}}, (ii)). Qu'un anneau commutatif non nul quelconque possède un idéal maximal est le théorème de Krull, qui demande l'axiome du choix ⋆ ; il n'est pas démontré ici, et les exemples précédents exhibent leurs idéaux maximaux sans y recourir.

  groupe-symetrise:
    - |
      Symétriser un monoïde qui est déjà un [[groupe-abelien|groupe abélien]] ne change rien. Pour tout couple $(a, b)$, on a $(a, b) \sim (a - b, 0)$, puisque $a + 0 = b + (a - b)$ ; l'injection $\iota$ de {{a-symetrise|Symétrisation}} est donc surjective, et c'est un morphisme bijectif. La construction n'ajoute d'opposés qu'aux éléments qui n'en ont pas.
    - |
      La régularité est indispensable. Dans le [[monoide|monoïde]] commutatif $(\lex{ensemble-parties}{\mathcal P}(E), \cup)$, avec $E = \{p\}$, l'élément $E$ n'est pas régulier, puisque $E \cup \varnothing = E \cup E$. La relation n'est alors pas transitive : $(\varnothing, \varnothing) \sim (E, E)$ et $(E, E) \sim (E, \varnothing)$, puisque $\varnothing \cup E = \varnothing \cup E$ et $E \cup \varnothing = E \cup E$, mais $(\varnothing, \varnothing) \not\sim (E, \varnothing)$, puisque $\varnothing \cup \varnothing \neq \varnothing \cup E$. Avec le remède de la remarque de {{a-symetrise|Symétrisation}}, qui ajoute un même $k$ aux deux membres, le choix $k = E$ rend tous les couples équivalents : le groupe obtenu n'a qu'un élément, et $\iota$ n'est plus injective.
    - |
      Plus loin, {{z-construction|la construction de ℤ}} appliquera ce théorème au monoïde $(\mathbb N, +)$, dont tout élément est régulier : la classe de $(a, b)$ y sera l'entier $a - b$, et $\iota$ identifiera $\mathbb N$ à une partie de $\mathbb Z$.

  corps-fractions:
    - |
      Le corps des fractions d'un [[corps]] $K$ est $K$ lui-même. Toute fraction $a/b$ est égale à $(ab^{-1})/1$, puisque $a \cdot 1 = b \cdot (ab^{-1})$ ; le [[morphisme-anneaux|morphisme]] injectif $a \mapsto a/1$ est donc surjectif. Pour le corps $\mathcal P(\{p\}) = \{\varnothing, \{p\}\}$, dont le seul élément non nul est son propre inverse, les fractions sont $\varnothing / \{p\}$ et $\{p\} / \{p\}$. La construction n'apporte donc quelque chose que pour un anneau intègre qui n'est pas un corps.
    - |
      Sans intégrité, la construction échoue deux fois. Dans $\lex{ensemble-parties}{\mathcal P}(\{a, b\})$, avec $a \neq b$, les dénominateurs $\{a\}$ et $\{b\}$ sont non nuls, mais leur produit $\{a\} \cap \{b\}$ est nul : les formules de la somme et du produit sortent de $A \times (A \setminus \{0\})$. La relation n'est pas non plus transitive. En notant $E = \{a, b\}$, on a $(E, \{a\}) \sim (\{a\}, \{a\})$ et $(\{a\}, \{a\}) \sim (\{a\}, E)$, les produits croisés valant $\{a\}$ dans les deux cas, mais $(E, \{a\}) \not\sim (\{a\}, E)$, puisque $E \cap E \neq \{a\} \cap \{a\}$.
    - |
      Plus loin, {{q-construction|Construction de ℚ}} obtiendra $\mathbb Q$ comme corps des fractions de l'anneau intègre $\mathbb Z$, premier exemple où la construction ajoute vraiment des éléments : les inverses des entiers autres que $0$, $1$ et $-1$.

  module:
    - |
      Pour une partie $F$ de $E$, le groupe $(\mathcal P(F), \triangle)$ est un module sur l'[[anneau-commutatif|anneau commutatif]] $\lex{ensemble-parties}{\mathcal P}(E)$ ({{a-anneau|Anneaux}}, (v)), pour la loi externe $X \cdot Y = X \cap Y$. Les trois premiers axiomes sont la distributivité de l'intersection sur la différence symétrique, des deux côtés, et son associativité ; le dernier, $E \cap Y = Y$, tient parce que $Y \subset F \subset E$. Pour $F = E$, on retrouve l'anneau vu comme module sur lui-même.
    - |
      Soit $K = \mathcal P(\{p\}) = \{\varnothing, P\}$, avec $P = \{p\}$. Un groupe [[groupe-abelien|abélien]] $M$ est un $K$-module si et seulement si $x + x = 0$ pour tout $x \in M$, et la loi externe est alors forcée. On a en effet $Px = x$ par le dernier axiome, $\varnothing x = 0$ en simplifiant $\varnothing x = (\varnothing + \varnothing)x = \varnothing x + \varnothing x$, et $x + x = Px + Px = (P \mathbin{\triangle} P)x = \varnothing x = 0$. Réciproquement, si $x + x = 0$ pour tout $x$, ces formules vérifient les axiomes, puisque $\varnothing$ agit comme $0$ et $P$ comme l'identité : le seul qui demande quelque chose est $(P \mathbin{\triangle} P)x = Px + Px$, qui s'écrit $0 = x + x$.
    - |
      Ainsi $(\mathcal P(E), \triangle)$ est un module sur $K$, mais un groupe abélien où $x + x \neq 0$ pour un $x$ n'en est pas un. Dans $\mathfrak S(\{a, b, c\})$, avec $\rho$ comme au point (iv) de {{a-groupe|Groupes}}, le sous-groupe $\{\mathrm{id}, \rho, \rho \circ \rho\}$ est abélien, ses éléments étant des composées de $\rho$ avec elle-même, mais $\rho \circ \rho \neq \mathrm{id}$. Plus loin, {{v-espace|Espace vectoriel}} appellera espaces vectoriels les modules sur un corps, et $K$, qui en est un, sera le plus petit corps de scalaires.

  normalisateur:
    - |
      Dans $\mathfrak S(E)$, avec $E = \{a, b, c\}$ de points distincts, le normalisateur du [[sous-groupe]] $H = \{\mathrm{id}, \tau_{ab}\}$, où $\tau_{ab}$ échange $a$ et $b$, est $H$ lui-même. On a $gHg^{-1} = \{\mathrm{id}, g\tau_{ab}g^{-1}\}$, et $g\tau_{ab}g^{-1} = \tau_{g(a)g(b)}$ ({{a-groupe|Groupes}}, (iv)). Il vaut $\tau_{ab}$ si et seulement si $g(\{a, b\}) = \{a, b\}$, c'est-à-dire si $g$ fixe $c$, et les bijections qui fixent $c$ sont $\mathrm{id}$ et $\tau_{ab}$. Le sous-groupe $H$ n'est donc distingué dans aucun sous-groupe plus grand que lui.
    - |
      Le normalisateur peut être strictement compris entre $H$ et le groupe. Dans $\mathfrak S(\{a, b, c, d\})$, le même calcul montre que le normalisateur de $\{\mathrm{id}, \tau_{ab}\}$ est formé des bijections $g$ telles que $g(\{a, b\}) = \{a, b\}$. Une telle bijection laisse aussi $\{c, d\}$ stable, et induit sur chacune des deux paires l'identité ou l'échange : ce sont $\mathrm{id}$, $\tau_{ab}$, $\tau_{cd}$ et $\tau_{ab} \circ \tau_{cd}$. À l'autre extrême, le normalisateur d'un sous-groupe [[sous-groupe-distingue|distingué]] est le groupe entier.

  groupe-symetrique:
    - |
      Soit $E = \{a, b, c\}$, de points distincts. Le point (iv) de {{a-groupe|Groupes}} donne la liste des éléments de $\mathfrak S(E)$ : l'identité, les trois [[bijection|bijections]] $\tau_{ab}$, $\tau_{bc}$, $\tau_{ac}$ qui échangent deux points en fixant le troisième, et les deux bijections $\rho = \tau_{ab} \circ \tau_{bc}$ et $\rho \circ \rho = \tau_{bc} \circ \tau_{ab}$, qui ne fixent aucun point. La démonstration repose sur cette distinction : une bijection qui fixe un point n'agit plus que sur les deux autres, et une bijection qui n'en fixe aucun est déterminée par l'image de $a$.
      ```schema lex-groupe-symetrique-1
      Les six bijections de $\{a, b, c\}$, chacune dans son cadre, avec son nom au-dessous : chaque flèche va d'un point à son image, et un point sans flèche est fixé. En haut, l'identité et les trois échanges, qui fixent chacun un point ; en bas, $\rho$ et $\rho \circ \rho$, qui font tourner les trois points dans un sens ou dans l'autre.
      ```
    - |
      Composer à gauche par $g$ et à droite par $g^{-1}$ revient à renommer les points : c'est la formule $g \circ \tau_{xy} \circ g^{-1} = \tau_{g(x)g(y)}$ du point (iv) de {{a-groupe|Groupes}}. Elle montre qu'un échange $\tau_{xy}$ commute avec $g$ si et seulement si $g(\{x, y\}) = \{x, y\}$. Dans $\mathfrak S(\{a, b, c\})$, on a ainsi $\tau_{bc} \circ \tau_{ab} \circ \tau_{bc} = \tau_{ac}$. C'est une autre preuve que $\tau_{ab}$ et $\tau_{bc}$ ne commutent pas, puisque sinon le premier membre vaudrait $\tau_{ab} \circ \tau_{bc} \circ \tau_{bc} = \tau_{ab}$.
    - |
      Le [[monoide|monoïde]] $E^E$ n'est pas un groupe dès que $E$ contient deux points distincts $a$ et $b$ : l'application constante de valeur $a$ n'est pas injective, donc pas [[inversible]]. Le groupe symétrique est exactement le groupe des inversibles de ce monoïde ({{a-groupe|Groupes}}, (i)). Plus loin, le nœud {{v-permutations|Permutations, signature}} montrera que, pour $E = \{1, \dots, n\}$, tout élément de $\mathfrak S(E)$ est une composée d'échanges de deux points.

  module-type-fini:
    - |
      Tout [[anneau-commutatif|anneau commutatif]] $A$, vu comme module sur lui-même, est de type fini, engendré par $1$, puisque tout $x$ s'écrit $x \cdot 1$. De même, pour une partie $F$ de $E$, le $\lex{ensemble-parties}{\mathcal P}(E)$-module $\mathcal P(F)$, de loi externe $X \cdot Y = X \cap Y$, est engendré par $F$, puisque $Y = Y \cap F$ pour toute partie $Y$ de $F$. Un seul générateur suffit dans ces deux cas.
    - |
      Soit $K = \mathcal P(\{p\}) = \{\varnothing, P\}$, avec $P = \{p\}$, et $E = \{a, b, c\}$, de points distincts. Le groupe $(\mathcal P(E), \triangle)$ est un $K$-module pour $\varnothing X = \varnothing$ et $PX = X$ : $\varnothing$ agit comme $\varnothing$ et $P$ comme l'identité, et le seul axiome qui demande quelque chose, $(P \mathbin{\triangle} P)X = PX \mathbin{\triangle} PX$, se réduit à $\varnothing = X \mathbin{\triangle} X$. Il est engendré par $\{a\}$, $\{b\}$ et $\{c\}$, toute partie étant la différence symétrique des singletons de ses points.

      Deux éléments $X$ et $Y$ n'y suffisent pas, car ils n'engendrent que $\varnothing$, $X$, $Y$ et $X \mathbin{\triangle} Y$. Pour que ces parties comprennent les trois singletons, il faudrait que $X$, $Y$ et $X \mathbin{\triangle} Y$ soient ces trois singletons, alors que la différence symétrique de deux singletons distincts a deux points.
    - |
      Un quotient d'un module de type fini est de type fini : si $x_1, \dots, x_n$ engendrent $M$, leurs classes engendrent $M/N$, puisque la classe de $a_1x_1 + \cdots + a_nx_n$ est $a_1\bar x_1 + \cdots + a_n\bar x_n$. Pour un [[sous-module]], la question est plus délicate, même dans le module $A$, pourtant engendré par $1$. Plus loin, le nœud {{ac-noetheriens|Anneaux noethériens}} étudiera les anneaux dont tous les idéaux, qui sont les sous-modules de $A$, sont de type fini.

  groupe-derive:
    - |
      Le groupe dérivé mesure le défaut de commutativité : $D(G) = \{e\}$ si et seulement si $G$ est [[groupe-abelien|abélien]]. Si $G$ est abélien, tous les [[commutateur|commutateurs]] valent $e$, et le sous-groupe $\{e\}$ les contient, donc contient $D(G)$. Réciproquement, si $D(G) = \{e\}$, tout commutateur $xyx^{-1}y^{-1}$ vaut $e$, c'est-à-dire que $xy = yx$ pour tous $x$ et $y$.
    - |
      Soit $E = \{a, b, c\}$, de points distincts, avec les notations du point (iv) de {{a-groupe|Groupes}}. Le groupe dérivé de $\mathfrak S(E)$ est $H = \{\mathrm{id}, \rho, \rho \circ \rho\}$, formé, par ce point, de l'identité et des deux bijections qui ne fixent aucun point. D'abord, $[\tau_{ab}, \tau_{bc}] = (\tau_{ab} \circ \tau_{bc}) \circ (\tau_{ab} \circ \tau_{bc}) = \rho \circ \rho$, et $D(\mathfrak S(E))$ contient aussi son symétrique $\rho$, donc $H$.

      Ensuite, $[x, y] = x \circ (y x^{-1} y^{-1})$. Si $x \in H$, le conjugué $y x^{-1} y^{-1}$ de $x^{-1}$ est l'identité ou ne fixe aucun point, comme $x^{-1}$, et appartient à $H$, ainsi que le produit. Si $x$ est un échange, ce conjugué est un échange, par la formule $g \circ \tau_{uv} \circ g^{-1} = \tau_{g(u)g(v)}$, et le produit de deux échanges est l'identité s'ils sont égaux, $\rho$ ou $\rho \circ \rho$ sinon. Le sous-groupe $H$ contient donc tous les commutateurs, et $D(\mathfrak S(E)) \subset H$.

  groupe-abelien:
    - |
      L'ensemble $\lex{ensemble-parties}{\mathcal P}(E)$, muni de la différence symétrique $X \mathbin{\triangle} Y = (X \setminus Y) \cup (Y \setminus X)$, est un groupe abélien. Un point appartient à $(X \mathbin{\triangle} Y) \mathbin{\triangle} Z$ si et seulement s'il appartient à une seule des trois parties ou aux trois, et l'on trouve la même condition pour $X \mathbin{\triangle} (Y \mathbin{\triangle} Z)$ : la loi est associative. Elle est commutative, de neutre $\varnothing$, et chaque partie est son propre symétrique, puisque $X \mathbin{\triangle} X = \varnothing$.
    - |
      Le [[groupe-symetrique|groupe symétrique]] d'un ensemble qui contient trois éléments distincts $a$, $b$, $c$ n'est pas abélien. Notons $\tau_{ab}$ la bijection qui échange $a$ et $b$ et fixe les autres points, et de même $\tau_{bc}$. Alors $\tau_{ab} \circ \tau_{bc}$ envoie $a$ sur $b$, tandis que $\tau_{bc} \circ \tau_{ab}$ envoie $a$ sur $c$ : les deux composées diffèrent. Le seuil de trois éléments est exact : si $E = \{a, b\}$, le groupe symétrique de $E$ n'a que deux éléments, l'identité et $\tau_{ab}$, et il est abélien.
    - |
      Un groupe dans lequel tout élément vérifie $x^2 = e$ est abélien, ce qui explique le premier exemple. On a alors $x^{-1} = x$ pour tout $x$, d'où
      $$xy = (xy)^{-1} = y^{-1}x^{-1} = yx.$$
      La réciproque est fausse. Soit $\rho$ la bijection de $\{a, b, c\}$ qui envoie $a$ sur $b$, $b$ sur $c$ et $c$ sur $a$. Comme $\rho \circ \rho \circ \rho = \mathrm{id}$, les trois bijections $\mathrm{id}$, $\rho$ et $\rho \circ \rho$ forment un groupe pour la composition, abélien puisque ses éléments sont des composées de $\rho$ avec elle-même. Pourtant $\rho \circ \rho$ envoie $a$ sur $c$ : ce n'est pas l'identité.

  anneau-commutatif:
    - |
      Un anneau dans lequel $xx = x$ pour tout $x$ est commutatif, ce qui redonne la commutativité de $\lex{ensemble-parties}{\mathcal P}(E)$ ({{a-anneau|Anneaux}}, (v)). Le développement de $(x + x)(x + x) = x + x$ donne $(x + x) + (x + x) = x + x$, d'où $x + x = 0$, c'est-à-dire $-x = x$. Celui de $(x + y)(x + y) = x + y$ donne $(x + xy) + (yx + y) = x + y$, d'où $xy + yx = 0$ après simplification, puis $xy = -(yx) = yx$.
    - |
      Les anneaux non commutatifs apparaissent dès que l'on compose. La seconde remarque de la fiche {{a-anneau|Anneaux}} montre que, pour un groupe abélien $G$, les applications $f : G \to G$ telles que $f(x + y) = f(x) + f(y)$ forment un anneau $\operatorname{End}(G)$, pour la somme point par point et la composition. Pour $G = \mathcal P(\{a, b\})$, muni de la différence symétrique, l'application $X \mapsto X \cap \{a\}$ et l'image par l'échange de $a$ et $b$ y sont deux éléments qui ne commutent pas : composées dans un ordre, elles envoient $\{a\}$ sur $\{b\}$, et dans l'autre sur $\varnothing$. La commutativité est donc une hypothèse de plus, que les axiomes d'un anneau n'entraînent pas, alors que l'addition, elle, est toujours commutative.

  morphisme-anneaux:
    - |
      Pour un ensemble $E$, l'ensemble $\lex{ensemble-parties}{\mathcal P}(E)$, muni de la différence symétrique $X \mathbin{\triangle} Y = (X \setminus Y) \cup (Y \setminus X)$ comme addition et de l'intersection comme multiplication, est un anneau commutatif, de zéro $\varnothing$ et d'unité $E$ ({{a-anneau|Anneaux}}, (v)). Pour $F \subset E$, la restriction $X \mapsto X \cap F$ est un morphisme d'anneaux de $\mathcal P(E)$ dans $\mathcal P(F)$. Un point de $F$ appartient en effet à $(X \mathbin{\triangle} Y) \cap F$ si et seulement s'il appartient à une seule des parties $X$ et $Y$, c'est-à-dire à une seule des parties $X \cap F$ et $Y \cap F$ ; la restriction respecte aussi l'intersection, et elle envoie l'unité $E$ sur l'unité $F$ de $\mathcal P(F)$.
    - |
      Dans la même situation, avec $F \neq E$, l'inclusion $X \mapsto X$ de $\mathcal P(F)$ dans $\mathcal P(E)$ respecte la somme et le produit, mais elle envoie l'unité $F$ de $\mathcal P(F)$ sur $F$, qui n'est pas l'unité $E$ de $\mathcal P(E)$. Ce n'est donc pas un morphisme d'anneaux, et $\mathcal P(F)$, partie stable pour les deux lois, n'est pas un [[sous-anneau]] de $\mathcal P(E)$ : la condition $f(1) = 1$ est exactement ce qui manque.
    - |
      L'anneau nul $\{0\}$ est un cas limite. Pour tout anneau $A$, l'application constante $A \to \{0\}$ est un morphisme d'anneaux, puisque l'unité de $\{0\}$ est $0$. En sens inverse, il n'existe aucun morphisme de $\{0\}$ vers un anneau $A$ non nul : il devrait envoyer $0$ à la fois sur $0$ et, puisque $1 = 0$ dans $\{0\}$, sur l'unité de $A$, qui en diffère.

  sous-anneau:
    - |
      Pour une partie $X$ de $E$, l'ensemble $\{\varnothing, X, E \setminus X, E\}$ est le plus petit sous-anneau de $\lex{ensemble-parties}{\mathcal P}(E)$ ({{a-anneau|Anneaux}}, (v)) qui contienne $X$. Il contient l'unité $E$, et il est stable par différence symétrique et par intersection, puisque $X \mathbin{\triangle} E = E \setminus X$, $X \mathbin{\triangle} (E \setminus X) = E$ et $X \cap (E \setminus X) = \varnothing$. Tout sous-anneau qui contient $X$ contient $\varnothing$, $E$ et $X \mathbin{\triangle} E$. Pour $X = \varnothing$, on obtient $\{\varnothing, E\}$, contenu dans tout sous-anneau.
    - |
      Un [[sous-groupe]] additif qui contient $1$ n'est pas toujours stable par produit. Soit $E = \{a, b, c, d\}$, de points distincts, et $H$ formé de $\varnothing$, de $E$ et des six parties de $E$ à deux points. La différence symétrique de deux paires distinctes est une paire, comme $\{a, b\} \mathbin{\triangle} \{a, c\} = \{b, c\}$, ou $E$, comme $\{a, b\} \mathbin{\triangle} \{c, d\}$, et celle d'une paire et de $E$ est la paire complémentaire : $H$ est un sous-groupe qui contient $E$. Mais $\{a, b\} \cap \{a, c\} = \{a\}$ n'est pas dans $H$, qui n'est donc pas un sous-anneau.

  sous-module:
    - |
      Dans l'anneau $A = \lex{ensemble-parties}{\mathcal P}(\{a, b\})$, avec $a \neq b$, vu comme module sur lui-même, les sous-modules sont les [[sous-groupe|sous-groupes]] de $(A, \triangle)$ stables par intersection avec toute partie. Les sous-groupes sont $\{\varnothing\}$, $A$ et les $\{\varnothing, X\}$ pour $X$ non vide, puisqu'un sous-groupe qui contient deux parties non vides distinctes contient leur différence symétrique, qui est la troisième. Tous sont des sous-modules, sauf $\{\varnothing, \{a, b\}\}$, qui ne contient pas $\{a\} \cap \{a, b\} = \{a\}$.
      ```schema lex-sous-module-1
      Les cinq sous-groupes de $(\mathcal P(E), \triangle)$, pour $E = \{a, b\}$, rangés par inclusion. Quatre sont des sous-modules ; le cinquième, en rouge, contient $\{a, b\}$ sans contenir son produit $\{a\}$ par le scalaire $\{a\}$.
      ```
    - |
      Les sous-modules dépendent de l'anneau, pas seulement du groupe. Sur l'anneau $K = \mathcal P(\{p\}) = \{\varnothing, P\}$, avec $P = \{p\}$, le groupe $(\mathcal P(\{a, b\}), \triangle)$ est aussi un module, pour $\varnothing X = \varnothing$ et $PX = X$, puisque $X \mathbin{\triangle} X = \varnothing$ assure $(P \mathbin{\triangle} P)X = PX \mathbin{\triangle} PX$, les autres cas des axiomes étant immédiats. Ses sous-modules sont alors tous ses sous-groupes, $\{\varnothing, \{a, b\}\}$ compris, puisque la loi externe ne fait que remplacer $X$ par $\varnothing$ ou par $X$.
    - |
      L'intersection de deux sous-modules en est un, la réunion non : dans le premier exemple, $\{\varnothing, \{a\}\} \cup \{\varnothing, \{b\}\}$ ne contient pas $\{a\} \mathbin{\triangle} \{b\} = \{a, b\}$. Le noyau d'une [[application-a-lineaire|application $A$-linéaire]] $f$ est en revanche toujours un sous-module, puisque $f(ax) = af(x) = a0 = 0$ quand $f(x) = 0$, l'égalité $a0 = 0$ venant de $a0 = a(0 + 0) = a0 + a0$. Pour $F \subset E$, le noyau de $Y \mapsto Y \cap F$, de $\mathcal P(E)$ dans $\mathcal P(F)$, est ainsi le sous-module $\mathcal P(E \setminus F)$.

  ideal-principal:
    - |
      Dans $\lex{ensemble-parties}{\mathcal P}(E)$ ({{a-anneau|Anneaux}}, (v)), l'idéal principal engendré par une partie $F$ est $\{F \cap X : X \subset E\} = \mathcal P(F)$, puisque toute partie $Y$ de $F$ s'écrit $F \cap Y$. Pour $E = \{a, b, c\}$, de points distincts, tout [[ideal|idéal]] $I$ est principal. Il contient en effet, avec $X$, toutes les parties de $X$, et avec $X$ et $Y$, leur réunion $(X \mathbin{\triangle} Y) \mathbin{\triangle} (X \cap Y)$. Soit $F$ la réunion des éléments de $I$. Si $a \in F$, soit $X_a$ un élément de $I$ qui contient $a$, et $X_a = \varnothing$ sinon ; de même pour $X_b$ et $X_c$. Alors $F = X_a \cup X_b \cup X_c$ appartient à $I$, et $I = \mathcal P(F)$.
    - |
      L'idéal principal $xA$ est égal à $A$ si et seulement si $x$ est inversible ({{a-ideal|Idéaux}}, (iv)), de sorte qu'un idéal principal peut avoir plusieurs générateurs : tout élément inversible engendre $A$. Dans $\mathcal P(E)$, au contraire, le seul inversible est $E$, puisque $X \cap Y = E$ force $X = E$, et $\mathcal P(F) = \mathcal P(G)$ force $F = G$, chacune des deux parties appartenant à l'ensemble des parties de l'autre.
    - |
      Plus loin, le nœud {{z-ideaux|Idéaux de ℤ}} montrera que tout idéal de $\mathbb Z$ est principal, de la forme $n\mathbb Z$, ce qui fera de $\mathbb Z$ le premier anneau principal infini de l'édifice.

  loi-associative:
    - |
      Sur $\lex{ensemble-parties}{\mathcal P}(E)$, la réunion et l'intersection sont associatives, mais la différence $(X, Y) \mapsto X \setminus Y$ ne l'est pas dès que $E$ est non vide. Pour $X = Y = Z = E$, on trouve
      $$\begin{aligned} (E \setminus E) \setminus E &= \varnothing, \\ E \setminus (E \setminus E) &= E \setminus \varnothing = E. \end{aligned}$$
      Une seule paire de parenthésages qui diffèrent suffit à ruiner l'associativité.
    - |
      Sur tout ensemble $E$, la loi $x \ast y = y$ est associative, puisque $(x \ast y) \ast z$ et $x \ast (y \ast z)$ valent tous deux $z$. Elle n'est pas [[loi-commutative|commutative]] dès que $E$ contient deux éléments distincts $a$ et $b$, car $a \ast b = b$ et $b \ast a = a$ : l'associativité ne donne pas la commutativité.
    - |
      La réciproque est fausse aussi. Sur $E = \{a, b\}$, avec $a \neq b$, posons $x \ast y = b$ si $x = y = a$, et $x \ast y = a$ dans les trois autres cas. Cette loi est commutative par construction, mais
      $$\begin{aligned} (a \ast a) \ast b &= b \ast b = a, \\ a \ast (a \ast b) &= a \ast a = b, \end{aligned}$$
      de sorte qu'elle n'est pas associative. Si l'on lit $a$ comme « vrai » et $b$ comme « faux », c'est la table du [[connecteur]] « non et » de la logique propositionnelle.

  loi-commutative:
    - |
      Sur $\lex{ensemble-parties}{\mathcal P}(E)$, la réunion, l'intersection et la différence symétrique sont commutatives, leurs définitions étant symétriques en $X$ et $Y$. La différence $X \setminus Y$ ne l'est pas dès que $E$ est non vide, puisque $E \setminus \varnothing = E$, tandis que $\varnothing \setminus E = \varnothing$.
    - |
      Sur l'ensemble $E^E$ des applications de $E$ dans $E$, avec $E = \{a, b\}$ et $a \neq b$, la composition n'est pas commutative : en notant $c_x$ la constante de valeur $x$, on a $c_a \circ c_b = c_a$ et $c_b \circ c_a = c_b$. Une [[partie-stable|partie stable]] peut néanmoins être commutative pour la loi induite. L'identité et l'échange de $a$ et $b$ forment une partie stable de $E^E$, et ils commutent.

  partie-stable:
    - |
      Dans l'ensemble $E^E$ des applications de $E$ dans $E$, muni de la composition, les [[injection|injections]], les [[surjection|surjections]] et les [[bijection|bijections]] forment des parties stables, puisque la composée de deux injections est injective, et de même pour les deux autres ({{r-injections|Injections, surjections, bijections}}, (i)). Les applications constantes aussi : si $c_x$ est la constante de valeur $x$, alors $c_x \circ f = c_x$ pour toute $f$, en particulier pour une constante.
    - |
      La stabilité dépend de la loi autant que de la partie. Pour un point $a$ de $E$, les parties de $E$ qui ne contiennent pas $a$ forment une partie de $\lex{ensemble-parties}{\mathcal P}(E)$ stable par réunion, intersection, différence et différence symétrique. Celles qui contiennent $a$ sont stables par réunion et par intersection, mais non par différence symétrique, puisque $X \mathbin{\triangle} X = \varnothing$ ne contient pas $a$.
    - |
      Les propriétés de la forme « pour tous » passent à la loi induite, l'existence d'un neutre non. Si $a$ et $b$ sont deux points distincts, les parties non vides de $E = \{a, b\}$, c'est-à-dire $\{a\}$, $\{b\}$ et $E$, forment une partie stable par réunion, et la loi induite reste associative et commutative. Elle n'a pourtant pas de neutre : un neutre $N$ vérifierait $N \cup \{a\} = \{a\}$ et $N \cup \{b\} = \{b\}$, donc $N \subset \{a\} \cap \{b\} = \varnothing$, alors que $N$ est non vide.

  application-a-lineaire:
    - |
      Pour une partie $F$ de $E$, munissons $\lex{ensemble-parties}{\mathcal P}(E)$ et $\mathcal P(F)$ de la différence symétrique et de la loi externe $X \cdot Y = X \cap Y$, qui en font des [[module|modules]] sur l'anneau $\mathcal P(E)$ ({{a-anneau|Anneaux}}, (v)). L'application $r : Y \mapsto Y \cap F$ est alors $\mathcal P(E)$-linéaire : $r(Y \mathbin{\triangle} Y') = r(Y) \mathbin{\triangle} r(Y')$ par la distributivité du point (v), et $r(X \cap Y) = X \cap r(Y)$ par associativité de l'intersection. Son noyau est $\mathcal P(E \setminus F)$, l'ensemble des parties qui ne rencontrent pas $F$.
    - |
      Respecter l'addition ne suffit pas. Soit $E = \{a, b\}$, avec $a \neq b$, et $f$ l'application de $\mathcal P(E)$ dans lui-même qui envoie chaque partie sur son image par l'échange de $a$ et $b$. Elle respecte la différence symétrique, puisqu'un point appartient à une seule des parties $X$ et $Y$ si et seulement si son image appartient à une seule de leurs images. Mais elle n'est pas $\mathcal P(E)$-linéaire, puisque $f(\{a\} \cap E) = \{b\}$, alors que $\{a\} \cap f(E) = \{a\}$. Sur l'anneau $\mathcal P(\{p\}) = \{\varnothing, P\}$, au contraire, toute application additive $h$ est linéaire, puisque $h(\varnothing x) = h(0) = 0$ et $h(Px) = h(x)$.
    - |
      Pour $a \in A$, la multiplication par $a$, $x \mapsto ax$, est une application $A$-linéaire d'un $A$-module $M$ dans lui-même : $a(x + y) = ax + ay$, et $a(bx) = (ab)x = (ba)x = b(ax)$. Ce calcul emploie la commutativité de $A$, qui est l'une des raisons pour lesquelles les modules sont ici définis sur un anneau commutatif. Dans $\mathcal P(E)$, vu comme module sur lui-même, la multiplication par $F$ est l'application $Y \mapsto F \cap Y$ du premier exemple, à valeurs dans $\mathcal P(E)$.

  element-regulier:
    - |
      Dans le [[monoide|monoïde]] $(\lex{ensemble-parties}{\mathcal P}(E), \cup)$, seul $\varnothing$ est régulier : pour $X \neq \varnothing$, on a $X \cup X = X \cup \varnothing$, alors que $X \neq \varnothing$. De même, pour l'intersection, seul $E$ est régulier, puisque $X \cap X = X \cap E$ pour toute partie $X$. Dans ces deux monoïdes, régulier et [[inversible]] signifient la même chose.
    - |
      Dans le monoïde $E^E$, les éléments réguliers sont exactement les [[bijection|bijections]]. Être simplifiable à gauche revient à être injectif (remarques de {{a-monoide|Monoïdes et éléments inversibles}}). Être simplifiable à droite revient à être surjectif : si $s$ l'est, $g \circ s = h \circ s$ entraîne $g = h$ ({{r-injections|Injections, surjections, bijections}}, (iii)) ; sinon, pour $z \notin s(E)$ et $y \in s(E)$, l'application $h$ qui envoie $z$ sur $y$ et fixe les autres points vérifie $h \circ s = \mathrm{id} \circ s$ sans être l'identité.
    - |
      Un élément régulier n'est pas toujours inversible, et l'axiome de l'infini en donne un exemple avant les entiers. Soit $I$ un ensemble [[inductif-successeur|inductif]] et $s : I \to I$, $x \mapsto x \cup \{x\}$. Elle est injective : de $x \cup \{x\} = y \cup \{y\}$ avec $x \neq y$, on tirerait $x \in y$ et $y \in x$, ce qu'exclut {{zf-bienfonde|Aucun ensemble n'appartient à lui-même}}. Elle n'est pas surjective, puisque $\varnothing$ n'est aucun $x \cup \{x\}$, qui contient $x$. Par l'exemple précédent, $s$ est donc simplifiable à gauche dans $I^I$ sans l'être à droite.

      Soit $M$ l'intersection des parties stables de $I^I$ qui contiennent $\mathrm{id}_I$ et $s$, obtenues par séparation dans $\lex{ensemble-parties}{\mathcal P}(I^I)$ ; cet ensemble de parties n'est pas vide, puisqu'il contient $I^I$, et $M$ est stable, et c'est un monoïde. Les applications qui commutent avec $s$ forment une telle partie, qui contient donc $M$ : dans $M$, l'égalité $g \circ s = h \circ s$ s'écrit $s \circ g = s \circ h$, d'où $g = h$. Ainsi $s$ est régulier dans $M$ sans y être inversible, puisqu'il n'est pas surjectif. Plus loin, {{n|$\mathbb N$}} sera le plus petit ensemble inductif, $s$ y deviendra $k \mapsto k + 1$, et dans le monoïde $(\mathbb N, +)$ tout élément sera régulier, seul $0$ étant inversible.

  sous-groupe-engendre:
    - |
      Soit $E = \{a, b, c\}$, de points distincts, avec les notations $\tau_{xy}$ et $\rho$ du point (iv) de {{a-groupe|Groupes}}. Dans $\mathfrak S(E)$, on a $\langle \tau_{ab} \rangle = \{\mathrm{id}, \tau_{ab}\}$, qui est un [[sous-groupe]] puisque $\tau_{ab} \circ \tau_{ab} = \mathrm{id}$, et que tout sous-groupe contenant $\tau_{ab}$ contient. De même, $\langle \rho \rangle = \{\mathrm{id}, \rho, \rho \circ \rho\}$, puisque $\rho \circ \rho \circ \rho = \mathrm{id}$. Pour la partie vide, enfin, $\langle \varnothing \rangle = \{\mathrm{id}\}$.
    - |
      Les deux échanges $\tau_{ab}$ et $\tau_{bc}$ engendrent $\mathfrak S(E)$ tout entier, bien que $\{\mathrm{id}, \tau_{ab}, \tau_{bc}\}$ ne soit pas un sous-groupe. En effet, $\langle \tau_{ab}, \tau_{bc} \rangle$ contient $\rho$, $\rho \circ \rho$ et $\tau_{ac} = \tau_{ab} \circ \tau_{bc} \circ \tau_{ab}$, donc toutes les bijections de $E$, dont le point (iv) de {{a-groupe|Groupes}} donne la liste ; l'égalité $\tau_{ab} \circ \tau_{bc} \circ \tau_{ab}^{-1} = \tau_{\tau_{ab}(b)\tau_{ab}(c)} = \tau_{ac}$ est la formule de conjugaison de ce point. De même, deux échanges distincts quelconques engendrent tout, puisque leur produit est $\rho$ ou $\rho \circ \rho$, et un échange $\tau$ avec $\rho$ aussi, puisque $\tau \circ \rho$ est un autre échange par ce même point.

      Un sous-groupe distinct de $\mathfrak S(E)$ contient donc au plus un échange, et s'il en contient un, ni $\rho$ ni $\rho \circ \rho$ ; il est contenu dans un $\{\mathrm{id}, \tau\}$ ou dans $\{\mathrm{id}, \rho, \rho \circ \rho\}$, et il contient $\rho$ dès qu'il contient $\rho \circ \rho = \rho^{-1}$. Les sous-groupes sont ainsi $\{\mathrm{id}\}$, $\{\mathrm{id}, \tau_{ab}\}$, $\{\mathrm{id}, \tau_{bc}\}$, $\{\mathrm{id}, \tau_{ac}\}$, $\{\mathrm{id}, \rho, \rho \circ \rho\}$ et $\mathfrak S(E)$.
      ```schema lex-sous-groupe-engendre-2
      Les six sous-groupes de $\mathfrak S(E)$, pour $E = \{a, b, c\}$, rangés par inclusion : chaque trait monte d'un sous-groupe à un sous-groupe qui le contient sans intermédiaire. Le seul sous-groupe qui contienne à la fois les deux sous-groupes rouges $\langle \tau_{ab} \rangle$ et $\langle \tau_{bc} \rangle$ est le groupe entier, qui est donc $\langle \tau_{ab}, \tau_{bc} \rangle$.
      ```

  commutateur:
    - |
      Le commutateur corrige l'ordre d'un produit : $xy = [x, y]\,yx$, puisque $xyx^{-1}y^{-1}\,yx = xy$. Dans $\mathfrak S(\{a, b, c\})$, avec les notations du point (iv) de {{a-groupe|Groupes}}, on trouve $[\tau_{ab}, \tau_{bc}] = (\tau_{ab} \circ \tau_{bc}) \circ (\tau_{ab} \circ \tau_{bc})$, chaque échange étant son propre symétrique. Cette bijection est $\rho \circ \rho$, qui envoie $a$ sur $c$, $c$ sur $b$ et $b$ sur $a$ ; elle n'est pas l'identité, de sorte que $\tau_{ab}$ et $\tau_{bc}$ ne commutent pas.
    - |
      Deux bijections qui déplacent des points disjoints commutent, et leur commutateur vaut $\mathrm{id}$. Dans $\mathfrak S(\{a, b, c, d\})$, les composées $\tau_{ab} \circ \tau_{cd}$ et $\tau_{cd} \circ \tau_{ab}$ échangent toutes deux $a$ et $b$ d'une part, $c$ et $d$ d'autre part : elles sont égales, et $[\tau_{ab}, \tau_{cd}] = \mathrm{id}$. En revanche, $\tau_{ab}$ et $\tau_{bc}$, qui déplacent tous deux le point $b$, ne commutent pas, comme dans l'exemple précédent. Enfin $[x, y]^{-1} = yxy^{-1}x^{-1} = [y, x]$, par la règle $(uv)^{-1} = v^{-1}u^{-1}$.

  abelianise:
    - |
      L'abélianisé d'un groupe [[groupe-abelien|abélien]] est ce groupe lui-même : tous les [[commutateur|commutateurs]] valent $e$, donc $D(G) = \{e\}$, les classes modulo $\{e\}$ sont réduites à un point, et la [[application-canonique|surjection canonique]] $G \to G^{\mathrm{ab}}$ est un morphisme bijectif. Abélianiser ne modifie que les groupes qui ne sont pas déjà abéliens.
    - |
      Soit $E = \{a, b, c\}$, de points distincts, avec les notations du point (iv) de {{a-groupe|Groupes}}, et $H = \{\mathrm{id}, \rho, \rho \circ \rho\}$. Ce sous-groupe est distingué dans $\mathfrak S(E)$, puisque $\rho$ et $\rho \circ \rho$ sont, par ce point, les seules bijections de $E$ qui ne fixent aucun point, et qu'un conjugué d'une telle bijection n'en fixe aucun. Le quotient n'a que deux classes, $H$ et l'ensemble des trois échanges, puisque le produit de deux échanges distincts est $\rho$ ou $\rho \circ \rho$ ; c'est un groupe à deux éléments, donc abélien.

      Pour tous $x$ et $y$, on a donc $\pi([x, y]) = [\pi(x), \pi(y)] = e$, d'où $D(\mathfrak S(E)) \subset H$. Comme $[\tau_{ab}, \tau_{bc}] = \rho \circ \rho$, et que $D(\mathfrak S(E))$ contient aussi son symétrique $\rho$, l'inclusion est une égalité : l'abélianisé de $\mathfrak S(E)$ est $\mathfrak S(E)/H$, groupe à deux éléments.
    - |
      Plus loin, le théorème de Hurewicz ({{hu-hurewicz|Théorème de Hurewicz}}) identifiera l'abélianisé du groupe fondamental d'un espace connexe par arcs à son premier groupe d'homologie. L'abélianisation y fait le pont entre les deux invariants de la topologie algébrique.

  classe-a-gauche:
    - |
      Soit $c$ un point d'un ensemble $E$, et $H$ le [[sous-groupe]] de $\mathfrak S(E)$ formé des bijections qui fixent $c$. La classe à gauche $xH$ est l'ensemble des bijections $g$ telles que $g(c) = x(c)$, puisque $x^{-1}g \in H$ signifie $x^{-1}(g(c)) = c$ : classer modulo $H$, c'est ne retenir que l'image de $c$. Pour $E = \{a, b, c\}$, avec $\tau_{xy}$ l'échange de $x$ et $y$, on a $H = \{\mathrm{id}, \tau_{ab}\}$, puis $\tau_{bc}H = \{\tau_{bc}, \tau_{bc} \circ \tau_{ab}\}$, formé des bijections qui envoient $c$ sur $b$, et $\tau_{ac}H = \{\tau_{ac}, \tau_{ac} \circ \tau_{ab}\}$, de celles qui l'envoient sur $a$.
    - |
      Une classe à gauche $xH$ n'est un sous-groupe que si $x \in H$. Si $e \in xH$, alors $e = xh$ pour un $h \in H$, et $x = h^{-1}$ appartient à $H$ ; si $x \in H$, alors $xH = H$. Dans l'exemple précédent, $\tau_{bc}H$ ne contient pas l'identité, puisque ses éléments envoient $c$ sur $b$. Toutes les classes sont pourtant en [[bijection]] avec $H$, par $h \mapsto xh$, sans qu'aucun choix soit nécessaire.

  classe-a-droite:
    - |
      Soit $H$ le [[sous-groupe]] de $\mathfrak S(E)$ formé des bijections qui fixent un point $c$. La classe à droite $Hx$ est formée des bijections $g$ qui envoient sur $c$ le même point que $x$, puisque $gx^{-1} \in H$ signifie $g(x^{-1}(c)) = c$. Pour $E = \{a, b, c\}$, avec $\tau_{xy}$ l'échange de $x$ et $y$, on trouve $H\tau_{bc} = \{\tau_{bc}, \tau_{ab} \circ \tau_{bc}\}$, formé des bijections qui envoient $b$ sur $c$, alors que $\tau_{bc}H$ est formé de celles qui envoient $c$ sur $b$. Les deux classes de $\tau_{bc}$ diffèrent, et $H$ n'est pas distingué.
    - |
      L'application $xH \mapsto Hx$ n'est pas bien définie en général, alors que $xH \mapsto Hx^{-1}$ l'est. Dans l'exemple précédent, $\tau_{bc}H = (\tau_{bc} \circ \tau_{ab})H$, mais $H\tau_{bc}$ est formé des bijections qui envoient $b$ sur $c$, et $H(\tau_{bc} \circ \tau_{ab})$ de celles qui envoient $a$ sur $c$. En revanche, l'image de $xH$ par $g \mapsto g^{-1}$ est $Hx^{-1}$, puisque $(xh)^{-1} = h^{-1}x^{-1}$ : le passage au symétrique échange les classes à gauche et les classes à droite.

  sous-groupe-conjugue:
    - |
      Dans $\mathfrak S(\{a, b, c\})$, avec $\tau_{xy}$ la bijection qui échange $x$ et $y$, les conjugués du [[sous-groupe]] $H = \{\mathrm{id}, \tau_{ab}\}$ sont $\{\mathrm{id}, \tau_{ab}\}$, $\{\mathrm{id}, \tau_{bc}\}$ et $\{\mathrm{id}, \tau_{ac}\}$. On a en effet $gHg^{-1} = \{\mathrm{id}, g\tau_{ab}g^{-1}\}$, où $g\tau_{ab}g^{-1} = \tau_{g(a)g(b)}$ ({{a-groupe|Groupes}}, (iv)), et la paire $\{g(a), g(b)\}$ peut être chacune des trois paires de points. Conjuguer, c'est renommer les points.
    - |
      Deux sous-groupes conjugués sont [[isomorphisme|isomorphes]], puisque $x \mapsto gxg^{-1}$ est un isomorphisme de $G$ sur lui-même, de réciproque $x \mapsto g^{-1}xg$ ; la réciproque est fausse. Dans $\mathfrak S(\{a, b, c, d\})$, la bijection qui envoie $\mathrm{id}$ sur $\mathrm{id}$ et $\tau_{ab}$ sur $\tau_{ab} \circ \tau_{cd}$ est un isomorphisme de $\{\mathrm{id}, \tau_{ab}\}$ sur $\{\mathrm{id}, \tau_{ab} \circ \tau_{cd}\}$, chacun de ces deux éléments étant son propre symétrique. Ces sous-groupes ne sont pourtant pas conjugués : un conjugué $g\tau_{ab}g^{-1} = \tau_{g(a)g(b)}$ ({{a-groupe|Groupes}}, (iv)) déplace deux points seulement, alors que $\tau_{ab} \circ \tau_{cd}$ les déplace tous.
