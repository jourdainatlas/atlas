# Exemples du lexique : théorie « Espaces métriques et normés » (met).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  espace-complet:
    - |
      L'ensemble $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, muni de la [[distance-induite|distance induite]] par $|x - y|$, est complet. Si $(x_n)$ est une [[suite-cauchy|suite de Cauchy]] d'entiers, il existe $N$ tel que $|x_p - x_q| < 1$ pour $p, q \geqslant N$ ; deux entiers aussi proches sont égaux, de sorte que la suite est constante à partir du rang $N$, donc convergente. Le même argument montre que tout ensemble muni de la [[distance-discrete|distance discrète]] est complet.
    - |
      L'intervalle $]0, 1]$, muni de $|x - y|$, n'est pas complet. La suite $\frac1{n+1}$ y est de Cauchy, puisqu'elle converge dans $\mathbb R$ ({{me-cauchy|Espaces complets}}, (i)), mais sa limite $0$ n'appartient pas à $]0, 1]$, et l'unicité de la limite dans $\mathbb R$ interdit toute autre limite. On retrouve la réciproque du point (iii) du même nœud : $]0, 1]$ n'est pas fermé dans $\mathbb R$. Le segment $[0, 1]$, fermé dans l'espace complet $\mathbb R$, est au contraire complet.
    - |
      La complétude dépend de la distance, et pas seulement de l'ensemble. Sur $\mathbb R$, posons $\varphi(s) = \frac{s}{1 + |s|}$, qui vérifie $\varphi(-s) = -\varphi(s)$ et vaut $1 - \frac1{1 + s}$ pour $s \geqslant 0$ : elle est strictement croissante et à valeurs dans $]{-1}, 1[$. L'application $d'(x, y) = |\varphi(x) - \varphi(y)|$ est une distance, $\varphi$ étant injective, et la suite $x_n = n$ est de Cauchy pour $d'$, puisque $\varphi(n) = \frac{n}{n + 1}$ converge vers $1$. Elle n'a pourtant pas de limite pour $d'$ : une limite $\ell$ vérifierait $\varphi(\ell) = 1$. Ainsi $(\mathbb R, d')$ n'est pas complet, alors que $(\mathbb R, |x - y|)$ l'est. L'encadrement $\alpha d \leqslant d' \leqslant \beta d$ du point (iv) de {{me-cauchy|Espaces complets}} échoue donc par sa minoration : aucune constante $\alpha > 0$ ne vérifie $\alpha |x - y| \leqslant d'(x, y)$, puisque $d'(0, n) < 1$ alors que $|0 - n| = n$.

  nombre-lebesgue:
    - |
      Le segment $[0, 1]$, muni de $|x - y|$, est recouvert par ses ouverts $U_1 = [0, \frac23[$ et $U_2 = ]\frac13, 1]$, et les nombres de Lebesgue de ce [[recouvrement]] sont exactement les réels de $]0, \frac13]$. Une partie non vide de [[diametre|diamètre]] $< \frac13$ qui contient un point au moins égal à $\frac23$ n'a que des points $> \frac13$, et elle est dans $U_2$ ; sinon, elle est dans $U_1$. Pour $\eta > \frac13$, le segment $[\frac13, \frac23]$, de diamètre $\frac13 < \eta$, n'est contenu ni dans $U_1$ ni dans $U_2$.
      ```schema lex-nombre-lebesgue-1
      Les ouverts $U_1 = [0, \frac23[$, en bleu, et $U_2 = ]\frac13, 1]$, en vert, se chevauchent sur $]\frac13, \frac23[$. Le segment rouge $[\frac13, \frac23]$, de diamètre $\frac13$, déborde de chacun par une extrémité : aucun réel $\eta > \frac13$ n'est un nombre de Lebesgue, alors que $\frac13$ en est un.
      ```
    - |
      La démonstration du lemme ({{me-lebesgue|Nombre de Lebesgue}}) donne un nombre de Lebesgue, mais pas toujours le meilleur. Pour le recouvrement précédent, la boule de $[0, 1]$ de centre $x$ et de rayon $r$ est contenue dans $U_1$ si et seulement si $x + r \leqslant \frac23$, et dans $U_2$ si et seulement si $x - r \geqslant \frac13$ ; la fonction du lemme est donc $\rho(x) = \max(\frac23 - x, x - \frac13)$. Son minimum, atteint en $\frac12$, vaut $\frac16$, deux fois moins que le plus grand nombre de Lebesgue, $\frac13$.
    - |
      Sans compacité, un recouvrement ouvert peut n'avoir aucun nombre de Lebesgue. Dans $X = \mathbb R \setminus \{0\}$, muni de $|x - y|$, les ouverts $]{-\infty}, 0[$ et $]0, +\infty[$ recouvrent $X$ ; pour tout $\eta > 0$, la partie $\{-\frac\eta4, \frac\eta4\}$, de diamètre $\frac\eta2 < \eta$, n'est contenue dans aucun des deux. La compacité n'est pas pour autant nécessaire : les intervalles $]n - 1, n + 1[$, $n \in \mathbb Z$, recouvrent $\mathbb R$, qui n'est pas compact, avec le nombre de Lebesgue $1$. Une partie non vide de diamètre $\delta < 1$ est en effet contenue dans $[a, a + \delta]$, où $a$ est sa [[borne-inferieure|borne inférieure]], donc dans $]n - 1, n + 1[$ pour le plus petit entier $n \geqslant a$.

  partie-precompacte:
    - |
      Toute partie bornée de $\mathbb R$ est précompacte. Si $A \subset [-R, R]$ et $\varepsilon > 0$, soit $m$ un entier tel que $m\varepsilon \geqslant 2R$, qui existe car $\mathbb R$ est [[archimedien]] ; les points $-R + k\varepsilon$, $0 \leqslant k \leqslant m$, forment un [[epsilon-reseau|$\varepsilon$-réseau]] de $A$. Deux points consécutifs sont en effet à distance $\varepsilon$, de sorte que tout point de $[-R, R]$ est à distance au plus $\frac\varepsilon2$ de l'un d'eux.
    - |
      Une partie bornée n'est pas toujours précompacte. Pour la [[distance-discrete|distance discrète]] sur $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, l'espace entier est [[partie-bornee|borné]], de [[diametre|diamètre]] $1$, mais une boule de rayon $\frac12$ est un singleton. Une réunion finie de telles boules est donc une partie finie de $\mathbb Z$, qui n'est pas $\mathbb Z$ tout entier : aucun $\frac12$-réseau n'existe.
    - |
      Dans $\mathbb R$, qui est [[espace-complet|complet]], une partie précompacte non fermée n'est pas compacte, et c'est l'adhérence qui répare ce défaut. L'intervalle $]0, 1]$ est précompact, comme toute partie bornée de $\mathbb R$, mais il n'est pas [[compact]], n'étant pas fermé ({{tr-compacts|Compacts de ℝ}}). Son adhérence $[0, 1]$, fermée et bornée, est compacte par le même nœud, et elle reste précompacte, comme le veut le point (i) de {{me-precompacts|Parties précompactes}}.

  norme:
    - |
      Sur $\mathbb R^2$, l'application $N(x) = \max(|x_1|, |x_1 + x_2|)$ est une norme, différente de $\|\cdot\|_\infty$, $\|\cdot\|_1$ et $\|\cdot\|_2$. C'est $\|u(x)\|_\infty$, où $u(x) = (x_1, x_1 + x_2)$ est [[application-lineaire|linéaire]] et injective : $N(x) = 0$ impose $u(x) = 0$, donc $x = 0$, tandis que l'homogénéité et l'[[inegalite-triangulaire|inégalité triangulaire]] passent de $\|\cdot\|_\infty$ à $N$ par linéarité de $u$. Le même argument fait une norme de $\|u(\cdot)\|$ pour toute norme et toute application linéaire injective $u$.
    - |
      L'inégalité triangulaire ne découle pas des deux autres conditions. Sur $\mathbb R^2$, l'application $N(x) = \big(\sqrt{|x_1|} + \sqrt{|x_2|}\big)^2$ ne s'annule qu'en $0$ et vérifie $N(\lambda x) = |\lambda|\, N(x)$, mais pour $x = (1, 0)$ et $y = (0, 1)$, elle donne $N(x + y) = 4$, alors que $N(x) + N(y) = 2$. Sa « boule unité » $\{N \leqslant 1\}$ n'est pas [[partie-convexe-ev|convexe]] : elle contient $x$ et $y$, mais pas leur milieu $(\frac12, \frac12)$, où $N$ vaut $2$.
      ```schema lex-norme-2
      La partie $\{N \leqslant 1\}$, en rouge, est limitée par quatre arcs creusés vers l'origine ; le losange gris est la boule unité fermée de $\|\cdot\|_1$, dont elle touche les sommets. Le segment qui joint $(1, 0)$ à $(0, 1)$ sort de la partie rouge, et son milieu, en bleu, où $N$ vaut $2$, lui est extérieur.
      ```
    - |
      Sur l'espace des polynômes réels de [[degre-polynome|degré]] au plus $2$, l'application $N(P) = \max(|P(0)|, |P(1)|, |P(2)|)$ est une norme. Elle est homogène et vérifie l'inégalité triangulaire, comme la [[valeur-absolue|valeur absolue]], et $N(P) = 0$ donne à $P$ trois racines, ce qui impose $P = 0$ ({{pol-racines|Racines}}, (iii)). Sur les polynômes de degré au plus $3$, la même formule n'est plus une norme, puisqu'elle s'annule sur le polynôme non nul $X(X - 1)(X - 2)$.

  normes-equivalentes:
    - |
      Sur $\mathbb R^n$, $\|x\|_\infty \leqslant \|x\|_1 \leqslant n\|x\|_\infty$, et les deux constantes sont les meilleures possibles : le premier vecteur de la [[base-canonique-kn|base canonique]] donne l'égalité à gauche, le vecteur $(1, \dots, 1)$ l'égalité à droite. La constante $n$ croît avec la [[dimension]], ce qui annonce qu'en dimension infinie l'équivalence peut se perdre.
    - |
      Sur l'espace des polynômes réels, de dimension infinie, le maximum $N_\infty(P)$ des valeurs absolues des coefficients et la borne supérieure $N(P)$ de $|P|$ sur $[0, 1]$, qui existe puisque $P$ est continue sur ce segment, sont deux normes qui ne sont pas équivalentes. La seconde s'annule seulement en $0$, puisqu'un polynôme non nul n'a qu'un nombre fini de racines ({{pol-racines|Racines}}, (iii)). Pour $P_k = (1 - X)^k$, on a $N(P_k) = 1$, atteint en $0$, alors que le coefficient de $X$ vaut $-k$, de sorte que $N_\infty(P_k) \geqslant k$ : aucune constante $\beta$ ne vérifie $N_\infty \leqslant \beta N$.
    - |
      Sur $\mathbb R^2$, la norme $N(x) = \max(|x_1|, |x_1 + x_2|)$ est équivalente à $\|\cdot\|_\infty$, avec $\frac12\|x\|_\infty \leqslant N(x) \leqslant 2\|x\|_\infty$. On a en effet $|x_1 + x_2| \leqslant 2\|x\|_\infty$, et $|x_2| = |(x_1 + x_2) - x_1| \leqslant 2N(x)$ ; les vecteurs $(1, 1)$ et $(1, -2)$ réalisent les deux égalités. Les boules s'emboîtent en conséquence, $B_\infty(0, \frac12) \subset B_N(0, 1) \subset B_\infty(0, 2)$, et c'est cet emboîtement qui donne la même topologie.
      ```schema lex-normes-equivalentes-3
      La boule unité de $N$, en rouge, est un parallélogramme de sommets $(1, 0)$, $(1, -2)$, $(-1, 0)$ et $(-1, 2)$. Elle contient la boule de $\|\cdot\|_\infty$ de rayon $\frac12$, en bleu, dont deux sommets sont sur son contour, et elle est contenue dans celle de rayon $2$, en bleu pointillé, qu'elle touche en $(1, -2)$ et $(-1, 2)$.
      ```

  norme-subordonnee:
    - |
      La norme subordonnée dépend des normes choisies au départ et à l'arrivée. Pour l'application de matrice
      $$A = \begin{pmatrix} 1 & 2 \\ 3 & 4 \end{pmatrix}$$
      sur $\mathbb R^2$, on trouve $7$ avec $\|\cdot\|_\infty$ et $6$ avec $\|\cdot\|_1$. D'une part $|x_1 + 2x_2| \leqslant 3\|x\|_\infty$ et $|3x_1 + 4x_2| \leqslant 7\|x\|_\infty$, avec égalité pour $x = (1, 1)$ ; d'autre part $\|Ax\|_1 \leqslant 4|x_1| + 6|x_2| \leqslant 6\|x\|_1$, avec égalité pour $x = (0, 1)$, d'image $(2, 4)$.
    - |
      L'inégalité $|||v \circ u||| \leqslant |||v|||\;|||u|||$ peut être stricte. Sur $\mathbb R^2$, muni de n'importe laquelle des normes $\|\cdot\|_\infty$, $\|\cdot\|_1$, $\|\cdot\|_2$, les applications $u(x) = (x_1, 0)$ et $v(x) = (0, x_2)$ ont une norme subordonnée égale à $1$, puisqu'elles ne font que retirer une coordonnée et fixent un vecteur non nul. Leur composée $v \circ u$ est pourtant nulle.
    - |
      Une norme sur les [[matrice|matrices]] n'est pas toujours subordonnée à une même norme prise au départ et à l'arrivée. Sur les matrices carrées de taille $2$, $N(A) = \max_{i,j} |a_{ij}|$ est une norme, mais pour la matrice $J$ dont tous les coefficients valent $1$, on a $J^2 = 2J$, donc $N(J^2) = 2 > N(J)^2 = 1$. L'inégalité $|||v \circ u||| \leqslant |||v|||\;|||u|||$ vaut dès que l'espace intermédiaire porte la même norme à l'arrivée de $u$ et au départ de $v$ : $N$ n'est donc subordonnée à aucune norme de $\mathbb R^2$ choisie la même au départ et à l'arrivée. Elle est pourtant la norme subordonnée de $\|\cdot\|_1$ vers $\|\cdot\|_\infty$, puisque $\|Ax\|_\infty \leqslant N(A)\,\|x\|_1$, avec égalité en un vecteur de la [[base-canonique-kn|base canonique]].

  produit-scalaire:
    - |
      Sur $\mathbb R^2$, l'application $\langle x, y \rangle = 2x_1y_1 + x_2y_2$ est un produit scalaire, différent du produit scalaire usuel, puisque $\langle x, x \rangle = 2x_1^2 + x_2^2 > 0$ pour $x \neq 0$. L'orthogonalité en dépend : les vecteurs $(1, 1)$ et $(1, -2)$ sont orthogonaux pour ce produit scalaire, qui donne $2 - 2 = 0$, mais pas pour le produit usuel, qui donne $1 - 2 = -1$. « Orthogonal » n'a de sens qu'une fois le produit scalaire choisi.
    - |
      Pour une [[matrice-symetrique|matrice symétrique]] $S$ de taille $2$, l'application $(x, y) \mapsto {}^tXSY$ est linéaire en chaque variable et symétrique ; c'est donc un produit scalaire si et seulement si ${}^tXSX > 0$ pour $X \neq 0$. Pour
      $$S = \begin{pmatrix} 2 & 1 \\ 1 & 1 \end{pmatrix},$$
      on trouve
      $$\begin{aligned} {}^tXSX &= 2x_1^2 + 2x_1x_2 + x_2^2 \\ &= x_1^2 + (x_1 + x_2)^2, \end{aligned}$$
      qui ne s'annule qu'en $0$ : c'est un produit scalaire. Pour la matrice symétrique de coefficients diagonaux $1$ et de coefficients non diagonaux $2$, en revanche, $X = (1, -1)$ donne $1 - 4 + 1 = -2 < 0$ : des coefficients positifs ne suffisent pas.
    - |
      Sans la positivité, l'inégalité de Cauchy-Schwarz tombe. L'application $b(x, y) = x_1y_1 - x_2y_2$ sur $\mathbb R^2$ est linéaire en chaque variable et symétrique, mais $b(x, x) = 0$ pour $x = (1, 1) \neq 0$. Avec $y = (1, 0)$, on trouve $b(x, y)^2 = 1$, alors que $b(x, x)\,b(y, y) = 0$ : l'inégalité est fausse. La « norme » $b(x, x)^{1/2}$ n'aurait même pas de sens pour $x = (0, 1)$, où $b(x, x) = -1$.

  contractante:
    - |
      Sur $\mathbb R$, l'application $\varphi(x) = \frac x2 + 1$ est contractante, de rapport $k = \frac12$, et son unique point fixe est $2$. Partant de $x_0 = 0$, les itérés sont $1$, $\frac32$, $\frac74$, …, et $x_m = 2 - 2^{1-m}$, de sorte que $|x_m - 2| = 2^{1-m}$. La majoration $\frac{k^m}{1 - k}\,|x_1 - x_0|$ du théorème ({{gd-point-fixe|Point fixe}}, (i)) vaut exactement $2^{1-m}$ : elle ne peut pas être améliorée en général.
    - |
      Il ne suffit pas que $\varphi$ rapproche strictement deux points distincts : le rapport $k < 1$ doit être le même partout. Sur $\mathbb R$, complet, $\varphi(x) = \sqrt{1 + x^2}$ vérifie
      $$|\varphi(x) - \varphi(y)| = \frac{|x + y|}{\varphi(x) + \varphi(y)}\,|x - y| < |x - y|$$
      pour $x \neq y$, car $|x + y| \leqslant |x| + |y| < \varphi(x) + \varphi(y)$. Elle n'a pourtant aucun point fixe, puisque $\varphi(x) > |x| \geqslant x$ : le rapport $\frac{|x + y|}{\varphi(x) + \varphi(y)}$ s'approche de $1$ quand $x$ et $y$ deviennent grands.
      ```schema lex-contractante-2
      Le graphe de $\varphi$, en rouge, reste au-dessus de la diagonale, en gris, et s'en rapproche sans jamais la couper : il n'y a pas de point fixe. Les itérés de $0$, en bleu, montent sans converger.
      ```
    - |
      La complétude ne peut pas être omise. L'application $\varphi(x) = \frac x2$ envoie $]0, 1]$ dans lui-même et elle est contractante de rapport $\frac12$, mais elle n'a pas de point fixe dans $]0, 1]$ : le seul réel fixe est $0$, limite des itérés, qui manque à cet intervalle non complet.

  vecteurs-orthogonaux:
    - |
      Pour le [[produit-scalaire-usuel|produit scalaire usuel]] de $\mathbb R^2$, les vecteurs $x = (2, 1)$ et $y = (-1, 2)$ sont orthogonaux, puisque $\langle x, y \rangle = -2 + 2 = 0$. Le théorème de Pythagore se vérifie sur eux : $x + y = (1, 3)$, et $\|x + y\|^2 = 10 = 5 + 5 = \|x\|^2 + \|y\|^2$.
      ```schema lex-vecteurs-orthogonaux-1
      Les vecteurs $x$, en rouge, et $y$, en bleu, sont orthogonaux, ce que marque le petit carré au sommet ; la somme $x + y$, en vert, ferme le triangle, et son carré de norme, $10$, est la somme de ceux de $x$ et de $y$.
      ```
    - |
      Sur les matrices carrées de taille $2$, identifiées à $\mathbb R^4$ par leurs coefficients, le produit scalaire usuel s'écrit $\langle A, B \rangle = \sum_{i,j} a_{ij} b_{ij}$. Toute [[matrice-symetrique|matrice symétrique]] $S$ y est orthogonale à toute matrice $M$ telle que ${}^tM = -M$ : le terme d'indices $(i, j)$ et celui d'indices $(j, i)$ se compensent, car $s_{ji}m_{ji} = -s_{ij}m_{ij}$. Les deux parties formées de ces matrices sont donc orthogonales.
    - |
      Une famille de vecteurs non nuls deux à deux orthogonaux est [[famille-libre|libre]]. Si $\sum_i \lambda_i x_i = 0$, le produit scalaire avec $x_j$ donne $\lambda_j \|x_j\|^2 = 0$, donc $\lambda_j = 0$. L'hypothèse « non nuls » est nécessaire : $0$ est orthogonal à tout vecteur, et la famille $(0, x)$ n'est jamais libre. Dans $\mathbb R^2$, de [[dimension]] $2$, il n'existe donc pas trois vecteurs non nuls deux à deux orthogonaux.

  boule-ouverte:
    - |
      Dans $\mathbb R$, muni de $|x - y|$, la boule ouverte $B(a, r)$ est l'intervalle $]a - r, a + r[$. Dans tout [[espace-metrique|espace métrique]], si $d(a, b) + s \leqslant r$, la boule $B(b, s)$ est contenue dans $B(a, r)$ : pour $z \in B(b, s)$, l'[[inegalite-triangulaire|inégalité triangulaire]] donne $d(a, z) \leqslant d(a, b) + d(b, z) < r$.
    - |
      Sur $\mathbb R^2$, les boules ouvertes de centre $0$ pour $d_\infty$, $d_2$ et $d_1$ s'emboîtent, $B_1(0, 1) \subset B_2(0, 1) \subset B_\infty(0, 1)$, et $B_\infty(0, \frac12) \subset B_1(0, 1)$. C'est l'encadrement $d_\infty \leqslant d_2 \leqslant d_1 \leqslant 2\, d_\infty$ ({{me-espace|Espaces métriques}}, (ii)) lu sur les boules : une distance plus grande donne une boule plus petite.
      ```schema lex-boule-ouverte-2
      Le carré bleu pointillé $B_\infty(0, \frac12)$ tient dans le losange vert $B_1(0, 1)$, qui tient dans le disque rouge $B_2(0, 1)$, lui-même contenu dans le carré bleu $B_\infty(0, 1)$. Les sommets du petit carré sont sur le contour du losange, ceux du losange sur le cercle.
      ```
    - |
      Une boule ne détermine pas toujours son rayon. Dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, muni de la [[distance-induite|distance induite]] par $|x - y|$, on a $B(0, \frac32) = B(0, 2) = \{-1, 0, 1\}$, de sorte que $B(0, 2) \subset B(0, \frac32)$ bien que $0 + 2 > \frac32$ : la condition suffisante d'inclusion du premier exemple n'est pas nécessaire. Dans $\mathbb R$, en revanche, l'intervalle $]a - r, a + r[$ détermine son milieu $a$ et sa demi-longueur $r$.

  boule-fermee:
    - |
      Dans $\mathbb R^2$, la boule fermée de centre $0$ et de rayon $1$ est un carré pour $d_\infty$, un disque pour $d_2$ et un losange pour $d_1$. Le point $p = (\frac45, \frac35)$ distingue les trois : $d_\infty(0, p) = \frac45$, $d_2(0, p) = 1$ et $d_1(0, p) = \frac75$. Il est dans la boule ouverte de $d_\infty$, dans la boule fermée de $d_2$ sans être dans la [[boule-ouverte|boule ouverte]], et hors des deux boules de $d_1$.
      ```schema lex-boule-fermee-1
      Les boules fermées de rayon $1$ : le carré bleu pour $d_\infty$, le disque rouge pour $d_2$, le losange vert pour $d_1$. Le point $p$ est à l'intérieur du carré, sur le cercle, et hors du losange.
      ```
    - |
      La boule fermée peut être beaucoup plus grande que la boule ouverte de même rayon : leur différence est la sphère $\{x : d(a, x) = r\}$. Dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, muni de la [[distance-induite|distance induite]] par $|x - y|$, $\bar B(0, 1) = \{-1, 0, 1\}$ alors que $B(0, 1) = \{0\}$. Pour la [[distance-discrete|distance discrète]], $\bar B(a, 1)$ est l'espace entier, et $B(a, 1)$ le seul singleton $\{a\}$.
    - |
      Boules ouvertes et fermées se déduisent les unes des autres : $\bar B(a, r)$ est l'intersection des boules ouvertes $B(a, s)$, $s > r$, et $B(a, r)$ est la réunion des boules fermées $\bar B(a, s)$, $0 < s < r$. En effet, $d(a, x) \leqslant r$ équivaut à $d(a, x) < s$ pour tout $s > r$, et si $d(a, x) < r$, le réel $s = \max(d(a, x), \frac r2)$ vérifie $0 < s < r$ et $d(a, x) \leqslant s$. Plus loin, le nœud {{me-topologie|Topologie d'une distance}} montrera que toute boule fermée est fermée pour la topologie associée.

  partie-bornee:
    - |
      Sur $\mathbb R^n$, les distances $d_\infty$, $d_1$ et $d_2$ ont les mêmes parties bornées. Si $A \subset B_\infty(a, r)$, alors $A \subset B_1(a, nr)$, puisque $d_1 \leqslant n\, d_\infty$, et $A \subset B_2(a, nr)$, puisque $d_2 \leqslant d_1$ ; les inclusions inverses viennent de $d_\infty \leqslant d_2 \leqslant d_1$ ({{me-espace|Espaces métriques}}, (ii)). La branche d'hyperbole $\{(t, \frac1t) : t > 0\}$ de $\mathbb R^2$ n'est bornée pour aucune des trois : son [[diametre|diamètre]] est infini, puisque $d_\infty\big((1, 1), (t, \frac1t)\big) \geqslant t - 1$.
    - |
      Le caractère borné dépend de la distance, et non du seul ensemble. Sur $\mathbb R$, $d'(x, y) = \min(|x - y|, 1)$ est une distance, l'inégalité triangulaire venant de $\min(\alpha + \beta, 1) \leqslant \min(\alpha, 1) + \min(\beta, 1)$ pour $\alpha, \beta \geqslant 0$. Pour elle, $\mathbb R$ tout entier est contenu dans la boule $B'(0, 2)$ et il est borné, alors qu'il n'est pas borné pour $|x - y|$, aucune boule $]a - r, a + r[$ ne contenant $a + r$.
    - |
      Une partie contenue dans une boule est contenue dans une boule de n'importe quel centre : si $A \subset B(a, r)$, alors $A \subset B(b, r + d(a, b))$, par l'[[inegalite-triangulaire|inégalité triangulaire]]. La réunion de deux parties bornées est donc bornée, en les plaçant dans deux boules de même centre. Celle d'une infinité ne l'est pas toujours : $\mathbb R$ est la réunion des segments bornés $[-n, n]$.

  diametre:
    - |
      Le carré $[0, 1]^2$ de $\mathbb R^2$ a pour diamètre $1$ pour $d_\infty$, $\sqrt 2$ pour $d_2$ et $2$ pour $d_1$. Pour deux points du carré, $|x_i - y_i| \leqslant 1$ pour chaque coordonnée, d'où les trois majorations, et les sommets opposés $(0, 0)$ et $(1, 1)$ les atteignent. Une même partie a donc des diamètres différents selon la distance, rangés comme les distances elles-mêmes.
      ```schema lex-diametre-1
      Entre les sommets opposés $(0, 0)$ et $(1, 1)$ du carré, la diagonale rouge vaut $d_2 = \sqrt 2$, la ligne brisée verte qui longe deux côtés vaut $d_1 = 2$, et chacun de ses deux segments vaut $d_\infty = 1$.
      ```
    - |
      L'inégalité $\operatorname{diam} A \leqslant 2r$ pour $A \subset B(a, r)$ ({{me-espace|Espaces métriques}}, (iii)) peut être stricte. Dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, muni de la [[distance-induite|distance induite]] par $|x - y|$, la boule $B(0, \frac32) = \{-1, 0, 1\}$ a pour diamètre $2 < 3$. Dans $\mathbb R$, la boule $]a - r, a + r[$ a pour diamètre $2r$, sans qu'aucun couple de ses points ne l'atteigne : le diamètre est une borne supérieure, qui n'est pas toujours un maximum.
    - |
      Si deux parties non vides $A$ et $B$ contiennent des points $a$ et $b$, alors $\operatorname{diam}(A \cup B) \leqslant \operatorname{diam} A + d(a, b) + \operatorname{diam} B$. Pour $x \in A$ et $y \in B$, l'[[inegalite-triangulaire|inégalité triangulaire]] donne $d(x, y) \leqslant d(x, a) + d(a, b) + d(b, y)$, et deux points d'une même partie sont à distance au plus son diamètre. Dans $\mathbb R$, pour $A = [0, 1]$, $B = [2, 3]$, $a = 1$ et $b = 2$, l'égalité a lieu : $3 = 1 + 1 + 1$.

  partie-convexe-ev:
    - |
      Dans un espace $E$ non nul, une sphère $\{x : N(x - a) = r\}$, pour une [[norme]] $N$ et un rayon $r > 0$, n'est jamais convexe. Pour $u \neq 0$, le vecteur $x = \frac{r}{N(u)}\,u$ vérifie $N(x) = r$, et la sphère contient $a + x$ et $a - x$, mais pas leur milieu $a$, puisque $N(0) = 0 \neq r$ ; si $E = \{0\}$, la sphère est vide, donc convexe. Ainsi le contour du carré unité $\{\|x\|_\infty = 1\}$ de $\mathbb R^2$ contient $(1, 0)$ et $(-1, 0)$ sans contenir l'origine, alors que la boule qu'il entoure est convexe.
    - |
      Une intersection de parties convexes est convexe, puisque chacune contient le segment qui joint deux de ses points ; une réunion ne l'est pas en général. Dans $\mathbb R^2$, muni de $\|\cdot\|_\infty$, les boules fermées $\bar B(0, 1)$ et $\bar B((3, 0), 1)$ sont convexes, mais leur réunion ne contient pas le point $(\frac32, 0)$, milieu de $(0, 0)$ et de $(3, 0)$.
      ```schema lex-partie-convexe-ev-2
      Les deux carrés bleus sont les boules fermées de $\|\cdot\|_\infty$ de rayon $1$ et de centres $(0, 0)$ et $(3, 0)$. Le segment qui joint leurs centres, en gris, sort de la réunion entre les deux carrés, et son milieu $(\frac32, 0)$, en rouge, n'appartient à aucune des deux boules.
      ```
    - |
      Dans l'espace des [[matrice|matrices]] carrées réelles de taille $n \geqslant 1$, les matrices à coefficients positifs forment une partie convexe, mais les matrices inversibles n'en forment pas une : $I_n$ et $-I_n$ sont inversibles, et leur milieu est la matrice nulle. De même, pour $n = 2$, les matrices de [[rang-matrice|rang]] au plus $1$ ne forment pas une partie convexe, puisque le milieu des matrices $E_{11}$ et $E_{22}$, dont l'unique coefficient non nul vaut $1$ en position $(1, 1)$ pour l'une et $(2, 2)$ pour l'autre, est $\frac12 I_2$, de rang $2$.

  distance-induite:
    - |
      Sur $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, la distance induite par $|x - y|$ a les mêmes petites boules que la [[distance-discrete|distance discrète]], sans lui être égale. Pour tout $n \in \mathbb Z$, $B(n, \frac12) = \{n\}$, comme pour la distance discrète, mais $d(0, 2) = 2$, alors que la distance discrète vaut $1$ entre deux entiers distincts. Une distance induite garde les distances de l'espace ambiant, même quand elle a les mêmes petites boules qu'une autre.
    - |
      Sur le cercle [[sphere-unite|unité]] $S^1$ de $\mathbb R^2$, la distance induite par $d_2$ est celle des cordes, prise à travers le disque. Pour $x = (1, 0)$ et $y = (-1, 0)$, $d(x, y) = 2$, et tout point $z$ de $S^1$ vérifie $d(x, z)^2 + d(z, y)^2 = 2(z_1^2 + z_2^2) + 2 = 4$, comme on le voit en développant les carrés des coordonnées. Aucun point du cercle n'est donc à distance $1$ de $x$ et de $y$ à la fois : le milieu $0$ de $x$ et de $y$ n'appartient pas au cercle.
      ```schema lex-distance-induite-2
      Les points $x$ et $y$ sont diamétralement opposés sur le cercle ; leur milieu $0$, cerclé, n'est pas sur le cercle. Pour un point $z$ du cercle, les cordes rouges vérifient $d(x, z)^2 + d(z, y)^2 = 4$ : $d(x, z)$ et $d(z, y)$ ne peuvent pas valoir $1$ toutes les deux.
      ```
    - |
      Sur une partie $A$, la boule de centre $a \in A$ et de rayon $r$ pour la distance induite est la trace $B(a, r) \cap A$. La trace d'une boule dont le centre n'est pas dans $A$, en revanche, n'est pas toujours une boule de $A$. Pour trois points $p$, $q$, $s$ de $\mathbb R^2$ deux à deux à distance $1$ pour $d_2$, les boules de $A = \{p, q, s\}$ sont les singletons et $A$, alors que la boule de centre le milieu $m$ de $p$ et de $q$ et de rayon $\frac35$ a pour trace $\{p, q\}$.
      ```schema lex-distance-induite-3
      Le triangle équilatéral $p$, $q$, $s$, de côté $1$. Le disque rouge, centré au milieu $m$ de $p$ et de $q$, hors de $A$, contient $p$ et $q$, à distance $\frac12$ de $m$, mais pas $s$, à distance $\frac{\sqrt 3}{2} > \frac35$ : sa trace $\{p, q\}$ n'est pas une boule de $A$.
      ```

  distance-discrete:
    - |
      La distance discrète vérifie l'[[inegalite-triangulaire|inégalité triangulaire]] parce que, si $x \neq z$, l'un au moins des points $x$ et $z$ diffère de $y$, et $d(x, y) + d(y, z) \geqslant 1$. Ses boules sont très simples : $B(a, r) = \{a\}$ pour $r \leqslant 1$ et $B(a, r) = X$ pour $r > 1$, tandis que $\bar B(a, r) = \{a\}$ pour $r < 1$ et $\bar B(a, r) = X$ pour $r \geqslant 1$.
    - |
      Pour la distance discrète, toute partie est [[partie-bornee|bornée]], et toute partie qui a au moins deux points a pour [[diametre|diamètre]] $1$. Ainsi $\mathbb R$, muni de la distance discrète, est borné, alors qu'il ne l'est pas pour $|x - y|$ ; la distance discrète ne retient de $\mathbb R$ que le fait que ses points sont distincts.
    - |
      Plus loin, le nœud {{me-topologie|Topologie d'une distance}} montrera que la topologie associée à la distance discrète est la [[topologie-discrete|topologie discrète]] : chaque singleton $\{a\} = B(a, 1)$ y est ouvert, et toute partie, réunion de singletons, est ouverte et fermée.

  vecteurs-colineaires:
    - |
      Dans $\mathbb R^2$, muni du [[produit-scalaire-usuel|produit scalaire usuel]], les vecteurs $x = (2, -4)$ et $y = (-1, 2)$ sont colinéaires, puisque $x = -2y$. L'inégalité de Cauchy-Schwarz y est une égalité : $\langle x, y \rangle = -10$, et $\|x\|\,\|y\| = \sqrt{20}\,\sqrt 5 = 10$. Le produit scalaire vaut ici l'opposé de $\|x\|\,\|y\|$, parce que le coefficient $-2$ est négatif.
    - |
      La relation « être colinéaires » n'est pas transitive, à cause du vecteur nul. Le vecteur $0 = 0 \cdot x$ est colinéaire à tout vecteur $x$, de sorte que $(1, 0)$ est colinéaire à $0$, et $0$ à $(0, 1)$, sans que $(1, 0)$ et $(0, 1)$ le soient. La définition demande aussi que l'un des deux vecteurs soit multiple de l'autre, et non un vecteur donné : $(0, 1)$ n'est pas un multiple de $0$, et pourtant les deux sont colinéaires.
    - |
      Dans $\mathbb R^2$, l'écart dans l'inégalité de Cauchy-Schwarz est un carré :
      $$\begin{aligned} &\|x\|^2\|y\|^2 - \langle x, y \rangle^2 \\ &\quad = (x_1y_2 - x_2y_1)^2. \end{aligned}$$
      L'égalité a donc lieu si et seulement si le [[determinant|déterminant]] $x_1y_2 - x_2y_1$ est nul, c'est-à-dire si et seulement si $x$ et $y$ sont colinéaires : si $x = 0$, alors $x = 0 \cdot y$, et si $x \neq 0$, avec par exemple $x_1 \neq 0$, la nullité du déterminant donne $y = \frac{y_1}{x_1}\,x$.

  produit-scalaire-usuel:
    - |
      Pour le produit scalaire usuel de $\mathbb R^n$, les coordonnées d'un vecteur sont ses produits scalaires avec les vecteurs $e_i$ de la [[base-canonique-kn|base canonique]] : $\langle x, e_i \rangle = x_i$, et $x = \sum_i \langle x, e_i \rangle\, e_i$. Les $e_i$ sont deux à deux orthogonaux et de norme $1$, puisque $\langle e_i, e_j \rangle$ vaut $1$ si $i = j$ et $0$ sinon. Pour $x = (3, -1, 2)$ dans $\mathbb R^3$, on lit $\langle x, e_2 \rangle = -1$ et $\|x\|_2^2 = 14$.
    - |
      La formule $\sum_i x_iy_i$ porte sur les coordonnées dans la base canonique ; appliquée aux coordonnées dans une autre base, elle donne autre chose. Dans $\mathbb R^2$, les vecteurs $f_1 = (1, 0)$ et $f_2 = (1, 1)$ ont pour coordonnées $(1, 0)$ et $(0, 1)$ dans la base $(f_1, f_2)$ ; la formule y donnerait $0$, alors que $\langle f_1, f_2 \rangle = 1$. L'erreur la plus répandue est de croire que deux vecteurs de coordonnées « orthogonales » dans une base quelconque sont orthogonaux.
    - |
      Avec $y = (1, \dots, 1)$, l'inégalité de Cauchy-Schwarz donne $\big(\sum_i x_i\big)^2 \leqslant n \sum_i x_i^2$ pour tout $x \in \mathbb R^n$, avec égalité si et seulement si $x$ est [[vecteurs-colineaires|colinéaire]] à $y$, c'est-à-dire si toutes les coordonnées de $x$ sont égales. Pour $x = (1, 2, 3)$, on trouve $36 \leqslant 42$ : la moyenne des carrés dépasse le carré de la moyenne, $\frac{14}3 > 4$.

  epsilon-reseau:
    - |
      Dans $\mathbb R$, muni de $|x - y|$, les points $\frac16$, $\frac12$ et $\frac56$ forment un $\frac14$-réseau du segment $[0, 1]$, et aucun $\frac14$-réseau n'a moins de trois points. Les trois intervalles $]{-\frac1{12}}, \frac5{12}[$, $]\frac14, \frac34[$ et $]\frac7{12}, \frac{13}{12}[$ recouvrent $[0, 1]$. Deux boules de rayon $\frac14$ ne suffisent pas : aucune ne contient à la fois $0$ et $1$, donc l'une contient $0$ et l'autre $1$, ce qui place leurs centres à moins de $\frac14$ de $0$ et de $1$, donc à plus de $\frac12$ l'un de l'autre, et laisse un point découvert entre elles.
      ```schema lex-epsilon-reseau-1
      Les trois boules de rayon $\frac14$, en bleu, centrées aux points rouges $\frac16$, $\frac12$ et $\frac56$, se chevauchent et recouvrent le segment $[0, 1]$, en gris épais. Deux boules de ce rayon ne suffiraient pas : celle qui contient $0$ et celle qui contient $1$ laisseraient un point découvert entre elles.
      ```
    - |
      Les points d'un $\varepsilon$-réseau de $A$ ne sont pas tenus d'appartenir à $A$, mais on peut s'y ramener en doublant le rayon. Pour $A = \{-1, 1\}$ dans $\mathbb R$ et $\varepsilon = \frac32$, le seul point $0$ est un $\varepsilon$-réseau, alors qu'aucun point de $A$ n'en forme un à lui seul, $B(1, \frac32)$ ne contenant pas $-1$. En général, si $(a_i)$ est un $\varepsilon$-réseau de $A$, on garde les boules qui rencontrent $A$ et l'on prend un point $b_i$ de $A$ dans chacune : les $b_i$ forment un $2\varepsilon$-réseau, par l'[[inegalite-triangulaire|inégalité triangulaire]].
