# Exemples du lexique : théorie « Espaces métriques et normés » (met).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  produit-scalaire:
    - |
      Sur $\mathbb R^2$, l'application $\langle x, y \rangle = 2x_1y_1 + x_2y_2$ est un produit scalaire, différent du produit scalaire usuel, puisque $\langle x, x \rangle = 2x_1^2 + x_2^2 > 0$ pour $x \neq 0$. L'orthogonalité en dépend : les vecteurs $(1, 1)$ et $(1, -2)$ sont orthogonaux pour ce produit scalaire, qui donne $2 - 2 = 0$, mais pas pour le produit usuel, qui donne $1 - 2 = -1$. « Orthogonal » n'a de sens qu'une fois le produit scalaire choisi.
    - |
      Pour une [[matrice-symetrique|matrice symétrique]] $S$ de taille $2$, l'application $(x, y) \mapsto {}^tXSY$ est linéaire en chaque variable et symétrique ; c'est donc un produit scalaire si et seulement si ${}^tXSX > 0$ pour $X \neq 0$. Pour
      $$S = \begin{pmatrix} 2 & 1 \\ 1 & 1 \end{pmatrix},$$
      on trouve
      $$\begin{aligned} {}^tXSX &= 2x_1^2 + 2x_1x_2 + x_2^2 \\ &= x_1^2 + (x_1 + x_2)^2, \end{aligned}$$
      qui ne s'annule qu'en $0$ : c'est un produit scalaire. Pour la matrice symétrique de coefficients diagonaux $1$ et de coefficients non diagonaux $2$, en revanche, $X = (1, -1)$ donne $1 - 4 + 1 = -2 < 0$ : des coefficients positifs ne suffisent pas.
    - |
      Sans la positivité, l'inégalité de Cauchy-Schwarz tombe. L'application $b(x, y) = x_1y_1 - x_2y_2$ sur $\mathbb R^2$ est linéaire en chaque variable et symétrique, mais $b(x, x) = 0$ pour $x = (1, 1) \neq 0$. Avec $y = (1, 0)$, on trouve $b(x, y)^2 = 1$, alors que $b(x, x)\,b(y, y) = 0$ : l'inégalité est fausse. La « norme » $b(x, x)^{1/2}$ n'aurait même pas de sens pour $x = (0, 1)$, où $b(x, x) = -1$.
