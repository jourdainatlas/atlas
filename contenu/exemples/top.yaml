# Exemples du lexique : théorie « Structures topologiques » (top).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  compact:
    - |
      Un ensemble à deux points distincts $X = \{a, b\}$, muni de la [[topologie-discrete|topologie discrète]], est compact. Il est [[separe|séparé]], puisque $\{a\}$ et $\{b\}$ sont des ouverts disjoints, et d'un [[recouvrement]] par des ouverts on extrait un sous-recouvrement en choisissant un ouvert qui contient $a$ et un ouvert qui contient $b$ : deux ouverts suffisent toujours.
    - |
      Le même ensemble, muni de la topologie grossière $\{\varnothing, X\}$, n'est pas compact au sens adopté ici, bien que tout recouvrement contienne $X$ et se réduise à lui. Il n'est pas séparé : le seul ouvert qui contient $a$ est $X$, qui contient aussi $b$. Il vérifie donc la propriété de recouvrement sans être séparé ; c'est un espace compact pour la convention anglo-saxonne, que l'on dit quasi-compact en français, et l'exemple montre que les deux conventions diffèrent réellement.
    - |
      Un ensemble $X$ muni de la topologie discrète n'est compact que s'il est fini. Les singletons forment un recouvrement par des ouverts, et aucune sous-famille stricte ne recouvre $X$, puisque retirer $\{x\}$ laisse $x$ découvert ; le seul sous-recouvrement est donc ce recouvrement lui-même, qui est fini si et seulement si $X$ l'est. Plus loin, le théorème de {{tr-borel-lebesgue|Borel-Lebesgue}} établira que les segments $[a, b]$ de $\mathbb R$ sont compacts ; la droite $\mathbb R$, elle, ne l'est pas, puisque les intervalles $]{-n}, n[$ la recouvrent sans qu'un nombre fini d'entre eux y suffise.

  connexe:
    - |
      Sur $X = \{a, b\}$, avec $a \neq b$, la [[topologie-discrete|topologie discrète]] n'est pas connexe, puisque $X = \{a\} \cup \{b\}$ est réunion de deux ouverts disjoints non vides. La topologie grossière, elle, est connexe, et la topologie $\{\varnothing, \{a\}, X\}$ aussi : ses seuls ouverts non vides, $\{a\}$ et $X$, se rencontrent. Ce dernier espace a pourtant un ouvert non trivial ; il n'a simplement aucune partie non triviale à la fois ouverte et [[ferme|fermée]].
    - |
      Le critère (c) de {{t-connexe|Connexité}} se vérifie directement pour la topologie grossière d'un ensemble $X$. Si $f : X \to \{0, 1\}$ est continue, $\{0, 1\}$ étant muni de la topologie discrète, l'image réciproque $f^{-1}(\{0\})$ est ouverte, donc égale à $\varnothing$ ou à $X$ : $f$ est constante, de valeur $1$ ou $0$. Sans la connexité, la conclusion tombe : pour la topologie discrète d'un ensemble à deux points ou plus, toute application est continue, et l'indicatrice d'une partie non triviale est continue sans être constante.
    - |
      L'ensemble vide et les singletons sont connexes, quelle que soit la topologie ; avec la convention adoptée ici, le vide est connexe, ce que certains ouvrages refusent. Plus loin, le nœud {{tr-connexes|Parties connexes de ℝ}} montrera que les parties connexes de $\mathbb R$ sont exactement les intervalles ; ainsi $\mathbb R \setminus \{0\}$, réunion des ouverts disjoints $]{-\infty}, 0[$ et $]0, +\infty[$, ne l'est pas.

  topologie:
    - |
      Sur un ensemble à deux points distincts $X = \{a, b\}$, il y a exactement quatre topologies : la topologie grossière $\{\varnothing, X\}$, la [[topologie-discrete|topologie discrète]] $\{\varnothing, \{a\}, \{b\}, X\}$, et les deux topologies $\{\varnothing, \{a\}, X\}$ et $\{\varnothing, \{b\}, X\}$. Ces deux dernières ne sont pas comparables pour l'inclusion, bien que chacune contienne la grossière et soit contenue dans la discrète : deux topologies d'un même ensemble ne sont pas toujours comparables.
      ```schema lex-topologie-1
      Les quatre topologies de $\{a, b\}$, rangées par inclusion de bas en haut : chaque trait monte d'une topologie à une topologie qui la contient. Aucun trait ne relie les deux topologies du milieu, en rouge, et aucun enchaînement de traits montants ne mène de l'une à l'autre : aucune ne contient l'autre.
      ```
    - |
      Sur $X = \{a, b, c\}$, avec trois éléments distincts, la partie $\{\varnothing, \{a\}, \{b\}, X\}$ de $\lex{ensemble-parties}{\mathcal P}(X)$ n'est pas une topologie : elle contient $\{a\}$ et $\{b\}$, mais pas leur réunion $\{a, b\}$. Il suffit d'y ajouter $\{a, b\}$ pour obtenir une topologie, car les intersections et les réunions de ces cinq parties restent parmi elles.
    - |
      Si $f : X \to Y$ est une application et $\mathcal T$ une topologie sur $Y$, les [[image-reciproque|images réciproques]] $f^{-1}(V)$, pour $V \in \mathcal T$, forment une topologie sur $X$. Elle contient $f^{-1}(\varnothing) = \varnothing$ et $f^{-1}(Y) = X$, et elle est stable par réunion quelconque et par intersection de deux éléments, parce que l'image réciproque respecte ces opérations ({{r-images|Images directes et réciproques}}, (i)). Si $f$ est constante, on obtient la topologie grossière de $X$, quelle que soit $\mathcal T$.
