# Exemples du lexique : théorie « Structures topologiques » (top).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  espace-topologique:
    - |
      Sur un ensemble $X = \{a, b, c\}$, où $a$, $b$, $c$ sont distincts, la famille $\mathcal T = \{\varnothing, \{a\}, \{a, b\}, X\}$ est une [[topologie]], et $(X, \mathcal T)$ un espace topologique. Ses éléments sont emboîtés, $\varnothing \subset \{a\} \subset \{a, b\} \subset X$ : une réunion de plusieurs d'entre eux est le plus grand, l'intersection de deux d'entre eux le plus petit, et la réunion de la famille vide est $\varnothing$. Toutes appartiennent à $\mathcal T$.
    - |
      La construction suivante vaut sur n'importe quel ensemble $X$. Pour un point $x_0 \in X$, la famille $\mathcal T$ formée de $\varnothing$ et des parties qui contiennent $x_0$ est une topologie. Elle contient $\varnothing$, et $X$, qui contient $x_0$ ; une réunion d'éléments de $\mathcal T$ est vide si tous le sont, et contient $x_0$ sinon ; l'intersection de deux éléments non vides contient $x_0$, et l'intersection avec $\varnothing$ est vide.
    - |
      La condition $X \in \mathcal T$ ne découle pas des deux autres. Sur $X = \{a, b\}$, avec $a \neq b$, la famille $\{\varnothing, \{a\}\}$ est stable par réunion et par intersection de deux éléments, mais elle ne contient pas $X$ : ce n'est pas une topologie. La condition $\varnothing \in \mathcal T$, elle, est redondante, puisque $\varnothing$ est la réunion de la famille vide, que la condition de réunion ({{t-espace|Espace topologique}}, (ii)) place dans $\mathcal T$.

  ouvert:
    - |
      Sur $X = \{a, b, c\}$, où $a$, $b$, $c$ sont distincts, muni de la [[topologie]] $\mathcal T = \{\varnothing, \{a\}, \{a, b\}, X\}$, les ouverts sont ces quatre parties, et les [[ferme|fermés]] leurs complémentaires $X$, $\{b, c\}$, $\{c\}$ et $\varnothing$. La partie $\{a\}$ est ouverte sans être fermée, $\{c\}$ fermée sans être ouverte, et $\{b\}$ n'est ni l'une ni l'autre : « ouvert » et « fermé » ne sont pas des contraires.
      ```schema lex-ouvert-1
      Les ouverts non vides $\{a\} \subset \{a, b\} \subset X$ sont les trois contours emboîtés, en rouge. Aucun contour n'entoure $b$ seul : $\{b\}$ n'est pas ouvert ; aucun n'entoure exactement $a$ et $c$ : son complémentaire $\{a, c\}$ ne l'est pas non plus, et $\{b\}$ n'est pas fermé.
      ```
    - |
      Ce qui est ouvert dépend de la topologie choisie, et non de la partie seule. Sur un ensemble $X$ quelconque, pour la topologie formée de $\varnothing$ et des parties qui contiennent un point fixé $x_0$, le singleton $\{x_0\}$ est ouvert, mais aucun $\{x\}$ avec $x \neq x_0$ ne l'est, et deux ouverts non vides se rencontrent toujours, en $x_0$. Pour la [[topologie-discrete|topologie discrète]], au contraire, $\{x\}$ et $\{y\}$ sont des ouverts disjoints dès que $x \neq y$.

  ferme:
    - |
      Pour la topologie formée de $\varnothing$ et des parties qui contiennent un point fixé $x_0$, sur un ensemble $X$, les fermés sont $X$ et les parties qui ne contiennent pas $x_0$, complémentaires des [[ouvert|ouverts]]. Toute réunion de fermés y est fermée : c'est $X$ si l'un d'eux est $X$, et sinon une partie qui ne contient pas $x_0$. Les fermés de cet espace forment donc eux-mêmes une topologie, ce qui est particulier : en général, seule la réunion de deux fermés est assurée d'être fermée.
    - |
      Une partie peut être à la fois ouverte et fermée sans que la topologie soit discrète. Sur $X = \{a, b, c\}$, où $a$, $b$, $c$ sont distincts, la [[topologie]] $\{\varnothing, \{a\}, \{b, c\}, X\}$ a pour fermés les mêmes quatre parties, puisque $\{a\}$ et $\{b, c\}$ sont complémentaires. Elles sont donc toutes ouvertes et fermées, alors que $\{b\}$ n'est ni l'un ni l'autre.
    - |
      Plus loin, dans $\mathbb R$ ({{tr-ouverts|Ouverts de ℝ}}), une réunion infinie de fermés cessera d'être fermée. Chaque segment $[\frac1{n+1}, 1]$ est fermé, mais leur réunion $]0, 1]$ ne l'est pas : son complémentaire n'est pas ouvert, car tout intervalle ouvert qui contient $0$ rencontre $]0, 1]$.

  voisinage:
    - |
      Sur $X = \{a, b, c\}$, où $a$, $b$, $c$ sont distincts, muni de la [[topologie]] $\mathcal T = \{\varnothing, \{a\}, \{a, b\}, X\}$, chaque point a ses propres voisinages. Ceux de $a$ sont toutes les parties qui contiennent $a$, puisque $\{a\}$ est ouvert ; ceux de $b$ sont les parties qui contiennent $\{a, b\}$, le plus petit [[ouvert]] qui contienne $b$ ; celui de $c$ est $X$ seul. Ainsi $\{b\}$ n'est pas un voisinage de $b$ : un voisinage de $b$ contient nécessairement $a$.
    - |
      Une partie peut être voisinage de l'un de ses points sans être ouverte. Sur $X = \{a, b, c\}$ muni de la topologie $\{\varnothing, \{a\}, X\}$, la partie $V = \{a, b\}$ est un voisinage de $a$, puisqu'elle contient l'ouvert $\{a\}$, mais pas de $b$, le seul ouvert qui contienne $b$ étant $X$. Conformément à la proposition {{t-voisinages|Ouverts et voisinages}}, $V$ n'est donc pas ouverte : il faudrait qu'elle soit voisinage de chacun de ses points.
      ```schema lex-voisinage-2
      La partie $V = \{a, b\}$, en pointillé bleu, contient l'ouvert $\{a\}$, en rouge : c'est un voisinage de $a$. Le seul ouvert qui contienne $b$ est $X$, le cadre, qui déborde de $V$ : $V$ n'est pas un voisinage de $b$.
      ```
    - |
      L'intersection de deux voisinages $V$ et $W$ d'un même point $x$ est un voisinage de $x$. Si $O \subset V$ et $O' \subset W$ sont des ouverts qui contiennent $x$, l'ouvert $O \cap O'$ contient $x$ et il est inclus dans $V \cap W$. Les deux topologies extrêmes encadrent la notion : pour la topologie grossière, $X$ est le seul voisinage de chacun de ses points, et pour la [[topologie-discrete|topologie discrète]], toute partie qui contient $x$ est un voisinage de $x$.

  separe:
    - |
      Sur $X = \{a, b, c\}$, où $a$, $b$, $c$ sont distincts, la seule topologie séparée est la [[topologie-discrete|topologie discrète]]. Si $X$ est séparé, ses singletons sont [[ferme|fermés]] ({{t-separe|Espaces séparés}}, (i)). Toute partie de $X$ est la réunion d'au plus trois singletons, donc fermée, puisqu'une réunion de deux fermés est fermée ; son complémentaire l'est aussi, et toute partie est ouverte.
    - |
      Sans séparation, les singletons ne sont pas tous fermés. Sur $S = \{a, b\}$, avec $a \neq b$, la topologie $\{\varnothing, \{a\}, S\}$ n'est pas séparée : le seul [[voisinage]] de $b$ est $S$, qui contient $a$. Le singleton $\{b\}$ est fermé, comme complémentaire de l'ouvert $\{a\}$, mais $\{a\}$ ne l'est pas, son complémentaire $\{b\}$ n'étant pas ouvert : la conclusion du point (i) de {{t-separe|Espaces séparés}} tombe.
    - |
      Le critère de la diagonale ({{t-separe|Espaces séparés}}, (ii)) se lit sur ce même espace $S$. Dans $S \times S$, muni de la [[topologie-produit|topologie produit]], un [[ouvert]] qui contient $(b, a)$ contient un [[cylindre-ouvert|cylindre]] $U \times V$ avec $b \in U$ et $a \in V$, donc $U = S$, et il contient le point $(a, a)$ de la diagonale $\Delta$. Le complémentaire $\{(a, b), (b, a)\}$ de $\Delta$ n'est donc pas ouvert, et $\Delta$ n'est pas fermée, comme le veut (ii) pour un espace non séparé.
      ```schema lex-separe-3
      Les quatre points de $S \times S$, la première coordonnée en abscisse. La diagonale $\Delta$ est en rouge ; tout ouvert qui contient $(b, a)$ contient le cylindre $S \times \{a\}$, en bleu, qui atteint le point $(a, a)$ de $\Delta$ : aucun ouvert ne sépare $(b, a)$ de la diagonale.
      ```

  compact:
    - |
      Un ensemble à deux points distincts $X = \{a, b\}$, muni de la [[topologie-discrete|topologie discrète]], est compact. Il est [[separe|séparé]], puisque $\{a\}$ et $\{b\}$ sont des ouverts disjoints, et d'un [[recouvrement]] par des ouverts on extrait un sous-recouvrement en choisissant un ouvert qui contient $a$ et un ouvert qui contient $b$ : deux ouverts suffisent toujours.
    - |
      Le même ensemble, muni de la topologie grossière $\{\varnothing, X\}$, n'est pas compact au sens adopté ici, bien que tout recouvrement contienne $X$ et se réduise à lui. Il n'est pas séparé : le seul ouvert qui contient $a$ est $X$, qui contient aussi $b$. Il vérifie donc la propriété de recouvrement sans être séparé ; c'est un espace compact pour la convention anglo-saxonne, que l'on dit quasi-compact en français, et l'exemple montre que les deux conventions diffèrent réellement.
    - |
      Un ensemble $X$ muni de la topologie discrète n'est compact que s'il est [[ensemble-fini-tarski|fini]]. Les singletons forment un recouvrement par des ouverts, et aucune sous-famille stricte ne recouvre $X$, puisque retirer $\{x\}$ laisse $x$ découvert ; le seul sous-recouvrement est donc ce recouvrement lui-même. S'il est fini, $X$, formé des éléments de ses éléments, l'est aussi ({{zf-fini|Ensembles finis, sans les entiers}}, (v)). Plus loin, le théorème de {{tr-borel-lebesgue|Borel-Lebesgue}} établira que les segments $[a, b]$ de $\mathbb R$ sont compacts ; la droite $\mathbb R$, elle, ne l'est pas, puisque les intervalles $]{-n}, n[$ la recouvrent sans qu'un nombre fini d'entre eux y suffise.

  connexe:
    - |
      Sur $X = \{a, b\}$, avec $a \neq b$, la [[topologie-discrete|topologie discrète]] n'est pas connexe, puisque $X = \{a\} \cup \{b\}$ est réunion de deux ouverts disjoints non vides. La topologie grossière, elle, est connexe, et la topologie $\{\varnothing, \{a\}, X\}$ aussi : ses seuls ouverts non vides, $\{a\}$ et $X$, se rencontrent. Ce dernier espace a pourtant un ouvert non trivial ; il n'a simplement aucune partie non triviale à la fois ouverte et [[ferme|fermée]].
    - |
      Le critère (c) de {{t-connexe|Connexité}} se vérifie directement pour la topologie grossière d'un ensemble $X$. Si $f : X \to \{0, 1\}$ est continue, $\{0, 1\}$ étant muni de la topologie discrète, l'image réciproque $f^{-1}(\{0\})$ est ouverte, donc égale à $\varnothing$ ou à $X$ : $f$ est constante, de valeur $1$ ou $0$. Sans la connexité, la conclusion tombe : pour la topologie discrète d'un ensemble à deux points ou plus, toute application est continue, et l'indicatrice d'une partie non triviale est continue sans être constante.
    - |
      L'ensemble vide et les singletons sont connexes, quelle que soit la topologie ; avec la convention adoptée ici, le vide est connexe, ce que certains ouvrages refusent. Plus loin, le nœud {{tr-connexes|Parties connexes de ℝ}} montrera que les parties connexes de $\mathbb R$ sont exactement les intervalles ; ainsi $\mathbb R \setminus \{0\}$, réunion des ouverts disjoints $]{-\infty}, 0[$ et $]0, +\infty[$, ne l'est pas.

  continuite:
    - |
      Sur $S = \{a, b\}$, avec $a \neq b$, muni de la topologie $\{\varnothing, \{a\}, S\}$, trois des quatre applications de $S$ dans $S$ sont continues. L'[[image-reciproque|image réciproque]] de l'unique ouvert non trivial $\{a\}$ est $\{a\}$ pour l'[[identite|identité]], $S$ ou $\varnothing$ pour les applications constantes, et ces trois parties sont ouvertes. Pour l'application qui échange $a$ et $b$, c'est $\{b\}$, qui n'est pas ouvert : cette [[bijection]] n'est pas continue.
      ```schema lex-continuite-1
      Les quatre applications de $S$ dans $S$, chacune de la colonne de gauche vers celle de droite ; l'ouvert $\{a\}$ est entouré dans chaque colonne. Pour les trois premières, les points envoyés dans l'ouvert de droite forment un ouvert à gauche ; pour l'échange, en rouge, c'est $\{b\}$, qui n'est pas entouré.
      ```
    - |
      La continuité dépend des deux topologies, et non de l'application seule. L'[[identite|identité]] de $X$ est continue de $(X, \mathcal T)$ dans $(X, \mathcal T')$ si et seulement si $\mathcal T' \subset \mathcal T$, puisque l'image réciproque de $V$ est $V$. Sur $X = \{a, b, c\}$, elle est continue de $\mathcal T = \{\varnothing, \{a\}, \{a, b\}, X\}$ dans $\mathcal T' = \{\varnothing, \{a\}, X\}$, mais pas en sens inverse, l'ouvert $\{a, b\}$ de $\mathcal T$ n'appartenant pas à $\mathcal T'$.
    - |
      Une application peut être continue en un point sans l'être partout. L'échange $\sigma$ de $a$ et $b$, sur l'espace $S$ du premier exemple, est continu en $a$ : le seul [[voisinage]] de $\sigma(a) = b$ est $S$, dont l'image réciproque $S$ est un voisinage de $a$. Il ne l'est pas en $b$, car $\{a\}$ est un voisinage de $\sigma(b) = a$ dont l'image réciproque $\{b\}$ n'est pas un voisinage de $b$ ; le point (ii) de {{t-continue|Applications continues}} explique ainsi que $\sigma$ ne soit pas continue.

  homeomorphisme:
    - |
      Les homéomorphismes d'un espace sur lui-même peuvent se réduire à l'[[identite|identité]]. Sur $X = \{a, b, c\}$, muni de $\mathcal T = \{\varnothing, \{a\}, \{a, b\}, X\}$, un homéomorphisme $f$ envoie chaque ouvert $U$ sur un ouvert $f(U)$, image réciproque de $U$ par $f^{-1}$, en [[bijection]] avec $U$. Ainsi $f(\{a\})$, seul ouvert réduit à un point, est $\{a\}$, et $f(\{a, b\})$, seul ouvert à deux points, est $\{a, b\}$ : d'où $f(b) = b$, puis $f(c) = c$. Pour $\{\varnothing, \{a\}, \{b, c\}, X\}$, en revanche, l'échange de $b$ et $c$ laisse chaque ouvert inchangé, et c'est un homéomorphisme.
    - |
      Une bijection continue $f$ est un homéomorphisme si et seulement si elle est [[application-ouverte|ouverte]], puisque l'image réciproque d'une partie $U$ par $f^{-1}$ est $f(U)$. Sur $S = \{a, b\}$, l'identité, de la topologie $\{\varnothing, \{a\}, S\}$ vers la topologie grossière, est continue et bijective, mais l'image de l'ouvert $\{a\}$ n'est pas ouverte : ce n'est pas un homéomorphisme, et la continuité de la réciproque ne découle pas de la bijectivité.

  interieur:
    - |
      Sur $X = \{a, b, c\}$, où $a$, $b$, $c$ sont distincts, muni de $\mathcal T = \{\varnothing, \{a\}, \{a, b\}, X\}$, l'intérieur se lit sur la liste des [[ouvert|ouverts]] : c'est le plus grand d'entre eux qui tienne dans la partie. L'intérieur de $\{a, c\}$ est $\{a\}$, celui de $\{b, c\}$ est vide, et $\{a, b\}$, ouvert, est son propre intérieur. Par le point (ii) de {{t-adherence|Intérieur, adhérence}}, l'[[adherence]] de $\{a\}$ est le complémentaire de l'intérieur, vide, de $\{b, c\}$ : c'est $X$ tout entier.
    - |
      L'intérieur d'une intersection de deux parties est l'intersection des intérieurs, mais l'analogue pour la réunion est faux. D'une part, $\mathring A \cap \mathring B$ est un ouvert inclus dans $A \cap B$, donc dans son intérieur, et l'inclusion inverse vient de ce que l'intérieur croît avec la partie. D'autre part, pour la topologie grossière sur $X = \{a, b\}$, avec $a \neq b$, les intérieurs de $\{a\}$ et de $\{b\}$ sont vides, alors que leur réunion $X$ est ouverte.
    - |
      Pour la topologie formée de $\varnothing$ et des parties qui contiennent un point fixé $x_0$, l'intérieur d'une partie $A$ est $A$ si $x_0 \in A$, et $\varnothing$ sinon, aucun ouvert non vide ne pouvant éviter $x_0$. La partie $X \setminus \{x_0\}$, à laquelle il ne manque qu'un point, est donc d'intérieur vide : l'intérieur ne mesure pas la taille d'une partie, mais la place qu'y trouvent les ouverts.

  adherence:
    - |
      Sur $X = \{a, b, c\}$, où $a$, $b$, $c$ sont distincts, muni de $\mathcal T = \{\varnothing, \{a\}, \{a, b\}, X\}$, dont les [[ferme|fermés]] sont $\varnothing$, $\{c\}$, $\{b, c\}$ et $X$, l'adhérence de $\{b\}$ est $\{b, c\}$, le plus petit fermé qui le contienne. Le critère par les [[voisinage|voisinages]] ({{t-adherence|Intérieur, adhérence}}, (iii)) le confirme : le seul voisinage de $c$ est $X$, qui rencontre $\{b\}$, tandis que l'ouvert $\{a\}$ est un voisinage de $a$ qui ne le rencontre pas. De même, l'adhérence de $\{a\}$ est $X$, et $\{c\}$ est sa propre adhérence.
      ```schema lex-adherence-1
      Les ouverts $\{a\} \subset \{a, b\} \subset X$ sont les contours gris. L'adhérence de $A = \{b\}$, en bleu, contient $c$, dont le seul voisinage, $X$, rencontre $A$ ; elle ne contient pas $a$, qui a un voisinage ouvert, $\{a\}$, disjoint de $A$.
      ```
    - |
      L'adhérence d'une réunion de deux parties est la réunion de leurs adhérences, mais l'analogue pour l'intersection est faux. D'une part, $\overline A \cup \overline B$ est un fermé qui contient $A \cup B$, et chacune des deux adhérences est incluse dans $\overline{A \cup B}$. D'autre part, dans l'espace précédent, $\{a\} \cap \{b\}$ est vide, d'adhérence vide, alors que $\overline{\{a\}} \cap \overline{\{b\}} = X \cap \{b, c\} = \{b, c\}$ : seule subsiste l'inclusion $\overline{A \cap B} \subset \overline A \cap \overline B$.
    - |
      Un singleton peut avoir pour adhérence l'espace entier. Pour la topologie formée de $\varnothing$ et des parties qui contiennent un point fixé $x_0$, tout ouvert non vide contient $x_0$, donc tout voisinage de n'importe quel point rencontre $\{x_0\}$ : l'adhérence de $\{x_0\}$ est $X$. Une partie qui ne contient pas $x_0$ est au contraire fermée, et elle est sa propre adhérence.

  base-topologie:
    - |
      Pour la topologie $\mathcal T = \{\varnothing, \{a\}, \{a, b\}, X\}$ sur $X = \{a, b, c\}$, toute base contient $\{a\}$, $\{a, b\}$ et $X$. Si $U$ est le plus petit [[ouvert]] qui contienne un point $x$, une réunion d'éléments de la base égale à $U$ en compte un qui contient $x$ ; inclus dans $U$, ouvert et contenant $x$, il est égal à $U$. Les bases de $\mathcal T$ sont donc $\{\{a\}, \{a, b\}, X\}$ et $\mathcal T$ elle-même, l'ensemble vide étant la réunion de la famille vide.
    - |
      Une famille qui recouvre $X$ n'est pas toujours une base. Sur $X = \{a, b, c\}$, la famille $\mathcal B = \{\{a, b\}, \{b, c\}\}$ recouvre $X$, mais la condition (b) du critère ({{t-base|Bases d'une topologie}}, (b)) échoue au point $b$, puisque aucun élément de $\mathcal B$ n'est inclus dans $\{a, b\} \cap \{b, c\} = \{b\}$. Les réunions d'éléments de $\mathcal B$, qui sont $\varnothing$, $\{a, b\}$, $\{b, c\}$ et $X$, ne forment pas une [[topologie]], faute de contenir $\{b\}$.
      ```schema lex-base-topologie-2
      Les deux éléments de $\mathcal B$, en bleu et en vert, se chevauchent en $b$, en rouge. Toute topologie qui les contient contient leur intersection $\{b\}$, et aucune réunion d'éléments de $\mathcal B$ ne se réduit à ce point.
      ```
    - |
      Une base peut être bien plus petite que la topologie qu'elle engendre. Pour la topologie formée de $\varnothing$ et des parties qui contiennent un point fixé $x_0$ d'un ensemble $X$, les paires $\{x_0, x\}$, pour $x \in X$, forment une base, qui contient le singleton $\{x_0\}$, obtenu pour $x = x_0$. Tout ouvert non vide $U$ est en effet la réunion des $\{x_0, x\}$, pour $x \in U$, alors que la topologie contient toutes les parties qui contiennent $x_0$.

  topologie-discrete:
    - |
      La topologie discrète est la seule qui contienne tous les singletons : toute partie $A$ de $X$ est la réunion des $\{x\}$, $x \in A$, et une [[topologie]] qui les contient tous contient donc $A$. Sur $X = \{a, b, c\}$, où $a$, $b$, $c$ sont distincts, une topologie qui n'est pas discrète manque donc l'un des singletons. C'est le cas de $\{\varnothing, \{a\}, \{b\}, \{a, b\}, X\}$, qui ne contient pas $\{c\}$.
    - |
      Pour une [[application]] $f : X \to Y$, les [[image-reciproque|images réciproques]] $f^{-1}(B)$, $B \subset Y$, forment la topologie discrète de $X$ si et seulement si $f$ est [[injection|injective]]. Si $f$ l'est, $\{x\} = f^{-1}(\{f(x)\})$ ; sinon, deux points distincts de même image appartiennent aux mêmes $f^{-1}(B)$. Pour $X = \{a, b, c\}$, $Y = \{u, v\}$, $f(a) = f(b) = u$ et $f(c) = v$, on obtient $\{\varnothing, \{a, b\}, \{c\}, X\}$, qui n'est pas discrète.
    - |
      Plus loin, le nœud {{t-continue|Applications continues}} définira la continuité par les images réciproques des ouverts. Toute application définie sur un espace discret sera alors continue, quelle que soit la topologie de l'espace d'arrivée, puisque toute partie de l'espace de départ y est ouverte.

  topologie-induite:
    - |
      Sur la partie $A = \{b, c\}$ de $X = \{a, b, c\}$, muni de $\mathcal T = \{\varnothing, \{a\}, \{a, b\}, X\}$, la topologie induite est $\{\varnothing, \{b\}, A\}$, formée des traces sur $A$ des quatre [[ouvert|ouverts]] de $X$. La partie $\{b\} = \{a, b\} \cap A$ est ouverte dans $A$ sans l'être dans $X$ : il faut toujours dire dans quel espace une partie est ouverte.
      ```schema lex-topologie-induite-1
      La partie $A = \{b, c\}$ est entourée en bleu, et les ouverts $\{a\} \subset \{a, b\} \subset X$ de $X$ sont les contours gris. L'ouvert $\{a, b\}$ coupe $A$ selon $\{b\}$, en rouge, qui est donc ouvert dans $A$, alors qu'aucun ouvert de $X$ ne se réduit à $\{b\}$.
      ```
    - |
      Si $A$ est ouverte dans $X$, ses ouverts sont exactement les ouverts de $X$ inclus dans $A$, puisqu'une trace $O \cap A$ est alors l'intersection de deux ouverts de $X$. Pour $A = \{a, b\}$, ouverte dans l'espace précédent, la topologie induite $\{\varnothing, \{a\}, A\}$ est faite d'ouverts de $X$. Sans l'hypothèse, la conclusion tombe : $\{b, c\}$ n'est pas ouverte, et son ouvert $\{b\}$ n'est pas ouvert dans $X$.
    - |
      La topologie induite peut être discrète sans que celle de l'espace le soit. Pour la topologie formée de $\varnothing$ et des parties qui contiennent un point fixé $x_0$, la topologie induite sur $A = X \setminus \{x_0\}$ est la [[topologie-discrete|topologie discrète]] : pour $x \in A$, la trace sur $A$ de l'ouvert $\{x_0, x\}$ est $\{x\}$. La topologie grossière, elle, induit sur toute partie la topologie grossière.

  topologie-produit:
    - |
      Sur le produit de $X = \{a, b\}$, muni de la [[topologie-discrete|topologie discrète]], et de $Y = \{c, d\}$, muni de la topologie grossière, les [[ouvert|ouverts]] sont les parties $U \times Y$, $U \subset X$. Les [[cylindre-ouvert|cylindres]] $U \times V$ ont en effet pour second facteur $\varnothing$ ou $Y$, et leurs réunions sont encore de cette forme. Le singleton $\{(a, c)\}$ n'est donc pas ouvert, bien que $\{a\}$ le soit dans $X$ : un ouvert qui contient $(x, c)$ contient aussi $(x, d)$, faute d'ouvert de $Y$ qui sépare $c$ de $d$.
    - |
      Le produit de deux espaces discrets est discret, puisque $\{(x, y)\} = \{x\} \times \{y\}$ est un cylindre ouvert. La conclusion tombe pour une infinité de facteurs. Pour la [[famille]] constante $X_i = \{u, v\}$, discrets, indexée par un ensemble $I$ infini, un cylindre ne contraint qu'un ensemble [[ensemble-fini-tarski|fini]] $J$ de coordonnées, et $I \setminus J$ n'est pas vide, sans quoi $I = J$ serait fini. S'il contient un point $x$, il contient donc aussi le point obtenu en changeant une coordonnée libre de $x$, et aucun singleton n'est ouvert.
    - |
      Une application à valeurs dans un produit est continue dès que ses composantes le sont. Pour tout espace $X$, l'application $x \mapsto (x, x)$ de $X$ dans $X \times X$ est continue, ses deux composantes étant l'[[identite|identité]]. L'échange $(x, y) \mapsto (y, x)$ de $X \times Y$ dans $Y \times X$ est continu, de composantes les [[projection-produit|projections]], et c'est une [[bijection]] dont la réciproque, de même forme, est continue elle aussi.

  topologie-quotient:
    - |
      Tout quotient d'un espace discret est discret, puisque l'image réciproque par la projection $\pi$ de n'importe quelle partie du quotient est ouverte. De même, tout quotient d'un espace muni de la topologie grossière est grossier. Une partie non vide $V$ du quotient a en effet une image réciproque non vide, la projection étant [[surjection|surjective]] ; si celle-ci est ouverte, elle est égale à $X$, et $V$ est le quotient entier.
    - |
      Le quotient dépend de la relation, et pas seulement de l'espace. Sur $X = \{a, b, c\}$, muni de $\mathcal T = \{\varnothing, \{a\}, \{a, b\}, X\}$, identifions $b$ et $c$ : les [[classe-equivalence|classes]] sont $\alpha = \{a\}$ et $\beta = \{b, c\}$, et $\{\alpha\}$ est ouvert, puisque $\pi^{-1}(\{\alpha\}) = \{a\}$, mais pas $\{\beta\}$. Si l'on identifie plutôt $a$ et $c$, aucune des deux classes $\gamma = \{a, c\}$ et $\delta = \{b\}$ n'est ouverte dans $X$, et le quotient porte la topologie grossière.
      ```schema lex-topologie-quotient-2
      À gauche, l'espace $X$ et ses ouverts emboîtés. En haut à droite, quand on identifie $b$ et $c$, l'ouvert $\{a\}$ de $X$, fait d'une classe entière, donne l'ouvert $\{\alpha\}$, en rouge ; en bas, quand on identifie $a$ et $c$, aucun ouvert de $X$ autre que $\varnothing$ et $X$ n'est réunion de classes, et le quotient n'a pas d'autre ouvert.
      ```
    - |
      La topologie quotient n'est pas faite des images des ouverts, et la projection n'est pas toujours [[application-ouverte|ouverte]]. Dans le second quotient de l'exemple précédent, l'ouvert $\{a\}$ de $X$ a pour image $\{\gamma\}$, qui n'est pas ouvert dans le quotient grossier. Les images $\pi(U)$ des ouverts sont $\varnothing$, $\{\gamma\}$ et le quotient entier : elles forment une topologie, mais pas la topologie quotient.

  recouvrement:
    - |
      Sur $X = \{a, b, c\}$, où $a$, $b$, $c$ sont distincts, muni de $\mathcal T = \{\varnothing, \{a\}, \{a, b\}, X\}$, tout recouvrement de $X$ par des [[ouvert|ouverts]] contient $X$, seul ouvert qui contienne $c$ ; il a donc le sous-recouvrement $\{X\}$, à un élément. Le recouvrement $\{\{a, b\}, \{c\}\}$, lui, n'est pas ouvert, puisque $\{c\}$ n'est pas un ouvert de $\mathcal T$, et on ne peut en retirer aucun élément.
    - |
      Un recouvrement peut avoir plusieurs sous-recouvrements minimaux. Sur $X = \{a, b, c\}$, muni de la [[topologie-discrete|topologie discrète]], le recouvrement ouvert $\{\{a, b\}, \{b, c\}, \{a, c\}\}$ reste un recouvrement quand on retire l'un quelconque de ses trois éléments, alors qu'aucun de ses éléments ne recouvre $X$ à lui seul. Il a ainsi trois sous-recouvrements à deux éléments, dont aucun ne se réduit davantage.

  propriete-topologique:
    - |
      Avoir une partie à la fois ouverte et fermée, autre que $\varnothing$ et l'espace, est une propriété topologique : un [[homeomorphisme]] $f$ envoie ouverts sur ouverts et fermés sur fermés, $f(U)$ étant l'image réciproque de $U$ par la réciproque continue. Elle distingue, sur $X = \{a, b, c\}$, les topologies $\mathcal T_1 = \{\varnothing, \{a\}, \{a, b\}, X\}$ et $\mathcal T_2 = \{\varnothing, \{a\}, \{b, c\}, X\}$, qui ont chacune quatre ouverts. Pour $\mathcal T_2$, $\{a\}$ est ouvert et fermé ; pour $\mathcal T_1$, aucune partie non triviale ne l'est, et les deux espaces ne sont pas homéomorphes.
      ```schema lex-propriete-topologique-1
      À gauche, les ouverts non vides de $\mathcal T_1$, emboîtés ; à droite, ceux de $\mathcal T_2$, où $\{a\}$ et $\{b, c\}$, en rouge, sont deux ouverts disjoints qui recouvrent $X$, donc chacun fermé. À gauche, deux ouverts non vides se rencontrent toujours, et aucun n'a de complémentaire ouvert, sauf $X$.
      ```
    - |
      Une propriété qui désigne un point par son nom n'est pas topologique. Sur $X = \{a, b\}$, avec $a \neq b$, les topologies $\{\varnothing, \{a\}, X\}$ et $\{\varnothing, \{b\}, X\}$ sont [[espaces-homeomorphes|homéomorphes]] par l'échange de $a$ et $b$, mais seule la première fait de $\{a\}$ un ouvert. La propriété « posséder un ouvert réduit à un point », qui ne nomme aucun point, est en revanche topologique, et les deux espaces l'ont.
    - |
      Plus loin, le nœud {{me-topologie|Topologie d'une distance}} montrera qu'une propriété définie à partir d'une distance, comme le caractère borné, n'est pas topologique en général. Sur $\mathbb R$, la distance $\min(|x - y|, 1)$ définit la même topologie que $|x - y|$, si bien que l'identité est un homéomorphisme entre les deux espaces, alors que $\mathbb R$ est borné pour la première distance et non pour la seconde.

  espaces-homeomorphes:
    - |
      Deux topologies différentes sur un même ensemble peuvent donner des espaces homéomorphes. Sur $X = \{a, b\}$, avec $a \neq b$, l'application $\sigma$ qui échange $a$ et $b$ est un [[homeomorphisme]] de $(X, \{\varnothing, \{a\}, X\})$ sur $(X, \{\varnothing, \{b\}, X\})$. Elle est bijective, et l'image réciproque de $\{b\}$ par $\sigma$ est $\{a\}$, celle de $\{a\}$ par la réciproque $\sigma$ est $\{b\}$, toutes deux ouvertes. Des quatre topologies de $X$, ces deux-là ne diffèrent que par le nom des points.
      ```schema lex-espaces-homeomorphes-1
      À gauche, l'ouvert $\{a\}$ de la première topologie ; à droite, l'ouvert $\{b\}$ de la seconde, tous deux en rouge. Les flèches de $\sigma$ envoient $a$ sur $b$ et $b$ sur $a$ : l'ouvert de gauche est exactement l'ensemble des points envoyés dans l'ouvert de droite.
      ```
    - |
      Deux espaces discrets sont homéomorphes si et seulement si leurs ensembles sont [[equipotent|équipotents]], puisque toute bijection entre eux est continue ainsi que sa réciproque ; il en va de même pour deux espaces grossiers. En revanche, si $X$ a au moins deux points, $X$ discret et $X$ grossier ne sont pas homéomorphes, bien qu'ils aient le même ensemble. Un homéomorphisme $f$ du premier sur le second enverrait l'ouvert $\{x\}$ sur l'ouvert $\{f(x)\}$, qui n'est ni vide ni égal à l'espace grossier.
    - |
      Plus loin, l'analyse réelle et le nœud {{me-cauchy|Espaces complets}} montreront que l'intervalle $]{-1}, 1[$ et la droite $\mathbb R$ sont homéomorphes, par $t \mapsto \frac{t}{1 - |t|}$, alors que le premier est borné et la seconde non. Un homéomorphisme ne préserve donc pas les propriétés définies par une distance, comme le caractère borné ou la complétude.

  cylindre-ouvert:
    - |
      Sur $S = \{a, b\}$, avec $a \neq b$, muni de la topologie $\{\varnothing, \{a\}, S\}$, les cylindres ouverts de $S \times S$ sont $\varnothing$, $\{(a, a)\}$, $\{a\} \times S$, $S \times \{a\}$ et $S \times S$. La réunion de $\{a\} \times S$ et de $S \times \{a\}$, formée des trois points autres que $(b, b)$, est ouverte pour la [[topologie-produit|topologie produit]], mais ce n'est pas un cylindre : un produit $U \times V$ qui contient $(a, b)$ et $(b, a)$ a deux facteurs qui contiennent $a$ et $b$, et il contient donc $(b, b)$.
      ```schema lex-cylindre-ouvert-1
      Les quatre points de $S \times S$, la première coordonnée en abscisse. Le cylindre $\{a\} \times S$, en bleu, et le cylindre $S \times \{a\}$, en vert, recouvrent trois points ; leur réunion est ouverte, mais tout produit qui contient $(a, b)$ et $(b, a)$ contient aussi $(b, b)$, en rouge, qu'elle évite.
      ```
    - |
      L'intersection de deux cylindres ouverts est un cylindre ouvert : $\prod_i U_i \cap \prod_i V_i = \prod_i (U_i \cap V_i)$, et les facteurs différents de $X_i$ sont parmi ceux de l'un ou de l'autre, qui forment un ensemble [[ensemble-fini-tarski|fini]]. Tout cylindre autre que le produit entier est d'ailleurs l'intersection d'un ensemble fini de cylindres $p_j^{-1}(U_j)$, qui ne contraignent chacun qu'une coordonnée : $\prod_i U_i = \bigcap_{j \in J} p_j^{-1}(U_j)$, où $J$, non vide, est l'ensemble des indices tels que $U_j \neq X_j$, et $p_j$ la [[projection-produit|projection]] d'indice $j$.

  application-ouverte:
    - |
      Continuité et ouverture sont indépendantes. Sur un ensemble $X$ qui a au moins deux points, l'[[identite|identité]] de $X$ discret vers $X$ grossier est [[continuite|continue]], mais pas ouverte, puisque l'image du singleton ouvert $\{x\}$ n'est pas ouverte pour la topologie grossière. L'identité de $X$ grossier vers $X$ discret est ouverte, l'image de $\varnothing$ et de $X$ étant ouverte, mais elle n'est pas continue.
    - |
      Une application constante de valeur $y$ est ouverte si et seulement si $\{y\}$ est ouvert dans l'espace d'arrivée, puisque les images d'ouverts sont $\varnothing$ et $\{y\}$, quand l'espace de départ n'est pas vide. Sur $S = \{a, b\}$ muni de la topologie $\{\varnothing, \{a\}, S\}$, l'application constante de valeur $a$ est ouverte, celle de valeur $b$ ne l'est pas, alors que toutes deux sont continues.
    - |
      Une application ouverte n'envoie pas toujours un [[ferme|fermé]] sur un fermé, contrairement à ce que donne la continuité pour les images réciproques ({{t-continue|Applications continues}}, (i)). L'application $u \mapsto a$ du singleton discret $\{u\}$ dans l'espace $S$ précédent est ouverte, mais l'image du fermé $\{u\}$ est $\{a\}$, qui n'est pas fermé dans $S$. C'est que $f(X \setminus F)$ n'est pas en général $Y \setminus f(F)$ ; pour une bijection, ces deux parties coïncident, et être ouverte revient alors à envoyer tout fermé sur un fermé.

  topologie:
    - |
      Sur un ensemble à deux points distincts $X = \{a, b\}$, il y a exactement quatre topologies : la topologie grossière $\{\varnothing, X\}$, la [[topologie-discrete|topologie discrète]] $\{\varnothing, \{a\}, \{b\}, X\}$, et les deux topologies $\{\varnothing, \{a\}, X\}$ et $\{\varnothing, \{b\}, X\}$. Ces deux dernières ne sont pas comparables pour l'inclusion, bien que chacune contienne la grossière et soit contenue dans la discrète : deux topologies d'un même ensemble ne sont pas toujours comparables.
      ```schema lex-topologie-1
      Les quatre topologies de $\{a, b\}$, rangées par inclusion de bas en haut : chaque trait monte d'une topologie à une topologie qui la contient. Aucun trait ne relie les deux topologies du milieu, en rouge, et aucun enchaînement de traits montants ne mène de l'une à l'autre : aucune ne contient l'autre.
      ```
    - |
      Sur $X = \{a, b, c\}$, avec trois éléments distincts, la partie $\{\varnothing, \{a\}, \{b\}, X\}$ de $\lex{ensemble-parties}{\mathcal P}(X)$ n'est pas une topologie : elle contient $\{a\}$ et $\{b\}$, mais pas leur réunion $\{a, b\}$. Il suffit d'y ajouter $\{a, b\}$ pour obtenir une topologie, car les intersections et les réunions de ces cinq parties restent parmi elles.
    - |
      Si $f : X \to Y$ est une application et $\mathcal T$ une topologie sur $Y$, les [[image-reciproque|images réciproques]] $f^{-1}(V)$, pour $V \in \mathcal T$, forment une topologie sur $X$. Elle contient $f^{-1}(\varnothing) = \varnothing$ et $f^{-1}(Y) = X$, et elle est stable par réunion quelconque et par intersection de deux éléments, parce que l'image réciproque respecte ces opérations ({{r-images|Images directes et réciproques}}, (i)). Si $f$ est constante, on obtient la topologie grossière de $X$, quelle que soit $\mathcal T$.
