# Exemples du lexique : théorie « Homologie » (hom).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  cycle-complexe:
    - |
      Le nom vient des graphes. Soit le complexe concentré en degrés $1$ et $0$, avec $C_1 = \mathbb Z^{(\{e, f\})}$ et $C_0 = \mathbb Z^{(\{u, v\})}$, et $\partial_1$ défini par $\partial_1 e = \partial_1 f = v - u$ : deux arêtes $e$ et $f$ qui vont du sommet $u$ au sommet $v$. Comme $\partial_1(me + nf) = (m + n)(v - u)$, les cycles de degré $1$ sont les multiples de $e - f$, la chaîne qui va de $u$ à $v$ par $e$ et revient par $f$. L'arête $e$ seule n'est pas un cycle : son bord $v - u$, non nul, enregistre ses deux extrémités.
    - |
      Dans le même complexe, $\partial_0 = 0$, de sorte que tout élément de $C_0$ est un cycle de degré $0$. Les [[bord-complexe|bords]] de degré $0$ sont les multiples de $v - u$, dont la somme des coefficients est nulle ; le cycle $u$ n'en est donc pas un. Un cycle n'est pas forcément un bord, et c'est exactement ce que mesure l'homologie : ici $H_0$ et $H_1$ sont tous deux isomorphes à $\mathbb Z$, engendrés par les classes de $u$ et de $e - f$.
    - |
      Si toutes les différentielles d'un complexe sont nulles, toute chaîne est un cycle et seule $0$ est un bord, de sorte que $H_n(C) = C_n$ pour tout $n$. À l'autre extrême, dans le complexe $0 \to \mathbb Z \xrightarrow{\ \mathrm{id}\ } \mathbb Z \to 0$, concentré en degrés $1$ et $0$, il n'y a pas de cycle non nul en degré $1$, et tout cycle de degré $0$ est un bord : l'homologie est nulle, bien que le complexe ne le soit pas.
