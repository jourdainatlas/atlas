# Exemples du lexique : théorie « Théorie algébrique des nombres » (tan).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  residu-quadratique:
    - |
      Modulo $11$, les carrés de $1, 2, 3, 4, 5$ sont $1, 4, 9, 5, 3$ : les résidus quadratiques sont $1, 3, 4, 5, 9$, et les [[non-residu-quadratique|non-résidus]] $2, 6, 7, 8, 10$. Il y en a cinq de chaque sorte, comme l'annonce le point (i), et il suffit d'élever au carré les entiers de $1$ à $5$, puisque $(11 - x)^2 \equiv x^2$. Comme $11 \equiv 3 \pmod 4$, l'entier $-1 \equiv 10$ est un non-résidu, conformément à (iv).
    - |
      La moitié exacte des résidus tient à ce que le module est premier. Modulo $8$, les quatre classes inversibles $1, 3, 5, 7$ ont toutes pour carré $1$ : une seule est un carré, et non la moitié. Modulo $15$, on a $1^2 \equiv 4^2 \equiv 11^2 \equiv 14^2 \equiv 1$, quatre racines carrées de $1$ au lieu de deux. L'implication $x^2 = y^2 \Rightarrow y = \pm x$, vraie dans un anneau intègre comme le corps $\lex{corps-fini}{\mathbb F_p}$ de (i), puisque $x^2 - y^2 = (x - y)(x + y)$, tombe dans $\mathbb Z/8\mathbb Z$ et dans $\mathbb Z/15\mathbb Z$.
    - |
      Le critère d'Euler (ii) décide sans chercher de racine carrée. Modulo $11$, $3^5 = 243 = 22 \cdot 11 + 1$, donc $3$ est un résidu, et en effet $5^2 = 25 \equiv 3$ ; au contraire, $2^5 = 32 = 3 \cdot 11 - 1$, et $2$ est un non-résidu. Plus loin, la loi de réciprocité quadratique ({{rq-reciprocite|Réciprocité quadratique}}) ramène la question « $q$ est-il un résidu modulo $p$ ? » à la question inverse, modulo $q$.

  symbole-legendre:
    - |
      Modulo $7$, les carrés non nuls sont $1, 2, 4$, et le symbole de Legendre prend, pour $a = 0, 1, \dots, 6$, les valeurs
      $$0,\ 1,\ 1,\ -1,\ 1,\ -1,\ -1.$$
      La multiplicativité (iii) se lit sur la table : $\big(\frac 37\big)\big(\frac 57\big) = (-1)(-1) = 1 = \big(\frac{15}7\big)$, puisque $15 \equiv 1$. Le critère d'Euler (ii) redonne $\big(\frac 37\big) = -1$, car $3^3 = 27 \equiv -1 \pmod 7$.
    - |
      Les règles de calcul évitent souvent tout essai. Pour $p$ premier impair, $\big(\frac{-4}p\big) = \big(\frac{-1}p\big)\big(\frac 2p\big)^2 = \big(\frac{-1}p\big)$ par (iii), et la première loi complémentaire (iv) donne la réponse : $-4$ est un carré modulo $17$, qui est congru à $1$ modulo $4$, et non modulo $19$. On le confirme : $8^2 = 64 = 4 \cdot 17 - 4$.
    - |
      Le critère d'Euler suppose le module premier. Modulo $9$, l'entier $2$ est premier au module, mais $2^{\frac{9-1}2} = 16 \equiv 7 \pmod 9$ ne vaut ni $1$ ni $-1$ : la formule (ii) n'a plus de sens, $\lex{anneau-zn}{\mathbb Z/9\mathbb Z}$ n'étant pas un corps. Plus loin, le symbole de Jacobi ({{rq-jacobi|Symbole de Jacobi}}) prolonge celui de Legendre à tout module impair, par multiplicativité en le module, et non par le critère d'Euler.

  loi-reciprocite-quadratique:
    - |
      Pour savoir si $5$ est un carré modulo $19$, on retourne le symbole : comme $5 \equiv 1 \pmod 4$, la loi donne
      $$\Big(\frac 5{19}\Big) = \Big(\frac{19}5\Big) = \Big(\frac 45\Big) = 1,$$
      puisque $19 \equiv 4 \pmod 5$ et que $4 = 2^2$. Il reste à trouver une racine carrée, mais on sait qu'elle existe : $9^2 = 81 = 4 \cdot 19 + 5$.
    - |
      Quand $p$ et $q$ sont tous deux congrus à $3$ modulo $4$, les deux symboles sont opposés. Pour $p = 3$ et $q = 19$, on a $\big(\frac{19}3\big) = \big(\frac 13\big) = 1$, donc $\big(\frac 3{19}\big) = -1$ : $3$ n'est pas un carré modulo $19$, alors que $19$ en est un modulo $3$. On le vérifie sur les carrés modulo $19$, qui sont $1, 4, 9, 16, 6, 17, 11, 7, 5$ et ne contiennent pas $3$.
    - |
      La loi, jointe à la première loi complémentaire, décrit les $p$ pour lesquels $-3$ est un carré. Pour $p > 3$ premier,
      $$\Big(\frac{-3}p\Big) = \Big(\frac{-1}p\Big)\Big(\frac 3p\Big) = (-1)^{\frac{p-1}2}\Big(\frac 3p\Big),$$
      et la loi donne $\big(\frac 3p\big) = (-1)^{\frac{p-1}2}\big(\frac p3\big)$, d'où $\big(\frac{-3}p\big) = \big(\frac p3\big)$ : $-3$ est un carré modulo $p$ si et seulement si $p \equiv 1 \pmod 3$. La réponse ne dépend que de $p$ modulo $3$, ce que rien ne laissait prévoir. Plus loin, le nœud {{rq-jacobi|Symbole de Jacobi}} mène ce genre de calcul sans avoir à factoriser les entiers rencontrés.

  symbole-jacobi:
    - |
      Le symbole de Jacobi calcule un symbole de Legendre en retournant des symboles dont le module n'est pas premier. Pour le nombre premier $383$ et $a = 219 = 3 \cdot 73$, les points (i) à (iii) donnent, sans factoriser $219$,
      $$\begin{aligned} \Big(\frac{219}{383}\Big) &= -\Big(\frac{383}{219}\Big) = -\Big(\frac{164}{219}\Big) \\ &= -\Big(\frac{41}{219}\Big) = -\Big(\frac{219}{41}\Big) \\ &= -\Big(\frac{14}{41}\Big), \end{aligned}$$
      où l'on a utilisé $219 \equiv 383 \equiv 3 \pmod 4$, $164 = 4 \cdot 41$, $41 \equiv 1 \pmod 4$ et $219 \equiv 14 \pmod{41}$. Puis $\big(\frac 2{41}\big) = 1$, car $41 \equiv 1 \pmod 8$, et $\big(\frac 7{41}\big) = \big(\frac{41}7\big) = \big(\frac 67\big) = -1$, d'où $\big(\frac{219}{383}\big) = 1$ : $219$ est un carré modulo $383$.
    - |
      La valeur $1$ ne garantit pas un carré. Pour $n = 21 = 3 \cdot 7$,
      $$\Big(\frac 5{21}\Big) = \Big(\frac 53\Big)\Big(\frac 57\Big) = (-1)(-1) = 1,$$
      puisque $5 \equiv 2$ n'est pas un carré modulo $3$ ni $5$ modulo $7$, dont les carrés non nuls sont $1, 2, 4$. Pourtant $5$ n'est pas un carré modulo $21$ : il en serait un modulo $3$. Les deux facteurs $-1$ se compensent, et le symbole ne voit plus rien.
    - |
      La valeur $-1$, elle, est concluante. Pour $n = 21$ et $a = 2$, on trouve $\big(\frac 2{21}\big) = (-1)^{\frac{21^2 - 1}8} = (-1)^{55} = -1$ par la seconde loi complémentaire (ii), et donc $2$ n'est pas un carré modulo $21$ : par (i), un carré premier au module a pour symbole $1$. Pour un module composé, la valeur $-1$ prouve qu'un entier n'est pas un carré, alors que la valeur $1$, comme dans le deuxième exemple, ne permet pas de conclure.

  somme-gauss:
    - |
      Le plus petit cas, $q = 3$, se calcule dans $\lex{corps-fini}{\mathbb F_7}$ pour $p = 7$. Comme $7 \equiv 1 \pmod 3$, l'[[ordre-element|ordre]] $n$ vaut $1$, et $\zeta = 2$ est d'ordre $3$, puisque $2^3 = 8 \equiv 1$ et $2 \neq 1$. Les symboles $\big(\frac 13\big) = 1$ et $\big(\frac 23\big) = -1$ donnent
      $$\tau = \zeta - \zeta^2 = 2 - 4 = -2,$$
      et $\tau^2 = 4 \equiv -3 = q^*$ dans $\mathbb F_7$, comme l'annonce (i). Ici $\big(\frac 73\big) = \big(\frac 13\big) = 1$, et (ii) se réduit à $\tau^7 = \tau$, que le théorème de Fermat confirme.
    - |
      Pour $q = 3$ et $p = 5$, il faut sortir de $\mathbb F_5$. L'ordre de $5$ modulo $3$ est $2$, et le polynôme $X^2 + X + 1$, qui ne s'annule en aucun élément de $\mathbb F_5$ (ses valeurs en $0, 1, 2, 3, 4$ sont $1, 3, 2, 3, 1$), est irréductible : son [[corps-rupture|corps de rupture]] $F$ a $25$ éléments, et la classe $\zeta$ de $X$ y vérifie $\zeta^2 + \zeta + 1 = 0$, donc $\zeta^3 = 1$ et $\zeta \neq 1$. Alors $\tau = \zeta - \zeta^2$ et
      $$\begin{aligned} \tau^2 &= \zeta^2 - 2\zeta^3 + \zeta^4 \\ &= \zeta^2 + \zeta - 2 = -3, \end{aligned}$$
      puis $\tau^5 = \tau(\tau^2)^2 = 9\tau = -\tau$ dans $F$. On retrouve (ii) avec $\big(\frac 53\big) = \big(\frac 23\big) = -1$ : $\tau$ n'est pas dans $\mathbb F_5$, dont les cinq éléments sont les seules racines de $X^5 - X$ dans $F$, par le théorème de Fermat et la borne sur le nombre de racines.
    - |
      La [[caracteristique-corps|caractéristique]] doit être différente de $q$. Dans un corps de caractéristique $q$, le binôme en caractéristique $q$ ({{pol-binome|Binôme de Newton}}, (iv)) donne $x^q - 1 = (x - 1)^q$, si bien que $\zeta^q = 1$ entraîne $\zeta = 1$ : aucun élément n'est d'ordre $q$, et la somme $\tau$ ne peut pas être formée. C'est pourquoi la démonstration prend $p \neq q$ et cherche $\zeta$ dans une extension de $\mathbb F_p$.

  entier-algebrique:
    - |
      Le point (ii) dit sans calcul que $\sqrt 2 + \sqrt 3$ est un entier algébrique, somme des entiers $\sqrt 2$ et $\sqrt 3$, racines de $X^2 - 2$ et de $X^2 - 3$. Le calcul le confirme : avec $s = \sqrt 2 + \sqrt 3$, on a $s^2 = 5 + 2\sqrt 6$, puis $(s^2 - 5)^2 = 24$, et $s$ annule le polynôme unitaire
      $$X^4 - 10X^2 + 1.$$
      La démonstration de (ii), par le critère (i), dispense de trouver ce polynôme, ce qui devient vite impraticable pour des expressions plus compliquées.
    - |
      Un nombre avec un dénominateur peut être entier, ou ne pas l'être. Le nombre $\frac{1 + \sqrt{-3}}2$ annule $X^2 - X + 1$ : c'est un entier algébrique. Le nombre $\beta = \frac{1 + \sqrt 3}2$ n'en est pas un : il annule $X^2 - X - \frac12$, qui est son [[polynome-minimal|polynôme minimal]] sur $\lex{ensemble-rationnels}{\mathbb Q}$, puisque $\beta$ n'est pas rationnel, $\sqrt 3$ ne l'étant pas ($p^2 = 3q^2$ avec $p \wedge q = 1$ forcerait $3 \mid p$, puis $3 \mid q$). Ce polynôme n'est pas à coefficients entiers, ce qu'exigerait le point (iv).
    - |
      Dans le critère (i), l'hypothèse « de type fini » ne peut pas être omise. Le sous-groupe $M = \lex{ensemble-rationnels}{\mathbb Q}$ de $\lex{ensemble-complexes}{\mathbb C}$ vérifie $\frac12 M \subset M$, et pourtant $\frac12$, rationnel non entier, n'est pas un entier algébrique, par (iii). Le groupe $\mathbb Q$ n'est engendré par aucune partie finie : avec des générateurs $\frac{a_1}b, \dots, \frac{a_k}b$ écrits sur un dénominateur commun $b \geqslant 1$, on n'obtiendrait que des fractions $\frac cb$, $c \in \lex{ensemble-entiers-relatifs}{\mathbb Z}$, et jamais $\frac1{2b}$. Pour $\sqrt 2$, au contraire, $M = \mathbb Z + \mathbb Z\sqrt 2$ convient.

  norme-algebrique:
    - |
      Avec la trace, la norme décide de l'intégralité, par le point (i). Le nombre $\alpha = \frac{1 + \sqrt{-3}}2$ a pour trace $1$ et pour norme $\frac14 + \frac34 = 1$ : c'est un [[entier-algebrique|entier algébrique]]. Le nombre $\beta = \frac{1 + \sqrt 3}2$ a aussi pour trace $1$, mais pour norme $\frac14 - \frac34 = -\frac12$ : ce n'en est pas un. Le même dénominateur $2$ est permis ou interdit selon la classe de $d$ modulo $4$, ici $-3 \equiv 1$ et $3 \equiv 3$, comme le précise le point (ii).
    - |
      La norme est multiplicative, puisque la conjugaison est un automorphisme de $K$ : $N(\alpha\beta) = \alpha\beta\,\bar\alpha\bar\beta = N(\alpha)N(\beta)$. Elle transforme la divisibilité dans $\lex{anneau-entiers}{\mathcal O_K}$ en divisibilité d'entiers : si $\alpha = \beta\gamma$ avec $\gamma \in \mathcal O_K$, alors $N(\beta)$ divise $N(\alpha)$, $N(\gamma)$ étant entier par (i). Ainsi, dans $\mathbb Z[\sqrt{-5}]$, $2$ ne divise pas $1 + \sqrt{-5}$, puisque $N(2) = 4$ ne divise pas $N(1 + \sqrt{-5}) = 6$.
    - |
      Le signe de la norme dépend du signe de $d$. Pour $d < 0$, $N(a + b\sqrt d) = a^2 + |d|b^2$ est positive, nulle seulement en $0$ ; pour $d = 2$, $N(1 + \sqrt 2) = -1$ et $N(3 + 2\sqrt 2) = 1$. Les éléments de norme $\pm 1$ de $\mathcal O_K$ y sont inversibles, puisque $\alpha \cdot (\pm\bar\alpha) = 1$ et que $\bar\alpha$, de même trace et de même norme que $\alpha$, est entier en même temps que lui, par (i). Plus loin, le nœud {{an-unites|Norme et unités}}, (ii), établit la réciproque : les unités sont exactement les éléments de norme $\pm 1$.

  norme-ideal:
    - |
      Dans $\mathbb Z[i]$, anneau des entiers de $\lex{ensemble-rationnels}{\mathbb Q}(i)$ ({{an-quadratiques|Corps quadratiques}}, (ii)), l'idéal $(2 + i)$ a pour norme $|N(2 + i)| = 5$ par (iii). On le voit sur le quotient : modulo $2 + i$, on a $i \equiv -2$, donc $a + bi \equiv a - 2b$, et tout élément est congru à l'un des entiers $0, 1, 2, 3, 4$, deux à deux non congrus puisque $(2 + i) \cap \mathbb Z = 5\mathbb Z$, un entier multiple de $2 + i$ ayant une norme, son carré, multiple de $5$. De même, $(3)$ est de norme $9$, et $\mathbb Z[i]/(3)$ est formé des classes des $a + bi$, $0 \leqslant a, b \leqslant 2$.
    - |
      La multiplicativité (ii) se lit sur une factorisation. Dans $\mathbb Z[i]$, $2 = -i(1 + i)^2$, donc $(2) = (1 + i)^2$, et
      $$N\big((2)\big) = 4 = N\big((1 + i)\big)^2,$$
      puisque $|N(1 + i)| = 2$. Dans $\mathbb Z[\sqrt{-5}]$, la factorisation $(3) = \mathfrak q\mathfrak q'$ de la première remarque de {{an-factorisation|Factorisation des idéaux}} donne $N(\mathfrak q)N(\mathfrak q') = N\big((3)\big) = 9$, et, aucun des deux n'étant l'anneau, $N(\mathfrak q) = N(\mathfrak q') = 3$.
    - |
      La multiplicativité tombe hors de l'anneau des entiers. Dans $A = \mathbb Z[\sqrt{-3}]$, strictement plus petit que l'anneau des entiers $\mathbb Z\big[\frac{1 + \sqrt{-3}}2\big]$, l'idéal $J = (2, 1 + \sqrt{-3})$ est formé des $a + b\sqrt{-3}$ avec $a \equiv b \pmod 2$, d'indice $2$. Comme $(1 + \sqrt{-3})^2 = 2(-1 + \sqrt{-3})$ et $-1 + \sqrt{-3} = (1 + \sqrt{-3}) - 2$, on trouve $J^2 = 2J$. Or $[A : 2J] = [A : 2A]\,[2A : 2J] = 4 \cdot 2 = 8$, alors que $[A : J]^2 = 4$ : l'indice de $J^2$ n'est pas le carré de celui de $J$.

  groupe-classes:
    - |
      Le groupe des classes de $\lex{ensemble-rationnels}{\mathbb Q}(\sqrt{-2})$ est trivial. Ici $d = -2 \equiv 2 \pmod 4$, $\mathcal O = \mathbb Z[\sqrt{-2}]$ et $C_{-2} = 3$ : par (ii), il suffit de voir que les idéaux de norme $2$ ou $3$ sont principaux. Un idéal de norme $m$ contient $m$, donc divise $(m)$ ({{an-norme-ideal|Norme d'un idéal}}, (i) et (iv)). Or
      $$\begin{aligned} (2) &= (\sqrt{-2})^2, \\ (3) &= (1 + \sqrt{-2})(1 - \sqrt{-2}), \end{aligned}$$
      où $(\sqrt{-2})$ et $(1 \pm \sqrt{-2})$, de normes $2$ et $3$, nombres premiers, sont des idéaux premiers (même nœud, (iii) et (iv)). Par unicité de la factorisation ({{an-factorisation|Factorisation des idéaux}}), un idéal de norme $2$ est $(\sqrt{-2})$, un idéal de norme $3$ est $(1 + \sqrt{-2})$ ou $(1 - \sqrt{-2})$ : tous sont principaux, et $\mathbb Z[\sqrt{-2}]$ est principal par (iii).
    - |
      Pour $K = \mathbb Q(\sqrt{-5})$, le groupe des classes n'est pas trivial : il contient un élément d'ordre $2$. L'idéal $\mathfrak p = (2, 1 + \sqrt{-5})$ n'est pas principal, mais son carré $\mathfrak p^2 = (2)$ l'est ({{an-ideaux|Idéaux}}, (ii)). Dans $\operatorname{Cl}(K)$, on a donc $[\mathfrak p] \neq 1$ et $[\mathfrak p]^2 = [(2)] = 1$. Le défaut de factorialité de $\mathbb Z[\sqrt{-5}]$, $6 = 2 \cdot 3 = (1 + \sqrt{-5})(1 - \sqrt{-5})$, se lit ainsi dans un groupe abélien fini.
    - |
      Le produit des classes se constate sur les idéaux de $\mathbb Z[\sqrt{-5}]$. Avec $\mathfrak q = (3, 1 + \sqrt{-5})$, dans la classe de $\mathfrak p$ par le premier exemple de [[classe-ideaux|classe d'idéaux]], on a $[\mathfrak p][\mathfrak q] = [\mathfrak p]^2 = 1$, et en effet $\mathfrak p\mathfrak q = (1 + \sqrt{-5})$ est principal. Plus loin, le nœud {{an-classes-z5|Classes de ℤ[√−5]}} montre que $\operatorname{Cl}(\mathbb Q(\sqrt{-5}))$ a exactement deux éléments, la classe des idéaux principaux et celle de $\mathfrak p$.

  anneau-entiers:
    - |
      L'anneau des entiers de $\lex{ensemble-rationnels}{\mathbb Q}(i)$ est $\mathbb Z[i]$. Il contient $\mathbb Z[i]$, puisque $i$, racine de $X^2 + 1$, est un [[entier-algebrique|entier algébrique]] et que $\lex{anneau-entiers}{\mathcal O_K}$ est un anneau (ii). Réciproquement, soit $\alpha = a + bi$ entier, avec $a, b \in \mathbb Q$. Si $b = 0$, $\alpha$ est rationnel, donc dans $\mathbb Z$ par (iii). Si $b \neq 0$, son [[polynome-minimal|polynôme minimal]], $(X - a)^2 + b^2$, sans racine réelle, est à coefficients entiers (iv). Ainsi $m = 2a$ et $a^2 + b^2$ sont entiers, et $n = 2b$ aussi, par (iii), puisque ce rationnel annule le polynôme unitaire $X^2 - \big(4(a^2 + b^2) - m^2\big)$, à coefficients entiers.

      Comme $m^2 + n^2 = 4(a^2 + b^2)$ est divisible par $4$, et qu'un carré est congru à $0$ ou à $1$ modulo $4$, les entiers $m$ et $n$ sont pairs : $a$ et $b$ sont entiers.
    - |
      Le générateur « évident » d'un corps ne donne pas toujours tout l'anneau des entiers. Dans $K = \mathbb Q(\sqrt{-3})$, le nombre $j = \frac{-1 + \sqrt{-3}}{2}$ annule $X^2 + X + 1$, unitaire à coefficients entiers : il est dans $\mathcal O_K$. Il n'est pas dans $\mathbb Z[\sqrt{-3}] = \{a + b\sqrt{-3} : a, b \in \mathbb Z\}$, puisque son coefficient sur $1$ vaut $-\frac12$ dans l'écriture $a + b\sqrt{-3}$, unique car $1$ et $\sqrt{-3}$ sont libres sur $\mathbb Q$. Ainsi $\mathbb Z[\sqrt{-3}]$ est strictement contenu dans $\mathcal O_K$.
    - |
      L'anneau des entiers d'un corps de nombres $K$ n'est jamais un corps. Il contient $2$, mais pas $\frac12$ : ce rationnel n'est pas dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, donc n'est pas un entier algébrique, par (iii), bien qu'il soit racine du polynôme $2X - 1$, à coefficients entiers mais non [[polynome-unitaire|unitaire]]. C'est l'exigence d'un polynôme unitaire qui écarte ce rationnel. Plus loin, le nœud {{an-quadratiques|Corps quadratiques}}, (ii), calcule l'anneau des entiers de tout corps quadratique : c'est $\mathbb Z[\sqrt d]$ ou $\mathbb Z\big[\frac{1 + \sqrt d}2\big]$ selon la classe de $d$ modulo $4$, ce qui redonne les deux premiers exemples.

  entiers-gauss:
    - |
      La division euclidienne de (i) se fait en arrondissant le quotient complexe. Pour $\alpha = 7 + 2i$ et $\beta = 2 - i$, on calcule dans $\lex{ensemble-complexes}{\mathbb C}$
      $$\frac\alpha\beta = \frac{(7 + 2i)(2 + i)}{5} = \frac{12}5 + \frac{11}5\,i,$$
      et l'on prend pour $q$ le point du réseau $\lex{entiers-gauss}{\mathbb Z[i]}$ le plus proche, $q = 2 + 2i$. Le reste $r = \alpha - \beta q = 1$ vérifie bien $N(r) = 1 < N(\beta) = 5$. Ce n'est pas un hasard : un point du plan est à distance au plus $\frac{\sqrt 2}2$ d'un point du réseau, et $N(r) = N(\beta)\,\big|\frac\alpha\beta - q\big|^2 \leqslant \frac12 N(\beta)$.
      ```schema lex-entiers-gauss-1
      Le quotient $\alpha/\beta = \frac{12}5 + \frac{11}5 i$, en rouge, tombe dans un carré du réseau $\mathbb Z[i]$ ; le sommet le plus proche, $q = 2 + 2i$, en bleu, est à une distance au plus égale à la demi-diagonale $\frac{\sqrt 2}2$ du carré, en pointillé.
      ```
    - |
      L'algorithme d'Euclide dans $\mathbb Z[i]$ calcule la décomposition de $29$ en somme de deux carrés. Comme $29 \equiv 1 \pmod 4$ et $12^2 = 144 = 5 \cdot 29 - 1$, l'entier $12$ est une racine carrée de $-1$ modulo $29$, et l'on cherche un pgcd de $29$ et $12 + i$ :
      $$\begin{aligned} 29 &= (12 + i) \cdot 2 + (5 - 2i), \\ 12 + i &= (5 - 2i)(2 + i). \end{aligned}$$
      Le dernier reste non nul est $5 - 2i$, de norme $25 + 4 = 29$ : on trouve $29 = 5^2 + 2^2 = (5 - 2i)(5 + 2i)$, comme l'annonce le théorème de Fermat (ii).
    - |
      Dans $\mathbb Z[\sqrt{-5}]$, anneau des entiers de $\lex{ensemble-rationnels}{\mathbb Q}(\sqrt{-5})$ ({{an-quadratiques|Corps quadratiques}}, (ii)), la division euclidienne pour la norme tombe. Divisons $\alpha = 1 + \sqrt{-5}$ par $\beta = 2$ : le quotient $\frac12 + \frac12\sqrt{-5}$ est au centre d'une maille du réseau, et, pour chacun des quatre sommets $q$ de cette maille, $\frac\alpha\beta - q = \pm\frac12 \pm \frac12\sqrt{-5}$ a pour norme $\frac14 + \frac54 = \frac32$.

      Le reste $r = \alpha - 2q$ a donc pour norme $4 \cdot \frac32 = 6 \geqslant N(2) = 4$, et les autres $q$ donnent des restes plus grands encore. Le réseau, de maille $1 \times \sqrt 5$, est trop allongé pour que l'arrondi suffise. Plus loin, le nœud {{an-ideaux|Idéaux}} montre que cet anneau n'est même pas factoriel.
      ```schema lex-entiers-gauss-3
      Dans le réseau $\mathbb Z[\sqrt{-5}]$, de maille $1 \times \sqrt 5$, le quotient $\frac{1 + \sqrt{-5}}2$, en rouge, est au centre d'une maille. Les quatre sommets, en bleu, sont à la distance $\sqrt{3/2}$, plus grande que $1$, alors que la division euclidienne demanderait un point du réseau à distance strictement inférieure à $1$.
      ```

  nombre-classes:
    - |
      Pour $K = \lex{ensemble-rationnels}{\mathbb Q}(\sqrt 2)$, corps réel, $h_K = 1$. Ici $\mathcal O = \mathbb Z[\sqrt 2]$ et $C_2 = 3$. Un idéal de norme $2$ contient $2$ et divise $(2) = (\sqrt 2)^2$ ({{an-norme-ideal|Norme d'un idéal}}, (i) et (iv)), où $(\sqrt 2)$, de norme $|N(\sqrt 2)| = 2$, est premier : c'est $(\sqrt 2)$, principal. Il n'y a pas d'idéal de norme $3$ : le quotient serait un anneau à trois éléments, donc $\mathbb Z/3\mathbb Z$, son groupe additif étant engendré par $1$, et l'image $s$ de $\sqrt 2$ y vérifierait $s^2 = 2$, alors que les carrés modulo $3$ sont $0$ et $1$. Toute classe contient donc un idéal principal ({{an-classes|Groupe des classes}}, (ii)), et $h_K = 1$.
    - |
      Pour $K = \mathbb Q(\sqrt{-3})$, on a aussi $h_K = 1$. Ici $d \equiv 1 \pmod 4$, $\mathcal O = \mathbb Z[\omega]$ avec $\omega = \frac{1 + \sqrt{-3}}2$, racine de $X^2 - X + 1$, et $C_{-3} = 2 + 1 = 3$. Un idéal de norme $2$ donnerait un quotient $\mathbb Z/2\mathbb Z$ où l'image de $\omega$ annulerait $X^2 - X + 1$, qui vaut $1$ en $0$ et en $1$ modulo $2$ : il n'y en a pas. Un idéal de norme $3$ divise $(3) = (\sqrt{-3})^2$, avec $\sqrt{-3} = 2\omega - 1 \in \mathcal O$ de norme $3$, donc $(\sqrt{-3})$ premier : par unicité de la factorisation, c'est l'idéal principal $(\sqrt{-3})$, et $h_K = 1$.
    - |
      Le nombre de classes peut dépasser $1$. Pour $K = \mathbb Q(\sqrt{-6})$, $\mathcal O = \mathbb Z[\sqrt{-6}]$, l'application $a + b\sqrt{-6} \mapsto \bar a$ est un morphisme d'anneaux surjectif sur $\mathbb Z/2\mathbb Z$, puisque le produit de $a + b\sqrt{-6}$ et $c + d\sqrt{-6}$ a pour coefficient sur $1$ l'entier $ac - 6bd \equiv ac$. Son noyau, formé des $a + b\sqrt{-6}$ avec $a$ pair, est l'idéal $I = (2, \sqrt{-6})$, de norme $2$. S'il était engendré par $\beta = a + b\sqrt{-6}$, on aurait $a^2 + 6b^2 = |N(\beta)| = 2$ ({{an-norme-ideal|Norme d'un idéal}}, (iii)), ce qui est impossible : $I$ n'est pas principal, et $h_K \geqslant 2$. La seconde remarque du nœud {{an-classes|Groupe des classes}} indique que l'on trouve exactement $h_K = 2$.

  indice-ideal:
    - |
      Dans $\mathbb Z[i]$, anneau des entiers de $\lex{ensemble-rationnels}{\mathbb Q}(i)$ ({{an-quadratiques|Corps quadratiques}}, (ii)), l'idéal $(2)$ est formé des $a + bi$ avec $a$ et $b$ pairs : la classe de $a + bi$ modulo $(2)$ ne dépend que des parités de $a$ et de $b$, et $\mathbb Z[i]/(2)$ a quatre éléments, les classes de $0$, $1$, $i$ et $1 + i$, si bien que $\lex{indice-ideal}{[\mathcal O : (2)]} = 4$. L'idéal $(1 + i)$, qui contient $2 = (1 + i)(1 - i)$, contient strictement $(2)$, puisque $1 + i \notin (2)$, et son indice est $2$ : modulo $1 + i$, on a $i \equiv -1 \equiv 1$, et tout élément est congru à $0$ ou à $1$, qui ne sont pas congrus, $1 + i$ n'étant pas inversible ({{an-unites|Norme et unités}}, (ii)). Le plus grand idéal a le plus petit indice, comme le veut (i).
    - |
      Dans $\mathcal O = \mathbb Z[\sqrt{-5}]$, l'idéal $\mathfrak p = (2, 1 + \sqrt{-5})$ du nœud {{an-ideaux|Idéaux}}, (ii), est d'indice $2$. Il est formé des $a + b\sqrt{-5}$ tels que $a \equiv b \pmod 2$ : cet ensemble contient les générateurs, il est stable par addition et par multiplication par $\sqrt{-5}$, qui envoie $a + b\sqrt{-5}$ sur $-5b + a\sqrt{-5}$, donc c'est un idéal contenant $\mathfrak p$. Inversement, si $a \equiv b \pmod 2$, alors $a + b\sqrt{-5} = b(1 + \sqrt{-5}) + (a - b)$ est dans $\mathfrak p$. Les classes de $0$ et de $1$ épuisent donc $\mathcal O/\mathfrak p$ : $[\mathcal O : \mathfrak p] = 2$.
    - |
      La finitude de l'indice est une propriété de l'anneau des entiers, non de tout anneau. Dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}[X]$, l'idéal non nul $(X)$ est le noyau du morphisme surjectif $P \mapsto P(0)$ sur $\mathbb Z$, et le quotient $\mathbb Z[X]/(X)$, isomorphe à $\mathbb Z$, est infini. Dans $\lex{anneau-entiers}{\mathcal O_K}$, au contraire, tout idéal non nul est d'indice fini ({{an-ideaux|Idéaux}}, (iii)). Plus loin, le nœud {{an-norme-ideal|Norme d'un idéal}} fait de l'indice la norme d'un idéal, et la montre multiplicative.

  conjugue-quadratique:
    - |
      Dans $\lex{ensemble-rationnels}{\mathbb Q}(\sqrt 2)$, le conjugué de $\alpha = 3 + 2\sqrt 2$ est $\bar\alpha = 3 - 2\sqrt 2$ : la trace vaut $6$ et la [[norme-algebrique|norme]] $9 - 8 = 1$. Le nombre $\alpha$ annule donc $(X - \alpha)(X - \bar\alpha) = X^2 - 6X + 1$, et son conjugué aussi : $\alpha$ et $\bar\alpha$ sont les deux racines d'un même polynôme à coefficients rationnels. Comme $\bar\alpha = 1/\alpha$, la norme $1$ dit que $\alpha$ est inversible dans $\mathbb Z[\sqrt 2]$.
    - |
      Pour $d < 0$, le conjugué est le [[conjugue-complexe|conjugué complexe]]. Dans $\mathbb Q(\sqrt{-3})$, celui de $j = \frac{-1 + \sqrt{-3}}2$ est $\bar j = \frac{-1 - \sqrt{-3}}2 = j^2$, et la norme $j\bar j = |j|^2 = 1$ est le carré du module. Pour $d < 0$, la norme d'un élément non nul est donc toujours strictement positive.
    - |
      Pour $d > 0$, le conjugué n'est pas le conjugué complexe. Dans $\mathbb Q(\sqrt 2) \subset \lex{ensemble-reels}{\mathbb R}$, le conjugué complexe de $\sqrt 2$ est $\sqrt 2$, alors que son conjugué quadratique est $-\sqrt 2$ ; et la norme $N(1 + \sqrt 2) = 1 - 2 = -1$ est négative, ce qu'aucun carré de module ne peut être. La conjugaison quadratique est l'automorphisme non trivial de $K$, celui du [[groupe-galois|groupe de Galois]] $\{\mathrm{id}, \alpha \mapsto \bar\alpha\}$, et non une opération sur les nombres complexes.

  non-residu-quadratique:
    - |
      Modulo $7$, les non-résidus sont $3$, $5$ et $6$, les [[residu-quadratique|résidus]] étant $1, 2, 4$. Le produit de deux non-résidus est un résidu, $3 \cdot 5 = 15 \equiv 1$ et $3 \cdot 6 = 18 \equiv 4$, alors que celui d'un résidu par un non-résidu est un non-résidu, $2 \cdot 3 = 6$ : c'est ce que dit la multiplicativité du [[symbole-legendre|symbole de Legendre]], morphisme de $\mathbb F_7^\times$ sur $\{\pm 1\}$.
    - |
      Un générateur du groupe $\lex{corps-fini}{\mathbb F_p}^\times$ est toujours un non-résidu, mais un non-résidu n'est pas toujours un générateur. Si $g = x^2$, alors $g^{\frac{p-1}2} = x^{p-1} = 1$ par le théorème de Fermat, et $g$ n'est pas d'[[ordre-element|ordre]] $p - 1$. Modulo $7$, les générateurs sont $3$ et $5$, d'ordre $6$, et le non-résidu $6 \equiv -1$ n'en est pas un, puisqu'il est d'ordre $2$.
    - |
      Un non-résidu explique qu'un nombre premier ne soit pas somme de deux carrés. Pour $p = 19 \equiv 3 \pmod 4$, l'entier $-1$ est un non-résidu, par la première loi complémentaire (iv). Si l'on avait $19 = a^2 + b^2$, ni $a$ ni $b$ ne serait divisible par $19$, et $(ab^{-1})^2 \equiv -1$ dans $\mathbb F_{19}$ ferait de $-1$ un résidu : c'est le sens facile du théorème des deux carrés ({{an-gauss|Deux carrés}}, (ii)).

  classe-ideaux:
    - |
      Deux idéaux distincts peuvent être dans la même classe. Dans $\mathcal O = \mathbb Z[\sqrt{-5}]$, les idéaux $\mathfrak p = (2, 1 + \sqrt{-5})$ et $\mathfrak q = (3, 1 + \sqrt{-5})$ sont distincts, noyaux de morphismes surjectifs sur $\mathbb Z/2\mathbb Z$ et sur $\mathbb Z/3\mathbb Z$, et vérifient $\mathfrak p\mathfrak q = (1 + \sqrt{-5})$ et $\mathfrak p^2 = (2)$ (première remarque de {{an-factorisation|Factorisation des idéaux}}). Il vient
      $$(1 + \sqrt{-5})\,\mathfrak p = \mathfrak p^2\mathfrak q = 2\,\mathfrak q,$$
      c'est-à-dire $\alpha\mathfrak p = \beta\mathfrak q$ avec $\alpha = 1 + \sqrt{-5}$ et $\beta = 2$, non nuls : $\mathfrak p \sim \mathfrak q$.
    - |
      La classe de $\mathcal O$ est formée exactement des [[ideal-principal|idéaux principaux]] non nuls. Un idéal $(\gamma)$, $\gamma \neq 0$, vérifie $1 \cdot (\gamma) = \gamma\,\mathcal O$. Réciproquement, si $\alpha I = \beta\mathcal O$, l'élément $\beta$ est dans $\alpha I$, donc $\delta = \beta/\alpha$ est dans $I$, et $\alpha I = \alpha\delta\,\mathcal O$ donne $I = (\delta)$, $\alpha$ étant non nul dans l'anneau intègre $\mathcal O$. La condition $\alpha, \beta \neq 0$ est indispensable : avec $\alpha = \beta = 0$, la relation $0 \cdot I = 0 \cdot J$ relierait deux idéaux quelconques, et il n'y aurait plus qu'une classe.
