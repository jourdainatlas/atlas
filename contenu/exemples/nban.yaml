# Exemples du lexique : théorie « Théorie analytique des nombres » (nban).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  fonction-zeta:
    - |
      Sur la demi-droite réelle $]1, +\infty[$, la comparaison avec une intégrale encadre $\zeta$ et fait voir son [[pole|pôle]] en $1$. Pour $\sigma > 1$, la fonction $x \mapsto x^{-\sigma}$ est positive et décroissante, et le point (iv) du nœud {{nb-sommation|Sommation d'Abel}} donne, avec $\int_1^N x^{-\sigma}\,dx = \frac{1 - N^{1-\sigma}}{\sigma - 1}$ et en faisant tendre $N$ vers l'infini,
      $$\frac1{\sigma - 1} \leqslant \zeta(\sigma) \leqslant 1 + \frac1{\sigma - 1}.$$
      Ainsi $(\sigma - 1)\zeta(\sigma)$, compris entre $1$ et $\sigma$, tend vers $1$ : c'est le résidu $1$ annoncé par la remarque du nœud {{nb-zeta|Fonction ζ}}. Pour $\sigma = 2$, l'encadrement donne $1 \leqslant \zeta(2) \leqslant 2$, et un calcul numérique donne $\zeta(2) \approx 1{,}645$.
    - |
      Le prolongement de $\zeta$ n'est plus la somme de la série. Pour $0 < \sigma < 1$ réel, les formules du point (ii) du nœud {{nb-zeta|Fonction ζ}} donnent $\zeta(\sigma) = \frac{Z(\sigma)}{\sigma - 1} = \frac1{\sigma - 1} + \sum_n \varphi_n(\sigma)$. Comme $x^{-\sigma}$ décroît sur $[n, n + 1]$, on a $0 \leqslant \varphi_n(\sigma) \leqslant n^{-\sigma} - (n + 1)^{-\sigma}$, et la somme de ces majorants, télescopique, vaut $1$. Donc
      $$\frac1{\sigma - 1} \leqslant \zeta(\sigma) \leqslant \frac\sigma{\sigma - 1} < 0,$$
      soit $-2 \leqslant \zeta(\frac12) \leqslant -1$ ; un calcul numérique donne $\zeta(\frac12) \approx -1{,}46$. Pourtant les termes $n^{-1/2}$ sont positifs, et leurs sommes partielles, au moins $2(\sqrt{N + 1} - 1)$ par comparaison avec une intégrale, tendent vers $+\infty$ : hors du demi-plan $\operatorname{Re} s > 1$, l'égalité $\zeta(s) = \sum_n n^{-s}$ tombe.
      ```schema lex-fonction-zeta-2
      La fonction $\zeta$ sur $]0, 1[$ et sur $]1, 4]$, en rouge, calculée numériquement, entre les deux courbes pointillées $\frac1{\sigma - 1}$ et $\frac1{\sigma - 1} + 1$, en gris. Elle est négative sur $]0, 1[$, où la série diverge, et le point rouge marque $\zeta(\frac12) \approx -1{,}46$.
      ```
    - |
      Sur la demi-droite réelle $]1, +\infty[$, $\zeta$ décroît strictement de $+\infty$ à $1$. Sa dérivée, $\zeta'(\sigma) = -\sum_n \ln n \cdot n^{-\sigma}$ ({{nb-zeta|Fonction ζ}}, (i)), est strictement négative, puisque ses termes sont négatifs, celui de rang $2$, $-\ln 2 \cdot 2^{-\sigma}$, strictement. La comparaison avec $\int_2^{+\infty} x^{-\sigma}\,dx$ pour les termes de rang au moins $3$ donne
      $$1 < \zeta(\sigma) \leqslant 1 + 2^{-\sigma} + \frac{2^{1-\sigma}}{\sigma - 1},$$
      qui tend vers $1$ quand $\sigma \to +\infty$ ; le premier exemple donne la limite $+\infty$ en $1$. Plus loin, le produit eulérien montrera que $\zeta$ ne s'annule pas sur le demi-plan $\operatorname{Re} s > 1$ ({{nb-euler|Produit eulérien}}, (ii)).

  produit-euler:
    - |
      Développer le produit, c'est énumérer les entiers par leur factorisation. Pour $s = 2$ et les deux premiers nombres premiers,
      $$\begin{aligned} P_3(2) &= \frac1{1 - \frac14} \cdot \frac1{1 - \frac19} \\ &= \frac43 \cdot \frac98 = \frac32, \end{aligned}$$
      et $\frac32$ est aussi la somme des $n^{-2}$ sur les entiers $n = 2^a3^b$, puisque $\sum_{a, b} 4^{-a}9^{-b}$ est le produit des deux séries géométriques. On trouve ensuite $P_5(2) = \frac{25}{16}$ et $P_7(2) = \frac{1225}{768} \approx 1{,}595$, à environ $0{,}05$ de $\zeta(2) \approx 1{,}645$, bien en deçà de la majoration $2\sum_{n > 7} n^{-2} \leqslant \frac27$ du point (i) du nœud {{nb-euler|Produit eulérien}}.
    - |
      Le produit eulérien n'a pas de sens hors du demi-plan $\operatorname{Re} s > 1$. Pour $s = \frac12$, chaque facteur est défini, puisque $p^{-1/2} < 1$, et le calcul du point (i), à termes positifs, donne
      $$\begin{aligned} P_N(\tfrac12) &\geqslant \sum_{n \leqslant N} n^{-1/2} \\ &\geqslant 2\big(\sqrt{N + 1} - 1\big), \end{aligned}$$
      par comparaison avec une intégrale : les produits partiels tendent vers $+\infty$. La [[fonction-zeta|fonction zêta]] prolongée prend pourtant en $\frac12$ une valeur comprise entre $-2$ et $-1$, comme le montre le deuxième exemple de son entrée : l'égalité $\zeta(s) = \prod_p (1 - p^{-s})^{-1}$ tombe dès qu'on retire l'hypothèse $\operatorname{Re} s > 1$.
    - |
      Retirer un facteur revient à retirer les multiples du nombre premier correspondant. Pour $\operatorname{Re} s > 1$, la série qui définit $\zeta(s)$ converge absolument, et $\zeta(s) - 2^{-s}\zeta(s)$ est la somme des $n^{-s}$ sur les entiers impairs. Comme $(1 - 2^{-s})P_N(s)$ est le produit des facteurs relatifs aux $p \geqslant 3$, le point (i) du nœud {{nb-euler|Produit eulérien}} donne
      $$\begin{aligned} \sum_{n\ \mathrm{impair}} n^{-s} &= (1 - 2^{-s})\,\zeta(s) \\ &= \prod_{p \geqslant 3} (1 - p^{-s})^{-1}. \end{aligned}$$
      Pour $s = 2$, la somme des inverses des carrés impairs vaut $\frac34\zeta(2) \approx 1{,}234$.

  fonction-tchebychev:
    - |
      La fonction de Tchebychev est le [[logarithme]] du produit des nombres premiers jusqu'à $x$. Ainsi $\theta(10) = \ln(2 \cdot 3 \cdot 5 \cdot 7) = \ln 210 \approx 5{,}347$, bien en dessous de la borne $10\ln 4 \approx 13{,}863$ du point (iii) du nœud {{nb-chebyshev|θ(x) ≤ x ln 4}}, qui revient à $210 \leqslant 4^{10}$. De même, $\theta(30) = \ln 6\,469\,693\,230 \approx 22{,}59$, à comparer à $30\ln 4 \approx 41{,}59$. Comme $\theta$ ne change qu'aux nombres premiers, $\theta(x) = \theta(\lfloor x \rfloor)$ pour tout $x \geqslant 1$.
    - |
      Dans le point (ii) du nœud {{nb-chebyshev|θ(x) ≤ x ln 4}}, la condition $p > n + 1$ ne peut pas être retirée. Si $p = n + 1$ est premier, alors $2p > 2n + 1$ : parmi les entiers de $1$ à $2n + 1$, seul $p$ est multiple de $p$, et $p^2$ ne le divise pas. Par le lemme d'Euclide, $p$ figure donc une seule fois dans la décomposition de $(2n + 1)!$, et une fois dans celle de $(n + 1)!$. Par l'égalité $(2n + 1)! = \binom{2n+1}n\,n!\,(n + 1)!$ et l'unicité de la décomposition en facteurs premiers ({{z-premiers|Nombres premiers}}, (ii)), $p$ ne divise pas $\binom{2n+1}n$. Ainsi $3$ ne divise pas $\binom52 = 10$, et $5$ ne divise pas $\binom94 = 126 = 2 \cdot 3^2 \cdot 7$, alors que $5$ divise le premier et $7$ le second, comme le veut le point (ii).
    - |
      La majoration $\theta(x) \leqslant x\ln 4$ est loin d'être optimale sur les petites valeurs. Sur $[1, 100]$, le graphe en escalier de $\theta$, qui saute de $\ln p$ en chaque nombre premier $p$, reste sous la droite $y = x$, elle-même sous la droite $y = x\ln 4$, puisque $\ln 4 > 1$ : comme $\theta$ est constante entre deux nombres premiers et que $x$ croît, il suffit de vérifier $\theta(p) < p$ aux $25$ nombres premiers $p \leqslant 100$, ce qu'un calcul direct confirme.
      ```schema lex-fonction-tchebychev-3
      La fonction $\theta$, en rouge, sur $[1, 100]$, la droite $y = x\ln 4$ de la majoration, en bleu, et la droite $y = x$, en pointillé gris. Sur cet intervalle, $\theta(x)$ reste en dessous de $x$.
      ```
      Plus loin, le théorème des nombres premiers affirmera que $\theta(x)/x$ tend vers $1$ ({{nb-tnp|Théorème des nombres premiers}}, (ii)).

  fonction-compte-premiers:
    - |
      Les premières valeurs montrent que $\pi(x)$ est de l'ordre de $\frac x{\ln x}$, sans en être encore très proche. On compte $\pi(10) = 4$, $\pi(100) = 25$ et $\pi(1000) = 168$ [[nombre-premier|nombres premiers]], et les rapports $\pi(x)\ln x/x$ valent environ $0{,}92$, $1{,}15$ et $1{,}16$ : ils passent au-dessus de $1$ et ne s'en rapprochent pas encore. La fonction $\pi$ est en escalier, constante entre deux nombres premiers consécutifs, et saute de $1$ en chacun.
    - |
      La majoration de $\theta$ donne une majoration de $\pi$ de la bonne forme. Chaque $\ln p$ est au plus $\ln x$, d'où $\theta(x) \leqslant \pi(x)\ln x$. Dans l'autre sens, les nombres premiers $p$ de $]\sqrt x, x]$ vérifient $\ln p > \frac12\ln x$ ; ils sont $\pi(x) - \pi(\sqrt x)$, et $\pi(\sqrt x) \leqslant \sqrt x$, d'où, avec le point (iii) du nœud {{nb-chebyshev|θ(x) ≤ x ln 4}},
      $$\begin{aligned} \pi(x) &\leqslant \sqrt x + \frac{2\,\theta(x)}{\ln x} \\ &\leqslant \sqrt x + \frac{2\ln 4 \cdot x}{\ln x}. \end{aligned}$$
      Pour $x = 100$, cela donne $\pi(100) \leqslant 70{,}3$, pour une valeur exacte de $25$ : la borne est grossière, mais elle a déjà l'ordre de grandeur $\frac x{\ln x}$.
    - |
      La convergence de $\pi(x)\ln x/x$ vers $1$ est lente. On trouve $\pi(10^4) = 1229$ et $\pi(10^6) = 78\,498$, d'où des rapports d'environ $1{,}13$ et $1{,}08$. Plus loin, le théorème des nombres premiers ({{nb-tnp|Théorème des nombres premiers}}, (iii)) établira $\pi(x) \sim \frac x{\ln x}$, sans rien dire de la vitesse de convergence.

  continue-par-morceaux:
    - |
      Une [[fonction-escalier|fonction en escalier]] est continue par morceaux, et sa valeur aux points de la [[subdivision]] ne compte pas. Sur $[0, 3]$, la [[partie-entiere|partie entière]] $t \mapsto \lfloor t \rfloor$ est constante sur chacun des intervalles $]0, 1[$, $]1, 2[$ et $]2, 3[$, où elle se prolonge en une constante sur l'intervalle fermé. Son intégrale vaut $0 + 1 + 2 = 3$, et elle ne change pas si l'on modifie les valeurs en $0$, $1$, $2$ et $3$.
    - |
      Être bornée et continue hors d'un point ne suffit pas. Sur $[0, 1]$, la fonction égale à $\sin\frac1t$ pour $t > 0$ et à $0$ en $0$ n'est pas continue par morceaux : sur le premier intervalle $]0, x_1[$ d'une subdivision, un prolongement continu à $[0, x_1]$ demanderait une limite en $0$, alors que les valeurs $1$ en $\frac1{\pi/2 + 2k\pi}$ et $-1$ en $\frac1{3\pi/2 + 2k\pi}$ sont prises en des points qui tendent vers $0$.
      ```schema lex-continue-par-morceaux-2
      La fonction $t \mapsto \sin\frac1t$ sur $]0, 1]$, en rouge : elle oscille entre $-1$ et $1$ de plus en plus vite près de $0$, et n'y a pas de limite, ce qui interdit tout prolongement continu du premier morceau.
      ```
    - |
      Deux fonctions continues par morceaux qui ne diffèrent qu'en un nombre fini de points ont la même intégrale. Sur $[0, 2]$, les indicatrices de $[0, 1]$ et de $[0, 1[$ diffèrent seulement en $1$ ; avec la subdivision $0 < 1 < 2$, elles se prolongent toutes deux par $1$ sur $[0, 1]$ et par $0$ sur $[1, 2]$, et leurs intégrales valent $1$. L'intégrale d'une fonction continue par morceaux ne voit que ses prolongements sur les morceaux.

  integrale-convergente:
    - |
      Les puissances donnent la gamme de référence. Pour $a \neq 1$, $\int_1^T t^{-a}\,dt = \frac{T^{1-a} - 1}{1 - a}$, qui tend vers $\frac1{a - 1}$ si $a > 1$ et vers $+\infty$ si $a < 1$. Pour $a = 1$, l'intégrale vaut $\ln T$, qui tend aussi vers $+\infty$. Ainsi $\int_1^{+\infty} t^{-a}\,dt$ converge si et seulement si $a > 1$, la valeur limite $a = 1$ étant du côté divergent.
    - |
      Une intégrale peut converger sans que celle de la valeur absolue converge. Par le théorème fondamental appliqué au produit $-\cos t \cdot \frac1t$,
      $$\begin{aligned} \int_1^T \frac{\sin t}t\,dt &= \cos 1 - \frac{\cos T}T \\ &\quad - \int_1^T \frac{\cos t}{t^2}\,dt, \end{aligned}$$
      où $\frac{\cos T}T$ tend vers $0$, et la dernière intégrale converge par le critère de comparaison du point (i) du nœud {{nb-sommation|Sommation d'Abel}}, avec $g(t) = t^{-2}$ : $\int_1^{+\infty} \frac{\sin t}t\,dt$ converge, et un calcul numérique donne environ $0{,}6247$. En revanche, sur $[k\pi, (k + 1)\pi]$, $\frac{|\sin t|}t \geqslant \frac{|\sin t|}{(k + 1)\pi}$, d'intégrale $\frac2{(k + 1)\pi}$, et la somme de ces minorants diverge, puisque $\sum_{n \leqslant N} \frac1n \geqslant \ln(N + 1)$ par le point (iv) du même nœud : $\int_1^{+\infty} \frac{|\sin t|}t\,dt$ diverge.
    - |
      La convergence de l'intégrale n'oblige pas la fonction à tendre vers $0$. Soit $h$ la fonction continue et positive sur $[1, +\infty[$, nulle sauf, pour chaque entier $k \geqslant 2$, sur $[k - k^{-2}, k + k^{-2}]$, où son graphe est un triangle de sommet $(k, 1)$. Ces triangles sont disjoints, d'aire $k^{-2}$, et, pour $2 \leqslant x \leqslant y$,
      $$\begin{aligned} \int_x^y h &\leqslant \sum_{k \geqslant \lfloor x \rfloor} \frac1{k^2} \leqslant \sum_{k \geqslant \lfloor x \rfloor} \frac1{k(k - 1)} \\ &= \frac1{\lfloor x \rfloor - 1}, \end{aligned}$$
      qui tend vers $0$ : par le critère de Cauchy du point (i) du nœud {{nb-sommation|Sommation d'Abel}}, $\int_1^{+\infty} h$ converge, alors que $h(k) = 1$ pour tout $k \geqslant 2$.
      ```schema lex-integrale-convergente-3
      La fonction $h$ sur $[1, 7]$, en rouge : des pics de hauteur $1$, de plus en plus étroits, dont les aires $\frac14$, $\frac19$, $\frac1{16}$… forment une série convergente. La fonction ne tend pas vers $0$, et son intégrale converge pourtant.
      ```
