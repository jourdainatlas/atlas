# Exemples du lexique : théorie « Théorie de Galois » (galois).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  extension-corps:
    - |
      Un même corps est extension de plusieurs sous-corps, qui ne sont pas toujours comparables. Le corps $\lex{ensemble-complexes}{\mathbb C}$ est extension de $\lex{ensemble-reels}{\mathbb R}$, identifié aux classes des [[polynome-constant|polynômes constants]] ({{c-construction|Construction de ℂ}}), et de $\lex{corps-engendre}{\mathbb Q(i)} = \{a + bi : a, b \in \mathbb Q\}$, ensemble stable par produit et par inverse, $1/(a + bi)$ valant $(a - bi)/(a^2 + b^2)$ ({{c-calcul|Conjugué, module}}, (iii)).

      Aucun des deux ne contient l'autre : $i \notin \mathbb R$, et $(a + bi)^2 = 2$ donnerait $ab = 0$ et $a^2 - b^2 = 2$, donc un rationnel de carré $2$ ou $-2$, ce qu'exclut {{q-irrationnel|Irrationalité de √2}}. Leur intersection est $\lex{ensemble-rationnels}{\mathbb Q}$, puisque $a + bi$ n'est réel que si $b = 0$.
    - |
      Un corps n'est pas toujours sous-corps de $\mathbb C$, ni isomorphe à l'un d'eux. Dans le corps à deux éléments $\lex{ensemble-parties}{\mathcal P}(\{a\})$ ({{a-corps|Corps}}, seconde remarque), on a $1 + 1 = 0$, alors que, dans un sous-corps de $\mathbb C$, qui a le même $1$ que $\mathbb C$, la somme $1 + 1$ vaut $2 \neq 0$. Les extensions d'un corps à deux éléments sont des corps où $1 + 1 = 0$, comme le [[corps-fractions|corps des fractions]] de l'anneau $(\mathbb Z/2\mathbb Z)[T]$, dans lequel $x + x = (1 + 1)x = 0$ pour tout $x$.
    - |
      Une extension se reconnaît à travers un morphisme. Comme tout [[morphisme-anneaux|morphisme d'anneaux]] d'un corps vers un anneau non nul est injectif ({{a-corps|Corps}}, (iii)), un morphisme de corps $\iota : K \to L$ fait de $L$ une extension de l'image $\iota(K)$, que l'on identifie à $K$. C'est ainsi que $\mathbb R$ est sous-corps de $\mathbb C$, et que $\mathbb Q$ est sous-corps de $\mathbb R$ ({{q-plongement|ℚ dans tout corps ordonné}}). Plus loin, le point (iii) de {{gs-separabilite|Séparabilité}} montre que tout corps est ainsi une extension de $\mathbb Q$ ou d'un $\lex{anneau-zn}{\mathbb Z/p\mathbb Z}$.

  polynome-minimal:
    - |
      Le polynôme minimal dépend du corps de base. Celui de $i$ est $X^2 + 1$ sur $\lex{ensemble-rationnels}{\mathbb Q}$ comme sur $\lex{ensemble-reels}{\mathbb R}$, puisque $i$ n'annule aucun polynôme de [[degre-polynome|degré]] $1$ à coefficients réels, mais c'est $X - i$ sur $\lex{ensemble-complexes}{\mathbb C}$. Sur le corps plus grand, le polynôme minimal divise l'ancien, par (i) : $X^2 + 1 = (X - i)(X + i)$, qui n'est plus [[polynome-irreductible|irréductible]] sur $\mathbb C$.
    - |
      Le point (ii) fait calculer dans $K(\alpha)$ par [[division-euclidienne-polynomes|division euclidienne]]. Le nombre $\varphi = \frac{1 + \sqrt 5}2$ annule $X^2 - X - 1$, irréductible sur $\mathbb Q$ puisque ses racines $\frac{1 \pm \sqrt 5}2$ ne sont pas rationnelles, $\sqrt 5$ ne l'étant pas ($p^2 = 5q^2$ avec $p \wedge q = 1$ forcerait $5 \mid p$, puis $5 \mid q$, par le lemme d'Euclide) : c'est son polynôme minimal, et $(1, \varphi)$ est une base de $\mathbb Q(\varphi)$.

      Le reste de la division de $X^5$ par $X^2 - X - 1$ est $5X + 3$, d'où $\varphi^5 = 5\varphi + 3$ ; plus généralement, $\varphi^{n+1} = F_{n+1}\varphi + F_n$, où $(F_n)$ est la suite de Fibonacci, $F_0 = 0$, $F_1 = 1$, $F_{n+2} = F_{n+1} + F_n$, par récurrence et $\varphi^2 = \varphi + 1$.
    - |
      Le polynôme minimal de $\alpha = \sqrt[3]2$ sur $\mathbb Q$ est $X^3 - 2$, irréductible par le critère d'Eisenstein ({{pol-eisenstein|Eisenstein}}, (i)), et $[\mathbb Q(\alpha):\mathbb Q] = 3$. Sur $\mathbb Q(\sqrt 2)$, il reste $X^3 - 2$, contrairement à $X^2 + 1$ dans le premier exemple. Le corps $\mathbb Q(\sqrt 2, \alpha)$ a en effet un degré sur $\mathbb Q$ divisible par $2$ et par $3$ ({{gs-extensions|Extensions, degré}}) et au plus égal à $3 \cdot 2$ (preuve de (iv)) : il vaut $6$, et $[\mathbb Q(\sqrt 2, \alpha) : \mathbb Q(\sqrt 2)] = 3$ par multiplicativité. Le polynôme minimal de $\alpha$ sur $\mathbb Q(\sqrt 2)$, qui divise $X^3 - 2$ par (i), est donc de degré $3$ : c'est $X^3 - 2$.

  corps-decomposition:
    - |
      Pour un polynôme de degré $2$, une racine suffit. Si $\alpha$ est racine de $X^2 + bX + c$, alors $c = -\alpha^2 - b\alpha$, et
      $$X^2 + bX + c = (X - \alpha)(X + b + \alpha) :$$
      l'autre racine, $-b - \alpha$, est dans $K(\alpha)$, qui est donc un corps de décomposition, de [[degre-extension|degré]] au plus $2 = 2!$. Ainsi $\lex{ensemble-rationnels}{\mathbb Q}(\sqrt 2) \subset \lex{ensemble-reels}{\mathbb R}$ est celui de $X^2 - 2$ sur $\mathbb Q$, $\mathbb Q(i) \subset \lex{ensemble-complexes}{\mathbb C}$ celui de $X^2 + 1$ sur $\mathbb Q$, et $\mathbb C = \mathbb R(i)$ celui de $X^2 + 1$ sur $\mathbb R$.
    - |
      La borne $n!$ de (i) n'est pas toujours atteinte. Le polynôme $P = X^3 - 3X + 1$ n'a pas de racine rationnelle : si $a/b$, avec $a \wedge b = 1$ et $b \geqslant 1$, en était une, $b$ diviserait $a^3$ et $a$ diviserait $b^3$, d'où $a = \pm 1$ et $b = 1$, alors que $P(1) = -1$ et $P(-1) = 3$. De degré $3$, il est donc [[polynome-irreductible|irréductible]] ({{pol-irreductibles|Irréductibles}}, (iii)), et une racine $r$ engendre un corps $\mathbb Q(r)$ de degré $3$ ({{gs-algebriques|Polynôme minimal}}, (ii)).

      Avec $r^3 = 3r - 1$, on trouve $r^4 = 3r^2 - r$, $r^6 = 9r^2 - 6r + 1$, puis
      $$\begin{aligned} &(r^2 - 2)^3 - 3(r^2 - 2) + 1 \\ &\quad = r^6 - 6r^4 + 9r^2 - 1 = 0. \end{aligned}$$
      Ainsi $s = r^2 - 2$ est une autre racine, distincte de $r$ puisque $r^2 - r - 2 = (r - 2)(r + 1)$ ne s'annule pas, $2$ et $-1$ n'étant pas racines de $P$. Le quotient de $P$ par $(X - r)(X - s)$ est alors $X + r + s$, le coefficient de $X^2$ dans $P$ étant nul, et la troisième racine $-r - s$ est aussi dans $\mathbb Q(r)$. Le corps $\mathbb Q(r)$, de degré $3 < 3!$, est un corps de décomposition de $P$.
    - |
      La condition « engendré par les racines » est indispensable. Le polynôme $X^2 - 2$ est [[polynome-scinde|scindé]] sur $\mathbb R$, mais $\mathbb R$ n'en est pas un corps de décomposition sur $\mathbb Q$ : son degré sur $\mathbb Q$ est infini ({{gs-extensions|Extensions, degré}}, remarque), alors que (i) le borne par $2$. L'unicité de (iii) n'est, elle, qu'à isomorphisme près : $\mathbb Q(i)$ et le [[corps-rupture|corps de rupture]] $\mathbb Q[X]/(X^2 + 1)$ sont deux corps de décomposition de $X^2 + 1$, et il y a exactement $2$ isomorphismes de l'un sur l'autre qui fixent $\mathbb Q$, envoyant la classe de $X$ sur $i$ ou sur $-i$, comme l'annonce (ii).

  polynome-separable:
    - |
      Sur $\lex{ensemble-rationnels}{\mathbb Q}$, le polynôme $P = X^n - 1$, pour $n \geqslant 1$, est séparable : sa [[derivee-formelle|dérivée]] est $nX^{n-1}$, et
      $$\tfrac1n X \cdot P' - P = 1,$$
      si bien que $P$ et $P'$ sont [[premiers-entre-eux-polynomes|premiers entre eux]], ce qui suffit par (ii). Au contraire, $(X - 1)^2$, qui a la [[racine-multiple|racine double]] $1$, ne l'est pas, et l'on retrouve $1$ comme racine commune de $(X - 1)^2$ et de sa dérivée $2(X - 1)$, comme l'annonce (i).
    - |
      La séparabilité de $X^n - 1$ dépend de la [[caracteristique-corps|caractéristique]]. Sur $\lex{anneau-zn}{\mathbb Z/p\mathbb Z}$, le binôme en caractéristique $p$ ({{pol-binome|Binôme de Newton}}, (iv)) donne $X^p - 1 = (X - 1)^p$, qui n'est pas séparable, sa dérivée $pX^{p-1}$ étant nulle. Sur le même corps, $X^p - X$, de dérivée $pX^{p-1} - 1 = -1$, est premier avec sa dérivée, donc séparable.
    - |
      En caractéristique $p$, un polynôme irréductible peut ne pas être séparable, contrairement à (iv). Soit $K$ le [[corps-fractions|corps des fractions]] de $(\mathbb Z/p\mathbb Z)[T]$ et $P = X^p - T$, de dérivée nulle, donc non séparable par (ii). Dans un [[corps-decomposition|corps de décomposition]], $P = (X - \alpha)^p$, avec $\alpha^p = T$, et un facteur unitaire de $P$ dans $K[X]$ est un $(X - \alpha)^k$ ({{pol-irreductibles|Irréductibles}}, (ii)).

      Si $0 < k < p$, son coefficient en $X^{k-1}$, $-k\alpha$, serait dans $K$, donc aussi $\alpha$, puisque $k \cdot 1 \neq 0$ ; alors $T = (f/g)^p$, avec $f, g \in (\mathbb Z/p\mathbb Z)[T]$, et $Tg^p = f^p$ égalerait un [[degre-polynome|degré]] congru à $1$ modulo $p$ à un multiple de $p$. Le polynôme $P$ est donc irréductible.

  extension-galoisienne:
    - |
      La définition se vérifie directement sur $\lex{ensemble-rationnels}{\mathbb Q}(i)/\mathbb Q$. Ses automorphismes sont l'identité et la restriction de la conjugaison, qui envoie $i$ sur $-i$ et $\mathbb Q(i) = \{a + bi : a, b \in \mathbb Q\}$ sur lui-même ({{c-calcul|Conjugué, module}}, (ii)) ; il n'y en a pas d'autre, l'image de $i$ étant une [[racine-polynome|racine]] de $X^2 + 1$, donc $\pm i$. Le [[corps-fixe|corps fixe]] est formé des $a + bi$ égaux à $a - bi$, c'est-à-dire $\mathbb Q$ : l'extension est galoisienne.
    - |
      Une tour d'extensions galoisiennes n'est pas forcément galoisienne. Soit $\beta$ le réel positif de puissance quatrième $2$, de sorte que $\beta^2 = \sqrt 2$. Le polynôme $X^4 - 2$ est irréductible par le critère d'Eisenstein ({{pol-eisenstein|Eisenstein}}, (i)), et $[\mathbb Q(\beta):\mathbb Q] = 4$ ({{gs-algebriques|Polynôme minimal}}, (ii)). Chaque étage de $\mathbb Q \subset \mathbb Q(\sqrt 2) \subset \mathbb Q(\beta)$ est de degré $2$, [[corps-decomposition|corps de décomposition]] de $X^2 - 2$, puis de $X^2 - \sqrt 2$, aux racines distinctes $\pm\sqrt 2$ et $\pm\beta$ : il est galoisien par (a).

      Pourtant $\mathbb Q(\beta)/\mathbb Q$ ne l'est pas : un automorphisme envoie $\beta$ sur une racine réelle de $X^4 - 2$, puisque $\mathbb Q(\beta) \subset \lex{ensemble-reels}{\mathbb R}$, donc sur $\pm\beta$, et le groupe a au plus deux éléments, moins que le degré $4$, contrairement à (b).
    - |
      La séparabilité, dans (a), est nécessaire. Soit $p$ premier, $L$ le [[corps-fractions|corps des fractions]] de $(\mathbb Z/p\mathbb Z)[T]$, et $K \subset L$ le sous-corps engendré par $T^p$. Le corps $L = K(T)$ est le corps de décomposition sur $K$ de $X^p - T^p = (X - T)^p$ ({{pol-binome|Binôme de Newton}}, (iv)), polynôme non séparable : c'est (a) sans la séparabilité. Un automorphisme $\sigma$ de $L$ qui fixe $K$ vérifie $(\sigma(T) - T)^p = \sigma(T^p) - T^p = 0$, donc $\sigma(T) = T$ et $\sigma = \mathrm{id}$, puisque $T$ engendre $L$ sur $K$. Le corps fixe est $L$ tout entier.

      Or $T \notin K$ : un élément de $K$ s'écrit $f/g$, avec $f$ et $g$ des polynômes en $T^p$, et $Tg = f$ comparerait un [[degre-polynome|degré]] congru à $1$ modulo $p$ à un multiple de $p$. L'extension est finie, $L = K + KT + \cdots + KT^{p-1}$, puisque $f/g = fg^{p-1}/g^p$, où $g^p$ est un polynôme en $T^p$ (même point du binôme), et que $T^{pq + r} = (T^p)^qT^r$. Elle n'est donc pas galoisienne, faute de [[polynome-separable|séparabilité]].

  groupe-galois:
    - |
      Le plus petit exemple non trivial a deux éléments. Le corps $\lex{ensemble-rationnels}{\mathbb Q}(\sqrt 2)$ est le [[corps-decomposition|corps de décomposition]] de $X^2 - 2$, dont les deux [[racine-polynome|racines]] $\pm\sqrt 2$ sont distinctes : par (a), l'extension est [[extension-galoisienne|galoisienne]]. Elle est de degré $2$, puisque $X^2 - 2$, sans racine rationnelle, est [[polynome-irreductible|irréductible]] ({{pol-irreductibles|Irréductibles}}, (iii)), et son groupe a deux éléments. Ce sont l'identité et l'automorphisme $\sigma$ qui envoie $\sqrt 2$ sur l'autre racine, $-\sqrt 2$, c'est-à-dire $a + b\sqrt 2$ sur $a - b\sqrt 2$ : $\operatorname{Gal}(\mathbb Q(\sqrt 2)/\mathbb Q) = \{\mathrm{id}, \sigma\}$.
    - |
      Un groupe de Galois n'est pas toujours cyclique. Le corps $L = \mathbb Q(\sqrt 2, \sqrt 3)$, de degré $4$ ({{gs-algebriques|Polynôme minimal}}, remarque), est le corps de décomposition de $(X^2 - 2)(X^2 - 3)$, dont les quatre racines $\pm\sqrt 2$, $\pm\sqrt 3$ sont distinctes : $L/\mathbb Q$ est galoisienne, et son groupe $G$ a quatre éléments.

      Chacun envoie $\sqrt 2$ sur $\pm\sqrt 2$ et $\sqrt 3$ sur $\pm\sqrt 3$, et il est déterminé par ces deux signes, puisque $\sqrt 2$ et $\sqrt 3$ engendrent $L$ : les quatre couples de signes sont donc atteints. Chaque élément est de carré $\mathrm{id}$, si bien que $G$, d'ordre $4$ sans élément d'[[ordre-element|ordre]] $4$, est isomorphe à $(\lex{anneau-zn}{\mathbb Z/2\mathbb Z})^2$ ({{gf-ordres-pq|Ordres p, p², 2p, pq}}, (ii)).
    - |
      Pour $X^3 - 2$, le groupe se calcule dans le corps de décomposition. Avec $\alpha = \sqrt[3]2$ et $j = \frac{-1 + i\sqrt 3}2$, le corps $\mathbb Q(\alpha)$ n'a que l'identité pour automorphisme (remarque du nœud), mais $L = \mathbb Q(\alpha, j)$ est de degré $6$ et a six automorphismes qui fixent $\mathbb Q$ ({{gs-decomposition|Corps de décomposition}}, (ii) et remarque). Chacun permute les racines $\alpha$, $\alpha j$, $\alpha j^2$, qui engendrent $L$, et est déterminé par cette permutation : $\operatorname{Gal}(L/\mathbb Q)$ s'identifie aux six bijections de l'ensemble des trois racines ({{a-groupe|Groupe}}, (iv)), groupe non [[groupe-abelien|abélien]] (même nœud, (ii)).

      Plus loin, la correspondance de Galois ({{gs-correspondance|Théorème fondamental}}) associera à ses trois sous-groupes d'ordre $2$ les corps $\mathbb Q(\alpha)$, $\mathbb Q(\alpha j)$ et $\mathbb Q(\alpha j^2)$, et à son sous-groupe d'ordre $3$ le corps $\mathbb Q(j)$.

  extension-separable:
    - |
      En [[caracteristique-corps|caractéristique]] nulle, toute [[extension-algebrique|extension algébrique]] est séparable, le [[polynome-minimal|polynôme minimal]] d'un élément étant irréductible, donc [[polynome-separable|séparable]] ({{gs-separabilite|Séparabilité}}, (iv)). On le voit directement pour $\sqrt[3]2$ sur $\lex{ensemble-rationnels}{\mathbb Q}$ : son polynôme minimal $P = X^3 - 2$ vérifie
      $$P - \tfrac X3\,P' = X^3 - 2 - X^3 = -2,$$
      si bien que $P$ et $P'$ sont [[premiers-entre-eux-polynomes|premiers entre eux]].
    - |
      En caractéristique $p$, la séparabilité peut manquer. Pour le corps des fractions $L$ de $(\mathbb Z/p\mathbb Z)[T]$ et son sous-corps $K$ engendré par $T^p$, les exemples d'[[extension-galoisienne|extension galoisienne]] montrent que $T \notin K$ et que $T$ annule $X^p - T^p = (X - T)^p$. Son polynôme minimal, qui divise $(X - T)^p$ et n'est pas de degré $1$, s'écrit $(X - T)^k$ avec $k \geqslant 2$ : $T$ est racine multiple, et $L/K$ n'est pas séparable.
    - |
      Quand $L$ n'a qu'un nombre fini $q$ d'éléments, toute extension $L/K$ est séparable. En effet, le groupe additif $L$ est d'ordre $q$, donc $q \cdot x = 0$ pour tout $x$, et le groupe $L^\times$ d'ordre $q - 1$ donne $x^{q-1} = 1$ pour $x \neq 0$ ({{gf-cycliques|Groupes cycliques}}, (i)). Tout $x \in L$ annule donc $X^q - X$, dont la dérivée vaut $q \cdot X^{q-1} - 1 = -1$ : ce polynôme est séparable, et le polynôme minimal de $x$, qui le divise, n'a que des racines simples.

  element-primitif:
    - |
      La preuve de (i) dit exactement quels $c$ éviter. Pour $\alpha = \sqrt 2$ et $\beta = \sqrt 3$ sur $\lex{ensemble-rationnels}{\mathbb Q}$, les racines sont $\pm\sqrt 2$ et $\pm\sqrt 3$, et l'équation $\alpha_i + c\beta_2 = \alpha + c\beta$, avec $\beta_2 = -\sqrt 3$, s'écrit $\pm\sqrt 2 - c\sqrt 3 = \sqrt 2 + c\sqrt 3$ : elle donne $c = 0$, ou $c = -\sqrt 2/\sqrt 3$, qui n'est pas rationnel puisque $\sqrt 6$ ne l'est pas. Ainsi $\sqrt 2 + c\sqrt 3$ est un élément primitif de $\mathbb Q(\sqrt 2, \sqrt 3)$ pour tout rationnel $c \neq 0$, et $c = 0$ échoue, $\mathbb Q(\sqrt 2)$ étant de degré $2$ seulement.
    - |
      Un élément primitif n'engendre pas forcément le [[groupe-multiplicatif|groupe multiplicatif]]. Le [[corps-rupture|corps de rupture]] $L = \mathbb F_3[X]/(X^2 + 1)$ de $X^2 + 1$, sans racine dans $\mathbb F_3 = \lex{anneau-zn}{\mathbb Z/3\mathbb Z}$, a neuf éléments $a + bi$, et $L = \mathbb F_3(i)$ : $i$ est primitif. Mais $i$ n'est que d'[[ordre-element|ordre]] $4$ dans $L^\times$, qui en a $8$ ; c'est $1 + i$, de carré $2i$ et de puissance quatrième $-1$, qui l'engendre, et c'est un tel générateur que prend la preuve de (ii).
    - |
      Un élément d'un sous-corps strict n'est pas primitif. Dans $L = \mathbb Q(\sqrt 2, \sqrt 3)$, de degré $4$, l'élément $\sqrt 6$ n'engendre que $\mathbb Q(\sqrt 6)$, de degré $2$ puisque $\sqrt 6$ n'est pas rationnel ($p^2 = 6q^2$, avec $p \wedge q = 1$, forcerait $2 \mid p$, puis $2 \mid q$). En revanche $t = \sqrt 2 + \sqrt 6$ est primitif : $t^2 = 8 + 4\sqrt 3$ met $\sqrt 3$ dans $\mathbb Q(t)$, puis $\sqrt 2 = t/(1 + \sqrt 3)$ aussi.

  racine-unite:
    - |
      Dans $\lex{ensemble-complexes}{\mathbb C}$, $i$ est une racine primitive quatrième de l'unité : $i^2 = -1 \neq 1$ et $i^4 = 1$, si bien que son [[ordre-element|ordre]], diviseur de $4$, vaut $4$. Les racines primitives quatrièmes sont $i^k$ pour $k \wedge 4 = 1$, soit $i$ et $i^3 = -i$, comme l'annonce (i). De même, avec $j = \frac{-1 + i\sqrt 3}2$, qui vérifie $j^3 = 1 \neq j$, le nombre $-j$ est une racine primitive sixième : $(-j)^2 = j^2 \neq 1$, $(-j)^3 = -1 \neq 1$ et $(-j)^6 = 1$.
    - |
      Dans $\lex{anneau-zn}{\mathbb Z/7\mathbb Z}$, les puissances successives de $3$ sont $3, 2, 6, 4, 5, 1$ : $3$ est une racine primitive sixième de l'unité, et les autres sont $3^5 = 5$, puisque $1$ et $5$ sont les seuls exposants premiers à $6$. Les racines primitives cubiques sont $3^2 = 2$ et $3^4 = 4$, et l'on retrouve (ii) : $(X - 2)(X - 4) = X^2 - 6X + 8 = X^2 + X + 1$ modulo $7$. Dans $\mathbb Z/p\mathbb Z$, une racine primitive $(p - 1)$-ième de l'unité est exactement une [[racine-primitive|racine primitive]] modulo $p$ ; pour $n \neq p - 1$, une racine primitive $n$-ième de l'unité, d'ordre $n$, n'en est pas une.
    - |
      Un corps peut n'avoir aucune racine primitive $n$-ième de l'unité. Dans $\lex{ensemble-reels}{\mathbb R}$, $x^n = 1$ entraîne $|x|^n = 1$, donc $|x| = 1$ et $x = \pm 1$ : il n'y a de racine primitive $n$-ième que pour $n = 1$ et $n = 2$. En [[caracteristique-corps|caractéristique]] $p$, il n'y en a aucune d'ordre $p$, puisque $X^p - 1 = (X - 1)^p$ (remarque du nœud). Plus loin, le nœud {{gc-irreductibilite|Irréductibilité de Φₙ}} montre que, en caractéristique nulle, une racine primitive $n$-ième de l'unité a pour [[polynome-minimal|polynôme minimal]] $\Phi_n$ sur $\lex{ensemble-rationnels}{\mathbb Q}$.

  polynome-cyclotomique:
    - |
      La récurrence de la définition se mène à la main. Pour $n = 9$, les diviseurs stricts sont $1$ et $3$, et $\Psi_9 = \Phi_1\Phi_3 = X^3 - 1$ ; la division de $X^9 - 1$ par $X^3 - 1$ est exacte, et
      $$\Phi_9 = X^6 + X^3 + 1,$$
      de degré $6 = \varphi(9)$. De même, $\Psi_8 = \Phi_1\Phi_2\Phi_4 = X^4 - 1$ donne $\Phi_8 = X^4 + 1$, et $\Psi_{10} = \Phi_1\Phi_2\Phi_5$ donne $\Phi_{10} = X^4 - X^3 + X^2 - X + 1$.
    - |
      Les racines de $\Phi_n$ dans un corps qui contient une [[racine-unite|racine primitive $n$-ième de l'unité]] sont exactement les racines primitives, par (ii). Dans $\lex{anneau-zn}{\mathbb Z/5\mathbb Z}$, où $2^2 = 4 = -1$, l'élément $2$ est d'ordre $4$, et $\Phi_4 = X^2 + 1$ y vaut $(X - 2)(X - 3)$ : ses racines $2$ et $3 = 2^3$ sont les deux racines primitives quatrièmes. Dans $\mathbb Z/3\mathbb Z$, au contraire, $X^2 + 1$ n'a pas de racine, et ce corps ne contient aucune racine primitive quatrième de l'unité.
    - |
      En divisant (iv) par $\Phi_1 = X - 1$, on obtient $1 + X + \cdots + X^{n-1} = \prod_{d \mid n,\, d > 1}\Phi_d$, d'où, en $X = 1$, la relation $n = \prod_{d \mid n,\, d > 1}\Phi_d(1)$. Pour $n = p$ premier, $\Phi_p(1) = p$ ; pour $n = 6$, $6 = \Phi_2(1)\Phi_3(1)\Phi_6(1) = 2 \cdot 3 \cdot \Phi_6(1)$, donc $\Phi_6(1) = 1$, ce que confirme $\Phi_6 = X^2 - X + 1$. Plus loin, le nœud {{gc-irreductibilite|Irréductibilité de Φₙ}} montre que chaque $\Phi_n$ est [[polynome-irreductible|irréductible]] sur $\lex{ensemble-rationnels}{\mathbb Q}$.

  point-constructible:
    - |
      Le nombre $i$ est constructible. Le symétrique $-1$ de $1$ par rapport à $0$ l'est par (ii). Pour $a = -1$ et $b = 1$, le point (iii) donne les points $u_\pm = -1 + \big(\frac12 \pm i\frac{\sqrt 3}2\big) \cdot 2 = \pm i\sqrt 3$, et la droite qui les joint est l'axe $i\lex{ensemble-reels}{\mathbb R}$. Elle coupe le cercle de centre $0$ et d'écartement $|1 - 0|$ en $i$ et $-i$, qui sont constructibles par (i).
    - |
      Le nombre $\sqrt 2$ est constructible. Les points $0$, $1$ et $i$ l'étant, le cercle de centre $0$ et d'écartement $|i - 1| = \sqrt 2$ est un cercle de $\{0, 1, i\}$, et il coupe la droite $(0\,1) = \mathbb R$ aux deux points $\pm\sqrt 2$, constructibles par (i). Le même procédé, avec l'écartement $|i\sqrt 3 - 0|$, donne $\sqrt 3$.
      ```schema lex-point-constructible-2
      Le cercle de centre $0$, en bleu, dont l'écartement est la distance $|i - 1|$ des extrémités du segment en pointillé, coupe l'axe réel, tracé par $0$ et $1$, en $\sqrt 2$, en rouge, et en $-\sqrt 2$.
      ```
    - |
      Dans la définition, les deux droites ou les deux cercles doivent être distincts. Sans cette condition, une droite tracée par $0$ et $1$ serait « commune » à elle-même, et tous ses points, c'est-à-dire tous les réels, seraient constructibles, y compris le réel de cube $2$. Plus loin, le point (i) de {{gc-cube-trisection|Cube, trisection}} montre qu'aucun nombre constructible n'a pour cube $2$ : la condition « distincts » est ce qui rend la notion non triviale.

  nombre-fermat:
    - |
      Pour un nombre premier de Fermat $p = 2^{2^j} + 1$, l'indicatrice $\varphi(p) = p - 1 = 2^{2^j}$ est une puissance de $2$ ({{gc-fermat|Nombres de Fermat}}, (i)). Les cinq connus sont $3$, $5$, $17$, $257$ et $65\,537$ ; un produit de nombres premiers de Fermat distincts garde cette propriété par la multiplicativité de (i), ainsi $\varphi(15) = 2 \cdot 4 = 8$ et $\varphi(255) = \varphi(3 \cdot 5 \cdot 17) = 2 \cdot 4 \cdot 16 = 128$.
    - |
      Dans le point (iii), les nombres premiers de Fermat doivent être distincts et apparaître à la puissance $1$. Pour $9 = 3^2$, on a $\varphi(9) = 3 \cdot 2 = 6$, qui n'est pas une puissance de $2$, bien que $3$ soit un nombre premier de Fermat ; de même $\varphi(25) = 20$. Le nombre premier $7$ n'est pas de Fermat, $7 - 1 = 6$ n'étant pas une puissance de $2$, et $\varphi(7) = 6$.
    - |
      Il faut que le nombre de Fermat soit premier. Le nombre $F_5 = 2^{32} + 1$, divisible par $641$, ne l'est pas, et $\varphi(F_5)$ n'est pas une puissance de $2$. Sinon, par (iii), $F_5$, impair, serait un produit de nombres premiers de Fermat $F_j$ avec $j \neq 5$ ; or $F_0F_1 \cdots F_4 = F_5 - 2$, comme le montre la récurrence $(F_n - 2)F_n = F_{n+1} - 2$, si bien qu'un diviseur commun à $F_5$ et à un $F_j$, $j < 5$, divise $2$.

      Les $F_j$ avec $j > 5$, plus grands que $F_5$, ne le divisent pas. Plus loin, le théorème de Gauss-Wantzel ({{gc-gauss-wantzel|Gauss-Wantzel}}) en déduit que le polygone régulier à $F_5$ côtés n'est pas constructible, alors que ceux à $17$ et à $65\,537$ côtés le sont.

  norme-extension:
    - |
      Pour $\lex{ensemble-rationnels}{\mathbb Q}(\sqrt 2)/\mathbb Q$, la norme de $a + b\sqrt 2$ est $(a + b\sqrt 2)(a - b\sqrt 2) = a^2 - 2b^2$. Elle est multiplicative, et peut être négative : $N(1 + \sqrt 2) = -1$, si bien que l'inverse de $1 + \sqrt 2$ est $-(1 - \sqrt 2) = \sqrt 2 - 1$, à coefficients entiers. Elle n'est pas additive : $N(1) + N(1) = 2$, alors que $N(2) = 2^2 = 4$, comme le veut la formule $N(a) = a^n$ du point (ii).
    - |
      Pour $\mathbb Q(j)/\mathbb Q$, avec $j = \frac{-1 + i\sqrt 3}2$, corps de décomposition de $X^2 + X + 1$, de racines distinctes $j$ et $j^2$, le groupe est formé de l'identité et de la conjugaison, qui envoie $j$ sur $\bar j = j^2$. La norme de $a + bj$, pour $a, b$ rationnels, est
      $$\begin{aligned} (a + bj)(a + bj^2) &= a^2 + ab(j + j^2) + b^2 \\ &= a^2 - ab + b^2, \end{aligned}$$
      puisque $j + j^2 = -1$ et $j^3 = 1$. Ainsi $N(2 + j) = 3$ et $N(1 - j) = 3$ : la norme s'écrit, en les coordonnées $a$ et $b$, comme un polynôme de degré $2$ à coefficients entiers.
    - |
      Hors du cas galoisien, le produit des images par les automorphismes peut sortir du corps de base. Pour $\mathbb Q(\alpha)$, avec $\alpha = \sqrt[3]2$, le seul automorphisme est l'identité ({{gs-galoisiennes|Extensions galoisiennes}}, remarque), et ce produit vaut $x$ : pour $x = \alpha$, il n'est pas rationnel, contrairement à (ii).

      Dans le cas galoisien, un élément de norme $1$ n'est pas forcément $\pm 1$ : dans $\mathbb Q(i)/\mathbb Q$, la norme de $u + vi$ est $u^2 + v^2$, et $x = \frac{3 + 4i}5$ est de norme $\frac{9 + 16}{25} = 1$. Plus loin, la forme cyclique du théorème 90 ({{h90-cyclique|Forme cyclique}}, (i)) montre que les éléments de norme $1$ sont les $y/\sigma(y)$ ; ici $x = (2 + i)/(2 - i)$, puisque $(2 + i)^2 = 3 + 4i$ et $(2 + i)(2 - i) = 5$.

  trace-extension:
    - |
      Pour $\lex{ensemble-rationnels}{\mathbb Q}(\sqrt 2)/\mathbb Q$, dont le groupe est formé de l'identité et de $\sigma : a + b\sqrt 2 \mapsto a - b\sqrt 2$, la trace de $a + b\sqrt 2$ est $2a$ : $\operatorname{Tr}(1) = 2$ et $\operatorname{Tr}(\sqrt 2) = 0$. Pour $\lex{ensemble-complexes}{\mathbb C}/\lex{ensemble-reels}{\mathbb R}$, de groupe $\{\mathrm{id}, z \mapsto \bar z\}$ ({{c-automorphismes|Automorphismes}}), la trace de $z$ est $z + \bar z = 2\operatorname{Re} z$, et la trace est bien [[application-a-lineaire|$\mathbb R$-linéaire]].
    - |
      Pour une [[racine-unite|racine primitive cinquième de l'unité]] $\zeta$, le groupe de $\mathbb Q(\zeta)/\mathbb Q$ est formé des $\zeta \mapsto \zeta^a$, $a = 1, 2, 3, 4$ ({{gc-galois-cyclotomique|Gal(ℚ(ζ)/ℚ)}}, (ii)). La trace de $\zeta$ est donc $\zeta + \zeta^2 + \zeta^3 + \zeta^4 = -1$, puisque $\Phi_5(\zeta) = 0$, et de même pour chaque $\zeta^k$ avec $5 \nmid k$, alors que $\operatorname{Tr}(1) = 4$. Par linéarité, $\eta = \zeta + \zeta^4$ a pour trace $-2$, dans $\mathbb Q$ comme l'annonce (ii).
    - |
      Hors du cas galoisien, la somme des images par les automorphismes peut sortir du corps de base. Pour $L = \mathbb Q(\alpha)$ avec $\alpha = \sqrt[3]2$, le seul automorphisme est l'identité ({{gs-galoisiennes|Extensions galoisiennes}}, remarque), et la somme $\sum_{\sigma} \sigma(x)$ sur ce groupe vaut $x$ : pour $x = \alpha$, elle n'appartient pas à $\mathbb Q$, contrairement à (ii). Plus loin, la forme cyclique du théorème 90 ({{h90-cyclique|Forme cyclique}}, (ii)) caractérise les éléments de trace nulle ; pour $\mathbb Q(\sqrt 2)$, $\sqrt 2 = y - \sigma(y)$ avec $y = \sqrt 2/2$.

  extension-cyclique:
    - |
      Pour une [[racine-unite|racine primitive cinquième de l'unité]] $\zeta$, l'extension $\lex{ensemble-rationnels}{\mathbb Q}(\zeta)/\mathbb Q$ est cyclique de degré $4$ ({{gc-galois-cyclotomique|Gal(ℚ(ζ)/ℚ)}}, (iii)). La classe de $2$ est d'ordre $4$ dans $(\lex{anneau-zn}{\mathbb Z/5\mathbb Z})^\times$, ses puissances étant $2, 4, 3, 1$ : l'automorphisme $\sigma : \zeta \mapsto \zeta^2$ engendre le groupe. Toute extension galoisienne de degré $2$ est aussi cyclique, son groupe ayant deux éléments.
    - |
      Une extension galoisienne de groupe [[groupe-abelien|abélien]] n'est pas forcément cyclique. Pour une racine primitive huitième de l'unité $\zeta$, le groupe de $\mathbb Q(\zeta)/\mathbb Q$ est isomorphe à $(\mathbb Z/8\mathbb Z)^\times = \{\bar 1, \bar 3, \bar 5, \bar 7\}$ ({{gc-galois-cyclotomique|Gal(ℚ(ζ)/ℚ)}}, (ii)), dont tous les éléments sont de carré $\bar 1$, puisque $9$, $25$ et $49$ sont congrus à $1$ modulo $8$. Aucun élément n'est d'[[ordre-element|ordre]] $4$ : l'extension, de degré $4$, n'est pas cyclique.
    - |
      Une extension cubique de $\mathbb Q$ peut être cyclique et contenue dans $\lex{ensemble-reels}{\mathbb R}$. Le polynôme $P = X^3 - 3X + 1$ n'a pas de racine rationnelle : une racine $a/b$, avec $a \wedge b = 1$ et $b \geqslant 1$, forcerait $b \mid a^3$ et $a \mid b^3$, donc $a/b = \pm 1$, alors que $P(1) = -1$ et $P(-1) = 3$. De degré $3$, il est irréductible ({{pol-irreductibles|Irréductibles}}, (iii)), donc séparable, et il a une racine réelle $r$ entre $1$ et $2$, où il passe de $-1$ à $3$ ({{c-tvi|Valeurs intermédiaires}}). Par $r^3 = 3r - 1$, l'expression $(r^2 - 2)^3 - 3(r^2 - 2) + 1$ se réduit à $0$ : $s = r^2 - 2$ est une autre racine, distincte de $r$ puisque $r^2 - r - 2 = (r - 2)(r + 1) \neq 0$, et la troisième, $-r - s$, est aussi dans $\mathbb Q(r)$.

      Le corps $\mathbb Q(r)$, de degré $3$, est donc un [[corps-decomposition|corps de décomposition]] de $P$ : il est galoisien, de groupe d'ordre $3$, donc cyclique ({{gf-cycliques|Groupes cycliques}}, (ii)). L'automorphisme $\sigma$ tel que $\sigma(r) = s$ ({{gs-galoisiennes|Extensions galoisiennes}}) vérifie $\sigma(x^2 - 2) = \sigma(x)^2 - 2$ : sur les racines, il agit par $x \mapsto x^2 - 2$.
      ```schema lex-extension-cyclique-3
      Le graphe de $P = X^3 - 3X + 1$ coupe l'axe en trois points, en rouge, reportés sur la droite du bas, dont $r$, le plus grand. Les flèches bleues de $x \mapsto x^2 - 2$ les permutent circulairement, comme le générateur du groupe de Galois, qui envoie $r$ sur $r^2 - 2$.
      ```
      Plus loin, la théorie de Kummer ({{h90-kummer|Kummer}}, (i)) montre qu'au-dessus d'un corps contenant une racine primitive cubique de l'unité, une extension cyclique de degré $3$ est engendrée par une racine cubique d'un élément du corps.

  groupe-automorphismes:
    - |
      Pour $\lex{ensemble-complexes}{\mathbb C}/\lex{ensemble-reels}{\mathbb R}$, le groupe $\operatorname{Aut}(\mathbb C/\mathbb R)$ est formé de l'identité et de la conjugaison ({{c-automorphismes|Automorphismes}}). Il a deux éléments, autant que le [[degre-extension|degré]] $[\mathbb C:\mathbb R] = 2$ : l'inégalité (iii) est ici une égalité, et le [[corps-fixe|corps fixe]] de ce groupe est $\mathbb R$, les complexes égaux à leur conjugué étant les réels ({{c-calcul|Conjugué, module}}, (ii)).
    - |
      L'inégalité (iii) peut être stricte. Soit $\alpha$ le réel de cube $2$ ({{ex-puissances|Puissances réelles}}, (ii)) et $L = \lex{corps-engendre}{\mathbb Q(\alpha)} \subset \mathbb R$. Un $\sigma \in \operatorname{Aut}(L/\mathbb Q)$ vérifie $\sigma(\alpha)^3 = \sigma(2) = 2$ avec $\sigma(\alpha)$ réel, donc $\sigma(\alpha) = \alpha$, la fonction $t \mapsto t^3$ étant [[application-croissante|strictement croissante]] sur $\mathbb R$. Les points fixes de $\sigma$ forment un sous-corps qui contient $\mathbb Q$ et $\alpha$, donc $L$ : $\operatorname{Aut}(L/\mathbb Q) = \{\mathrm{id}\}$.

      Pourtant $\alpha$ n'est pas rationnel, puisque $p^3 = 2q^3$ avec $p \wedge q = 1$ forcerait $2 \mid p$, puis $2 \mid q$, par le lemme d'Euclide ({{z-premiers|Nombres premiers}}, (i)) ; donc $[L:\mathbb Q] \geqslant 2 > |\operatorname{Aut}(L/\mathbb Q)|$.
    - |
      Un automorphisme $\sigma$ du corps $\mathbb R$ fixe chaque rationnel, puisqu'il fixe $1$, et il est croissant : si $x \leqslant x'$, alors $x' - x = y^2$ pour un réel $y$ ({{c-racine-reelle|Racine carrée réelle}}), et $\sigma(x') - \sigma(x) = \sigma(y)^2 \geqslant 0$. Si l'on avait $\sigma(x) > x$, un rationnel $r$ tel que $x < r < \sigma(x)$ ({{ar-archimede|Archimède, densité de ℚ}}) donnerait $\sigma(x) \leqslant \sigma(r) = r$ ; le cas $\sigma(x) < x$ est symétrique. Ainsi $\operatorname{Aut}(\mathbb R/\lex{ensemble-rationnels}{\mathbb Q}) = \{\mathrm{id}\}$, pour une extension de degré infini, où (iii) ne dit rien.

  corps-engendre:
    - |
      Un seul élément peut engendrer un corps qui en demande deux en apparence. Dans $\lex{ensemble-reels}{\mathbb R}$, posons $t = \sqrt 2 + \sqrt 3$ ; alors
      $$\begin{aligned} t^2 &= 5 + 2\sqrt 6, \\ t^3 &= 11\sqrt 2 + 9\sqrt 3, \end{aligned}$$
      d'où $\sqrt 2 = (t^3 - 9t)/2$ et $\sqrt 3 = t - \sqrt 2$, qui appartiennent à $\mathbb Q(t)$. Comme $t \in \mathbb Q(\sqrt 2, \sqrt 3)$, les deux corps sont égaux : $\mathbb Q(\sqrt 2 + \sqrt 3) = \mathbb Q(\sqrt 2, \sqrt 3)$.
    - |
      Le sous-corps engendré est une intersection, et deux corps suffisent parfois à la réaliser. Dans $\lex{ensemble-complexes}{\mathbb C}$, l'ensemble $M = \{u + vi : u, v \in \mathbb Q(\sqrt 2)\}$ est stable par produit et par inverse, puisque $1/(u + vi) = (u - vi)/(u^2 + v^2)$ avec $u^2 + v^2 > 0$ réel ({{c-calcul|Conjugué, module}}, (iii)) : c'est le corps $\mathbb Q(\sqrt 2, i)$. Comme $u$ et $v$ sont réels, $u + vi$ est réel si et seulement si $v = 0$ : l'intersection $\mathbb R \cap M$ de deux corps qui contiennent $\lex{ensemble-rationnels}{\mathbb Q}$ et $\sqrt 2$ est déjà $\mathbb Q(\sqrt 2)$.
    - |
      Le sous-corps engendré n'est pas le sous-anneau engendré. Dans le [[corps-fractions|corps des fractions]] $\mathbb Q(T)$ de $\mathbb Q[T]$, le plus petit sous-anneau qui contient $\mathbb Q$ et $T$ est $\mathbb Q[T]$, qui n'est pas un corps : $T$ n'y est pas inversible, un produit $TP$ non nul étant de [[degre-polynome|degré]] au moins $1$. Le sous-corps engendré par $T$ contient $1/T$, et toutes les fractions $P/Q$ : c'est $\mathbb Q(T)$ tout entier.

      Plus loin, le point (ii) du nœud {{gs-algebriques|Polynôme minimal}} montre que les deux coïncident, $K(\alpha) = K[\alpha]$, dès que $\alpha$ annule un polynôme non nul de $K[X]$, comme $\sqrt 2$ annule $X^2 - 2$.

  corps-fini:
    - |
      Le corps $\mathbb F_4$ se décrit entièrement. Sur $\mathbb F_2 = \lex{anneau-zn}{\mathbb Z/2\mathbb Z}$, le polynôme $X^2 + X + 1$ vaut $1$ en $0$ et en $1$ : sans [[racine-polynome|racine]], il est [[polynome-irreductible|irréductible]] ({{pol-irreductibles|Irréductibles}}, (iii)), et $\mathbb F_2[X]/(X^2 + X + 1)$ est un corps de degré $2$ sur $\mathbb F_2$ ({{gs-algebriques|Polynôme minimal}}, (iii)), donc à quatre éléments $0, 1, \omega, \omega + 1$, où $\omega$ est la classe de $X$ ; c'est $\mathbb F_4$ par (iii).

      On a $\omega^2 = \omega + 1$ et $\omega^3 = \omega^2 + \omega = 1$ : le groupe $\mathbb F_4^\times = \{1, \omega, \omega^2\}$ est cyclique d'ordre $3$, comme l'annonce (ii). Le [[frobenius|Frobenius]] $x \mapsto x^2$ fixe $0$ et $1$ et échange $\omega$ et $\omega^2$ : il est d'[[ordre-element|ordre]] $2$ et engendre $\lex{groupe-galois}{\operatorname{Gal}}(\mathbb F_4/\mathbb F_2)$, comme l'annonce (iv).
    - |
      Le [[groupe-multiplicatif|groupe multiplicatif]] est cyclique, mais tous ses éléments ne l'engendrent pas. Sur $\mathbb F_3$, le polynôme $X^2 + 1$ prend les valeurs $1$, $2$, $2$ en $0$, $1$, $2$ : il est irréductible, et $\mathbb F_3[X]/(X^2 + 1)$ est un corps de degré $2$ sur $\mathbb F_3$, à neuf éléments $a + bi$, où $i^2 = -1$ : c'est $\mathbb F_9$.

      L'élément $i$ n'est que d'ordre $4$. L'élément $g = 1 + i$ vérifie $g^2 = 2i$ et $g^4 = (2i)^2 = -4 = -1$ : il est d'ordre $8$ et engendre $\mathbb F_9^\times$. Le Frobenius $x \mapsto x^3$ envoie $a + bi$ sur $a^3 + b^3i^3 = a - bi$ ({{pol-binome|Binôme de Newton}}, (iv)), puisque $a^3 = a$ dans $\mathbb F_3$ et $i^3 = -i$ ; il ne fixe que les trois éléments de $\mathbb F_3$.
      ```schema lex-corps-fini-2
      Les huit éléments non nuls de $\mathbb F_9$ sont les puissances $g^k$ de $g = 1 + i$, aux sommets de l'octogone, $k$ croissant dans le sens trigonométrique. Le Frobenius $x \mapsto x^3$ envoie $g^k$ sur $g^{3k}$ : il échange les deux sommets de chaque flèche et fixe $1$ et $-1 = 2$, les deux éléments non nuls de $\mathbb F_3$, en rouge.
      ```
    - |
      Il n'existe pas de corps à six éléments, puisque par (i) le cardinal d'un corps fini est une puissance de sa [[caracteristique-corps|caractéristique]], et que $6 = 2 \cdot 3$ n'en est pas une. Le [[degre-extension|degré]] interdit aussi des inclusions : un corps à huit éléments, de degré $3$ sur son sous-corps $\mathbb F_2$, ne contient aucun corps à quatre éléments, qui serait de degré $2$ sur $\mathbb F_2$, alors que $2$ ne divise pas $3$ ({{gs-extensions|Extensions, degré}}).

      Plus loin, le théorème de l'élément primitif ({{gc-element-primitif|Élément primitif}}, (ii)) emploiera, comme (ii), la cyclicité du groupe multiplicatif ({{gf-multiplicatif|Groupe multiplicatif}}, (iii)) : une extension finie d'un corps fini est engendrée par un générateur de ce groupe.

  representation-groupe:
    - |
      Pour définir une représentation de $\lex{anneau-zn}{\mathbb Z/n\mathbb Z}$, il suffit de choisir l'image de $\bar 1$, pourvu que sa puissance $n$-ième soit l'identité. Avec $A \in \lex{groupe-lineaire}{GL_d}(K)$ telle que $A^n = I_d$, l'application $\bar k \mapsto A^k$ est bien définie, puisque $k \equiv k' \pmod n$ entraîne $A^k = A^{k'}$, et c'est un [[morphisme-groupes|morphisme]]. Ainsi $\bar k \mapsto i^k$ est une représentation de $\mathbb Z/4\mathbb Z$ sur $\lex{ensemble-complexes}{\mathbb C}$, de degré $1$.
    - |
      Une représentation n'est pas forcément injective. La signature de $\lex{groupe-symetrique}{\mathfrak S_n}$, vue dans $\lex{ensemble-rationnels}{\mathbb Q}$, est une représentation de degré $1$ (point (iv)) dont le noyau est formé des permutations de signature $1$, produits d'un nombre pair de transpositions, et la [[representation-triviale|représentation triviale]] a pour noyau le groupe entier. Au contraire, l'inclusion d'un groupe de matrices inversibles dans $GL_d(K)$ est une représentation injective.
    - |
      La condition $A^n = I_d$ est nécessaire. L'application $\bar k \mapsto i^k$ sur $\mathbb Z/3\mathbb Z$ n'est pas définie : les entiers $0$ et $3$ ont la même classe, mais $i^0 = 1$ et $i^3 = -i$ diffèrent. Plus loin, le nœud {{rp-caracteres|Caractères}} montre, au point (iv), que l'image d'un élément d'ordre $m$ par une représentation de degré $1$ est toujours une racine $m$-ième de $1$.

  representation-irreductible:
    - |
      Le plan $H = \{x_1 + x_2 + x_3 = 0\}$ de la [[representation-permutation|représentation de permutation]] de $\lex{groupe-symetrique}{\mathfrak S_3}$ est irréductible sur $\lex{ensemble-complexes}{\mathbb C}$. Une droite stable serait engendrée par un [[vecteur-propre|vecteur propre]] de $\sigma : 1 \mapsto 2 \mapsto 3 \mapsto 1$, qui envoie $(x_1, x_2, x_3)$ sur $(x_3, x_1, x_2)$. Sur $\mathbb C^3$, $\sigma$ a les trois valeurs propres distinctes $1$, $j$ et $j^2$, où $j = \frac{-1 + i\sqrt 3}2$, de droites propres engendrées par $(1, 1, 1)$, $(1, j^2, j)$ et $(1, j, j^2)$ ; les deux dernières seules sont dans $H$, puisque $1 + j + j^2 = 0$. Or la transposition $\tau_{12}$ envoie $(1, j^2, j)$ sur $(j^2, 1, j)$, qui ne lui est pas proportionnel, et de même pour l'autre.
    - |
      L'irréductibilité dépend du corps. Sur $K = \lex{anneau-zn}{\mathbb Z/3\mathbb Z}$, le vecteur $s = (1, 1, 1)$ a pour somme de coordonnées $3 \cdot 1 = 0$ : il appartient à $H$, et la droite $Ks$, sur laquelle chaque permutation agit par l'identité, est une droite stable de $H$. Le même plan, irréductible sur $\mathbb C$, ne l'est donc plus sur $\mathbb Z/3\mathbb Z$, où la condition $|X| \cdot 1_K \neq 0$ du point (iii) tombe.
    - |
      Soit $A$ la matrice de lignes $(0, -1)$ et $(1, -1)$, qui vérifie $A^3 = I_2$, et la représentation $\bar k \mapsto A^k$ de $\mathbb Z/3\mathbb Z$. Sur $\lex{ensemble-rationnels}{\mathbb Q}$, elle est irréductible : une droite stable serait une droite propre de $A$, dont les valeurs propres seraient racines de $\lambda^2 + \lambda + 1$, sans racine rationnelle. Sur $\mathbb C$, les droites propres pour $j$ et $j^2$ sont stables, et la représentation ne l'est plus. Plus loin, le lemme de Schur ({{rp-schur|Schur}}, (iv)) montre que toute représentation complexe irréductible d'un groupe [[groupe-abelien|abélien]] est de [[degre-representation|degré]] $1$.

  representation-reguliere:
    - |
      Pour $\lex{anneau-zn}{\mathbb Z/2\mathbb Z}$, la représentation régulière est $K^2$, où $\bar 1$ échange $e_{\bar 0}$ et $e_{\bar 1}$ : c'est la [[representation-permutation|représentation de permutation]] de l'action de $\mathbb Z/2\mathbb Z$ sur lui-même. Si $2 \cdot 1_K \neq 0$, elle est [[somme-directe-representations|somme directe]] de la droite $K(e_{\bar 0} + e_{\bar 1})$, où $\bar 1$ agit trivialement, et de la droite $K(e_{\bar 0} - e_{\bar 1})$, où il agit par $-1$.
    - |
      Pour $\mathbb Z/3\mathbb Z$ sur $\lex{ensemble-complexes}{\mathbb C}$, avec $j = \frac{-1 + i\sqrt 3}2$, les vecteurs $v_k = e_{\bar 0} + j^ke_{\bar 1} + j^{2k}e_{\bar 2}$, $k = 0, 1, 2$, vérifient $\rho(\bar 1)v_k = j^{2k}v_k$, puisque $j^3 = 1$. Ce sont des [[vecteur-propre|vecteurs propres]] de $\rho(\bar 1)$ pour les trois [[valeur-propre|valeurs propres]] distinctes $1$, $j^2$ et $j$ : ils forment une base ({{v-valeurs-propres|Valeurs propres}}, (ii)), et la représentation régulière est somme directe de trois droites stables, qui portent trois représentations de degré $1$ deux à deux non isomorphes, puisqu'un isomorphisme entre deux droites est une multiplication par un scalaire non nul, qui commute à tout.
    - |
      La représentation régulière est fidèle : $\rho(g)e_e = e_g$, donc $\rho(g) = \mathrm{id}$ force $g = e$, et $\rho$ est injective, ce qui linéarise le théorème de Cayley ({{gf-actions|Actions de groupe}}, (ii)). La [[representation-triviale|représentation triviale]], au contraire, envoie tout le groupe sur l'identité. Plus loin, le nœud {{rp-reguliere|Représentation régulière}} montre que, sur $\mathbb C$, chaque représentation irréductible $W$ figure $\dim W$ fois dans la représentation régulière ; pour $\mathbb Z/3\mathbb Z$, ce sont les trois droites de l'exemple précédent, chacune une fois.

  caractere-representation:
    - |
      Le caractère d'une [[representation-permutation|représentation de permutation]] compte les [[point-fixe-action|points fixes]] (point (v)). Pour $\lex{groupe-symetrique}{\mathfrak S_3}$ agissant sur $\{1, 2, 3\}$, il vaut $3$ en l'identité, $1$ en chaque transposition et $0$ en chaque bijection sans point fixe ; celui du plan $H$ vaut $2$, $0$ et $-1$, et celui de la [[representation-reguliere|représentation régulière]] vaut $6$ en l'identité et $0$ ailleurs. Les trois sont des [[fonction-centrale|fonctions centrales]], constantes sur ces trois classes.
    - |
      Le point (iii) se lit sur un exemple à valeurs non réelles. Pour la représentation de $\lex{anneau-zn}{\mathbb Z/3\mathbb Z}$ sur $\lex{ensemble-complexes}{\mathbb C}$ où $\bar 1$ agit par $j = \frac{-1 + i\sqrt 3}2$, le caractère vaut $j$ en $\bar 1$ et $j^2 = \bar j$ en $\bar 2 = -\bar 1$. Pour la représentation de $\mathbb Z/3\mathbb Z$ sur $\mathbb C^2$ où $\bar 1$ agit par la matrice $A$ de lignes $(0, -1)$ et $(1, -1)$, le caractère, réel, vaut $2$, puis $\operatorname{tr} A = -1$ et $\operatorname{tr} A^2 = -1$.
    - |
      Hors de $\mathbb C$, la trace peut perdre ses vertus. Sur $K = \lex{anneau-zn}{\mathbb Z/2\mathbb Z}$, la somme directe de deux copies de la [[representation-triviale|représentation triviale]], où chaque $g$ agit sur $K^2$ par $I_2$, a pour fonction $g \mapsto \operatorname{tr}\rho(g)$ la constante $1 + 1 = 0$, comme la représentation sur l'espace nul : la trace ne voit même plus le degré. C'est pourquoi le caractère est défini sur $\mathbb C$, où $\chi(e) = \dim V$. Plus loin, le point (iii) de {{rp-orthogonalite|Orthogonalité}} montre que deux représentations complexes de même caractère sont [[isomorphisme-representations|isomorphes]].

  caractere-lineaire:
    - |
      Pour $G = \lex{anneau-zn}{\mathbb Z/4\mathbb Z}$, un caractère linéaire $\lambda$ est déterminé par $\lambda(\bar 1) = z$, avec $z^4 = \lambda(\bar 0) = 1$, d'où $z \in \{1, i, -1, -i\}$, et chacune de ces valeurs définit $\bar k \mapsto z^k$. Le caractère $\lambda(\bar k) = i^k$ prend les valeurs $1$, $i$, $-1$, $-i$, toutes de module $1$, et $\lambda(-\bar 1) = \lambda(\bar 3) = -i = \overline{\lambda(\bar 1)}$, comme l'annonce (iv).
    - |
      Le groupe $\lex{groupe-symetrique}{\mathfrak S_3}$ a exactement deux caractères linéaires, la constante $1$ et la signature $\varepsilon$. Pour une transposition $\tau$, $\lambda(\tau)^2 = \lambda(\tau^2) = 1$, donc $\lambda(\tau) = \pm 1$. Les trois transpositions sont conjuguées ({{a-groupe|Groupe}}, (iv)), et $\lambda$, à valeurs dans un groupe commutatif, est constant sur une classe de conjugaison : $\lambda(\tau) = c$ pour toutes. Les deux bijections sans point fixe sont des produits de deux transpositions (même point (iv)), où $\lambda$ vaut $c^2 = 1$ ; donc $\lambda = 1$ si $c = 1$, et $\lambda = \varepsilon$ si $c = -1$.
    - |
      Un caractère de degré au moins $2$ n'est pas un morphisme. La [[representation-reguliere|représentation régulière]] de $\mathbb Z/2\mathbb Z$ a pour caractère $\chi$, qui vaut $2$ en $\bar 0$ et $0$ en $\bar 1$, la matrice de l'échange étant de trace nulle : $\chi(\bar 1)\chi(\bar 1) = 0 \neq 2 = \chi(\bar 1 + \bar 1)$. Plus loin, le nœud {{rp-lineaires|Caractères linéaires}}, (ii), montre que les caractères linéaires de $G$ sont ceux de son [[abelianise|abélianisé]] ; pour $\mathfrak S_3$, celui-ci a deux éléments, ce qui redonne les deux caractères de l'exemple précédent.

  fonction-centrale:
    - |
      Sur un [[groupe-abelien|groupe abélien]], $hgh^{-1} = g$, et toute fonction est centrale : pour $\lex{anneau-zn}{\mathbb Z/4\mathbb Z}$, les fonctions centrales forment l'espace $\mathbb C^G$ tout entier, de [[dimension]] $4$. Sur un groupe quelconque, les caractères sont des fonctions centrales (point (i)), de même que les fonctions indicatrices des [[classe-conjugaison|classes de conjugaison]].
    - |
      Sur le [[groupe-symetrique|groupe symétrique]] $\mathfrak S(\{a, b, c\})$, qui a six éléments, les fonctions centrales forment un espace de dimension $3$. Les classes de conjugaison sont en effet $\{\mathrm{id}\}$, les trois transpositions, conjuguées entre elles puisque $g \circ \tau_{xy} \circ g^{-1} = \tau_{g(x)g(y)}$, et les deux bijections sans point fixe $\rho$ et $\rho \circ \rho$ ({{a-groupe|Groupe}}, (iv)), puisqu'un conjugué d'une bijection sans point fixe est sans point fixe et que $\tau_{ab} \circ \rho \circ \tau_{ab} = \tau_{bc} \circ \tau_{ab} = \rho \circ \rho$. Une fonction centrale est déterminée par ses trois valeurs sur ces classes ; ainsi le nombre de points fixes, $3$, $1$ et $0$.
    - |
      Une fonction peut distinguer deux éléments conjugués, et n'est alors pas centrale. Sur le même groupe, la fonction $f$ qui vaut $1$ en $g$ si $g(a) = a$, et $0$ sinon, prend la valeur $1$ en $\tau_{bc}$ et $0$ en $\tau_{ab}$, transpositions conjuguées : elle n'est pas centrale. La somme des trois fonctions analogues pour $a$, $b$ et $c$ est le nombre de points fixes, qui l'est. Plus loin, le point (i) de {{rp-classes|Fonctions centrales}} montre que les caractères irréductibles forment une base de cet espace ; pour ce groupe, il y en a donc trois.

  table-caracteres:
    - |
      Pour $\lex{anneau-zn}{\mathbb Z/3\mathbb Z}$, groupe [[groupe-abelien|abélien]] à trois classes de conjugaison, les trois [[caractere-lineaire|caractères linéaires]] $\chi_k(\bar m) = j^{km}$, avec $j = \frac{-1 + i\sqrt 3}2$ et $j^3 = 1$, sont distincts et [[caractere-irreductible|irréductibles]] : par (i), ce sont tous les caractères irréductibles, et la table est
      $$\begin{array}{c|ccc} & \bar 0 & \bar 1 & \bar 2 \\ \hline \chi_0 & 1 & 1 & 1 \\ \chi_1 & 1 & j & j^2 \\ \chi_2 & 1 & j^2 & j \end{array}$$
      La colonne de $\bar 1$ donne $|1|^2 + |j|^2 + |j^2|^2 = 3$, cardinal du [[centralisateur|centralisateur]] $G$ tout entier, comme le veut (ii).
    - |
      La table de $\lex{groupe-symetrique}{\mathfrak S_3}$ se calcule sans construire de représentation de degré $2$. Ses classes sont l'identité, les trois transpositions $\tau$ et les deux bijections $\rho$ sans point fixe ({{a-groupe|Groupe}}, (iv)) : il y a trois caractères irréductibles, dont la constante $1$ et la signature $\varepsilon$. Le troisième, de degré $d$, vérifie $1 + 1 + d^2 = 6$ ({{rp-reguliere|Représentation régulière}}, (ii)), donc $d = 2$, et la relation $1 + \varepsilon(g) + 2\chi(g) = 0$ pour $g \neq \mathrm{id}$ (même nœud), avec $\varepsilon(\tau) = -1$ et $\varepsilon(\rho) = 1$, $\rho$ étant produit de deux transpositions, donne
      $$\begin{array}{c|ccc} & \mathrm{id}\ (1) & \tau\ (3) & \rho\ (2) \\ \hline 1 & 1 & 1 & 1 \\ \varepsilon & 1 & -1 & 1 \\ \chi & 2 & 0 & -1 \end{array}$$
    - |
      La table distingue $\mathbb Z/4\mathbb Z$ de $(\mathbb Z/2\mathbb Z)^2$, deux groupes abéliens d'ordre $4$. Les caractères du premier sont les $\bar m \mapsto i^{km}$, qui prennent les valeurs $\pm i$ ; ceux du second sont les $(x, y) \mapsto (-1)^{ax + by}$, à valeurs $\pm 1$, puisque tout élément y est de carré neutre. Plus loin, le nœud {{rp-quaternions|𝒟₄ et 𝒬₈}} montre que la table ne détermine pas toujours le groupe : le groupe diédral $\mathcal D_4$ et le groupe des quaternions $\mathcal Q_8$, non isomorphes, ont la même.

  element-algebrique:
    - |
      Sur $\lex{ensemble-reels}{\mathbb R}$, tout nombre complexe est algébrique. Le nombre $z = a + ib$ annule
      $$\begin{aligned} (X - z)(X - \bar z) &= X^2 - 2aX \\ &\quad + (a^2 + b^2), \end{aligned}$$
      polynôme à coefficients réels ({{c-calcul|Conjugué, module}}, (ii) et (iii)). Sur $\lex{ensemble-rationnels}{\mathbb Q}$, c'est une autre affaire : $i$ et $j = \frac{-1 + i\sqrt 3}2$ sont algébriques, racines de $X^2 + 1$ et de $X^2 + X + 1$. Le second, dont les racines $j$ et $\bar j$ ne sont pas réelles, est [[polynome-irreductible|irréductible]] sur $\mathbb Q$ ({{pol-irreductibles|Irréductibles}}, (iii)) : c'est le [[polynome-minimal|polynôme minimal]] de $j$, et $[\mathbb Q(j):\mathbb Q] = 2$ par (ii).
    - |
      Être algébrique dépend du corps de base. Dans le [[corps-fractions|corps des fractions]] $\mathbb Q(T)$ de $\mathbb Q[T]$, l'élément $T$ n'est pas algébrique sur $\mathbb Q$ : $P(T) = 0$ dans $\mathbb Q(T)$ signifie $P = 0$ dans $\mathbb Q[T]$, qui s'y plonge ({{a-fractions|Corps des fractions}}). Il est pourtant algébrique sur le sous-corps $\mathbb Q(T^2)$, puisqu'il annule $X^2 - T^2$, polynôme non nul à coefficients dans ce sous-corps.
    - |
      La preuve de (iv) dit que $\alpha = \sqrt[3]2 + \sqrt 2$ est algébrique, de degré au plus $3 \cdot 2 = 6$, sans donner de polynôme ; on en obtient un en éliminant les radicaux. De $(\alpha - \sqrt 2)^3 = 2$ on tire
      $$\alpha^3 + 6\alpha - 2 = \sqrt 2\,(3\alpha^2 + 2),$$
      puis, en élevant au carré,
      $$\begin{aligned} &\alpha^6 - 6\alpha^4 - 4\alpha^3 \\ &\quad + 12\alpha^2 - 24\alpha - 4 = 0. \end{aligned}$$
      Ce polynôme de degré $6$ annule $\alpha$, et le polynôme minimal de $\alpha$ le divise, par (i).

  corps-rupture:
    - |
      Le corps $\lex{ensemble-complexes}{\mathbb C}$ est, par sa construction même, le corps de rupture $\lex{ensemble-reels}{\mathbb R}[X]/(X^2 + 1)$ de $X^2 + 1$ sur $\mathbb R$ ({{c-construction|Construction de ℂ}}), et la classe $i$ de $X$ est la [[racine-polynome|racine]] annoncée par (iii). Ici le corps de rupture contient aussi l'autre racine, $-i$, comme pour tout polynôme irréductible $X^2 + bX + c$ de [[degre-polynome|degré]] $2$, dont la seconde racine est $-b - \alpha$ si $\alpha$ est la première.
    - |
      Contrairement à $\mathbb Q[X]/(X^3 - 2)$, un corps de rupture de degré $3$ peut contenir les trois racines. Sur $\lex{anneau-zn}{\mathbb Z/2\mathbb Z}$, le polynôme $P = X^3 + X + 1$, qui vaut $1$ en $0$ et en $1$, est [[polynome-irreductible|irréductible]] ({{pol-irreductibles|Irréductibles}}, (iii)). Son corps de rupture $L = (\mathbb Z/2\mathbb Z)[X]/(P)$, de base $(1, x, x^2)$ où $x$ est la classe de $X$, a huit éléments. Comme $P(y^2) = P(y)^2$ pour tout $y \in L$ ({{pol-binome|Binôme de Newton}}, (iv)), les coefficients de $P$ valant $0$ ou $1$, les éléments $x$, $x^2$ et $x^4 = x^2 + x$, où l'on a employé $x^3 = x + 1$, sont tous trois racines de $P$. Ces trois éléments sont distincts, les coordonnées dans la base n'étant pas les mêmes.
    - |
      Sans l'hypothèse d'irréductibilité, le quotient n'est plus un corps. Dans $\lex{ensemble-rationnels}{\mathbb Q}[X]/(X^2 - 1)$, les classes $u$ et $v$ de $X - 1$ et de $X + 1$ ne sont pas nulles, puisque $X^2 - 1$, de degré $2$, ne divise ni l'un ni l'autre, mais leur produit $uv$ est la classe de $X^2 - 1$, nulle : l'anneau quotient a des diviseurs de zéro, et n'est pas un corps. C'est que $X^2 - 1 = (X - 1)(X + 1)$ n'est pas irréductible.

  corps-fixe:
    - |
      Le corps fixe change avec le groupe. Dans $\lex{ensemble-complexes}{\mathbb C}$, $\sqrt 2 \notin \mathbb Q(i)$, puisque $(a + bi)^2 = 2$, avec $a, b \in \mathbb Q$, forcerait $ab = 0$ et $a^2 - b^2 = 2$, ce qu'exclut {{q-irrationnel|Irrationalité de √2}}. Donc $L = \{u + v\sqrt 2 : u, v \in \mathbb Q(i)\}$ est un corps, l'inverse de $u + v\sqrt 2$ étant $(u - v\sqrt 2)/(u^2 - 2v^2)$, de base $(1, \sqrt 2)$ sur $\mathbb Q(i)$ ; et $\tau : u + v\sqrt 2 \mapsto u - v\sqrt 2$ en est un automorphisme, la formule du produit ne faisant intervenir que $(\sqrt 2)^2 = 2$.

      La conjugaison $c$ envoie $L$ sur $L$ et commute à $\tau$ ; tous deux sont de carré $\mathrm{id}$. Les corps fixes de $\{\mathrm{id}, \tau\}$, de $\{\mathrm{id}, c\}$ et du groupe $G = \{\mathrm{id}, \tau, c, \tau c\}$ sont $\mathbb Q(i)$, puis $L \cap \lex{ensemble-reels}{\mathbb R} = \mathbb Q(\sqrt 2)$, puisque $u + v\sqrt 2$ réel, avec $u, v \in \mathbb Q(i)$, donne $\operatorname{Im} u + \sqrt 2\operatorname{Im} v = 0$, donc $\operatorname{Im} u = \operatorname{Im} v = 0$ par irrationalité de $\sqrt 2$, et enfin leur intersection $\lex{ensemble-rationnels}{\mathbb Q}$, un élément de $\mathbb Q(i)$ n'étant réel que s'il est rationnel. Le théorème d'Artin donne alors $[L:\mathbb Q] = |G| = 4$.
    - |
      Dans le [[corps-fractions|corps des fractions]] $L = \mathbb Q(T)$, posons $s(P/Q) = P(-T)/Q(-T)$. C'est bien défini : la substitution est un morphisme d'anneaux de $\mathbb Q[T]$ ({{pol-evaluation|Évaluation}}, (ii)), bijectif puisqu'il est sa propre réciproque, donc $Q(-T) \neq 0$, et l'égalité $PQ_1 = P_1Q$ entre deux écritures $P/Q = P_1/Q_1$ se conserve ; les formules de {{a-fractions|Corps des fractions}} font de $s$ un morphisme, et $s \circ s = \mathrm{id}$. Le corps fixe de $\{\mathrm{id}, s\}$ contient $\mathbb Q(T^2)$, et lui est égal.

      En effet, $L = \mathbb Q(T^2) + \mathbb Q(T^2)\,T$ : on écrit $P/Q = P(T)Q(-T)/\big(Q(T)Q(-T)\big)$, où le dénominateur, fixé par $s$, est un polynôme en $T^2$, et le numérateur s'écrit $E(T^2) + T\,O(T^2)$. Ainsi $[L:\mathbb Q(T^2)] \leqslant 2$, qui est le degré de $L$ sur le corps fixe par Artin, et la multiplicativité des degrés ({{gs-extensions|Extensions, degré}}) donne l'égalité des deux corps.
    - |
      Le théorème d'Artin suppose le groupe fini. Sur $L = \mathbb Q(T)$, les translations $f(T) \mapsto f(T + n)$, $n \in \lex{ensemble-entiers-relatifs}{\mathbb Z}$, définies comme $s$ dans l'exemple précédent, forment un groupe infini $G$, de corps fixe $\mathbb Q$. Si $f = P/Q$, avec $P \wedge Q = 1$ et $Q$ unitaire, vérifie $f(T + 1) = f(T)$, alors $P(T+1)Q(T) = P(T)Q(T+1)$. La substitution transporte la relation de Bézout de $P$ et $Q$ : $Q(T+1)$, premier avec $P(T+1)$, divise $Q(T)$ ({{pol-principal|K[X] principal}}, (iii)), et, de même degré et unitaire, lui est égal, puis $P(T+1) = P(T)$.

      Un polynôme $R$ tel que $R(T+1) = R(T)$ prend la valeur $R(0)$ en tout entier naturel, donc est constant ({{pol-racines|Racines}}, (iii)) : $f \in \mathbb Q$. Or $f(T) \mapsto f(2T)$, de réciproque $f(T) \mapsto f(T/2)$, est un automorphisme de $L$ qui fixe $\mathbb Q$ sans appartenir à $G$ : $\lex{groupe-automorphismes}{\operatorname{Aut}}(L/L^G) \neq G$.

  extension-finie:
    - |
      Dans $\lex{ensemble-complexes}{\mathbb C}$, le sous-corps $\lex{corps-engendre}{\mathbb Q(i)}$ est une extension finie de $\lex{ensemble-rationnels}{\mathbb Q}$, de degré $2$. L'ensemble $\{a + bi : a, b \in \mathbb Q\}$ est en effet stable par produit ({{c-calcul|Conjugué, module}}, (i)) et par inverse, puisque $1/(a + bi) = (a - bi)/(a^2 + b^2)$ pour $(a, b) \neq (0, 0)$ (même nœud, (iii)) ; c'est donc $\mathbb Q(i)$, et $(1, i)$ en est une base sur $\mathbb Q$, l'égalité $a + bi = 0$ avec $a, b$ rationnels forçant $a = b = 0$ ({{c-construction|Construction de ℂ}}).
    - |
      La finitude passe aux corps intermédiaires. Si $L/K$ est finie et $K \subset M \subset L$, une base de $L$ sur $K$ engendre $L$ sur $M$, et $M$ est un sous-espace du $K$-espace $L$ : $[L:M]$ et $[M:K]$ sont au plus $[L:K]$ ({{v-dimension|Dimension}}, (ii) et (iii)). Ainsi $\mathbb C/\mathbb Q$ n'est pas finie, bien que $[\mathbb C:\lex{ensemble-reels}{\mathbb R}] = 2$, puisque $\mathbb R/\mathbb Q$ ne l'est pas (remarque du nœud).
    - |
      Une extension engendrée par un seul élément n'est pas toujours finie. Dans le [[corps-fractions|corps des fractions]] $K(T)$ de l'anneau $K[T]$, qui est le sous-corps engendré par $T$, les puissances $1, T, T^2, \dots$ sont libres sur $K$ : une combinaison $\sum_k a_kT^k$ nulle dans $K(T)$ est nulle dans $K[T]$, qui s'y plonge ({{a-fractions|Corps des fractions}}), et tous ses coefficients sont nuls. Ainsi $[K(T):K] = \infty$. Plus loin, le nœud {{gs-algebriques|Polynôme minimal}} montre, par ses points (ii) et (iv), que $K(\alpha)$ est fini sur $K$ exactement quand $\alpha$ annule un polynôme non nul de $K[X]$, ce que $T$ ne fait pas.

  extension-radicale:
    - |
      Les radicaux peuvent s'emboîter. Dans $\lex{ensemble-reels}{\mathbb R}$, le nombre $\gamma = \sqrt{2 + \sqrt 2}$ est obtenu par la tour
      $$\mathbb Q \subset \mathbb Q(\sqrt 2) \subset \mathbb Q(\sqrt 2, \gamma),$$
      avec $(\sqrt 2)^2 = 2 \in \mathbb Q$ et $\gamma^2 = 2 + \sqrt 2 \in \mathbb Q(\sqrt 2)$ : c'est une extension radicale de $\lex{ensemble-rationnels}{\mathbb Q}$, avec $m_1 = m_2 = 2$, bien que $\gamma^2$ ne soit pas rationnel. On peut poursuivre, $\sqrt{2 + \sqrt{2 + \sqrt 2}}$ demandant un étage de plus.
    - |
      En [[caracteristique-corps|caractéristique]] nulle, toute extension de [[degre-extension|degré]] $2$ est radicale. Si $[L:K] = 2$ et $\alpha \in L \setminus K$, alors $[K(\alpha):K]$, qui divise $2$ ({{gs-extensions|Extensions, degré}}), vaut $2$, donc $L = K(\alpha)$, et le [[polynome-minimal|polynôme minimal]] de $\alpha$ s'écrit $X^2 + bX + c$ ({{gs-algebriques|Polynôme minimal}}, (ii)). L'élément $\delta = 2\alpha + b$ vérifie $\delta^2 = b^2 - 4c \in K$, et $\alpha = (\delta - b)/2$, la division par $2$ étant permise puisque $2 \cdot 1 \neq 0$ : $L = K(\delta)$ est obtenu en adjoignant une racine carrée.
    - |
      Un réel peut s'obtenir par un radical complexe. Soit $\zeta = \cos\frac{2\pi}9 + i\sin\frac{2\pi}9$ ; les formules d'addition ({{tg-addition|Formules d'addition}}, (iii)) donnent $\zeta^9 = 1$ et $\omega = \zeta^3 = \cos\frac{2\pi}3 + i\sin\frac{2\pi}3 \neq 1$, donc $\omega^2 + \omega + 1 = 0$, puisque $(\omega - 1)(\omega^2 + \omega + 1) = \omega^3 - 1 = 0$. Par parité et périodicité (même nœud, (iv) et (v)), $\zeta^{-1} = \zeta^8 = \bar\zeta$, et le réel $r = \zeta + \zeta^{-1} = 2\cos\frac{2\pi}9$ vérifie
      $$\begin{aligned} r^3 &= \omega + \omega^{-1} + 3r \\ &= \omega + \omega^2 + 3r = 3r - 1. \end{aligned}$$
      Ainsi $r$, une racine réelle de $X^3 - 3X + 1$, est dans l'extension radicale $\mathbb Q(\zeta)$, à un étage, puisque $\zeta^9 = 1 \in \mathbb Q$ ; le même calcul, avec $\zeta^2$ puis $\zeta^4$ à la place de $\zeta$, y met aussi les racines $\zeta^2 + \zeta^{-2}$ et $\zeta^4 + \zeta^{-4}$.
      ```schema lex-extension-radicale-3
      Les neuf racines neuvièmes de l'unité sur le cercle unité ; $\zeta$ et $\bar\zeta = \zeta^8$ sont en rouge, $\omega = \zeta^3$ et $\omega^2 = \zeta^6$ en bleu. Le réel $r = \zeta + \bar\zeta = 2\cos\frac{2\pi}9$, en rouge lui aussi, quatrième sommet du losange en pointillé construit sur $0$, $\zeta$ et $\bar\zeta$, est une racine de $X^3 - 3X + 1$.
      ```
      Plus loin, le nœud {{h90-radicaux|Groupe résoluble ⇒ radicaux}} montre que, en caractéristique nulle, tout polynôme de groupe de Galois résoluble a ses racines dans une extension radicale.

  polynome-resoluble-radicaux:
    - |
      Tout polynôme de [[degre-polynome|degré]] $2$ sur $\lex{ensemble-rationnels}{\mathbb Q}$ est résoluble par radicaux. Si $\alpha$ est une racine de $X^2 + bX + c$ dans un [[corps-decomposition|corps de décomposition]], alors $\delta = 2\alpha + b$ vérifie $\delta^2 = b^2 - 4c$, et les deux racines sont $(-b \pm \delta)/2$. Le corps de décomposition est donc $\mathbb Q(\delta)$, [[extension-radicale|extension radicale]] à un étage, puisque $\delta^2 \in \mathbb Q$.
    - |
      Pour $X^4 - 2$, soit $\beta$ le réel positif tel que $\beta^4 = 2$. Dans $\lex{ensemble-complexes}{\mathbb C}$, ses racines sont $\beta$, $-\beta$, $i\beta$ et $-i\beta$, puisque $(i^k\beta)^4 = \beta^4 = 2$ et qu'il y en a au plus quatre ({{pol-racines|Racines}}, (iii)). Le corps de décomposition $\mathbb Q(\beta, i)$ est obtenu par la tour
      $$\mathbb Q \subset \mathbb Q(i) \subset \mathbb Q(i, \beta),$$
      avec $i^2 = -1 \in \mathbb Q$ et $\beta^4 = 2 \in \mathbb Q(i)$ : il est lui-même radical, et $X^4 - 2$ est résoluble par radicaux. Le théorème du nœud en déduit que son [[groupe-galois|groupe de Galois]] est [[groupe-resoluble|résoluble]].
    - |
      Les racines de l'unité comptent parmi les radicaux. Pour $\zeta = \cos\frac{2\pi}5 + i\sin\frac{2\pi}5$, les formules d'addition ({{tg-addition|Formules d'addition}}, (iii)) donnent $\zeta^k = \cos\frac{2k\pi}5 + i\sin\frac{2k\pi}5$, donc $\zeta^5 = 1$ ; les cinq racines $\zeta^k$ de $X^5 - 1$ sont distinctes, puisque $\cos\frac{2k\pi}5 = 1$ seulement pour $5 \mid k$ ({{tg-cercle|Paramétrage du cercle}}, (ii)). Le corps de décomposition $\mathbb Q(\zeta)$ est radical à un étage, $\zeta^5 \in \mathbb Q$, et $X^5 - 1$ est résoluble par radicaux.

      Plus loin, le nœud {{gs-abel-ruffini|Abel-Ruffini}} montre que $X^5 - 4X + 2$, de groupe $\lex{groupe-symetrique}{\mathfrak S_5}$, ne l'est pas.

  caracteristique-corps:
    - |
      Les corps $\lex{ensemble-rationnels}{\mathbb Q}$, $\lex{ensemble-reels}{\mathbb R}$ et $\lex{ensemble-complexes}{\mathbb C}$ sont de caractéristique nulle, puisque $n \cdot 1 = n$ n'y est nul que pour $n = 0$, et leur sous-corps engendré par $1$ est $\mathbb Q$. Pour $p$ premier, $\lex{anneau-zn}{\mathbb Z/p\mathbb Z}$ est de caractéristique $p$, le noyau de $n \mapsto \bar n$ étant $p\mathbb Z$. Le corps à deux éléments $\lex{ensemble-parties}{\mathcal P}(\{a\})$, où $1 + 1 = 0$ ({{a-corps|Corps}}, seconde remarque), est de caractéristique $2$, et donc isomorphe à $\mathbb Z/2\mathbb Z$ par le point (iii).
    - |
      Le point (iii) repose sur l'intégrité des corps, et il tombe pour un anneau qui ne l'est pas. Dans $\lex{anneau-zn}{\mathbb Z/6\mathbb Z}$, le noyau de $n \mapsto n \cdot \bar 1$ est $6\mathbb Z$, de générateur positif $6$, qui n'est pas premier : la factorisation $\bar 2 \cdot \bar 3 = \bar 0$ est exactement ce que la preuve de (iii) exclut dans un corps. Pour la même raison, aucun corps n'est de caractéristique $4$ : si $4 \cdot 1 = 0$, alors $(2 \cdot 1)^2 = 0$, donc $2 \cdot 1 = 0$ dans un corps.
    - |
      Un corps de caractéristique $p$ peut être infini. L'anneau $(\mathbb Z/p\mathbb Z)[T]$ est [[anneau-integre|intègre]] ({{pol-anneau|Anneau A[X]}}), et son [[corps-fractions|corps des fractions]] $K$ contient les puissances $T^k$, deux à deux distinctes ; il est de caractéristique $p$, puisque $p \cdot 1 = 0$ dans $\mathbb Z/p\mathbb Z$. On y a $(1 + T)^p = 1 + T^p$ ({{pol-binome|Binôme de Newton}}, (iv)), alors que dans $\mathbb Q[T]$ le coefficient de $T$ dans $(1 + T)^p$ vaut $p \neq 0$.

  racine-nieme-unite:
    - |
      Dans $\lex{ensemble-complexes}{\mathbb C}$, $\mu_4(\mathbb C) = \{1, i, -1, -i\}$ et, avec $j = \frac{-1 + i\sqrt 3}2$, $\mu_6(\mathbb C) = \{\pm 1, \pm j, \pm j^2\}$ : ces six nombres vérifient $x^6 = 1$, puisque $j^3 = 1$, ils sont distincts, et il ne peut y en avoir davantage ({{pol-racines|Racines}}, (iii)). Le groupe $\mu_6(\mathbb C)$ est cyclique, engendré par $-j$, comme le veut le point (i).
    - |
      Le groupe $\mu_n(K)$ peut avoir moins de $n$ éléments. On a $\mu_4(\lex{ensemble-reels}{\mathbb R}) = \{1, -1\}$ et $\mu_3(\lex{ensemble-rationnels}{\mathbb Q}) = \{1\}$, le seul réel de cube $1$ étant $1$. Dans $\lex{anneau-zn}{\mathbb Z/3\mathbb Z}$, les deux éléments non nuls vérifient $x^2 = 1$, donc $x^4 = 1$ : $\mu_4(\mathbb Z/3\mathbb Z)$ a deux éléments. Dans $\mathbb Z/5\mathbb Z$, en revanche, le [[groupe-multiplicatif|groupe multiplicatif]], d'ordre $4$, est tout entier formé de racines quatrièmes de l'unité ({{gf-cycliques|Groupes cycliques}}, (i)).
    - |
      En [[caracteristique-corps|caractéristique]] $p$, $\mu_p(K) = \{1\}$ : le binôme ({{pol-binome|Binôme de Newton}}, (iv)) donne $x^p - 1 = (x - 1)^p$, nul seulement pour $x = 1$. Dans tous les cas, $\mu_n(K)$, sous-groupe fini de $K^\times$, est cyclique ({{gf-multiplicatif|Groupe multiplicatif}}, (iii)) ; ainsi $\mu_6(\mathbb Z/7\mathbb Z)$ est engendré par $3$. Plus loin, la théorie de Kummer ({{h90-kummer|Kummer}}) suppose que $\mu_n(K)$ a $n$ éléments, et décrit alors les extensions cycliques de degré $n$ de $K$.

  extension-algebrique:
    - |
      Toute [[extension-finie|extension finie]] est algébrique ({{gs-algebriques|Polynôme minimal}}, (iv)). Ainsi $\lex{ensemble-complexes}{\mathbb C}/\lex{ensemble-reels}{\mathbb R}$ l'est, ce qu'on voit aussi directement : $z = a + ib$ annule $X^2 - 2aX + a^2 + b^2$, polynôme réel ({{c-calcul|Conjugué, module}}, (iii)). De même $\mathbb Q(\sqrt 2, \sqrt 3)/\lex{ensemble-rationnels}{\mathbb Q}$, de degré $4$, est algébrique, et chacun de ses éléments est racine d'un polynôme rationnel de [[degre-polynome|degré]] au plus $4$.
    - |
      Une extension simple peut ne pas être algébrique. Dans le [[corps-fractions|corps des fractions]] $K(T)$ de $K[T]$, l'élément $T$ n'annule aucun polynôme non nul, puisque les puissances de $T$ sont libres sur $K$, comme le montrent les exemples d'[[extension-finie|extension finie]]. L'extension $K(T)/K$ n'est donc pas algébrique, et, par le point (iv) du nœud {{gs-algebriques|Polynôme minimal}}, elle ne pouvait pas être finie.
    - |
      La réciproque de (iv) est fausse : une extension algébrique peut être infinie. Les nombres complexes algébriques sur $\mathbb Q$ forment un sous-corps $A$ de $\mathbb C$ ({{gs-algebriques|Polynôme minimal}}, (iv)), extension algébrique de $\mathbb Q$ par construction. Pour tout $n \geqslant 1$, le réel positif $\alpha_n$ tel que $\alpha_n^n = 2$ appartient à $A$, et $X^n - 2$, irréductible par le critère d'Eisenstein ({{pol-eisenstein|Eisenstein}}, (i)), en est le polynôme minimal : $[\mathbb Q(\alpha_n):\mathbb Q] = n$, donc $[A:\mathbb Q] \geqslant n$ pour tout $n$, et $A/\mathbb Q$ n'est pas finie.

  extension-simple:
    - |
      Les extensions simples sont plus nombreuses qu'il n'y paraît. Le corps $\lex{ensemble-complexes}{\mathbb C} = \lex{ensemble-reels}{\mathbb R}(i)$ est une extension simple de $\mathbb R$. Le [[corps-decomposition|corps de décomposition]] $L = \lex{ensemble-rationnels}{\mathbb Q}(\alpha, j)$ de $X^3 - 2$, où $\alpha = \sqrt[3]2$ et $j = \frac{-1 + i\sqrt 3}2$, donné par deux générateurs, en est une aussi : la première remarque du nœud donne à $\alpha + j$ un [[polynome-minimal|polynôme minimal]] de degré $6$, si bien que $\mathbb Q(\alpha + j)$, de degré $6$ et contenu dans $L$, de degré $6$ lui aussi ({{gs-decomposition|Corps de décomposition}}, remarque), lui est égal ({{v-dimension|Dimension}}, (iii)).
    - |
      Une extension simple a beaucoup de générateurs. Dans le [[corps-fractions|corps des fractions]] $\mathbb Q(T)$, de degré infini sur $\mathbb Q$ comme le montrent les exemples d'[[extension-finie|extension finie]], l'élément $U = (aT + b)/(cT + d)$, avec $a, b, c, d$ rationnels et $ad - bc \neq 0$, engendre aussi $\mathbb Q(T)$ : de $U(cT + d) = aT + b$ on tire $T = (dU - b)/(a - cU)$, le dénominateur n'étant pas nul puisque $a - cU = (ad - bc)/(cT + d)$. En revanche $T^2$ n'engendre que $\mathbb Q(T^2)$, qui ne contient pas $T$ : $T = f(T^2)/g(T^2)$ donnerait $Tg(T^2) = f(T^2)$, de degré impair d'un côté et pair de l'autre.
    - |
      L'hypothèse de séparabilité de (ii) ne peut pas être omise. Soit $p$ premier, $L$ le corps des fractions de $\mathbb F_p[S, T]$, avec $\mathbb F_p = \lex{anneau-zn}{\mathbb Z/p\mathbb Z}$, et $k$ le sous-corps engendré par $S^p$ et $T^p$. Pour $\gamma = f/g \in L$, on a $\gamma^p = f^p/g^p \in k$, puisque $f^p$, par le binôme en caractéristique $p$ ({{pol-binome|Binôme de Newton}}, (iv)), est un polynôme en $S^p$ et $T^p$ : $[k(\gamma):k] \leqslant p$. L'extension $L = k(S, T)$ est finie, de degré au plus $p^2$ (preuve de {{gs-algebriques|Polynôme minimal}}, (iv)), $S$ et $T$ annulant $X^p - S^p$ et $X^p - T^p$.

      Montrons que $[L:k] > p$. Le polynôme minimal de $S$ sur $k$ divise $(X - S)^p$, donc s'écrit $(X - S)^m$ ; pour $m < p$, son coefficient en $X^{m-1}$, $-mS$, mettrait $S$ dans $k$. Or $S = f/g$, avec $f$ et $g$ polynômes en $S^p$ et $T^p$, donnerait $Sg = f$, dont le degré en $S$, en voyant les polynômes comme polynômes en $S$ à coefficients dans $\mathbb F_p[T]$, serait congru à la fois à $1$ et à $0$ modulo $p$ ; d'où $[k(S):k] = p$. De même $T \notin k(S)$, dont les éléments sont des quotients de polynômes en $S$ et $T^p$ ; ainsi $[L:k] \geqslant 2p$, et aucun $\gamma$ n'engendre $L$. La remarque du nœud admet $[L:k] = p^2$ ; l'inégalité $[L:k] > p$ suffit ici.

  caractere-irreductible:
    - |
      Les [[caractere-lineaire|caractères linéaires]] sont des caractères irréductibles, puisqu'une représentation de [[degre-representation|degré]] $1$ est [[representation-irreductible|irréductible]] ({{rp-representations|Représentations}}, (ii)). Ainsi la constante $1$, caractère de la [[representation-triviale|représentation triviale]], la signature $\varepsilon$ de $\lex{groupe-symetrique}{\mathfrak S_n}$, et, pour $\lex{anneau-zn}{\mathbb Z/3\mathbb Z}$, la fonction $\bar k \mapsto j^k$, où $j = \frac{-1 + i\sqrt 3}2$ vérifie $j^3 = 1$, sont des caractères irréductibles.
    - |
      Un caractère irréductible peut être de degré $2$. Soient $R$ et $S$ les matrices de lignes $(0, -1), (1, 0)$ et $(1, 0), (0, -1)$ ; on a $R^4 = S^2 = I_2$ et $SR = R^3S$, si bien que les huit matrices $R^mS^b$, $0 \leqslant m < 4$, $b \in \{0, 1\}$, forment un groupe $G$, dont l'inclusion dans $\lex{groupe-lineaire}{GL_2}(\lex{ensemble-complexes}{\mathbb C})$ est une représentation. Une droite stable serait une droite propre de $S$, donc $\mathbb Ce_1$ ou $\mathbb Ce_2$, puisque $S$, en dimension $2$, a les deux [[valeur-propre|valeurs propres]] distinctes $1$ et $-1$ ; or $Re_1 = e_2$ et $Re_2 = -e_1$.

      La représentation est donc irréductible, et son caractère, qui vaut $2$ en $I_2$, $-2$ en $R^2 = -I_2$ et $0$ en les six autres matrices, est irréductible.
    - |
      Le caractère $\chi$ de la [[representation-permutation|représentation de permutation]] de $\mathfrak S_3$ sur $\mathbb C^3$ compte les [[point-fixe-action|points fixes]] (point (v)) : il vaut $3$ en l'identité, $1$ en chacune des trois transpositions et $0$ en les deux bijections sans point fixe. Cette représentation n'est pas irréductible, la droite $\mathbb C(1, 1, 1)$ étant stable. Plus loin, le critère du point (iv) de {{rp-orthogonalite|Orthogonalité}} montrera que $\chi$ n'est le caractère d'aucune représentation irréductible, puisque $\frac16(3^2 + 3 \cdot 1^2 + 2 \cdot 0^2) = 2 \neq 1$.

  invariants-representation:
    - |
      Pour la [[representation-permutation|représentation de permutation]] de $\lex{groupe-symetrique}{\mathfrak S_3}$ sur $\lex{ensemble-complexes}{\mathbb C}^3$, les invariants sont les vecteurs dont les trois coordonnées sont égales, puisque toute permutation des coordonnées les laisse fixes : $V^G = \mathbb C(1, 1, 1)$. La formule du point (i) le confirme, le caractère valant $3$, $1$ et $0$ sur les classes de cardinaux $1$, $3$ et $2$ :
      $$\dim V^G = \tfrac16(3 + 3 \cdot 1 + 2 \cdot 0) = 1.$$
    - |
      Une représentation de degré $1$ qui n'est pas triviale n'a pas d'invariant non nul, et sa moyenne est nulle. Pour $\lex{anneau-zn}{\mathbb Z/4\mathbb Z}$ agissant sur $\mathbb C$ par $\bar k \mapsto i^k$, aucun $x \neq 0$ ne vérifie $ix = x$, et le point (i) donne
      $$\tfrac14(1 + i - 1 - i) = 0 = \dim V^G.$$
      Le projecteur $p = \frac14\sum_k \rho(\bar k)$ du même point est ici l'application nulle.
    - |
      Le point (iii) compte les morphismes par les caractères. Pour la représentation de permutation $V = \mathbb C^3$ de $\mathfrak S_3$,
      $$\begin{aligned} &\dim \operatorname{Hom}_G(V, V) \\ &\quad = \tfrac16(9 + 3 \cdot 1 + 2 \cdot 0) = 2 : \end{aligned}$$
      les morphismes sont les combinaisons de l'identité et du projecteur $x \mapsto \frac13(x_1 + x_2 + x_3)(1, 1, 1)$, qui sont libres et commutent aux permutations. Plus loin, le nœud {{rp-orthogonalite|Orthogonalité}} lira ce $2$ comme $1^2 + 1^2$ : $V$ est somme de deux représentations irréductibles non isomorphes, la droite triviale et le plan $H$.

  multiplicite-representation:
    - |
      Pour la [[representation-permutation|représentation de permutation]] de $\lex{groupe-symetrique}{\mathfrak S_3}$ sur $\lex{ensemble-complexes}{\mathbb C}^3$, de caractère $\chi$ valant $3$, $1$ et $0$ sur les classes de l'identité, des trois transpositions et des deux bijections sans point fixe, la multiplicité de la [[representation-triviale|représentation triviale]] est
      $$\langle \chi, 1 \rangle = \tfrac16(3 + 3 \cdot 1 + 2 \cdot 0) = 1,$$
      et celle de la signature $\varepsilon$ est $\frac16(3 - 3 \cdot 1 + 2 \cdot 0) = 0$. La droite triviale apparaît donc une fois, et la signature jamais.
    - |
      Une multiplicité peut dépasser $1$. Pour $\lex{anneau-zn}{\mathbb Z/2\mathbb Z}$ agissant sur $\mathbb C^3$ par $\rho(\bar 1) = \operatorname{diag}(1, -1, -1)$, somme directe de trois droites stables, le caractère vaut $3$ en $\bar 0$ et $-1$ en $\bar 1$. La multiplicité de la représentation triviale est $\frac12(3 - 1) = 1$, et celle de $\varepsilon$, où $\varepsilon(\bar 1) = -1$, est $\frac12(3 + 1) = 2$ ; on retrouve $\langle \chi, \chi \rangle = \frac12(9 + 1) = 5 = 1^2 + 2^2$.
    - |
      La multiplicité suppose une décomposition en irréductibles, qui peut manquer quand l'ordre du groupe s'annule dans le corps. Sur $K = \mathbb Z/2\mathbb Z$, l'échange $S$ des deux vecteurs de base de $K^2$ n'a qu'une droite stable, $K(1, 1)$, puisque sa seule valeur propre est $1$ et que le noyau de $S - I_2$ est cette droite. Le plan $K^2$ n'est donc pas somme directe de droites stables, et la multiplicité n'y a pas de sens : c'est pourquoi la définition est donnée sur $\mathbb C$, où le théorème de Maschke ({{rp-maschke|Maschke}}, (ii)) garantit la décomposition.

  morphisme-representations:
    - |
      Une moyenne fournit un morphisme. Pour la [[representation-permutation|représentation de permutation]] de $\lex{groupe-symetrique}{\mathfrak S_3}$ sur $K^3$, avec $3 \cdot 1_K \neq 0$, l'application
      $$p(x_1, x_2, x_3) = \tfrac13(x_1 + x_2 + x_3)\,(1, 1, 1)$$
      est un morphisme de $K^3$ dans lui-même : permuter les coordonnées ne change ni leur somme ni le vecteur $(1, 1, 1)$, si bien que $p \circ \rho(\sigma) = p = \rho(\sigma) \circ p$. Son image $Ks$ et son noyau $H$ sont stables, comme l'annonce (i).
    - |
      Entre la [[representation-triviale|représentation triviale]] de $\lex{anneau-zn}{\mathbb Z/2\mathbb Z}$ et la représentation $\varepsilon$ de degré $1$, où $\varepsilon(\bar 1) = -1$, un morphisme est la multiplication par un $c \in K$ telle que $c = -c$. Si $2 \cdot 1_K \neq 0$, cela force $c = 0$, et $\operatorname{Hom}_G(K, K) = \{0\}$ pour ce couple. Sur $\mathbb Z/2\mathbb Z$, au contraire, $\varepsilon$ est la représentation triviale, et tout $c$ convient : l'espace des morphismes dépend du corps.
    - |
      Pour la [[representation-reguliere|représentation régulière]] de $\mathbb Z/2\mathbb Z$, où $\bar 1$ agit sur $K^2$ par la matrice $S$ de lignes $(0, 1)$ et $(1, 0)$, les morphismes de $K^2$ dans lui-même sont les matrices qui commutent à $S$, c'est-à-dire celles de lignes $(a, b)$ et $(b, a)$ : $\operatorname{Hom}_G(K^2, K^2) = \{aI_2 + bS\}$ est de [[dimension]] $2$. Plus loin, le lemme de Schur ({{rp-schur|Schur}}, (iii)) réduira cet espace aux homothéties pour une représentation complexe irréductible, ce que $K^2$ n'est pas, la droite $K(1, 1)$ étant stable.

  sous-espace-stable-representation:
    - |
      Pour un groupe cyclique, il suffit de tester un générateur, puisque $\rho(\bar k) = \rho(\bar 1)^k$. Soit $A$ la matrice de lignes $(0, -1)$ et $(1, -1)$, qui vérifie $A^3 = I_2$ ; la représentation $\bar k \mapsto A^k$ de $\lex{anneau-zn}{\mathbb Z/3\mathbb Z}$ est bien définie. Ses droites stables sont engendrées par les [[vecteur-propre|vecteurs propres]] de $A$, dont les valeurs propres sont les racines de $\lambda^2 + \lambda + 1$ ({{v-valeurs-propres|Valeurs propres}}, (i)). Sur $\lex{ensemble-rationnels}{\mathbb Q}$, il n'y en a pas, et seuls $\{0\}$ et $\mathbb Q^2$ sont stables ; sur $\lex{ensemble-complexes}{\mathbb C}$, les droites propres pour $j = \frac{-1 + i\sqrt 3}2$ et $j^2$, les deux racines, sont stables.
    - |
      Un sous-espace stable par un élément du groupe ne l'est pas forcément par le groupe. Dans la [[representation-permutation|représentation de permutation]] de $\lex{groupe-symetrique}{\mathfrak S_3}$ sur $\mathbb C^3$, la transposition $\tau_{12}$ envoie $u = (1, -1, 0)$ sur $-u$ : la droite $\mathbb Cu$ est stable par $\tau_{12}$. Mais la bijection $\sigma : 1 \mapsto 2 \mapsto 3 \mapsto 1$ envoie $u = e_1 - e_2$ sur $e_2 - e_3$, qui n'est pas proportionnel à $u$ : la droite n'est pas stable.
      ```schema lex-sous-espace-stable-representation-2
      Le plan réel $x + y + z = 0$, où les points $p_i = e_i - \frac13(1, 1, 1)$ sont les sommets du triangle. La droite de $u = (1, -1, 0)$, en rouge, est parallèle au côté $p_1p_2$ ; $\tau_{12}$ la conserve, mais $\sigma$ l'envoie sur la droite de $e_2 - e_3$, en bleu, parallèle au côté $p_2p_3$.
      ```
    - |
      Pour la [[representation-reguliere|représentation régulière]] de $\lex{anneau-zn}{\mathbb Z/2\mathbb Z}$ sur $\mathbb C^2$, où $\bar 1$ échange les vecteurs de base, les sous-espaces stables sont exactement $\{0\}$, les droites $\mathbb C(1, 1)$ et $\mathbb C(1, -1)$, et $\mathbb C^2$ : une droite stable est une droite propre de l'échange, de valeurs propres $1$ et $-1$. Plus loin, le théorème de Maschke ({{rp-maschke|Maschke}}, (i)) garantit qu'un sous-espace stable a toujours un supplémentaire stable quand $|G| \cdot 1_K \neq 0$ ; ici, chacune des deux droites est le supplémentaire stable de l'autre.

  sous-representation:
    - |
      La [[representation-reguliere|représentation régulière]] de $\lex{anneau-zn}{\mathbb Z/3\mathbb Z}$ sur $\lex{ensemble-complexes}{\mathbb C}^3$, de base $e_{\bar 0}, e_{\bar 1}, e_{\bar 2}$, a des sous-représentations de degré $1$. Avec $j = \frac{-1 + i\sqrt 3}2$, qui vérifie $j^3 = 1$, le vecteur $v = e_{\bar 0} + j\,e_{\bar 1} + j^2e_{\bar 2}$ vérifie
      $$\rho(\bar 1)v = e_{\bar 1} + j\,e_{\bar 2} + j^2e_{\bar 0} = j^2v :$$
      la droite $\mathbb Cv$ est stable, et $\bar 1$ y agit par la multiplication par $j^2$. De même, $s = e_{\bar 0} + e_{\bar 1} + e_{\bar 2}$ engendre une sous-représentation triviale.
    - |
      Pour la [[representation-permutation|représentation de permutation]] de $\lex{groupe-symetrique}{\mathfrak S_3}$, l'hyperplan $H = \{x_1 + x_2 + x_3 = 0\}$ porte une sous-représentation de degré $2$, de base $(e_1 - e_2, e_2 - e_3)$. La bijection $\sigma : 1 \mapsto 2 \mapsto 3 \mapsto 1$ envoie $e_1 - e_2$ sur $e_2 - e_3$, et $e_2 - e_3$ sur $e_3 - e_1 = -(e_1 - e_2) - (e_2 - e_3)$ : la matrice de $\rho_H(\sigma)$ dans cette base a pour lignes $(0, -1)$ et $(1, -1)$.
    - |
      Un sous-espace qui n'est pas stable ne porte pas de sous-représentation. Pour l'échange $S$ des deux vecteurs de base de $K^2$, représentation régulière de $\mathbb Z/2\mathbb Z$, la droite $Ke_1$ est envoyée sur $Ke_2$ : la restriction de $S$ n'est pas une application de $Ke_1$ dans lui-même. Plus loin, le théorème de Maschke ({{rp-maschke|Maschke}}, (i)) montre que, si $|G| \cdot 1_K \neq 0$, toute sous-représentation $W$ a un supplémentaire qui en est une aussi ; ici, pour $W = K(1, 1)$ et $2 \cdot 1_K \neq 0$, c'est $K(1, -1)$.

  representation-triviale:
    - |
      La représentation triviale apparaît dans toute [[representation-permutation|représentation de permutation]] : la droite $Ks$, où $s = \sum_x e_x$, est stable et chaque $\rho_X(g)$ y est l'identité (point (iii)). C'est aussi la représentation de permutation de l'unique action sur un ensemble $X$ à un seul élément, où $K^X$ est une droite.
    - |
      Être trivial dépend du corps. La signature de $\lex{groupe-symetrique}{\mathfrak S_n}$, vue dans $K$, définit une représentation de degré $1$ (point (iv)), qui n'est pas triviale si $n \geqslant 2$ et $2 \cdot 1_K \neq 0$, une transposition ayant pour signature $-1 \neq 1$. Sur $K = \lex{anneau-zn}{\mathbb Z/2\mathbb Z}$, où $-1 = 1$, elle est au contraire la représentation triviale.
    - |
      Sur $K^n$ avec $n \geqslant 2$, la représentation où $\rho(g) = \mathrm{id}$ pour tout $g$ n'est pas [[representation-irreductible|irréductible]] : tout sous-espace est stable. C'est la [[somme-directe-representations|somme directe]] de $n$ copies de la représentation triviale, une pour chaque droite $Ke_i$. Plus loin, le nœud {{rp-invariants|Invariants}}, (i), calcule la dimension du sous-espace des vecteurs fixés par tout le groupe, pour une représentation complexe quelconque, comme la moyenne de $g \mapsto \operatorname{tr}\rho(g)$ sur le groupe ; ici, elle vaut $n$.

  representation-permutation:
    - |
      Pour le groupe $\lex{anneau-zn}{\mathbb Z/2\mathbb Z}$ agissant sur $X = \{a, b\}$ par l'échange de $a$ et $b$, la représentation de permutation est $K^2$, où $\bar 1$ agit par la matrice $S$ de lignes $(0, 1)$ et $(1, 0)$. Le vecteur $s = e_a + e_b$ est fixe, et l'hyperplan $H$ est la droite engendrée par $e_a - e_b$, que $S$ envoie sur son opposé. Si $2 \cdot 1_K \neq 0$, ces deux droites sont distinctes et $K^2 = Ks \oplus H$, comme l'annonce (iii).
    - |
      Sans l'hypothèse $|X| \cdot 1_K \neq 0$ de (iii), la décomposition tombe. Sur $K = \mathbb Z/2\mathbb Z$, dans l'exemple précédent, $s = e_a + e_b$ a pour somme de coordonnées $1 + 1 = 0$, donc $s \in H$, et $H = Ks$. C'est même la seule droite stable : une droite stable est engendrée par un [[vecteur-propre|vecteur propre]] de $S$, qui a pour seule valeur propre $1$, puisque $\det(S - \lambda I_2) = \lambda^2 - 1 = (\lambda - 1)^2$ sur $\mathbb Z/2\mathbb Z$, et $S - I_2$, de lignes $(1, 1)$ et $(1, 1)$, a pour noyau $Ks$. Aucune décomposition $K^2 = Ks \oplus W$ en droites stables n'existe.
    - |
      Deux actions différentes peuvent donner la même représentation, à isomorphisme près. Le groupe $\lex{groupe-symetrique}{\mathfrak S_3}$ agit par conjugaison sur l'ensemble $T$ de ses trois transpositions, puisque $g \circ \tau_{xy} \circ g^{-1} = \tau_{g(x)g(y)}$ ({{a-groupe|Groupe}}, (iv)). L'application linéaire qui envoie $e_{\tau_{xy}}$ sur $e_z$, où $z$ est le point fixé par $\tau_{xy}$, est bijective et transforme $\rho_T(g)$ en $\rho_{\{1, 2, 3\}}(g)$, car $\tau_{g(x)g(y)}$ fixe $g(z)$ : c'est un [[isomorphisme-representations|isomorphisme]].

      Plus loin, le point (v) de {{rp-caracteres|Caractères}} montre que le caractère d'une représentation de permutation compte les points fixes ; ici, l'identité, une transposition et une bijection sans point fixe fixent $3$, $1$ et $0$ éléments de $\{1, 2, 3\}$, et autant de transpositions.

  degre-representation:
    - |
      Le degré compte une dimension, et il s'ajoute dans une somme directe. L'action de $\lex{groupe-symetrique}{\mathfrak S_3}$ sur $\{1, 2, 3\}$ donne une [[representation-permutation|représentation de permutation]] sur $K^3$, de degré $3$ ; la droite $Ks$ et l'hyperplan $H$ du point (iii) en sont des [[sous-representation|sous-représentations]], de degrés $1$ et $2$. Si $3 \cdot 1_K \neq 0$, on a $K^3 = Ks \oplus H$, et $3 = 1 + 2$, comme le veut (ii). La [[representation-reguliere|représentation régulière]] de $\mathfrak S_3$, sur l'espace de base $(e_h)_{h \in \mathfrak S_3}$, est de degré $6$ ({{a-groupe|Groupe}}, (iv)).
    - |
      Les représentations de degré $1$ sont des morphismes vers $K^\times$. Pour $G = \lex{anneau-zn}{\mathbb Z/4\mathbb Z}$ et $K = \lex{ensemble-complexes}{\mathbb C}$, une telle représentation est déterminée par $z = \rho(\bar 1)$, puisque $\rho(\bar k) = z^k$, et $z^4 = \rho(\bar 1 + \bar 1 + \bar 1 + \bar 1) = \rho(\bar 0) = 1$. Les solutions de $z^4 = 1$ sont $1$, $i$, $-1$ et $-i$, et il n'y en a pas d'autre ({{pol-racines|Racines}}, (iii)) ; chacune convient, $\bar k \mapsto z^k$ étant bien défini puisque $z^4 = 1$. Le groupe $\mathbb Z/4\mathbb Z$ a ainsi exactement quatre représentations complexes de degré $1$.
    - |
      Le degré ne détermine pas la représentation. La [[representation-triviale|représentation triviale]] de $\mathfrak S_3$ et la signature, $\sigma \mapsto \varepsilon(\sigma)\,\mathrm{id}_K$, sont toutes deux de degré $1$. Un [[isomorphisme-representations|isomorphisme]] de l'une sur l'autre serait la multiplication par un $c \neq 0$, qui commute à tout scalaire : il forcerait $\varepsilon(\sigma) = 1$ pour tout $\sigma$, alors qu'une transposition a pour signature $-1 \neq 1$ dès que $2 \cdot 1_K \neq 0$.

      Plus loin, le nœud {{rp-reguliere|Représentation régulière}} montre que les degrés $d_i$ des représentations irréductibles complexes vérifient $\sum d_i^2 = |G|$ ; pour $\mathfrak S_3$, ce sera $1 + 1 + 4 = 6$.

  isomorphisme-representations:
    - |
      Pour $G = \lex{anneau-zn}{\mathbb Z/2\mathbb Z}$, la [[representation-reguliere|représentation régulière]] sur $K^2$ échange les deux vecteurs de base : $\rho(\bar 1) = S$, de lignes $(0, 1)$ et $(1, 0)$. Si $2 \cdot 1_K \neq 0$, elle est isomorphe à la [[somme-directe-representations|somme directe]] de la [[representation-triviale|représentation triviale]] et de la représentation $\varepsilon$ de degré $1$ où $\varepsilon(\bar 1) = -1$. L'application $f(a, b) = (a + b, a - b)$ vérifie
      $$f(a, -b) = (a - b, a + b) = S\,f(a, b),$$
      c'est-à-dire $f \circ (\mathrm{id} \oplus \varepsilon)(\bar 1) = \rho(\bar 1) \circ f$, et elle est bijective, de déterminant $-2 \neq 0$.
    - |
      Sur un corps où $2 \cdot 1_K = 0$, l'isomorphisme disparaît. Sur $K = \mathbb Z/2\mathbb Z$, on a $-1 = 1$, et la somme directe de l'exemple précédent est la représentation de degré $2$ où $\bar 1$ agit par $I_2$. Un isomorphisme $f$ de celle-ci sur la représentation régulière donnerait $S = f \circ I_2 \circ f^{-1} = I_2$, ce qui est faux : les deux représentations, de même degré, ne sont pas isomorphes.
    - |
      Deux représentations de degré $1$ sont isomorphes si et seulement si elles sont égales, un isomorphisme étant la multiplication par un $c \neq 0$, qui commute aux scalaires. Pour $G = \mathbb Z/3\mathbb Z$ et $j = \frac{-1 + i\sqrt 3}2$, qui vérifie $j^3 = 1$ et $j \neq 1$, les représentations complexes $\bar k \mapsto j^k$ et $\bar k \mapsto j^{2k}$ ne sont donc pas isomorphes, bien que la conjugaison complexe échange $j$ et $j^2$. Plus loin, le point (iii) de {{rp-orthogonalite|Orthogonalité}} montre que deux représentations complexes de même caractère, $g \mapsto \operatorname{tr}\rho(g)$, sont isomorphes ; ici les caractères diffèrent déjà en $\bar 1$.

  somme-directe-representations:
    - |
      La somme directe de la [[representation-triviale|représentation triviale]] de $\lex{anneau-zn}{\mathbb Z/2\mathbb Z}$ et de la représentation $\varepsilon$ de degré $1$, où $\varepsilon(\bar 1) = -1$, est $K^2$, où $\bar 1$ agit par la matrice diagonale $\operatorname{diag}(1, -1)$. Son [[degre-representation|degré]] est $1 + 1 = 2$, et les deux axes de coordonnées y sont des sous-espaces stables, ce qui est la forme générale : $V \times \{0\}$ et $\{0\} \times V'$ sont toujours stables dans $V \times V'$.
    - |
      Une décomposition en sous-espaces stables est une somme directe de représentations. Pour la [[representation-permutation|représentation de permutation]] de $\lex{groupe-symetrique}{\mathfrak S_3}$ sur $K^3$, avec $3 \cdot 1_K \neq 0$, on a $K^3 = Ks \oplus H$, où $s = (1, 1, 1)$ et $H = \{x_1 + x_2 + x_3 = 0\}$ sont stables (point (iii)) ; par (ii), l'application $(w, w') \mapsto w + w'$ est un [[isomorphisme-representations|isomorphisme]] de la somme directe de $Ks$ et de $H$ sur $K^3$.
    - |
      Le supplémentaire doit être stable. Pour l'échange $S$ des deux vecteurs de base de $\lex{ensemble-complexes}{\mathbb C}^2$, la droite $W = \mathbb C(1, 1)$ est stable, et $W' = \mathbb Ce_1$ en est un supplémentaire, mais $Se_1 = e_2 \notin W'$ : $W'$ ne porte aucune représentation, et $\mathbb C^2 = W \oplus W'$ n'est pas une somme directe de représentations. Plus loin, le théorème de Maschke ({{rp-maschke|Maschke}}, (i)) fournit toujours un supplémentaire stable, ici $\mathbb C(1, -1)$.

  degre-extension:
    - |
      Le premier degré se calcule entièrement à la main. Dans $\lex{ensemble-reels}{\mathbb R}$, l'ensemble $M = \{a + b\sqrt 2 : a, b \in \mathbb Q\}$ est stable par somme et par produit, puisque
      $$\begin{aligned} &(a + b\sqrt 2)(c + d\sqrt 2) \\ &\quad = (ac + 2bd) + (ad + bc)\sqrt 2. \end{aligned}$$
      Pour $(a, b) \neq (0, 0)$, on a $a^2 - 2b^2 \neq 0$, sans quoi $b \neq 0$ et $(a/b)^2 = 2$, ce qu'exclut le point (i) de {{q-irrationnel|Irrationalité de √2}}. L'inverse $(a - b\sqrt 2)/(a^2 - 2b^2)$ est donc dans $M$, qui est le plus petit sous-corps contenant $\lex{ensemble-rationnels}{\mathbb Q}$ et $\sqrt 2$, c'est-à-dire $\lex{corps-engendre}{\mathbb Q(\sqrt 2)}$. La même irrationalité rend $(1, \sqrt 2)$ [[famille-libre|libre]] sur $\mathbb Q$ : $[\mathbb Q(\sqrt 2):\mathbb Q] = 2$.
    - |
      La multiplicativité se lit sur une base. Le réel $\sqrt 3$ n'est pas dans $M = \mathbb Q(\sqrt 2)$ : l'égalité $(a + b\sqrt 2)^2 = 3$, avec $a, b \in \mathbb Q$, donnerait $2ab = 0$ par liberté de $(1, \sqrt 2)$, puis $a^2 = 3$ ou $(2b)^2 = 6$. Or $p^2 = 3q^2$, avec $p \wedge q = 1$, force $3 \mid p$ par le lemme d'Euclide ({{z-premiers|Nombres premiers}}, (i)), puis $3 \mid q$ ; on raisonne de même avec $2$ pour $p^2 = 6q^2$.

      Le calcul du premier exemple, refait sur $M$ avec $\sqrt 3$, montre que $L = M(\sqrt 3) = \{u + v\sqrt 3 : u, v \in M\}$ est de degré $2$ sur $M$, de base $(1, \sqrt 3)$. Par l'énoncé du nœud, $(1, \sqrt 2, \sqrt 3, \sqrt 6)$ est une base de $L$ sur $\mathbb Q$, et $[L:\mathbb Q] = 2 \cdot 2 = 4$.
    - |
      Sur un corps de base à $q$ éléments, le degré détermine le cardinal : une [[dimension]] $n$ donne $q^n$ éléments, par les [[coordonnees-base|coordonnées]] dans une base. Sur $\lex{anneau-zn}{\mathbb Z/2\mathbb Z}$, la matrice $A = \begin{pmatrix} 0 & 1 \\ 1 & 1 \end{pmatrix}$ vérifie $A^2 = A + I$, donc $A(A + I) = I$.

      Les quatre matrices $0$, $I$, $A$ et $A + I$, combinaisons de $I$ et de $A$, forment donc un sous-anneau commutatif de $\lex{espace-matrices}{\mathcal M_2}(\mathbb Z/2\mathbb Z)$, dont les trois éléments non nuls sont inversibles : c'est un corps, extension du corps $\{0, I\}$, de base $(I, A)$, donc de degré $2$ et de cardinal $2^2$. Plus loin, le point (i) de {{gs-corps-finis|Corps finis}} montre que le cardinal d'un corps qui n'a qu'un nombre fini d'éléments est toujours ainsi une puissance d'un nombre premier.

  nombre-fermat-entier:
    - |
      Les premiers nombres de Fermat sont $F_0 = 3$, $F_1 = 5$, $F_2 = 17$, $F_3 = 257$ et $F_4 = 65\,537$, tous premiers, mais $F_5 = 2^{32} + 1$ est divisible par $641$, comme Euler l'a vu. On a $641 = 5 \cdot 2^7 + 1 = 5^4 + 2^4$ ; modulo $641$, la première écriture donne $5 \cdot 2^7 \equiv -1$, donc $5^4 \cdot 2^{28} \equiv 1$, et la seconde $2^4 \equiv -5^4$, d'où
      $$2^{32} = 2^4 \cdot 2^{28} \equiv -5^4 \cdot 2^{28} \equiv -1.$$
      Ainsi $641$ divise $F_5 = 641 \times 6\,700\,417$.
    - |
      Deux nombres de Fermat distincts sont [[premiers-entre-eux|premiers entre eux]]. Par récurrence, $F_0F_1 \cdots F_{n-1} = F_n - 2$ : c'est vrai pour $n = 1$, puisque $F_0 = 3 = F_1 - 2$, et
      $$(F_n - 2)F_n = 2^{2^{n+1}} - 1 = F_{n+1} - 2.$$
      Un diviseur commun de $F_m$ et de $F_n$, pour $m < n$, divise donc $2$ ; comme les $F_n$ sont impairs, il vaut $\pm 1$. Chaque $F_n$ ayant un diviseur premier, cela fournit une infinité de nombres premiers deux à deux distincts.
    - |
      Un nombre premier de la forme $2^m + 1$, avec $m \geqslant 1$, est un nombre de Fermat ({{gc-fermat|Nombres de Fermat}}, (ii)), et la preuve explique pourquoi les autres exposants échouent. Pour $m = 6 = 3 \cdot 2$, l'identité $x^3 + 1 = (x + 1)(x^2 - x + 1)$, appliquée à $x = 2^2$, donne $2^6 + 1 = 65 = 5 \cdot 13$, divisible par $2^2 + 1 = 5$. Pour $m = 12 = 3 \cdot 4$, de même, $2^4 + 1 = 17$ divise $2^{12} + 1 = 4\,097 = 17 \cdot 241$.
