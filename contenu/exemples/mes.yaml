# Exemples du lexique : théorie « Mesure, intégration » (mes).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  pi-systeme:
    - |
      Sur $\mathbb R$, les intervalles $]a, b]$ avec $a < b$, auxquels on ajoute $\varnothing$, forment un π-système, puisque
      $$]a, b] \cap\, ]c, d] = \,]\max(a, c), \min(b, d)]$$
      si $\max(a, c) < \min(b, d)$, et $\varnothing$ sinon. Sans la partie vide, ce n'est plus un π-système : $]0, 1] \cap\, ]1, 2] = \varnothing$. La partie vide est un détail, mais il faut l'ajouter explicitement.
    - |
      Le lemme d'unicité tombe si $\mathcal C$ n'est pas un π-système. Sur $X = \{1, 2, 3, 4\}$, muni de la tribu $\mathcal P(X)$, notons $\delta_k$ la mesure qui vaut $1$ sur les parties contenant $k$ et $0$ sur les autres ; elle est σ-additive, puisque, parmi des parties deux à deux disjointes, une seule au plus contient $k$. Les mesures $\mu = \delta_1 + \delta_3$ et $\nu = \delta_2 + \delta_4$ coïncident sur $\mathcal C = \{X, \{1, 2\}, \{2, 3\}\}$, où elles valent $2$, $1$ et $1$. La tribu engendrée par $\mathcal C$ est $\mathcal P(X)$, puisqu'elle contient $\{2\} = \{1, 2\} \cap \{2, 3\}$, puis $\{1\}$, $\{3\}$ et $\{4\}$. Pourtant $\mu(\{2\}) = 0$ et $\nu(\{2\}) = 1$ : il manque à $\mathcal C$ l'intersection $\{2\}$.
    - |
      Une [[tribu]] est un π-système, mais un π-système est beaucoup moins qu'une tribu. Sur $X = \{1, 2\}$, la partie $\{\varnothing, \{1\}, X\}$ est un π-système, puisque toutes les intersections de deux de ses éléments y sont, mais ce n'est pas une tribu : elle ne contient pas le complémentaire $\{2\}$ de $\{1\}$. Inversement, une [[classe-monotone|classe monotone]] qui est un π-système est une tribu. Elle contient les complémentaires $X \setminus A$, donc, avec les intersections finies, les réunions finies, et enfin, par réunion croissante, les réunions dénombrables. C'est ce qui permet au lemme de Dynkin de remplacer une tribu par une classe monotone.
