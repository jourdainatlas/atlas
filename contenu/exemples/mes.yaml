# Exemples du lexique : théorie « Mesure, intégration » (mes).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  tribu:
    - |
      Une intersection de tribus est une tribu ({{m-tribus|Tribus}}, (ii)), mais une réunion de tribus n'en est pas une en général. Sur $X = \{1, 2, 3\}$, les tribus $\mathcal A_1 = \{\varnothing, \{1\}, \{2, 3\}, X\}$ et $\mathcal A_2 = \{\varnothing, \{2\}, \{1, 3\}, X\}$ ont pour réunion une partie de $\lex{ensemble-parties}{\mathcal P}(X)$ qui contient $\{1\}$ et $\{2\}$, mais pas $\{1, 2\}$ : elle n'est pas stable par réunion. Leur intersection, elle, est la tribu $\{\varnothing, X\}$.
    - |
      La stabilité par réunion de deux éléments ne suffit pas à faire une tribu. Sur $\lex{ensemble-entiers-naturels}{\mathbb N}$, les parties finies et celles de complémentaire fini forment un ensemble $\mathcal F$ qui contient $\mathbb N$ et qui est stable par complémentaire. Il est stable par réunion de deux éléments : si l'un est de complémentaire fini, la réunion l'est aussi, et sinon elle est finie. Mais l'ensemble des entiers pairs est la réunion des singletons $\{2n\}$, qui sont dans $\mathcal F$, sans être fini ni de complémentaire fini : $\mathcal F$ n'est pas une tribu.
    - |
      L'image réciproque d'une tribu par une application est une tribu, puisque l'image réciproque commute avec le complémentaire et les réunions. Pour $f(x) = x^2$ sur $\lex{ensemble-reels}{\mathbb R}$, les parties $f^{-1}(B)$, où $B$ parcourt la [[tribu-borelienne|tribu borélienne]], forment donc une tribu sur $\mathbb R$. Toutes ses parties sont symétriques, puisque $f(-x) = f(x)$ : elle ne contient pas le segment $[0, 1]$, qui est pourtant borélien. Cette tribu ne retient de $x$ que sa [[valeur-absolue|valeur absolue]].

  tribu-borelienne:
    - |
      La tribu borélienne de $\lex{ensemble-reels}{\mathbb R}$ contient bien plus que les ouverts et les fermés. Un singleton $\{q\}$ est [[ferme|fermé]], son complémentaire $]{-\infty}, q[ \,\cup\, ]q, +\infty[$ étant [[ouvert]], et $\lex{ensemble-rationnels}{\mathbb Q}$, réunion des $\{q\}$ indexée par l'ensemble dénombrable $\mathbb Q$ ({{q-denombrable|ℚ est dénombrable}}), est borélien, comme son complémentaire. Pourtant $\mathbb Q$ n'est pas ouvert, puisqu'il ne contient aucun intervalle $]a, b[$ avec $a < b$, qui n'est pas dénombrable par l'argument de Cantor de {{su-segments|Segments emboîtés}}. Il n'est pas fermé non plus, puisque tout intervalle ouvert non vide rencontre $\mathbb Q$, qui est [[partie-dense|dense]].
    - |
      La tribu borélienne dépend de la [[topologie]], mais deux topologies distinctes peuvent avoir la même. Sur $X = \{a, b\}$, la topologie grossière $\{\varnothing, X\}$ a pour tribu borélienne $\{\varnothing, X\}$ elle-même. La topologie $\{\varnothing, \{a\}, X\}$ et la [[topologie-discrete|topologie discrète]] ont au contraire la même tribu borélienne, $\lex{ensemble-parties}{\mathcal P}(X)$, qui contient $\{b\}$ comme complémentaire de l'ouvert $\{a\}$. La tribu borélienne ne distingue plus les ouverts des fermés : $\{b\}$ y figure sans être ouvert pour la deuxième topologie.
    - |
      L'ensemble des points où converge une suite de fonctions continues $f_n : \mathbb R \to \mathbb R$ est borélien. Par le critère de Cauchy ({{ar-cauchy|Complétude}}), c'est
      $$\bigcap_{k} \bigcup_{N} \bigcap_{m, n \geqslant N} \Big\{|f_m - f_n| \leqslant \frac1{k+1}\Big\},$$
      où chaque ensemble $\{|f_m - f_n| \leqslant \varepsilon\}$ est fermé, image réciproque du fermé $[0, \varepsilon]$ par une fonction [[continuite|continue]]. Les réunions et les intersections sont indexées par $\lex{ensemble-entiers-naturels}{\mathbb N}$ ou par une partie de $\mathbb N^2$, donc au plus dénombrables ({{m-tribus|Tribus}}, (i)). Pour $f_n(x) = x^n$, on obtient $]{-1}, 1]$, qui n'est ni ouvert ni fermé.

  mesure:
    - |
      Les mesures sur $\lex{ensemble-parties}{\mathcal P}(\lex{ensemble-entiers-naturels}{\mathbb N})$ sont exactement les répartitions de poids. Pour toute suite $(p_n)$ de $\lex{demi-droite-achevee}{[0, +\infty]}$, l'application $\mu(A) = \sum_{n \in A} p_n$ est une mesure, par sommation par paquets ({{m-droite-achevee|Sommes dans [0, +∞]}}, (iv)). Réciproquement, une mesure $\mu$ sur $\mathcal P(\mathbb N)$ est de cette forme avec $p_n = \mu(\{n\})$, puisque toute partie $A$ est la réunion disjointe des singletons $\{n\}$, $n \in A$, famille indexée par une partie de $\mathbb N$. La mesure de comptage correspond à $p_n = 1$, la mesure de Dirac $\delta_0$ à $p_0 = 1$ et $p_n = 0$ sinon.
    - |
      L'additivité finie n'entraîne pas la σ-additivité. Sur $\mathcal P(\mathbb N)$, posons $\mu(A) = 0$ si $A$ est fini et $\mu(A) = +\infty$ sinon. Pour $A$ et $B$ disjoints, $A \cup B$ est infini si et seulement si l'un des deux l'est, donc $\mu(A \cup B) = \mu(A) + \mu(B)$ ; mais $\mathbb N$ est la réunion disjointe des singletons $\{n\}$, et $\mu(\mathbb N) = +\infty$ alors que $\sum_n \mu(\{n\}) = 0$. Ce n'est pas une mesure, et aucune mesure sur $\mathcal P(\mathbb N)$ n'est nulle sur tous les singletons sans être nulle.
    - |
      La formule d'inclusion-exclusion d'une mesure s'écrit sans soustraction : $\mu(A \cup B) + \mu(A \cap B) = \mu(A) + \mu(B)$ pour tous $A, B$ mesurables. Les deux membres valent en effet $\mu(A \setminus B) + \mu(B \setminus A) + 2\mu(A \cap B)$, par additivité. La forme $\mu(A \cup B) = \mu(A) + \mu(B) - \mu(A \cap B)$ demande au contraire $\mu(A \cap B) < +\infty$ : pour la mesure de comptage sur $\mathbb N$, avec $A = \mathbb N$ et $B$ l'ensemble des entiers pairs, le second membre serait $(+\infty) + (+\infty) - (+\infty)$, qui n'a pas de sens.

  negligeable:
    - |
      Être négligeable dépend de la [[mesure]], et un ensemble négligeable peut être très gros. Pour la mesure de Dirac $\delta_x$ sur $\lex{ensemble-parties}{\mathcal P}(X)$, qui vaut $1$ sur les parties contenant $x$ et $0$ sur les autres ({{m-mesures|Mesures}}, remarque), les parties négligeables sont celles qui ne contiennent pas $x$, à commencer par $X \setminus \{x\}$. Pour la mesure de comptage, au contraire, seule la partie vide est négligeable, et pour la mesure nulle, toutes les parties le sont.
    - |
      Une partie d'un ensemble négligeable n'est pas toujours négligeable, faute d'être mesurable. Sur $X = \{1, 2, 3\}$, muni de la [[tribu]] $\mathcal A = \{\varnothing, \{1, 2\}, \{3\}, X\}$ et de la mesure $\mu$ qui vaut $1$ sur les éléments contenant $3$ et $0$ sur les autres, la partie $\{1, 2\}$ est négligeable. La partie $\{1\}$, qu'elle contient, n'appartient pas à $\mathcal A$ : $\mu(\{1\})$ n'est pas défini, et $\{1\}$ n'est pas négligeable au sens de la définition, qui exige l'appartenance à la tribu.
    - |
      Une réunion d'une suite d'ensembles négligeables est négligeable, par sous-additivité ({{m-mesures|Mesures}}, (ii)) : sa mesure est majorée par $\sum_n 0 = 0$. La réunion d'une famille non dénombrable n'a pas de raison de l'être. Plus loin, pour la mesure de Lebesgue, chaque singleton de $\lex{ensemble-reels}{\mathbb R}$ sera négligeable, alors que $\mathbb R$, réunion de ses singletons, ne le sera pas ({{m-lebesgue|Mesure de Lebesgue}}, (iv)).

  presque-partout:
    - |
      « Presque partout » dépend de la [[mesure]], et peut dire très peu ou tout. Pour la mesure de Dirac $\delta_0$ sur $\lex{ensemble-parties}{\mathcal P}(\lex{ensemble-reels}{\mathbb R})$, une propriété est vraie presque partout si et seulement si elle est vraie en $0$, la partie $\mathbb R \setminus \{0\}$ étant [[negligeable|négligeable]] ; deux fonctions sont donc égales presque partout dès qu'elles coïncident en $0$. Pour la mesure de comptage, au contraire, seule la partie vide est négligeable, et « presque partout » signifie « partout ».
    - |
      Une suite de propriétés vraies presque partout est vraie simultanément presque partout, mais pas une famille non dénombrable. Le premier fait vient de la sous-additivité : la réunion d'une suite de négligeables est négligeable. Pour le second, munissons $\mathbb R$ de la tribu des parties au plus dénombrables ou de complémentaire au plus dénombrable, et de la mesure $\mu$ qui vaut $0$ sur les premières et $1$ sur les secondes ; c'est une mesure ⋆, puisque deux parties de complémentaire au plus dénombrable se rencontrent et qu'une réunion d'une suite de parties au plus dénombrables l'est encore ([[choix-denombrable|choix dénombrable]]).

      Pour chaque réel $t$, la fonction $\mathbf 1_{\{t\}}$ est nulle presque partout, puisque $\mu(\{t\}) = 0$. Pourtant, en aucun point $x$ toutes ces fonctions ne sont nulles, puisque $\mathbf 1_{\{x\}}(x) = 1$.
    - |
      La définition demande que la propriété soit vraie hors d'un négligeable, non que l'ensemble où elle tombe soit mesurable. Sur $X = \{a, b, c\}$, muni de la [[tribu]] $\{\varnothing, \{a\}, \{b, c\}, X\}$ et de la mesure qui vaut $1$ sur les éléments contenant $a$ et $0$ sur les autres, la fonction $f$ égale à $1$ en $b$ et à $0$ ailleurs est nulle presque partout, hors du négligeable $\{b, c\}$. L'ensemble $\{f \neq 0\} = \{b\}$ n'est pourtant pas dans la tribu. Plus loin, les mesures complètes, où toute partie d'un négligeable est mesurable, effaceront cette nuance ({{m-caratheodory|Carathéodory}}).

  mesure-exterieure:
    - |
      Une mesure extérieure peut n'avoir presque aucune partie mesurable. Sur un ensemble $X$ ayant au moins deux éléments, posons $\mu^*(\varnothing) = 0$ et $\mu^*(A) = 1$ pour $A$ non vide. C'est une mesure extérieure : elle est croissante, et si la réunion des $A_n$ n'est pas vide, l'un des $A_n$ ne l'est pas, ce qui donne la sous-additivité. Mais pour $A \neq \varnothing, X$ et $E = X$, on trouve $\mu^*(E \cap A) + \mu^*(E \setminus A) = 2 \neq 1$ : seules $\varnothing$ et $X$ sont [[partie-mesurable-exterieure|$\mu^*$-mesurables]], et le théorème de Carathéodory ne produit que la tribu $\{\varnothing, X\}$.
    - |
      La sous-additivité doit être dénombrable, et pas seulement finie. Sur $\lex{ensemble-entiers-naturels}{\mathbb N}$, l'application qui vaut $0$ sur les parties finies et $1$ sur les parties infinies est croissante, nulle en $\varnothing$, et vérifie $\mu^*(A \cup B) \leqslant \mu^*(A) + \mu^*(B)$, puisqu'une réunion de deux parties finies est finie. Elle n'est pas une mesure extérieure : $\mathbb N$ est la réunion des singletons $\{n\}$, et $\mu^*(\mathbb N) = 1 > \sum_n \mu^*(\{n\}) = 0$.
    - |
      Une [[mesure]] sur une tribu finie induit une mesure extérieure, qui n'est plus additive. Sur $X = \{1, 2, 3\}$ muni de $\mathcal A = \{\varnothing, \{1\}, \{2, 3\}, X\}$ et de la mesure $\mu$ qui vaut $1$ en $\{1\}$ et en $\{2, 3\}$, posons $\mu^*(A) = \min\{\mu(B) : B \in \mathcal A,\ B \supset A\}$, minimum d'un ensemble fini. Elle est croissante, et sous-additive, le plus petit élément de $\mathcal A$ contenant $A \cup A'$ étant contenu dans la réunion de ceux qui contiennent $A$ et $A'$ ; pour une suite, $X$ étant fini, la réunion est celle d'un nombre fini de termes. Ici $\mu^*(\{2\}) = \mu^*(\{3\}) = \mu^*(\{2, 3\}) = 1$, et les parties $\mu^*$-mesurables sont exactement celles de $\mathcal A$ : le critère de Carathéodory restitue la tribu d'origine.

  mesure-lebesgue:
    - |
      Une partie dense peut être de mesure nulle, et son complémentaire, qui ne contient aucun intervalle, de mesure pleine. Le segment $[0, 1]$ est la réunion disjointe de $]0, 1]$ et du singleton $\{0\}$, qui est [[negligeable|négligeable]] ({{m-lebesgue|Mesure de Lebesgue}}, (iv)), donc $\lambda([0, 1]) = 1$. La partie $\lex{ensemble-rationnels}{\mathbb Q} \cap [0, 1]$, au plus dénombrable, est négligeable par le même point, et l'additivité donne $\lambda([0, 1] \setminus \mathbb Q) = 1$ : au sens de la mesure, presque tout réel de $[0, 1]$ est irrationnel.
    - |
      Une partie non bornée de $\lex{ensemble-reels}{\mathbb R}$ peut avoir une mesure finie. Les intervalles $[n, n + 2^{-n}[$, pour $n \in \lex{ensemble-entiers-naturels}{\mathbb N}$, sont deux à deux disjoints, et chacun a pour mesure $2^{-n}$, ses extrémités étant négligeables. Leur réunion $E$ n'est majorée par aucun réel, et pourtant, par σ-additivité,
      $$\lambda(E) = \sum_{n \in \mathbb N} 2^{-n} = 2.$$
      ```schema lex-mesure-lebesgue-2
      Les intervalles $[n, n + 2^{-n}[$, pour $n$ de $0$ à $5$, alternativement en rouge et en bleu, les deux premiers étant contigus : chacun est deux fois plus court que le précédent. La réunion de tous ces intervalles s'étend jusqu'à l'infini, mais leurs longueurs ont pour somme $2$.
      ```
    - |
      L'invariance par translation ne caractérise pas $\lambda$ sans une condition de finitude. Si $\mu$ est une mesure sur la [[tribu-borelienne|tribu borélienne]], invariante par translation, avec $\mu(]0, 1]) = c < +\infty$, les $n$ translatés de $]0, \frac1n]$ qui partitionnent $]0, 1]$ donnent $\mu(]0, \frac1n]) = \frac cn$, puis $\mu(]a, b]) = c(b - a)$ pour $a < b$ rationnels. La continuité croissante et décroissante étend cette égalité aux réels $a < b$, et le lemme de Dynkin ({{m-dynkin|Classes monotones}}, (ii)), avec $X_n = \,]{-n}, n]$, donne $\mu = c\lambda$. La mesure de comptage, qui associe à une partie son nombre d'éléments ou $+\infty$, est invariante par translation, mais n'est multiple de $\lambda$ par aucun $c$ de $[0, +\infty]$ : elle donne $1$ à un singleton.

  fonction-mesurable:
    - |
      Pour une [[tribu]] finie, les fonctions mesurables sont celles qui sont constantes sur chaque atome. Sur $X = \{1, 2, 3, 4\}$ muni de $\mathcal A = \{\varnothing, \{1, 2\}, \{3, 4\}, X\}$, une fonction réelle $f$ est mesurable si et seulement si $f(1) = f(2)$ et $f(3) = f(4)$. Si $f(1) < f(2)$, par exemple, l'ensemble $\{f > f(1)\}$ contient $2$ sans contenir $1$, et n'est pas dans $\mathcal A$ ; réciproquement, si $f$ est constante sur $\{1, 2\}$ et sur $\{3, 4\}$, chaque $\{f > a\}$ est une réunion de ces deux parties. La mesurabilité traduit l'information que porte la tribu : $f$ ne peut pas distinguer $1$ de $2$.
    - |
      Une borne supérieure d'une famille non dénombrable de fonctions mesurables n'est pas toujours mesurable. Munissons $\lex{ensemble-reels}{\mathbb R}$ de la tribu des parties au plus dénombrables ou de complémentaire au plus dénombrable, qui en est une grâce au [[choix-denombrable|choix dénombrable]] ⋆. Chaque indicatrice $\mathbf 1_{\{t\}}$ est mesurable, mais $\sup_{t \in [0, 1]} \mathbf 1_{\{t\}} = \mathbf 1_{[0, 1]}$ ne l'est pas, puisque ni $[0, 1]$ ni son complémentaire ne sont au plus dénombrables ({{su-segments|Segments emboîtés}}, remarque). Le point (ii) de {{m-mesurables|Fonctions mesurables}} porte sur des suites, et c'est essentiel.
    - |
      Il suffit de tester la définition sur les seuils rationnels : $f$ est mesurable dès que $\{f > r\}$ est mesurable pour tout $r \in \lex{ensemble-rationnels}{\mathbb Q}$. Pour $a$ réel, en effet, $f(x) > a$ si et seulement s'il existe un rationnel $r$ tel que $f(x) > r > a$, par [[partie-dense|densité]] de $\mathbb Q$, ce qui s'écrit
      $$\{f > a\} = \bigcup_{r \in \mathbb Q,\ r > a} \{f > r\},$$
      réunion indexée par une partie de l'ensemble dénombrable $\mathbb Q$ ({{q-denombrable|ℚ est dénombrable}}). L'égalité vaut aussi lorsque $f$ prend la valeur $+\infty$.

  fonction-etagee:
    - |
      Une fonction étagée n'est pas une [[fonction-escalier|fonction en escalier]]. Sur $\lex{ensemble-reels}{\mathbb R}$ muni de sa [[tribu-borelienne|tribu borélienne]], l'indicatrice $\mathbf 1_{\mathbb Q}$ est étagée, puisqu'elle ne prend que les valeurs $0$ et $1$ et que $\lex{ensemble-rationnels}{\mathbb Q}$, réunion dénombrable de singletons fermés, est borélien ; elle n'est constante sur aucun intervalle non réduit à un point, et n'est donc en escalier sur aucun segment. À l'inverse, la [[partie-entiere|partie entière]] est borélienne mais n'est pas étagée sur $\mathbb R$, où elle prend une infinité de valeurs ; restreinte au segment $[0, 3]$, elle est à la fois étagée et en escalier.
    - |
      Ne prendre qu'un nombre fini de valeurs ne suffit pas : il faut aussi la mesurabilité. Sur $X = \{a, b\}$ muni de la tribu $\{\varnothing, X\}$, la fonction égale à $1$ en $a$ et à $0$ en $b$ ne prend que deux valeurs, mais elle n'est pas étagée, puisque $\{f > 0\} = \{a\}$ n'est pas dans la tribu. Seules les constantes sont étagées sur cet espace.
    - |
      Une limite de fonctions étagées n'est en général pas étagée, et l'approximation n'est uniforme que là où la fonction est bornée. Sur $\mathbb R$, la fonction $f$ égale à $\frac1x$ sur $]0, 1]$ et à $0$ ailleurs est la limite de la suite $(s_n)$ du nœud {{m-etagees|Fonctions étagées}}, qui vaut $n$ sur $]0, \frac1n]$. Pour tout $n$, la différence $f - s_n$ n'est pas bornée, puisqu'elle vaut $\frac1x - n$ près de $0$. Au contraire, pour la fonction bornée $g$ égale à $x$ sur $[0, 1]$ et à $0$ ailleurs, on a $0 \leqslant g - s_n < 2^{-n}$ dès que $n \geqslant 1$.

  integrale-lebesgue:
    - |
      Pour une mesure de Dirac, l'intégrale est l'évaluation : $\int f \, d\delta_a = f(a)$ pour toute fonction mesurable $f \geqslant 0$ sur $\lex{ensemble-parties}{\mathcal P}(X)$. Une [[fonction-etagee|fonction étagée]] $s$ telle que $0 \leqslant s \leqslant f$ a pour intégrale $s(a)\,\delta_a(\{s = s(a)\}) = s(a)$, puisque les autres parties de son [[ecriture-canonique|écriture canonique]] ne contiennent pas $a$ ; la borne supérieure est donc au plus $f(a)$. Elle est atteinte par $f(a)\,\mathbf 1_{\{a\}}$ si $f(a)$ est fini, et vaut $+\infty$ si $f(a) = +\infty$, les fonctions $n\,\mathbf 1_{\{a\}}$ étant majorées par $f$.
    - |
      Pour une [[mesure]] sur $\mathcal P(\lex{ensemble-entiers-naturels}{\mathbb N})$, de poids $p_n = \mu(\{n\})$, l'intégrale est une somme : $\int f \, d\mu = \sum_n f(n)\,p_n$. Une fonction étagée $s$ telle que $0 \leqslant s \leqslant f$ a pour intégrale $\sum_i c_i \sum_{n \in A_i} p_n = \sum_n s(n)\,p_n$, par sommation par paquets, et cette somme est au plus $\sum_n f(n)\,p_n$. Les étagées $\min(f, N)\,\mathbf 1_{\{0, \dots, N - 1\}}$ ont pour intégrales les sommes $\sum_{n < N} \min(f(n), N)\,p_n$, qui croissent vers cette somme, chaque terme $\min(f(n), N)\,p_n$ croissant vers $f(n)\,p_n$. Pour $p_n = 2^{-n-1}$ et $f(n) = n$, on trouve
      $$\int f \, d\mu = \sum_{n \in \mathbb N} \frac{n}{2^{n+1}} = 1.$$
    - |
      L'intégrale s'approche par en dessous, et l'approximation par au-dessus échouerait. Pour la mesure de comptage sur $\mathcal P(\mathbb N)$ et $f(n) = 2^{-n}$, on a $\int f = \sum_n 2^{-n} = 2$. Mais une fonction étagée $t \geqslant f$ ne prend qu'un nombre fini de valeurs, toutes strictement positives puisque $f > 0$ ; la plus petite, $c > 0$, minore $t$ sur $\mathbb N$, et $\int t \geqslant c \cdot (+\infty) = +\infty$. La borne inférieure des intégrales des étagées qui majorent $f$ vaut donc $+\infty$, et non $2$.

  integrable-lebesgue:
    - |
      Pour la mesure de comptage sur $\lex{ensemble-parties}{\mathcal P}(\lex{ensemble-entiers-naturels}{\mathbb N})$, une suite réelle $(f(n))$ est intégrable si et seulement si $\sum_n |f(n)| < +\infty$, puisque $\int g = \sum_n g(n)$ pour $g \geqslant 0$, par convergence monotone ({{m-beppo-levi|Convergence monotone}}, (ii)) appliquée à $g = \sum_n g(n)\,\mathbf 1_{\{n\}}$. La suite $f(n) = \frac{(-1)^n}{n+1}$ ne l'est pas. Sa partie positive a pour somme $\sum_k \frac1{2k+1}$, qui majore $\frac12 \sum_k \frac1{k+1}$, infinie : les paquets des $k$ tels que $2^j \leqslant k + 1 < 2^{j+1}$ ont chacun une somme au moins égale à $\frac12$ ({{m-droite-achevee|Sommes dans [0, +∞]}}, (iv)), et sa partie négative $\sum_k \frac1{2k+2}$ est infinie elle aussi : la différence $\int f^+ - \int f^-$ serait $(+\infty) - (+\infty)$, et l'intégrale n'est pas définie.
    - |
      Sur un espace de mesure finie, toute fonction mesurable bornée est intégrable, mais une fonction partout finie peut ne pas l'être. Munissons $\mathcal P(\mathbb N)$ de la mesure $\mu$ de poids $\mu(\{n\}) = 2^{-n-1}$, de masse totale $1$ ; par convergence monotone, comme ci-dessus, l'intégrale d'une fonction positive $g$ est $\sum_n g(n)\,2^{-n-1}$. La fonction $f(n) = (-1)^n$, bornée, est intégrable, avec
      $$\begin{aligned} \int f \, d\mu &= \sum_{k} 2^{-2k-1} - \sum_{k} 2^{-2k-2} \\ &= \frac23 - \frac13 = \frac13. \end{aligned}$$
      La fonction $g(n) = 2^n$, qui ne prend que des valeurs finies, ne l'est pas : $\int g \, d\mu = \sum_n \frac12 = +\infty$.
    - |
      La définition demande que $f$ soit mesurable, et pas seulement $|f|$. Sur $X = \{a, b\}$ muni de la [[tribu]] $\{\varnothing, X\}$ et de la mesure qui vaut $1$ en $X$, la fonction $f$ égale à $1$ en $a$ et à $-1$ en $b$ vérifie $|f| = 1$, mesurable et d'intégrale $1$. Mais $f$ n'est pas mesurable, puisque $\{f > 0\} = \{a\}$ n'est pas dans la tribu, et $f^+ = \mathbf 1_{\{a\}}$ n'a pas d'intégrale : $f$ n'est pas intégrable.

  mesure-produit:
    - |
      Le produit de deux mesures de comptage est la mesure de comptage du produit. Sur $\lex{ensemble-entiers-naturels}{\mathbb N}$, muni de $\lex{ensemble-parties}{\mathcal P}(\mathbb N)$ et de la mesure de comptage $\nu$, qui est [[mesure-sigma-finie|σ-finie]], la mesure de comptage de $\mathbb N^2$ donne au pavé $A \times B$ la valeur $\nu(A)\,\nu(B)$ : le produit des nombres d'éléments, ou $+\infty$, avec la convention $0 \cdot (+\infty) = 0$ quand l'un des facteurs est vide. Par unicité ({{m-produit|Mesure produit}}, (iii)), elle est égale à $\nu \otimes \nu$ sur la [[tribu-produit|tribu produit]], qui est ici $\mathcal P(\mathbb N^2)$, toute partie étant une réunion au plus dénombrable de singletons $\{(m, n)\} = \{m\} \times \{n\}$.
    - |
      La formule des sections calcule la mesure produit d'une partie qui n'est pas un pavé. Sur $X = \{1, \dots, 6\}$, muni de la mesure $\mu$ qui donne le poids $\frac16$ à chaque point, la partie $E = \{(x, y) : x + y = 7\}$ de $X^2$ a pour sections $E_x = \{7 - x\}$, de mesure $\frac16$. Le point (iii) de {{m-produit|Mesure produit}} donne
      $$(\mu \otimes \mu)(E) = \int_X \mu(E_x)\,d\mu(x) = \frac16,$$
      la fonction intégrée étant constante. On trouve la même valeur en sommant les poids $\frac1{36}$ des six points de $E$, chaque singleton $\{(x, y)\}$ étant le pavé $\{x\} \times \{y\}$, de mesure $\frac16 \cdot \frac16$.
    - |
      Le produit par une mesure de Dirac mesure une section : $(\mu \otimes \delta_b)(E) = \mu(E^b)$ pour $\mu$ σ-finie et $Y$ muni de $\mathcal P(Y)$, sur lequel $\delta_b$ est définie. La formule (iii) donne $\int_Y \mu(E^y)\,d\delta_b(y)$, et l'intégrale d'une fonction positive $g$ pour $\delta_b$ vaut $g(b)$. Une [[fonction-etagee|fonction étagée]] $s$ telle que $0 \leqslant s \leqslant g$ a en effet pour intégrale $s(b)$, et $g(b)\,\mathbf 1_{\{b\}}$, ou $n\,\mathbf 1_{\{b\}}$ si $g(b) = +\infty$, atteint la borne. Pour la mesure de comptage $\mu$ sur $\mathbb N$ et $E = \{(m, n) : m \leqslant n\}$, on obtient $(\mu \otimes \delta_b)(E) = b + 1$.

  demi-droite-achevee:
    - |
      La sommation par paquets montre, sans aucune notion de convergence, que $\sum_{n \in \mathbb N} \frac1{n+1} = +\infty$. Pour $k \in \lex{ensemble-entiers-naturels}{\mathbb N}$, soit $I_k$ l'ensemble des $n$ tels que $2^k \leqslant n + 1 < 2^{k+1}$. Ces ensembles partitionnent $\mathbb N$, et $I_k$ compte $2^k$ entiers, dont chacun donne un terme $\frac1{n+1} > 2^{-k-1}$ : chaque paquet a une somme au moins égale à $\frac12$.
      ```schema lex-demi-droite-achevee-1
      Les termes $\frac1{n+1}$, pour $n$ de $0$ à $14$, sont groupés en paquets $I_0$, $I_1$, $I_2$ et $I_3$ de $1$, $2$, $4$ et $8$ termes. Dans chaque paquet, toute barre dépasse le niveau pointillé $2^{-k-1}$, si bien que chaque paquet pèse au moins $\frac12$.
      ```
      Par le point (iv) de {{m-droite-achevee|Sommes dans [0, +∞]}}, la somme totale est celle des sommes des paquets, que le point (iii) minore par $\frac N2$ pour tout entier $N$ : elle vaut $+\infty$, puisque $\lex{ensemble-reels}{\mathbb R}$ est [[archimedien]]. À l'inverse, $\sum_n 2^{-n-1} = 1$, borne supérieure des sommes partielles $1 - 2^{-N}$.
    - |
      Pour des termes de signe quelconque, la définition par la borne supérieure perd son sens, et la sommation par paquets tombe. Prenons $a_n = (-1)^n$. Les parties finies formées d'entiers pairs donnent des sommes $\sum_{n \in F} a_n$ arbitrairement grandes, et la borne supérieure de la définition vaudrait $+\infty$. Les paquets $\{2k, 2k + 1\}$ ont chacun une somme nulle, d'où un total nul ; les paquets $\{0\}$ et $\{2k - 1, 2k\}$, pour $k \geqslant 1$, donnent au contraire $1 + 0 + 0 + \cdots = 1$. Le total dépend du découpage, ce que le point (iv) exclut pour des termes positifs.
    - |
      Une famille de termes positifs indexée par un ensemble quelconque a toujours une somme, mais une somme finie ne laisse qu'un nombre fini de termes au-dessus de chaque seuil. Si $\sum_{i \in I} a_i = S < +\infty$ et $\varepsilon > 0$, toute partie $F$ de $\{i \in I : a_i \geqslant \varepsilon\}$ à $p$ éléments vérifie $p\,\varepsilon \leqslant \sum_{i \in F} a_i \leqslant S$. Cet ensemble a donc au plus $S/\varepsilon$ éléments. Ainsi $\sum_{x \in [0, 1]} x = +\infty$, puisque les réels de $[\frac12, 1]$, en nombre infini, dépassent tous le seuil $\frac12$, alors que chaque terme est fini.

  espace-fonctions-integrables:
    - |
      L'espace des fonctions intégrables dépend de la mesure, et peut contenir toutes les fonctions. Pour la mesure de Dirac $\delta_a$ sur $\lex{ensemble-parties}{\mathcal P}(X)$, toute fonction réelle $f$ est mesurable et $\int |f| \, d\delta_a = |f(a)|$ est fini. Les fonctions étagées $s_n$ du nœud {{m-etagees|Fonctions étagées}}, qui croissent vers $|f|$, ont en effet pour intégrales $s_n(a)$, qui croissent vers $|f(a)|$, et l'on conclut par convergence monotone ({{m-beppo-levi|Convergence monotone}}). Ainsi $\mathcal L^1(\delta_a)$ est l'ensemble de toutes les fonctions réelles sur $X$, et l'intégrale y est l'évaluation $f \mapsto f^+(a) - f^-(a) = f(a)$. Pour la mesure de comptage sur un ensemble fini, de même, toute fonction est intégrable, d'intégrale la somme de ses valeurs.
    - |
      L'espace $\mathcal L^1(\mu)$ est stable par addition, mais pas par produit. Sur $\mathcal P(\lex{ensemble-entiers-naturels}{\mathbb N})$ muni de la mesure de poids $2^{-n-1}$, l'intégrale d'une fonction $g \geqslant 0$ est $\sum_n g(n)\,2^{-n-1}$, par convergence monotone ({{m-beppo-levi|Convergence monotone}}, (ii)) appliquée à $g = \sum_n g(n)\,\mathbf 1_{\{n\}}$. La fonction $f(n) = (\frac32)^n$ est donc intégrable, avec $\int f = \frac12 \sum_n (\frac34)^n = 2$. Son carré ne l'est pas, puisque
      $$\int f^2 = \frac12 \sum_{n \in \mathbb N} \Big(\frac98\Big)^n = +\infty.$$
      Le produit de deux fonctions intégrables n'est donc pas toujours intégrable, même pour une mesure finie.
    - |
      Deux fonctions distinctes mais égales [[presque-partout|presque partout]] restent deux éléments distincts de $\mathcal L^1(\mu)$, de même intégrale ({{m-integrables|Fonctions intégrables}}, (iii)). Pour $\delta_0$ sur $\mathcal P(\lex{ensemble-reels}{\mathbb R})$, la fonction nulle et l'indicatrice de $\mathbb R \setminus \{0\}$ diffèrent sur un ensemble immense, et ont toutes deux une intégrale nulle. Plus loin, l'{{anf|analyse fonctionnelle}} les identifie dans l'espace quotient $L^1(\mu)$, où $\int |f| \, d\mu$ devient une norme.

  pi-systeme:
    - |
      Sur $\mathbb R$, les intervalles $]a, b]$ avec $a < b$, auxquels on ajoute $\varnothing$, forment un π-système, puisque
      $$]a, b] \cap\, ]c, d] = \,]\max(a, c), \min(b, d)]$$
      si $\max(a, c) < \min(b, d)$, et $\varnothing$ sinon. Sans la partie vide, ce n'est plus un π-système : $]0, 1] \cap\, ]1, 2] = \varnothing$. La partie vide est un détail, mais il faut l'ajouter explicitement.
    - |
      Le lemme d'unicité tombe si $\mathcal C$ n'est pas un π-système. Sur $X = \{1, 2, 3, 4\}$, muni de la tribu $\mathcal P(X)$, notons $\delta_k$ la mesure qui vaut $1$ sur les parties contenant $k$ et $0$ sur les autres ; elle est σ-additive, puisque, parmi des parties deux à deux disjointes, une seule au plus contient $k$. Les mesures $\mu = \delta_1 + \delta_3$ et $\nu = \delta_2 + \delta_4$ coïncident sur $\mathcal C = \{X, \{1, 2\}, \{2, 3\}\}$, où elles valent $2$, $1$ et $1$. La tribu engendrée par $\mathcal C$ est $\mathcal P(X)$, puisqu'elle contient $\{2\} = \{1, 2\} \cap \{2, 3\}$, puis $\{1\}$, $\{3\}$ et $\{4\}$. Pourtant $\mu(\{2\}) = 0$ et $\nu(\{2\}) = 1$ : il manque à $\mathcal C$ l'intersection $\{2\}$.
    - |
      Une [[tribu]] est un π-système, mais un π-système est beaucoup moins qu'une tribu. Sur $X = \{1, 2\}$, la partie $\{\varnothing, \{1\}, X\}$ est un π-système, puisque toutes les intersections de deux de ses éléments y sont, mais ce n'est pas une tribu : elle ne contient pas le complémentaire $\{2\}$ de $\{1\}$. Inversement, une [[classe-monotone|classe monotone]] qui est un π-système est une tribu. Elle contient les complémentaires $X \setminus A$, donc, avec les intersections finies, les réunions finies, et enfin, par réunion croissante, les réunions dénombrables. C'est ce qui permet au lemme de Dynkin de remplacer une tribu par une classe monotone.

  classe-monotone:
    - |
      Une classe monotone n'est pas toujours une [[tribu]]. Sur $X = \{1, 2, 3, 4\}$, les parties ayant un nombre pair d'éléments forment une classe monotone $\mathcal D$. Elle contient $X$ ; si $A \subset B$ sont dans $\mathcal D$, $B \setminus A$ a un nombre d'éléments pair, différence de deux nombres pairs ; enfin une suite croissante de parties de $X$ est stationnaire, le nombre de ses éléments étant une suite croissante d'entiers majorée par $4$, et sa réunion est l'une d'elles. Mais $\{1, 2\} \cap \{2, 3\} = \{2\}$ et $\{1, 2\} \cup \{2, 3\} = \{1, 2, 3\}$ ne sont pas dans $\mathcal D$.
    - |
      Le lemme de Dynkin tombe si les générateurs ne forment pas un [[pi-systeme|π-système]]. Sur $X = \{1, 2, 3, 4\}$, la classe monotone engendrée par $\mathcal C = \{\{1, 2\}, \{2, 3\}\}$ est contenue dans la classe $\mathcal D$ des parties ayant un nombre pair d'éléments, qui est une classe monotone contenant $\mathcal C$. Elle ne contient donc pas $\{2\}$, alors que $\sigma(\mathcal C)$ le contient, comme $\{1, 2\} \cap \{2, 3\}$. Elle est même réduite aux six parties $\varnothing$, $X$, $\{1, 2\}$, $\{2, 3\}$, $\{3, 4\}$ et $\{1, 4\}$, quand $\sigma(\mathcal C) = \lex{ensemble-parties}{\mathcal P}(X)$ en a seize.
    - |
      Une classe monotone est stable par réunion de deux parties disjointes, à défaut de l'être par réunion quelconque. Si $A$ et $B$ sont disjoints dans une classe monotone $\mathcal M$, alors $X \setminus A \in \mathcal M$, puis $(X \setminus A) \setminus B \in \mathcal M$, puisque $B \subset X \setminus A$, et enfin son complémentaire $A \cup B$. Par récurrence et réunion croissante, $\mathcal M$ contient la réunion de toute suite de parties deux à deux disjointes : c'est la part de la σ-additivité qu'une classe monotone retient. Elle suffit pour que l'ensemble des parties où deux [[mesure-finie|mesures finies]] coïncident soit une classe monotone, comme dans la démonstration de {{m-dynkin|Classes monotones}}, (ii), mais pas pour en faire une tribu. Sur $X = \{1, 2, 3, 4\}$, les mesures $\delta_1 + \delta_3$ et $\delta_2 + \delta_4$, où $\delta_k$ vaut $1$ sur les parties qui contiennent $k$, coïncident exactement sur $\varnothing$, $X$, $\{1, 2\}$, $\{2, 3\}$, $\{3, 4\}$ et $\{1, 4\}$.

  mesure-finie:
    - |
      Sur $\lex{ensemble-entiers-naturels}{\mathbb N}$ muni de $\lex{ensemble-parties}{\mathcal P}(\mathbb N)$, l'application $\mu(A) = \sum_{n \in A} 2^{-n-1}$ est une [[mesure]] finie, de masse totale $\mu(\mathbb N) = 1$. Sa σ-additivité est la sommation par paquets ({{m-droite-achevee|Sommes dans [0, +∞]}}, (iv)), appliquée à une partition de $A$ en parties $A_k$. Pour les parties décroissantes $A_n = \{k \in \mathbb N : k \geqslant n\}$, d'intersection vide, la continuité décroissante s'observe directement : $\mu(A_n) = 2^{-n}$ tend vers $0$.
    - |
      Sans finitude, la continuité décroissante et la soustraction tombent. Pour $\nu(A) = \sum_{n \in A} \frac1{n+1}$, autre mesure sur $\mathcal P(\mathbb N)$, on a $\nu(\mathbb N) = +\infty$, en groupant les termes en paquets $\{n : 2^k \leqslant n + 1 < 2^{k+1}\}$ de somme au moins $\frac12$. Chaque $A_n = \{k \geqslant n\}$ est alors de mesure infinie, puisque $\nu(\mathbb N) = \nu(\{k < n\}) + \nu(A_n)$ avec un premier terme fini, alors que $\bigcap_n A_n = \varnothing$. De même $\nu(A_0 \setminus A_1) = 1$, que l'on ne peut pas écrire $\nu(A_0) - \nu(A_1)$, différence $(+\infty) - (+\infty)$ qui n'a pas de sens.
    - |
      Une mesure finie non nulle se ramène à une mesure de masse $1$ en la divisant par sa masse totale. Si $0 < \mu(X) < +\infty$, l'application $A \mapsto \mu(A)/\mu(X)$ est encore σ-additive, puisque la multiplication par $\frac1{\mu(X)}$ passe aux bornes supérieures ({{m-droite-achevee|Sommes dans [0, +∞]}}, (ii)), et elle vaut $1$ en $X$. La mesure nulle, finie elle aussi, ne se normalise pas. Plus loin, une mesure de masse $1$ sera appelée une probabilité ({{p-espace|Espace probabilisé}}).

  mesure-sigma-finie:
    - |
      La mesure de comptage sur $\lex{ensemble-parties}{\mathcal P}(\lex{ensemble-entiers-naturels}{\mathbb N})$ est σ-finie sans être [[mesure-finie|finie]] : les parties $X_n = \{0, \dots, n\}$ croissent, sont de mesure finie et recouvrent $\mathbb N$. Sur $\mathcal P(\lex{ensemble-reels}{\mathbb R})$, la mesure de comptage n'est pas σ-finie. Ses parties de mesure finie sont les parties finies, et la réunion d'une suite croissante de parties finies de $\mathbb R$ est [[denombrable|au plus dénombrable]] : on numérote les éléments de $X_0$ dans l'ordre croissant, puis ceux de $X_1 \setminus X_0$, et ainsi de suite, sans aucun choix. Or $\mathbb R$ n'est pas dénombrable ({{su-segments|Segments emboîtés}}, remarque).
    - |
      Être σ-finie est une propriété de la [[mesure]], non de la taille de l'ensemble. Sur un ensemble à un élément $X = \{x\}$, muni de $\mathcal P(X)$, l'application $\nu$ nulle en $\varnothing$ et égale à $+\infty$ en $X$ est une mesure. Elle n'est pas σ-finie : ses seules parties de mesure finie sont vides, et une réunion de parties vides est vide.
    - |
      Une mesure σ-finie a les mêmes ensembles [[negligeable|négligeables]] qu'une mesure finie. Si les $X_n$ croissent vers $X$ et sont de mesure finie, les parties $B_0 = X_0$ et $B_{n+1} = X_{n+1} \setminus X_n$ sont disjointes, et l'on pose
      $$\mu'(A) = \sum_{n \in \mathbb N} \frac{2^{-n-1}\,\mu(A \cap B_n)}{1 + \mu(B_n)}.$$
      C'est une mesure, par sommation par paquets et multiplication par une constante ({{m-droite-achevee|Sommes dans [0, +∞]}}, (ii) et (iv)), de masse au plus $1$. Et $\mu'(A) = 0$ équivaut à $\mu(A \cap B_n) = 0$ pour tout $n$, donc à $\mu(A) = 0$, puisque les $B_n$ partitionnent $X$.

  espace-mesurable:
    - |
      Sur un ensemble fini, une [[tribu]] est déterminée par ses atomes, et l'ensemble $X = \{1, 2, 3\}$ porte exactement cinq structures d'espace mesurable. Pour $x \in X$, l'intersection $A_x$ des éléments de la tribu qui contiennent $x$ est une intersection finie, donc un élément de la tribu. Dire que $y \in A_x$, c'est dire qu'aucun élément ne contient $x$ sans contenir $y$ ; par passage au complémentaire, c'est symétrique en $x$ et $y$, et les $A_x$ sont les classes d'une [[relation-equivalence|relation d'équivalence]]. Tout élément est la réunion des $A_x$ qu'il contient, les réunions de blocs d'une partition forment toujours une tribu, et les tribus sur $X$ correspondent ainsi aux [[partition|partitions]] de $X$ : $\{\varnothing, X\}$, les trois tribus $\{\varnothing, \{i\}, X \setminus \{i\}, X\}$, et $\lex{ensemble-parties}{\mathcal P}(X)$.
      ```schema lex-espace-mesurable-1
      Les cinq tribus sur $\{1, 2, 3\}$, rangées par inclusion de bas en haut, chacune dessinée par sa partition en atomes. Les trois tribus du milieu sont deux à deux incomparables, et la tribu engendrée par deux d'entre elles est $\mathcal P(X)$.
      ```
    - |
      Une partie $A$ de $X$ hérite d'une structure d'espace mesurable, celle des traces $B \cap A$, $B \in \mathcal A$, qui forment une tribu sur $A$, puisque $A \setminus (B \cap A) = (X \setminus B) \cap A$ et que les traces commutent aux réunions. Il faut prendre garde que $A$ n'a pas besoin d'être mesurable. Sur $X = \{1, 2, 3\}$ muni de $\mathcal A = \{\varnothing, \{1\}, \{2, 3\}, X\}$, la trace sur $A = \{1, 2\}$ est $\lex{ensemble-parties}{\mathcal P}(A)$ : la partie $\{2\}$ est mesurable dans $A$, où elle est la trace de $\{2, 3\}$, sans l'être dans $X$.
    - |
      L'image réciproque transporte les tribus ({{m-tribus|Tribus}}, (iv)), mais pas l'image directe, même par une surjection. Soit $f : \{1, 2, 3\} \to \{a, b\}$ définie par $f(1) = f(2) = a$ et $f(3) = b$, et $\mathcal A = \{\varnothing, \{1\}, \{2, 3\}, \{1, 2, 3\}\}$. Les images directes des éléments de $\mathcal A$ sont $\varnothing$, $\{a\}$ et $\{a, b\}$ : elles ne forment pas une tribu sur $\{a, b\}$, puisque le complémentaire $\{b\}$ de $\{a\}$ manque. Le point (iv) de {{m-tribus|Tribus}} fournit à la place la tribu $\{B : f^{-1}(B) \in \mathcal A\} = \{\varnothing, \{a, b\}\}$.

  fonction-borelienne:
    - |
      Une fonction borélienne n'a pas à être continue : toute fonction [[application-croissante|croissante]] $f : \lex{ensemble-reels}{\mathbb R} \to \mathbb R$ est borélienne. L'ensemble $\{f > a\}$ contient en effet, avec chacun de ses points, tous les réels plus grands ; c'est donc $\varnothing$, $\mathbb R$, ou une demi-droite $]c, +\infty[$ ou $[c, +\infty[$, avec $c$ sa [[borne-inferieure|borne inférieure]], et toujours un borélien. Pour la [[partie-entiere|partie entière]], discontinue en chaque entier, $\{\lfloor x \rfloor > a\} = [\lfloor a \rfloor + 1, +\infty[$.
      ```schema lex-fonction-borelienne-1
      Le graphe de la partie entière sur $[-1, 4[$ et le niveau $a = 1{,}5$ en pointillé. L'ensemble $\{\lfloor x \rfloor > a\}$, en rouge sur l'axe, est la demi-droite $[2, +\infty[$, fermée à gauche parce que la fonction saute en $2$, le point plein marquant la valeur prise au saut.
      ```
    - |
      Que $|f|$ soit borélienne n'entraîne pas que $f$ le soit. Sur $X = \{a, b\}$ muni de la topologie grossière $\{\varnothing, X\}$, la [[tribu-borelienne|tribu borélienne]] est $\{\varnothing, X\}$, et seules les fonctions constantes sont boréliennes. La fonction $f$ qui vaut $1$ en $a$ et $-1$ en $b$ ne l'est donc pas, puisque $\{f > 0\} = \{a\}$, alors que $|f|$ et $f^2$, constantes égales à $1$, le sont. Le point (iii) de {{m-mesurables|Fonctions mesurables}} n'a pas de réciproque.
    - |
      Une limite simple de fonctions continues est borélienne ({{m-mesurables|Fonctions mesurables}}, (ii)), et deux passages à la limite fabriquent déjà l'indicatrice de $\lex{ensemble-rationnels}{\mathbb Q}$. Comme $\cos^2 + \sin^2 = 1$, on a $|\cos(\pi x)| = 1$ si et seulement si $\sin(\pi x) = 0$, c'est-à-dire $x \in \lex{ensemble-entiers-relatifs}{\mathbb Z}$ ({{tg-cercle|Paramétrage du cercle}}, (i)) ; la suite $\cos(\pi x)^{2n}$ tend donc vers $\mathbf 1_{\mathbb Z}(x)$. Pour $x = \frac pq$ rationnel, avec $q \geqslant 1$, le réel $m!\,x$ est entier dès que $m \geqslant q$, et pour $x$ irrationnel il ne l'est jamais, $m!$ désignant la [[factorielle]] : $\mathbf 1_{\mathbb Q}(x) = \lim_m \mathbf 1_{\mathbb Z}(m!\,x)$. La fonction $\mathbf 1_{\mathbb Q}$, discontinue en tout point, est donc borélienne.

  partie-mesurable-exterieure:
    - |
      Pour une [[mesure]] $\mu$ définie sur toutes les parties de $X$, vue comme [[mesure-exterieure|mesure extérieure]], toute partie est $\mu$-mesurable. Une mesure est en effet croissante et sous-additive ({{m-mesures|Mesures}}, (i) et (ii)), et l'additivité donne $\mu(E) = \mu(E \cap A) + \mu(E \setminus A)$ pour tous $A$ et $E$, ces deux parties étant disjointes. Ainsi, pour la mesure de comptage ou une mesure de Dirac sur $\lex{ensemble-parties}{\mathcal P}(X)$, le théorème de Carathéodory rend la tribu $\mathcal P(X)$ tout entière.
    - |
      Le critère porte sur toutes les parties $E$, et le vérifier pour $E = X$ ne suffit pas. Sur $X = \{1, 2, 3\}$, posons $\mu^*(\varnothing) = 0$, $\mu^*(A) = 1$ si $A$ a un ou deux éléments, et $\mu^*(X) = 2$ : c'est une mesure extérieure, croissante, et sous-additive puisque $\mu^*(X) = 2$ ne dépasse pas la somme des valeurs de deux parties non vides qui recouvrent $X$. Pour $A = \{1\}$, le critère est vrai en $E = X$, puisque $\mu^*(\{1\}) + \mu^*(\{2, 3\}) = 2$, mais faux en $E = \{1, 2\}$, où $\mu^*(\{1\}) + \mu^*(\{2\}) = 2 > \mu^*(\{1, 2\}) = 1$. En fait, seules $\varnothing$ et $X$ sont $\mu^*$-mesurables.

  mesure-complete:
    - |
      Toute [[mesure]] définie sur $\lex{ensemble-parties}{\mathcal P}(X)$ est complète, puisque toute partie est alors mesurable : c'est le cas de la mesure de comptage et des mesures de Dirac. La complétude n'est une condition que pour une tribu plus petite, et elle ne porte que sur les parties des ensembles [[negligeable|négligeables]].
    - |
      Une mesure sur une tribu finie peut ne pas être complète, et le théorème de Carathéodory la complète. Sur $X = \{1, 2, 3\}$ muni de $\mathcal A = \{\varnothing, \{1\}, \{2, 3\}, X\}$, la mesure $\mu$ qui vaut $1$ en $\{1\}$ et $0$ en $\{2, 3\}$ n'est pas complète : $\{2\}$ est contenue dans le négligeable $\{2, 3\}$ sans appartenir à $\mathcal A$. La [[mesure-exterieure|mesure extérieure]] $\mu^*(A) = \min\{\mu(B) : B \in \mathcal A,\ B \supset A\}$ vaut $1$ sur les parties contenant $1$ et $0$ sur les autres ; toutes les parties sont $\mu^*$-mesurables, et l'on obtient la mesure de Dirac $\delta_1$ sur $\mathcal P(X)$, qui prolonge $\mu$ et est complète.
    - |
      Une mesure complète n'est pas forcément définie sur toutes les parties. Munissons $\lex{ensemble-reels}{\mathbb R}$ de la tribu des parties au plus dénombrables ou de complémentaire au plus dénombrable, et de la mesure qui vaut $0$ sur les premières et $1$ sur les secondes, tribu et mesure demandant le [[choix-denombrable|choix dénombrable]] ⋆. Ses négligeables sont les parties au plus dénombrables, dont toutes les parties le sont aussi : la mesure est complète. Pourtant le segment $[0, 1]$ n'est pas mesurable, puisque ni lui ni son complémentaire ne sont au plus dénombrables ({{su-segments|Segments emboîtés}}, remarque).

  ecriture-canonique:
    - |
      L'écriture canonique regroupe les points selon la valeur prise, et non selon la façon dont la fonction a été construite. Sur $\lex{ensemble-reels}{\mathbb R}$, la [[fonction-etagee|fonction étagée]] $s = \mathbf 1_{[0, 2]} + \mathbf 1_{[1, 3]}$ prend les trois valeurs $0$, $1$ et $2$, et son écriture canonique est
      $$\begin{aligned} s = {}&0 \cdot \mathbf 1_{A_0} + 1 \cdot \mathbf 1_{[0, 1[ \,\cup\, ]2, 3]} \\ &+ 2 \cdot \mathbf 1_{[1, 2]}, \end{aligned}$$
      avec $A_0 = \mathbb R \setminus [0, 3]$. Le terme de valeur $0$ y figure, puisque $0$ est l'une des valeurs de $s$, et la partie où $s$ vaut $1$ est formée de deux intervalles disjoints.
      ```schema lex-ecriture-canonique-1
      En haut, les deux indicatrices de $[0, 2]$ et de $[1, 3]$, en bleu et en vert ; en bas, leur somme $s$, en rouge, qui vaut $1$ sur $[0, 1[ \,\cup\, ]2, 3]$ et $2$ sur $[1, 2]$. L'écriture canonique lit $s$ sur ses paliers, non sur les deux indicatrices dont elle provient.
      ```
    - |
      Une écriture $\sum c_i \mathbf 1_{A_i}$ n'est canonique que si les $c_i$ sont distincts et les $A_i$ disjoints, de réunion l'espace entier. L'écriture $\mathbf 1_{[0, 1[} + \mathbf 1_{[1, 2]}$ de $\mathbf 1_{[0, 2]}$, sur une partition de $[0, 2]$, répète le coefficient $1$ et omet la valeur $0$ : la forme canonique est $0 \cdot \mathbf 1_{\mathbb R \setminus [0, 2]} + 1 \cdot \mathbf 1_{[0, 2]}$. À l'inverse, $\mathbf 1_{[0, 2]} + 2 \cdot \mathbf 1_{[1, 3]}$ a des coefficients distincts, mais ses parties se chevauchent, et la fonction vaut $3$ sur $[1, 2]$, valeur qu'aucun coefficient n'annonce. Comme les valeurs et les ensembles $s^{-1}(\{c\})$ sont déterminés par $s$, l'écriture canonique est unique à l'ordre près.
    - |
      Plus loin, l'intégrale d'une fonction étagée positive sera définie sur son écriture canonique, par $\int s \, d\mu = \sum_i c_i\, \mu(A_i)$ ({{m-integrale|Intégrale positive}}). Pour $s = \mathbf 1_{[0, 2]} + \mathbf 1_{[1, 3]}$ et la mesure de Lebesgue, cela donne $0 \cdot (+\infty) + 1 \cdot 2 + 2 \cdot 1 = 4$, où la convention $0 \cdot (+\infty) = 0$ efface le terme de valeur nulle ; c'est aussi la somme des longueurs de $[0, 2]$ et de $[1, 3]$, comme le veut l'additivité de l'intégrale.

  partie-lebesgue-mesurable:
    - |
      Toute partie d'un ensemble de mesure extérieure nulle est mesurable au sens de Lebesgue. Si $\lambda^*(N) = 0$ et $A \subset N$, la croissance donne $\lambda^*(A) = 0$, et $A$ appartient à la tribu de Lebesgue par [[mesure-complete|complétude]] ({{m-caratheodory|Carathéodory}}). L'ensemble de Cantor $K$, que décrit une remarque de {{m-lebesgue|Mesure de Lebesgue}}, vérifie $\lambda(K) \leqslant (\frac23)^n$ pour tout $n$ : toutes ses parties, si irrégulières soient-elles, sont mesurables et négligeables, alors que $K$ n'est pas dénombrable.
    - |
      L'invariance de $\lambda^*$ par translation fabrique des parties mesurables, négligeables et denses. Pour l'ensemble de Cantor $K$, qui contient $0$, on a $\lambda^*(K + q) = \lambda^*(K) = 0$ pour tout rationnel $q$ ({{m-lebesgue|Mesure de Lebesgue}}, (i)), et la réunion dénombrable
      $$S = \bigcup_{q \in \mathbb Q} (K + q)$$
      est de mesure extérieure nulle par sous-additivité, donc mesurable et négligeable. Elle contient $\lex{ensemble-rationnels}{\mathbb Q}$, donc elle est dense, et elle contient $K$, donc elle n'est pas dénombrable.
    - |
      La mesure extérieure $\lambda^*$ est définie sur toutes les parties de $\lex{ensemble-reels}{\mathbb R}$, mais c'est sa restriction à la tribu de Lebesgue que le théorème de Carathéodory fait une mesure. Plus loin, l'ensemble de Vitali, obtenu en choisissant un représentant de chaque classe de $\mathbb R$ modulo $\mathbb Q$, sera une partie qui n'est pas mesurable ({{m-vitali|Ensemble de Vitali}}). Ce recours à l'[[axiome-choix|axiome du choix]] est inévitable : R. M. Solovay a montré (« A model of set-theory in which every set of reals is Lebesgue measurable », *Ann. of Math.* (2) 92, n° 1, 1970, p. 1-56) que, si l'existence d'un cardinal inaccessible est cohérente avec $\mathsf{ZFC}$, il est cohérent avec $\mathsf{ZF}$ et le [[choix-dependant|choix dépendant]] que toute partie de $\mathbb R$ soit mesurable au sens de Lebesgue.

  espace-mesure:
    - |
      Dans un espace mesuré, la mesure n'est définie que sur la [[tribu]], et elle ne détermine pas de mesure sur les autres parties. Sur $X = \{1, 2, 3\}$ muni de $\mathcal A = \{\varnothing, \{1\}, \{2, 3\}, X\}$, posons $\mu(\{1\}) = 1$, $\mu(\{2, 3\}) = 2$, et par additivité $\mu(X) = 3$ et $\mu(\varnothing) = 0$. La quantité $\mu(\{2\})$ n'a pas de sens, et plusieurs mesures sur $\lex{ensemble-parties}{\mathcal P}(X)$ prolongent $\mu$ : $\delta_1 + 2\delta_2$, $\delta_1 + \delta_2 + \delta_3$ et $\delta_1 + 2\delta_3$, où $\delta_k$ est la mesure de Dirac en $k$, donnent à $\{2\}$ les valeurs $2$, $1$ et $0$.
    - |
      Une application transporte un espace mesuré, mais pas la σ-finitude. Si $f : X \to Y$ et $(X, \mathcal A, \mu)$ est un espace mesuré, l'application $B \mapsto \mu(f^{-1}(B))$ est une [[mesure]] sur la tribu $\{B \subset Y : f^{-1}(B) \in \mathcal A\}$ ({{m-tribus|Tribus}}, (iv)), car l'image réciproque conserve les réunions et la disjonction. Pour la mesure de comptage sur $\lex{ensemble-entiers-naturels}{\mathbb N}$, qui est [[mesure-sigma-finie|σ-finie]], et l'application qui associe à $n$ le reste de sa division par $2$, la mesure image vaut $+\infty$ sur $\{0\}$ et sur $\{1\}$ : elle n'est pas σ-finie.
    - |
      Une partie mesurable $A$ d'un espace mesuré en forme un à son tour, avec la tribu des parties mesurables contenues dans $A$ et la restriction de $\mu$. Pour la mesure de comptage sur $\mathcal P(\mathbb N)$ et l'ensemble $A$ des entiers pairs, on obtient la mesure de comptage sur $\mathcal P(A)$. Le cas limite $X = \varnothing$ ne laisse qu'un espace mesuré, $(\varnothing, \{\varnothing\}, 0)$, puisque $\mathcal P(\varnothing) = \{\varnothing\}$ et que $\mu(\varnothing) = 0$.

  pave-mesurable:
    - |
      Les pavés mesurables forment un [[pi-systeme|π-système]], et le complémentaire d'un pavé est la réunion de deux pavés disjoints. D'une part $(A \times B) \cap (A' \times B') = (A \cap A') \times (B \cap B')$. D'autre part, un point $(x, y)$ hors de $A \times B$ a soit $x \notin A$, soit $x \in A$ et $y \notin B$, d'où
      $$\begin{aligned} (X \times Y) \setminus (A \times B) = {}&(A^c \times Y) \\ &\cup (A \times B^c). \end{aligned}$$
      ```schema lex-pave-mesurable-1
      Le pavé $A \times B$ en rouge, avec $X$ en abscisse et $Y$ en ordonnée ; son complémentaire est la réunion du pavé $A^c \times Y$, en bleu, formé ici de deux bandes, et du pavé $A \times B^c$, en vert, en deux morceaux au-dessus et au-dessous du rouge, qui sont disjoints.
      ```
    - |
      Une réunion de deux pavés n'est pas un pavé en général. Dans $\lex{ensemble-reels}{\mathbb R}^2$, muni des pavés boréliens, la réunion $L = [0, 2] \times [0, 1] \,\cup\, [0, 1] \times [0, 2]$, en forme d'équerre, contient $(2, 0)$ et $(0, 2)$. Un pavé $A \times B$ qui contient ces deux points a $2 \in A$ et $2 \in B$, donc contient $(2, 2)$, qui n'est pas dans $L$. C'est pourquoi la [[tribu-produit|tribu produit]] est définie comme la tribu engendrée par les pavés, et non comme leur ensemble.
    - |
      L'écriture d'un pavé non vide est unique, et c'est ce qui rend la formule $\mu(A)\,\nu(B)$ cohérente. Si $A \times B = A' \times B'$ n'est pas vide, ses projections sont $A = A'$ et $B = B'$. Un pavé vide, en revanche, s'écrit $\varnothing \times B$ pour tout $B$, et la valeur $\mu(\varnothing)\,\nu(B) = 0 \cdot \nu(B)$ doit être nulle même si $\nu(B) = +\infty$ : c'est la convention $0 \cdot (+\infty) = 0$ de {{m-droite-achevee|Sommes dans [0, +∞]}}.

  section-partie-produit:
    - |
      Les sections permettent de compter une partie d'un produit par colonnes ou par lignes. Pour $E = \{(m, n) : m + n \leqslant 3\}$ dans $\{0, 1, 2, 3\}^2$, la section $E_m = \{0, \dots, 3 - m\}$ a $4 - m$ éléments, et la section $E^n = \{0, \dots, 3 - n\}$ en a $4 - n$. Les deux décomptes donnent le même total, $4 + 3 + 2 + 1 = 10$, ce qu'énonce, pour les mesures de comptage, le point (iii) de {{m-produit|Mesure produit}}.
      ```schema lex-section-partie-produit-1
      Les dix points de $E$ ; la section verticale $E_1 = \{0, 1, 2\}$ est en bleu, la section horizontale $E^2 = \{0, 1\}$ en vert. Compter les points colonne par colonne ou ligne par ligne donne $10$.
      ```
    - |
      Le passage aux sections commute avec les opérations des tribus, ce qui démontre le point (i) de {{m-produit|Mesure produit}}. Pour des espaces mesurables $(X, \mathcal A)$ et $(Y, \mathcal B)$ et $x \in X$ fixé, $(E^c)_x = (E_x)^c$, puisque $(x, y) \notin E$ équivaut à $y \notin E_x$, et $(\bigcup_n E_n)_x = \bigcup_n (E_n)_x$. Les parties $E$ dont toutes les sections $E_x$ appartiennent à $\mathcal B$ forment donc une [[tribu]], qui contient les pavés $A \times B$, dont les sections valent $B$ ou $\varnothing$, et par suite la tribu produit.
    - |
      Des sections mesurables dans une seule direction ne suffisent pas à rendre une partie mesurable. Sur $X = \{1, 2\}$ muni de $\{\varnothing, X\}$ et $Y = \{a, b\}$ muni de $\lex{ensemble-parties}{\mathcal P}(Y)$, la partie $E = \{(1, a), (2, b)\}$ a pour sections $E_1 = \{a\}$ et $E_2 = \{b\}$, toutes deux mesurables. Mais $E^a = \{1\}$ n'est pas dans la tribu de $X$, de sorte que $E$ n'appartient pas à la [[tribu-produit|tribu produit]], par le même point (i).

  tribu-produit:
    - |
      La tribu produit contient bien plus que les pavés. Sur $X = Y = \{a, b\}$, muni de $\lex{ensemble-parties}{\mathcal P}(X)$, les [[pave-mesurable|pavés]] $A \times B$ ne sont que dix parties des seize de $X \times Y$ : neuf pavés non vides, avec $A$ et $B$ pris parmi $\{a\}$, $\{b\}$ et $X$, et la partie vide. La diagonale $\{(a, a), (b, b)\}$ n'est pas un pavé, puisqu'un pavé qui contient $(a, a)$ et $(b, b)$ contient aussi $(a, b)$. Elle appartient pourtant à la tribu produit, comme réunion des pavés $\{a\} \times \{a\}$ et $\{b\} \times \{b\}$, et la tribu produit est ici $\mathcal P(X \times Y)$ tout entière.
      ```schema lex-tribu-produit-1
      Les quatre points de $\{a, b\}^2$ ; un pavé est un rectangle de lignes et de colonnes, comme $\{a\} \times X$, en bleu. La diagonale, en rouge, n'est pas un pavé, mais la réunion des deux pavés réduits à un point qu'elle contient.
      ```
    - |
      Une tribu produit peut ne pas contenir la diagonale, quand les tribus des facteurs sont trop pauvres. Sur $X = \{1, 2, 3\}$ muni de $\mathcal A = \{\varnothing, \{1\}, \{2, 3\}, X\}$, chaque section d'un élément de $\mathcal A \otimes \mathcal A$ est dans $\mathcal A$ ({{m-produit|Mesure produit}}, (i)). La section en $2$ de la diagonale $D = \{(x, x) : x \in X\}$ est $\{2\}$, qui n'est pas dans $\mathcal A$ : $D \notin \mathcal A \otimes \mathcal A$. La tribu produit ne voit pas mieux que ses facteurs, qui ne distinguent pas $2$ de $3$.
    - |
      La diagonale de $\lex{ensemble-reels}{\mathbb R}^2$ appartient à $\lex{tribu-borelienne}{\mathcal B}(\mathbb R) \otimes \mathcal B(\mathbb R)$. Deux réels $x$ et $y$ sont égaux si et seulement si, pour tout $n \in \lex{ensemble-entiers-naturels}{\mathbb N}$, ils tombent dans le même intervalle $I_{n,k} = [k2^{-n}, (k + 1)2^{-n}[$, $k \in \lex{ensemble-entiers-relatifs}{\mathbb Z}$. La diagonale est donc
      $$D = \bigcap_{n \in \mathbb N} \bigcup_{k \in \mathbb Z} I_{n,k} \times I_{n,k},$$
      intersection d'une suite de réunions dénombrables de pavés boréliens.
      ```schema lex-tribu-produit-3
      Pour $n = 0$, $1$ et $2$, les carrés $I_{n,k} \times I_{n,k}$ qui recouvrent la diagonale sur $[0, 2[^2$, de plus en plus petits. Chaque réunion contient la diagonale, en rouge, et leur intersection lui est égale : un point hors de la diagonale finit par sortir des carrés.
      ```

  tribu-engendree:
    - |
      Une tribu engendrée par un nombre fini de parties se décrit par ses atomes. Sur $X = \{1, 2, 3, 4, 5\}$, soit $\mathcal C = \{\{1, 2\}, \{2, 3\}\}$. Toute [[tribu]] qui contient $\mathcal C$ contient $\{2\} = \{1, 2\} \cap \{2, 3\}$, $\{1\} = \{1, 2\} \setminus \{2, 3\}$, de même $\{3\}$, et $\{4, 5\}$, complémentaire de $\{1, 2, 3\}$ ({{m-tribus|Tribus}}, (i)). Les réunions de ces quatre atomes forment une tribu, puisque le complémentaire d'une réunion d'atomes est la réunion des autres atomes. C'est donc $\sigma(\mathcal C)$, qui a $2^4 = 16$ éléments et ne contient pas $\{4\}$.
      ```schema lex-tribu-engendree-1
      Les parties $\{1, 2\}$, en bleu, et $\{2, 3\}$, en vert, découpent $X$ en quatre atomes, en rouge : $\{1\}$, $\{2\}$, $\{3\}$ et $\{4, 5\}$. Les éléments de $\sigma(\mathcal C)$ sont les réunions d'atomes, et aucun ne sépare $4$ de $5$.
      ```
    - |
      La tribu engendrée par les singletons dépend de la taille de l'ensemble. Sur $\lex{ensemble-entiers-naturels}{\mathbb N}$, c'est $\lex{ensemble-parties}{\mathcal P}(\mathbb N)$ tout entier, toute partie $A$ étant la réunion des $\{n\}$, $n \in A$, famille indexée par une partie de $\mathbb N$. Sur $\lex{ensemble-reels}{\mathbb R}$, c'est l'ensemble $\mathcal D$ des parties $A$ telles que $A$ ou $\mathbb R \setminus A$ soit [[denombrable|au plus dénombrable]].

      C'est une tribu, car une réunion d'une suite de parties au plus dénombrables l'est encore, une énumération de chacune étant choisie ⋆ ([[choix-denombrable|choix dénombrable]]), et car une réunion qui contient une partie de complémentaire au plus dénombrable est aussi de complémentaire au plus dénombrable. Elle contient les singletons, et elle est contenue dans toute tribu qui les contient, chacun de ses éléments étant une réunion au plus dénombrable de singletons ou le complémentaire d'une telle réunion. Le segment $[0, 1]$, borélien, n'est pas dans $\mathcal D$ : ni lui ni son complémentaire ne sont au plus dénombrables, par l'argument de Cantor de {{su-segments|Segments emboîtés}}, qui s'applique à tout segment non réduit à un point.
    - |
      La [[tribu-borelienne|tribu borélienne]] de $\mathbb R$ est engendrée par une famille dénombrable, celle des demi-droites $]{-\infty}, r]$ à extrémité $r$ rationnelle. Pour $c$ réel et $n \in \mathbb N$, le rationnel
      $$r_n = \frac{\lfloor (n + 1)c \rfloor + 1}{n + 1}$$
      vérifie $c < r_n \leqslant c + \frac1{n+1}$, si bien que $]{-\infty}, c]$ est l'intersection des $]{-\infty}, r_n]$. Toute tribu qui contient ces demi-droites rationnelles contient donc toutes les demi-droites $]{-\infty}, c]$, qui engendrent la tribu borélienne ({{m-tribus|Tribus}}, (iii)). Aucun choix n'intervient, puisque $r_n$ est donné par une formule, au moyen de la [[partie-entiere|partie entière]].
