# Exemples du lexique : théorie « Analyse de Fourier » (fourier).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  transformee-fourier:
    - |
      La transformée d'une fonction intégrable tend vers $0$ à l'infini, mais elle n'est pas toujours intégrable. Pour $f = \mathbf 1_{[-1, 1]}$, en séparant parties réelle et imaginaire,
      $$\hat f(\xi) = \int_{-1}^1 e^{-ix\xi}\,dx = \frac{2\sin\xi}{\xi}$$
      pour $\xi \neq 0$, et $\hat f(0) = 2$. Cette [[transformee-fourier|transformée de Fourier]] est continue et tend vers $0$, comme le veut le point (ii) de {{fo-transformee|Transformée de Fourier}}, mais seulement comme $\frac1{|\xi|}$. Elle n'est pas intégrable : sur chaque arche $[k\pi, (k + 1)\pi]$, $k \geqslant 1$, l'intégrale de $\frac{|\sin\xi|}\xi$ est au moins $\frac{2}{(k + 1)\pi}$, terme d'une série divergente.
      ```schema lex-transformee-fourier-1
      La transformée $\hat f(\xi) = 2\sin\xi/\xi$ de l'indicatrice de $[-1, 1]$, en rouge, et les enveloppes $\pm 2/|\xi|$, en pointillé : les oscillations décroissent trop lentement pour que $|\hat f|$ soit intégrable.
      ```
    - |
      Pour $e^{-|x|}$, qui décroît vite et n'a pas de saut, la transformée est intégrable, et la convolution se lit comme un produit. Pour $f(x) = e^{-|x|}$, une primitive de $e^{-x(1 + i\xi)}$ étant $-e^{-x(1 + i\xi)}/(1 + i\xi)$, dont le module tend vers $0$ à l'infini,
      $$\begin{aligned} \hat f(\xi) &= \frac1{1 + i\xi} + \frac1{1 - i\xi} \\ &= \frac{2}{1 + \xi^2}. \end{aligned}$$
      Un calcul direct donne $f * f(x) = (1 + |x|)e^{-|x|}$, et le point (iv) de {{fo-transformee|Transformée de Fourier}} donne aussitôt $\widehat{f * f}(\xi) = \frac{4}{(1 + \xi^2)^2}$ : la convolution, qui adoucit $f$ en $0$, accélère la décroissance de la transformée.
    - |
      Une limite simple de transformées de Fourier n'est pas toujours une transformée de Fourier. Pour $\varepsilon > 0$, la gaussienne $G_\varepsilon$ du point (iii) de {{fo-transformee|Transformée de Fourier}}, d'intégrale $1$ et de largeur $\varepsilon$, a pour transformée $e^{-\varepsilon^2\xi^2/2}$, de largeur $\frac1\varepsilon$ : resserrer la fonction élargit sa transformée. Quand $\varepsilon \to 0$, cette transformée tend vers $1$ en tout point, et la fonction constante $1$ n'est la transformée d'aucune fonction intégrable, puisqu'elle ne tend pas vers $0$ à l'infini. Plus loin, elle sera la fonction caractéristique de la variable constante $0$ ({{fo-caracteristiques|Fonctions caractéristiques}}).

  fonction-caracteristique:
    - |
      Les lois les plus simples ont des fonctions caractéristiques trigonométriques. Pour un signe $\varepsilon$ égal à $\pm 1$ avec probabilité $\frac12$, $\varphi_\varepsilon(t) = \frac12(e^{it} + e^{-it}) = \cos t$, et, pour une somme de $n$ signes [[independance|indépendants]], le point (ii) de {{fo-caracteristiques|Fonctions caractéristiques}} donne $\cos^n t$. Pour une variable uniforme sur $[-1, 1]$, $\varphi(t) = \frac{\sin t}t$, la moitié de la transformée de l'indicatrice de $[-1, 1]$ calculée dans les exemples de [[transformee-fourier|transformée de Fourier]]. Enfin $\varphi_\varepsilon(\pi) = -1$, puisque $e^{i\pi\varepsilon} = -1$ pour les deux valeurs de $\varepsilon$ : le module d'une [[fonction-caracteristique|fonction caractéristique]] peut revenir à $1$ hors de $0$.
    - |
      Le produit des fonctions caractéristiques ne caractérise pas l'indépendance. Pour $f(x) = \frac12e^{-|x|}$, $\hat f(\xi) = \frac1{1 + \xi^2}$ est intégrable, et l'inversion ({{fo-inversion|Inversion}}, (ii)), vraie partout puisque ses deux membres sont continus, montre que la densité $\frac1{\pi(1 + x^2)}$, dite de Cauchy, a pour fonction caractéristique $e^{-|t|}$. Si $X$ suit cette loi et $Y = X$, alors
      $$\begin{aligned} \varphi_{X + Y}(t) &= \varphi_X(2t) = e^{-2|t|} \\ &= \varphi_X(t)\,\varphi_Y(t), \end{aligned}$$
      alors que $X$ et $Y$ ne sont pas indépendantes. La réciproque du point (ii) de {{fo-caracteristiques|Fonctions caractéristiques}} est donc fausse ; la loi de Cauchy, qui n'a pas d'espérance, a pourtant une fonction caractéristique, comme toute loi.
    - |
      Les fonctions caractéristiques ramènent l'étude d'une somme de variables indépendantes à celle d'une puissance. Pour $S_n$ somme de $n$ signes indépendants, $\varphi_{S_n/\sqrt n}(t) = \cos^n\frac t{\sqrt n}$ ; pour $n = 100$ et $t = 1$, cette quantité vaut environ $0{,}6060$, voisine de $e^{-1/2} \approx 0{,}6065$, fonction caractéristique de $\mathcal N(0, 1)$ en $1$. Plus loin, on montrera que $\varphi_{S_n/\sqrt n}(t)$ tend vers $e^{-t^2/2}$ pour tout $t$, ce qui donne le théorème central limite ({{fo-tcl|TCL par Fourier}}).
      ```schema lex-fonction-caracteristique-3
      Les fonctions $t \mapsto \cos^n(t/\sqrt n)$ pour $n = 1$, $4$ et $16$, en bleu, vert et rouge, et la gaussienne $e^{-t^2/2}$, en pointillé : sur $[0, 4]$, les courbes se rapprochent de la gaussienne quand $n$ croît.
      ```

  convergence-loi:
    - |
      La définition exclut les points de discontinuité de la limite, et c'est indispensable. La variable constante $X_n = \frac1n$ devrait converger en loi vers $0$. Pour $x > 0$, $F_{X_n}(x) = 1$ dès que $n > \frac1x$, et pour $x < 0$, $F_{X_n}(x) = 0$ : il y a convergence vers $F_0$ hors de $0$. En $0$, au contraire, $F_{X_n}(0) = 0$ pour tout $n$, alors que $F_0(0) = 1$ ; mais $0$ est un saut de $F_0$, et $X_n$ [[convergence-loi|converge en loi]] vers $0$.
      ```schema lex-convergence-loi-1
      Les fonctions de répartition de $X_n = \frac1n$ pour $n = 1$, $2$ et $4$, en bleu, et celle de la limite $0$, en rouge : en tout point $x \neq 0$, les valeurs finissent par coïncider, mais en $0$ les escaliers bleus valent $0$, et le rouge $1$.
      ```
    - |
      La convergence en loi ne porte que sur les lois, et n'entraîne pas la convergence en probabilité. Si $X$ suit $\mathcal N(0, 1)$, la variable $X_n = -X$ a la même loi, par symétrie de la densité : la suite constante $(X_n)$ converge en loi vers $X$. Pourtant $|X_n - X| = 2|X|$, et $P(|X_n - X| > 1) = P(|X| > \frac12)$, environ $0{,}617$, ne dépend pas de $n$ : il n'y a pas [[convergence-probabilite|convergence en probabilité]].
    - |
      La loi binomiale de paramètres $n$ et $\frac\lambda n$, pour $n > \lambda$, converge en loi vers la loi de Poisson de paramètre $\lambda$. Pour $S_n$ de cette loi binomiale et $Z$ de [[loi-poisson|loi de Poisson]], $P(S_n = k) \to P(Z = k)$ pour tout entier $k$ ({{p-poisson-exp|Lois de Poisson et loi exponentielle}}, (ii)). Pour $x$ réel, $F_{S_n}(x)$ est une somme finie de ces probabilités, sur les entiers $0 \leqslant k \leqslant x$, et tend vers $F_Z(x)$, ici en tout point, sauts compris. Plus loin, on verra que la convergence en loi entraîne, réciproquement, celle des fonctions caractéristiques ({{fo-loi-esperances|Convergence en loi et espérances}}, (ii)).

  suite-tendue:
    - |
      Une borne sur les moments donne la tension, par les inégalités de Markov et de Bienaymé-Tchebychev. Si $X_n$ suit $\mathcal N(0, 1 + \frac1n)$, on a $E[X_n^2] \leqslant 2$, et l'inégalité de Bienaymé-Tchebychev ({{p-esperance|Espérance, variance}}, (iii)) donne $P(|X_n| > M) \leqslant \frac2{M^2}$ pour tout $n$ : avec $M = \sqrt{2/\varepsilon}$, cette probabilité est au plus $\varepsilon$, et la suite est [[suite-tendue|tendue]]. De même, une suite bornée dans $L^1$ est tendue, puisque $P(|X_n| > M) \leqslant \sup_k E[|X_k|]/M$.
    - |
      Une suite dont une partie de la masse s'échappe n'est pas tendue, et la limite de ses fonctions de répartition n'en est pas une. Soit $X_n$ égale à $n$ ou à $0$ avec probabilité $\frac12$ chacune. Pour tout $M$, $P(|X_n| > M) = \frac12$ dès que $n > M$ : la suite n'est pas tendue. Pour $x \geqslant 0$, $F_{X_n}(x) = \frac12$ dès que $n > x$, et la limite vaut $0$ sur $]{-\infty}, 0[$ et $\frac12$ sur $[0, +\infty[$ : elle ne tend pas vers $1$ en $+\infty$, et la conclusion du point (ii) de {{fo-helly|Sélection de Helly}} tombe.
    - |
      La tension ne demande aucun moment. Une seule variable $X$ forme une suite tendue, puisque les événements $\{|X| > M\}$, $M \in \mathbb N$, décroissent vers $\varnothing$, si bien que leur probabilité tend vers $0$. C'est le cas d'une variable de loi de Cauchy, de densité $\frac1{\pi(1 + x^2)}$, qui n'est pas intégrable : $P(|X| > M) = 1 - \frac2\pi\arctan M$, qui tend vers $0$. Plus loin, la tension d'une suite se lira sur ses fonctions caractéristiques près de $0$, par l'inégalité de troncature ({{fo-troncature|Troncature}}).

  fonction-escalier-droite:
    - |
      Une fonction en escalier sur $\mathbb R$ a plusieurs écritures comme combinaison d'indicatrices, mais une seule intégrale. La fonction $f = \mathbf 1_{[0, 1]} + 2\cdot\mathbf 1_{[\frac12, 2[}$ vaut $1$ sur $[0, \frac12[$, $3$ sur $[\frac12, 1]$, $2$ sur $]1, 2[$ et $0$ ailleurs ; elle s'écrit aussi $\mathbf 1_{[0, \frac12[} + 3\cdot\mathbf 1_{[\frac12, 1]} + 2\cdot\mathbf 1_{]1, 2[}$. Les deux écritures donnent la même intégrale, $1 + 2\cdot\frac32 = \frac12 + \frac32 + 2 = 4$. C'est une [[fonction-escalier-droite|fonction en escalier]], nulle hors du segment $[0, 2]$.
      ```schema lex-fonction-escalier-droite-1
      Le graphe de $f$, en rouge : trois paliers, de hauteurs $1$, $3$ et $2$, sur des intervalles bornés, et la valeur $0$ hors de $[0, 2]$. L'aire sous les paliers vaut $4$.
      ```
    - |
      Une fonction dont chaque restriction à un segment est en escalier n'est pas forcément en escalier sur $\mathbb R$. L'indicatrice $\mathbf 1_{[0, +\infty[}$ est, sur tout segment $[a, b]$, une [[fonction-escalier|fonction en escalier]] au sens de l'intégrale de Riemann. Elle n'est pourtant combinaison finie d'aucune famille d'indicatrices d'intervalles bornés, puisqu'une telle combinaison est nulle hors d'un segment : elle n'est pas en escalier sur $\mathbb R$, et elle n'est d'ailleurs pas intégrable pour la mesure de Lebesgue.
    - |
      Les fonctions en escalier approchent toute fonction intégrable dans $L^1$, et l'erreur se calcule. Pour $f(x) = e^{-|x|}$ et $h > 0$ tel que $\frac5h$ soit entier, soit $s$ la fonction en escalier qui vaut $e^{-(k + 1)h}$ sur $[kh, (k + 1)h[$ et sur son symétrique, pour $0 \leqslant kh < 5$, et $0$ ailleurs. Comme $0 \leqslant s \leqslant f$, l'erreur est
      $$\|f - s\|_1 = 2 - 2\sum_{0 \leqslant kh < 5} h\,e^{-(k + 1)h},$$
      environ $0{,}47$ pour $h = \frac12$ et $0{,}11$ pour $h = \frac1{10}$, sans descendre sous la queue $2e^{-5} \approx 0{,}013$ négligée hors de $[-5, 5]$. Plus loin, c'est par cette densité ({{fo-densite|Densité}}, (ii)) que le lemme de Riemann-Lebesgue passe des indicatrices d'intervalles à toute fonction intégrable ({{fo-transformee|Transformée de Fourier}}, (ii)).
      ```schema lex-fonction-escalier-droite-3
      La fonction $e^{-|x|}$, en gris, et la fonction en escalier $s$ pour $h = \frac12$, en rouge, qui reste sous elle : l'aire comprise entre les deux, ombrée, est l'erreur $\|f - s\|_1 \approx 0{,}47$.
      ```
