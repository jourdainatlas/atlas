# Exemples du lexique : théorie « ℚ » (q).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  corps-ordonne:
    - |
      Les deux conditions de compatibilité sont indépendantes, et $\lex{ensemble-rationnels}{\mathbb Q}$ suffit à le voir. L'ordre renversé, défini par $x \preccurlyeq y$ si $y \leqslant x$, est un [[ordre-total|ordre total]] compatible avec l'addition, mais $0 \preccurlyeq -1$, alors que le produit $(-1)(-1) = 1$ ne vérifie pas $0 \preccurlyeq 1$ : la condition sur les produits tombe, et avec elle la positivité des carrés.

      À l'inverse, l'ordre $\preccurlyeq'$ qui place $0$ avant tout rationnel et range les rationnels non nuls comme d'habitude vérifie la condition sur les produits, puisque $0 \preccurlyeq' xy$ quels que soient $x$ et $y$. Il ne respecte pas l'addition : de $0 \preccurlyeq' -1$, on tirerait $1 \preccurlyeq' 0$ en ajoutant $1$, ce qui est faux.
    - |
      Dans un corps ordonné, une somme de carrés est positive, par {{q-ordre|Ordre de ℚ}}, (i), puisqu'en ajoutant un élément positif à un autre on reste au-dessus de $0$. Or $-1$ est strictement négatif, puisque $1 > 0$ ; il n'est donc jamais une somme de carrés.

      Cela interdit tout ordre de corps ordonné sur $\lex{anneau-zn}{\mathbb Z/p\mathbb Z}$, pour $p$ premier, où $-\overline 1$ est la somme de $p - 1$ carrés égaux à $\overline 1^2$, puisque $p \cdot \overline 1 = \overline 0$. Il en faut parfois beaucoup moins : $-\overline 1 = \overline 2^2$ dans $\mathbb Z/5\mathbb Z$, et $-\overline 1 = \overline 1^2 + \overline 1^2 + \overline 2^2$ dans $\mathbb Z/7\mathbb Z$.
    - |
      Les inégalités ne se multiplient membre à membre qu'entre éléments positifs. Si $0 \leqslant x \leqslant y$ et $0 \leqslant z \leqslant t$, alors $xz \leqslant yz \leqslant yt$, en appliquant deux fois le point (i) de {{q-ordre|Ordre de ℚ}}, une fois avec $z \geqslant 0$ et une fois avec $y \geqslant 0$. Sans la positivité, la conclusion tombe : dans $\mathbb Q$, on a $-2 \leqslant 1$ et $-3 \leqslant 1$, mais $(-2)(-3) = 6 > 1$.

      Il faut aussi se méfier de l'intuition selon laquelle un carré dépasse le nombre. Si $0 < x < 1$, alors $x - x^2 = x(1 - x)$ est strictement positif, comme produit de deux éléments strictement positifs d'un corps : ainsi $(2/3)^2 = 4/9 < 2/3$.

  archimedien:
    - |
      La propriété d'Archimède dit qu'en répétant un pas $x > 0$, aussi petit soit-il, on finit par dépasser n'importe quel $y$. Pour $x = 2/5$ et $y = 7/3$, le premier multiple de $x$ qui dépasse $y$ est $6x = 12/5$, puisque $5x = 2 < 7/3 < 12/5$.

      ```schema lex-archimedien-1
      Les sauts de longueur $x = 2/5$ partent de $0$ ; les cinq premiers s'arrêtent avant $y = 7/3$, et le sixième, en rouge, le franchit et atteint $12/5$.
      ```

      La preuve de {{q-archimede|Archimède, densité}}, (i), qui écrit $x = a/b$ et $y = c/d$, fournit $n = b(|c| + 1) = 5 \cdot 8 = 40$, qui convient aussi, puisque $40x = 16$. Elle donne un entier qui convient, et non le plus petit.
    - |
      Un [[corps-ordonne|corps ordonné]] n'est pas toujours archimédien. La seconde remarque de {{q-archimede|Archimède, densité}} fait du [[corps-fractions|corps des fractions]] $\mathbb Q(X)$ de $\lex{anneau-polynomes}{\mathbb Q[X]}$ un corps ordonné, où $P/Q \geqslant 0$ si et seulement si $PQ$ est nul ou de [[coefficient-dominant|coefficient dominant]] strictement positif. Avec $x = 1$ et $y = X$, aucun entier ne convient, puisque $X - n$, [[polynome-unitaire|unitaire]], est positif : $n < X$ pour tout $n \in \lex{ensemble-entiers-naturels}{\mathbb N}$.

      Le défaut ne tient pas au choix de $x = 1$. Pour $x = 1/X$ et $y = 1$, on a $n \cdot (1/X) = n/X < 1$ pour tout $n$, puisque $1 - n/X = (X - n)/X$ et que $(X - n)X$ a pour coefficient dominant $1$ : les multiples de $1/X$ restent tous sous $1$.
    - |
      Dans un corps ordonné, la propriété d'Archimède équivaut à l'absence d'éléments infiniment petits : pour tout $x > 0$, il existe $n \geqslant 1$ tel que $1/n < x$. Dans un sens, on l'applique à $x$ et à $y = 1$, puis on multiplie $nx > 1$ par $1/n > 0$ ({{q-ordre|Ordre de ℚ}}, (i)) ; dans l'autre, si $y > 0$, un entier $n$ tel que $1/n < x/y$ vérifie $nx > y$, et si $y \leqslant 0$, $n = 1$ convient.

      Pour $x = 3/700$, le plus petit $n$ convenable est $234$, puisque $233 \cdot 3 = 699 < 700 < 702 = 234 \cdot 3$. Dans le corps $\mathbb Q(X)$ de l'exemple précédent, au contraire, $0 < 1/X < 1/n$ pour tout $n \geqslant 1$. Plus loin, on verra qu'un corps ordonné complet est toujours archimédien ({{rr-archimede|Archimède, densité de ℚ}}) : $\mathbb Q(X)$ n'a donc pas la propriété de la borne supérieure.

  ensemble-rationnels:
    - |
      Les opérations de $\mathbb Q$ se calculent sur des représentants quelconques, et le résultat ne dépend pas de leur choix. Avec les formules du [[corps-fractions|corps des fractions]], les couples $(1, 2)$ et $(1, 3)$ ont pour somme $(1 \cdot 3 + 2 \cdot 1,\ 2 \cdot 3) = (5, 6)$. Si l'on remplace $(1, 2)$ par $(2, 4)$, équivalent puisque $1 \cdot 4 = 2 \cdot 2$, on obtient $(10, 12)$, encore équivalent à $(5, 6)$ car $10 \cdot 6 = 12 \cdot 5$.

      L'équation $2x = 1$, sans solution dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, où $2x$ est toujours pair, a la solution $1/2$ dans $\mathbb Q$, puisque $(2/1) \cdot (1/2) = 2/2$ et que $(2, 2) \sim (1, 1)$. C'est pour inverser les entiers non nuls que l'on construit $\mathbb Q$.
    - |
      L'exclusion des couples $(a, 0)$ n'est pas une précaution de forme : sans elle, la relation $ad = bc$ cesserait d'être [[relation-transitive|transitive]]. Sur $\mathbb Z \times \mathbb Z$ tout entier, on aurait $(1, 1) \sim (0, 0)$, puisque $1 \cdot 0 = 1 \cdot 0$, et $(0, 0) \sim (0, 1)$, puisque $0 \cdot 1 = 0 \cdot 0$, mais pas $(1, 1) \sim (0, 1)$, car $1 \cdot 1 \neq 1 \cdot 0$. Le couple $(0, 0)$ relierait ainsi $1$ à $0$.
    - |
      Un rationnel racine d'un [[polynome-unitaire|polynôme unitaire]] de $\lex{anneau-polynomes}{\mathbb Z[X]}$ est un entier. Soit $a/b$ son [[ecriture-irreductible|écriture irréductible]], racine de $X^n + c_{n-1}X^{n-1} + \cdots + c_0$. En multipliant par $b^n$, on obtient
      $$a^n = -b\,(c_{n-1}a^{n-1} + \cdots + c_0 b^{n-1}),$$
      donc $b \mid a^n$. Si l'on avait $b \geqslant 2$, un [[nombre-premier|nombre premier]] $p$ diviserait $b$, donc $a^n$, donc $a$ par le lemme d'Euclide ({{z-premiers|Nombres premiers}}, (i)), ce qui contredit $a \wedge b = 1$.

      Ainsi $b = 1$. Comme aucun entier n'a pour carré $2$, puisque $x^2 \leqslant 1$ si $|x| \leqslant 1$ et $x^2 \geqslant 4$ sinon, le polynôme $X^2 - 2$ n'a pas de [[racine-polynome|racine]] dans $\mathbb Q$. Plus loin, on en tirera que $\mathbb Q$ n'a pas la propriété de la borne supérieure ({{q-irrationnel|Irrationalité de √2}}).

  ecriture-irreductible:
    - |
      On obtient l'écriture irréductible en divisant les deux termes par leur [[pgcd|PGCD]], comme dans la preuve de {{q-construction|Construction de ℚ}}. Comme $252 \wedge 198 = 18$, calculé par l'algorithme d'Euclide au nœud {{z-bezout|PGCD, Bézout}}, on trouve $252/198 = 14/11$, avec $14 \wedge 11 = 1$. Pour $(-84)/(-60)$, on change d'abord les deux signes, puis $84 \wedge 60 = 12$ donne $7/5$.
    - |
      Chacune des deux conditions est nécessaire à l'unicité. Sans la condition $b \geqslant 1$, le rationnel $3/2$ aurait deux écritures à termes [[premiers-entre-eux|premiers entre eux]], $3/2$ et $(-3)/(-2)$. Sans la condition $a \wedge b = 1$, il en aurait une infinité, à savoir $3k/2k$ pour tout entier $k \geqslant 1$, puisque $3k \cdot 2 = 2k \cdot 3$.
    - |
      L'écriture irréductible n'est pas stable par les opérations, ce qui est une raison de définir $\lex{ensemble-rationnels}{\mathbb Q}$ comme un quotient. Les formules du [[corps-fractions|corps des fractions]] donnent $\frac16 + \frac13 = \frac{9}{18}$ et $\frac23 \cdot \frac34 = \frac{6}{12}$ : partant de fractions irréductibles, on doit encore simplifier, ici par $9$ et par $6$, pour retrouver l'écriture irréductible $\frac12$. Plus loin, c'est pourtant elle qui permettra d'injecter $\mathbb Q$ dans $\mathbb Z \times \mathbb N$ sans aucun choix ({{q-denombrable|ℚ est dénombrable}}).
