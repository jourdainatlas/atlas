# Exemples du lexique : théorie « ℂ » (c).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  nombre-complexe:
    - |
      Les puissances de $i$ se répètent de quatre en quatre : $i^2 = -1$, $i^3 = -i$ et $i^4 = 1$, de sorte que $i^n$ ne dépend que du reste de la [[division-euclidienne|division euclidienne]] de $n$ par $4$. Ainsi $i^{2026} = i^2 = -1$, puisque $2026 = 4 \cdot 506 + 2$. Dans $\lex{anneau-polynomes}{\mathbb R[X]}$, cela se lit sur le reste de la division de $X^n$ par $X^2 + 1$, qui vaut toujours $1$, $X$, $-1$ ou $-X$.
    - |
      L'équation $z^2 = -4$ n'a pas de solution réelle, un carré étant positif dans le [[corps-ordonne|corps ordonné]] $\lex{ensemble-reels}{\mathbb R}$ ({{q-ordre|Ordre de ℚ}}, (i)). Elle en a exactement deux parmi les nombres complexes, $2i$ et $-2i$. Leurs carrés valent $4i^2 = -4$, et si $z^2 = -4 = (2i)^2$, alors $(z - 2i)(z + 2i) = 0$, d'où $z = \pm 2i$, le [[corps]] $\lex{ensemble-complexes}{\mathbb C}$ étant [[anneau-integre|intègre]].
    - |
      Le nombre $2i$, qui n'est pas réel, est lui aussi un carré : $(1 + i)^2 = 1 + 2i + i^2 = 2i$, et de même $(-1 - i)^2 = 2i$. Plus loin, on montrera que tout nombre complexe a une racine carrée, donnée par une formule explicite ({{c-racines-carrees|Racines carrées complexes}}).

  module-complexe:
    - |
      Le module est multiplicatif, ce qui fournit des identités entre entiers. De $(2 + i)^2 = 3 + 4i$, on tire $|3 + 4i| = |2 + i|^2 = 5$, c'est-à-dire $3^2 + 4^2 = 5^2$ ; de même, $(3 + 2i)^2 = 5 + 12i$ donne $5^2 + 12^2 = 13^2$. En général, $(a + ib)^2 = (a^2 - b^2) + 2abi$ donne
      $$(a^2 - b^2)^2 + (2ab)^2 = (a^2 + b^2)^2.$$

      ```schema lex-module-complexe-1
      Le segment bleu, de $0$ à $2 + i$, a pour longueur $\sqrt 5$, et le segment rouge, de $0$ à son carré $3 + 4i$, pour longueur $5$, carré de la précédente. C'est l'hypoténuse du triangle rectangle en pointillé, de côtés $3$ et $4$.
      ```
    - |
      Le module n'est pas additif, et l'inégalité $|z + w| \leqslant |z| + |w|$ ({{c-calcul|Conjugué, module}}, (iv)) est en général stricte : $|1 + i| = \sqrt 2$, alors que $|1| + |i| = 2$, et $\sqrt 2 < 2$ puisque $2 < 4$ et que la racine carrée est strictement croissante ({{c-racine-reelle|Racine carrée réelle}}). L'égalité a lieu, par exemple, pour $z = 1$ et $w = 2$, dont le second est un multiple réel positif du premier.
    - |
      Les nombres complexes de module $1$ sont ceux dont l'inverse est le [[conjugue-complexe|conjugué]], puisque $z\bar z = |z|^2$. Ils sont stables par produit, puisque $|zw| = |z|\,|w|$. Ainsi $u = (3 + 4i)/5$ a pour inverse $(3 - 4i)/5$, et $u^2 = (-7 + 24i)/25$ est encore de module $1$, conformément à $7^2 + 24^2 = 625 = 25^2$.

  ensemble-complexes:
    - |
      Calculer dans $\mathbb C$, c'est calculer dans $\lex{anneau-polynomes}{\mathbb R[X]}$, puis prendre le reste de la [[division-euclidienne-polynomes|division euclidienne]] par $X^2 + 1$. Ainsi
      $$\begin{aligned} &(1 + 2X)(3 - X) \\ &\quad = -2X^2 + 5X + 3 \\ &\quad = -2(X^2 + 1) + 5X + 5, \end{aligned}$$
      d'où $(1 + 2i)(3 - i) = 5 + 5i$. On obtient le même résultat en développant directement et en remplaçant $i^2$ par $-1$.
    - |
      L'inverse d'un élément non nul s'obtient par une relation de Bézout dans $\mathbb R[X]$, et c'est la raison pour laquelle le quotient est un [[corps]]. De $(1 + 2X)(1 - 2X) = 1 - 4X^2 = -4(X^2 + 1) + 5$, on tire
      $$(1 + 2X) \cdot \frac{1 - 2X}{5} + \frac45\,(X^2 + 1) = 1,$$
      et, en passant aux classes, $(1 + 2i)^{-1} = \frac15 - \frac25\,i$.
    - |
      La maximalité de l'idéal est indispensable. Le quotient $\mathbb R[X]/(X^2 - 1)$ a la même forme, tout élément s'y écrivant de manière unique $a + bj$, où $j$ est la classe de $X$, mais $j^2 = 1$ et $(j - 1)(j + 1) = 0$, avec $j - 1 \neq 0$ et $j + 1 \neq 0$, puisque $X^2 - 1$, de degré $2$, ne divise ni $X - 1$ ni $X + 1$. Ce quotient n'est donc pas [[anneau-integre|intègre]], ni un corps : $X^2 - 1 = (X - 1)(X + 1)$ n'est pas [[polynome-irreductible|irréductible]].

  conjugue-complexe:
    - |
      Le conjugué donne l'inverse sans division de polynômes. Pour $z = 1 + 2i$, on a $\bar z = 1 - 2i$ et $z\bar z = 1 + 4 = 5$, d'où $1/z = \bar z/5 = \frac15 - \frac25\,i$ ({{c-calcul|Conjugué, module}}, (iii)). Pour $z = 3 + 4i$, de même, $z\bar z = 25$ et $1/z = (3 - 4i)/25$.
    - |
      Les racines non réelles d'un polynôme à coefficients réels vont par paires conjuguées, car $P(\bar z) = \overline{P(z)}$ par le point (ii) de {{c-calcul|Conjugué, module}}. Ainsi $X^2 - 2X + 5$ a les racines $1 + 2i$ et $1 - 2i$, puisque $(1 + 2i)^2 = -3 + 4i$ et que $-3 + 4i - 2(1 + 2i) + 5 = 0$. Sans l'hypothèse sur les coefficients, la conclusion tombe : $X - i$ a la racine $i$, mais non $-i$, puisque $-i - i = -2i \neq 0$.
    - |
      Les parties réelle et imaginaire s'expriment par le conjugué : $\operatorname{Re} z = (z + \bar z)/2$ et $\operatorname{Im} z = (z - \bar z)/(2i)$. Pour $z = 3 - 2i$, on trouve $z + \bar z = 6$ et $z - \bar z = -4i$, d'où $\operatorname{Re} z = 3$ et $\operatorname{Im} z = -2$. Plus loin, on verra que l'identité et la conjugaison sont les seuls automorphismes de corps de $\lex{ensemble-complexes}{\mathbb C}$ qui fixent chaque réel ({{c-automorphismes|Automorphismes}}).

  partie-reelle:
    - |
      La partie réelle est additive et vérifie $\operatorname{Re}(\lambda z) = \lambda \operatorname{Re} z$ pour $\lambda$ réel, mais elle n'est pas multiplicative. Pour $z = 1 + 2i$ et $w = 3 - i$, on a $zw = 5 + 5i$, donc $\operatorname{Re}(zw) = 5$, alors que $\operatorname{Re} z \cdot \operatorname{Re} w = 3$. En développant $(a + ib)(c + id)$, on trouve $\operatorname{Re}(zw) = \operatorname{Re} z \operatorname{Re} w - \operatorname{Im} z \operatorname{Im} w$, où $\operatorname{Im}$ désigne la [[partie-imaginaire|partie imaginaire]], et le terme correctif vaut ici $-2 \cdot (-1) = 2$.
    - |
      Pour un polynôme réel $P = \sum_k a_kX^k$, la classe de $P$ dans $\lex{ensemble-complexes}{\mathbb C}$ est l'[[evaluation-polynome|évaluation]] $P(i)$, par l'unicité de {{pol-evaluation|Évaluation}}, (i). La partie réelle de $P(i)$ ne retient que les coefficients d'indice pair, avec des signes alternés, puisque $i^{2m} = (-1)^m$ et $i^{2m+1} = (-1)^m i$ :
      $$\operatorname{Re} P(i) = a_0 - a_2 + a_4 - \cdots.$$
      Pour $P = 1 + X + X^2 + X^3 + X^4$, on trouve $P(i) = 1 + i - 1 - i + 1 = 1$, de partie réelle $1 - 1 + 1 = 1$.
    - |
      Les nombres complexes de partie réelle strictement positive sont stables par addition, mais pas par multiplication : $\operatorname{Re}(1 + i) = 1$, alors que $(1 + i)^2 = 2i$ a une partie réelle nulle, et $(1 + i)^3 = -2 + 2i$ une partie réelle strictement négative. Ils ne peuvent donc pas jouer le rôle des éléments positifs d'un ordre de corps sur $\mathbb C$. Plus loin, on verra qu'aucun ordre ne convient ({{c-non-ordonnable|ℂ n'est pas ordonné}}).

  partie-imaginaire:
    - |
      La partie imaginaire est un réel : celle de $3 - 2i$ est $-2$, et non $-2i$. C'est la confusion la plus fréquente, et elle fausse les calculs dès que l'on multiplie. Avec la valeur correcte, la formule $\operatorname{Im}(zw) = \operatorname{Re} z \operatorname{Im} w + \operatorname{Im} z \operatorname{Re} w$, obtenue en développant, donne $\operatorname{Im}\big((3 - 2i)^2\big) = 3 \cdot (-2) + (-2) \cdot 3 = -12$, et en effet $(3 - 2i)^2 = 5 - 12i$.
    - |
      Le carré d'un nombre complexe peut être réel sans que ce nombre le soit. Comme $(a + ib)^2 = (a^2 - b^2) + 2abi$, le carré est réel si et seulement si $2ab = 0$, c'est-à-dire $a = 0$ ou $b = 0$, puisque $\lex{ensemble-reels}{\mathbb R}$ est intègre. Ainsi $(2i)^2 = -4$ est réel, alors que $\operatorname{Im}(2i) = 2 \neq 0$.
    - |
      Un polynôme réel $P$ s'annule en $i$ si et seulement si les parties réelle et imaginaire de $P(i)$ sont nulles, et, $P(i)$ étant la classe de $P$ dans $\lex{ensemble-complexes}{\mathbb C}$, si et seulement si $X^2 + 1$ divise $P$. Pour $P = X^3 + X^2 + X + 1$, on trouve $P(i) = -i - 1 + i + 1$, de parties réelle et imaginaire $1 - 1 = 0$ et $1 - 1 = 0$ ; de fait, $P = (X + 1)(X^2 + 1)$.
