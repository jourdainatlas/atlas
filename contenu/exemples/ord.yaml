# Exemples du lexique : théorie « Structures d'ordre » (ord).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  relation-ordre:
    - |
      Les trois conditions sont indépendantes : sur $E = \{a, b, c\}$, formé de trois éléments distincts, chacune peut manquer seule. La relation $E \times E$ est [[relation-reflexive|réflexive]] et [[relation-transitive|transitive]], mais pas [[relation-antisymetrique|antisymétrique]], puisque $a$ et $b$ y sont en relation dans les deux sens. Notons $\Delta_E = \{(x, x) : x \in E\}$ l'égalité.

      La relation $\Delta_E \cup \{(a, b), (b, c)\}$ est réflexive et antisymétrique, mais pas transitive, faute du couple $(a, c)$. Enfin la relation vide est antisymétrique et transitive, les deux conditions étant vides, mais elle n'est pas réflexive. Aucune des trois conditions ne se déduit donc des deux autres.
    - |
      Un même ensemble porte en général plusieurs relations d'ordre, et l'on peut les compter sur $E = \{a, b, c\}$. Il y a l'égalité ; six ordres où seuls deux éléments distincts sont comparables ; trois où un élément est inférieur aux deux autres, incomparables entre eux, et trois où il leur est supérieur ; enfin six ordres où les trois éléments se suivent. Cela fait dix-neuf relations d'ordre, dont six [[ordre-total|totales]].
    - |
      L'intersection de deux relations d'ordre sur $E$ est une relation d'ordre, car chacune des trois conditions passe à l'intersection. Il n'en va pas de même de la réunion. Sur $\{a, b\}$, avec $a \neq b$, les relations $\Delta \cup \{(a, b)\}$ et $\Delta \cup \{(b, a)\}$, où $\Delta$ est l'égalité, sont des ordres, mais leur réunion est $\{a, b\} \times \{a, b\}$, qui n'est pas antisymétrique.

  ordre-total:
    - |
      Sur le [[produit-cartesien|produit]] $\{a, b\} \times \{a, b\}$, où $\{a, b\}$ est ordonné par $a < b$, deux ordres viennent naturellement. L'ordre produit, où $(x, y) \leqslant (x', y')$ si $x \leqslant x'$ et $y \leqslant y'$, n'est pas total : $(a, b)$ et $(b, a)$ ne sont pas comparables. L'ordre lexicographique, où $(x, y)$ précède $(x', y')$ si $x < x'$, ou si $x = x'$ et $y \leqslant y'$, est total.

      Il range les quatre couples en
      $$(a, a) < (a, b) < (b, a) < (b, b),$$
      comme les mots du dictionnaire, qu'on compare d'abord par leur première lettre.

      ```schema lex-ordre-total-1
      À gauche, l'ordre produit : un trait monte d'un couple vers un couple plus grand, sans couple intermédiaire, et les deux couples du milieu, en rouge, ne sont reliés par aucune montée. À droite, l'ordre lexicographique range les mêmes quatre couples sur une seule ligne.
      ```
    - |
      L'égalité est une [[relation-ordre|relation d'ordre]] sur tout ensemble $E$ ; elle n'est totale que si $E$ a au plus un élément, car deux éléments distincts ne sont jamais comparables pour elle. Un ordre total se situe à l'autre bout : deux éléments distincts y sont toujours comparables, et dans un seul sens, puisque l'antisymétrie interdit les deux à la fois.
    - |
      Pour un ordre total, l'[[ordre-strict|ordre strict]] associé vérifie la trichotomie : pour tous $x$ et $y$, on a exactement l'une des relations $x < y$, $x = y$, $y < x$. La totalité en donne au moins une, et l'asymétrie du point (iii) de {{od-ordre|Ordres larges, ordres stricts}}, avec l'irréflexivité, exclut d'en avoir deux. Plus loin, c'est sous cette forme que sera démontrée la comparaison des ordinaux ({{o-comparaison|Les ordinaux sont bien ordonnés}}, (i)).

  majorant:
    - |
      Dans $(\lex{ensemble-parties}{\mathcal P}(E), \subset)$, les majorants d'une famille $\mathcal A$ de parties sont exactement les parties qui contiennent la réunion $\bigcup \mathcal A$. Pour $E = \{a, b, c\}$ et $\mathcal A = \{\{a\}, \{b\}\}$, ce sont $\{a, b\}$ et $E$ : un majorant n'appartient pas forcément à la partie qu'il majore, et il n'est pas unique en général.
    - |
      Être majorée dépend de l'ensemble ordonné où l'on se place. La partie $\{\{a\}, \{b\}\}$, avec $a \neq b$, est majorée dans $\mathcal P(\{a, b\})$, par $\{a, b\}$. Elle ne l'est pas dans $F = \{\varnothing, \{a\}, \{b\}\}$, muni de l'[[ordre-induit|ordre induit]], puisque aucun élément de $F$ ne contient à la fois $a$ et $b$.
    - |
      Plus une partie est grosse, moins elle a de majorants : si $A \subset B$, tout majorant de $B$ majore $A$. À un bout, tout élément de $E$ majore la partie vide, qui est donc majorée dès que $E$ est non vide. À l'autre, $E$ n'est majoré, comme partie de lui-même, que s'il a un [[plus-grand-element|plus grand élément]], car un majorant de $E$ pris dans $E$ en est un.

  borne-superieure:
    - |
      Dans l'ensemble des [[relation-equivalence|relations d'équivalence]] sur $E = \{a, b, c\}$, ordonné par inclusion de parties de $E \times E$, la borne supérieure n'est pas la réunion. Notons $\Delta$ l'égalité et $R_{ab} = \Delta \cup \{(a, b), (b, a)\}$, de classes $\{a, b\}$ et $\{c\}$, puis de même $R_{bc}$ et $R_{ac}$.

      Une relation d'équivalence qui contient $R_{ab}$ et $R_{bc}$ contient $(a, c)$ par transitivité, puis $(c, a)$ par symétrie : c'est $E \times E$. Ainsi
      $$\sup\{R_{ab}, R_{bc}\} = E \times E,$$
      alors que la réunion $R_{ab} \cup R_{bc}$, qui contient $(a, b)$ et $(b, c)$ sans contenir $(a, c)$, n'est pas transitive.

      ```schema lex-borne-superieure-1
      Les cinq relations d'équivalence sur {a, b, c}, un trait montant de chacune vers celles qui la contiennent sans intermédiaire. Les deux relations en bleu n'ont qu'un majorant, la relation en rouge, qui est donc leur borne supérieure et contient strictement leur réunion.
      ```
    - |
      La borne supérieure dépend de l'ensemble ordonné ambiant. Dans $\lex{ensemble-parties}{\mathcal P}(\{a, b, c\})$, la partie $\{\{a\}, \{b\}\}$ a pour borne supérieure $\{a, b\}$. Dans $F = \{\varnothing, \{a\}, \{b\}, \{a, b, c\}\}$, muni de l'[[ordre-induit|ordre induit]], son seul [[majorant]] est $\{a, b, c\}$, qui en est donc la borne supérieure dans $F$.
    - |
      Une partie majorée peut n'avoir pas de borne supérieure. Soit $G = \{\varnothing, \{a\}, \{b\}, \{a, b, c\}, \{a, b, d\}\}$, partie de $\mathcal P(\{a, b, c, d\})$ munie de l'ordre induit. Les majorants de $\{\{a\}, \{b\}\}$ dans $G$ sont $\{a, b, c\}$ et $\{a, b, d\}$, qui ne sont pas comparables : leur ensemble n'a pas de [[plus-petit-element|plus petit élément]], et la borne supérieure n'existe pas.

      ```schema lex-borne-superieure-3
      Un trait monte d'un élément de G vers un élément de G qui le contient, sans intermédiaire. Les deux majorants de {a} et de {b}, en bleu, sont reliés chacun aux deux, mais aucun n'est au-dessous de l'autre : il n'y a pas de plus petit majorant.
      ```

  bon-ordre:
    - |
      Si $E$ et $F$ sont bien ordonnés, l'ordre lexicographique sur $E \times F$, où $(x, y)$ précède $(x', y')$ si $x < x'$, ou si $x = x'$ et $y \leqslant y'$, est un bon ordre. C'est une relation d'ordre. Elle est réflexive ; deux couples qui se précèdent l'un l'autre ont même première coordonnée, puis même seconde ; et si $(x, y)$ précède $(x', y')$, qui précède $(x'', y'')$, ou bien l'une des comparaisons des premières coordonnées est stricte, et $x < x''$, ou bien $x = x' = x''$ et $y \leqslant y' \leqslant y''$.

      Soit $S$ une partie non vide de $E \times F$. On prend le [[plus-petit-element|plus petit élément]] $x_0$ de l'ensemble des premières coordonnées des éléments de $S$, puis le plus petit élément $y_0$ de $\{y : (x_0, y) \in S\}$, qui est non vide. Tout $(x, y) \in S$ vérifie alors $x_0 < x$, ou $x = x_0$ et $y_0 \leqslant y$ : le couple $(x_0, y_0)$ est le plus petit élément de $S$.
    - |
      Avoir un élément minimal ne suffit pas. Dans $(\lex{ensemble-parties}{\mathcal P}(\{a, b\}), \subset)$, avec $a \neq b$, toute partie non vide a un [[element-minimal|élément minimal]], mais $\{\{a\}, \{b\}\}$ en a deux et n'a pas de plus petit élément : l'inclusion n'est pas un bon ordre, faute d'être totale, comme le veut le point (i) de {{od-bon-ordre|Bons ordres}}. C'est pourquoi la définition des ordinaux demandera un ordre à la fois bien fondé et total.

      Pour un vrai bon ordre, le point (iii) est déjà contraignant : la seule application strictement croissante de $\{a, b, c\}$, ordonné par $a < b < c$, dans lui-même est l'identité, car $c \leqslant f(c)$ donne $f(c) = c$, puis $b \leqslant f(b) < c$ donne $f(b) = b$, et de même $f(a) = a$.
    - |
      Plus loin, l'ordre usuel de $\mathbb N$ sera un bon ordre ({{n-ordre|L'appartenance est un bon ordre sur ω}}), mais pas celui de $\mathbb Z$ ({{z-ordre|L'ordre de ℤ}}). Dans $\mathbb Z$, l'application $x \mapsto x - 1$ est strictement croissante et vérifie $f(x) < x$, contrairement au point (iii) de {{od-bon-ordre|Bons ordres}}, et $\mathbb Z$ lui-même n'a pas de plus petit élément. Un ordre total n'est donc pas toujours un bon ordre.

  inductif-ordre:
    - |
      Un ensemble ordonné qui a un [[plus-grand-element|plus grand élément]] est inductif, celui-ci majorant toute [[chaine|chaîne]]. C'est le cas de $(\lex{ensemble-parties}{\mathcal P}(E), \subset)$, où $E$ majore tout. Ce cas est sans surprise : la notion n'a d'intérêt que pour les ensembles ordonnés qui n'ont pas de plus grand élément.
    - |
      Les [[relation-ordre|relations d'ordre]] sur un ensemble $E$, ordonnées par inclusion de parties de $E \times E$, forment un ensemble inductif. L'égalité majore la chaîne vide. Si $\mathcal C$ est une chaîne non vide d'ordres, leur réunion $R$ est réflexive, et deux couples pris dans $R$ appartiennent à deux ordres de $\mathcal C$, comparables, donc tous deux au plus grand des deux.

      Ce dernier, transitif et antisymétrique, montre que $R$ l'est aussi : $R$ est un ordre, qui majore $\mathcal C$. Pourtant, si $E$ contient deux éléments distincts $a$ et $b$, il n'y a pas de plus grand ordre, puisque aucun ordre ne contient à la fois $(a, b)$ et $(b, a)$.
    - |
      Un ensemble totalement ordonné $E$ est inductif si et seulement s'il a un plus grand élément. En effet, $E$ est lui-même une chaîne, et un [[majorant]] de $E$ pris dans $E$ en est le plus grand élément. Plus loin, $\mathbb N$, totalement ordonné et sans plus grand élément ({{n-ordre|L'appartenance est un bon ordre sur ω}}), ne sera donc pas inductif au sens de l'ordre, alors qu'il sera le plus petit ensemble inductif au premier sens, celui de l'axiome de l'infini : les deux entrées du lexique ne se confondent pas.

  chaine:
    - |
      Dans $\lex{ensemble-parties}{\mathcal P}(E)$, avec $E = \{a, b, c\}$, la famille $\{\varnothing, \{b\}, \{b, c\}, E\}$ est une chaîne, et on ne peut lui ajouter aucune partie sans perdre la totalité. Chacune des quatre autres parties, $\{a\}$, $\{c\}$, $\{a, b\}$ et $\{a, c\}$, est en effet incomparable à $\{b\}$ ou à $\{b, c\}$. Une chaîne maximale contient une partie de chaque taille, chacune ayant un point de plus que la précédente : elle revient à une manière d'ajouter les points un à un, et il y en a six.

      ```schema lex-chaine-1
      Les parties de {a, b, c}, un trait montant d'une partie vers une partie qui contient un point de plus. La chaîne, en rouge, monte de ∅ à {a, b, c} en ajoutant b, puis c, puis a ; chacune des quatre autres parties est incomparable à l'une des parties rouges.
      ```
    - |
      Une réunion de deux chaînes n'est pas une chaîne en général : $\{\varnothing, \{a\}\}$ et $\{\varnothing, \{b\}\}$ en sont, mais leur réunion contient $\{a\}$ et $\{b\}$, incomparables si $a \neq b$. En revanche, toute partie d'une chaîne $C$ en est une, puisque l'[[ordre-induit|ordre induit]] sur une partie de $C$ est la restriction de l'ordre total de $C$.
    - |
      Pour l'égalité, qui est une relation d'ordre sur tout ensemble, les chaînes sont la partie vide et les singletons, deux éléments distincts n'étant jamais comparables. Pour un [[ordre-total|ordre total]], à l'inverse, toute partie est une chaîne. Plus loin, le lemme de Zorn ({{o-zorn|Lemme de Zorn}}) ne demandera de majorer que les chaînes, ce qui est bien moins que de majorer toutes les parties.

  intervalle:
    - |
      Dans un ensemble totalement ordonné $E = \{a, b, c\}$, avec $a < b < c$, la partie $\{a, b\}$ est un intervalle, mais $\{a, c\}$ n'en est pas un : elle contient $a$ et $c$ sans contenir $b$, qui est entre les deux. Un intervalle est une partie sans trou, et c'est ce trou en $b$ qui disqualifie $\{a, c\}$.
    - |
      Une réunion d'intervalles n'est pas un intervalle en général. Dans l'exemple précédent, $\{a\}$ et $\{c\}$ sont des intervalles, réduits à un point, mais leur réunion $\{a, c\}$ ne l'est pas. L'intersection, au contraire, l'est toujours ; et la partie vide est un intervalle, la condition étant vide. Ainsi la demi-droite $]{\leftarrow}, a[$ est vide quand aucun élément n'est strictement inférieur à $a$, ce qui n'en fait pas moins un intervalle.
    - |
      La forme des intervalles dépend de l'ensemble ordonné. Plus loin, dans $\mathbb Q$, la partie $\{x \in \mathbb Q : x^2 < 2\}$ sera un intervalle majoré, mais sans borne supérieure dans $\mathbb Q$ ; ce n'est ni un segment ni une demi-droite à extrémités rationnelles ; dans $\mathbb R$, au contraire, la propriété de la borne supérieure ramènera tout intervalle à l'une des formes usuelles ({{tr-intervalles|Description des intervalles de ℝ}}).

  segment:
    - |
      Dans un ensemble totalement ordonné, le segment $[a, b]$ détermine ses extrémités. L'élément $a$ appartient à $[a, b]$ et il est inférieur ou égal à chacun de ses éléments. Si $[a, b] = [a', b']$, on a donc $a \leqslant a'$ et $a' \leqslant a$, d'où $a = a'$ par antisymétrie, et de même $b = b'$.
    - |
      Une même partie peut s'écrire de plusieurs façons. Dans $E = \{a, b, c\}$, ordonné par $a < b < c$, on a $]a, c[ \,= \{b\} = [b, b]$ et $[a, c[ \,= [a, b]$. Les crochets décrivent une écriture de la partie, non une propriété qu'elle aurait : ici, un intervalle écrit « ouvert » est un segment.
    - |
      La définition suppose l'ordre [[ordre-total|total]]. Dans $\lex{ensemble-parties}{\mathcal P}(\{a, b\})$, ordonné par inclusion, avec $a \neq b$, la partie $\{X : \varnothing \subset X \subset \{a, b\}\}$ est l'ensemble tout entier, qui contient $\{a\}$ et $\{b\}$, incomparables : ce n'est plus un morceau de ligne entre deux extrémités. Plus loin, c'est aux segments de $\mathbb R$ que s'appliquera le théorème de Borel-Lebesgue ({{tr-borel-lebesgue|Théorème de Borel-Lebesgue}}).

  ordre-strict:
    - |
      Sur $\lex{ensemble-parties}{\mathcal P}(E)$, l'inclusion stricte $\subsetneq$ est l'ordre strict associé à l'inclusion. Elle est irréflexive, et $X \subsetneq Y \subsetneq Z$ entraîne $X \subsetneq Z$, car l'égalité $X = Z$ donnerait $X \subset Y \subset X$, donc $X = Y$. C'est le point (i) de {{od-ordre|Ordres larges, ordres stricts}} vu sur l'exemple fondamental.
    - |
      L'irréflexivité ne suffit pas. Sur $\{a, b\}$, avec $a \neq b$, la relation $\neq$ est irréflexive, mais elle n'est pas [[relation-transitive|transitive]] : $a \neq b$ et $b \neq a$, alors que $a = a$. Elle n'est d'ailleurs pas asymétrique, ce qui l'excluait déjà d'après le point (iii) de {{od-ordre|Ordres larges, ordres stricts}}.
    - |
      La correspondance des points (i) et (ii) de {{od-ordre|Ordres larges, ordres stricts}} se suit à la main sur $\{a, b\}$, avec $a \neq b$. Les ordres stricts y sont la relation vide, $\{(a, b)\}$ et $\{(b, a)\}$, la relation $\{(a, b), (b, a)\}$ n'étant pas transitive. En leur ajoutant la diagonale $\{(a, a), (b, b)\}$, on obtient les trois [[relation-ordre|relations d'ordre]] de $\{a, b\}$, la relation vide correspondant à l'égalité.

  element-maximal:
    - |
      Considérons les [[relation-equivalence|relations d'équivalence]] sur $E = \{a, b, c\}$ autres que $E \times E$, ordonnées par inclusion. Soit $R_{ab}$ celle de classes $\{a, b\}$ et $\{c\}$, et de même $R_{ac}$ et $R_{bc}$. Une relation d'équivalence qui contient strictement $R_{ab}$ met $c$ en relation avec $a$ ou $b$, donc avec les deux par transitivité : c'est $E \times E$, qui est exclue.

      Les trois relations $R_{ab}$, $R_{ac}$ et $R_{bc}$ sont donc maximales. Deux d'entre elles ne sont jamais comparables, et il n'y a pas de [[plus-grand-element|plus grand élément]] : comme le dit le point (iii) de {{od-majorants|Majorants, plus grand élément, borne supérieure}}, il en aurait été l'unique élément maximal.
    - |
      Être maximal dépend de la partie considérée. Dans $\lex{ensemble-parties}{\mathcal P}(\{a, b\})$, avec $a \neq b$, la partie $A = \{\varnothing, \{a\}\}$ a pour élément maximal $\{a\}$. Celui-ci n'est pas maximal dans $\mathcal P(\{a, b\})$ tout entier, où $\{a\} \subsetneq \{a, b\}$.
    - |
      Dans un ordre non total, un élément maximal unique n'est pas forcément le plus grand. Plus loin, avec $\mathbb N$ ({{n-ordre|L'appartenance est un bon ordre sur ω}}), l'ensemble formé des entiers et d'un point $m$ comparable à aucun d'eux en donnera un exemple. Le point $m$ y est le seul élément maximal, puisque tout entier est strictement inférieur à son successeur, et pourtant il ne majore aucun entier.

  isomorphisme-ordres:
    - |
      Le passage au complémentaire $X \mapsto E \setminus X$ est un isomorphisme de $(\lex{ensemble-parties}{\mathcal P}(E), \subset)$ sur $(\mathcal P(E), \supset)$, c'est-à-dire sur $\mathcal P(E)$ muni de l'ordre opposé. C'est une [[bijection]], sa propre réciproque, et $X \subset Y$ équivaut à $E \setminus Y \subset E \setminus X$. Il échange réunions et intersections : c'est la forme, en termes d'ordre, des lois de De Morgan.
    - |
      Une bijection croissante n'est pas toujours un isomorphisme. Sur $\{a, b\} \times \{a, b\}$, avec $a < b$, comparons l'ordre produit, coordonnée par coordonnée, et l'ordre lexicographique, où l'on compare d'abord les premières coordonnées. L'identité, du premier vers le second, est croissante, mais sa réciproque ne l'est pas : $(a, b)$ précède $(b, a)$ pour l'ordre lexicographique, pas pour l'ordre produit.

      L'hypothèse de totalité au départ, dans le point (iii) de {{od-croissantes|Applications croissantes, isomorphismes d'ordres}}, ne peut donc pas être omise.
    - |
      Les isomorphismes de $(\mathcal P(E), \subset)$ sur lui-même sont exactement les $X \mapsto \sigma(X)$, où $\sigma$ est une bijection de $E$. Un tel isomorphisme $f$ fixe $\varnothing$, seule partie contenue dans toutes les autres, et permute les singletons, seules parties non vides dont l'unique partie strictement plus petite est $\varnothing$ ; il définit ainsi $\sigma$ par $f(\{x\}) = \{\sigma(x)\}$.

      Comme $\{y\} \subset X$ équivaut à $f(\{y\}) \subset f(X)$, la partie $f(X)$ contient exactement les $\sigma(y)$, $y \in X$ : $f(X) = \sigma(X)$. Plus loin, les bons ordres se montreront au contraire rigides : entre deux ordinaux, le seul isomorphisme possible sera l'identité ({{o-representation|Tout bon ordre est isomorphe à un unique ordinal}}).

  treillis-complet:
    - |
      L'ensemble des [[relation-equivalence|relations d'équivalence]] sur $E$, ordonné par inclusion, est un treillis complet. L'intersection d'une famille non vide de relations d'équivalence en est une, chacune des trois propriétés passant à l'intersection, et c'en est la [[borne-inferieure|borne inférieure]] ; celle de la famille vide est $E \times E$.

      L'énoncé jumeau de celui de {{od-treillis|Treillis et treillis complets}}, obtenu par l'ordre opposé, donne alors toutes les bornes supérieures. Celle d'une famille est l'intersection des relations d'équivalence qui contiennent toutes ses relations : la plus petite relation d'équivalence qui les contient.
    - |
      Les [[relation-ordre|relations d'ordre]] sur $E = \{a, b\}$, avec $a \neq b$, ordonnées par inclusion, ne forment pas un treillis complet. Toute famille non vide d'ordres a pour borne inférieure leur intersection, qui est un ordre. Mais les deux ordres totaux, $\Delta \cup \{(a, b)\}$ et $\Delta \cup \{(b, a)\}$, où $\Delta$ est l'égalité, n'ont aucun [[majorant]], aucun ordre ne contenant à la fois $(a, b)$ et $(b, a)$.

      Ce qui manque est la borne inférieure de la famille vide, c'est-à-dire un plus grand élément : la seule existence des bornes inférieures des familles non vides ne suffit pas.
    - |
      Plus loin, dans $\mathbb R$ ({{r|$\mathbb R$}}), un segment $[x, y]$ sera un treillis complet, grâce à la propriété de la borne supérieure. La droite $\mathbb R$ elle-même, totalement ordonnée, sera un treillis, avec $\max$ et $\min$ pour bornes d'une paire, mais elle ne sera pas complète : la partie formée de tous ses éléments n'y a pas de borne supérieure.

  propriete-borne-superieure:
    - |
      Un ensemble totalement ordonné $E$ qui a un [[plus-petit-element|plus petit]] et un [[plus-grand-element|plus grand élément]] a la propriété de la borne supérieure si et seulement s'il est un [[treillis-complet|treillis complet]]. Si $E$ a la propriété, toute partie non vide est majorée, par le plus grand élément, donc a une borne supérieure, et $\sup \varnothing$ est le plus petit élément de $E$. La réciproque est immédiate.
    - |
      Soit $\mathcal C$ une partie de $\lex{ensemble-parties}{\mathcal P}(X)$ totalement ordonnée par l'inclusion, qui contient la réunion de chacune de ses sous-familles non vides. Alors $\mathcal C$ a la propriété de la borne supérieure, et la borne supérieure est la réunion. La réunion d'une sous-famille $\mathcal A$ est en effet un [[majorant]] de $\mathcal A$ qui appartient à $\mathcal C$, et tout majorant de $\mathcal A$ la contient.
    - |
      Plus loin, le nœud suivant ({{od-coupures|Complétion par les coupures de Dedekind}}) construira, à partir de tout ensemble totalement ordonné dense et sans extrémités, un ensemble qui a la propriété de la borne supérieure, ses coupures étant ordonnées par inclusion et leurs bornes supérieures étant des réunions, comme dans l'exemple précédent. Appliquée à l'ordre de $\mathbb Q$, qui n'a pas la propriété, cette construction donnera $\mathbb R$.

  coupure-dedekind:
    - |
      Les hypothèses de densité et d'absence d'extrémités ne sont pas de pure forme. Dans $E = \{a, b, c\}$, ordonné par $a < b < c$, les [[segment-initial|segments initiaux]] sont $\varnothing$, $\{a\}$, $\{a, b\}$ et $E$, et les deux du milieu ont un [[plus-grand-element|plus grand élément]] : il n'y a aucune coupure. L'application $j$ du théorème n'est pas définie : $]{\leftarrow}, a[\, = \varnothing$, et $]{\leftarrow}, c[\, = \{a, b\}$ a $b$ pour plus grand élément.
    - |
      Si $E$ est dense et sans extrémités, l'ensemble $\widehat E$ de ses coupures n'a pas non plus d'extrémités. Pour une coupure $C$ et $c \in C$, la coupure $]{\leftarrow}, c[$ est contenue dans $C$, qui est un segment initial, et ne contient pas $c$ : elle est strictement plus petite que $C$.

      Pour $e \notin C$, prenons $e' > e$ dans $E$, qui n'a pas de plus grand élément. Tout $x \in C$ vérifie $x < e$, sinon $e$ serait dans $C$, donc $x < e'$ : la coupure $]{\leftarrow}, e'[$ contient $C$, et strictement, puisqu'elle contient $e$.
    - |
      Plus loin, dans $\mathbb Q$ ({{q-ordre|Corps ordonnés, ordre de ℚ}}), la partie $C = \{x : x \leqslant 0 \text{ ou } x^2 < 2\}$ sera une coupure qui n'est de la forme $]{\leftarrow}, r[$ pour aucun rationnel $r$, faute de rationnel de carré $2$. C'est elle qui représentera $\sqrt 2$ dans la construction de $\mathbb R$ : les coupures qui ne sont pas des demi-droites sont exactement les points que la complétion ajoute.

  application-croissante:
    - |
      Le passage au complémentaire $X \mapsto E \setminus X$, de $(\lex{ensemble-parties}{\mathcal P}(E), \subset)$ dans lui-même, est décroissant : si $X \subset Y$, alors $E \setminus Y \subset E \setminus X$. Dès que $E$ est non vide, il n'est pas croissant, puisque $\varnothing \subset E$ alors que l'image $E$ de $\varnothing$ n'est pas contenue dans l'image $\varnothing$ de $E$. Être décroissante, c'est être croissante vers l'ordre renversé, où $x$ précède $y$ quand $y \leqslant x$.
    - |
      Pour une application $f : A \to B$, l'[[image-directe|image directe]] $X \mapsto f(X)$, de $\mathcal P(A)$ dans $\mathcal P(B)$, est croissante pour l'inclusion. Elle n'est pas strictement croissante en général : si $a \neq a'$ et si $f$ est constante de valeur $c$ sur $\{a, a'\}$, alors $\{a\} \subsetneq \{a, a'\}$, mais les deux images valent $\{c\}$. Croissante ne veut donc pas dire strictement croissante, même pour une application aussi naturelle.
    - |
      L'hypothèse d'ordre total du point (ii) de {{od-croissantes|Applications croissantes}} ne peut pas être omise. Munissons $E = \{a, b\}$, avec $a \neq b$, de l'égalité, qui est une [[relation-ordre|relation d'ordre]] pour laquelle deux éléments distincts ne sont jamais comparables. Aucun couple ne vérifie $x < y$, de sorte que toute application de $E$ dans un ensemble ordonné est strictement croissante, la condition étant vide ; une application constante l'est donc, sans être [[injection|injective]].

  borne-inferieure:
    - |
      Dans $(\lex{ensemble-parties}{\mathcal P}(E), \subset)$, la borne inférieure d'une partie non vide $\mathcal A$ est l'intersection $\bigcap \mathcal A$. Si $a$, $b$, $c$ sont distincts, la partie $\{\{a, b\}, \{a, c\}\}$ a pour borne inférieure $\{a\}$, qui ne lui appartient pas : une borne inférieure n'est pas forcément un [[plus-petit-element|plus petit élément]].
    - |
      La borne inférieure de la partie vide est le plus grand élément de l'ensemble ordonné tout entier, s'il existe, puisque tout élément minore $\varnothing$. Dans $\mathcal P(E)$, on a ainsi $\inf \varnothing = E$, ce qui est contraire à l'intuition qu'une borne inférieure est « petite ». Dans un ensemble ordonné sans plus grand élément, la partie vide n'a pas de borne inférieure.
    - |
      Une partie peut avoir des minorants sans avoir de borne inférieure. Sur $E = \{a, b, c, d\}$, avec quatre éléments distincts, considérons l'ordre dont les seules relations strictes sont $c < a$, $c < b$, $d < a$ et $d < b$. Les minorants de $\{a, b\}$ sont $c$ et $d$, qui ne sont pas comparables : l'ensemble des minorants n'a pas de plus grand élément, et $\{a, b\}$ n'a pas de borne inférieure.

  plus-grand-element:
    - |
      Dans $(\lex{ensemble-parties}{\mathcal P}(E), \subset)$, une famille $\mathcal A$ de parties a un plus grand élément si et seulement si sa réunion lui appartient, et c'est alors cette réunion. Si $M$ est le plus grand élément, il contient chaque élément de $\mathcal A$, d'où $\bigcup \mathcal A \subset M$, et $M \subset \bigcup \mathcal A$ puisque $M \in \mathcal A$. Réciproquement, la réunion contient chaque élément de $\mathcal A$.
    - |
      Soit $F$ un ensemble ordonné et $E$ un ensemble non vide. Pour l'ordre point par point sur les applications de $E$ dans $F$, où $f \leqslant g$ si $f(x) \leqslant g(x)$ pour tout $x$, il y a une plus grande application si et seulement si $F$ a un plus grand élément $M$, et c'est la constante égale à $M$. Si $g$ est la plus grande, et $x_0 \in E$, chaque constante $y$ vérifie $y \leqslant g(x_0)$, et $g(x_0)$ est le plus grand élément de $F$.

      Le cas $E = \varnothing$ est une exception : il n'y a alors qu'une application, l'application vide, qui est la plus grande, quel que soit $F$.
    - |
      Plus loin, un ordinal successeur $\alpha^+$ aura $\alpha$ pour plus grand élément, tandis qu'un ordinal limite n'en aura pas ({{o-successeur-limite|Ordinaux successeurs et ordinaux limites}}). L'existence d'un plus grand élément distinguera ainsi les deux sortes d'ordinaux non vides.

  plus-petit-element:
    - |
      Dans $(\lex{ensemble-parties}{\mathcal P}(E), \subset)$, la partie vide est le plus petit élément, puisqu'elle est contenue dans toute partie de $E$ ; l'ensemble $E$ est le plus grand. Pour une partie $\mathcal A$ de $\mathcal P(E)$ qui contient $\varnothing$, c'est donc aussi le plus petit élément de $\mathcal A$.
    - |
      Une partie peut avoir des éléments minimaux sans avoir de plus petit élément. Si $a \neq b$, la partie $\{\{a\}, \{b\}\}$ de $\mathcal P(\{a, b\})$ a deux [[element-minimal|éléments minimaux]], $\{a\}$ et $\{b\}$, qu'on ne peut comparer, et aucun plus petit élément. Sa [[borne-inferieure|borne inférieure]] existe pourtant : c'est $\varnothing$, qui n'appartient pas à la partie.
    - |
      La partie vide n'a jamais de plus petit élément, puisqu'un plus petit élément doit appartenir à la partie, alors que tout élément de l'ensemble ordonné en est un minorant. C'est toute la différence entre minorant et plus petit élément : le premier peut se trouver hors de la partie, le second jamais.

  minorant:
    - |
      Dans $(\lex{ensemble-parties}{\mathcal P}(E), \subset)$, les minorants d'une famille non vide $\mathcal A$ de parties sont exactement les parties contenues dans l'intersection $\bigcap \mathcal A$. Pour $E = \{a, b, c\}$ et $\mathcal A = \{\{a, b\}, \{a, c\}\}$, ce sont $\varnothing$ et $\{a\}$ ; la partie vide, elle, minore toute famille.
    - |
      Parmi les [[relation-equivalence|relations d'équivalence]] sur $E$, ordonnées par inclusion, les minorants d'une famille non vide sont les relations d'équivalence contenues dans l'intersection de la famille, qui est elle-même une relation d'équivalence. Cette intersection est donc la [[borne-inferieure|borne inférieure]]. Rien de tel du côté des [[majorant|majorants]] : sur $\{a, b, c\}$, la réunion des relations de classes $\{a, b\}, \{c\}$ et $\{b, c\}, \{a\}$ n'est pas transitive.
    - |
      Le passage au complémentaire échange minorants et majorants. Une partie $M$ minore $\mathcal A$ si et seulement si $E \setminus M$ majore la famille des complémentaires $E \setminus X$, pour $X \in \mathcal A$, puisque $M \subset X$ équivaut à $E \setminus X \subset E \setminus M$. C'est, dans $\mathcal P(E)$, la forme concrète du passage à l'ordre opposé.

  element-minimal:
    - |
      Pour l'égalité, qui est une relation d'ordre sur tout ensemble $E$, chaque élément est à la fois minimal et [[element-maximal|maximal]], puisque aucun couple ne vérifie $x < y$. Dès que $E$ contient deux éléments distincts, il n'y a donc ni [[plus-petit-element|plus petit]] ni plus grand élément, alors que chaque élément est minimal.
    - |
      Les éléments minimaux de la famille des parties non vides de $E = \{a, b, c\}$, ordonnée par inclusion, sont les trois singletons : une partie non vide qui n'est pas un singleton contient strictement chacun des singletons de ses points. Aucun singleton ne contient les deux autres, et la famille n'a pas de plus petit élément.
    - |
      Dans un [[ordre-total|ordre total]], un élément minimal est le plus petit élément, par l'énoncé jumeau du point (iii) de {{od-majorants|Majorants, plus grand élément, borne supérieure}}. Plus loin, la définition des ordinaux ({{o-ordinal|Ordinal}}) demandera que toute partie non vide ait un élément minimal pour $\in$ ; l'ordre $\in$ étant supposé total, c'est un plus petit élément.

  ordre-dense:
    - |
      Un ensemble totalement ordonné à deux éléments $a < b$ n'est pas dense, rien ne s'intercalant entre $a$ et $b$ ; il en va de même de $\{a, b, c\}$, ordonné par $a < b < c$. L'ensemble vide et les singletons sont denses, la condition étant vide : ce sont des cas limites, et un ordre dense qui a deux éléments distincts en a toujours un troisième entre eux.
    - |
      Si $E$ est dense et sans extrémités, l'ensemble $\widehat E$ de ses [[coupure-dedekind|coupures]] est dense. Soient $C \subsetneq D$ deux coupures, $d \in D \setminus C$, puis $d' \in D$ avec $d < d'$, qui existe puisque $D$ n'a pas de [[plus-grand-element|plus grand élément]]. La coupure $]{\leftarrow}, d'[$ contient $C$, dont tout élément est inférieur à $d$, sinon $d$ serait dans $C$, et elle contient $d$ ; elle est contenue dans $D$, sans contenir $d'$. Ainsi $C \subsetneq \,]{\leftarrow}, d'[\, \subsetneq D$.
    - |
      La densité ne passe pas aux parties : une partie à deux éléments d'un ordre dense n'est pas dense, pour l'[[ordre-induit|ordre induit]]. Plus loin, $\mathbb Q$ sera dense ({{q-archimede|ℚ est archimédien et dense}}), puisque $\frac{x + y}{2}$ s'intercale entre $x < y$, alors que $\mathbb Z$, partie de $\mathbb Q$, ne le sera pas, rien ne s'intercalant entre $0$ et $1$.

  segment-initial:
    - |
      Dans $E = \{a, b, c\}$, ordonné par $a < b < c$, les segments initiaux sont $\varnothing$, $\{a\}$, $\{a, b\}$ et $E$. La partie $\{b, c\}$ est un [[intervalle]], mais pas un segment initial, puisqu'elle contient $b$ sans contenir $a$ ; la partie $\{a, c\}$ n'est ni l'un ni l'autre. Un même segment initial s'écrit souvent de deux façons : $\{a\} = \,]{\leftarrow}, a] = \,]{\leftarrow}, b[$.
    - |
      Deux segments initiaux $C$ et $D$ d'un ensemble totalement ordonné sont toujours comparables pour l'inclusion. Si $C \not\subset D$, soit $c \in C \setminus D$ : tout $d \in D$ vérifie $d < c$, car $c \leqslant d$ mettrait $c$ dans $D$, donc $d \in C$. La réunion et l'intersection d'une famille quelconque de segments initiaux en sont encore, alors que la réunion de deux intervalles n'en est pas toujours un.
    - |
      Dans l'exemple de $\{a, b, c\}$, chaque segment initial autre que $E$ est une demi-droite $]{\leftarrow}, x[$ : $\varnothing = \,]{\leftarrow}, a[$, $\{a\} = \,]{\leftarrow}, b[$ et $\{a, b\} = \,]{\leftarrow}, c[$. Plus loin, c'est ce qui se produira dans tout ensemble bien ordonné, d'après le point (iv) de {{od-bon-ordre|Bons ordres}}.

  ensemble-ordonne:
    - |
      Si $(F, \leqslant)$ est un ensemble ordonné et $E$ un ensemble, les [[application|applications]] de $E$ dans $F$, comparées point par point, forment un ensemble ordonné : $f \leqslant g$ si $f(x) \leqslant g(x)$ pour tout $x \in E$. Chaque condition passe de $F$ aux applications, valeur par valeur ; pour l'antisymétrie, $f \leqslant g$ et $g \leqslant f$ donnent $f(x) = g(x)$ pour tout $x$, donc $f = g$.

      Cet ordre n'est pas total dès que $E$ a deux points distincts $x$, $y$ et que $F$ contient $u < v$. Les applications qui envoient $x$ sur $u$ et $y$ sur $v$, ou l'inverse, ne sont pas comparables.
    - |
      Un ensemble ordonné est un couple, et non un ensemble seul. Sur $\{a, b\}$, avec $a \neq b$, il y a trois [[relation-ordre|relations d'ordre]] : l'égalité, l'ordre où $a < b$ et celui où $b < a$. Les deux derniers donnent deux ensembles ordonnés distincts, que l'échange de $a$ et de $b$ transporte pourtant l'un sur l'autre.
    - |
      Sur $\lex{ensemble-parties}{\mathcal P}(E)$, avec $a \in E$, la relation « $X \cup \{a\} \subset Y \cup \{a\}$ » est réflexive et transitive, mais elle n'est pas antisymétrique : $\varnothing$ et $\{a\}$ sont en relation dans les deux sens. Elle équivaut à $X \setminus \{a\} \subset Y \setminus \{a\}$ : elle ignore le point $a$, et c'est cet oubli qui empêche d'obtenir un ensemble ordonné.

  ordre-induit:
    - |
      Un ordre non total peut induire un ordre total. Dans $\lex{ensemble-parties}{\mathcal P}(\{a, b\})$, avec $a \neq b$, l'ordre induit sur $\{\varnothing, \{a\}, \{a, b\}\}$ est total, alors que l'inclusion sur $\mathcal P(\{a, b\})$ ne l'est pas. À l'inverse, l'ordre induit sur $\{\{a\}, \{b\}\}$ est l'égalité, aucun des deux singletons ne contenant l'autre.
    - |
      L'ordre induit ne garde que les comparaisons entre éléments de la partie, et il oublie ce qui les séparait. Dans $E = \{a, b, c\}$, ordonné par $a < b < c$, la partie $F = \{a, c\}$, munie de l'ordre induit, n'a aucun élément strictement compris entre $a$ et $c$, alors que $E$ en a un, $b$.

  treillis:
    - |
      Les applications d'un ensemble $E$ dans un ensemble totalement ordonné $T$, comparées point par point, forment un treillis. La borne supérieure de $f$ et $g$ est $x \mapsto \max(f(x), g(x))$, et leur borne inférieure est $x \mapsto \min(f(x), g(x))$ : une application $h$ majore $f$ et $g$ si et seulement si $h(x) \geqslant \max(f(x), g(x))$ pour tout $x$. Ce treillis n'est pas totalement ordonné dès que $E$ et $T$ ont deux éléments distincts.
    - |
      La famille des parties non vides de $E = \{a, b, c\}$, ordonnée par inclusion, n'est pas un treillis : $\{a\}$ et $\{b\}$ n'y ont aucun [[minorant]], donc pas de [[borne-inferieure|borne inférieure]]. Toute paire y a pourtant une borne supérieure, la réunion de deux parties non vides étant non vide. Il suffit de rendre $\varnothing$ pour retrouver le treillis $\lex{ensemble-parties}{\mathcal P}(E)$.
    - |
      Un treillis n'obéit pas toujours aux règles de calcul de $\mathcal P(E)$. Dans le treillis des [[relation-equivalence|relations d'équivalence]] sur $E = \{a, b, c\}$, notons $R_{ab}$ celle de classes $\{a, b\}$ et $\{c\}$, de même $R_{ac}$ et $R_{bc}$, et $\Delta$ l'égalité. On trouve
      $$\begin{aligned} R_{ab} \wedge (R_{ac} \vee R_{bc}) &= R_{ab}, \\ (R_{ab} \wedge R_{ac}) \vee (R_{ab} \wedge R_{bc}) &= \Delta. \end{aligned}$$
      En effet $R_{ac} \vee R_{bc} = E \times E$, tandis que $R_{ab} \wedge R_{ac} = R_{ab} \cap R_{ac} = \Delta$, de même pour $R_{bc}$. L'identité $X \cap (Y \cup Z) = (X \cap Y) \cup (X \cap Z)$, vraie dans $\mathcal P(E)$, n'a donc pas d'analogue dans tout treillis.
