# Exemples du lexique : théorie « Axiomes de ZF » (zf).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  ensemble:
    - |
      Le mot « ensemble » désigne ce que parcourent les variables, et rien de plus. Soit $M = \{a, b\}$, avec $a \neq b$, et $E = \{(a, b)\}$ : la [[structure]] $(M, E)$, qui interprète $\in$ par $E$, a deux ensembles, $a$, sans élément, et $b$, dont le seul élément est $a$. La formule $\exists y\, (y \in x)$ y est satisfaite sous une [[valuation-structure|valuation]] qui envoie $x$ sur $b$, et non sur $a$ ; de même, $a \subset b$ y est vrai, et $b \subset a$ faux. Ce que sont $a$ et $b$ dans la [[metatheorie|métathéorie]] n'importe pas : dans la structure, ce sont des ensembles.
    - |
      La notion d'ensemble ne dit pas, à elle seule, qu'un ensemble est déterminé par ses éléments. Dans la structure à deux éléments $a$ et $b$ où la formule $x \in y$ n'est satisfaite sous aucune valuation, ni $a$ ni $b$ n'a d'élément, et l'[[enonce|énoncé]]
      $$\begin{aligned} \exists x\, \exists y\, \big(&\neg(x = y) \\ &\wedge \forall z\, (z \in x \Leftrightarrow z \in y)\big) \end{aligned}$$
      y est satisfait : deux ensembles distincts y ont les mêmes éléments. Plus loin, l'axiome d'extensionnalité ({{zf-ext|Extensionnalité}}) exclura une telle structure, en affirmant la négation de cet énoncé.

  inductif-successeur:
    - |
      Un ensemble inductif $I$ a au moins trois éléments distincts. Il a un élément $e$ sans élément, puis un élément $y$ dont le seul élément est $e$, puisque les éléments de $y$ sont ceux de $e$, qui n'en a pas, et $e$ lui-même ; puis un élément $z$ dont les éléments sont $e$ et $y$. On a $y \neq e$ et $z \neq e$, puisque $e$ n'a pas d'élément, et $z \neq y$, car $y \in z$ alors que $y \notin y$, le seul élément de $y$ étant $e$.
    - |
      Avoir un élément sans élément ne suffit pas. Avec les notations de l'exemple précédent, un ensemble $J$ dont les seuls éléments sont $e$ et $y$ n'est pas inductif : il contient $y$, mais aucun de ses éléments n'a pour éléments exactement $e$ et $y$, puisque $e$ n'en a aucun et que $y$ n'a que $e$. La condition de stabilité, appliquée sans fin, force l'ensemble à grossir. Plus loin, le plus petit ensemble inductif sera l'ensemble des entiers naturels ({{n-omega|Construction de ω}}).

  axiome-choix:
    - |
      L'hypothèse « deux à deux disjoints » ne peut pas être retirée. Soient $a$, $b$, $c$ trois ensembles distincts, et $\mathcal F$ un ensemble dont les éléments sont exactement trois ensembles $X$, $Y$, $Z$, d'éléments respectifs $a$ et $b$, $b$ et $c$, $a$ et $c$ : ils sont non vides, mais $X$ et $Y$ ont $b$ en commun. Aucun ensemble $C$ ne rencontre chacun d'eux en exactement un point. Si $a \in C$, alors $b \notin C$ et $c \notin C$, à cause de $X$ et de $Z$, et $C$ ne rencontre pas $Y$ ; si $a \notin C$, alors $b \in C$ et $c \in C$, et $C$ rencontre $Y$ en deux points.
    - |
      L'axiome du choix est un [[enonce|énoncé]] du langage de $\mathsf{ZF}$ que cette théorie ne décide pas. Gödel (1938) et Cohen (1963) ont montré que, si $\mathsf{ZF}$ est [[theorie-coherente|cohérente]], elle ne démontre ni cet énoncé ni sa négation ; le point (ii) du nœud {{l-coherence|Cohérence}} traduit chacune de ces deux absences en la cohérence d'une théorie augmentée d'un axiome. En particulier, si elle est cohérente, $\mathsf{ZF}$ n'est pas une [[theorie-complete|théorie complète]], et c'est pourquoi l'on signale par ⋆ chaque emploi de l'axiome : on sait ainsi ce qui se démontre dans $\mathsf{ZF}$ seule.
    - |
      Plus loin, une fois les applications définies, l'axiome prendra la forme d'une fonction de choix ({{r-choix|Formes de l'axiome du choix}}) : pour toute famille $(A_i)_{i \in I}$ d'ensembles non vides, une application $g$ telle que $g(i) \in A_i$ pour tout $i$. On verra alors que, pour une famille finie, son existence se démontre sans l'axiome, par récurrence sur le nombre d'éléments de $I$, chaque étape n'instanciant qu'un énoncé existentiel ; c'est pour une famille infinie, faute de règle qui désigne un élément de chaque $A_i$, que l'axiome intervient.

  ensemble-parties:
    - |
      L'ensemble $\mathcal P(A)$ a toujours un élément, même quand $A$ n'en a aucun. La formule $\forall z\, (z \in A \Rightarrow z \in A)$, c'est-à-dire $A \subset A$, est la généralisation d'une [[instance-tautologie|instance de tautologie]] : on a donc $A \in \mathcal P(A)$. De même, un ensemble $x$ sans élément est une partie de tout ensemble $A$, puisque l'implication $z \in x \Rightarrow z \in A$ est vraie pour tout $z$, sa prémisse étant fausse : $x \in \mathcal P(A)$.
    - |
      L'ensemble des parties reflète l'inclusion. Si $A \subset B$, toute partie de $A$ est une partie de $B$, donc $\mathcal P(A) \subset \mathcal P(B)$. Réciproquement, si $\mathcal P(A) \subset \mathcal P(B)$, alors $A \in \mathcal P(A)$ donne $A \in \mathcal P(B)$, c'est-à-dire $A \subset B$. Il faut distinguer $x \in A$ de $x \in \mathcal P(A)$ : la seconde condition signifie $x \subset A$, et porte sur les éléments de $x$, non sur $x$ lui-même.
    - |
      Si $A$ n'a aucun élément, les éléments de $\mathcal P(A)$ sont exactement les ensembles sans élément : $x \subset A$ impose alors qu'aucun $z$ n'appartienne à $x$, et réciproquement un tel $x$ est une partie de $A$, par le premier exemple. Plus loin, l'axiome d'extensionnalité rendra unique l'ensemble sans élément, noté $\varnothing$ ({{zf-vide|Ensemble vide}}), et ce résultat s'écrira $\mathcal P(\varnothing) = \{\varnothing\}$ : l'ensemble vide n'a aucun élément, l'ensemble de ses parties en a un.
