# Exemples du lexique : théorie « Analyse réelle » (analyse-reelle).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  derivable:
    - |
      La fonction $f(x) = x^3$ est dérivable en tout point $a$ de $\mathbb R$, de nombre dérivé $3a^2$. Son [[taux-accroissement|taux d'accroissement]] se calcule en factorisant :
      $$\frac{x^3 - a^3}{x - a} = x^2 + ax + a^2,$$
      expression polynomiale qui tend vers $3a^2$ quand $x$ tend vers $a$. En $a = 0$, le nombre dérivé est nul, bien que $f$ soit strictement croissante : une dérivée nulle en un point n'empêche pas la stricte monotonie.
    - |
      La fonction $f(x) = x\,|x|$ est dérivable en $0$, de nombre dérivé nul, bien que $x \mapsto |x|$ ne le soit pas, son taux d'accroissement en $0$ valant $1$ à droite et $-1$ à gauche. Celui de $f$ en $0$ est en effet
      $$\frac{x\,|x| - 0}{x - 0} = |x|,$$
      qui tend vers $0$. Multiplier par $x$ a aplati l'angle du graphe de la valeur absolue en $0$ : la dérivabilité est une propriété fine, qui peut apparaître ou disparaître par de simples opérations.
    - |
      Une fonction peut être dérivable en un seul point. Soit $f(x) = x^2$ si $x$ est rationnel et $f(x) = 0$ sinon. En $0$, le taux d'accroissement vaut $x$ ou $0$, et il tend vers $0$ : $f'(0) = 0$. Soit maintenant $a \neq 0$. La densité des rationnels et des irrationnels ({{tr-dense|Densité}}) fournit des points $x$ aussi proches de $a$ qu'on veut où $f(x) - f(a)$ est proche de $-a^2$ si $a$ est rationnel, et de $a^2$ sinon. Comme $x - a$ tend vers $0$, le taux d'accroissement n'est pas borné, et $f$ n'est pas dérivable en $a$.

  partie-convexe:
    - |
      La partie $C = \{(x, y) \in \mathbb R^2 : y \geqslant x^2\}$, au-dessus de la parabole, est convexe. Pour $a = (a_1, a_2)$ et $b = (b_1, b_2)$ dans $C$ et $t \in [0, 1]$, on a l'identité
      $$\begin{aligned} (1 - t)a_1^2 + tb_1^2 &= \big((1 - t)a_1 + tb_1\big)^2 \\ &\quad + t(1 - t)(a_1 - b_1)^2, \end{aligned}$$
      dont le dernier terme est positif, d'où
      $$\begin{aligned} (1 - t)a_2 + tb_2 &\geqslant (1 - t)a_1^2 + tb_1^2 \\ &\geqslant \big((1 - t)a_1 + tb_1\big)^2. \end{aligned}$$
      Le calcul dit que la corde d'une parabole reste au-dessus de la courbe.
    - |
      La réunion des deux axes, $\{(x, y) \in \mathbb R^2 : xy = 0\}$, est [[partie-etoilee|étoilée]] par rapport à l'origine, puisque le segment qui joint $(0, 0)$ à un point d'un axe reste sur cet axe. Elle n'est pas convexe : le milieu $(\frac12, \frac12)$ des points $(1, 0)$ et $(0, 1)$ n'en fait pas partie. Étoilée par rapport à un point ne veut donc pas dire étoilée par rapport à tous ses points.
      ```schema lex-partie-convexe-2
      La réunion des deux axes, en rouge, contient $(1, 0)$ et $(0, 1)$, mais le segment qui joint ces deux points, en pointillé, ne la rencontre qu'en ses extrémités : son milieu $(\frac12, \frac12)$, marqué d'un point creux, n'en fait pas partie. Les segments issus de l'origine, en bleu, restent au contraire sur les axes.
      ```
    - |
      Pour $n = 1$, une partie convexe est un [[intervalle]], et les contre-exemples sont les parties « trouées ». La partie $\mathbb R \setminus \{0\}$ n'est pas convexe, puisque le milieu de $-1$ et de $1$ est $0$ ; de même $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, qui contient $0$ et $1$ mais pas $\frac12$. Il ne faut pas confondre convexe et « d'un seul tenant » : la réunion des deux axes du deuxième exemple est d'un seul tenant sans être convexe.

  limite-fonction-infini:
    - |
      La fonction $g(x) = \dfrac{x}{x + 1}$, définie sur $[0, +\infty[$, tend vers $1$ quand $x$ tend vers $+\infty$. On a en effet
      $$\Big|\frac{x}{x + 1} - 1\Big| = \frac{1}{x + 1},$$
      qui est inférieur à $\varepsilon$ dès que $x \geqslant \frac1\varepsilon$ : on peut prendre $B = \frac1\varepsilon$. Le calcul montre comment choisir le seuil $B$ à partir de $\varepsilon$, ce que demande la définition.
    - |
      La fonction $g(x) = x - \lfloor x \rfloor$, définie sur $[0, +\infty[$, où $\lfloor x \rfloor$ est la [[partie-entiere|partie entière]], n'a pas de limite en $+\infty$, bien qu'elle soit bornée. Elle vaut $0$ en chaque entier et $\frac12$ en chaque demi-entier, aussi loin qu'on aille : un réel $\ell$ ne peut être à distance moins de $\frac14$ à la fois de $0$ et de $\frac12$.
    - |
      Une fonction non majorée ne tend pas forcément vers $+\infty$. Soit $g$ la fonction définie sur $[0, +\infty[$ par $g(x) = x$ si $\lfloor x \rfloor$ est pair, et $g(x) = 0$ sinon. Elle n'est majorée par aucun réel, puisque $g(2n) = 2n$, mais elle s'annule sur chaque intervalle $[2n + 1, 2n + 2[$ : pour $A = 1$, aucun seuil $B$ ne garantit $g(x) > A$ pour tout $x \geqslant B$. L'erreur la plus répandue est de confondre « prendre des valeurs arbitrairement grandes » et « tendre vers $+\infty$ ».
