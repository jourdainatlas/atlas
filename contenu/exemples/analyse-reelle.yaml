# Exemples du lexique : théorie « Analyse réelle » (analyse-reelle).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  espace-metrique:
    - |
      Tout ensemble $X$ est un espace métrique pour la distance définie par $d(x, y) = 1$ si $x \neq y$ et $d(x, x) = 0$. Les deux premiers axiomes sont immédiats. Pour le troisième, si $x \neq z$, le point $y$ diffère de $x$ ou de $z$, de sorte que $d(x, y) + d(y, z) \geqslant 1 = d(x, z)$. Sur $\lex{ensemble-reels}{\mathbb R}$, cette distance n'a rien à voir avec $|x - y|$ : elle ne voit pas que $1$ est plus proche de $0$ que $100$.
    - |
      Un même ensemble porte plusieurs distances. Sur $\mathbb R^2$, posons
      $$\begin{aligned} d_1(p, q) &= |x - x'| + |y - y'|, \\ d_\infty(p, q) &= \max(|x - x'|, |y - y'|) \end{aligned}$$
      pour $p = (x, y)$ et $q = (x', y')$. L'[[inegalite-triangulaire|inégalité triangulaire]] de $\mathbb R$, appliquée à chaque coordonnée, donne celle de $d_1$ et celle de $d_\infty$. Ces distances diffèrent, puisque $d_1((0, 0), (1, 1)) = 2$ et $d_\infty((0, 0), (1, 1)) = 1$, mais elles restent comparables : $d_\infty \leqslant d_1 \leqslant 2\,d_\infty$.
      ```schema lex-espace-metrique-2
      Les points à distance $1$ de l'origine forment, pour $d_1$, le carré rouge de sommets $(\pm 1, 0)$ et $(0, \pm 1)$, et, pour $d_\infty$, le carré bleu de côté $2$. Le point $(1, 1)$ est sur le carré bleu, à distance $2$ de l'origine pour $d_1$.
      ```
    - |
      La formule $d(x, y) = |x^2 - y^2|$ ne définit pas une distance sur $\mathbb R$. Elle est symétrique et vérifie l'inégalité triangulaire, comme $|a - c| \leqslant |a - b| + |b - c|$ avec $a = x^2$, $b = y^2$, $c = z^2$, mais $d(1, -1) = 0$ alors que $1 \neq -1$. Sur $[0, +\infty[$, au contraire, c'en est une : $x^2 = y^2$ s'écrit $(x - y)(x + y) = 0$, et $x + y > 0$ sauf si $x = y = 0$. Plus généralement, $|f(x) - f(y)|$ est une distance si et seulement si $f$ est [[injection|injective]].

  limite-suite:
    - |
      La définition se lit comme une recette : on se donne $\varepsilon$, et l'on cherche un rang. Pour $u_n = \frac{2n + 1}{n + 3}$, on a
      $$u_n - 2 = -\frac{5}{n + 3},$$
      donc $|u_n - 2| < \varepsilon$ dès que $n + 3 > \frac5\varepsilon$, ce qui arrive [[a-partir-certain-rang|à partir d'un certain rang]] parce que $\lex{ensemble-reels}{\mathbb R}$ est [[archimedien|archimédien]]. Pour $\varepsilon = \frac1{100}$, il faut $n + 3 > 500$, c'est-à-dire $n \geqslant 498$ : la suite tend vers $2$, mais lentement.
    - |
      La limite dépend de la distance. Munissons $\mathbb R$ de la distance égale à $1$ entre deux points distincts et à $0$ entre un point et lui-même. La suite $(\frac1n)_{n \geqslant 1}$ ne converge plus vers $0$, puisque $d(\frac1n, 0) = 1$ pour tout $n$. Pour $\varepsilon = \frac12$, la définition exige même $u_n = \ell$ à partir d'un certain rang : pour cette distance, les seules suites convergentes sont les suites constantes à partir d'un certain rang.
    - |
      La limite dépend aussi de l'espace. Dans $X = \,]0, 1]$, muni de la distance $|x - y|$, la suite $u_n = \frac1{n + 1}$ ne converge vers aucun point. Si $\ell \in X$, la propriété d'Archimède donne $N$ tel que $\frac1{N + 1} < \frac\ell2$, d'où $|u_n - \ell| > \frac\ell2$ pour tout $n \geqslant N$, et $\varepsilon = \frac\ell2$ met la définition en défaut. Dans $\mathbb R$, la même suite tend vers $0$, le point qui manque à $X$. Plus loin, de telles suites seront dites de Cauchy, et ce défaut, qui n'existe pas dans $\mathbb R$, sera celui des espaces non complets ({{ar-cauchy|Complétude de ℝ}}).

  limite-infinie:
    - |
      La suite $u_n = n^2 - 10n$ tend vers $+\infty$, bien qu'elle commence par décroître : $u_0 = 0$, $u_5 = -25$. Pour $n \geqslant 11$, on a $n - 10 \geqslant 1$, donc $u_n = n(n - 10) \geqslant n$. Étant donné un réel $A$, il suffit donc de prendre $n \geqslant 11$ et $n > A$. Une minoration grossière suffit : la définition demande seulement de dépasser tout seuil, pas de savoir à quelle vitesse.
    - |
      Une suite peut tendre vers $+\infty$ sans être croissante. La suite $u_n = n + 3(-1)^n$ vérifie $u_n \geqslant n - 3$, donc $u_n > A$ dès que $n > A + 3$ : elle tend vers $+\infty$. Pourtant $u_{2k} = 2k + 3$ et $u_{2k+1} = 2k - 2$ : chaque terme d'indice pair dépasse le suivant de $5$.
    - |
      La réciproque de « une suite qui tend vers $+\infty$ n'est pas majorée » est fausse. La suite définie par $u_n = n$ pour $n$ pair et $u_n = 0$ pour $n$ impair n'est majorée par aucun réel, d'après la propriété d'Archimède, mais elle ne tend pas vers $+\infty$ : pour $A = 0$, l'inégalité $u_n > 0$ est fausse à tous les rangs impairs, aussi loin qu'on aille. Prendre des valeurs arbitrairement grandes ne suffit pas ; il faut les prendre toutes au-delà d'un rang.

  suites-adjacentes:
    - |
      Les moyennes arithmétique et harmonique de $2$ et de $1$, itérées, donnent deux suites adjacentes. Posons $a_0 = 2$, $b_0 = 1$, et
      $$a_{n+1} = \frac{a_n + b_n}{2}, \qquad b_{n+1} = \frac{2a_nb_n}{a_n + b_n}.$$
      Le produit $a_nb_n$ reste égal à $2$, et l'écart vérifie
      $$a_{n+1} - b_{n+1} = \frac{(a_n - b_n)^2}{2(a_n + b_n)} \geqslant 0.$$
      Ainsi $0 < b_n \leqslant a_n$ ; puis $a_{n+1} \leqslant a_n$, moyenne de $a_n$ et d'un réel plus petit, et $b_{n+1} = \frac2{a_{n+1}} \geqslant \frac2{a_n} = b_n$. Comme $a_n - b_n \leqslant a_n + b_n$, l'écart est au moins divisé par $2$ à chaque pas, donc au plus égal à $2^{-n}$, qui tend vers $0$.
      ```schema lex-suites-adjacentes-1
      Les segments $[b_n, a_n]$, de haut en bas pour $n = 0$, $1$, $2$, sont emboîtés autour de la limite commune $\ell$, en rouge : $[1, 2]$, puis $[\frac43, \frac32]$, puis $[\frac{24}{17}, \frac{17}{12}]$, déjà de longueur $\frac1{204}$. Les extrémités gauches, en bleu, croissent, et les extrémités droites, en vert, décroissent.
      ```
      La limite commune $\ell$ vérifie $\ell^2 = \lim a_nb_n = 2$ ({{su-operations|Opérations sur les limites}}), et $a_3 = \frac{577}{408}$ et $b_3 = \frac{816}{577}$ l'encadrent déjà à $4{,}3 \cdot 10^{-6}$ près : l'écart, élevé au carré à chaque pas, s'effondre.
    - |
      Le sens de variation de chaque suite est indispensable. Les suites $u_n = \frac1{n + 1}$ et $v_n = \frac2{n + 1}$ vérifient $v_n - u_n \to 0$, et $(v_n)$ est décroissante ; mais $(u_n)$ est décroissante, elle aussi. Toutes deux tendent vers $0$, et l'encadrement $u_n \leqslant \ell \leqslant v_n$ tombe, puisque $u_n > 0 = \ell$ pour tout $n$. Ce qui fait la force du théorème, c'est que la limite reste coincée entre les deux suites, et cela demande les deux sens de variation.
    - |
      Les suites $u_n = \sum_{k=0}^{n} \frac1{k!}$ et $v_n = u_n + \frac1{n \cdot n!}$, pour $n \geqslant 1$, sont adjacentes. La première croît, l'écart $\frac1{n \cdot n!}$ tend vers $0$, et un calcul de fractions donne
      $$v_{n+1} - v_n = -\frac{1}{n(n + 1)(n + 1)!} < 0.$$
      Leur limite commune est donc comprise entre $u_5 = \frac{163}{60}$ et $v_5 = \frac{1631}{600}$, soit entre $2{,}7166$ et $2{,}7184$. Plus loin, ce réel sera identifié au nombre $e$, comme limite de ces sommes ({{ex-serie|Série de l'exponentielle}}).

  suite-extraite:
    - |
      La stricte croissance de $\varphi$ n'est pas une coquetterie. Avec $\varphi(n) = 0$ pour tout $n$, la suite $(u_{\varphi(n)})$ est la suite constante égale à $u_0$ ; pour $u_n = \frac1{n + 1}$, qui tend vers $0$, elle vaut constamment $1$, et le point (i) de {{su-extraites|Suites extraites}} tomberait. Ce que la preuve utilise est $\varphi(n) \geqslant n$, conséquence de la stricte croissance, qui force les indices extraits à partir vers l'infini.
    - |
      Le point (i) de {{su-extraites|Suites extraites}} sert aussi pour les limites infinies. Soit $u_n = n$ pour $n$ pair et $u_n = \frac1n$ pour $n$ impair. Les termes pairs $u_{2k} = 2k$ tendent vers $+\infty$, les termes impairs $u_{2k+1} = \frac1{2k + 1}$ tendent vers $0$ : la suite n'a de limite ni finie ni infinie, alors qu'elle n'est pas majorée.
      ```schema lex-suite-extraite-2
      Les termes d'indice pair, en rouge, montent sans borne, et ceux d'indice impair, en bleu, s'écrasent sur l'axe des indices : deux suites extraites aux comportements incompatibles, de sorte que la suite n'a pas de limite.
      ```
    - |
      Une suite extraite d'une suite extraite est encore extraite de la suite de départ, puisqu'une composée d'applications strictement croissantes l'est encore. Soit $u_n = (-1)^{n(n+1)/2}$, qui vaut $1, -1, -1, 1, 1, -1, -1, 1, \dots$ Sa suite extraite $(u_{2n})$ est la suite $((-1)^n)$, divergente, mais celle-ci a pour suite extraite $(u_{4n})$, constante égale à $1$. Plus loin, le théorème de Bolzano-Weierstrass dira que toute suite bornée a une suite extraite convergente ({{ar-bw|Bolzano-Weierstrass}}).

  continuite-point:
    - |
      Le réel $\delta$ dépend du point $a$, et pas seulement de $\varepsilon$. Pour $f(x) = \frac1x$ sur $]0, +\infty[$ et $a > 0$, si $|x - a| < \frac a2$, alors $x > \frac a2$ et
      $$\Big|\frac1x - \frac1a\Big| = \frac{|x - a|}{xa} \leqslant \frac{2\,|x - a|}{a^2}.$$
      Le choix $\delta = \min\big(\frac a2, \frac{\varepsilon a^2}2\big)$ convient donc. Pour $a = \frac1{10}$ et $\varepsilon = \frac1{10}$, il donne $\delta = \frac1{2000}$ : plus le graphe est raide, plus la fenêtre doit être étroite.
      ```schema lex-continuite-point-1
      Pour $\varepsilon = \frac12$, les rectangles rouge, en $a = \frac12$, et bleu, en $a = 1$, ont pour hauteur $2\varepsilon$ et pour largeur le plus grand $2\delta$ qui convienne, soit $\delta = \frac1{10}$ et $\delta = \frac13$ : là où la courbe de $x \mapsto \frac1x$ est plus raide, la fenêtre doit être plus étroite pour que la courbe ne sorte ni par le haut ni par le bas.
      ```
    - |
      Une fonction peut n'être continue qu'en un point. Soit $f(x) = x$ si $x$ est rationnel et $f(x) = 0$ sinon. En $0$, on a $|f(x)| \leqslant |x|$, et $\delta = \varepsilon$ convient. En $a \neq 0$, prenons $\varepsilon = \frac{|a|}2$ et $\delta \leqslant \frac{|a|}2$. Par densité ({{tr-dense|Densité}}), l'intervalle $]a - \delta, a + \delta[$ contient un irrationnel $x$, qui donne $|f(x) - f(a)| = |a|$ si $a$ est rationnel. Il contient aussi un rationnel $x$, avec $|f(x) - f(a)| = |x| > \frac{|a|}2$ si $a$ est irrationnel.
    - |
      La continuité dépend de l'ensemble de définition. La [[partie-entiere|partie entière]] $x \mapsto \lfloor x \rfloor$ n'est pas continue en un entier $n$ sur $\lex{ensemble-reels}{\mathbb R}$ : pour $\varepsilon = 1$, tout intervalle $]n - \delta, n[$ contient des points où elle vaut $n - 1$. Sa restriction à $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ est au contraire continue en tout point, puisque $\delta = \frac12$ ne laisse que $x = n$, et sa restriction à $[n, n + 1[$ est continue en $n$, où elle est constante.

  continuite-uniforme:
    - |
      La fonction $f(x) = \frac1{1 + x^2}$ est uniformément continue sur $\lex{ensemble-reels}{\mathbb R}$, avec $\delta = \varepsilon$. On a
      $$f(x) - f(y) = \frac{(y - x)(y + x)}{(1 + x^2)(1 + y^2)},$$
      et l'inégalité $|x| \leqslant \frac{1 + x^2}2$, qui équivaut à $(|x| - 1)^2 \geqslant 0$, donne
      $$\begin{aligned} \frac{|x + y|}{(1 + x^2)(1 + y^2)} &\leqslant \frac{|x|}{1 + x^2} + \frac{|y|}{1 + y^2} \\ &\leqslant 1. \end{aligned}$$
      Ainsi $|f(x) - f(y)| \leqslant |x - y|$ : une seule constante contrôle les écarts partout, ce qui est le cœur de la notion.
    - |
      La fonction $f(x) = \frac1x$ n'est pas uniformément continue sur $]0, 1]$. Les points $\frac1n$ et $\frac1{n + 1}$ sont à distance $\frac1{n(n + 1)}$, aussi petite qu'on veut, et leurs images $n$ et $n + 1$ sont à distance $1$ : pour $\varepsilon = 1$, aucun $\delta$ ne convient. Sur $[a, 1]$, avec $a > 0$, au contraire, $|\frac1x - \frac1y| = \frac{|x - y|}{xy} \leqslant \frac{|x - y|}{a^2}$, et $\delta = \varepsilon a^2$ convient : c'est le voisinage de $0$, où la pente explose, qui fait tout le défaut.
      ```schema lex-continuite-uniforme-2
      Les couples de points $\frac1{n + 1}$ et $\frac1n$, pour $n = 1$, $2$, $3$, en bleu sur l'axe des abscisses, se resserrent vers $0$, tandis que leurs images, en rouge sur l'axe des ordonnées, restent à distance $1$ : aucune largeur $\delta$ commune ne garantit des images à moins de $1$ l'une de l'autre.
      ```
    - |
      La fonction $x \mapsto x^2$ est uniformément continue sur $[-1, 1]$, car $|x^2 - y^2| = |x + y|\,|x - y| \leqslant 2|x - y|$, et $\delta = \frac\varepsilon2$ convient ; elle ne l'est pas sur $\mathbb R$, où le facteur $|x + y|$ n'est plus borné : les points $n + \frac1n$ et $n$ sont à distance $\frac1n$, mais leurs carrés diffèrent de $2 + \frac1{n^2} > 2$, et $\varepsilon = 2$ met la définition en défaut. Plus loin, le théorème de Heine dira que toute fonction continue sur un segment y est uniformément continue ({{c-heine|Théorème de Heine}}).

  derivable:
    - |
      La fonction $f(x) = x^3$ est dérivable en tout point $a$ de $\mathbb R$, de nombre dérivé $3a^2$. Son [[taux-accroissement|taux d'accroissement]] se calcule en factorisant :
      $$\frac{x^3 - a^3}{x - a} = x^2 + ax + a^2,$$
      expression polynomiale qui tend vers $3a^2$ quand $x$ tend vers $a$. En $a = 0$, le nombre dérivé est nul, bien que $f$ soit strictement croissante : une dérivée nulle en un point n'empêche pas la stricte monotonie.
    - |
      La fonction $f(x) = x\,|x|$ est dérivable en $0$, de nombre dérivé nul, bien que $x \mapsto |x|$ ne le soit pas, son taux d'accroissement en $0$ valant $1$ à droite et $-1$ à gauche. Celui de $f$ en $0$ est en effet
      $$\frac{x\,|x| - 0}{x - 0} = |x|,$$
      qui tend vers $0$. Multiplier par $x$ a aplati l'angle du graphe de la valeur absolue en $0$ : la dérivabilité est une propriété fine, qui peut apparaître ou disparaître par de simples opérations.
    - |
      Une fonction peut être dérivable en un seul point. Soit $f(x) = x^2$ si $x$ est rationnel et $f(x) = 0$ sinon. En $0$, le taux d'accroissement vaut $x$ ou $0$, et il tend vers $0$ : $f'(0) = 0$. Soit maintenant $a \neq 0$. La densité des rationnels et des irrationnels ({{tr-dense|Densité}}) fournit des points $x$ aussi proches de $a$ qu'on veut où $f(x) - f(a)$ est proche de $-a^2$ si $a$ est rationnel, et de $a^2$ sinon. Comme $x - a$ tend vers $0$, le taux d'accroissement n'est pas borné, et $f$ n'est pas dérivable en $a$.

  limite-fonction:
    - |
      La fonction $g(x) = \dfrac{x^2 - 1}{x - 1}$, définie sur $D = \mathbb R \setminus \{1\}$, admet la limite $2$ en $1$, qui est [[point-adherent-reel|adhérent]] à $D$ sans lui appartenir. On a $g(x) = x + 1$ sur $D$, donc $|g(x) - 2| = |x - 1|$, et $\delta = \varepsilon$ convient. Par le point (ii) de {{de-limite|Limite en un point}}, le prolongement de $g$ par $g(1) = 2$ est la fonction continue $x \mapsto x + 1$ : la limite bouche le trou laissé par la formule.
    - |
      La limite peut exister sur une partie de $D$ et pas sur $D$. La [[partie-entiere|partie entière]] $\lfloor x \rfloor$ vaut $0$ sur $[0, 1[$ et $1$ sur $[1, 2[$. Sur $D' = [1, 2[$, elle est constante, de limite $1$ en $1$ ; sur $D'' = [0, 1[$, sa limite en $1$ est $0$. Sur $D = [0, 2[$, elle n'a donc pas de limite en $1$, puisque, par le caractère local ({{de-limite|Limite en un point}}, (iii)), une limite sur $D$ serait aussi la limite sur $D'$ et sur $D''$.
      ```schema lex-limite-fonction-2
      Le graphe de $x \mapsto \lfloor x \rfloor$ sur $[0, 2[$ : à gauche de $1$, la fonction vaut $0$, et sa limite en $1$ sur $[0, 1[$, en bleu, est $0$ ; sur $[1, 2[$, elle vaut $1$, valeur prise en $1$ (point plein rouge). Les deux limites diffèrent, et la fonction n'a pas de limite en $1$ sur $[0, 2[$.
      ```
    - |
      Le choix fait ici, où $a$ peut appartenir à $D$, a une conséquence qui surprend. Soit $g$ nulle sur $\mathbb R \setminus \{0\}$ et $g(0) = 1$. Sur $D = \mathbb R$, qui contient $0$, une limite en $0$ devrait valoir $g(0) = 1$ ({{de-limite|Limite en un point}}, (ii)), et les valeurs nulles voisines l'interdisent : $g$ n'a pas de limite en $0$. Sur $\mathbb R \setminus \{0\}$, en revanche, sa limite en $0$ est $0$. Certains manuels excluent toujours le point $a$ ; avec eux, la limite serait $0$, et il faut savoir quelle convention on lit.

  extremum-local:
    - |
      Un extremum local n'est pas un extremum global. La fonction $f(x) = x^3 - 3x$ vérifie
      $$\begin{aligned} 2 - f(x) &= (x + 1)^2(2 - x), \\ f(x) + 2 &= (x - 1)^2(x + 2), \end{aligned}$$
      de sorte que $f(x) \leqslant f(-1) = 2$ pour $x \leqslant 2$, et $f(x) \geqslant f(1) = -2$ pour $x \geqslant -2$. Elle a donc un maximum local en $-1$ et un minimum local en $1$, avec $r = 3$, mais $f(3) = 18$ et $f(-3) = -18$. Ses taux d'accroissement en $\pm 1$, $x^2 \pm x - 2$, tendent bien vers $0$.
      ```schema lex-extremum-local-1
      Le graphe de $x \mapsto x^3 - 3x$ : le point $(-1, 2)$, en rouge, est le plus haut de la partie du graphe située au-dessus de $]{-4}, 2[$, et le point $(1, -2)$, en bleu, le plus bas au-dessus de $]{-2}, 4[$, mais la courbe monte plus haut à droite et descend plus bas à gauche.
      ```
    - |
      Un extremum local peut se trouver en un point où la fonction n'est pas dérivable, et le théorème n'en dit alors rien. La fonction $f(x) = |x^2 - 1|$ atteint son minimum $0$ en $1$ et en $-1$, où ses dérivées à droite et à gauche valent $\pm 2$. Elle a aussi un maximum local en $0$, puisque $f(x) = 1 - x^2 \leqslant 1$ pour $|x| < 1$, et là elle est dérivable, de nombre dérivé nul, comme le veut le théorème.
    - |
      Un extremum local peut ne pas être strict. La [[partie-entiere|partie entière]] a un maximum local en chaque entier $n$, puisque $\lfloor x \rfloor \leqslant n$ pour $|x - n| < 1$, et, en tout point non entier, à la fois un maximum et un minimum local, puisqu'elle y est constante au voisinage. Plus loin, le théorème de Rolle trouvera un extremum local à l'intérieur d'un segment, pour en déduire une dérivée nulle ({{de-rolle|Théorème de Rolle}}).

  derivee-successive:
    - |
      Les dérivées successives d'un polynôme finissent par s'annuler. Pour $f(x) = x^5$, on obtient $5x^4$, $20x^3$, $60x^2$, $120x$, puis la constante $120 = 5!$, et $f^{(k)} = 0$ pour $k \geqslant 6$. Plus généralement, la dérivée $k$-ième de $x^n$ est $\frac{n!}{(n - k)!}x^{n-k}$ pour $k \leqslant n$, par récurrence ({{de-operations|Opérations}}, (iv)).
    - |
      Une fonction peut être de classe $C^1$ sans être deux fois dérivable. La fonction $f(x) = x\,|x|$ est dérivable, de dérivée $f'(x) = 2|x|$ : pour $x \neq 0$, elle vaut $\pm x^2$ au voisinage, et en $0$ son taux d'accroissement $|x|$ tend vers $0$. Cette dérivée est continue, mais $x \mapsto 2|x|$ n'est pas dérivable en $0$, ses taux valant $2$ à droite et $-2$ à gauche : $f''(0)$ n'existe pas.
    - |
      Une décomposition simplifie le calcul. Sur $]{-1}, 1[$, on a $\frac1{1 - x^2} = \frac12\big(\frac1{1 - x} + \frac1{1 + x}\big)$, et une récurrence fondée sur la dérivée de $\frac1g$ ({{de-operations|Opérations}}, (iii)) donne $\big(\frac1{1 - x}\big)^{(k)} = \frac{k!}{(1 - x)^{k+1}}$. La même récurrence, faite dans le nœud {{de-taylor|Dérivées successives}}, donne $\big(\frac1{1 + x}\big)^{(k)} = \frac{(-1)^k k!}{(1 + x)^{k+1}}$ ; la dérivée $k$-ième de $f(x) = \frac1{1 - x^2}$ vaut donc en $0$
      $$f^{(k)}(0) = \frac{k!\,\big(1 + (-1)^k\big)}2,$$
      soit $k!$ pour $k$ pair et $0$ pour $k$ impair, ce qui reflète la parité de $f$.

  arc-tangente:
    - |
      L'arc tangente est encadré par deux polynômes sur $[0, +\infty[$ : $x - \frac{x^3}3 \leqslant \arctan x \leqslant x$. La majoration est le point (ii) de {{tg-arctan|Arc tangente, π}}. Pour la minoration, la fonction $g(x) = \arctan x - x + \frac{x^3}3$ a pour dérivée $\frac1{1 + x^2} - 1 + x^2 = \frac{x^4}{1 + x^2} \geqslant 0$ et s'annule en $0$. En $x = \frac12$, on obtient $0{,}4583 \leqslant 0{,}4636 \leqslant 0{,}5$.
      ```schema lex-arc-tangente-1
      Sur $[0, 2]$, le graphe de $\arctan$, en rouge, passe entre la droite $y = x$, en bleu, et la courbe $y = x - \frac{x^3}3$, en vert ; les trois courbes se confondent près de $0$, et l'arc tangente reste sous sa borne $\frac\pi2$, en pointillé.
      ```
    - |
      L'hypothèse $x > 0$ du point (iv) de {{tg-arctan|Arc tangente, π}} est indispensable. Pour $x < 0$, l'imparité donne $\arctan x + \arctan\frac1x = -\big(\arctan(-x) + \arctan\frac1{-x}\big) = -\frac\pi2$ ; ainsi $\arctan(-1) + \arctan(-1) = -\frac\pi2$. La somme saute de $-\frac\pi2$ à $\frac\pi2$ en traversant $0$, où $\frac1x$ n'est pas défini.
    - |
      Une dérivée nulle prouve une identité. La fonction $h(x) = \arctan x + \arctan\frac{1 - x}{1 + x}$ a une dérivée nulle sur $]{-1}, +\infty[$, par la dérivée d'une composée, puisque celle de $\frac{1 - x}{1 + x}$ est $-\frac2{(1 + x)^2}$. Elle y est donc constante, égale à $h(0) = \arctan 1 = \frac\pi4$, et $x = \frac12$ donne $\arctan\frac12 + \arctan\frac13 = \frac\pi4$. Sur $]{-\infty}, -1[$, autre intervalle, la constante est $-\frac{3\pi}4$, comme le montre la limite en $-\infty$.

  fonction-tangente:
    - |
      La tangente reste au-dessus de la droite $y = x$ sur $]0, \frac\pi2[$. Pour $0 < y < \frac\pi2$, posons $x = \tan y > 0$ ; le point (ii) de {{tg-arctan|Arc tangente, π}} donne $y = \arctan x < x = \tan y$. De plus $\tan\frac\pi4 = 1$, puisque $\arctan 1 = \frac\pi4$, et la pente en $0$ vaut $1 + \tan^2 0 = 1$ : la droite $y = x$ est la tangente au graphe en l'origine.
      ```schema lex-fonction-tangente-1
      Le graphe de $\tan$ sur $]{-\frac\pi2}, \frac\pi2[$, en rouge, avec la droite $y = x$, en bleu, tangente en l'origine : la courbe passe au-dessus de la droite à droite de $0$, au-dessous à gauche, et s'échappe vers l'infini le long des droites verticales $x = \pm\frac\pi2$, en pointillé.
      ```
    - |
      La réciproque d'une bijection dérivable n'est dérivable que là où la dérivée ne s'annule pas. L'arc tangente a une dérivée $\frac1{1 + x^2}$ jamais nulle, et sa réciproque $\tan$ est dérivable partout sur $]{-\frac\pi2}, \frac\pi2[$. Au contraire, $x \mapsto x^3$ est une bijection continue strictement croissante de $\mathbb R$ sur $\mathbb R$, de dérivée nulle en $0$, et sa réciproque n'est pas dérivable en $0$ ({{de-reciproque|Dérivée d'une réciproque}}, (ii)).
    - |
      La relation $\tan' = 1 + \tan^2$ donne des minorations successives. Sur $[0, \frac\pi2[$, la fonction $h(y) = \tan y - y - \frac{y^3}3$ a pour dérivée $\tan^2 y - y^2$, positive puisque $\tan y \geqslant y \geqslant 0$ ; elle s'annule en $0$, donc $\tan y \geqslant y + \frac{y^3}3$. En $y = 1$, on lit $\tan 1 \approx 1{,}5574 \geqslant \frac43$.

  cosinus-sinus:
    - |
      La construction donne des valeurs exactes. Comme $\tan\frac\pi4 = 1$, on a $\cos\frac\pi4 = \frac1{\sqrt{1 + 1}} = \frac1{\sqrt2}$ et $\sin\frac\pi4 = \tan\frac\pi4 \cos\frac\pi4 = \frac1{\sqrt2}$. La relation $f(x + \pi) = -f(x)$ donne ensuite $\cos\frac{5\pi}4 = \sin\frac{5\pi}4 = -\frac1{\sqrt2}$. Sans cette relation, l'unicité du point (ii) de {{tg-prolongement|Cosinus et sinus sur ℝ}} tombe : le prolongement de $\bar c$ de période $\pi$ est encore continu, puisque $\bar c(-\frac\pi2) = \bar c(\frac\pi2) = 0$, mais il vaut $\bar c(0) = 1$ en $\pi$, au lieu de $\cos\pi = -1$.
    - |
      Les relations de dérivation donnent des encadrements. Comme $\cos^2 + \sin^2 = 1$, on a $\cos \leqslant 1$. La fonction $h(x) = x - \sin x$, de dérivée $1 - \cos x \geqslant 0$, croît et s'annule en $0$, donc $\sin x \leqslant x$ pour $x \geqslant 0$. La fonction $k(x) = \cos x - 1 + \frac{x^2}2$, de dérivée $x - \sin x \geqslant 0$, donne alors $\cos x \geqslant 1 - \frac{x^2}2$ pour $x \geqslant 0$. Ainsi $\sin 1 \approx 0{,}8415 \leqslant 1$ et $\cos 1 \approx 0{,}5403 \geqslant \frac12$.
      ```schema lex-cosinus-sinus-2
      Sur $[0, \pi]$, le sinus, en rouge, reste sous la droite $y = x$, en pointillé rouge, et le cosinus, en bleu, au-dessus de la parabole $y = 1 - \frac{x^2}2$, en pointillé bleu ; chaque courbe touche sa borne à l'origine seulement.
      ```
    - |
      Le cosinus est strictement décroissant sur $[0, \pi]$. Le sinus y est en effet strictement positif hors des extrémités : sur $]0, \frac\pi2]$, c'est le prolongement de $s$, et, pour $\frac\pi2 < x < \pi$, la relation $\sin x = -\bar s(x - \pi)$ et l'imparité de $s$ donnent $\sin x = s(\pi - x) > 0$. Comme $\cos' = -\sin$, le cosinus est strictement décroissant sur $[0, \pi]$ ({{de-monotonie|Signe de la dérivée}}, (iii)) ; il vaut $1$ en $0$ et $\cos\pi = -\cos 0 = -1$ par la relation du point (ii) de {{tg-prolongement|Cosinus et sinus sur ℝ}}, et le théorème de la bijection ({{c-bijection|Théorème de la bijection}}) en fait une bijection de $[0, \pi]$ sur $[-1, 1]$. Plus loin, les formules d'addition en découleront ({{tg-addition|Formules d'addition}}).

  fonction-periodique:
    - |
      Une fonction périodique a beaucoup de périodes. La fonction $x \mapsto x - \lfloor x \rfloor$ est périodique de période $1$, puisque $\lfloor x + 1 \rfloor = \lfloor x \rfloor + 1$, et tout entier $n \geqslant 1$ en est aussi une période. Une fonction constante, elle, admet pour période tout réel $T > 0$, sans plus petite période.
    - |
      Une fonction non constante peut n'avoir aucune plus petite période. L'indicatrice de $\lex{ensemble-rationnels}{\mathbb Q}$ admet pour période tout rationnel $T > 0$, puisque $x + T$ est rationnel si et seulement si $x$ l'est. Un irrationnel $T > 0$ n'en est pas une période, puisque la fonction vaut $1$ en $0$ et $0$ en $T$. Les périodes sont donc les rationnels strictement positifs, qui n'ont pas de plus petit élément.
    - |
      Le carré d'une fonction périodique peut avoir une période plus courte. La relation $\sin(x + \pi) = -\sin x$ ({{tg-prolongement|Cosinus et sinus sur ℝ}}, (ii)) donne $\sin^2(x + \pi) = \sin^2 x$ : la fonction $\sin^2$ est périodique de période $\pi$, alors que $\pi$ n'est pas une période du sinus, puisque $\sin\frac{3\pi}2 = -1 \neq 1 = \sin\frac\pi2$. Plus loin, on verra que les périodes du sinus sont exactement les multiples $2k\pi$, $k \geqslant 1$ ({{tg-cercle|Paramétrage du cercle}}).
      ```schema lex-fonction-periodique-3
      Sur $[0, 2\pi]$, le sinus, en bleu, ne se répète qu'au bout de $2\pi$, alors que son carré, en rouge, reprend les mêmes valeurs au bout de $\pi$, ses deux arches étant identiques.
      ```

  nombre-e:
    - |
      Deux sommes en escalier situent $e$ entre $2$ et $3$. Comme $\frac1t$ décroît, la fonction en escalier égale à $1$ puis à $\frac23$ sur les deux moitiés de $[1, 2]$ la majore, d'où $\ln 2 \leqslant \frac12(1 + \frac23) = \frac56 < 1$. Sur $[1, 3]$, l'escalier pris aux extrémités droites des huit intervalles de longueur $\frac14$ la minore, d'où $\ln 3 \geqslant 1{,}0198 > 1$. Comme $\exp$ est croissante, $2 < e < 3$.
      ```schema lex-nombre-e-1
      Sous l'hyperbole $t \mapsto \frac1t$, les huit rectangles bleus, entre $1$ et $3$, ont une aire totale d'environ $1{,}0199$, déjà supérieure à $1$ : le point $e$, en rouge, où l'aire depuis $1$ atteint exactement $1$, est donc avant $3$.
      ```
    - |
      Le nombre $e$ a une caractérisation géométrique : c'est le seul point du graphe de $\ln$ où la tangente passe par l'origine. La tangente au point d'abscisse $x_0$ a pour équation $y = \ln x_0 + \frac{x - x_0}{x_0}$, et elle passe par $(0, 0)$ si et seulement si $\ln x_0 - 1 = 0$, c'est-à-dire $x_0 = e$. Cette tangente est alors la droite $y = \frac xe$.
    - |
      L'inégalité de la moyenne encadre $e$ par des puissances. Sur $[1, 1 + \frac1n]$, on a $\frac n{n + 1} \leqslant \frac1t \leqslant 1$, donc $\frac1{n + 1} \leqslant \ln(1 + \frac1n) \leqslant \frac1n$, et, en multipliant par $n$ ou par $n + 1$ puis en appliquant $\exp$, croissante,
      $$\Big(1 + \frac1n\Big)^n \leqslant e \leqslant \Big(1 + \frac1n\Big)^{n+1}.$$
      Pour $n = 10$, cela donne $2{,}5937 \leqslant e \leqslant 2{,}8532$. Plus loin, les sommes $\sum_{k \leqslant n} \frac1{k!}$ donneront sept décimales exactes dès $n = 10$, soit $2{,}7182818$ ({{ex-serie|Série de l'exponentielle}}).

  fonction-convexe:
    - |
      La convexité ne demande aucune dérivée. La valeur absolue est convexe : pour $a, b$ réels et $s \in [0, 1]$, l'inégalité triangulaire donne $|(1 - s)a + sb| \leqslant (1 - s)|a| + s|b|$. Elle n'est pas dérivable en $0$, et le point (i) de {{ex-convexite|Convexité}} ne s'applique pas, mais la définition est satisfaite.
    - |
      La fonction $x \mapsto x^3$ n'est pas convexe sur $\mathbb R$. Pour $a = -2$, $b = 0$ et $s = \frac12$, on a $f(-1) = -1$, alors que la corde passe à la hauteur $\frac12(f(-2) + f(0)) = -4$ : le graphe est au-dessus de cette corde. Sur $[0, +\infty[$, au contraire, $f' = 3x^2$ est croissante, et $f$ y est convexe par le point (i) de {{ex-convexite|Convexité}} : la convexité dépend de l'intervalle.
      ```schema lex-fonction-convexe-2
      Entre les points d'abscisses $-2$ et $0$, en bleu, le graphe de $x \mapsto x^3$ passe au-dessus de la corde ; au milieu, le point rouge $(-1, -1)$ est au-dessus du point $(-1, -4)$ de la corde. À droite de $0$, le graphe reste sous ses cordes.
      ```
    - |
      La fonction $-\ln$ est convexe sur $]0, +\infty[$, puisque sa dérivée $-\frac1x$ croît. Avec $s = \frac12$, cela donne $\ln\frac{a + b}2 \geqslant \frac12(\ln a + \ln b) = \ln\sqrt{ab}$, puis, par croissance de $\exp$, l'inégalité entre moyennes arithmétique et géométrique : $\frac{a + b}2 \geqslant \sqrt{ab}$. Pour $a = 1$ et $b = 9$, on lit $5 \geqslant 3$.

  subdivision:
    - |
      La partie $\sigma = \{0, \frac14, \frac12, 1\}$ est une subdivision de $[0, 1]$, numérotée $x_0 = 0 < x_1 = \frac14 < x_2 = \frac12 < x_3 = 1$, de pas $\frac12$ : c'est le plus long des trois intervalles $[x_i, x_{i+1}]$. Le pas mesure la plus grande maille, pas la maille moyenne, qui vaut ici $\frac13$.
    - |
      Les deux conditions de la définition comptent. La partie $\{\frac14, \frac12, 1\}$ n'est pas une subdivision de $[0, 1]$, faute de contenir $0$. La partie $\{0\} \cup \{\frac1n : n \geqslant 1\}$ contient $0$ et $1$, mais elle est infinie, et ses points ne se numérotent pas dans l'ordre croissant : aucun d'eux n'est le successeur de $0$.
    - |
      Une subdivision n'a pas à être régulière. Sur $[1, 8]$, la subdivision $\{1, 2, 4, 8\}$ a des intervalles de longueurs $1$, $2$ et $4$, chacune double de la précédente, et son pas vaut $4$. Ce découpage géométrique est adapté aux fonctions qui varient vite près de $1$ et lentement loin de lui.

  fonction-escalier:
    - |
      La [[partie-entiere|partie entière]] est en escalier sur $[0, 3]$ : la subdivision $\{0, 1, 2, 3\}$ convient, et $\lfloor x \rfloor$ vaut $c_0 = 0$, $c_1 = 1$ et $c_2 = 2$ sur les intervalles ouverts $]0, 1[$, $]1, 2[$ et $]2, 3[$. Ses valeurs aux points $1$, $2$, $3$ prolongent le palier de droite, mais la définition n'en demande rien.
    - |
      Ne prendre que deux valeurs ne suffit pas. Soit $f$ l'indicatrice de $\{\frac1n : n \geqslant 1\}$ sur $[0, 1]$. Pour toute subdivision, le premier intervalle $]0, x_1[$ contient des points $\frac1n$, par la propriété d'Archimède, et des points qui n'en sont pas, comme les milieux de $\frac1{n+1}$ et de $\frac1n$. La fonction n'est donc constante sur aucun intervalle $]0, x_1[$, et elle n'est pas en escalier.
    - |
      Les opérations conservent les fonctions en escalier ({{ri-escalier|Fonctions en escalier}}, (iii)). Sur $[0, 2]$, la fonction $\varphi(x) = \lfloor 2x \rfloor - 2\lfloor x \rfloor$ est en escalier, comme différence de deux fonctions en escalier : elle vaut $0$ sur $[0, \frac12[$ et sur $[1, \frac32[$, $1$ sur $[\frac12, 1[$ et sur $[\frac32, 2[$, et $0$ en $2$. Elle donne le premier chiffre après la virgule de $x$ écrit en base $2$.
      ```schema lex-fonction-escalier-3
      Le graphe de $\varphi(x) = \lfloor 2x \rfloor - 2\lfloor x \rfloor$ sur $[0, 2]$ : des créneaux de hauteur $1$ sur $[\frac12, 1[$ et sur $[\frac32, 2[$, nuls ailleurs. La subdivision $\{0, \frac12, 1, \frac32, 2\}$, marquée sur l'axe, lui est adaptée.
      ```

  riemann-integrable:
    - |
      La fonction $f(x) = x$ est intégrable sur $[0, 1]$, d'intégrale $\frac12$. Les fonctions en escalier $\varphi_n(x) = \frac{\lfloor nx \rfloor}n$ et $\psi_n = \varphi_n + \frac1n$ encadrent $f$, et
      $$\int_0^1 \varphi_n = \frac{n - 1}{2n}, \qquad \int_0^1 \psi_n = \frac{n + 1}{2n}.$$
      Ainsi $\frac{n-1}{2n} \leqslant I^-(f) \leqslant I^+(f) \leqslant \frac{n+1}{2n}$ pour tout $n \geqslant 1$ : l'écart $I^+(f) - I^-(f)$ est au plus $\frac1n$, donc nul, et les deux réels valent $\frac12$.
      ```schema lex-riemann-integrable-1
      Pour $n = 5$, l'escalier $\varphi_5$, en bleu, reste sous la diagonale $y = x$, et l'escalier $\psi_5$, en vert, au-dessus ; leurs intégrales $\frac25$ et $\frac35$ encadrent l'aire $\frac12$ du triangle, et l'écart, fait des cinq petits carrés rouges, vaut $\frac15$.
      ```
    - |
      Une fonction peut avoir une infinité de points de saut et être intégrable. L'indicatrice $f$ de $\{\frac1n : n \geqslant 1\}$ sur $[0, 1]$ n'est pas en escalier, mais, pour $0 < \varepsilon < 1$, la fonction $\psi$ égale à $1$ sur $[0, \varepsilon]$ et aux points $\frac1n > \varepsilon$, qui sont en nombre fini, et nulle ailleurs, est en escalier, majore $f$, et a pour intégrale $\varepsilon$. Avec $\varphi = 0$, on obtient $0 \leqslant I^-(f) \leqslant I^+(f) \leqslant \varepsilon$ : $f$ est intégrable, d'intégrale nulle.
    - |
      Soit $f(x) = x$ pour $x$ rationnel et $f(x) = 0$ sinon, sur $[0, 1]$ ; bornée, elle n'est pas intégrable. Une fonction en escalier $\varphi \leqslant f$ est négative sur chaque intervalle ouvert d'une subdivision adaptée, qui contient des irrationnels : $I^-(f) = 0$. Si $\psi \geqslant f$ vaut $c_i$ sur $]x_i, x_{i+1}[$, alors $c_i \geqslant x_{i+1}$, puisque l'intervalle contient des rationnels aussi proches qu'on veut de $x_{i+1}$ ({{ar-archimede|Archimède, densité de ℚ}}). Comme $x_{i+1}(x_{i+1} - x_i) \geqslant \frac12(x_{i+1}^2 - x_i^2)$, on obtient $\int \psi \geqslant \frac12$, donc $I^+(f) \geqslant \frac12 > 0 = I^-(f)$.

  somme-riemann:
    - |
      Les sommes de Riemann calculent des intégrales que l'on ne sait pas encore obtenir autrement. La fonction $f(x) = x^3$, continue, est intégrable sur $[0, 2]$ ({{ri-continues|Fonctions continues}}). Avec $h = \frac2n$ et la formule $\sum_{k=1}^{n} k^3 = \big(\frac{n(n+1)}2\big)^2$, qui se démontre par récurrence, la somme régulière pointée à droite vaut
      $$h \sum_{k=1}^{n} (kh)^3 = \frac{4(n + 1)^2}{n^2},$$
      qui tend vers $4$ : par le point (iii) de {{ri-sommes|Sommes de Riemann}}, $\int_0^2 x^3\,dx = 4$. Pour $n = 4$, la somme vaut $6{,}25$, et la somme pointée à gauche $2{,}25$.
      ```schema lex-somme-riemann-1
      Pour $f(x) = x^3$ sur $[0, 2]$ et $n = 4$, les rectangles bleus, de hauteur la valeur de $f$ au bord droit de chaque intervalle, ont une aire totale de $6{,}25$, et les rectangles rouges, pointés au bord gauche, de $2{,}25$ ; l'intégrale, $4$, est entre les deux.
      ```
    - |
      Il faut que le pas tende vers $0$, et non seulement le nombre de points. Sur $[0, 1]$, prenons la subdivision formée de $0$ et des points $\frac12 + \frac k{2n}$, pour $0 \leqslant k \leqslant n$ : seule la moitié droite est raffinée. Pour $f(x) = x$, pointée à gauche sur $[\frac12, 1]$ et en $\xi_0$ sur $[0, \frac12]$, la somme vaut $\frac{\xi_0}2 + \frac14 + \frac{n - 1}{8n}$, qui tend vers $\frac38$ si $\xi_0 = 0$ et vers $\frac58$ si $\xi_0 = \frac12$. Aucune des deux limites n'est l'intégrale $\frac12$.
    - |
      Certaines suites se lisent comme des sommes de Riemann. La somme $\sum_{k=1}^{n} \frac{n}{n^2 + k^2}$ s'écrit $\frac1n \sum_{k=1}^{n} \frac{1}{1 + (k/n)^2}$, somme régulière de $t \mapsto \frac1{1 + t^2}$ sur $[0, 1]$, pointée à droite ; elle tend donc vers $\int_0^1 \frac{dt}{1 + t^2}$, et vaut $0{,}7600$ pour $n = 10$. Plus loin, cette intégrale sera $\arctan 1 = \frac\pi4 \approx 0{,}7854$ ({{tg-arctan|Arc tangente, π}}).

  filtre-convergent:
    - |
      Sans séparation, un filtre peut avoir deux limites. Sur $X = \{a, b\}$, les parties $\varnothing$, $\{a\}$ et $X$ forment une [[topologie]], et le seul [[voisinage]] de $b$ est $X$. Le filtre principal en $a$, formé des parties qui contiennent $a$, converge donc vers $a$ et vers $b$. Le filtre principal en $b$, lui, converge vers $b$ seulement, puisque le voisinage $\{a\}$ de $a$ ne contient pas $b$.
    - |
      Sur $\lex{ensemble-entiers-naturels}{\mathbb N}$, muni de la [[topologie-discrete|topologie discrète]], le singleton $\{x\}$ est un voisinage de $x$, et un filtre converge vers $x$ si et seulement s'il contient $\{x\}$, c'est-à-dire s'il est le filtre principal en $x$. Le filtre des parties de complémentaire fini ne contient aucun singleton, et ne converge donc vers aucun point. Un [[ultrafiltre]] qui le contient, fourni par le lemme de l'ultrafiltre ⋆, ne converge pas davantage : c'est ce que demande le point (ii) de {{tr-ultrafiltres|Compacité et ultrafiltres}}, puisque $\mathbb N$ discret n'est pas [[compact]], son recouvrement par les singletons n'ayant pas de sous-recouvrement fini.
    - |
      Sur un ensemble fini, tout ultrafiltre est principal, donc converge vers son point. Soit $\mathcal U$ un ultrafiltre sur $X = \{a, b, c\}$. S'il ne contenait aucun des singletons, il contiendrait leurs complémentaires ({{o-ultrafiltre|Ultrafiltres}}, (i)), donc leur intersection, qui est vide. Il contient ainsi un singleton $\{a\}$, puis toutes les parties qui contiennent $a$ ; le filtre principal en $a$ étant déjà un ultrafiltre, $\mathcal U$ lui est égal. C'est conforme au point (ii) de {{tr-ultrafiltres|Compacité et ultrafiltres}} : un espace fini séparé est compact.

  exponentielle:
    - |
      La bijectivité de l'exponentielle résout des équations. Pour $\exp(2x) - 3\exp(x) + 2 = 0$, posons $X = \exp x$, de sorte que $\exp(2x) = X^2$ par (iii) de {{ex-exponentielle|Exponentielle}} : l'équation devient $X^2 - 3X + 2 = 0$, de solutions $X = 1$ et $X = 2$. Comme $\exp$ est une bijection de $\mathbb R$ sur $]0, +\infty[$, de réciproque $\ln$, les solutions sont $x = 0$ et $x = \ln 2$.
    - |
      L'exponentielle reste au-dessus de sa tangente en $0$ : $\exp x \geqslant 1 + x$ pour tout réel $x$. La fonction $g(x) = \exp x - 1 - x$ a pour dérivée $\exp x - 1$, négative sur $]{-\infty}, 0]$ et positive sur $[0, +\infty[$ puisque $\exp$ croît et vaut $1$ en $0$. Elle décroît puis croît ({{de-monotonie|Signe de la dérivée}}), et son minimum est $g(0) = 0$.
      ```schema lex-exponentielle-2
      Le graphe de $\exp$, en rouge, reste au-dessus de sa tangente $y = 1 + x$ au point $(0, 1)$, en bleu, et ne la touche qu'en ce point.
      ```
    - |
      L'équation fonctionnelle caractérise l'exponentielle parmi les fonctions dérivables. Soit $f : \mathbb R \to \mathbb R$ dérivable, avec $f(x + y) = f(x)f(y)$ et $f'(0) = 1$. Alors $f(0) = f(0)^2$, et $f(0) = 0$ rendrait $f$ nulle, contre $f'(0) = 1$ ; donc $f(0) = 1$, et le taux $\frac{f(x + h) - f(x)}h = f(x)\frac{f(h) - 1}h$ tend vers $f(x)$. Par (v) de {{ex-exponentielle|Exponentielle}}, $f = \exp$. Sans la condition $f'(0) = 1$, la conclusion tombe : $x \mapsto \exp(2x)$ et la fonction nulle vérifient encore $f(x + y) = f(x)f(y)$. Plus loin, l'exponentielle sera aussi la limite des polynômes $\sum_{k \leqslant n} \frac{x^k}{k!}$ ({{ex-serie|Série de l'exponentielle}}).

  pi:
    - |
      Le nombre $\pi$ se calcule par des sommes de Riemann. Par (iv) de {{tg-arctan|Arc tangente, π}}, $\frac\pi4 = \arctan 1 = \int_0^1 \frac{dt}{1 + t^2}$. La fonction intégrée décroît, de sorte que les sommes régulières pointées à droite et à gauche l'encadrent. Pour $n = 10$, elles valent $0{,}75998$ et $0{,}80998$, d'où $3{,}0399 < \pi < 3{,}2400$ : la définition par la borne supérieure donne bien le nombre attendu.
      ```schema lex-pi-1
      Sous la courbe de $t \mapsto \frac1{1 + t^2}$ sur $[0, 1]$, d'aire $\frac\pi4$, les dix rectangles rouges sont contenus dans la région, et les dix rectangles bleus la contiennent ; leurs aires, environ $0{,}760$ et $0{,}810$, encadrent $\frac\pi4 \approx 0{,}785$.
      ```
    - |
      La borne supérieure qui définit $\frac\pi2$ n'est pas atteinte : $\arctan x < \frac\pi2$ pour tout réel $x$. Pour $x > 0$, l'écart vaut $\frac\pi2 - \arctan x = \arctan\frac1x < \frac1x$ : il tend vers $0$, mais lentement : en $x = 100$, il vaut encore $\arctan\frac1{100} \approx 0{,}0099997$.
    - |
      Deux polynômes suffisent à situer $\pi$ entre $\frac83$ et $\frac{10}3$. Par (iv) de {{tg-arctan|Arc tangente, π}} et l'imparité de l'arc tangente, $\int_{-1}^1 \frac{dt}{1 + t^2} = \frac\pi2$. Pour $t^2 \leqslant 1$, on a $(1 + t^2)(1 - t^2) = 1 - t^4 \leqslant 1$ et $(1 + t^2)(1 - \frac{t^2}2) = 1 + \frac{t^2}2(1 - t^2) \geqslant 1$, donc $1 - t^2 \leqslant \frac1{1 + t^2} \leqslant 1 - \frac{t^2}2$. Avec $\int_{-1}^1 t^2\,dt = \frac23$, il vient $\frac43 \leqslant \frac\pi2 \leqslant \frac53$. Plus loin, $\frac\pi2$ sera le plus petit zéro strictement positif du cosinus ({{tg-cercle|Paramétrage du cercle}}).

  logarithme:
    - |
      L'inégalité de la moyenne encadre le logarithme. Pour $x > 1$ et $t \in [1, x]$, on a $\frac1x \leqslant \frac1t \leqslant 1$, donc ({{ri-moyenne|Inégalité de la moyenne}}, (i))
      $$\frac{x - 1}x \leqslant \ln x \leqslant x - 1.$$
      Pour $x = 2$, il vient $\frac12 \leqslant \ln 2 \leqslant 1$, alors que $\ln 2 \approx 0{,}6931$. L'encadrement est grossier loin de $1$, mais il montre déjà que $\frac{\ln x}{x - 1}$, compris entre $\frac1x$ et $1$, tend vers $1$ quand $x$ tend vers $1$ par valeurs supérieures.
    - |
      Le logarithme n'a pas de sens pour $x \leqslant 0$, et l'on ne peut pas le prolonger par la même intégrale. La fonction $t \mapsto \frac1t$ n'est bornée sur aucun segment contenant $0$, et n'y est donc pas intégrable au sens de Riemann : l'écriture $\int_{-1}^{1} \frac{dt}t$, qu'on serait tenté d'annuler par symétrie, ne désigne rien. Sur $]{-\infty}, 0[$, c'est la fonction $x \mapsto \ln(-x)$ qui a pour dérivée $\frac1x$, par la dérivée d'une composée.
    - |
      Le logarithme mesure la croissance des sommes harmoniques. La fonction $t \mapsto \frac1t$ décroît, donc $\frac1{k + 1} \leqslant \int_k^{k+1} \frac{dt}t \leqslant \frac1k$, et la relation de Chasles donne, pour $n \geqslant 2$,
      $$\sum_{k=2}^{n} \frac1k \leqslant \ln n \leqslant \sum_{k=1}^{n-1} \frac1k.$$
      Pour $n = 10$, on obtient $1{,}928 \leqslant \ln 10 \leqslant 2{,}829$, avec $\ln 10 \approx 2{,}3026$. Les sommes $\sum_{k \leqslant n} \frac1k$ tendent vers $+\infty$, mais à la vitesse, très lente, du logarithme.
      ```schema lex-logarithme-3
      Sous l'hyperbole $t \mapsto \frac1t$, entre $1$ et $6$, l'aire $\ln 6$ est comprise entre celle des rectangles rouges, de hauteurs $\frac12, \dots, \frac16$, et celle des rectangles bleus, de hauteurs $1, \dots, \frac15$, qui les contiennent.
      ```

  sphere-unite:
    - |
      Le cercle $S^1$ a une infinité de points à coordonnées rationnelles. Pour tout réel $t$, le point
      $$\Big(\frac{1 - t^2}{1 + t^2},\ \frac{2t}{1 + t^2}\Big)$$
      appartient à $S^1$, comme le montre un développement, et c'est le second point d'intersection du cercle avec la droite de pente $t$ issue de $(-1, 0)$. Pour $t = \frac12$ et $t = \frac23$, on obtient $(\frac35, \frac45)$ et $(\frac5{13}, \frac{12}{13})$, d'où les égalités $3^2 + 4^2 = 5^2$ et $5^2 + 12^2 = 13^2$.
      ```schema lex-sphere-unite-1
      Les droites issues de $(-1, 0)$, de pentes $\frac12$ en bleu et $\frac23$ en vert, recoupent le cercle $S^1$, en rouge, aux points rationnels $(\frac35, \frac45)$ et $(\frac5{13}, \frac{12}{13})$ ; à toute pente rationnelle correspond ainsi un point rationnel du cercle.
      ```
    - |
      Pour la compacité de $S^n$, il ne suffit pas qu'elle soit fermée : la preuve emploie aussi son inclusion dans un produit de segments. L'hyperbole $\{(x, y) : x^2 - y^2 = 1\}$ est fermée dans $\mathbb R^2$, image réciproque de $\{1\}$ par une fonction polynomiale ({{tr-sphere|Sphère unité}}, (i)), mais elle n'est pas compacte. Les [[cylindre-ouvert|cylindres ouverts]] $]{-N}, N[^2$, pour $N \geqslant 1$, la recouvrent, et aucun d'eux ne contient le point $\big(\frac{t + 1/t}2, \frac{t - 1/t}2\big)$ de l'hyperbole pour $t = 2N$, dont l'abscisse dépasse $N$ : aucun sous-recouvrement fini n'existe.
    - |
      Les sphères s'emboîtent : l'application $x \mapsto (x, 0)$ envoie $S^n$ dans $S^{n+1}$, sur son « équateur », formé des points de dernière coordonnée nulle. Ainsi $S^0 = \{-1, 1\}$ s'identifie aux deux points $(\pm 1, 0)$ de $S^1$, et $S^1$ au cercle $x_3 = 0$ de $S^2$. La sphère $S^0$ n'est pas connexe ({{tr-sphere|Sphère unité}}, (iii)). Plus loin, on verra que $S^n$ l'est dès que $n \geqslant 1$ ({{h-spheres|Homologie des sphères}}).

  topologie-usuelle:
    - |
      La partie $K = \{0\} \cup \{\frac1n : n \geqslant 1\}$ est fermée. Son complémentaire est la réunion de $]{-\infty}, 0[$, de $]1, +\infty[$ et des intervalles $]\frac1{n + 1}, \frac1n[$, puisqu'un réel $x \in \,]0, 1[$ qui n'est pas dans $K$ est compris entre $\frac1{n+1}$ et $\frac1n$ pour $n = \lfloor \frac1x \rfloor$. C'est une réunion d'ouverts. Sans le point $0$, la partie $\{\frac1n : n \geqslant 1\}$ n'est plus fermée : toute boule centrée en $0$ la rencontre, par la propriété d'Archimède.
    - |
      Une réunion infinie de fermés n'est pas toujours fermée. Les segments $[\frac1n, 1]$, pour $n \geqslant 1$, sont fermés ({{tr-ouverts|Topologie usuelle}}, (ii)), mais leur réunion est $]0, 1]$, par la propriété d'Archimède. Or $]0, 1]$ n'est pas fermé, puisque toute boule centrée en $0$, point de son complémentaire, rencontre $]0, 1]$. C'est la forme duale de la limitation des intersections d'ouverts aux familles finies.
    - |
      La [[topologie-induite|topologie induite]] sur $K = \{0\} \cup \{\frac1n : n \geqslant 1\}$ distingue deux sortes de points. Chaque singleton $\{\frac1n\}$ y est ouvert, trace de l'intervalle $]\frac1{n+1}, \frac1{n-1}[$ (de $]\frac12, 2[$ pour $n = 1$), alors que $\{0\}$ ne l'est pas, puisque toute boule centrée en $0$ contient des points $\frac1n$ ({{tr-ouverts|Topologie usuelle}}, (iv)). Sur $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, de même, la topologie induite est la [[topologie-discrete|topologie discrète]], car $\{n\} = \mathbb Z \cap \,]n - \frac12, n + \frac12[$.
      ```schema lex-topologie-usuelle-3
      Les points de $K$ : chaque point $\frac1n$, en bleu, est isolé par un petit intervalle ouvert qui ne contient aucun autre point de $K$, tandis que tout intervalle ouvert centré en $0$, en rouge, en contient une infinité.
      ```

  partie-dense:
    - |
      Les nombres dyadiques $\frac k{2^n}$, avec $k \in \lex{ensemble-entiers-relatifs}{\mathbb Z}$ et $n \in \lex{ensemble-entiers-naturels}{\mathbb N}$, forment une partie dense de $\mathbb R$. Soit $a < b$. Comme $2^n$ tend vers $+\infty$, il existe $n$ tel que $2^n(b - a) > 1$ ; l'entier $k = \lfloor 2^n a \rfloor + 1$ vérifie alors $a < \frac k{2^n} \leqslant a + \frac1{2^n} < b$. Ainsi l'intervalle $]0{,}3 ; 0{,}4[$ contient $\frac5{16}$, que donne $n = 4$.
      ```schema lex-partie-dense-1
      Les dyadiques de dénominateur $2^n$, pour $n = 1$ à $4$, entre $0$ et $1$ : leur pas est divisé par deux à chaque ligne. L'intervalle $]0{,}3 ; 0{,}4[$, en rouge, ne contient aucun d'eux pour $n \leqslant 2$, il contient $\frac38$ pour $n = 3$, et il en contient forcément un dès que le pas $\frac1{2^n}$ est inférieur à sa longueur, ici pour $n = 4$.
      ```
    - |
      L'intersection de deux parties denses peut être vide : $\lex{ensemble-rationnels}{\mathbb Q}$ et $\mathbb R \setminus \mathbb Q$ sont denses par les points (i) et (iii) de {{tr-dense|Densité}}, et disjointes. Une partie dense peut aussi être d'intérieur vide, comme $\mathbb Q$, alors que $\mathbb R \setminus \{0\}$ est dense et ouverte. La densité dit que la partie est partout présente, pas qu'elle occupe de la place.
    - |
      Dans un [[espace-topologique|espace topologique]] fini, la densité se calcule. Sur $X = \{a, b\}$, dont les ouverts sont $\varnothing$, $\{a\}$ et $X$, les fermés sont $X$, $\{b\}$ et $\varnothing$. Le seul fermé contenant $a$ est $X$, donc $\{a\}$ est dense ; $\{b\}$, fermé, est sa propre [[adherence|adhérence]] et n'est pas dense. Pour la topologie discrète, au contraire, seule $X$ est dense, et pour la topologie grossière, toute partie non vide l'est.

  puissance-reelle:
    - |
      Une variable à la fois en base et en exposant se traite par la définition. La fonction $x \mapsto x^x = \exp(x\ln x)$, sur $]0, +\infty[$, a pour dérivée $(\ln x + 1)\,x^x$, qui s'annule en $x = \frac1e$, négative avant et positive après. Son minimum est $\big(\frac1e\big)^{1/e} = e^{-1/e} \approx 0{,}6922$ : aucune des deux règles, celle de $x^a$ ou celle de $a^x$, ne s'appliquait seule.
      ```schema lex-puissance-reelle-1
      Le graphe de $x \mapsto x^x$ sur $]0, 2]$ : il descend jusqu'au minimum $e^{-1/e} \approx 0{,}692$, atteint en $\frac1e \approx 0{,}368$ et marqué en rouge, puis remonte en passant par $(1, 1)$ ; le point creux marque l'extrémité $x = 0$, exclue du domaine.
      ```
    - |
      Les puissances rationnelles d'une base négative dépendraient de l'écriture de l'exposant. Si l'on définissait $(-8)^{1/3}$ comme le réel $z$ tel que $z^3 = -8$, on trouverait $-2$. Mais $\frac13 = \frac26$, et le réel positif $z$ tel que $z^6 = (-8)^2 = 64$ est $2$. C'est pourquoi la puissance réelle n'est définie que pour une base strictement positive.
    - |
      À base fixée, le sens de variation dépend de la base. La dérivée de $a \mapsto x^a$ est $(\ln x)\,x^a$ ({{ex-puissances|Puissances réelles}}, (iii)) : pour $0 < x < 1$, elle est négative, et les puissances décroissent quand l'exposant croît. Ainsi $(\frac12)^{1/2} \approx 0{,}7071$ dépasse $(\frac12)^1 = 0{,}5$, ce qui heurte l'intuition formée sur les bases supérieures à $1$.

  suite-monotone:
    - |
      Une suite peut n'être monotone qu'à partir d'un certain rang, et le théorème s'applique encore, puisque la convergence ne dépend pas des premiers termes. Pour $u_n = \frac{n^2}{2^n}$, on a $u_{n+1} \leqslant u_n$ si et seulement si $(n + 1)^2 \leqslant 2n^2$, c'est-à-dire $(n - 1)^2 \geqslant 2$, soit $n \geqslant 3$. La suite, minorée par $0$, décroît à partir du rang $3$ et converge, alors qu'elle commence par croître : $0$, $\frac12$, $1$, $\frac98$, puis $1$, $\frac{25}{32}$.
      ```schema lex-suite-monotone-1
      Les trois premiers termes, en bleu, croissent ; à partir de $u_3 = \frac98$, les termes, en rouge, décroissent en restant positifs. C'est cette queue décroissante et minorée qui converge.
      ```
    - |
      Sans majoration, une suite croissante n'a pas de limite finie. Les sommes $H_n = \sum_{k=1}^{n} \frac1k$ croissent, mais en groupant les termes de $2^{j-1} + 1$ à $2^j$, dont il y a $2^{j-1}$, tous au moins égaux à $\frac1{2^j}$, on obtient
      $$H_{2^m} \geqslant 1 + \frac m2.$$
      La suite n'est donc pas majorée et tend vers $+\infty$, par la seconde partie du théorème ({{su-monotone|Limite monotone}}), bien que ses accroissements $\frac1{n+1}$ tendent vers $0$.
    - |
      Le théorème prouve la convergence de suites récurrentes dont on ignore encore la limite. Posons $u_0 = 2$ et $u_{n+1} = \frac12\big(u_n + \frac2{u_n}\big)$. Par récurrence, $u_n > 0$, et les identités
      $$\begin{aligned} u_{n+1}^2 - 2 &= \frac{(u_n^2 - 2)^2}{4u_n^2}, \\ u_{n+1} - u_n &= \frac{2 - u_n^2}{2u_n} \end{aligned}$$
      donnent $u_n^2 \geqslant 2$ pour tout $n$, puis $u_{n+1} \leqslant u_n$. La suite décroît, et elle est minorée par $1$, puisque $u_n^2 \geqslant 2 > 1$ : elle converge. Ses termes sont $2$, $\frac32$, $\frac{17}{12}$, $\frac{577}{408}$… Plus loin, les suites adjacentes ({{su-adjacentes|Suites adjacentes}}) montreront que son carré vaut $2$.

  suite-bornee:
    - |
      Une suite bornée peut diverger, même lorsque ses termes se rapprochent de deux valeurs bien précises. La suite $u_n = (-1)^n\frac{n}{n + 1}$ vérifie $|u_n| < 1$. Si elle convergeait vers $\ell$, on aurait $|u_n - \ell| < \frac12$ pour tout $n \geqslant N$, avec $N \geqslant 1$, d'où $|u_{2N} - u_{2N+1}| < 1$ par l'inégalité triangulaire ; or ce réel vaut $\frac{2N}{2N + 1} + \frac{2N + 1}{2N + 2} \geqslant \frac{17}{12}$.
      ```schema lex-suite-bornee-1
      Les termes de $u_n = (-1)^n\frac{n}{n + 1}$ restent dans la bande grise $]{-1}, 1[$, sans jamais atteindre ses bords : la suite est bornée. Les termes pairs, en rouge, s'approchent de $1$, et les termes impairs, en bleu, de $-1$, si bien qu'aucun réel n'est approché par tous à la fois.
      ```
    - |
      La suite $u_n = 1 - n$ est majorée par $1$, mais elle n'est pas minorée : un minorant $m$ vérifierait $n \leqslant 1 - m$ pour tout $n$, contre la propriété d'Archimède. Elle n'est donc pas bornée, et elle diverge par contraposée du point (ii) de {{su-bornee|Unicité, bornitude}}. Être bornée demande les deux inégalités à la fois ; si $m \leqslant u_n \leqslant M$, le réel $\max(|m|, |M|)$ majore $|u_n|$.
    - |
      La preuve du point (ii) de {{su-bornee|Unicité, bornitude}} donne un majorant explicite, mais qui peut être grand. La suite $u_n = \dfrac{100}{n - 10{,}5}$ tend vers $0$, et $|u_n| \leqslant 1$ à partir du rang $111$, pas avant. Les cent onze premiers termes doivent être majorés à part : le plus grand d'entre eux en valeur absolue est $|u_{10}| = |u_{11}| = 200$. La suite est bornée par $200$, une borne atteinte qui ne dit rien de la limite.

  inegalite-triangulaire:
    - |
      L'inégalité est une égalité exactement quand $x$ et $y$ sont de même signe, c'est-à-dire quand $xy \geqslant 0$. Les deux membres sont positifs, et, puisque $|xy| = |x|\,|y|$, donc $|z|^2 = |z^2| = z^2$,
      $$(|x| + |y|)^2 - |x + y|^2 = 2\big(|xy| - xy\big).$$
      Or deux réels positifs de même carré sont égaux, car $a^2 - b^2 = (a - b)(a + b)$. Pour $x = 3$ et $y = -5$, on trouve $|x + y| = 2 < 8 = |x| + |y|$ : les deux déplacements se compensent en partie.
      ```schema lex-inegalite-triangulaire-1
      Pour $x = 3$ et $y = -5$, le trajet de $0$ à $x$, en bleu, puis de $x$ à $x + y$, en vert, a pour longueur totale $|x| + |y| = 8$, alors que le point d'arrivée $x + y = -2$, en rouge, n'est qu'à distance $2$ de l'origine.
      ```
    - |
      On en déduit l'inégalité renversée $\big||x| - |y|\big| \leqslant |x - y|$. En effet $|x| = |(x - y) + y| \leqslant |x - y| + |y|$, donc $|x| - |y| \leqslant |x - y|$, et l'on échange les rôles de $x$ et de $y$. Deux réels proches ont des [[valeur-absolue|valeurs absolues]] proches ; la réciproque est fausse, puisque $x = -1$ et $y = 1$ ont la même valeur absolue et sont à distance $2$.
    - |
      Dans un [[espace-metrique|espace métrique]], l'inégalité triangulaire ne découle pas des deux autres axiomes. Sur $\lex{ensemble-reels}{\mathbb R}$, la fonction $d(x, y) = (x - y)^2$ est symétrique et ne s'annule que pour $x = y$, mais
      $$d(0, 2) = 4 > 2 = d(0, 1) + d(1, 2).$$
      Élever l'écart au carré pénalise les grands sauts plus que la somme des petits, et c'est l'inégalité triangulaire qui interdit ce défaut.

  a-partir-certain-rang:
    - |
      La propriété $n^2 > 10n + 100$ est vraie à partir du rang $17$, et pas avant : pour $n = 16$, on a $256 < 260$. Pour $n \geqslant 17$, en effet, $n(n - 10) - 100 \geqslant 17 \cdot 7 - 100 = 19 > 0$, puisque $n(n - 10)$ croît avec $n$ dès que $n \geqslant 10$. Le rang n'est pas unique : tout $N \geqslant 17$ convient aussi, et la définition ne demande que l'existence d'un tel $N$.
    - |
      Être vraie à partir d'un certain rang est bien plus fort qu'être vraie pour une infinité d'entiers. Si $P$ est vraie pour $n \geqslant N$ et $Q$ pour $n \geqslant N'$, la conjonction de $P$ et de $Q$ est vraie pour $n \geqslant \max(N, N')$. Au contraire, « $n$ est pair » et « $n$ est impair » sont vraies chacune pour une infinité d'entiers, et leur conjonction n'est vraie pour aucun.
      ```schema lex-a-partir-certain-rang-2
      Sur la première ligne, les entiers $n$ pour lesquels $n^2 > 10n + 100$, en rouge, forment toute la queue qui commence à $17$. Sur la deuxième, les entiers pairs, en bleu, reviennent sans cesse mais laissent toujours des trous : la propriété n'est vraie à partir d'aucun rang.
      ```
    - |
      La négation se lit sur la définition : $P$ n'est pas vraie à partir d'un certain rang si et seulement si, pour tout $N$, il existe $n \geqslant N$ tel que $P(n)$ soit fausse, c'est-à-dire si $P$ est fausse pour une infinité d'entiers. Ainsi la suite $((-1)^n)$ ne converge pas vers $1$ : pour $\varepsilon = 1$, l'inégalité $|(-1)^n - 1| < 1$ est fausse pour tous les entiers impairs.

  taux-accroissement:
    - |
      Le taux d'accroissement est la pente d'une corde. Pour $f(x) = x^2$, la corde qui joint les points d'abscisses $a$ et $b$ a pour pente
      $$\frac{b^2 - a^2}{b - a} = a + b,$$
      et, comme le taux en $c$ tend vers $2c$, c'est aussi le nombre dérivé au milieu $c = \frac{a + b}2$. Sur $[1, 3]$, la corde a pour pente $4$, celle de la tangente en $2$ : pour une parabole, la corde est toujours parallèle à la tangente au milieu.
      ```schema lex-taux-accroissement-1
      Sur la parabole $y = x^2$, la corde rouge qui joint $(1, 1)$ à $(3, 9)$ a pour pente $\tau_1(3) = 4$, et la tangente bleue au point d'abscisse $2$, milieu de $1$ et de $3$, lui est parallèle.
      ```
    - |
      Un saut de la fonction rend le taux non borné. Pour la [[partie-entiere|partie entière]] en $a = 1$, on a $\tau_1(x) = 0$ pour $1 < x < 2$, mais, pour $0 \leqslant x < 1$,
      $$\tau_1(x) = \frac{0 - 1}{x - 1} = \frac1{1 - x},$$
      qui dépasse tout réel quand $x$ s'approche de $1$ par la gauche : $\tau_1(1 - \frac1m) = m$. Le taux n'a donc pas de limite finie en $1$, et $x \mapsto \lfloor x \rfloor$ n'y est pas dérivable.
    - |
      Un taux borné ne suffit pas. Soit $f(x) = x$ si $x$ est rationnel et $f(x) = 0$ sinon. En $0$, le taux $\tau_0(x) = \frac{f(x)}x$ vaut $1$ aux rationnels non nuls et $0$ aux irrationnels : il reste dans $[0, 1]$, mais, par densité ({{tr-dense|Densité}}), tout intervalle $]{-\delta}, \delta[$ contient des points des deux sortes, et $\tau_0$ n'a pas de limite en $0$. La fonction est pourtant continue en $0$, puisque $|f(x)| \leqslant |x|$ : la continuité en un point ne donne pas la dérivabilité.

  partie-etoilee:
    - |
      Le plan privé de la demi-droite $L = \{(x, 0) : x \leqslant 0\}$ est étoilé par rapport à $(1, 0)$. Pour $p = (x, y)$ hors de $L$ et $t \in [0, 1]$, le point $(1 - t + tx, ty)$ n'est sur $L$ que si $ty = 0$ ; si $t = 0$, c'est $(1, 0)$, et si $y = 0$, alors $x > 0$, donc $1 - t + tx > 0$. Il n'est pas étoilé par rapport à $(0, 1)$, puisque le segment qui joint ce point à $(0, -1)$ passe par l'origine.
      ```schema lex-partie-etoilee-1
      Le plan privé de la demi-droite rouge : les segments bleus issus de $(1, 0)$ atteignent tous les points sans toucher la demi-droite, alors que le segment vert qui joint $(0, 1)$ à $(0, -1)$ la rencontre en l'origine, son extrémité, marquée d'un point rouge.
      ```
    - |
      La partie $A = \{(x, y) : 1 \leqslant x^2 + y^2 \leqslant 4\}$ n'est étoilée par rapport à aucun de ses points. Si $a \in A$, le point $-a$ appartient aussi à $A$, et le milieu de $a$ et de $-a$ est l'origine, qui n'est pas dans $A$. Le trou central suffit à faire échouer la condition en tout point.
    - |
      Dans $\lex{ensemble-reels}{\mathbb R}$, étoilée et convexe reviennent au même. Soit $C$ étoilée par rapport à $a$, et $x < z < y$ avec $x, y \in C$. Si $z \leqslant a$, alors $x < a$, et $z = (1 - t)a + tx$ avec $t = \frac{a - z}{a - x} \in [0, 1]$, donc $z \in C$ ; si $z \geqslant a$, on raisonne de même avec $y$. Par le point (i) de {{tr-intervalles|Intervalles de ℝ}}, $C$ est un [[intervalle]]. Plus loin, le lemme de Poincaré dira que, sur un ouvert étoilé, toute forme fermée est exacte ({{gd-poincare|Lemme de Poincaré}}).

  partie-convexe:
    - |
      La partie $C = \{(x, y) \in \mathbb R^2 : y \geqslant x^2\}$, au-dessus de la parabole, est convexe. Pour $a = (a_1, a_2)$ et $b = (b_1, b_2)$ dans $C$ et $t \in [0, 1]$, on a l'identité
      $$\begin{aligned} (1 - t)a_1^2 + tb_1^2 &= \big((1 - t)a_1 + tb_1\big)^2 \\ &\quad + t(1 - t)(a_1 - b_1)^2, \end{aligned}$$
      dont le dernier terme est positif, d'où
      $$\begin{aligned} (1 - t)a_2 + tb_2 &\geqslant (1 - t)a_1^2 + tb_1^2 \\ &\geqslant \big((1 - t)a_1 + tb_1\big)^2. \end{aligned}$$
      Le calcul dit que la corde d'une parabole reste au-dessus de la courbe.
    - |
      La réunion des deux axes, $\{(x, y) \in \mathbb R^2 : xy = 0\}$, est [[partie-etoilee|étoilée]] par rapport à l'origine, puisque le segment qui joint $(0, 0)$ à un point d'un axe reste sur cet axe. Elle n'est pas convexe : le milieu $(\frac12, \frac12)$ des points $(1, 0)$ et $(0, 1)$ n'en fait pas partie. Étoilée par rapport à un point ne veut donc pas dire étoilée par rapport à tous ses points.
      ```schema lex-partie-convexe-2
      La réunion des deux axes, en rouge, contient $(1, 0)$ et $(0, 1)$, mais le segment qui joint ces deux points, en pointillé, ne la rencontre qu'en ses extrémités : son milieu $(\frac12, \frac12)$, marqué d'un point creux, n'en fait pas partie. Les segments issus de l'origine, en bleu, restent au contraire sur les axes.
      ```
    - |
      Pour $n = 1$, une partie convexe est un [[intervalle]], et les contre-exemples sont les parties « trouées ». La partie $\mathbb R \setminus \{0\}$ n'est pas convexe, puisque le milieu de $-1$ et de $1$ est $0$ ; de même $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, qui contient $0$ et $1$ mais pas $\frac12$. Il ne faut pas confondre convexe et « d'un seul tenant » : la réunion des deux axes du deuxième exemple est d'un seul tenant sans être convexe.

  convergence-simple:
    - |
      Le rang dépend du point, et c'est ce qui distingue la convergence simple. Les fonctions $f_n(x) = \frac xn$, pour $n \geqslant 1$, convergent simplement vers $0$ sur $\lex{ensemble-reels}{\mathbb R}$ : pour $x$ fixé, $|\frac xn| < \varepsilon$ dès que $n > \frac{|x|}\varepsilon$, ce qu'assure la propriété d'Archimède. Mais aucun rang ne convient pour tous les $x$ à la fois, puisque, pour tout $N \geqslant 1$, le point $x = N\varepsilon$ donne $|f_N(x)| = \varepsilon$.
    - |
      Les fonctions $f_n(x) = x^n$ convergent simplement sur $[0, 1]$ vers la fonction $f$ nulle sur $[0, 1[$ et égale à $1$ en $1$. Pour $0 < x < 1$, écrivons $\frac1x = 1 + h$ avec $h > 0$. L'inégalité $(1 + h)^n \geqslant 1 + nh$ se démontre par récurrence, en multipliant par $1 + h$, et donne
      $$0 < x^n \leqslant \frac1{1 + nh} < \frac1{nh},$$
      inférieur à $\varepsilon$ dès que $n > \frac1{h\varepsilon}$. Chaque $f_n$ est strictement croissante, mais pas la limite, qui vaut $0$ en $0$ et en $\frac12$ : la stricte inégalité se perd à la limite.
      ```schema lex-convergence-simple-2
      Les graphes de $x \mapsto x^n$, pour $n = 1$, $2$, $4$, $8$, $16$ et $32$, s'aplatissent sur l'axe tout en passant par le point $(1, 1)$ ; la limite simple, en rouge, est nulle sur $[0, 1[$ et vaut $1$ en $1$. Pour $\varepsilon = \frac1{10}$, il faut $n \geqslant 4$ au point $\frac12$, mais $n \geqslant 22$ au point $\frac9{10}$.
      ```
    - |
      Une limite simple de fonctions bornées peut ne pas l'être. Les fonctions $f_n(x) = \min(|x|, n)$ vérifient $|f_n| \leqslant n$ sur $\mathbb R$, et $f_n(x) = |x|$ dès que $n \geqslant |x|$ : elles convergent simplement vers $x \mapsto |x|$, qu'aucun réel ne majore. Chaque $f_n$ est bornée, mais par une constante qui dépend de $n$, et la convergence simple ne contrôle pas ces constantes.

  limite-fonction-infini:
    - |
      La fonction $g(x) = \dfrac{x}{x + 1}$, définie sur $[0, +\infty[$, tend vers $1$ quand $x$ tend vers $+\infty$. On a en effet
      $$\Big|\frac{x}{x + 1} - 1\Big| = \frac{1}{x + 1},$$
      qui est inférieur à $\varepsilon$ dès que $x \geqslant \frac1\varepsilon$ : on peut prendre $B = \frac1\varepsilon$. Le calcul montre comment choisir le seuil $B$ à partir de $\varepsilon$, ce que demande la définition.
    - |
      La fonction $g(x) = x - \lfloor x \rfloor$, définie sur $[0, +\infty[$, où $\lfloor x \rfloor$ est la [[partie-entiere|partie entière]], n'a pas de limite en $+\infty$, bien qu'elle soit bornée. Elle vaut $0$ en chaque entier et $\frac12$ en chaque demi-entier, aussi loin qu'on aille : un réel $\ell$ ne peut être à distance moins de $\frac14$ à la fois de $0$ et de $\frac12$.
    - |
      Une fonction non majorée ne tend pas forcément vers $+\infty$. Soit $g$ la fonction définie sur $[0, +\infty[$ par $g(x) = x$ si $\lfloor x \rfloor$ est pair, et $g(x) = 0$ sinon. Elle n'est majorée par aucun réel, puisque $g(2n) = 2n$, mais elle s'annule sur chaque intervalle $[2n + 1, 2n + 2[$ : pour $A = 1$, aucun seuil $B$ ne garantit $g(x) > A$ pour tout $x \geqslant B$. L'erreur la plus répandue est de confondre « prendre des valeurs arbitrairement grandes » et « tendre vers $+\infty$ ».

  derivees-laterales:
    - |
      La fonction $f(x) = |x^2 - 1|$ a en $1$ une dérivée à droite et une dérivée à gauche, opposées. Pour $x > 1$, le taux d'accroissement vaut $\frac{x^2 - 1}{x - 1} = x + 1$, qui tend vers $2$ ; pour $-1 < x < 1$, il vaut $-(x + 1)$, qui tend vers $-2$. Ainsi $f'_d(1) = 2$ et $f'_g(1) = -2$ : le graphe a un angle en $(1, 0)$, et $f$ n'est pas dérivable en ce point.
    - |
      Une dérivée d'un côté n'empêche pas un saut de l'autre. La [[partie-entiere|partie entière]] est constante sur $[1, 2[$, donc sa dérivée à droite en $1$ existe et vaut $0$. Sa dérivée à gauche n'existe pas : pour $x < 1$ proche de $1$, le taux d'accroissement vaut $\frac1{1 - x}$ et n'est pas borné. La fonction n'est même pas continue en $1$, et seule la dérivée à droite y existe.
    - |
      Le maximum de deux fonctions dérivables a des angles là où leurs graphes se croisent. Soit $f(x) = \max(x, x^2)$. Sur $]0, 1[$, on a $x > x^2$, donc $f(x) = x$, et sur $]{-\infty}, 0[$ comme sur $]1, +\infty[$, $f(x) = x^2$. En $0$, le taux vaut $1$ à droite et $x$ à gauche : $f'_d(0) = 1$ et $f'_g(0) = 0$. En $1$, il vaut $1$ à gauche et $x + 1$ à droite : $f'_g(1) = 1$ et $f'_d(1) = 2$.
      ```schema lex-derivees-laterales-3
      Le graphe de $f = \max(x, x^2)$, en trait épais, suit la droite $y = x$ sur $[0, 1]$ et la parabole ailleurs ; les parties écartées des deux courbes sont en pointillé gris. En $0$ et en $1$, les demi-tangentes, en bleu à gauche et en rouge à droite, ont des pentes différentes : $0$ et $1$ en $0$, puis $1$ et $2$ en $1$.
      ```

  polynome-taylor:
    - |
      Pour un polynôme, le polynôme de Taylor d'ordre assez grand redonne la fonction, et les ordres inférieurs l'approchent. Pour $f(x) = x^3$ en $a = 1$, le polynôme d'ordre $1$ est $1 + 3(x - 1)$, équation de la tangente, et l'écart vaut
      $$x^3 - 1 - 3(x - 1) = (x - 1)^2(x + 2),$$
      d'ordre $2$ en $x - 1$. À l'ordre $3$, on obtient $1 + 3(x - 1) + 3(x - 1)^2 + (x - 1)^3$, qui est exactement $x^3$ développé en puissances de $x - 1$.
      ```schema lex-polynome-taylor-1
      Le graphe de $x \mapsto x^3$, en trait épais, et ses polynômes de Taylor en $1$ d'ordre $1$, en bleu, et d'ordre $2$, en vert. Près du point $(1, 1)$, en rouge, le second colle bien mieux à la courbe que la tangente ; tous deux s'en écartent loin de $1$.
      ```
    - |
      La majoration de Taylor-Lagrange est souvent très fine. Pour $f(x) = \frac1x$, dont les dérivées sont $\frac{(-1)^k k!}{x^{k+1}}$, en $a = 1$ et $b = 1{,}1$ avec $n = 2$, le polynôme de Taylor vaut $1 - 0{,}1 + 0{,}01 = 0{,}91$, et $f(1{,}1) = 0{,}90909\ldots$ Comme $|f'''| = \frac6{x^4} \leqslant 6$ sur $[1, 1{,}1]$, l'écart est au plus $\frac{6 \cdot 0{,}1^3}{3!} = 0{,}001$ ; il vaut en fait $\frac1{1100} \approx 0{,}00091$.
    - |
      La formule de Taylor-Lagrange demande $n + 1$ dérivées sur tout l'intervalle, et elle tombe sinon. La fonction $f(x) = x\,|x|$ est dérivable, de dérivée $2|x|$, mais n'a pas de dérivée seconde en $0$. Avec $n = 1$, $a = -1$ et $b = 1$, le polynôme de Taylor vaut $f(-1) + f'(-1) \cdot 2 = 3$. Si la formule valait, on aurait $f(1) = 3 + \frac{f''(c)}2 \cdot 4$ pour un $c \neq 0$ de $]{-1}, 1[$, où $f''(c) = \pm 2$, soit $7$ ou $-1$ ; or $f(1) = 1$.

  classe-cinfini-reelle:
    - |
      Les fonctions usuelles sont de classe $C^\infty$, et leurs dérivées gardent une forme reconnaissable. Pour $f(x) = \exp(-x^2)$, une récurrence montre que $f^{(k)}(x) = P_k(x)\exp(-x^2)$, où $P_0 = 1$ et $P_{k+1} = P_k' - 2xP_k$ : ainsi $P_1 = -2x$ et $P_2 = 4x^2 - 2$. Chaque dérivée est dérivable, donc continue, et $f$ est de classe $C^\infty$.
    - |
      Les fonctions $f_k(x) = x^k|x|$ montrent que chaque classe est strictement plus petite que la précédente. Pour $k \geqslant 1$, on a $f_k' = (k + 1)f_{k-1}$ : hors de $0$, $f_k$ vaut $\pm x^{k+1}$, et en $0$ son taux $x^{k-1}|x|$ tend vers $0$. Ainsi $f_k^{(k)} = (k + 1)!\,|x|$ est continue, mais pas dérivable en $0$ : $f_k$ est de classe $C^k$ sans être $k + 1$ fois dérivable.
    - |
      La fonction $b(x) = \theta(x)\,\theta(1 - x)$ est de classe $C^\infty$, comme produit de deux telles fonctions, la seconde par la dérivée d'une composée : une récurrence fondée sur $(uv)' = u'v + uv'$ montre que les dérivées d'un produit sont des sommes de produits de dérivées. Elle est nulle hors de $]0, 1[$ et vaut $\exp\big(-\frac1{x(1 - x)}\big)$ sur $]0, 1[$, de maximum $e^{-4} \approx 0{,}018$ en $\frac12$. Plus loin, de telles bosses deviendront les fonctions plateau ({{gd-partition|Partitions de l'unité}}).
      ```schema lex-classe-cinfini-reelle-3
      La bosse $b$, en rouge, dessinée avec une échelle verticale dilatée cinquante fois : nulle hors de $]0, 1[$, elle se raccorde à l'axe en $0$ et en $1$ sans angle ni saut, et culmine à $e^{-4}$ en $\frac12$.
      ```

  subdivision-adaptee:
    - |
      Une fonction en escalier a une infinité de subdivisions adaptées, mais pas n'importe lesquelles. Pour $\lfloor x \rfloor$ sur $[0, 3]$, les subdivisions $\{0, 1, 2, 3\}$ et $\{0, \frac12, 1, 2, \frac52, 3\}$ sont adaptées ; la subdivision $\{0, \frac32, 3\}$ ne l'est pas, puisque la fonction prend les valeurs $0$ et $1$ sur $]0, \frac32[$.
    - |
      Pour $\lfloor x \rfloor$ sur $[0, 3]$, les subdivisions adaptées sont exactement celles qui contiennent $1$ et $2$. Si $1$ manquait, il serait intérieur à un intervalle $]x_i, x_{i+1}[$, où la fonction prendrait les valeurs $0$ à gauche de $1$ et $1$ à droite ; réciproquement, toute subdivision plus fine que $\{0, 1, 2, 3\}$ est adaptée ({{ri-escalier|Fonctions en escalier}}, (i)). Il y a donc une plus petite subdivision adaptée, formée des extrémités et des points de saut.
    - |
      Changer la valeur en un seul point peut obliger à ajouter un point à la subdivision. L'indicatrice de $\{\frac12\}$ sur $[0, 1]$ est en escalier, nulle sur $]0, \frac12[$ et sur $]\frac12, 1[$, mais la subdivision $\{0, 1\}$ ne lui est pas adaptée, puisqu'elle n'est pas constante sur $]0, 1[$. Toute subdivision adaptée contient $\frac12$, bien que la valeur prise en ce point ne compte pour aucun palier.

  integrale-escalier:
    - |
      Pour la [[partie-entiere|partie entière]], l'intégrale additionne les paliers pondérés par leurs longueurs : sur $[0, 3]$, elle vaut $0 \cdot 1 + 1 \cdot 1 + 2 \cdot 1 = 3$, et sur $[0, \frac52]$, avec la subdivision $\{0, 1, 2, \frac52\}$, elle vaut $0 + 1 + 2 \cdot \frac12 = 2$. Le dernier palier, plus court, compte pour la moitié.
    - |
      Une fonction en escalier positive et non nulle peut avoir une intégrale nulle. L'indicatrice de $\{\frac12\}$ sur $[0, 1]$ vaut $1$ en $\frac12$, mais elle est nulle sur les deux intervalles ouverts de la subdivision adaptée $\{0, \frac12, 1\}$, d'où une intégrale $0 \cdot \frac12 + 0 \cdot \frac12 = 0$. La conclusion « intégrale nulle, donc fonction nulle » demande une autre hypothèse que la positivité.
    - |
      Les fonctions en escalier $\varphi_n(x) = \frac{\lfloor nx \rfloor}n$ approchent $x \mapsto x$ sur $[0, 1]$ à $\frac1n$ près, et
      $$\int_0^1 \varphi_n = \sum_{k=0}^{n-1} \frac kn \cdot \frac1n = \frac{n - 1}{2n},$$
      qui tend vers $\frac12$, l'aire du triangle sous la diagonale : des escaliers de plus en plus fins approchent cette aire par défaut.
      ```schema lex-integrale-escalier-3
      Pour $n = 5$, l'escalier $\varphi_5$, en bleu, reste sous la diagonale $y = x$ ; son intégrale, l'aire bleue, vaut $\frac25$, et il manque cinq petits triangles pour atteindre l'aire $\frac12$ du triangle.
      ```

  subdivision-plus-fine:
    - |
      La subdivision $\{0, \frac14, \frac12, \frac34, 1\}$ est plus fine que $\{0, \frac12, 1\}$, qu'elle contient, et son pas passe de $\frac12$ à $\frac14$. Elle coupe en deux chaque intervalle de la première, et chacun de ses intervalles est contenu dans un intervalle de l'autre, comme le veut le point (ii) de {{ri-subdivision|Subdivisions}}.
    - |
      Un pas plus petit ne fait pas une subdivision plus fine. La subdivision $\{0, \frac13, \frac23, 1\}$ a pour pas $\frac13 < \frac12$, mais elle n'est pas plus fine que $\{0, \frac12, 1\}$, puisqu'elle ne contient pas $\frac12$. Être plus fine est une affaire d'inclusion, que le pas ne détecte pas.
    - |
      Pour les subdivisions régulières de $[0, 1]$, la subdivision $\sigma_m$ à $m$ intervalles est plus fine que $\sigma_n$ si et seulement si $n$ divise $m$. En effet, $\frac1n$ appartient à $\sigma_m$ si et seulement si $\frac mn$ est entier, et si $m = qn$, chaque point $\frac kn$ s'écrit $\frac{qk}m$. Ainsi $\sigma_4$ est plus fine que $\sigma_2$, mais $\sigma_2$ et $\sigma_3$ ne sont comparables ni dans un sens ni dans l'autre.

  raffinement-commun:
    - |
      Le raffinement commun de $\sigma_2 = \{0, \frac12, 1\}$ et de $\sigma_3 = \{0, \frac13, \frac23, 1\}$ est $\{0, \frac13, \frac12, \frac23, 1\}$. Ses intervalles ont pour longueurs $\frac13$, $\frac16$, $\frac16$ et $\frac13$, et son pas vaut $\frac13$, celui de $\sigma_3$ : raffiner ne fait pas toujours diminuer le pas.
    - |
      Le raffinement commun de deux subdivisions régulières n'est pas régulier en général : celui de $\sigma_2$ et de $\sigma_3$ a des intervalles de longueurs différentes. La subdivision régulière $\sigma_6$ est plus fine que $\sigma_2$ et que $\sigma_3$, donc que leur réunion, qui est la moins fine des subdivisions plus fines que les deux ; elle l'est strictement, puisque $\frac16$ n'est pas dans la réunion.
      ```schema lex-raffinement-commun-2
      Les subdivisions $\sigma_2$, en bleu, et $\sigma_3$, en vert, leur raffinement commun, en rouge, aux intervalles de longueurs $\frac13$, $\frac16$, $\frac16$, $\frac13$, et la subdivision régulière $\sigma_6$, plus fine encore, dont les points $\frac16$ et $\frac56$, en gris, manquent au raffinement commun.
      ```
    - |
      Le raffinement commun sert à comparer deux fonctions définies par morceaux. L'indicatrice de $[0, \frac12[$ est constante sur les intervalles de $\sigma_2$, et celle de $[0, \frac13[$ sur ceux de $\sigma_3$ ; leur somme l'est sur ceux du raffinement commun, où elle vaut $2$, $1$, $0$ et $0$. Plus loin, c'est ainsi que deux fonctions en escalier recevront une subdivision adaptée commune ({{ri-escalier|Fonctions en escalier}}, (ii)).

  subdivision-reguliere:
    - |
      La subdivision régulière de $[1, 3]$ à $4$ intervalles est formée des points $1 + k\frac{3 - 1}4$, soit $1$, $\frac32$, $2$, $\frac52$, $3$, et son pas vaut $\frac12$. Tous ses intervalles ont la même longueur, de sorte que le pas est aussi la longueur moyenne.
    - |
      Pour obtenir un pas inférieur à $\delta$, il suffit de prendre $n > \frac{b - a}\delta$, ce qu'assure la propriété d'Archimède : c'est la preuve du point (iii) de {{ri-subdivision|Subdivisions}}. Sur $[0, 1]$, pour $\delta = 0{,}003$, il faut $n \geqslant 334$, puisque $\frac1{333} \approx 0{,}003003$ est encore trop grand.
    - |
      Les subdivisions régulières rendent les calculs explicites. Pour $f(x) = x^2$ sur $[0, 1]$ et $n = 4$, les valeurs aux points $0$, $\frac14$, $\frac12$, $\frac34$, $1$ sont $0$, $\frac1{16}$, $\frac14$, $\frac9{16}$, $1$, et les accroissements $f(x_{k+1}) - f(x_k)$, multipliés par la longueur commune $\frac14$, ont pour somme $\frac{f(1) - f(0)}4 = \frac14$, par télescopage. Plus loin, ce calcul, mené pour toute fonction croissante, montrera qu'elle est intégrable ({{ri-monotones|Fonctions monotones}}).

  segments-emboites:
    - |
      L'intersection de segments emboîtés n'est pas toujours réduite à un point. Les segments $\big[{-\frac1{n + 1}}, 1 + \frac1{n + 1}\big]$ sont emboîtés, et leur intersection est $[0, 1]$ : un réel $x$ appartient à tous si et seulement si $-\frac1{n + 1} \leqslant x \leqslant 1 + \frac1{n + 1}$ pour tout $n$, c'est-à-dire, par la propriété d'Archimède, si $0 \leqslant x \leqslant 1$. Les longueurs tendent ici vers $1$, et non vers $0$.
      ```schema lex-segments-emboites-1
      Les segments $\big[{-\frac1{n + 1}}, 1 + \frac1{n + 1}\big]$, pour $n = 0$ à $4$ de haut en bas, se resserrent sans se réduire : leur intersection est le segment $[0, 1]$, en rouge, dont les extrémités sont les limites des extrémités des segments.
      ```
    - |
      L'hypothèse d'emboîtement ne se remplace pas par la seule rencontre de deux segments consécutifs. Les segments $[n, n + 1]$ se rencontrent deux à deux consécutivement, en $n + 1$, mais leur intersection est vide, puisque déjà $[0, 1] \cap [2, 3] = \varnothing$. Ce qui manque est l'inclusion de chaque segment dans le précédent, qui interdit aux segments de s'échapper vers l'infini.
    - |
      La dichotomie construit une racine sans le théorème des valeurs intermédiaires. Pour $g(x) = x^3 - x - 1$, on a $g(1) = -1 < 0 < 5 = g(2)$ ; on coupe $[1, 2]$ en deux, et l'on garde la moitié $[a_{n+1}, b_{n+1}]$ telle que $g(a_{n+1}) \leqslant 0 < g(b_{n+1})$. Après cinq étapes, on obtient $[a_5, b_5] = [\frac{21}{16}, \frac{43}{32}]$. Le point commun $\ell$ est limite de $(a_n)$ et de $(b_n)$, donc $g(a_n) \to g(\ell)$ et $g(b_n) \to g(\ell)$ par les opérations sur les limites, puis $g(\ell) \leqslant 0 \leqslant g(\ell)$ par passage à la limite ({{su-inegalites|Limites et inégalités}}) : $\ell \approx 1{,}3247$ est racine de $g$.

  point-adherent-reel:
    - |
      Un point adhérent n'appartient pas forcément à la partie. Le réel $0$ est adhérent à $D = \,]0, 1]$ : pour $\delta > 0$, le point $\min(\frac\delta2, 1)$ est dans $D$ et à distance moins de $\delta$ de $0$. Les points adhérents à $D$ sont exactement ceux de $[0, 1]$ : un réel $a > 1$ ne l'est pas, avec $\delta = a - 1$, ni un réel $a < 0$, avec $\delta = -a$.
    - |
      Un point de $D$ est toujours adhérent à $D$, mais il peut être isolé. Pour $D = \,]0, 1] \cup \{3\}$, l'intervalle $]2, 4[$ ne rencontre $D$ qu'en $3$. Toute fonction $g : D \to \mathbb R$ a alors la limite $g(3)$ en $3$, avec $\delta = 1$, et cette limite ne dit rien de $g$ : une limite n'est instructive qu'en un point dont tout voisinage contient d'autres points de $D$.
      ```schema lex-point-adherent-reel-2
      La partie $D = \,]0, 1] \cup \{3\}$, en bleu ; ses points adhérents sont ceux de $[0, 1] \cup \{3\}$. Le point $0$, en rouge, est adhérent à $D$ sans lui appartenir, et le point $3$ est isolé : l'intervalle $]2, 4[$, en vert, ne rencontre $D$ qu'en ce point.
      ```
    - |
      Tout réel est adhérent à $\lex{ensemble-rationnels}{\mathbb Q}$, par densité ({{tr-dense|Densité}}), si bien qu'une fonction définie sur $\mathbb Q$ seulement peut avoir une limite en un irrationnel. Ainsi $g(x) = x^2$, sur $\mathbb Q$, tend vers $2$ en $\sqrt 2$ ({{tr-dense|Densité}}, (ii)) : pour $|x - \sqrt 2| < 1$, on a $|x + \sqrt 2| < 2\sqrt 2 + 1$, donc $|x^2 - 2| < (2\sqrt 2 + 1)\,|x - \sqrt 2|$, et $\delta = \min\big(1, \frac\varepsilon{2\sqrt 2 + 1}\big)$ convient. À l'inverse, un réel $a$ non entier n'est pas adhérent à $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, puisque l'intervalle $]\lfloor a \rfloor, \lfloor a \rfloor + 1[$, qui contient $a$, ne contient aucun entier : la limite d'une fonction définie sur $\mathbb Z$ n'a de sens qu'en un entier.
