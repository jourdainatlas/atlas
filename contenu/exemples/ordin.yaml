# Exemples du lexique : théorie « Ordinaux, cardinaux » (ordin).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  ensemble-transitif:
    - |
      Un ensemble $x$ est transitif si et seulement si $\bigcup x \subset x$, puisque les éléments de $\bigcup x$ sont les éléments des éléments de $x$. Ainsi $\{\varnothing, \{\{\varnothing\}\}\}$ n'est pas transitif : sa réunion est $\{\{\varnothing\}\}$, dont l'élément $\{\varnothing\}$ n'appartient pas à l'ensemble de départ. Ce critère montre aussi qu'une réunion d'ensembles transitifs est transitive, chaque élément de l'un d'eux étant contenu dans celui-ci, donc dans la réunion.
    - |
      Si $x$ est transitif, $\lex{ensemble-parties}{\mathcal P}(x)$ l'est aussi : un élément $y$ d'une partie $Y \subset x$ appartient à $x$, donc $y \subset x$, c'est-à-dire $y \in \mathcal P(x)$. Ainsi
      $$\mathcal P(\{\varnothing, \{\varnothing\}\}) = \{\varnothing, \{\varnothing\}, \{\{\varnothing\}\}, \{\varnothing, \{\varnothing\}\}\}$$
      est transitif, alors que son élément $\{\{\varnothing\}\}$ ne l'est pas : un élément d'un ensemble transitif n'est pas forcément transitif.
    - |
      Le singleton d'un ensemble transitif n'est pas transitif en général : $\{\varnothing\}$ l'est, mais pas $\{\{\varnothing\}\}$, dont l'élément $\{\varnothing\}$ contient $\varnothing$. C'est pourquoi le passage de $x$ à $x^+ = x \cup \{x\}$ garde $x$ à côté de $\{x\}$. Plus loin, les entiers naturels seront construits par ce passage à partir de $\varnothing$, et tous seront transitifs ({{n-transitif|Les entiers sont des ensembles transitifs}}).

  ordinal:
    - |
      Les ensembles $\varnothing$, $\{\varnothing\}$ et $\{\varnothing, \{\varnothing\}\}$ sont des ordinaux. Le dernier est transitif ({{o-transitif|Ensemble transitif}}), et la relation $\in$ s'y réduit à $\varnothing \in \{\varnothing\}$ : elle est irréflexive, transitive et totale. Chacune de ses trois parties non vides a un élément dont aucun élément de la partie n'est élément, $\varnothing$ quand il y figure, $\{\varnothing\}$ sinon.
    - |
      L'ensemble $x = \{\varnothing, \{\varnothing\}, \{\{\varnothing\}\}\}$ est transitif, mais ce n'est pas un ordinal. Il est transitif, puisque les éléments de ses éléments, $\varnothing$ et $\{\varnothing\}$, sont dans $x$. Mais $\in$ n'y est pas transitive : $\varnothing \in \{\varnothing\} \in \{\{\varnothing\}\}$, alors que $\varnothing \notin \{\{\varnothing\}\}$. De plus, $\varnothing$ et $\{\{\varnothing\}\}$ ne sont pas comparables pour $\in$, puisque $\varnothing \notin \{\{\varnothing\}\}$ et que $\varnothing$ n'a aucun élément : l'ordre n'est pas total.

      ```schema lex-ordinal-2
      Une flèche va de $z$ vers $y$ quand $z \in y$. Le chemin $\varnothing \in \{\varnothing\} \in \{\{\varnothing\}\}$ n'est pas doublé par une flèche directe de $\varnothing$ vers $\{\{\varnothing\}\}$, absente et marquée en rouge pointillé : la relation $\in$ n'est pas transitive sur cet ensemble, qui est pourtant transitif.
      ```
    - |
      À l'inverse, l'ensemble $\{\{\varnothing\}\}$, sur lequel $\in$ est trivialement un bon ordre strict puisqu'il n'a qu'un élément, n'est pas un ordinal, faute d'être transitif. Les deux conditions de la définition sont donc nécessaires. Plus loin, chaque entier naturel sera un ordinal, de même que l'ensemble $\omega$ de tous les entiers ({{n-ordre|L'appartenance est un bon ordre sur ω}}).

  cardinal:
    - |
      L'ordinal $\{\varnothing, \{\varnothing\}\}$ est un cardinal. Il n'est pas [[equipotent|équipotent]] à $\varnothing$, faute d'application d'un ensemble non vide dans $\varnothing$, ni à $\{\varnothing\}$, vers lequel toute application est constante, donc non injective sur deux éléments distincts. C'est le cardinal de toute paire $\{a, b\}$, avec $a \neq b$, puisque $a \mapsto \varnothing$, $b \mapsto \{\varnothing\}$ est une [[bijection]] et que les deux ordinaux plus petits ne conviennent pas.
    - |
      Un ordinal $\alpha$ vérifie toujours $|\alpha| \leqslant \alpha$, puisque $\alpha$ est équipotent à lui-même et que $|\alpha|$ est le plus petit ordinal équipotent à $\alpha$. L'égalité $|\alpha| = \alpha$ a lieu si et seulement si aucun ordinal plus petit n'est équipotent à $\alpha$, c'est-à-dire si et seulement si $\alpha$ est un cardinal : les cardinaux sont les ordinaux égaux à leur propre cardinal.
    - |
      Plus loin, avec $\omega$, l'ensemble des entiers naturels ({{n-omega|Le plus petit ensemble inductif}}), l'ordinal $\omega^+ = \omega \cup \{\omega\}$ ne sera pas un cardinal. L'application qui envoie $\omega$ sur $0$ et chaque entier $n$ sur $n + 1$ est en effet une bijection de $\omega^+$ sur $\omega$, ordinal plus petit. Les bons ordres de types $\omega$ et $\omega^+$ ont ainsi le même cardinal $\omega$.

  filtre:
    - |
      Pour toute partie non vide $S$ de $X$, la famille $\mathcal F_S$ des parties de $X$ qui contiennent $S$ est un filtre ; pour $S = \{a\}$, c'est le filtre principal en $a$. Pour $S = X$, on obtient $\{X\}$, le plus petit des filtres sur $X$, contenu dans tous les autres d'après la condition (a) de {{o-ultrafiltre|Filtres, ultrafiltres et lemme de l'ultrafiltre}}.
    - |
      La famille des parties de $X = \{a, b, c\}$ qui rencontrent $\{a, b\}$ contient $X$, ne contient pas $\varnothing$, et contient toute partie qui contient l'une des siennes. Elle contient pourtant $\{a\}$ et $\{b\}$ sans contenir leur intersection, $\varnothing$ : la seule condition (b) manque. Elle ne peut d'ailleurs être contenue dans aucun filtre, qui devrait contenir $\{a\} \cap \{b\} = \varnothing$.

      ```schema lex-filtre-2
      Les parties de {a, b, c}, un trait montant d'une partie vers une partie qui contient un point de plus. Les six parties qui rencontrent {a, b} sont en bleu, sauf {a} et {b}, en rouge, dont l'intersection, la partie vide, en gris, est hors de la famille.
      ```
    - |
      L'intersection de deux filtres sur $X$ est un filtre, chacune des trois conditions passant à l'intersection. La réunion, en revanche, n'en est pas un en général : pour $a \neq b$, la réunion des filtres principaux en $a$ et en $b$ contient $\{a\}$ et $\{b\}$, mais pas $\varnothing$. Plus loin, les voisinages d'un point d'un espace topologique formeront un filtre ({{t-voisinages|Ouverts et voisinages}}).

  ultrafiltre:
    - |
      Sur $X = \{a, b, c\}$, le [[filtre]] $\mathcal F_{\{a, b\}}$ des parties qui contiennent $\{a, b\}$ n'est pas un ultrafiltre. Il ne contient ni $\{a\}$ ni son complémentaire $\{b, c\}$, de sorte que le critère (i) de {{o-ultrafiltre|Filtres, ultrafiltres et lemme de l'ultrafiltre}} est en défaut. Il est contenu dans deux ultrafiltres, les filtres principaux en $a$ et en $b$, qui sont des ultrafiltres d'après le point (iii) du même nœud.
    - |
      L'image d'un ultrafiltre principal est principale. Soit $f : X \to Y$ une [[application]], $a \in X$ et $\mathcal U_a$ le filtre principal en $a$. Une partie $B \subset Y$ appartient à $f_*\mathcal U_a$ si et seulement si $a \in f^{-1}(B)$, c'est-à-dire $f(a) \in B$ : ainsi $f_*\mathcal U_a$ est le filtre principal en $f(a)$, ce qui illustre le point (iv) de {{o-ultrafiltre|Filtres, ultrafiltres et lemme de l'ultrafiltre}}.
    - |
      Si un ultrafiltre $\mathcal U$ contient une réunion $A_1 \cup A_2$, il contient $A_1$ ou $A_2$. Sinon, d'après le point (i), il contiendrait $X \setminus A_1$ et $X \setminus A_2$, donc leur intersection, disjointe de $A_1 \cup A_2$, et $\varnothing$ par la condition (b). Un ultrafiltre qui contient $\{a, b\}$ contient donc $\{a\}$ ou $\{b\}$, et il contient le filtre principal correspondant, qui est maximal : il lui est égal.

      Le même argument montre qu'un ultrafiltre $\mathcal U$ qui contient une partie [[ensemble-fini-tarski|finie]] $F$ est principal. Parmi les parties de $F$ qui appartiennent à $\mathcal U$, il en est une, $M$, minimale pour l'inclusion ({{zf-fini|Ensembles finis, sans les entiers}}, (i)) ; elle n'est pas vide. Pour $a \in M$, l'ultrafiltre contient $\{a\}$ ou $M \setminus \{a\}$, et la minimalité exclut la seconde : il contient $\{a\}$, donc le filtre principal en $a$, auquel il est égal. Sur un ensemble infini, il faudra le lemme de l'ultrafiltre ⋆ pour en obtenir d'autres, sans en désigner aucun.

  ordinal-successeur:
    - |
      L'ordinal $\{\varnothing, \{\varnothing\}\}$ est le successeur de $\{\varnothing\}$, qui en est le [[plus-grand-element|plus grand élément]]. Plus généralement, $\alpha$ est le plus grand élément de $\alpha^+$ ({{o-elements|Premières propriétés des ordinaux}}, (iii)), et on le retrouve à partir de $\alpha^+$ par $\alpha = \bigcup \alpha^+$, puisque $\bigcup \alpha \subset \alpha$ par transitivité.
    - |
      Le successeur $x^+$ d'un ensemble quelconque n'est pas toujours un ordinal. Pour $x = \{\{\varnothing\}\}$, l'ensemble $x^+ = \{\{\varnothing\}, \{\{\varnothing\}\}\}$ n'est pas transitif, son élément $\{\varnothing\}$ contenant $\varnothing$, qui n'y est pas. En fait $x^+$ est un ordinal si et seulement si $x$ en est un : si $x^+$ en est un, son élément $x$ aussi ({{o-elements|Premières propriétés des ordinaux}}, (i)), et la réciproque est le point (iii) du même nœud.
    - |
      Le passage au successeur est injectif sur les ordinaux : si $\alpha^+ = \beta^+$, alors $\alpha = \bigcup \alpha^+ = \bigcup \beta^+ = \beta$. Il ne prend jamais la valeur $\varnothing$, puisque $\alpha \in \alpha^+$. Plus loin, ces deux faits deviendront deux des axiomes de Peano, démontrés comme théorèmes pour les entiers ({{n-peano|Les axiomes de Peano sont des théorèmes}}).

  ordinal-limite:
    - |
      Ni $\varnothing$, ni $\{\varnothing\} = \varnothing^+$, ni $\{\varnothing, \{\varnothing\}\} = \{\varnothing\}^+$ ne sont des ordinaux limites : le premier est vide, les deux autres sont des successeurs. Le critère (iii) de {{o-successeur-limite|Ordinaux successeurs et ordinaux limites}} le confirme pour le dernier, dont la réunion est $\{\varnothing\}$, qui en diffère.
    - |
      Un ordinal non vide est limite si et seulement s'il n'a pas de [[plus-grand-element|plus grand élément]]. Un successeur $\alpha^+$ a $\alpha$ pour plus grand élément. Si $\lambda$ est limite et $\beta < \lambda$, alors $\beta^+ \leqslant \lambda$ par le point (i) de {{o-successeur-limite|Ordinaux successeurs et ordinaux limites}}, et $\beta^+ \neq \lambda$, de sorte que $\beta^+$ est un élément de $\lambda$ plus grand que $\beta$.
    - |
      Les axiomes employés jusqu'ici ne fournissent aucun ordinal limite. Plus loin, l'axiome de l'infini donnera le premier d'entre eux, $\omega$, l'ensemble des entiers naturels ({{n-omega|Le plus petit ensemble inductif}}) ; il est limite parce que tout entier a son successeur dans $\omega$.

  recursion-transfinie:
    - |
      Prenons pour $G(f)$ l'ensemble des seconds termes des couples qui appartiennent à $f$, c'est-à-dire l'image de $f$ quand $f$ est une application. La récursion $F(\alpha) = G(F|_\alpha)$ s'écrit alors $F(\alpha) = \{F(\beta) : \beta < \alpha\}$, et elle définit l'identité : si $F(\beta) = \beta$ pour tout $\beta < \alpha$, alors $F(\alpha) = \{\beta : \beta < \alpha\} = \alpha$, par induction transfinie ({{o-induction|Principe d'induction transfinie}}).
    - |
      Avec $G(f) = \bigcup \{\lex{ensemble-parties}{\mathcal P}(y) : y \text{ second terme d'un couple de } f\}$, la récursion définit
      $$F(\alpha) = \bigcup_{\beta < \alpha} \mathcal P(F(\beta)).$$
      Les premières valeurs sont $F(\varnothing) = \varnothing$, $F(\varnothing^+) = \mathcal P(\varnothing) = \{\varnothing\}$ et $F(\varnothing^{++}) = \{\varnothing, \{\varnothing\}\}$ ; puis $F(\varnothing^{+++})$ est formé des quatre parties de $\{\varnothing, \{\varnothing\}\}$. Chaque étape rassemble toutes les parties des ensembles déjà construits.
    - |
      La valeur en $\alpha$ ne doit dépendre que des valeurs en $\beta < \alpha$. Une équation qui regarde vers le haut, comme $F(\alpha) = F(\alpha^+)$ pour tout ordinal $\alpha$, n'est pas de cette forme, et elle ne définit rien : toute fonction constante la vérifie. C'est l'appui sur les seules valeurs antérieures qui rend possible la preuve d'unicité par le plus petit ordinal où deux solutions diffèrent.

  ordinal-hartogs:
    - |
      On calcule $h(A)$ pour de petits ensembles. Le seul ordinal qui s'[[injection|injecte]] dans $\varnothing$ est $\varnothing$, par l'application vide : $h(\varnothing) = \{\varnothing\}$. Dans $\{a\}$, $\varnothing$ et $\{\varnothing\}$ s'injectent, mais pas un ordinal $\beta \geqslant \{\varnothing, \{\varnothing\}\}$, qui contient les deux éléments distincts $\varnothing$ et $\{\varnothing\}$ ({{o-comparaison|Les ordinaux sont bien ordonnés}}, (i)) : $h(\{a\}) = \{\varnothing, \{\varnothing\}\}$.
    - |
      L'ordinal de Hartogs ne dépend que de la taille de l'ensemble, et il croît avec elle. Si $A$ s'injecte dans $B$, tout ordinal qui s'injecte dans $A$ s'injecte dans $B$, par composition des [[injection|injections]], donc $h(A) \subset h(B)$, et deux ensembles [[equipotent|équipotents]] ont le même ordinal de Hartogs. Ainsi $h(\{a\}) \subset h(\{a, b\})$, qui contient en plus $\{\varnothing, \{\varnothing\}\}$ lorsque $a \neq b$.
    - |
      Plus loin, pour l'ensemble $\mathbb N$ des entiers ({{n-omega|Le plus petit ensemble inductif}}), $h(\mathbb N)$ sera l'ensemble des ordinaux au plus dénombrables, c'est-à-dire le plus petit ordinal qui ne l'est pas, d'ordinaire noté $\omega_1$. Il est obtenu sans l'axiome du choix, par le seul théorème de Hartogs.

  lemme-zorn:
    - |
      ⋆ Tout ordre $\leqslant$ sur un ensemble $E$ est contenu dans un [[ordre-total|ordre total]]. Les ordres sur $E$ qui contiennent $\leqslant$, ordonnés par inclusion, forment un ensemble [[inductif-ordre|inductif]], par le même argument que pour tous les ordres sur $E$ : $\leqslant$ majore la [[chaine|chaîne]] vide, et la réunion d'une chaîne non vide est un ordre. Le lemme de Zorn fournit un ordre $R$ maximal parmi eux.

      Si $x$ et $y$ n'étaient pas comparables pour $R$, on ajouterait à $R$ les couples $(u, v)$ tels que $u \mathrel R x$ et $y \mathrel R v$, dont $(x, y)$. Deux couples ajoutés consécutifs, $(u, v)$ puis $(v, w)$, donneraient $y \mathrel R v \mathrel R x$, ce qui est exclu ; un couple ajouté suivi d'un couple de $R$, ou l'inverse, donne un couple ajouté. Enfin un couple ajouté $(u, v)$ et un couple $(v, u)$ de $R$ donneraient $y \mathrel R v \mathrel R u \mathrel R x$.

      La relation obtenue est donc transitive et antisymétrique : c'est un ordre qui contient strictement $R$, puisqu'il contient $(x, y)$, ce qui est absurde. Ainsi $R$ est total.
    - |
      L'hypothèse inductive ne peut pas être omise. Aucun ordinal limite n'existe encore à ce stade, et le premier, $\omega$, ne viendra qu'avec l'axiome de l'infini ; mais si $\lambda$ est un [[ordinal-limite|ordinal limite]], l'ensemble $\lambda$, ordonné par $\in$, n'a pas d'[[element-maximal|élément maximal]] : tout $\beta < \lambda$ vérifie $\beta < \beta^+ \leqslant \lambda$, et $\beta^+ \neq \lambda$ puisque $\lambda$ n'est pas un successeur. Il n'est pas inductif : la chaîne $\lambda$ tout entière n'a aucun [[majorant]] dans $\lambda$, ce majorant devant en être le plus grand élément. Affaiblir l'hypothèse en « toute chaîne non vide est majorée » ne suffit pas non plus, comme le montre l'ensemble vide.
    - |
      Le lemme fournit un élément maximal, non un plus grand. Pour l'égalité sur $\{a, b\}$, avec $a \neq b$, le premier exemple a deux réponses, les ordres où $a < b$ et où $b < a$, maximaux et incomparables. Plus loin, ⋆ le lemme de Zorn fournira de même des bases d'espaces vectoriels ({{v-bases-existence|Tout espace vectoriel a une base}}) et des idéaux maximaux ({{a-premier-maximal|Idéaux premiers, maximaux}}), sans unicité ni moyen de les désigner.

  application-domaine:
    - |
      L'ensemble vide est l'unique application de domaine $\varnothing$, puisque ses couples devraient avoir leur premier terme dans $\varnothing$. Pour tout ensemble $a$, $\{(\varnothing, a)\}$ est une application de domaine $\{\varnothing\}$ : c'est le [[graphe-application|graphe]] d'une application de $\{\varnothing\}$ dans tout ensemble qui contient $a$, comme $\{a\}$ ou $\{a, b\}$. Une application de domaine ne fixe pas d'ensemble d'arrivée.
    - |
      Si $a \neq b$, l'ensemble $\{(\varnothing, a), (\varnothing, b)\}$ n'est pas une application de domaine $\{\varnothing\}$, faute d'unicité de la valeur en $\varnothing$, et $\{(\varnothing, a)\}$ n'est pas une application de domaine $\{\varnothing, \{\varnothing\}\}$, faute de valeur en $\{\varnothing\}$. C'est l'unicité qui ferait défaut dans la réunion de deux applications qui diffèrent en un point ; la preuve de {{o-recursion|Définition par récursion transfinie}} l'évite en n'unissant que des applications qui coïncident.
    - |
      Soit $f = \{(\varnothing, a), (\{\varnothing\}, b)\}$, application de domaine $\{\varnothing, \{\varnothing\}\}$. Sa restriction à $\{\varnothing\}$ est $\{(\varnothing, a)\}$, et $f$ est la réunion de cette restriction et de $\{(\{\varnothing\}, b)\}$. C'est exactement le pas $F_{\beta^+} = F_\beta \cup \{(\beta, G(F_\beta))\}$ de la récursion transfinie, pour $\beta = \{\varnothing\}$ et $G(F_\beta) = b$.

  type-ordre:
    - |
      L'ensemble $\{a, b\}$, ordonné par $a < b$, a pour type d'ordre $\{\varnothing, \{\varnothing\}\}$, par l'[[isomorphisme-ordres|isomorphisme]] $a \mapsto \varnothing$, $b \mapsto \{\varnothing\}$. L'ordre $b < a$ a le même type, par $b \mapsto \varnothing$, $a \mapsto \{\varnothing\}$. Deux bons ordres différents sur un même ensemble peuvent donc avoir le même type, chacun avec son propre isomorphisme.
    - |
      Une partie d'un [[ordinal]] n'est pas forcément un ordinal, mais elle a un type d'ordre. La partie $X = \{\{\varnothing\}\}$ de l'ordinal $\{\varnothing, \{\varnothing\}\}$ n'est pas transitive, et son type est $\{\varnothing\}$, par $\{\varnothing\} \mapsto \varnothing$. Le type mesure la longueur de l'ordre, en oubliant ce que sont les éléments. Sans bon ordre, il n'y a pas de type : $\{a, b\}$, avec $a \neq b$, muni de l'égalité, n'est isomorphe à aucun ordinal, puisque $\in$ est total sur un ordinal ({{o-ordinal|Ordinal}}) et qu'un isomorphisme transporterait cette totalité.
    - |
      Le plus petit élément d'un ordinal non vide $\alpha$ est $\varnothing$ : c'est un élément $m$ dont aucun élément de $\alpha$ n'est élément, alors que $m \subset \alpha$ par transitivité, de sorte que $m = \varnothing$. Un ensemble ordonné isomorphe à un ordinal non vide a donc un plus petit élément. Plus loin, $\mathbb Z$, totalement ordonné sans plus petit élément, ne sera ainsi isomorphe à aucun ordinal ({{z-ordre|L'ordre de ℤ}}) : seuls les bons ordres ont un type.
