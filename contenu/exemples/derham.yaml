# Exemples du lexique : théorie « Cohomologie de de Rham » (derham).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  homotopie-lisse:
    - |
      Une homotopie lisse peut déplacer tous les points sans rien changer en cohomologie. Sur $U = \mathbb R^2 \setminus \{0\}$, notons $R_\alpha$ la rotation d'angle $\alpha$. L'application
      $$F(x, t) = R_{t\alpha}\,x,$$
      définie et de classe $C^\infty$ sur l'ouvert $W = U \times \mathbb R$ de $\mathbb R^3$, à valeurs dans $U$ puisqu'une rotation conserve la norme euclidienne, est une homotopie lisse de l'identité à $R_\alpha$. Par le point (ii), $R_\alpha^*$ est l'identité de $\lex{cohomologie-de-rham}{H^k}(U)$ pour tout $k$, ce que l'on vérifie sur la forme $\omega_0 = \frac{x\,dy - y\,dx}{x^2 + y^2}$ : un calcul direct donne $R_\alpha^*\omega_0 = \omega_0$.
    - |
      L'homotopie doit rester dans l'ouvert d'arrivée, et ce n'est pas une formalité. Dans $\mathbb R^2$, l'identité et l'application constante égale à $a = (1, 0)$ sont lissement homotopes, par $F(x, t) = (1 - t)\,x + t\,a$ ; mais pour $x = (-1, 0)$ et $t = \frac12$, $F(x, t) = 0$, et $F$ n'est pas une homotopie dans $U = \mathbb R^2 \setminus \{0\}$.

      Aucune autre ne l'est. L'image réciproque d'une forme de degré $1$ par une application constante est nulle, ses composantes ayant une différentielle nulle ; si les deux applications étaient lissement homotopes dans $U$, la forme $\omega_0 = \frac{x\,dy - y\,dx}{x^2 + y^2}$ aurait la classe de $0$ (point (ii)), c'est-à-dire serait [[forme-exacte|exacte]], ce qu'exclut son intégrale $2\pi$ sur le bord du carré $[-1, 1]^2$ ({{gd-integrale-curviligne|Intégrale d'une 1-forme}}, remarque).
      ```schema lex-homotopie-lisse-2
      Les trajectoires $t \mapsto (1 - t)\,x + t\,a$ de l'homotopie affine, pour huit points $x$ du cercle unité, dont $a$ lui-même, vont vers le point $a$. Celle qui part de $(-1, 0)$, en rouge, passe par l'origine, retirée du plan : l'homotopie sort de $\mathbb R^2 \setminus \{0\}$.
      ```
    - |
      La symétrie $\varsigma(x) = -x$ de $\mathbb R^2 \setminus \{0\}$ est la rotation $R_\pi$ : par le premier exemple, elle est lissement homotope à l'identité, et $\varsigma^*$ est l'identité en cohomologie, bien que $\varsigma$ n'ait aucun point fixe. Plus loin, au nœud {{dc-chevelue|Champs tangents aux sphères}}, on verra que, sur $\mathbb R^n \setminus \{0\}$, $\varsigma^*$ multiplie la classe de la forme angle solide par $(-1)^n$ : pour $n$ impair, la symétrie n'est donc pas lissement homotope à l'identité, et c'est ce qui interdit les champs de vecteurs tangents partout non nuls sur les sphères de dimension paire.

  forme-angle-solide:
    - |
      La forme angle solide ne voit que les directions, et non les distances. Pour $\lambda > 0$, l'homothétie $h_\lambda(x) = \lambda x$ vérifie $h_\lambda^*\sigma_n = \sigma_n$ : chaque coefficient devient $F_i(\lambda x) = \lambda^{1-n}F_i(x)$, et le produit de $n - 1$ différentielles $dx_l$ est multiplié par $\lambda^{n-1}$. Le cube $h_\lambda \circ c$, pour chaque face $c$ du bord $z_n$ de $[-1, 1]^n$, est la face correspondante de $[-\lambda, \lambda]^n$ ; par le nœud {{dr-integrale-cubes|Intégrale sur une chaîne}}, (iv), l'intégrale de $\sigma_n$ sur le bord de $[-\lambda, \lambda]^n$ est donc celle du point (ii), quelle que soit la taille du cube.
    - |
      La non-exactitude tient à l'ouvert tout entier : sur un ouvert plus petit, la même forme devient exacte. Soit $L_- = \{(0, \dots, 0, s) : s \leqslant 0\}$ et $U = \mathbb R^n \setminus L_-$, ouvert de $X_n$, étoilé par rapport à $e_n$ ({{dc-epointe|ℝⁿ privé de l'origine}}, (iii)) ; par le lemme de Poincaré, après translation, la restriction de $\sigma_n$ à $U$, fermée de degré $n - 1 \geqslant 1$, y est [[forme-exacte|exacte]]. Le point (ii) n'y contredit rien : le bord du cube n'est pas une chaîne de $U$, puisque sa face $x_n = -1$ contient le point $(0, \dots, 0, -1)$ de $L_-$. Retirer à $X_n$ un demi-axe suffit à annuler sa cohomologie de degré $n - 1$.
    - |
      Le bord d'un cube qui n'entoure pas l'origine ne voit rien. Le cube $C = [2, 4] \times [-1, 1]^{n-1}$ est contenu dans $X_n$, et son cube affine $c$, comme celui du nœud {{dr-iterees|Intégrales itérées}}, (iii), est un cube singulier lisse de $X_n$ ; par la formule de Stokes ({{dr-stokes|Formule de Stokes}}), $\int_{\partial c} \sigma_n = \int_c d\sigma_n = 0$, alors que le bord du cube $[-1, 1]^n$, qui entoure l'origine, donne la valeur strictement positive du point (ii). Plus loin, au nœud {{dc-chevelue|Champs tangents aux sphères}}, c'est la symétrie $x \mapsto -x$, qui change $\sigma_n$ en $(-1)^n\sigma_n$, qui permettra d'interdire les champs tangents partout non nuls sur les sphères de dimension paire.
      ```schema lex-forme-angle-solide-3
      Pour $n = 2$, le bord du carré $[-1, 1]^2$, en rouge, entoure l'origine, et l'intégrale de $\sigma_2$ y vaut $2\pi$ ; le bord du carré $[2, 4] \times [-1, 1]$, en bleu, ne l'entoure pas, et l'intégrale y est nulle.
      ```

  simplexe-lisse:
    - |
      Les [[simplexe-affine|simplexes affines]] sont lisses, mais un simplexe continu peut ne pas l'être. Le simplexe affine $[p_0, \dots, p_k]$ est la restriction à $\Delta_k$ de l'application linéaire $t \mapsto \sum_j t_jp_j$, définie sur $\mathbb R^{k+1}$ : il est lisse, comme l'affirme le point (i). Le [[simplexe-singulier|simplexe singulier]] $\sigma(t_0, t_1) = |t_1 - \frac12|$ de $\mathbb R$, continu, n'est pas lisse : si $\tilde\sigma$ le prolongeait, de classe $C^\infty$ sur un ouvert contenant $\Delta_1$, la composée $s \mapsto \tilde\sigma(1 - s, s)$ serait dérivable sur $]0, 1[$, alors qu'elle vaut $|s - \frac12|$, qui ne l'est pas en $\frac12$.
    - |
      L'application $q_k$ écrase des faces du cube, sans fausser l'intégrale. Pour le triangle $\sigma = [p_0, p_1, p_2]$, avec $p_0 = (0, 0)$, $p_1 = (1, 0)$ et $p_2 = (0, 1)$, on trouve $\sigma \circ q_2(s, t) = \big(s(1 - t), st\big)$, dont le côté $s = 0$ tout entier est envoyé sur le sommet $p_0$. Le déterminant de sa [[matrice-jacobienne|matrice jacobienne]] vaut $(1 - t) \cdot s - (-s) \cdot t = s$, et
      $$\int_\sigma dx \wedge dy = \int_{I^2} s = \frac12,$$
      qui est bien l'aire du triangle, moitié de celle du carré unité : les points écrasés ne retirent rien.
    - |
      La formule de Stokes du point (iii) se vérifie sur ce triangle. Pour $\omega = x\,dy$, de différentielle $dx \wedge dy$, le bord $\partial\sigma = [p_1, p_2] - [p_0, p_2] + [p_0, p_1]$ donne trois intégrales : sur $[p_1, p_2]$, paramétré par $s \mapsto (1 - s, s)$, on trouve $\int_0^1 (1 - s)\,ds = \frac12$ ; sur $[p_0, p_2]$, $x = 0$ ; sur $[p_0, p_1]$, $dy$ a une image réciproque nulle. Ainsi $\int_{\partial\sigma} x\,dy = \frac12 = \int_\sigma dx \wedge dy$. Plus loin, au nœud {{dt-lisse-continu|Lisse et continu}}, (iii), on verra que tout cycle singulier est homologue à un cycle formé de simplexes lisses : se limiter aux simplexes lisses, sur lesquels on intègre, ne fait rien perdre en homologie.

  complexe-double:
    - |
      Un complexe double à quatre espaces non nuls, disposés en carré, montre déjà le lemme à l'œuvre. Posons $K^{0,0} = K^{1,0} = K^{0,1} = K^{1,1} = \mathbb R$, les autres espaces nuls, avec $\delta = \mathrm{id}$ de $K^{0,q}$ dans $K^{1,q}$ et $d = \mathrm{id}$ de $K^{p,0}$ dans $K^{p,1}$. Les composées $\delta\delta$ et $dd$ aboutissent à des espaces nuls, et $\delta d = d\delta = \mathrm{id}$ de $K^{0,0}$ dans $K^{1,1}$. Avec $A = 0$, chaque rangée $0 \to 0 \to \mathbb R \xrightarrow{\mathrm{id}} \mathbb R \to 0$ est [[suite-exacte|exacte]] : par le point (ii), le [[complexe-total|complexe total]] a une cohomologie nulle. On le vérifie : $\operatorname{Tot}$ s'écrit
      $$\mathbb R \xrightarrow{x \mapsto (x, x)} \mathbb R^2 \xrightarrow{(a, b) \mapsto b - a} \mathbb R,$$
      suite exacte dont la première flèche est injective et la seconde surjective.
    - |
      Sans l'exactitude des rangées, la conclusion tombe. Le complexe double réduit à $K^{0,0} = \mathbb R$, tous les autres espaces étant nuls, a pour complexe total $\mathbb R$ en degré $0$, de cohomologie $H^0 = \mathbb R$. Avec l'augmentation $A = 0$, la rangée $0 \to 0 \to \mathbb R \to 0$ n'est pas exacte en $K^{0,0}$, le noyau de $\delta$ y étant $\mathbb R$ et l'image de $r$ nulle : la cohomologie de $A$, nulle, n'est pas celle du complexe total.
    - |
      La suite exacte courte de Mayer-Vietoris est un complexe double à deux colonnes. Pour deux ouverts $U$ et $V$ de $\mathbb R^n$ et $X = U \cup V$, posons $K^{0,q} = \Omega^q(U) \oplus \Omega^q(V)$, $K^{1,q} = \Omega^q(U \cap V)$, les autres colonnes nulles, avec $\delta(\alpha, \beta) = \alpha|_{U \cap V} - \beta|_{U \cap V}$, la différentielle $d$ des formes, et l'augmentation $A = \Omega(X)$ par la restriction. La restriction commute à $d$, et les rangées sont exactes par le nœud {{dc-mayer-vietoris|Mayer-Vietoris}}, (i) : le point (ii) donne $H^k(X) \cong H^k(\operatorname{Tot} K)$. Plus loin, au nœud {{dt-cech-de-rham|Čech-de Rham}}, le même complexe est construit avec une infinité de cubes au lieu de deux ouverts, et ses colonnes sont exactes elles aussi, ce qui ramène la cohomologie de de Rham à celle d'un complexe de nombres.

  cohomologie-support-compact:
    - |
      En degré $0$, la cohomologie à support compact d'un ouvert non vide de $\mathbb R^n$, $n \geqslant 1$, est nulle, à l'opposé de $H^0$. Une fonction $f$ fermée, de différentielle nulle, est localement constante ; l'ouvert $A = \{f \neq 0\}$ est alors aussi fermé dans $U$, et il est son propre [[support-forme|support]]. S'il est compact, il est fermé dans $\mathbb R^n$, séparé, et ouvert dans $\mathbb R^n$ ; comme $\mathbb R^n$ est [[connexe]], $A$ est vide ou égal à $\mathbb R^n$, qui n'est pas borné, donc pas compact. Ainsi $A = \varnothing$, $f = 0$, et $H^0_c(U) = \{0\}$, alors que $H^0(U)$ contient les constantes non nulles.
    - |
      Une forme exacte peut avoir une classe non nulle dans la cohomologie à support compact. Sur $\mathbb R$, soit $e$ une [[fonction-plateau|fonction plateau]] d'intégrale $1$, par exemple $\psi_{0,1}$ du nœud {{dr-plateau|Fonctions plateau}} divisée par son intégrale. La forme $e\,dx$ est exacte, différentielle de $E(x) = \int_{-1}^x e$ ; mais si l'on avait $e\,dx = dg$ avec $g$ à support compact, le point (iii) donnerait $\int_{\mathbb R} e\,dx = 0$, alors que cette intégrale vaut $1$. Donc $H^1_c(\mathbb R) \neq \{0\}$, alors que $H^1(\mathbb R) = \{0\}$ : la primitive $E$, qui vaut $\int_{\mathbb R} e = 1$ à droite du support, n'est pas à support compact.
    - |
      La cohomologie à support compact ne voit pas qu'un intervalle est borné, parce qu'elle est invariante par difféomorphisme (point (iv)). L'application $x \mapsto \tan\big(\pi(x - \frac12)\big)$ est un difféomorphisme de $]0, 1[$ sur $\mathbb R$, de dérivée $\pi\big(1 + \tan^2\pi(x - \frac12)\big) > 0$ et de réciproque $y \mapsto \frac12 + \frac1\pi\arctan y$ ; elle induit donc un isomorphisme de $H^1_c(\mathbb R)$ sur $H^1_c(]0, 1[)$, qui n'est pas nul par l'exemple précédent. Plus loin, au nœud {{pc-fibre|Poincaré à support compact}}, (iv), on verra que l'intégrale identifie $H^n_c(P)$ à $\mathbb R$ pour tout pavé ouvert $P$ de $\mathbb R^n$, borné ou non, et que les autres $H^k_c(P)$ sont nuls.

  dualite-poincare:
    - |
      Sur un ouvert à deux morceaux, la dualité met face à face les constantes par morceaux et les intégrales par morceaux. Pour $U = \mathbb R \setminus \{0\}$, $n = 1$ et $k = 0$, $H^0(U) \cong \mathbb R^2$ est formé des fonctions égales à $a$ sur $]{-\infty}, 0[$ et à $b$ sur $]0, +\infty[$. Soit $e_-$ et $e_+$ deux [[fonction-plateau|fonctions plateau]] d'intégrale $1$, à supports compacts dans $]{-\infty}, 0[$ et dans $]0, +\infty[$. L'accouplement de $(a, b)$ avec les classes de $e_-\,dx$ et $e_+\,dx$ vaut $a$ et $b$ : la matrice de l'accouplement est l'identité, et $\mathrm{PD}_U$ est injective. Comme $U$ est la réunion de deux pavés ouverts, le nœud {{pc-finie|Dualité, cas fini}}, (i), donne de plus $\dim H^1_c(U) = 2$, et ces deux classes en forment une base.
    - |
      La dualité échange les deux cohomologies, et la remplacer par une dualité de $H^*$ avec lui-même est faux. Sur $U = \mathbb R$, $H^0(\mathbb R) \cong \mathbb R$ et $H^1(\mathbb R) = \{0\}$, de dual nul : il n'existe aucun isomorphisme de $H^0(\mathbb R)$ sur $\big(H^1(\mathbb R)\big)^*$. C'est $H^1_c(\mathbb R)$, isomorphe à $\mathbb R$ par l'intégrale ({{pc-fibre|Poincaré à support compact}}, (iv)), qui fait face à $H^0(\mathbb R)$ ; l'accouplement de deux formes quelconques n'aurait d'ailleurs pas de sens, $\int_{\mathbb R} 1 \cdot dx$ n'étant pas défini.
    - |
      Les dimensions se lisent à l'envers. Pour $U = \mathbb R^3 \setminus \{0\}$, les espaces $H^0(U), H^1(U), H^2(U), H^3(U)$ sont de dimensions $1, 0, 1, 0$ ({{dc-epointe|ℝⁿ privé de l'origine}}, (ii)), et la dualité donne pour $H^3_c(U), H^2_c(U), H^1_c(U), H^0_c(U)$ les mêmes dimensions, dans cet ordre, comme l'établit aussi le nœud {{pc-finie|Dualité, cas fini}}, (ii). Un générateur de $H^2(U)$ est la classe de la forme angle solide $\sigma_3$, un générateur de $H^1_c(U)$ celle de $df$, avec $f = \rho(|x|)$ comme dans la remarque du nœud {{pc-finie|Dualité, cas fini}} ; la première remarque du présent nœud montre que leur accouplement $\int_U \sigma_3 \wedge df$ n'est pas nul.

  nerf-recouvrement:
    - |
      Le nerf ne retient de la famille que les intersections non vides. Pour deux cubes disjoints $B_1$ et $B_2$, les seules suites admises sont les suites constantes : $N_p = \{(1, \dots, 1), (2, \dots, 2)\}$, deux éléments en chaque degré. S'ils se rencontrent, toutes les suites de $p + 1$ termes de $\{1, 2\}$ sont admises, $2^{p+1}$ en degré $p$. Dans les deux cas, $N_p$ n'est jamais vide, les répétitions étant permises : c'est un nerf ordonné, et non l'ensemble des parties qui se rencontrent.
    - |
      Pour des cubes, trois qui se rencontrent deux à deux ont un point commun, ce qui est faux pour des convexes quelconques. Dans chaque coordonnée, trois intervalles ouverts $]a_l, b_l[$ qui se rencontrent deux à deux vérifient $a_l < b_m$ pour tous $l, m$, donc $\max_l a_l < \min_m b_m$, et un point de $]\max_l a_l, \min_m b_m[$ leur est commun ; le produit de ces points est dans les trois cubes. En revanche, pour un triangle équilatéral $T$ de côté $2$, soit $B_i$ la bande fermée des points qui se projettent orthogonalement sur le $i$-ième côté et en sont à une distance au plus $\frac15$ : c'est un convexe, intersection de quatre demi-plans, et deux bandes se rencontrent au sommet commun de leurs côtés. Notons $\ell_i(x)$ la distance signée de $x$ à la droite du $i$-ième côté, positive du côté de $T$ ; ces fonctions sont affines, et les normales unitaires intérieures ont une somme nulle, de sorte que
      $$\ell_1 + \ell_2 + \ell_3 = \sqrt3,$$
      valeur au centre, à la distance $\frac1{\sqrt3}$ de chaque côté. L'un des $|\ell_i(x)|$ vaut donc au moins $\frac{\sqrt3}3 > \frac15$ : le nerf des trois bandes n'a pas la suite $(1, 2, 3)$, celui de trois cubes qui se rencontrent deux à deux l'a toujours.
      ```schema lex-nerf-recouvrement-2
      À gauche, trois cubes pour la norme du maximum qui se rencontrent deux à deux : leur intersection commune, grisée, n'est pas vide. À droite, trois bandes convexes le long des côtés d'un triangle équilatéral : elles se rencontrent deux à deux aux sommets, en gris, mais aucun point n'est commun aux trois, le centre du triangle, en rouge, restant loin de chacune.
      ```
    - |
      La troisième remarque du nœud signale que le nerf des deux ouverts étoilés $U = \mathbb R^2 \setminus L_-$ et $V = \mathbb R^2 \setminus L_+$ du deuxième exemple de [[suite-mayer-vietoris-formes|suite de Mayer-Vietoris]] a une cohomologie nulle en degré $1$ ; le calcul est immédiat. Ce nerf est celui de deux cubes qui se rencontrent. Les cocycles de degré $1$ étant alternés (deuxième exemple de [[cochaine-cech|cochaîne de Čech]]), un tel cocycle $c$ est déterminé par $a = c(U, V)$, et c'est le cobord de la cochaîne $b$ définie par $b(U) = 0$ et $b(V) = a$. Pourtant $H^1(\mathbb R^2 \setminus \{0\})$ n'est pas nul : sans intersections convexes, la conclusion (iv) du nœud tombe.

  cube-singulier:
    - |
      Un cube singulier peut écraser le cube $I^k$ sur une partie de dimension plus petite. L'application $c(s, t) = (s, s)$, restriction de la même formule, polynomiale, définie sur $\mathbb R^2$, est un cube singulier lisse de dimension $2$ de $\mathbb R^2$ dont l'image est le segment diagonal de $(0, 0)$ à $(1, 1)$ ; le cube constant égal à un point en est un autre, d'image réduite à ce point. L'application $(s, t) \mapsto (s^2, t^2)$, bijection de $I^2$ sur lui-même dont la différentielle n'est pas inversible sur les axes, en est un aussi : ni injectivité ni rang ne sont demandés.
    - |
      La régularité est exigée jusqu'au bord du cube, et c'est une vraie restriction. L'application $c(t) = \sqrt t$, de $I^1$ dans $\mathbb R$, est continue, et de classe $C^\infty$ sur $]0, 1]$, mais ce n'est pas un cube singulier lisse. Si $F$, de classe $C^\infty$ sur un ouvert contenant $[0, 1]$, prolongeait $c$, elle serait dérivable en $0$, alors que
      $$\frac{F(t) - F(0)}t = \frac1{\sqrt t}$$
      tend vers $+\infty$ quand $t$ tend vers $0$ par valeurs positives. L'application $t \mapsto t^2$, qui a la même image, est au contraire un cube, la formule polynomiale la prolongeant à $\mathbb R$.
    - |
      Le cube doit être à valeurs dans l'ouvert $U$, ainsi que l'un de ses prolongements. Pour $U = \mathbb R^2 \setminus \{0\}$, l'application $c(s, t) = \big((1 + s)\cos 2\pi t, (1 + s)\sin 2\pi t\big)$, qui envoie $I^2$ sur la partie $\{1 \leqslant \|x\|_2 \leqslant 2\}$, est un cube singulier lisse de $U$ : la même formule, sur l'ouvert $W = \mathopen]{-1}, +\infty\mathclose[ \times \mathbb R$, qui contient $I^2$, est de classe $C^\infty$ et ne s'annule pas, puisque $1 + s > 0$. Plus loin, au nœud {{dr-integrale-cubes|Intégrale sur une chaîne}}, on intégrera sur ce cube la forme $dx \wedge dy$ : le déterminant de la [[matrice-jacobienne|matrice jacobienne]], $2\pi(1 + s)$, donne $\int_{I^2} 2\pi(1 + s) = 3\pi = \pi \cdot 2^2 - \pi \cdot 1^2$.

  formule-stokes:
    - |
      En dimension $1$, la formule de Stokes est le théorème fondamental de l'analyse le long d'un chemin. Pour $f(x, y) = x^2y$ et le cube $c(t) = (t, t^3)$ de $\mathbb R^2$, on a $df = 2xy\,dx + x^2\,dy$, et, le long de $c$,
      $$\int_c df = \int_0^1 \big(2t^4 + 3t^4\big)\,dt = 1,$$
      qui est bien $f(c(1)) - f(c(0)) = f(1, 1) - f(0, 0)$. Le calcul de l'intégrale le long du chemin, au nœud {{dr-integrale-cubes|Intégrale sur une chaîne}}, (iii), n'était pas nécessaire : seules comptent les valeurs de $f$ aux extrémités.
    - |
      En dimension $2$, la formule ramène l'intégrale de $dx \wedge dy$ sur un cube à une intégrale sur son bord. Pour le cube $c(s, t) = \big((1 + s)\cos\frac{\pi t}2, (1 + s)\sin\frac{\pi t}2\big)$ et $\omega = x\,dy$, on a $d\omega = dx \wedge dy$, et le déterminant de la [[matrice-jacobienne|matrice jacobienne]] de $c$ vaut $\frac\pi2(1 + s)$ :
      $$\int_c d\omega = \int_{I^2} \frac\pi2(1 + s) = \frac{3\pi}4,$$
      soit le quart de $\pi \cdot 2^2 - \pi \cdot 1^2$. Par le bord, calculé dans le deuxième exemple de [[bord-cubique|bord]], les deux segments ne donnent rien, l'un parce que $dy$ y a une image réciproque nulle, l'autre parce que $x = 0$ ; l'arc extérieur donne $\pi$, l'arc intérieur $\frac\pi4$, affecté du signe moins, et $\pi - \frac\pi4 = \frac{3\pi}4$.
    - |
      La forme doit être définie sur un ouvert qui contient l'image du cube. Le cube $c(s, t) = (s\cos 2\pi t, s\sin 2\pi t)$ du disque unité passe par l'origine, où la forme $\omega_0 = \frac{x\,dy - y\,dx}{x^2 + y^2}$ n'est pas définie : ce n'est pas un cube de $\mathbb R^2 \setminus \{0\}$, et la formule ne s'applique pas. De fait, $d\omega_0 = 0$ là où $\omega_0$ est définie, alors que le bord de $c$ dans $\mathbb R^2$ est $c_{1,1} - c_{1,0}$, différence du cercle unité et du cube constant en l'origine (deuxième exemple de [[face-cube|face]]), et que l'intégrale de $\omega_0$ sur le cercle vaut $2\pi$. Plus loin, au nœud {{dc-angle-solide|Forme angle solide}}, ce défaut devient une mesure : pour $n \geqslant 2$, l'intégrale de la forme angle solide sur le bord du cube $[-1, 1]^n$, qui entoure l'origine, n'est pas nulle.

  diffeomorphisme-primitif:
    - |
      Un difféomorphisme primitif ne change qu'une coordonnée, mais ne pas changer les autres ne suffit pas à en faire un. L'application $h(x, y) = (x, y + x^2)$ de $\mathbb R^2$ dans lui-même ne change que la seconde coordonnée ; elle est de classe $C^\infty$, de réciproque $(x, y) \mapsto (x, y - x^2)$, et le [[determinant|déterminant]] de sa matrice jacobienne vaut $\partial_2 h_2 = 1$ : c'est un difféomorphisme primitif. L'application $g(x, y) = (x, y^3)$ ne change elle aussi que la seconde coordonnée, et c'est une bijection de classe $C^\infty$ ; mais le déterminant de sa matrice jacobienne, $3y^2$, s'annule sur l'axe $y = 0$, ce qu'interdit le point (i) : $g$ n'est pas un [[diffeomorphisme|difféomorphisme]], sa réciproque $(x, \sqrt[3]{y})$ n'étant pas dérivable aux points de cet axe.
    - |
      La rotation d'un quart de tour se décompose en un difféomorphisme primitif et une permutation des coordonnées. Pour $\tau(x, y) = (-y, x)$, la matrice de $d\tau$ a pour lignes $(0, -1)$ et $(1, 0)$, d'où $M_1 = 1$ et $M_2 = 0$ : il faut prendre $j = 1$, et $\sigma$ échange $1$ et $2$. Alors
      $$\begin{aligned} \tau' &= P_\sigma \circ \tau : (x, y) \mapsto (x, -y), \\ k(x, y) &= (\tau'_1(x, y), y) = (x, y), \\ h(y_1, y_2) &= (y_1, -y_2), \end{aligned}$$
      et $\tau = P_{\sigma^{-1}} \circ h \circ k$ : la rotation d'un quart de tour est la symétrie par rapport à l'axe horizontal, primitive, suivie de l'échange des coordonnées. Avec $\sigma = \mathrm{id}$, on aurait $k(x, y) = (-y, y)$, qui n'est injective sur aucun ouvert.
    - |
      Pour un difféomorphisme primitif, la formule du changement de variables se ramène, tranche par tranche, à la règle de substitution en une variable. Pour $h(x, y) = (x, y + x^2)$, de déterminant $1$, et une fonction $f$ continue à support compact, on a, à $x$ fixé, $\int f(x, y + x^2)\,dy = \int f(x, y)\,dy$, par le changement de variable $y \mapsto y + x^2$, simple translation. Plus loin, au nœud {{dv-changement|Changement de variables}}, c'est exactement le traitement du difféomorphisme primitif $h$ de la récurrence : on intègre d'abord dans la direction de la seule coordonnée qui change, grâce au théorème de Fubini pour les fonctions continues.

  demi-espace:
    - |
      Un ouvert du demi-espace n'est pas, en général, un ouvert de $\mathbb R^n$. Le demi-disque $D = \{x \in \mathbb H^2 : x_1^2 + x_2^2 < 1\}$, trace sur $\mathbb H^2$ du disque ouvert, est un ouvert de $\mathbb H^2$ pour la [[topologie-induite|topologie induite]]. Il contient l'origine, mais aucune boule de $\mathbb R^2$ centrée en l'origine, puisque les points $(0, -s)$, $s > 0$, n'appartiennent pas à $\mathbb H^2$ : ce n'est pas un ouvert de $\mathbb R^2$. C'est aux points du bord que les ouverts de $\mathbb H^2$ diffèrent de ceux de $\mathbb R^2$.
    - |
      Un difféomorphisme entre ouverts du demi-espace envoie le bord sur le bord, et la dérivée normale y est strictement positive ; un simple homéomorphisme lisse n'y suffit pas. Le cisaillement $\tau(x, y) = (x + y, y)$ est un difféomorphisme de $\mathbb H^2$ sur lui-même, de réciproque $(x - y, y)$ ; il conserve la droite $y = 0$, et $\partial_2\tau_2 = 1 > 0$. L'application $h(x, y) = (x, y^2)$ est une bijection de $\mathbb H^2$ sur lui-même, continue et de classe $C^\infty$, de réciproque continue $(x, \sqrt y)$, et elle conserve aussi le bord ; mais $\partial_2 h_2 = 2y$ est nulle sur le bord, contrairement à la conclusion du point (ii) : la réciproque n'est pas de classe $C^1$, et $h$ n'est pas un difféomorphisme.
    - |
      En dimension $1$, aucune réflexion ne conserve le demi-espace $\mathbb H^1 = [0, +\infty[$. Pour $n \geqslant 2$, l'application $(z_1, z_2, \dots, z_n) \mapsto (-z_1, z_2, \dots, z_n)$ conserve $\mathbb H^n$ et renverse l'orientation, alors que $x \mapsto -x$ envoie $[0, +\infty[$ sur $]{-\infty}, 0]$. Un difféomorphisme d'un ouvert de $\mathbb H^1$ contenant $0$ sur un tel ouvert fixe $0$, par le point (ii), et il est croissant au voisinage de $0$, puisqu'il est injectif, continu et à valeurs positives. Plus loin, au nœud {{dv-orientation-bord|Orientation induite}}, c'est l'une des raisons pour lesquelles le segment $[0, 1]$ n'admet aucune orientation au sens du chapitre, et que l'orientation induite est réservée à la dimension $n \geqslant 2$.

  variete-a-bord:
    - |
      Le segment est une variété à bord compacte, dont le bord est formé des deux extrémités ; ses cartes sont à valeurs dans le [[demi-espace]] $\mathbb H^1$. Sur $M = [0, 1]$, muni de la topologie induite, les cartes $\varphi_1(t) = t$, définie sur $[0, 1[$, et $\varphi_2(t) = 1 - t$, définie sur $]0, 1]$, sont des [[homeomorphisme|homéomorphismes]] sur l'ouvert $[0, 1[$ de $\mathbb H^1 = [0, +\infty[$. Leur changement de carte, $u \mapsto 1 - u$ sur $]0, 1[$, est de classe $C^\infty$, ainsi que sa réciproque ; $M$ est séparé et a une base dénombrable, comme partie de $\mathbb R$. Les points envoyés sur $0$ par une carte sont $0$ et $1$ : $\partial M = \{0, 1\}$.
    - |
      Les cartes à valeurs dans le demi-espace sont indispensables : $[0, 1]$ n'est pas une [[variete-differentiable|variété]] de dimension $1$. Si $\varphi$ était un homéomorphisme d'un voisinage ouvert $V$ de $0$ dans $[0, 1]$ sur un ouvert de $\mathbb R$, soit $\varepsilon > 0$ tel que $[0, \varepsilon[ \subset V$. L'image $J = \varphi([0, \varepsilon[)$ serait connexe et ouverte dans $\mathbb R$, donc un intervalle ouvert, contenant $\varphi(0)$, et $\varphi$ induirait un homéomorphisme de $]0, \varepsilon[$, [[connexe]], sur $J \setminus \{\varphi(0)\}$, qui ne l'est pas, $\varphi(0)$ n'étant pas une extrémité de $J$. Le point $0$ n'a donc aucune carte à valeurs dans un ouvert de $\mathbb R$ ; à valeurs dans $\mathbb H^1$, il en a, comme le montre le premier exemple.
    - |
      Le demi-espace lui-même, avec la seule carte $\mathrm{id}$, est une variété à bord, de bord l'hyperplan $\{x_n = 0\}$ ; un ouvert de $\mathbb R^n$, par les cartes translatées du point (v), en est une de bord vide. Une variété à bord peut donc être compacte ou non, de bord vide ou non. Plus loin, au nœud {{dv-stokes-demi-espace|Stokes sur le demi-espace}}, la formule de Stokes sur un ouvert de $\mathbb H^n$ sera le calcul local d'où tout le reste se déduit, par une partition de l'unité.

  bord-variete:
    - |
      Le bord d'une variété à bord connexe peut avoir plusieurs morceaux. La partie $A = \{x \in \mathbb R^2 : 1 \leqslant |x| \leqslant 2\}$, connexe comme image de $[1, 2] \times \mathbb R$ par $(r, t) \mapsto (r\cos t, r\sin t)$, est une [[variete-a-bord|variété à bord]], par les cartes suivantes : la translation $x \mapsto x + 3e_2$ sur $\{1 < |x| < 2\}$, et, sur $\{x \in A : x_2 > 0,\ |x| > 1\}$, la carte $x \mapsto (x_1, 4 - |x|^2)$, à valeurs dans l'ouvert $\{u \in \mathbb H^2 : u_2 < 3,\ u_1^2 + u_2 < 4\}$, de réciproque donnée par $x_2 = \sqrt{4 - u_2 - u_1^2}$, et les cartes analogues sur les autres demi-plans et près du cercle intérieur, avec $|x|^2 - 1$. Comme pour la boule fermée (première remarque du nœud), les changements de carte sont composés de polynômes et de racines carrées de nombres strictement positifs. Le bord est formé des points où la seconde coordonnée de la carte s'annule : ce sont les deux cercles $|x| = 1$ et $|x| = 2$.
    - |
      Le bord n'est pas la [[frontiere|frontière]]. Le demi-disque $M = \{x \in \mathbb H^2 : |x| < 1\}$, ouvert de $\mathbb H^2$, est une variété à bord avec la seule carte $\mathrm{id}$, et son bord est le segment ouvert $\mathopen]{-1}, 1\mathclose[ \times \{0\}$. Sa frontière dans $\mathbb R^2$ est formée de ce segment fermé et du demi-cercle $\{|x| = 1,\ x_2 \geqslant 0\}$, qui n'appartient même pas à $M$. Le bord ne dépend que de la structure de $M$, alors que la frontière dépend de l'espace où l'on plonge $M$.
      ```schema lex-bord-variete-2
      Le demi-disque $M$, grisé, sans son arc, en pointillé. Son bord, en rouge, est le diamètre privé de ses extrémités ; sa frontière dans le plan contient aussi l'arc, en gris, et les deux extrémités du diamètre, qui ne sont pas dans $M$.
      ```
    - |
      En dimension $n \geqslant 2$, le bord d'une variété à bord n'a pas lui-même de bord. Pour la boule fermée $\bar B$ de $\mathbb R^n$, dont le bord est la sphère $S^{n-1}$ (première remarque du nœud), le point (iv) fait de $S^{n-1}$ une variété de dimension $n - 1$, et le point (v), une variété à bord de bord vide. Plus loin, au nœud {{dv-stokes|Stokes sur une variété}}, (ii), on en déduira que $\int_{S^{n-1}} d\eta = 0$ pour toute forme $\eta$ de degré $n - 2$ sur la sphère, munie de l'orientation induite : c'est l'analogue, pour les variétés, de $\partial \circ \partial = 0$ pour les chaînes cubiques.

  orientation-induite:
    - |
      Sur le bord du demi-espace, l'orientation induite dépend de la parité de la dimension. Orientons $\mathbb H^n$ par la carte $\mathrm{id}$. Pour $n = 2$, $\kappa$ est l'identité, et l'orientation induite sur $\partial\mathbb H^2 \cong \mathbb R$ est celle de $x_1$ croissant : la normale sortante $\nu = -e_2$ suivie de $e_1$ forme une base directe, puisque $\det(-e_2, e_1) = 1$. Pour $n = 3$, $\kappa(z_1, z_2) = (-z_1, z_2)$, et l'orientation induite sur le plan $\partial\mathbb H^3$ est l'opposée de celle de $(e_1, e_2)$, conformément à $\det(-e_3, e_1, e_2) = -1$ : c'est la base $(-e_1, e_2)$, et non $(e_1, e_2)$, qui est directe sur le bord.
    - |
      Les deux cercles qui bordent $A = \{1 \leqslant |x| \leqslant 2\}$ sont orientés en sens contraires. Orientons $A$ par l'atlas formé de la carte $x \mapsto x + 3e_2$ de son intérieur et de cartes à bord dont la matrice jacobienne a un déterminant strictement positif, comme les deux suivantes ; leurs changements de carte ont alors un déterminant positif, par la règle de la chaîne. Sur $\{x_2 > 0\}$, la carte $\varphi(x) = (-x_1, 4 - |x|^2)$ près du cercle extérieur et la carte $\psi(x) = (x_1, |x|^2 - 1)$ près du cercle intérieur ont pour déterminants de leurs matrices jacobiennes
      $$\begin{aligned} \det d\varphi &= 2x_2 > 0, \\ \det d\psi &= 2x_2 > 0 : \end{aligned}$$
      elles sont directes. Comme $n = 2$, les cartes induites sont $-x_1$ sur le demi-cercle extérieur, qui croît de $(2, 0)$ vers $(-2, 0)$, sens trigonométrique, et $x_1$ sur le demi-cercle intérieur, qui croît de $(-1, 0)$ vers $(1, 0)$, sens des aiguilles d'une montre.
      ```schema lex-orientation-induite-2
      La partie $A$, grisée, et son bord muni de l'orientation induite : le cercle extérieur, en rouge, est parcouru dans le sens direct, le cercle intérieur, en bleu, dans le sens contraire. En deux points, la normale sortante, en vert, pointe hors de $A$, et le vecteur tangent direct s'en déduit par un quart de tour dans le sens direct.
      ```
    - |
      C'est l'orientation que demande la [[formule-stokes|formule de Stokes]], et un autre choix fausserait les signes. Pour la partie $A$ du deuxième exemple et $\omega = x\,dy$, de différentielle $dx \wedge dy$, l'intégrale de $x\,dy$ le long d'un cercle de rayon $r$ parcouru dans le sens direct vaut $\pi r^2$. Le bord orienté donne donc $4\pi - \pi = 3\pi$, le cercle intérieur étant parcouru à rebours. Plus loin, au nœud {{dv-stokes|Stokes sur une variété}}, la formule de Stokes affirmera que $\int_A dx \wedge dy$, qui vaut $3\pi$, est égal à ce nombre ; en orientant les deux cercles dans le même sens, on trouverait $5\pi$.

  integrale-variete:
    - |
      L'intégrale ne dépend pas de la carte directe choisie, mais une carte qui renverse l'orientation change son signe. Sur $M = \,]0, +\infty[$, orientée par la carte $\mathrm{id}$, soit $\omega = f(x)\,dx$, avec $f = \psi_{2,1}$ du nœud {{dr-plateau|Fonctions plateau}}, de [[support-forme|support]] $[1, 3]$. La carte $\varphi = \ln$, de dérivée $\frac1x > 0$, est directe, et le coefficient de $\omega$ y est $a(u) = f(e^u)\,e^u$ : par la règle de substitution, $\int a = \int f$, et les deux cartes donnent la même valeur, environ $0{,}4440$. La carte $u = -\ln x$, de dérivée $-\frac1x$, n'est pas directe : le coefficient y est $-f(e^{-u})\,e^{-u}$, d'intégrale $-\int f$.
    - |
      Sans support compact, l'intégrale n'est pas définie, même quand le calcul naïf donne un nombre. Sur $M = \,]0, 1[$, orientée par $\mathrm{id}$, la forme $dx$ a pour support l'adhérence de $]0, 1[$ dans $M$, c'est-à-dire $M$ tout entière, qui n'est pas [[compact|compacte]]. Il n'existe alors aucun système de cartes : les fonctions $\chi_l$, en nombre fini, de somme $1$ sur $M$, feraient de $M$ la réunion des adhérences compactes des $\{\chi_l \neq 0\}$, donc un compact. La définition ne s'applique pas, bien que $\int_0^1 dx$ vaille $1$. Sur $M = \mathbb R$, la même forme aurait une « intégrale » infinie.
    - |
      Sur une variété compacte, toute forme est à support compact, son support étant fermé dans un compact. Sur le cercle $\lex{sphere-unite}{S^1}$, orienté comme dans la remarque du nœud, la forme $\omega = x\,dy - y\,dx$ a pour intégrale $2\pi$. Plus loin, au nœud {{dv-stokes|Stokes sur une variété}}, (ii), on verra que $\int_{S^1} dg = 0$ pour toute fonction lisse $g$ sur le cercle, dont le bord est vide : $\omega$, d'intégrale non nulle, n'est la différentielle d'aucune fonction lisse sur $S^1$, bien qu'elle soit fermée, comme toute forme de degré $1$ sur une variété de dimension $1$.

  pave:
    - |
      Un pavé est un produit de segments, et cette forme se reconnaît à une propriété d'échange : si $(x, y)$ et $(x', y')$ sont dans un produit $A \times B$, le point $(x, y')$ y est aussi. Le pavé $P = [0, 1] \times [0, 2] \times [-1, 1]$ de $\mathbb R^3$ a pour volume $v(P) = 1 \cdot 2 \cdot 2 = 4$. Le triangle plein $T = \{(x, y) : 0 \leqslant y \leqslant x \leqslant 1\}$ n'est pas un pavé : il contient $(0, 0)$ et $(1, 1)$, mais pas le point $(0, 1)$, que l'échange des secondes coordonnées produirait.
    - |
      Les pavés sont stables par intersection, tant qu'elle ne s'écrase pas. L'intersection de $[0, 2]^2$ et de $[1, 3]^2$ est le pavé $[1, 2]^2$, puisque l'intersection de deux produits est le produit des intersections. Celle de $[0, 1]^2$ et de $[1, 2]^2$ est le point $(1, 1)$, produit de deux segments réduits à $\{1\}$, qui n'est pas un pavé, la condition $a_i < b_i$ n'étant pas satisfaite ; celle de $[0, 1]^2$ et de $[2, 3]^2$ est vide.

      La réunion de deux pavés, en revanche, n'en est pas un en général : $[0, 2]^2 \cup [1, 3]^2$ contient $(0, 0)$ et $(3, 3)$, mais pas $(0, 3)$.
      ```schema lex-pave-2
      De gauche à droite : deux carrés qui se chevauchent, dont l'intersection grisée est un pavé ; deux carrés qui se touchent par un coin, dont l'intersection est un point, en rouge ; deux carrés disjoints. Dans le premier cas, la réunion contient les deux points marqués $(0, 0)$ et $(3, 3)$, mais pas le point $(0, 3)$, cerclé de rouge : ce n'est pas un pavé.
      ```
    - |
      Le produit de deux pavés est un pavé, et les volumes se multiplient : si $P \subset \mathbb R^n$ et $P' \subset \mathbb R^m$ sont des pavés, $P \times P'$ est un pavé de $\mathbb R^{n+m}$, de volume $v(P)\,v(P')$. Soit $g$ continue sur $P$ et $h$ continue sur $P'$. Les $n$ premières intégrations de $(x, y) \mapsto g(x)h(y)$ portent sur $x$, à $y$ fixé, et elles donnent $h(y)\int_P g$, par linéarité ({{dr-iterees|Intégrales itérées}}, (ii)) ; d'où
      $$\int_{P \times P'} g(x)h(y) = \int_P g \cdot \int_{P'} h.$$
      Plus loin, au nœud {{pc-fibre|Poincaré à support compact}}, (iv), une récurrence sur la dimension découpe de même des pavés ouverts, éventuellement non bornés, en $P' \times \,]a_n, b_n[$ ; ce ne sont pas des pavés au sens de ce nœud, qui sont fermés et bornés.

  cube-unite:
    - |
      Le cube unité est une boule pour la norme du maximum, et non pour la norme euclidienne. Un point $x$ est dans $I^n$ si et seulement si $|x_i - \frac12| \leqslant \frac12$ pour tout $i$ : $I^n$ est la [[boule-fermee|boule fermée]] de centre $c = (\frac12, \dots, \frac12)$ et de rayon $\frac12$ pour $\|\cdot\|_\infty$. Pour $n \geqslant 2$, ce n'est pas la boule euclidienne de même centre et de même rayon, puisque le coin $(1, \dots, 1)$ est à la distance euclidienne $\frac{\sqrt n}2 > \frac12$ de $c$.
      ```schema lex-cube-unite-1
      Le carré $I^2$, boule fermée de centre $c$ et de rayon $\frac12$ pour la norme du maximum, et, en bleu, le disque euclidien de même centre et de même rayon : il ne contient pas les coins, comme le coin $(1, 1)$, en rouge, situé à la distance $\frac{\sqrt2}2$ de $c$.
      ```
    - |
      Tout [[pave|pavé]] est l'image du cube unité par l'application $\alpha_P$ du point (iii), et l'intégrale sur $P$ s'y ramène, au facteur $v(P)$ près. Pour $P = [1, 3] \times [0, \frac12]$, de volume $1$, on a $\alpha_P(t) = (1 + 2t_1, \frac12 t_2)$. Pour $g(x, y) = x$, le calcul direct donne $\int_1^3 x\,dx = 4$, puis $\int_0^{1/2} 4\,dy = 2$ ; sur le cube unité,
      $$\begin{aligned} &v(P)\int_{I^2} g \circ \alpha_P \\ &\quad = \int_0^1\!\!\int_0^1 (1 + 2t_1)\,dt_1\,dt_2 = 2. \end{aligned}$$
      L'étirement de la première coordonnée, d'un facteur $2$, et la contraction de la seconde, d'un facteur $\frac12$, se compensent dans le volume.
    - |
      En dimension $0$, le cube unité $I^0$ est un point, et l'intégrale d'une fonction sur $I^0$ est sa valeur en ce point. La formule $\int_P 1 = v(P)$ du point (ii) s'y prolonge si l'on convient qu'un produit vide de facteurs vaut $1$. Plus loin, au nœud {{dr-cubes|Cubes singuliers}}, un cube singulier de dimension $0$ sera ainsi un point, et l'intégrale d'une fonction sur ce cube, au nœud {{dr-integrale-cubes|Intégrale sur une chaîne}}, sa valeur en ce point : c'est le terme de bord de la formule de Stokes en degré $1$, $f(c(1)) - f(c(0))$.

  integrale-iteree:
    - |
      Sur le [[pave|pavé]] $P = [0, 2] \times [0, 1]$, la fonction $g(x, y) = xy^2$ s'intègre d'abord en $x$, à $y$ fixé, puis en $y$ :
      $$\begin{aligned} g_1(y) &= \int_0^2 xy^2\,dx = 2y^2, \\ \int_P g &= \int_0^1 2y^2\,dy = \frac23. \end{aligned}$$
      On retrouve le produit $\int_0^2 x\,dx \cdot \int_0^1 y^2\,dy$, comme pour toute fonction à variables séparées. Rapportée au volume $v(P) = 2$, l'intégrale donne la valeur moyenne $\frac13$ de $g$ sur $P$, comprise, comme le veut le point (ii), entre le minimum $0$ et le maximum $2$.
    - |
      La continuité de $g$ sur le pavé est ce qui rend continues les fonctions intermédiaires, et elle ne peut pas être omise. Sur $[0, 1]^2$, la fonction $g$ égale à $1$ si $y > \frac12$ et à $0$ sinon n'est pas continue. À $y$ fixé, $x \mapsto g(x, y)$ est constante, et $g_1(y)$ vaut $1$ si $y > \frac12$, $0$ sinon : la fonction $g_1$ n'est pas continue en $\frac12$, et la conclusion du point (i) tombe. Ici la seconde intégration a encore un sens, $g_1$ étant une [[fonction-escalier|fonction en escalier]], d'intégrale $\frac12$ ; mais la définition ne le garantit plus en général.
    - |
      L'ordre fixé, $x_1$ d'abord, peut compliquer le calcul. Pour $g(x, y) = x\,e^{xy}$ sur $[0, 1]^2$, on trouve, pour $y \neq 0$,
      $$g_1(y) = \frac{e^y}{y} - \frac{e^y - 1}{y^2},$$
      comme on le vérifie en dérivant en $x$ la fonction $\frac{x\,e^{xy}}{y} - \frac{e^{xy}}{y^2}$, et $g_1(0) = \frac12$. Le point (i) assure que $g_1$ est continue en $0$, ce que confirme le développement de $e^y$ à l'ordre $2$, mais la seconde intégration reste à faire. Plus loin, le nœud {{dr-fubini|Fubini pour les fonctions continues}} permettra d'intégrer d'abord en $y$ : $\int_0^1 x\,e^{xy}\,dy = e^x - 1$, d'où $\int_{[0,1]^2} g = e - 2$, sans calcul délicat.

  cube-degenere:
    - |
      Un cube dégénéré n'a pas de volume, mais un cube d'image plate n'est pas forcément dégénéré. Le cube $c(s, t) = (s, s^2)$ de $\mathbb R^2$ ne dépend pas de $t$ : il est dégénéré, et le déterminant de sa [[matrice-jacobienne|matrice jacobienne]], $1 \cdot 0 - 0 \cdot 2s$, est nul, de sorte que $\int_c \omega = 0$ pour toute forme $\omega$ de degré $2$. Le cube $c'(s, t) = \big(st, (st)^2\big)$ a la même image, l'arc de parabole, et dépend des deux variables ; il n'est pas dégénéré, et pourtant le déterminant de sa matrice jacobienne,
      $$t \cdot 2s^2t - s \cdot 2st^2 = 0,$$
      est nul, et son intégrale aussi : la réciproque du point (v) est fausse.
    - |
      Un cube qui n'est pas dégénéré peut avoir une face dégénérée. Le cube $c(s, t) = (s\cos 2\pi t, s\sin 2\pi t)$, qui envoie $I^2$ sur le disque unité, dépend des deux variables, et le déterminant de sa matrice jacobienne vaut $2\pi s$ :
      $$\int_c dx \wedge dy = \int_{I^2} 2\pi s = \pi,$$
      qui n'est pas nul. Sa face $c_{1,0}$, constante égale à l'origine, est en revanche un cube dégénéré de dimension $1$, et l'intégrale de toute forme de degré $1$ y est nulle. Sans l'hypothèse de dégénérescence, la conclusion du point (v) tombe donc.
    - |
      Les cubes dégénérés expliquent pourquoi le complexe des chaînes cubiques n'a pas l'homologie attendue. Pour $U = \mathbb R^0$, le cube constant $c_k$ de dimension $k \geqslant 1$ est dégénéré, et son bord est nul, ses faces $(i, 0)$ et $(i, 1)$ se compensant ({{dr-cubes|Cubes singuliers}}, dernière remarque) : ces cycles, qui ne sont pas des bords, donnent une homologie non nulle en tout degré, alors qu'un point n'a d'homologie qu'en degré $0$. Plus loin, au nœud {{dt-simplexes|Simplexes lisses}}, (ii), le bord du cube $\sigma \circ q_k$ associé à un simplexe lisse contient de même des faces dégénérées, et c'est le point (v) qui les fait disparaître de la formule de Stokes pour les simplexes.

  chaine-cubique:
    - |
      Une chaîne cubique retient le paramétrage, et non la seule image. Dans $Q_1(\mathbb R)$, les cubes $c(t) = t$ et $c'(t) = t^2$ sont deux générateurs distincts du [[groupe-abelien-libre|groupe abélien libre]], puisque ce sont deux applications différentes : $c - c' \neq 0$, bien qu'ils aient la même image $[0, 1]$ et les mêmes extrémités. De même, avec $\bar c(t) = 1 - t$, la chaîne $c + \bar c$ n'est pas nulle, alors que son [[bord-cubique|bord]] l'est : $(1 - 0) + (0 - 1) = 0$.
    - |
      Le groupe des chaînes est nul quand il n'y a aucun cube, et se réduit à $\mathbb Z$ quand il n'y en a qu'un. Pour l'ouvert vide, il n'existe aucune application de $I^k$, qui n'est pas vide, dans $\varnothing$ : $Q_k(\varnothing) = 0$ pour tout $k$. Pour $U = \mathbb R^0$, réduit à un point, il y a exactement un cube de chaque dimension $k \geqslant 0$, l'application constante, et $Q_k(\mathbb R^0) \cong \mathbb Z$, comme dans la dernière remarque du nœud {{dr-cubes|Cubes singuliers}}.
    - |
      Parcourir deux fois un lacet ne donne pas la même chaîne que parcourir un lacet deux fois plus rapide. Dans $U = \mathbb R^2 \setminus \{0\}$, avec $c(t) = (\cos 2\pi t, \sin 2\pi t)$ et $c_2(t) = (\cos 4\pi t, \sin 4\pi t)$, la chaîne $2c$ a pour coefficient $2$ sur le générateur $c$, et la chaîne $c_2$ le coefficient $1$ sur un autre générateur : $2c \neq c_2$, bien que leurs images soient le même cercle et que leurs bords soient tous deux nuls. Plus loin, au nœud {{dr-integrale-cubes|Intégrale sur une chaîne}}, l'intégrale ne les distinguera pas : pour la forme $\frac{x\,dy - y\,dx}{x^2 + y^2}$, elle vaut $4\pi$ sur l'une et sur l'autre.

  face-cube:
    - |
      Les faces d'un cube de dimension $2$ sont ses quatre côtés, chacun paramétré par l'autre variable. Pour le [[cube-singulier|cube singulier lisse]] $c(s, t) = \big((1 + s)\cos\frac{\pi t}2, (1 + s)\sin\frac{\pi t}2\big)$ de $\mathbb R^2$, qui envoie $I^2$ sur le secteur $A = \{x : x_1 \geqslant 0,\ x_2 \geqslant 0,\ 1 \leqslant \|x\|_2 \leqslant 2\}$, on fixe d'abord $s$, puis $t$ :
      $$\begin{aligned} c_{1,0}(t) &= \big(\cos\tfrac{\pi t}2, \sin\tfrac{\pi t}2\big), \\ c_{1,1}(t) &= \big(2\cos\tfrac{\pi t}2, 2\sin\tfrac{\pi t}2\big), \\ c_{2,0}(s) &= (1 + s, 0), \\ c_{2,1}(s) &= (0, 1 + s). \end{aligned}$$
      Les faces $(1, \varepsilon)$ sont les arcs de rayons $1$ et $2$, les faces $(2, \varepsilon)$ deux segments des axes, tous parcourus dans le sens de la variable restante croissante.
      ```schema lex-face-cube-1
      Le secteur $A$, image de $c$, et ses quatre faces : l'arc intérieur $c_{1,0}$ et l'arc extérieur $c_{1,1}$, en bleu, le segment $c_{2,0}$ de l'axe horizontal et le segment $c_{2,1}$ de l'axe vertical, en rouge. Les flèches indiquent le sens de la variable restante croissante.
      ```
    - |
      Deux faces d'un même cube peuvent coïncider, et une face peut être constante. Pour $c(s, t) = (s\cos 2\pi t, s\sin 2\pi t)$, qui envoie $I^2$ sur le disque unité, la face $c_{1,0}$ est le cube constant égal à l'origine, $c_{1,1}$ est le cercle unité, et les faces $c_{2,0}$ et $c_{2,1}$ sont toutes deux le segment $s \mapsto (s, 0)$, puisque $\cos 2\pi = 1$ et $\sin 2\pi = 0$. Leurs signes $(-1)^{2+0}$ et $(-1)^{2+1}$ sont opposés : elles se compensent dans le bord, et
      $$\partial c = c_{1,1} - c_{1,0}.$$
      Le rayon $[0, 1] \times \{0\}$, le long duquel le disque est « recousu », ne laisse aucune trace dans le bord.
    - |
      Une face d'une face est une arête, que l'on atteint par deux faces différentes. Dans $I^3$, la face $(1, 1)$ de la face $(1, 0)$ et la face $(1, 0)$ de la face $(2, 1)$ sont la même arête :
      $$\begin{aligned} \iota_{1,0} \circ \iota_{1,1}(u) &= (0, 1, u), \\ \iota_{2,1} \circ \iota_{1,0}(u) &= (0, 1, u), \end{aligned}$$
      comme l'annonce le point (i), avec $i = j = 1$, $\varepsilon = 0$ et $\eta = 1$ ; leurs signes, $(-1)^{1+0}(-1)^{1+1} = -1$ et $(-1)^{2+1}(-1)^{1+0} = 1$, sont opposés. L'ordre des insertions compte : $\iota_{1,1} \circ \iota_{1,0}(u) = (1, 0, u)$ est une autre arête, d'où le décalage $j + 1$ du point (i). Plus loin, au nœud {{dt-simplexes|Simplexes lisses}}, (ii), le calcul des faces du cube $\sigma \circ q_k$ suit le même principe pour ramener le bord d'un simplexe à celui d'un cube.

  bord-cubique:
    - |
      En dimension $1$, le bord d'un cube est la différence de ses extrémités. Les deux faces d'un cube $c : I^1 \to U$ sont les points $c_{1,0} = c(0)$ et $c_{1,1} = c(1)$, de signes $(-1)^{1+0} = -1$ et $(-1)^{1+1} = 1$, d'où $\partial c = c(1) - c(0)$, chaîne de dimension $0$. Pour le cercle $c(t) = (\cos 2\pi t, \sin 2\pi t)$ dans $\mathbb R^2 \setminus \{0\}$, $\partial c = 0$, bien que $c$ ne soit pas constant : un [[lacet]] lisse est un [[cycle-complexe|cycle]]. En dimension $0$, le bord est nul par convention.
    - |
      Le bord d'un cube de dimension $2$ fait le tour de son image, et le bord de ce bord est nul. Pour le cube $c(s, t) = \big((1 + s)\cos\frac{\pi t}2, (1 + s)\sin\frac{\pi t}2\big)$, d'image le secteur $A$, dont les faces sont calculées dans le premier exemple de [[face-cube|face]],
      $$\partial c = c_{2,0} + c_{1,1} - c_{2,1} - c_{1,0} :$$
      le segment de $(1, 0)$ à $(2, 0)$, l'arc extérieur jusqu'à $(0, 2)$, le segment vertical parcouru de $(0, 2)$ à $(0, 1)$ et l'arc intérieur parcouru de $(0, 1)$ à $(1, 0)$, c'est-à-dire le contour dans le sens direct. Les bords de ces quatre cubes sont $(2, 0) - (1, 0)$, $(0, 2) - (2, 0)$, $(0, 2) - (0, 1)$ et $(0, 1) - (1, 0)$ ; avec les signes, chaque sommet apparaît deux fois, avec des signes opposés, et $\partial\partial c = 0$, comme le veut le point (ii).
      ```schema lex-bord-cubique-2
      Le bord du secteur $A$, en rouge, avec les signes de ses quatre faces. Les côtés de signe moins, le segment vertical et l'arc intérieur, sont parcourus à rebours de leur paramétrage : le bord fait le tour de l'image dans le sens direct, et chaque sommet est l'extrémité d'un côté et l'origine du suivant.
      ```
    - |
      Un cycle n'est pas toujours un bord. Le cercle $c$ du premier exemple est un cycle de $\mathbb R^2 \setminus \{0\}$. Plus loin, le nœud {{dr-fermees|Formes exactes et cycles}}, (ii), montrera, par la formule de Stokes, que l'intégrale d'une forme [[forme-fermee|fermée]] est nulle sur tout bord d'une chaîne de dimension $2$ ; comme l'intégrale de la forme fermée $\frac{x\,dy - y\,dx}{x^2 + y^2}$ sur $c$ vaut $2\pi$, ce cycle n'est le bord d'aucune chaîne cubique de $\mathbb R^2 \setminus \{0\}$.

  primitive-forme:
    - |
      Une primitive n'est déterminée qu'à une constante près sur chaque morceau connexe. La forme $\omega = e^y\,dx + x\,e^y\,dy$ est [[forme-fermee|fermée]] sur $\mathbb R^2$, puisque $\partial_y(e^y) = e^y = \partial_x(x\,e^y)$, et $f(x, y) = x\,e^y$ en est une primitive. Comme $\mathbb R^2$ est convexe, donc [[connexe]], ses primitives sont les $x\,e^y + c$ (point (ii)). Sur l'ouvert $\{x \neq 0\}$, non connexe, la fonction égale à $x\,e^y$ si $x > 0$ et à $x\,e^y + 1$ si $x < 0$ est encore une primitive, et sa différence avec $f$ n'est pas constante : sans la connexité, (ii) tombe.
    - |
      Une forme fermée a des primitives locales sans avoir nécessairement de primitive globale. Sur $U = \mathbb R^2 \setminus \{0\}$, soit $\omega_0 = \frac{x\,dy - y\,dx}{x^2 + y^2}$. Sur la boule $B = B_\infty\big((1, 0), 1\big) = \mathopen]0, 2\mathclose[ \times \mathopen]{-1}, 1\mathclose[$, contenue dans $U$, la fonction $f = \arctan(y/x)$ vérifie
      $$\partial_x f = \frac{-y}{x^2 + y^2}, \qquad \partial_y f = \frac{x}{x^2 + y^2} :$$
      c'est une primitive de $\omega_0$ sur $B$, conformément au point (i). Pourtant $\omega_0$ n'est pas [[forme-exacte|exacte]] sur $U$, son intégrale sur le bord du carré $[-1, 1]^2$ valant $2\pi$ et non $0$ ({{gd-integrale-curviligne|Intégrale d'une 1-forme}}, remarque) : aucune primitive n'est définie sur $U$ tout entier.
      ```schema lex-primitive-forme-2
      La boule $B$, en bleu, ne contient pas l'origine. Les segments gris, portés par des demi-droites issues de l'origine, sont des lignes de niveau de la primitive $\arctan(y/x)$ sur $B$ : elle y est constante sur chacun d'eux, et croît d'un segment au suivant dans le sens direct.
      ```
    - |
      Sans fermeture, il n'y a pas même de primitive locale. Si $f$ était une primitive de $\omega = x\,dy$ sur un ouvert non vide $V$, on aurait $\partial_x f = 0$ et $\partial_y f = x$, donc $\partial_x\partial_y f = 1$ et $\partial_y\partial_x f = 0$, ce que le théorème de Schwarz interdit pour une fonction de classe $C^2$ ({{gd-schwarz|Schwarz, intégrales à paramètre}}). C'est le point (i) qui tombe quand on retire l'hypothèse $d\omega = 0$, ici $d\omega = dx \wedge dy$. Plus loin, au nœud {{dr-integrale|Intégrale le long d'un chemin continu}}, les primitives locales des formes fermées serviront à intégrer le long d'un chemin seulement continu : la forme $x\,dy$ n'y a pas accès.

  suite-mayer-vietoris-formes:
    - |
      La suite calcule la cohomologie d'une réunion à partir de morceaux plus simples. Pour $X = \mathbb R = \,]{-\infty}, 1[ \cup \,]0, +\infty[$, les ouverts $U$, $V$ et $U \cap V = \,]0, 1[$ sont des intervalles, [[partie-etoilee|étoilés]] : leur $H^0$ est formé des constantes et leurs $H^k$, $k \geqslant 1$, sont nuls ({{gd-de-rham|Cohomologie de de Rham}}, (ii), après translation). Le début de la suite s'écrit
      $$\begin{aligned} 0 &\to H^0(\mathbb R) \to \mathbb R^2 \xrightarrow{s^*} \mathbb R \\ &\to H^1(\mathbb R) \to 0, \end{aligned}$$
      où $s^*(a, b) = a - b$ est surjective : par exactitude, $H^1(\mathbb R) = \{0\}$, et $H^0(\mathbb R)$, isomorphe au noyau $\{a = b\}$ de $s^*$, est de dimension $1$, comme le donnait déjà la convexité de $\mathbb R$.
    - |
      Quand l'intersection a deux morceaux, le [[morphisme-connexion|morphisme de connexion]] crée de la cohomologie. Pour $X = \mathbb R^2 \setminus \{0\}$, soit $L_\pm$ les demi-axes $\{(0, s) : \pm s \geqslant 0\}$, $U = \mathbb R^2 \setminus L_-$ et $V = \mathbb R^2 \setminus L_+$. L'ouvert $U$ est étoilé par rapport à $e_2$ : si $x \in U$, $t \in [0, 1]$ et $e_2 + t(x - e_2) \in L_-$, alors $tx_1 = 0$ et $1 + t(x_2 - 1) \leqslant 0$, donc $t \neq 0$, $x_1 = 0$ et $x_2 \leqslant 1 - \frac1t \leqslant 0$, ce qui place $x$ dans $L_-$. De même pour $V$, par rapport à $-e_2$.

      Leur intersection $\{x_1 \neq 0\}$ a deux composantes, et $H^0(U \cap V) \cong \mathbb R^2$. La suite donne
      $$\begin{aligned} 0 &\to H^0(X) \to \mathbb R^2 \xrightarrow{s^*} \mathbb R^2 \\ &\xrightarrow{\delta} H^1(X) \to H^1(U) \oplus H^1(V) = 0, \end{aligned}$$
      où l'image de $s^*$ est formée des fonctions constantes, de dimension $1$ : $H^1(X)$ est isomorphe au quotient, de dimension $1$, engendré par $\delta[\eta]$, où $\eta$ vaut $1$ sur $\{x_1 > 0\}$ et $0$ sur $\{x_1 < 0\}$.
    - |
      La suite longue ne se découpe pas en suites exactes courtes, et c'est tout son intérêt. Dans l'exemple précédent, la suite
      $$\begin{aligned} 0 &\to H^0(X) \to H^0(U) \oplus H^0(V) \\ &\to H^0(U \cap V) \to 0 \end{aligned}$$
      n'est pas exacte à droite, $s^*$ n'étant pas surjective : passer à la cohomologie ne conserve pas l'exactitude de la suite courte des formes ({{dc-mayer-vietoris|Mayer-Vietoris}}, (i)), et le défaut de surjectivité est exactement mesuré par $H^1(X)$, à travers $\delta$. Plus loin, au nœud {{dc-epointe|ℝⁿ privé de l'origine}}, le même découpage, répété en dimension $n$, montre que $\delta$ fait monter la cohomologie de $\mathbb R^{n-1} \setminus \{0\}$ à celle de $\mathbb R^n \setminus \{0\}$, d'un degré à la fois.

  nulle-pres:
    - |
      Être nulle sur une partie ne suffit pas à être nulle près d'elle. Sur $X = \mathbb R$, avec $P = \,]{-\infty}, 0]$ et la fonction $\theta$ du nœud {{dr-plateau|Fonctions plateau}}, nulle sur $]{-\infty}, 0]$ et strictement positive au-delà, $\theta$ est nulle sur $P$ ; mais tout voisinage de $0$ contient des points $x > 0$, où $\theta(x) > 0$ : elle n'est pas nulle près de $P$. La fonction $x \mapsto \theta(x - 1)$, elle, est nulle sur l'ouvert $]{-\infty}, 1[$, qui est un voisinage de chaque point de $P$ : elle est nulle près de $P$.
      ```schema lex-nulle-pres-1
      En bleu, $\theta$, nulle sur la demi-droite $P$, en gris, et qui quitte $0$ dès que $x > 0$ ; en rouge, $x \mapsto \theta(x - 1)$, nulle sur $]{-\infty}, 1[$, intervalle ouvert qui déborde $P$.
      ```
    - |
      Être nulle près de $P$, c'est éviter $P$ par l'[[adherence|adhérence]] de l'ensemble où l'on ne s'annule pas. Si $x \in P$ a un voisinage ouvert où $\chi = 0$, ce voisinage ne rencontre pas $\{\chi \neq 0\}$, et $x$ n'est pas adhérent à cet ensemble ; réciproquement, un point non adhérent a un voisinage ouvert qui ne le rencontre pas. Ainsi $\chi$ est nulle près de $P$ si et seulement si $P \cap \overline{\{\chi \neq 0\}} = \varnothing$. La fonction $\chi_U$ de la première remarque du nœud {{dc-partition|Partition pour deux ouverts}} s'annule à partir de $x = \frac58$ : l'adhérence de $\{\chi_U \neq 0\}$ est contenue dans $]{-\infty}, \frac58]$, qui ne rencontre pas $X \setminus U = [1, +\infty[$.
    - |
      La nullité près du complémentaire permet de prolonger par $0$ un produit, même par une fonction qui explose au bord. Sur $U = \mathbb R$, avec $V = \,]0, +\infty[$ et $\eta(x) = \frac1x$ sur $U \cap V = V$, posons
      $$\rho(x) = \frac{\theta(x - 1)}{\theta(x - 1) + \theta(2 - x)},$$
      de classe $C^\infty$, le dénominateur étant strictement positif, nulle sur $]{-\infty}, 1]$ et égale à $1$ sur $[2, +\infty[$. Elle est nulle près de $U \setminus V = \,]{-\infty}, 0]$, et la fonction égale à $\rho\,\eta$ sur $V$ et à $0$ ailleurs est de classe $C^\infty$ sur $\mathbb R$, puisqu'elle est nulle sur l'ouvert $]{-\infty}, 1[$. Plus loin, au nœud {{pc-mayer-vietoris|Mayer-Vietoris à support compact}}, (i), c'est par le critère du deuxième exemple que la nullité de $\chi_U$ près de $X \setminus U$ place dans $U$ l'adhérence de $\{\chi_U \neq 0\}$.

  famille-compatible:
    - |
      Une famille compatible se lit comme une donnée sur la réunion, découpée selon la suite d'ouverts. Prenons, avec la même définition pour une suite croissante quelconque d'ouverts, $U_m = \bigcup_{j < m} \,]2j, 2j + 1[$ dans $\mathbb R$, de réunion $U$. Les $U_m$ ont $m$ composantes connexes, $\lex{cohomologie-de-rham}{H^0}(U_m) \cong \mathbb R^m$ ({{gd-de-rham|Cohomologie de de Rham}}, (i)), et la restriction de $H^0(U_{m+1})$ à $H^0(U_m)$ oublie la dernière valeur. Une famille compatible de classes de degré $0$ est donc une suite réelle $(a_j)_{j \in \mathbb N}$, c'est-à-dire une fonction localement constante sur $U$ : $H^0(U)$ s'y lit entier. La famille $c_m = (m, \dots, m)$, en revanche, n'est pas compatible, la restriction de $c_{m+1}$ valant $(m + 1, \dots, m + 1) \neq c_m$.
    - |
      Recoller des primitives demande de les choisir compatibles, et c'est la difficulté que le point (iii) contourne. Pour $\omega = dx$ sur $\mathbb R$ et $U_m = \,]{-m}, m[$, chaque restriction est exacte, de primitive $f_m(x) = x + m$ ; mais $f_{m+1} - f_m = 1$ sur $U_m$, et ces primitives ne se recollent pas. Il faut les corriger l'une après l'autre, ici en prenant $f_m(x) = x$ ; c'est immédiat parce que les $U_m$ sont connexes, de sorte que $f_{m+1} - f_m$ est constante. Si deux composantes de $U_m$ étaient dans une même composante de $U_{m+1}$, cette différence, seulement localement constante, ne se prolongerait pas toujours, et en degré $k \geqslant 2$ deux primitives diffèrent d'une forme fermée qui n'est pas toujours exacte : c'est là que servent la dimension finie des [[cochaine-cech|cochaînes de Čech]] et le point de norme minimale du point (ii).
    - |
      Les familles compatibles ont un analogue pour les formes linéaires, qui sert à passer à la limite dans la dualité. Plus loin, au nœud {{pc-dualite|Dualité de Poincaré}}, une forme linéaire $\lambda$ sur $H^{n-k}_c(U)$ est découpée en la suite compatible de ses composées $\lambda_m = \lambda \circ j_*$ avec les extensions par zéro depuis les $U_m$ ; la dualité sur chaque $U_m$ associe à cette suite une famille compatible de classes, dont le point (iii) fait une classe de $H^k(U)$. Pour la réunion d'intervalles du premier exemple, on obtient ainsi que le dual de $H^1_c(U)$ est, comme $H^0(U)$, l'espace $\mathbb R^{\mathbb N}$ des suites réelles.

  extension-par-zero:
    - |
      L'extension par zéro n'est une forme lisse que grâce à la compacité du [[support-forme|support]]. Soit $V = \,]0, 1[ \subset U = \mathbb R$ et $\eta = g(x)\,dx$, où $g(x) = \theta\big(1 - 16(x - \frac12)^2\big)$, avec la fonction $\theta$ du nœud {{dr-plateau|Fonctions plateau}}, est une [[fonction-plateau|fonction plateau]], strictement positive sur $]\frac14, \frac34[$ et nulle ailleurs. Le support de $\eta$ est $[\frac14, \frac34]$, compact dans $V$ : son extension $j_*\eta$ est de classe $C^\infty$ sur $\mathbb R$, nulle hors de $[\frac14, \frac34]$, et $\int_{\mathbb R} j_*\eta = \int_V \eta$ (point (ii)). Pour $\eta = dx$ sur $V$, dont le support est $V$ tout entier, non compact, la forme égale à $dx$ sur $]0, 1[$ et à $0$ ailleurs a un coefficient discontinu en $0$ et en $1$ : ce n'est pas une forme différentielle sur $\mathbb R$.
      ```schema lex-extension-par-zero-1
      En bleu, le coefficient de $j_*\eta$ pour la bosse $\eta$, à support compact dans $]0, 1[$, prolongée sans heurt par $0$. En rouge, celui de la forme égale à $dx$ sur $]0, 1[$ et à $0$ ailleurs : il saute en $0$ et en $1$, où il vaut $0$ (points pleins), faute d'un support compact.
      ```
    - |
      La compacité du support est suffisante, non nécessaire, et l'extension dépend de l'ouvert d'arrivée. Avec la fonction $\theta$ du nœud {{dr-plateau|Fonctions plateau}}, la forme $\theta(x)\,dx$ sur $V = \,]0, 1[$ a pour support $V$, non compact. La forme égale à $\theta(x)\,dx$ sur $V$ et à $0$ ailleurs est pourtant, sur $]{-\infty}, 1[$, la forme $\theta(x)\,dx$, de classe $C^\infty$, puisque $\theta$ est nulle sur $]{-\infty}, 0]$ ; sur $\mathbb R$, en revanche, son coefficient saute en $1$, où $\theta(1) = e^{-1} \neq 0$.
    - |
      L'extension par zéro fait aller les classes du petit ouvert vers le grand, en sens inverse de la restriction. Pour $V = \,]0, 1[ \subset U = \mathbb R$, elle envoie la classe de la bosse du premier exemple dans $H^1_c(V)$ sur celle de sa prolongée dans $H^1_c(\mathbb R)$, avec la même intégrale. Plus loin, au nœud {{pc-fibre|Poincaré à support compact}}, (iv), l'intégrale identifiera $H^1_c(]0, 1[)$ et $H^1_c(\mathbb R)$ à $\mathbb R$ : l'extension $j_* : H^1_c(]0, 1[) \to H^1_c(\mathbb R)$ est alors un isomorphisme, alors que la restriction des formes quelconques de $\mathbb R$ à $]0, 1[$ va dans l'autre sens.

  cochaine-cech:
    - |
      En degré $0$, les cocycles de Čech sont les fonctions constantes sur les paquets de cubes qui se rencontrent. Pour deux cubes $B_1$ et $B_2$, une cochaîne $c$ de degré $0$ est une fonction sur $N_0 = \{(1), (2)\}$, et $(\delta c)(i_0, i_1) = c(i_1) - c(i_0)$. Si $B_1 \cap B_2 \neq \varnothing$, la suite $(1, 2)$ est dans le [[nerf-recouvrement|nerf]], et $c$ est un [[cocycle-complexe|cocycle]] si et seulement si $c(1) = c(2)$ : $H^0(\check C) \cong \mathbb R$. Si les cubes sont disjoints, $N_1 = \{(1, 1), (2, 2)\}$, $\delta c = 0$ pour toute $c$, et $H^0(\check C) \cong \mathbb R^2$, comme $H^0(B_1 \cup B_2)$ en cohomologie de de Rham.
    - |
      Le nerf ordonné contient les suites à répétitions, et un cocycle de degré $1$ y est automatiquement alterné. Pour $(i, j) \in N_1$, les suites $(i, i, i)$ et $(i, j, i)$ sont dans $N_2$, puisque $B_i \cap B_j \cap B_i = B_i \cap B_j$, et si $\delta c = 0$,
      $$\begin{aligned} (\delta c)(i, i, i) &= c(i, i) = 0, \\ (\delta c)(i, j, i) &= c(j, i) - c(i, i) \\ &\quad + c(i, j) = 0, \end{aligned}$$
      d'où $c(j, i) = -c(i, j)$. Ce sont les propriétés des nombres $a_{ij}$ du nœud {{dr-cocycle|Périodes locales}}, (iv), qui forment, comme le signale la première remarque du nœud {{dt-cech-de-rham|Čech-de Rham}}, un $1$-cocycle de Čech.
    - |
      Pour une famille finie de cubes, les cochaînes de Čech forment des espaces de dimension finie, contrairement aux formes : sur un ouvert non vide $U$ de $\mathbb R^n$, $n \geqslant 1$, les fonctions $1, x_1, x_1^2, \dots$ sont linéairement indépendantes, un polynôme nul sur un intervalle ouvert étant nul, et $\Omega^0(U)$ n'est pas de dimension finie. Pour deux cubes qui se rencontrent, $N_p$ est formé de toutes les suites de $p + 1$ termes pris dans $\{1, 2\}$ : il en a $2^{p+1}$, et $\check C^p \cong \mathbb R^{2^{p+1}}$. Plus loin, au nœud {{pc-limite|Passage à la limite}}, cette finitude permet de remplacer chaque choix par le point de norme minimale d'un sous-espace affine de cochaînes, et de passer sans axiome du choix des réunions finies de cubes à l'ouvert tout entier.

  cohomologie-singuliere-lisse:
    - |
      En degré $0$, la cohomologie singulière lisse compte les morceaux de l'ouvert, comme la cohomologie de de Rham. Sur $U = \mathbb R \setminus \{0\}$, une cochaîne $f$ de degré $0$, fonction sur les points, est un [[cocycle-complexe|cocycle]] si et seulement si $f(\sigma(e_1)) = f(\sigma(e_0))$ pour tout simplexe lisse $\sigma$ de dimension $1$. Les segments contenus dans $U$ étant des simplexes lisses, $f$ est constante sur chacune des demi-droites ; réciproquement, l'image d'un simplexe, connexe, ne rencontre qu'une des deux, et toute fonction constante sur chacune est un cocycle. Comme il n'y a pas de cobord en degré $0$, $H^0_\infty(U) \cong \mathbb R^2$.
    - |
      En degré $1$, l'intégrale d'une forme fermée non exacte donne une classe non nulle. Sur $U = \mathbb R^2 \setminus \{0\}$, la cochaîne $f(\sigma) = \int_\sigma \omega_0$, avec $\omega_0 = \frac{x\,dy - y\,dx}{x^2 + y^2}$, est un cocycle : pour un simplexe lisse $\gamma$ de dimension $2$, $(\delta f)(\gamma) = \int_{\partial\gamma} \omega_0 = \int_\gamma d\omega_0 = 0$, par la formule de Stokes ({{dt-simplexes|Simplexes lisses}}, (iii)). Si l'on avait $f = \delta g$, on aurait $f(z) = g(\partial z) = 0$ pour tout cycle $z$ ; or la somme $z$ des quatre segments qui font le tour du carré $[-1, 1]^2$ est un cycle, et $f(z) = 2\pi$ ({{gd-integrale-curviligne|Intégrale d'une 1-forme}}, remarque). Donc $H^1_\infty(U) \neq \{0\}$.
    - |
      Sur un convexe, les cobords sont donnés par une formule. Sur $B = \mathbb R$, la cochaîne $f(\sigma) = \int_\sigma dx = \sigma(e_1) - \sigma(e_0)$ est un cocycle de degré $1$. La formule du point (iv) du nœud {{dt-cochaines|Cochaînes lisses}}, avec le point $b$ et $q = 1$ impair, donne $g = f \circ P$, où $P$ envoie un point $x$ sur le segment qui va de $b$ à $x$ : $g(x) = x - b$, et l'on vérifie que $\delta g(\sigma) = \sigma(e_1) - \sigma(e_0) = f(\sigma)$. Plus loin, le nœud {{dt-theoreme|De Rham en tout degré}} montrera que $H^k_\infty(U)$ est isomorphe à $H^k(U)$ en cohomologie de de Rham ; pour $U = \mathbb R^2 \setminus \{0\}$, la classe du deuxième exemple engendre donc $H^1_\infty(U)$, qui est de dimension $1$.

  integration-cochaines:
    - |
      En degré $0$, l'égalité $I(df) = \delta I(f)$ est le théorème fondamental de l'analyse. L'intégrale d'une fonction sur un simplexe de dimension $0$ est sa valeur en ce point, de sorte que $I(f)$ est la fonction $f$ vue sur les points ; pour un simplexe lisse $\sigma$ de dimension $1$, $\delta I(f)(\sigma) = f(\sigma(e_1)) - f(\sigma(e_0))$, qui est bien $\int_\sigma df$. Pour $f(x) = x^2$ sur $\mathbb R$ et le segment $\sigma = [1, 3]$, les deux membres valent $9 - 1 = 8 = \int_1^3 2x\,dx$.
    - |
      L'intégration est injective sur les formes de degré $1$, mais elle n'est pas surjective sur les cochaînes. Si $\int_\sigma \omega = 0$ pour tout simplexe lisse $\sigma$ de dimension $1$, alors, pour le segment $\sigma_t = [x, x + te_j]$,
      $$\frac1t\int_{\sigma_t} \omega = \frac1t\int_0^t \omega_{x + se_j}(e_j)\,ds,$$
      qui tend vers $\omega_x(e_j)$ quand $t \to 0$ : ainsi $\omega = 0$. En revanche, pour le simplexe constant $\kappa$ égal à un point, le chemin $\kappa \circ q_1$ est constant, et $I(\omega)(\kappa) = 0$ pour toute forme $\omega$ ; la cochaîne qui vaut $1$ sur tout simplexe de dimension $1$ n'est donc l'image d'aucune forme. Ainsi, l'intégration est un morphisme de complexes injectif, mais pas un isomorphisme de complexes.
    - |
      Sur les triangles, l'intégration de $dx \wedge dy$ donne l'aire orientée, et l'égalité $I(d\omega) = \delta I(\omega)$ la calcule par les côtés. Pour le triangle $\sigma = [p_0, p_1, p_2]$, de sommets $p_0 = (0, 0)$, $p_1 = (2, 0)$, $p_2 = (1, 3)$, le déterminant de la matrice jacobienne de $\sigma \circ q_2$ vaut $6s$, et $I(dx \wedge dy)(\sigma) = \int_{I^2} 6s = 3$. Pour $\omega = x\,dy$, l'intégrale sur le segment qui va de $(a, b)$ à $(a', b')$ vaut $\frac12(a + a')(b' - b)$, d'où les valeurs $\frac92$, $\frac32$ et $0$ sur $[p_1, p_2]$, $[p_0, p_2]$ et $[p_0, p_1]$, et
      $$\delta I(\omega)(\sigma) = \frac92 - \frac32 + 0 = 3.$$
      Plus loin, au nœud {{dt-theoreme|De Rham en tout degré}}, l'intégration induit un isomorphisme en cohomologie, bien qu'elle ne soit pas surjective sur les cochaînes.
      ```schema lex-integration-cochaines-3
      Le triangle de sommets $p_0$, $p_1$, $p_2$, d'aire $3$, et son bord $[p_1, p_2] - [p_0, p_2] + [p_0, p_1]$, en rouge, avec le sens de parcours que donnent les signes. Les nombres portés sur les côtés sont les intégrales de $x\,dy$ dans ce sens : leur somme est l'aire.
      ```

  complexe-total:
    - |
      Le signe $(-1)^p$ est indispensable. Pour le complexe double carré du premier exemple de [[complexe-double|complexe double]], où $\delta$ et $d$ sont l'identité de $\mathbb R$, la différentielle sans signe $D' = \delta + d$ envoie $x \in K^{0,0}$ sur $(x, x)$, puis ce couple sur $x + x$ dans $K^{1,1}$ : $D'D'x = 2x \neq 0$, et $(\operatorname{Tot} K, D')$ n'est pas un complexe. Avec le signe, $D(a, b) = b - a$, et $DD = 0$ : les deux chemins de $K^{0,0}$ à $K^{1,1}$, par la droite puis le haut, ou par le haut puis la droite, se compensent au lieu de s'ajouter.
    - |
      Les cocycles du complexe total recollent des données de plusieurs colonnes. Pour le complexe double à deux colonnes de Mayer-Vietoris (troisième exemple de [[complexe-double|complexe double]]), un élément de $\operatorname{Tot}^1$ est un triplet $(\alpha, \beta, g)$, où $\alpha \in \Omega^1(U)$, $\beta \in \Omega^1(V)$ et $g \in \Omega^0(U \cap V)$. C'est un cocycle si et seulement si $d\alpha = 0$, $d\beta = 0$ et
      $$\alpha|_{U \cap V} - \beta|_{U \cap V} = dg :$$
      deux formes fermées dont la différence sur l'intersection a une primitive donnée. Pour $\mathbb R^2 \setminus \{0\} = U \cup V$, comme dans le deuxième exemple de [[suite-mayer-vietoris-formes|suite de Mayer-Vietoris]], le triplet $(0, 0, \eta)$, avec $\eta$ égale à $1$ sur $\{x_1 > 0\}$ et à $0$ sur $\{x_1 < 0\}$, est un cocycle ; il n'est pas un cobord, puisque $D(f_U, f_V) = (df_U, df_V, f_U - f_V)$ ne vaut $(0, 0, \eta)$ que si $f_U$ et $f_V$ sont constantes, $U$ et $V$ étant étoilés, donc connexes, et de différence $\eta$, qui ne l'est pas.
    - |
      Le signe peut être porté par l'une ou l'autre différentielle. Le complexe double transposé, où $d$ et $\delta$ échangent leurs rôles, a pour différentielle totale $D^\top = d + (-1)^q\delta$ sur $K^{p,q}$, et l'application $\varphi$, multiplication par $(-1)^{pq}$ sur $K^{p,q}$, vérifie $\varphi D = D^\top\varphi$. Sur le complexe carré du premier exemple de [[complexe-double|complexe double]], seule la composante $K^{1,1}$ change de signe, et l'on vérifie que $\varphi D(a, b) = a - b = D^\top(a, b)$, puisque $D^\top$ envoie $(a, b)$ sur $a - b$. Plus loin, au nœud {{dt-theoreme|De Rham en tout degré}}, l'intégration des formes, composante par composante, induit un morphisme entre deux complexes totaux, et c'est sur eux que se lit l'isomorphisme de de Rham.

  subdivision-adaptee-chemin:
    - |
      Une subdivision adaptée découpe le chemin en morceaux assez courts pour tenir chacun dans une boule où la forme a une primitive. Soit $\omega_0 = \frac{x\,dy - y\,dx}{x^2 + y^2}$ sur $U = \mathbb R^2 \setminus \{0\}$, [[forme-fermee|fermée]], et le cercle $\gamma(s) = (\cos 2\pi s, \sin 2\pi s)$, $s \in [0, 1]$. Avec $s_k = \frac k8$, l'arc $\gamma([0, \frac18])$ tient dans la boule $B_\infty\big((1, \frac14), \frac12\big) = \mathopen]\frac12, \frac32\mathclose[ \times \mathopen]{-\frac14}, \frac34\mathclose[$, et les sept autres arcs dans ses images par les symétries du carré $[-1, 1]^2$, qui ne rencontrent pas l'origine.

      Chacune de ces boules est contenue dans l'un des demi-plans $\{x > 0\}$ ou $\{x < 0\}$, où $\arctan(y/x)$ est une primitive, comme dans le deuxième exemple de [[primitive-forme|primitive]], ou dans l'un des demi-plans $\{y > 0\}$ ou $\{y < 0\}$, où $-\arctan(x/y)$ en est une, par le même calcul. Les huit termes de la somme valent chacun $\frac\pi4$, ainsi $\arctan 1 - \arctan 0$ pour le premier arc, et
      $$\int_\gamma \omega_0 = 8 \cdot \frac\pi4 = 2\pi.$$
      Les quatre quarts de cercle, $s_k = \frac k4$, n'auraient pas suffi : une boule $\mathopen]a, b\mathclose[ \times \mathopen]c, d\mathclose[$ qui contient le premier, donc $(1, 0)$ et $(0, 1)$, vérifie $a < 0 < b$ et $c < 0 < d$, et contient l'origine.
      ```schema lex-subdivision-adaptee-chemin-1
      Le cercle est découpé en huit arcs, aux points rouges $\gamma(s_k)$ ; chaque arc tient dans une boule pour la norme du maximum, un carré, qui évite l'origine. Le carré bleu contient l'arc $\gamma([0, \frac18])$, et les carrés gris, ses images par les symétries du carré, contiennent les sept autres.
      ```
    - |
      L'intégrale du nœud ne vaut que pour une forme fermée, et une subdivision adaptée n'existe pas sans cette hypothèse. Pour $\omega = x\,dy$ sur $\mathbb R^2$, aucune boule ne porte de primitive, comme le montre le théorème de Schwarz dans le troisième exemple de [[primitive-forme|primitive]] : quel que soit le chemin $\gamma : [a, b] \to \mathbb R^2$, aucune suite $s_0 < \cdots < s_m$ ne peut être munie de boules et de primitives, et la conclusion d'existence du point (i) tombe. Pour un chemin de classe $C^1$, l'intégrale du nœud {{gd-integrale-curviligne|Intégrale d'une 1-forme}} a pourtant un sens : elle ne passe pas par des primitives.
    - |
      Seules les valeurs du chemin aux points de la subdivision interviennent, ce qui permet d'intégrer le long d'un chemin qui n'est pas de classe $C^1$ par morceaux. Soit $\gamma(s) = (s, s\sin\frac1s)$ pour $s \in \,]0, 1]$ et $\gamma(0) = (0, 0)$ : ce chemin est continu, puisque $|s\sin\frac1s| \leqslant s$, mais la dérivée de sa seconde coordonnée, $\sin\frac1s - \frac1s\cos\frac1s$, n'est bornée sur aucun intervalle $]0, \varepsilon]$, et l'intégrale du nœud {{gd-integrale-curviligne|Intégrale d'une 1-forme}} ne s'applique pas. Pour la forme fermée $\omega = y\,dx + x\,dy = d(xy)$, la boule $B_\infty(0, 2)$ contient tout le chemin, et la subdivision réduite à $s_0 = 0$, $s_1 = 1$ donne
      $$\int_\gamma \omega = 1 \cdot \sin 1 - 0 = \sin 1.$$
      Plus loin, au nœud {{dr-homotopie|Invariance par homotopie}}, le même découpage est fait sur un carré, et l'intégrale devient un invariant d'homotopie.

  support-forme:
    - |
      Le support dépend de l'ouvert sur lequel on regarde la forme, puisque l'[[adherence|adhérence]] y est prise. Avec la fonction $\theta$ du nœud {{dr-plateau|Fonctions plateau}}, la forme $\omega = \theta(1 - x^2)\,dx$ ne s'annule qu'en dehors de $]{-1}, 1[$. Sur $\mathbb R$, son support est le segment $[-1, 1]$, [[compact]]. Sur l'ouvert $U = \,]{-1}, 1[$, la même formule définit une forme dont le support est l'adhérence de $]{-1}, 1[$ dans $U$, c'est-à-dire $U$ tout entier, qui n'est pas compact : la forme n'est pas à support compact dans $U$.
      ```schema lex-support-forme-1
      Le coefficient $\theta(1 - x^2)$ de $\omega$, en bleu, strictement positif sur $]{-1}, 1[$ et nul ailleurs. Sur $\mathbb R$, le support est le segment fermé $[-1, 1]$, en rouge ; dans l'ouvert $]{-1}, 1[$, dont les extrémités grises sont exclues, ce serait l'ouvert entier, qui n'est pas compact.
      ```
    - |
      Le support de $d\omega$ est contenu dans celui de $\omega$, et peut être bien plus petit. Sur $\mathbb R$, soit
      $$\rho(x) = \frac{\theta(2 - x)}{\theta(2 - x) + \theta(x - 1)},$$
      égale à $1$ sur $]{-\infty}, 1]$ et à $0$ sur $[2, +\infty[$, de dénominateur strictement positif. Son support est $]{-\infty}, 2]$, qui n'est pas compact ; celui de $d\rho = \rho'\,dx$ est contenu dans $[1, 2]$, puisque $\rho$ est constante sur $]{-\infty}, 1[$ et sur $]2, +\infty[$. Une forme exacte peut ainsi être à support compact sans que ses primitives le soient. Dans le cas limite d'une fonction constante non nulle, le support est $\mathbb R$ et celui de sa différentielle est vide.
    - |
      Dans $U = \mathbb R^n \setminus \{0\}$, une fonction nulle hors d'une boule n'est pas pour autant à support compact. Avec la fonction $\rho$ de l'exemple précédent, $f(x) = \rho(|x|)$ est égale à $1$ près de l'origine : son support dans $U$ est $\{0 < |x| \leqslant 2\}$, qui n'est pas compact, l'origine lui manquant. Le support de $df$ est contenu dans la partie $\{1 \leqslant |x| \leqslant 2\}$, fermée et bornée, donc compacte, et contenue dans $U$. Plus loin, au nœud {{pc-finie|Dualité, cas fini}}, cette forme $df$, exacte, donnera pour $n \geqslant 3$ une classe non nulle de $H^1_c(U)$, alors que $H^1(U) = \{0\}$.
