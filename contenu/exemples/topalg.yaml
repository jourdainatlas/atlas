# Exemples du lexique : théorie « Topologie algébrique » (topalg).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  groupe-fondamental:
    - |
      Le groupe fondamental d'une [[partie-convexe|partie convexe]] $C$ de $\mathbb R^n$ est trivial, en tout point $x$ de $C$. Si $\gamma$ est un [[lacet]] en $x$ dans $C$, posons
      $$H(s, t) = (1 - t)\,\gamma(s) + t\,x.$$
      C'est une application continue de $[0, 1]^2$ dans $\mathbb R^n$, par sommes et produits de fonctions continues ({{ta-chemins|Chemins}}, (ii)), et elle prend ses valeurs dans $C$ par convexité. Elle vaut $\gamma$ pour $t = 0$, le lacet constant $c_x$ pour $t = 1$, et $x$ en $s = 0$ et $s = 1$ : c'est une [[homotopie-chemins|homotopie]] de $\gamma$ à $c_x$, et $[\gamma]$ est le neutre.
    - |
      La loi du groupe porte sur les classes, et non sur les lacets eux-mêmes, qui ne forment pas un groupe pour la concaténation. Pour trois lacets $\gamma$, $\delta$, $\varepsilon$ en $x$, le lacet $(\gamma \cdot \delta) \cdot \varepsilon$ parcourt $\gamma$ sur $[0, \frac14]$, alors que $\gamma \cdot (\delta \cdot \varepsilon)$ le parcourt sur $[0, \frac12]$ : en $s = \frac14$, le premier vaut $\gamma(1) = x$ et le second $\gamma(\frac12)$, qui en diffère en général. De même, $\gamma \cdot \bar\gamma$ n'est pas le lacet constant, mais seulement homotope à lui. C'est en passant au quotient par l'homotopie que l'associativité et les inverses apparaissent.
    - |
      Plus loin, le nœud {{ta-cercle|Le groupe fondamental du cercle}} montrera que le groupe fondamental du cercle est isomorphe à $\mathbb Z$, par le nombre de tours d'un lacet. Le lacet qui fait une fois le tour du cercle n'est donc pas homotope au lacet constant, contrairement à ce qui se passe dans une partie convexe : le groupe fondamental détecte le trou.

  lacet:
    - |
      L'application $\delta(s) = (\cos \pi s, \sin \pi s)$ est un [[chemin]] de $(1, 0)$ à $(-1, 0)$ dans $\mathbb R^2$, qui parcourt le demi-cercle supérieur : ce n'est pas un lacet, ses extrémités étant distinctes. Le chemin $\delta'(s) = (\cos \pi(1 + s), \sin \pi(1 + s))$ parcourt le demi-cercle inférieur, de $(-1, 0)$ à $(1, 0)$. Leur concaténation vaut, pour $s \leqslant \frac12$ comme pour $s \geqslant \frac12$,
      $$(\delta \cdot \delta')(s) = (\cos 2\pi s, \sin 2\pi s).$$
      C'est un lacet en $(1, 0)$, obtenu en mettant bout à bout deux chemins dont aucun n'est un lacet.
    - |
      La continuité exigée d'un lacet dépend de la topologie de l'espace. Si $X = \{x, y\}$ est muni de la topologie grossière, toute application de $[0, 1]$ dans $X$ est continue, puisque les seules images réciproques à examiner sont celles de $\varnothing$ et de $X$. L'application qui vaut $x$ en $0$, en $1$ et aux rationnels, et $y$ ailleurs, est donc un lacet en $x$. Dans un espace aussi pauvre en ouverts, la condition de continuité ne retient presque rien de l'idée de courbe.
    - |
      Les applications $\gamma(s) = (\cos 2\pi s, \sin 2\pi s)$ et $\gamma_2(s) = (\cos 4\pi s, \sin 4\pi s)$ sont deux lacets en $(1, 0)$, à valeurs dans le cercle unité $\{(x, y) : x^2 + y^2 = 1\}$, qui en font une fois et deux fois le tour. Ils ont la même image, le cercle, sans être égaux : un lacet est une application, et non la courbe qu'il parcourt. Plus loin, le nœud {{ta-cercle|Le groupe fondamental du cercle}} montrera que, vus comme lacets du cercle, ils ne sont même pas homotopes ; vus dans $\mathbb R^2$, qui est convexe, ils le sont au contraire, comme tout lacet de $\mathbb R^2$.
