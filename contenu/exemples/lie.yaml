# Exemples du lexique : théorie « Groupes de Lie » (lie).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  groupe-lie:
    - |
      Deux groupes de Lie peuvent être isomorphes à la fois comme groupes et comme variétés. Le [[groupe-lineaire|groupe linéaire]] $GL_1(\mathbb R) = \mathbb R \setminus \{0\}$ est un groupe de Lie pour le produit ({{li-definition|Groupes de Lie}}, (ii)), et sa partie $]0, +\infty[$ aussi : c'est un ouvert de $\mathbb R$, donc une [[variete-differentiable|variété]] ({{gd-exemples-varietes|Exemples de variétés}}, (i)), sur lequel le produit et $x \mapsto \frac1x$ sont de classe $C^\infty$. L'[[exponentielle]] est un morphisme de $(\mathbb R, +)$ sur $(]0, +\infty[, \times)$, puisque $e^{s+t} = e^se^t$, et une bijection de classe $C^\infty$ dont la réciproque, le [[logarithme]], est de classe $C^\infty$ : c'est un isomorphisme de groupes et un [[diffeomorphisme|difféomorphisme]].
    - |
      Un [[groupe-topologique|groupe topologique]] n'est pas toujours un groupe de Lie. Le groupe $(\mathbb Q, +)$, muni de la [[topologie-induite|topologie induite]] par $\mathbb R$, est un groupe topologique, comme sous-groupe de $(\mathbb R, +)$, qui en est un ({{li-definition|Groupes de Lie}}, (i) et (ii) ; remarque du nœud {{gt-definition|Groupe topologique}}). Ses seules parties [[connexe|connexes]] non vides sont les singletons : si $p < p'$ sont dans une partie $C$, le réel $r = p + (p' - p)/\sqrt 2$ est irrationnel, puisque $\sqrt 2$ ne l'est pas ({{q-irrationnel|Irrationalité de √2}}, (i)), et $C \cap \,]{-\infty}, r[$, $C \cap \,]r, +\infty[$ partagent $C$ en deux ouverts non vides.

      Une [[carte]] de dimension $d$ en un point $q$ serait un [[homeomorphisme|homéomorphisme]] d'un ouvert $U \ni q$ de $\mathbb Q$ sur un ouvert de $\mathbb R^d$. Pour $d = 0$, $U$ serait le singleton $\{q\}$, qui n'est pas ouvert dans $\mathbb Q$. Pour $d \geqslant 1$, l'ouvert image contiendrait un segment, connexe et non réduit à un point ({{tr-connexes|Parties connexes de ℝ}}, {{t-connexe-prop|Images de connexes}}, (i)), dont l'image réciproque dans $U$ serait connexe à au moins deux points. Aucune structure de variété n'existe donc sur $\mathbb Q$.
    - |
      Un groupe de Lie peut ne pas être commutatif dès la dimension $2$. Les transformations $x \mapsto ax + b$ de $\mathbb R$, avec $a > 0$, s'identifient aux couples $(a, b)$ de l'ouvert $]0, +\infty[ \times \mathbb R$ de $\mathbb R^2$. La composée de $x \mapsto a'x + b'$ puis de $x \mapsto ax + b$ est $x \mapsto aa'x + ab' + b$, d'où la loi et l'inversion
      $$\begin{aligned} (a, b)(a', b') &= (aa', ab' + b), \\ (a, b)^{-1} &= \Big(\frac1a, -\frac ba\Big), \end{aligned}$$
      de classe $C^\infty$ sur l'ouvert : c'est un groupe de Lie de dimension $2$. Il n'est pas commutatif, puisque $(2, 0)(1, 1) = (2, 2)$ et $(1, 1)(2, 0) = (2, 1)$. L'application $(a, b) \mapsto \begin{pmatrix} a & b \\ 0 & 1 \end{pmatrix}$ en fait un sous-groupe de $GL_2(\mathbb R)$, comme le montre le produit de deux telles matrices. Plus loin, le théorème de Cartan-von Neumann ({{li-cartan|Cartan-von Neumann}}) fera de tout sous-groupe fermé de $GL_n(\mathbb R)$ un groupe de Lie.

  algebre-lie:
    - |
      L'algèbre de Lie ne voit pas les éléments qui ne sont pas des exponentielles. Le [[groupe-orthogonal|groupe orthogonal]] $O(2)$ est fermé dans $GL_2(\mathbb R)$, image réciproque de $\{I\}$ par l'application continue $A \mapsto {}^tAA$, et $SO(2)$, fermé dans $O(2)$ ({{li-definition|Groupes de Lie}}, (iii)), l'est aussi. Par le point (iii) du nœud {{li-algebre|Algèbre de Lie}}, l'algèbre de Lie de $O(2)$ est l'espace des matrices antisymétriques, la droite $\mathbb RJ$, où $J = \begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}$.

      Celle de $SO(2)$, contenue dans la précédente, lui est égale : pour $s$ réel, $e^{tsJ}$ est dans $O(2)$, et $\det e^{tsJ} = e^{t\operatorname{tr}(sJ)} = 1$ par la formule de Liouville ({{ed-lineaires|Systèmes linéaires}}, (iii)). Les symétries de $O(2)$, de déterminant $-1$, ne sont l'[[exponentielle-matrice|exponentielle]] d'aucune matrice, puisque $\det e^A = e^{\operatorname{tr}A} > 0$ : deux groupes distincts ont ici la même algèbre de Lie.
    - |
      L'algèbre de Lie est stable par crochet, mais pas par produit. Pour $O(2)$, la matrice $J$ est antisymétrique, mais $J^2 = -I$ ne l'est pas. Pour $SL_2(\mathbb R)$, dont l'algèbre de Lie est l'espace des matrices de [[trace]] nulle ({{li-algebre|Algèbre de Lie}}, (iii)), les matrices
      $$E = \begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}, \qquad F = \begin{pmatrix} 0 & 0 \\ 1 & 0 \end{pmatrix}$$
      sont de trace nulle, mais leur produit $EF$, nul sauf un $1$ en haut à gauche, est de trace $1$. Leur [[crochet-matrices|crochet]] $[E, F] = EF - FE$ vaut $\operatorname{diag}(1, -1)$, de trace nulle, comme le veut le point (ii).
    - |
      La condition « pour tout $t$ » ne peut pas être affaiblie en « pour $t = 1$ ». Pour le sous-groupe fermé $G = \{I\}$, une matrice $A$ telle que $e^{tA} = I$ pour tout $t$ vérifie $A = 0$, en dérivant en $t = 0$ ({{ed-lineaires|Systèmes linéaires}}, (ii)) : l'algèbre de Lie est $\{0\}$. L'ensemble des $A$ telles que $e^A = I$ contient en revanche $2\pi J$, puisque $e^{tJ}$ est la rotation d'angle $t$ (remarque du nœud {{li-exponentielle|Exponentielle}}), mais pas $\pi J$, dont l'exponentielle est $-I$ : ce n'est pas un sous-espace vectoriel. Plus loin, le théorème de Cartan-von Neumann ({{li-cartan|Cartan-von Neumann}}) fera de $\dim\mathfrak g$ la dimension de $G$ : $0$ pour $\{I\}$, $1$ pour $SO(2)$.

  groupe-orthogonal:
    - |
      Le groupe orthogonal du plan est formé de rotations et de symétries. Une matrice $A$ vérifie ${}^tAA = I$ si et seulement si ses colonnes sont de norme $1$ et orthogonales pour le [[produit-scalaire-usuel|produit scalaire usuel]]. La première colonne $(a, b)$ vérifie donc $a^2 + b^2 = 1$, et la seconde, unitaire et orthogonale à $(a, b)$, est $\pm(-b, a)$, les vecteurs orthogonaux à $(a, b)$ formant la droite engendrée par $(-b, a)$. Les éléments de $O(2)$ sont ainsi
      $$R = \begin{pmatrix} a & -b \\ b & a \end{pmatrix}, \qquad S = \begin{pmatrix} a & b \\ b & -a \end{pmatrix},$$
      avec $\det R = 1$ et $\det S = -1$ : les premières forment $SO(2)$, et les secondes vérifient $S^2 = I$.
      ```schema lex-groupe-orthogonal-1
      Un triangle de sommets numérotés $1$, $2$, $3$, en gris, son image par la rotation d'angle $\pi/3$, en bleu, et son image par la symétrie $S$ d'axe la droite pointillée, d'angle $\pi/6$, en vert. La rotation conserve le sens dans lequel on parcourt $1$, $2$, $3$ ; la symétrie l'inverse.
      ```
    - |
      Aucune des conditions partielles qui viennent à l'esprit ne suffit. La matrice de colonnes $(1, 0)$ et $(\frac35, \frac45)$ a des colonnes de norme $1$, mais elle n'est pas orthogonale : les images des deux premiers vecteurs de base ont pour produit scalaire $\frac35$, au lieu de $0$, et son [[determinant|déterminant]] vaut $\frac45$. La matrice $\begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}$ est de déterminant $1$ sans être orthogonale, et $2I$ conserve l'orthogonalité sans conserver les normes.
    - |
      Le groupe orthogonal est [[compact]], et l'appartenance de $-I$ à $SO(n)$ dépend de la parité de $n$. $O(n)$ est fermé dans $\mathcal M_n(\mathbb R)$, image réciproque de $\{I\}$ par l'application continue $A \mapsto {}^tAA$, et borné, chaque coefficient étant au plus $1$ en valeur absolue, puisque les colonnes sont de norme $1$ : il est compact ({{me-rn|L'espace ℝⁿ}}, (iii)). On a $\det(-A) = (-1)^n\det A$. Pour $n$ impair, $-I \notin SO(n)$, et toute $A \in O(n)$ de déterminant $-1$ s'écrit $-B$ avec $B = -A \in SO(n)$. Pour $n$ pair, $-I \in SO(n)$, et c'est $\operatorname{diag}(-1, 1, \dots, 1)$ qui est hors de $SO(n)$. Plus loin, l'algèbre de Lie de $O(n)$ sera l'espace des matrices antisymétriques, de dimension $\frac{n(n-1)}2$ ({{li-algebre|Algèbre de Lie}}, (iii)).

  crochet-matrices:
    - |
      Le crochet de deux matrices est toujours de trace nulle. Comme $\operatorname{tr}(AB) = \operatorname{tr}(BA)$ ({{v-trace|Trace}}), on a $\operatorname{tr}[A, B] = 0$ pour toutes matrices $A$ et $B$ : aucune paire ne vérifie $AB - BA = I$, dont la trace vaut $n$. Pour les matrices $E$ et $F$ d'ordre $2$, nulles sauf un $1$ en position $(1, 2)$, respectivement $(2, 1)$, et $H = \operatorname{diag}(1, -1)$, on calcule
      $$\begin{aligned} [H, E] &= 2E, \\ [H, F] &= -2F, \\ [E, F] &= H. \end{aligned}$$
    - |
      Le crochet n'est pas associatif, et, sur les matrices antisymétriques d'ordre $3$, il devient le produit vectoriel. Les matrices
      $$\begin{aligned} L_1 &= \begin{pmatrix} 0 & 0 & 0 \\ 0 & 0 & -1 \\ 0 & 1 & 0 \end{pmatrix}, \\ L_2 &= \begin{pmatrix} 0 & 0 & 1 \\ 0 & 0 & 0 \\ -1 & 0 & 0 \end{pmatrix}, \\ L_3 &= \begin{pmatrix} 0 & -1 & 0 \\ 1 & 0 & 0 \\ 0 & 0 & 0 \end{pmatrix} \end{aligned}$$
      vérifient $[L_1, L_2] = L_3$, $[L_2, L_3] = L_1$ et $[L_3, L_1] = L_2$, et $e^{tL_1}$ fixe le premier vecteur de base et agit sur les deux autres par la rotation d'angle $t$, puisque $L_1$ y agit comme $J$ (remarque du nœud {{li-exponentielle|Exponentielle}}). On a $[[L_1, L_1], L_2] = 0$, alors que $[L_1, [L_1, L_2]] = [L_1, L_3] = -L_2$. Avec $L(u) = u_1L_1 + u_2L_2 + u_3L_3$, on a $L(u)v = u \wedge v$, et $[L(u), L(v)] = L(u \wedge v)$ : le crochet devient le [[produit-vectoriel|produit vectoriel]], comme l'annonce la remarque du nœud {{li-algebre|Algèbre de Lie}}.
    - |
      Le crochet est le terme d'ordre $2$ du défaut de commutation des exponentielles. Pour $E$ et $F$ comme ci-dessus, $E^2 = F^2 = 0$, donc $e^{sE} = I + sE$ et $e^{sF} = I + sF$, et l'on calcule
      $$\begin{aligned} &e^{sE}e^{sF}e^{-sE}e^{-sF} \\ &\quad = \begin{pmatrix} 1 + s^2 + s^4 & -s^3 \\ s^3 & 1 - s^2 \end{pmatrix} \\ &\quad = I + s^2[E, F] + s^3\begin{pmatrix} s & -1 \\ 1 & 0 \end{pmatrix}. \end{aligned}$$
      Le crochet $[E, F] = H$ en est le terme principal, comme dans la formule du commutateur du nœud {{li-algebre|Algèbre de Lie}}, (i).
      ```schema lex-crochet-matrices-3
      Partant de $x_0 = (1, 1)$, on applique successivement $e^{-sF}$, $e^{-sE}$, $e^{sF}$ et $e^{sE}$, pour $s = 0{,}35$ : $E$ déplace horizontalement, $F$ verticalement. La ligne brisée ne se referme pas ; l'écart final, en rouge, est proche du vecteur $s^2Hx_0$, en pointillé, à des termes d'ordre $s^3$ près.
      ```
