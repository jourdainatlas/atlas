# Exemples du lexique : théorie « Géométrie différentielle » (geod).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  sous-variete:
    - |
      La surface de révolution $T$ obtenue en faisant tourner autour de l'axe des $z$ le cercle de centre $(2, 0, 0)$ et de rayon $1$ du plan $y = 0$ est une sous-variété de dimension $2$ de $\lex{n-uplet}{\mathbb R^3}$. Avec $\rho = \sqrt{x^2 + y^2}$, c'est l'ensemble des zéros de
      $$F(x, y, z) = (\rho - 2)^2 + z^2 - 1$$
      sur l'ouvert $U$ des points où $\rho > 0$, qui le contient puisque $|\rho - 2| \leqslant 1$ en ses points. La fonction $F$ est de classe $C^\infty$ sur $U$, et
      $$dF = \Big(\tfrac{2(\rho - 2)x}{\rho},\ \tfrac{2(\rho - 2)y}{\rho},\ 2z\Big)$$
      ne s'annule que si $z = 0$ et $\rho = 2$, points où $F = -1$. Sur $T$, la [[forme-lineaire|forme linéaire]] $dF$ n'est pas nulle, donc surjective sur $\lex{ensemble-reels}{\mathbb R}$, et le point (i) conclut.
    - |
      En dimension $0$, une sous-variété est formée de points isolés. La partie $M = \{1/k : k \geqslant 1\}$ de $\mathbb R$ en est une : pour $a = 1/k$, un intervalle ouvert $U$ centré en $a$ et assez petit ne contient aucun autre point de $M$, et la translation $\Phi(x) = x - a$ vérifie $\Phi(U \cap M) = \{0\} = \Phi(U) \cap \{0\}$, où $\{0\} = \mathbb R^0 \times \{0\}$. La partie $M' = M \cup \{0\}$, elle, n'en est pas une. En dimension $1$, on aurait $\Phi(U \cap M') = \Phi(U)$, donc $U \subset M'$ pour un intervalle ouvert non vide $U$, ce qui est absurde. En dimension $0$, $\Phi(U) \cap \{0\}$ a au plus un point, alors que, pour un ouvert $U$ contenant $0$, $U \cap M'$ contient $0$ et les $1/k$ pour $k$ grand, et que $\Phi$ est injective.
    - |
      Les ensembles $M_c = \{x^2 - y^2 = c\}$ de $\mathbb R^2$ sont des sous-variétés de dimension $1$ pour $c \neq 0$, par le point (i) : $dF = (2x, -2y)$ ne s'annule qu'en $0$, qui n'est pas sur $M_c$. Pour $c = 0$, $dF(0) = 0$, ce qui ne prouve rien, mais $M_0$, réunion des droites $y = x$ et $y = -x$, n'est pas une sous-variété. Si $\Phi$ redressait $M_0$ sur un ouvert $U$ contenant $0$, en dimension $d$, ce ne serait pas $d = 0$, comme dans le deuxième exemple, ni $d = 2$, puisque $U \cap M_0$ serait l'ouvert $U$, qui contient des $(t, 0)$ pour $t \neq 0$.

      Si $d = 1$, $\Phi(0) = (s, 0)$ et $\Phi(U)$ contient un produit d'intervalles $P = \,]s - \varepsilon, s + \varepsilon[ \times ]{-\varepsilon}, \varepsilon[$. Par $\Phi^{-1}$, $\Phi^{-1}(P) \cap M_0$ privé de $0$ est l'image des deux intervalles qui forment $]s - \varepsilon, s + \varepsilon[ \times \{0\}$ privé de $(s, 0)$, donc la réunion de deux parties [[connexe|connexes]]. Or $M_0 \setminus \{0\}$ est contenu dans la réunion des quatre quadrants ouverts, et l'ouvert $\Phi^{-1}(P)$, qui contient un disque centré en $0$, rencontre $M_0$ dans chacun d'eux. Deux parties connexes, contenues chacune dans un seul quadrant, ne peuvent pas rencontrer les quatre.
      ```schema lex-sous-variete-3
      Les courbes $x^2 - y^2 = 1$, en bleu, et $x^2 - y^2 = -1$, en vert, sont des sous-variétés de dimension $1$. Pour $c = 0$, en rouge, les deux droites se croisent en $0$, et ôter ce point laisse quatre branches, une par quadrant, alors qu'un intervalle privé d'un point n'a que deux morceaux.
      ```

  espace-tangent-sv:
    - |
      Sur l'hyperboloïde $H = \{x^2 + y^2 - z^2 = 1\}$ de $\lex{n-uplet}{\mathbb R^3}$, [[sous-variete|sous-variété]] de dimension $2$ par {{gd-sous-varietes|Sous-variétés de ℝⁿ}}, (i), puisque la différentielle $(2x, 2y, -2z)$ de l'équation ne s'annule qu'en $0 \notin H$, l'espace tangent en $a = (1, 0, 0)$ est
      $$\lex{espace-tangent-sv}{T_a}H = \operatorname{Ker}(2, 0, 0) = \{h : h_1 = 0\}.$$
      La définition par les courbes le retrouve : les droites $\gamma_\pm(t) = (1, t, \pm t)$ sont tracées sur $H$, puisque $1 + t^2 - t^2 = 1$, et leurs vitesses $(0, 1, \pm 1)$ forment une base de ce plan. L'espace tangent contient ainsi les deux droites de la surface qui passent par $a$.
    - |
      L'égalité $T_aM = \operatorname{Ker} dF(a)$ demande une équation dont la différentielle est surjective. Pour la droite $M = \{y = 0\}$ de $\mathbb R^2$, l'équation $F(x, y) = y$ donne bien $T_aM = \operatorname{Ker}(0, 1) = \mathbb R \times \{0\}$. L'équation $G(x, y) = y^2$ définit la même partie, mais $dG(a) = 0$ en tout point de $M$, et $\operatorname{Ker} dG(a)$ est le plan tout entier, de dimension $2$ : sans l'hypothèse de surjectivité, la formule tombe.
    - |
      Le groupe $SL_2(\lex{ensemble-reels}{\mathbb R})$ des matrices de déterminant $1$ est une sous-variété de dimension $3$ de $\lex{espace-matrices}{\mathcal M_2}(\mathbb R) \cong \mathbb R^4$, et son espace tangent en $\lex{matrice-identite}{I_2}$ est formé des matrices de [[trace]] nulle. Le déterminant est polynomial, et
      $$\det(I_2 + tH) = 1 + t\operatorname{tr} H + t^2\det H,$$
      d'où $d\det(I_2)(H) = \operatorname{tr} H$. En tout $A \in SL_2(\mathbb R)$, $\det\big((1 + t)A\big) = (1 + t)^2$ donne $d\det(A)(A) = 2 \neq 0$, si bien que $d\det(A)$ est surjective : $\det - 1$ est une équation au sens de {{gd-sous-varietes|Sous-variétés de ℝⁿ}}, (i), et $T_{I_2}SL_2(\mathbb R) = \operatorname{Ker}\operatorname{tr}$. Plus loin, le nœud {{gd-espace-tangent|Espace tangent}} définit l'espace tangent d'une variété abstraite par les cartes, et le relie à celui-ci par son point (iii).

  carte:
    - |
      Sur le cercle $\lex{sphere-unite}{S^1} \subset \lex{n-uplet}{\mathbb R^2}$, muni de la [[topologie-induite|topologie induite]], le demi-cercle ouvert $U = \{(x, y) \in S^1 : y > 0\}$ et la première coordonnée $\varphi(x, y) = x$ forment une carte de dimension $1$. L'ensemble $U$ est ouvert, trace d'un demi-plan ouvert, et $\varphi$ est continue sur $U$, bijective sur $]{-1}, 1[$, de réciproque continue $x \mapsto \big(x, \sqrt{1 - x^2}\big)$ : c'est un [[homeomorphisme|homéomorphisme]] sur un ouvert de $\lex{ensemble-reels}{\mathbb R}$. Les quatre demi-cercles ouverts $y > 0$, $y < 0$, $x > 0$ et $x < 0$, chacun lu sur l'autre coordonnée, donnent quatre cartes dont les domaines recouvrent $S^1$.
      ```schema lex-carte-1
      La carte $\varphi(x, y) = x$ projette verticalement le demi-cercle ouvert $U$, en rouge, sur l'intervalle $]{-1}, 1[$ de l'axe, en bleu. Les points $(\pm 1, 0)$, qui ne sont pas dans $U$, se projetteraient sur les extrémités de l'intervalle, qui n'en font pas partie.
      ```
    - |
      Une bijection, même de réciproque continue, ne suffit pas à faire une carte. Soit $\psi : S^1 \to [0, 2\pi[$ la réciproque de la restriction de $t \mapsto (\cos t, \sin t)$ à $[0, 2\pi[$, qui est une bijection ({{tg-cercle|Paramétrage du cercle}}, (iii)). Ce n'est pas une carte : son image $[0, 2\pi[$ n'est pas un ouvert de $\mathbb R$, et $\psi$ n'est pas continue en $(1, 0)$, puisque les points $(\cos(2\pi - \frac1k), \sin(2\pi - \frac1k))$ tendent vers $(1, 0)$ alors que leurs images $2\pi - \frac1k$ tendent vers $2\pi$, et non vers $\psi(1, 0) = 0$.
    - |
      Une carte n'a pas à prendre ses valeurs dans $\mathbb R^n$ tout entier. L'[[arc-tangente|arc tangente]] est un homéomorphisme de $\mathbb R$ sur $]{-\frac\pi2}, \frac\pi2[$, de réciproque la tangente ({{tg-tangente|Tangente, cos et sin}}, (i)), donc une carte de $\mathbb R$, comme $\psi(x) = \frac{x}{1 + |x|}$, homéomorphisme de $\mathbb R$ sur $]{-1}, 1[$, de réciproque $y \mapsto \frac{y}{1 - |y|}$. Les deux cartes ne se valent pourtant pas. La première est [[cartes-compatibles|compatible]] avec $\mathrm{id}$, puisque $\arctan' = \frac1{1 + x^2}$ et $\tan' = 1 + \tan^2$ rendent l'une et l'autre de classe $C^\infty$, par récurrence ; la seconde ne l'est pas, sa dérivée $\frac1{(1 + |x|)^2}$ n'étant pas dérivable en $0$, où ses dérivées à gauche et à droite valent $2$ et $-2$.

  atlas:
    - |
      Deux atlas très différents peuvent définir la même structure. Sur le cercle $\lex{sphere-unite}{S^1}$, l'atlas stéréographique $\{\sigma_+, \sigma_-\}$, construit au deuxième exemple de [[variete-differentiable|variété différentiable]], et l'atlas des quatre demi-cercles, chacun lu sur une coordonnée, ont une réunion qui est encore un atlas. Chacune de ces six [[carte|cartes]] est la restriction d'une application de classe $C^\infty$ sur un ouvert de $\lex{n-uplet}{\mathbb R^2}$ contenant son domaine, comme $(x, y) \mapsto x/(1 - y)$ sur $\{y \neq 1\}$, et sa réciproque est de classe $C^\infty$ à valeurs dans $\mathbb R^2$, comme $x \mapsto (x, \sqrt{1 - x^2})$ sur $]{-1}, 1[$.

      Tout changement de carte est donc une composée d'applications $C^\infty$ ({{gd-classe-ck|Classe Cᵏ}}, (iii)), et, par l'énoncé, les deux atlas ont le même atlas maximal. Ainsi, entre le demi-cercle supérieur et $\sigma_+$, le changement de carte est $x \mapsto \frac{x}{1 - \sqrt{1 - x^2}}$ sur $]{-1}, 0[ \cup ]0, 1[$, de réciproque $z \mapsto \frac{2z}{z^2 + 1}$ sur $\{|z| > 1\}$.
    - |
      Le cercle n'a pas d'atlas à une seule carte. Il est [[compact]], comme partie fermée et bornée de $\mathbb R^2$ ({{me-rn|L'espace ℝⁿ}}, (iii)). Une carte $(S^1, \varphi)$ ferait de $\varphi(S^1)$ un compact non vide de $\lex{ensemble-reels}{\mathbb R}$ ({{t-compact-prop|Compacts, fermés et images}}, (iii)), qui aurait un plus grand élément $m$, et un ouvert de $\mathbb R$, qui contiendrait $]m - \varepsilon, m + \varepsilon[$ pour un $\varepsilon > 0$ : c'est impossible. L'atlas stéréographique, à deux cartes, est donc aussi petit que possible. Pour la droite, au contraire, l'atlas $\{\mathrm{id}\}$ suffit.
    - |
      Un atlas maximal n'est jamais fini, sauf dans des cas limites. Si $M$ est non vide, de dimension $n \geqslant 1$, et $(U, \varphi)$ une carte de domaine non vide, les translatées $(U, \varphi + c)$, $c \in \mathbb R^n$, sont des cartes compatibles avec toutes les autres, les translations étant de classe $C^\infty$ ainsi que leurs réciproques. Elles sont deux à deux distinctes : l'atlas maximal contient une famille de cartes indexée par $\mathbb R^n$. En dimension $0$, en revanche, une carte envoie son domaine sur un ouvert de $\mathbb R^0 = \{0\}$, et un ensemble fini muni de la topologie discrète a un atlas maximal fini, formé des cartes de domaine vide ou réduit à un point.

  variete-differentiable:
    - |
      Un même espace topologique peut porter deux structures de variété différentes. La droite $\lex{ensemble-reels}{\mathbb R}$ est [[separe|séparée]], et les intervalles $]a, b[$ à extrémités rationnelles en forment une base [[denombrable|dénombrable]] : si $]x - \varepsilon, x + \varepsilon[$ est contenu dans un ouvert, la densité de $\lex{ensemble-rationnels}{\mathbb Q}$ ({{ar-archimede|Archimède, densité de ℚ}}) fournit $a \in \,]x - \varepsilon, x[$ et $b \in \,]x, x + \varepsilon[$ rationnels, et $\mathbb Q \times \mathbb Q$ est dénombrable ({{q-denombrable|ℚ est dénombrable}}).

      Les [[atlas]] $\{\mathrm{id}\}$ et $\{\varphi\}$, où $\varphi(x) = x^3$ est un [[homeomorphisme|homéomorphisme]] de $\mathbb R$ sur $\mathbb R$ ({{c-bijection|Théorème de la bijection}}), ont chacun une seule [[carte]]. Leur réunion n'est pas un atlas, car $\varphi^{-1}(y) = \sqrt[3]y$ n'est pas dérivable en $0$, son taux d'accroissement $1/\sqrt[3]{h}^{\,2}$ tendant vers $+\infty$. Par l'énoncé, ils définissent deux atlas maximaux distincts, donc deux variétés de dimension $1$ distinctes sur la même droite.
    - |
      Le cercle $\lex{sphere-unite}{S^1} \subset \lex{n-uplet}{\mathbb R^2}$, muni de la [[topologie-induite|topologie induite]], est une variété de dimension $1$. Il est séparé, comme partie de $\mathbb R^2$ ({{t-separe|Espaces séparés}}, (iii)), et les traces des produits $]a, b[ \times ]c, d[$ à extrémités rationnelles en forment une base dénombrable, par l'argument de densité du premier exemple. La projection stéréographique depuis $N = (0, 1)$,
      $$\sigma_+(x, y) = \frac{x}{1 - y},$$
      est continue et bijective de $S^1 \setminus \{N\}$ sur $\mathbb R$, de réciproque continue
      $$z \mapsto \frac{(2z,\ z^2 - 1)}{z^2 + 1}.$$
      Ce point est sur le cercle, distinct de $N$, et $\sigma_+$ l'envoie sur $z$ ; inversement, si $z = \sigma_+(x, y)$, la relation $x^2 = 1 - y^2$ donne $z^2 = \frac{1 + y}{1 - y}$, d'où $y$, puis $x = z(1 - y)$.

      De même, $\sigma_-(x, y) = \frac{x}{1 + y}$ est un homéomorphisme de $S^1 \setminus \{(0, -1)\}$ sur $\mathbb R$. Le changement de carte $\sigma_- \circ \sigma_+^{-1}$ est $z \mapsto 1/z$ sur $\mathbb R \setminus \{0\}$, de classe $C^\infty$ et égal à sa réciproque : $\{\sigma_+, \sigma_-\}$ est un atlas.
    - |
      La séparation ne découle pas de l'existence des cartes. Soit $X$ le quotient de $\mathbb R \times \{0, 1\}$ qui identifie $(t, 0)$ et $(t, 1)$ pour $t \neq 0$, muni de la [[topologie-quotient|topologie quotient]], et $\pi$ la projection. Pour $O$ ouvert de $\mathbb R$, l'image $\pi(O \times \{i\})$ a pour image réciproque $O \times \{i\} \cup (O \setminus \{0\}) \times \{1 - i\}$, ouverte : $U_i = \pi(\mathbb R \times \{i\})$ est ouvert, et la réciproque $\varphi_i$ de la bijection continue $t \mapsto \pi(t, i)$ est une carte.

      Le changement de carte $\varphi_1 \circ \varphi_0^{-1}$ est l'identité de $\mathbb R \setminus \{0\}$ : $\{\varphi_0, \varphi_1\}$ est un atlas. Mais un ouvert contenant $\pi(0, i)$ a une image réciproque ouverte qui contient un $]{-\varepsilon}, \varepsilon[ \times \{i\}$, et deux tels ouverts, pour $i = 0$ et $i = 1$, contiennent tous deux $\pi(\varepsilon'/2, 0)$, où $\varepsilon'$ est le plus petit des deux rayons. Les deux origines n'ont pas de voisinages disjoints : $X$, qui a des cartes, n'est pas une variété.
      ```schema lex-variete-differentiable-3
      Hors de $0$, les deux copies de $\mathbb R$ sont recollées en une seule droite ; les deux origines, en rouge, restent distinctes. Un voisinage de l'une, en bleu, et un voisinage de l'autre, en vert, ont en commun tous les points voisins de $0$ qui ne sont pas des origines.
      ```

  application-lisse:
    - |
      Pour savoir qu'une fonction sur le cercle est lisse, il suffit de la lire dans les deux cartes stéréographiques ({{gd-exemples-varietes|Exemples de variétés}}, (ii)), par le point (i). La fonction $f(x, y) = x$ sur $\lex{sphere-unite}{S^1}$ s'écrit, dans les cartes $\sigma_\pm$ et la carte $\mathrm{id}$ de $\lex{ensemble-reels}{\mathbb R}$,
      $$\begin{aligned} f \circ \sigma_+^{-1}(z) &= \frac{2z}{z^2 + 1}, \\ f \circ \sigma_-^{-1}(w) &= \frac{2w}{w^2 + 1}, \end{aligned}$$
      deux fractions rationnelles dont le dénominateur ne s'annule pas sur $\mathbb R$, donc de classe $C^\infty$ sur $\mathbb R$. Comme $f$ est continue, elle est [[application-lisse|lisse]] : c'est un élément de l'anneau $C^\infty(S^1)$ du point (iii).
    - |
      Le point (iv) dispense souvent de tout calcul en cartes. L'application $F(x, y) = (x^2 - y^2, 2xy)$, polynomiale, donc de classe $C^\infty$ sur $\lex{n-uplet}{\mathbb R^2}$, vérifie
      $$(x^2 - y^2)^2 + (2xy)^2 = (x^2 + y^2)^2,$$
      de sorte que $F(S^1) \subset S^1$. Sa restriction est une application lisse de $S^1$ dans lui-même, qui envoie $(\cos t, \sin t)$ sur $(\cos 2t, \sin 2t)$ par les formules d'addition ({{tg-addition|Formules d'addition}}) : quand $t$ décrit $[0, 2\pi[$, chaque point du cercle est atteint deux fois, pour $2t$ dans $[0, 2\pi[$ et dans $[2\pi, 4\pi[$ ({{tg-cercle|Paramétrage du cercle}}, (iii)).
    - |
      Une bijection lisse n'est pas toujours un [[diffeomorphisme|difféomorphisme]]. L'application $f(x) = x^3$ de $\mathbb R$ dans $\mathbb R$ est lisse par (iv), et bijective, mais sa réciproque $y \mapsto \sqrt[3]y$ n'est pas dérivable en $0$, donc n'est pas lisse. Elle n'est même pas un difféomorphisme d'un voisinage de $0$ sur un voisinage de $0$, puisque la réciproque d'une telle restriction est encore $y \mapsto \sqrt[3]y$ près de $0$. Plus loin, le nœud {{gd-espace-tangent|Espace tangent}} l'explique : l'application tangente de $f$ en $0$ est nulle, alors que celle d'un difféomorphisme est un isomorphisme, par son point (ii).

  espace-tangent:
    - |
      Un vecteur tangent change de coordonnées avec la carte. Sur la variété $M = \,]0, +\infty[$, les cartes $\mathrm{id}$ et $\varphi(x) = x^3$ sont [[cartes-compatibles|compatibles]], la réciproque $y \mapsto \sqrt[3]y$ étant de classe $C^\infty$ hors de $0$. En $p = 2$, la différentielle du changement de carte $\varphi \circ \mathrm{id}^{-1}$ est la multiplication par $\varphi'(2) = 12$ : le vecteur de $\lex{espace-tangent}{T_2}M$ qui vaut $1$ dans la carte $\mathrm{id}$ vaut $12$ dans la carte $\varphi$, et $\theta_{\mathrm{id}}(1) = \theta_\varphi(12)$. Aucune des deux écritures n'est privilégiée : le vecteur tangent est la classe de tous ces triplets.
    - |
      Sur le cercle $\lex{sphere-unite}{S^1}$, au point $p = (\frac35, \frac45)$, les cartes stéréographiques ({{gd-exemples-varietes|Exemples de variétés}}, (ii)) valent $\sigma_+(p) = 3$ et $\sigma_-(p) = \frac13$, et le changement de carte $z \mapsto 1/z$ a pour dérivée $-\frac19$ en $3$ : $\theta_{\sigma_+}(1) = \theta_{\sigma_-}(-\frac19)$. Le point (iii) envoie ce vecteur sur
      $$\begin{aligned} d(\sigma_+^{-1})(3) \cdot 1 &= \Big(\!-\frac{4}{25},\ \frac{3}{25}\Big) \\ &= -\frac1{25}(4, -3), \end{aligned}$$
      et le calcul avec $\sigma_-^{-1}$ et le vecteur $-\frac19$ donne le même résultat, comme il se doit. Ce vecteur vérifie $\frac35 h_1 + \frac45 h_2 = 0$ : il est dans l'[[espace-tangent-sv|espace tangent géométrique]] $T_pS^1$, droite de direction $(4, -3)$.
    - |
      L'application tangente détecte ce que la continuité ne voit pas. L'application $f(x) = x^3$ est un homéomorphisme lisse de $\mathbb R$ sur $\mathbb R$, et dans la carte $\mathrm{id}$, $T_0f$ est la multiplication par $f'(0) = 0$ : ce n'est pas un isomorphisme de $T_0\mathbb R$ sur $T_0\mathbb R$, de dimension $1$. Par le point (ii), $f$ n'est donc pas un [[diffeomorphisme|difféomorphisme]], ce que l'on voyait directement sur sa réciproque $y \mapsto \sqrt[3]y$, non dérivable en $0$.

  fibre-tangent:
    - |
      Pour un ouvert $U$ de $\lex{n-uplet}{\mathbb R^n}$, d'atlas $\{\mathrm{id}\}$, la carte $T\mathrm{id}$ est une bijection de $\lex{fibre-tangent}{TU}$ tout entier sur $U \times \mathbb R^n$ : le fibré tangent d'un ouvert est un produit, de dimension $2n$. Un point de $TU$ est un point $p$ de $U$ muni d'un vecteur de $\mathbb R^n$, et la projection $\pi$ est la première projection $(p, v) \mapsto p$.
    - |
      Sur le cercle $\lex{sphere-unite}{S^1}$, les cartes $T\sigma_+$ et $T\sigma_-$ font de $TS^1$ une variété de dimension $2$, sans le choix dénombrable de la preuve générale, puisque deux cartes recouvrent le cercle. Avec $\tau(z) = 1/z$, changement de carte des projections stéréographiques ({{gd-exemples-varietes|Exemples de variétés}}, (ii)), la formule de la preuve donne
      $$T\sigma_- \circ T\sigma_+^{-1}(z, v) = \Big(\frac1z,\ -\frac{v}{z^2}\Big)$$
      pour $z \neq 0$ : le point change de coordonnée par $\tau$, le vecteur par la dérivée $\tau'(z) = -1/z^2$, linéairement. Ce changement de carte est de classe $C^\infty$ sur $(\mathbb R \setminus \{0\}) \times \mathbb R$, comme sa réciproque, qui est la même formule.

  champ-vecteurs:
    - |
      Sur un ouvert $U$ de $\lex{n-uplet}{\mathbb R^n}$, un champ de vecteurs n'est rien d'autre qu'une application de classe $C^\infty$ de $U$ dans $\mathbb R^n$. La carte $T\mathrm{id}$ identifie le [[fibre-tangent|fibré tangent]] $\lex{fibre-tangent}{TU}$ à $U \times \mathbb R^n$, et un champ $X$ s'y lit $p \mapsto (p, V(p))$, lisse si et seulement si $V$ est de classe $C^\infty$. Sur $\mathbb R^2$, le champ $V(x, y) = (-y, x)$ ne s'annule qu'en $0$, et le champ radial $V(x, y) = (x, y)$ aussi ; le champ constant $(1, 0)$, lui, ne s'annule nulle part.
    - |
      Un choix de vecteur tangent en chaque point ne fait pas un champ. Sur $\lex{sphere-unite}{S^1}$, dont l'espace tangent en $(x, y)$ s'identifie à la droite orthogonale à $(x, y)$ ({{gd-espace-tangent|Espace tangent}}, (iii)), posons $Y(x, y) = (-y, x)$ si $y \geqslant 0$ et $Y(x, y) = (y, -x)$ si $y < 0$. Chaque $Y(x, y)$ est tangent et non nul, mais $Y$ n'est pas continue en $(1, 0)$ : $Y(1, 0) = (0, 1)$, alors que $Y(x, y)$ tend vers $(0, -1)$ quand $(x, y)$ tend vers $(1, 0)$ avec $y < 0$. Dans la carte stéréographique $\sigma_+$, où $\sigma_+(1, 0) = 1$, sa composante vaut $\frac{1 + z^2}{2}$ pour $|z| \geqslant 1$ et $-\frac{1 + z^2}{2}$ pour $|z| < 1$ : elle saute en $z = 1$.
      ```schema lex-champ-vecteurs-2
      Les vecteurs $Y$, réduits d'un facteur $0{,}4$, tournent dans un sens sur le demi-cercle supérieur, en bleu, et dans l'autre sur le demi-cercle inférieur, en vert. En $(1, 0)$ et en $(-1, 0)$, en rouge, ils changent brusquement de sens : chaque vecteur est tangent, mais l'application n'est pas continue.
      ```
    - |
      Sur la sphère $\lex{sphere-unite}{S^2} \subset \mathbb R^3$, le champ $X(x, y, z) = (-y, x, 0)$ est tangent, puisque $x(-y) + yx + z \cdot 0 = 0$, et il est lisse : dans une carte $\varphi = p \circ \Phi$ du nœud {{gd-exemples-varietes|Exemples de variétés}}, (i), le point (iii) de {{gd-espace-tangent|Espace tangent}} donne à $X(q)$ les coordonnées $p\big(d\Phi(q)X(q)\big)$, qui dépendent de façon $C^\infty$ de $u = \varphi(q)$, puisque $q = \Phi^{-1}(u, 0)$. Il s'annule exactement aux deux points $(0, 0, \pm 1)$, seuls points de $S^2$ où $x = y = 0$. Plus loin, le nœud {{dc-chevelue|Champs tangents aux sphères}} montre qu'aucune application de classe $C^\infty$ définie près de $S^2$ et tangente à $S^2$ ne peut éviter de s'annuler.

  orientation:
    - |
      Dans $\lex{n-uplet}{\mathbb R^2}$, les deux orientations sont celle de $(e_1, e_2)$ et celle de $(e_2, e_1)$, la [[matrice-passage|matrice de passage]] de l'une à l'autre ayant pour [[determinant|déterminant]] $-1$. La base $(e_2, -e_1)$ est dans la première classe, puisque
      $$\det\begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix} = 1,$$
      et la base $(e_1 + e_2, e_1 - e_2)$ dans la seconde, son déterminant valant $-2$. Choisir une orientation, c'est déclarer directe l'une des deux classes, sans qu'aucune base de chaque classe soit privilégiée.
    - |
      L'orientation dépend de l'ordre des vecteurs. Dans $\mathbb R^n$, la base $(e_n, \dots, e_1)$ se déduit de $(e_1, \dots, e_n)$ par les $\lfloor n/2 \rfloor$ échanges de $e_i$ et de $e_{n+1-i}$, et la matrice de passage a pour déterminant $(-1)^{\lfloor n/2 \rfloor}$. La base renversée a donc l'orientation opposée pour $n = 2$ et $n = 3$, mais la même pour $n = 4$ et $n = 5$. Une permutation circulaire $(e_2, \dots, e_n, e_1)$ est un produit de $n - 1$ échanges : elle conserve l'orientation si et seulement si $n$ est impair, comme $(e_2, e_3, e_1)$ dans $\mathbb R^3$.
    - |
      L'application $-\mathrm{id}$ renverse chaque vecteur sans renverser forcément l'orientation. Son déterminant est $(-1)^n$, et par le point (i) elle conserve l'orientation de $\mathbb R^n$ si et seulement si $n$ est pair : dans $\mathbb R^2$, elle envoie $(e_1, e_2)$ sur $(-e_1, -e_2)$, de même orientation, alors que dans $\mathbb R^3$, $(-e_1, -e_2, -e_3)$ a l'orientation opposée à celle de la base canonique. Ce qui compte n'est pas le sens de chaque vecteur, mais le signe du déterminant.

  forme-volume:
    - |
      Sur un ouvert de $\lex{n-uplet}{\mathbb R^n}$, d'atlas $\{\mathrm{id}\}$, une forme de degré $n$ s'écrit $f\,dx_1 \wedge \cdots \wedge dx_n$, et c'est une forme volume si et seulement si $f$ ne s'annule pas. Sur $\mathbb R^2$, la forme $(1 + x^2 + y^2)\,dx \wedge dy$ en est une ; la forme $x\,dx \wedge dy$ n'en est pas une, puisqu'elle s'annule sur l'axe $x = 0$ ; sur l'ouvert $\{x \neq 0\}$, en revanche, elle en est une.
    - |
      Une forme qui ne s'annule pas dans l'espace ambiant peut s'annuler sur une sous-variété. Sur le cercle $\lex{sphere-unite}{S^1}$, la restriction de $dx$ s'écrit, dans la carte $\sigma_+$ ({{gd-exemples-varietes|Exemples de variétés}}, (ii)),
      $$d\Big(\frac{2z}{z^2 + 1}\Big) = \frac{2(1 - z^2)}{(1 + z^2)^2}\,dz,$$
      coefficient nul en $z = \pm 1$, c'est-à-dire aux points $(\pm 1, 0)$ ; ce n'est pas une forme volume. La restriction de $x\,dy - y\,dx$, au contraire, a pour coefficients $\frac{2}{1 + z^2}$ dans $\sigma_+$ et $-\frac{2}{1 + w^2}$ dans $\sigma_-$, qui ne s'annulent pas : c'en est une. Plus loin, le nœud {{gd-forme-volume|Forme volume}}, (iii), montre qu'une variété porte une forme volume si et seulement si elle est orientable, avec un choix dénombrable ⋆ dans le cas général.

  variete-orientee:
    - |
      La droite $\lex{ensemble-reels}{\mathbb R}$ a exactement deux orientations, celle qui contient $\mathrm{id}$ et celle qui contient $\rho(x) = -x$. Soit $\mathcal O$ une orientation, et, pour $p \in \mathbb R$, $\varepsilon(p)$ le signe de $\varphi'(p)$ pour une carte directe $(U, \varphi)$ en $p$. Ce signe ne dépend pas de la carte, les changements de carte entre cartes directes ayant une dérivée positive, et il est localement constant, $\varphi'$ étant continue et sans zéro, puisque $(\varphi^{-1})'(\varphi(p))\,\varphi'(p) = 1$.

      Sur $\mathbb R$, [[connexe]] ({{tr-connexes|Parties connexes de ℝ}}), $\varepsilon$ est donc constant. S'il vaut $1$, la carte $\mathrm{id}$ a des changements de carte de dérivée positive avec toutes les cartes de $\mathcal O$, et $\mathcal O = \{\mathrm{id}\}^+$ par le point (i) ; s'il vaut $-1$, de même, $\mathcal O = \{\rho\}^+$.
    - |
      Sans connexité, il peut y avoir plus de deux orientations. Sur l'ouvert $M = \mathbb R \setminus \{0\}$, les quatre atlas formés d'une carte $x$ ou $-x$ sur $]{-\infty}, 0[$ et d'une carte $x$ ou $-x$ sur $]0, +\infty[$ sont orientés, puisque leurs deux domaines sont disjoints. La réunion de deux d'entre eux contient deux cartes de même domaine, $x$ et $-x$, dont le changement de carte a pour dérivée $-1$ : par le point (i), ce sont quatre orientations distinctes, et l'argument du premier exemple, mené sur chaque demi-droite, montre qu'il n'y en a pas d'autre.
    - |
      Une forme volume choisit l'orientation. Sur $\lex{sphere-unite}{S^1}$, la restriction de $\omega = x\,dy - y\,dx$ s'écrit, dans les cartes stéréographiques $\sigma_+$ et $\sigma_-$ ({{gd-exemples-varietes|Exemples de variétés}}, (ii)), de coordonnées $z$ et $w$,
      $$\omega_{\sigma_+} = \frac{2\,dz}{1 + z^2}, \qquad \omega_{\sigma_-} = -\frac{2\,dw}{1 + w^2},$$
      en remplaçant $(x, y)$ par $\sigma_+^{-1}(z) = \frac{(2z, z^2 - 1)}{z^2 + 1}$ ou par $\sigma_-^{-1}(w) = \frac{(2w, 1 - w^2)}{w^2 + 1}$. C'est une [[forme-volume|forme volume]], et, par le point (ii), l'orientation $\mathcal O_\omega$ contient $\sigma_+$ mais pas $\sigma_-$.

      Elle contient en revanche $\rho \circ \sigma_-$, dans laquelle le coefficient devient $\frac{2}{1 + u^2}$ : c'est l'orientation de l'atlas orienté $\{\sigma_+, \rho \circ \sigma_-\}$ du nœud {{gd-orientation|Orientation}}, (iii).

  forme-differentielle:
    - |
      En chaque point, une forme différentielle est une forme alternée que l'on évalue sur des vecteurs. Sur $\lex{n-uplet}{\mathbb R^2}$, la forme $\omega = x\,dy - y\,dx$ est de degré $1$ : au point $(1, 2)$, c'est la [[forme-lineaire|forme linéaire]] $h \mapsto h_2 - 2h_1$, qui vaut $4 - 6 = -2$ sur $h = (3, 4)$. La forme $dx \wedge dy$ est de degré $2$ et, en tout point, c'est le [[determinant|déterminant]] : $(dx \wedge dy)(h, k) = h_1k_2 - h_2k_1$ ({{v-algebre-exterieure|Algèbre extérieure}}, (ii)). On écrit toujours une forme sur les $dx_I$ à indices croissants, en remplaçant par exemple $dy \wedge dx$ par $-dx \wedge dy$.
    - |
      Sur $\mathbb R^3$, les formes de degré $0, 1, 2, 3$ ont respectivement $1, 3, 3, 1$ coefficients, nombres de parties à $k$ éléments de $\{1, 2, 3\}$ ({{v-algebre-exterieure|Algèbre extérieure}}, (i)) :
      $$\begin{aligned} &f, \quad P\,dx + Q\,dy + R\,dz, \\ &A\,dy \wedge dz + B\,dz \wedge dx + C\,dx \wedge dy, \\ &g\,dx \wedge dy \wedge dz. \end{aligned}$$
      Au-delà, il n'y a plus rien : toute forme de degré $4$ sur $\mathbb R^3$ est nulle, puisque $\Lambda^4(\mathbb R^3) = \{0\}$ par le même point. Ainsi $dx \wedge dy \wedge dz \wedge dx = 0$, ce que l'on voit aussi en ramenant le dernier $dx$ en tête, au prix d'un signe, à côté du premier.
    - |
      Le carré extérieur d'une forme de degré impair $k$ est nul, puisque $\alpha \wedge \alpha = (-1)^{k^2}\alpha \wedge \alpha = -\alpha \wedge \alpha$, mais pas toujours celui d'une forme de degré pair. Sur $\mathbb R^4$, la forme $\sigma = dx_1 \wedge dx_2 + dx_3 \wedge dx_4$ vérifie
      $$\sigma \wedge \sigma = 2\,dx_1 \wedge dx_2 \wedge dx_3 \wedge dx_4 \neq 0,$$
      puisque les carrés $dx_1 \wedge dx_2 \wedge dx_1 \wedge dx_2$ et $dx_3 \wedge dx_4 \wedge dx_3 \wedge dx_4$ sont nuls et que les deux produits croisés sont égaux, $dx_3 \wedge dx_4$ commutant avec $dx_1 \wedge dx_2$ par la règle $(-1)^{2 \cdot 2} = 1$ ({{v-algebre-exterieure|Algèbre extérieure}}, (ii)). Plus loin, le nœud {{gd-formes-varietes|Formes sur une variété}} transporte ces formes sur une variété, carte par carte.

  cohomologie-de-rham:
    - |
      Sur l'ouvert $U = \mathbb R \setminus \{0\}$ de $\lex{ensemble-reels}{\mathbb R}$, les deux degrés ne disent pas la même chose. L'ouvert $U$ a deux composantes connexes, $]{-\infty}, 0[$ et $]0, +\infty[$ : par (i), $\lex{cohomologie-de-rham}{H^0}(U)$ est de dimension $2$, de base les indicatrices des deux demi-droites, alors que $H^0(\mathbb R) \cong \mathbb R$ par (ii). L'hypothèse de (ii) ne peut donc pas être retirée : $U$ n'est pas [[partie-etoilee|étoilé]] par rapport à $0$, qu'il ne contient pas, et la conclusion tombe dès le degré $0$.

      En degré $1$, au contraire, $H^1(U) = \{0\}$. Une forme $a\,dx$ est toujours [[forme-fermee|fermée]], puisque $d(a\,dx) = a'\,dx \wedge dx = 0$, et c'est la différentielle de la fonction égale à $\int_1^x a$ sur $]0, +\infty[$ et à $\int_{-1}^x a$ sur $]{-\infty}, 0[$, de dérivée $a$ par le théorème fondamental ({{ar-tfa|Théorème fondamental}}), donc de classe $C^\infty$. Couper la droite en deux ne crée aucun « tour » : c'est dans le plan qu'un trou se voit en degré $1$.
    - |
      Une classe non nulle peut devenir nulle quand on restreint l'ouvert. Sur $U = \lex{n-uplet}{\mathbb R^2} \setminus \{0\}$, la forme
      $$\omega = \frac{x\,dy - y\,dx}{x^2 + y^2}$$
      a une classe non nulle dans $H^1(U)$, par (iii). Sur le demi-plan $V = \{x > 0\}$, en revanche, c'est la différentielle de $\theta(x, y) = \arctan(y/x)$ : comme l'[[arc-tangente|arc tangente]] a pour dérivée $u \mapsto \frac1{1 + u^2}$ ({{tg-arctan|Arc tangente, π}}, (i)), on trouve $\partial_x\theta = \frac{-y}{x^2 + y^2}$ et $\partial_y\theta = \frac{x}{x^2 + y^2}$.

      L'application $i^* : H^1(U) \to H^1(V)$ induite par l'inclusion $i : V \to U$, au sens de (iv), envoie donc la classe non nulle de $\omega$ sur $0$ : elle n'est pas injective. Une forme peut avoir une primitive sur chaque morceau d'un ouvert sans en avoir sur l'ouvert entier.
      ```schema lex-cohomologie-de-rham-2
      Sur le demi-plan $x > 0$, en bleu, la fonction $\theta = \arctan(y/x)$ est constante le long de chaque demi-droite issue de l'origine, et $d\theta = \omega$. Aucune fonction de ce genre n'existe sur le plan privé de l'origine, puisque la classe de $\omega$ n'y est pas nulle.
      ```
    - |
      La cohomologie sépare des ouverts qu'aucun difféomorphisme ne relie. L'ouvert $\mathbb R^2$ est étoilé par rapport à $0$, donc $H^1(\mathbb R^2) = \{0\}$ par (ii), alors que $H^1(\mathbb R^2 \setminus \{0\}) \neq \{0\}$ par (iii). Par (iv), aucun [[diffeomorphisme|difféomorphisme]] n'envoie $\mathbb R^2 \setminus \{0\}$ sur $\mathbb R^2$, ni sur un disque ouvert centré en $0$, étoilé lui aussi. Plus loin, le nœud {{dr-degre1|De Rham en degré 1}}, (ii), établit que $H^1(\mathbb R^2 \setminus \{0\})$ est de dimension $1$, engendré par la classe de $\omega$.

  fonction-plateau:
    - |
      Sur $\lex{ensemble-reels}{\mathbb R}$, la fonction $\psi_{0,1}(y) = \theta(1 - y^2)$ du point (ii), où $\theta(x) = e^{-1/x}$ pour $x > 0$ et $\theta(x) = 0$ sinon ({{ex-plateau|Fonction plate en 0}}), est une fonction plateau. Elle est de classe $C^\infty$, strictement positive sur $]{-1}, 1[$, nulle hors du [[compact]] $[-1, 1]$, et vaut $e^{-1}$ en $0$. Comme elle est nulle hors de $[-1, 1]$ et que ses dérivées successives sont continues, celles-ci sont toutes nulles en $\pm 1$ : le raccord à $0$ est infiniment plat.
      ```schema lex-fonction-plateau-1
      La fonction $\theta(1 - y^2)$, en rouge, est strictement positive sur $]{-1}, 1[$, maximale en $0$ où elle vaut $e^{-1}$, et nulle hors de $[-1, 1]$, en gris. Le raccord en $\pm 1$ est si plat qu'il ne se voit pas : toutes les dérivées y sont nulles.
      ```
    - |
      Une fonction lisse non nulle n'est pas toujours une fonction plateau, même si elle tend vers $0$. Une [[fonction-polynomiale|fonction polynomiale]] nulle hors d'un compact $K \subset [-A, A]$ s'annule en tout $x > A$ : elle a une infinité de [[racine-polynome|racines]], donc elle est nulle, et aucune fonction polynomiale n'est une fonction plateau. La fonction $y \mapsto e^{-y^2}$, de classe $C^\infty$, ne s'annule nulle part, et ce n'en est pas une non plus ; la fonction $\theta$ elle-même, nulle sur $]{-\infty}, 0]$ mais strictement positive sur $]0, +\infty[$, non plus.
    - |
      Sur une variété compacte, la condition « nulle hors d'un compact » ne coûte rien. Sur le cercle $\lex{sphere-unite}{S^1}$, compact comme partie fermée et bornée de $\mathbb R^2$ ({{me-rn|L'espace ℝⁿ}}, (iii)), la fonction constante $1$ est une fonction plateau, puisqu'elle est nulle hors de $S^1$ tout entier. Sur $\mathbb R$, au contraire, une fonction constante non nulle n'en est pas une, $\mathbb R$ n'étant contenu dans aucun compact. Les fonctions plateau servent donc surtout à localiser : celles de (ii), construites dans une carte, ne sont non nulles que sur l'image réciproque d'un petit cube.

  localement-fini:
    - |
      Sur $\lex{ensemble-reels}{\mathbb R}$, la famille des intervalles $]k - 1, k + 1[$, $k \in \lex{ensemble-entiers-relatifs}{\mathbb Z}$, est localement finie : le [[voisinage]] $]x - 1, x + 1[$ d'un réel $x$ ne rencontre $]k - 1, k + 1[$ que si $|k - x| < 2$, ce qui laisse au plus quatre entiers. La famille des $]{-k}, k[$, $k \geqslant 1$, ne l'est pas : tout voisinage de $0$ les rencontre toutes. Ce n'est pas le nombre de parties qui compte, infini dans les deux cas, mais leur accumulation.
    - |
      Il ne suffit pas que chaque point ne soit que dans un nombre fini des parties. Pour $k \geqslant 1$, soit $c_k$ le milieu de $[\frac1{k+1}, \frac1k]$ et $r_k$ sa demi-longueur, et, avec la fonction $\theta$ du nœud {{ex-plateau|Fonction plate en 0}},
      $$b_k(x) = \frac{\theta\big(r_k^2 - (x - c_k)^2\big)}{\theta(r_k^2)},$$
      qui vaut $1$ en $c_k$ et n'est non nulle que sur $]\frac1{k+1}, \frac1k[$. Ces intervalles sont deux à deux disjoints : en chaque point, la somme $S = \sum_k b_k$ a au plus un terme non nul.

      Pourtant $S$ n'est pas continue en $0$, puisque $S(0) = 0$ et $S(c_k) = 1$, avec $c_k \to 0$ : la famille des $\{b_k \neq 0\}$ n'est pas localement finie en $0$, et la conclusion du point (i) de {{gd-partition|Partitions de l'unité}} tombe. Avec $1 - S$, positive puisque $\theta$ est croissante et que $b_k \leqslant 1$, on obtiendrait même une famille de somme $1$ dont un terme n'est pas continu.
      ```schema lex-localement-fini-2
      Les bosses $b_k$, de hauteur $1$, se resserrent vers $0$, où la somme $S$ vaut $0$ : chaque point n'est sous qu'une bosse au plus, mais tout voisinage de $0$ en rencontre une infinité.
      ```
    - |
      Une famille localement finie dans un ouvert peut cesser de l'être dans l'espace entier. Les singletons $\{1/k\}$, $k \geqslant 1$, forment une famille localement finie de $]0, +\infty[$, mais pas de $\mathbb R$, dont le point $0$ a des voisinages qui les rencontrent presque tous. Dans $]0, +\infty[$, l'[[adherence|adhérence]] de leur réunion est la réunion des singletons, comme l'annonce le point (i) de {{gd-partition|Partitions de l'unité}}. Dans $\mathbb R$, elle contient en plus $0$, qui n'est dans l'adhérence d'aucun d'eux : sans finitude locale, l'adhérence d'une réunion n'est plus la réunion des adhérences.

  partition-unite:
    - |
      Sur $\lex{ensemble-reels}{\mathbb R}$, recouvert par $U_1 = \,]{-\infty}, 1[$ et $U_2 = \,]{-1}, +\infty[$, posons, avec la fonction $\theta$ du nœud {{ex-plateau|Fonction plate en 0}},
      $$\begin{aligned} D(x) &= \theta(x + \tfrac12) + \theta(\tfrac12 - x), \\ \chi_1(x) &= \frac{\theta(\frac12 - x)}{D(x)}, \\ \chi_2(x) &= \frac{\theta(x + \frac12)}{D(x)}. \end{aligned}$$
      Le dénominateur ne s'annule pas, puisque $x > -\frac12$ ou $x < \frac12$ : les fonctions $\chi_1$ et $\chi_2$ sont lisses et positives, et $\chi_1 + \chi_2 = 1$. L'ensemble $\{\chi_1 \neq 0\} = \,]{-\infty}, \frac12[$ a pour [[adherence|adhérence]] $]{-\infty}, \frac12]$, contenue dans $U_1$, et de même $\overline{\{\chi_2 \neq 0\}} = [-\frac12, +\infty[ \subset U_2$ : c'est une partition de l'unité subordonnée à $(U_1, U_2)$.
      ```schema lex-partition-unite-1
      Les fonctions $\chi_1$, en bleu, et $\chi_2$, en rouge, sont positives et de somme $1$. Chacune est nulle d'un côté du segment $[-\frac12, \frac12]$ et vaut $1$ de l'autre, et les ensembles où elles ne s'annulent pas restent à distance du bord de leur ouvert, $1$ pour $U_1$, $-1$ pour $U_2$.
      ```
    - |
      La partition de l'unité recolle des données locales qui ne s'accordent pas. Avec celle du premier exemple, les fonctions $f_1 = -1$ sur $U_1$ et $f_2 = 1$ sur $U_2$, qui diffèrent sur $U_1 \cap U_2$, donnent
      $$f = \chi_1 f_1 + \chi_2 f_2 = \chi_2 - \chi_1,$$
      où chaque produit $\chi_i f_i$ est prolongé par $0$ hors de $U_i$. C'est une fonction lisse sur $\mathbb R$, égale à $-1$ sur $]{-\infty}, -\frac12]$ et à $1$ sur $[\frac12, +\infty[$. Le prolongement par $0$ est lisse parce que $\overline{\{\chi_i \neq 0\}}$ est contenu dans $U_i$ : il est lisse sur $U_i$ et sur l'ouvert complémentaire de cette adhérence, où il est nul, et ces deux ouverts recouvrent $\mathbb R$ ({{gd-partition|Partitions de l'unité}}, (i)).

      Sans cette condition, le recollement échoue. Les fonctions $\tilde\chi_1 = \theta(1 - x)/\tilde D$ et $\tilde\chi_2 = \theta(x)/\tilde D$, avec $\tilde D = \theta(1 - x) + \theta(x) > 0$, sont lisses, positives, de somme $1$, et nulles hors de $U_1$ et de $U_2$, mais $\overline{\{\tilde\chi_1 \neq 0\}} = \,]{-\infty}, 1]$ n'est pas contenu dans $U_1$. Pour $f_1(x) = e^{2/(1 - x)}$, lisse sur $U_1$, le produit $\tilde\chi_1f_1$ vaut $e^{1/(1 - x)}/\tilde D(x)$ pour $0 < x < 1$, et tend vers $+\infty$ en $1$ : prolongé par $0$, il n'est même pas continu.
    - |
      Une partition de l'unité peut avoir une infinité de fonctions. Sur $\mathbb R$, recouvert par les intervalles $U_k = \,]k - 1, k + 1[$, $k \in \lex{ensemble-entiers-relatifs}{\mathbb Z}$, posons $b_k(x) = \theta\big(\frac9{16} - (x - k)^2\big)$, non nulle exactement sur $]k - \frac34, k + \frac34[$. La famille de ces intervalles est [[localement-fini|localement finie]], un intervalle de longueur $\frac12$ n'en rencontrant que deux au plus, et tout réel est à distance au plus $\frac12$ d'un entier, si bien que $S = \sum_k b_k$ est lisse et strictement positive ({{gd-partition|Partitions de l'unité}}, (i)).

      Les fonctions $\chi_k = b_k/S$ forment une partition de l'unité subordonnée à $(U_k)_{k \in \mathbb Z}$, puisque $[k - \frac34, k + \frac34] \subset U_k$, construite sans aucun choix. Plus loin, la forme volume du nœud {{gd-forme-volume|Forme volume}}, (iii), s'obtient de cette façon, en recollant les formes $dz_1 \wedge \cdots \wedge dz_n$ des cartes directes.

  variete-produit:
    - |
      Le cylindre $\lex{sphere-unite}{S^1} \times \lex{ensemble-reels}{\mathbb R}$ est une variété de dimension $1 + 1 = 2$, d'atlas produit $\{\sigma_+ \times \mathrm{id},\ \sigma_- \times \mathrm{id}\}$, où $\sigma_\pm$ sont les projections stéréographiques de (ii). Le changement de carte est
      $$(z, t) \mapsto (1/z,\ t) \quad (z \neq 0),$$
      produit du changement de carte $z \mapsto 1/z$ du cercle et de l'identité. C'est aussi la partie $\{x^2 + y^2 = 1\}$ de $\lex{n-uplet}{\mathbb R^3}$, et le point (iii) assure que la structure de sous-variété et la structure produit coïncident : il n'y a pas à choisir entre les deux descriptions.
    - |
      Le produit $T = S^1 \times S^1$ est une variété de dimension $2$, qui se réalise dans $\mathbb R^4$ comme l'ensemble des $(x_1, x_2, x_3, x_4)$ tels que $x_1^2 + x_2^2 = 1$ et $x_3^2 + x_4^2 = 1$. Son atlas produit a quatre cartes $\sigma_a \times \sigma_b$, $a, b \in \{+, -\}$, dont la réunion des domaines est $T$, puisque chaque facteur est recouvert par les domaines de $\sigma_+$ et $\sigma_-$. Les changements de carte sont $(z, w) \mapsto (1/z, w)$, $(z, 1/w)$ ou $(1/z, 1/w)$, selon que l'on change de carte sur le premier facteur, sur le second ou sur les deux. Le produit de trois cercles donne de même une variété de dimension $3$, à huit cartes.

  differentielle-exterieure:
    - |
      Sur $\lex{n-uplet}{\mathbb R^3}$, la forme $\omega = xy\,dz$ a pour différentielle extérieure
      $$\begin{aligned} d\omega &= (y\,dx + x\,dy) \wedge dz \\ &= y\,dx \wedge dz + x\,dy \wedge dz, \end{aligned}$$
      et l'on constate $d(d\omega) = 0$ : $d(y\,dx \wedge dz) = dy \wedge dx \wedge dz$ et $d(x\,dy \wedge dz) = dx \wedge dy \wedge dz$ sont opposées, puisque $dy \wedge dx = -dx \wedge dy$. C'est le point (ii), qui repose ici sur l'égalité des dérivées croisées de $xy$.
    - |
      Le signe de la formule de Leibniz (i) se voit sur $\omega = x\,dy$ et $\eta = z\,dx$, de degré $1$, dans $\mathbb R^3$. Le produit $\omega \wedge \eta = xz\,dy \wedge dx = -xz\,dx \wedge dy$ a pour différentielle
      $$\begin{aligned} &-(z\,dx + x\,dz) \wedge dx \wedge dy \\ &\quad = -x\,dx \wedge dy \wedge dz. \end{aligned}$$
      D'autre part $d\omega \wedge \eta = dx \wedge dy \wedge z\,dx = 0$ et $\omega \wedge d\eta = x\,dy \wedge dz \wedge dx = x\,dx \wedge dy \wedge dz$. On trouve bien $d\omega \wedge \eta - \omega \wedge d\eta$ ; avec le signe $+$, que l'on serait tenté d'écrire par analogie avec la dérivée d'un produit, le résultat serait faux.
    - |
      L'égalité $d \circ d = 0$ demande des coefficients assez réguliers. La fonction $f(x, y) = xy\frac{x^2 - y^2}{x^2 + y^2}$, prolongée par $0$ en l'origine, vérifie $\partial_x f(0, y) = -y$ et $\partial_y f(x, 0) = x$ ({{gd-schwarz|Schwarz, intégrales à paramètre}}, remarque). Si l'on appliquait la formule de $d$ à $\partial_x f\,dx + \partial_y f\,dy$, dont les coefficients ne sont pas de classe $C^\infty$, le coefficient de $dx \wedge dy$ en $0$ serait $\partial_x(\partial_y f) - \partial_y(\partial_x f) = 1 - (-1) = 2$, et non $0$. Plus loin, le nœud {{gd-formes-varietes|Formes sur une variété}} définit $d$ sur une variété, carte par carte, grâce à la commutation de $d$ aux images réciproques.

  forme-fermee:
    - |
      Sur $\mathbb R^2$, la $1$-forme $\omega = y\,dx + x\,dy$ est fermée, et même [[forme-exacte|exacte]] : c'est la différentielle de la fonction $xy$. Le calcul direct le confirme,
      $$d\omega = dy \wedge dx + dx \wedge dy = 0,$$
      puisque $dy \wedge dx = -\,dx \wedge dy$. C'est l'exemple de l'implication « exacte entraîne fermée ».
    - |
      La forme $\omega = x\,dy$ n'est pas fermée sur $\mathbb R^2$, puisque $d\omega = dx \wedge dy \neq 0$ ; elle n'est donc pas exacte non plus. Il suffit ainsi de trouver $d\omega \neq 0$ pour savoir qu'une forme n'est la différentielle d'aucune forme : c'est le critère pratique que fournit $d \circ d = 0$. Une forme fermée, en revanche, peut ne pas être exacte (exemple suivant).
    - |
      Sur $U = \mathbb R^2 \setminus \{0\}$, la forme
      $$\omega = \frac{x\,dy - y\,dx}{x^2 + y^2}$$
      est fermée. En notant $P = -\frac{y}{x^2 + y^2}$ et $Q = \frac{x}{x^2 + y^2}$ ses coefficients, on a $d\omega = (\partial_x Q - \partial_y P)\,dx \wedge dy$, et
      $$\partial_x Q = \partial_y P = \frac{y^2 - x^2}{(x^2 + y^2)^2},$$
      de sorte que $d\omega = 0$. Plus loin, le critère du nœud {{dr-fermees|Formes exactes sur les cycles}} montrera qu'elle n'est pas exacte, car son intégrale le long du cercle unité vaut $2\pi$ et non $0$ : sur un ouvert troué, fermée n'entraîne pas exacte.

  forme-exacte:
    - |
      Une forme exacte a beaucoup de primitives. Sur $\lex{n-uplet}{\mathbb R^2}$, la [[forme-differentielle|forme]] $dx \wedge dy$ est exacte : c'est $d(x\,dy)$, et c'est aussi $d(-y\,dx) = -dy \wedge dx$, par la définition de la [[differentielle-exterieure|différentielle extérieure]]. Les deux primitives diffèrent de $x\,dy + y\,dx = d(xy)$, elle-même exacte. En général, si $d\eta = d\eta'$, la linéarité de $d$ ({{gd-formes|Formes différentielles}}, (i)) donne $d(\eta - \eta') = 0$ : deux primitives d'une même forme diffèrent d'une forme [[forme-fermee|fermée]].
    - |
      En degré $1$, on cherche une primitive en intégrant un coefficient après l'autre. La forme $\omega = e^x\cos y\,dx - e^x\sin y\,dy$ sur $\mathbb R^2$ est fermée, puisque
      $$d\omega = (-e^x\sin y + e^x\sin y)\,dx \wedge dy = 0.$$
      Si $\partial_x f = e^x\cos y$, la fonction $x \mapsto f(x, y) - e^x\cos y$ a, pour chaque $y$, une dérivée nulle sur $\mathbb R$ : $f = e^x\cos y + c(y)$, et $\partial_y f = -e^x\sin y$ impose $c' = 0$ : la fonction $f = e^x\cos y$ convient, et $df = \omega$.

      C'est la seule à une constante près : si $dg = \omega$, la différentielle de $f - g$ est nulle sur le [[partie-convexe|convexe]] $\mathbb R^2$, et l'inégalité des accroissements finis ({{gd-accroissements|Accroissements finis}}, (ii)), avec $M = 0$, rend $f - g$ constante.
    - |
      Une forme fermée n'est pas toujours exacte. Sur $U = \mathbb R^2 \setminus \{0\}$, la forme
      $$\omega = \frac{x\,dy - y\,dx}{x^2 + y^2}$$
      est fermée, comme le calcule le troisième exemple de [[forme-fermee|forme fermée]]. Si l'on avait $\omega = df$, la fonction $g(t) = f(\cos t, \sin t)$ aurait pour dérivée, par la règle de la chaîne ({{gd-differentielle|Applications différentiables}}, (iv)),
      $$\begin{aligned} g'(t) &= \omega_{(\cos t, \sin t)}(-\sin t, \cos t) \\ &= \cos^2 t + \sin^2 t = 1. \end{aligned}$$

      La fonction $g(t) - t$, de dérivée nulle, serait constante, et $g(2\pi) - g(0) = 2\pi$. Or $(\cos 2\pi, \sin 2\pi) = (1, 0)$ ({{tg-cercle|Paramétrage du cercle}}, (i) et (ii)), donc $g(2\pi) = g(0)$ : c'est impossible, et $\omega$ n'est pas exacte. Plus loin, le lemme de Poincaré ({{gd-poincare|Lemme de Poincaré}}) exclut ce phénomène sur un ouvert étoilé : c'est le trou en $0$ qui l'autorise.

  meme-orientation:
    - |
      Dans $\lex{n-uplet}{\mathbb R^2}$, la base $\big((1, 1), (-1, 1)\big)$ a même orientation que la [[base-canonique-kn|base canonique]], et la base $\big((1, 1), (1, -1)\big)$ l'orientation opposée : les [[matrice-passage|matrices de passage]] ont pour [[determinant|déterminants]]
      $$\det\begin{pmatrix} 1 & -1 \\ 1 & 1 \end{pmatrix} = 2,$$
      $$\det\begin{pmatrix} 1 & 1 \\ 1 & -1 \end{pmatrix} = -2.$$
      Les deux bases ont le même premier vecteur : c'est le second qui décide.
      ```schema lex-meme-orientation-1
      Le vecteur $u = (1, 1)$ est commun aux deux bases. Complété par le vecteur bleu $v = (-1, 1)$, il donne une base de même orientation que la base canonique, en gris ; complété par le vecteur rouge $w = (1, -1)$, une base d'orientation opposée. Les petits arcs fléchés vont du premier vecteur de chaque base au second : ils tournent dans le sens de $e_1$ vers $e_2$ pour la base bleue, dans l'autre sens pour la rouge.
      ```
    - |
      En dimension $1$, deux bases $(v)$ et $(w)$ ont même orientation si et seulement si $w = \lambda v$ avec $\lambda > 0$, la matrice de passage étant la matrice $1 \times 1$ de coefficient $\lambda$. Les deux orientations de $\lex{ensemble-reels}{\mathbb R}$ sont donc les deux demi-droites ouvertes $]0, +\infty[$ et $]{-\infty}, 0[$, chaque vecteur non nul étant une base : orienter une droite, c'est choisir un sens de parcours.
    - |
      Deux bases que l'on peut déformer continûment l'une en l'autre, en restant parmi les bases, ont même orientation. Si $t \mapsto (u_1(t), \dots, u_n(t))$ est continue sur $[0, 1]$ et forme une base pour chaque $t$, le déterminant de passage de la base canonique à $(u_i(t))$ est continu et ne s'annule pas : par le théorème des valeurs intermédiaires ({{c-tvi|Valeurs intermédiaires}}), il garde un signe constant. Ainsi la rotation $\big((\cos t, \sin t), (-\sin t, \cos t)\big)$, de déterminant $1$, relie $(e_1, e_2)$ à $(e_2, -e_1)$ pour $t \in [0, \frac\pi2]$, alors qu'aucune déformation continue parmi les bases ne relie $(e_1, e_2)$ à $(e_2, e_1)$.

  atlas-oriente:
    - |
      Être orienté est une propriété d'un atlas, non de la variété. Sur $\lex{ensemble-reels}{\mathbb R}$, l'[[atlas]] formé de $(\mathbb R, \mathrm{id})$ et de $(]0, +\infty[, x \mapsto -x)$ n'est pas orienté : le changement de carte $x \mapsto -x$ a pour dérivée $-1$. La droite est pourtant orientable, puisque l'atlas $\{\mathrm{id}\}$ est orienté, et il suffit de remplacer la seconde carte par sa composée avec $\rho(z) = -z$, qui est la restriction de $\mathrm{id}$, pour obtenir un atlas orienté ({{gd-orientation|Orientation}}, (ii)).
    - |
      Sur le cercle $\lex{sphere-unite}{S^1}$, l'atlas stéréographique $\{\sigma_+, \sigma_-\}$ n'est pas orienté : le changement de carte $z \mapsto 1/z$ a pour dérivée $-1/z^2 < 0$. Son domaine $\mathbb R \setminus \{0\}$ a deux composantes, images des deux demi-cercles ouverts $x > 0$ et $x < 0$, et la dérivée est négative sur l'une comme sur l'autre ; c'est ce qui permet, en remplaçant $\sigma_-$ par $\rho \circ \sigma_-$, d'obtenir le changement de carte $z \mapsto -1/z$, de dérivée $1/z^2 > 0$ partout, donc un atlas orienté. Si le signe avait changé d'une composante à l'autre, aucune composition par $\rho$ n'aurait rétabli l'accord sur les deux à la fois.
    - |
      Un produit d'atlas orientés est orienté, mais un produit d'atlas non orientés ne l'est pas forcément. Sur $S^1 \times S^1$, muni de la [[variete-produit|structure produit]], les cartes $\sigma_+ \times \sigma_+$ et $\sigma_- \times \sigma_+$ ont pour changement de carte $(z, w) \mapsto (1/z, w)$, dont la matrice jacobienne a pour déterminant $-1/z^2 < 0$ : le produit de l'atlas $\{\sigma_+, \sigma_-\}$ par lui-même n'est pas orienté, bien que le changement de carte de $\sigma_+ \times \sigma_+$ à $\sigma_- \times \sigma_-$, $(z, w) \mapsto (1/z, 1/w)$, ait une matrice jacobienne de déterminant $1/(z^2w^2) > 0$. Pour le produit de $\{\sigma_+, \rho \circ \sigma_-\}$ par lui-même, chaque matrice jacobienne est diagonale, de déterminant produit de deux dérivées positives : cet atlas est orienté, et $S^1 \times S^1$ est orientable.

  image-reciproque-forme:
    - |
      L'image réciproque par un changement de variables bien choisi simplifie la forme angle. Soit $\varphi(r, t) = (r\cos t, r\sin t)$, de $V = \,]0, +\infty[ \times \mathbb R$ dans $U = \lex{n-uplet}{\mathbb R^2} \setminus \{0\}$. Comme $\varphi^*(dx_i) = d\varphi_i$ ({{gd-formes|Formes différentielles}}, preuve de (iii)),
      $$\begin{aligned} \varphi^*(dx) &= \cos t\,dr - r\sin t\,dt, \\ \varphi^*(dy) &= \sin t\,dr + r\cos t\,dt, \end{aligned}$$
      et, pour $\omega = \frac{x\,dy - y\,dx}{x^2 + y^2}$, on trouve $\varphi^*\omega = dt$, ainsi que $\varphi^*(dx \wedge dy) = r\,dr \wedge dt$, le coefficient $r$ étant le [[determinant|déterminant]] de la [[matrice-jacobienne|matrice jacobienne]] de $\varphi$.

      La forme $dt$ est exacte sur $V$, alors que $\omega$ ne l'est pas sur $U$ (troisième exemple de [[forme-exacte|forme exacte]]) : les primitives de $dt$ sur le convexe $V$, qui sont les $t + c$, ne s'écrivent pas $f \circ \varphi$, puisque $\varphi(r, t) = \varphi(r, t + 2\pi)$.
    - |
      La commutation de $\varphi^*$ avec $d$, point (iii) de {{gd-formes|Formes différentielles}}, se constate sur $\eta = x\,dy$, avec l'application $\varphi$ du premier exemple. D'une part $d\eta = dx \wedge dy$, et $\varphi^*(d\eta) = r\,dr \wedge dt$. D'autre part
      $$\begin{aligned} \varphi^*\eta &= r\cos t\,(\sin t\,dr + r\cos t\,dt) \\ &= r\sin t\cos t\,dr + r^2\cos^2 t\,dt, \end{aligned}$$
      dont la [[differentielle-exterieure|différentielle extérieure]] est
      $$\begin{aligned} &(2r\cos^2 t - r\cos 2t)\,dr \wedge dt \\ &\quad = r\,dr \wedge dt, \end{aligned}$$
      puisque $\cos 2t = 2\cos^2 t - 1$ : les deux calculs donnent la même forme.
    - |
      L'image réciproque n'est pas injective. Pour la courbe $\gamma(t) = (\cos t, \sin t)$, de $\mathbb R$ dans $U = \mathbb R^2 \setminus \{0\}$, la forme $\gamma^*(dx \wedge dy)$, de degré $2$ sur un ouvert de $\mathbb R$, est nulle, puisque $\Lambda^2(\mathbb R) = \{0\}$ ({{v-algebre-exterieure|Algèbre extérieure}}, (i)) ; la forme $dx \wedge dy$, elle, ne s'annule nulle part. Pour la forme angle $\omega$ du premier exemple, au contraire, $\gamma^*\omega = dt$, puisque $\omega_{\gamma(t)}(\gamma'(t)) = 1$. Plus loin, l'intégrale de $\omega$ le long de $\gamma$ ({{gd-integrale-curviligne|Intégrale d'une 1-forme}}) est exactement l'intégrale du coefficient de $\gamma^*\omega$.

  cartes-compatibles:
    - |
      La compatibilité se demande dans les deux sens. Sur $\lex{ensemble-reels}{\mathbb R}$, les [[carte|cartes]] $\mathrm{id}$ et $\varphi(x) = x^3$ ont pour changement de carte $\varphi \circ \mathrm{id}^{-1} = \varphi$, de classe $C^\infty$, mais la réciproque $y \mapsto \sqrt[3]y$ n'est pas dérivable en $0$ : ces cartes ne sont pas compatibles. Un changement de carte $C^\infty$ dans un seul sens ne suffit pas.
    - |
      Le théorème d'inversion locale fournit des cartes compatibles. L'application $g(x) = x^3 + x$ est continue et strictement croissante, de dérivée $3x^2 + 1 > 0$, et tend vers $\pm\infty$ en $\pm\infty$ : c'est un [[homeomorphisme|homéomorphisme]] de $\mathbb R$ sur $\mathbb R$ ({{c-bijection|Théorème de la bijection}}), donc une carte. Sa dérivée ne s'annulant pas, le théorème d'inversion locale ({{gd-inversion-locale|Inversion locale}}) donne, au voisinage de chaque point, une réciproque locale de classe $C^\infty$, qui coïncide avec $g^{-1}$ : $g^{-1}$ est de classe $C^\infty$, et $g$ est compatible avec $\mathrm{id}$. C'est l'annulation de $\varphi'$ en $0$ qui empêchait, dans le premier exemple, la compatibilité de $x^3$ : si $\varphi^{-1}$ était dérivable en $0$, la règle de la chaîne donnerait $(\varphi^{-1})'(0)\,\varphi'(0) = 1$, avec $\varphi'(0) = 0$.
    - |
      La compatibilité n'est pas transitive. Avec les cartes $\mathrm{id}$ et $\varphi(x) = x^3$ de $\mathbb R$ du premier exemple, la restriction $\chi$ de $\varphi$ à $]0, +\infty[$ est compatible avec $\mathrm{id}$, puisque $x \mapsto x^3$ et $y \mapsto \sqrt[3]y$ sont de classe $C^\infty$ sur $]0, +\infty[$, et avec $\varphi$, le changement de carte $\varphi \circ \chi^{-1}$ étant l'identité de $]0, +\infty[$. Pourtant $\mathrm{id}$ et $\varphi$ ne sont pas compatibles. La carte $\chi$ ne voit pas le point $0$, où se loge le défaut : c'est pourquoi la preuve de l'énoncé, pour comparer deux cartes en un point, passe par une carte de l'atlas définie en ce point.
