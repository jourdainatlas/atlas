# Exemples du lexique : théorie « Probabilités » (proba).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  espace-probabilise:
    - |
      Deux lancers d'une pièce équilibrée se modélisent par $\Omega = \{\mathrm P, \mathrm F\}^2$, muni de toutes ses parties et de la [[probabilite|probabilité]] qui donne le poids $\frac14$ à chacun des quatre résultats. L'événement « au moins un pile » est $\{\mathrm{PP}, \mathrm{PF}, \mathrm{FP}\}$, de probabilité $\frac34$, et son contraire « deux faces » est le singleton $\{\mathrm{FF}\}$.
    - |
      Une même expérience admet plusieurs espaces probabilisés, et aucun n'est le bon. Sur $\Omega' = [0, 1[$, muni des boréliens contenus dans $[0, 1[$ et de la [[mesure-lebesgue|mesure de Lebesgue]], décidons que le premier lancer donne pile si $\omega < \frac12$, et le second si $\omega \in [0, \frac14[ \,\cup\, [\frac12, \frac34[$. Chacun des quatre résultats correspond à un intervalle de longueur $\frac14$, et « au moins un pile », complémentaire de $[\frac34, 1[$, a encore la probabilité $\frac34$. Seules comptent les probabilités des événements qui décrivent l'expérience, non la nature des points de $\Omega$.
    - |
      La [[tribu]] des événements traduit l'information disponible. Sur $\Omega = \{\mathrm P, \mathrm F\}^2$, la tribu $\mathcal A = \{\varnothing, \{\mathrm{PP}, \mathrm{PF}\}, \{\mathrm{FP}, \mathrm{FF}\}, \Omega\}$ ne retient que le résultat du premier lancer, et $(\Omega, \mathcal A, P)$, avec $P$ égale à $\frac12$ sur les deux parties non triviales, est encore un espace probabilisé. Mais « le second lancer donne pile », soit $\{\mathrm{PP}, \mathrm{FP}\}$, n'appartient pas à $\mathcal A$ : ce n'est pas un événement de cet espace, et sa probabilité n'y est pas définie.

  independance:
    - |
      L'indépendance est une égalité numérique, non une absence de lien de cause. Pour deux dés, avec la [[probabilite|probabilité]] uniforme sur $\{1, \dots, 6\}^2$, les événements $A$ « le premier dé est pair » et $B$ « la somme vaut $7$ » sont indépendants, bien que la somme dépende du premier dé : $A \cap B$ contient les trois couples $(2, 5)$, $(4, 3)$ et $(6, 1)$, et $P(A \cap B) = \frac1{12} = \frac12 \cdot \frac16$. À l'inverse, deux événements disjoints de probabilités non nulles ne sont jamais indépendants, puisque $P(A \cap B) = 0 < P(A)\,P(B)$.
    - |
      Pour trois événements, la formule produit doit valoir pour chaque sous-famille, et non pour la seule famille entière. Sur $\Omega = \{1, \dots, 8\}$ muni de la probabilité uniforme, soient $A = B = \{1, 2, 3, 4\}$ et $C = \{1, 5, 6, 7\}$, tous de probabilité $\frac12$. On a $P(A \cap B \cap C) = P(\{1\}) = \frac18 = \frac12 \cdot \frac12 \cdot \frac12$, mais $P(A \cap B) = \frac12 \neq \frac14$ : les trois événements ne sont pas indépendants.
    - |
      La [[mesure-produit|mesure produit]] fabrique des tribus indépendantes. Sur $[0, 1]^2$, muni de $\lambda \otimes \lambda$, où $\lambda$ est la mesure de Lebesgue restreinte à $[0, 1]$, les tribus $\{A \times [0, 1]\}$ et $\{[0, 1] \times B\}$, $A$ et $B$ boréliens de $[0, 1]$, sont indépendantes. L'intersection $(A \times [0, 1]) \cap ([0, 1] \times B)$ est en effet le pavé $A \times B$, de mesure $\lambda(A)\,\lambda(B)$, produit des mesures des deux événements. Tirer un point au hasard dans le carré rend ainsi indépendants les événements qui ne portent que sur l'abscisse et ceux qui ne portent que sur l'ordonnée.

  variable-aleatoire:
    - |
      Une variable aléatoire se fabrique à partir d'un nombre tiré uniformément. Sur $\Omega = [0, 1[$, muni de la [[mesure-lebesgue|mesure de Lebesgue]], la fonction $X(\omega) = -\ln(1 - \omega)$ est continue, donc [[fonction-borelienne|borélienne]] : c'est une variable aléatoire, à valeurs dans $[0, +\infty[$. Pour $t \geqslant 0$, l'événement $\{X > t\}$ est l'intervalle $]1 - e^{-t}, 1[$, d'où
      $$P(X > t) = e^{-t},$$
      le [[logarithme]] étant la réciproque de l'[[exponentielle]]. Le tirage uniforme de $\omega$ produit ainsi une durée dont la probabilité de dépasser $t$ décroît exponentiellement.
    - |
      Être une variable aléatoire dépend de la [[tribu]] des événements. Sur $\Omega = \{\mathrm P, \mathrm F\}^2$, muni de la tribu $\mathcal A = \{\varnothing, \{\mathrm{PP}, \mathrm{PF}\}, \{\mathrm{FP}, \mathrm{FF}\}, \Omega\}$ du premier lancer, le nombre de piles obtenus au second lancer n'est pas une variable aléatoire : l'ensemble où il vaut $1$ est $\{\mathrm{PP}, \mathrm{FP}\}$, qui n'est pas dans $\mathcal A$. Le nombre de piles du premier lancer en est une. Si l'on munit $\Omega$ de toutes ses parties, toute fonction réelle sur $\Omega$ devient une variable aléatoire.
    - |
      Une variable aléatoire peut simuler un dé sur un espace qui n'a rien d'un dé. Sur $\Omega = [0, 1[$ muni de la mesure de Lebesgue, la variable $X(\omega) = \lfloor 6\omega \rfloor + 1$ vaut $k$ exactement sur $[\frac{k-1}6, \frac k6[$, de probabilité $\frac16$, pour $k = 1, \dots, 6$. Elle a la même [[loi-variable|loi]] que la face d'un dé équilibré, bien que $\Omega$ soit un intervalle : la loi oublie l'espace sur lequel la variable est définie.

  loi-variable:
    - |
      La loi de la somme $S$ de deux dés équilibrés est une [[probabilite|probabilité]] portée par $\{2, \dots, 12\}$. Sur $\Omega = \{1, \dots, 6\}^2$ muni de la probabilité uniforme, l'événement $\{S = k\}$ contient $6 - |k - 7|$ couples, de sorte que
      $$P_S = \sum_{k=2}^{12} \frac{6 - |k - 7|}{36}\,\delta_k,$$
      où $\delta_k$ est la mesure de Dirac en $k$. Pour un borélien $B$, $P_S(B)$ est la somme des poids des entiers de $B$ ; ainsi $P_S([0, 4]) = \frac{1 + 2 + 3}{36} = \frac16$.
      ```schema lex-loi-variable-1
      Les poids de la loi de $S$ sur $\{2, \dots, 12\}$, en multiples de $\frac1{36}$ : ils croissent de $1$ à $6$ jusqu'à $k = 7$, puis décroissent symétriquement, et leur somme vaut $36$.
      ```
    - |
      La loi ne détermine pas la [[variable-aleatoire|variable]]. Sur $\Omega = [0, 1]$, muni des boréliens et de la [[mesure-lebesgue|mesure de Lebesgue]], les variables $X(\omega) = \omega$ et $Y(\omega) = 1 - \omega$ ont la même [[fonction-repartition|fonction de répartition]], puisque, pour $x \in [0, 1]$, $P(Y \leqslant x) = \lambda([1 - x, 1]) = x = P(X \leqslant x)$. Elles ont donc la même loi, la loi uniforme sur $[0, 1]$ ({{p-variables|Variables aléatoires}}, (i)). Pourtant $X = Y$ seulement en $\omega = \frac12$, événement de probabilité nulle.
    - |
      Les lois de $X$ et de $Y$ ne déterminent ni la loi du couple, ni celle de la somme. Toujours avec $X(\omega) = \omega$ et $Y(\omega) = 1 - \omega$ sur $[0, 1]$, on a $P(X + X \leqslant 1) = P(X \leqslant \frac12) = \frac12$, alors que $X + Y = 1$ est constante, et $P(X + Y \leqslant 1) = 1$. Les couples $(X, X)$ et $(X, Y)$ ont des composantes de même loi, mais des lois différentes. Pour des variables indépendantes, la loi du couple est au contraire la [[mesure-produit|mesure produit]] des lois ({{p-variables|Variables aléatoires}}, (iii)).

  esperance:
    - |
      L'espérance se calcule sur la [[loi-variable|loi]], par le transfert ({{p-esperance|Espérance, variance}}, (i)). Pour la face $X$ d'un dé équilibré, de loi uniforme sur $\{1, \dots, 6\}$,
      $$\begin{aligned} E[X] &= \frac{1 + 2 + \cdots + 6}6 = \frac72, \\ E[X^2] &= \frac{1 + 4 + \cdots + 36}6 = \frac{91}6. \end{aligned}$$
      L'espérance $\frac72$ n'est pas une valeur que prend $X$ : c'est une moyenne pondérée, non un résultat typique. Pour une variable uniforme sur $[0, 1]$, de même, $E[U] = \int_0^1 x\,dx = \frac12$ et $E[U^2] = \frac13$.
    - |
      L'espérance est linéaire, mais elle ne commute ni avec les fonctions non affines, ni avec les produits de variables dépendantes. Pour la face $X$ d'un dé, $E[\frac1X] = \frac16(1 + \frac12 + \cdots + \frac16) = \frac{49}{120}$, alors que $\frac1{E[X]} = \frac27$, plus petit. Et $E[X \cdot X] = \frac{91}6$ n'est pas $E[X]^2 = \frac{49}4$ : l'égalité $E[XY] = E[X]\,E[Y]$ du point (iv) demande l'indépendance, que $X$ n'a pas avec elle-même.
    - |
      Une variable positive, finie en tout point, peut avoir une espérance infinie. Sur $\Omega = [0, 1[$ muni de la [[mesure-lebesgue|mesure de Lebesgue]], posons $X(\omega) = \lfloor \frac1{1 - \omega} \rfloor$, à valeurs dans $\{1, 2, \dots\}$. Pour tout entier $k \geqslant 0$, $X > k$ équivaut à $\frac1{1 - \omega} \geqslant k + 1$, d'où $P(X > k) = \frac1{k+1}$. La formule $E[X] = \sum_{k \geqslant 0} P(X > k)$ d'une remarque de {{p-esperance|Espérance, variance}} donne alors $E[X] = \sum_k \frac1{k+1} = +\infty$, somme qui diverge par sommation par paquets.

  loi-poisson:
    - |
      Une variable de loi de Poisson est paire plus souvent qu'impaire. La formule $\sum_k \frac{x^k}{k!} = e^x$ vaut pour tout réel $x$ ({{ex-serie|Série de l'exponentielle}}, (i)) ; en l'appliquant à $x = \lambda$ et à $x = -\lambda$ et en faisant la demi-somme, on ne garde que les termes pairs :
      $$P(X \text{ pair}) = e^{-\lambda}\,\frac{e^\lambda + e^{-\lambda}}2 = \frac{1 + e^{-2\lambda}}2.$$
      Cette probabilité dépasse $\frac12$ pour tout $\lambda > 0$, et vaut environ $0{,}568$ pour $\lambda = 1$ : l'excès vient du poids $e^{-\lambda}$ de la valeur $0$, qui est paire.
    - |
      L'égalité de l'espérance et de la [[variance]] ne caractérise pas la loi de Poisson. La variable $X$ qui vaut $0$ et $2$ avec probabilité $\frac12$ chacune vérifie $E[X] = 1$ et $E[X^2] = 2$, donc $\operatorname{Var} X = 1 = E[X]$. Elle n'est pourtant pas de loi de Poisson, puisque $P(X = 1) = 0$, alors que la seule loi de Poisson d'espérance $1$, celle de paramètre $1$, donne à $1$ la probabilité $e^{-1}$.
    - |
      La somme de deux variables indépendantes de lois de Poisson de paramètres $\lambda$ et $\mu$ suit la loi de Poisson de paramètre $\lambda + \mu$ ; de telles variables existent, par exemple les coordonnées de $\mathbb N^2$ muni de la [[mesure-produit|mesure produit]] des deux lois. Pour tout entier $n$, l'événement $\{X + Y = n\}$ est la réunion disjointe des $\{X = k, Y = n - k\}$, $0 \leqslant k \leqslant n$, d'où, par indépendance puis par la formule du binôme ({{pol-binome|Binôme de Newton}}),
      $$\begin{aligned} &P(X + Y = n) \\ &= \sum_{k=0}^n e^{-\lambda}\frac{\lambda^k}{k!}\, e^{-\mu}\frac{\mu^{n-k}}{(n - k)!} \\ &=e^{-(\lambda + \mu)}\,\frac{(\lambda + \mu)^n}{n!}. \end{aligned}$$
      Le nombre total d'événements rares de deux sources indépendantes est encore un nombre d'événements rares.

  ensemble-cantor:
    - |
      L'ensemble de Cantor contient d'autres points que les extrémités des tiers retirés. Les extrémités $a_c$ et $a_c + 3^{-N}$ des segments $S_c$ sont des fractions de dénominateur une puissance de $3$, et $\frac14$ n'en est pas une, puisque $3^N$ est impair. Pourtant $\frac14 \in K$ : c'est $X(\frac13)$, dont la remarque de {{p-cantor|Loi de Cantor}} donne la valeur, et $X$ prend ses valeurs dans $K$, par le point (ii). Le milieu $\frac12$, lui, n'est pas dans $K$, puisqu'il tombe dans le premier tiers retiré $]\frac13, \frac23[$.
      ```schema lex-ensemble-cantor-1
      Les segments de $K_1$, $K_2$ et $K_3$, en bleu, de haut en bas, et le point $\frac14$, en rouge, qui reste dans un segment à chaque étape sans jamais en être une extrémité. Le point $\frac12$, en vert, est éliminé dès la première étape.
      ```
    - |
      Une somme de deux ensembles [[negligeable|négligeables]] peut être un segment : $K + K = [0, 2]$. Pour $y \in [0, 1[$, les chiffres $e_k = \lfloor 3^k y \rfloor - 3\lfloor 3^{k-1} y \rfloor$ appartiennent à $\{0, 1, 2\}$ et $y = \sum_{k \geqslant 1} e_k 3^{-k}$, par le calcul télescopique des chiffres binaires du nœud {{p-normaux|Nombres normaux}}, mené en base $3$. Écrivons $2e_k = a_k + b_k$ avec $a_k, b_k \in \{0, 2\}$, soit $0 + 0$, $2 + 0$ ou $2 + 2$. Les sommes partielles de $a = \sum_k a_k 3^{-k}$ sont des $a_c$, et le reste est au plus $3^{-N}$, donc $a$ appartient à chaque $K_N$ ; de même pour $b$. Ainsi $2y = a + b$ avec $a, b \in K$, et $2 = 1 + 1$ achève de couvrir $[0, 2]$.
    - |
      Le complémentaire de $K$ dans $[0, 1]$ est la réunion disjointe des tiers retirés, et sa mesure confirme que $K$ est négligeable. À l'étape $N$, on retire $2^N$ intervalles ouverts de longueur $3^{-N-1}$, et ces intervalles, pris à toutes les étapes, sont deux à deux disjoints. Leur longueur totale vaut
      $$\sum_{N \in \mathbb N} \frac{2^N}{3^{N+1}} = \frac13 \cdot \frac1{1 - \frac23} = 1,$$
      d'où $\lambda(K) = \lambda([0, 1]) - 1 = 0$, la soustraction étant permise puisque la mesure est finie.

  loi-cantor:
    - |
      La loi de Cantor se calcule sur les segments de $K_N$, qui reçoivent chacun la probabilité $2^{-N}$. Sa [[fonction-repartition|fonction de répartition]] $F$ vaut donc $\frac12$ sur $[\frac13, \frac23]$ et $\frac14$ sur $[\frac19, \frac29]$. Comme $\frac23$ s'écrit $0{,}1010\ldots$ en base $2$, on a
      $$X(\tfrac23) = \sum_{j \geqslant 1} \frac{2}{3^{2j-1}} = \frac34,$$
      et la relation $F(X(\omega)) = \omega$ ({{p-cantor|Loi de Cantor}}, (iii)) donne $F(\frac34) = \frac23$. Avec $F(\frac14) = \frac13$, obtenu de même, on voit que $F$ prend des valeurs non dyadiques en des points qui ne sont les extrémités d'aucun tiers retiré.
    - |
      La loi de Cantor a pour espérance $\frac12$ et pour [[variance]] $\frac18$, plus que la variance $\frac1{12}$ de la loi uniforme sur $[0, 1]$ : sa masse est rejetée vers les bords. Les chiffres $d_k$ sont des variables de Bernoulli de paramètre $\frac12$, indépendantes ({{p-normaux|Nombres normaux}}, (i)), de variance $\frac14$. La somme partielle $X_N = \sum_{k \leqslant N} 2d_k 3^{-k}$ a donc pour espérance $\sum_{k \leqslant N} 3^{-k}$ et pour variance $\sum_{k \leqslant N} 4 \cdot \frac14 \cdot 9^{-k}$ ({{p-esperance|Espérance, variance}}, (iv)), qui tendent vers $\frac12$ et $\frac18$. Comme $0 \leqslant X - X_N \leqslant 3^{-N}$, l'espérance et le second moment passent à la limite.
    - |
      La loi de Cantor ne charge aucun point, et pourtant sa fonction de répartition ne fournit aucune densité. Sur chaque tiers retiré, intervalle ouvert qui ne rencontre pas $K$ et donc de probabilité nulle, $F$ est constante, si bien que $F' = 0$ sur la réunion de ces tiers, qui est de mesure $1$ dans $[0, 1]$, puisque $\lambda(K) = 0$. Prendre pour densité la dérivée $F'$, définie presque partout, donnerait $\int_0^1 F'(x)\,dx = 0$ au lieu de $1$, et $\int_0^1 x\,F'(x)\,dx = 0$ au lieu de l'espérance $\frac12$ : la fonction $F$, continue et croissante de $0$ à $1$, n'est pas l'intégrale de sa dérivée.

  loi-normale:
    - |
      Toute loi normale se ramène à la loi $\mathcal N(0, 1)$, dont la [[fonction-repartition|fonction de répartition]] $\Phi$ vérifie $\Phi(-t) = 1 - \Phi(t)$, la densité étant paire. Si $Y$ suit $\mathcal N(2, \frac14)$, elle a la loi de $2 + \frac12 X$ avec $X$ de loi $\mathcal N(0, 1)$ ({{p-normale|Loi normale}}, (ii)), d'où $P(Y \leqslant 2{,}5) = P(X \leqslant 1) = \Phi(1) \approx 0{,}841$. De même $P(|X| \leqslant 1) = 2\Phi(1) - 1 \approx 0{,}683$ : une variable normale tombe à moins d'un écart $\sigma$ de sa moyenne dans un peu plus de deux cas sur trois.
    - |
      Deux variables normales de covariance nulle peuvent avoir une somme qui n'est pas normale. Soient $X$ de loi $\mathcal N(0, 1)$ et $\varepsilon$, indépendante de $X$, valant $1$ et $-1$ avec probabilité $\frac12$ chacune, réalisées sur $\mathbb R \times \{-1, 1\}$ muni de la [[mesure-produit|mesure produit]] de leurs lois. La variable $Y = \varepsilon X$ suit $\mathcal N(0, 1)$, puisque $P(Y \leqslant t) = \frac12 \Phi(t) + \frac12 P(-X \leqslant t) = \Phi(t)$. Sa covariance avec $X$ est $E[\varepsilon X^2] = E[\varepsilon]\,E[X^2] = 0$. Mais $X + Y = (1 + \varepsilon)X$ est nulle avec probabilité $\frac12$, ce qu'interdit une loi à densité : l'indépendance du point (iii) de {{p-normale|Loi normale}} ne se remplace pas par une covariance nulle.
    - |
      Les queues de la loi normale sont bien plus minces que ne le dit l'inégalité de Bienaymé-Tchebychev. Pour $X$ de loi $\mathcal N(0, 1)$, de [[variance]] $1$, l'inégalité donne $P(|X| \geqslant 2) \leqslant \frac14$, alors que le calcul numérique de l'intégrale de la densité donne $P(|X| \geqslant 2) \approx 0{,}0455$ et $P(|X| \geqslant 3) \approx 0{,}0027$, contre la borne $\frac19$. Une intégration par parties, comme au point (ii), donne aussi $E[X^4] = 3\,E[X^2] = 3$. Plus loin, le théorème central limite fera de cette loi celle des fluctuations des sommes de variables indépendantes ({{p-tcl|Théorème central limite}}).

  variance:
    - |
      La variance mesure la dispersion autour de l'[[esperance|espérance]]. Pour la face $X$ d'un dé équilibré, $E[X] = \frac72$ et $E[X^2] = \frac{91}6$, d'où $\operatorname{Var} X = \frac{91}6 - \frac{49}4 = \frac{35}{12}$, dont la racine carrée, environ $1{,}71$, donne l'ordre de grandeur de l'écart à la moyenne. Pour une [[variable-aleatoire|variable]] $U$ uniforme sur $[0, 1]$, $\operatorname{Var} U = \frac13 - \frac14 = \frac1{12}$ ; plus généralement $\operatorname{Var}(aX + b) = a^2 \operatorname{Var} X$, la constante $b$ ne déplaçant que l'espérance.
    - |
      La variance d'une somme n'est la somme des variances que pour des variables de covariance nulle, par exemple indépendantes ({{p-esperance|Espérance, variance}}, (iv)). Pour la face $X$ d'un dé, $\operatorname{Var}(X + X) = \operatorname{Var}(2X) = 4\operatorname{Var} X$, et non $2\operatorname{Var} X$. Avec $Y = 7 - X$, face opposée du dé, la somme $X + Y = 7$ est constante, de variance nulle, alors que $\operatorname{Var} X + \operatorname{Var} Y = \frac{35}6$.
    - |
      L'inégalité de Bienaymé-Tchebychev est optimale. Pour la variable $X$ qui vaut $1$ et $-1$ avec probabilité $\frac12$ chacune, $E[X] = 0$ et $\operatorname{Var} X = 1$, et
      $$P(|X - E[X]| \geqslant 1) = 1 = \frac{\operatorname{Var} X}{1^2} :$$
      la majoration est une égalité. À l'autre extrême, une variance nulle force $X = E[X]$ [[presque-partout|presque partout]], l'intégrale de la fonction positive $(X - E[X])^2$ étant nulle ({{m-integrale|Intégrale positive}}, (iv)).

  covariance:
    - |
      La covariance se développe comme un produit, $\operatorname{Cov}(X, Y + Z) = \operatorname{Cov}(X, Y) + \operatorname{Cov}(X, Z)$, par linéarité de l'espérance, ce qui la rend facile à calculer. Pour deux dés, avec la probabilité uniforme sur $\{1, \dots, 6\}^2$, les faces $D_1$ et $D_2$ sont [[independance|indépendantes]], les poids étant des produits. La somme $S = D_1 + D_2$ vérifie donc
      $$\begin{aligned} \operatorname{Cov}(D_1, S) &= \operatorname{Var} D_1 + \operatorname{Cov}(D_1, D_2) \\ &= \frac{35}{12} + 0 = \frac{35}{12}. \end{aligned}$$
      La somme est corrélée positivement à chacun des dés, comme on l'attend : un grand premier dé fait une grande somme.
    - |
      Une covariance nulle n'entraîne pas l'indépendance. Soit $X$ la [[variable-aleatoire|variable]] qui vaut $-1$, $0$ et $1$ avec probabilité $\frac13$ chacune, et $Y = X^2$. Alors $E[X] = 0$ et $E[XY] = E[X^3] = 0$, d'où $\operatorname{Cov}(X, Y) = 0$. Pourtant $Y$ est une fonction de $X$, et $P(X = 0, Y = 1) = 0$, alors que $P(X = 0)\,P(Y = 1) = \frac13 \cdot \frac23$ : les deux variables ne sont pas indépendantes.
    - |
      La covariance est bornée par les variances, avec égalité pour une relation affine. L'inégalité de Cauchy-Schwarz ({{p-esperance|Espérance, variance}}, (ii)), appliquée à $X - E[X]$ et $Y - E[Y]$, donne $|\operatorname{Cov}(X, Y)| \leqslant \sqrt{\operatorname{Var} X \operatorname{Var} Y}$. Pour $U$ uniforme sur $[0, 1]$ et $Y = 1 - U$, on trouve $\operatorname{Cov}(U, 1 - U) = -\operatorname{Var} U = -\frac1{12}$, et la borne est atteinte : $\operatorname{Var} Y = \operatorname{Var} U = \frac1{12}$, la covariance est négative, et $Y$ décroît quand $U$ croît.

  densite-probabilite:
    - |
      Le maximum de deux nombres tirés indépendamment et uniformément dans $[0, 1]$ a pour densité $2x$ sur $[0, 1]$. Sur $\Omega = [0, 1]^2$, muni de la [[mesure-produit|mesure produit]] $\lambda \otimes \lambda$, les coordonnées $U$ et $V$ sont uniformes et indépendantes ({{p-variables|Variables aléatoires}}, (iii)). Pour $x \in [0, 1]$, l'événement $\{\max(U, V) \leqslant x\}$ est le pavé $[0, x]^2$, de probabilité $x^2$. Comme $\int_0^x 2t\,dt = x^2$ ({{m-riemann|Riemann et Lebesgue}}), la loi de $\max(U, V)$ et la probabilité de densité $2t\,\mathbf 1_{[0, 1]}(t)$ ont la même [[fonction-repartition|fonction de répartition]], donc sont égales ({{p-variables|Variables aléatoires}}, (i)).
    - |
      Une densité n'est pas une probabilité, et elle peut être non bornée. Si $U$ est uniforme sur $[0, 1]$, la variable $U^2$ vérifie $P(U^2 \leqslant x) = P(U \leqslant \sqrt x) = \sqrt x$ pour $x \in [0, 1]$, et elle a pour densité $f(x) = \frac1{2\sqrt x}$ sur $]0, 1]$, puisque $\int_\varepsilon^x f = \sqrt x - \sqrt\varepsilon$ tend vers $\sqrt x$ quand $\varepsilon$ tend vers $0$, par convergence monotone. Cette densité dépasse $1$ sur $]0, \frac14[$ et n'est pas majorée. Elle n'est d'ailleurs définie qu'à un ensemble négligeable près : la modifier sur $\lex{ensemble-rationnels}{\mathbb Q}$ ne change aucune intégrale.
      ```schema lex-densite-probabilite-2
      En bleu, la densité $2x$ du maximum de deux uniformes ; en rouge, la densité $\frac1{2\sqrt x}$ de $U^2$, qui part à l'infini en $0$. Les deux aires sous les courbes valent $1$, bien que la courbe rouge dépasse $1$ près de $0$.
      ```
    - |
      Une loi peut n'avoir aucune densité. La loi de la variable constante $X = 0$ est la mesure de Dirac $\delta_0$ ; si elle avait une densité $f$, on aurait $1 = P(X = 0) = \int_{\{0\}} f(x)\,dx = 0$, le singleton $\{0\}$ étant négligeable pour la mesure de Lebesgue. Toute loi qui charge un point est dans ce cas. Plus loin, la loi de Cantor ne chargera aucun point et n'aura pourtant pas de densité ({{p-cantor|Loi de Cantor}}).

  convergence-presque-sure:
    - |
      La convergence presque sûre tolère un ensemble négligeable de points où la suite ne converge pas, ou pas vers la limite. Sur $\Omega = [0, 1]$, muni de la [[mesure-lebesgue|mesure de Lebesgue]], les variables $X_n(\omega) = \omega^n$ tendent vers $0$ en tout $\omega < 1$, et valent $1$ en $\omega = 1$. Comme $\{1\}$ est de probabilité nulle, $X_n \to 0$ presque sûrement, bien que la convergence vers $0$ n'ait pas lieu partout.
    - |
      La convergence presque sûre n'entraîne pas la [[convergence-moyenne|convergence en moyenne]]. Sur $[0, 1]$ muni de la mesure de Lebesgue, soit $X_n = n\,\mathbf 1_{]0, 1/n]}$. Pour $\omega > 0$, $X_n(\omega) = 0$ dès que $n > \frac1\omega$, et $X_n(0) = 0$ pour tout $n$ : la suite tend vers $0$ en tout point. Pourtant $E[X_n] = n \cdot \frac1n = 1$ pour tout $n$, et $E[|X_n - 0|]$ ne tend pas vers $0$. La masse se concentre sur un intervalle de plus en plus court, que la limite ponctuelle ne voit pas.
    - |
      Une convergence presque sûre ne s'améliore pas toujours en convergence partout. Plus loin, le théorème de Borel montrera que, pour presque tout $\omega \in [0, 1[$, la proportion de $1$ parmi les $n$ premiers chiffres binaires de $\omega$ tend vers $\frac12$ ({{p-normaux|Nombres normaux}}, (ii)). Mais elle vaut $0$ pour $\omega = 0$, et tend vers $\frac13$ pour $\omega = \frac17$, dont les chiffres binaires sont $0, 0, 1$ répétés indéfiniment : l'ensemble exceptionnel, négligeable, n'est pas vide.

  convergence-probabilite:
    - |
      La convergence en probabilité n'entraîne pas la [[convergence-presque-sure|convergence presque sûre]], même pour des indicatrices d'intervalles qui rétrécissent. Sur $\Omega = [0, 1[$ muni de la [[mesure-lebesgue|mesure de Lebesgue]], posons $s_0 = 0$ et $s_n = 1 + \frac12 + \cdots + \frac1n$, et soit $A_n$ l'ensemble des $\omega$ tels que $\omega + m \in [s_{n-1}, s_n[$ pour un entier $m$. C'est l'intervalle $[s_{n-1}, s_n[$ enroulé sur $[0, 1[$, de mesure $\frac1n$, de sorte que $X_n = \mathbf 1_{A_n}$ tend vers $0$ en probabilité.

      Mais $s_n$ tend vers $+\infty$, par sommation par paquets, avec des pas $\frac1n \leqslant 1$. Pour tout $\omega$ et tout entier $m \geqslant 1$, le réel $\omega + m$ tombe donc dans l'un des $[s_{n-1}, s_n[$, et des $m$ distincts donnent des $n$ distincts dès que $n \geqslant 2$. Ainsi $X_n(\omega) = 1$ pour une infinité de $n$, et $X_n(\omega)$ ne tend vers $0$ pour aucun $\omega$.
      ```schema lex-convergence-probabilite-1
      La ligne $n$ montre, en bleu, l'ensemble $A_n$ pour $n$ de $1$ à $12$ : l'intervalle de longueur $\frac1n$ avance sur $[0, 1[$ et repart de $0$ quand il atteint $1$. La verticale rouge $\omega = 0{,}7$ est rencontrée par les lignes $1$, $3$ et $8$, et le sera encore à chaque tour suivant.
      ```
    - |
      La limite en probabilité est unique, à un ensemble négligeable près. Si $X_n$ tend vers $X$ et vers $Y$ en probabilité, alors, pour $\varepsilon > 0$, l'inégalité $|X - Y| \leqslant |X - X_n| + |X_n - Y|$ donne
      $$\begin{aligned} &P(|X - Y| > 2\varepsilon) \\ &\leqslant P(|X_n - X| > \varepsilon) \\ &\quad + P(|X_n - Y| > \varepsilon), \end{aligned}$$
      qui tend vers $0$. Donc $P(|X - Y| > 2\varepsilon) = 0$ pour tout $\varepsilon$, et, par réunion sur $\varepsilon = \frac1{k+1}$, $X = Y$ [[presque-partout|presque partout]].
    - |
      Une suite qui converge en probabilité a une suite extraite qui converge presque sûrement ({{p-convergences|Modes de convergence}}, (iii)), et l'on peut parfois la désigner explicitement. Pour les indicatrices $X_n = \mathbf 1_{A_n}$ des intervalles enroulés de longueur $\frac1n$, $P(A_n) = \frac1n$, et la suite extraite $X_{2^k}$ vérifie $\sum_k P(A_{2^k}) = \sum_k 2^{-k} < +\infty$. Par le lemme de Borel-Cantelli ({{p-borel-cantelli|Borel-Cantelli}}, (i)), presque sûrement, seul un nombre fini des $A_{2^k}$ contient $\omega$ : la suite $X_{2^k}$ tend vers $0$ presque sûrement.

  convergence-moyenne:
    - |
      La convergence en moyenne contrôle l'espérance de l'écart, pas celle de son carré. Sur $\Omega = [0, 1]$ muni de la [[mesure-lebesgue|mesure de Lebesgue]], soit $X_n = \sqrt n\,\mathbf 1_{[0, 1/n]}$. Alors $E[|X_n|] = \frac{\sqrt n}n = \frac1{\sqrt n}$ tend vers $0$ : $X_n \to 0$ en moyenne. Mais $E[X_n^2] = n \cdot \frac1n = 1$ pour tout $n$ : les valeurs de plus en plus grandes, sur un ensemble de plus en plus petit, ne pèsent plus dans la moyenne, mais pèsent encore dans la moyenne du carré.
    - |
      La convergence des espérances n'entraîne pas la convergence en moyenne. Sur $[0, 1]$, posons $X_n = \mathbf 1_{[0, 1/2[}$ pour $n$ pair et $X_n = \mathbf 1_{[1/2, 1]}$ pour $n$ impair. Toutes ces variables ont l'espérance $\frac12$, mais $E[|X_{n+1} - X_n|] = 1$ pour tout $n$. Si $X_n$ tendait en moyenne vers une variable $X$, l'inégalité $E[|X_{n+1} - X_n|] \leqslant E[|X_{n+1} - X|] + E[|X_n - X|]$ ferait tendre ce terme vers $0$ : aucune limite en moyenne n'existe.
    - |
      Une convergence presque sûre dominée est une convergence en moyenne : c'est le théorème de convergence dominée ({{m-convergence-dominee|Convergence dominée}}, (i)). Les variables $X_n(\omega) = \omega^n$ sur $[0, 1]$ tendent presque sûrement vers $0$ et sont majorées par la constante $1$, intégrable pour une probabilité ; elles tendent donc vers $0$ en moyenne, et l'on vérifie directement que $E[X_n] = \int_0^1 \omega^n\,d\omega = \frac1{n+1}$. Sans domination, la conclusion tombe : $n\,\mathbf 1_{]0, 1/n]}$ tend vers $0$ en tout point, avec une espérance constamment égale à $1$.

  probabilite-conditionnelle:
    - |
      Conditionner par $B$ ou par $A$ ne donne pas le même nombre. Pour deux dés, avec $\Omega = \{1, \dots, 6\}^2$ et la [[probabilite|probabilité]] uniforme, soit $A$ l'événement « la somme vaut $8$ », qui contient cinq couples, et $B$ « le premier dé donne $3$ », qui en contient six. Leur intersection est le seul couple $(3, 5)$, d'où
      $$\begin{aligned} P(A \mid B) &= \frac{1/36}{6/36} = \frac16, \\ P(B \mid A) &= \frac{1/36}{5/36} = \frac15. \end{aligned}$$
    - |
      Une probabilité conditionnelle est additive en l'événement conditionné, pas en l'événement conditionnant. Pour deux dés, avec $A$ « la somme vaut $8$ », $B$ « le premier dé donne $3$ » et $C$ « le premier dé donne $4$ », on trouve $P(A \mid B) = P(A \mid C) = \frac16$, et aussi $P(A \mid B \cup C) = \frac{2/36}{12/36} = \frac16$, et non $\frac13$. Pour $B$ et $C$ disjoints, $P(A \mid B \cup C)$ est la moyenne de $P(A \mid B)$ et de $P(A \mid C)$ pondérée par $P(B)$ et $P(C)$, comme dans la formule des probabilités totales ({{p-espace|Espace probabilisé}}, (ii)).
    - |
      Les probabilités conditionnelles servent aussi à construire un modèle. On choisit l'urne $U_1$ avec probabilité $\frac13$, qui contient deux boules rouges et une bleue, ou l'urne $U_2$ avec probabilité $\frac23$, qui contient une rouge et trois bleues, puis une boule au hasard dans l'urne choisie. Sur $\Omega = \{1, 2\} \times \{\mathrm r, \mathrm b\}$, les poids $\frac29$, $\frac19$, $\frac16$ et $\frac12$ de $(1, \mathrm r)$, $(1, \mathrm b)$, $(2, \mathrm r)$, $(2, \mathrm b)$ réalisent ces données. La formule des probabilités totales donne $P(\text{rouge}) = \frac13 \cdot \frac23 + \frac23 \cdot \frac14 = \frac7{18}$, et celle de Bayes $P(U_1 \mid \text{rouge}) = \frac{2/9}{7/18} = \frac47$.

  fonction-repartition:
    - |
      Une fonction de répartition peut avoir à la fois un saut et une partie continue. Sur $\Omega = [0, 1]$ muni de la [[mesure-lebesgue|mesure de Lebesgue]], la [[variable-aleatoire|variable]] $X(\omega) = \max(\omega, \frac12)$ a pour fonction de répartition $F(x) = 0$ pour $x < \frac12$, $F(x) = x$ pour $\frac12 \leqslant x < 1$ et $F(x) = 1$ pour $x \geqslant 1$. Pour $\frac12 \leqslant x \leqslant 1$, en effet, $\{X \leqslant x\} = [0, x]$. Le saut en $\frac12$, de hauteur $F(\frac12) - \lim_{x \to 1/2,\, x < 1/2} F(x) = \frac12$, est la probabilité $P(X = \frac12) = \lambda([0, \frac12])$.
      ```schema lex-fonction-repartition-1
      La fonction de répartition de $\max(\omega, \frac12)$ : nulle avant $\frac12$, elle saute de $\frac12$ en ce point, où le point plein marque la valeur prise, puis croît comme $x$ jusqu'à $1$. Le saut est l'atome de la loi en $\frac12$, la pente la partie sans atome.
      ```
    - |
      Une fonction [[application-croissante|croissante]], de limites $0$ en $-\infty$ et $1$ en $+\infty$, n'est pas forcément une fonction de répartition : il faut aussi la continuité à droite. La fonction $G$ nulle sur $]{-\infty}, 0]$ et égale à $1$ sur $]0, +\infty[$ n'est la fonction de répartition d'aucune variable, puisque $G(0) = 0$ alors que $G(\frac1n) = 1$ pour tout $n \geqslant 1$. La fonction nulle sur $]{-\infty}, 0[$ et égale à $1$ sur $[0, +\infty[$, qui ne diffère de $G$ qu'en $0$, est celle de la variable constante $X = 0$. Avec $P(X < x)$ au lieu de $P(X \leqslant x)$, on aurait obtenu $G$ : c'est la convention $\leqslant$ qui place la valeur au saut du côté droit.
    - |
      La fonction de répartition permet de reconstruire la variable, par la fonction quantile $Q(u) = \inf\{x : F(x) \geqslant u\}$, pour $u \in \,]0, 1[$. Pour la fonction de répartition $F$ de $\max(\omega, \frac12)$, $Q(u) = \frac12$ si $u \leqslant \frac12$, puisque $F(\frac12) = \frac12$ et que $F$ est nulle avant $\frac12$, et $Q(u) = u$ si $\frac12 < u < 1$. Ainsi $Q(\omega) = \max(\omega, \frac12)$ pour $0 < \omega < 1$ : on retrouve $X$. Plus loin, cette construction donnera, pour toute fonction croissante, continue à droite, de limites $0$ et $1$, une variable dont elle est la fonction de répartition ({{p-suites-iid|Suites indépendantes}}, (ii)).

  tribu-asymptotique:
    - |
      Pour une suite d'événements $(A_n)$, dont les indicatrices forment la suite étudiée, l'événement « une infinité des $A_n$ est réalisée » est asymptotique. Notons $\mathcal T_n = \sigma(A_k : k \geqslant n)$, la [[tribu-engendree|tribu engendrée]] par les $A_k$ d'indice au moins $n$. L'événement $\limsup A_n = \bigcap_m \bigcup_{k \geqslant m} A_k$ s'écrit aussi $\bigcap_{m \geqslant n} \bigcup_{k \geqslant m} A_k$ pour tout $n$, les réunions $\bigcup_{k \geqslant m} A_k$ décroissant avec $m$ : il appartient à chaque $\mathcal T_n$, donc à leur intersection $\mathcal T$. Il en va de même de « tous les $A_n$ sont réalisés [[a-partir-certain-rang|à partir d'un certain rang]] ». En revanche, $A_0$ lui-même n'a en général aucune raison d'être dans $\mathcal T$.
    - |
      Sans [[independance|indépendance]], la tribu asymptotique peut contenir des événements de probabilité strictement comprise entre $0$ et $1$. Sur $\Omega = [0, 1]$ muni de la [[mesure-lebesgue|mesure de Lebesgue]], prenons $A_n = [0, \frac12]$ pour tout $n$. Chaque $\mathcal T_n$ est alors $\{\varnothing, A_0, A_0^c, \Omega\}$, et leur intersection aussi : l'événement $A_0$, de probabilité $\frac12$, est asymptotique. La loi du $0$-$1$ tombe, faute d'indépendance, puisque la suite répète indéfiniment le même événement.

  probabilite:
    - |
      Le lancer de deux dés se modélise par $\Omega = \{1, \dots, 6\}^2$, muni de $\lex{ensemble-parties}{\mathcal P}(\Omega)$ et de la probabilité qui donne à chacun des trente-six couples le poids $\frac1{36}$ : $P(A)$ est le nombre d'éléments de $A$ divisé par $36$. L'événement « la somme vaut $7$ » contient six couples et a la probabilité $\frac16$, l'événement « la somme vaut $12$ » un seul, de probabilité $\frac1{36}$. La probabilité est la fonction $A \mapsto P(A)$ tout entière, que l'on évalue ici en deux événements.
    - |
      Il n'existe pas de probabilité « uniforme » sur $\lex{ensemble-entiers-naturels}{\mathbb N}$, c'est-à-dire donnant le même poids à tous les entiers. Si $P(\{n\}) = c$ pour tout $n$, la σ-additivité donne $P(\mathbb N) = \sum_n c$, qui vaut $0$ si $c = 0$ et $+\infty$ si $c > 0$, puisque les sommes partielles $Nc$ ne sont pas majorées : jamais $1$. La [[mesure]] de comptage, qui donne à chaque entier le poids $1$, est σ-finie, mais aucun multiple ne la rend de masse $1$.
    - |
      Une probabilité peut donner la valeur $0$ à un événement non vide, et la valeur $1$ à un événement qui n'est pas $\Omega$. Sur $\Omega = [0, 1]$, muni des boréliens contenus dans $[0, 1]$ et de la restriction $P$ de la [[mesure-lebesgue|mesure de Lebesgue]], de masse $\lambda([0, 1]) = 1$, l'événement « $\omega$ est rationnel » a la probabilité $0$, puisque $\lex{ensemble-rationnels}{\mathbb Q} \cap [0, 1]$ est dénombrable. Son contraire a la probabilité $1$ sans être certain, et l'événement « le premier chiffre décimal de $\omega$ est $3$ », soit $[0{,}3 ; 0{,}4[$, a la probabilité $\frac1{10}$.
