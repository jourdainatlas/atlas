# Exemples du lexique : théorie « Analyse fonctionnelle » (anf).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  convergence-uniforme-compact:
    - |
      Un facteur qui s'annule là où la convergence simple est la plus lente peut rendre la convergence uniforme. Sur $K = [0, 1]$, les fonctions $f_n(x) = x^n(1 - x)$ tendent vers $0$ en tout point, et leur maximum, atteint en $\frac n{n+1}$ par l'étude de la dérivée, vaut $\big(\frac n{n+1}\big)^n\frac1{n+1} \leqslant \frac1{n+1}$. La convergence est donc uniforme, alors que celle des $x^n$ ne l'est pas ({{fc-uniforme|Convergence uniforme}}).
    - |
      Une suite de fonctions continues peut converger simplement vers une fonction continue sans converger uniformément. Sur $[0, 1]$, les fonctions $f_n(x) = nx(1 - x)^n$ tendent vers $0$ en tout point, puisque, pour $0 < x < 1$ et $c = -\ln(1 - x) > 0$, on a $n(1 - x)^n = \frac1c\,(nc)\,e^{-nc}$, qui tend vers $0$ ({{ex-croissances|Croissances comparées}}, (iii)) ; pour $x = 0$ et $x = 1$, $f_n(x) = 0$. Pourtant $f_n(\frac1{2n}) = \frac12\big(1 - \frac1{2n}\big)^n \geqslant \frac12\big(1 - \frac n{2n}\big) = \frac14$, par l'inégalité $(1 - t)^n \geqslant 1 - nt$ pour $0 \leqslant t \leqslant 1$, qui se démontre par récurrence comme celle de Bernoulli : $\|f_n\|_\infty \geqslant \frac14$ pour tout $n$.
      ```schema lex-convergence-uniforme-compact-2
      Les fonctions $f_2$, $f_5$ et $f_{20}$, en gris, bleu et rouge : leur bosse se déplace vers $0$ et sa hauteur, qui croît vers $\frac1e \approx 0{,}37$, reste au-dessus de la droite pointillée de hauteur $\frac14$. En tout point fixé, les valeurs finissent par tendre vers $0$, mais aucun rang ne convient pour tous les points à la fois.
      ```
    - |
      Le point (iii) de {{fc-uniforme|Convergence uniforme}} détecte qu'une convergence n'est pas uniforme. Sur $[0, 1]$, les fonctions $x \mapsto x^{1/n}$ tendent vers la fonction égale à $1$ sur $]0, 1]$ et à $0$ en $0$, qui n'est pas continue : la convergence n'est pas uniforme. Sur $K = [\delta, 1]$, avec $0 < \delta < 1$, l'écart maximal est $1 - \delta^{1/n} = 1 - \exp(\frac{\ln \delta}n)$, qui tend vers $0$ : la convergence y est uniforme. Plus loin, le théorème de Dini l'expliquera sans calcul, la suite étant croissante et sa limite continue sur ce compact ({{fc-dini|Théorème de Dini}}).

  espace-norme:
    - |
      En dimension infinie, un sous-espace n'est pas toujours fermé. L'espace $E$ des [[suite-bornee|suites réelles bornées]], muni de $\|x\|_\infty = \sup_n |x_n|$, est un espace vectoriel normé, et les suites nulles à partir d'un certain rang en forment un sous-espace $F$. La suite $a = (\frac1{n+1})$ n'est pas dans $F$, mais elle est limite des suites tronquées $s_N = (1, \frac12, \dots, \frac1{N+1}, 0, 0, \dots)$, qui sont dans $F$, puisque $\|a - s_N\|_\infty = \frac1{N+2}$.
      ```schema lex-espace-norme-1
      Les termes de la suite $a$, en gris, et ceux de la suite tronquée $s_5$, en rouge, qui coïncident jusqu'au rang $5$ et s'annulent ensuite. L'écart le plus grand entre les deux est au rang $6$, où il vaut $\frac17$ : c'est la distance de $a$ à $s_5$ pour la norme de la borne supérieure.
      ```
      Par le point (i) de {{f-evn|Espaces normés}}, sens direct, $F$ n'est donc pas fermé. En dimension finie, au contraire, un sous-espace est toujours fermé, puisqu'il est complet ({{gd-equivalence|Normes en dimension finie}}, (iv)) et qu'une partie complète est fermée ({{me-cauchy|Espaces complets}}, (iii)).
    - |
      Un même espace vectoriel porte des normes qui ne définissent pas les mêmes suites convergentes. Sur l'espace $F$ des suites réelles nulles à partir d'un certain rang, $\|x\|_\infty = \max_n |x_n|$ et $\|x\|_1 = \sum_n |x_n|$, somme finie, sont deux normes, avec $\|x\|_\infty \leqslant \|x\|_1$. La suite $x^{(N)}$ dont les $N + 1$ premiers termes valent $\frac1{N+1}$, et les suivants $0$, vérifie $\|x^{(N)}\|_\infty = \frac1{N+1}$ et $\|x^{(N)}\|_1 = 1$ : elle tend vers $0$ pour la première norme, et non pour la seconde. Aucune constante $\beta$ ne vérifie donc $\|\cdot\|_1 \leqslant \beta\|\cdot\|_\infty$, ce qui ne peut arriver en dimension finie ({{gd-equivalence|Normes en dimension finie}}, (iv)).
    - |
      L'intégrale de la valeur absolue est une norme sur les fonctions continues, mais pas sur les fonctions intégrables au sens de Riemann. Si $f$ est continue sur $[0, 1]$ et $f(x_0) \neq 0$, alors $|f| \geqslant \frac12|f(x_0)|$ sur un intervalle non réduit à un point contenant $x_0$, si bien que $\int_0^1 |f| > 0$ ; l'homogénéité et l'[[inegalite-triangulaire|inégalité triangulaire]] viennent de celles de la [[valeur-absolue|valeur absolue]]. L'indicatrice de $\{\frac12\}$, [[riemann-integrable|intégrable au sens de Riemann]] et d'intégrale nulle, n'est pourtant pas nulle : sur ce plus grand espace, la condition $\|x\| = 0 \Rightarrow x = 0$ tombe. Plus loin, l'espace $L^1$ réparera ce défaut en identifiant les fonctions égales presque partout ({{f-lp|Espaces L¹ et L²}}).

  banach:
    - |
      Le critère des séries absolument convergentes, au point (iii) de {{f-evn|Espaces normés}}, détecte vite un espace qui n'est pas complet. Sur l'espace $F$ des suites nulles à partir d'un certain rang, muni de $\|x\|_\infty = \max_n |x_n|$, la série $\sum_n 2^{-n}e_n$, où $e_n$ est nulle sauf un $1$ en position $n$, vérifie $\sum_n \|2^{-n}e_n\|_\infty = 2$. Ses sommes partielles sont les suites $(1, \frac12, \dots, 2^{-N}, 0, \dots)$, et une limite $x$ dans $F$ aurait pour coordonnées les $2^{-n}$, puisque $|x_n - y_n| \leqslant \|x - y\|_\infty$ ; elle ne serait pas nulle à partir d'un rang. La série ne converge donc pas dans $F$, qui n'est pas un espace de Banach.
    - |
      L'espace des suites qui tendent vers $0$, muni de $\|x\|_\infty = \sup_n |x_n|$, est un espace de Banach. Celui des [[suite-bornee|suites bornées]] en est un : une suite de Cauchy y converge coordonnée par coordonnée, et l'inégalité $|x^{(k)}_n - x^{(l)}_n| \leqslant \varepsilon$, pour $k, l \geqslant N$ et tout $n$, passe à la limite en $l$. Les suites de limite nulle y forment un sous-espace fermé : si $\|x^{(k)} - x\|_\infty \leqslant \varepsilon$ et $x^{(k)}_n \to 0$, alors $|x_n| \leqslant 2\varepsilon$ pour $n$ grand. Le point (iv) de {{f-evn|Espaces normés}} conclut.
    - |
      La complétude dépend de la norme. Sur l'espace des fonctions continues sur $[0, 1]$, muni de $N(f) = \int_0^1 |f|$, les rampes $f_n$, nulles sur $[0, \frac12 - \frac1n]$, égales à $1$ sur $[\frac12, 1]$ et affines entre les deux, vérifient $N(f_n - f_m) \leqslant \frac1{2n}$ pour $m \geqslant n \geqslant 2$ : elles forment une suite de Cauchy. Une limite continue $g$ vérifierait $\int_{1/2}^1 |1 - g| \leqslant N(f_n - g) \to 0$, donc $g = 1$ sur $[\frac12, 1]$, et de même $g = 0$ sur chaque $[0, \frac12 - \delta]$, donc $g(\frac12) = 0$ par continuité : c'est contradictoire. Plus loin, dans l'espace $L^1$ des classes de fonctions intégrables ({{f-lp|Espaces L¹ et L²}}), ces fonctions auront une limite, la classe de l'indicatrice de $[\frac12, 1]$, dont elles sont à distance $\frac1{2n}$.

  dual-topologique:
    - |
      La norme d'une forme linéaire dépend de la norme de l'espace, et le dual échange certaines normes. Sur $\mathbb R^n$, la forme $\varphi(x) = \sum_i a_ix_i$ a pour norme $\sum_i |a_i|$ quand on munit $\mathbb R^n$ de $\|x\|_\infty = \max_i |x_i|$, atteinte en $x_i = \pm 1$ du signe de $a_i$. Pour $\|x\|_1 = \sum_i |x_i|$, sa norme est $\max_i |a_i|$, atteinte en un vecteur de la [[base-canonique-kn|base canonique]]. Le dual de $(\mathbb R^n, \|\cdot\|_\infty)$ s'identifie ainsi à $(\mathbb R^n, \|\cdot\|_1)$, et réciproquement.
    - |
      Le dual contient des formes qui ne s'écrivent pas comme des séries. Sur l'espace des suites convergentes, muni de $\|x\|_\infty = \sup_n |x_n|$, la forme $\ell(x) = \lim_n x_n$ est linéaire et continue, de norme $1$, puisque $|\lim x_n| \leqslant \|x\|_\infty$ avec égalité pour la suite constante $1$. Si l'on avait $\ell(x) = \sum_n a_nx_n$ avec $\sum_n |a_n| < +\infty$, la suite $e_m$, nulle sauf un $1$ en position $m$, donnerait $a_m = \ell(e_m) = 0$ pour tout $m$, puis $\ell = 0$, alors que $\ell(1) = 1$.
    - |
      Une forme linéaire n'est pas toujours dans le dual topologique. Sur l'espace des suites nulles à partir d'un certain rang, muni de $\|x\|_\infty = \max_n |x_n|$, la forme $\varphi(x) = \sum_n x_n$, somme finie, est linéaire, mais la suite qui vaut $1$ aux $N + 1$ premiers rangs et $0$ ensuite est de norme $1$ et d'image $N + 1$ : $\varphi$ n'est bornée sur aucune boule. Le dual topologique de cet espace, qui n'est pas complet, est pourtant un espace de Banach, par le point (iii) de {{f-operateurs|Opérateurs continus}}.

  norme-operateur:
    - |
      La norme d'un opérateur intégral se lit sur la constante $1$ quand l'opérateur est positif. Sur l'espace des fonctions continues sur $[0, 1]$, muni de $\|\cdot\|_\infty$, l'opérateur $V f(x) = \int_0^x f(t)\,dt$ vérifie $|Vf(x)| \leqslant x\|f\|_\infty \leqslant \|f\|_\infty$, et $V(1)(x) = x$ a pour norme $1$ : sa norme d'opérateur vaut $1$. Le carré $V \circ V$, qui envoie $1$ sur $\frac{x^2}2$, a pour norme $\frac12$, puisque $|V^2f(x)| \leqslant \frac{x^2}2\|f\|_\infty$ : l'inégalité $|||V^2||| \leqslant |||V|||^2$ est stricte.
    - |
      La borne supérieure qui définit la norme d'opérateur n'est pas toujours atteinte. Sur le même espace, la forme $\varphi(f) = \int_0^{1/2} f - \int_{1/2}^1 f$ vérifie $|\varphi(f)| \leqslant \|f\|_\infty$. Les fonctions continues $f_n$, égales à $1$ sur $[0, \frac12 - \frac1n]$, à $-1$ sur $[\frac12 + \frac1n, 1]$ et affines entre les deux, de norme $1$, donnent $\varphi(f_n) = 1 - \frac1n$, et la norme vaut $1$. Elle n'est pas atteinte : $\varphi(f) = 1$ avec $\|f\|_\infty \leqslant 1$ imposerait $f = 1$ sur $[0, \frac12[$ et $f = -1$ sur $]\frac12, 1]$, par continuité, ce qu'aucune fonction continue ne réalise.
    - |
      Une application linéaire peut avoir une norme d'opérateur infinie, et c'est alors qu'elle n'est pas continue. Sur l'espace des polynômes réels, muni de $N(P) = \sup_{[0, 1]} |P|$, l'évaluation $P \mapsto P(\frac12)$ est de norme $1$, mais l'évaluation $P \mapsto P(2)$ envoie $X^n$, de norme $1$, sur $2^n$ : sa norme est $+\infty$. Le point (i) de {{f-operateurs|Opérateurs continus}} conclut qu'elle n'est pas continue, alors qu'en dimension finie toute application linéaire l'est.

  espace-hilbert:
    - |
      Un sous-espace d'un espace de Hilbert n'en est un lui-même que s'il est fermé. Dans $\lex{espace-l2-suites}{\ell^2}$, le sous-espace $F$ des suites nulles à partir d'un certain rang, muni du même [[produit-scalaire|produit scalaire]], n'est pas complet. Les suites tronquées $s_N = (1, \frac12, \dots, \frac1{N+1}, 0, \dots)$ y forment une [[suite-cauchy|suite de Cauchy]], puisque, pour $M > N$,
      $$\begin{aligned} \|s_M - s_N\|^2 &= \sum_{n = N+1}^{M} \frac1{(n + 1)^2} \\ &\leqslant \sum_{n = N+1}^{M} \Big(\frac1n - \frac1{n+1}\Big) \\ &\leqslant \frac1{N + 1}. \end{aligned}$$
      Le même calcul donne $\|a - s_N\|^2 \leqslant \frac1{N+1}$ pour $a = (\frac1{n+1})$, qui est dans $\ell^2$ : la suite converge dans $\ell^2$ vers $a$, limite unique, qui n'est pas dans $F$. Elle n'a donc pas de limite dans $F$.
    - |
      Un espace de Banach dont la norme ne provient d'aucun produit scalaire peut ne pas avoir l'unicité du point le plus proche. Dans $L^1([0, 1])$, pour la [[tribu-borelienne|tribu borélienne]] et la [[mesure-lebesgue|mesure de Lebesgue]], complet sans autre choix que celui qui construit la mesure ({{f-lp|Espaces L¹ et L²}}, (v)), le sous-espace $F$ des $g$ d'intégrale nulle est fermé, puisque $|\int g - \int h| \leqslant \|g - h\|_1$. Pour toute $g \in F$, on a $\|1 - g\|_1 \geqslant |\int (1 - g)| = 1$, et cette distance $1$ est atteinte en $g = 0$ comme en $g = 1 - 2\cdot\mathbf 1_{[0, 1/2[}$, ainsi qu'en tous les points du segment qui les joint. L'unicité du point (ii) de {{f-hilbert|Espaces de Hilbert}} tombe donc. Elle repose sur l'[[identite-parallelogramme|identité du parallélogramme]], que la norme de $L^1$ ne vérifie pas : $u = \mathbf 1_{[0, 1/2[}$ et $v = \mathbf 1_{[1/2, 1]}$ donnent $1 + 1$ à gauche et $\frac12 + \frac12$ à droite.
    - |
      Dans $L^2(\mu)$, la projection sur le convexe $C$ des classes de fonctions positives presque partout est $f \mapsto f^+$, et on le voit sans invoquer l'existence du projeté. Comme $f - f^+ = -f^-$ et $f^+f^- = 0$, on a, pour $g \in C$,
      $$\langle f - f^+, g - f^+ \rangle = -\int f^-g \, d\mu \leqslant 0.$$
      En développant ({{me-produit-scalaire|Produit scalaire}}, (ii)),
      $$\begin{aligned} \|f - g\|_2^2 &= \|f - f^+\|_2^2 + \|f^+ - g\|_2^2 \\ &\quad - 2\langle f - f^+, g - f^+ \rangle, \end{aligned}$$
      qui est au moins $\|f - f^+\|_2^2$, avec égalité seulement si $g = f^+$. La distance de $f$ à $C$ est donc $\|f^-\|_2$ : pour $f(x) = x - \frac12$ sur $[0, 1]$, elle vaut $\big(\int_0^{1/2} (\frac12 - x)^2 \, dx\big)^{1/2} = \frac1{2\sqrt 6}$.
      ```schema lex-espace-hilbert-3
      La fonction $f(x) = x - \frac12$, en gris, et son projeté $f^+$, en rouge, qui la suit là où elle est positive et vaut $0$ ailleurs. La différence $f - f^+$, nulle sur $[\frac12, 1]$, ne vit que là où $f^+$ s'annule, ce qui rend son produit avec $f^+$ nul.
      ```

  base-hilbertienne:
    - |
      Une famille orthonormée infinie n'est pas toujours une base hilbertienne. Dans $L^2([0, 1])$, pour la mesure de Lebesgue, soit $r_j(x) = (-1)^{\lfloor 2^jx \rfloor}$, $j \geqslant 1$, qui vaut alternativement $1$ et $-1$ sur les intervalles $[k2^{-j}, (k + 1)2^{-j}[$, et $e_0 = 1$, $e_j = r_j$. Pour $i < j$, $r_i$ est constante sur chaque intervalle de longueur $2^{-i}$, où $r_j$ passe autant de temps à $1$ qu'à $-1$ ; d'où $\int r_ir_j = 0$, et de même $\int r_j = 0$ : la famille $(e_n)$ est [[famille-orthonormee|orthonormée]]. Le produit $r_1r_2$, de carré $1$, est orthogonal à $1$, à $r_1$ et à $r_2$, puisque $\int r_1r_2 \cdot r_1 = \int r_2 = 0$ et $\int r_1r_2 \cdot r_2 = \int r_1 = 0$, et à $r_j$ pour $j \geqslant 3$, par le même argument, $r_1r_2$ étant constante sur les intervalles de longueur $\frac14$. Par le critère (ii) de {{f-bases-hilbertiennes|Bases hilbertiennes}}, $(e_n)$ n'est pas une base hilbertienne ; l'inégalité de Bessel est stricte pour $r_1r_2$, la somme valant $0$ et $\|r_1r_2\|_2^2$ valant $1$.
      ```schema lex-base-hilbertienne-1
      Les fonctions $r_1$, en bleu, et $r_2$, en vert, valent $\pm 1$ sur des intervalles de longueur $\frac12$ et $\frac14$ ; leur produit, en rouge, vaut $1$ sur $[0, \frac14[$ et sur $[\frac34, 1[$, et $-1$ entre les deux. Sur chacune des deux moitiés de $[0, 1[$, le produit prend autant de fois chaque signe : il est orthogonal à $1$ et à $r_1$.
      ```
    - |
      En dimension finie, une base hilbertienne n'est rien d'autre qu'une base orthonormée, et les séries sont des sommes finies. L'espace des polynômes de degré au plus $2$, muni de $\langle P, Q \rangle = \int_0^1 PQ$, est complet, comme tout espace de dimension finie ({{gd-equivalence|Normes en dimension finie}}, (iv)), donc de Hilbert ; il a pour base hilbertienne
      $$\begin{aligned} e_0 &= 1, \qquad e_1 = \sqrt3\,(2x - 1), \\ e_2 &= \sqrt5\,(6x^2 - 6x + 1). \end{aligned}$$
      Ces trois vecteurs sont orthonormés, par un calcul direct d'intégrales, donc libres, et ils engendrent un espace de [[dimension]] $3$, l'espace entier. Pour $x^2$, les coordonnées sont $\frac13$, $\frac{\sqrt3}6$ et $\frac{\sqrt5}{30}$, et l'égalité de Parseval se vérifie : $\frac19 + \frac1{12} + \frac1{180} = \frac15 = \int_0^1 x^4 \, dx$.
    - |
      L'inégalité de Bessel, appliquée à une famille de sinus, majore déjà une somme célèbre. Dans $L^2([0, 1])$, les fonctions $e_k(x) = \sqrt2\sin(k\pi x)$, $k \geqslant 1$, sont orthonormées : $2\sin a \sin b = \cos(a - b) - \cos(a + b)$, et $\int_0^1 \cos(m\pi x)\,dx = 0$ pour tout entier $m \neq 0$, puisque $\sin(m\pi) = 0$. Pour $f = 1$, on trouve $\langle f, e_k \rangle = \frac{\sqrt2\,(1 - (-1)^k)}{k\pi}$, qui vaut $\frac{2\sqrt2}{k\pi}$ pour $k$ impair et $0$ pour $k$ pair. Bessel ({{f-bases-hilbertiennes|Bases hilbertiennes}}, (i)) donne alors $\sum_{k \text{ impair}} \frac{8}{k^2\pi^2} \leqslant \|1\|_2^2 = 1$, c'est-à-dire $\sum_{k \text{ impair}} \frac1{k^2} \leqslant \frac{\pi^2}8$. Plus loin, l'égalité de Parseval pour le système trigonométrique donnera $\sum_{n \geqslant 1} \frac1{n^2} = \frac{\pi^2}6$ ({{fo-parseval|Parseval}}) ; la somme sur les $k$ pairs valant le quart de la somme totale, celle sur les $k$ impairs vaut $\frac{\pi^2}8$, et l'inégalité est une égalité.

  operateur-autoadjoint:
    - |
      Parmi les [[projecteur|projecteurs]] du plan sur une même droite, seul celui qui projette perpendiculairement est autoadjoint. Sur $\mathbb R^2$, muni du [[produit-scalaire-usuel|produit scalaire usuel]], la projection $q(x) = (x_1, 0)$ sur l'axe des abscisses parallèlement à l'axe des ordonnées vérifie $\langle q(x), y \rangle = x_1y_1 = \langle x, q(y) \rangle$. La projection sur le même axe parallèlement à la droite $\mathbb R(1, 1)$, $p(x) = (x_1 - x_2, 0)$, n'est pas autoadjointe : $\langle p(e_2), e_1 \rangle = -1$, alors que $\langle e_2, p(e_1) \rangle = 0$.
      ```schema lex-operateur-autoadjoint-1
      Un point $x$ du cercle unité, en gris, se projette sur l'axe des abscisses en $q(x)$, en bleu, le long d'une perpendiculaire à l'axe, et en $p(x)$, en rouge, le long d'une parallèle à la droite $\mathbb R(1, 1)$, en pointillé. Le projeté oblique $p(x)$ sort du cercle : la projection oblique allonge certains vecteurs, et la projection perpendiculaire aucun.
      ```
      Pour $p$, la formule (iii) de {{f-autoadjoints|Opérateurs autoadjoints}} tombe : sa [[norme-operateur|norme d'opérateur]] vaut $\sqrt 2$, puisque $|x_1 - x_2| \leqslant \sqrt2\,\|x\|$ avec égalité en $(1, -1)$, alors que, sur le cercle unité, $\langle p(x), x \rangle = x_1^2 - x_1x_2$ reste compris entre $\frac{1 - \sqrt2}2$ et $\frac{1 + \sqrt 2}2 \approx 1{,}21$.
    - |
      La multiplication par l'indicatrice d'une partie mesurable $A$ est un opérateur autoadjoint de $L^2(\mu)$, et ses sous-espaces propres sont orthogonaux, comme le veut le point (i) de {{f-autoadjoints|Opérateurs autoadjoints}}. L'opérateur $M(f) = \mathbf 1_Af$ est linéaire, de norme au plus $1$ puisque $|\mathbf 1_Af| \leqslant |f|$, et $\langle \mathbf 1_Af, g \rangle = \int_A fg \, d\mu = \langle f, \mathbf 1_Ag \rangle$. Comme $M \circ M = M$, une égalité $M(f) = \lambda f$ avec $f \neq 0$ donne $\lambda^2 f = \lambda f$, d'où $\lambda \in \{0, 1\}$. Le sous-espace $E_1$ est formé des classes nulles presque partout hors de $A$, et $E_0$ de celles qui sont nulles presque partout sur $A$ : le produit d'un élément de l'un par un élément de l'autre est nul presque partout. Si $A$ est négligeable, $M$ est nul et $1$ n'est pas valeur propre ; dès que $A$ contient une partie $B$ de mesure finie non nulle, $\mathbf 1_B$ est un vecteur propre pour $1$.
    - |
      Sans la complétude, la symétrie n'entraîne pas la continuité. Sur le sous-espace $F$ de $\lex{espace-l2-suites}{\ell^2}$ formé des suites nulles à partir d'un certain rang, l'application $u(x) = \big((n + 1)x_n\big)_n$ est linéaire et vérifie $\langle u(x), y \rangle = \sum_n (n + 1)x_ny_n = \langle x, u(y) \rangle$. Elle n'est pourtant pas continue, puisque la suite $e_n$, nulle sauf un $1$ en position $n$, est de norme $1$ et que $\|u(e_n)\| = n + 1$. Sur un espace de Hilbert, la troisième remarque de {{f-autoadjoints|Opérateurs autoadjoints}} établit au contraire, par le théorème de Baire et le [[choix-dependant|choix dépendant]] ⋆, qu'une application linéaire symétrique est continue : c'est le théorème de Hellinger et Toeplitz, et $F$ échappe à sa conclusion parce qu'il n'est pas complet.

  quotient-rayleigh:
    - |
      En dimension $2$, le quotient de Rayleigh d'une matrice symétrique s'étudie à la main, et ses extrema tombent sur des vecteurs propres. Pour $A = \begin{pmatrix} 2 & 1 \\ 1 & 2 \end{pmatrix}$, autoadjointe pour le produit scalaire usuel, $R_A(x) = 2 + \frac{2x_1x_2}{x_1^2 + x_2^2}$, compris entre $1$ et $3$ puisque $2|x_1x_2| \leqslant x_1^2 + x_2^2$. Le maximum $3$ est atteint en $(1, 1)$ et le minimum $1$ en $(1, -1)$, et en effet $A(1, 1) = 3(1, 1)$ et $A(1, -1) = (1, -1)$, comme le veut le point (iv) de {{f-autoadjoints|Opérateurs autoadjoints}}.
    - |
      Sans autoadjonction, un extremum du quotient n'est plus un vecteur propre. Pour $B = \begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}$, on a $\langle Bx, x \rangle = x_1^2 + x_1x_2 + x_2^2$, et sur le cercle unité, avec $x = (\cos t, \sin t)$, le quotient vaut $1 + \frac12\sin 2t$, maximal en $t = \frac\pi4$. Au point $x = \frac1{\sqrt2}(1, 1)$, l'image $Bx = \frac1{\sqrt2}(2, 1)$ n'est pas colinéaire à $x$. La seule valeur propre de $B$ est $1$, que le quotient atteint en $(1, 0)$ et en $(0, 1)$ sans être extrémal en ces points.
      ```schema lex-quotient-rayleigh-2
      Le cercle unité, en gris, et, au point $x = \frac1{\sqrt2}(1, 1)$, où le quotient de $B$ est maximal, la flèche $Bx$, en rouge, qui s'écarte de la direction de $x$, en pointillé. Au point $(1, 0)$, la flèche $B(1, 0) = (1, 0)$, en bleu, est radiale : c'est un vecteur propre, en lequel le quotient vaut seulement $1$.
      ```
    - |
      En dimension infinie, le quotient de Rayleigh peut atteindre l'une de ses bornes et pas l'autre. Sur $\lex{espace-l2-suites}{\ell^2}$, l'opérateur $D(x) = (\frac{x_n}{n+1})_n$ est continu, de norme au plus $1$, et autoadjoint, puisque $\langle D(x), y \rangle = \sum_n \frac{x_ny_n}{n+1}$. Son quotient $R_D(x) = \sum_n \frac{x_n^2}{n+1} \big/ \sum_n x_n^2$ est au plus $1$, valeur atteinte en $e_0 = (1, 0, 0, \dots)$, qui est bien un vecteur propre, de valeur propre $1$. Sa borne inférieure $0$, approchée par $R_D(e_n) = \frac1{n+1}$, où $e_n$ est nulle sauf un $1$ en position $n$, n'est pas atteinte, puisque $R_D(x) > 0$ pour $x \neq 0$ ; et $0$ n'est pas valeur propre, $D$ étant injectif.

  matrice-orthogonale:
    - |
      Les rotations et les symétries du plan donnent des matrices orthogonales, de déterminants $1$ et $-1$. Pour tout réel $\theta$,
      $$\begin{aligned} R &= \begin{pmatrix} \cos\theta & -\sin\theta \\ \sin\theta & \cos\theta \end{pmatrix}, \\ S &= \begin{pmatrix} \cos\theta & \sin\theta \\ \sin\theta & -\cos\theta \end{pmatrix} \end{aligned}$$
      ont des colonnes de norme $1$, puisque $\cos^2\theta + \sin^2\theta = 1$, et orthogonales entre elles ; d'où ${}^tR\,R = {}^tS\,S = I_2$. Leurs [[determinant|déterminants]] valent $\cos^2\theta + \sin^2\theta = 1$ et $-1$.
    - |
      Des colonnes orthogonales ne suffisent pas, ni des colonnes de norme $1$. La matrice
      $$A = \begin{pmatrix} 1 & 1 \\ 1 & -1 \end{pmatrix}$$
      a des colonnes orthogonales, mais ${}^tA\,A = 2I_2$ : son inverse est $\frac12\,{}^tA$, et non ${}^tA$. La matrice $B$ de colonnes $(1, 0)$ et $\frac1{\sqrt2}(1, 1)$ a des colonnes de norme $1$, mais leur produit scalaire vaut $\frac1{\sqrt2}$, coefficient hors diagonale de ${}^tB\,B$. C'est seulement la conjonction des deux conditions, une base orthonormée, qui fait de la transposée l'inverse.
    - |
      Le théorème spectral produit une matrice orthogonale pour toute matrice symétrique ({{f-spectral-fini|Théorème spectral}}, (iii)). Pour
      $$A = \begin{pmatrix} 2 & 1 \\ 1 & 2 \end{pmatrix},$$
      les vecteurs $\frac1{\sqrt2}(1, 1)$ et $\frac1{\sqrt2}(1, -1)$ sont propres, de valeurs propres $3$ et $1$, et orthonormés. La matrice $P$ qui les a pour colonnes est orthogonale et symétrique, donc égale à son inverse, et
      $$A = P\begin{pmatrix} 3 & 0 \\ 0 & 1 \end{pmatrix}{}^tP.$$

  operateur-compact:
    - |
      Un opérateur continu de rang fini est compact, et on le voit ici sur la boule elle-même. Sur l'espace des fonctions continues sur $[0, 1]$, muni de $\|f\|_\infty = \sup |f|$, l'opérateur $u(f) = \big(\int_0^1 f\big)\cdot 1$ est linéaire et vérifie $\|u(f)\|_\infty \leqslant \|f\|_\infty$. L'image de la boule unité fermée est formée des fonctions constantes de valeur $c \in [-1, 1]$, toutes atteintes par $f = c$ ; isométrique au segment $[-1, 1]$, elle est compacte ({{tr-compacts|Compacts de ℝ}}), donc fermée. C'est le point (i) de {{f-compacts|Opérateurs compacts}} sur un cas où l'adhérence n'ajoute rien.
    - |
      Un opérateur continu n'est pas toujours compact. Sur l'espace $E$ des [[suite-bornee|suites réelles bornées]], muni de $\|x\|_\infty = \sup_n |x_n|$, l'identité est continue, de norme $1$. Les suites $e_n$, nulles sauf un $1$ en position $n$, sont dans la boule unité fermée et deux à deux à distance $1$ : aucune suite extraite de $(e_n)$ n'est de Cauchy, et la boule n'est pas compacte ({{me-compacite-sequentielle|Compacité séquentielle}}, sens direct). En dimension finie, au contraire, l'identité est compacte, la boule fermée étant fermée et bornée ({{gd-equivalence|Normes en dimension finie}}, (iv)).
    - |
      Un opérateur limite d'opérateurs de rang fini explicites est compact, sans aucun choix. L'espace $E$ des suites bornées, muni de $\|\cdot\|_\infty$, est un [[banach|espace de Banach]] : si $(x^{(k)})$ est de Cauchy, chaque coordonnée l'est, de limite $x_n$, et l'inégalité $|x^{(k)}_n - x^{(l)}_n| \leqslant \varepsilon$, valable pour $k, l \geqslant N$ et tout $n$, donne à la limite en $l$ un $x$ borné tel que $\|x^{(k)} - x\|_\infty \leqslant \varepsilon$. L'opérateur $D(x) = (\frac{x_n}{n+1})_n$ est limite des $D_N$ qui ne retiennent que les coordonnées d'indice $n \leqslant N$, d'image contenue dans le sous-espace engendré par $e_0, \dots, e_N$, puisque $|||D - D_N||| = \frac1{N+2}$. Le point (ii) de {{f-compacts|Opérateurs compacts}} en fait un opérateur compact. Plus loin, le même critère établira que l'opérateur diagonal de suite $(a_n)$ sur $\ell^2$ est compact si et seulement si $a_n \to 0$ ({{f-compacts-exemples|Exemples d'opérateurs compacts}}, (i)).

  intervalle-dyadique:
    - |
      Les intervalles dyadiques qui contiennent un intervalle donné se lisent sur son indice. L'intervalle $I_{3,5} = [\frac58, \frac68[$ est contenu dans $I_{2,2} = [\frac12, \frac34[$, dans $I_{1,1} = [\frac12, 1[$ et dans $I_{0,0} = [0, 1[$, conformément au point (i) de {{f-haar|Système de Haar}}, puisque $\lfloor \frac52 \rfloor = 2$, $\lfloor \frac54 \rfloor = 1$ et $\lfloor \frac58 \rfloor = 0$. Ses deux moitiés sont $I_{4,10} = [\frac{10}{16}, \frac{11}{16}[$ et $I_{4,11}$.
    - |
      Des intervalles de longueur $2^{-j}$ qui ne sont pas dyadiques peuvent se chevaucher sans s'emboîter. Les intervalles $[\frac14, \frac34[$ et $[\frac12, 1[$, de même longueur $\frac12$, ont pour intersection $[\frac12, \frac34[$, qui n'est aucun des deux. C'est la position imposée aux extrémités, des multiples de $2^{-j}$, qui donne la propriété « disjoints ou emboîtés » et en fait des intervalles qui se partagent en deux à chaque rang.
    - |
      Les intervalles dyadiques qui contiennent un point $x \in [0, 1[$ sont donnés par son développement en base $2$. Pour $x = 0{,}3$, on trouve à chaque rang $k = \lfloor 2^j x \rfloor$, soit $0, 1, 2, 4, 9$ pour $j = 1, \dots, 5$, dont l'écriture en base $2$, $0$, $01$, $010$, $0100$, $01001$, donne les premiers chiffres de $0{,}3 = 0{,}0100110011\ldots$ en base $2$. Ces intervalles sont emboîtés, de longueurs $2^{-j}$, et leur intersection est réduite à $\{x\}$.

  systeme-haar:
    - |
      Les fonctions de Haar d'un même rang sont orthogonales parce que leurs supports sont disjoints, et celles de rangs différents parce que la plus étendue est constante là où vit l'autre. Ainsi $h_{1,0}$ et $h_{1,1}$, nulles hors de $[0, \frac12[$ et de $[\frac12, 1[$, ont un produit nul ; et $h_{0,0}$, égale à $1$ sur $[0, \frac12[$, donne $\langle h_{0,0}, h_{1,0} \rangle = \int h_{1,0} = 0$. Chacune est de norme $1$, puisque $h_{j,k}^2 = 2^j$ sur $I_{j,k}$, de longueur $2^{-j}$.
    - |
      Les premiers coefficients de Haar de $f = \mathbf 1_{[0, 1/3[}$ se calculent à la main. On trouve $\langle f, 1 \rangle = \frac13$, $\langle f, h_{0,0} \rangle = \frac13$, puisque $[0, \frac13[$ est dans la première moitié de $[0, 1[$, et
      $$\langle f, h_{1,0} \rangle = \sqrt2\Big(\frac14 - \frac1{12}\Big) = \frac{\sqrt2}6,$$
      les autres coefficients de rang $1$ étant nuls. La somme partielle $S_1f = \frac13 + \frac13 h_{0,0}$ vaut $\frac23$ sur $[0, \frac12[$ et $0$ sur $[\frac12, 1[$ : ce sont les moyennes de $f$ sur ces deux moitiés, comme le veut le point (iii) de {{f-haar|Système de Haar}}.
    - |
      Pour une fonction discontinue, la série de Haar converge dans $L^2$ sans que l'écart $|S_jf - f|$ devienne petit partout. Pour $f = \mathbf 1_{[0, 1/3[}$, la somme $S_jf$ vaut, sur l'intervalle de rang $j$ qui contient $\frac13$, la proportion de cet intervalle située à gauche de $\frac13$, c'est-à-dire la partie fractionnaire de $\frac{2^j}3$, égale à $\frac13$ ou $\frac23$ selon la parité de $j$. L'écart $|S_jf - f|$ reste donc au moins $\frac13$ sur tout cet intervalle, partie non négligeable, pour tout $j$, si bien que la borne supérieure essentielle de $|S_jf - f|$ ne tend pas vers $0$, alors que $\|f - S_jf\|_2^2 \leqslant 2^{-j}$, la somme ne différant de $f$ que sur cet intervalle.
      ```schema lex-systeme-haar-3
      La fonction $\mathbf 1_{[0, 1/3[}$, en gris, et ses sommes partielles $S_2f$, en bleu, et $S_3f$, en rouge, qui coïncident avec elle sauf sur l'intervalle dyadique contenant $\frac13$. Là, elles prennent les valeurs $\frac13$ et $\frac23$, et l'écart avec $f$ ne descend pas sous $\frac13$, alors que l'intervalle fautif rétrécit de moitié à chaque rang.
      ```

  espace-L1:
    - |
      Le passage aux classes est ce qui fait de $\|\cdot\|_1$ une norme. Pour la [[mesure-lebesgue|mesure de Lebesgue]] sur $[0, 1]$, l'indicatrice $f$ de $\mathbb Q \cap [0, 1]$ est intégrable, d'intégrale nulle, puisque $\mathbb Q$ est [[denombrable]] et que chaque point est de mesure nulle ; pourtant $f$ vaut $1$ en chaque rationnel. Sur l'espace des fonctions intégrables, $\int |f|$ ne distingue donc pas $f$ de la fonction nulle, alors que dans $L^1$ ces deux fonctions ont la même classe. Un élément de $L^1$ n'a pas de valeur en un point : modifier une fonction sur une partie [[negligeable|négligeable]] ne change pas sa classe.
    - |
      Une suite qui converge dans $L^1$ peut ne converger en aucun point. Sur $[0, 1[$, muni de la mesure de Lebesgue, numérotons $n = 2^j + k$, avec $0 \leqslant k < 2^j$, et posons $f_n = \mathbf 1_{[k2^{-j}, (k + 1)2^{-j}[}$ : à chaque rang $j$, l'intervalle balaie $[0, 1[$ de gauche à droite, en $2^j$ étapes. Comme $\|f_n\|_1 = 2^{-j}$, la suite tend vers $0$ dans $L^1$.
      ```schema lex-espace-L1-2
      Les intervalles où valent $1$ les fonctions $f_1$ à $f_{15}$, rangés de haut en bas : chaque rangée, de rang $j = 0, 1, 2, 3$, recouvre exactement $[0, 1[$ par des intervalles de longueur $2^{-j}$. La verticale rouge, au point $x = 0{,}3$, rencontre un intervalle dans chaque rangée : $f_n(x)$ vaut $1$ une fois par rangée et $0$ ailleurs.
      ```
      Pourtant, pour tout $x \in [0, 1[$, chaque rang $j$ fournit exactement un $n$ tel que $f_n(x) = 1$, et les autres donnent $0$ : la suite $(f_n(x))$ prend une infinité de fois chacune des valeurs $0$ et $1$, et ne converge pas. Seule une suite extraite converge presque partout, comme le veut le point (iv) de {{f-lp|Espaces L¹ et L²}}, qui s'applique sans choix à ces fonctions données : ici $f_{2^j} = \mathbf 1_{[0, 2^{-j}[}$, qui tend vers $0$ en tout point $x > 0$.
    - |
      L'espace $L^1$ dépend de la mesure autant que de l'ensemble. Pour la mesure de Dirac $\delta_a$ en un point $a$ de $X$, définie sur $\mathcal P(X)$ ({{m-mesures|Mesures}}), l'intégrale d'une fonction étagée positive $s$ vaut $s(a)$, puisque $\delta_a(A) = \mathbf 1_A(a)$, et la convergence monotone donne $\int |f| \, d\delta_a = |f(a)|$ pour toute $f$. Deux fonctions sont égales $\delta_a$-presque partout si et seulement si elles prennent la même valeur en $a$ : l'application $f \mapsto f(a)$ identifie $L^1(\delta_a)$ à $\mathbb R$, quelle que soit la taille de $X$. Pour la mesure nulle, enfin, toute partie est négligeable, toutes les fonctions sont dans une même classe, et $L^1$ est réduit à $\{0\}$.

  espace-L2:
    - |
      Sur une mesure finie, $L^2$ est contenu dans $L^1$, et l'inclusion est stricte. Pour la [[mesure-lebesgue|mesure de Lebesgue]] sur $[0, 1]$ et $f \in L^2$, l'inégalité de Cauchy-Schwarz ({{f-lp|Espaces L¹ et L²}}, (i)), appliquée à $|f|$ et à la constante $1$, donne $\int |f| \leqslant \|f\|_2$. La fonction $x^{-1/2}$, prolongée par $0$ en $0$, est dans $L^1$ sans être dans $L^2$. Ses intégrales et celles de son carré sur $[\frac1n, 1]$ valent $2 - \frac2{\sqrt n}$ et $\ln n$ ({{m-riemann|Riemann et Lebesgue}}), et la convergence monotone ({{m-beppo-levi|Convergence monotone}}) donne, sur $]0, 1]$, les limites $2$ et $+\infty$.
    - |
      Sans la finitude de la mesure, l'inclusion $L^2 \subset L^1$ tombe. Sur $[1, +\infty[$, muni de la mesure de Lebesgue, la fonction $\frac1x$ est de carré intégrable, puisque $\int_1^n \frac{dx}{x^2} = 1 - \frac1n$ tend vers $1$, mais elle n'est pas intégrable, puisque $\int_1^n \frac{dx}x = \ln n$ tend vers $+\infty$. Les deux défauts sont de nature opposée : près de $0$, une singularité trop forte fait sortir de $L^2$ ; à l'infini, une décroissance trop lente fait sortir de $L^1$.
    - |
      La convergence en tout point n'entraîne pas la convergence dans $L^2$. Sur $[0, 1]$, les fonctions $f_n = \sqrt n\,\mathbf 1_{]0, 1/n]}$, $n \geqslant 1$, tendent vers $0$ en tout point, puisque $f_n(x) = 0$ dès que $n > \frac1x$, et pourtant $\|f_n\|_2^2 = n \cdot \frac1n = 1$.
      ```schema lex-espace-L2-3
      Les fonctions $f_1$, en gris, $f_4$, en bleu, et $f_{16}$, en rouge, valent $1$, $2$ et $4$ sur $]0, 1]$, $]0, \frac14]$ et $]0, \frac1{16}]$. Leurs carrés ont tous pour intégrale $1$ : la masse se resserre contre $0$ sans diminuer, alors qu'en chaque point $x > 0$ les fonctions finissent par s'annuler.
      ```
      Si elles convergeaient dans $L^2$ vers une fonction $h$, une suite extraite convergerait vers $h$ presque partout ({{f-lp|Espaces L¹ et L²}}, (iv)), d'où $h = 0$ presque partout, et $\|f_n\|_2 = \|f_n - h\|_2$ tendrait vers $0$, ce qui n'est pas. C'est le défaut que la domination du théorème de convergence dominée interdit : aucune fonction de carré intégrable ne majore toutes les $f_n$, puisque $\sup_n f_n(x) = \sqrt{\lfloor 1/x \rfloor}$ a un carré qui dépasse $\frac1x - 1$.

  espace-l2-suites:
    - |
      Une suite peut être de carré sommable sans que sa série converge. La suite $a = (\frac1{n+1})_{n \in \mathbb N}$ est dans $\ell^2$, puisque $\frac1{m^2} \leqslant \frac1{m-1} - \frac1m$ pour $m \geqslant 2$ donne $\|a\|_2^2 \leqslant 1 + 1 = 2$. Sa série $\sum \frac1{n+1}$ diverge pourtant : pour chaque entier $k$, les $2^k$ termes $\frac1m$ avec $2^k < m \leqslant 2^{k+1}$ valent au moins $2^{-k-1}$, et leur somme au moins $\frac12$.
    - |
      La boule unité fermée de $\ell^2$, fermée et bornée, n'est pas compacte. Les suites $e_n$, nulles sauf un $1$ en position $n$, y appartiennent, et deux d'entre elles sont à distance $\|e_n - e_m\|_2 = \sqrt 2$. Aucune suite extraite de $(e_n)$ n'est donc de Cauchy, ni a fortiori convergente, alors qu'une suite d'un espace métrique compact a une suite extraite convergente ({{me-compacite-sequentielle|Compacité séquentielle}}, sens direct, sans choix). Dans $\mathbb R^n$, les fermés bornés sont compacts ({{gd-equivalence|Normes en dimension finie}}, (ii)) ; c'est la dimension infinie qui fait tomber cette propriété.
    - |
      Le produit scalaire de $\ell^2$ a un sens grâce à l'inégalité de Cauchy-Schwarz, qui assure la convergence absolue des séries. Pour $x \in \ell^2$ et $a = (\frac1{n+1})$, la série $\sum_n \frac{x_n}{n+1}$ converge absolument, et $|\sum_n \frac{x_n}{n+1}| \leqslant \sqrt2\,\|x\|_2$, par le point (i) de {{f-lp|Espaces L¹ et L²}}, appliqué à la mesure de comptage sur $\mathbb N$, et par $\|a\|_2^2 \leqslant 2$. Plus loin, le théorème de Riesz dira que toute [[forme-lineaire|forme linéaire]] continue sur $\ell^2$ est de cette forme, $x \mapsto \sum_n b_nx_n$ pour une suite $b \in \ell^2$, et cela sans choix, $\ell^2$ ayant une suite dense explicite ({{f-riesz|Théorème de Riesz}}, (ii)).

  espace-l1-suites:
    - |
      Une suite bornée n'est pas toujours sommable. La suite $(2^{-n})$ est dans $\ell^1$, de norme $\sum_n 2^{-n} = 2$. La suite $(\frac1{n+1})$, bornée par $1$, n'y est pas : comme $\frac1{k+1} \geqslant \int_{k+1}^{k+2} \frac{dt}t$, la somme de ses $n + 1$ premiers termes dépasse $\ln(n + 2)$ ({{ex-logarithme|Logarithme}}), qui tend vers $+\infty$. La suite $(\frac{(-1)^n}{n+1})$ n'y est pas non plus, bien que sa série converge, par le critère des suites adjacentes appliqué à ses sommes partielles d'indices pairs et impairs ({{su-adjacentes|Suites adjacentes}}) : l'appartenance à $\ell^1$ demande la convergence de la série des valeurs absolues, qui est ici la série harmonique.
    - |
      La complétude de $\ell^1$ tient à sa norme. Muni de $\|a\|_\infty = \sup_n |a_n|$, l'espace vectoriel $\ell^1$ n'est pas complet : les suites $s_N = (1, \frac12, \dots, \frac1{N+1}, 0, \dots)$ y sont de Cauchy, avec $\|s_M - s_N\|_\infty = \frac1{N+2}$, et une limite dans $\ell^1$ aurait pour coordonnées les $\frac1{n+1}$, limites des coordonnées, ce qui l'exclurait de $\ell^1$. Pour $\|\cdot\|_1$, la même suite n'est d'ailleurs pas de Cauchy, puisque $\|s_{2N+1} - s_N\|_1$ est une somme de $N + 1$ termes au moins égaux à $\frac1{2N+2}$, donc au moins égale à $\frac12$.
    - |
      Dans $\ell^1$, la convergence coordonnée par coordonnée n'entraîne pas la convergence pour la norme. Les suites $e_n$, nulles sauf un $1$ en position $n$, tendent vers $0$ coordonnée par coordonnée, mais $\|e_n\|_1 = 1$ et $\|e_n - e_m\|_1 = 2$ pour $n \neq m$ : aucune suite extraite de $(e_n)$ n'est de Cauchy, et la boule unité fermée de $\ell^1$ n'est pas compacte. Plus loin, le théorème de dualité identifiera le dual de $\ell^1$ à l'espace des suites bornées, par $b \mapsto \big(a \mapsto \sum_n a_nb_n\big)$ ({{lp-dual|Dual de Lᵖ}}, (ii)), sans aucun choix, la tribu $\mathcal P(\mathbb N)$ étant engendrée par la suite des singletons ((iii) du même nœud).

  espace-bornees:
    - |
      Pour un ensemble fini $X$, l'espace $\mathcal B(X)$ est $\mathbb R^X$ muni de $\|f\|_\infty = \max_X |f|$ ; pour $X = \mathbb N$, c'est l'espace des [[suite-bornee|suites bornées]]. Dans ce dernier, la suite constante $1$ et la suite $((-1)^n)$ sont à distance $2$, et la suite $(\frac1{n+1})$ est à distance $1$ de la suite nulle. Converger dans $\mathcal B(X)$ vers $f$, c'est vérifier $\sup_X |f_n - f| \to 0$ : un même rang convient pour tous les points de $X$.
    - |
      Sur $X = [0, 1]$, les fonctions $f_n(x) = x^n$ sont dans $\mathcal B(X)$, mais elles ne forment pas une suite de Cauchy. L'écart $\|f_n - f_{2n}\|_\infty = \max_{[0, 1]} (x^n - x^{2n})$ vaut $\frac14$, atteint au point où $x^n = \frac12$. Elles ne convergent donc pas dans $\mathcal B(X)$, bien qu'elles convergent en tout point.
    - |
      Une limite en tout point de fonctions bornées n'est pas toujours bornée ; une limite pour $\|\cdot\|_\infty$ l'est, et c'est la complétude de $\mathcal B(X)$. Sur $X = \,]0, 1]$, les fonctions $f_n(x) = \min(n, \frac1x)$ sont bornées par $n$ et tendent en tout point vers $\frac1x$, qui ne l'est pas. Elles ne forment pas une suite de Cauchy de $\mathcal B(X)$, puisque $\|f_{2n} - f_n\|_\infty = n$, atteint en $x = \frac1{2n}$. Une suite de Cauchy de $\mathcal B(X)$, au contraire, converge vers une fonction bornée ({{f-exemples|Exemples d'espaces de Banach}}, (i)).

  espace-continues:
    - |
      L'espace $C(K)$ dépend de la topologie de $K$ autant que de l'ensemble. Pour $K$ fini, muni de la [[topologie-discrete|topologie discrète]], qui est séparée et compacte, toute fonction est continue, et $C(K)$ est $\mathbb R^K$ muni de $\max_K |f|$. Pour $K = \{0\} \cup \{\frac1{n+1} : n \in \mathbb N\}$, compact de $\mathbb R$ comme fermé borné, une fonction est continue si et seulement si $f(\frac1{n+1}) \to f(0)$, les points $\frac1{n+1}$ étant isolés ; $f \mapsto \big(f(\frac1{n+1})\big)_n$ identifie $C(K)$ à l'espace des suites convergentes, muni de $\sup_n |x_n|$.
    - |
      Sans compacité, la norme $\|f\|_\infty = \sup |f|$ n'est plus définie sur toutes les fonctions continues. Sur $]0, 1]$, la fonction $x \mapsto \frac1x$ est continue et non bornée. Les fonctions continues bornées sur $]0, 1]$ forment bien un sous-espace fermé de $\mathcal B(]0, 1])$, par l'argument du point (ii) de {{f-exemples|Exemples d'espaces de Banach}}, qui n'emploie pas la compacité pour la fermeture ; mais ce n'est plus l'espace de toutes les fonctions continues.
    - |
      La complétude de $C(K)$ fait converger toute série dont la série des normes converge, et sa somme est continue. Sur $K = [0, 2\pi]$, les fonctions $u_n(x) = \frac{\sin(nx)}{n^2}$, $n \geqslant 1$, vérifient $\|u_n\|_\infty \leqslant \frac1{n^2}$, et $\sum_n \frac1{n^2} \leqslant 2$. Par le point (iii) de {{f-evn|Espaces normés}}, la série $\sum_n u_n$ converge dans $C(K)$, c'est-à-dire que l'écart $\sup_K |S - S_N|$ entre sa somme $S$ et ses sommes partielles tend vers $0$ ; et cette somme est une fonction continue.

  equicontinue:
    - |
      Des fonctions continues, même uniformément bornées, ne forment pas toujours une partie équicontinue. Sur $[0, \pi]$, les fonctions $f_n(x) = \sin(nx)$, $n \geqslant 1$, sont à valeurs dans $[-1, 1]$, mais elles ne sont pas équicontinues en $0$ : pour tout $\delta > 0$, le point $y = \frac{\pi}{2n}$, de distance à $0$ inférieure à $\delta$ dès que $n > \frac\pi{2\delta}$, donne $|f_n(y) - f_n(0)| = 1$. La pente $n$ de $f_n$ en $0$ croît sans limite, et aucun $\delta$ ne convient pour toutes les fonctions.
    - |
      Une borne commune sur les pentes donne l'équicontinuité. Sur $[0, \pi]$, les fonctions $g_n(x) = \frac{\sin(nx)}n$, $n \geqslant 1$, sont $1$-lipschitziennes, puisque leur dérivée $\cos(nx)$ est bornée par $1$ ({{de-iaf|Inégalité des accroissements finis}}). Par le point (ii) de {{fc-equicontinuite|Équicontinuité}}, elles forment une partie uniformément équicontinue, a fortiori équicontinue, et $\delta = \varepsilon$ convient en tout point pour toutes. Elles convergent d'ailleurs uniformément vers $0$, puisque $|g_n| \leqslant \frac1n$.
    - |
      Une partie équicontinue n'est pas toujours bornée. Les fonctions constantes sur $[0, 1]$ forment une partie équicontinue, puisque $|f(y) - f(x)| = 0$ pour toutes, mais la suite des constantes $n$ n'a aucune suite extraite uniformément convergente, deux termes distincts étant à distance au moins $1$. Plus loin, le théorème d'Ascoli dira que ce sont exactement les deux conditions réunies, borné et équicontinu, qui caractérisent les parties d'adhérence compacte de $C(K)$, l'un des sens employant le choix dénombrable ⋆ ({{fc-ascoli|Théorème d'Ascoli}}, (i)).

  partie-relativement-compacte:
    - |
      Dans $\mathbb R$, une partie est relativement compacte si et seulement si elle est bornée. L'intervalle $]0, 1[$ l'est, d'adhérence $[0, 1]$, fermée et bornée donc compacte ({{tr-compacts|Compacts de ℝ}}), sans être lui-même compact. La partie $\mathbb N$, fermée mais non bornée, ne l'est pas : son adhérence, $\mathbb N$ lui-même, n'est pas compacte, puisque les intervalles $]n - \frac12, n + \frac12[$ la recouvrent sans qu'un nombre fini d'entre eux suffise.
    - |
      Dans $C([0, 1])$, muni de la norme uniforme, une famille bornée de fonctions à pentes bornées est relativement compacte. Les fonctions $x \mapsto x^a$, $a \in [1, 2]$, sont à valeurs dans $[0, 1]$ et de dérivée $ax^{a-1} \leqslant 2$ : elles sont $2$-lipschitziennes, donc équicontinues ({{fc-equicontinuite|Équicontinuité}}, (ii)). Par le théorème d'Ascoli ({{fc-ascoli|Théorème d'Ascoli}}, (i)), leur ensemble est relativement compact, le passage de précompacte à relativement compacte employant le choix dénombrable ⋆. Sans aucun choix, la forme séquentielle (ii) du même nœud extrait de toute suite de ces fonctions une suite uniformément convergente.
    - |
      Une partie bornée de $C([0, 1])$ n'est pas toujours relativement compacte. Les fonctions $x \mapsto \sin(n\pi x/2)$, $n \geqslant 1$, sont à valeurs dans $[-1, 1]$, mais elles ne sont pas équicontinues en $0$, puisque $\frac1n$ est envoyé sur $1$ quand $0$ l'est sur $0$, et $\frac1n$ tend vers $0$. Par le théorème d'Ascoli, cette partie n'est pas relativement compacte : la boule unité fermée de $C([0, 1])$, qui la contient, n'est pas compacte.

  polynomes-bernstein:
    - |
      L'erreur des polynômes de Bernstein peut être bien plus petite que la majoration $\frac{L}{2\sqrt n}$. Pour $f(x) = x^2$, qui est $2$-lipschitzienne sur $[0, 1]$, les identités du point (i) de {{fc-bernstein|Polynômes de Bernstein}} donnent, en écrivant $k^2 = (k - nx)^2 + 2nxk - n^2x^2$,
      $$B_nf(x) = x^2 + \frac{x(1 - x)}n.$$
      L'écart, maximal en $\frac12$, vaut $\frac1{4n}$, de l'ordre de $\frac1n$, alors que la majoration (iii) donne $\frac1{\sqrt n}$. Pour la fonction $|x - \frac12|$, anguleuse en $\frac12$, l'écart en ce point vaut au contraire $\frac{63}{512} \approx 0{,}123$ pour $n = 10$, du même ordre que la majoration $\frac1{2\sqrt{10}} \approx 0{,}158$ : c'est le point anguleux qui ralentit l'approximation.
    - |
      Le polynôme de Bernstein ne passe pas, en général, par les points $(\frac kn, f(\frac kn))$ qui le définissent. Pour $f(x) = x^2$ et $n = 2$, on trouve $B_2f(\frac12) = \frac14 + \frac18 = \frac38$, alors que $f(\frac12) = \frac14$. Les fonctions affines, elles, sont reproduites exactement en tous les points ({{fc-bernstein|Polynômes de Bernstein}}, (ii)), et toute fonction l'est aux deux extrémités $0$ et $1$.
    - |
      Sans continuité de $f$, l'écart $\sup_{[0, 1]} |B_nf - f|$ ne tend plus vers $0$. Pour $f = \mathbf 1_{[1/2, 1]}$, la fonction polynomiale $B_nf$ est continue, et elle vaut $0$ en $0$ et $1$ en $1$ ({{fc-bernstein|Polynômes de Bernstein}}, (ii)) : par le théorème des valeurs intermédiaires ({{c-tvi|Valeurs intermédiaires}}), elle prend la valeur $\frac12$ en un point $c$, où $|B_nf(c) - f(c)| = \frac12$. Plus loin, le théorème de Weierstrass établira au contraire que l'écart tend vers $0$ pour toute $f$ continue ({{fc-weierstrass|Théorème de Weierstrass}}, (i)).
      ```schema lex-polynomes-bernstein-3
      La fonction $\mathbf 1_{[1/2, 1]}$, en gris, et ses polynômes de Bernstein $B_4f$, $B_{16}f$ et $B_{64}f$, en vert, bleu et rouge. Ils se raidissent autour de $\frac12$, mais, continus et allant de $0$ à $1$, ils prennent chacun la valeur $\frac12$ en un point, où l'écart avec $f$ vaut $\frac12$ : l'écart maximal ne tend pas vers $0$.
      ```

  treillis-fonctions:
    - |
      Les fonctions lipschitziennes sur $[0, 1]$ forment un treillis qui interpole en deux points, donc une partie dense de $C([0, 1])$. Si $f$ et $g$ sont $k$-lipschitziennes, $\max(f, g)$ l'est aussi : $|\max(f, g)(x) - \max(f, g)(y)| \leqslant \max(|f(x) - f(y)|, |g(x) - g(y)|)$, et de même pour le minimum. Les fonctions affines, lipschitziennes, interpolent en deux points, et le lemme de {{fc-treillis|Lemme des treillis}} conclut à la densité.
    - |
      Un sous-espace vectoriel n'est pas toujours un treillis. Sur $[0, 1]$, les fonctions polynomiales forment un sous-espace, mais $\max(x, 1 - x)$ n'est pas polynomiale : un polynôme égal à $x$ sur $[\frac12, 1]$ est égal à $X$, puisque leur différence a une infinité de racines ({{pol-racines|Racines}}, (iii)), et il ne vaut donc pas $1 - x$ en $0$. Le lemme des treillis ne s'applique donc pas aux fonctions polynomiales, qui ne forment pas un treillis.
    - |
      Un treillis qui n'interpole pas en deux points peut avoir une adhérence bien plus petite que $C(K)$. Sur $[0, 1]$, les fonctions continues croissantes forment un treillis, le maximum et le minimum de deux fonctions croissantes étant croissants. Elles n'interpolent pas en $x = 0$, $y = 1$ avec $a = 1$ et $b = 0$, et la fonction $1 - x$ est à distance au moins $\frac12$ de chacune : si $g$ est croissante, $\max\big(|g(0) - 1|, |g(1)|\big) \geqslant \frac12$, puisque $g(1) \geqslant g(0)$.

  sous-algebre-fonctions:
    - |
      Le théorème de Stone-Weierstrass donne des densités que la seule théorie des polynômes en $x$ ne fournit pas. Sur $[0, 1]$, les fonctions $x \mapsto P(e^x)$, $P$ polynôme, forment une sous-algèbre de $C([0, 1])$, stable par produit puisque $P(e^x)Q(e^x) = (PQ)(e^x)$. Elle contient les constantes et sépare les points, l'exponentielle étant injective : elle est dense ({{fc-stone-weierstrass|Stone-Weierstrass}}, (iii)). Toute fonction continue sur $[0, 1]$ est donc limite uniforme de combinaisons linéaires de fonctions $e^{kx}$, $k \in \mathbb N$.
    - |
      Un sous-espace qui sépare les points et contient les constantes, mais n'est pas stable par produit, n'est pas dense en général. Les fonctions affines $a + bx$ sur $[0, 1]$ forment un tel sous-espace, puisque $x$ sépare les points ; il est de dimension $2$, donc fermé ({{gd-equivalence|Normes en dimension finie}}, (iv)), et il ne contient pas $x^2$. Il n'est pas une sous-algèbre, $x \cdot x$ n'étant pas affine, et le théorème ne s'applique pas.
    - |
      La condition de non-annulation ne peut pas être omise. Sur $[0, 1]$, les fonctions $(x - \frac12)Q(x)$, $Q$ polynôme, forment une sous-algèbre qui sépare les points, puisque la fonction $x - \frac12$, obtenue pour $Q = 1$, est injective. Toutes ses fonctions s'annulent en $\frac12$, et son adhérence est le fermé $\{f \in C([0, 1]) : f(\frac12) = 0\}$ ({{fc-stone-weierstrass|Stone-Weierstrass}}, (iv)) : la constante $1$, à distance au moins $1$ de chacune, n'en fait pas partie. Une seule annulation commune suffit à empêcher la densité.

  separe-points:
    - |
      Sur le cercle unité $\lex{sphere-unite}{S^1}$ de $\mathbb R^2$, la première coordonnée seule ne sépare pas les points, et les deux coordonnées ensemble les séparent. Les points $(x, y)$ et $(x, -y)$, distincts si $y \neq 0$, ont la même abscisse, alors que deux points distincts diffèrent par l'une de leurs coordonnées. Les polynômes en la seule abscisse ne peuvent donc pas être denses dans $C(S^1)$, comme le précise l'exemple suivant.
    - |
      Sans la séparation des points, le théorème de Stone-Weierstrass tombe. Sur $S^1$, les fonctions $(x, y) \mapsto P(x)$, $P$ polynôme, forment une sous-algèbre qui contient les constantes, sans séparer $(0, 1)$ de $(0, -1)$. La fonction $(x, y) \mapsto y$ n'est pas dans son adhérence : pour tout $P$, l'écart en $(0, 1)$ et en $(0, -1)$ vaut $|1 - P(0)|$ et $|1 + P(0)|$, dont l'un au moins dépasse $1$.
    - |
      Sur tout espace métrique compact $K$, les fonctions distance aux points séparent les points. Pour $a \in K$, la fonction $x \mapsto d(x, a)$ est continue, $1$-lipschitzienne, et, pour $x \neq y$, la fonction $d(\cdot, x)$ vaut $0$ en $x$ et $d(y, x) > 0$ en $y$. La sous-algèbre qu'elles engendrent avec les constantes est donc dense dans $C(K)$ ({{fc-stone-weierstrass|Stone-Weierstrass}}, (iii)).

  espace-separable:
    - |
      L'espace $\mathbb R^n$ est séparable, et une suite dense s'écrit sans rien choisir. Les points à coordonnées rationnelles forment l'ensemble $\mathbb Q^n$, dense puisque $\mathbb Q$ l'est dans $\mathbb R$ ({{tr-dense|Densité de ℚ}}) et que les produits d'intervalles ouverts forment une base de la topologie produit. Les bijections explicites de $\mathbb N$ sur $\mathbb Q$ et de $\mathbb N \times \mathbb N$ sur $\mathbb N$ ({{q-denombrable|ℚ est dénombrable}}) le rangent en une suite.
    - |
      L'espace $C([0, 1])$, de dimension infinie, est séparable : les polynômes à coefficients rationnels, rangés en une suite comme les suites finies de rationnels, en forment une partie dense ({{fc-separabilite|Séparabilité}}, (i)). Pour $f(x) = |x - \frac12|$, le polynôme de Bernstein $B_{16}f$ est à coefficients rationnels, puisque les valeurs $f(\frac k{16})$ le sont, et il est à distance au plus $\frac1{2\sqrt{16}} = \frac18$ de $f$ ({{fc-bernstein|Polynômes de Bernstein}}, (iii)) : c'est un terme de la suite à moins de $0{,}2$ de $f$.
    - |
      L'espace des [[suite-bornee|suites bornées]], muni de $\|x\|_\infty = \sup_n |x_n|$, n'est pas séparable. Les indicatrices $\mathbf 1_A$ des parties $A$ de $\mathbb N$ y sont deux à deux à distance $1$. Si $(g_j)$ était une suite dense, le plus petit $j$ tel que $\|g_j - \mathbf 1_A\|_\infty < \frac12$ serait, pour deux parties distinctes, deux indices distincts : on aurait une injection de $\mathcal P(\mathbb N)$ dans $\mathbb N$, ce que le théorème de Cantor interdit ({{r-cantor|Théorème de Cantor}}).

  espace-applications-continues:
    - |
      La continuité d'une forme linéaire dépend de la norme de départ. Sur l'espace des fonctions continues sur $[0, 1]$, l'évaluation $f \mapsto f(0)$ est continue pour $\|f\|_\infty = \sup |f|$, de norme $1$, puisque $|f(0)| \leqslant \|f\|_\infty$ avec égalité pour $f = 1$. Elle ne l'est pas pour $N(f) = \int_0^1 |f|$ : les fonctions $f_n(x) = \max(0, 1 - nx)$ vérifient $N(f_n) = \frac1{2n}$ et $f_n(0) = 1$, si bien qu'aucune constante $C$ ne donne $|f(0)| \leqslant C\,N(f)$ ({{f-operateurs|Opérateurs continus}}, (i)).
    - |
      L'inégalité $|||v \circ u||| \leqslant |||v|||\;|||u|||$ est souvent stricte. Sur l'espace des fonctions continues sur $[0, 1]$, muni de $\|\cdot\|_\infty$, la multiplication $M_g(f) = gf$ par une fonction continue $g$ est continue, de norme $\|g\|_\infty$ : $\|gf\|_\infty \leqslant \|g\|_\infty\|f\|_\infty$, avec égalité pour $f = 1$. Pour $g(x) = x$ et $h(x) = 1 - x$, de normes $1$, la composée $M_g \circ M_h = M_{gh}$ a pour norme $\max_{[0, 1]} x(1 - x) = \frac14$, quatre fois moins que le produit des normes.
    - |
      Sans la complétude de l'espace d'arrivée, $\mathcal L_c(E, F)$ peut ne pas être complet. Pour $E = \mathbb R$, l'application $u \mapsto u(1)$ est une bijection linéaire de $\mathcal L_c(\mathbb R, F)$ sur $F$ qui conserve la norme, puisque $\|u(t)\| = |t|\,\|u(1)\|$. Prenons pour $F$ les suites nulles à partir d'un certain rang, avec $\|x\|_\infty = \max_n |x_n|$ : les suites tronquées $s_N = (1, \frac12, \dots, \frac1{N+1}, 0, \dots)$ y sont de Cauchy, avec $\|s_M - s_N\|_\infty = \frac1{N+2}$ pour $M > N$. Une limite $x \in F$ aurait pour coordonnées les limites $\frac1{n+1}$ des coordonnées, puisque $|x_n - y_n| \leqslant \|x - y\|_\infty$, et ne serait pas nulle à partir d'un rang. Ni $F$ ni $\mathcal L_c(\mathbb R, F)$ ne sont donc complets, ce que le point (iii) de {{f-operateurs|Opérateurs continus}} exclut quand $F$ est un espace de Banach.

  exposants-conjugues:
    - |
      Le conjugué d'un exposant décroît quand celui-ci croît, et $2$ est le seul exposant égal à son conjugué. La formule $q = \frac{p}{p - 1}$ donne $3$ pour $p = \frac32$, $4$ pour $p = \frac43$, et $\frac32$ pour $p = 3$ : l'application $p \mapsto \frac{p}{p - 1}$ est une [[bijection]] de $]1, +\infty[$ sur lui-même, égale à sa réciproque. Quand $p$ tend vers $1$, $q$ tend vers $+\infty$, et quand $p$ tend vers $+\infty$, $q$ tend vers $1$ : c'est ce qui justifie de déclarer $1$ et $+\infty$ conjugués. L'égalité $p = q$ donne $p^2 = 2p$, soit $p = 2$.
      ```schema lex-exposants-conjugues-1
      La courbe $q = \frac{p}{p - 1}$, en rouge, est symétrique par rapport à la diagonale $q = p$, en gris, qu'elle ne coupe qu'au point $(2, 2)$ : la conjugaison est sa propre réciproque. Elle longe les droites $p = 1$ et $q = 1$, en pointillé, et les couples $(\frac32, 3)$ et $(3, \frac32)$, en bleu, sont symétriques l'un de l'autre.
      ```
    - |
      L'inégalité de Young se lit sur des nombres simples, et son cas d'égalité aussi. Pour $p = 3$ et $q = \frac32$, avec $a = 2$ et $b = 1$, elle donne $2 \leqslant \frac83 + \frac23 = \frac{10}3$, inégalité stricte, puisque $a^3 = 8$ diffère de $b^{3/2} = 1$. Pour $a = b = 1$, on a $a^3 = b^{3/2}$, et l'égalité $1 = \frac13 + \frac23$ a bien lieu ({{lp-young|Inégalité de Young}}).
    - |
      Sans la conjugaison, l'inégalité de Young tombe. Pour $p = q = 3$, de sorte que $\frac1p + \frac1q = \frac23$, l'inégalité $ab \leqslant \frac{a^3}3 + \frac{b^3}3$ est fausse en $a = b = 1$, où elle dirait $1 \leqslant \frac23$. Pour $p = q = \frac32$, de somme $\frac43$, elle s'écrirait $t^2 \leqslant \frac43\,t^{3/2}$ en $a = b = t$, ce qui est faux dès que $t > \frac{16}9$. La condition $\frac1p + \frac1q = 1$ est exactement celle qui multiplie les deux membres par le même facteur $s$ quand on remplace $a$ par $s^{1/p}a$ et $b$ par $s^{1/q}b$. Plus loin, c'est elle qui donnera l'inégalité de Hölder ({{lp-holder|Inégalité de Hölder}}).

  espace-Lp:
    - |
      Sur une mesure finie, une singularité exclut des espaces $L^p$ d'autant plus d'exposants qu'elle est forte. Pour la mesure de Lebesgue sur $]0, 1]$ et $f(x) = x^{-1/4}$, on a $|f|^p = x^{-p/4}$ ({{lp-puissances|Puissances réelles}}, (iii)), et, pour $p \neq 4$,
      $$\int_{1/n}^1 x^{-p/4} \, dx = \frac{1 - n^{p/4 - 1}}{1 - p/4}.$$
      Par convergence monotone, $f$ est dans $L^p$ si et seulement si $p < 4$, avec $\|f\|_p = \big(\frac4{4 - p}\big)^{1/p}$, soit $\frac43$ pour $p = 1$ et $\sqrt 2$ pour $p = 2$ ; pour $p = 4$, l'intégrale sur $[\frac1n, 1]$ vaut $\ln n$. Comme $f$ dépasse tout réel $M > 0$ sur l'intervalle $]0, M^{-4}[$, de mesure non nulle, elle n'est pas non plus [[essentiellement-bornee|essentiellement bornée]].
    - |
      Pour la mesure de comptage sur $\mathbb N$, ce sont au contraire les grands exposants qui sont les moins exigeants. La suite $a = (\frac1{n+1})$ est dans $\ell^2$, puisque $\frac1{m^2} \leqslant \int_{m-1}^m \frac{dt}{t^2}$ pour $m \geqslant 2$ donne $\sum_m \frac1{m^2} \leqslant 1 + \int_1^{+\infty} \frac{dt}{t^2} = 2$. Elle est donc dans $\ell^p$ pour tout $p \geqslant 2$, ses termes étant au plus $1$ ({{lp-puissances|Puissances réelles}}, (vi)). Elle n'est pas dans $\ell^1$, la comparaison inverse $\frac1m \geqslant \int_m^{m+1} \frac{dt}t$ minorant ses sommes partielles par des logarithmes qui tendent vers $+\infty$. La suite constante égale à $1$, enfin, est dans $\ell^\infty$ et dans aucun $\ell^p$, $p$ fini.
    - |
      La condition $p \geqslant 1$ n'est pas une commodité. Pour la mesure de Lebesgue sur $[0, 1]$, $f = \mathbf 1_{[0, 1/2[}$ et $g = \mathbf 1_{[1/2, 1]}$, la même formule $\big(\int |h|^p\big)^{1/p}$ avec $p = \frac12$ vaut $\frac14$ en $f$ et en $g$, puisque $\big(\frac12\big)^2 = \frac14$, et $1$ en leur somme $f + g = 1$ : l'inégalité triangulaire tombe. Pour $p \geqslant 1$, le point (iii) de {{lp-espaces|Espaces Lᵖ}} ne donne encore que l'homogénéité et la séparation. Plus loin, l'inégalité de Minkowski fournira l'inégalité triangulaire, et fera de $\|\cdot\|_p$ une norme ({{lp-minkowski|Inégalité de Minkowski}}).

  espace-L-infini:
    - |
      Pour une fonction continue sur $[0, 1]$, muni de la mesure de Lebesgue, la borne supérieure essentielle est la borne supérieure. Si $|f(x_0)| > M$, la continuité donne $|f| > M$ sur un intervalle non réduit à un point, qui n'est pas [[negligeable|négligeable]] ; aucun $M < \sup |f|$ ne convient donc. Il en découle que deux fonctions continues égales presque partout sont égales, et que la borne supérieure essentielle $\|\cdot\|_\infty$ prolonge, sur les classes de fonctions continues, la borne supérieure $\sup |f|$.
    - |
      Sur une mesure finie, $L^\infty$ est contenu dans tous les $L^p$, et cette inclusion tombe sans la finitude. Par le point (ii) de {{lp-espaces|Espaces Lᵖ}}, $|f| \leqslant \|f\|_\infty$ presque partout, d'où $\int |f|^p \, d\mu \leqslant \|f\|_\infty^p\,\mu(X)$. Sur $\mathbb R$, muni de la mesure de Lebesgue, la constante $1$ est dans $L^\infty$, de borne supérieure essentielle $1$, mais $\int |1|^p = \lambda(\mathbb R) = +\infty$ pour tout $p$ fini : elle n'est dans aucun $L^p$.
    - |
      La notation $\|\cdot\|_\infty$ se justifie par un passage à la limite. Sur $[0, 1]$, pour $f(x) = x$, on a $\|f\|_p = (p + 1)^{-1/p} = \exp\big(-\frac{\ln(p + 1)}p\big)$, qui vaut $\frac12$ pour $p = 1$, environ $0{,}577$ pour $p = 2$ et $0{,}787$ pour $p = 10$, et tend vers $1 = \|f\|_\infty$. En effet, $\frac{\ln(p + 1)}{p + 1}$ tend vers $0$ ({{ex-croissances|Croissances comparées}}, (iii)), donc aussi $\frac{\ln(p + 1)}p$, et l'exponentielle est continue en $0$. Plus grand est $p$, plus $\|f\|_p$ est sensible aux grandes valeurs de $|f|$, et à la limite seules comptent les valeurs que $|f|$ dépasse sur une partie non négligeable.

  inegalite-holder:
    - |
      Pour la mesure de comptage sur un ensemble fini, l'inégalité de Hölder est une inégalité entre sommes. Sur $\{1, 2, 3\}$, avec $p = 3$, $q = \frac32$, $a = (1, 2, 1)$ et $b = (1, 1, 4)$, on trouve $\sum |a_ib_i| = 7$, alors que $\|a\|_3 = 10^{1/3} \approx 2{,}154$ et $\|b\|_{3/2} = (2 + 8)^{2/3} = 10^{2/3} \approx 4{,}642$, de produit $10$. L'écart vient de ce que $|b|^{3/2} = (1, 1, 8)$ n'est pas proportionnel à $|a|^3 = (1, 8, 1)$, comme l'exigerait le cas d'égalité (ii).
    - |
      Avec des exposants non conjugués, l'inégalité tombe, et le produit peut même cesser d'être intégrable. Sur $]0, 1]$, la fonction $f(x) = x^{-1/2}$ est dans $L^{3/2}$, puisque $|f|^{3/2} = x^{-3/4}$ est intégrable, mais le produit $f \cdot f = \frac1x$ ne l'est pas. Les exposants $\frac32$ et $\frac32$, de somme des inverses $\frac43 \neq 1$, ne sont pas conjugués ; pour $p = 2$ et $q = 2$, seuls conjugués égaux, $f$ n'est plus dans $L^2$.
    - |
      Pour $p = 1$ et $q = +\infty$, le cas d'égalité (iii) se lit sur les valeurs de $g$. Sur $[0, 1]$, avec $f = 1$ et $g(x) = 1 - x$, on a $\int |fg| = \frac12$ et $\|f\|_1\|g\|_\infty = 1$ : l'inégalité est stricte, parce que $|g| < 1 = \|g\|_\infty$ sur $]0, 1]$, partie non négligeable de $\{f \neq 0\}$. Pour $f = n\,\mathbf 1_{[0, 1/n]}$, de norme $1$, l'intégrale $\int fg = 1 - \frac1{2n}$ s'approche de $1$, sans l'atteindre. Plus loin, cette inégalité donnera celle de Minkowski, et fera de $\|\cdot\|_p$ une norme ({{lp-minkowski|Inégalité de Minkowski}}).

  inegalite-minkowski:
    - |
      Sur $[0, 1]$, muni de la mesure de Lebesgue, l'inégalité de Minkowski pour $p = 2$, $f = 1$ et $g(x) = x$ est stricte. On a $\|f + g\|_2 = \big(\int_0^1 (1 + x)^2\big)^{1/2} = \sqrt{7/3} \approx 1{,}528$, alors que $\|f\|_2 + \|g\|_2 = 1 + \frac1{\sqrt3} \approx 1{,}577$. L'écart se lit sur le développement $\|f + g\|_2^2 = \|f\|_2^2 + 2\langle f, g \rangle + \|g\|_2^2$ : ici $\langle f, g \rangle = \frac12$ est strictement inférieur à $\|f\|_2\|g\|_2 = \frac1{\sqrt3}$, et c'est ce défaut dans l'inégalité de Cauchy-Schwarz qui rend celle de Minkowski stricte. Pour $g = 2f$, au contraire, les deux membres valent $3$.
    - |
      Sans la condition $p \geqslant 1$, l'inégalité de Minkowski tombe. Pour la mesure de comptage sur $\{1, 2\}$ et $p = \frac12$, la formule $\big(\sum_i |x_i|^{1/2}\big)^2$ vaut $1$ en $u = (1, 0)$ et en $v = (0, 1)$, mais $(1 + 1)^2 = 4$ en $u + v$, et $4 > 1 + 1$. L'inégalité est même renversée sur cet exemple : la « norme » d'une somme de deux vecteurs à coordonnées positives dépasse la somme de leurs « normes ».
    - |
      Pour $p = +\infty$, le cas d'égalité dépend des signes. Sur $[0, 1]$, $f = 1$ et $g(x) = x$ donnent $\|f + g\|_\infty = 2 = \|f\|_\infty + \|g\|_\infty$, car $1 + x$ dépasse $2 - \varepsilon$ sur l'intervalle $]1 - \varepsilon, 1]$, non négligeable, et ne dépasse jamais $2$. Avec $g(x) = -x$, en revanche, $\|1 - x\|_\infty = 1 < 2$ : les deux fonctions s'approchent de leurs bornes essentielles au même endroit, mais avec des signes opposés. Plus loin, l'inégalité de Minkowski, appliquée aux sommes partielles d'une série, donnera la complétude de $L^p$, avec le choix dénombrable ⋆ des représentants d'une suite de classes ({{lp-completude|Riesz-Fischer pour tout p}}).

  mesure-densite:
    - |
      Sur $[0, 1]$, muni de ses boréliens et de la mesure de Lebesgue, la densité $f(x) = 2x$ donne la mesure $\nu = f\cdot\lambda$, qui vérifie $\nu([0, t]) = \int_0^t 2x\,dx = t^2$ et $\nu([0, 1]) = 1$. Le point (i) de {{lp-absolue-continuite|Absolue continuité}} transforme les intégrales : $\int x \, d\nu = \int_0^1 2x^2\,dx = \frac23$. La masse se concentre vers $1$, là où la densité est grande : $\nu([0, \frac12]) = \frac14$ seulement.
    - |
      Sur $\mathbb N$, muni de $\mathcal P(\mathbb N)$, toute mesure $\nu$ est à densité par rapport à la mesure de comptage $\mu$, de densité $n \mapsto \nu(\{n\})$ si celle-ci est finie partout. Par σ-additivité, $\nu(A) = \sum_{n \in A} \nu(\{n\}) = \int_A f \, d\mu$. Ainsi la mesure de Dirac $\delta_3$ a pour densité $\mathbf 1_{\{3\}}$, et cette densité est unique, $\mu$ étant σ-finie ({{lp-absolue-continuite|Absolue continuité}}, (iv)) : c'est même immédiat, chaque singleton ayant la masse $1$.
    - |
      Sans σ-finitude, la densité n'est pas déterminée par la mesure. Sur $[0, 1]$, muni de ses boréliens, soit $\mu(A) = +\infty$ si $\lambda(A) > 0$ et $\mu(A) = 0$ sinon ; c'est une mesure, nulle exactement sur les $\lambda$-négligeables. Pour toute fonction mesurable $f$ à valeurs dans $]0, +\infty[$, la mesure $f\cdot\mu$ vaut $+\infty$ sur les parties de mesure de Lebesgue non nulle et $0$ sur les autres, et c'est $\mu$ elle-même : les densités $1$ et $2$ donnent la même mesure. Une partie de mesure finie non nulle pour $\mu$ n'existe pas, et $\mu$ n'est pas [[mesure-sigma-finie|σ-finie]].

  absolument-continue:
    - |
      Une mesure à densité est absolument continue, et la réciproque d'une absolue continuité dépend des zéros de la densité. Sur $[0, 1]$, muni de la mesure de Lebesgue $\lambda$ et de ses boréliens, la mesure $\nu = f\cdot\lambda$ de densité $f(x) = 2x$ vérifie $\nu \ll \lambda$ ({{lp-absolue-continuite|Absolue continuité}}, (iii)). On a aussi $\lambda \ll \nu$ : si $\nu(A) = 0$, alors $2x = 0$ pour presque tout $x \in A$, d'où $\lambda(A) \leqslant \lambda(\{0\}) = 0$. Pour la densité $\mathbf 1_{[0, 1/2]}$, en revanche, $\lambda$ n'est pas absolument continue par rapport à $\mathbf 1_{[0, 1/2]}\cdot\lambda$, qui ne charge pas $]\frac12, 1]$.
    - |
      Une mesure de Dirac n'est pas absolument continue par rapport à la mesure de Lebesgue. Sur les boréliens de $\mathbb R$, la partie $\{0\}$ est $\lambda$-négligeable, alors que $\delta_0(\{0\}) = 1$. La relation n'a pas lieu non plus dans l'autre sens, $]1, 2[$ étant $\delta_0$-négligeable sans l'être pour $\lambda$ : les deux mesures sont même [[mesures-etrangeres|étrangères]], avec $S = \{0\}$.
    - |
      L'absolue continuité peut avoir lieu sans qu'aucune densité n'existe, quand la mesure de référence n'est pas σ-finie. Sur les boréliens de $[0, 1]$, pour la mesure de comptage $\mu$, seul le vide est négligeable, si bien que $\lambda \ll \mu$. Une densité $f$ donnerait $0 = \lambda(\{x\}) = \int_{\{x\}} f \, d\mu = f(x)$ pour tout $x$, puis $\lambda = 0$, ce qui est absurde. Plus loin, le théorème de Radon-Nikodym montrera que, pour des mesures [[mesure-sigma-finie|σ-finies]], l'absolue continuité équivaut à l'existence d'une densité ({{lp-radon-nikodym|Radon-Nikodym}}, (ii)), avec le choix dénombrable ⋆, dont on se passe quand la tribu est engendrée par une suite de parties.

  mesures-etrangeres:
    - |
      Deux mesures portées par des parties disjointes sont étrangères. Sur $\mathbb R$, soit $\mu = \mathbf 1_{[0, 1]}\cdot\lambda$ et $\nu = \mathbf 1_{[2, 3]}\cdot\lambda$ : la partie $S = [2, 3]$ vérifie $\mu(S) = 0$ et $\nu(\mathbb R \setminus S) = 0$. Le rôle de $S$ n'est pas symétrique dans la définition, mais la relation l'est : $\mathbb R \setminus S$ convient pour échanger $\mu$ et $\nu$.
    - |
      Deux mesures peuvent n'être ni étrangères ni absolument continues l'une par rapport à l'autre. Soit $\mu = \mathbf 1_{[0, 1]}\cdot\lambda$ et $\nu = \mathbf 1_{[1/2, 2]}\cdot\lambda$. Si $\mu(S) = 0$, alors $\lambda(S \cap [\frac12, 1]) = 0$, et $\nu(\mathbb R \setminus S) \geqslant \lambda([\frac12, 1] \setminus S) = \frac12$ : elles ne sont pas étrangères. L'intervalle $]1, 2]$, $\mu$-négligeable, ne l'est pas pour $\nu$, et $[0, \frac12[$ fait de même dans l'autre sens.
    - |
      Être étrangères n'a rien à voir avec une séparation topologique. Sur $\mathbb R$, la mesure $\nu = \sum_k \delta_{q_k}$, où $(q_k)$ énumère $\mathbb Q$ ({{q-denombrable|ℚ est dénombrable}}), charge tout intervalle non réduit à un point, comme $\lambda$. Elle est pourtant étrangère à $\lambda$, avec $S = \mathbb Q$ : $\lambda(\mathbb Q) = 0$ et $\nu(\mathbb R \setminus \mathbb Q) = 0$. Plus loin, la décomposition de Lebesgue écrira, avec le choix dénombrable ⋆, toute mesure σ-finie comme somme d'une partie absolument continue et d'une partie étrangère à une mesure σ-finie donnée ({{lp-radon-nikodym|Radon-Nikodym}}, (i)).

  decomposition-lebesgue:
    - |
      Une mesure qui mêle une partie étalée et une masse ponctuelle se décompose à vue. Sur $\mathbb R$, la mesure $\nu = \mathbf 1_{[0, 1]}\cdot\lambda + \delta_2$ a pour décomposition de Lebesgue par rapport à $\lambda$ la partie $\nu_a = \mathbf 1_{[0, 1]}\cdot\lambda$, absolument continue, et la partie $\nu_s = \delta_2$, étrangère à $\lambda$ avec $S = \{2\}$. Par l'unicité du point (i) de {{lp-radon-nikodym|Radon-Nikodym}}, il n'y en a pas d'autre ; cette unicité ne demande aucun choix, la tribu borélienne de $\mathbb R$ étant engendrée par une suite de parties ((iv) du même nœud).
    - |
      La décomposition dépend de la mesure de référence. La même mesure $\nu = \mathbf 1_{[0, 1]}\cdot\lambda + \delta_2$, décomposée par rapport à $\mu = \delta_2$, donne $\nu_a = \delta_2$, absolument continue par rapport à $\delta_2$, et $\nu_s = \mathbf 1_{[0, 1]}\cdot\lambda$, étrangère à $\delta_2$ avec $S = \mathbb R \setminus \{2\}$. Les rôles des deux parties s'échangent : chacune est absolument continue par rapport à l'une des deux références et étrangère à l'autre.
    - |
      Sans σ-finitude, la décomposition peut ne pas exister. Sur les boréliens de $[0, 1]$, soit $\nu$ la mesure de comptage et $\mu = \lambda$. Si l'on avait $\nu = \nu_a + \nu_s$, avec $\nu_a \ll \lambda$ et $\nu_s$ portée par une partie $S$ telle que $\lambda(S) = 0$, alors $\nu_a(\{x\}) = 0$ pour tout $x$, d'où $\nu_s(\{x\}) = 1$, ce qui impose $x \in S$. On aurait $S = [0, 1]$, de mesure de Lebesgue $1$ : contradiction.

  derivee-radon-nikodym:
    - |
      Sur $[0, 1]$, muni de ses boréliens, la mesure $\nu = 2x\cdot\lambda$ a pour dérivée $\frac{d\nu}{d\lambda} = 2x$, et la mesure $\pi = 3x^2\cdot\lambda$ vérifie $\pi \ll \nu$, avec $\frac{d\pi}{d\nu}(x) = \frac{3x}2$ pour $x > 0$. On le voit par le point (ii) de {{lp-absolue-continuite|Absolue continuité}} : $\frac{3x}2\cdot(2x\cdot\lambda) = 3x^2\cdot\lambda$. La règle de la chaîne ({{lp-radon-nikodym|Radon-Nikodym}}, (iii)) se vérifie : $\frac{3x}2 \cdot 2x = 3x^2$.
    - |
      Sur $\mathbb N$, la dérivée de Radon-Nikodym est un quotient de masses. Pour $\mu = \sum_n 2^{-n}\delta_n$ et $\nu = \sum_n 3^{-n}\delta_n$, finies, tout singleton a une masse non nulle pour les deux, et $\frac{d\nu}{d\mu}(n) = \frac{\nu(\{n\})}{\mu(\{n\})} = \big(\frac23\big)^n$. Inversement $\frac{d\mu}{d\nu}(n) = \big(\frac32\big)^n$, et le produit vaut $1$, comme le veut le point (iii) de {{lp-radon-nikodym|Radon-Nikodym}} pour deux mesures mutuellement absolument continues.
    - |
      L'inverse d'une dérivée n'est une dérivée que si l'absolue continuité a lieu dans les deux sens. Sur $[0, 2]$, la mesure $\nu = \mathbf 1_{[0, 1]}\cdot\lambda$ vérifie $\nu \ll \lambda$, avec $\frac{d\nu}{d\lambda} = \mathbf 1_{[0, 1]}$. Mais $\lambda$ n'est pas absolument continue par rapport à $\nu$, puisque $]1, 2]$ est $\nu$-négligeable sans l'être pour $\lambda$ : $\frac{d\lambda}{d\nu}$ n'existe pas, et l'égalité $\frac{d\lambda}{d\nu}\frac{d\nu}{d\lambda} = 1$ n'a pas de sens là où la densité $\mathbf 1_{[0, 1]}$ s'annule.

  distance-partie:
    - |
      Dans $\mathbb R$, la distance à un segment se calcule par morceaux. Pour $A = [0, 1]$, on trouve $d(x, A) = -x$ si $x < 0$, $0$ si $0 \leqslant x \leqslant 1$, et $x - 1$ si $x > 1$, fonction $1$-lipschitzienne nulle exactement sur $A$, qui est fermé. Pour $A = \mathbb Q$, au contraire, $d(x, \mathbb Q) = 0$ pour tout réel $x$, puisque $\mathbb Q$ est dense ({{tr-dense|Densité de ℚ}}) : la distance ne voit que l'adhérence.
    - |
      La borne inférieure qui définit $d(x, A)$ n'est pas toujours atteinte, et $d(x, A) = 0$ n'entraîne pas $x \in A$. Pour $A = \,]0, 1]$ et $x = 0$, on a $d(0, A) = 0$, alors que $0 \notin A$ : le point (i) de {{mk-urysohn|Lemme d'Urysohn}} demande que $A$ soit fermée. Pour $A = \,]0, 1[$ et $x = 2$, la distance vaut $1$, et aucun point de $A$ ne la réalise.
    - |
      La distance fournit directement les fonctions d'Urysohn. Sur $\mathbb R$, avec le fermé $F = [0, 1]$ et l'ouvert $U = \,]{-1}, 2[$, la fonction
      $$f(x) = \frac{d(x, \mathbb R \setminus U)}{d(x, \mathbb R \setminus U) + d(x, F)}$$
      est bien définie, le dénominateur ne s'annulant pas, puisque $F$ et $\mathbb R \setminus U$ sont des fermés disjoints. Elle est continue, à valeurs dans $[0, 1]$, égale à $1$ sur $F$ et nulle hors de $U$.
      ```schema lex-distance-partie-3
      La fonction $f$, en rouge, vaut $1$ sur $F = [0, 1]$ et $0$ hors de $U = \,]{-1}, 2[$, et elle est affine entre les deux, de $-1$ à $0$ et de $1$ à $2$. La distance à $F$, en bleu, s'annule sur $F$ ; la distance au complémentaire de $U$, en vert large, est une tente de sommet $\frac32$ en $\frac12$, nulle hors de $U$, que la fonction rouge suit de $-1$ à $0$ et de $1$ à $2$. Les deux distances ne s'annulent jamais ensemble.
      ```

  forme-lineaire-positive:
    - |
      Une combinaison à coefficients positifs d'évaluations et d'intégrales est une forme linéaire positive, et sa norme se lit sur la constante $1$. Sur $C([0, 1])$, la forme $\Lambda f = f(0) + 2\int_0^1 f(x)\,dx$ est linéaire et positive, puisque $f \geqslant 0$ donne $f(0) \geqslant 0$ et $\int_0^1 f \geqslant 0$. Le point (i) de {{mk-formes-positives|Formes positives}} donne $|\Lambda f| \leqslant 3\|f\|_\infty$, avec égalité pour $f = 1$ : sa norme est $\Lambda(1) = 3$.
    - |
      Sans positivité, la norme ne se lit plus sur la constante $1$. La forme $\Lambda f = f(0) - f(1)$ sur $C([0, 1])$ est linéaire et continue, mais elle n'est pas positive, puisque $f(x) = x$, positive, donne $\Lambda f = -1$. On a $\Lambda(1) = 0$, alors que sa norme vaut $2$ : $|\Lambda f| \leqslant 2\|f\|_\infty$, avec égalité pour $f(x) = 1 - 2x$, de norme $1$ et d'image $2$.
    - |
      Un poids positif définit une forme linéaire positive. Sur $C([0, 1])$, $\Lambda f = \int_0^1 x f(x)\,dx$ est positive, puisque $xf(x) \geqslant 0$ dès que $f \geqslant 0$, et sa norme est $\Lambda(1) = \frac12$. Elle est croissante, comme toute forme linéaire positive : $f \leqslant g$ donne $\Lambda g - \Lambda f = \Lambda(g - f) \geqslant 0$. Plus loin, le théorème de Riesz-Markov la représentera par une unique mesure borélienne finie, celle qui donne à $[a, b]$ la masse $\int_a^b x\,dx$, dont l'existence générale emploie le choix dénombrable ⋆ ({{mk-riesz-markov|Riesz-Markov}}, (i)).

  forme-lineaire-positive-lp:
    - |
      L'intégrale contre une fonction positive de $L^q$ est une forme linéaire positive et continue sur $L^p$. Pour $g \geqslant 0$ dans $L^q(\mu)$, $q$ conjugué de $p$, la forme $\psi(f) = \int fg \, d\mu$ est définie sur $L^p(\mu)$ par l'inégalité de Hölder ({{lp-holder|Inégalité de Hölder}}), qui donne aussi $|\psi(f)| \leqslant \|g\|_q\|f\|_p$. Elle est positive, puisque $f \geqslant 0$ presque partout entraîne $fg \geqslant 0$ presque partout. Elle ne dépend pas des représentants : deux fonctions égales presque partout ont la même intégrale contre $g$.
    - |
      Sur $L^1([0, 1])$, pour la mesure de Lebesgue, la forme $\varphi(f) = \int_0^1 (x - \frac12) f(x)\,dx$ n'est pas positive, puisque $f = \mathbf 1_{[0, 1/2]}$ donne $-\frac18$. Elle est continue, avec $|\varphi(f)| \leqslant \frac12\|f\|_1$, et la formule du lemme donne, pour $f \geqslant 0$, $\varphi^+(f) = \int_0^1 (x - \frac12)^+ f(x)\,dx$. On majore en effet $\varphi(h) \leqslant \int (x - \frac12)^+h \leqslant \int (x - \frac12)^+f$ pour $0 \leqslant h \leqslant f$, et le choix $h = f\,\mathbf 1_{]1/2, 1]}$ atteint cette borne. La décomposition $\varphi = \varphi^+ - \varphi^-$ de {{lp-formes-positives|Formes positives sur Lᵖ}} revient donc à couper la fonction $x - \frac12$ en ses parties positive et négative.
    - |
      Une forme linéaire positive sur des fonctions n'en définit pas toujours une sur $L^p$ : il faut qu'elle ignore les ensembles négligeables. Sur $[0, 1]$, l'évaluation $f \mapsto f(0)$ est linéaire et positive sur l'espace des fonctions mesurables de puissance $p$-ième intégrable, mais elle ne passe pas aux classes : $\mathbf 1_{\{0\}}$ et la fonction nulle sont égales presque partout, et leurs valeurs en $0$ diffèrent. Plus loin, le théorème de dualité dira que, pour $1 \leqslant p < +\infty$ et $\mu$ σ-finie, les formes continues sur $L^p$ sont exactement les $f \mapsto \int fg$, $g \in L^q$ ({{lp-dual|Dual de Lᵖ}}, (ii)) ; la démonstration emploie le choix dénombrable ⋆, sauf pour une tribu engendrée par une suite de parties ((iii)).

  mesure-reguliere:
    - |
      Une mesure de Dirac sur un espace métrique compact $K$ est régulière, et on le voit sans aucun calcul. Soit $a \in K$ et $E$ un borélien. Si $a \in E$, le fermé $\{a\} \subset E$ a la masse $1 = \delta_a(E)$, et tout ouvert contenant $E$ a aussi la masse $1$. Si $a \notin E$, l'ouvert $K \setminus \{a\}$, qui contient $E$, est de masse $0$, et le fermé vide aussi. Les deux bornes de la définition valent donc $\delta_a(E)$.
    - |
      Pour la mesure de Lebesgue sur $[0, 1]$, la régularité donne des fermés surprenants. Numérotons les rationnels de $[0, 1]$ en une suite $(q_k)$, sans choix ({{q-denombrable|ℚ est dénombrable}}), et retirons de $[0, 1]$ la réunion $U$ des intervalles ouverts de centre $q_k$ et de longueur $\varepsilon 2^{-k-1}$. Le fermé $F = [0, 1] \setminus U$ ne contient aucun rationnel, et $\lambda(F) \geqslant 1 - \sum_k \varepsilon 2^{-k-1} = 1 - \varepsilon$. La mesure de l'ensemble des irrationnels de $[0, 1]$, égale à $1$, est donc bien la borne supérieure des mesures des fermés qu'il contient, alors qu'aucun d'eux ne contient d'intervalle.
    - |
      La finitude, que suppose la définition, n'est pas une restriction anodine. Sur les boréliens de $[0, 1]$, la mesure de comptage $\mu$ donne à $\{0\}$ la masse $1$, alors que tout ouvert qui contient $0$ contient un intervalle $[0, r[$, infini, et reçoit la masse $+\infty$ : la borne inférieure des $\mu(U)$, $U \supset \{0\}$ ouvert, vaut $+\infty \neq \mu(\{0\})$. La propriété de régularité tombe donc pour cette mesure, qui n'est pas finie.

  famille-orthonormee:
    - |
      L'orthonormalité dépend du [[produit-scalaire|produit scalaire]], et pas seulement des vecteurs. Sur $\mathbb R^2$, l'application $\langle x, y \rangle = 2x_1y_1 + x_1y_2 + x_2y_1 + x_2y_2$ est symétrique, linéaire par rapport à chaque variable, et $\langle x, x \rangle = x_1^2 + (x_1 + x_2)^2$ ne s'annule qu'en $0$ : c'est un produit scalaire. Pour lui, la base canonique n'est pas orthonormée, puisque $\langle e_1, e_1 \rangle = 2$ et $\langle e_1, e_2 \rangle = 1$, alors que la famille $(e_2, e_1 - e_2)$ l'est : $\langle e_2, e_2 \rangle = 1$, $\langle e_1 - e_2, e_1 - e_2 \rangle = 2 - 2 + 1 = 1$ et $\langle e_2, e_1 - e_2 \rangle = 1 - 1 = 0$.
      ```schema lex-famille-orthonormee-1
      La courbe $\langle x, x \rangle = 1$, en bleu, est une ellipse inclinée : c'est le cercle unité de ce produit scalaire. Les vecteurs $e_2$ et $e_1 - e_2$, en rouge, aboutissent sur elle, alors que $e_1$, en vert, la dépasse, sa norme valant $\sqrt 2$.
      ```
    - |
      Une famille seulement orthogonale n'est pas toujours libre. Dans $\mathbb R^2$, muni du [[produit-scalaire-usuel|produit scalaire usuel]], la famille $(e_1, 0)$ est formée de deux vecteurs [[vecteurs-orthogonaux|orthogonaux]], et elle est liée. L'argument de liberté demande $\langle e_j, e_j \rangle \neq 0$ : du produit scalaire de $\sum_i \lambda_ie_i = 0$ avec $e_j$, on tire seulement $\lambda_j\langle e_j, e_j \rangle = 0$. Une famille orthogonale de vecteurs non nuls est donc libre, et il suffit de diviser chacun par sa norme pour la rendre orthonormée.
    - |
      Dans $L^2([0, 1])$, pour la mesure de Lebesgue, les fonctions de Rademacher $r_j(x) = (-1)^{\lfloor 2^jx \rfloor}$, $j \geqslant 1$, forment une famille orthonormée infinie. Comme $r_j^2 = 1$ sur $[0, 1[$, $\|r_j\|_2 = 1$. Pour $i < j$, $r_i$ est constante sur chaque intervalle $[k2^{-i}, (k + 1)2^{-i}[$, où $r_j$ vaut $1$ et $-1$ sur des parties de même longueur ; l'intégrale de $r_ir_j$ est donc nulle sur chacun, et sur $[0, 1]$.
      ```schema lex-famille-orthonormee-3
      Les fonctions $r_1$, $r_2$ et $r_3$, de haut en bas, valent alternativement $1$ et $-1$ sur des intervalles de longueur $\frac12$, $\frac14$ et $\frac18$. Sur chaque palier de $r_1$, la fonction $r_2$ passe autant de temps à $1$ qu'à $-1$ : c'est ce qui annule l'intégrale de leur produit.
      ```
      Par le théorème de Pythagore, deux fonctions distinctes de la famille sont à distance $\sqrt 2$ : la suite $(r_j)$, bornée, n'a aucune suite extraite de Cauchy. Plus loin, la famille obtenue en ajoutant la constante $1$, orthonormée elle aussi, ne sera pas une base hilbertienne, le produit $r_1r_2$ étant orthogonal à tous ses éléments ({{f-bases-hilbertiennes|Bases hilbertiennes}}, (ii)).

  operateur-rang-fini:
    - |
      Sur l'espace des [[suite-bornee|suites bornées]], muni de $\|x\|_\infty = \sup_n |x_n|$, l'opérateur $u_N$ qui garde les coordonnées d'indice $n \leqslant N$ et annule les autres est continu et de rang fini. Il est de norme $1$, et son image, de [[dimension]] $N + 1$, est engendrée par $e_0, \dots, e_N$, où $e_n$ est nulle sauf un $1$ en position $n$. L'image de la boule unité fermée est le « cube » des suites nulles au-delà du rang $N$ et de coordonnées dans $[-1, 1]$, compact comme $[-1, 1]^{N+1}$.
    - |
      Une application linéaire de rang fini n'est pas toujours continue, et la définition exige la continuité. Sur l'espace des suites nulles à partir d'un certain rang, muni de $\|x\|_\infty = \max_n |x_n|$, l'application $\varphi(x) = \sum_n x_n$, somme finie, est linéaire et de rang $1$. Elle n'est pas continue : la suite qui vaut $1$ aux $N + 1$ premiers rangs a pour norme $1$ et pour image $N + 1$. L'image de la boule unité, $\mathbb R$ tout entier, n'est pas bornée, et $\varphi$ n'est pas non plus un opérateur compact.
    - |
      Un noyau qui sépare les variables donne un opérateur intégral de rang fini. Sur l'espace des fonctions continues sur $[0, 1]$, muni de $\|\cdot\|_\infty$, l'opérateur
      $$\begin{aligned} u f(x) &= \int_0^1 (1 + xy)f(y)\,dy \\ &= \int_0^1 f + x\int_0^1 yf(y)\,dy \end{aligned}$$
      prend ses valeurs dans le plan engendré par $1$ et $x$, et il l'atteint tout entier, puisque $u(1) = 1 + \frac x2$ et $u(x) = \frac12 + \frac x3$ sont libres. Il est continu, de norme au plus $\max |1 + xy| = 2$, donc compact ({{f-compacts|Opérateurs compacts}}, (i)). Plus loin, sur $L^2([0, 1])$, un opérateur à noyau continu quelconque sera approché par des opérateurs de rang fini explicites de ce genre, d'où sa compacité ({{f-compacts-exemples|Exemples d'opérateurs compacts}}, (ii)).

  identite-parallelogramme:
    - |
      Dans $L^2([0, 1])$, pour la mesure de Lebesgue, l'identité se vérifie sur $f = 1$ et $g(x) = x$. On trouve $\|f + g\|_2^2 = \int_0^1 (1 + x)^2 = \frac73$ et $\|f - g\|_2^2 = \int_0^1 (1 - x)^2 = \frac13$, de somme $\frac83$, et $2\|f\|_2^2 + 2\|g\|_2^2 = 2 + \frac23 = \frac83$. Les termes croisés $\pm 2\langle f, g \rangle = \pm 1$ des deux développements s'annulent dans la somme, et c'est tout le mécanisme.
    - |
      Une norme qui ne vérifie pas l'identité ne provient d'aucun [[produit-scalaire|produit scalaire]]. Sur l'espace des fonctions continues sur $[0, 1]$, muni de $\|f\|_\infty = \sup |f|$, les fonctions $f(x) = x$ et $g(x) = 1 - x$ donnent $\|f + g\|_\infty = \|1\|_\infty = 1$ et $\|f - g\|_\infty = \sup |2x - 1| = 1$, de somme des carrés $2$, alors que $2\|f\|_\infty^2 + 2\|g\|_\infty^2 = 4$. La norme $\|\cdot\|_\infty$ n'est donc associée à aucun produit scalaire, et le théorème de projection n'a aucune raison d'y valoir.
    - |
      L'identité, appliquée à $x - a$ et $x - b$, donne la longueur d'une médiane, et c'est sous cette forme que la démonstration du théorème de projection l'emploie. Pour tous $x, a, b$,
      $$\begin{aligned} \Big\|x - \frac{a + b}2\Big\|^2 &= \frac{\|x - a\|^2 + \|x - b\|^2}2 \\ &\quad - \frac{\|a - b\|^2}4. \end{aligned}$$
      ```schema lex-identite-parallelogramme-3
      Le triangle de sommets $a = (0, 0)$, $b = (4, 0)$ et $x = (1, 3)$, en gris, et sa médiane issue de $x$, en rouge, qui aboutit au milieu $m = (2, 0)$ de $[a, b]$. Les carrés des côtés issus de $x$ valent $10$ et $18$, celui de $[a, b]$ vaut $16$, et le carré de la médiane, $10$, est bien $\frac{10 + 18}2 - \frac{16}4$.
      ```
      Si $a$ et $b$ sont deux points d'un convexe, presque aussi proches de $x$ que la distance $d$ de $x$ au convexe, le milieu est dans le convexe, le membre de gauche est au moins $d^2$, et $\|a - b\|^2$ est donc petit. C'est ce qui rend de Cauchy les suites minimisantes, que la démonstration choisit par le choix dénombrable ⋆ ({{f-hilbert|Espaces de Hilbert}}, (ii)).

  orthogonal-partie:
    - |
      L'orthogonal d'une partie est celui du sous-espace qu'elle engendre. Dans $\mathbb R^3$, muni du [[produit-scalaire-usuel|produit scalaire usuel]], l'orthogonal de $A = \{(1, 0, 0), (1, 1, 0)\}$ est formé des $x$ tels que $x_1 = 0$ et $x_1 + x_2 = 0$, c'est-à-dire de la droite $\mathbb R(0, 0, 1)$ ; c'est aussi l'orthogonal du plan $x_3 = 0$ qu'engendre $A$, par linéarité des conditions. L'orthogonal d'une partie à un élément n'est pas toujours une droite : celui de $\{(1, 1, 1)\}$ est le plan $x_1 + x_2 + x_3 = 0$, et celui de $\{0\}$ est l'espace entier.
    - |
      L'égalité $F^{\perp\perp} = F$ du point (iii) de {{f-hilbert|Espaces de Hilbert}} suppose $F$ fermé. Dans $L^2([0, 1[)$, pour la tribu borélienne et la mesure de Lebesgue, soit $F$ l'ensemble des fonctions constantes sur chaque intervalle $[k2^{-j}, (k + 1)2^{-j}[$ pour un même rang $j$ : c'est un sous-espace, deux telles fonctions étant constantes sur les intervalles du plus grand des deux rangs. Si $g \perp F$, les mesures finies $A \mapsto \int_A g^+$ et $A \mapsto \int_A g^-$ coïncident sur ces intervalles, qui forment avec $\varnothing$ un [[pi-systeme|π-système]] engendrant les boréliens, tout ouvert étant réunion des intervalles qu'il contient.
      ```schema lex-orthogonal-partie-2
      Les intervalles de rang $j = 1, 2, 3, 4$, de haut en bas, et le point $\frac13$, en rouge : à chaque rang, l'intervalle qui le contient, en bleu, déborde de part et d'autre. Une fonction de $F$, constante sur cet intervalle, ne peut donc pas valoir presque partout $1$ à gauche de $\frac13$ et $0$ à droite.
      ```
      Par le lemme de Dynkin ({{m-dynkin|Classes monotones}}, (ii)), elles sont égales, d'où $\int_{\{g > 0\}} g^+ = \int_{\{g > 0\}} g^- = 0$, c'est-à-dire $g^+ = 0$ presque partout, et de même $g^- = 0$ en intégrant sur $\{g < 0\}$, puis $g = 0$ presque partout : $F^\perp = \{0\}$ et $F^{\perp\perp} = L^2$. Pourtant $\mathbf 1_{[0, 1/3[} \notin F$, puisque $\frac13$ est intérieur à un intervalle de chaque rang, que l'indicatrice coupe en deux parties de mesure non nulle.
    - |
      Pour une mesure finie $\mu$ non nulle, l'orthogonal de la constante $1$ dans $L^2(\mu)$ est l'espace des fonctions d'intégrale nulle, et tout $f$ se décompose en sa moyenne et un écart orthogonal. Avec $m = \frac1{\mu(X)}\int f \, d\mu$, on a $f = m + (f - m)$, où $\int (f - m)\,d\mu = 0$ : c'est la décomposition $H = F \oplus F^\perp$ pour la droite $F$ des constantes. Pour $f(x) = x$ sur $[0, 1]$, la moyenne vaut $\frac12$, et Pythagore donne $\int_0^1 x^2 = \frac14 + \int_0^1 (x - \frac12)^2$, soit $\frac13 = \frac14 + \frac1{12}$. Si $\mu$ est nulle, $L^2(\mu)$ est réduit à $\{0\}$ et la constante $1$ y est le vecteur nul, d'orthogonal l'espace entier.

  projection-orthogonale:
    - |
      Dans $\mathbb R^3$, muni du [[produit-scalaire-usuel|produit scalaire usuel]], la projection orthogonale sur le plan $F$ d'équation $x_1 + x_2 + x_3 = 0$ retranche à $x$ sa composante sur la normale. Avec $u = \frac1{\sqrt3}(1, 1, 1)$, qui engendre $F^\perp$, on a $p_F(x) = x - \langle x, u \rangle u = x - \frac{x_1 + x_2 + x_3}{3}(1, 1, 1)$, puisque ce vecteur est dans $F$ et que $x - p_F(x)$ est colinéaire à $u$. Pour $x = (3, 0, 0)$, on trouve $p_F(x) = (2, -1, -1)$, et Pythagore se vérifie : $9 = 6 + 3$.
    - |
      Projeter sur un sous-espace de dimension finie, c'est trouver la meilleure approximation en moyenne quadratique. Dans $L^2([0, 1])$, pour la mesure de Lebesgue, le sous-espace $F$ des fonctions affines a pour base orthonormée $b_1 = 1$ et $b_2 = \sqrt3\,(2x - 1)$. Pour $f(x) = x^2$, on a $\langle f, b_1 \rangle = \frac13$ et $\langle f, b_2 \rangle = \frac{\sqrt3}6$, d'où
      $$\begin{aligned} p_F(f) &= \tfrac13 + \tfrac12(2x - 1) \\ &= x - \tfrac16. \end{aligned}$$
      ```schema lex-projection-orthogonale-2
      La parabole $x^2$, en gris, et son projeté $x - \frac16$, en rouge, qui la coupe en deux points symétriques par rapport à $\frac12$. Les aires comprises entre les deux courbes, au-dessus et au-dessous, se compensent : l'écart est orthogonal à la constante $1$, et il l'est aussi à $x$.
      ```
      L'écart $x^2 - x + \frac16$ est orthogonal à $1$ et à $x$, et l'erreur vaut $\|f - p_F(f)\|_2^2 = \frac15 - \frac19 - \frac1{12} = \frac1{180}$, par la relation $\|f\|^2 = \|p_F(f)\|^2 + \|f - p_F(f)\|^2$.
    - |
      La formule $p_F(x) = \sum_i \langle x, b_i \rangle b_i$ demande une base orthonormée, et pas seulement des vecteurs de norme $1$. Dans $\mathbb R^2$, prenons $F = \mathbb R^2$, de sorte que $p_F$ est l'identité, et la base $b_1 = e_1$, $b_2 = \frac1{\sqrt2}(e_1 + e_2)$, formée de vecteurs de norme $1$ qui ne sont pas orthogonaux. Pour $x = e_2$, la somme vaut $0 \cdot b_1 + \frac1{\sqrt2}\,b_2 = \frac12(1, 1)$, qui n'est pas $e_2$ ; elle n'est même pas dans $\mathbb R e_2$. Il faut d'abord orthonormaliser la base, par le procédé de Gram-Schmidt ({{f-bases-hilbertiennes|Bases hilbertiennes}}, (iii)).

  multiplicite-valeur-propre:
    - |
      La matrice $J$ de taille $3$ dont tous les coefficients valent $1$, symétrique, a deux valeurs propres : $3$, de vecteur propre $(1, 1, 1)$, et $0$, dont le sous-espace propre est le plan $x_1 + x_2 + x_3 = 0$, puisque $Jx = (x_1 + x_2 + x_3)(1, 1, 1)$. Les multiplicités sont $1$ et $2$, de somme $3$, la dimension de l'espace, comme le veut le théorème spectral ({{f-spectral-fini|Théorème spectral}}, (ii)). La somme $3 \cdot 1 + 0 \cdot 2$ des valeurs propres comptées avec leur multiplicité est la [[trace]] de $J$.
    - |
      Un [[projecteur]] autoadjoint n'a que les valeurs propres $0$ et $1$, de multiplicités les dimensions de son noyau et de son image. Pour la projection $p$ de $\mathbb R^3$ sur le plan $x_3 = 0$, $p(x) = (x_1, x_2, 0)$, autoadjointe pour le [[produit-scalaire-usuel|produit scalaire usuel]], la valeur propre $1$ est de multiplicité $2$ et la valeur propre $0$ de multiplicité $1$. L'identité de $\mathbb R^n$, autre cas extrême, a la seule valeur propre $1$, de multiplicité $n$.
    - |
      Sans autoadjonction, les multiplicités ne remplissent plus l'espace. Sur $\mathbb R^2$, la matrice $B = \begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}$ a pour seule valeur propre $1$ : si $Bx = \lambda x$ avec $x \neq 0$, la seconde coordonnée donne $x_2 = \lambda x_2$, et la première $x_1 + x_2 = \lambda x_1$, d'où $\lambda = 1$ et $x_2 = 0$. Le sous-espace $E_1 = \mathbb R(1, 0)$ est de dimension $1$, et la somme des multiplicités, $1$, est inférieure à la dimension $2$ : aucune base n'est formée de vecteurs propres, ce que le théorème spectral exclut pour une matrice symétrique.

  equicontinue-uniforme:
    - |
      Une borne commune sur les pentes donne directement l'équicontinuité uniforme. Sur $\mathbb R$, muni de $|x - y|$, les fonctions $x \mapsto \sin(ax)$, $a \in [-1, 1]$, vérifient $|\sin(ax) - \sin(ay)| \leqslant |a|\,|x - y| \leqslant |x - y|$, par l'inégalité des accroissements finis ({{de-iaf|Inégalité des accroissements finis}}). Le choix $\delta = \varepsilon$ convient pour toutes les fonctions et tous les points, bien que $\mathbb R$ ne soit pas compact.
    - |
      Sans compacité, une partie équicontinue n'est pas toujours uniformément équicontinue, même réduite à une seule fonction. Sur $]0, 1]$, la fonction $f(x) = \sin\frac1x$ est continue, donc $\{f\}$ est équicontinue ({{fc-equicontinuite|Équicontinuité}}, (i)). Les points $x_k = \frac1{k\pi}$ et $y_k = \frac1{k\pi + \pi/2}$ sont à distance $\frac{1}{2k(k + 1/2)\pi} \to 0$, et pourtant $|f(x_k) - f(y_k)| = 1$ : aucun $\delta$ ne convient pour $\varepsilon = \frac12$. Le point (iii) du même nœud, qui suppose $K$ compact, ne s'applique pas.
    - |
      La même famille peut être uniformément équicontinue sur un compact et ne pas l'être sur un autre. Sur $[0, \frac12]$, les fonctions $x \mapsto x^n$, $n \geqslant 1$, vérifient $|x^n - y^n| \leqslant n2^{1-n}|x - y| \leqslant |x - y|$, la dérivée $nt^{n-1}$ étant au plus $n2^{1-n} \leqslant 1$ sur cet intervalle : $\delta = \varepsilon$ convient. Sur $[0, 1]$, en revanche, la famille n'est même pas équicontinue en $1$ ({{fc-equicontinuite|Équicontinuité}}, (iv)), la pente en $1$ valant $n$.

  interpole-deux-points:
    - |
      L'interpolation en deux points sans la structure de treillis ne donne pas la densité. Sur $[0, 1]$, les fonctions affines interpolent en deux points, puisque $h(t) = a + (b - a)\frac{t - x}{y - x}$ convient pour $x \neq y$. Pourtant, pour toute fonction affine $h$, l'écart $e = f - h$ à $f(t) = |t - \frac12|$ vérifie $e(0) + e(1) - 2e(\frac12) = 1$, puisque $h(0) + h(1) = 2h(\frac12)$ ; l'un des trois écarts dépasse donc $\frac14$ en valeur absolue, et $\|f - h\|_\infty \geqslant \frac14$.
      ```schema lex-interpole-deux-points-1
      La fonction $|t - \frac12|$, en rouge, et la meilleure fonction affine, la constante $\frac14$, en bleu : l'écart vaut $\frac14$ en $0$, en $\frac12$ et en $1$, avec des signes alternés. Le maximum des deux fonctions affines $\frac12 - t$ et $t - \frac12$, en pointillé gris, est la fonction rouge elle-même : c'est l'opération de treillis qui manque aux fonctions affines.
      ```
    - |
      Un treillis de fonctions qui n'interpole pas en deux points n'est pas dense. Sur $K = [0, 1]$, les fonctions continues nulles en $0$ forment un treillis, puisque $\max(f, g)$ et $\min(f, g)$ s'annulent en $0$ avec $f$ et $g$. Il n'interpole pas en $x = 0$ et $y = 1$ avec $a = 1$, et la constante $1$ est à distance au moins $1$ de chacune de ses fonctions, par sa valeur en $0$. Les constantes forment aussi un treillis, qui n'interpole que si $a = b$ et ne contient pas la fonction $t$ dans son adhérence.
    - |
      Les fonctions continues affines par morceaux sur $[0, 1]$, à un nombre fini de points de raccord, forment un treillis qui interpole en deux points. Le maximum de deux telles fonctions en est une, ses points de raccord étant ceux des deux fonctions et les points, en nombre fini, où leurs morceaux se croisent ; de même pour le minimum. Elles contiennent les fonctions affines, qui interpolent : le lemme de {{fc-treillis|Lemme des treillis}} les rend denses dans $C([0, 1])$, et toute fonction continue sur $[0, 1]$ est limite uniforme de fonctions affines par morceaux.

  essentiellement-bornee:
    - |
      La borne supérieure essentielle ignore les valeurs prises sur un ensemble négligeable, même grandes. Sur $[0, 1]$, muni de la mesure de Lebesgue, la fonction égale à $5$ sur $\mathbb Q$ et à $x$ ailleurs a pour borne supérieure $5$, mais pour borne supérieure essentielle $1$. On a en effet $|f| \leqslant 1$ hors de $\mathbb Q \cap [0, 1]$, qui est [[negligeable|négligeable]], et, pour $0 \leqslant M < 1$, l'inégalité $|f| > M$ a lieu sur $]M, 1] \setminus \mathbb Q$, qui est de mesure $1 - M > 0$.
    - |
      Une fonction non bornée peut être essentiellement bornée, mais une singularité vraie ne l'est pas. Sur $]0, 1]$, la fonction égale à $\frac1x$ en chaque rationnel et à $0$ ailleurs n'est majorée par aucun réel, et pourtant elle est nulle presque partout, de borne supérieure essentielle $0$. La fonction $x^{-1/2}$, au contraire, n'est pas essentiellement bornée : pour tout $M > 0$, elle dépasse $M$ sur $]0, M^{-2}[$, qui n'est pas négligeable.
    - |
      Être essentiellement bornée dépend de la mesure. Pour la mesure de comptage sur $\mathbb N$, seul le vide est négligeable, et les fonctions essentiellement bornées sont les [[suite-bornee|suites bornées]], avec $\|a\|_\infty = \sup_n |a_n|$. Pour la mesure de Dirac en $0$ sur les boréliens de $\mathbb R$, toute fonction borélienne l'est, avec $\|f\|_\infty = |f(0)|$, puisque $\mathbb R \setminus \{0\}$ est négligeable. Pour la mesure nulle, enfin, l'inégalité $|f| \leqslant 0$ a lieu presque partout pour toute $f$, et $\|f\|_\infty = 0$.

  mesure-borelienne:
    - |
      Sur un espace métrique où tous les points sont isolés, toute partie est un borélien, et toute mesure sur l'ensemble des parties est borélienne. C'est le cas de $\mathbb N$ muni de $|m - n|$, où $\{n\} = B(n, \frac12)$ est ouvert, si bien que toute partie, réunion de singletons, est ouverte. La mesure $\mu(A) = \sum_{n \in A} 2^{-n}$, somme des mesures de Dirac $2^{-n}\delta_n$, y est une mesure borélienne finie, de masse $\mu(\mathbb N) = 2$.
    - |
      Une mesure définie sur une tribu plus petite que la tribu borélienne n'intègre pas les fonctions continues. Sur $K = [0, 1]$, la tribu $\{\varnothing, K\}$ porte la mesure $\mu(K) = 1$, qui n'est pas borélienne. La fonction continue $f(x) = x$ n'est pas mesurable pour cette tribu, puisque $\{f > \frac12\} = \,]\frac12, 1]$ n'y figure pas, et $\int f \, d\mu$ n'a pas de sens. C'est pourquoi la tribu borélienne, qui rend mesurable toute fonction continue ({{mk-urysohn|Lemme d'Urysohn}}, (v)), est la bonne pour représenter les formes sur les fonctions continues.
    - |
      Sur $K = [0, 1]$, la mesure $\mu(A) = \lambda(A \cap [0, \frac12]) + \delta_1(A)$, où $\lambda$ est la mesure de Lebesgue restreinte aux boréliens, est une mesure borélienne finie, de masse $\frac32$. Pour $f$ continue, $\int f \, d\mu = \int_0^{1/2} f(x)\,dx + f(1)$ : la mesure mêle une partie étalée et une masse ponctuelle. Plus loin, le théorème de Riesz-Markov dira que toute forme linéaire positive sur les fonctions continues de $K$ s'écrit ainsi, comme l'intégrale contre une unique mesure borélienne finie ; l'existence de cette mesure emploie le choix dénombrable ⋆ ({{mk-riesz-markov|Riesz-Markov}}, (i)).

  noyau-integral:
    - |
      Un noyau produit donne un opérateur de rang $1$. Pour $K(x, y) = xy$ sur $[0, 1]^2$, on a $T_Kf(x) = x\int_0^1 yf(y)\,dy = \langle f, e \rangle\, x$, où $e(x) = x$. L'image est la droite engendrée par $e$, qui est un vecteur propre, de valeur propre $\int_0^1 y^2\,dy = \frac13$, et toute fonction orthogonale à $e$ est envoyée sur $0$. Le noyau est symétrique, et l'opérateur est autoadjoint ({{f-compacts-exemples|Exemples d'opérateurs compacts}}, (ii)).
    - |
      Un noyau symétrique peut donner des valeurs propres des deux signes. Pour $K(x, y) = x + y$, on a $T_Kf(x) = x\int_0^1 f + \int_0^1 yf(y)\,dy$, d'image le plan engendré par $1$ et $x$. Dans la base $(1, x)$, les images $T_K(1) = \frac12 + x$ et $T_K(x) = \frac13 + \frac x2$ donnent la matrice
      $$\begin{pmatrix} \frac12 & \frac13 \\ 1 & \frac12 \end{pmatrix},$$
      dont les valeurs propres sont $\frac12 \pm \frac1{\sqrt3}$, environ $1{,}077$ et $-0{,}077$. L'opérateur est autoadjoint sans être positif : $\langle T_Kf, f \rangle = 2\int f \int yf$ vaut $-\frac12$ pour $f = 5 - 9x$, pour laquelle $\int f = \frac12$ et $\int yf = -\frac12$.
    - |
      Sans symétrie du noyau, l'opérateur n'est pas autoadjoint. Pour $K(x, y) = x$, on a $T_Kf(x) = x\int_0^1 f$, et $\langle T_K1, e \rangle = \int_0^1 x^2 = \frac13$, alors que $\langle 1, T_Ke \rangle = \int_0^1 \frac x2\,dx = \frac14$, où $e(x) = x$. Plus loin, le théorème spectral des opérateurs compacts autoadjoints décomposera au contraire tout $T_K$ à noyau symétrique selon une base hilbertienne de fonctions propres de l'orthogonal de son noyau ({{f-spectral-compact|Théorème spectral compact}}, (iv)), avec le choix dénombrable ⋆, ou sans choix quand une suite dense de $L^2$ est donnée.
