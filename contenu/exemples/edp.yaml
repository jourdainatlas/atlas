# Exemples du lexique : théorie « Distributions et EDP » (edp).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  support-fonction:
    - |
      Une fonction peut s'annuler en des points de son support. Sur $\Omega = \mathbb R$, la fonction $x \mapsto x$ ne s'annule qu'en $0$, mais $0$ est [[adherence|adhérent]] à $\mathbb R \setminus \{0\}$ : son support est $\mathbb R$ tout entier. De même, le sinus s'annule en chaque $k\pi$, et son support est $\mathbb R$. Le support n'est pas l'ensemble $\{f \neq 0\}$, mais le plus petit [[ferme|fermé]] hors duquel $f$ est nulle.
    - |
      Le support dépend de l'ouvert de définition. Sur $\Omega = \,]0, 1[$, la fonction constante égale à $1$ a pour support l'adhérence de $]0, 1[$ dans $\Omega$, c'est-à-dire $]0, 1[$ lui-même : c'est un fermé de $\Omega$, qui n'est pas fermé dans $\mathbb R$, et qui n'est pas [[compact]], puisque les ouverts $]\frac1k, 1[$ le recouvrent sans qu'un nombre fini d'entre eux y suffise. La même fonction, vue sur $\mathbb R$ comme l'indicatrice de $]0, 1[$, n'est pas continue, et la définition ne s'y applique pas.
    - |
      Le support d'un produit est contenu dans l'intersection des supports, et l'inclusion peut être stricte. Avec la fonction $\theta$ du nœud {{dr-plateau|Fonctions plateau}}, nulle sur $]{-\infty}, 0]$ et strictement positive sur $]0, +\infty[$, les fonctions $f(x) = \theta(x)$ et $g(x) = \theta(-x)$ ont pour supports $[0, +\infty[$ et $]{-\infty}, 0]$, d'intersection $\{0\}$. Leur produit est pourtant nul, de support $\varnothing$. L'inclusion vient de ce que $fg \neq 0$ force $f \neq 0$ et $g \neq 0$, et de ce que l'adhérence d'une intersection est contenue dans l'intersection des adhérences.
      ```schema lex-support-fonction-3
      Les fonctions $\theta(x)$, en rouge, et $\theta(-x)$, en bleu, de supports $[0, +\infty[$ et $]{-\infty}, 0]$, qui se touchent au seul point $0$. En chaque point, l'une des deux est nulle : leur produit est la fonction nulle, de support vide.
      ```

  fonction-test:
    - |
      Être une fonction test dépend de l'ouvert, et pas seulement de la formule. Avec la fonction $\theta$ du nœud {{dr-plateau|Fonctions plateau}}, la fonction $f(x) = \theta(x)\,\theta(1 - x)$ est de classe $C^\infty$ sur $\mathbb R$, strictement positive exactement sur $]0, 1[$, et de [[support-fonction|support]] $[0, 1]$, compact : c'est une fonction test sur $\mathbb R$. Sa restriction à $\Omega = \,]0, 1[$ est de classe $C^\infty$, mais son support dans $\Omega$ est $]0, 1[$, qui n'est pas compact : ce n'est pas une fonction test sur $]0, 1[$.
    - |
      La convergence dans $\mathcal D(\Omega)$ porte sur toutes les dérivées. Sur $\mathbb R$, avec la fonction $\rho$ du nœud {{ds-test|Fonctions test}} pour $n = 1$, les translatées $\rho(x - \frac1k)$ convergent vers $\rho$ dans $\mathcal D(\mathbb R)$ : leurs supports restent dans $[-1, 2]$, et chaque dérivée $\rho^{(m)}$, continue et nulle hors d'un compact, est [[continuite-uniforme|uniformément continue]], par le théorème de Heine ({{me-heine|Heine}}) appliqué sur un compact qui contient les supports, ce qui donne la [[convergence-uniforme|convergence uniforme]] des dérivées translatées.

      Les fonctions $\psi_k(x) = \frac1k\rho(kx)$, au contraire, ont leurs supports dans $[-1, 1]$ et tendent uniformément vers $0$, puisque $p_0(\psi_k) = \frac{\rho(0)}k$. Mais $\psi_k'(x) = \rho'(kx)$, si bien que $p_1(\psi_k) \geqslant \sup|\rho'| > 0$ pour tout $k$ : les $\psi_k$ ne convergent vers aucune fonction test, une limite ne pouvant être que leur limite uniforme $0$.
      ```schema lex-fonction-test-2
      En haut, les fonctions $\psi_k = \frac1k\rho(k\,\cdot)$ pour $k = 1$ (gris), $2$ (bleu) et $4$ (rouge), qui s'aplatissent ; en bas, leurs dérivées $\rho'(k\,\cdot)$, qui se resserrent sans que leur amplitude diminue.
      ```
    - |
      En plusieurs variables, le produit de fonctions test d'une variable est une fonction test, de support le produit des supports. Avec $\tilde\rho_1(t) = \theta(1 - t^2)$, strictement positive exactement sur $]{-1}, 1[$, la fonction $\varphi(x, y) = \tilde\rho_1(x)\,\tilde\rho_1(y)$ est de classe $C^\infty$ sur $\mathbb R^2$, non nulle exactement sur le carré ouvert $]{-1}, 1[^2$, et son support est le carré fermé $[-1, 1]^2$ ; la fonction $\tilde\rho$ du nœud {{ds-test|Fonctions test}}, pour $n = 2$, a pour support le disque [[boule-fermee|fermé]] $\bar B(0, 1)$. Plus loin, ces fonctions serviront à éprouver les [[forme-lineaire|formes linéaires]] continues sur $\mathcal D(\Omega)$, les distributions ({{ds-distributions|Distributions}}).

  noyau-regularisant:
    - |
      Le noyau régularisant se resserre et s'élève sans changer d'aire. Sur $\mathbb R$, un calcul numérique donne $c_1 \approx 0{,}444$ et $\rho(0) \approx 0{,}829$ (remarque du nœud {{ds-test|Fonctions test}}). La fonction $\rho_\varepsilon$, d'intégrale $1$, est nulle hors de $[-\varepsilon, \varepsilon]$ et culmine à $\frac{\rho(0)}\varepsilon$ : pour tout $\delta > 0$, son intégrale sur $\{|x| \geqslant \delta\}$ est nulle dès que $\varepsilon \leqslant \delta$. Par le changement de variable $x = \varepsilon y$, $\int x^2\rho_\varepsilon(x)\,dx = \varepsilon^2\int y^2\rho(y)\,dy \approx 0{,}158\,\varepsilon^2$ : la largeur du noyau est proportionnelle à $\varepsilon$.
      ```schema lex-noyau-regularisant-1
      Les fonctions $\rho_\varepsilon$ sur $\mathbb R$ pour $\varepsilon = 1$ (gris), $\frac12$ (bleu) et $\frac14$ (rouge). Elles ont la même aire $1$, sont nulles hors de $[-\varepsilon, \varepsilon]$, et leurs maxima, $\frac{\rho(0)}\varepsilon \approx 0{,}83$, $1{,}66$ et $3{,}31$, croissent comme $\frac1\varepsilon$.
      ```
    - |
      Le facteur $\varepsilon^{-n}$ est exactement celui qui conserve l'intégrale. Dans $\mathbb R^2$, la famille $\varepsilon^{-1}\rho(x/\varepsilon)$, où l'on aurait écrit l'exposant de la dimension $1$, a pour intégrale $\varepsilon$, par le changement de variables $x = \varepsilon y$, de [[jacobien]] $\varepsilon^2$ ({{cv-changement|Changement de variables}}, (ii)) : elle se concentre en $0$ en perdant toute sa masse. Avec $\varepsilon^{-2}$, l'intégrale reste $1$, comme l'affirme le point (ii) du nœud {{ds-test|Fonctions test}}.
    - |
      Le noyau du nœud {{ds-test|Fonctions test}} est radial, et ce n'est pas le cas de toute fonction plateau. Dans $\mathbb R^2$, la fonction $\psi(x, y) = \theta(1 - x^2)\,\theta(1 - y^2)$ du nœud {{dr-plateau|Fonctions plateau}} prend en $(0{,}9\,;\, 0)$ la valeur $\theta(0{,}19)\,\theta(1) \approx 0{,}0019$, et en $(0{,}9/\sqrt 2\,;\, 0{,}9/\sqrt 2)$, point de même norme, la valeur $\theta(0{,}595)^2 \approx 0{,}035$ : elle ne dépend pas de la seule norme. Plus loin, c'est le caractère radial de $\rho_\varepsilon$ qui permettra d'écrire une moyenne pondérée par $\rho_\varepsilon$ comme une moyenne de moyennes sur des boules ({{ha-regularite|Régularité des fonctions harmoniques}}).

  localement-integrable:
    - |
      Être localement intégrable dépend de l'ouvert. La fonction $x \mapsto \frac1x$ est continue sur $]0, +\infty[$, donc localement intégrable sur cet ouvert, sans y être intégrable. La fonction $x \mapsto \frac1{|x|}$, prolongée par $0$ en $0$, n'est pas localement intégrable sur $\mathbb R$ : sur le compact $[-1, 1]$, $\int_\varepsilon^1 \frac{dx}x = -\ln\varepsilon$ tend vers $+\infty$, et la convergence monotone ({{m-beppo-levi|Convergence monotone}}) donne $\int_{[-1, 1]}\frac{dx}{|x|} = +\infty$.
    - |
      Dans $\mathbb R^n$, la fonction $|x|^{-a}$, avec $a \geqslant 0$ et prolongée par $0$ en $0$, est localement intégrable si et seulement si $a < n$. Soit $B = B(0, 1)$ et les couronnes $A_k = B(0, 2^{-k}) \setminus B(0, 2^{-k-1})$, disjointes, de réunion $B \setminus \{0\}$. Par l'homothétie de rapport $2^{-k}$ ({{cv-lineaire|Image linéaire}}, (ii)), $\lambda(A_k) = 2^{-kn}(1 - 2^{-n})\lambda(B)$, avec $\lambda(B) > 0$, et $2^{ka} \leqslant |x|^{-a} \leqslant 2^{(k+1)a}$ sur $A_k$. Par convergence monotone,
      $$\begin{aligned} \int_B |x|^{-a}\,dx &\geqslant (1 - 2^{-n})\lambda(B) \\ &\quad \times \sum_{k \geqslant 0} 2^{k(a - n)}, \end{aligned}$$
      qui est infini si $a \geqslant n$, et la majoration analogue, avec $2^{(k+1)a}$, est finie si $a < n$. Hors de $B$, $|x|^{-a} \leqslant 1$.
    - |
      Une fonction localement intégrable peut n'être continue en aucun point. L'indicatrice de $\mathbb Q$ sur $\mathbb R$ est [[application-borelienne-rn|borélienne]], puisque $\mathbb Q$, [[denombrable|dénombrable]], est une réunion dénombrable de singletons, et son intégrale sur tout compact est nulle, $\mathbb Q$ étant [[negligeable|négligeable]] : elle est localement intégrable. Elle est discontinue en tout point, $\mathbb Q$ et son complémentaire étant [[partie-dense|denses]]. Plus loin, elle définira la même distribution que la fonction nulle ({{ds-exemples|Exemples de distributions}}, (ii)).

  produit-convolution:
    - |
      La convolution par $\rho_\varepsilon$ conserve les fonctions affines et décale les autres d'un terme d'ordre $\varepsilon^2$. Sur $\mathbb R$, le changement de variable $y = x - z$ donne $(f * \rho_\varepsilon)(x) = \int f(x - z)\,\rho_\varepsilon(z)\,dz$. Comme $\rho_\varepsilon$ est paire, $\int z\,\rho_\varepsilon(z)\,dz = 0$, donc $f * \rho_\varepsilon = f$ pour $f(x) = ax + b$. Pour $f(x) = x^2$,
      $$\begin{aligned} (f * \rho_\varepsilon)(x) &= x^2 + \varepsilon^2\int z^2\rho(z)\,dz \\ &\approx x^2 + 0{,}158\,\varepsilon^2, \end{aligned}$$
      écart constant qui tend vers $0$, uniformément sur $\mathbb R$, comme le veut le point (ii) du nœud {{ds-regularisation|Régularisation}} sur les compacts.
    - |
      La convergence de $f * \rho_\varepsilon$ vers $f$ est uniforme sur chaque compact de $\Omega$, mais pas sur $\Omega_\varepsilon$ tout entier. Sur $\Omega = \,]0, 1[$, soit $f(x) = \frac1x$, continue. Pour $\varepsilon < \frac13$, le point $2\varepsilon$ est dans $\Omega_\varepsilon = \,]\varepsilon, 1 - \varepsilon[$, et le changement de variable $z = \varepsilon u$, puis la parité de $\rho$, donnent
      $$\begin{aligned} &(f * \rho_\varepsilon)(2\varepsilon) - f(2\varepsilon) \\ &\quad = \frac1\varepsilon\int \rho(u)\Big(\frac2{4 - u^2} - \frac12\Big)\,du. \end{aligned}$$
      L'intégrande est strictement positive là où $\rho(u) > 0$ et $u \neq 0$, et l'intégrale $c$ vaut environ $0{,}0216$ : l'écart, égal à $\frac c\varepsilon$, tend vers l'infini près du bord, alors qu'il tend vers $0$ uniformément sur tout compact de $\Omega$.
    - |
      Dériver la régularisée d'une marche redonne le noyau. Pour $f$ l'indicatrice de $[0, +\infty[$ sur $\mathbb R$, le changement de variable $z = x - y$ donne $(f * \rho_\varepsilon)(x) = \int_{-\infty}^x \rho_\varepsilon(z)\,dz$, de dérivée $\rho_\varepsilon(x)$ par le théorème fondamental ; c'est bien $(f * \rho_\varepsilon')(x) = \int_0^{+\infty}\rho_\varepsilon'(x - y)\,dy$, comme le veut le point (i) du nœud {{ds-regularisation|Régularisation}}. Plus loin, au sens des distributions, la dérivée de cette marche sera la masse de Dirac en $0$, que les $\rho_\varepsilon$ approchent ({{ds-derivation|Dérivation}}, (iv)).

  distribution:
    - |
      Le critère par les semi-normes du point (i) du nœud {{ds-distributions|Distributions}} se vérifie souvent en une ligne. Sur $\mathbb R$, la forme $\varphi \mapsto \varphi'(0)$ est linéaire et vérifie $|\varphi'(0)| \leqslant p_1(\varphi)$ pour toute fonction test : c'est une distribution. Pour $f$ continue sur un ouvert $\Omega$ et $\varphi$ à support dans un compact $K$, la forme $\varphi \mapsto \int_\Omega f\varphi$ vérifie
      $$\Big|\int_\Omega f\varphi\Big| \leqslant \Big(\int_K |f|\Big)\,p_0(\varphi),$$
      fini puisque $f$ est bornée sur $K$ : c'en est une aussi, avec une constante qui dépend de $K$.
    - |
      Une distribution est attachée à son ouvert. Sur $\Omega = \,]0, 2[$, la forme $T(\varphi) = \sum_{j \geqslant 1}\varphi(\frac1j)$ est bien définie : le support $K$ de $\varphi$, compact, a un plus petit élément $a > 0$, et seuls les $j \leqslant \frac1a$ donnent un terme non nul. Elle vérifie $|T(\varphi)| \leqslant N_K\,p_0(\varphi)$, où $N_K$ est le nombre des points $\frac1j$ de $K$ : c'est une distribution sur $]0, 2[$. Sur $\mathbb R$, la même formule n'a pas de sens : pour une fonction test égale à $1$ près de $0$ ({{ds-test|Fonctions test}}, (iii)), la série diverge.
    - |
      La linéarité ne peut pas être omise : une application séquentiellement continue sur $\mathcal D(\Omega)$ peut ne vérifier aucune estimation par semi-normes. Sur $\mathbb R$, $\varphi \mapsto \varphi(0)^2$ vérifie $\varphi_k(0)^2 \to \varphi(0)^2$ chaque fois que $\varphi_k \to \varphi$ dans $\mathcal D(\mathbb R)$. Mais si $\psi$ est une fonction test de support $K$ avec $\psi(0) = 1$, une inégalité $\lambda^2 \leqslant C\,p_m(\lambda\psi) = C\lambda\,p_m(\psi)$ pour tout $\lambda > 0$ est impossible : la conclusion du point (ii) du nœud {{ds-distributions|Distributions}} tombe.

  masse-dirac:
    - |
      La masse de Dirac est limite de moyennes sur des intervalles qui se resserrent. Sur $\mathbb R$, les fonctions $f_\varepsilon = \frac1{2\varepsilon}\mathbf 1_{[a - \varepsilon, a + \varepsilon]}$, [[localement-integrable|localement intégrables]], donnent $\langle f_\varepsilon, \varphi\rangle$ égal à la moyenne de $\varphi$ sur $[a - \varepsilon, a + \varepsilon]$, qui diffère de $\varphi(a)$ d'au plus $\sup_{|x - a| \leqslant \varepsilon}|\varphi(x) - \varphi(a)|$. Par continuité de $\varphi$ en $a$, $f_{\varepsilon_k} \to \delta_a$ dans $\mathcal D'(\mathbb R)$ pour toute suite $\varepsilon_k \to 0$, comme les noyaux régularisants vers $\delta$ au point (v) du nœud {{ds-exemples|Exemples de distributions}}.
    - |
      La convergence au sens des distributions n'est pas la convergence en chaque point. Les fonctions $f_k = k\,\mathbf 1_{]0, 1/k]}$ vérifient $\langle f_k, \varphi\rangle = k\int_0^{1/k}\varphi$, qui tend vers $\varphi(0)$ : $f_k \to \delta$ dans $\mathcal D'(\mathbb R)$. Pourtant $f_k(x) \to 0$ en tout point, puisque $f_k(x) = 0$ dès que $\frac1k < x$, et que $f_k$ est nulle sur $]{-\infty}, 0]$ : la limite simple, nulle, définit la [[distribution]] nulle, et non $\delta$, et l'intégrale $\int f_k = 1$ ne passe pas à la limite. Les fonctions $k\,\mathbf 1_{]1/k, 2/k]}$, nulles sur $]{-\infty}, \frac1k]$, convergent aussi vers $\delta$.
      ```schema lex-masse-dirac-2
      Les fonctions $f_k = k\,\mathbf 1_{]0, 1/k]}$ pour $k = 1$ (gris), $2$ (bleu) et $4$ (rouge), d'aire $1$, de plus en plus hautes et étroites. En chaque point $x > 0$, elles finissent par être nulles, et c'est leur aire, concentrée près de $0$, qui converge vers la masse de Dirac.
      ```
    - |
      Les masses de Dirac en des points distincts sont des distributions distinctes, et leurs taux d'accroissement font apparaître l'ordre $1$. Si $a \neq b$, la fonction $x \mapsto \rho_\varepsilon(x - a)$, avec $\varepsilon < |b - a|$, vaut $\rho_\varepsilon(0) > 0$ en $a$ et $0$ en $b$ : $\delta_a \neq \delta_b$. Pour $h \neq 0$, $\big\langle \frac{\delta_h - \delta}h, \varphi\big\rangle = \frac{\varphi(h) - \varphi(0)}h$ tend vers $\varphi'(0)$ quand $h \to 0$ : la limite est la forme $\varphi \mapsto \varphi'(0)$, d'[[ordre-distribution|ordre]] $1$. Plus loin, elle s'écrira $-\delta'$, opposée de la dérivée de $\delta$ ({{ds-derivation|Dérivation}}).

  valeur-principale:
    - |
      La valeur principale ne voit que la partie impaire d'une fonction test. Par la formule du point (iv) du nœud {{ds-exemples|Exemples de distributions}}, $\big\langle \operatorname{vp}\frac1x, \varphi\big\rangle = \int_0^R \frac{\varphi(x) - \varphi(-x)}x\,dx$ est nul si $\varphi$ est paire. Si $\varphi(x) = x\,\psi(x)$ avec $\psi$ fonction test, l'intégrande vaut $\psi(x) + \psi(-x)$, et
      $$\Big\langle \operatorname{vp}\frac1x, x\psi\Big\rangle = \int_{-R}^R \psi :$$
      contre une fonction test multiple de $x$, la valeur principale de $\frac1x$ agit comme l'intégrale ordinaire de $\frac1x \cdot x\psi$.
    - |
      Retirer un intervalle non symétrique autour de $0$ donne une autre limite. Pour une fonction test $\varphi$ de support dans $[-R, R]$ et $0 < 2\varepsilon < R$,
      $$\begin{aligned} &\Big(\int_{-R}^{-\varepsilon} + \int_{2\varepsilon}^R\Big)\frac{\varphi(x)}x\,dx \\ &\quad = \Big(\int_{-R}^{-\varepsilon} + \int_\varepsilon^R\Big)\frac{\varphi(x)}x\,dx \\ &\qquad - \int_\varepsilon^{2\varepsilon}\frac{\varphi(x)}x\,dx. \end{aligned}$$
      Comme $|\varphi(x) - \varphi(0)| \leqslant x\,p_1(\varphi)$, la dernière intégrale diffère de $\varphi(0)\ln 2$ d'au plus $\varepsilon\,p_1(\varphi)$. La limite est donc $\big\langle \operatorname{vp}\frac1x, \varphi\big\rangle - \varphi(0)\ln 2$ : c'est la distribution $\operatorname{vp}\frac1x - \ln 2\,\delta$, et non la valeur principale, ce que la remarque du nœud {{ds-exemples|Exemples de distributions}} annonçait sur $\int_{-1}^1 \frac{dx}x$.
      ```schema lex-valeur-principale-2
      Le graphe de $\frac1x$ près de $0$, pour $\varepsilon = 0{,}2$. Les bandes bleues, sur $[-1, -\varepsilon]$ et $[\varepsilon, 1]$, se compensent exactement ; la bande rouge, sur $[\varepsilon, 2\varepsilon]$, prise dans la bande bleue de droite, est celle que retire en plus l'intervalle non symétrique, d'aire $\ln 2$ quel que soit $\varepsilon$.
      ```
    - |
      La valeur principale est d'ordre exactement $1$ : au plus $1$ par le point (iv) du nœud {{ds-exemples|Exemples de distributions}}, et pas $0$. Avec la fonction $\sigma$ du nœud {{ds-test|Fonctions test}}, (iii), et $k \geqslant 2$, la fonction impaire $s_k(x) = \sigma(kx)\,\sigma(2 - x) - \sigma(-kx)\,\sigma(2 + x)$ est une fonction test de support dans $[-2, 2]$, à valeurs dans $[-1, 1]$, égale à $1$ sur $[\frac1k, 1]$ et positive sur $[0, 2]$. Donc
      $$\begin{aligned} \Big\langle \operatorname{vp}\frac1x, s_k\Big\rangle &= \int_0^2 \frac{2\,s_k(x)}x\,dx \\ &\geqslant \int_{1/k}^1 \frac{2\,dx}x = 2\ln k. \end{aligned}$$
      Les fonctions $\frac{s_k}{\ln k}$, de supports dans $[-2, 2]$, ont une norme uniforme au plus $\frac1{\ln k}$, qui tend vers $0$, et une valeur principale au moins $2$ : aucune majoration par $C\,p_0$ n'est possible. Plus loin, $\operatorname{vp}\frac1x$ sera la dérivée de $\ln|x|$ ({{ds-derivation|Dérivation}}, (iv)).

  derivee-distribution:
    - |
      La formule des sauts calcule les dérivées d'une fonction régulière par morceaux. La fonction $x_+ = \max(x, 0)$ est continue, de dérivée hors de $0$ égale à la [[fonction-heaviside|fonction de Heaviside]] $H$ : sans saut, le point (iii) du nœud {{ds-derivation|Dérivation}} donne $(x_+)' = H$, puis $(x_+)'' = H' = \delta$. Pour $f(x) = H(x)\cos x$, qui saute de $0$ à $1$ en $0$, on trouve $(T_f)' = -H\sin x + \delta$ : la dérivée hors de $0$, plus la masse du saut.
    - |
      Une fonction de dérivée nulle presque partout peut avoir une dérivée non nulle au sens des distributions. La [[partie-entiere|partie entière]] $x \mapsto \lfloor x \rfloor$ est localement intégrable, constante sur chaque $]k, k + 1[$, de dérivée nulle hors de $\mathbb Z$. Pour une fonction test $\varphi$, la somme suivante est finie, et, par le théorème fondamental puis en regroupant les termes,
      $$\begin{aligned} \langle \lfloor x \rfloor', \varphi\rangle &= -\sum_k k\int_k^{k+1}\varphi' \\ &= -\sum_k k\big(\varphi(k + 1) - \varphi(k)\big) \\ &= \sum_k \varphi(k). \end{aligned}$$
      La dérivée est la somme des masses de Dirac aux entiers, une par marche de hauteur $1$.
      ```schema lex-derivee-distribution-2
      En haut, la partie entière, en escalier ; en bas, sa dérivée au sens des distributions, dessinée par des flèches rouges de hauteur $1$ aux entiers, une par saut. La dérivée presque partout, nulle, ne garde aucune trace des marches.
      ```
    - |
      La dérivation est continue pour la convergence des distributions, même quand l'amplitude explose. Les fonctions $\frac{\sin(kx)}k$ tendent uniformément vers $0$, donc dans $\mathcal D'(\mathbb R)$. Par le point (i) du nœud {{ds-derivation|Dérivation}}, leurs dérivées $\cos(kx)$ et leurs dérivées secondes $-k\sin(kx)$ tendent aussi vers $0$ dans $\mathcal D'(\mathbb R)$, alors que $\cos(kx)$ vaut $1$ en $0$ pour tout $k$, et que $k\sin(kx)$ vaut $k$ en $\frac\pi{2k}$. Directement, $\big|\langle -k\sin(kx), \varphi\rangle\big| = \big|\langle \frac{\sin(kx)}k, \varphi''\rangle\big| \leqslant \frac1k\int|\varphi''|$.

  laplacien:
    - |
      Sur les fonctions radiales, le laplacien se calcule par une seule dérivation en $r = |x|$. Pour $f$ de classe $C^2$ sur $]0, +\infty[$ et $u(x) = f(|x|)$ sur $\mathbb R^n \setminus \{0\}$, la règle de la chaîne donne $\partial_iu = f'(r)\frac{x_i}r$ et, en sommant les dérivées secondes,
      $$\Delta u = f''(r) + \frac{n - 1}r\,f'(r).$$
      Ainsi $\Delta|x|^2 = 2n$, et $\Delta|x|^{2-n} = 0$ hors de $0$ pour $n \geqslant 3$, puisque $(2 - n)(1 - n) + (n - 1)(2 - n) = 0$ ; pour $n = 2$, c'est $\ln|x|$ dont le laplacien est nul hors de $0$.
    - |
      Le laplacien au sens des distributions d'une fonction continue peut être porté par une droite. Sur $\mathbb R^2$, soit $u(x, y) = |x|$, et $\varphi$ une fonction test. Par le théorème de Fubini ({{m-fubini|Tonelli, Fubini}}, (ii)), l'intégrale de $|x|\,\partial_y^2\varphi$ est nulle, puisque $\int \partial_y^2\varphi(x, y)\,dy = 0$ ({{ds-parametre|Intégrales à paramètre}}, (ii)). Pour l'autre terme, $x \mapsto \varphi(x, y)$ est une fonction test sur $\mathbb R$, et $|x|'' = 2\delta$ ({{ds-derivation|Dérivation}}, (iv)) donne
      $$\begin{aligned} \langle \Delta u, \varphi\rangle &= \int\!\!\int |x|\,\partial_x^2\varphi\,dx\,dy \\ &= 2\int \varphi(0, y)\,dy. \end{aligned}$$
      Ce laplacien est nul hors de la droite $x = 0$, comme le laplacien classique de $u$. Ce n'est pourtant pas une fonction : une fonction $g$ qui le représenterait serait nulle presque partout hors de la droite ({{ds-exemples|Exemples de distributions}}, (ii)), donc presque partout, la droite étant [[negligeable|négligeable]], alors que $\langle \Delta u, \varphi\rangle > 0$ pour $\varphi \geqslant 0$ non nulle en un point de la droite.
    - |
      Le laplacien d'une fonction de classe $C^1$, mais pas $C^2$, peut rester une fonction. Sur $\mathbb R$, $u(x) = x|x|$ est de classe $C^1$, de dérivée $2|x|$, continue : $(T_u)' = T_{2|x|}$ par le point (ii) du nœud {{ds-derivation|Dérivation}}, puis, la formule des sauts ne trouvant aucun saut, $\Delta T_u = T_{2\operatorname{sgn}}$. Pour $|x|$, dont la dérivée saute de $2$, on trouve au contraire $2\delta$. Plus loin, la fonction $\frac1{|x|}$ sur $\mathbb R^3$, de laplacien classique nul hors de $0$, aura pour laplacien $-4\pi\delta$ au sens des distributions ({{ds-laplacien|Solution élémentaire du laplacien}}, (ii)).

  fonction-heaviside:
    - |
      La dérivée de $H$ se calcule en une ligne, et sa valeur en $0$ ne compte pas. Pour une fonction test $\varphi$, $\langle H', \varphi\rangle = -\int_0^{+\infty}\varphi' = \varphi(0)$, par le théorème fondamental, $\varphi$ étant nulle hors d'un compact : $H' = \delta$. L'indicatrice de $[0, +\infty[$, égale à $H$ hors de $0$, définit la même distribution ({{ds-exemples|Exemples de distributions}}, (ii)). De même, $H(x - a)$ a pour dérivée $\delta_a$, et l'indicatrice de $[a, b]$, égale à $H(x - a) - H(x - b)$ hors de $\{a, b\}$, a pour dérivée $\delta_a - \delta_b$.
    - |
      Des marches régulières approchent $H$, et leurs dérivées approchent $\delta$. Avec la fonction $\sigma$ du nœud {{ds-test|Fonctions test}}, (iii), les fonctions $H_\varepsilon(x) = \sigma(\frac x\varepsilon)$ valent $0$ sur $]{-\infty}, 0]$, $1$ sur $[\varepsilon, +\infty[$, et tendent vers $H$ en tout point ; bornées par $1$, elles convergent vers $H$ dans $\mathcal D'(\mathbb R)$ par convergence dominée, pour toute suite $\varepsilon_k \to 0$. Par le point (i) du nœud {{ds-derivation|Dérivation}}, leurs dérivées $\frac1\varepsilon\sigma'(\frac x\varepsilon)$, positives, d'intégrale $1$ et nulles hors de $[0, \varepsilon]$, convergent vers $H' = \delta$.
      ```schema lex-fonction-heaviside-2
      En haut, les marches $\sigma(x/\varepsilon)$ pour $\varepsilon = 1$ (gris), $\frac12$ (bleu) et $\frac14$ (rouge), qui se raidissent vers $H$ ; en bas, leurs dérivées, d'aire $1$, nulles hors de $[0, \varepsilon]$, qui se concentrent en $0$.
      ```
    - |
      La fonction de Heaviside fournit des solutions de $u' - \lambda u = \delta$. Pour $\lambda$ réel, $u = H(x)\,e^{\lambda x}$ saute de $1$ en $0$, et sa dérivée hors de $0$ est $\lambda u$ : par la formule des sauts ({{ds-derivation|Dérivation}}, (iii)), $u' = \lambda u + \delta$. Plus loin, on dira que $u$ est une solution élémentaire de l'opérateur $\frac d{dx} - \lambda$ ({{ds-laplacien|Solution élémentaire du laplacien}}).

  support-distribution:
    - |
      Le support d'une distribution est fermé dans l'ouvert, et pas forcément dans $\mathbb R^n$. Sur $\Omega = \,]0, 2[$, la distribution $T = \sum_{j \geqslant 1}\delta_{1/j}$ du deuxième exemple de [[distribution]] s'annule sur l'ouvert $\Omega \setminus \{\frac1j : j \geqslant 1\}$. Elle ne s'annule sur aucun ouvert qui contient un point $\frac1j$ : pour $\varepsilon$ plus petit que $\frac1j$ et que la distance de $\frac1j$ aux autres points, la fonction test $\varphi(x) = \rho_\varepsilon(x - \frac1j)$ donne $T(\varphi) = \rho_\varepsilon(0) > 0$. Son support est donc $\{\frac1j : j \geqslant 1\}$, fermé dans $\Omega$, mais pas dans $\mathbb R$, où $0$ lui est adhérent.
    - |
      Pour une fonction qui n'est pas continue, le support de la distribution n'est plus l'adhérence de $\{f \neq 0\}$. L'indicatrice $f$ de $\mathbb Q$ sur $\mathbb R$ définit la distribution nulle, $\mathbb Q$ étant [[negligeable|négligeable]] : son support est $\varnothing$, alors que l'adhérence de $\{f \neq 0\} = \mathbb Q$ est $\mathbb R$. Le point (iii) du nœud {{ds-support|Support}} supposait $f$ continue. Pour l'indicatrice $g$ de $[0, 1]$, en revanche, on trouve $[0, 1]$ : si $x \in [0, 1]$ et $\varepsilon > 0$, on a $\int g(y)\,\rho_\varepsilon(y - x)\,dy > 0$, puisque $]x - \varepsilon, x + \varepsilon[$ rencontre $]0, 1[$ selon un intervalle non réduit à un point, où l'intégrande est strictement positive.
    - |
      Une fonction test nulle sur le support peut ne pas annuler la distribution. Sur $\mathbb R$, la forme $T(\varphi) = \varphi'(0)$ s'annule sur $\mathbb R \setminus \{0\}$, puisqu'une fonction test à support hors de $0$ est nulle près de $0$. Elle ne s'annule sur aucun ouvert contenant $0$ : avec $\chi$ égale à $1$ près de $0$ et de support dans cet ouvert ({{ds-test|Fonctions test}}, (iii)), $\varphi(x) = x\,\chi(x)$ vérifie $T(\varphi) = 1$. Son support est donc $\{0\}$, et cette même $\varphi$ est nulle sur le support sans que $T(\varphi)$ le soit. Plus loin, $T$ s'écrira $-\delta'$, et ce piège est celui que signale la remarque du nœud {{ds-support|Support}}.

  solution-elementaire:
    - |
      Une solution élémentaire n'est pas unique dès que l'équation $Pu = 0$ a une solution non nulle : on peut la lui ajouter. Pour $P = \frac d{dx}$, $H$ et $H - 1$ conviennent, puisque la dérivée d'une constante est nulle. Pour $P = \frac d{dx} - \lambda$, la formule des sauts ({{ds-derivation|Dérivation}}, (iii)) montre que $H(x)\,e^{\lambda x}$ et $(H(x) - 1)\,e^{\lambda x}$, nulles respectivement pour $x < 0$ et pour $x > 0$, sont deux solutions élémentaires, qui diffèrent de $e^{\lambda x}$.
    - |
      La convolution par une solution élémentaire de $\frac{d^2}{dx^2}$ résout $u'' = f$. Sur $\mathbb R$, $E = x_+ = xH(x)$ vérifie $E' = H$ et $E'' = \delta$ ({{ds-derivation|Dérivation}}, (iii) et (iv)). Pour une fonction test $f$, $u = E * f$, soit
      $$u(x) = \int_{-\infty}^x (x - y)\,f(y)\,dy,$$
      est de classe $C^\infty$, et $u'' = E'' * f = \delta * f = f$ ({{ds-convolution|Convolution des distributions}}, (iii)). Pour $f = \rho$, nulle hors de $[-1, 1]$, paire et d'intégrale $1$, $u$ est nulle sur $]{-\infty}, -1]$ et égale à $x$ sur $[1, +\infty[$.
      ```schema lex-solution-elementaire-2
      La fonction $\rho$, en gris, et la solution $u = E * \rho$ de $u'' = \rho$, en rouge : nulle à gauche de $-1$, elle coïncide à droite de $1$ avec la droite $y = x$, prolongée en pointillé, et s'y raccorde sans angle. Toute la courbure de $u$ est concentrée là où $\rho$ n'est pas nulle.
      ```
    - |
      La solution élémentaire du laplacien de $\mathbb R^3$ n'est pas unique non plus. Le polynôme $h = x_1^2 - x_2^2$ vérifie $\Delta h = 2 - 2 = 0$, donc $\Delta T_h = 0$ ({{ds-derivation|Dérivation}}, (ii)), et $-\frac1{4\pi|x|} + x_1^2 - x_2^2$ est encore une solution élémentaire, qui ne tend pas vers $0$ à l'infini. Plus loin, la différence de deux solutions élémentaires, distribution de laplacien nul, sera une fonction harmonique par le lemme de Weyl ({{ha-weyl|Lemme de Weyl}}), et le théorème de Liouville ({{ha-liouville|Liouville harmonique}}) montrera alors que $-\frac1{4\pi|x|}$ est la seule à tendre vers $0$ à l'infini.

  fonction-harmonique:
    - |
      Parmi les polynômes homogènes de degré $2$, l'harmonicité est une seule équation linéaire sur les coefficients. Sur $\mathbb R^2$, $\Delta(ax^2 + bxy + cy^2) = 2a + 2c$ : le polynôme est harmonique si et seulement si $c = -a$, ce qui laisse les combinaisons de $x^2 - y^2$ et de $xy$. Sur $\mathbb R^3$, $x^2 + y^2 - 2z^2$ et $xyz$ sont harmoniques, et $x^2 + y^2 + z^2$, de laplacien $6$, ne l'est pas.
    - |
      Les puissances de $|x|$ harmoniques dépendent de la dimension. Par la formule radiale du premier exemple de [[laplacien]], $\Delta|x|^a = a(a + n - 2)\,|x|^{a-2}$ sur $\mathbb R^n \setminus \{0\}$ : $|x|^a$ y est harmonique si et seulement si $a = 0$ ou $a = 2 - n$. Ainsi $\frac1{|x|}$ est harmonique sur $\mathbb R^3 \setminus \{0\}$, comme l'énonce le point (ii) du nœud {{ha-harmoniques|Fonctions harmoniques}}, mais pas sur $\mathbb R^2 \setminus \{0\}$, où son laplacien vaut $|x|^{-3}$ ; dans le plan, c'est $\ln|x|$ qui joue ce rôle.
    - |
      Les fonctions harmoniques forment un espace vectoriel, mais pas un anneau. Pour $u$ et $v$ de classe $C^2$, la dérivée d'un produit donne $\Delta(uv) = u\,\Delta v + v\,\Delta u + 2\,\nabla u \cdot \nabla v$, où $\nabla$ est le [[gradient]] : si $u$ et $v$ sont harmoniques, $uv$ l'est si et seulement si $\nabla u \cdot \nabla v = 0$. Ainsi $xy$ est harmonique sur $\mathbb R^2$, mais pas $x \cdot x = x^2$, et $\Delta(u^2) = 2|\nabla u|^2 \geqslant 0$. Plus loin, les fonctions harmoniques se révéleront de classe $C^\infty$ et égales à leurs moyennes sur les boules ({{ha-regularite|Régularité des fonctions harmoniques}}).

  propriete-moyenne:
    - |
      Sur le disque unité, la moyenne de $x^2 - y^2$ est nulle par compensation. En [[coordonnees-polaires|coordonnées polaires]] ({{cv-polaires|Coordonnées polaires}}, (ii)), avec $\lambda(B(0, 1)) = \pi$,
      $$\begin{aligned} m_{0,1}(x^2) &= \frac1\pi\int_{-\pi}^\pi\!\int_0^1 r^3\cos^2\theta\,dr\,d\theta \\ &= \frac14, \end{aligned}$$
      et de même $m_{0,1}(y^2) = \frac14$. La moyenne de la [[fonction-harmonique|fonction harmonique]] $x^2 - y^2$ est donc $0$, sa valeur au centre, et celle de $x^2 + y^2$, de laplacien $4 > 0$, est $\frac12$, plus grande que sa valeur $0$ au centre, comme le veut le point (iii) du nœud {{ha-moyenne|Propriété de la moyenne}}.
    - |
      L'égalité à la moyenne sur une seule boule ne suffit pas : il la faut pour tous les rayons. Sur $\mathbb R^2$, soit $u = |x|^2 - \frac32|x|^4$, de laplacien $4 - 24|x|^2$, non nul. En coordonnées polaires, $m_{0,r}(|x|^2) = \frac{r^2}2$ et $m_{0,r}(|x|^4) = \frac{r^4}3$, d'où
      $$m_{0,r}(u) = \frac{r^2(1 - r^2)}2.$$
      Cette moyenne vaut $u(0) = 0$ pour $r = 1$, mais pour aucun autre rayon de $]0, 1]$.
      ```schema lex-propriete-moyenne-2
      La moyenne $m_{0,r}(u)$ de $u = |x|^2 - \frac32|x|^4$ sur le disque de rayon $r$, en rouge, en fonction de $r$ : elle rejoint la valeur $u(0) = 0$, celle de l'axe horizontal, au seul rayon $r = 1$ de l'intervalle $]0, 1]$, marqué d'un point.
      ```
    - |
      La condition que l'adhérence de la boule soit contenue dans l'ouvert ne peut pas être omise. La fonction $\ln|x|$ est harmonique sur $\Omega = \mathbb R^2 \setminus \{0\}$ ({{ha-harmoniques|Fonctions harmoniques}}, (ii)), et sa moyenne sur tout disque $B((2, 0), r)$ avec $r < 2$ vaut $\ln 2$. Sur le disque de rayon $3$, qui contient l'origine, elle reste intégrable, puisque $\int_0^1 |\ln r|\,r\,dr$ est fini, mais sa moyenne y vaut $\ln 3 - \frac5{18} \approx 0{,}821$, valeur confirmée par un calcul numérique, alors que $\ln 2 \approx 0{,}693$. Plus loin, la propriété de la moyenne caractérisera les fonctions harmoniques parmi les fonctions continues ({{ha-regularite|Régularité des fonctions harmoniques}}, (ii)).

  probleme-dirichlet:
    - |
      Sur le disque unité, on devine souvent la solution parmi les polynômes harmoniques. Pour la donnée $g = x^2$ sur le cercle, la fonction $x^2$ ne convient pas, n'étant pas [[fonction-harmonique|harmonique]]. Mais $x^2 = \frac12 + \frac{x^2 - y^2}2$ sur le cercle, où $x^2 + y^2 = 1$, et $u = \frac12 + \frac{x^2 - y^2}2$ est harmonique et continue sur le disque fermé : c'est la solution, unique par le point (iii) du nœud {{ha-maximum|Principe du maximum}}. Elle vérifie bien $0 \leqslant u \leqslant 1$, comme la donnée, puisque $|x^2 - y^2| \leqslant x^2 + y^2 \leqslant 1$.
    - |
      L'unicité tombe sur un ouvert non borné, même parmi les solutions bornées. Dans $\mathbb R^3$, l'extérieur $\Omega = \{|x| > 1\}$ de la boule unité a pour adhérence $\{|x| \geqslant 1\}$ et pour [[frontiere|frontière]] la sphère unité. Pour la donnée $g = 1$, la fonction constante $1$ et la fonction $\frac1{|x|}$, harmonique sur $\Omega$ ({{ha-harmoniques|Fonctions harmoniques}}, (ii)), sont continues sur $\bar\Omega$, égales à $1$ sur la sphère, et bornées par $1$ : ce sont deux solutions distinctes, et le principe du maximum ne s'applique pas, $\Omega$ n'étant pas borné.
      ```schema lex-probleme-dirichlet-2
      Les deux solutions en fonction de la distance $r = |x| \geqslant 1$ à l'origine : la constante $1$, en bleu, et $\frac1r$, en rouge. Elles coïncident sur la sphère $r = 1$, puis $\frac1r$ décroît vers $0$ : la valeur au bord ne décide pas du comportement à l'infini.
      ```
    - |
      La linéarisation trigonométrique ramène une donnée polynomiale en $\cos\theta$ à des polynômes harmoniques. Sur le cercle unité, où $x = \cos\theta$, on a $\cos^3\theta = \frac34\cos\theta + \frac14\cos 3\theta$, et $\cos 3\theta$ est la partie réelle de $(\cos\theta + i\sin\theta)^3$, soit la valeur de $x^3 - 3xy^2$. La fonction $u = \frac34x + \frac14(x^3 - 3xy^2)$, harmonique ({{ha-harmoniques|Fonctions harmoniques}}, (ii)), est donc la solution pour la donnée $x^3$, et $|u| \leqslant 1$ sur le disque, par le point (iii) du nœud {{ha-maximum|Principe du maximum}}, la donnée prenant ses valeurs dans $[-1, 1]$. Plus loin, le noyau de Poisson résoudra le problème sur le disque pour toute donnée continue ({{ha-poisson|Problème de Dirichlet sur le disque}}).

  noyau-poisson:
    - |
      Le noyau de Poisson se concentre en $t = 0$ quand $r$ tend vers $1$. Ses valeurs extrêmes sont $P(r, 0) = \frac{1 + r}{1 - r}$ et $P(r, \pi) = \frac{1 - r}{1 + r}$ : pour $r = \frac12$, $3$ et $\frac13$, et pour $r = 0{,}9$, $19$ et $\frac1{19}$. Sa moyenne sur une période vaut pourtant toujours $1$ ({{ha-poisson|Problème de Dirichlet sur le disque}}, (i)) : la masse se rassemble près de $t = 0$.
      ```schema lex-noyau-poisson-1
      Le noyau $P(r, \cdot)$ sur $[-\pi, \pi]$ pour $r = 0{,}3$ (gris), $0{,}6$ (bleu) et $0{,}85$ (rouge). Les trois courbes ont la même moyenne $1$, et leurs maxima en $0$, $\frac{1 + r}{1 - r} \approx 1{,}86$, $4$ et $12{,}3$, croissent quand $r$ tend vers $1$.
      ```
    - |
      Sans continuité sur le disque fermé, l'unicité du [[probleme-dirichlet|problème de Dirichlet]] tombe. La fonction $v(re^{it}) = P(r, t)$, partie réelle de la fonction holomorphe $\frac{1 + z}{1 - z}$, est harmonique et strictement positive sur le disque ({{ha-holomorphes|Harmoniques et holomorphes}}, (i)). Elle s'écrit $\frac{1 - |z|^2}{|1 - z|^2}$, qui tend vers $0$ quand $z$ tend vers un point $e^{i\theta_0} \neq 1$ du cercle, le numérateur tendant vers $0$ et le dénominateur vers $|1 - e^{i\theta_0}|^2 > 0$. Comme la fonction nulle, $v$ a donc la limite $0$ en tout point du cercle sauf $1$, où elle n'est pas bornée.
    - |
      Le noyau de Poisson amortit chaque fréquence de la donnée d'un facteur $r^n$. Pour $f(t) = \cos t$, les coefficients du point (ii) du nœud {{ha-poisson|Problème de Dirichlet sur le disque}} sont $a_1 = \frac12$ et $a_n = 0$ pour les autres $n \geqslant 0$, d'où $F(z) = z$ et $u(re^{i\theta}) = r\cos\theta$ : la solution est la fonction $x$. De même, pour $f(t) = \cos(nt)$, $n \geqslant 1$, on trouve $F(z) = z^n$ et $u(re^{i\theta}) = r^n\cos(n\theta)$, d'autant plus petite à l'intérieur que la fréquence est élevée.

  equation-chaleur:
    - |
      L'équation de la chaleur amortit d'autant plus une oscillation qu'elle est rapide. Pour $k$ réel, $u(t, x) = e^{-k^2t}\cos(kx)$ vérifie $\partial_t u = -k^2u = \partial_x^2 u$ : la donnée $\cos(kx)$ est amortie au taux $k^2$. Par linéarité, $e^{-t}\cos x + e^{-9t}\cos 3x$ est une solution de donnée $\cos x + \cos 3x$, dont la composante rapide disparaît neuf fois plus vite. Le polynôme $x^2 + 2t$ est aussi une solution, de donnée $x^2$.
      ```schema lex-equation-chaleur-1
      La solution $e^{-t}\cos x + e^{-9t}\cos 3x$ aux instants $t = 0$ (gris), $0{,}1$ (bleu) et $0{,}4$ (rouge), sur $[-\pi, \pi]$. Les petites oscillations de $\cos 3x$ s'effacent les premières, et le profil se rapproche de $e^{-t}\cos x$.
      ```
    - |
      Le signe de l'équation est décisif. Pour l'équation rétrograde $\partial_t u = -\partial_x^2 u$, la donnée $\frac1k\cos(kx)$, qui tend uniformément vers $0$ quand $k \to \infty$, donne une solution $\frac1ke^{k^2t}\cos(kx)$, dont le maximum à l'instant $t = 1$, $\frac{e^{k^2}}k$, tend vers l'infini. Pour l'équation de la chaleur, la même donnée donne $\frac1ke^{-k^2t}\cos(kx)$, majorée par $\frac1k$ à tout instant : sur cette famille, une petite donnée donne une petite solution.
    - |
      L'équation est invariante par le changement d'échelle $(t, x) \mapsto (\lambda^2t, \lambda x)$. Si $u$ est une solution, $v(t, x) = u(\lambda^2t, \lambda x)$ vérifie $\partial_t v = \lambda^2\,\partial_t u$ et $\partial_x^2 v = \lambda^2\,\partial_x^2 u$, aux points $(\lambda^2t, \lambda x)$ : c'est une solution. Le [[noyau-chaleur|noyau de la chaleur]] en est l'exemple type, puisque $G(t, x) = t^{-1/2}\,G(1, \frac x{\sqrt t})$ : le temps se mesure en carré de la distance. Plus loin, on verra que la solution bornée de donnée $f$ est unique ({{ch-maximum|Principe du maximum parabolique}}, (iii)), ce que l'exemple $x^2 + 2t$, non borné, ne contredit pas.

  noyau-chaleur:
    - |
      En un point fixé $x \neq 0$, la température due à une source ponctuelle en $0$ passe par un maximum à l'instant $t = \frac{x^2}2$. On a $\partial_t G = \big(\frac{x^2}{4t^2} - \frac1{2t}\big)G$, positive avant $\frac{x^2}2$ et négative après, et la valeur maximale est
      $$G\Big(\frac{x^2}2, x\Big) = \frac1{|x|\sqrt{2\pi e}}.$$
      Pour $x = 1$, le maximum, d'environ $0{,}242$, est atteint en $t = \frac12$ ; pour $x = 2$, il vaut environ $0{,}121$, en $t = 2$ : deux fois plus loin, la chaleur arrive quatre fois plus tard.
      ```schema lex-noyau-chaleur-1
      La température $t \mapsto G(t, x)$ en $x = 1$, en rouge, et en $x = 2$, en bleu. Chaque courbe part de $0$, culmine à l'instant $\frac{x^2}2$, marqué d'un point, à la hauteur $\frac1{|x|\sqrt{2\pi e}}$, puis décroît comme $\frac1{\sqrt t}$.
      ```
    - |
      La concentration du noyau en $0$ empêche d'échanger limite et intégrale. Pour $x \neq 0$, $G(t, x) \to 0$ quand $t \to 0^+$, et la limite simple est donc nulle presque partout, d'intégrale $0$, alors que $\int G(t, x)\,dx = 1$ pour tout $t > 0$. La convergence dominée ne s'applique pas : par le premier exemple, toute fonction qui majore $G(t, \cdot)$ pour tous les $t > 0$ est au moins $\frac1{|x|\sqrt{2\pi e}}$, qui n'est pas intégrable près de $0$.
    - |
      Une solution de l'[[equation-chaleur|équation de la chaleur]] n'est pas toujours un noyau. La dérivée $\partial_x G = -\frac x{2t}G$ est encore une solution, puisque $\partial_x$ commute avec $\partial_t$ et $\partial_x^2$ sur les fonctions de classe $C^\infty$, mais elle est impaire, d'intégrale nulle, et change de signe : la positivité et la masse $1$ sont propres au noyau. Plus loin, la convolution par $G$ résoudra le problème de Cauchy pour une donnée continue et bornée ({{ch-cauchy|Problème de Cauchy}}).

  ordre-distribution:
    - |
      La forme $\varphi \mapsto \varphi'(a)$ sur $\mathbb R$ est d'ordre exactement $1$. Elle est d'ordre au plus $1$, puisque $|\varphi'(a)| \leqslant p_1(\varphi)$. Soit $\chi$ une fonction test égale à $1$ près de $0$ ({{ds-test|Fonctions test}}, (iii)), $g(x) = x\,\chi(x)$, et $\varphi_k(x) = \frac1k\,g\big(k(x - a)\big)$ : les supports restent dans un même compact, $p_0(\varphi_k) = \frac{p_0(g)}k$ tend vers $0$, et pourtant $\varphi_k'(a) = g'(0) = 1$. Aucune inégalité $|\varphi'(a)| \leqslant C\,p_0(\varphi)$ ne vaut donc sur ce compact.
    - |
      Une distribution peut être d'ordre fini sur chaque compact sans être d'ordre fini. Sur $\Omega = \,]0, 2[$, la forme $T(\varphi) = \sum_{j \geqslant 1}\varphi^{(j)}(\frac1j)$ est une somme finie pour chaque fonction test, et sur un compact $K$ elle est majorée par $N_K\,p_{m_K}(\varphi)$, où $m_K$ est le plus grand $j$ tel que $\frac1j \in K$. Pour $m$ donné, soit $j = m + 1$, $a = \frac1j$, $r > 0$ tel que $[a - r, a + r] \subset \Omega$ ne contienne aucun autre $\frac1i$, et $g(x) = \frac{x^j}{j!}\chi(x)$, avec $\chi$ une fonction test de support dans $[-r, r]$, égale à $1$ près de $0$.

      Les fonctions $g_k(x) = k^{-j}g\big(k(x - a)\big)$, à support dans $[a - r, a + r]$, vérifient $T(g_k) = g^{(j)}(0) = 1$ et $p_m(g_k) \leqslant k^{m - j}\,p_m(g)$, qui tend vers $0$ : l'entier $m$ ne convient pas, et $T$ n'est d'aucun ordre fini.
    - |
      Être d'ordre $0$ n'interdit pas aux constantes de croître avec le compact. La distribution $T(\varphi) = \sum_j \varphi(\frac1j)$ sur $]0, 2[$, du deuxième exemple de [[distribution]], est d'ordre $0$, avec la constante $N_K$. Pour $K = [\frac1N, 1]$ et une fonction test $\chi$ à valeurs dans $[0, 1]$, égale à $1$ sur $K$ ({{ds-test|Fonctions test}}, (iii)), on a $p_0(\chi) = 1$ et $T(\chi) \geqslant N$ : aucune constante ne convient pour tous les compacts à la fois.

  boule-fermee-ouvert:
    - |
      Un ouvert qui n'est pas [[partie-convexe|convexe]] a des boules fermées qui le sont. Dans $W = \mathbb R^2 \setminus \{0\}$, la [[boule-fermee|boule fermée]] $\bar B(p, r)$ est contenue dans $W$ si et seulement si $r < |p|$ : ce sont les boules fermées de $W$, et tout point $p$ de $W$ est intérieur à l'une d'elles, par exemple $\bar B(p, \frac{|p|}2)$. Le segment de $p$ à $-p$ passe par $0$ : $W$ n'est pas convexe, mais les accroissements finis du nœud {{ds-parametre|Intégrales à paramètre}}, (i), ne sont employés que le long de segments contenus dans une boule fermée de $W$.
      ```schema lex-boule-fermee-ouvert-1
      L'ouvert $W$, plan privé de l'origine marquée d'un cercle creux ; une boule fermée de $W$, en bleu, de rayon plus petit que la distance de son centre $p$ à l'origine. Le segment de $p$ à $-p$, en rouge, sort de $W$ en passant par l'origine, alors que tout segment joignant deux points de la boule y reste.
      ```
    - |
      L'hypothèse de domination ne porte que sur les boules fermées de $W$, et c'est ce qui la rend vérifiable. Soit $W = A = \,]0, +\infty[$ et $h(p, y) = e^{-py}$, d'intégrale $H(p) = \frac1p$. Une fonction $g$ telle que $e^{-py} \leqslant g(y)$ pour tout $p > 0$ vérifierait $g \geqslant 1$, et ne serait pas intégrable sur $A$. Mais sur une boule fermée $[p_0 - r, p_0 + r]$ de $W$, avec $r < p_0$, les dérivées $|\partial_p^k h| = y^ke^{-py}$ sont majorées par $y^ke^{-by}$, où $b = p_0 - r > 0$, intégrable puisque $y^ke^{-by/2}$ est borné ({{ex-croissances|Croissances comparées}}) et que $\int_0^{+\infty} e^{-by/2}\,dy = \frac2b$. Le point (i) du nœud {{ds-parametre|Intégrales à paramètre}} donne alors $H'(p) = -\int_0^{+\infty} y\,e^{-py}\,dy$, et l'on retrouve $-\frac1{p^2}$.
    - |
      Sans domination sur une boule fermée autour d'un point, la conclusion peut tomber en ce point. Sur $W = \mathbb R$, avec $A = \,]0, +\infty[$ et $h(p, y) = p\,e^{-p^2y}$, on a $H(p) = \frac1p$ pour $p \neq 0$, et $H(0) = 0$ : $H$ n'est pas continue en $0$. Sur une boule fermée qui contient $0$, et contient donc $[0, r]$ ou $[-r, 0]$ pour un $r > 0$, le maximum de $|h(\cdot, y)|$, atteint en $p = \pm(2y)^{-1/2}$ dès que $y \geqslant \frac1{2r^2}$, vaut $(2ey)^{-1/2}$, dont l'intégrale sur $[\frac1{2r^2}, +\infty[$ est infinie : l'hypothèse (c) n'y est pas remplie.

  multi-indice:
    - |
      Un multi-indice code une dérivée partielle d'ordre quelconque. Pour $n = 2$ et $\alpha = (2, 1)$, on a $|\alpha| = 3$ et $\partial^\alpha f = \partial_1^2\partial_2 f$ ; pour $f(x, y) = x^3y^2$, $\partial_2 f = 2x^3y$, puis $\partial^\alpha f = 12xy$. Les multi-indices de longueur $3$ sont $(3, 0)$, $(2, 1)$, $(1, 2)$ et $(0, 3)$, et la semi-norme $p_2$ du nœud {{ds-test|Fonctions test}} porte sur les six multi-indices de longueur au plus $2$, $(0, 0)$, $(1, 0)$, $(0, 1)$, $(2, 0)$, $(1, 1)$ et $(0, 2)$.
    - |
      Les entiers $c$ de la formule de dérivation d'un produit, au point (i) du nœud {{ds-test|Fonctions test}}, ne valent pas tous $1$. Pour $n = 2$, la dérivation d'un produit donne
      $$\begin{aligned} \partial^{(2,0)}(a\varphi) &= (\partial_1^2a)\,\varphi + 2\,\partial_1a\,\partial_1\varphi \\ &\quad + a\,\partial_1^2\varphi, \end{aligned}$$
      avec le coefficient $2$ pour $\beta = (1, 0)$, alors que $\partial^{(1,1)}(a\varphi)$ est la somme des quatre termes $\partial^\beta a\,\partial^{(1,1) - \beta}\varphi$, pour $\beta \leqslant (1, 1)$, chacun avec le coefficient $1$. L'ordre $\beta \leqslant \alpha$ n'est pas total : ni $(2, 0) \leqslant (0, 2)$, ni l'inverse.
    - |
      La notation $\partial^\alpha$ suppose assez de régularité pour que l'ordre des dérivations soit indifférent. La fonction $f(x, y) = xy\frac{x^2 - y^2}{x^2 + y^2}$, prolongée par $0$ en l'origine, a des dérivées secondes croisées en $(0, 0)$ qui valent $-1$ et $1$ selon l'ordre (remarque du nœud {{gd-schwarz|Schwarz}}) : pour elle, $\partial^{(1,1)}f(0, 0)$ n'aurait pas de sens. Le théorème de Schwarz, qui la rend légitime, demande la classe $C^2$, que les fonctions test ont largement.
