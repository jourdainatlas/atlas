# Exemples du lexique : théorie « ℤ » (z).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  anneau-zn:
    - |
      L'anneau $\mathbb Z/6\mathbb Z$ n'est pas intègre, conformément au théorème, puisque $6$ n'est pas premier : $\overline 2 \cdot \overline 3 = \overline 6 = \overline 0$. Ses seuls éléments inversibles sont $\overline 1$ et $\overline 5$, ce dernier étant son propre inverse car $5 \cdot 5 = 25 = 4 \cdot 6 + 1$. Les classes $\overline 2$, $\overline 3$ et $\overline 4$ sont des diviseurs de zéro, c'est-à-dire des éléments non nuls dont le produit par un élément non nul est nul : $\overline 2 \cdot \overline 3 = \overline 4 \cdot \overline 3 = \overline 0$.
    - |
      L'anneau $\mathbb Z/5\mathbb Z$ est un [[corps]], et ses inverses se lisent sur la table de multiplication :
      $$\overline 1 \cdot \overline 1 = \overline 1, \quad \overline 2 \cdot \overline 3 = \overline 1, \quad \overline 4 \cdot \overline 4 = \overline 1,$$
      puisque $6 = 5 + 1$ et $16 = 3 \cdot 5 + 1$. On y a $\overline 2^2 = \overline{-1}$ : l'équation $x^2 + \overline 1 = \overline 0$, sans solution parmi les entiers, en a deux dans $\mathbb Z/5\mathbb Z$, à savoir $\overline 2$ et $\overline 3$.
    - |
      Le cas $n = 1$ est un cas limite : $\mathbb Z/1\mathbb Z$ n'a qu'un élément, de sorte que $\overline 1 = \overline 0$, et c'est l'anneau nul. Ce n'est pas un corps, dont la définition exige $1 \neq 0$, et ce n'est pas une contradiction avec le théorème, puisque $1$ n'est pas premier.

  valeur-absolue:
    - |
      On a $|-3| = |3| = 3$, et plus généralement $|x|$ est le plus grand des deux entiers $x$ et $-x$, puisque l'un des deux est positif et l'autre négatif. Il en découle que $|x| = |y|$ si et seulement si $y = x$ ou $y = -x$ : la valeur absolue oublie le signe, et seulement lui.
    - |
      L'inégalité $|x + y| \leqslant |x| + |y|$ ({{z-ordre|L'ordre de ℤ}}, (iii)) peut être stricte : pour $x = 2$ et $y = -3$, on trouve $|x + y| = 1$, alors que $|x| + |y| = 5$. Il y a égalité exactement quand $xy \geqslant 0$. Si $x$ et $y$ sont de même signe, $x + y$ l'est aussi, et l'égalité est immédiate. Si $x > 0 > y$, alors $y < x + y < x$, d'où $|x + y| < \max(|x|, |y|) < |x| + |y|$ ; le cas $y > 0 > x$ s'en déduit en échangeant $x$ et $y$. Dès que les signes diffèrent, une partie de chaque terme compense l'autre.
    - |
      La même inégalité donne une borne inférieure. En écrivant $x = (x - y) + y$, on obtient $|x| \leqslant |x - y| + |y|$, et de même en échangeant $x$ et $y$, d'où
      $$\big|\,|x| - |y|\,\big| \leqslant |x - y|.$$
      Pour $x = 2$ et $y = -3$, cela donne $1 \leqslant 5$. En revanche, l'inégalité $|x - y| \leqslant |x| - |y|$ est fausse dès que $y$ est de signe contraire à $x$ : ici, elle donnerait $5 \leqslant -1$.

  racine-polynome:
    - |
      L'existence d'une racine dépend de l'anneau. Le polynôme $X^2 + 1$ n'a pas de racine dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, puisque $x^2 + 1 \geqslant 1$ pour tout entier $x$. Il n'en a pas non plus dans $\lex{anneau-zn}{\mathbb Z/3\mathbb Z}$, où les carrés sont $\overline 0$ et $\overline 1$. Il en a deux, en revanche, dans $\mathbb Z/5\mathbb Z$, à savoir $\overline 2$ et $\overline 3$, puisque $2^2 + 1 = 5$ et $3^2 + 1 = 10$ ; il s'y factorise en $(X - \overline 2)(X - \overline 3)$, car $(X - 2)(X - 3) = X^2 - 5X + 6$.
    - |
      Dans $\mathbb Z/6\mathbb Z$, qui n'est pas intègre, le polynôme $X^2 - X$, de degré $2$, a quatre racines : $\overline 0$, $\overline 1$, $\overline 3$ et $\overline 4$, puisque $3 \cdot 2 = 6$ et $4 \cdot 3 = 12$ sont multiples de $6$. Il admet ainsi deux factorisations différentes,
      $$\begin{aligned} X^2 - X &= X(X - \overline 1) \\ &= (X - \overline 3)(X - \overline 4), \end{aligned}$$
      car $\overline 3 + \overline 4 = \overline 1$ et $\overline 3 \cdot \overline 4 = \overline 0$. Sans intégrité, la borne « au plus $d$ racines » tombe, et avec elle l'unicité de la décomposition en facteurs de degré $1$.
    - |
      Plus loin, dans le corps {{q-construction|ℚ}}, qui contient $\mathbb Z$ comme sous-anneau, le polynôme $2X - 1$ aura la racine $\frac12$, alors qu'il n'en a aucune dans $\mathbb Z$, où $2x - 1$ est toujours impair. C'est l'exemple le plus simple d'un polynôme à coefficients dans un anneau qui n'a de racine que dans un anneau plus grand.
