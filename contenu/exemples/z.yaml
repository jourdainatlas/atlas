# Exemples du lexique : théorie « ℤ » (z).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  division-euclidienne:
    - |
      On a $2026 = 7 \cdot 289 + 3$, avec $0 \leqslant 3 < 7$ : le quotient est $289$ et le reste $3$. Pour $-2026$, le reste doit rester positif : $-2026 = 7 \cdot (-290) + 4$, et non $7 \cdot (-289) - 3$, qui a la bonne valeur mais un reste négatif.
    - |
      Sans la condition $0 \leqslant r < b$, l'unicité tombe : $17 = 5 \cdot 3 + 2 = 5 \cdot 2 + 7 = 5 \cdot 4 - 3$, et plus généralement $17 = 5q + (17 - 5q)$ pour tout entier $q$. La condition sur le reste retient exactement l'un de ces couples, celui dont le reste est le plus petit entier naturel de la forme $17 - 5q$, comme dans la preuve d'existence.
    - |
      La division par $2$ range tout entier en pair, de la forme $2q$, ou impair, de la forme $2q + 1$, et jamais dans les deux à la fois, par l'unicité. Le carré d'un impair est impair, puisque $(2q + 1)^2 = 2(2q^2 + 2q) + 1$, et le produit de deux entiers consécutifs est pair, l'un des deux l'étant. Plus loin, l'algorithme d'Euclide enchaînera les divisions euclidiennes pour calculer un PGCD ({{z-bezout|PGCD, Bézout}}).

  anneau-principal:
    - |
      Dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, l'[[ideal|idéal]] $4\mathbb Z + 6\mathbb Z$ des entiers $4u + 6v$ est engendré par son plus petit élément strictement positif, comme dans la preuve de {{z-ideaux|Idéaux de ℤ}}. Cet élément est $2 = 4 \cdot (-1) + 6 \cdot 1$, puisque tous les éléments de l'idéal sont pairs ; ainsi $4\mathbb Z + 6\mathbb Z = 2\mathbb Z$.
    - |
      Un [[corps]] est un anneau principal : ses seuls idéaux sont $\{0\}$ et $K$ ({{a-corps|Corps}}, (ii)), engendrés par $0$ et par $1$. La définition exige aussi l'intégrité, et ce n'est pas une redondance. Dans l'anneau $\lex{ensemble-parties}{\mathcal P}(E)$ de {{a-anneau|Anneau}}, (v), avec $E = \{a, b\}$, un idéal $I$ contient la réunion $U$ de ses éléments, puisque $X \cup Y = X \mathbin{\triangle} Y \mathbin{\triangle} (X \cap Y)$.

      Il contient donc toute partie $Y = Y \cap U$ de $U$, et $I = \{U \cap Y : Y \in \mathcal P(E)\}$ est principal, engendré par $U$. Tous les idéaux de $\mathcal P(E)$ sont ainsi principaux, mais cet anneau n'est pas [[anneau-integre|intègre]], puisque $\{a\} \cap \{b\} = \varnothing$ : ce n'est pas un anneau principal.
    - |
      Plus loin, l'anneau des polynômes sur un corps sera principal par le même argument, le degré remplaçant la valeur absolue, alors que $\mathbb Z[X]$, intègre, ne le sera pas : l'idéal engendré par $2$ et $X$ n'est engendré par aucun polynôme ({{pol-principal|K[X] principal}}).

  pgcd:
    - |
      L'algorithme d'Euclide calcule $2026 \wedge 1001$ par divisions successives :
      $$\begin{aligned} 2026 &= 2 \cdot 1001 + 24, \\ 1001 &= 41 \cdot 24 + 17, \\ 24 &= 1 \cdot 17 + 7, \\ 17 &= 2 \cdot 7 + 3, \\ 7 &= 2 \cdot 3 + 1. \end{aligned}$$
      Chaque étape conserve l'idéal $a\mathbb Z + b\mathbb Z$, et le dernier reste non nul, $1$, est le PGCD : les deux nombres sont [[premiers-entre-eux|premiers entre eux]]. En remontant les divisions, on trouve la relation de Bézout $2026 \cdot 292 - 1001 \cdot 591 = 1$.
    - |
      Le PGCD est toujours positif, et il se lit sur l'idéal : $(-12) \wedge 18 = 6$, et $a \wedge 0 = |a|$, puisque $a\mathbb Z + 0\mathbb Z = |a|\,\mathbb Z$. Le cas limite $0 \wedge 0 = 0$ montre pourquoi l'on passe par l'idéal : tout entier divise $0$, et il n'y a pas de « plus grand » diviseur commun de $0$ et $0$ au sens de l'ordre.
    - |
      Une combinaison $au + bv$ n'est pas en général le PGCD : $12 \cdot 1 + 18 \cdot 1 = 30$ ne l'est pas, puisque $12 \wedge 18 = 6$. Une combinaison positive l'est si et seulement si elle [[divisibilite-entiers|divise]] $a$ et $b$, car elle est alors divisée par le PGCD et le divise. Les coefficients de Bézout ne sont pas uniques non plus : $6 = 12 \cdot (-1) + 18 \cdot 1 = 12 \cdot 2 + 18 \cdot (-1)$.

  nombre-premier:
    - |
      Pour reconnaître un nombre premier $n$, il suffit d'essayer les diviseurs premiers $p$ tels que $p^2 \leqslant n$. En effet, si $n = ab$ avec $2 \leqslant a \leqslant b$, alors $a^2 \leqslant ab = n$, et tout facteur premier de $a$ convient. Ainsi $97$ est premier, car ni $2$, ni $3$, ni $5$, ni $7$ ne le divisent et $11^2 = 121 > 97$ ; en revanche, $91 = 7 \cdot 13$ ne l'est pas.
    - |
      Le lemme d'Euclide caractérise les nombres premiers parmi les entiers $n \geqslant 2$. Pour $n = 6$, on a $6 \mid 2 \cdot 3$, sans que $6$ divise $2$ ou $3$ ; en général, si $n = ab$ avec $2 \leqslant a, b < n$, alors $n$ divise $ab$ sans diviser ni $a$ ni $b$, qui sont strictement compris entre $0$ et $n$.
    - |
      Les nombres premiers laissent entre eux des intervalles aussi longs qu'on veut. Pour $n \geqslant 2$, aucun des $n - 1$ entiers consécutifs $n! + 2, \dots, n! + n$ n'est premier, puisque $n! + k$ est divisible par $k$ et strictement plus grand que lui, pour $2 \leqslant k \leqslant n$. Pour $n = 5$, les entiers $122$, $123$, $124$ et $125$ sont respectivement divisibles par $2$, $3$, $4$ et $5$.

  anneau-polynomes:
    - |
      Le produit de deux polynômes se calcule sur leurs suites de coefficients, par la formule $c_k = \sum_{i + j = k} a_ib_j$. Pour $P = 1 + 2X$ et $Q = 3 - X + X^2$ dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}[X]$, les coefficients de $PQ$ sont $c_0 = 1 \cdot 3 = 3$, $c_1 = 1 \cdot (-1) + 2 \cdot 3 = 5$, $c_2 = 1 \cdot 1 + 2 \cdot (-1) = -1$ et $c_3 = 2 \cdot 1 = 2$. Ainsi $PQ = 3 + 5X - X^2 + 2X^3$, de [[degre-polynome|degré]] $3 = 1 + 2$.
    - |
      Sur un anneau qui n'est pas [[anneau-integre|intègre]], l'anneau des polynômes ne l'est pas non plus. Dans $(\lex{anneau-zn}{\mathbb Z/6\mathbb Z})[X]$, on a $(\overline 3X)(\overline 2X + \overline 4) = \overline 6X^2 + \overline{12}X = 0$ : deux polynômes non nuls ont un produit nul. Comme $A$ est un sous-anneau de $A[X]$, l'intégrité de $A$ est exactement ce qu'il faut pour que $A[X]$ soit intègre.
    - |
      Même sur un anneau fini, $A[X]$ est infini : les $X^k$, pour $k \in \lex{ensemble-entiers-naturels}{\mathbb N}$, sont deux à deux distincts. Sur $\mathbb Z/2\mathbb Z$, les polynômes de degré strictement inférieur à $n$ correspondent à leurs $n$ premiers coefficients, et il y en a $2^n$. Plus loin, le corps $\mathbb C$ sera construit comme un quotient de l'anneau $\mathbb R[X]$ ({{c-construction|Construction de ℂ}}).

  polynome-irreductible:
    - |
      L'irréductibilité dépend du corps. Sur $\lex{anneau-zn}{\mathbb Z/2\mathbb Z}$, le polynôme $X^2 + X + \overline 1$ est irréductible, puisqu'il vaut $\overline 1$ en $\overline 0$ et en $\overline 1$ et que, de degré $2$, il est irréductible dès qu'il n'a pas de [[racine-polynome|racine]] ({{pol-irreductibles|Irréductibles}}, (iii)). Sur $\mathbb Z/3\mathbb Z$, il a la racine $\overline 1$ et s'écrit $(X - \overline 1)^2$, puisque $-\overline 2 = \overline 1$.
    - |
      En degré $4$, l'absence de racine ne suffit plus. Sur $\mathbb Z/2\mathbb Z$, le polynôme $X^4 + X^2 + \overline 1$ vaut $\overline 1$ en $\overline 0$ et en $\overline 1$, et pourtant $X^4 + X^2 + \overline 1 = (X^2 + X + \overline 1)^2$, puisque les doubles produits disparaissent quand $\overline 2 = \overline 0$. C'est le produit de deux facteurs de degré $2$ sans racine.
    - |
      Sur $\mathbb Z/2\mathbb Z$, les polynômes unitaires de degré $2$ sont $X^2$, $X^2 + \overline 1 = (X + \overline 1)^2$, $X^2 + X = X(X + \overline 1)$ et $X^2 + X + \overline 1$ : un seul est irréductible. Parmi les huit de degré $3$, les irréductibles sont ceux qui n'ont pas de racine, à savoir $X^3 + X + \overline 1$ et $X^3 + X^2 + \overline 1$. Plus loin, le quotient par l'idéal engendré par $X^2 + X + \overline 1$ sera un corps à quatre éléments ({{gs-corps-finis|Corps finis}}).

  multiplicite-racine:
    - |
      Pour $P = X^4 - X^3 = X^3(X - 1)$ dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}[X]$, la racine $0$ est de multiplicité $3$ et la racine $1$ de multiplicité $1$, ce qui fait en tout le degré $4$. On le voit par le point (ii) de {{pol-racines|Racines}} : $P = X^3\,Q$ avec $Q = X - 1$ et $Q(0) = -1 \neq 0$.
    - |
      La somme des multiplicités peut être strictement inférieure au degré. Sur $\mathbb Z$, le polynôme $(X^2 + 1)(X - 1)$, de degré $3$, n'a que la racine $1$, simple, puisque $a^2 + 1 \geqslant 1$ pour tout entier $a$. Sur $\lex{anneau-zn}{\mathbb Z/5\mathbb Z}$, le même polynôme a trois racines simples, $\overline 1$, $\overline 2$ et $\overline 3$, et la somme atteint le degré.
    - |
      Changer d'anneau peut changer la multiplicité. Sur $\mathbb Z$, $X^3 - 3X + 2 = (X - 1)^2(X + 2)$ a la racine double $1$, puisque $Q = X + 2$ vaut $3$ en $1$. Sur $\mathbb Z/3\mathbb Z$, où $\overline 3 = \overline 0$, le même facteur $Q$ s'annule en $\overline 1$, et le polynôme devient $(X - \overline 1)^3$ : la racine $\overline 1$ y est triple.

  derivee-formelle:
    - |
      La dérivée formelle se calcule terme à terme : $(X^5 + 3X^2 - 1)' = 5X^4 + 6X$. La règle du produit se vérifie sur $X^5 = X^2 \cdot X^3$, puisque $2X \cdot X^3 + X^2 \cdot 3X^2 = 5X^4$.
    - |
      Sur $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, seuls les polynômes constants ont une dérivée nulle, puisque $k\,a_k = 0$ impose $a_k = 0$ pour $k \geqslant 1$ dans l'anneau intègre $\mathbb Z$, où $k \neq 0$. Sur $\lex{anneau-zn}{\mathbb Z/3\mathbb Z}$, c'est faux : $(X^3)' = \overline 3X^2 = 0$, et $(X^6 + X^3 + \overline 1)' = \overline 6X^5 + \overline 3X^2 = 0$, sans que ces polynômes soient constants.
    - |
      La dérivée détecte les racines multiples sans factoriser. Pour $P = X^4 - 2X^2 + 1$, la dérivée $P' = 4X^3 - 4X$ s'annule, comme $P$, en $1$ et en $-1$, qui sont donc des [[racine-multiple|racines multiples]] ({{pol-derivee|Dérivée formelle}}, (ii)) ; elle s'annule aussi en $0$, qui n'est pas racine de $P$. Plus loin, la dérivée formelle d'un polynôme réel sera la dérivée de sa fonction polynomiale ({{ar-deriv|Dérivabilité}}).

  coefficient-binomial:
    - |
      La relation de Pascal donne $\binom 52 = \binom 41 + \binom 42 = 4 + 6 = 10$, et l'ensemble $\{a, b, c, d, e\}$ a bien dix parties à deux éléments ({{pol-binome|Binôme de Newton}}, (v)). On retrouve même la décomposition de la preuve : quatre de ces parties contiennent $a$, et les six autres sont les parties à deux éléments de $\{b, c, d, e\}$.
    - |
      Pour $p$ premier, $p$ divise $\binom pk$ dès que $0 < k < p$ : la ligne $7$ du triangle est $1, 7, 21, 35, 35, 21, 7, 1$. Pour un indice composé, la divisibilité tombe : $\binom 93 = 84$ n'est pas multiple de $9$, puisque $84 = 9 \cdot 9 + 3$.
    - |
      En faisant $a = 1$ et $b = -1$ dans le binôme, on trouve $\sum_k (-1)^k\binom nk = 0$ pour $n \geqslant 1$ : un [[ensemble-fini|ensemble fini]] non vide a autant de parties de cardinal pair que de parties de cardinal impair. Pour $\{a, b, c\}$, il y en a quatre de chaque sorte, $1 + 3$ d'un côté et $3 + 1$ de l'autre.

  polynome-primitif:
    - |
      Le polynôme $6X^2 + 10X + 15$ est primitif, bien que ses coefficients ne soient pas deux à deux [[premiers-entre-eux|premiers entre eux]] : l'idéal qu'ils engendrent contient $15 - 10 = 5$, puis $6 - 5 = 1$. En revanche, $4X^2 + 6$ n'est pas primitif, puisque son [[contenu-polynome|contenu]] vaut $2$.
    - |
      Le produit de deux polynômes primitifs est primitif ({{pol-gauss|Lemme de Gauss}}, (ii)) : $(2X + 3)(3X + 2) = 6X^2 + 13X + 6$ a pour contenu $1$, puisque $13 - 2 \cdot 6 = 1$. La somme, elle, ne l'est pas toujours : $(X + 1) + (X - 1) = 2X$ est de contenu $2$.
    - |
      Un polynôme non nul est primitif si et seulement si aucune de ses [[reduction-modulo-p|réductions modulo]] un nombre premier n'est nulle. Un contenu $c \geqslant 2$ a un facteur premier $p$, qui divise tous les coefficients ({{z-premiers|Nombres premiers}}, (ii)) ; inversement, si la réduction modulo $p$ est nulle, $p$ divise tous les coefficients, donc le contenu, qui n'est pas $1$. Pour $6X^2 + 10X + 15$, les réductions modulo $2$, $3$ et $5$ valent $\overline 1$, $X$ et $X^2$, et tout autre nombre premier, qui ne divise pas $6$, donne une réduction de degré $2$.

  ensemble-entiers-relatifs:
    - |
      Un entier relatif est une classe de couples d'entiers naturels, et l'addition se calcule sur des représentants quelconques. Les couples $(3, 5)$, $(0, 2)$ et $(7, 9)$ sont équivalents, puisque $3 + 2 = 5 + 0$ et $3 + 9 = 5 + 7$ : ils représentent $-2$. En ajoutant $(4, 1)$, qui représente $3$, on obtient $(7, 6)$ ou $(4, 3)$ selon le représentant choisi, deux couples équivalents à $(1, 0)$ : on a bien $-2 + 3 = 1$.
    - |
      La [[element-regulier|régularité]] de tous les éléments est nécessaire à la construction. Sur le monoïde commutatif $\{0, 1\}$ muni de $\max$, de neutre $0$, l'élément $1$ n'est pas régulier, puisque $\max(1, 0) = \max(1, 1)$. La relation « $\max(a, d) = \max(b, c)$ » y relie $(0, 0)$ à $(1, 1)$ et $(1, 1)$ à $(1, 0)$, mais pas $(0, 0)$ à $(1, 0)$ : elle n'est pas [[relation-transitive|transitive]], et le quotient n'est pas défini.
    - |
      Dans $\mathbb Z$, toute équation $x + a = b$ a une unique solution, $x = b - a$, alors que l'équation $x + 5 = 3$ n'en a pas dans $\lex{ensemble-entiers-naturels}{\mathbb N}$, puisque $x + 5 \geqslant 5$. Sa solution dans $\mathbb Z$ est la classe de $(3, 5)$, car $(3, 5) + (5, 0) = (8, 5) \sim (3, 0)$, et elle s'écrit $-2$, comme le prévoit le théorème. Plus loin, $\mathbb Z$ recevra une multiplication qui en fait un anneau intègre ({{z-anneau|Anneau ℤ}}).

  anneau-zn:
    - |
      L'anneau $\mathbb Z/6\mathbb Z$ n'est pas intègre, conformément au théorème, puisque $6$ n'est pas premier : $\overline 2 \cdot \overline 3 = \overline 6 = \overline 0$. Ses seuls éléments inversibles sont $\overline 1$ et $\overline 5$, ce dernier étant son propre inverse car $5 \cdot 5 = 25 = 4 \cdot 6 + 1$. Les classes $\overline 2$, $\overline 3$ et $\overline 4$ sont des diviseurs de zéro, c'est-à-dire des éléments non nuls dont le produit par un élément non nul est nul : $\overline 2 \cdot \overline 3 = \overline 4 \cdot \overline 3 = \overline 0$.
    - |
      L'anneau $\mathbb Z/5\mathbb Z$ est un [[corps]], et ses inverses se lisent sur la table de multiplication :
      $$\overline 1 \cdot \overline 1 = \overline 1, \quad \overline 2 \cdot \overline 3 = \overline 1, \quad \overline 4 \cdot \overline 4 = \overline 1,$$
      puisque $6 = 5 + 1$ et $16 = 3 \cdot 5 + 1$. On y a $\overline 2^2 = \overline{-1}$ : l'équation $x^2 + \overline 1 = \overline 0$, sans solution parmi les entiers, en a deux dans $\mathbb Z/5\mathbb Z$, à savoir $\overline 2$ et $\overline 3$.
    - |
      Le cas $n = 1$ est un cas limite : $\mathbb Z/1\mathbb Z$ n'a qu'un élément, de sorte que $\overline 1 = \overline 0$, et c'est l'anneau nul. Ce n'est pas un corps, dont la définition exige $1 \neq 0$, et ce n'est pas une contradiction avec le théorème, puisque $1$ n'est pas premier.

  valeur-absolue:
    - |
      On a $|-3| = |3| = 3$, et plus généralement $|x|$ est le plus grand des deux entiers $x$ et $-x$, puisque l'un des deux est positif et l'autre négatif. Il en découle que $|x| = |y|$ si et seulement si $y = x$ ou $y = -x$ : la valeur absolue oublie le signe, et seulement lui.
    - |
      L'inégalité $|x + y| \leqslant |x| + |y|$ ({{z-ordre|L'ordre de ℤ}}, (iii)) peut être stricte : pour $x = 2$ et $y = -3$, on trouve $|x + y| = 1$, alors que $|x| + |y| = 5$. Il y a égalité exactement quand $xy \geqslant 0$. Si $x$ et $y$ sont de même signe, $x + y$ l'est aussi, et l'égalité est immédiate. Si $x > 0 > y$, alors $y < x + y < x$, d'où $|x + y| < \max(|x|, |y|) < |x| + |y|$ ; le cas $y > 0 > x$ s'en déduit en échangeant $x$ et $y$. Dès que les signes diffèrent, une partie de chaque terme compense l'autre.
    - |
      La même inégalité donne une borne inférieure. En écrivant $x = (x - y) + y$, on obtient $|x| \leqslant |x - y| + |y|$, et de même en échangeant $x$ et $y$, d'où
      $$\big|\,|x| - |y|\,\big| \leqslant |x - y|.$$
      Pour $x = 2$ et $y = -3$, cela donne $1 \leqslant 5$. En revanche, l'inégalité $|x - y| \leqslant |x| - |y|$ est fausse dès que $y$ est de signe contraire à $x$ : ici, elle donnerait $5 \leqslant -1$.

  premiers-entre-eux:
    - |
      Une relation de Bézout est un certificat : $35 \cdot (-1) + 18 \cdot 2 = 1$ prouve que $35$ et $18$ sont premiers entre eux, sans qu'il faille les factoriser. Deux entiers consécutifs le sont toujours, par $(n + 1) \cdot 1 + n \cdot (-1) = 1$, et de même $2n + 1$ et $3n + 1$, par $3(2n + 1) - 2(3n + 1) = 1$.
    - |
      Le lemme de Gauss ({{z-bezout|PGCD, Bézout}}, (iii)) demande que $a$ et $b$ soient premiers entre eux. Pour $a = 6$, $b = 4$ et $c = 3$, on a $6 \mid 12 = bc$, mais $6$ ne divise pas $3$ : ici $6 \wedge 4 = 2$, et le facteur $2$ de $6$ est absorbé par $b$, non par $c$.
    - |
      Être premiers entre eux est une propriété du couple, non de chacun des deux nombres : $4$ et $9$ le sont, puisque $4 \cdot (-2) + 9 \cdot 1 = 1$, alors que ni $4$ et $6$, ni $9$ et $6$ ne le sont, $2$ divisant les deux premiers et $3$ les deux autres. Et $0$ n'est premier qu'avec $1$ et $-1$, puisque $0 \wedge b = |b|$. Plus loin, une relation $au + nv = 1$ fournira l'inverse de la classe de $a$ modulo $n$ ({{z-zn|ℤ/nℤ}}) : ici $4 \cdot 7 = 28 = 3 \cdot 9 + 1$, avec $7 = -2 + 9$.

  fonction-polynomiale:
    - |
      Sur un anneau fini, des polynômes distincts ont souvent la même fonction. Sur $\lex{anneau-zn}{\mathbb Z/3\mathbb Z}$, $X^3$ et $X$ prennent les mêmes valeurs, puisque $0^3 = 0$, $1^3 = 1$ et $2^3 = 8 = 2 + 6$ ; la fonction polynomiale du polynôme non nul $X^3 - X$ est donc nulle. Il ne pouvait en être autrement : il n'y a que $3^3 = 27$ applications de $\mathbb Z/3\mathbb Z$ dans lui-même, et une infinité de polynômes.
    - |
      La fonction polynomiale respecte la somme et le produit, par le point (i) de {{pol-evaluation|Évaluation}}, et transporte les factorisations. Sur $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, la fonction de $X^2 + X = X(X + 1)$ ne prend que des valeurs paires, comme produit de deux entiers consécutifs. Pourtant $X^2 + X$ n'est pas le double d'un polynôme de $\mathbb Z[X]$, puisque son [[coefficient-dominant|coefficient dominant]] vaut $1$ : une propriété des valeurs n'est pas une propriété des coefficients.
    - |
      Sur $\mathbb Z$, les polynômes $X^3$ et $X$ ont des fonctions qui coïncident en $-1$, $0$ et $1$, mais pas en $2$, puisque $2^3 = 8$. Plus loin, on verra qu'un polynôme non nul de degré $d$ a au plus $d$ racines sur un anneau intègre, et que, sur un anneau intègre infini comme $\mathbb Z$, la fonction polynomiale détermine le polynôme ({{pol-racines|Racines}}, (iii) et (iv)).

  polynome-unitaire:
    - |
      Un polynôme dont le [[coefficient-dominant|coefficient dominant]] est inversible est le produit d'une constante inversible par un polynôme unitaire. Dans $(\lex{anneau-zn}{\mathbb Z/3\mathbb Z})[X]$, on a $\overline 2X + \overline 1 = \overline 2(X + \overline 2)$, puisque $\overline 2 \cdot \overline 2 = \overline 1$. Dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}[X]$, au contraire, $2X + 1$ ne s'écrit pas $c\,(X + b)$, puisque $c = 2$ imposerait $2b = 1$.
    - |
      Le produit de deux polynômes unitaires est unitaire, de degré la somme des degrés, même sans intégrité ({{pol-anneau|Anneau A[X]}}, (ii)) : dans $(\mathbb Z/6\mathbb Z)[X]$, $(X + \overline 2)(X + \overline 3) = X^2 + \overline 5X$, de degré $2$. Sans l'hypothèse unitaire, le degré peut chuter, comme dans $(\overline 2X + \overline 1)(\overline 3X + \overline 1) = \overline 5X + \overline 1$.
    - |
      La somme de deux polynômes unitaires de même degré n'est pas unitaire : $(X + 1) + (X + 2) = 2X + 3$ dans $\mathbb Z[X]$, et, dans $(\mathbb Z/2\mathbb Z)[X]$, $(X + \overline 1) + X = \overline 1$ perd même son degré. Plus loin, on verra que la division par un polynôme unitaire est possible sur n'importe quel anneau commutatif ({{pol-division|Division des polynômes}}).

  coefficient-dominant:
    - |
      Sur un anneau intègre, le coefficient dominant d'un produit est le produit des coefficients dominants. Dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}[X]$, celui de $(2X + 1)(3X - 1) = 6X^2 + X - 1$ est $6 = 2 \cdot 3$ ; il ne dépend que des termes de plus haut degré des deux facteurs.
    - |
      Sur un anneau qui a des diviseurs de zéro, le produit des coefficients dominants peut être nul, et le coefficient dominant du produit est alors un tout autre coefficient. Dans $(\lex{anneau-zn}{\mathbb Z/4\mathbb Z})[X]$, on trouve
      $$\begin{aligned} (\overline 2X + \overline 1)(\overline 2X + \overline 3) &= \overline 4X^2 + \overline 8X + \overline 3 \\ &= \overline 3, \end{aligned}$$
      de coefficient dominant $\overline 3$, sans rapport avec $\overline 2 \cdot \overline 2 = \overline 0$.
    - |
      Plus loin, c'est l'inversibilité du coefficient dominant du diviseur qui rendra possible la division euclidienne ({{pol-division|Division des polynômes}}). On ne peut pas diviser $X^2$ par $3X + 1$ dans $\mathbb Z[X]$, un quotient de degré $1$ ayant un coefficient dominant $q$ tel que $3q = 1$. On le peut dans $(\mathbb Z/5\mathbb Z)[X]$, où $\overline 3 \cdot \overline 2 = \overline 1$ : $X^2 = (\overline 3X + \overline 1)(\overline 2X + \overline 1) + \overline 4$.

  degre-polynome:
    - |
      Le degré d'une somme peut chuter. Pour $P = X^2 + X$ et $Q = -X^2 + 1$, tous deux de degré $2$, la somme $X + 1$ est de degré $1$, les termes dominants se compensant. C'est pourquoi les polynômes de degré au plus $n$ forment un sous-groupe additif de $\lex{anneau-polynomes}{A[X]}$, alors que ceux de degré exactement $n$ ne sont pas même stables par addition.
    - |
      La formule $\deg(PQ) = \deg P + \deg Q$ demande l'intégrité. Dans $(\lex{anneau-zn}{\mathbb Z/6\mathbb Z})[X]$, on trouve
      $$\begin{aligned} &(\overline 2X^2 + \overline 1)(\overline 3X + \overline 1) \\ &\quad = \overline 6X^3 + \overline 2X^2 + \overline 3X + \overline 1 \\ &\quad = \overline 2X^2 + \overline 3X + \overline 1, \end{aligned}$$
      de degré $2$ et non $3$, parce que le produit $\overline 2 \cdot \overline 3$ des [[coefficient-dominant|coefficients dominants]] est nul.
    - |
      La convention $\deg 0 = -\infty$ est la seule qui conserve la formule des degrés pour le polynôme nul sur un anneau intègre. Aucune valeur entière $d$ ne conviendrait : l'égalité $0 \cdot X = 0$ donnerait $d + 1 = d$. Avec $-\infty$, les deux membres valent $-\infty$, puisque $-\infty + 1 = -\infty$.

  polynome-constant:
    - |
      Sur un anneau intègre, les polynômes inversibles sont des constantes ({{pol-anneau|Anneau A[X]}}, (iii)) : les inversibles de $\lex{ensemble-entiers-relatifs}{\mathbb Z}[X]$ sont $1$ et $-1$. En particulier, $1 + X$ n'est pas inversible, bien que son terme constant le soit.
    - |
      Hors des anneaux intègres, un polynôme non constant peut être inversible. Dans $(\lex{anneau-zn}{\mathbb Z/9\mathbb Z})[X]$, on a $(\overline 1 + \overline 3X)(\overline 1 - \overline 3X) = \overline 1 - \overline 9X^2 = \overline 1$, de sorte que $\overline 1 + \overline 3X$, de degré $1$, est inversible.
    - |
      Plus loin, le théorème de d'Alembert-Gauss affirmera que tout polynôme non constant de $\mathbb C[X]$ a une racine ({{c-dalembert|D'Alembert-Gauss}}), et l'on verra alors que l'hypothèse est nécessaire : évalué en n'importe quel point, un polynôme constant non nul $c$ vaut $c$ et ne s'annule jamais, tandis que le polynôme nul, constant lui aussi, s'annule partout.

  relation-pascal:
    - |
      La relation de Pascal calcule une ligne du triangle à partir de la précédente. De la ligne $1, 4, 6, 4, 1$, on tire $1, 5, 10, 10, 5, 1$, puisque $1 + 4 = 5$ et $4 + 6 = 10$, et le binôme de Newton donne
      $$\begin{aligned} (a + b)^5 &= a^5 + 5a^4b + 10a^3b^2 \\ &\quad + 10a^2b^3 + 5ab^4 + b^5. \end{aligned}$$
    - |
      Par récurrence, la relation de Pascal donne $\sum_k \binom nk = 2^n$ : en sommant la ligne $n + 1$, chaque coefficient de la ligne $n$ est compté deux fois, une fois dans chacun des deux nombres qu'il surmonte. Par le dénombrement de {{pol-binome|Binôme de Newton}}, (v), cela redit qu'un ensemble à $n$ éléments a $2^n$ parties.
    - |
      Réduite modulo $2$, la relation de Pascal devient une règle de parité : un coefficient est impair si et seulement si un seul des deux coefficients qui le surmontent l'est. La ligne $4$ est $1, 0, 0, 0, 1$ modulo $2$, ce qui redit $(X + 1)^4 = X^4 + \overline 1$ dans $(\lex{anneau-zn}{\mathbb Z/2\mathbb Z})[X]$.

      ```schema lex-relation-pascal-3
      Les lignes $n = 0$ à $15$ du triangle, avec un point rouge pour chaque coefficient impair et un point gris, plus petit, pour chaque coefficient pair. Les lignes $1$, $2$, $4$ et $8$, numérotées à gauche, n'ont d'impairs qu'à leurs extrémités, et les seize lignes reproduisent trois fois le motif des huit premières.
      ```

  divisibilite-polynomes:
    - |
      Pour tout $n \geqslant 1$, $X - 1$ divise $X^n - 1$, puisque $(X - 1)(X^{n-1} + \cdots + X + 1) = X^n - 1$, les termes intermédiaires du développement se détruisant deux à deux. Dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}[X]$, de même, $X + 1$ divise $X^3 + 1$, et $X^2 + X + 1$ divise $X^4 + X^2 + 1 = (X^2 + X + 1)(X^2 - X + 1)$.
    - |
      Sur un anneau intègre, un diviseur d'un polynôme non nul $P$ est de [[degre-polynome|degré]] au plus $\deg P$, par l'additivité des degrés ({{pol-anneau|Anneau A[X]}}, (iii)). Sans intégrité, c'est faux : dans $(\lex{anneau-zn}{\mathbb Z/4\mathbb Z})[X]$, le polynôme $\overline 2X + \overline 1$, de degré $1$, divise le polynôme constant $\overline 1$, car $(\overline 2X + \overline 1)^2 = \overline 4X^2 + \overline 4X + \overline 1 = \overline 1$.
    - |
      La divisibilité dépend de l'anneau des coefficients. Dans $\mathbb Z[X]$, $2X + 2$ ne divise pas $X + 1$, puisqu'un quotient serait une constante $c$ telle que $2c = 1$. Dans $(\mathbb Z/3\mathbb Z)[X]$, au contraire, $\overline 2 \cdot (\overline 2X + \overline 2) = X + \overline 1$, puisque $\overline 4 = \overline 1$, et les deux polynômes se divisent l'un l'autre.

  evaluation-polynome:
    - |
      Évaluer le long de la projection $\mathbb Z \to \lex{anneau-zn}{\mathbb Z/3\mathbb Z}$, c'est calculer modulo $3$ : pour $P = X^2 + 1$ et un entier $a$, $P(\overline a)$ est la classe de $P(a)$, les deux membres étant les images de $P$ par deux morphismes d'anneaux qui envoient $X$ sur $\overline a$ ({{pol-evaluation|Évaluation}}, (i)). Comme $P$ vaut $\overline 1$, $\overline 2$ et $\overline 2$ en $\overline 0$, $\overline 1$ et $\overline 2$, aucun entier $a$ ne rend $a^2 + 1$ multiple de $3$.
    - |
      Évaluer en un polynôme, c'est substituer. Dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}[X]$, l'évaluation de $P = X^2 - 2X + 1$ en $X + 1$ donne
      $$\begin{aligned} P(X + 1) &= (X + 1)^2 - 2(X + 1) + 1 \\ &= X^2 : \end{aligned}$$
      la substitution envoie $P = (X - 1)^2$ sur $X^2$, sans changer le degré ni le [[coefficient-dominant|coefficient dominant]], comme le prévoit le point (ii), et la substitution inverse, $X \mapsto X - 1$, ramène $X^2$ à $P$.
    - |
      Un morphisme d'anneaux issu de $\mathbb Z[X]$ est déterminé par l'image de $X$. Celui qui envoie $X$ sur $\overline 2 \in \mathbb Z/5\mathbb Z$ annule $X^2 + 1$, puisque $2^2 + 1 = 5$, donc tout l'idéal que ce polynôme engendre. Plus loin, le même geste fera de $\mathbb R[X]/(X^2 + 1)$ un corps où la classe de $X$ est une racine de $X^2 + 1$ ({{c-construction|Construction de ℂ}}).

  contenu-polynome:
    - |
      Le contenu de $12X^3 - 18X + 30$ est $6$, et l'on écrit $12X^3 - 18X + 30 = 6\,(2X^3 - 3X + 5)$, où le second facteur est [[polynome-primitif|primitif]] ({{pol-gauss|Lemme de Gauss}}, (i)). Le contenu se calcule comme un [[pgcd|PGCD]] de plusieurs entiers, ici $12 \wedge 18 \wedge 30$, les coefficients nuls n'y changeant rien.
    - |
      Le contenu est multiplicatif : $(2X + 4)(3X + 9) = 6X^2 + 30X + 36 = 6\,(X^2 + 5X + 6)$ a pour contenu $6 = 2 \cdot 3$, produit des contenus des facteurs. Il n'a pas de règle analogue pour la somme : $2X$ et $3X$ ont pour somme $5X$, de contenu $5$, alors que $2X$ et $3$, de mêmes contenus, ont une somme de contenu $1$.
    - |
      Pour un polynôme à coefficients dans le corps $F$ des fractions de $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, le point (iii) de {{pol-gauss|Lemme de Gauss}} sépare de même une constante et un polynôme primitif : $\frac12 X^2 + \frac13 = \frac16\,(3X^2 + 2)$. Plus loin, $F$ sera le corps $\mathbb Q$ des rationnels ({{q-construction|Construction de ℚ}}).

  reduction-modulo-p:
    - |
      La réduction modulo $p$ remplace chaque coefficient par sa classe, et elle peut faire baisser le degré. Pour $P = 3X^2 + 5X - 2$, on obtient $X^2 + X$ modulo $2$, mais $\overline 2X + \overline 1$ modulo $3$, le coefficient dominant $3$ s'annulant.
    - |
      Comme $\pi$ est un morphisme d'anneaux, l'évaluation de $\pi(P)$ en $\overline a$ est la classe de $P(a)$, par l'unicité de {{pol-evaluation|Évaluation}}, (i) ; si $P(a) = 0$ pour un entier $a$, alors $\pi(P)(\overline a) = \overline 0$. Ainsi $X^3 + X + 1$ ne s'annule en aucun entier, puisque sa réduction modulo $2$ vaut $\overline 1$ en $\overline 0$ comme en $\overline 1$.
    - |
      La réciproque est fausse : la réduction modulo $5$ de $X^2 + 1$ s'annule en $\overline 2$ et en $\overline 3$, alors que $a^2 + 1 \geqslant 1$ pour tout entier $a$. Une réduction peut prouver qu'un polynôme ne s'annule en aucun entier, jamais qu'il s'annule en l'un d'eux. Plus loin, le critère d'Eisenstein tirera de la réduction modulo $p$ des conclusions d'irréductibilité ({{pol-eisenstein|Eisenstein}}).

  polynomes-associes:
    - |
      Sur $\lex{anneau-zn}{\mathbb Z/5\mathbb Z}$, $\overline 2X + \overline 1$ et $X + \overline 3$ sont associés, car $\overline 3\,(\overline 2X + \overline 1) = \overline 6X + \overline 3 = X + \overline 3$. Tout polynôme non nul est associé à un unique polynôme [[polynome-unitaire|unitaire]], obtenu en le divisant par son [[coefficient-dominant|coefficient dominant]] : si $cP$ et $c'P$ sont unitaires, alors $c$ et $c'$ sont tous deux l'inverse de ce coefficient.
    - |
      Le corps est indispensable à l'équivalence entre « associés » et « se divisent l'un l'autre ». Dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}[X]$, on a $2X + 2 = 2\,(X + 1)$, produit de $X + 1$ par une constante non nulle, mais $2X + 2$ ne divise pas $X + 1$, puisqu'un quotient serait une constante $c$ telle que $2c = 1$. La constante $2$ n'est pas inversible dans $\mathbb Z$.
    - |
      Plus loin, la factorisation en polynômes irréductibles sera unique à l'ordre près, une fois chaque facteur remplacé par l'associé unitaire ({{pol-irreductibles|Irréductibles}}, (ii)) ; sans cette normalisation, elle ne l'est qu'à associés près. Dans $(\mathbb Z/5\mathbb Z)[X]$, on a $X^2 + \overline 1 = (\overline 2X + \overline 1)(\overline 3X + \overline 1) = (X - \overline 2)(X - \overline 3)$, et les facteurs se correspondent, puisque $\overline 2X + \overline 1 = \overline 2\,(X - \overline 2)$ et $\overline 3X + \overline 1 = \overline 3\,(X - \overline 3)$.

  racine-simple:
    - |
      Sur $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, $X^3 - X = X(X - 1)(X + 1)$ a trois racines simples, $0$, $1$ et $-1$, tandis que $X^3 - X^2 = X^2(X - 1)$ a la racine simple $1$ et la [[racine-multiple|racine double]] $0$. La racine $1$ est simple par le point (ii) de {{pol-racines|Racines}}, puisque $X^3 - X^2 = (X - 1)\,Q$ avec $Q = X^2$ et $Q(1) = 1 \neq 0$.
    - |
      Une racine simple peut devenir multiple quand on change d'anneau. Sur $\lex{anneau-zn}{\mathbb Z/5\mathbb Z}$, $X^2 + \overline 1 = (X - \overline 2)(X - \overline 3)$ a deux racines simples, $\overline 2$ et $\overline 3$, puisque $\overline 2 - \overline 3 \neq \overline 0$. Sur $\mathbb Z/2\mathbb Z$, le même polynôme s'écrit $(X + \overline 1)^2$ et n'a que la racine $\overline 1$, double.
    - |
      Plus loin, on verra qu'une racine est simple si et seulement si elle n'annule pas la dérivée ({{pol-derivee|Dérivée formelle}}, (ii)). Pour $X^3 - X^2$, la dérivée $3X^2 - 2X$ vaut $1$ en $1$, racine simple, et $0$ en $0$, racine double.

  racine-multiple:
    - |
      Sur $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, $X^4 - 2X^2 + 1 = (X^2 - 1)^2 = (X - 1)^2(X + 1)^2$ a deux racines doubles, $1$ et $-1$, dont les [[multiplicite-racine|multiplicités]] remplissent le degré $4$.
    - |
      Sur un anneau qui n'est pas intègre, les multiplicités peuvent dépasser le degré. Dans $(\lex{anneau-zn}{\mathbb Z/4\mathbb Z})[X]$, on a $(X - \overline 2)^2 = X^2 - \overline 4X + \overline 4 = X^2$ : les racines $\overline 0$ et $\overline 2$ de $X^2$ sont toutes deux doubles, et la somme $4$ des multiplicités dépasse le degré $2$, ce que le point (iii) de {{pol-racines|Racines}} interdit sur un anneau intègre.
    - |
      Sur $\mathbb Z/3\mathbb Z$, $X^3 - \overline 1 = (X - \overline 1)^3$, puisque $(X - 1)^3 = X^3 - 3X^2 + 3X - 1$ et que $\overline 3 = \overline 0$ : la racine $\overline 1$ est triple. Sur $\mathbb Z$, au contraire, $X^3 - 1 = (X - 1)(X^2 + X + 1)$ n'a que la racine simple $1$, le second facteur valant $3$ en $1$. Plus loin, la dérivée détectera les racines multiples ({{pol-derivee|Dérivée formelle}}, (ii)) ; celle de $X^3 - \overline 1$ est ici nulle.

  polynome-scinde:
    - |
      Sur $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, le polynôme $X^3 - 3X + 2 = (X - 1)^2(X + 2)$ est scindé, une même racine pouvant figurer plusieurs fois, et $2X^2 - 2 = 2(X - 1)(X + 1)$ aussi, avec $c = 2$. En revanche, $X^2 + 1$ ne l'est pas, faute de [[racine-polynome|racine]] dans $\mathbb Z$, alors qu'il s'écrit $(X - \overline 2)(X - \overline 3)$ sur $\lex{anneau-zn}{\mathbb Z/5\mathbb Z}$.
    - |
      Quand l'anneau n'est pas intègre, l'écriture scindée n'est pas unique. Dans $(\mathbb Z/8\mathbb Z)[X]$, on a $X^2 - \overline 1 = (X - \overline 1)(X + \overline 1) = (X - \overline 3)(X - \overline 5)$, puisque $\overline 3 + \overline 5 = \overline 0$ et $\overline 3 \cdot \overline 5 = \overline{15} = -\overline 1$. Sur un anneau intègre, au contraire, les $\alpha_i$ sont exactement les racines, puisque $c\prod_i (a - \alpha_i) = 0$, avec $c \neq 0$, force $a$ à être l'un des $\alpha_i$.
    - |
      Sur $\mathbb Z/2\mathbb Z$, le polynôme $X^2 + \overline 1 = (X + \overline 1)^2$ est scindé, mais $X^2 + X + \overline 1$ ne l'est pas : il vaut $\overline 1$ en $\overline 0$ comme en $\overline 1$, et n'a donc aucune racine. Plus loin, sur $\mathbb C$, tout polynôme non constant sera scindé ({{c-dalembert|D'Alembert-Gauss}}).

  frobenius:
    - |
      Sur $\lex{anneau-zn}{\mathbb Z/5\mathbb Z}$, le Frobenius $x \mapsto x^5$ respecte la somme : $(\overline 2 + \overline 4)^5 = \overline 1^5 = \overline 1$, et $\overline 2^5 + \overline 4^5 = \overline{32} + \overline{1024} = \overline{1056} = \overline 1$. Calculé sur les cinq classes, $x^5$ vaut $x$ : le Frobenius de $\mathbb Z/5\mathbb Z$ est l'identité.
    - |
      L'hypothèse $p \cdot 1 = 0$ est indispensable. Dans $\mathbb Z/4\mathbb Z$, où $2 \cdot \overline 1 = \overline 2 \neq \overline 0$, l'application $x \mapsto x^2$ n'est pas additive : $(\overline 1 + \overline 1)^2 = \overline 4 = \overline 0$, alors que $\overline 1^2 + \overline 1^2 = \overline 2$. Dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ non plus, puisque $(1 + 1)^2 = 4 \neq 2$.
    - |
      Sur $(\mathbb Z/2\mathbb Z)[X]$, le Frobenius double les exposants : comme $a^2 = a$ pour $a \in \mathbb Z/2\mathbb Z$, on a $\big(\sum_k a_kX^k\big)^2 = \sum_k a_kX^{2k}$, et par exemple $(X^2 + X + \overline 1)^2 = X^4 + X^2 + \overline 1$. Il est injectif, puisque $P^2 = Q^2$ donne $(P - Q)^2 = 0$, l'anneau étant intègre, mais pas surjectif, $X$ n'étant pas un carré. Plus loin, sur un corps fini, il sera bijectif ({{gs-corps-finis|Corps finis}}).

  congruence:
    - |
      Les congruences se multiplient : de $10 \equiv 1 \pmod 9$, on tire $10^k \equiv 1$, de sorte qu'un entier est congru modulo $9$ à la somme de ses chiffres décimaux. Ainsi $2026 \equiv 2 + 0 + 2 + 6 = 10 \equiv 1 \pmod 9$, et en effet $2026 = 9 \cdot 225 + 1$.
    - |
      On ne peut pas simplifier une congruence par un facteur commun quelconque : $2 \cdot 3 \equiv 2 \cdot 0 \pmod 6$, mais $3 \not\equiv 0 \pmod 6$. La simplification par $c$ est permise quand $c \wedge n = 1$ : si $n$ divise $c(a - b)$, le lemme de Gauss ({{z-bezout|PGCD, Bézout}}, (iii)) donne $n \mid a - b$.
    - |
      Les carrés modulo $4$ sont $\overline 0$ et $\overline 1$, puisque $0^2 = 0$, $1^2 = 1$, $2^2 = 4$ et $3^2 = 9 = 2 \cdot 4 + 1$. Une somme de deux carrés est donc congrue à $0$, $1$ ou $2$ modulo $4$, jamais à $3$ : l'entier $2027 = 4 \cdot 506 + 3$ n'est pas la somme de deux carrés d'entiers.

  divisibilite-entiers:
    - |
      Les diviseurs de $12$ dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ sont $\pm 1$, $\pm 2$, $\pm 3$, $\pm 4$, $\pm 6$ et $\pm 12$. Tout entier divise $0$, puisque $0 = a \cdot 0$, mais $0$ ne divise que $0$, puisque $b = 0 \cdot c$ impose $b = 0$.
    - |
      La divisibilité est [[relation-reflexive|réflexive]] et [[relation-transitive|transitive]], mais elle n'est pas [[relation-antisymetrique|antisymétrique]] sur $\mathbb Z$ : $3 \mid -3$ et $-3 \mid 3$, avec $3 \neq -3$. Ce n'est donc pas une [[relation-ordre|relation d'ordre]] sur $\mathbb Z$. C'en est une sur $\lex{ensemble-entiers-naturels}{\mathbb N}$ : si $b = ac$ et $a = bd$, le cas $a = 0$ donne $b = 0 = a$, et si $a \neq 0$, alors $cd = 1$, donc $|c|\,|d| = 1$ et $c = \pm 1$, puis $c = 1$ puisque $a$ et $b$ sont positifs.
    - |
      Si $a$ divise $b$ et $c$, il divise toute combinaison $bu + cv$ : de $7 \mid 21$ et $7 \mid 35$, on tire $7 \mid 2 \cdot 21 - 35 = 7$. La réciproque est fausse : $3$ divise $1 + 2$ sans diviser ni $1$ ni $2$.

  pgcd-polynomes:
    - |
      L'algorithme d'Euclide s'applique aux polynômes sur un corps $K$. On a $X^3 - 1 = X(X^2 - 1) + (X - 1)$, puis $X^2 - 1 = (X + 1)(X - 1)$, d'où $(X^3 - 1) \wedge (X^2 - 1) = X - 1$ et la relation de Bézout
      $$X - 1 = (X^3 - 1) - X\,(X^2 - 1).$$
    - |
      Le PGCD est choisi [[polynome-unitaire|unitaire]], ce qui le rend unique. Sur $\lex{anneau-zn}{\mathbb Z/5\mathbb Z}$, $\overline 2X + \overline 2$ divise $\overline 2X + \overline 2$ et $X^2 - \overline 1 = (X + \overline 1)(X - \overline 1)$, et tout diviseur commun le divise ; mais le PGCD est $X + \overline 1$, seul générateur unitaire de l'idéal. Sans cette normalisation, il ne serait défini qu'à une constante non nulle près.
    - |
      Plus loin, le PGCD d'un polynôme et de sa dérivée détectera les racines multiples ({{pol-derivee|Dérivée formelle}}). Sur $\mathbb Z/5\mathbb Z$, $P = X^3 + \overline 2X + \overline 2 = (X - \overline 1)^2(X + \overline 2)$ a pour dérivée $P' = \overline 3X^2 + \overline 2 = \overline 3\,(X - \overline 1)(X + \overline 1)$, et $P \wedge P' = X - \overline 1$ fait apparaître la racine double $\overline 1$.

  premiers-entre-eux-polynomes:
    - |
      Sur un corps $K$, les polynômes $X - a$ et $X - b$ sont premiers entre eux dès que $a \neq b$, par la relation de Bézout $(X - a) - (X - b) = b - a$, que l'on divise par la constante non nulle $b - a$. Pour $a = b$, au contraire, leur [[pgcd-polynomes|PGCD]] est $X - a$ lui-même.
    - |
      Sur $\lex{anneau-zn}{\mathbb Z/3\mathbb Z}$, $X^2 + \overline 1$ et $X - \overline 2$ sont premiers entre eux. La division donne $X^2 + \overline 1 = (X - \overline 2)(X + \overline 2) + \overline 2$, d'où la relation de Bézout
      $$\overline 2\,(X^2 + \overline 1) - \overline 2\,(X + \overline 2)(X - \overline 2) = \overline 1.$$
      Sur $\mathbb Z/5\mathbb Z$, en revanche, les polynômes de mêmes coefficients ne sont pas premiers entre eux, puisque $X^2 + \overline 1 = (X - \overline 2)(X + \overline 2)$, et leur PGCD est $X - \overline 2$.
    - |
      Hors d'un corps, l'équivalence avec une relation de Bézout tombe. Dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}[X]$, les seuls diviseurs communs de $2$ et de $X$ sont $1$ et $-1$, un diviseur de $2$ étant une constante qui divise $2$ et $\pm 2$ ne divisant pas $X$. Pourtant aucune relation $2U + XV = 1$ n'existe, puisque le terme constant de $2U + XV$ est pair.

  division-euclidienne-polynomes:
    - |
      Divisons $P = X^3 + 2X + 1$ par $X - 2$ dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}[X]$. L'algorithme retranche $X^2(X - 2)$, puis $2X(X - 2)$, puis $6(X - 2)$, et laisse le reste $13$ :
      $$\begin{aligned} &X^3 + 2X + 1 \\ &\quad = (X - 2)(X^2 + 2X + 6) + 13, \end{aligned}$$
      ce que l'on vérifie en développant, le produit valant $X^3 + 2X - 12$.
    - |
      L'hypothèse sur le [[coefficient-dominant|coefficient dominant]] ne peut pas être omise. Sur $\mathbb Z$, on ne peut pas diviser $X^2 + 1$ par $2X + 1$, puisqu'un quotient serait de degré $1$, de coefficient dominant $q$ tel que $2q = 1$. Sur $\lex{anneau-zn}{\mathbb Z/5\mathbb Z}$, où $\overline 2$ est inversible, la division existe et tombe juste : $X^2 + \overline 1 = (\overline 2X + \overline 1)(\overline 3X + \overline 1)$, car $\overline 6 = \overline 1$ et $\overline 5 = \overline 0$.
    - |
      La condition $\deg R < \deg B$ fait l'unicité. Si l'on se contentait de $\deg R \leqslant \deg B$, la division de $X^2$ par $X$ aurait au moins deux solutions, $X^2 = X \cdot X + 0 = X(X - 1) + X$. Plus loin, on verra que le reste de la division par $X - a$ est la valeur en $a$ ({{pol-racines|Racines}}, (i)) : dans le premier exemple, $13 = 2^3 + 2 \cdot 2 + 1$.

  racine-polynome:
    - |
      L'existence d'une racine dépend de l'anneau. Le polynôme $X^2 + 1$ n'a pas de racine dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, puisque $x^2 + 1 \geqslant 1$ pour tout entier $x$. Il n'en a pas non plus dans $\lex{anneau-zn}{\mathbb Z/3\mathbb Z}$, où les carrés sont $\overline 0$ et $\overline 1$. Il en a deux, en revanche, dans $\mathbb Z/5\mathbb Z$, à savoir $\overline 2$ et $\overline 3$, puisque $2^2 + 1 = 5$ et $3^2 + 1 = 10$ ; il s'y factorise en $(X - \overline 2)(X - \overline 3)$, car $(X - 2)(X - 3) = X^2 - 5X + 6$.
    - |
      Dans $\mathbb Z/6\mathbb Z$, qui n'est pas intègre, le polynôme $X^2 - X$, de degré $2$, a quatre racines : $\overline 0$, $\overline 1$, $\overline 3$ et $\overline 4$, puisque $3 \cdot 2 = 6$ et $4 \cdot 3 = 12$ sont multiples de $6$. Il admet ainsi deux factorisations différentes,
      $$\begin{aligned} X^2 - X &= X(X - \overline 1) \\ &= (X - \overline 3)(X - \overline 4), \end{aligned}$$
      car $\overline 3 + \overline 4 = \overline 1$ et $\overline 3 \cdot \overline 4 = \overline 0$. Sans intégrité, la borne « au plus $d$ racines » tombe, et avec elle l'unicité de la décomposition en facteurs de degré $1$.
    - |
      Plus loin, dans le corps {{q-construction|ℚ}}, qui contient $\mathbb Z$ comme sous-anneau, le polynôme $2X - 1$ aura la racine $\frac12$, alors qu'il n'en a aucune dans $\mathbb Z$, où $2x - 1$ est toujours impair. C'est l'exemple le plus simple d'un polynôme à coefficients dans un anneau qui n'a de racine que dans un anneau plus grand.
