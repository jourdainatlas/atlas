# Exemples du lexique : théorie « Analyse complexe » (anc).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  convergence-uniforme:
    - |
      La suite $f_n(x) = x^n$ converge vers $0$ en tout point de $[0, 1[$, mais pas uniformément : $\sup_{[0, 1[} x^n = 1$ pour tout $n$, puisque $x^n$ tend vers $1$ quand $x$ tend vers $1$. Sur $[0, \frac12]$, en revanche, $\sup x^n = 2^{-n} \to 0$, et la convergence est uniforme. Sur $[0, 1]$, la limite vaut $0$ sur $[0, 1[$ et $1$ en $1$ : elle n'est pas continue, ce qui interdit, par le point (i) de {{cx-convergence-uniforme|Convergence uniforme}}, toute convergence uniforme.
      ```schema lex-convergence-uniforme-1
      Les fonctions $x^n$ sur $[0, 1]$, pour $n = 1, 2, 4, 8, 16$ et $32$, la dernière en rouge. Sur $[0, \frac12]$, chacune reste sous $2^{-n}$, dans le rectangle bleu, et $x^{32}$ s'y confond déjà avec l'axe ; près de $1$, chacune remonte jusqu'à la valeur $1$, et l'écart maximal à la limite ne diminue pas.
      ```
    - |
      Le critère de Weierstrass s'applique sur le disque fermé $|z| \leqslant 1$ à la série $\sum z^n/n^2$, avec $M_n = 1/n^2$ ; la série $\sum 1/n^2$ converge, puisque $\frac1{n^2} \leqslant \frac1{n - 1} - \frac1n$ pour $n \geqslant 2$ et que ces différences se télescopent. La somme est donc continue sur tout le disque fermé, y compris sur le cercle unité, où la série $\sum z^n$ diverge.
    - |
      Sans convergence uniforme, la limite des intégrales peut différer de l'intégrale de la limite. La suite $h_n(x) = n^2 x(1 - x)^n$ tend vers $0$ en tout point de $[0, 1]$, mais
      $$\int_0^1 h_n = \frac{n^2}{(n + 1)(n + 2)} \xrightarrow[n \to +\infty]{} 1.$$
      Le maximum de $h_n$, atteint en $x = \frac1{n + 1}$, tend vers l'infini : la masse se concentre près de $0$ sans disparaître, et la conclusion du point (iii) de {{cx-convergence-uniforme|Convergence uniforme}} tombe.

  serie-entiere:
    - |
      Le rayon de convergence peut prendre toutes les valeurs. Pour $\sum z^n/n!$, la suite $r^n/n!$ est bornée pour tout $r$, et $R = +\infty$. Pour $\sum z^n$, elle l'est pour $r \leqslant 1$ seulement, et $R = 1$. Pour $\sum n!\,z^n$, le rapport $(n + 1)r$ de deux termes consécutifs de $n!\,r^n$ dépasse $2$ dès que $n$ est grand, pour tout $r > 0$ : la suite n'est pas bornée, et $R = 0$.
    - |
      La série $\sum (-1)^n z^{2n}$ est géométrique, de raison $-z^2$ : elle converge pour $|z| < 1$, de somme $\frac{1}{1 + z^2}$, et diverge pour $|z| > 1$, puisque son terme général ne tend pas vers $0$. Sur $\mathbb R$, la fonction $\frac{1}{1 + x^2}$ est définie et dérivable partout, et pourtant sa série diverge dès que $|x| > 1$ ; sur $\mathbb C$, la fonction n'est pas définie en $\pm i$, à distance $1$ de l'origine.
      ```schema lex-serie-entiere-2
      Le disque de convergence de $\sum (-1)^n z^{2n}$, de rayon $1$, en rouge ; sur l'axe réel, la série converge sur le segment bleu $]{-1}, 1[$ seulement. Les points $\pm i$, où $\frac{1}{1 + z^2}$ n'est pas définie, sont sur le cercle de convergence.
      ```
    - |
      Le cercle de convergence peut porter des points de convergence et des points de divergence. La série $\sum_{n \geqslant 1} z^n/n$ a pour rayon $1$. En $z = -1$, elle converge, ses sommes partielles d'indices pairs et impairs formant des [[suites-adjacentes|suites adjacentes]] ; en $z = 1$, elle diverge, puisque $\sum_{N < n \leqslant 2N} \frac1n \geqslant N \cdot \frac{1}{2N} = \frac12$ pour tout $N$, ce qui empêche les sommes partielles d'être de Cauchy.

  holomorphe:
    - |
      Les polynômes sont holomorphes sur $\mathbb C$, et $z \mapsto 1/z$ l'est sur l'[[ouvert]] $\mathbb C \setminus \{0\}$, de dérivée $-1/z^2$ : le calcul de la preuve de {{cx-holomorphe|Dérivabilité complexe}}, (ii), donne directement $\frac{1/z - 1/z_0}{z - z_0} = -\frac{1}{z z_0}$, qui tend vers $-1/z_0^2$. Une fraction rationnelle est holomorphe hors des zéros de son dénominateur.
    - |
      La fonction $f(z) = |z|^2 = x^2 + y^2$ est un polynôme en les parties réelle et imaginaire, et pourtant elle n'est holomorphe sur aucun ouvert. En $z_0 = 0$, le taux $\frac{|h|^2}{h} = \bar h$ tend vers $0$ : $f$ est dérivable au sens complexe en $0$, de dérivée nulle. En $z_0 \neq 0$, le taux $\frac{|z_0 + h|^2 - |z_0|^2}{h}$ tend vers $z_0 + \bar z_0$ pour $h$ réel et vers $\bar z_0 - z_0$ pour $h$ imaginaire pur, deux limites distinctes : $f$ n'est dérivable au sens complexe qu'en un seul point.
    - |
      Être holomorphe ne demande qu'une dérivée, au sens complexe. Plus loin, le théorème {{cx-analytique|Analyticité}} établira que la dérivée d'une fonction holomorphe est encore holomorphe, de sorte qu'une telle fonction est indéfiniment dérivable ; en analyse réelle, $x \mapsto x|x|$ est dérivable une fois sans l'être deux.

  integrale-curviligne:
    - |
      L'intégrale d'une fonction qui n'est pas holomorphe dépend en général du chemin. Pour $f(z) = \bar z$, le segment $\gamma_1(t) = t(1 + i)$, $t \in [0, 1]$, donne $\int_0^1 t(1 - i)(1 + i)\,dt = \int_0^1 2t\,dt = 1$. La ligne brisée $\gamma_2$ qui va de $0$ à $1$, puis de $1$ à $1 + i$, donne
      $$\begin{aligned} &\int_0^1 t\,dt + \int_0^1 (1 - it)\,i\,dt \\ &\quad = \frac12 + \Big(i + \frac12\Big) = 1 + i. \end{aligned}$$
      Les deux chemins ont les mêmes extrémités : $\bar z$ n'a donc pas de primitive holomorphe, par le point (ii) de {{cx-integrale-chemin|Intégrale curviligne}}.
      ```schema lex-integrale-curviligne-1
      Deux chemins de $0$ à $1 + i$ : le segment, en rouge, sur lequel l'intégrale de $\bar z$ vaut $1$, et la ligne brisée par $1$, en bleu, sur laquelle elle vaut $1 + i$.
      ```
    - |
      Pour une fonction qui a une primitive holomorphe, seules comptent les extrémités. Comme $z^2$ est la dérivée de $z^3/3$, toute intégrale de $z^2$ le long d'un chemin de $0$ à $1 + i$ vaut
      $$\frac{(1 + i)^3}{3} = \frac{-2 + 2i}{3},$$
      sur le segment comme sur la ligne brisée de l'exemple précédent.
    - |
      Sur le cercle unité, $\bar z = 1/z$, et $\int_{C(0,1)} \bar z\,dz = \int_0^{2\pi} \exp(-it)\, i\exp(it)\,dt = 2i\pi$. Cette intégrale non nulle sur un chemin fermé exclut, par le point (ii) de {{cx-integrale-chemin|Intégrale curviligne}}, toute primitive holomorphe de $\bar z$ sur un ouvert qui contient le cercle, comme l'intégrale de $1/z$ l'excluait pour $1/z$ sur $\mathbb C \setminus \{0\}$.

  point-accumulation:
    - |
      L'ensemble $E = \{\frac1n : n \geqslant 1\}$ a pour point d'accumulation $0$, qui ne lui appartient pas : tout disque $D(0, \rho)$ contient $\frac1n$ dès que $n > \frac1\rho$. Aucun point de $E$ n'est point d'accumulation de $E$ : le disque $D(\frac1n, \frac1{n(n+1)})$ ne contient aucun autre point de $E$, puisque $\frac1n - \frac1{n+1} = \frac1{n(n+1)}$.
    - |
      Un ensemble fini n'a aucun point d'accumulation, et l'ensemble infini $\mathbb Z$ non plus : le disque $D(a, \frac12)$ contient au plus un entier, pour tout $a \in \mathbb C$. À l'inverse, tout point de $\mathbb C$ est point d'accumulation de $\mathbb Q + i\mathbb Q$, par la densité de $\mathbb Q$ dans $\mathbb R$ appliquée aux parties réelle et imaginaire.
    - |
      Une fonction holomorphe non nulle peut avoir une infinité de zéros, pourvu qu'ils ne s'accumulent pas dans l'ouvert. La fonction $\exp(2i\pi z) - 1$, holomorphe sur $\mathbb C$, s'annule exactement sur $\mathbb Z$, puisque $\exp w = 1$ si et seulement si $w \in 2i\pi\mathbb Z$ ({{cx-pi|Le nombre π}}, (ii)) ; comme $\mathbb Z$ n'a pas de point d'accumulation, il n'y a là aucune contradiction avec le {{cx-zeros-isoles|principe des zéros isolés}}.

  indice-lacet:
    - |
      Un lacet peut tourner dans les deux sens. Soit $\gamma$ le « huit » formé du cercle $\gamma_1(t) = 1 - \exp(it)$, $t \in [0, 2\pi]$, de centre $1$, puis du cercle $\gamma_2(t) = -1 + \exp(-it)$, $t \in [2\pi, 4\pi]$, de centre $-1$, tous deux issus de $0$. On a $\gamma_1'(t)/(\gamma_1(t) - 1) = i$ et $\gamma_2'(t)/(\gamma_2(t) + 1) = -i$, d'où $\operatorname{Ind}_{\gamma_1}(1) = 1$ et $\operatorname{Ind}_{\gamma_2}(-1) = -1$.

      Par le point (iv) de {{rs-indice|Indice d'un lacet}}, appliqué aux demi-plans convexes $\{\operatorname{Re} z < \frac12\}$ et $\{\operatorname{Re} z > -\frac12\}$, $\operatorname{Ind}_{\gamma_2}(1) = \operatorname{Ind}_{\gamma_1}(-1) = 0$. L'intégrale sur $\gamma$ étant la somme des deux, $\operatorname{Ind}_\gamma(1) = 1$ et $\operatorname{Ind}_\gamma(-1) = -1$ ; enfin $\operatorname{Ind}_\gamma(w) = 0$ si $|w| > 2$.
      ```schema lex-indice-lacet-1
      Le huit parcourt le cercle de droite dans le sens direct, puis celui de gauche dans le sens indirect, comme l'indiquent les flèches. L'indice vaut $1$ au centre rouge, $-1$ au centre bleu, et $0$ au point gris extérieur.
      ```
    - |
      Un lacet peut ne rien entourer. Le lacet $\gamma(t) = \cos t$, $t \in [0, 2\pi]$, parcourt le segment $[-1, 1]$ dans un sens puis dans l'autre. Pour $w$ non réel, l'ouvert convexe $\{|\operatorname{Im} z| < |\operatorname{Im} w|\}$ contient le segment et pas $w$ ; pour $w$ réel avec $|w| > 1$, on a $|w| > \max |\gamma|$. Dans les deux cas $\operatorname{Ind}_\gamma(w) = 0$ par le point (iv) de {{rs-indice|Indice d'un lacet}} : l'indice est nul hors de l'image.
    - |
      Plus loin, le {{rs-theoreme|théorème des résidus}} pondérera chaque résidu par l'indice. Pour le huit et $f(z) = \frac{1}{z^2 - 1}$, de résidus $\frac12$ en $1$ et $-\frac12$ en $-1$, il donnera
      $$\int_\gamma f = 2i\pi\Big(1 \cdot \frac12 + (-1)\Big(-\frac12\Big)\Big) = 2i\pi :$$
      le tour en sens inverse autour d'un résidu négatif ajoute au lieu de retrancher.

  biholomorphe:
    - |
      Le carré $z \mapsto z^2$ est une application biholomorphe du quart de plan $Q = \{\operatorname{Re} z > 0,\ \operatorname{Im} z > 0\}$ sur le demi-plan $\mathbb H = \{\operatorname{Im} w > 0\}$. En écrivant $z = r\exp(i\theta)$ avec $0 < \theta < \frac\pi2$ ({{cx-pi|Le nombre π}}, (iii)), on a $z^2 = r^2\exp(2i\theta)$, avec $0 < 2\theta < \pi$ : $Q$ est envoyé sur $\mathbb H$, et tout point de $\mathbb H$ est atteint. L'application est injective, puisque $z^2 = u^2$ impose $u = \pm z$ et que $-z \notin Q$ ; le point (iii) de {{cf-ouverte|Application ouverte}} conclut.
      ```schema lex-biholomorphe-1
      À gauche, des quarts de cercle et des rayons du quart de plan ; à droite, leurs images par $z \mapsto z^2$, demi-cercles et rayons du demi-plan supérieur, de mêmes couleurs. Les rayons issus de $0$, point qui n'appartient pas au quart de plan $Q$, ont dans $\mathbb H$ des angles doublés ; dans $Q$, où la dérivée ne s'annule pas, les cercles et les rayons images se coupent toujours à angle droit.
      ```
    - |
      Le même carré, sur le disque $\mathbb D = D(0, 1)$, est holomorphe et surjectif sur $\mathbb D$, mais il n'est pas injectif, puisque $z$ et $-z$ ont la même image : il n'est pas biholomorphe. Sa dérivée s'annule en $0$, ce que le point (iii) de {{cf-ouverte|Application ouverte}} interdit à une application holomorphe injective ; en analyse réelle, au contraire, $x \mapsto x^3$ est injective de dérivée nulle en $0$.
    - |
      L'exponentielle est biholomorphe de la bande $B = \{|\operatorname{Im} z| < \pi\}$ sur le plan fendu $\mathbb C \setminus \,]{-\infty}, 0]$. Elle est injective sur $B$, puisque $\exp z = \exp u$ impose $z - u \in 2i\pi\mathbb Z$ et que deux points de $B$ ont des parties imaginaires distantes de moins de $2\pi$. Tout $w$ du plan fendu s'écrit $|w|\exp(i\theta)$ avec $-\pi < \theta < \pi$, d'où $w = \exp(\ln|w| + i\theta)$ ; les réels négatifs, d'argument $\pi$, ne sont pas atteints. Le point (iii) de {{cf-ouverte|Application ouverte}} conclut.

  automorphismes-disque:
    - |
      L'automorphisme $\varphi_{1/2}(z) = \frac{z - 1/2}{1 - z/2}$ envoie $\frac12$ sur $0$ et $0$ sur $-\frac12$, et il fixe $1$ et $-1$. Il envoie $i$ sur $\frac{i - 1/2}{1 - i/2} = -\frac45 + \frac35 i$, de module $1$ : le cercle unité est conservé, comme le dit le point (i) de {{cf-automorphismes|Automorphismes du disque}}, et la formule de ce point en $z = 0$ se lit $1 - \frac14 = \frac34 \cdot 1$.
    - |
      Les automorphismes du disque forment un groupe pour la composition : la composée de deux applications [[biholomorphe|biholomorphes]] de $\mathbb D$ sur $\mathbb D$ en est une. Le calcul en donne la forme :
      $$\varphi_{1/2} \circ \varphi_{1/2}(z) = \frac{\frac54 z - 1}{\frac54 - z} = \frac{z - \frac45}{1 - \frac45 z},$$
      c'est-à-dire $\varphi_{1/2} \circ \varphi_{1/2} = \varphi_{4/5}$, avec $\lambda = 1$ dans le point (ii) de {{cf-automorphismes|Automorphismes du disque}}.
    - |
      Les deux moitiés de la bijectivité sont nécessaires. L'application $z \mapsto z/2$ est holomorphe et injective de $\mathbb D$ dans $\mathbb D$, mais pas surjective ; $z \mapsto z^2$ est surjective, mais pas injective. Aucune n'est un automorphisme, et toutes deux fixent $0$ sans être des rotations : le lemme de Schwarz donne $|f(z)| < |z|$ hors de $0$, avec $|f'(0)| = \frac12$ et $0$.

  convergence-compacte:
    - |
      Les sommes partielles $S_N(z) = \sum_{n \leqslant N} z^n/n!$ convergent vers $\exp$ uniformément sur tout compact de $\mathbb C$, mais pas uniformément sur $\mathbb C$. Un compact est contenu dans un disque $\overline D(0, R)$, où le critère de Weierstrass s'applique avec $M_n = R^n/n!$. Sur la demi-droite réelle positive, en revanche, $\exp x - S_N(x) \geqslant \frac{x^{N+1}}{(N+1)!}$, qui n'est pas borné : l'écart n'est borné sur $\mathbb C$ pour aucun $N$.
    - |
      Les sommes partielles de $\sum z^n$ convergent vers $\frac{1}{1 - z}$ uniformément sur tout compact du disque $\mathbb D$, puisqu'un tel compact est contenu dans un $\overline D(0, \rho)$, $\rho < 1$. Par le point (iii) de {{cf-compacte|Convergence sur les compacts}}, les dérivées $\sum_{n \leqslant N} n z^{n-1}$ convergent de même vers $\frac{1}{(1 - z)^2}$. La convergence n'est pas uniforme sur $\mathbb D$ : l'écart vaut $\frac{|z|^{N+1}}{|1 - z|}$, qui n'est pas borné près de $1$.
    - |
      La convergence des dérivées ne vaut que sur les compacts, même quand la suite converge uniformément sur tout l'ouvert. Les fonctions $z^k/k$ tendent vers $0$ uniformément sur $\mathbb D$, puisque $|z^k/k| \leqslant 1/k$ ; leurs dérivées $z^{k-1}$ tendent vers $0$ sur tout compact de $\mathbb D$, mais $\sup_{\mathbb D} |z^{k-1}| = 1$ pour tout $k$.

  famille-localement-bornee:
    - |
      La famille $\{z^n : n \in \mathbb N\}$ est bornée par $1$ sur $\mathbb D$, donc localement bornée. Sur le disque $D(0, 2)$, elle ne l'est pas : sur le compact $\{\frac32\}$, les valeurs $(\frac32)^n$ ne sont majorées par aucune constante.
    - |
      Localement borné ne veut pas dire borné. Les fonctions $\exp(az)$, pour $|a| \leqslant 1$, sont majorées en module par $\exp R$ sur le disque $\overline D(0, R)$, puisque $|\exp w| = \exp(\operatorname{Re} w) \leqslant \exp|w|$ ; tout compact de $\mathbb C$ étant contenu dans un tel disque, la famille est localement bornée sur $\mathbb C$. Aucune de ses fonctions non constantes n'y est pourtant bornée : pour $a \neq 0$ et $t$ réel, $|\exp(a \cdot t\bar a)| = \exp(t|a|^2)$ tend vers l'infini avec $t$.

  famille-normale:
    - |
      La famille $\{z^n : n \in \mathbb N\}$ est normale sur $\mathbb D$ : toute suite $(z^{n_k})$ dont les exposants tendent vers l'infini converge vers $0$ uniformément sur tout compact de $\mathbb D$, puisque $|z^{n_k}| \leqslant \rho^{n_k}$ sur $\overline D(0, \rho)$, et une suite dont les exposants ne tendent pas vers l'infini a une sous-suite constante. La limite $0$ n'appartient pas à la famille : la définition ne le demande pas.
    - |
      Sur $D(0, 2)$, la même famille n'est pas normale : aucune suite extraite de $(z^n)$ ne converge au point $\frac32$, où les valeurs tendent vers l'infini. La conclusion du théorème de Montel tombe avec son hypothèse, puisque la famille n'est pas [[famille-localement-bornee|localement bornée]] sur $D(0, 2)$.
    - |
      La famille des $\exp(az)$, $|a| \leqslant 1$, localement bornée sur $\mathbb C$, est normale par le théorème de Montel. On le voit ici directement : d'une suite $(a_k)$ du disque fermé on extrait, par le théorème de {{ar-bw|Bolzano-Weierstrass}} appliqué aux parties réelle et imaginaire, une suite convergente, vers un $a$ avec $|a| \leqslant 1$, et sur $\overline D(0, R)$, on a $|\exp(a_k z) - \exp(az)| = |\exp(az)|\,|\exp((a_k - a)z) - 1| \leqslant \exp R\,\big(\exp(|a_k - a|R) - 1\big)$, par la série de l'exponentielle, qui tend vers $0$.

  logarithme-holomorphe:
    - |
      Sur le disque convexe $D(1, 1)$, la série
      $$L(z) = \sum_{n \geqslant 1} \frac{(-1)^{n+1}}{n}(z - 1)^n$$
      a pour dérivée $\sum_{m \geqslant 0} (1 - z)^m = \frac1z$. La fonction $\exp(L(z))/z$ a donc une dérivée nulle, $\frac{L'\exp L}{z} - \frac{\exp L}{z^2} = 0$, et vaut $1$ en $1$ : elle est constante par le point (i) de {{cf-racines|Racines carrées holomorphes}}, et $\exp \circ L = z$. C'est un logarithme holomorphe de $z$ sur $D(1, 1)$.
    - |
      Sur un ouvert [[connexe]], un logarithme holomorphe n'est déterminé qu'à $2i\pi k$ près. Si $L$ en est un, $L + 2i\pi k$ en est un autre pour tout $k \in \mathbb Z$, puisque $\exp(2i\pi k) = 1$. Réciproquement, si $L_1$ et $L_2$ conviennent, la dérivation de $\exp \circ L_j = g$ donne $L_1' = g'/g = L_2'$ : la différence $L_1 - L_2$ est constante par le point (i) de {{cf-racines|Racines carrées holomorphes}}, et cette constante est dans $2i\pi\mathbb Z$, puisque $\exp(L_1 - L_2) = 1$.
    - |
      La fonction $z$ n'a pas de logarithme holomorphe sur $\mathbb C \setminus \{0\}$. Sinon, $\exp(L/2)$ en serait une racine carrée holomorphe, ce que le point (v) de {{cf-racines|Racines carrées holomorphes}} exclut ; on le voit aussi par l'intégrale, puisque $L' = 1/z$ et que $\int_{C(0,1)} \frac{dz}{z} = 2i\pi \neq 0$.

  propriete-racine-carree:
    - |
      Le disque $\mathbb D$, le demi-plan $\mathbb H$ et la bande $\{|\operatorname{Im} z| < \frac\pi2\}$ sont convexes : ils ont la propriété de la racine carrée par le point (iii) de {{cf-racines|Racines carrées holomorphes}}. Le plan fendu $\mathbb C \setminus \,]{-\infty}, 0]$, qui n'est pas convexe, puisque le milieu de $i$ et de $-i$ est $0$, l'a aussi, étant étoilé par rapport à $1$ (remarque de {{cf-racines|Racines carrées holomorphes}}).
    - |
      L'ouvert $\mathbb C \setminus \{0\}$ et la [[couronne]] $\{1 < |z| < 2\}$ n'ont pas la propriété, puisque la fonction $z$, sans zéro, n'y a pas de racine carrée holomorphe : par le point (v) de {{cf-racines|Racines carrées holomorphes}} pour le premier, par la dernière remarque de ce nœud pour la seconde (voir aussi les exemples de [[racine-carree-holomorphe]]). Ce ne sont pas toutes les fonctions qui échouent : $z^2$ y a les deux racines $\pm z$. La propriété demande une racine pour chaque fonction sans zéro, et une seule fonction suffit à l'exclure.
    - |
      La propriété ne demande pas la connexité : la réunion de deux disques disjoints l'a, puisque chaque disque l'a et qu'une racine se choisit séparément sur chacun. Plus loin, le {{cf-riemann|théorème de Riemann}} établira qu'un ouvert connexe non vide, distinct de $\mathbb C$, qui a la propriété est biholomorphe au disque.

  serie-laurent:
    - |
      La fonction $f(z) = \frac{1}{z(z - 2)}$ a deux développements de Laurent de centre $0$. Sur la [[couronne]] $0 < |z| < 2$, la série géométrique en $\frac z2$ donne
      $$\begin{aligned} f(z) &= -\sum_{n \geqslant 0} \frac{z^{n-1}}{2^{n+1}} \\ &= -\frac{1}{2z} - \frac14 - \frac z8 - \cdots ; \end{aligned}$$
      sur $|z| > 2$, celle en $\frac2z$ donne $f(z) = \sum_{n \geqslant 0} 2^n z^{-n-2}$. Par l'unicité ({{rs-laurent|Séries de Laurent}}, (iv)), ce sont les séries de Laurent de $f$ sur ces deux couronnes, et elles n'ont rien de commun.
    - |
      Les coefficients se lisent aussi sur les intégrales. Pour la fonction précédente et la couronne $0 < |z| < 2$, le coefficient $a_{-1} = -\frac12$ doit valoir $\frac{1}{2i\pi}\int_{C(0, \rho)} f$ pour tout $\rho \in \,]0, 2[$. La décomposition $f(z) = \frac12\big(\frac{1}{z - 2} - \frac1z\big)$ et le point (v) de {{rs-indice|Indice d'un lacet}} donnent bien $\frac{1}{2i\pi} \cdot \frac12(0 - 2i\pi) = -\frac12$.

  singularite-isolee:
    - |
      Les trois cas se rencontrent sur des fonctions simples, dont les [[serie-laurent|séries de Laurent]] en $0$ viennent de celle de l'exponentielle et de l'unicité ({{rs-laurent|Séries de Laurent}}, (iv)). La fonction $\frac{\exp z - 1 - z}{z^2} = \sum_{n \geqslant 2} \frac{z^{n-2}}{n!}$ a une fausse singularité, et se prolonge par la valeur $\frac12$. La fonction $\frac{\exp z}{z^3} = z^{-3} + z^{-2} + \frac12 z^{-1} + \cdots$ a un pôle d'ordre $3$. La fonction $z\exp(1/z) = \sum_{n \geqslant 0} \frac{z^{1-n}}{n!}$ a une singularité essentielle.
    - |
      Une singularité n'est pas toujours isolée. La fonction $\frac{1}{\exp(1/z) - 1}$ n'est pas définie aux points $\frac{1}{2i\pi k}$, $k \in \mathbb Z \setminus \{0\}$, où $\exp(1/z) = 1$ ({{cx-pi|Le nombre π}}, (ii)). Ces points s'accumulent en $0$ : elle n'est holomorphe sur aucun disque épointé $D(0, \rho) \setminus \{0\}$, et $0$ n'est pas une singularité isolée ; la classification par la série de Laurent ne s'y applique pas.

  pole:
    - |
      La fonction $f(z) = \frac{1}{z(z - 2)}$ a un pôle simple en $0$ : sur $0 < |z| < 2$, sa [[serie-laurent|série de Laurent]] $-\frac{1}{2z} - \sum_{n \geqslant 1} \frac{z^{n-1}}{2^{n+1}}$ a un seul coefficient d'indice négatif non nul, $c_{-1} = -\frac12$. De même, elle a un pôle simple en $2$.
    - |
      L'ordre du pôle n'est pas l'exposant du dénominateur. La fonction $\frac{\exp z - 1}{z^3}$ a pour série de Laurent en $0$
      $$\sum_{n \geqslant 1} \frac{z^{n-3}}{n!} = \frac1{z^2} + \frac1{2z} + \frac16 + \cdots :$$
      c'est un pôle d'ordre $2$, et non $3$, parce que le numérateur s'annule en $0$.
    - |
      La fonction $\exp(1/z) = \sum_{n \geqslant 0} \frac{z^{-n}}{n!}$ a une infinité de coefficients d'indice négatif non nuls : $0$ n'en est pas un pôle, mais une singularité essentielle. Plus loin, la proposition {{rs-poles|Pôles}} caractérisera les pôles par $|f(z)| \to +\infty$ ; ici, $\exp(1/z)$ tend vers $0$ le long des réels négatifs.

  residu:
    - |
      La formule (iii) de {{rs-residu|Résidus}} donne les résidus de $\frac{1}{z(z - 2)}$, quotient de $1$ par $h(z) = z^2 - 2z$, de dérivée $2z - 2$ : $\operatorname{Res}(f, 0) = \frac{1}{-2} = -\frac12$, coefficient déjà lu sur la [[serie-laurent|série de Laurent]], et $\operatorname{Res}(f, 2) = \frac12$. Pour $\frac{1}{\exp z - 1}$, la même formule donne $\operatorname{Res} = \frac{1}{\exp 0} = 1$ en $0$.
    - |
      En un pôle multiple, on emploie le point (ii). Pour $\frac{\exp z}{z^3}$, de pôle d'ordre $3$ en $0$, avec $g = \exp$, on trouve $\operatorname{Res} = \frac{g''(0)}{2!} = \frac12$, le coefficient de $z^{-1}$ dans $\sum_n \frac{z^{n-3}}{n!}$. En une singularité essentielle, seule la série de Laurent répond : pour $z\exp(1/z) = \sum_n \frac{z^{1-n}}{n!}$, le terme en $z^{-1}$ correspond à $n = 2$, et le résidu vaut $\frac12$.
    - |
      Plus loin, le {{rs-theoreme|théorème des résidus}} donnera, pour $f(z) = \frac{1}{z(z - 2)}$ et le cercle $C(0, 3)$ qui entoure les deux pôles,
      $$\int_{C(0, 3)} f = 2i\pi\Big(-\frac12 + \frac12\Big) = 0,$$
      ce que confirme le développement sur $|z| > 2$, qui n'a pas de terme en $z^{-1}$.

  meromorphe:
    - |
      Une fraction rationnelle $P/Q$, avec $P$ et $Q$ sans racine commune, est méromorphe sur $\mathbb C$ : ses pôles sont les racines de $Q$, en nombre fini. Ainsi $\frac{1}{z(z - 2)}$ est méromorphe, de pôles simples $0$ et $2$.
    - |
      Une fonction méromorphe peut avoir une infinité de pôles. La fonction $\frac{1}{\exp z - 1}$ est holomorphe hors de $2i\pi\mathbb Z$, ensemble sans [[point-accumulation|point d'accumulation]] ; chaque $2i\pi k$ est un zéro d'ordre $1$ de $\exp z - 1$, dont la dérivée $\exp$ ne s'annule pas, donc un pôle simple par le point (ii) de {{rs-poles|Pôles}}. Elle est méromorphe sur $\mathbb C$.
    - |
      L'ouvert compte. La fonction $\frac{1}{\exp(1/z) - 1}$ est méromorphe sur $\mathbb C \setminus \{0\}$, ses pôles $\frac{1}{2i\pi k}$ s'accumulant en $0$, hors de l'ouvert. Elle ne l'est sur aucun ouvert qui contient $0$, puisque $0$ devrait appartenir à l'ensemble $P$, qui aurait alors un point d'accumulation dans l'ouvert. La fonction $\exp(1/z)$, de singularité essentielle en $0$, n'est pas non plus méromorphe sur $\mathbb C$.

  inegalites-cauchy:
    - |
      Pour $f(z) = \frac{1}{1 - z}$ et $r < 1$, tous les coefficients valent $1$ et $M = \frac{1}{1 - r}$ : les inégalités $1 \leqslant \frac{1}{(1 - r)r^n}$ sont vraies mais larges. Pour $f(z) = z^n$, en revanche, $c_n = 1$ et $M = r^n$ : l'inégalité $|c_n| \leqslant M r^{-n}$ est une égalité, pour tout rayon.
    - |
      Les inégalités de Cauchy donnent des inégalités réelles. Pour $\exp$ et le cercle de rayon $r$, $M = \exp r$, puisque $|\exp(x + iy)| = \exp x$. Ainsi $\frac1{n!} \leqslant \frac{\exp r}{r^n}$ pour tout $r > 0$, et le choix $r = n$ donne
      $$n! \geqslant n^n \exp(-n),$$
      minoration de la factorielle obtenue sans aucun calcul sur les entiers.
    - |
      Plus loin, le {{cx-liouville|théorème de Liouville}} fera tendre $r$ vers l'infini : pour une fonction entière bornée par $M$, l'inégalité $|c_n| \leqslant M r^{-n}$, valable pour tout $r$, force $c_n = 0$ dès que $n \geqslant 1$.

  partie-convexe-complexe:
    - |
      Un disque $D(c, r)$ est convexe : pour $a, b$ dans le disque et $t \in [0, 1]$,
      $$\begin{aligned} &|(1 - t)a + tb - c| \\ &\quad \leqslant (1 - t)|a - c| + t|b - c| < r. \end{aligned}$$
      Le demi-plan $\{\operatorname{Im} z > 0\}$ l'est aussi, la partie imaginaire étant compatible avec les combinaisons à coefficients réels, et l'intersection de deux parties convexes est convexe : une bande ou un demi-disque l'est donc.
    - |
      L'ouvert $\{1 < |z| < 3\}$ n'est pas convexe : le milieu de $2$ et de $-2$ est $0$, qui n'y est pas. La conclusion du théorème de Cauchy y tombe : $1/z$ y est holomorphe, et $\int_{C(0, 2)} \frac{dz}{z} = 2i\pi \neq 0$ ({{cx-integrale-chemin|Intégrale curviligne}}, (iii)).
      ```schema lex-partie-convexe-complexe-2
      L'ouvert $1 < |z| < 3$, en gris : le segment de $-2$ à $2$, en rouge, en sort en passant par $0$. Le cercle bleu de rayon $2$ y est contenu, et l'intégrale de $1/z$ y vaut $2i\pi$.
      ```
    - |
      Une similitude $z \mapsto \alpha z + \beta$ conserve la convexité, puisque $(1 - t)(\alpha a + \beta) + t(\alpha b + \beta) = \alpha\big((1 - t)a + tb\big) + \beta$. Plus loin, le {{cf-riemann|théorème de Riemann}} montrera que tout ouvert convexe non vide distinct de $\mathbb C$ est biholomorphe au disque unité.

  chemin-c1-morceaux:
    - |
      Le bord du carré de sommets $0$, $1$, $1 + i$, $i$ est le chemin $\gamma : [0, 4] \to \mathbb C$ défini par $\gamma(t) = t$ sur $[0, 1]$, $1 + i(t - 1)$ sur $[1, 2]$, $(3 - t) + i$ sur $[2, 3]$ et $i(4 - t)$ sur $[3, 4]$. Il est de classe $C^1$ sur chaque segment de la [[subdivision]] $0 < 1 < 2 < 3 < 4$, et fermé ; en $t = 1$, la dérivée vaut $1$ à gauche et $i$ à droite, si bien qu'il n'est pas dérivable en ce point.
      ```schema lex-chemin-c1-morceaux-1
      Le bord du carré, parcouru dans le sens des flèches à partir de $0$. Aux quatre coins, en rouge, la vitesse change brusquement de direction : le chemin est de classe $C^1$ sur chaque côté, mais pas dérivable aux coins.
      ```
    - |
      Être dérivable ne suffit pas. Le chemin $\gamma(t) = t + it^2\sin(1/t)$ sur $]0, 1]$, prolongé par $\gamma(0) = 0$, est dérivable en tout point, avec $\gamma'(0) = 1$, puisque $\frac{\gamma(t)}{t} = 1 + it\sin(1/t) \to 1$. Mais $\gamma'(t) = 1 + i\big(2t\sin(1/t) - \cos(1/t)\big)$ n'a pas de limite en $0$ : sur le premier segment de toute subdivision, la dérivée n'est pas continue, et le chemin n'est pas de classe $C^1$ par morceaux.

  longueur-chemin:
    - |
      Le cercle $C(c, r)$ a pour longueur $\int_0^{2\pi} |ir\exp(it)|\,dt = 2\pi r$. Parcouru deux fois, sur $[0, 4\pi]$, il a la même image et la longueur $4\pi r$ : la longueur est celle du chemin, non de son image.
    - |
      La longueur sert à majorer une intégrale sans la calculer. Sur le cercle $|z| = 2$, on a $|z^2 + 1| \geqslant |z|^2 - 1 = 3$, donc
      $$\Big|\int_{C(0, 2)} \frac{dz}{z^2 + 1}\Big| \leqslant 4\pi \cdot \frac13 = \frac{4\pi}{3}.$$
      La majoration peut être très large : cette intégrale est nulle, comme le montrera le théorème des résidus.

  serie-complexe:
    - |
      La série géométrique de raison $q = \frac i2$ converge, de somme $\frac{1}{1 - i/2} = \frac{4 + 2i}{5}$ ({{cx-suites|Suites et séries complexes}}, (iii)). Ses sommes partielles sont $1$, $1 + \frac i2$, $\frac34 + \frac i2$, $\frac34 + \frac{3i}8$, … ; chaque terme $q^n$, pas d'une somme à la suivante, est le précédent tourné d'un quart de tour et divisé par deux.
      ```schema lex-serie-complexe-1
      Les sommes partielles de $\sum (i/2)^n$, reliées dans l'ordre : chaque pas est le précédent tourné d'un quart de tour et réduit de moitié, et la ligne s'enroule en spirale carrée autour de la somme $\frac{4 + 2i}{5}$, en rouge.
      ```
    - |
      Le terme général d'une série convergente tend vers $0$, puisque $z_n = S_n - S_{n-1}$. La série $\sum i^n$ diverge donc, ses termes étant de module $1$ ; ses sommes partielles parcourent indéfiniment les quatre valeurs $1$, $1 + i$, $i$ et $0$.

  serie-absolument-convergente:
    - |
      La série exponentielle $\sum z^n/n!$ converge absolument pour tout $z \in \mathbb C$ : la série réelle $\sum |z|^n/n!$ converge, de somme $\exp|z|$ ({{ex-serie|Série de l'exponentielle}}). La série complexe converge donc, par le point (ii) de {{cx-suites|Suites et séries complexes}}.
    - |
      La réciproque du point (ii) de {{cx-suites|Suites et séries complexes}} est fausse. La série $\sum i^n/(n + 1)$ converge : ses parties réelle et imaginaire sont les séries alternées $\sum (-1)^k/(2k + 1)$ et $\sum (-1)^k/(2k + 2)$, dont les sommes partielles d'indices pairs et impairs sont adjacentes. Elle ne converge pas absolument, puisque $\sum_{N \leqslant n < 2N} \frac{1}{n + 1} \geqslant \frac12$ pour tout $N$, ce qui empêche $\sum 1/(n + 1)$ de converger.
    - |
      L'inégalité $\big|\sum z_n\big| \leqslant \sum |z_n|$ peut être très large, quand les termes tournent. Pour $z_n = (i/2)^n$, on a $\sum |z_n| = 2$, alors que la somme $\frac{4 + 2i}{5}$ a pour module $\frac{2}{\sqrt 5} \approx 0{,}894$.

  bord-ouvert-complexe:
    - |
      Le bord du disque ouvert $D(c, r)$ est le cercle $\{|z - c| = r\}$. Le disque fermé est fermé et contient $D(c, r)$ ; tout point $z$ du cercle est limite des points $c + (1 - \frac1n)(z - c)$ du disque ouvert. L'adhérence est donc le disque fermé, et le bord est ce qui reste quand on retire le disque ouvert.
    - |
      Le bord n'est pas toujours une courbe qui entoure l'ouvert. Le disque fendu $U = \mathbb D \setminus [0, 1[$ est ouvert, et son adhérence est le disque fermé : tout $x \in [0, 1[$ est limite des points $x + \frac in$ de $U$. Son bord est donc la réunion du cercle unité et du segment $[0, 1[$, que l'ouvert borde des deux côtés.
      ```schema lex-bord-ouvert-complexe-2
      Le disque fendu, en gris : son bord, en rouge, est formé du cercle unité et du segment $[0, 1[$, que les points de l'ouvert approchent par-dessus et par-dessous.
      ```
    - |
      Le principe du maximum demande que la fonction soit holomorphe. La fonction $1 - |z|^2$, continue sur le disque fermé, atteint son maximum $1$ au centre et vaut $0$ sur le bord : la conclusion du point (iii) de {{cf-maximum|Principe du maximum}} tombe, puisque cette fonction n'est holomorphe sur aucun ouvert : comme $|z|^2$, elle n'est dérivable au sens complexe qu'en $0$, ses taux d'accroissement ayant des limites différentes selon les directions réelle et imaginaire. Pour $f(z) = z + \frac12$, holomorphe, le maximum de $|f|$ sur le disque fermé vaut $\frac32$, atteint au point $1$ du bord.

  racine-carree-holomorphe:
    - |
      Le carré $z \mapsto z^2$ est une application biholomorphe du quart de plan $Q = \{\operatorname{Re} z > 0,\ \operatorname{Im} z > 0\}$ sur le demi-plan $\mathbb H$ (voir les exemples de [[biholomorphe]]). Sa réciproque $h$ est holomorphe sur $\mathbb H$ et vérifie $h(w)^2 = w$ : c'est une racine carrée holomorphe de $w$ sur $\mathbb H$, à valeurs dans $Q$. Ainsi $h(i) = \exp(i\pi/4)$, seul nombre de $Q$ dont le carré est $i$ ; l'autre racine est $-h$.
    - |
      Une fonction qui s'annule peut avoir une racine carrée ou n'en avoir pas. Sur $\mathbb D$, la fonction $z^2$ a les racines $\pm z$. La fonction $z$ n'en a pas : de $h^2 = z$ on tirerait $h(0) = 0$, puis $2h(0)h'(0) = 1$ en dérivant, c'est-à-dire $0 = 1$. Plus généralement, si $h^2 = f$ et si $h$ a en $a$ un zéro d'ordre $k$, alors $h = (z - a)^k u$ avec $u(a) \neq 0$ ({{rs-singularites|Singularités isolées}}, (i)), et $f = (z - a)^{2k}u^2$ a en $a$ un zéro d'ordre $2k$ : un zéro d'ordre impair empêche toute racine carrée holomorphe.
    - |
      Sur la [[couronne]] $\{1 < |z| < 2\}$, la fonction $z$ ne s'annule pas et n'a pourtant pas de racine carrée holomorphe. Si $h^2 = z$, alors $2hh' = 1$, donc $\frac{h'}{h} = \frac1{2z}$, et le principe de l'argument ({{rs-argument|Principe de l'argument}}, (i)) donnerait l'entier $\operatorname{Ind}_{h \circ \gamma}(0) = \frac{1}{2i\pi}\int_{C(0, 3/2)} \frac{dz}{2z} = \frac12$.

  couronne:
    - |
      Les cas extrêmes des rayons donnent des ouverts familiers. La couronne $A(0; 0, 1)$ est le disque unité privé de $0$ ; $A(0; 1, +\infty)$ est l'extérieur du disque fermé $\overline D(0, 1)$ ; $A(c; 0, +\infty)$ est le plan privé de $c$. Aucune couronne n'est [[partie-convexe-complexe|convexe]] : deux points opposés par rapport au centre ont pour milieu le centre, qui n'appartient pas à la couronne.
    - |
      La fonction $f(z) = \frac{1}{z(z - 2)}$ est holomorphe sur les deux couronnes $A(0; 0, 2)$ et $A(0; 2, +\infty)$. Par le point (i) de {{rs-couronne|Cauchy sur une couronne}}, son intégrale sur $C(0, \rho)$ ne dépend pas de $\rho$ dans chacune. Avec $f(z) = \frac12\big(\frac{1}{z - 2} - \frac1z\big)$ et le point (v) de {{rs-indice|Indice d'un lacet}}, elle vaut $-i\pi$ pour $0 < \rho < 2$ et $0$ pour $\rho > 2$ : le saut se produit au passage du point $2$, où $f$ n'est pas définie.
      ```schema lex-couronne-2
      Les couronnes $A(0; 0, 2)$, en rouge, et $A(0; 2, +\infty)$, en bleu, séparées par le cercle de rayon $2$, qui passe par le point $2$ où $f$ n'est pas définie ; le centre $0$ est exclu. Le cercle pointillé rouge de rayon $1$ donne l'intégrale $-i\pi$, le cercle pointillé bleu de rayon $3$ l'intégrale $0$.
      ```

  lacet-c1:
    - |
      Le cercle $C(c, r)$ est un lacet, ainsi que le cercle parcouru $n$ fois, $t \mapsto c + r\exp(it)$ sur $[0, 2n\pi]$, et le bord d'un carré, de classe $C^1$ sur chaque côté. Deux lacets de même image peuvent être différents : le cercle parcouru une fois et deux fois ont la même image $\gamma^*$, mais pas la même intégrale de $\frac{1}{z - c}$, qui vaut $2i\pi$ et $4i\pi$.
    - |
      La définition ne demande que la fermeture et la régularité par morceaux : un lacet peut revenir sur ses pas. Le lacet $\gamma(t) = \cos t$, $t \in [0, 2\pi]$, de classe $C^1$, parcourt le segment $[-1, 1]$ dans un sens puis dans l'autre ; les exemples de [[indice-lacet]] montrent que son indice est nul hors de l'image. Le bord $\partial T$ d'un triangle, du {{cx-goursat|lemme de Goursat}}, est un lacet de classe $C^1$ sur chacun de ses trois côtés.

  partie-principale:
    - |
      La fonction $\frac{\exp z}{z^2} = \sum_{n \geqslant 0} \frac{z^{n-2}}{n!}$ a pour partie principale en $0$ le polynôme $\frac1{z^2} + \frac1z$ en $\frac1z$. En la retranchant, on obtient $\sum_{n \geqslant 2} \frac{z^{n-2}}{n!}$, dont la singularité en $0$ est fausse : la partie principale est exactement ce qui empêche la fonction de se prolonger.
    - |
      Pour $\frac{1}{z(z - 2)}$, la partie principale en $0$ est $-\frac{1}{2z}$, lue sur la série de Laurent des exemples de [[pole]]. Celle en $2$ est $\frac{1}{2(z - 2)}$ : on écrit $\frac1z = \frac12 \cdot \frac{1}{1 + (z - 2)/2}$, série géométrique en $\frac{z - 2}{2}$ pour $|z - 2| < 2$, de terme constant $\frac12$. Leur somme
      $$\begin{aligned} -\frac{1}{2z} + \frac{1}{2(z - 2)} &= \frac{-(z - 2) + z}{2z(z - 2)} \\ &= \frac{1}{z(z - 2)} \end{aligned}$$
      redonne ici la fonction : cette fonction est exactement la somme de ses deux parties principales.
    - |
      En une singularité essentielle, la partie principale est une vraie série. Pour $\exp(1/z)$, c'est $\sum_{n \geqslant 1} \frac{z^{-n}}{n!} = \exp(1/z) - 1$, qui n'est pas un polynôme en $\frac1z$.

  ordre-zero:
    - |
      La fonction $h(z) = \exp z - 1 - z$ s'annule en $0$, ainsi que sa dérivée $\exp z - 1$, mais sa dérivée seconde vaut $\exp 0 = 1$ : le zéro est d'ordre $2$, et $h(z) = z^2\big(\frac12 + \frac z6 + \cdots\big)$. De même, $(z - 1)^3(z + 1)$ a en $1$ un zéro d'ordre $3$, sa dérivée troisième y valant $3! \cdot 2 = 12$.
    - |
      L'ordre est une notion locale. Sur l'ouvert non connexe $U = D(0, 1) \cup D(3, 1)$, la fonction égale à $0$ sur le premier disque et à $1$ sur le second est holomorphe et non identiquement nulle ; son zéro $0$ n'a pourtant pas d'ordre, puisqu'elle est nulle au voisinage de $0$. Sur un ouvert connexe, cela n'arrive que pour la fonction nulle, par le {{cx-zeros-isoles|principe des zéros isolés}}.
