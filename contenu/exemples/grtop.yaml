# Exemples du lexique : théorie « Groupes topologiques » (grtop).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  groupe-topologique:
    - |
      Une topologie strictement comprise entre la grossière et la [[topologie-discrete|discrète]] peut faire d'un groupe un groupe topologique, sans le rendre [[separe|séparé]]. Soit $G = \lex{ensemble-parties}{\mathcal P}(\{a, b\})$, avec $a \neq b$, muni de la différence symétrique : c'est un [[groupe-abelien|groupe abélien]] de neutre $\varnothing$, où $-X = X$ ({{a-anneau|Anneaux}}, (v)). Les parties $H = \{X : b \notin X\} = \{\varnothing, \{a\}\}$ et $H' = \{X : b \in X\}$ forment une [[partition]] de $G$, et $\{\varnothing, H, H', G\}$ est une [[topologie]], puisque $H \cap H' = \varnothing$ et $H \cup H' = G$.

      Comme $b$ appartient à $X \triangle Y$ si et seulement s'il appartient à une seule des deux parties, $X \triangle Y$ est dans $H$ exactement quand $X$ et $Y$ sont dans le même bloc. L'[[image-reciproque|image réciproque]] de $H$ par la loi est donc $(H \times H) \cup (H' \times H')$, celle de $H'$ est $(H \times H') \cup (H' \times H)$, et ce sont des [[ouvert|ouverts]] de la [[topologie-produit|topologie produit]] ; le passage au symétrique est l'identité. Pourtant, tout ouvert qui contient $\varnothing$ contient $\{a\}$ : ces deux points n'ont pas de [[voisinage|voisinages]] disjoints.
      ```schema lex-groupe-topologique-1
      Les quatre éléments de $\mathcal P(\{a, b\})$ et les deux blocs, $H$ en bleu et $H'$ en vert, dont les réunions sont les ouverts. Aucun ouvert ne sépare $\varnothing$ de $\{a\}$, qui sont dans le même bloc.
      ```
    - |
      Une topologie quelconque ne rend pas la loi continue, et les translations cessent alors d'être des [[homeomorphisme|homéomorphismes]]. Sur $G = \mathcal P(\{a\}) = \{\varnothing, E\}$, où $E = \{a\}$, la différence symétrique est une loi de groupe de neutre $\varnothing$ ({{a-anneau|Anneaux}}, (v)), et $\mathcal T = \{\varnothing, \{E\}, G\}$ est une topologie. Le passage au symétrique, qui est l'identité, est [[continuite|continu]].

      La loi ne l'est pas. L'image réciproque de l'ouvert $\{E\}$ est $\{(\varnothing, E), (E, \varnothing)\}$ ; or un ouvert du produit qui contient $(\varnothing, E)$ contient un produit $U \times V$ d'ouverts avec $\varnothing \in U$, donc $U = G$, et il contient aussi $(E, E)$, que la loi envoie sur $\varnothing$. La translation $X \mapsto E \triangle X$ échange les deux points et envoie l'ouvert $\{E\}$ sur $\{\varnothing\}$, qui n'est pas ouvert : elle n'est pas un homéomorphisme.
      ```schema lex-groupe-topologique-2
      Les quatre points $(X, Y)$ de $G \times G$, la première coordonnée $X$ en abscisse et la seconde $Y$ en ordonnée ; en rouge, l'image réciproque de l'ouvert $\{E\}$ par la loi. Le plus petit ouvert du produit qui contient $(\varnothing, E)$, entouré en bleu, est $G \times \{E\}$ : il contient aussi $(E, E)$, que la loi envoie sur $\varnothing$.
      ```
    - |
      Que les translations à gauche soient des homéomorphismes ne suffit pas. Dans le [[groupe-symetrique|groupe symétrique]] $\mathfrak S(\{a, b, c\})$, de points distincts, soit $H = \{\mathrm{id}, \tau_{ab}\}$, avec les notations du nœud {{a-groupe|Groupes}}, (iv). En suivant les images de $a$, $b$ et $c$, on trouve $\rho \circ \tau_{ab} = \tau_{ac}$ et $\rho^2 \circ \tau_{ab} = \tau_{bc}$, où $\rho^2 = \rho \circ \rho$ : les [[classe-a-gauche|classes à gauche]] sont $H$, $\rho H = \{\rho, \tau_{ac}\}$ et $\rho^2 H = \{\rho^2, \tau_{bc}\}$.

      Ces classes forment une partition, et les réunions de classes forment une topologie. Chaque translation $x \mapsto gx$ envoie la classe $kH$ sur la classe $(gk)H$ : elle est continue, comme sa réciproque $x \mapsto g^{-1}x$. Le passage au symétrique n'est pourtant pas continu : il fixe $\tau_{ac}$ et échange $\rho$ et $\rho^2$, puisque $\rho^3 = \mathrm{id}$, si bien que l'image réciproque de l'ouvert $\rho H$ est $\{\rho^2, \tau_{ac}\}$, qui n'est pas une réunion de classes.

  morphisme-groupes-topologiques:
    - |
      Un [[morphisme-groupes|morphisme de groupes]] bijectif et continu n'est pas toujours un isomorphisme de groupes topologiques. Soit $G$ un groupe qui a au moins deux éléments. Muni de la [[topologie-discrete|topologie discrète]], c'est un [[groupe-topologique|groupe topologique]] (remarque du nœud {{gt-definition|Groupe topologique}}) ; muni de la topologie grossière, aussi, puisque toute application à valeurs dans un espace grossier est continue. L'identité de $G$ discret vers $G$ grossier est un morphisme continu et bijectif, mais sa réciproque n'est pas continue (remarque du nœud {{t-homeo|Homéomorphismes}}).
    - |
      La continuité d'un morphisme dépend des topologies, et pas seulement des groupes. Munissons $G = \mathcal P(\{a, b\})$ de la topologie du premier exemple de [[groupe-topologique|groupe topologique]], dont les ouverts non triviaux sont $H = \{X : b \notin X\}$ et son complémentaire, et $\mathcal P(\{a\})$, $\mathcal P(\{b\})$ de la topologie discrète. Les applications $f(X) = X \cap \{a\}$ et $g(X) = X \cap \{b\}$ sont des morphismes pour la différence symétrique, par distributivité de l'intersection ({{a-anneau|Anneaux}}, (v)), tous deux surjectifs, de [[noyau|noyaux]] à deux éléments.

      Le noyau de $g$ est $H$, et $g^{-1}(\{\{b\}\})$ est son complémentaire : $g$ est continu. Celui de $f$ est $f^{-1}(\{\varnothing\}) = \{\varnothing, \{b\}\}$, qui n'est pas ouvert, alors que $\{\varnothing\}$ l'est dans $\mathcal P(\{a\})$ discret : $f$ n'est pas continu.
    - |
      Deux topologies différentes sur un même groupe peuvent donner des groupes topologiques isomorphes. Sur $G = \mathcal P(\{a, b\})$, soit $\mathcal T_1$ la topologie de l'exemple précédent, de blocs $H_1 = \{\varnothing, \{a\}\}$ et son complémentaire, et $\mathcal T_2$ celle de blocs $H_2 = \{\varnothing, \{b\}\}$ et son complémentaire. L'identité n'est continue dans aucun sens, $H_1$ n'étant pas ouvert pour $\mathcal T_2$, ni $H_2$ pour $\mathcal T_1$.

      Soit $s$ l'échange de $a$ et $b$, et $S(X) = s(X)$. Comme $s$ est une bijection, $S(X \triangle Y) = S(X) \triangle S(Y)$ : $S$ est un automorphisme de groupe, qui est sa propre réciproque et envoie $H_1$ sur $H_2$. C'est donc un isomorphisme de groupes topologiques de $(G, \mathcal T_1)$ sur $(G, \mathcal T_2)$. Plus loin, une fois construit {{r|$\mathbb R$}}, l'application $t \mapsto e^{2i\pi t}$ sera un morphisme continu et surjectif de $(\mathbb R, +)$ sur le cercle des complexes de module $1$, qui n'est pas injectif.
