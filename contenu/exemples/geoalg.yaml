# Exemples du lexique : théorie « Géométrie algébrique » (geoalg).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  spectre-premier:
    - |
      Le spectre de $\lex{anneau-zn}{\mathbb Z/12\mathbb Z}$ a deux points. Un idéal $J$ de $\mathbb Z/12\mathbb Z$ a pour image réciproque dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ un idéal $d\mathbb Z$ qui contient $12\mathbb Z$, avec $d \geqslant 1$ diviseur de $12$, et $J$ est l'image de $d\mathbb Z$, noyau du morphisme surjectif de $\mathbb Z/12\mathbb Z$ sur $\mathbb Z/d\mathbb Z$. Ce quotient est [[anneau-integre|intègre]] si et seulement si $d$ est premier : $\lex{spectre-premier}{\operatorname{Spec}}(\mathbb Z/12\mathbb Z)$ est formé des images de $2\mathbb Z$ et de $3\mathbb Z$. L'image de $4\mathbb Z$, par exemple, contient $2 \cdot 2$ sans contenir $2$.
    - |
      Les cas extrêmes sont instructifs. Le spectre d'un [[corps]] $K$ a un seul point, l'idéal $\{0\}$, seul idéal propre. Le spectre de l'anneau nul est vide, $\varnothing$, puisqu'un idéal premier est par définition distinct de l'anneau. Celui de $\mathbb Z$ est infini : un point $p\mathbb Z$ par nombre premier, et le point $\{0\}$, puisque $\mathbb Z$ est intègre.
    - |
      Le spectre ne voit pas les éléments nilpotents. Dans $A = K[X]/(X^2)$, pour un corps $K$, tout idéal premier contient $\bar X$, puisqu'il contient $\bar X^2 = 0$, et l'idéal $(\bar X)$ est premier, de quotient $K$ : $\operatorname{Spec} A$ a un seul point, comme $\operatorname{Spec} K$. Le produit $K \times K$, au contraire, a deux idéaux premiers. Un idéal premier contient $(1, 0)(0, 1) = 0$, donc $(1, 0)$ ou $(0, 1)$, donc $K \times \{0\}$ ou $\{0\} \times K$, deux idéaux maximaux, de quotient $K$, auxquels il est alors égal. Deux anneaux de dimension $2$ sur $K$ ont ainsi des spectres de tailles différentes.

  topologie-zariski:
    - |
      Sur $\lex{spectre-premier}{\operatorname{Spec}}\lex{ensemble-entiers-relatifs}{\mathbb Z}$, les fermés sont l'espace entier et les ensembles finis de points $p\mathbb Z$, $p$ premier. Tout idéal de $\mathbb Z$ est un $n\mathbb Z$ : $V(0)$ est l'espace entier, et, pour $n \neq 0$, $V(n)$ est l'ensemble fini des $p\mathbb Z$ pour $p$ premier divisant $n$. Réciproquement, un ensemble fini $\{p_1\mathbb Z, \dots, p_k\mathbb Z\}$ est $V(p_1 \cdots p_k)$, et l'ensemble vide est $V(1)$. Les ouverts non vides sont donc les complémentaires des ensembles finis de points $p\mathbb Z$ : ils contiennent tous le point $\{0\}$.
    - |
      La topologie de Zariski n'est en général pas séparée. Dans $\operatorname{Spec}\mathbb Z$, deux ouverts non vides contiennent tous deux le point $\{0\}$, par le premier exemple : deux points distincts n'ont jamais de voisinages disjoints. Le point $\{0\}$ n'est même pas fermé, alors que les singletons le sont dans un espace séparé ({{t-separe|Espaces séparés}}, (i)) : un fermé $V(n)$ qui le contient vérifie $n \in \{0\}$, et c'est l'espace entier.
    - |
      Sur le spectre de $K \times K$, pour un corps $K$, la topologie de Zariski est discrète. Ses deux points sont $\mathfrak p_1 = \{0\} \times K$ et $\mathfrak p_2 = K \times \{0\}$ (troisième exemple de [[spectre-premier|spectre premier]]), et $V\big((1, 0)\big) = \{\mathfrak p_2\}$, $V\big((0, 1)\big) = \{\mathfrak p_1\}$ : chaque point est fermé, donc aussi ouvert. Plus loin, le nœud {{ga-points|Points fermés}} montre que les points fermés d'un spectre sont exactement ses idéaux maximaux, ce qui est le cas ici des deux points.

  quasi-compact:
    - |
      Dans $\lex{spectre-premier}{\operatorname{Spec}}\lex{ensemble-entiers-relatifs}{\mathbb Z}$, les ouverts $D(p)$, pour $p$ premier, recouvrent l'espace, et deux d'entre eux suffisent : $D(2) \cup D(3)$ est le complémentaire de $V(2) \cap V(3) = V(\{2, 3\})$, qui est vide, puisqu'un idéal premier contenant $2$ et $3$ contiendrait $3 - 2 = 1$. On retrouve le mécanisme de la preuve : une écriture de $1$ comme combinaison des $f_i$, ici $1 = 3 - 2$, ne fait intervenir qu'un nombre fini d'entre eux, et les $D(f_i)$ correspondants recouvrent déjà le spectre. Pour $\mathbb Z$, aucun choix n'intervient, cette écriture étant donnée.
    - |
      Un espace infini muni de la [[topologie-discrete|topologie discrète]] n'est pas quasi-compact. Sur $\mathbb Z$ discret, les singletons $\{n\}$ forment un recouvrement ouvert, et aucune sous-famille finie ne recouvre $\mathbb Z$, qui est infini. La quasi-compacité est donc une vraie contrainte, que le spectre satisfait pour tout anneau, au prix, dans le cas général, du théorème de Krull ⋆.
    - |
      Quasi-compact ne veut pas dire [[compact]] au sens de ce site, qui demande aussi la séparation. Sur un ensemble infini $E$, la topologie dont les ouverts sont $\varnothing$ et les complémentaires des parties finies est quasi-compacte : dans un recouvrement, un ouvert non vide $U$ manque un nombre fini de points, et un ouvert du recouvrement pour chacun d'eux complète $U$ en un recouvrement fini. Elle n'est pas séparée, deux ouverts non vides se rencontrant toujours, puisque $E$ n'est pas réunion de deux parties finies. Par le premier exemple de [[topologie-zariski|topologie de Zariski]], c'est la topologie induite sur l'ensemble des points $p\mathbb Z$ de $\operatorname{Spec}\mathbb Z$.

  radical-ideal:
    - |
      Dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, le radical de $72\mathbb Z$ est $6\mathbb Z$. Comme $72 = 2^3 \cdot 3^2$, un entier dont une puissance est multiple de $72$ est divisible par $2$ et par $3$, par le lemme d'Euclide, donc par $6$ ; réciproquement, $6^3 = 216 = 3 \cdot 72$. Le radical efface les exposants de la décomposition en facteurs premiers, et ne garde que les nombres premiers qui divisent $72$.
    - |
      Dans $K[X, Y]$, pour un corps $K$, le radical de $I = (X^2, XY)$ est $(X)$. D'une part, pour tout $P \in K[X, Y]$, $(PX)^2 = P^2X^2$ est dans $I$ : $\sqrt I$ contient l'idéal $(X)$. D'autre part, $(X)$ est premier, de quotient isomorphe à l'anneau intègre $K[Y]$, et contient $I$ : si $Q^n \in I \subset (X)$, alors $Q \in (X)$, et $\sqrt I \subset (X)$. L'idéal $I$ est strictement plus petit que son radical, puisque $X \notin I$, ses éléments étant des combinaisons de $X^2$ et de $XY$, sans terme de degré $1$.
    - |
      Le radical d'un produit est l'intersection des radicaux. Dans $\mathbb Z$, $\sqrt{(4)(6)} = \sqrt{24\mathbb Z} = 6\mathbb Z$, et $\sqrt{4\mathbb Z} \cap \sqrt{6\mathbb Z} = 2\mathbb Z \cap 6\mathbb Z = 6\mathbb Z$ ; en général, $x^n \in I$ et $x^m \in J$ donnent $x^{n+m} \in IJ$, et l'inclusion $IJ \subset I \cap J$ donne l'autre sens. Plus loin, le Nullstellensatz ({{ga-nullstellensatz|Nullstellensatz}}, (ii)) identifie, sur un corps algébriquement clos, le radical de $J$ à l'idéal des polynômes nuls sur $Z(J)$ : pour l'idéal $(X^2, XY)$ du deuxième exemple, $Z(J)$ est la droite $X = 0$, et $I(Z(J)) = (X)$.

  ensemble-algebrique:
    - |
      Sur le corps $K = \lex{anneau-zn}{\mathbb Z/5\mathbb Z}$, la parabole $Z(X_2 - X_1^2)$ de $K^2$ a cinq points, $(x, x^2)$ pour $x \in K$, et la droite $Z(X_2)$ en a cinq aussi. Le produit des deux équations donne la réunion, $Z\big(X_2(X_2 - X_1^2)\big) = Z(X_2) \cup Z(X_2 - X_1^2)$, puisqu'un produit s'annule dans un corps si et seulement si l'un des facteurs s'annule ; la famille des deux équations donne l'intersection, $Z(X_2, X_2 - X_1^2) = \{(0, 0)\}$. La réunion a donc $5 + 5 - 1 = 9$ points.
      ```schema lex-ensemble-algebrique-1
      Dans $K^2$, pour $K = \mathbb Z/5\mathbb Z$, la parabole $x_2 = x_1^2$ a ses cinq points en rouge et la droite $x_2 = 0$ ses cinq points en bleu ; l'origine, commune aux deux, est en rouge cerclé de bleu, et les seize autres points sont en gris. La réunion, ensemble des zéros du produit, a neuf points.
      ```
    - |
      Sur un corps infini, certaines parties ne sont pas algébriques. Pour $n = 1$, un polynôme non nul n'a qu'un nombre fini de [[racine-polynome|racines]] ({{pol-racines|Racines}}) : $Z(S)$ est fini, sauf si $S \subset \{0\}$, auquel cas $Z(S) = K$, et une partie finie $F$ est $Z\big(\prod_{c \in F}(X - c)\big)$. Les ensembles algébriques de $K$ sont donc les parties finies et $K$ lui-même, et $K$ privé d'un point n'en est pas un, puisqu'il est infini et différent de $K$. C'est le cas, par exemple, pour le [[corps-fractions|corps des fractions]] de $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, ou pour celui de $(\mathbb Z/2\mathbb Z)[T]$.
    - |
      Sur un corps qui n'a qu'un nombre fini d'éléments, au contraire, tout sous-ensemble de $K^n$ est algébrique : un singleton $\{a\}$ est $Z(X_1 - a_1, \dots, X_n - a_n)$, et une réunion finie d'ensembles algébriques l'est encore, par (ii). Un même ensemble a alors des équations inattendues. Sur $K = \mathbb Z/p\mathbb Z$, le polynôme non nul $P = \prod_{c \in K}(X - c)$ s'annule en tout point de $K$, si bien que $Z(P) = K = Z(0)$, et $I(K)$ contient $P$ : l'idéal des polynômes nuls sur $K$ n'est pas réduit à $0$.

  corps-algebriquement-clos:
    - |
      Aucun corps qui n'a qu'un nombre fini d'éléments n'est algébriquement clos. Si $K$ a pour éléments $c_1, \dots, c_q$, le polynôme
      $$P = (X - c_1) \cdots (X - c_q) + 1,$$
      de degré $q \geqslant 2$, donc non constant, vaut $1$ en chaque $c_i$ : il n'a pas de [[racine-polynome|racine]] dans $K$. C'est l'argument d'Euclide pour l'infinité des nombres premiers, transporté aux racines : un corps algébriquement clos est infini.
    - |
      Le corps $K(T)$ des fractions de $K[T]$, pour un corps $K$, n'est pas algébriquement clos : le polynôme $X^2 - T$ n'y a pas de racine. Si $(f/g)^2 = T$, avec $f, g \in K[T]$ et $g \neq 0$, alors $f^2 = Tg^2$, et la comparaison des [[degre-polynome|degrés]] donne $2\deg f = 1 + 2\deg g$, un nombre pair égal à un nombre impair. Ajouter une indéterminée ne rend donc pas un corps algébriquement clos, même si $K$ l'est.
    - |
      Sans corps algébriquement clos, la forme faible du Nullstellensatz tombe. Sur $K = \mathbb Z/2\mathbb Z$, le polynôme $X^2 + X + 1$ vaut $1$ en $0$ et en $1$ : de degré $2$ sans racine, il est [[polynome-irreductible|irréductible]] ({{pol-irreductibles|Irréductibles}}, (iii)), et l'idéal qu'il engendre dans $K[X]$ est maximal. Ce n'est pas un $\mathfrak m_a = (X - a)$, puisqu'il ne contient aucun polynôme de degré $1$, et son ensemble de zéros est vide, alors qu'il est différent de $K[X]$ : les deux conclusions de (i) sont fausses.

  partie-v-spectre:
    - |
      Dans $\lex{spectre-premier}{\operatorname{Spec}}\lex{ensemble-entiers-relatifs}{\mathbb Z}$, la partie $\lex{partie-v-spectre}{V}(12)$ est formée des idéaux premiers $p\mathbb Z$ qui contiennent $12$, c'est-à-dire tels que $p$ divise $12$ : $V(12) = \{2\mathbb Z, 3\mathbb Z\}$. L'idéal $\{0\}$ n'y est pas, puisqu'il ne contient pas $12$. De même, $V(\{4, 6\}) = V(2) = \{2\mathbb Z\}$, puisqu'un idéal qui contient $4$ et $6$ contient $6 - 4 = 2$ ; enfin $V(0)$ est le spectre entier, et $V(1)$ est vide.
    - |
      Sur $\operatorname{Spec}\mathbb Z$, la réunion de deux parties $V$ s'obtient par le produit, leur intersection par la réunion des parties. On a $V(2) \cup V(3) = \{2\mathbb Z, 3\mathbb Z\} = V(6)$, puisqu'un nombre premier divise $6$ si et seulement s'il est égal à $2$ ou à $3$. En revanche, $V(2) \cap V(3) = V(\{2, 3\})$ est vide : un idéal premier qui contiendrait $2$ et $3$ contiendrait $3 - 2 = 1$. Deux équations sans « zéro commun » donnent des parties disjointes.
    - |
      L'ensemble $V(S)$ ne détermine pas l'idéal engendré par $S$. Dans $\operatorname{Spec}\mathbb Z$, $V(4) = V(2) = \{2\mathbb Z\}$ alors que $4\mathbb Z \neq 2\mathbb Z$ ; dans $\operatorname{Spec} K[X]$, pour un corps $K$, $V(X^2) = V(X)$, puisqu'un idéal premier qui contient $X^2$ contient $X$. Plus loin, le nœud {{ga-nilradical|Nilradical}}, (ii), montre que $V(I)$ ne connaît que le radical de $I$ : $V(I) \subset V(J)$ si et seulement si $\sqrt J \subset \sqrt I$.

  engendre-algebre:
    - |
      Soit $K = \lex{anneau-zn}{\mathbb Z/3\mathbb Z}$. Le polynôme $X^2 + 1$, de degré $2$, ne s'annule pas sur $K$, puisqu'il y prend les valeurs $1, 2, 2$ : il est [[polynome-irreductible|irréductible]] ({{pol-irreductibles|Irréductibles}}, (iii)), l'idéal qu'il engendre dans $K[X]$, anneau principal, est maximal, et $L = K[X]/(X^2 + 1)$ est un corps ({{a-premier-maximal|Idéaux premiers, maximaux}}). La classe $x$ de $X$ engendre $L$ comme $K$-algèbre : $L = K[x]$, et la division euclidienne par $X^2 + 1$ montre que $(1, x)$ est une base, si bien que $L$ a neuf éléments. C'est le cas le plus simple du lemme : une $K$-algèbre engendrée par un élément, qui est un corps, est de dimension finie.
    - |
      Un corps engendré comme corps par un élément peut ne l'être, comme algèbre, par aucune partie finie. Le [[corps-fractions|corps des fractions]] $L = K(T)$ de $K[T]$, pour un corps $K$, est engendré comme corps par $T$, mais $K[T]$, image de l'évaluation en $T$, n'est que l'anneau des polynômes, qui ne contient pas $1/T$. Aucune partie finie ne suffit : les $T^k$, $k \in \lex{ensemble-entiers-naturels}{\mathbb N}$, sont libres sur $K$, donc $L$ n'est pas de dimension finie, et le lemme de Zariski interdit que $L$ soit engendré comme $K$-algèbre par un nombre fini d'éléments.

  nilradical:
    - |
      Dans $\lex{anneau-zn}{\mathbb Z/12\mathbb Z}$, le nilradical est $\{0, 6\}$ : la classe de $x$ est nilpotente si et seulement si une puissance de $x$ est multiple de $12$, c'est-à-dire si $2$ et $3$ divisent $x$, par le lemme d'Euclide. C'est aussi l'intersection des deux idéaux premiers de $\mathbb Z/12\mathbb Z$, images de $2\mathbb Z$ et de $3\mathbb Z$ (premier exemple de [[spectre-premier|spectre premier]]), formées des classes paires et des classes multiples de $3$ : on le constate ici directement, sans recourir au point (i).
    - |
      Un anneau [[anneau-integre|intègre]] a un nilradical nul, puisque $x^n = 0$ y entraîne $x = 0$. L'anneau $K[X]/(X^2)$, pour un corps $K$, a pour nilradical l'idéal $(\bar X)$ : $\bar X^2 = 0$, et un élément $a + b\bar X$ avec $a \neq 0$ n'est pas nilpotent, puisque sa puissance $n$-ième vaut $a^n + na^{n-1}b\bar X$, de terme constant $a^n \neq 0$. Le nilradical décrit ce que le spectre ne voit pas : $K$ et $K[X]/(X^2)$ ont tous deux un spectre à un point.
    - |
      Le nilradical n'est pas l'ensemble des diviseurs de zéro. Dans $\mathbb Z/6\mathbb Z$, $2 \cdot 3 = 0$, mais le nilradical est nul : une puissance de $x$ est multiple de $6$ seulement si $2$ et $3$ divisent $x$, comme dans le premier exemple. Les éléments $2$ et $3$ sont des diviseurs de zéro sans être nilpotents. Un nilpotent non nul, en revanche, est toujours diviseur de zéro : si $x^n = 0$ avec $n$ minimal, alors $n \geqslant 2$ et $x \cdot x^{n-1} = 0$ avec $x^{n-1} \neq 0$.

  topologie-zariski-kn:
    - |
      Sur un corps infini $K$, pour $n = 1$, les fermés de la topologie de Zariski sont les parties finies et $K$ (deuxième exemple d'[[ensemble-algebrique|ensemble algébrique]]) : les ouverts non vides sont les complémentaires des parties finies. Cette topologie n'est pas [[separe|séparée]] : deux ouverts non vides $K \setminus F$ et $K \setminus F'$, avec $F$ et $F'$ finis, se rencontrent, puisque $K$ n'est pas la réunion de deux parties finies. Elle est même moins fine que toute topologie séparée sur $K$, puisque les parties finies, réunions finies de singletons, sont fermées dans un espace séparé ({{t-separe|Espaces séparés}}, (i)).
    - |
      La topologie de Zariski de $K^2$ n'est pas la [[topologie-produit|topologie produit]] de deux copies de celle de $K$. Pour $K$ infini, la diagonale $\Delta = Z(X_1 - X_2)$ est un fermé de Zariski de $K^2$. Elle n'est pas fermée pour la topologie produit : par {{t-separe|Espaces séparés}}, (ii), elle le serait si et seulement si $K$, muni de la topologie de Zariski, était séparé, ce qu'exclut le premier exemple. Inversement, pour $F$ fini, $(K \setminus F) \times K$ est le complémentaire de $Z\big(\prod_{c \in F}(X_1 - c)\big)$, et de même pour le second facteur : les ouverts de la topologie produit, réunions d'intersections de deux tels ouverts, sont des ouverts de Zariski. La topologie de Zariski de $K^2$ est donc strictement plus fine que la topologie produit.
    - |
      Sur un corps qui n'a qu'un nombre fini d'éléments, la topologie de Zariski de $K^n$ est la topologie discrète. Chaque singleton $\{a\}$ est fermé, égal à $Z(X_1 - a_1, \dots, X_n - a_n)$, et toute partie de $K^n$, finie, est une réunion finie de singletons, donc fermée par le point (ii) ; son complémentaire l'est aussi, et toute partie est ouverte. Les deux cas, $K$ fini et $K$ infini, donnent ainsi une topologie discrète et une topologie qui n'est même pas séparée.

  ideal-radical:
    - |
      Dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, l'idéal $30\mathbb Z$ est radical, et $18\mathbb Z$ ne l'est pas. Si $x^n$ est multiple de $30 = 2 \cdot 3 \cdot 5$, chacun des nombres premiers $2$, $3$, $5$ divise $x^n$, donc $x$, par le lemme d'Euclide, et $30$ divise $x$. Au contraire, $6^2 = 36 = 2 \cdot 18$ est dans $18\mathbb Z$, sans que $6$ y soit. Le même argument montre qu'un idéal $n\mathbb Z$, $n \geqslant 2$, est radical quand $n$ n'a pas de facteur carré ; si $p^2$ divise $n$, au contraire, $(n/p)^2 = n \cdot n/p^2$ est dans $n\mathbb Z$, sans que $n/p$ y soit.
    - |
      Dans $K[X]$, pour un corps $K$, l'idéal $(X(X - 1))$ est radical, et $(X^2)$ ne l'est pas. Si $X(X - 1)$ divise $Q^n$, les polynômes irréductibles $X$ et $X - 1$ divisent $Q^n$, donc $Q$, et leur produit divise $Q$, puisqu'ils sont premiers entre eux. Pour $(X^2)$, le polynôme $X$ a son carré dans l'idéal sans y être. Le premier idéal décrit les deux points $0$ et $1$ ; le second, le point $0$ « compté deux fois ».
    - |
      Une somme d'idéaux radicaux n'est pas toujours radicale. Dans $K[X, Y]$, les idéaux $(Y)$ et $(Y - X^2)$ sont premiers, donc radicaux : les quotients sont isomorphes à $K[X]$, intègre, par $Y \mapsto 0$ et $Y \mapsto X^2$. Leur somme $(Y, Y - X^2) = (Y, X^2)$ contient $X^2$ mais pas $X$, puisque le quotient $K[X, Y]/(Y, X^2)$ est isomorphe à $K[X]/(X^2)$, où la classe de $X$ n'est pas nulle. La droite $Y = 0$ et la parabole $Y = X^2$ n'ont en commun que l'origine, et l'idéal somme, comme $(X^2)$ dans le deuxième exemple, la compte deux fois. Plus loin, le nœud {{ga-correspondance|Dictionnaire}} met en bijection les idéaux radicaux et les ensembles algébriques, sur un corps algébriquement clos.
