# Exemples du lexique : théorie « Équations différentielles » (edo).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  cube-dyadique:
    - |
      En dimension $1$, le point $\frac13$ appartient, à chaque niveau $k$, à un seul cube dyadique, puisque ceux de niveau $k$ forment une partition. Ce sont $]0, 1]$, $]0, \frac12]$, $]\frac14, \frac12]$, $]\frac14, \frac38]$, $]\frac5{16}, \frac38]$… : chacun est la moitié gauche ou droite du précédent, et ce choix, gauche, droite, gauche, droite, écrit le développement binaire $0{,}0101\ldots$ de $\frac13$.
      ```schema lex-cube-dyadique-1
      Les cubes dyadiques de niveaux $0$ à $4$ qui contiennent $\frac13$, en rouge, de haut en bas : chacun est l'une des deux moitiés du précédent, l'autre moitié étant en gris. Leurs longueurs sont divisées par $2$ à chaque niveau, et leurs extrémités droites, fermées, tendent vers $\frac13$.
      ```
    - |
      La décomposition de l'ouvert $U = \,]0, 1[$ de $\mathbb R$ se calcule entièrement. Aucun cube de niveau $0$ ou $1$ n'a son adhérence dans $U$. Au niveau $k \geqslant 2$, les cubes retenus sont exactement $]2^{-k}, 2^{1-k}]$ et $]1 - 2^{1-k}, 1 - 2^{-k}]$, qui s'accumulent vers les deux bouts. Ils sont disjoints, leur réunion est $]0, \frac12] \cup \,]\frac12, 1[ = U$, et leurs longueurs ont pour somme $2\sum_{k \geqslant 2} 2^{-k} = 1$.
      ```schema lex-cube-dyadique-2
      Les cubes de $\mathcal Q(]0, 1[)$, de niveaux $2$ à $7$ : deux par niveau, en couleurs alternées, de longueur divisée par $2$ à chaque niveau, de plus en plus près des extrémités $0$ et $1$, en creux, qu'ils n'atteignent jamais.
      ```
    - |
      La décomposition demande un ouvert. Pour le segment $[0, 1]$, le seul cube dyadique dont l'adhérence soit contenue dans $[0, 1]$ sans être contenu dans un cube plus grand de même propriété est $]0, 1]$, de niveau $0$ ; la réunion obtenue est $]0, 1]$, et le point $0$ manque. Aucune famille de cubes dyadiques ne convient d'ailleurs, puisque tout cube qui contient $0$ contient aussi des points négatifs.

  transvection:
    - |
      Les transvections à gauche sont les opérations du pivot sur les lignes. Pour $A$ de lignes $(1, 2)$ et $(3, 4)$, la matrice $T_{21}(-3)A$ a pour lignes $(1, 2)$ et $(0, -2)$ : on a retranché trois fois la première ligne de la seconde, ce qui annule le coefficient sous le pivot. Le déterminant, $-2$, n'a pas changé, puisque $\det T_{21}(-3) = 1$.
    - |
      Le côté où l'on multiplie compte. Pour la même matrice $A$, le produit $AT_{12}(-2)$ a pour lignes $(1, 0)$ et $(3, -2)$ : on a retranché deux fois la première colonne de la seconde. À gauche, la même transvection donne $T_{12}(-2)A$, de lignes $(-5, -6)$ et $(3, 4)$, où c'est la seconde ligne qui modifie la première : à droite, les indices s'échangent.
    - |
      Deux transvections de mêmes indices commutent, puisque $T_{12}(a)T_{12}(b) = T_{12}(a + b)$, mais deux transvections quelconques ne commutent pas :
      $$\begin{aligned} T_{12}(1)T_{21}(1) &= \begin{pmatrix} 2 & 1 \\ 1 & 1 \end{pmatrix}, \\ T_{21}(1)T_{12}(1) &= \begin{pmatrix} 1 & 1 \\ 1 & 2 \end{pmatrix}. \end{aligned}$$
      Plus loin, on verra que chacune conserve la mesure de Lebesgue, son déterminant valant $1$ ({{cv-lineaire|Image linéaire}}, (ii)) ; leurs produits, de déterminant $1$, la conservent donc aussi.

  jacobien:
    - |
      Le jacobien peut être négatif ; c'est sa valeur absolue qui mesure la dilatation. L'application linéaire $\varphi(x, y) = (x + y, x - y)$ a pour jacobien $-2$ en tout point : elle renverse l'orientation et double les aires, si bien que le carré $]0, 1]^2$ a pour image un carré de côté $\sqrt2$, d'aire $2 = |{-2}|$ ({{cv-lineaire|Image linéaire}}, (ii)).
    - |
      Un [[diffeomorphisme|difféomorphisme]] non linéaire peut conserver les aires. L'application $\varphi(x, y) = (x, y + x^2)$ est un $C^1$-difféomorphisme de $\mathbb R^2$, de réciproque $(u, v) \mapsto (u, v - u^2)$, et son jacobien vaut $1$ partout. Elle déforme le carré $]0, 1]^2$ en une bande courbe $\{0 < u \leqslant 1,\ u^2 < v \leqslant u^2 + 1\}$, dont chaque section verticale a pour longueur $1$ : l'aire reste $1$, comme l'annonce le point (i) de {{cv-changement|Changement de variables}}.
      ```schema lex-jacobien-2
      Le carré unité, en bleu, et son image par $(x, y) \mapsto (x, y + x^2)$, en rouge. Le segment vertical d'abscisse $\frac34$ du carré, en pointillé bleu, a pour image le segment rouge épais, translaté vers le haut de $\frac9{16}$, comme l'indique la flèche grise, sans changer de longueur ; il en va de même de chaque segment vertical, si bien que l'aire reste $1$.
      ```
    - |
      Un jacobien partout non nul ne suffit pas : la formule demande l'injectivité. L'application $\varphi(x, y) = (e^x\cos y, e^x\sin y)$ a pour jacobien $e^{2x} > 0$, mais $\varphi(x, y + 2\pi) = \varphi(x, y)$. Les pavés $E_1 = \,]0, 1] \times \,]0, 2\pi]$ et $E = \,]0, 1] \times \,]0, 4\pi]$ ont donc la même image, alors que
      $$\int_E |J_\varphi| = 2\int_{E_1} |J_\varphi| = 2\pi(e^2 - 1),$$
      valeur finie et non nulle : l'égalité $\lambda(\varphi(E)) = \int_E |J_\varphi|$ est fausse pour l'un des deux.

  coordonnees-polaires:
    - |
      Les coordonnées polaires simplifient les fonctions qui ne dépendent que de la distance à l'origine. Pour le disque $\Delta_R$ de centre $0$ et de rayon $R$, la formule (ii) de {{cv-polaires|Coordonnées polaires}}, appliquée à $f = (x^2 + y^2)\mathbf 1_{\Delta_R}$, donne
      $$\int_{\Delta_R} (x^2 + y^2) = \int_{-\pi}^{\pi}\!\int_0^R r^3\,dr\,d\theta = \frac{\pi R^4}2.$$
      Le facteur $r$ fait passer l'exposant de $2$ à $3$, et le résultat croît comme $R^4$, une puissance de plus que l'aire.
    - |
      L'intégrabilité d'une fonction radiale se lit sur l'exposant de $r$. Par polaires,
      $$\begin{aligned} \int_{\mathbb R^2} \frac{d\lambda}{(1 + x^2 + y^2)^2} &= 2\pi\int_0^{+\infty} \frac{r\,dr}{(1 + r^2)^2} \\ &= \pi, \end{aligned}$$
      alors que $\frac1{1 + x^2 + y^2}$ n'est pas intégrable sur $\mathbb R^2$, puisque $\int_0^{+\infty} \frac{r}{1 + r^2}\,dr = +\infty$. Sur $\mathbb R$, au contraire, $\frac1{1 + x^2}$ est intégrable, d'intégrale $\pi$ : en dimension $2$, il faut décroître plus vite qu'en dimension $1$.
    - |
      L'application $P$ n'est pas un difféomorphisme sur $[0, +\infty[ \times [-\pi, \pi]$ : elle envoie tout le segment $\{0\} \times [-\pi, \pi]$ sur l'origine, où son jacobien $r$ s'annule, et identifie les côtés $\theta = \pm\pi$. On l'a donc restreinte à la bande ouverte, au prix de la demi-droite $D$, qui est négligeable et ne change aucune intégrale. Plus loin, cette formule donnera l'intégrale de Gauss $\int_{\mathbb R} e^{-x^2}\,dx = \sqrt\pi$ ({{cv-gaussienne|Intégrale de Gauss}}).

  courbe-parametree:
    - |
      Une courbe paramétrée est une application, et non son image. Les courbes $\gamma_1(t) = (\cos t, \sin t)$ et $\gamma_2(t) = (\cos 2t, \sin 2t)$, définies sur $\mathbb R$, ont pour image le même cercle unité, mais la seconde va deux fois plus vite : sur $]0, 2\pi[$, $\gamma_1$ fait un tour, privé d'un point, et $\gamma_2$ en fait deux. Leurs [[longueur-courbe|longueurs]] sur cet intervalle, $2\pi$ et $4\pi$, le disent.
    - |
      Une courbe de classe $C^2$ peut avoir une image anguleuse. La courbe $\gamma(t) = (t^3, |t|^3)$ est de classe $C^2$, de dérivées $(3t^2, 3t|t|)$ et $(6t, 6|t|)$, et son image est le graphe de la valeur absolue, qui a un coin en $0$. La vitesse s'y annule : la courbe s'arrête au coin, change de direction et repart, ce que la régularité interdira.
      ```schema lex-courbe-parametree-2
      La courbe $(t^3, |t|^3)$, en rouge, a pour image le graphe de $|x|$, avec un coin à l'origine ; les vitesses en $t = \pm\frac12$ et $t = \pm1$, en bleu, raccourcissent à l'approche du coin et s'annulent en $t = 0$.
      ```
    - |
      Le graphe d'une fonction $f : I \to \mathbb R$ de classe $C^k$ est le cas le plus simple : la courbe $t \mapsto (t, f(t))$ est de classe $C^k$, et sa vitesse $(1, f'(t))$ ne s'annule jamais, de sorte qu'elle est régulière. Plus loin, toute courbe régulière se reparamétrera par sa longueur ({{cb-abscisse|Abscisse curviligne}}).

  longueur-courbe:
    - |
      L'arc de parabole $\gamma(t) = (t, t^2)$, $t \in [0, 1]$, a pour longueur
      $$\begin{aligned} L_0^1(\gamma) &= \int_0^1 \sqrt{1 + 4t^2}\,dt \\ &= \frac{\sqrt5}2 + \frac{\ln(2 + \sqrt5)}4, \end{aligned}$$
      comme on le vérifie en dérivant le second membre ; elle est comprise entre $1{,}478$ et $1{,}479$. Elle dépasse la corde $\sqrt2 \approx 1{,}414$, de l'arc tendu entre $(0, 0)$ et $(1, 1)$, comme l'annonce l'inégalité de la corde ({{cb-courbes|Courbes et longueur}}, (iii)).
      ```schema lex-longueur-courbe-1
      L'arc de parabole de $(0, 0)$ à $(1, 1)$, en rouge, de longueur comprise entre $1{,}478$ et $1{,}479$, et la corde qui le sous-tend, en bleu, de longueur $\sqrt2$.
      ```
    - |
      La chaînette $\gamma(t) = (t, \operatorname{ch} t)$, où $\operatorname{ch} t = \frac{e^t + e^{-t}}2$ et $\operatorname{sh} t = \frac{e^t - e^{-t}}2$, a une longueur qui se calcule exactement. Comme $\operatorname{ch}^2 - \operatorname{sh}^2 = 1$, sa vitesse $(1, \operatorname{sh} t)$ a pour norme $\operatorname{ch} t$, et sa longueur sur $[0, a]$ est $\operatorname{sh} a$. C'est l'une des rares courbes dont la longueur s'écrit sans intégrale.
    - |
      L'inégalité de la corde est stricte dès que la courbe revient en arrière. La courbe $\gamma(t) = (\sin t, 0)$, $t \in [0, \pi]$, va de $(0, 0)$ à $(1, 0)$ puis revient : sa longueur $\int_0^\pi |\cos t|\,dt = 2$ compte l'aller et le retour, alors que la corde est nulle. Ce n'est pas un défaut de l'inégalité : la longueur est celle du trajet, non celle de l'image, qui est le segment $[0, 1] \times \{0\}$.

  abscisse-curviligne:
    - |
      La chaînette $(t, \operatorname{ch} t)$ a pour abscisse curviligne d'origine $0$ la fonction $s(t) = \operatorname{sh} t$, puisque sa vitesse a pour norme $\operatorname{ch} t$. La réciproque de $\operatorname{sh}$ est $\sigma \mapsto \ln(\sigma + \sqrt{1 + \sigma^2})$, comme on le voit en résolvant $e^t - e^{-t} = 2\sigma$, équation du second degré en $e^t$, d'où la chaînette paramétrée par la longueur :
      $$\delta(\sigma) = \Big(\ln\big(\sigma + \sqrt{1 + \sigma^2}\big),\ \sqrt{1 + \sigma^2}\Big).$$
      On vérifie en dérivant que $\|\delta'\| = 1$ : la seconde coordonnée est simplement $\sqrt{1 + \sigma^2}$.
    - |
      Une courbe qui fait une infinité de tours peut avoir une longueur finie. La spirale $\gamma(t) = e^{-t}(\cos t, \sin t)$ a une vitesse de norme $\sqrt2\,e^{-t}$, et son abscisse curviligne d'origine $0$ est $s(t) = \sqrt2(1 - e^{-t})$, qui envoie $\mathbb R$ sur $J = \,]{-\infty}, \sqrt2[$. Ce qui reste à parcourir le long de la courbe jusqu'à l'origine, à partir de $\gamma(0) = (1, 0)$, vaut donc $\sqrt2$, bien que la spirale tourne indéfiniment.
      ```schema lex-abscisse-curviligne-2
      La spirale $e^{-t}(\cos t, \sin t)$, en rouge, part de $(1, 0)$ et fait une infinité de tours autour de l'origine, en creux, qu'elle n'atteint jamais ; sa longueur totale, à partir de $(1, 0)$, n'est que $\sqrt2$, contre $1$ pour le segment bleu qui va de ce point à l'origine.
      ```
    - |
      L'hypothèse de régularité est indispensable. Pour la courbe $\gamma(t) = (t^3, 0)$, qui n'est pas régulière en $0$, la fonction $s(t) = \int_0^t 3u^2\,du = t^3$ est encore une bijection de $\mathbb R$ sur $\mathbb R$, mais pas un difféomorphisme, sa réciproque $\sigma \mapsto \sigma^{1/3}$, prolongée par imparité, n'étant pas dérivable en $0$. Le point (i) de {{cb-abscisse|Abscisse curviligne}} tombe, bien que $\gamma \circ s^{-1}(\sigma) = (\sigma, 0)$ soit ici parfaitement régulière.

  courbure-courbe:
    - |
      La parabole $\gamma(t) = (t, t^2)$ a pour courbure, par la formule en paramétrage quelconque ({{cb-courbure-plane|Courbure plane}}, (iii)),
      $$\kappa(t) = \frac{2}{(1 + 4t^2)^{3/2}}.$$
      Elle vaut $2$ au sommet, où la parabole se confond au mieux avec un cercle de rayon $\frac12$, et tend vers $0$ quand $|t| \to +\infty$ : loin du sommet, la parabole ressemble de plus en plus à une droite.
      ```schema lex-courbure-courbe-1
      La parabole $y = x^2$, en rouge, et, en bleu, le cercle de rayon $\frac12$ et de centre $(0, \frac12)$, qui épouse la parabole au sommet : leur courbure commune y vaut $2$. Ailleurs, la parabole s'ouvre et sa courbure décroît.
      ```
    - |
      Pour l'ellipse $\gamma(t) = (2\cos t, \sin t)$, la même formule donne
      $$\kappa(t) = \frac{2}{(4\sin^2 t + \cos^2 t)^{3/2}},$$
      soit $2$ aux extrémités du grand axe et $\frac14$ aux extrémités du petit axe. La courbe tourne vite là où elle est pointue, lentement là où elle est plate, et le rapport des deux valeurs, $8$, est le cube du rapport des axes.
    - |
      Le signe de la courbure plane change aux points d'inflexion. Pour $\gamma(t) = (t, t^3)$, on trouve
      $$\kappa(t) = \frac{6t}{(1 + 9t^4)^{3/2}},$$
      négative pour $t < 0$, où la courbe tourne à droite, et positive pour $t > 0$, où elle tourne à gauche. Plus loin, la courbure, donnée en fonction de l'abscisse curviligne, déterminera la courbe à déplacement près ({{cb-planes|Courbes planes}}).
      ```schema lex-courbure-courbe-3
      La courbe $y = x^3$, en rouge, et sa courbure $\kappa(t)$, en bleu, tracée à la même abscisse : négative à gauche de l'inflexion, où la courbe tourne à droite, positive à droite, nulle en $0$.
      ```

  repere-frenet:
    - |
      Pour le cercle $\delta(\sigma) = (R\cos\frac\sigma R, R\sin\frac\sigma R)$, parcouru dans le sens direct par la longueur, on a $T = (-\sin\frac\sigma R, \cos\frac\sigma R)$ et $N = j(T) = -\frac\delta R$ : la normale pointe vers le centre. La dérivée $T' = \frac1R N$ redonne la courbure $\frac1R$.
    - |
      La normale $N$ est la tangente tournée d'un quart de tour, et non la direction vers laquelle la courbe se creuse. Pour le même cercle parcouru dans le sens indirect, $\delta(\sigma) = (R\cos\frac\sigma R, -R\sin\frac\sigma R)$, on trouve $N = \frac\delta R$, qui pointe vers l'extérieur, et $T' = -\frac1R N$ : la courbure vaut $-\frac1R$. C'est le prix d'une courbure algébrique.
      ```schema lex-repere-frenet-2
      Le même cercle parcouru dans les deux sens : à gauche, dans le sens direct, $T$ en rouge et $N$ en bleu, qui pointe vers le centre ; à droite, dans le sens indirect, $N$ pointe vers l'extérieur, et la courbure est négative.
      ```
    - |
      Plus loin, dans l'espace, le repère de Frenet aura trois vecteurs ({{cb-frenet|Repère de Frenet}}). Pour la courbe $\delta(\sigma) = \big(\cos\frac\sigma{\sqrt2}, \sin\frac\sigma{\sqrt2}, \frac\sigma{\sqrt2}\big)$, paramétrée par la longueur, l'accélération a pour norme $\frac12$, la normale principale $N = (-\cos\frac\sigma{\sqrt2}, -\sin\frac\sigma{\sqrt2}, 0)$ est horizontale et pointe vers l'axe, et la binormale vaut $B = \frac1{\sqrt2}(\sin\frac\sigma{\sqrt2}, -\cos\frac\sigma{\sqrt2}, 1)$.

  produit-vectoriel:
    - |
      Pour la base canonique, $e_1 \wedge e_2 = e_3$, $e_2 \wedge e_3 = e_1$ et $e_3 \wedge e_1 = e_2$. Le produit vectoriel n'est pas associatif : $(e_1 \wedge e_1) \wedge e_2 = 0$, puisque $e_1 \wedge e_1 = 0$, alors que $e_1 \wedge (e_1 \wedge e_2) = e_1 \wedge e_3 = -e_2$. Il n'a pas non plus d'élément neutre : $u \wedge e$ est orthogonal à $u$, et ne peut valoir $u$ que si $u = 0$.
    - |
      La norme du produit vectoriel est l'aire du parallélogramme construit sur les deux vecteurs. Pour $u = (1, 2, 0)$ et $v = (0, 1, 3)$, on trouve $u \wedge v = (6, -3, 1)$, orthogonal à $u$ et à $v$, de norme $\sqrt{46}$, et l'identité du point (i) de {{cb-frenet|Repère de Frenet}} se vérifie : $\|u\|^2\|v\|^2 - \langle u, v \rangle^2 = 5 \cdot 10 - 2^2 = 46$.
    - |
      L'égalité $A(u \wedge v) = Au \wedge Av$ demande $\det A = 1$. Pour $A = -I$, orthogonale de déterminant $-1$, on a $Au \wedge Av = (-u) \wedge (-v) = u \wedge v$, alors que $A(u \wedge v) = -u \wedge v$ : la symétrie par rapport à l'origine renverse le sens du produit vectoriel. Parmi les matrices orthogonales, seules celles de déterminant $1$ conservent donc le produit vectoriel : si $\det A = -1$, $-A$ est orthogonale de déterminant $1$, et $A(u \wedge v) = -(-A)(u \wedge v) = -(Au \wedge Av)$.

  torsion-courbe:
    - |
      Pour la cubique gauche $\gamma(t) = (t, t^2, t^3)$, la formule du point (iii) de {{cb-frenet|Repère de Frenet}} donne
      $$\tau(t) = \frac{\det(\gamma', \gamma'', \gamma''')}{\|\gamma' \wedge \gamma''\|^2} = \frac{3}{9t^4 + 9t^2 + 1}.$$
      Elle est strictement positive, maximale et égale à $3$ en $t = 0$, et tend vers $0$ à l'infini : la courbe n'est contenue dans aucun plan, mais elle se tord de moins en moins.
    - |
      La torsion change de signe dans un miroir, la courbure non. La courbe $(a\cos t, a\sin t, bt)$, avec $a > 0$, a pour torsion $\frac{b}{a^2 + b^2}$, et son image par la symétrie $z \mapsto -z$, qui est $(a\cos t, a\sin t, -bt)$, a la torsion $-\frac{b}{a^2 + b^2}$, avec la même courbure. Le signe de la torsion distingue une vis à droite d'une vis à gauche.
      ```schema lex-torsion-courbe-2
      En projection parallèle, la courbe $(\cos t, \sin t, \frac t4)$, en rouge, de torsion positive, et son image par la symétrie $z \mapsto -z$, en bleu, de torsion opposée ; l'axe est en pointillé gris, et les parties des deux courbes situées à l'arrière du cylindre qui les porte sont en pointillé de leur couleur. Les deux courbes tournent dans le même sens autour de l'axe, l'une en montant, l'autre en descendant, et sont images l'une de l'autre dans le miroir horizontal.
      ```
    - |
      Une courbe plane a une torsion nulle, même si son plan n'est pas un plan de coordonnées. Le cercle de centre $\frac13(1, 1, 1)$, tracé dans le plan $x + y + z = 1$ avec les vecteurs unitaires $\frac{(1, -1, 0)}{\sqrt2}$ et $\frac{(1, 1, -2)}{\sqrt6}$ de ce plan, a ses trois dérivées dans le même plan vectoriel, d'où $\det(\gamma', \gamma'', \gamma''') = 0$ et $\tau = 0$, comme le prévoit le point (iv) de {{cb-frenet|Repère de Frenet}}.

  deplacement:
    - |
      La rotation $R_\varphi$ d'angle $\varphi$ autour de l'axe vertical, orthogonale de déterminant $1$, suivie de la translation de $(0, 0, b\varphi)$, est un déplacement qui envoie la courbe $\gamma(t) = (a\cos t, a\sin t, bt)$, avec $a > 0$, sur elle-même : $R_\varphi\gamma(t) + (0, 0, b\varphi) = \gamma(t + \varphi)$. Cette courbe est ainsi la même vue de chacun de ses points, ce qui explique que sa courbure et sa torsion soient constantes.
    - |
      La symétrie $z \mapsto -z$ est une isométrie, de matrice orthogonale $\operatorname{diag}(1, 1, -1)$, mais son déterminant vaut $-1$ : ce n'est pas un déplacement. Elle envoie la courbe $(a\cos t, a\sin t, bt)$, pour $a > 0$ et $b \neq 0$, sur $(a\cos t, a\sin t, -bt)$, de même courbure et de torsion opposée. Aucun déplacement ne fait passer de l'une à l'autre, puisqu'un déplacement, qui conserve les produits scalaires et le produit vectoriel, transporte le [[repere-frenet|repère de Frenet]] et conserve la torsion.

  surface-parametree:
    - |
      La sphère de rayon $R$, paramétrée par la latitude $u \in \,]{-\frac\pi2}, \frac\pi2[$ et la longitude $v \in \,]{-\pi}, \pi[$, $x(u, v) = (R\cos u\cos v, \allowbreak R\cos u\sin v, \allowbreak R\sin u)$, est régulière : un calcul de [[produit-vectoriel|produit vectoriel]] donne $x_u \wedge x_v = -R\cos u\;x$, de norme $R^2\cos u > 0$. Aux pôles, où $\cos u = 0$, la formule cesserait d'être régulière : c'est pourquoi l'ouvert des paramètres les exclut.
    - |
      Le cône $x(u, v) = (v\cos u, v\sin u, v)$, sur $\mathbb R \times \,]0, +\infty[$, est régulier, puisque $x_u \wedge x_v = (v\cos u, v\sin u, -v)$ a pour norme $v\sqrt2 > 0$. La même formule sur $\mathbb R^2$ ne l'est plus : en $v = 0$, $x_u = 0$, et toute la droite $v = 0$ des paramètres est envoyée sur le sommet, où le paramétrage n'est pas régulier.
      ```schema lex-surface-parametree-2
      Le cône $(v\cos u, v\sin u, v)$ en projection parallèle, pour $0 < v \leqslant 1$ : les génératrices $u = \text{constante}$, en bleu, et les cercles $v = \text{constante}$, en gris, sont les images des droites de coordonnées ; les vecteurs $x_u$, en rouge, et $x_v$, en vert, en un point, engendrent le plan tangent. Au sommet, en creux, $x_u$ s'annule.
      ```
    - |
      Une surface peut cesser d'être régulière le long de toute une courbe. Pour $x(u, v) = (u, v^2, v^3)$, de classe $C^\infty$ sur $\mathbb R^2$, on trouve $x_u \wedge x_v = (0, -3v^2, 2v)$, nul exactement sur la droite $v = 0$. L'image est le cylindre construit sur la courbe $z^2 = y^3$, puisque $z^2 = v^6 = y^3$, c'est-à-dire sur la courbe $(v^2, v^3)$ dont la remarque de {{cb-courbes|Courbes et longueur}} décrit la pointe. Le long de l'axe des $x$, image de $v = 0$, le paramétrage n'est pas régulier ; sur $v \neq 0$, il l'est.

  premiere-forme-fondamentale:
    - |
      L'hélicoïde $x(u, v) = (v\cos u, v\sin u, u)$, surface balayée par une droite horizontale qui monte en tournant, a pour première forme $E = 1 + v^2$, $F = 0$, $G = 1$. La courbe $v = v_0$, une hélice de rayon $|v_0|$, a donc pour longueur sur un tour $\int_0^{2\pi}\sqrt{1 + v_0^2}\,du = 2\pi\sqrt{1 + v_0^2}$, que l'on lit sur $E$ sans revenir à $\mathbb R^3$.
    - |
      Sur la sphère unité paramétrée par la latitude et la longitude, $E = 1$, $F = 0$ et $G = \cos^2 u$. Le parallèle de latitude $u_0$ a pour longueur $\int_{-\pi}^{\pi}\sqrt G\,dv = 2\pi\cos u_0$ : il raccourcit à l'approche des pôles. Le coefficient $F = 0$ dit que méridiens et parallèles se coupent à angle droit.
    - |
      La première forme dépend du paramétrage. Le plan paramétré par $(u, v, 0)$ a $E = G = 1$ et $F = 0$, mais, en [[coordonnees-polaires|coordonnées polaires]] $(r\cos\theta, r\sin\theta, 0)$, il a $E = 1$, $F = 0$ et $G = r^2$. Les deux matrices se déduisent l'une de l'autre par la formule du point (iii) de {{sf-premiere-forme|Première forme}} : ce sont deux écritures d'une même forme quadratique sur le même plan tangent.

  aire-surface:
    - |
      La bande d'hélicoïde $x(u, v) = (v\cos u, v\sin u, u)$, pour $0 \leqslant u \leqslant 2\pi$ et $0 \leqslant v \leqslant 1$, a pour aire, par le point (ii) de {{sf-aire|Aire}},
      $$\begin{aligned} &\int_0^{2\pi}\!\!\int_0^1 \sqrt{1 + v^2}\,dv\,du \\ &\quad = \pi\big(\sqrt2 + \ln(1 + \sqrt2)\big), \end{aligned}$$
      soit entre $7{,}211$ et $7{,}212$. C'est plus que l'aire $\pi$ du disque unité qu'elle survole : en montant, la surface s'incline et s'allonge.
    - |
      L'aire d'un graphe $z = h(u, v)$ s'écrit $\int_D \sqrt{1 + h_u^2 + h_v^2}\,d\lambda$, puisque $x_u \wedge x_v = (-h_u, -h_v, 1)$. Pour le paraboloïde $h = u^2 + v^2$ au-dessus du disque unité, les [[coordonnees-polaires|coordonnées polaires]] ({{cv-polaires|Coordonnées polaires}}, (ii)) donnent
      $$2\pi\int_0^1 r\sqrt{1 + 4r^2}\,dr = \frac\pi6\big(5\sqrt5 - 1\big),$$
      comprise entre $5{,}330$ et $5{,}331$.
    - |
      Le produit $\sqrt{EG}$ ne donne l'aire que si $F = 0$. Le plan paramétré par $x(u, v) = (u + v, v, 0)$ a $E = 1$, $F = 1$, $G = 2$ : le carré unité des paramètres a pour image un parallélogramme d'aire $\sqrt{EG - F^2} = 1$, alors que $\sqrt{EG} = \sqrt2$ serait l'aire d'un rectangle de côtés $\|x_u\|$ et $\|x_v\|$. Le terme $F^2$ corrige l'inclinaison des côtés.

  application-gauss:
    - |
      Pour la sphère de rayon $R$ paramétrée par la latitude $u \in \,]{-\frac\pi2}, \frac\pi2[$ et la longitude $v \in \,]{-\pi}, \pi[$, $x_u \wedge x_v = -R\cos u\;x$, d'où $N = -\frac xR$ : la normale pointe vers le centre, et l'application de Gauss parcourt la sphère unité privée du demi-méridien fermé qui joint les deux pôles en passant par $(1, 0, 0)$, antipode de celui de longitude $\pi$. Avec l'ordre inverse des paramètres, elle pointerait vers l'extérieur.
    - |
      Pour le cylindre $x(u, v) = (R\cos u, R\sin u, v)$, $N = (\cos u, \sin u, 0)$ ne dépend pas de $v$ : l'image de l'application de Gauss est l'équateur, une courbe, et $N$ est constante le long de chaque génératrice. Le plan tangent tourne quand on fait le tour du cylindre, et ne bouge pas quand on monte.
    - |
      Pour le cône $x(u, v) = (v\cos u, v\sin u, v)$, on trouve $N = \frac{(\cos u, \sin u, -1)}{\sqrt2}$, constante sur chaque génératrice, comme pour le cylindre, et l'image est un cercle de la sphère unité, à la latitude $-\frac\pi4$. Plus loin, on verra que ces deux surfaces, dont l'application de Gauss écrase une dimension, ont une courbure de Gauss nulle ({{sf-courbures|Courbures}}).

  seconde-forme-fondamentale:
    - |
      Au sommet d'un graphe à tangente horizontale, la seconde forme est la forme quadratique de la hessienne. Pour $h = u^2 + 3v^2$, en $(0, 0)$, $N = e_3$, et $e = 2$, $f = 0$, $g = 6$ : $I\!I(a\,x_u + b\,x_v) = 2a^2 + 6b^2$. La surface se courbe trois fois plus vite dans la direction de $v$ que dans celle de $u$.
    - |
      Pour le cylindre $x(u, v) = (R\cos u, R\sin u, v)$, de [[application-gauss|normale]] extérieure $N = (\cos u, \sin u, 0)$, on trouve $e = -R$ et $f = g = 0$. La seconde forme est nulle dans la direction des génératrices, qui sont des droites, et vaut $\frac{e}{E} = -\frac1R$ sur le vecteur unitaire $\frac{x_u}R$, tangent aux cercles : le signe dit que la surface se courbe du côté opposé à $N$.
    - |
      La seconde forme peut s'annuler sur un vecteur non nul. Pour la selle $z = uv$, en $(0, 0)$, on a $e = g = 0$ et $f = 1$, donc $I\!I(a\,x_u + b\,x_v) = 2ab$, nulle sur les deux axes. Ces deux directions sont celles de droites contenues dans la surface, les axes des $u$ et des $v$, dont l'accélération est nulle, conformément au théorème de Meusnier ({{sf-gauss|Application de Gauss}}, (iv)).

  endomorphisme-weingarten:
    - |
      Pour la sphère de rayon $R$ paramétrée par la latitude et la longitude, $N = -\frac xR$, donc $dN = -\frac1R\,dx$, et $W \circ dx = -dN = \frac1R\,dx$ : l'endomorphisme de Weingarten est l'homothétie de rapport $\frac1R$, en tout point. Avec la normale extérieure, ce serait $-\frac1R\,\mathrm{id}$.
    - |
      Pour le cylindre $x(u, v) = (R\cos u, R\sin u, v)$, $N_u = (-\sin u, \cos u, 0) = \frac{x_u}R$ et $N_v = 0$, d'où $W(x_u) = -\frac1R x_u$ et $W(x_v) = 0$. La matrice de $W$ dans la base $(x_u, x_v)$ est $\operatorname{diag}(-\frac1R, 0)$, que redonne bien la formule $\begin{pmatrix} E & F \\ F & G \end{pmatrix}^{-1}\begin{pmatrix} e & f \\ f & g \end{pmatrix}$ du point (ii) de {{sf-gauss|Application de Gauss}}.
    - |
      Autoadjoint ne veut pas dire de matrice symétrique dans la base $(x_u, x_v)$, qui n'est pas orthonormée en général. Pour la selle $z = \frac12(u^2 - v^2)$, au point de paramètres $(1, 1)$, où $E = G = 2$ et $F = -1$, le calcul donne
      $$W = \frac{\sqrt3}9\begin{pmatrix} 2 & -1 \\ 1 & -2 \end{pmatrix},$$
      qui n'est pas symétrique, alors que le produit de la matrice de la première forme par celle de $W$, qui est celle de la seconde forme, l'est.

  courbures-principales:
    - |
      Pour la selle $z = \frac12(u^2 - v^2)$, en $(0, 0)$, la matrice de $W$ est $\operatorname{diag}(1, -1)$ : $k_1 = 1$ et $k_2 = -1$, dans les directions des axes. La formule d'Euler donne la [[courbure-normale|courbure normale]] $\cos^2\theta - \sin^2\theta = \cos 2\theta$ dans la direction d'angle $\theta$ avec l'axe des $u$ : elle s'annule pour $\theta = \pm\frac\pi4$.
      ```schema lex-courbures-principales-1
      La courbure normale $\cos 2\theta$ de la selle à l'origine, en rouge, en fonction de l'angle $\theta$ de la direction avec l'axe des $u$ : elle oscille entre $k_1 = 1$ et $k_2 = -1$, atteints dans deux directions orthogonales, et s'annule dans les directions bissectrices, en bleu.
      ```
    - |
      Pour le cylindre de rayon $R$ et de normale extérieure, dont l'endomorphisme de Weingarten a pour matrice $\operatorname{diag}(-\frac1R, 0)$ dans la base $(x_u, x_v)$, $k_1 = 0$, dans la direction des génératrices, et $k_2 = -\frac1R$, dans celle des cercles. L'ordre $k_1 \geqslant k_2$ dépend de l'orientation : avec la normale intérieure, on aurait $k_1 = \frac1R$ et $k_2 = 0$.
    - |
      Pour le paraboloïde elliptique $z = u^2 + 3v^2$, en $(0, 0)$, la matrice de $W$ est $\operatorname{diag}(2, 6)$ : $k_1 = 6$ dans la direction de $v$ et $k_2 = 2$ dans celle de $u$. La courbure normale $2\cos^2\theta + 6\sin^2\theta$ reste entre ces deux valeurs, sans jamais s'annuler : la surface est d'un seul côté de son plan tangent près de l'origine.

  courbure-gauss:
    - |
      Le tore $x(u, v) = \big((R + r\cos u)\cos v, (R + r\cos u)\sin v, r\sin u\big)$, $0 < r < R$, a pour courbure de Gauss, par le point (ii) de {{sf-courbures|Courbures}},
      $$K = \frac{\cos u}{r(R + r\cos u)}.$$
      Elle est positive sur la partie extérieure, où la surface est bombée comme une sphère, négative sur la partie intérieure, où elle est en selle, et nulle sur les deux cercles du dessus et du dessous.
      ```schema lex-courbure-gauss-1
      Le tore $R = 2$, $r = \frac23$, vu de biais en projection parallèle : les parallèles de la partie extérieure ($\cos u > 0$), en rouge, sont ceux où $K > 0$, ceux de la partie intérieure, en bleu, ceux où $K < 0$ ; le cercle $u = \frac\pi2$ du dessus, en vert, porte $K = 0$, comme son symétrique du dessous, caché. Seules les parties tournées vers l'observateur sont tracées.
      ```
    - |
      Pour la selle $z = uv$, la formule $K = \frac{eg - f^2}{EG - F^2}$ donne $K = -\frac{1}{(1 + u^2 + v^2)^2}$ en tout point : la courbure est négative partout, maximale en valeur absolue à l'origine, et tend vers $0$ loin d'elle, où la selle s'aplatit.
    - |
      Une courbure de Gauss nulle n'entraîne pas que la surface soit plane. Le cône $(v\cos u, v\sin u, v)$ a $K = 0$ en tout point, mais sa [[courbure-moyenne|courbure moyenne]] n'est pas nulle : il est courbé dans la direction des cercles. Plus loin, le Theorema egregium expliquera ce zéro par le déroulement du cône sur le plan, qui conserve la première forme ({{sf-egregium|Theorema egregium}}).

  courbure-moyenne:
    - |
      Pour la sphère de rayon $R$ paramétrée par la latitude et la longitude, de normale intérieure, $H = \frac1R$ ; avec la normale extérieure, $H = -\frac1R$. Contrairement à la [[courbure-gauss|courbure de Gauss]] $\frac1{R^2}$, la courbure moyenne change de signe avec l'orientation.
    - |
      Le cylindre de rayon $R$, de normale extérieure, a $H = -\frac1{2R}$, alors que sa courbure de Gauss est nulle. Les deux quantités ne disent pas la même chose : $K$ ignore le cylindre, qui se déroule sur le plan, $H$ le voit, parce qu'il est courbé dans l'espace.
    - |
      L'hélicoïde $x(u, v) = (v\cos u, v\sin u, u)$ a $H = 0$ en tout point, et $K = -\frac1{(1 + v^2)^2}$ : ses deux [[courbures-principales|courbures principales]] sont opposées. Plus loin, les surfaces de courbure moyenne nulle seront dites minimales ({{sf-tore-catenoide|Tore et caténoïde}}).

  surface-minimale:
    - |
      L'hélicoïde $x(u, v) = (v\cos u, v\sin u, u)$ est une surface minimale : le calcul de la [[courbure-moyenne|courbure moyenne]] par la formule du point (ii) de {{sf-courbures|Courbures}} donne $H = 0$ en tout point. Ses deux [[courbures-principales|courbures principales]] sont opposées en chaque point, et sa [[courbure-gauss|courbure de Gauss]] $-\frac1{(1 + v^2)^2}$ est strictement négative.
    - |
      La surface de Scherk, graphe de $h(u, v) = \ln\cos v - \ln\cos u$ sur le carré $]{-\frac\pi2}, \frac\pi2[^2$, est minimale : sa courbure moyenne, calculée par la même formule, est nulle en tout point. Quand $(u, v)$ tend vers un point intérieur d'un côté $|u| = \frac\pi2$, $-\ln\cos u$ tend vers $+\infty$ et $\ln\cos v$ reste borné, si bien que $h \to +\infty$ ; de même $h \to -\infty$ en un point intérieur d'un côté $|v| = \frac\pi2$. Aux quatre coins, $h$ n'a pas de limite : près du coin $(\frac\pi2, \frac\pi2)$, il est nul sur la diagonale $u = v$, mais tend vers $-\infty$ le long de la courbe $u = \frac\pi2 - t$, $v = \frac\pi2 - t^2$, où $\cos u \sim t$ et $\cos v \sim t^2$ ; de même aux trois autres coins. On pense à un film de savon tendu sur ces bords à l'infini.
    - |
      Une courbure de Gauss négative ne suffit pas. La selle $z = \frac12(u^2 - v^2)$ a $K < 0$ partout et $H = 0$ à l'origine, mais au point de paramètres $(1, 0)$, sa courbure moyenne vaut $-\frac{\sqrt2}8$, pour la normale ascendante : la selle n'est pas minimale. Le calcul montre que $H$ s'annule exactement sur les droites $v = \pm u$, et nulle part ailleurs.

  symboles-christoffel:
    - |
      Les symboles de Christoffel dépendent du paramétrage, même pour le plan. En [[coordonnees-polaires|coordonnées polaires]], $E = 1$, $F = 0$ et $G = r^2$, et les formules des coordonnées orthogonales ({{sf-christoffel|Christoffel}}, (iii)) donnent $\Gamma^1_{22} = -r$ et $\Gamma^2_{12} = \frac1r$, les autres étant nuls. Ils ne disent pas que le plan est courbé : ils traduisent la courbure des cercles $r = \text{constante}$.
    - |
      Pour le tore $x(u, v) = \big((R + r\cos u)\cos v, (R + r\cos u)\sin v, r\sin u\big)$, avec $0 < r < R$, on a $E = r^2$, $F = 0$ et $G = (R + r\cos u)^2$, d'où
      $$\begin{aligned} \Gamma^1_{22} &= \frac{(R + r\cos u)\sin u}{r}, \\ \Gamma^2_{12} &= -\frac{r\sin u}{R + r\cos u}, \end{aligned}$$
      les quatre autres symboles étant nuls. On vérifie que $x_{vv} = \Gamma^1_{22}\,x_u + g\,N$ : la dérivée seconde le long d'un parallèle a une composante le long du méridien, sauf sur les cercles $\sin u = 0$.
    - |
      Deux paramétrages isométriques ont les mêmes symboles, puisque ceux-ci ne dépendent que de $E$, $F$, $G$ et de leurs dérivées ({{sf-christoffel|Christoffel}}, (ii)). Le cône $(v\cos u, v\sin u, v)$ et son déroulement plan, de même [[premiere-forme-fondamentale|première forme]] $E = v^2$, $F = 0$, $G = 2$, ont ainsi $\Gamma^2_{11} = -\frac v2$ et $\Gamma^1_{12} = \frac1v$, alors que l'un est dans l'espace et l'autre dans un plan.

  geodesique:
    - |
      Sur la sphère unité, pour $p$ un point et $w$ unitaire orthogonal à $p$, le grand cercle $c(t) = \cos t\,p + \sin t\,w$ a pour accélération $c'' = -c$, qui est normale à la sphère : c'est une géodésique. Les méridiens et l'équateur en sont des exemples.
    - |
      Les autres parallèles ne sont pas des géodésiques. Celui de latitude $u_0$, $c(t) = (\cos u_0\cos t, \cos u_0\sin t, \sin u_0)$, a une accélération horizontale, dirigée vers l'axe, dont la composante sur le vecteur $x_u$ du méridien vaut $\sin u_0\cos u_0$ : elle n'est pas normale à la sphère dès que $u_0 \neq 0$, et le parallèle tourne, dans la surface, vers le pôle le plus proche.
    - |
      Sur le cylindre $(R\cos u, R\sin u, v)$, l'hélice $(R\cos t, R\sin t, bt)$, avec $b \neq 0$, a une accélération horizontale, dirigée vers l'axe, donc normale : c'est une géodésique, comme la génératrice qui joint ses points $(R, 0, 0)$ et $(R, 0, 2\pi b)$. L'hélice a pour longueur, sur ce tour, $2\pi\sqrt{R^2 + b^2} > 2\pi|b|$ : deux géodésiques joignent ces points, et seule la génératrice est la plus courte. Plus loin, on verra qu'une géodésique ne minimise la longueur que localement ({{sf-minimisation|Minimisation locale}}).
      ```schema lex-geodesique-3
      Sur le cylindre en projection parallèle, l'hélice, en rouge, et la génératrice, en bleu, sont deux géodésiques qui joignent les deux mêmes points, marqués ; l'hélice, qui fait un tour, est la plus longue. Les cercles gris sont aussi des géodésiques ; les parties cachées sont en pointillé.
      ```

  application-exponentielle:
    - |
      Pour le plan paramétré par $(u, v, 0)$, les [[symboles-christoffel|symboles de Christoffel]] sont nuls, les [[geodesique|géodésiques]] sont les $t \mapsto m + tw$, et $\operatorname{Exp}_m(w) = m + w$ est définie sur $\mathbb R^2$ tout entier. L'exponentielle n'est alors qu'une translation : c'est dans les surfaces courbées qu'elle devient intéressante.
    - |
      Pour le cylindre $x(u, v) = (\cos u, \sin u, v)$, les symboles sont nuls aussi, et $\operatorname{Exp}_m(w) = m + w$ sur $\mathbb R^2$. Sur la surface, en revanche, les points $x(m + w)$ et $x(m + w + (2\pi, 0))$ coïncident : deux vitesses initiales différentes mènent au même point, et c'est le paramétrage $x$, non l'exponentielle, qui cesse d'être injectif.
    - |
      Le domaine $O_m$ dépend de l'ouvert des paramètres. Pour la sphère unité paramétrée par la latitude $u \in \,]{-\frac\pi2}, \frac\pi2[$ et la longitude $v \in \,]{-\pi}, \pi[$, avec $m = (0, 0)$, les seuls symboles non nuls sont $\Gamma^1_{22} = \sin u\cos u$ et $\Gamma^2_{12} = -\tan u$. Le méridien $\beta(t) = (t, 0)$ est une géodésique, puisque $v' = 0$ et que $\Gamma^1_{11}$ et $\Gamma^2_{11}$ sont nuls ; l'équateur $\beta(t) = (0, t)$ en est une, puisque $u = 0$ annule $\Gamma^1_{22}$. Mais le premier sort de l'ouvert en $t = \frac\pi2$, le second en $t = \pi$ : $O_m$, qui contient $\,]{-\frac\pi2}, \frac\pi2[\, \times \{0\}$ et $\{0\} \times \,]{-\pi}, \pi[$ sans contenir $(\pm\frac\pi2, 0)$, n'est pas une boule de la norme $\|\cdot\|_m$, ici euclidienne, centrée en $0$.

  coordonnees-polaires-geodesiques:
    - |
      Dans le plan, les coordonnées polaires [[geodesique|géodésiques]] centrées en un point sont les coordonnées polaires usuelles : les géodésiques issues du point sont les rayons, et $\sqrt G = r$. La formule $K = -\frac{(\sqrt G)_{rr}}{\sqrt G}$ du point (iv) de {{sf-polaires|Coordonnées polaires géodésiques}} redonne $K = 0$.
    - |
      Sur la sphère unité centrée au pôle nord, $r$ est la colatitude et $\sqrt G = \sin r$ ({{sf-polaires|Coordonnées polaires géodésiques}}, (v)), d'où $K = -\frac{(\sin r)''}{\sin r} = 1$. Le cercle géodésique de rayon $r$, un parallèle, a pour longueur $2\pi\sin r$, inférieure à $2\pi r$ : pour $r = \frac\pi2$, l'équateur mesure $2\pi$, contre $\pi^2 \approx 9{,}87$ pour un cercle du plan de même rayon.
    - |
      Les coordonnées dégénèrent au-delà du rayon permis. Sur la sphère unité, toutes les géodésiques issues du pôle nord arrivent au pôle sud en $r = \pi$, où $\sqrt G = \sin\pi = 0$ : le pôle sud est atteint par toutes les directions à la fois, comme le centre l'est en $r = 0$, et $(r, \theta)$ n'y sont plus des paramètres réguliers.

  courbure-geodesique:
    - |
      Dans le plan $z = 0$, orienté par $N = e_3$, le vecteur $N \wedge c'$ est la tangente tournée d'un quart de tour, et la courbure [[geodesique|géodésique]] est la courbure algébrique des courbes planes : un cercle de rayon $\rho$ parcouru dans le sens direct a $k_g = \frac1\rho$.
    - |
      Sur la sphère unité orientée par la normale extérieure, le parallèle de latitude $u_0$, parcouru vers l'est par la longueur, a pour courbure géodésique $\tan u_0$, et pour composante normale de l'accélération $-1$. On retrouve sa courbure de courbe de l'espace, puisque $\tan^2 u_0 + 1 = \frac1{\cos^2 u_0}$ : seul l'équateur a $k_g = 0$, et c'est le seul parallèle géodésique.
    - |
      Une courbe peut être très courbée dans l'espace et avoir une courbure géodésique nulle. Sur le cylindre de rayon $R$, un cercle horizontal a la courbure $\frac1R$, mais son accélération, dirigée vers l'axe, est normale au cylindre : $k_g = 0$, et ce cercle est une géodésique. Toute sa courbure est imposée par la surface.

  triangle-geodesique:
    - |
      Le huitième de la sphère unité découpé par les trois plans de coordonnées est un triangle [[geodesique|géodésique]], dont les trois côtés sont des quarts de grand cercle, et ses trois angles sont droits. Leur somme $\frac{3\pi}2$ dépasse $\pi$ de $\frac\pi2$, qui est bien son aire, le huitième de $4\pi$, comme l'annonce la formule de Gauss-Bonnet ({{sf-gauss-bonnet|Gauss-Bonnet}}, (iii)).
      ```schema lex-triangle-geodesique-1
      Le triangle géodésique de sommets $(1, 0, 0)$, $(0, 1, 0)$ et $(0, 0, 1)$ sur la sphère unité, vue de biais en projection parallèle : ses côtés, en rouge, sont des arcs de grands cercles, et ses trois angles, en bleu, sont droits. La partie cachée de la sphère est en pointillé.
      ```
    - |
      Le triangle de sommets le pôle nord et deux points de l'équateur séparés par la longitude $\alpha \in \,]0, \pi[$ a pour angles $\alpha$ au pôle et $\frac\pi2$ aux deux autres sommets. L'excès vaut $\alpha$, et l'aire, en coordonnées polaires géodésiques centrées au pôle, est $\int_0^\alpha\!\int_0^{\pi/2} \sin r\,dr\,d\theta = \alpha$ : la formule se vérifie pour tout $\alpha$.
    - |
      La formule demande des côtés géodésiques. Si l'on remplace l'arc d'équateur par l'arc du parallèle de latitude $u_0 > 0$, la région bordée par deux méridiens et ce parallèle a encore des angles $\alpha$, $\frac\pi2$, $\frac\pi2$, d'excès $\alpha$, mais son aire est $\alpha(1 - \sin u_0) < \alpha$. L'écart vient de la courbure géodésique $\tan u_0$ du parallèle : son intégrale le long de l'arc, de longueur $\alpha\cos u_0$, vaut $\alpha\sin u_0$, et comble exactement la différence, comme le dirait la formule de Bonnet, qui n'est ni énoncée ni démontrée ici.

  metrique-riemannienne:
    - |
      Sur le demi-plan $\mathbb H = \{(u, v) : v > 0\}$, la métrique de Poincaré $g = \frac1{v^2}I_2$ allonge les distances près de l'axe réel. Le segment vertical de $(0, a)$ à $(0, b)$, avec $0 < a < b$, a pour longueur $\int_a^b \frac{dv}v = \ln\frac ba$, qui tend vers $+\infty$ quand $a \to 0$ : l'axe réel est à distance infinie.
    - |
      Sur la sphère unité, la métrique induite, lue dans la carte $\sigma_+$ de {{gd-exemples-varietes|Exemples de variétés}}, (ii), est
      $$g(z) = \frac{4}{(1 + \|z\|_2^2)^2}\,I_2,$$
      comme on le calcule sur la matrice jacobienne de $\sigma_+^{-1}$ ({{sf-riemann|Métriques riemanniennes}}, (ii)). Elle est proportionnelle à l'identité : la projection stéréographique conserve les angles, mais pas les longueurs.
    - |
      La matrice doit être définie positive, pas seulement symétrique. Avec $g = \operatorname{diag}(1, -1)$ sur $\mathbb R^2$, la courbe $t \mapsto (t, t)$ donnerait ${}^t\gamma'g\gamma' = 0$, donc une longueur nulle pour une courbe qui bouge, et la courbe $t \mapsto (0, t)$ une quantité négative, dont la racine n'a pas de sens.

  divergence:
    - |
      Pour un champ linéaire $X(y) = Ay$, la divergence est la constante $\operatorname{tr}A$. Avec $A$ de lignes $(-1, 1)$ et $(0, -2)$, elle vaut $-3$, et le [[flot|flot]] $e^{tA}$ multiplie les aires par $\det e^{tA} = e^{-3t}$ : la contraction des volumes se lit sur la trace, sans calculer l'exponentielle, comme l'annonce le point (ii) de {{cv-liouville|Conservation du volume}}.
    - |
      Le champ $X(a, b) = (a, -b)$ est hamiltonien, de fonction $H(a, b) = ab$, puisque $(\partial_bH, -\partial_aH) = (a, -b)$, et sa divergence $1 - 1$ est nulle. Son flot $(e^ta, e^{-t}b)$ étire et écrase dans le même rapport : il conserve les aires sans conserver les distances, ni les formes.
    - |
      La divergence dépend des coordonnées. Le champ constant $X = 1$ sur $]0, +\infty[$, de divergence nulle, a pour flot les translations. Lu dans la variable $u = y^2$, il devient $Y(u) = 2\sqrt u$, puisque $u' = 2yy' = 2\sqrt u$, de divergence $\frac1{\sqrt u} \neq 0$ : le flot $(\sqrt u + t)^2$ a pour dérivée $1 + \frac t{\sqrt u}$ en $u$, et dilate les longueurs. La divergence n'est donc pas attachée au seul mouvement : elle dépend aussi de la mesure de référence, ici celle de la variable choisie.

  equation-differentielle:
    - |
      Une équation d'ordre deux se ramène à la forme $y' = F(t, y)$ en prenant la dérivée pour nouvelle inconnue. L'équation $u'' = -u$ devient ainsi le système
      $$\begin{aligned} y_1' &= y_2, \\ y_2' &= -y_1, \end{aligned}$$
      c'est-à-dire $y' = F(t, y)$ avec $F(t, (y_1, y_2)) = (y_2, -y_1)$, continue sur $\Omega = \mathbb R \times \mathbb R^2$. La fonction $y(t) = (\cos t, -\sin t)$ en est une [[solution-edo|solution]], puisque $\lex{cosinus-sinus}{\cos}' = -\sin$ et $\sin' = \cos$, et sa première coordonnée résout l'équation de départ. Ce second membre ne dépend pas de $t$, et il est $1$-lipschitzien en $y$ pour $\|\cdot\|_\infty$.
    - |
      Sans hypothèse de Lipschitz, l'unicité tombe. L'équation $y' = 3|y|^{2/3}$, dont le second membre est continu, a pour solutions sur $\mathbb R$ la fonction nulle et $y(t) = t^3$, puisque $3|t^3|^{2/3} = 3t^2$ : deux solutions distinctes, définies partout, passent par $(0, 0)$. Le second membre n'est lipschitzien en $y$ sur aucun voisinage de $y = 0$, car $F(t, y)/|y| = 3|y|^{-1/3}$ n'est pas borné quand $y \to 0$. Plus loin, le théorème de Peano montrera que l'existence, elle, subsiste sans cette hypothèse ({{ed-peano|Théorème de Peano}}).

  exponentielle-matrice:
    - |
      Pour une matrice nilpotente, la série s'arrête. Avec $N$ de lignes $(0, 1)$ et $(0, 0)$, on a $N^2 = 0$, donc $e^{tN} = I + tN$. Comme $\lambda I$ commute avec $N$,
      $$e^{t(\lambda I + N)} = e^{\lambda t}\begin{pmatrix} 1 & t \\ 0 & 1 \end{pmatrix},$$
      dont le déterminant est $e^{2\lambda t} = e^{t\operatorname{tr}(\lambda I + N)}$, comme l'annonce la formule de Liouville. Le facteur $t$, qu'aucune matrice diagonale ne produit, donne les solutions $te^{\lambda t}$.
    - |
      On calcule souvent $e^{tA}$ en vérifiant qu'une matrice candidate résout $Y' = AY$, $Y(0) = I$, puis en invoquant l'unicité. Pour $A$ de lignes $(1, 1)$ et $(0, 2)$, la matrice
      $$Y(t) = \begin{pmatrix} e^t & e^{2t} - e^t \\ 0 & e^{2t} \end{pmatrix}$$
      vérifie $Y(0) = I$ et $Y' = AY$, coefficient par coefficient : c'est $e^{tA}$. Son déterminant $e^{3t}$ est bien $e^{t\operatorname{tr}A}$.
    - |
      L'exponentielle des matrices n'est pas injective, contrairement à l'exponentielle réelle. Pour $J$ de lignes $(0, -1)$ et $(1, 0)$, $e^{tJ}$ est la rotation d'angle $t$, puisque la matrice de rotation résout $Y' = JY$ et vaut $I$ en $0$. Pour $t = 2\pi$, on obtient $e^{2\pi J} = I = e^0$, alors que $2\pi J \neq 0$ : deux matrices distinctes ont la même exponentielle.

  flot:
    - |
      La propriété de groupe contient les formules d'addition. Le champ $X(a, b) = (-b, a)$ de $\mathbb R^2$ a pour courbe intégrale issue de $(a, b)$ la fonction
      $$\begin{aligned} \varphi_t(a, b) = (&a\cos t - b\sin t, \\ &a\sin t + b\cos t), \end{aligned}$$
      définie sur $\mathbb R$, comme on le vérifie en dérivant : $\varphi_t$ est la rotation d'angle $t$. L'égalité $\varphi_t(\varphi_s(1, 0)) = \varphi_{t+s}(1, 0)$, écrite sur la première coordonnée, est $\cos t\cos s - \sin t\sin s = \cos(t + s)$, et la seconde coordonnée donne de même la formule de $\sin(t + s)$.
    - |
      L'hypothèse « $t + s$ dans l'intervalle de définition » ne peut pas être omise. Pour $X(y) = y^2$ sur $\mathbb R$, la courbe issue de $x$ est $\varphi_t(x) = \frac{x}{1 - tx}$, définie tant que $tx < 1$, et un calcul de fractions donne $\varphi_t(\varphi_s(x)) = \frac{x}{1 - (t + s)x}$. Pour $x = 1$ et $s = t = \frac12$, on a $\varphi_{1/2}(1) = 2$, mais $\varphi_{1/2}(2)$ n'est pas défini, puisque la courbe issue de $2$ explose à l'instant $\frac12$ : ici $t + s = 1$ est justement l'instant où explose la courbe issue de $1$.
      ```schema lex-flot-2
      La courbe issue de $1$, en rouge, passe par $2$ à l'instant $\frac12$ et explose à l'instant $1$ ; la courbe issue de $2$, en bleu, est la même courbe avancée de $\frac12$, et elle explose à l'instant $\frac12$. Lire $\varphi_t(\varphi_s(x))$, c'est suivre la bleue pendant le temps $t$ : elle n'existe plus à l'instant $\frac12$.
      ```
    - |
      Le flot du champ $X(a, b) = (a, -b)$ est $\varphi_t(a, b) = (e^ta, e^{-t}b)$ : il étire les abscisses et contracte les ordonnées dans le même rapport. Pour $t = \ln 2$, il envoie le carré $[0, 1]^2$ sur le rectangle $[0, 2] \times [0, \frac12]$, de même aire, et pour tout $t$ le carré sur un rectangle d'aire $e^t \cdot e^{-t} = 1$. Plus loin, le théorème de Liouville expliquera cette conservation par la divergence $\partial_aX_1 + \partial_bX_2 = 1 - 1 = 0$ du champ ({{cv-liouville|Conservation du volume}}, (iii)).
      ```schema lex-flot-3
      Sur les hyperboles $ab = \text{constante}$, en gris, que suivent les courbes intégrales, le carré unité, en bleu, est envoyé par $\varphi_{\ln 2}$ sur le rectangle rouge $[0, 2] \times [0, \frac12]$, et par $\varphi_{2\ln 2}$ sur le rectangle vert $[0, 4] \times [0, \frac14]$ : la forme change, l'aire reste égale à $1$.
      ```

  domaine-flot:
    - |
      Pour $X(y) = 1 + y^2$ sur $\mathbb R$, la [[courbe-integrale|courbe]] issue de $x$ est $\varphi_t(x) = \tan(t + \arctan x)$, de dérivée $1 + \varphi_t(x)^2$, définie tant que $|t + \arctan x| < \frac\pi2$. Le domaine du [[flot|flot]] est donc
      $$D = \{(t, x) : |t + \arctan x| < \tfrac\pi2\}.$$
      Comme $\arctan x$ décrit $]{-\frac\pi2}, \frac\pi2[$, l'ensemble $D_t$ est vide dès que $|t| \geqslant \pi$ : aucune courbe ne dure plus longtemps que $\pi$, et $\varphi_t$, pour un tel $t$, n'est défini nulle part.
      ```schema lex-domaine-flot-1
      Le domaine $D$, en bleu léger, est la bande comprise entre les deux courbes rouges $\arctan x = \pm\frac\pi2 - t$, qui n'en font pas partie ; il est contenu dans $|t| < \pi$. La verticale $t = \frac\pi4$ coupe $D$ selon $D_{\pi/4} = \,]{-\infty}, 1[$, que $\varphi_{\pi/4}(x) = \frac{1 + x}{1 - x}$ envoie sur $D_{-\pi/4} = \,]{-1}, +\infty[$.
      ```
    - |
      Le domaine peut avoir une forme imprévue même pour un champ constant. Pour $X = (1, 0)$ sur $U = \mathbb R^2 \setminus \{(0, 0)\}$, la courbe issue de $p$ est $p + t(1, 0)$, tant qu'elle ne passe pas par l'origine. Pour $t > 0$, le point $p$ est dans $D_t$ sauf s'il appartient au segment $[-t, 0[ \times \{0\}$, dont les points atteignent l'origine avant l'instant $t$. Ainsi $D_t$ est $U$ privé de ce segment, et $\varphi_t$, une translation, l'envoie sur $D_{-t}$, qui est $U$ privé de $]0, t] \times \{0\}$.
      ```schema lex-domaine-flot-2
      Pour $t = 2$, le point bleu, sur le segment rouge $[-2, 0[ \times \{0\}$, atteint l'origine, absente de $U$, au bout du temps $1$ : il n'est pas dans $D_2$. Le point vert, juste au-dessus, est translaté de $(2, 0)$ sans encombre.
      ```
    - |
      Un champ borné sur $\mathbb R^n$ a un flot défini sur $\mathbb R \times \mathbb R^n$ tout entier ({{ed-flot|Flot}}, (iii)), mais la condition n'est pas nécessaire. Le champ $X(y) = y$ sur $\mathbb R$, qui n'est pas borné, a pour flot $\varphi_t(x) = xe^t$, défini lui aussi pour tous $t$ et $x$ : $D = \mathbb R \times \mathbb R$. Ce n'est pas la taille du champ qui décide, mais sa croissance, comme le montre la comparaison avec $1 + y^2$, qui donne des courbes de durée $\pi$.

  equation-variationnelle:
    - |
      Pour un champ linéaire $X(y) = Ay$, la différentielle $dX = A$ est constante, et l'équation variationnelle est $Z' = AZ$, $Z(0) = I$, quelle que soit la courbe le long de laquelle on l'écrit. Sa solution est $Z(t) = e^{tA}$ ({{ed-lineaires|Systèmes linéaires}}, (ii)), qui est bien la différentielle de l'application linéaire $\varphi_t = e^{tA}$. Dans ce cas, on n'apprend rien : la linéarisation d'un champ linéaire le redonne.
    - |
      Le long d'une courbe constante, l'équation variationnelle est à coefficients constants. Pour $X(y) = y(1 - y)$ sur $\mathbb R$, les points $0$ et $1$ donnent des courbes constantes, et $X'(0) = 1$, $X'(1) = -1$ : l'équation est $Z' = Z$ en $0$ et $Z' = -Z$ en $1$, d'où $d\varphi_t(0) = e^t$ et $d\varphi_t(1) = e^{-t}$. On le vérifie sur le [[flot|flot]] explicite
      $$\varphi_t(x) = \frac{xe^t}{1 - x + xe^t}.$$
      Les solutions voisines de $0$ s'en écartent comme $e^t$, celles voisines de $1$ s'en rapprochent comme $e^{-t}$.
    - |
      Le pendule $\theta'' = -\sin\theta$ s'écrit $y' = X(y)$ avec $X(\theta, v) = (v, -\sin\theta)$, et les points $(0, 0)$ et $(\pi, 0)$ donnent des courbes constantes. En bas, la matrice jacobienne a pour lignes $(0, 1)$ et $(-1, 0)$, et $Z(t)$ est la rotation d'angle $-t$ ; en haut, elle a pour lignes $(0, 1)$ et $(1, 0)$, et
      $$Z(t) = \begin{pmatrix} \operatorname{ch} t & \operatorname{sh} t \\ \operatorname{sh} t & \operatorname{ch} t \end{pmatrix},$$
      où $\operatorname{ch} t = \frac{e^t + e^{-t}}2$ et $\operatorname{sh} t = \frac{e^t - e^{-t}}2$. Les petits écarts restent bornés en bas, et croissent comme $e^t$ en haut. Plus loin, la valeur propre $1$ de la seconde matrice suffira à rendre la position haute instable ({{ly-pendule|Le pendule amorti}}, (iv)) ; en bas, les valeurs propres $\pm i$ ne décident rien, et c'est l'énergie qui donne la stabilité.

  equilibre:
    - |
      Le champ logistique $X(y) = y(1 - y)$ sur $\mathbb R$ a deux équilibres, $0$ et $1$, où les [[courbe-integrale|courbes intégrales]] sont constantes. La courbe issue de $x \in \,]0, 1[$ est $\frac{xe^t}{1 - x + xe^t}$, qui tend vers $1$ : comme l'annonce le point (iii) de {{ly-equilibres|Équilibres}}, une courbe qui a une limite dans $U$ ne peut tendre que vers un équilibre.
    - |
      Le pendule $\theta'' = -\sin\theta$, écrit $y' = X(y)$ avec $X(\theta, v) = (v, -\sin\theta)$ sur $\mathbb R^2$, a une infinité d'équilibres : $X$ s'annule si et seulement si $v = 0$ et $\sin\theta = 0$, c'est-à-dire $\theta \in \pi\mathbb Z$ ({{cx-pi|Le nombre π}}, (ii)). Les points $(2j\pi, 0)$ sont le pendule immobile en bas, et les points $((2j + 1)\pi, 0)$ le pendule immobile en haut : le calcul ne les distingue pas, la stabilité le fera.
    - |
      Le point (iii) de {{ly-equilibres|Équilibres}} demande que la limite soit dans $U$. Pour $X(y) = -y$ sur $U = \,]0, +\infty[$, qui ne s'annule pas sur $U$, la courbe issue de $x$ est $xe^{-t}$, définie pour tout $t$ et convergente, mais vers $0$, qui n'est pas un point de $U$ : il n'y a aucun équilibre, et la conclusion tombe.

  equilibre-stable:
    - |
      Pour le champ $X(a, b) = (-b, a)$, les [[courbe-integrale|courbes intégrales]] sont des cercles centrés en $0$, parcourus à vitesse constante, et la norme euclidienne de $\varphi_t(p)$ reste égale à celle de $p$. L'origine est donc stable, avec $\delta = \varepsilon$ pour cette norme. Elle n'attire pourtant aucune courbe : une trajectoire partie à distance $\frac12$ y reste pour toujours.
    - |
      Le $\delta$ de la définition est en général plus petit que $\varepsilon$. Pour $X(x, y) = (y, -4x)$, les courbes parcourent les ellipses $4x^2 + y^2 = \text{constante}$, et celle qui part de $(\delta, 0)$ passe par $(0, -2\delta)$ à l'instant $\frac\pi4$ : elle s'éloigne jusqu'à la distance $2\delta$ en norme euclidienne. L'origine est stable, mais il faut prendre $\delta = \frac\varepsilon2$, et non $\delta = \varepsilon$.
      ```schema lex-equilibre-stable-2
      Les courbes intégrales du champ $(y, -4x)$ sont des ellipses, en bleu, deux fois plus hautes que larges. Celle qui part de $(\delta, 0)$, en rouge, sort du disque de rayon $\delta$, en pointillé, mais reste dans celui de rayon $2\delta$, en gris.
      ```
    - |
      La stabilité demande que tous les points voisins se tiennent bien, pas seulement certains. Pour $X(y) = y^2$ sur $\mathbb R$, les courbes issues des points $x < 0$ tendent vers l'équilibre $0$, en restant dans $[x, 0[$ ; mais celle issue de $x > 0$, égale à $\frac{x}{1 - tx}$, explose à l'instant $\frac1x$, et elle n'est donc pas définie sur $[0, +\infty[$. Si petit que soit $\delta$, le point $x = \frac\delta2$ met la définition en défaut : $0$ est instable.

  asymptotiquement-stable:
    - |
      La convergence vers un équilibre asymptotiquement stable peut être lente. Pour $y' = -y^3$, la courbe issue de $x$ est $\frac{x}{\sqrt{1 + 2tx^2}}$, comme on le vérifie en dérivant. Sa valeur absolue décroît, ce qui donne la stabilité avec $\delta = \varepsilon$, et elle tend vers $0$ : l'origine est asymptotiquement stable. Mais elle se comporte comme $\frac1{\sqrt{2t}}$, bien plus lentement que les exponentielles des systèmes linéaires.
    - |
      Pour le champ linéaire $X(x, y) = (-x + y, -x - y)$, le flot est $e^{-t}$ fois la rotation d'angle $-t$, comme on le vérifie sur $Y' = AY$, $Y(0) = I$. La norme euclidienne de $\varphi_t(p)$ vaut $e^{-t}\|p\|_2$ : elle décroît, ce qui donne la stabilité, et tend vers $0$, ce qui donne l'attraction. Les courbes s'enroulent en spirale autour de l'origine, qui est asymptotiquement stable.
      ```schema lex-asymptotiquement-stable-2
      Trois courbes intégrales du champ $(-x + y, -x - y)$, issues de points du cercle de rayon $2$, en gris : chacune s'enroule dans le sens indirect autour de l'origine, en voyant sa distance à l'origine divisée par $e$ à chaque unité de temps.
      ```
    - |
      L'attraction ne suffit pas. Pour le champ de {{ly-equilibres|Équilibres}} donné, en module $r$ et argument $\theta$, par $r' = r(1 - r)$ et $\theta' = 1 - \cos\theta$, le point $a = (1, 0)$ est attractif. Mais la courbe issue de $(\cos\theta_0, \sin\theta_0)$, pour $\theta_0 > 0$ petit, reste sur le cercle unité et passe par $(-1, 0)$, à distance $2$ de $a$, puisque $\cot\frac\theta2$ décroît d'une unité par unité de temps. Plus loin, une fonction de Liapounov stricte donnera les deux propriétés à la fois ({{ly-liapounov|Fonctions de Liapounov}}, (iii)).

  fonction-liapounov:
    - |
      L'énergie du pendule sans frottement, $E(\theta, v) = \frac{v^2}2 + 1 - \cos\theta$, est une fonction de Liapounov pour l'équilibre $(0, 0)$ du champ $X(\theta, v) = (v, -\sin\theta)$, sur $W = \,]{-\pi}, \pi[ \times \mathbb R$. Elle est nulle en $(0, 0)$, strictement positive ailleurs sur $W$, et sa dérivée le long du champ, $v\sin\theta - v\sin\theta = 0$, est nulle : l'équilibre est stable, sans que l'on ait résolu l'équation.
    - |
      Le choix de $V$ est tout l'art de la méthode. Pour $X(x, y) = (-x + 4y, -x - y)$, la fonction $x^2 + y^2$ a pour dérivée $-2x^2 + 6xy - 2y^2$, qui vaut $2 > 0$ en $(1, 1)$ : ce n'est pas une fonction de Liapounov. La fonction $x^2 + 4y^2$, au contraire, a pour dérivée $-2x^2 - 8y^2$, strictement négative hors de $0$ : elle est stricte, et l'origine est asymptotiquement stable.
      ```schema lex-fonction-liapounov-2
      Une courbe intégrale du champ $(-x + 4y, -x - y)$, en rouge, traverse vers l'intérieur toutes les ellipses $x^2 + 4y^2 = c$, en bleu ; sa distance à l'origine, que mesurent les cercles gris, augmente au contraire par moments.
      ```
    - |
      Une fonction de Liapounov qui n'est pas stricte ne donne pas l'attraction. Pour le champ $X(x, y) = (-y, x)$, la fonction $x^2 + y^2$ est de dérivée nulle : c'est une fonction de Liapounov, et l'origine est stable. Elle n'est pas stricte, et l'origine n'est en effet pas attractive, les courbes restant sur des cercles. Plus loin, le principe de LaSalle tirera pourtant l'attraction d'une fonction non stricte, quand la dynamique chasse les courbes de la partie où sa dérivée s'annule ({{ly-lasalle|Principe de LaSalle}}, (iv)).

  equation-liapounov:
    - |
      Pour une matrice diagonale, tout se calcule à vue. Avec $A = \operatorname{diag}(-1, -2)$, on a $e^{s\,{}^tA}e^{sA} = \operatorname{diag}(e^{-2s}, e^{-4s})$, et
      $$\begin{aligned} P &= \int_0^{+\infty} \operatorname{diag}(e^{-2s}, e^{-4s})\,ds \\ &= \operatorname{diag}(\tfrac12, \tfrac14), \end{aligned}$$
      qui vérifie bien ${}^tAP + PA = \operatorname{diag}(-1, -1) = -I$. La fonction ${}^tyPy = \frac{y_1^2}2 + \frac{y_2^2}4$ pèse moins la coordonnée qui décroît le plus vite.
    - |
      Pour le pendule linéarisé avec frottement, $A$ de lignes $(0, 1)$ et $(-1, -1)$, de valeurs propres $\frac{-1 \pm i\sqrt3}2$, on résout le système linéaire en $p$, $q$, $r$ que donne ${}^tAQ + QA = -I$ pour $Q$ symétrique, et l'on trouve
      $$P = \begin{pmatrix} \frac32 & \frac12 \\ \frac12 & 1 \end{pmatrix},$$
      [[forme-definie-positive|définie positive]], puisque $\frac32 > 0$ et $\det P = \frac54 > 0$. La fonction $V = \frac32y_1^2 + y_1y_2 + y_2^2$ a pour dérivée $-y_1^2 - y_2^2$ : contrairement à l'énergie $\frac{y_1^2 + y_2^2}2$, dont la dérivée $-y_2^2$ s'annule sur un axe, elle est stricte.
    - |
      Sans l'hypothèse sur les valeurs propres, l'équation peut n'avoir aucune solution. Pour la rotation $J$, de lignes $(0, -1)$ et $(1, 0)$ et de valeurs propres $\pm i$, on a ${}^tJ = -J$, donc ${}^tJQ + QJ = QJ - JQ$, dont la trace est nulle, alors que celle de $-I$ vaut $-2$ : il n'y a aucune solution $Q$, symétrique ou non. Aucune forme quadratique ne décroît strictement le long des cercles.

  ensemble-omega-limite:
    - |
      Quand la [[courbe-integrale|courbe]] converge, son ensemble ω-limite est réduit à sa limite. Pour le champ logistique, la courbe issue de $\frac12$ tend vers $1$, et $\omega(\frac12) = \{1\}$ : tout point d'accumulation d'une fonction convergente est sa limite.
    - |
      L'ensemble ω-limite peut être une courbe entière, sans équilibre. Pour le champ $X(x, y) = \big((1 - r)x - y,\ (1 - r)y + x\big)$ du plan privé de l'origine, où $r = \sqrt{x^2 + y^2}$, la courbe issue du point $r_0(\cos\theta_0, \sin\theta_0)$ est $\rho(t)\big(\cos(\theta_0 + t), \sin(\theta_0 + t)\big)$, avec $\rho(t) = \frac{r_0e^t}{1 - r_0 + r_0e^t}$, comme on le vérifie en dérivant : $\rho' = \rho(1 - \rho)$, et le rayon tend vers $1$ pendant que l'angle tourne à vitesse $1$. Ses points d'accumulation sont donc sur le cercle unité, et chaque point du cercle en est un, approché aux instants successifs où l'angle lui revient : $\omega(x)$ est le cercle unité tout entier.
      ```schema lex-ensemble-omega-limite-2
      Deux courbes intégrales du champ $r' = r(1 - r)$, $\theta' = 1$, issues de points de rayon $\frac15$ et $2$, en bleu, s'enroulent vers le cercle unité, en rouge, qui est leur ensemble ω-limite ; le cercle est lui-même une courbe intégrale, périodique.
      ```
    - |
      Sans la condition de rester dans un compact, l'ensemble ω-limite peut être vide. Pour $X = 1$ sur $\mathbb R$, la courbe issue de $x$ est $x + t$ : chaque ensemble $\overline{\{x + t : t \geqslant T\}} = [x + T, +\infty[$ est non vide, mais leur intersection est vide. La compacité sert précisément à empêcher la courbe de fuir.

  systeme-linearise:
    - |
      Pour le champ logistique, le système linéarisé en l'[[equilibre|équilibre]] $1$ est $h' = -h$, puisque $X'(1) = 1 - 2 = -1$. Sa seule valeur propre est $-1 < 0$, et l'équilibre est asymptotiquement stable ({{ly-linearisation|Linéarisation}}, (ii)), ce que confirment les courbes explicites, qui s'en rapprochent comme $e^{-t}$.
    - |
      Quand le linéarisé a une valeur propre de partie réelle nulle, il ne décide rien. Les équations $y' = -y^3$ et $y' = y^3$ ont le même linéarisé en $0$, $h' = 0$. Pourtant $0$ est asymptotiquement stable pour la première, dont les courbes $\frac{x}{\sqrt{1 + 2tx^2}}$ tendent vers $0$, et instable pour la seconde, dont les courbes $\frac{x}{\sqrt{1 - 2tx^2}}$ explosent à l'instant $\frac1{2x^2}$.
    - |
      Le champ $X(x, y) = (-x + y^2, -2y + x^2)$ a deux équilibres réels, l'origine et $(2^{2/3}, 2^{1/3})$, puisque $x = y^2$ et $x^2 = 2y$ donnent $y^4 = 2y$, soit $y = 0$ ou $y^3 = 2$. À l'origine, le linéarisé est $\operatorname{diag}(-1, -2)$, et l'origine est asymptotiquement stable. Au second point, la matrice jacobienne, de lignes $(-1, 2^{4/3})$ et $(2^{5/3}, -2)$, a pour déterminant $-6 < 0$ : ses deux valeurs propres sont réelles et de signes contraires. Plus loin, la valeur propre positive rendra cet équilibre instable ({{ly-instabilite|Instabilité}}).

  solution-maximale:
    - |
      Pour $y' = 1 + y^2$, dont le second membre est de classe $C^1$, la solution maximale passant par $(0, y_0)$ est $y(t) = \tan(t + \arctan y_0)$, définie sur $]{-\frac\pi2} - \arctan y_0, \frac\pi2 - \arctan y_0[$. Elle est maximale, car un prolongement serait continu en une extrémité, où $|y|$ tend vers $+\infty$. Toutes les solutions maximales vivent ainsi sur un intervalle de longueur $\pi$, et explosent aux deux bouts, comme le prévoit le critère d'explosion ({{ed-maximales|Solutions maximales}}, (iii)) avec $I = \mathbb R$. Sa restriction à $]{-1}, 1[$, pour $y_0 = 0$, est une solution qui n'est pas maximale.
      ```schema lex-solution-maximale-1
      Les solutions maximales de $y' = 1 + y^2$ passant par $(0, 0)$, en rouge, par $(0, 1)$, en bleu, et par $(0, -1)$, en vert : ce sont des translatées de la fonction $\tan$, chacune sur un intervalle de longueur $\pi$ limité par deux asymptotes verticales, en pointillé.
      ```
    - |
      Le critère d'explosion suppose $\Omega = I \times \mathbb R^n$ : sans cette hypothèse, une solution maximale peut s'arrêter sans exploser. L'équation $y' = -t/y$, posée sur $\Omega = \mathbb R \times \,]0, +\infty[$, a pour solution $y(t) = \sqrt{c - t^2}$ sur $]{-\sqrt c}, \sqrt c[$, pour $c > 0$. Une solution qui la prolongerait à un intervalle contenant $\sqrt c$ y prendrait, par continuité, la valeur $0$, alors que son graphe doit rester dans $\Omega$ : elle est maximale, et elle reste bornée, mais elle tend vers le bord de $\Omega$.
      ```schema lex-solution-maximale-2
      Les graphes des solutions maximales $\sqrt{c - t^2}$, pour $c = 1$, $2$ et $4$, sont des demi-cercles ouverts, contenus dans le demi-plan $\Omega$, en bleu léger. Leurs extrémités, en creux, sont sur l'axe $y = 0$, qui borde $\Omega$ : les solutions s'arrêtent là, bornées.
      ```
    - |
      Sans l'hypothèse lipschitzienne, la solution maximale passant par un point n'est plus unique. Pour $y' = 3|y|^{2/3}$, dont le second membre est continu, et pour tout $\tau \geqslant 0$, la fonction nulle sur $]{-\infty}, \tau]$ et égale à $(t - \tau)^3$ ensuite est une solution sur $\mathbb R$, puisque les deux formules ont en $\tau$ la même valeur et la même dérivée, nulles. Définie sur $\mathbb R$, elle est maximale, et le point (ii) de {{ed-maximales|Solutions maximales}} tombe : une infinité de solutions maximales passent par $(0, 0)$.
      ```schema lex-solution-maximale-3
      Toutes ces fonctions passent par l'origine et résolvent $y' = 3|y|^{2/3}$ sur $\mathbb R$ : la fonction nulle, en bleu, la fonction $t^3$, en rouge, et, pour $\tau = 1$ et $\tau = 2$, la fonction nulle jusqu'à $\tau$ puis égale à $(t - \tau)^3$, en vert.
      ```

  courbe-reguliere:
    - |
      La cycloïde $\gamma(t) = (t - \sin t, 1 - \cos t)$, que décrit un point d'une roue de rayon $1$ roulant sur une droite, a pour vitesse $(1 - \cos t, \sin t)$, de norme $2|\sin\frac t2|$. Elle s'annule exactement aux $t \in 2\pi\mathbb Z$, quand le point touche le sol : la courbe n'est pas régulière. L'image y forme une pointe : les arcs $t > 0$ et $t < 0$ sont symétriques par $x \mapsto -x$, puisque $\gamma(-t) = (-(t - \sin t), 1 - \cos t)$, et $\frac{t - \sin t}{1 - \cos t} \to 0$ quand $t \to 0$, si bien que tous deux partent de l'origine tangents à la même demi-droite verticale. Sur $]0, 2\pi[$, la courbe est régulière.
      ```schema lex-courbe-reguliere-1
      Une arche de la cycloïde, en rouge, entre deux pointes où la vitesse est nulle, en creux ; la roue de rayon $1$, en gris, et le point qui la décrit, à l'instant $t = \frac{2\pi}3$, avec sa vitesse en bleu.
      ```
    - |
      La régularité est une propriété du paramétrage. La courbe $(t^3, t^3)$ parcourt la droite $y = x$, qui n'a rien de singulier, mais sa vitesse $(3t^2, 3t^2)$ s'annule en $0$ : elle n'est pas régulière, alors que $(t, t)$, de même image, l'est. Le passage de l'une à l'autre se fait par $t \mapsto t^3$, dont la dérivée s'annule en $0$ : ce n'est pas un [[reparametrage|reparamétrage]].
    - |
      Une courbe régulière n'est pas forcément injective. La cubique $\gamma(t) = (t^2 - 1, t(t^2 - 1))$ a pour vitesse $(2t, 3t^2 - 1)$, qui ne s'annule jamais, puisque $2t = 0$ force $3t^2 - 1 = -1$. Pourtant $\gamma(1) = \gamma(-1) = (0, 0)$ : la courbe repasse par l'origine, avec les vitesses $(2, 2)$ et $(-2, 2)$, et son image y a un point double à deux tangentes.
      ```schema lex-courbe-reguliere-3
      La cubique $(t^2 - 1, t(t^2 - 1))$, en rouge, passe deux fois par l'origine, aux instants $\pm1$, avec les vitesses $(2, 2)$ et $(-2, 2)$, en bleu : régulière, elle n'est pas injective.
      ```

  plan-tangent:
    - |
      Sur la sphère de centre $0$ et de rayon $R$, le plan tangent en un point $p$ est l'orthogonal de $p$. En dérivant $\langle x, x \rangle = R^2$ par rapport à $u$ et à $v$, on trouve en effet $\langle x_u, x \rangle = \langle x_v, x \rangle = 0$, et le plan engendré par $x_u$ et $x_v$ est contenu dans $p^\perp$, donc égal à lui. On retrouve l'espace tangent du nœud {{gd-tangent-sm|Tangent à une sous-variété}}.
    - |
      Pour un graphe $z = h(u, v)$, le plan tangent est engendré par $(1, 0, h_u)$ et $(0, 1, h_v)$, et il est orthogonal à $(-h_u, -h_v, 1)$ ({{sf-surfaces|Surfaces paramétrées}}, (iv)). Pour $h = u^2 + v^2$ en $(1, 1)$, il est orthogonal à $(-2, -2, 1)$ ; c'est un plan vectoriel, et sa translatée $z = 2 + 2(u - 1) + 2(v - 1)$, qui passe par le point $(1, 1, 2)$, est le plan tangent affine que l'on dessine.
    - |
      Le plan tangent ne dépend pas du paramétrage, même si les vecteurs $x_u$ et $x_v$ en dépendent. Le plan $z = 0$, paramétré par $(u, v, 0)$ ou, hors de l'origine, par $(r\cos\theta, r\sin\theta, 0)$, a pour vecteurs $e_1$, $e_2$ dans le premier cas, et $(\cos\theta, \sin\theta, 0)$, $(-r\sin\theta, r\cos\theta, 0)$ dans le second : ces couples sont différents, mais ils engendrent le même plan, comme l'annonce le point (i) de {{sf-surfaces|Surfaces paramétrées}}.

  solution-edo:
    - |
      Une solution est de classe $C^1$, mais pas davantage en général. La fonction $y(t) = t|t|$ résout $y' = 2\sqrt{|y|}$ sur $\mathbb R$, puisque sa dérivée $2|t|$ est égale à $2\sqrt{t^2}$. Le second membre est continu, et la dérivée $2|t|$ l'est donc aussi, mais elle n'est pas dérivable en $0$, où elle a une dérivée à gauche $-2$ et une dérivée à droite $2$ : la solution n'est pas deux fois dérivable. Il faudrait un second membre plus régulier pour en dire plus.
      ```schema lex-solution-edo-1
      La solution $y = t|t|$, en rouge, et sa dérivée $y' = 2|t|$, en bleu, qui a un point anguleux à l'origine : la courbe rouge a partout une tangente, mais sa pente varie de façon non dérivable en $0$.
      ```
    - |
      Une solution est définie sur un intervalle. La fonction $t \mapsto \frac1{1 - t}$, qui vérifie $y' = y^2$ en tout point de $\mathbb R \setminus \{1\}$, n'est pas une solution, car cet ensemble n'est pas un intervalle. Ses restrictions à $]{-\infty}, 1[$ et à $]1, +\infty[$ en sont deux, qui n'ont rien à voir : la première passe par $(0, 1)$, la seconde par $(2, -1)$. Toute restriction de l'une d'elles à un intervalle plus petit, comme $]0, \frac12[$, est encore une solution, distincte de la première.
      ```schema lex-solution-edo-2
      Les deux branches de l'hyperbole $y = \frac1{1 - t}$, en rouge à gauche de l'asymptote $t = 1$ et en bleu à droite, sont deux solutions distinctes de $y' = y^2$ ; la réunion des deux n'en est pas une, son domaine n'étant pas un intervalle.
      ```
    - |
      Le graphe d'une solution doit rester dans $\Omega$. Sur $\Omega = \,]0, +\infty[ \times \mathbb R$, l'équation $y' = y/t$ a pour solutions les fonctions $y(t) = ct$ sur un intervalle de $]0, +\infty[$, et seulement elles, puisque $(y/t)' = (ty' - y)/t^2 = 0$ pour une solution. La fonction $y(t) = t$, définie sur $\mathbb R$ tout entier, n'en est pas une, bien que l'égalité $y' = y/t$ ait lieu pour tout $t \neq 0$ : le point $(0, 0)$ de son graphe n'est pas dans $\Omega$, où l'équation est seulement posée.

  equation-autonome:
    - |
      L'équation logistique $y' = y(1 - y)$ est autonome. La fonction $y(t) = \frac1{1 + e^{-t}}$ en est une solution, qui vaut $\frac12$ en $0$, et ses translatées $t \mapsto \frac1{1 + e^{-(t + s)}}$ en sont aussi, puisque le second membre ne voit pas l'heure. Les fonctions constantes $0$ et $1$ sont encore des solutions.
      ```schema lex-equation-autonome-1
      La solution $\frac1{1 + e^{-t}}$, en rouge, et ses translatées de $s = \pm2$, en bleu : ce sont des copies décalées horizontalement d'une même courbe, coincées entre les solutions constantes $0$ et $1$, en vert.
      ```
    - |
      Sans autonomie, les translatées ne sont plus des solutions. L'équation $y' = 2ty$ a pour solution $y(t) = e^{t^2}$, mais la translatée $e^{(t + 1)^2}$ a pour dérivée $2(t + 1)e^{(t + 1)^2}$, et non $2te^{(t + 1)^2}$. De même, les applications $\psi_t(x) = xe^{t^2}$, qui donnent la position au temps $t$ de la solution valant $x$ en $0$, ne vérifient pas $\psi_t \circ \psi_s = \psi_{t+s}$ : $\psi_1(\psi_1(1)) = e^2$, alors que $\psi_2(1) = e^4$.
    - |
      Toute équation devient autonome au prix d'une dimension. Pour $F$ continue sur un ouvert $\Omega$ de $\mathbb R \times \mathbb R^n$, l'équation $y' = F(t, y)$ équivaut à l'équation autonome $(s, y)' = (1, F(s, y))$ sur $\Omega$ : si $y$ résout la première, $t \mapsto (t, y(t))$ résout la seconde, et réciproquement, à une translation du temps près. Le nouveau champ $(s, y) \mapsto (1, F(s, y))$ est de classe $C^1$ si $F$ l'est, mais il ne s'annule jamais.

  courbe-integrale:
    - |
      Les courbes intégrales du champ $X(a, b) = (-b, a)$, qui fait tourner le plan, sont les fonctions $t \mapsto (a\cos t - b\sin t,\ a\sin t + b\cos t)$, définies sur $\mathbb R$, comme on le vérifie en dérivant. Elles parcourent les cercles de centre $0$, dans le sens direct, en un temps $2\pi$, et la courbe issue de l'origine, où le champ s'annule, est constante.
      ```schema lex-courbe-integrale-1
      Les courbes intégrales du champ $(-b, a)$ sont des cercles centrés en $0$, parcourus dans le sens direct ; les flèches rouges sont des valeurs du champ, tangentes aux cercles, de longueur proportionnelle au rayon.
      ```
    - |
      Le champ $X(a, b) = (a, -b)$ a pour courbe intégrale issue de $(a, b)$ la fonction $t \mapsto (ae^t, be^{-t})$, définie sur $\mathbb R$. Le produit des coordonnées reste égal à $ab$ : les courbes parcourent des branches d'hyperboles, ou des demi-axes quand $ab = 0$. Deux courbes intégrales d'images distinctes ne se rencontrent jamais, comme le veut l'unicité, et celles qui partent des demi-axes verticaux tendent vers l'origine sans l'atteindre.
      ```schema lex-courbe-integrale-2
      Les courbes intégrales du champ $(a, -b)$ : des branches d'hyperboles $ab = \pm\frac14, \pm1$, en bleu, et les quatre demi-axes, en rouge, parcourus vers l'origine sur l'axe vertical et loin d'elle sur l'axe horizontal. L'origine est une courbe constante.
      ```
    - |
      L'hypothèse $C^1$ sert à garantir qu'il y a une et une seule courbe issue de chaque point. Le champ $X(y) = 3|y|^{2/3}$ n'est pas dérivable en $0$, et les solutions de $y' = X(y)$ nulles en $0$ sont trop nombreuses pour que l'une soit « la » courbe issue de $0$. Sur $U = \,]0, +\infty[$, au contraire, $X$ est de classe $C^1$, et la courbe issue de $x$ est $t \mapsto (t + x^{1/3})^3$, définie sur $]{-x^{1/3}}, +\infty[$. Elle ne se prolonge pas plus loin dans le passé, puisqu'elle tend vers le bord $0$ de $U$ quand $t$ tend vers $-x^{1/3}$.

  courbe-integrale-variete:
    - |
      Sur la variété $M = \,]0, 1[$, ouvert de $\mathbb R$ de carte l'identité, le champ constant égal à $1$ a pour courbe intégrale issue de $x$ la fonction $t \mapsto x + t$, définie sur $]{-x}, 1 - x[$ : aucune n'est définie sur $\mathbb R$. Le point (ii) de {{ed-varietes|Champs sur une variété}} tombe donc sans l'hypothèse de compacité, alors même que le champ est constant : la courbe s'échappe vers $0$ ou vers $1$, qui ne sont pas des points de $M$.
    - |
      Sur le cercle $S^1$, sous-variété de $\mathbb R^2$ ({{gd-sous-varietes|Sous-variétés de ℝⁿ}}, (iii)), le champ $X(p) = (-p_2, p_1)$ est orthogonal à $p$, donc tangent ({{gd-tangent-sm|Tangent à une sous-variété}}). La courbe $\gamma(t) = (\cos t, \sin t)$ a pour vitesse $X(\gamma(t))$, et elle se lit $u(t) = \tan(\frac t2 + \frac\pi4)$ dans la carte $\sigma_+(p) = \frac{p_1}{1 - p_2}$, avec $u' = \frac{1 + u^2}2$ : c'est la forme du champ dans cette carte. Dans la carte, la solution explose en temps fini ; sur $S^1$, la courbe intégrale continue, en passant par le pôle $(0, 1)$, hors de la carte.
    - |
      Sur le cercle, compact, toutes les courbes intégrales sont définies sur $\mathbb R$, même quand le champ a des zéros. Le champ $X(p) = (1 - p_1)(-p_2, p_1)$, tangent, s'annule seulement en $(1, 0)$ ; il se lit $u \mapsto \frac{(u - 1)^2}2$ dans la carte $\sigma_+$ et $u \mapsto -\frac{(u - 1)^2}2$ dans la carte $\sigma_-(p) = \frac{p_1}{1 + p_2}$, il est donc lisse. La courbe issue de $(-1, 0)$ est
      $$\gamma(t) = \Big(\frac{t^2 - 1}{t^2 + 1},\ \frac{-2t}{t^2 + 1}\Big),$$
      comme on le vérifie en dérivant, et elle tend vers $(1, 0)$ aux deux bouts, sans l'atteindre.
      ```schema lex-courbe-integrale-variete-3
      Le champ $(1 - p_1)(-p_2, p_1)$, en rouge, est d'autant plus petit qu'on s'approche du point $(1, 0)$, où il s'annule ; la courbe intégrale issue de $(-1, 0)$, en bleu, fait le tour du cercle, dans le sens direct, en un temps infini, et passe par le pôle $(0, 1)$ à l'instant $-1$.
      ```

  systeme-lineaire-edo:
    - |
      L'équation $t^2u'' = 2u$ sur $I = \,]0, +\infty[$ s'écrit comme le système linéaire $y' = A(t)y$, avec $y = (u, u')$ et $A(t)$ de lignes $(0, 1)$ et $(2/t^2, 0)$, continue sur $I$ mais pas en $0$. Les fonctions $t^2$ et $1/t$ en sont solutions, de valeurs initiales $(1, 2)$ et $(1, -1)$ en $t = 1$, indépendantes : les solutions sont les $at^2 + b/t$. Toutes sont définies sur $I$ entier, même $1/t$, qui explose au bord $0$ de $I$, hors de l'intervalle.
      ```schema lex-systeme-lineaire-edo-1
      Sur $]0, 3]$, les solutions $t^2$, en rouge, $\frac1t$, en bleu, et $t^2 - \frac1t$, en vert : toutes sont définies sur $I = \,]0, +\infty[$ tout entier, et seules celles qui font intervenir $\frac1t$ explosent quand $t$ tend vers le bord $0$.
      ```
    - |
      La linéarité est ce qui garantit des solutions définies sur $I$ tout entier, même quand $A$ n'est pas bornée. L'équation linéaire $y' = 2ty$ a pour solutions les $ce^{t^2}$, définies sur $\mathbb R$, bien que le coefficient $2t$ ne soit pas borné. L'équation $y' = y^2$, que l'on peut écrire $y' = a(t)y$ avec $a(t) = y(t)$, n'est pas linéaire, car son coefficient dépend de la solution : sa solution $\frac1{1 - t}$, issue de $(0, 1)$, explose en $t = 1$.
    - |
      Les solutions d'un système avec second membre ne forment pas un espace vectoriel, mais un espace affine. Pour $y' = -y + \cos t$, la fonction $\frac{\cos t + \sin t}2$ est une solution, et les autres sont les $\frac{\cos t + \sin t}2 + ce^{-t}$ : la différence de deux solutions résout $y' = -y$. La fonction nulle n'est pas solution, puisque $\cos$ n'est pas nulle.
      ```schema lex-systeme-lineaire-edo-3
      La solution périodique $\frac{\cos t + \sin t}2$, en rouge, et les solutions de valeurs $2$ et $-1{,}5$ en $0$, en bleu : l'écart $ce^{-t}$ s'efface, et toutes les solutions se rapprochent de la solution périodique.
      ```

  localement-lipschitzienne:
    - |
      Le second membre $F(t, y) = y^2$ est localement lipschitzien en $y$, sans être lipschitzien sur $\mathbb R \times \mathbb R$. Sur un cylindre de centre $(t_1, y_1)$ et de rayon $r$, on a $|y^2 - z^2| = |y + z|\,|y - z| \leqslant 2(|y_1| + r)\,|y - z|$. Sur $\mathbb R$ tout entier, en revanche, le rapport $|(m + 1)^2 - m^2| = 2m + 1$, pour $m$ réel positif, n'est pas borné. Ce défaut de contrôle global permet l'explosion de $\frac1{1 - t}$ en $t = 1$.
    - |
      Le second membre $F(t, y) = 3|y|^{2/3}$ est continu, mais il n'est localement lipschitzien en $y$ sur aucun ouvert qui contienne un point $(t, 0)$. Sur un cylindre centré en un tel point, le rapport $|F(t, y) - F(t, 0)|/|y| = 3|y|^{-1/3}$ n'est pas borné quand $y \to 0$. Sur $\Omega = \mathbb R \times \,]0, +\infty[$, en revanche, $F$ est de classe $C^1$, de dérivée $2y^{-1/3}$, donc localement lipschitzienne : la propriété dépend de l'ouvert.
    - |
      Être de classe $C^1$ est suffisant, pas nécessaire. Le second membre $F(t, y) = |y|$ n'est pas dérivable en $y = 0$, mais il est $1$-lipschitzien, puisque $||y| - |z|| \leqslant |y - z|$. Le point (ii) de {{ed-maximales|Solutions maximales}} s'applique donc : la solution maximale issue de $(0, y_0)$ est $y_0e^t$ si $y_0 \geqslant 0$ et $y_0e^{-t}$ si $y_0 < 0$, définie sur $\mathbb R$.

  matrice-permutation-reelle:
    - |
      Pour le cycle $\sigma = (1\,2\,3)$, qui envoie $1$ sur $2$, $2$ sur $3$ et $3$ sur $1$, les colonnes de $P_\sigma$ sont $e_2$, $e_3$, $e_1$ :
      $$\begin{aligned} P_\sigma &= \begin{pmatrix} 0 & 0 & 1 \\ 1 & 0 & 0 \\ 0 & 1 & 0 \end{pmatrix}, \\ P_\sigma x &= (x_3, x_1, x_2). \end{aligned}$$
      Son déterminant est la [[signature-permutation|signature]] $\varepsilon(\sigma) = 1$ du cycle, produit de deux échanges.
    - |
      La règle $P_\sigma P_\rho = P_{\sigma\rho}$ fait des matrices de permutation un groupe non commutatif dès $n = 3$. Pour les échanges $(1\,2)$ et $(2\,3)$, le produit $P_{(1\,2)}P_{(2\,3)}$ est $P_{(1\,2\,3)}$, alors que $P_{(2\,3)}P_{(1\,2)}$ est la matrice du cycle inverse. L'inverse de $P_\sigma$ est $P_{\sigma^{-1}}$, qui est aussi sa [[matrice-transposee|transposée]] : $P_\sigma$ est [[matrice-orthogonale|orthogonale]].
    - |
      L'erreur la plus répandue est d'écrire $(P_\sigma x)_k = x_{\sigma(k)}$. La matrice envoie $e_j$ sur $e_{\sigma(j)}$, si bien que la coordonnée $x_j$ va à la place $\sigma(j)$ : $(P_\sigma x)_k = x_{\sigma^{-1}(k)}$. Pour le cycle $(1\,2\,3)$, on obtient $(x_3, x_1, x_2)$, et non $(x_2, x_3, x_1)$, qui est $P_{\sigma^{-1}}x$.

  matrices-elementaires-reelles:
    - |
      Le pivot écrit une matrice inversible comme produit de matrices élémentaires. Pour $A$ de lignes $(1, 2)$ et $(3, 4)$, on annule le coefficient sous le pivot, on factorise la diagonale, puis on annule le coefficient restant :
      $$A = T_{21}(3)\begin{pmatrix} 1 & 0 \\ 0 & -2 \end{pmatrix}T_{12}(2).$$
      Le déterminant $-2$ est porté tout entier par la matrice diagonale.
    - |
      Les matrices diagonales ne peuvent pas être retirées de la liste. Un produit de [[transvection|transvections]] et de matrices de permutation a pour déterminant $\pm1$ ({{cv-elementaires|Matrices élémentaires}}, (ii)), si bien que $\operatorname{diag}(1, 2)$, inversible de déterminant $2$, n'est pas un tel produit : le point (iii) tomberait. Il faut une matrice qui change le déterminant, et c'est le rôle des matrices diagonales.
    - |
      Une rotation s'écrit comme trois transvections. Pour $\theta$ tel que $\cos\frac\theta2 \neq 0$, on vérifie, en multipliant, que
      $$\begin{aligned} R_\theta = \;&T_{12}(-\tan\tfrac\theta2)\,T_{21}(\sin\theta) \\ &\cdot T_{12}(-\tan\tfrac\theta2), \end{aligned}$$
      où $R_\theta$ a pour lignes $(\cos\theta, -\sin\theta)$ et $(\sin\theta, \cos\theta)$. Plus loin, comme chaque transvection conserve la mesure de Lebesgue ({{cv-lineaire|Image linéaire}}), la rotation la conservera aussi.
      ```schema lex-matrices-elementaires-reelles-3
      Pour $\theta = \frac\pi4$, le carré unité, en gris, est cisaillé horizontalement par $T_{12}(-\tan\frac\pi8)$, en bleu, puis verticalement par $T_{21}(\sin\frac\pi4)$, en vert, puis de nouveau horizontalement : on obtient le carré tourné d'un huitième de tour, en rouge. Chaque étape garde les bases et les hauteurs, ce que l'on traduira plus loin en conservation de la mesure.
      ```

  application-borelienne-rn:
    - |
      Une application borélienne n'a pas à être continue. L'indicatrice $\mathbf 1_{\mathbb Q^2}$ n'est continue en aucun point du plan, mais elle est borélienne : $\mathbb Q^2$ est une réunion [[denombrable|dénombrable]] de points, qui sont fermés, donc un borélien, et l'image réciproque d'une partie de $\mathbb R$ est $\varnothing$, $\mathbb Q^2$, son complémentaire ou $\mathbb R^2$. Sa valeur en un point dépend de l'arithmétique des coordonnées, et la mesurabilité n'en voit rien.
    - |
      Le domaine peut être un borélien quelconque, et c'est pour cela que la définition passe par la tribu $\mathcal B(W)$. Sur le carré fermé $W = [0, 1]^2$, qui n'est pas ouvert, la fonction égale à $1/x_1$ si $x_1 > 0$ et à $0$ si $x_1 = 0$ est borélienne. Sur $W \cap \{x_1 > 0\}$, elle est la restriction d'une fonction continue sur l'ouvert $]0, +\infty[ \times \mathbb R$, à laquelle s'applique le point (i) de {{cv-lebesgue-rn|Lebesgue sur ℝⁿ}} ; le segment $W \cap \{x_1 = 0\}$, borélien, ne fait qu'ajouter ou non un morceau à l'image réciproque.
    - |
      Une partie non mesurable fournit une application qui n'est pas borélienne. Si $V \subset [0, 1]$ n'est pas mesurable au sens de Lebesgue ({{m-vitali|Ensemble de Vitali}}, ⋆), l'indicatrice $\mathbf 1_V$ n'est pas borélienne sur $\mathbb R$ : l'image réciproque de $\{1\}$ est $V$, qui n'est pas un borélien, puisque tout borélien de $\mathbb R$ est mesurable au sens de Lebesgue. Elle est pourtant majorée par $1$, et nulle hors d'un intervalle borné.

  pave-semi-ouvert:
    - |
      Les pavés semi-ouverts se recollent sans se chevaucher, ce que les pavés fermés ne font pas. Le rectangle $]0, 2] \times \,]0, 1]$ est la réunion disjointe des carrés $]0, 1] \times \,]0, 1]$ et $]1, 2] \times \,]0, 1]$ : le point $(1, \frac12)$ appartient au premier seul. Les mesures s'ajoutent donc, $2 = 1 + 1$, sans qu'il faille savoir que le segment commun de deux pavés fermés est [[negligeable|négligeable]].
    - |
      La différence de deux pavés n'est pas un pavé, mais elle se découpe en pavés disjoints. Ainsi
      $$\begin{aligned} &]0, 2]^2 \setminus \,]0, 1]^2 \\ &= \,]1, 2] \times \,]0, 2] \;\cup\; ]0, 1] \times \,]1, 2], \end{aligned}$$
      et les mesures donnent $4 - 1 = 2 + 1$. À l'autre extrême, un pavé dont un côté est dégénéré, comme $]1, 1] \times \,]0, 5]$, est vide, et la formule lui donne bien la mesure $0$.
      ```schema lex-pave-semi-ouvert-2
      Le carré $]0, 2]^2$, privé du carré gris $]0, 1]^2$, est la réunion du pavé rouge $]1, 2] \times \,]0, 2]$, d'aire $2$, et du pavé bleu $]0, 1] \times \,]1, 2]$, d'aire $1$. Les côtés en trait plein appartiennent au pavé, les côtés en pointillé non : chaque point d'un côté commun n'est compté qu'une fois.
      ```
    - |
      Les pavés ne sont pas stables par réunion. La réunion de $]0, 1]^2$ et de $]1, 2] \times \,]0, 2]$ contient $(\frac12, \frac12)$ et $(\frac32, \frac32)$ ; un pavé qui les contiendrait contiendrait aussi $(\frac12, \frac32)$, puisqu'il est un produit, et ce point n'est pas dans la réunion. C'est pourquoi la tribu engendrée par les pavés, et non l'ensemble des pavés lui-même, porte la mesure de Lebesgue.

  mesure-lebesgue-rn:
    - |
      La mesure d'une partie du plan se calcule par ses sections ({{m-produit|Mesure produit}}, (iii)). Le triangle $T = \{(x, y) : 0 < y \leqslant x \leqslant 1\}$ a pour section en $x \in \,]0, 1]$ l'intervalle $]0, x]$, de longueur $x$, et pour section vide ailleurs, d'où $\lambda_2(T) = \int_0^1 x\,dx = \frac12$. Rien n'a été supposé sur l'aire d'un triangle : la valeur découle de la seule définition par produit.
    - |
      Un point $a$ du plan est contenu dans le pavé $]a_1 - \varepsilon, a_1] \times \,]a_2 - \varepsilon, a_2]$, de mesure $\varepsilon^2$, pour tout $\varepsilon > 0$ : il est [[negligeable|négligeable]]. Par σ-additivité, toute partie dénombrable, comme $\mathbb Q^2$, l'est aussi. La réciproque est fausse : la droite $\mathbb R \times \{0\}$ n'est pas dénombrable, et elle est négligeable ({{cv-lebesgue-rn|Lebesgue sur ℝⁿ}}, (iv)).
    - |
      L'unicité porte sur les mesures qui donnent aux pavés leur volume, et l'invariance par translation ne suffit pas à la remplacer. La mesure de comptage sur $\mathcal B(\mathbb R^2)$ est invariante par translation, puisqu'une translation est une bijection, mais elle donne $+\infty$ à tout pavé non vide : ce n'est pas un multiple de $\lambda_2$. Plus loin, toute mesure invariante par translation et finie sur le cube unité sera un multiple de $\lambda$ ({{cv-lineaire|Image linéaire}}, (i)), et cet exemple montre que la finitude ne peut pas y être omise.

  parametree-longueur:
    - |
      La courbe $\delta(\sigma) = \big(\cos\frac\sigma{\sqrt2}, \sin\frac\sigma{\sqrt2}, \frac\sigma{\sqrt2}\big)$, de $\mathbb R^3$, est paramétrée par la longueur : sa vitesse a pour carré de la norme $\frac12\sin^2 + \frac12\cos^2 + \frac12 = 1$. Elle s'enroule autour de l'axe vertical en montant, et sa longueur entre $0$ et $2\pi\sqrt2$, un tour complet, est $2\pi\sqrt2$ : elle est plus longue que le cercle unité qu'elle survole.
    - |
      Le paramétrage par la longueur rend l'accélération orthogonale à la vitesse. En dérivant $\langle \delta', \delta' \rangle = 1$, on obtient $2\langle \delta', \delta'' \rangle = 0$ : l'accélération ne sert qu'à tourner, jamais à accélérer. Pour la courbe précédente, $\delta''$ est horizontale et pointe vers l'axe, perpendiculairement à la vitesse.
    - |
      Une vitesse constante ne suffit pas. La courbe $(\cos 2t, \sin 2t)$ a une vitesse de norme $2$ : elle n'est pas paramétrée par la longueur, et sa longueur entre $t_1$ et $t_2$ est $2(t_2 - t_1)$. Le changement $\sigma = 2t$ la ramène à $(\cos\sigma, \sin\sigma)$, et l'unicité ({{cb-abscisse|Abscisse curviligne}}, (iii)) dit que les seules autres possibilités sont $\pm\sigma + c$ : on ne peut choisir que l'origine et le sens.

  reparametrage:
    - |
      Le changement de sens $\varphi(u) = -u$ est un reparamétrage de classe $C^\infty$ de $\mathbb R$, de dérivée $-1$. La courbe $\gamma(-u)$ parcourt la même image en sens inverse, et sa longueur sur $[-b, -a]$ est celle de $\gamma$ sur $[a, b]$ ({{cb-courbes|Courbes et longueur}}, (ii)).
    - |
      La condition sur la dérivée ne peut pas être omise. L'application $\varphi(u) = u^3$ est une bijection de $\mathbb R$ sur $\mathbb R$, de classe $C^\infty$, mais $\varphi'(0) = 0$, et sa réciproque $t \mapsto t^{1/3}$, prolongée par imparité, n'est pas dérivable en $0$. Composée avec la courbe régulière $(t, t)$, elle donne $(u^3, u^3)$, qui ne l'est plus : la régularité ne serait pas conservée.
    - |
      Le reparamétrage $\varphi(u) = 2\arctan u$, de $]0, +\infty[$ sur $]0, \pi[$, transforme le demi-cercle $(\cos t, \sin t)$ en une courbe rationnelle :
      $$\gamma(\varphi(u)) = \Big(\frac{1 - u^2}{1 + u^2},\ \frac{2u}{1 + u^2}\Big).$$
      Sa vitesse a pour norme $\frac2{1 + u^2}$, et sa longueur $\int_0^{+\infty} \frac{2\,du}{1 + u^2} = \pi$ est bien celle du demi-cercle, bien qu'aucune fonction trigonométrique n'apparaisse plus.

  courbe-bireguliere:
    - |
      La courbe $\gamma(t) = (a\cos t, a\sin t, bt)$, avec $a > 0$, est birégulière après reparamétrage par la longueur, puisque $\|\gamma' \wedge \gamma''\|^2 = a^2(a^2 + b^2)$ ne s'annule pas ({{cb-frenet|Repère de Frenet}}, (iii)) : son repère de Frenet est défini partout.
    - |
      La cubique gauche $\gamma(t) = (t, t^2, t^3)$ est birégulière en tout point, puisque $\gamma' \wedge \gamma'' = (6t^2, -6t, 2)$ ne s'annule jamais, sa dernière coordonnée valant $2$. Sa courbure ne s'annule donc nulle part.
    - |
      Un point non birégulier n'est pas toujours un point d'inflexion. Pour la courbe plane $\gamma(t) = (t, t^4, 0)$, le produit $\gamma' \wedge \gamma'' = (0, 0, 12t^2)$ s'annule en $t = 0$, où la courbure est nulle : la courbe n'est pas birégulière. Pourtant elle tourne toujours du même côté, sa courbure plane $\frac{12t^2}{(1 + 16t^6)^{3/2}}$ étant positive, et sa normale principale se prolonge continûment en $0$.

  base-orthonormee-directe:
    - |
      Une permutation circulaire de la base canonique reste directe, un échange ne l'est plus : $\det(e_2, e_3, e_1) = 1$, alors que $\det(e_2, e_1, e_3) = -1$. Les deux sont orthonormées ; l'orientation est la seule chose qui les distingue.
    - |
      Une famille orthonormée de deux vecteurs se complète de deux façons en base orthonormée, et d'une seule en base directe. Pour $u = \frac{(1, 1, 0)}{\sqrt2}$ et $v = \frac{(-1, 1, 0)}{\sqrt2}$, on a $u \wedge v = e_3$, et $(u, v, e_3)$ est directe ; $(u, v, -e_3)$ est orthonormée, de déterminant $-1$. C'est ainsi que la binormale $B = T \wedge N$ est choisie dans le [[repere-frenet|repère de Frenet]].

  deplacement-plan:
    - |
      La rotation d'un quart de tour $j$, sans translation, est un déplacement. Elle envoie la parabole $(t, t^2)$ sur la courbe $(-t^2, t)$, qui est la parabole $x = -y^2$, couchée. Les deux courbes ont la même courbure au sommet, $2$, comme toutes les courbes qui se déduisent l'une de l'autre par un déplacement, puisqu'une rotation conserve la norme et le déterminant.
    - |
      Une symétrie conserve les distances, mais pas l'orientation, et ce n'est pas un déplacement. La symétrie $(x, y) \mapsto (x, -y)$, de déterminant $-1$, envoie la parabole $(t, t^2)$, de courbure $\frac{2}{(1 + 4t^2)^{3/2}}$, sur $(t, -t^2)$, de courbure opposée. Deux courbes paramétrées de courbures opposées ne se déduisent donc pas l'une de l'autre par un déplacement, et le point (ii) de {{cb-planes|Courbes planes}} ne vaut que pour les déplacements. Un déplacement compare des courbes paramétrées, non des images : la rotation d'angle $\pi$ envoie bien la première image sur la seconde, mais en renversant le sens de parcours, ce qui change aussi le signe de la courbure.
      ```schema lex-deplacement-plan-2
      Un arc de parabole, en rouge, son image par une rotation suivie d'une translation, en bleu, de même courbure, et son image par la symétrie d'axe horizontal, en vert, de courbure opposée : la bleue tourne du même côté que la rouge, la verte de l'autre.
      ```

  equilibre-attractif:
    - |
      Le rayon $\eta$ de la définition est limité par la dynamique loin de l'équilibre. Pour le champ logistique $X(y) = y(1 - y)$, l'équilibre $1$ attire toutes les courbes issues des points $x > 0$, mais pas celle issue de $0$, qui reste en $0$ : on peut prendre $\eta = 1$, et pas davantage. L'ensemble des points attirés, ici $]0, +\infty[$, est toute une demi-droite, bien plus qu'une boule.
    - |
      Un équilibre qui n'est pas isolé parmi les équilibres n'est jamais attractif. Si tout voisinage de $a$ contient un autre équilibre $b$, la [[courbe-integrale|courbe]] issue de $b$ est constante, égale à $b \neq a$, et ne tend pas vers $a$. Ainsi, pour le champ nul, ou pour $X(x, y) = (0, -y)$ dont les équilibres forment l'axe horizontal, aucun équilibre n'est attractif.
    - |
      Le champ $X(x, y) = (-x, -2y)$ a pour [[flot|flot]] $(xe^{-t}, ye^{-2t})$, qui tend vers l'origine : celle-ci est attractive, et les courbes suivent les paraboles $y = cx^2$, tangentes à l'axe horizontal en $0$. Plus loin, le pendule amorti donnera un équilibre attractif dont on décrit tout un domaine d'attraction, les points tels que $|\theta| < \pi$ et que l'énergie soit inférieure à $2$ ({{ly-pendule|Le pendule amorti}}, (ii)).
      ```schema lex-equilibre-attractif-3
      Les courbes intégrales du champ $(-x, -2y)$, en bleu, arrivent toutes à l'origine en suivant des paraboles $y = cx^2$, tangentes à l'axe horizontal ; celles des axes, en rouge, y arrivent en ligne droite.
      ```

  equilibre-instable:
    - |
      Un équilibre est instable dès que certains points voisins s'en écartent, même si d'autres s'en approchent. Pour le champ $X(a, b) = (a, -b)$, les courbes issues de l'axe vertical tendent vers l'origine, mais celle issue de $(\delta, 0)$ est $(\delta e^t, 0)$, qui sort de toute boule : l'origine est instable, quel que soit $\delta$.
    - |
      L'instabilité peut venir de ce qu'une courbe cesse d'exister. Pour $X(y) = y^2$ sur $\mathbb R$, la courbe issue de $x > 0$ est $\frac{x}{1 - tx}$, qui explose à l'instant $\frac1x$ : elle n'est pas définie sur $[0, +\infty[$, et le second cas de la définition s'applique. Les points $x > 0$ très proches de $0$ mettent longtemps à exploser, mais ils finissent tous par le faire.
    - |
      Un équilibre instable peut n'avoir autour de lui que des courbes bornées. Pour $\theta' = 1 - \cos\theta$ sur $\mathbb R$, la courbe issue de $\pi$ est $\pi + 2\arctan t$ ; plus généralement, issue de $\theta_0 \in \,]0, 2\pi[$, elle reste dans $]0, 2\pi[$ et tend vers $2\pi$, puisque $\cot\frac\theta2$ décroît d'une unité par unité de temps. Les points $\theta_0 > 0$ voisins de l'équilibre $0$ s'en éloignent jusqu'à $2\pi$ : $0$ est instable. Plus loin, le critère d'instabilité par linéarisation ne s'appliquera pas ici, la dérivée de $1 - \cos\theta$ étant nulle en $0$ ({{ly-instabilite|Instabilité}}).
      ```schema lex-equilibre-instable-3
      Les solutions de $\theta' = 1 - \cos\theta$ issues de $\theta_0 = 0{,}3$, $\pi$ et $5{,}5$, en rouge, montent toutes vers l'équilibre $2\pi$, celle issue de $-0{,}3$, en bleu, monte vers $0$ ; les équilibres $0$ et $2\pi$ sont en vert. Une solution partie juste au-dessus de $0$ s'en éloigne d'un tour entier.
      ```

  positivement-invariante:
    - |
      Pour le champ logistique $X(y) = y(1 - y)$, le segment $[0, 1]$ est positivement invariant : ses extrémités sont des équilibres, et les courbes issues de $]0, 1[$ croissent vers $1$ sans l'atteindre. La demi-droite $]{-\infty}, 0[$ ne l'est pas, bien qu'aucune courbe n'en sorte : la courbe issue de $-\frac12$ explose à l'instant $\ln 3$, et la définition exige que $\varphi_s(y)$ soit défini pour tout $s \geqslant 0$.
    - |
      Les ensembles de niveau d'une [[fonction-liapounov|fonction de Liapounov]] fournissent des parties positivement invariantes. Pour $X(x, y) = (-y - x^3, x - y^3)$ et $V(x, y) = x^2 + y^2$, dont la dérivée le long du champ est $-2(x^4 + y^4) \leqslant 0$, chaque disque fermé $\{V \leqslant c\}$ est positivement invariant : $V$ décroît le long des courbes ({{ly-liapounov|Fonctions de Liapounov}}, (i)), et une courbe qui reste dans un compact est définie pour tous les temps positifs ({{ed-compacts|Sortie des compacts}}, (iii)).
    - |
      Positivement invariant ne veut pas dire invariant. Pour $X(y) = -y$ sur $\mathbb R$, le segment $[0, 1]$ est positivement invariant, puisque $xe^{-s} \in [0, x]$ pour $s \geqslant 0$, mais $\varphi_{-1}(1) = e$ en sort : en remontant le temps, les courbes quittent le segment. La notion ne regarde que l'avenir, comme la stabilité.

  valeurs-propres-complexes:
    - |
      La matrice réelle $A$ de lignes $(a, -b)$ et $(b, a)$, avec $b \neq 0$, n'a aucune valeur propre réelle, puisque $\det(\lambda I - A) = (\lambda - a)^2 + b^2 > 0$ pour $\lambda$ réel. Ses valeurs propres complexes sont $a \pm ib$, et $A(1, -i) = (a + ib)(1, -i)$. Elles vont par paires conjuguées, et leur partie réelle commune $a$ est ce qui gouvernera la stabilité.
    - |
      En dimension impaire, une matrice réelle a au moins une valeur propre réelle. Le polynôme $\det(\lambda I - A)$ est alors un polynôme réel de degré impair, qui change de signe entre $-\infty$ et $+\infty$ et s'annule donc sur $\mathbb R$, par le théorème des valeurs intermédiaires ({{c-tvi|Valeurs intermédiaires}}). Pour la matrice de lignes $(1, 0, 0)$, $(0, 0, -1)$, $(0, 1, 0)$, ce polynôme vaut $(\lambda - 1)(\lambda^2 + 1)$ : la valeur propre réelle $1$ s'ajoute à la paire $\pm i$.
    - |
      Les paires conjuguées tiennent à ce que la matrice est réelle. La matrice complexe de lignes $(i, 0)$ et $(0, 0)$ a pour valeurs propres $i$ et $0$, sans $-i$ : l'argument $A\bar z = \overline{Az}$ demande $\bar A = A$. Plus loin, on ne retiendra des valeurs propres complexes d'une matrice réelle que la plus grande partie réelle $\mu(A)$ ({{ly-lineaire|Systèmes linéaires stables}}).

  directions-principales:
    - |
      Sur le cylindre $x(u, v) = (R\cos u, R\sin u, v)$, l'[[endomorphisme-weingarten|endomorphisme de Weingarten]] a pour matrice $\operatorname{diag}(-\frac1R, 0)$ dans la base $(x_u, x_v)$ : les directions principales sont celle des cercles et celle des génératrices, de courbures $-\frac1R$ et $0$.
    - |
      Les directions principales ne sont pas toujours celles des paramètres. Pour la selle $z = uv$, en $(0, 0)$, où $E = G = 1$, $F = 0$, $e = g = 0$ et $f = 1$, la matrice de $W$ est $\begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}$, de vecteurs propres $(1, 1)$ et $(1, -1)$ : les directions principales sont les bissectrices $x_u \pm x_v$, de courbures $1$ et $-1$, et non les axes, sur lesquels la [[courbure-normale|courbure normale]] est nulle.
    - |
      Sur la sphère de rayon $R$ paramétrée par la latitude et la longitude, l'endomorphisme de Weingarten est l'homothétie $\frac1R\,\mathrm{id}$, puisque $N = -\frac xR$ donne $W \circ dx = -dN = \frac1R\,dx$ : tout vecteur tangent non nul est propre, et toutes les directions sont principales. C'est le cas limite où les deux directions orthogonales de la formule d'Euler ne sont plus déterminées ({{sf-courbures|Courbures}}, (i)).

  ombilic:
    - |
      Tous les points d'une sphère de centre $0$ et de rayon $R$ sont des ombilics, pour tout paramétrage $x$. Le plan tangent en $x$ est l'orthogonal de $x$, comme on le voit en dérivant $\langle x, x \rangle = R^2$ ; la normale unitaire est donc $N = \pm\frac xR$, avec un signe localement constant puisque $N$ est continue, d'où $dN = \pm\frac1R\,dx$, et l'[[endomorphisme-weingarten|endomorphisme de Weingarten]] vaut $W = \mp\frac1R\,\mathrm{id}$. Tous les points d'un plan le sont aussi, $N$ y étant constante et $W$ nul : c'est le cas dégénéré où les deux [[courbures-principales|courbures principales]] sont nulles.
    - |
      Un ombilic peut être isolé. Pour le paraboloïde $z = \frac12(u^2 + v^2)$, on a $W = \mathrm{id}$ en $(0, 0)$, qui est un ombilic. En général, $N = \frac{(-u, -v, 1)}{\sqrt\Delta}$ avec $\Delta = 1 + u^2 + v^2$, la seconde forme a pour matrice $\frac1{\sqrt\Delta}I_2$, et la première $I_2 + {}^t(u, v)(u, v)$, de coefficients $1 + u^2$, $uv$, $1 + v^2$. La matrice de $W$ est donc $\frac1{\sqrt\Delta}$ fois l'inverse de cette dernière, et c'est une homothétie si et seulement si $uv = 0$ et $u^2 = v^2$, c'est-à-dire $u = v = 0$ : l'origine est le seul ombilic.
    - |
      Le cylindre $(R\cos u, R\sin u, v)$ n'a aucun ombilic : sa normale extérieure $N = (\cos u, \sin u, 0)$ donne $W(x_u) = -\frac1R x_u$ et $W(x_v) = 0$, et ses courbures principales $0$ et $-\frac1R$ sont distinctes en tout point. Plus loin, on montrera qu'une surface connexe formée d'ombilics, de [[courbure-gauss|courbure de Gauss]] strictement positive, est contenue dans une sphère ({{sf-exemples|Premiers exemples}}).

  courbure-normale:
    - |
      Sur la sphère de rayon $R$ orientée par la normale intérieure, la courbure normale vaut $\frac1R$ dans toutes les directions. Un petit cercle de rayon $\rho < R$ tracé sur la sphère a pourtant la courbure $\frac1\rho$, plus grande : par le théorème de Meusnier ({{sf-gauss|Application de Gauss}}, (iv)), seule la composante normale de son accélération, $\frac1R$, est imposée par la surface.
    - |
      Sur le cylindre $x(u, v) = (R\cos u, R\sin u, v)$, de normale extérieure, la courbe $(R\cos t, R\sin t, bt)$, parcourue par la longueur, a une accélération horizontale dirigée vers l'axe, de composante normale $-\frac{R}{R^2 + b^2}$. C'est la courbure normale dans la direction de la vitesse : elle vaut $-\frac{\cos^2\vartheta}R$, où $\vartheta$ est l'angle de cette direction avec les cercles, puisque $\cos^2\vartheta = \frac{R^2}{R^2 + b^2}$.
    - |
      La courbure normale n'est pas la courbure de la courbe. Dans le plan $z = 0$, la seconde forme est nulle, et la courbure normale de toute direction est $0$ ; un cercle de rayon $\rho$ tracé dans ce plan a pourtant la courbure $\frac1\rho$, entièrement tangente à la surface.

  angle-vecteurs:
    - |
      Sur la sphère paramétrée par la latitude et la longitude, $F = \langle x_u, x_v \rangle = 0$ : l'angle de $x_u$ et de $x_v$ est $\frac\pi2$ en tout point, et méridiens et parallèles se coupent à angle droit, comme sur un globe.
    - |
      Sur le cylindre $x(u, v) = (\cos u, \sin u, v)$, où $E = G = 1$ et $F = 0$, la courbe $u = v = t$ a pour vitesse $x_u + x_v$, et son angle $\vartheta$ avec la génératrice, de direction $x_v$, vérifie
      $$\cos\vartheta = \frac{F + G}{\sqrt{E + 2F + G}\,\sqrt G} = \frac1{\sqrt2} :$$
      l'hélice fait l'angle $\frac\pi4$ avec les génératrices, en tout point.
    - |
      Les angles se calculent par $E$, $F$ et $G$ seuls, puisque $\langle a\,x_u + b\,x_v, c\,x_u + d\,x_v \rangle = Eac + F(ad + bc) + Gbd$. Deux surfaces isométriques ont donc, aux mêmes paramètres, les mêmes angles : la feuille de papier enroulée en cylindre garde les angles de ses tracés.

  surfaces-isometriques:
    - |
      Le cône $x(u, v) = (v\cos u, v\sin u, v)$ a pour [[premiere-forme-fondamentale|première forme]] $E = v^2$, $F = 0$, $G = 2$. La surface plane $y(u, v) = \big(\sqrt2\,v\cos\frac u{\sqrt2}, \sqrt2\,v\sin\frac u{\sqrt2}, 0\big)$ a les mêmes coefficients, comme on le vérifie en dérivant : sur $\mathbb R \times \,]0, +\infty[$, les deux surfaces sont isométriques. Un tour du cône, $u \in \,]{-\pi}, \pi[$, se déroule ainsi sur un secteur plan d'angle $\pi\sqrt2$.
    - |
      La caténoïde $x(u, v) = (\operatorname{ch} u\cos v, \operatorname{ch} u\sin v, u)$ et l'hélicoïde $y(u, v) = (\operatorname{sh} u\cos v, \operatorname{sh} u\sin v, v)$, où $\operatorname{ch}$ et $\operatorname{sh}$ sont les cosinus et sinus hyperboliques, ont toutes deux $E = G = \operatorname{ch}^2 u$ et $F = 0$, puisque $\operatorname{ch}^2 - \operatorname{sh}^2 = 1$. Elles sont isométriques, alors qu'elles n'ont pas la même forme dans l'espace : l'une est de révolution, l'autre est réglée.
    - |
      L'isométrie compare deux paramétrages sur le même ouvert, et non deux images. Les paramétrages $(u, v, 0)$ et $(2u, v, 0)$ du plan ont la même image, mais pas le même $E$, $1$ et $4$ : ils ne sont pas isométriques, et en effet le segment $v = 0$, $0 \leqslant u \leqslant 1$, a pour longueur $1$ dans le premier et $2$ dans le second. Plus loin, le Theorema egregium montrera qu'aucun paramétrage d'un morceau de sphère n'est isométrique à un paramétrage du plan ({{sf-egregium|Theorema egregium}}).

  changement-parametres:
    - |
      Les [[coordonnees-polaires|coordonnées polaires]] $\varphi(r, \theta) = (r\cos\theta, r\sin\theta)$, [[diffeomorphisme|difféomorphisme]] de $]0, +\infty[ \times \,]{-\pi}, \pi[$ sur le plan privé d'une demi-droite ({{cv-polaires|Coordonnées polaires}}, (i)), sont un changement de paramètres du plan $x(u, v) = (u, v, 0)$. Pour $\tilde x = x \circ \varphi$, on trouve $\tilde x_r \wedge \tilde x_\theta = r\,e_3$, et $r$ est bien le déterminant de $d\varphi$, comme le prévoit le point (i) de {{sf-surfaces|Surfaces paramétrées}}.
    - |
      L'échange des paramètres, $\varphi(u, v) = (v, u)$, de déterminant $-1$, change le signe du produit vectoriel : $x_v \wedge x_u = -x_u \wedge x_v$. Les deux paramétrages ont les mêmes plans tangents, mais des vecteurs normaux opposés. Toute quantité qui dépend du sens de la normale changera donc de signe avec l'ordre des paramètres.
    - |
      Un homéomorphisme lisse ne suffit pas. L'application $\varphi(s, t) = (s^3, t)$ est une bijection de $\mathbb R^2$ de classe $C^\infty$, mais sa réciproque n'est pas dérivable sur la droite $s = 0$. Le plan $(s^3, t, 0)$ qu'elle produit n'est pas régulier, puisque $\tilde x_s \wedge \tilde x_t = 3s^2\,e_3$ s'annule en $s = 0$ : le point (i) de {{sf-surfaces|Surfaces paramétrées}} tombe, alors que l'image n'a pas changé.

  longueur-riemannienne:
    - |
      Dans le demi-plan de Poincaré, le trajet le plus direct n'est pas le plus court. Le segment horizontal de $(0, \frac1{10})$ à $(1, \frac1{10})$ a pour longueur $\int_0^1 10\,dt = 10$. Le trajet qui monte verticalement jusqu'à la hauteur $1$, va horizontalement, puis redescend, a pour longueur $2\ln 10 + 1$, inférieure à $5{,}61$ : il est presque deux fois plus court, en passant là où la métrique est petite.
      ```schema lex-longueur-riemannienne-1
      Dans le demi-plan de Poincaré, le segment horizontal, en bleu, de longueur $10$, et le trajet rouge qui monte jusqu'à la hauteur $1$, de longueur $2\ln 10 + 1 < 5{,}61$ ; les flèches grises, de longueur proportionnelle à $v$, montrent un même déplacement de longueur riemannienne fixée, plus court près de l'axe.
      ```
    - |
      Sur la sphère unité, dans la carte $\sigma_+$, la courbe $z(t) = (t, 0)$, $t \in [0, 1]$, va du pôle sud $(0, 0, -1)$ au point $(1, 0, 0)$ de l'équateur, et sa longueur riemannienne est $\int_0^1 \frac{2\,dt}{1 + t^2} = \frac\pi2$ : c'est le quart de méridien, de longueur $\frac\pi2$ dans $\mathbb R^3$, comme l'annonce le point (ii) de {{sf-riemann|Métriques riemanniennes}}.
    - |
      La longueur ne dépend pas de la carte ({{sf-riemann|Métriques riemanniennes}}, (i)). Pour $t \in [\frac12, 1]$, la même courbe lue dans la carte $\sigma_-$ est $(w(t), 0)$, avec $w(t) = \frac1t$, puisque $\sigma_- \circ \sigma_+^{-1}(z) = \frac z{\|z\|_2^2}$, et la métrique y a la même forme, par le même calcul : $\int_{1/2}^1 \frac{2|w'|}{1 + w^2}\,dt$ vaut, comme $\int_{1/2}^1 \frac{2\,dt}{1 + t^2}$, le nombre $2(\frac\pi4 - \arctan\frac12)$.
