# Exemples du lexique : théorie « Les entiers naturels » (n).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  denombrable:
    - |
      Une partie stricte de $\lex{ensemble-entiers-naturels}{\mathbb N}$ peut être dénombrable. L'application $n \mapsto 2n$ est une [[injection]] de $\mathbb N$ dans lui-même, puisque deux entiers distincts sont comparables et que $m < n$ entraîne $2m < 2n$ ({{n-proprietes|Propriétés des opérations}}, (iv)) ; son image est l'ensemble des entiers pairs, dont elle est donc une [[bijection]] depuis $\mathbb N$. De même, le successeur est une bijection de $\mathbb N$ sur $\mathbb N \setminus \{0\}$ ({{n-peano|Axiomes de Peano}}).
    - |
      Un ensemble fini n'est pas dénombrable. Si $f$ était une bijection de $\mathbb N$ sur un entier $n$, sa restriction à la partie $n + 1$ de $\mathbb N$ serait une injection de $n + 1$ dans $n$, ce qu'interdit le principe des tiroirs ({{n-fini|Ensembles finis}}, (i)) ; par composition, aucun ensemble fini n'est donc équipotent à $\mathbb N$, et il est seulement au plus dénombrable. L'ensemble $\lex{ensemble-parties}{\mathcal P}(\mathbb N)$, lui, n'est pas même au plus dénombrable : puisque $\mathbb N$ s'injecte dans $\mathcal P(\mathbb N)$, une injection en sens inverse donnerait une bijection par le théorème de {{r-bernstein|Cantor-Bernstein}}, ce qu'exclut celui de {{r-cantor|Cantor}}.
    - |
      L'ensemble $\mathbb N \times \mathbb N$ est dénombrable, sans aucun choix. Posons $T(0) = 0$ et $T(k + 1) = T(k) + k + 1$ ({{n-recdef|Définition par récurrence}}), puis $c(m, n) = T(m + n) + n$ : les couples de la diagonale $m + n = s$ reçoivent les numéros consécutifs $T(s), \dots, T(s) + s = T(s + 1) - 1$. Pour tout entier $p$, le plus petit $s'$ tel que $p < T(s')$ existe, puisque $T(p + 1) \geqslant p + 1$, et il n'est pas nul ; avec $s = s' - 1$, on a $T(s) \leqslant p < T(s + 1)$.

      Ce $s$ est unique, $T$ étant strictement croissante, et l'unique $n$ tel que $T(s) + n = p$ ({{n-proprietes|Propriétés des opérations}}, (iii)) vérifie $n \leqslant s$, d'où un unique couple $(k, n)$ de numéro $p$, où $k$ est l'unique entier tel que $k + n = s$ (même point (iii)) : $c$ est une bijection. Plus loin, le nœud {{q-denombrable|ℚ est dénombrable}} en donnera une autre, $(p, q) \mapsto 2^p(2q + 1) - 1$, et en déduira que $\mathbb Q$ est dénombrable.
      ```schema lex-denombrable-3
      Chaque couple $(m, n)$ est placé en colonne $m$ et en ligne $n$, avec son numéro $c(m, n) = T(m + n) + n$, et les flèches suivent les numéros le long de chaque diagonale. Les couples de la diagonale $m + n = 3$, en rouge, reçoivent les numéros $6$ à $9$, et chaque diagonale reprend au numéro qui suit le dernier de la précédente : chaque entier numérote un couple et un seul.
      ```

  choix-denombrable:
    - |
      Le choix dénombrable ne sert que lorsque rien ne désigne un élément. Si $(A_n)_{n \in \mathbb N}$ est une [[suite]] de parties non vides de $\lex{ensemble-entiers-naturels}{\mathbb N}$, l'application $n \mapsto \min A_n$, définie par séparation dans $\mathbb N \times \mathbb N$, est une [[fonction-choix|fonction de choix]] : le plus petit élément ({{n-ordre|Bon ordre sur ℕ}}) choisit à notre place. De même, une famille finie d'ensembles non vides a une fonction de choix sans aucun axiome, par récurrence sur son nombre d'éléments, chaque étape n'instanciant qu'un énoncé existentiel.
    - |
      Voici un emploi typique. Soit $(A_n)$ une suite d'ensembles [[denombrable|dénombrables]] : pour chaque $n$, l'ensemble $B_n$ des [[bijection|bijections]] de $\mathbb N$ sur $A_n$ est non vide, mais rien n'en désigne une. Le choix dénombrable⋆ fournit une suite $(f_n)$ telle que $f_n \in B_n$ pour tout $n$, et l'application $(n, k) \mapsto f_n(k)$ est alors une [[surjection]] de $\mathbb N \times \mathbb N$ sur la réunion des $A_n$. C'est la seule étape qui choisisse : la surjection, une fois les $f_n$ donnés, est définie sans choix.
    - |
      Plus loin, la réciproque de la caractérisation séquentielle de l'adhérence ({{tr-sequentielle|Fermés et suites}}, (i)) choisira un terme dans chacun des ensembles d'une suite, ce qui est un emploi du choix dénombrable⋆. H. Herrlich et G. E. Strecker (« When is ℕ Lindelöf? », *Comment. Math. Univ. Carolinae* 38, 1997, p. 553-556) ont montré que, dans $\mathsf{ZF}$, cette réciproque pour toutes les parties de $\mathbb R$ équivaut au choix dénombrable pour les parties de $\mathbb R$ : on ne peut pas s'en passer en général.

  choix-dependant:
    - |
      Sur une partie de $\lex{ensemble-entiers-naturels}{\mathbb N}$, le choix dépendant se démontre. Soit $E = \{0, 1, 2\}$ et $R = \{(0, 1), (0, 2), (1, 2), (2, 0), (2, 1)\}$, où tout $x$ admet au moins un $y$ tel que $x \mathrel R y$. La [[suite]] définie par $x_0 = \min E$ et $x_{n+1} = g(x_n)$, où $g(x) = \min\{y \in E : x \mathrel R y\}$, existe par {{n-recdef|Définition par récurrence}}, et vaut $0, 1, 2, 0, 1, 2, \dots$ : la règle du plus petit élément remplace le choix.
      ```schema lex-choix-dependant-1
      Les flèches représentent la relation $R$ sur $\{0, 1, 2\}$, et de chaque point part au moins une flèche. La règle « prendre le plus petit $y$ tel que $x \mathrel R y$ » retient les trois flèches rouges, que la suite parcourt dans l'ordre $0, 1, 2, 0, \dots$ ; les flèches grises sont permises, mais la règle les écarte.
      ```
    - |
      L'hypothèse que tout $x$ admette un $y$ est indispensable. Pour $R = \{(0, 1), (1, 2)\}$ sur $\{0, 1, 2\}$, aucun $y$ ne vérifie $2 \mathrel R y$, et aucune suite ne convient : $x_0 \mathrel R x_1$ impose $x_1 \in \{1, 2\}$, puis $x_1 \mathrel R x_2$ impose $x_1 = 1$ et $x_2 = 2$, après quoi aucun $x_3$ ne vérifie $x_2 \mathrel R x_3$. L'ensemble doit aussi être non vide, faute de quoi il n'a aucune suite.
    - |
      Le choix dépendant entraîne le [[choix-denombrable]]. Soit $(A_n)$ une suite d'ensembles non vides, $E$ l'ensemble des [[application-domaine|applications de domaine]] un entier $k$ telles que $s(i) \in A_i$ pour $i < k$, et $s \mathrel R s'$ si $s'$ prolonge $s$ d'un point. L'application vide est dans $E$, et chaque $s$ se prolonge, $A_k$ n'étant pas vide ; le choix dépendant⋆ donne une suite $(s_n)$, et la réunion de leurs graphes est une fonction de choix de $(A_n)$. Plus loin, le théorème de Baire ({{f-baire|Théorème de Baire}}) lui sera équivalent (Blair, 1977).

  suite:
    - |
      Une suite n'est pas l'ensemble de ses termes. Soit $g$ l'application de $\{0, 1\}$ dans lui-même qui échange $0$ et $1$ : la suite $u$ définie par $u_0 = 0$ et $u_{n+1} = g(u_n)$ ({{n-recdef|Définition par récurrence}}) vaut $0, 1, 0, 1, \dots$, et la suite $v$ définie par $v_0 = 1$ et la même relation vaut $1, 0, 1, 0, \dots$. Elles ont le même ensemble de valeurs, $\{0, 1\}$, mais $u \neq v$, puisque $u_0 \neq v_0$ : deux [[application|applications]] égales coïncident en tout point.
    - |
      Une récurrence à deux termes se ramène à la récurrence simple, en passant aux couples. Soit $g(a, b) = (b, a + b)$ sur $\lex{ensemble-entiers-naturels}{\mathbb N} \times \mathbb N$, et $w$ la suite définie par $w_0 = (0, 1)$ et $w_{n+1} = g(w_n)$. La première composante $F_{n+1}$ de $w_{n+1}$ est la seconde de $w_n$, de sorte que la suite $F$ des premières composantes vérifie $F_0 = 0$, $F_1 = 1$ et $F_{n+2} = F_{n+1} + F_n$ ; elle commence par $0, 1, 1, 2, 3, 5, 8, 13$. C'est le procédé qui définit la [[factorielle]].
    - |
      Une suite injective $u$ d'éléments de $E$ est une [[bijection]] de $\mathbb N$ sur l'ensemble $u(\mathbb N)$ de ses termes, qui est donc une partie [[denombrable]] de $E$. Ainsi la suite $n \mapsto 2n$ fait de l'ensemble des entiers pairs une partie dénombrable de $\mathbb N$, alors que la suite $u$ du premier exemple, qui n'est pas injective, n'a que deux valeurs. Plus loin, on étudiera la convergence des suites de réels ({{su-convergence|Convergence}}).

  ensemble-fini:
    - |
      Un ensemble $\{a, b\}$, avec $a \neq b$, est fini, de deux éléments : l'application qui envoie $0$ sur $a$ et $1$ sur $b$ est une [[bijection]] de $2 = \{0, 1\}$ sur lui. L'ensemble vide est fini, [[equipotent|équipotent]] à $0 = \varnothing$, et tout entier $n$ est fini, équipotent à lui-même. Si $a = b$, cette application n'est plus injective, et $\{a, b\} = \{a\}$ n'a qu'un élément.
    - |
      L'ensemble $\lex{ensemble-entiers-naturels}{\mathbb N}$ n'est pas fini. Le successeur est une bijection de $\mathbb N$ sur sa partie stricte $\mathbb N \setminus \{0\}$ ({{n-peano|Axiomes de Peano}}) ; si $\mathbb N$ était fini, cette partie aurait le même [[nombre-elements|nombre d'éléments]] que lui, ce qu'interdit le point (iii) de {{n-fini|Ensembles finis}}. La réciproque n'est pas démontrable dans $\mathsf{ZF}$ : qu'un ensemble ne soit équipotent à aucune de ses parties strictes n'entraîne sa finitude qu'avec une forme de l'axiome du choix, comme le signale ce même nœud.
    - |
      Une partie de $\mathbb N$ contenue dans un entier $n$ est finie, avec au plus $n$ éléments, par le point (iii) de {{n-fini|Ensembles finis}} : ainsi la partie $\{0, 2\}$ de $3$ a deux éléments. L'ensemble des entiers pairs, au contraire, n'est pas fini : $n \mapsto 2n$ en est une bijection depuis $\mathbb N$, et s'il était équipotent à un entier, $\mathbb N$ le serait aussi ({{r-equipotence|Équipotence}}, (i)).

  ensemble-entiers-naturels:
    - |
      Les premiers entiers sont $0 = \varnothing$, $1 = \{0\}$, $2 = \{0, 1\}$ et $3 = \{0, 1, 2\}$ : chacun est le [[successeur-ensemble|successeur]] du précédent, et ses éléments sont les entiers construits avant lui. Ainsi $2 \in 3$ et $2 \subset 3$, et, parmi ces quatre ensembles, $m \in n$ a lieu exactement quand $m$ est construit avant $n$.
      ```schema lex-ensemble-entiers-naturels-1
      Une flèche va de $m$ vers $n$ lorsque $m \in n$, pour les entiers de $0$ à $3$. Entre deux entiers distincts, il y a une flèche et une seule, toujours du premier construit vers l'autre, et les flèches rouges montrent que $3 = \{0, 1, 2\}$ en reçoit une de chacun des trois entiers précédents.
      ```
    - |
      Contenir les entiers ne suffit pas pour être [[inductif-successeur|inductif]]. L'ensemble $\mathbb N \cup \{\mathbb N\}$ contient $0$ et le successeur de chaque entier, mais pas celui de $\mathbb N$ : $S(\mathbb N) = \mathbb N \cup \{\mathbb N\}$ n'appartient pas à lui-même ({{zf-bienfonde|Pas de x ∈ x}}). Retirer un élément détruit aussi l'inductivité : $\mathbb N \setminus \{0\}$ ne contient pas $\varnothing$, et $\mathbb N \setminus \{3\}$ contient $2$, mais pas $S(2) = 3$.
    - |
      La minimalité de $\mathbb N$ démontre des propriétés de tous ses éléments. Soit $A$ l'ensemble des $n \in \mathbb N$ tels que $n = 0$ ou $0 \in n$. Il contient $0$, et si $n \in A$, alors $0 \in S(n) = n \cup \{n\}$, puisque $0 = n$ ou $0 \in n$ : $A$ est inductif, donc $\mathbb N \subset A$, et tout entier non nul contient $0$. Plus loin, ce raisonnement deviendra le principe de récurrence ({{n-recurrence|Récurrence}}).

  n-uplet:
    - |
      Un $n$-uplet tient compte de l'ordre et des répétitions, contrairement à un ensemble. Les éléments $(0, 1)$ et $(1, 0)$ de $\lex{ensemble-entiers-naturels}{\mathbb N}^2$ sont distincts, puisqu'ils diffèrent en la coordonnée $1$, alors que $\{0, 1\} = \{1, 0\}$ ; et $(0, 0)$ a deux coordonnées pour une seule valeur, alors que $\{0, 0\} = \{0\}$. Deux $n$-uplets sont égaux si et seulement s'ils ont les mêmes coordonnées, comme deux [[famille|familles]] indexées par le même ensemble.
    - |
      Les $n$-uplets de $\{0, 1\}$ codent les parties de $\{1, \dots, n\}$. L'application qui envoie $(a_1, \dots, a_n)$ sur la partie $\{i : a_i = 1\}$ est une [[bijection]] de $\{0, 1\}^n$ sur $\lex{ensemble-parties}{\mathcal P}(\{1, \dots, n\})$ : sa réciproque envoie une partie $X$ sur le $n$-uplet qui vaut $1$ aux indices de $X$ et $0$ ailleurs. Pour $n = 3$, les huit $3$-uplets, de $(0, 0, 0)$ à $(1, 1, 1)$, correspondent ainsi aux huit parties de $\{1, 2, 3\}$, de $\varnothing$ à $\{1, 2, 3\}$.
    - |
      Le triplet $(a, b, c)$ du nœud {{r-couple|Couple de Kuratowski}}, qui est le [[couple]] $((a, b), c)$, et le $3$-uplet $(a, b, c)$, famille indexée par $\{1, 2, 3\}$, sont des ensembles différents, notés de la même façon. L'application $((a, b), c) \mapsto (a, b, c)$ est une bijection de $(A \times A) \times A$ sur $A^3$, et c'est elle qui justifie l'identification : on identifie les deux objets, on ne les égale pas.

  puissance:
    - |
      Dans $(\lex{ensemble-entiers-naturels}{\mathbb N}, \cdot)$, la définition donne $2^3 = 2^2 \cdot 2 = (2^1 \cdot 2) \cdot 2 = 8$, et $0^0 = 1$, puisque l'exposant nul donne le neutre quel que soit $x$, y compris $x = 0$ ; pour $n \geqslant 1$, au contraire, $0^n = 0^{n-1} \cdot 0 = 0$. L'égalité $0^0 = 1$ n'est donc pas une convention ajoutée, mais un cas de la définition, celui qui rend vraie la règle $x^{m+n} = x^m x^n$ pour $m = 0$.
    - |
      La règle $(xy)^n = x^n y^n$ suppose que $x$ et $y$ commutent. Dans l'ensemble des applications de $\{0, 1, 2\}$ dans lui-même, muni de la composition, de neutre l'[[identite|identité]] ({{r-composition|Composition}}), soit $a$ l'échange de $0$ et $1$, et $b$ celui de $1$ et $2$. Alors $a^2 = b^2 = \mathrm{id}$, donc $a^2 \circ b^2 = \mathrm{id}$, alors que $a \circ b$ envoie $0$ sur $1$, $1$ sur $2$ et $2$ sur $0$, et que $(a \circ b)^2$ envoie $0$ sur $2$ : $(a \circ b)^2 \neq a^2 \circ b^2$.
    - |
      L'exponentiation n'est pas associative. On a
      $$\begin{aligned} 2^{(2^3)} &= 2^8 = 256, \\ (2^2)^3 &= 2^{2 \cdot 3} = 64, \end{aligned}$$
      la seconde égalité par la règle $(x^m)^n = x^{mn}$. On lit $2^{2^3}$ comme $2^{(2^3)}$ ; la règle $(x^m)^n = x^{mn}$ traite l'autre parenthésage, et les deux ne coïncident que dans des cas particuliers, comme $2^{(2^2)} = (2^2)^2 = 16$.

  nombre-elements:
    - |
      Le nombre d'éléments compte les éléments, non leur taille. Les ensembles $\{0\}$ et $\{1\}$ ont chacun un élément, bien que $0 = \varnothing$ n'ait aucun élément et que $1 = \{0\}$ en ait un. L'ensemble $\lex{ensemble-parties}{\mathcal P}(2)$ a pour éléments les quatre parties distinctes $\varnothing$, $\{0\}$, $\{1\}$ et $\{0, 1\} = 2$, et $|\mathcal P(2)| = 4$.
    - |
      L'unicité du nombre d'éléments repose sur le principe des tiroirs ({{n-fini|Ensembles finis}}, (i)), que l'on peut constater à la main pour $3$ et $2$. Aucune des huit applications $f$ de $3$ dans $2$ n'est injective : si $f(0) \neq f(1)$, ces deux valeurs sont $0$ et $1$, et $f(2)$ est égale à l'une d'elles. Un ensemble [[equipotent|équipotent]] à $2$ ne l'est donc pas à $3$, alors que six des neuf applications de $2$ dans $3$ sont injectives.
    - |
      Le successeur ajoute exactement un élément : si $E$ est fini, $|E \cup \{E\}| = |E| + 1$. En effet $E \notin E$ ({{zf-bienfonde|Pas de x ∈ x}}), et une [[bijection]] de $k = |E|$ sur $E$ se prolonge en une bijection de $k + 1 = k \cup \{k\}$ sur $E \cup \{E\}$, en envoyant $k$ sur $E$. Par récurrence, chaque entier $n$ a exactement $n$ éléments, ce que le codage de Zermelo, où $2 = \{\{\varnothing\}\}$ n'a qu'un élément, ne donnerait pas.

  multiple-element:
    - |
      Dans $(\lex{ensemble-entiers-naturels}{\mathbb N}, +)$, le multiple $3 \cdot 2 = ((0 + 2) + 2) + 2 = 6$ coïncide avec le produit, comme l'indique le nœud {{n-sommes|Sommes finies}}. Dans $(\lex{ensemble-parties}{\mathcal P}(E), \cup)$, de neutre $\varnothing$, on a au contraire $n \cdot X = X$ pour tout $n \geqslant 1$, puisque $X \cup X = X$ : un multiple n'est pas toujours « plus grand » que l'élément.
    - |
      Un multiple non nul d'un élément non nul peut être nul. Sur $\{0, 1\}$, la loi définie par $0 + 0 = 1 + 1 = 0$ et $0 + 1 = 1 + 0 = 1$ est associative, ce que l'on vérifie sur les huit triplets, et $0$ en est le neutre. Alors $2 \cdot 1 = 1 + 1 = 0$, puis $(2k) \cdot 1 = k \cdot (2 \cdot 1) = k \cdot 0 = 0$ par le point (vi) de {{n-sommes|Sommes finies}}, et $(2k + 1) \cdot 1 = 0 + 1 = 1$. Plus loin, cette loi sera l'addition de l'anneau $\mathbb Z/2\mathbb Z$ ({{z-zn|ℤ/nℤ}}), où $2 \cdot \overline 1 = \overline 0$.

  successeur-ensemble:
    - |
      Le successeur s'applique à tout ensemble, pas seulement aux entiers. Pour $x = \{1\} = \{\{0\}\}$, on obtient $S(x) = \{\{0\}, \{\{0\}\}\}$, ensemble à deux éléments comme $2 = \{0, 1\}$, mais différent de $2$, puisque $0 = \varnothing$ n'en est pas élément : ni $\{0\}$ ni $\{\{0\}\}$ ne sont vides. Dans tous les cas, $x \in S(x)$ et $x \subset S(x)$, et $S(x) \neq x$, car $x \notin x$ ({{zf-bienfonde|Pas de x ∈ x}}).
    - |
      Le codage de von Neumann n'est pas le seul. Avec le successeur de Zermelo, $x \mapsto \{x\}$, l'entier $2$ serait $\{\{\varnothing\}\}$, qui n'a qu'un élément, alors que $S(S(\varnothing)) = \{\varnothing, \{\varnothing\}\}$ en a deux. Dans les deux codages, $x$ appartient à son successeur, qui n'est donc jamais $0 = \varnothing$, et seules comptent les propriétés démontrées ensuite, comme le dit la remarque du nœud {{n-succ|Successeur, inductif}} ; c'est le choix de von Neumann qui fait de chaque entier l'ensemble des entiers construits avant lui.
    - |
      La réunion défait le successeur sur les [[ensemble-transitif|ensembles transitifs]]. Les éléments de $\bigcup S(x)$ sont ceux de $x$ et ceux de ses éléments ; si $x$ est transitif, ces derniers sont déjà dans $x$, et $\bigcup S(x) = x$, ainsi $\bigcup S(3) = 3$. Sans la transitivité, l'égalité tombe : $x = \{1\}$ n'est pas transitif, puisque $0 \in 1 \in x$ sans que $0 \in x$, et
      $$\bigcup S(x) = 1 \cup \{1\} = \{0, 1\} = 2 \neq x.$$

  factorielle:
    - |
      La factorielle ne se définit pas par une récurrence $(k + 1)! = g(k!)$ : aucune application $g$ ne convient, puisque $0! = 1! = 1$ exigerait $g(1) = 1! = 1$ et $g(1) = 2! = 2$. D'où le détour par les couples du nœud {{n-sommes|Sommes finies}}, dont chacun porte l'indice et sa factorielle :
      $$\begin{aligned} u_0 &= (0, 1), \ u_1 = (1, 1), \\ u_2 &= (2, 2), \ u_3 = (3, 6), \\ u_4 &= (4, 24), \ u_5 = (5, 120). \end{aligned}$$
    - |
      Les [[bijection|bijections]] de $\{0, 1, 2\}$ sur lui-même sont au nombre de $3! = 6$ : l'identité, les trois échanges de deux éléments, qui fixent le troisième, et les deux permutations circulaires, $0 \mapsto 1 \mapsto 2 \mapsto 0$ et $0 \mapsto 2 \mapsto 1 \mapsto 0$. Une bijection qui fixe deux points fixe aussi le troisième, et l'on vérifie que la liste est complète en examinant l'image de $0$, puis celle de $1$.
    - |
      La factorielle finit par dépasser les puissances de $2$ : $k! > 2^k$ dès que $k \geqslant 4$. C'est vrai pour $k = 4$, puisque $24 > 16$, et si $k! > 2^k$, alors $(k + 1)! = (k + 1)\,k! > 2 \cdot 2^k = 2^{k+1}$. L'hypothèse $k \geqslant 4$ ne peut pas être retirée : $3! = 6 < 8 = 2^3$. Plus loin, les quotients $x^k / k!$ de la série de l'exponentielle ({{ex-serie|Série de l'exponentielle}}) tendront vers $0$ parce que la factorielle finit par l'emporter sur toute puissance.
