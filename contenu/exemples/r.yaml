# Exemples du lexique : théorie « ℝ » (r).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  suite-cauchy:
    - |
      Dans $\lex{ensemble-rationnels}{\mathbb Q}$, muni de $d(x, y) = |x - y|$, où la [[valeur-absolue|valeur absolue]] est $|t| = \max(t, -t)$, la [[suite]] $u_n = 1/(n + 1)$ est de Cauchy. Pour $p, q \geqslant N$, les deux termes sont dans $]0, 1/(N + 1)]$, donc $|u_p - u_q| \leqslant 1/(N + 1)$, et il suffit que $N + 1 > 1/\varepsilon$, ce que permet la propriété d'Archimède ({{q-archimede|Archimède, densité}}). Pour $\varepsilon = 1/100$, le rang $N = 100$ convient.
    - |
      Il ne suffit pas que deux termes consécutifs se rapprochent. Les sommes $H_n = 1 + \frac12 + \cdots + \frac1n$ vérifient $H_{n+1} - H_n = \frac1{n + 1}$, aussi petit qu'on veut, mais $H_{2n} - H_n$ est une somme de $n$ termes au moins égaux à $\frac1{2n}$, donc $H_{2n} - H_n \geqslant \frac12$. Avec $\varepsilon = \frac12$, aucun rang $N$ ne convient, puisque $q = N + 1$ et $p = 2N + 2$ donnent un écart d'au moins $\frac12$ : la suite $(H_n)$ n'est pas de Cauchy.

      ```schema lex-suite-cauchy-2
      Les points $(n, H_n)$, pour $1 \leqslant n \leqslant 24$, montent par pas de plus en plus courts. Les deux flèches rouges mesurent $H_{12} - H_6$ et $H_{24} - H_{12}$, qui dépassent chacune $1/2$ : en doublant l'indice, on monte toujours d'au moins $1/2$.
      ```
    - |
      Une suite de Cauchy de rationnels peut n'avoir aucune limite rationnelle. Soit $u_0 = 3/2$ et $u_{n+1} = \frac12\big(u_n + \frac2{u_n}\big)$, d'où $u_1 = 17/12$ et $u_2 = 577/408$. Avec $e_n = u_n^2 - 2$, on calcule
      $$e_{n+1} = \frac{e_n^2}{4u_n^2}, \qquad u_n - u_{n+1} = \frac{e_n}{2u_n},$$
      de sorte que les $u_n$ sont strictement positifs, les $e_n$ positifs, la suite décroît, et $1 \leqslant u_n \leqslant 3/2$.

      Pour $p \geqslant q$, la décroissance et $u_p^2 \geqslant 2$ donnent $2/u_q \leqslant 2/u_p \leqslant u_p \leqslant u_q$, d'où $0 \leqslant u_q - u_p \leqslant u_q - 2/u_q = e_q/u_q \leqslant e_q$. Comme $e_0 = \frac14$ et $e_{n+1} = e_n \cdot \frac{e_n}{4u_n^2} \leqslant \frac{e_n}{32}$, on a $e_q \leqslant 32^{-q} \leqslant \frac1{q + 1}$, et la suite est de Cauchy par la propriété d'Archimède.

      Si un rationnel $\ell$ était tel que, pour tout $\varepsilon > 0$, on ait $|u_n - \ell| < \varepsilon$ pour tout $n$ assez grand, alors $|\ell^2 - 2| \leqslant (3/2 + |\ell|)\,|u_n - \ell| + e_n$ serait aussi petit qu'on veut, et $\ell^2 = 2$, ce qu'exclut {{q-irrationnel|Irrationalité de √2}}.

      Plus loin, on montrera que dans $\lex{ensemble-reels}{\mathbb R}$, au contraire, toute suite de Cauchy converge ({{me-cauchy|Espaces complets}}).

  coupure-positive:
    - |
      Les coupures positives sont les réels positifs pour l'ordre d'inclusion. La coupure $1^*$ est strictement positive, puisqu'elle contient $0$, de même que la coupure $\Gamma = \{x \in \lex{ensemble-rationnels}{\mathbb Q} : x \leqslant 0 \text{ ou } x^2 < 2\}$. La coupure $(-1)^*$ ne l'est pas, puisque $-1/2$ appartient à $0^*$ et non à $(-1)^*$ ; c'est donc son opposée qui l'est, par {{rm-positives|Produit des positives}}, (i), et en effet $-(-1)^* = 1^*$ par {{rr-addition|Addition des réels}}, (iii).
    - |
      La formule du produit ne vaut que pour des coupures positives. Appliquée à $C = (-1)^*$ et $D = 1^*$, elle donnerait $0^*$, puisque $C_+$ est vide, alors que l'on attend $(-1)^*$ ; appliquée à $(-1)^*$ et $(-1)^*$, elle donnerait encore $0^*$, au lieu de $1^*$. Sans l'hypothèse de positivité, $1^*$ cesserait d'être neutre et le produit de deux éléments non nuls serait nul.
    - |
      Sur les rationnels positifs, le produit des coupures prolonge celui de $\mathbb Q$ ; par exemple, $(1/2)^* \cdot (2/3)^* = (1/3)^*$. Les produits $cd$ avec $0 \leqslant c < 1/2$ et $0 \leqslant d < 2/3$ sont dans $[0, 1/3[$. Inversement, pour $0 < z < 1/3$, le rationnel $c = (3z + 1)/4$ vérifie $3z/2 < c < 1/2$, et $d = z/c$ vérifie $0 < d < 2/3$, d'où $z = cd$ ; enfin $0 = 0 \cdot 0$.

      Plus loin, on montrera que $q \mapsto q^*$ respecte le produit pour tous les rationnels, et pas seulement les positifs ({{rm-ordre|Corps ordonné, ℚ ⊂ ℝ}}).

  corps-ordonne-complet:
    - |
      Le [[corps-ordonne|corps ordonné]] $\lex{ensemble-rationnels}{\mathbb Q}$ n'est pas complet : la partie $\{x \in \mathbb Q : x^2 < 2\}$, non vide et majorée par $2$, n'y a pas de [[borne-superieure|borne supérieure]] ({{q-irrationnel|Irrationalité de √2}}). Dans le corps ordonné complet $\lex{ensemble-reels}{\mathbb R}$, l'image de cette partie par $q \mapsto q^*$ a pour borne supérieure la réunion des $q^*$ ({{od-coupures|Coupures de Dedekind}}). C'est la coupure $\Gamma$ des rationnels négatifs ou de carré inférieur à $2$ : un rationnel $x < q$, avec $q^2 < 2$, est négatif ou de carré inférieur à $q^2$, et tout $x \in \Gamma$ est inférieur à $1$ s'il est négatif, ou à un élément de $\Gamma$ plus grand que lui, donc positif de carré inférieur à $2$. Le carré de $\Gamma$ est $2^*$ ({{rm-positives|Produit des positives}}, seconde remarque).
    - |
      Un corps ordonné peut aussi manquer de bornes supérieures à cause d'éléments infiniment grands. C'est le cas du [[corps-fractions|corps des fractions]] $\mathbb Q(X)$ de $\lex{anneau-polynomes}{\mathbb Q[X]}$, ordonné en déclarant positives les fractions $P/Q$ telles que $PQ$ soit nul ou de [[coefficient-dominant|coefficient dominant]] strictement positif : la seconde remarque de {{q-archimede|Archimède, densité}} démontre que c'est un corps ordonné.

      La partie $\lex{ensemble-entiers-naturels}{\mathbb N}$ y est majorée par $X$, puisque $X - n$ est [[polynome-unitaire|unitaire]]. Si elle avait une borne supérieure $s$, alors $s - 1$, plus petit, ne la majorerait pas : on aurait $n > s - 1$ pour un entier $n$, donc $n + 1 > s$, ce qui est absurde. Plus loin, cet argument montrera qu'un corps ordonné complet est toujours [[archimedien|archimédien]] ({{rr-archimede|Archimède, densité de ℚ}}).

  ensemble-reels:
    - |
      La coupure $\Gamma = \{x \in \lex{ensemble-rationnels}{\mathbb Q} : x \leqslant 0 \text{ ou } x^2 < 2\}$ est un réel qui n'est de la forme $q^*$ pour aucun rationnel $q$, comme le démontre la seconde remarque de {{q-irrationnel|Irrationalité de √2}}. L'ordre d'inclusion la situe pourtant parmi les rationnels.

      Comme $141^2 = 19881 < 20000$, le rationnel $141/100$ appartient à $\Gamma$, donc $(141/100)^* \subset \Gamma$, et l'inclusion est stricte, puisque $141/100 \notin (141/100)^*$. Tout $x \in \Gamma$ vérifie $x < 142/100$, car $142^2 = 20164 > 20000$ ; d'où $\Gamma \subset (142/100)^*$, strictement aussi, puisque $1415/1000$ est dans le second sans être dans $\Gamma$. Dans $\mathbb R$, on a donc $141/100 < \Gamma < 142/100$.
    - |
      La [[propriete-borne-superieure|propriété de la borne supérieure]] est ce que $\mathbb R$ ajoute à $\mathbb Q$. La partie $A = \{x \in \mathbb Q : x^2 < 2\}$ n'a pas de borne supérieure dans $\mathbb Q$, mais $\{q^* : q \in A\}$ en a une dans $\mathbb R$, la réunion des $q^*$ ({{od-coupures|Coupures de Dedekind}}), qui est exactement $\Gamma$.

      En effet, un rationnel $x < q$, avec $q \in A$, est négatif ou de carré inférieur à $q^2 < 2$. Inversement, tout $x \in \Gamma$ est strictement inférieur à un élément de $A$ : à $1$ si $x \leqslant 0$, et sinon à un élément de $\Gamma$ plus grand que $x$, qui existe parce que $\Gamma$, coupure, n'a pas de [[plus-grand-element|plus grand élément]].
    - |
      La condition « sans plus grand élément » des coupures n'est pas décorative. Sans elle, $]{\leftarrow}, 0[$ et $]{\leftarrow}, 0]$ seraient deux « réels » distincts associés au même rationnel $0$, et aucun [[segment-initial|segment initial]] ne s'intercalerait strictement entre eux : un tel segment contiendrait un élément de $]{\leftarrow}, 0]$ hors de $]{\leftarrow}, 0[$, c'est-à-dire $0$, donc tout $]{\leftarrow}, 0]$. L'ordre obtenu aurait un saut en chaque rationnel.

      Plus loin, $\mathbb R$ recevra une addition et une multiplication qui en font un corps ordonné complet ({{rr-complet|Corps ordonné complet}}).

  partie-entiere:
    - |
      Pour un rationnel $a/b$ avec $b \geqslant 1$, la partie entière est le quotient de la [[division-euclidienne|division euclidienne]] de $a$ par $b$ : de $a = bq + r$ avec $0 \leqslant r < b$, on tire $q \leqslant a/b < q + 1$ en divisant par $b > 0$. Ainsi $\lfloor 7/3 \rfloor = 2$, et $\lfloor -7/3 \rfloor = -3$, puisque $-7 = 3 \cdot (-3) + 2$ ; la partie entière d'un négatif non entier n'est pas l'opposé de celle de son opposé.

      ```schema lex-partie-entiere-1
      Chaque marche du graphe de $x \mapsto \lfloor x \rfloor$ contient son extrémité gauche (point plein) et non sa droite (point creux). Les verticales pointillées, en $7/3$ et en $-7/3$, rencontrent les marches de hauteur $2$ et $-3$.
      ```
    - |
      La partie entière commute avec l'addition d'un entier, $\lfloor x + m \rfloor = \lfloor x \rfloor + m$, mais pas avec celle d'un réel quelconque : pour $x = y = 1/2$, $\lfloor x + y \rfloor = 1$, alors que $\lfloor x \rfloor + \lfloor y \rfloor = 0$. On a seulement l'encadrement
      $$\lfloor x \rfloor + \lfloor y \rfloor \leqslant \lfloor x + y \rfloor \leqslant \lfloor x \rfloor + \lfloor y \rfloor + 1,$$
      puisque l'entier $k = \lfloor x \rfloor + \lfloor y \rfloor$ vérifie $k \leqslant x + y < k + 2$.
    - |
      La partie entière donne les approximations décimales. Le réel $\Gamma$, formé des rationnels négatifs ou de carré inférieur à $2$, vérifie $\Gamma^2 = 2$ ({{rm-positives|Produit des positives}}, seconde remarque). Si l'on avait $\Gamma \leqslant 1{,}41$, on aurait $\Gamma^2 \leqslant 1{,}9881$ en multipliant des inégalités entre positifs ({{q-ordre|Ordre de ℚ}}, (i)), et de même $\Gamma \geqslant 1{,}42$ donnerait $\Gamma^2 \geqslant 2{,}0164$.

      Donc $141 < 100\,\Gamma < 142$, et $\lfloor 100\,\Gamma \rfloor = 141$. En général, $\lfloor 10^n x \rfloor / 10^n$ est l'approximation décimale de $x$ par défaut à $10^{-n}$ près.
