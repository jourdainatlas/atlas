# Exemples du lexique : théorie « Cohomologie des groupes » (cohgr).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  g-module:
    - |
      Le groupe $\lex{groupe-symetrique}{\mathfrak S_3}$ agit sur $\lex{ensemble-entiers-relatifs}{\mathbb Z}^3$ en permutant les coordonnées, à condition de placer l'inverse au bon endroit. La formule $(\sigma \cdot x)_i = x_{\sigma^{-1}(i)}$ vérifie $\sigma \cdot (\tau \cdot x) = (\sigma\tau) \cdot x$, puisque $(\sigma \cdot (\tau \cdot x))_i = (\tau \cdot x)_{\sigma^{-1}(i)} = x_{\tau^{-1}\sigma^{-1}(i)}$ ; chaque $x \mapsto \sigma \cdot x$ est additive, et $\mathbb Z^3$ est un $\mathfrak S_3$-module. La formule $(\sigma \cdot x)_i = x_{\sigma(i)}$, plus naturelle en apparence, ne définit pas une [[action-groupe|action]] : pour $\sigma = (1\ 2)$, $\tau = (2\ 3)$ et $x = (1, 0, 0)$, elle donne $\sigma \cdot (\tau \cdot x) = (0, 1, 0)$, mais $(\sigma\tau) \cdot x = (0, 0, 1)$.
    - |
      Un sous-groupe distingué et abélien devient un module par conjugaison ({{cg-modules|G-modules}}, (iv)). Dans $\lex{groupe-symetrique}{\mathfrak S_3}$, le [[groupe-alterne|groupe alterné]] $\mathfrak A_3 = \{\mathrm{id}, c, c^2\}$, avec $c = (1\ 2\ 3)$, est abélien et distingué. En suivant les images, $(1\ 2)$ conjugue $c$ en $(1\ 3\ 2) = c^{-1}$ ; une permutation impaire $\sigma$ s'écrit $(1\ 2)a$ avec $a \in \mathfrak A_3$, qui commute à $c$, et conjugue donc aussi $c$ en $c^{-1}$. L'action s'écrit $\sigma \cdot y = y^{\varepsilon(\sigma)}$, où $\varepsilon$ est la [[signature-permutation|signature]]. Les éléments de $\mathfrak A_3$ agissant trivialement, c'est aussi un module sur $\mathfrak S_3/\mathfrak A_3$, dont l'élément non trivial agit par $y \mapsto y^{-1}$ ; en notation additive, c'est $\mathbb Z/3\mathbb Z$, avec $s \cdot a = -a$.
    - |
      Une structure de $G$-module sur $A$ est la donnée d'un [[morphisme-groupes|morphisme]] $\rho : G \to \operatorname{Aut}(A)$ ({{cg-modules|G-modules}}, (i)). Pour $G = \{e, s\}$ d'ordre $2$ et $A = \lex{anneau-zn}{\mathbb Z/8\mathbb Z}$, le groupe $\operatorname{Aut}(A)$ est formé des multiplications par $\bar 1$, $\bar 3$, $\bar 5$ et $\bar 7$ ({{gf-produits|Produits semi-directs}}, (iv)), et le carré de chacune est l'identité, puisque $9$, $25$ et $49$ sont congrus à $1$ modulo $8$. Chacune peut donc être $\rho(s)$ : $A$ porte quatre structures de $G$-module, $s \cdot x = \bar ax$ pour $a = 1, 3, 5, 7$. Les trois structures non triviales donnent des produits semi-directs deux à deux non isomorphes ({{gf-pq-non-abelien|pq non abélien}}, deuxième remarque).

  cohomologie-groupes:
    - |
      En degré $0$, la cohomologie est le groupe des [[invariants-g-module|invariants]] ({{cg-cochaines|Cochaînes, cohomologie}}, (ii)). Le groupe $(\mathbb Z/8\mathbb Z)^\times = \{\bar 1, \bar 3, \bar 5, \bar 7\}$ agit sur $\lex{anneau-zn}{\mathbb Z/8\mathbb Z}$ par multiplication ({{gf-produits|Produits semi-directs}}, (iv)). Un élément $a$ est un cocycle de degré $0$ si $(d^0a)(g) = ga - a$ est nul pour tout $g$ ; pour $g = \bar 3$, c'est $2a = \bar 0$, condition qui entraîne les deux autres, $4a = \bar 0$ et $6a = \bar 0$. Comme $B^0 = \{0\}$, on trouve $H^0 = \{\bar 0, \bar 4\}$.
    - |
      La cohomologie dépend de l'action, et pas seulement du groupe abélien. Soit $G = \{e, s\}$ d'ordre $2$ et $A = \lex{ensemble-entiers-relatifs}{\mathbb Z}$. Un [[cocycle-groupe|cocycle]] $f$ de degré $1$ vérifie $f(e) = 0$ ({{cg-cochaines|Cochaînes, cohomologie}}, (iii)) et $0 = f(s s) = f(s) + s \cdot f(s)$. Pour l'action triviale, c'est $2f(s) = 0$, donc $f = 0$, et $H^1(G, \mathbb Z) = 0$. Pour $s \cdot a = -a$, la condition est toujours remplie : $f \mapsto f(s)$ identifie $Z^1$ à $\mathbb Z$, et les [[cobord-groupe|cobords]], $(d^0a)(s) = -2a$, à $2\mathbb Z$. Ainsi $H^1(G, \mathbb Z) \cong \mathbb Z/2\mathbb Z$ pour cette action.
    - |
      Le même calcul, pour $s \cdot a = -a$ sur $\lex{anneau-zn}{\mathbb Z/3\mathbb Z}$ et sur $\mathbb Z/4\mathbb Z$, identifie $Z^1$ à $A$ par $f \mapsto f(s)$, et $B^1$ aux $-2a$. Sur $\mathbb Z/3\mathbb Z$, où $-\bar 2 = \bar 1$, les $-2a$ parcourent $A$, et $H^1 = 0$ ; sur $\mathbb Z/4\mathbb Z$, ils forment $\{\bar 0, \bar 2\}$, et $H^1$ a deux éléments. Dans les deux cas, $2$ annule $H^1$, et sur $\mathbb Z/3\mathbb Z$, où la multiplication par $2$ est bijective, il ne reste rien. Plus loin, le nœud {{cg-annulation|Annulation}} montre que, pour $G$ fini d'ordre $m$ et $n \geqslant 1$, $m$ annule $H^n(G, A)$, qui est nul si $a \mapsto ma$ est bijective sur $A$.

  cocycle-groupe:
    - |
      La condition de cocycle dépend de l'action. Pour $G = \{e, s\}$ d'ordre $2$ et $A = \lex{anneau-zn}{\mathbb Z/3\mathbb Z}$, un cocycle $f$ de degré $1$ vérifie $f(e) = 0$ ({{cg-cochaines|Cochaînes, cohomologie}}, (iii)) et $0 = f(ss) = f(s) + s \cdot f(s)$. Pour l'[[action-triviale|action triviale]], c'est $2f(s) = \bar 0$, d'où $f(s) = \bar 0$ : le seul cocycle est nul. Pour l'action $s \cdot a = -a$, la condition est toujours remplie, et les trois applications nulles en $e$ sont des cocycles.
    - |
      Le point (iii) de {{cg-cochaines|Cochaînes, cohomologie}} élimine d'emblée bien des cochaînes de degré $2$. Pour $G = \{e, s\}$ et $A = \lex{anneau-zn}{\mathbb Z/2\mathbb Z}$, muni de l'action triviale, la [[cochaine-groupe|cochaîne]] $c$ qui vaut $\bar 1$ en $(e, s)$ et $\bar 0$ ailleurs n'est pas un cocycle : $(d^2c)(e, e, s) = c(e, s) - c(e, s) + c(e, s) - c(e, e) = \bar 1$. Un cocycle prend donc la même valeur $x$ en $(e, e)$, $(e, s)$ et $(s, e)$. Réciproquement, soit une telle cochaîne, et $y = c(s, s)$. Si $g = e$, les deux premiers termes de $(d^2c)(g, h, k) = c(h, k) - c(gh, k) + c(g, hk) - c(g, h)$ sont égaux et les deux derniers valent $x$ ; si $h = e$, les deux termes du milieu sont égaux et les deux autres valent $x$ ; si $k = e$, les deux derniers sont égaux et les deux premiers valent $x$. Enfin $(d^2c)(s, s, s) = y - x + x - y = \bar 0$ : il y a quatre cocycles, un par choix de $x$ et de $y$, parmi les seize cochaînes.
    - |
      En degré $1$, un cocycle est un [[homomorphisme-croise|homomorphisme croisé]], $f(gh) = f(g) + g\,f(h)$ ; en degré $2$, la condition de cocycle est une associativité. Sur $A \times G$, la formule $(a, g)(b, h) = (a + gb + c(g, h), gh)$ donne, pour les deux parenthésages d'un produit de trois éléments, des premières composantes qui diffèrent de $g\,c(h, k) - c(gh, k) + c(g, hk) - c(g, h) = (d^2c)(g, h, k)$. Plus loin, la preuve du point (ii) de {{cg-extensions|Extensions et H²}} en tire, pour un cocycle normalisé, un groupe $E_c$, extension de $G$ par $A$.

  cobord-groupe:
    - |
      Tout cobord est un [[cocycle-groupe|cocycle]] ({{cg-cochaines|Cochaînes, cohomologie}}, (i)), mais la réciproque est fausse. Soit $G = \{e, s\}$ agissant sur $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ par $s \cdot a = -a$. Toute application $f$ nulle en $e$ est un cocycle de degré $1$, puisque $f(ss) = 0 = f(s) + s \cdot f(s)$. Les cobords sont les $d^0a$, avec $(d^0a)(s) = -a - a = -2a$ : ce sont les cocycles pour lesquels $f(s)$ est pair, et le cocycle tel que $f(s) = 1$ n'en est pas un.
    - |
      Pour l'[[action-triviale|action triviale]], il n'y a aucun cobord non nul de degré $1$, puisque $(d^0a)(g) = a - a = 0$. Tout cocycle non nul de degré $1$, c'est-à-dire tout morphisme non nul de $G$ dans $A$, définit alors une classe non nulle. Ainsi la [[signature-permutation|signature]] de $\lex{groupe-symetrique}{\mathfrak S_3}$, lue additivement dans $\lex{anneau-zn}{\mathbb Z/2\mathbb Z}$, avec $\bar 0$ pour les permutations paires et $\bar 1$ pour les impaires, est un cocycle qui n'est pas un cobord.
    - |
      En degré $2$, pour $G = \{e, s\}$ et $A = \lex{anneau-zn}{\mathbb Z/2\mathbb Z}$, muni de l'action triviale, le cobord d'une cochaîne $b$ de degré $1$, avec $b(e) = x$ et $b(s) = y$, est $(d^1b)(g, h) = b(h) - b(gh) + b(g)$. Il vaut $x$ en $(e, e)$, $(e, s)$ et $(s, e)$, et $2y - x = x$ en $(s, s)$ : les cobords sont les deux cochaînes constantes. Le cocycle qui vaut $\bar 1$ en $(s, s)$ et $\bar 0$ ailleurs n'est donc pas un cobord. Plus loin, la remarque du nœud {{cg-extensions|Extensions et H²}} montre que sa classe est celle de l'extension $\mathbb Z/4\mathbb Z$ de $\mathbb Z/2\mathbb Z$ par $\mathbb Z/2\mathbb Z$.

  homomorphisme-croise:
    - |
      Pour l'[[action-triviale|action triviale]], un homomorphisme croisé est un [[morphisme-groupes|morphisme]], puisque $g\,f(h) = f(h)$. Ainsi, pour l'action triviale de $\lex{groupe-symetrique}{\mathfrak S_3}$ sur $\lex{anneau-zn}{\mathbb Z/2\mathbb Z}$, la [[signature-permutation|signature]], lue additivement, avec $\bar 0$ pour les permutations paires et $\bar 1$ pour les impaires, est un homomorphisme croisé, puisque c'est un morphisme ({{v-permutations|Permutations, signature}}, (ii)).
    - |
      Avec une action non triviale, un homomorphisme croisé n'est en général pas un morphisme. Pour $G = \{e, s\}$ agissant sur $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ par $s \cdot a = -a$, les homomorphismes croisés sont les $f$ tels que $f(e) = 0$, la valeur $f(s)$ étant quelconque : la relation est alors automatique dès que $g$ ou $h$ vaut $e$, et pour $g = h = s$ elle s'écrit $f(e) = f(s) - f(s)$. Aucun d'eux n'est un morphisme, sauf l'application nulle : un morphisme $f$ de $G$ dans $\mathbb Z$ vérifie $2f(s) = f(e) = 0$. Les homomorphismes croisés de la forme $g \mapsto ga - a$ sont ceux pour lesquels $f(s) = -2a$ est pair.
    - |
      Dans le [[produit-semi-direct|produit semi-direct]] $A \rtimes G$, de loi $(a, g)(b, h) = (a + gb, gh)$ ({{gf-produits|Produits semi-directs}}), le graphe $H_f = \{(f(g), g) : g \in G\}$ d'une application $f$ est stable par produit si et seulement si $f$ est un homomorphisme croisé, puisque $(f(g), g)(f(h), h) = (f(g) + g\,f(h), gh)$. Pour $A = \lex{anneau-zn}{\mathbb Z/4\mathbb Z}$ et $s \cdot a = -a$, chacun des quatre ensembles $\{(\bar 0, e), (a, s)\}$ est un sous-groupe, puisque $(a, s)(a, s) = (a - a, e)$. Plus loin, le nœud {{cg-complements|Compléments et H¹}} reconnaît dans ces graphes les compléments de $A$ dans $A \rtimes G$.

  complement-groupe:
    - |
      Un complément n'est en général ni unique ni distingué. Dans $\lex{groupe-symetrique}{\mathfrak S_3}$, le [[groupe-alterne|groupe alterné]] $\mathfrak A_3$ est distingué, et chacun des trois sous-groupes $H = \{\mathrm{id}, \tau\}$ formés de l'identité et d'une [[transposition]] en est un complément. En effet, $\tau$ est impaire, d'où $\mathfrak A_3 \cap H = \{\mathrm{id}\}$, et $(a, h) \mapsto ah$ est injective de $\mathfrak A_3 \times H$ dans $\mathfrak S_3$, puisque $ah = a'h'$ entraîne $a'^{-1}a = h'h^{-1} \in \mathfrak A_3 \cap H$ ; ses six valeurs remplissent $\mathfrak S_3$. Ces trois compléments sont conjugués ({{cg-complements|Compléments et H¹}}, deuxième remarque), et aucun n'est distingué.
    - |
      Un sous-groupe distingué n'a pas toujours de complément. Si $N \cap H = \{e\}$ et $NH = E$, l'application $(n, h) \mapsto nh$ est une bijection de $N \times H$ sur $E$, et $|H| = |E|/|N|$. Dans $\lex{anneau-zn}{\mathbb Z/4\mathbb Z}$, le seul sous-groupe d'ordre $2$ est $N = \{\bar 0, \bar 2\}$ lui-même ({{gf-cycliques|Groupes cycliques}}, (iii)) : $N$ n'a pas de complément. Dans le groupe des quaternions $\mathcal Q_8$, tout sous-groupe autre que $\{I\}$ contient $-I$, puisque $u^2 = -I$ pour $u \neq \pm I$ ({{gf-diedraux|Diédraux, quaternions}}, (iii)), et $\{\pm I\}$ n'a pas de complément non plus. Dans $\mathbb Z/6\mathbb Z$, en revanche, $\{\bar 0, \bar 2, \bar 4\}$, d'ordre premier à son indice, a pour complément $\{\bar 0, \bar 3\}$.
    - |
      Deux compléments peuvent ne pas être conjugués. Dans $(\mathbb Z/2\mathbb Z)^2$, le sous-groupe $N = \mathbb Z/2\mathbb Z \times \{\bar 0\}$ a deux compléments, engendrés par $(\bar 0, \bar 1)$ et par $(\bar 1, \bar 1)$, que la conjugaison, triviale dans ce groupe abélien, ne peut échanger. C'est ce que prévoit le point (iii) de {{cg-complements|Compléments et H¹}} : l'action du quotient sur $N$ est triviale, et $H^1$ est le groupe à deux éléments des morphismes de $\mathbb Z/2\mathbb Z$ dans lui-même ({{cg-h1|Le groupe H¹}}, (i)). Plus loin, le théorème de Schur-Zassenhaus ({{cg-sz-abelien|Schur-Zassenhaus, cas abélien}}) assure que les compléments d'un sous-groupe distingué abélien existent et sont conjugués dès que son ordre est premier à son indice, ce qui n'est pas le cas ici.

  suite-exacte-groupes:
    - |
      La suite
      $$0 \to \mathbb Z \xrightarrow{\ \times n\ } \mathbb Z \xrightarrow{\ \pi\ } \mathbb Z/n\mathbb Z \to 0,$$
      où $n \geqslant 1$ et où $\pi$ est la [[application-canonique|surjection canonique]], est exacte en chacun de ses trois termes. Au premier, l'image de $0 \to \mathbb Z$, réduite à $\{0\}$, est le noyau de $k \mapsto nk$, qui est injective ; au milieu, l'image $n\mathbb Z$ de la multiplication est le noyau de $\pi$ ; au dernier, le noyau de $\mathbb Z/n\mathbb Z \to 0$, qui est tout $\mathbb Z/n\mathbb Z$, est l'image de $\pi$, qui est surjective. Une suite exacte de cette forme dit qu'une flèche est injective, la suivante surjective, et que la première identifie son départ au noyau de la seconde.
    - |
      Une composée nulle ne suffit pas à l'exactitude, qui demande l'égalité de l'image et du noyau, non une simple inclusion. Dans $\lex{anneau-zn}{\mathbb Z/8\mathbb Z}$, la suite $\mathbb Z/8\mathbb Z \xrightarrow{\times 4} \mathbb Z/8\mathbb Z \xrightarrow{\times 4} \mathbb Z/8\mathbb Z$ a une composée nulle, la multiplication par $16$, mais l'image $\{\bar 0, \bar 4\}$ de la première flèche est strictement contenue dans le noyau $\{\bar 0, \bar 2, \bar 4, \bar 6\}$ de la seconde : elle n'est pas exacte au milieu. En remplaçant la seconde flèche par la multiplication par $2$, de noyau $\{\bar 0, \bar 4\}$, on obtient une suite exacte.
    - |
      Les groupes d'une suite exacte ne sont pas supposés abéliens : la suite $1 \to \mathfrak A_n \to \lex{groupe-symetrique}{\mathfrak S_n} \xrightarrow{\ \varepsilon\ } \{1, -1\} \to 1$, pour $n \geqslant 2$, est exacte, le [[groupe-alterne|groupe alterné]] étant le noyau de la [[signature-permutation|signature]], qui est surjective. Les deux bouts ne déterminent pas le milieu : les suites $0 \to \mathbb Z/2\mathbb Z \to \mathbb Z/4\mathbb Z \to \mathbb Z/2\mathbb Z \to 0$, par $\bar a \mapsto \overline{2a}$ puis la réduction modulo $2$, et $0 \to \mathbb Z/2\mathbb Z \to (\mathbb Z/2\mathbb Z)^2 \to \mathbb Z/2\mathbb Z \to 0$, par $a \mapsto (a, \bar 0)$ puis $(a, b) \mapsto b$, sont exactes, alors que $\mathbb Z/4\mathbb Z$ et $(\mathbb Z/2\mathbb Z)^2$ ne sont pas isomorphes. Plus loin, le nœud {{cg-extensions|Extensions et H²}} classe ces suites par un groupe de cohomologie, qui a ici deux éléments.

  extension-groupes:
    - |
      Le groupe $\lex{groupe-symetrique}{\mathfrak S_3}$ est une extension du groupe $\{1, -1\}$ par $\lex{anneau-zn}{\mathbb Z/3\mathbb Z}$, sur lequel $-1$ agit par $a \mapsto -a$. Avec $c = (1\ 2\ 3)$, l'application $i : \bar k \mapsto c^k$ est un morphisme injectif d'image le [[groupe-alterne|groupe alterné]] $\mathfrak A_3$, noyau de la [[signature-permutation|signature]] $p = \varepsilon$, qui est surjective : la [[suite-exacte-groupes|suite]] $0 \to \mathbb Z/3\mathbb Z \to \mathfrak S_3 \to \{1, -1\} \to 1$ est exacte. En suivant les images, $(1\ 2)$ conjugue $c$ en $(1\ 3\ 2) = c^{-1}$, et toute permutation impaire s'écrit $(1\ 2)a$ avec $a \in \mathfrak A_3$, qui commute à $c$ ; d'où $x\,i(a)\,x^{-1} = i(\varepsilon(x)\,a)$ : la conjugaison induit l'action donnée.
    - |
      L'action fait partie des données. Le groupe $\mathbb Z/6\mathbb Z$, avec $i(a) = 2a$ de $\mathbb Z/3\mathbb Z$ dans $\mathbb Z/6\mathbb Z$ et la réduction modulo $2$ pour $p$, dont le noyau $\{\bar 0, \bar 2, \bar 4\}$ est l'image de $i$, est une extension de $\mathbb Z/2\mathbb Z$ par $\mathbb Z/3\mathbb Z$ pour l'[[action-triviale|action triviale]], puisque la conjugaison est triviale dans un groupe abélien. Ce n'en est pas une pour l'action $a \mapsto -a$ du générateur. À l'inverse, $\mathfrak S_3$, extension pour cette dernière action, n'en est pas une pour l'action triviale : $(1\ 2)\,i(\bar 1)\,(1\ 2)^{-1} = c^{-1}$ n'est pas $i(\bar 1) = c$.
    - |
      Le [[groupe-diedral|groupe diédral]] $\mathcal D_4$ et le groupe des quaternions $\mathcal Q_8$ sont deux extensions de $(\mathbb Z/2\mathbb Z)^2$ par $\mathbb Z/2\mathbb Z$, muni de l'action triviale. Dans $\mathcal D_4$, l'élément $r^2$ commute à $r$ et à $s$, puisque $sr^2s^{-1} = r^{-2} = r^2$, et tout carré appartient à $\{e, r^2\}$ ({{gf-diedraux|Diédraux, quaternions}}, (i)) ; le quotient, à quatre éléments, n'a donc aucun élément d'ordre $4$, et il est isomorphe à $(\mathbb Z/2\mathbb Z)^2$ ({{gf-ordres-pq|Ordres p, p², 2p, pq}}, (ii)). Il en va de même de $\mathcal Q_8/\{\pm I\}$, puisque $u^2 = \pm I$ pour tout $u$. Ces deux extensions ne sont pas [[extensions-equivalentes|équivalentes]] : une équivalence est un isomorphisme ({{cg-extensions|Extensions et H²}}, (iii)), et $\mathcal D_4$ a cinq éléments d'ordre $2$, quand $\mathcal Q_8$ n'en a qu'un.

  cochaine-groupe:
    - |
      Une cochaîne est une application quelconque, sans aucune condition. Pour $G = \{e, s\}$ d'ordre $2$ et $A = \lex{anneau-zn}{\mathbb Z/2\mathbb Z}$, l'ensemble $G^0$ a un élément, $G^1$ deux et $G^2$ quatre : il y a $2$ cochaînes de degré $0$, qui sont les éléments de $A$, $2^2 = 4$ de degré $1$ et $2^4 = 16$ de degré $2$. L'addition des valeurs fait de chaque $C^n(G, A)$ un groupe isomorphe au produit de $|G|^n$ copies de $A$.
    - |
      Les cochaînes ne voient pas l'action : $C^n(G, A)$ ne dépend que de l'ensemble $G$ et du groupe abélien $A$, et c'est la [[differentielle-cochaines-groupe|différentielle]] qui fait intervenir l'action. Pour $G = \{e, s\}$ et $A = \lex{anneau-zn}{\mathbb Z/3\mathbb Z}$, la cochaîne de degré $1$ nulle en $e$ et égale à $\bar 1$ en $s$ est un [[cocycle-groupe|cocycle]] pour l'action $s \cdot a = -a$, puisque $\bar 1 + s \cdot \bar 1 = \bar 0$. Elle n'en est pas un pour l'[[action-triviale|action triviale]], puisque $(d^1f)(s, s) = f(s) - f(e) + f(s) = \bar 2$.
    - |
      Plus loin, les cochaînes de degré $2$ naissent des extensions ({{cg-extensions|Extensions et H²}}, (i)). Dans la suite $0 \to \mathbb Z/2\mathbb Z \to \mathbb Z/4\mathbb Z \to \mathbb Z/2\mathbb Z \to 0$, où la première flèche est $a \mapsto 2a$, la section $\bar 0 \mapsto \bar 0$, $\bar 1 \mapsto \bar 1$ de la réduction modulo $2$ donne une cochaîne $c$, qui mesure de combien la somme des relevés s'écarte du relevé de la somme. Elle est nulle sauf en $(\bar 1, \bar 1)$, où $\bar 1 + \bar 1 = \bar 2$ est l'image de $\bar 1$ : c'est la retenue de l'addition en base $2$.

  differentielle-cochaines-groupe:
    - |
      Pour l'[[action-triviale|action triviale]], la différentielle $d^0$ est nulle, puisque $(d^0a)(g) = a - a$, et $(d^1f)(g, h) = f(h) - f(gh) + f(g)$ mesure le défaut de $f$ d'être un [[morphisme-groupes|morphisme]]. Pour $G = \{e, s\}$ et $A = \lex{anneau-zn}{\mathbb Z/2\mathbb Z}$, l'application $f$ nulle en $e$ et égale à $\bar 1$ en $s$ est un morphisme, et $d^1f = 0$ : on retrouve que $f$ est un [[cocycle-groupe|cocycle]]. En degré $2$, la formule à quatre termes s'écrit $(d^2c)(g, h, k) = c(h, k) - c(gh, k) + c(g, hk) - c(g, h)$.
    - |
      L'action doit se faire par morphismes, sans quoi $d \circ d$ ne s'annule plus. Sur $\lex{anneau-zn}{\mathbb Z/3\mathbb Z}$, la bijection $\sigma$ qui échange $\bar 0$ et $\bar 1$ et fixe $\bar 2$ vérifie $\sigma \circ \sigma = \mathrm{id}$, et $s \cdot a = \sigma(a)$ définit une [[action-groupe|action]] de $G = \{e, s\}$, qui ne respecte pas l'addition, puisque $\sigma(\bar 0) = \bar 1$. Les mêmes formules donnent
      $$\begin{aligned} &d^1(d^0\bar 0)(s, s) \\ &\quad = s \cdot (s \cdot \bar 0 - \bar 0) - (\bar 0 - \bar 0) \\ &\qquad + (s \cdot \bar 0 - \bar 0) \\ &\quad = \sigma(\bar 1) + \bar 1 = \bar 1, \end{aligned}$$
      et $d^1 \circ d^0 \neq 0$. Le calcul de la première remarque de {{cg-cochaines|Cochaînes, cohomologie}} demande en effet $g(ha - a) = gha - ga$.
    - |
      Pour l'action triviale, une cochaîne constante de degré $2$, égale à $a$, est un cocycle, puisque $a - a + a - a = 0$, et c'est même un cobord : la cochaîne constante $b$ de degré $1$, égale à $a$, vérifie $(d^1b)(g, h) = a - a + a = a$. Plus loin, la preuve du point (ii) de {{cg-extensions|Extensions et H²}} retranche à un cocycle $c$ le cobord $d^1b$ de la cochaîne constante $b = c(e, e)$ pour le rendre normalisé.

  suite-exacte-courte-g-modules:
    - |
      Une suite exacte de groupes n'est une suite exacte courte de $G$-modules que pour des actions compatibles avec les flèches. Soit $G = \{e, s\}$ et la suite $0 \to \lex{ensemble-entiers-relatifs}{\mathbb Z} \xrightarrow{\times 2} \mathbb Z \to \mathbb Z/2\mathbb Z \to 0$, exacte. Si $s$ agit par $a \mapsto -a$ sur les deux copies de $\mathbb Z$ et trivialement sur $\mathbb Z/2\mathbb Z$, les deux flèches sont des [[morphisme-g-modules|morphismes de $G$-modules]], puisque $2(-a) = -(2a)$ et $-a \equiv a$ modulo $2$. Si $s$ agit par $a \mapsto -a$ sur la première copie et trivialement sur la seconde, la multiplication par $2$ n'en est plus un, puisque $2(-1) \neq 2$ : ce n'est plus une suite exacte courte de $G$-modules.
    - |
      Un cocycle se relève toujours en une cochaîne ({{cg-connectant|Morphisme de liaison}}, (ii)), mais pas toujours en un cocycle, et l'écart est le morphisme de liaison. Soit $G = \{e, s\}$, agissant trivialement dans la suite $0 \to \mathbb Z/2\mathbb Z \xrightarrow{u} \mathbb Z/4\mathbb Z \to \mathbb Z/2\mathbb Z \to 0$, où $u(a) = 2a$. Le cocycle $c$ de degré $1$ nul en $e$ et égal à $\bar 1$ en $s$ se relève en des cochaînes $b$ telles que $b(e) \in \{\bar 0, \bar 2\}$ et $b(s) \in \{\bar 1, \bar 3\}$. Aucune n'est un cocycle : si $b(e) = \bar 2$, alors $(d^1b)(e, e) = b(e) \neq \bar 0$, et si $b(e) = \bar 0$, alors $(d^1b)(s, s) = 2b(s) = \bar 2$. Pour un tel relèvement nul en $e$, le point (iii) fournit $a$, égal à $\bar 1$ en $(s, s)$ et nul ailleurs, avec $u_*a = d^1b$.

      Ce cocycle n'est pas un cobord : pour l'action triviale, $(d^1\beta)(e, e) = \beta(e)$ et $(d^1\beta)(s, s) = 2\beta(s) - \beta(e)$ sont égaux dans $\mathbb Z/2\mathbb Z$, alors que $a$ vaut $\bar 0$ et $\bar 1$ en ces deux points. Ainsi $\delta[c] \neq 0$ dans $H^2(G, \mathbb Z/2\mathbb Z)$.
    - |
      Pour l'action de $\lex{groupe-symetrique}{\mathfrak S_3}$ sur $\mathbb Z^3$ par permutation des coordonnées, la somme des coordonnées donne une suite exacte courte $0 \to S \to \mathbb Z^3 \to \mathbb Z \to 0$, où $S$ est le [[sous-g-module|sous-module]] des vecteurs de somme nulle et $\mathbb Z$ porte l'[[action-triviale|action triviale]]. Les [[invariants-g-module|invariants]] sont $\{0\}$ dans $S$, la droite des vecteurs constants dans $\mathbb Z^3$, et $\mathbb Z$ tout entier ; la somme envoie $(k, k, k)$ sur $3k$, et les invariants de $\mathbb Z^3$ ne s'envoient pas sur ceux de $\mathbb Z$. Plus loin, l'exactitude de la suite longue ({{cg-suite-exacte|Suite exacte longue}}) en $\mathbb Z^{\mathfrak S_3} = \mathbb Z$ dit que le morphisme de liaison $\delta : \mathbb Z \to H^1(\mathfrak S_3, S)$ a pour noyau $3\mathbb Z$, de sorte que $H^1(\mathfrak S_3, S)$ contient un sous-groupe isomorphe à $\mathbb Z/3\mathbb Z$.

  cochaine-normalisee:
    - |
      Tout cocycle devient normalisé quand on lui retranche un cobord convenable ({{cg-extensions|Extensions et H²}}, preuve de (ii)). Pour $G = \{e, s\}$ et $A = \lex{anneau-zn}{\mathbb Z/2\mathbb Z}$, muni de l'[[action-triviale|action triviale]], la cochaîne constante $c$ égale à $\bar 1$ est un [[cocycle-groupe|cocycle]], les quatre termes de $(d^2c)(g, h, k)$, tous égaux à $\bar 1$, s'annulant deux à deux, mais elle n'est pas normalisée. Pour la cochaîne constante $b$ égale à $\bar 1$, on a $(d^1b)(g, h) = b(h) - b(gh) + b(g) = \bar 1$, de sorte que $c - d^1b = 0$ : le cocycle normalisé obtenu est nul, et la classe de $c$ aussi.
    - |
      Sans la normalisation, la construction du point (ii) de {{cg-extensions|Extensions et H²}} perd son neutre. Avec la cochaîne constante $c = \bar 1$ de l'exemple précédent, la loi $(a, g)(b, h) = (a + gb + c(g, h), gh)$ sur $\mathbb Z/2\mathbb Z \times G$ donne $(\bar 0, e)(b, h) = (b + \bar 1, h)$ : l'élément $(\bar 0, e)$ n'est pas neutre, et $i(a) = (a, e)$ n'est même pas un morphisme, puisque $(a, e)(b, e) = (a + b + \bar 1, e)$.
    - |
      La retenue de l'addition est un cocycle normalisé. Pour $n \geqslant 2$, posons, pour $k, l \in \{0, \dots, n - 1\}$, $c(\bar k, \bar l) = \bar 1$ si $k + l \geqslant n$ et $\bar 0$ sinon, à valeurs dans $\lex{anneau-zn}{\mathbb Z/n\mathbb Z}$, avec l'action triviale de $G = \mathbb Z/n\mathbb Z$. C'est le cocycle $c_s$ de la section $s(\bar k) = \bar k$, pour $0 \leqslant k < n$, de la réduction $\mathbb Z/n^2\mathbb Z \to \mathbb Z/n\mathbb Z$, avec $i(a) = na$, puisque $s(\bar k) + s(\bar l) = n\,c(\bar k, \bar l) + s(\bar k + \bar l)$ ; il est nul dès que $k = 0$ ou $l = 0$. Le groupe $E_c$ est isomorphe à $\mathbb Z/n^2\mathbb Z$ par $(a, \bar k) \mapsto na + k$ ({{cg-extensions|Extensions et H²}}, (iii)).

  extension-scindee:
    - |
      L'extension $0 \to \mathbb Z/3\mathbb Z \to \lex{groupe-symetrique}{\mathfrak S_3} \xrightarrow{\ \varepsilon\ } \{1, -1\} \to 1$, où la première flèche est $\bar k \mapsto (1\ 2\ 3)^k$ et $\varepsilon$ la [[signature-permutation|signature]], est scindée : l'application $s$ qui envoie $1$ sur $\mathrm{id}$ et $-1$ sur $(1\ 2)$ est un morphisme, puisque $(1\ 2)(1\ 2) = \mathrm{id}$, et $\varepsilon \circ s = \mathrm{id}$. Les transpositions $(1\ 3)$ et $(2\ 3)$ fournissent deux autres sections qui sont des morphismes, et les trois images sont les trois [[complement-groupe|compléments]] de $\mathfrak A_3$. Par le point (iv) de {{cg-extensions|Extensions et H²}}, $\mathfrak S_3$ est le [[produit-semi-direct|produit semi-direct]] de $\mathbb Z/3\mathbb Z$ par $\{1, -1\}$.
    - |
      Une extension a toujours une section ({{cg-extensions|Extensions et H²}}, (v)), mais pas forcément une section qui soit un morphisme. Dans $0 \to \mathbb Z/2\mathbb Z \to \mathbb Z/4\mathbb Z \to \mathbb Z/2\mathbb Z \to 0$, les relevés de $\bar 1$ sont $\bar 1$ et $\bar 3$, d'ordre $4$, alors qu'un morphisme enverrait $\bar 1$ sur un élément $x$ tel que $2x = \bar 0$. De même, $\mathcal Q_8$, extension de $(\mathbb Z/2\mathbb Z)^2$ par $\{\pm I\}$, n'est pas scindée : une section $s$ qui serait un morphisme serait injective, puisque $p \circ s = \mathrm{id}$, et ferait de $s((\mathbb Z/2\mathbb Z)^2)$ un sous-groupe à trois éléments d'ordre $2$, alors que $-I$ est le seul élément d'ordre $2$ de $\mathcal Q_8$.
    - |
      Dans $0 \to \mathbb Z/3\mathbb Z \xrightarrow{\times 2} \mathbb Z/6\mathbb Z \to \mathbb Z/2\mathbb Z \to 0$, l'élément $\bar 3$ relève $\bar 1$ et vérifie $\bar 3 + \bar 3 = \bar 0$ : l'application $\bar 0 \mapsto \bar 0$, $\bar 1 \mapsto \bar 3$ est une section qui est un morphisme, et l'extension est scindée, au contraire de celle par $\mathbb Z/4\mathbb Z$. Plus loin, le théorème de Schur-Zassenhaus ({{cg-sz-abelien|Schur-Zassenhaus, cas abélien}}, (i)) explique la différence : un sous-groupe distingué abélien d'ordre premier à son indice a toujours un complément, donc l'extension correspondante est scindée, et $3$ est premier à $2$, alors que $2$ ne l'est pas à $2$.

  extensions-equivalentes:
    - |
      Une extension construite à partir d'un cocycle peut être équivalente à un groupe familier. Pour $G = A = \lex{anneau-zn}{\mathbb Z/2\mathbb Z}$, avec l'[[action-triviale|action triviale]], la cochaîne $c$ égale à $\bar 1$ en $(\bar 1, \bar 1)$ et nulle ailleurs est le cocycle de la section $\bar 0 \mapsto \bar 0$, $\bar 1 \mapsto \bar 1$ de $\mathbb Z/4\mathbb Z \to \mathbb Z/2\mathbb Z$ ({{cg-extensions|Extensions et H²}}, (i)), et elle est normalisée. Sur $E_c = A \times G$, de loi $(a, g)(b, h) = (a + b + c(g, h), g + h)$, l'application $\theta(a, g) = 2a + g$, où $a$ et $g$ sont lus dans $\{0, 1\}$, est un morphisme bijectif vers $\mathbb Z/4\mathbb Z$, avec $\theta(a, \bar 0) = 2a$ et $\theta(a, g) \equiv g$ modulo $2$ : c'est une équivalence.
    - |
      Deux extensions de même groupe $E$ peuvent ne pas être équivalentes. Soit $i(a) = 3a$, de $\mathbb Z/3\mathbb Z$ dans $\mathbb Z/9\mathbb Z$, et $p$, $p'$ les morphismes surjectifs $x \mapsto x$ et $x \mapsto -x$ de $\mathbb Z/9\mathbb Z$ sur $\mathbb Z/3\mathbb Z$, de même noyau $\{\bar 0, \bar 3, \bar 6\}$, image de $i$. Un morphisme $\theta$ de $\mathbb Z/9\mathbb Z$ dans lui-même est la multiplication par un $\bar k$ ; la condition $\theta \circ i = i$ impose $3k \equiv 3$ modulo $9$, donc $k \equiv 1$ modulo $3$, et alors $p'(\theta(\bar 1)) = -\bar k = -\bar 1$, qui n'est pas $p(\bar 1) = \bar 1$. Les extensions $(\mathbb Z/9\mathbb Z, i, p)$ et $(\mathbb Z/9\mathbb Z, i, p')$ ne sont pas équivalentes : l'équivalence voit les flèches, et pas seulement le groupe du milieu.
    - |
      Une même extension, munie de deux sections, donne deux cocycles différents de même classe ({{cg-extensions|Extensions et H²}}, (i)). Dans $0 \to \mathbb Z/2\mathbb Z \to \mathbb Z/4\mathbb Z \to \mathbb Z/2\mathbb Z \to 0$, avec $i(a) = 2a$, la section $s$ qui envoie $\bar 0$ sur $\bar 0$ et $\bar 1$ sur $\bar 1$ a pour cocycle $c_s$, égal à $\bar 1$ en $(\bar 1, \bar 1)$ et nul ailleurs. La section $s'$ qui envoie $\bar 0$ sur $\bar 2$ et $\bar 1$ sur $\bar 1$ s'écrit $s'(g) = i(b(g)) + s(g)$, avec $b(\bar 0) = \bar 1$ et $b(\bar 1) = \bar 0$. Son cocycle vaut $\bar 1$ en $(\bar 0, \bar 0)$, $(\bar 0, \bar 1)$ et $(\bar 1, \bar 0)$ et $\bar 0$ en $(\bar 1, \bar 1)$ : c'est $c_s + d^1b$, puisque $d^1b$ est ici la constante $\bar 1$, et il n'est pas normalisé.

  invariants-g-module:
    - |
      Un sous-groupe a au moins autant d'invariants que le groupe, parfois davantage. Pour l'action de $\lex{groupe-symetrique}{\mathfrak S_3}$ sur $\lex{ensemble-entiers-relatifs}{\mathbb Z}^3$ par permutation des coordonnées, $(\sigma \cdot x)_i = x_{\sigma^{-1}(i)}$, un vecteur fixé par $(1\ 2)$ a $x_1 = x_2$, et un vecteur fixé de plus par $(2\ 3)$ a ses trois coordonnées égales : les invariants sont les vecteurs constants $(k, k, k)$. Pour le sous-groupe $\mathfrak A_3$, engendré par $(1\ 2\ 3)$, qui fait tourner les coordonnées, ce sont encore les vecteurs constants ; pour $\{\mathrm{id}, (1\ 2)\}$, ce sont les vecteurs tels que $x_1 = x_2$.
    - |
      Le groupe $(\mathbb Z/8\mathbb Z)^\times = \{\bar 1, \bar 3, \bar 5, \bar 7\}$ agit sur $\lex{anneau-zn}{\mathbb Z/8\mathbb Z}$ par multiplication ({{gf-produits|Produits semi-directs}}, (iv)). Un élément $x$ est invariant si et seulement si $(\bar a - \bar 1)x = \bar 0$ pour $a = 3, 5, 7$, c'est-à-dire si $2x = \bar 0$ : les invariants sont $\bar 0$ et $\bar 4$. Pour le sous-groupe $\{\bar 1, \bar 5\}$, la seule condition est $4x = \bar 0$, et les invariants sont $\bar 0$, $\bar 2$, $\bar 4$, $\bar 6$. Modulo un nombre premier $p \geqslant 3$, en revanche, $(\bar 2 - \bar 1)x = \bar 0$ force $x = \bar 0$, et le groupe $(\mathbb Z/p\mathbb Z)^\times$ n'a que l'invariant $\bar 0$.
    - |
      Prendre les invariants ne respecte pas la surjectivité. Soit $G = \{e, s\}$ agissant sur $\mathbb Z$ par $s \cdot a = -a$ ; le sous-groupe $2\mathbb Z$ est stable, et le quotient $\mathbb Z/2\mathbb Z$ hérite de l'action ({{cg-modules|G-modules}}, (iii)), qui y est triviale puisque $-a \equiv a$ modulo $2$. Ainsi $\mathbb Z^G = \{0\}$, alors que $(\mathbb Z/2\mathbb Z)^G = \mathbb Z/2\mathbb Z$ : la surjection $\mathbb Z \to \mathbb Z/2\mathbb Z$ envoie les invariants sur $\{\bar 0\}$ seulement. Plus loin, la suite exacte longue ({{cg-suite-exacte|Suite exacte longue}}) mesure ce défaut par un morphisme de liaison de $(\mathbb Z/2\mathbb Z)^G$ vers un premier groupe de cohomologie.

  morphisme-g-modules:
    - |
      Sur $\lex{ensemble-entiers-relatifs}{\mathbb Z}^3$, muni de l'action de $\lex{groupe-symetrique}{\mathfrak S_3}$ par permutation des coordonnées, $(\sigma \cdot x)_i = x_{\sigma^{-1}(i)}$, la somme $u(x) = x_1 + x_2 + x_3$ est un morphisme vers $\mathbb Z$ muni de l'[[action-triviale|action triviale]], puisque permuter les coordonnées ne change pas leur somme. En sens inverse, $v(k) = (k, k, k)$ en est un aussi. Le noyau de $u$, formé des vecteurs de somme nulle, et l'image de $v$, formée des vecteurs constants, sont des [[sous-g-module|sous-modules]] ({{cg-modules|G-modules}}, (ii)), et $u \circ v$ est la multiplication par $3$ sur $\mathbb Z$.
    - |
      Un morphisme de groupes qui ne commute pas à l'action peut ne pas envoyer les invariants dans les invariants. La première coordonnée $x \mapsto x_1$ n'est pas un morphisme de $\mathfrak S_3$-modules de $\mathbb Z^3$ vers $\mathbb Z$ muni de l'action triviale, puisque l'image de $(1\ 2) \cdot x$ est $x_2$. Plus nettement, soit $\mathbb Z_\varepsilon$ le groupe $\mathbb Z$ muni de l'action $\sigma \cdot a = \varepsilon(\sigma)\,a$ par la [[signature-permutation|signature]] ({{cg-modules|G-modules}}, première remarque) : l'identité de $\mathbb Z$, vue de $\mathbb Z$ muni de l'action triviale vers $\mathbb Z_\varepsilon$, est un isomorphisme de groupes, mais elle envoie les invariants $\mathbb Z$ sur $\mathbb Z$, alors que $\mathbb Z_\varepsilon$ n'a que l'invariant $0$.
    - |
      Si $G$ est abélien, l'action d'un élément $g$, $a \mapsto ga$, est un morphisme de $G$-modules, puisque $g(ha) = (gh)a = (hg)a = h(ga)$. Sans la commutativité, la conclusion tombe : sur $\mathbb Z^3$, l'application $x \mapsto (1\ 2) \cdot x$ ne commute pas à l'action de $(2\ 3)$. En notant $e_1, e_2, e_3$ la [[base-canonique-kn|base canonique]], on a $\sigma \cdot e_j = e_{\sigma(j)}$, d'où $(1\ 2) \cdot ((2\ 3) \cdot e_1) = e_2$, alors que $(2\ 3) \cdot ((1\ 2) \cdot e_1) = e_3$. Plus loin, un morphisme de $G$-modules induit un morphisme entre groupes de cohomologie ({{cg-connectant|Morphisme de liaison}}, (i)) : c'est ce qui rend la cohomologie fonctorielle.

  action-triviale:
    - |
      Un même groupe abélien porte en général plusieurs structures de [[g-module|$G$-module]]. Pour $G = \{e, s\}$ d'ordre $2$, le groupe $\lex{anneau-zn}{\mathbb Z/3\mathbb Z}$ est un $G$-module pour l'action triviale, dont les [[invariants-g-module|invariants]] sont ses trois éléments, et pour l'action $s \cdot a = -a$, dont le seul invariant est $\bar 0$, puisque $-\bar 1 = \bar 2$. Les deux structures ont le même groupe sous-jacent, et ce ne sont pas les mêmes modules.
    - |
      Pour un sous-groupe distingué abélien $N$ d'un groupe $E$, l'action de $E/N$ par conjugaison ({{cg-modules|G-modules}}, (iv)) est triviale si et seulement si $N$ est contenu dans le [[centre-groupe|centre]] de $E$. Dans le groupe des quaternions $\mathcal Q_8$, le sous-groupe $\{\pm I\}$ est central, et l'action de $\mathcal Q_8/\{\pm I\}$ est triviale. Dans le [[groupe-diedral|groupe diédral]] $\mathcal D_4$, le sous-groupe $\langle r \rangle$ est abélien et distingué, mais $srs^{-1} = r^{-1} \neq r$ ({{gf-diedraux|Diédraux, quaternions}}, (i)) : la classe de $s$ agit par $x \mapsto x^{-1}$, et l'action n'est pas triviale.
    - |
      Un groupe abélien muni de l'action triviale n'est pas isomorphe, comme module, au même groupe muni d'une autre action. Pour $G = \{e, s\}$, un [[morphisme-g-modules|morphisme de $G$-modules]] $u$ de $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, muni de l'action triviale, vers $\mathbb Z$ muni de l'action $s \cdot a = -a$ vérifie $u(1) = u(s \cdot 1) = s \cdot u(1) = -u(1)$, donc $u(1) = 0$ et $u = 0$. Plus loin, pour l'action triviale, le premier groupe de cohomologie n'est autre que le groupe des morphismes de $G$ dans $A$ ({{cg-h1|Le groupe H¹}}, (i)).

  sous-g-module:
    - |
      Dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}^3$, muni de l'action de $\lex{groupe-symetrique}{\mathfrak S_3}$ par permutation des coordonnées, la droite $D$ des vecteurs constants et le sous-groupe $S$ des vecteurs de somme nulle sont des sous-modules, puisque permuter les coordonnées conserve l'égalité des coordonnées et leur somme. On a $D \cap S = \{0\}$, puisque $3k = 0$ force $k = 0$. Mais $D + S$ n'est pas $\mathbb Z^3$ : la somme des coordonnées de $(k, k, k) + y$, avec $y \in S$, vaut $3k$, alors que celle de $(1, 0, 0)$ vaut $1$. Le quotient $\mathbb Z^3/S$ est isomorphe, par la somme des coordonnées, à $\mathbb Z$ muni de l'[[action-triviale|action triviale]].
    - |
      La stabilité exigée est celle par l'action du groupe, et un sous-groupe quelconque ne l'a pas. Dans $\mathbb Z^3$, le sous-groupe $\mathbb Z \times \{0\} \times \{0\}$ n'est pas un sous-module, puisque $(1\ 2)$ envoie $(1, 0, 0)$ sur $(0, 1, 0)$. Pourtant tout sous-groupe de $\mathbb Z^3$ est un [[sous-module]] au sens des modules sur l'anneau $\mathbb Z$, la loi externe $k \cdot x = x + \cdots + x$ ne faisant pas sortir d'un sous-groupe : les deux notions n'ont rien à voir.
    - |
      Un sous-module n'a pas toujours de supplémentaire qui soit un sous-module. Soit $G = \{e, s\}$ agissant sur $A = (\lex{anneau-zn}{\mathbb Z/2\mathbb Z})^2$ par échange des coordonnées. Les trois sous-groupes d'ordre $2$ sont engendrés par $(\bar 1, \bar 0)$, $(\bar 0, \bar 1)$ et $(\bar 1, \bar 1)$, et seul le dernier, la diagonale $D$, est stable : $D$ est un sous-module sans supplémentaire stable, alors que $D$ a un [[supplementaire|supplémentaire]] comme sous-groupe. Le quotient $A/D$, à deux éléments, porte l'action triviale, puisque $s \cdot v - v$ appartient à $D$. Plus loin, $0 \to D \to A \to A/D \to 0$ sera une suite exacte courte de $G$-modules ({{cg-connectant|Morphisme de liaison}}), point de départ de la suite exacte longue.
