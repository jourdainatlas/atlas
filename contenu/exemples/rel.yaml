# Exemples du lexique : théorie « Relations, fonctions » (rel).
#
# Un fichier par théorie de premier niveau de l'édifice (graphe « edifice ») : y figurent les exemples des termes
# dont le nœud « defini_dans » appartient à cette théorie, à quelque profondeur que ce soit. construire.py refuse un
# terme rangé dans le mauvais fichier et donne le bon nom. Format (mémo de l'édifice, § 111) :
#
#   exemples:
#     <id du terme>:
#       - |
#         Premier exemple, en phrases complètes ([[id]], {{noeud|Titre}}, formules comme dans les fiches).
#       - |
#         Deuxième exemple ; un schéma s'y insère par un bloc sur des lignes à part :
#         ```schema lex-<id>-2
#         Légende : une ou deux phrases qui disent ce qu'il faut lire sur la figure.
#         ```
#
# Les termes suivent l'ordre du lexique ; deux ou trois exemples par terme.

exemples:
  couple:
    - |
      Le couple retient l'ordre de ses composantes, ce que ne fait pas la paire. Pour $a = \varnothing$ et $b = \{\varnothing\}$, on trouve
      $$\begin{aligned} (a, b) &= \{\{\varnothing\}, \{\varnothing, \{\varnothing\}\}\}, \\ (b, a) &= \{\{\{\varnothing\}\}, \{\varnothing, \{\varnothing\}\}\}. \end{aligned}$$
      Ces deux ensembles diffèrent, puisque $\{\varnothing\}$ appartient au premier et non au second, alors que les paires $\{a, b\}$ et $\{b, a\}$ sont égales.
    - |
      Lorsque les deux composantes sont égales, le couple n'a qu'un élément : $(\varnothing, \varnothing) = \{\{\varnothing\}, \{\varnothing\}\} = \{\{\varnothing\}\}$. C'est le premier cas de la démonstration de {{r-couple|Couple de Kuratowski}}. La propriété caractéristique dit en outre qu'aucun autre couple ne lui est égal : si $(c, d) = (\varnothing, \varnothing)$, alors $c = d = \varnothing$. Un ensemble est ainsi un couple d'au plus une façon, et l'on peut parler de sa première composante.
    - |
      Le codage $\langle x, y \rangle = \{x, \{y\}\}$, qui semble marquer la seconde place par des accolades, ne vérifie pas la propriété caractéristique. Pour $x = \{\{\varnothing\}\}$ et $y = \varnothing$, puis $x' = y' = \{\varnothing\}$, on trouve
      $$\langle x, y \rangle = \{\{\{\varnothing\}\}, \{\varnothing\}\} = \langle x', y' \rangle,$$
      alors que $x \neq x'$. Il ne suffit pas qu'un codage distingue les deux places en apparence : il faut que la première composante se lise sans ambiguïté sur l'ensemble obtenu, ce qu'assure le singleton $\{a\}$ dans $(a, b)$.

  produit-cartesien:
    - |
      Pour $A = \{a, b\}$ et $B = \{c, d, e\}$, cinq éléments distincts, le produit $A \times B$ a six éléments, les [[couple|couples]] $(a, c)$, $(a, d)$, $(a, e)$, $(b, c)$, $(b, d)$ et $(b, e)$, deux à deux distincts par la propriété caractéristique du couple. Le produit $B \times A$ n'en partage aucun : un couple $(x, y)$ de $B \times A$ égal à $(a, c)$ aurait $x = a$, donc $a \in B$, ce qui est exclu, $A$ et $B$ étant disjoints.
    - |
      Le produit n'est pas commutatif, et l'égalité $A \times B = B \times A$ force $A = B$ lorsque $A$ et $B$ sont non vides. Soit en effet $a \in A$ et $b \in B$ : le couple $(a, b)$ appartient à $B \times A$, d'où $a \in B$. Ainsi $A \subset B$, et de même $B \subset A$. Sans l'hypothèse, la conclusion tombe : $\varnothing \times \{\varnothing\}$ et $\{\varnothing\} \times \varnothing$ sont tous deux vides, donc égaux, alors que $\varnothing \neq \{\varnothing\}$.
    - |
      Les produits $(A \times B) \times C$ et $A \times (B \times C)$ sont en général distincts, car leurs éléments $((a, b), c)$ et $(a, (b, c))$ le sont. Pour $A = B = C = \{\varnothing\}$, chacun n'a qu'un élément. Notons $t = (\varnothing, \varnothing) = \{\{\varnothing\}\}$ ; alors
      $$\begin{aligned} (t, \varnothing) &= \{\{t\}, \{t, \varnothing\}\}, \\ (\varnothing, t) &= \{\{\varnothing\}, \{\varnothing, t\}\}. \end{aligned}$$
      Le second contient $\{\varnothing\}$, et le premier non, puisque $t \neq \varnothing$. C'est pourquoi {{r-couple|Couple de Kuratowski}} fixe une convention : le triplet $(a, b, c)$ est $((a, b), c)$.

  relation:
    - |
      Une relation n'est soumise à aucune condition : c'est n'importe quelle partie du produit. Pour $A = \{a, b\}$ et $B = \{c, d, e\}$, cinq éléments distincts, $R = \{(a, c), (a, d)\}$ est une relation de $A$ vers $B$, dans laquelle $a$ est relié à deux éléments et $b$ à aucun. Les relations de $A$ vers $B$ sont les éléments de $\lex{ensemble-parties}{\mathcal P}(A \times B)$, de la relation vide jusqu'à $A \times B$ lui-même.
      ```schema lex-relation-1
      Les six points figurent les couples de $A \times B$, rangés en lignes selon la première composante et en colonnes selon la seconde. Les points rouges forment la relation $R$ : la ligne de $a$ en contient deux, celle de $b$ aucun.
      ```
    - |
      L'inclusion est une relation sur l'ensemble des parties d'un ensemble. Pour $E = \{a, b\}$, avec $a \neq b$, c'est la partie
      $$\{(X, Y) \in \mathcal P(E) \times \mathcal P(E) : X \subset Y\}$$
      de $\lex{ensemble-parties}{\mathcal P}(E) \times \mathcal P(E)$. Elle compte neuf couples : les quatre couples $(\varnothing, Y)$, puis $(\{a\}, \{a\})$, $(\{a\}, E)$, $(\{b\}, \{b\})$, $(\{b\}, E)$ et $(E, E)$. Écrire $X \subset Y$ plutôt que $(X, Y) \in R$, c'est exactement la notation $x \mathrel R y$.
    - |
      Une relation est un ensemble de couples, et tout ensemble n'en est pas un. Un couple $(x, y) = \{\{x\}, \{x, y\}\}$ a toujours l'élément $\{x\}$ : il n'est jamais vide. L'ensemble $\{\varnothing\}$ n'est donc pas une relation de $A$ vers $B$, quels que soient $A$ et $B$, puisque son élément $\varnothing$ n'est pas un [[couple]] et n'appartient à aucun produit $A \times B$. La partie vide, elle, est une relation de tout ensemble vers tout ensemble.

  application:
    - |
      Parmi les seize relations de $A = \{a, b\}$ vers $B = \{c, d\}$, quatre éléments distincts, seules quatre sont des graphes d'applications : celles qui contiennent exactement un couple de première composante $a$ et exactement un de première composante $b$, à savoir
      $$\begin{aligned} &\{(a, c), (b, c)\}, \quad \{(a, c), (b, d)\}, \\ &\{(a, d), (b, c)\}, \quad \{(a, d), (b, d)\}. \end{aligned}$$
      L'ensemble $B^A$ a donc quatre éléments : une application attribue à chaque élément de départ une image, et une seule.
    - |
      Une règle qui laisse le choix de l'image ne définit pas d'application. Pour $E = \{a, b\}$, avec $a \neq b$, la relation $\{(X, x) \in \lex{ensemble-parties}{\mathcal P}(E) \times E : x \in X\}$, qui associe à une partie ses éléments, n'est le graphe d'aucune application de $\mathcal P(E)$ dans $E$ : la partie $\varnothing$ n'y a pas d'image, et $E$ en a deux. En revanche, $X \mapsto E \setminus X$ est une application de $\mathcal P(E)$ dans $\mathcal P(E)$, car le complémentaire de $X$ est déterminé par $X$.
    - |
      Pour tout ensemble $A$ et tout singleton $\{c\}$, il existe une seule application de $A$ dans $\{c\}$, la constante, de graphe $A \times \{c\}$ : tout couple de $A \times \{c\}$ s'écrit $(a, c)$, et chaque $a$ n'a qu'une image possible. Pour $A = \varnothing$, c'est l'application vide, dont le graphe est $\varnothing$.

  bijection:
    - |
      Sur $\lex{ensemble-parties}{\mathcal P}(E)$, le passage au complémentaire $X \mapsto E \setminus X$ est une bijection. Toute partie $Y$ de $E$ a l'antécédent $E \setminus Y$, puisque $E \setminus (E \setminus Y) = Y$ ; c'est le seul, car $E \setminus X = Y$ entraîne $X = E \setminus (E \setminus X) = E \setminus Y$. Cette bijection échange $\varnothing$ et $E$, et elle renverse l'inclusion : $X \subset Y$ équivaut à $E \setminus Y \subset E \setminus X$.
    - |
      Sur $E = \{a, b\}$, avec $a \neq b$, il y a quatre applications de $E$ dans $E$ : les deux constantes, l'[[identite|identité]] et l'échange $s$, qui envoie $a$ sur $b$ et $b$ sur $a$. Les deux dernières sont des bijections. Chaque constante n'est ni [[injection|injective]], puisqu'elle confond $a$ et $b$, ni [[surjection|surjective]], puisqu'elle manque une valeur. Il n'existe en revanche aucune bijection de $E$ sur un singleton $\{c\}$, ni d'un singleton sur $E$.
    - |
      Une [[composee|composée]] peut être bijective sans que ses facteurs le soient. Pour $a \neq b$, soient $f : \{a\} \to \{a, b\}$, $f(a) = a$, et $g : \{a, b\} \to \{a\}$ la constante. La composée $g \circ f$ est l'identité de $\{a\}$, bijective, alors que $f$ n'est pas surjective et que $g$ n'est pas injective. Le point (ii) de {{r-injections|Injections, surjections, bijections}} n'assure que l'injectivité de $f$ et la surjectivité de $g$, et l'exemple montre qu'on ne peut en tirer davantage.

  relation-equivalence:
    - |
      Avoir la même intersection avec une partie fixée est une relation d'équivalence. Soit $F \subset E$ ; sur $\lex{ensemble-parties}{\mathcal P}(E)$, posons $X \sim Y$ si $X \cap F = Y \cap F$. Cette relation est [[relation-reflexive|réflexive]], [[relation-symetrique|symétrique]] et [[relation-transitive|transitive]] parce que l'égalité l'est. Pour $E = \{a, b\}$ et $F = \{a\}$, avec $a \neq b$, elle a deux [[classe-equivalence|classes]], $\{\varnothing, \{b\}\}$ et $\{\{a\}, E\}$ : elle ne retient d'une partie que la présence de $a$.
    - |
      Ni la symétrie ni la transitivité ne se déduisent des deux autres conditions ; l'exemple suivant traite la réflexivité. Sur $\mathcal P(\{a, b\})$, avec $a \neq b$, l'inclusion est réflexive et transitive mais non symétrique, puisque $\varnothing \subset \{a\}$ sans que $\{a\} \subset \varnothing$. Sur les parties non vides de $\{a, b\}$, la relation $X \cap Y \neq \varnothing$ est réflexive et symétrique ; elle relie $\{a\}$ à $\{a, b\}$ et $\{a, b\}$ à $\{b\}$, mais pas $\{a\}$ à $\{b\}$, et n'est donc pas transitive.
    - |
      La réflexivité ne découle pas de la symétrie et de la transitivité, malgré un raisonnement tentant : de $x \sim y$, la symétrie donne $y \sim x$, puis la transitivité $x \sim x$. Ce raisonnement suppose que $x$ soit relié à au moins un élément. Sur $\{a, b\}$, avec $a \neq b$, la relation $\{(a, a)\}$ est symétrique et transitive, mais non réflexive, car $b$ n'est relié à rien.

  ensemble-quotient:
    - |
      Pour la [[relation-equivalence|relation d'équivalence]] $X \cap \{a\} = Y \cap \{a\}$ sur $\lex{ensemble-parties}{\mathcal P}(E)$, avec $E = \{a, b\}$ et $a \neq b$, le quotient a deux éléments :
      $$\mathcal P(E)/\!\sim\ = \big\{\{\varnothing, \{b\}\},\ \{\{a\}, E\}\big\}.$$
      Ses éléments sont des parties de $\mathcal P(E)$, et non des éléments de $\mathcal P(E)$ : ni $\varnothing$ ni $\{b\}$ n'appartiennent au quotient, seule leur [[classe-equivalence|classe]] commune y figure.
    - |
      Sur $A \times B$, posons $(x, y) \sim (x', y')$ si $x = x'$. La classe de $(x, y)$ est $\{x\} \times B$, et le quotient est l'ensemble $\{\{x\} \times B : x \in A\}$ des « lignes » du produit : passer au quotient revient ici à oublier la seconde composante. Pour $A = \{a, b\}$ et $B = \{c, d, e\}$, il a deux éléments, formés chacun de trois couples. Si $B = \varnothing$, en revanche, $A \times B$ est vide, et son quotient aussi, quel que soit $A$.
    - |
      Le quotient peut se décrire par un représentant canonique, sans rien choisir. Pour $F \subset E$ et la relation $X \cap F = Y \cap F$ sur $\lex{ensemble-parties}{\mathcal P}(E)$, chaque classe contient une partie de $F$ et une seule : $X \cap F$ est équivalente à $X$, puisque $(X \cap F) \cap F = X \cap F$, et si $Z \subset F$ est équivalente à $X$, alors $Z = Z \cap F = X \cap F$. Plus loin, les entiers relatifs seront construits de même comme un quotient de $\mathbb N \times \mathbb N$ ({{z|$\mathbb Z$}}).

  equipotent:
    - |
      Pour tout ensemble $E$ et deux éléments distincts $c$ et $d$, l'ensemble $\lex{ensemble-parties}{\mathcal P}(E)$ est équipotent à l'ensemble $\{c, d\}^E$ des applications de $E$ dans $\{c, d\}$. À une partie $X$, on associe l'application $\chi_X$ qui vaut $c$ sur $X$ et $d$ ailleurs. On retrouve $X$ comme l'[[image-reciproque|image réciproque]] $\chi_X^{-1}(\{c\})$, d'où l'injectivité, et toute $g \in \{c, d\}^E$ est $\chi_X$ pour $X = g^{-1}(\{c\})$. Si $c = d$ et $E \neq \varnothing$, la conclusion tombe : $\{c\}^E$ n'a qu'un élément, et $\mathcal P(E)$ en a au moins deux, $\varnothing$ et $E$.
    - |
      Un ensemble peut être équipotent à l'une de ses parties strictes. Soit $I$ un ensemble [[inductif-successeur|inductif]] et $\sigma : I \to I$, $x \mapsto x \cup \{x\}$ ; elle est [[injection|injective]] et n'atteint pas $\varnothing$, par une remarque de {{r-injections|Injections, surjections, bijections}}. Vue comme application de $I$ dans $\sigma(I)$, elle est donc bijective, et $I \approx \sigma(I)$, alors que $\sigma(I) \neq I$. Rien de tel pour $\{a, b\}$, avec $a \neq b$ : ses parties strictes ont au plus un élément, et aucune application de $\{a, b\}$ dans l'une d'elles n'est injective.
    - |
      Deux produits distincts comme ensembles peuvent être équipotents. L'application $(x, y) \mapsto (y, x)$ de $A \times B$ dans $B \times A$ est une [[bijection]], puisque l'échange de $B \times A$ dans $A \times B$ lui est réciproque ({{r-inverses|Bijection réciproque, rétractions et sections}}, (i)). Ainsi $A \times B \approx B \times A$, bien que ces produits soient disjoints lorsque $A$ et $B$ sont non vides et disjoints. Plus loin, le {{r-cantor|théorème de Cantor}} montrera au contraire qu'aucun ensemble $E$ n'est équipotent à $\mathcal P(E)$.

  restriction:
    - |
      Restreindre ne change pas l'ensemble d'arrivée. Si $A \subset B$, la restriction de $\mathrm{id}_B$ à $A$ a pour graphe $\{(x, x) : x \in A\}$ et pour [[ensemble-arrivee|ensemble d'arrivée]] $B$ : c'est l'inclusion de $A$ dans $B$, et non l'[[identite|identité]] de $A$, dès que $A \neq B$. Pour retrouver $\mathrm{id}_A$, il faut à la fois restreindre le départ et réduire l'arrivée.
    - |
      Une restriction oublie de l'information, et une application définie sur une partie a en général plusieurs prolongements. Pour $a \neq b$ et $c \neq d$, l'application $g : \{a\} \to \{c, d\}$, $g(a) = c$, se prolonge à $\{a, b\}$ de deux façons, selon que $b$ a pour image $c$ ou $d$. À l'extrême, les quatre applications de $\{a, b\}$ dans $\{c, d\}$ ont la même restriction à $\varnothing$, l'application vide de $\varnothing$ dans $\{c, d\}$.
    - |
      L'hypothèse $X \subset A$ est nécessaire. Soit $f : \{a\} \to \{c\}$, de [[graphe-application|graphe]] $\Gamma = \{(a, c)\}$, et $X = \{a, b\}$, avec $a \neq b$ : la relation $\Gamma \cap (X \times \{c\})$ vaut encore $\{(a, c)\}$, et ne donne aucune image à $b$. Ce n'est le graphe d'aucune application de $X$ dans $\{c\}$. On ne restreint qu'à une partie de l'[[ensemble-depart|ensemble de départ]] ; en sortir demande un prolongement, qui n'est pas unique.

  image-directe:
    - |
      L'image directe ne respecte pas l'intersection, même lorsque celle-ci est non vide. Soient $A = \{a, b, c\}$ et $B = \{d, e\}$, cinq éléments distincts, et $f : A \to B$ qui envoie $a$ et $b$ sur $d$, et $c$ sur $e$. Pour $X = \{a, c\}$ et $X' = \{b, c\}$,
      $$\begin{aligned} f(X \cap X') &= f(\{c\}) = \{e\}, \\ f(X) \cap f(X') &= \{d, e\}. \end{aligned}$$
      L'inclusion de {{r-images|Images directes et réciproques}}, (iii), est stricte, parce que $a$ et $b$, l'un dans $X$ et l'autre dans $X'$, ont la même image.
      ```schema lex-image-directe-1
      Les parties $X$ et $X'$ de $A$ sont entourées en bleu et en vert ; leur intersection ne contient que $c$. Les points $a$ et $b$, l'un dans $X$, l'autre dans $X'$, ont la même image $d$, qui appartient à $f(X) \cap f(X')$ sans être l'image d'aucun point de $X \cap X'$.
      ```
    - |
      L'image directe ne respecte pas non plus le complémentaire, et aucune des deux inclusions n'est vraie en général. Avec la même application $f$, la partie $f(A \setminus \{a\}) = f(\{b, c\}) = \{d, e\}$ n'est pas contenue dans $B \setminus f(\{a\}) = \{e\}$. Pour $g : \{a\} \to \{d, e\}$, $g(a) = d$, et la partie vide, $g(\{a\} \setminus \varnothing) = \{d\}$ ne contient pas $B \setminus g(\varnothing) = \{d, e\}$. L'[[image-reciproque|image réciproque]], elle, respecte le complémentaire ({{r-images|Images directes et réciproques}}, (ii)).
    - |
      La notation $f(X)$ devient ambiguë quand $X$ est à la fois un élément et une partie de l'ensemble de départ. Soit $A = \{\varnothing, \{\varnothing\}\}$ et $h : A \to A$ l'échange, $h(\varnothing) = \{\varnothing\}$ et $h(\{\varnothing\}) = \varnothing$. La valeur de $h$ en l'élément $\{\varnothing\}$ est $\varnothing$, alors que l'image directe de la partie $\{\varnothing\}$ est $\{h(\varnothing)\} = \{\{\varnothing\}\}$. Dans un tel cas, il faut dire laquelle des deux on désigne.

  image-reciproque:
    - |
      L'image réciproque existe pour toute [[application]], même quand la [[relation-reciproque|relation réciproque]] de son graphe n'est le graphe d'aucune application. Soit $f : \{a, b, c\} \to \{d, e, k\}$, avec six éléments distincts, qui envoie $a$ et $b$ sur $d$ et $c$ sur $e$. Ici, cette relation réciproque donne deux images à $d$ et aucune à $k$ ; on a pourtant $f^{-1}(\{d\}) = \{a, b\}$, $f^{-1}(\{k\}) = \varnothing$ et $f^{-1}(\{e, k\}) = \{c\}$. L'[[image-directe|image directe]] de cette dernière est $\{e\}$, plus petite que $\{e, k\}$ : c'est l'égalité $f(f^{-1}(Y)) = Y \cap f(A)$ de {{r-images|Images directes et réciproques}}, (iv), avec $f(A) = \{d, e\}$.
    - |
      L'inclusion $X \subset f^{-1}(f(X))$ peut être stricte. Avec la même application, $f^{-1}(f(\{a\})) = f^{-1}(\{d\}) = \{a, b\}$ récupère tous les points qui ont la même image que $a$. Le complémentaire, en revanche, est respecté sans exception : $f^{-1}(\{d, e, k\} \setminus \{d\}) = \{c\}$, qui est bien $\{a, b, c\} \setminus f^{-1}(\{d\})$. Le contraste avec l'image directe, qui ne respecte ni le complémentaire ni l'intersection, est complet.

  composee:
    - |
      La composition n'est pas commutative, même entre applications d'un ensemble dans lui-même. Sur $E = \{a, b\}$, avec $a \neq b$, soient $c_a$ la constante de valeur $a$ et $s$ l'échange de $a$ et $b$. Alors $s \circ c_a$ est la constante de valeur $b$, tandis que $c_a \circ s = c_a$. Plus généralement, $c_a \circ f = c_a$ pour toute application $f : E \to E$ : composer à gauche par une constante efface l'effet de $f$.
      ```schema lex-composee-1
      Dans chaque rangée, $a$ est en haut et $b$ en bas, et l'on applique les deux applications de gauche à droite. En haut, la constante puis l'échange : tout aboutit à $b$ ; en bas, l'échange puis la constante : tout aboutit à $a$.
      ```
    - |
      La composée $g \circ f$ exige que l'ensemble d'arrivée de $f$ soit exactement l'[[ensemble-depart|ensemble de départ]] de $g$, et pas seulement qu'il contienne les valeurs de $f$. Pour $a \neq b$, si $f : \{a\} \to \{a, b\}$ envoie $a$ sur $a$ et si $g$ est l'[[identite|identité]] de $\{a\}$, la composée $g \circ f$ n'est pas définie, bien que $f$ ne prenne que la valeur $a$. La composée $f \circ g$, elle, est définie, et vaut $f$.
    - |
      Sur $\lex{ensemble-parties}{\mathcal P}(E)$, le passage au complémentaire $k : X \mapsto E \setminus X$ vérifie $k \circ k = \mathrm{id}_{\mathcal P(E)}$. Les deux applications ont en effet mêmes ensembles de départ et d'arrivée, et la même valeur en tout point, puisque $E \setminus (E \setminus X) = X$ pour toute partie $X$ de $E$. Plus loin, au nœud {{r-inverses|Bijection réciproque, rétractions et sections}}, cette égalité montrera que $k$ est une bijection, égale à sa propre réciproque.

  injection:
    - |
      Pour tout ensemble $A$, l'application $A \to \lex{ensemble-parties}{\mathcal P}(A)$, $a \mapsto \{a\}$, est injective : $\{a\} = \{a'\}$ entraîne $a = a'$, puisque $a$ appartient à $\{a'\}$. Elle n'est pas [[surjection|surjective]], car la partie vide n'est l'image d'aucun élément ; elle plonge $A$ dans $\mathcal P(A)$ en identifiant chaque élément au singleton qu'il forme.
    - |
      L'injectivité dépend de l'ensemble de départ, non de l'ensemble d'arrivée. Si $f : A \to B$ est injective, l'application de même graphe dans tout ensemble $B' \supset B$ l'est encore, et toute [[restriction]] de $f$ à une partie de $A$ aussi. En sens inverse, pour $a \neq b$, la constante $\{a, b\} \to \{c\}$ n'est pas injective, mais sa restriction à $\{a\}$ l'est : restreindre le départ peut rendre une application injective.
    - |
      L'injectivité se lit sur les images directes : $f$ est injective si et seulement si $f(X \cap X') = f(X) \cap f(X')$ pour toutes parties $X$, $X'$ de $A$. Si $f$ est injective et $b = f(x) = f(x')$ avec $x \in X$, $x' \in X'$, alors $x = x'$, d'où $b \in f(X \cap X')$. Réciproquement, si $x \neq x'$, l'égalité pour $X = \{x\}$ et $X' = \{x'\}$ donne $\{f(x)\} \cap \{f(x')\} = f(\varnothing) = \varnothing$, donc $f(x) \neq f(x')$. La remarque de {{r-images|Images directes et réciproques}} sur l'application constante montre l'égalité en défaut.

  surjection:
    - |
      La surjectivité dépend de l'ensemble d'arrivée. Pour $a \neq b$ et $c \neq d$, le graphe $\{(a, c), (b, c)\}$ définit une application surjective de $\{a, b\}$ sur $\{c\}$, et une application non surjective de $\{a, b\}$ dans $\{c, d\}$, où $d$ n'a pas d'antécédent. Les deux applications sont distinctes, puisque leurs ensembles d'arrivée diffèrent.
    - |
      Toute application devient surjective si l'on réduit son ensemble d'arrivée à son image. Soit $f : \{a, b, c\} \to \{d, e, k\}$, avec six éléments distincts, qui envoie $a$ et $b$ sur $d$ et $c$ sur $e$ ; elle n'est pas surjective, puisque $k$ n'a pas d'antécédent. Son [[image-directe|image]] $f(\{a, b, c\})$ est $\{d, e\}$, et l'application de même [[graphe-application|graphe]] et d'ensemble d'arrivée $\{d, e\}$ est surjective, sans être [[injection|injective]], car elle confond $a$ et $b$.
    - |
      Soit $p : A \times B \to A$ l'application $(x, y) \mapsto x$. Elle est surjective dès que $B$ est non vide : pour $x \in A$ et $y \in B$, on a $p(x, y) = x$. Sans cette hypothèse, la conclusion tombe : si $A \neq \varnothing$ et $B = \varnothing$, le produit $A \times B$ est vide, et $p$, l'application vide, n'atteint aucun point de $A$. Plus loin, au nœud {{r-choix|Formes de l'axiome du choix}}, on verra que l'existence d'une section pour toute surjection équivaut à l'axiome du choix.

  famille:
    - |
      Pour $X \subset E$ et deux indices distincts $\alpha$ et $\beta$, la famille $(A_i)_{i \in \{\alpha, \beta\}}$ définie par $A_\alpha = X$ et $A_\beta = E \setminus X$ a pour réunion $E$ et pour intersection $\varnothing$. Si $E = \varnothing$, elle prend deux fois la valeur $\varnothing$, alors que l'ensemble de ses valeurs, $\{\varnothing\}$, n'a qu'un élément : la famille retient la répétition, l'ensemble non.
    - |
      Une famille retient aussi l'ordre de ses indices, que l'ensemble de ses valeurs oublie. Pour $\alpha \neq \beta$ et $a \neq b$, les familles $x$ et $y$ définies par $x_\alpha = a$, $x_\beta = b$ et $y_\alpha = b$, $y_\beta = a$ sont deux [[application|applications]] distinctes de $\{\alpha, \beta\}$ dans $\{a, b\}$, puisque $x_\alpha \neq y_\alpha$. Leurs ensembles de valeurs sont pourtant tous deux égaux à $\{a, b\}$. C'est le même phénomène que pour le [[couple]], où $(a, b) \neq (b, a)$.
    - |
      L'intersection d'une famille n'est définie que si l'ensemble d'indices est non vide. Pour $I = \varnothing$, la réunion $\bigcup_{i \in \varnothing} A_i$ est la réunion de l'ensemble vide, c'est-à-dire $\varnothing$. Une intersection vide devrait en revanche contenir tout ensemble, puisque la condition d'appartenir à chaque $A_i$, pour $i \in \varnothing$, est toujours remplie ; or il n'existe pas d'ensemble de tous les ensembles ({{zf-russell|Paradoxe de Russell}}).

  produit-famille:
    - |
      Les éléments d'un produit sont des applications, et non des couples. Pour $\alpha \neq \beta$, $A_\alpha = \{a, b\}$ et $A_\beta = \{c\}$, avec $a \neq b$, le produit $\prod_{i \in \{\alpha, \beta\}} A_i$ a deux éléments : l'application $g$ qui envoie $\alpha$ sur $a$ et $\beta$ sur $c$, et l'application $g'$ qui envoie $\alpha$ sur $b$ et $\beta$ sur $c$. Ils correspondent aux deux couples $(a, c)$ et $(b, c)$ de $A_\alpha \times A_\beta$, et c'est cette correspondance qui identifie les deux notions de produit.
    - |
      Un seul facteur vide rend le produit vide. Si $A_\beta = \varnothing$ pour un indice $\beta$, aucune application ne peut vérifier $g(\beta) \in A_\beta$, et $\prod_{i \in I} A_i = \varnothing$, quels que soient les autres facteurs. Le cas $I = \varnothing$ est à l'opposé : la condition $g(i) \in A_i$, à vérifier pour tout $i \in \varnothing$, ne demande rien, et le produit a pour seul élément l'application vide.
    - |
      Pour une famille constante indexée par un ensemble $I$ non vide, $A_i = B$ pour tout $i \in I$, la réunion des $A_i$ est $B$, et le produit est l'ensemble $B^I$ des applications de $I$ dans $B$. L'hypothèse $I \neq \varnothing$ compte : pour $I = \varnothing$, le produit a pour seul élément l'application vide $(\varnothing, \varnothing, \varnothing)$, qui diffère de l'unique élément $(\varnothing, B, \varnothing)$ de $B^\varnothing$ dès que $B \neq \varnothing$. Plus loin, au nœud {{r-choix|Formes de l'axiome du choix}}, on verra que la non-vacuité du produit de toute famille d'ensembles non vides équivaut à l'axiome du choix.

  partition:
    - |
      Un ensemble $\{a, b, c\}$, à trois éléments distincts, a exactement cinq partitions. On les obtient selon la partie qui contient $a$, à savoir $\{a\}$, $\{a, b\}$, $\{a, c\}$ ou $\{a, b, c\}$, les points restants étant ensuite isolés ou regroupés :
      $$\begin{aligned} &\{\{a\}, \{b\}, \{c\}\}, \quad \{\{a\}, \{b, c\}\}, \\ &\{\{a, b\}, \{c\}\}, \quad \{\{a, c\}, \{b\}\}, \\ &\{\{a, b, c\}\}. \end{aligned}$$
      La première correspond à l'égalité, dont les classes sont les singletons, et la dernière à la relation qui relie tous les points entre eux.
      ```schema lex-partition-1
      Chaque dessin représente une partition de $\{a, b, c\}$, chaque partie étant entourée : en rouge celle qui contient $a$, en bleu celle qui contient $b$ sans $a$, en vert celle qui ne contient que $c$. On passe de la partition en singletons, en haut à gauche, à la partition en une seule partie, en bas à droite.
      ```
    - |
      Chacune des trois conditions compte. L'ensemble $\{\{a\}, \{a, b\}, \{c\}\}$ n'est pas une partition de $\{a, b, c\}$, ses éléments n'étant pas disjoints, et $\{\{a\}, \{b\}\}$ non plus, sa réunion manquant $c$. L'exclusion de $\varnothing$ est moins visible : $\{\varnothing, \{a\}, \{b, c\}\}$ définit la même relation « appartenir au même élément » que $\{\{a\}, \{b, c\}\}$, et la correspondance avec les [[relation-equivalence|relations d'équivalence]] serait perdue, car une classe n'est jamais vide.
    - |
      Cas limite : l'ensemble vide a une seule partition, l'ensemble vide de parties, puisque les trois conditions sont alors remplies sans rien demander. À l'inverse, un ensemble non vide n'a jamais la partition vide, dont la réunion est $\varnothing$.

  identite:
    - |
      On reconnaît l'identité à ses valeurs, puisque deux applications qui ont mêmes ensembles de départ et d'arrivée et prennent la même valeur en tout point sont égales ({{r-application|Application}}). Sur $\lex{ensemble-parties}{\mathcal P}(E)$, l'application $X \mapsto E \setminus (E \setminus X)$ est donc l'identité, car $E \setminus (E \setminus X) = X$ pour toute partie $X$ de $E$. L'application $X \mapsto E \setminus X$, elle, ne l'est pas dès que $E \neq \varnothing$, car elle envoie $\varnothing$ sur $E$.
    - |
      Le graphe de $\mathrm{id}_E$ est la diagonale $\Delta_E = \{(x, x) : x \in E\}$, qui, vue comme [[relation]] sur $E$, est l'égalité. Une relation $R$ sur $E$ est [[relation-reflexive|réflexive]] si et seulement si elle contient $\Delta_E$ : l'égalité est ainsi la plus petite relation réflexive sur $E$. Elle est en outre [[relation-symetrique|symétrique]], [[relation-antisymetrique|antisymétrique]] et [[relation-transitive|transitive]].
    - |
      Sur un singleton $\{a\}$, l'identité est la seule application de l'ensemble dans lui-même. Sur $E = \{a, b\}$, avec $a \neq b$, il y en a quatre : l'identité, l'échange $s$ de $a$ et $b$, et les deux constantes. Plus loin, au nœud {{r-composition|Composition des applications}}, on verra que l'échange composé avec lui-même redonne l'identité, alors qu'une constante composée avec elle-même reste la même constante.

  ensemble-depart:
    - |
      L'ensemble de départ se lit sur le graphe : c'est l'ensemble des premières composantes de ses couples, puisque tout élément de départ a une image. Pour $a \neq b$, la constante $\{a, b\} \to \{c\}$ a pour graphe $\{(a, c), (b, c)\}$, dont les premières composantes forment $\{a, b\}$. Sa [[restriction]] à $\{a\}$, de graphe $\{(a, c)\}$, est une autre application, bien qu'elle prenne la même valeur partout où elle est définie.
    - |
      Être une application dépend de l'ensemble de départ choisi. Pour $a \neq b$, la relation $\{(a, c)\}$ est le [[graphe-application|graphe]] d'une application de $\{a\}$ dans $\{c\}$, mais d'aucune application de $\{a, b\}$ dans $\{c\}$, puisque $b$ n'y a pas d'image. Pour une relation quelconque, l'ensemble des premières composantes peut donc être strictement plus petit que l'ensemble $A$ du produit $A \times B$ qui la contient.

  ensemble-arrivee:
    - |
      L'ensemble d'arrivée ne se lit pas sur le graphe. Pour $c \neq d$, le graphe $\{(a, c)\}$ est celui de l'application $(\{a\}, \{c\}, \{(a, c)\})$ et celui de l'application $(\{a\}, \{c, d\}, \{(a, c)\})$ ; ces deux triplets sont distincts, et dans le second l'élément $d$ n'est l'image de rien. On peut agrandir librement l'ensemble d'arrivée, à condition de dire lequel on prend.
    - |
      On ne peut en revanche réduire l'ensemble d'arrivée qu'à un ensemble qui contient toutes les valeurs. Pour $a \neq b$ et $c \neq d$, la constante de valeur $c$ de $\{a, b\}$ dans $\{c, d\}$ peut être vue comme une application dans $\{c\}$, mais pas dans $\{d\}$, car son [[graphe-application|graphe]] n'est pas contenu dans $\{a, b\} \times \{d\}$. Plus loin, au nœud {{r-injections|Injections, surjections, bijections}}, la surjectivité sera définie, et elle dépendra de ce choix.

  graphe-application:
    - |
      Pour $A = \{a, b\}$ et $B = \{c, d\}$, avec $a \neq b$ et $c \neq d$, la [[relation]] $\{(a, c), (b, c)\}$ est le graphe de l'application constante de valeur $c$. La relation $\{(a, c), (a, d)\}$, en revanche, n'est le graphe d'aucune application de $A$ dans $B$, pour deux raisons : $a$ y a deux images, et $b$ n'en a aucune.
    - |
      Un même graphe peut appartenir à plusieurs applications, qui diffèrent par leur ensemble d'arrivée. Si $A \subset B$, le graphe $\{(x, x) : x \in A\}$ est celui de l'[[identite|identité]] $\mathrm{id}_A : A \to A$ et celui de l'inclusion $(A, B, \{(x, x) : x \in A\})$ de $A$ dans $B$. Dès que $A \neq B$, ce sont deux applications distinctes, puisque les triplets diffèrent : c'est pour cela qu'une application n'est pas seulement son graphe.
    - |
      La partie vide $\varnothing$ de $\varnothing \times B$ est le graphe d'une application de $\varnothing$ dans $B$, puisque la condition « pour tout $a \in \varnothing$ » est vide ; c'est l'unique application de $\varnothing$ dans $B$. En sens inverse, si $A$ est non vide, aucune partie de $A \times \varnothing = \varnothing$ ne peut donner une image à un élément de $A$ : il n'y a aucune application de $A$ dans $\varnothing$.

  fonction-choix:
    - |
      Une fonction de choix peut exister sans l'axiome du choix, quand on sait la décrire. Pour $E = \{a, b\}$, avec $a \neq b$, l'ensemble $X$ des parties non vides de $E$ est $\{\{a\}, \{b\}, E\}$. Une fonction de choix sur $X$ envoie forcément $\{a\}$ sur $a$ et $\{b\}$ sur $b$, et peut envoyer $E$ sur $a$ ou sur $b$ : il y en a exactement deux, écrites explicitement.
    - |
      Si l'un des ensembles est vide, il n'y a aucune fonction de choix, et l'axiome du choix ne promet rien. Sur $\lex{ensemble-parties}{\mathcal P}(E)$ tout entier, une fonction de choix devrait vérifier $g(\varnothing) \in \varnothing$, ce qui est impossible : le [[produit-famille|produit]] de la [[famille]] $(A)_{A \in \mathcal P(E)}$ est vide, comme tout produit qui a un facteur vide.
    - |
      Pour un ensemble [[inductif-successeur|inductif]] $I$, chaque ensemble $x \cup \{x\}$, pour $x \in I$, est non vide, et l'application $x \mapsto x$ est une fonction de choix pour la famille $(x \cup \{x\})_{x \in I}$, puisque $x \in x \cup \{x\}$. Aucune règle de ce genre n'est disponible pour l'ensemble $X$ des parties non vides d'un ensemble quelconque ; qu'il ait une fonction de choix est ce qu'assure l'[[axiome-choix|axiome du choix]], par la forme (iii) de {{r-choix|Formes de l'axiome du choix}} appliquée à la famille $(A)_{A \in X}$.

  classe-equivalence:
    - |
      Une classe a en général plusieurs représentants. Pour la [[relation-equivalence|relation d'équivalence]] $X \cap \{a\} = Y \cap \{a\}$ sur $\lex{ensemble-parties}{\mathcal P}(\{a, b\})$, avec $a \neq b$, la classe de $\varnothing$ est $\{\varnothing, \{b\}\}$, et c'est aussi celle de $\{b\}$, conformément à $\varnothing \sim \{b\}$. La notation $\overline x$ désigne la classe, non le représentant : on ne peut lire sur $\overline{\varnothing} = \overline{\{b\}}$ lequel des deux a servi à l'écrire.
    - |
      Sur $A \times B$, pour la relation $(x, y) \sim (x', y')$ si $x = x'$, la classe de $(x, y)$ est $\{x\} \times B$ : elle contient tous les couples de même première composante, et les classes $\{x\} \times B$ et $\{x'\} \times B$, pour $x \neq x'$, sont disjointes. Chaque classe contient le couple qui sert à l'écrire, et n'est donc jamais vide.
    - |
      Sans transitivité, les ensembles $\{y : y \mathrel R x\}$ ne sont plus égaux ou disjoints. Sur les parties non vides de $\{a, b\}$, avec $a \neq b$, la relation $X \cap Y \neq \varnothing$ est réflexive et symétrique. L'ensemble des parties qui rencontrent $\{a\}$ est $\{\{a\}, \{a, b\}\}$, celui des parties qui rencontrent $\{b\}$ est $\{\{b\}, \{a, b\}\}$ : ils ont l'élément commun $\{a, b\}$ sans être égaux, et la propriété des classes tombe avec la transitivité.

  application-canonique:
    - |
      Sur $E = \{a, b, c\}$, avec trois éléments distincts, la [[relation-equivalence|relation d'équivalence]] dont les classes sont $\{a, b\}$ et $\{c\}$ a pour quotient l'ensemble à deux éléments $E/\!\sim\ = \{\{a, b\}, \{c\}\}$. L'application canonique envoie $a$ et $b$ sur la même classe $\{a, b\}$, et $c$ sur $\{c\}$ : elle identifie les éléments équivalents, et seulement eux.
    - |
      Deux relations d'équivalence extrêmes existent sur tout ensemble $E$. Pour l'égalité, chaque classe est un singleton, et $\pi(x) = \{x\}$ ne confond aucun couple de points distincts. Pour la relation qui rend tous les points équivalents, c'est-à-dire $E \times E$, il n'y a qu'une classe si $E$ est non vide, et $\pi$ est constante, de valeur $E$ : le quotient a oublié toute l'information.
    - |
      Sans transitivité, il n'y a plus d'application canonique. Sur $E = \{a, b, c\}$, la [[relation]] réflexive et symétrique qui relie $a$ à $b$ et $b$ à $c$, mais pas $a$ à $c$, donne les ensembles $\{y : y \sim a\} = \{a, b\}$ et $\{y : y \sim b\} = \{a, b, c\}$, distincts sans être disjoints. Ils ne forment pas une [[partition]] de $E$ : $b$, relié à $a$ et à $c$, devrait avoir la même image que chacun d'eux, alors que $a$ et $c$ ne sont pas reliés. C'est la transitivité qui garantit que l'identification est cohérente.

  projection-produit:
    - |
      Pour $\alpha \neq \beta$, $A_\alpha = \{a, b\}$ et $A_\beta = \{c\}$, avec $a \neq b$, le [[produit-famille|produit]] a deux éléments, $g$ et $g'$, qui prennent en $\alpha$ les valeurs $a$ et $b$, et en $\beta$ la valeur $c$. La projection $p_\alpha$ envoie $g$ sur $a$ et $g'$ sur $b$ ; la projection $p_\beta$ les envoie tous deux sur $c$. Chacune lit une seule coordonnée et oublie les autres.
    - |
      Une projection peut manquer des points de son ensemble d'arrivée lorsqu'un autre facteur est vide. Pour $A_\alpha = \{a\}$ et $A_\beta = \varnothing$, le produit est vide, et $p_\alpha$ est l'application vide, dont l'[[image-directe|image]] est $\varnothing \neq A_\alpha$. Si le produit est non vide, en revanche, $p_j(\prod_i A_i) = A_j$ : pour $g$ dans le produit et $a \in A_j$, l'application qui vaut $a$ en $j$ et coïncide avec $g$ ailleurs appartient au produit, et sa projection d'indice $j$ est $a$.
    - |
      On appelle aussi projections les applications $(x, y) \mapsto x$ et $(x, y) \mapsto y$ de $A \times B$ dans $A$ et dans $B$. Si $\Gamma$ est le [[graphe-application|graphe]] d'une application $f : A \to B$, l'image de $\Gamma$ par la première projection est $A$ tout entier, puisque tout élément a une image, et son image par la seconde est $f(A)$. L'[[image-reciproque|image réciproque]] d'une partie $X$ de $A$ par la première projection est la bande $X \times B$.

  retraction-application:
    - |
      Une rétraction n'est pas unique en général. Pour l'inclusion $f$ de $\{a, b\}$ dans $\{a, b, c\}$, à trois éléments distincts, une rétraction $r$ doit fixer $a$ et $b$, et peut envoyer $c$ sur $a$ ou sur $b$ : il y en a deux. Pour l'inclusion de $\{a\}$ dans $\{a, b\}$, au contraire, la rétraction est unique : c'est la constante de valeur $a$, seule application de $\{a, b\}$ dans $\{a\}$.
    - |
      Une application non [[injection|injective]] n'a pas de rétraction. Pour $a \neq b$, une rétraction $r : \{c\} \to \{a, b\}$ de la constante $f : \{a, b\} \to \{c\}$ devrait vérifier $r(c) = r(f(a)) = a$ et $r(c) = r(f(b)) = b$, ce qui contredit $a \neq b$. C'est le sens facile de {{r-inverses|Bijection réciproque, rétractions et sections}}, (ii) : si $r \circ f = \mathrm{id}$, qui est injective, alors $f$ l'est.
    - |
      Pour un ensemble [[inductif-successeur|inductif]] $I$, l'application $\sigma : I \to I$, $x \mapsto x \cup \{x\}$, est injective, par une remarque de {{r-injections|Injections, surjections, bijections}}. La construction de {{r-inverses|Bijection réciproque, rétractions et sections}}, (ii), avec $a_0 = \varnothing$, en donne sans aucun choix une rétraction $r$, le « prédécesseur » : $r(x \cup \{x\}) = x$, et $r(y) = \varnothing$ si $y$ n'est pas de cette forme. Elle n'est pas injective, puisque $r(\varnothing) = \varnothing = r(\{\varnothing\})$, avec $\{\varnothing\} = \varnothing \cup \{\varnothing\}$.

  section-application:
    - |
      Une section choisit un antécédent au-dessus de chaque point. Pour $g : \{a, b, c\} \to \{d, e\}$, cinq éléments distincts, qui envoie $a$ et $b$ sur $d$ et $c$ sur $e$, une section $s$ doit vérifier $g(s(d)) = d$ et $g(s(e)) = e$ : elle envoie $e$ sur $c$, et $d$ sur $a$ ou sur $b$. Il y a donc exactement deux sections, une par point de la [[fibre-application|fibre]] $\{a, b\}$.
      ```schema lex-section-application-1
      Les flèches grises sont celles de $g$, qui descendent de $A$ vers $B$. Les deux sections remontent de $d$ vers $a$, en rouge, ou vers $b$, en bleu ; la troisième flèche courbe, commune aux deux, remonte de $e$ vers $c$.
      ```
    - |
      Une section n'est qu'un inverse d'un côté. Pour la section $s$ qui envoie $d$ sur $a$ dans l'exemple précédent, on a $g \circ s = \mathrm{id}_{\{d, e\}}$, mais $s \circ g$ envoie $b$ sur $a$ et n'est pas l'[[identite|identité]] de $\{a, b, c\}$. La section $s$ est [[injection|injective]], puisqu'elle admet $g$ pour [[retraction-application|rétraction]], mais elle n'est pas [[surjection|surjective]] : elle manque $b$.
    - |
      Pour l'application $p : A \times B \to A$, $(x, y) \mapsto x$, avec $B$ non vide, une section se construit sans axiome du choix : on fixe un élément $b_0$ de $B$, et l'on pose $s(x) = (x, b_0)$. Un seul élément suffit, et son existence est l'hypothèse $B \neq \varnothing$. Plus loin, au nœud {{r-choix|Formes de l'axiome du choix}}, on verra que pour une surjection quelconque il faut choisir un point dans chaque fibre à la fois, et que l'existence d'une section devient l'axiome du choix.

  relation-reciproque:
    - |
      Prendre la réciproque, c'est échanger les deux composantes de chaque couple. Pour $R = \{(a, c), (a, d)\}$, relation de $\{a, b\}$ vers $\{c, d, e\}$, la réciproque est $R^{-1} = \{(c, a), (d, a)\}$, relation de $\{c, d, e\}$ vers $\{a, b\}$ ; en l'inversant de nouveau, on retrouve $R$. Sur un ensemble $E$, la réciproque de la trace de $\in$ est la relation $\{(y, x) \in E \times E : x \in y\}$, qui exprime que $y$ a $x$ pour élément.
    - |
      Sur $\lex{ensemble-parties}{\mathcal P}(E)$, la réciproque de l'inclusion est la relation « contient » : $(X, Y)$ appartient à la réciproque si et seulement si $Y \subset X$. L'intersection de l'inclusion et de sa réciproque est l'égalité, puisque $X \subset Y$ et $Y \subset X$ entraînent $X = Y$ par extensionnalité : c'est exactement dire que l'inclusion est [[relation-antisymetrique|antisymétrique]].

  relation-reflexive:
    - |
      L'inclusion sur $\lex{ensemble-parties}{\mathcal P}(E)$ est réflexive, puisque $X \subset X$ ; l'inclusion stricte, définie par $X \subset Y$ et $X \neq Y$, est au contraire irréflexive. La trace de $\in$ sur un ensemble $E$, $\{(x, y) \in E \times E : x \in y\}$, est elle aussi irréflexive, car aucun ensemble n'appartient à lui-même ({{zf-bienfonde|Aucun ensemble n'appartient à lui-même}}).
    - |
      La réflexivité dépend de l'ensemble sur lequel on considère la relation. Pour $a \neq b$, la relation $R = \{(a, a)\}$ est réflexive sur $\{a\}$, mais pas sur $\{a, b\}$, où $b$ n'est pas relié à lui-même. Sur $\{a, b\}$, elle n'est pas non plus irréflexive, puisque $a \mathrel R a$ : être irréflexive n'est pas la négation d'être réflexive.
    - |
      Cas limite : la relation vide est réflexive sur $\varnothing$, la condition « pour tout $x \in \varnothing$ » ne demandant rien, et elle ne l'est sur aucun ensemble non vide. Elle est irréflexive sur tout ensemble, de sorte que sur $\varnothing$ elle est à la fois réflexive et irréflexive.

  relation-symetrique:
    - |
      Sur $\lex{ensemble-parties}{\mathcal P}(E)$, la relation $X \cap Y \neq \varnothing$ est symétrique, comme la relation $X \cap Y = \varnothing$, puisque $X \cap Y = Y \cap X$. L'inclusion ne l'est pas dès que $E$ est non vide : $\varnothing \subset E$, alors que $E \not\subset \varnothing$.
    - |
      La symétrie se teste en comparant $R$ à sa [[relation-reciproque|réciproque]]. Sur $\{a, b, c\}$, à trois éléments distincts, la relation $R = \{(a, b), (b, a), (c, c)\}$ vérifie $R^{-1} = R$ : elle est symétrique. La relation $\{(a, b)\}$ ne l'est pas, puisque sa réciproque est $\{(b, a)\}$ ; il suffit d'un couple dont le retourné manque.
    - |
      Une relation à la fois symétrique et [[relation-antisymetrique|antisymétrique]] est contenue dans l'égalité : si $x \mathrel R y$, la symétrie donne $y \mathrel R x$, puis l'antisymétrie $x = y$. Sur $\{a, b\}$, avec $a \neq b$, il y en a ainsi quatre, les parties de $\{(a, a), (b, b)\}$, et seule l'égalité elle-même est [[relation-reflexive|réflexive]].

  relation-antisymetrique:
    - |
      L'inclusion sur $\lex{ensemble-parties}{\mathcal P}(E)$ est antisymétrique : $X \subset Y$ et $Y \subset X$ entraînent $X = Y$, par l'axiome d'extensionnalité. La relation $X \cap Y \neq \varnothing$ ne l'est pas : pour $a \neq b$, les parties $\{a\}$ et $\{a, b\}$ se rencontrent, dans un sens comme dans l'autre, sans être égales.
    - |
      Antisymétrique n'est pas le contraire de symétrique. Sur $\{a, b, c\}$, à trois éléments distincts, la relation $\{(a, b), (b, a), (a, c)\}$ n'est ni l'une ni l'autre : le couple $(a, b)$ et son retourné interdisent l'antisymétrie, puisque $a \neq b$, et le couple $(a, c)$, dont le retourné manque, interdit la symétrie.
    - |
      La trace de $\in$ sur un ensemble $E$ est antisymétrique sans qu'aucun cas ne se présente : on n'a jamais à la fois $x \in y$ et $y \in x$ ({{zf-bienfonde|Aucun ensemble n'appartient à lui-même}}), et l'hypothèse de l'antisymétrie n'est donc jamais satisfaite. Plus loin, au nœud {{ord|Structures d'ordre}}, les relations réflexives, antisymétriques et transitives seront les relations d'ordre.

  relation-transitive:
    - |
      La trace de $\in$ n'est pas transitive en général, mais elle peut l'être. Sur $E_1 = \{\varnothing, \{\varnothing\}, \{\{\varnothing\}\}\}$, elle se réduit aux deux couples $(\varnothing, \{\varnothing\})$ et $(\{\varnothing\}, \{\{\varnothing\}\})$, alors que $\varnothing \notin \{\{\varnothing\}\}$ : elle n'est pas transitive. Sur $E_2 = \{\varnothing, \{\varnothing\}, \{\varnothing, \{\varnothing\}\}\}$, elle contient en outre $(\varnothing, \{\varnothing, \{\varnothing\}\})$, et elle est transitive.
      ```schema lex-relation-transitive-1
      Chaque flèche va d'un élément $x$ vers un élément $y$ tel que $x \in y$. À gauche, la flèche qui fermerait le triangle manque, en pointillé rouge ; à droite, les trois flèches sont présentes.
      ```
    - |
      Sur $\{a, b\}$, avec $a \neq b$, la relation $x \neq y$ est symétrique mais pas transitive : $a \neq b$ et $b \neq a$, alors que $a \neq a$ est faux. La transitivité permettrait de passer de $x \mathrel R y$ et $y \mathrel R x$ à $x \mathrel R x$, et c'est précisément ce passage qui échoue ici.
    - |
      Une relation sans enchaînement est transitive faute de cas à vérifier. Pour $a \neq b$, la relation $\{(a, b)\}$ sur $\{a, b\}$ est transitive : elle ne contient aucun couple de la forme $(b, z)$, et donc aucune paire de couples $(x, y)$, $(y, z)$. Il en va de même de la relation vide, sur tout ensemble.

  fibre-application:
    - |
      Les fibres découpent l'ensemble de départ selon la valeur prise. Pour $f : \{a, b, c\} \to \{d, e, k\}$, avec six éléments distincts, qui envoie $a$ et $b$ sur $d$ et $c$ sur $e$, les fibres sont $f^{-1}(\{d\}) = \{a, b\}$, $f^{-1}(\{e\}) = \{c\}$ et $f^{-1}(\{k\}) = \varnothing$. Elles sont deux à deux disjointes et de réunion $\{a, b, c\}$ ; la fibre vide signale un point d'arrivée qui n'est l'image de rien.
      ```schema lex-fibre-application-1
      Chaque point de $A$ est relié à son image sur la droite $B$. Les fibres au-dessus de $d$ et de $e$ sont encadrées ; celle au-dessus de $k$ est vide, faute de flèche qui y aboutisse.
      ```
    - |
      Deux cas extrêmes encadrent la situation. Pour l'[[identite|identité]] de $A$, chaque fibre $\mathrm{id}_A^{-1}(\{a\}) = \{a\}$ est un singleton. Pour l'application constante $A \to \{c, d\}$ de valeur $c$, avec $c \neq d$ et $A$ non vide, la fibre au-dessus de $c$ est $A$ tout entier et celle au-dessus de $d$ est vide. Plus une fibre a d'éléments, plus l'application identifie de points entre eux.
    - |
      Pour l'application $p : A \times B \to A$, $(x, y) \mapsto x$, la fibre au-dessus de $x$ est la « ligne » $\{x\} \times B$, et ces lignes recouvrent le produit sans se rencontrer. Plus loin, au nœud {{r-choix|Formes de l'axiome du choix}}, c'est en choisissant un point dans chaque fibre d'une surjection quelconque que l'on construira une section, ce qui demande l'axiome du choix.
