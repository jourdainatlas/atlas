# Niveau 2 : structure interne du chapitre « Calculabilité et incomplétude » (nœud cal-incompletude du
# graphe calc). Fonction β de Gödel, définissabilité des ensembles récursivement énumérables dans ℕ,
# théorèmes d'une théorie récursivement axiomatisée, vérité arithmétique non récursivement énumérable et
# incomplétude des théories dont les axiomes sont vrais dans ℕ ; théorème de Craig (axiomes r.e. remplacés
# par des axiomes primitifs récursifs, mêmes théorèmes). Le point (i) de l-incompletude est démontré au chapitre
# suivant, cal-representation (graphe calc). Relie la calculabilité
# au nœud l-incompletude du graphe log, sans en réécrire la preuve. Le codage de la syntaxe vient du chapitre
# cal-syntaxe (entrée de cal-theoremes et de cal-craig) : rien n'y est admis.

graphe: cal-incompletude
titre: Calculabilité et incomplétude
conteneur: cal-incompletude

entrees:
  cal-arret: [cal-definissable]
  cal-syntaxe: [cal-theoremes, cal-craig]
  cal-ensembles: [cal-theoremes, cal-craig]
  cal-kleene: [cal-craig]

noeuds:
  - id: cal-beta
    etiquette: Fonction β
    nature: lemme
    titre: La fonction β de Gödel
    texte: |
      La [[fonction-beta|fonction β de Gödel]] est la fonction primitive récursive
      $$\beta(a, b, i) = r\big(a,\ 1 + (i + 1)b\big),$$
      reste de la [[division-euclidienne|division euclidienne]] de $a$ par $1 + (i + 1)b$.
    enonce: |
      Pour toute suite finie $(k_0, \dots, k_n)$ d'entiers, il existe des entiers $a$ et $b$ tels que $\beta(a, b, i) = k_i$ pour tout $i \leqslant n$.
    preuve: |
      Soit $s = \max(n, k_0, \dots, k_n) + 1$, $b = s!$, et $m_i = 1 + (i + 1)b$ pour $i \leqslant n$. On a $m_i > b \geqslant s > k_i$.

      *Les $m_i$ sont [[premiers-entre-eux|premiers entre eux]] deux à deux.* Soit $i < j \leqslant n$ et $p$ un [[nombre-premier|nombre premier]] qui divise $m_i$ et $m_j$. Il divise $m_j - m_i = (j - i)b$. Il ne divise pas $b$, sinon il diviserait $m_i - (i + 1)b = 1$ ; par le lemme d'Euclide ({{z-premiers|Nombres premiers}}, (i)), il divise donc $j - i$. Mais $1 \leqslant j - i \leqslant n < s$, donc $j - i$ divise $s! = b$, et $p$ diviserait $b$.

      Ainsi $m_i$ et $m_j$ n'ont aucun diviseur premier commun ; comme tout entier $d \geqslant 2$ a un diviseur premier, $m_i \wedge m_j = 1$.

      *Restes chinois.* Montrons par récurrence sur $l \leqslant n$ qu'il existe $a_l \in \lex{ensemble-entiers-relatifs}{\mathbb Z}$ tel que $a_l \equiv k_i$ modulo $m_i$, c'est-à-dire que $m_i$ divise $a_l - k_i$, pour tout $i \leqslant l$. On prend $a_0 = k_0$.

      Supposons $a_l$ construit, avec $l < n$, et soit $M = m_0 \cdots m_l$. Un diviseur premier commun à $M$ et à $m_{l+1}$ diviserait l'un des $m_i$, par le lemme d'Euclide ; donc $M \wedge m_{l+1} = 1$, et Bézout ({{z-bezout|PGCD, Bézout}}, (ii)) donne $u, v \in \mathbb Z$ tels que $uM + vm_{l+1} = 1$. On pose
      $$a_{l+1} = a_l + (k_{l+1} - a_l)\, uM.$$
      Modulo chaque $m_i$, $i \leqslant l$, on a $a_{l+1} \equiv a_l$ ; modulo $m_{l+1}$, $uM \equiv 1$ et $a_{l+1} \equiv k_{l+1}$.

      Soit enfin $a \in \lex{ensemble-entiers-naturels}{\mathbb N}$ le reste de la division de $a_n$ par $m_0 \cdots m_n$. Pour chaque $i$, $a \equiv k_i$ modulo $m_i$ et $0 \leqslant k_i < m_i$ : par unicité de la division euclidienne, $k_i$ est le reste de $a$ par $m_i$, c'est-à-dire $\beta(a, b, i)$.
    remarques:
      - |
        Pour la suite $(2, 0, 3)$, on trouve $s = 4$, $b = 24$, et les modules $25$, $49$ et $73$, premiers entre eux deux à deux. La construction de la preuve donne $a = 64\,827$, dont les restes par $25$, $49$ et $73$ sont bien $2$, $0$ et $3$ ; c'est le seul qui convienne entre $0$ et le produit des modules, $89\,425$. Même pour une suite aussi courte, le code est grand devant ses termes.
      - |
        La fonction $\beta$ remplace le codage $\langle k_0, \dots, k_n \rangle$ de {{cal-pr-codage|Codages}}, qui emploie l'exponentiation : elle ne demande que l'addition, la multiplication et la division euclidienne, qui s'expriment avec les seuls symboles $0$, $S$, $+$ et $\times$. Gödel l'a introduite dans son article de 1931 sur l'incomplétude (lemme 1), et lui a donné le nom $\beta$ dans ses leçons de 1934.

  - id: cal-definissable
    etiquette: Définissabilité
    nature: théorème
    titre: Les ensembles récursivement énumérables sont définissables dans ℕ
    texte: |
      On note $\mathcal N$ la [[structure]] de domaine $\lex{ensemble-entiers-naturels}{\mathbb N}$ pour la signature $\{0, S, +, \times\}$ de l'arithmétique ({{l-langage|Langage, signature}}), où les symboles ont leur sens usuel.

      Une partie $A \subset \lex{n-uplet}{\mathbb N^n}$ est [[ensemble-definissable|définissable]] s'il existe une [[formule]] $\varphi$ et des variables distinctes $v_1, \dots, v_n$, contenant les [[variable-libre|variables libres]] de $\varphi$, telles que, pour toute [[valuation-structure|valuation]] $s$,
      $$\mathcal N \models \varphi\,[s] \iff \big(s(v_1), \dots, s(v_n)\big) \in A.$$
      Une fonction partielle est définissable si son [[graphe-application|graphe]] $\{(x, y) : f(x)\!\downarrow \text{ et } f(x) = y\}$ l'est.
    enonce: |
      (i) Les parties définissables sont stables par réunion, intersection, complémentaire et projection. Elles contiennent les graphes de l'addition, de la multiplication, du [[successeur-ensemble|successeur]] et de la constante $0$, ainsi que l'égalité. Si $A \subset \mathbb N^n$ est définissable et $\alpha : \{1, \dots, n\} \to \{1, \dots, m\}$ une application, la partie $\{y \in \mathbb N^m : (y_{\alpha(1)}, \dots, y_{\alpha(n)}) \in A\}$ est définissable.

      (ii) Toute [[fonction-recursive|fonction récursive]] est définissable.

      (iii) Toute [[relation-recursive|relation récursive]] et toute partie [[ensemble-recursivement-enumerable|récursivement énumérable]] de $\mathbb N^n$ sont définissables. En particulier, l'ensemble $K$ de l'{{cal-arret|arrêt}} est défini par une formule dont la seule variable libre est une variable $v$.
    preuve: |
      (i) Changement de variables. Soit $A$ défini par $\varphi$ et $v_1, \dots, v_n$, et soit $w_1, \dots, w_m$ des variables distinctes qui ne figurent pas dans $\varphi$ et sont distinctes de $v_1, \dots, v_n$. La formule
      $$\begin{aligned} &\exists v_1 \cdots \exists v_n\, \big(v_1 = w_{\alpha(1)} \wedge \cdots \\ &\qquad \wedge v_n = w_{\alpha(n)} \wedge \varphi\big), \end{aligned}$$
      avec les variables $w_1, \dots, w_m$, définit la partie annoncée, par la définition de la {{l-satisfaction|satisfaction}} et le {{l-coincidence|lemme de coïncidence}}. Aucune substitution n'intervient, donc aucune capture.

      Avec $\alpha$ [[identite|l'identité]], on peut ainsi écrire deux parties définissables de $\mathbb N^n$ avec les mêmes variables ; la conjonction, la disjonction et la négation donnent alors l'intersection, la réunion et le complémentaire. Si $B \subset \mathbb N^{n+1}$ est défini par $\psi$ et $v_1, \dots, v_{n+1}$, sa projection est définie par $\exists v_{n+1}\, \psi$ et $v_1, \dots, v_n$, par le lemme de coïncidence.

      Les [[formule-atomique|formules atomiques]] $v_3 = +\, v_1\, v_2$, $v_3 = \times\, v_1\, v_2$, $v_2 = S\, v_1$, $v_1 = 0$ et $v_1 = v_2$ définissent les parties annoncées.

      (ii) L'ordre strict est définissable, puisque $x < y \iff \exists z\, (x + S(z) = y)$. Le graphe de $\beta$ aussi, puisque, par l'unicité du reste, la relation $v = \beta(a, b, i)$ équivaut à l'existence de $q$ et de $m$ tels que $m = S(S(i) \times b)$, $a = q \times m + v$ et $v < m$. Chacune de ces écritures se ramène à (i).

      L'ensemble des fonctions partielles définissables contient les [[fonctions-base|fonctions de base]], définies par $y = 0$, $y = S(x)$ et $y = x_i$. Il est stable par composition, puisque
      $$\begin{aligned} &h(x) = y \iff \exists z_1 \cdots \exists z_m \\ &\quad \Big(\bigwedge_{l} g_l(x) = z_l \wedge f(z) = y\Big). \end{aligned}$$

      Il est stable par minimisation, puisque $\mu y\, [f(x, y) = 0] = y$ équivaut à
      $$\begin{aligned} &f(x, y) = 0 \wedge \forall z\, \big(z < y \to {} \\ &\qquad \exists w\, (f(x, z) = w \wedge w \neq 0)\big). \end{aligned}$$

      Il est stable par récurrence primitive. En effet, $h(x, y) = v$ équivaut à l'existence de $a$ et $b$ tels que
      $$\begin{aligned} &\beta(a, b, 0) = f(x), \\ &\forall i < y\ \ \beta(a, b, i + 1) = g\big(x, i, \beta(a, b, i)\big), \\ &\beta(a, b, y) = v, \end{aligned}$$
      chaque égalité entre valeurs de fonctions s'écrivant avec des [[quantificateur-existentiel|quantificateurs existentiels]] comme pour la composition. Sans paramètre, $f(x)$ est remplacé par l'entier initial $c$ de la récurrence, et la partie $\{c\}$ est définie par $v_1 = S \cdots S\, 0$, avec $c$ symboles $S$.

      Si $h(x, y) = v$, les valeurs $h(x, 0), \dots, h(x, y)$ sont définies, et le {{cal-beta|lemme de la fonction β}} fournit $a$ et $b$ qui les codent. Réciproquement, si $a$ et $b$ conviennent, on montre par récurrence sur $i \leqslant y$ que $h(x, i)$ est défini et égal à $\beta(a, b, i)$.

      (iii) Une relation récursive $R$ est l'ensemble $\{x : \chi_R(x) = 1\}$, définissable par (ii) et (i). Une partie récursivement énumérable est la projection d'une relation récursive. Pour $K$, on applique (i) avec $m = 1$ pour choisir la variable.
    remarques:
      - |
        La définissabilité est une propriété de la structure $\mathcal N$, non d'une théorie : elle dit qu'une formule a le bon sens dans $\mathbb N$, et non qu'une théorie démontre quoi que ce soit à son sujet. La preuve de Gödel demande davantage, la représentation des relations récursives dans une théorie faible comme l'arithmétique de Robinson, que le nœud {{l-incompletude|Incomplétude}} admet par anticipation et que la {{cal-rp-rosser|séparation de Rosser}} établira.
      - |
        Les formules obtenues n'emploient que des quantificateurs existentiels et des quantificateurs bornés $\forall i < y$ : en les regroupant, on montre qu'un ensemble récursivement énumérable est défini par une formule de la forme $\exists y\, \varphi$, où $\varphi$ n'a que des quantificateurs bornés. Ce travail supplémentaire n'est pas nécessaire ici, où seule compte l'existence d'une formule ; il est fait au nœud {{cal-rp-forme-sigma|Forme Σ₁ des r.e.}}, où il sert au théorème de Gödel-Rosser.

  - id: cal-theoremes
    etiquette: Théorèmes r.e.
    nature: proposition
    titre: Les théorèmes d'une théorie récursivement axiomatisée
    texte: |
      Les mots du langage de l'arithmétique sont codés comme au nœud {{cal-sx-codage|Codage des mots}} : l'alphabet est énuméré par $a_0 = {=}$, $a_1 = \neg$, $a_2 = {\to}$, $a_3 = \forall$, $a_4 = 0$, $a_5 = S$, $a_6 = +$, $a_7 = \times$, puis $a_{8+i} = x_i$, et le [[code-mot|code]] $\ulcorner w \urcorner$ d'un mot $a_{k_0} \cdots a_{k_{m-1}}$ est l'entier $\langle k_0, \dots, k_{m-1} \rangle$.

      L'[[arithmetique-peano|arithmétique de Peano]] $\mathsf{PA}$ est la théorie dont les axiomes sont, avec $x = x_0$ et $y = x_1$,
      $$\begin{aligned} &\forall x\, \neg(S\,x = 0), \\ &\forall x\, \forall y\, (S\,x = S\,y \to x = y), \\ &\forall x\, (x + 0 = x), \\ &\forall x\, \forall y\, \big(x + S\,y = S(x + y)\big), \\ &\forall x\, (x \times 0 = 0), \\ &\forall x\, \forall y\, \big(x \times S\,y = x \times y + x\big), \end{aligned}$$
      et, pour toute formule $\varphi$ et toute variable $x$, la [[cloture-universelle|clôture universelle]] de
      $$\big(\varphi[0/x] \wedge \forall x\, (\varphi \to \varphi[S\,x/x])\big) \to \forall x\, \varphi,$$
      écrite en notation préfixée avec les seuls connecteurs $\neg$ et $\to$. C'est bien une formule, puisque $\varphi[0/x]$ et $\varphi[S\,x/x]$ en sont ({{cal-sx-substitution|Substitution}}, (iii)).

      Comme au nœud {{l-formules|Formules, variables libres}}, la clôture universelle d'une formule $\psi$ dont les [[variable-libre|variables libres]] sont $x_{i_1}, \dots, x_{i_g}$, avec $i_1 < \cdots < i_g$, est la formule $\forall x_{i_1} \cdots \forall x_{i_g}\, \psi$. C'est un énoncé : une [[occurrence|occurrence]] libre de $x_{i_m}$ dans $\psi$ se trouve dans la [[portee-quantificateur|portée]] du bloc $\forall x_{i_m}$, qui est la formule $\forall x_{i_{m+1}} \cdots \forall x_{i_g}\, \psi$, et une occurrence liée dans $\psi$ le reste ({{cal-sx-libres|Variables libres}}).
    enonce: |
      (i) Les ensembles des codes des formules, des énoncés, des [[axiomes-logiques|axiomes logiques]] de {{l-deduction|Démonstrations formelles}} et des axiomes de $\mathsf{PA}$ sont [[relation-primitive-recursive|primitifs récursifs]], donc [[ensemble-recursif|récursifs]].

      (ii) La relation « $\chi$ se déduit de $\varphi$ et $\psi$ par [[modus-ponens|modus ponens]] » est primitive récursive sur les codes.

      (iii) Soit $T$ une théorie sur cette signature dont l'ensemble des codes des axiomes est [[ensemble-recursivement-enumerable|récursivement énumérable]]. L'ensemble des codes des énoncés $\sigma$ tels que $T \vdash \sigma$ est récursivement énumérable. C'est le cas pour $\mathsf{PA}$.
    preuve: |
      (i) Les formules, les énoncés et les axiomes logiques sont traités au chapitre {{cal-syntaxe|Arithmétisation de la syntaxe}} : {{cal-sx-formules|Formules}}, (ii), {{cal-sx-libres|Variables libres}}, (iv), et {{cal-sx-axiomes|Axiomes logiques}}. Une relation primitive récursive est [[relation-recursive|récursive]] ({{cal-recursives|Fonctions récursives}}, (i)).

      Restent les axiomes de $\mathsf{PA}$. Les six premiers sont des énoncés fixés, de codes $c_1, \dots, c_6$ : l'ensemble de leurs codes a pour [[fonction-caracteristique-relation|fonction caractéristique]] $\mathrm{sg}\big(\chi_=(N, c_1) + \cdots + \chi_=(N, c_6)\big)$, primitive récursive.

      Pour le [[schema-recurrence|schéma de récurrence]], $P \wedge Q$ abrège $\neg(P \to \neg Q)$ ({{l-connecteurs|Connecteurs}}), et la formule dont on prend la clôture s'écrit en notation préfixée
      $$\begin{aligned} &{\to}\, \neg\, {\to}\, \varphi[0/x]\ \neg\, \forall x\, {\to}\, \varphi\ \varphi[S\,x/x] \\ &\quad \forall x\, \varphi. \end{aligned}$$
      Pour $x = a_k$ et $\varphi$ de code $a$, son code est donc, avec les fonctions de {{cal-sx-codage|Codage des mots}} et de {{cal-sx-substitution|Substitution}},
      $$\begin{aligned} I(a, k) = \mathrm{cc}\big(&\langle 2, 1, 2 \rangle, \mathrm{Sb}(a, \langle 4 \rangle, k), \\ &\langle 1, 3, k, 2 \rangle, a, \\ &\mathrm{Sb}(a, \langle 5, k \rangle, k), \langle 3, k \rangle, a\big), \end{aligned}$$
      fonction primitive récursive de $(a, k)$, puisque $\langle 4 \rangle$ et $\langle 5, k \rangle$ sont les codes des termes $0$ et $S\,x$ ; c'est le code d'une formule par le point (iii) de {{cal-sx-substitution|Substitution}}.

      Un entier $M$ code un axiome de récurrence si et seulement s'il existe $a \leqslant M$, $k < M$ et $g < \mathrm{lg}(M) + 1$ tels que $\mathrm{Fm}(a)$, $k \geqslant 8$, $2g \leqslant \mathrm{lg}(M)$, $\mathrm{sm}(M, 2g, \mathrm{lg}(M)) = I(a, k)$, et que les $g$ blocs du début énumèrent, par indices croissants, les variables libres de la formule de code $I(a, k)$. Les bornes viennent de ce que $\varphi$ est un [[facteur-mot|facteur]] du mot de code $M$ et $a_k$ une de ses lettres ({{cal-sx-codage|Codage des mots}}, (ii) et (iii)).

      La dernière condition s'écrit, avec $J = I(a, k)$ et la relation $\mathrm{VL}$ de {{cal-sx-libres|Variables libres}} : pour tout $m < g$, $(M)^{2m} = 3$, $\mathrm{VL}(J, (M)^{2m+1})$, et $(M)^{2m+1} < (M)^{2m+3}$ si $m + 1 < g$ ; et, pour tout $j < \mathrm{lg}(J)$ tel que $\mathrm{Lib}(J, j)$, il existe $m < g$ tel que $(M)^{2m+1} = (J)^j$. Toutes ces relations sont primitives récursives, et la réunion de deux ensembles primitifs récursifs l'est aussi ({{cal-pr-cloture|Clôture}}, (i)).

      (ii) C'est le point (i) de {{cal-sx-demonstrations|Démonstrations}} : en notation préfixée, $\psi$ est le mot $\to \varphi\, \chi$, et la relation est $\ulcorner \psi \urcorner = \mathrm{conc}\big(\mathrm{conc}(\langle 2 \rangle, \ulcorner \varphi \urcorner), \ulcorner \chi \urcorner\big)$.

      (iii) Soit $R$ une relation récursive telle que $a$ soit le code d'un axiome de $T$ si et seulement si $\exists y\, R(a, y)$. Une démonstration formelle $\gamma_0, \dots, \gamma_{l-1}$ se code par la suite $\langle \ulcorner \gamma_0 \urcorner, \dots, \ulcorner \gamma_{l-1} \urcorner \rangle$, comme au nœud {{cal-sx-demonstrations|Démonstrations}}, où le cas d'un ensemble d'axiomes primitif récursif est traité ; il faut ici des témoins pour les axiomes de $T$.

      Considérons la relation $D(p, w, c)$ : l'entier $c$ code un énoncé, $\mathrm{lg}(p) \geqslant 1$ et $(p)^{\mathrm{lg}(p) - 1} = c$.

      De plus, pour tout $j < \mathrm{lg}(p)$, l'une des trois conditions suivantes est remplie : $(p)^j$ code un axiome logique ; $R\big((p)^j, (w)_j\big)$ ; il existe $i, i' < j$ tels que $(p)^j$ se déduise de $(p)^i$ et $(p)^{i'}$ par modus ponens.

      Elle est récursive, par (i), (ii) et les quantifications bornées ({{cal-recursives|Fonctions récursives}}, (ii)).

      Si $T \vdash \sigma$, soit $p$ le code d'une démonstration de $\sigma$ ; pour chaque $j$ tel que $(p)^j$ code un axiome de $T$, soit $y_j$ le plus petit $y$ tel que $R((p)^j, y)$, et $y_j = 0$ sinon. Alors $D(p, w, \ulcorner \sigma \urcorner)$ pour $w = \prod_{j} p_j^{y_j}$. Réciproquement, $D(p, w, c)$ dit que $p$ code une démonstration de l'énoncé de code $c$. Ainsi
      $$T \vdash \sigma \iff \exists p\ \exists w\ D(p, w, \ulcorner \sigma \urcorner),$$
      et l'on conclut par le point (iv) de {{cal-ensembles|Récursif, r.e.}}. Pour $\mathsf{PA}$, l'ensemble des codes des axiomes est récursif par (i), donc récursivement énumérable.
    remarques:
      - |
        Le témoin $y_j$ est le plus petit qui convienne : il n'y a rien à choisir, et la preuve n'emploie aucune forme de l'axiome du choix.
      - |
        L'ensemble des théorèmes est récursivement énumérable, mais il n'a aucune raison d'être récursif ; pour $\mathsf{PA}$, il ne l'est pas, résultat plus fort qu'établit le point (iii) du {{cal-rp-godel-rosser|théorème de Gödel-Rosser}}. Savoir si un énoncé est démontrable, c'est attendre qu'une démonstration apparaisse dans l'énumération, sans savoir s'il faut cesser d'attendre.

  - id: cal-craig
    etiquette: Théorème de Craig
    nature: théorème
    titre: Des axiomes primitifs récursifs pour toute théorie récursivement axiomatisée
    texte: |
      Pour une [[formule]] $\sigma$ et un entier $t \in \lex{ensemble-entiers-naturels}{\mathbb N}$, on note $\sigma^{(t)}$ la conjonction de $t + 1$ copies de $\sigma$, définie par récurrence sur $t$ : $\sigma^{(0)} = \sigma$ et $\sigma^{(t+1)} = \sigma \wedge \sigma^{(t)}$. Comme $P \wedge Q$ abrège $\neg(P \to \neg Q)$ ({{l-connecteurs|Connecteurs}}), $\sigma^{(t+1)}$ est, en notation préfixée, le mot $\neg \to \sigma\ \neg\, \sigma^{(t)}$. C'est une formule, par récurrence sur $t$, et son nombre de lettres est $(t + 1)\,\mathrm{lg}(\ulcorner \sigma \urcorner) + 3t$.

      Avec les [[code-mot|codes]] de {{cal-sx-codage|Codage des mots}}, on définit par récurrence primitive sur $t$, avec le paramètre $a$,
      $$\begin{aligned} c(a, 0) &= a, \\ c(a, t + 1) &= \mathrm{cc}\big(\langle 1, 2 \rangle, a, \langle 1 \rangle, c(a, t)\big). \end{aligned}$$
      La fonction $c$ est définie par récurrence primitive à partir de $\mathrm{cc}$, qui est primitive récursive par le point (i) de {{cal-sx-codage|Codage des mots}} ; elle est donc primitive récursive. Comme $\langle 1, 2 \rangle$ et $\langle 1 \rangle$ sont les codes des mots $\neg \to$ et $\neg$, on a $c(\ulcorner \sigma \urcorner, t) = \ulcorner \sigma^{(t)} \urcorner$ pour toute formule $\sigma$, par récurrence sur $t$.
    enonce: |
      Soit $T$ une [[theorie]] sur la signature de l'arithmétique dont l'ensemble des codes des axiomes est [[ensemble-recursivement-enumerable|récursivement énumérable]].

      (i) Il existe une théorie $T'$ sur la même signature, dont l'ensemble des codes des axiomes est [[relation-primitive-recursive|primitif récursif]], et qui démontre les mêmes formules que $T$ : pour toute formule $\varphi$, $T \vdash \varphi$ si et seulement si $T' \vdash \varphi$.

      (ii) De plus, la relation $\mathrm{Dem}_{T'}$ de {{cal-sx-demonstrations|Démonstrations}} est primitive récursive, et, pour toute formule $\varphi$,
      $$T \vdash \varphi \iff \exists p\ \ \mathrm{Dem}_{T'}(p, \ulcorner \varphi \urcorner).$$
      La théorie $T'$ est [[theorie-coherente|cohérente]] si et seulement si $T$ l'est.
    preuve: |
      *Une énumération primitive récursive.* Soit $A$ l'ensemble des codes des axiomes de $T$, et $R$ une [[relation-recursive|relation récursive]] telle que $a \in A \iff \exists y\ R(a, y)$ ({{cal-ensembles|Récursif, r.e.}}). La fonction $f(a) \simeq \mu y\, R(a, y)$ est récursive ({{cal-recursives|Fonctions récursives}}, (iii)) ; par la définition de la minimisation, elle est définie exactement sur $A$.

      Par le point (i) de la {{cal-kleene|forme normale de Kleene}}, $f$ a un [[indice-calculable|indice]] $e$. Comme la fonction $U_1$ est [[fonction-totale|totale]], $f(a)$ est défini si et seulement s'il existe $t$ tel que $T_1(e, a, t)$. Ainsi
      $$a \in A \iff \exists t\ \ T_1(e, a, t),$$
      où la relation $T_1$ est primitive récursive.

      *La théorie $T'$.* Posons
      $$T' = \big\{\sigma^{(t)} : \sigma \in T,\ t \in \mathbb N,\ T_1(e, \ulcorner \sigma \urcorner, t)\big\}.$$
      Ses éléments sont des [[enonce|énoncés]]. En effet, $\sigma^{(t)}$ est une formule, et toute [[occurrence|occurrence]] de variable de $\sigma^{(t)}$ se trouve dans l'une des copies de $\sigma$ ; comme $\sigma$ est un énoncé, elle y est dans la [[portee-quantificateur|portée]] d'un quantificateur de cette copie, donc liée dans $\sigma^{(t)}$.

      Montrons qu'un entier $N$ est le code d'un élément de $T'$ si et seulement si
      $$\begin{aligned} &\exists a < N + 1\ \ \exists t < N + 1 \\ &\quad \big(N = c(a, t) \wedge T_1(e, a, t)\big), \end{aligned}$$
      relation primitive récursive par les points (i) et (iii) de {{cal-pr-cloture|Clôture}}.

      Si $N = c(a, t)$ et $T_1(e, a, t)$, alors $a \in A$ : l'entier $a$ est le code d'un axiome $\sigma$ de $T$, et $N = \ulcorner \sigma^{(t)} \urcorner$, avec $\sigma^{(t)} \in T'$.

      Réciproquement, si $N$ est le code d'un élément de $T'$, il existe, par la définition de $T'$, un axiome $\sigma$ de $T$ et un entier $t$ tels que $T_1(e, \ulcorner \sigma \urcorner, t)$ et $N = \ulcorner \sigma^{(t)} \urcorner$ ; un même mot peut s'écrire $\sigma^{(t)}$ de plusieurs façons, par exemple $\sigma^{(1)} = (\sigma \wedge \sigma)^{(0)}$, et l'on prend ces témoins-là. Les témoins $a = \ulcorner \sigma \urcorner$ et $t$ conviennent, et ils sont au plus égaux à $N$. D'une part, $\sigma$ est un [[facteur-mot|facteur]] de $\sigma^{(t)}$, donc $\ulcorner \sigma \urcorner \leqslant N$ par le point (ii) de {{cal-sx-codage|Codage des mots}}. D'autre part, par ce même point, les préfixes du mot de code $N$ ont des codes strictement croissants avec leur longueur, à partir du code $0$ du mot vide ; donc $\mathrm{lg}(N) \leqslant N$, et $t \leqslant (t + 1)\,\mathrm{lg}(\ulcorner \sigma \urcorner) + 3t = \mathrm{lg}(N)$.

      *Un lemme de remplacement.* Soit $\Gamma$ et $\Delta$ deux théories telles que chaque élément de $\Delta$ soit démontrable à partir de $\Gamma$. Alors toute formule démontrable à partir de $\Delta$ l'est à partir de $\Gamma$.

      En effet, soit $\gamma_0, \dots, \gamma_{l-1}$ une [[demonstration-formelle|démonstration formelle]] à partir de $\Delta$. Remplaçons chaque $\gamma_j$ qui appartient à $\Delta$ par la démonstration formelle de $\gamma_j$ à partir de $\Gamma$ de plus petit code ({{cal-sx-demonstrations|Démonstrations}}), qui se termine par $\gamma_j$. Dans la suite obtenue, chaque formule est un axiome logique, un élément de $\Gamma$, ou se déduit par [[modus-ponens|modus ponens]] de deux formules qui la précèdent : c'est le cas à l'intérieur de chaque bloc inséré, et une formule $\gamma_j$ obtenue par modus ponens à partir de $\gamma_i$ et de $\gamma_{i'}$, avec $i, i' < j$, vient encore après ces deux formules, qui figurent toujours dans la suite. C'est une démonstration formelle à partir de $\Gamma$, terminée par $\gamma_{l-1}$.

      *Mêmes théorèmes.* Soit $P$ une [[lettre-propositionnelle|lettre propositionnelle]] et $P^{(t)}$ défini comme $\sigma^{(t)}$. Par récurrence sur $t$ et par la table de $\wedge$ ({{l-connecteurs|Connecteurs}}), $P^{(t)}$ prend la même valeur que $P$ sous toute valuation : les formules $P \to P^{(t)}$ et $P^{(t)} \to P$ sont des [[tautologie|tautologies]]. Le remplacement se faisant lettre par lettre, on obtient $\sigma \to \sigma^{(t)}$ et $\sigma^{(t)} \to \sigma$ en remplaçant $P$ par $\sigma$ : ce sont des [[instance-tautologie|instances de tautologies]], donc des axiomes logiques du groupe (1) de {{l-deduction|Démonstrations formelles}}.

      Tout élément de $T'$ s'écrit $\sigma^{(t)}$ avec $\sigma \in T$, et la suite $\sigma$, $\sigma \to \sigma^{(t)}$, $\sigma^{(t)}$ est alors une démonstration formelle à partir de $T$. Si $\sigma \in T$, alors $\ulcorner \sigma \urcorner \in A$ ; soit $t$ le plus petit entier tel que $T_1(e, \ulcorner \sigma \urcorner, t)$. Alors $\sigma^{(t)} \in T'$, et la suite $\sigma^{(t)}$, $\sigma^{(t)} \to \sigma$, $\sigma$ est une démonstration formelle à partir de $T'$. Le lemme de remplacement, appliqué dans les deux sens, donne (i).

      (ii) La première assertion est le point (ii) de {{cal-sx-demonstrations|Démonstrations}}, appliqué à $T'$, et l'équivalence en résulte par (i), puisque $T' \vdash \varphi$ signifie qu'une démonstration formelle de $\varphi$ à partir de $T'$ existe. Deux théories qui démontrent les mêmes formules sont cohérentes en même temps, par la définition de la cohérence ({{l-coherence|Cohérence}}).
    remarques:
      - |
        Le principe est le suivant. On ne sait pas décider si un énoncé $\sigma$ est un axiome de $T$, puisque la recherche d'un témoin peut ne jamais aboutir ; mais l'axiome $\sigma^{(t)}$ de $T'$ porte avec lui, dans son nombre de copies, un temps $t$ auquel un calcul qui confirme que $\sigma$ est un axiome est déjà terminé (comme $T_1$ reste vraie au-delà de l'arrêt, $T'$ contient $\sigma^{(t)}$ pour une infinité de $t$), et cette confirmation se vérifie par une recherche bornée. L'erreur la plus répandue est de croire que $T'$ est pour autant plus simple que $T$ : ses axiomes forment un ensemble primitif récursif, mais ses théorèmes sont ceux de $T$, qui ne forment en général qu'un ensemble récursivement énumérable ({{cal-theoremes|Théorèmes r.e.}}, (iii)).
      - |
        Pour $\sigma$ la formule atomique ${=}\, 0\, 0$, de trois lettres, $\sigma^{(1)}$ est le mot $\neg \to {=}\, 0\, 0\ \neg\, {=}\, 0\, 0$, de neuf lettres, et $\sigma^{(t)}$ en a $6t + 3$. La longueur croît linéairement avec $t$, ce qui suffit à borner le témoin $t$ par le code de la formule.
      - |
        La complexité de l'ensemble des axiomes ne dit rien de la théorie. Notons $\underline n$ le terme clos $S \cdots S\, 0$, avec $n$ symboles $S$, et $K$ l'ensemble de l'{{cal-arret|arrêt}}. L'ensemble des codes des énoncés $\underline n = \underline n$, pour $n \in K$, est récursivement énumérable, par les points (iii) et (iv) de {{cal-ensembles|Récursif, r.e.}}, puisque $n \mapsto \ulcorner {=}\, \underline n\, \underline n \urcorner$ est primitive récursive, par une récurrence primitive avec $\mathrm{cc}$ comme celle de $c$ ci-dessus, et injective, le mot ayant $2n + 3$ lettres ; il n'est pas récursif, sans quoi $K$, son image réciproque par cette fonction, le serait aussi. Pourtant chacun de ces énoncés est démontrable sans aucun axiome ({{hk-egalite|Égalité démontrable}}, (i)) : par le lemme de remplacement, la théorie qu'ils forment ne démontre que des formules démontrables sans axiome, et l'inclusion inverse est évidente, une démonstration sans axiome en étant une à partir de toute théorie : elle démontre exactement les mêmes formules que la théorie vide, dont l'ensemble des axiomes est trivialement primitif récursif.
      - |
        Ce théorème ramène une théorie dont les axiomes forment un ensemble récursivement énumérable à une théorie dont la relation de démonstration est récursive, ce qu'emploie la voie de Gödel pour le {{l-incompletude|théorème d'incomplétude}}, qui suppose la relation de démonstration récursive, la représente dans l'arithmétique et lui applique le lemme diagonal ; on peut aussi s'en passer en représentant directement le prédicat de démontrabilité, récursivement énumérable, par une formule existentielle, comme le fait le nœud {{cal-dg-prov|Démontrabilité (D1)}}. Ni le nœud {{cal-tarski|Vérité et incomplétude}} ni le {{cal-rp-godel-rosser|théorème de Gödel-Rosser}} n'en ont besoin : il ne leur faut que l'énumérabilité des théorèmes.

        Le résultat est dû à William Craig (« On axiomatizability within a system », *Journal of Symbolic Logic* 18, 1953, p. 30-32) ; il vaut pour tout ensemble récursivement énumérable de formules d'un langage du premier ordre, et non seulement pour l'arithmétique. L'exposé usuel de sa construction remplace chaque énoncé par la conjonction de plusieurs copies de lui-même, le nombre de copies indiquant son rang dans une énumération ; une variante classique, suivie ici, lie ce nombre à un temps d'arrêt d'un calcul de la forme normale, ce qui rend l'ensemble obtenu primitif récursif. La preuve n'emploie aucune forme de l'axiome du choix : elle ne choisit qu'un objet à la fois (la relation $R$, un indice $e$ de $f$ parmi une infinité), ce qui ne relève pas de l'axiome, et les autres objets, démonstration de plus petit code et plus petit témoin $t$, sont déterminés sans choix.

  - id: cal-tarski
    etiquette: Vérité et incomplétude
    nature: théorème
    titre: La vérité arithmétique n'est pas récursivement énumérable
    texte: |
      Pour un entier $n$, on note $\underline n$ le terme clos $S \cdots S\, 0$, avec $n$ [[occurrence|occurrences]] de $S$ ; sa valeur dans $\mathcal N$ est $n$, par récurrence sur $n$.
    enonce: |
      (i) L'ensemble des [[code-mot|codes]] des énoncés vrais dans $\mathcal N$ n'est pas [[ensemble-recursivement-enumerable|récursivement énumérable]] ; il n'est donc pas [[ensemble-recursif|récursif]].

      (ii) Soit $T$ une théorie sur la signature de l'arithmétique, dont l'ensemble des codes des axiomes est récursivement énumérable et dont tous les axiomes sont vrais dans $\mathcal N$. Il existe un énoncé $\sigma$ vrai dans $\mathcal N$ tel que $T \nvdash \sigma$ et $T \nvdash \neg\sigma$.

      (iii) En particulier, l'[[arithmetique-peano|arithmétique de Peano]] $\mathsf{PA}$ n'est pas complète.
    preuve: |
      (i) Par le point (iii) de {{cal-definissable|Définissabilité}}, l'ensemble $K$ de l'arrêt est défini par une formule $\varphi_K$ dont la seule [[variable-libre|variable libre]] est $v$. Pour $n \in \lex{ensemble-entiers-naturels}{\mathbb N}$, considérons l'énoncé
      $$\sigma_n = \forall v\, \big(v = \underline n \to \neg\varphi_K\big),$$
      c'est-à-dire, en notation préfixée, le mot $\forall\, v \to {=}\, v\, \underline n\ \neg\, \varphi_K$.

      Par la définition de la satisfaction et le lemme de coïncidence, $\mathcal N \models \sigma_n$ si et seulement si $\mathcal N \not\models \varphi_K\,[v \mapsto n]$, c'est-à-dire $n \notin K$.

      Le code de $\sigma_n$ est
      $$\begin{aligned} g(n) = \mathrm{conc}\Big(&\mathrm{conc}\big(\ulcorner \forall v \to {=}\, v \urcorner, \ulcorner \underline n \urcorner\big), \\ &\ulcorner \neg\varphi_K \urcorner\Big), \end{aligned}$$
      où le premier et le dernier codes sont fixes, et $\ulcorner \underline n \urcorner$ se calcule par récurrence primitive : $\ulcorner \underline 0 \urcorner = \langle 4 \rangle$ et $\ulcorner \underline{n + 1} \urcorner = \mathrm{conc}(\langle 5 \rangle, \ulcorner \underline n \urcorner)$. La fonction $g$ est primitive récursive ({{cal-pr-codage|Codages}}).

      Si l'ensemble $V$ des codes des énoncés vrais était récursivement énumérable, $\mathbb N \setminus K = g^{-1}(V)$ le serait aussi ({{cal-ensembles|Récursif, r.e.}}, (iii)), contrairement au point (iii) de l'{{cal-arret|indécidabilité de l'arrêt}}.

      (ii) Comme $\mathcal N$ est un modèle de $T$, le {{l-correction|théorème de correction}} montre que tout énoncé démontrable dans $T$ est vrai dans $\mathcal N$. Si $T$ démontrait tous les énoncés vrais dans $\mathcal N$, l'ensemble $V$ serait celui des codes des énoncés démontrables dans $T$, récursivement énumérable par le point (iii) de {{cal-theoremes|Théorèmes r.e.}}, ce que (i) exclut.

      Il existe donc un énoncé $\sigma$ vrai dans $\mathcal N$ tel que $T \nvdash \sigma$. L'énoncé $\neg\sigma$ est faux dans $\mathcal N$ ; il n'est donc pas démontrable non plus.

      (iii) Les axiomes de $\mathsf{PA}$ sont vrais dans $\mathcal N$. Les six premiers sont les {{n-peano|axiomes de Peano}} et les égalités qui définissent les {{n-operations|opérations}}. Pour un axiome de récurrence et une [[valuation-structure|valuation]] $s$, l'ensemble des $n$ tels que $\mathcal N \models \varphi\,[s(x \mid n)]$ contient $0$ et est stable par [[successeur-ensemble|successeur]], par le {{l-substitution|lemme de substitution}} ; c'est donc $\mathbb N$ tout entier ({{n-recurrence|Récurrence}}). On applique (ii).
    remarques:
      - |
        Cette forme de l'incomplétude suppose les axiomes **vrais** dans $\mathbb N$, et non seulement la cohérence de $T$ comme au {{l-incompletude|théorème de Gödel et Rosser}}, démontré au nœud {{cal-rp-godel-rosser|Gödel-Rosser}} ; elle ne s'applique donc pas à une théorie cohérente qui démontrerait des énoncés faux. En revanche, elle n'exige aucune représentation des fonctions récursives dans $T$, seulement leur définissabilité dans $\mathcal N$.
      - |
        L'énoncé $\sigma$ n'est pas exhibé : la preuve montre seulement que l'un des $\sigma_n$, avec $n \notin K$, n'est pas démontrable. La preuve de Gödel construit au contraire un énoncé explicite, qui dit de lui-même qu'il n'est pas démontrable ; elle est donnée au nœud {{cal-dg-godel|Premier théorème (Gödel)}}, après le lemme diagonal.
      - |
        Le point (i) est une forme faible du théorème de Tarski, selon lequel l'ensemble des codes des énoncés vrais n'est même pas définissable dans $\mathcal N$ : la vérité arithmétique ne se définit pas dans le langage de l'arithmétique, comme l'annonçait la remarque de {{l-satisfaction|Satisfaction (Tarski)}}. Ce théorème est démontré au nœud {{cal-dg-tarski|Théorème de Tarski}}, par le lemme diagonal.

aretes:
  - [cal-beta, cal-definissable]
  - [cal-definissable, cal-tarski]
  - [cal-theoremes, cal-tarski]
