# Niveau 2 : structure interne du chapitre « Continuité ».
# Tous les énoncés portent sur des fonctions définies sur une partie de ℝ.

graphe: continuite
titre: Continuité
conteneur: continuite

entrees:
  ar-corps: [c-tvi, c-monotone]
  ar-suites: [c-sequentielle]
  ar-bw: [c-bornes, c-heine]
  ar-topo: [c-bornes]

noeuds:
  - id: c-point
    etiquette: Continuité en un point
    nature: définition
    enonce: |
      Soit $I \subset \lex{ensemble-reels}{\mathbb R}$, $f : I \to \mathbb R$ et $a \in I$. La fonction $f$ est **continue en $a$** si
      $$\begin{aligned} &\forall \varepsilon > 0,\ \exists \delta > 0,\ \forall x \in I, \\ &\quad |x - a| < \delta \ \Longrightarrow \\ &\qquad |f(x) - f(a)| < \varepsilon. \end{aligned}$$
      Elle est **continue sur $I$** si elle est continue en tout point de $I$.

      ```schema c-point
      Pour $f(x) = x^2$, $a = 1$ et $\varepsilon = 0{,}5$, le choix $\delta = 0{,}2$ convient : la partie du graphe située au-dessus de la bande verticale $]a - \delta, a + \delta[$ reste dans la bande horizontale $]f(a) - \varepsilon, f(a) + \varepsilon[$, donc dans le rectangle rouge. Tout $\delta$ plus petit convient aussi ; le plus grand possible est ici la solution positive de $(1 + \delta)^2 = 1{,}5$, environ $0{,}22$.
      ```

    remarques:
      - |
        C'est la [[continuite-point|définition métrique]] appliquée à la distance $|x - y|$. Elle équivaut à la définition topologique de la [[continuite]] pour la topologie induite sur $I$.
      - |
        L'erreur la plus répandue est d'inverser les quantificateurs : $\delta$ dépend de $\varepsilon$ et de $a$. Le faire dépendre de $a$ seulement, ou le choisir avant $\varepsilon$, change complètement la notion.

  - id: c-uniforme
    etiquette: Continuité uniforme
    nature: définition
    enonce: |
      La fonction $f : I \to \lex{ensemble-reels}{\mathbb R}$ est [[continuite-uniforme|uniformément continue]] sur $I$ si
      $$\begin{aligned} &\forall \varepsilon > 0,\ \exists \delta > 0,\ \forall x, y \in I, \\ &\quad |x - y| < \delta \ \Longrightarrow \\ &\qquad |f(x) - f(y)| < \varepsilon. \end{aligned}$$
    remarques:
      - |
        Le même $\delta$ convient en tout point : une fonction uniformément continue est continue, mais la réciproque est fausse. La fonction $x \mapsto x^2$ n'est pas uniformément continue sur $\mathbb R$, puisque $(x + \frac1x)^2 - x^2 = 2 + \frac1{x^2} > 2$ alors que $\frac1x$ tend vers $0$.

        ```schema c-uniforme
        Pour $x = 1{,}2$, $2{,}2$ et $3{,}2$, les points $x$ et $x + \frac1x$ sont de plus en plus proches (écarts en bleu sur l'axe des abscisses), mais leurs images restent écartées de $2 + \frac1{x^2} > 2$ (en rouge sur l'axe des ordonnées). Aucun $\delta$ ne convient donc pour $\varepsilon = 2$ en tous les points à la fois.
        ```

  - id: c-sequentielle
    etiquette: Caractérisation séquentielle
    nature: proposition
    choix: |
      Le sens réciproque construit une suite en choisissant un terme $x_n$ dans chacun des ensembles $A_n$ : il utilise le [[choix-denombrable]]. Sans lui, l'équivalence peut tomber en défaut.
    enonce: |
      La fonction $f : I \to \lex{ensemble-reels}{\mathbb R}$ est continue en $a \in I$ si et seulement si, pour toute [[suite]] $(x_n)$ d'éléments de $I$ qui converge vers $a$, la suite $(f(x_n))$ converge vers $f(a)$.
    preuve: |
      Supposons $f$ continue en $a$ et $x_n \to a$. Soit $\varepsilon > 0$ et $\delta$ associé. Il existe $N$ tel que $|x_n - a| < \delta$ pour $n \geqslant N$, et alors $|f(x_n) - f(a)| < \varepsilon$.

      Réciproquement, supposons $f$ non continue en $a$ : il existe $\varepsilon > 0$ tel que, pour tout $n \geqslant 1$, l'ensemble
      $$\begin{aligned} A_n = \Big\{ x \in I :{} &|x - a| < \tfrac1n \\ &\text{et } |f(x) - f(a)| \geqslant \varepsilon \Big\} \end{aligned}$$
      soit non vide. Choisissons $x_n \in A_n$ pour chaque $n$. Alors $x_n \to a$, mais $|f(x_n) - f(a)| \geqslant \varepsilon$ pour tout $n$, donc $(f(x_n))$ ne tend pas vers $f(a)$.

  - id: c-tvi
    etiquette: Valeurs intermédiaires
    nature: théorème
    titre: Théorème des valeurs intermédiaires
    enonce: |
      Soit $I$ un [[intervalle]] et $f : I \to \lex{ensemble-reels}{\mathbb R}$ continue. Alors $f(I)$ est un intervalle.
    preuve: |
      Soit $u < v$ deux éléments de $f(I)$, $y \in \,]u, v[$, et $a, b \in I$ tels que $f(a) = u$ et $f(b) = v$.

      **Cas $a < b$.** On a $[a,b] \subset I$ puisque $I$ est un intervalle. La partie $A = \{x \in [a,b] : f(x) < y\}$ contient $a$ et est majorée par $b$ ; soit $c = \sup A \in [a,b]$.

      ```schema c-tvi
      L'ensemble $A$, en rouge sur l'axe, n'est pas forcément un intervalle : $f$ peut passer plusieurs fois sous le niveau $y$. Sa borne supérieure $c$ est le dernier point où $f$ franchit ce niveau, et c'est en ce point que la preuve établit $f(c) = y$.
      ```

      Si $f(c) < y$, alors $c \neq b$ puisque $f(b) > y$. Par continuité en $c$ avec $\varepsilon = y - f(c)$, il existe $\delta > 0$ tel que $f(x) < y$ pour $x \in [a,b]$ et $|x - c| < \delta$. Le point $c + \frac12 \min(\delta, b - c)$ appartient alors à $A$ et dépasse $c$ : contradiction.

      Si $f(c) > y$, alors $c \neq a$. Par continuité, il existe $\delta > 0$, que l'on peut prendre inférieur à $c - a$, tel que $f(x) > y$ pour $x \in \,]c - \delta, c]$. Aucun élément de $A$ n'est dans cet intervalle, et aucun n'est strictement supérieur à $c$ ; donc $c - \delta$ majore $A$, ce qui contredit $c = \sup A$.

      Ainsi $f(c) = y$, et $y \in f(I)$.

      **Cas $a > b$.** On applique ce qui précède à $-f$ et à $-y$, puisque $-f(b) = -v < -y < -u = -f(a)$ avec $b < a$.
    remarques:
      - |
        La démonstration utilise la propriété de la borne supérieure de façon essentielle. Le théorème est faux sur $\lex{ensemble-rationnels}{\mathbb Q}$ : la fonction $x \mapsto x^2 - 2$ est continue sur $[0, 2] \cap \mathbb Q$, prend des valeurs de signes opposés, et ne s'annule pas.

  - id: c-bornes
    etiquette: Bornes atteintes
    nature: théorème
    titre: Théorème des bornes atteintes
    enonce: |
      Toute fonction continue sur un [[segment]] $[a,b]$ est bornée et atteint ses bornes : il existe $c, d \in [a,b]$ tels que $f(c) = \inf f$ et $f(d) = \sup f$.
    preuve: |
      Les deux étapes suivent le même schéma, par la borne supérieure. Pour l'intuition, la partie $A$ considérée est un intervalle d'origine $a$, que l'on prolonge au-delà de sa borne supérieure tant que celle-ci n'est pas $b$ ; la démonstration n'a pas besoin de le vérifier.

      *La fonction est majorée.* Soit $A$ l'ensemble des $x \in [a,b]$ tels que $f$ soit majorée sur $[a, x]$. Il contient $a$ et il est majoré par $b$ ; soit $s = \sup A \in [a, b]$. Par continuité en $s$, avec $\varepsilon = 1$, il existe $\delta > 0$ tel que $f(t) < f(s) + 1$ pour $t \in [a, b]$ et $|t - s| < \delta$.

      Comme $s - \delta$ ne majore pas $A$, il existe $x \in A$ tel que $x > s - \delta$ ; soit $K$ un majorant de $f$ sur $[a, x]$. Posons $y = \min\big(b, s + \frac\delta2\big)$. Un point $t \in [a, y]$ vérifie $t \leqslant x$, ou bien $s - \delta < x < t \leqslant s + \frac\delta2$, et dans ce second cas $f(t) < f(s) + 1$. Ainsi $f$ est majorée sur $[a, y]$ par $\max(K, f(s) + 1)$, et $y \in A$.

      Par suite $y \leqslant s$, ce qui exclut $y = s + \frac\delta2$ : donc $y = b$, et $f$ est majorée sur $[a, b]$.

      *La borne supérieure est atteinte.* Soit $M = \sup f$, et supposons que $f(t) < M$ pour tout $t \in [a, b]$. Soit $B$ l'ensemble des $x \in [a, b]$ tels que $\sup_{[a, x]} f < M$ ; il contient $a$ et il est majoré par $b$, et l'on pose $s = \sup B$.

      Par continuité en $s$, avec $\varepsilon = \frac{M - f(s)}2 > 0$, il existe $\delta > 0$ tel que $f(t) < \frac{f(s) + M}2$ pour $t \in [a, b]$ et $|t - s| < \delta$. Comme plus haut, il existe $x \in B$ tel que $x > s - \delta$, et, pour $y = \min\big(b, s + \frac\delta2\big)$,
      $$\sup_{[a, y]} f \leqslant \max\Big(\sup_{[a, x]} f,\ \frac{f(s) + M}2\Big) < M.$$
      Donc $y \in B$, puis $y = b$ comme plus haut, et $\sup_{[a, b]} f < M$, ce qui contredit la définition de $M$. Il existe donc $d \in [a, b]$ tel que $f(d) = M$.

      Le cas de la borne inférieure s'obtient en remplaçant $f$ par $-f$.
    remarques:
      - |
        La démonstration ne fait aucun choix : chaque existence n'y est invoquée qu'une fois, pour un $\delta$ ou un point $x$ donnés.

        La démonstration usuelle est séquentielle. Si $f$ n'est pas majorée, on choisit pour tout $n$ un $x_n \in [a, b]$ tel que $f(x_n) > n$ ; par {{ar-bw|Bolzano-Weierstrass}}, une suite extraite $(x_{\varphi(n)})$ converge vers un réel $d$, qui appartient à $[a, b]$ car ce segment est [[ferme|fermé]], et $f(x_{\varphi(n)}) \to f(d)$ par le sens direct de la caractérisation séquentielle ({{c-sequentielle|Caractérisation séquentielle}}), alors que $f(x_{\varphi(n)}) > \varphi(n) \geqslant n$.

        De même, avec $M = \sup f$, on choisit $x_n$ tel que $f(x_n) > M - \frac1n$, et l'on passe à la limite dans $M - \frac1{\varphi(n)} < f(x_{\varphi(n)}) \leqslant M$ le long d'une suite extraite convergente. Ces deux suites sont formées d'une infinité de choix : cette démonstration utilise le [[choix-denombrable]], que celle par la borne supérieure évite.
      - |
        Les deux hypothèses sont nécessaires. Sur $]0, 1]$, la fonction $x \mapsto 1/x$ est continue et non bornée ; sur $[0, 1]$, la fonction égale à $x$ sur $[0,1[$ et à $0$ en $1$ est bornée mais n'atteint pas sa borne supérieure.

  - id: c-heine
    etiquette: Théorème de Heine
    nature: théorème
    titre: Théorème de Heine
    enonce: |
      Toute fonction continue sur un [[segment]] y est [[continuite-uniforme|uniformément continue]].
    preuve: |
      Soit $f$ continue sur $[a, b]$ et $\varepsilon > 0$. Soit $A$ l'ensemble des $x \in [a, b]$ pour lesquels il existe $\delta > 0$ tel que
      $$\begin{aligned} &\forall s, t \in [a, x], \\ &\quad |s - t| < \delta \Longrightarrow |f(s) - f(t)| < \varepsilon. \end{aligned}$$
      Il contient $a$ et il est majoré par $b$ ; pour l'intuition, c'est un intervalle d'origine $a$, mais la démonstration n'en a pas besoin. Soit $c = \sup A \in [a, b]$.

      Par continuité en $c$, il existe $\eta > 0$ tel que $|f(s) - f(c)| < \frac\varepsilon2$ pour $s \in [a, b]$ et $|s - c| < \eta$. Comme $c - \frac\eta2$ ne majore pas $A$, il existe $x \in A$ tel que $x > c - \frac\eta2$ ; soit $\delta_x$ le nombre associé. Posons $y = \min\big(b, c + \frac\eta2\big)$ et $\delta = \min\big(\delta_x, \frac\eta2\big)$.

      Soit $s, t$ dans $[a, y]$ avec $|s - t| < \delta$ ; par symétrie, et le cas $s = t$ étant trivial, on peut supposer $s < t$. Si $t \leqslant x$, alors $|f(s) - f(t)| < \varepsilon$ par la propriété de $\delta_x$. Sinon,
      $$c - \eta < t - \frac\eta2 < s < t \leqslant c + \frac\eta2,$$
      puisque $t > x > c - \frac\eta2$ : les deux points sont à distance de $c$ inférieure à $\eta$, et
      $$\begin{aligned} &|f(s) - f(t)| \\ &\quad \leqslant |f(s) - f(c)| + |f(c) - f(t)| \\ &\quad < \varepsilon. \end{aligned}$$

      Ainsi $y \in A$, donc $y \leqslant c$, ce qui exclut $y = c + \frac\eta2$ : $y = b$. Le nombre $\delta$ associé à $b$ convient sur tout $[a, b]$, et, $\varepsilon$ étant quelconque, $f$ est uniformément continue.
    remarques:
      - |
        La démonstration ne fait aucun choix : pour $\varepsilon$ donné, on n'invoque qu'une fois l'existence de $\eta$, de $x$ et de $\delta_x$.

        La démonstration usuelle est séquentielle. Si $f$ n'est pas uniformément continue, il existe $\varepsilon > 0$ tel que, pour tout $n \geqslant 1$, on puisse choisir $x_n, y_n \in [a, b]$ avec $|x_n - y_n| < \frac1n$ et $|f(x_n) - f(y_n)| \geqslant \varepsilon$. Par {{ar-bw|Bolzano-Weierstrass}}, une suite extraite $(x_{\varphi(n)})$ converge vers $c \in [a, b]$, et $(y_{\varphi(n)})$ aussi, puisque $|x_{\varphi(n)} - y_{\varphi(n)}| < \frac1n$ ; par le sens direct de la caractérisation séquentielle ({{c-sequentielle|Caractérisation séquentielle}}), $f(x_{\varphi(n)}) - f(y_{\varphi(n)})$ tend vers $0$, ce qui contredit la minoration par $\varepsilon$. Le choix des suites $(x_n)$ et $(y_n)$ utilise le [[choix-denombrable]], que la démonstration par la borne supérieure évite.
      - |
        C'est l'ingrédient clé de l'intégrabilité des fonctions continues au sens de Riemann, établie au nœud {{ar-riemann|Intégrale de Riemann}}.

  - id: c-image
    etiquette: Image d'un segment
    nature: corollaire
    enonce: |
      L'image d'un [[segment]] par une fonction continue est un segment : $f([a,b]) = [m, M]$, avec $m = \min f$ et $M = \max f$.
    preuve: |
      Par le théorème des bornes atteintes, $m$ et $M$ sont des valeurs de $f$, et $f([a,b]) \subset [m, M]$. Par le théorème des valeurs intermédiaires, $f([a,b])$ est un intervalle ; contenant $m$ et $M$, il contient $[m,M]$.

  - id: c-monotone
    etiquette: Monotone d'image intervalle
    nature: lemme
    titre: Continuité des fonctions monotones
    enonce: |
      Soit $J$ un [[intervalle]] et $g : J \to \lex{ensemble-reels}{\mathbb R}$ monotone. Si $g(J)$ est un intervalle, alors $g$ est continue.
    preuve: |
      Quitte à remplacer $g$ par $-g$, supposons $g$ croissante. Soit $b \in J$ qui n'est pas l'extrémité droite de $J$ ; montrons la continuité à droite en $b$. L'ensemble $\{g(x) : x \in J,\ x > b\}$ est non vide et minoré par $g(b)$ ; soit $\ell$ sa borne inférieure, de sorte que $\ell \geqslant g(b)$.

      Si l'on avait $\ell > g(b)$, aucune valeur de $g$ ne serait dans $]g(b), \ell[$ : les points $x \leqslant b$ ont une image $\leqslant g(b)$, et les points $x > b$ une image $\geqslant \ell$. Mais $g(b)$ et $g(x)$, pour un $x > b$ de $J$, appartiennent à l'intervalle $g(J)$, qui contiendrait alors $]g(b), \ell[$. Donc $\ell = g(b)$.

      ```schema c-monotone
      La fonction croissante $g$ égale à $x$ sur $[0, 1]$ et à $x + 1$ sur $]1, 2]$ saute en $b = 1$ : on a $\ell = 2 > g(b) = 1$, et aucune valeur de $g$ ne tombe dans $]g(b), \ell[$. Son image $[0, 1] \cup \,]2, 3]$ n'est pas un intervalle, et c'est exactement ce que l'hypothèse exclut.
      ```

      Soit $\varepsilon > 0$. Par définition de la borne inférieure, il existe $x_0 > b$ dans $J$ tel que $g(x_0) < g(b) + \varepsilon$, et pour $b \leqslant t < x_0$, on a $g(b) \leqslant g(t) \leqslant g(x_0) < g(b) + \varepsilon$. La continuité à gauche se traite de même, avec une borne supérieure.

  - id: c-bijection
    etiquette: Bijection continue
    nature: théorème
    titre: Théorème de la bijection
    enonce: |
      Soit $I$ un intervalle et $f : I \to \lex{ensemble-reels}{\mathbb R}$ continue et strictement monotone. Alors $J = f(I)$ est un intervalle, $f$ réalise une [[bijection]] de $I$ sur $J$, et sa réciproque $f^{-1} : J \to I$ est continue, strictement monotone de même sens que $f$.
    preuve: |
      $J$ est un intervalle par le théorème des valeurs intermédiaires. La stricte monotonie rend $f$ injective, donc bijective de $I$ sur $J$. Si $f$ est strictement croissante et $y < y'$ dans $J$, on ne peut avoir $f^{-1}(y) \geqslant f^{-1}(y')$, sans quoi $y \geqslant y'$ : la réciproque est strictement croissante.

      Enfin $f^{-1}$ est monotone sur l'intervalle $J$, et son image $I$ est un intervalle : le lemme sur les fonctions monotones montre qu'elle est continue. Ainsi $f$ est un [[homeomorphisme]] de $I$ sur $J$.
    remarques:
      - |
        C'est ainsi que l'on définit la racine $n$-ième sur $[0, +\infty[$, puis, au niveau supérieur, le logarithme comme réciproque de l'exponentielle.

