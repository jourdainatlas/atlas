# Niveau 2 : structure interne du chapitre « Support compact et dualité de Poincaré » (nœud derham-poincare du
# graphe derham, créé le 31 oct. 2026). Pour un ouvert U de ℝⁿ : formes à support compact, H^k_c, extension par
# zéro (fonctorialité covariante), intégrale d'une n-forme à support compact et ∫ dη = 0 ; intégration dans les
# fibres de M × J et lemme de Poincaré à support compact, H^k_c d'un pavé ouvert ; suite de Mayer-Vietoris à
# support compact (flèches dans le sens des inclusions) ; accouplement ∫ ω ∧ η et compatibilité, au signe près,
# avec les suites de Mayer-Vietoris ; lemme des cinq ; dualité de Poincaré pour les réunions finies de pavés
# ouverts (dimensions finies) ; isomorphisme de Weil pour les sous-familles finies de cubes, naturel ; passage à
# la limite sur la suite exhaustive des réunions finies de cubes, par un argument de Mittag-Leffler où chaque
# choix est remplacé par un point de norme minimale ; dualité de Poincaré H^k(U) ≅ (H^{n−k}_c(U))* pour tout
# ouvert U de ℝⁿ.
# Choix : aucun.

graphe: derham-poincare
titre: Support compact et dualité de Poincaré
conteneur: derham-poincare

entrees:
  derham-cohomologie: [pc-mayer-vietoris]
  derham-tout-degre: [pc-weil-fini]

noeuds:
  - id: pc-support
    etiquette: Support compact
    nature: définition
    titre: Formes à support compact et cohomologie à support compact
    texte: |
      Soit $U$ un ouvert de $\lex{n-uplet}{\mathbb R^n}$. Le **support** d'une forme différentielle $\omega$ sur $U$ est l'adhérence, dans $U$, de l'ensemble des points $x$ où $\omega_x \neq 0$. On note $\Omega^k_c(U)$ l'espace des formes de degré $k$ sur $U$ dont le support est [[compact]], $Z^k_c(U)$ celui des formes fermées qui en font partie, et $B^k_c(U) = d\big(\Omega^{k-1}_c(U)\big)$, avec $B^0_c(U) = \{0\}$.

      La [[cohomologie-support-compact|cohomologie à support compact]] de $U$ est l'espace quotient
      $$H^k_c(U) = Z^k_c(U)/B^k_c(U).$$

      Si $V \subset U$ est un ouvert et $\eta \in \Omega^k_c(V)$, l'**extension par zéro** $j_*\eta$ est la forme sur $U$ égale à $\eta$ sur $V$ et à $0$ ailleurs.

      Une forme $\omega \in \Omega^n_c(U)$ s'écrit $f\,dx_1 \wedge \cdots \wedge dx_n$. Soit $\tilde f$ la fonction sur $\mathbb R^n$ égale à $f$ sur $U$ et à $0$ ailleurs, et $P$ un pavé ({{dr-iterees|Intégrales itérées}}) contenant le support de $\omega$. On pose
      $$\int_U \omega = \int_P \tilde f.$$
    enonce: |
      (i) Le support de $d\omega$ est contenu dans celui de $\omega$ : $d$ envoie $\Omega^k_c(U)$ dans $\Omega^{k+1}_c(U)$. L'extension par zéro $j_*$ est une forme de classe $C^\infty$, de même support, elle commute à $d$ et induit des applications linéaires $j_* : H^k_c(V) \to H^k_c(U)$ ; pour $W \subset V \subset U$, l'extension de $W$ à $U$ est la composée des deux extensions.

      (ii) $\int_U \omega$ ne dépend pas du pavé $P$ ; c'est une forme linéaire sur $\Omega^n_c(U)$, et $\int_U j_*\eta = \int_V \eta$ pour $\eta \in \Omega^n_c(V)$.

      (iii) *Stokes.* Pour $\eta \in \Omega^{n-1}_c(U)$, $\int_U d\eta = 0$. L'intégrale induit donc une forme linéaire sur $H^n_c(U)$.

      (iv) Un difféomorphisme $\varphi : U \to U'$ entre ouverts de $\mathbb R^n$ induit des isomorphismes $\varphi^* : H^k_c(U') \to H^k_c(U)$.
    preuve: |
      (i) Sur l'ouvert complémentaire du support de $\omega$, $\omega$ est nulle, donc $d\omega$ aussi : l'ensemble où $d\omega$ ne s'annule pas est contenu dans le support de $\omega$, qui est fermé, et le support de $d\omega$, fermé contenu dans un compact, est compact ({{t-compact-prop|Parties compactes}}, (i)).

      Soit $K$ le support de $\eta \in \Omega^k_c(V)$. Compact dans l'espace séparé $U$, il y est fermé (même nœud, (ii)), et $U$ est la réunion des ouverts $V$ et $U \setminus K$. La forme $j_*\eta$ vaut $\eta$ sur le premier, $0$ sur le second, et les deux coïncident sur $V \setminus K$ : elle est de classe $C^\infty$ ({{dr-partition|Partition de l'unité}}, (i)), de support $K$. Elle commute à $d$, qui ne dépend que des valeurs au voisinage de chaque point, et envoie donc formes fermées et formes $d\beta$, $\beta \in \Omega_c(V)$, sur des formes de même nature. La transitivité vient de ce que les deux extensions successives valent $\eta$ sur $W$ et $0$ ailleurs, comme l'extension directe.

      (ii) Par le même argument, $\tilde f$ est de classe $C^\infty$, et elle est nulle hors du support $K$ de $\omega$. Si $K$ est vide, l'intégrale vaut $0$ pour tout $P$. Sinon, soit $P = \prod_i [a_i, b_i]$ et $P' = \prod_i [a'_i, b'_i]$ deux pavés contenant $K$, et $P'' = \prod_i [a''_i, b''_i]$, avec $a''_i = \max(a_i, a'_i)$ et $b''_i = \min(b_i, b'_i)$. L'ensemble où $\omega$ ne s'annule pas est un ouvert non vide, d'adhérence $K$ contenue dans $P \cap P' = P''$ ; il contient une boule ouverte, si bien que $a''_i < b''_i$ pour tout $i$ : $P''$ est un pavé. Il suffit de comparer $P$ et $P'' \subset P$, puis $P'$ et $P''$.

      Avec les notations du nœud {{dr-iterees|Intégrales itérées}}, montrons par récurrence sur $j$ que les fonctions $g_j$ et $g''_j$ construites sur $P$ et $P''$ coïncident sur le pavé de $P''$ où elles sont définies, et que $g_j$ est nulle si l'une de ses variables $x_l$, $l > j$, sort de $[a''_l, b''_l]$. C'est vrai pour $j = 0$, $\tilde f$ étant nulle hors de $P''$. Au rang $j$, la fonction $t \mapsto g_{j-1}(t, \dots)$ est nulle hors de $[a''_j, b''_j]$, et la relation de Chasles ({{ri-proprietes|Propriétés de l'intégrale}}, (v)) ramène son intégrale sur $[a_j, b_j]$ à l'intégrale sur $[a''_j, b''_j]$. Pour $j = n$, $\int_P \tilde f = \int_{P''} \tilde f$.

      La linéarité vient de celle de l'intégrale itérée. Pour $\eta \in \Omega^n_c(V)$, les fonctions $\tilde f$ associées à $\eta$ et à $j_*\eta$ sont les mêmes.

      (iii) Étendons $\eta$ par zéro à $\mathbb R^n$ et écrivons $\eta = \sum_i (-1)^{i-1}f_i\,dx_1 \wedge \cdots \wedge \widehat{dx_i} \wedge \cdots \wedge dx_n$. Comme au nœud {{dc-angle-solide|Forme angle solide}}, $d\eta = \big(\sum_i \partial_if_i\big)\,dx_1 \wedge \cdots \wedge dx_n$.

      Le support $K$ est fermé et borné ({{me-rn|L'espace ℝⁿ}}, (iii)) ; soit $P = \prod_i [a_i, b_i]$ un pavé dont l'intérieur contient $K$. En intégrant d'abord en $x_i$ ({{dr-fubini|Fubini (fonctions continues)}}, (iii)), le théorème fondamental ({{ar-tfa|Théorème fondamental}}) donne, pour chaque $y$,
      $$\int_{a_i}^{b_i} \partial_if_i\big(\iota_{i,t}(y)\big)\,dt = 0,$$
      puisque $f_i$ est nulle sur les faces $x_i = a_i$ et $x_i = b_i$. Donc $\int_P \partial_if_i = 0$ pour chaque $i$.

      (iv) Si $\omega$ a un support compact $K$, celui de $\varphi^*\omega$ est $\varphi^{-1}(K)$, compact comme image de $K$ par l'application continue $\varphi^{-1}$ ({{t-compact-prop|Parties compactes}}, (iii)). L'image réciproque commute à $d$ ({{gd-formes|Formes différentielles}}, (iii)), et $(\varphi^{-1})^*$ est la réciproque de $\varphi^*$.
    remarques:
      - |
        L'erreur la plus répandue est de croire qu'une forme à support compact qui est exacte est nulle dans $H^k_c$. Sur $\mathbb R$, la forme $f\,dx$, avec $f$ continue à support compact, est toujours la différentielle de $g(x) = \int_{-\infty}^x f$, où l'intégrale part de n'importe quel point à gauche du support ; mais $g$ vaut $\int_{\mathbb R} f$ à droite du support, et n'est à support compact que si cette intégrale est nulle. La classe de $f\,dx$ dans $H^1_c(\mathbb R)$ est donc mesurée par son intégrale, ce que le nœud {{pc-fibre|Poincaré à support compact}} généralise.
      - |
        La cohomologie à support compact n'est pas invariante par homotopie : $\mathbb R^n$ a la cohomologie de de Rham d'un point, mais $H^n_c(\mathbb R^n) \neq 0$, alors que la cohomologie à support compact d'un point est nulle en degré $n \geqslant 1$. Elle l'est par difféomorphisme, d'après (iv). Plus généralement, elle est contravariante pour les applications propres, celles dont l'image réciproque d'un compact est compacte, et invariante par homotopie propre, ce qui n'est pas développé ici.
      - |
        Les flèches vont dans le sens des inclusions : une forme à support compact dans $V$ se prolonge par zéro à $U$, alors qu'une forme quelconque de $U$ se restreint à $V$. C'est ce renversement qui rend $H^*_c$ dual de $H^*$.

  - id: pc-fibre
    etiquette: Poincaré à support compact
    nature: théorème
    titre: Intégration dans les fibres et lemme de Poincaré à support compact
    texte: |
      Soit $M$ un ouvert de $\mathbb R^m$, $m \geqslant 0$, avec la convention que $\mathbb R^0$ est un point, sur lequel $\Omega^0 = \mathbb R$ et $\Omega^k = 0$ pour $k \geqslant 1$. Soit $J = \,]a, b[$ un intervalle ouvert, $-\infty \leqslant a < b \leqslant +\infty$, et $M \times J$, ouvert de $\mathbb R^{m+1}$ de coordonnées $(x, t)$. Une forme de degré $k$ sur $M \times J$ s'écrit
      $$\omega = \sum_I a_I\,dx_I + \sum_L b_L\,dt \wedge dx_L.$$

      Pour une fonction $g$ continue sur $J$ et nulle hors d'un segment de $J$, on note $\int_{-}^t g$ l'intégrale $\int_\alpha^t g$, où $\alpha \in J$ est à gauche de ce segment ; elle ne dépend pas de $\alpha$.

      Fixons une fonction $e$ de classe $C^\infty$ sur $J$, nulle hors d'un segment $[c - r, c + r] \subset J$ et d'intégrale $1$ : par exemple $\psi_{c,r}$ ({{dr-plateau|Fonctions plateau}}) divisée par son intégrale, qui est strictement positive. On pose $E(t) = \int_-^t e$, et, pour $\omega \in \Omega^k_c(M \times J)$ et $\varphi \in \Omega^k_c(M)$ :
      $$\begin{aligned} \pi_*\omega &= \sum_L \Big(\int_J b_L(x, t)\,dt\Big)\,dx_L, \\ e_*\varphi &= e(t)\,dt \wedge \varphi, \end{aligned}$$
      et $K\omega = \sum_L g_L\,dx_L$, avec
      $$\begin{aligned} g_L(x, t) &= \int_-^t b_L(x, s)\,ds \\ &\quad - E(t)\int_J b_L(x, s)\,ds. \end{aligned}$$
    enonce: |
      (i) $\pi_*$, $e_*$ et $K$ envoient les formes à support compact sur des formes à support compact, de degrés $k - 1$, $k + 1$ et $k - 1$. On a $\pi_*e_* = \mathrm{id}$, $d\pi_* = -\pi_*d$ et $de_* = -e_*d$.

      (ii) $dK + Kd = \mathrm{id} - e_*\pi_*$.

      (iii) $H^0_c(M \times J) = \{0\}$, et $\pi_*$ induit des isomorphismes $H^{k+1}_c(M \times J) \to H^k_c(M)$ pour tout $k \geqslant 0$, de réciproques induites par $e_*$.

      (iv) Pour un pavé ouvert $P = \prod_{i=1}^n\,]a_i, b_i[$ de $\lex{n-uplet}{\mathbb R^n}$, $n \geqslant 1$, avec $-\infty \leqslant a_i < b_i \leqslant +\infty$, on a $H^k_c(P) = \{0\}$ pour $k \neq n$, et l'intégrale $\int_P : H^n_c(P) \to \mathbb R$ est un isomorphisme. En particulier $H^n_c(\mathbb R^n) \cong \mathbb R$.
    preuve: |
      (i) *Supports.* Si $\omega$ est nulle hors du compact $C$, $\pi_*\omega$ est nulle hors de la projection de $C$ sur $M$, compacte ({{t-compact-prop|Parties compactes}}, (iii)). Soit $[\alpha, \beta]$ un segment de $J$ contenant la projection de $C$ sur $J$ et le segment $[c - r, c + r]$. Pour $t < \alpha$, $g_L(x, t) = 0 - 0$ ; pour $t > \beta$, $E(t) = 1$ et $g_L = \int_J b_L - \int_J b_L = 0$ ; et $g_L = 0$ si $x$ est hors de la projection de $C$ sur $M$. Le support de $K\omega$ est donc dans un produit de deux compacts. Enfin $e_*\varphi$ est nulle hors de $\mathrm{supp}\,\varphi \times [c - r, c + r]$.

      *Régularité.* L'intégrale sur $J$ porte, en fait, sur le segment $[\alpha, \beta]$ ; après le changement de variable affine qui le ramène à $[0, 1]$ ({{dr-iterees|Intégrales itérées}}, (iii)), le nœud {{gd-schwarz|Schwarz, intégrales à paramètre}}, (ii), montre que $\pi_*\omega$ et $x \mapsto \int_J b_L(x, s)\,ds$ sont de classe $C^\infty$, et que l'on dérive sous l'intégrale en $x$.

      Pour l'intégrale à borne variable, le même changement de variable donne, pour $t \in J$,
      $$\begin{aligned} &\int_\alpha^t b_L(x, s)\,ds \\ &\quad = (t - \alpha)\int_0^1 b_L\big(x, \alpha + u(t - \alpha)\big)\,du, \end{aligned}$$
      où le point $\alpha + u(t - \alpha)$ reste dans l'intervalle $J$. L'intégrande est une fonction de $u \in [0, 1]$ et du paramètre $(x, t) \in M \times J$, continue avec toutes ses dérivées partielles en $(x, t)$ ; par le même point (ii), le second membre est de classe $C^\infty$ en $(x, t)$. Il en va de même de $E(t) = \int_\alpha^t e$, et $g_L$ est de classe $C^\infty$, comme produit et somme ({{gd-classe-ck|Classe Cᵏ}}, (ii) et (iii)).

      *Identités.* $\pi_*e_*\varphi = \big(\int_J e\big)\varphi = \varphi$. Pour $\omega = a\,dx_I$, $d\omega = \sum_l \partial_la\,dx_l \wedge dx_I + \partial_ta\,dt \wedge dx_I$, et $\pi_*d\omega = \big(\int_J \partial_ta\,dt\big)dx_I = 0$, la fonction $t \mapsto a(x, t)$ étant nulle aux deux bouts d'un segment qui contient son support ; et $\pi_*\omega = 0$.

      Pour $\omega = b\,dt \wedge dx_L$, on a $d\omega = -\sum_l \partial_lb\,dt \wedge dx_l \wedge dx_L$, comme au nœud {{dc-homotopie|Formule d'homotopie}}, d'où $\pi_*d\omega = -\sum_l \big(\int_J \partial_lb\big)\,dx_l \wedge dx_L = -d\pi_*\omega$. Enfin $d(e\,dt) = e'\,dt \wedge dt = 0$, et la règle de Leibniz ({{gd-formes|Formes différentielles}}, (i)) donne $d(e\,dt \wedge \varphi) = -e\,dt \wedge d\varphi$.

      (ii) Les deux membres sont linéaires ; traitons les deux types de formes.

      *$\omega = a\,dx_I$.* Alors $K\omega = 0$ et $\pi_*\omega = 0$. Dans $d\omega$, seul $\partial_ta\,dt \wedge dx_I$ contient $dt$, et
      $$\begin{aligned} K(d\omega) &= \Big(\int_-^t \partial_sa\,ds - E(t)\cdot 0\Big)dx_I \\ &= \omega, \end{aligned}$$
      par le théorème fondamental ({{ar-tfa|Théorème fondamental}}).

      *$\omega = b\,dt \wedge dx_L$.* Avec $B = \int_J b$, on a $e_*\pi_*\omega = eB\,dt \wedge dx_L$ et $K\omega = g\,dx_L$, $g = \int_-^t b - EB$. Donc
      $$\begin{aligned} d(K\omega) &= (b - eB)\,dt \wedge dx_L \\ &\quad + \sum_l \partial_lg\,dx_l \wedge dx_L, \end{aligned}$$
      tandis que $K(d\omega) = -\sum_l \partial_lg\,dx_l \wedge dx_L$, puisque $\partial_lg = \int_-^t \partial_lb - E\int_J \partial_lb$. La somme est $\omega - e_*\pi_*\omega$.

      (iii) Par (i), $\pi_*$ et $e_*$ envoient formes fermées sur formes fermées et formes $d\beta$, $\beta$ à support compact, sur des formes de même nature : ils induisent des applications entre les cohomologies à support compact. $\pi_*e_* = \mathrm{id}$, et, pour $\omega$ fermée, (ii) donne $\omega - e_*\pi_*\omega = d(K\omega)$, avec $K\omega$ à support compact : les deux applications sont réciproques. En degré $0$, $\pi_*$ et $K$ sont nulles, et (ii) se réduit à $K(df) = f$ : une fonction $f$ à support compact et de différentielle nulle est nulle.

      (iv) Par récurrence sur $n$, en écrivant $P = P' \times\,]a_n, b_n[$, où $P'$ est un pavé ouvert de $\mathbb R^{n-1}$, ou un point si $n = 1$. Pour le point, $H^0_c = \mathbb R$ et $H^k_c = 0$ pour $k \geqslant 1$. Par (iii), $H^0_c(P) = 0$ et $H^k_c(P) \cong H^{k-1}_c(P')$ pour $k \geqslant 1$ : la seule cohomologie non nulle est en degré $n$, de dimension $1$.

      Pour $\omega = f\,dx_1 \wedge \cdots \wedge dx_n = (-1)^{n-1}f\,dx_n \wedge dx_1 \wedge \cdots \wedge dx_{n-1}$, on a $\pi_*\omega = (-1)^{n-1}\big(\int f\,dx_n\big)\,dx_1 \wedge \cdots \wedge dx_{n-1}$, et, en intégrant d'abord en $x_n$ ({{dr-fubini|Fubini (fonctions continues)}}, (ii)), $\int_{P'} \pi_*\omega = (-1)^{n-1}\int_P \omega$. L'intégrale sur $P$ est donc, au signe près, la composée de l'isomorphisme $\pi_*$ et de l'intégrale sur $P'$, qui est un isomorphisme par récurrence ; pour $n = 1$, c'est $\pi_*$ suivi de l'identification $H^0_c(\text{point}) = \mathbb R$.
    remarques:
      - |
        En dimension $1$, avec $M$ réduit à un point et $J = \mathbb R$, (ii) dit qu'une fonction $f$ continue à support compact d'intégrale nulle a la primitive à support compact $\int_-^t f$, et qu'en général $f - \big(\int f\big)\,e$ en a une. La forme $e\,dt$, « bosse d'intégrale $1$ », représente la classe de toutes les formes d'intégrale $1$.

        ```schema pc-fibre
        En haut, une fonction $f$ d'intégrale nulle, en bleu, et sa primitive $g = \int_-^t f$, en rouge, nulle hors d'un segment. En bas, la bosse $e$, d'intégrale $1$, en vert, et sa primitive $E$, qui vaut $1$ à droite : elle n'est pas à support compact, et $e\,dt$ n'est pas nulle dans $H^1_c(\mathbb R)$.
        ```
      - |
        L'opérateur $K$ est celui du nœud {{dc-homotopie|Formule d'homotopie}}, où l'on intégrerait sur toute la fibre $J$ au lieu de $[0, 1]$, corrigé par le terme $E(t)\int_J b$ pour que le résultat soit encore à support compact. Sans ce terme, $K\omega$ vaudrait $\int_J b$ à droite du support et ne serait pas à support compact : c'est toute la différence entre $H^*$, invariante par homotopie, et $H^*_c$, qui ne l'est pas.

  - id: pc-mayer-vietoris
    etiquette: Mayer-Vietoris à support compact
    nature: théorème
    titre: Suite de Mayer-Vietoris à support compact
    texte: |
      Soit $U$ et $V$ deux ouverts de $\lex{n-uplet}{\mathbb R^n}$, $X = U \cup V$, $\chi_U$ et $\chi_V$ la partition de l'unité du nœud {{dc-partition|Partition pour deux ouverts}}. On note $j_*$ les extensions par zéro de $U \cap V$ à $U$ et à $V$, et de $U$ et de $V$ à $X$.
    enonce: |
      (i) La suite
      $$\begin{aligned} 0 \to \Omega^k_c(U \cap V) &\xrightarrow{\ i\ } \Omega^k_c(U) \oplus \Omega^k_c(V) \\ &\xrightarrow{\ s\ } \Omega^k_c(X) \to 0, \end{aligned}$$
      avec $i(\eta) = (j_*\eta, -j_*\eta)$ et $s(\alpha, \beta) = j_*\alpha + j_*\beta$, est exacte, et $i$, $s$ commutent à $d$.

      (ii) Il en résulte une suite exacte longue
      $$\begin{aligned} \cdots &\to H^k_c(U \cap V) \\ &\xrightarrow{i} H^k_c(U) \oplus H^k_c(V) \\ &\xrightarrow{s} H^k_c(X) \\ &\xrightarrow{\delta_c} H^{k+1}_c(U \cap V) \to \cdots \end{aligned}$$
      qui commence par $0 \to H^0_c(U \cap V)$.

      (iii) Pour $\omega \in Z^k_c(X)$, $\delta_c[\omega]$ est la classe de la restriction de $d\chi_U \wedge \omega$ à $U \cap V$, forme à support compact dans $U \cap V$.
    preuve: |
      (i) Soit $F_U$ l'adhérence dans $X$ de l'ensemble où $\chi_U \neq 0$. Comme $\chi_U$ est nulle près de $X \setminus U$, $F_U \subset U$ ; de même $F_V \subset V$.

      *Injectivité de $i$* : la première composante de $i(\eta)$, prolongement par zéro de $\eta$, est nulle seulement si $\eta$ l'est. *$s \circ i = 0$* : $j_*j_*\eta - j_*j_*\eta = 0$, les deux extensions successives donnant la même forme sur $X$ ({{pc-support|Support compact}}, (i)).

      *Noyau de $s$.* Si $j_*\alpha = -j_*\beta$, le support de cette forme est celui de $\alpha$, contenu dans $U$, et aussi celui de $\beta$, contenu dans $V$ : il est compact et contenu dans $U \cap V$. La restriction $\eta = \alpha|_{U \cap V}$ est donc à support compact, et $(\alpha, \beta) = i(\eta)$.

      *Surjectivité de $s$.* Soit $\omega \in \Omega^k_c(X)$, de support $C$. La forme $\chi_U\omega$ est nulle hors de $C \cap F_U$, fermé du compact $C$, donc compact ({{t-compact-prop|Parties compactes}}, (i)), et contenu dans $U$ : sa restriction $\alpha$ à $U$ est à support compact. De même pour $\beta = (\chi_V\omega)|_V$, et $s(\alpha, \beta) = (\chi_U + \chi_V)\,\omega = \omega$.

      *Commutation.* L'extension par zéro commute à $d$ ({{pc-support|Support compact}}, (i)).

      (ii) Comme au nœud {{dc-mayer-vietoris|Mayer-Vietoris}}, (ii), on pose $C_m = \Omega^{-m}_c$ et l'on applique le nœud {{h-suite-exacte|Suite exacte longue}} : le morphisme de connexion va de $H^k_c(X)$ à $H^{k+1}_c(U \cap V)$.

      (iii) Le couple $\big((\chi_U\omega)|_U, (\chi_V\omega)|_V\big)$ relève $\omega$, et sa différentielle est $(d\chi_U \wedge \omega, d\chi_V \wedge \omega)$, restreintes. Or $d\chi_V = -d\chi_U$. La forme $d\chi_U \wedge \omega$ est nulle près de $X \setminus U$, où $\chi_U$ est localement nulle, et près de $X \setminus V$, où $\chi_U = 1 - \chi_V$ est localement constante : son support est un fermé de $C$ contenu dans $U \cap V$, donc un compact de $U \cap V$. Si $\zeta$ est sa restriction à $U \cap V$, $i(\zeta)$ est la différentielle du relèvement, et $\delta_c[\omega] = [\zeta]$.
    remarques:
      - |
        Les flèches vont en sens inverse de celles du nœud {{dc-mayer-vietoris|Mayer-Vietoris}} : on part de l'intersection, la plus petite, pour arriver à la réunion, et le morphisme de connexion augmente le degré en allant de $X$ vers $U \cap V$. C'est le même sens que pour l'homologie ({{h-mayer-vietoris|Mayer-Vietoris}}), à ceci près que le degré y diminue.
      - |
        Pour $\mathbb R = \,]{-\infty}, 1[ \cup \,]0, +\infty[$, la suite contient $H^0_c(\mathbb R) = 0 \to H^1_c(]0, 1[) \to H^1_c(]{-\infty}, 1[) \oplus H^1_c(]0, +\infty[) \to H^1_c(\mathbb R) \to 0$, soit, par l'intégrale ({{pc-fibre|Poincaré à support compact}}, (iv)), $0 \to \mathbb R \to \mathbb R^2 \to \mathbb R \to 0$, où la première flèche est $c \mapsto (c, -c)$ et la seconde $(a, b) \mapsto a + b$ : la suite est bien exacte.

  - id: pc-accouplement
    etiquette: Accouplement de Poincaré
    nature: proposition
    titre: L'accouplement de Poincaré
    texte: |
      Soit $U$ un ouvert de $\lex{n-uplet}{\mathbb R^n}$. Pour $\omega \in \Omega^k(U)$ et $\eta \in \Omega^{n-k}_c(U)$, la forme $\omega \wedge \eta$, de degré $n$, est nulle hors du support de $\eta$, donc à support compact, et l'on pose
      $$\langle \omega, \eta \rangle_U = \int_U \omega \wedge \eta.$$
    enonce: |
      (i) Pour $\omega$ et $\eta$ fermées, $\langle \omega, \eta \rangle_U$ ne dépend que des classes $[\omega] \in \lex{cohomologie-de-rham}{H^k}(U)$ et $[\eta] \in H^{n-k}_c(U)$. L'application
      $$\mathrm{PD}_U : H^k(U) \to \lex{espace-dual}{\big(H^{n-k}_c(U)\big)^*}$$
      qui envoie $[\omega]$ sur $[\eta] \mapsto \langle \omega, \eta \rangle_U$ est linéaire.

      (ii) Si $V \subset U$ est un ouvert, $\langle \omega|_V, \eta \rangle_V = \langle \omega, j_*\eta \rangle_U$ pour $\eta \in \Omega^{n-k}_c(V)$.

      (iii) Soit $X = U \cup V$. Avec les notations des nœuds {{dc-mayer-vietoris|Mayer-Vietoris}} et {{pc-mayer-vietoris|Mayer-Vietoris à support compact}}, pour des classes de degrés convenables :
      $$\begin{aligned} \langle r^*c, (\alpha, \beta) \rangle &= \langle c, s(\alpha, \beta) \rangle_X, \\ \langle s^*(a, b), \eta \rangle_{U \cap V} &= \langle (a, b), i(\eta) \rangle, \\ \langle \delta\omega, \eta \rangle_X &= (-1)^k\langle \omega, \delta_c\eta \rangle_{U \cap V}, \end{aligned}$$
      où $\langle (a, b), (\alpha, \beta) \rangle = \langle a, \alpha \rangle_U + \langle b, \beta \rangle_V$, et où, dans la dernière, $\omega$ est de degré $k - 1$.
    preuve: |
      (i) Si $\omega = d\alpha$ et $\eta$ est fermée, $\omega \wedge \eta = d(\alpha \wedge \eta)$ ({{gd-formes|Formes différentielles}}, (i)), et $\alpha \wedge \eta$ est à support compact : l'intégrale est nulle ({{pc-support|Support compact}}, (iii)). Si $\eta = d\beta$, avec $\beta$ à support compact, et $\omega$ fermée, $\omega \wedge d\beta = (-1)^k d(\omega \wedge \beta)$, de même nulle à l'intégrale. La linéarité est celle de l'intégrale.

      (ii) $\omega \wedge j_*\eta = j_*(\omega|_V \wedge \eta)$, et $\int_U j_* = \int_V$ ({{pc-support|Support compact}}, (ii)).

      (iii) Les deux premières égalités découlent de (ii) et de la linéarité : $\int_X c \wedge (j_*\alpha + j_*\beta) = \int_U c \wedge \alpha + \int_V c \wedge \beta$, et $\int_U a \wedge j_*\eta - \int_V b \wedge j_*\eta = \int_{U \cap V} (a - b) \wedge \eta$.

      Pour la troisième, $\delta\omega$ est représentée par $d\chi_V \wedge \omega$, prolongée par zéro ({{dc-mayer-vietoris|Mayer-Vietoris}}, (iii)), et $\delta_c\eta$ par $d\chi_U \wedge \eta = -d\chi_V \wedge \eta$ (nœud {{pc-mayer-vietoris|Mayer-Vietoris à support compact}}, (iii)). Comme $d\chi_V$ est de degré $1$ et $\omega$ de degré $k - 1$,
      $$\omega \wedge d\chi_V \wedge \eta = (-1)^{k-1}\,d\chi_V \wedge \omega \wedge \eta,$$
      et ces formes sont nulles hors de $U \cap V$. Donc $\langle \omega, \delta_c\eta \rangle = (-1)^k\langle \delta\omega, \eta \rangle$.
    remarques:
      - |
        Pour $U = \mathbb R^n$ et $k = 0$, $\mathrm{PD}(1)$ est la forme linéaire $[\eta] \mapsto \int \eta$, et $\mathrm{PD}_{\mathbb R^n}$ est un isomorphisme de $H^0(\mathbb R^n) = \mathbb R$ sur le dual de $H^n_c(\mathbb R^n) \cong \mathbb R$ ({{pc-fibre|Poincaré à support compact}}, (iv)). C'est le premier cas de la dualité de Poincaré, qui affirme que $\mathrm{PD}_U$ est toujours un isomorphisme.
      - |
        L'erreur à éviter est d'accoupler deux formes quelconques : $\int_U \omega \wedge \eta$ n'a de sens que si l'une des deux est à support compact. Sur $\mathbb R$, $\int_{\mathbb R} 1 \cdot dx$ n'est pas définie ; c'est pourquoi la dualité met face à face $H^*$ et $H^*_c$, et non $H^*$ et lui-même.

  - id: pc-cinq
    etiquette: Lemme des cinq
    nature: lemme
    titre: Dimension finie, dualité et lemme des cinq
    enonce: |
      (i) Si $A \xrightarrow{f} B \xrightarrow{g} C$ est une suite exacte d'espaces vectoriels réels, avec $A$ et $C$ de dimension finie, $B$ est de dimension finie.

      (ii) Si $A \xrightarrow{f} B \xrightarrow{g} C$ est exacte et $C$ de dimension finie, la suite des duaux $C^* \xrightarrow{g^\top} B^* \xrightarrow{f^\top} A^*$, où $g^\top(\lambda) = \lambda \circ g$, est exacte en $B^*$.

      (iii) *Lemme des cinq.* Soit deux suites exactes $A_1 \to A_2 \to A_3 \to A_4 \to A_5$ et $B_1 \to B_2 \to B_3 \to B_4 \to B_5$ et des applications linéaires $\varphi_l : A_l \to B_l$, telles que chaque carré commute ou anticommute. Si $\varphi_1$, $\varphi_2$, $\varphi_4$ et $\varphi_5$ sont des isomorphismes, $\varphi_3$ en est un.
    preuve: |
      (i) $\operatorname{Im} g$, sous-espace de $C$, a une base finie ({{v-dimension|Dimension}}, (iii)) ; on en prend des antécédents $b_1, \dots, b_r$ par $g$, en nombre fini. Si $b \in B$, $g(b) = \sum_l \lambda_l g(b_l)$, et $b - \sum_l \lambda_lb_l \in \operatorname{Ker} g = \operatorname{Im} f$. Les $b_l$ et les images par $f$ d'une base finie de $A$ engendrent donc $B$.

      (ii) $f^\top g^\top = (g \circ f)^\top = 0$. Si $\lambda \circ f = 0$, $\lambda$ est nulle sur $\operatorname{Ker} g = \operatorname{Im} f$, et la formule $\mu(g(b)) = \lambda(b)$ définit une forme linéaire $\mu$ sur $\operatorname{Im} g$. Une base de $\operatorname{Im} g$ se complète en une base de $C$ par des vecteurs d'une base de $C$ ({{v-dimension|Dimension}}, (iii)) ; on prolonge $\mu$ par $0$ sur ces vecteurs, et $\lambda = \mu \circ g = g^\top(\mu)$. Aucun choix : tout est fini.

      (iii) *Signes.* Remplacer $\varphi_l$ par $-\varphi_l$ ne change pas sa bijectivité ; en changeant ainsi le signe de $\varphi_2$, puis de $\varphi_3$, et ainsi de suite, selon que le carré précédent anticommute, on se ramène à des carrés commutatifs. Notons $f_l : A_l \to A_{l+1}$ et $g_l : B_l \to B_{l+1}$.

      *Injectivité.* Si $\varphi_3(x) = 0$, alors $\varphi_4f_3(x) = g_3\varphi_3(x) = 0$, donc $f_3(x) = 0$, et $x = f_2(y)$. Puis $g_2\varphi_2(y) = 0$, donc $\varphi_2(y) = g_1(z')$, et $z' = \varphi_1(z)$. Alors $\varphi_2(y - f_1(z)) = 0$, donc $y = f_1(z)$ et $x = f_2f_1(z) = 0$.

      *Surjectivité.* Soit $x' \in B_3$. On a $g_3(x') = \varphi_4(y)$, et $\varphi_5f_4(y) = g_4g_3(x') = 0$, donc $f_4(y) = 0$ et $y = f_3(x)$. Alors $g_3(x' - \varphi_3(x)) = 0$, donc $x' - \varphi_3(x) = g_2(z')$, avec $z' = \varphi_2(z)$, et $x' = \varphi_3(x + f_2(z))$.
    remarques:
      - |
        Le point (ii), sans hypothèse de dimension, n'est pas démontrable sans l'axiome du choix, et il peut être faux dans $\mathsf{ZF}$ : il revient à prolonger une forme linéaire d'un sous-espace à tout l'espace, ce qui, en dimension infinie, demande une base ou un supplémentaire ({{v-bases-existence|Existence de bases}}, ⋆). Le chapitre l'emploie seulement en dimension finie, et passe à la dimension infinie par une limite, au nœud {{pc-limite|Passage à la limite}}.

  - id: pc-finie
    etiquette: Dualité, cas fini
    nature: théorème
    titre: Dualité de Poincaré pour les réunions finies de pavés ouverts
    texte: |
      Les pavés ouverts sont ceux du nœud {{pc-fibre|Poincaré à support compact}}, (iv), bornés ou non ; l'intersection de deux pavés ouverts en est un, ou elle est vide, puisque l'intersection de deux intervalles ouverts est un intervalle ouvert ou vide.
    enonce: |
      (i) Soit $W$ une réunion finie de pavés ouverts de $\lex{n-uplet}{\mathbb R^n}$. Pour tout $k$, $\lex{cohomologie-de-rham}{H^k}(W)$ et $H^k_c(W)$ sont de dimension finie, et
      $$\mathrm{PD}_W : H^k(W) \to \big(H^{n-k}_c(W)\big)^*$$
      est un isomorphisme. Aucun choix n'intervient.

      (ii) Pour $n \geqslant 2$, $H^k_c(\mathbb R^n \setminus \{0\})$ est de dimension $1$ pour $k = 1$ et $k = n$, et nulle sinon.
    preuve: |
      (i) Par récurrence sur le nombre $m$ de pavés, l'énoncé portant sur tous les degrés à la fois. Pour $m = 0$, $W$ est vide et tous les espaces sont nuls.

      *Un pavé.* Un pavé ouvert $P$ est convexe, donc étoilé par rapport à chacun de ses points : $H^0(P) = \mathbb R$, formé des constantes, et $H^k(P) = 0$ pour $k \geqslant 1$ ({{gd-de-rham|Cohomologie de de Rham}}, (ii) et (iv), après translation). Par {{pc-fibre|Poincaré à support compact}}, (iv), $H^n_c(P) \cong \mathbb R$ par l'intégrale, et $H^j_c(P) = 0$ pour $j \neq n$. En degré $0$, $\mathrm{PD}_P(c)$ est $[\eta] \mapsto c\int_P \eta$, et $c \mapsto \mathrm{PD}_P(c)$ est bijective, puisque l'intégrale est un isomorphisme de $H^n_c(P)$ sur $\mathbb R$. Dans les autres degrés, les deux membres sont nuls.

      *Récurrence.* Soit $W = W' \cup P$, où $W'$ est réunion de $m - 1$ pavés $P_1, \dots, P_{m-1}$ et $P$ un pavé. Alors $W' \cap P = \bigcup_l (P_l \cap P)$ est réunion d'au plus $m - 1$ pavés, et l'énoncé vaut pour $W'$, $P$ et $W' \cap P$.

      Les suites de Mayer-Vietoris ({{dc-mayer-vietoris|Mayer-Vietoris}} et {{pc-mayer-vietoris|Mayer-Vietoris à support compact}}) contiennent les segments exacts $H^{k-1}(W' \cap P) \to H^k(W) \to H^k(W') \oplus H^k(P)$ et $H^k_c(W') \oplus H^k_c(P) \to H^k_c(W) \to H^{k+1}_c(W' \cap P)$ : par {{pc-cinq|Lemme des cinq}}, (i), $H^k(W)$ et $H^k_c(W)$ sont de dimension finie.

      *L'échelle.* Écrivons $U = W'$, $V = P$, $X = W$ et $j = n - k$. La ligne du haut est le segment exact
      $$\begin{aligned} &H^{k-1}(U) \oplus H^{k-1}(V) \to H^{k-1}(U \cap V) \\ &\to H^k(X) \to H^k(U) \oplus H^k(V) \\ &\to H^k(U \cap V). \end{aligned}$$
      La ligne du bas est formée des duaux du segment exact
      $$\begin{aligned} &H^j_c(U \cap V) \to H^j_c(U) \oplus H^j_c(V) \\ &\to H^j_c(X) \to H^{j+1}_c(U \cap V) \\ &\to H^{j+1}_c(U) \oplus H^{j+1}_c(V), \end{aligned}$$
      lus en sens inverse, avec les transposées des applications. Tous ces espaces sont de dimension finie, et {{pc-cinq|Lemme des cinq}}, (ii), appliqué en chacun des trois termes intérieurs, rend la ligne du bas exacte.

      Les flèches verticales sont les $\mathrm{PD}$, celle d'une somme directe étant la somme directe des $\mathrm{PD}$. Par {{pc-accouplement|Accouplement de Poincaré}}, (iii), chaque carré commute ou anticommute. Les quatre flèches extérieures sont des isomorphismes par hypothèse de récurrence, et le lemme des cinq ({{pc-cinq|Lemme des cinq}}, (iii)) conclut pour $\mathrm{PD}_X$ en degré $k$.

      (ii) $\mathbb R^n \setminus \{0\}$ est la réunion des $2n$ demi-espaces ouverts $\{\pm x_i > 0\}$, qui sont des pavés ouverts. Par (i), $\dim H^k_c = \dim H^{n-k}$, et le nœud {{dc-epointe|ℝⁿ privé de l'origine}}, (ii), conclut : $H^{n-k}$ est de dimension $1$ pour $n - k = 0$ et $n - k = n - 1$.
    remarques:
      - |
        Un générateur de $H^1_c(\mathbb R^n \setminus \{0\})$, pour $n \geqslant 3$, est explicite. Soit, avec la fonction $\theta$ du nœud {{dr-plateau|Fonctions plateau}},
        $$\rho(r) = \frac{\theta(2 - r)}{\theta(2 - r) + \theta(r - 1)},$$
        fonction de classe $C^\infty$ et décroissante sur $]0, +\infty[$, égale à $1$ sur $]0, 1]$ et à $0$ sur $[2, +\infty[$, et $f(x) = \rho(|x|)$. La forme $df$ est à support compact dans la couronne $1 \leqslant |x| \leqslant 2$, et fermée. Si l'on avait $df = dg$ avec $g$ à support compact, $f - g$ serait localement constante, donc constante sur $\mathbb R^n \setminus \{0\}$, dont le $H^0$ est de dimension $1$ ({{dc-epointe|ℝⁿ privé de l'origine}}), nulle loin de l'origine, donc $f = g$ ; or $f = 1$ près de $0$, et son support n'est pas compact dans $\mathbb R^n \setminus \{0\}$. La classe de $df$ n'est donc pas nulle, alors que $H^1(\mathbb R^n \setminus \{0\}) = 0$ : les deux cohomologies diffèrent, et c'est la dualité qui les relie.
      - |
        La récurrence repose sur la stabilité de la famille par intersection : l'intersection de deux pavés est un pavé, ce qui n'est pas vrai, par exemple, pour les boules euclidiennes ou les étoilés. C'est la même raison qui fait choisir des cubes pour la norme $\|\cdot\|_\infty$ dans tout ce graphe.

  - id: pc-weil-fini
    etiquette: Weil pour un nombre fini de cubes
    nature: proposition
    titre: L'isomorphisme de Weil pour une sous-famille finie de cubes
    texte: |
      Soit $U$ un ouvert non vide de $\lex{n-uplet}{\mathbb R^n}$, $(B_i)_{i \in I}$ ses cubes ({{dr-recouvrement|Recouvrement par des cubes}}), $N$ le nerf et $K$ le complexe double du nœud {{dt-cech-de-rham|Čech-de Rham}}. Pour une partie finie $J$ de $I$, on note $W_J = \bigcup_{i \in J} B_i$, $N(J)$ l'ensemble des suites de $N$ dont tous les termes sont dans $J$, $\check C(J)$ le complexe des fonctions réelles sur $N(J)$, et $K(J)$ le complexe double formé des $\prod_{\sigma \in N(J)_p} \Omega^q(B_\sigma)$, avec les mêmes différentielles et les mêmes augmentations $r_J$ et $e_J$ qu'au nœud {{dt-cech-de-rham|Čech-de Rham}}, $\Omega(U)$ étant remplacé par $\Omega(W_J)$.
    enonce: |
      (i) Pour des ouverts $A_1, \dots, A_m$ de réunion $W$, il existe des fonctions $\chi_1, \dots, \chi_m$ de classe $C^\infty$ sur $W$, positives, de somme $1$, chaque $\chi_l$ étant nulle près de $W \setminus A_l$ ; elles sont construites sans choix.

      (ii) Les rangées et les colonnes de $K(J)$ sont exactes, et $\Theta_J = e_{J*}^{-1}r_{J*}$ est un isomorphisme de $\lex{cohomologie-de-rham}{H^k}(W_J)$ sur $H^k(\check C(J))$. On note $\Theta$ l'isomorphisme analogue pour $U$ ({{dt-cech-de-rham|Čech-de Rham}}, (iv)).

      (iii) *Naturalité.* Pour $J \subset J'$, finies, la restriction des formes de $W_{J'}$ à $W_J$ et celle des cochaînes de $N(J')$ à $N(J)$ correspondent par $\Theta_{J'}$ et $\Theta_J$ ; de même entre $U$ et $W_J$, par $\Theta$ et $\Theta_J$.
    preuve: |
      (i) Si $W$ est vide, il n'y a rien à construire. Si l'un des $A_l$ est $\mathbb R^n$, on prend $\chi_l = 1$ pour le plus petit tel $l$, et les autres nulles. Sinon, on reprend la preuve du nœud {{dc-partition|Partition pour deux ouverts}}, (i), avec la jauge $\delta' = \min(1, \max_l d_{A_l})$. Le maximum d'un nombre fini de fonctions $1$-lipschitziennes l'est encore, par récurrence sur leur nombre, puisque $|\max(a, b) - \max(a', b')| \leqslant \max(|a - a'|, |b - b'|)$ ; la jauge a donc, pour l'ouvert $W$, les propriétés (i) du nœud {{dr-recouvrement|Recouvrement par des cubes}}, par le même calcul ; on attribue chaque cube de centre $p$ au plus petit $l$ tel que $d_{A_l}(p) = \max_{l'} d_{A_{l'}}(p)$, ce qui place le cube fermé dans $A_l$, et $\chi_l$ est la somme des fonctions de la partition de l'unité des cubes attribués à $l$. La nullité près de $W \setminus A_l$ se démontre comme dans ce nœud.

      (ii) *Rangées.* On applique (i) aux cubes $B_j$, $j \in J$, de réunion $W_J$. La forme $\chi_j\,\omega_{j\tau}$, définie sur $B_j \cap B_\tau$, se prolonge par $0$ en une forme de classe $C^\infty$ sur $B_\tau$, puisque $\chi_j$ est nulle près de $B_\tau \setminus B_j$, comme au nœud {{dc-partition|Partition pour deux ouverts}}, (ii). L'opérateur $h$ du nœud {{dt-cech-de-rham|Čech-de Rham}}, (ii), avec ces fonctions et la somme sur $j \in J$, est donc défini, et le calcul des identités, qui n'utilise que $\sum_j \chi_j = 1$, est le même.

      *Colonnes.* La démonstration du point (iii) du même nœud ne fait intervenir que les pavés $B_\sigma$, et elle s'applique telle quelle. Le lemme du complexe double ({{dt-complexe-double|Complexe double}}, (iv)) conclut.

      (iii) Pour $J \subset J'$, $N(J) \subset N(J')$, et l'application qui oublie les composantes d'indice hors de $N(J)$ est un morphisme de complexes doubles $K(J') \to K(J)$, sans restriction des formes, les pavés $B_\sigma$ étant les mêmes. Il commute à $\delta$ et à $d$, et il envoie $r_{J'}(\omega)$ sur $r_J(\omega|_{W_J})$ ; de même pour $e$. En cohomologie, les carrés formés par $r_*$, $e_*$ et ces morphismes commutent, et donc aussi celui des $\Theta$. Le même argument vaut de $K$ à $K(J)$.
    remarques:
      - |
        Le point (iii) est immédiat parce que les augmentations et les différentielles ne dépendent pas de la partition de l'unité : celle-ci ne sert qu'à démontrer l'exactitude des rangées. Deux partitions différentes, pour $U$ et pour $W_J$, donnent donc des isomorphismes compatibles.

  - id: pc-limite
    etiquette: Passage à la limite
    nature: proposition
    titre: Cohomologie d'un ouvert et de ses réunions finies de cubes
    texte: |
      Soit $U$ un ouvert non vide de $\lex{n-uplet}{\mathbb R^n}$ et $(B_i)_{i \in I}$ ses cubes. L'ordre du nœud {{dr-recouvrement|Recouvrement par des cubes}}, (v), attache à chaque $i$ un entier, son **rang**, et deux indices distincts ont des rangs distincts. On note $I_m$ l'ensemble des indices de rang $< m$, fini, $U_m = W_{I_m}$ et $N^{(m)} = N(I_m)$, avec les notations du nœud {{pc-weil-fini|Weil pour un nombre fini de cubes}}.

      Une **famille compatible** de classes est une suite $(c_m)$, $c_m \in \lex{cohomologie-de-rham}{H^k}(U_m)$, telle que la restriction de $c_{m+1}$ à $U_m$ soit $c_m$.

      Dans un espace vectoriel réel $E$, un **sous-espace affine** est une partie de la forme $a_0 + F = \{a_0 + f : f \in F\}$, où $a_0 \in E$ et $F$ est un sous-espace vectoriel, qu'elle détermine ; sa **dimension** est celle de $F$. Pour une application linéaire $u$, $u(a_0 + F) = u(a_0) + u(F)$ est un sous-espace affine, et $(a_0 + F) \cap u^{-1}(y)$, s'il contient un point $a_1$, est égal à $a_1 + (F \cap \operatorname{Ker} u)$.
    enonce: |
      (i) Les $U_m$ forment une suite croissante d'ouverts de réunion $U$, et tout compact de $U$ est contenu dans l'un d'eux.

      (ii) *Mittag-Leffler.* Soit, pour chaque $m$, un sous-espace affine non vide $A_m$ de $\check C^p(N^{(m)})$, tel que la restriction de $A_{m+1}$ à $N^{(m)}$ soit contenue dans $A_m$. Il existe une cochaîne $a \in \check C^p(N)$ dont la restriction à chaque $N^{(m)}$ appartient à $A_m$ ; elle est désignée sans choix.

      (iii) Une forme fermée $\omega$ sur $U$ dont la restriction à chaque $U_m$ est exacte est exacte. Toute famille compatible de classes provient d'une forme fermée $\omega$ sur $U$ : $c_m = [\omega|_{U_m}]$ pour tout $m$.
    preuve: |
      (i) $I_m \subset I_{m+1}$, et tout indice a un rang. Un compact $C$ de $U$ est recouvert par les cubes ouverts ({{dr-recouvrement|Recouvrement par des cubes}}, (ii)), donc par un nombre fini d'entre eux ({{t-compact|Compacité}}), et il est contenu dans $U_m$ dès que $m$ dépasse leurs rangs.

      (ii) *Le point de norme minimale.* Les espaces $\check C^p(N^{(m)})$ sont de dimension finie : la partie de degré $p$ de $N^{(m)}$, formée de suites de $p + 1$ termes dans $I_m$, a au plus $|I_m|^{p+1}$ éléments. Ils sont munis de la norme $|a| = \big(\sum_\sigma a(\sigma)^2\big)^{1/2}$. Un sous-espace affine non vide $A = a_0 + F$ a un unique point de norme minimale. Le sous-espace $F$ est le noyau d'une application linéaire, par complétion d'une base ({{v-dimension|Dimension}}, (iii)), continue comme toute application linéaire de $\mathbb R^{N^{(m)}}$, donc il est fermé ; $A \cap \{|a| \leqslant |a_0|\}$ est fermé et borné, donc compact ({{me-rn|L'espace ℝⁿ}}, (iii)), et la norme y atteint son minimum, son image étant un compact de $\mathbb R$ ({{t-compact-prop|Parties compactes}}, (iii)). Si $a$ et $a'$ réalisent le minimum $\mu$, le milieu est dans $A$ et
      $$\Big|\frac{a + a'}2\Big|^2 = \mu^2 - \frac{|a - a'|^2}4,$$
      d'où $a = a'$.

      *Stabilisation.* Fixons $m$ et notons $S_{m'}$, pour $m' \geqslant m$, la restriction de $A_{m'}$ à $N^{(m)}$, de sorte que $S_m = A_m$ : c'est un sous-espace affine non vide, et $S_{m'+1} \subset S_{m'}$. Deux sous-espaces affines emboîtés de même dimension sont égaux ({{v-dimension|Dimension}}, (iii)) ; les dimensions, entières et décroissantes, finissent par être constantes, et la suite $(S_{m'})$ aussi. Soit $A^\infty_m$ sa valeur finale. La restriction de $A^\infty_{m+1}$ à $N^{(m)}$ est $A^\infty_m$ : il suffit de prendre $m'$ assez grand pour que les deux suites soient stationnaires.

      *Récurrence.* $I_0$ est vide, donc $\check C^p(N^{(0)}) = \{0\}$, et l'on pose $a_0 = 0$. Soit $a_m$ le point de norme minimale de l'ensemble des $b \in A^\infty_m$ dont la restriction à $N^{(m-1)}$ est $a_{m-1}$, sous-espace affine non vide par ce qui précède, puisque $a_{m-1} \in A^\infty_{m-1}$ est la restriction d'un élément de $A^\infty_m$. Les $a_m$ se prolongent l'un l'autre ; comme toute suite de $N$ n'a qu'un nombre fini de termes, elle est dans l'un des $N^{(m)}$, et la cochaîne $a$ égale à $a_m$ sur $N^{(m)}$ est bien définie. Sa restriction à $N^{(m)}$ est $a_m \in A^\infty_m \subset S_m = A_m$ : elle convient.

      (iii) Par {{pc-weil-fini|Weil pour un nombre fini de cubes}}, (ii) et (iii), les isomorphismes $\Theta$ et $\Theta_{I_m}$ transforment les restrictions de formes en restrictions de cochaînes de Čech. Il suffit donc de démontrer les deux énoncés pour $\check C(N)$ et les $\check C(N^{(m)})$.

      *Injectivité.* Soit $z$ un cocycle de degré $k$ sur $N$ dont chaque restriction à $N^{(m)}$ est un cobord. Si $k = 0$, ces restrictions sont nulles, et $z = 0$. Sinon, l'ensemble $A_m$ des $b \in \check C^{k-1}(N^{(m)})$ tels que $\delta b$ soit la restriction de $z$ est un sous-espace affine non vide, et la restriction envoie $A_{m+1}$ dans $A_m$, puisqu'elle commute à $\delta$. Par (ii), il existe $b$ dont les restrictions sont dans les $A_m$ ; alors $\delta b$ et $z$ ont mêmes restrictions à tous les $N^{(m)}$, et $z = \delta b$.

      *Surjectivité.* Soit $(c_m)$ une famille compatible de classes de Čech, et $A_m$ l'ensemble des cocycles de $N^{(m)}$ de classe $c_m$, sous-espace affine non vide. La restriction d'un cocycle de classe $c_{m+1}$ est de classe $c_m$. Par (ii), on obtient une cochaîne $z$ dont chaque restriction est un cocycle de classe $c_m$ ; $\delta z$ a des restrictions nulles, donc est nul.
    remarques:
      - |
        L'argument usuel choisit, pour chaque $m$, une primitive ou un représentant, puis les corrige l'un après l'autre : c'est une suite de choix dépendants. Ici chaque choix est remplacé par le point de norme minimale d'un sous-espace affine de dimension finie, qui est unique. Le passage par les cochaînes de Čech est ce qui rend les espaces de dimension finie, alors que les espaces de formes sur $U_m$ ne le sont pas.
      - |
        La dimension finie est essentielle à la stabilisation, la condition qui porte le nom de Mittag-Leffler. Dans l'espace des suites réelles à support fini, les sous-espaces affines $A_m = \{x : x_j = 1 \text{ pour } j < m\}$ sont non vides et décroissants, et leur intersection est vide, puisque aucune suite à support fini ne vaut $1$ partout : sans dimension finie, le point (ii) tombe.

  - id: pc-dualite
    etiquette: Dualité de Poincaré
    nature: théorème
    titre: Dualité de Poincaré pour les ouverts de ℝⁿ
    enonce: |
      Pour tout ouvert $U$ de $\lex{n-uplet}{\mathbb R^n}$ et tout $k$, l'accouplement $\int_U \omega \wedge \eta$ induit un isomorphisme
      $$\mathrm{PD}_U : \lex{cohomologie-de-rham}{H^k}(U) \to \big(H^{n-k}_c(U)\big)^*.$$
      C'est la [[dualite-poincare|dualité de Poincaré]]. Autrement dit, une forme fermée $\omega$ de degré $k$ est exacte si et seulement si $\int_U \omega \wedge \eta = 0$ pour toute forme fermée à support compact $\eta$ de degré $n - k$, et toute forme linéaire sur $H^{n-k}_c(U)$ est de la forme $[\eta] \mapsto \int_U \omega \wedge \eta$. Aucun choix n'intervient.
    preuve: |
      Si $U$ est vide, tout est nul. Sinon, reprenons les ouverts $U_m$ du nœud {{pc-limite|Passage à la limite}} ; chacun est une réunion finie de pavés ouverts.

      *Le dual de $H^{n-k}_c(U)$.* Associons à $\lambda \in \big(H^{n-k}_c(U)\big)^*$ la suite des formes $\lambda_m = \lambda \circ j_*$ sur $H^{n-k}_c(U_m)$. Elle est compatible : $\lambda_{m+1} \circ j_* = \lambda_m$, par transitivité des extensions ({{pc-support|Support compact}}, (i)).

      Cette correspondance est bijective. Toute forme à support compact $\eta$ sur $U$ a son support dans un $U_m$ ({{pc-limite|Passage à la limite}}, (i)), et $[\eta] = j_*[\eta|_{U_m}]$ ; donc $\lambda$ est déterminée par les $\lambda_m$. Réciproquement, une suite compatible $(\lambda_m)$ définit $\lambda[\eta] = \lambda_m[\eta|_{U_m}]$ pour $m$ assez grand : la valeur ne dépend pas de $m$, par compatibilité, ni du représentant, car si $\eta' - \eta = d\beta$, $\beta$ à support compact dans un $U_{m'}$, il suffit de prendre $m \geqslant m'$.

      *Les dualités finies.* Par {{pc-finie|Dualité, cas fini}}, chaque $\mathrm{PD}_{U_m}$ est un isomorphisme, et, par {{pc-accouplement|Accouplement de Poincaré}}, (ii), $\mathrm{PD}_{U_m}(c|_{U_m}) = \mathrm{PD}_{U_{m+1}}(c) \circ j_*$ pour $c \in H^k(U_{m+1})$. Les familles compatibles de classes $(c_m)$ correspondent donc bijectivement aux suites compatibles de formes linéaires $(\lambda_m)$, par $\lambda_m = \mathrm{PD}_{U_m}(c_m)$.

      *La restriction.* Par {{pc-limite|Passage à la limite}}, (iii), l'application $c \mapsto (c|_{U_m})_m$ est une bijection de $H^k(U)$ sur les familles compatibles de classes.

      *Conclusion.* La composée de ces trois bijections envoie $c \in H^k(U)$ sur la forme $\lambda$ telle que $\lambda_m = \mathrm{PD}_{U_m}(c|_{U_m}) = \mathrm{PD}_U(c) \circ j_*$, par {{pc-accouplement|Accouplement de Poincaré}}, (ii) : c'est $\mathrm{PD}_U(c)$. Donc $\mathrm{PD}_U$ est bijective.
    remarques:
      - |
        Pour $U = \mathbb R^n \setminus \{0\}$, $n \geqslant 2$, la forme angle solide $\sigma_n$ engendre $H^{n-1}(U)$ ({{dc-angle-solide|Forme angle solide}}), et la dualité dit qu'il existe une forme fermée à support compact $\eta$, de degré $1$, telle que $\int_U \sigma_n \wedge \eta \neq 0$. On peut prendre $\eta = df$, avec $f = \rho(|x|)$ comme au nœud {{pc-finie|Dualité, cas fini}}. Un calcul direct donne
        $$\sigma_n \wedge df = (-1)^{n-1}\,\frac{\rho'(|x|)}{|x|^{n-1}}\,dx_1 \wedge \cdots \wedge dx_n,$$
        de signe constant puisque $\rho$ décroît, et non identiquement nulle : l'intégrale n'est pas nulle.
      - |
        L'énoncé symétrique, $H^k_c(U) \cong \big(H^{n-k}(U)\big)^*$, n'est pas démontré ici, et il est faux en général avec l'axiome du choix. Pour $U$ réunion d'une suite d'intervalles ouverts deux à deux disjoints de $\mathbb R$, $H^1_c(U)$ est la somme directe d'une suite de droites, et $H^0(U)$ leur produit, $\mathbb R^{\mathbb N}$ ; le dual de $H^1_c(U)$ est bien $\mathbb R^{\mathbb N}$, mais le dual de $\mathbb R^{\mathbb N}$ contient, si l'on dispose d'une base de $\mathbb R^{\mathbb N}$ qui prolonge la base canonique des suites à support fini ({{v-bases-existence|Existence de bases}}, ⋆), des formes linéaires nulles sur toutes les suites à support fini sans être nulles, qui ne proviennent d'aucun élément de $H^1_c(U)$.
      - |
        Henri Poincaré a énoncé la dualité, pour les nombres de Betti des variétés fermées orientables, en 1893, et a tenté de la démontrer dans « Analysis situs » (*Journal de l'École polytechnique* (2) 1, 1895, p. 1-123). La démonstration, fondée sur l'intersection des cycles, était lacunaire ; Poul Heegaard en donna un contre-exemple dans sa thèse de Copenhague (1898), et Poincaré la reprit, par des triangulations duales, dans les compléments à l'*Analysis situs*.

        Pour une variété compacte orientée $M$ de dimension $n$, $H^*_c(M) = H^*(M)$ et la dualité donne $\dim H^k(M) = \dim H^{n-k}(M)$ ; elle demande l'intégrale sur une variété et des recouvrements par des cartes dont les intersections sont convexes, qui ne sont pas construits dans l'édifice.

