# Niveau 2 : structure interne du chapitre « Exponentielle et logarithme ».
# Le logarithme est défini par une intégrale de Riemann, l'exponentielle comme sa réciproque ;
# ni série entière, ni équation différentielle, ni nombre complexe ne sont en amont.
# Aucune démonstration n'emploie l'axiome du choix.

graphe: ar-exp
titre: Exponentielle et logarithme
conteneur: ar-exp

entrees:
  ar-tfa: [ex-logarithme]
  ar-deriv: [ex-serie]

noeuds:
  - id: ex-logarithme
    etiquette: Logarithme
    nature: proposition
    titre: Le logarithme, aire sous l'hyperbole
    texte: |
      La fonction $t \mapsto 1/t$ est dérivable sur $]0, +\infty[$, où son dénominateur ne s'annule pas ({{de-operations|Opérations}}, (iii)), donc continue ({{de-dl1|Développement à l'ordre 1}}), et intégrable sur tout segment contenu dans cet intervalle ({{ri-continues|Fonctions continues}}). Pour $x > 0$, on appelle [[logarithme]] de $x$ le réel
      $$\ln x = \int_1^x \frac{dt}{t},$$
      où l'intégrale est orientée ({{ri-proprietes|Propriétés de l'intégrale}}, (v)) : si $0 < x < 1$, $\ln x = -\int_x^1 \frac{dt}{t}$.

      Pour décrire $\ln$ aux bords de son domaine, on étend la notion de limite du nœud {{de-limite|Limite en un point}}. Pour une fonction $g$ définie sur une demi-droite $[A_0, +\infty[$ de $\lex{ensemble-reels}{\mathbb R}$, on dit que $g(x)$ **tend vers $\ell$ quand $x$ tend vers $+\infty$** si, pour tout $\varepsilon > 0$, il existe $B \geqslant A_0$ tel que $|g(x) - \ell| < \varepsilon$ pour tout $x \geqslant B$ ; et que $g(x)$ **tend vers $+\infty$ quand $x$ tend vers $+\infty$** si, pour tout réel $A$, il existe $B \geqslant A_0$ tel que $g(x) > A$ pour tout $x \geqslant B$. La limite $\ell$ est unique : deux limites $\ell$ et $\ell'$ vérifieraient $|\ell - \ell'| < 2\varepsilon$ pour tout $\varepsilon > 0$, en prenant $x$ au-delà des deux seuils.

      On définit de même la limite quand $x$ tend vers $-\infty$, pour $g$ définie sur une demi-droite $]{-\infty}, A_0]$, en remplaçant $x \geqslant B$ par $x \leqslant B$ ; la limite $-\infty$, en remplaçant $g(x) > A$ par $g(x) < A$ ; et, pour $g$ définie sur une partie $D$ de $\mathbb R$ et un réel $a$ adhérent à $D$, la limite $\pm\infty$ quand $x$ tend vers $a$, en remplaçant « $x \geqslant B$ » par « $x \in D$ et $|x - a| < \delta$ », avec $\delta > 0$. On écrit $g(x) \to \ell$, ou $\lim_{x \to +\infty} g(x) = \ell$, et de même dans les autres cas.
    enonce: |
      (i) La fonction $\ln$ est [[derivable]] sur $]0, +\infty[$, de dérivée $x \mapsto 1/x$ ; elle est continue et [[application-croissante|strictement croissante]], et $\ln 1 = 0$.

      (ii) Pour tous $x, y > 0$, on a $\ln(xy) = \ln x + \ln y$ et $\ln(1/x) = -\ln x$ ; pour tout $n \in \lex{ensemble-entiers-naturels}{\mathbb N}$, $\ln(x^n) = n \ln x$, où $x^n$ est la [[puissance|puissance entière]] de $x$.

      (iii) $\ln x \to +\infty$ quand $x \to +\infty$, et $\ln x \to -\infty$ quand $x \to 0$, $x > 0$.

      (iv) La fonction $\ln$ est une [[bijection]] de $]0, +\infty[$ sur $\mathbb R$.
    preuve: |
      (i) Le théorème fondamental ({{ar-tfa|Théorème fondamental}}), appliqué sur l'intervalle $]0, +\infty[$ à la fonction continue $t \mapsto 1/t$ et au point $a = 1$, montre que $\ln$ est dérivable, de dérivée $1/x$. Elle est donc continue ({{de-dl1|Développement à l'ordre 1}}). Sa dérivée est strictement positive, et $\ln$ est strictement croissante ({{de-monotonie|Signe de la dérivée}}, (iii)). Enfin $\ln 1 = \int_1^1 \frac{dt}{t} = 0$ par convention.

      (ii) Fixons $y > 0$, et posons $\varphi(x) = \ln(xy) - \ln x$ pour $x > 0$. La fonction $x \mapsto xy$ est dérivable de dérivée $y$, et la dérivée d'une composée ({{de-composee|Dérivée d'une composée}}) donne
      $$\varphi'(x) = y \cdot \frac{1}{xy} - \frac1x = 0.$$
      Sur l'intervalle $]0, +\infty[$, $\varphi$ est donc constante ({{de-monotonie|Signe de la dérivée}}, (ii)), égale à $\varphi(1) = \ln y$ : c'est l'égalité $\ln(xy) = \ln x + \ln y$.

      Avec $y = 1/x$, elle donne $\ln x + \ln(1/x) = \ln 1 = 0$. Enfin $\ln(x^0) = \ln 1 = 0$, et si $\ln(x^n) = n\ln x$, alors $\ln(x^{n+1}) = \ln(x^n x) = n \ln x + \ln x$, puisque $x^{n+1} = x^n x$ ({{n-sommes|Sommes, produits et puissances}}).

      (iii) On a $\ln 2 > \ln 1 = 0$ par (i). Soit $A$ un réel. Par la propriété d'Archimède ({{ar-archimede|Archimède}}), il existe $n \in \mathbb N$ tel que $n \ln 2 > |A|$, donc $n \ln 2 > A$ et $n\ln 2 > -A$. Pour $x \geqslant 2^n$, la croissance et (ii) donnent $\ln x \geqslant \ln(2^n) = n \ln 2 > A$ : c'est la première limite.

      Pour $0 < x < 1/2^n$, on a $1/x > 2^n$, donc $\ln x = -\ln(1/x) < -n\ln 2 < -A$. Avec $\delta = 1/2^n$, c'est la seconde limite.

      (iv) La stricte croissance rend $\ln$ injective. Son image est un intervalle, par le théorème des valeurs intermédiaires ({{c-tvi|Valeurs intermédiaires}}). Pour tout réel $y$, (iii) fournit $x_1$ et $x_2$ tels que $\ln x_1 < y < \ln x_2$ ; l'image contient ces deux valeurs, donc $y$. Elle est donc égale à $\mathbb R$.
    remarques:
      - |
        L'égalité $\ln(xy) = \ln x + \ln y$ est une propriété d'invariance de l'aire sous l'hyperbole $t \mapsto 1/t$ : la dilatation $t \mapsto yt$ multiplie les largeurs par $y$ et divise les hauteurs par $y$, si bien que l'aire entre $1$ et $x$ est aussi celle entre $y$ et $xy$.

        ```schema ex-logarithme
        Sous l'hyperbole $t \mapsto 1/t$, les trois bandes ont la même aire, $\ln 2 \approx 0{,}6931$ : celle de $\frac12$ à $1$ (verte), celle de $1$ à $2$ (rouge) et celle de $2$ à $4$ (bleue). La rouge vaut $\ln 2$, la bleue $\ln 4 - \ln 2 = \ln 2$, et la verte, comptée négativement par l'orientation, donne $\ln\frac12 = -\ln 2$.
        ```

        Ainsi, quand $x$ parcourt la progression géométrique $1, 2, 4, 8, \dots$, l'aire $\ln x$ parcourt la progression arithmétique $0, \ln 2, 2\ln 2, \dots$ : le logarithme croît sans borne, mais lentement, puisque $\ln 1000 \approx 6{,}91$.
      - |
        C'est exactement ce que Grégoire de Saint-Vincent établit en 1647 (*Opus geometricum quadraturae circuli et sectionum coni*, livre VI, proposition CIX) : quand les abscisses sont en progression géométrique, les aires sous l'hyperbole sont en progression arithmétique. Alphonse Antonio de Sarasa, qui travaillait à ses côtés à Gand, en tira en 1649 (*Solutio problematis a R. P. Marino Mersenne Minimo propositi*) que ces aires peuvent tenir lieu de logarithmes. Les logarithmes eux-mêmes étaient nés de tables numériques, celles de John Napier (*Mirifici logarithmorum canonis descriptio*, Édimbourg, 1614).
      - |
        L'erreur la plus répandue est d'écrire $\ln(x + y) = \ln x + \ln y$ : avec $x = y = 1$, on obtiendrait $\ln 2 = 0$. Le logarithme transforme les produits en sommes, pas les sommes. Il n'est d'ailleurs défini que sur $]0, +\infty[$, puisque l'intégrale de $1/t$ entre $1$ et un réel négatif traverserait $0$, où $1/t$ n'est pas définie, ni bornée au voisinage.
      - |
        Le point (iv) permet de définir, au nœud suivant, l'exponentielle comme réciproque de $\ln$. Les espaces $L^p$ ({{lp-puissances|Puissances réelles}}) et la théorie de de Rham ({{dr-exp|Une exponentielle réelle}}) rappellent les résultats de ce chapitre dont ils ont besoin, sans refaire la construction ; l'analyse complexe prolonge l'exponentielle à $\mathbb C$ par une série ({{cx-exponentielle|Exponentielle}}).

  - id: ex-exponentielle
    etiquette: Exponentielle
    nature: théorème
    titre: L'exponentielle, réciproque du logarithme
    texte: |
      Par le nœud {{ex-logarithme|Logarithme}}, (iv), le [[logarithme]] est une bijection de $]0, +\infty[$ sur $\lex{ensemble-reels}{\mathbb R}$. Sa bijection réciproque s'appelle l'[[exponentielle]] et se note $\exp : \mathbb R \to \,]0, +\infty[$. Ainsi $\exp(\ln x) = x$ pour $x > 0$, et $\ln(\exp y) = y$ pour tout réel $y$.

      On note $e = \exp 1$ l'unique réel strictement positif dont le logarithme vaut $1$ : c'est le [[nombre-e|nombre $e$]].
    enonce: |
      (i) $\exp$ est continue et [[application-croissante|strictement croissante]] sur $\mathbb R$, à valeurs strictement positives, avec $\exp 0 = 1$ et $\exp 1 = e$.

      (ii) $\exp$ est [[derivable]] sur $\mathbb R$ et $\exp' = \exp$. Elle est donc indéfiniment dérivable, et toutes ses [[derivee-successive|dérivées successives]] sont égales à $\exp$.

      (iii) Pour tous réels $a$ et $b$, et tout $n \in \lex{ensemble-entiers-naturels}{\mathbb N}$,
      $$\begin{aligned} \exp(a + b) &= \exp a \, \exp b, \\ \exp(-a) &= \frac{1}{\exp a}, \\ \exp(na) &= (\exp a)^n. \end{aligned}$$

      (iv) $\exp y \to +\infty$ quand $y \to +\infty$, et $\exp y \to 0$ quand $y \to -\infty$.

      (v) *Unicité.* Soit $I$ un [[intervalle]] contenant $0$, non réduit à un point, et $f : I \to \mathbb R$ dérivable telle que $f' = f$. Alors $f(x) = f(0)\exp x$ pour tout $x \in I$. En particulier, $\exp$ est la seule fonction dérivable sur $\mathbb R$, égale à sa dérivée, qui vaut $1$ en $0$.
    preuve: |
      (i) Le logarithme est continu et strictement croissant sur l'intervalle $]0, +\infty[$. Par le théorème de la bijection ({{c-bijection|Bijection continue}}), sa réciproque est continue et strictement croissante sur l'intervalle image $\mathbb R$. Ses valeurs sont dans $]0, +\infty[$ par construction, et $\exp 0 = 1$ puisque $\ln 1 = 0$.

      (ii) Soit $b$ réel et $a = \exp b$. Le logarithme est dérivable en $a$, de nombre dérivé $1/a \neq 0$. Le nœud {{de-reciproque|Dérivée d'une réciproque}}, (i), montre que $\exp$ est dérivable en $b$, et
      $$\exp'(b) = \frac{1}{\ln'(\exp b)} = \exp b.$$
      Ainsi $\exp' = \exp$ est elle-même dérivable, et par récurrence $\exp^{(k)} = \exp$ pour tout $k$.

      (iii) Par {{ex-logarithme|Logarithme}}, (ii),
      $$\begin{aligned} \ln(\exp a \exp b) &= \ln \exp a + \ln \exp b \\ &= a + b, \end{aligned}$$
      et l'on applique $\exp$ aux deux membres. Avec $b = -a$, on obtient $\exp a \exp(-a) = \exp 0 = 1$. Enfin $\exp(0 \cdot a) = 1 = (\exp a)^0$, et $\exp((n + 1)a) = \exp(na)\exp a$ donne la dernière égalité par récurrence.

      (iv) Soit $A$ un réel ; si $A \leqslant 0$, tout $y$ convient, puisque $\exp y > 0$. Si $A > 0$, pour $y > \ln A$, la stricte croissance donne $\exp y > \exp(\ln A) = A$. Soit $\varepsilon > 0$. Pour $y < \ln \varepsilon$, on a de même $0 < \exp y < \varepsilon$.

      (v) La fonction $g(x) = f(x)\exp(-x)$ est dérivable sur $I$, par la dérivée d'une composée ({{de-composee|Dérivée d'une composée}}), la dérivée de $x \mapsto \exp(-x)$ étant $-\exp(-x)$, et par celle d'un produit ({{de-operations|Opérations}}, (ii)) :
      $$g'(x) = \big(f'(x) - f(x)\big)\exp(-x) = 0.$$
      Sur l'intervalle $I$, $g$ est donc constante ({{de-monotonie|Signe de la dérivée}}, (ii)), égale à $g(0) = f(0)$. Par (iii), $f(x) = g(x)\exp x = f(0)\exp x$.
    remarques:
      - |
        La dérivée de $\exp$ se lit sur le graphe : celui de $\exp$ est le symétrique de celui de $\ln$ par rapport à la diagonale, et la symétrie échange les pentes $p$ et $1/p$.

        ```schema ex-exponentielle
        Les graphes de $\exp$ (rouge) et de $\ln$ (bleu) sont symétriques par rapport à la diagonale $y = x$. Au point $(1, e)$, la tangente au graphe de $\exp$ a pour pente $e \approx 2{,}718$ ; au point symétrique $(e, 1)$, la tangente au graphe de $\ln$ a pour pente $\frac1e \approx 0{,}368$, inverse de la première. C'est le calcul de la preuve de (ii).
        ```
      - |
        L'hypothèse que $I$ est un intervalle est indispensable dans (v), comme au nœud {{de-monotonie|Signe de la dérivée}}. Sur $D = \,]{-1}, 1[ \,\cup\, ]2, 3[$, la fonction égale à $\exp$ sur $]{-1}, 1[$ et à $2\exp$ sur $]2, 3[$ est dérivable sur chacun des deux intervalles, égale à sa dérivée sur chacun, et vaut $1$ en $0$, sans être égale à $\exp$.
      - |
        L'erreur la plus répandue est de confondre $\exp(a + b) = \exp a \exp b$ avec une additivité : $\exp(1 + 1) = e^2 \approx 7{,}39$, et non $2e \approx 5{,}44$. L'exponentielle transforme les sommes en produits, comme le logarithme transformait les produits en sommes.
      - |
        Au chapitre VII du tome I de l'*Introductio in analysin infinitorum* (1748), Euler désigne par la lettre $e$ la base des logarithmes naturels ou hyperboliques, c'est-à-dire le nombre dont le logarithme hyperbolique vaut $1$, et en donne la valeur $2{,}71828182845904523536028\ldots$ Le nœud {{ex-serie|Série de l'exponentielle}} donnera une méthode de calcul et l'encadrement $2{,}7182818 < e < 2{,}7182819$.

  - id: ex-puissances
    etiquette: Puissances réelles
    nature: proposition
    titre: Puissances d'exposant réel
    texte: |
      Soit $x > 0$ et $a$ un réel. On appelle [[puissance-reelle|puissance réelle]] d'exposant $a$ de $x$ le réel strictement positif
      $$x^a = \exp(a \ln x),$$
      où $\exp$ est l'[[exponentielle]] du nœud {{ex-exponentielle|Exponentielle}}. Pour $a > 0$, on pose de plus $0^a = 0$.

      La notation est celle de la [[puissance|puissance entière]] $x^n$, définie par $x^0 = 1$ et $x^{n+1} = x^n x$ ({{n-sommes|Sommes, produits et puissances}}) ; le point (ii) montre que les deux définitions coïncident quand l'exposant est un entier naturel, ce qui justifie l'emploi d'une même écriture.
    enonce: |
      Soit $x, y > 0$ et $a, b$ réels.

      (i) *Règles de calcul.* $\ln(x^a) = a\ln x$, et
      $$\begin{aligned} x^{a+b} &= x^a x^b, & (x^a)^b &= x^{ab}, \\ (xy)^a &= x^a y^a, & x^{-a} &= \frac{1}{x^a}, \end{aligned}$$
      avec $x^0 = 1$, $x^1 = x$ et $1^a = 1$.

      (ii) *Cohérence.* Pour $n \in \lex{ensemble-entiers-naturels}{\mathbb N}$, $\exp(n \ln x)$ est la puissance entière $x^n$, et $x^{-n} = 1/x^n$. Pour $p$ entier relatif et $q \geqslant 1$ entier, $x^{p/q}$ est l'unique réel $z > 0$ tel que $z^q = x^p$. En particulier $e^a = \exp a$ pour tout réel $a$, où $e = \exp 1$.

      (iii) *Dérivées.* La fonction $x \mapsto x^a$ est [[derivable]] sur $]0, +\infty[$, de dérivée $a\,x^{a-1}$ ; la fonction $a \mapsto x^a$ est dérivable sur $\mathbb R$, de dérivée $(\ln x)\,x^a$.

      (iv) *Monotonie et limites.* Pour $a > 0$, la fonction $x \mapsto x^a$ est continue et [[application-croissante|strictement croissante]] sur $[0, +\infty[$, elle tend vers $+\infty$ en $+\infty$, et c'est une [[bijection]] de $[0, +\infty[$ sur lui-même, de réciproque $x \mapsto x^{1/a}$. Pour $a < 0$, elle est strictement décroissante sur $]0, +\infty[$ et tend vers $0$ en $+\infty$.
    preuve: |
      (i) On a $\ln(x^a) = \ln\exp(a\ln x) = a \ln x$. Les égalités du tableau s'en déduisent par {{ex-exponentielle|Exponentielle}}, (iii) :
      $$\begin{aligned} x^{a+b} &= \exp(a\ln x + b\ln x) = x^a x^b, \\ (x^a)^b &= \exp(b\ln(x^a)) = x^{ab}, \\ (xy)^a &= \exp(a\ln x + a\ln y) = x^a y^a, \end{aligned}$$
      la troisième par {{ex-logarithme|Logarithme}}, (ii). Puis $x^a x^{-a} = x^0 = \exp 0 = 1$, $x^1 = \exp\ln x = x$ et $1^a = \exp(a \ln 1) = 1$.

      (ii) Pour $n = 0$, $\exp(0) = 1 = x^0$. Si $\exp(n\ln x)$ est la puissance entière $x^n$, alors $\exp((n+1)\ln x) = \exp(n \ln x)\exp(\ln x) = x^n x$, qui est la puissance entière $x^{n+1}$. Le cas $-n$ vient de $x^{-a} = 1/x^a$.

      Soit $p \in \mathbb Z$ et $q \geqslant 1$. Par (i), $(x^{p/q})^q = x^{p}$, et $x^{p/q} > 0$. Si $z > 0$ vérifie aussi $z^q = x^p$, alors $q \ln z = \ln(z^q) = \ln(x^p) = p \ln x$, la première égalité par {{ex-logarithme|Logarithme}}, (ii), la dernière par (i), $x^p$ étant aussi la puissance réelle par ce qui précède ; d'où $\ln z = \frac pq \ln x = \ln(x^{p/q})$, et $z = x^{p/q}$ par injectivité de $\ln$.

      Enfin $\ln e = 1$, donc $e^a = \exp(a \ln e) = \exp a$.

      (iii) Par la dérivée d'une composée ({{de-composee|Dérivée d'une composée}}) et $\exp' = \exp$, la dérivée de $x \mapsto \exp(a\ln x)$ est
      $$\exp(a\ln x) \cdot \frac ax = a\,x^a x^{-1} = a\,x^{a-1},$$
      et celle de $a \mapsto \exp(a \ln x)$ est $(\ln x) \exp(a \ln x)$.

      (iv) Soit $a > 0$. La dérivée $a\,x^{a-1}$ est strictement positive sur $]0, +\infty[$, donc $x \mapsto x^a$ y est strictement croissante ({{de-monotonie|Signe de la dérivée}}, (iii)), et ses valeurs sont strictement positives ; avec $0^a = 0$, elle l'est sur $[0, +\infty[$. Elle est continue sur $]0, +\infty[$, où elle est dérivable ({{de-dl1|Développement à l'ordre 1}}), et en $0$ : pour $\varepsilon > 0$ et $0 \leqslant x < \varepsilon^{1/a}$, on a $x^a < (\varepsilon^{1/a})^a = \varepsilon$.

      Pour tout $A > 0$ et $x > A^{1/a}$, on a de même $x^a > A$ : la limite en $+\infty$ est $+\infty$. Pour $z > 0$, $(z^{1/a})^a = z$ par (i), et $0^{1/a} = 0$ a pour image $0^a = 0$ par convention, ce qui donne la surjectivité ; l'injectivité vient de la stricte croissance.

      Si $a < 0$, la dérivée est strictement négative, d'où la stricte décroissance ; et $x^a = 1/x^{-a}$, où $x^{-a} \to +\infty$, est inférieur à $\varepsilon$ dès que $x^{-a} > 1/\varepsilon$.
    remarques:
      - |
        L'erreur la plus répandue est d'appliquer la règle $(x^a)^b = x^{ab}$ à une base négative. Avec $x = -1$, $a = 2$ et $b = \frac12$, on obtiendrait $\big((-1)^2\big)^{1/2} = 1$, alors que $(-1)^1 = -1$. C'est pourquoi la puissance réelle n'est définie que pour une base strictement positive ; la puissance entière, elle, a un sens pour toute base.
      - |
        La seconde erreur classique est de dériver $2^x$ comme une puissance : la fonction $x \mapsto 2^x = \exp(x \ln 2)$ a pour dérivée $(\ln 2)\,2^x$ par (iii), soit $8\ln 2 \approx 5{,}55$ en $x = 3$, et non $x\,2^{x-1} = 12$. Dans $x^a$, c'est la position de la variable, en base ou en exposant, qui décide de la formule.
      - |
        Le point (ii) dit que $8^{2/3}$ est l'unique réel positif dont le cube vaut $8^2 = 64$, c'est-à-dire $4$. Pour un exposant irrationnel, aucune description par les racines n'est possible, et c'est la définition par $\exp$ et $\ln$ qui donne un sens à $2^{\sqrt 2} \approx 2{,}665$ ; elle prolonge les puissances rationnelles par continuité en l'exposant, par (iii).

  - id: ex-croissances
    etiquette: Croissances comparées
    nature: proposition
    titre: Inégalités fondamentales et croissances comparées
    texte: |
      Pour $m \in \lex{ensemble-entiers-naturels}{\mathbb N}$, on note $m! = \prod_{j=1}^m j$ la factorielle de $m$, produit des entiers de $1$ à $m$ ({{n-sommes|Sommes, produits et puissances}}) ; ainsi $0! = 1$ et $(m + 1)! = m!\,(m + 1)$. Cette notation a déjà servi, sans définition explicite, dans la formule de Taylor-Lagrange ({{de-taylor|Taylor-Lagrange}}) ; c'est la même.
    enonce: |
      (i) Pour tout réel $y$, $\exp y \geqslant 1 + y$, avec égalité si et seulement si $y = 0$. Pour tout $x > 0$, $\ln x \leqslant x - 1$, avec égalité si et seulement si $x = 1$.

      (ii) Pour tout $y \geqslant 0$ et tout $m \in \mathbb N$,
      $$\exp y \geqslant \frac{y^m}{m!}.$$

      (iii) Pour tout réel $a$ et tout $\varepsilon > 0$, les trois expressions
      $$x^a \exp(-x), \qquad \frac{\ln x}{x^\varepsilon}, \qquad x^\varepsilon \ln(1/x)$$
      tendent vers $0$, les deux premières quand $x \to +\infty$, la troisième quand $x \to 0$, $x > 0$.

      (iv) Pour tout $m \in \mathbb N$ et tout $x > 0$, $\exp(-1/x) \leqslant m!\,x^m$ ; en particulier $\exp(-1/x)/x^m \to 0$ quand $x \to 0$, $x > 0$.
    preuve: |
      (i) Posons $u(y) = \exp y - 1 - y$. Elle est dérivable, de dérivée $u'(y) = \exp y - 1$ ({{ex-exponentielle|Exponentielle}}, (ii)), strictement négative pour $y < 0$ et strictement positive pour $y > 0$, puisque $\exp$ est [[application-croissante|strictement croissante]] et $\exp 0 = 1$. Par le nœud {{de-monotonie|Signe de la dérivée}}, (iii), appliqué à $-u$ sur $]{-\infty}, 0]$ et à $u$ sur $[0, +\infty[$, $u$ est strictement décroissante sur le premier intervalle et strictement croissante sur le second. Ainsi $u(y) > u(0) = 0$ pour tout $y \neq 0$.

      Pour $x > 0$, on applique ce résultat à $y = \ln x$ : $x \geqslant 1 + \ln x$, avec égalité si et seulement si $\ln x = 0$, c'est-à-dire $x = 1$.

      (ii) Par récurrence sur $m$. Pour $m = 0$, $\exp y \geqslant \exp 0 = 1$ si $y \geqslant 0$. Si l'inégalité vaut au rang $m$, la fonction $v(y) = \exp y - \frac{y^{m+1}}{(m+1)!}$ a pour dérivée, sur $[0, +\infty[$,
      $$v'(y) = \exp y - \frac{y^m}{m!} \geqslant 0$$
      ({{de-operations|Opérations}}, (iv)). Elle est donc croissante ({{de-monotonie|Signe de la dérivée}}, (i)), et $v(y) \geqslant v(0) = 1 > 0$.

      (iii) *Première expression.* La propriété d'Archimède ({{ar-archimede|Archimède}}) fournit un entier $m \geqslant 1$ tel que $m \geqslant a + 1$. Pour $x \geqslant 1$, on a $x^{a - (m-1)} \leqslant 1$, par {{ex-puissances|Puissances réelles}}, (iv), l'exposant étant négatif ou nul, donc $x^a \leqslant x^{m-1}$. Avec (ii),
      $$0 < x^a\exp(-x) \leqslant \frac{x^{m-1}\, m!}{x^m} = \frac{m!}{x}.$$
      Pour $\eta > 0$, ce majorant est inférieur à $\eta$ dès que $x > \max(1, m!/\eta)$.

      *Deuxième expression.* Pour $x \geqslant 1$, (i) appliqué à $x^{\varepsilon/2}$ donne $\frac\varepsilon2 \ln x = \ln(x^{\varepsilon/2}) < x^{\varepsilon/2}$, par {{ex-puissances|Puissances réelles}}, (i). Ainsi
      $$0 \leqslant \frac{\ln x}{x^\varepsilon} < \frac{2}{\varepsilon}\,\frac{x^{\varepsilon/2}}{x^{\varepsilon}} = \frac{2}{\varepsilon\, x^{\varepsilon/2}}.$$
      Or $x^{\varepsilon/2} \to +\infty$ ({{ex-puissances|Puissances réelles}}, (iv)) : pour $\eta > 0$, le majorant est inférieur à $\eta$ dès que $x^{\varepsilon/2} > 2/(\varepsilon\eta)$.

      *Troisième expression.* Pour $0 < x \leqslant 1$, la même inégalité, appliquée à $1/x \geqslant 1$, donne $0 \leqslant x^\varepsilon\ln(1/x) < \frac2\varepsilon\,x^{\varepsilon/2}$, Pour $\eta > 0$, posons $\delta = \min\big(1, (\varepsilon\eta/2)^{2/\varepsilon}\big)$. Pour $0 < x < \delta$, la stricte croissance de $x \mapsto x^{\varepsilon/2}$ ({{ex-puissances|Puissances réelles}}, (iv)) donne $x^{\varepsilon/2} < \varepsilon\eta/2$, et le majorant est inférieur à $\eta$.

      (iv) Pour $x > 0$, (ii) appliqué à $y = 1/x$ donne $\exp(1/x) \geqslant \frac{1}{m!\,x^m}$, et $\exp(-1/x) = 1/\exp(1/x) \leqslant m!\,x^m$. Appliqué au rang $m + 1$, il donne $0 < \exp(-1/x)/x^m \leqslant (m+1)!\,x$ ; pour $\eta > 0$, ce majorant est inférieur à $\eta$ dès que $0 < x < \delta = \eta/(m+1)!$.
    remarques:
      - |
        Les limites de (iii) ne disent rien de la taille des expressions à distance finie, et c'est le piège principal. La fonction $x^{10}\exp(-x)$ croît jusqu'en $x = 10$, où elle vaut $(10/e)^{10} \approx 4{,}5 \cdot 10^5$, avant de décroître vers $0$ ; elle ne vaut encore que $1{,}9 \cdot 10^{-5}$ environ en $x = 50$. De même, $\ln x/\sqrt x$ vaut $0{,}46$ en $x = 100$ et $0{,}014$ en $x = 10^6$ : la convergence est réelle, mais lente.

        ```schema ex-croissances
        Les fonctions $x\exp(-x)$ (rouge), $x^2\exp(-x)$ (bleue) et $x^3\exp(-x)$ (verte) atteignent leur maximum en $x = a$, de valeur $(a/e)^a$, soit environ $0{,}368$, $0{,}541$ et $1{,}344$, puis tendent vers $0$. Plus l'exposant est grand, plus le maximum est haut et tardif : l'exponentielle l'emporte toujours, mais de plus en plus loin.
        ```
      - |
        L'inégalité (i) exprime que la droite $y = 1 + x$, tangente au graphe de $\exp$ au point $(0, 1)$, reste sous ce graphe ; c'est un cas particulier de la convexité, établie au nœud {{ex-convexite|Convexité}}. Par symétrie par rapport à la diagonale, la droite $y = x - 1$, tangente au graphe de $\ln$ au point $(1, 0)$, reste au-dessus de lui.
      - |
        Le point (iv) est celui qui servira au nœud {{ex-plateau|Fonction plate en 0}} : c'est parce que $\exp(-1/x)$ tend vers $0$, quand $x$ tend vers $0$, plus vite que toute puissance de $x$ que toutes les dérivées de la fonction $\theta$ de ce nœud seront nulles en $0$.

  - id: ex-serie
    etiquette: Série de l'exponentielle
    nature: proposition
    titre: L'exponentielle comme limite de polynômes
    texte: |
      Pour $n \in \lex{ensemble-entiers-naturels}{\mathbb N}$ et $x$ réel, on note
      $$S_n(x) = \sum_{k=0}^n \frac{x^k}{k!},$$
      où $k!$ est la factorielle du nœud {{ex-croissances|Croissances comparées}}.
    enonce: |
      (i) Pour tout réel $x$ et tout $n \in \mathbb N$,
      $$\big|\exp x - S_n(x)\big| \leqslant \exp|x|\,\frac{|x|^{n+1}}{(n+1)!}.$$
      Ce majorant tend vers $0$ quand $n \to \infty$ : la suite $\big(S_n(x)\big)$ converge vers $\exp x$. En particulier, $S_n(1) \to e$.

      (ii) Pour tout réel $x$, la suite $\big((1 + x/n)^n\big)_{n \geqslant 1}$ converge vers $\exp x$.
    preuve: |
      (i) Le cas $x = 0$ est immédiat. Si $x \neq 0$, la fonction $\exp$ est $n + 1$ fois dérivable, et toutes ses dérivées successives valent $\exp$ ({{ex-exponentielle|Exponentielle}}, (ii)). Comme $\exp 0 = 1$, son polynôme de Taylor en $0$ à l'ordre $n$ est $S_n$. La formule de Taylor-Lagrange ({{de-taylor|Taylor-Lagrange}}), entre $0$ et $x$, fournit $c$ strictement compris entre $0$ et $x$ tel que
      $$\exp x - S_n(x) = \exp c\,\frac{x^{n+1}}{(n+1)!},$$
      et $\exp c \leqslant \exp|x|$ par croissance, puisque $c < |x|$.

      Pour voir que le majorant tend vers $0$, on applique {{ex-croissances|Croissances comparées}}, (ii), à $y = 2|x|$ et au rang $n + 1$ :
      $$\frac{|x|^{n+1}}{(n+1)!} = \frac{(2|x|)^{n+1}}{2^{n+1}(n+1)!} \leqslant \frac{\exp(2|x|)}{2^{n+1}}.$$
      Or $2^{n+1} \geqslant n + 2$, par récurrence sur $n$ : c'est $2 \geqslant 2$ pour $n = 0$, et si l'inégalité vaut au rang $n$, alors $2^{n+2} = 2 \cdot 2^{n+1} \geqslant 2n + 4 \geqslant n + 3$. Le majorant de (i) est donc au plus $\exp(3|x|)/(n + 2)$.

      Soit $\eta > 0$. La propriété d'Archimède ({{ar-archimede|Archimède}}) fournit $N$ tel que $N\eta > \exp(3|x|)$ ; pour $n \geqslant N$, le majorant est inférieur à $\eta$, et $|\exp x - S_n(x)| < \eta$.

      (ii) Pour $x = 0$, la suite est constante égale à $1 = \exp 0$. Soit $x \neq 0$, et $n > |x|$, de sorte que $1 + x/n > 0$. Par {{ex-puissances|Puissances réelles}}, (ii), la puissance entière $(1 + x/n)^n$ vaut $\exp\big(n \ln(1 + x/n)\big)$.

      Le [[taux-accroissement|taux d'accroissement]] de $\ln$ en $1$, $g(h) = \frac{\ln(1 + h) - \ln 1}{h}$, défini pour $h > -1$ et $h \neq 0$, tend vers $\ln'(1) = 1$ quand $h \to 0$ ({{de-derivee|Dérivabilité en un point}}). Soit $\eta > 0$, et $\delta > 0$ tel que $|g(h) - 1| < \eta/|x|$ pour $0 < |h| < \delta$ et $h > -1$. Par la propriété d'Archimède, il existe $N > |x|$ tel que $|x|/N < \delta$ ; pour $n \geqslant N$, $h = x/n$ vérifie $0 < |h| < \delta$, et
      $$\begin{aligned} &\Big|n\ln\Big(1 + \frac xn\Big) - x\Big| \\ &\quad = |x|\,\Big|g\Big(\frac xn\Big) - 1\Big| < \eta. \end{aligned}$$
      La suite $y_n = n\ln(1 + x/n)$, définie pour $n > |x|$, converge donc vers $x$.

      Enfin $\exp$ est continue en $x$ ({{ex-exponentielle|Exponentielle}}, (i)) : pour $\eta > 0$, il existe $\delta > 0$ tel que $|y - x| < \delta$ entraîne $|\exp y - \exp x| < \eta$, et $|y_n - x| < \delta$ [[a-partir-certain-rang|à partir d'un certain rang]]. Ainsi $(1 + x/n)^n = \exp y_n \to \exp x$.
    remarques:
      - |
        Le reste se contrôle aussi en $x = 1$ sans connaître $e$ d'avance : la formule de Taylor-Lagrange donne $e - S_n(1) = \exp c/(n+1)!$ avec $0 < c < 1$, donc $0 < e - S_n(1) < e/(n+1)!$, c'est-à-dire
        $$S_n(1) < e < \frac{S_n(1)}{1 - 1/(n+1)!}.$$
        Pour $n = 2$, cela donne $2{,}5 < e < 3$ ; pour $n = 10$, $2{,}7182818011 < e < 2{,}7182818693$, soit sept décimales exactes avec onze termes.
      - |
        Les deux approximations de (i) et (ii) n'ont pas la même vitesse. La suite $(1 + 1/n)^n$ vaut environ $2{,}5937$ pour $n = 10$, $2{,}7048$ pour $n = 100$ et $2{,}7169$ pour $n = 1000$ : l'écart à $e$ est voisin de $e/(2n)$, et il faut aller jusqu'à $n = 1000$ pour deux décimales exactes, là où $S_{10}(1)$ en donne sept.

        L'erreur la plus répandue, devant $(1 + 1/n)^n$, est de conclure que la limite vaut $1$ parce que $1 + 1/n \to 1$ : l'exposant croît en même temps que la base tend vers $1$, et c'est le produit $n\ln(1 + 1/n)$, qui tend vers $1$, qui décide.
      - |
        Pour $x$ négatif, les sommes partielles alternent de signe et la convergence est trompeuse au début : $S_5(-5) \approx -12{,}33$ et $S_{10}(-5) \approx 0{,}864$, alors que $\exp(-5) \approx 0{,}00674$. Il vaut mieux calculer $\exp(-5) = 1/\exp 5$ par (iii) du nœud {{ex-exponentielle|Exponentielle}}.

        ```schema ex-serie
        Le graphe de $\exp$ (rouge) et ceux des polynômes $S_1$ (gris, en pointillé), $S_2$ (gris) et $S_3$ (trait plein de la couleur du texte). Pour $x > 0$, les $S_n$ restent sous $\exp$ et s'en approchent ; pour $x < 0$, ils passent alternativement au-dessus et au-dessous, $S_1$ et $S_3$ au-dessous, $S_2$ au-dessus.
        ```
      - |
        On écrit $\exp x = \sum_{k=0}^{\infty} x^k/k!$ : c'est par cette série entière que l'analyse complexe prolonge l'exponentielle à $\mathbb C$ ({{cx-exponentielle|Exponentielle}}), et le point (iv) de ce nœud s'appuie sur (i) pour établir que sa restriction à $\mathbb R$ est la fonction de ce chapitre. Les deux expressions, la série et la limite de $(1 + x/i)^i$ pour $i$ « infiniment grand », sont chez Euler, *Introductio in analysin infinitorum* (1748), tome I, chapitre VII. La limite (ii) sert à l'approximation des lois binomiales par les lois de Poisson ({{p-poisson-exp|Poisson, exponentielle}}).

  - id: ex-convexite
    etiquette: Convexité
    nature: proposition
    titre: Convexité de l'exponentielle
    texte: |
      Soit $I$ un [[intervalle]]. Une fonction $f : I \to \lex{ensemble-reels}{\mathbb R}$ est [[fonction-convexe|convexe]] si, pour tous $a, b \in I$ et tout $s \in [0, 1]$,
      $$f\big((1 - s)a + sb\big) \leqslant (1 - s)f(a) + s f(b),$$
      c'est-à-dire si son [[graphe-application|graphe]] est, entre deux de ses points, sous la corde qui les joint. Le point $(1 - s)a + sb$ appartient à $I$, qui est convexe ({{tr-intervalles|Intervalles de ℝ}}, (i)).

      Pour tout réel $t$, on pose $\cosh t = \frac12\big(\exp t + \exp(-t)\big)$.
    enonce: |
      (i) Si $f : I \to \mathbb R$ est [[derivable]] et si $f'$ est [[application-croissante|croissante]] sur $I$, alors $f$ est convexe.

      (ii) L'[[exponentielle]] est convexe sur $\mathbb R$. En particulier, pour tout réel $t$ et tout $x \in [-1, 1]$,
      $$\begin{aligned} \exp(tx) \leqslant{} &\frac{1 - x}{2}\exp(-t) \\ &+ \frac{1 + x}{2}\exp t. \end{aligned}$$

      (iii) Pour tout réel $t$, $\cosh t \leqslant \exp(t^2/2)$.
    preuve: |
      (i) Soit $a, b \in I$, $s \in [0, 1]$ et $c = (1 - s)a + sb$. Si $s \in \{0, 1\}$ ou $a = b$, l'inégalité est une égalité. Quitte à échanger $a$ et $b$, et $s$ et $1 - s$, supposons $a < b$ et $0 < s < 1$, de sorte que $a < c < b$, avec $c - a = s(b - a)$ et $b - c = (1 - s)(b - a)$.

      L'égalité des accroissements finis ({{de-taf|Égalité des accroissements finis}}), sur $[a, c]$ et sur $[c, b]$, fournit $\xi_1 \in \,]a, c[$ et $\xi_2 \in \,]c, b[$ tels que
      $$\begin{aligned} f(c) - f(a) &= f'(\xi_1)\, s(b - a), \\ f(b) - f(c) &= f'(\xi_2)\,(1 - s)(b - a). \end{aligned}$$
      Comme $\xi_1 < \xi_2$ et que $f'$ est croissante, $f'(\xi_1) \leqslant f'(\xi_2)$. Par suite
      $$\begin{aligned} &(1 - s)f(a) + sf(b) - f(c) \\ &\quad = s\big(f(b) - f(c)\big) \\ &\qquad - (1 - s)\big(f(c) - f(a)\big) \\ &\quad = s(1 - s)(b - a)\big(f'(\xi_2) - f'(\xi_1)\big), \end{aligned}$$
      qui est positif ou nul : c'est l'inégalité de convexité.

      (ii) La dérivée de $\exp$ est $\exp$ ({{ex-exponentielle|Exponentielle}}, (ii)), qui est croissante : (i) s'applique. Pour $x \in [-1, 1]$, on prend $a = -t$, $b = t$ et $s = \frac{1 + x}{2} \in [0, 1]$ ; alors $(1 - s)a + sb = t(2s - 1) = tx$, et l'inégalité de convexité est celle de l'énoncé.

      (iii) Par {{ex-serie|Série de l'exponentielle}}, (i), $S_n(t) \to \exp t$ et $S_n(-t) \to \exp(-t)$ ; il en va de même des suites extraites d'indices $2n + 1$ ({{su-extraites|Suites extraites}}, (i)), et
      $$\frac{S_{2n+1}(t) + S_{2n+1}(-t)}{2} = \sum_{j=0}^n \frac{t^{2j}}{(2j)!},$$
      puisque les termes d'indice impair se compensent et que ceux d'indice pair sont doublés. Cette somme tend donc vers $\cosh t$ ({{su-operations|Opérations sur les limites}}).

      D'autre part, en regroupant les facteurs deux par deux ({{n-sommes|Sommes, produits et puissances}}, (iii)), $(2j)! = \prod_{i=1}^{j} (2i - 1)(2i) \geqslant \prod_{i=1}^j 2i = 2^j j!$, et $t^{2j} \geqslant 0$, d'où
      $$\sum_{j=0}^n \frac{t^{2j}}{(2j)!} \leqslant \sum_{j=0}^n \frac{(t^2/2)^j}{j!} = S_n\Big(\frac{t^2}2\Big).$$
      Le membre de droite tend vers $\exp(t^2/2)$, et le passage à la limite dans les inégalités ({{su-inegalites|Passage à la limite}}, (ii)) donne $\cosh t \leqslant \exp(t^2/2)$.
    remarques:
      - |
        L'inégalité (ii) majore $\exp(tx)$, pour $x$ entre $-1$ et $1$, par la corde qui joint les points d'abscisses $-t$ et $t$ du graphe de $\exp$ ; en $x = 0$, la corde passe à la hauteur $\cosh t$, et (iii) compare cette hauteur à $\exp(t^2/2)$.

        ```schema ex-convexite
        Pour $t = 1$, le graphe de $\exp$ (rouge) reste sous la corde (bleue) qui joint $(-1, e^{-1})$ à $(1, e)$. Au milieu, la corde est à la hauteur $\cosh 1 \approx 1{,}543$, au-dessus de $\exp 0 = 1$ et au-dessous de $\exp\frac12 \approx 1{,}649$ (point vert), comme l'affirme (iii).
        ```
      - |
        Ce sont exactement les deux inégalités de la démonstration de l'inégalité de Hoeffding ({{p-hoeffding|Inégalité de Hoeffding}}) : (ii) majore $E[\exp(tX)]$ par $\cosh t$ pour une variable centrée à valeurs dans $[-1, 1]$, et (iii) remplace $\cosh t$ par $\exp(t^2/2)$. Le second majorant est assez fin près de $0$, où $\cosh \frac12 \approx 1{,}128$ et $\exp \frac18 \approx 1{,}133$, mais grossier au loin : $\cosh 3 \approx 10{,}07$, pour $\exp 4{,}5 \approx 90{,}0$.
      - |
        L'erreur la plus répandue est de croire qu'il faut deux dérivées pour parler de convexité. La définition ne demande rien, et (i) ne demande que la croissance de $f'$ ; l'hypothèse $f'' \geqslant 0$ n'en est qu'un cas particulier, par le nœud {{de-monotonie|Signe de la dérivée}}, (i), appliqué à $f'$.

  - id: ex-plateau
    etiquette: Fonction plate en 0
    nature: proposition
    titre: Une fonction indéfiniment dérivable, plate en 0
    texte: |
      On pose $\theta(x) = \exp(-1/x)$ pour $x > 0$, et $\theta(x) = 0$ pour $x \leqslant 0$.

      Une fonction $f : \lex{ensemble-reels}{\mathbb R} \to \mathbb R$ est **de classe $C^\infty$** si elle est de classe $C^n$ pour tout $n \in \lex{ensemble-entiers-naturels}{\mathbb N}$, au sens du nœud {{de-taylor|Taylor-Lagrange}}, c'est-à-dire si toutes ses [[derivee-successive|dérivées successives]] existent sur $\mathbb R$, chacune étant alors continue.

      Les polynômes $P_k$ sont définis par $P_0 = 1$ et
      $$P_{k+1}(u) = u^2\big(P_k(u) - P_k'(u)\big),$$
      où $P_k'$ est la dérivée de la [[fonction-polynomiale|fonction polynomiale]] $P_k$ ({{de-operations|Opérations}}, (iv)).
    enonce: |
      (i) $\theta$ est nulle sur $]{-\infty}, 0]$ et strictement positive sur $]0, +\infty[$. Pour tout $k \in \mathbb N$ et tout $x > 0$, $\theta^{(k)}(x) = P_k(1/x)\,\theta(x)$.

      (ii) $\theta$ est de classe $C^\infty$ sur $\mathbb R$, et $\theta^{(k)}(0) = 0$ pour tout $k$.

      (iii) Les polynômes de Taylor de $\theta$ en $0$ sont tous nuls : pour $x > 0$, ils ne tendent pas vers $\theta(x)$.
    preuve: |
      (i) Le signe vient de ce que $\exp$ est à valeurs strictement positives. Sur $]0, +\infty[$, $\theta$ est la composée de $x \mapsto -1/x$, de dérivée $1/x^2$, et de $\exp$ ; la dérivée d'une composée ({{de-composee|Dérivée d'une composée}}) donne $\theta'(x) = \frac{1}{x^2}\theta(x)$, qui est la formule pour $k = 1$, puisque $P_1(u) = u^2$.

      Si $\theta^{(k)}(x) = P_k(1/x)\,\theta(x)$ sur $]0, +\infty[$, la dérivée de ce produit ({{de-operations|Opérations}}, (ii) à (iv), et {{de-composee|Dérivée d'une composée}}) est
      $$\begin{aligned} &-\frac{1}{x^2}P_k'\Big(\frac1x\Big)\theta(x) + P_k\Big(\frac1x\Big)\frac{\theta(x)}{x^2} \\ &\quad = P_{k+1}\Big(\frac1x\Big)\theta(x). \end{aligned}$$

      (ii) *Une majoration.* Soit $P$ un polynôme de [[degre-polynome|degré]] au plus $d$, dont la somme des [[valeur-absolue|valeurs absolues]] des coefficients vaut $A$. Pour $0 < x \leqslant 1$, chaque terme $c_j x^{-j}$ de $P(1/x)$ est majoré en valeur absolue par $|c_j|\,x^{-d}$, donc $|P(1/x)| \leqslant A\,x^{-d}$. Par {{ex-croissances|Croissances comparées}}, (iv), avec $m = d + 2$, on a $\theta(x) \leqslant (d+2)!\,x^{d+2}$, et
      $$\big|P(1/x)\,\theta(x)\big| \leqslant A\,(d+2)!\,x^2.$$

      *Récurrence.* Montrons que, pour tout $k$, $\theta$ est $k$ fois dérivable sur $\mathbb R$, avec $\theta^{(k)} = 0$ sur $]{-\infty}, 0]$ et $\theta^{(k)}(x) = P_k(1/x)\,\theta(x)$ pour $x > 0$. C'est vrai pour $k = 0$.

      Supposons-le au rang $k$. Sur $]{-\infty}, 0[$, $\theta^{(k)}$ est nulle, de dérivée nulle ; sur $]0, +\infty[$, elle a la dérivée calculée en (i). En un point $x_0 \neq 0$, le [[taux-accroissement|taux d'accroissement]] de $\theta^{(k)}$ sur $\mathbb R$ a la même limite que sur l'intervalle ouvert de même signe que $x_0$, par le caractère local des limites ({{de-limite|Limite en un point}}, (iii)). En $0$, le taux d'accroissement
      $$\frac{\theta^{(k)}(h) - \theta^{(k)}(0)}{h}$$
      est nul pour $h < 0$, et majoré en valeur absolue, pour $0 < h \leqslant 1$, par $A_k\,(d_k+2)!\,h$, où $d_k$ et $A_k$ sont le degré de $P_k$ et la somme des valeurs absolues de ses coefficients. Il est donc inférieur à $\eta > 0$ en valeur absolue pour $0 < |h| < \min\big(1, \eta/(A_k(d_k+2)!)\big)$, et il tend vers $0$ ({{de-derivee|Dérivabilité en un point}} ; {{de-limite|Limite en un point}}, (iii), pour la restriction à $|h| \leqslant 1$), et $\theta^{(k+1)}(0) = 0$.

      *Conclusion.* Chaque $\theta^{(k)}$ est dérivable sur $\mathbb R$, donc continue ({{de-dl1|Développement à l'ordre 1}}) : $\theta$ est de classe $C^k$ pour tout $k$.

      (iii) Le polynôme de Taylor de $\theta$ en $0$ à l'ordre $n$ ({{de-taylor|Taylor-Lagrange}}) est $\sum_{k \leqslant n} \frac{\theta^{(k)}(0)}{k!}x^k = 0$ par (ii), alors que $\theta(x) > 0$ pour $x > 0$ par (i).
    remarques:
      - |
        Les premiers polynômes sont $P_1(u) = u^2$, $P_2(u) = u^4 - 2u^3 = u^3(u - 2)$ et $P_3(u) = u^6 - 6u^5 + 6u^4$, comme on le vérifie en dérivant $\theta$ à la machine. La dérivée seconde s'annule sur $]0, +\infty[$ en $x = \frac12$ seulement, où la pente $\theta'(\frac12) = 4\exp(-2) \approx 0{,}541$ est maximale ; les zéros $3 \pm \sqrt 3$ de $P_3(u)/u^4$ donnent les extremums de $\theta''$, en $x = \frac{3 \mp \sqrt 3}{6}$, soit $x \approx 0{,}211$ et $x \approx 0{,}789$.

        ```schema ex-plateau
        La fonction $\theta$ (rouge) et ses dérivées $\theta'$ (bleue) et $\theta''$ (verte), toutes nulles sur $]{-\infty}, 0]$, quittent l'axe en $0$ sans angle ni saut. Sur la verticale $x = \frac12$, le point rouge est le point d'inflexion de $\theta$, le point bleu le maximum de $\theta'$ et le point vert un zéro de $\theta''$.
        ```

        Les valeurs $\theta(1) \approx 0{,}368$, $\theta(\frac12) \approx 0{,}135$ et $\theta(\frac1{10}) \approx 4{,}5 \cdot 10^{-5}$ montrent à quel point la fonction est plate près de $0$.
      - |
        L'erreur la plus répandue est de croire qu'une fonction de classe $C^\infty$ est la limite de ses polynômes de Taylor. Ici le reste de la formule de Taylor-Lagrange porte à lui seul toute la valeur de $\theta(x)$, à tout ordre ; c'est l'opposé de l'exponentielle ({{ex-serie|Série de l'exponentielle}}), où le reste tend vers $0$. En termes de séries entières, que ce chapitre n'emploie pas, $\theta$ n'est développable en série entière sur aucun voisinage de $0$, puisque cette série serait nulle.
      - |
        L'exemple remonte à Cauchy, qui l'opposait à l'approche de Lagrange, fondée sur le développement des fonctions en séries de puissances (*Théorie des fonctions analytiques*, 1797) : la fonction $\exp(-1/x^2)$, de dérivées toutes nulles en $0$, figure dans le *Résumé des leçons données à l'École royale polytechnique sur le calcul infinitésimal* (1823), dans la leçon intitulée « Règles sur la convergence des séries. Application de ces règles à la série de Maclaurin ». La fonction $\theta$ en est une variante, nulle d'un côté de $0$.
      - |
        Ce côté nul est ce qui rend $\theta$ précieuse. La composée $t \mapsto \theta(1 - t^2)$ est de classe $C^\infty$, strictement positive sur $]{-1}, 1[$ et nulle ailleurs : c'est le prototype des [[fonction-plateau|fonctions plateau]], qui permettent de recoller des objets locaux. Elles sont construites à partir de $\theta$ sur une variété quelconque, lues dans les cartes, au nœud {{gd-partition|Partitions de l'unité}} de la géométrie différentielle, qui en tire les partitions de l'unité ; celles-ci démontrent qu'une variété orientable porte une forme volume ({{gd-forme-volume|Forme volume}}). Sur $\mathbb R^n$, elles sont reprises au nœud {{dr-plateau|Fonctions plateau}}.

