# Niveau 1 : structure interne du nœud « Mesure, intégration ».
# Sommes dans [0, +∞], tribus, mesures, classes monotones, théorème de Carathéodory,
# mesure de Lebesgue sur ℝ (⋆ choix dénombrable), régularité (boréliens à un négligeable près,
# ⋆ choix dénombrable), ensemble de Vitali (⋆ axiome du choix),
# fonctions mesurables et étagées, intégrale, convergence monotone, Fatou, fonctions
# intégrables, convergence dominée, comparaison avec l'intégrale de Riemann, mesure produit,
# Tonelli et Fubini.
# Les sommes finies sont redéfinies ici, l'algèbre linéaire n'étant pas un ancêtre de ce nœud ;
# la dénombrabilité de ℕ × ℕ et de ℚ vient du graphe de ℚ.

graphe: mes
titre: Mesure, intégration
conteneur: mes

entrees:
  analyse-reelle: [m-droite-achevee, m-lebesgue, m-riemann]
  q: [m-tribus]

noeuds:
  - id: m-droite-achevee
    etiquette: Sommes dans [0, +∞]
    nature: proposition
    titre: La demi-droite achevée et les sommes positives
    texte: |
      On note $\lex{demi-droite-achevee}{[0, +\infty]} = [0, +\infty[ \cup \{+\infty\}$, ordonné en plaçant $+\infty$ au-dessus de tous les réels. Toute partie non vide $A$ y a une borne supérieure $\sup A$, égale à $+\infty$ si $A$ contient $+\infty$ ou n'est pas majorée dans $\lex{ensemble-reels}{\mathbb R}$, et donnée par la propriété de la [[borne-superieure]] sinon.

      On prolonge l'addition par $a + (+\infty) = +\infty$, et la multiplication par $a \cdot (+\infty) = +\infty$ si $a > 0$ et $0 \cdot (+\infty) = 0$. Toute suite croissante $(a_n)$ a pour limite $\sup_n a_n$.

      Pour une famille quelconque $(a_i)_{i \in I}$ d'éléments de $[0, +\infty]$, on pose
      $$\sum_{i \in I} a_i = \sup\Big\{\sum_{i \in F} a_i : F \subset I \text{ fini}\Big\}.$$
    enonce: |
      (i) *Sommes finies.* Pour $I$ fini, il existe une unique application $S : \lex{ensemble-parties}{\mathcal P}(I) \to [0, +\infty]$ telle que $S(\varnothing) = 0$ et $S(A \cup \{i\}) = S(A) + a_i$ pour $i \notin A$ ; on note $\sum_{i \in A} a_i = S(A)$. Elle ne dépend d'aucun ordre sur $I$, et coïncide avec la définition générale.

      (ii) *Bornes supérieures.* Pour $A, B \subset [0, +\infty]$ non vides et $c \in [0, +\infty]$, $\sup(A + B) = \sup A + \sup B$ et $\sup(cA) = c \sup A$. Si $(a_n)$ et $(b_n)$ sont croissantes, $\lim (a_n + b_n) = \lim a_n + \lim b_n$.

      (iii) Pour $I = \lex{ensemble-entiers-naturels}{\mathbb N}$, $\sum_{n \in \mathbb N} a_n = \lim_N \sum_{n < N} a_n$.

      (iv) *Sommation par paquets.* Si $I$ est la réunion disjointe d'une famille $(I_j)_{j \in J}$, alors
      $$\sum_{i \in I} a_i = \sum_{j \in J} \Big(\sum_{i \in I_j} a_i\Big).$$
      En particulier, une somme ne change pas quand on réindexe ses termes par une bijection, et $\sum_m \sum_n a_{mn} = \sum_n \sum_m a_{mn}$.
    preuve: |
      (i) C'est le nœud {{n-sommes|Sommes finies}}, appliqué à $[0, +\infty]$ muni de l'addition, qui est associative et commutative, de neutre $0$, comme on le vérifie en séparant le cas où un terme est infini. Enfin $S$ est croissante pour l'inclusion, puisque les termes sont positifs : la borne supérieure sur les parties finies de $I$ est atteinte en $I$.

      (ii) L'inégalité $\sup(A + B) \leqslant \sup A + \sup B$ est claire. Si $\sup A$ et $\sup B$ sont finis, pour $\varepsilon > 0$ il existe $a \in A$ et $b \in B$ avec $a > \sup A - \varepsilon$ et $b > \sup B - \varepsilon$, d'où $a + b > \sup A + \sup B - 2\varepsilon$. Si, disons, $\sup A = +\infty$, les $a + b \geqslant a$ ne sont pas majorés. Le cas de $cA$ est analogue, $c = 0$ et $c = +\infty$ se traitant à part.

      Pour deux suites croissantes, $a_m + b_n \leqslant a_k + b_k$ avec $k = \max(m, n)$, donc
      $$\begin{aligned} \sup_k (a_k + b_k) &= \sup_{m,n}(a_m + b_n) \\ &= \sup a + \sup b. \end{aligned}$$

      (iii) Toute partie finie de $\mathbb N$ est contenue dans un $\{0, \dots, N - 1\}$ : la borne supérieure sur les parties finies est celle des sommes partielles, suite croissante.

      (iv) Si $F \subset I$ est fini, il ne rencontre qu'un ensemble fini $G$ d'indices $j$, et
      $$\sum_F a_i = \sum_{j \in G} \sum_{F \cap I_j} a_i,$$
      majoré par le second membre.

      Réciproquement, pour $G \subset J$ fini et des parties finies $F_j \subset I_j$, $\sum_{j \in G} \sum_{F_j} a_i = \sum_{\bigcup F_j} a_i$ est majoré par le premier membre ; en prenant la borne supérieure sur chaque $F_j$, grâce à (ii), puis sur $G$, on obtient l'autre inégalité.

      Une bijection $\beta : I' \to I$ définit une partition de $I'$ en singletons $\{\beta^{-1}(i)\}$ ; pour les sommes doubles, on partitionne $\mathbb N \times \mathbb N$ en lignes, puis en colonnes.
    remarques:
      - |
        Pour des termes positifs, l'ordre de sommation est indifférent. L'erreur la plus répandue est d'étendre ce fait aux séries de signe quelconque : la série $1 - \frac12 + \frac13 - \frac14 + \cdots$ converge, mais un réarrangement de ses termes peut converger vers n'importe quel réel donné à l'avance (théorème de Riemann). La théorie de l'intégrale se construit donc d'abord pour les fonctions positives.
      - |
        La convention $0 \cdot (+\infty) = 0$ n'est pas arbitraire : l'intégrale de la fonction nulle sur un ensemble de mesure infinie, ou d'une fonction infinie sur un ensemble de mesure nulle, doit valoir $0$. Elle rend la multiplication de $[0, +\infty]$ associative et distributive, mais pas continue : $\frac1n \cdot (+\infty) = +\infty$ ne tend pas vers $0 \cdot (+\infty)$.

  - id: m-tribus
    etiquette: Tribus
    nature: définition
    titre: Tribus et tribu borélienne
    texte: |
      Une [[tribu]] sur un ensemble $X$ est une partie $\mathcal A$ de $\lex{ensemble-parties}{\mathcal P}(X)$ qui contient $X$, est stable par passage au complémentaire, et par réunion des familles $(A_n)_{n \in \lex{ensemble-entiers-naturels}{\mathbb N}}$. Le couple $(X, \mathcal A)$ est un **espace mesurable**, et les éléments de $\mathcal A$ sont dits mesurables.

      La [[tribu-borelienne|tribu borélienne]] $\lex{tribu-borelienne}{\mathcal B}(\lex{ensemble-reels}{\mathbb R})$ est la tribu engendrée par les ouverts de $\mathbb R$.
    enonce: |
      (i) Une tribu contient $\varnothing$ et est stable par réunion finie, par intersection finie ou indexée par $\mathbb N$, et par différence. Elle est stable par réunion d'une famille indexée par un ensemble au plus [[denombrable]].

      (ii) Toute intersection d'un ensemble non vide de tribus sur $X$ est une tribu. Pour $\mathcal C \subset \mathcal P(X)$, la **tribu engendrée** $\sigma(\mathcal C)$ est l'intersection des tribus qui contiennent $\mathcal C$ ; c'est la plus petite.

      (iii) $\mathcal B(\mathbb R)$ est engendrée par les intervalles $]a, b]$, $a < b$ réels, et aussi par les demi-droites $]{-\infty}, c]$.

      (iv) Si $f : X \to Y$ et si $\mathcal T$ est une tribu sur $Y$, l'ensemble $\{B \subset Y : f^{-1}(B) \in \mathcal A\}$ est une tribu. En particulier, si $\mathcal T = \sigma(\mathcal C)$, il suffit que $f^{-1}(C) \in \mathcal A$ pour $C \in \mathcal C$ pour que $f^{-1}(B) \in \mathcal A$ pour tout $B \in \mathcal T$.
    preuve: |
      (i) $\varnothing = X^c$. Pour une réunion finie, on complète la famille par des $\varnothing$ ; les intersections s'obtiennent par complémentaire, $\bigcap A_n = \big(\bigcup A_n^c\big)^c$, et $B \setminus A = B \cap A^c$. Une famille indexée par un ensemble au plus dénombrable se réindexe par une partie de $\mathbb N$, que l'on complète par des $\varnothing$.

      (ii) Les trois conditions passent à l'intersection, et $\mathcal P(X)$ est une tribu contenant $\mathcal C$.

      (iii) $]a, b] = \bigcap_n \,]a, b + \frac1{n+1}[$ est borélien.

      Réciproquement, un ouvert $O$ de $\mathbb R$ est la réunion des intervalles $]a, b]$ à extrémités rationnelles contenus dans $O$, car tout $x \in O$ appartient à l'un d'eux, par densité de $\lex{ensemble-rationnels}{\mathbb Q}$ ; c'est une réunion indexée par une partie de $\lex{n-uplet}{\mathbb Q^2}$, qui est dénombrable ({{q-denombrable|ℚ est dénombrable}}). Donc les ouverts sont dans la tribu engendrée par ces intervalles.

      Enfin $]a, b] = \,]{-\infty}, b] \setminus \,]{-\infty}, a]$ et $]{-\infty}, c] = \bigcup_n \,]c - n - 1, c]$.

      (iv) $f^{-1}$ commute avec le complémentaire et les réunions. La tribu ainsi définie contient $\mathcal C$, donc $\sigma(\mathcal C)$.
    remarques:
      - |
        Une tribu n'est pas une topologie : elle est stable par complémentaire, mais seulement par réunion **dénombrable**. Si elle était stable par réunion quelconque et contenait les singletons, elle contiendrait toutes les parties ; c'est précisément ce que la mesure de Lebesgue ne peut pas supporter, comme le montrera l'{{m-vitali|ensemble de Vitali}}.
      - |
        Par (iv), toute application continue $f : \mathbb R \to \mathbb R$ est **borélienne** : l'image réciproque de tout borélien est borélienne, puisque c'est vrai des ouverts.

  - id: m-mesures
    etiquette: Mesures
    nature: définition
    titre: Mesures et premières propriétés
    texte: |
      Une [[mesure]] sur un espace mesurable $(X, \mathcal A)$ est une application $\mu : \mathcal A \to \lex{demi-droite-achevee}{[0, +\infty]}$ telle que $\mu(\varnothing) = 0$ et, pour toute famille $(A_n)_{n \in \lex{ensemble-entiers-naturels}{\mathbb N}}$ d'éléments de $\mathcal A$ deux à deux disjoints,
      $$\mu\Big(\bigcup_n A_n\Big) = \sum_n \mu(A_n).$$

      Le triplet $(X, \mathcal A, \mu)$ est un **espace mesuré**. Une partie $N \in \mathcal A$ telle que $\mu(N) = 0$ est [[negligeable|négligeable]], et une propriété est vraie [[presque-partout|presque partout]] si elle l'est hors d'un ensemble négligeable.

      La mesure est **finie** si $\mu(X) < +\infty$, et **σ-finie** si $X$ est la réunion d'une suite croissante de parties mesurables de mesure finie.
    enonce: |
      (i) $\mu$ est additive et croissante ; si $A \subset B$ et $\mu(A) < +\infty$, alors $\mu(B \setminus A) = \mu(B) - \mu(A)$.

      (ii) *Sous-additivité.* $\mu\big(\bigcup_n A_n\big) \leqslant \sum_n \mu(A_n)$ pour toute suite d'éléments de $\mathcal A$.

      (iii) *Continuité.* Si $(A_n)$ est croissante, $\mu\big(\bigcup_n A_n\big) = \lim_n \mu(A_n)$. Si $(A_n)$ est décroissante et $\mu(A_0) < +\infty$, $\mu\big(\bigcap_n A_n\big) = \lim_n \mu(A_n)$.
    preuve: |
      (i) On complète une famille finie disjointe par des $\varnothing$. Si $A \subset B$, $B = A \cup (B \setminus A)$ donne $\mu(B) = \mu(A) + \mu(B \setminus A) \geqslant \mu(A)$, et la soustraction est permise si $\mu(A)$ est fini.

      (iii) Posons $B_0 = A_0$ et $B_{n+1} = A_{n+1} \setminus A_n$ : ces parties sont disjointes, $A_n = B_0 \cup \cdots \cup B_n$ et $\bigcup A_n = \bigcup B_n$. Alors, par le point (iii) de {{m-droite-achevee|Sommes dans [0, +∞]}},
      $$\begin{aligned} \mu\Big(\bigcup A_n\Big) &= \sum_n \mu(B_n) \\ &= \lim_N \sum_{n \leqslant N} \mu(B_n) \\ &= \lim_N \mu(A_N). \end{aligned}$$

      Dans le cas décroissant, on applique ce qui précède à la suite croissante $A_0 \setminus A_n$, et l'on soustrait de $\mu(A_0)$, qui est fini.

      (ii) Avec $B_0 = A_0$ et $B_{n+1} = A_{n+1} \setminus (A_0 \cup \cdots \cup A_n)$, les $B_n$ sont disjoints, de même réunion que les $A_n$, et $\mu(B_n) \leqslant \mu(A_n)$ par croissance.
    remarques:
      - |
        Sur $\lex{ensemble-parties}{\mathcal P}(X)$, la **mesure de Dirac** $\delta_x(A) = \mathbf 1_A(x)$ concentre toute la masse en un point, et la **mesure de comptage** associe à $A$ son nombre d'éléments s'il est fini, $+\infty$ sinon. Ce sont les deux exemples à garder en tête : la seconde fait des séries un cas particulier des intégrales.
      - |
        L'hypothèse $\mu(A_0) < +\infty$ ne peut pas être omise dans la continuité décroissante. Pour la mesure de comptage sur $\mathbb N$, les parties $A_n = \{n, n + 1, \dots\}$ sont toutes de mesure infinie, mais leur intersection est vide.

  - id: m-dynkin
    etiquette: Classes monotones
    nature: théorème
    titre: Lemme de Dynkin et unicité des mesures
    texte: |
      Une partie $\mathcal C$ de $\lex{ensemble-parties}{\mathcal P}(X)$ est un **π-système** si elle est stable par intersection finie. Elle est une **classe monotone** (ou λ-système) si elle contient $X$, contient $B \setminus A$ dès que $A \subset B$ sont dans $\mathcal C$, et contient la réunion de toute suite croissante d'éléments de $\mathcal C$.
    enonce: |
      (i) *Lemme de Dynkin.* La classe monotone engendrée par un π-système $\mathcal C$ est la tribu $\sigma(\mathcal C)$.

      (ii) *Unicité.* Soient $\mu$ et $\nu$ deux mesures sur $\sigma(\mathcal C)$, où $\mathcal C$ est un π-système, qui coïncident sur $\mathcal C$. S'il existe une suite croissante $(X_n)$ d'éléments de $\mathcal C$, de réunion $X$, telle que $\mu(X_n) = \nu(X_n) < +\infty$, alors $\mu = \nu$.
    preuve: |
      (i) Soit $\mathcal D$ la classe monotone engendrée par $\mathcal C$, intersection des classes monotones contenant $\mathcal C$. Une tribu est une classe monotone, donc $\mathcal D \subset \sigma(\mathcal C)$.

      Montrons que $\mathcal D$ est un π-système. L'ensemble $\mathcal D_1 = \{A \in \mathcal D : A \cap C \in \mathcal D \text{ pour tout } C \in \mathcal C\}$ est une classe monotone, car $(B \setminus A) \cap C = (B \cap C) \setminus (A \cap C)$ et l'intersection commute aux réunions croissantes ; il contient $\mathcal C$, donc égale $\mathcal D$.

      De même, $\mathcal D_2 = \{A \in \mathcal D : A \cap B \in \mathcal D \text{ pour tout } B \in \mathcal D\}$ est une classe monotone qui contient $\mathcal C$, par ce qui précède ; donc $\mathcal D_2 = \mathcal D$.

      Une classe monotone stable par intersection finie est une tribu : elle contient $A^c = X \setminus A$, puis $A \cup B = (A^c \cap B^c)^c$, et la réunion d'une suite est la réunion croissante de ses réunions finies. Donc $\mathcal D$ est une tribu contenant $\mathcal C$, et $\mathcal D = \sigma(\mathcal C)$.

      (ii) Supposons d'abord $X \in \mathcal C$ et $\mu(X) = \nu(X) < +\infty$. L'ensemble des $A$ tels que $\mu(A) = \nu(A)$ est une classe monotone : la différence se traite par {{m-mesures|Mesures}}, (i), qui s'applique car les mesures sont finies, et les réunions croissantes par la continuité croissante. Il contient $\mathcal C$, donc $\sigma(\mathcal C)$ par (i).

      Dans le cas général, on applique ce cas aux mesures $A \mapsto \mu(A \cap X_n)$ et $A \mapsto \nu(A \cap X_n)$, qui coïncident sur $\mathcal C$ puisque $A \cap X_n \in \mathcal C$ ; puis
      $$\begin{aligned} \mu(A) &= \lim_n \mu(A \cap X_n) \\ &= \lim_n \nu(A \cap X_n) = \nu(A). \end{aligned}$$
    remarques:
      - |
        L'hypothèse de finitude est nécessaire. Sur $\lex{tribu-borelienne}{\mathcal B}(\lex{ensemble-reels}{\mathbb R})$, la mesure de comptage et la mesure qui vaut $+\infty$ sur toute partie non vide coïncident sur le π-système formé de $\varnothing$ et des intervalles $]a, b]$ avec $a < b$, puisqu'elles valent toutes deux $0$ sur le vide et $+\infty$ sur chaque intervalle, sans être égales : la première donne $1$ à un singleton.

  - id: m-caratheodory
    etiquette: Carathéodory
    nature: théorème
    titre: Mesures extérieures et théorème de Carathéodory
    texte: |
      Une [[mesure-exterieure|mesure extérieure]] sur $X$ est une application $\mu^* : \lex{ensemble-parties}{\mathcal P}(X) \to \lex{demi-droite-achevee}{[0, +\infty]}$ telle que $\mu^*(\varnothing) = 0$, croissante, et dénombrablement sous-additive : $\mu^*\big(\bigcup_n A_n\big) \leqslant \sum_n \mu^*(A_n)$. Une partie $A$ est **$\mu^*$-mesurable** si, pour toute partie $E$ de $X$,
      $$\mu^*(E) = \mu^*(E \cap A) + \mu^*(E \setminus A).$$
    enonce: |
      Les parties $\mu^*$-mesurables forment une tribu $\mathcal M$, et la restriction de $\mu^*$ à $\mathcal M$ est une mesure. Cette mesure est **complète** : toute partie $N$ telle que $\mu^*(N) = 0$ appartient à $\mathcal M$, et donc aussi toute partie d'un ensemble négligeable.
    preuve: |
      Par sous-additivité, $\mu^*(E) \leqslant \mu^*(E \cap A) + \mu^*(E \setminus A)$ est toujours vrai : seule l'inégalité inverse est à établir. La définition est symétrique en $A$ et $A^c$, et $X \in \mathcal M$.

      *Réunion de deux parties.* Si $A, B \in \mathcal M$ et $E \subset X$, la mesurabilité de $A$, puis celle de $B$ appliquée à $E \setminus A$, donnent
      $$\begin{aligned} \mu^*(E) = \mu^*(E \cap A) &+ \mu^*\big((E \setminus A) \cap B\big) \\ &+ \mu^*\big(E \setminus (A \cup B)\big). \end{aligned}$$
      Comme $E \cap (A \cup B) = (E \cap A) \cup \big((E \setminus A) \cap B\big)$, la sous-additivité donne
      $$\begin{aligned} \mu^*(E) &\geqslant \mu^*\big(E \cap (A \cup B)\big) \\ &\quad + \mu^*\big(E \setminus (A \cup B)\big). \end{aligned}$$
      Donc $\mathcal M$ est stable par réunion finie, et par différence.

      *Réunion dénombrable disjointe.* Soient $A_k \in \mathcal M$ disjointes, $B_n = A_0 \cup \cdots \cup A_{n-1}$ et $B = \bigcup_k A_k$. Par récurrence,
      $$\mu^*(E \cap B_n) = \sum_{k < n} \mu^*(E \cap A_k),$$
      car la mesurabilité de $A_n$ appliquée à $E \cap B_{n+1}$ sépare $E \cap A_n$ et $E \cap B_n$.

      Comme $B_n \in \mathcal M$ et $E \setminus B_n \supset E \setminus B$,
      $$\mu^*(E) \geqslant \sum_{k < n} \mu^*(E \cap A_k) + \mu^*(E \setminus B).$$

      En faisant tendre $n$ vers l'infini puis en utilisant la sous-additivité, $\mu^*(E) \geqslant \mu^*(E \cap B) + \mu^*(E \setminus B)$ : $B \in \mathcal M$.

      Pour $E = B$, on obtient $\mu^*(B) \geqslant \sum_k \mu^*(A_k)$, et l'autre inégalité est la sous-additivité : $\mu^*$ est σ-additive sur $\mathcal M$.

      Une réunion quelconque d'une suite de $\mathcal M$ se ramène à une réunion disjointe, en remplaçant $A_k$ par $A_k \setminus (A_0 \cup \cdots \cup A_{k-1})$.

      *Complétude.* Si $\mu^*(N) = 0$, alors $\mu^*(E \cap N) + \mu^*(E \setminus N) \leqslant 0 + \mu^*(E)$.
    remarques:
      - |
        Le critère de Carathéodory dit que $A$ découpe proprement toute partie $E$, sans perte de mesure extérieure. Ce n'est pas une évidence : pour la mesure extérieure de Lebesgue, il existe des parties $A$ et $E$ pour lesquelles l'inégalité est stricte, comme le montrera l'{{m-vitali|ensemble de Vitali}}.

  - id: m-lebesgue
    etiquette: Mesure de Lebesgue
    nature: théorème
    titre: La mesure de Lebesgue sur ℝ
    texte: |
      Pour $A \subset \lex{ensemble-reels}{\mathbb R}$, on pose
      $$\lambda^*(A) = \inf \sum_{k \in \lex{ensemble-entiers-naturels}{\mathbb N}} (b_k - a_k),$$
      la borne inférieure portant sur les suites d'intervalles $]a_k, b_k]$, avec $a_k \leqslant b_k$, dont la réunion contient $A$. Les parties $\lambda^*$-mesurables sont dites **mesurables au sens de Lebesgue** ; elles forment la tribu de Lebesgue $\mathcal M$, et la [[mesure-lebesgue|mesure de Lebesgue]] $\lambda$ est la restriction de $\lambda^*$ à $\mathcal M$.
    choix: |
      La sous-additivité dénombrable de $\lambda^*$ choisit, pour chaque $n$, un recouvrement presque optimal de $A_n$ : c'est un usage du [[choix-denombrable]]. Il est inévitable : dans le modèle de Feferman et Lévy, où $\mathbb R$ est réunion dénombrable d'ensembles dénombrables, aucune mesure σ-additive ne peut donner à $]a, b]$ la longueur $b - a$.
    enonce: |
      (i) $\lambda^*$ est une mesure extérieure, invariante par translation.

      (ii) $\lambda^*(]a, b]) = b - a$ pour $a \leqslant b$.

      (iii) Tout borélien est mesurable au sens de Lebesgue : $\lex{tribu-borelienne}{\mathcal B}(\mathbb R) \subset \mathcal M$. La mesure $\lambda$ est l'unique mesure sur $\mathcal B(\mathbb R)$ telle que $\lambda(]a, b]) = b - a$ pour tous $a \leqslant b$, et $\lambda(A + t) = \lambda(A)$ pour $A \in \mathcal M$ et $t \in \mathbb R$.

      (iv) Toute partie au plus dénombrable de $\mathbb R$ est négligeable, et $\lambda(\mathbb R) = +\infty$.
    preuve: |
      (i) $\lambda^*(\varnothing) = 0$, au moyen d'intervalles vides $]0, 0]$. Un recouvrement de $B$ recouvre toute partie $A \subset B$, d'où la croissance.

      Pour la sous-additivité, soient $A_n$ avec $\sum_n \lambda^*(A_n) < +\infty$, sans quoi il n'y a rien à montrer, et $\varepsilon > 0$.

      Pour chaque $n$, choisissons un recouvrement $(]a_{n,k}, b_{n,k}])_k$ de $A_n$ tel que
      $$\begin{aligned} &\sum_k (b_{n,k} - a_{n,k}) \\ &\quad \leqslant \lambda^*(A_n) + \varepsilon 2^{-n-1}. \end{aligned}$$

      Réindexée par une bijection de $\mathbb N \times \mathbb N$ sur $\mathbb N$ ({{q-denombrable|ℚ est dénombrable}}), la famille double recouvre $\bigcup A_n$, et sa longueur totale vaut
      $$\begin{aligned} &\sum_n \sum_k (b_{n,k} - a_{n,k}) \\ &\quad \leqslant \sum_n \lambda^*(A_n) + \varepsilon \end{aligned}$$
      par sommation par paquets ({{m-droite-achevee|Sommes dans [0, +∞]}}, (iv)).

      L'invariance par translation vient de ce que les translatés d'un recouvrement de $A$ recouvrent $A + t$, avec la même longueur.

      (ii) L'intervalle se recouvre lui-même, d'où $\lambda^*(]a, b]) \leqslant b - a$.

      Pour l'autre inégalité, montrons d'abord un lemme : si un segment $[c, d]$ est recouvert par $m$ intervalles ouverts $]\alpha_i, \beta_i[$, alors $d - c \leqslant \sum_i (\beta_i - \alpha_i)$.

      Par récurrence sur $m$ : un intervalle $]\alpha_i, \beta_i[$ contient $c$. Si $\beta_i > d$, alors $d - c < \beta_i - \alpha_i$. Sinon $[\beta_i, d]$ n'est pas vide et il est recouvert par les $m - 1$ autres intervalles, d'où $d - \beta_i \leqslant \sum_{j \neq i} (\beta_j - \alpha_j)$, et $d - c = (d - \beta_i) + (\beta_i - c)$ avec $\beta_i - c < \beta_i - \alpha_i$.

      Soit maintenant $(]a_k, b_k])_k$ un recouvrement de $]a, b]$ avec $a < b$, et $0 < \varepsilon < b - a$. Le segment $[a + \varepsilon, b]$ est recouvert par les ouverts $]a_k, b_k + \varepsilon 2^{-k}[$ ; il est compact ({{ar-topo|Topologie de ℝ}}), donc un nombre fini d'entre eux suffit, et le lemme donne $b - a - \varepsilon \leqslant \sum_k (b_k - a_k) + 2\varepsilon$. On fait tendre $\varepsilon$ vers $0$.

      (iii) Soit $H = \,]{-\infty}, c]$ et $E \subset \mathbb R$ avec $\lambda^*(E) < +\infty$. Pour $\varepsilon > 0$, prenons un recouvrement de $E$ par des $]a_k, b_k]$ de longueur totale $\leqslant \lambda^*(E) + \varepsilon$.

      Chaque $]a_k, b_k]$ se coupe en $]a_k, b_k] \cap H$ et $]a_k, b_k] \setminus H$, intervalles du même type dont les longueurs s'ajoutent ; ils recouvrent respectivement $E \cap H$ et $E \setminus H$, d'où
      $$\begin{aligned} \lambda^*(E \cap H) &+ \lambda^*(E \setminus H) \\ &\leqslant \lambda^*(E) + \varepsilon. \end{aligned}$$
      Donc $H \in \mathcal M$.

      Par le théorème de Carathéodory ({{m-caratheodory|Carathéodory}}), $\mathcal M$ est une tribu ; elle contient les demi-droites, donc $\mathcal B(\mathbb R)$ ({{m-tribus|Tribus}}, (iii)).

      L'unicité découle du lemme de Dynkin ({{m-dynkin|Classes monotones}}), appliqué au π-système des intervalles $]a, b]$ et du vide, avec $X_n = \,]{-n}, n]$.

      L'invariance par translation sur $\mathcal M$ vient de celle de $\lambda^*$ et de ce que $\mathcal M$ est invariante par translation, puisque la définition de la mesurabilité l'est.

      (iv) Un singleton $\{x\}$ est contenu dans $]x - \varepsilon, x]$, donc négligeable, et une réunion dénombrable d'ensembles négligeables l'est. Enfin $\lambda(\mathbb R) \geqslant \lambda(]0, n]) = n$ pour tout $n$.
    remarques:
      - |
        L'ensemble $\lex{ensemble-rationnels}{\mathbb Q}$ est dense et négligeable : la mesure ignore la topologie. Recouvrons ses éléments, énumérés $q_0, q_1, \dots$, par des intervalles de longueurs $\varepsilon 2^{-n}$ : leur réunion est un ouvert dense de mesure au plus $2\varepsilon$, dont le complémentaire, de mesure infinie, ne contient aucun intervalle.
      - |
        L'ensemble triadique de Cantor $K = \bigcap_n K_n$, où $K_n$ est la réunion des $2^n$ segments de longueur $3^{-n}$ obtenus en retirant successivement le tiers central, vérifie $\lambda(K) \leqslant (2/3)^n$ pour tout $n$ : il est négligeable.

        ```schema m-lebesgue
        Chaque étape remplace un segment par ses deux tiers extrêmes : $K_n$ est formé de $2^n$ segments de longueur $3^{-n}$, et sa mesure $(2/3)^n$ tend vers $0$.
        ```

        Il n'est pourtant pas dénombrable, puisqu'il est en bijection avec les suites à valeurs dans $\{0, 2\}$ par le développement en base $3$. Les ensembles négligeables ne sont donc pas tous dénombrables.

  - id: m-regularite
    etiquette: Régularité de λ
    nature: proposition
    titre: Parties mesurables au sens de Lebesgue et boréliens
    choix: |
      Pour chaque $n$, la démonstration de (i) choisit un recouvrement presque optimal de $A$, puis, dans le cas d'une mesure infinie, un borélien pour chaque $A \cap \,]{-n}, n]$ : c'est un usage du [[choix-denombrable]], le même que dans la sous-additivité de $\lambda^*$ ({{m-lebesgue|Mesure de Lebesgue}}).
    enonce: |
      Soit $A \subset \lex{ensemble-reels}{\mathbb R}$ mesurable au sens de Lebesgue.

      (i) Il existe un borélien $B \supset A$ tel que $\lambda(B \setminus A) = 0$.

      (ii) Il existe un borélien $C \subset A$ tel que $\lambda(A \setminus C) = 0$.

      Toute partie mesurable au sens de Lebesgue ne diffère donc d'un borélien que par un ensemble [[negligeable|négligeable]].
    preuve: |
      (i) Supposons d'abord $\lambda(A) < +\infty$. Pour tout $n \in \lex{ensemble-entiers-naturels}{\mathbb N}$, la définition de $\lambda^*$ permet de choisir une suite d'intervalles $]a_{n,k}, b_{n,k}]$ qui recouvre $A$ et telle que
      $$\sum_k (b_{n,k} - a_{n,k}) \leqslant \lambda(A) + 2^{-n}.$$

      Posons $U_n = \bigcup_k \,]a_{n,k}, b_{n,k}]$. C'est un borélien qui contient $A$, et la sous-additivité ({{m-mesures|Mesures}}, (ii)), jointe à $\lambda(]a, b]) = b - a$ ({{m-lebesgue|Mesure de Lebesgue}}, (ii)), donne $\lambda(U_n) \leqslant \lambda(A) + 2^{-n}$.

      Le borélien $B = \bigcap_n U_n$ contient $A$. Les boréliens étant mesurables au sens de Lebesgue ({{m-lebesgue|Mesure de Lebesgue}}, (iii)), la croissance de $\lambda$ donne $\lambda(A) \leqslant \lambda(B) \leqslant \lambda(A) + 2^{-n}$ pour tout $n$ ; donc $\lambda(B) = \lambda(A)$. Comme $\lambda(A)$ est fini, $\lambda(B \setminus A) = \lambda(B) - \lambda(A) = 0$ ({{m-mesures|Mesures}}, (i)).

      Dans le cas général, les parties $A_n = A \cap \,]{-n}, n]$ sont mesurables et de mesure au plus $2n$. Choisissons pour chacune un borélien $B_n \supset A_n$ tel que $\lambda(B_n \setminus A_n) = 0$. Le borélien $B = \bigcup_n B_n$ contient $A = \bigcup_n A_n$.

      Un point de $B \setminus A$ appartient à un $B_n$ sans appartenir à $A_n$, si bien que $B \setminus A \subset \bigcup_n (B_n \setminus A_n)$ ; cette réunion est négligeable par sous-additivité, et $B \setminus A$ aussi.

      (ii) On applique (i) au complémentaire $A^c$, qui est mesurable : il existe un borélien $B' \supset A^c$ tel que $\lambda(B' \setminus A^c) = 0$. Alors $C = B'^c$ est un borélien contenu dans $A$, et $A \setminus C = A \cap B' = B' \setminus A^c$ est négligeable.
    remarques:
      - |
        On ne peut pas exiger en général que $B$ soit ouvert. Pour $A = \lex{ensemble-rationnels}{\mathbb Q} \cap [0, 1]$, qui est négligeable, tout ouvert non vide contient un intervalle et a donc une mesure strictement positive : aucun ouvert $B \supset A$ ne vérifie $\lambda(B \setminus A) = 0$. La remarque du nœud {{m-lebesgue|Mesure de Lebesgue}} fournit seulement des ouverts contenant $A$ de mesure arbitrairement petite. C'est pourquoi le borélien construit en (i) est l'intersection d'une suite de réunions d'intervalles, et non l'une d'elles : c'est le passage à l'intersection qui fait disparaître l'excès de mesure.
      - |
        Réciproquement, si $B$ est un borélien et $N$ une partie d'un borélien négligeable, $N$ est mesurable au sens de Lebesgue par complétude ({{m-caratheodory|Carathéodory}}), et $B \cup N$ et $B \setminus N$ le sont aussi. La tribu de Lebesgue est donc formée exactement des boréliens modifiés sur des ensembles négligeables. C'est ce qui permet de ramener aux boréliens un énoncé portant sur la tribu de Lebesgue, comme le fera la démonstration du théorème de Haar ({{f-haar|Système de Haar}}).

  - id: m-vitali
    etiquette: Ensemble de Vitali
    nature: théorème
    titre: Une partie non mesurable
    choix: |
      La construction choisit un représentant dans chaque classe de $\mathbb R/\lex{ensemble-rationnels}{\mathbb Q}$ : elle utilise l'[[axiome-choix]] pour une famille non dénombrable. Solovay a montré en 1970 que, si l'existence d'un cardinal inaccessible est cohérente avec $\mathsf{ZFC}$, il est cohérent avec $\mathsf{ZF}$ et le [[choix-dependant|choix dépendant]] que toute partie de $\lex{ensemble-reels}{\mathbb R}$ soit mesurable au sens de Lebesgue.
    enonce: |
      Il existe une partie de $[0, 1]$ qui n'est pas mesurable au sens de Lebesgue. Plus précisément, aucune mesure définie sur $\lex{ensemble-parties}{\mathcal P}(\mathbb R)$ et invariante par translation ne donne à $[0, 1]$ une mesure finie et non nulle.
    preuve: |
      La relation $x \sim y \iff x - y \in \mathbb Q$ est une relation d'équivalence sur $[0, 1]$. Choisissons une partie $V \subset [0, 1]$ contenant exactement un élément de chaque classe.

      Pour $q \in Q = \mathbb Q \cap [-1, 1]$, les translatés $V + q$ sont deux à deux disjoints : si $v + q = v' + q'$, alors $v \sim v'$, donc $v = v'$ et $q = q'$. Ils sont contenus dans $[-1, 2]$, et leur réunion contient $[0, 1]$ : tout $x \in [0, 1]$ est équivalent à un $v \in V$, et $x - v \in Q$.

      Soit $\mu$ une mesure sur $\mathcal P(\mathbb R)$, invariante par translation, avec $0 < \mu([0, 1]) < +\infty$. L'ensemble $Q$ est dénombrable ({{q-denombrable|ℚ est dénombrable}}), et la σ-additivité donne
      $$\begin{aligned} \mu([0, 1]) &\leqslant \sum_{q \in Q} \mu(V) \\ &\leqslant \mu([-1, 2]) \leqslant 3\,\mu([0, 1]). \end{aligned}$$
      Si $\mu(V) = 0$, la somme est nulle, ce qui contredit la première inégalité ; si $\mu(V) > 0$, elle est infinie, ce qui contredit la dernière.

      Si $V$ appartenait à la tribu de Lebesgue $\mathcal M$, les $V + q$ y appartiendraient aussi, avec $\lambda(V + q) = \lambda(V)$ ({{m-lebesgue|Mesure de Lebesgue}}, (iii)), et le même calcul, mené avec $\lambda$ et $\lambda([0, 1]) = 1$, aboutirait à la même contradiction : $V \notin \mathcal M$.
    remarques:
      - |
        Le théorème explique pourquoi la mesure de Lebesgue est définie sur une tribu, et non sur toutes les parties de $\mathbb R$ : ce n'est pas une limitation de la construction, mais une impossibilité, dès que l'on admet l'axiome du choix.
      - |
        En dimension $3$, le paradoxe de Banach et Tarski (1924), qui utilise lui aussi l'axiome du choix, va plus loin : une boule se découpe en un nombre fini de morceaux qui, déplacés par des isométries, reconstituent deux boules identiques à la première. Aucune mesure finiment additive et invariante par isométrie n'est donc définie sur toutes les parties de $\mathbb R^3$.

  - id: m-mesurables
    etiquette: Fonctions mesurables
    nature: proposition
    titre: Fonctions mesurables
    texte: |
      Soit $(X, \mathcal A)$ un espace mesurable. Une fonction $f : X \to \lex{ensemble-reels}{\mathbb R}$ ou $f : X \to \lex{demi-droite-achevee}{[0, +\infty]}$ est [[fonction-mesurable|mesurable]] si $\{f > a\} = f^{-1}(]a, +\infty])$ appartient à $\mathcal A$ pour tout réel $a$. La fonction indicatrice $\mathbf 1_A$ vaut $1$ sur $A$ et $0$ ailleurs.

      Pour une suite $(u_n)$ de $[0, +\infty]$ ou de $\mathbb R$, $\limsup u_n = \inf_n \sup_{k \geqslant n} u_k$ et $\liminf u_n = \sup_n \inf_{k \geqslant n} u_k$, à valeurs dans la droite achevée.
    enonce: |
      (i) $f$ est mesurable si et seulement si les ensembles $\{f \geqslant a\}$ (ou $\{f < a\}$, ou $\{f \leqslant a\}$) sont mesurables pour tout $a$. Une fonction réelle $f$ est mesurable si et seulement si $f^{-1}(B) \in \mathcal A$ pour tout borélien $B$. $\mathbf 1_A$ est mesurable si et seulement si $A \in \mathcal A$.

      (ii) Si les $f_n$ sont mesurables, $\sup_n f_n$, $\inf_n f_n$, $\limsup f_n$, $\liminf f_n$ le sont, ainsi que la limite simple de $(f_n)$ lorsqu'elle existe.

      (iii) Si $f, g$ sont mesurables à valeurs dans $[0, +\infty]$, $f + g$ l'est. Si $f, g$ sont réelles mesurables et $\varphi : \mathbb R \to \mathbb R$ continue, $\varphi \circ f$, $f + g$, $fg$, $f^+ = \max(f, 0)$, $f^- = \max(-f, 0)$ et $|f|$ sont mesurables.
    preuve: |
      (i) $\{f \geqslant a\} = \bigcap_n \{f > a - \frac1{n+1}\}$, $\{f < a\}$ en est le complémentaire, et $\{f > a\} = \bigcup_n \{f \geqslant a + \frac1{n+1}\}$ ; de même pour les autres. Pour $f$ réelle, $f^{-1}(]{-\infty}, c]) = \{f \leqslant c\}$, et les demi-droites engendrent $\lex{tribu-borelienne}{\mathcal B}(\mathbb R)$ ({{m-tribus|Tribus}}, (iii) et (iv)). Enfin $\{\mathbf 1_A > a\}$ vaut $X$, $A$ ou $\varnothing$.

      (ii) $\{\sup_n f_n > a\} = \bigcup_n \{f_n > a\}$ et $\{\inf_n f_n < a\} = \bigcup_n \{f_n < a\}$. Les limites supérieure et inférieure sont des $\inf$ de $\sup$ et des $\sup$ de $\inf$, et la limite, quand elle existe, leur est égale.

      (iii) Si $f(x) + g(x) > a$, il existe un rationnel $r$ tel que $f(x) > r$ et $g(x) > a - r$ : si $f(x) = +\infty$, tout rationnel $r > a$ convient ; si $g(x) = +\infty$, tout rationnel $r < f(x)$ convient ; sinon, on prend $r \in \,]a - g(x), f(x)[$ par densité de $\lex{ensemble-rationnels}{\mathbb Q}$. Donc
      $$\begin{aligned} &\{f + g > a\} \\ &\quad = \bigcup_{r \in \mathbb Q} \big(\{f > r\} \cap \{g > a - r\}\big), \end{aligned}$$
      réunion dénombrable.

      Pour $\varphi$ continue, $\varphi^{-1}(]a, +\infty[)$ est un ouvert, donc un borélien, et $(\varphi \circ f)^{-1}(]a, +\infty[) = f^{-1}\big(\varphi^{-1}(]a, +\infty[)\big)$.

      Le cas réel de $f + g$ se traite comme le premier, et
      $$fg = \frac14\big((f + g)^2 - (f - g)^2\big),$$
      le carré, l'opposé, $\max(\cdot, 0)$ et la valeur absolue étant continus.
    remarques:
      - |
        L'erreur la plus répandue est de croire qu'une limite simple de fonctions continues est continue. Les fonctions $x \mapsto \max(0, 1 - n|x|)$ sont continues et convergent simplement vers $\mathbf 1_{\{0\}}$, qui ne l'est pas. La mesurabilité, elle, passe à la limite : c'est l'une des raisons pour lesquelles la théorie de Lebesgue se prête mieux aux passages à la limite que celle de Riemann.

        ```schema m-mesurables
        Les tentes bleues $f_1$, $f_2$, $f_4$ et $f_8$, où $f_n(x) = \max(0, 1 - n|x|)$, valent $1$ en $0$ et s'annulent hors de $]{-\frac1n}, \frac1n[$. Leur limite simple, en rouge, vaut $1$ en $0$ et $0$ partout ailleurs : elle n'est pas continue en $0$.
        ```

  - id: m-etagees
    etiquette: Fonctions étagées
    nature: proposition
    titre: Approximation par des fonctions étagées
    texte: |
      Une [[fonction-etagee|fonction étagée]] est une fonction mesurable $s : X \to \lex{ensemble-reels}{\mathbb R}$ qui ne prend qu'un nombre fini de valeurs. Si $c_1, \dots, c_m$ sont ses valeurs distinctes et $A_i = s^{-1}(\{c_i\})$, alors $s = \sum_i c_i \mathbf 1_{A_i}$, les $A_i$ formant une partition mesurable de $X$ : c'est l'**écriture canonique** de $s$.
    enonce: |
      Toute fonction mesurable $f : X \to \lex{demi-droite-achevee}{[0, +\infty]}$ est la limite simple d'une suite croissante $(s_n)$ de fonctions étagées positives. On peut prendre
      $$\begin{aligned} s_n = {}&\sum_{k=0}^{n2^n - 1} \frac{k}{2^n}\, \mathbf 1_{\{k2^{-n} \leqslant f < (k+1)2^{-n}\}} \\ &+ n\, \mathbf 1_{\{f \geqslant n\}}, \end{aligned}$$
      et la convergence est uniforme sur toute partie où $f$ est bornée.

      ```schema m-etagees
      Pour $f(x) = \frac12 + 3x - x^2$ sur $[0, 3]$, dont le maximum vaut $\frac{11}4$, les fonctions $s_1$ (vert) et $s_2$ (bleu) se lisent sur l'axe des valeurs et sont tronquées à $1$ et à $2$. L'ensemble $\{\frac32 \leqslant f < \frac74\}$, où $s_2$ vaut $\frac32$, est la réunion des deux intervalles rouges $[\frac{3 - \sqrt5}2, \frac12[$ et $]\frac52, \frac{3 + \sqrt5}2]$ : découper les valeurs ne découpe pas l'axe des abscisses en intervalles consécutifs.
      ```
    preuve: |
      Les ensembles qui interviennent sont mesurables ({{m-mesurables|Fonctions mesurables}}, (i)), donc $s_n$ est étagée, et $0 \leqslant s_n \leqslant f$.

      Si $f(x) < n$, $s_n(x) = 2^{-n} \lfloor 2^n f(x) \rfloor$, où $\lfloor t \rfloor$ désigne la partie entière, qui existe parce que $\mathbb R$ est [[archimedien]] ; alors $0 \leqslant f(x) - s_n(x) < 2^{-n}$. Si $f(x) = +\infty$, $s_n(x) = n$. Dans les deux cas $s_n(x) \to f(x)$, uniformément sur $\{f \leqslant M\}$ dès que $n > M$.

      *Croissance.* Si $f(x) < n$, l'intervalle $[k2^{-n}, (k+1)2^{-n}[$ qui contient $f(x)$ est la réunion des deux intervalles de rang $n + 1$ d'extrémités $2k\,2^{-n-1}$, $(2k+1)2^{-n-1}$ et $(2k+2)2^{-n-1}$, donc $s_{n+1}(x) \geqslant k2^{-n} = s_n(x)$. Si $f(x) \geqslant n$, $s_{n+1}(x) \geqslant n$, puisque $s_{n+1}(x)$ vaut $n + 1$ si $f(x) \geqslant n + 1$, et $2^{-n-1}\lfloor 2^{n+1} f(x) \rfloor \geqslant n$ sinon.
    remarques:
      - |
        La construction découpe l'axe des **valeurs**, et non l'axe des abscisses comme le fait l'intégrale de Riemann. Lebesgue comparait sa méthode à celle d'un commerçant qui compte sa recette en rangeant les pièces par valeur avant de les additionner, au lieu de les additionner dans l'ordre où il les a reçues.

  - id: m-integrale
    etiquette: Intégrale positive
    nature: définition
    titre: Intégrale des fonctions positives
    texte: |
      Soit $(X, \mathcal A, \mu)$ un espace mesuré. Pour une fonction étagée positive d'écriture canonique $s = \sum_i c_i \mathbf 1_{A_i}$, on pose $\int s \, d\mu = \sum_i c_i\, \mu(A_i)$. Pour $f : X \to \lex{demi-droite-achevee}{[0, +\infty]}$ mesurable, l'[[integrale-lebesgue|intégrale]] est
      $$\begin{aligned} \int f \, d\mu = \sup\Big\{&\int s \, d\mu : s \text{ étagée}, \\ &0 \leqslant s \leqslant f\Big\}, \end{aligned}$$
      et, pour $A \in \mathcal A$, $\int_A f \, d\mu = \int f \mathbf 1_A \, d\mu$.
    enonce: |
      (i) Si $s = \sum_j d_j \mathbf 1_{B_j}$ avec des $B_j \in \mathcal A$ deux à deux disjoints et $d_j \geqslant 0$, alors $\int s \, d\mu = \sum_j d_j\, \mu(B_j)$. Sur les fonctions étagées positives, l'intégrale est additive, positivement homogène et croissante, et les deux définitions coïncident.

      (ii) L'intégrale est croissante : $f \leqslant g$ entraîne $\int f \leqslant \int g$.

      (iii) *Inégalité de Markov.* Pour $a > 0$, $\mu(\{f \geqslant a\}) \leqslant \frac1a \int f \, d\mu$.

      (iv) $\int f \, d\mu = 0$ si et seulement si $f = 0$ presque partout. Si $\int f \, d\mu < +\infty$, alors $f < +\infty$ presque partout.
    preuve: |
      (i) Les points hors des $B_j$ sont de valeur nulle. En regroupant les $B_j$ selon leur valeur $d_j$, et en utilisant l'additivité de $\mu$, on retrouve l'écriture canonique.

      Si $s = \sum_i c_i \mathbf 1_{A_i}$ et $t = \sum_j d_j \mathbf 1_{B_j}$ sont canoniques, les $A_i \cap B_j$ forment une partition sur laquelle $s + t$ vaut $c_i + d_j$ ; par ce qui précède et l'additivité,
      $$\begin{aligned} \int(s + t) &= \sum_{i,j} (c_i + d_j)\,\mu(A_i \cap B_j) \\ &= \int s + \int t. \end{aligned}$$

      Si $s \leqslant t$, on a $c_i \leqslant d_j$ dès que $A_i \cap B_j \neq \varnothing$, d'où $\int s \leqslant \int t$. Cette croissance montre que, pour $f = s$ étagée, la borne supérieure de la définition est atteinte en $s$.

      (ii) Toute fonction étagée majorée par $f$ l'est par $g$.

      (iii) $a\mathbf 1_{\{f \geqslant a\}}$ est étagée et majorée par $f$.

      ```schema m-integrale
      Pour la mesure de comptage $\mu$ sur $\{0, \dots, 7\}$ et $a = 3$, les barres rouges, de hauteur $a$ sur $\{f \geqslant a\} = \{1, 2, 4, 5\}$, restent sous les barres grises de $f$, et recouvrent exactement la barre grise en $k = 1$ et $k = 5$, où $f = 3$. Les barres étant de largeur $1$, l'aire rouge $a\,\mu(\{f \geqslant a\}) = 12$ est donc au plus l'aire grise $\int f \, d\mu = 19$.
      ```

      (iv) Si $\int f = 0$, (iii) donne $\mu(\{f \geqslant \frac1{n+1}\}) = 0$ pour tout $n$, et $\{f > 0\}$ est la réunion de ces ensembles. Réciproquement, si $N = \{f > 0\}$ est négligeable, toute étagée $s \leqslant f$ a ses valeurs non nulles sur des parties de $N$, et $\int s = 0$. Enfin, si $A = \{f = +\infty\}$ n'est pas négligeable, $\int f \geqslant n\,\mu(A)$ pour tout $n$.
    remarques:
      - |
        Pour la mesure de comptage sur $\lex{ensemble-entiers-naturels}{\mathbb N}$, une fonction positive est une suite $(a_n)$, et son intégrale est $\sum_n a_n$ au sens du nœud {{m-droite-achevee|Sommes dans [0, +∞]}} : les séries à termes positifs sont des intégrales.

  - id: m-beppo-levi
    etiquette: Convergence monotone
    nature: théorème
    titre: Théorème de convergence monotone (Beppo Levi)
    enonce: |
      Si $(f_n)$ est une suite croissante de fonctions mesurables positives, de limite $f$, alors
      $$\int f \, d\mu = \lim_n \int f_n \, d\mu.$$
      Par conséquent :

      (i) $\int (f + g) = \int f + \int g$ et $\int cf = c \int f$ pour $f, g$ mesurables positives et $c \in \lex{demi-droite-achevee}{[0, +\infty]}$ ;

      (ii) $\int \sum_n f_n \, d\mu = \sum_n \int f_n \, d\mu$ pour toute suite de fonctions mesurables positives ;

      (iii) pour $f$ mesurable positive, $A \mapsto \int_A f \, d\mu$ est une mesure sur $\mathcal A$.
    preuve: |
      $f = \sup_n f_n$ est mesurable, et la suite $\int f_n$, croissante et majorée par $\int f$, a une limite $L \leqslant \int f$.

      Soit $s = \sum_i c_i \mathbf 1_{A_i}$ étagée avec $0 \leqslant s \leqslant f$, et $c \in \,]0, 1[$. Les ensembles $E_n = \{f_n \geqslant cs\}$ croissent et recouvrent $X$ : si $s(x) = 0$, $x \in E_0$ ; sinon $cs(x) < s(x) \leqslant f(x) = \lim f_n(x)$.

      Alors
      $$\int f_n \geqslant \int c\,s\,\mathbf 1_{E_n} = c \sum_i c_i\, \mu(A_i \cap E_n),$$
      qui tend vers $c \int s$ par continuité croissante de $\mu$ et {{m-droite-achevee|Sommes dans [0, +∞]}}, (ii).

      Donc $L \geqslant c\int s$, puis $L \geqslant \int s$ en faisant tendre $c$ vers $1$, et $L \geqslant \int f$.

      ```schema m-beppo-levi
      Sur $]0, 2]$, avec $f(x) = 1 + x(2 - x)$, la fonction étagée $s$ (vert) vaut $\frac32$ sur $\{f \geqslant \frac32\}$ et $1$ ailleurs, et $cs$ (pointillé vert) est prise avec $c = \frac34$. Les fonctions bleues $f_n = f \cdot \big(1 - (1 - \frac x2)^n\big)$ croissent vers $f$, et les ensembles rouges $E_2 \subset E_6$, où $f_n \geqslant cs$, croissent eux aussi sans être forcément des intervalles : $E_6$ a deux morceaux, coupés au saut de $cs$.
      ```

      (i) On approche $f$ et $g$ par des suites croissantes d'étagées $s_n$ et $t_n$ ({{m-etagees|Fonctions étagées}}) ; $s_n + t_n$ croît vers $f + g$, et l'additivité sur les étagées passe à la limite par le théorème et {{m-droite-achevee|Sommes dans [0, +∞]}}, (ii). De même pour $cf$.

      (ii) Les sommes partielles croissent vers $\sum_n f_n$ ; on applique le théorème et (i).

      (iii) Si les $A_n$ sont disjoints, $f\mathbf 1_{\bigcup A_n} = \sum_n f\mathbf 1_{A_n}$, et l'on applique (ii).
    remarques:
      - |
        La croissance est essentielle. La suite $f_n = \mathbf 1_{[n, +\infty[}$ décroît vers $0$ sur $\lex{ensemble-reels}{\mathbb R}$, mais $\int f_n \, d\lambda = +\infty$ pour tout $n$ : la masse ne disparaît pas, elle s'enfuit à l'infini.
      - |
        Pour la mesure de comptage, (ii) redonne l'interversion $\sum_m \sum_n a_{mn} = \sum_n \sum_m a_{mn}$ pour des termes positifs, déjà obtenue directement au nœud {{m-droite-achevee|Sommes dans [0, +∞]}}.

  - id: m-fatou
    etiquette: Lemme de Fatou
    nature: lemme
    titre: Lemme de Fatou
    enonce: |
      Pour toute suite $(f_n)$ de fonctions mesurables positives,
      $$\int \liminf_n f_n \, d\mu \leqslant \liminf_n \int f_n \, d\mu.$$
    preuve: |
      Posons $g_n = \inf_{k \geqslant n} f_k$, mesurable ; la suite $(g_n)$ croît vers $\liminf f_n$. Pour $k \geqslant n$, $g_n \leqslant f_k$, donc $\int g_n \leqslant \inf_{k \geqslant n} \int f_k$. Par convergence monotone ({{m-beppo-levi|Convergence monotone}}),
      $$\begin{aligned} \int \liminf f_n &= \lim_n \int g_n \\ &\leqslant \lim_n \inf_{k \geqslant n} \int f_k \\ &= \liminf \int f_n. \end{aligned}$$
    remarques:
      - |
        L'inégalité peut être stricte. Pour $f_n = \mathbf 1_{]n, n+1]}$ sur $\lex{ensemble-reels}{\mathbb R}$, chaque $\int f_n \, d\lambda$ vaut $1$, mais $\liminf f_n = 0$ : c'est encore une fuite de masse à l'infini. Pour $f_n = n\mathbf 1_{]0, 1/n]}$, la masse se concentre en $0$, et l'inégalité est de même stricte.

        ```schema m-fatou
        À gauche, la bosse $f_n = \mathbf 1_{]n, n+1]}$ glisse vers l'infini ; à droite, $f_n = n\mathbf 1_{]0, 1/n]}$ s'écrase contre $0$. Chaque rectangle a une aire $1$, alors que la limite simple, en rouge sur l'axe, est nulle : la masse perdue à la limite rend l'inégalité stricte.
        ```

  - id: m-integrables
    etiquette: Fonctions intégrables
    nature: définition
    titre: Fonctions intégrables
    texte: |
      Une fonction mesurable $f : X \to \lex{ensemble-reels}{\mathbb R}$ est [[integrable-lebesgue|intégrable]] si $\int |f| \, d\mu < +\infty$. On pose alors $\int f \, d\mu = \int f^+ \, d\mu - \int f^- \, d\mu$, différence de deux réels, puisque $f^+, f^- \leqslant |f|$. On note $\lex{espace-fonctions-integrables}{\mathcal L^1}(\mu)$ l'ensemble des fonctions intégrables.
    enonce: |
      (i) $\mathcal L^1(\mu)$ est un $\mathbb R$-espace vectoriel, sur lequel $f \mapsto \int f \, d\mu$ est linéaire et croissante.

      (ii) $\big|\int f \, d\mu\big| \leqslant \int |f| \, d\mu$.

      (iii) Si $f = g$ presque partout, $f$ est intégrable si et seulement si $g$ l'est, et $\int f = \int g$.
    preuve: |
      (i) $|f + g| \leqslant |f| + |g|$ et $|cf| = |c|\,|f|$, d'où la stabilité.

      Si $h = f + g$, alors $h^+ - h^- = f^+ - f^- + g^+ - g^-$, soit
      $$h^+ + f^- + g^- = h^- + f^+ + g^+.$$
      En intégrant par additivité des intégrales positives ({{m-beppo-levi|Convergence monotone}}, (i)), puis en réordonnant des termes finis, $\int h = \int f + \int g$.

      Pour $c \geqslant 0$, $(cf)^\pm = cf^\pm$ ; pour $c = -1$, $f^+$ et $f^-$ s'échangent. Si $f \leqslant g$, $\int g - \int f = \int (g - f) \geqslant 0$.

      (ii) $\big|\int f^+ - \int f^-\big| \leqslant \int f^+ + \int f^- = \int |f|$.

      (iii) $|f - g|$ est nulle presque partout, donc d'intégrale nulle ({{m-integrale|Intégrale positive}}, (iv)), et $|f| \leqslant |g| + |f - g|$ ; par (ii), $\big|\int f - \int g\big| \leqslant \int |f - g| = 0$.
    remarques:
      - |
        Par (iii), l'intégrale ne voit pas les ensembles négligeables. C'est pourquoi l'on identifie souvent deux fonctions égales presque partout : l'espace quotient $L^1(\mu)$, muni de $\|f\|_1 = \int |f|$, est un espace normé complet, objet central de l'{{anf|analyse fonctionnelle}}.

  - id: m-convergence-dominee
    etiquette: Convergence dominée
    nature: théorème
    titre: Théorème de convergence dominée
    choix: |
      Le premier point, pour une suite de fonctions, n'utilise aucun choix. Les intégrales à paramètre de (ii) et (iii), en revanche, passent des suites $t_n \to t_0$ à la continuité, et des suites de taux d'accroissement à la dérivabilité, par le sens réciproque de la caractérisation séquentielle ({{c-sequentielle|Caractérisation séquentielle}}) : elles en héritent le [[choix-denombrable]].
    enonce: |
      (i) Soit $(f_n)$ une suite de fonctions mesurables réelles qui converge simplement vers $f$. S'il existe $g$ intégrable telle que $|f_n| \leqslant g$ pour tout $n$, alors $f$ est intégrable,
      $$\begin{aligned} &\int |f_n - f| \, d\mu \longrightarrow 0, \\ &\int f_n \, d\mu \longrightarrow \int f \, d\mu. \end{aligned}$$

      (ii) *Intégrales à paramètre.* Soit $I$ un intervalle et $F(t) = \int h(t, x) \, d\mu(x)$, où $h(t, \cdot)$ est mesurable pour tout $t \in I$. S'il existe $g$ intégrable telle que $|h(t, x)| \leqslant g(x)$ pour tous $t, x$, et si $t \mapsto h(t, x)$ est continue en $t_0$ pour tout $x$, alors $F$ est continue en $t_0$.

      (iii) *Dérivation sous l'intégrale.* Avec les notations de (ii), si $t \mapsto h(t, x)$ est dérivable sur $I$ pour tout $x$, avec $|\partial_t h(t, x)| \leqslant g(x)$, alors $F$ est dérivable et $F'(t) = \int \partial_t h(t, x) \, d\mu(x)$.
    preuve: |
      (i) $f$ est mesurable, comme limite simple, et $|f| \leqslant g$, donc intégrable. Les fonctions $2g - |f_n - f|$ sont positives ; par le lemme de Fatou ({{m-fatou|Lemme de Fatou}}) et la linéarité de l'intégrale sur $\lex{espace-fonctions-integrables}{\mathcal L^1}$,
      $$\begin{aligned} \int 2g &\leqslant \liminf_n \int \big(2g - |f_n - f|\big) \\ &= \int 2g - \limsup_n \int |f_n - f|. \end{aligned}$$
      Comme $\int 2g$ est fini, $\limsup \int |f_n - f| \leqslant 0$. Enfin $\big|\int f_n - \int f\big| \leqslant \int |f_n - f|$.

      (ii) Par la caractérisation séquentielle ({{c-sequentielle|Caractérisation séquentielle}}), il suffit de voir que $F(t_n) \to F(t_0)$ pour toute suite $t_n \to t_0$ ; c'est (i) appliqué à $f_n = h(t_n, \cdot)$.

      (iii) Pour $t_n \to t$, $t_n \neq t$, les fonctions
      $$x \mapsto \frac{h(t_n, x) - h(t, x)}{t_n - t}$$
      sont mesurables et convergent vers $\partial_t h(t, x)$, qui est donc mesurable. Elles sont dominées par $g$ : par le théorème de Rolle ({{ar-deriv|Dérivabilité}}), appliqué à $s \mapsto h(s, x) - h(t, x) - (s - t)q$ avec $q$ le taux d'accroissement, celui-ci vaut $\partial_t h(c, x)$ pour un $c$ entre $t$ et $t_n$. Le point (i) donne la convergence des taux d'accroissement de $F$.
    remarques:
      - |
        La domination ne peut pas être omise. La suite $f_n = n\mathbf 1_{]0, 1/n]}$ converge simplement vers $0$ sur $\lex{ensemble-reels}{\mathbb R}$, mais $\int f_n \, d\lambda = 1$ pour tout $n$ ; aucune fonction intégrable ne majore toutes les $f_n$, puisque $\sup_n f_n$ vaut au moins $\frac1{2x}$ sur $]0, 1]$, fonction dont l'intégrale sur $]0, 1]$ est infinie.

        ```schema m-convergence-dominee
        Les rectangles bleus sont les graphes de $f_1$, $f_2$, $f_3$ et $f_5$, tous d'aire $1$. Leur enveloppe $\sup_n f_n$, en rouge, vaut $k$ sur $]\frac1{k+1}, \frac1k]$ et reste au-dessus de la courbe verte $\frac1{2x}$, d'aire infinie : aucune fonction intégrable ne peut la majorer.
        ```
      - |
        Le théorème reste vrai si la convergence et la domination n'ont lieu que presque partout : on modifie les fonctions sur un ensemble négligeable, ce qui ne change aucune intégrale ({{m-integrables|Fonctions intégrables}}, (iii)). C'est cette souplesse que l'intégrale de Riemann ne possède pas.

  - id: m-riemann
    etiquette: Riemann et Lebesgue
    nature: théorème
    titre: L'intégrale de Lebesgue prolonge celle de Riemann
    enonce: |
      Soit $f : [a, b] \to \lex{ensemble-reels}{\mathbb R}$ [[riemann-integrable|intégrable au sens de Riemann]]. Alors $f$ est mesurable pour la tribu de Lebesgue, intégrable pour $\lambda$, et
      $$\int_{[a, b]} f \, d\lambda = \int_a^b f(x)\, dx.$$
    preuve: |
      Soit $M$ un majorant de $|f|$. Pour $n \in \lex{ensemble-entiers-naturels}{\mathbb N}$, découpons $[a, b]$ en $2^n$ segments égaux $I_k$, de longueur $\delta_n = (b - a)2^{-n}$. Soit $\varphi_n$ la fonction égale à $f$ aux points de découpage et à $\inf_{I_k} f$ sur l'intérieur de $I_k$, et $\psi_n$ définie de même avec $\sup$.

      Ce sont des fonctions en escalier, boréliennes, et $\varphi_n \leqslant f \leqslant \psi_n$. Les points de découpage de rang $n$ le sont aussi de rang $n + 1$, et un segment plus petit a un $\inf$ plus grand : $(\varphi_n)$ croît et $(\psi_n)$ décroît.

      ```schema m-riemann
      Pour $f(x) = 1 + x - \frac{x^3}3$ sur $[0, 2]$, les fonctions $\varphi_3$ et $\psi_3$ (bleu, bande teintée entre elles) encadrent $f$ de plus près que $\varphi_2$ et $\psi_2$ (gris, pointillés) : sur chaque moitié d'un segment coupé en deux, l'$\inf$ ne peut que croître et le $\sup$ que décroître. Sur $[\frac34, \frac54]$, le $\sup$ est atteint à l'intérieur, au maximum $f(1) = \frac53$, et non aux bornes.
      ```

      Pour une fonction en escalier, l'intégrale du nœud {{ar-riemann|Intégrale de Riemann}} coïncide avec l'intégrale par rapport à $\lambda$, puisque $\lambda(]x_i, x_{i+1}[) = x_{i+1} - x_i$ et que les points sont négligeables.

      Soit $\varepsilon > 0$, et $\varphi \leqslant f \leqslant \psi$ des fonctions en escalier, adaptées à une subdivision à $p$ points, avec $\int (\psi - \varphi) < \varepsilon$.

      Sur un $I_k$ dont l'adhérence ne contient aucun point de cette subdivision, $\varphi$ et $\psi$ sont constantes, et $\psi_n - \varphi_n \leqslant \psi - \varphi$ à l'intérieur de $I_k$. Les autres $I_k$ sont au plus $2p$, et sur chacun $\psi_n - \varphi_n \leqslant 2M$. Donc
      $$\int (\psi_n - \varphi_n) \leqslant \varepsilon + 4pM\delta_n < 2\varepsilon$$
      pour $n$ grand.

      Soient $u = \lim \varphi_n$ et $v = \lim \psi_n$, boréliennes, avec $u \leqslant f \leqslant v$. Par convergence monotone ({{m-beppo-levi|Convergence monotone}}), appliquée à $\psi_0 - \psi_n$ et à $\varphi_n - \varphi_0$, $\int (v - u) \, d\lambda = \lim \int (\psi_n - \varphi_n) = 0$, donc $u = v$ presque partout.

      L'ensemble $\{f \neq u\}$ est contenu dans le négligeable $\{u \neq v\}$ ; la tribu de Lebesgue étant complète ({{m-caratheodory|Carathéodory}}), $f$ est mesurable. Enfin $\int f \, d\lambda = \int u \, d\lambda = \lim \int \varphi_n$, qui est la limite des sommes inférieures, donc l'intégrale de Riemann de $f$.
    remarques:
      - |
        La réciproque est fausse. La fonction $\mathbf 1_{\lex{ensemble-rationnels}{\mathbb Q}}$ restreinte à $[0, 1]$ est intégrable pour $\lambda$, d'intégrale nulle puisque $\mathbb Q$ est négligeable, mais elle n'est pas intégrable au sens de Riemann : toute fonction en escalier qui la majore vaut au moins $1$ sauf en un nombre fini de points, toute fonction qui la minore au plus $0$.
      - |
        L'erreur la plus répandue est de croire qu'une fonction intégrable au sens de Riemann est borélienne. Ce n'est pas le cas : l'indicatrice d'une partie non borélienne de l'ensemble de Cantor, qui est négligeable, est intégrable au sens de Riemann, d'intégrale nulle. C'est pourquoi l'énoncé porte sur la tribu de Lebesgue, qui est complète.

  - id: m-produit
    etiquette: Mesure produit
    nature: théorème
    titre: Tribu produit et mesure produit
    texte: |
      Soient $(X, \mathcal A, \mu)$ et $(Y, \mathcal B, \nu)$ deux espaces mesurés σ-finis. La **tribu produit** $\mathcal A \otimes \mathcal B$ est la tribu sur $X \times Y$ engendrée par les **pavés** $A \times B$, $A \in \mathcal A$, $B \in \mathcal B$. Pour $E \subset X \times Y$ et $x \in X$, la **section** est $E_x = \{y : (x, y) \in E\}$ ; on définit de même $E^y$.
    enonce: |
      (i) Pour $E \in \mathcal A \otimes \mathcal B$, chaque section $E_x$ appartient à $\mathcal B$, et chaque $E^y$ à $\mathcal A$.

      (ii) Les fonctions $x \mapsto \nu(E_x)$ et $y \mapsto \mu(E^y)$ sont mesurables.

      (iii) Il existe une unique mesure $\mu \otimes \nu$ sur $\mathcal A \otimes \mathcal B$ telle que $(\mu \otimes \nu)(A \times B) = \mu(A)\,\nu(B)$, la [[mesure-produit|mesure produit]], et
      $$\begin{aligned} (\mu \otimes \nu)(E) &= \int_X \nu(E_x)\, d\mu(x) \\ &= \int_Y \mu(E^y)\, d\nu(y). \end{aligned}$$
    preuve: |
      (i) L'ensemble des $E$ dont toutes les sections sont dans $\mathcal B$ est une tribu, car le passage aux sections commute avec le complémentaire et les réunions, et il contient les pavés, dont les sections sont $B$ ou $\varnothing$.

      (ii) Supposons d'abord $\nu$ finie. L'ensemble $\mathcal D$ des $E$ tels que $x \mapsto \nu(E_x)$ soit mesurable contient les pavés, pour lesquels $\nu(E_x) = \nu(B)\mathbf 1_A(x)$.

      C'est une classe monotone : si $E \subset F$, $\nu((F \setminus E)_x) = \nu(F_x) - \nu(E_x)$, la mesure étant finie, et une réunion croissante donne une limite croissante de fonctions mesurables.

      Les pavés forment un π-système, puisque $(A \times B) \cap (A' \times B') = (A \cap A') \times (B \cap B')$ ; le lemme de Dynkin ({{m-dynkin|Classes monotones}}) donne $\mathcal D = \mathcal A \otimes \mathcal B$.

      Si $\nu$ est σ-finie, avec $Y_n$ croissants de mesure finie, $\nu(E_x) = \lim_n \nu(E_x \cap Y_n)$ est une limite de fonctions mesurables, par le cas fini appliqué à $\nu(\cdot \cap Y_n)$.

      (iii) Posons $\pi(E) = \int \nu(E_x)\, d\mu(x)$. Si les $E_n$ sont disjoints, leurs sections le sont, et $\nu\big((\bigcup E_n)_x\big) = \sum_n \nu((E_n)_x)$ ; la convergence monotone ({{m-beppo-levi|Convergence monotone}}, (ii)) montre que $\pi$ est σ-additive. On a $\pi(A \times B) = \int \nu(B)\mathbf 1_A \, d\mu = \mu(A)\nu(B)$.

      La formule symétrique définit une mesure $\pi'$ ayant les mêmes valeurs sur les pavés. Si $X_n$ et $Y_n$ sont croissants de mesures finies et de réunions $X$ et $Y$, les pavés $X_n \times Y_n$ croissent vers $X \times Y$ ; l'unicité du nœud {{m-dynkin|Classes monotones}} donne $\pi = \pi'$, et toute mesure ayant les mêmes valeurs sur les pavés leur est égale.
    remarques:
      - |
        La mesure de Lebesgue du plan est $\lambda \otimes \lambda$ sur $\lex{tribu-borelienne}{\mathcal B}(\lex{ensemble-reels}{\mathbb R}) \otimes \mathcal B(\mathbb R)$, qui est la tribu borélienne de $\lex{n-uplet}{\mathbb R^2}$, les ouverts du plan étant réunions dénombrables de pavés à extrémités rationnelles. La formule (iii) est le principe de Cavalieri : l'aire d'une partie du plan est l'intégrale des longueurs de ses sections verticales. La mesure de Lebesgue de $\mathbb R^n$ et la formule du changement de variables sont établies plus loin, au chapitre {{edo-changement|Changement de variables}} des équations différentielles.

        ```schema m-produit
        Pour $E = \{(x, y) : 0 \leqslant x \leqslant 1,\ x^2 \leqslant y \leqslant x\}$, les sections verticales $E_x = [x^2, x]$ et les sections horizontales $E^y = [y, \sqrt y]$ donnent la même aire : $\int_0^1 (x - x^2)\,dx = \int_0^1 (\sqrt y - y)\,dy = \frac16$.
        ```

  - id: m-fubini
    etiquette: Tonelli, Fubini
    nature: théorème
    titre: Théorèmes de Tonelli et de Fubini
    enonce: |
      Soient $\mu$ et $\nu$ σ-finies.

      (i) *Tonelli.* Si $f : X \times Y \to \lex{demi-droite-achevee}{[0, +\infty]}$ est $\mathcal A \otimes \mathcal B$-mesurable, les fonctions $y \mapsto f(x, y)$ et $x \mapsto \int f(x, y)\, d\nu(y)$ sont mesurables, de même en échangeant les rôles, et
      $$\begin{aligned} &\int f \, d(\mu \otimes \nu) \\ &= \int_X \Big(\int_Y f(x, y)\, d\nu(y)\Big) d\mu(x) \\ &= \int_Y \Big(\int_X f(x, y)\, d\mu(x)\Big) d\nu(y). \end{aligned}$$

      (ii) *Fubini.* Si $f$ est intégrable pour $\mu \otimes \nu$, alors $f(x, \cdot)$ est $\nu$-intégrable pour $\mu$-presque tout $x$ ; la fonction $x \mapsto \int f(x, y)\, d\nu(y)$, définie presque partout et prolongée par $0$, est $\mu$-intégrable ; et les égalités de (i) ont lieu.
    preuve: |
      (i) Pour $f = \mathbf 1_E$, c'est le théorème de la {{m-produit|mesure produit}}. Par linéarité, l'énoncé vaut pour les fonctions étagées positives.

      Pour $f$ quelconque, soit $(s_n)$ une suite croissante d'étagées positives de limite $f$ ({{m-etagees|Fonctions étagées}}). Pour chaque $x$, $s_n(x, \cdot)$ croît vers $f(x, \cdot)$, qui est mesurable puisque $\{f(x, \cdot) > a\} = \{f > a\}_x$ ; par convergence monotone, $\int s_n(x, y)\, d\nu(y)$ croît vers $\int f(x, y)\, d\nu(y)$, qui est donc mesurable en $x$, et une seconde application de la convergence monotone donne l'égalité.

      (ii) On applique (i) à $f^+$ et $f^-$, d'intégrales finies. Les fonctions $F^\pm(x) = \int f^\pm(x, y)\, d\nu(y)$ sont d'intégrale finie, donc finies hors d'un ensemble négligeable $N$ ({{m-integrale|Intégrale positive}}, (iv)), qui est mesurable. Hors de $N$, $f(x, \cdot)$ est intégrable, d'intégrale $F^+(x) - F^-(x)$.

      La fonction $\mathbf 1_{N^c}(F^+ - F^-)$ est mesurable et intégrable, d'intégrale
      $$\begin{aligned} \int F^+ - \int F^- &= \int f^+ \, d(\mu \otimes \nu) \\ &\quad - \int f^- \, d(\mu \otimes \nu). \end{aligned}$$
    remarques:
      - |
        L'erreur la plus répandue est d'intervertir les intégrales sans vérifier la positivité ou l'intégrabilité. Sur $\lex{ensemble-entiers-naturels}{\mathbb N} \times \mathbb N$ avec la mesure de comptage, soit $a_{mn} = 1$ si $m = n$, $-1$ si $m = n + 1$, et $0$ sinon.

        Pour $n$ fixé, $\sum_m a_{mn} = 1 - 1 = 0$, d'où $\sum_n \sum_m a_{mn} = 0$ ; pour $m$ fixé, $\sum_n a_{mn}$ vaut $1$ si $m = 0$ et $0$ sinon, d'où $\sum_m \sum_n a_{mn} = 1$. La fonction n'est pas intégrable : $\sum_{m,n} |a_{mn}| = +\infty$.

        ```schema m-fubini
        Chaque colonne contient un $1$ et un $-1$ et a une somme nulle, tandis que la ligne $m = 0$ ne contient que le $1$ de la diagonale. Sommer d'abord en $m$ donne donc $0$, sommer d'abord en $n$ donne $1$ : le $1$ de la case $(0, 0)$ n'est compensé que si l'on somme par colonnes.
        ```
      - |
        L'hypothèse de σ-finitude est nécessaire. Sur $[0, 1]^2$, avec $\mu = \lambda$ et $\nu$ la mesure de comptage, la diagonale $D$ donne $\int \nu(D_x)\, d\lambda(x) = \int 1 \, d\lambda = 1$, alors que $\int \lambda(D^y)\, d\nu(y) = \int 0 \, d\nu = 0$.

