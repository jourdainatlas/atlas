# Niveau 2 : structure interne du chapitre « Topologie de ℝ ».
# La topologie est celle de la distance |x - y| ; la topologie générale (graphe top) est disponible.
# Aucune exponentielle, aucun logarithme, aucune fonction trigonométrique : exemples polynomiaux ou rationnels.

graphe: ar-topo
titre: Topologie de ℝ
conteneur: ar-topo

entrees:
  ar-corps: [tr-ouverts, tr-intervalles]
  ar-bw: [tr-compacite-sequentielle]

noeuds:
  - id: tr-intervalles
    etiquette: Intervalles de ℝ
    nature: proposition
    titre: Description des intervalles de ℝ
    enonce: |
      Soit $I \subset \lex{ensemble-reels}{\mathbb R}$. On écrit $]a, +\infty[$ et $]-\infty, b[$ pour les demi-droites $]a, {\rightarrow}[$ et $]{\leftarrow}, b[$ du nœud {{od-intervalles|Intervalles}}, et de même avec des crochets fermés ; le symbole $+\infty$ n'y désigne aucun réel.

      (i) $I$ est un [[intervalle]] si et seulement s'il est *convexe* : pour tous $x, y \in I$ et tout $t \in [0, 1]$, le réel $(1 - t)x + ty$ appartient à $I$.

      (ii) $I$ est un intervalle si et seulement s'il est de l'une des formes suivantes : $\varnothing$ ; $[a, b]$ avec $a \leqslant b$ ; $[a, b[$, $]a, b]$ ou $]a, b[$ avec $a < b$ ; $[a, +\infty[$, $]a, +\infty[$, $]-\infty, b]$, $]-\infty, b[$ ; $\mathbb R$.
    preuve: |
      (i) Pour $x \leqslant y$, les réels $(1 - t)x + ty = x + t(y - x)$, avec $t \in [0, 1]$, sont exactement les réels de $[x, y]$ : un tel réel est compris entre $x$ et $y$, et inversement tout $z \in [x, y]$ s'obtient pour $t = \frac{z - x}{y - x}$ si $x < y$, et pour $t = 0$ si $x = y$. Le cas $x > y$ s'y ramène en échangeant les rôles de $x$ et $y$ et en remplaçant $t$ par $1 - t$. Les deux conditions disent donc la même chose.

      (ii) Toutes ces parties sont des intervalles ({{od-intervalles|Intervalles}}). Réciproquement, soit $I$ un intervalle non vide. Si $I$ est majoré, soit $b = \sup I$ ; si $I$ est minoré, soit $a = \inf I$. Montrons que tout réel $z$ strictement compris entre $\inf I$ et $\sup I$, ces bornes étant remplacées par $-\infty$ ou $+\infty$ lorsqu'elles n'existent pas, appartient à $I$. Si $I$ est majoré, $z < b$ et $z$ ne majore pas $I$ ; s'il ne l'est pas, $z$ ne le majore pas davantage. Dans les deux cas il existe $y \in I$ avec $y > z$, et de même il existe $x \in I$ avec $x < z$ ; donc $z \in I$, puisque $I$ est un intervalle.

      Ainsi $I$ contient l'intervalle ouvert d'extrémités $\inf I$ et $\sup I$, et il est contenu dans l'intervalle fermé correspondant, par définition des bornes. Il ne reste qu'à savoir si chaque borne finie appartient ou non à $I$ : on obtient l'une des formes de la liste, et $[a, a] = \{a\}$ si $a = b$.
    remarques:
      - |
        Le point (ii) repose sur la propriété de la borne supérieure, et il est faux dans $\lex{ensemble-rationnels}{\mathbb Q}$. La partie $\{x \in \mathbb Q : x^2 < 2\}$ est un intervalle de $\mathbb Q$, car $x < z < y$ entraîne $|z| \leqslant \max(|x|, |y|)$, donc $z^2 < 2$ ; mais elle n'a de borne supérieure ni de borne inférieure dans $\mathbb Q$, et elle n'est d'aucune des formes de la liste à extrémités rationnelles.
      - |
        La forme convexe (i) est celle qui se généralise : dans $\mathbb R^n$, où il n'y a plus d'ordre total, ce sont les parties convexes qui prennent le relais des intervalles, par exemple comme espaces simplement connexes ({{ta-simplement-connexe|Simple connexité}}).

  - id: tr-connexes
    etiquette: Connexes = intervalles
    nature: théorème
    titre: Parties connexes de ℝ
    enonce: |
      Les parties [[connexe|connexes]] de $\lex{ensemble-reels}{\mathbb R}$ sont exactement les [[intervalle|intervalles]]. En particulier, $\mathbb R$ et tout [[segment]] $[a, b]$ sont connexes.
    preuve: |
      Une partie est connexe lorsqu'elle l'est pour la topologie induite, dont les ouverts sont décrits au nœud {{tr-ouverts|Topologie usuelle de ℝ}}, (iv).

      *Une partie connexe est un intervalle.* Supposons que $A$ n'est pas un intervalle : il existe $x < z < y$ avec $x, y \in A$ et $z \notin A$. Alors $A = \big(A \,\cap\, ]-\infty, z[\big) \cup \big(A \,\cap\, ]z, +\infty[\big)$, réunion de deux ouverts de $A$, disjoints, non vides puisque le premier contient $x$ et le second $y$. Donc $A$ n'est pas connexe.

      *Un intervalle est connexe.* Soit $I$ un intervalle ; l'ensemble vide est connexe, et l'on suppose $I$ non vide. Supposons $I = U \cup V$, avec $U$ et $V$ ouverts dans $I$, disjoints et non vides. Soit $a \in U$ et $b \in V$ ; quitte à échanger $U$ et $V$, on peut supposer $a < b$, et $[a, b] \subset I$ puisque $I$ est un intervalle. Posons
      $$E = \{x \in [a, b] : [a, x] \subset U\}.$$
      Elle contient $a$ et elle est majorée par $b$ ; soit $c = \sup E$, qui appartient à $[a, b]$, donc à $I$. Remarquons que $[a, c[ \,\subset U$ : si $a \leqslant y < c$, le réel $y$ ne majore pas $E$, il existe $x \in E$ avec $x > y$, et $y \in [a, x] \subset U$.

      ```schema tr-connexes
      L'intervalle $[a, c[$, en bleu, est inclus dans $U$, et la boule de centre $c$, en rouge, reste dans la partie qui contient $c$. En haut, $c \in V$ (en vert, comme $b$) : le point $y$ de la boule serait à la fois dans $[a, c[ \,\subset U$ et dans $V$. En bas, $c \in U$ : la boule prolonge $[a, c]$ jusqu'au point $x > c$, qui appartiendrait à $E$.
      ```

      Si $c \in V$, alors $c \neq a$. Il existe $r > 0$ tel que $]c - r, c + r[ \,\cap I \subset V$. Le point $y = \max(a, c - \frac r2)$ appartient à $[a, c[$, donc à $U$, et aussi à $]c - r, c + r[ \,\cap I$, donc à $V$ : c'est impossible, puisque $U \cap V = \varnothing$.

      Si $c \in U$, alors $[a, c] \subset U$, et $c \neq b$ puisque $b \in V$. Il existe $r > 0$ tel que $]c - r, c + r[ \,\cap I \subset U$. Le point $x = \min(b, c + \frac r2)$ vérifie $]c, x] \subset \,]c - r, c + r[ \,\cap I \subset U$, donc $[a, x] \subset U$ et $x \in E$ ; or $x > c$, ce qui contredit $c = \sup E$.

      Les deux cas sont impossibles, alors que $c \in I = U \cup V$ : l'intervalle $I$ est connexe.
    remarques:
      - |
        Joint à l'invariance de la connexité par image continue ({{t-connexe-prop|Stabilité de la connexité}}), ce théorème redonne le théorème des valeurs intermédiaires ({{c-tvi|Valeurs intermédiaires}}) : l'image continue d'un intervalle est connexe, donc c'est un intervalle. La démonstration directe du chapitre suivant reprend exactement le raisonnement par la borne supérieure fait ici.
      - |
        L'erreur la plus répandue est de croire qu'une partie « sans trou visible » est connexe. $\lex{ensemble-rationnels}{\mathbb Q}$ n'est pas connexe : il contient $0$ et $1$ mais pas le réel irrationnel $\frac{\sqrt 2}2$ ({{tr-dense|Densité de ℚ}}), donc ce n'est pas un intervalle de $\mathbb R$. De même, $\mathbb R \setminus \{0\}$ et $\{-1, 1\}$ ne sont pas connexes.
      - |
        C'est la connexité du segment $[0, 1]$ qui permet à la topologie algébrique de montrer qu'un espace connexe par arcs est connexe ({{ta-chemins|Chemins}}) ; c'est celle de $[-1, 1]$ qui donne le cas de la dimension $1$ du théorème de Brouwer ({{h-applications|Brouwer, dimension}}).

  - id: tr-ouverts
    etiquette: Ouverts de ℝ
    nature: définition
    titre: Topologie usuelle de ℝ
    texte: |
      La distance $|x - y|$ définit les [[ouvert|ouverts]] et les [[ferme|fermés]] de $\lex{ensemble-reels}{\mathbb R}$ : c'est la construction des ouverts d'un [[espace-metrique]], appliquée à $\mathbb R$. Pour $x \in \mathbb R$ et $r > 0$, on note $]x - r, x + r[ \,= \{y \in \mathbb R : |y - x| < r\}$ la *boule ouverte* de centre $x$ et de rayon $r$. On écrit $]a, +\infty[$ et $]-\infty, a[$ pour les demi-droites $]a, {\rightarrow}[$ et $]{\leftarrow}, a[$ du nœud {{od-intervalles|Intervalles}} ; le symbole $+\infty$ n'y désigne aucun réel.
    enonce: |
      Une partie $U$ de $\lex{ensemble-reels}{\mathbb R}$ est **ouverte** si, pour tout $x \in U$, il existe $r > 0$ tel que $]x - r, x + r[ \,\subset U$.

      (i) Ces parties forment une topologie sur $\mathbb R$, la [[topologie-usuelle]] ; ses fermés sont les complémentaires des ouverts.

      (ii) Tout intervalle $]a, b[$, $]a, +\infty[$ ou $]-\infty, b[$ est ouvert ; tout [[segment]] $[a, b]$ et toute demi-droite $[a, +\infty[$ ou $]-\infty, b]$ est fermé. Les intervalles ouverts bornés forment une [[base-topologie|base]] de la topologie usuelle.

      (iii) $\mathbb R$ est [[separe|séparé]].

      (iv) Soit $A \subset \mathbb R$. Une partie $V$ de $A$ est ouverte pour la [[topologie-induite]] si et seulement si, pour tout $x \in V$, il existe $r > 0$ tel que $]x - r, x + r[ \,\cap A \subset V$.
    preuve: |
      (i) La partie vide vérifie la condition sans qu'il y ait rien à vérifier, et $\mathbb R$ la vérifie avec $r = 1$. Si $x$ appartient à une réunion d'ouverts $U_i$, il appartient à l'un d'eux, $U_j$, et une boule de centre $x$ incluse dans $U_j$ est incluse dans la réunion. Si $x \in U_1 \cap U_2$, avec $]x - r_1, x + r_1[ \,\subset U_1$ et $]x - r_2, x + r_2[ \,\subset U_2$, la boule de rayon $\min(r_1, r_2)$ est incluse dans $U_1 \cap U_2$. Ce sont les trois axiomes du nœud {{t-espace|Espace topologique}}.

      (ii) Soit $x \in \,]a, b[$ et $r = \min(x - a, b - x) > 0$. Si $|y - x| < r$, alors $a \leqslant x - r < y < x + r \leqslant b$ : la boule est incluse dans $]a, b[$. Pour $]a, +\infty[$, le rayon $r = x - a$ convient, et de même pour $]-\infty, b[$. Le complémentaire de $[a, b]$ est la réunion des ouverts $]-\infty, a[$ et $]b, +\infty[$, celui de $[a, +\infty[$ est $]-\infty, a[$ : ces parties sont fermées. Enfin, un ouvert $U$ est la réunion de **tous** les intervalles ouverts bornés inclus dans $U$, puisque chaque point de $U$ est le centre d'une boule incluse dans $U$ ; cette description ne demande de choisir aucun rayon.

      ```schema tr-ouverts
      Chaque point $x$ de $]a, b[$ est le centre d'une boule, en bleu, incluse dans l'intervalle : son rayon $r = \min(x - a, b - x)$ est la distance de $x$ à l'extrémité la plus proche, que la boule touche sans l'atteindre. Ce rayon diminue quand $x$ s'approche du bord ; aucun rayon ne convient pour tous les points à la fois, et la définition d'un ouvert n'en demande pas tant.
      ```

      (iii) Si $x \neq y$, posons $r = |x - y|/2 > 0$. Un point $z$ commun aux boules $]x - r, x + r[$ et $]y - r, y + r[$ donnerait $|x - y| \leqslant |x - z| + |z - y| < 2r = |x - y|$. Ces deux boules sont des voisinages disjoints de $x$ et de $y$.

      (iv) Si $V = O \cap A$ avec $O$ ouvert, et $x \in V$, une boule de centre $x$ incluse dans $O$ vérifie $]x - r, x + r[ \,\cap A \subset O \cap A = V$. Réciproquement, supposons la condition remplie, et soit $O$ la réunion de toutes les boules $]x - r, x + r[$, avec $x \in V$ et $r > 0$, telles que $]x - r, x + r[ \,\cap A \subset V$. C'est un ouvert ; il contient $V$ par hypothèse, et $O \cap A \subset V$ par construction. Donc $V = O \cap A$.
    remarques:
      - |
        L'erreur la plus répandue est de croire qu'une partie qui n'est pas ouverte est fermée. L'intervalle $[0, 1[$ n'est ni l'un ni l'autre : aucune boule centrée en $0$ n'y est incluse, et son complémentaire n'est pas ouvert, puisque toute boule centrée en $1$ rencontre $[0, 1[$. À l'inverse, $\varnothing$ et $\mathbb R$ sont à la fois ouverts et fermés ; le nœud {{tr-connexes|Connexes de ℝ}} montrera que ce sont les seuls.
      - |
        La stabilité par intersection est limitée aux familles finies. Les intervalles $]-\frac1n, \frac1n[$, pour $n \geqslant 1$, sont ouverts, mais leur intersection est $\{0\}$, puisque $\mathbb R$ est [[archimedien]] : tout réel $x \neq 0$ vérifie $\frac1n < |x|$ pour $n$ assez grand. Or $\{0\}$ n'est pas ouvert, car toute boule $]-r, r[$ contient aussi $\frac r2$.
      - |
        La base formée des intervalles ouverts ne fait intervenir que l'ordre : la topologie usuelle de $\mathbb R$ est aussi sa *topologie de l'ordre*. C'est pourquoi les notions d'ordre du nœud {{od-intervalles|Intervalles}} et les notions topologiques de ce chapitre se répondent si exactement.

  - id: tr-sphere
    etiquette: Sphère unité Sⁿ
    nature: définition
    titre: La sphère unité
    texte: |
      On fixe une notation qui servira dans toute la suite de l'atlas. Pour $n \geqslant 0$, la [[sphere-unite|sphère unité]] de dimension $n$ est la partie $\lex{sphere-unite}{S^n} = \{x \in \lex{n-uplet}{\mathbb R^{n+1}} : x_1^2 + \cdots + x_{n+1}^2 = 1\}$ de l'ensemble $\mathbb R^{n+1}$ des $(n + 1)$-uplets de réels. Ainsi $S^0 = \{-1, 1\}$, et $S^1$ est le cercle unité de $\mathbb R^2$. L'ensemble $\mathbb R^{n+1}$ est muni de la [[topologie-produit]] des topologies usuelles de ses facteurs, et $S^n$ de la topologie induite.
    enonce: |
      (i) L'addition et la multiplication, de $\lex{ensemble-reels}{\mathbb R} \times \mathbb R$ dans $\mathbb R$, sont continues. Par conséquent, toute fonction polynomiale $\mathbb R^{n+1} \to \mathbb R$ est continue.

      (ii) La sphère $S^n$ est fermée dans $\mathbb R^{n+1}$ et [[compact|compacte]].

      (iii) $S^0$ n'est pas [[connexe]].
    preuve: |
      (i) Soit $W$ un ouvert de $\mathbb R$ et $(a, b)$ un point de son image réciproque par la multiplication, de sorte que $ab \in W$ ; l'ouvert $W$ contient une boule $]ab - \varepsilon, ab + \varepsilon[$. Posons $\delta = \min\big(1, \frac{\varepsilon}{|a| + |b| + 1}\big)$. Si $|x - a| < \delta$ et $|y - b| < \delta$, alors $|x| < |a| + 1$ et
      $$\begin{aligned} |xy - ab| &= |x(y - b) + b(x - a)| \\ &\leqslant |x|\,\delta + |b|\,\delta \\ &< (|a| + |b| + 1)\,\delta \leqslant \varepsilon. \end{aligned}$$
      Le cylindre ouvert $]a - \delta, a + \delta[ \times ]b - \delta, b + \delta[$ est donc inclus dans l'image réciproque de $W$ par la multiplication : cette image réciproque est voisinage de chacun de ses points, donc ouverte ({{t-voisinages|Voisinages}}). Pour l'addition, $\delta = \frac\varepsilon2$ convient, puisque $|(x + y) - (a + b)| \leqslant |x - a| + |y - b|$.

      Une fonction polynomiale de $\mathbb R^{n+1}$ dans $\mathbb R$ s'obtient à partir des projections $p_i$, continues ({{t-produit|Topologie produit}}), et des fonctions constantes, par sommes et produits. Si $f, g : \mathbb R^{n+1} \to \mathbb R$ sont continues, l'application $(f, g)$ à valeurs dans $\mathbb R^2$ l'est, ses deux composantes l'étant ({{t-produit|Topologie produit}}), et $f + g$, $fg$ sont ses composées par l'addition et la multiplication ({{t-continue|Applications continues}}, (iii)). Une récurrence sur la construction conclut.

      (ii) La fonction $q(x) = x_1^2 + \cdots + x_{n+1}^2$ est continue par (i), et le singleton $\{1\}$ est fermé dans l'espace séparé $\mathbb R$ ({{t-separe|Espaces séparés}}, (i)). Donc $S^n = q^{-1}(\{1\})$ est fermée ({{t-continue|Applications continues}}, (i)).

      Si $x \in S^n$, chaque $x_i^2$ est au plus $1$, donc $|x_i| \leqslant 1$ : la sphère est incluse dans le pavé $P = [-1, 1]^{n+1}$. Ce pavé, muni de la topologie produit des topologies de ses facteurs, est compact, comme produit fini de segments compacts ({{tr-borel-lebesgue|Borel-Lebesgue}} ; {{t-produit-fini|Produit fini de compacts}}). Cette topologie est celle que $\mathbb R^{n+1}$ induit sur $P$, car les cylindres ouverts de $P$ sont les traces $\big(\prod_i O_i\big) \cap P = \prod_i (O_i \cap [-1, 1])$ des cylindres ouverts de $\mathbb R^{n+1}$, et les uns comme les autres forment une base. Enfin $S^n = S^n \cap P$ est fermée dans $P$, donc compacte ({{t-compact-prop|Parties compactes}}, (i)).

      (iii) Les singletons $\{-1\} = S^0 \,\cap\, ]-2, 0[$ et $\{1\} = S^0 \,\cap\, ]0, 2[$ sont deux ouverts de $S^0$, disjoints, non vides, de réunion $S^0$.

      ```schema tr-sphere
      À gauche, le cercle $S^1$, en rouge, est inclus dans le carré $P = [-1, 1]^2$, compact comme produit de deux segments ; fermé dans $P$, il est compact. À droite, les ouverts $]-2, 0[$, en bleu, et $]0, 2[$, en vert, captent chacun l'un des deux points de $S^0 = \{-1, 1\}$ : leurs traces sont deux ouverts disjoints non vides de $S^0$, qui n'est donc pas connexe.
      ```
    remarques:
      - |
        Il ne faut pas confondre $S^1$ avec le quotient $\mathbb R/\mathbb Z$, que la topologie algébrique note aussi $S^1$ ({{ta-cercle|Groupe fondamental du cercle}}). Les deux espaces sont homéomorphes par $t \mapsto (\cos 2\pi t, \sin 2\pi t)$, mais cet homéomorphisme demande la trigonométrie, qui n'est construite qu'en analyse complexe.
      - |
        Pour $n \geqslant 1$, la sphère $S^n$ est connexe, et même connexe par arcs : c'est établi, avec son homologie, au nœud {{h-spheres|Homologie des sphères}}. La sphère $S^0$, compacte et non connexe, montre que la compacité ne dit rien de la connexité.

  - id: tr-borel-lebesgue
    etiquette: Borel-Lebesgue
    nature: théorème
    titre: Théorème de Borel-Lebesgue
    enonce: |
      Pour tous réels $a \leqslant b$, le [[segment]] $[a, b]$ est [[compact]] : de tout [[recouvrement]] de $[a, b]$ par des ouverts de $\lex{ensemble-reels}{\mathbb R}$, on peut extraire un sous-recouvrement fini.
    preuve: |
      *Séparation.* $[a, b]$ est séparé, comme partie de l'espace séparé $\mathbb R$ ({{tr-ouverts|Topologie usuelle de ℝ}}, (iii) ; {{t-separe|Espaces séparés}}, (iii)).

      *Ouverts de $\mathbb R$ ou de $[a, b]$.* La compacité porte sur les recouvrements par des ouverts de $[a, b]$, qui sont les traces $O \cap [a, b]$ des ouverts $O$ de $\mathbb R$. Pour un tel ouvert $V$, on note $\widehat V$ la réunion de **tous** les ouverts $O$ de $\mathbb R$ tels que $O \cap [a, b] \subset V$. C'est un ouvert de $\mathbb R$, et $\widehat V \cap [a, b] = V$ : l'inclusion $\subset$ vient de la définition, et l'inclusion $\supset$ de ce que $\widehat V$ contient l'ouvert dont $V$ est la trace. Un recouvrement de $[a, b]$ par des ouverts $V_i$ donne ainsi, sans aucun choix, un recouvrement par les ouverts $\widehat V_i$ de $\mathbb R$, et un sous-recouvrement fini de l'un fournit un sous-recouvrement fini de l'autre. Il suffit donc de traiter les recouvrements par des ouverts de $\mathbb R$.

      *Le cœur de la preuve.* Soit $(O_i)_{i \in I}$ une famille d'ouverts de $\mathbb R$ dont la réunion contient $[a, b]$. Posons
      $$\begin{aligned} E = \Big\{x \in [a, b] :\ &[a, x] \subset \textstyle\bigcup_{j \in J} O_j \\ &\text{pour un } J \subset I \text{ fini}\Big\}. \end{aligned}$$
      Le point $a$ appartient à l'un des $O_i$, donc $a \in E$ ; et $E$ est majorée par $b$. Soit $c = \sup E \in [a, b]$. Il appartient à un ouvert $O_k$, et il existe $r > 0$ tel que $]c - r, c + r[ \,\subset O_k$. Le réel $c - r$ ne majore pas $E$ : il existe $x \in E$, avec un ensemble fini $J$ correspondant, tel que $c - r < x \leqslant c$.

      ```schema tr-borel-lebesgue
      Supposons $c < b$ pour voir ce qui se passe. Les ouverts du recouvrement sont dessinés au-dessus de l'axe ; les deux ouverts bleus suffisent à recouvrir $[a, x]$, et l'ouvert rouge $O_k$ contient une boule de centre $c$ qui déborde à gauche de $x$. En ajoutant $O_k$ aux ouverts bleus, on recouvre $[a, y]$ avec $y = c + \frac r2$, de sorte que $y$ appartiendrait à $E$ tout en dépassant sa borne supérieure.
      ```

      Posons $y = \min(b, c + \frac r2)$. Un point $t \in [a, y]$ vérifie soit $t \leqslant x$, et alors $t \in [a, x]$, soit $c - r < x < t \leqslant y < c + r$, et alors $t \in O_k$. Donc $[a, y] \subset O_k \cup \bigcup_{j \in J} O_j$, réunion finie, et $y \in E$. Il vient $y \leqslant c$ ; comme $c + \frac r2 > c$, c'est que $y = b$, d'où $b \leqslant c$, puis $c = b$ et $b \in E$ : le segment $[a, b]$ est recouvert par un nombre fini des $O_i$.
    remarques:
      - |
        Aucun choix n'intervient : on ne désigne qu'un seul $x$ et un seul ensemble fini $J$, ce qui est une simple instanciation d'un énoncé existentiel. C'est encore la propriété de la borne supérieure qui fait tout le travail, comme pour les connexes ({{tr-connexes|Connexes de ℝ}}).
      - |
        Chacune des deux propriétés du segment est nécessaire. L'intervalle borné $]0, 1]$ n'est pas compact : les ouverts $]\frac1n, 2[$, pour $n \geqslant 1$, le recouvrent, et une sous-famille finie, d'indice maximal $N$, ne recouvre pas le point $\frac1{N+1}$. La demi-droite fermée $[0, +\infty[$ ne l'est pas non plus : les ouverts $]-1, n[$ la recouvrent, et aucune sous-famille finie n'y suffit.
      - |
        Le théorème est faux dans $\lex{ensemble-rationnels}{\mathbb Q}$. Les ouverts $\mathbb Q \,\cap\, ]-\infty, \sqrt 2 - \frac1n[$, pour $n \geqslant 1$, et $\mathbb Q \,\cap\, ]\sqrt 2, +\infty[$ recouvrent $[0, 2] \cap \mathbb Q$, puisque $\sqrt 2$ est irrationnel ({{tr-dense|Densité de ℚ}}) ; une sous-famille finie, d'indice maximal $N$, laisse de côté les rationnels de $]\sqrt 2 - \frac1N, \sqrt 2[$, et il y en a par densité.
      - |
        Ce théorème est la source de toute la compacité de l'atlas : les pavés $[-1, 1]^n$ sont compacts comme produits de segments ({{t-produit-fini|Produit fini de compacts}}), ce qui sert pour l'équivalence des normes en dimension finie ({{gd-equivalence|Équivalence des normes}}), pour les fermés bornés de $\mathbb C$ ({{cx-suites|Suites et séries complexes}}) et pour le lemme de Lebesgue du relèvement des homotopies ({{ta-revetement|Revêtements, relèvement}}) ; et la mesure de Lebesgue en tire la $\sigma$-additivité de la longueur ({{m-lebesgue|Mesure de Lebesgue}}).

  - id: tr-adherence
    etiquette: Adhérence, intérieur
    nature: proposition
    titre: Voisinages, intérieur et adhérence dans ℝ
    enonce: |
      Soit $A \subset \lex{ensemble-reels}{\mathbb R}$ et $x \in \mathbb R$.

      (i) Une partie $V$ est un [[voisinage]] de $x$ si et seulement si elle contient une boule $]x - r, x + r[$, avec $r > 0$.

      (ii) Le point $x$ appartient à l'[[interieur]] $\mathring A$ si et seulement s'il existe $r > 0$ tel que $]x - r, x + r[ \,\subset A$.

      (iii) Le point $x$ appartient à l'[[adherence]] $\overline A$ si et seulement si, pour tout $r > 0$, la boule $]x - r, x + r[$ rencontre $A$ ; lorsque $A$ n'est pas vide, cela revient à $\inf\{|x - a| : a \in A\} = 0$.

      (iv) Si $A$ est non vide et majorée, $\sup A \in \overline A$ ; si de plus $A$ est fermée, $\sup A$ appartient à $A$, qui a donc un plus grand élément. De même, si $A$ est non vide et minorée, $\inf A \in \overline A$.
    preuve: |
      (i) Si $V$ contient un ouvert $O$ contenant $x$, il contient une boule de centre $x$ incluse dans $O$. Réciproquement, une boule de centre $x$ est un ouvert contenant $x$ ({{tr-ouverts|Topologie usuelle de ℝ}}, (ii)).

      (ii) L'intérieur est le plus grand ouvert inclus dans $A$ ({{t-adherence|Intérieur, adhérence}}). Si $x \in \mathring A$, la partie $A$ contient l'ouvert $\mathring A$, qui contient $x$ : c'est un voisinage de $x$. Réciproquement, si $A$ contient un ouvert $O$ contenant $x$, alors $O \subset \mathring A$. Ainsi $x \in \mathring A$ si et seulement si $A$ est un voisinage de $x$, et l'on conclut par (i).

      (iii) Par {{t-adherence|Intérieur, adhérence}}, (iii), $x \in \overline A$ si et seulement si tout voisinage de $x$ rencontre $A$. Tout voisinage contient une boule de centre $x$, et toute boule de centre $x$ est un voisinage : il suffit donc de tester les boules. Enfin, dire que toute boule $]x - r, x + r[$ rencontre $A$, c'est dire que, pour tout $r > 0$, il existe $a \in A$ tel que $|x - a| < r$ ; comme $0$ minore l'ensemble des $|x - a|$, c'est exactement dire que sa borne inférieure est nulle.

      (iv) Soit $s = \sup A$ et $r > 0$. Le réel $s - r$ ne majore pas $A$ : il existe $a \in A$ tel que $s - r < a \leqslant s$, donc $a \in \,]s - r, s + r[$. Par (iii), $s \in \overline A$. Si $A$ est fermée, $\overline A = A$. Le cas de la borne inférieure s'obtient en remplaçant $A$ par $\{-a : a \in A\}$.

      ```schema tr-adherence
      La partie $A$, en rouge, n'atteint pas sa borne supérieure $s$. Pour chaque rayon $r$, le réel $s - r$ ne majore pas $A$, de sorte que la boule $]s - r, s + r[$, en bleu, contient un point $a$ de $A$, d'autant plus proche de $s$ que $r$ est petit : c'est exactement dire que $s$ est adhérent à $A$.
      ```
    remarques:
      - |
        Pour $A = \,]0, 1]$, on obtient $\overline A = [0, 1]$ : le point $0$ est adhérent, car $\frac r2$ appartient à $]-r, r[ \,\cap A$ dès que $r \leqslant 1$. L'intérieur de $[0, 1]$ est $]0, 1[$ : le point $0$ n'est pas intérieur, puisque $-\frac r2$ appartient à toute boule $]-r, r[$ sans appartenir à $[0, 1]$.
      - |
        Pour $A = \{\frac1n : n \geqslant 1\}$, on a $\overline A = A \cup \{0\}$ et $\mathring A = \varnothing$. Le point $0$ est adhérent parce que $\mathbb R$ est [[archimedien]] : pour $r > 0$, il existe $n$ tel que $\frac1n < r$. Un point $x < 0$ ou $x > 1$ ne l'est pas, la boule de centre $x$ et de rayon $|x|$ ou $x - 1$ évitant $A$ ; un point $x \in \,]\frac1{n+1}, \frac1n[$ non plus, la boule de rayon $\min(x - \frac1{n+1}, \frac1n - x)$ évitant $A$. Enfin, aucun point de $A$ n'est intérieur : toute boule centrée en $\frac1n$ contient des points strictement compris entre $\frac1{n+1}$ et $\frac1n$, qui ne sont pas dans $A$.

        ```schema tr-adherence-2
        Les points $\frac1n$ s'accumulent vers $0$, qui n'appartient pas à $A$ : la boule de centre $0$ et de rayon $\frac3{20}$, en bleu, contient tous les $\frac1n$ pour $n \geqslant 7$, et toute boule centrée en $0$ en contient de même une infinité. Le point $x = \frac5{12}$, situé entre $\frac13$ et $\frac12$, est le centre d'une boule, en vert, qui évite $A$ : il n'est pas adhérent.
        ```
      - |
        L'erreur la plus répandue est de croire que la borne supérieure appartient à la partie. Elle lui est seulement adhérente : $\sup \,]0, 1[ \,= 1$ n'appartient pas à $]0, 1[$. Le point (iv) dit exactement ce qui manque, la fermeture.
      - |
        Le point (iv) est l'outil par lequel on montre qu'une borne est atteinte. Le nœud {{tr-compacts|Compacts de ℝ}} l'appliquera aux compacts, et c'est sous cette forme qu'il sert en géométrie différentielle, pour l'équivalence des normes ({{gd-equivalence|Équivalence des normes}}).

  - id: tr-dense
    etiquette: Densité de ℚ
    nature: proposition
    titre: Densité des rationnels et des irrationnels
    enonce: |
      Une partie $D$ d'un espace topologique $X$ est [[partie-dense|dense]] si $\overline D = X$. Une partie $D$ de $\lex{ensemble-reels}{\mathbb R}$ est dense si et seulement si elle rencontre tout intervalle $]a, b[$ avec $a < b$.

      (i) $\lex{ensemble-rationnels}{\mathbb Q}$ est dense dans $\mathbb R$.

      (ii) Il existe un unique réel $s > 0$ tel que $s^2 = 2$ ; on le note $\sqrt 2$, et il est irrationnel.

      (iii) $\mathbb R \setminus \mathbb Q$ est dense dans $\mathbb R$.

      Par conséquent, $\mathbb Q$ et $\mathbb R \setminus \mathbb Q$ sont d'intérieur vide, et $\mathbb Q$ n'est ni ouvert ni fermé.
    preuve: |
      *Caractérisation.* Par {{tr-adherence|Adhérence, intérieur}}, (iii), $\overline D = \mathbb R$ si et seulement si toute boule rencontre $D$. Or toute boule est un intervalle $]a, b[$ avec $a < b$, et tout tel intervalle contient la boule de centre $\frac{a + b}2$ et de rayon $\frac{b - a}2$, qui est lui-même.

      (i) C'est la densité établie au nœud {{ar-archimede|Archimède, densité de ℚ}} : tout intervalle ouvert non vide contient un rationnel.

      (ii) Soit $A = \{x \geqslant 0 : x^2 < 2\}$. Elle contient $1$, et elle est majorée par $2$, puisque $x \geqslant 2$ entraîne $x^2 \geqslant 4$. Soit $s = \sup A \geqslant 1$.

      Si $s^2 < 2$, posons $h = \min\big(1, \frac{2 - s^2}{2(2s + 1)}\big) > 0$. Alors $(s + h)^2 = s^2 + h(2s + h) \leqslant s^2 + h(2s + 1) \leqslant s^2 + \frac{2 - s^2}2 < 2$, donc $s + h \in A$, ce qui contredit $s + h > s$.

      Si $s^2 > 2$, posons $h = \frac{s^2 - 2}{2s}$, qui vérifie $0 < h < s$. Alors $(s - h)^2 = s^2 - 2sh + h^2 > s^2 - 2sh = 2$. Un élément $x$ de $A$ strictement supérieur à $s - h > 0$ vérifierait $x^2 > (s - h)^2 > 2$ ; donc $s - h$ majore $A$, ce qui contredit $s - h < s = \sup A$.

      Ainsi $s^2 = 2$. Si $0 < t < s$ ou $t > s$, alors $t^2 < s^2$ ou $t^2 > s^2$ : ce réel est unique. Il est irrationnel, puisqu'aucun rationnel n'a pour carré $2$ ({{q-irrationnel|Irrationalité de √2}}).

      (iii) Soit $a < b$. Par (i), il existe un rationnel $q$ dans $]a - \sqrt 2, b - \sqrt 2[$, et $q + \sqrt 2 \in \,]a, b[$. Ce réel est irrationnel, sans quoi $\sqrt 2 = (q + \sqrt 2) - q$ serait rationnel.

      *Conséquences.* Une boule incluse dans $\mathbb Q$ contiendrait un irrationnel par (iii), et une boule incluse dans $\mathbb R \setminus \mathbb Q$ un rationnel par (i) : les deux intérieurs sont vides ({{tr-adherence|Adhérence, intérieur}}, (ii)). Ainsi $\mathbb Q$, non vide et d'intérieur vide, n'est pas ouvert ; et $\overline{\mathbb Q} = \mathbb R \neq \mathbb Q$, donc $\mathbb Q$ n'est pas fermé.
    remarques:
      - |
        Le point (ii) est la première apparition d'un irrationnel : dans $\mathbb Q$, l'équation $x^2 = 2$ n'a pas de solution, et c'est la propriété de la borne supérieure qui en crée une dans $\mathbb R$. L'argument est celui du théorème des valeurs intermédiaires ({{c-tvi|Valeurs intermédiaires}}), appliqué à la seule fonction $x \mapsto x^2 - 2$.
      - |
        L'erreur la plus répandue est de croire que la densité de $\mathbb Q$ le rend « gros ». Il est dénombrable ({{q-denombrable|ℚ est dénombrable}}), alors que $\mathbb R$ ne l'est pas, et il est négligeable pour la mesure de Lebesgue : dense et petit à la fois.
      - |
        La densité sert à prolonger : deux fonctions continues sur $\mathbb R$ qui coïncident sur $\mathbb Q$ coïncident partout, puisque l'ensemble où elles coïncident est fermé et contient une partie dense.

  - id: tr-compacts
    etiquette: Compacts de ℝ
    nature: théorème
    titre: Parties compactes de ℝ
    enonce: |
      (i) Une partie de $\lex{ensemble-reels}{\mathbb R}$ est [[compact|compacte]] si et seulement si elle est fermée et bornée. En particulier, tout segment $[a, b]$ est compact.

      (ii) Une partie compacte non vide de $\mathbb R$ a un plus grand et un plus petit élément.

      (iii) Si $K$ est un espace compact non vide et $f : K \to \mathbb R$ une application [[continuite|continue]], alors $f$ est bornée et atteint ses bornes.
    preuve: |
      Une partie est *bornée* si elle est majorée et minorée, c'est-à-dire contenue dans un segment $[-M, M]$.

      (i) Soit $K$ compacte. Elle est fermée, comme partie compacte de l'espace séparé $\mathbb R$ ({{t-compact-prop|Parties compactes}}, (ii)). Les ouverts $]-n, n[$, pour $n \geqslant 1$, recouvrent $\mathbb R$, puisque tout réel $x$ vérifie $|x| < n$ pour un entier $n$ par la propriété d'Archimède. Une sous-famille finie recouvre $K$ ; si $N$ est son plus grand indice, $K \subset \,]-N, N[$, et $K$ est bornée.

      Réciproquement, soit $K$ fermée et bornée, contenue dans $[-M, M]$. Ce segment est compact ({{tr-borel-lebesgue|Borel-Lebesgue}}). Comme $K = K \cap [-M, M]$, la partie $K$ est fermée dans $[-M, M]$ pour la topologie induite, donc compacte ({{t-compact-prop|Parties compactes}}, (i)) ; et la topologie que $[-M, M]$ induit sur $K$ est celle que $\mathbb R$ induit, puisque $(O \cap [-M, M]) \cap K = O \cap K$.

      (ii) Soit $K$ compacte non vide. Elle est majorée par (i), et $\sup K \in \overline K = K$ ({{tr-adherence|Adhérence, intérieur}}, (iv)) : c'est le plus grand élément de $K$. Le plus petit s'obtient de même avec la borne inférieure.

      (iii) L'image $f(K)$ est une partie compacte non vide de l'espace séparé $\mathbb R$ ({{t-compact-prop|Parties compactes}}, (iii)). Par (i), elle est bornée, et par (ii), elle a un plus grand et un plus petit élément, qui sont des valeurs de $f$.
    remarques:
      - |
        L'erreur la plus répandue est d'oublier l'une des deux hypothèses. L'intervalle $]0, 1]$ est borné mais pas fermé, la demi-droite $[0, +\infty[$ est fermée mais pas bornée, et aucun des deux n'est compact. La partie $\{0\} \cup \{\frac1n : n \geqslant 1\}$ est compacte : elle est bornée, et fermée parce qu'elle est l'adhérence de $\{\frac1n : n \geqslant 1\}$ ({{tr-adherence|Adhérence, intérieur}}). Sans le point $0$, elle cesse d'être fermée, donc d'être compacte.
      - |
        Le point (iii) est la forme topologique du théorème des bornes atteintes, que le chapitre suivant démontre par les suites ({{c-bornes|Bornes atteintes}}) ; elle vaut pour un compact quelconque, et c'est elle qu'emploie l'analyse fonctionnelle pour munir l'espace des fonctions continues sur un compact de la norme uniforme ({{f-exemples|Exemples d'espaces de Banach}}).
      - |
        « Fermé et borné » ne caractérise les compacts que dans $\mathbb R$ et, plus généralement, dans les espaces normés de dimension finie ({{gd-equivalence|Équivalence des normes}}). Dans l'espace $\ell^2$ des suites de carré sommable, la boule unité fermée est fermée et bornée sans être compacte : les suites $e_n$, nulles sauf en $n$ où elles valent $1$, sont deux à deux à distance $\sqrt 2$.

  - id: tr-sequentielle
    etiquette: Fermés et suites
    nature: proposition
    titre: Caractérisation séquentielle de l'adhérence et des fermés
    choix: |
      La réciproque de (i), et donc celle de (ii), choisit un terme $a_n$ dans chacun des ensembles $A_n$ : elle utilise le [[choix-denombrable]]. On ne peut pas s'en passer en général : H. Herrlich et G. E. Strecker (« When is ℕ Lindelöf? », *Comment. Math. Univ. Carolinae* 38 (1997), p. 553-556) montrent que, dans $\mathsf{ZF}$, la réciproque de (i) pour toutes les parties de $\mathbb R$ équivaut au choix dénombrable pour les parties de $\mathbb R$. Les sens directs n'utilisent aucun choix.
    enonce: |
      Soit $A \subset \lex{ensemble-reels}{\mathbb R}$.

      (i) Si une [[suite]] $(a_n)$ d'éléments de $A$ converge vers $x$, alors $x \in \overline A$. Réciproquement, tout point de $\overline A$ est la limite d'une suite d'éléments de $A$.

      (ii) La partie $A$ est fermée si et seulement si la limite de toute suite convergente d'éléments de $A$ appartient à $A$.
    preuve: |
      (i) Soit $a_n \to x$ et $r > 0$. Il existe $N$ tel que $|a_N - x| < r$, et $a_N$ appartient à $]x - r, x + r[ \,\cap A$, qui n'est donc pas vide. Par {{tr-adherence|Adhérence, intérieur}}, (iii), $x \in \overline A$.

      Réciproquement, soit $x \in \overline A$. Pour tout $n \geqslant 1$, l'ensemble $A_n = A \,\cap\, ]x - \frac1n, x + \frac1n[$ n'est pas vide ; choisissons $a_n \in A_n$. Pour $\varepsilon > 0$, soit $N$ tel que $\frac1N < \varepsilon$, qui existe par la propriété d'Archimède : pour $n \geqslant N$, on a $|a_n - x| < \frac1n \leqslant \frac1N < \varepsilon$. Donc $a_n \to x$.

      ```schema tr-sequentielle
      Les points de $A$ sont marqués sur l'axe, et $x$, en rouge, leur est adhérent sans leur appartenir. Chaque boule $]x - \frac1n, x + \frac1n[$, en bleu, contient plusieurs points de $A$, et rien ne désigne l'un d'eux plutôt qu'un autre : le point $a_n$, en or, est choisi dans chacune, et c'est cette infinité de choix qui demande le choix dénombrable.
      ```

      (ii) Si $A$ est fermée et si $a_n \to x$ avec $a_n \in A$, alors $x \in \overline A = A$ par (i). Réciproquement, si la condition est remplie, tout point de $\overline A$ est limite d'une suite de $A$, par la réciproque de (i), donc appartient à $A$ : ainsi $\overline A \subset A$, et $A$ est fermée.
    remarques:
      - |
        Le sens direct de (ii), « une partie fermée contient les limites de ses suites convergentes », est le plus employé, et il ne demande aucun choix. C'est lui qu'utilise le théorème des bornes atteintes ({{c-bornes|Bornes atteintes}}) quand il dit que la limite d'une suite de $[a, b]$ appartient à $[a, b]$.
      - |
        Le choix disparaît dès que la suite peut être écrite. Si $A$ contient un intervalle $]x, x + r[$, la suite $a_n = x + \frac{r}{n + 2}$ converge vers $x$ sans qu'on ait rien choisi. C'est le cas, à gauche ou à droite, de tout point adhérent à un intervalle non réduit à un point.
      - |
        La continuité admet la même caractérisation séquentielle, avec le même usage du choix dans la réciproque ({{c-sequentielle|Caractérisation séquentielle}}) ; les deux énoncés figurent d'ailleurs dans la liste de Herrlich et Strecker.

  - id: tr-compacite-sequentielle
    etiquette: Compacité séquentielle
    nature: théorème
    titre: Compacité séquentielle des parties de ℝ
    choix: |
      La réciproque choisit une suite $(u_n)$ telle que $u_n > n$, puis utilise la réciproque de la caractérisation séquentielle des fermés ; elle repose donc sur le [[choix-denombrable]]. Le premier pas ne peut pas se faire dans $\mathsf{ZF}$ seul : par le même article de Herrlich et Strecker (1997), l'énoncé « toute partie non bornée de $\mathbb R$ contient une suite non bornée » équivaut au choix dénombrable pour les parties de $\mathbb R$. Le sens direct n'utilise aucun choix.
    enonce: |
      Une partie $K$ de $\lex{ensemble-reels}{\mathbb R}$ est [[compact|compacte]] si et seulement si toute [[suite]] d'éléments de $K$ admet une [[suite-extraite]] qui converge vers un élément de $K$.
    preuve: |
      *Sens direct.* Soit $K$ compacte et $(u_n)$ une suite d'éléments de $K$. Par {{tr-compacts|Compacts de ℝ}}, $K$ est bornée, donc $(u_n)$ aussi, et le théorème de Bolzano-Weierstrass ({{ar-bw|Bolzano-Weierstrass}}) fournit une suite extraite convergente, de limite $\ell$. Comme $K$ est fermée, $\ell \in K$ ({{tr-sequentielle|Fermés et suites}}, (ii), sens direct).

      *Réciproque.* Supposons la propriété vraie. Si $K$ n'était pas majorée, on pourrait choisir, pour tout $n$, un $u_n \in K$ tel que $u_n > n$ ; toute suite extraite vérifierait $u_{\varphi(n)} > \varphi(n) \geqslant n$, ne serait pas bornée et ne pourrait converger, car une suite convergente est bornée. Donc $K$ est majorée, et de même minorée.

      Montrons que $K$ est fermée. Soit $(a_n)$ une suite d'éléments de $K$ qui converge vers $x$. Une suite extraite $(a_{\varphi(n)})$ converge vers un $\ell \in K$. Mais elle converge aussi vers $x$ : si $|a_n - x| < \varepsilon$ pour $n \geqslant N$, alors $|a_{\varphi(n)} - x| < \varepsilon$ pour $n \geqslant N$, puisque $\varphi(n) \geqslant n$. Par unicité de la limite, $x = \ell \in K$. Par {{tr-sequentielle|Fermés et suites}}, (ii), $K$ est fermée, et elle est compacte par {{tr-compacts|Compacts de ℝ}}.
    remarques:
      - |
        Pour un segment, le sens direct n'est autre que le théorème de Bolzano-Weierstrass : une suite à valeurs dans $[a, b]$ a une suite extraite convergente, et sa limite reste dans $[a, b]$. C'est sous cette forme que le chapitre suivant l'emploie, pour les bornes atteintes et pour le théorème de Heine ({{c-heine|Théorème de Heine}}).
      - |
        Sur $]0, 1]$, qui n'est pas compact, la suite $u_n = \frac1{n + 1}$ converge vers $0$, et toutes ses suites extraites aussi : aucune n'a de limite dans $]0, 1]$. La propriété échoue exactement là où la fermeture manque.
      - |
        L'équivalence entre compacité et compacité séquentielle est propre aux espaces métriques. Dans un espace topologique quelconque, aucune des deux n'entraîne l'autre ; par exemple, le produit $[0, 1]^{[0, 1]}$ est compact par le théorème de Tychonov ({{t-tychonov|Théorème de Tychonov}}), mais il contient des suites sans suite extraite convergente.

