# Niveau 1 : structure interne du nœud « Algèbre linéaire ».
# K désigne un corps commutatif quelconque. Les sommes finies et la dimension reposent sur ℕ ;
# l'existence d'une base en dimension quelconque repose sur le lemme de Zorn et est marquée ⋆.

graphe: alglin
titre: Algèbre linéaire
conteneur: alglin

entrees:
  alg: [v-espace, v-permutations]
  n: [v-combinaisons]
  ordin: [v-bases-existence]

noeuds:
  - id: v-espace
    etiquette: Espace vectoriel
    nature: définition
    titre: Espaces vectoriels et sous-espaces
    enonce: |
      Un [[espace-vectoriel|espace vectoriel]] sur le corps $K$ est un $K$-module ({{a-module|Module}}) : un groupe abélien $(E, +)$ muni d'une multiplication externe $K \times E \to E$ telle que $\lambda(x + y) = \lambda x + \lambda y$, $(\lambda + \mu)x = \lambda x + \mu x$, $(\lambda\mu)x = \lambda(\mu x)$ et $1x = x$. Ses éléments sont appelés vecteurs, ceux de $K$ scalaires.

      Un [[sous-espace-vectoriel|sous-espace vectoriel]] est une partie non vide stable par addition et par multiplication externe. L'intersection d'un ensemble non vide de sous-espaces en est un ; le **sous-espace engendré** $\operatorname{Vect}(S)$ par une partie $S$ est l'intersection des sous-espaces qui la contiennent.
    preuve: |
      Un sous-espace $F$ contient $0 = 0 \cdot x$ pour un $x \in F$, et $-x = (-1)x$ : c'est un sous-groupe, stable par la loi externe, donc un sous-module. La stabilité passe à l'intersection, et l'ensemble des sous-espaces contenant $S$, obtenu par séparation dans $\mathcal P(E)$, contient $E$.
    remarques:
      - |
        Exemples fondamentaux : $K$ lui-même ; l'espace $K^I$ des applications d'un ensemble $I$ dans $K$, avec les opérations point par point ; son sous-espace $K^{(I)}$ formé des applications nulles hors d'une partie finie de $I$. Pour $I = n$, les deux coïncident et l'on note $K^n$.
      - |
        Les égalités $0x = 0$ et $\lambda 0 = 0$ se démontrent comme dans un anneau ({{a-anneau|Anneau}}). De plus, $\lambda x = 0$ entraîne $\lambda = 0$ ou $x = 0$, puisque $\lambda \neq 0$ est inversible : c'est ici que sert l'hypothèse que $K$ est un corps.

  - id: v-combinaisons
    etiquette: Combinaisons linéaires
    nature: théorème
    titre: Sommes finies et combinaisons linéaires
    texte: |
      Une famille $(\lambda_i)_{i \in I}$ de scalaires est **à support fini** si $\{i : \lambda_i \neq 0\}$ est un [[ensemble-fini|ensemble fini]]. Pour une telle famille et une famille $(x_i)_{i \in I}$ de vecteurs, la [[combinaison-lineaire|combinaison linéaire]] $\sum_{i \in I} \lambda_i x_i$ est la somme, définie ci-dessous, des $\lambda_i x_i$ pour $i$ dans le support.
    enonce: |
      (i) *Sommes finies.* Soit $(G, +)$ un groupe abélien, $I$ un ensemble fini et $(x_i)_{i \in I}$ une famille de $G$. Il existe une unique application $S : \mathcal P(I) \to G$ telle que $S(\varnothing) = 0$ et $S(A \cup \{i\}) = S(A) + x_i$ pour $A \subset I$ et $i \in I \setminus A$. On note $\sum_{i \in A} x_i = S(A)$ ; cette somme ne dépend d'aucun ordre sur $I$.

      (ii) $\sum_i (x_i + y_i) = \sum_i x_i + \sum_i y_i$ et, dans un espace vectoriel, $\lambda \sum_i x_i = \sum_i \lambda x_i$.

      (iii) $\operatorname{Vect}(S)$ est l'ensemble des combinaisons linéaires d'éléments de $S$.
    preuve: |
      (i) C'est le nœud {{n-sommes|Sommes finies}}, appliqué au groupe abélien $(G, +)$.

      (ii) L'application $A \mapsto \sum_{A} x_i + \sum_{A} y_i$ vérifie la relation qui caractérise $A \mapsto \sum_A (x_i + y_i)$ ; par unicité, elles sont égales. De même pour $A \mapsto \lambda \sum_A x_i$.

      (iii) Par (ii), l'ensemble $C$ des combinaisons linéaires est un sous-espace ; il contient chaque $s \in S$, qui s'écrit $1 \cdot s$. Réciproquement, tout sous-espace contenant $S$ contient chaque $\sum_A \lambda_i s_i$, par récurrence sur $|A|$. Donc $C = \operatorname{Vect}(S)$.
    remarques:
      - |
        Une combinaison linéaire ne comporte qu'un nombre fini de termes, même si la famille est infinie : l'algèbre linéaire ne connaît pas de somme infinie. Celles-ci demandent une notion de limite, qui relève de la topologie ; c'est l'objet de l'{{anf|analyse fonctionnelle}}.

  - id: v-applications
    etiquette: Applications linéaires
    nature: proposition
    titre: Applications linéaires
    texte: |
      Une [[application-lineaire|application linéaire]] $u : E \to F$ entre espaces vectoriels vérifie $u(x + y) = u(x) + u(y)$ et $u(\lambda x) = \lambda u(x)$. On note $\mathcal L(E, F)$ leur ensemble, $\operatorname{Ker} u = u^{-1}(\{0\})$ et $\operatorname{Im} u = u(E)$.
    enonce: |
      (i) $\operatorname{Ker} u$ et $\operatorname{Im} u$ sont des sous-espaces ; $u$ est injective si et seulement si $\operatorname{Ker} u = \{0\}$.

      (ii) La composée de deux applications linéaires est linéaire, et la réciproque d'une application linéaire bijective (un **isomorphisme**) est linéaire.

      (iii) $\mathcal L(E, F)$ est un sous-espace de $F^E$, et $u \circ \big(\sum_i \lambda_i x_i\big) = \sum_i \lambda_i u(x_i)$ pour toute combinaison linéaire.
    preuve: |
      (i) Une application linéaire est un morphisme de groupes ; l'image directe et l'image réciproque d'un sous-groupe sont des sous-groupes, et l'injectivité équivaut à $\operatorname{Ker} u = \{0\}$ ({{a-morphisme|Morphisme}}). La stabilité par la loi externe vient de $u(\lambda x) = \lambda u(x)$.

      (ii) La composée respecte les deux opérations. Si $u$ est bijective, $u^{-1}$ est additive ({{a-morphisme|Morphisme}}), et $u(\lambda u^{-1}(y)) = \lambda y$ donne $u^{-1}(\lambda y) = \lambda u^{-1}(y)$.

      (iii) Une somme et un multiple d'applications linéaires sont linéaires, puisque $K$ est commutatif : $(\lambda u)(\mu x) = \lambda\mu\, u(x) = \mu (\lambda u)(x)$. La formule pour les combinaisons s'obtient par récurrence sur le nombre de termes.
    remarques:
      - |
        La commutativité de $K$ sert dans (iii) : sur un anneau à division non commutatif, $x \mapsto \lambda x$ n'est pas linéaire en général, et $\mathcal L(E, F)$ n'est plus un espace vectoriel sur le même corps.

  - id: v-somme-directe
    etiquette: Sommes directes
    nature: proposition
    titre: Sommes directes, supplémentaires, projecteurs
    texte: |
      Pour deux sous-espaces $F$ et $G$ de $E$, la somme $F + G = \{f + g : f \in F,\ g \in G\}$ est un sous-espace. Elle est **directe**, notée $F \oplus G$, si tout élément de $F + G$ s'écrit de manière unique $f + g$. Deux sous-espaces sont [[supplementaire|supplémentaires]] si $E = F \oplus G$.
    enonce: |
      (i) La somme $F + G$ est directe si et seulement si $F \cap G = \{0\}$.

      (ii) Si $E = F \oplus G$, l'application $p$ qui à $x = f + g$ associe $f$ est linéaire, et vérifie $p \circ p = p$, $\operatorname{Im} p = F$, $\operatorname{Ker} p = G$ : c'est le **projecteur** sur $F$ parallèlement à $G$.

      (iii) Réciproquement, si $p \in \mathcal L(E, E)$ vérifie $p \circ p = p$, alors $E = \operatorname{Im} p \oplus \operatorname{Ker} p$.
    preuve: |
      (i) Si $f + g = f' + g'$, alors $f - f' = g' - g \in F \cap G$. Si cette intersection est nulle, $f = f'$ et $g = g'$. Réciproquement, si $x \in F \cap G$, alors $x + 0 = 0 + x$ donne deux écritures, égales seulement si $x = 0$.

      (ii) L'unicité de l'écriture donne la linéarité : $x + x' = (f + f') + (g + g')$, et de même pour $\lambda x$. Pour $f \in F$, $p(f) = f$, d'où $p \circ p = p$ et $\operatorname{Im} p = F$ ; $p(x) = 0$ équivaut à $x \in G$.

      (iii) Tout $x$ s'écrit $p(x) + (x - p(x))$, avec $p(x - p(x)) = p(x) - p(p(x)) = 0$. Si $x \in \operatorname{Im} p \cap \operatorname{Ker} p$, alors $x = p(y)$ et $0 = p(x) = p(p(y)) = p(y) = x$.
    remarques:
      - |
        L'erreur la plus répandue est de confondre supplémentaire et complémentaire : $F \cup G$ n'est jamais un sous-espace si $F$ et $G$ sont deux droites distinctes, et un sous-espace a en général une infinité de supplémentaires. Dans $K^2$, avec $K$ infini, les droites engendrées par $(1, t)$, pour $t \in K$, sont toutes supplémentaires de la droite engendrée par $(0, 1)$.

  - id: v-quotient
    etiquette: Espace quotient
    nature: théorème
    titre: Espace quotient et théorème d'isomorphisme
    enonce: |
      (i) Si $F$ est un sous-espace de $E$, le quotient $E/F$ est un espace vectoriel et la surjection canonique $\pi : E \to E/F$ est linéaire, de noyau $F$.

      (ii) Toute application linéaire $u : E \to E'$ induit un isomorphisme $E/\operatorname{Ker} u \cong \operatorname{Im} u$.

      (iii) Si $G$ est un supplémentaire de $F$, la restriction de $\pi$ à $G$ est un isomorphisme de $G$ sur $E/F$.
    preuve: |
      (i) C'est le quotient d'un module par un sous-module ({{a-module|Module}}).

      (ii) Le théorème d'isomorphisme des groupes fournit un isomorphisme de groupes $\bar u : E/\operatorname{Ker} u \to \operatorname{Im} u$ avec $\bar u(\pi(x)) = u(x)$ ({{a-isomorphisme|Théorème d'isomorphisme}}) ; il respecte la loi externe, puisque $\bar u(\lambda \pi(x)) = \bar u(\pi(\lambda x)) = \lambda u(x)$.

      (iii) $\pi|_G$ est linéaire, de noyau $G \cap F = \{0\}$, donc injective. Tout $x \in E$ s'écrit $f + g$, et $\pi(x) = \pi(g)$ : elle est surjective.
    remarques:
      - |
        Le point (iii) dit que tous les supplémentaires de $F$ sont isomorphes entre eux, puisqu'ils le sont tous à $E/F$. Le quotient en est le représentant canonique, qui ne demande aucun choix.

  - id: v-libre
    etiquette: Familles libres, bases
    nature: proposition
    titre: Familles libres, génératrices, bases
    texte: |
      Une famille $(e_i)_{i \in I}$ de $E$ est [[famille-libre|libre]] si toute combinaison linéaire nulle $\sum_i \lambda_i e_i = 0$ a tous ses coefficients nuls ; [[famille-generatrice|génératrice]] si $\operatorname{Vect}\{e_i : i \in I\} = E$ ; c'est une [[base-vectorielle|base]] si elle est libre et génératrice.
    enonce: |
      (i) $(e_i)$ est une base si et seulement si tout $x \in E$ s'écrit de manière unique $x = \sum_i \lambda_i e_i$, avec $(\lambda_i)$ à support fini ; les $\lambda_i$ sont les **coordonnées** de $x$.

      (ii) *Propriété universelle.* Si $(e_i)_{i \in I}$ est une base de $E$ et $(y_i)_{i \in I}$ une famille de $F$, il existe une unique application linéaire $u : E \to F$ telle que $u(e_i) = y_i$ pour tout $i$.

      (iii) Avec ces notations, $u$ est injective si et seulement si $(y_i)$ est libre, surjective si et seulement si $(y_i)$ est génératrice. En particulier, $E$ a une base indexée par $I$ si et seulement si $E$ est isomorphe à $K^{(I)}$.

      (iv) Si $L$ est une partie libre et $x \notin \operatorname{Vect}(L)$, alors $L \cup \{x\}$ est libre.
    preuve: |
      (i) L'existence de l'écriture est le caractère générateur ({{v-combinaisons|Combinaisons linéaires}}). Deux écritures différentes donnent, par différence, une combinaison nulle à coefficients non tous nuls, et réciproquement.

      (ii) On pose $u\big(\sum_i \lambda_i e_i\big) = \sum_i \lambda_i y_i$, ce qui a un sens par (i) ; $u$ est linéaire par unicité des coordonnées. Toute application linéaire qui convient prend cette valeur ({{v-applications|Applications linéaires}}).

      (iii) $u\big(\sum_i \lambda_i e_i\big) = 0$ équivaut à $\sum_i \lambda_i y_i = 0$ : l'injectivité est la liberté des $y_i$. L'image de $u$ est l'ensemble des combinaisons des $y_i$. Enfin, les fonctions indicatrices $\delta_i$ des singletons forment une base de $K^{(I)}$, et l'application qui envoie $\delta_i$ sur $e_i$ est un isomorphisme lorsque $(e_i)$ est une base.

      (iv) Dans une relation $\lambda x + \sum_m \mu_m m = 0$, avec $m \in L$, on a $\lambda = 0$, sinon $x = -\lambda^{-1}\sum_m \mu_m m \in \operatorname{Vect}(L)$ ; puis tous les $\mu_m$ sont nuls, $L$ étant libre.
    remarques:
      - |
        Une application linéaire est donc entièrement déterminée par les images des vecteurs d'une base, qu'on peut choisir librement. C'est ce qui permettra de la représenter par une matrice ({{v-matrices|Matrices}}).

  - id: v-bases-existence
    etiquette: Existence de bases
    nature: théorème
    titre: Tout espace vectoriel a une base
    choix: |
      La démonstration utilise le lemme de Zorn. Réciproquement, Blass a montré en 1984 que l'existence d'une base dans tout espace vectoriel entraîne l'axiome du choix ; cette réciproque est admise ici.
    enonce: |
      Dans tout espace vectoriel $E$ :

      (i) toute partie libre est contenue dans une base (**théorème de la base incomplète**) ; en particulier, $E$ a une base ;

      (ii) tout sous-espace $F$ a un supplémentaire.
    preuve: |
      (i) Soit $L$ une partie libre. L'ensemble $\mathcal E$ des parties libres contenant $L$, ordonné par inclusion, est non vide. Il est [[inductif-ordre|inductif]] : si $\mathcal C$ est une chaîne de $\mathcal E$, la réunion $U$ de ses éléments contient $L$, et elle est libre, car une combinaison linéaire ne fait intervenir qu'un nombre fini de vecteurs $u_1, \dots, u_k$ de $U$, et ceux-ci appartiennent tous à un même élément de la chaîne, le plus grand des éléments qui contiennent chacun d'eux. Le [[lemme-zorn|lemme de Zorn]] ({{o-zorn|Lemme de Zorn}}) fournit une partie libre maximale $M$.

      $M$ est génératrice : si $x \notin \operatorname{Vect}(M)$, alors $M \cup \{x\}$ est libre ({{v-libre|Familles libres, bases}}, point (iv)), ce qui contredit la maximalité. Pour $L = \varnothing$, on obtient une base de $E$.

      (ii) Soit $B_F$ une base de $F$, complétée en une base $B$ de $E$ par (i). Le sous-espace $G$ engendré par $B \setminus B_F$ vérifie $F + G = E$, et $F \cap G = \{0\}$ par unicité des coordonnées dans la base $B$ ({{v-libre|Familles libres, bases}}).
    remarques:
      - |
        Sans l'axiome du choix, l'espace $\mathbb R$ vu comme espace vectoriel sur {{q|$\mathbb Q$}} peut n'avoir aucune base : il est cohérent avec $\mathsf{ZF}$ qu'il n'en ait pas. Une base de ce type, dite de Hamel, n'est jamais explicite.
      - |
        En dimension finie, le choix est inutile : le nœud {{v-dimension|Dimension}} complète une famille libre en piochant dans une base donnée, sans lemme de Zorn.

  - id: v-echange
    etiquette: Lemme d'échange
    nature: lemme
    titre: Lemme d'échange de Steinitz
    enonce: |
      Si $E$ est engendré par une famille $(g_1, \dots, g_n)$ et si $(f_1, \dots, f_m)$ est une famille libre de $E$, alors $m \leqslant n$.
    preuve: |
      Montrons par récurrence sur $k \leqslant m$ que $k \leqslant n$ et que, quitte à renuméroter les $g_j$, la famille $(f_1, \dots, f_k, g_{k+1}, \dots, g_n)$ engendre $E$. Pour $k = 0$, c'est l'hypothèse.

      Supposons le résultat vrai pour $k < m$. Écrivons $f_{k+1} = \sum_{i \leqslant k} a_i f_i + \sum_{j > k} b_j g_j$. Si tous les $b_j$ étaient nuls, en particulier s'il n'y avait aucun $g_j$ d'indice $j > k$, on aurait une relation de dépendance entre $f_1, \dots, f_{k+1}$, ce qui contredit la liberté. Il existe donc $j > k$, d'où $k + 1 \leqslant n$, avec $b_j \neq 0$ ; on renumérote pour que $j = k + 1$. Alors
      $$g_{k+1} = b_{k+1}^{-1}\Big(f_{k+1} - \sum_{i \leqslant k} a_i f_i - \sum_{j > k+1} b_j g_j\Big)$$
      appartient au sous-espace engendré par $(f_1, \dots, f_{k+1}, g_{k+2}, \dots, g_n)$, qui contient donc tous les vecteurs de la famille génératrice précédente : il est égal à $E$. Pour $k = m$, on obtient $m \leqslant n$.
    remarques:
      - |
        C'est le seul lemme où l'on doit vraiment calculer ; tout ce qui concerne la dimension en découle. L'idée est de remplacer, un par un, les vecteurs générateurs par les vecteurs libres sans perdre le caractère générateur.

  - id: v-dimension
    etiquette: Dimension
    nature: théorème
    titre: Dimension d'un espace vectoriel
    texte: |
      $E$ est **de dimension finie** s'il est engendré par une famille finie.
    enonce: |
      Soit $E$ de dimension finie.

      (i) $E$ a une base finie, et toutes ses bases ont le même nombre d'éléments, la [[dimension]] de $E$, notée $\dim E$.

      (ii) Si $\dim E = n$, toute famille libre a au plus $n$ éléments, et toute famille libre à $n$ éléments est une base ; toute famille génératrice a au moins $n$ éléments, et toute famille génératrice à $n$ éléments est une base.

      (iii) Toute famille libre se complète en une base, en lui ajoutant des vecteurs d'une base donnée. Tout sous-espace $F$ est de dimension finie, avec $\dim F \leqslant \dim E$, et $\dim F = \dim E$ seulement si $F = E$.
    preuve: |
      On utilise le point (iv) du nœud {{v-libre|Familles libres, bases}} : si $L$ est libre et $x \notin \operatorname{Vect}(L)$, alors $L \cup \{x\}$ est libre. Aucun choix n'intervient.

      (i) Soit $(g_1, \dots, g_n)$ génératrice. Parmi ses sous-familles libres, dont le nombre d'éléments est au plus $n$ ({{v-echange|Lemme d'échange}}), il y en a une de nombre d'éléments maximal ; par ce point (iv), chaque $g_j$ appartient au sous-espace qu'elle engendre, qui est donc $E$ : c'est une base finie. Si $B$ et $B'$ sont deux bases, chacune est libre et l'autre génératrice, donc $|B| \leqslant |B'|$ et $|B'| \leqslant |B|$ par le lemme d'échange.

      (ii) Une base, à $n$ éléments, est génératrice : le lemme d'échange borne les familles libres par $n$. Si $L$ est libre à $n$ éléments et non génératrice, on lui ajoute un vecteur hors de $\operatorname{Vect}(L)$ et l'on obtient une famille libre à $n + 1$ éléments : contradiction. Une famille génératrice contient une base, comme dans (i), donc a au moins $n$ éléments, et si elle en a exactement $n$, cette base est la famille entière.

      (iii) Soit $L$ libre et $B$ une base. Parmi les familles libres formées de $L$ et de vecteurs de $B$, en nombre au plus $n$, on en prend une de nombre d'éléments maximal ; elle engendre chaque vecteur de $B$, par ce même point, donc $E$. Pour un sous-espace $F$, on prend de même une famille libre de $F$ à nombre d'éléments maximal, au plus $n$ : elle engendre $F$, et c'en est une base. Si $\dim F = n$, cette base est une famille libre à $n$ éléments de $E$, donc une base de $E$ par (ii), et $F = E$.
    remarques:
      - |
        Ainsi $K^n$ est de dimension $n$, de base $(\delta_1, \dots, \delta_n)$. Deux espaces de dimension finie sont isomorphes si et seulement s'ils ont même dimension : la dimension est le seul invariant.
      - |
        En dimension infinie, deux bases d'un même espace sont encore équipotentes, ce qui permet de définir la dimension comme un [[cardinal]] ; la démonstration utilise l'arithmétique des cardinaux infinis.

  - id: v-rang
    etiquette: Théorème du rang
    nature: théorème
    titre: Théorème du rang
    enonce: |
      Soit $E$ de dimension finie et $u \in \mathcal L(E, F)$. Alors $\operatorname{Im} u$ est de dimension finie, appelée le [[rang]] de $u$, et
      $$\dim E = \dim \operatorname{Ker} u + \operatorname{rg} u.$$
      En particulier, si $\dim E = \dim F$ est finie, $u$ est injective si et seulement si elle est surjective. Pour deux sous-espaces $F$ et $G$ d'un espace de dimension finie, $\dim(F + G) = \dim F + \dim G - \dim(F \cap G)$.
    preuve: |
      Soit $(e_1, \dots, e_k)$ une base de $\operatorname{Ker} u$, complétée en une base $(e_1, \dots, e_n)$ de $E$ ({{v-dimension|Dimension}}). Les vecteurs $u(e_{k+1}), \dots, u(e_n)$ engendrent $\operatorname{Im} u$, puisque $u(e_i) = 0$ pour $i \leqslant k$. Ils sont libres : si $\sum_{j > k} \lambda_j u(e_j) = 0$, alors $\sum_{j > k} \lambda_j e_j \in \operatorname{Ker} u$ s'écrit $\sum_{i \leqslant k} \mu_i e_i$, et la liberté de la base donne $\lambda_j = 0$. Donc $\operatorname{rg} u = n - k$.

      Si $\dim E = \dim F$, l'injectivité équivaut à $\operatorname{Ker} u = \{0\}$, donc à $\operatorname{rg} u = \dim F$, donc à $\operatorname{Im} u = F$ ({{v-dimension|Dimension}}).

      Pour la formule de Grassmann, on applique le théorème à $s : F \times G \to E$, $(f, g) \mapsto f + g$. Son image est $F + G$, son noyau $\{(x, -x) : x \in F \cap G\}$ est isomorphe à $F \cap G$, et $\dim(F \times G) = \dim F + \dim G$, une base étant formée des $(f_i, 0)$ et des $(0, g_j)$.
    remarques:
      - |
        En dimension infinie, l'équivalence entre injectivité et surjectivité tombe. Sur $K^{(\mathbb N)}$, le décalage $(x_0, x_1, \dots) \mapsto (0, x_0, x_1, \dots)$ est injectif sans être surjectif.

  - id: v-matrices
    etiquette: Matrices
    nature: proposition
    titre: Matrices d'une application linéaire
    texte: |
      Une **matrice** à $p$ lignes et $n$ colonnes est une famille $A = (a_{ij})$ de scalaires indexée par $\{1, \dots, p\} \times \{1, \dots, n\}$ ; leur ensemble $\mathcal M_{p,n}(K)$ est un espace vectoriel. Le produit de $A \in \mathcal M_{p,n}(K)$ et $B \in \mathcal M_{n,q}(K)$ est la matrice $AB \in \mathcal M_{p,q}(K)$ de coefficients $\sum_{k=1}^n a_{ik} b_{kj}$. Si $\mathcal B = (e_1, \dots, e_n)$ et $\mathcal C = (f_1, \dots, f_p)$ sont des bases de $E$ et $F$, la **matrice** de $u \in \mathcal L(E, F)$ dans ces bases est la matrice dont la $j$-ième colonne contient les coordonnées de $u(e_j)$ dans $\mathcal C$.
    enonce: |
      (i) $u \mapsto \operatorname{Mat}_{\mathcal B, \mathcal C}(u)$ est un isomorphisme d'espaces vectoriels de $\mathcal L(E, F)$ sur $\mathcal M_{p,n}(K)$ ; en particulier $\dim \mathcal L(E, F) = np$.

      (ii) Si $v \in \mathcal L(F, G)$ et $\mathcal D$ est une base de $G$, alors $\operatorname{Mat}_{\mathcal B, \mathcal D}(v \circ u) = \operatorname{Mat}_{\mathcal C, \mathcal D}(v)\operatorname{Mat}_{\mathcal B, \mathcal C}(u)$.
    preuve: |
      (i) La correspondance est linéaire, puisque les coordonnées le sont ; elle est bijective par la propriété universelle des bases ({{v-libre|Familles libres, bases}}), une application linéaire étant déterminée par les images arbitraires des $e_j$. L'espace $\mathcal M_{p,n}(K)$ a pour base les matrices élémentaires, qui ont un seul coefficient égal à $1$.

      (ii) Notons $A = (a_{kj})$ la matrice de $u$ et $B = (b_{ik})$ celle de $v$. Alors
      $$v(u(e_j)) = v\Big(\sum_k a_{kj} f_k\Big) = \sum_k a_{kj} \sum_i b_{ik} g_i = \sum_i \Big(\sum_k b_{ik} a_{kj}\Big) g_i,$$
      ce qui est le coefficient $(i, j)$ de $BA$.
    remarques:
      - |
        La définition du produit des matrices n'a rien d'arbitraire : c'est la seule qui traduise la composition. Elle n'est pas commutative. Pour $A = \begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$ et $B = \begin{pmatrix} 0 & 0 \\ 1 & 0 \end{pmatrix}$, on trouve $AB = \begin{pmatrix} 1 & 0 \\ 0 & 0 \end{pmatrix}$ et $BA = \begin{pmatrix} 0 & 0 \\ 0 & 1 \end{pmatrix}$, et l'on a même $A^2 = 0$ avec $A \neq 0$ : l'anneau $\mathcal M_2(K)$ n'est pas intègre.

  - id: v-dual
    etiquette: Dualité
    nature: proposition
    titre: Espace dual
    texte: |
      L'[[espace-dual|espace dual]] de $E$ est $E^* = \mathcal L(E, K)$ ; ses éléments sont les **formes linéaires**.
    enonce: |
      Soit $E$ de dimension finie $n$ et $(e_1, \dots, e_n)$ une base.

      (i) Les formes $e_1^*, \dots, e_n^*$ définies par $e_i^*(e_j) = 1$ si $i = j$ et $0$ sinon forment une base de $E^*$, la **base duale** ; en particulier $\dim E^* = n$.

      (ii) L'application $E \to E^{**}$ qui envoie $x$ sur l'évaluation $\varphi \mapsto \varphi(x)$ est un isomorphisme, qui ne dépend d'aucun choix de base.
    preuve: |
      (i) Les $e_i^*$ existent par la propriété universelle ({{v-libre|Familles libres, bases}}). Si $\sum_i \lambda_i e_i^* = 0$, on applique à $e_j$ : $\lambda_j = 0$. Toute forme $\varphi$ coïncide avec $\sum_i \varphi(e_i) e_i^*$ sur la base, donc lui est égale.

      (ii) L'application est linéaire. Si $x \neq 0$, on complète $x$ en une base ({{v-dimension|Dimension}}) ; la première forme de la base duale vaut $1$ en $x$, donc l'évaluation en $x$ n'est pas nulle : l'application est injective. Comme $\dim E^{**} = \dim E^* = \dim E$, elle est bijective par le théorème du rang ({{v-rang|Théorème du rang}}).
    remarques:
      - |
        L'isomorphisme $E \cong E^*$ fourni par une base dépend de la base ; celui de $E$ sur $E^{**}$ n'en dépend pas. C'est l'exemple qui a conduit Eilenberg et Mac Lane, en 1945, à préciser la notion d'isomorphisme « naturel ».
      - |
        En dimension infinie, $E^*$ est strictement plus gros que $E$ : le dual de $K^{(\mathbb N)}$ est isomorphe à $K^{\mathbb N}$, dont la dimension est strictement plus grande que celle de $K^{(\mathbb N)}$ (théorème d'Erdős-Kaplansky). L'analyse fonctionnelle remplace pour cette raison le dual algébrique par le dual topologique.

  - id: v-permutations
    etiquette: Permutations, signature
    nature: proposition
    titre: Groupe symétrique et signature
    texte: |
      Pour $n \geqslant 1$, le [[groupe-symetrique|groupe symétrique]] $\mathfrak S_n$ est l'ensemble des bijections de $\{1, \dots, n\}$ sur lui-même, muni de la composition ; c'est un [[groupe]], d'élément neutre l'identité. Pour $a \neq b$, la **transposition** $(a\ b)$ échange $a$ et $b$ et fixe les autres éléments.

      Soit $\sigma \in \mathfrak S_n$ et $P = \{i, j\}$ une paire, avec $i < j$. On pose $s_\sigma(P) = 1$ si $\sigma(i) < \sigma(j)$, c'est-à-dire si $\sigma$ respecte l'ordre de $P$, et $s_\sigma(P) = -1$ sinon. Ces valeurs sont prises dans le groupe à deux éléments $\{1, -1\}$, où $(-1)^2 = 1$. La [[signature-permutation|signature]] de $\sigma$ est le produit
      $$\varepsilon(\sigma) = \prod_{P} s_\sigma(P),$$
      étendu aux paires de $\{1, \dots, n\}$, défini comme les sommes finies du nœud {{v-combinaisons|Combinaisons linéaires}}, puisque le groupe $\{1, -1\}$ est commutatif.
    enonce: |
      (i) Toute permutation est un produit de transpositions, l'identité étant le produit vide.

      (ii) $\varepsilon$ est un morphisme de groupes de $\mathfrak S_n$ dans $\{1, -1\}$.

      (iii) Toute transposition a pour signature $-1$. Par suite, si $\sigma$ est le produit de $k$ transpositions, $\varepsilon(\sigma) = (-1)^k$ : la parité de $k$ ne dépend que de $\sigma$.
    preuve: |
      (i) Par récurrence sur $n$, le cas $n = 1$ étant trivial. Soit $\sigma \in \mathfrak S_n$ et $m = \sigma(n)$. Si $m \neq n$, la permutation $\tau\sigma$, où $\tau = (m\ n)$, fixe $n$ ; sinon on prend $\tau = \mathrm{id}$. La restriction de $\tau\sigma$ à $\{1, \dots, n - 1\}$ est une permutation, produit de transpositions par hypothèse de récurrence, et $\sigma = \tau(\tau\sigma)$ puisque $\tau^2 = \mathrm{id}$.

      (ii) Soient $\sigma, \tau$ et $P = \{i, j\}$ avec $i < j$. Si $\tau(i) < \tau(j)$, $\sigma\tau$ respecte l'ordre de $P$ si et seulement si $\sigma$ respecte celui de $\tau(P)$ ; si $\tau(i) > \tau(j)$, il le respecte si et seulement si $\sigma$ inverse celui de $\tau(P)$. Dans les deux cas,
      $$s_{\sigma\tau}(P) = s_\sigma(\tau(P))\, s_\tau(P).$$
      On fait le produit sur toutes les paires. L'application $P \mapsto \tau(P)$ est une bijection de l'ensemble des paires, et un produit fini dans un groupe commutatif ne change pas quand on réindexe ses facteurs par une bijection, par l'unicité qui le caractérise. Donc $\prod_P s_\sigma(\tau(P)) = \varepsilon(\sigma)$, et $\varepsilon(\sigma\tau) = \varepsilon(\sigma)\varepsilon(\tau)$.

      (iii) Soit $\tau = (a\ b)$ avec $a < b$. Les paires dont $\tau$ inverse l'ordre sont $\{a, b\}$, et, pour chaque $k$ tel que $a < k < b$, les deux paires $\{a, k\}$ et $\{k, b\}$ ; toutes les autres sont respectées. Il y a donc $2(b - a - 1) + 1$ facteurs égaux à $-1$, nombre impair, et $\varepsilon(\tau) = -1$. La dernière assertion découle de (ii).
    remarques:
      - |
        Dans $\mathfrak S_3$, l'identité et les deux permutations circulaires $1 \mapsto 2 \mapsto 3 \mapsto 1$ et $1 \mapsto 3 \mapsto 2 \mapsto 1$ ont pour signature $1$, et les trois transpositions ont pour signature $-1$. Une permutation circulaire de trois éléments est en effet le produit de deux transpositions, par exemple $(1\ 2\ 3) = (1\ 3)(1\ 2)$.
      - |
        L'erreur la plus répandue est de croire que la décomposition en transpositions est unique. Elle ne l'est pas, même en nombre de facteurs : $\mathrm{id} = (1\ 2)(1\ 2)$ s'écrit avec zéro ou deux transpositions. Seule la **parité** du nombre de facteurs est déterminée, et c'est exactement ce que mesure la signature.

  - id: v-formes-alternees
    etiquette: Formes alternées
    nature: théorème
    titre: Formes multilinéaires alternées
    texte: |
      Soit $E$ un espace vectoriel de dimension $n \geqslant 1$. Une forme $n$-linéaire $f : E^n \to K$ est linéaire par rapport à chacune de ses variables, les autres étant fixées. Elle est [[forme-alternee|alternée]] si $f(x_1, \dots, x_n) = 0$ dès que deux des $x_k$ sont égaux. Pour une base $\mathcal B = (e_1, \dots, e_n)$, on note $x_{ij}$ la $i$-ième coordonnée de $x_j$ dans $\mathcal B$, et l'on pose
      $$\det\nolimits_{\mathcal B}(x_1, \dots, x_n) = \sum_{\sigma \in \mathfrak S_n} \varepsilon(\sigma) \prod_{j=1}^n x_{\sigma(j)\, j},$$
      où $\varepsilon(\sigma)$ est vu dans $K$, par $1 \mapsto 1$ et $-1 \mapsto -1$.
    enonce: |
      (i) Si $f$ est $n$-linéaire alternée, alors $f(x_{\sigma(1)}, \dots, x_{\sigma(n)}) = \varepsilon(\sigma) f(x_1, \dots, x_n)$ pour toute $\sigma \in \mathfrak S_n$, et $f(x_1, \dots, x_n) = 0$ dès que la famille $(x_1, \dots, x_n)$ est liée.

      (ii) $\det_{\mathcal B}$ est une forme $n$-linéaire alternée, qui vaut $1$ en $(e_1, \dots, e_n)$.

      (iii) Toute forme $n$-linéaire alternée $f$ vérifie $f = f(e_1, \dots, e_n)\, \det_{\mathcal B}$. L'espace des formes $n$-linéaires alternées sur $E$ est donc de dimension $1$, de base $\det_{\mathcal B}$.
    preuve: |
      (i) En développant $f(\dots, x + y, \dots, x + y, \dots) = 0$ par linéarité dans les deux places concernées, on obtient $f(\dots, x, \dots, y, \dots) = -f(\dots, y, \dots, x, \dots)$ : la formule vaut pour une transposition. Si elle vaut pour $\sigma$ et si $\tau$ est une transposition, posons $y_k = x_{\sigma(k)}$ ; alors $x_{\sigma\tau(k)} = y_{\tau(k)}$, et
      $$\begin{aligned} f(x_{\sigma\tau(1)}, \dots, x_{\sigma\tau(n)}) &= -f(y_1, \dots, y_n) \\ &= -\varepsilon(\sigma) f(x_1, \dots, x_n) \\ &= \varepsilon(\sigma\tau) f(x_1, \dots, x_n). \end{aligned}$$
      On conclut par {{v-permutations|Permutations, signature}}, (i). Si la famille est liée, l'un des vecteurs, disons $x_k$, est combinaison linéaire des autres ; en développant par linéarité dans la place $k$, chaque terme contient deux fois le même vecteur et s'annule.

      (ii) Chaque produit $\prod_j x_{\sigma(j)\, j}$ contient exactement un facteur issu de chaque $x_j$, et les coordonnées sont linéaires : $\det_{\mathcal B}$ est $n$-linéaire. Supposons $x_k = x_l$ avec $k < l$, et soit $\tau = (k\ l)$. Pour toute $\sigma$, les produits associés à $\sigma$ et à $\sigma\tau$ sont égaux, puisque $x_{\sigma\tau(k)\, k} = x_{\sigma(l)\, l}$ et $x_{\sigma\tau(l)\, l} = x_{\sigma(k)\, k}$, tandis que $\varepsilon(\sigma\tau) = -\varepsilon(\sigma)$. L'application $\sigma \mapsto \sigma\tau$ est une bijection du noyau de $\varepsilon$ sur son complémentaire ; en regroupant ainsi les termes deux à deux, la somme est nulle. Enfin, pour $x_j = e_j$, le produit $\prod_j x_{\sigma(j)\, j}$ est nul sauf si $\sigma(j) = j$ pour tout $j$ : seule l'identité contribue, pour $1$.

      (iii) Écrivons $x_j = \sum_i x_{ij} e_i$ et développons par multilinéarité :
      $$f(x_1, \dots, x_n) = \sum_{\varphi} \Big(\prod_j x_{\varphi(j)\, j}\Big) f(e_{\varphi(1)}, \dots, e_{\varphi(n)}),$$
      la somme portant sur les applications $\varphi$ de $\{1, \dots, n\}$ dans lui-même. Si $\varphi$ n'est pas injective, deux arguments sont égaux et le terme est nul. Une injection d'un ensemble fini dans lui-même est une bijection ({{n-fini|Ensembles finis}}, (iii)) ; par (i), $f(e_{\sigma(1)}, \dots, e_{\sigma(n)}) = \varepsilon(\sigma) f(e_1, \dots, e_n)$, d'où $f = f(e_1, \dots, e_n) \det_{\mathcal B}$. Par (ii), $\det_{\mathcal B}$ n'est pas nulle, et elle engendre l'espace des formes alternées.
    remarques:
      - |
        En caractéristique $2$, où $-1 = 1$ dans $K$, l'antisymétrie $f(\dots, x, \dots, y, \dots) = -f(\dots, y, \dots, x, \dots)$ n'entraîne pas que $f$ s'annule quand deux arguments sont égaux. C'est pourquoi la définition porte sur cette annulation, plus forte, et non sur l'antisymétrie : avec elle, la théorie vaut sur tout corps.
      - |
        Pour $n = 2$, $\det_{\mathcal B}(x, y) = x_1y_2 - x_2y_1$ : les deux permutations de $\mathfrak S_2$ donnent les deux termes. Pour $n = 3$, les six permutations donnent la règle de Sarrus, qui ne se généralise pas : en dimension $4$, la somme compte $24$ termes, et non $8$.

  - id: v-determinant
    etiquette: Déterminant
    nature: théorème
    titre: Déterminant d'un endomorphisme, d'une matrice
    texte: |
      Soit $E$ de dimension $n \geqslant 1$ et $u \in \mathcal L(E)$. Si $f$ est une forme $n$-linéaire alternée, $(x_1, \dots, x_n) \mapsto f(u(x_1), \dots, u(x_n))$ en est une autre. Le [[determinant|déterminant]] $\det u$ est le scalaire tel que
      $$f(u(x_1), \dots, u(x_n)) = \det u \cdot f(x_1, \dots, x_n)$$
      pour toute forme $f$ et tous $x_1, \dots, x_n$. Le déterminant d'une matrice carrée $A = (a_{ij})$ est $\det A = \sum_{\sigma \in \mathfrak S_n} \varepsilon(\sigma) \prod_j a_{\sigma(j)\, j}$, c'est-à-dire le déterminant de ses colonnes dans la base canonique de $K^n$. Le **cofacteur** $C_{ij}$ est $(-1)^{i+j}\Delta_{ij}$, où le mineur $\Delta_{ij}$ est le déterminant de la matrice obtenue en supprimant la ligne $i$ et la colonne $j$ ; la **comatrice** est $\operatorname{com} A = (C_{ij})$.
    enonce: |
      (i) $\det u$ existe et est unique ; $\det(v \circ u) = \det v \cdot \det u$ et $\det \mathrm{id} = 1$.

      (ii) $u$ est bijectif si et seulement si $\det u \neq 0$, et alors $\det(u^{-1}) = (\det u)^{-1}$.

      (iii) $\det u$ est le déterminant de la matrice de $u$ dans n'importe quelle base. Pour deux matrices carrées, $\det(AB) = \det A \cdot \det B$ et $\det {}^tA = \det A$, où ${}^tA = (a_{ji})$ est la transposée.

      (iv) *Développement et comatrice.* Pour tout $j$, $\det A = \sum_i a_{ij} C_{ij}$, et
      $$A\, {}^t\!\operatorname{com} A = {}^t\!\operatorname{com} A\; A = \det A \cdot I_n.$$
      En particulier, si $\det A \neq 0$, alors $A^{-1} = \dfrac{1}{\det A}\, {}^t\!\operatorname{com} A$.
    preuve: |
      (i) L'application $f \mapsto f(u(\cdot), \dots, u(\cdot))$ est un endomorphisme de l'espace des formes alternées, qui est de dimension $1$ ({{v-formes-alternees|Formes alternées}}, (iii)) ; un tel endomorphisme est la multiplication par un unique scalaire, car il envoie la base $\det_{\mathcal B}$ sur un multiple $\lambda \det_{\mathcal B}$. Ensuite $f(vu(x_1), \dots) = \det v \cdot f(u(x_1), \dots) = \det v \cdot \det u \cdot f(x_1, \dots)$, et l'identité donne $1$.

      (ii) Si $u$ est bijectif, $\det u \cdot \det u^{-1} = \det \mathrm{id} = 1$. Sinon, $u$ n'est pas surjectif ({{v-rang|Théorème du rang}}), et la famille $(u(e_1), \dots, u(e_n))$ est liée, car une famille libre de $n$ vecteurs serait une base ({{v-dimension|Dimension}}, (ii)) ; donc $\det u = \det u \cdot \det_{\mathcal B}(e_1, \dots, e_n) = \det_{\mathcal B}(u(e_1), \dots, u(e_n)) = 0$.

      (iii) Si $A$ est la matrice de $u$ dans $\mathcal B$, les coordonnées de $u(e_j)$ forment la $j$-ième colonne de $A$, et $\det u = \det_{\mathcal B}(u(e_1), \dots, u(e_n)) = \det A$ ; le premier membre ne dépend d'aucune base. La formule du produit découle de (i) et de {{v-matrices|Matrices}}, (ii). Pour la transposée, en réindexant chaque produit par $i = \sigma(j)$, $\prod_j a_{\sigma(j)\, j} = \prod_i a_{i\, \sigma^{-1}(i)}$, et $\varepsilon(\sigma^{-1}) = \varepsilon(\sigma)$ ; comme $\sigma \mapsto \sigma^{-1}$ est une bijection de $\mathfrak S_n$, $\det A = \sum_\rho \varepsilon(\rho) \prod_i a_{i\, \rho(i)} = \det {}^tA$. Le déterminant est donc aussi multilinéaire et alterné par rapport aux lignes.

      (iv) Par linéarité par rapport à la colonne $j$, $\det A = \sum_i a_{ij} D_{ij}$, où $D_{ij}$ est le déterminant de la matrice $A_{ij}$ obtenue en remplaçant la colonne $j$ de $A$ par le $i$-ième vecteur de la base canonique. Amenons cette colonne en première position par $j - 1$ échanges de colonnes voisines, puis la ligne $i$ en première position par $i - 1$ échanges de lignes voisines : le déterminant est multiplié par $(-1)^{i+j}$, et l'on obtient une matrice dont la première colonne est $(1, 0, \dots, 0)$ et dont le bloc obtenu en supprimant la première ligne et la première colonne est la matrice du mineur $\Delta_{ij}$. Dans la formule du déterminant de cette matrice, seules les $\sigma$ qui fixent $1$ contribuent, et ces $\sigma$ s'identifient aux permutations de $\{2, \dots, n\}$, avec la même signature, puisque les paires $\{1, k\}$ sont respectées. Donc $D_{ij} = (-1)^{i+j}\Delta_{ij} = C_{ij}$.

      Le coefficient $(j, k)$ de ${}^t\!\operatorname{com} A\; A$ est $\sum_i C_{ij} a_{ik}$ : c'est, par le même développement, le déterminant de la matrice obtenue en remplaçant la colonne $j$ de $A$ par sa colonne $k$. Il vaut $\det A$ si $j = k$, et $0$ sinon, deux colonnes étant égales. L'autre égalité s'obtient en appliquant celle-ci à ${}^tA$, dont la comatrice est ${}^t\!\operatorname{com} A$, puis en transposant, avec ${}^t(XY) = {}^tY\, {}^tX$.
    remarques:
      - |
        Pour $A = \begin{pmatrix} 2 & 1 & 0 \\ 1 & 3 & 1 \\ 0 & 1 & 4 \end{pmatrix}$, le développement suivant la première colonne donne $\det A = 2 \cdot 11 - 1 \cdot 4 + 0 = 18$, et la comatrice, symétrique ici comme $A$, est $\begin{pmatrix} 11 & -4 & 1 \\ -4 & 8 & -2 \\ 1 & -2 & 5 \end{pmatrix}$. Ainsi $A^{-1} = \frac{1}{18}\,{}^t\!\operatorname{com} A$ a pour premier coefficient $11/18$ ; on vérifie que le produit par $A$ redonne $I_3$. La formule est précieuse en théorie, mais coûteuse en pratique : la méthode du pivot inverse une matrice bien plus vite.
      - |
        L'erreur la plus répandue est de traiter le déterminant comme une application linéaire. Il est multiplicatif, mais pas additif : $\det(I_2 + I_2) = \det(2I_2) = 4$, alors que $\det I_2 + \det I_2 = 2$. En général $\det(\lambda A) = \lambda^n \det A$, puisque chacune des $n$ colonnes est multipliée par $\lambda$.
      - |
        Sur $\mathbb R$, le signe du déterminant sépare les bases en deux classes, celles qui ont même orientation que la base canonique et les autres, et sa valeur absolue mesure le facteur par lequel $u$ multiplie les volumes. Le premier fait fonde l'orientation des variétés, le second la formule du changement de variables en théorie de la {{mes|mesure}}. Sur $\mathbb R$, le déterminant est polynomial en les coefficients, donc continu : c'est ce que le nœud {{gd-gl|Groupe linéaire}} utilise.

  - id: v-algebre-exterieure
    etiquette: Algèbre extérieure
    nature: théorème
    titre: Formes alternées de degré quelconque, produit extérieur
    texte: |
      Soit $E$ un espace vectoriel de dimension $n \geqslant 1$ et $k \in \mathbb N$. On note $\Lambda^k(E)$ l'espace des [[forme-alternee|formes $k$-linéaires alternées]] sur $E$, avec $\Lambda^0(E) = K$. Soit $(e_1, \dots, e_n)$ une base et $(e_1^*, \dots, e_n^*)$ sa base duale ({{v-dual|Dualité}}). Pour une suite strictement croissante $I = (i_1 < \cdots < i_k)$ d'éléments de $\{1, \dots, n\}$, on pose
      $$e_I^*(x_1, \dots, x_k) = \det\big(e_{i_a}^*(x_b)\big)_{1 \leqslant a, b \leqslant k},$$
      et $e_I = (e_{i_1}, \dots, e_{i_k})$.
    enonce: |
      (i) Les $e_I^*$ forment une base de $\Lambda^k(E)$, et $\alpha = \sum_I \alpha(e_I)\, e_I^*$ ; la dimension de $\Lambda^k(E)$ est le nombre de parties à $k$ éléments de $\{1, \dots, n\}$, et $\Lambda^k(E) = \{0\}$ pour $k > n$.

      (ii) Il existe un unique produit bilinéaire et associatif $\wedge : \Lambda^k(E) \times \Lambda^l(E) \to \Lambda^{k+l}(E)$, le [[produit-exterieur|produit extérieur]], tel que pour toutes formes linéaires $\varphi_1, \dots, \varphi_k$,
      $$(\varphi_1 \wedge \cdots \wedge \varphi_k)(x_1, \dots, x_k) = \det\big(\varphi_a(x_b)\big).$$
      Il ne dépend d'aucune base, vérifie $\alpha \wedge \beta = (-1)^{kl}\beta \wedge \alpha$ pour $\alpha \in \Lambda^k$ et $\beta \in \Lambda^l$, et $\varphi \wedge \varphi = 0$ pour $\varphi \in E^*$. En particulier $e_I^* = e_{i_1}^* \wedge \cdots \wedge e_{i_k}^*$.

      (iii) Pour $u \in \mathcal L(F, E)$, l'image réciproque $u^*\alpha(y_1, \dots, y_k) = \alpha(u(y_1), \dots, u(y_k))$ définit une application linéaire $\Lambda^k(E) \to \Lambda^k(F)$, avec $u^*(\alpha \wedge \beta) = u^*\alpha \wedge u^*\beta$ et $(u \circ v)^* = v^* \circ u^*$. Si $u \in \mathcal L(E)$ et $\alpha \in \Lambda^n(E)$, $u^*\alpha = \det u \cdot \alpha$.
    preuve: |
      (i) Écrivons $x_b = \sum_i x_{ib} e_i$ et développons $\alpha(x_1, \dots, x_k)$ par multilinéarité, comme au nœud {{v-formes-alternees|Formes alternées}}, (iii) : la somme porte sur les applications $\varphi : \{1, \dots, k\} \to \{1, \dots, n\}$, et les termes où $\varphi$ n'est pas injective sont nuls. Une injection s'écrit de façon unique $\varphi(b) = i_{\sigma(b)}$, où $I$ est l'image rangée par ordre croissant et $\sigma \in \mathfrak S_k$ ; alors $\alpha(e_{\varphi(1)}, \dots) = \varepsilon(\sigma)\alpha(e_I)$. En regroupant selon $I$, on obtient $\alpha(x) = \sum_I \alpha(e_I) \sum_\sigma \varepsilon(\sigma)\prod_b x_{i_{\sigma(b)}\, b}$, et la somme intérieure est le déterminant qui définit $e_I^*(x)$ ({{v-determinant|Déterminant}}). Les $e_I^*$ sont alternées, le déterminant l'étant par rapport à ses colonnes, et $e_I^*(e_J)$ vaut $1$ si $I = J$, $0$ sinon, puisque la matrice a alors une ligne nulle : la famille est libre.

      (ii) *Construction.* Pour $I$ et $J$ disjoints, soit $\varepsilon(I, J)$ la signature de la permutation qui range par ordre croissant la suite $(I, J)$ ; on pose $e_I^* \wedge e_J^* = \varepsilon(I, J)\, e_{I \cup J}^*$, et $0$ si $I \cap J \neq \varnothing$, puis on prolonge par bilinéarité. Ranger $(I, J, L)$ en deux temps, d'abord $(I, J)$ puis le tout, ou d'abord $(J, L)$, donne la même permutation ; la signature étant un morphisme ({{v-permutations|Permutations, signature}}), $\varepsilon(I, J)\varepsilon(I \cup J, L) = \varepsilon(J, L)\varepsilon(I, J \cup L)$, d'où l'associativité. Passer de $(J, I)$ à $(I, J)$ demande $|I|\,|J|$ transpositions de voisins, d'où la règle des signes. Pour $\varphi = \sum c_i e_i^*$, $\varphi \wedge \varphi = \sum_{i < j} c_ic_j(e_i^* \wedge e_j^* + e_j^* \wedge e_i^*) = 0$.

      *Formule du déterminant.* Les deux membres sont multilinéaires et alternés en $(\varphi_1, \dots, \varphi_k)$ : le premier parce que l'on peut amener deux facteurs égaux côte à côte, au signe près, puis utiliser $\varphi \wedge \varphi = 0$ ; le second parce qu'un déterminant à deux lignes égales est nul ({{v-determinant|Déterminant}}, (iii)). Par (i), appliqué à l'espace $E^*$, ils sont déterminés par leurs valeurs en $(e_{j_1}^*, \dots, e_{j_k}^*)$ avec $j_1 < \cdots < j_k$, où les deux valent $e_J^*(x)$. *Unicité et indépendance de la base.* Un produit associatif vérifiant la formule est déterminé sur les $e_I^* = e_{i_1}^* \wedge \cdots \wedge e_{i_k}^*$, qui forment une base ; la formule ne faisant intervenir aucune base, le produit construit à partir d'une autre base lui est égal.

      (iii) $u^*\alpha$ est multilinéaire et alternée. Pour des formes linéaires, $u^*(\varphi_1 \wedge \cdots \wedge \varphi_k) = (\varphi_1 \circ u) \wedge \cdots \wedge (\varphi_k \circ u)$ par la formule du déterminant ; ces produits engendrent $\Lambda^k(E)$, et l'on conclut par bilinéarité. La composition est immédiate, et la dernière formule est la définition de $\det u$.
    remarques:
      - |
        Pour $n = 3$, les dimensions des $\Lambda^k$ sont $1, 3, 3, 1$. Le produit $\varphi \wedge \psi$ de deux formes linéaires a pour coordonnées sur $e_{23}^*, e_{31}^*, e_{12}^*$ celles du produit vectoriel des vecteurs de coordonnées de $\varphi$ et $\psi$ : le produit vectoriel est un produit extérieur déguisé, propre à la dimension $3$.
      - |
        L'erreur la plus répandue est de croire que $\alpha \wedge \alpha = 0$ pour toute forme. C'est vrai en degré impair, par la règle des signes, mais faux en degré pair : pour $\alpha = e_1^* \wedge e_2^* + e_3^* \wedge e_4^*$ sur $K^4$, $\alpha \wedge \alpha = 2\, e_1^* \wedge e_2^* \wedge e_3^* \wedge e_4^*$, qui n'est pas nul si $2 \neq 0$ dans $K$.

