# Niveau 2 : structure interne du chapitre « Substitution et instances dans l'arithmétique de Peano » (nœud
# cal-instances-pa du graphe calc, après cal-syntaxe-pa). Quatrième sous-lot (C3b) de la démonstration, dans PA,
# des conditions de dérivabilité de la formule naturelle de démontrabilité (point (ii) de l-incompletude,
# (D3) levé en cal-sigma-pa) : récurrence sur la longueur, associativité de la concaténation, inégalités des
# facteurs ; règles de formation des termes et des formules, chiffres num(x) ; substitution dépliée dans un mot
# fixé (gabarits) ; formules des instances et substituabilité des termes inertes ; reconnaissance des axiomes du
# groupe (2), instanciation formalisée, (D1) et (D2) à un paramètre, introduction formalisée de ∃.
# Constructions : celles de cal-pr-codage, cal-pr-cloture, cal-sx-* et cal-tarski (i), lues littéralement.
# Tout est démontré dans le système de l-deduction, avec les règles de cal-rp-calcul, cal-pa-recurrence et des
# chapitres cal-peano, cal-beta-pa, cal-syntaxe-pa. Aucune forme de l'axiome du choix. Identifiants « cal-ip- ».
# Ne dépend pas de cal-diagonal : ses notions ne sont citées qu'en remarque.

graphe: cal-instances-pa
titre: Substitution et instances dans PA
conteneur: cal-instances-pa

entrees:
  cal-syntaxe-pa: [cal-ip-facteurs]

noeuds:
  - id: cal-ip-facteurs
    etiquette: Facteurs dans PA
    nature: proposition
    titre: Récurrence sur la longueur, associativité de la concaténation et inégalités des facteurs dans l'arithmétique de Peano
    texte: |
      Les conventions sont celles de {{cal-sp-concatenation|Concaténation dans PA}}. Pour des termes fonctionnels $M_1, \dots, M_r$, avec $r \geqslant 2$, on note $\mathrm{cc}(M_1, \dots, M_r)$ le terme fonctionnel $\mathrm{conc}(\mathrm{cc}(M_1, \dots, M_{r-1}), M_r)$, avec $\mathrm{cc}(M_1, M_2) = \mathrm{conc}(M_1, M_2)$, comme au nœud {{cal-sx-codage|Codage des mots}} ; ainsi $\mathrm{cc}(M, A, B)$ est $\mathrm{conc}(\mathrm{conc}(M, A), B)$.

      Les [[facteur-mot|facteurs]] sont pris avec la construction de la preuve du point (i) du {{cal-sx-codage|codage des mots}} : la fonction $\sigma$ est définie par récurrence primitive sur $t$, avec les paramètres $N$ et $i$, à partir de la fonction nulle $Z \circ P^2_1$ et de la fonction $(N, i, t, u) \mapsto \mathrm{aj}\big(u, (N)^{i + t}\big)$, composée de $\mathrm{aj}$, de $(\cdot)^{\cdot}$, de $\mathrm{add}$ et de [[projection-produit|projections]] ; puis $\mathrm{sm}(N, i, j) = \sigma(N, i, j \mathbin{\dot{-}} i)$. Le détail de ces compositions est fixé ici par convention, et, comme au nœud {{cal-sp-ajout|Ajout dans PA}}, deux constructions dont $\mathsf{PA}$ démontre l'égalité des valeurs donnent des définitions équivalentes dans $\mathsf{PA}$. Comme au nœud {{cal-sp-termes|Termes fonctionnels}}, le point (iv) de {{cal-bp-fonctions|Fonctions p.r. dans PA}} et le point (ii) (d) de {{cal-sp-termes|Termes fonctionnels}} donnent
      $$\begin{aligned} &\vdash_{\mathsf{PA}} \sigma(N, i, 0) = 0, \\ &\vdash_{\mathsf{PA}} \sigma(N, i, S\,t) \\ &\qquad = \mathrm{aj}\big(\sigma(N, i, t), (N)^{i + t}\big), \end{aligned}$$
      et $\vdash_{\mathsf{PA}} \mathrm{sm}(N, i, j) = \sigma(N, i, j \mathbin{\dot{-}} i)$.
    enonce: |
      (i) **Récurrence sur la longueur.** Soit $\Gamma$ un ensemble fini de formules, $\varphi$ une formule fonctionnelle, $N$ et $v$ deux variables distinctes, qui ne sont libres dans aucune formule de $\Gamma$ et ne sont pas quantifiées dans $\varphi$, la variable $v$ ne figurant pas dans $\varphi$. Si $\Gamma \vdash_{\mathsf{PA}} \varphi[0/N]$ et $\Gamma \cup \{\varphi\} \vdash_{\mathsf{PA}} \varphi[\mathrm{aj}(N, v)/N]$, alors $\Gamma \vdash_{\mathsf{PA}} \varphi$.

      Pour tous termes fonctionnels $M$, $N$, $P$, $A$, $B$, $h$, $h'$, $v$, $i$, $s$, $t$ :

      (ii) **Associativité.** $\vdash_{\mathsf{PA}} \mathrm{conc}(M, \mathrm{conc}(N, P)) = \mathrm{conc}(\mathrm{conc}(M, N), P)$.

      (iii) **Inégalités.** On a
      $$\begin{aligned} &\vdash_{\mathsf{PA}} h \leqslant h' \to \mathrm{aj}(h, v) \leqslant \mathrm{aj}(h', v), \\ &\vdash_{\mathsf{PA}} h < h' \to \mathrm{aj}(h, v) < \mathrm{aj}(h', v), \end{aligned}$$
      $\vdash_{\mathsf{PA}} M \leqslant \mathrm{conc}(M, N)$, $\vdash_{\mathsf{PA}} N \leqslant \mathrm{conc}(M, N)$,
      $$\begin{aligned} &\vdash_{\mathsf{PA}} \neg(N = 0) \to M < \mathrm{conc}(M, N), \\ &\vdash_{\mathsf{PA}} \neg(M = 0) \to N < \mathrm{conc}(M, N). \end{aligned}$$

      (iv) **Facteurs.** On a $\vdash_{\mathsf{PA}} \mathrm{lg}(\sigma(N, i, t)) = t$,
      $$\begin{aligned} &\vdash_{\mathsf{PA}} s < t \\ &\qquad \to (\sigma(N, i, t))^s = (N)^{i + s}, \end{aligned}$$
      $\vdash_{\mathsf{PA}} \mathrm{sm}(N, 0, \mathrm{lg}(N)) = N$,
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\mathrm{sm}\big(\mathrm{cc}(M, A, B), \mathrm{lg}(M), \\ &\qquad \mathrm{lg}(M) + \mathrm{lg}(A)\big) = A, \end{aligned}$$
      et enfin $\vdash_{\mathsf{PA}} A \leqslant \mathrm{cc}(M, A, B)$ et $\vdash_{\mathsf{PA}} \neg(M = 0) \to A < \mathrm{cc}(M, A, B)$.
    preuve: |
      On raisonne, comme aux nœuds du chapitre {{cal-syntaxe-pa|Suites codées dans PA}}, par chaînes d'égalités et d'inégalités entre termes fonctionnels, en écrivant avec les valeurs au sens de {{cal-sp-termes|Termes fonctionnels}} ; pour (ii) à (iv), il suffit de traiter des variables distinctes, par le point (ii) (b) de ce nœud. On emploie la transitivité mixte : si $a < b$ et $b \leqslant c$, alors $a < c$, puisque $a < b$ est $S\,a \leqslant b$, par le point (iii) de {{cal-pa-ordre|Ordre dans PA}}, et de même si $a \leqslant b$ et $b < c$, puisque $S\,a \leqslant S\,b$ par le point (vi) du même nœud.

      (i) Soit $t$ et $h$, $u$ des variables nouvelles, et $\theta$ la formule $\forall N\, \big(\mathrm{lg}(N) = t \to \varphi\big)$. Par le point (i) de {{cal-rp-calcul|Calcul à variables libres}}, l'hypothèse donne $\Gamma \vdash_{\mathsf{PA}} \varphi \to \varphi[\mathrm{aj}(N, v)/N]$ ; comme $N$ et $v$ ne sont libres dans aucune formule de $\Gamma$, le point (ii) (b) de {{cal-sp-termes|Termes fonctionnels}}, appliqué à $N$ et au terme $h$, puis à $v$ et au terme $u$, donne $\Gamma \vdash_{\mathsf{PA}} \varphi[h/N] \to \varphi[\mathrm{aj}(h, u)/N]$, puisque $v$ ne figure pas dans $\varphi$ et que les [[occurrence|occurrences]] libres de $N$ dans $\varphi[\mathrm{aj}(N, v)/N]$ sont exactement celles du terme $\mathrm{aj}(N, v)$.

      *Base.* Sous l'hypothèse $\mathrm{lg}(N) = 0$, le point (ii) de {{cal-sp-longueur|Longueur dans PA}} donne $N = 0$, et le remplacement ({{cal-sp-termes|Termes fonctionnels}}, (ii) (c)) tire $\varphi$ de $\varphi[0/N]$. Le théorème de la déduction et la généralisation en $N$, qui n'est libre dans aucune formule de $\Gamma$ ({{cal-pa-recurrence|Récurrence dans PA}}, (i)), donnent $\Gamma \vdash_{\mathsf{PA}} \theta[0/t]$.

      *Pas.* Raisonnons sous $\theta$, sous $\mathrm{lg}(N) = S\,t$ et sous les hypothèses $\mathrm{dbt}(N) = h$ et $\mathrm{dr}(N) = u$. Si $N$ était nul, on aurait $S\,t = \mathrm{lg}(0) = 0$, contrairement à $\mathrm Q_1$ ; le point (iii) de {{cal-sp-ajout|Ajout dans PA}} donne donc $N = \mathrm{aj}(h, u)$. Par le point (ii) de {{cal-sp-longueur|Longueur dans PA}}, $S\,t = \mathrm{lg}(\mathrm{aj}(h, u)) = S\,\mathrm{lg}(h)$, et $\mathrm Q_2$ donne $\mathrm{lg}(h) = t$. L'axiome (2), avec le terme $h$, qui est substituable puisqu'il est nouveau, donne $\varphi[h/N]$, puis la formule établie plus haut donne $\varphi[\mathrm{aj}(h, u)/N]$, et le remplacement, avec $N = \mathrm{aj}(h, u)$, donne $\varphi$. Le point (ii) (a) de {{cal-sp-termes|Termes fonctionnels}} élimine les deux dernières hypothèses, puisque $h$ et $u$ ne figurent ni dans $\Gamma$, ni dans $\theta$, ni dans $\varphi$ ; le théorème de la déduction et la généralisation en $N$, qui n'est libre ni dans $\theta$ ni dans $\Gamma$, donnent $\Gamma \cup \{\theta\} \vdash_{\mathsf{PA}} \theta[S\,t/t]$.

      La récurrence ({{cal-pa-recurrence|Récurrence dans PA}}, (iii)), permise puisque $t$ n'est libre dans aucune formule de $\Gamma$, donne $\Gamma \vdash_{\mathsf{PA}} \theta$. L'axiome (2), avec le terme $N$, donne $\mathrm{lg}(N) = t \to \varphi$, et le point (ii) (b) de {{cal-sp-termes|Termes fonctionnels}}, avec le terme fonctionnel $\mathrm{lg}(N)$ substitué à $t$, qui ne figure pas dans $\varphi$, donne $\mathrm{lg}(N) = \mathrm{lg}(N) \to \varphi$ ; le point (ii) (c) du même nœud conclut.

      (ii) Appliquons (i) à la formule $\mathrm{conc}(M, \mathrm{conc}(N, P)) = \mathrm{conc}(\mathrm{conc}(M, N), P)$, avec la variable $P$ et une variable nouvelle $v$. Pour $P = 0$, les deux membres valent $\mathrm{conc}(M, N)$, par le point (iv) de {{cal-sp-concatenation|Concaténation dans PA}}. Pour le pas, ce même point et l'hypothèse de récurrence donnent
      $$\begin{aligned} &\mathrm{conc}(M, \mathrm{conc}(N, \mathrm{aj}(P, v))) \\ &\quad = \mathrm{conc}(M, \mathrm{aj}(\mathrm{conc}(N, P), v)) \\ &\quad = \mathrm{aj}(\mathrm{conc}(M, \mathrm{conc}(N, P)), v) \\ &\quad = \mathrm{aj}(\mathrm{conc}(\mathrm{conc}(M, N), P), v) \\ &\quad = \mathrm{conc}(\mathrm{conc}(M, N), \mathrm{aj}(P, v)). \end{aligned}$$

      (iii) *Monotonie de l'ajout.* Sous l'hypothèse $h \leqslant h'$, l'élimination fournit $a$ tel que $a + h = h'$. Par le point (ii) de {{cal-sp-puissances|Puissances de 2 dans PA}}, $2^{h'} = 2^a \times 2^h$ et $2^a$ n'est pas nul ; le point (vi) de {{cal-pa-ordre|Ordre dans PA}} et la commutativité donnent $2^h \leqslant 2^{h'}$, puis $2^h \times \mathrm O(v) \leqslant 2^{h'} \times \mathrm O(v)$, c'est-à-dire $\mathrm{aj}(h, v) \leqslant \mathrm{aj}(h', v)$, par l'égalité $\mathrm{aj}(h, v) = 2^h \times \mathrm O(v)$ de {{cal-sp-ajout|Ajout dans PA}}. Sous l'hypothèse $h < h'$, c'est-à-dire $S\,h \leqslant h'$, ce qui précède donne $\mathrm{aj}(S\,h, v) \leqslant \mathrm{aj}(h', v)$, et le point (i) de {{cal-sp-puissances|Puissances de 2 dans PA}} et la distributivité donnent $\mathrm{aj}(S\,h, v) = c + c$, où $c = \mathrm{aj}(h, v)$. Comme $c$ n'est pas nul ({{cal-sp-ajout|Ajout dans PA}}, (iii)), $S\,0 \leqslant c$, et la compatibilité donne $S\,c = c + S\,0 \leqslant c + c$ ; la transitivité donne $S\,c \leqslant \mathrm{aj}(h', v)$, c'est-à-dire $\mathrm{aj}(h, v) < \mathrm{aj}(h', v)$.

      *Premier facteur.* Montrons $M \leqslant C(M, N, t)$ par récurrence sur $t$, avec les paramètres $M$ et $N$. Pour $0$, $C(M, N, 0) = M$. Pour le pas, $C(M, N, S\,t) = \mathrm{aj}(C(M, N, t), (N)^t)$, qui est strictement plus grand que $C(M, N, t)$ par le point (iii) de {{cal-sp-ajout|Ajout dans PA}} ; la transitivité mixte donne $M < C(M, N, S\,t)$, donc $M \leqslant C(M, N, S\,t)$ par le point (v) de {{cal-pa-ordre|Ordre dans PA}}. Le point (ii) (b) de {{cal-sp-termes|Termes fonctionnels}}, avec $\mathrm{lg}(N)$ substitué à $t$, donne $M \leqslant \mathrm{conc}(M, N)$. Si $N$ n'est pas nul, $\mathrm{lg}(N)$ ne l'est pas ({{cal-sp-longueur|Longueur dans PA}}, (ii)), et l'instance de $\mathrm Q_3$ l'écrit $S\,t'$ ; alors $\mathrm{conc}(M, N) = C(M, N, S\,t')$ est strictement plus grand que $C(M, N, t')$, qui est au moins $M$, d'où $M < \mathrm{conc}(M, N)$.

      *Second facteur.* Appliquons (i) à la formule $N \leqslant \mathrm{conc}(M, N)$, avec la variable $N$ et une variable nouvelle $v$. Pour $N = 0$, c'est $0 \leqslant \mathrm{conc}(M, 0)$ ({{cal-pa-ordre|Ordre dans PA}}, (i)). Pour le pas, sous l'hypothèse $N \leqslant \mathrm{conc}(M, N)$, la monotonie et le point (iv) de {{cal-sp-concatenation|Concaténation dans PA}} donnent $\mathrm{aj}(N, v) \leqslant \mathrm{aj}(\mathrm{conc}(M, N), v) = \mathrm{conc}(M, \mathrm{aj}(N, v))$. Pour l'inégalité stricte, on applique (i) à la formule $N < \mathrm{conc}(M, N)$, sous l'hypothèse $\neg(M = 0)$, dans laquelle ni $N$ ni $v$ ne figurent : pour $N = 0$, $0 < M = \mathrm{conc}(M, 0)$, par le point (v) de {{cal-pa-ordre|Ordre dans PA}} ; le pas est le même, avec la monotonie stricte. Le théorème de la déduction conclut.

      (iv) *Longueur et termes de $\sigma$.* Récurrence sur $t$, avec les paramètres $N$ et $i$ : $\mathrm{lg}(\sigma(N, i, 0)) = \mathrm{lg}(0) = 0$, et $\mathrm{lg}(\sigma(N, i, S\,t)) = S\,\mathrm{lg}(\sigma(N, i, t)) = S\,t$, par le point (ii) de {{cal-sp-longueur|Longueur dans PA}}. Pour les termes, montrons $\forall s\, \big(s < t \to (\sigma(N, i, t))^s = (N)^{i + s}\big)$ par récurrence sur $t$. Pour $0$, $s < 0$ est exclu. Pour le pas, sous $s < S\,t$, c'est-à-dire $s \leqslant t$, on a $s < t$ ou $s = t$ ({{cal-pa-ordre|Ordre dans PA}}, (v)). Comme $\mathrm{lg}(\sigma(N, i, t)) = t$, le point (iii) de {{cal-sp-longueur|Longueur dans PA}} donne, si $s = t$, $(\sigma(N, i, S\,t))^t = (N)^{i + t}$, et, si $s < t$, $(\sigma(N, i, S\,t))^s = (\sigma(N, i, t))^s$, qui vaut $(N)^{i + s}$ par l'hypothèse de récurrence. On généralise en $s$, qui n'est libre dans aucune hypothèse.

      *Le mot entier.* Par le point (iii) de {{cal-bp-usuelles|Fonctions usuelles dans PA}}, avec $0 \leqslant \mathrm{lg}(N)$ et $\mathrm{lg}(N) + 0 = \mathrm{lg}(N)$, on a $\mathrm{lg}(N) \mathbin{\dot{-}} 0 = \mathrm{lg}(N)$, donc $\mathrm{sm}(N, 0, \mathrm{lg}(N)) = \sigma(N, 0, \mathrm{lg}(N))$. Sa longueur est $\mathrm{lg}(N)$, et, pour $s < \mathrm{lg}(N)$, son terme de rang $s$ est $(N)^{0 + s} = (N)^s$, par le point (i) de {{cal-pa-lois|Lois de + et ×}}. L'extensionnalité ({{cal-sp-longueur|Longueur dans PA}}, (iv)), avec le point (i) (a) de {{cal-bp-modules|Modules de Gödel}} pour la clause $\forall j$, conclut.

      *Un facteur.* Soit $P = \mathrm{cc}(M, A, B)$, et écrivons avec les valeurs $m$ et $a$ de $\mathrm{lg}(M)$ et de $\mathrm{lg}(A)$. Le même point (iii), avec $m \leqslant m + a$ et $a + m = m + a$, donne $(m + a) \mathbin{\dot{-}} m = a$, donc $\mathrm{sm}(P, m, m + a) = \sigma(P, m, a)$, de longueur $a$. Pour $s < a$, son terme de rang $s$ est $(P)^{m + s}$ ; or $m + s < m + a$, par la compatibilité ({{cal-pa-ordre|Ordre dans PA}}, (vi)), et $m + a = \mathrm{lg}(\mathrm{conc}(M, A))$ par le point (ii) de {{cal-sp-concatenation|Concaténation dans PA}}, qui donne alors $(P)^{m + s} = (\mathrm{conc}(M, A))^{m + s} = (A)^s$. L'extensionnalité donne $\mathrm{sm}(P, m, m + a) = A$. Enfin, par (iii), $A \leqslant \mathrm{conc}(M, A) \leqslant \mathrm{cc}(M, A, B)$, et la première inégalité est stricte si $M$ n'est pas nul.
    remarques:
      - |
        La récurrence sur la longueur est la forme interne à $\mathsf{PA}$ de la récurrence sur les mots qui ajoute une lettre à la fin. Elle n'est qu'une récurrence ordinaire sur la variable $t$, appliquée à la formule « tout code de longueur $t$ vérifie $\varphi$ ». L'erreur la plus répandue serait de raisonner par récurrence ordinaire sur le code $N$ lui-même : le successeur d'un code n'est pas, en général, le code d'un mot obtenu en ajoutant une lettre. Ainsi $\langle 0, 0 \rangle = 2$ suit $\langle 0 \rangle = 1$, mais $\langle 1 \rangle = 3$ suit $\langle 0, 0 \rangle$ sans le prolonger. Une récurrence forte sur $N$, appuyée sur $\mathrm{dbt}(N) < N$, conviendrait aussi, mais elle obligerait à porter dans chaque preuve l'hypothèse $\forall y \leqslant N$, alors que le point (i) ne demande que deux vérifications, en $0$ et pour $\mathrm{aj}(N, v)$.
      - |
        Le point (iii) est la forme interne de l'inégalité des facteurs du {{cal-sx-codage|codage des mots}}, (ii), que demandait la première remarque du nœud {{cal-sp-valeurs|Récurrence de valeurs dans PA}} : un facteur propre a un code plus petit, et c'est ce qui permet de lire, dans l'historique d'une récurrence de valeurs, la valeur déjà calculée en un facteur. Par exemple $\ulcorner S\, 0 \urcorner = \mathrm{conc}(\langle 5 \rangle, \langle 4 \rangle) = 18\,432$, et le facteur $\mathrm{sm}(18\,432, 1, 2) = 9 = \ulcorner 0 \urcorner$ est bien plus petit. L'hypothèse $\neg(M = 0)$ des inégalités strictes ne peut pas être omise, puisque $\mathrm{conc}(0, N) = N$ ; ces faits, l'associativité et la lecture des facteurs ont été vérifiés par un calcul, avec les constructions littérales, pour tous les codes de suites assez courtes.

  - id: cal-ip-formation
    etiquette: Formation dans PA
    nature: proposition
    titre: Règles de formation des termes et des formules, et chiffres, dans l'arithmétique de Peano
    texte: |
      Les conventions sont celles de {{cal-ip-facteurs|Facteurs dans PA}}. Les relations $\mathrm{Tm}$, $\mathrm{At}$ et $\mathrm{Fm}$ sont prises avec les constructions qu'écrivent les preuves de {{cal-sx-termes|Termes}} et de {{cal-sx-formules|Formules}}, conformément à la convention de {{cal-bp-relations|Relations p.r. dans PA}} : $\mathrm{Tm}$ et $\mathrm{Fm}$ sont les relations $R$ que fournit la {{cal-sx-valeurs|récurrence de valeurs}}, sans paramètre, pour les relations $Q$ écrites dans ces preuves, et l'on note $F_{\mathrm{Tm}}$ et $F_{\mathrm{Fm}}$ les historiques correspondants, au sens de {{cal-sp-valeurs|Récurrence de valeurs dans PA}}. Pour un mot fixé $a_{c_0} \cdots a_{c_{p-1}}$, on note $\underline{\langle c_0, \dots, c_{p-1} \rangle}$ le chiffre de son code ; ainsi $\langle 5 \rangle = 11$, $\langle 6 \rangle = 13$, $\langle 7 \rangle = 15$, $\langle 0 \rangle = 1$, $\langle 1 \rangle = 3$, $\langle 2 \rangle = 5$ et $\langle 3, c \rangle = 2^7 (2c + 1)$.

      Le code du chiffre $\underline n$ ({{cal-tarski|Vérité et incomplétude}}) est noté $\mathrm{num}(n)$. Comme dans la preuve du point (i) de ce nœud, $\mathrm{num}(0) = \langle 4 \rangle = 9$ et $\mathrm{num}(n + 1) = \mathrm{conc}(\langle 5 \rangle, \mathrm{num}(n))$ ; on prend la construction par récurrence primitive sans paramètre, à partir de l'entier $9$ et de la fonction $\mathrm{conc} \circ (\mathbf c_{11} \circ P^2_1, P^2_2)$, où $\mathbf c_{11}$ est la composée de onze [[successeur-ensemble|successeurs]] et de $Z$. Par récurrence sur $n$, $\mathrm{num}(n) = \ulcorner \underline n \urcorner$, puisque le mot $\underline{n + 1}$ est la lettre $S$ suivie du mot $\underline n$.
    enonce: |
      Pour toutes variables $A$, $B$ et $x$, et tout entier $c \geqslant 8$ :

      (i) **Termes.** On a $\vdash_{\mathsf{PA}} \widehat{\mathrm{Tm}}(A) \to \widehat{\mathrm{Tm}}(\mathrm{conc}(\underline{\langle 5 \rangle}, A))$ et, pour $e \in \{6, 7\}$,
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\big(\widehat{\mathrm{Tm}}(A) \wedge \widehat{\mathrm{Tm}}(B)\big) \\ &\to \widehat{\mathrm{Tm}}(\mathrm{cc}(\underline{\langle e \rangle}, A, B)). \end{aligned}$$

      (ii) **Formules.** On a
      $$\begin{aligned} &\vdash_{\mathsf{PA}} \big(\widehat{\mathrm{Tm}}(A) \wedge \widehat{\mathrm{Tm}}(B)\big) \\ &\qquad \to \widehat{\mathrm{Fm}}(\mathrm{cc}(\underline{\langle 0 \rangle}, A, B)), \\ &\vdash_{\mathsf{PA}} \widehat{\mathrm{Fm}}(A) \to \widehat{\mathrm{Fm}}(\mathrm{conc}(\underline{\langle 1 \rangle}, A)), \\ &\vdash_{\mathsf{PA}} \big(\widehat{\mathrm{Fm}}(A) \wedge \widehat{\mathrm{Fm}}(B)\big) \\ &\qquad \to \widehat{\mathrm{Fm}}(\mathrm{cc}(\underline{\langle 2 \rangle}, A, B)), \\ &\vdash_{\mathsf{PA}} \widehat{\mathrm{Fm}}(A) \to \widehat{\mathrm{Fm}}(\mathrm{conc}(\underline{\langle 3, c \rangle}, A)). \end{aligned}$$

      (iii) **Chiffres.** On a $\vdash_{\mathsf{PA}} \mathrm{num}(0) = \underline 9$, $\vdash_{\mathsf{PA}} \mathrm{num}(S\,x) = \mathrm{conc}(\underline{\langle 5 \rangle}, \mathrm{num}(x))$, $\vdash_{\mathsf{PA}} \mathrm{lg}(\mathrm{num}(x)) = S\,x$, $\vdash_{\mathsf{PA}} \widehat{\mathrm{Tm}}(\mathrm{num}(x))$, et, pour une variable $m$ distincte de $x$,
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&m < S\,x \to \big((\mathrm{num}(x))^m = \underline 4 \\ &\qquad \vee (\mathrm{num}(x))^m = \underline 5\big). \end{aligned}$$
      Pour tout entier $n$, $\vdash_{\mathsf{PA}} \mathrm{num}(\underline n) = \underline{\ulcorner \underline n \urcorner}$.
    preuve: |
      *Lecture des relations.* Par le point (iv) de {{cal-sp-valeurs|Récurrence de valeurs dans PA}}, $\vdash_{\mathsf{PA}} \widehat{\mathrm{Tm}}(N) \leftrightarrow \hat Q(N, F_{\mathrm{Tm}}(N))$, où $Q$ est la disjonction des trois cas de la preuve de {{cal-sx-termes|Termes}}. Sa formule naturelle se lit clause par clause, comme au point (ii) de {{cal-sp-derivabilite|Deuxième condition (D2)}} : la disjonction et la conjonction par le point (iii) de {{cal-bp-relations|Relations p.r. dans PA}}, la quantification bornée par le point (iv), les relations de base par le point (ii), et les substitutions de fonctions par le point (ii) (d) de {{cal-sp-termes|Termes fonctionnels}}, les constantes devenant des chiffres par le point (i) de {{cal-bp-usuelles|Fonctions usuelles dans PA}}. Il en résulte que $\widehat{\mathrm{Tm}}(N)$ découle de chacune des deux formules
      $$\begin{aligned} &(N)^0 = \underline 5 \wedge S\,S\,0 \leqslant \mathrm{lg}(N) \\ &\quad \wedge (F_{\mathrm{Tm}}(N))^{\mathrm{sm}(N, S\,0, \mathrm{lg}(N))} = S\,0, \\[4pt] &(N)^0 = \underline e \wedge \exists j < \mathrm{lg}(N)\ \big(S\,S\,0 \leqslant j \\ &\quad \wedge (F_{\mathrm{Tm}}(N))^{\mathrm{sm}(N, S\,0, j)} = S\,0 \\ &\quad \wedge (F_{\mathrm{Tm}}(N))^{\mathrm{sm}(N, j, \mathrm{lg}(N))} = S\,0\big), \end{aligned}$$
      avec $e = 6$ ou $e = 7$. De même, $\widehat{\mathrm{At}}(N)$ découle de $(N)^0 = 0 \wedge \exists j < \mathrm{lg}(N)\ \big(S\,S\,0 \leqslant j \wedge \widehat{\mathrm{Tm}}(\mathrm{sm}(N, S\,0, j)) \wedge \widehat{\mathrm{Tm}}(\mathrm{sm}(N, j, \mathrm{lg}(N)))\big)$, et $\widehat{\mathrm{Fm}}(N)$ découle de $\widehat{\mathrm{At}}(N)$, et des trois formules écrites comme ci-dessus avec $F_{\mathrm{Fm}}$ pour les cas $\neg$, $\to$ et $\forall$ de la preuve de {{cal-sx-formules|Formules}} ; le dernier s'écrit $(N)^0 = \underline 3 \wedge S\,S\,S\,0 \leqslant \mathrm{lg}(N) \wedge \underline 8 \leqslant (N)^{S\,0} \wedge (F_{\mathrm{Fm}}(N))^{\mathrm{sm}(N, S\,S\,0, \mathrm{lg}(N))} = S\,0$.

      Les fonctions caractéristiques de ces relations $Q$ sont des disjonctions, donc booléennes dans $\mathsf{PA}$ ({{cal-bp-relations|Relations p.r. dans PA}}, (iii)), et le point (iv) de {{cal-sp-valeurs|Récurrence de valeurs dans PA}} rend booléennes $\chi_{\mathrm{Tm}}$ et $\chi_{\mathrm{Fm}}$. Par les points (ii) et (iv) du même nœud, sous l'hypothèse $A < N$, on a $(F_{\mathrm{Tm}}(N))^A = \chi_{\mathrm{Tm}}(A)$, valeur égale à $0$ ou à $S\,0$, et $\neg\big((F_{\mathrm{Tm}}(N))^A = 0\big) \leftrightarrow \widehat{\mathrm{Tm}}(A)$ ; d'où
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&A < N \to \big(\widehat{\mathrm{Tm}}(A) \\ &\qquad \leftrightarrow (F_{\mathrm{Tm}}(N))^A = S\,0\big), \end{aligned}$$
      et de même pour $\mathrm{Fm}$. Enfin, $0$ ne code ni un terme ni une formule, et le point (iv) de {{cal-sp-termes|Termes fonctionnels}} donne $\vdash_{\mathsf{PA}} \neg\widehat{\mathrm{Tm}}(0)$ et $\vdash_{\mathsf{PA}} \neg\widehat{\mathrm{Fm}}(0)$ ; par le remplacement, $\widehat{\mathrm{Tm}}(A)$ et $\widehat{\mathrm{Fm}}(A)$ entraînent $\neg(A = 0)$, puis $\neg(\mathrm{lg}(A) = 0)$ et $S\,0 \leqslant \mathrm{lg}(A)$, par le point (ii) de {{cal-sp-longueur|Longueur dans PA}} et le point (v) de {{cal-pa-ordre|Ordre dans PA}}.

      *Préfixes fixés.* Soit $P = \langle c_0, \dots, c_{p-1} \rangle$ le code d'un mot fixé de longueur $p \geqslant 1$. Par le point (iv) de {{cal-sp-termes|Termes fonctionnels}}, $\vdash_{\mathsf{PA}} \mathrm{lg}(\underline P) = \underline p$ et $\vdash_{\mathsf{PA}} (\underline P)^{\underline r} = \underline{c_r}$ pour $r < p$. Soit $N = \mathrm{cc}(\underline P, A, B)$. Par les points (ii) de {{cal-sp-concatenation|Concaténation dans PA}} et (iv) de {{cal-ip-facteurs|Facteurs dans PA}}, avec $\vdash_{\mathsf{PA}} \underline r < \underline p$, on a $\mathrm{lg}(N) = \underline p + \mathrm{lg}(A) + \mathrm{lg}(B)$, $(N)^{\underline r} = \underline{c_r}$ pour $r < p$, $\mathrm{sm}(N, \underline p, \underline p + \mathrm{lg}(A)) = A$, et $\mathrm{sm}(N, \underline p + \mathrm{lg}(A), \mathrm{lg}(N)) = B$, ce dernier en appliquant le même point (iv) à $\mathrm{cc}(\mathrm{conc}(\underline P, A), B, 0)$, qui est $N$ par le point (iv) de {{cal-sp-concatenation|Concaténation dans PA}}. Comme $\underline P$ n'est pas nul, le point (iv) de {{cal-ip-facteurs|Facteurs dans PA}} donne $A < N$, et le point (iii) du même nœud donne $B < N$, puisque $\mathrm{conc}(\underline P, A)$, qui est au moins $\underline P$, n'est pas nul. Pour $B = 0$, $N = \mathrm{conc}(\underline P, A)$, et ces égalités donnent $\mathrm{sm}(N, \underline p, \mathrm{lg}(N)) = A$.

      (i) Sous l'hypothèse $\widehat{\mathrm{Tm}}(A)$, soit $N = \mathrm{conc}(\underline{\langle 5 \rangle}, A)$ ; ici $p = 1$. On a $(N)^0 = \underline 5$, et $\mathrm{lg}(N) = S\,0 + \mathrm{lg}(A) \geqslant S\,0 + S\,0 = S\,S\,0$, par la compatibilité. Comme $A < N$, la lecture donne $(F_{\mathrm{Tm}}(N))^A = S\,0$, et le remplacement, avec $\mathrm{sm}(N, S\,0, \mathrm{lg}(N)) = A$, donne la première formule de la lecture : $\widehat{\mathrm{Tm}}(N)$. Sous les hypothèses $\widehat{\mathrm{Tm}}(A)$ et $\widehat{\mathrm{Tm}}(B)$, soit $N = \mathrm{cc}(\underline{\langle e \rangle}, A, B)$ et $j = S\,0 + \mathrm{lg}(A)$. Alors $S\,S\,0 \leqslant j$, et $j < \mathrm{lg}(N) = j + \mathrm{lg}(B)$ puisque $S\,0 \leqslant \mathrm{lg}(B)$ ; les [[facteur-mot|facteurs]] $\mathrm{sm}(N, S\,0, j) = A$ et $\mathrm{sm}(N, j, \mathrm{lg}(N)) = B$ sont plus petits que $N$, et la lecture donne $(F_{\mathrm{Tm}}(N))^A = S\,0$ et $(F_{\mathrm{Tm}}(N))^B = S\,0$. L'introduction de la quantification bornée stricte, avec le terme $j$ ({{cal-bp-modules|Modules de Gödel}}, (i) (b), appliqué à la négation, et contraposition), donne la seconde formule de la lecture.

      (ii) Le cas atomique est celui de la seconde formule de (i), avec $\widehat{\mathrm{Tm}}(A)$ et $\widehat{\mathrm{Tm}}(B)$ en place des valeurs de l'historique : il n'y a pas d'historique pour $\mathrm{At}$, et $\widehat{\mathrm{At}}(N)$ donne $\widehat{\mathrm{Fm}}(N)$. Les cas $\neg$ et $\to$ sont ceux de (i), avec $\mathrm{Fm}$, les lettres $1$ et $2$, et l'historique $F_{\mathrm{Fm}}$. Pour $N = \mathrm{conc}(\underline{\langle 3, c \rangle}, A)$, ici $p = 2$ : on a $(N)^0 = \underline 3$, $(N)^{S\,0} = \underline c$, qui est au moins $\underline 8$ par le point (iv) de {{cal-sp-termes|Termes fonctionnels}}, $\mathrm{lg}(N) = S\,S\,0 + \mathrm{lg}(A) \geqslant S\,S\,S\,0$, et $\mathrm{sm}(N, S\,S\,0, \mathrm{lg}(N)) = A < N$, d'où la troisième formule de la lecture pour $\mathrm{Fm}$.

      (iii) Par le point (iv) de {{cal-bp-fonctions|Fonctions p.r. dans PA}}, sans paramètre, $\mathrm{num}(0) = w$ équivaut à $w = \underline 9$, et, sous l'hypothèse $\mathrm{num}(x) = u$, $\mathrm{num}(S\,x) = w$ équivaut à $\mathrm{conc}(\mathbf c_{11}(x), u) = w$, par le point (ii) (d) de {{cal-sp-termes|Termes fonctionnels}}, c'est-à-dire à $\mathrm{conc}(\underline{11}, u) = w$, par le point (i) de {{cal-bp-usuelles|Fonctions usuelles dans PA}} ; écrites avec la valeur $u$, ce sont les deux équations, puisque $\langle 5 \rangle = 11$.

      *Longueur.* Récurrence sur $x$ : $\mathrm{lg}(\underline 9) = S\,0$ par un calcul clos, et $\mathrm{lg}(\mathrm{num}(S\,x)) = S\,0 + \mathrm{lg}(\mathrm{num}(x)) = S\,0 + S\,x = S\,S\,x$, par le point (ii) de {{cal-sp-concatenation|Concaténation dans PA}} et le point (i) de {{cal-pa-lois|Lois de + et ×}}.

      *Lettres.* Montrons $\forall m\, \big(m < S\,x \to ((\mathrm{num}(x))^m = \underline 4 \vee (\mathrm{num}(x))^m = \underline 5)\big)$ par récurrence sur $x$. Pour $0$, $m < S\,0$ donne $m = 0$ ({{cal-pa-ordre|Ordre dans PA}}, (ii) et (v)), et $(\underline 9)^0 = \underline 4$ par un calcul clos. Pour le pas, sous $m < S\,S\,x$, distinguons $m = 0$ et $m = S\,m'$, par l'instance de $\mathrm Q_3$. Si $m = 0$, le point (ii) de {{cal-sp-concatenation|Concaténation dans PA}}, avec $0 < \mathrm{lg}(\underline{11}) = S\,0$, donne $(\mathrm{num}(S\,x))^0 = (\underline{11})^0 = \underline 5$. Si $m = S\,m'$, alors $m' < S\,x = \mathrm{lg}(\mathrm{num}(x))$, et le même point donne $(\mathrm{num}(S\,x))^{S\,0 + m'} = (\mathrm{num}(x))^{m'}$, avec $S\,0 + m' = S\,m'$ ; l'hypothèse de récurrence, instanciée par $m'$, conclut. On généralise en $m$, puis on instancie.

      *Terme.* Récurrence sur $x$ : $\widehat{\mathrm{Tm}}(\underline 9)$ est un calcul clos, et le pas est (i). Enfin, $\mathrm{num}(n) = \ulcorner \underline n \urcorner$ dans $\mathcal N$, et le point (iv) de {{cal-sp-termes|Termes fonctionnels}} donne la dernière égalité.
    remarques:
      - |
        Les règles de formation ne vont que dans un sens : $\mathsf{PA}$ démontre que $S$ suivi d'un terme est un terme, mais ce nœud ne dit pas que, si $\mathrm{conc}(\langle 5 \rangle, A)$ code un terme, $A$ en code un. L'erreur la plus répandue serait de croire que cette réciproque se lit aussi simplement : elle demande d'exclure les autres cas de la relation $Q$, ce qui est facile ici, et, pour $+$ et $\times$, de savoir que le découpage en deux termes est unique, ce qui est la {{l-lecture|lecture unique}} démontrée à l'intérieur de $\mathsf{PA}$. La reconnaissance, comme le notait la seconde remarque du nœud {{cal-sx-termes|Termes}}, n'en a pas besoin.
      - |
        Le chiffre $\underline 2 = S\, S\, 0$ a pour code $\mathrm{num}(2) = 2^{22\,528} \cdot 9$, puisque $\langle 5, 5 \rangle = 2^{11} \cdot 11 = 22\,528$ ; cet entier a $6\,783$ chiffres décimaux, et celui de $\underline 3$ est une tour d'exponentielles. Le point (iii) ne calcule aucun de ces codes : il dit, pour une variable $x$, que $\mathrm{num}(x)$ code un terme de longueur $x + 1$ formé des seules lettres $S$ et $0$. C'est la forme interne à $\mathsf{PA}$ de la fonction $n \mapsto \ulcorner \underline n \urcorner$ du nœud {{cal-tarski|Vérité et incomplétude}}, qu'emploie aussi le lemme diagonal du chapitre voisin {{cal-dg-diagonal|Lemme diagonal}}.

  - id: cal-ip-substitution
    etiquette: Substitution dépliée
    nature: proposition
    titre: Substitution d'un terme dans un mot fixé, dépliée dans l'arithmétique de Peano
    texte: |
      Les conventions sont celles de {{cal-ip-facteurs|Facteurs dans PA}}. Les relations $\mathrm{Oc}$, $\mathrm{Li}$, $\mathrm{Lib}$ et la fonction $\mathrm{Sb}$ sont prises avec les constructions qu'écrivent les preuves de {{cal-sx-libres|Variables libres}} et de {{cal-sx-substitution|Substitution}}. La fonction $W$ est définie par récurrence primitive sur $j$, avec les paramètres $N$, $T$, $k$, à partir de la fonction nulle $Z \circ P^3_1$ et de la fonction $g$ obtenue par la définition par cas de {{cal-pr-cloture|Clôture}}, (ii), à partir de $g_1(N, T, k, j, u) = \mathrm{conc}(u, T)$ et de $g_2(N, T, k, j, u) = \mathrm{aj}(u, (N)^j)$, pour la relation $R_1(N, T, k, j, u)$, qui est la relation $C(N, j, k) \iff \mathrm{Lib}(N, j) \wedge (N)^j = k$ où l'on a substitué des [[projection-produit|projections]], et pour sa négation $R_2$ ; puis $\mathrm{Sb}(N, T, k) = W(N, T, k, \mathrm{lg}(N))$. Les fonctions caractéristiques de $\mathrm{Oc}$, de $\mathrm{Lib}$, de $C$, de $R_1$ et de $R_2$ sont booléennes dans $\mathsf{PA}$, par les points (ii) et (iii) de {{cal-bp-relations|Relations p.r. dans PA}} : $\mathrm{Oc}$ est la conjonction de relations de base où l'on a substitué des fonctions et d'une disjonction, $\mathrm{Lib}$ la conjonction de $\mathrm{Oc}$ et d'une négation, $C$ la conjonction de $\mathrm{Lib}$ et d'une égalité, et $R_2$ une négation.

      Un *gabarit* est une suite finie $G = (g_0, \dots, g_{m-1})$ dont chaque terme est un entier ou le signe $\diamond$, qui marque une place à remplir. Pour un terme fonctionnel $\tau$, on définit le terme fonctionnel $\llbracket G \rrbracket(\tau)$ par récurrence sur $m$ : la suite vide donne $0$ ; si $G'$ est $G$ suivi de l'entier $c$, alors $\llbracket G' \rrbracket(\tau) = \mathrm{aj}\big(\llbracket G \rrbracket(\tau), \underline c\big)$ ; si $G'$ est $G$ suivi du signe $\diamond$, alors $\llbracket G' \rrbracket(\tau) = \mathrm{conc}\big(\llbracket G \rrbracket(\tau), \tau\big)$. Si $\diamond$ ne figure pas dans $G$, $\llbracket G \rrbracket$ est un terme fonctionnel clos, de valeur $\langle g_0, \dots, g_{m-1} \rangle$, et $\vdash_{\mathsf{PA}} \llbracket G \rrbracket = \underline{\langle g_0, \dots, g_{m-1} \rangle}$ par le point (iv) de {{cal-sp-termes|Termes fonctionnels}}. On note $GH$ la suite $G$ suivie de la suite $H$.

      Pour un mot $w = a_{c_0} \cdots a_{c_{m-1}}$, de [[code-mot|code]] $n$, et une variable $a_k$, le gabarit $G_k(w)$ a pour terme de rang $j$ le signe $\diamond$ si $\mathrm{Lib}(n, j)$ et $c_j = k$, et l'entier $c_j$ sinon : on marque les [[occurrence|occurrences]] libres de $a_k$. Si $w$ est une formule, ce sont les occurrences libres de {{l-formules|Formules, variables libres}}, par le texte de {{cal-sx-libres|Variables libres}} ; si $w$ est un terme, ce sont tous les rangs où figure la lettre $a_k$, puisqu'un terme ne contient pas la lettre $\forall$, de sorte qu'aucun rang n'est lié et que la lettre qui précède une variable n'est jamais $\forall$.
    enonce: |
      Soit $\tau$ un terme fonctionnel, $x = a_k$ une variable et $z = a_c$ une variable distincte de $x$.

      (i) **Gabarits.** Pour tous gabarits $G$ et $H$, $\vdash_{\mathsf{PA}} \llbracket GH \rrbracket(\tau) = \mathrm{conc}\big(\llbracket G \rrbracket(\tau), \llbracket H \rrbracket(\tau)\big)$. Si $\diamond$ figure dans $G$, alors $\vdash_{\mathsf{PA}} \tau \leqslant \llbracket G \rrbracket(\tau)$.

      (ii) **Dépliement.** Pour tout mot $w$,
      $$\vdash_{\mathsf{PA}} \mathrm{Sb}(\underline{\ulcorner w \urcorner}, \tau, \underline k) = \llbracket G_k(w) \rrbracket(\tau).$$
      En particulier, si $x$ n'a pas d'occurrence libre dans $w$, alors $\vdash_{\mathsf{PA}} \mathrm{Sb}(\underline{\ulcorner w \urcorner}, \tau, \underline k) = \underline{\ulcorner w \urcorner}$.

      (iii) **Composition.** Notons $\mathrm{Sb}\ulcorner w \urcorner$ le terme $\mathrm{Sb}(\underline{\ulcorner w \urcorner}, \tau, \underline k)$. Pour toutes formules $\varphi$ et $\psi$ et tous termes $t$ et $u$, $\mathsf{PA}$ démontre
      $$\begin{aligned} &\mathrm{Sb}\ulcorner \neg\varphi \urcorner = \mathrm{conc}\big(\underline{\langle 1 \rangle}, \mathrm{Sb}\ulcorner \varphi \urcorner\big), \\ &\mathrm{Sb}\ulcorner {\to}\, \varphi\, \psi \urcorner \\ &\quad = \mathrm{cc}\big(\underline{\langle 2 \rangle}, \mathrm{Sb}\ulcorner \varphi \urcorner, \mathrm{Sb}\ulcorner \psi \urcorner\big), \\ &\mathrm{Sb}\ulcorner \forall z\, \varphi \urcorner = \mathrm{conc}\big(\underline{\langle 3, c \rangle}, \mathrm{Sb}\ulcorner \varphi \urcorner\big), \\ &\mathrm{Sb}\ulcorner \forall x\, \varphi \urcorner = \underline{\ulcorner \forall x\, \varphi \urcorner}, \\ &\mathrm{Sb}\ulcorner {=}\, t\, u \urcorner \\ &\quad = \mathrm{cc}\big(\underline{\langle 0 \rangle}, \mathrm{Sb}\ulcorner t \urcorner, \mathrm{Sb}\ulcorner u \urcorner\big), \end{aligned}$$
      $\mathrm{Sb}\ulcorner x \urcorner = \tau$, $\mathrm{Sb}\ulcorner r \urcorner = \underline{\ulcorner r \urcorner}$ si $r$ est $0$ ou une variable distincte de $x$, $\mathrm{Sb}\ulcorner S\, t \urcorner = \mathrm{conc}(\underline{\langle 5 \rangle}, \mathrm{Sb}\ulcorner t \urcorner)$, et $\mathrm{Sb}\ulcorner {+}\, t\, u \urcorner = \mathrm{cc}(\underline{\langle 6 \rangle}, \mathrm{Sb}\ulcorner t \urcorner, \mathrm{Sb}\ulcorner u \urcorner)$, de même pour $\times$ avec $\underline{\langle 7 \rangle}$.
    preuve: |
      (i) Par récurrence sur la longueur de $H$, en [[metatheorie|métathéorie]]. Si $H$ est vide, $\llbracket G \rrbracket(\tau) = \mathrm{conc}(\llbracket G \rrbracket(\tau), 0)$ par le point (iv) de {{cal-sp-concatenation|Concaténation dans PA}}. Si $H$ est $H'$ suivi de l'entier $c$, le même point et l'hypothèse de récurrence donnent
      $$\begin{aligned} &\llbracket GH \rrbracket(\tau) \\ &\ = \mathrm{aj}\big(\mathrm{conc}(\llbracket G \rrbracket(\tau), \llbracket H' \rrbracket(\tau)), \underline c\big) \\ &\ = \mathrm{conc}\big(\llbracket G \rrbracket(\tau), \mathrm{aj}(\llbracket H' \rrbracket(\tau), \underline c)\big). \end{aligned}$$
      Si $H$ est $H'$ suivi de $\diamond$, l'associativité ({{cal-ip-facteurs|Facteurs dans PA}}, (ii)) donne de même $\mathrm{conc}(\mathrm{conc}(\llbracket G \rrbracket(\tau), \llbracket H' \rrbracket(\tau)), \tau) = \mathrm{conc}(\llbracket G \rrbracket(\tau), \mathrm{conc}(\llbracket H' \rrbracket(\tau), \tau))$. Si $\diamond$ figure dans $G$, écrivons $G = G_1 \diamond G_2$ ; ce qui précède donne $\llbracket G \rrbracket(\tau) = \mathrm{cc}(\llbracket G_1 \rrbracket(\tau), \tau, \llbracket G_2 \rrbracket(\tau))$, qui est au moins $\tau$ par le point (iv) de {{cal-ip-facteurs|Facteurs dans PA}}.

      (ii) Soit $n = \ulcorner w \urcorner$ et $m$ la longueur de $w$, de sorte que $\vdash_{\mathsf{PA}} \mathrm{lg}(\underline n) = \underline m$ et $\vdash_{\mathsf{PA}} (\underline n)^{\underline j} = \underline{c_j}$ pour $j < m$, par le point (iv) de {{cal-sp-termes|Termes fonctionnels}}. Pour $j \leqslant m$, notons $G_{<j}$ la suite des $j$ premiers termes de $G_k(w)$, et montrons, par récurrence sur $j$ en métathéorie, que $\vdash_{\mathsf{PA}} W(\underline n, T, \underline k, \underline j) = \llbracket G_{<j} \rrbracket(T)$ pour une variable $T$.

      Par le point (iv) de {{cal-bp-fonctions|Fonctions p.r. dans PA}}, comme au nœud {{cal-sp-valeurs|Récurrence de valeurs dans PA}}, $W(N, T, k, 0) = w'$ équivaut à $w' = 0$, et, sous l'hypothèse $W(N, T, k, j) = u$, $W(N, T, k, S\,j) = w'$ équivaut à $g(N, T, k, j, u) = w'$. Pour $j = 0$, $\llbracket G_{<0} \rrbracket(T) = 0$. Pour $j < m$, la relation $C(n, j, k)$ est vraie ou fausse dans $\mathcal N$, et le point (iv) de {{cal-sp-termes|Termes fonctionnels}} donne $\vdash_{\mathsf{PA}} \hat C(\underline n, \underline j, \underline k)$ ou $\vdash_{\mathsf{PA}} \neg\hat C(\underline n, \underline j, \underline k)$. Par le point (ii) (d) du même nœud, $\hat R_1(\underline n, T, \underline k, \underline j, u)$ équivaut à $\hat C(\underline n, \underline j, \underline k)$, et $\hat R_2$ à sa négation, par le point (iii) de {{cal-bp-relations|Relations p.r. dans PA}}. Dans le premier cas, le point (v) du même nœud, permis par la booléennité, donne $g(\underline n, T, \underline k, \underline j, u) = \mathrm{conc}(u, T)$ ; écrit avec la valeur $u$ de $W(\underline n, T, \underline k, \underline j)$, qui est $\llbracket G_{<j} \rrbracket(T)$ par l'hypothèse de récurrence, cela donne $W(\underline n, T, \underline k, \underline{j + 1}) = \mathrm{conc}(\llbracket G_{<j} \rrbracket(T), T) = \llbracket G_{<j+1} \rrbracket(T)$, puisque le terme de rang $j$ du gabarit est $\diamond$. Dans le second cas, on obtient de même $\mathrm{aj}(\llbracket G_{<j} \rrbracket(T), (\underline n)^{\underline j})$, c'est-à-dire $\mathrm{aj}(\llbracket G_{<j} \rrbracket(T), \underline{c_j}) = \llbracket G_{<j+1} \rrbracket(T)$.

      Par le point (ii) (d) de {{cal-sp-termes|Termes fonctionnels}}, $\mathrm{Sb}(\underline n, T, \underline k) = W(\underline n, T, \underline k, \mathrm{lg}(\underline n))$, et le remplacement, avec $\mathrm{lg}(\underline n) = \underline m$, donne l'égalité pour $T$ ; le point (ii) (b) du même nœud la donne pour $\tau$, la variable $T$ n'étant libre dans aucune hypothèse. Si $x$ n'a pas d'occurrence libre dans $w$, le gabarit ne contient pas $\diamond$, et $\llbracket G_k(w) \rrbracket = \underline n$.

      (iii) Par la définition des occurrences libres ({{l-formules|Formules, variables libres}}), une occurrence de $x$ dans $\varphi$ est libre dans $\neg\varphi$ ou dans ${\to}\, \varphi\, \psi$ si et seulement si elle l'est dans $\varphi$, et de même pour $\psi$ : par le texte de {{cal-sx-libres|Variables libres}}, les blocs $\forall$ et leurs [[portee-quantificateur|portées]] sont ceux de la construction, c'est-à-dire, pour ces deux formules, ceux de $\varphi$ et de $\psi$. Dans $\forall z\, \varphi$, il s'y ajoute le bloc $\forall z$, de portée $\varphi$, qui ne lie pas $x$ ; dans $\forall x\, \varphi$, ce bloc lie toutes les occurrences de $x$, et la lettre de rang $1$ n'est pas une occurrence. Dans un terme ou dans ${=}\, t\, u$, il n'y a pas de bloc. Ainsi, en notant $(c)$ le gabarit réduit à l'entier $c$,
      $$\begin{aligned} G_k(\neg\varphi) &= (1)\, G_k(\varphi), \\ G_k({\to}\, \varphi\, \psi) &= (2)\, G_k(\varphi)\, G_k(\psi), \\ G_k(\forall z\, \varphi) &= (3)(c)\, G_k(\varphi), \\ G_k({=}\, t\, u) &= (0)\, G_k(t)\, G_k(u), \end{aligned}$$
      de même pour $S\, t$, ${+}\, t\, u$ et ${\times}\, t\, u$, tandis que $G_k(x) = (\diamond)$ et que $G_k(\forall x\, \varphi)$ et $G_k(r)$ ne contiennent pas $\diamond$. Le point (i), les égalités $\llbracket (e) \rrbracket = \mathrm{aj}(0, \underline e) = \underline{\langle e \rangle}$ et $\llbracket (3)(c) \rrbracket = \underline{\langle 3, c \rangle}$, calculs clos, et $\llbracket (\diamond) \rrbracket(\tau) = \mathrm{conc}(0, \tau) = \tau$ ({{cal-sp-concatenation|Concaténation dans PA}}, (iv)) donnent, avec (ii) appliqué à chacun des mots, les égalités annoncées.
    remarques:
      - |
        Pour $\varphi = {\to}\, {=}\, x_0\, 0\, \forall x_0\, {=}\, x_0\, x_1$, formule de la remarque de {{cal-sx-substitution|Substitution}}, on trouve $G_8(\varphi) = (2, 0, \diamond, 4, 3, 8, 0, 8, 9)$ et $G_9(\varphi) = (2, 0, 8, 4, 3, 8, 0, 8, \diamond)$ : seule l'occurrence libre de $x_0$, au rang $2$, est marquée, et les points (i) et (ii) donnent $\vdash_{\mathsf{PA}} \mathrm{Sb}(\underline{\ulcorner \varphi \urcorner}, \tau, \underline 8) = \mathrm{cc}(\underline{\langle 2, 0 \rangle}, \tau, \underline{\langle 4, 3, 8, 0, 8, 9 \rangle})$. Ces gabarits, et la composition (iii), ont été vérifiés par un calcul sur quelques centaines de formules tirées au hasard, en appliquant mot pour mot les définitions de {{cal-sx-libres|Variables libres}} et de {{cal-sx-substitution|Substitution}}.
      - |
        Le dépliement exige que le mot $w$ soit fixé : chaque pas du balayage consulte $\mathrm{Lib}$ en un rang clos d'un code clos, ce que tranche un calcul clos. L'erreur la plus répandue est de l'appliquer à un code qui dépend d'une variable, comme celui d'une formule où l'on a déjà substitué un chiffre variable. Pour $\psi = {=}\, x_0\, x_1$, l'occurrence de $x_1$ dans $\psi[\underline a/x_0]$ est au rang $a + 2$, qui dépend de $a$. L'obstacle est ce rang variable : le balayage ne compte plus un nombre fixé de pas, et l'on ne peut plus trancher chaque cas par un calcul clos. Pour substituer encore à $x_1$, il faut un autre argument, par exemple la lecture unique démontrée dans $\mathsf{PA}$, ou une restriction aux paramètres qui ne sont quantifiés nulle part, pour laquelle $\mathrm{Lib}$ se réduit à $\mathrm{Oc}$ et la substitution agit lettre à lettre. Faute de cet argument, le nœud {{cal-ip-instanciation|Instanciation formalisée}} se limite à un seul paramètre ; le chapitre suivant prend la seconde voie, au nœud {{cal-sg-substitution|Substitution lettre à lettre}}.

  - id: cal-ip-instances
    etiquette: Formules des instances
    nature: proposition
    titre: Les instances d'une formule fixée sont des formules, et les chiffres y sont substituables, dans l'arithmétique de Peano
    texte: |
      Les conventions sont celles de {{cal-ip-substitution|Substitution dépliée}} et de {{cal-ip-formation|Formation dans PA}}. La relation $\mathrm{Sbl}$ est prise avec la construction qu'écrit la preuve du point (ii) de {{cal-sx-substitution|Substitution}}. Pour un terme fonctionnel $\tau$ et une variable $m$ qui n'y figure pas, on note $\mathrm{In}(\tau)$ la formule fonctionnelle $\forall m < \mathrm{lg}(\tau)\ \big((\tau)^m < \underline 8\big)$, et l'on dit que $\tau$ est *inerte* : dans $\mathcal N$, elle dit que le mot de [[code-mot|code]] $\tau$ ne contient aucune variable.

      Pour une formule $\varphi$, une variable $x = a_k$ et une variable $y$, on note
      $$\ulcorner \varphi[\dot y/x] \urcorner = \mathrm{Sb}\big(\underline{\ulcorner \varphi \urcorner}, \mathrm{num}(y), \underline k\big),$$
      terme fonctionnel dont la seule variable est $y$ : c'est le code de $\varphi$ où l'on a substitué à $x$ le chiffre de $y$. Pour un entier $n$, $\vdash_{\mathsf{PA}} \ulcorner \varphi[\dot y/x] \urcorner[\underline n/y] = \underline{\ulcorner \varphi[\underline n/x] \urcorner}$, par le point (iv) de {{cal-sp-termes|Termes fonctionnels}}, puisque $\mathrm{num}(n)$ code le terme $\underline n$ et que $\mathrm{Sb}$ calcule le code de $\varphi[\underline n/x]$ ({{cal-sx-substitution|Substitution}}, (i)).
    enonce: |
      Soit $\tau$ un terme fonctionnel, $x = a_k$ une variable et $y$ une variable.

      (i) **Formules des instances.** Pour tout terme $t$, $\vdash_{\mathsf{PA}} \widehat{\mathrm{Tm}}(\tau) \to \widehat{\mathrm{Tm}}(\mathrm{Sb}(\underline{\ulcorner t \urcorner}, \tau, \underline k))$, et, pour toute formule $\varphi$,
      $$\vdash_{\mathsf{PA}} \widehat{\mathrm{Tm}}(\tau) \to \widehat{\mathrm{Fm}}\big(\mathrm{Sb}(\underline{\ulcorner \varphi \urcorner}, \tau, \underline k)\big).$$

      (ii) **Termes inertes.** Pour toute formule $\varphi$, $\vdash_{\mathsf{PA}} \mathrm{In}(\tau) \to \widehat{\mathrm{Sbl}}(\tau, \underline k, \underline{\ulcorner \varphi \urcorner})$.

      (iii) **Chiffres.** Pour toute formule $\varphi$, $\vdash_{\mathsf{PA}} \widehat{\mathrm{Fm}}(\ulcorner \varphi[\dot y/x] \urcorner)$ et $\vdash_{\mathsf{PA}} \widehat{\mathrm{Sbl}}(\mathrm{num}(y), \underline k, \underline{\ulcorner \varphi \urcorner})$. Si $x$ est libre dans $\varphi$, $\vdash_{\mathsf{PA}} \mathrm{num}(y) \leqslant \ulcorner \varphi[\dot y/x] \urcorner$ ; sinon, $\vdash_{\mathsf{PA}} \ulcorner \varphi[\dot y/x] \urcorner = \underline{\ulcorner \varphi \urcorner}$.
    preuve: |
      (i) Par récurrence sur la construction de $t$, puis de $\varphi$, en [[metatheorie|métathéorie]], sous l'hypothèse $\widehat{\mathrm{Tm}}(\tau)$, avec les égalités du point (iii) de {{cal-ip-substitution|Substitution dépliée}} et le remplacement ({{cal-sp-termes|Termes fonctionnels}}, (ii) (c)). Si $t$ est $x$, $\mathrm{Sb}\ulcorner x \urcorner = \tau$, qui code un terme par hypothèse. Si $t$ est $0$ ou une autre variable, $\mathrm{Sb}\ulcorner t \urcorner = \underline{\ulcorner t \urcorner}$, et $\widehat{\mathrm{Tm}}(\underline{\ulcorner t \urcorner})$ est un calcul clos. Si $t$ est $S\, t_1$, ${+}\, t_1\, t_2$ ou ${\times}\, t_1\, t_2$, l'hypothèse de récurrence et le point (i) de {{cal-ip-formation|Formation dans PA}} concluent. Pour les formules, le cas atomique ${=}\, t\, u$ découle du cas des termes et du point (ii) du même nœud ; les cas $\neg\varphi$, ${\to}\, \varphi\, \psi$ et $\forall z\, \varphi$, avec $z = a_c$ distincte de $x$, découlent de l'hypothèse de récurrence et du même point, avec l'entier $c \geqslant 8$ ; enfin, $\mathrm{Sb}\ulcorner \forall x\, \varphi \urcorner = \underline{\ulcorner \forall x\, \varphi \urcorner}$, et $\widehat{\mathrm{Fm}}(\underline{\ulcorner \forall x\, \varphi \urcorner})$ est un calcul clos.

      (ii) Soit $n = \ulcorner \varphi \urcorner$ et $l$ la longueur de $\varphi$. La formule naturelle de $\mathrm{Sbl}$ se lit clause par clause, comme au point (ii) de {{cal-sp-derivabilite|Deuxième condition (D2)}} : $\widehat{\mathrm{Sbl}}(\tau, \underline k, \underline n)$ découle de
      $$\begin{aligned} &\forall j < \mathrm{lg}(\underline n)\ \neg\exists i < j \\ &\quad \exists l' < S\,\mathrm{lg}(\underline n)\ \big((\underline n)^i = \underline 3 \\ &\quad \wedge \exists m < \mathrm{lg}(\tau)\ (\tau)^m = (\underline n)^{S\,i} \\ &\quad \wedge \Psi\big), \end{aligned}$$
      où $\Psi$ réunit les clauses $S\,S\,i \leqslant j$, $j < l'$ et $\widehat{\mathrm{Fm}}(\mathrm{sm}(\underline n, S\,S\,i, l'))$, qui ne servent pas, et où $i + 1$ et $i + 2$ sont écrits $S\,i$ et $S\,S\,i$ par $\mathrm Q_4$ et $\mathrm Q_5$. Par le point (i) (a) de {{cal-bp-modules|Modules de Gödel}} et l'élimination des quantifications bornées strictes (preuve de {{cal-sp-derivabilite|Deuxième condition (D2)}}), il suffit de tirer une contradiction des hypothèses $\mathrm{In}(\tau)$, $j < \mathrm{lg}(\underline n)$, $i < j$, $(\underline n)^i = \underline 3$, $m < \mathrm{lg}(\tau)$ et $(\tau)^m = (\underline n)^{S\,i}$.

      Comme $\mathrm{lg}(\underline n) = \underline l$, la transitivité donne $i < \underline l$ ; en particulier $l \geqslant 1$, et $i \leqslant \underline{l - 1}$, de sorte que le point (v) de {{cal-rp-calculs-q|Calculs dans Q}} donne la disjonction des formules $i = \underline r$, pour $r < l$. Raisonnons par cas. Si la lettre de rang $r$ de $\varphi$ n'est pas $\forall$, le calcul clos $\neg((\underline n)^{\underline r} = \underline 3)$ et le remplacement contredisent $(\underline n)^i = \underline 3$. Si elle l'est, le texte de {{cal-sx-libres|Variables libres}} dit qu'elle est suivie de la variable de son bloc, de sorte que $r + 1 < l$ et que le calcul clos $\underline 8 \leqslant (\underline n)^{S\,\underline r}$ est démontrable ; alors $\underline 8 \leqslant (\tau)^m$, alors que $\mathrm{In}(\tau)$, instanciée par $m$ ({{cal-bp-modules|Modules de Gödel}}, (i) (b)), donne $(\tau)^m < \underline 8$, ce qu'exclut le dernier point de (v) de {{cal-pa-ordre|Ordre dans PA}}.

      (iii) Par le point (iii) de {{cal-ip-formation|Formation dans PA}}, $\widehat{\mathrm{Tm}}(\mathrm{num}(y))$, et, pour $m < \mathrm{lg}(\mathrm{num}(y)) = S\,y$, $(\mathrm{num}(y))^m$ vaut $\underline 4$ ou $\underline 5$, qui sont plus petits que $\underline 8$ ; le point (i) (a) de {{cal-bp-modules|Modules de Gödel}} donne $\mathrm{In}(\mathrm{num}(y))$, et (i) et (ii), appliqués au terme $\mathrm{num}(y)$, donnent les deux premières formules. Si $x$ est libre dans $\varphi$, le signe $\diamond$ figure dans $G_k(\varphi)$, et les points (i) et (ii) de {{cal-ip-substitution|Substitution dépliée}} donnent $\mathrm{num}(y) \leqslant \llbracket G_k(\varphi) \rrbracket(\mathrm{num}(y)) = \ulcorner \varphi[\dot y/x] \urcorner$ ; sinon, le point (ii) du même nœud donne la dernière égalité.
    remarques:
      - |
        L'hypothèse $\widehat{\mathrm{Tm}}(\tau)$ du point (i) ne peut pas être omise. Pour $\tau = 0$, code du mot vide, la substitution efface les occurrences : $\mathrm{Sb}(154\,618\,822\,656, 0, 8) = 18$, où $154\,618\,822\,656 = \ulcorner {=}\, x_0\, 0 \urcorner$ et $18 = \langle 0, 4 \rangle$ est le code du mot ${=}\, 0$, qui n'est pas une formule ; le calcul a été fait au niveau des mots, puis des codes. Le point (i) est la forme interne à $\mathsf{PA}$ du point (iii) de {{cal-sx-substitution|Substitution}}, pour une formule fixée ; pour une formule quelconque, donnée par une variable $N$, il faudrait une récurrence interne sur les formules, que le chapitre n'emploie pas.
      - |
        Un chiffre est substituable partout parce qu'il n'a pas de variable, et la preuve du point (ii) le dit exactement : une capture demanderait que la variable du bloc $\forall$ soit une lettre du terme, alors que celle-ci est au moins $8$ et que les lettres d'un terme inerte sont plus petites. Le terme $S\, x_0$ n'est pas inerte, et il n'est pas substituable à $x_1$ dans la formule de la remarque de {{cal-sx-substitution|Substitution}}, ce qu'a confirmé le même calcul. On notera que la preuve n'a pas besoin de savoir quels facteurs sont des formules : elle ne consulte que la lettre qui suit chaque $\forall$.

  - id: cal-ip-instanciation
    etiquette: Instanciation formalisée
    nature: théorème
    titre: Axiomes du groupe (2), instanciation formalisée, et première et deuxième conditions à un paramètre
    texte: |
      Les conventions sont celles de {{cal-sp-derivabilite|Deuxième condition (D2)}} et de {{cal-ip-instances|Formules des instances}} : $T$ est une théorie sur la signature de l'arithmétique dont l'ensemble des [[code-mot|codes]] des axiomes est récursivement énumérable, $T'$ la théorie du {{cal-craig|théorème de Craig}}, ou $T$ elle-même si l'ensemble des codes de ses axiomes est primitif récursif, et $\mathrm{Dem} = \mathrm{Dem}_{T'}$. La relation $\mathrm{Ax}$ est prise avec la construction qu'écrit la preuve de {{cal-sx-axiomes|Axiomes logiques}}, où le mot ${\to}\, \forall$, de code $\langle 2, 3 \rangle = 224$, suivi de la lettre $a_k$, a pour code $\mathrm{aj}(\underline{\langle 2, 3 \rangle}, k)$ ({{cal-sx-codage|Codage des mots}}, (i)).

      Soit $p$ et $v$ des variables distinctes. La *formule naturelle de démontrabilité des formules* de $T$ est $\mathrm{Prf}_T(v) = \exists p\ \widehat{\mathrm{Dem}}(p, v)$. Pour un terme fonctionnel $\tau$, on note $\mathrm{Prf}_T(\tau)$ la formule $\mathrm{Prf}_T[\tau/v]$, et, pour une formule $\varphi$, $\mathrm{Prf}_T\,\ulcorner \varphi \urcorner$ l'énoncé $\mathrm{Prf}_T(\underline{\ulcorner \varphi \urcorner})$. Elle ne diffère de la formule $\mathrm{Pr}_T$ de {{cal-sp-derivabilite|Deuxième condition (D2)}} que par l'absence de la clause « $c$ code un énoncé ». Pour une formule $\alpha$ et une variable $x = a_k$, on note enfin
      $$I_\alpha(y) = \mathrm{cc}\big(\underline{\langle 2 \rangle}, \underline{\ulcorner \forall x\, \alpha \urcorner}, \ulcorner \alpha[\dot y/x] \urcorner\big),$$
      code de la formule ${\to}\, \forall x\, \alpha\ \alpha[\dot y/x]$, et l'on note $\exists x\, \alpha$ la formule $\neg\forall x\, \neg\alpha$.
    enonce: |
      Soit $\alpha$, $\beta$ et $\psi$ des formules, $x = a_k$ une variable, et $y$, $b$ des variables distinctes de la variable liée $p$ de $\mathrm{Prf}_T$, de sorte que $\mathrm{Prf}_T(\ulcorner \alpha[\dot y/x] \urcorner)$ ne capture pas $y$ ; si $y$ était $p$, on renommerait d'abord $p$ par le renommage existentiel ({{cal-rp-calcul|Calcul à variables libres}}, (iii)), qui donne une formule équivalente.

      (i) **Démontrabilité des formules.** La formule $\mathrm{Prf}_T$ est dans $\mathcal S$ et définit dans $\mathcal N$, avec la variable $v$, l'ensemble des codes des formules démontrables à partir de $T$. Si $T \vdash \psi$, alors $\vdash_{\mathsf{PA}} \mathrm{Prf}_T\,\ulcorner \psi \urcorner$. Pour tout énoncé $\sigma$, $\vdash_{\mathsf{PA}} \mathrm{Pr}_T\,\ulcorner \sigma \urcorner \leftrightarrow \mathrm{Prf}_T\,\ulcorner \sigma \urcorner$. Enfin,
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\Big(\widehat{\mathrm{Fm}}(b) \wedge \big(\widehat{\mathrm{Ax}}(b) \vee \widehat{\mathrm{Ax}}_{T'}(b)\big)\Big) \\ &\to \widehat{\mathrm{Dem}}(\mathrm{aj}(0, b), b). \end{aligned}$$

      (ii) **Axiomes du groupe (2).** $\vdash_{\mathsf{PA}} \widehat{\mathrm{Fm}}(I_\alpha(y)) \wedge \widehat{\mathrm{Ax}}(I_\alpha(y))$.

      (iii) **Instanciation formalisée.**
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\mathrm{Prf}_T\,\ulcorner \forall x\, \alpha \urcorner \\ &\to \mathrm{Prf}_T\big(\ulcorner \alpha[\dot y/x] \urcorner\big). \end{aligned}$$

      (iv) **Première et deuxième conditions à un paramètre.** Si $T \vdash \psi$, alors $\vdash_{\mathsf{PA}} \mathrm{Prf}_T(\ulcorner \psi[\dot y/x] \urcorner)$. De plus,
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\mathrm{Prf}_T\big(\ulcorner (\alpha \to \beta)[\dot y/x] \urcorner\big) \\ &\to \Big(\mathrm{Prf}_T\big(\ulcorner \alpha[\dot y/x] \urcorner\big) \\ &\qquad \to \mathrm{Prf}_T\big(\ulcorner \beta[\dot y/x] \urcorner\big)\Big). \end{aligned}$$

      (v) **Introduction formalisée de $\exists$.** $\vdash_{\mathsf{PA}} \mathrm{Prf}_T(\ulcorner \alpha[\dot y/x] \urcorner) \to \mathrm{Prf}_T\,\ulcorner \exists x\, \alpha \urcorner$.

      Toute théorie qui démontre les axiomes de $\mathsf{PA}$ démontre ces formules.
    preuve: |
      On emploie les règles d'introduction et d'élimination des quantifications bornées strictes de la preuve de {{cal-sp-derivabilite|Deuxième condition (D2)}}, et l'on écrit avec les valeurs, au sens de {{cal-sp-termes|Termes fonctionnels}}.

      (i) La formule $\widehat{\mathrm{Dem}}(p, v)$ est dans $\mathcal S$ ({{cal-bp-relations|Relations p.r. dans PA}}), et $\mathcal S$ est stable par la quantification existentielle. Comme une formule naturelle définit sa relation, $\mathrm{Prf}_T$ est satisfaite sous une [[valuation-structure|valuation]] qui vaut $c$ en $v$ si et seulement s'il existe une démonstration formelle, à partir de $T'$, de la formule de code $c$, c'est-à-dire, par le point (i) du {{cal-craig|théorème de Craig}}, si $c$ code une formule que $T$ démontre. Si $T \vdash \psi$, soit $q$ le code d'une démonstration formelle de $\psi$ à partir de $T'$ ; le point (iv) de {{cal-sp-termes|Termes fonctionnels}} donne $\vdash_{\mathsf{PA}} \widehat{\mathrm{Dem}}(\underline q, \underline{\ulcorner \psi \urcorner})$, et l'introduction de l'existentiel donne $\vdash_{\mathsf{PA}} \mathrm{Prf}_T\,\ulcorner \psi \urcorner$. Pour un énoncé $\sigma$, de code $s$, le point (ii) de {{cal-sp-derivabilite|Deuxième condition (D2)}}, où l'on substitue $\underline s$ à $c$, donne $\hat D(p, \underline s) \leftrightarrow (\widehat{\mathrm{Dem}}(p, \underline s) \wedge \widehat{\mathrm{En}}(\underline s))$, et le calcul clos $\widehat{\mathrm{En}}(\underline s)$ donne $\hat D(p, \underline s) \leftrightarrow \widehat{\mathrm{Dem}}(p, \underline s)$ ; la monotonie ({{cal-pa-recurrence|Récurrence dans PA}}, (ii)), dans les deux sens, donne l'équivalence de $\mathrm{Pr}_T\,\ulcorner \sigma \urcorner$ et de $\mathrm{Prf}_T\,\ulcorner \sigma \urcorner$.

      *Démonstrations d'une ligne.* Soit $e = \mathrm{aj}(0, b)$. Par le point (ii) de {{cal-sp-longueur|Longueur dans PA}}, $\mathrm{lg}(e) = S\,\mathrm{lg}(0) = S\,0$, donc $S\,0 \leqslant \mathrm{lg}(e)$, et, par le point (iii) du même nœud et le point (iii) de {{cal-bp-usuelles|Fonctions usuelles dans PA}}, $(e)^{S\,0 \mathbin{\dot{-}} S\,0} = (e)^0 = (e)^{\mathrm{lg}(0)} = b$. Par le point (i) (c) de {{cal-bp-modules|Modules de Gödel}}, avec la clause démontrable $\forall j < 0$, la clause bornée du dépliement de $\widehat{\mathrm{Dem}}(e, b)$ ({{cal-sp-derivabilite|Deuxième condition (D2)}}, (ii)) équivaut à $\Lambda(e, 0)$, c'est-à-dire, par le remplacement, à $\widehat{\mathrm{Fm}}(b) \wedge \big(\widehat{\mathrm{Ax}}(b) \vee (\widehat{\mathrm{Ax}}_{T'}(b) \vee \exists i < 0\ \exists i' < 0\ \cdots)\big)$, qui découle de l'hypothèse par la règle des tautologies.

      (ii) Soit $n = \ulcorner \alpha \urcorner$, $n_\forall = \ulcorner \forall x\, \alpha \urcorner$, $\gamma$ la valeur de $\ulcorner \alpha[\dot y/x] \urcorner$ et $M$ celle de $I_\alpha(y)$, de sorte que $M = \mathrm{cc}(\underline{\langle 2 \rangle}, \underline{n_\forall}, \gamma)$. *Formule.* Le calcul clos $\widehat{\mathrm{Fm}}(\underline{n_\forall})$, le point (iii) de {{cal-ip-instances|Formules des instances}}, qui donne $\widehat{\mathrm{Fm}}(\gamma)$, et le point (ii) de {{cal-ip-formation|Formation dans PA}} donnent $\widehat{\mathrm{Fm}}(M)$.

      *Lecture de $\mathrm{Ax}$.* Comme au point (ii) de {{cal-sp-derivabilite|Deuxième condition (D2)}}, la formule naturelle se lit clause par clause : $\widehat{\mathrm{Ax}}(M)$ découle de la formule obtenue avec le témoin $g = 0$ de la quantification bornée sur les généralisations, puisque $0 < S\,\mathrm{lg}(M)$, que $2 \cdot 0$ vaut $0$, que la clause $\forall m < 0$ est démontrable et que $\mathrm{sm}(M, 0, \mathrm{lg}(M)) = M$ ({{cal-ip-facteurs|Facteurs dans PA}}, (iv)). Il suffit donc d'établir le disjonct du groupe (2) en $M$, qui découle de $\widehat{\mathrm{Fm}}(M)$ et de
      $$\begin{aligned} &\exists k' < M\ \exists a' < S\,M\ \exists T < S\,M \\ &\quad \big(\underline 8 \leqslant k' \wedge \widehat{\mathrm{Fm}}(a') \wedge \widehat{\mathrm{Tm}}(T) \\ &\quad \wedge \widehat{\mathrm{Sbl}}(T, k', a') \\ &\quad \wedge M = \mathrm{cc}\big(\mathrm{aj}(\underline{\langle 2, 3 \rangle}, k'), \\ &\qquad a', \mathrm{Sb}(a', T, k')\big)\big). \end{aligned}$$

      *Témoins.* On prend $k' = \underline k$ et $a' = \underline n$, et, pour $T$, le terme $\mathrm{num}(y)$ si $x$ est libre dans $\alpha$, le chiffre $\underline{\ulcorner x \urcorner}$ sinon. Les calculs clos $\underline 8 \leqslant \underline k$ et $\widehat{\mathrm{Fm}}(\underline n)$ sont démontrables. Dans le premier cas, $\widehat{\mathrm{Tm}}(\mathrm{num}(y))$ par le point (iii) de {{cal-ip-formation|Formation dans PA}}, $\widehat{\mathrm{Sbl}}(\mathrm{num}(y), \underline k, \underline n)$ par le point (iii) de {{cal-ip-instances|Formules des instances}}, et $\gamma = \mathrm{Sb}(\underline n, \mathrm{num}(y), \underline k)$ par définition. Dans le second, $\widehat{\mathrm{Tm}}(\underline{\ulcorner x \urcorner})$ et $\widehat{\mathrm{Sbl}}(\underline{\ulcorner x \urcorner}, \underline k, \underline n)$ sont des calculs clos, puisque $x$ est substituable à elle-même ; et $\gamma = \underline n$ par le point (iii) de {{cal-ip-instances|Formules des instances}}, tandis que $\mathrm{Sb}(\underline n, \underline{\ulcorner x \urcorner}, \underline k) = \underline n$ par un calcul clos, puisque $\alpha[x/x] = \alpha$. Dans les deux cas, $\mathrm{Sb}(\underline n, T, \underline k) = \gamma$. Enfin, le calcul clos $\mathrm{conc}(\underline{\langle 2 \rangle}, \underline{n_\forall}) =\mathrm{conc}(\mathrm{aj}(\underline{\langle 2, 3 \rangle}, \underline k), \underline n)$, puisque les deux membres codent le mot ${\to}\, \forall x\, \alpha$, donne $M = \mathrm{cc}(\mathrm{aj}(\underline{\langle 2, 3 \rangle}, \underline k), \underline n, \mathrm{Sb}(\underline n, T, \underline k))$.

      *Bornes.* Soit $K = \mathrm{conc}(\mathrm{aj}(\underline{\langle 2, 3 \rangle}, \underline k), \underline n)$, de sorte que $M = \mathrm{conc}(K, \gamma)$. Par le point (iii) de {{cal-ip-facteurs|Facteurs dans PA}}, $\mathrm{aj}(\underline{\langle 2, 3 \rangle}, \underline k) \leqslant K \leqslant M$ et $\underline n \leqslant K$, et $\gamma \leqslant M$. Le calcul clos $\underline k < \mathrm{aj}(\underline{\langle 2, 3 \rangle}, \underline k)$, vrai puisque $2^{224}(2k + 1) > k$, donne $\underline k < M$, par la transitivité mixte. On a $\underline n \leqslant M$, c'est-à-dire $\underline n < S\,M$ ({{cal-pa-ordre|Ordre dans PA}}, (v)). Dans le premier cas, $\mathrm{num}(y) \leqslant \gamma \leqslant M$, par le point (iii) de {{cal-ip-instances|Formules des instances}} ; dans le second, le calcul clos $\underline{\ulcorner x \urcorner} \leqslant \mathrm{aj}(\underline{\langle 2, 3 \rangle}, \underline k)$, vrai puisque $\ulcorner x \urcorner = 2k + 1$, donne $\underline{\ulcorner x \urcorner} \leqslant M$. Trois introductions des quantifications bornées strictes concluent.

      (iii) Raisonnons sous l'hypothèse $\widehat{\mathrm{Dem}}(q, \underline{n_\forall})$, pour une variable $q$ nouvelle, distincte de $y$, et soit $e = \mathrm{aj}(0, M)$. Par (i) et (ii), $\widehat{\mathrm{Dem}}(e, M)$. La relation $\mathrm{MP}(a, b, c)$ est $b = \mathrm{cc}(\langle 2 \rangle, a, c)$ ({{cal-sx-demonstrations|Démonstrations}}, (i)), et sa formule naturelle équivaut à cette égalité de termes fonctionnels par le point (ii) de {{cal-bp-relations|Relations p.r. dans PA}} et le point (ii) (d) de {{cal-sp-termes|Termes fonctionnels}} : $\widehat{\mathrm{MP}}(\underline{n_\forall}, M, \gamma)$ découle de la définition de $M$. Avec $\widehat{\mathrm{Fm}}(\gamma)$, le point (iii) de {{cal-sp-derivabilite|Deuxième condition (D2)}}, écrit avec des variables $p$, $q$, $a$, $b$, $c$ distinctes de $y$ et des valeurs introduites, où l'on substitue $e$, $q$, $\underline{n_\forall}$, $M$ et $\gamma$ à $p$, $q$, $a$, $b$ et $c$ ({{cal-sp-termes|Termes fonctionnels}}, (ii) (b)), les variables de chaque terme substitué n'étant pas parmi celles qu'on substitue ensuite, donne $\widehat{\mathrm{Dem}}(\mathrm{aj}(\mathrm{conc}(e, q), \gamma), \gamma)$, et l'introduction de l'existentiel, avec la valeur de ce terme fonctionnel, donne $\mathrm{Prf}_T(\gamma)$. On élimine les valeurs. L'hypothèse est $\widehat{\mathrm{Dem}}(p, \underline{n_\forall})[q/p]$, et $q$ ne figure ni dans $\widehat{\mathrm{Dem}}(p, \underline{n_\forall})$ ni dans la conclusion $\mathrm{Prf}_T(\gamma)$, où $p$ est liée et où $y$, distincte de $p$, reste libre : la troisième règle du point (i) de {{cal-pa-recurrence|Récurrence dans PA}} la remplace par $\mathrm{Prf}_T\,\ulcorner \forall x\, \alpha \urcorner$, et le théorème de la déduction conclut.

      (iv) Si $T \vdash \psi$, la généralisation, qui vaut pour toute théorie ({{cal-pa-recurrence|Récurrence dans PA}}, (i)), donne $T \vdash \forall x\, \psi$ ; (i) donne $\vdash_{\mathsf{PA}} \mathrm{Prf}_T\,\ulcorner \forall x\, \psi \urcorner$, et (iii) et le [[modus-ponens|modus ponens]] donnent $\vdash_{\mathsf{PA}} \mathrm{Prf}_T(\ulcorner \psi[\dot y/x] \urcorner)$.

      Pour la seconde formule, notons $\gamma_\alpha$, $\gamma_\beta$ et $\gamma_{\alpha \to \beta}$ les valeurs des trois codes. Par le point (iii) de {{cal-ip-substitution|Substitution dépliée}}, $\gamma_{\alpha \to \beta} = \mathrm{cc}(\underline{\langle 2 \rangle}, \gamma_\alpha, \gamma_\beta)$, d'où $\widehat{\mathrm{MP}}(\gamma_\alpha, \gamma_{\alpha \to \beta}, \gamma_\beta)$, et le point (iii) de {{cal-ip-instances|Formules des instances}} donne $\widehat{\mathrm{Fm}}(\gamma_\beta)$. Sous les hypothèses $\widehat{\mathrm{Dem}}(p, \gamma_{\alpha \to \beta})$ et $\widehat{\mathrm{Dem}}(q, \gamma_\alpha)$, pour une variable $q$ nouvelle, distincte de $y$, le point (iii) de {{cal-sp-derivabilite|Deuxième condition (D2)}} donne $\widehat{\mathrm{Dem}}(\mathrm{aj}(\mathrm{conc}(p, q), \gamma_\beta), \gamma_\beta)$, puis $\mathrm{Prf}_T(\gamma_\beta)$. On élimine $q$, puis $p$, et l'on applique deux fois le théorème de la déduction, exactement comme au point (iv) du même nœud.

      (v) Par le point (iii) de {{cal-rp-calcul|Calcul à variables libres}}, avec le terme $x$, substituable à $x$ dans $\alpha$, on a $\vdash \alpha \to \exists x\, \alpha$, donc $T \vdash \alpha \to \exists x\, \alpha$ par le point (i) du même nœud. Comme $x$ n'est pas libre dans $\exists x\, \alpha = \neg\forall x\, \neg\alpha$, le point (ii) de {{cal-ip-substitution|Substitution dépliée}} donne $\ulcorner (\exists x\, \alpha)[\dot y/x] \urcorner = \underline{\ulcorner \exists x\, \alpha \urcorner}$. La première formule de (iv), appliquée à $\psi = \alpha \to \exists x\, \alpha$, puis la seconde, avec $\beta = \exists x\, \alpha$, donnent $\vdash_{\mathsf{PA}} \mathrm{Prf}_T(\ulcorner \alpha[\dot y/x] \urcorner) \to \mathrm{Prf}_T(\underline{\ulcorner \exists x\, \alpha \urcorner})$, par le remplacement.

      Une théorie qui démontre les axiomes de $\mathsf{PA}$ démontre tout ce que démontre $\mathsf{PA}$, par le lemme de remplacement de la preuve du {{cal-craig|théorème de Craig}}.
    remarques:
      - |
        Le point (iii) est la forme interne à $\mathsf{PA}$, uniforme en $y$, de l'axiome (2) employé avec un chiffre : de toute démonstration $q$ de $\forall x\, \alpha$, on tire, pour chaque valeur $n$ de $y$, une démonstration de $\alpha[\underline n/x]$ en lui ajoutant deux lignes, l'axiome $I_\alpha(y)$ et le modus ponens. La démonstration de cet axiome tient en une ligne, et le code d'une démonstration réduite à une formule de code $b$ est $\mathrm{aj}(0, b) = 2b + 1$ ; pour l'axiome $x_0 = x_0$ du groupe (5), c'est $2 \cdot 2^{34} \cdot 17 + 1 = 584\,115\,552\,257$, le code de la remarque de {{cal-sx-demonstrations|Démonstrations}}. La difficulté n'est pas dans ces deux lignes, mais dans la reconnaissance de l'axiome, qui demande que $\mathsf{PA}$ sache que $\alpha[\dot y/x]$ est une formule et que le chiffre de $y$ est substituable, pour une variable $y$.
      - |
        L'erreur la plus répandue est de croire qu'en itérant le point (iii) on instancie plusieurs variables : après une première instanciation, la formule $\forall z\, \alpha[\dot y/x]$ n'est plus une formule fixée, et le point (ii) ne s'applique plus, puisqu'il faudrait déplier la substitution dans un code variable, ce que la seconde remarque du nœud {{cal-ip-substitution|Substitution dépliée}} montre hors de portée du simple dépliement. Les points (iv) et (v) sont ainsi une logique « sous $\mathrm{Prf}_T$ » à un seul paramètre. La Σ₁-complétude formalisée, qui donnera la troisième condition de dérivabilité du nœud voisin {{cal-dg-second|Löb et second théorème}}, demande des instances à plusieurs paramètres, donc un argument qui substitue dans un code variable : par exemple la lecture unique démontrée dans $\mathsf{PA}$, ou une restriction aux paramètres qui ne sont quantifiés nulle part dans la formule, pour lesquels la substitution d'un chiffre agit lettre à lettre. C'est la seconde voie que suit le chapitre suivant, jusqu'au nœud {{cal-sg-d3|Troisième condition (D3)}}.

