# Niveau 1 : structure interne de la logique du premier ordre.
# Ce graphe est à la racine de l'édifice : il n'a pas d'entrée. Sa syntaxe est purement
# combinatoire (mots finis sur un alphabet) ; sa sémantique emploie des ensembles au sens
# naïf, dans une métathéorie, et non dans ZF qui n'est pas encore construite.

graphe: log
titre: Logique du premier ordre
conteneur: log

noeuds:
  - id: l-metatheorie
    etiquette: Cadre métathéorique
    nature: axiome
    titre: Le cadre de la logique
    enonce: |
      La logique étudie des **mots**, suites finies de symboles pris dans un alphabet, et des **structures** qui leur donnent un sens. Pour en parler, on s'autorise les notions du raisonnement mathématique ordinaire : ensembles, applications, entiers naturels, récurrence, ensembles finis et dénombrables, pris dans leur sens intuitif. C'est la **métathéorie**.
    texte: |
      La logique est placée sous la théorie des ensembles, alors que sa sémantique emploie des ensembles : ce n'est pas un cercle, mais un échelonnement. La syntaxe, qui ne manipule que des mots finis, n'exige qu'une arithmétique élémentaire des suites finies. La sémantique, elle, emploie des ensembles intuitifs. Une fois $\mathsf{ZF}$ posée sur cette base, on peut tout recoder à l'intérieur, et c'est ce que fait Gödel pour démontrer l'incomplétude.
    remarques:
      - |
        Les notions de la métathéorie recevront plus loin une définition rigoureuse dans $\mathsf{ZF}$ : applications au nœud {{rel|Relations, fonctions}}, entiers au nœud {{n|ℕ}}. Elles ne sont utilisées ici que dans leur sens intuitif, et jamais comme objets de la théorie étudiée.
      - |
        La métathéorie n'emploie aucune forme de l'axiome du choix, sauf en un endroit, signalé par ⋆ : le {{hk-lindenbaum|lemme de Lindenbaum}} pour une signature non dénombrable, où l'on admet un principe de maximalité, qui est le {{o-zorn|lemme de Zorn}} pour l'inclusion. Les théorèmes de complétude et de compacité en dépendent pour de telles signatures, et pour elles seulement.

  - id: l-connecteurs
    etiquette: Connecteurs
    nature: définition
    titre: Connecteurs et tables de vérité
    enonce: |
      Les [[connecteur|connecteurs]] primitifs sont la négation $\neg$, d'arité $1$, et l'implication $\to$, d'arité $2$. Leur sens est fixé par leurs **tables de vérité**, règles finies qui associent à chaque valeur des arguments, $1$ pour le vrai et $0$ pour le faux, la valeur du connecteur.

      Ce n'est qu'un calcul fini sur des symboles, mené dans la métathéorie ({{l-metatheorie|Cadre métathéorique}}), et aucune notion générale de fonction n'y intervient :
      $$\begin{array}{c|c} P & \neg P \\ \hline 1 & 0 \\ 0 & 1 \end{array} \qquad\qquad \begin{array}{cc|c} P & Q & P \to Q \\ \hline 1 & 1 & 1 \\ 1 & 0 & 0 \\ 0 & 1 & 1 \\ 0 & 0 & 1 \end{array}$$
      Les autres connecteurs sont des **abréviations** : $P \wedge Q$ pour $\neg(P \to \neg Q)$, $P \vee Q$ pour $\neg P \to Q$, et $P \leftrightarrow Q$ pour $(P \to Q) \wedge (Q \to P)$.

      On vérifie sur les tables que $P \wedge Q$ vaut $1$ si et seulement si $P$ et $Q$ valent $1$, que $P \vee Q$ vaut $1$ si et seulement si l'un d'eux au moins vaut $1$, et que $P \leftrightarrow Q$ vaut $1$ si et seulement si $P$ et $Q$ ont même valeur.
    remarques:
      - |
        L'implication est **matérielle** : $P \to Q$ est vraie dès que $P$ est fausse, sans aucun lien de cause entre $P$ et $Q$. L'erreur la plus répandue est d'y lire une causalité ; « si $2 + 2 = 5$, alors la Lune est un fromage » est un énoncé vrai.
      - |
        Le choix de $\neg$ et $\to$ comme seuls connecteurs primitifs n'appauvrit pas le langage : le nœud {{l-tautologies|Tautologies}} montre que toute fonction de vérité s'exprime avec eux.

  - id: l-prop-formules
    etiquette: Formules propositionnelles
    nature: définition
    enonce: |
      On se donne une suite de **lettres propositionnelles** $P_0, P_1, \dots$. Les **formules propositionnelles** forment le plus petit ensemble de mots contenant les lettres, et tel que, si $\varphi$ et $\psi$ en sont, alors $\neg\varphi$ et $\to \varphi\, \psi$ en sont aussi.
    remarques:
      - |
        On écrit les formules en notation **préfixée**, $\to \varphi\, \psi$ plutôt que $(\varphi \to \psi)$, pour démontrer simplement la lecture unique ; l'écriture usuelle, avec parenthèses, n'en est qu'une abréviation lisible.

  - id: l-syntaxe
    etiquette: Syntaxe
    nature: chapitre
    titre: Syntaxe du premier ordre
    sous: l-syntaxe
    texte: |
      Un langage du premier ordre est donné par une signature, symboles de constantes, de fonctions et de relations munis de leurs arités. Les termes et les formules sont des mots sur l'alphabet ainsi formé, définis par induction, et l'on distingue les variables libres des variables liées par les quantificateurs. Le théorème de lecture unique garantit que chaque terme et chaque formule se décompose d'une seule façon, ce qui permet de définir des fonctions sur les formules par récurrence sur leur construction.

  - id: l-tautologies
    etiquette: Tautologies
    nature: proposition
    titre: Tautologies et complétude fonctionnelle
    enonce: |
      Une **valuation booléenne** est une application $v$ des lettres propositionnelles dans $\{0, 1\}$. Elle se prolonge de manière unique en une application $\bar v$ définie sur toutes les formules propositionnelles et compatible avec les tables de vérité : $\bar v(\neg\varphi) = 1 - \bar v(\varphi)$, et $\bar v(\to \varphi\, \psi) = 0$ si et seulement si $\bar v(\varphi) = 1$ et $\bar v(\psi) = 0$.

      Une [[tautologie]] est une formule $\varphi$ telle que $\bar v(\varphi) = 1$ pour toute valuation $v$.

      **Complétude fonctionnelle.** Pour toute fonction $F : \{0,1\}^n \to \{0,1\}$, il existe une formule $\varphi$ écrite avec les lettres $P_1, \dots, P_n$ et les seuls connecteurs $\neg$ et $\to$, telle que $\bar v(\varphi) = F(v(P_1), \dots, v(P_n))$ pour toute valuation $v$.
    preuve: |
      Le prolongement $\bar v$ est bien défini par récurrence sur les formules, grâce à la lecture unique, qui garantit que chaque formule non réduite à une lettre s'écrit d'une seule façon $\neg\varphi$ ou $\to \varphi\, \psi$.

      Pour la complétude fonctionnelle, notons, pour $\varepsilon \in \{0,1\}^n$, $C_\varepsilon$ la conjonction des littéraux $P_i$ si $\varepsilon_i = 1$ et $\neg P_i$ si $\varepsilon_i = 0$ : par les tables de $\wedge$ et de $\neg$, $\bar v(C_\varepsilon) = 1$ si et seulement si $v(P_i) = \varepsilon_i$ pour tout $i$.

      Si $F$ est identiquement nulle, la formule $P_1 \wedge \neg P_1$ convient. Sinon, la disjonction des $C_\varepsilon$ pour les $\varepsilon$ tels que $F(\varepsilon) = 1$ vaut $1$ exactement aux points où $F$ vaut $1$. Comme $\wedge$ et $\vee$ sont des abréviations, cette formule s'écrit avec $\neg$ et $\to$ seuls.
    remarques:
      - |
        Savoir si une formule à $n$ lettres est une tautologie est un calcul fini : il suffit d'examiner les $2^n$ lignes de sa table. Par exemple, $\varphi \to (\psi \to \varphi)$ ne peut valoir $0$ que si $\varphi$ vaut $1$ et $\psi \to \varphi$ vaut $0$, ce qui exige $\varphi = 0$ : c'est impossible, la formule est une tautologie. Ce caractère décidable disparaît au premier ordre.

        ```schema l-tautologies
        Arbre de lecture de $\varphi \to (\psi \to \varphi)$, écrite $\to \varphi \to \psi\, \varphi$ ; chaque valeur entourée est imposée par la recherche d'une valuation qui donne $0$ à la racine, la table de $\to$ n'ayant qu'une ligne de valeur $0$. Les deux occurrences de $\varphi$ reçoivent alors $1$ et $0$, en rouge : aucune valuation ne convient.
        ```

  - id: l-substitution
    etiquette: Substitution
    nature: définition
    titre: Substitution et lemme de substitution
    enonce: |
      On note $\varphi[t/x]$ la formule obtenue en remplaçant chaque occurrence **libre** de $x$ dans $\varphi$ par le terme $t$. Le terme $t$ est **substituable** à $x$ dans $\varphi$ si aucune occurrence libre de $x$ ne se trouve dans une sous-formule $\forall y\, \psi$ où $y$ est une variable de $t$.

      **Lemme de substitution.** Si $t$ est substituable à $x$ dans $\varphi$, alors pour toute structure $\mathcal M$ et toute valuation $s$,
      $$\begin{aligned} \mathcal M &\models \varphi[t/x]\,[s] \\ \iff \mathcal M &\models \varphi\,[s(x \mid t^{\mathcal M}[s])], \end{aligned}$$
      où $s(x \mid a)$ désigne la valuation qui coïncide avec $s$ sauf en $x$, où elle vaut $a$.
    preuve: |
      Pour les termes, on vérifie par récurrence que la valeur de $u[t/x]$ sous $s$ est celle de $u$ sous $s(x \mid t^{\mathcal M}[s])$. Pour les formules, on raisonne par récurrence sur $\varphi$ ; les cas atomiques découlent du cas des termes, et les connecteurs passent directement.

      Pour $\varphi = \forall y\, \psi$ : si $x$ n'est pas libre dans $\varphi$, la substitution ne change rien et le lemme de coïncidence conclut.

      Sinon $y \neq x$, et l'hypothèse de substituabilité impose que $y$ ne figure pas dans $t$ ; ainsi $t$ a la même valeur sous $s$ et sous $s(y \mid a)$ pour tout $a$. On applique alors l'hypothèse de récurrence à $\psi$ sous chaque valuation $s(y \mid a)$, et l'on conclut en quantifiant sur $a$.
    remarques:
      - |
        La condition de substituabilité n'est pas une formalité. Dans $\varphi = \exists y\, (y \neq x)$, qui exprime « il existe un élément différent de $x$ », substituer $y$ à $x$ donne $\exists y\, (y \neq y)$, qui est toujours faux : la variable $y$ a été **capturée** par le quantificateur.

        ```schema l-substitution
        Les arcs relient chaque occurrence liée de $y$ à son quantificateur. Dans $\varphi$, l'occurrence de $x$ est libre ; après la substitution, le $y$ qui l'a remplacée tombe sous $\exists y$, et l'arc rouge montre cette capture, qui change le sens de la formule.
        ```

  - id: l-structure
    etiquette: Structures
    nature: définition
    enonce: |
      Une [[structure]] $\mathcal M$ pour la signature $\mathcal L$ est la donnée d'un ensemble **non vide** $M$, son domaine, et d'une interprétation de chaque symbole : un élément $c^{\mathcal M} \in M$ pour chaque constante, une application $f^{\mathcal M} : M^n \to M$ pour chaque symbole de fonction d'arité $n$, une partie $R^{\mathcal M} \subset M^n$ pour chaque symbole de relation d'arité $n$.

      Une **valuation** est une application $s$ de l'ensemble des variables dans $M$. La valeur $t^{\mathcal M}[s]$ d'un terme s'obtient par récurrence : $x^{\mathcal M}[s] = s(x)$, et
      $$\begin{aligned} &(f\, t_1 \cdots t_n)^{\mathcal M}[s] \\ &\quad = f^{\mathcal M}(t_1^{\mathcal M}[s], \dots, t_n^{\mathcal M}[s]). \end{aligned}$$
    remarques:
      - |
        Le domaine est non vide par convention. C'est ce qui rend valide la formule $\forall x\, \varphi \to \exists x\, \varphi$, et ce qui permet de démontrer l'existence d'un ensemble au nœud {{zf-vide|Ensemble vide}} des axiomes de $\mathsf{ZF}$.

  - id: l-satisfaction
    etiquette: Satisfaction (Tarski)
    nature: définition
    titre: Définition de la satisfaction
    enonce: |
      La relation $\mathcal M \models \varphi\,[s]$, lue « $\mathcal M$ satisfait $\varphi$ sous $s$ », est définie par récurrence sur $\varphi$ :

      $\mathcal M \models t_1 = t_2\,[s]$ si $t_1^{\mathcal M}[s] = t_2^{\mathcal M}[s]$, et $\mathcal M \models R\, t_1 \cdots t_n\,[s]$ si $(t_1^{\mathcal M}[s], \dots, t_n^{\mathcal M}[s]) \in R^{\mathcal M}$ ;

      $\mathcal M \models \neg\varphi\,[s]$ si $\mathcal M \not\models \varphi\,[s]$, et $\mathcal M \models (\varphi \to \psi)\,[s]$ si $\mathcal M \not\models \varphi\,[s]$ ou $\mathcal M \models \psi\,[s]$ ;

      $\mathcal M \models \forall x\, \varphi\,[s]$ si $\mathcal M \models \varphi\,[s(x \mid a)]$ pour tout $a \in M$.
    remarques:
      - |
        La définition est récursive, et le symbole $\forall$ du langage est interprété par le « pour tout » de la métathéorie. Elle ne dit pas ce qu'est la vérité, mais réduit la vérité d'une formule à celle de ses sous-formules ; Tarski a montré en 1933 qu'une telle définition ne peut pas être formulée dans le langage même qu'elle interprète.

  - id: l-coincidence
    etiquette: Lemme de coïncidence
    nature: lemme
    enonce: |
      Si deux valuations $s$ et $s'$ coïncident sur les variables libres de $\varphi$, alors $\mathcal M \models \varphi\,[s] \iff \mathcal M \models \varphi\,[s']$. En particulier, la satisfaction d'un énoncé ne dépend pas de la valuation : on écrit simplement $\mathcal M \models \varphi$.
    preuve: |
      Par récurrence sur les termes, la valeur d'un terme ne dépend que des valeurs de ses variables ; les cas atomiques s'en déduisent, et les connecteurs passent directement.

      Pour $\forall x\, \varphi$, les variables libres sont celles de $\varphi$ privées de $x$. Pour tout $a \in M$, les valuations $s(x \mid a)$ et $s'(x \mid a)$ coïncident donc sur les variables libres de $\varphi$, et l'hypothèse de récurrence donne
      $$\begin{aligned} \mathcal M &\models \varphi\,[s(x \mid a)] \\ \iff \mathcal M &\models \varphi\,[s'(x \mid a)]. \end{aligned}$$
      On conclut en quantifiant sur $a$.

  - id: l-consequence
    etiquette: Modèles, conséquence
    nature: définition
    enonce: |
      Soit $T$ une théorie. Un [[modele]] de $T$ est une structure qui satisfait tous les énoncés de $T$. Un énoncé $\varphi$ est [[consequence-semantique|conséquence sémantique]] de $T$, noté $T \models \varphi$, si tout modèle de $T$ satisfait $\varphi$. Il est **universellement valide** si $\varnothing \models \varphi$.

  - id: l-deduction
    etiquette: Démonstrations formelles
    nature: définition
    enonce: |
      On fixe le système de Hilbert suivant, dû à Enderton. Les **axiomes logiques** sont toutes les généralisations $\forall y_1 \cdots \forall y_k\, \alpha$ des formules $\alpha$ suivantes :

      (1) les instances de tautologies, c'est-à-dire les formules obtenues en remplaçant les lettres d'une [[tautologie]] propositionnelle par des formules du premier ordre ;

      (2) $\forall x\, \alpha \to \alpha[t/x]$, si $t$ est substituable à $x$ dans $\alpha$ ;

      (3) $\forall x\, (\alpha \to \beta) \to (\forall x\, \alpha \to \forall x\, \beta)$ ;

      (4) $\alpha \to \forall x\, \alpha$, si $x$ n'est pas libre dans $\alpha$ ;

      (5) $x = x$, et $x = y \to (\alpha \to \alpha')$, si $\alpha$ est atomique et si $\alpha'$ s'obtient en remplaçant certaines occurrences de $x$ par $y$.

      Une [[demonstration-formelle]] de $\varphi$ à partir de $T$ est une suite finie de formules, terminée par $\varphi$, dont chacune est un axiome logique, un élément de $T$, ou se déduit de deux formules précédentes $\alpha$ et $\alpha \to \beta$ par la seule règle, le **modus ponens**. On note alors $T \vdash \varphi$.
    remarques:
      - |
        Le choix de n'avoir qu'une règle, au prix d'axiomes nombreux, simplifie toutes les démonstrations sur le système, qui se font par récurrence sur la longueur des démonstrations formelles. D'autres systèmes, comme la déduction naturelle, sont plus proches du raisonnement usuel ; ils démontrent exactement les mêmes formules.

  - id: l-correction
    etiquette: Correction
    nature: théorème
    titre: Théorème de correction
    enonce: |
      Si $T \vdash \varphi$, alors $T \models \varphi$ : tout ce qui est démontrable est vrai dans tous les modèles.
    preuve: |
      Montrons, par récurrence sur la longueur d'une démonstration formelle, que chacune de ses formules est satisfaite par tout modèle $\mathcal M$ de $T$, sous toute valuation $s$.

      Les éléments de $T$ sont des énoncés satisfaits par $\mathcal M$. Les axiomes logiques sont valides : (1) par les tables de vérité ; (2) par le lemme de substitution ; (3) directement ; (4) par le lemme de coïncidence, puisque $x$ n'est pas libre dans $\alpha$ ; (5) directement.

      Une généralisation d'une formule satisfaite sous toute valuation l'est aussi. Enfin, si $\alpha$ et $\alpha \to \beta$ sont satisfaites sous $s$, alors $\beta$ l'est, par la définition de la satisfaction pour $\to$.
    remarques:
      - |
        En particulier, une théorie qui a un modèle est cohérente : sinon elle démontrerait $\varphi$ et $\neg\varphi$, qui seraient toutes deux vraies dans ce modèle. C'est la seule méthode générale pour prouver la cohérence d'une théorie, et elle déplace la question vers la cohérence de la théorie où l'on construit le modèle.

  - id: l-thm-deduction
    etiquette: Théorème de la déduction
    nature: théorème
    enonce: |
      Si $T \cup \{\psi\} \vdash \varphi$, alors $T \vdash \psi \to \varphi$.
    preuve: |
      Par récurrence sur une démonstration de $\varphi$ à partir de $T \cup \{\psi\}$, montrons que $T \vdash \psi \to \alpha$ pour chacune de ses formules $\alpha$.

      Si $\alpha$ est un axiome logique ou un élément de $T$, on a $T \vdash \alpha$, et $\alpha \to (\psi \to \alpha)$ est une tautologie : le modus ponens donne $T \vdash \psi \to \alpha$. Si $\alpha = \psi$, alors $\psi \to \psi$ est une tautologie.

      Si $\alpha$ s'obtient par modus ponens à partir de $\beta$ et $\beta \to \alpha$, on a par hypothèse $T \vdash \psi \to \beta$ et $T \vdash \psi \to (\beta \to \alpha)$. La tautologie
      $$\begin{aligned} &(\psi \to (\beta \to \alpha)) \\ &\to ((\psi \to \beta) \to (\psi \to \alpha)) \end{aligned}$$
      et deux modus ponens donnent $T \vdash \psi \to \alpha$.
    remarques:
      - |
        Dans un système muni d'une règle de généralisation, ce théorème n'est vrai que si $\psi$ est un énoncé, ou sous une restriction sur l'usage de la généralisation : de $x = 0$ on déduirait $\forall x\, (x = 0)$, mais $x = 0 \to \forall x\, (x = 0)$ n'est pas valide. Le système choisi ici évite cette difficulté.

  - id: l-coherence
    etiquette: Cohérence
    nature: proposition
    enonce: |
      Une théorie $T$ est [[theorie-coherente|cohérente]] s'il n'existe pas de formule $\varphi$ telle que $T \vdash \varphi$ et $T \vdash \neg\varphi$. Alors :

      (i) $T$ est incohérente si et seulement si elle démontre toutes les formules ;

      (ii) si $T \nvdash \varphi$, la théorie $T \cup \{\neg\varphi\}$ est cohérente.
    preuve: |
      (i) Si $T \vdash \varphi$ et $T \vdash \neg\varphi$, la tautologie $\neg\varphi \to (\varphi \to \chi)$ et deux modus ponens donnent $T \vdash \chi$ pour toute formule $\chi$. La réciproque est claire.

      (ii) Si $T \cup \{\neg\varphi\}$ était incohérente, elle démontrerait $\varphi$ par (i). Le théorème de la déduction donnerait $T \vdash \neg\varphi \to \varphi$, et la tautologie $(\neg\varphi \to \varphi) \to \varphi$ donnerait $T \vdash \varphi$, ce qui est exclu.

  - id: l-completude
    etiquette: Complétude (Gödel)
    nature: chapitre
    titre: Théorème de complétude
    sous: l-completude
    choix: |
      Pour une signature finie ou dénombrable, la démonstration n'emploie aucune forme du choix : on énumère les énoncés au lieu de les choisir. Pour une signature quelconque, elle emploie un principe de maximalité, le [[lemme-zorn|lemme de Zorn]] pour l'inclusion, et le théorème équivaut, dans $\mathsf{ZF}$, au lemme de l'[[ultrafiltre]] ({{o-ultrafiltre|Lemme de l'ultrafiltre}}) (sous la forme « toute théorie cohérente a un modèle »).
    texte: |
      Toute [[theorie-coherente|théorie cohérente]] a un [[modele|modèle]] ; de façon équivalente, un énoncé vrai dans tous les modèles d'une théorie y est démontrable.

      La démonstration est celle de Henkin. On ajoute au langage des constantes témoins, étage par étage, avec les axiomes
      $$\exists x\, \varphi \to \varphi[c/x],$$
      sans perdre la cohérence ; on prolonge la théorie en une théorie cohérente qui contient chaque énoncé ou sa négation (lemme de Lindenbaum).

      On construit le modèle dont les éléments sont les classes de [[terme-clos|termes clos]] pour l'égalité démontrable, et l'on vérifie, par récurrence sur les énoncés, qu'il satisfait exactement ceux de la théorie.
    remarques:
      - |
        Ce théorème relie deux notions de natures différentes : l'une, syntaxique, porte sur des suites finies de symboles ; l'autre, sémantique, sur tous les modèles possibles, collection immense. Il ne dit pas que tout énoncé vrai est démontrable, ce que l'incomplétude contredit, mais que tout énoncé vrai dans **tous** les modèles de $T$ l'est.

  - id: l-compacite
    etiquette: Compacité
    nature: théorème
    titre: Théorème de compacité
    choix: |
      Pour des langages quelconques, le théorème de compacité équivaut au lemme de l'[[ultrafiltre]] ({{o-ultrafiltre|Lemme de l'ultrafiltre}}). Pour une signature finie ou dénombrable, la démonstration n'emploie aucune forme du choix, puisque celle du {{hk-existence|théorème de complétude}} n'en emploie pas.
    enonce: |
      Une théorie a un modèle si et seulement si chacune de ses parties finies a un modèle.
    preuve: |
      Une partie finie d'une théorie qui a un modèle en a un. Réciproquement, supposons que chaque partie finie de $T$ ait un modèle ; par le théorème de correction, chacune est cohérente. Si $T$ était incohérente, une démonstration formelle d'une contradiction à partir de $T$ n'utiliserait qu'un nombre fini d'éléments de $T$, formant une partie finie incohérente. Donc $T$ est cohérente, et elle a un modèle par le {{hk-existence|théorème de complétude}}.
    remarques:
      - |
        Le nom vient de la topologie : l'espace des théories complètes, muni d'une topologie naturelle, est compact, et le théorème en est la traduction. Dans $\mathsf{ZF}$, il équivaut d'ailleurs au lemme de l'ultrafiltre, tout comme le {{t-tychonov|théorème de Tychonov}} pour les compacts séparés.

  - id: l-lowenheim
    etiquette: Löwenheim-Skolem
    nature: théorème
    titre: Théorème de Löwenheim-Skolem descendant
    enonce: |
      Toute théorie cohérente dans un langage dénombrable, au sens de la métathéorie, a un modèle fini ou dénombrable.
    preuve: |
      Soit $T$ une théorie cohérente sur une signature $\mathcal L$ finie ou dénombrable. Reprenons la démonstration du {{hk-existence|théorème de complétude}} en lisant la taille du modèle construit.

      Par le point (iii) de l'{{hk-temoins|extension par témoins}}, les mots sur l'alphabet de la signature $\mathcal L^+$ sont énumérés explicitement ; en particulier, ses énoncés forment une suite $\sigma_0, \sigma_1, \dots$, et ses termes clos une suite $t_0, t_1, \dots$. Le prolongement $\widehat T$ de $T \cup H$ s'obtient donc par le cas dénombrable (i) du {{hk-lindenbaum|lemme de Lindenbaum}}, sans aucun choix.

      Le domaine du {{hk-modele|modèle des termes clos}} de $\widehat T$ est $M = \{[t] : t \in K\}$, où $K$ est l'ensemble des termes clos de $\mathcal L^+$ : tout élément de $M$ est la classe d'un terme clos.

      Associons à chaque $a \in M$ le plus petit entier $n$ tel que $[t_n] = a$ : c'est une application injective de $M$ dans l'ensemble des entiers, puisque l'entier $n$ associé à $a$ détermine $a = [t_n]$. Son image est un ensemble d'entiers, fini ou rangé en une suite strictement croissante ; $M$ est donc fini ou dénombrable.

      La structure pour $\mathcal L$ obtenue en oubliant les nouvelles constantes a le même domaine, et c'est un modèle de $T$. Dans toute cette démonstration, rien n'est choisi.
    remarques:
      - |
        Le modèle obtenu peut être fini : si $T$ contient $\forall x\, \forall y\, (x = y)$, tous les termes clos sont dans la même classe, et $M$ n'a qu'un élément.

        Pour obtenir un modèle infini et dénombrable d'une théorie $T$ qui a un modèle infini, on applique le théorème à $T$ augmentée, pour chaque $n$, de l'énoncé qui affirme l'existence d'au moins $n$ éléments distincts : cette théorie a un modèle, le modèle infini de $T$, donc elle est cohérente par la correction, et chacun de ses modèles est infini.
      - |
        D'où le **paradoxe de Skolem** : si $\mathsf{ZFC}$ est cohérente, elle a un modèle dénombrable, bien qu'elle démontre l'existence d'ensembles non dénombrables comme $\mathbb R$. Il n'y a pas de contradiction : dans ce modèle, l'ensemble qui joue le rôle de $\mathbb R$ est dénombrable vu de l'extérieur, mais aucune bijection avec $\mathbb N$ n'appartient au modèle.
      - |
        La démonstration qui précède n'emploie aucune forme de l'axiome du choix, que le nœud {{zf-choix|Axiome du choix}} posera. La forme générale, qui fournit pour toute structure sur un langage dénombrable une sous-structure élémentaire dénombrable, équivaut au choix dépendant.

  - id: l-non-standard
    etiquette: Modèles non standard
    nature: corollaire
    titre: Modèles non standard de l'arithmétique
    enonce: |
      Soit $\mathrm{Th}(\mathbb N)$ l'ensemble des énoncés du langage $\{0, S, +, \times\}$ vrais dans $\mathbb N$. Il existe un modèle de $\mathrm{Th}(\mathbb N)$ qui n'est pas isomorphe à $\mathbb N$.
    preuve: |
      Pour $n \in \mathbb N$, notons $\underline n$ le terme $S \cdots S\, 0$, avec $n$ occurrences de $S$, dont la valeur dans $\mathbb N$ est $n$. Ajoutons une constante $c$ et considérons
      $$T = \mathrm{Th}(\mathbb N) \cup \{c \neq \underline n : n \in \mathbb N\}.$$
      Une partie finie de $T$ ne mentionne qu'un nombre fini d'énoncés $c \neq \underline n$ ; en interprétant $c$ dans $\mathbb N$ par un entier plus grand que tous les $n$ concernés, on obtient un modèle. Par compacité, $T$ a un modèle $\mathcal M$.

      Dans $\mathbb N$, tout élément est la valeur d'un terme $\underline n$. Un isomorphisme $h : \mathbb N \to \mathcal M$ enverrait la valeur de $\underline n$ sur celle de $\underline n$ dans $\mathcal M$, et serait donc à valeurs dans l'ensemble de ces valeurs, qui ne contient pas $c^{\mathcal M}$. Il ne serait pas surjectif : $\mathcal M$ n'est pas isomorphe à $\mathbb N$.
    remarques:
      - |
        Aucun ensemble d'énoncés du premier ordre ne caractérise donc $\mathbb N$ à isomorphisme près, contrairement aux axiomes de Peano du second ordre, comme le signale le nœud {{n-peano|Axiomes de Peano}}. La récurrence au premier ordre, qui est un schéma portant sur les seules propriétés définissables, est trop faible pour exclure les éléments infiniment grands.

  - id: l-incompletude
    etiquette: Incomplétude (Gödel)
    nature: théorème
    titre: Théorèmes d'incomplétude
    enonce: |
      Soit $T$ une théorie cohérente, dont l'ensemble des axiomes est récursivement énumérable, et qui contient l'arithmétique de Robinson.

      (i) Il existe un énoncé $G$ tel que $T \nvdash G$ et $T \nvdash \neg G$ (Gödel, 1931 ; Rosser, 1936, pour l'hypothèse de simple cohérence).

      (ii) Si $T$ contient de plus l'arithmétique de Peano, elle ne démontre pas l'énoncé $\mathrm{Coh}(T)$ qui exprime sa propre cohérence.
    preuve: |
      *Admis ici.* On code les formules et les démonstrations par des entiers, de sorte que « $n$ est le code d'une démonstration de la formule de code $m$ » s'exprime par une formule de l'arithmétique. Le lemme diagonal fournit alors un énoncé $G$ équivalent, dans $T$, à « $G$ n'est pas démontrable dans $T$ ». La difficulté contournée est l'arithmétisation, qui demande de représenter dans $T$ toutes les fonctions récursives.
    remarques:
      - |
        Le théorème s'applique à $\mathsf{ZFC}$ : si elle est cohérente, elle ne démontre pas sa propre cohérence, et l'on ne peut pas prouver la solidité de l'édifice tout entier avec ses seuls outils. Il ne contredit pas la complétude : $G$ est vrai dans certains modèles de $T$ et faux dans d'autres.

