# Niveau 1 : structure interne du nœud « Géométrie différentielle ».
# On construit d'abord le calcul différentiel dans ℝⁿ (différentielle, classe Cᵏ, inversion
# locale, submersions), puis les sous-variétés de ℝⁿ, et enfin les variétés abstraites, leurs
# espaces tangents et le fibré tangent. Les normes, leur équivalence en dimension finie et le
# point fixe de Banach sont au graphe « Espaces métriques et normés » (met), parent de celui-ci.
# L'inversion des matrices est C^∞ par la formule de la comatrice (déterminant, construit
# dans l'algèbre linéaire) ; la série de Neumann fournit la forme quantitative utilisée
# par l'inversion locale.
# Les fonctions trigonométriques et l'exponentielle (analyse complexe) ne sont pas des
# ancêtres de ce nœud : les exemples sont polynomiaux ou rationnels.

graphe: geod
titre: Géométrie différentielle
conteneur: geod

entrees:
  met: [gd-denombrable, gd-differentielle, gd-inversion-locale]
  analyse-reelle: [gd-accroissements]
  alglin: [gd-formes]

noeuds:
  - id: gd-denombrable
    etiquette: Base dénombrable de ℝⁿ
    nature: proposition
    titre: ℝⁿ a une base au plus dénombrable
    enonce: |
      Les boules $B_\infty(c, r)$, pour $c \in \lex{n-uplet}{\mathbb Q^n}$ et $r \in \lex{ensemble-rationnels}{\mathbb Q}$, $r > 0$, forment une base au plus [[denombrable]] de la topologie de $\mathbb R^n$. Toute partie de $\mathbb R^n$, munie de la topologie induite, a une base au plus dénombrable.
    preuve: |
      L'ensemble d'indices $\mathbb Q^n \times \mathbb Q$ est dénombrable ({{q-denombrable|ℚ est dénombrable}}). Soit $O$ ouvert et $x \in O$ : il existe $\varepsilon > 0$ tel que $B_\infty(x, \varepsilon) \subset O$. Par densité de $\mathbb Q$ ({{ar-archimede|Archimède, densité de ℚ}}), il existe un rationnel $r \in \,]0, \varepsilon/2[$, puis des rationnels $c_i \in \,]x_i - r, x_i + r[$. Alors $x \in B_\infty(c, r)$, et pour $z \in B_\infty(c, r)$, $\|z - x\|_\infty < 2r < \varepsilon$, donc $B_\infty(c, r) \subset O$. Ainsi $O$ est la réunion des boules de la famille qu'il contient. Pour $A \subset \mathbb R^n$, les traces $B \cap A$ de ces boules forment une base de la topologie induite, puisque tout ouvert de $A$ est de la forme $O \cap A$.
    remarques:
      - |
        Aucun choix n'intervient : l'ouvert $O$ est décrit comme la réunion de **toutes** les boules rationnelles qu'il contient, sans qu'on ait à en sélectionner une par point.
      - |
        L'existence d'une base au plus dénombrable sera exigée des variétés ({{gd-varietes|Variétés différentiables}}). Elle exclut des objets localement semblables à $\lex{ensemble-reels}{\mathbb R}$ mais « trop longs », comme la droite longue, obtenue en recollant $\omega_1$ copies de $[0, 1[$.

  - id: gd-differentielle
    etiquette: Différentielle
    nature: définition
    titre: Applications différentiables
    texte: |
      Soit $U$ un ouvert de $\lex{n-uplet}{\mathbb R^n}$, $f : U \to \mathbb R^p$ et $a \in U$. L'application $f$ est [[differentiable]] en $a$ s'il existe $u \in \lex{espace-applications-lineaires}{\mathcal L}(\mathbb R^n, \mathbb R^p)$ et une application $\varepsilon$, définie au voisinage de $0$, nulle et continue en $0$, telles que
      $$f(a + h) = f(a) + u(h) + \|h\|\, \varepsilon(h).$$
      Grâce à l'équivalence des normes, cette condition ne dépend pas des normes choisies. On note $u = df(a)$, la **différentielle** de $f$ en $a$. La **dérivée partielle** $\partial_j f(a)$ est, si elle existe, la limite de $\big(f(a + te_j) - f(a)\big)/t$ quand $t \to 0$, et la **matrice jacobienne** $J_f(a)$ est la matrice $p \times n$ de coefficients $\partial_j f_i(a)$.
    enonce: |
      (i) Si elle existe, la différentielle est unique, et $f$ est continue en $a$.

      (ii) $f$ est différentiable en $a$ si et seulement si chacune de ses composantes $f_i$ l'est. Les dérivées partielles existent alors, et $df(a)$ a pour matrice $J_f(a)$ : $df(a)(h) = \sum_j h_j\, \partial_j f(a)$. Pour $n = 1$, $f$ est différentiable en $a$ si et seulement si ses composantes sont [[derivable|dérivables]] en $a$, et $df(a)(h) = h f'(a)$.

      (iii) Une application linéaire $u$ est différentiable partout, avec $du(a) = u$. Une application bilinéaire $B : \mathbb R^n \times \mathbb R^m \to \mathbb R^p$ l'est aussi, avec $dB(x, y)(h, k) = B(h, y) + B(x, k)$. La différentielle d'une somme est la somme des différentielles.

      (iv) *Règle de la chaîne.* Si $f$ est différentiable en $a$, à valeurs dans un ouvert $V$ de $\mathbb R^p$, et si $g : V \to \mathbb R^q$ est différentiable en $f(a)$, alors $g \circ f$ est différentiable en $a$ et
      $$d(g \circ f)(a) = dg(f(a)) \circ df(a),$$
      ce qui s'écrit matriciellement $J_{g \circ f}(a) = J_g(f(a))\, J_f(a)$.
    preuve: |
      (i) Si $u$ et $u'$ conviennent, $(u - u')(h) = \|h\|\,\eta(h)$ avec $\eta$ de limite nulle en $0$. Pour $h$ fixé non nul et $t > 0$ petit, la linéarité donne $t\,(u - u')(h) = t\|h\|\,\eta(th)$, donc $(u - u')(h) = \|h\|\,\eta(th)$, qui tend vers $0$ quand $t \to 0$ : $u = u'$. Ensuite $\|f(a + h) - f(a)\| \leqslant \big(|||u||| + \|\varepsilon(h)\|\big)\|h\|$ tend vers $0$.

      (ii) Avec $\|\cdot\|_\infty$ sur $\mathbb R^p$, la condition de différentiabilité pour $f$ équivaut à la conjonction des conditions pour ses $p$ composantes. Si $f$ est différentiable, prenons $h = te_j$ : $\big(f(a + te_j) - f(a)\big)/t = u(e_j) + \frac{|t|}{t}\|e_j\|\,\varepsilon(te_j)$, qui tend vers $u(e_j)$ ; la $j$-ième colonne de la matrice de $u$ est donc $\partial_j f(a)$. Pour $n = 1$, la condition s'écrit $\big(f(a + h) - f(a)\big)/h - v = \pm\varepsilon(h)$ avec $v = u(1)$, c'est-à-dire que le taux d'accroissement tend vers $v$.

      (iii) Pour $u$ linéaire, $\varepsilon = 0$ convient. Pour $B$ bilinéaire, $B(x + h, y + k) - B(x, y) - B(h, y) - B(x, k) = B(h, k)$, et, en développant sur les bases, $\|B(h, k)\| \leqslant C\,\|h\|_\infty \|k\|_\infty \leqslant C\,\|(h, k)\|_\infty^2$ avec $C = \sum_{i,j}\|B(e_i, e_j)\|$, ce qui est de la forme $\|(h, k)\|_\infty\,\varepsilon(h, k)$. L'énoncé sur les sommes est immédiat.

      (iv) Posons $b = f(a)$, $u = df(a)$, $w = dg(b)$, et $k = f(a + h) - b = u(h) + \|h\|\,\varepsilon(h)$. Alors
      $$\begin{aligned} &g(f(a + h)) - g(b) - w(u(h)) \\ &\quad = \|h\|\, w(\varepsilon(h)) + \|k\|\,\eta(k), \end{aligned}$$
      où $\eta$ est l'application associée à $g$ en $b$. On a $\|k\| \leqslant \big(|||u||| + \|\varepsilon(h)\|\big)\|h\|$, et $k \to 0$ quand $h \to 0$, donc $\eta(k) \to 0$. Les deux termes sont de la forme $\|h\|$ fois une quantité qui tend vers $0$.
    remarques:
      - |
        L'erreur la plus répandue est de croire que l'existence des dérivées partielles entraîne la différentiabilité. La fonction $f(x, y) = xy/(x^2 + y^2)$, prolongée par $f(0, 0) = 0$, a des dérivées partielles nulles en $(0, 0)$, puisqu'elle est nulle sur les deux axes ; pourtant $f(t, t) = 1/2$ pour tout $t \neq 0$, si bien que $f$ n'est même pas continue en $(0, 0)$.

        ```schema gd-differentielle
        Sur la droite $y = mx$ privée de l'origine, $f$ vaut constamment $m/(1 + m^2)$ : ce sont les valeurs inscrites au bout des droites, positives en rouge, négatives en bleu. Les axes, en gris, portent la valeur $0$, d'où les dérivées partielles nulles en $(0, 0)$ ; mais les valeurs $1/2$ et $-1/2$ sont prises arbitrairement près de l'origine, cerclée, où $f$ vaut $0$, ce qui interdit la continuité.
        ```
      - |
        Le point (ii) relie la différentielle à la dérivée du nœud {{ar-deriv|Dérivabilité}} : en dimension $1$, la différentielle est l'application linéaire $h \mapsto h f'(a)$, et la dérivée est sa matrice $1 \times 1$.

  - id: gd-accroissements
    etiquette: Accroissements finis
    nature: théorème
    titre: Inégalité des accroissements finis
    enonce: |
      (i) *Égalité des accroissements finis.* Si $f : [a, b] \to \lex{ensemble-reels}{\mathbb R}$ est continue, dérivable sur $]a, b[$, et $a < b$, il existe $c \in \,]a, b[$ tel que $f(b) - f(a) = f'(c)(b - a)$.

      (ii) *Inégalité.* Soit $U$ un ouvert convexe de $\lex{n-uplet}{\mathbb R^n}$, muni d'une norme, et $f : U \to \mathbb R^p$ différentiable, $\mathbb R^p$ étant muni de $\|\cdot\|_\infty$. Si $|||df(z)||| \leqslant M$ pour tout $z \in U$, alors $\|f(y) - f(x)\|_\infty \leqslant M\, \|y - x\|$ pour tous $x, y \in U$.

      (iii) Si $U$ est un ouvert [[connexe]] et si $df(z) = 0$ pour tout $z \in U$, alors $f$ est constante.
    preuve: |
      (i) C'est le théorème {{de-taf|Égalité des accroissements finis}} du chapitre {{ar-deriv|Dérivabilité}}, rappelé ici parce que (ii) l'applique coordonnée par coordonnée.

      (ii) Soient $x, y \in U$ et $i$ fixé. L'ensemble des $t$ tels que $x + t(y - x) \in U$ est un ouvert de $\mathbb R$ contenant $[0, 1]$, par convexité. Sur cet ouvert, $\varphi(t) = f_i\big(x + t(y - x)\big)$ est dérivable, de dérivée $df_i(x + t(y - x))(y - x)$, par la règle de la chaîne ({{gd-differentielle|Différentielle}}, (ii) et (iv)). Par (i), il existe $c$ tel que $f_i(y) - f_i(x) = df_i(z)(y - x)$, avec $z = x + c(y - x)$. Ce nombre est la $i$-ième coordonnée de $df(z)(y - x)$, donc $|f_i(y) - f_i(x)| \leqslant \|df(z)(y - x)\|_\infty \leqslant M\|y - x\|$. On prend le maximum sur $i$.

      (iii) Fixons $a \in U$ et $A = \{x \in U : f(x) = f(a)\}$, qui est non vide. $A$ est fermé dans $U$, comme image réciproque d'un singleton, fermé dans l'espace séparé $\mathbb R^p$, par l'application continue $f$. Tout point $x$ de $U$ est le centre d'une boule $B(x, r) \subset U$, qui est convexe par l'inégalité triangulaire ; par (ii) avec $M = 0$, $f$ est constante sur cette boule. Donc $A$ et $U \setminus A$ sont ouverts, et la connexité de $U$ donne $A = U$.
    remarques:
      - |
        L'erreur la plus répandue est d'écrire une **égalité** des accroissements finis pour une fonction à valeurs vectorielles. Pour $f(t) = (t^2, t^3)$ sur $[0, 1]$, il faudrait $c$ tel que $(1, 1) = (2c, 3c^2)$ ; la première coordonnée impose $c = 1/2$, la seconde $c = 1/\sqrt 3$. Chaque coordonnée a son propre point $c$, et seule l'inégalité survit.

  - id: gd-classe-ck
    etiquette: Classe Cᵏ
    nature: théorème
    titre: Fonctions de classe Cᵏ
    texte: |
      Soit $U$ un ouvert de $\lex{n-uplet}{\mathbb R^n}$. Une application $f : U \to \mathbb R^p$ est [[classe-ck|de classe $C^1$]] si elle est différentiable en tout point et si $df : U \to \lex{espace-applications-lineaires}{\mathcal L}(\mathbb R^n, \mathbb R^p)$ est continue, cet espace étant muni de sa topologie d'espace de dimension finie. Par récurrence, $f$ est de classe $C^{k+1}$ si elle est de classe $C^1$ et si $df$, vue comme application à valeurs dans $\mathbb R^{pn}$, est de classe $C^k$ ; elle est de classe $C^\infty$ si elle est de classe $C^k$ pour tout $k$. La classe $C^0$ est celle des applications continues.
    enonce: |
      (i) $f$ est de classe $C^1$ si et seulement si toutes les dérivées partielles $\partial_j f_i$ existent et sont continues sur $U$.

      (ii) Les applications linéaires et bilinéaires sont de classe $C^\infty$. Une application est de classe $C^k$ si et seulement si ses composantes le sont, et une somme d'applications de classe $C^k$ l'est.

      (iii) Pour $k \in \lex{ensemble-entiers-naturels}{\mathbb N} \cup \{\infty\}$, la composée de deux applications de classe $C^k$ est de classe $C^k$. En particulier, les produits de fonctions réelles de classe $C^k$ et les fonctions polynomiales de $n$ variables sont de classe $C^k$, respectivement $C^\infty$.
    preuve: |
      (i) Si $f$ est de classe $C^1$, $\partial_j f(x) = df(x)(e_j)$ est continue en $x$, comme composée de $df$ et de l'évaluation en $e_j$, qui est linéaire. Réciproquement, il suffit de traiter le cas $p = 1$ ({{gd-differentielle|Différentielle}}, (ii)). Soit $a \in U$, $r > 0$ tel que $B_\infty(a, r) \subset U$, et $h$ tel que $\|h\|_\infty < r$. Posons $a^{(0)} = a$ et $a^{(j)} = a + h_1e_1 + \cdots + h_je_j$, points du cube $B_\infty(a, r)$. La fonction $t \mapsto f(a^{(j-1)} + te_j)$ a pour dérivée $\partial_j f(a^{(j-1)} + te_j)$ ; l'égalité des accroissements finis ({{gd-accroissements|Accroissements finis}}, (i)) donne un point $c_j$ du segment $[a^{(j-1)}, a^{(j)}]$ tel que $f(a^{(j)}) - f(a^{(j-1)}) = h_j\,\partial_j f(c_j)$, ce qui vaut encore si $h_j = 0$.

      ```schema gd-classe-ck
      Pour $n = 2$, le chemin de $a$ à $a + h$ suit les axes, d'abord $h_1e_1$ puis $h_2e_2$, sans emprunter la diagonale en pointillé, et reste dans le cube $B_\infty(a, r)$. Les points $c_1$ et $c_2$, placés ici pour $f(x, y) = x^3 + y^3$, $a = 0$ et $h = (1, 3/4)$, sont ceux que fournissent les accroissements finis sur chacun des deux pas ; ils sont à distance au plus $\|h\|_\infty$ de $a$.
      ```

      En sommant,
      $$\Big|f(a + h) - f(a) - \sum_j h_j\,\partial_j f(a)\Big| \leqslant \|h\|_\infty\, \rho(h),$$
      où $\rho(h) = \sum_j \big|\partial_j f(c_j) - \partial_j f(a)\big|$ tend vers $0$ avec $h$, puisque $\|c_j - a\|_\infty \leqslant \|h\|_\infty$ et que les dérivées partielles sont continues en $a$. Donc $f$ est différentiable en $a$, et $df$ est continue puisque les coefficients de sa matrice le sont.

      (ii) Une application linéaire a une différentielle constante, donc de classe $C^\infty$. Pour $B$ bilinéaire, $dB(x, y)$ dépend linéairement de $(x, y)$ ({{gd-differentielle|Différentielle}}, (iii)) : $dB$ est linéaire, donc $C^\infty$, et $B$ aussi. La matrice de $df$ a pour lignes celles des $df_i$, et $d(f + g) = df + dg$ ; on conclut par récurrence sur $k$.

      (iii) Montrons par récurrence sur $k \in \mathbb N$ l'énoncé : pour toutes $f : U \to V$ et $g : V \to \mathbb R^q$ de classe $C^k$, $g \circ f$ est de classe $C^k$. Pour $k = 0$, c'est la continuité d'une composée. Supposons-le pour $k$, et soient $f, g$ de classe $C^{k+1}$. Par la règle de la chaîne,
      $$d(g \circ f)(x) = c\big(dg(f(x)),\, df(x)\big),$$
      où $c(A, B) = AB$ est le produit matriciel, bilinéaire donc $C^\infty$. Par hypothèse de récurrence, $dg \circ f$ est de classe $C^k$, puis $x \mapsto \big(dg(f(x)), df(x)\big)$ l'est par (ii), et sa composée avec $c$ aussi. Donc $d(g \circ f)$ est de classe $C^k$, et $g \circ f$ de classe $C^{k+1}$. Le cas $k = \infty$ s'en déduit. Le produit de $f$ et $g$ réelles est la composée de $x \mapsto (f(x), g(x))$ et de la multiplication, bilinéaire ; les polynômes s'obtiennent à partir des projections, linéaires, par sommes et produits.
    remarques:
      - |
        Dans (i), la continuité des dérivées partielles ne peut pas être omise : l'exemple $xy/(x^2 + y^2)$ du nœud {{gd-differentielle|Différentielle}} a des dérivées partielles en tout point, sans même être continu à l'origine.
      - |
        La classe $C^\infty$ est celle qu'adopteront les variétés. On pourrait travailler en classe $C^k$ avec $k \geqslant 1$ fixé ; Whitney a montré en 1936 que toute variété de classe $C^k$, $k \geqslant 1$, porte une structure $C^\infty$ compatible, de sorte que le choix de $C^\infty$ ne restreint pas la théorie.

  - id: gd-gl
    etiquette: Groupe linéaire
    nature: proposition
    titre: Le groupe linéaire et l'inversion des matrices
    texte: |
      Une matrice $A \in \lex{espace-matrices}{\mathcal M_n}(\lex{ensemble-reels}{\mathbb R})$ est inversible s'il existe $B$ telle que $AB = BA = I_n$ ; c'est le cas si et seulement si l'endomorphisme $x \mapsto Ax$ est bijectif, c'est-à-dire si et seulement si $\det A \neq 0$ ({{v-determinant|Déterminant}}, (ii) et (iii)). Les matrices inversibles forment un groupe pour le produit, le [[groupe-lineaire|groupe linéaire]] $\lex{groupe-lineaire}{GL_n}(\mathbb R)$. On munit $\mathcal M_n(\mathbb R) \cong \lex{espace-applications-lineaires}{\mathcal L}(\lex{n-uplet}{\mathbb R^n})$ de la norme subordonnée $|||\cdot|||$ à une norme de $\mathbb R^n$.
    enonce: |
      (i) *Série de Neumann.* Si $|||H||| < 1$, la série $\sum_{m \geqslant 0} H^m$ converge, $I - H$ est inversible, d'inverse sa somme, et $|||(I - H)^{-1}||| \leqslant \dfrac{1}{1 - |||H|||}$.

      (ii) $GL_n(\mathbb R)$ est un ouvert de $\mathcal M_n(\mathbb R)$.

      (iii) L'application $\mathrm{inv} : A \mapsto A^{-1}$ est de classe $C^\infty$ sur $GL_n(\mathbb R)$, et
      $$d\,\mathrm{inv}(A)(H) = -A^{-1} H A^{-1}.$$
    preuve: |
      (i) Soit $S_m = \sum_{j=0}^m H^j$. Pour $q > m$, $|||S_q - S_m||| \leqslant \sum_{j=m+1}^q |||H|||^j \leqslant \frac{|||H|||^{m+1}}{1 - |||H|||}$, qui tend vers $0$ ; la suite $(S_m)$ est de Cauchy, donc converge vers une matrice $S$, l'espace $\mathcal M_n(\mathbb R)$ étant complet ({{gd-equivalence|Équivalence des normes}}). On a $(I - H)S_m = S_m(I - H) = I - H^{m+1}$, qui tend vers $I$ ; la multiplication par une matrice fixée étant linéaire, donc continue, $(I - H)S = S(I - H) = I$. Enfin $|||S_m||| \leqslant 1/(1 - |||H|||)$ pour tout $m$, et l'inégalité passe à la limite.

      (ii) Le déterminant est une fonction polynomiale des $n^2$ coefficients, donc continue ({{gd-classe-ck|Classe Cᵏ}}, (iii)), et $GL_n(\mathbb R)$ est l'image réciproque par $\det$ de l'ouvert $\mathbb R \setminus \{0\}$.

      (iii) La fonction $r(t) = 1/t$ est dérivable sur $\mathbb R \setminus \{0\}$, de dérivée $-r^2$, puisque son taux d'accroissement $-1/\big(t(t + h)\big)$ tend vers $-1/t^2$. Si $r$ est de classe $C^k$, sa dérivée $-r^2$ l'est aussi, comme produit, donc $r$ est de classe $C^{k+1}$ : $r$ est $C^\infty$. Par la formule de la comatrice ({{v-determinant|Déterminant}}, (iv)), le coefficient $(i, j)$ de $A^{-1}$ est $r(\det A)\, C_{ji}(A)$, produit de deux fonctions $C^\infty$ de $A$, le cofacteur étant polynomial : $\mathrm{inv}$ est de classe $C^\infty$. Enfin $A \cdot \mathrm{inv}(A) = I$ est constante sur $GL_n(\mathbb R)$ ; en différentiant ce produit, qui est bilinéaire ({{gd-differentielle|Différentielle}}, (iii) et (iv)), on obtient $H A^{-1} + A\, d\,\mathrm{inv}(A)(H) = 0$, d'où la formule.
    remarques:
      - |
        Pour $n = 1$, la formule redonne la dérivée $-h/a^2$ de $x \mapsto 1/x$. L'erreur la plus répandue est d'écrire $-A^{-2}H$ : le produit des matrices n'étant pas commutatif, $H$ reste pris entre les deux facteurs $A^{-1}$.
      - |
        La série de Neumann donne davantage que le déterminant : un rayon explicite. Si $A$ est inversible et $|||H||| < 1/|||A^{-1}|||$, alors $A + H = A(I + A^{-1}H)$ est inversible par (i). C'est cette forme quantitative qu'emploie l'inversion locale, et elle vaut en dimension infinie, dans les espaces de Banach, où le déterminant n'a plus de sens.

  - id: gd-inversion-locale
    etiquette: Inversion locale
    nature: théorème
    titre: Théorème d'inversion locale
    texte: |
      Soient $U$ et $V$ deux ouverts de $\lex{n-uplet}{\mathbb R^n}$ et $k \geqslant 1$, éventuellement infini. Un [[diffeomorphisme|$C^k$-difféomorphisme]] de $U$ sur $V$ est une bijection $f : U \to V$ de classe $C^k$ dont la réciproque est de classe $C^k$.
    enonce: |
      Soit $U$ un ouvert de $\mathbb R^n$, $f : U \to \mathbb R^n$ de classe $C^k$ avec $k \geqslant 1$, et $a \in U$ tel que $df(a)$ soit inversible. Il existe un ouvert $V \subset U$ contenant $a$ et un ouvert $W$ contenant $f(a)$ tels que $f$ induise un $C^k$-difféomorphisme de $V$ sur $W$. De plus, $d(f^{-1})(y) = df\big(f^{-1}(y)\big)^{-1}$ pour $y \in W$.
    preuve: |
      *Réduction.* Soit $L = df(a)$. L'application $\tilde f(x) = L^{-1}\big(f(a + x) - f(a)\big)$ est de classe $C^k$ sur $U - a$, avec $\tilde f(0) = 0$ et $d\tilde f(0) = I$, et $f$ s'en déduit par composition avec les difféomorphismes affines $x \mapsto x - a$ et $y \mapsto f(a) + Ly$. On suppose donc $a = 0$, $f(0) = 0$, $df(0) = I$, et l'on munit $\mathbb R^n$ de $\|\cdot\|_\infty$.

      *Étape 1.* Posons $g(x) = x - f(x)$, de classe $C^k$, avec $dg(0) = 0$. Par continuité de $dg$, il existe $r > 0$ tel que $B(0, 2r) \subset U$ et $|||dg(x)||| \leqslant \frac12$ sur $B(0, 2r)$. Cette boule est convexe ; l'inégalité des accroissements finis ({{gd-accroissements|Accroissements finis}}, (ii)) y donne $\|g(x) - g(x')\| \leqslant \frac12\|x - x'\|$.

      *Étape 2.* Soit $y$ tel que $\|y\| < r/2$, et $\varphi_y(x) = y + g(x)$. Pour $\|x\| \leqslant r$, $\|\varphi_y(x)\| \leqslant \|y\| + \|g(x) - g(0)\| \leqslant r$ : $\varphi_y$ envoie la boule fermée $\bar B(0, r)$, qui est fermée, dans elle-même, et elle est contractante de rapport $\frac12$. Par le théorème du point fixe ({{gd-point-fixe|Point fixe}}), il existe un unique $x \in \bar B(0, r)$ tel que $\varphi_y(x) = x$, c'est-à-dire $f(x) = y$ ; de plus $\|x\| \leqslant \|y\| + \frac12\|x\|$, donc $\|x\| \leqslant 2\|y\| < r$.

      Posons $W = B(0, r/2)$ et $V = B(0, r) \cap f^{-1}(W)$, ouvert contenant $0$. Par ce qui précède, $f : V \to W$ est surjective. Elle est injective : si $f(x) = f(x')$, alors $x - x' = g(x) - g(x')$, de norme au plus $\frac12\|x - x'\|$, donc $x = x'$.

      *Étape 3.* Soit $h : W \to V$ la réciproque. Pour $x, x' \in V$, $\|x - x'\| \leqslant \|f(x) - f(x')\| + \|g(x) - g(x')\| \leqslant \|f(x) - f(x')\| + \frac12\|x - x'\|$, d'où $\|h(y) - h(y')\| \leqslant 2\|y - y'\|$ : $h$ est continue.

      *Étape 4.* Pour $x \in V$, $df(x) = I - dg(x)$ est inversible par la série de Neumann ({{gd-gl|Groupe linéaire}}, (i)). Soit $y \in W$, $x = h(y)$, $k$ petit et $u = h(y + k) - x$, de sorte que $\|u\| \leqslant 2\|k\|$. Alors $k = f(x + u) - f(x) = df(x)u + \|u\|\,\varepsilon(u)$, d'où
      $$h(y + k) - h(y) - df(x)^{-1}k = -\|u\|\, df(x)^{-1}\varepsilon(u),$$
      de norme au plus $2\|k\|\;|||df(x)^{-1}|||\;\|\varepsilon(u)\|$. Comme $u \to 0$ quand $k \to 0$, par continuité de $h$, $h$ est différentiable en $y$ et $dh(y) = df(h(y))^{-1}$.

      *Étape 5.* On a donc $dh = \mathrm{inv} \circ df \circ h$. Si $h$ est de classe $C^j$ avec $j < k$, alors $df \circ h$ est de classe $C^j$, puisque $df$ est de classe $C^{k-1}$ et $j \leqslant k - 1$ ; $\mathrm{inv}$ étant $C^\infty$, $dh$ est de classe $C^j$ ({{gd-classe-ck|Classe Cᵏ}}, (iii)), et $h$ de classe $C^{j+1}$. Partant de $j = 0$, on atteint $j = k$, ou toute valeur de $j$ si $k = \infty$.
    remarques:
      - |
        Le théorème est local et ne se globalise pas. Pour $f(x, y) = (x^2 - y^2, 2xy)$, qui est $z \mapsto z^2$ lue dans $\mathbb R^2$, la matrice jacobienne $\begin{pmatrix} 2x & -2y \\ 2y & 2x \end{pmatrix}$ est injective dès que $(x, y) \neq (0, 0)$, mais $f(-x, -y) = f(x, y)$ : $f$ est un difféomorphisme local en tout point de $\mathbb R^2 \setminus \{0\}$ sans être injective sur cet ouvert.
      - |
        L'inversibilité de $df(a)$ est nécessaire pour que la réciproque soit différentiable. L'application $x \mapsto x^3$ est un homéomorphisme de $\lex{ensemble-reels}{\mathbb R}$, de classe $C^\infty$, mais si sa réciproque $h$ était dérivable en $0$, la règle de la chaîne appliquée à $h(x^3) = x$ donnerait $1 = h'(0) \cdot 0$.

  - id: gd-submersions
    etiquette: Submersions
    nature: théorème
    titre: Forme locale des submersions et fonctions implicites
    texte: |
      Une application $F : U \to \mathbb R^q$ de classe $C^k$ sur un ouvert $U$ de $\lex{n-uplet}{\mathbb R^n}$ est une [[submersion]] en $a$ si $dF(a)$ est surjective, ce qui impose $q \leqslant n$.
    enonce: |
      (i) *Forme locale.* Si $F$ est de classe $C^k$, $k \geqslant 1$, et si $dF(a)$ est surjective, il existe un ouvert $V$ contenant $a$ et un $C^k$-difféomorphisme $\Phi$ de $V$ sur un ouvert de $\mathbb R^{n-q} \times \mathbb R^q$ tels que $F(x) = F(a) + \pi(\Phi(x))$ sur $V$, où $\pi(z', z'') = z''$.

      (ii) *Fonctions implicites.* Soit $U$ un ouvert de $\mathbb R^m \times \mathbb R^q$, $F : U \to \mathbb R^q$ de classe $C^k$, et $(a, b) \in U$ tel que $F(a, b) = 0$ et que la différentielle partielle $\partial_y F(a, b) : \ell \mapsto dF(a, b)(0, \ell)$ soit inversible. Il existe un ouvert $A$ de $\mathbb R^m$ contenant $a$, un ouvert $V$ contenant $(a, b)$ et une application $\varphi : A \to \mathbb R^q$ de classe $C^k$ tels que, pour $(x, y) \in V$,
      $$F(x, y) = 0 \iff \big(x \in A \text{ et } y = \varphi(x)\big).$$
    preuve: |
      (i) Le noyau $K$ de $dF(a)$ est de dimension $n - q$, par le théorème du rang. Complétons une base $(v_1, \dots, v_{n-q})$ de $K$ en une base de $\mathbb R^n$ ({{v-dimension|Dimension}}, (iii)), et soit $L : \mathbb R^n \to \mathbb R^{n-q}$ l'application qui associe à $x$ ses $n - q$ premières coordonnées dans cette base ; elle est linéaire, et sa restriction à $K$ est bijective. Posons $\Phi(x) = \big(L(x), F(x) - F(a)\big)$, de classe $C^k$, avec $d\Phi(a)h = \big(Lh, dF(a)h\big)$. Si $d\Phi(a)h = 0$, alors $h \in K$ et $Lh = 0$, donc $h = 0$ : $d\Phi(a)$ est injective, donc inversible. Le théorème d'inversion locale ({{gd-inversion-locale|Inversion locale}}) fournit $V$, et $\pi \circ \Phi = F - F(a)$ par construction.

      (ii) Posons $\Phi(x, y) = \big(x, F(x, y)\big)$. Alors $d\Phi(a, b)(h, \ell) = \big(h,\, dF(a, b)(h, 0) + \partial_y F(a, b)\ell\big)$ ; s'il est nul, $h = 0$ puis $\partial_y F(a, b)\ell = 0$, donc $\ell = 0$. Par inversion locale, $\Phi$ induit un difféomorphisme d'un ouvert $V \ni (a, b)$ sur un ouvert $W \ni (a, 0)$, de réciproque de la forme $\Psi(x, z) = \big(x, \psi(x, z)\big)$ puisque $\Phi$ conserve la première composante. Soit $A = \{x : (x, 0) \in W\}$, ouvert comme image réciproque de $W$ par l'application continue $x \mapsto (x, 0)$, et $\varphi(x) = \psi(x, 0)$, de classe $C^k$. Pour $(x, y) \in V$, $F(x, y) = 0$ équivaut à $\Phi(x, y) = (x, 0)$, c'est-à-dire à $(x, 0) \in W$ et $(x, y) = \Psi(x, 0) = (x, \varphi(x))$.
    remarques:
      - |
        Pour $F(x, y) = x^2 + y^2 - 1$ au point $(0, 1)$, $\partial_y F = 2y$ vaut $2$, et l'équation définit localement $y = \sqrt{1 - x^2}$. Au point $(1, 0)$, $\partial_y F$ s'annule, et en effet $y$ n'est fonction de $x$ sur aucun voisinage ; mais $\partial_x F = 2 \neq 0$, et c'est $x$ qui s'exprime en fonction de $y$.

        ```schema gd-submersions
        Dans la boîte bleue, chaque verticale coupe le cercle une seule fois : le cercle y est le graphe de $x \mapsto \sqrt{1 - x^2}$. Près de $(1, 0)$, la verticale $x = 4/5$ le coupe aux deux points $(4/5, 3/5)$ et $(4/5, -3/5)$, si bien que $y$ n'y est pas fonction de $x$ ; dans la boîte verte, le cercle est en revanche le graphe de $y \mapsto \sqrt{1 - y^2}$, au-dessus de l'axe des $y$.
        ```
      - |
        La forme locale (i) dit que, vue dans de bonnes coordonnées, une submersion est une projection. C'est exactement ce qui permettra de « redresser » les ensembles de niveau en sous-espaces affines au nœud suivant.

  - id: gd-sous-varietes
    etiquette: Sous-variétés de ℝⁿ
    nature: théorème
    titre: Sous-variétés de ℝⁿ
    texte: |
      Une partie $M$ de $\lex{n-uplet}{\mathbb R^n}$ est une [[sous-variete|sous-variété]] de dimension $d$, avec $0 \leqslant d \leqslant n$, si pour tout $a \in M$ il existe un ouvert $U$ contenant $a$ et un $C^\infty$-difféomorphisme $\Phi$ de $U$ sur un ouvert de $\mathbb R^n$ tels que
      $$\Phi(U \cap M) = \Phi(U) \cap \big(\mathbb R^d \times \{0\}\big).$$
      Localement, et à difféomorphisme près, $M$ est un morceau de sous-espace vectoriel.

      ```schema gd-sous-varietes
      Pour la courbe $M$ d'équation $y = x^2/2$ dans $\mathbb R^2$, le difféomorphisme $\Phi(x, y) = (x, y - x^2/2)$, de réciproque $(u, v) \mapsto (u, v + u^2/2)$, envoie le disque $U$ sur $\Phi(U)$ et $U \cap M$ sur un segment de l'axe $\mathbb R \times \{0\}$. Les courbes voisines $y - x^2/2 = c$, en gris, deviennent les segments horizontaux $v = c$.
      ```
    enonce: |
      (i) *Équations.* $M$ est une sous-variété de dimension $d$ si et seulement si, pour tout $a \in M$, il existe un ouvert $U$ contenant $a$ et $F : U \to \mathbb R^{n-d}$ de classe $C^\infty$, avec $dF(a)$ surjective, tels que $M \cap U = F^{-1}(0)$.

      (ii) *Graphes.* Le graphe d'une application $\varphi : \Omega \to \mathbb R^{n-d}$ de classe $C^\infty$ sur un ouvert $\Omega$ de $\mathbb R^d$ est une sous-variété de dimension $d$ de $\mathbb R^n$.

      (iii) La sphère $\lex{sphere-unite}{S^{n-1}} = \{x \in \mathbb R^n : x_1^2 + \cdots + x_n^2 = 1\}$ est une sous-variété de dimension $n - 1$.
    preuve: |
      (i) Si $\Phi$ redresse $M$ près de $a$, $F = (\Phi_{d+1}, \dots, \Phi_n)$ convient : $dF(a)$ est formée des $n - d$ dernières lignes de la matrice inversible $J_\Phi(a)$, donc surjective, et pour $x \in U$, $x \in M$ équivaut à $\Phi(x) \in \mathbb R^d \times \{0\}$, c'est-à-dire à $F(x) = 0$. Réciproquement, la forme locale des submersions ({{gd-submersions|Submersions}}, (i)), avec $F(a) = 0$, fournit un ouvert $V \subset U$ contenant $a$ et un difféomorphisme $\Phi$ de $V$ sur un ouvert tels que $F = \pi \circ \Phi$ sur $V$. Pour $x \in V$, $x \in M$ équivaut à $F(x) = 0$, donc à $\Phi(x) \in \mathbb R^d \times \{0\}$.

      (ii) Le graphe est $F^{-1}(0)$ pour $F(x, y) = y - \varphi(x)$ sur $\Omega \times \mathbb R^{n-d}$, et $dF(x, y)(h, \ell) = \ell - d\varphi(x)h$ est surjective, puisque $\ell$ est arbitraire. On applique (i).

      (iii) $S^{n-1} = F^{-1}(0)$ avec $F(x) = \sum x_i^2 - 1$, polynomiale donc $C^\infty$, et $dF(x)h = 2\sum x_i h_i$. Pour $x \in S^{n-1}$, $dF(x)x = 2 \neq 0$ : la forme linéaire $dF(x)$ est surjective sur $\lex{ensemble-reels}{\mathbb R}$.
    remarques:
      - |
        L'erreur la plus répandue est de conclure qu'une partie n'est pas une sous-variété parce qu'une équation particulière qui la définit a une différentielle nulle. La droite $\{y = 0\}$ de $\mathbb R^2$ est l'ensemble des zéros de $F(x, y) = y^2$, dont la différentielle est nulle en tout point de la droite ; c'est pourtant une sous-variété, car $y$ est une meilleure équation.
      - |
        Le groupe orthogonal $O(n) = \{A : {}^tA A = I\}$ est une sous-variété de $\lex{espace-matrices}{\mathcal M_n}(\mathbb R)$, de dimension $n(n - 1)/2$. L'application $F(A) = {}^tAA$, à valeurs dans l'espace des matrices symétriques, a pour différentielle $H \mapsto {}^tHA + {}^tAH$, qui est surjective en tout $A \in O(n)$ : pour $S$ symétrique, $H = AS/2$ convient. C'est le premier exemple de groupe de Lie, qui rejoint les {{grtop|groupes topologiques}}.

  - id: gd-tangent-sm
    etiquette: Tangent à une sous-variété
    nature: proposition
    titre: Espace tangent à une sous-variété
    texte: |
      Soit $M$ une sous-variété de dimension $d$ de $\lex{n-uplet}{\mathbb R^n}$ et $a \in M$. Un vecteur $v \in \mathbb R^n$ est tangent à $M$ en $a$ s'il existe $\varepsilon > 0$ et une courbe $\gamma : \,]-\varepsilon, \varepsilon[ \to \mathbb R^n$ à valeurs dans $M$, dérivable en $0$, avec $\gamma(0) = a$ et $\gamma'(0) = v$. L'ensemble de ces vecteurs est l'[[espace-tangent-sv|espace tangent]] $\lex{espace-tangent-sv}{T_a}M$.
    enonce: |
      Si $\Phi$ redresse $M$ près de $a$, et si $F$ est une équation de $M$ près de $a$ au sens du nœud précédent, alors
      $$T_aM = d\Phi(a)^{-1}\big(\mathbb R^d \times \{0\}\big) = \operatorname{Ker} dF(a).$$
      En particulier, $T_aM$ est un sous-espace vectoriel de dimension $d$, qui ne dépend ni de $\Phi$ ni de $F$. Pour la sphère, $T_aS^{n-1} = \{h : \sum a_ih_i = 0\}$.

      ```schema gd-tangent-sm
      En $a = (3/5, 4/5)$, la vitesse $\gamma'(0)$ d'une courbe $\gamma$ tracée sur le cercle vérifie $\frac35 h_1 + \frac45 h_2 = 0$ : elle appartient à la droite vectorielle $T_aS^1$, de direction $(4, -3)$, qui passe par $0$ et non par $a$. L'erreur fréquente est de confondre $T_aS^1$ avec la tangente affine $a + T_aS^1$, en pointillé, que l'on dessine d'habitude : l'espace tangent est un sous-espace vectoriel, et la tangente affine n'en est que la translatée.
      ```
    preuve: |
      Soit $\gamma$ comme dans la définition. Étant dérivable en $0$, $\gamma$ y est continue, donc $\gamma(t) \in U \cap M$ pour $|t|$ petit, et $F \circ \gamma = 0$ au voisinage de $0$. La règle de la chaîne donne $dF(a)\gamma'(0) = 0$ : ainsi $T_aM \subset \operatorname{Ker} dF(a)$.

      Réciproquement, soit $v$ tel que $d\Phi(a)v = (w, 0)$. Comme $a \in M$, $\Phi(a) \in \mathbb R^d \times \{0\}$, et pour $|t|$ petit, $\Phi(a) + t(w, 0)$ appartient à l'ouvert $\Phi(U)$ et à $\mathbb R^d \times \{0\}$. La courbe $\gamma(t) = \Phi^{-1}\big(\Phi(a) + t(w, 0)\big)$ est donc à valeurs dans $M$, et $\gamma'(0) = d\Phi(a)^{-1}(w, 0) = v$. On obtient $d\Phi(a)^{-1}(\mathbb R^d \times \{0\}) \subset T_aM$.

      Le premier ensemble est de dimension $d$, image d'un sous-espace de dimension $d$ par un isomorphisme ; le noyau de $dF(a)$ est de dimension $n - (n - d) = d$ par le théorème du rang. Les inclusions $d\Phi(a)^{-1}(\mathbb R^d \times \{0\}) \subset T_aM \subset \operatorname{Ker} dF(a)$ entre espaces de même dimension sont des égalités ({{v-dimension|Dimension}}, (iii)). Pour la sphère, $dF(a)h = 2\sum a_ih_i$.
    remarques:
      - |
        La définition par les courbes est intrinsèque : elle ne fait intervenir ni carte ni équation. La démonstration montre que le résultat ne dépend donc pas du choix de $\Phi$ ou de $F$, ce qui n'aurait rien d'évident si l'on avait défini $T_aM$ comme un noyau.

  - id: gd-varietes
    etiquette: Variétés différentiables
    nature: définition
    titre: Variétés différentiables
    texte: |
      Soit $M$ un [[espace-topologique|espace topologique]] et $n \in \lex{ensemble-entiers-naturels}{\mathbb N}$. Une [[carte]] de dimension $n$ est un couple $(U, \varphi)$ où $U$ est un ouvert de $M$ et $\varphi$ un [[homeomorphisme]] de $U$ sur un ouvert de $\lex{n-uplet}{\mathbb R^n}$. Deux cartes $(U, \varphi)$ et $(V, \psi)$ sont **compatibles** si le changement de carte $\psi \circ \varphi^{-1} : \varphi(U \cap V) \to \psi(U \cap V)$ et sa réciproque sont de classe $C^\infty$ ; ce sont des applications entre ouverts de $\mathbb R^n$.

      ```schema gd-varietes
      La carte $\varphi$ envoie $U$ dans une première copie de $\mathbb R^n$, la carte $\psi$ envoie $V$ dans une seconde, et le chevauchement $U \cap V$, en rouge, a deux images, $\varphi(U \cap V)$ et $\psi(U \cap V)$. Le changement de carte $\psi \circ \varphi^{-1}$ va de l'une à l'autre : c'est une application entre ouverts de $\mathbb R^n$, à laquelle le calcul différentiel s'applique.
      ```

      Un [[atlas]] est une famille de cartes deux à deux compatibles dont les domaines recouvrent $M$.

      Une [[variete-differentiable|variété différentiable]] de dimension $n$ est un espace topologique séparé, ayant une base au plus dénombrable, muni d'un atlas maximal, c'est-à-dire contenu dans aucun autre atlas.
    enonce: |
      (i) Soit $\mathcal A$ un atlas. L'ensemble $\bar{\mathcal A}$ des cartes compatibles avec toutes celles de $\mathcal A$ est un atlas maximal, et c'est le seul atlas maximal qui contienne $\mathcal A$. Deux atlas définissent le même atlas maximal si et seulement si leur réunion est un atlas.

      (ii) Tout ouvert de $\mathbb R^n$ est une variété de dimension $n$, d'atlas $\{\mathrm{id}\}$. Toute sous-variété $M$ de dimension $d$ de $\mathbb R^n$ est une variété de dimension $d$, pour l'atlas des cartes $\big(U \cap M,\ p \circ \Phi|_{U \cap M}\big)$, où $\Phi$ redresse $M$ sur $U$ et $p : \mathbb R^n \to \mathbb R^d$ est la projection sur les $d$ premières coordonnées.

      (iii) Sur la sphère $\lex{sphere-unite}{S^n} \subset \mathbb R^{n+1}$, les projections stéréographiques $\sigma_\pm(x) = \dfrac{(x_1, \dots, x_n)}{1 \mp x_{n+1}}$, définies hors de $(0, \dots, 0, \pm 1)$, forment un atlas à deux cartes, compatible avec celui de (ii), et, en notant $\|z\|_2^2 = \sum_{i=1}^n z_i^2$ pour $z \in \mathbb R^n$,
      $$\sigma_+^{-1}(z) = \frac{\big(2z,\ \|z\|_2^2 - 1\big)}{\|z\|_2^2 + 1},$$
      $$\sigma_- \circ \sigma_+^{-1}(z) = \frac{z}{\|z\|_2^2} \quad (z \neq 0).$$

      ```schema gd-varietes-2
      Pour $n = 1$ et $x = (3/5, 4/5)$, la droite issue de $N = (0, 1)$ qui passe par $x$ coupe l'axe en $\sigma_+(x) = \frac{3/5}{1 - 4/5} = 3$, et celle issue de $S = (0, -1)$ le coupe en $\sigma_-(x) = \frac{3/5}{1 + 4/5} = \frac13$. On retrouve bien $\sigma_- \circ \sigma_+^{-1}(3) = 3/3^2$, comme l'annonce la formule.
      ```
    preuve: |
      (i) Soient $(V, \psi)$ et $(V', \psi')$ dans $\bar{\mathcal A}$, et $z = \psi(p)$ avec $p \in V \cap V'$. Choisissons $(U, \varphi) \in \mathcal A$ telle que $p \in U$. Sur l'ouvert $\psi(V \cap V' \cap U)$, qui contient $z$,
      $$\psi' \circ \psi^{-1} = (\psi' \circ \varphi^{-1}) \circ (\varphi \circ \psi^{-1}),$$
      composée d'applications $C^\infty$ ({{gd-classe-ck|Classe Cᵏ}}, (iii)). La classe $C^\infty$ se vérifiant au voisinage de chaque point, $\psi' \circ \psi^{-1}$ est $C^\infty$ sur $\psi(V \cap V')$. Donc $\bar{\mathcal A}$ est un atlas ; il contient $\mathcal A$, dont les cartes sont deux à deux compatibles. Tout atlas $\mathcal B \supset \mathcal A$ est formé de cartes compatibles avec $\mathcal A$, donc $\mathcal B \subset \bar{\mathcal A}$ : cela prouve à la fois que $\bar{\mathcal A}$ est maximal et qu'il est le seul atlas maximal contenant $\mathcal A$. Si $\mathcal A \cup \mathcal A'$ est un atlas, son atlas maximal contient $\mathcal A$ et $\mathcal A'$, donc égale $\bar{\mathcal A}$ et $\bar{\mathcal A'}$ ; réciproquement, si $\bar{\mathcal A} = \bar{\mathcal A'}$, alors $\mathcal A \cup \mathcal A' \subset \bar{\mathcal A}$ est un atlas. Le choix de $(U, \varphi)$ porte sur un seul point et n'a rien d'un axiome du choix : $\bar{\mathcal A}$ est défini par compréhension.

      (ii) Une partie de $\mathbb R^n$ est séparée et a une base au plus dénombrable ({{t-separe|Espaces séparés}}, (iii), {{gd-denombrable|Base dénombrable de ℝⁿ}}, (iii)). Pour $\Phi$ redressant $M$ sur $U$, $\varphi = p \circ \Phi|_{U \cap M}$ est une bijection continue de $U \cap M$ sur l'ouvert $\{z \in \mathbb R^d : (z, 0) \in \Phi(U)\}$, de réciproque continue $z \mapsto \Phi^{-1}(z, 0)$. Pour deux telles cartes, $\varphi' \circ \varphi^{-1}(z) = p \circ \Phi' \circ \Phi^{-1}(z, 0)$ est une composée d'applications $C^\infty$, et ces cartes recouvrent $M$ par définition d'une sous-variété.

      (iii) Un calcul direct montre que $x = \sigma_+^{-1}(z)$ vérifie $\sum x_i^2 = 1$ et $\sigma_+(x) = z$, et que $\sigma_-(x) = 2z/(2\|z\|_2^2)$. Les applications $\sigma_\pm$ sont des restrictions d'applications rationnelles, donc $C^\infty$ sur l'ouvert $\{x_{n+1} \neq \pm 1\}$ de $\mathbb R^{n+1}$, et $\sigma_+^{-1}$ est $C^\infty$ de $\mathbb R^n$ dans $\mathbb R^{n+1}$. Pour une carte $\varphi = p \circ \Phi$ de (ii), $\sigma_+ \circ \varphi^{-1}(z) = \sigma_+\big(\Phi^{-1}(z, 0)\big)$ et $\varphi \circ \sigma_+^{-1} = p \circ \Phi \circ \sigma_+^{-1}$ sont $C^\infty$ comme composées : les atlas sont compatibles.
    remarques:
      - |
        La séparation n'est pas une conséquence de l'existence des cartes. La droite à deux origines, obtenue en recollant deux copies de $\lex{ensemble-reels}{\mathbb R}$ le long de $\mathbb R \setminus \{0\}$, a un atlas de deux cartes compatibles, mais ses deux origines n'ont pas de voisinages disjoints : une suite peut y avoir deux limites.
      - |
        Toute variété de dimension $n$ se plonge comme sous-variété dans $\mathbb R^{2n}$ : c'est le théorème de plongement de Whitney (1944), admis ici. Les variétés abstraites ne sont donc pas plus générales que les sous-variétés ; elles libèrent seulement la théorie du choix d'un espace ambiant.

  - id: gd-applications-lisses
    etiquette: Applications lisses
    nature: proposition
    titre: Applications lisses entre variétés
    texte: |
      Soient $M$ et $N$ deux variétés. Une application $f : M \to N$ est [[application-lisse|lisse]] si elle est continue et si, pour toutes cartes $(U, \varphi)$ de $M$ et $(V, \psi)$ de $N$ prises dans les atlas maximaux, l'expression en cartes $\psi \circ f \circ \varphi^{-1}$ est de classe $C^\infty$ sur l'ouvert $\varphi(U \cap f^{-1}(V))$. Un **difféomorphisme** est une bijection lisse dont la réciproque est lisse.
    enonce: |
      (i) Il suffit de vérifier la condition pour des cartes prises dans des atlas quelconques de $M$ et de $N$.

      (ii) L'identité est lisse, et la composée de deux applications lisses est lisse.

      (iii) Un ouvert $U$ de $M$ est une variété pour les cartes de $M$ de domaine contenu dans $U$, et si $(U, \varphi)$ est une carte, $\varphi$ est un difféomorphisme de $U$ sur $\varphi(U)$. Les fonctions lisses $M \to \lex{ensemble-reels}{\mathbb R}$ forment un anneau $C^\infty(M)$.

      (iv) Entre ouverts de $\lex{n-uplet}{\mathbb R^m}$ et de $\mathbb R^n$, être lisse équivaut à être $C^\infty$. Si $M \subset \mathbb R^m$ et $N \subset \mathbb R^n$ sont des sous-variétés et $F$ une application $C^\infty$ sur un ouvert contenant $M$, avec $F(M) \subset N$, la restriction de $F$ à $M$ est lisse.
    preuve: |
      (i) Si $(U', \varphi')$ et $(V', \psi')$ sont des cartes des atlas maximaux et $p \in U' \cap f^{-1}(V')$, choisissons des cartes $(U, \varphi)$ et $(V, \psi)$ des atlas donnés autour de $p$ et de $f(p)$. Au voisinage de $\varphi'(p)$,
      $$\begin{aligned} &\psi' \circ f \circ \varphi'^{-1} \\ &\quad = (\psi' \circ \psi^{-1}) \circ (\psi \circ f \circ \varphi^{-1}) \circ (\varphi \circ \varphi'^{-1}), \end{aligned}$$
      composée d'applications $C^\infty$ ; la continuité de $f$ garantit que les ouverts en jeu sont bien des ouverts. On conclut par le caractère local de la classe $C^\infty$.

      (ii) Si $f : M \to N$ et $g : N \to P$ sont lisses, $g \circ f$ est continue, et au voisinage de chaque point, $\chi \circ g \circ f \circ \varphi^{-1} = (\chi \circ g \circ \psi^{-1}) \circ (\psi \circ f \circ \varphi^{-1})$ pour une carte $(V, \psi)$ de $N$ autour de l'image du point.

      (iii) $U$ est séparé et a une base au plus dénombrable, formée des traces d'une base de $M$ ; les cartes de domaine contenu dans $U$ forment un atlas maximal de $U$. L'expression de $\varphi$ dans les cartes $(U', \varphi')$ et $\mathrm{id}$ est $\varphi \circ \varphi'^{-1}$, de classe $C^\infty$, et de même pour $\varphi^{-1}$. Dans une carte, $(f + g) \circ \varphi^{-1} = f \circ \varphi^{-1} + g \circ \varphi^{-1}$, et de même pour le produit ({{gd-classe-ck|Classe Cᵏ}}, (iii)).

      (iv) Le premier point découle de (i) avec les atlas $\{\mathrm{id}\}$. Pour le second, avec les cartes du nœud {{gd-varietes|Variétés différentiables}}, $\psi \circ F \circ \varphi^{-1}(z) = p' \circ \Phi' \circ F \circ \Phi^{-1}(z, 0)$, composée d'applications $C^\infty$.
    remarques:
      - |
        L'erreur la plus répandue est de confondre homéomorphisme lisse et difféomorphisme. Sur $\mathbb R$, les atlas $\{\mathrm{id}\}$ et $\{x \mapsto x^3\}$ ne sont pas compatibles, car $x \mapsto x^{1/3}$ n'est pas dérivable en $0$ : l'identité de $\mathbb R$ n'est pas un difféomorphisme entre ces deux structures. Pourtant $f(x) = x^3$ en est un, de la seconde vers la première, puisque son expression en cartes est $x^3 \circ x^{1/3} = \mathrm{id}$ : les deux variétés sont difféomorphes sans être égales.
      - |
        Il existe en revanche des structures réellement distinctes : Milnor a construit en 1956 des variétés homéomorphes à la sphère $\lex{sphere-unite}{S^7}$ mais non difféomorphes à elle. Le type topologique ne détermine pas le type différentiable.

  - id: gd-espace-tangent
    etiquette: Espace tangent
    nature: théorème
    titre: Espace tangent et application linéaire tangente
    texte: |
      Soit $M$ une variété de dimension $n$ et $p \in M$. Sur l'ensemble des triplets $(U, \varphi, v)$ formés d'une carte en $p$ et d'un vecteur $v \in \lex{n-uplet}{\mathbb R^n}$, posons $(U, \varphi, v) \sim (V, \psi, w)$ si $w = d(\psi \circ \varphi^{-1})(\varphi(p))\,v$. L'[[espace-tangent]] $\lex{espace-tangent}{T_p}M$ est l'[[ensemble-quotient]], et pour chaque carte on note $\theta_\varphi : \mathbb R^n \to T_pM$ l'application qui envoie $v$ sur la classe de $(U, \varphi, v)$. Un vecteur tangent est un vecteur de $\mathbb R^n$ défini à changement de carte près.
    enonce: |
      (i) $\sim$ est une relation d'équivalence ; chaque $\theta_\varphi$ est bijective, et il existe une unique structure d'espace vectoriel sur $T_pM$ qui fasse de toutes les $\theta_\varphi$ des isomorphismes. $T_pM$ est de dimension $n$.

      (ii) Si $f : M \to N$ est lisse, l'application $T_pf : T_pM \to T_{f(p)}N$ qui envoie $\theta_\varphi(v)$ sur $\theta_\psi\big(d(\psi \circ f \circ \varphi^{-1})(\varphi(p))v\big)$ est bien définie et linéaire, et $T_p(g \circ f) = T_{f(p)}g \circ T_pf$. Par suite, si $f$ est un difféomorphisme, $T_pf$ est un isomorphisme, et deux ouverts difféomorphes de $\mathbb R^m$ et de $\mathbb R^n$ vérifient $m = n$.

      (iii) Si $M$ est une sous-variété de dimension $d$ de $\mathbb R^n$, l'application $\theta_\varphi(v) \mapsto d(\varphi^{-1})(\varphi(p))v$ est un isomorphisme de $T_pM$ sur l'espace tangent géométrique du nœud {{gd-tangent-sm|Tangent à une sous-variété}}.
    preuve: |
      (i) Réflexivité : le changement de carte est l'identité. Symétrie : $\varphi \circ \psi^{-1}$ est la réciproque de $\psi \circ \varphi^{-1}$, et la règle de la chaîne donne $d(\varphi \circ \psi^{-1})(\psi(p)) = d(\psi \circ \varphi^{-1})(\varphi(p))^{-1}$. Transitivité : la règle de la chaîne appliquée à $\chi \circ \varphi^{-1} = (\chi \circ \psi^{-1}) \circ (\psi \circ \varphi^{-1})$. L'application $\theta_\varphi$ est injective, puisque deux triplets de même carte ne sont équivalents que si les vecteurs sont égaux, et surjective, puisque $(V, \psi, w) \sim \big(U, \varphi, d(\varphi \circ \psi^{-1})(\psi(p))w\big)$. On transporte la structure de $\mathbb R^n$ par $\theta_\varphi$ ; elle ne dépend pas de la carte, car $\theta_\psi^{-1} \circ \theta_\varphi = d(\psi \circ \varphi^{-1})(\varphi(p))$ est linéaire.

      (ii) Remplacer $\varphi$ et $\psi$ par d'autres cartes multiplie l'expression, à droite et à gauche, par les différentielles des changements de carte ; la règle de la chaîne montre que le résultat définit le même élément de $T_{f(p)}N$. La linéarité se lit dans les cartes, et la formule de composition découle encore de la règle de la chaîne. Si $f$ a pour réciproque lisse $g$, alors $T_pf$ et $T_{f(p)}g$ sont réciproques l'une de l'autre, puisque $T_p\,\mathrm{id} = \mathrm{id}$ ; les dimensions sont donc égales, et celle de $T_p$ d'un ouvert de $\mathbb R^m$ est $m$.

      (iii) Avec $\varphi^{-1}(z) = \Phi^{-1}(z, 0)$, $d(\varphi^{-1})(\varphi(p))v = d\Phi(p)^{-1}(v, 0)$ : l'application $\mathbb R^d \to \mathbb R^n$ ainsi définie est injective, d'image $d\Phi(p)^{-1}(\mathbb R^d \times \{0\}) = T_pM$. Elle ne dépend pas de la carte, car $\varphi^{-1} = \varphi'^{-1} \circ (\varphi' \circ \varphi^{-1})$ donne $d(\varphi^{-1})(\varphi(p)) = d(\varphi'^{-1})(\varphi'(p)) \circ d(\varphi' \circ \varphi^{-1})(\varphi(p))$, ce qui est exactement la relation $\sim$.
    remarques:
      - |
        L'invariance de la dimension par difféomorphisme, obtenue ici en une ligne grâce à la différentielle, a un analogue topologique beaucoup plus difficile : un ouvert de $\mathbb R^m$ n'est homéomorphe à un ouvert de $\mathbb R^n$ que si $m = n$. C'est le théorème d'invariance du domaine de Brouwer (1911), admis ici ; sa démonstration demande la topologie algébrique.
      - |
        D'autres définitions de $T_pM$ sont en usage : classes de courbes passant par $p$, ou dérivations de l'anneau des germes de fonctions lisses en $p$. Elles sont équivalentes à celle-ci, mais l'équivalence avec les dérivations demande des fonctions plateau, que l'atlas ne construit pas encore.

  - id: gd-fibre-tangent
    etiquette: Fibré tangent
    nature: théorème
    titre: Fibré tangent et champs de vecteurs
    texte: |
      Le [[fibre-tangent|fibré tangent]] d'une variété $M$ de dimension $n$ est l'ensemble $\lex{fibre-tangent}{TM} = \{(p, \xi) : p \in M,\ \xi \in \lex{espace-tangent}{T_p}M\}$, avec la projection $\pi(p, \xi) = p$. Pour une carte $(U, \varphi)$, on note $T\varphi : \pi^{-1}(U) \to \varphi(U) \times \lex{n-uplet}{\mathbb R^n}$ la bijection $(p, \xi) \mapsto \big(\varphi(p), \theta_\varphi^{-1}(\xi)\big)$. Un [[champ-vecteurs|champ de vecteurs]] est une application lisse $X : M \to TM$ telle que $\pi \circ X = \mathrm{id}_M$.
    choix: |
      Pour montrer que $TM$ a une base au plus dénombrable, on choisit une carte pour chacun des ouverts d'une base dénombrable de $M$ : c'est un usage du [[choix-denombrable]]. Le reste de la construction n'utilise aucun choix.
    enonce: |
      Il existe une unique topologie sur $TM$ pour laquelle chaque $\pi^{-1}(U)$ est ouvert et chaque $T\varphi$ est un homéomorphisme sur l'ouvert $\varphi(U) \times \mathbb R^n$ de $\mathbb R^{2n}$, pour toutes les cartes $(U, \varphi)$ de $M$. Muni des cartes $(\pi^{-1}(U), T\varphi)$, $TM$ est une variété de dimension $2n$, et $\pi$ est lisse.
    preuve: |
      *Changements de carte.* Pour deux cartes, $\tau = \psi \circ \varphi^{-1}$, et $(z, v) \in \varphi(U \cap V) \times \mathbb R^n$,
      $$T\psi \circ T\varphi^{-1}(z, v) = \big(\tau(z),\ d\tau(z)v\big),$$
      puisque $\theta_\psi^{-1} \circ \theta_\varphi = d\tau(\varphi(p))$. C'est une application $C^\infty$ : $z \mapsto d\tau(z)$ est $C^\infty$, et l'évaluation $(A, v) \mapsto Av$ est bilinéaire. Il en va de même de sa réciproque, obtenue en échangeant les cartes.

      *Topologie.* Soit $\mathcal B$ l'ensemble des parties $T\varphi^{-1}(O)$, où $(U, \varphi)$ est une carte et $O$ un ouvert de $\varphi(U) \times \mathbb R^n$. Elles recouvrent $TM$. Notons $\tilde\tau = T\psi \circ T\varphi^{-1}$, continue sur l'ouvert $\varphi(U \cap V) \times \mathbb R^n$. Alors
      $$T\varphi^{-1}(O) \cap T\psi^{-1}(O') = T\varphi^{-1}\big(O \cap \tilde\tau^{-1}(O')\big),$$
      et $O \cap \tilde\tau^{-1}(O')$ est ouvert. Donc $\mathcal B$ est la base d'une topologie, et le même calcul montre que les ouverts de cette topologie contenus dans $\pi^{-1}(U)$ sont exactement les $T\varphi^{-1}(O)$ : $T\varphi$ est un homéomorphisme. Toute topologie ayant les propriétés annoncées contient $\mathcal B$, et chacun de ses ouverts est réunion de ses traces sur les $\pi^{-1}(U)$, qui sont dans $\mathcal B$ : elle est égale à la précédente.

      *Séparation.* Si $p \neq q$, des ouverts disjoints $U'$ et $V'$ de $M$ séparant $p$ et $q$ donnent les ouverts disjoints $\pi^{-1}(U')$ et $\pi^{-1}(V')$. Si $p = q$, les deux points sont dans un même $\pi^{-1}(U)$, homéomorphe à une partie de $\mathbb R^{2n}$, qui est séparée.

      *Base dénombrable.* Soit $(B_k)_{k \in J}$, avec $J \subset \lex{ensemble-entiers-naturels}{\mathbb N}$, une base de $M$, et $K$ l'ensemble des $k$ tels que $B_k$ soit contenu dans le domaine d'une carte ; les $B_k$, $k \in K$, recouvrent $M$. Pour chaque $k \in K$, choisissons une carte $\varphi_k$ définie sur $B_k$. Les images réciproques par $T\varphi_k$ des boules rationnelles de $\mathbb R^{2n}$ contenues dans $\varphi_k(B_k) \times \mathbb R^n$ forment une base de $\pi^{-1}(B_k)$ ({{gd-denombrable|Base dénombrable de ℝⁿ}}), indexée par une partie de $K \times \mathbb Q^{2n} \times \lex{ensemble-rationnels}{\mathbb Q}$, qui s'injecte dans $\mathbb N$. Tout ouvert $O$ de $TM$ est la réunion des $O \cap \pi^{-1}(B_k)$, et chacun est réunion d'éléments de cette famille.

      *Lissité de $\pi$.* Dans les cartes $T\varphi$ et $\varphi$, l'expression de $\pi$ est $(z, v) \mapsto z$, linéaire.
    remarques:
      - |
        Sur le cercle $\lex{sphere-unite}{S^1} \subset \mathbb R^2$, identifions $T_{(x, y)}S^1$ à la droite orthogonale à $(x, y)$ ({{gd-tangent-sm|Tangent à une sous-variété}}). Le champ $X(x, y) = (-y, x)$ est lisse et ne s'annule nulle part.

        ```schema gd-fibre-tangent
        Aux douze points marqués du cercle, le vecteur $X(x, y) = (-y, x)$, dessiné réduit d'un facteur $0{,}4$, vérifie $x(-y) + yx = 0$ : il est tangent au cercle. Il n'est jamais nul, puisque $(-y, x) = 0$ entraînerait $x = y = 0$, point qui n'est pas sur le cercle.
        ```

        Sur $S^2$, au contraire, tout champ de vecteurs continu s'annule en au moins un point : c'est le théorème de la boule chevelue, de Poincaré et Brouwer, admis ici, dont la démonstration utilise le degré topologique, cousin du degré des lacets du nœud {{ta-cercle|Groupe fondamental du cercle}}.
      - |
        Le fibré tangent n'est en général pas un produit : $TS^1$ est difféomorphe à $S^1 \times \lex{ensemble-reels}{\mathbb R}$, grâce au champ précédent qui fournit une base de chaque espace tangent, mais $TS^2$ n'est pas difféomorphe à $S^2 \times \mathbb R^2$, sans quoi $S^2$ porterait un champ ne s'annulant pas.

  - id: gd-schwarz
    etiquette: Schwarz, intégrales à paramètre
    nature: théorème
    titre: Théorème de Schwarz et intégrales à paramètre
    enonce: |
      (i) *Schwarz.* Si $f : U \to \lex{ensemble-reels}{\mathbb R}$ est de classe $C^2$ sur un ouvert $U$ de $\lex{n-uplet}{\mathbb R^n}$, alors $\partial_i\partial_j f = \partial_j\partial_i f$ pour tous $i, j$.

      (ii) *Intégrales à paramètre.* Soit $h : [0, 1] \times U \to \mathbb R$ continue. Alors $F(x) = \int_0^1 h(t, x)\,dt$ est continue sur $U$. Si de plus les dérivées partielles $\partial_{x_j} h$ existent et sont continues sur $[0, 1] \times U$, $F$ est de classe $C^1$ et $\partial_j F(x) = \int_0^1 \partial_{x_j} h(t, x)\,dt$. Par récurrence, si $h$ est $C^\infty$ en $x$ avec toutes ses dérivées partielles continues sur $[0, 1] \times U$, $F$ est $C^\infty$.
    preuve: |
      (ii) *Continuité.* Fixons $x_0 \in U$ et $\varepsilon > 0$. Les ouverts produits $V \times W$ de $\mathbb R \times U$ sur lesquels $|h(t, x) - h(t', x_0)| < \varepsilon$ pour tous $(t, x) \in V \times W$ et $(t', x_0) \in V \times W$ recouvrent le compact $[0, 1] \times \{x_0\}$, par continuité de $h$ ; un nombre fini d'entre eux, $V_1 \times W_1, \dots, V_m \times W_m$, suffit, et l'on pose $W = \bigcap_i W_i$. Pour $x \in W$ et $t \in [0, 1]$, $t$ appartient à un $V_i$, et $|h(t, x) - h(t, x_0)| < \varepsilon$. Donc $|F(x) - F(x_0)| \leqslant \varepsilon$. Aucun choix n'intervient : la famille des ouverts est définie par compréhension, et l'on n'en extrait qu'un nombre fini.

      *Dérivation.* Par l'égalité des accroissements finis ({{gd-accroissements|Accroissements finis}}, (i)), pour $s \neq 0$ petit, $\frac{h(t, x_0 + se_j) - h(t, x_0)}{s} = \partial_{x_j} h(t, x_0 + c\,s\,e_j)$ avec $c \in \,]0, 1[$ dépendant de $t$. Le même argument de recouvrement, appliqué à $\partial_{x_j} h$, montre que cette quantité est à moins de $\varepsilon$ de $\partial_{x_j} h(t, x_0)$ dès que $|s|$ est petit, uniformément en $t$. On intègre, puis on applique la continuité à $\partial_{x_j} h$ et le nœud {{gd-classe-ck|Classe Cᵏ}}, (i).

      (i) Fixons $a$, et posons, pour $s$ petit, $\Delta(s) = f(a + se_i + se_j) - f(a + se_i) - f(a + se_j) + f(a)$, avec $i \neq j$. La fonction $g(u) = f(u + se_j) - f(u)$ donne $\Delta(s) = g(a + se_i) - g(a)$ ; par l'égalité des accroissements finis appliquée deux fois, d'abord à $\tau \mapsto g(a + \tau e_i)$, puis à $\tau \mapsto \partial_i f(a + c\,s\,e_i + \tau e_j)$, on obtient $\Delta(s) = s^2\,\partial_j\partial_i f(a + c\,s\,e_i + c'\,s\,e_j)$ pour des $c, c' \in \,]0, 1[$. En échangeant les rôles de $i$ et $j$, $\Delta(s) = s^2\,\partial_i\partial_j f(a + d\,s\,e_i + d'\,s\,e_j)$. On divise par $s^2$ et l'on fait tendre $s$ vers $0$ : les deux dérivées secondes étant continues en $a$, elles y sont égales.

      ```schema gd-schwarz
      Les quatre sommets du carré de côté $s$ entrent dans $\Delta(s)$ avec les signes indiqués. Chacune des deux applications des accroissements finis fournit un point du carré où la dérivée croisée vaut $\Delta(s)/s^2$ : en rouge pour $\partial_j\partial_i f$, en bleu pour $\partial_i\partial_j f$. Ils sont placés ici pour $f(x, y) = xy(x - y)^2 + xy$, $a = 0$ et $s = 1$ (ces points ne sont pas uniques, on en a retenu un), et ils tendent tous deux vers $a$ avec $s$.
      ```
    remarques:
      - |
        L'hypothèse de continuité des dérivées secondes ne peut pas être omise. La fonction $f(x, y) = xy\frac{x^2 - y^2}{x^2 + y^2}$, prolongée par $0$ en l'origine, a des dérivées secondes croisées en $(0, 0)$ qui valent $-1$ et $1$ : on calcule $\partial_x f(0, y) = -y$ et $\partial_y f(x, 0) = x$. Le théorème de Schwarz est ce qui donnera $d \circ d = 0$ au nœud {{gd-formes|Formes différentielles}}.

  - id: gd-orientation
    etiquette: Orientation
    nature: définition
    titre: Orientation des espaces vectoriels et des variétés
    texte: |
      Deux bases d'un $\lex{ensemble-reels}{\mathbb R}$-espace vectoriel $E$ de dimension $n \geqslant 1$ ont **même orientation** si la matrice de passage de l'une à l'autre a un [[determinant|déterminant]] strictement positif. Une [[orientation]] de $E$ est une classe d'équivalence pour cette relation. Un atlas d'une variété est **orienté** si tous ses changements de carte $\tau$ vérifient $\det d\tau(z) > 0$ en tout point ; une variété est **orientable** si elle possède un atlas orienté.
    enonce: |
      (i) « Avoir même orientation » est une relation d'équivalence sur les bases de $E$, qui a exactement deux classes. Un isomorphisme $u$ de $E$ conserve chaque classe si et seulement si $\det u > 0$.

      (ii) Tout ouvert de $\lex{n-uplet}{\mathbb R^n}$ est orientable. Si $(U, \varphi)$ est une carte et $\rho(z_1, z_2, \dots, z_n) = (-z_1, z_2, \dots, z_n)$, alors $(U, \rho \circ \varphi)$ est une carte, dont les changements de carte avec les autres ont des jacobiens de signe opposé.

      (iii) La sphère $\lex{sphere-unite}{S^n}$, $n \geqslant 1$, est orientable : les cartes $\sigma_+$ et $\rho \circ \sigma_-$ forment un atlas orienté.
    preuve: |
      (i) Si $P$ et $Q$ sont les matrices de passage de $\mathcal B$ à $\mathcal B'$ et de $\mathcal B'$ à $\mathcal B''$, celle de $\mathcal B$ à $\mathcal B''$ est $PQ$, et $\det(PQ) = \det P \det Q$ ({{v-determinant|Déterminant}}) ; la matrice de passage inverse est $P^{-1}$, de déterminant $1/\det P$. Une base $\mathcal B$ et la base obtenue en changeant $e_1$ en $-e_1$ n'ont pas même orientation, la matrice de passage étant de déterminant $-1$, et toute base a même orientation que l'une ou l'autre, selon le signe du déterminant de passage. Enfin, la matrice de passage de $\mathcal B$ à $u(\mathcal B)$ est la matrice de $u$.

      (ii) L'atlas $\{\mathrm{id}\}$ est orienté. $\rho$ est un difféomorphisme linéaire de déterminant $-1$, et $d(\psi \circ (\rho \circ \varphi)^{-1}) = d(\psi \circ \varphi^{-1}) \circ \rho$.

      (iii) Le changement de carte $\sigma_- \circ \sigma_+^{-1}(z) = z/\|z\|_2^2$ ({{gd-varietes|Variétés différentiables}}) a pour différentielle $h \mapsto \|z\|_2^{-2}\big(h - 2\langle u, h \rangle u\big)$, avec $u = z/\|z\|_2$ et $\langle u, h \rangle = \sum_i u_ih_i$. L'application $h \mapsto h - 2\langle u, h \rangle u$ envoie $u$ sur $-u$ (car $\langle u, u \rangle = 1$) et fixe l'hyperplan $u^\perp = \{h : \langle u, h \rangle = 0\}$ ; dans une base formée de $u$ et d'une base de $u^\perp$, sa matrice est diagonale de coefficients $-1, 1, \dots, 1$ : le déterminant du changement de carte vaut $-\|z\|_2^{-2n} < 0$. Composer $\sigma_-$ avec $\rho$ change ce signe, par (ii).
    remarques:
      - |
        L'erreur la plus répandue est de croire qu'une orientation est une propriété des vecteurs eux-mêmes. C'est un choix entre deux classes de bases, sans base privilégiée : $\mathbb R^n$ a une orientation « canonique » seulement parce que l'on a choisi sa base canonique. Le ruban de Möbius, quotient du ruban $[0, 1] \times \,]-1, 1[$ où l'on recolle $(0, y)$ avec $(1, -y)$, est une variété de dimension $2$ non orientable ; ce fait est admis ici.
      - |
        Le signe du déterminant joue ici le rôle que sa valeur absolue joue en théorie de la {{mes|mesure}}, où elle mesure la dilatation des volumes : l'intégrale d'une forme de degré maximal sur une variété orientée réunit les deux.

  - id: gd-formes
    etiquette: Formes différentielles
    nature: théorème
    titre: Formes différentielles et différentielle extérieure
    texte: |
      Soit $U$ un ouvert de $\lex{n-uplet}{\mathbb R^n}$. Une [[forme-differentielle|forme différentielle]] de degré $k$ sur $U$ est une application $\omega$ qui associe à chaque $x \in U$ une forme $\omega_x \in \lex{espace-formes-alternees}{\Lambda^k}(\mathbb R^n)$ ({{v-algebre-exterieure|Algèbre extérieure}}), de la forme $\omega = \sum_I a_I\, dx_I$ avec des coefficients $a_I$ de classe $C^\infty$, où $dx_I = dx_{i_1} \wedge \cdots \wedge dx_{i_k}$ et $dx_i$ désigne la $i$-ième forme coordonnée. Pour une fonction $f$, de degré $0$, $df = \sum_j \partial_j f\, dx_j$ est sa différentielle. La **différentielle extérieure** est
      $$d\Big(\sum_I a_I\, dx_I\Big) = \sum_I da_I \wedge dx_I.$$
      Pour $\varphi : V \to U$ de classe $C^\infty$, l'**image réciproque** est $(\varphi^*\omega)_y = d\varphi(y)^*\,\omega_{\varphi(y)}$.
    enonce: |
      (i) $d$ est linéaire, et $d(\omega \wedge \eta) = d\omega \wedge \eta + (-1)^k \omega \wedge d\eta$ pour $\omega$ de degré $k$.

      (ii) $d \circ d = 0$.

      (iii) $\varphi^*(\omega \wedge \eta) = \varphi^*\omega \wedge \varphi^*\eta$, $(\psi \circ \varphi)^* = \varphi^* \circ \psi^*$, et $\varphi^* \circ d = d \circ \varphi^*$.
    preuve: |
      (i) Par linéarité, il suffit de traiter $\omega = a\,dx_I$ et $\eta = b\,dx_J$. Alors $\omega \wedge \eta = ab\,dx_I \wedge dx_J$, et, $dx_I \wedge dx_J$ étant $\pm dx_{I \cup J}$ ou nul, $d(\omega \wedge \eta) = d(ab) \wedge dx_I \wedge dx_J = (b\,da + a\,db) \wedge dx_I \wedge dx_J$. Le premier terme est $d\omega \wedge \eta$ ; dans le second, faire passer la forme $db$, de degré $1$, devant $dx_I$, de degré $k$, coûte le signe $(-1)^k$ ({{v-algebre-exterieure|Algèbre extérieure}}, (ii)).

      (ii) Pour une fonction, $d(df) = \sum_{i, j} \partial_i\partial_j f\, dx_i \wedge dx_j = \sum_{i < j} (\partial_i\partial_j f - \partial_j\partial_i f)\, dx_i \wedge dx_j = 0$ par le théorème de Schwarz ({{gd-schwarz|Schwarz, intégrales à paramètre}}). En particulier $d(dx_i) = 0$, puis $d(dx_I) = 0$ par (i), et $d(d(a\,dx_I)) = d(da \wedge dx_I) = d(da) \wedge dx_I - da \wedge d(dx_I) = 0$.

      (iii) La première égalité vient de {{v-algebre-exterieure|Algèbre extérieure}}, (iii), point par point, et la deuxième de la règle de la chaîne. Pour une fonction, $\varphi^*f = f \circ \varphi$ et $d(f \circ \varphi) = df \circ d\varphi = \varphi^*(df)$ ; en particulier $\varphi^*(dx_i) = d\varphi_i$. Pour $\omega = a\,dx_I$, $\varphi^*\omega = (a \circ \varphi)\, d\varphi_{i_1} \wedge \cdots \wedge d\varphi_{i_k}$, dont la différentielle est, par (i) et (ii), $d(a \circ \varphi) \wedge d\varphi_{i_1} \wedge \cdots = \varphi^*(da) \wedge \varphi^*(dx_I) = \varphi^*(d\omega)$.
    remarques:
      - |
        Dans $\mathbb R^3$, en identifiant les $1$-formes et les $2$-formes à des champs de vecteurs, $d$ sur les fonctions est le gradient, $d$ sur les $1$-formes le rotationnel, $d$ sur les $2$-formes la divergence. Les identités $\operatorname{rot}\operatorname{grad} = 0$ et $\operatorname{div}\operatorname{rot} = 0$ de la physique sont deux cas de $d \circ d = 0$.
      - |
        L'égalité $\varphi^* \circ d = d \circ \varphi^*$ dit que $d$ ne dépend pas des coordonnées. C'est elle qui permet de transporter les formes différentielles sur les variétés, au nœud {{gd-formes-varietes|Formes sur une variété}}.

  - id: gd-formes-varietes
    etiquette: Formes sur une variété
    nature: proposition
    titre: Formes différentielles sur une variété, formes volume
    texte: |
      Soit $M$ une variété de dimension $n$. Une forme différentielle de degré $k$ sur $M$ est la donnée, pour chaque carte $(U, \varphi)$, d'une forme $\omega_\varphi$ de degré $k$ sur l'ouvert $\varphi(U)$, ces formes étant compatibles : $\omega_\varphi = \tau^*\omega_\psi$ sur $\varphi(U \cap V)$, où $\tau = \psi \circ \varphi^{-1}$. Une **forme volume** est une forme de degré $n$ qui ne s'annule en aucun point.
    enonce: |
      (i) Le produit extérieur et la différentielle extérieure, définis carte par carte, donnent des formes sur $M$ ; $d \circ d = 0$, et la formule de Leibniz vaut. Une application lisse $f : M \to N$ définit une image réciproque $f^*$, qui commute à $d$ et au produit extérieur.

      (ii) Une forme de degré $n$ s'écrit dans chaque carte $\omega_\varphi = a_\varphi\, dz_1 \wedge \cdots \wedge dz_n$, et $a_\varphi = (a_\psi \circ \tau) \det d\tau$ sur les changements de carte.

      (iii) Si $M$ porte une forme volume, $M$ est orientable.
    preuve: |
      (i) Il suffit de vérifier la compatibilité, c'est-à-dire que $\tau^*$ commute au produit et à $d$ : c'est le nœud {{gd-formes|Formes différentielles}}, (iii). Pour $f$ lisse, on pose $(f^*\omega)_\varphi = (\psi \circ f \circ \varphi^{-1})^*\omega_\psi$ là où c'est défini, et les mêmes formules montrent la compatibilité et les propriétés.

      (ii) $\tau^*(dz_1 \wedge \cdots \wedge dz_n) = \det d\tau \cdot dz_1 \wedge \cdots \wedge dz_n$, par {{v-algebre-exterieure|Algèbre extérieure}}, (iii).

      (iii) Pour chaque carte $(U, \varphi)$, la fonction $a_\varphi$ est continue et ne s'annule pas ; les ensembles $U^+ = \varphi^{-1}(\{a_\varphi > 0\})$ et $U^- = \varphi^{-1}(\{a_\varphi < 0\})$ sont ouverts. Les cartes $(U^+, \varphi)$ et $(U^-, \rho \circ \varphi)$ ({{gd-orientation|Orientation}}, (ii)), pour toutes les cartes de $M$, forment un atlas dans lequel tous les coefficients $a$ sont positifs ; par (ii), tous les changements de carte ont un jacobien de déterminant positif.
    remarques:
      - |
        La réciproque de (iii) est vraie : toute variété orientable porte une forme volume. Sa démonstration recolle des formes locales $dz_1 \wedge \cdots \wedge dz_n$ au moyen de **partitions de l'unité**, qui demandent des fonctions $C^\infty$ nulles hors d'un compact sans être nulles, comme $x \mapsto \exp(-1/x)$ pour $x > 0$. L'exponentielle est construite en {{anc|analyse complexe}}, qui n'est pas un ancêtre de cette branche ; la réciproque est donc admise ici.
      - |
        Sur la sphère $\lex{sphere-unite}{S^2} \subset \mathbb R^3$, la restriction de $x\,dy \wedge dz + y\,dz \wedge dx + z\,dx \wedge dy$ est une forme volume : en un point $a$, sa valeur sur deux vecteurs tangents $v, w$ est $\det(a, v, w)$, non nul si $(v, w)$ est une base du plan $a^\perp$.

  - id: gd-integrale-curviligne
    etiquette: Intégrale d'une 1-forme
    nature: proposition
    titre: Intégrale d'une forme de degré 1 le long d'un chemin
    texte: |
      Soit $\omega$ une forme de degré $1$ sur un ouvert $U$ de $\lex{n-uplet}{\mathbb R^n}$ et $\gamma : [a, b] \to U$ un chemin de classe $C^1$ par morceaux. On pose $\int_\gamma \omega = \int_a^b \omega_{\gamma(t)}\big(\gamma'(t)\big)\,dt$. Une forme est **fermée** si $d\omega = 0$, **exacte** si $\omega = df$ pour une fonction $f$.
    enonce: |
      (i) $\int_\gamma df = f(\gamma(b)) - f(\gamma(a))$ ; en particulier, l'intégrale d'une forme exacte sur un chemin fermé est nulle.

      (ii) Une forme exacte est fermée.

      (iii) Si $U$ est connexe et si $\int_\gamma \omega = 0$ pour tout chemin fermé $\gamma$ formé de segments, alors $\omega$ est exacte.
    preuve: |
      (i) $\omega_{\gamma(t)}(\gamma'(t)) = (f \circ \gamma)'(t)$ par la règle de la chaîne, et l'on applique le théorème fondamental sur chaque morceau ({{ar-tfa|Théorème fondamental}}).

      (ii) $d(df) = 0$ ({{gd-formes|Formes différentielles}}).

      (iii) Fixons $x_0 \in U$. L'ensemble des points de $U$ reliés à $x_0$ par une ligne brisée contenue dans $U$ est ouvert, car les boules sont convexes, et son complémentaire aussi ; par connexité, c'est $U$. Posons $f(x) = \int_\gamma \omega$ pour une ligne brisée $\gamma$ de $x_0$ à $x$ : la valeur ne dépend pas de la ligne choisie, puisque deux telles lignes forment un chemin fermé. Pour $t$ petit, en prolongeant la ligne par le segment $[x, x + te_j]$, $f(x + te_j) - f(x) = \int_0^t \omega_{x + se_j}(e_j)\,ds$, d'où $\partial_j f(x) = \omega_x(e_j)$ par le théorème fondamental : $df = \omega$, et $f$ est $C^\infty$ puisque ses dérivées partielles le sont.
    remarques:
      - |
        Sur $U = \mathbb R^2 \setminus \{0\}$, la forme $\omega = \dfrac{x\,dy - y\,dx}{x^2 + y^2}$ est fermée, comme on le vérifie en calculant $d\omega$. Son intégrale sur le bord du carré $[-1, 1]^2$, parcouru dans le sens direct, vaut $4\int_{-1}^1 \frac{dt}{1 + t^2}$, puisque sur chaque côté elle se réduit à $\frac{dt}{1 + t^2}$ : c'est un nombre strictement positif (l'analyse complexe montrera qu'il vaut $2\pi$). Donc $\omega$ n'est pas exacte, et (ii) n'a pas de réciproque sur cet ouvert.

        ```schema gd-integrale-curviligne
        Le bord du carré est parcouru dans le sens direct, sans passer par l'origine, qui n'appartient pas à $U$. Chaque côté est paramétré par $t \in [-1, 1]$, par exemple $t \mapsto (1, t)$ à droite, et sur chacun la forme se réduit à $\frac{dt}{1 + t^2}$ : les quatre contributions sont égales et strictement positives.
        ```

        Le nœud {{gd-de-rham|Cohomologie de de Rham}} mesurera ce défaut.

  - id: gd-poincare
    etiquette: Lemme de Poincaré
    nature: théorème
    titre: Lemme de Poincaré
    enonce: |
      Soit $U$ un ouvert de $\lex{n-uplet}{\mathbb R^n}$ étoilé par rapport à $0$ : $tx \in U$ pour tout $x \in U$ et tout $t \in [0, 1]$. Toute forme fermée de degré $k \geqslant 1$ sur $U$ est exacte.
    preuve: |
      Pour une fonction $a$ et un degré $k \geqslant 1$, posons $c_a(x) = \int_0^1 t^{k-1} a(tx)\,dt$. Définissons l'opérateur $K$, qui abaisse le degré d'une unité, par
      $$K(a\,dx_{j_0} \wedge \cdots \wedge dx_{j_{k-1}}) = \sum_{r=0}^{k-1} (-1)^r\, c_a\, x_{j_r}\, dx_{J \setminus j_r},$$
      où $dx_{J \setminus j_r}$ est le produit des $dx_{j_s}$, $s \neq r$, dans l'ordre. La formule est alternée en la suite $(j_0, \dots, j_{k-1})$, donc compatible avec les relations entre les $dx_J$, et définit $K$ par linéarité. Le résultat est $C^\infty$ par le nœud {{gd-schwarz|Schwarz, intégrales à paramètre}}, (ii). Montrons $dK\omega + Kd\omega = \omega$ pour $\omega = a\,dx_I$, $I = (i_1, \dots, i_k)$, ce qui suffit : si $d\omega = 0$, alors $\omega = d(K\omega)$.

      En dérivant sous l'intégrale, $dK\omega$ est la somme de deux termes. Le premier provient de la différentielle des coefficients :
      $$\sum_{r} \sum_j (-1)^{r-1}\Big(\int_0^1 t^k\, \partial_j a(tx)\,dt\Big) x_{i_r}\, dx_j \wedge dx_{I \setminus i_r}.$$
      Le second provient de la différentielle des $x_{i_r}$, et vaut $\sum_r (-1)^{r-1}\big(\int_0^1 t^{k-1}a(tx)\,dt\big)\, dx_{i_r} \wedge dx_{I \setminus i_r} = k\big(\int_0^1 t^{k-1}a(tx)\,dt\big)\, dx_I$, puisque ramener $dx_{i_r}$ à sa place coûte $(-1)^{r-1}$.

      D'autre part $d\omega = \sum_j \partial_j a\, dx_j \wedge dx_I$, et $K$ appliqué à $dx_j \wedge dx_I$, suite $(j, i_1, \dots, i_k)$, donne le terme $\big(\int_0^1 t^k \partial_j a(tx)\,dt\big)\, x_j\, dx_I$ pour l'indice $j$, et, pour l'indice $i_r$, le terme $(-1)^r\big(\int_0^1 t^k \partial_j a(tx)\,dt\big)\, x_{i_r}\, dx_j \wedge dx_{I \setminus i_r}$, qui annule le premier terme de $dK\omega$. Il reste
      $$\begin{aligned} dK\omega + Kd\omega &= \Big(\int_0^1 \big(k\,t^{k-1}a(tx) + t^k \textstyle\sum_j x_j\, \partial_j a(tx)\big)\,dt\Big)\, dx_I \\ &= \Big(\int_0^1 \frac{d}{dt}\big(t^k a(tx)\big)\,dt\Big)\, dx_I, \end{aligned}$$
      qui vaut $a(x)\,dx_I$ par le théorème fondamental.
    remarques:
      - |
        Pour $k = 1$ et $\omega = 2xy\,dx + x^2\,dy$ sur $\mathbb R^2$, qui est fermée, $K\omega(x, y) = \int_0^1 \big(2t^2xy \cdot x + t^2x^2 \cdot y\big)\,dt = x^2y$, et l'on vérifie que $d(x^2y) = \omega$. L'opérateur $K$ intègre la forme le long des segments issus de l'origine : c'est la version explicite de la construction du nœud {{gd-integrale-curviligne|Intégrale d'une 1-forme}}, (iii).

        ```schema gd-poincare
        L'étoile $U$ est étoilée par rapport à $0$ : chaque segment $[0, x]$, en rouge, reste dans $U$, et l'opérateur $K$ fait intervenir les valeurs des coefficients aux points $tx$, $t \in [0, 1]$. Elle n'est pas convexe, puisque le segment en pointillé qui joint deux de ses pointes en sort.
        ```
      - |
        L'hypothèse que $U$ est étoilé, ou plus généralement contractile, est essentielle : sur $\mathbb R^2 \setminus \{0\}$, la forme $\frac{x\,dy - y\,dx}{x^2 + y^2}$ est fermée sans être exacte. Le lemme de Poincaré est l'analogue différentiel de la simple connexité des convexes en {{topalg|topologie algébrique}}.

  - id: gd-de-rham
    etiquette: Cohomologie de de Rham
    nature: définition
    titre: Cohomologie de de Rham
    texte: |
      Pour un ouvert $U$ de $\lex{n-uplet}{\mathbb R^n}$, ou une variété, notons $Z^k(U)$ l'espace des formes fermées de degré $k$ et $B^k(U)$ celui des formes exactes, avec $B^0(U) = \{0\}$. Comme $d \circ d = 0$, $B^k(U) \subset Z^k(U)$, et la [[cohomologie-de-rham|cohomologie de de Rham]] est l'espace quotient $\lex{cohomologie-de-rham}{H^k}(U) = Z^k(U)/B^k(U)$.
    enonce: |
      (i) $H^0(U)$ est l'espace des fonctions localement constantes ; si $U$ a $m$ composantes connexes, il est de dimension $m$.

      (ii) Si $U$ est étoilé, $H^k(U) = \{0\}$ pour $k \geqslant 1$, et $H^0(U) \cong \lex{ensemble-reels}{\mathbb R}$.

      (iii) $H^1(\mathbb R^2 \setminus \{0\}) \neq \{0\}$.

      (iv) Une application lisse $\varphi : V \to U$ induit des applications linéaires $\varphi^* : H^k(U) \to H^k(V)$, avec $(\psi \circ \varphi)^* = \varphi^* \circ \psi^*$. Deux ouverts difféomorphes ont des cohomologies isomorphes.
    preuve: |
      (i) $df = 0$ si et seulement si $f$ est constante sur chaque boule, donc sur chaque composante connexe ({{gd-accroissements|Accroissements finis}}, (iii)).

      (ii) Pour $k \geqslant 1$, c'est le lemme de Poincaré ({{gd-poincare|Lemme de Poincaré}}). Si $df = 0$, la fonction $t \mapsto f(tx)$ a une dérivée nulle sur $[0, 1]$, donc $f(x) = f(0)$ : les fonctions localement constantes sur $U$ sont constantes.

      (iii) La forme $\frac{x\,dy - y\,dx}{x^2 + y^2}$ est fermée et n'est pas exacte ({{gd-integrale-curviligne|Intégrale d'une 1-forme}}, remarque) : sa classe n'est pas nulle.

      (iv) $\varphi^*$ commute à $d$ ({{gd-formes|Formes différentielles}}, (iii)), donc envoie formes fermées sur formes fermées et formes exactes sur formes exactes. Si $\varphi$ est un difféomorphisme, $(\varphi^{-1})^*$ est l'application réciproque.
    remarques:
      - |
        On montre que $H^1(\mathbb R^2 \setminus \{0\})$ est de dimension $1$, engendré par la classe de $\frac{x\,dy - y\,dx}{x^2 + y^2}$ : une forme fermée est exacte si et seulement si son intégrale sur le cercle unité est nulle. C'est la traduction différentielle de $\pi_1(\lex{sphere-unite}{S^1}) \cong \lex{ensemble-entiers-relatifs}{\mathbb Z}$ ({{ta-cercle|Groupe fondamental du cercle}}), qui compte les tours.
      - |
        La cohomologie de de Rham est un invariant différentiel, défini avec des formes. Le théorème de de Rham (1931) affirme qu'elle coïncide, pour une variété, avec la cohomologie singulière à coefficients réels, invariant purement topologique ; il est admis ici, et fait l'objet du nœud {{derham|Théorème de de Rham}}, qui relie cette branche à l'{{hom|homologie}}.

