# Niveau 1 : structure interne du nœud « Géométrie différentielle ».
# Le calcul différentiel dans ℝⁿ forme depuis le 28 oct. 2026 une théorie à part (cdiff), parente de
# celle-ci. On construit ici les sous-variétés de ℝⁿ, puis les variétés abstraites, leurs espaces
# tangents et le fibré tangent, l'orientation, et les formes différentielles jusqu'à la cohomologie
# de de Rham.
# Les fonctions trigonométriques et l'exponentielle sont des ancêtres de ce nœud depuis le 2 nov. 2026
# (analyse réelle, chapitres ar-exp et ar-trigo), mais les exemples restent polynomiaux ou rationnels.
# Partitions de l'unité sur une variété et forme volume (3 nov. 2026) : gd-partition (fonctions plateau lues
# dans les cartes, cas compact sans choix, exhaustion par des compacts sans choix, cas d'une suite de cartes
# donnée sans choix, cas général avec un choix dénombrable) et gd-forme-volume (variété orientée, orientable
# ⇔ forme volume, ⋆ seulement hors du cas compact ou d'une suite de cartes directes donnée).
# L'intégrale des formes de degré maximal et la formule de Stokes sur une variété compacte orientée à bord (n ⩾ 2) sont
# au chapitre derham-varietes de la cohomologie de de Rham (3 nov. 2026).

graphe: geod
titre: Géométrie différentielle
conteneur: geod

entrees:
  cdiff: [gd-sous-varietes, gd-formes]
  met: [gd-denombrable]
  alglin: [gd-formes]

noeuds:
  - id: gd-denombrable
    etiquette: Base dénombrable de ℝⁿ
    nature: proposition
    titre: ℝⁿ a une base au plus dénombrable
    enonce: |
      Les boules $B_\infty(c, r)$, pour $c \in \lex{n-uplet}{\mathbb Q^n}$ et $r \in \lex{ensemble-rationnels}{\mathbb Q}$, $r > 0$, forment une base au plus [[denombrable]] de la topologie de $\mathbb R^n$. Toute partie de $\mathbb R^n$, munie de la topologie induite, a une base au plus dénombrable.
    preuve: |
      L'ensemble d'indices $\mathbb Q^n \times \mathbb Q$ est dénombrable ({{q-denombrable|ℚ est dénombrable}}). Soit $O$ ouvert et $x \in O$ : il existe $\varepsilon > 0$ tel que $B_\infty(x, \varepsilon) \subset O$.

      Par densité de $\mathbb Q$ ({{ar-archimede|Archimède, densité de ℚ}}), il existe un rationnel $r \in \,]0, \varepsilon/2[$, puis des rationnels $c_i \in \,]x_i - r, x_i + r[$. Alors $x \in B_\infty(c, r)$, et pour $z \in B_\infty(c, r)$, $\|z - x\|_\infty < 2r < \varepsilon$, donc $B_\infty(c, r) \subset O$. Ainsi $O$ est la réunion des boules de la famille qu'il contient.

      Pour $A \subset \mathbb R^n$, les traces $B \cap A$ de ces boules forment une base de la topologie induite, puisque tout ouvert de $A$ est de la forme $O \cap A$.
    remarques:
      - |
        Aucun choix n'intervient : l'ouvert $O$ est décrit comme la réunion de **toutes** les boules rationnelles qu'il contient, sans qu'on ait à en sélectionner une par point.
      - |
        L'existence d'une base au plus dénombrable sera exigée des variétés ({{gd-varietes|Variétés différentiables}}). Elle exclut des objets localement semblables à $\lex{ensemble-reels}{\mathbb R}$ mais « trop longs », comme la droite longue, obtenue en recollant $\omega_1$ copies de $[0, 1[$.

  - id: gd-sous-varietes
    etiquette: Sous-variétés de ℝⁿ
    nature: théorème
    titre: Sous-variétés de ℝⁿ
    texte: |
      Une partie $M$ de $\lex{n-uplet}{\mathbb R^n}$ est une [[sous-variete|sous-variété]] de dimension $d$, avec $0 \leqslant d \leqslant n$, si pour tout $a \in M$ il existe un ouvert $U$ contenant $a$ et un $C^\infty$-difféomorphisme $\Phi$ de $U$ sur un ouvert de $\mathbb R^n$ tels que
      $$\Phi(U \cap M) = \Phi(U) \cap \big(\mathbb R^d \times \{0\}\big).$$
      Localement, et à difféomorphisme près, $M$ est un morceau de sous-espace vectoriel.

      ```schema gd-sous-varietes
      Pour la courbe $M$ d'équation $y = x^2/2$ dans $\mathbb R^2$, le difféomorphisme $\Phi(x, y) = (x, y - x^2/2)$, de réciproque $(u, v) \mapsto (u, v + u^2/2)$, envoie le disque $U$ sur $\Phi(U)$ et $U \cap M$ sur un segment de l'axe $\mathbb R \times \{0\}$. Les courbes voisines $y - x^2/2 = c$, en gris, deviennent les segments horizontaux $v = c$.
      ```
    enonce: |
      (i) *Équations.* $M$ est une sous-variété de dimension $d$ si et seulement si, pour tout $a \in M$, il existe un ouvert $U$ contenant $a$ et $F : U \to \mathbb R^{n-d}$ de classe $C^\infty$, avec $dF(a)$ surjective, tels que $M \cap U = F^{-1}(0)$.

      (ii) *Graphes.* Le [[graphe-application|graphe]] d'une application $\varphi : \Omega \to \mathbb R^{n-d}$ de classe $C^\infty$ sur un ouvert $\Omega$ de $\mathbb R^d$ est une sous-variété de dimension $d$ de $\mathbb R^n$.

      (iii) La sphère $\lex{sphere-unite}{S^{n-1}} = \{x \in \mathbb R^n : x_1^2 + \cdots + x_n^2 = 1\}$ est une sous-variété de dimension $n - 1$.
    preuve: |
      (i) Si $\Phi$ redresse $M$ près de $a$, $F = (\Phi_{d+1}, \dots, \Phi_n)$ convient : $dF(a)$ est formée des $n - d$ dernières lignes de la [[matrice-inversible|matrice inversible]] $J_\Phi(a)$, donc surjective, et pour $x \in U$, $x \in M$ équivaut à $\Phi(x) \in \mathbb R^d \times \{0\}$, c'est-à-dire à $F(x) = 0$.

      Réciproquement, la forme locale des submersions ({{gd-submersions|Submersions}}, (i)), avec $F(a) = 0$, fournit un ouvert $V \subset U$ contenant $a$ et un difféomorphisme $\Phi$ de $V$ sur un ouvert tels que $F = \pi \circ \Phi$ sur $V$. Pour $x \in V$, $x \in M$ équivaut à $F(x) = 0$, donc à $\Phi(x) \in \mathbb R^d \times \{0\}$.

      (ii) Le graphe est $F^{-1}(0)$ pour $F(x, y) = y - \varphi(x)$ sur $\Omega \times \mathbb R^{n-d}$, et $dF(x, y)(h, \ell) = \ell - d\varphi(x)h$ est surjective, puisque $\ell$ est arbitraire. On applique (i).

      (iii) $S^{n-1} = F^{-1}(0)$ avec $F(x) = \sum x_i^2 - 1$, polynomiale donc $C^\infty$, et $dF(x)h = 2\sum x_i h_i$. Pour $x \in S^{n-1}$, $dF(x)x = 2 \neq 0$ : la [[forme-lineaire|forme linéaire]] $dF(x)$ est surjective sur $\lex{ensemble-reels}{\mathbb R}$.
    remarques:
      - |
        L'erreur la plus répandue est de conclure qu'une partie n'est pas une sous-variété parce qu'une équation particulière qui la définit a une différentielle nulle. La droite $\{y = 0\}$ de $\mathbb R^2$ est l'ensemble des zéros de $F(x, y) = y^2$, dont la différentielle est nulle en tout point de la droite ; c'est pourtant une sous-variété, car $y$ est une meilleure équation.
      - |
        Le groupe orthogonal $O(n) = \{A : {}^tA A = I\}$ est une sous-variété de $\lex{espace-matrices}{\mathcal M_n}(\mathbb R)$, de dimension $n(n - 1)/2$.

        L'application $F(A) = {}^tAA$, à valeurs dans l'espace des matrices symétriques, a pour différentielle
        $$H \mapsto {}^tHA + {}^tAH,$$
        qui est surjective en tout $A \in O(n)$ : pour $S$ symétrique, $H = AS/2$ convient.

        C'est le premier exemple de groupe de Lie, qui rejoint les {{grtop|groupes topologiques}}.

  - id: gd-tangent-sm
    etiquette: Tangent à une sous-variété
    nature: proposition
    titre: Espace tangent à une sous-variété
    texte: |
      Soit $M$ une sous-variété de dimension $d$ de $\lex{n-uplet}{\mathbb R^n}$ et $a \in M$. Un vecteur $v \in \mathbb R^n$ est tangent à $M$ en $a$ s'il existe $\varepsilon > 0$ et une courbe $\gamma : \,]{-\varepsilon}, \varepsilon[ \to \mathbb R^n$ à valeurs dans $M$, dérivable en $0$, avec $\gamma(0) = a$ et $\gamma'(0) = v$. L'ensemble de ces vecteurs est l'[[espace-tangent-sv|espace tangent]] $\lex{espace-tangent-sv}{T_a}M$.
    enonce: |
      Si $\Phi$ redresse $M$ près de $a$, et si $F$ est une équation de $M$ près de $a$ au sens du nœud {{gd-sous-varietes|Sous-variétés de ℝⁿ}}, alors
      $$\begin{aligned} T_aM &= d\Phi(a)^{-1}\big(\mathbb R^d \times \{0\}\big) \\ &= \operatorname{Ker} dF(a). \end{aligned}$$
      En particulier, $T_aM$ est un sous-espace vectoriel de dimension $d$, qui ne dépend ni de $\Phi$ ni de $F$. Pour la sphère, $T_aS^{n-1} = \{h : \sum a_ih_i = 0\}$.

      ```schema gd-tangent-sm
      En $a = (3/5, 4/5)$, la vitesse $\gamma'(0)$ d'une courbe $\gamma$ tracée sur le cercle vérifie $\frac35 h_1 + \frac45 h_2 = 0$ : elle appartient à la droite vectorielle $T_aS^1$, de direction $(4, -3)$, qui passe par $0$ et non par $a$. L'erreur fréquente est de confondre $T_aS^1$ avec la tangente affine $a + T_aS^1$, en pointillé, que l'on dessine d'habitude : l'espace tangent est un sous-espace vectoriel, et la tangente affine n'en est que la translatée.
      ```
    preuve: |
      Soit $\gamma$ comme dans la définition. Étant dérivable en $0$, $\gamma$ y est continue, donc $\gamma(t) \in U \cap M$ pour $|t|$ petit, et $F \circ \gamma = 0$ au voisinage de $0$. La règle de la chaîne donne $dF(a)\gamma'(0) = 0$ : ainsi $T_aM \subset \operatorname{Ker} dF(a)$.

      Réciproquement, soit $v$ tel que $d\Phi(a)v = (w, 0)$. Comme $a \in M$, $\Phi(a) \in \mathbb R^d \times \{0\}$, et pour $|t|$ petit, $\Phi(a) + t(w, 0)$ appartient à l'ouvert $\Phi(U)$ et à $\mathbb R^d \times \{0\}$. La courbe $\gamma(t) = \Phi^{-1}\big(\Phi(a) + t(w, 0)\big)$ est donc à valeurs dans $M$, et $\gamma'(0) = d\Phi(a)^{-1}(w, 0) = v$. On obtient $d\Phi(a)^{-1}(\mathbb R^d \times \{0\}) \subset T_aM$.

      Le premier ensemble est de dimension $d$, image d'un sous-espace de dimension $d$ par un isomorphisme ; le noyau de $dF(a)$ est de dimension $n - (n - d) = d$ par le théorème du rang. Les inclusions $d\Phi(a)^{-1}(\mathbb R^d \times \{0\}) \subset T_aM \subset \operatorname{Ker} dF(a)$ entre espaces de même dimension sont des égalités ({{v-dimension|Dimension}}, (iii)). Pour la sphère, $dF(a)h = 2\sum a_ih_i$.
    remarques:
      - |
        La définition par les courbes est intrinsèque : elle ne fait intervenir ni carte ni équation. La démonstration montre que le résultat ne dépend donc pas du choix de $\Phi$ ou de $F$, ce qui n'aurait rien d'évident si l'on avait défini $T_aM$ comme un noyau.
      - |
        Le calcul différentiel a déjà établi la même égalité, avec des courbes de classe $C^1$, pour l'ensemble de niveau d'une application de classe $C^1$ en un point où elle est une submersion ({{el-niveau|Ensembles de niveau}}) ; c'est sur elle que repose le théorème des multiplicateurs de Lagrange ({{el-lagrange|Multiplicateurs de Lagrange}}). Lorsque cet ensemble de niveau est une sous-variété, les deux définitions donnent le même espace : les courbes de classe $C^1$ sont dérivables en $0$, ce qui donne une inclusion, et les deux espaces sont égaux à $\operatorname{Ker} dg(a)$. Le nœud {{gd-espace-tangent|Espace tangent}} en donnera une troisième définition, par les cartes, valable sur une variété abstraite et isomorphe à celle-ci par son point (iii).

  - id: gd-varietes
    etiquette: Variétés différentiables
    nature: définition
    titre: Variétés différentiables
    texte: |
      Soit $M$ un [[espace-topologique|espace topologique]] et $n \in \lex{ensemble-entiers-naturels}{\mathbb N}$. Une [[carte]] de dimension $n$ est un couple $(U, \varphi)$ où $U$ est un ouvert de $M$ et $\varphi$ un [[homeomorphisme]] de $U$ sur un ouvert de $\lex{n-uplet}{\mathbb R^n}$.

      Deux cartes $(U, \varphi)$ et $(V, \psi)$ sont [[cartes-compatibles|compatibles]] si le changement de carte $\psi \circ \varphi^{-1} : \varphi(U \cap V) \to \psi(U \cap V)$ et sa réciproque sont de classe $C^\infty$ ; ce sont des applications entre ouverts de $\mathbb R^n$.

      ```schema gd-varietes
      La carte $\varphi$ envoie $U$ dans une première copie de $\mathbb R^n$, la carte $\psi$ envoie $V$ dans une seconde, et le chevauchement $U \cap V$, en rouge, a deux images, $\varphi(U \cap V)$ et $\psi(U \cap V)$. Le changement de carte $\psi \circ \varphi^{-1}$ va de l'une à l'autre : c'est une application entre ouverts de $\mathbb R^n$, à laquelle le calcul différentiel s'applique.
      ```

      Un [[atlas]] est une famille de cartes deux à deux compatibles dont les domaines recouvrent $M$.

      Une [[variete-differentiable|variété différentiable]] de dimension $n$ est un espace topologique séparé, ayant une base au plus dénombrable, muni d'un atlas maximal, c'est-à-dire contenu dans aucun autre atlas.
    enonce: |
      Soit $\mathcal A$ un atlas. L'ensemble $\bar{\mathcal A}$ des cartes compatibles avec toutes celles de $\mathcal A$ est un atlas maximal, et c'est le seul atlas maximal qui contienne $\mathcal A$. Deux atlas définissent le même atlas maximal si et seulement si leur réunion est un atlas.

    preuve: |
      Soient $(V, \psi)$ et $(V', \psi')$ dans $\bar{\mathcal A}$, et $z = \psi(p)$ avec $p \in V \cap V'$. Choisissons $(U, \varphi) \in \mathcal A$ telle que $p \in U$. Sur l'ouvert $\psi(V \cap V' \cap U)$, qui contient $z$,
      $$\psi' \circ \psi^{-1} = (\psi' \circ \varphi^{-1}) \circ (\varphi \circ \psi^{-1}),$$
      composée d'applications $C^\infty$ ({{gd-classe-ck|Classe Cᵏ}}, (iii)). La classe $C^\infty$ se vérifiant au voisinage de chaque point, $\psi' \circ \psi^{-1}$ est $C^\infty$ sur $\psi(V \cap V')$.

      Donc $\bar{\mathcal A}$ est un atlas ; il contient $\mathcal A$, dont les cartes sont deux à deux compatibles. Tout atlas $\mathcal B \supset \mathcal A$ est formé de cartes compatibles avec $\mathcal A$, donc $\mathcal B \subset \bar{\mathcal A}$ : cela prouve à la fois que $\bar{\mathcal A}$ est maximal et qu'il est le seul atlas maximal contenant $\mathcal A$.

      Si $\mathcal A \cup \mathcal A'$ est un atlas, son atlas maximal contient $\mathcal A$ et $\mathcal A'$, donc égale $\bar{\mathcal A}$ et $\bar{\mathcal A'}$ ; réciproquement, si $\bar{\mathcal A} = \bar{\mathcal A'}$, alors $\mathcal A \cup \mathcal A' \subset \bar{\mathcal A}$ est un atlas.

      Le choix de $(U, \varphi)$ porte sur un seul point et n'a rien d'un axiome du choix : $\bar{\mathcal A}$ est défini par compréhension.

    remarques:
      - |
        La séparation n'est pas une conséquence de l'existence des cartes. La droite à deux origines, obtenue en recollant deux copies de $\lex{ensemble-reels}{\mathbb R}$ le long de $\mathbb R \setminus \{0\}$, a un atlas de deux cartes compatibles, mais ses deux origines n'ont pas de voisinages disjoints : une suite peut y avoir deux limites.

  - id: gd-exemples-varietes
    etiquette: Exemples de variétés
    nature: proposition
    titre: Ouverts, sous-variétés, sphères et produits
    texte: |
      Les variétés sont celles du nœud {{gd-varietes|Variétés différentiables}} ; pour munir un espace séparé, à base au plus dénombrable, d'une structure de variété, il suffit, par l'énoncé de ce nœud, d'en donner un atlas, qui se complète d'une seule façon en un atlas maximal.
    enonce: |
      (i) Tout ouvert de $\mathbb R^n$ est une variété de dimension $n$, d'atlas $\{\mathrm{id}\}$. Toute sous-variété $M$ de dimension $d$ de $\mathbb R^n$ est une variété de dimension $d$, pour l'atlas des cartes $\big(U \cap M,\ p \circ \Phi|_{U \cap M}\big)$, où $\Phi$ redresse $M$ sur $U$ et $p : \mathbb R^n \to \mathbb R^d$ est la [[projection-produit|projection]] sur les $d$ premières coordonnées.

      (ii) Sur la sphère $\lex{sphere-unite}{S^n} \subset \mathbb R^{n+1}$, les projections stéréographiques $\sigma_\pm(x) = \dfrac{(x_1, \dots, x_n)}{1 \mp x_{n+1}}$, définies hors de $(0, \dots, 0, \pm 1)$, forment un atlas à deux cartes, [[cartes-compatibles|compatible]] avec celui de (i), et, en notant $\|z\|_2^2 = \sum_{i=1}^n z_i^2$ pour $z \in \mathbb R^n$,
      $$\sigma_+^{-1}(z) = \frac{\big(2z,\ \|z\|_2^2 - 1\big)}{\|z\|_2^2 + 1},$$
      $$\sigma_- \circ \sigma_+^{-1}(z) = \frac{z}{\|z\|_2^2} \quad (z \neq 0).$$

      (iii) *Produit.* Soient $M$ et $N$ des variétés de dimensions $m$ et $n$. Muni de la [[topologie-produit]], $M \times N$ est une variété de dimension $m + n$ pour l'atlas des cartes $(U \times V, \varphi \times \psi)$, où $(U, \varphi)$ et $(V, \psi)$ sont des cartes de $M$ et de $N$ : c'est la [[variete-produit|structure produit]]. Si $M \subset \mathbb R^a$ et $N \subset \mathbb R^b$ sont des sous-variétés, $M \times N$ est une sous-variété de $\mathbb R^{a+b}$, et l'atlas de (i) définit la structure produit.

      ```schema gd-exemples-varietes
      Pour $n = 1$ et $x = (3/5, 4/5)$, la droite issue de $N = (0, 1)$ qui passe par $x$ coupe l'axe en $\sigma_+(x) = \frac{3/5}{1 - 4/5} = 3$, et celle issue de $S = (0, -1)$ le coupe en $\sigma_-(x) = \frac{3/5}{1 + 4/5} = \frac13$. On retrouve bien $\sigma_- \circ \sigma_+^{-1}(3) = 3/3^2$, comme l'annonce la formule.
      ```
    preuve: |
      (i) Une partie de $\mathbb R^n$ est séparée et a une base au plus dénombrable ({{t-separe|Espaces séparés}}, (iii), {{gd-denombrable|Base dénombrable de ℝⁿ}}). Pour $\Phi$ redressant $M$ sur $U$, $\varphi = p \circ \Phi|_{U \cap M}$ est une bijection continue de $U \cap M$ sur l'ouvert $\{z \in \mathbb R^d : (z, 0) \in \Phi(U)\}$, de réciproque continue $z \mapsto \Phi^{-1}(z, 0)$.

      Pour deux telles cartes, $\varphi' \circ \varphi^{-1}(z) = p \circ \Phi' \circ \Phi^{-1}(z, 0)$ est une composée d'applications $C^\infty$, et ces cartes recouvrent $M$ par définition d'une sous-variété.

      (ii) Un calcul direct montre que $x = \sigma_+^{-1}(z)$ vérifie $\sum x_i^2 = 1$, $x_{n+1} < 1$ et $\sigma_+(x) = z$, et que $\sigma_-(x) = 2z/(2\|z\|_2^2)$.

      Réciproquement, un point $x$ de $S^n$ distinct de $N = (0, \dots, 0, 1)$ est déterminé par $z = \sigma_+(x)$ : comme $\sum_{i \leqslant n} x_i^2 = 1 - x_{n+1}^2$, on a $\|z\|_2^2 = \frac{1 + x_{n+1}}{1 - x_{n+1}}$, d'où $x_{n+1} = \frac{\|z\|_2^2 - 1}{\|z\|_2^2 + 1}$, puis $x_i = z_i(1 - x_{n+1}) = \frac{2z_i}{\|z\|_2^2 + 1}$, c'est-à-dire $x = \sigma_+^{-1}(z)$. Ainsi $\sigma_+$ est une bijection de $S^n \setminus \{N\}$ sur $\mathbb R^n$, de réciproque $\sigma_+^{-1}$. La symétrie $x \mapsto (x_1, \dots, x_n, -x_{n+1})$, qui conserve $S^n$, échange $\sigma_+$ et $\sigma_-$ : $\sigma_-$ est de même une bijection de $S^n$ privée du pôle sud sur $\mathbb R^n$. Les applications $\sigma_\pm$ sont des restrictions d'applications rationnelles, donc $C^\infty$ sur l'ouvert $\{x_{n+1} \neq \pm 1\}$ de $\mathbb R^{n+1}$, et $\sigma_+^{-1}$ est $C^\infty$ de $\mathbb R^n$ dans $\mathbb R^{n+1}$.

      Pour une carte $\varphi = p \circ \Phi$ de (i), $\sigma_+ \circ \varphi^{-1}(z) = \sigma_+\big(\Phi^{-1}(z, 0)\big)$ et $\varphi \circ \sigma_+^{-1} = p \circ \Phi \circ \sigma_+^{-1}$ sont $C^\infty$ comme composées : les atlas sont compatibles.

      (iii) *Séparation et base.* Deux points distincts $(p, q)$ et $(p', q')$ diffèrent par une coordonnée, disons $p \neq p'$ ; si $O$ et $O'$ sont des voisinages disjoints de $p$ et $p'$, $O \times N$ et $O' \times N$ séparent les deux points.

      Si $(B_i)_{i \in I}$ et $(C_j)_{j \in J}$ sont des bases au plus dénombrables de $M$ et $N$, tout ouvert de $M \times N$ est réunion de produits d'ouverts, donc de parties $B_i \times C_j$ : ces parties forment une base, indexée par $I \times J$, au plus dénombrable puisque $\mathbb N \times \mathbb N$ est dénombrable ({{q-denombrable|ℚ est dénombrable}}, (i)).

      *Cartes.* $\varphi \times \psi$ est une bijection continue de l'ouvert $U \times V$ sur l'ouvert $\varphi(U) \times \psi(V)$ de $\mathbb R^{m+n}$, de réciproque $\varphi^{-1} \times \psi^{-1}$ continue. Les changements de cartes
      $$\begin{aligned} &(\varphi' \times \psi') \circ (\varphi \times \psi)^{-1} \\ &\quad = (\varphi' \circ \varphi^{-1}) \times (\psi' \circ \psi^{-1}) \end{aligned}$$
      ont des composantes $C^\infty$, donc sont $C^\infty$ ({{gd-classe-ck|Classe Cᵏ}}, (ii) et (iii)), et les domaines $U \times V$ recouvrent $M \times N$.

      *Sous-variétés.* La topologie induite par $\mathbb R^{a+b}$ sur $M \times N$ est la topologie produit, les pavés produits d'ouverts formant une base de la topologie de $\mathbb R^{a+b}$ ({{me-rn|L'espace ℝⁿ}}, (i)).

      Si $\Phi$ redresse $M$ sur $U$ (dimension $d$) et $\Phi'$ redresse $N$ sur $U'$ (dimension $e$), soit $\sigma$ la permutation des coordonnées de $\mathbb R^{a+b}$ qui envoie $(z, z', w, w') \in \mathbb R^d \times \mathbb R^{a-d} \times \mathbb R^e \times \mathbb R^{b-e}$ sur $(z, w, z', w')$. Alors $\sigma \circ (\Phi \times \Phi')$ est un $C^\infty$-difféomorphisme de $U \times U'$ sur un ouvert, qui envoie $(U \times U') \cap (M \times N)$ dans $\mathbb R^{d+e} \times \{0\}$, exactement sur la trace de son image.

      Donc $M \times N$ est une sous-variété de dimension $d + e$, et la carte associée par (i) à ce redressement est $(p \circ \Phi) \times (p \circ \Phi')$, produit de deux cartes de $M$ et de $N$.

      Les cartes associées aux redressements produits recouvrent $M \times N$ et forment donc un atlas $\mathcal A_1$, contenu à la fois dans l'atlas de (i) et dans l'atlas produit. Par le nœud {{gd-varietes|Variétés différentiables}}, le seul atlas maximal qui contienne $\mathcal A_1$ est $\bar{\mathcal A_1}$ : les deux atlas ont le même atlas maximal.
    remarques:
      - |
        Toute variété de dimension $n \geqslant 1$ se plonge comme sous-variété dans $\mathbb R^{2n}$ : c'est le théorème de plongement de Whitney (1944), admis ici. Les variétés abstraites ne sont donc pas plus générales que les sous-variétés ; elles libèrent seulement la théorie du choix d'un espace ambiant.
    admis:
      - lieu: remarque
        statut: hors-cadre
        objet: Théorème de plongement de Whitney

  - id: gd-applications-lisses
    etiquette: Applications lisses
    nature: proposition
    titre: Applications lisses entre variétés
    texte: |
      Soient $M$ et $N$ deux variétés. Une application $f : M \to N$ est [[application-lisse|lisse]] si elle est continue et si, pour toutes cartes $(U, \varphi)$ de $M$ et $(V, \psi)$ de $N$ prises dans les atlas maximaux, l'expression en cartes $\psi \circ f \circ \varphi^{-1}$ est de classe $C^\infty$ sur l'ouvert $\varphi(U \cap f^{-1}(V))$. Un [[diffeomorphisme|difféomorphisme]] est une bijection lisse dont la réciproque est lisse.
    enonce: |
      (i) Il suffit de vérifier la condition pour des cartes prises dans des atlas quelconques de $M$ et de $N$.

      (ii) L'identité est lisse, et la composée de deux applications lisses est lisse.

      (iii) Un ouvert $U$ de $M$ est une variété pour les cartes de $M$ de domaine contenu dans $U$, et si $(U, \varphi)$ est une carte, $\varphi$ est un difféomorphisme de $U$ sur $\varphi(U)$. Les fonctions lisses $M \to \lex{ensemble-reels}{\mathbb R}$ forment un anneau $C^\infty(M)$.

      (iv) Entre ouverts de $\lex{n-uplet}{\mathbb R^m}$ et de $\mathbb R^n$, être lisse équivaut à être $C^\infty$. Si $M \subset \mathbb R^m$ et $N \subset \mathbb R^n$ sont des sous-variétés et $F$ une application $C^\infty$ sur un ouvert contenant $M$, avec $F(M) \subset N$, la restriction de $F$ à $M$ est lisse.
    preuve: |
      (i) Si $(U', \varphi')$ et $(V', \psi')$ sont des cartes des atlas maximaux et $p \in U' \cap f^{-1}(V')$, choisissons des cartes $(U, \varphi)$ et $(V, \psi)$ des atlas donnés autour de $p$ et de $f(p)$. Au voisinage de $\varphi'(p)$,
      $$\begin{aligned} &\psi' \circ f \circ \varphi'^{-1} \\ &\quad = (\psi' \circ \psi^{-1}) \circ (\psi \circ f \circ \varphi^{-1}) \\ &\qquad \circ (\varphi \circ \varphi'^{-1}), \end{aligned}$$
      composée d'applications $C^\infty$ ; la continuité de $f$ garantit que les ouverts en jeu sont bien des ouverts. On conclut par le caractère local de la classe $C^\infty$.

      (ii) Si $f : M \to N$ et $g : N \to P$ sont lisses, $g \circ f$ est continue, et au voisinage de chaque point, $\chi \circ g \circ f \circ \varphi^{-1} = (\chi \circ g \circ \psi^{-1}) \circ (\psi \circ f \circ \varphi^{-1})$ pour une carte $(V, \psi)$ de $N$ autour de l'image du point.

      (iii) $U$ est séparé et a une base au plus dénombrable, formée des traces d'une base de $M$. Les cartes de $M$ de domaine contenu dans $U$ recouvrent $U$, puisque la restriction d'une carte à un ouvert de son domaine est une carte [[cartes-compatibles|compatible]] avec l'atlas maximal de $M$ ; elles forment donc un atlas de $U$.

      Cet atlas est maximal : une carte de $U$ compatible avec toutes ses cartes est compatible avec toute carte $(V, \chi)$ de $M$, puisque la compatibilité se vérifie au voisinage de chaque point de l'intersection des domaines, où l'on peut remplacer $\chi$ par sa restriction à $V \cap U$ ; elle appartient donc à l'atlas maximal de $M$, et son domaine est contenu dans $U$.

      L'expression de $\varphi$ dans les cartes $(U', \varphi')$ et $\mathrm{id}$ est $\varphi \circ \varphi'^{-1}$, de classe $C^\infty$, et de même pour $\varphi^{-1}$.

      Dans une carte, $(f + g) \circ \varphi^{-1} = f \circ \varphi^{-1} + g \circ \varphi^{-1}$, et de même pour le produit ({{gd-classe-ck|Classe Cᵏ}}, (iii)).

      (iv) Le premier point découle de (i) avec les atlas $\{\mathrm{id}\}$. Pour le second, avec les cartes du nœud {{gd-exemples-varietes|Exemples de variétés}}, $\psi \circ F \circ \varphi^{-1}(z) = p' \circ \Phi' \circ F \circ \Phi^{-1}(z, 0)$, composée d'applications $C^\infty$.
    remarques:
      - |
        L'erreur la plus répandue est de confondre homéomorphisme lisse et difféomorphisme. Sur $\mathbb R$, les atlas $\{\mathrm{id}\}$ et $\{x \mapsto x^3\}$ ne sont pas compatibles, car $x \mapsto x^{1/3}$ n'est pas dérivable en $0$ : l'identité de $\mathbb R$ n'est pas un difféomorphisme entre ces deux structures.

        Pourtant $f(x) = x^3$ en est un, de la seconde vers la première, puisque son expression en cartes est $x^3 \circ x^{1/3} = \mathrm{id}$ : les deux variétés sont difféomorphes sans être égales.
      - |
        Il existe en revanche des structures réellement distinctes : Milnor a construit en 1956 des variétés homéomorphes à la sphère $\lex{sphere-unite}{S^7}$ mais non difféomorphes à elle. Le type topologique ne détermine pas le type différentiable.

  - id: gd-partition
    etiquette: Partitions de l'unité
    nature: théorème
    titre: Fonctions plateau et partitions de l'unité sur une variété
    texte: |
      Soit $M$ une variété de dimension $n$ : un espace séparé, à base au plus dénombrable, muni d'un atlas maximal ({{gd-varietes|Variétés}}). Une famille $(A_t)_{t \in T}$ de parties de $M$ est [[localement-fini|localement finie]] si tout point de $M$ a un [[voisinage]] qui ne rencontre $A_t$ que pour un nombre fini d'indices $t$.

      Une [[fonction-plateau|fonction plateau]] sur $M$ est une fonction [[application-lisse|lisse]] $g : M \to \lex{ensemble-reels}{\mathbb R}$, nulle hors d'une partie compacte de $M$, sans être identiquement nulle.

      Une [[partition-unite|partition de l'unité]] sur $M$ est une famille $(\chi_t)_{t \in T}$ de fonctions lisses et positives sur $M$, telle que la famille des parties $\{\chi_t \neq 0\}$ soit localement finie et que $\sum_t \chi_t = 1$, la somme n'ayant en chaque point qu'un nombre fini de termes non nuls. Elle est *subordonnée* à une famille d'ouverts $(U_t)_{t \in T}$, indexée par le même ensemble, si l'[[adherence|adhérence]] $\overline{\{\chi_t \neq 0\}}$ est contenue dans $U_t$ pour tout $t$.

      On note $\theta$ la fonction du nœud {{ex-plateau|Fonction plate en 0}}, égale à $\exp(-1/x)$ pour $x > 0$ et nulle pour $x \leqslant 0$. Pour $c \in \lex{n-uplet}{\mathbb R^n}$ et $r > 0$, on pose
      $$\psi_{c,r}(y) = \prod_{l=1}^n \theta\big(r^2 - (y_l - c_l)^2\big),$$
      et l'on note $C(c, r) = \{y : \|y - c\|_\infty \leqslant r\}$ le cube fermé de centre $c$ et de rayon $r$. Si $(U, \varphi)$ est une [[carte]] de $M$ et si $C(c, r) \subset \varphi(U)$, on note $g_{\varphi,c,r}$ la fonction égale à $\psi_{c,r} \circ \varphi$ sur $U$ et nulle sur $M \setminus U$.
    choix: |
      Le point (vi) fait usage du [[choix-denombrable]], à deux endroits : on choisit une carte dont le domaine contient l'ouvert $B_k$, pour chacun des ouverts $B_k$ d'une base dénombrable qui sont contenus dans le domaine d'une carte ; puis, pour chacune des fonctions $\chi_t$, en nombre dénombrable, que fournit (v), on choisit un indice $\alpha$ tel que $V_\alpha$ contienne $\overline{\{\chi_t \neq 0\}}$. Les points (i) à (v) n'utilisent aucun choix : dans (iii), on ne fait qu'un nombre fini de choix, ce que permet $\mathsf{ZF}$ sans axiome du choix, et dans (iv) et (v) chaque objet est désigné par un plus petit indice.
    enonce: |
      (i) *Caractère local.* Soit $(O_\beta)$ une famille d'ouverts de réunion $M$ et $f : M \to \mathbb R^q$. Si chaque restriction $f|_{O_\beta}$ est lisse, $f$ est lisse. Si $(f_t)_{t \in T}$ est une famille de fonctions lisses sur $M$ telle que la famille des $\{f_t \neq 0\}$ soit localement finie, la somme $\sum_t f_t$ est bien définie et lisse. Si $(A_t)$ est une famille localement finie de parties de $M$, l'adhérence de $\bigcup_t A_t$ est la réunion des $\overline{A_t}$.

      (ii) *Fonctions plateau.* La fonction $\psi_{c,r}$ est de classe $C^\infty$ sur $\mathbb R^n$, strictement positive sur le cube ouvert $B_\infty(c, r)$ et nulle en dehors. Si $(U, \varphi)$ est une carte et $C(c, r) \subset \varphi(U)$, la fonction $g_{\varphi,c,r}$ est une fonction plateau positive ; elle est non nulle exactement sur $\varphi^{-1}(B_\infty(c, r))$, et $\overline{\{g_{\varphi,c,r} \neq 0\}}$ est un compact contenu dans $\varphi^{-1}(C(c, r)) \subset U$.

      (iii) *Au voisinage d'un compact.* Soit $K$ une partie compacte de $M$ et $(U_\alpha)_{\alpha \in A}$ une famille d'ouverts dont la réunion contient $K$. Il existe une partie finie $F$ de $A$ et des fonctions lisses et positives $\chi_\alpha$, $\alpha \in F$, telles que chaque $\overline{\{\chi_\alpha \neq 0\}}$ soit compact et contenu dans $U_\alpha$, que $\sum_{\alpha \in F} \chi_\alpha \leqslant 1$ sur $M$, et que $\sum_{\alpha \in F} \chi_\alpha = 1$ sur un ouvert contenant $K$. En particulier, si $M$ est compacte, toute famille d'ouverts $(U_\alpha)_{\alpha \in A}$ de réunion $M$ a une partition de l'unité subordonnée, avec $\chi_\alpha = 0$ pour $\alpha \notin F$.

      (iv) *Exhaustion par des compacts.* Il existe une suite $(K_j)_{j \in \lex{ensemble-entiers-naturels}{\mathbb N}}$ de parties compactes de $M$ telle que $K_j \subset \mathring K_{j+1}$ pour tout $j$, où $\mathring K$ désigne l'[[interieur|intérieur]], et $\bigcup_j K_j = M$. Elle est définie, sans choix, à partir d'une base au plus dénombrable de $M$ indexée par une partie de $\mathbb N$.

      (v) *Cas d'une suite de cartes donnée.* Supposons donnée une famille de cartes $(U_m, \varphi_m)_{m \in J}$, indexée par une partie $J$ de $\mathbb N$, dont les domaines recouvrent $M$, et soit $(V_\alpha)_{\alpha \in A}$ une famille d'ouverts de réunion $M$. Il existe, sans choix, une partition de l'unité $(\chi_t)_{t \in T}$, indexée par une partie $T$ de $\mathbb N \times \mathbb N$, et des indices $m(t) \in J$, tels que chaque $\overline{\{\chi_t \neq 0\}}$ soit un compact contenu dans $U_{m(t)}$ et dans l'un au moins des $V_\alpha$. Si de plus $A$ est une partie de $\mathbb N$, on en déduit, sans choix, une partition de l'unité subordonnée à $(V_\alpha)_{\alpha \in A}$.

      (vi) ⋆ *Cas général.* Toute famille d'ouverts $(V_\alpha)_{\alpha \in A}$ de réunion $M$ a une partition de l'unité subordonnée.
    preuve: |
      (i) *Lissité.* La continuité de $f$ découle de celle des restrictions : si $W$ est un ouvert de $\mathbb R^q$, $f^{-1}(W)$ est la réunion des $(f|_{O_\beta})^{-1}(W)$, ouverts de $O_\beta$, donc de $M$. Soit $(V, \psi)$ une carte de $M$. Pour chaque $\beta$, la restriction de $\psi$ à $V \cap O_\beta$ est une carte de la variété $O_\beta$ ({{gd-applications-lisses|Applications lisses}}, (iii)) ; comme il suffit de lire $f|_{O_\beta}$ dans cette carte et dans la carte $\mathrm{id}$ de $\mathbb R^q$ (même nœud, (i)), $f \circ \psi^{-1}$ est de classe $C^\infty$ sur chacun des ouverts $\psi(V \cap O_\beta)$, qui recouvrent $\psi(V)$.

      Il reste à voir qu'une application $h : O \to \mathbb R^q$, définie sur un ouvert $O$ de $\mathbb R^n$, dont les restrictions aux ouverts $O'_\beta$ d'un recouvrement de $O$ sont de classe $C^k$, est de classe $C^k$. Raisonnons par récurrence sur $k$, pour tous les $q$ à la fois. Pour $k = 0$, la continuité en un point ne dépend que des valeurs au voisinage de ce point. Si les restrictions sont de classe $C^{k+1}$ et si $a \in O'_\beta$, la définition de la différentiabilité en $a$ ({{gd-differentielle|Différentielle}}) ne fait intervenir $h(a + v)$ que pour $v$ petit : $h$ est différentiable en $a$, avec $dh(a) = d(h|_{O'_\beta})(a)$. Ainsi la restriction de $dh$ à $O'_\beta$, vue à valeurs dans $\mathbb R^{qn}$, est $d(h|_{O'_\beta})$, de classe $C^k$ ; par hypothèse de récurrence, $dh$ est de classe $C^k$ sur $O$, et $h$ est de classe $C^{k+1}$ ({{gd-classe-ck|Classe Cᵏ}}).

      *Sommes.* Soit $\mathcal W$ l'ensemble des ouverts de $M$ qui ne rencontrent qu'un nombre fini des parties $\{f_t \neq 0\}$ ; par hypothèse, ils recouvrent $M$, puisque tout voisinage d'un point contient un ouvert contenant ce point. En chaque point, la somme n'a qu'un nombre fini de termes non nuls, et elle a donc un sens ; sur chaque $W \in \mathcal W$, elle est la somme finie des $f_t$ pour lesquels $\{f_t \neq 0\}$ rencontre $W$, lisse puisque $C^\infty(W)$ est un anneau ({{gd-applications-lisses|Applications lisses}}, (iii)). Le premier point, appliqué à la famille $\mathcal W$, conclut : aucun ouvert n'est choisi point par point.

      *Adhérences.* Chaque $\overline{A_t}$ est contenue dans l'adhérence de la réunion. Réciproquement, soit $p$ un point de $\overline{\bigcup_t A_t}$ et $W$ un ouvert contenant $p$ qui ne rencontre que $A_{t_1}, \dots, A_{t_m}$. Si $p$ n'était dans aucun des $\overline{A_{t_i}}$, l'ouvert $W \setminus \big(\overline{A_{t_1}} \cup \cdots \cup \overline{A_{t_m}}\big)$ contiendrait $p$ sans rencontrer aucun $A_t$, ce qui contredirait $p \in \overline{\bigcup_t A_t}$ ({{t-adherence|Intérieur, adhérence}}, (iii)).

      (ii) La fonction $\theta$ a des dérivées successives de tout ordre sur $\mathbb R$ ({{ex-plateau|Fonction plate en 0}}, (ii)). Elle est donc de classe $C^k$ au sens du nœud {{gd-classe-ck|Classe Cᵏ}} pour tout $k$, par récurrence sur $k$ appliquée à toutes les fonctions qui ont cette propriété : $d\theta(x)(h) = h\,\theta'(x)$ ({{gd-differentielle|Différentielle}}, (ii)), et $\theta'$ a encore des dérivées successives de tout ordre. Pour chaque $l$, la fonction $y \mapsto r^2 - (y_l - c_l)^2$ est polynomiale, donc de classe $C^\infty$ ; sa composée avec $\theta$ l'est aussi, ainsi que le produit des $n$ facteurs ({{gd-classe-ck|Classe Cᵏ}}, (iii)). Chaque facteur est positif, et strictement positif si et seulement si $|y_l - c_l| < r$ ({{ex-plateau|Fonction plate en 0}}, (i)) : le produit est strictement positif si et seulement si $\|y - c\|_\infty < r$, et nul sinon.

      Posons $g = g_{\varphi,c,r}$ et $L = \varphi^{-1}(C(c, r))$. Le cube $C(c, r)$ est fermé et borné, donc compact ({{me-rn|L'espace ℝⁿ}}, (iii)), et $\varphi^{-1}$ est continue : $L$ est compact ({{t-compact-prop|Compacts, fermés et images}}, (iii)), donc fermé dans $M$, qui est séparé (même nœud, (ii)). Par ce qui précède, $\{g \neq 0\} = \varphi^{-1}(B_\infty(c, r))$, partie du fermé $L$ ; son adhérence est donc contenue dans $L$, et elle est compacte comme partie fermée d'un compact ({{t-compact-prop|Compacts, fermés et images}}, (i)).

      Sur l'ouvert $U$, $g = \psi_{c,r} \circ \varphi$ est lisse, comme composée de la carte $\varphi$, difféomorphisme de $U$ sur $\varphi(U)$, et de $\psi_{c,r}$, lisse sur $\mathbb R^n$ ({{gd-applications-lisses|Applications lisses}}, (ii) à (iv)). Sur l'ouvert $M \setminus L$, $g$ est nulle. Ces deux ouverts recouvrent $M$, puisque $L \subset U$ : $g$ est lisse par (i). Enfin $g$ est positive, nulle hors du compact $L$, et $g(\varphi^{-1}(c)) = \theta(r^2)^n > 0$.

      (iii) Si $K$ est vide, $F = \varnothing$ convient. Sinon, soit $\mathcal G$ l'ensemble des couples $(g, \alpha)$ formés d'un indice $\alpha \in A$ et d'une fonction $g = g_{\varphi,c,r}$, pour une carte $(U, \varphi)$ et un cube $C(c, r)$ contenu dans $\varphi(U \cap U_\alpha)$. Soit $p \in K$ : il appartient à l'un des $U_\alpha$, et au domaine d'une carte $(U, \varphi)$. L'ensemble $\varphi(U \cap U_\alpha)$ est un ouvert de $\mathbb R^n$ qui contient $\varphi(p)$ ; il contient une boule $B_\infty(\varphi(p), \varepsilon)$ ({{me-rn|L'espace ℝⁿ}}, (i)), donc le cube $C(\varphi(p), \varepsilon/2)$, et $g = g_{\varphi, \varphi(p), \varepsilon/2}$ vérifie $g(p) > 0$, avec $(g, \alpha) \in \mathcal G$. Les ouverts $\{g > 0\}$, pour $(g, \alpha) \in \mathcal G$, recouvrent donc $K$.

      Le compact $K$ est recouvert par un nombre fini d'entre eux, $\{g_1 > 0\}, \dots, \{g_m > 0\}$, avec $(g_j, \alpha_j) \in \mathcal G$. La fonction $S = g_1 + \cdots + g_m$ est lisse, positive, et strictement positive sur $K$. Les ouverts $\{S > 1/k\}$, $k \geqslant 1$, croissent avec $k$ et recouvrent $K$ : un nombre fini d'entre eux suffit, et $K \subset \{S > 1/k\}$ pour un entier $k$, que l'on prend le plus petit possible ({{n-ordre|Bon ordre sur ℕ}}). Posons $\varepsilon = 1/k$ et
      $$D = S + \theta(\varepsilon - S).$$
      $D$ est lisse, comme composée de $S$ avec une fonction de classe $C^\infty$ sur $\mathbb R$, et strictement positive : là où $S \geqslant \varepsilon$, $D \geqslant \varepsilon$ ; là où $S < \varepsilon$, $\theta(\varepsilon - S) > 0$ et $S \geqslant 0$. La fonction $t \mapsto 1/t$ est de classe $C^\infty$ sur $]0, +\infty[$ : elle est dérivable, de dérivée $-1/t^2$ ({{de-operations|Opérations}}, (iii)), et si elle est de classe $C^k$, sa dérivée $-\frac1t \cdot \frac1t$ l'est aussi, comme produit. Ainsi $1/D$ est lisse.

      Soit $F = \{\alpha_1, \dots, \alpha_m\}$ et, pour $\alpha \in F$, $\chi_\alpha = \frac1D \sum_{j : \alpha_j = \alpha} g_j$. Ces fonctions sont lisses et positives, et $\{\chi_\alpha \neq 0\}$ est la réunion des $\{g_j \neq 0\}$ pour $\alpha_j = \alpha$, les $g_j$ étant positives. Son adhérence est la réunion finie des $\overline{\{g_j \neq 0\}}$, compacts contenus dans $U_\alpha$ par (ii) ; elle est compacte, car d'un recouvrement ouvert d'une réunion finie de compacts on extrait un recouvrement fini de chacun d'eux, et séparée comme partie de $M$. Enfin $\sum_{\alpha \in F} \chi_\alpha = S/D \leqslant 1$, avec égalité sur l'ouvert $\{S > \varepsilon\}$, qui contient $K$, puisque $\theta(\varepsilon - S)$ y est nulle.

      Les seuls choix sont ceux des $m$ couples $(g_j, \alpha_j)$ : un nombre fini de choix, que l'on fait l'un après l'autre, sans axiome du choix. Si $M$ est compacte, on prend $K = M$ : la somme vaut $1$ sur $M$, et la famille des $\{\chi_\alpha \neq 0\}$, dont un nombre fini seulement ne sont pas vides, est localement finie.

      (iv) Si $M$ est vide, on prend $K_j = \varnothing$. Sinon, soit $(B_k)_{k \in J_0}$, avec $J_0 \subset \mathbb N$, une base de $M$. Pour $i \in \mathbb N$, posons $O_i = B_i$ si $i \in J_0$ et si $\overline{B_i}$ est compact, et $O_i = \varnothing$ sinon : chaque $O_i$ est un ouvert d'adhérence compacte.

      Les $O_i$ recouvrent $M$. Soit en effet $p \in M$, $(U, \varphi)$ une carte en $p$ et $r > 0$ tel que $C(\varphi(p), r) \subset \varphi(U)$ ; comme en (ii), $L = \varphi^{-1}(C(\varphi(p), r))$ est un compact fermé dans $M$, et il contient l'ouvert $\varphi^{-1}(B_\infty(\varphi(p), r))$, qui contient $p$. Un ouvert $B_i$ de la base vérifie $p \in B_i \subset L$ ; son adhérence, contenue dans le fermé $L$, est compacte ({{t-compact-prop|Compacts, fermés et images}}, (i)), et $O_i = B_i$.

      Pour une partie compacte $K$ de $M$, recouverte par les $O_i$, donc par $O_0 \cup \cdots \cup O_m$ pour un entier $m$, notons $m(K)$ le plus petit tel entier. On définit $K_j$ par récurrence ({{n-recdef|Définition par récurrence}}), en appliquant ce théorème à la suite des couples $(j, K_j)$, de premier terme $(0, \varnothing)$, avec
      $$\begin{aligned} g(j, K) = \Big(&j + 1, \\ &\overline{O_0} \cup \cdots \cup \overline{O_{\max(m(K), j)}}\Big), \end{aligned}$$
      défini pour $K$ compact. Ainsi, avec $m_j = m(K_j)$,
      $$K_{j+1} = \overline{O_0} \cup \cdots \cup \overline{O_{\max(m_j, j)}}.$$
      C'est un compact, réunion finie de compacts, et l'ouvert $O_0 \cup \cdots \cup O_{m_j}$, qui contient $K_j$, est contenu dans $K_{j+1}$ : $K_j \subset \mathring K_{j+1}$. Enfin $O_j \subset K_{j+1}$, d'où $\bigcup_j K_j = M$.

      (v) On peut supposer $M$ non vide. Soit $(K_j)$ la suite de (iv), complétée par $K_{-1} = K_{-2} = \varnothing$ ; elle est croissante, puisque $K_j \subset \mathring K_{j+1} \subset K_{j+1}$. Posons
      $$L_j = K_j \setminus \mathring K_{j-1}, \qquad W_j = \mathring K_{j+1} \setminus K_{j-2}.$$
      $L_j$ est fermé dans le compact $K_j$, donc compact ; $W_j$ est ouvert, $K_{j-2}$ étant compact, donc fermé ; et $L_j \subset W_j$, car $L_j \subset K_j \subset \mathring K_{j+1}$ et $K_{j-2} \subset \mathring K_{j-1}$. Tout point $p$ est dans l'un des $L_j$ : pour le plus petit $j$ tel que $p \in K_j$, on a $p \notin K_{j-1}$.

      Fixons une bijection $s \mapsto (m_s, c_s, r_s)$ de $\mathbb N$ sur $\lex{ensemble-rationnels}{\mathbb Q} \times \mathbb Q^n \times \mathbb Q$ ({{q-denombrable|ℚ est dénombrable}}, (ii)). Disons que $s$ est *admissible pour $j$* si $m_s \in J$, $r_s > 0$ et $C(c_s, r_s) \subset \varphi_{m_s}(U_{m_s} \cap W_j \cap V_\alpha)$ pour au moins un $\alpha \in A$ ; on note alors $g_s = g_{\varphi_{m_s}, c_s, r_s}$, qui ne dépend que de $s$.

      Les ouverts $\{g_s > 0\}$, $s$ admissible pour $j$, recouvrent $L_j$. Soit en effet $p \in L_j$, $m \in J$ tel que $p \in U_m$ et $\alpha$ tel que $p \in V_\alpha$. L'ouvert $\varphi_m(U_m \cap W_j \cap V_\alpha)$ contient une boule $B_\infty(\varphi_m(p), \varepsilon)$. Par densité de $\mathbb Q$ ({{ar-archimede|Archimède, densité de ℚ}}), il existe un rationnel $r \in \,]0, \varepsilon/2[$ et un $c \in \mathbb Q^n$ tel que $\|c - \varphi_m(p)\|_\infty < r$. Alors $\varphi_m(p) \in B_\infty(c, r)$ et, pour $y \in C(c, r)$, $\|y - \varphi_m(p)\|_\infty < 2r < \varepsilon$ : le rang $s$ de $(m, c, r)$ est admissible pour $j$, et $g_s(p) > 0$.

      Par compacité, $L_j$ est recouvert par les $\{g_s > 0\}$, $s$ admissible pour $j$ et $s \leqslant N$, pour un entier $N$ ; soit $N_j$ le plus petit. On pose $T = \{(j, s) : s \text{ admissible pour } j,\ s \leqslant N_j\}$ et, pour $t = (j, s) \in T$, $g_t = g_s$ et $m(t) = m_s$.

      La famille des $\{g_t \neq 0\}$ est localement finie. Pour $t = (j, s)$, $\{g_t \neq 0\} \subset W_j$ par (ii). Un point $p$ appartient à un $K_i$, donc à l'ouvert $\mathring K_{i+1}$, qui ne rencontre aucun $W_j$ pour $j \geqslant i + 3$, puisque $\mathring K_{i+1} \subset K_{j-2}$ ; il ne reste que les indices $(j, s)$ avec $j \leqslant i + 2$ et $s \leqslant N_j$, en nombre fini.

      Par (i), $S = \sum_{t \in T} g_t$ est lisse ; elle est strictement positive, puisque tout point est dans un $L_j$, où l'un des $g_s$, $s \leqslant N_j$, est strictement positif. Les fonctions $\chi_t = g_t/S$ sont lisses et positives, la famille des $\{\chi_t \neq 0\} = \{g_t \neq 0\}$ est localement finie, et $\sum_t \chi_t = 1$. Par (ii), $\overline{\{\chi_t \neq 0\}}$ est un compact contenu dans $\varphi_{m_s}^{-1}(C(c_s, r_s))$, donc dans $U_{m(t)} \cap V_\alpha$ pour un $\alpha$.

      Si $A \subset \mathbb N$, soit $\alpha(t)$, pour $t = (j, s) \in T$, le plus petit $\alpha$ tel que $C(c_s, r_s) \subset \varphi_{m_s}(U_{m_s} \cap W_j \cap V_\alpha)$, et $\chi'_\alpha = \sum_{\alpha(t) = \alpha} \chi_t$. Par (i), $\chi'_\alpha$ est lisse, et $\overline{\{\chi'_\alpha \neq 0\}}$, réunion des adhérences d'une famille localement finie, est contenue dans $V_\alpha$. Un ouvert qui ne rencontre qu'un nombre fini des $\{\chi_t \neq 0\}$ ne rencontre $\{\chi'_\alpha \neq 0\}$ que pour un nombre fini de $\alpha$, et $\sum_\alpha \chi'_\alpha = \sum_t \chi_t = 1$.

      (vi) Soit $(B_k)_{k \in J_0}$, $J_0 \subset \mathbb N$, une base de $M$, et $J$ l'ensemble des $k \in J_0$ tels que $B_k$ soit contenu dans le domaine d'une carte. Les $B_k$, $k \in J$, recouvrent $M$, puisque tout point appartient au domaine d'une carte, ouvert qui contient un $B_k$ contenant ce point. ⋆ Choisissons, pour chaque $k \in J$, une carte $(U_k, \varphi_k)$ telle que $B_k \subset U_k$ : c'est un choix dénombrable. Le point (v) fournit alors une partition de l'unité $(\chi_t)_{t \in T}$, avec $T \subset \mathbb N \times \mathbb N$, dont chaque $\overline{\{\chi_t \neq 0\}}$ est contenu dans l'un au moins des $V_\alpha$. ⋆ Choisissons, pour chaque $t \in T$, un tel indice $\alpha(t)$, ce qui est encore un choix dénombrable, et posons $\chi'_\alpha = \sum_{\alpha(t) = \alpha} \chi_t$. La fin de la démonstration de (v) montre que $(\chi'_\alpha)_{\alpha \in A}$ est une partition de l'unité subordonnée à $(V_\alpha)$.
    remarques:
      - |
        Sur le cercle $\lex{sphere-unite}{S^1}$, muni des projections stéréographiques $\sigma_+$, définie hors de $N = (0, 1)$, et $\sigma_-$, définie hors de $S = (0, -1)$ ({{gd-exemples-varietes|Exemples de variétés}}, (ii)), posons $g_\pm = g_{\sigma_\pm, 0, 2}$, ce qui a un sens puisque $\sigma_\pm$ est une bijection de son domaine sur $\mathbb R$. Sur $S^1 \setminus \{N\}$, $\sigma_+(x)^2 = \frac{x_1^2}{(1 - x_2)^2} = \frac{1 + x_2}{1 - x_2}$, d'où
        $$g_+(x) = \theta\big(4 - \sigma_+(x)^2\big) = \theta\Big(\frac{3 - 5x_2}{1 - x_2}\Big),$$
        qui est strictement positive si et seulement si $x_2 < \frac35$ ; de même, $g_-(x) = \theta\big(\frac{3 + 5x_2}{1 + x_2}\big)$ est strictement positive si et seulement si $x_2 > -\frac35$. La somme $g_+ + g_-$ ne s'annule pas, et $\chi_\pm = g_\pm/(g_+ + g_-)$ forment une partition de l'unité subordonnée au recouvrement $(S^1 \setminus \{N\}, S^1 \setminus \{S\})$ : l'adhérence de $\{\chi_+ \neq 0\}$ est l'arc $x_2 \leqslant \frac35$, qui évite $N$.

        ```schema gd-partition
        À gauche, le cercle $S^1$ : $\chi_+$ est strictement positive sur l'arc bleu, où $x_2 < \frac35$, qui évite le pôle $N$, et $\chi_-$ sur l'arc vert, où $x_2 > -\frac35$, qui évite $S$. À droite, les valeurs de $\chi_+$, en bleu, et de $\chi_-$, en vert, en fonction de la hauteur $x_2$, lue sur le même axe vertical : leur somme vaut $1$ partout, $\chi_+$ vaut $1$ sous la hauteur $-\frac35$, $\chi_-$ au-dessus de $\frac35$, et chacune vaut $\frac12$ à l'équateur, où $g_+ = g_- = \theta(3)$.
        ```

        Les deux fonctions ne dépendent que de la hauteur $x_2$, parce que les cubes $C(0, 2)$ sont centrés en $0$ et que $\sigma_\pm(x)^2$ ne dépend que de $x_2$ ; et $\chi_-$ se déduit de $\chi_+$ par la symétrie $(x_1, x_2) \mapsto (x_1, -x_2)$, qui échange $N$ et $S$.
      - |
        L'erreur la plus répandue est de demander seulement que $\chi_t$ soit nulle hors de $U_t$. Sur $M = \mathbb R$, la fonction $\theta$ est nulle hors de $U = \,]0, +\infty[$, mais l'adhérence de $\{\theta \neq 0\}$ est $[0, +\infty[$, qui n'est pas contenue dans $U$ ; et pour la fonction $e^{2/x}$, définie sur $U$, le produit $\theta(x)e^{2/x} = e^{1/x}$ n'est pas borné près de $0$ et ne se prolonge pas par $0$. La condition $\overline{\{\chi_t \neq 0\}} \subset U_t$ laisse une marge entre la partie où $\chi_t$ n'est pas nulle et le bord de $U_t$ : c'est elle qui permet de prolonger par $0$ un produit $\chi_t f_t$, quel que soit le comportement de $f_t$ près du bord de $U_t$, comme le fera le nœud {{gd-forme-volume|Forme volume}}.
      - |
        Le choix de (vi) ne sert qu'à se donner une suite de cartes qui recouvrent $M$ et à attribuer chaque fonction à un ouvert. Quand une telle suite est donnée, comme pour un ouvert de $\mathbb R^n$ (l'atlas $\{\mathrm{id}\}$), la sphère (deux cartes) ou un produit de telles variétés, le point (v) construit sans aucun choix, pour tout recouvrement ouvert, une partition de l'unité dont chaque fonction est nulle hors d'un compact contenu dans l'un des ouverts, et une partition subordonnée à toute famille d'ouverts recouvrante indexée par une partie de $\mathbb N$ ; quand $M$ est compacte, le point (iii) suffit. La théorie {{derham|Cohomologie de de Rham}} reprend, sur les ouverts de $\mathbb R^n$, une construction explicite de ce genre, par des cubes dont la taille est réglée par la distance au bord ({{dr-recouvrement|Recouvrement par des cubes}}, {{dr-partition|Partition de l'unité}}), parce qu'elle a besoin de propriétés supplémentaires : intersections convexes, bon ordre sur les cubes.
      - |
        Les deux hypothèses de la définition d'une variété servent ici. La base dénombrable fournit l'exhaustion (iv), qui découpe $M$ en couronnes compactes $L_j$ ; la finitude locale vient de ce que la couronne $L_j$ n'est recouverte que par des fonctions non nulles dans $W_j$, et que $W_j$ ne rencontre que les couronnes voisines. La séparation rend fermés les compacts $\varphi^{-1}(C(c, r))$, sans quoi le prolongement par $0$ de (ii) ne serait pas continu : sur la droite à deux origines du nœud {{gd-varietes|Variétés}}, la fonction $g_{\varphi, 0, 1}$, lue dans la carte $\varphi$ de la première origine et prolongée par $0$, vaut $0$ en la seconde origine, mais prend près d'elle des valeurs voisines de $\theta(1)$, sa valeur en la première.

  - id: gd-espace-tangent
    etiquette: Espace tangent
    nature: théorème
    titre: Espace tangent et application linéaire tangente
    texte: |
      Soit $M$ une variété de dimension $n$ et $p \in M$. Sur l'ensemble des triplets $(U, \varphi, v)$ formés d'une carte en $p$ et d'un vecteur $v \in \lex{n-uplet}{\mathbb R^n}$, posons $(U, \varphi, v) \sim (V, \psi, w)$ si
      $$w = d(\psi \circ \varphi^{-1})(\varphi(p))\,v.$$

      L'[[espace-tangent]] $\lex{espace-tangent}{T_p}M$ est l'[[ensemble-quotient]], et pour chaque carte on note $\theta_\varphi : \mathbb R^n \to T_pM$ l'application qui envoie $v$ sur la classe de $(U, \varphi, v)$. Un vecteur tangent est un vecteur de $\mathbb R^n$ défini à changement de carte près.
    enonce: |
      (i) $\sim$ est une relation d'équivalence ; chaque $\theta_\varphi$ est bijective, et il existe une unique structure d'espace vectoriel sur $T_pM$ qui fasse de toutes les $\theta_\varphi$ des isomorphismes. $T_pM$ est de dimension $n$.

      (ii) Si $f : M \to N$ est lisse, l'application $T_pf : T_pM \to T_{f(p)}N$ qui envoie $\theta_\varphi(v)$ sur $\theta_\psi\big(d(\psi \circ f \circ \varphi^{-1})(\varphi(p))v\big)$ est bien définie et linéaire, et $T_p(g \circ f) = T_{f(p)}g \circ T_pf$. Par suite, si $f$ est un difféomorphisme, $T_pf$ est un isomorphisme, et deux ouverts difféomorphes de $\mathbb R^m$ et de $\mathbb R^n$ vérifient $m = n$.

      (iii) Si $M$ est une sous-variété de dimension $d$ de $\mathbb R^n$, l'application $\theta_\varphi(v) \mapsto d(\varphi^{-1})(\varphi(p))v$ est un isomorphisme de $T_pM$ sur l'[[espace-tangent-sv|espace tangent géométrique]] du nœud {{gd-tangent-sm|Tangent à une sous-variété}}.
    preuve: |
      (i) Réflexivité : le changement de carte est [[identite|l'identité]]. Symétrie : $\varphi \circ \psi^{-1}$ est la réciproque de $\psi \circ \varphi^{-1}$, et la règle de la chaîne donne $d(\varphi \circ \psi^{-1})(\psi(p)) = d(\psi \circ \varphi^{-1})(\varphi(p))^{-1}$. Transitivité : la règle de la chaîne appliquée à $\chi \circ \varphi^{-1} = (\chi \circ \psi^{-1}) \circ (\psi \circ \varphi^{-1})$.

      L'application $\theta_\varphi$ est injective, puisque deux triplets de même carte ne sont équivalents que si les vecteurs sont égaux, et surjective, puisque $(V, \psi, w) \sim \big(U, \varphi, d(\varphi \circ \psi^{-1})(\psi(p))w\big)$.

      On transporte la structure de $\mathbb R^n$ par $\theta_\varphi$ ; elle ne dépend pas de la carte, car $\theta_\psi^{-1} \circ \theta_\varphi = d(\psi \circ \varphi^{-1})(\varphi(p))$ est linéaire.

      (ii) Remplacer $\varphi$ et $\psi$ par d'autres cartes multiplie l'expression, à droite et à gauche, par les différentielles des changements de carte ; la règle de la chaîne montre que le résultat définit le même élément de $T_{f(p)}N$. La linéarité se lit dans les cartes, et la formule de composition découle encore de la règle de la chaîne.

      Si $f$ a pour réciproque lisse $g$, alors $T_pf$ et $T_{f(p)}g$ sont réciproques l'une de l'autre, puisque $T_p\,\mathrm{id} = \mathrm{id}$ ; les dimensions sont donc égales, et celle de $T_p$ d'un ouvert de $\mathbb R^m$ est $m$.

      (iii) Avec $\varphi^{-1}(z) = \Phi^{-1}(z, 0)$, $d(\varphi^{-1})(\varphi(p))v = d\Phi(p)^{-1}(v, 0)$ : l'application $\mathbb R^d \to \mathbb R^n$ ainsi définie est injective, d'image $d\Phi(p)^{-1}(\mathbb R^d \times \{0\}) = T_pM$.

      Elle ne dépend pas de la carte, car $\varphi^{-1} = \varphi'^{-1} \circ (\varphi' \circ \varphi^{-1})$ donne
      $$\begin{aligned} d(\varphi^{-1})(\varphi(p)) &= d(\varphi'^{-1})(\varphi'(p)) \\ &\quad \circ d(\varphi' \circ \varphi^{-1})(\varphi(p)), \end{aligned}$$
      ce qui est exactement la relation $\sim$.
    remarques:
      - |
        L'invariance de la dimension par difféomorphisme, obtenue ici en une ligne grâce à la différentielle, a un analogue topologique beaucoup plus difficile : un ouvert de $\mathbb R^m$ n'est homéomorphe à un ouvert de $\mathbb R^n$ que si $m = n$. C'est une conséquence du théorème d'invariance du domaine de Brouwer (1912), dont la démonstration demande la topologie algébrique ; elle est faite dans le chapitre {{hom-jordan|Théorème de Jordan-Brouwer}} de l'homologie ({{hj-invariance-domaine|Invariance du domaine}}).
      - |
        D'autres définitions de $T_pM$ sont en usage : classes de courbes passant par $p$, ou dérivations de l'anneau des germes de fonctions lisses en $p$. Elles sont équivalentes à celle-ci, mais l'équivalence avec les dérivations demande des fonctions plateau, qui sont construites dans une branche voisine de ce graphe, au nœud {{gd-partition|Partitions de l'unité}}.

  - id: gd-fibre-tangent
    etiquette: Fibré tangent
    nature: théorème
    titre: Fibré tangent et champs de vecteurs
    texte: |
      Le [[fibre-tangent|fibré tangent]] d'une variété $M$ de dimension $n$ est l'ensemble $\lex{fibre-tangent}{TM} = \{(p, \xi) : p \in M,\ \xi \in \lex{espace-tangent}{T_p}M\}$, avec la projection $\pi(p, \xi) = p$.

      Pour une carte $(U, \varphi)$, on note $T\varphi : \pi^{-1}(U) \to \varphi(U) \times \lex{n-uplet}{\mathbb R^n}$ la bijection $(p, \xi) \mapsto \big(\varphi(p), \theta_\varphi^{-1}(\xi)\big)$. Un [[champ-vecteurs|champ de vecteurs]] est une application lisse $X : M \to TM$ telle que $\pi \circ X = \mathrm{id}_M$.
    choix: |
      Pour montrer que $TM$ a une base au plus dénombrable, on choisit une carte pour chacun des ouverts d'une base dénombrable de $M$ : c'est un usage du [[choix-denombrable]]. Le reste de la construction n'utilise aucun choix.
    enonce: |
      Il existe une unique [[topologie|topologie]] sur $TM$ pour laquelle chaque $\pi^{-1}(U)$ est ouvert et chaque $T\varphi$ est un homéomorphisme sur l'ouvert $\varphi(U) \times \mathbb R^n$ de $\mathbb R^{2n}$, pour toutes les cartes $(U, \varphi)$ de $M$. Muni des cartes $(\pi^{-1}(U), T\varphi)$, $TM$ est une variété de dimension $2n$, et $\pi$ est lisse.
    preuve: |
      *Changements de carte.* Pour deux cartes, $\tau = \psi \circ \varphi^{-1}$, et $(z, v) \in \varphi(U \cap V) \times \mathbb R^n$,
      $$T\psi \circ T\varphi^{-1}(z, v) = \big(\tau(z),\ d\tau(z)v\big),$$
      puisque $\theta_\psi^{-1} \circ \theta_\varphi = d\tau(\varphi(p))$. C'est une application $C^\infty$ : $z \mapsto d\tau(z)$ est $C^\infty$, et l'évaluation $(A, v) \mapsto Av$ est bilinéaire. Il en va de même de sa réciproque, obtenue en échangeant les cartes.

      *Topologie.* Soit $\mathcal B$ l'ensemble des parties $T\varphi^{-1}(O)$, où $(U, \varphi)$ est une carte et $O$ un ouvert de $\varphi(U) \times \mathbb R^n$. Elles recouvrent $TM$. Notons $\tilde\tau = T\psi \circ T\varphi^{-1}$, continue sur l'ouvert $\varphi(U \cap V) \times \mathbb R^n$. Alors
      $$\begin{aligned} &T\varphi^{-1}(O) \cap T\psi^{-1}(O') \\ &\quad = T\varphi^{-1}\big(O \cap \tilde\tau^{-1}(O')\big), \end{aligned}$$
      et $O \cap \tilde\tau^{-1}(O')$ est ouvert.

      Donc $\mathcal B$ est la base d'une topologie, et le même calcul montre que les ouverts de cette topologie contenus dans $\pi^{-1}(U)$ sont exactement les $T\varphi^{-1}(O)$ : $T\varphi$ est un homéomorphisme.

      Toute topologie ayant les propriétés annoncées contient $\mathcal B$, et chacun de ses ouverts est réunion de ses traces sur les $\pi^{-1}(U)$, qui sont dans $\mathcal B$ : elle est égale à la précédente.

      *Séparation.* Si $p \neq q$, des ouverts disjoints $U'$ et $V'$ de $M$ séparant $p$ et $q$ donnent les ouverts disjoints $\pi^{-1}(U')$ et $\pi^{-1}(V')$. Si $p = q$, les deux points sont dans un même $\pi^{-1}(U)$, [[espaces-homeomorphes|homéomorphe]] à une partie de $\mathbb R^{2n}$, qui est séparée.

      *Base dénombrable.* Soit $(B_k)_{k \in J}$, avec $J \subset \lex{ensemble-entiers-naturels}{\mathbb N}$, une base de $M$, et $K$ l'ensemble des $k$ tels que $B_k$ soit contenu dans le domaine d'une carte ; les $B_k$, $k \in K$, recouvrent $M$.

      Pour chaque $k \in K$, choisissons une carte $\varphi_k$ définie sur $B_k$. Les images réciproques par $T\varphi_k$ des boules rationnelles de $\mathbb R^{2n}$ contenues dans $\varphi_k(B_k) \times \mathbb R^n$ forment une base de $\pi^{-1}(B_k)$ ({{gd-denombrable|Base dénombrable de ℝⁿ}}), indexée par une partie de $K \times \mathbb Q^{2n} \times \lex{ensemble-rationnels}{\mathbb Q}$, qui s'injecte dans $\mathbb N$.

      Tout ouvert $O$ de $TM$ est la réunion des $O \cap \pi^{-1}(B_k)$, et chacun est réunion d'éléments de cette famille.

      *Lissité de $\pi$.* Dans les cartes $T\varphi$ et $\varphi$, l'expression de $\pi$ est $(z, v) \mapsto z$, linéaire.
    remarques:
      - |
        Sur le cercle $\lex{sphere-unite}{S^1} \subset \mathbb R^2$, identifions $T_{(x, y)}S^1$ à la droite orthogonale à $(x, y)$ ({{gd-tangent-sm|Tangent à une sous-variété}}). Le champ $X(x, y) = (-y, x)$ est lisse et ne s'annule nulle part.

        ```schema gd-fibre-tangent
        Aux douze points marqués du cercle, le vecteur $X(x, y) = (-y, x)$, dessiné réduit d'un facteur $0{,}4$, vérifie $x(-y) + yx = 0$ : il est tangent au cercle. Il n'est jamais nul, puisque $(-y, x) = 0$ entraînerait $x = y = 0$, point qui n'est pas sur le cercle.
        ```

        Sur $S^2$, au contraire, tout champ de vecteurs continu s'annule en au moins un point : c'est le théorème de la boule chevelue, de Poincaré et Brouwer. Il est démontré, pour les champs de classe $C^\infty$ sur les sphères de dimension paire, au nœud {{dc-chevelue|Champs tangents aux sphères}}, par la cohomologie de de Rham de $\mathbb R^n \setminus \{0\}$. Le cas des champs seulement continus est démontré au nœud {{cw-degre|Degré}}, (iv), du chapitre d'homologie cellulaire, par le degré topologique, cousin du degré des lacets du nœud {{ta-cercle|Groupe fondamental du cercle}}.
      - |
        Le fibré tangent n'est en général pas un produit : $TS^1$ est difféomorphe à $S^1 \times \lex{ensemble-reels}{\mathbb R}$, grâce au champ précédent qui fournit une base de chaque espace tangent. En revanche, aucun difféomorphisme de $S^2 \times \mathbb R^2$ sur $TS^2$ n'envoie chaque $\{p\} \times \mathbb R^2$ linéairement sur $T_pS^2$ : l'image de la section $p \mapsto (p, (1, 0))$ serait un champ de vecteurs qui ne s'annule pas, ce qu'interdit le théorème de la boule chevelue. L'argument ne dit rien d'un difféomorphisme quelconque entre ces deux variétés : s'il ne respecte ni les fibres ni leur structure linéaire, il ne fournit aucun champ de vecteurs.

  - id: gd-orientation
    etiquette: Orientation
    nature: définition
    titre: Orientation des espaces vectoriels et des variétés
    texte: |
      Deux bases d'un $\lex{ensemble-reels}{\mathbb R}$-espace vectoriel $E$ de dimension $n \geqslant 1$ ont [[meme-orientation|même orientation]] si la [[matrice-passage|matrice de passage]] de l'une à l'autre a un [[determinant|déterminant]] strictement positif. Une [[orientation]] de $E$ est une [[classe-equivalence|classe d'équivalence]] pour cette relation. Un atlas d'une variété est [[atlas-oriente|orienté]] si tous ses changements de carte $\tau$ vérifient $\det d\tau(z) > 0$ en tout point ; une variété est **orientable** si elle possède un atlas orienté.
    enonce: |
      (i) « Avoir même orientation » est une relation d'équivalence sur les bases de $E$, qui a exactement deux classes. Un isomorphisme $u$ de $E$ conserve chaque classe si et seulement si $\det u > 0$.

      (ii) Tout ouvert de $\lex{n-uplet}{\mathbb R^n}$ est orientable. Si $(U, \varphi)$ est une carte et $\rho(z_1, z_2, \dots, z_n) = (-z_1, z_2, \dots, z_n)$, alors $(U, \rho \circ \varphi)$ est une carte, dont les changements de carte avec les autres ont des jacobiens de signe opposé.

      (iii) La sphère $\lex{sphere-unite}{S^n}$, $n \geqslant 1$, est orientable : les cartes $\sigma_+$ et $\rho \circ \sigma_-$ forment un atlas orienté.
    preuve: |
      (i) Si $P$ et $Q$ sont les matrices de passage de $\mathcal B$ à $\mathcal B'$ et de $\mathcal B'$ à $\mathcal B''$, celle de $\mathcal B$ à $\mathcal B''$ est $PQ$, et $\det(PQ) = \det P \det Q$ ({{v-det-matrice|Déterminant d'une matrice}}, (ii)) ; la matrice de passage inverse est $P^{-1}$, de déterminant $1/\det P$.

      Une base $\mathcal B$ et la base obtenue en changeant $e_1$ en $-e_1$ n'ont pas même orientation, la matrice de passage étant de déterminant $-1$, et toute base a même orientation que l'une ou l'autre, selon le signe du déterminant de passage. Enfin, la matrice de passage de $\mathcal B$ à $u(\mathcal B)$ est la [[matrice-application-lineaire|matrice]] de $u$.

      (ii) L'atlas $\{\mathrm{id}\}$ est orienté. $\rho$ est un difféomorphisme linéaire de déterminant $-1$, et $d(\psi \circ (\rho \circ \varphi)^{-1}) = d(\psi \circ \varphi^{-1}) \circ \rho$.

      (iii) Le changement de carte $\sigma_- \circ \sigma_+^{-1}(z) = z/\|z\|_2^2$ ({{gd-exemples-varietes|Exemples de variétés}}, (ii)) a pour différentielle
      $$h \mapsto \|z\|_2^{-2}\big(h - 2\langle u, h \rangle u\big),$$
      avec $u = z/\|z\|_2$ et $\langle u, h \rangle = \sum_i u_ih_i$.

      L'application $h \mapsto h - 2\langle u, h \rangle u$ envoie $u$ sur $-u$ (car $\langle u, u \rangle = 1$) et fixe l'hyperplan $u^\perp = \{h : \langle u, h \rangle = 0\}$ ; dans une base formée de $u$ et d'une base de $u^\perp$, sa matrice est [[matrice-diagonale|diagonale]] de coefficients $-1, 1, \dots, 1$ : le déterminant du changement de carte vaut $-\|z\|_2^{-2n} < 0$. Composer $\sigma_-$ avec $\rho$ change ce signe, par (ii).
    remarques:
      - |
        L'erreur la plus répandue est de croire qu'une orientation est une propriété des vecteurs eux-mêmes. C'est un choix entre deux classes de bases, sans base privilégiée : $\mathbb R^n$ a une orientation « canonique » seulement parce que l'on a choisi sa base canonique.

        Le ruban de Möbius, quotient du ruban $[0, 1] \times \,]{-1}, 1[$ où l'on recolle $(0, y)$ avec $(1, -y)$, est une variété de dimension $2$ non orientable ; ce fait est admis ici.
      - |
        Le signe du déterminant joue ici le rôle que sa valeur absolue joue en théorie de la {{mes|mesure}}, où elle mesure la dilatation des volumes : c'est la formule du changement de variables, démontrée au chapitre {{edo-changement|Changement de variables}} des équations différentielles ({{cv-changement|Changement de variables}}). Le nœud {{gd-forme-volume|Forme volume}} définit les variétés orientées et montre qu'une variété est orientable si et seulement si elle porte une forme volume. L'intégrale d'une forme de degré maximal sur une variété orientée réunit le signe et la valeur absolue du jacobien : définie dans les cartes directes, où les changements de carte ont un jacobien positif, elle ne dépend pas des cartes grâce à la formule du changement de variables. Elle est construite dans la cohomologie de de Rham ({{dv-integrale|Intégrale sur une variété}}), avec une version de cette formule pour l'intégrale de Riemann qui ne demande pas la mesure, et la formule de Stokes y est démontrée pour les variétés orientées à bord de dimension au moins $2$ ({{dv-stokes|Stokes sur une variété}}), comme pour les cubes singuliers lisses ({{dr-stokes|Formule de Stokes}}).
    admis:
      - lieu: remarque
        statut: hors-cadre
        objet: Le ruban de Möbius n'est pas orientable

  - id: gd-formes
    etiquette: Formes différentielles
    nature: théorème
    titre: Formes différentielles et différentielle extérieure
    texte: |
      Soit $U$ un ouvert de $\lex{n-uplet}{\mathbb R^n}$. Une [[forme-differentielle|forme différentielle]] de degré $k$ sur $U$ est une application $\omega$ qui associe à chaque $x \in U$ une forme $\omega_x \in \lex{espace-formes-alternees}{\Lambda^k}(\mathbb R^n)$ ({{v-algebre-exterieure|Algèbre extérieure}}), de la forme
      $$\omega = \sum_I a_I\, dx_I$$
      avec des coefficients $a_I$ de classe $C^\infty$, où $dx_I = dx_{i_1} \wedge \cdots \wedge dx_{i_k}$ et $dx_i$ désigne la $i$-ième forme coordonnée.

      Pour une fonction $f$, de degré $0$, $df = \sum_j \partial_j f\, dx_j$ est sa différentielle. La [[differentielle-exterieure|différentielle extérieure]] est
      $$d\Big(\sum_I a_I\, dx_I\Big) = \sum_I da_I \wedge dx_I.$$
      Pour $\varphi : V \to U$ de classe $C^\infty$, où $V$ est un ouvert de $\mathbb R^m$, l'[[image-reciproque-forme|image réciproque]] est $(\varphi^*\omega)_y = d\varphi(y)^*\,\omega_{\varphi(y)}$.

      Une forme $\omega$ de degré $k$ est [[forme-fermee|fermée]] si $d\omega = 0$ ; pour $k \geqslant 1$, elle est [[forme-exacte|exacte]] s'il existe une forme $\eta$ de degré $k - 1$ telle que $\omega = d\eta$. Par le point (ii), une forme exacte est fermée.
    enonce: |
      (i) $d$ est linéaire, et $d(\omega \wedge \eta) = d\omega \wedge \eta + (-1)^k \omega \wedge d\eta$ pour $\omega$ de degré $k$.

      (ii) $d \circ d = 0$.

      (iii) $\varphi^*(\omega \wedge \eta) = \varphi^*\omega \wedge \varphi^*\eta$, $(\psi \circ \varphi)^* = \varphi^* \circ \psi^*$, et $\varphi^* \circ d = d \circ \varphi^*$.
    preuve: |
      (i) Par linéarité, il suffit de traiter $\omega = a\,dx_I$ et $\eta = b\,dx_J$. Alors $\omega \wedge \eta = ab\,dx_I \wedge dx_J$, et, $dx_I \wedge dx_J$ étant $\pm dx_{I \cup J}$ ou nul,
      $$\begin{aligned} d(\omega \wedge \eta) &= d(ab) \wedge dx_I \wedge dx_J \\ &= (b\,da + a\,db) \wedge dx_I \wedge dx_J. \end{aligned}$$
      Le premier terme est $d\omega \wedge \eta$ ; dans le second, faire passer la forme $db$, de degré $1$, devant $dx_I$, de degré $k$, coûte le signe $(-1)^k$ ({{v-algebre-exterieure|Algèbre extérieure}}, (ii)).

      (ii) Pour une fonction,
      $$\begin{aligned} d(df) &= \sum_{i, j} \partial_i\partial_j f\, dx_i \wedge dx_j \\ &= \sum_{i < j} (\partial_i\partial_j f - \partial_j\partial_i f)\, dx_i \wedge dx_j \\ &= 0 \end{aligned}$$
      par le théorème de Schwarz ({{gd-schwarz|Schwarz, intégrales à paramètre}}).

      En particulier $d(dx_i) = 0$, puis $d(dx_I) = 0$ par (i), et
      $$\begin{aligned} &d(d(a\,dx_I)) = d(da \wedge dx_I) \\ &\quad = d(da) \wedge dx_I - da \wedge d(dx_I) = 0. \end{aligned}$$

      (iii) La première égalité vient de {{v-algebre-exterieure|Algèbre extérieure}}, (iii), point par point, et la deuxième de la règle de la chaîne. Pour une fonction, $\varphi^*f = f \circ \varphi$ et $d(f \circ \varphi) = df \circ d\varphi = \varphi^*(df)$ ; en particulier $\varphi^*(dx_i) = d\varphi_i$.

      Pour $\omega = a\,dx_I$, $\varphi^*\omega = (a \circ \varphi)\, d\varphi_{i_1} \wedge \cdots \wedge d\varphi_{i_k}$, dont la différentielle est, par (i) et (ii),
      $$\begin{aligned} d(a \circ \varphi) \wedge d\varphi_{i_1} \wedge \cdots &= \varphi^*(da) \wedge \varphi^*(dx_I) \\ &= \varphi^*(d\omega). \end{aligned}$$
    remarques:
      - |
        Dans $\mathbb R^3$, en identifiant les $1$-formes et les $2$-formes à des champs de vecteurs, $d$ sur les fonctions est le gradient, $d$ sur les $1$-formes le rotationnel, $d$ sur les $2$-formes la divergence. Les identités $\operatorname{rot}\operatorname{grad} = 0$ et $\operatorname{div}\operatorname{rot} = 0$ de la physique sont deux cas de $d \circ d = 0$.
      - |
        L'égalité $\varphi^* \circ d = d \circ \varphi^*$ dit que $d$ ne dépend pas des coordonnées. C'est elle qui permet de transporter les formes différentielles sur les variétés, au nœud {{gd-formes-varietes|Formes sur une variété}}.

  - id: gd-formes-varietes
    etiquette: Formes sur une variété
    nature: proposition
    titre: Formes différentielles sur une variété, formes volume
    texte: |
      Soit $M$ une variété de dimension $n$. Une forme différentielle de degré $k$ sur $M$ est la donnée, pour chaque carte $(U, \varphi)$, d'une forme $\omega_\varphi$ de degré $k$ sur l'ouvert $\varphi(U)$, ces formes étant compatibles : $\omega_\varphi = \tau^*\omega_\psi$ sur $\varphi(U \cap V)$, où $\tau = \psi \circ \varphi^{-1}$. Une [[forme-volume|forme volume]] est une forme de degré $n$ qui ne s'annule en aucun point.
    enonce: |
      (i) Le produit extérieur et la [[differentielle-exterieure|différentielle extérieure]], définis carte par carte, donnent des formes sur $M$ ; $d \circ d = 0$, et la formule de Leibniz vaut. Une application lisse $f : M \to N$ définit une image réciproque $f^*$, qui commute à $d$ et au produit extérieur.

      (ii) Une forme de degré $n$ s'écrit dans chaque carte $\omega_\varphi = a_\varphi\, dz_1 \wedge \cdots \wedge dz_n$, et $a_\varphi = (a_\psi \circ \tau) \det d\tau$ sur les changements de carte.

      (iii) Si $M$ porte une forme volume, $M$ est orientable.
    preuve: |
      (i) Il suffit de vérifier la compatibilité, c'est-à-dire que $\tau^*$ commute au produit et à $d$ : c'est le nœud {{gd-formes|Formes différentielles}}, (iii). Pour $f$ lisse, on pose $(f^*\omega)_\varphi = (\psi \circ f \circ \varphi^{-1})^*\omega_\psi$ sur l'ouvert $\varphi(U \cap f^{-1}(V))$, pour chaque carte $(V, \psi)$ de $N$. Ces ouverts recouvrent $\varphi(U)$, puisque les domaines des cartes de $N$ recouvrent $N$, et les morceaux se recollent : sur l'intersection de deux d'entre eux, avec $\sigma = \psi' \circ \psi^{-1}$, on a $(\psi' \circ f \circ \varphi^{-1})^*\omega_{\psi'} = (\psi \circ f \circ \varphi^{-1})^*\sigma^*\omega_{\psi'} = (\psi \circ f \circ \varphi^{-1})^*\omega_\psi$, par {{gd-formes|Formes différentielles}}, (iii), et la compatibilité de $\omega$. Les mêmes formules montrent la compatibilité de $f^*\omega$ et ses propriétés.

      (ii) $\tau^*(dz_1 \wedge \cdots \wedge dz_n) = \det d\tau \cdot dz_1 \wedge \cdots \wedge dz_n$, par {{v-algebre-exterieure|Algèbre extérieure}}, (iii).

      (iii) Pour chaque carte $(U, \varphi)$, la fonction $a_\varphi$ est continue et ne s'annule pas ; les ensembles $U^+ = \varphi^{-1}(\{a_\varphi > 0\})$ et $U^- = \varphi^{-1}(\{a_\varphi < 0\})$ sont ouverts.

      Les cartes $(U^+, \varphi)$ et $(U^-, \rho \circ \varphi)$ ({{gd-orientation|Orientation}}, (ii)), pour toutes les cartes de $M$, forment un atlas dans lequel tous les coefficients $a$ sont positifs ; par (ii), tous les changements de carte ont un jacobien de déterminant positif.
    remarques:
      - |
        La réciproque de (iii) est vraie : toute variété orientable porte une forme volume. Le nœud {{gd-forme-volume|Forme volume}} la démontre, en recollant les formes locales $dz_1 \wedge \cdots \wedge dz_n$ des cartes d'un atlas orienté au moyen d'une partition de l'unité subordonnée à cet atlas ({{gd-partition|Partitions de l'unité}}). La preuve de (iii) montre aussi davantage : une forme volume désigne, parmi les atlas orientés, ceux dont les cartes lui donnent un coefficient positif, et le nœud {{gd-forme-volume|Forme volume}} en fait une orientation au sens précis.
      - |
        Sur la sphère $\lex{sphere-unite}{S^2} \subset \mathbb R^3$, la restriction de $x\,dy \wedge dz + y\,dz \wedge dx + z\,dx \wedge dy$ est une forme volume : en un point $a$, sa valeur sur deux vecteurs tangents $v, w$ est $\det(a, v, w)$, non nul si $(v, w)$ est une base du plan $a^\perp$.

  - id: gd-forme-volume
    etiquette: Forme volume
    nature: théorème
    titre: Variétés orientées et formes volume
    texte: |
      Soit $M$ une variété de dimension $n \geqslant 1$. Un [[atlas-oriente|atlas orienté]] ({{gd-orientation|Orientation}}) est *maximal* s'il n'est contenu dans aucun autre atlas orienté. Une *orientation* de $M$ est un atlas orienté maximal, et une [[variete-orientee|variété orientée]] est une variété munie d'une orientation $\mathcal O$ ; les cartes de $\mathcal O$ sont dites *directes*.

      Pour une forme $\omega$ de degré $n$ sur $M$, on note, comme au nœud {{gd-formes-varietes|Formes sur une variété}}, (ii), $\omega_\varphi = a_\varphi\, dz_1 \wedge \cdots \wedge dz_n$ dans chaque carte $(U, \varphi)$. Sur une variété orientée, $\omega$ est *positive* si $a_\varphi > 0$ sur $\varphi(U)$ pour toute carte directe $(U, \varphi)$.

      Pour une fonction lisse $f$ sur $M$, $f\omega$ désigne la forme de coefficients $(f \circ \varphi^{-1})\,a_\varphi$ ; elle est compatible, puisque $f \circ \varphi^{-1} = (f \circ \psi^{-1}) \circ \tau$ avec $\tau = \psi \circ \varphi^{-1}$.
    choix: |
      Le point (iii), pour une variété qui n'est pas compacte et dont aucune suite de cartes directes recouvrant $M$ n'est donnée, s'appuie sur la partition de l'unité de {{gd-partition|Partitions de l'unité}}, (vi), qui fait usage du [[choix-denombrable]]. Les points (i), (ii) et (iv) n'utilisent aucun choix ; le point (iii) n'en fait aucun si $M$ est compacte, par {{gd-partition|Partitions de l'unité}}, (iii), ni si une suite de cartes directes dont les domaines recouvrent $M$ est donnée, par {{gd-partition|Partitions de l'unité}}, (v).
    enonce: |
      (i) Tout atlas orienté $\mathcal A$ est contenu dans une unique orientation, l'ensemble $\mathcal A^+$ des cartes $(U, \varphi)$ de $M$ telles que $\det d(\psi \circ \varphi^{-1}) > 0$ sur $\varphi(U \cap V)$ pour toute carte $(V, \psi)$ de $\mathcal A$. Deux atlas orientés sont contenus dans la même orientation si et seulement si leur réunion est un atlas orienté. Si $\mathcal O$ est une orientation et $\rho$ l'application du nœud {{gd-orientation|Orientation}}, (ii), les cartes $(U, \rho \circ \varphi)$, pour $(U, \varphi) \in \mathcal O$, forment une autre orientation $\bar{\mathcal O}$ lorsque $M$ n'est pas vide.

      (ii) Si $\omega$ est une forme volume, les cartes $(U, \varphi)$ telles que $a_\varphi > 0$ sur $\varphi(U)$ forment une orientation $\mathcal O_\omega$ ; c'est la seule orientation pour laquelle $\omega$ soit positive.

      (iii) ⋆ Pour toute orientation $\mathcal O$ de $M$, il existe une forme volume positive pour $\mathcal O$. Ainsi $M$ est orientable si et seulement si elle porte une forme volume.

      (iv) Si $\omega$ est une forme volume, toute forme $\eta$ de degré $n$ s'écrit d'une seule façon $\eta = f\omega$, avec $f$ lisse sur $M$. La forme $f\omega$ est une forme volume si et seulement si $f$ ne s'annule pas, et elle est positive pour $\mathcal O_\omega$ si et seulement si $f > 0$.
    preuve: |
      (i) Les cartes de $\mathcal A$ sont dans $\mathcal A^+$, puisque $\mathcal A$ est orienté ; les domaines des cartes de $\mathcal A^+$ recouvrent donc $M$. Soient $(U, \varphi)$ et $(U', \varphi')$ dans $\mathcal A^+$ et $p \in U \cap U'$ ; prenons une carte $(V, \psi)$ de $\mathcal A$ en $p$, ce qui ne porte que sur un point et n'est pas un usage du choix. Sur l'ouvert $\varphi(U \cap U' \cap V)$, qui contient $\varphi(p)$,
      $$\varphi' \circ \varphi^{-1} = (\varphi' \circ \psi^{-1}) \circ (\psi \circ \varphi^{-1}).$$
      La différentielle de $\varphi' \circ \psi^{-1}$ en $\psi(q)$ est l'inverse de celle de $\psi \circ \varphi'^{-1}$ en $\varphi'(q)$, par la règle de la chaîne ; son déterminant est donc positif, comme celui de $d(\psi \circ \varphi^{-1})$, et le déterminant d'un produit est le produit des déterminants ({{v-det-matrice|Déterminant d'une matrice}}, (ii)). Ainsi $\det d(\varphi' \circ \varphi^{-1}) > 0$ au voisinage de chaque point de $\varphi(U \cap U')$ : $\mathcal A^+$ est un atlas orienté, qui contient $\mathcal A$.

      Tout atlas orienté $\mathcal B$ qui contient $\mathcal A$ est contenu dans $\mathcal A^+$, par définition de $\mathcal A^+$. En particulier $\mathcal A^+$ est maximal, et toute orientation $\mathcal O \supset \mathcal A$ vérifie $\mathcal O \subset \mathcal A^+$, donc $\mathcal O = \mathcal A^+$ par maximalité de $\mathcal O$. Si $\mathcal A \cup \mathcal A'$ est un atlas orienté, son orientation contient $\mathcal A$ et $\mathcal A'$ et égale donc $\mathcal A^+$ et $\mathcal A'^+$ ; réciproquement, si $\mathcal A^+ = \mathcal A'^+$, la réunion $\mathcal A \cup \mathcal A'$ est contenue dans cet atlas orienté, et elle est orientée.

      Pour $\bar{\mathcal O}$, les changements de carte sont $(\rho \circ \varphi') \circ (\rho \circ \varphi)^{-1} = \rho \circ (\varphi' \circ \varphi^{-1}) \circ \rho$, de déterminant $(-1)^2 \det d(\varphi' \circ \varphi^{-1}) > 0$ : $\bar{\mathcal O}$ est un atlas orienté. Si une carte $\chi$ a des changements de carte de jacobien positif avec toutes les cartes de $\bar{\mathcal O}$, la carte $\rho \circ \chi$ en a avec toutes celles de $\mathcal O$, donc appartient à $\mathcal O$, et $\chi = \rho \circ (\rho \circ \chi) \in \bar{\mathcal O}$ : $\bar{\mathcal O}$ est maximal. Enfin, pour $(U, \varphi) \in \mathcal O$ avec $U \neq \varnothing$, le changement de carte de $\varphi$ à $\rho \circ \varphi$ est $\rho$, de déterminant $-1$ : $\rho \circ \varphi \notin \mathcal O$, et $\bar{\mathcal O} \neq \mathcal O$.

      (ii) Soit $\mathcal P$ l'ensemble des cartes $(U, \varphi)$ telles que $a_\varphi > 0$ sur $\varphi(U)$. La démonstration du nœud {{gd-formes-varietes|Formes sur une variété}}, (iii), montre que les domaines des cartes de $\mathcal P$ recouvrent $M$. Pour deux cartes de $\mathcal P$, la relation $a_\varphi = (a_\psi \circ \tau) \det d\tau$ du même nœud, (ii), donne $\det d\tau = a_\varphi/(a_\psi \circ \tau) > 0$ : $\mathcal P$ est un atlas orienté. Si une carte $(V, \chi)$ a des changements de carte de jacobien positif avec toutes les cartes de $\mathcal P$, alors, au voisinage de chaque point de $\chi(V)$, $a_\chi = (a_\varphi \circ \tau) \det d\tau > 0$ pour une carte $(U, \varphi)$ de $\mathcal P$ et $\tau = \varphi \circ \chi^{-1}$ : $\chi \in \mathcal P$. Ainsi $\mathcal P$ est maximal ; c'est une orientation $\mathcal O_\omega$, pour laquelle $\omega$ est positive par définition. Si $\omega$ est positive pour une orientation $\mathcal O$, alors $\mathcal O \subset \mathcal P$, et $\mathcal O = \mathcal P$ par maximalité.

      (iii) *Une partition de l'unité.* Notons les cartes de $\mathcal O$ par une lettre, $\alpha = (U_\alpha, \varphi_\alpha)$. Il suffit de disposer d'une partition de l'unité $(\chi_t)_{t \in T}$ sur $M$ et, pour chaque $t$, d'une carte directe $\alpha(t)$ telle que $\overline{\{\chi_t \neq 0\}} \subset U_{\alpha(t)}$. Une partition de l'unité subordonnée à $(U_\alpha)_{\alpha \in \mathcal O}$ convient, avec $T = \mathcal O$ et $\alpha(t) = t$ : elle est fournie par {{gd-partition|Partitions de l'unité}}, (vi), et, si $M$ est compacte, sans choix par {{gd-partition|Partitions de l'unité}}, (iii). Si une suite $(U_m, \varphi_m)_{m \in J}$ de cartes directes dont les domaines recouvrent $M$ est donnée, {{gd-partition|Partitions de l'unité}}, (v), fournit sans choix une partition $(\chi_t)$ avec $\overline{\{\chi_t \neq 0\}} \subset U_{m(t)}$, et l'on prend $\alpha(t) = (U_{m(t)}, \varphi_{m(t)})$.

      *Les coefficients.* Pour une carte $(V, \psi)$ de $M$ et $t \in T$, soit $b_{\psi,t}$ la fonction sur $\psi(V)$ égale à
      $$(\chi_t \circ \psi^{-1}) \cdot \det d\big(\varphi_{\alpha(t)} \circ \psi^{-1}\big)$$
      sur $\psi(V \cap U_{\alpha(t)})$, et à $0$ sur $\psi(V \setminus U_{\alpha(t)})$. Elle est de classe $C^\infty$ : elle l'est sur l'ouvert $\psi(V \cap U_{\alpha(t)})$, comme produit de fonctions de classe $C^\infty$, et sur l'ouvert $\psi\big(V \setminus \overline{\{\chi_t \neq 0\}}\big)$, où elle est nulle ; ces deux ouverts recouvrent $\psi(V)$, puisque $\overline{\{\chi_t \neq 0\}} \subset U_{\alpha(t)}$, et (i) du nœud {{gd-partition|Partitions de l'unité}} conclut. Les parties $\{b_{\psi,t} \neq 0\} \subset \psi(V \cap \{\chi_t \neq 0\})$ forment une famille localement finie, image par l'homéomorphisme $\psi$ d'une famille localement finie de $V$ : la somme
      $$a_\psi = \sum_{t \in T} b_{\psi,t}$$
      est de classe $C^\infty$ sur $\psi(V)$, par le même point (i).

      *Compatibilité.* Soient $(V, \psi)$ et $(V', \psi')$ deux cartes et $\tau = \psi' \circ \psi^{-1}$ sur $\psi(V \cap V')$. Sur $\psi(V \cap V' \cap U_{\alpha(t)})$, $\varphi_{\alpha(t)} \circ \psi^{-1} = (\varphi_{\alpha(t)} \circ \psi'^{-1}) \circ \tau$, et la règle de la chaîne donne $b_{\psi,t} = (b_{\psi',t} \circ \tau) \det d\tau$ ; hors de $U_{\alpha(t)}$, les deux membres sont nuls. En sommant, $a_\psi = (a_{\psi'} \circ \tau) \det d\tau$. Comme $\tau^*(a\, dz_1 \wedge \cdots \wedge dz_n) = (a \circ \tau) \det d\tau\, dz_1 \wedge \cdots \wedge dz_n$ ({{gd-formes-varietes|Formes sur une variété}}, (ii)), les formes $\omega_\psi = a_\psi\, dz_1 \wedge \cdots \wedge dz_n$ sont compatibles : elles définissent une forme $\omega$ de degré $n$ sur $M$.

      *Positivité.* Si $\psi \in \mathcal O$, chaque $\det d(\varphi_{\alpha(t)} \circ \psi^{-1})$ est strictement positif, les deux cartes étant directes, et $b_{\psi,t} \geqslant 0$. En $y = \psi(p)$, l'un des $\chi_t(p)$ au moins est strictement positif, puisque leur somme vaut $1$, et alors $p \in U_{\alpha(t)}$ : $a_\psi(y) > 0$. Pour une carte quelconque $(V', \chi)$ et un point $p$ de $V'$, une carte directe $(V, \psi)$ en $p$ donne $a_\chi = (a_\psi \circ \tau) \det d\tau$ au voisinage de $\chi(p)$, avec $\tau = \psi \circ \chi^{-1}$, quantité non nulle. Ainsi $\omega$ est une forme volume, positive pour $\mathcal O$.

      Enfin, si $M$ est orientable, elle a un atlas orienté, contenu dans une orientation par (i), et porte donc une forme volume ; la réciproque est le point (iii) du nœud {{gd-formes-varietes|Formes sur une variété}}.

      (iv) Dans chaque carte, $a_\varphi^\omega$ ne s'annule pas ; posons $f_\varphi = a_\varphi^\eta/a_\varphi^\omega$, de classe $C^\infty$ sur $\varphi(U)$. Les deux coefficients se transforment par le même facteur $\det d\tau$, si bien que $f_\varphi = f_\psi \circ \tau$ : la fonction $f$ égale à $f_\varphi \circ \varphi$ sur chaque $U$ est bien définie sur $M$, et elle est lisse, puisque ses expressions dans les cartes sont les $f_\varphi$. Alors $\eta = f\omega$, et $f$ est la seule fonction qui convienne, puisque $a^\omega_\varphi$ ne s'annule pas. Le coefficient $(f \circ \varphi^{-1})\,a_\varphi^\omega$ ne s'annule pas si et seulement si $f$ ne s'annule pas sur $U$, et il est positif dans les cartes de $\mathcal O_\omega$, où $a^\omega_\varphi > 0$, si et seulement si $f > 0$.
    remarques:
      - |
        Sur le cercle $\lex{sphere-unite}{S^1}$, orienté par l'atlas $\{\sigma_+, \rho \circ \sigma_-\}$ du nœud {{gd-orientation|Orientation}}, (iii), la partition de l'unité $(\chi_+, \chi_-)$ de la première remarque du nœud {{gd-partition|Partitions de l'unité}} donne, par la construction de (iii), une forme volume dont le coefficient dans la carte $\sigma_+$ est
        $$a(z) = \chi_+ + \frac{\chi_-}{z^2},$$
        où $\chi_\pm$ est évaluée en $\sigma_+^{-1}(z)$ : le changement de carte $\rho \circ \sigma_- \circ \sigma_+^{-1}$ est $z \mapsto -1/z$, de dérivée $1/z^2$. Le second terme est nul près de $z = 0$, image du pôle $S$, où $\chi_-$ s'annule. La restriction de $x\,dy - y\,dx$ à $S^1$ est aussi une forme volume : avec $\sigma_+^{-1}(z) = \big(\frac{2z}{z^2 + 1}, \frac{z^2 - 1}{z^2 + 1}\big)$, son coefficient dans la même carte est $\frac{2}{1 + z^2}$. Dans la carte $\rho \circ \sigma_-$, de coordonnée $w$, qui couvre le pôle $N$, les deux coefficients sont de même $\chi_- + \chi_+/w^2$ et $\frac{2}{1 + w^2}$. Ils sont tous strictement positifs : par (iv), les deux formes diffèrent d'un facteur $f > 0$, et elles définissent la même orientation. Au point $(1, 0)$, image de $z = 1$, où $\chi_+ = \chi_- = \frac12$, les deux coefficients valent $1$.
      - |
        La forme volume de (iii) n'a rien de canonique : elle dépend de la partition de l'unité, et (iv) dit exactement quelle est la liberté, un facteur lisse strictement positif. Ce qui est déterminé, c'est l'orientation : (ii), (iii) et (iv) mettent en correspondance les orientations de $M$ et ses formes volume prises à un tel facteur près. L'erreur la plus répandue est de croire qu'une variété orientable a une orientation privilégiée ; il faut en donner une, et (i) montre qu'une variété orientable non vide en a au moins deux. Elle peut en avoir davantage si elle n'est pas connexe : sur une réunion disjointe de deux cercles, on peut retourner l'orientation de l'un sans toucher à l'autre, en composant par $\rho$ les seules cartes directes dont le domaine est contenu dans ce cercle, ce qui donne déjà quatre orientations.
      - |
        Le choix dénombrable de (iii) n'apparaît que si $M$ n'est pas compacte et qu'aucune suite de cartes directes recouvrant $M$ n'est donnée ; il vient du point (vi) du nœud {{gd-partition|Partitions de l'unité}}, et seulement de lui. Pour une variété compacte, cas de la formule de Stokes, ou pour une variété décrite par un nombre fini de cartes directes, comme la sphère orientée par l'atlas de deux cartes du nœud {{gd-orientation|Orientation}}, (iii), la forme volume se construit sans aucun choix.
      - |
        Sur une variété orientée, une forme volume positive est ce que l'on intègre pour définir le volume de $M$. L'intégrale d'une forme de degré maximal sur une variété orientée n'est pas construite dans ce graphe : elle demande la formule du changement de variables, dont le signe de jacobien est fixé par l'orientation. Elle l'est dans la cohomologie de de Rham ({{dv-integrale|Intégrale sur une variété}}), où la formule de Stokes est démontrée pour les variétés compactes orientées à bord de dimension au moins $2$ ({{dv-stokes|Stokes sur une variété}}) ; une forme volume positive d'une variété compacte orientée sans bord y a une intégrale strictement positive, et n'est donc pas exacte.

  - id: gd-integrale-curviligne
    etiquette: Intégrale d'une 1-forme
    nature: proposition
    titre: Intégrale d'une forme de degré 1 le long d'un chemin
    texte: |
      Soit $\omega$ une forme de degré $1$ sur un ouvert $U$ de $\lex{n-uplet}{\mathbb R^n}$ et $\gamma : [a, b] \to U$ un chemin de classe $C^1$ par morceaux. On pose
      $$\int_\gamma \omega = \int_a^b \omega_{\gamma(t)}\big(\gamma'(t)\big)\,dt.$$
      Comme au nœud {{gd-formes|Formes différentielles}}, la forme $\omega$ est [[forme-fermee|fermée]] si $d\omega = 0$ ; elle est [[forme-exacte|exacte]] si $\omega = df$ pour une fonction $f$, ce qui est la définition du nœud {{gd-formes|Formes différentielles}} en degré $1$.
    enonce: |
      (i) $\int_\gamma df = f(\gamma(b)) - f(\gamma(a))$ ; en particulier, l'intégrale d'une forme exacte sur un chemin fermé est nulle.

      (ii) Une forme exacte est fermée.

      (iii) Si $U$ est connexe et si $\int_\gamma \omega = 0$ pour tout chemin fermé $\gamma$ formé de segments, alors $\omega$ est exacte.
    preuve: |
      (i) $\omega_{\gamma(t)}(\gamma'(t)) = (f \circ \gamma)'(t)$ par la règle de la chaîne, et l'on applique le théorème fondamental sur chaque morceau ({{ar-tfa|Théorème fondamental}}).

      (ii) $d(df) = 0$ ({{gd-formes|Formes différentielles}}).

      (iii) Fixons $x_0 \in U$. L'ensemble des points de $U$ reliés à $x_0$ par une ligne brisée contenue dans $U$ est ouvert, car les boules sont [[partie-convexe|convexes]], et son complémentaire aussi ; par connexité, c'est $U$.

      Posons $f(x) = \int_\gamma \omega$ pour une ligne brisée $\gamma$ de $x_0$ à $x$ : la valeur ne dépend pas de la ligne choisie, puisque deux telles lignes forment un chemin fermé.

      Pour $t$ petit, en prolongeant la ligne par le segment $[x, x + te_j]$,
      $$f(x + te_j) - f(x) = \int_0^t \omega_{x + se_j}(e_j)\,ds,$$
      d'où $\partial_j f(x) = \omega_x(e_j)$ par le théorème fondamental : $df = \omega$, et $f$ est $C^\infty$ puisque ses [[derivee-partielle|dérivées partielles]] le sont.
    remarques:
      - |
        Sur $U = \mathbb R^2 \setminus \{0\}$, la forme $\omega = \dfrac{x\,dy - y\,dx}{x^2 + y^2}$ est fermée, comme on le vérifie en calculant $d\omega$.

        Son intégrale sur le bord du carré $[-1, 1]^2$, parcouru dans le sens direct, vaut $4\int_{-1}^1 \frac{dt}{1 + t^2}$, puisque sur chaque côté elle se réduit à $\frac{dt}{1 + t^2}$ : c'est un nombre strictement positif, qui vaut $4 \cdot \frac\pi2 = 2\pi$ ({{tg-arctan|Arc tangente, π}}, (iv)). Donc $\omega$ n'est pas exacte, et (ii) n'a pas de réciproque sur cet ouvert.

        ```schema gd-integrale-curviligne
        Le bord du carré est parcouru dans le sens direct, sans passer par l'origine, qui n'appartient pas à $U$. Chaque côté est paramétré par $t \in [-1, 1]$, par exemple $t \mapsto (1, t)$ à droite, et sur chacun la forme se réduit à $\frac{dt}{1 + t^2}$ : les quatre contributions sont égales et strictement positives.
        ```

        Le nœud {{gd-de-rham|Cohomologie de de Rham}} mesurera ce défaut.
      - |
        Le point (i) est le cas de la dimension $1$ de la formule de Stokes, $\int_c d\omega = \int_{\partial c} \omega$, où le bord d'un chemin est la différence de ses extrémités. Elle est démontrée en tout degré, pour les cubes singuliers lisses, au nœud {{dr-stokes|Formule de Stokes}} de la cohomologie de de Rham.

  - id: gd-poincare
    etiquette: Lemme de Poincaré
    nature: théorème
    titre: Lemme de Poincaré
    enonce: |
      Soit $U$ un ouvert de $\lex{n-uplet}{\mathbb R^n}$ [[partie-etoilee|étoilé]] par rapport à $0$ : $tx \in U$ pour tout $x \in U$ et tout $t \in [0, 1]$. Toute forme [[forme-fermee|fermée]] de degré $k \geqslant 1$ sur $U$ est [[forme-exacte|exacte]].
    preuve: |
      Pour une fonction $a$ et un degré $k \geqslant 1$, posons $c_a(x) = \int_0^1 t^{k-1} a(tx)\,dt$. Définissons l'opérateur $K$, qui abaisse le degré d'une unité, par
      $$\begin{aligned} &K(a\,dx_{j_0} \wedge \cdots \wedge dx_{j_{k-1}}) \\ &\quad = \sum_{r=0}^{k-1} (-1)^r\, c_a\, x_{j_r}\, dx_{J \setminus j_r}, \end{aligned}$$
      où $dx_{J \setminus j_r}$ est le produit des $dx_{j_s}$, $s \neq r$, dans l'ordre.

      La formule est alternée en la suite $(j_0, \dots, j_{k-1})$, donc compatible avec les relations entre les $dx_J$, et définit $K$ par linéarité. Le résultat est $C^\infty$ par le nœud {{gd-schwarz|Schwarz, intégrales à paramètre}}, (ii).

      Montrons $dK\omega + Kd\omega = \omega$ pour $\omega = a\,dx_I$, $I = (i_1, \dots, i_k)$, ce qui suffit : si $d\omega = 0$, alors $\omega = d(K\omega)$.

      En dérivant sous l'intégrale, $dK\omega$ est la somme de deux termes. Le premier provient de la différentielle des coefficients :
      $$\begin{aligned} &\sum_{r} \sum_j (-1)^{r-1}\Big(\int_0^1 t^k\, \partial_j a(tx)\,dt\Big) \\ &\quad x_{i_r}\, dx_j \wedge dx_{I \setminus i_r}. \end{aligned}$$
      Le second provient de la différentielle des $x_{i_r}$, et vaut
      $$\begin{aligned} &\sum_r (-1)^{r-1}\Big(\int_0^1 t^{k-1}a(tx)\,dt\Big)\, dx_{i_r} \\ &\qquad \wedge dx_{I \setminus i_r} \\ &\quad = k\Big(\int_0^1 t^{k-1}a(tx)\,dt\Big)\, dx_I, \end{aligned}$$
      puisque ramener $dx_{i_r}$ à sa place coûte $(-1)^{r-1}$.

      D'autre part $d\omega = \sum_j \partial_j a\, dx_j \wedge dx_I$, et $K$ appliqué à $dx_j \wedge dx_I$, suite $(j, i_1, \dots, i_k)$, donne le terme $\big(\int_0^1 t^k \partial_j a(tx)\,dt\big)\, x_j\, dx_I$ pour l'indice $j$, et, pour l'indice $i_r$, le terme $(-1)^r\big(\int_0^1 t^k \partial_j a(tx)\,dt\big)\, x_{i_r}\, dx_j \wedge dx_{I \setminus i_r}$, qui annule le premier terme de $dK\omega$.

      Il reste
      $$\begin{aligned} &dK\omega + Kd\omega \\ &\quad = \Big(\int_0^1 \big(k\,t^{k-1}a(tx) \\ &\qquad\quad + t^k \textstyle\sum_j x_j\, \partial_j a(tx)\big)\,dt\Big)\, dx_I \\ &\quad = \Big(\int_0^1 \frac{d}{dt}\big(t^k a(tx)\big)\,dt\Big)\, dx_I, \end{aligned}$$
      qui vaut $a(x)\,dx_I$ par le théorème fondamental.
    remarques:
      - |
        Pour $k = 1$ et $\omega = 2xy\,dx + x^2\,dy$ sur $\mathbb R^2$, qui est fermée, on a
        $$\begin{aligned} K\omega(x, y) &= \int_0^1 \big(2t^2xy \cdot x + t^2x^2 \cdot y\big)\,dt \\ &= x^2y, \end{aligned}$$
        et l'on vérifie que $d(x^2y) = \omega$. L'opérateur $K$ intègre la forme le long des segments issus de l'origine : c'est la version explicite de la construction du nœud {{gd-integrale-curviligne|Intégrale d'une 1-forme}}, (iii).

        ```schema gd-poincare
        L'étoile $U$ est étoilée par rapport à $0$ : chaque segment $[0, x]$, en rouge, reste dans $U$, et l'opérateur $K$ fait intervenir les valeurs des coefficients aux points $tx$, $t \in [0, 1]$. Elle n'est pas convexe, puisque le segment en pointillé qui joint deux de ses pointes en sort.
        ```
      - |
        L'hypothèse que $U$ est étoilé, ou plus généralement contractile, est essentielle : sur $\mathbb R^2 \setminus \{0\}$, la forme $\frac{x\,dy - y\,dx}{x^2 + y^2}$ est fermée sans être exacte. Le lemme de Poincaré est l'analogue différentiel de la simple connexité des convexes en {{topalg|topologie algébrique}}.

  - id: gd-de-rham
    etiquette: Cohomologie de de Rham
    nature: définition
    titre: Cohomologie de de Rham
    texte: |
      Pour un ouvert $U$ de $\lex{n-uplet}{\mathbb R^n}$, notons $Z^k(U)$ l'espace des formes [[forme-fermee|fermées]] de degré $k$ et $B^k(U)$ celui des formes [[forme-exacte|exactes]], avec $B^0(U) = \{0\}$. Comme $d \circ d = 0$, $B^k(U) \subset Z^k(U)$, et la [[cohomologie-de-rham|cohomologie de de Rham]] est l'espace quotient $\lex{cohomologie-de-rham}{H^k}(U) = Z^k(U)/B^k(U)$.
    enonce: |
      (i) $H^0(U)$ est l'espace des fonctions localement constantes ; si $U$ a $m$ composantes connexes, il est de dimension $m$.

      (ii) Si $U$ est [[partie-etoilee|étoilé]] par rapport à $0$, $H^k(U) = \{0\}$ pour $k \geqslant 1$, et, si $U$ est non vide, $H^0(U) \cong \lex{ensemble-reels}{\mathbb R}$.

      (iii) $H^1(\mathbb R^2 \setminus \{0\}) \neq \{0\}$.

      (iv) Une application $\varphi : V \to U$ de classe $C^\infty$, où $V$ est un ouvert de $\mathbb R^m$, induit des applications linéaires $\varphi^* : H^k(U) \to H^k(V)$, avec $(\psi \circ \varphi)^* = \varphi^* \circ \psi^*$. Deux ouverts difféomorphes ont des cohomologies isomorphes.
    preuve: |
      (i) $df = 0$ si et seulement si $f$ est constante sur chaque boule, donc sur chaque composante connexe ({{gd-accroissements|Accroissements finis}}, (iii)).

      Chaque composante connexe $C$ de $U$ est ouverte : elle contient, avec chacun de ses points, une boule contenue dans $U$, qui est connexe puisqu'elle est [[partie-convexe|convexe]]. L'indicatrice de $C$ est donc localement constante. Si $U$ a $m$ composantes $C_1, \dots, C_m$, les indicatrices $\mathbf 1_{C_j}$ sont linéairement indépendantes, puisque les $C_j$ sont non vides et disjointes, et toute fonction localement constante $f$ s'écrit $\sum_j f(c_j)\,\mathbf 1_{C_j}$, avec $c_j \in C_j$ : elles forment une base, et $H^0(U)$ est de dimension $m$.

      (ii) Pour $k \geqslant 1$, c'est le lemme de Poincaré ({{gd-poincare|Lemme de Poincaré}}). Si $U$ est non vide, il contient $0 = 0 \cdot x$ pour un $x \in U$, puisqu'il est étoilé par rapport à $0$. Si $df = 0$, la fonction $t \mapsto f(tx)$ a une dérivée nulle sur $[0, 1]$, donc $f(x) = f(0)$ : les fonctions localement constantes sur $U$ sont constantes, et $H^0(U) \cong \mathbb R$.

      (iii) La forme $\frac{x\,dy - y\,dx}{x^2 + y^2}$ est fermée et n'est pas exacte ({{gd-integrale-curviligne|Intégrale d'une 1-forme}}, remarque) : sa classe n'est pas nulle.

      (iv) $\varphi^*$ commute à $d$ ({{gd-formes|Formes différentielles}}, (iii)), donc envoie formes fermées sur formes fermées et formes exactes sur formes exactes. Si $\varphi$ est un difféomorphisme, $(\varphi^{-1})^*$ est l'application réciproque.
    remarques:
      - |
        L'espace $H^1(\mathbb R^2 \setminus \{0\})$ est de dimension $1$, engendré par la classe de $\frac{x\,dy - y\,dx}{x^2 + y^2}$ : une forme fermée est exacte si et seulement si son intégrale sur le bord du carré $[-1, 1]^2$ est nulle. La théorie {{derham|Cohomologie de de Rham}} le démontre de deux façons : en comparant $H^1$ à l'homologie ({{dr-degre1|De Rham en degré 1}}), et par la suite de Mayer-Vietoris des formes ({{dc-epointe|ℝⁿ privé de l'origine}}), qui donne aussi $H^k(\mathbb R^n \setminus \{0\})$ en tout degré ; le critère du bord du carré est, pour $n = 2$, le point (iii) du nœud {{dc-angle-solide|Forme angle solide}}. C'est la traduction différentielle de $\pi_1(\lex{sphere-unite}{S^1}) \cong \lex{ensemble-entiers-relatifs}{\mathbb Z}$ ({{ta-cercle|Groupe fondamental du cercle}}), qui compte les tours.
      - |
        La cohomologie de de Rham est un invariant différentiel, défini avec des formes ; la même définition a un sens sur une variété, avec les formes du nœud {{gd-formes-varietes|Formes sur une variété}}, puisque $d \circ d = 0$ y vaut encore. Le théorème de de Rham (1931) affirme qu'elle coïncide, pour une variété, avec la cohomologie singulière à coefficients réels, invariant purement topologique ; il fait l'objet de la théorie {{derham|Cohomologie de de Rham}}, qui le démontre pour les ouverts de $\mathbb R^n$ : en degré $1$ sous la forme $H^1(U) \cong \operatorname{Hom}(H_1(U), \mathbb R)$, le dual de l'homologie tenant lieu de cohomologie singulière, puis en tout degré ({{dt-theoreme|De Rham en tout degré}}), avec les cochaînes singulières lisses ; il relie ainsi cette branche à l'{{hom|homologie}}.

