# Niveau 1 : structure interne du nœud ℤ.
# ℤ est le symétrisé du monoïde (ℕ, +), muni de la multiplication induite.
# Il repose sur ℕ (propriétés des opérations) et sur les structures algébriques (symétrisé, idéaux, quotients).

graphe: z
titre: Les entiers relatifs
conteneur: z

entrees:
  n: [z-construction]
  alg: [z-construction]

noeuds:
  - id: z-construction
    etiquette: Construction de ℤ
    nature: théorème
    titre: ℤ, symétrisé de ℕ
    enonce: |
      Le monoïde $(\lex{ensemble-entiers-naturels}{\mathbb N}, +)$ est commutatif et tout élément y est régulier ({{n-proprietes|Propriétés des opérations}}). Son [[groupe-symetrise|symétrisé]] est noté $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ : c'est le quotient de $\mathbb N \times \mathbb N$ par
      $$(a, b) \sim (c, d) \iff a + d = b + c,$$
      muni de l'addition des représentants. C'est un groupe abélien, et $\iota : \mathbb N \to \mathbb Z$, $n \mapsto \overline{(n, 0)}$, est injective et additive ; on identifie désormais $n$ et $\iota(n)$.

      Tout élément de $\mathbb Z$ s'écrit $n$ ou $-n$ avec $n \in \mathbb N$, et ces deux écritures ne coïncident que pour $0$.
    preuve: |
      La première partie est le théorème du nœud {{a-symetrise|Symétrisation}}. Soit $\overline{(a, b)} \in \mathbb Z$. L'ordre de $\mathbb N$ étant total, $b \leqslant a$ ou $a \leqslant b$. Dans le premier cas, $a = b + k$ ({{n-proprietes|Propriétés des opérations}}), et $(a, b) \sim (k, 0)$ puisque $a + 0 = b + k$ : la classe est $\iota(k)$. Dans le second, $b = a + k$ et $(a, b) \sim (0, k)$, dont la classe est $-\iota(k)$.

      Si $\iota(k) = -\iota(k')$, alors $\iota(k + k') = 0$, donc $k + k' = 0$ par injectivité, et $k = k' = 0$.
    remarques:
      - |
        La classe de $(a, b)$ représente la « différence » $a - b$. On ne peut pas la définir directement, puisque $a - b$ n'existe pas dans $\mathbb N$ quand $a < b$ ; on la remplace par l'ensemble de tous les couples qui devraient avoir la même différence.

        ```schema z-construction
        Chaque droite oblique réunit les couples $(a, b)$ d'une même classe, ceux qui devraient avoir la même différence, notée au bout de la droite. Le représentant rouge de chaque classe est $(k, 0)$ ou $(0, k)$, comme dans la preuve : il identifie la classe à $k$ ou à $-k$.
        ```

  - id: z-anneau
    etiquette: Anneau ℤ
    nature: théorème
    titre: ℤ est un anneau commutatif intègre
    enonce: |
      La formule $(a, b) \cdot (c, d) = (ac + bd,\ ad + bc)$ définit sur $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ une multiplication qui en fait un [[anneau]] commutatif [[anneau-integre|intègre]], de neutre $1 = \iota(1)$. L'injection $\iota : \lex{ensemble-entiers-naturels}{\mathbb N} \to \mathbb Z$ respecte la multiplication.
    preuve: |
      *Bonne définition.* Supposons $a + b' = a' + b =: s$. Alors, dans $\mathbb N$,
      $$(ac + bd) + (a'd + b'c) = c(a + b') + d(a' + b) = (c + d)s,$$
      $$(ad + bc) + (a'c + b'd) = c(a' + b) + d(a + b') = (c + d)s.$$
      Les deux membres de gauche sont égaux, c'est-à-dire $(ac + bd,\ ad + bc) \sim (a'c + b'd,\ a'd + b'c)$. La formule étant symétrique en ses deux arguments, il en va de même pour le second, et la multiplication est définie sur les classes par son graphe ({{a-quotient|Groupe quotient}}).

      *Axiomes.* Chacun se ramène, sur les représentants, à une identité entre entiers naturels qui découle des propriétés du nœud {{n-proprietes|Propriétés des opérations}}. Ainsi, la commutativité est évidente sur la formule ; pour l'associativité, les deux produits $((a, b)(c, d))(e, f)$ et $(a, b)((c, d)(e, f))$ ont pour première composante $ace + adf + bcf + bde$ et pour seconde $acf + ade + bce + bdf$ ; la distributivité se vérifie de même. Le couple $(1, 0)$ est neutre, et $(a, 0)(c, 0) = (ac, 0)$ montre que $\iota$ respecte le produit.

      *Intégrité.* On a $1 \neq 0$, puisque $\iota$ est injective. Écrivons $x = \pm m$ et $y = \pm n$ avec $m, n \in \mathbb N$ ({{z-construction|Construction de ℤ}}). Alors $xy = \pm mn$, par les règles de signes d'un anneau ({{a-anneau|Anneau}}). Si $xy = 0$, alors $mn = 0$, donc $m = 0$ ou $n = 0$ ({{n-proprietes|Propriétés des opérations}}), c'est-à-dire $x = 0$ ou $y = 0$.
    remarques:
      - |
        La formule du produit n'est pas arbitraire : c'est celle qu'imposent la distributivité et les règles de signes, si l'on pense $(a, b)$ comme $a - b$, puisque $(a - b)(c - d) = (ac + bd) - (ad + bc)$. La construction donne un sens à ce calcul sans le présupposer.

  - id: z-ordre
    etiquette: Ordre de ℤ
    nature: proposition
    titre: L'ordre de ℤ
    texte: |
      Pour $x, y \in \lex{ensemble-entiers-relatifs}{\mathbb Z}$, on pose $x \leqslant y$ si $y - x \in \lex{ensemble-entiers-naturels}{\mathbb N}$. La **valeur absolue** de $x$ est $|x| = x$ si $x \in \mathbb N$, et $|x| = -x$ sinon.
    enonce: |
      (i) C'est un [[ordre-total|ordre total]] sur $\mathbb Z$, qui prolonge celui de $\mathbb N$, et qui est compatible avec les opérations : $x \leqslant y$ entraîne $x + z \leqslant y + z$, et $0 \leqslant x$, $0 \leqslant y$ entraînent $0 \leqslant xy$.

      (ii) Toute partie non vide et minorée de $\mathbb Z$ a un plus petit élément ; toute partie non vide et majorée a un plus grand élément.

      (iii) $|xy| = |x|\,|y|$ et $|x + y| \leqslant |x| + |y|$.
    preuve: |
      (i) Réflexivité : $0 \in \mathbb N$. Antisymétrie : si $y - x = m$ et $x - y = n$ sont dans $\mathbb N$, alors $m + n = 0$, donc $m = n = 0$. Transitivité : $\mathbb N$ est stable par addition. Totalité : $y - x$ s'écrit $n$ ou $-n$ avec $n \in \mathbb N$ ({{z-construction|Construction de ℤ}}). Pour $m, n \in \mathbb N$, $n - m \in \mathbb N$ équivaut à l'existence de $k$ avec $m + k = n$, c'est-à-dire à $m \leqslant n$ dans $\mathbb N$ ({{n-proprietes|Propriétés des opérations}}). Enfin $(y + z) - (x + z) = y - x$, et $\mathbb N$ est stable par produit.

      (ii) Soit $A$ non vide, minorée par $m$. L'ensemble $\{a - m : a \in A\}$ est une partie non vide de $\mathbb N$ ; il a un plus petit élément $k$ ({{n-ordre|Bon ordre sur ℕ}}), et $m + k$ est le plus petit élément de $A$. Pour une partie majorée, on applique ce résultat à $\{-a : a \in A\}$.

      (iii) Les deux membres de la première égalité valent $mn$ si $x = \pm m$ et $y = \pm n$. Pour la seconde, $-|x| \leqslant x \leqslant |x|$ et de même pour $y$ ; en ajoutant, $-(|x| + |y|) \leqslant x + y \leqslant |x| + |y|$, ce qui donne l'inégalité.
    remarques:
      - |
        Contrairement à $\mathbb N$, $\mathbb Z$ n'est pas bien ordonné : la partie $\mathbb Z$ elle-même n'a pas de plus petit élément, puisque $x - 1 < x$. Le point (ii) est la forme du bon ordre qui subsiste : il suffit d'imposer un minorant.
      - |
        Un anneau commutatif muni d'un ordre total compatible au sens de (i) est un anneau totalement ordonné. Avec la notion de corps, cela donnera la définition de [[corps-ordonne|corps ordonné]] au nœud {{q-ordre|Ordre de ℚ}}.

  - id: z-division
    etiquette: Division euclidienne
    nature: théorème
    titre: Division euclidienne
    enonce: |
      Pour tous $a \in \lex{ensemble-entiers-relatifs}{\mathbb Z}$ et $b \in \lex{ensemble-entiers-naturels}{\mathbb N} \setminus \{0\}$, il existe un unique couple $(q, r) \in \mathbb Z \times \mathbb N$ tel que
      $$a = bq + r \quad \text{et} \quad 0 \leqslant r < b.$$
      C'est la [[division-euclidienne|division euclidienne]] de $a$ par $b$ ; $q$ est le quotient et $r$ le reste.
    preuve: |
      *Existence.* L'ensemble $R = \{a - bq : q \in \mathbb Z\} \cap \mathbb N$ est non vide : pour $q = -|a|$, on a $a + b|a| \geqslant a + |a| \geqslant 0$, puisque $b \geqslant 1$. Soit $r$ son plus petit élément ({{n-ordre|Bon ordre sur ℕ}}), $r = a - bq$. Si l'on avait $r \geqslant b$, alors $r - b = a - b(q + 1)$ appartiendrait à $R$ et serait plus petit que $r$. Donc $r < b$.

      *Unicité.* Si $bq + r = bq' + r'$ avec $0 \leqslant r, r' < b$, alors $b\,|q - q'| = |r' - r| < b$ ({{z-ordre|Ordre de ℤ}}). Un entier naturel $|q - q'|$ tel que $b\,|q - q'| < b$ est nul, donc $q = q'$, puis $r = r'$.
    remarques:
      - |
        L'erreur la plus répandue concerne les dividendes négatifs : la division de $-7$ par $3$ donne $q = -3$ et $r = 2$, car $-7 = 3 \cdot (-3) + 2$, et non $q = -2$, $r = -1$, puisque le reste doit être positif.

        ```schema z-division
        Les multiples de $3$ sont en bleu. Le bon quotient est $q = -3$ : on part de $3 \cdot (-3) = -9$, en dessous de $-7$, et l'on avance de $r = 2$. Partir de $-6$, au-dessus de $-7$, donnerait $r = -1$, refusé puisque le reste doit vérifier $0 \leqslant r < 3$.
        ```

  - id: z-ideaux
    etiquette: Idéaux de ℤ
    nature: théorème
    titre: Les idéaux de ℤ sont principaux
    texte: |
      Un anneau intègre dont tout idéal est principal, c'est-à-dire de la forme $xA$ ({{a-ideal|Idéal}}), est un [[anneau-principal|anneau principal]].
    enonce: |
      Tout sous-groupe de $(\lex{ensemble-entiers-relatifs}{\mathbb Z}, +)$ est de la forme $n\mathbb Z$ pour un unique $n \in \lex{ensemble-entiers-naturels}{\mathbb N}$. En particulier, tout [[ideal|idéal]] de $\mathbb Z$ est de cette forme, et $\mathbb Z$ est un anneau principal.
    preuve: |
      Soit $H$ un sous-groupe. Si $H = \{0\}$, alors $H = 0\mathbb Z$. Sinon, $H$ contient un élément non nul et son opposé, donc un élément de $\mathbb N \setminus \{0\}$ ; soit $n$ le plus petit d'entre eux. Comme $H$ est un sous-groupe contenant $n$, il contient $n\mathbb Z$ : pour $k \in \mathbb N$, $nk$ s'obtient par récurrence sur $k$ comme somme, et $n(-k) = -(nk)$. Réciproquement, soit $a \in H$ et $a = nq + r$ sa division euclidienne par $n$. Alors $r = a - nq \in H$ et $0 \leqslant r < n$ ; par minimalité de $n$, $r = 0$, donc $a \in n\mathbb Z$.

      Si $n\mathbb Z = n'\mathbb Z$ avec $n, n' \in \mathbb N$, chacun divise l'autre, et $n = n'$, puisqu'un entier naturel non nul $d$ divisant $d'$ non nul vérifie $d \leqslant d'$. Un idéal est en particulier un sous-groupe additif.
    remarques:
      - |
        La démonstration n'utilise de $\mathbb Z$ que sa division euclidienne. Elle vaut donc pour tout anneau euclidien, par exemple l'anneau $K[X]$ des polynômes sur un corps, avec le degré au lieu de la valeur absolue.

  - id: z-bezout
    etiquette: PGCD, Bézout
    nature: théorème
    titre: PGCD, théorème de Bézout, lemme de Gauss
    texte: |
      On note $a \mid b$, « $a$ divise $b$ », s'il existe $c \in \lex{ensemble-entiers-relatifs}{\mathbb Z}$ tel que $b = ac$. Pour $a, b \in \mathbb Z$, l'idéal $a\mathbb Z + b\mathbb Z$ s'écrit $d\mathbb Z$ pour un unique $d \in \lex{ensemble-entiers-naturels}{\mathbb N}$ ({{z-ideaux|Idéaux de ℤ}}) : c'est le [[pgcd|plus grand commun diviseur]] de $a$ et $b$, noté $a \wedge b$. Les entiers $a$ et $b$ sont **premiers entre eux** si $a \wedge b = 1$.
    enonce: |
      (i) $a \wedge b$ divise $a$ et $b$, et tout diviseur commun de $a$ et $b$ divise $a \wedge b$.

      (ii) *Bézout.* $a \wedge b = 1$ si et seulement s'il existe $u, v \in \mathbb Z$ tels que $au + bv = 1$.

      (iii) *Gauss.* Si $a \mid bc$ et $a \wedge b = 1$, alors $a \mid c$.
    preuve: |
      (i) $a = a \cdot 1 + b \cdot 0 \in d\mathbb Z$, donc $d \mid a$ ; de même $d \mid b$. Comme $d \in a\mathbb Z + b\mathbb Z$, on écrit $d = au + bv$ ; un diviseur commun de $a$ et $b$ divise alors $d$.

      (ii) Si $a \wedge b = 1$, alors $1 \in a\mathbb Z + b\mathbb Z$. Réciproquement, si $au + bv = 1$, alors $1 \in a\mathbb Z + b\mathbb Z = d\mathbb Z$, donc $d \mid 1$, et $d = 1$ puisque $d \in \mathbb N$.

      (iii) Écrivons $au + bv = 1$. Alors $c = acu + bcv$, et $a$ divise les deux termes, donc $c$.
    remarques:
      - |
        La définition par l'idéal évite d'avoir à parler du « plus grand » diviseur. Le point (i) montre que $a \wedge b$ est bien le plus grand diviseur commun au sens de la divisibilité, et donc aussi au sens de l'ordre lorsque $a$ ou $b$ est non nul.
      - |
        L'algorithme d'Euclide calcule $a \wedge b$ par divisions euclidiennes successives, en remplaçant $(a, b)$ par $(b, r)$, ce qui ne change pas l'idéal $a\mathbb Z + b\mathbb Z$ puisque $r = a - bq$. Ainsi $252 \wedge 198 = 18$, et $252 \cdot 4 - 198 \cdot 5 = 18$ donne une relation de Bézout.

  - id: z-premiers
    etiquette: Nombres premiers
    nature: théorème
    titre: Théorème fondamental de l'arithmétique
    texte: |
      Un [[nombre-premier|nombre premier]] est un entier $p \geqslant 2$ dont les seuls diviseurs dans $\lex{ensemble-entiers-naturels}{\mathbb N}$ sont $1$ et $p$.
    enonce: |
      (i) *Lemme d'Euclide.* Si un nombre premier $p$ divise un produit $ab$, il divise $a$ ou $b$.

      (ii) Tout entier $n \geqslant 2$ est un produit de nombres premiers, et cette décomposition est unique à l'ordre des facteurs près.

      (iii) *Euclide.* Il n'existe pas de plus grand nombre premier.
    preuve: |
      (i) Le pgcd $p \wedge a$ divise $p$, donc vaut $1$ ou $p$. S'il vaut $p$, alors $p \mid a$. Sinon $p \wedge a = 1$, et le lemme de Gauss donne $p \mid b$ ({{z-bezout|PGCD, Bézout}}).

      (ii) *Existence.* Sinon, soit $n$ le plus petit entier $\geqslant 2$ qui ne soit pas un produit de nombres premiers ({{n-ordre|Bon ordre sur ℕ}}). Il n'est pas premier, donc $n = ab$ avec $2 \leqslant a, b < n$ ; par minimalité, $a$ et $b$ sont des produits de nombres premiers, donc $n$ aussi : contradiction.

      *Unicité.* Supposons $p_1 \cdots p_k = q_1 \cdots q_l$, produits de nombres premiers. Par (i), étendu à un produit quelconque par récurrence sur le nombre de facteurs, $p_1$ divise l'un des $q_j$ ; comme $q_j$ est premier et $p_1 \geqslant 2$, $p_1 = q_j$. On simplifie par $p_1$, ce que permet l'intégrité de $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ ({{z-anneau|Anneau ℤ}}), et l'on conclut par récurrence sur $k$ : les deux décompositions comportent les mêmes facteurs, avec les mêmes multiplicités.

      (iii) Soit $p$ un nombre premier et $N$ le produit de tous les nombres premiers inférieurs ou égaux à $p$, plus $1$. Un facteur premier $q$ de $N$, qui existe par (ii), ne divise pas $N - 1$, sinon il diviserait $1$ ; donc $q$ n'est aucun des nombres premiers $\leqslant p$, et $q > p$.
    remarques:
      - |
        L'unicité de la décomposition n'a rien d'évident : elle repose sur le lemme d'Euclide, donc sur Bézout, donc sur la division euclidienne. Dans l'anneau des entiers de la forme $a + b\sqrt{-5}$, on a $6 = 2 \cdot 3 = (1 + \sqrt{-5})(1 - \sqrt{-5})$, deux décompositions en éléments irréductibles réellement différentes.
      - |
        La preuve de (iii) ne dit pas que $N$ est premier. Pour $p = 13$, on obtient $N = 2 \cdot 3 \cdot 5 \cdot 7 \cdot 11 \cdot 13 + 1 = 30031 = 59 \cdot 509$, dont les deux facteurs premiers dépassent bien $13$.

  - id: z-zn
    etiquette: ℤ/nℤ
    nature: théorème
    titre: Les anneaux ℤ/nℤ
    enonce: |
      Soit $n \geqslant 1$. L'anneau quotient $\lex{anneau-zn}{\mathbb Z/n\mathbb Z}$ a pour éléments les classes $\overline 0, \overline 1, \dots, \overline{n - 1}$, deux à deux distinctes. Les conditions suivantes sont équivalentes :

      (i) $n$ est premier ;

      (ii) $\mathbb Z/n\mathbb Z$ est intègre ;

      (iii) $\mathbb Z/n\mathbb Z$ est un [[corps]].
    preuve: |
      $n\lex{ensemble-entiers-relatifs}{\mathbb Z}$ est un idéal, et $\mathbb Z/n\mathbb Z$ un anneau ({{a-anneau-quotient|Anneau quotient}}). Par division euclidienne, tout $a$ est congru à son reste $r \in \{0, \dots, n - 1\}$ ; deux restes distincts $r < r'$ ne sont pas congrus, puisque $0 < r' - r < n$ n'est pas multiple de $n$.

      Les idéaux de $\mathbb Z$ contenant $n\mathbb Z$ sont les $d\mathbb Z$ avec $d \in \lex{ensemble-entiers-naturels}{\mathbb N}$ et $d \mid n$ ({{z-ideaux|Idéaux de ℤ}}). Si $n$ est premier, ce sont $n\mathbb Z$ et $\mathbb Z$ : l'idéal $n\mathbb Z$ est maximal, et $\mathbb Z/n\mathbb Z$ est un corps. Un corps est intègre. Si $\mathbb Z/n\mathbb Z$ est intègre, $n\mathbb Z$ est premier ({{a-premier-maximal|Idéaux premiers, maximaux}}) ; alors $n \neq 1$, et si $n = ab$ avec $a, b \in \mathbb N$, $n$ divise $a$ ou $b$, ce qui impose $b = 1$ ou $a = 1$ : $n$ est premier.
    remarques:
      - |
        Dans $\mathbb Z/6\mathbb Z$, on a $\overline 2 \cdot \overline 3 = \overline 0$ : l'anneau n'est pas intègre, conformément au théorème. Dans $\mathbb Z/7\mathbb Z$, l'inverse de $\overline 3$ est $\overline 5$, car $3 \cdot 5 = 15 = 2 \cdot 7 + 1$ ; une relation de Bézout le fournit en général.
      - |
        Le groupe additif $\mathbb Z/n\mathbb Z$ est le premier exemple de groupe quotient annoncé au nœud {{a-quotient|Groupe quotient}}, et les corps $\mathbb Z/p\mathbb Z$ sont les premiers corps finis.

  - id: z-polynomes
    etiquette: Anneaux de polynômes
    nature: théorème
    titre: Anneaux de polynômes
    texte: |
      Soit $A$ un anneau commutatif. L'[[anneau-polynomes|anneau des polynômes]] $\lex{anneau-polynomes}{A[X]}$ est l'ensemble des suites $(a_k)_{k \in \lex{ensemble-entiers-naturels}{\mathbb N}}$ d'éléments de $A$ nulles à partir d'un certain rang, muni de l'addition terme à terme et du produit
      $$(a_k)(b_k) = (c_k), \qquad c_k = \sum_{i + j = k} a_i b_j.$$
      On note $X$ la suite dont seul le terme d'indice $1$ vaut $1$ ; le **degré** d'un polynôme non nul est le plus grand $k$ tel que $a_k \neq 0$. Les anneaux à plusieurs indéterminées se définissent par récurrence : $A[X_1, \dots, X_n] = A[X_1, \dots, X_{n-1}][X_n]$.
    enonce: |
      (i) $A[X]$ est un anneau commutatif, dans lequel $A$ se plonge par les suites constantes en $0$ au-delà du premier terme, et tout polynôme s'écrit de manière unique $\sum_k a_k X^k$.

      (ii) *Propriété universelle.* Pour tout morphisme d'anneaux $\varphi : A \to B$, avec $B$ commutatif, et tout $b \in B$, il existe un unique morphisme d'anneaux $A[X] \to B$ qui prolonge $\varphi$ et envoie $X$ sur $b$ : c'est l'évaluation $\sum_k a_k X^k \mapsto \sum_k \varphi(a_k)\, b^k$.

      (iii) Si $A$ est intègre, $\deg(PQ) = \deg P + \deg Q$ pour $P, Q \neq 0$, et $A[X]$ est intègre.

      (iv) Si $K$ est un corps, pour $P, B \in K[X]$ avec $B \neq 0$, il existe un unique couple $(Q, R)$ tel que $P = BQ + R$ et $R = 0$ ou $\deg R < \deg B$. Par suite, $K[X]$ est un [[anneau-principal|anneau principal]].
    preuve: |
      (i) Le produit est bien défini, la somme $\sum_{i + j = k}$ portant sur un ensemble fini, et $c_k = 0$ dès que $k$ dépasse la somme des rangs à partir desquels les deux suites sont nulles. La commutativité et la distributivité se lisent sur la formule. Pour l'associativité, le coefficient d'indice $k$ de $(PQ)R$ et celui de $P(QR)$ valent tous deux $\sum_{i + j + l = k} a_i b_j c_l$, par regroupement des termes d'une somme finie (seules interviennent l'associativité et la commutativité de l'addition et de la multiplication de $A$). Par récurrence, $X^k$ est la suite dont seul le terme d'indice $k$ vaut $1$, d'où l'écriture $\sum_k a_k X^k$.

      (ii) L'application proposée est additive. Elle est multiplicative, puisque
      $$\sum_k \Big(\sum_{i + j = k} \varphi(a_i)\varphi(b_j)\Big) b^k = \Big(\sum_i \varphi(a_i) b^i\Big)\Big(\sum_j \varphi(b_j) b^j\Big)$$
      par distributivité dans $B$, et elle envoie $1$ sur $1$. Un morphisme qui prolonge $\varphi$ et envoie $X$ sur $b$ envoie $\sum_k a_k X^k$ sur $\sum_k \varphi(a_k) b^k$ : il est unique.

      (iii) Si $a_p$ et $b_q$ sont les coefficients dominants de $P$ et $Q$, le coefficient d'indice $p + q$ de $PQ$ est $a_p b_q \neq 0$, et les coefficients d'indice supérieur sont nuls.

      (iv) *Existence*, par récurrence sur le degré de $P$. Si $P = 0$ ou $\deg P < \deg B$, on prend $Q = 0$ et $R = P$. Sinon, si $a X^p$ et $b X^q$ sont les termes dominants de $P$ et $B$, le polynôme $P - a b^{-1} X^{p - q} B$ est nul ou de degré strictement inférieur à $p$, et l'hypothèse de récurrence s'applique. *Unicité.* Si $BQ + R = BQ' + R'$, alors $B(Q - Q') = R' - R$ ; si $Q \neq Q'$, le degré du membre de gauche est au moins $\deg B$, celui de droite est inférieur, par (iii). Le caractère principal se démontre exactement comme pour $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ ({{z-ideaux|Idéaux de ℤ}}), en prenant dans un idéal non nul un élément non nul de degré minimal.
    remarques:
      - |
        Un polynôme n'est pas une fonction. Sur le corps $\mathbb Z/2\mathbb Z$, le polynôme $X^2 + X$ est non nul, mais la fonction $x \mapsto x^2 + x$ est nulle, puisqu'elle s'annule en $\overline 0$ et en $\overline 1$. C'est l'erreur la plus répandue, et la raison pour laquelle on définit les polynômes par leurs coefficients.
      - |
        La propriété (ii) servira à construire {{c|$\mathbb C$}} comme quotient de $\mathbb R[X]$, et à évaluer les polynômes en des points de $\lex{n-uplet}{K^n}$ en {{geoalg|géométrie algébrique}}.

