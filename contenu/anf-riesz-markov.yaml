# Niveau 2 : structure interne du chapitre « Théorème de Riesz-Markov » (nœud anf-riesz-markov du graphe
# anf, créé le 30 oct. 2026).
# Sur un espace métrique compact K : distance à une partie, fonctions d'Urysohn et partitions de l'unité
# construites par la distance ; formes linéaires positives sur C(K) (continuité automatique, exemples) ;
# fonction d'ensemble μ(U) = sup{Λf : 0 ⩽ f ⩽ 1_U} sur les ouverts (additivité, sous-additivité
# dénombrable) ; mesure extérieure, ouverts mesurables (Carathéodory), régularité ; représentation
# Λf = ∫ f dμ par découpage de f en tranches, et unicité par le lemme de Dynkin sur les fermés.
# Exemples : l'évaluation donne une mesure de Dirac, l'intégrale de Riemann sur [0, 1] redonne la mesure
# de Lebesgue. La version localement compacte séparée est seulement décrite en remarque.
# Choix : un seul usage, le choix dénombrable dans la sous-additivité de la mesure extérieure, inévitable
# (le théorème appliqué à l'intégrale de Riemann construirait la mesure de Lebesgue des boréliens de [0, 1]).
# Aucune partie dense dénombrable n'est employée : la distance fournit les fonctions d'Urysohn et les
# partitions de l'unité, la compacité les recouvrements finis.

graphe: anf-riesz-markov
titre: Théorème de Riesz-Markov
conteneur: anf-riesz-markov

entrees:
  f-evn: [mk-formes-positives]

noeuds:
  - id: mk-urysohn
    etiquette: Fonctions d'Urysohn
    nature: lemme
    titre: Distance à une partie, fonctions d'Urysohn, partitions de l'unité
    texte: |
      Soit $(K, d)$ un [[espace-metrique]]. Pour une partie non vide $A$ de $K$ et $x \in K$, la [[distance-partie|distance]] de $x$ à $A$ est
      $$d(x, A) = \inf_{a \in A} d(x, a).$$

      La [[tribu-borelienne|tribu borélienne]] $\mathcal B(K)$ est la tribu engendrée par les ouverts de $K$ ({{m-tribus|Tribus}}, (ii)) ; ses éléments sont les **boréliens** de $K$, et une **mesure borélienne** sur $K$ est une mesure définie sur $\mathcal B(K)$.
    enonce: |
      (i) La fonction $x \mapsto d(x, A)$ est $1$-lipschitzienne, donc continue, et $d(x, A) = 0$ si et seulement si $x$ est [[adherence|adhérent]] à $A$. Pour $F$ [[ferme|fermé]] non vide, $d(x, F) = 0$ équivaut à $x \in F$.

      (ii) *Urysohn.* Si $F$ est fermé, $U$ [[ouvert]] et $F \subset U$, il existe une fonction continue $f : K \to [0, 1]$ égale à $1$ sur $F$ et nulle hors de $U$.

      (iii) Si $F$ est fermé non vide, les fonctions continues $f_n(x) = \max\big(0, 1 - n\,d(x, F)\big)$, à valeurs dans $[0, 1]$, décroissent et convergent simplement vers $\mathbf 1_F$.

      (iv) *Partitions de l'unité.* Supposons $K$ [[compact]]. Si $F$ est fermé et contenu dans une réunion d'ouverts $U_1 \cup \cdots \cup U_N$, il existe des fonctions continues $h_1, \dots, h_N : K \to [0, 1]$ telles que $h_i$ soit nulle hors de $U_i$, $\sum_i h_i \leqslant 1$ sur $K$, et $\sum_i h_i = 1$ sur $F$.

      (v) Toute fonction continue $f : K \to \lex{ensemble-reels}{\mathbb R}$ est mesurable pour $\mathcal B(K)$. Les fermés de $K$ forment un π-système qui engendre $\mathcal B(K)$.
    preuve: |
      (i) Pour $a \in A$, $d(x, A) \leqslant d(x, a) \leqslant d(x, y) + d(y, a)$ ; en passant à la borne inférieure en $a$, $d(x, A) \leqslant d(x, y) + d(y, A)$, et l'on échange $x$ et $y$. La continuité suit ({{me-topologie|Topologie d'une distance}}, (iv)).

      On a $d(x, A) = 0$ si et seulement si toute boule $B(x, r)$ rencontre $A$, c'est-à-dire ({{me-topologie|Topologie d'une distance}}, (ii)) si et seulement si $x$ est adhérent à $A$. Un fermé est égal à son adhérence ({{t-adherence|Intérieur, adhérence}}, (i)).

      (ii) Si $F$ est vide, $f = 0$ convient ; si $U = K$, $f = 1$. Sinon, posons
      $$f(x) = \frac{d(x, K \setminus U)}{d(x, K \setminus U) + d(x, F)}.$$
      Le dénominateur ne s'annule pas : par (i), il faudrait $x \in F$ et $x \in K \setminus U$, fermés disjoints. La fonction $f$ est continue, à valeurs dans $[0, 1]$, égale à $1$ sur $F$ et nulle sur $K \setminus U$.

      (iii) Chaque $f_n$ est continue par (i). Pour $x \in F$, $f_n(x) = 1$. Pour $x \notin F$, $d(x, F) > 0$ par (i), et $f_n(x) = 0$ dès que $n\,d(x, F) \geqslant 1$, $\mathbb R$ étant [[archimedien]]. La décroissance est celle de $n \mapsto 1 - n\,d(x, F)$.

      (iv) Si $F$ est vide, on prend des $h_i$ nulles. Sinon, posons $g_i = d(\cdot, K \setminus U_i)$ si $U_i \neq K$, et $g_i = 1$ si $U_i = K$ : par (i), $g_i$ est continue, positive, et strictement positive exactement sur $U_i$.

      La somme $G = g_1 + \cdots + g_N$ est continue et strictement positive sur $F$, chaque point de $F$ étant dans l'un des $U_i$.

      Le fermé $F$ est compact ({{t-compact-prop|Parties compactes}}, (i)) et non vide : $G$ y atteint un minimum $\delta > 0$ ({{tr-compacts|Compacts de ℝ}}, (iii)). Posons
      $$h_i = \frac{g_i}{\max(G, \delta)}.$$
      Ces fonctions sont continues et positives ; leur somme $G/\max(G, \delta)$ est au plus $1$, égale à $1$ sur $F$ où $G \geqslant \delta$ ; chaque $h_i$ est donc au plus $1$, et nulle hors de $U_i$.

      (v) Pour tout réel $a$, $\{f > a\}$ est un ouvert, donc un borélien. Une intersection finie de fermés est fermée ; la tribu engendrée par les fermés contient leurs complémentaires, les ouverts, donc $\mathcal B(K)$, et elle y est contenue.
    remarques:
      - |
        Aucun choix n'intervient : la distance fournit d'un seul coup toutes les fonctions dont on a besoin, sans désigner de rayon ni de point. Dans un espace topologique séparé quelconque, même compact, il n'y a pas de distance, et le lemme d'Urysohn demande une construction beaucoup plus délicate, indexée par les rationnels dyadiques, qui exploite la normalité de l'espace.

        ```schema mk-urysohn
        Sur $K = [0, 1]$, le fermé $F = [0{,}2 ; 0{,}8]$ (trait rouge) est recouvert par les trois ouverts $U_1 = \,]0{,}1 ; 0{,}45[$, $U_2 = \,]0{,}3 ; 0{,}7[$ et $U_3 = \,]0{,}55 ; 0{,}9[$. Les fonctions $h_1$ (bleu), $h_2$ (vert) et $h_3$ (gris) s'annulent hors de leur ouvert, et leur somme, en rouge, vaut $1$ sur tout $F$ ; elle redescend vers $0$ au-delà, où $G$ passe sous son minimum $\delta = 0{,}1$ sur $F$, atteint aux deux extrémités de $F$.
        ```

  - id: mk-formes-positives
    etiquette: Formes positives
    nature: proposition
    titre: Formes linéaires positives sur C(K)
    texte: |
      Soit $K$ un espace métrique [[compact]] non vide, et $C(K)$ l'espace vectoriel des fonctions continues de $K$ dans $\lex{ensemble-reels}{\mathbb R}$. Une telle fonction est bornée et atteint ses bornes ({{tr-compacts|Compacts de ℝ}}, (iii)) ; on munit $C(K)$ de la norme uniforme $\|f\|_\infty = \max_K |f|$, qui en fait un [[espace-norme|espace vectoriel normé]].

      Une forme linéaire $\Lambda$ sur $C(K)$ est une [[forme-lineaire-positive|forme linéaire positive]] si $\Lambda f \geqslant 0$ pour toute $f \geqslant 0$.
    enonce: |
      (i) Une forme linéaire positive est croissante, et
      $$|\Lambda f| \leqslant \Lambda(1)\,\|f\|_\infty.$$
      Elle est donc continue, et la borne supérieure de $|\Lambda f|$ pour $\|f\|_\infty \leqslant 1$, sa norme, vaut $\Lambda(1)$.

      (ii) Si $\mu$ est une mesure borélienne finie sur $K$, toute $f \in C(K)$ est intégrable pour $\mu$, et $f \mapsto \int f \, d\mu$ est une forme linéaire positive. Pour $a \in K$ et la mesure de Dirac $\delta_a$, restreinte aux boréliens, $\int f \, d\delta_a = f(a)$.

      (iii) Pour $K = [0, 1]$, l'intégrale de Riemann $f \mapsto \int_0^1 f(x)\,dx$ est une forme linéaire positive sur $C([0, 1])$.
    preuve: |
      (i) Si $f \leqslant g$, $\Lambda g - \Lambda f = \Lambda(g - f) \geqslant 0$. Comme $-\|f\|_\infty \leqslant f \leqslant \|f\|_\infty$, la croissance donne $-\|f\|_\infty\Lambda(1) \leqslant \Lambda f \leqslant \|f\|_\infty\Lambda(1)$.

      Par linéarité, $|\Lambda f - \Lambda g| \leqslant \Lambda(1)\|f - g\|_\infty$ : $\Lambda$ est lipschitzienne, donc continue ({{me-topologie|Topologie d'une distance}}, (iv)). La borne $\Lambda(1)$ est atteinte en $f = 1$, de norme $1$.

      (ii) Une fonction continue est bornée, par $\|f\|_\infty$, et borélienne ({{mk-urysohn|Fonctions d'Urysohn}}, (v)) ; comme $\mu(K)$ est fini, $\int |f| \, d\mu \leqslant \|f\|_\infty\mu(K)$. La linéarité et la positivité sont celles de l'intégrale ({{m-integrables|Fonctions intégrables}}, (i)).

      Pour $\delta_a$, la fonction $f$ est égale à la constante $f(a)$ hors de l'ensemble $\{f \neq f(a)\}$, qui est $\delta_a$-négligeable, d'où $\int f \, d\delta_a = f(a)$ ({{m-integrables|Fonctions intégrables}}, (iii)).

      (iii) Une fonction continue sur $[0, 1]$ est intégrable au sens de Riemann ({{ri-continues|Fonctions continues}}), et l'intégrale est linéaire et croissante ({{ri-proprietes|Propriétés de l'intégrale}}, (i) et (ii)).
    remarques:
      - |
        La positivité entraîne la continuité, ce qui n'a rien d'évident : en dimension infinie, une forme linéaire n'est pas continue en général ({{f-operateurs|Opérateurs continus}}). L'ordre de $C(K)$ fait ici le travail de la norme.
      - |
        Toute forme linéaire continue sur $C(K)$ est la différence de deux formes positives, par l'argument du nœud {{lp-formes-positives|Formes positives sur Lᵖ}}, qui s'applique mot pour mot. Le théorème de ce chapitre identifie donc le dual de $C(K)$ aux différences de mesures boréliennes finies ; on ne développe pas ici la théorie des mesures signées qui rendrait cette identification exacte.

  - id: mk-ouverts
    etiquette: Mesure des ouverts
    nature: proposition
    titre: La mesure des ouverts définie par une forme positive
    texte: |
      Soit $\Lambda$ une [[forme-lineaire-positive|forme linéaire positive]] sur $C(K)$, où $K$ est un espace métrique compact non vide. Pour un ouvert $U$ de $K$, on pose
      $$\begin{aligned} \mu(U) = \sup\big\{&\Lambda f : f \in C(K), \\ &0 \leqslant f \leqslant \mathbf 1_U\big\}. \end{aligned}$$
      La condition $f \leqslant \mathbf 1_U$ signifie que $f \leqslant 1$ et que $f$ est nulle hors de $U$.
    enonce: |
      (i) $\mu(\varnothing) = 0$, $\mu(K) = \Lambda(1)$, et $\mu(U) \leqslant \mu(V)$ si $U \subset V$.

      (ii) Si $U$ et $V$ sont des ouverts disjoints, $\mu(U \cup V) = \mu(U) + \mu(V)$.

      (iii) Pour toute suite $(U_n)$ d'ouverts,
      $$\mu\Big(\bigcup_n U_n\Big) \leqslant \sum_n \mu(U_n).$$
    preuve: |
      (i) Pour $U = \varnothing$, seule $f = 0$ convient. Pour $U = K$, la borne supérieure est atteinte en $f = 1$, par croissance de $\Lambda$ ({{mk-formes-positives|Formes positives}}, (i)). Si $U \subset V$, toute $f \leqslant \mathbf 1_U$ vérifie $f \leqslant \mathbf 1_V$.

      (ii) Si $f \leqslant \mathbf 1_U$ et $g \leqslant \mathbf 1_V$, alors $f + g \leqslant \mathbf 1_{U \cup V}$, puisque $U$ et $V$ sont disjoints ; en passant aux bornes supérieures ({{m-droite-achevee|Sommes dans [0, +∞]}}, (ii)), $\mu(U) + \mu(V) \leqslant \mu(U \cup V)$.

      Réciproquement, soit $h \in C(K)$ avec $0 \leqslant h \leqslant \mathbf 1_{U \cup V}$.

      La fonction $h\mathbf 1_U$ est continue : elle est égale à $h$ au voisinage de tout point de l'ouvert $U$, nulle au voisinage de tout point de l'ouvert $V$, et, en un point $x$ hors de $U \cup V$, on a $h(x) = 0$ et $0 \leqslant h\mathbf 1_U \leqslant h$, continue en $x$. De même pour $h\mathbf 1_V$. Ainsi $h = h\mathbf 1_U + h\mathbf 1_V$, et $\Lambda h \leqslant \mu(U) + \mu(V)$.

      (iii) Soit $U = \bigcup_n U_n$, $f \in C(K)$ avec $0 \leqslant f \leqslant \mathbf 1_U$, et $\varepsilon > 0$. L'ensemble $F = \{f \geqslant \varepsilon\}$ est fermé, donc compact ({{t-compact-prop|Parties compactes}}, (i)), et contenu dans $U$ puisque $f$ est nulle hors de $U$. Les ouverts $U_n$ le recouvrent ; il existe donc $N$ tel que $F \subset U_0 \cup \cdots \cup U_N$.

      Soient $h_0, \dots, h_N$ les fonctions du nœud {{mk-urysohn|Fonctions d'Urysohn}}, (iv), et $f_\varepsilon = \max(f - \varepsilon, 0)$, continue, nulle hors de $F$. Comme $\sum_i h_i = 1$ sur $F$,
      $$f_\varepsilon = \sum_{i \leqslant N} h_i f_\varepsilon,$$
      et chaque $h_i f_\varepsilon$ est continue, comprise entre $0$ et $\mathbf 1_{U_i}$. Donc $\Lambda f_\varepsilon \leqslant \sum_{i \leqslant N} \mu(U_i) \leqslant \sum_n \mu(U_n)$.

      Enfin $f \leqslant f_\varepsilon + \varepsilon$, d'où $\Lambda f \leqslant \Lambda f_\varepsilon + \varepsilon\Lambda(1)$. En faisant tendre $\varepsilon$ vers $0$ puis en passant à la borne supérieure sur $f$, on obtient l'inégalité.
    remarques:
      - |
        La définition mesure un ouvert $U$ de l'intérieur, par les fonctions continues qui tiennent sous son indicatrice. Pour $K = [0, 1]$ et l'intégrale de Riemann, et $U = \,]a, b[$, une telle fonction a une intégrale au plus $b - a$, et la fonction affine par morceaux qui vaut $1$ sur $[a + \delta, b - \delta]$ et $0$ hors de $]a, b[$ a pour intégrale $b - a - \delta$ : on trouve $\mu(]a, b[) = b - a$.
      - |
        L'erreur la plus répandue est de croire que la borne supérieure est atteinte, comme si l'on pouvait évaluer $\Lambda$ sur $\mathbf 1_U$, qui n'est pas continue. Pour l'intégrale de Riemann et $U = \,]a, b[$, une fonction continue $f \leqslant \mathbf 1_U$ est nulle en $a$ ; elle reste donc inférieure à $\frac12$ sur un intervalle $[a, a + \eta]$, et son intégrale est au plus $b - a - \frac\eta2 < b - a$. Aucune ne réalise $\mu(U)$.

  - id: mk-construction
    etiquette: Mesure de Riesz
    nature: théorème
    titre: Construction de la mesure, régularité
    texte: |
      Avec les notations du nœud {{mk-ouverts|Mesure des ouverts}}, on pose, pour toute partie $E$ de $K$,
      $$\mu^*(E) = \inf\{\mu(U) : U \text{ ouvert},\ U \supset E\}.$$
      Une mesure borélienne finie $\mu$ sur $K$ est [[mesure-reguliere|régulière]] si, pour tout borélien $E$,
      $$\begin{aligned} \mu(E) &= \inf\{\mu(U) : U \supset E \text{ ouvert}\} \\ &= \sup\{\mu(F) : F \subset E \text{ fermé}\}. \end{aligned}$$
    choix: |
      La sous-additivité dénombrable de $\mu^*$, en (i), choisit pour chaque $n$ un ouvert presque optimal contenant $E_n$ : c'est un usage du [[choix-denombrable]]. Il est inévitable, comme pour la {{m-lebesgue|mesure de Lebesgue}} : appliqué à l'intégrale de Riemann sur $[0, 1]$, le théorème construit la mesure de Lebesgue des boréliens de $[0, 1]$ ({{mk-riesz-markov|Riesz-Markov}}), qui n'existe pas dans le modèle de Feferman et Lévy. Le reste de la démonstration ne fait aucun choix ; en particulier, aucune partie dense dénombrable de $K$ n'est employée.
    enonce: |
      (i) $\mu^*$ est une [[mesure-exterieure|mesure extérieure]] sur $K$, qui coïncide avec $\mu$ sur les ouverts.

      (ii) Tout ouvert est $\mu^*$-mesurable. Par conséquent tout borélien l'est, et la restriction de $\mu^*$ à $\mathcal B(K)$, encore notée $\mu$, est une mesure borélienne finie, de masse $\mu(K) = \Lambda(1)$.

      (iii) Cette mesure est régulière.
    preuve: |
      (i) On a $\mu^*(\varnothing) = 0$, $\mu^*$ est croissante, et $\mu^*(U) = \mu(U)$ pour $U$ ouvert, par croissance de $\mu$ sur les ouverts ({{mk-ouverts|Mesure des ouverts}}, (i)).

      Soit $E = \bigcup_n E_n$ et $\varepsilon > 0$. Choisissons, pour chaque $n$, un ouvert $U_n \supset E_n$ tel que $\mu(U_n) \leqslant \mu^*(E_n) + \varepsilon 2^{-n-1}$. L'ouvert $\bigcup_n U_n$ contient $E$, et la sous-additivité sur les ouverts ({{mk-ouverts|Mesure des ouverts}}, (iii)) donne
      $$\mu^*(E) \leqslant \sum_n \mu(U_n) \leqslant \sum_n \mu^*(E_n) + \varepsilon.$$

      (ii) Soit $U$ un ouvert. Il s'agit de montrer $\mu^*(E) \geqslant \mu^*(E \cap U) + \mu^*(E \setminus U)$ pour toute partie $E$, l'autre inégalité étant la sous-additivité.

      *Cas où $E = V$ est ouvert.* Soit $\varepsilon > 0$ et $f \in C(K)$, $0 \leqslant f \leqslant \mathbf 1_{V \cap U}$, avec $\Lambda f \geqslant \mu(V \cap U) - \varepsilon$. L'ensemble $W = V \setminus \{f \geqslant \varepsilon\}$ est ouvert, et il contient $V \setminus U$, où $f$ est nulle. Soit $g \in C(K)$, $0 \leqslant g \leqslant \mathbf 1_W$, avec $\Lambda g \geqslant \mu(W) - \varepsilon$.

      La fonction $f_\varepsilon = \max(f - \varepsilon, 0)$ n'est non nulle que là où $f > \varepsilon$, et $g$ là où $f < \varepsilon$. En chaque point l'une des deux est nulle, l'autre est au plus $1$, et toutes deux sont nulles hors de $V$ : $f_\varepsilon + g \leqslant \mathbf 1_V$.

      Comme $f \leqslant f_\varepsilon + \varepsilon$,
      $$\begin{aligned} \mu(V) &\geqslant \Lambda f_\varepsilon + \Lambda g \\ &\geqslant \Lambda f - \varepsilon\Lambda(1) + \mu(W) - \varepsilon \\ &\geqslant \mu(V \cap U) + \mu^*(V \setminus U) - c\,\varepsilon, \end{aligned}$$
      avec $c = 2 + \Lambda(1)$. On fait tendre $\varepsilon$ vers $0$.

      *Cas général.* Pour $\varepsilon > 0$, il existe un ouvert $V \supset E$ tel que $\mu(V) \leqslant \mu^*(E) + \varepsilon$, et, par le cas précédent et la croissance de $\mu^*$,
      $$\begin{aligned} \mu^*(E) + \varepsilon &\geqslant \mu^*(V \cap U) + \mu^*(V \setminus U) \\ &\geqslant \mu^*(E \cap U) + \mu^*(E \setminus U). \end{aligned}$$

      Par le théorème de Carathéodory ({{m-caratheodory|Carathéodory}}), les parties $\mu^*$-mesurables forment une tribu, sur laquelle $\mu^*$ est une mesure ; elle contient les ouverts, donc $\mathcal B(K)$. Enfin $\mu(K) = \Lambda(1)$ ({{mk-ouverts|Mesure des ouverts}}, (i)).

      (iii) La première égalité est la définition de $\mu^*$. Pour la seconde, soit $E$ un borélien. Pour tout ouvert $U \supset K \setminus E$, le fermé $F = K \setminus U$ est contenu dans $E$, et $\mu(F) = \mu(K) - \mu(U)$, la mesure étant finie. Donc
      $$\begin{aligned} \sup_{F \subset E} \mu(F) &= \mu(K) - \inf_{U \supset K \setminus E} \mu(U) \\ &= \mu(K) - \mu(K \setminus E) = \mu(E). \end{aligned}$$
    remarques:
      - |
        Les fermés de $K$ sont compacts ({{t-compact-prop|Parties compactes}}, (i)) : la régularité dit que la mesure d'un borélien s'approche par celles des compacts qu'il contient et des ouverts qui le contiennent. C'est ce qui permet de passer d'un borélien quelconque, objet abstrait, à des parties que la topologie sait manier, comme le faisait déjà le nœud {{m-regularite|Régularité de λ}} pour la mesure de Lebesgue.
      - |
        La démonstration de (ii) est le cœur de la construction : un ouvert $U$ découpe un ouvert $V$ sans perte, parce qu'une fonction sous $\mathbf 1_{V \cap U}$, abaissée de $\varepsilon$, laisse la place à une fonction sous $\mathbf 1_{V \setminus U}$. Le rôle de $\varepsilon$ est topologique : l'ensemble $\{f \geqslant \varepsilon\}$ est fermé, si bien que $W = V \setminus \{f \geqslant \varepsilon\}$ est ouvert et contient tout $V \setminus U$, frontière de $U$ comprise. Sans lui, il faudrait retirer de $V$ l'adhérence $\bar U$, et l'ouvert $V \setminus \bar U$ perdrait les points de $V$ situés sur la frontière de $U$, avec la masse qu'ils peuvent porter.

  - id: mk-riesz-markov
    etiquette: Riesz-Markov
    nature: théorème
    titre: Théorème de représentation de Riesz-Markov
    choix: |
      L'existence hérite du [[choix-denombrable]] employé au nœud {{mk-construction|Mesure de Riesz}}. L'unicité n'utilise aucun choix ; la régularité de toute mesure borélienne finie, déduite de l'existence, hérite du [[choix-denombrable]].
    enonce: |
      Soit $K$ un espace métrique [[compact]] non vide et $\Lambda$ une [[forme-lineaire-positive|forme linéaire positive]] sur $C(K)$.

      (i) Il existe une unique mesure borélienne finie $\mu$ sur $K$ telle que
      $$\Lambda f = \int_K f \, d\mu \quad \text{pour tout } f \in C(K).$$
      C'est la mesure du nœud {{mk-construction|Mesure de Riesz}} ; elle est [[mesure-reguliere|régulière]], et $\mu(K) = \Lambda(1)$.

      (ii) Toute mesure borélienne finie sur $K$ est régulière, et $\mu \mapsto \big(f \mapsto \int f \, d\mu\big)$ est une bijection des mesures boréliennes finies sur $K$ sur les formes linéaires positives sur $C(K)$.
    preuve: |
      (i) *Existence.* Soit $\mu$ la mesure du nœud {{mk-construction|Mesure de Riesz}}. Il suffit de montrer que $\Lambda f \leqslant \int f \, d\mu$ pour toute $f \in C(K)$ : appliquée à $-f$, l'inégalité donne l'égalité.

      Pour $a > 0$ et $b$ réel, $\Lambda(af + b) = a\Lambda f + b\Lambda(1)$ et $\int (af + b) \, d\mu = a\int f \, d\mu + b\,\mu(K)$, avec $\mu(K) = \Lambda(1)$. Si $f$ est constante, l'égalité est donc vraie ; sinon, $f$ étant bornée, on peut choisir $a$ et $b$ pour que $0 \leqslant af + b \leqslant 1$. On suppose donc $0 \leqslant f \leqslant 1$.

      Soit $n \geqslant 1$. Pour $1 \leqslant k \leqslant n$, posons
      $$f_k = \min\big(\max(nf - k + 1, 0), 1\big).$$
      Ces fonctions sont continues, à valeurs dans $[0, 1]$, et $f = \frac1n\sum_{k=1}^n f_k$. En effet, en un point où $nf = m + r$, avec $m$ entier et $0 \leqslant r < 1$, ou $nf = n$, les $f_k$ valent $1$ pour $k \leqslant m$, $r$ pour $k = m + 1$, et $0$ au-delà.

      ```schema mk-riesz-markov
      Pour $f(x) = 16x^2(1 - x)^2$ et $n = 4$, l'aire sous $f$ est découpée en quatre tranches horizontales de hauteur $\frac14$, alternativement vertes et grises ; la tranche $k$ a pour hauteur $\frac14 f_k$. Sous l'axe, l'ouvert $U_k = \{f > \frac{k-1}4\}$, en bleu, contient le fermé $F_k = \{f \geqslant \frac k4\}$, en rouge, qui contient lui-même $U_{k+1}$ : ce sont ces emboîtements qui comparent $\Lambda f_k$ à $\int f_{k-1}\,d\mu$.
      ```

      La fonction $f_k$ est nulle sur $\{f \leqslant \frac{k-1}n\}$, si bien que $f_k \leqslant \mathbf 1_{U_k}$ avec $U_k = \{f > \frac{k-1}n\}$, ouvert, et $\Lambda f_k \leqslant \mu(U_k)$. Elle vaut $1$ sur le fermé $F_k = \{f \geqslant \frac kn\}$, d'où $\int f_k \, d\mu \geqslant \mu(F_k)$.

      Pour $k \geqslant 2$, $U_k \subset F_{k-1}$, donc $\Lambda f_k \leqslant \mu(F_{k-1}) \leqslant \int f_{k-1} \, d\mu$ ; pour $k = 1$, $\Lambda f_1 \leqslant \mu(K)$. En sommant,
      $$\begin{aligned} \Lambda f &= \frac1n\sum_{k=1}^n \Lambda f_k \\ &\leqslant \frac{\mu(K)}n + \frac1n\sum_{k=1}^{n-1}\int f_k \, d\mu \\ &\leqslant \frac{\mu(K)}n + \int f \, d\mu. \end{aligned}$$
      On fait tendre $n$ vers l'infini.

      *Unicité.* Soient $\mu$ et $\mu'$ deux mesures boréliennes finies qui donnent les mêmes intégrales aux fonctions continues. Pour un fermé $F$ non vide, les fonctions $f_n$ du nœud {{mk-urysohn|Fonctions d'Urysohn}}, (iii), comprises entre $0$ et $1$, convergent simplement vers $\mathbf 1_F$ ; par convergence dominée, les mesures étant finies, $\mu(F) = \lim \int f_n \, d\mu = \mu'(F)$. C'est vrai aussi de $F = \varnothing$.

      Les fermés forment un π-système qui engendre $\mathcal B(K)$ ({{mk-urysohn|Fonctions d'Urysohn}}, (v)), et $K$ en est un, de mesures égales et finies : le lemme de Dynkin ({{m-dynkin|Classes monotones}}, (ii)), avec la suite constante égale à $K$, donne $\mu = \mu'$.

      (ii) Si $\mu'$ est une mesure borélienne finie, $\Lambda' f = \int f \, d\mu'$ est une forme linéaire positive ({{mk-formes-positives|Formes positives}}, (ii)). La mesure régulière que lui associe (i) donne les mêmes intégrales que $\mu'$ aux fonctions continues ; par l'unicité, elle est égale à $\mu'$, qui est donc régulière. L'application de l'énoncé est injective par l'unicité, et surjective par l'existence.
    remarques:
      - |
        Pour l'évaluation $\Lambda f = f(a)$, la mesure est la mesure de Dirac $\delta_a$, restreinte aux boréliens : elle représente $\Lambda$ ({{mk-formes-positives|Formes positives}}, (ii)), et l'unicité conclut. Toute la masse est en $a$, et la forme ne voit d'une fonction que sa valeur en ce point.
      - |
        Pour $K = [0, 1]$ et l'intégrale de Riemann, la mesure obtenue est la [[mesure-lebesgue|mesure de Lebesgue]], restreinte aux boréliens de $[0, 1]$.

        Ces boréliens sont exactement les boréliens de $\mathbb R$ contenus dans $[0, 1]$. D'une part, par le point (iv) du nœud {{m-tribus|Tribus}} appliqué à l'inclusion de $[0, 1]$ dans $\mathbb R$, les $B \subset \mathbb R$ tels que $B \cap [0, 1] \in \mathcal B([0, 1])$ forment une tribu qui contient les ouverts.

        D'autre part, les boréliens de $\mathbb R$ contenus dans $[0, 1]$ forment une tribu sur $[0, 1]$, qui contient ses ouverts, traces d'ouverts de $\mathbb R$ ({{me-topologie|Topologie d'une distance}}, (iii)).

        La restriction de $\lambda$ est donc une mesure borélienne finie sur $[0, 1]$, et $\int_0^1 f(x)\,dx = \int_{[0, 1]} f \, d\lambda$ pour $f$ continue ({{m-riemann|Riemann et Lebesgue}}). Par l'unicité, c'est la mesure de Riesz de l'intégrale de Riemann : la mesure de Lebesgue sort de la seule intégrale des fonctions continues.
      - |
        Sur un espace localement compact séparé $X$, le théorème représente les formes linéaires positives sur l'espace des fonctions continues à support compact par des mesures boréliennes, régulières en un sens plus faible. Il n'est pas démontré ici : il faut le lemme d'Urysohn dans un espace sans distance, qui se démontre par une construction indexée par les rationnels dyadiques, des partitions de l'unité à supports compacts, et une régularité intérieure qui ne vaut plus en général que pour les ouverts et les parties de mesure finie.
      - |
        Même sur un compact, la métrisabilité n'est pas une commodité : sur l'espace compact des ordinaux $[0, \omega_1]$, la mesure de Dieudonné, qui vaut $1$ sur les boréliens contenant un fermé non borné d'ordinaux dénombrables et $0$ sur les autres, est une mesure borélienne finie qui n'est pas régulière. Ce fait est admis ici. Sa σ-additivité repose sur la régularité de $\omega_1$, c'est-à-dire sur le fait qu'une réunion dénombrable d'ordinaux dénombrables est dénombrable, qui demande le [[choix-denombrable]] (⋆) : dans le modèle de Feferman et Lévy, $\omega_1$ est la borne supérieure d'une suite d'ordinaux dénombrables.
      - |
        F. Riesz a démontré le théorème en 1909 pour $C([a, b])$, en représentant les formes linéaires continues par des intégrales de Stieltjes (« Sur les opérations fonctionnelles linéaires », *C. R. Acad. Sci. Paris* 149, p. 974-977). A. Markov l'a étendu en 1938 à des espaces non compacts (« On mean values and exterior densities », *Mat. Sbornik* 4 (46), p. 165-191), et S. Kakutani en 1941 aux compacts séparés quelconques (« Concrete representation of abstract (M)-spaces », *Ann. of Math.* 42, p. 994-1024).

