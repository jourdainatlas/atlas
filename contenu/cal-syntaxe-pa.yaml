# Niveau 2 : structure interne du chapitre « Suites codées et démonstrations dans PA » (nœud cal-syntaxe-pa du
# graphe calc, après cal-beta-pa). Troisième sous-lot de la démonstration de la formule naturelle de démontrabilité
# et des conditions (D2), (D3) dans PA (point (ii) de l-incompletude, (D3) levé en cal-sigma-pa) : termes
# fonctionnels (élimination des symboles des fonctions primitives récursives) et énoncés vrais de la classe 𝒮 ;
# puissances de 2, décomposition 2^n (2k + 1) ; ajout, début et dernier terme d'un code ; itérés, longueur, termes,
# extensionnalité ; concaténation ; récurrence de valeurs ; formule naturelle de démontrabilité Pr_T = ∃p D̂(p, v),
# D = Dem_{T′} ∧ En, qui est équivalente dans PA à une formule de démontrabilité ∃yδ, mise bout à bout de deux
# démonstrations et (D2).
# Constructions : celles de cal-pr-codage, cal-pr-cloture et cal-sx-* lues littéralement.
# Tout est démontré dans le système de l-deduction, avec les règles de cal-rp-calcul, cal-pa-recurrence et des
# chapitres cal-peano, cal-beta-pa. Aucune forme de l'axiome du choix. Identifiants « cal-sp- ».

graphe: cal-syntaxe-pa
titre: Suites codées et démonstrations dans PA
conteneur: cal-syntaxe-pa

entrees:
  cal-beta-pa: [cal-sp-termes]

noeuds:
  - id: cal-sp-termes
    etiquette: Termes fonctionnels
    nature: lemme
    titre: Termes fonctionnels et énoncés vrais de la classe 𝒮 dans l'arithmétique de Peano
    texte: |
      Les conventions sont celles de {{cal-bp-relations|Relations p.r. dans PA}}. Chaque fonction primitive récursive est donnée avec une construction, celle qu'écrivent les preuves des chapitres {{cal-primitives|Fonctions primitives récursives}} et {{cal-syntaxe|Arithmétisation de la syntaxe}}, et elle s'écrit dans $\mathsf{PA}$ par une définition naturelle du point (vi) de {{cal-bp-fonctions|Fonctions p.r. dans PA}}, prise avec une partie $V$ qui contient toutes les variables en jeu ; le point (vii) du même nœud rend ce choix indifférent, à l'équivalence près dans $\mathsf{PA}$. Les termes du langage sont dits *ordinaires*.

      Les *termes fonctionnels* sont les mots obtenus à partir des variables et de $0$ par $S$, $+$, $\times$ et par l'application des fonctions primitives récursives : si $f$ est d'[[arite|arité]] $n$ et si $\tau_1, \dots, \tau_n$ sont des termes fonctionnels, $f(\tau_1, \dots, \tau_n)$ en est un. Ce ne sont pas des termes du langage, qui n'a que les symboles $0$, $S$, $+$ et $\times$ ; une formule écrite avec des termes fonctionnels, ou *formule fonctionnelle*, abrège une formule du langage, sa *traduction*, que l'on définit ainsi.

      Pour une formule $\chi$, une variable $x$ et un terme fonctionnel $\tau$ dont aucune variable n'est quantifiée dans $\chi$, on définit $\chi[\tau/x]$ par récurrence sur $\tau$. Si $\tau$ est ordinaire, c'est la substitution habituelle. Si $\tau = f(\tau_1, \dots, \tau_n)$, on prend des variables nouvelles $e, e_1, \dots, e_n$ et l'on pose
      $$\begin{aligned} \chi[\tau/x] = {}&\exists e\, \big(f(e_1, \dots, e_n) = e \\ &\quad \wedge \chi[e/x]\big)[\tau_1/e_1] \cdots [\tau_n/e_n], \end{aligned}$$
      où $f(e_1, \dots, e_n) = e$ est la définition naturelle de $f$ écrite avec ces variables, au sens de {{cal-bp-fonctions|Fonctions p.r. dans PA}} ; quand $\tau_k$ est ordinaire, on l'écrit directement à la place de $e_k$. Si $\tau$ est $S\,\tau_1$, $\tau_1 + \tau_2$ ou $\tau_1 \times \tau_2$, on substitue de même $S\,e_1$, $e_1 + e_2$ ou $e_1 \times e_2$ à $x$, puis les $\tau_k$ aux $e_k$. Une égalité $\tau = \sigma$ abrège $(x = y)[\tau/x][\sigma/y]$, pour des variables nouvelles $x$ et $y$, et, pour une relation primitive récursive $R$, la formule $\hat R(\tau_1, \dots, \tau_n)$ abrège $\hat R(v)[u/v][\tau_1/u_1] \cdots [\tau_n/u_n]$, où $[u/v]$ est la substitution simultanée de variables nouvelles $u_1, \dots, u_n$ aux $v_k$, comme au nœud {{cal-bp-relations|Relations p.r. dans PA}}, de sorte que les termes $\tau_k$ ne se substituent pas les uns dans les autres ; les connecteurs et les quantificateurs se traduisent par eux-mêmes, et $\Phi[\tau/x]$ désigne la formule fonctionnelle obtenue en écrivant $\tau$ à la place des [[occurrence|occurrences]] libres de $x$. Les variables *nouvelles* sont les premières, dans l'ordre $x_0, x_1, \dots$, qui ne figurent ni dans les formules et les termes en jeu, ni dans les définitions naturelles employées : la traduction est déterminée à l'équivalence près dans $\mathsf{PA}$, et l'on prend toujours les variables nouvelles hors des termes à substituer. Deux traductions d'une même formule fonctionnelle écrites avec d'autres variables nouvelles, ou avec d'autres définitions naturelles des mêmes constructions, sont équivalentes dans $\mathsf{PA}$ : par récurrence sur la traduction, le renommage d'une variable existentielle ({{cal-rp-calcul|Calcul à variables libres}}, (iii)), appliqué dans les deux sens comme au point (ii) de {{cal-pa-sigma|Collection et forme Σ₁}}, le point (vii) de {{cal-bp-fonctions|Fonctions p.r. dans PA}} et la monotonie de {{cal-pa-recurrence|Récurrence dans PA}}, (ii), passent de l'une à l'autre. On ne les distingue donc pas.

      Quand les arguments $t_k$ et le terme $s$ sont ordinaires, la formule $f(t_1, \dots, t_n) = s$ garde le sens qu'elle a au nœud {{cal-bp-fonctions|Fonctions p.r. dans PA}} ; sa traduction $\exists e\, (f(t) = e \wedge e = s)$ lui est équivalente par le point (i) de {{cal-bp-usuelles|Fonctions usuelles dans PA}}, et l'on emploie l'une pour l'autre.
    enonce: |
      Soit $\Gamma$ un ensemble fini de formules, $\Phi$ et $\Psi$ des formules fonctionnelles, et $\tau$, $\sigma$, $\rho$ des termes fonctionnels dont aucune variable n'est quantifiée dans $\Phi$.

      (i) **Valeurs.** Soit $f(t) = f(t_1, \dots, t_n)$ un terme fonctionnel dont les arguments $t_k$ sont ordinaires, et $e$ une variable qui ne figure ni dans $\Phi$, ni dans sa traduction, ni dans les $t_k$. Remplaçons par $e$ certaines occurrences de $f(t)$ dans $\Phi$, dont aucune n'est dans la [[portee-quantificateur|portée]] d'un quantificateur sur une variable des $t_k$, et notons $\Phi_e$ la formule obtenue. Alors $\{f(t) = e\} \vdash_{\mathsf{PA}} \Phi \leftrightarrow \Phi_e$.

      (ii) **Règles.** (a) Si $e$ ne figure ni dans $\Gamma$, ni dans $\Psi$ et sa traduction, ni dans les $t_k$, et si $\Gamma \cup \{f(t) = e\} \vdash_{\mathsf{PA}} \Psi$, alors $\Gamma \vdash_{\mathsf{PA}} \Psi$.

      (b) Si $x$ n'est libre dans aucune formule de $\Gamma$ et si $\Gamma \vdash_{\mathsf{PA}} \Phi$, alors $\Gamma \vdash_{\mathsf{PA}} \Phi[\tau/x]$.

      (c) On a $\vdash_{\mathsf{PA}} \tau = \tau$, $\vdash_{\mathsf{PA}} \tau = \sigma \to \sigma = \tau$, $\vdash_{\mathsf{PA}} (\tau = \sigma \wedge \sigma = \rho) \to \tau = \rho$ et $\vdash_{\mathsf{PA}} \tau = \sigma \to (\Phi[\tau/x] \leftrightarrow \Phi[\sigma/x])$.

      (d) Si $h = f \circ (g_1, \dots, g_m)$, alors $\vdash_{\mathsf{PA}} h(\tau_1, \dots, \tau_n) = f(g_1(\tau), \dots, g_m(\tau))$, où $g_j(\tau)$ abrège $g_j(\tau_1, \dots, \tau_n)$ ; et la formule naturelle $\hat P$ de la relation $P(v) \iff R(g_1(v), \dots, g_m(v))$ vérifie $\vdash_{\mathsf{PA}} \hat P(\tau) \leftrightarrow \hat R(g_1(\tau), \dots, g_m(\tau))$.

      (iii) **Énoncés vrais de $\mathcal S$.** Tout énoncé de la classe $\mathcal S$ de {{cal-rp-forme-sigma|Forme Σ₁ des r.e.}} qui est vrai dans $\mathcal N$ est démontrable dans $\mathsf{PA}$.

      (iv) **Calculs clos.** Soit $\Phi$ un énoncé fonctionnel obtenu, par $\wedge$ et $\vee$, à partir d'égalités $\tau = \sigma$ et de formules $\hat R(\tau_1, \dots, \tau_n)$ ou $\neg\hat R(\tau_1, \dots, \tau_n)$, où les termes fonctionnels sont clos. Si $\Phi$ est vrai dans $\mathcal N$ quand on y lit chaque symbole $f$ comme la fonction $f$ et chaque $\hat R$ comme la relation $R$, alors $\vdash_{\mathsf{PA}} \Phi$. En particulier, pour des entiers $a_1, \dots, a_n$, on a $\vdash_{\mathsf{PA}} f(\underline{a_1}, \dots, \underline{a_n}) = \underline b$, où $b = f(a_1, \dots, a_n)$, et $\vdash_{\mathsf{PA}} \hat R(\underline{a_1}, \dots, \underline{a_n})$ ou $\vdash_{\mathsf{PA}} \neg\hat R(\underline{a_1}, \dots, \underline{a_n})$ selon que $R(a_1, \dots, a_n)$ est vraie ou non.
    preuve: |
      (i) Par récurrence sur les termes, la définition de la traduction montre que chaque occurrence de $f(t)$ produit, dans la traduction de la [[formule-atomique|formule atomique]] où elle figure, une [[sous-formule|sous-formule]] $\exists e'\, (f(t) = e' \wedge \beta)$, où $e'$ est une variable nouvelle et $\beta$ la traduction du reste, écrite avec $e'$ à la place de $f(t)$ ; comme $e$ est un terme ordinaire, la traduction de $\Phi_e$, écrite avec les mêmes variables nouvelles, ce que permet l'équivalence des traductions établie dans le texte, porte au même endroit la formule $\beta[e/e']$, où $e$ est substituable puisque les variables nouvelles de la traduction sont prises hors de $e$.

      Sous l'hypothèse $f(t) = e$, montrons $\exists e'\, (f(t) = e' \wedge \beta) \leftrightarrow \beta[e/e']$. Sous l'hypothèse supplémentaire $f(t) = e' \wedge \beta$, le point (ii) de {{cal-bp-fonctions|Fonctions p.r. dans PA}} donne $e' = e$, et le remplacement d'un terme ({{cal-rp-calcul|Calcul à variables libres}}, (v)) donne $\beta[e/e']$ ; l'élimination de $e'$, qui n'est libre ni dans $f(t) = e$ ni dans $\beta[e/e']$, donne un sens. Pour l'autre, $(f(t) = e' \wedge \beta)[e/e']$ est $f(t) = e \wedge \beta[e/e']$, et l'introduction de l'existentiel, avec le terme $e$, conclut.

      Les variables liées au-dessus de cette sous-formule, dans la traduction de $\Phi$, sont des variables quantifiées dans $\Phi$ ou introduites par la traduction ; par hypothèse et par le choix des variables nouvelles, aucune n'est $e$ ni une variable des $t_k$, et aucune n'est donc libre dans $f(t) = e$. Une récurrence sur la formule, avec la règle des tautologies pour les connecteurs et la monotonie du point (ii) de {{cal-pa-recurrence|Récurrence dans PA}} pour les quantificateurs, permise sous l'hypothèse $f(t) = e$, remplace la sous-formule par son équivalente. On traite ainsi les occurrences choisies une à une.

      (ii) (a) Par le point (ii) de {{cal-bp-fonctions|Fonctions p.r. dans PA}}, $\vdash_{\mathsf{PA}} \exists e\ f(t) = e$, puisque $e$ ne figure pas dans les $t_k$. L'élimination de l'existentiel ({{cal-pa-recurrence|Récurrence dans PA}}, (i)), permise puisque $e$ n'est libre ni dans $\Gamma$ ni dans $\Psi$, donne $\Gamma \cup \{\exists e\ f(t) = e\} \vdash_{\mathsf{PA}} \Psi$, puis $\Gamma \vdash_{\mathsf{PA}} \Psi$.

      (b) Par récurrence sur le nombre de symboles de fonctions primitives récursives de $\tau$. Si $\tau$ est ordinaire, la traduction de $\Phi[\tau/x]$ est celle de $\Phi$ où l'on a substitué $\tau$ à $x$, puisqu'on prend les variables nouvelles de la traduction hors de $\tau$, ce que permet l'équivalence des traductions établie dans le texte. La généralisation sous hypothèses ({{cal-pa-recurrence|Récurrence dans PA}}, (i)) donne $\Gamma \vdash_{\mathsf{PA}} \forall x\, \Phi$, et l'axiome (2), avec le terme $\tau$, qui est substituable puisqu'aucune de ses variables n'est quantifiée dans la traduction, donne $\Gamma \vdash_{\mathsf{PA}} \Phi[\tau/x]$. Sinon, soit $f(t)$ un sous-terme de $\tau$ dont les arguments sont ordinaires, $e$ une variable nouvelle, et $\tau_e$ le terme obtenu en remplaçant cette occurrence par $e$. L'hypothèse de récurrence donne $\Gamma \vdash_{\mathsf{PA}} \Phi[\tau_e/x]$. Les occurrences de $f(t)$ qui viennent de $\tau$ ne sont dans la portée d'aucun quantificateur sur une variable des $t_k$, puisqu'aucune variable de $\tau$ n'est quantifiée dans $\Phi$ ; le point (i) donne donc $\{f(t) = e\} \vdash_{\mathsf{PA}} \Phi[\tau/x] \leftrightarrow \Phi[\tau_e/x]$, d'où $\Gamma \cup \{f(t) = e\} \vdash_{\mathsf{PA}} \Phi[\tau/x]$, et (a) conclut.

      (c) Par des applications répétées de (i), en commençant par les termes intérieurs, on remplace $\tau$, $\sigma$ et $\rho$, sous des hypothèses $f(t) = e$ portant sur des variables nouvelles, par des variables $e_\tau$, $e_\sigma$, $e_\rho$ : on dit qu'on *écrit avec les valeurs*. Les quatre formules deviennent $e_\tau = e_\tau$, $e_\tau = e_\sigma \to e_\sigma = e_\tau$, la transitivité, et $e_\tau = e_\sigma \to (\Phi[e_\tau/x] \leftrightarrow \Phi[e_\sigma/x])$, qui découlent des points (v) et (vi) de {{cal-rp-calcul|Calcul à variables libres}}, appliqués à la traduction de $\Phi$, où $e_\tau$ et $e_\sigma$ sont substituables. Le point (a) élimine les hypothèses.

      (d) Par le point (i) de {{cal-bp-usuelles|Fonctions usuelles dans PA}}, dernière assertion, on a, pour des variables nouvelles $e_j$, $\{g_1(v) = e_1, \dots, g_m(v) = e_m\} \vdash_{\mathsf{PA}} h(v) = w \leftrightarrow f(e_1, \dots, e_m) = w$. Sous les mêmes hypothèses, le point (i) donne $f(g_1(v), \dots, g_m(v)) = w \leftrightarrow f(e_1, \dots, e_m) = w$, et (a) élimine les hypothèses : $\vdash_{\mathsf{PA}} h(v) = w \leftrightarrow f(g_1(v), \dots, g_m(v)) = w$. Écrite avec la valeur $w$ de $h(v)$, c'est l'égalité annoncée pour les variables $v$, et (b) la donne pour les termes $\tau$. Pour la relation, le point (iii) de {{cal-bp-relations|Relations p.r. dans PA}} donne $\vdash_{\mathsf{PA}} \hat P(v) \leftrightarrow \exists z_1 \cdots \exists z_m\, \big(g_1(v) = z_1 \wedge \cdots \wedge g_m(v) = z_m \wedge \hat R(z)\big)$, et la traduction de $\hat R(g_1(v), \dots, g_m(v))$ imbrique les $g_j$ dans l'ordre inverse, puisque la dernière substitution est la plus extérieure : c'est $\exists z_m\, \big(g_m(v) = z_m \wedge \cdots \exists z_1\, (g_1(v) = z_1 \wedge \hat R(z)) \cdots\big)$. Elles sont équivalentes par la logique pure. D'une part, si $z$ n'est pas libre dans $\alpha$, alors $\vdash \exists z\, (\alpha \wedge \beta) \leftrightarrow (\alpha \wedge \exists z\, \beta)$, par l'introduction et l'élimination de l'existentiel du point (iii) de {{cal-rp-calcul|Calcul à variables libres}} et la règle des tautologies ; cela fait sortir chaque $g_j(v) = z_j$, où les autres $z_l$ ne figurent pas, de la portée des quantificateurs qu'il précède ou qui le suivent. D'autre part, $\vdash \exists z\, \exists z'\, \gamma \leftrightarrow \exists z'\, \exists z\, \gamma$, par deux introductions et deux éliminations, ce qui permet de ranger les quantificateurs dans le même ordre. Le point (b) conclut.

      (iii) Soit $\sigma$ un énoncé de $\mathcal S$, vrai dans $\mathcal N$. Par le point (ii) de {{cal-pa-sigma|Collection et forme Σ₁}}, une construction de $\sigma$ lui associe une formule $\exists y\, \delta$, où $\delta$ est Δ₀ et n'a pas d'autre variable libre que $y$, telle que $\vdash_{\mathsf{PA}} \sigma \leftrightarrow \exists y\, \delta$ ; c'est un énoncé Σ₁. La structure $\mathcal N$ est un modèle de $\mathsf{PA}$ ({{cal-rp-godel-rosser|Gödel-Rosser}}, (iii)), et le {{l-correction|théorème de correction}} y rend vraie cette équivalence : $\exists y\, \delta$ est vrai dans $\mathcal N$. La {{cal-rp-sigma1|Σ₁-complétude}}, (iii), donne $\mathsf Q \vdash \exists y\, \delta$, donc $\vdash_{\mathsf{PA}} \exists y\, \delta$, puisque $\mathsf{PA}$ démontre tout ce que démontre $\mathsf Q$ ({{cal-pa-recurrence|Récurrence dans PA}}), et la règle des tautologies donne $\vdash_{\mathsf{PA}} \sigma$.

      (iv) Remplaçons dans $\Phi$ chaque formule $\neg\hat R(\tau_1, \dots, \tau_n)$ par $\chi_R(\tau_1, \dots, \tau_n) = 0$, et notons $\Phi'$ le résultat. Par le point (i) de {{cal-bp-relations|Relations p.r. dans PA}}, $\vdash_{\mathsf{PA}} \neg\hat R(v) \leftrightarrow \chi_R(v) = 0$, et (b), appliqué d'abord à des variables nouvelles $u_k$ substituées aux $v_k$, puis aux termes $\tau_k$ substitués aux $u_k$, donne ces équivalences pour les termes $\tau_k$, en une substitution simultanée ; la règle des tautologies donne $\vdash_{\mathsf{PA}} \Phi \leftrightarrow \Phi'$. La traduction de $\Phi'$ est dans $\mathcal S$ : elle s'obtient par $\wedge$, $\vee$ et des quantifications existentielles à partir de formules atomiques, de formules $f(e_1, \dots, e_n) = e$, qui sont dans $\mathcal S$ par le point (i) de {{cal-bp-fonctions|Fonctions p.r. dans PA}}, et de formules $\hat R(e_1, \dots, e_n)$, qui y sont aussi. Par le {{l-substitution|lemme de substitution}} et parce que chaque définition naturelle définit le [[graphe-application|graphe]] de sa fonction et chaque formule naturelle sa relation, une récurrence sur les termes montre que la traduction de $\tau = \sigma$ est vraie dans $\mathcal N$ si et seulement si les valeurs de $\tau$ et de $\sigma$, calculées avec les fonctions $f$, sont égales, et de même pour $\hat R(\tau)$ et $\chi_R(\tau) = 0$. La traduction de $\Phi'$ est donc vraie dans $\mathcal N$, et (iii) donne $\vdash_{\mathsf{PA}} \Phi'$, puis $\vdash_{\mathsf{PA}} \Phi$. Les cas particuliers sont ceux d'une seule égalité et d'une seule formule $\hat R$ ou $\neg\hat R$.
    remarques:
      - |
        C'est l'élimination des symboles définis : $\mathsf{PA}$ n'a pas de symbole pour les fonctions primitives récursives, mais, parce qu'elle démontre l'existence et l'unicité de leurs valeurs, on raisonne comme si elle en avait, et chaque égalité entre termes fonctionnels abrège une formule de $\mathcal S$ à quantificateurs existentiels. L'erreur la plus répandue est d'oublier la condition du point (i) sur la portée des quantificateurs : dans $\forall y\ \mathrm{lg}(y) \leqslant y$, l'occurrence de $\mathrm{lg}(y)$ ne peut pas être remplacée par une valeur $e$, qui dépendrait de $y$. Les preuves des nœuds suivants écrivent donc avec les valeurs après avoir éliminé les quantificateurs qui portent sur les arguments, et réintroduisent ceux-ci à la fin.
      - |
        Le point (iv) fait de la {{cal-rp-sigma1|Σ₁-complétude}} un outil de calcul : toute valeur d'une fonction primitive récursive en des entiers donnés est démontrée dans $\mathsf{PA}$, quelle que soit sa taille. Pour $\ulcorner S\, 0 \urcorner = 18\,432$ ({{cal-sx-codage|Codage des mots}}), on a $\vdash_{\mathsf{PA}} \mathrm{lg}(\underline{18\,432}) = S\,S\,0$ dès que les fonctions $\mathrm{lg}$ et $(N)^j$ sont prises avec leurs constructions, et de même $\vdash_{\mathsf{PA}} \widehat{\mathrm{Tm}}(\underline{18\,432})$. Mais ce point ne dit rien d'une formule à variables libres comme $\mathrm{lg}(\mathrm{conc}(M, N)) = \mathrm{lg}(M) + \mathrm{lg}(N)$ : ce sont de telles formules que demandent les conditions de dérivabilité, et les nœuds suivants les démontrent par récurrence. Le point (iv) ne dit rien non plus d'un énoncé vrai qui commence par $\neg\exists$, comme le rappelle la seconde remarque du nœud voisin {{cal-dg-prov|Démontrabilité (D1)}}.

  - id: cal-sp-puissances
    etiquette: Puissances de 2 dans PA
    nature: proposition
    titre: Puissances de 2, parité et décomposition 2ⁿ(2k + 1) dans l'arithmétique de Peano
    texte: |
      Les conventions sont celles de {{cal-sp-termes|Termes fonctionnels}}. La fonction $(x, y) \mapsto x^y$ de {{cal-pr-definition|Primitives récursives}}, notée $\mathrm{pw}$, est prise avec la construction qu'en donne ce nœud : la récurrence primitive à partir de $\mathbf 1 = S \circ Z$ et de $\mathrm{mul} \circ (P^3_3, P^3_1)$, qui traduit $x^0 = 1$ et $x^{y+1} = x^y \cdot x$. On note $2^\tau$ le terme fonctionnel $\mathrm{pw}(S\,S\,0, \tau)$, et, pour un terme fonctionnel $\tau$, on note $\mathrm O(\tau)$ le terme fonctionnel $S(\tau + \tau)$, dont la valeur dans $\mathcal N$ est l'entier impair $2\tau + 1$.
    enonce: |
      Pour tous termes fonctionnels $t$ et $u$ :

      (i) **Équations.** $\vdash_{\mathsf{PA}} \mathrm{pw}(t, 0) = S\,0$, $\vdash_{\mathsf{PA}} \mathrm{pw}(t, S\,u) = \mathrm{pw}(t, u) \times t$, $\vdash_{\mathsf{PA}} 2^0 = S\,0$ et $\vdash_{\mathsf{PA}} 2^{S\,u} = 2^u + 2^u$.

      (ii) **Lois.** $\vdash_{\mathsf{PA}} 2^{t + u} = 2^t \times 2^u$, $\vdash_{\mathsf{PA}} \neg(2^t = 0)$ et $\vdash_{\mathsf{PA}} t < 2^t$.

      (iii) **Parité.** $\vdash_{\mathsf{PA}} \neg(t + t = \mathrm O(u))$ et $\vdash_{\mathsf{PA}} t + t = u + u \to t = u$.

      (iv) **Décomposition.** Pour des variables $N$, $n$, $k$ distinctes,
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\neg(N = 0) \\ &\to \exists n\, \exists k\, \big(N = 2^n \times \mathrm O(k)\big), \end{aligned}$$
      et, pour tous termes fonctionnels $n$, $n'$, $k$, $k'$,
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&2^n \times \mathrm O(k) = 2^{n'} \times \mathrm O(k') \\ &\to (n = n' \wedge k = k'). \end{aligned}$$
    preuve: |
      Par le point (ii) (b) de {{cal-sp-termes|Termes fonctionnels}}, il suffit d'établir chaque formule pour des variables distinctes $x$, $y$, … à la place des termes. On raisonne par chaînes d'égalités, comme au nœud {{cal-pa-lois|Lois de + et ×}}, entre termes fonctionnels : le point (ii) (c) du nœud {{cal-sp-termes|Termes fonctionnels}} justifie la symétrie, la transitivité et le remplacement d'un sous-terme par un terme égal.

      (i) Par le point (iv) de {{cal-bp-fonctions|Fonctions p.r. dans PA}}, $\mathrm{pw}(x, 0) = w$ équivaut à $\mathbf 1(x) = w$, c'est-à-dire à $w = S\,0$ par le point (ii) de {{cal-bp-usuelles|Fonctions usuelles dans PA}}. Sous l'hypothèse $\mathrm{pw}(x, y) = u$, la seconde équation du même point et le point (i) de {{cal-sp-termes|Termes fonctionnels}} ramènent $\mathrm{pw}(x, S\,y) = w$ à $\mathrm{mul}(u, x) = w$, c'est-à-dire, par les points (i) et (ii) de {{cal-bp-usuelles|Fonctions usuelles dans PA}}, à $w = u \times x$ : écrite avec la valeur $u$, c'est la deuxième égalité. Pour $x = S\,S\,0$, la première donne $2^0 = S\,0$, et la seconde donne $2^{S\,y} = 2^y \times S\,S\,0 = 2^y \times S\,0 + 2^y = 2^y + 2^y$, par $\mathrm Q_7$ et le point (iii) de {{cal-pa-lois|Lois de + et ×}}.

      (ii) *Somme des exposants.* Récurrence sur $y$, avec le paramètre $x$. Pour $0$, $\mathrm Q_4$ donne $2^{x + 0} = 2^x = 2^x \times S\,0 = 2^x \times 2^0$. Pour le pas, sous l'hypothèse $2^{x + y} = 2^x \times 2^y$, on a, par $\mathrm Q_5$, (i) et la distributivité,
      $$\begin{aligned} 2^{x + S\,y} &= 2^{S(x + y)} \\ &= 2^{x + y} + 2^{x + y} \\ &= 2^x \times 2^y + 2^x \times 2^y \\ &= 2^x \times (2^y + 2^y) \\ &= 2^x \times 2^{S\,y}. \end{aligned}$$
      *Non-nullité.* Récurrence sur $y$ : $2^0 = S\,0$ n'est pas nul par $\mathrm Q_1$, et, si $2^{S\,y} = 0$, alors $2^y + 2^y = 0$, puis $2^y = 0$ par le point (ii) de {{cal-pa-lois|Lois de + et ×}}, contrairement à l'hypothèse de récurrence.

      *Majoration.* Récurrence sur $y$ : $0 < S\,0$, c'est-à-dire $S\,0 \leqslant S\,0$, est la réflexivité. Sous l'hypothèse $y < 2^y$, c'est-à-dire $S\,y \leqslant 2^y$, la non-nullité et le point (v) de {{cal-pa-ordre|Ordre dans PA}}, avec $0 \leqslant 2^y$, donnent $0 < 2^y$, c'est-à-dire $S\,0 \leqslant 2^y$. La compatibilité de l'ordre avec l'addition, point (vi) du même nœud, appliquée deux fois avec la commutativité, et la transitivité donnent $S\,y + S\,0 \leqslant 2^y + 2^y$, c'est-à-dire $S\,S\,y \leqslant 2^{S\,y}$, puisque $S\,y + S\,0 = S(S\,y + 0) = S\,S\,y$ : c'est $S\,y < 2^{S\,y}$.

      (iii) *Imparité.* Montrons $\forall u\, \neg(x + x = \mathrm O(u))$ par récurrence sur $x$, où $u$ est une variable distincte de $x$. Pour $0$, $0 + 0 = 0$, et $\mathrm O(u) = 0$ contredirait $\mathrm Q_1$. Pour le pas, raisonnons sous l'hypothèse de récurrence et sous $S\,x + S\,x = \mathrm O(u)$. Par le point (i) de {{cal-pa-lois|Lois de + et ×}} et $\mathrm Q_5$, $S\,x + S\,x = S(x + S\,x) = S\,S(x + x)$, et $\mathrm Q_2$ donne $S(x + x) = u + u$. Si $u = 0$, alors $S(x + x) = 0$, contraire à $\mathrm Q_1$. Sinon, l'instance $\neg(u = 0) \to \exists a\, (u = S\,a)$ de $\mathrm Q_3$ et l'élimination fournissent $a$ tel que $u = S\,a$ ; le même calcul donne $u + u = S\,S(a + a)$, puis $x + x = S(a + a) = \mathrm O(a)$ par $\mathrm Q_2$, ce que l'hypothèse de récurrence, instanciée par $a$, exclut. La généralisation en $u$, qui n'est pas libre dans l'hypothèse de récurrence, et le point (iii) de {{cal-pa-recurrence|Récurrence dans PA}} concluent.

      *Simplification.* Par $\mathrm Q_7$ et le point (iii) de {{cal-pa-lois|Lois de + et ×}}, $x \times S\,S\,0 = x + x$ ; le point (iv) du même nœud, avec $r = S\,0$, donne $x \times S\,S\,0 = y \times S\,S\,0 \to x = y$.

      (iv) *Existence.* Notons $\varphi$ la formule $\neg(N = 0) \to \exists n\, \exists k\, (N = 2^n \times \mathrm O(k))$, et appliquons la récurrence forte ({{cal-pa-division|Plus petit élément, division}}, (ii)), avec $\Gamma$ vide : il suffit de démontrer $\varphi$ sous l'hypothèse $H = \forall y \leqslant N\ (y = N \vee \varphi[y/N])$, où $y$ est nouvelle. Sous $H$ et $\neg(N = 0)$, la division euclidienne par $S\,S\,0$, point (iii) du même nœud, et l'élimination fournissent $g$ et $d$ tels que $g \times S\,S\,0 + d = N$ et $d < S\,S\,0$. Par le point (v) de {{cal-pa-ordre|Ordre dans PA}}, $d \leqslant S\,0$, et le point (ii) du même nœud, appliqué deux fois, donne $d = 0$ ou $d = S\,0$ ; d'autre part $g \times S\,S\,0 = g + g$.

      Si $d = S\,0$, alors $N = (g + g) + S\,0 = \mathrm O(g)$ par $\mathrm Q_5$ et $\mathrm Q_4$, et $2^0 \times \mathrm O(g) = S\,0 \times \mathrm O(g) = \mathrm O(g)$ ; deux introductions, avec les termes $0$ et $g$, concluent. Si $d = 0$, alors $N = g + g$. On a $\neg(g = 0)$, sinon $N = 0 + 0 = 0$ ; $g \leqslant N$, par le point (i) de {{cal-pa-ordre|Ordre dans PA}} ; et $\neg(g = N)$, sinon $g + g = g + 0$ et la simplification donnerait $g = 0$. Le point (vii) (a) du même nœud, appliqué à $H$ avec le terme $g$, donne $g = N \vee \varphi[g/N]$, et $\neg(g = N)$ écarte le premier cas ; d'où $n$ et $k$ tels que $g = 2^n \times \mathrm O(k)$, par l'élimination. Alors, par la distributivité et (i),
      $$\begin{aligned} N &= 2^n \times \mathrm O(k) + 2^n \times \mathrm O(k) \\ &= (2^n + 2^n) \times \mathrm O(k) \\ &= 2^{S\,n} \times \mathrm O(k), \end{aligned}$$
      et deux introductions, avec les termes $S\,n$ et $k$, concluent. Le raisonnement par cas et l'élimination des variables introduites donnent $\{H\} \vdash_{\mathsf{PA}} \varphi$.

      *Unicité.* On note d'abord que, pour tout terme fonctionnel $c$, (i) et la distributivité donnent $2^{S\,m} \times c = 2^m \times c + 2^m \times c$, et $2^0 \times \mathrm O(k) = \mathrm O(k)$. Soit $\psi$ la formule $\forall n'\, \forall k\, \forall k'\, \big(2^n \times \mathrm O(k) = 2^{n'} \times \mathrm O(k') \to (n = n' \wedge k = k')\big)$ ; montrons-la par récurrence sur $n$. Dans chaque cas, on raisonne sous l'hypothèse de l'égalité, et l'on distingue $n' = 0$ et $n' = S\,m'$, par l'instance de $\mathrm Q_3$.

      Pour $n = 0$ : si $n' = 0$, l'égalité est $\mathrm O(k) = \mathrm O(k')$, et $\mathrm Q_2$ et (iii) donnent $k = k'$ ; si $n' = S\,m'$, elle s'écrit $\mathrm O(k) = c' + c'$, avec $c' = 2^{m'} \times \mathrm O(k')$, ce que (iii) exclut. Pour le pas, sous l'hypothèse $\psi$, l'égalité s'écrit $c + c = 2^{n'} \times \mathrm O(k')$, avec $c = 2^n \times \mathrm O(k)$ : si $n' = 0$, (iii) l'exclut ; si $n' = S\,m'$, elle devient $c + c = c' + c'$, donc $c = c'$ par (iii), et $\psi$, instanciée par $m'$, $k$ et $k'$, donne $n = m'$ et $k = k'$, d'où $S\,n = n'$. La généralisation en $n'$, $k$, $k'$, puis le point (iii) de {{cal-pa-recurrence|Récurrence dans PA}} et l'instanciation concluent.
    remarques:
      - |
        Le langage de l'arithmétique n'a pas de symbole d'exponentiation, et l'erreur la plus répandue est de lire $2^t$ comme un terme. C'est un terme fonctionnel : la formule $2^t = s$ est la définition naturelle de $\mathrm{pw}$, écrite avec la fonction $\beta$ de Gödel, et la loi $2^{t + u} = 2^t \times 2^u$ abrège une formule de $\mathcal S$ qui commence par trois quantificateurs existentiels, un par valeur, que $\mathsf{PA}$ démontre par une récurrence. Les équations du point (i) sont exactement celles que le nœud {{cal-bp-fonctions|Fonctions p.r. dans PA}} met à disposition pour une fonction définie par récurrence primitive ; tout le reste en découle.
      - |
        Le point (iv) est la forme interne à $\mathsf{PA}$ de la surjectivité du point (ii) de {{cal-pr-codage|Codages}} : tout entier non nul s'écrit $2^n(2k + 1)$, et il code alors la suite codée par $n$, suivie du terme $k$. Par exemple $12 = 2^2 \cdot 3$ : le dernier terme est $k = 1$, et $n = 2 = 2^1 \cdot 1$ code à son tour une suite de dernier terme $0$, précédée de la suite codée par $1 = 2^0 \cdot 1$, c'est-à-dire $(0)$. Ainsi $12 = \langle 0, 0, 1 \rangle$. La décomposition et ses deux composantes ont été vérifiées par un calcul pour tous les entiers $N < 600$.
      - |
        La récurrence du point (iii) est indispensable. Une parité qui ne dirait que « $t + t$ et $\mathrm O(u)$ ne sont pas égaux pour des chiffres » ne suffirait pas : l'unicité du point (iv) porte sur des variables, et c'est elle qui fera, au nœud suivant, du dernier terme et du début d'un code des fonctions bien définies aux yeux de $\mathsf{PA}$.

  - id: cal-sp-ajout
    etiquette: Ajout dans PA
    nature: proposition
    titre: Ajout d'un terme, début et dernier terme d'un code dans l'arithmétique de Peano
    texte: |
      Les conventions sont celles de {{cal-sp-termes|Termes fonctionnels}}, et l'on note $\mathrm O(\tau)$ et $2^\tau$ comme au nœud {{cal-sp-puissances|Puissances de 2 dans PA}}. Les fonctions de ce nœud sont prises avec les constructions qu'écrivent les preuves de {{cal-pr-cloture|Clôture}} et de {{cal-pr-codage|Codages}}.

      La relation de divisibilité de {{cal-pr-cloture|Clôture}}, (v), est $\exists k < x + 1\ (dk = x)$ : l'égalité $\mathrm{mul}(d, k) = x$, puis la quantification bornée par une variable $y$, puis la substitution de $S\,x$ à $y$. On note $d \mathrel{\hat|} x$ sa formule naturelle, pour la distinguer de la formule $t \mid u$ de {{cal-pa-bezout|Bézout, lemme chinois}}. Le quotient est $q(x, d) = \mu z < x + 1\, \big(x < d(z + 1)\big)$, minimisation bornée de la relation $x < \mathrm{mul}(d, S\,z)$, de borne $S\,x$.

      La fonction $i \mapsto p_i$ est définie par récurrence primitive sans paramètre, à partir de l'entier $2$ ; on n'en emploie que la valeur en $0$. L'exposant $(x)_i$ est le plus petit $k < x$ tel que $\mathrm{pw}(p_i, S\,k)$ ne divise pas $x$ : c'est la minimisation bornée, de borne $x$, de la négation de la relation de divisibilité, où l'on a substitué $\mathrm{pw}(p_i, S\,k)$ à $d$ ; le début d'un code est $\mathrm{dbt}(N) = (N)_0$, et son dernier terme est
      $$\mathrm{dr}(N) = q\big(q(N, 2^{\mathrm{dbt}(N)}) \mathbin{\dot{-}} S\,0,\ S\,S\,0\big).$$
      L'ajout $\mathrm{aj}(N, k) = 2^N(2k + 1)$ est pris avec la construction $\mathrm{mul} \circ \big(\mathrm{pw} \circ (\mathbf 2 \circ P^2_1, P^2_1),\ S \circ \mathrm{add} \circ (P^2_2, P^2_2)\big)$, où $\mathbf 2 = S \circ S \circ Z$. Cette construction est fixée ici par convention : le point (iii) de {{cal-pr-codage|Codages}} donne la formule $2^N(2k + 1)$ et dit seulement que la fonction est primitive récursive. Le choix n'importe pas : pour deux constructions d'une même fonction dont $\mathsf{PA}$ démontre l'égalité des valeurs, en termes fonctionnels, les définitions naturelles sont équivalentes dans $\mathsf{PA}$, par les points (ii) (c) et (ii) (d) de {{cal-sp-termes|Termes fonctionnels}}, puisque $f(v) = w$ équivaut à $w = f(v)$, puis à $w = g(v)$. La même observation couvre la lecture de $x + 1$ comme $S\,x$ dans les bornes des minimisations, ici et aux nœuds suivants, et celle de la fonction nulle par $Z \circ P^p_1$ dans la récurrence de valeurs. Par le point (ii) (d) de {{cal-sp-termes|Termes fonctionnels}} et le point (ii) de {{cal-bp-usuelles|Fonctions usuelles dans PA}}, on a $\vdash_{\mathsf{PA}} \mathrm{aj}(h, v) = 2^h \times \mathrm O(v)$.
    enonce: |
      Pour tous termes fonctionnels $d$, $x$, $g$, $r$, $n$, $k$, $h$, $v$, $h'$, $v'$ et $N$ :

      (i) **Divisibilité, quotient.** $\vdash_{\mathsf{PA}} d \mathrel{\hat|} x \leftrightarrow d \mid x$, et
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\big(\neg(d = 0) \wedge g \times d + r = x \\ &\quad \wedge r < d\big) \to q(x, d) = g. \end{aligned}$$

      (ii) **Début et dernier terme.** $\vdash_{\mathsf{PA}} \mathrm{dbt}(2^n \times \mathrm O(k)) = n$, $\vdash_{\mathsf{PA}} \mathrm{dr}(2^n \times \mathrm O(k)) = k$ et $\vdash_{\mathsf{PA}} \mathrm{dbt}(0) = 0$.

      (iii) **Ajout.** On a $\vdash_{\mathsf{PA}} \neg(\mathrm{aj}(h, v) = 0)$, $\vdash_{\mathsf{PA}} h < \mathrm{aj}(h, v)$, $\vdash_{\mathsf{PA}} \mathrm{dbt}(\mathrm{aj}(h, v)) = h$, $\vdash_{\mathsf{PA}} \mathrm{dr}(\mathrm{aj}(h, v)) = v$, et
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\mathrm{aj}(h, v) = \mathrm{aj}(h', v') \\ &\to (h = h' \wedge v = v'), \\ \vdash_{\mathsf{PA}} {}&\neg(N = 0) \\ &\to \big(N = \mathrm{aj}(\mathrm{dbt}(N), \mathrm{dr}(N)) \\ &\qquad \wedge \mathrm{dbt}(N) < N\big). \end{aligned}$$
    preuve: |
      Comme au nœud {{cal-sp-puissances|Puissances de 2 dans PA}}, il suffit de traiter des variables, et l'on raisonne par chaînes d'égalités entre termes fonctionnels. Pour une minimisation bornée, on emploie la caractérisation du point (vi) de {{cal-bp-relations|Relations p.r. dans PA}}, avec la borne substituée par le point (ii) (b) de {{cal-sp-termes|Termes fonctionnels}} : pour établir $\mu(v, y) = w$, il suffit d'établir son premier cas, $w < y$, $\hat R(v, w)$ et $\forall z < w\ \neg\hat R(v, z)$. Pour la borne stricte $\exists z < t$, on emploie le point (i) de {{cal-bp-modules|Modules de Gödel}} : si $u < t$ et $\varphi[u/z]$, alors $\exists z < t\ \varphi$, par (b), appliqué à $\neg\varphi$, et la contraposition.

      (i) *Divisibilité.* Par les points (ii) à (iv) de {{cal-bp-relations|Relations p.r. dans PA}} et le point (ii) (d) de {{cal-sp-termes|Termes fonctionnels}}, avec $\mathrm{mul}(d, k) = d \times k$, on a $\vdash_{\mathsf{PA}} d \mathrel{\hat|} x \leftrightarrow \exists k < S\,x\ (d \times k = x)$. Si $\exists k < S\,x\ (d \times k = x)$, raisonnons par l'absurde sous l'hypothèse $\forall k\, \neg(k \times d = x)$ : sous $k < S\,x$, l'axiome (2) et la commutativité donnent $\neg(d \times k = x)$, et le point (i) (a) de {{cal-bp-modules|Modules de Gödel}} donne $\forall k < S\,x\ \neg(d \times k = x)$, contradiction ; donc $\exists k\, (k \times d = x)$, qui est $d \mid x$. Réciproquement, sous l'hypothèse $c \times d = x$, obtenue par élimination : si $d = 0$, alors $x = c \times 0 = 0$, et le terme $0$ convient, puisque $0 < S\,x$ et $d \times 0 = 0 = x$ ; sinon, le point (vi) de {{cal-pa-ordre|Ordre dans PA}} donne $c \leqslant c \times d = x$, donc $c < S\,x$, et $d \times c = x$, et le terme $c$ convient.

      *Quotient.* La relation minimisée a pour formule naturelle $x < d \times S\,z$, par les points (ii) et (iii) de {{cal-bp-relations|Relations p.r. dans PA}}. Sous les hypothèses $\neg(d = 0)$, $g \times d + r = x$ et $r < d$, établissons le premier cas pour $w = g$ et la borne $S\,x$. D'abord $g \leqslant g \times d \leqslant g \times d + r = x$, donc $g < S\,x$. Ensuite $d \times S\,g = g \times d + d$ par $\mathrm Q_7$ et la commutativité, et $S\,r \leqslant d$ donne $S(g \times d + r) = g \times d + S\,r \leqslant g \times d + d$, par $\mathrm Q_5$ et la compatibilité ({{cal-pa-ordre|Ordre dans PA}}, (vi)) : c'est $x < d \times S\,g$. Enfin, sous $z < g$, c'est-à-dire $S\,z \leqslant g$, la compatibilité avec la multiplication donne $d \times S\,z \leqslant d \times g \leqslant x$, ce qui exclut $x < d \times S\,z$ par le dernier point de (v) du même nœud ; le point (i) (a) de {{cal-bp-modules|Modules de Gödel}} donne $\forall z < g\ \neg(x < d \times S\,z)$. Ainsi $q(x, d) = g$.

      (ii) *Début.* Par le point (iv) de {{cal-bp-fonctions|Fonctions p.r. dans PA}}, sans paramètre, $p_0 = w$ équivaut à $w = S\,S\,0$, donc $\vdash_{\mathsf{PA}} \mathrm{pw}(p_0, S\,z) = 2^{S\,z}$. Par le point (iii) de {{cal-bp-relations|Relations p.r. dans PA}} et (i), la relation minimisée dans $\mathrm{dbt}(N) = \mu k < N\ \neg(\cdots)$ a pour formule naturelle, en $(N, 0, z)$, une formule équivalente à $\neg(2^{S\,z} \mid N)$. Soit $N = 2^n \times \mathrm O(k)$ ; établissons le premier cas pour $w = n$ et la borne $N$.

      Par le point (ii) de {{cal-sp-puissances|Puissances de 2 dans PA}} et le point (vi) de {{cal-pa-ordre|Ordre dans PA}}, avec $\neg(\mathrm O(k) = 0)$ par $\mathrm Q_1$, on a $n < 2^n \leqslant N$, donc $n < N$. Ensuite, sous l'hypothèse $c \times 2^{S\,n} = N$, on a $c \times 2^{S\,n} = c \times (2^n \times S\,S\,0) = (c + c) \times 2^n$ et $N = \mathrm O(k) \times 2^n$ ; comme $2^n$ n'est pas nul, l'instance de $\mathrm Q_3$ l'écrit $S\,s$, et la simplification du point (iv) de {{cal-pa-lois|Lois de + et ×}} donne $c + c = \mathrm O(k)$, ce qu'exclut la parité ({{cal-sp-puissances|Puissances de 2 dans PA}}, (iii)) : donc $\neg(2^{S\,n} \mid N)$. Enfin, sous l'hypothèse $z < n$, c'est-à-dire $S\,z \leqslant n$, l'élimination fournit $a$ tel que $a + S\,z = n$ ; alors $2^n = 2^a \times 2^{S\,z}$, et $N = (2^a \times \mathrm O(k)) \times 2^{S\,z}$ donne $2^{S\,z} \mid N$, avec ce témoin ; le point (i) (a) de {{cal-bp-modules|Modules de Gödel}} donne la clause $\forall z < n$. Ainsi $\mathrm{dbt}(N) = n$.

      Pour $N = 0$, le second cas de la caractérisation, $w = 0$ avec la clause vide $\forall z < 0$ ({{cal-bp-modules|Modules de Gödel}}, (i) (a)), donne $\mathrm{dbt}(0) = 0$.

      *Dernier terme.* Soit encore $N = 2^n \times \mathrm O(k)$, de sorte que $\mathrm{dbt}(N) = n$. Comme $\mathrm O(k) \times 2^n + 0 = N$, $\neg(2^n = 0)$ et $0 < 2^n$, (i) donne $q(N, 2^n) = \mathrm O(k)$. Par le point (iii) de {{cal-bp-usuelles|Fonctions usuelles dans PA}}, avec $S\,0 \leqslant \mathrm O(k)$ et $(k + k) + S\,0 = \mathrm O(k)$, on a $\mathrm O(k) \mathbin{\dot{-}} S\,0 = k + k$. Enfin $k \times S\,S\,0 + 0 = k + k$ et $0 < S\,S\,0$, et (i) donne $q(k + k, S\,S\,0) = k$. La chaîne $\mathrm{dr}(N) = q(\mathrm O(k) \mathbin{\dot{-}} S\,0, S\,S\,0) = q(k + k, S\,S\,0) = k$ conclut.

      (iii) Par le point (iv) de {{cal-pa-lois|Lois de + et ×}}, $2^h \times \mathrm O(v) = 0$ donnerait $2^h = 0$ ou $\mathrm O(v) = 0$, que le point (ii) de {{cal-sp-puissances|Puissances de 2 dans PA}} et $\mathrm Q_1$ excluent. Ensuite $h < 2^h \leqslant 2^h \times \mathrm O(v)$, comme en (ii). Les deux égalités suivantes sont (ii), appliqué à $n = h$ et $k = v$ ; l'injectivité en découle, en appliquant $\mathrm{dbt}$ et $\mathrm{dr}$ aux deux membres par le point (ii) (c) de {{cal-sp-termes|Termes fonctionnels}}. Enfin, si $\neg(N = 0)$, la décomposition ({{cal-sp-puissances|Puissances de 2 dans PA}}, (iv)) et l'élimination fournissent $n$ et $k$ tels que $N = 2^n \times \mathrm O(k)$ ; (ii) donne $\mathrm{dbt}(N) = n$ et $\mathrm{dr}(N) = k$, d'où $N = \mathrm{aj}(\mathrm{dbt}(N), \mathrm{dr}(N))$, et $\mathrm{dbt}(N) = n < N$ comme ci-dessus.
    remarques:
      - |
        L'exposant $(x)_0$ est défini par une minimisation bornée, qui cherche le premier $k$ tel que $2^{k+1}$ ne divise pas $x$. Dans $\mathcal N$, la borne $x$ est atteinte pour $x = 0$ seulement ; dans $\mathsf{PA}$, la caractérisation du nœud {{cal-bp-relations|Relations p.r. dans PA}} oblige à montrer que le premier cas a lieu, et c'est l'inégalité $n < 2^n$ qui le permet. L'erreur la plus répandue serait de croire qu'il faut ici le principe du plus petit élément, qui est bien un théorème de $\mathsf{PA}$ ({{cal-pa-division|Plus petit élément, division}}, (i)) : on n'en a pas besoin, puisque la décomposition fournit le candidat $n$, et qu'il suffit de vérifier qu'il satisfait les trois clauses de la caractérisation.
      - |
        Les formules de $\mathrm{dbt}$ et de $\mathrm{dr}$ sont celles du point (iii) de {{cal-pr-codage|Codages}} ; elles ont été recalculées pour tous les entiers $N < 600$, avec la divisibilité et le quotient écrits comme dans {{cal-pr-cloture|Clôture}}, et elles redonnent $n$ et $k$ ; on a vérifié de même $\mathrm{dbt}(0) = 0$ et $q(x, 0) = x + 1$, ce qui explique l'hypothèse $\neg(d = 0)$ du point (i).

  - id: cal-sp-longueur
    etiquette: Longueur dans PA
    nature: proposition
    titre: Itérés, longueur, termes et extensionnalité des codes dans l'arithmétique de Peano
    texte: |
      Les conventions sont celles de {{cal-sp-ajout|Ajout dans PA}}. Les fonctions de ce nœud sont prises avec les constructions du point (iii) de {{cal-pr-codage|Codages}}. Les itérés $D(N, i)$ sont définis par récurrence primitive à partir de $P^1_1$ et de $\mathrm{dbt} \circ P^3_3$, c'est-à-dire $D(N, 0) = N$ et $D(N, i + 1) = \mathrm{dbt}(D(N, i))$. La longueur est la minimisation bornée
      $$\mathrm{lg}(N) = \mu i < N + 1\ \big(D(N, i) = 0\big),$$
      de la relation $D(N, i) = 0$, l'égalité où l'on a substitué $D$ et $Z \circ P^2_1$, de borne $S\,N$. Le terme de rang $j$ est
      $$(N)^j = \mathrm{dr}\big(D(N, \mathrm{lg}(N) \mathbin{\dot{-}} S\,j)\big),$$
      composée de $\mathrm{dr}$, de $D$, de $\dot{-}$, de $\mathrm{lg}$ et de $S$. Comme au nœud {{cal-sp-termes|Termes fonctionnels}}, $\vdash_{\mathsf{PA}} D(N, 0) = N$ et $\vdash_{\mathsf{PA}} D(N, S\,i) = \mathrm{dbt}(D(N, i))$, par le point (iv) de {{cal-bp-fonctions|Fonctions p.r. dans PA}}.
    enonce: |
      Pour tous termes fonctionnels $N$, $M$, $h$, $v$, $i$, $j$ et $w$ :

      (i) **Itérés.** $\vdash_{\mathsf{PA}} D(N, S\,i) = D(\mathrm{dbt}(N), i)$, $\vdash_{\mathsf{PA}} D(0, i) = 0$, $\vdash_{\mathsf{PA}} D(\mathrm{aj}(h, v), S\,i) = D(h, i)$,
      $$\vdash_{\mathsf{PA}} D(N, i) = 0 \vee D(N, i) + i \leqslant N,$$
      et $\vdash_{\mathsf{PA}} D(N, N) = 0$.

      (ii) **Longueur.** Pour une variable $z$ qui ne figure ni dans $N$ ni dans $w$,
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\mathrm{lg}(N) = w \leftrightarrow \big(D(N, w) = 0 \\ &\quad \wedge \forall z < w\ \neg(D(N, z) = 0)\big). \end{aligned}$$
      De plus, $\vdash_{\mathsf{PA}} \mathrm{lg}(0) = 0$, $\vdash_{\mathsf{PA}} \mathrm{lg}(\mathrm{aj}(h, v)) = S\,\mathrm{lg}(h)$, $\vdash_{\mathsf{PA}} \mathrm{lg}(N) \leqslant N$ et $\vdash_{\mathsf{PA}} \mathrm{lg}(N) = 0 \to N = 0$.

      (iii) **Termes de l'ajout.** $\vdash_{\mathsf{PA}} (\mathrm{aj}(h, v))^{\mathrm{lg}(h)} = v$ et
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&j < \mathrm{lg}(h) \\ &\to (\mathrm{aj}(h, v))^j = (h)^j. \end{aligned}$$

      (iv) **Extensionnalité.** Pour une variable $j$ qui ne figure ni dans $M$ ni dans $N$,
      $$\begin{aligned} \vdash_{\mathsf{PA}} \big(&\mathrm{lg}(M) = \mathrm{lg}(N) \\ &\wedge \forall j < \mathrm{lg}(N)\ (M)^j = (N)^j\big) \\ &\to M = N. \end{aligned}$$
    preuve: |
      Comme aux nœuds précédents, il suffit de traiter des variables, et l'on raisonne par chaînes d'égalités entre termes fonctionnels.

      (i) *Première égalité.* Récurrence sur $i$, avec le paramètre $N$. Pour $0$, $D(N, S\,0) = \mathrm{dbt}(D(N, 0)) = \mathrm{dbt}(N) = D(\mathrm{dbt}(N), 0)$. Pour le pas, sous l'hypothèse de récurrence, $D(N, S\,S\,i) = \mathrm{dbt}(D(N, S\,i)) = \mathrm{dbt}(D(\mathrm{dbt}(N), i)) = D(\mathrm{dbt}(N), S\,i)$.

      *Itérés de $0$ et de l'ajout.* Par récurrence sur $i$, $D(0, 0) = 0$ et $D(0, S\,i) = \mathrm{dbt}(D(0, i)) = \mathrm{dbt}(0) = 0$ par le point (ii) de {{cal-sp-ajout|Ajout dans PA}}. Ensuite $D(\mathrm{aj}(h, v), S\,i) = D(\mathrm{dbt}(\mathrm{aj}(h, v)), i) = D(h, i)$, par la première égalité et le point (iii) du même nœud.

      *Décroissance.* Récurrence sur $i$, avec le paramètre $N$. Pour $0$, $D(N, 0) + 0 = N$ et $N \leqslant N$. Pour le pas, écrivons avec la valeur $M$ de $D(N, i)$. Si $M = 0$, alors $D(N, S\,i) = \mathrm{dbt}(0) = 0$. Si $\neg(M = 0)$ et $M + i \leqslant N$, le point (iii) de {{cal-sp-ajout|Ajout dans PA}} donne $\mathrm{dbt}(M) < M$, c'est-à-dire $S\,\mathrm{dbt}(M) \leqslant M$ ; la compatibilité ({{cal-pa-ordre|Ordre dans PA}}, (vi)) et la transitivité donnent $S\,\mathrm{dbt}(M) + i \leqslant N$, et $\mathrm{dbt}(M) + S\,i = S(\mathrm{dbt}(M) + i) = S\,\mathrm{dbt}(M) + i$ par $\mathrm Q_5$ et le point (i) de {{cal-pa-lois|Lois de + et ×}} : c'est $D(N, S\,i) + S\,i \leqslant N$. Dans les deux cas, la disjonction vaut pour $S\,i$.

      *Annulation.* Le point (ii) (b) de {{cal-sp-termes|Termes fonctionnels}}, avec le terme $N$ substitué à $i$, donne $D(N, N) = 0 \vee D(N, N) + N \leqslant N$. Dans le second cas, $D(N, N) + N \leqslant 0 + N$, et la compatibilité donne $D(N, N) \leqslant 0$, puis $D(N, N) = 0$ par le point (ii) de {{cal-pa-ordre|Ordre dans PA}}.

      (ii) *Caractérisation.* La relation minimisée a pour formule naturelle $D(N, i) = 0$, par les points (ii) et (iii) de {{cal-bp-relations|Relations p.r. dans PA}} et le point (ii) (d) de {{cal-sp-termes|Termes fonctionnels}}, puisque $Z \circ P^2_1$ prend la valeur $0$. Par le point (vi) de {{cal-bp-relations|Relations p.r. dans PA}}, avec la borne $S\,N$, la formule $\mathrm{lg}(N) = w$ équivaut à la disjonction de $w < S\,N \wedge D(N, w) = 0 \wedge \forall z < w\ \neg(D(N, z) = 0)$ et de $w = S\,N \wedge \forall z < S\,N\ \neg(D(N, z) = 0)$. Le second cas est exclu : $N < S\,N$, et le point (i) (b) de {{cal-bp-modules|Modules de Gödel}}, avec le terme $N$, donnerait $\neg(D(N, N) = 0)$, contraire à (i). Dans le premier cas, la condition $w < S\,N$ découle des deux autres : si l'on avait $N < w$, le même point, avec le terme $N$, donnerait $\neg(D(N, N) = 0)$ ; donc $\neg(N < w)$, et la trichotomie ({{cal-pa-ordre|Ordre dans PA}}, (v)) donne $w \leqslant N$, c'est-à-dire $w < S\,N$. On obtient l'équivalence annoncée, et, en passant, $\mathrm{lg}(N) \leqslant N$.

      *Valeurs.* Pour $N = 0$, $D(0, 0) = 0$ et la clause $\forall z < 0$ est démontrable ({{cal-bp-modules|Modules de Gödel}}, (i) (a)) : $\mathrm{lg}(0) = 0$. Soit $M = \mathrm{aj}(h, v)$, et écrivons avec la valeur $l$ de $\mathrm{lg}(h)$, de sorte que $D(h, l) = 0$ et $\forall z < l\ \neg(D(h, z) = 0)$. Par (i), $D(M, S\,l) = D(h, l) = 0$. Sous l'hypothèse $z < S\,l$, distinguons $z = 0$ et $z = S\,z'$, par l'instance de $\mathrm Q_3$ : dans le premier cas, $D(M, 0) = M$, qui n'est pas nul par le point (iii) de {{cal-sp-ajout|Ajout dans PA}} ; dans le second, $S\,z' < S\,l$ donne $S\,z' \leqslant l$, c'est-à-dire $z' < l$, et $D(M, S\,z') = D(h, z')$ n'est pas nul. Le point (i) (a) de {{cal-bp-modules|Modules de Gödel}} donne $\forall z < S\,l\ \neg(D(M, z) = 0)$, et la caractérisation donne $\mathrm{lg}(M) = S\,l$. Enfin, si $\neg(N = 0)$, le point (iii) de {{cal-sp-ajout|Ajout dans PA}} donne $N = \mathrm{aj}(\mathrm{dbt}(N), \mathrm{dr}(N))$, donc $\mathrm{lg}(N) = S\,\mathrm{lg}(\mathrm{dbt}(N))$, qui n'est pas nul par $\mathrm Q_1$ ; la contraposition donne la dernière formule.

      (iii) Soit $M = \mathrm{aj}(h, v)$, et $l$ la valeur de $\mathrm{lg}(h)$, de sorte que $\mathrm{lg}(M) = S\,l$ par (ii). Pour le rang $l$ : par le point (iii) de {{cal-bp-usuelles|Fonctions usuelles dans PA}}, $S\,l \leqslant S\,l$ donne $S\,l \mathbin{\dot{-}} S\,l = 0$, et $(M)^l = \mathrm{dr}(D(M, 0)) = \mathrm{dr}(M) = v$. Pour un rang $j < l$, c'est-à-dire $S\,j \leqslant l$, l'élimination fournit $a$ tel que $a + S\,j = l$ ; le même point donne $l \mathbin{\dot{-}} S\,j = a$ et, puisque $S\,a + S\,j = S(a + S\,j) = S\,l$ et $S\,j \leqslant S\,l$, $S\,l \mathbin{\dot{-}} S\,j = S\,a$. Alors, par (i),
      $$\begin{aligned} (M)^j &= \mathrm{dr}(D(M, S\,a)) \\ &= \mathrm{dr}(D(h, a)) \\ &= \mathrm{dr}(D(h, l \mathbin{\dot{-}} S\,j)) = (h)^j. \end{aligned}$$

      (iv) Soit $\theta$ la formule $\forall M\, \forall N\, \big((\mathrm{lg}(M) = l \wedge \mathrm{lg}(N) = l \wedge \forall j < l\ (M)^j = (N)^j) \to M = N\big)$, pour une variable $l$ nouvelle ; montrons-la par récurrence sur $l$. Pour $0$, la dernière formule de (ii) donne $M = 0$ et $N = 0$. Pour le pas, sous l'hypothèse $\theta$ et sous $\mathrm{lg}(M) = S\,l$, $\mathrm{lg}(N) = S\,l$ et $\forall j < S\,l\ (M)^j = (N)^j$ : comme $\mathrm{lg}(0) = 0$, ni $M$ ni $N$ n'est nul, et le point (iii) de {{cal-sp-ajout|Ajout dans PA}} donne $M = \mathrm{aj}(h, v)$ et $N = \mathrm{aj}(h', v')$, avec $h = \mathrm{dbt}(M)$, $v = \mathrm{dr}(M)$, et de même pour $N$, écrits avec leurs valeurs. Par (ii) et $\mathrm Q_2$, $\mathrm{lg}(h) = l = \mathrm{lg}(h')$. Sous l'hypothèse $j < l$, on a $j < S\,l$, et (iii) donne $(h)^j = (M)^j = (N)^j = (h')^j$ ; le point (i) (a) de {{cal-bp-modules|Modules de Gödel}} donne $\forall j < l\ (h)^j = (h')^j$, et $\theta$, instanciée par $h$ et $h'$, donne $h = h'$. Comme $l < S\,l$, (iii) donne $v = (M)^l = (N)^l = v'$, et $M = \mathrm{aj}(h, v) = \mathrm{aj}(h', v') = N$. La généralisation en $M$ et $N$ donne $\theta[S\,l/l]$, et le point (iii) de {{cal-pa-recurrence|Récurrence dans PA}} donne $\vdash_{\mathsf{PA}} \theta$. On instancie $\theta$ par $M$ et $N$, par l'axiome (2), puis $l$ par le terme fonctionnel $\mathrm{lg}(N)$, par le point (ii) (b) de {{cal-sp-termes|Termes fonctionnels}}.
    remarques:
      - |
        La longueur est définie dans {{cal-pr-codage|Codages}} par une recherche bornée par $N$, que justifie dans $\mathcal N$ l'inégalité $D(N, i) \leqslant N \mathbin{\dot{-}} i$. Le point (i) en est la forme démontrable dans $\mathsf{PA}$, écrite sans soustraction : $D(N, i) = 0$ ou $D(N, i) + i \leqslant N$. L'erreur la plus répandue serait de la renforcer en $D(N, i) + i < N$ : elle est fausse déjà pour $N = 1$ et $i = 0$, et un calcul sur tous les $N < 300$ et $i < 4$ le confirme. La caractérisation (ii) dispense ensuite de la borne : la longueur est le premier indice où les itérés s'annulent.
      - |
        L'extensionnalité (iv) dit qu'un code est déterminé par sa longueur et ses termes ; dans $\mathcal N$, c'est l'injectivité du codage, point (ii) de {{cal-pr-codage|Codages}}, que l'on a contrôlée pour tous les $N < 400$. Elle sert à reconnaître dans $\mathsf{PA}$ un code construit de deux façons : la concaténation y sera comparée à l'ajout, et l'historique d'une [[recurrence-valeurs|récurrence de valeurs]] à toute suite qui a les mêmes termes.

  - id: cal-sp-concatenation
    etiquette: Concaténation dans PA
    nature: proposition
    titre: Concaténation des codes dans l'arithmétique de Peano
    texte: |
      Les conventions sont celles de {{cal-sp-longueur|Longueur dans PA}}. La concaténation est prise avec la construction du point (iii) de {{cal-pr-codage|Codages}} : $\mathrm{conc}(M, N) = C(M, N, \mathrm{lg}(N))$, où $C$ est définie par récurrence primitive à partir de $P^2_1$ et de la fonction $(M, N, t, u) \mapsto \mathrm{aj}\big(u, (N)^t\big)$, composée de $\mathrm{aj}$, de $(\cdot)^{\cdot}$ et de [[projection-produit|projections]] :
      $$\begin{aligned} C(M, N, 0) &= M, \\ C(M, N, t + 1) &= \mathrm{aj}\big(C(M, N, t), (N)^t\big). \end{aligned}$$
      On ajoute un à un les termes de la seconde suite à la fin de la première. Comme aux nœuds précédents, le point (iv) de {{cal-bp-fonctions|Fonctions p.r. dans PA}} et le point (ii) (d) de {{cal-sp-termes|Termes fonctionnels}} donnent $\vdash_{\mathsf{PA}} C(M, N, 0) = M$, $\vdash_{\mathsf{PA}} C(M, N, S\,t) = \mathrm{aj}(C(M, N, t), (N)^t)$ et $\vdash_{\mathsf{PA}} \mathrm{conc}(M, N) = C(M, N, \mathrm{lg}(N))$.
    enonce: |
      Pour tous termes fonctionnels $M$, $N$, $v$, $t$, $j$, $s$, $a$ et $b$ :

      (i) **Étapes.** $\vdash_{\mathsf{PA}} \mathrm{lg}(C(M, N, t)) = \mathrm{lg}(M) + t$,
      $$\begin{aligned} &\vdash_{\mathsf{PA}} j < \mathrm{lg}(M) \\ &\qquad \to (C(M, N, t))^j = (M)^j, \\ &\vdash_{\mathsf{PA}} s < t \\ &\qquad \to (C(M, N, t))^{\mathrm{lg}(M) + s} = (N)^s. \end{aligned}$$

      (ii) **Concaténation.** $\vdash_{\mathsf{PA}} \mathrm{lg}(\mathrm{conc}(M, N)) = \mathrm{lg}(M) + \mathrm{lg}(N)$,
      $$\begin{aligned} &\vdash_{\mathsf{PA}} j < \mathrm{lg}(M) \\ &\qquad \to (\mathrm{conc}(M, N))^j = (M)^j, \\ &\vdash_{\mathsf{PA}} s < \mathrm{lg}(N) \\ &\qquad \to (\mathrm{conc}(M, N))^{\mathrm{lg}(M) + s} = (N)^s. \end{aligned}$$

      (iii) **Indices.** Pour une variable $s$ qui ne figure ni dans $j$, ni dans $a$, ni dans $b$,
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&j < a + b \to \big(j < a \\ &\vee \exists s\, (s < b \wedge j = a + s)\big). \end{aligned}$$

      (iv) **Cas particuliers.** $\vdash_{\mathsf{PA}} \mathrm{conc}(M, 0) = M$, $\vdash_{\mathsf{PA}} \mathrm{conc}(0, N) = N$ et
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\mathrm{conc}(M, \mathrm{aj}(N, v)) \\ &= \mathrm{aj}(\mathrm{conc}(M, N), v). \end{aligned}$$
    preuve: |
      Il suffit de traiter des variables, et l'on raisonne par chaînes d'égalités entre termes fonctionnels.

      (i) *Longueur.* Récurrence sur $t$, avec les paramètres $M$ et $N$ : $\mathrm{lg}(C(M, N, 0)) = \mathrm{lg}(M) = \mathrm{lg}(M) + 0$ par $\mathrm Q_4$, et, par le point (ii) de {{cal-sp-longueur|Longueur dans PA}} et $\mathrm Q_5$,
      $$\begin{aligned} \mathrm{lg}(C(M, N, S\,t)) &= S\,\mathrm{lg}(C(M, N, t)) \\ &= S(\mathrm{lg}(M) + t) \\ &= \mathrm{lg}(M) + S\,t. \end{aligned}$$

      *Premiers termes.* Récurrence sur $t$ de la formule $j < \mathrm{lg}(M) \to (C(M, N, t))^j = (M)^j$, avec les paramètres $M$, $N$, $j$. Pour $0$, c'est $C(M, N, 0) = M$. Pour le pas, sous $j < \mathrm{lg}(M)$, on a $\mathrm{lg}(M) \leqslant \mathrm{lg}(M) + t = \mathrm{lg}(C(M, N, t))$, donc $j < \mathrm{lg}(C(M, N, t))$, et le point (iii) de {{cal-sp-longueur|Longueur dans PA}} donne $(C(M, N, S\,t))^j = (C(M, N, t))^j$, qui vaut $(M)^j$ par l'hypothèse de récurrence.

      *Termes ajoutés.* Récurrence sur $t$ de la formule $s < t \to (C(M, N, t))^{\mathrm{lg}(M) + s} = (N)^s$, avec les paramètres $M$, $N$, $s$. Pour $0$, $s < 0$ est exclu ({{cal-pa-ordre|Ordre dans PA}}, (v)). Pour le pas, sous $s < S\,t$, c'est-à-dire $s \leqslant t$, le point (v) du même nœud donne $s < t$ ou $s = t$. Si $s = t$, le rang $\mathrm{lg}(M) + t$ est $\mathrm{lg}(C(M, N, t))$, et le point (iii) de {{cal-sp-longueur|Longueur dans PA}} donne $(C(M, N, S\,t))^{\mathrm{lg}(M) + t} = (N)^t$. Si $s < t$, la compatibilité ({{cal-pa-ordre|Ordre dans PA}}, (vi)) donne $\mathrm{lg}(M) + s < \mathrm{lg}(M) + t$, puisque $S(\mathrm{lg}(M) + s) = \mathrm{lg}(M) + S\,s$, et le même point (iii) et l'hypothèse de récurrence donnent $(C(M, N, S\,t))^{\mathrm{lg}(M) + s} = (C(M, N, t))^{\mathrm{lg}(M) + s} = (N)^s$.

      (ii) C'est (i), où l'on substitue le terme fonctionnel $\mathrm{lg}(N)$ à $t$, par le point (ii) (b) de {{cal-sp-termes|Termes fonctionnels}}, avec $\mathrm{conc}(M, N) = C(M, N, \mathrm{lg}(N))$.

      (iii) Par l'ordre total ({{cal-pa-ordre|Ordre dans PA}}, (iv) et (v)), $j < a$ ou $a \leqslant j$. Dans le second cas, l'élimination fournit $s$ tel que $s + a = j$, d'où $j = a + s$ par la commutativité ; sous l'hypothèse $j < a + b$, on a $S(a + s) \leqslant a + b$, c'est-à-dire $a + S\,s \leqslant a + b$, et la compatibilité donne $S\,s \leqslant b$, c'est-à-dire $s < b$. L'introduction de l'existentiel conclut.

      (iv) On applique l'extensionnalité ({{cal-sp-longueur|Longueur dans PA}}, (iv)), avec le point (i) (a) de {{cal-bp-modules|Modules de Gödel}} pour la clause $\forall j$. Pour $\mathrm{conc}(M, 0)$ : sa longueur est $\mathrm{lg}(M) + 0 = \mathrm{lg}(M)$, et ses termes de rang $j < \mathrm{lg}(M)$ sont ceux de $M$, par (ii). Pour $\mathrm{conc}(0, N)$ : sa longueur est $0 + \mathrm{lg}(N) = \mathrm{lg}(N)$, et, pour $s < \mathrm{lg}(N)$, son terme de rang $0 + s = s$ est $(N)^s$, par (ii) et le point (i) de {{cal-pa-lois|Lois de + et ×}}.

      Pour la dernière égalité, notons $L = \mathrm{conc}(M, \mathrm{aj}(N, v))$ et $L' = \mathrm{aj}(\mathrm{conc}(M, N), v)$, écrites avec leurs valeurs, ainsi que $m = \mathrm{lg}(M)$ et $n = \mathrm{lg}(N)$. Par (ii) et le point (ii) de {{cal-sp-longueur|Longueur dans PA}}, $\mathrm{lg}(L) = m + S\,n = S(m + n) = \mathrm{lg}(L')$. Soit $j < S(m + n)$ ; par (iii), $j < m$, ou bien $j = m + s$ avec $s < S\,n$, c'est-à-dire $s < n$ ou $s = n$. Si $j < m$, on a $j < m + n$, et (ii) et le point (iii) de {{cal-sp-longueur|Longueur dans PA}} donnent $(L)^j = (M)^j = (\mathrm{conc}(M, N))^j = (L')^j$. Si $j = m + s$ avec $s < n$, ils donnent de même $(L)^j = (\mathrm{aj}(N, v))^s = (N)^s = (\mathrm{conc}(M, N))^{m + s} = (L')^j$. Si $j = m + n$, ils donnent $(L)^j = (\mathrm{aj}(N, v))^n = v$, et, comme $m + n = \mathrm{lg}(\mathrm{conc}(M, N))$, $(L')^j = v$. L'extensionnalité conclut.
    remarques:
      - |
        La fonction $C$ ajoute les termes de $N$ un à un, et le point (i) suit cette construction pas à pas, sans hypothèse sur $t$ : même au-delà de $\mathrm{lg}(N)$, où $(N)^t$ n'a plus de sens combinatoire, la longueur augmente d'une unité à chaque étape et les termes déjà placés ne bougent plus. C'est ce qui permet de ne substituer $\mathrm{lg}(N)$ à $t$ qu'à la fin. L'erreur la plus répandue est de vouloir démontrer (ii) par une récurrence sur $\mathrm{lg}(N)$ : ce n'est pas une variable, et une récurrence sur un terme fonctionnel n'a pas de sens, alors que la récurrence sur la variable $t$, suivie d'une substitution, est permise.
      - |
        Dans $\mathcal N$, on a vérifié par un calcul que $C(M, N, t)$ et $\mathrm{conc}(M, N)$, recalculés avec les constructions littérales de {{cal-pr-codage|Codages}}, codent les suites attendues, pour tous les cas où les codes restent calculables : la concaténation de deux suites de deux termes peut déjà avoir un code de plusieurs millions de chiffres, et celle de $(1, 1)$ avec elle-même, de code $\langle 1, 1, 1, 1 \rangle = 2^{3 \cdot 2^{24}} \cdot 3$, en a environ quinze millions, alors que celle de $(0, 0)$ avec elle-même a pour code $16$. Les termes et la longueur ne dépendent que de la structure de la récurrence, ce que la preuve rend démontrable sans jamais calculer un code.

  - id: cal-sp-valeurs
    etiquette: Récurrence de valeurs dans PA
    nature: lemme
    titre: La récurrence de valeurs dans l'arithmétique de Peano
    texte: |
      Les conventions sont celles de {{cal-sp-longueur|Longueur dans PA}}. Soit $p \geqslant 0$, $G : \mathbb N^{p+2} \to \mathbb N$ une fonction primitive récursive donnée avec une construction, et $f$ la fonction que fournit le point (i) de la {{cal-sx-valeurs|récurrence de valeurs}}, avec la construction qu'en donne sa preuve : la fonction $F$ est définie par récurrence primitive à partir de la fonction nulle $Z \circ P^p_1$, ou, sans paramètre si $p = 0$, à partir de l'entier $0$, et de la fonction $(x, n, u) \mapsto \mathrm{aj}\big(u, G(x, n, u)\big)$, composée de $\mathrm{aj}$, de $G$ et de [[projection-produit|projections]] ; puis $f(x, n) = G(x, n, F(x, n))$, composée de $G$, de projections et de $F$. Dans $\mathcal N$, $F(x, n) = \bar f(x, n)$ est le code de la suite des valeurs de $f$ avant $n$.

      Pour une relation primitive récursive $Q \subset \mathbb N^{p+2}$, donnée avec une construction de $\chi_Q$, la relation $R$ du point (ii) de la même fiche est donnée avec la construction $\chi_R = f$, pour $G = \chi_Q$. Ici $x$ abrège une suite de $p$ variables distinctes, et $n$, $m$, $h$ sont des variables distinctes des $x_k$.
    enonce: |
      (i) **Équations.** $\vdash_{\mathsf{PA}} F(x, 0) = 0$, $\vdash_{\mathsf{PA}} F(x, S\,n) = \mathrm{aj}(F(x, n), f(x, n))$ et $\vdash_{\mathsf{PA}} f(x, n) = G(x, n, F(x, n))$.

      (ii) **Historique.** $\vdash_{\mathsf{PA}} \mathrm{lg}(F(x, n)) = n$ et
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&m < n \\ &\to (F(x, n))^m = f(x, m). \end{aligned}$$

      (iii) **Unicité de l'historique.**
      $$\begin{aligned} \vdash_{\mathsf{PA}} \big(&\mathrm{lg}(h) = n \\ &\wedge \forall m < n\ (h)^m = f(x, m)\big) \\ &\to \big(h = F(x, n) \\ &\quad \wedge f(x, n) = G(x, n, h)\big). \end{aligned}$$

      (iv) **Relations.** $\vdash_{\mathsf{PA}} \hat R(x, n) \leftrightarrow \hat Q(x, n, F(x, n))$, et
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&m < n \to \big(\neg((F(x, n))^m = 0) \\ &\qquad \leftrightarrow \hat R(x, m)\big). \end{aligned}$$
      Si $\chi_Q$ est booléenne dans $\mathsf{PA}$, $\chi_R$ l'est aussi.
    preuve: |
      (i) Par le point (iv) de {{cal-bp-fonctions|Fonctions p.r. dans PA}}, $F(x, 0) = w$ équivaut à $(Z \circ P^p_1)(x) = w$, ou à $w = 0$ sans paramètre, donc à $w = 0$. Sous l'hypothèse $F(x, n) = u$, la seconde équation du même point et le point (ii) (d) de {{cal-sp-termes|Termes fonctionnels}} ramènent $F(x, S\,n) = w$ à $\mathrm{aj}(u, G(x, n, u)) = w$. Le même point (ii) (d), appliqué à la composée $f$, donne $f(x, n) = G(x, n, F(x, n))$, c'est-à-dire $f(x, n) = G(x, n, u)$ sous l'hypothèse, et le remplacement ({{cal-sp-termes|Termes fonctionnels}}, (ii) (c)) donne $F(x, S\,n) = \mathrm{aj}(u, f(x, n))$. Écrite avec la valeur $u$, c'est la deuxième équation.

      (ii) Soit $\theta$ la conjonction de $\mathrm{lg}(F(x, n)) = n$ et de $\forall m < n\ (F(x, n))^m = f(x, m)$ ; montrons-la par récurrence sur $n$, avec les paramètres $x$. Pour $0$ : $\mathrm{lg}(0) = 0$ par le point (ii) de {{cal-sp-longueur|Longueur dans PA}}, et la clause $\forall m < 0$ est démontrable ({{cal-bp-modules|Modules de Gödel}}, (i) (a)). Pour le pas, écrivons avec la valeur $u$ de $F(x, n)$, de sorte que $F(x, S\,n) = \mathrm{aj}(u, f(x, n))$. Le point (ii) de {{cal-sp-longueur|Longueur dans PA}} et l'hypothèse de récurrence donnent $\mathrm{lg}(F(x, S\,n)) = S\,\mathrm{lg}(u) = S\,n$. Par le point (i) (c) de {{cal-bp-modules|Modules de Gödel}}, la clause pour $S\,n$ équivaut à celle pour $n$, jointe à $(F(x, S\,n))^n = f(x, n)$. Pour $m < n$, c'est-à-dire $m < \mathrm{lg}(u)$, le point (iii) de {{cal-sp-longueur|Longueur dans PA}} donne $(\mathrm{aj}(u, f(x, n)))^m = (u)^m$, qui vaut $f(x, m)$ par l'hypothèse de récurrence ; et, comme $n = \mathrm{lg}(u)$, le même point donne $(\mathrm{aj}(u, f(x, n)))^n = f(x, n)$.

      (iii) Sous les deux hypothèses, (ii) donne $\mathrm{lg}(F(x, n)) = n = \mathrm{lg}(h)$ et, pour $m < n$, $(F(x, n))^m = f(x, m) = (h)^m$ ; l'extensionnalité ({{cal-sp-longueur|Longueur dans PA}}, (iv)) donne $h = F(x, n)$, et (i) et le remplacement donnent $f(x, n) = G(x, n, h)$.

      (iv) La construction de $\chi_R = f$ est la composée $\chi_Q \circ (P^{p+1}_1, \dots, P^{p+1}_{p+1}, F)$ : c'est celle de la relation $Q(x, n, F(x, n))$, obtenue par substitution. Le point (ii) (d) de {{cal-sp-termes|Termes fonctionnels}} donne donc $\hat R(x, n) \leftrightarrow \hat Q(x, n, F(x, n))$, les projections étant données par les termes $x_k$ et $n$. Pour $m < n$, (ii) donne $(F(x, n))^m = f(x, m)$, et le point (i) de {{cal-bp-relations|Relations p.r. dans PA}}, appliqué à $R$ avec les termes $x$ et $m$, donne $\neg(f(x, m) = 0) \leftrightarrow \hat R(x, m)$ ; le remplacement conclut. Enfin, si $\chi_Q$ est booléenne, la valeur $f(x, n) = \chi_Q(x, n, F(x, n))$ est $0$ ou $S\,0$, par l'instance de $\chi_Q(x, n, z) = w \to (w = 0 \vee w = S\,0)$ obtenue avec la valeur $z$ de $F(x, n)$.
    remarques:
      - |
        Le point (ii) est la forme interne à $\mathsf{PA}$ de l'égalité $F = \bar f$ de la {{cal-sx-valeurs|récurrence de valeurs}}, et sa preuve n'est qu'une récurrence ordinaire : l'historique est transporté d'une étape à la suivante, comme une pile, et la récurrence forte n'intervient pas. L'erreur la plus répandue serait de croire qu'il suffit, pour reconnaître dans $\mathsf{PA}$ les termes ou les formules, d'écrire leur relation $\hat R(N) \leftrightarrow \hat Q(N, F(N))$ : la relation $Q$ ne consulte l'historique qu'en des rangs $M$ qui sont des codes de facteurs, et le point (iv) ne lit $(F(N))^M$ comme la valeur $\chi_R(M)$ que si $M < N$. Il faudra donc encore démontrer dans $\mathsf{PA}$ l'inégalité du point (ii) du {{cal-sx-codage|codage des mots}}, pour les facteurs que consultent les relations des termes et des formules.
      - |
        Pour la relation $\mathrm{Tm}$ des {{cal-sx-termes|termes}}, le point (iv) donne $\vdash_{\mathsf{PA}} \widehat{\mathrm{Tm}}(N) \leftrightarrow \hat Q(N, F(N))$, où $Q$ est la disjonction des trois cas écrite dans la preuve de ce nœud-là, et, pour $M < N$, la lecture de $(F(N))^M$ comme $\chi_{\mathrm{Tm}}(M)$. Pour $N = \ulcorner S\, 0 \urcorner = 18\,432$, la seule valeur consultée est celle de $M = 9 = \ulcorner 0 \urcorner$, et $9 < 18\,432$ se démontre par un calcul clos ({{cal-sp-termes|Termes fonctionnels}}, (iv)) ; c'est pour un $N$ variable, de la forme $\mathrm{conc}(\langle 5 \rangle, T)$, que l'inégalité devra être démontrée par récurrence.

  - id: cal-sp-derivabilite
    etiquette: Deuxième condition (D2)
    nature: théorème
    titre: Formule naturelle de démontrabilité, mise bout à bout des démonstrations et deuxième condition de dérivabilité
    texte: |
      Les conventions sont celles de {{cal-sp-concatenation|Concaténation dans PA}}. Soit $T$ une [[theorie]] sur la signature de l'arithmétique dont l'ensemble des [[code-mot|codes]] des axiomes est [[ensemble-recursivement-enumerable|récursivement énumérable]], et $T'$ la théorie du {{cal-craig|théorème de Craig}}, dont l'ensemble des codes des axiomes est primitif récursif et qui démontre les mêmes formules que $T$, prise avec la construction de sa fonction caractéristique qu'écrit la preuve de ce théorème. Cette construction, comme la théorie $T'$ elle-même, dépend de la relation récursive $R$ et de l'[[indice-calculable|indice]] $e$ choisis dans cette preuve ; on les fixe une fois pour toutes, et rien de ce qui suit n'en dépend, puisque les preuves n'emploient aucune propriété de $\mathrm{Ax}_{T'}$. Si l'ensemble des codes des axiomes de $T$ est déjà primitif récursif, comme pour $\mathsf{PA}$ ({{cal-theoremes|Théorèmes r.e.}}, (i)), on prend $T' = T$, avec la construction de cette preuve-là. Les relations $\mathrm{Fm}$, $\mathrm{En}$, $\mathrm{Ax}$, $\mathrm{MP}$ et $\mathrm{Dem} = \mathrm{Dem}_{T'}$ sont prises avec les constructions qu'écrivent les preuves du chapitre {{cal-syntaxe|Arithmétisation de la syntaxe}}, conformément à la convention de {{cal-bp-relations|Relations p.r. dans PA}}.

      Pour $\mathrm{Dem}$, c'est la formule du point (ii) de {{cal-sx-demonstrations|Démonstrations}}, lue clause par clause : la conjonction de $1 \leqslant \mathrm{lg}(p)$, de $(p)^{\mathrm{lg}(p) \mathbin{\dot{-}} 1} = c$ et de la quantification bornée $\forall j < y$ de la conjonction de $\mathrm{Fm}((p)^j)$ et de la disjonction de $\mathrm{Ax}((p)^j)$, de $\mathrm{Ax}_{T'}((p)^j)$ et de $\exists i < j\ \exists i' < j\ \mathrm{MP}((p)^i, (p)^{i'}, (p)^j)$, où l'on substitue $\mathrm{lg}(p)$ à $y$ ; chaque quantification bornée par $j$ est une quantification bornée par une variable, suivie de la substitution de $j$ à celle-ci. On pose $D(p, c) \iff \mathrm{Dem}(p, c) \wedge \mathrm{En}(c)$, conjonction de $\mathrm{Dem}$ et de la relation $\mathrm{En}$ où l'on a substitué $c$ ; c'est la relation de la convention de {{cal-bp-relations|Relations p.r. dans PA}}, troisième remarque. Attention à la lettre $D$, qui sert trois fois : la relation $D(p, c)$ n'a rien à voir avec les itérés $D(N, i)$ de {{cal-sp-longueur|Longueur dans PA}}, ni avec la disjonction $D(p, j)$ de la preuve de {{cal-sx-demonstrations|Démonstrations}}, que l'on note ici $\Lambda(p, j)$ avec la clause $\mathrm{Fm}$ ; seule la relation $D(p, c)$ porte un chapeau dans la suite.

      Soit $p$ et $v$ des variables distinctes, et $\hat D(p, v)$ la formule naturelle de $D$, écrite avec ces variables. La *formule naturelle de démontrabilité* de $T$ est
      $$\mathrm{Pr}_T(v) = \exists p\ \hat D(p, v).$$
      Pour un énoncé $\sigma$, on note $\mathrm{Pr}_T\,\ulcorner \sigma \urcorner$ l'énoncé $\mathrm{Pr}_T[\underline{\ulcorner \sigma \urcorner}/v]$, où $\underline{\ulcorner \sigma \urcorner}$ est le chiffre du code de $\sigma$, et $\mathrm{Th}(T)$ désigne, comme au nœud {{cal-rp-godel-rosser|Gödel-Rosser}}, l'ensemble des codes des énoncés que $T$ démontre.
    enonce: |
      (i) **Forme Σ₁ et définissabilité.** La formule $\mathrm{Pr}_T$ est dans $\mathcal S$, n'a pas d'autre variable libre que $v$, et définit $\mathrm{Th}(T)$ dans $\mathcal N$ avec la variable $v$. Toute formule $\exists y\, \delta$ que le point (ii) de {{cal-pa-sigma|Collection et forme Σ₁}} lui associe, avec $y$ distincte de $v$, est une formule Σ₁, où $\delta$ est Δ₀ et a ses variables libres parmi $v$ et $y$, qui définit aussi $\mathrm{Th}(T)$ dans $\mathcal N$, et $\vdash_{\mathsf{PA}} \mathrm{Pr}_T \leftrightarrow \exists y\, \delta$. Si $T \vdash \sigma$, alors $\vdash_{\mathsf{PA}} \mathrm{Pr}_T\,\ulcorner \sigma \urcorner$ et $\vdash_{\mathsf{PA}} (\exists y\, \delta)[\underline{\ulcorner \sigma \urcorner}/v]$.

      (ii) **Dépliement.** Pour des variables $p$, $c$, $j$, $i$, $i'$ distinctes,
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\widehat{\mathrm{Dem}}(p, c) \leftrightarrow \big(S\,0 \leqslant \mathrm{lg}(p) \\ &\wedge (p)^{\mathrm{lg}(p) \mathbin{\dot{-}} S\,0} = c \\ &\wedge \forall j < \mathrm{lg}(p)\ \Lambda(p, j)\big), \end{aligned}$$
      où $\Lambda(p, j)$ est la formule fonctionnelle
      $$\begin{aligned} &\widehat{\mathrm{Fm}}((p)^j) \wedge \Big(\widehat{\mathrm{Ax}}((p)^j) \\ &\ \vee \big(\widehat{\mathrm{Ax}}_{T'}((p)^j) \vee \exists i < j\ \exists i' < j \\ &\qquad \widehat{\mathrm{MP}}((p)^i, (p)^{i'}, (p)^j)\big)\Big), \end{aligned}$$
      et $\vdash_{\mathsf{PA}} \hat D(p, c) \leftrightarrow \big(\widehat{\mathrm{Dem}}(p, c) \wedge \widehat{\mathrm{En}}(c)\big)$.

      (iii) **Mise bout à bout.** Pour des variables $p$, $q$, $a$, $b$, $c$ distinctes,
      $$\begin{aligned} \vdash_{\mathsf{PA}} \big(&\widehat{\mathrm{Dem}}(p, b) \wedge \widehat{\mathrm{Dem}}(q, a) \\ &\wedge \widehat{\mathrm{MP}}(a, b, c) \wedge \widehat{\mathrm{Fm}}(c)\big) \\ &\to \widehat{\mathrm{Dem}}\big(\mathrm{aj}(\mathrm{conc}(p, q), c), c\big). \end{aligned}$$

      (iv) **Deuxième condition de dérivabilité.** Pour tous énoncés $\varphi$ et $\psi$,
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\mathrm{Pr}_T\,\ulcorner \varphi \to \psi \urcorner \\ &\to \big(\mathrm{Pr}_T\,\ulcorner \varphi \urcorner \to \mathrm{Pr}_T\,\ulcorner \psi \urcorner\big), \end{aligned}$$
      et de même pour la formule $\exists y\, \delta$ de (i). Toute théorie qui démontre les axiomes de $\mathsf{PA}$, en particulier $T$ si elle les démontre, démontre donc ces énoncés et ceux de (i).
    preuve: |
      On emploie deux règles sur les quantifications bornées strictes, qui découlent du point (i) de {{cal-bp-modules|Modules de Gödel}}, puisque $\exists x < t\ \varphi$ abrège $\neg\forall x < t\ \neg\varphi$. *Introduction* : $\vdash_{\mathsf{PA}} (u < t \wedge \varphi[u/x]) \to \exists x < t\ \varphi$ pour un terme $u$ substituable, par (b) appliqué à $\neg\varphi$ et la contraposition. *Élimination* : si $x$ n'est libre ni dans $\psi$ ni dans $\Gamma$, et si $\Gamma \cup \{x < t, \varphi\} \vdash_{\mathsf{PA}} \psi$, alors $\Gamma \cup \{\exists x < t\ \varphi\} \vdash_{\mathsf{PA}} \psi$ ; en effet, la contraposition donne $\Gamma \cup \{\neg\psi, x < t\} \vdash_{\mathsf{PA}} \neg\varphi$, le point (a) donne $\Gamma \cup \{\neg\psi\} \vdash_{\mathsf{PA}} \forall x < t\ \neg\varphi$, et la règle des tautologies conclut.

      (i) La formule $\hat D(p, v)$ est dans $\mathcal S$, par le texte de {{cal-bp-relations|Relations p.r. dans PA}}, et $\mathcal S$ est stable par la quantification existentielle ; ses variables libres sont parmi $p$ et $v$. Comme une formule naturelle définit sa relation, $\mathrm{Pr}_T$ est satisfaite sous une [[valuation-structure|valuation]] qui vaut $c$ en $v$ si et seulement s'il existe un entier $m$ tel que $D(m, c)$, c'est-à-dire si et seulement si $c$ code un énoncé $\sigma$ et qu'une démonstration formelle de $\sigma$ à partir de $T'$ existe. Par le point (i) du {{cal-craig|théorème de Craig}}, c'est dire que $T \vdash \sigma$ : $\mathrm{Pr}_T$ définit $\mathrm{Th}(T)$. Le point (ii) de {{cal-pa-sigma|Collection et forme Σ₁}} donne $\vdash_{\mathsf{PA}} \mathrm{Pr}_T \leftrightarrow \exists y\, \delta$, où $\delta$ est Δ₀ et a ses variables libres parmi $v$ et $y$ ; le renommage de la preuve du point (i) de {{cal-rp-forme-sigma|Forme Σ₁ des r.e.}} permet de prendre $y$ distincte de $v$. Comme $\mathcal N$ est un modèle de $\mathsf{PA}$ ({{cal-rp-godel-rosser|Gödel-Rosser}}, (iii)), le {{l-correction|théorème de correction}} montre que $\exists y\, \delta$ définit le même ensemble que $\mathrm{Pr}_T$. Enfin, si $T \vdash \sigma$, l'énoncé $\mathrm{Pr}_T\,\ulcorner \sigma \urcorner$, qui est $\exists p\ \hat D(p, \underline{\ulcorner \sigma \urcorner})$ puisque $p$ est distincte de $v$, est un énoncé de $\mathcal S$ vrai dans $\mathcal N$, et le point (iii) de {{cal-sp-termes|Termes fonctionnels}} le démontre dans $\mathsf{PA}$ ; l'équivalence, instanciée par le chiffre $\underline{\ulcorner \sigma \urcorner}$ ({{cal-pa-recurrence|Récurrence dans PA}}, (iv)), donne la formule Σ₁ correspondante.

      (ii) Chaque clause de la construction se traduit dans $\mathsf{PA}$ par la clause correspondante de {{cal-bp-relations|Relations p.r. dans PA}} : la conjonction et la disjonction par le point (iii), les quantifications bornées par le point (iv), et chaque substitution de fonctions, par le point (ii) (d) de {{cal-sp-termes|Termes fonctionnels}}, en une formule écrite avec les termes fonctionnels correspondants, dont les fonctions constantes et les [[projection-produit|projections]] disparaissent par le point (i) de {{cal-bp-usuelles|Fonctions usuelles dans PA}}. La relation $1 \leqslant \mathrm{lg}(p)$ devient $S\,0 \leqslant \mathrm{lg}(p)$ par le point (ii) de {{cal-bp-relations|Relations p.r. dans PA}}, et l'égalité $(p)^{\mathrm{lg}(p) \mathbin{\dot{-}} 1} = c$ devient l'égalité de termes fonctionnels de l'énoncé, par le même point. Le remplacement d'une [[sous-formule|sous-formule]] par une formule équivalente dans $\mathsf{PA}$, par la règle des tautologies et la monotonie de {{cal-pa-recurrence|Récurrence dans PA}}, (ii), et du point (i) (e) de {{cal-pa-ordre|Ordre dans PA}} pour les bornes, donne la première équivalence ; la seconde est le point (iii) de {{cal-bp-relations|Relations p.r. dans PA}}, appliqué à la conjonction, avec la substitution de $c$.

      (iii) Raisonnons sous les quatre hypothèses, et écrivons avec les valeurs, au sens de {{cal-sp-termes|Termes fonctionnels}} : $r$ pour $\mathrm{aj}(\mathrm{conc}(p, q), c)$, $l_p$ et $l_q$ pour $\mathrm{lg}(p)$ et $\mathrm{lg}(q)$. Par (ii), $S\,0 \leqslant l_p$ et $S\,0 \leqslant l_q$ ; ni $l_p$ ni $l_q$ n'est nul, et l'instance de $\mathrm Q_3$ fournit $k$ et $m$ tels que $l_p = S\,k$ et $l_q = S\,m$. Par le point (iii) de {{cal-bp-usuelles|Fonctions usuelles dans PA}}, $S\,k \mathbin{\dot{-}} S\,0 = k$, et (ii) donne $(p)^k = b$ ; de même $(q)^m = a$. Par le point (ii) de {{cal-sp-concatenation|Concaténation dans PA}} et le point (ii) de {{cal-sp-longueur|Longueur dans PA}}, $\mathrm{lg}(\mathrm{conc}(p, q)) = l_p + l_q$ et $\mathrm{lg}(r) = S(l_p + l_q)$. Les termes de $r$ sont donnés par le point (iii) de {{cal-sp-longueur|Longueur dans PA}} et le point (ii) de {{cal-sp-concatenation|Concaténation dans PA}} : $(r)^j = (p)^j$ si $j < l_p$, $(r)^{l_p + s} = (q)^s$ si $s < l_q$, et $(r)^{l_p + l_q} = c$.

      *Les deux premières clauses.* On a $S\,0 \leqslant S(l_p + l_q)$, puisque $0 \leqslant l_p + l_q$, et $S(l_p + l_q) \mathbin{\dot{-}} S\,0 = l_p + l_q$, d'où $(r)^{\mathrm{lg}(r) \mathbin{\dot{-}} S\,0} = (r)^{l_p + l_q} = c$.

      *La clause bornée.* Par le point (i) (c) de {{cal-bp-modules|Modules de Gödel}}, $\forall j < S(l_p + l_q)\ \Lambda(r, j)$ équivaut à la conjonction de $\forall j < l_p + l_q\ \Lambda(r, j)$ et de $\Lambda(r, l_p + l_q)$. Sous l'hypothèse $j < l_p + l_q$, le point (iii) de {{cal-sp-concatenation|Concaténation dans PA}} donne deux cas.

      Si $j < l_p$, le point (i) (b) de {{cal-bp-modules|Modules de Gödel}}, appliqué à la clause bornée de $\widehat{\mathrm{Dem}}(p, b)$, donne $\Lambda(p, j)$. Comme $(r)^j = (p)^j$, le remplacement ({{cal-sp-termes|Termes fonctionnels}}, (ii) (c)) transporte $\widehat{\mathrm{Fm}}$, $\widehat{\mathrm{Ax}}$ et $\widehat{\mathrm{Ax}}_{T'}$ de $(p)^j$ à $(r)^j$. Pour le dernier cas, l'élimination fournit $i < j$ et $i' < j$ tels que $\widehat{\mathrm{MP}}((p)^i, (p)^{i'}, (p)^j)$ ; comme $i$ et $i'$ sont inférieurs à $l_p$, par la transitivité, $(p)^i = (r)^i$ et $(p)^{i'} = (r)^{i'}$, et deux introductions donnent $\exists i < j\ \exists i' < j\ \widehat{\mathrm{MP}}((r)^i, (r)^{i'}, (r)^j)$. Dans tous les cas, $\Lambda(r, j)$.

      Si $j = l_p + s$ avec $s < l_q$, le même raisonnement, appliqué à $\widehat{\mathrm{Dem}}(q, a)$ au rang $s$, transporte les clauses de $(q)^s$ à $(r)^j$ ; pour le dernier cas, des rangs $i < s$ et $i' < s$ donnent les rangs $l_p + i$ et $l_p + i'$, inférieurs à $l_p + s = j$ par la compatibilité, et inférieurs à $l_p + l_q$, de termes $(r)^{l_p + i} = (q)^i$ et $(r)^{l_p + i'} = (q)^{i'}$. Le point (i) (a) de {{cal-bp-modules|Modules de Gödel}} donne $\forall j < l_p + l_q\ \Lambda(r, j)$, la variable $j$ n'étant libre dans aucune hypothèse.

      *Le dernier rang.* Au rang $l_p + l_q$, le terme est $c$, et $\widehat{\mathrm{Fm}}(c)$ est une hypothèse. Le rang $l_p + m$ est inférieur à $l_p + S\,m = l_p + l_q$, et son terme est $(q)^m = a$, puisque $m < S\,m$ ; le rang $k$ est inférieur à $S\,k = l_p \leqslant l_p + l_q$, et son terme est $(p)^k = b$, puisque $k < l_p$. Avec l'hypothèse $\widehat{\mathrm{MP}}(a, b, c)$ et le remplacement, deux introductions, avec les termes $l_p + m$ et $k$, donnent la troisième disjonction de $\Lambda(r, l_p + l_q)$.

      Les trois clauses donnent $\widehat{\mathrm{Dem}}(r, c)$ par (ii), et l'on élimine les valeurs et les variables $k$ et $m$, qui ne figurent pas dans la conclusion.

      ```schema cal-sp-derivabilite
      La démonstration de code $r = \mathrm{aj}(\mathrm{conc}(p, q), c)$ : les termes de $p$, en bleu, gardent leurs rangs, ceux de $q$, en vert, sont décalés de $l_p$, et le terme ajouté, en rouge, se déduit par modus ponens des deux derniers termes des blocs, de rangs $k = l_p - 1$ et $l_p + m = l_p + l_q - 1$. Une formule obtenue par modus ponens à l'intérieur d'un bloc renvoie à des rangs du même bloc, décalés de la même façon.
      ```

      (iv) Soit $n_1$, $n_2$ et $n_3$ les codes de $\varphi \to \psi$, de $\varphi$ et de $\psi$. Par le point (i) de {{cal-sx-demonstrations|Démonstrations}}, $\mathrm{MP}(n_2, n_1, n_3)$ est vraie ; $n_3$ code une formule et un énoncé. Le point (iv) de {{cal-sp-termes|Termes fonctionnels}} donne donc $\vdash_{\mathsf{PA}} \widehat{\mathrm{MP}}(\underline{n_2}, \underline{n_1}, \underline{n_3})$, $\vdash_{\mathsf{PA}} \widehat{\mathrm{Fm}}(\underline{n_3})$ et $\vdash_{\mathsf{PA}} \widehat{\mathrm{En}}(\underline{n_3})$. Comme $p$ est distincte de $v$, $\mathrm{Pr}_T\,\ulcorner \varphi \to \psi \urcorner$ est $\exists p\ \hat D(p, \underline{n_1})$, et de même pour $\varphi$ et $\psi$.

      Sous les hypothèses $\hat D(p, \underline{n_1})$ et $\hat D(q, \underline{n_2})$, pour une variable $q$ nouvelle, (ii) donne $\widehat{\mathrm{Dem}}(p, \underline{n_1})$ et $\widehat{\mathrm{Dem}}(q, \underline{n_2})$. Le point (iii), où l'on substitue les chiffres $\underline{n_2}$, $\underline{n_1}$, $\underline{n_3}$ à $a$, $b$, $c$ ({{cal-pa-recurrence|Récurrence dans PA}}, (iv)), donne $\widehat{\mathrm{Dem}}(\mathrm{aj}(\mathrm{conc}(p, q), \underline{n_3}), \underline{n_3})$ ; avec $\widehat{\mathrm{En}}(\underline{n_3})$, (ii) donne $\hat D$ en ce terme fonctionnel, écrit avec sa valeur $e$, et l'introduction de l'existentiel, avec le terme $e$, donne $\exists p\ \hat D(p, \underline{n_3})$. On élimine $e$, qui n'est libre ni dans les hypothèses ni dans la conclusion. L'hypothèse $\hat D(q, \underline{n_2})$ est $\hat D(p, \underline{n_2})[q/p]$, et $q$ ne figure ni dans $\hat D(p, \underline{n_2})$, ni dans la conclusion, ni dans l'autre hypothèse : la troisième règle du point (i) de {{cal-pa-recurrence|Récurrence dans PA}}, l'élimination avec la variable nouvelle $b := q$, remplace cette hypothèse par $\exists p\ \hat D(p, \underline{n_2})$, c'est-à-dire $\mathrm{Pr}_T\,\ulcorner \varphi \urcorner$. L'élimination ordinaire de $p$, qui n'est libre ni dans cette formule ni dans la conclusion, remplace ensuite $\hat D(p, \underline{n_1})$ par $\mathrm{Pr}_T\,\ulcorner \varphi \to \psi \urcorner$, et deux applications du théorème de la déduction concluent. Pour $\exists y\, \delta$, l'équivalence de (i), instanciée par les chiffres $\underline{n_1}$, $\underline{n_2}$, $\underline{n_3}$, et la règle des tautologies transportent le résultat. Une théorie qui démontre les axiomes de $\mathsf{PA}$ démontre tout ce que démontre $\mathsf{PA}$, par le lemme de remplacement de la preuve du {{cal-craig|théorème de Craig}}.
    remarques:
      - |
        La clause « $c$ code un énoncé » de la relation $D$ n'intervient dans la preuve de (D2) que par un calcul clos, puisque $\psi$ est un énoncé fixé ; la mise bout à bout (iii) n'en a pas besoin, et elle vaut pour des formules quelconques, données par des variables. Elle demande en revanche l'hypothèse $\widehat{\mathrm{Fm}}(c)$ : chaque terme d'une démonstration formelle doit être une formule, et $\mathsf{PA}$ ne peut pas tirer cette propriété de $\widehat{\mathrm{MP}}(a, b, c)$ sans savoir que les facteurs d'une formule sont des formules. Pour (D2), c'est encore un calcul clos ; pour la troisième condition de dérivabilité, où les formules dépendent de variables, il faudra démontrer dans $\mathsf{PA}$ que $c$ est une formule, par la récurrence de valeurs du nœud voisin {{cal-sp-valeurs|Récurrence de valeurs dans PA}}.
      - |
        Le point (ii) de {{cal-sx-demonstrations|Démonstrations}} dit que $\mathrm{Dem}$ est primitive récursive ; le point (iii) ci-dessus dit davantage : $\mathsf{PA}$ démontre, pour des variables $p$ et $q$, que la suite $p$, suivie de la suite $q$ et de $c$, est une démonstration. L'erreur la plus répandue est de croire que (D2) découle de (D1), parce que, si $T \vdash \varphi \to \psi$ et $T \vdash \varphi$, alors $T \vdash \psi$ : cette règle porte sur des démonstrations, alors que (D2) est un énoncé démontrable, qui porte sur des codes quelconques, y compris, dans un modèle non standard, sur des codes qui ne sont pas des démonstrations au sens de l'atlas. C'est pourquoi la preuve passe par les longueurs et les termes de la concaténation, démontrés par récurrence aux nœuds {{cal-sp-longueur|Longueur dans PA}} et {{cal-sp-concatenation|Concaténation dans PA}}.
      - |
        Le point (i) dit que $\exists y\, \delta$ est une formule de démontrabilité pour $T$, au sens du nœud voisin {{cal-dg-prov|Démontrabilité (D1)}}, et les points (i) et (iv) que $\mathrm{Pr}_T$ et $\exists y\, \delta$ satisfont (D1) et (D2) dans toute théorie qui contient $\mathsf{PA}$. Il ne leur manque que la troisième condition de dérivabilité pour que le nœud {{cal-dg-second|Löb et second théorème}}, du même chapitre voisin, s'applique à elles. Cette condition, $\vdash_{\mathsf{PA}} \mathrm{Pr}_T\,\ulcorner \varphi \urcorner \to \mathrm{Pr}_T\,\ulcorner \mathrm{Pr}_T\,\ulcorner \varphi \urcorner \urcorner$, demande la Σ₁-complétude démontrée à l'intérieur de $\mathsf{PA}$ ; c'était la dernière partie du point (ii) de {{l-incompletude|Incomplétude}} à démontrer, et le nœud {{cal-sg-d3|Troisième condition (D3)}} l'établit.

