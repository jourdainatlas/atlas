# Niveau 1 : structure interne du nœud « Martingales ».
# Espérance conditionnelle comme projection orthogonale dans L², prolongée à L¹ ;
# martingales, temps d'arrêt et arrêt borné ; inégalité maximale de Kolmogorov-Doob ;
# convergence des martingales bornées dans L² ; montées de Doob et convergence presque sûre des
# martingales bornées dans L¹ (démontrées le 29 oct. 2026) ; série harmonique aléatoire et urne de Pólya.

