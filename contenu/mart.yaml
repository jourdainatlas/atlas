  anf: [mt-conditionnelle]

noeuds:
  - id: mt-conditionnelle
    etiquette: Espérance conditionnelle
    nature: théorème
    titre: Espérance conditionnelle
    texte: |
      Soit $(\Omega, \mathcal A, P)$ un espace probabilisé et $\mathcal G \subset \mathcal A$ une sous-tribu. On note $\lex{espace-L2}{L^2}(\mathcal G)$ le sous-espace de $L^2(\mathcal A)$ formé des classes contenant une variable $\mathcal G$-mesurable.
    choix: |
      La définition par projection orthogonale hérite du [[choix-denombrable]] employé par le théorème de projection ({{f-hilbert|Espaces de Hilbert}}) et pour montrer que $L^2(\mathcal G)$ est fermé.
    enonce: |
      (i) $L^2(\mathcal G)$ est un sous-espace fermé de $L^2(\mathcal A)$. Pour $X \in L^2$, l'[[esperance-conditionnelle|espérance conditionnelle]] $E[X \mid \mathcal G]$ est la projection orthogonale de $X$ sur $L^2(\mathcal G)$. C'est l'unique $Y \in L^2(\mathcal G)$ telle que $E[X\mathbf 1_G] = E[Y\mathbf 1_G]$ pour tout $G \in \mathcal G$.

      (ii) Elle est linéaire, positive ($X \geqslant 0$ entraîne $E[X \mid \mathcal G] \geqslant 0$ presque sûrement), vérifie $E\big[E[X \mid \mathcal G]\big] = E[X]$ et $\big\|E[X \mid \mathcal G]\big\|_1 \leqslant \|X\|_1$. Elle se prolonge donc de façon unique en une application de $\lex{espace-L1}{L^1}$ dans $L^1(\mathcal G)$, caractérisée par la même propriété.

      (iii) *Emboîtement.* Si $\mathcal G \subset \mathcal H$, $E\big[E[X \mid \mathcal H] \mid \mathcal G\big] = E[X \mid \mathcal G]$.

      ```schema mt-conditionnelle-2
      Quand $\mathcal G \subset \mathcal H$, le sous-espace $L^2(\mathcal G)$, droite bleue, est contenu dans $L^2(\mathcal H)$, plan gris. Projeter $X$ sur le plan, puis le résultat sur la droite, conduit au même point que projeter $X$ directement sur la droite, en pointillé rouge : c'est l'emboîtement, vu dans $L^2$.
      ```

      (iv) Si $Z$ est bornée et $\mathcal G$-mesurable, $E[ZX \mid \mathcal G] = Z\,E[X \mid \mathcal G]$. Si $X$ est indépendante de $\mathcal G$, $E[X \mid \mathcal G] = E[X]$.
    preuve: |
      (i) $L^2(\mathcal G)$ est complet par Riesz-Fischer ({{f-lp|Espaces L¹ et L²}}), et une suite de $L^2(\mathcal G)$ qui converge dans $L^2(\mathcal A)$ y est de Cauchy, donc converge dans $L^2(\mathcal G)$ vers la même limite : le sous-espace est fermé.

      La projection $Y$ est caractérisée par $E[(X - Y)Z] = 0$ pour tout $Z \in L^2(\mathcal G)$ ({{f-hilbert|Espaces de Hilbert}}, (iii)). Il suffit de le vérifier pour les indicatrices $\mathbf 1_G$, $G \in \mathcal G$ : par linéarité, cela vaut pour les variables étagées $\mathcal G$-mesurables, qui sont denses dans $L^2(\mathcal G)$ par l'approximation du nœud {{m-etagees|Fonctions étagées}} et la convergence dominée.

      (ii) La linéarité est celle d'une projection. Si $X \geqslant 0$ et $G = \{Y < 0\} \in \mathcal G$, alors $E[Y\mathbf 1_G] = E[X\mathbf 1_G] \geqslant 0$, d'où $Y\mathbf 1_G = 0$ presque sûrement. Avec $G = \Omega$, $E[Y] = E[X]$.

      Appliquée à $X^+$ et $X^-$, la positivité donne $|E[X \mid \mathcal G]| \leqslant E[|X| \mid \mathcal G]$, d'où la contraction dans $L^1$. Les variables bornées sont denses dans $L^1$, par troncature et convergence dominée, et elles sont dans $L^2$ ; une application linéaire contractante se prolonge par continuité à $L^1$, qui est complet, et la caractérisation passe à la limite.

      (iii) Pour $G \in \mathcal G \subset \mathcal H$,
      $$\begin{aligned} E\big[E[X \mid \mathcal H]\mathbf 1_G\big] &= E[X\mathbf 1_G] \\ &= E\big[E[X \mid \mathcal G]\mathbf 1_G\big]. \end{aligned}$$

      (iv) Pour $Z = \mathbf 1_{G'}$,
      $$\begin{aligned} E[\mathbf 1_{G'}X\mathbf 1_G] &= E[X\mathbf 1_{G \cap G'}] \\ &= E\big[\mathbf 1_{G'}E[X \mid \mathcal G]\mathbf 1_G\big] ; \end{aligned}$$
      on étend par linéarité aux $Z$ étagées, puis aux $Z$ bornées par limite uniforme.

      Si $X$ est indépendante de $\mathcal G$, $E[X\mathbf 1_G] = E[X]P(G) = E\big[E[X]\mathbf 1_G\big]$ ({{p-esperance|Espérance, variance}}, (iv)).
    remarques:
      - |
        Si $\mathcal G$ est engendrée par une partition finie $(B_1, \dots, B_m)$ en événements de probabilité non nulle, $E[X \mid \mathcal G]$ vaut $E[X\mathbf 1_{B_i}]/P(B_i)$ sur $B_i$ : c'est la moyenne de $X$ sachant $B_i$, et l'on retrouve les probabilités conditionnelles du nœud {{p-espace|Espace probabilisé}}.

        ```schema mt-conditionnelle
        Sur $\Omega = [0, 1[$ muni de la mesure de Lebesgue, avec $X(\omega) = \omega^2$ et la partition $B_1 = [0, \frac12[$, $B_2 = [\frac12, \frac34[$, $B_3 = [\frac34, 1[$, l'espérance conditionnelle est la fonction en escalier rouge, de valeurs $\frac1{12}$, $\frac{19}{48}$ et $\frac{37}{48}$. Sur chaque $B_i$, les deux régions bleues comprises entre le graphe de $X$ et le palier ont même aire, ce qui exprime l'égalité $E[X\mathbf 1_{B_i}] = E\big[E[X \mid \mathcal G]\mathbf 1_{B_i}\big]$.
        ```

        La définition géométrique, par projection, est ce qui permet de conditionner par un événement de probabilité nulle, comme $\{Y = y\}$ pour une variable à densité.

  - id: mt-martingales
    etiquette: Martingales
    nature: définition
    titre: Martingales et temps d'arrêt
    texte: |
      Une **filtration** est une suite croissante $(\mathcal F_n)_{n \in \lex{ensemble-entiers-naturels}{\mathbb N}}$ de sous-tribus. Une suite $(M_n)$ de variables intégrables, chaque $M_n$ étant $\mathcal F_n$-mesurable, est une [[martingale]] si $E[M_{n+1} \mid \mathcal F_n] = M_n$ pour tout $n$.

      Un **temps d'arrêt** est une variable $T$ à valeurs dans $\mathbb N \cup \{+\infty\}$ telle que $\{T = n\} \in \mathcal F_n$ pour tout $n$ : la décision de s'arrêter à l'instant $n$ ne dépend que du passé.
    enonce: |
      (i) Si $(X_n)_{n \geqslant 1}$ sont indépendantes, intégrables et centrées, $S_n = X_1 + \cdots + X_n$ est une martingale pour $\mathcal F_n = \sigma(X_1, \dots, X_n)$. Pour toute $X \in \lex{espace-L1}{L^1}$, $M_n = E[X \mid \mathcal F_n]$ est une martingale.

      (ii) Pour une martingale, $E[M_n] = E[M_0]$, et $E[M_m \mid \mathcal F_n] = M_n$ pour $m \geqslant n$.

      (iii) *Arrêt borné.* Si $T$ est un temps d'arrêt borné par $N$, alors $E[M_T] = E[M_0]$.
    preuve: |
      (i) On a
      $$\begin{aligned} E[S_{n+1} \mid \mathcal F_n] &= S_n + E[X_{n+1} \mid \mathcal F_n] \\ &= S_n + E[X_{n+1}] = S_n, \end{aligned}$$
      par l'indépendance de $X_{n+1}$ et de $\mathcal F_n$ ({{p-independance|Indépendance}}, (ii)) et {{mt-conditionnelle|Espérance conditionnelle}}, (iv). Pour $M_n = E[X \mid \mathcal F_n]$, c'est l'emboîtement.

      (ii) Par récurrence et emboîtement, puis en prenant l'espérance.

      (iii) On a
      $$\begin{aligned} M_T &= M_0 \\ &\quad + \sum_{k=0}^{N-1}(M_{k+1} - M_k)\mathbf 1_{\{T > k\}}, \end{aligned}$$
      et $\{T > k\}$, complémentaire de $\{T \leqslant k\}$, appartient à $\mathcal F_k$. Donc
      $$\begin{aligned} &E\big[(M_{k+1} - M_k)\mathbf 1_{\{T > k\}}\big] \\ &= E\big[\mathbf 1_{\{T > k\}}\,E[M_{k+1} - M_k \mid \mathcal F_k]\big] \\ &= 0. \end{aligned}$$
    remarques:
      - |
        L'hypothèse que $T$ est borné ne peut pas être levée. Au jeu de pile ou face équitable, la stratégie qui double la mise après chaque perte et s'arrête au premier gain assure un gain de $1$ à l'instant d'arrêt $T$, presque sûrement fini ; pourtant $E[M_0] = 0$. Le paradoxe tient à ce que $T$ n'est pas borné et que les pertes intermédiaires ne le sont pas non plus : aucune richesse finie ne permet de suivre la stratégie jusqu'au bout.

  - id: mt-doob
    etiquette: Inégalité maximale
    nature: théorème
    titre: Inégalité maximale de Kolmogorov et Doob
    enonce: |
      Soit $(M_n)$ une martingale de carré intégrable. Alors
      $$\begin{aligned} E[M_n^2] &= E[M_0^2] \\ &\quad + \sum_{k=1}^n E\big[(M_k - M_{k-1})^2\big], \end{aligned}$$
      les accroissements étant orthogonaux, et pour tout $a > 0$,
      $$P\Big(\max_{0 \leqslant k \leqslant n}|M_k| \geqslant a\Big) \leqslant \frac{E[M_n^2]}{a^2}.$$
    preuve: |
      Pour $k \geqslant 1$, $M_{k-1} = E[M_k \mid \mathcal F_{k-1}]$ est la projection de $M_k$ sur $\lex{espace-L2}{L^2}(\mathcal F_{k-1})$ ({{mt-conditionnelle|Espérance conditionnelle}}) : l'accroissement $M_k - M_{k-1}$ est orthogonal à $L^2(\mathcal F_{k-1})$, qui contient $M_0$ et les accroissements antérieurs. D'où la première formule.

      De même, $M_n - M_k$, somme d'accroissements postérieurs, est orthogonal à $L^2(\mathcal F_k)$ ; pour $A \in \mathcal F_k$, la variable $M_k\mathbf 1_A$ appartient à $L^2(\mathcal F_k)$, et
      $$\begin{aligned} E[M_n^2\mathbf 1_A] &= E[M_k^2\mathbf 1_A] \\ &\quad + E[(M_n - M_k)^2\mathbf 1_A] \\ &\geqslant E[M_k^2\mathbf 1_A]. \end{aligned}$$

      Soit $T$ le premier $k \leqslant n$ tel que $|M_k| \geqslant a$, s'il existe : c'est un temps d'arrêt, et $\{T = k\} \in \mathcal F_k$.

      ```schema mt-doob
      Une trajectoire de la marche simple $M_k$, somme de signes $\pm 1$ indépendants : $T$ est le premier instant où $|M_k|$ atteint $a = 8$, ici par le bas, et la suite de la trajectoire, en gris, n'intervient plus, bien que $|M_{60}|$ soit revenu sous $a$. Pour $n = 60$, la probabilité exacte de $\{T \leqslant n\}$ vaut environ $0{,}608$, et la borne $E[M_n^2]/a^2$ vaut $\frac{60}{64}$.
      ```

      Alors
      $$\begin{aligned} E[M_n^2] &\geqslant \sum_{k=0}^n E\big[M_n^2\mathbf 1_{\{T = k\}}\big] \\ &\geqslant \sum_{k=0}^n E\big[M_k^2\mathbf 1_{\{T = k\}}\big] \\ &\geqslant a^2\,P(T \leqslant n), \end{aligned}$$
      et $\{T \leqslant n\}$ est l'événement $\max_{k \leqslant n}|M_k| \geqslant a$.
    remarques:
      - |
        Pour une somme $S_n$ de variables indépendantes centrées, l'inégalité dit que le maximum de $|S_k|$ sur $k \leqslant n$ n'est pas plus souvent grand que $|S_n|$ lui-même, au sens de Bienaymé-Tchebychev ({{p-esperance|Espérance, variance}}). Contrôler toute la trajectoire au prix d'un seul instant est l'idée qui mène à la convergence presque sûre.

  - id: mt-convergence
    etiquette: Convergence des martingales
    nature: théorème
    titre: Convergence des martingales bornées dans L²
    enonce: |
      Si $(M_n)$ est une martingale telle que $\sup_n E[M_n^2] < +\infty$, elle converge presque sûrement et dans $\lex{espace-L2}{L^2}$ vers une variable $M_\infty$, et $M_n = E[M_\infty \mid \mathcal F_n]$.
    preuve: |
      Par l'orthogonalité des accroissements ({{mt-doob|Inégalité maximale}}), $E[M_n^2]$ croît et est bornée, donc $\sum_k E[(M_k - M_{k-1})^2] < +\infty$, et
      $$\begin{aligned} &E[(M_n - M_m)^2] \\ &= \sum_{m < k \leqslant n} E[(M_k - M_{k-1})^2] : \end{aligned}$$
      la suite est de Cauchy dans $L^2$, qui est complet ({{f-lp|Espaces L¹ et L²}}), et converge vers $M_\infty$.

      Pour $m$ fixé, $(M_{m+j} - M_m)_{j \geqslant 0}$ est une martingale ; l'inégalité maximale et la continuité croissante donnent
      $$\begin{aligned} &P\Big(\sup_{n \geqslant m}|M_n - M_m| \geqslant \varepsilon\Big) \\ &\leqslant \frac{1}{\varepsilon^2}\sum_{k > m} E\big[(M_k - M_{k-1})^2\big], \end{aligned}$$
      qui tend vers $0$ quand $m \to \infty$. Les événements $\{\sup_{n, n' \geqslant m}|M_n - M_{n'}| \geqslant 2\varepsilon\}$ décroissent donc vers un événement négligeable ; avec $\varepsilon = 1/(j + 1)$, $j \in \lex{ensemble-entiers-naturels}{\mathbb N}$, la suite est presque sûrement de Cauchy, donc converge presque sûrement, vers une limite égale à $M_\infty$ presque sûrement, une suite extraite convergeant presque sûrement vers $M_\infty$.

      Enfin, pour $G \in \mathcal F_n$,
      $$\begin{aligned} E[M_\infty\mathbf 1_G] &= \lim_m E[M_m\mathbf 1_G] \\ &= E[M_n\mathbf 1_G]. \end{aligned}$$
    remarques:
      - |
        Le théorème de Doob affirme plus : une martingale bornée dans $\lex{espace-L1}{L^1}$ converge presque sûrement. Sa démonstration, qui compte les **montées** de la martingale entre deux niveaux, fait l'objet des deux nœuds suivants, {{mt-montees|Montées}} et {{mt-doob-l1|Martingales bornées dans L¹}}.

  - id: mt-montees
    etiquette: Montées
    nature: lemme
    titre: Inégalité des montées de Doob
    texte: |
      Soit $(M_n)$ une martingale pour la filtration $(\mathcal F_n)$, et $a < b$ deux réels. On définit par récurrence $\tau_0 = 0$ et, pour $j \geqslant 1$,
      $$\begin{aligned} \sigma_j &= \inf\{k \geqslant \tau_{j-1} : M_k \leqslant a\}, \\ \tau_j &= \inf\{k > \sigma_j : M_k \geqslant b\}, \end{aligned}$$
      avec $\inf \varnothing = +\infty$. Le nombre de **montées** de $a$ à $b$ avant l'instant $n$ est $U_n = \max\{j : \tau_j \leqslant n\}$, le maximum valant $0$ si aucun $\tau_j$ n'est $\leqslant n$. On pose $H_k = 1$ s'il existe $j$ tel que $\sigma_j < k \leqslant \tau_j$, et $H_k = 0$ sinon.
    enonce: |
      (i) Les $\sigma_j$ et les $\tau_j$ sont des temps d'arrêt, et $H_k$ est $\mathcal F_{k-1}$-mesurable pour $k \geqslant 1$.

      (ii) Pour tout $n$, $\displaystyle \sum_{k=1}^n H_k(M_k - M_{k-1}) \geqslant (b - a)\,U_n - (M_n - a)^-$, où $x^- = \max(-x, 0)$.

      (iii) *Inégalité des montées.* $(b - a)\,E[U_n] \leqslant E\big[(M_n - a)^-\big] \leqslant E[|M_n|] + |a|$.
    preuve: |
      (i) Par récurrence sur $j$, montrons que $\{\sigma_j \leqslant k\}$ et $\{\tau_j \leqslant k\}$ appartiennent à $\mathcal F_k$ pour tout $k$. On a
      $$\begin{aligned} \{\sigma_j \leqslant k\} = \bigcup_{l \leqslant k} \big(&\{\tau_{j-1} \leqslant l\} \\ &\cap \{M_l \leqslant a\}\big), \end{aligned}$$
      réunion finie d'événements de $\mathcal F_l \subset \mathcal F_k$, puisque, $M_l$ étant $\mathcal F_l$-mesurable, $\{M_l \leqslant a\} \in \mathcal F_l$ ; de même
      $$\begin{aligned} \{\tau_j \leqslant k\} = \bigcup_{l \leqslant k}\big(&\{\sigma_j \leqslant l - 1\} \\ &\cap \{M_l \geqslant b\}\big) ; \end{aligned}$$
      enfin $\{\sigma_j = k\} = \{\sigma_j \leqslant k\} \setminus \{\sigma_j \leqslant k - 1\} \in \mathcal F_k$, et de même pour $\tau_j$.

      Par récurrence, puisque $\tau_j > \sigma_j \geqslant \tau_{j-1}$, on a $\tau_j \geqslant j$ et $\sigma_j \geqslant j - 1$ ; en particulier $U_n = \sum_{j=1}^n \mathbf 1_{\{\tau_j \leqslant n\}}$, les $\tau_j$ étant croissants, est une variable aléatoire.

      Les intervalles $]\sigma_j, \tau_j]$ sont disjoints, car $\sigma_{j+1} \geqslant \tau_j$, et $\{\sigma_j < k \leqslant \tau_j\} = \{\sigma_j \leqslant k - 1\} \setminus \{\tau_j \leqslant k - 1\} \in \mathcal F_{k-1}$. Seuls les $j \leqslant k$ interviennent, puisque $\sigma_j \geqslant j - 1$ : $H_k$ est l'indicatrice d'une réunion finie d'événements de $\mathcal F_{k-1}$.

      (ii) Sur chaque intervalle $]\sigma_j, \tau_j]$ contenu dans $[1, n]$, la somme télescope en $M_{\tau_j} - M_{\sigma_j} \geqslant b - a$ ; il y en a $U_n$. Il peut rester un intervalle commencé et non achevé, $]\sigma_j, n]$ avec $\sigma_j < n < \tau_j$, qui contribue $M_n - M_{\sigma_j} \geqslant M_n - a \geqslant -(M_n - a)^-$, puisque $M_{\sigma_j} \leqslant a$. Les autres termes sont nuls.

      (iii) Par (i), $H_k = \mathbf 1_A$ avec $A \in \mathcal F_{k-1}$. Comme $M_{k-1} = E[M_k \mid \mathcal F_{k-1}]$, la caractérisation de l'espérance conditionnelle ({{mt-conditionnelle|Espérance conditionnelle}}, (i) et (ii)) donne $E[\mathbf 1_AM_k] = E[\mathbf 1_AM_{k-1}]$, c'est-à-dire $E[H_k(M_k - M_{k-1})] = 0$. On prend l'espérance de (ii), et $(M_n - a)^- \leqslant |M_n| + |a|$.
    remarques:
      - |
        La suite $(H_k)$ est une stratégie de jeu : on achète quand le cours est descendu sous $a$, on revend dès qu'il dépasse $b$. Chaque montée rapporte au moins $b - a$, la seule perte possible est celle de la dernière position ouverte, et un jeu équitable ne rapporte rien en moyenne : les montées ne peuvent donc pas être nombreuses en moyenne.

        ```schema mt-montees
        Une trajectoire de la marche simple sur $60$ pas, avec $a = -2$ et $b = 2$. Les intervalles où $H_k = 1$ sont ombrés : les deux montées achevées, de $\sigma_j$ à $\tau_j$, en rouge, et la dernière position, ouverte en $\sigma_3 = 52$ et non soldée à l'instant $60$, en bleu. Ici $U_{60} = 2$.
        ```

  - id: mt-doob-l1
    etiquette: Martingales bornées dans L¹
    nature: théorème
    titre: Convergence presque sûre des martingales bornées dans L¹
    enonce: |
      Si $(M_n)$ est une martingale telle que $K = \sup_n E[|M_n|] < +\infty$, elle converge presque sûrement vers une variable $M_\infty$ intégrable, avec $E[|M_\infty|] \leqslant K$.
    preuve: |
      Pour $a < b$, la suite des $U_n$ du nœud {{mt-montees|Montées}} est croissante ; sa limite $U_\infty \in [0, +\infty]$, nombre total de montées de $a$ à $b$, vérifie $E[U_\infty] \leqslant (K + |a|)/(b - a)$ par convergence monotone ({{m-beppo-levi|Beppo Levi}}) et l'inégalité des montées. Donc $U_\infty < +\infty$ presque sûrement.

      Or, sur l'événement $\{\liminf M_n < a < b < \limsup M_n\}$, la suite passe une infinité de fois sous $a$ et au-dessus de $b$ ; par récurrence, tous les $\sigma_j$ et $\tau_j$ sont alors finis, et $U_\infty = +\infty$ : cet événement est négligeable.

      La réunion de ces événements, pour les couples de rationnels $a < b$, est négligeable, comme réunion dénombrable d'événements négligeables, une énumération de $\lex{ensemble-rationnels}{\mathbb Q}^2$ étant fixée ({{q-denombrable|ℚ dénombrable}}) ; c'est exactement l'événement $\{\liminf M_n < \limsup M_n\}$, puisqu'entre deux éléments distincts de $[-\infty, +\infty]$ on trouve deux rationnels.

      Par le lemme de Fatou ({{m-fatou|Fatou}}), $E[\liminf |M_n|] \leqslant \liminf E[|M_n|] \leqslant K$, donc $\liminf |M_n| < +\infty$ presque sûrement ({{m-integrale|Intégrale}}, (iv)). L'événement $\Omega_0 = \{\liminf M_n = \limsup M_n \in \mathbb R\}$ est donc de probabilité $1$.

      Posons $M_\infty = \limsup M_n$ sur $\Omega_0$ et $M_\infty = 0$ ailleurs, variable mesurable ({{m-mesurables|Fonctions mesurables}}, (ii)) : $M_n \to M_\infty$ presque sûrement, et $|M_\infty| \leqslant \liminf |M_n|$ partout, d'où $E[|M_\infty|] \leqslant K$.
    remarques:
      - |
        La convergence n'a pas lieu dans $\lex{espace-L1}{L^1}$ en général. Avec des signes $\varepsilon_k = \pm 1$ indépendants équiprobables, la suite
        $$M_n = \prod_{k \leqslant n} 2\,\mathbf 1_{\{\varepsilon_k = 1\}},$$
        produit de facteurs indépendants d'espérance $1$, est une martingale ({{mt-conditionnelle|Espérance conditionnelle}}, (iv), puisque $M_n \leqslant 2^n$ est bornée et que $\varepsilon_{n+1}$ est indépendante de $\mathcal F_n$), et $E[|M_n|] = 2^n \cdot 2^{-n} = 1$.

        Elle est nulle dès le premier $\varepsilon_k = -1$, et $P(\varepsilon_1 = \cdots = \varepsilon_n = 1) = 2^{-n} \to 0$ : elle tend vers $0$ presque sûrement. Mais $E[|M_n - 0|] = 1$ ne tend pas vers $0$, et une limite dans $L^1$ coïnciderait presque sûrement avec $0$. Ce qui manque est la propriété dite d'équi-intégrabilité, qui n'est pas étudiée ici.
      - |
        Le théorème contient celui du nœud {{mt-convergence|Convergence des martingales}} pour la convergence presque sûre, puisque $E[|M_n|] \leqslant E[M_n^2]^{1/2}$ par Cauchy-Schwarz ; la preuve dans $L^2$ reste utile, parce qu'elle donne en plus la convergence dans $L^2$ et $M_n = E[M_\infty \mid \mathcal F_n]$.

  - id: mt-applications
    etiquette: Applications
    nature: proposition
    titre: Série harmonique aléatoire et urne de Pólya
    enonce: |
      (i) Si $(\varepsilon_n)$ sont indépendantes et valent $\pm 1$ avec probabilité $\frac12$, la série $\sum_{n \geqslant 1} \varepsilon_n/n$ converge presque sûrement.

      (ii) *Urne de Pólya.* Une urne contient au départ une boule rouge et une bleue ; à chaque étape, on tire une boule uniformément, et on la remet avec une boule supplémentaire de même couleur. La proportion $X_n$ de boules rouges après $n$ tirages est une martingale, qui converge presque sûrement.
    preuve: |
      (i) Les sommes partielles $M_n = \sum_{k \leqslant n}\varepsilon_k/k$ forment une martingale ({{mt-martingales|Martingales}}, (i)), et $E[M_n^2] = \sum_{k \leqslant n}1/k^2$ est borné. On applique {{mt-convergence|Convergence des martingales}}. Des variables $\varepsilon_n$ existent sur $[0, 1[$ : $\varepsilon_n = 2d_n - 1$, où $d_n$ est le $n$-ième chiffre binaire ({{p-normaux|Nombres normaux}}).

      (ii) On réalise l'urne à partir d'une suite de variables uniformes indépendantes $U_n$, qui existe sur $[0, 1[$ ({{p-suites-iid|Suites indépendantes}}, (i)) : au tirage $n + 1$, on tire une rouge si $U_{n+1} \leqslant X_n$. Après $n$ tirages, l'urne contient $n + 2$ boules, dont $R_n$ rouges, et $X_n = R_n/(n + 2)$ ; on prend $\mathcal F_n = \sigma(U_1, \dots, U_n)$, et $R_n$ est $\mathcal F_n$-mesurable, par récurrence. Comme $X_n$ ne prend que les valeurs $r/(n + 2)$, $1 \leqslant r \leqslant n + 1$,
      $$\begin{aligned} &\mathbf 1_{\{U_{n+1} \leqslant X_n\}} \\ &= \sum_r \mathbf 1_{\{X_n = r/(n+2)\}}\,\mathbf 1_{\{U_{n+1} \leqslant r/(n+2)\}}, \end{aligned}$$
      où chaque $\mathbf 1_{\{X_n = r/(n+2)\}}$ est bornée et $\mathcal F_n$-mesurable, et $U_{n+1}$ est indépendante de $\mathcal F_n$ par regroupement ({{p-independance|Indépendance}}, (ii)).

      Par {{mt-conditionnelle|Espérance conditionnelle}}, (iv), l'espérance conditionnelle de ce tirage sachant $\mathcal F_n$ vaut
      $$\sum_r \mathbf 1_{\{X_n = r/(n+2)\}}\,\frac r{n+2} = X_n,$$
      d'où $E[R_{n+1} \mid \mathcal F_n] = R_n + X_n$ et
      $$\begin{aligned} E[X_{n+1} \mid \mathcal F_n] &= \frac{R_n(n + 3)/(n + 2)}{n + 3} \\ &= X_n. \end{aligned}$$

      Comme $0 \leqslant X_n \leqslant 1$, $E[X_n^2] \leqslant 1$, et la martingale converge presque sûrement.
    remarques:
      - |
        On montre par récurrence que $R_n$ est uniforme sur $\{1, \dots, n + 1\}$ : la limite de l'urne de Pólya suit la loi uniforme sur $[0, 1]$. Chaque urne converge, mais vers une proportion aléatoire, fixée par les tout premiers tirages ; c'est un modèle de renforcement, où le hasard initial devient une propriété permanente.

        ```schema mt-applications
        Six urnes simulées selon la règle de la preuve, sur $500$ tirages, l'axe horizontal étant gradué en échelle logarithmique : les proportions se séparent dès les premiers tirages, puis chacune se stabilise vers sa propre limite.
        ```
      - |
        La série harmonique alternée $\sum (-1)^{n+1}/n$ converge, vers une valeur précise, alors que $\sum 1/n$ diverge. Le théorème (i) dit que des signes tirés au hasard suffisent presque sûrement à la convergence ; la somme, elle, est une variable aléatoire de loi continue.

        ```schema mt-applications-2
        Les sommes partielles $\sum_{k \leqslant n}\varepsilon_k/k$ pour quatre tirages des signes, en rouge, et celles de la série alternée, en pointillé : chaque trajectoire se stabilise, mais vers une limite qui dépend du tirage.
        ```

