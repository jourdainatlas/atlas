# Niveau 2 : structure interne du chapitre « Suites de composition et théorème de Jordan-Hölder » (nœud
# gf-jordan-holder du graphe gf, créé le 30 oct. 2026). Deuxième et troisième théorèmes d'isomorphisme et
# théorème de correspondance ; lemme du papillon de Zassenhaus ; théorème de raffinement de Schreier ; suites de
# composition, existence pour un groupe fini ; théorème de Jordan-Hölder, démontré par Schreier ; simplicité de
# 𝔄₅ (par les théorèmes de Sylow et un dénombrement) ; exemples (ℤ/12ℤ, 𝔖₄, 𝔖₅, groupes non isomorphes de mêmes
# facteurs) ; résolubilité et facteurs de composition, stabilité de la résolubilité par sous-groupe.
# Les énoncés de Zassenhaus, de Schreier et de Jordan-Hölder valent pour des groupes quelconques, les suites
# étant de longueur finie ; seule l'existence d'une suite de composition demande la finitude du groupe.
# Aucune forme du choix n'intervient.

graphe: gf-jordan-holder
titre: Suites de composition et théorème de Jordan-Hölder
conteneur: gf-jordan-holder

entrees:
  gf-moins-de-60: [jh-a5-simple]

noeuds:
  - id: jh-isomorphismes
    etiquette: Isomorphismes, correspondance
    nature: théorème
    titre: Deuxième et troisième théorèmes d'isomorphisme, théorème de correspondance
    texte: |
      Dans tout ce chapitre, les groupes sont quelconques, finis ou non, sauf mention contraire ; ils sont notés multiplicativement, de neutre $e$. Pour deux parties $H$ et $K$ d'un groupe, on note $HK = \{hk : h \in H,\ k \in K\}$.

      Soit $N$ un [[sous-groupe-distingue|sous-groupe distingué]] de $G$ et $\pi : G \to G/N$ la surjection canonique ({{a-quotient|Groupe quotient}}). Si $H$ est un sous-groupe de $G$ qui contient $N$, alors $N$ est distingué dans $H$, et les classes $xN$, pour $x \in H$, sont les mêmes ensembles qu'on les calcule dans $H$ ou dans $G$, avec la même loi $(xN)(yN) = xyN$.

      Le [[groupe-quotient|groupe quotient]] $H/N$ est donc la partie $\pi(H)$ de $G/N$, munie de la loi induite ; c'est un sous-groupe de $G/N$, image de $H$ par le morphisme $\pi$ ({{a-morphisme|Morphisme}}, (iii)).
    enonce: |
      (i) *Produit.* Soient $H$ un sous-groupe et $N$ un sous-groupe distingué de $G$. Alors $HN = NH$, et c'est un sous-groupe de $G$ qui contient $N$ et dans lequel $N$ est distingué. Si $H$ est lui aussi distingué dans $G$, le sous-groupe $HN$ l'est.

      (ii) *Deuxième théorème d'isomorphisme.* Sous les mêmes hypothèses, $H \cap N$ est distingué dans $H$, et l'application $h(H \cap N) \mapsto hN$ est un isomorphisme
      $$H/(H \cap N) \;\cong\; HN/N.$$

      (iii) *Correspondance.* Soit $N$ distingué dans $G$. L'application $H \mapsto H/N = \pi(H)$ est une bijection de l'ensemble des sous-groupes de $G$ qui contiennent $N$ sur l'ensemble des sous-groupes de $G/N$, de réciproque $K \mapsto \pi^{-1}(K)$. Elle respecte l'inclusion dans les deux sens, et $H$ est distingué dans $G$ si et seulement si $H/N$ est distingué dans $G/N$.

      (iv) *Troisième théorème d'isomorphisme.* Si $N \subset H$ sont deux sous-groupes distingués de $G$, l'application $(xN)(H/N) \mapsto xH$ est un isomorphisme
      $$(G/N)/(H/N) \;\cong\; G/H.$$
    preuve: |
      (i) Pour $h \in H$ et $n \in N$, on a $hn = (hnh^{-1})h \in NH$ et $nh = h(h^{-1}nh) \in HN$, puisque $N$ est distingué : $HN = NH$.

      L'ensemble $HN$ contient $e = ee$. Pour $x = hn$ et $y = h'n'$ dans $HN$,
      $$\begin{aligned} xy^{-1} &= hn\,n'^{-1}h'^{-1} \\ &= (hh'^{-1})\big(h'\,nn'^{-1}\,h'^{-1}\big), \end{aligned}$$
      produit d'un élément de $H$ et d'un élément de $N$ : $HN$ est un sous-groupe ({{a-sous-groupe|Sous-groupe}}, (i)). Il contient $N = eN$, et $N$, distingué dans $G$, l'est dans $HN$.

      Si $H$ est aussi distingué, alors pour $g \in G$, on a $g\,hn\,g^{-1} = (ghg^{-1})(gng^{-1}) \in HN$.

      (ii) La restriction de $\pi$ à $H$ est un morphisme $H \to G/N$, de noyau $H \cap N$ ; ce noyau est donc distingué dans $H$ ({{a-distingue|Sous-groupe distingué}}, (iii)).

      Son image est $\{hN : h \in H\}$. Comme $hnN = hN$ pour $n \in N$, c'est aussi $\{xN : x \in HN\}$, c'est-à-dire le groupe quotient $HN/N$, vu comme sous-groupe de $G/N$ comme on l'a expliqué plus haut. Le théorème d'isomorphisme ({{a-isomorphisme|Théorème d'isomorphisme}}) conclut.

      (iii) Soit $H$ un sous-groupe contenant $N$. On a $H \subset \pi^{-1}(\pi(H))$. Réciproquement, si $\pi(x) = \pi(h)$ avec $h \in H$, alors $h^{-1}x \in N \subset H$, donc $x \in H$ : ainsi $\pi^{-1}(\pi(H)) = H$.

      Soit $K$ un sous-groupe de $G/N$. Alors $\pi^{-1}(K)$ est un sous-groupe de $G$ ({{a-morphisme|Morphisme}}, (iii)), qui contient $\pi^{-1}(\{N\}) = N$, et $\pi(\pi^{-1}(K)) = K$ puisque $\pi$ est surjective. Les deux applications sont donc réciproques l'une de l'autre, et toutes deux respectent l'inclusion.

      Si $H$ est distingué dans $G$, alors $\pi(g)\pi(H)\pi(g)^{-1} = \pi(gHg^{-1}) = \pi(H)$ pour tout $g$. Réciproquement, si $\pi(H)$ est distingué dans $G/N$, alors pour $g \in G$ et $h \in H$, $\pi(ghg^{-1}) = \pi(g)\pi(h)\pi(g)^{-1} \in \pi(H)$, donc $ghg^{-1} \in \pi^{-1}(\pi(H)) = H$.

      (iv) Par (iii), $H/N$ est distingué dans $G/N$. La surjection canonique $p : G \to G/H$ s'annule sur $N \subset H$ ; elle se factorise ({{a-isomorphisme|Théorème d'isomorphisme}}) en un morphisme $q : G/N \to G/H$, $q(xN) = xH$, surjectif comme $p$.

      Son noyau est formé des $xN$ tels que $xH = H$, c'est-à-dire $x \in H$ : c'est $\pi(H) = H/N$. Le théorème d'isomorphisme, appliqué à $q$, donne l'isomorphisme annoncé.
    remarques:
      - |
        Dans $\lex{anneau-zn}{\mathbb Z/12\mathbb Z}$, notons $\langle \bar k \rangle$ le sous-groupe engendré par $\bar k$, et prenons $N = \langle \bar 4 \rangle = \{\bar 0, \bar 4, \bar 8\}$. Les sous-groupes qui contiennent $N$ sont $\mathbb Z/12\mathbb Z$, $\langle \bar 2 \rangle$ et $N$ lui-même, et le quotient $(\mathbb Z/12\mathbb Z)/N$, cyclique d'ordre $4$, a bien trois sous-groupes, d'ordres $4$, $2$ et $1$ ({{gf-cycliques|Groupes cycliques}}, (iii)).

        Le troisième théorème se lit alors comme une simplification de fractions : le quotient de $(\mathbb Z/12\mathbb Z)/N$, d'ordre $4$, par $\langle \bar 2 \rangle/N$, d'ordre $2$, est isomorphe à $(\mathbb Z/12\mathbb Z)/\langle \bar 2 \rangle$, d'ordre $2$, « comme si l'on simplifiait par $N$ ».
      - |
        L'erreur la plus répandue est d'appliquer (i) ou (ii) sans hypothèse de distinction : le produit de deux sous-groupes n'est pas un sous-groupe en général. Dans $\mathfrak S_3$, les sous-groupes engendrés par les transpositions $(1\ 2)$ et $(1\ 3)$ ont un produit à quatre éléments, qui n'est pas un sous-groupe, comme le relève le nœud {{gf-produits|Produits semi-directs}}.
      - |
        Le point (iii) dit que tout ce qui se passe « au-dessus de $N$ » dans $G$ se lit dans $G/N$. C'est l'outil qui fera passer, au nœud {{jh-composition|Suites de composition}}, de la simplicité d'un quotient $G/N$ à la maximalité de $N$ parmi les sous-groupes distingués de $G$.

  - id: jh-zassenhaus
    etiquette: Lemme de Zassenhaus
    nature: lemme
    titre: Lemme du papillon de Zassenhaus
    enonce: |
      Soient $A$ et $B$ deux sous-groupes d'un groupe $G$, $A'$ un sous-groupe distingué de $A$ et $B'$ un sous-groupe distingué de $B$. Alors $A'(A \cap B')$ est un sous-groupe distingué de $A'(A \cap B)$, $B'(A' \cap B)$ est un sous-groupe distingué de $B'(A \cap B)$, et
      $$\begin{aligned} \frac{A'(A \cap B)}{A'(A \cap B')} &\cong \frac{A \cap B}{(A' \cap B)(A \cap B')} \\ &\cong \frac{B'(A \cap B)}{B'(A' \cap B)}. \end{aligned}$$
    preuve: |
      *Le sous-groupe central.* Les sous-groupes $A' \cap B$ et $A \cap B'$ sont distingués dans $A \cap B$. En effet, pour $g \in A \cap B$ et $x \in A' \cap B$, on a $gxg^{-1} \in A'$, puisque $g \in A$ et que $A'$ est distingué dans $A$, et $gxg^{-1} \in B$ ; de même pour $A \cap B'$.

      Par {{jh-isomorphismes|Isomorphismes, correspondance}}, (i), appliqué dans le groupe $A \cap B$,
      $$D = (A' \cap B)(A \cap B')$$
      est un sous-groupe distingué de $A \cap B$, et $D = (A \cap B')(A' \cap B)$.

      *Les ailes.* Le sous-groupe $A \cap B$ est contenu dans $A$, où $A'$ est distingué : par le même point (i), appliqué dans $A$, $A'(A \cap B)$ est un sous-groupe, et ses éléments s'écrivent $a'x$ avec $a' \in A'$ et $x \in A \cap B$.

      Posons $f(a'x) = xD \in (A \cap B)/D$. Cette valeur ne dépend pas de l'écriture : si $a'x = a''y$, alors $yx^{-1} = a''^{-1}a'$ appartient à $A'$ et à $A \cap B$, donc à $A' \cap B \subset D$, et $x^{-1}y = x^{-1}(yx^{-1})x \in D$, puisque $D$ est distingué dans $A \cap B$ : $xD = yD$.

      C'est un morphisme. Pour $a', b' \in A'$ et $x, y \in A \cap B$,
      $$(a'x)(b'y) = a'(xb'x^{-1})\,xy,$$
      avec $xb'x^{-1} \in A'$ puisque $x \in A$, d'où $f\big((a'x)(b'y)\big) = xyD = f(a'x)f(b'y)$. Il est surjectif, puisque $f(ex) = xD$.

      Son noyau est formé des $a'x$ avec $x \in D$, c'est-à-dire
      $$\begin{aligned} \operatorname{Ker} f = A'D &= A'(A' \cap B)(A \cap B') \\ &= A'(A \cap B'), \end{aligned}$$
      puisque $A'(A' \cap B) = A'$. Ce noyau est distingué dans $A'(A \cap B)$ ({{a-distingue|Sous-groupe distingué}}, (iii)), et le théorème d'isomorphisme ({{a-isomorphisme|Théorème d'isomorphisme}}) donne le premier isomorphisme.

      *Symétrie.* Échangeons les rôles de $A$ et $B$, et de $A'$ et $B'$. Le sous-groupe central devient $(B' \cap A)(B \cap A') = (A \cap B')(A' \cap B)$, qui est $D$, et le même raisonnement montre que $B'(A' \cap B)$ est distingué dans $B'(A \cap B)$, de quotient isomorphe à $(A \cap B)/D$.
    remarques:
      - |
        Le nom vient de la forme du diagramme des sous-groupes en jeu, où les trois quotients du lemme dessinent les deux ailes et le corps d'un papillon.

        ```schema jh-zassenhaus
        Chaque trait relie un sous-groupe, en haut, à un sous-groupe qu'il contient, en bas, et $D = (A' \cap B)(A \cap B')$. Les trois traits rouges sont les trois quotients du lemme : l'aile gauche $A'(A \cap B)/A'(A \cap B')$, le corps $(A \cap B)/D$ et l'aile droite $B'(A \cap B)/B'(A' \cap B)$, tous trois isomorphes. Les inclusions ont été vérifiées sur un exemple dans $\mathbb Z/1800\mathbb Z$ où les douze sous-groupes sont distincts.
        ```
      - |
        Le lemme contient le deuxième théorème d'isomorphisme. Pour $B' = \{e\}$, il donne
        $$A'(A \cap B)/A' \;\cong\; (A \cap B)/(A' \cap B),$$
        qui est le point (ii) du nœud {{jh-isomorphismes|Isomorphismes, correspondance}}, appliqué dans $A$ au sous-groupe $A \cap B$ et au sous-groupe distingué $A'$.
      - |
        Le lemme est dû à H. Zassenhaus, qui l'a publié en 1934 (« Zum Satz von Jordan-Hölder-Schreier », *Abh. Math. Sem. Univ. Hamburg* 10, p. 106-108) pour simplifier la démonstration du théorème de raffinement de Schreier, objet du nœud suivant.

  - id: jh-schreier
    etiquette: Raffinement de Schreier
    nature: théorème
    titre: Théorème de raffinement de Schreier
    texte: |
      Une [[suite-normale|suite normale]] de longueur $r \in \lex{ensemble-entiers-naturels}{\mathbb N}$ d'un groupe $G$ est une suite finie de sous-groupes
      $$G = G_0 \supset G_1 \supset \cdots \supset G_r = \{e\},$$
      chacun distingué dans le précédent ; ses **facteurs** sont les $r$ groupes quotients $G_{i-1}/G_i$, pour $1 \leqslant i \leqslant r$. Les inclusions ne sont pas supposées strictes : un facteur peut être trivial.

      Une suite normale $(K_k)_{0 \leqslant k \leqslant N}$ est un **raffinement** de $(G_i)_{0 \leqslant i \leqslant r}$ s'il existe des indices $0 = k_0 \leqslant k_1 \leqslant \cdots \leqslant k_r = N$ tels que $K_{k_i} = G_i$ pour tout $i$ : on obtient le raffinement en insérant des termes.

      Deux suites normales $(G_i)_{0 \leqslant i \leqslant r}$ et $(H_j)_{0 \leqslant j \leqslant s}$, éventuellement de deux groupes différents, sont **équivalentes** si $r = s$ et s'il existe une bijection $\sigma$ de $\{1, \dots, r\}$ sur lui-même telle que $G_{i-1}/G_i$ soit isomorphe à $H_{\sigma(i)-1}/H_{\sigma(i)}$ pour tout $i$ : elles ont les mêmes facteurs, à l'ordre et à isomorphisme près.
    enonce: |
      (i) L'équivalence des suites normales est réflexive, symétrique et transitive.

      (ii) *Schreier.* Deux suites normales d'un même groupe, de longueurs $r \geqslant 1$ et $s \geqslant 1$, ont des raffinements équivalents, de longueur $rs$.
    preuve: |
      (i) L'identité convient pour la réflexivité ; la bijection réciproque et les isomorphismes réciproques ({{a-morphisme|Morphisme}}, (ii)) pour la symétrie ; la composée des bijections et des isomorphismes pour la transitivité.

      (ii) Soient $G = G_0 \supset \cdots \supset G_r = \{e\}$ et $G = H_0 \supset \cdots \supset H_s = \{e\}$ deux suites normales, avec $r, s \geqslant 1$.

      Pour $0 \leqslant i < r$ et $0 \leqslant j \leqslant s$, posons
      $$\begin{aligned} G_{i,j} &= G_{i+1}(G_i \cap H_j), \\ H_{j,i} &= H_{j+1}(H_j \cap G_i), \end{aligned}$$
      ce second sous-groupe étant défini pour $0 \leqslant j < s$ et $0 \leqslant i \leqslant r$.

      *Ce sont des raffinements.* Comme $G_{i+1}$ est distingué dans $G_i$ et que $G_i \cap H_j \subset G_i$, $G_{i,j}$ est un sous-groupe ({{jh-isomorphismes|Isomorphismes, correspondance}}, (i)). La suite $j \mapsto G_{i,j}$ décroît, de $G_{i,0} = G_{i+1}G_i = G_i$ à $G_{i,s} = G_{i+1}\{e\} = G_{i+1}$.

      Le lemme du papillon ({{jh-zassenhaus|Lemme de Zassenhaus}}), appliqué à $A = G_i$, $A' = G_{i+1}$, $B = H_j$ et $B' = H_{j+1}$, pour $0 \leqslant j < s$, montre que $G_{i,j+1}$ est distingué dans $G_{i,j}$, que $H_{j,i+1}$ est distingué dans $H_{j,i}$, et que
      $$G_{i,j}/G_{i,j+1} \;\cong\; H_{j,i}/H_{j,i+1}.$$

      Rangeons les $G_{i,j}$ dans l'ordre lexicographique : pour $0 \leqslant i < r$ et $0 \leqslant j < s$, posons $K_{is+j} = G_{i,j}$, et $K_{rs} = \{e\}$. Le terme qui suit $K_{is+j}$ est $G_{i,j+1}$ : c'est clair si $j + 1 < s$, et si $j + 1 = s$, c'est $K_{(i+1)s}$, qui vaut $G_{i+1,0} = G_{i+1} = G_{i,s}$ si $i + 1 < r$, et $\{e\} = G_r = G_{i,s}$ si $i + 1 = r$.

      Ainsi $(K_k)_{0 \leqslant k \leqslant rs}$ est une suite normale de $G$, de facteurs les $G_{i,j}/G_{i,j+1}$, et elle raffine $(G_i)$, puisque $K_{is} = G_i$. De même, $L_{jr+i} = H_{j,i}$ et $L_{rs} = \{e\}$ définissent un raffinement de $(H_j)$, de longueur $rs$, de facteurs les $H_{j,i}/H_{j,i+1}$.

      *Ils sont équivalents.* Le facteur d'indice $is + j + 1$ de $(K_k)$ est $G_{i,j}/G_{i,j+1}$, et celui d'indice $jr + i + 1$ de $(L_k)$ est $H_{j,i}/H_{j,i+1}$, qui lui est isomorphe. L'application $is + j + 1 \mapsto jr + i + 1$, pour $0 \leqslant i < r$ et $0 \leqslant j < s$, est une bijection de $\{1, \dots, rs\}$ sur lui-même, par unicité de la division euclidienne par $s$ et par $r$ ({{z-division|Division euclidienne}}).
    remarques:
      - |
        Dans $\mathbb Z/12\mathbb Z$, avec les notations du nœud {{jh-isomorphismes|Isomorphismes, correspondance}}, prenons les suites $\mathbb Z/12\mathbb Z \supset \langle \bar 2 \rangle \supset \{\bar 0\}$, de facteurs d'ordres $2$ et $6$, et $\mathbb Z/12\mathbb Z \supset \langle \bar 3 \rangle \supset \{\bar 0\}$, de facteurs d'ordres $3$ et $4$. Elles ne sont pas équivalentes, et la construction de la preuve les raffine en
        $$\begin{aligned} &\mathbb Z/12\mathbb Z = \mathbb Z/12\mathbb Z \supset \langle \bar 2 \rangle \supset \langle \bar 6 \rangle \supset \{\bar 0\}, \\ &\mathbb Z/12\mathbb Z = \mathbb Z/12\mathbb Z \supset \langle \bar 3 \rangle \supset \langle \bar 6 \rangle \supset \{\bar 0\}. \end{aligned}$$

        Les facteurs sont d'ordres $1, 2, 3, 2$ pour la première, et $1, 3, 2, 2$ pour la seconde ; la bijection de la preuve échange les deuxième et troisième facteurs, et fixe les deux autres. Le calcul des douze sous-groupes $G_{i,j}$ et $H_{j,i}$ a été vérifié par une énumération.
      - |
        L'hypothèse $r, s \geqslant 1$ n'écarte que le groupe trivial, dont la suite $\{e\}$, de longueur $0$, n'a pas d'autre raffinement qu'elle-même. Pour un groupe non trivial, toute suite normale a une longueur au moins égale à $1$.

        Les termes répétés, comme $\mathbb Z/12\mathbb Z = \mathbb Z/12\mathbb Z$ ci-dessus, ne gênent pas. Un isomorphisme envoie un groupe trivial sur un groupe trivial ; la bijection de l'équivalence envoie donc les facteurs triviaux d'un raffinement sur ceux de l'autre, et l'on peut retirer des deux côtés les termes répétés sans détruire l'équivalence.
      - |
        Le théorème a été publié par O. Schreier en 1928 (« Über den Jordan-Hölderschen Satz », *Abh. Math. Sem. Univ. Hamburg* 6, p. 300-302). La démonstration par le lemme du papillon, donnée ici, est celle de Zassenhaus (1934). Le nœud suivant en tire le théorème de Jordan-Hölder.

  - id: jh-composition
    etiquette: Suites de composition
    nature: proposition
    titre: Suites de composition, existence pour un groupe fini
    texte: |
      Une [[suite-composition|suite de composition]] d'un groupe $G$ est une [[suite-normale|suite normale]] ({{jh-schreier|Raffinement de Schreier}}) dont tous les facteurs sont des [[groupe-simple|groupes simples]] ({{gf-non-simples|Non-simplicité}}). Ses facteurs sont appelés les **facteurs de composition** de la suite.

      Un groupe simple n'étant pas réduit au neutre, les inclusions d'une suite de composition sont strictes.
    enonce: |
      (i) Un groupe d'ordre premier est simple. Un groupe abélien simple est cyclique d'ordre premier.

      (ii) Soit $N$ un sous-groupe distingué de $G$, distinct de $G$. Le quotient $G/N$ est simple si et seulement si aucun sous-groupe distingué $M$ de $G$ ne vérifie $N \subsetneq M \subsetneq G$.

      (iii) Tout groupe fini a une suite de composition.

      (iv) Si $G$ est fini et si $(G_i)_{0 \leqslant i \leqslant r}$ est une suite normale de $G$,
      $$|G| = \prod_{i=1}^r |G_{i-1}/G_i|.$$
    preuve: |
      (i) Un groupe d'ordre premier $p$ n'est pas réduit au neutre, et ses sous-groupes ont pour ordre $1$ ou $p$ par le théorème de Lagrange ({{gs-lagrange|Lagrange}}) : ce sont $\{e\}$ et lui-même.

      Soit $G$ abélien simple, et $x \neq e$ dans $G$. Le sous-groupe $\langle x \rangle$ est distingué, comme tout sous-groupe d'un groupe abélien ({{a-distingue|Sous-groupe distingué}}, (iii)), et n'est pas réduit au neutre : il vaut $G$, qui est donc cyclique.

      Si $G$ était infini, le morphisme $k \mapsto x^k$ de $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ sur $G$ serait injectif : sinon son noyau serait $d'\mathbb Z$ avec $d' \geqslant 1$ ({{z-ideaux|Idéaux de ℤ}}), et $\langle x \rangle \cong \mathbb Z/d'\mathbb Z$ serait fini ({{a-isomorphisme|Théorème d'isomorphisme}}). Le sous-groupe $\langle x^2 \rangle$, image de $2\mathbb Z$, serait alors distingué, différent de $\{e\}$ puisque $x^2 \neq e$, et différent de $G$, puisque $x = x^{2k}$ entraînerait $1 = 2k$ par injectivité : c'est exclu.

      Le groupe $G$ est donc fini, d'ordre $n \geqslant 2$. Si $n$ n'était pas premier, il aurait un diviseur $d$ avec $1 < d < n$, et $G$ un sous-groupe d'ordre $d$ (même nœud, (iii)), distingué et distinct de $\{e\}$ et de $G$ : c'est exclu.

      (ii) Comme $N \neq G$, le groupe $G/N$ n'est pas réduit au neutre. Par la correspondance ({{jh-isomorphismes|Isomorphismes, correspondance}}, (iii)), ses sous-groupes distingués sont les $M/N$, où $M$ parcourt les sous-groupes distingués de $G$ qui contiennent $N$, et $M \mapsto M/N$ est injective.

      Les sous-groupes $\{N\} = N/N$ et $G/N$ correspondent à $M = N$ et $M = G$. Le quotient est donc simple si et seulement s'il n'y a pas d'autre $M$.

      (iii) Par récurrence forte sur $|G|$ ({{n-ordre|Bon ordre sur ℕ}}). Si $|G| = 1$, la suite $G = G_0 = \{e\}$, de longueur $0$, convient.

      Sinon, l'ensemble des sous-groupes distingués de $G$ distincts de $G$ est fini, comme partie de l'ensemble fini des parties de $G$, et non vide, puisqu'il contient $\{e\}$. Leurs ordres $|M|$ forment une partie non vide de $\{1, \dots, |G| - 1\}$, qui a donc un plus grand élément ; soit $N$ l'un des sous-groupes dont l'ordre est ce plus grand élément.

      Si un sous-groupe distingué $M$ vérifiait $N \subsetneq M \subsetneq G$, on aurait $|M| > |N|$ ({{n-fini|Ensembles finis}}, (iii)), contre le choix de $N$ : par (ii), $G/N$ est simple.

      Comme $|N| < |G|$, l'hypothèse de récurrence fournit une suite de composition $N = N_0 \supset \cdots \supset N_t = \{e\}$, et $G \supset N_0 \supset \cdots \supset N_t$ est une suite de composition de $G$. Aucun axiome du choix n'intervient : on ne désigne qu'un élément d'un ensemble fini non vide.

      (iv) Par le théorème de Lagrange, $|G_{i-1}| = |G_i| \cdot |G_{i-1}/G_i|$ pour chaque $i$, et l'on conclut par récurrence sur $r$, puisque $|G_r| = 1$.
    remarques:
      - |
        L'existence peut tomber en défaut pour un groupe infini : $\mathbb Z$ n'a pas de suite de composition. Une telle suite aurait une longueur $r \geqslant 1$, puisque $\mathbb Z \neq \{0\}$, et son avant-dernier terme $G_{r-1}$ serait simple, isomorphe au facteur $G_{r-1}/\{0\}$.

        Or $G_{r-1}$ est un sous-groupe non nul de $\mathbb Z$, de la forme $m\mathbb Z$ avec $m \geqslant 1$ ({{z-ideaux|Idéaux de ℤ}}). Il contient le sous-groupe $2m\mathbb Z$, distingué puisque $\mathbb Z$ est abélien, non nul, et distinct de $m\mathbb Z$, qui contient $m$ : $m\mathbb Z$ n'est pas simple, ce que dit d'ailleurs le point (i), puisqu'il est abélien et infini.
      - |
        L'erreur la plus répandue tient au vocabulaire, qui varie selon les ouvrages : certains appellent « suite de composition » toute suite normale, et réservent le nom de « suite de Jordan-Hölder » aux suites dont les facteurs sont simples. Il faut vérifier, en lisant un énoncé, laquelle des deux notions est en jeu.
      - |
        La preuve de (iii) construit la suite de haut en bas, en descendant chaque fois vers un sous-groupe distingué maximal. Elle laisse en général plusieurs possibilités à chaque étape ; le théorème de Jordan-Hölder, au nœud suivant, dit que ce choix n'a aucune influence sur les facteurs obtenus.

  - id: jh-jordan-holder
    etiquette: Jordan-Hölder
    nature: théorème
    titre: Théorème de Jordan-Hölder
    enonce: |
      (i) *Raffinement d'une suite de composition.* Soit $(G_i)_{0 \leqslant i \leqslant r}$ une suite de composition de $G$, et $(K_k)_{0 \leqslant k \leqslant N}$ un raffinement. Alors exactement $r$ des facteurs $K_{k-1}/K_k$ ne sont pas triviaux, et, rangés dans l'ordre des indices $k$, ils sont respectivement égaux à $G_0/G_1, \dots, G_{r-1}/G_r$.

      (ii) *[[theoreme-jordan-holder|Théorème de Jordan-Hölder]].* Deux [[suite-composition|suites de composition]] d'un même groupe sont équivalentes : elles ont la même longueur, et les mêmes facteurs, à l'ordre et à isomorphisme près.

      (iii) Par suite, si $G$ a une suite de composition, sa longueur et la liste de ses facteurs, comptés avec multiplicité et à isomorphisme près, ne dépendent que de $G$ : ce sont la **longueur de composition** de $G$ et ses **facteurs de composition**.
    preuve: |
      (i) Soient $0 = k_0 \leqslant \cdots \leqslant k_r = N$ des indices tels que $K_{k_i} = G_i$ ; comme $G_{i-1} \neq G_i$, ils sont strictement croissants. Fixons $i$ entre $1$ et $r$ : pour $k_{i-1} \leqslant k \leqslant k_i$, on a $G_i \subset K_k \subset G_{i-1}$.

      Soit $k'$ le plus petit indice $k$ de $\{k_{i-1} + 1, \dots, k_i\}$ tel que $K_k \neq G_{i-1}$ ; il existe, puisque $K_{k_i} = G_i \neq G_{i-1}$. Par minimalité, $K_{k'-1} = G_{i-1}$, de sorte que $K_{k'}$ est distingué dans $G_{i-1}$, avec $G_i \subset K_{k'} \subsetneq G_{i-1}$.

      Comme $G_{i-1}/G_i$ est simple, aucun sous-groupe distingué de $G_{i-1}$ n'est strictement compris entre $G_i$ et $G_{i-1}$ ({{jh-composition|Suites de composition}}, (ii)) : $K_{k'} = G_i$, puis $K_k = G_i$ pour $k' \leqslant k \leqslant k_i$.

      Parmi les facteurs d'indices $k_{i-1} < k \leqslant k_i$, seul celui d'indice $k'$ est non trivial, et il vaut $K_{k'-1}/K_{k'} = G_{i-1}/G_i$. Les intervalles $\{k_{i-1} + 1, \dots, k_i\}$, pour $1 \leqslant i \leqslant r$, partagent $\{1, \dots, N\}$, d'où (i).

      (ii) Soient $(G_i)_{0 \leqslant i \leqslant r}$ et $(H_j)_{0 \leqslant j \leqslant s}$ deux suites de composition de $G$. Si $G$ est trivial, tous les termes valent $\{e\}$, et un facteur éventuel serait trivial, donc pas simple : $r = s = 0$. Sinon, $r$ et $s$ sont au moins égaux à $1$, et, par le théorème de Schreier ({{jh-schreier|Raffinement de Schreier}}, (ii)), elles ont des raffinements $(K_k)$ et $(L_k)$ de même longueur $N$, et une bijection $\tau$ de $\{1, \dots, N\}$ sur lui-même qui envoie l'indice de chaque facteur de $(K_k)$ sur celui d'un facteur isomorphe de $(L_k)$.

      Soient $I$ et $J$ les ensembles d'indices des facteurs non triviaux de $(K_k)$ et de $(L_k)$. Un groupe isomorphe à un groupe trivial est trivial, donc $\tau(I) = J$. Par (i), $I$ a $r$ éléments et $J$ en a $s$ : $r = s$.

      Soient $\alpha : \{1, \dots, r\} \to I$ et $\beta : \{1, \dots, r\} \to J$ les bijections croissantes. Par (i), le facteur d'indice $\alpha(i)$ de $(K_k)$ est $G_{i-1}/G_i$, et celui d'indice $\beta(j)$ de $(L_k)$ est $H_{j-1}/H_j$. La bijection $\sigma = \beta^{-1} \circ \tau \circ \alpha$ vérifie donc
      $$G_{i-1}/G_i \;\cong\; H_{\sigma(i)-1}/H_{\sigma(i)}$$
      pour tout $i$.

      (iii) C'est une reformulation de (ii).
    remarques:
      - |
        Le théorème dit qu'un groupe qui a une suite de composition se décompose en groupes simples d'une façon qui, comme la décomposition d'un entier en facteurs premiers, ne dépend pas du chemin suivi. Mais les facteurs ne suffisent pas à reconstituer le groupe, ni même l'ordre dans lequel ils apparaissent : le nœud {{jh-exemples|Exemples}} le montre sur $\mathbb Z/12\mathbb Z$, $\mathfrak S_4$, et sur deux groupes non isomorphes de mêmes facteurs.
      - |
        Pour un groupe fini, une autre démonstration procède par récurrence sur l'ordre. Si deux suites de composition commencent par $G \supset G_1$ et $G \supset H_1$ avec $G_1 \neq H_1$, le sous-groupe $G_1H_1$ est distingué ({{jh-isomorphismes|Isomorphismes, correspondance}}, (i)) et contient $G_1$. Il le contient strictement : sinon $H_1 \subset G_1 \subsetneq G$, et la maximalité de $H_1$ parmi les sous-groupes distingués distincts de $G$ ({{jh-composition|Suites de composition}}, (ii)) donnerait $H_1 = G_1$. La maximalité de $G_1$ donne alors $G_1H_1 = G$.

        Le deuxième théorème d'isomorphisme donne alors $G/G_1 \cong H_1/(G_1 \cap H_1)$ et $G/H_1 \cong G_1/(G_1 \cap H_1)$ ; on prolonge $G_1 \cap H_1$ par une suite de composition, et l'hypothèse de récurrence, appliquée à $G_1$ et à $H_1$, conclut. La démonstration par Schreier a l'avantage de valoir pour tout groupe qui a une suite de composition.
      - |
        C. Jordan a démontré en 1869 (*C. R. Acad. Sci. Paris* 68, p. 257-258), puis dans son *Traité des substitutions et des équations algébriques* (1870), que les indices successifs, c'est-à-dire les ordres des facteurs, ne dépendent pas de la suite. O. Hölder a montré en 1889 que les facteurs eux-mêmes sont isomorphes deux à deux (« Zurückführung einer beliebigen algebraischen Gleichung auf eine Kette von Gleichungen », *Math. Ann.* 34, p. 26-56).

  - id: jh-a5-simple
    etiquette: 𝔄₅ simple
    nature: théorème
    titre: Le groupe alterné 𝔄₅ est simple
    texte: |
      Pour cinq éléments distincts $a, b, c, d, f$ de $\{1, \dots, 5\}$, le **$5$-cycle** $(a\ b\ c\ d\ f)$ est la permutation qui envoie $a$ sur $b$, $b$ sur $c$, $c$ sur $d$, $d$ sur $f$ et $f$ sur $a$ ; la lettre $e$ reste réservée au neutre. Les produits se composent de droite à gauche, et le groupe alterné $\mathfrak A_5$, noyau de la signature sur $\lex{groupe-symetrique}{\mathfrak S_5}$, est d'ordre $60$ ({{gf-moins-de-60|Ordres < 60}}, (v)).

      On note
      $$\begin{aligned} Q_5 &= \{e, (1\ 2)(3\ 4), \\ &\qquad (1\ 3)(2\ 4), (1\ 4)(2\ 3)\}, \\ Q_4 &= \{e, (1\ 2)(3\ 5), \\ &\qquad (1\ 3)(2\ 5), (1\ 5)(2\ 3)\}. \end{aligned}$$
    enonce: |
      (i) $\mathfrak A_5$ contient les vingt $3$-cycles de $\mathfrak S_5$, qui sont d'ordre $3$, et les vingt-quatre $5$-cycles de $\mathfrak S_5$, qui sont d'ordre $5$.

      (ii) $Q_5$ et $Q_4$ sont deux $2$-sous-groupes de Sylow de $\mathfrak A_5$, et $Q_5 \cap Q_4 = \{e\}$.

      (iii) Le groupe $\mathfrak A_5$ est [[groupe-simple|simple]].
    preuve: |
      (i) Un $3$-cycle $(a\ b\ c)$ est déterminé par l'ensemble $\{a, b, c\}$ des points qu'il déplace et par l'image de $a$, à choisir entre les deux autres : il y en a $10 \times 2 = 20$, l'ensemble $\{1, \dots, 5\}$ ayant dix parties à trois éléments.

      Il s'écrit $(a\ c)(a\ b)$, en suivant les images, donc il est pair ({{v-permutations|Permutations, signature}}) ; son carré envoie $a$ sur $c$, et son cube est l'identité : il est d'ordre $3$ ({{gf-cycliques|Groupes cycliques}}, (i)).

      Un $5$-cycle s'écrit d'une seule façon sous la forme $(1\ b\ c\ d\ f)$, puisque $b, c, d, f$ sont les images successives de $1$ ; il y a autant de $5$-cycles que d'arrangements $(b, c, d, f)$ des éléments de $\{2, 3, 4, 5\}$, soit $4! = 24$ ({{gf-non-simples|Non-simplicité}}, (iii)).

      En suivant les images, on vérifie que
      $$(a\ b\ c\ d\ f) = (a\ f)(a\ d)(a\ c)(a\ b),$$
      produit de quatre transpositions, donc pair. Les puissances $\sigma^k$, $1 \leqslant k \leqslant 4$, d'un $5$-cycle $\sigma$ envoient $a$ sur $b, c, d, f$, et ne sont pas l'identité, tandis que $\sigma^5$ ramène chaque point à lui-même : $\sigma$ est d'ordre $5$.

      (ii) L'ensemble $Q_5$ est le sous-groupe formé de l'identité et des trois doubles transpositions de $\{1, 2, 3, 4\}$ ({{gs-sn|𝔖ₙ non résoluble}}, remarque), vu dans $\mathfrak S_5$ ; ses éléments sont pairs. Il a $4$ éléments, et $60 = 4 \times 15$ avec $15$ impair : c'est un $2$-Sylow de $\mathfrak A_5$.

      Soit $\tau = (4\ 5)$. Pour toute transposition $(a\ b)$ de $\mathfrak S_5$, on a $\tau(a\ b)\tau^{-1} = (\tau(a)\ \tau(b))$, comme on le voit en suivant les images : le conjugué envoie $\tau(a)$ sur $\tau(b)$, $\tau(b)$ sur $\tau(a)$, et fixe les autres points. Le conjugué d'un produit étant le produit des conjugués, $\tau Q_5\tau^{-1} = Q_4$. Comme $x \mapsto \tau x\tau^{-1}$ est un automorphisme de $\mathfrak S_5$ qui conserve la signature, $Q_4$ est un sous-groupe de $\mathfrak A_5$ à quatre éléments, donc un $2$-Sylow.

      Les éléments de $Q_5$ autres que $e$ fixent $5$, et ceux de $Q_4$ déplacent $5$ : $Q_5 \cap Q_4 = \{e\}$.

      (iii) Le groupe $\mathfrak A_5$ n'est pas réduit au neutre. Soit $N$ un sous-groupe distingué de $\mathfrak A_5$ distinct de $\{e\}$ ; son ordre divise $60$ ({{gs-lagrange|Lagrange}}), et les diviseurs de $60$ sont $1, 2, 3, 4, 5, 6, 10, 12, 15, 20, 30, 60$.

      *Si $3$ divise $|N|$.* Le théorème de Cauchy ({{gs-cauchy|Cauchy}}) fournit $x \in N$ d'ordre $3$ ; comme $60 = 3 \times 20$ et que $3 \nmid 20$, $P = \langle x \rangle$ est un $3$-Sylow de $\mathfrak A_5$, contenu dans $N$.

      Tout $3$-Sylow de $\mathfrak A_5$ s'écrit $gPg^{-1}$ ({{gf-sylow|Sylow}}, (ii)), et il est contenu dans $gNg^{-1} = N$. Chaque $3$-cycle engendre un sous-groupe d'ordre $3$, qui est un $3$-Sylow : $N$ contient les vingt $3$-cycles, et $|N| \geqslant 21$.

      *Si $5$ divise $|N|$.* Le même raisonnement, avec $60 = 5 \times 12$, montre que $N$ contient les vingt-quatre $5$-cycles, et $|N| \geqslant 25$.

      *Si ni $3$ ni $5$ ne divise $|N|$.* La liste des diviseurs donne $|N| \in \{2, 4\}$ : $N$ est un sous-groupe dont l'ordre est une puissance de $2$, contenu dans un $2$-Sylow $R$ ({{gf-sylow|Sylow}}, (ii)).

      Pour tout $g$, on a alors $N = gNg^{-1} \subset gRg^{-1}$ ; comme tout $2$-Sylow est de la forme $gRg^{-1}$ (même point), $N$ est contenu dans tous, en particulier dans $Q_5 \cap Q_4 = \{e\}$ par (ii) : c'est exclu.

      *Conclusion.* L'un des deux premiers cas a lieu, et $|N| \geqslant 21$ : $|N| \in \{30, 60\}$. Si $|N| = 30$, divisible par $3$ et par $5$, $N$ contiendrait l'identité, les vingt $3$-cycles et les vingt-quatre $5$-cycles, éléments distincts puisque d'ordres différents, soit $45 > 30$ éléments. Donc $N = \mathfrak A_5$.
    remarques:
      - |
        On démontre souvent ce théorème par les classes de conjugaison. Celles de $\mathfrak A_5$ ont $1$, $12$, $12$, $15$ et $20$ éléments, ce que confirme une énumération ; un sous-groupe distingué est réunion de classes contenant la classe $\{e\}$, et aucune somme $1 + \cdots$ de ces nombres, autre que $1$ et $60$, ne divise $60$.

        Cette démonstration demande de savoir que les vingt-quatre $5$-cycles se partagent en deux classes de douze dans $\mathfrak A_5$, ce que la preuve ci-dessus évite en ne comptant que des Sylow.
      - |
        Avec le nœud {{gf-moins-de-60|Ordres < 60}}, ce théorème achève la démonstration de l'affirmation de Galois citée en remarque de ce nœud : $60$ est le plus petit ordre d'un groupe simple qui n'est pas d'ordre premier. Restent admis ici l'unicité, à isomorphisme près, du groupe simple d'ordre $60$, et la simplicité de $\mathfrak A_n$ pour $n \geqslant 6$, dont la preuve usuelle montre qu'un sous-groupe distingué non trivial contient un $3$-cycle, puis tous, et que les $3$-cycles engendrent $\mathfrak A_n$.
      - |
        L'erreur la plus répandue est de croire que la simplicité de $\mathfrak A_5$ se transmet à $\mathfrak S_5$. Ce dernier n'est pas simple, puisque $\mathfrak A_5$ y est distingué d'indice $2$ ; le nœud {{jh-exemples|Exemples}} montre qu'il a pour facteurs de composition $\mathbb Z/2\mathbb Z$ et $\mathfrak A_5$.

  - id: jh-exemples
    etiquette: Exemples
    nature: proposition
    titre: Exemples de suites et de facteurs de composition
    texte: |
      Dans $\lex{anneau-zn}{\mathbb Z/n\mathbb Z}$, on note $\langle \bar k \rangle$ le sous-groupe engendré par $\bar k$. Dans $\lex{groupe-symetrique}{\mathfrak S_4}$, $V$ est formé de l'identité et des trois doubles transpositions, et $W = \{e, (1\ 2)(3\ 4)\}$ ; dans $\mathfrak S_3$, $\mathfrak A_3$ est formé de l'identité et des deux $3$-cycles.
    enonce: |
      (i) Le groupe $\mathbb Z/12\mathbb Z$ a exactement trois suites de composition,
      $$\begin{aligned} &\mathbb Z/12\mathbb Z \supset \langle \bar 2 \rangle \supset \langle \bar 4 \rangle \supset \{\bar 0\}, \\ &\mathbb Z/12\mathbb Z \supset \langle \bar 2 \rangle \supset \langle \bar 6 \rangle \supset \{\bar 0\}, \\ &\mathbb Z/12\mathbb Z \supset \langle \bar 3 \rangle \supset \langle \bar 6 \rangle \supset \{\bar 0\}, \end{aligned}$$
      dont les facteurs sont, dans l'ordre, isomorphes à $\mathbb Z/2\mathbb Z, \mathbb Z/2\mathbb Z, \mathbb Z/3\mathbb Z$, à $\mathbb Z/2\mathbb Z, \mathbb Z/3\mathbb Z, \mathbb Z/2\mathbb Z$, et à $\mathbb Z/3\mathbb Z, \mathbb Z/2\mathbb Z, \mathbb Z/2\mathbb Z$.

      (ii) La suite $\mathfrak S_4 \supset \mathfrak A_4 \supset V \supset W \supset \{e\}$ est une suite de composition, de facteurs isomorphes, dans l'ordre, à $\mathbb Z/2\mathbb Z$, $\mathbb Z/3\mathbb Z$, $\mathbb Z/2\mathbb Z$, $\mathbb Z/2\mathbb Z$. Toute suite de composition de $\mathfrak S_4$ commence par $\mathfrak S_4 \supset \mathfrak A_4 \supset V$, et il y en a exactement trois.

      (iii) La suite $\mathfrak S_5 \supset \mathfrak A_5 \supset \{e\}$ est une suite de composition, de facteurs $\mathbb Z/2\mathbb Z$ et $\mathfrak A_5$.

      (iv) Les groupes $\mathbb Z/4\mathbb Z$ et $(\mathbb Z/2\mathbb Z)^2$ ont tous deux pour facteurs de composition $\mathbb Z/2\mathbb Z$, $\mathbb Z/2\mathbb Z$ ; les groupes $\mathbb Z/6\mathbb Z$ et $\mathfrak S_3$ ont tous deux pour facteurs $\mathbb Z/2\mathbb Z$, $\mathbb Z/3\mathbb Z$. Ils ne sont pourtant pas isomorphes deux à deux.
    preuve: |
      Dans tous les cas, un facteur d'ordre premier $p$ est simple ({{jh-composition|Suites de composition}}, (i)) et cyclique, isomorphe à $\mathbb Z/p\mathbb Z$ ({{gf-cycliques|Groupes cycliques}}, (i) et (ii)). L'ordre d'un facteur se calcule par le théorème de Lagrange ({{gs-lagrange|Lagrange}}).

      (i) Les sous-groupes de $\mathbb Z/12\mathbb Z$ sont, pour chaque diviseur $d$ de $12$, l'unique sous-groupe $C_d$ d'ordre $d$ ({{gf-cycliques|Groupes cycliques}}, (iii)) ; il est engendré par $\overline{12/d}$, d'ordre $d$ par le même point. On a $C_d \subset C_{d'}$ si et seulement si $d \mid d'$ : le sens direct est le théorème de Lagrange, et, si $d \mid d'$, le groupe cyclique $C_{d'}$ a un sous-groupe d'ordre $d$, qui est $C_d$ par unicité.

      Tous ces sous-groupes sont distingués, le groupe étant abélien, et leurs quotients sont abéliens ; par {{jh-composition|Suites de composition}}, (i), un quotient $C_{d'}/C_d$ est simple si et seulement si son ordre $d'/d$ est premier.

      Les suites de composition correspondent donc aux suites de diviseurs $12 = d_0, d_1, \dots, d_r = 1$ dont chacun divise le précédent avec un quotient premier : ce sont $12, 6, 3, 1$ ; $12, 6, 2, 1$ ; et $12, 4, 2, 1$. Comme $C_6 = \langle \bar 2 \rangle$, $C_4 = \langle \bar 3 \rangle$, $C_3 = \langle \bar 4 \rangle$ et $C_2 = \langle \bar 6 \rangle$, ce sont les trois suites annoncées, de facteurs d'ordres $2, 2, 3$, puis $2, 3, 2$, puis $3, 2, 2$.

      (ii) *La suite.* Le groupe $\mathfrak A_4$, noyau de la signature, est distingué dans $\mathfrak S_4$, d'ordre $12$ ({{gf-alterne-4|Le groupe 𝔄₄}}, (i)). Le sous-groupe $V$ est distingué dans $\mathfrak S_4$ ({{gs-sn|𝔖ₙ non résoluble}}, remarque), et contenu dans $\mathfrak A_4$, donc distingué dans $\mathfrak A_4$. Le sous-groupe $W$ de $V$ y est distingué, $V$ étant abélien.

      Les ordres $24, 12, 4, 2, 1$ donnent des facteurs d'ordres $2, 3, 2, 2$, tous premiers.

      *Toutes les suites.* Soit $(G_i)$ une suite de composition de $\mathfrak S_4$. Par le théorème de Jordan-Hölder ({{jh-jordan-holder|Jordan-Hölder}}), ses facteurs sont, dans un certain ordre, d'ordres $2, 3, 2, 2$ ; en particulier $G_1$ est distingué d'indice $2$ ou $3$, donc d'ordre $12$ ou $8$.

      S'il était d'ordre $8$, le quotient $\mathfrak S_4/G_1$ serait d'ordre $3$, et tout élément $y$ de ce quotient vérifierait $y^3 = e$ ({{gf-cycliques|Groupes cycliques}}, (i)) : $\sigma^3 \in G_1$ pour tout $\sigma$. Chaque transposition $t$ vérifie $t = t^3$ : $G_1$ contiendrait les six transpositions, les huit $3$-cycles $(a\ b\ c) = (a\ c)(a\ b)$ et les trois doubles transpositions $(a\ b)(c\ d)$, soit avec l'identité dix-huit éléments au moins. Donc $|G_1| = 12$, et $G_1 = \mathfrak A_4$, seul sous-groupe d'ordre $12$ de $\mathfrak S_4$ ({{gf-alterne-4|Le groupe 𝔄₄}}, (i)).

      Le terme $G_2$ est d'indice $2$ ou $3$ dans $\mathfrak A_4$. L'ordre $6$ est exclu ({{gf-alterne-4|Le groupe 𝔄₄}}, (ii)) ; donc $|G_2| = 4$. Ses éléments ont un ordre qui divise $4$ ({{gf-cycliques|Groupes cycliques}}, (i)), donc il ne contient aucun $3$-cycle, et il est contenu dans $V$, qui a lui aussi quatre éléments : $G_2 = V$.

      Enfin $G_3$ est un sous-groupe d'ordre $2$ de $V$, c'est-à-dire $\{e, t\}$ pour l'une des trois doubles transpositions $t$, et $G_4 = \{e\}$. Réciproquement, chacun de ces trois choix donne une suite de composition, comme pour $W$.

      (iii) Le groupe $\mathfrak A_5$ est distingué d'indice $2$ dans $\mathfrak S_5$ ({{gf-moins-de-60|Ordres < 60}}, (v)) : le facteur $\mathfrak S_5/\mathfrak A_5$, d'ordre $2$, est simple, et le facteur $\mathfrak A_5/\{e\} \cong \mathfrak A_5$ l'est aussi ({{jh-a5-simple|𝔄₅ simple}}).

      (iv) Les suites $\mathbb Z/4\mathbb Z \supset \langle \bar 2 \rangle \supset \{\bar 0\}$ et $(\mathbb Z/2\mathbb Z)^2 \supset \mathbb Z/2\mathbb Z \times \{\bar 0\} \supset \{(\bar 0, \bar 0)\}$ ont des facteurs d'ordres $2$ et $2$. Les suites $\mathbb Z/6\mathbb Z \supset \langle \bar 2 \rangle \supset \{\bar 0\}$ et $\mathfrak S_3 \supset \mathfrak A_3 \supset \{e\}$, où $\mathfrak A_3$ est le noyau de la signature, ont des facteurs d'ordres $2$ et $3$.

      Le groupe $\mathbb Z/4\mathbb Z$ est cyclique, alors que tout élément $x$ de $(\mathbb Z/2\mathbb Z)^2$ vérifie $x + x = 0$, de sorte qu'aucun n'est d'ordre $4$ ; le groupe $\mathbb Z/6\mathbb Z$ est abélien, et $\mathfrak S_3$ ne l'est pas ({{a-groupe|Groupe}}, (ii)).
    remarques:
      - |
        Le treillis des sous-groupes de $\mathbb Z/12\mathbb Z$ fait voir les trois suites comme trois chemins de haut en bas.

        ```schema jh-exemples
        Les six sous-groupes de $\mathbb Z/12\mathbb Z$, et les trois chemins qui descendent de $\mathbb Z/12\mathbb Z$ à $\{0\}$ par des quotients d'ordre premier ; chaque trait porte le facteur correspondant. Les trois chemins, en rouge, bleu et vert, rencontrent les mêmes facteurs, deux fois $\mathbb Z/2$ et une fois $\mathbb Z/3$, dans trois ordres différents.
        ```

        Par le point (iv) du nœud {{jh-composition|Suites de composition}}, le produit des ordres des facteurs redonne l'ordre du groupe : $2 \times 2 \times 3 = 12$, et, pour $\mathfrak S_4$, $2 \times 3 \times 2 \times 2 = 24$.
      - |
        Le contraste entre (i) et (ii) est instructif. Dans $\mathbb Z/12\mathbb Z$, les trois facteurs apparaissent dans les trois ordres possibles ; dans $\mathfrak S_4$, les trois suites rencontrent les facteurs dans le même ordre, car le seul sous-groupe distingué d'indice premier de $\mathfrak S_4$ est $\mathfrak A_4$, puis $V$ est le seul sous-groupe distingué d'indice premier de $\mathfrak A_4$. Le théorème de Jordan-Hölder ne dit rien de l'ordre des facteurs, et l'ordre n'est en général pas libre.

        De même, $\mathbb Z/6\mathbb Z$ a deux suites de composition, de facteurs $\mathbb Z/2\mathbb Z, \mathbb Z/3\mathbb Z$ et $\mathbb Z/3\mathbb Z, \mathbb Z/2\mathbb Z$, tandis que $\mathfrak S_3$ n'en a qu'une, puisqu'il n'a pas de sous-groupe distingué d'ordre $2$ ({{a-distingue|Sous-groupe distingué}}, remarque).
      - |
        Le point (iv) montre que les facteurs de composition ne déterminent pas le groupe. Retrouver un groupe à partir de ses facteurs est le **problème des extensions** : connaissant $N$ et $G/N$, déterminer les groupes $G$ possibles. Le produit semi-direct ({{gf-produits|Produits semi-directs}}) en fournit une partie, $\mathfrak S_3 \cong \mathbb Z/3\mathbb Z \rtimes \mathbb Z/2\mathbb Z$, mais pas tout : $\mathbb Z/4\mathbb Z$ n'est produit semi-direct d'aucun couple de sous-groupes d'ordre $2$, puisqu'il n'en a qu'un.
      - |
        Le théorème de Jordan-Hölder redonne l'unicité de la décomposition d'un entier en facteurs premiers ({{z-premiers|Nombres premiers}}). Si $n = p_1 \cdots p_r$ est un produit de nombres premiers, les sous-groupes $G_k = \langle \overline{p_1 \cdots p_k} \rangle$ de $\mathbb Z/n\mathbb Z$, pour $0 \leqslant k \leqslant r$, sont d'ordres $n/(p_1 \cdots p_k)$ ({{gf-cycliques|Groupes cycliques}}, (iii)), et forment une suite de composition de facteurs $\mathbb Z/p_1\mathbb Z, \dots, \mathbb Z/p_r\mathbb Z$.

        Deux décompositions de $n$ donnent donc deux suites de composition, et le théorème dit que les nombres premiers qui y figurent sont les mêmes, avec les mêmes multiplicités, puisque $\mathbb Z/p\mathbb Z$ et $\mathbb Z/q\mathbb Z$ ne sont isomorphes que si $p = q$. Pour $n = 12 = 2 \cdot 2 \cdot 3 = 2 \cdot 3 \cdot 2 = 3 \cdot 2 \cdot 2$, on retrouve les trois suites de (i). Cette démonstration n'emploie pas l'unicité qu'elle redémontre : les théorèmes d'isomorphisme, de Schreier et de Jordan-Hölder ne font appel à aucune arithmétique, et les sous-groupes d'un groupe cyclique ne demandent que Bézout et le lemme de Gauss.

  - id: jh-resolubles
    etiquette: Résolubilité, facteurs
    nature: théorème
    titre: Résolubilité et facteurs de composition
    enonce: |
      (i) Un sous-groupe d'un [[groupe-resoluble|groupe résoluble]] est résoluble.

      (ii) Un groupe qui a une suite de composition est résoluble si et seulement si tous ses facteurs de composition sont cycliques d'ordre premier.

      (iii) Un groupe fini est résoluble si et seulement si tous ses facteurs de composition sont d'ordre premier. En particulier, un groupe fini simple est résoluble si et seulement s'il est d'ordre premier.
    preuve: |
      (i) Soit $G = G_0 \supset \cdots \supset G_r = \{e\}$ une suite de résolubilité de $G$ ({{gs-resolubles|Groupes résolubles}}), $H$ un sous-groupe, et $H_i = H \cap G_i$. Pour $h \in H_{i-1}$ et $x \in H_i$, on a $hxh^{-1} \in H$, et $hxh^{-1} \in G_i$ puisque $G_i$ est distingué dans $G_{i-1}$ : $H_i$ est distingué dans $H_{i-1}$.

      Le deuxième théorème d'isomorphisme ({{jh-isomorphismes|Isomorphismes, correspondance}}, (ii)), appliqué dans le groupe $G_{i-1}$ au sous-groupe $H_{i-1}$ et au sous-groupe distingué $G_i$, donne, puisque $H_{i-1} \cap G_i = H \cap G_i = H_i$,
      $$H_{i-1}/H_i \;\cong\; H_{i-1}G_i/G_i,$$
      sous-groupe du groupe abélien $G_{i-1}/G_i$ (même nœud, (iii)), donc abélien. Ainsi $(H_i)$ est une suite de résolubilité de $H$.

      (ii) Une suite de composition dont les facteurs sont cycliques est une suite de résolubilité, ses facteurs étant abéliens.

      Réciproquement, soit $(G_i)_{0 \leqslant i \leqslant r}$ une suite de composition, et $(H_j)_{0 \leqslant j \leqslant s}$ une suite de résolubilité de $G$, qui est une suite normale à facteurs abéliens. Si $G$ est trivial, il n'a aucun facteur de composition, et il n'y a rien à démontrer ; sinon $r, s \geqslant 1$, et, par le théorème de Schreier ({{jh-schreier|Raffinement de Schreier}}), elles ont des raffinements équivalents $(K_k)$ et $(L_k)$.

      *Les facteurs de $(L_k)$ sont abéliens.* Soit $L_{k-1} \supset L_k$ deux termes consécutifs, compris entre $H_{j-1}$ et $H_j$. Comme $H_j$ est distingué dans $H_{j-1}$, il l'est dans $L_k$ et dans $L_{k-1}$. Par la correspondance ({{jh-isomorphismes|Isomorphismes, correspondance}}, (iii)), $L_{k-1}/H_j$ est un sous-groupe du groupe abélien $H_{j-1}/H_j$, donc abélien, et $L_k/H_j$ y est distingué.

      Le troisième théorème d'isomorphisme (même nœud, (iv)), appliqué dans $L_{k-1}$, donne
      $$L_{k-1}/L_k \;\cong\; (L_{k-1}/H_j)/(L_k/H_j),$$
      quotient d'un groupe abélien, abélien comme lui.

      *Conclusion.* Les facteurs non triviaux de $(K_k)$ sont les $G_{i-1}/G_i$ ({{jh-jordan-holder|Jordan-Hölder}}, (i)), et chacun est isomorphe à un facteur de $(L_k)$, donc abélien. Un groupe abélien simple est cyclique d'ordre premier ({{jh-composition|Suites de composition}}, (i)).

      (iii) Un groupe fini a une suite de composition (même nœud, (iii)), et un groupe d'ordre premier est cyclique ({{gf-cycliques|Groupes cycliques}}, (ii)). Enfin, dans une suite de composition d'un groupe simple $G$, le terme $G_1$ est distingué et distinct de $G$, puisque $G/G_1$ n'est pas trivial : il vaut $\{e\}$, et la seule suite de composition de $G$ est $G \supset \{e\}$, de facteur $G$.
    remarques:
      - |
        Le point (iii) redonne, par une autre voie, que $\mathfrak S_5$ n'est pas résoluble : il a pour facteur de composition $\mathfrak A_5$, d'ordre $60$ ({{jh-exemples|Exemples}}, (iii)). Le point (i) en déduit que $\mathfrak S_n$ ne l'est pas non plus pour $n \geqslant 5$, puisqu'il contient le sous-groupe des permutations qui fixent $6, \dots, n$, isomorphe à $\mathfrak S_5$.

        La démonstration du nœud {{gs-sn|𝔖ₙ non résoluble}}, par les commutateurs de $3$-cycles, se passait de la simplicité de $\mathfrak A_5$ ; celle-ci en dit davantage, puisqu'elle identifie l'obstacle.
      - |
        L'erreur la plus répandue est de confondre suite de résolubilité et suite de composition. Les facteurs de composition d'un groupe résoluble sont abéliens et simples, donc cycliques d'ordre premier ; une suite de résolubilité n'a que des facteurs abéliens. Ainsi $\mathfrak S_4 \supset \mathfrak A_4 \supset V \supset \{e\}$, où $V$ est formé de l'identité et des trois doubles transpositions, n'est pas une suite de composition, puisque son dernier facteur, $V$, est d'ordre $4$.

        Le théorème de Schreier et le point (i) du nœud {{jh-jordan-holder|Jordan-Hölder}} disent qu'on la raffine en une suite de composition ; ici, il suffit d'insérer un sous-groupe d'ordre $2$ de $V$, comme au nœud {{jh-exemples|Exemples}}, (ii).
      - |
        C'est sous cette forme que la résolubilité sert dans la théorie de Galois ({{gs-radicaux|Radicaux}}) : une suite de composition à facteurs cycliques d'ordre premier correspond à une tour d'extensions dont chaque étage, lorsque le corps de base contient les racines $p$-ièmes de l'unité, s'obtient en adjoignant une racine $p$-ième d'un élément.

