# Niveau 2 : structure interne du chapitre « Dérivabilité ».
# Toutes les fonctions sont définies sur une partie de ℝ et à valeurs réelles.
# Aucune exponentielle, aucun logarithme, aucune fonction trigonométrique : les exemples sont
# polynomiaux ou rationnels. Aucune démonstration n'emploie l'axiome du choix.

graphe: ar-deriv
titre: Dérivabilité
conteneur: ar-deriv

entrees:
  continuite: [de-limite]

noeuds:
  - id: de-limite
    etiquette: Limite en un point
    nature: proposition
    titre: Limite d'une fonction en un point
    texte: |
      Soit $D \subset \lex{ensemble-reels}{\mathbb R}$ et $a \in \mathbb R$ un point **adhérent** à $D$ : pour tout $\delta > 0$, il existe $x \in D$ tel que $|x - a| < \delta$. Une fonction $g : D \to \mathbb R$ admet la [[limite-fonction|limite]] $\ell \in \mathbb R$ en $a$ si
      $$\begin{aligned} &\forall \varepsilon > 0,\ \exists \delta > 0,\ \forall x \in D, \\ &\qquad |x - a| < \delta \ \Longrightarrow\ |g(x) - \ell| < \varepsilon. \end{aligned}$$
      On écrit alors $g(x) \to \ell$ quand $x \to a$, $x \in D$. Le point $a$ peut appartenir à $D$ ou non ; pour la dérivée, on prendra $D = I \setminus \{a\}$, où le quotient qui nous intéresse n'est pas défini en $a$.
    enonce: |
      Soit $g, k : D \to \mathbb R$ et $a$ adhérent à $D$.

      (i) *Unicité.* Si $g$ admet une limite en $a$, celle-ci est unique ; on la note $\lim_{x \to a} g(x)$.

      (ii) *Continuité.* Si $a \in D$, la fonction $g$ admet une limite en $a$ si et seulement si elle est [[continuite-point|continue en $a$]], et cette limite est alors $g(a)$. Si $a \notin D$, la fonction $g$ admet la limite $\ell$ en $a$ si et seulement si son prolongement $\tilde g$ à $D \cup \{a\}$, défini par $\tilde g(a) = \ell$, est continu en $a$.

      (iii) *Caractère local.* Soit $D' \subset D$ tel que $a$ soit adhérent à $D'$. Si $g(x) \to \ell$ quand $x \to a$ dans $D$, il en est de même dans $D'$. Réciproquement, pour tout $r > 0$, la limite de $g$ en $a$ dans $D$ existe et vaut $\ell$ dès qu'elle existe et vaut $\ell$ dans $D \cap \,]a - r, a + r[$.

      (iv) *Opérations.* Si $g \to \ell$ et $k \to m$ en $a$, alors $g + k \to \ell + m$ et $gk \to \ell m$. Si de plus $k$ ne s'annule pas sur $D$ et $m \neq 0$, alors $1/k \to 1/m$.

      (v) *Composition.* Si $g \to \ell$ en $a$, si $g(D) \subset E$ avec $\ell \in E$, et si $h : E \to \mathbb R$ est continue en $\ell$, alors $h \circ g \to h(\ell)$ en $a$.

      (vi) *Passage à la limite dans les inégalités.* Si $g \to \ell$, $k \to m$ en $a$ et $g(x) \leqslant k(x)$ pour tout $x \in D$, alors $\ell \leqslant m$.
    preuve: |
      (i) Supposons que $\ell$ et $\ell'$ conviennent, avec $\ell \neq \ell'$, et prenons $\varepsilon = |\ell - \ell'|/2$. Il existe $\delta, \delta' > 0$ associés à $\varepsilon$ pour $\ell$ et pour $\ell'$ ; comme $a$ est adhérent à $D$, il existe $x \in D$ tel que $|x - a| < \min(\delta, \delta')$, et alors
      $$\begin{aligned} |\ell - \ell'| &\leqslant |\ell - g(x)| + |g(x) - \ell'| \\ &< 2\varepsilon = |\ell - \ell'|, \end{aligned}$$
      ce qui est absurde.

      (ii) Si $a \in D$ et $g \to \ell$, l'inégalité $|g(a) - \ell| < \varepsilon$, obtenue avec $x = a$ pour tout $\varepsilon > 0$, force $\ell = g(a)$, et la définition de la limite devient celle de la continuité en $a$. Si $a \notin D$, la condition de continuité de $\tilde g$ en $a$ ne diffère de celle de la limite que par le point $x = a$, pour lequel $|\tilde g(a) - \ell| = 0 < \varepsilon$ est automatique.

      (iii) Le premier point est immédiat, puisque la condition porte sur moins de points. Pour le second, si $\delta$ convient pour $\varepsilon$ dans $D \cap \,]a - r, a + r[$, alors $\min(\delta, r)$ convient dans $D$.

      (iv) Soit $\varepsilon > 0$. Pour la somme, on prend $\delta$ tel que $|g(x) - \ell| < \varepsilon/2$ et $|k(x) - m| < \varepsilon/2$ pour $|x - a| < \delta$. Pour le produit, on écrit
      $$\begin{aligned} g(x)k(x) - \ell m &= g(x)\big(k(x) - m\big) \\ &\quad + m\big(g(x) - \ell\big). \end{aligned}$$
      Pour $|x - a|$ assez petit, $|g(x) - \ell| < 1$, donc $|g(x)| \leqslant |\ell| + 1$ ; si de plus $|k(x) - m| < \varepsilon / (2|\ell| + 2)$ et $|g(x) - \ell| < \varepsilon/(2|m| + 2)$, le produit est à moins de $\varepsilon$ de $\ell m$.

      Pour l'inverse, on a $|k(x)| \geqslant |m|/2$ dès que $|k(x) - m| < |m|/2$, et alors
      $$\begin{aligned} \left| \frac1{k(x)} - \frac1m \right| &= \frac{|k(x) - m|}{|k(x)|\,|m|} \\ &\leqslant \frac{2\,|k(x) - m|}{m^2}, \end{aligned}$$
      qui est inférieur à $\varepsilon$ dès que $|k(x) - m| < \varepsilon m^2/2$.

      (v) Soit $\varepsilon > 0$. La continuité de $h$ en $\ell$ fournit $\eta > 0$ tel que $|y - \ell| < \eta$ entraîne $|h(y) - h(\ell)| < \varepsilon$ pour $y \in E$ ; la limite de $g$ fournit $\delta > 0$ tel que $|x - a| < \delta$ entraîne $|g(x) - \ell| < \eta$. Pour un tel $x$, $|h(g(x)) - h(\ell)| < \varepsilon$.

      (vi) Par (iv), $k - g \to m - \ell$. Si l'on avait $\ell - m > 0$, en prenant $\varepsilon = \ell - m$, on trouverait, $a$ étant adhérent à $D$, un $x \in D$ tel que $k(x) - g(x) < (m - \ell) + \varepsilon = 0$, contrairement à l'hypothèse.
    remarques:
      - |
        Avec (ii) et (iv), sommes et produits de fonctions continues en un point sont continus en ce point ; avec (v), il en va de même des composées. Comme $x \mapsto x$ et les constantes sont continues, toute fonction polynomiale est continue sur $\mathbb R$, et toute fonction rationnelle l'est là où son dénominateur ne s'annule pas.
      - |
        Toutes ces démonstrations sont menées avec des $\varepsilon$ et des $\delta$, sans suites. Ce n'est pas un détail : la caractérisation séquentielle de la limite exige, dans le sens réciproque, le choix dénombrable, comme celle de la continuité au nœud {{c-sequentielle|Caractérisation séquentielle}}. Aucun résultat de ce chapitre n'en a besoin.
      - |
        L'erreur la plus répandue, dans (vi), est de croire que des inégalités strictes passent à la limite. Sur $D = \,]0, 1]$, on a $0 < x$ pour tout $x$, mais la limite en $0$ des deux membres donne seulement $0 \leqslant 0$.

  - id: de-derivee
    etiquette: Dérivabilité en un point
    nature: définition
    titre: Dérivabilité en un point
    enonce: |
      Soit $I$ un [[intervalle]] de $\lex{ensemble-reels}{\mathbb R}$ non réduit à un point, $f : I \to \mathbb R$ et $a \in I$. Le **taux d'accroissement** de $f$ en $a$ est la fonction $\tau_a : I \setminus \{a\} \to \mathbb R$ définie par
      $$\tau_a(x) = \frac{f(x) - f(a)}{x - a}.$$
      La fonction $f$ est [[derivable]] en $a$ si $\tau_a$ admet une [[limite-fonction|limite]] finie en $a$ ; cette limite est le **nombre dérivé** $f'(a)$. Elle est **dérivable sur $I$** si elle l'est en tout point de $I$, et la fonction $f' : x \mapsto f'(x)$ est alors sa **dérivée**.

      ```schema de-derivee
      Pour $f(x) = x^2$ et $a = 1$, les sécantes qui joignent $(a, f(a))$ aux points $(x, f(x))$ ont pour pentes les taux d'accroissement $\tau_a(x) = x + a$, inscrits au bord : $3{,}6$, $3$ et $2{,}5$ pour $x = 2{,}6$, $2$ et $1{,}5$, et $1{,}3$ pour $x = 0{,}3$. Quand $x$ tend vers $a$, d'un côté comme de l'autre, elles tendent vers la tangente rouge, de pente $f'(1) = 2$.
      ```

      On définit de même la **dérivée à droite** $f'_d(a)$ et la **dérivée à gauche** $f'_g(a)$ comme les limites de $\tau_a$ en $a$ dans $I \cap \,]a, +\infty[$ et dans $I \cap \,]{-\infty}, a[$, lorsque ces ensembles ne sont pas vides.
    preuve: |
      Il faut s'assurer que la définition a un sens, c'est-à-dire que $a$ est adhérent à $I \setminus \{a\}$. Soit $b \in I$ distinct de $a$ et $\delta > 0$. Le point
      $$x = a + \min\Big(\frac\delta2, |b - a|\Big)\frac{b - a}{|b - a|}$$
      est situé entre $a$ et $b$, donc dans $I$ puisque $I$ est un intervalle ; il est distinct de $a$ et vérifie $|x - a| < \delta$. La limite, si elle existe, est alors unique ({{de-limite|Limite en un point}}, (i)).
    remarques:
      - |
        Trois exemples fixent les idées. Une fonction constante a un taux d'accroissement nul, donc une dérivée nulle, et $x \mapsto x$ a un taux constant égal à $1$. Pour $f(x) = x^2$, on a $\tau_a(x) = x + a$, qui tend vers $2a$ : $f'(a) = 2a$. Pour $f(x) = 1/x$ sur $]0, +\infty[$, on a $\tau_a(x) = -1/(xa)$, qui tend vers $-1/a^2$ par les opérations sur les limites.
      - |
        La fonction $x \mapsto |x|$ n'est pas dérivable en $0$ : son taux d'accroissement vaut $1$ à droite et $-1$ à gauche. Elle admet donc une dérivée à droite et une dérivée à gauche, mais elles diffèrent.

        En un point $a$ qui n'est pas une extrémité de $I$, $f$ est dérivable si et seulement si elle a des dérivées à droite et à gauche égales : si $\delta_d$ et $\delta_g$ conviennent pour un même $\varepsilon$ de chaque côté, leur minimum convient pour $I \setminus \{a\}$.

        ```schema de-derivee-2
        À gauche, le graphe de $x \mapsto |x|$ est formé de deux demi-droites de pentes $1$ et $-1$. À droite, le taux d'accroissement en $0$, $\tau_0(x) = |x|/x$, défini seulement pour $x \neq 0$, vaut $1$ à droite et $-1$ à gauche : ses limites de chaque côté existent mais diffèrent, de sorte qu'il n'a pas de limite en $0$.
        ```
      - |
        En une extrémité de $I$, la dérivée n'est qu'une dérivée d'un côté. C'est en ce sens que le {{ar-tfa|théorème fondamental de l'analyse}} affirme $F' = f$ sur tout l'intervalle, extrémités comprises, tandis que les théorèmes de Rolle et des accroissements finis ne demandent la dérivabilité que sur l'intervalle ouvert.

  - id: de-dl1
    etiquette: Développement à l'ordre 1
    nature: proposition
    titre: Développement limité à l'ordre 1 et continuité
    enonce: |
      Soit $f : I \to \lex{ensemble-reels}{\mathbb R}$, $a \in I$ et $\ell \in \mathbb R$. Les trois propriétés suivantes sont équivalentes :

      (i) $f$ est [[derivable]] en $a$ et $f'(a) = \ell$ ;

      (ii) *développement limité à l'ordre 1* : il existe une fonction $\varepsilon$, définie sur $\{h : a + h \in I\}$, continue en $0$ et nulle en $0$, telle que
      $$f(a + h) = f(a) + \ell h + h\, \varepsilon(h)$$
      pour tout $h$ tel que $a + h \in I$ ;

      (iii) *forme de Carathéodory* : il existe une fonction $\varphi : I \to \mathbb R$, continue en $a$, telle que $f(x) - f(a) = \varphi(x)(x - a)$ pour tout $x \in I$ et $\varphi(a) = \ell$.

      En particulier, une fonction dérivable en $a$ est [[continuite-point|continue en $a$]].
    preuve: |
      (i) ⇒ (iii). On pose $\varphi(x) = \tau_a(x)$ pour $x \neq a$ et $\varphi(a) = \ell$. L'égalité demandée est la définition du taux d'accroissement pour $x \neq a$, et elle est triviale pour $x = a$. Comme $\tau_a \to \ell$ en $a$, le prolongement $\varphi$ est continu en $a$ ({{de-limite|Limite en un point}}, (ii)).

      (iii) ⇒ (ii). On pose $\varepsilon(h) = \varphi(a + h) - \ell$, qui est nulle en $0$ et continue en $0$ comme composée de $h \mapsto a + h$, continue, et de $\varphi$, continue en $a$. Alors
      $$\begin{aligned} f(a + h) - f(a) &= \varphi(a + h)h \\ &= \ell h + h\,\varepsilon(h). \end{aligned}$$

      (ii) ⇒ (i). Pour $x \in I$ distinct de $a$, en posant $h = x - a$, on obtient $\tau_a(x) = \ell + \varepsilon(x - a)$. La fonction $x \mapsto \varepsilon(x - a)$ est continue en $a$ et nulle en $a$, donc tend vers $0$, et $\tau_a(x) \to \ell$.

      Enfin, sous (iii), $f(x) = f(a) + \varphi(x)(x - a)$ est continue en $a$ comme somme et produit de fonctions continues en $a$.
    remarques:
      - |
        La forme (ii) dit que la droite d'équation $y = f(a) + \ell(x - a)$ approche le graphe de $f$ mieux que toute autre près de $a$ : l'écart est négligeable devant $x - a$. C'est cette forme, et non le taux d'accroissement, qui se généralise aux fonctions de plusieurs variables : la {{gd-differentielle|différentielle}} remplace $h \mapsto \ell h$ par une application linéaire.
      - |
        La forme (iii) a l'avantage de ne contenir aucune division. C'est elle qui rend propres les démonstrations des règles de calcul, en particulier celle de la dérivée d'une composée, où diviser par $f(x) - f(a)$ serait illégitime.
      - |
        La réciproque de la dernière affirmation est fausse : $x \mapsto |x|$ est continue en $0$ sans y être dérivable. L'écart entre les deux notions est considérable, puisqu'il existe des fonctions continues sur $\mathbb R$ dérivables en aucun point ; on en construit avec des séries de fonctions, après la convergence uniforme.

  - id: de-operations
    etiquette: Opérations
    nature: proposition
    titre: Opérations sur les fonctions dérivables
    enonce: |
      Soit $f, g : I \to \lex{ensemble-reels}{\mathbb R}$ [[derivable|dérivables]] en $a \in I$ et $\lambda \in \mathbb R$.

      (i) $f + g$ et $\lambda f$ sont dérivables en $a$, de nombres dérivés $f'(a) + g'(a)$ et $\lambda f'(a)$.

      (ii) $fg$ est dérivable en $a$, et $(fg)'(a) = f'(a)g(a) + f(a)g'(a)$.

      (iii) Si $g$ ne s'annule pas sur $I$, alors $1/g$ et $f/g$ sont dérivables en $a$, et
      $$\Big(\frac1g\Big)'(a) = -\frac{g'(a)}{g(a)^2},$$
      $$\Big(\frac fg\Big)'(a) = \frac{f'(a)g(a) - f(a)g'(a)}{g(a)^2}.$$

      (iv) Pour $c \in \mathbb R$ et $n \geqslant 1$, la fonction $x \mapsto (x - c)^n$ est dérivable sur $\mathbb R$, de dérivée $x \mapsto n(x - c)^{n-1}$. Par suite, toute fonction polynomiale est dérivable sur $\mathbb R$, de dérivée polynomiale, et toute fonction rationnelle est dérivable sur tout intervalle où son dénominateur ne s'annule pas.
    preuve: |
      Écrivons, par la forme de Carathéodory ({{de-dl1|Développement à l'ordre 1}}, (iii)), $f(x) - f(a) = \varphi(x)(x - a)$ et $g(x) - g(a) = \psi(x)(x - a)$, avec $\varphi$ et $\psi$ continues en $a$, $\varphi(a) = f'(a)$ et $\psi(a) = g'(a)$. Dans chaque cas, on exhibe une fonction continue en $a$ qui joue le même rôle pour la fonction étudiée ; sa valeur en $a$ est le nombre dérivé cherché.

      (i) Les fonctions $\varphi + \psi$ et $\lambda \varphi$ conviennent.

      (ii) On a
      $$\begin{aligned} &f(x)g(x) - f(a)g(a) \\ &\quad = f(x)\big(g(x) - g(a)\big) \\ &\qquad + g(a)\big(f(x) - f(a)\big) \\ &\quad = \big(f(x)\psi(x) + g(a)\varphi(x)\big)(x - a). \end{aligned}$$
      La fonction entre parenthèses est continue en $a$, car $f$ l'est par {{de-dl1|Développement à l'ordre 1}}, et vaut $f(a)g'(a) + g(a)f'(a)$ en $a$.

      (iii) On a
      $$\begin{aligned} \frac1{g(x)} - \frac1{g(a)} &= -\frac{g(x) - g(a)}{g(x)g(a)} \\ &= -\frac{\psi(x)}{g(x)g(a)}\,(x - a), \end{aligned}$$
      et la fonction $x \mapsto -\psi(x)/(g(x)g(a))$ est continue en $a$ par les opérations sur les limites ({{de-limite|Limite en un point}}, (ii) et (iv)), puisque $g$ est continue en $a$ et ne s'annule pas ; elle vaut $-g'(a)/g(a)^2$ en $a$. Le quotient $f/g = f \cdot (1/g)$ relève alors de (ii).

      (iv) Par récurrence sur $n$. Pour $n = 1$, le taux d'accroissement de $x \mapsto x - c$ vaut constamment $1$. Si l'énoncé vaut pour $n$, (ii) appliqué au produit de $(x - c)^n$ par $x - c$ donne la dérivée
      $$\begin{aligned} &n(x - c)^{n-1}(x - c) + (x - c)^n \\ &\quad = (n + 1)(x - c)^n. \end{aligned}$$
      Une fonction polynomiale est une combinaison linéaire des $x \mapsto x^n$ et d'une constante : (i) conclut. Une fonction rationnelle est un quotient de deux polynômes : (iii) conclut.
    remarques:
      - |
        Pour $P = X^5 - 4X + 2$, on obtient $P' = 5X^4 - 4$, qui s'annule exactement en $\pm (4/5)^{1/4} \approx \pm 0{,}946$. C'est ce polynôme dérivé que la démonstration du théorème d'Abel-Ruffini exploite, au nœud {{gs-quintique|Le polynôme X⁵ − 4X + 2}}, pour compter les racines réelles de $P$.
      - |
        Pour $f(x) = \dfrac{x}{1 + x^2}$, dont le dénominateur ne s'annule jamais, la formule du quotient donne
        $$f'(x) = \frac{(1 + x^2) - x \cdot 2x}{(1 + x^2)^2} = \frac{1 - x^2}{(1 + x^2)^2}.$$
        La dérivée s'annule en $\pm 1$, et l'on verra au nœud {{de-extremum|Extremum local}} que ce sont bien les points où $f$ atteint son maximum $\frac12$ et son minimum $-\frac12$.
      - |
        L'erreur la plus répandue est d'écrire $(fg)' = f'g'$. L'exemple $f = g = (x \mapsto x)$ suffit à la réfuter : $(x^2)' = 2x$, et non $1$.

  - id: de-composee
    etiquette: Dérivée d'une composée
    nature: théorème
    titre: Dérivée d'une composée
    enonce: |
      Soit $I$ et $J$ deux [[intervalle|intervalles]] non réduits à un point, $f : I \to J$ [[derivable]] en $a \in I$ et $g : J \to \lex{ensemble-reels}{\mathbb R}$ dérivable en $f(a)$. Alors $g \circ f$ est dérivable en $a$ et
      $$(g \circ f)'(a) = g'\big(f(a)\big)\, f'(a).$$
    preuve: |
      Par la forme de Carathéodory ({{de-dl1|Développement à l'ordre 1}}, (iii)), il existe $\varphi : I \to \mathbb R$ continue en $a$ et $\psi : J \to \mathbb R$ continue en $b = f(a)$ telles que
      $$f(x) - b = \varphi(x)(x - a),$$
      $$g(y) - g(b) = \psi(y)(y - b),$$
      pour $x \in I$ et $y \in J$, avec $\varphi(a) = f'(a)$ et $\psi(b) = g'(b)$.
      En prenant $y = f(x)$, on obtient
      $$\begin{aligned} &g(f(x)) - g(f(a)) \\ &\quad = \psi(f(x))\,\big(f(x) - b\big) \\ &\quad = \psi(f(x))\,\varphi(x)\,(x - a). \end{aligned}$$
      La fonction $\psi \circ f$ est continue en $a$, car $f$ est continue en $a$ et $\psi$ en $f(a)$ ({{de-limite|Limite en un point}}, (v)) ; le produit $(\psi \circ f)\varphi$ l'est donc aussi, et vaut $g'(f(a))f'(a)$ en $a$. La forme de Carathéodory donne la conclusion.
    remarques:
      - |
        Pour $h(x) = (1 + x^2)^5$, on compose $f(x) = 1 + x^2$, de dérivée $2x$, et $g(y) = y^5$, de dérivée $5y^4$ :
        $$h'(x) = 5(1 + x^2)^4 \cdot 2x = 10x(1 + x^2)^4.$$
        On évite ainsi de développer un polynôme de degré $10$ ; le calcul direct, fait terme à terme, donne bien le même résultat.
      - |
        L'erreur la plus répandue est la démonstration naïve qui écrit
        $$\begin{aligned} &\frac{g(f(x)) - g(f(a))}{x - a} \\ &\quad = \frac{g(f(x)) - g(f(a))}{f(x) - f(a)} \cdot \frac{f(x) - f(a)}{x - a}. \end{aligned}$$
        Elle divise par $f(x) - f(a)$, qui peut s'annuler pour des $x$ arbitrairement proches de $a$. Ainsi la fonction égale à $x^2$ sur les rationnels et à $0$ sur les irrationnels est dérivable en $0$, de nombre dérivé nul puisque $|f(x)| \leqslant x^2$, et elle vaut $f(0)$ en tout irrationnel. La forme de Carathéodory contourne la difficulté sans distinguer de cas.
      - |
        En plusieurs variables, la même formule devient la règle de la chaîne pour les {{gd-differentielle|différentielles}} : la composée des approximations linéaires est l'approximation linéaire de la composée.

  - id: de-reciproque
    etiquette: Dérivée d'une réciproque
    nature: théorème
    titre: Dérivée d'une fonction réciproque
    enonce: |
      Soit $I$ un [[intervalle]] non réduit à un point, $f : I \to \lex{ensemble-reels}{\mathbb R}$ continue et strictement monotone, $J = f(I)$, $a \in I$ et $b = f(a)$.

      (i) Si $f$ est [[derivable]] en $a$ et $f'(a) \neq 0$, alors la [[bijection]] réciproque $f^{-1} : J \to I$ est dérivable en $b$, et
      $$(f^{-1})'(b) = \frac{1}{f'(a)} = \frac{1}{f'\big(f^{-1}(b)\big)}.$$

      (ii) Si $f$ est dérivable en $a$ et $f'(a) = 0$, alors $f^{-1}$ n'est pas dérivable en $b$.
    preuve: |
      Par le théorème de la bijection ({{c-bijection|Bijection continue}}), $J$ est un intervalle, $f$ est une bijection de $I$ sur $J$, et $f^{-1}$ est continue sur $J$. L'intervalle $J$ n'est pas réduit à un point, puisque $f$ est injective et que $I$ en a au moins deux.

      (i) Soit $\varphi : I \to \mathbb R$ continue en $a$, avec $f(x) - f(a) = \varphi(x)(x - a)$ et $\varphi(a) = f'(a)$ ({{de-dl1|Développement à l'ordre 1}}, (iii)). Pour $x \neq a$, on a $f(x) \neq f(a)$ par injectivité, donc $\varphi(x) \neq 0$ ; et $\varphi(a) = f'(a) \neq 0$. Pour $y \in J$, appliquons l'égalité à $x = f^{-1}(y)$ :
      $$y - b = \varphi\big(f^{-1}(y)\big)\,\big(f^{-1}(y) - f^{-1}(b)\big),$$
      d'où
      $$f^{-1}(y) - f^{-1}(b) = \frac{1}{\varphi(f^{-1}(y))}\,(y - b).$$
      La fonction $y \mapsto \varphi(f^{-1}(y))$ est continue en $b$, comme composée de $f^{-1}$, continue en $b$, et de $\varphi$, continue en $f^{-1}(b) = a$ ; elle ne s'annule pas, donc son inverse est continu en $b$ ({{de-limite|Limite en un point}}, (iv) et (v)), et vaut $1/f'(a)$ en $b$. La forme de Carathéodory conclut.

      (ii) Si $f^{-1}$ était dérivable en $b$, la dérivée d'une composée ({{de-composee|Dérivée d'une composée}}), appliquée à $f^{-1} \circ f = \mathrm{id}_I$, donnerait $1 = (f^{-1})'(b)\, f'(a) = 0$.
    remarques:
      - |
        La fonction $f(x) = x^3$ est continue et strictement croissante sur $\mathbb R$, et $f(\mathbb R) = \mathbb R$. Sa réciproque est la racine cubique. Comme $f'(x) = 3x^2$, elle est dérivable en tout $y \neq 0$, de nombre dérivé $\dfrac{1}{3(\sqrt[3]{y})^2}$, par exemple $\frac1{12}$ en $y = 8$ ; mais elle n'est pas dérivable en $0$, puisque $f'(0) = 0$.

        Géométriquement, la tangente horizontale du graphe de $x^3$ à l'origine devient, par symétrie par rapport à la première bissectrice, la tangente verticale du graphe de la racine cubique.

        ```schema de-reciproque
        Le graphe de $f(x) = x^3$, en bleu, et celui de sa réciproque, en vert, sont symétriques par rapport à la droite $y = x$. La symétrie échange les deux coordonnées et change donc une pente $p$ en $1/p$ : au point d'abscisse $a = 2/\sqrt3$, où $f'(a) = 4$, répond le point symétrique, où la pente vaut $\frac14$ ; à l'origine, la tangente horizontale de $f$ devient la tangente verticale de $f^{-1}$.
        ```
      - |
        L'erreur la plus répandue est d'oublier que la formule porte sur deux points différents : $(f^{-1})'(b)$ se calcule avec $f'$ au point $f^{-1}(b)$, et non au point $b$. Pour la racine cubique en $8$, il faut $f'(2) = 12$, et non $f'(8) = 192$.
      - |
        C'est ce théorème qui donnera la dérivée du logarithme, réciproque de l'exponentielle, et celles des réciproques des fonctions trigonométriques, une fois ces fonctions construites en analyse complexe.

  - id: de-extremum
    etiquette: Extremum local
    nature: proposition
    titre: Extremum local et dérivée nulle
    texte: |
      Soit $f : I \to \lex{ensemble-reels}{\mathbb R}$ et $a \in I$. On dit que $f$ admet un **maximum local** en $a$ s'il existe $r > 0$ tel que $f(x) \leqslant f(a)$ pour tout $x \in I$ vérifiant $|x - a| < r$, et un **minimum local** si l'inégalité inverse est vraie ; un [[extremum-local]] est un maximum local ou un minimum local.
    enonce: |
      Soit $I$ un [[intervalle]], $f : I \to \mathbb R$ et $a$ un point de $I$ qui n'en est pas une extrémité. Si $f$ admet un extremum local en $a$ et si $f$ est [[derivable]] en $a$, alors $f'(a) = 0$.
    preuve: |
      Quitte à remplacer $f$ par $-f$, supposons que $f$ admette un maximum local en $a$, avec un rayon $r$. Comme $a$ n'est pas une extrémité de $I$, les ensembles $D_+ = I \cap \,]a, a + r[$ et $D_- = I \cap \,]a - r, a[$ sont des intervalles non vides dont $a$ est adhérent. Pour $x \in D_+$, on a $f(x) - f(a) \leqslant 0$ et $x - a > 0$, donc $\tau_a(x) \leqslant 0$ ; pour $x \in D_-$, on a $\tau_a(x) \geqslant 0$.

      Le taux $\tau_a$ tend vers $f'(a)$ dans $I \setminus \{a\}$, donc aussi dans $D_+$ et dans $D_-$ ({{de-limite|Limite en un point}}, (iii)). Le passage à la limite dans les inégalités (même nœud, (vi)) donne $f'(a) \leqslant 0$ et $f'(a) \geqslant 0$, d'où $f'(a) = 0$.
    remarques:
      - |
        L'hypothèse que $a$ n'est pas une extrémité est indispensable. La fonction $x \mapsto x$ sur $[0, 1]$ atteint son maximum en $1$, où sa dérivée, à gauche, vaut $1$ : seul un côté du taux est disponible, et il ne fournit qu'une inégalité.
      - |
        La réciproque est fausse, et c'est le piège le plus répandu : $f(x) = x^3$ vérifie $f'(0) = 0$ sans avoir d'extremum local en $0$, puisque $f$ prend des valeurs négatives à gauche et positives à droite. Un zéro de la dérivée n'est qu'un **candidat** ; il faut ensuite étudier le signe de $f'$ autour de lui, ce que permettra le nœud {{de-monotonie|Signe de la dérivée}}.

        ```schema de-extremum
        À gauche, $f(x) = \frac{x}{1 + x^2}$ atteint son maximum $\frac12$ en $1$ et son minimum $-\frac12$ en $-1$, avec des tangentes horizontales. À droite, $x \mapsto x^3$ a aussi une tangente horizontale en $0$, mais les taux d'accroissement en $0$, pentes des cordes issues de l'origine, sont positifs des deux côtés : la fonction traverse sa tangente et n'a pas d'extremum en $0$.
        ```
      - |
        Pour $f(x) = \dfrac{x}{1 + x^2}$, la dérivée $\dfrac{1 - x^2}{(1 + x^2)^2}$ ne s'annule qu'en $\pm 1$. Ce sont bien des extremums, et même globaux :
        $$\frac12 - f(x) = \frac{(x - 1)^2}{2(1 + x^2)} \geqslant 0$$
        et
        $$f(x) + \frac12 = \frac{(x + 1)^2}{2(1 + x^2)} \geqslant 0.$$

  - id: de-rolle
    etiquette: Rolle
    nature: théorème
    titre: Théorème de Rolle
    enonce: |
      **Théorème de Rolle.** Soit $f : [a,b] \to \lex{ensemble-reels}{\mathbb R}$ continue, dérivable sur $]a,b[$, avec $f(a) = f(b)$ et $a < b$. Il existe $c \in \,]a,b[$ tel que $f'(c) = 0$.
    preuve: |
      Par le théorème des bornes atteintes, $f$ admet un minimum $m$ et un maximum $M$ sur $[a,b]$. Si $m = M$, $f$ est constante et tout $c$ convient. Sinon, l'une des deux valeurs diffère de $f(a) = f(b)$ ; supposons que ce soit $M$, atteint en un point $c$ nécessairement intérieur.

      En ce point intérieur, $f$ atteint son maximum, a fortiori un maximum local, et elle y est dérivable : la proposition {{de-extremum|Extremum local}} donne $f'(c) = 0$. Le schéma ci-dessous en rappelle le mécanisme : les taux d'accroissement en $c$ sont $\leqslant 0$ à droite et $\geqslant 0$ à gauche. Le cas où $m$ diffère de $f(a)$ est symétrique.

      ```schema ar-deriv
      Pour $f(x) = x(x-3)^2$ sur $[0, 3]$, le maximum $M = 4$ est atteint en $c = 1$. Les cordes issues de $(c, f(c))$ descendent vers la droite et montent depuis la gauche : leurs pentes, les taux d'accroissement, sont $\leqslant 0$ à droite et $\geqslant 0$ à gauche, de sorte que la tangente, leur limite commune, est horizontale.
      ```
    remarques:
      - |
        Le second paragraphe de la démonstration est exactement l'argument du nœud {{de-extremum|Extremum local}}, appliqué au point $c$, qui est intérieur à $[a, b]$ et où $f$ atteint son maximum. Le théorème des bornes atteintes ({{c-bornes|Bornes atteintes}}) fournit ce point : c'est lui, et donc la propriété de la borne supérieure, qui fait tout le travail.
      - |
        La continuité aux extrémités ne peut pas être omise. La fonction égale à $x$ sur $[0, 1[$ et à $0$ en $1$ est dérivable sur $]0, 1[$, de dérivée $1$, et vérifie $f(0) = f(1) = 0$ ; elle n'est pas continue en $1$, et sa dérivée ne s'annule jamais.
      - |
        Le théorème sert souvent à compter des racines. Si $f$ est dérivable sur un intervalle et si $f'$ y a au plus $k$ zéros, alors $f$ y a au plus $k + 1$ zéros : entre deux zéros consécutifs de $f$ se trouve un zéro de $f'$.

        Pour $P = X^5 - 4X + 2$, le polynôme dérivé $5X^4 - 4$ a deux racines réelles, donc $P$ en a au plus trois ; comme $P(-2) = -22$, $P(0) = 2$, $P(1) = -1$ et $P(2) = 26$, les valeurs intermédiaires en donnent trois, voisines de $-1{,}519$, $0{,}508$ et $1{,}244$. C'est l'argument du nœud {{gs-quintique|Le polynôme X⁵ − 4X + 2}}.

  - id: de-taf
    etiquette: Égalité des accroissements finis
    nature: théorème
    titre: Égalité des accroissements finis
    enonce: |
      Soit $a < b$ et $f : [a, b] \to \lex{ensemble-reels}{\mathbb R}$ continue sur $[a, b]$ et [[derivable]] sur $]a, b[$. Il existe $c \in \,]a, b[$ tel que
      $$f(b) - f(a) = f'(c)\,(b - a).$$
    preuve: |
      La fonction
      $$\begin{aligned} g(x) &= f(x) - f(a) \\ &\quad - \frac{f(b) - f(a)}{b - a}\,(x - a) \end{aligned}$$
      est continue sur $[a, b]$ et dérivable sur $]a, b[$, de dérivée
      $$g'(x) = f'(x) - \frac{f(b) - f(a)}{b - a},$$
      par les opérations sur les fonctions dérivables ({{de-operations|Opérations}}). On a $g(a) = g(b) = 0$. Le théorème de Rolle ({{de-rolle|Rolle}}) fournit $c \in \,]a, b[$ tel que $g'(c) = 0$, ce qui est l'égalité annoncée.
    remarques:
      - |
        Géométriquement, il existe un point où la tangente est parallèle à la corde qui joint $(a, f(a))$ à $(b, f(b))$ ; cinématiquement, un mobile dont la vitesse moyenne vaut $v$ sur une durée passe au moins une fois par la vitesse instantanée $v$. La fonction $g$ de la démonstration est l'écart vertical entre le graphe et la corde.

        ```schema de-taf
        Pour $f(x) = x(x - 3)^2$ sur $[0, 4]$, la corde, en bleu, joint $(0, 0)$ à $(4, 4)$ et a pour pente $1$. Les deux points rouges sont ceux où la tangente a la même pente : $f'(c) = 3c^2 - 12c + 9 = 1$ donne $c = 2 \pm \frac{2}{\sqrt3}$, soit environ $0{,}845$ et $3{,}155$.
        ```
      - |
        Le point $c$ n'est pas unique, et l'on ne sait en général rien de plus sur lui que $a < c < b$. L'erreur la plus répandue est de lui attribuer une valeur particulière, par exemple le milieu de $[a, b]$ : sur l'exemple ci-dessus, le milieu $2$ donne $f'(2) = -3$, qui n'a rien à voir avec la pente $1$ de la corde. Le théorème n'est utile que par les **encadrements** de $f'(c)$ qu'il permet, ce que fait le nœud suivant.
      - |
        L'égalité est propre aux fonctions à valeurs réelles. Pour une fonction à valeurs dans $\mathbb R^2$, chaque coordonnée a son propre point $c$, et seule l'inégalité subsiste : c'est le point (ii) du nœud {{gd-accroissements|Accroissements finis}} du calcul différentiel.

  - id: de-iaf
    etiquette: Inégalité des accroissements finis
    nature: corollaire
    titre: Inégalité des accroissements finis
    enonce: |
      Soit $a < b$ et $f : [a, b] \to \lex{ensemble-reels}{\mathbb R}$ continue sur $[a, b]$ et [[derivable]] sur $]a, b[$.

      (i) Si $m \leqslant f'(x) \leqslant M$ pour tout $x \in \,]a, b[$, alors $m(b - a) \leqslant f(b) - f(a) \leqslant M(b - a)$.

      ```schema de-iaf
      Pour $f(x) = x^3/3$ sur $[1, 2]$, on a $1 \leqslant f'(x) = x^2 \leqslant 4$. Appliqué sur chaque segment $[1, x]$, le point (i) enferme le graphe dans le secteur gris limité par les droites issues de $(a, f(a))$ de pentes $m = 1$ et $M = 4$ ; en $b = 2$, la valeur $f(b) = \frac83$ se trouve sur le segment rouge, qui va de $f(a) + m(b - a) = \frac43$ à $f(a) + M(b - a) = \frac{13}3$.
      ```

      (ii) Soit $I$ un [[intervalle]] et $f : I \to \mathbb R$ continue sur $I$ et dérivable en tout point de $I$ qui n'en est pas une extrémité. Si $|f'| \leqslant k$ en ces points, alors $|f(y) - f(x)| \leqslant k\,|y - x|$ pour tous $x, y \in I$ : $f$ est $k$-lipschitzienne.
    preuve: |
      (i) Par l'égalité des accroissements finis ({{de-taf|Égalité des accroissements finis}}), $f(b) - f(a) = f'(c)(b - a)$ pour un $c \in \,]a, b[$, et l'on multiplie l'encadrement $m \leqslant f'(c) \leqslant M$ par $b - a > 0$.

      (ii) Soit $x < y$ dans $I$. Le segment $[x, y]$ est contenu dans $I$, et tout point de $]x, y[$ est un point de $I$ qui n'en est pas une extrémité. On applique (i) sur $[x, y]$ avec $m = -k$ et $M = k$.
    remarques:
      - |
        Pour $f(x) = x^3$ sur $[1;\ 1{,}1]$, on a $3 \leqslant f'(x) = 3x^2 \leqslant 3{,}63$, donc $0{,}3 \leqslant 1{,}1^3 - 1 \leqslant 0{,}363$. La vraie valeur, $0{,}331$, est bien dans cet intervalle. On encadre ainsi une variation sans la calculer, ce qui est l'usage même du théorème : il transforme une information sur la dérivée en une information sur la fonction.
      - |
        Une fonction lipschitzienne est [[continuite-uniforme|uniformément continue]] : $\delta = \varepsilon / k$ convient en tout point. Ainsi $1/x$ est $1$-lipschitzienne sur $[1, +\infty[$, où $|f'(x)| = 1/x^2 \leqslant 1$, alors qu'elle ne l'est sur aucun intervalle $]0, r]$ : son taux d'accroissement entre $x$ et $y$ vaut $-1/(xy)$, qui n'y est pas borné.
      - |
        C'est cette inégalité, et non l'égalité, qui se généralise aux fonctions de plusieurs variables et aux fonctions à valeurs vectorielles, au nœud {{gd-accroissements|Accroissements finis}}.

  - id: de-monotonie
    etiquette: Signe de la dérivée
    nature: théorème
    titre: Signe de la dérivée et monotonie
    enonce: |
      Soit $I$ un [[intervalle]] non réduit à un point, et $f : I \to \lex{ensemble-reels}{\mathbb R}$ continue sur $I$ et [[derivable]] en tout point de l'ensemble $I^\circ$ des points de $I$ qui n'en sont pas des extrémités.

      (i) $f$ est croissante sur $I$ si et seulement si $f'(x) \geqslant 0$ pour tout $x \in I^\circ$.

      (ii) $f$ est constante sur $I$ si et seulement si $f'(x) = 0$ pour tout $x \in I^\circ$.

      (iii) Si $f'(x) > 0$ pour tout $x \in I^\circ$, alors $f$ est strictement croissante sur $I$.

      (iv) Plus précisément, $f$ est strictement croissante sur $I$ si et seulement si $f' \geqslant 0$ sur $I^\circ$ et s'il n'existe aucun intervalle ouvert non vide, contenu dans $I$, sur lequel $f'$ soit identiquement nulle.

      Les énoncés pour les fonctions décroissantes s'obtiennent en remplaçant $f$ par $-f$.
    preuve: |
      (i) Si $f$ est croissante et $x \in I^\circ$, le taux d'accroissement $\tau_x(y) = \frac{f(y) - f(x)}{y - x}$ est $\geqslant 0$ pour tout $y \neq x$ de $I$, le numérateur et le dénominateur ayant le même signe ; par passage à la limite ({{de-limite|Limite en un point}}, (vi)), $f'(x) \geqslant 0$.

      Réciproquement, si $f' \geqslant 0$ sur $I^\circ$ et $x < y$ dans $I$, on a $]x, y[\, \subset I^\circ$, et l'égalité des accroissements finis ({{de-taf|Égalité des accroissements finis}}) fournit $c \in \,]x, y[$ tel que $f(y) - f(x) = f'(c)(y - x) \geqslant 0$.

      (ii) On applique (i) à $f$ et à $-f$ : $f$ est à la fois croissante et décroissante, donc constante. La réciproque vient de ce qu'un taux d'accroissement d'une fonction constante est nul.

      (iii) Dans la réciproque de (i), on obtient cette fois $f(y) - f(x) = f'(c)(y - x) > 0$.

      (iv) Si $f$ est strictement croissante, elle est croissante, donc $f' \geqslant 0$ par (i) ; et si $f'$ était nulle sur un intervalle ouvert $]x, y[$ non vide, contenu dans $I^\circ$, $f$ serait constante sur $[x, y]$ par (ii), appliqué à la restriction de $f$ à $[x, y]$, ce qui contredit la stricte croissance.

      Réciproquement, supposons ces deux conditions. Par (i), $f$ est croissante. Si l'on avait $f(x) = f(y)$ avec $x < y$, la croissance donnerait $f(x) \leqslant f(t) \leqslant f(y) = f(x)$ pour tout $t \in [x, y]$, donc $f$ serait constante sur $[x, y]$.

      En tout $t \in \,]x, y[$, le taux d'accroissement de $f$ est nul sur $]x, y[ \setminus \{t\}$, qui est de la forme $I \cap \,]t - r, t + r[ \setminus \{t\}$ pour $r$ assez petit ; par le caractère local des limites ({{de-limite|Limite en un point}}, (iii)), $f'(t) = 0$. Ainsi $f'$ serait identiquement nulle sur $]x, y[$, ce qui est exclu.
    remarques:
      - |
        La réciproque de (iii) est fausse, et c'est l'erreur la plus répandue du chapitre : $f(x) = x^3$ est strictement croissante sur $\mathbb R$, puisque, pour $x < y$,
        $$y^3 - x^3 = (y - x)\Big((x + \frac y2)^2 + \frac{3y^2}4\Big) > 0,$$
        alors que $f'(0) = 0$.

        Le point (iv) dit exactement ce qui se passe : $f'(x) = 3x^2$ est positive et ne s'annule qu'en $0$, sur aucun intervalle ouvert.
      - |
        L'hypothèse que $I$ est un intervalle est essentielle. Sur $\mathbb R \setminus \{0\}$, la fonction $f(x) = 1/x$ a une dérivée $-1/x^2$ strictement négative, et pourtant $f(-1) = -1 < 1 = f(1)$ : elle n'est décroissante que sur chacun des deux intervalles $]{-\infty}, 0[$ et $]0, +\infty[$. De même, une fonction de dérivée nulle sur une réunion de deux intervalles disjoints peut prendre deux valeurs différentes. La démonstration bute exactement là : le segment $[x, y]$ n'est plus contenu dans l'ensemble de définition.
      - |
        Appliqué à $f'$, le théorème relie le signe de la dérivée seconde au sens de variation de la dérivée : si $f'' < 0$ sur un intervalle ouvert, $f'$ y est strictement décroissante. C'est l'argument employé pour la convexité de l'exponentielle dans l'inégalité de Hoeffding, au nœud {{p-hoeffding|Hoeffding}}.
      - |
        Le point (ii) est la clef de l'unicité des primitives : deux fonctions de même dérivée sur un intervalle diffèrent d'une constante. Joint au {{ar-tfa|théorème fondamental de l'analyse}}, il donne $\int_a^b f' = f(b) - f(a)$ pour toute fonction de dérivée continue.

  - id: de-taylor
    etiquette: Taylor-Lagrange
    nature: théorème
    titre: Dérivées successives et formule de Taylor-Lagrange
    texte: |
      Soit $I$ un [[intervalle]] non réduit à un point et $f : I \to \lex{ensemble-reels}{\mathbb R}$. Les [[derivee-successive|dérivées successives]] de $f$ sont définies par récurrence : $f^{(0)} = f$ et, lorsque $f^{(n)}$ est définie et [[derivable]] sur $I$, $f^{(n+1)} = \big(f^{(n)}\big)'$. On dit que $f$ est **$n$ fois dérivable** sur $I$ si $f^{(n)}$ est définie sur $I$, et **de classe $C^n$** si de plus $f^{(n)}$ est continue. On écrit $f'' = f^{(2)}$.

      Par les opérations sur les fonctions dérivables, les fonctions polynomiales et rationnelles sont indéfiniment dérivables là où elles sont définies. Pour $f(x) = \frac{1}{1 + x}$ sur $]{-1}, +\infty[$, une récurrence fondée sur la dérivée de $1/g$ donne
      $$f^{(k)}(x) = \frac{(-1)^k\, k!}{(1 + x)^{k+1}}.$$
    enonce: |
      Soit $n \in \lex{ensemble-entiers-naturels}{\mathbb N}$, $f : I \to \mathbb R$ dérivable $n + 1$ fois sur $I$, et $a \neq b$ deux points de $I$. Il existe $c$ strictement compris entre $a$ et $b$ tel que
      $$\begin{aligned} f(b) &= \sum_{k=0}^{n} \frac{f^{(k)}(a)}{k!}\,(b - a)^k \\ &\quad + \frac{f^{(n+1)}(c)}{(n+1)!}\,(b - a)^{n+1}. \end{aligned}$$
      En particulier, si $|f^{(n+1)}| \leqslant M$ entre $a$ et $b$, l'écart entre $f(b)$ et le **polynôme de Taylor** $\sum_{k \leqslant n} \frac{f^{(k)}(a)}{k!}(b - a)^k$ est au plus $\dfrac{M\,|b - a|^{n+1}}{(n+1)!}$.
    preuve: |
      Soit $A$ le réel tel que
      $$\begin{aligned} f(b) &= \sum_{k=0}^{n} \frac{f^{(k)}(a)}{k!}\,(b - a)^k \\ &\quad + \frac{A}{(n+1)!}\,(b - a)^{n+1}, \end{aligned}$$
      qui existe puisque $b - a \neq 0$. Considérons, pour $t \in I$,
      $$\begin{aligned} g(t) &= f(b) - \sum_{k=0}^{n} \frac{f^{(k)}(t)}{k!}\,(b - t)^k \\ &\quad - \frac{A}{(n+1)!}\,(b - t)^{n+1}. \end{aligned}$$
      Par le choix de $A$, $g(a) = 0$ ; et $g(b) = f(b) - f(b) = 0$, puisque tous les termes d'indice $k \geqslant 1$ s'annulent en $t = b$.

      Chaque $f^{(k)}$, pour $k \leqslant n$, est dérivable, et la dérivée de $t \mapsto (b - t)^k = (-1)^k (t - b)^k$ est $-k(b - t)^{k-1}$ ({{de-operations|Opérations}}, (iv)). La formule du produit donne, pour $1 \leqslant k \leqslant n$,
      $$\begin{aligned} &\frac{d}{dt}\left[\frac{f^{(k)}(t)}{k!}(b - t)^k\right] \\ &\quad = \frac{f^{(k+1)}(t)}{k!}(b - t)^k \\ &\qquad - \frac{f^{(k)}(t)}{(k-1)!}(b - t)^{k-1}, \end{aligned}$$
      et la dérivée du terme $k = 0$ est $f'(t)$. La somme est télescopique et vaut $\frac{f^{(n+1)}(t)}{n!}(b - t)^n$. Par suite
      $$g'(t) = \frac{(b - t)^n}{n!}\Big(A - f^{(n+1)}(t)\Big).$$
      La fonction $g$ est dérivable, donc continue, sur le segment d'extrémités $a$ et $b$, et prend la même valeur $0$ en ces deux points. Le théorème de Rolle ({{de-rolle|Rolle}}) fournit $c$ strictement compris entre $a$ et $b$ tel que $g'(c) = 0$ ; comme $b - c \neq 0$, on obtient $A = f^{(n+1)}(c)$. La majoration finale s'en déduit aussitôt.
    remarques:
      - |
        Pour $n = 0$, la formule s'écrit $f(b) = f(a) + f'(c)(b - a)$ : c'est l'{{de-taf|égalité des accroissements finis}}, dont la formule de Taylor-Lagrange est la généralisation aux ordres supérieurs, démontrée de la même façon, par le théorème de Rolle appliqué à une fonction auxiliaire bien choisie.
      - |
        Pour $f(x) = \frac1{1 + x}$, $a = 0$, $b = \frac12$ et $n = 2$, le polynôme de Taylor est $1 - b + b^2 = 0{,}75$, alors que $f(\frac12) = \frac23$. Le reste vaut $-\frac1{12}$ ; il s'écrit
        $$\frac{f'''(c)}{3!}\,b^3 = -\frac{1}{8(1 + c)^4}$$
        avec $(1 + c)^4 = \frac32$, soit $c \approx 0{,}107$, qui est bien entre $0$ et $\frac12$.

        La majoration, avec $M = 6$, borne l'erreur par $\frac18 = 0{,}125$, pour une erreur réelle de $0{,}083$ : elle est un peu pessimiste, mais elle ne demande aucune connaissance de $c$.
      - |
        Si $P$ est un polynôme de degré au plus $n$, sa dérivée $(n + 1)$-ième est nulle, et la formule donne exactement $P(x) = \sum_{k \leqslant n} \frac{P^{(k)}(a)}{k!}(x - a)^k$ : c'est la formule de Taylor pour les polynômes, qui exprime $P$ dans la base des puissances de $X - a$.
      - |
        L'erreur la plus répandue est de croire que le polynôme de Taylor approche toujours mieux $f$ quand $n$ augmente. Pour $f(x) = \frac1{1 + x}$ et $b = 2$, le polynôme $\sum_{k \leqslant n} (-2)^k$ s'écarte indéfiniment de $f(2) = \frac13$.

        La majoration de Taylor-Lagrange ne garantit la convergence que si $\frac{M\,|b - a|^{n+1}}{(n+1)!}$ tend vers $0$, ce qui n'est pas le cas ici : $|f^{(n+1)}(0)| = (n + 1)!$ et $|b - a|^{n+1} = 2^{n+1}$. Une autre forme du reste, intégrale, s'obtiendra après le {{ar-tfa|théorème fondamental de l'analyse}}, en intégrant par parties.

        ```schema de-taylor
        Pour $f(x) = \frac1{1 + x}$, les polynômes de Taylor en $0$, $T_n(x) = \sum_{k \leqslant n} (-x)^k$, sont tracés pour $n = 1$, $2$ et $3$. L'écart $f(x) - T_n(x) = \frac{(-x)^{n+1}}{1 + x}$ est minuscule près de $0$, mais en $x = 2$ les polynômes valent $-1$, $3$ et $-5$ (ce dernier hors du cadre) et s'éloignent de plus en plus de $f(2) = \frac13$.
        ```

