# Niveau 1 : structure interne du nœud « Groupes finis » (créé le 29 oct. 2026).
# Lagrange, ordre d'un élément et groupes cycliques, Cauchy, actions et équation aux classes, Sylow,
# produits semi-directs, groupes abéliens finis, groupes diédraux et quaternions, petits ordres, et
# classification des vingt-quatre groupes d'ordre au plus 12 ; groupes résolubles et non-résolubilité
# de 𝔖ₙ pour n ≥ 5. Les nœuds gs-lagrange, gs-cauchy, gs-resolubles et gs-sn viennent de la théorie de
# Galois (ids conservés), qui dépend désormais de celle-ci. Le document « Liste des premiers groupes
# finis » (M. Jourdain) est proposé au nœud gf-petits-ordres.

graphe: gf
titre: Groupes finis
conteneur: gf

entrees:
  alg: [gs-lagrange, gf-actions, gf-produits, gs-resolubles]
  z: [gf-cycliques, gf-sylow, gf-produits]
  alglin: [gf-diedraux, gf-ordre-12, gs-sn]

noeuds:
  - id: gs-lagrange
    etiquette: Lagrange
    nature: théorème
    titre: Théorème de Lagrange
    enonce: |
      Si $H$ est un sous-groupe d'un groupe fini $G$, alors $|G| = |H| \cdot |G/H|$ ; en particulier $|H|$ divise $|G|$.
    preuve: |
      Les classes $xH$ forment une partition de $G$ ({{a-distingue|Sous-groupe distingué}}, (i)), et $h \mapsto xh$ est une bijection de $H$ sur $xH$ : $|G| = |H| \cdot |G/H|$, sans choix, $G$ étant fini.
    remarques:
      - |
        Dans $\lex{ensemble-entiers-relatifs}{\mathbb Z}/12\mathbb Z$, le sous-groupe $H = \{0, 4, 8\}$ a trois éléments, et ses classes $H$, $1 + H$, $2 + H$, $3 + H$ découpent les douze éléments en quatre paquets de trois.

        ```schema gs-lagrange
        Les douze éléments de $\mathbb Z/12\mathbb Z$ sont disposés comme les heures d'un cadran. Chaque classe $k + H$, avec $H = \{0, 4, 8\}$, relie trois heures distantes de quatre, et forme un triangle équilatéral ; les quatre triangles, de quatre couleurs, n'ont deux à deux aucun sommet commun, et leurs sommets sont les douze heures, d'où $12 = 3 \times 4$.
        ```

        La réciproque est fausse : un groupe d'ordre $n$ n'a pas toujours de sous-groupe d'ordre $d$ pour chaque diviseur $d$ de $n$. Le groupe alterné $\mathfrak A_4$, d'ordre $12$, n'a pas de sous-groupe d'ordre $6$, comme on le verra avec les groupes d'ordre $12$. Le théorème de Cauchy, puis ceux de Sylow, donnent des réciproques partielles, pour les diviseurs premiers et pour les plus grandes puissances de premiers.

  - id: gf-cycliques
    etiquette: Groupes cycliques
    nature: théorème
    titre: Ordre d'un élément, groupes cycliques
    texte: |
      Dans ce graphe, les groupes sont notés multiplicativement, de neutre $e$, sauf les groupes abéliens notés additivement ; $|G|$ est le nombre d'éléments d'un groupe fini. Pour $x \in G$ et $k \in \lex{ensemble-entiers-relatifs}{\mathbb Z}$, la puissance $x^k$ est définie par récurrence pour $k \geqslant 0$, et par $x^{-k} = (x^{-1})^k$ ; on a $x^{k+l} = x^kx^l$ et $x^{kl} = (x^k)^l$, par récurrence sur $l$ puis par passage aux inverses. Le sous-groupe engendré par $x$ est $\langle x \rangle = \{x^k : k \in \mathbb Z\}$, et l'**ordre** de $x$, s'il est fini, est le nombre d'éléments de $\langle x \rangle$. Un groupe est [[groupe-cyclique|cyclique]] s'il est engendré par un seul élément. Pour $n \geqslant 1$, $\varphi(n)$ désigne le nombre d'entiers $k \in \{1, \dots, n\}$ premiers à $n$ ({{z-bezout|PGCD, Bézout}}). Le **produit direct** $G \times G'$ de deux groupes est le produit cartésien muni de la loi composante par composante, $(x, x')(y, y') = (xy, x'y')$ ; c'est un groupe, de neutre $(e, e')$, l'inverse de $(x, x')$ étant $(x^{-1}, x'^{-1})$, et ses axiomes se vérifient composante par composante.
    enonce: |
      (i) Si $\langle x \rangle$ est fini, d'ordre $d$, alors $x^k = e$ si et seulement si $d \mid k$, $\langle x \rangle = \{e, x, \dots, x^{d-1}\}$, et $\bar k \mapsto x^k$ est un isomorphisme de $\lex{anneau-zn}{\mathbb Z/d\mathbb Z}$, muni de l'addition, sur $\langle x \rangle$. Dans un groupe fini $G$, l'ordre de tout élément divise $|G|$, et $x^{|G|} = e$.

      (ii) Un groupe d'ordre premier est cyclique, engendré par chacun de ses éléments autres que $e$.

      (iii) Soit $G = \langle x \rangle$ cyclique d'ordre $n$. L'ordre de $x^k$ est $n/(n \wedge k)$ ; $x^k$ engendre $G$ si et seulement si $k \wedge n = 1$, et $G$ a $\varphi(n)$ générateurs. Pour chaque diviseur $d$ de $n$, $G$ a un unique sous-groupe d'ordre $d$, qui est cyclique, et il n'en a pas d'autre.

      (iv) Si $x$ et $y$ commutent et ont des ordres $m$ et $n$ premiers entre eux, $xy$ est d'ordre $mn$. En particulier, si $m \wedge n = 1$, le groupe $\mathbb Z/m\mathbb Z \times \mathbb Z/n\mathbb Z$ est cyclique, isomorphe à $\mathbb Z/mn\mathbb Z$.
    preuve: |
      (i) L'application $f : (\mathbb Z, +) \to G$, $k \mapsto x^k$, est un morphisme, d'image $\langle x \rangle$ : les puissances de $x$ forment un sous-groupe, contenu dans tout sous-groupe qui contient $x$. Son noyau est un sous-groupe de $\mathbb Z$, de la forme $d'\mathbb Z$ avec $d' \in \mathbb N$ ({{z-ideaux|Idéaux de ℤ}}). Si $\langle x \rangle$ est fini, $f$ n'est pas injective et $d' \geqslant 1$ ; le théorème d'isomorphisme ({{a-isomorphisme|Théorème d'isomorphisme}}) donne un isomorphisme $\mathbb Z/d'\mathbb Z \cong \langle x \rangle$, et $\mathbb Z/d'\mathbb Z$ a pour éléments les $d'$ classes $\bar 0, \dots, \overline{d' - 1}$ ({{z-zn|ℤ/nℤ}}) : $d' = d$, et $x^k = e$ si et seulement si $k \in d\mathbb Z$. Dans un groupe fini, $d$ divise $|G|$ par le théorème de Lagrange ({{gs-lagrange|Lagrange}}), donc $x^{|G|} = e$.

      (ii) Si $|G| = p$ est premier et $x \neq e$, l'ordre de $x$ divise $p$ et n'est pas $1$ : il vaut $p$, et $\langle x \rangle = G$.

      (iii) Écrivons $n = gn'$ et $k = gk'$ avec $g = n \wedge k$, qui est non nul puisque $n \geqslant 1$. Une relation de Bézout $nu + kv = g$, qui existe par définition de $n \wedge k$, générateur de $n\mathbb Z + k\mathbb Z$ ({{z-bezout|PGCD, Bézout}}), divisée par $g$ dans l'anneau intègre $\mathbb Z$, donne $n'u + k'v = 1$, donc $n' \wedge k' = 1$ (même nœud, (ii)). Par (i), $(x^k)^j = e$ si et seulement si $n \mid kj$, c'est-à-dire $n' \mid k'j$, ou encore $n' \mid j$ par le lemme de Gauss ({{z-bezout|PGCD, Bézout}}, (iii)) : l'ordre de $x^k$ est $n' = n/g$. Il vaut $n$ si et seulement si $g = 1$ ; les générateurs sont les $x^k$, $1 \leqslant k \leqslant n$, avec $k \wedge n = 1$, au nombre de $\varphi(n)$. Soit $H$ un sous-groupe et $f$ le morphisme de (i) : $f^{-1}(H)$ est un sous-groupe de $\mathbb Z$ contenant $n\mathbb Z$, donc de la forme $m\mathbb Z$ avec $m \mid n$, et $H = f(m\mathbb Z) = \langle x^m \rangle$, cyclique d'ordre $n/m$, puisque $f$ est surjective. Réciproquement, pour $d \mid n$, $\langle x^{n/d} \rangle$ est d'ordre $d$, et un sous-groupe d'ordre $d$ est de la forme $\langle x^m \rangle$ avec $n/m = d$ : il est unique.

      (iv) Comme $x$ et $y$ commutent, $(xy)^k = x^ky^k$. Si $(xy)^k = e$, alors $x^k = y^{-k}$ appartient à $\langle x \rangle \cap \langle y \rangle$, sous-groupe dont l'ordre divise $m$ et $n$ par le théorème de Lagrange, donc vaut $1$ : $x^k = y^k = e$, d'où $m \mid k$ et $n \mid k$, puis $mn \mid k$ par le lemme de Gauss. Comme $(xy)^{mn} = e$, l'ordre de $xy$ est $mn$. Dans $\mathbb Z/m\mathbb Z \times \mathbb Z/n\mathbb Z$, les éléments $(\bar 1, \bar 0)$ et $(\bar 0, \bar 1)$ commutent et sont d'ordres $m$ et $n$ : leur somme $(\bar 1, \bar 1)$ est d'ordre $mn$, égal au cardinal du groupe, qui est donc cyclique, isomorphe à $\mathbb Z/mn\mathbb Z$ par (i).
    remarques:
      - |
        Dans $\mathbb Z/12\mathbb Z$, les sous-groupes correspondent aux six diviseurs de $12$, et l'inclusion des sous-groupes renverse la divisibilité des indices.

        ```schema gf-cycliques
        Les six sous-groupes de $\mathbb Z/12\mathbb Z$, un par diviseur $d$ de $12$, le sous-groupe d'ordre $d$ étant engendré par $12/d$. Un trait relie deux sous-groupes contenus l'un dans l'autre sans intermédiaire : le sous-groupe d'ordre $d$ est contenu dans celui d'ordre $d'$ si et seulement si $d$ divise $d'$.
        ```

        Les générateurs de $\mathbb Z/12\mathbb Z$ sont $\bar 1$, $\bar 5$, $\bar 7$ et $\overline{11}$, au nombre de $\varphi(12) = 4$.
      - |
        L'erreur la plus répandue est d'appliquer (iv) sans l'hypothèse de commutation, ou sans celle de coprimalité. Dans $\mathbb Z/2\mathbb Z \times \mathbb Z/4\mathbb Z$, les ordres $2$ et $4$ ne sont pas premiers entre eux, et aucun élément n'est d'ordre $8$ : ce groupe n'est pas cyclique, alors que $\mathbb Z/2\mathbb Z \times \mathbb Z/3\mathbb Z$ l'est.

  - id: gs-cauchy
    etiquette: Cauchy
    nature: théorème
    titre: Théorème de Cauchy
    enonce: |
      Si un nombre premier $p$ divise l'ordre d'un groupe fini $G$, $G$ a un élément d'ordre $p$.
    preuve: |
      *Argument de McKay.* Soit $E$ l'ensemble des $(x_1, \dots, x_p) \in G^p$ tels que $x_1x_2\cdots x_p = e$ ; il a $|G|^{p-1}$ éléments, $x_p$ étant déterminé par les autres, nombre divisible par $p$. La permutation circulaire $\sigma(x_1, x_2, \dots, x_p) = (x_2, \dots, x_p, x_1)$ préserve $E$, car $x_1(x_2\cdots x_p) = e$ entraîne $(x_2 \cdots x_p)x_1 = e$, et $\sigma^p$ est l'identité. Le morphisme $k \mapsto \sigma^k$ de $\mathbb Z$ dans le groupe des bijections de $E$ s'annule donc sur $p\mathbb Z$, et passe au quotient ({{a-isomorphisme|Théorème d'isomorphisme}}) : $\bar k \cdot t = \sigma^k(t)$ est une action du groupe $\mathbb Z/p\mathbb Z$, d'ordre $p$, sur $E$. Par {{gf-actions|Actions de groupe}}, (iv), $|E^{\mathbb Z/p\mathbb Z}| \equiv |E| \equiv 0 \pmod p$. Les points fixes sont les $p$-uplets constants $(x, \dots, x)$ avec $x^p = e$ ; comme $(e, \dots, e)$ en est un, il y a un $x \neq e$ tel que $x^p = e$ : son ordre divise $p$ sans valoir $1$, il vaut $p$ ({{gf-cycliques|Groupes cycliques}}, (i)).
    remarques:
      - |
        Pour $G = \mathfrak S_3$ et $p = 3$, l'ensemble $E$ des triplets de produit $e$ a $6^2 = 36$ éléments. Les triplets constants sont $(e, e, e)$ et ceux formés de l'une des deux permutations circulaires $1 \mapsto 2 \mapsto 3 \mapsto 1$ et $1 \mapsto 3 \mapsto 2 \mapsto 1$, soit $3$ points fixes, et les $33$ autres se répartissent en $11$ orbites de trois triplets. Le nombre de points fixes est bien un multiple de $3$, et les deux points fixes autres que $(e, e, e)$ fournissent les deux éléments d'ordre $3$.
      - |
        L'erreur la plus répandue est de croire que l'argument donne un sous-groupe d'ordre $p^k$ pour toute puissance $p^k$ qui divise $|G|$ : c'est le premier théorème de Sylow, qui demande un argument plus fin, celui de Wielandt, démontré plus loin dans ce graphe.

  - id: gf-actions
    etiquette: Actions de groupe
    nature: théorème
    titre: Actions d'un groupe, orbites, équation aux classes
    texte: |
      Une [[action-groupe|action]] d'un groupe $G$ sur un ensemble $X$ est une application $G \times X \to X$, $(g, x) \mapsto g \cdot x$, telle que $e \cdot x = x$ et $g \cdot (h \cdot x) = (gh) \cdot x$. L'**orbite** de $x$ est $G \cdot x = \{g \cdot x : g \in G\}$, son **stabilisateur** est $G_x = \{g : g \cdot x = x\}$, et $x$ est un **point fixe** si $G \cdot x = \{x\}$ ; on note $X^G$ l'ensemble des points fixes. Le groupe agit sur lui-même par **conjugaison**, $g \cdot x = gxg^{-1}$ ; les orbites sont les **classes de conjugaison**, le stabilisateur de $x$ est son **centralisateur** $C(x) = \{g : gx = xg\}$, et les points fixes forment le **centre** $Z(G)$, ensemble des éléments qui commutent à tous les autres. Un **$p$-groupe**, pour $p$ premier, est un groupe d'ordre $p^a$ avec $a \geqslant 1$.
    enonce: |
      (i) Les orbites forment une partition de $X$. Le stabilisateur $G_x$ est un sous-groupe, et $gG_x \mapsto g \cdot x$ est une bijection de $G/G_x$ sur $G \cdot x$. Si $G$ est fini, $|G \cdot x| = |G|/|G_x|$, qui divise $|G|$.

      (ii) *Cayley.* L'application qui envoie $g$ sur la translation $x \mapsto gx$ est un morphisme injectif de $G$ dans le groupe $\mathfrak S(G)$ des bijections de $G$. Un groupe d'ordre $n$ est isomorphe à un sous-groupe de $\lex{groupe-symetrique}{\mathfrak S_n}$.

      (iii) *Équation aux classes.* Si $G$ est fini, $|G| = |Z(G)| + \sum_C |C|$, la somme portant sur les classes de conjugaison $C$ qui ne sont pas réduites à un point ; chacune a pour cardinal $|G|/|C(x)|$, pour $x \in C$, diviseur de $|G|$ strictement supérieur à $1$.

      (iv) Si un $p$-groupe agit sur un ensemble fini $X$, alors $|X| \equiv |X^G| \pmod p$. En particulier, le centre d'un $p$-groupe n'est pas réduit à $\{e\}$.
    preuve: |
      (i) La relation « $y \in G \cdot x$ » est réflexive, par $e \cdot x = x$, symétrique, car $y = g \cdot x$ entraîne $x = g^{-1} \cdot y$, et transitive, par $h \cdot (g \cdot x) = (hg) \cdot x$ : ses classes, les orbites, forment une partition. On a $e \in G_x$, et si $g, h \in G_x$, alors $gh^{-1} \cdot x = g \cdot (h^{-1} \cdot (h \cdot x)) = x$ : $G_x$ est un sous-groupe ({{a-sous-groupe|Sous-groupe}}, (i)). Ensuite $g \cdot x = h \cdot x$ si et seulement si $h^{-1}g \in G_x$, c'est-à-dire $gG_x = hG_x$ ({{a-distingue|Sous-groupe distingué}}, (i)) : l'application est bien définie et injective, et elle est surjective par définition de l'orbite. Enfin $|G| = |G_x| \cdot |G/G_x|$ ({{gs-lagrange|Lagrange}}).

      (ii) La translation $t_g : x \mapsto gx$ est bijective, de réciproque $t_{g^{-1}}$, et $t_{gh} = t_g \circ t_h$ par associativité ; $t_g = \mathrm{id}$ entraîne $g = t_g(e) = e$. L'image est un sous-groupe de $\mathfrak S(G)$ isomorphe à $G$ ({{a-isomorphisme|Théorème d'isomorphisme}}). Une bijection $\beta : \{1, \dots, n\} \to G$ fournit l'isomorphisme $\sigma \mapsto \beta^{-1} \circ \sigma \circ \beta$ de $\mathfrak S(G)$ sur $\mathfrak S_n$.

      (iii) Les classes de conjugaison sont les orbites de l'action par conjugaison ; une classe est réduite à $\{x\}$ si et seulement si $x$ commute à tout $g$, c'est-à-dire $x \in Z(G)$. On somme les cardinaux des orbites, donnés par (i), le stabilisateur de $x$ étant $C(x)$.

      (iv) Soit $|G| = p^a$. Par (i), chaque orbite a pour cardinal un diviseur de $p^a$, donc $1$ ou un multiple de $p$ ({{z-premiers|Nombres premiers}}, (ii)) ; les orbites à un élément sont les points fixes, et l'on somme sur la partition en orbites. Pour la conjugaison, $X = G$ et $X^G = Z(G)$, donc $|Z(G)| \equiv |G| \equiv 0 \pmod p$ ; comme $e \in Z(G)$, $|Z(G)| \geqslant p$.
    remarques:
      - |
        Les huit isométries du carré agissent sur ses quatre sommets. L'orbite d'un sommet est formée des quatre sommets, et son stabilisateur, formé de l'identité et de la symétrie par rapport à la diagonale qui passe par lui, a deux éléments : on retrouve $8 = 4 \times 2$.

        ```schema gf-actions
        À gauche, l'orbite du sommet $1$ : les quatre rotations l'envoient sur les quatre sommets. À droite, son stabilisateur : seules l'identité et la symétrie d'axe la diagonale passant par $1$, en rouge, le laissent en place. Le produit des cardinaux, $4 \times 2$, redonne les huit isométries.
        ```
      - |
        Le point (iv) est l'outil de comptage du chapitre : il remplace la recherche d'un objet par un dénombrement modulo $p$. Sa première application est l'argument de McKay pour le théorème de Cauchy, au nœud suivant, où le groupe $\mathbb Z/p\mathbb Z$ agit sur des $p$-uplets par permutation circulaire.

  - id: gf-sylow
    etiquette: Sylow
    nature: théorème
    titre: Théorèmes de Sylow
    texte: |
      Soit $G$ un groupe fini, $p$ un nombre premier et $|G| = p^am$ avec $a \geqslant 1$ et $p \nmid m$. Un [[sous-groupe-sylow|$p$-sous-groupe de Sylow]] est un sous-groupe d'ordre $p^a$ ; on note $n_p$ leur nombre. Le **normalisateur** d'un sous-groupe $H$ est $N(H) = \{g \in G : gHg^{-1} = H\}$ ; c'est le stabilisateur de $H$ pour l'action de $G$ par conjugaison sur ses sous-groupes, $g \cdot H = gHg^{-1}$, et il contient $H$.
    enonce: |
      (i) *Existence.* $G$ a au moins un $p$-sous-groupe de Sylow.

      (ii) *Conjugaison.* Tout sous-groupe de $G$ dont l'ordre est une puissance de $p$ est contenu dans un $p$-sous-groupe de Sylow, et deux $p$-sous-groupes de Sylow sont conjugués.

      (iii) *Nombre.* $n_p = |G|/|N(P)|$ pour tout $p$-Sylow $P$ ; $n_p$ divise $m$, et $n_p \equiv 1 \pmod p$. En particulier, $n_p = 1$ si et seulement si $P$ est distingué dans $G$.
    preuve: |
      *Un lemme de congruence.* Le coefficient binomial $\binom{p^am}{p^a}$ est congru à $m$ modulo $p$. Dans l'anneau $A = (\lex{anneau-zn}{\mathbb Z/p\mathbb Z})[X]$, où $p \cdot 1 = 0$, on a $(1 + X)^{p^a} = 1 + X^{p^a}$ ({{pol-binome|Binôme de Newton}}, (iv)), donc $(1 + X)^{p^am} = (1 + X^{p^a})^m$. Développons les deux membres par la formule du binôme (même nœud, (ii)) : le coefficient de $X^{p^a}$ est, à gauche, la classe de $\binom{p^am}{p^a}$, et, à droite, celle de $\binom m1 = m$, les autres termes ne faisant apparaître que des puissances $X^{jp^a}$ avec $j \neq 1$. Deux polynômes égaux ont les mêmes coefficients, d'où la congruence, et $p \nmid m$ montre que $p$ ne divise pas $\binom{p^am}{p^a}$.

      (i) *Argument de Wielandt.* Soit $\mathcal X$ l'ensemble des parties de $G$ à $p^a$ éléments, sur lequel $G$ agit par translation, $g \cdot A = gA$. Son cardinal $\binom{p^am}{p^a}$ ({{pol-binome|Binôme de Newton}}, (v)) n'est pas divisible par $p$ ; les orbites formant une partition de $\mathcal X$ ({{gf-actions|Actions de groupe}}, (i)), l'une d'elles, celle de $A$, a un cardinal non divisible par $p$. Comme $|G \cdot A| \cdot |G_A| = p^am$, $p^a$ divise $|G \cdot A| \cdot |G_A|$ ; or $p^a \wedge |G \cdot A| = 1$, un diviseur commun positif divisant $p^a$, donc étant une puissance de $p$ ({{z-premiers|Nombres premiers}}, (ii)), et ne pouvant être que $1$ puisque $p \nmid |G \cdot A|$. Le lemme de Gauss ({{z-bezout|PGCD, Bézout}}, (iii)) donne $p^a \mid |G_A|$. D'autre part, pour $a_0 \in A$, l'application $g \mapsto ga_0$ envoie injectivement $G_A$ dans $A$, puisque $gA = A$ ; donc $|G_A| \leqslant p^a$. Ainsi $G_A$ est un sous-groupe d'ordre $p^a$.

      (ii) Soit $P$ un $p$-Sylow et $Q$ un sous-groupe d'ordre $p^b$. Si $b = 0$, $Q = \{e\} \subset P$. Sinon, $Q$ est un $p$-groupe ; il agit sur $G/P$ par translation, $q \cdot gP = qgP$, et $|G/P| = m$ n'est pas divisible par $p$ ; par {{gf-actions|Actions de groupe}}, (iv), il y a un point fixe $gP$. Alors $qgP = gP$ pour tout $q \in Q$, c'est-à-dire $g^{-1}qg \in P$ : $Q \subset gPg^{-1}$, qui est un $p$-Sylow, image de $P$ par l'automorphisme $x \mapsto gxg^{-1}$. Si $Q$ est lui-même un $p$-Sylow, les cardinaux sont égaux, et $Q = gPg^{-1}$.

      (iii) Par (ii), l'action de $G$ par conjugaison sur l'ensemble des $p$-Sylow n'a qu'une orbite, et le stabilisateur de $P$ est $N(P)$ : $n_p = |G|/|N(P)|$ ({{gf-actions|Actions de groupe}}, (i)). Comme $P \subset N(P)$, le théorème de Lagrange donne $|N(P)| = |P| \cdot |N(P)/P|$, d'où $n_p \cdot |N(P)/P| = m$, et $n_p \mid m$. Faisons agir $P$ par conjugaison sur l'ensemble des $p$-Sylow. Si $Q$ est un point fixe, $P \subset N(Q)$ ; alors $P$ et $Q$ sont deux $p$-Sylow du groupe $N(Q)$, dont l'ordre divise $p^am$ et est multiple de $p^a$, et $Q$ y est distingué : par (ii) appliqué dans $N(Q)$, $P = nQn^{-1} = Q$ pour un $n \in N(Q)$. Le seul point fixe est donc $P$, et $n_p \equiv 1 \pmod p$ par {{gf-actions|Actions de groupe}}, (iv). Enfin $n_p = 1$ si et seulement si $N(P) = G$, c'est-à-dire $P \trianglelefteq G$.
    remarques:
      - |
        Dans le groupe symétrique $\mathfrak S_3$, d'ordre $6 = 2 \times 3$, les $2$-Sylow sont les trois sous-groupes engendrés par une transposition, et $n_2 = 3$ divise $3$ et vaut $1$ modulo $2$ ; le $3$-Sylow, formé de l'identité et des deux permutations circulaires, est unique et distingué. Dans le groupe alterné $\mathfrak A_4$, d'ordre $12$, défini plus loin au nœud des groupes d'ordre $12$, on trouve quatre $3$-Sylow, un par élément de $\{1, 2, 3, 4\}$ fixé, et $n_3 = 4 \equiv 1 \pmod 3$.
      - |
        La force des congruences est de forcer $n_p = 1$, donc un sous-groupe distingué, à partir de la seule arithmétique de $|G|$. C'est ainsi que l'on montrera qu'un groupe d'ordre $15$ est cyclique, et que la classification des groupes d'ordre $12$ se ramène à deux cas, $n_3 = 1$ ou $n_3 = 4$.

  - id: gf-produits
    etiquette: Produits semi-directs
    nature: théorème
    titre: Produits directs et semi-directs
    texte: |
      Le produit direct $N \times H$ a été défini au nœud {{gf-cycliques|Groupes cycliques}}. Les automorphismes d'un groupe $N$ forment un groupe $\operatorname{Aut}(N)$ pour la composition. Si $\varphi : H \to \operatorname{Aut}(N)$ est un morphisme, le [[produit-semi-direct|produit semi-direct]] $N \rtimes_\varphi H$ est l'ensemble $N \times H$ muni de la loi
      $$(n, h)(n', h') = \big(n\,\varphi(h)(n'),\ hh'\big).$$
      Pour un anneau $A$, on note $A^\times$ le groupe de ses éléments inversibles ({{a-groupe|Groupe}}, (i)).
    enonce: |
      (i) $N \rtimes_\varphi H$ est un groupe, de neutre $(e, e)$ ; l'ensemble $N \times \{e\}$ en est un sous-groupe distingué isomorphe à $N$, $\{e\} \times H$ un sous-groupe isomorphe à $H$, et $(e, h)(n, e)(e, h)^{-1} = (\varphi(h)(n), e)$. Pour $\varphi$ constante égale à l'identité, c'est le produit direct.

      (ii) *Reconnaissance.* Soit $G$ un groupe, $N$ un sous-groupe distingué et $H$ un sous-groupe, avec $N \cap H = \{e\}$ et $NH = G$. Alors $(n, h) \mapsto nh$ est un isomorphisme de $N \rtimes_\varphi H$ sur $G$, où $\varphi(h)(n) = hnh^{-1}$. Si de plus $H$ est distingué, $\varphi$ est triviale et $G \cong N \times H$.

      (iii) *Transport.* Soient $\varphi : H \to \operatorname{Aut}(N)$ et $\varphi' : H' \to \operatorname{Aut}(N')$ deux morphismes, et $\beta : N \to N'$, $\gamma : H \to H'$ deux isomorphismes tels que $\varphi'(\gamma(h)) = \beta \circ \varphi(h) \circ \beta^{-1}$ pour tout $h \in H$. Alors $(n, h) \mapsto (\beta(n), \gamma(h))$ est un isomorphisme de $N \rtimes_\varphi H$ sur $N' \rtimes_{\varphi'} H'$. En particulier, pour $\alpha \in \operatorname{Aut}(H)$, les groupes $N \rtimes_\varphi H$ et $N \rtimes_{\varphi \circ \alpha} H$ sont isomorphes.

      (iv) Pour $n \geqslant 2$, $\operatorname{Aut}(\lex{anneau-zn}{\mathbb Z/n\mathbb Z})$ est isomorphe à $(\mathbb Z/n\mathbb Z)^\times$, un élément $\bar a$ inversible correspondant à $x \mapsto \bar ax$. Pour $p$ premier, $\operatorname{Aut}(\mathbb Z/p\mathbb Z)$ a $p - 1$ éléments ; en particulier $\operatorname{Aut}(\mathbb Z/3\mathbb Z) = \{\mathrm{id}, -\mathrm{id}\}$.
    preuve: |
      (i) Associativité : comme $\varphi(h)$ est un morphisme et $\varphi(hh') = \varphi(h) \circ \varphi(h')$,
      $$\big((n, h)(n', h')\big)(n'', h'') = \big(n\,\varphi(h)(n')\,\varphi(hh')(n''),\ hh'h''\big) = (n, h)\big((n', h')(n'', h'')\big).$$
      Le neutre est $(e, e)$, et l'inverse de $(n, h)$ est $\big(\varphi(h^{-1})(n^{-1}), h^{-1}\big)$, comme on le vérifie en multipliant. La projection $(n, h) \mapsto h$ est un morphisme de noyau $N \times \{e\}$, qui est donc distingué ({{a-distingue|Sous-groupe distingué}}, (iii)) ; les applications $n \mapsto (n, e)$ et $h \mapsto (e, h)$ sont des morphismes injectifs. Enfin $(e, h)(n, e) = (\varphi(h)(n), h) = (\varphi(h)(n), e)(e, h)$.

      (ii) Comme $N$ est distingué, $\varphi(h)$ est un automorphisme de $N$, et $h \mapsto \varphi(h)$ un morphisme. Pour $\psi(n, h) = nh$, $\psi\big((n, h)(n', h')\big) = n\,hn'h^{-1}\,hh' = nh\,n'h' = \psi(n, h)\psi(n', h')$. Si $nh = e$, alors $n = h^{-1} \in N \cap H$, donc $n = h = e$ : $\psi$ est injectif, et surjectif puisque $NH = G$. Si $H$ est aussi distingué, le commutateur $nhn^{-1}h^{-1}$ appartient à $N \cap H = \{e\}$, donc $hnh^{-1} = n$.

      (iii) L'application $\theta(n, h) = (\beta(n), \gamma(h))$ est bijective, de réciproque $(n', h') \mapsto (\beta^{-1}(n'), \gamma^{-1}(h'))$. C'est un morphisme :
      $$\begin{aligned} \theta(n, h)\,\theta(n', h') &= \big(\beta(n)\,\varphi'(\gamma(h))(\beta(n')),\ \gamma(h)\gamma(h')\big) \\ &= \big(\beta(n)\,\beta(\varphi(h)(n')),\ \gamma(hh')\big) \\ &= \theta\big((n, h)(n', h')\big). \end{aligned}$$
      Pour le cas particulier, on prend $N' = N$, $\beta = \mathrm{id}$, $H' = H$, $\varphi' = \varphi \circ \alpha$ et $\gamma = \alpha^{-1}$ : alors $\varphi'(\gamma(h)) = \varphi(h)$.

      (iv) Un endomorphisme $f$ du groupe $\mathbb Z/n\mathbb Z$ est déterminé par $\bar a = f(\bar 1)$, puisque $f(\bar k) = k\,\bar a = \bar a\bar k$. Il est surjectif si et seulement si $\bar 1$ est atteint, c'est-à-dire si $\bar a\bar b = \bar 1$ pour un $\bar b$, et alors il est bijectif, l'ensemble étant fini. L'application $\bar a \mapsto (x \mapsto \bar ax)$ est donc une bijection de $(\mathbb Z/n\mathbb Z)^\times$ sur $\operatorname{Aut}(\mathbb Z/n\mathbb Z)$, et un morphisme, la composée de deux multiplications étant la multiplication par le produit. Pour $p$ premier, $\mathbb Z/p\mathbb Z$ est un corps ({{z-zn|ℤ/nℤ}}), et ses $p - 1$ éléments non nuls sont inversibles.
    remarques:
      - |
        Tout l'intérêt de la construction tient au choix de $\varphi$, qui dit de combien de manières $H$ peut tordre $N$. Avec $N = \mathbb Z/3\mathbb Z$ et $H = \mathbb Z/2\mathbb Z$, il y a deux morphismes $H \to \operatorname{Aut}(N) \cong \{\pm\mathrm{id}\}$ : le trivial, qui donne le groupe cyclique $\mathbb Z/6\mathbb Z$, et celui qui envoie le générateur sur $-\mathrm{id}$, qui donne le groupe symétrique $\mathfrak S_3$, non abélien.
      - |
        L'erreur la plus répandue est d'oublier l'hypothèse « $N$ distingué » dans (ii). Dans $\mathfrak S_3$, les sous-groupes $H = \langle (1\ 2) \rangle$ et $K = \langle (1\ 3) \rangle$ se coupent trivialement, mais $HK$ n'a que quatre éléments et n'est même pas un sous-groupe : sans sous-groupe distingué, le produit de deux sous-groupes n'a pas de structure.

  - id: gf-abeliens
    etiquette: Groupes abéliens finis
    nature: théorème
    titre: Classification des groupes abéliens finis
    texte: |
      Les groupes de ce nœud sont abéliens, notés additivement. Pour un entier $k$, on note $G[k] = \{x : kx = 0\}$ et $kG = \{kx : x \in G\}$, sous-groupes de $G$. Une **partition** d'un entier $a \geqslant 1$ est une suite décroissante d'entiers $k_1 \geqslant \cdots \geqslant k_r \geqslant 1$ de somme $a$.
    enonce: |
      (i) *Composantes primaires.* Si $|G| = p_1^{a_1} \cdots p_s^{a_s}$, avec des premiers distincts, $G$ est isomorphe au produit des $G[p_i^{a_i}]$, et $G[p_i^{a_i}]$ a $p_i^{a_i}$ éléments.

      (ii) Tout groupe abélien d'ordre $p^a$ est isomorphe à $\mathbb Z/p^{k_1}\mathbb Z \times \cdots \times \mathbb Z/p^{k_r}\mathbb Z$ pour une unique partition $(k_1, \dots, k_r)$ de $a$.

      (iii) Par suite, tout groupe abélien fini est produit de groupes cycliques d'ordres puissances de nombres premiers, de façon unique à l'ordre près, et le nombre de groupes abéliens d'ordre $p_1^{a_1} \cdots p_s^{a_s}$, à isomorphisme près, est le produit des nombres de partitions des $a_i$.
    preuve: |
      (i) Soit $|G| = qr$ avec $q \wedge r = 1$, et $uq + vr = 1$ ({{z-bezout|PGCD, Bézout}}, (ii)). Tout $x$ s'écrit $x = vr\,x + uq\,x$, avec $q(vr\,x) = v\,|G|\,x = 0$ et $r(uq\,x) = 0$ ({{gf-cycliques|Groupes cycliques}}, (i)) : $G = G[q] + G[r]$. Si $x \in G[q] \cap G[r]$, alors $x = v\,r x + u\,q x = 0$. Par {{gf-produits|Produits semi-directs}}, (ii), $G \cong G[q] \times G[r]$, tout sous-groupe étant distingué. Si un premier $\ell$ divisant $r$ divisait $|G[q]|$, le théorème de Cauchy ({{gs-cauchy|Cauchy}}) fournirait $x \in G[q]$ d'ordre $\ell$, et $\ell$ diviserait $q$ ({{gf-cycliques|Groupes cycliques}}, (i)) : impossible. Donc $|G[q]|$, qui divise $qr$ par Lagrange, est premier à $r$, et divise $q$ par le lemme de Gauss ; de même $|G[r]|$ divise $r$, et $|G[q]| \cdot |G[r]| = qr$ impose $|G[q]| = q$. On conclut par récurrence sur le nombre de facteurs premiers.

      (ii) *Lemme du supplémentaire.* Soit $G$ abélien d'ordre une puissance de $p$, et $x$ un élément d'ordre maximal $p^k$. Montrons, par récurrence sur $|G|$, que $\langle x \rangle$ a un **supplémentaire** $K$, sous-groupe tel que $G = \langle x \rangle + K$ et $\langle x \rangle \cap K = \{0\}$. Si $G = \langle x \rangle$, ce qui couvre le cas $G = \{0\}$, on prend $K = \{0\}$. Sinon, soit $y \notin \langle x \rangle$ d'ordre minimal parmi ces éléments ; il est non nul, et l'ordre de $py$ est celui de $y$ divisé par $p$ ({{gf-cycliques|Groupes cycliques}}, (iii)), donc plus petit : $py \in \langle x \rangle$, soit $py = jx$. Si $p \nmid j$, $jx$ serait d'ordre $p^k$ (même nœud, (iii)), et $y$ d'ordre $p^{k+1}$, contre la maximalité ; donc $j = pj'$, et $z = y - j'x$ vérifie $pz = 0$ et $z \notin \langle x \rangle$. Soit $Y = \langle z \rangle$, d'ordre $p$ ; $Y \cap \langle x \rangle$, sous-groupe de $Y$, est réduit à $\{0\}$, sans quoi il vaudrait $Y$ et contiendrait $z$. Soit $\pi : G \to G/Y$, groupe abélien d'ordre $|G|/p$, puissance de $p$. L'image $\pi(x)$ a encore l'ordre $p^k$, car $ix \in Y$ entraîne $ix = 0$, et c'est l'ordre maximal dans $G/Y$, l'ordre d'une image divisant celui de l'élément. Par hypothèse de récurrence, appliquée à $G/Y$ et à $\pi(x)$, on a $G/Y = \langle \pi(x) \rangle + \bar K$ avec $\langle \pi(x) \rangle \cap \bar K = \{0\}$ ; soit $K = \pi^{-1}(\bar K)$, qui contient $Y$. Pour $g \in G$, écrivons $\pi(g) = \pi(ix) + \bar k$ avec $\bar k \in \bar K$ : alors $g - ix \in K$, et $G = \langle x \rangle + K$. Si $ix \in K$, $\pi(ix) \in \bar K \cap \langle \pi(x) \rangle$ est nul, donc $ix \in Y \cap \langle x \rangle$, et $ix = 0$.

      *Existence.* Par récurrence sur $|G|$, montrons que tout groupe abélien $G$ d'ordre une puissance de $p$ est isomorphe à un produit $\mathbb Z/p^{k_1}\mathbb Z \times \cdots \times \mathbb Z/p^{k_r}\mathbb Z$ avec $k_1 \geqslant \cdots \geqslant k_r \geqslant 1$, le groupe nul correspondant à $r = 0$. Si $G \neq \{0\}$, soit $x$ d'ordre maximal $p^{k_1}$, avec $k_1 \geqslant 1$, et $K$ un supplémentaire de $\langle x \rangle$ donné par le lemme. Par {{gf-produits|Produits semi-directs}}, (ii), tout sous-groupe étant distingué, $G \cong \langle x \rangle \times K \cong \mathbb Z/p^{k_1}\mathbb Z \times K$ ; et $|K| = |G|/p^{k_1} < |G|$. Par hypothèse de récurrence, $K \cong \prod_{i \geqslant 2} \mathbb Z/p^{k_i}\mathbb Z$ avec $k_2 \geqslant \cdots \geqslant k_r$, et $k_2 \leqslant k_1$, puisque $K$ contient un élément d'ordre $p^{k_2}$ et que $p^{k_1}$ est l'ordre maximal dans $G$. Les cardinaux donnent $k_1 + \cdots + k_r = a$.

      *Unicité.* Dans $\mathbb Z/p^k\mathbb Z$, le sous-groupe $p^t(\mathbb Z/p^k\mathbb Z)$, engendré par $\overline{p^t}$, a $p^{k-t}$ éléments si $t \leqslant k$ ({{gf-cycliques|Groupes cycliques}}, (iii)) et est nul sinon. Pour $G = \prod_i \mathbb Z/p^{k_i}\mathbb Z$, on a donc $|p^tG| = p^{\sum_i \max(k_i - t, 0)}$, et $|p^tG|/|p^{t+1}G| = p^{c_t}$, où $c_t$ est le nombre d'indices $i$ tels que $k_i > t$. Un isomorphisme envoie $p^tG$ sur $p^tG'$ : les entiers $c_t$, pour $t \geqslant 0$, ne dépendent que de la classe d'isomorphisme de $G$, et ils déterminent la partition, puisque le nombre de $k_i$ égaux à $t$ est $c_{t-1} - c_t$.

      (iii) On combine (i) et (ii) : la donnée d'un groupe abélien d'ordre $\prod p_i^{a_i}$ équivaut, à isomorphisme près, à celle d'une partition de chaque $a_i$.
    remarques:
      - |
        Pour $8 = 2^3$, les partitions de $3$ sont $(3)$, $(2, 1)$ et $(1, 1, 1)$ : les groupes abéliens d'ordre $8$ sont $\mathbb Z/8\mathbb Z$, $\mathbb Z/4\mathbb Z \times \mathbb Z/2\mathbb Z$ et $(\mathbb Z/2\mathbb Z)^3$. Pour $12 = 2^2 \times 3$, il y a deux partitions de $2$ et une de $1$, d'où deux groupes, $\mathbb Z/4\mathbb Z \times \mathbb Z/3\mathbb Z \cong \mathbb Z/12\mathbb Z$ et $(\mathbb Z/2\mathbb Z)^2 \times \mathbb Z/3\mathbb Z \cong \mathbb Z/2\mathbb Z \times \mathbb Z/6\mathbb Z$, par {{gf-cycliques|Groupes cycliques}}, (iv).
      - |
        On peut regrouper autrement les facteurs, en $\mathbb Z/d_1\mathbb Z \times \cdots \times \mathbb Z/d_r\mathbb Z$ avec $d_1 \mid d_2 \mid \cdots \mid d_r$ : ce sont les **facteurs invariants**, qui s'obtiennent en rassemblant, par le lemme chinois de {{gf-cycliques|Groupes cycliques}}, (iv), les plus grandes puissances de chaque premier, puis les suivantes. L'erreur la plus répandue est de mélanger les deux écritures : $\mathbb Z/2\mathbb Z \times \mathbb Z/6\mathbb Z$ est une écriture en facteurs invariants, $\mathbb Z/2\mathbb Z \times \mathbb Z/2\mathbb Z \times \mathbb Z/3\mathbb Z$ la même en puissances de premiers, et $\mathbb Z/12\mathbb Z$ un autre groupe.

  - id: gf-diedraux
    etiquette: Diédraux, quaternions
    nature: théorème
    titre: Groupes diédraux et groupe des quaternions
    texte: |
      Pour $n \geqslant 2$, le morphisme $\iota : \mathbb Z/2\mathbb Z \to \operatorname{Aut}(\mathbb Z/n\mathbb Z)$ qui envoie $\bar 1$ sur $x \mapsto -x$ définit le [[groupe-diedral|groupe diédral]] $\mathcal D_n = \mathbb Z/n\mathbb Z \rtimes_\iota \mathbb Z/2\mathbb Z$ ({{gf-produits|Produits semi-directs}}) ; on note $r = (\bar 1, \bar 0)$ et $s = (\bar 0, \bar 1)$. Dans le groupe $GL_2(\mathbb Z/3\mathbb Z)$ des matrices inversibles à coefficients dans le corps $\mathbb Z/3\mathbb Z$, on pose
      $$i = \begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}, \qquad j = \begin{pmatrix} 1 & 1 \\ 1 & -1 \end{pmatrix}, \qquad k = ij,$$
      et l'on note $\mathcal Q_8$ l'ensemble $\{\pm I, \pm i, \pm j, \pm k\}$.
    enonce: |
      (i) $\mathcal D_n$ a $2n$ éléments, $r^m$ et $r^ms$ pour $0 \leqslant m < n$ ; $r$ est d'ordre $n$, $srs^{-1} = r^{-1}$, et les $r^ms$ sont tous d'ordre $2$. Le groupe $\mathcal D_n$ est abélien si et seulement si $n = 2$.

      (ii) *Reconnaissance.* Si un groupe $G$ d'ordre $2n$ contient un élément $x$ d'ordre $n$ et un élément $y \notin \langle x \rangle$ tel que $y^2 = e$ et $yxy^{-1} = x^{-1}$, alors $G \cong \mathcal D_n$.

      (iii) $\mathcal Q_8$ est un sous-groupe d'ordre $8$ de $GL_2(\mathbb Z/3\mathbb Z)$, avec $i^2 = j^2 = k^2 = -I$, $ji = -ij$ et $jij^{-1} = i^{-1}$ ; $-I$ est son seul élément d'ordre $2$, et les six autres éléments différents de $I$ sont d'ordre $4$.

      (iv) *Reconnaissance.* Si un groupe $G$ d'ordre $8$ contient un élément $x$ d'ordre $4$ et un élément $y \notin \langle x \rangle$ tel que $y^2 = x^2$ et $yxy^{-1} = x^{-1}$, alors $G \cong \mathcal Q_8$.
    preuve: |
      (i) L'application $x \mapsto -x$ est un automorphisme involutif de $\mathbb Z/n\mathbb Z$, et $\iota$ est un morphisme. Par définition du produit, $r^m = (\bar m, \bar 0)$, $r^ms = (\bar m, \bar 1)$, et ces $2n$ couples sont tous les éléments. L'ordre de $r$ est celui de $\bar 1$ dans $\mathbb Z/n\mathbb Z$, soit $n$. On calcule $srs^{-1} = s\,r\,s = (\iota(\bar 1)(\bar 1), \bar 1)(\bar 0, \bar 1) = (-\bar 1, \bar 0) = r^{-1}$, et $(r^ms)^2 = (\bar m - \bar m, \bar 0) = (\bar 0, \bar 0)$. Si $\mathcal D_n$ est abélien, $r = srs^{-1} = r^{-1}$, donc $r^2 = e$ et $n \mid 2$ ; pour $n = 2$, $\iota$ est trivial, $-x = x$ dans $\mathbb Z/2\mathbb Z$, et le groupe est le produit direct, abélien.

      (ii) Le sous-groupe $\langle x \rangle$, d'indice $2$, est distingué : pour $g \notin \langle x \rangle$, les classes $g\langle x \rangle$ et $\langle x \rangle g$ sont toutes deux le complémentaire de $\langle x \rangle$ ({{a-distingue|Sous-groupe distingué}}, (ii)). Le sous-groupe $\{e, y\}$ coupe $\langle x \rangle$ trivialement, et les $2n$ produits $x^my^b$, $0 \leqslant m < n$, $b \in \{0, 1\}$, sont distincts, car $x^my^b = x^{m'}y^{b'}$ entraîne $y^{b - b'} \in \langle x \rangle$, donc $b = b'$, puis $m = m'$ : ils forment $G$. Par {{gf-produits|Produits semi-directs}}, (ii), $G \cong \langle x \rangle \rtimes \{e, y\}$, où $y$ agit par $x^m \mapsto x^{-m}$. Les isomorphismes $\bar m \mapsto x^m$ et $\bar b \mapsto y^b$ transportent cette action sur $\iota$, et $(\bar m, \bar b) \mapsto x^my^b$ est un isomorphisme de $\mathcal D_n$ sur $G$ : il respecte les produits, qui se calculent des deux côtés par la même règle $y^bx^{m'} = x^{(-1)^bm'}y^b$.

      (iii) Dans $\mathbb Z/3\mathbb Z$, $2 = -1$. On calcule $i^2 = -I$, $j^2 = \begin{pmatrix} 2 & 0 \\ 0 & 2 \end{pmatrix} = -I$, $ij = \begin{pmatrix} -1 & 1 \\ 1 & 1 \end{pmatrix}$ et $ji = \begin{pmatrix} 1 & -1 \\ -1 & -1 \end{pmatrix} = -ij$. Par suite $k^2 = ijij = -i^2j^2 = -I$, $i^{-1} = -i$, et $jij^{-1} = -ij\,j^{-1} = -i = i^{-1}$. Les huit matrices $\pm I, \pm i, \pm j, \pm k$ sont distinctes, comme on le lit sur leurs coefficients. Les relations $ij = k = -ji$, $jk = i = -kj$ et $ki = j = -ik$, qui s'en déduisent, et la centralité de $-I$ montrent que le produit de deux éléments de $\mathcal Q_8$ y est encore ; les inverses aussi, chaque élément $u \neq \pm I$ vérifiant $u^{-1} = -u$. C'est donc un sous-groupe. Enfin $(-I)^2 = I$, et $u^2 = -I \neq I$ pour $u \neq \pm I$, d'où l'ordre $4$ ({{gf-cycliques|Groupes cycliques}}, (i)).

      (iv) Comme en (ii), $\langle x \rangle$ est distingué d'indice $2$, et les huit produits $x^my^b$ sont distincts et forment $G$. Leur multiplication est entièrement déterminée par les relations $y\,x^m = x^{-m}\,y$ et $y^2 = x^2$ : $x^my^b \cdot x^{m'}y^{b'} = x^{m + (-1)^bm'}\,y^{b+b'}$, où l'on remplace $y^2$ par $x^2$ si $b + b' = 2$. Les éléments $i$ et $j$ de $\mathcal Q_8$ vérifient les mêmes relations, par (iii), et les huit produits $i^mj^b$ sont distincts : l'application $x^my^b \mapsto i^mj^b$ est une bijection qui respecte les produits.
    remarques:
      - |
        Pour $n \geqslant 3$, $\mathcal D_n$ est le groupe des isométries du polygone régulier à $n$ côtés, ce qui est admis ici : $r$ est la rotation d'un $n$-ième de tour, et les $r^ms$ sont les $n$ symétries axiales.

        ```schema gf-diedraux
        À gauche le pentagone régulier, dont les cinq axes de symétrie passent chacun par un sommet et par le milieu du côté opposé ; à droite l'hexagone, dont les six axes se partagent en deux familles, trois par des sommets opposés et trois par des milieux de côtés opposés. La rotation $r$ fait tourner d'un cinquième, puis d'un sixième de tour.
        ```

        La différence entre les deux figures n'est pas anecdotique : pour $n$ impair, les $n$ symétries sont toutes conjuguées, tandis que pour $n$ pair elles forment deux classes de conjugaison.
      - |
        Le groupe $\mathcal Q_8$ est l'exemple le plus simple d'un groupe dont tous les sous-groupes sont distingués sans qu'il soit abélien : ses sous-groupes sont $\{I\}$, $\{\pm I\}$, $\langle i \rangle$, $\langle j \rangle$, $\langle k \rangle$ et $\mathcal Q_8$, et chacun est distingué, les trois sous-groupes d'ordre $4$ étant d'indice $2$. On l'écrit aussi $\{\pm 1, \pm i, \pm j, \pm k\}$, avec les règles de Hamilton $i^2 = j^2 = k^2 = ijk = -1$ ; la réalisation dans $GL_2(\mathbb Z/3\mathbb Z)$ évite d'avoir à vérifier l'associativité d'une table.

  - id: gf-ordres-pq
    etiquette: Ordres p, p², 2p, pq
    nature: théorème
    titre: Groupes d'ordre p, p², 2p et pq
    texte: |
      Dans ce nœud, $p$ et $q$ sont des nombres premiers.
    enonce: |
      (i) Un groupe d'ordre $p$ est isomorphe à $\mathbb Z/p\mathbb Z$.

      (ii) Un groupe d'ordre $p^2$ est abélien, isomorphe à $\mathbb Z/p^2\mathbb Z$ ou à $(\mathbb Z/p\mathbb Z)^2$.

      (iii) Si $p$ est impair, un groupe d'ordre $2p$ est isomorphe à $\mathbb Z/2p\mathbb Z$ ou au groupe diédral $\mathcal D_p$.

      (iv) Si $p < q$ et $p \nmid q - 1$, un groupe d'ordre $pq$ est cyclique.
    preuve: |
      (i) C'est {{gf-cycliques|Groupes cycliques}}, (ii) et (i).

      (ii) Le centre $Z$ n'est pas trivial ({{gf-actions|Actions de groupe}}, (iv)), et son ordre divise $p^2$. S'il valait $p$, le quotient $G/Z$, d'ordre $p$, serait cyclique, engendré par une classe $xZ$ : tout élément s'écrirait $x^kz$ avec $z \in Z$, et deux tels éléments commuteraient, de sorte que $G$ serait abélien et $Z = G$, contradiction. Donc $Z = G$, et $G$ est abélien ; les partitions de $2$ sont $(2)$ et $(1, 1)$ ({{gf-abeliens|Groupes abéliens finis}}, (ii)).

      (iii) Par les théorèmes de Sylow ({{gf-sylow|Sylow}}, (iii)), $n_p$ divise $2$ et vaut $1$ modulo $p \geqslant 3$, donc $n_p = 1$ : le $p$-Sylow $P = \langle x \rangle$ est distingué. Par le théorème de Cauchy ({{gs-cauchy|Cauchy}}), il existe $y$ d'ordre $2$, qui n'est pas dans $P$. Comme $P$ est distingué, $yxy^{-1} = x^a$ ; en conjuguant deux fois, $x = y^2xy^{-2} = x^{a^2}$, donc $a^2 \equiv 1 \pmod p$, c'est-à-dire $p \mid (a - 1)(a + 1)$, et $a \equiv \pm 1$ par le lemme d'Euclide ({{z-premiers|Nombres premiers}}, (i)). Si $a \equiv 1$, $x$ et $y$ commutent, $xy$ est d'ordre $2p$ ({{gf-cycliques|Groupes cycliques}}, (iv)), et $G$ est cyclique. Si $a \equiv -1$, $G \cong \mathcal D_p$ ({{gf-diedraux|Diédraux, quaternions}}, (ii)). Les deux cas s'excluent, $\mathcal D_p$ n'étant pas abélien.

      (iv) Le nombre $n_q$ divise $p$ et vaut $1$ modulo $q$ ; comme $1 < p < q$, $n_q = 1$. Le nombre $n_p$ divise $q$ et vaut $1$ modulo $p$ ; comme $q \not\equiv 1 \pmod p$, $n_p = 1$. Les deux Sylow $P = \langle x \rangle$ et $Q = \langle y \rangle$ sont distingués et se coupent trivialement, leurs ordres étant premiers entre eux ; le commutateur $xyx^{-1}y^{-1}$ appartient à $P \cap Q = \{e\}$, donc $x$ et $y$ commutent, et $xy$ est d'ordre $pq$.
    remarques:
      - |
        Ces quatre énoncés règlent tous les ordres de $1$ à $11$, sauf $8$ : les ordres $2, 3, 5, 7, 11$ par (i), $4$ et $9$ par (ii), $6$ et $10$ par (iii). Le point (iv) donne aussi, par exemple, qu'un groupe d'ordre $15$ est cyclique, puisque $3 \nmid 4$.
      - |
        L'hypothèse $p \nmid q - 1$ de (iv) est nécessaire : pour $p = 2$ et $q = 3$, elle tombe en défaut, et $\mathfrak S_3$, d'ordre $6$, n'est pas cyclique. En général, lorsque $p \mid q - 1$, il existe un unique groupe non abélien d'ordre $pq$, produit semi-direct de $\mathbb Z/q\mathbb Z$ par $\mathbb Z/p\mathbb Z$. L'existence découle du théorème de Cauchy, appliqué au groupe $(\mathbb Z/q\mathbb Z)^\times \cong \operatorname{Aut}(\mathbb Z/q\mathbb Z)$, d'ordre $q - 1$ divisible par $p$ ; l'unicité, admise ici, demande que ce groupe soit cyclique, ce que la théorie de Galois établira pour tout corps fini. Le cas $p = 2$ est celui de (iii).

  - id: gf-ordre-8
    etiquette: Groupes d'ordre 8
    nature: théorème
    titre: Les cinq groupes d'ordre 8
    enonce: |
      Un groupe d'ordre $8$ est isomorphe à un et un seul des groupes $\mathbb Z/8\mathbb Z$, $\mathbb Z/4\mathbb Z \times \mathbb Z/2\mathbb Z$, $(\mathbb Z/2\mathbb Z)^3$, $\mathcal D_4$ et $\mathcal Q_8$.
    preuve: |
      *Les groupes abéliens.* Les partitions de $3$ donnent les trois premiers, deux à deux non isomorphes ({{gf-abeliens|Groupes abéliens finis}}, (ii)).

      *Les groupes non abéliens.* Soit $G$ d'ordre $8$ non abélien. Si tous ses éléments vérifiaient $x^2 = e$, on aurait $xy = (xy)^{-1} = y^{-1}x^{-1} = yx$, et $G$ serait abélien ; si $G$ avait un élément d'ordre $8$, il serait cyclique. Il existe donc $x$ d'ordre $4$ ({{gf-cycliques|Groupes cycliques}}, (i)). Le sous-groupe $\langle x \rangle$, d'indice $2$, est distingué ; soit $y \notin \langle x \rangle$. L'élément $yxy^{-1}$ est d'ordre $4$ et appartient à $\langle x \rangle$, donc vaut $x$ ou $x^3 = x^{-1}$ ({{gf-cycliques|Groupes cycliques}}, (iii)) ; s'il valait $x$, $y$ commuterait avec $x$, et $G$, formé des $x^my^b$ comme dans {{gf-diedraux|Diédraux, quaternions}}, (ii), serait abélien. Donc $yxy^{-1} = x^{-1}$. Le carré $y^2$ est dans $\langle x \rangle$, le quotient $G/\langle x \rangle$ étant d'ordre $2$ ; il ne vaut ni $x$ ni $x^3$, sinon $y$ serait d'ordre $8$. Si $y^2 = e$, $G \cong \mathcal D_4$ ({{gf-diedraux|Diédraux, quaternions}}, (ii)) ; si $y^2 = x^2$, $G \cong \mathcal Q_8$ (même nœud, (iv)).

      *Ils sont distincts.* $\mathcal D_4$ a cinq éléments d'ordre $2$, $r^2$ et les quatre $r^ms$ (même nœud, (i)), et $\mathcal Q_8$ n'en a qu'un (même nœud, (iii)) ; aucun des deux n'est abélien, et un isomorphisme conserve l'ordre des éléments.
    remarques:
      - |
        Les deux groupes non abéliens ont des treillis de sous-groupes très différents, ce qui donne une autre façon de les séparer.

        ```schema gf-ordre-8
        À gauche, les dix sous-groupes de $\mathcal D_4$ : cinq d'ordre $2$, dont seul $\langle r^2 \rangle$ est distingué, et trois d'ordre $4$, le cyclique $\langle r \rangle$ et deux groupes de Klein. À droite, les six sous-groupes de $\mathcal Q_8$, tous distingués : un seul d'ordre $2$, contenu dans les trois d'ordre $4$. En rouge, les sous-groupes non distingués.
        ```

        Ces décomptes ont été vérifiés par une énumération exhaustive des sous-groupes.
      - |
        L'erreur la plus répandue est de croire que deux groupes ayant le même nombre d'éléments de chaque ordre sont isomorphes. C'est vrai ici, mais faux en général : $\mathbb Z/4\mathbb Z \times \mathbb Z/4\mathbb Z$ et $\mathbb Z/2\mathbb Z \times \mathcal Q_8$, d'ordre $16$, ont chacun un élément d'ordre $1$, trois d'ordre $2$ et douze d'ordre $4$, alors que le premier est abélien et le second non. Pour l'ordre $8$, ce critère et la commutativité suffisent.

  - id: gf-ordre-12
    etiquette: Groupes d'ordre 12
    nature: théorème
    titre: Les cinq groupes d'ordre 12
    texte: |
      Pour $a, b, c$ distincts dans $\{1, \dots, n\}$, le **$3$-cycle** $(a\ b\ c)$ est la permutation qui envoie $a$ sur $b$, $b$ sur $c$, $c$ sur $a$ et fixe les autres éléments ; on a $(a\ b\ c) = (b\ c\ a) = (c\ a\ b)$, et $(a\ b\ c) = (a\ c)(a\ b)$, les produits se composant de droite à gauche. Une **double transposition** est un produit $(a\ b)(c\ d)$ de deux transpositions de supports disjoints, $\{a, b\} \cap \{c, d\} = \varnothing$. Le **groupe alterné** $\mathfrak A_4$ est le noyau de la signature $\varepsilon : \lex{groupe-symetrique}{\mathfrak S_4} \to \{1, -1\}$ ({{v-permutations|Permutations, signature}}). Le **groupe dicyclique** est $\mathrm{Dic}_3 = \mathbb Z/3\mathbb Z \rtimes_\psi \mathbb Z/4\mathbb Z$, où $\psi$ envoie $\bar 1$ sur $x \mapsto -x$.
    enonce: |
      (i) $\mathfrak S_4$ a $24$ éléments ; $\mathfrak A_4$ a $12$ éléments, l'identité, les huit $3$-cycles et les trois doubles transpositions ; c'est le seul sous-groupe d'ordre $12$ de $\mathfrak S_4$.

      (ii) Un groupe d'ordre $12$ est isomorphe à un et un seul des groupes $\mathbb Z/12\mathbb Z$, $\mathbb Z/2\mathbb Z \times \mathbb Z/6\mathbb Z$, $\mathcal D_6$, $\mathfrak A_4$ et $\mathrm{Dic}_3$.
    preuve: |
      (i) Une bijection de $\{1, 2, 3, 4\}$ est déterminée par les images de $1, 2, 3, 4$, qui peuvent être choisies de $4$, $3$, $2$, puis $1$ manières : $|\mathfrak S_4| = 24$. La signature est surjective, une transposition ayant pour signature $-1$, et son noyau $\mathfrak A_4$ est d'indice $2$ ({{a-isomorphisme|Théorème d'isomorphisme}}), donc d'ordre $12$. Un $3$-cycle $(a\ b\ c) = (a\ c)(a\ b)$ et une double transposition sont des produits de deux transpositions, de signature $1$ ; il y a $4 \times 2 = 8$ $3$-cycles, quatre choix de l'élément fixé et deux sens de parcours, et $3$ doubles transpositions, soit avec l'identité douze éléments, qui forment donc $\mathfrak A_4$. Soit $H$ un sous-groupe d'ordre $12$ : il est d'indice $2$, donc distingué, et le quotient $\mathfrak S_4/H$, d'ordre $2$, montre que $\sigma^2 \in H$ pour tout $\sigma$. Un $3$-cycle $c$ vérifie $c = c^4 = (c^2)^2$ : $H$ contient les huit $3$-cycles, et les trois doubles transpositions, puisque $(1\ 2)(3\ 4) = (1\ 2\ 3)(2\ 3\ 4)$, $(1\ 3)(2\ 4) = (1\ 2\ 3)(1\ 2\ 4)$ et $(1\ 4)(2\ 3) = (1\ 2\ 3)(1\ 4\ 3)$, en composant de droite à gauche. Donc $H \supset \mathfrak A_4$, et $H = \mathfrak A_4$ par égalité des cardinaux.

      (ii) *Les groupes abéliens* sont $\mathbb Z/12\mathbb Z$ et $\mathbb Z/2\mathbb Z \times \mathbb Z/6\mathbb Z$ ({{gf-abeliens|Groupes abéliens finis}}). Soit $G$ non abélien d'ordre $12 = 2^2 \times 3$. Par les théorèmes de Sylow ({{gf-sylow|Sylow}}), $n_3$ divise $4$ et vaut $1$ modulo $3$ : $n_3 \in \{1, 4\}$.

      *Si $n_3 = 4$.* Deux $3$-Sylow distincts, d'ordre premier, se coupent trivialement : ils fournissent $4 \times 2 = 8$ éléments d'ordre $3$. Le normalisateur d'un $3$-Sylow $P$ est d'ordre $12/4 = 3$, donc égal à $P$. L'action de $G$ par conjugaison sur l'ensemble de ses quatre $3$-Sylow est un morphisme $G \to \mathfrak S_4$, en numérotant ces sous-groupes ; un élément du noyau normalise chaque $P$, donc appartient à l'intersection des $3$-Sylow, qui est $\{e\}$. Le morphisme est injectif, et son image est un sous-groupe d'ordre $12$ de $\mathfrak S_4$, c'est-à-dire $\mathfrak A_4$ par (i) : $G \cong \mathfrak A_4$.

      *Si $n_3 = 1$.* Le $3$-Sylow $P$ est distingué, isomorphe à $\mathbb Z/3\mathbb Z$, et un $2$-Sylow $Q$, d'ordre $4$, le coupe trivialement. L'application $(a, b) \mapsto ab$ de $P \times Q$ dans $G$ est injective, puisque $ab = a'b'$ entraîne $a'^{-1}a = b'b^{-1} \in P \cap Q$ : donc $PQ = G$, et $G \cong P \rtimes_\varphi Q$ ({{gf-produits|Produits semi-directs}}, (ii)), avec $\varphi : Q \to \operatorname{Aut}(P) \cong \{\pm\mathrm{id}\}$ (même nœud, (iv)). Ce morphisme n'est pas trivial, sinon $G \cong P \times Q$ serait abélien. Par {{gf-ordres-pq|Ordres p, p², 2p, pq}}, (ii), $Q$ est isomorphe à $\mathbb Z/4\mathbb Z$ ou à $(\mathbb Z/2\mathbb Z)^2$.
      - Si $Q \cong \mathbb Z/4\mathbb Z$, choisissons des isomorphismes $\beta : P \to \mathbb Z/3\mathbb Z$ et $\gamma : Q \to \mathbb Z/4\mathbb Z$, et soit $q = \gamma^{-1}(\bar 1)$, générateur de $Q$. Comme $\varphi$ n'est pas trivial, $\varphi(q) = -\mathrm{id}$, sans quoi $\varphi$ serait trivial sur $\langle q \rangle = Q$. L'inversion commute à tout isomorphisme, donc $\beta \circ \varphi(q) \circ \beta^{-1} = -\mathrm{id} = \psi(\gamma(q))$ ; deux morphismes de $Q$ qui coïncident sur un générateur sont égaux, et le transport ({{gf-produits|Produits semi-directs}}, (iii)) donne $G \cong \mathrm{Dic}_3$.
      - Si $Q \cong (\mathbb Z/2\mathbb Z)^2$, un morphisme non trivial $Q \to \{\pm\mathrm{id}\}$ est déterminé par son noyau, l'un des trois sous-groupes d'ordre $2$ de $Q$. Toute permutation des trois éléments non nuls $u, v, u + v$ de $Q$ est un automorphisme, puisque la somme de deux d'entre eux est le troisième ; les trois morphismes se déduisent donc l'un de l'autre par un automorphisme de $Q$, et donnent des groupes isomorphes (même nœud, (iii)). Le groupe $\mathcal D_6$ en est un. Dans $\mathcal D_6$, le sous-groupe $N' = \langle r^2 \rangle = \{e, r^2, r^4\}$ est d'ordre $3$ et distingué, puisque $r$ le centralise et que $(r^ms)\,r^2\,(r^ms)^{-1} = r^m r^{-2} r^{-m} = r^{-2}$ ({{gf-diedraux|Diédraux, quaternions}}, (i)). L'ensemble $H' = \{e, r^3, s, r^3s\}$ est un sous-groupe isomorphe à $(\mathbb Z/2\mathbb Z)^2$ : $sr^3s^{-1} = r^{-3} = r^3$, donc $r^3$ et $s$ commutent, et $r^3$, $s$, $r^3s$ sont d'ordre $2$. On a $N' \cap H' = \{e\}$, et les $3 \times 4 = 12$ produits $ab$, $a \in N'$, $b \in H'$, sont distincts comme plus haut : $N'H' = \mathcal D_6$, et $\mathcal D_6 \cong N' \rtimes_{\varphi'} H'$ par la reconnaissance, où $s$ agit par inversion et $r^3$ trivialement, de sorte que $\varphi'$ est non trivial, de noyau $\{e, r^3\}$. Choisissons un isomorphisme $\beta : P \to N'$, et un isomorphisme $\gamma : Q \to H'$ qui envoie $\operatorname{Ker} \varphi$ sur $\{e, r^3\}$, ce qui est possible puisque toute permutation des éléments non nuls de $Q$ est un automorphisme. Les morphismes $h \mapsto \varphi'(\gamma(h))$ et $h \mapsto \beta \circ \varphi(h) \circ \beta^{-1}$ de $Q$ dans $\{\pm \mathrm{id}\}$ ont le même noyau, donc sont égaux, et le transport donne $G \cong \mathcal D_6$.

      *Ils sont distincts.* Les nombres d'éléments d'ordre $2$ sont $1$ pour $\mathbb Z/12\mathbb Z$, $3$ pour $\mathbb Z/2\mathbb Z \times \mathbb Z/6\mathbb Z$, $7$ pour $\mathcal D_6$, à savoir $r^3$ et les six $r^ms$, $3$ pour $\mathfrak A_4$, les doubles transpositions, et $1$ pour $\mathrm{Dic}_3$, l'élément $(\bar 0, \bar 2)$ ; comme $\mathbb Z/2\mathbb Z \times \mathbb Z/6\mathbb Z$ et $\mathbb Z/12\mathbb Z$ sont abéliens et les trois autres non, les cinq groupes sont deux à deux non isomorphes.
    remarques:
      - |
        Le groupe $\mathfrak A_4$ montre que la réciproque du théorème de Lagrange est fausse : il n'a pas de sous-groupe d'ordre $6$. Un tel sous-groupe serait d'indice $2$, donc contiendrait les carrés, et en particulier les huit $3$-cycles, comme dans la preuve de (i) : il aurait au moins neuf éléments.
      - |
        Les quatre $3$-Sylow de $\mathfrak A_4$ se voient sur le tétraèdre régulier : $\mathfrak A_4$ est le groupe de ses rotations, ce qui est admis ici, et chaque $3$-Sylow est formé des rotations d'un tiers de tour autour de l'axe qui joint un sommet au centre de la face opposée. L'action par conjugaison sur ces quatre axes est l'action sur les quatre sommets, et c'est elle que la preuve utilise.

  - id: gf-petits-ordres
    etiquette: Groupes d'ordre ≤ 12
    nature: théorème
    titre: Les vingt-quatre groupes d'ordre au plus 12
    enonce: |
      À isomorphisme près, il existe exactement vingt-quatre groupes d'ordre au plus $12$ :

      ```tableau
      Ordre ¦ Nombre ¦ Groupes
      $1$ ¦ $1$ ¦ $\{e\}$
      $2, 3, 5, 7, 11$ ¦ $1$ ¦ $\mathbb Z/p\mathbb Z$
      $4$ ¦ $2$ ¦ $\mathbb Z/4\mathbb Z$, $(\mathbb Z/2\mathbb Z)^2$
      $6$ ¦ $2$ ¦ $\mathbb Z/6\mathbb Z$, $\mathcal D_3 \cong \mathfrak S_3$
      $8$ ¦ $5$ ¦ $\mathbb Z/8\mathbb Z$, $\mathbb Z/4\mathbb Z \times \mathbb Z/2\mathbb Z$, $(\mathbb Z/2\mathbb Z)^3$, $\mathcal D_4$, $\mathcal Q_8$
      $9$ ¦ $2$ ¦ $\mathbb Z/9\mathbb Z$, $(\mathbb Z/3\mathbb Z)^2$
      $10$ ¦ $2$ ¦ $\mathbb Z/10\mathbb Z$, $\mathcal D_5$
      $12$ ¦ $5$ ¦ $\mathbb Z/12\mathbb Z$, $\mathbb Z/2\mathbb Z \times \mathbb Z/6\mathbb Z$, $\mathcal D_6$, $\mathfrak A_4$, $\mathrm{Dic}_3$
      ```
    preuve: |
      L'ordre $1$ ne porte que le groupe trivial. Les ordres premiers $2, 3, 5, 7, 11$, les ordres $4 = 2^2$ et $9 = 3^2$, et les ordres $6 = 2 \times 3$ et $10 = 2 \times 5$ sont réglés par {{gf-ordres-pq|Ordres p, p², 2p, pq}}, (i), (ii) et (iii) ; pour l'ordre $6$, $\mathcal D_3 \cong \mathfrak S_3$ par la reconnaissance des groupes diédraux ({{gf-diedraux|Diédraux, quaternions}}, (ii)), appliquée à un $3$-cycle et à une transposition. Les ordres $8$ et $12$ sont les nœuds {{gf-ordre-8|Groupes d'ordre 8}} et {{gf-ordre-12|Groupes d'ordre 12}}. On compte $1 + 5 \times 1 + 2 + 2 + 5 + 2 + 2 + 5 = 24$.
    remarques:
      - |
        Le nombre de groupes ne croît pas avec l'ordre, mais avec la façon dont il se factorise : les ordres premiers n'en portent qu'un, les produits de deux premiers distincts au plus deux, et les ordres $8 = 2^3$ et $12 = 2^2 \times 3$, riches en facteurs, en portent cinq.

        ```schema gf-petits-ordres
        Le nombre de groupes d'ordre $n$, à isomorphisme près, pour $n$ de $1$ à $12$. Les barres hautes sont celles des ordres $8$ et $12$ ; les ordres premiers, en gris, n'en portent qu'un.
        ```
      - |
        Chacun de ces vingt-quatre groupes est décrit en détail, avec sa table, son treillis de sous-groupes, une réalisation géométrique et ses apparitions en algèbre, dans le document *Liste des premiers groupes finis*, proposé ci-dessous en téléchargement. Ce document résume les théorèmes de Sylow et la classification des groupes abéliens, que ce graphe démontre.
      - |
        La croissance devient vite vertigineuse pour les puissances de $2$ : il y a $14$ groupes d'ordre $16$ et $51$ d'ordre $32$ ; ces nombres, obtenus par des énumérations sur ordinateur, sont admis ici. Tous les groupes de la liste sont [[groupe-resoluble|résolubles]]. Les groupes abéliens le sont ; $\mathcal D_n \supset \langle r \rangle \supset \{e\}$, $\mathcal Q_8 \supset \langle i \rangle \supset \{e\}$ et $\mathrm{Dic}_3 \supset \mathbb Z/3\mathbb Z \times \{\bar 0\} \supset \{e\}$ ont des quotients d'ordres $2$ ou $4$ et cycliques, puis cycliques ; et $\mathfrak A_4 \supset V \supset \{e\}$, où $V$ est formé de l'identité et des trois doubles transpositions, est une suite de résolubilité, comme le montre le nœud {{gs-sn|𝔖ₙ non résoluble}}. À l'inverse, le groupe alterné $\mathfrak A_5$, noyau de la signature sur $\mathfrak S_5$, d'ordre $60$, contient tous les $3$-cycles, et la démonstration du même nœud montre qu'il n'est pas résoluble ; qu'il soit le plus petit groupe non résoluble est admis ici.
    documents:
      - titre: Liste des premiers groupes finis
        fichier: documents/edifice/liste-premiers-groupes-finis.pdf
        description: Les vingt-quatre groupes d'ordre au plus douze, un par un — fiche signalétique, présentation, treillis des sous-groupes, réalisation géométrique et liens avec l'algèbre.
        pages: 41
        auteur: M. Jourdain

  - id: gs-resolubles
    etiquette: Groupes résolubles
    nature: définition
    titre: Groupes résolubles
    texte: |
      Un groupe $G$ est [[groupe-resoluble|résoluble]] s'il existe une suite de sous-groupes $G = G_0 \supset G_1 \supset \cdots \supset G_r = \{e\}$, chacun distingué dans le précédent, avec des quotients $G_{i-1}/G_i$ abéliens. Le **commutateur** de $x$ et $y$ est $[x, y] = xyx^{-1}y^{-1}$.
    enonce: |
      (i) Si $N$ est distingué dans $G$, $G/N$ est abélien si et seulement si $N$ contient tous les commutateurs.

      (ii) Un quotient d'un groupe résoluble est résoluble.
    preuve: |
      (i) $G/N$ est abélien si et seulement si $xyN = yxN$ pour tous $x, y$, c'est-à-dire $(yx)^{-1}xy = x^{-1}y^{-1}xy \in N$ pour tous $x, y$. En appliquant cette condition à $x^{-1}$ et $y^{-1}$, qui parcourent $G$ quand $x$ et $y$ le parcourent, elle équivaut à $xyx^{-1}y^{-1} = [x, y] \in N$ pour tous $x, y$.

      (ii) Si $\pi : G \to G/N$ est la projection et $(G_i)$ une suite de résolubilité de $G$, les $\pi(G_i)$ forment une suite de résolubilité de $G/N$. D'abord $\pi(G_i)$ est distingué dans $\pi(G_{i-1})$, puisque $\pi(g)\pi(G_i)\pi(g)^{-1} = \pi(gG_ig^{-1}) = \pi(G_i)$ pour $g \in G_{i-1}$. Ensuite le morphisme surjectif $G_{i-1} \to \pi(G_{i-1})/\pi(G_i)$, composé de $\pi$ et de la projection, s'annule sur $G_i$ ; il passe au quotient en un morphisme surjectif de $G_{i-1}/G_i$, abélien, sur $\pi(G_{i-1})/\pi(G_i)$, qui est donc abélien, comme toute image d'un groupe abélien.
    remarques:
      - |
        Tout groupe abélien est résoluble, avec la suite $G \supset \{e\}$. La notion mesure jusqu'où un groupe s'éloigne de la commutativité par étapes abéliennes ; c'est exactement ce qu'il faut pour monter une tour d'extensions par radicaux, comme le montrera, dans la théorie de Galois, le théorème sur la résolubilité par radicaux. On verra que les vingt-quatre groupes d'ordre au plus $12$ sont tous résolubles.

  - id: gs-sn
    etiquette: 𝔖ₙ non résoluble
    nature: théorème
    titre: Le groupe symétrique n'est pas résoluble pour n ≥ 5
    texte: |
      Pour $a, b, c$ distincts, le **$3$-cycle** $(a\ b\ c)$ envoie $a$ sur $b$, $b$ sur $c$, $c$ sur $a$ et fixe les autres éléments ; une **double transposition** est un produit $(a\ b)(c\ d)$ de deux transpositions de supports disjoints ({{v-permutations|Permutations, signature}}). Les produits se composent de droite à gauche.
    enonce: |
      Pour $n \geqslant 5$, le groupe symétrique $\lex{groupe-symetrique}{\mathfrak S_n}$ n'est pas résoluble.
    preuve: |
      Si $a, b, c, d, e$ sont cinq éléments distincts, $[(a\ b\ d), (a\ c\ e)] = (a\ b\ c)$, comme on le vérifie en suivant les images. Soit $H \subset \mathfrak S_n$ un sous-groupe contenant tous les $3$-cycles, et $N$ distingué dans $H$ avec $H/N$ abélien : par {{gs-resolubles|Groupes résolubles}}, (i), $N$ contient tous les commutateurs d'éléments de $H$, donc tous les $3$-cycles, puisque $n \geqslant 5$ permet de compléter $a, b, c$ par deux éléments distincts $d, e$. Par récurrence, chaque $G_i$ d'une suite de résolubilité de $\mathfrak S_n$ contiendrait tous les $3$-cycles, et $G_r \neq \{e\}$ : contradiction.
    remarques:
      - |
        Pour $n \leqslant 4$, $\mathfrak S_n$ est résoluble. Pour $n \leqslant 2$, il est abélien. Pour $n = 3$, le noyau $\mathfrak A_3$ de la signature ({{v-permutations|Permutations, signature}}) est formé de l'identité et des deux $3$-cycles, et $\mathfrak S_3 \supset \mathfrak A_3 \supset \{e\}$ a des quotients d'ordres $2$ et $3$, donc cycliques. Pour $n = 4$, on prend $\mathfrak S_4 \supset \mathfrak A_4 \supset V \supset \{e\}$, où $V$ est formé de l'identité et des trois doubles transpositions. Le produit de deux doubles transpositions distinctes est la troisième, et chacune est d'ordre $2$ : $V$ est un sous-groupe, abélien comme tout groupe dont les éléments vérifient $x^2 = e$. Il est distingué dans $\mathfrak S_4$ : pour toute permutation $\sigma$, $\sigma(a\ b)\sigma^{-1} = (\sigma(a)\ \sigma(b))$, comme on le voit en suivant les images, donc le conjugué d'une double transposition en est une. Les quotients sont d'ordres $2$, $3$ et $4$, et abéliens : les deux premiers sont cycliques, et le dernier est $V$. C'est la raison profonde de l'existence des formules de Cardan et de Ferrari pour les degrés $3$ et $4$.
      - |
        L'argument tombe en défaut pour $n = 4$ précisément parce qu'on ne trouve plus cinq éléments distincts : le commutateur de deux $3$-cycles de $\mathfrak S_4$ est une double transposition ou l'identité, jamais un $3$-cycle, et la suite des $G_i$ peut alors descendre jusqu'à $V$.

