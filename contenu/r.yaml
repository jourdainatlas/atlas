# Niveau 1 : structure interne du nœud ℝ.
# ℝ est construit comme l'ensemble des coupures de Dedekind de ℚ ; on montre que c'est un corps ordonné
# ayant la propriété de la borne supérieure, et qu'un tel corps est unique à unique isomorphisme près.
# Les identifiants commencent par « rr- » : le préfixe « r- » est pris par le graphe des relations.

graphe: r
titre: Les nombres réels
conteneur: r

entrees:
  q: [rr-definition]
  ord: [rr-definition]

noeuds:
  - id: rr-definition
    etiquette: Coupures de ℚ
    nature: proposition
    titre: Les réels comme coupures de ℚ
    texte: |
      On note $\lex{ensemble-reels}{\mathbb R}$ l'ensemble des [[coupure-dedekind|coupures de Dedekind]] de $\lex{ensemble-rationnels}{\mathbb Q}$, ordonné par inclusion. Pour $q \in \mathbb Q$, on note $q^* = \,]{\leftarrow}, q[\, = \{x \in \mathbb Q : x < q\}$.
    enonce: |
      (i) $\mathbb R$ est totalement ordonné, a la [[propriete-borne-superieure|propriété de la borne supérieure]], et $q \mapsto q^*$ est une application strictement croissante de $\mathbb Q$ dans $\mathbb R$.

      (ii) Si $C$ est une coupure, $c \in C$ et $u \notin C$, alors $c < u$.

      (iii) Pour toute coupure $C$ et tout rationnel $\varepsilon > 0$, il existe $x \in C$ tel que $x + \varepsilon \notin C$.
    preuve: |
      (i) L'ordre de $\mathbb Q$ est total, dense et sans extrémités ({{q-archimede|Archimède, densité}}) ; c'est le théorème du nœud {{od-coupures|Coupures de Dedekind}}.

      (ii) Si l'on avait $u \leqslant c$, alors $u \in C$, puisque $C$ est un segment initial.

      (iii) Soit $c_0 \in C$ et $u \notin C$. Par la propriété d'Archimède de $\mathbb Q$, il existe $n \in \lex{ensemble-entiers-naturels}{\mathbb N}$ tel que $n\varepsilon > u - c_0$, et alors $c_0 + n\varepsilon \notin C$ par (ii). L'ensemble des $k \in \mathbb N$ tels que $c_0 + k\varepsilon \notin C$ est donc non vide ; soit $k$ son plus petit élément ({{n-ordre|Bon ordre sur ℕ}}). Comme $c_0 \in C$, $k \geqslant 1$, et $x = c_0 + (k - 1)\varepsilon$ convient.

      ```schema rr-definition
      Partant de $c_0 \in C$, on avance par sauts de longueur $\varepsilon$ ; la propriété d'Archimède garantit que l'on sort de $C$, au plus tard en dépassant $u$. Le dernier point atteint dans $C$ est $x$, et le saut rouge mène à $x + \varepsilon$, qui n'est plus dans $C$.
      ```
    remarques:
      - |
        Le point (iii) est le seul endroit où la construction utilise la propriété d'Archimède de $\mathbb Q$. Sans lui, on ne pourrait pas montrer qu'une coupure a un opposé.
      - |
        Une autre construction, due à Cantor et Méray, définit $\mathbb R$ comme le quotient de l'anneau des [[suite-cauchy|suites de Cauchy]] rationnelles par l'idéal des suites de limite nulle. Le théorème d'unicité, plus bas, montre que les deux constructions donnent le même objet à isomorphisme près.

  - id: rr-addition
    etiquette: Addition des réels
    nature: proposition
    titre: Addition des coupures
    texte: |
      Pour deux coupures $C$ et $D$, on pose $C + D = \{c + d : c \in C,\ d \in D\}$ et
      $$-C = \{x \in \lex{ensemble-rationnels}{\mathbb Q} : \exists r \in \mathbb Q,\ r > 0 \text{ et } -x - r \notin C\}.$$
    enonce: |
      (i) $C + D$ et $-C$ sont des coupures.

      (ii) $(\lex{ensemble-reels}{\mathbb R}, +)$ est un groupe abélien, de neutre $0^*$, où $-C$ est l'opposé de $C$.

      (iii) $(p + q)^* = p^* + q^*$ pour tous rationnels $p, q$.

      (iv) Si $C \subset D$, alors $C + E \subset D + E$.
    preuve: |
      (i) *Somme.* $C + D$ est non vide. Si $u \notin C$ et $v \notin D$, alors $c + d < u + v$ pour tous $c \in C$, $d \in D$, par {{rr-definition|Coupures de ℚ}} (ii) ; donc $u + v \notin C + D$. Si $z < c + d$, alors $z - d < c$, donc $z - d \in C$ et $z = (z - d) + d \in C + D$. Enfin, $c$ n'étant pas le plus grand élément de $C$, il existe $c' > c$ dans $C$, et $c' + d > c + d$.

      *Opposé.* Soit $u \notin C$ ; alors $x = -u - 1$ appartient à $-C$, avec $r = 1$. Si $c \in C$, alors $-c \notin -C$, puisque $c - r \in C$ pour tout $r > 0$. Si $x \in -C$, avec $-x - r \notin C$, et $y < x$, alors $-y - r > -x - r$, donc $-y - r \notin C$ et $y \in -C$. Enfin $x + r/2 \in -C$, avec $r/2$, puisque $-(x + r/2) - r/2 = -x - r \notin C$ : $-C$ n'a pas de plus grand élément.

      (ii) L'associativité et la commutativité viennent de celles de $\mathbb Q$. *Neutre.* Si $c \in C$ et $z < 0$, alors $c + z < c$, donc $c + z \in C$ : $C + 0^* \subset C$. Réciproquement, pour $c \in C$, soit $c' > c$ dans $C$ ; alors $c = c' + (c - c')$ avec $c - c' \in 0^*$.

      *Opposé.* Si $c \in C$ et $x \in -C$, avec $-x - r \notin C$, alors $c < -x - r$, d'où $c + x < -r < 0$ : $C + (-C) \subset 0^*$. Réciproquement, soit $z < 0$ et $\varepsilon = -z/2$. Par {{rr-definition|Coupures de ℚ}} (iii), il existe $x \in C$ avec $x + \varepsilon \notin C$. Posons $y = z - x$. Alors $-y - \varepsilon = x - z - \varepsilon = x + \varepsilon \notin C$, donc $y \in -C$, et $z = x + y \in C + (-C)$.

      (iii) Si $a < p$ et $b < q$, alors $a + b < p + q$. Réciproquement, si $z < p + q$, posons $\delta = (p + q - z)/2 > 0$, $a = p - \delta$ et $b = q - \delta$ : alors $a < p$, $b < q$ et $a + b = z$.

      (iv) Tout $c + e$ avec $c \in C \subset D$ appartient à $D + E$.
    remarques:
      - |
        La définition de $-C$ ne peut pas être simplement $\{-x : x \notin C\}$ : si $C = q^*$, cet ensemble serait $]{\leftarrow}, -q]$, qui a un plus grand élément. Le décalage par $r > 0$ retire ce point, conformément à la convention du nœud {{od-coupures|Coupures de Dedekind}}.

        ```schema rr-addition
        Pour $C = q^*$, le complémentaire de $C$ est $\{x : x \geqslant q\}$, et son symétrique $\{-x : x \notin C\}$ est $]{\leftarrow}, -q]$, qui a $-q$ pour plus grand élément et n'est donc pas une coupure. Le décalage par $r > 0$ retire ce point et donne $-C = \,]{\leftarrow}, -q[$, en rouge.
        ```

  - id: rr-multiplication
    etiquette: Multiplication des réels
    nature: chapitre
    titre: ℝ est un corps ordonné
    sous: rr-multiplication
    texte: |
      Produit de deux [[coupure-positive|coupures positives]], défini par $C \cdot D = 0^* \cup \{cd : c \in C,\ d \in D,\ c \geqslant 0,\ d \geqslant 0\}$ : c'est une coupure, le produit est associatif, commutatif, de neutre $1^*$, distributif sur l'addition, et toute coupure strictement positive a un inverse. La règle des signes, fondée sur $(-C) \cdot D = -(C \cdot D)$, étend le produit à toutes les coupures, et une disjonction de cas transporte les axiomes : $\lex{ensemble-reels}{\mathbb R}$ est un [[corps-ordonne|corps ordonné]], et $q \mapsto q^*$ est un morphisme injectif de corps ordonnés de $\lex{ensemble-rationnels}{\mathbb Q}$ dans $\mathbb R$.
    remarques:
      - |
        Aucune idée nouvelle n'est nécessaire par rapport à l'addition, mais la vérification est plus longue : le produit n'a de formule simple que pour les coupures positives, et chaque axiome se transporte ensuite aux autres signes par une disjonction de cas. Seul l'inverse demande un argument d'approximation, version multiplicative du point (iii) de {{rr-definition|Coupures de ℚ}}.

  - id: rr-complet
    etiquette: Corps ordonné complet
    nature: théorème
    titre: ℝ est un corps ordonné complet
    texte: |
      Un [[corps-ordonne-complet|corps ordonné complet]] est un corps ordonné qui a la propriété de la borne supérieure : toute partie non vide et majorée a une borne supérieure.
    enonce: |
      $\lex{ensemble-reels}{\mathbb R}$ est un corps ordonné complet, qui contient $\lex{ensemble-rationnels}{\mathbb Q}$ comme sous-corps ordonné.
    preuve: |
      $\mathbb R$ est un corps ordonné, dont l'ordre est l'inclusion des coupures ({{rr-multiplication|Multiplication des réels}}, théorème {{rm-ordre|Corps ordonné, ℚ ⊂ ℝ}}) ; il a la propriété de la borne supérieure ({{rr-definition|Coupures de ℚ}}), et $\mathbb Q$ s'y plonge par $q \mapsto q^*$, morphisme injectif de corps ordonnés, dont l'image est un sous-corps ordonné de $\mathbb R$.
    remarques:
      - |
        C'est l'énoncé que l'analyse réelle prend pour point de départ, au nœud {{ar-corps|Borne supérieure}}. La construction elle-même n'y servira plus : seules comptent les propriétés de corps ordonné complet, dont le nœud {{rr-unicite|Unicité de ℝ}} montre qu'elles déterminent $\mathbb R$.

  - id: rr-archimede
    etiquette: Archimède, densité de ℚ
    nature: théorème
    titre: Un corps ordonné complet est archimédien
    enonce: |
      Soit $K$ un corps ordonné complet, dans lequel $\lex{ensemble-rationnels}{\mathbb Q}$ est plongé ({{q-plongement|ℚ dans tout corps ordonné}}).

      (i) $K$ est [[archimedien|archimédien]].

      (ii) $\mathbb Q$ est dense dans $K$ : si $x < y$ dans $K$, il existe $q \in \mathbb Q$ tel que $x < q < y$.
    preuve: |
      (i) Supposons $x > 0$ et $nx \leqslant y$ pour tout $n \in \lex{ensemble-entiers-naturels}{\mathbb N}$. La partie $A = \{nx : n \in \mathbb N\}$ est non vide et majorée ; soit $s = \sup A$. Comme $s - x < s$, l'élément $s - x$ ne majore pas $A$ : il existe $n$ tel que $nx > s - x$, d'où $(n + 1)x > s$, ce qui contredit $(n + 1)x \in A$.

      (ii) Par (i), il existe $n \geqslant 1$ tel que $n(y - x) > 1$. L'ensemble $M$ des entiers relatifs $m$ tels que $m > nx$ est non vide, par (i) appliqué à $nx$, et minoré, par (i) appliqué à $-nx$. Il a donc un plus petit élément $m$ ({{z-ordre|Ordre de ℤ}}). Alors $m - 1 \leqslant nx < m$, donc $nx < m \leqslant nx + 1 < ny$, et $x < m/n < y$.
    remarques:
      - |
        Il existe des corps ordonnés non archimédiens, comme le corps des fractions rationnelles $\lex{ensemble-reels}{\mathbb R}(X)$ ordonné de sorte que $X$ soit plus grand que tous les réels. Le point (i) montre qu'ils ne peuvent pas avoir la propriété de la borne supérieure.

  - id: rr-unicite
    etiquette: Unicité de ℝ
    nature: théorème
    titre: Unicité du corps ordonné complet
    enonce: |
      Deux corps ordonnés complets $K$ et $K'$ sont isomorphes, et il existe un unique isomorphisme de corps ordonnés de $K$ sur $K'$. Il est donné par
      $$f(x) = \sup\{q \in \lex{ensemble-rationnels}{\mathbb Q} : q < x\},$$
      la borne supérieure étant prise dans $K'$, où $\mathbb Q$ est aussi plongé.
    preuve: |
      On identifie $\mathbb Q$ à ses images dans $K$ et $K'$ ({{q-plongement|ℚ dans tout corps ordonné}}). Pour $x \in K$, l'ensemble $Q_x = \{q \in \mathbb Q : q < x\}$ est non vide et majoré dans $K'$ ({{rr-archimede|Archimède, densité de ℚ}}), donc $f(x)$ existe.

      *Caractérisation.* Pour $q \in \mathbb Q$, on a $q < f(x) \iff q < x$. En effet, si $q < x$, la densité fournit $q' \in \mathbb Q$ avec $q < q' < x$, et $q < q' \leqslant f(x)$. Si $q \geqslant x$, tout élément de $Q_x$ est inférieur à $q$, donc $f(x) \leqslant q$. Comme $\mathbb Q$ est dense dans $K'$, deux éléments de $K'$ précédés par les mêmes rationnels sont égaux ; $f(x)$ est donc l'unique élément de $K'$ précédé exactement par les rationnels de $Q_x$, et $f(q) = q$ pour $q \in \mathbb Q$.

      *Bijectivité.* En échangeant les rôles, on définit $g : K' \to K$ avec $q < g(x') \iff q < x'$. Alors $q < f(g(x')) \iff q < g(x') \iff q < x'$, donc $f(g(x')) = x'$ ; de même $g(f(x)) = x$. Si $x < y$, la densité fournit des rationnels $x < q < q' < y$, et $f(x) \leqslant q < q' \leqslant f(y)$ : $f$ est strictement croissante.

      *Additivité.* Pour $q \in \mathbb Q$, on a $q < x + y$ si et seulement s'il existe des rationnels $q_1 < x$ et $q_2 < y$ avec $q = q_1 + q_2$ : dans le sens direct, avec $\delta = x + y - q > 0$, on choisit $q_1 \in \mathbb Q$ tel que $x - \delta < q_1 < x$, et $q_2 = q - q_1 < y$. La même équivalence vaut dans $K'$. Donc $q < f(x + y) \iff q < x + y \iff q < f(x) + f(y)$, et $f(x + y) = f(x) + f(y)$.

      *Multiplicativité.* Pour $x, y > 0$ et $q > 0$ rationnel, on a de même $q < xy$ si et seulement si $q = q_1 q_2$ avec $0 < q_1 < x$ et $0 < q_2 < y$ rationnels. Comme $f(x), f(y) > 0$, les rationnels qui précèdent $f(xy)$ et $f(x)f(y)$ sont les mêmes, donc $f(xy) = f(x)f(y)$. Le cas général s'en déduit par les signes, puisque $f(-x) = -f(x)$ par additivité.

      *Unicité.* Un isomorphisme de corps ordonnés $h$ fixe $\mathbb Q$ ({{q-plongement|ℚ dans tout corps ordonné}}) et est croissant, donc $q < h(x) \iff q < x$ pour tout rationnel $q$ ; par la caractérisation, $h(x) = f(x)$.
    remarques:
      - |
        Ce théorème justifie que l'on parle de *l*'ensemble des réels, sans préciser la construction : coupures, suites de Cauchy ou développements décimaux donnent des corps ordonnés complets, tous isomorphes par un isomorphisme unique.
      - |
        L'unicité de l'isomorphisme est plus forte qu'elle ne paraît : $\lex{ensemble-reels}{\mathbb R}$ n'a pas d'automorphisme de corps ordonné autre que l'identité. En fait, il n'a même pas d'automorphisme de corps autre que l'identité, car l'ordre se lit sur la structure de corps : les positifs sont les carrés.

