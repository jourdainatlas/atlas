# Niveau 1 : structure interne du nœud « Équations différentielles ».
# Point fixe dans un espace métrique complet et théorème de Cauchy-Lipschitz (Picard),
# théorème d'existence de Peano (30 oct. 2026 : polygones d'Euler et forme séquentielle d'Ascoli, sans choix),
# lemme de Grönwall, solutions maximales et critère d'explosion, systèmes linéaires et
# exponentielle de matrices, flot d'un champ de vecteurs, courbes intégrales sur une variété.
# Sortie des compacts, domaine du flot (ouvert, continuité), différentiabilité du flot par
# rapport à la condition initiale (équation variationnelle, Grönwall appliqué au reste de
# Taylor) et régularité Cᵏ par le système augmenté. Chapitre « Changement de variables » (sous-graphe
# edo-changement, 29 oct. 2026) : mesure de Lebesgue de ℝⁿ, formule du changement de variables, coordonnées
# polaires, intégrale de Gauss, conservation du volume par un flot de divergence nulle (Liouville) ; placé
# ici parce que edo est la première théorie dont mes, cdiff, alglin et anc sont tous des ancêtres.
# Chapitre « Stabilité des équilibres » (sous-graphe edo-liapounov, 30 oct. 2026) : stabilité au sens de
# Liapounov, critère spectral des systèmes linéaires (trigonalisation sur ℂ par d'Alembert-Gauss, ac n'étant
# pas un ancêtre), fonctions de Liapounov, équation ᵗAP + PA = −I, LaSalle, linéarisation, pendule amorti.
# Parents : analyse fonctionnelle (Banach), géométrie différentielle
# (accroissements finis, variétés), analyse complexe (exp, cos, sin) ; le point fixe de
# Banach et les normes de ℝⁿ viennent, à travers elles, des espaces métriques et normés.

graphe: edo
titre: Équations différentielles
conteneur: edo

entrees:
  anf: [ed-cauchy-lipschitz]
  geod: [ed-cauchy-lipschitz, ed-varietes]
  anc: [ed-gronwall, ed-lineaires]

noeuds:
  - id: ed-cauchy-lipschitz
    etiquette: Cauchy-Lipschitz
    nature: théorème
    titre: Théorème de Cauchy-Lipschitz local
    texte: |
      Soit $\Omega$ un ouvert de $\lex{ensemble-reels}{\mathbb R} \times \lex{n-uplet}{\mathbb R^n}$ et $F : \Omega \to \mathbb R^n$ continue.

      Une **solution** de l'[[equation-differentielle|équation différentielle]] $y' = F(t, y)$ est une fonction dérivable $y : J \to \mathbb R^n$, sur un intervalle $J$, telle que $(t, y(t)) \in \Omega$ et $y'(t) = F(t, y(t))$ pour tout $t \in J$.

      On munit $\mathbb R^n$ de $\|\cdot\|_\infty$, et l'on intègre les fonctions vectorielles coordonnée par coordonnée.
    enonce: |
      (i) *Point fixe.* Soit $(E, d)$ un espace métrique complet non vide et $\Phi : E \to E$ telle qu'un itéré $\Phi^k$ soit contractant. Alors $\Phi$ a un unique point fixe.

      (ii) *Cauchy-Lipschitz.* Soit $(t_0, y_0) \in \Omega$, et $C = [t_0 - a, t_0 + a] \times \bar B(y_0, r) \subset \Omega$ un cylindre sur lequel $\|F\| \leqslant M$ et $\|F(t, y) - F(t, z)\| \leqslant L\|y - z\|$. Pour $h = \min(a, r/M)$, il existe une unique solution définie sur $[t_0 - h, t_0 + h]$ telle que $y(t_0) = y_0$.

      ```schema ed-cauchy-lipschitz
      Pour $F(t, y) = y^2$, $(t_0, y_0) = (0, 1)$, $a = 1$ et $r = 1$, on a $M = 4$ sur le cylindre $C$, donc $h = \min(a, r/M) = \frac14$. Le cône de pente $M$, en bleu, atteint le bord du cylindre exactement aux instants $t_0 \pm h$ : une solution issue de $(t_0, y_0)$ ne peut pas quitter $C$ avant, et la solution $y = \frac{1}{1 - t}$, en rouge, y reste en effet.
      ```

    preuve: |
      (i) Le point fixe $x^*$ de $\Phi^k$, qui existe et est unique par le théorème du point fixe de Banach dans un espace métrique complet ({{gd-point-fixe|Point fixe}}, (i)), vérifie
      $$\Phi^k(\Phi(x^*)) = \Phi(\Phi^k(x^*)) = \Phi(x^*) :$$
      $\Phi(x^*)$ est aussi un point fixe de $\Phi^k$, donc égal à $x^*$. Tout point fixe de $\Phi$ en est un de $\Phi^k$.

      (ii) *Forme intégrale.* Une fonction continue $y$ est solution avec $y(t_0) = y_0$ si et seulement si
      $$y(t) = y_0 + \int_{t_0}^t F(s, y(s))\,ds,$$
      par le théorème fondamental ({{ar-tfa|Théorème fondamental}}) appliqué à chaque coordonnée.

      *L'espace.* Soit $J = [t_0 - h, t_0 + h]$ et $E$ l'ensemble des fonctions continues $J \to \bar B(y_0, r)$, muni de la distance uniforme. C'est une partie fermée de l'espace des fonctions continues $J \to \mathbb R^n$, qui est un espace de Banach, coordonnée par coordonnée ({{f-exemples|Exemples d'espaces de Banach}}) : $E$ est complet.

      *L'opérateur de Picard.* L'opérateur
      $$\Phi(y)(t) = y_0 + \int_{t_0}^t F(s, y(s))\,ds$$
      envoie $E$ dans $E$, puisque $\|\Phi(y)(t) - y_0\| \leqslant M|t - t_0| \leqslant Mh \leqslant r$.

      Par récurrence sur $k$, en intégrant l'inégalité de rang $k - 1$, on obtient
      $$\begin{aligned} &\|\Phi^k(y)(t) - \Phi^k(z)(t)\| \\ &\quad \leqslant \frac{(L|t - t_0|)^k}{k!}\,d(y, z). \end{aligned}$$
      Comme $(Lh)^k/k! \to 0$, un itéré est contractant, et (i) conclut.

      *Unicité parmi toutes les solutions.* Une solution $z$ sur un intervalle $J' \subset J$ contenant $t_0$ reste dans $\bar B(y_0, r)$ : sinon, au premier instant $\tau$ où $\|z(\tau) - y_0\| = r$, on aurait $r \leqslant M|\tau - t_0| < Mh \leqslant r$ si $|\tau - t_0| < h$. Elle est donc point fixe de l'opérateur de Picard sur $J'$, et l'estimation précédente, sur $J'$, donne $z = y$.
    remarques:
      - |
        L'hypothèse lipschitzienne est indispensable à l'unicité. L'équation $y' = 2\sqrt{|y|}$, avec $y(0) = 0$, a pour solutions la fonction nulle et $y(t) = t^2$ pour $t \geqslant 0$, et une infinité d'autres obtenues en restant nulles jusqu'à un instant arbitraire.

        ```schema ed-cauchy-lipschitz-2
        Toutes ces fonctions résolvent $y' = 2\sqrt{|y|}$ avec $y(0) = 0$ : la fonction nulle, en bleu, la fonction $t^2$, en rouge, et, pour chaque $\tau > 0$, la fonction nulle sur $[0, \tau]$ puis égale à $(t - \tau)^2$, qui se raccorde à la fonction nulle avec une dérivée nulle en $\tau$.
        ```

        Sans elle, le théorème de Peano assure encore l'existence, par un argument de compacité : c'est le nœud {{ed-peano|Théorème de Peano}}, qui applique le théorème d'Ascoli à des solutions approchées.
      - |
        Les itérés de Picard sont un algorithme. Pour $y' = y$, $y(0) = 1$, ils valent $1$, $1 + t$, $1 + t + \frac{t^2}2$, … : ce sont les sommes partielles de la série de l'exponentielle de l'{{anc|analyse complexe}}, retrouvée comme solution d'une équation différentielle.

  - id: ed-peano
    etiquette: Théorème de Peano
    nature: théorème
    titre: Théorème d'existence de Peano
    texte: |
      Les notations sont celles du nœud {{ed-cauchy-lipschitz|Cauchy-Lipschitz}} : $\Omega$ est un ouvert de $\lex{ensemble-reels}{\mathbb R} \times \lex{n-uplet}{\mathbb R^n}$, $F : \Omega \to \mathbb R^n$ est continue, et $\mathbb R^n$ est muni de $\|\cdot\|_\infty$, notée $\|\cdot\|$. Aucune condition de Lipschitz n'est supposée.
    enonce: |
      Soit $(t_0, y_0) \in \Omega$, et $C = [t_0 - a, t_0 + a] \times \bar B(y_0, r) \subset \Omega$ un cylindre, avec $a, r > 0$, sur lequel $\|F\| \leqslant M$, où $M > 0$. Pour $h = \min(a, r/M)$, il existe une solution $y : [t_0 - h, t_0 + h] \to \mathbb R^n$ de $y' = F(t, y)$ telle que $y(t_0) = y_0$.
    preuve: |
      Soit $J = [t_0 - h, t_0 + h]$. Le cylindre $C$ est fermé et borné dans $\mathbb R^{n+1}$, donc compact ({{me-rn|L'espace ℝⁿ}}, (iii)) ; $F$ y est bornée et uniformément continue ({{me-heine|Théorème de Heine}}), pour la distance $d_\infty$ de $\mathbb R^{n+1}$.

      *Les polygones d'Euler.* Pour un entier $N \geqslant 1$, posons $t_k = t_0 + \frac{kh}N$ pour $-N \leqslant k \leqslant N$. On définit $y_N$ sur $J$, de proche en proche à partir de $t_0$, par $y_N(t_0) = y_0$ et, sur chaque segment $[t_k, t_{k+1}]$ avec $k \geqslant 0$, et sur chaque segment $[t_{k-1}, t_k]$ avec $k \leqslant 0$,
      $$y_N(t) = y_N(t_k) + (t - t_k)\,F\big(t_k, y_N(t_k)\big).$$
      C'est possible, et $\|y_N(t) - y_0\| \leqslant M|t - t_0| \leqslant r$ sur $J$ : par récurrence sur $|k|$, si $\|y_N(t_k) - y_0\| \leqslant M|t_k - t_0|$, le point $(t_k, y_N(t_k))$ est dans $C$, la pente $F(t_k, y_N(t_k))$ est de norme au plus $M$, et l'inégalité s'étend au segment suivant, puisque $|t - t_0| = |t_k - t_0| + |t - t_k|$ sur ce segment.

      ```schema ed-peano
      Pour $F(t, y) = 1 - y^2$, $(t_0, y_0) = (0, 0)$, $a = 1$ et $r = 1$, on a $M = 1$ et $h = 1$. Les polygones d'Euler $y_2$ (bleu), $y_4$ (vert) et $y_{16}$ (noir, en tirets) restent dans le cône de pente $M$ issu de $(t_0, y_0)$, en pointillé : ils sont tous $M$-lipschitziens, donc équicontinus, et bornés. Ils se rapprochent de la solution (rouge), ici $y(t) = \frac{1 - e^{-2t}}{1 + e^{-2t}}$, que la démonstration obtient comme limite uniforme d'une suite extraite.
      ```

      Notons, pour $s \in J$, $\tau_N(s)$ celle des extrémités du segment $[t_k, t_{k+1}]$ ou $[t_{k-1}, t_k]$ contenant $s$ qui est la plus proche de $t_0$, en convenant de prendre le segment le plus proche de $t_0$ aux points $t_k$. La fonction $g_N(s) = F\big(\tau_N(s), y_N(\tau_N(s))\big)$ est en escalier, coordonnée par coordonnée, et la relation de Chasles donne, pour $t \in J$,
      $$y_N(t) = y_0 + \int_{t_0}^t g_N(s)\,ds.$$
      Comme $\|g_N\| \leqslant M$, on en tire $\|y_N(t) - y_N(t')\| \leqslant M|t - t'|$ ({{ri-proprietes|Propriétés de l'intégrale}}, (v)).

      *Une suite extraite convergente.* Dans l'espace $C(J, \mathbb R^n)$, la suite $(y_N)_{N \geqslant 1}$ est bornée, par $\|y_0\| + r$, et équicontinue, ses termes étant tous $M$-lipschitziens ({{fc-equicontinuite|Équicontinuité}}, (ii)). Par la forme séquentielle du théorème d'Ascoli ({{fc-ascoli|Théorème d'Ascoli}}, (ii)), une suite extraite $(y_{N_j})$ converge uniformément vers une fonction continue $y : J \to \mathbb R^n$. Comme les $y_N(t)$ appartiennent à la boule fermée $\bar B(y_0, r)$, leur limite $y(t)$ aussi.

      *Passage à la limite.* Soit $\varepsilon > 0$ et $\delta > 0$ tel que deux points de $C$ à distance $d_\infty$ inférieure à $\delta$ aient des images par $F$ distantes de moins de $\varepsilon$. Pour $s \in J$, on a $|\tau_N(s) - s| \leqslant \frac hN$, et
      $$\begin{aligned} &\|y_N(\tau_N(s)) - y(s)\| \\ &\quad \leqslant \|y_N(\tau_N(s)) - y_N(s)\| \\ &\qquad + \|y_N(s) - y(s)\| \\ &\quad \leqslant \frac{Mh}N + \|y_N - y\|_\infty. \end{aligned}$$
      Comme $N_j \geqslant j$ et $\|y_{N_j} - y\|_\infty \to 0$, les deux nombres $\frac h{N_j}$ et $\frac{Mh}{N_j} + \|y_{N_j} - y\|_\infty$ sont inférieurs à $\delta$ pour $j$ assez grand. Les points $\big(\tau_{N_j}(s), y_{N_j}(\tau_{N_j}(s))\big)$ et $(s, y(s))$ de $C$ sont alors à distance $d_\infty$ inférieure à $\delta$, et $\|g_{N_j}(s) - F(s, y(s))\| < \varepsilon$ pour tout $s \in J$.

      La fonction $s \mapsto F(s, y(s))$ est uniformément continue sur $J$. En effet, $y$ est $M$-lipschitzienne, par passage à la limite dans $\|y_N(t) - y_N(t')\| \leqslant M|t - t'|$ ; si $|s - s'| < \frac\delta{\max(1, M)}$, les points $(s, y(s))$ et $(s', y(s'))$ de $C$ sont donc à distance $d_\infty$ inférieure à $\delta$, et leurs images par $F$ distantes de moins de $\varepsilon$, qui est quelconque. Elle est donc intégrable ({{ri-continues|Fonctions continues}}, (i)), et, pour $t \in J$,
      $$\Big\|y_{N_j}(t) - y_0 - \int_{t_0}^t F(s, y(s))\,ds\Big\| \leqslant \varepsilon h.$$
      En faisant tendre $j$ vers l'infini puis $\varepsilon$ vers $0$, on obtient
      $$y(t) = y_0 + \int_{t_0}^t F(s, y(s))\,ds,$$
      et $y$ est une solution telle que $y(t_0) = y_0$, par le théorème fondamental appliqué à chaque coordonnée ({{ar-tfa|Théorème fondamental}}), comme dans la forme intégrale du nœud {{ed-cauchy-lipschitz|Cauchy-Lipschitz}}.
    remarques:
      - |
        La démonstration ne fait aucun choix. Les solutions approchées sont définies explicitement, et la suite extraite convergente est fournie par la forme séquentielle du théorème d'Ascoli, qui prend ses réseaux parmi les termes de la suite, au plus petit indice ({{fc-ascoli|Théorème d'Ascoli}}, (ii)), puis par le sens direct, sans choix, du théorème de compacité séquentielle.
      - |
        L'erreur la plus répandue est de croire que le théorème donne aussi l'unicité. Pour $y' = 2\sqrt{|y|}$ et $y(0) = 0$, l'équation a une infinité de solutions ({{ed-cauchy-lipschitz|Cauchy-Lipschitz}}). Les polygones d'Euler sont ici tous nuls, puisque $F(t, 0) = 0$, et la démonstration trouve la solution nulle ; les autres solutions, comme $t \mapsto t^2$ pour $t \geqslant 0$, lui échappent.
      - |
        Le théorème ne donne aucune estimation de la vitesse de convergence : la compacité fournit une limite, sans dire à partir de quel rang les polygones en sont proches. C'est la différence essentielle avec la méthode de Picard du nœud {{ed-cauchy-lipschitz|Cauchy-Lipschitz}}, qui, grâce à la condition de Lipschitz, contracte et majore l'erreur.
      - |
        G. Peano a publié un premier énoncé en 1886 (« Sull'integrabilità delle equazioni differenziali del primo ordine », *Atti della R. Accademia delle Scienze di Torino* 21), avec une démonstration incorrecte, puis une démonstration correcte en 1890 (« Démonstration de l'intégrabilité des équations différentielles ordinaires », *Math. Ann.* 37, p. 182-228). Dans ce second mémoire, p. 210, il remarque qu'« on ne peut pas appliquer une infinité de fois une loi arbitraire » : c'est l'une des premières mentions explicites de la difficulté que l'axiome du choix formalisera, et la démonstration ci-dessus s'en dispense.

  - id: ed-gronwall
    etiquette: Grönwall
    nature: lemme
    titre: Lemme de Grönwall et dépendance par rapport aux conditions initiales
    enonce: |
      (i) *Grönwall.* Soit $u : [t_0, t_1] \to [0, +\infty[$ continue, et $a, b \geqslant 0$ tels que $u(t) \leqslant a + b\int_{t_0}^t u(s)\,ds$. Alors $u(t) \leqslant a\,e^{b(t - t_0)}$.

      (ii) Si $F$ est $L$-lipschitzienne en $y$ sur une partie contenant les graphes de deux solutions $y$ et $z$ définies sur un même intervalle $J \ni t_0$, alors $\|y(t) - z(t)\| \leqslant \|y(t_0) - z(t_0)\|\,e^{L|t - t_0|}$ sur $J$.
    preuve: |
      (i) Soit $v(t) = a + b\int_{t_0}^t u$, dérivable de dérivée $bu \leqslant bv$ ({{ar-tfa|Théorème fondamental}}). La fonction $v(t)e^{-b(t - t_0)}$ a pour dérivée $(v' - bv)e^{-b(t - t_0)} \leqslant 0$ ; elle décroît, et
      $$u \leqslant v \leqslant v(t_0)e^{b(t - t_0)} = ae^{b(t - t_0)}.$$

      (ii) Soit $t \geqslant t_0$. On a
      $$\begin{aligned} &y(t) - z(t) = y(t_0) - z(t_0) \\ &\quad + \int_{t_0}^t \big(F(s, y) - F(s, z)\big)\,ds, \end{aligned}$$
      d'où
      $$u(t) = \|y(t) - z(t)\| \leqslant u(t_0) + L\int_{t_0}^t u,$$
      et l'on applique (i). Le cas $t \leqslant t_0$ se ramène au précédent en changeant $t$ en $-t$.
    remarques:
      - |
        L'estimation (ii) est optimale : pour $y' = Ly$, deux solutions s'écartent exactement comme $e^{Lt}$. C'est la **sensibilité aux conditions initiales** : une erreur de $10^{-10}$ sur la donnée initiale devient de l'ordre de $1$ après un temps $10 \ln 10/L \approx 23/L$. Les systèmes chaotiques, comme celui de Lorenz, réalisent cette croissance exponentielle de façon durable.

  - id: ed-maximales
    etiquette: Solutions maximales
    nature: théorème
    titre: Solutions maximales et critère d'explosion
    texte: |
      On suppose désormais $F$ de classe $C^1$ sur l'ouvert $\Omega$. Une solution est **maximale** si elle n'est la restriction d'aucune solution définie sur un intervalle strictement plus grand.
    enonce: |
      (i) Deux solutions qui coïncident en un point coïncident sur l'intersection de leurs intervalles de définition.

      (ii) Par tout point $(t_0, y_0) \in \Omega$ passe une unique solution maximale, définie sur un intervalle ouvert $]\alpha, \beta[$.

      (iii) *Explosion.* Si $\Omega = I \times \lex{n-uplet}{\mathbb R^n}$ avec $I$ un intervalle ouvert, et si $\beta < \sup I$, alors $\|y(t)\| \to +\infty$ quand $t \to \beta$.

      (iv) Si $\|F(t, y)\| \leqslant c(t)(1 + \|y\|)$ avec $c$ continue sur $I$, les solutions maximales sont définies sur $I$ tout entier.
    preuve: |
      (i) L'ensemble des $t$ où elles coïncident est fermé dans l'intervalle commun, par continuité, et ouvert, par l'unicité locale ({{ed-cauchy-lipschitz|Cauchy-Lipschitz}}) : sur un cylindre compact convexe autour d'un point de $\Omega$, $F$ est lipschitzienne en $y$ par l'inégalité des accroissements finis ({{gd-accroissements|Accroissements finis}}). Par connexité, il est égal à l'intervalle entier.

      (ii) Par (i), la réunion des graphes de toutes les solutions passant par $(t_0, y_0)$ est le graphe d'une fonction, définie sur la réunion de leurs intervalles, qui est une solution ; elle est maximale par construction. Aucun choix n'intervient : on prend la réunion de toutes. Si l'intervalle contenait l'une de ses extrémités, Cauchy-Lipschitz en ce point prolongerait la solution.

      (iii) Si $\|y\|$ ne tendait pas vers l'infini, il existerait $R$ et une suite $t_k \to \beta$ avec $\|y(t_k)\| \leqslant R$.

      Sur le compact $K = [t_0, \beta + \delta] \times \bar B(0, R + 1)$, pour un $\delta > 0$ tel que $[t_0, \beta + \delta] \subset I$, $F$ est bornée par $M$ ; les cylindres de rayon $r = 1$ et de demi-hauteur $a = \delta$ centrés en $(t_k, y(t_k))$ y sont contenus, et Cauchy-Lipschitz fournit une solution sur $[t_k - h, t_k + h]$ avec $h = \min(\delta, 1/M)$ indépendant de $k$.

      Pour $t_k > \beta - h$, elle prolonge $y$ au-delà de $\beta$ par (i) : contradiction.

      (iv) Sur $[t_0, \beta[$, on a
      $$\begin{aligned} \|y(t)\| &\leqslant \|y_0\| \\ &\quad + \int_{t_0}^t c(s)(1 + \|y(s)\|)\,ds. \end{aligned}$$
      Si $\beta < \sup I$, $c$ est bornée par $C$ sur $[t_0, \beta]$, et Grönwall ({{ed-gronwall|Grönwall}}) appliqué à $1 + \|y\|$ montre que $\|y\|$ reste bornée, ce que (iii) interdit.
    remarques:
      - |
        L'équation $y' = y^2$, $y(0) = 1$, a pour solution maximale $y(t) = \frac{1}{1 - t}$, définie sur $]{-\infty}, 1[$ : elle explose en temps fini, bien que $F(t, y) = y^2$ soit définie et régulière partout.

        ```schema ed-maximales
        La solution maximale $y = \frac{1}{1 - t}$ sort de la bande $|y| \leqslant R$ à l'instant $1 - \frac1R$, soit $\frac12$ pour $R = 2$ et $\frac45$ pour $R = 5$, et n'y revient plus, puisqu'elle est croissante : elle tend vers $+\infty$ quand $t$ tend vers $1$, comme l'annonce (iii).
        ```

        L'erreur la plus répandue est de croire qu'une équation à second membre partout défini a des solutions partout définies ; c'est la croissance de $F$ qui en décide, comme le montre (iv).

  - id: ed-compacts
    etiquette: Sortie des compacts
    nature: lemme
    titre: Voisinages compacts et sortie des compacts
    texte: |
      Pour une partie $A$ de $\lex{n-uplet}{\mathbb R^m}$, muni de $\|\cdot\|_\infty$, et pour $\delta \geqslant 0$, on note $A^\delta$ la réunion des boules fermées $\bar B(a, \delta)$, $a \in A$ : c'est l'ensemble des points situés à distance au plus $\delta$ d'un point de $A$.

      Comme au nœud {{ed-maximales|Solutions maximales}}, $F$ est de classe $C^1$ sur un ouvert $\Omega$ de $\lex{ensemble-reels}{\mathbb R} \times \mathbb R^n$.
    enonce: |
      (i) *Voisinage compact.* Si $K$ est une partie [[compact|compacte]] de $\mathbb R^m$, $K^\delta$ est compacte pour tout $\delta \geqslant 0$. Si de plus $K$ est contenue dans un ouvert $W$, il existe $\delta > 0$ tel que $K^\delta \subset W$.

      (ii) *Sortie des compacts.* Soit $y$ une solution maximale de $y' = F(t, y)$, définie sur $]\alpha, \beta[$, et $t_0 \in \,]\alpha, \beta[$. Si $\beta < +\infty$, le graphe $\{(t, y(t)) : t_0 \leqslant t < \beta\}$ n'est contenu dans aucun compact de $\Omega$. De même, si $\alpha > -\infty$, le graphe de $y$ sur $]\alpha, t_0]$ n'est contenu dans aucun compact de $\Omega$.

      (iii) *Cas autonome.* Si $\Omega = \mathbb R \times U$, avec $U$ ouvert de $\mathbb R^n$, et $F(t, y) = X(y)$, et si $\beta < +\infty$, la courbe $\{y(t) : t_0 \leqslant t < \beta\}$ n'est contenue dans aucun compact de $U$ ; de même du côté de $\alpha$.
    preuve: |
      (i) Si $K$ est vide, $K^\delta$ l'est aussi. Sinon, $K$ est bornée ({{me-rn|L'espace ℝⁿ}}, (iii)), contenue dans une boule $\bar B(0, R)$, et $K^\delta$ est contenue dans $\bar B(0, R + \delta)$ par l'inégalité triangulaire.

      Montrons que $K^\delta$ est fermée. Soit $y \notin K^\delta$. La fonction $a \mapsto \|y - a\|$ est continue sur le compact $K$ et y atteint son minimum $\mu$ en un point $a_0$ ({{tr-compacts|Compacts de ℝ}}, (iii)) ; comme $y \notin \bar B(a_0, \delta)$, on a $\mu > \delta$.

      Pour $z \in B(y, \mu - \delta)$ et $a \in K$, on a alors
      $$\begin{aligned} \|z - a\| &\geqslant \|y - a\| - \|y - z\| \\ &> \mu - (\mu - \delta) = \delta, \end{aligned}$$
      donc $z \notin K^\delta$. Le complémentaire de $K^\delta$ est ouvert ; $K^\delta$, fermée et bornée, est compacte ({{me-rn|L'espace ℝⁿ}}, (iii)).

      Supposons enfin $K \subset W$ et $K$ non vide. Si $W = \mathbb R^m$, tout $\delta$ convient. Sinon, posons $f(a) = \inf\{\|a - z\| : z \notin W\}$. L'inégalité $\|a - z\| \leqslant \|a - b\| + \|b - z\|$, passée à la borne inférieure en $z$, donne $f(a) \leqslant \|a - b\| + f(b)$ ; en échangeant $a$ et $b$, $|f(a) - f(b)| \leqslant \|a - b\|$ : $f$ est $1$-lipschitzienne, donc continue ({{me-topologie|Topologie d'une distance}}, (iv)).

      Pour $a \in W$, l'ouvert $W$ contient une boule $B(a, r)$ ({{me-topologie|Topologie d'une distance}}, (i)), et $f(a) \geqslant r > 0$. Sur le compact $K$, $f$ atteint donc un minimum $m > 0$, et $\delta = m/2$ convient : si $\|y - a\| \leqslant m/2$ avec $a \in K$, alors $\|y - a\| < f(a)$, ce qui interdit $y \notin W$. Aucun choix n'intervient : $f$ est définie par une borne inférieure.

      (ii) Supposons $\beta < +\infty$ et le graphe contenu dans un compact $K$ de $\Omega$. Par (i), dans $\mathbb R^{1+n}$, il existe $\delta > 0$ tel que $K^\delta$ soit un compact contenu dans $\Omega$. Les fonctions continues $\|F\|$ et $|||dF|||$ y sont bornées ({{tr-compacts|Compacts de ℝ}}, (iii)), par $M$ et $L$ ; quitte à agrandir $M$, on suppose $M \geqslant 1$.

      Soit $(t_1, y_1) \in K$. La boule ouverte de centre $(t_1, y_1)$ et de rayon $\delta$ pour $\|\cdot\|_\infty$ est $]t_1 - \delta, t_1 + \delta[ \times B(y_1, \delta)$ ; elle est contenue dans $K^\delta$, et elle contient le cylindre
      $$C = [t_1 - \tfrac\delta2, t_1 + \tfrac\delta2] \times \bar B(y_1, \tfrac\delta2),$$
      sur lequel $\|F\| \leqslant M$.

      Pour $t$ fixé, l'application $g(z) = F(t, z)$ est différentiable sur la boule convexe $B(y_1, \delta)$, de différentielle $k \mapsto dF(t, z)(0, k)$ par la règle de la chaîne ({{gd-differentielle|Différentielle}}, (iii) et (iv)), de norme au plus $L$ puisque $\|(0, k)\|_\infty = \|k\|_\infty$. Par l'inégalité des accroissements finis ({{gd-accroissements|Accroissements finis}}, (ii)), $F$ est $L$-lipschitzienne en $y$ sur $C$.

      Le théorème {{ed-cauchy-lipschitz|Cauchy-Lipschitz}}, (ii), fournit donc une solution $z$ sur $[t_1 - h, t_1 + h]$ telle que $z(t_1) = y_1$, avec $h = \frac{\delta}{2M}$, qui ne dépend pas du point $(t_1, y_1)$ de $K$.

      Prenons $t_1 = \max(t_0, \beta - \frac h2)$ et $y_1 = y(t_1)$. Par {{ed-maximales|Solutions maximales}}, (i), $z$ et $y$ coïncident sur l'intersection de leurs intervalles. La fonction égale à $y$ sur $]\alpha, \beta[$ et à $z$ sur $[t_1 - h, t_1 + h]$ est donc bien définie ; elle est solution, puisqu'au voisinage de chaque point elle coïncide avec $y$ ou avec $z$.

      Elle est définie jusqu'en $t_1 + h \geqslant \beta + \frac h2 > \beta$, ce qui contredit la maximalité de $y$. Du côté de $\alpha$, on prend $t_1 = \min(t_0, \alpha + \frac h2)$ et l'on prolonge au-delà de $\alpha$ de la même façon.

      (iii) Si la courbe est contenue dans un compact $K$ de $U$, le graphe est contenu dans $[t_0, \beta] \times K$.

      Cette partie de $\mathbb R^{1+n}$ est bornée, et fermée comme intersection des images réciproques de $[t_0, \beta]$ et de $K$ par les deux projections, qui sont continues, $K$ étant fermé comme partie compacte de l'espace séparé $\mathbb R^n$ ({{t-compact-prop|Parties compactes}}, (ii)) ; elle est donc compacte ({{me-rn|L'espace ℝⁿ}}, (iii)), contenue dans $\Omega = \mathbb R \times U$, ce que (ii) interdit.
    remarques:
      - |
        L'erreur la plus répandue est de croire qu'une solution qui reste bornée est définie pour tous les temps. Pour le champ constant $X = -1$ sur $U = \,]0, +\infty[$, la solution issue de $x > 0$ est $x - t$ : elle reste dans $]0, x]$ et n'explose pas, mais elle n'est définie que pour $t < x$, puisqu'elle atteint le bord $0$ de $U$ à l'instant $x$.

        C'est pourquoi le critère d'explosion de {{ed-maximales|Solutions maximales}}, (iii), énoncé pour $\Omega = I \times \mathbb R^n$, ne s'applique pas à un ouvert $U$ quelconque : la courbe peut cesser d'exister en s'approchant du bord de $U$. Le point (iii) en est la forme juste : sur $[0, x[$, la courbe sort de tout segment $[\varepsilon, M]$ de $U$, dès que $t > x - \varepsilon$.
      - |
        Pour $\Omega = I \times \mathbb R^n$, le nœud {{ed-maximales|Solutions maximales}} donnait davantage : $\|y(t)\| \to +\infty$ quand $t \to \beta$. L'énoncé (ii), plus faible, a l'avantage de valoir sur tout ouvert, et il suffit à ce qui suit : une solution ne s'arrête jamais à l'intérieur d'un compact. C'est sous la forme (iii) que l'emploie le nœud {{ed-flot|Flot}}, et, à travers lui, le nœud {{ed-domaine-flot|Domaine du flot}}.

  - id: ed-lineaires
    etiquette: Systèmes linéaires
    nature: théorème
    titre: Systèmes linéaires et exponentielle de matrices
    texte: |
      Un système **linéaire** est $y' = A(t)y + b(t)$, avec $A : I \to \lex{espace-matrices}{\mathcal M_n}(\lex{ensemble-reels}{\mathbb R})$ et $b : I \to \lex{n-uplet}{\mathbb R^n}$ continues sur un intervalle ouvert $I$. L'[[exponentielle-matrice|exponentielle]] d'une matrice est
      $$e^A = \sum_{k \geqslant 0} \frac{A^k}{k!}.$$
    enonce: |
      (i) Les solutions maximales sont définies sur $I$. Celles du système homogène $y' = A(t)y$ forment un espace vectoriel de dimension $n$, l'application $y \mapsto y(t_0)$ en étant un isomorphisme.

      (ii) La série $e^A$ converge dans $\mathcal M_n(\mathbb R)$ ; $t \mapsto e^{tA}$ est dérivable, de dérivée $Ae^{tA}$, et $e^{(s+t)A} = e^{sA}e^{tA}$. Si $AB = BA$, $e^{A+B} = e^Ae^B$. Pour $A$ constante, la solution de $y' = Ay$, $y(t_0) = y_0$, est $e^{(t - t_0)A}y_0$.

      (iii) *Liouville.* $\det e^{tA} = e^{t\operatorname{tr}A}$ ; en particulier $e^A$ est inversible.
    preuve: |
      (i) $\|A(t)y + b(t)\| \leqslant c(t)(1 + \|y\|)$ avec $c = \max(|||A|||, \|b\|)$ continue : on applique {{ed-maximales|Solutions maximales}}, (iv). L'application $y \mapsto y(t_0)$ est linéaire, injective par l'unicité, surjective par l'existence.

      (ii) $|||A^k||| \leqslant |||A|||^k$ ({{gd-equivalence|Équivalence des normes}}), et la série converge absolument dans l'espace complet $\mathcal M_n(\mathbb R)$.

      Sur tout segment, la série $\sum \frac{t^kA^k}{k!}$ converge uniformément ; en intégrant terme à terme, $Y(t) = e^{tA}$ vérifie
      $$Y(t) = I + \int_0^t AY(s)\,ds,$$
      donc $Y' = AY$.

      Pour $s$ fixé, $t \mapsto e^{(s+t)A}$ et $t \mapsto e^{sA}e^{tA}$ sont solutions de $Z' = AZ$ de même valeur en $0$ : elles coïncident par unicité, appliquée colonne par colonne.

      Si $AB = BA$, $B$ commute avec $e^{tA}$, et $t \mapsto e^{t(A+B)}$ et $t \mapsto e^{tA}e^{tB}$ sont solutions de $Z' = (A + B)Z$, de valeur $I$ en $0$.

      (iii) Soit $f(t) = \det e^{tA}$. Le déterminant est une fonction polynomiale des $n^2$ coefficients, donc de classe $C^\infty$ ({{gd-classe-ck|Classe Cᵏ}}, (iii)), et sa différentielle en $M$ est $H \mapsto \sum_{i,j} \partial_{ij}\det(M)\,h_{ij}$ ({{gd-differentielle|Différentielle}}, (ii)).

      Par le développement suivant la colonne $j$ ({{v-comatrice|Comatrice}}), $\det M = \sum_i m_{ij}C_{ij}$, où les cofacteurs $C_{ij}$ ne dépendent pas de la colonne $j$ : $\partial_{ij}\det(M) = C_{ij}$, et la différentielle est
      $$H \mapsto \sum_{i,j} C_{ij}h_{ij} = \operatorname{tr}\big({}^t\!\operatorname{com}(M)\,H\big)$$
      ({{v-trace|Trace}}, (ii)).

      Par la règle de la chaîne ({{gd-differentielle|Différentielle}}, (iv)), avec la dérivée $Ae^{tA}$ de $t \mapsto e^{tA}$ donnée par (ii),
      $$\begin{aligned} f'(t) &= \operatorname{tr}\big({}^t\!\operatorname{com}(e^{tA})Ae^{tA}\big) \\ &= \operatorname{tr}\big(e^{tA}\,{}^t\!\operatorname{com}(e^{tA})\,A\big) \\ &= f(t)\operatorname{tr}A, \end{aligned}$$
      par $\operatorname{tr}(XY) = \operatorname{tr}(YX)$ puis la formule de la comatrice, et $f(0) = 1$ donne $f(t) = e^{t\operatorname{tr}A}$.
    remarques:
      - |
        Pour $A = \begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}$, on a
        $$e^{tA} = \begin{pmatrix} \cos t & -\sin t \\ \sin t & \cos t \end{pmatrix},$$
        puisque cette matrice vérifie $Y' = AY$ et $Y(0) = I$ : l'exponentielle d'une matrice antisymétrique est une rotation.

        L'erreur la plus répandue est d'écrire $e^{A+B} = e^Ae^B$ sans vérifier que $A$ et $B$ commutent : pour $A = \begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$ et $B = \begin{pmatrix} 0 & 0 \\ 1 & 0 \end{pmatrix}$, on a
        $$e^Ae^B = \begin{pmatrix} 2 & 1 \\ 1 & 1 \end{pmatrix},$$
        alors que $e^{A+B}$ est symétrique de coefficient diagonal $\frac{e + e^{-1}}{2} \approx 1{,}543$.
      - |
        Le comportement de $e^{tA}$ quand $t \to +\infty$ est gouverné par les parties réelles des valeurs propres complexes de $A$ : toutes les solutions de $y' = Ay$ tendent vers $0$ si et seulement si ces parties réelles sont toutes strictement négatives. C'est le point de départ du chapitre {{edo-liapounov|Stabilité des équilibres}}, qui en déduit, par linéarisation, la stabilité des équilibres des systèmes non linéaires.

  - id: ed-flot
    etiquette: Flot
    nature: théorème
    titre: Flot d'un champ de vecteurs
    texte: |
      Soit $U$ un ouvert de $\lex{n-uplet}{\mathbb R^n}$ et $X : U \to \mathbb R^n$ de classe $C^1$, vu comme un champ de vecteurs.

      Pour $x \in U$, on note $t \mapsto \varphi_t(x)$ la solution maximale de l'équation **autonome** $y' = X(y)$ telle que $y(0) = x$, définie sur $]\alpha(x), \beta(x)[$ : c'est la **courbe intégrale** issue de $x$, et $\varphi$ est le [[flot|flot]] de $X$.

      On munit $\mathbb R^n$ de $\|\cdot\|_\infty$, et les matrices de la norme subordonnée $|||\cdot|||$.
    enonce: |
      (i) *Propriété de groupe.* Si $s$ et $t + s$ sont dans l'intervalle de définition, $\varphi_{t+s}(x) = \varphi_t(\varphi_s(x))$.

      (ii) *Continuité.* Supposons $\varphi_t(x_0)$ défini pour $t \in [0, T]$. Il existe un compact $K \subset U$ et un $\delta > 0$ tels que $K$ contienne les boules $\bar B(\varphi_t(x_0), \delta)$, $t \in [0, T]$. Pour un tel couple, soit $L$ le maximum de $|||dX|||$ sur $K$ ; alors, pour $x \in U$ tel que $\|x - x_0\| < \delta e^{-LT}$, $\varphi_t(x)$ est défini pour $t \in [0, T]$, appartient à $K$, et
      $$\|\varphi_t(x) - \varphi_t(x_0)\| \leqslant \|x - x_0\|e^{Lt} < \delta.$$

      (iii) Si $X$ est bornée et $U = \mathbb R^n$, le flot est défini sur $\lex{ensemble-reels}{\mathbb R} \times \mathbb R^n$, et chaque $\varphi_t$ est un homéomorphisme de réciproque $\varphi_{-t}$.
    preuve: |
      (i) Les deux membres, comme fonctions de $t$, sont solutions de $y' = X(y)$ de même valeur $\varphi_s(x)$ en $t = 0$ ; on conclut par l'unicité ({{ed-maximales|Solutions maximales}}, (i)).

      (ii) *Existence de $K$ et $\delta$.* L'ensemble
      $$\Gamma = \{\varphi_t(x_0) : t \in [0, T]\}$$
      est compact, image du segment $[0, T]$ ({{tr-compacts|Compacts de ℝ}}, (i)) par l'application continue $t \mapsto \varphi_t(x_0)$ ({{t-compact-prop|Parties compactes}}, (iii)), et il est contenu dans l'ouvert $U$.

      Le nœud {{ed-compacts|Sortie des compacts}}, (i), fournit $\delta > 0$ tel que $\Gamma^\delta$ soit un compact contenu dans $U$ : le couple $(\Gamma^\delta, \delta)$ convient.

      Désormais, $K$ et $\delta$ sont quelconques, comme dans l'énoncé ; le maximum $L$ existe, $y \mapsto |||dX(y)|||$ étant continue sur le compact $K$ ({{tr-compacts|Compacts de ℝ}}, (iii)).

      *Une intégrale vectorielle.* Pour $v : [0, t] \to \mathbb R^n$ continue, on a $\|\int_0^t v\| \leqslant \int_0^t \|v\|$, puisque $|\int_0^t v_i| \leqslant \int_0^t |v_i| \leqslant \int_0^t \|v\|$ pour chaque coordonnée ({{ri-proprietes|Propriétés de l'intégrale}}, (iv) et (ii)).

      *L'estimation.* Soit $x \in U$ tel que $\|x - x_0\| < \delta e^{-LT}$, et posons $c = \|x - x_0\|e^{LT} < \delta$, $u(s) = \|\varphi_s(x) - \varphi_s(x_0)\|$, et $I_x = [0, T] \cap [0, \beta(x)[$. Soit $E$ l'ensemble des $s \in I_x$ tels que $u(\sigma) < \delta$ pour tout $\sigma \in [0, s]$ ; c'est un intervalle qui contient $0$, puisque $u(0) \leqslant c$.

      Pour $s \in E$ et $\sigma \in [0, s]$, les points $\varphi_\sigma(x)$ et $\varphi_\sigma(x_0)$ sont dans la boule ouverte $B(\varphi_\sigma(x_0), \delta)$, convexe et contenue dans $K$, où $|||dX||| \leqslant L$. L'inégalité des accroissements finis ({{gd-accroissements|Accroissements finis}}, (ii)), appliquée sur cet ouvert convexe, donne
      $$\|X(\varphi_\sigma(x)) - X(\varphi_\sigma(x_0))\| \leqslant L\,u(\sigma).$$

      Par la forme intégrale des solutions ({{ed-cauchy-lipschitz|Cauchy-Lipschitz}}, (ii)) et l'inégalité précédente sur les intégrales, $u(\sigma) \leqslant u(0) + L\int_0^\sigma u$ pour $\sigma \in [0, s]$, et le lemme de Grönwall ({{ed-gronwall|Grönwall}}, (i)) donne $u(\sigma) \leqslant \|x - x_0\|e^{L\sigma} \leqslant c$ sur $[0, s]$.

      *Tout $I_x$ est dans $E$.* Soit $s^*$ la borne supérieure de $E$. Premier cas, $s^* \in I_x$ : alors $u \leqslant c$ sur $[0, s^*[$, donc $u(s^*) \leqslant c < \delta$ par continuité, et $s^* \in E$. Si $s^*$ n'était pas le plus grand élément de $I_x$, la continuité de $u$ en $s^*$ donnerait $u < \delta$ un peu au-delà de $s^*$, contre la définition de $s^*$ ; donc $E = I_x$.

      Second cas, $s^* \notin I_x$ : comme $s^* \leqslant T$, c'est que $s^* = \beta(x) \leqslant T$, et $I_x = [0, \beta(x)[$ ; l'intervalle $E$, qui contient $0$ et a la même borne supérieure, est alors égal à $I_x$.

      *Conclusion.* Dans le second cas, la courbe issue de $x$ resterait, sur $[0, \beta(x)[$, dans le compact $K$, ce qu'interdit le nœud {{ed-compacts|Sortie des compacts}}, (iii). On est donc dans le premier cas : $I_x$ a un plus grand élément, ce qui impose $\beta(x) > T$, et $s^* = T$, $E = I_x = [0, T]$ : pour tout $t \in [0, T]$, $\varphi_t(x)$ est défini, vérifie l'estimation, et appartient à $B(\varphi_t(x_0), \delta) \subset K$.

      (iii) $\|y(t)\| \leqslant \|x\| + |t|\sup\|X\|$ ne peut tendre vers l'infini en temps fini ; donc $\alpha = -\infty$ et $\beta = +\infty$, par le critère d'explosion ({{ed-maximales|Solutions maximales}}, (iii), avec $I = \mathbb R$).

      Par (i), $\varphi_t \circ \varphi_{-t} = \varphi_0 = \mathrm{id}$, et $\varphi_t$ est continue par (ii), appliqué à $X$ pour $t \geqslant 0$ et au champ $-X$, lui aussi borné et de classe $C^1$, pour $t \leqslant 0$ : si $y$ résout $y' = X(y)$, $s \mapsto y(-s)$ résout $y' = -X(y)$, si bien que le flot de $-X$ est $\varphi_{-t}$.
    remarques:
      - |
        Le flot est en réalité de classe $C^1$, et même $C^k$ si $X$ l'est : sa différentielle par rapport à $x$ est la solution de l'**équation variationnelle** $Z' = dX(\varphi_t(x))\,Z$, $Z(0) = I$.

        C'est le théorème du nœud {{ed-variationnelle|Équation variationnelle}}, dont la démonstration applique Grönwall au reste de Taylor, une fois établi au nœud {{ed-domaine-flot|Domaine du flot}} que l'ensemble des $(t, x)$ où le flot est défini est ouvert et que $\varphi$ y est continue. La classe $C^k$ fait l'objet du nœud {{ed-flot-ck|Flot de classe Cᵏ}}. Chaque $\varphi_t$ est ainsi un difféomorphisme de l'ouvert où il est défini sur celui où $\varphi_{-t}$ l'est.

  - id: ed-domaine-flot
    etiquette: Domaine du flot
    nature: proposition
    titre: Domaine du flot, continuité et réciproque de φₜ
    texte: |
      Soit $U$ un ouvert de $\lex{n-uplet}{\mathbb R^n}$, $X : U \to \mathbb R^n$ de classe $C^1$ et $\varphi$ son [[flot|flot]] ({{ed-flot|Flot}}), la courbe intégrale issue de $x$ étant définie sur $]\alpha(x), \beta(x)[$. Le [[domaine-flot|domaine du flot]] est
      $$D = \{(t, x) \in \mathbb R \times U : \alpha(x) < t < \beta(x)\},$$
      et, pour $t$ réel, $D_t = \{x \in U : (t, x) \in D\}$ est l'ensemble des points où $\varphi_t$ est défini.

      On munit $\mathbb R^n$ de $\|\cdot\|_\infty$, et les matrices de la norme subordonnée $|||\cdot|||$. Pour une partie $A$ de $\mathbb R^n$, $A^\delta$ est la réunion des boules fermées de rayon $\delta$ centrées en un point de $A$ ({{ed-compacts|Sortie des compacts}}).
    enonce: |
      (i) *Renversement du temps.* Le champ $-X$ est de classe $C^1$, et son flot est $\psi_t(x) = \varphi_{-t}(x)$, défini pour $-\beta(x) < t < -\alpha(x)$.

      (ii) *Estimation uniforme.* Soit $x_0 \in U$ et $[a, b]$ un segment contenant $0$ et contenu dans $]\alpha(x_0), \beta(x_0)[$. Posons $T = \max(-a, b)$ et $\Gamma = \{\varphi_t(x_0) : a \leqslant t \leqslant b\}$. Il existe $\delta > 0$ tel que $K = \Gamma^\delta$ soit un compact contenu dans $U$ ; soit $L$ le maximum de $|||dX|||$ sur $K$.

      Alors, pour $x \in U$ tel que $\|x - x_0\| < \delta e^{-LT}$ et pour $t \in [a, b]$, $\varphi_t(x)$ est défini, appartient à $K$, et
      $$\|\varphi_t(x) - \varphi_t(x_0)\| \leqslant \|x - x_0\|\,e^{L|t|} < \delta.$$

      (iii) *Ouverture et continuité.* $D$ est un ouvert de $\mathbb R \times \mathbb R^n$, et $(t, x) \mapsto \varphi_t(x)$ est continue sur $D$.

      (iv) *Réciproque.* Pour tout réel $t$, $D_t$ est ouvert, et $\varphi_t$ est une bijection de $D_t$ sur $D_{-t}$, de réciproque $\varphi_{-t}$.
    preuve: |
      (i) Si $y : J \to U$ est solution de $y' = X(y)$, la fonction $z(t) = y(-t)$, définie sur $-J$, vérifie $z'(t) = -y'(-t) = -X(z(t))$ par la règle de la chaîne ({{gd-differentielle|Différentielle}}, (ii) et (iv)), et réciproquement.

      Le changement de $t$ en $-t$ échange donc les solutions des deux équations et respecte l'inclusion des intervalles, donc la maximalité : la solution maximale de $y' = -X(y)$ issue de $x$ est $t \mapsto \varphi_{-t}(x)$, sur $]{-\beta(x)}, -\alpha(x)[$. Enfin $-X$ est de classe $C^1$, de différentielle $-dX$.

      (ii) *Les constantes.* $\Gamma$ est compact, image du segment $[a, b]$ ({{tr-compacts|Compacts de ℝ}}, (i)) par l'application continue $t \mapsto \varphi_t(x_0)$ ({{t-compact-prop|Parties compactes}}, (iii)). Le nœud {{ed-compacts|Sortie des compacts}}, (i), fournit $\delta$, et $L$ existe puisque $y \mapsto |||dX(y)|||$ est continue sur le compact $K$ ({{tr-compacts|Compacts de ℝ}}, (iii)).

      *Les temps positifs.* Le compact $K = \Gamma^\delta$ contient les boules $\bar B(\varphi_t(x_0), \delta)$ pour $t \in [0, b]$, et $L$ est le maximum de $|||dX|||$ sur $K$. Comme $b \leqslant T$, la condition $\|x - x_0\| < \delta e^{-LT}$ entraîne $\|x - x_0\| < \delta e^{-Lb}$, et le nœud {{ed-flot|Flot}}, (ii), appliqué sur $[0, b]$ avec ce compact, donne exactement l'estimation cherchée pour $t \in [0, b]$, avec $\varphi_t(x) \in K$.

      *Les temps négatifs.* Le champ $-X$ a pour flot $\psi_t = \varphi_{-t}$, par (i). Le segment $[-b, -a]$ contient $0$ et est contenu dans $]{-\beta(x_0)}, -\alpha(x_0)[$ ; il donne les mêmes $T$, $\Gamma$, $\delta$ et $K$, et le même $L$ puisque $|||d(-X)||| = |||dX|||$.

      Le nœud {{ed-flot|Flot}}, (ii), appliqué à $-X$ sur $[0, -a]$ avec le même compact $K$, qui contient les boules $\bar B(\psi_t(x_0), \delta)$ pour $t \in [0, -a]$, est l'estimation cherchée pour $t \in [a, 0]$.

      (iii) Soit $(t_1, x_0) \in D$. Comme $\alpha(x_0) < \min(t_1, 0)$ et $\max(t_1, 0) < \beta(x_0)$, il existe $\eta > 0$ tel que le segment $[a, b] = [\min(t_1, 0) - \eta, \max(t_1, 0) + \eta]$ soit contenu dans $]\alpha(x_0), \beta(x_0)[$ ; il contient $0$, et $t_1 \in \,]a, b[$. Soit $\rho = \delta e^{-LT}$, avec les constantes de (ii).

      Par (ii), $]a, b[ \times B(x_0, \rho)$ est contenu dans $D$ ; c'est un ouvert qui contient $(t_1, x_0)$, donc $D$ est ouvert. Pour $(t, x)$ dans cet ouvert,
      $$\begin{aligned} &\|\varphi_t(x) - \varphi_{t_1}(x_0)\| \leqslant \|x - x_0\|\,e^{LT} \\ &\quad + \|\varphi_t(x_0) - \varphi_{t_1}(x_0)\|, \end{aligned}$$
      qui tend vers $0$ quand $(t, x) \to (t_1, x_0)$, par continuité de la solution issue de $x_0$.

      (iv) $D_t$ est l'image réciproque de l'ouvert $D$ par l'application continue $x \mapsto (t, x)$. Soit $x \in D_t$ et $y = \varphi_t(x)$. La fonction $s \mapsto \varphi_{s+t}(x)$, définie sur $]\alpha(x) - t, \beta(x) - t[$, est solution de l'équation autonome $y' = X(y)$ et vaut $y$ en $0$.

      Par {{ed-maximales|Solutions maximales}}, (i), elle coïncide avec $s \mapsto \varphi_s(y)$ sur l'intersection de leurs intervalles ; la fonction égale à l'une ou à l'autre sur la réunion, qui est un intervalle contenant $0$, est une solution qui prolonge la solution maximale issue de $y$. Donc $]\alpha(x) - t, \beta(x) - t[ \;\subset\; ]\alpha(y), \beta(y)[$.

      Comme $0 \in \,]\alpha(x), \beta(x)[$, le réel $-t$ appartient au premier intervalle : $y \in D_{-t}$, et $\varphi_{-t}(y) = \varphi_{-t+t}(x) = x$. Ainsi $\varphi_{-t} \circ \varphi_t$ est l'identité de $D_t$ ; en changeant $t$ en $-t$, $\varphi_t \circ \varphi_{-t}$ est l'identité de $D_{-t}$, et $\varphi_t$ est une bijection de $D_t$ sur $D_{-t}$.
    remarques:
      - |
        Pour l'équation $y' = y^2$ sur $U = \mathbb R$, la solution issue de $x$ est $\varphi_t(x) = \frac{x}{1 - tx}$, définie tant que $tx < 1$ : le domaine du flot est $D = \{(t, x) : tx < 1\}$.

        ```schema ed-domaine-flot
        En gris, la région $tx \geqslant 1$, hors du domaine $D$ ; les deux branches de l'hyperbole $tx = 1$, en rouge, n'appartiennent pas à $D$, qui est ouvert. $D$ n'est pas un produit : la verticale $t = \frac12$ le coupe selon $D_{1/2} = \,]{-\infty}, 2[$, en bleu, que $\varphi_{1/2}$ envoie bijectivement sur $D_{-1/2} = \,]{-2}, +\infty[$, en vert.
        ```

        On vérifie en effet que $\varphi_{1/2}(x) = \frac{2x}{2 - x}$ croît de $-2$ à $+\infty$ quand $x$ parcourt $]{-\infty}, 2[$, et que $\varphi_{-1/2}\big(\varphi_{1/2}(x)\big) = x$. L'erreur la plus répandue est de voir dans $\varphi_t$ une bijection de $U$ : elle n'est définie que sur $D_t$, et son image est $D_{-t}$, qui en diffère en général.
      - |
        Le point (iii) dit que le temps d'existence ne peut pas chuter brusquement : si $\beta(x_0) > t$, alors $\beta(x) > t$ pour $x$ voisin de $x_0$. Il peut en revanche augmenter brusquement, et $\beta$ n'est pas continue en général.

        Pour le champ constant $X = (1, 0)$ sur $U = \mathbb R^2$ privé de la demi-droite $\{(1, s) : s \geqslant 0\}$, on a $\beta(0, s) = 1$ pour $s \geqslant 0$, mais $\beta(0, s) = +\infty$ pour $s < 0$ : la courbe issue d'un point situé sous la demi-droite passe sans la rencontrer.

  - id: ed-variationnelle
    etiquette: Équation variationnelle
    nature: théorème
    titre: Différentiabilité du flot et équation variationnelle
    texte: |
      Soit $X : U \to \lex{n-uplet}{\mathbb R^n}$ de classe $C^1$ sur un ouvert $U$, $\varphi$ son flot et $D$ son domaine ({{ed-domaine-flot|Domaine du flot}}). Pour $x \in U$, la fonction $A_x(s) = dX(\varphi_s(x))$ est continue sur $]\alpha(x), \beta(x)[$, comme composée de deux applications continues.

      L'[[equation-variationnelle|équation variationnelle]] le long de la courbe issue de $x$ est le système linéaire matriciel
      $$Z' = dX(\varphi_s(x))\,Z, \qquad Z(0) = I.$$
      Résolu colonne par colonne, il a une unique solution $Z_x$, définie sur $]\alpha(x), \beta(x)[$ tout entier ({{ed-lineaires|Systèmes linéaires}}, (i)). On munit $\mathbb R^n$ de $\|\cdot\|_\infty$, et les matrices de la norme subordonnée $|||\cdot|||$.
    enonce: |
      (i) *Différentiabilité.* Pour tout $(t, x) \in D$, l'application $\varphi_t$ est [[differentiable]] en $x$, et
      $$d\varphi_t(x) = Z_x(t).$$

      (ii) *Classe $C^1$.* L'application $(t, x) \mapsto Z_x(t)$ est continue sur $D$, et $(t, x) \mapsto \varphi_t(x)$ est [[classe-ck|de classe $C^1$]] sur $D$, de dérivée partielle $X(\varphi_t(x))$ par rapport à $t$ et de différentielle $Z_x(t)$ par rapport à $x$.

      (iii) *Difféomorphismes.* Pour tout réel $t$, $\varphi_t$ est un [[diffeomorphisme|$C^1$-difféomorphisme]] de $D_t$ sur $D_{-t}$, de réciproque $\varphi_{-t}$. En particulier, $Z_x(t)$ est inversible, d'inverse $Z_{\varphi_t(x)}(-t)$.
    preuve: |
      *Deux inégalités sur les intégrales.* Pour $v : [0, t] \to \mathbb R^n$ continue, on a $\|\int_0^t v\| \leqslant \int_0^t \|v\|$, puisque $|\int_0^t v_i| \leqslant \int_0^t |v_i| \leqslant \int_0^t \|v\|$ pour chaque coordonnée ({{ri-proprietes|Propriétés de l'intégrale}}). Pour une fonction matricielle continue $M$ et $\|w\| \leqslant 1$, $\big(\int_0^t M\big)w = \int_0^t Mw$ donne alors $|||\int_0^t M||| \leqslant \int_0^t |||M|||$.

      *Les constantes.* Fixons $x_0 \in U$ et un segment $[a, b]$ comme au nœud {{ed-domaine-flot|Domaine du flot}}, (ii), avec les mêmes $T$, $\Gamma$, $\delta$, $K$ et $L$, et posons $\rho = \delta e^{-LT}$. La fonction
      $$\begin{aligned} \omega(r) = \sup\big\{&|||dX(y) - dX(y')||| : \\ &y, y' \in K,\ \|y - y'\| \leqslant r\big\} \end{aligned}$$
      est bien définie, majorée par $2L$, et croissante.

      Elle tend vers $0$ quand $r \to 0$ : par le théorème de Heine ({{me-heine|Théorème de Heine}}), appliqué à $dX$, continue sur le compact $K$, il existe pour tout $\varepsilon > 0$ un $\eta > 0$ tel que $\omega(r) \leqslant \varepsilon$ pour $r < \eta$.

      *Bornes sur $Z$.* Pour $\|x - x_0\| < \rho$ et $s \in [a, b]$, $\varphi_s(x) \in K$, donc $|||A_x(s)||| \leqslant L$. De $Z_x(t) = I + \int_0^t A_xZ_x$ ({{ed-cauchy-lipschitz|Cauchy-Lipschitz}}, (ii), forme intégrale) on tire, pour $t \in [0, b]$, $|||Z_x(t)||| \leqslant 1 + L\int_0^t |||Z_x|||$, et Grönwall ({{ed-gronwall|Grönwall}}, (i)) donne $|||Z_x(t)||| \leqslant e^{LT}$.

      *Étape 1 : le reste de Taylor.* Soit $h$ tel que $0 < \|h\| < \rho$, $x = x_0 + h$ et $r = \|h\|e^{LT} < \delta$. Pour $s \in [0, b]$, posons $p = \varphi_s(x_0)$ et $q = \varphi_s(x)$, de sorte que $\|q - p\| \leqslant r$ ({{ed-domaine-flot|Domaine du flot}}, (ii)).

      L'application $g(y) = X(y) - dX(p)y$ est différentiable sur la boule ouverte $V = B(p, \min(2r, \delta))$, convexe et contenue dans $K$, de différentielle $dX(y) - dX(p)$ ({{gd-differentielle|Différentielle}}, (iii)), de norme au plus $\omega(2r)$. Comme $q \in V$, l'inégalité des accroissements finis ({{gd-accroissements|Accroissements finis}}, (ii)), appliquée à $g$ entre $p$ et $q$, donne
      $$\begin{aligned} &\|X(q) - X(p) - dX(p)(q - p)\| \\ &\quad \leqslant \omega(2r)\,r. \end{aligned}$$

      *Étape 2 : Grönwall.* Posons $u(t) = \varphi_t(x) - \varphi_t(x_0) - Z_{x_0}(t)h$ et notons $R(s)$ le vecteur que l'on vient de majorer. Par les formes intégrales de $\varphi_t(x)$, de $\varphi_t(x_0)$ et de $Z_{x_0}$, et puisque $A_{x_0}(s)u(s) + R(s) = X(q) - X(p) - A_{x_0}(s)Z_{x_0}(s)h$,
      $$u(t) = \int_0^t \big(A_{x_0}(s)u(s) + R(s)\big)\,ds.$$

      Il vient $\|u(t)\| \leqslant T\omega(2r)r + L\int_0^t \|u\|$ pour $t \in [0, b]$, et le lemme de Grönwall donne
      $$\|u(t)\| \leqslant Te^{2LT}\omega(2\|h\|e^{LT})\,\|h\|.$$

      *Conclusion pour $t \geqslant 0$.* Posons $\varepsilon(h) = u(t)/\|h\|$ pour $h \neq 0$ et $\varepsilon(0) = 0$. Alors $\varphi_t(x_0 + h) = \varphi_t(x_0) + Z_{x_0}(t)h + \|h\|\,\varepsilon(h)$, et $\|\varepsilon(h)\| \leqslant Te^{2LT}\omega(2\|h\|e^{LT})$ tend vers $0$ avec $h$ : $\varphi_t$ est différentiable en $x_0$, de différentielle $Z_{x_0}(t)$, pour tout $t \in [0, b]$, et la majoration du reste ne dépend pas de $t$.

      *Les temps négatifs.* Le champ $-X$ a pour flot $\psi_s = \varphi_{-s}$ ({{ed-domaine-flot|Domaine du flot}}, (i)), et $W(s) = Z_x(-s)$ vérifie $W'(s) = -A_x(-s)W(s) = d(-X)(\psi_s(x))\,W(s)$ et $W(0) = I$ : par unicité, c'est la solution de l'équation variationnelle de $-X$.

      Le segment $[-b, -a]$ donne pour $-X$ les mêmes constantes ; le cas précédent, appliqué à $-X$, donne $d\varphi_t(x_0) = d\psi_{-t}(x_0) = Z_{x_0}(t)$ pour $t \in [a, 0]$.

      (i) est ainsi démontré, puisque tout $(t, x_0) \in D$ a son temps $t$ dans un tel segment ({{ed-domaine-flot|Domaine du flot}}, preuve de (iii)).

      (ii) *Continuité de $Z$.* Pour $\|h\| < \rho$, $x = x_0 + h$ et $t \in [0, b]$, la différence $V(t) = Z_x(t) - Z_{x_0}(t)$ vérifie
      $$V(t) = \int_0^t \big(A_xV + (A_x - A_{x_0})Z_{x_0}\big)\,ds.$$

      Les points $\varphi_s(x)$ et $\varphi_s(x_0)$ sont dans $K$ à distance au plus $r = \|h\|e^{LT}$, d'où $|||A_x(s) - A_{x_0}(s)||| \leqslant \omega(r)$. Avec $|||Z_{x_0}||| \leqslant e^{LT}$, on obtient $|||V(t)||| \leqslant T\omega(r)e^{LT} + L\int_0^t |||V|||$, puis, par Grönwall, $|||V(t)||| \leqslant Te^{2LT}\omega(\|h\|e^{LT})$. Pour $t \in [a, 0]$, la même majoration s'obtient en passant à $-X$, comme plus haut.

      Tout $(t_1, x_0) \in D$ admet un tel segment $[a, b]$ avec $t_1 \in \,]a, b[$, comme on l'a vu dans la preuve du nœud {{ed-domaine-flot|Domaine du flot}}, (iii). Pour $t \in [a, b]$ et $\|x - x_0\| < \rho$, on a donc
      $$\begin{aligned} &|||Z_x(t) - Z_{x_0}(t_1)||| \\ &\quad \leqslant Te^{2LT}\omega(\|x - x_0\|e^{LT}) \\ &\qquad + |||Z_{x_0}(t) - Z_{x_0}(t_1)|||, \end{aligned}$$
      qui tend vers $0$ quand $(t, x) \to (t_1, x_0)$ : $(t, x) \mapsto Z_x(t)$ est continue sur $D$.

      *Classe $C^1$.* Sur l'ouvert $D$ ({{ed-domaine-flot|Domaine du flot}}, (iii)), la dérivée partielle de $\varphi$ par rapport à $t$ est $X(\varphi_t(x))$, puisque $t \mapsto \varphi_t(x)$ est solution ; elle est continue, comme composée de $X$ et de $\varphi$, continue sur $D$.

      La dérivée partielle par rapport à $x_j$ est $Z_x(t)e_j$, par (i) et {{gd-differentielle|Différentielle}}, (ii) ; elle est continue par ce qui précède. Le nœud {{gd-classe-ck|Classe Cᵏ}}, (i), conclut.

      (iii) Pour $t$ fixé, l'application affine $x \mapsto (t, x)$ envoie l'ouvert $D_t$ dans $D$ ; par composition ({{gd-classe-ck|Classe Cᵏ}}, (iii)), $\varphi_t$ est de classe $C^1$ sur $D_t$, et de même $\varphi_{-t}$ sur $D_{-t}$. Avec {{ed-domaine-flot|Domaine du flot}}, (iv), $\varphi_t$ est un $C^1$-difféomorphisme de $D_t$ sur $D_{-t}$.

      Enfin, la règle de la chaîne ({{gd-differentielle|Différentielle}}, (iv)) appliquée à $\varphi_{-t} \circ \varphi_t = \mathrm{id}$ et à $\varphi_t \circ \varphi_{-t} = \mathrm{id}$ montre que $Z_{\varphi_t(x)}(-t)$ et $Z_x(t)$ sont inverses l'une de l'autre.
    remarques:
      - |
        Le champ $X(y_1, y_2) = (1, y_1^2)$ sur $\mathbb R^2$ a pour flot
        $$\varphi_t(y) = \Big(y_1 + t,\ y_2 + \frac{(y_1 + t)^3 - y_1^3}{3}\Big).$$
        Le long de la courbe issue de $0$, $\varphi_s(0) = (s, \frac{s^3}3)$, et $dX(\varphi_s(0))$ a pour seul coefficient non nul $2s$, en bas à gauche.

        L'équation variationnelle a pour solution la matrice $Z_0(s)$ de lignes $(1, 0)$ et $(s^2, 1)$, qui est bien la matrice jacobienne de $\varphi_s$ en $0$. Au temps $1$, on calcule exactement le reste : $\varphi_1(h) - \varphi_1(0) - Z_0(1)h = (0, h_1^2)$, qui est d'ordre $2$ en $h$, comme (i) le prévoit.

        ```schema ed-variationnelle
        Le cercle gris, de centre $0$ et de rayon $\frac12$, est emporté par le flot au temps $1$ : son image exacte $\varphi_1(\text{cercle})$, en rouge, et l'image $\varphi_1(0) + Z_0(1)h$ par l'approximation linéaire, en bleu, sont deux courbes autour de $\varphi_1(0) = (1, \frac13)$. Pour un même $h$, l'écart entre le point rouge et le point bleu est vertical et vaut $h_1^2 \leqslant \frac14$, d'ordre $2$ en $h$, comme on le voit pour $h = (\frac12, 0)$ ; la courbe verte est la trajectoire du centre.
        ```

        La différentielle $Z_0(1)$ est un cisaillement : elle déforme le cercle en ellipse, et le terme $h_1^2$ courbe encore cette ellipse.
      - |
        Pour $y' = y^2$, la dérivée de $\varphi_t(x) = \frac{x}{1 - tx}$ par rapport à $x$ est $\frac{1}{(1 - tx)^2}$ ; on vérifie qu'elle résout $Z' = 2\varphi_t(x)\,Z$, $Z(0) = 1$. Elle tend vers $+\infty$ quand $t$ s'approche de l'instant d'explosion $\frac1x$ : deux solutions voisines s'écartent d'autant plus vite que l'on s'approche de l'explosion, comme le laisse attendre l'explosion de la solution au nœud {{ed-maximales|Solutions maximales}}.
      - |
        L'hypothèse $C^1$ ne peut pas être affaiblie en une hypothèse lipschitzienne. Le champ $X(y) = |y|$ sur $\mathbb R$ est $1$-lipschitzien, et son flot est $\varphi_t(x) = xe^t$ pour $x \geqslant 0$ et $xe^{-t}$ pour $x < 0$.

        Pour $t \neq 0$, $\varphi_t$ a en $0$ une dérivée à droite $e^t$ et une dérivée à gauche $e^{-t}$ : il n'est pas dérivable. Le flot reste lipschitzien en $x$, de rapport $e^{|t|}$, par le lemme de Grönwall ({{ed-gronwall|Grönwall}}, (ii)), qui ne demande qu'une hypothèse lipschitzienne ; c'est le reste de Taylor de l'étape 1 qui demande la différentiabilité de $X$, et la majoration uniforme de ce reste, la continuité de $dX$.
      - |
        La différentielle du flot transporte le champ : $Z_x(t)X(x) = X(\varphi_t(x))$. En effet, $s \mapsto \varphi_t(\varphi_s(x)) = \varphi_{t+s}(x)$ a pour dérivée en $s = 0$, d'un côté $d\varphi_t(x)X(x)$ par la règle de la chaîne, de l'autre $X(\varphi_t(x))$. Pour $y' = y^2$, on retrouve $\frac{x^2}{(1 - tx)^2} = \varphi_t(x)^2$.

  - id: ed-flot-ck
    etiquette: Flot de classe Cᵏ
    nature: théorème
    titre: Régularité Cᵏ du flot
    texte: |
      On garde les notations des nœuds {{ed-domaine-flot|Domaine du flot}} et {{ed-variationnelle|Équation variationnelle}} : $\varphi$ est le flot d'un champ $X$ sur un ouvert $U$ de $\lex{n-uplet}{\mathbb R^n}$, $D$ son domaine, et $Z_x$ la solution de l'équation variationnelle le long de la courbe issue de $x$. On identifie $\lex{espace-matrices}{\mathcal M_n}(\mathbb R)$ à $\mathbb R^{n^2}$.
    enonce: |
      Soit $k \geqslant 1$, éventuellement infini. Si $X$ est de [[classe-ck|classe $C^k$]] sur $U$, le flot $(t, x) \mapsto \varphi_t(x)$ est de classe $C^k$ sur $D$, l'application $(t, x) \mapsto Z_x(t)$ est de classe $C^{k-1}$, et chaque $\varphi_t$ est un [[diffeomorphisme|$C^k$-difféomorphisme]] de $D_t$ sur $D_{-t}$.
    preuve: |
      *Le système augmenté.* Sur l'ouvert $U \times \mathcal M_n(\mathbb R)$ de $\mathbb R^{n + n^2}$, considérons le champ
      $$G(y, M) = \big(X(y),\ dX(y)M\big).$$
      Si $X$ est de classe $C^{j+1}$, avec $j \geqslant 1$, $dX$ est de classe $C^j$ par définition, le produit $(P, M) \mapsto PM$ est bilinéaire, donc $C^\infty$, et $G$ est de classe $C^j$ ({{gd-classe-ck|Classe Cᵏ}}, (ii) et (iii)).

      *Son flot.* Pour $x \in U$, la fonction $t \mapsto (\varphi_t(x), Z_x(t))$, définie sur $]\alpha(x), \beta(x)[$, est solution de $(y, M)' = G(y, M)$, de valeur $(x, I)$ en $0$, par définition de $\varphi$ et de $Z_x$.

      Elle est maximale : une solution définie sur un intervalle plus grand aurait pour première composante une solution de $y' = X(y)$ prolongeant la solution maximale issue de $x$. Si $\Phi$ désigne le flot de $G$ et $D_G$ son domaine, on a donc, pour $(t, x) \in D$,
      $$\begin{aligned} &(t, x, I) \in D_G, \\ &\Phi_t(x, I) = \big(\varphi_t(x), Z_x(t)\big). \end{aligned}$$

      *Récurrence.* Notons $P(j)$ l'énoncé : pour tout entier $m$, tout ouvert de $\mathbb R^m$ et tout champ de classe $C^j$ sur cet ouvert, le flot est de classe $C^j$ sur son domaine. $P(1)$ est le point (ii) du nœud {{ed-variationnelle|Équation variationnelle}}.

      Supposons $P(j)$, et $X$ de classe $C^{j+1}$. Le champ $G$ est de classe $C^j$, et $P(j)$, appliqué en dimension $n + n^2$, montre que $\Phi$ est de classe $C^j$ sur l'ouvert $D_G$. L'application affine $(t, x) \mapsto (t, x, I)$ envoie $D$ dans $D_G$ ; par composition, $(t, x) \mapsto (\varphi_t(x), Z_x(t))$ est de classe $C^j$ sur $D$.

      La matrice jacobienne de $\varphi$ en $(t, x)$ a pour première colonne $X(\varphi_t(x))$ et pour autres colonnes celles de $Z_x(t)$ ({{ed-variationnelle|Équation variationnelle}}, (ii)). Ses coefficients sont de classe $C^j$, $X \circ \varphi$ comme composée de $X$, de classe $C^{j+1}$, et de $\varphi$, de classe $C^j$. Donc $d\varphi$ est de classe $C^j$, et $\varphi$, qui est $C^1$, est de classe $C^{j+1}$ : c'est $P(j + 1)$.

      *Conclusion.* Pour $X$ de classe $C^k$, on obtient $P(k)$ si $k$ est fini, et $P(j)$ pour tout $j$ si $k = \infty$ ; l'application $Z$, partie de la différentielle de $\varphi$, est de classe $C^{k-1}$. Enfin $\varphi_t$ et $\varphi_{-t}$ sont de classe $C^k$ sur $D_t$ et $D_{-t}$, par composition avec $x \mapsto (t, x)$, et réciproques l'une de l'autre ({{ed-domaine-flot|Domaine du flot}}, (iv)).
    remarques:
      - |
        La récurrence perd une dérivée sur le champ et la regagne sur le flot. Le champ augmenté $G$ n'est que de classe $C^{k-1}$, puisqu'il contient $dX$, et l'hypothèse de récurrence ne donne donc à son flot $\Phi$ que la classe $C^{k-1}$. Le gain vient de ce que la différentielle de $\varphi$ ne fait intervenir que $X \circ \varphi$ et $Z$, qui sont de classe $C^{k-1}$ : $\varphi$, dont la différentielle est $C^{k-1}$, est de classe $C^k$.
      - |
        Pour $y' = y^2$, la dérivée seconde $W = \partial_x^2\varphi_t(x) = \frac{2t}{(1 - tx)^3}$ s'obtient en dérivant l'équation variationnelle par rapport à $x$ : elle résout l'équation linéaire $W' = 2\varphi_t(x)\,W + 2Z^2$, $W(0) = 0$, où $Z = \frac{1}{(1 - tx)^2}$. Chaque dérivée supplémentaire se calcule ainsi par une équation linéaire dont le second membre fait intervenir les dérivées précédentes ; c'est ce qu'encode le système augmenté.
      - |
        Sur une variété, le flot du nœud {{ed-varietes|Champs sur une variété}} est construit dans des cartes. C'est le présent théorème, appliqué dans ces cartes, qui en ferait des difféomorphismes et non seulement des homéomorphismes ; ce passage aux cartes n'est pas rédigé ici.

  - id: ed-varietes
    etiquette: Champs sur une variété
    nature: théorème
    titre: Courbes intégrales d'un champ de vecteurs sur une variété
    texte: |
      Soit $M$ une variété et $X$ un [[champ-vecteurs|champ de vecteurs]] sur $M$. Une **courbe intégrale** de $X$ est une application lisse $\gamma : J \to M$ telle que $\gamma'(t) = X(\gamma(t))$ pour tout $t$, où $\gamma'(t) = T_t\gamma(1) \in \lex{espace-tangent}{T_{\gamma(t)}}M$.
    enonce: |
      (i) Par tout point de $M$ passe une unique courbe intégrale maximale, définie sur un intervalle ouvert contenant $0$.

      (ii) Si $M$ est compacte, toutes les courbes intégrales maximales sont définies sur $\lex{ensemble-reels}{\mathbb R}$ : le champ est **complet**, et son flot $(\varphi_t)_{t \in \mathbb R}$ est un groupe d'homéomorphismes de $M$.
    preuve: |
      (i) Dans une carte $(U, \psi)$, $X$ s'écrit comme un champ $\tilde X$ sur l'ouvert $\psi(U)$ de $\lex{n-uplet}{\mathbb R^n}$, lisse, et $\gamma$ est une courbe intégrale si et seulement si $\psi \circ \gamma$ est solution de $y' = \tilde X(y)$ ({{gd-espace-tangent|Espace tangent}}).

      L'existence et l'unicité locales viennent de Cauchy-Lipschitz ; deux courbes intégrales qui coïncident en un instant coïncident sur un intervalle ouvert, puis sur tout l'intervalle commun par connexité, puisque $M$ est séparée et que l'ensemble des instants de coïncidence est fermé. La réunion de toutes les courbes intégrales issues d'un point est la courbe maximale.

      (ii) Pour chaque $p \in M$, il existe une carte autour de $p$ et un $\varepsilon_p > 0$ tels que les courbes intégrales issues des points d'un voisinage $V_p$ de $p$ soient définies sur $]{-\varepsilon_p}, \varepsilon_p[$ ({{ed-cauchy-lipschitz|Cauchy-Lipschitz}}, avec un cylindre uniforme).

      Par compacité, un nombre fini de $V_p$ recouvrent $M$ ; soit $\varepsilon$ le plus petit des $\varepsilon_p$ correspondants. Toute courbe intégrale se prolonge alors de $\varepsilon$ au-delà de chacun de ses instants, et ne peut avoir une borne finie. La propriété de groupe et la continuité se démontrent comme au nœud {{ed-flot|Flot}}.
    remarques:
      - |
        Sur la sphère $\lex{sphere-unite}{S^2}$, le champ des rotations autour de l'axe vertical, $X(x, y, z) = (-y, x, 0)$, est tangent, et son flot est la rotation d'angle $t$. Le théorème de la boule chevelue ({{gd-fibre-tangent|Fibré tangent}}) dit que ce champ, comme tout champ continu sur $S^2$, s'annule quelque part : ici aux deux pôles, points fixes du flot.

  - id: edo-changement
    etiquette: Changement de variables
    nature: chapitre
    titre: Changement de variables et conservation du volume
    sous: edo-changement
    texte: |
      Si $\varphi$ est un $C^1$-difféomorphisme d'un ouvert $U$ de $\lex{n-uplet}{\mathbb R^n}$ sur un ouvert $V$, toute fonction borélienne positive $f$ sur $V$ vérifie
      $$\int_V f\,d\lambda = \int_U f \circ \varphi\,|\det d\varphi|\,d\lambda.$$

      Le chapitre construit la mesure de Lebesgue de $\mathbb R^n$ comme mesure produit, montre qu'une application linéaire $A$ multiplie les mesures par $|\det A|$, puis compare l'image d'un petit cube $Q$ de centre $a$ au parallélépipède $\varphi(a) + d\varphi(a)(Q - a)$ : les accroissements finis donnent une inclusion, le point fixe l'inclusion inverse. Les cubes dyadiques et le lemme de Dynkin étendent l'égalité aux boréliens, sans régularité de la mesure. Les coordonnées polaires en sont le premier exemple, et donnent $\int_{\mathbb R} e^{-x^2}\,dx = \sqrt\pi$.

      Le chapitre est placé ici parce que la théorie des équations différentielles est la première de l'édifice dont la mesure, le calcul différentiel, l'algèbre linéaire et l'analyse complexe, qui fournit $\cos$, $\sin$ et $\pi$, soient tous des ancêtres. Appliquée au flot d'un champ de vecteurs, la formule donne le théorème de Liouville : le flot d'un champ de divergence nulle conserve le volume. Aucune forme du choix n'intervient, en dehors du choix dénombrable que demande la mesure de Lebesgue elle-même.

  - id: edo-liapounov
    etiquette: Stabilité des équilibres
    nature: chapitre
    titre: Stabilité des équilibres au sens de Liapounov
    sous: edo-liapounov
    texte: |
      Un équilibre d'un champ de vecteurs $X$ est un point où $X$ s'annule. Il est stable si les trajectoires issues de points voisins restent voisines pour tous les temps positifs, asymptotiquement stable si elles tendent de plus vers lui ; la convergence seule ne suffit pas à la stabilité.

      Pour un système linéaire $y' = Ay$, le chapitre établit que l'origine est asymptotiquement stable si et seulement si toutes les valeurs propres complexes de $A$ ont une partie réelle strictement négative, avec $|||e^{tA}||| \leqslant Ce^{-\beta t}$. La réduction des endomorphismes n'étant pas un ancêtre, la démonstration trigonalise $A$ sur $\mathbb C$ par le seul théorème de d'Alembert-Gauss, puis rend la partie nilpotente aussi petite qu'on veut.

      La seconde méthode de Liapounov conclut sans résoudre l'équation, par une fonction qui décroît le long des trajectoires ; l'équation ${}^tAP + PA = -I$ en fournit une, quadratique, et la différentielle du flot en un équilibre $a$, $d\varphi_t(a) = e^{tA}$ avec $A = dX(a)$, ramène au cas linéaire : un équilibre dont le linéarisé a toutes ses valeurs propres de partie réelle strictement négative est asymptotiquement stable, et il est instable si l'une d'elles est de partie réelle strictement positive. Le principe d'invariance de LaSalle traite le pendule amorti, dont l'énergie ne décroît qu'au sens large. Aucune forme du choix n'intervient.

