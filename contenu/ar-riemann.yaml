# Niveau 2 : structure interne du chapitre « Intégrale de Riemann ».
# Toutes les fonctions sont à valeurs réelles, définies sur un segment [a, b] avec a < b,
# sauf mention contraire. Le théorème fondamental de l'analyse est le nœud frère ar-tfa.

graphe: ar-riemann
titre: Intégrale de Riemann
conteneur: ar-riemann

entrees:
  ar-corps: [ri-integrable]
  continuite: [ri-continues]

noeuds:
  - id: ri-subdivision
    etiquette: Subdivisions
    nature: définition
    titre: Subdivisions d'un segment
    enonce: |
      Soit $a < b$ deux réels. Une [[subdivision]] du [[segment]] $[a, b]$ est une partie finie $\sigma$ de $[a, b]$ qui contient $a$ et $b$. On numérote ses éléments dans l'ordre croissant, $a = x_0 < x_1 < \cdots < x_n = b$, et l'on appelle **pas** de $\sigma$ le réel $\max_{0 \leqslant i < n} (x_{i+1} - x_i)$. Une subdivision $\sigma'$ est **plus fine** que $\sigma$ si $\sigma \subset \sigma'$.

      **Proposition.** (i) Pour deux subdivisions $\sigma$ et $\sigma'$ de $[a, b]$, la réunion $\sigma \cup \sigma'$ est une subdivision plus fine que chacune d'elles, et c'est la moins fine de ces subdivisions : on l'appelle leur **raffinement commun**.

      (ii) Si $\sigma'$ est plus fine que $\sigma$, chaque intervalle $[y_j, y_{j+1}]$ formé de deux points consécutifs de $\sigma'$ est contenu dans un intervalle $[x_i, x_{i+1}]$ formé de deux points consécutifs de $\sigma$ ; en particulier, le pas de $\sigma'$ est inférieur ou égal à celui de $\sigma$.

      (iii) Pour tout $\delta > 0$, il existe une subdivision de pas strictement inférieur à $\delta$.
    preuve: |
      La numérotation dans l'ordre croissant ne demande aucun choix : $x_0$ est le plus petit élément de $\sigma$, $x_1$ le plus petit élément de $\sigma \setminus \{x_0\}$, et ainsi de suite, une partie finie non vide d'un ensemble totalement ordonné ayant un plus petit élément.

      (i) La réunion de deux parties finies de $[a, b]$ contenant $a$ et $b$ en est encore une, et elle contient $\sigma$ et $\sigma'$. Toute subdivision plus fine que $\sigma$ et que $\sigma'$ contient $\sigma \cup \sigma'$, c'est-à-dire est plus fine qu'elle.

      (ii) Soit $y_j < y_{j+1}$ deux points consécutifs de $\sigma'$, et $x_i$ le plus grand élément de $\sigma$ inférieur ou égal à $y_j$ ; il existe, puisque $a = x_0 \leqslant y_j$, et $i < n$, puisque $y_j < b$. Alors $x_{i+1} > y_j$. Aucun point de $\sigma$ n'est strictement compris entre $y_j$ et $y_{j+1}$, puisque $\sigma \subset \sigma'$ et que ces deux points sont consécutifs dans $\sigma'$ ; donc $x_{i+1} \geqslant y_{j+1}$, et $[y_j, y_{j+1}] \subset [x_i, x_{i+1}]$. Les longueurs se comparent en conséquence, et le pas de $\sigma'$ est au plus celui de $\sigma$.

      (iii) Par la propriété d'Archimède ({{ar-archimede|Archimède, densité de ℚ}}), il existe un entier $n \geqslant 1$ tel que $n\delta > b - a$. La **subdivision régulière** $x_k = a + k\frac{b - a}{n}$, pour $0 \leqslant k \leqslant n$, a pour pas $\frac{b - a}{n} < \delta$.
    remarques:
      - |
        Les subdivisions $\sigma = \{0, \frac12, 1\}$ et $\sigma' = \{0, \frac13, 1\}$ de $[0, 1]$ ont pour pas $\frac12$ et $\frac23$ ; leur raffinement commun $\{0, \frac13, \frac12, 1\}$ a pour pas $\frac12$. Le pas d'un raffinement commun est au plus le plus petit des deux pas, mais il peut lui être égal : raffiner ne fait pas nécessairement diminuer le pas.

        ```schema ri-subdivision
        Les points de $\sigma$, en bleu, et ceux de $\sigma'$, en vert, se reportent sur leur raffinement commun $\sigma \cup \sigma'$, en rouge, dont chaque intervalle est contenu dans un intervalle de chacune des deux. Le trait épais marque sur chaque ligne un intervalle de longueur maximale : le pas du raffinement, $\frac12$, est égal à celui de $\sigma$.
        ```

      - |
        Le raffinement commun est l'outil de tout le chapitre. Chaque fois que deux fonctions en escalier, ou une fonction en escalier et une somme de Riemann, se rapportent à deux subdivisions différentes, on se ramène à une seule en passant à leur réunion.

  - id: ri-escalier
    etiquette: Fonctions en escalier
    nature: définition
    enonce: |
      Une fonction $\varphi : [a, b] \to \lex{ensemble-reels}{\mathbb R}$ est une [[fonction-escalier|fonction en escalier]] s'il existe une subdivision $\sigma = (x_0 < \cdots < x_n)$ de $[a, b]$ et des réels $c_0, \dots, c_{n-1}$ tels que $\varphi$ soit constante, égale à $c_i$, sur chaque intervalle ouvert $]x_i, x_{i+1}[$. On dit alors que $\sigma$ est **adaptée** à $\varphi$. Les valeurs $\varphi(x_i)$ aux points de la subdivision sont quelconques.

      ```schema ri-escalier
      Sur chaque intervalle ouvert $]x_i, x_{i+1}[$, la fonction $\varphi$ est constante, égale à $c_i$, ce que marquent les extrémités creuses. Ses valeurs aux points $x_i$, en rouge, sont quelconques : en $x_2$, la valeur prolonge le palier $c_1$, mais aux autres points elle ne prolonge aucun des deux paliers voisins.
      ```

      **Proposition.** (i) Toute subdivision plus fine qu'une subdivision adaptée à $\varphi$ est adaptée à $\varphi$.

      (ii) Deux fonctions en escalier $\varphi$ et $\psi$ admettent une subdivision adaptée commune.

      (iii) Si $\varphi$ et $\psi$ sont en escalier et $h : \mathbb R^2 \to \mathbb R$ est une application quelconque, la fonction $x \mapsto h(\varphi(x), \psi(x))$ est en escalier. En particulier $\varphi + \psi$, $\lambda\varphi$ pour $\lambda \in \mathbb R$, $\varphi\psi$, $|\varphi|$, $\max(\varphi, \psi)$ et $\min(\varphi, \psi)$ sont en escalier, et toute fonction en escalier est bornée.
    preuve: |
      (i) Si $\sigma \subset \sigma'$ et si $\sigma$ est adaptée à $\varphi$, chaque intervalle ouvert $]y_j, y_{j+1}[$ de $\sigma'$ est contenu dans un intervalle ouvert $]x_i, x_{i+1}[$ de $\sigma$ ({{ri-subdivision|Subdivisions}}, (ii)), sur lequel $\varphi$ est constante ; elle l'est donc sur $]y_j, y_{j+1}[$.

      (ii) Si $\sigma$ est adaptée à $\varphi$ et $\sigma'$ à $\psi$, leur raffinement commun $\sigma \cup \sigma'$ est adapté aux deux, par (i).

      (iii) Sur chaque intervalle ouvert d'une subdivision adaptée commune, $\varphi$ et $\psi$ sont constantes, donc $h(\varphi, \psi)$ aussi. Une fonction en escalier ne prend qu'un nombre fini de valeurs, les $c_i$ et les $\varphi(x_i)$ : elle est bornée.
    remarques:
      - |
        La fonction $\varphi$ égale à $2$ sur $[0, 1[$ et à $-1$ sur $[1, 3]$ est en escalier sur $[0, 3]$, de subdivision adaptée $\{0, 1, 3\}$ ; la subdivision $\{0, \frac12, 1, 2, 3\}$ lui est aussi adaptée. Une fonction en escalier a donc une infinité de subdivisions adaptées : c'est pourquoi la définition de son intégrale, au nœud suivant, demande une vérification.
      - |
        L'erreur la plus répandue est de croire qu'une fonction ne prenant qu'un nombre fini de valeurs est en escalier. L'indicatrice de $\lex{ensemble-rationnels}{\mathbb Q} \cap [0, 1]$ ne prend que les valeurs $0$ et $1$, mais elle n'est constante sur aucun intervalle ouvert non vide, puisque tout tel intervalle contient un rationnel et un irrationnel.

  - id: ri-integrale-escalier
    etiquette: Intégrale d'un escalier
    nature: proposition
    titre: Intégrale d'une fonction en escalier
    enonce: |
      Soit $\varphi$ une fonction en escalier sur $[a, b]$ et $\sigma = (x_0 < \cdots < x_n)$ une subdivision adaptée, $\varphi$ valant $c_i$ sur $]x_i, x_{i+1}[$. Le réel
      $$I(\varphi, \sigma) = \sum_{i=0}^{n-1} c_i\,(x_{i+1} - x_i)$$
      ne dépend pas de la subdivision adaptée $\sigma$. On l'appelle **intégrale** de $\varphi$ sur $[a, b]$ et on le note $\int_a^b \varphi$, ou $\int_a^b \varphi(t)\,dt$.
    preuve: |
      **Ajout d'un point.** Soit $y \in \,]x_i, x_{i+1}[$ un point qui n'est pas dans $\sigma$. La subdivision $\sigma \cup \{y\}$ est adaptée à $\varphi$, qui vaut $c_i$ sur $]x_i, y[$ et sur $]y, x_{i+1}[$, et dans $I(\varphi, \sigma \cup \{y\})$ le terme $c_i(x_{i+1} - x_i)$ est remplacé par
      $$c_i(y - x_i) + c_i(x_{i+1} - y) = c_i(x_{i+1} - x_i).$$
      Les deux sommes sont donc égales.

      **Subdivision plus fine.** Si $\sigma \subset \sigma'$, on passe de $\sigma$ à $\sigma'$ en ajoutant un à un les points de $\sigma' \setminus \sigma$, par exemple dans l'ordre croissant ; une récurrence sur le nombre de points ajoutés donne $I(\varphi, \sigma') = I(\varphi, \sigma)$.

      **Cas général.** Si $\sigma_1$ et $\sigma_2$ sont deux subdivisions adaptées, leur raffinement commun $\sigma_1 \cup \sigma_2$ est plus fin que chacune ({{ri-subdivision|Subdivisions}}, (i)), et
      $$I(\varphi, \sigma_1) = I(\varphi, \sigma_1 \cup \sigma_2) = I(\varphi, \sigma_2).$$
    remarques:
      - |
        Pour la fonction égale à $2$ sur $[0, 1[$ et à $-1$ sur $[1, 3]$, la subdivision $\{0, 1, 3\}$ donne $2 \cdot 1 + (-1) \cdot 2 = 0$, et la subdivision $\{0, \frac12, 1, 2, 3\}$ donne $2 \cdot \frac12 + 2 \cdot \frac12 + (-1) \cdot 1 + (-1) \cdot 1 = 0$, comme le veut la proposition. L'intégrale est une aire *algébrique* : elle peut être nulle sans que la fonction le soit, les parties situées sous l'axe comptant négativement.

        ```schema ri-integrale-escalier
        La fonction égale à $2$ sur $[0, 1[$ et à $-1$ sur $[1, 3]$ délimite un rectangle d'aire $2$ au-dessus de l'axe, en bleu, et un rectangle d'aire $2$ au-dessous, en rouge, compté négativement : l'intégrale vaut $2 - 2 = 0$. Les pointillés de la subdivision plus fine $\{0, \frac12, 1, 2, 3\}$ coupent chaque rectangle en deux sans changer la somme, $1 + 1 - 1 - 1 = 0$.
        ```

      - |
        Les valeurs aux points de la subdivision n'interviennent pas. Deux fonctions en escalier qui ne diffèrent qu'en un nombre fini de points ont donc la même intégrale, puisqu'on peut ajouter ces points à une subdivision adaptée commune.

  - id: ri-escalier-proprietes
    etiquette: Propriétés (escalier)
    nature: proposition
    titre: Propriétés de l'intégrale des fonctions en escalier
    enonce: |
      Soit $\varphi$ et $\psi$ des fonctions en escalier sur $[a, b]$ et $\lambda \in \lex{ensemble-reels}{\mathbb R}$.

      (i) *Linéarité.* $\int_a^b (\varphi + \lambda\psi) = \int_a^b \varphi + \lambda \int_a^b \psi$, et l'intégrale de la constante $\lambda$ vaut $\lambda(b - a)$.

      (ii) *Croissance.* Si $\varphi \leqslant \psi$, alors $\int_a^b \varphi \leqslant \int_a^b \psi$. En particulier $\Big|\int_a^b \varphi\Big| \leqslant \int_a^b |\varphi| \leqslant (b - a)\sup|\varphi|$.

      (iii) *Relation de Chasles.* Pour $c \in \,]a, b[$, les restrictions de $\varphi$ à $[a, c]$ et à $[c, b]$ sont en escalier, et $\int_a^b \varphi = \int_a^c \varphi + \int_c^b \varphi$.
    preuve: |
      Soit $\sigma = (x_0 < \cdots < x_n)$ une subdivision adaptée à la fois à $\varphi$ et à $\psi$ ({{ri-escalier|Fonctions en escalier}}, (ii)), $\varphi$ valant $c_i$ et $\psi$ valant $d_i$ sur $]x_i, x_{i+1}[$.

      (i) La fonction $\varphi + \lambda\psi$ vaut $c_i + \lambda d_i$ sur $]x_i, x_{i+1}[$, donc
      $$\int_a^b (\varphi + \lambda\psi) = \sum_i (c_i + \lambda d_i)(x_{i+1} - x_i) = \int_a^b \varphi + \lambda\int_a^b \psi.$$
      Pour la constante $\lambda$, la subdivision $\{a, b\}$ est adaptée et donne $\lambda(b - a)$.

      (ii) Si $\varphi \leqslant \psi$, l'évaluation au milieu de $]x_i, x_{i+1}[$ donne $c_i \leqslant d_i$, et chaque terme de la somme qui définit $\int \varphi$ est inférieur ou égal au terme correspondant pour $\psi$. On applique ce résultat à $-|\varphi| \leqslant \varphi \leqslant |\varphi|$, fonctions en escalier, puis à $|\varphi| \leqslant \sup|\varphi|$, en utilisant (i).

      (iii) La subdivision $\sigma \cup \{c\}$ est adaptée à $\varphi$ ; ses points inférieurs ou égaux à $c$ forment une subdivision de $[a, c]$ adaptée à la restriction, et ses points supérieurs ou égaux à $c$ une subdivision de $[c, b]$. La somme qui définit $\int_a^b \varphi$ se coupe en deux sommes, qui sont $\int_a^c \varphi$ et $\int_c^b \varphi$.
    remarques:
      - |
        L'erreur la plus répandue est d'en déduire qu'une fonction en escalier positive d'intégrale nulle est nulle. La fonction égale à $1$ en $0$ et à $0$ ailleurs sur $[0, 1]$ est en escalier, positive, non nulle, et d'intégrale nulle : seules ses valeurs sur les intervalles ouverts d'une subdivision adaptée comptent. Pour les fonctions continues, l'énoncé redevient vrai ({{ri-moyenne|Inégalité de la moyenne}}).

  - id: ri-integrable
    etiquette: Fonctions intégrables
    nature: définition
    titre: Fonctions intégrables au sens de Riemann
    enonce: |
      Soit $f : [a, b] \to \lex{ensemble-reels}{\mathbb R}$ une fonction **bornée**. Notons $\mathcal E^-(f)$ l'ensemble des fonctions en escalier $\varphi \leqslant f$, et $\mathcal E^+(f)$ celui des fonctions en escalier $\psi \geqslant f$. L'**intégrale inférieure** et l'**intégrale supérieure** de $f$ sont
      $$I^-(f) = \sup_{\varphi \in \mathcal E^-(f)} \int_a^b \varphi,$$
      $$I^+(f) = \inf_{\psi \in \mathcal E^+(f)} \int_a^b \psi.$$
      Ces deux réels existent et vérifient $I^-(f) \leqslant I^+(f)$. La fonction $f$ est [[riemann-integrable|intégrable au sens de Riemann]] si $I^-(f) = I^+(f)$ ; cette valeur commune est son **intégrale**, notée $\int_a^b f$ ou $\int_a^b f(t)\,dt$.

      ```schema ri-integrable
      Pour $f(x) = \frac32 + \frac12 x(x - \frac95)(x - 3)$ sur $[0, 3]$, l'escalier $\varphi$, en bleu, prend sur chaque intervalle d'une subdivision le minimum de $f$, et l'escalier $\psi$, en vert, son maximum : $\varphi \in \mathcal E^-(f)$ et $\psi \in \mathcal E^+(f)$. Leurs intégrales, environ $4{,}49$ et $5{,}77$, encadrent $I^-(f) \leqslant I^+(f)$, et l'aire de la région rouge est leur écart ; le nœud suivant montre que $f$ est intégrable si et seulement si cette aire peut être rendue aussi petite qu'on veut.
      ```

      Toute fonction en escalier est intégrable, et son intégrale en ce sens est celle du nœud {{ri-integrale-escalier|Intégrale d'un escalier}}.
    preuve: |
      Soit $M$ un réel tel que $|f| \leqslant M$. Les constantes $-M$ et $M$ sont des fonctions en escalier qui encadrent $f$ : les deux ensembles sont non vides. Si $\varphi \leqslant f \leqslant \psi$ avec $\varphi$ et $\psi$ en escalier, alors $\varphi \leqslant \psi$, et la croissance de l'intégrale des fonctions en escalier ({{ri-escalier-proprietes|Propriétés (escalier)}}, (ii)) donne
      $$\int_a^b \varphi \leqslant \int_a^b \psi.$$
      L'ensemble des intégrales des $\varphi \in \mathcal E^-(f)$ est donc non vide et majoré par chacune des intégrales des $\psi \in \mathcal E^+(f)$ : il possède une [[borne-superieure]] $I^-(f)$, par la propriété de la borne supérieure de $\mathbb R$, et $I^-(f) \leqslant \int_a^b \psi$ pour tout $\psi \in \mathcal E^+(f)$. L'ensemble de ces dernières intégrales, non vide et minoré par $I^-(f)$, possède donc une borne inférieure $I^+(f) \geqslant I^-(f)$.

      Si $f$ est en escalier, elle appartient à $\mathcal E^-(f)$ et à $\mathcal E^+(f)$, d'où $I^+(f) \leqslant \int_a^b f \leqslant I^-(f)$, et les trois quantités sont égales.
    remarques:
      - |
        L'indicatrice $f$ de $\lex{ensemble-rationnels}{\mathbb Q} \cap [0, 1]$ n'est pas intégrable : $I^-(f) = 0$ et $I^+(f) = 1$. En effet, tout intervalle ouvert non vide $]u, v[$ contient un rationnel $r$, par densité ({{ar-archimede|Archimède, densité de ℚ}}), et un irrationnel, de la forme $r + \frac{\sqrt 2}{m}$ pour un entier $m$ assez grand, puisque $\sqrt 2$ est irrationnel ({{q-irrationnel|Irrationalité de √2}}). Une fonction en escalier $\varphi \leqslant f$ vaut donc au plus $0$ sur chaque intervalle ouvert d'une subdivision adaptée, et une fonction en escalier $\psi \geqslant f$ y vaut au moins $1$. Cette même fonction est intégrable au sens de Lebesgue ({{m-riemann|Riemann et Lebesgue}}).
      - |
        L'erreur la plus répandue est d'oublier l'hypothèse que $f$ est bornée. Elle est indispensable, puisqu'une fonction en escalier est bornée : sur $[0, 1]$, la fonction nulle en $0$ et égale à $1/x$ ailleurs n'est majorée par aucune fonction en escalier, et l'intégrale de Riemann ne la concerne pas. Les intégrales de fonctions non bornées seront des limites d'intégrales sur des segments plus petits.

  - id: ri-critere
    etiquette: Critère d'intégrabilité
    nature: proposition
    titre: Critère d'intégrabilité par encadrement
    enonce: |
      Une fonction bornée $f : [a, b] \to \lex{ensemble-reels}{\mathbb R}$ est [[riemann-integrable|intégrable au sens de Riemann]] si et seulement si, pour tout $\varepsilon > 0$, il existe des fonctions en escalier $\varphi$ et $\psi$ telles que
      $$\varphi \leqslant f \leqslant \psi \qquad \text{et} \qquad \int_a^b (\psi - \varphi) < \varepsilon.$$
      On a alors $\int_a^b \varphi \leqslant \int_a^b f \leqslant \int_a^b \psi$.
    preuve: |
      Supposons $f$ intégrable, d'intégrale $I$, et soit $\varepsilon > 0$. Le réel $I - \frac\varepsilon2$ n'est pas un majorant des intégrales des fonctions en escalier $\varphi \leqslant f$ : il en existe une telle que $\int_a^b \varphi > I - \frac\varepsilon2$. De même, il existe $\psi \geqslant f$ en escalier avec $\int_a^b \psi < I + \frac\varepsilon2$. Par linéarité ({{ri-escalier-proprietes|Propriétés (escalier)}}, (i)), $\int_a^b (\psi - \varphi) < \varepsilon$.

      Réciproquement, si la condition est remplie, alors pour tout $\varepsilon > 0$,
      $$\int_a^b \varphi \leqslant I^-(f) \leqslant I^+(f) \leqslant \int_a^b \psi,$$
      donc $0 \leqslant I^+(f) - I^-(f) \leqslant \int_a^b (\psi - \varphi) < \varepsilon$. Ceci valant pour tout $\varepsilon > 0$, $I^-(f) = I^+(f)$. L'encadrement final résulte de la définition de $I^-(f)$ et de $I^+(f)$.
    remarques:
      - |
        Pour $f(x) = x$ sur $[0, 1]$ et la subdivision régulière de pas $\frac1n$, les fonctions en escalier $\varphi$ et $\psi$ égales à $\frac kn$ et à $\frac{k+1}n$ sur $]\frac kn, \frac{k+1}n[$, et à $f$ aux points de la subdivision, encadrent $f$, avec
        $$\int_0^1 \varphi = \frac{n-1}{2n}, \qquad \int_0^1 \psi = \frac{n+1}{2n},$$
        $$\int_0^1 (\psi - \varphi) = \frac1n.$$
        La fonction est donc intégrable, et son intégrale, coincée entre $\frac12 - \frac1{2n}$ et $\frac12 + \frac1{2n}$ pour tout $n$, vaut $\frac12$ : c'est l'aire du triangle sous la diagonale.
      - |
        Ce critère ne fait intervenir aucune forme de l'axiome du choix : pour chaque $\varepsilon$, il affirme l'existence d'un seul couple $(\varphi, \psi)$, et toutes les démonstrations qui suivent n'en utilisent qu'un nombre fini à la fois. C'est le critère qu'on emploie en pratique, l'égalité $I^- = I^+$ servant surtout de définition.

  - id: ri-proprietes
    etiquette: Propriétés de l'intégrale
    nature: théorème
    titre: Propriétés de l'intégrale de Riemann
    enonce: |
      Soit $f$ et $g$ intégrables sur $[a, b]$ et $\lambda \in \lex{ensemble-reels}{\mathbb R}$.

      (i) *Linéarité.* $f + \lambda g$ est intégrable, et $\int_a^b (f + \lambda g) = \int_a^b f + \lambda\int_a^b g$.

      (ii) *Croissance.* Si $f \leqslant g$, alors $\int_a^b f \leqslant \int_a^b g$.

      (iii) *Relation de Chasles.* Pour $c \in \,]a, b[$, une fonction bornée $f$ est intégrable sur $[a, b]$ si et seulement si ses restrictions à $[a, c]$ et à $[c, b]$ le sont, et alors $\int_a^b f = \int_a^c f + \int_c^b f$. En particulier, $f$ est intégrable sur tout segment contenu dans $[a, b]$.

      (iv) *Composition.* Si $|f| \leqslant M$ et si $h : [-M, M] \to \mathbb R$ est $K$-lipschitzienne, c'est-à-dire $|h(y) - h(z)| \leqslant K|y - z|$, alors $h \circ f$ est intégrable. En particulier $|f|$ et le produit $fg$ sont intégrables, et
      $$\Big|\int_a^b f\Big| \leqslant \int_a^b |f|.$$

      (v) *Intégrale orientée.* On pose $\int_a^a f = 0$ et $\int_b^a f = -\int_a^b f$. Si $f$ est intégrable sur un segment $J$, alors $\int_u^w f = \int_u^v f + \int_v^w f$ pour tous $u, v, w \in J$, et $\big|\int_u^v f\big| \leqslant \big|\int_u^v |f|\,\big|$.
    preuve: |
      On utilise le critère d'intégrabilité ({{ri-critere|Critère d'intégrabilité}}). Soit $\varepsilon > 0$ et des fonctions en escalier $\varphi_1 \leqslant f \leqslant \psi_1$, $\varphi_2 \leqslant g \leqslant \psi_2$ avec $\int (\psi_1 - \varphi_1) < \varepsilon$ et $\int (\psi_2 - \varphi_2) < \varepsilon$.

      (i) Pour $\lambda \geqslant 0$, les fonctions en escalier $\varphi_1 + \lambda\varphi_2 \leqslant f + \lambda g \leqslant \psi_1 + \lambda\psi_2$ ont des intégrales distantes de moins de $(1 + \lambda)\varepsilon$, ce qui prouve l'intégrabilité. De plus, $\int (f + \lambda g)$ et $\int f + \lambda\int g$ appartiennent tous deux à l'intervalle $[\int \varphi_1 + \lambda\int\varphi_2,\ \int \psi_1 + \lambda\int\psi_2]$ ({{ri-escalier-proprietes|Propriétés (escalier)}}, (i)), de longueur inférieure à $(1 + \lambda)\varepsilon$ : ils sont égaux. Pour $\lambda < 0$, il suffit de traiter $-g$, encadrée par $-\psi_2 \leqslant -g \leqslant -\varphi_2$, avec $\int (-g) = -\int g$ par le même argument.

      (ii) Si $f \leqslant g$, toute fonction en escalier $\varphi \leqslant f$ vérifie $\varphi \leqslant g$, donc $I^-(f) \leqslant I^-(g)$.

      (iii) Si $f$ est intégrable sur $[a, b]$, les restrictions de $\varphi_1$ et $\psi_1$ à $[a, c]$ sont en escalier et encadrent $f$ ; par Chasles pour les fonctions en escalier et la positivité de $\int_c^b (\psi_1 - \varphi_1)$, on a $\int_a^c (\psi_1 - \varphi_1) \leqslant \int_a^b (\psi_1 - \varphi_1) < \varepsilon$. De même sur $[c, b]$. Réciproquement, si $f$ est intégrable sur $[a, c]$ et sur $[c, b]$, encadrée par $\varphi' \leqslant f \leqslant \psi'$ sur le premier et $\varphi'' \leqslant f \leqslant \psi''$ sur le second, la fonction égale à $\varphi'$ sur $[a, c[$ et à $\varphi''$ sur $[c, b]$ est en escalier, minore $f$, et de même pour les majorantes ; par Chasles pour les fonctions en escalier, la valeur en $c$ ne comptant pas, l'écart de leurs intégrales est inférieur à $2\varepsilon$. Dans les deux cas, $\int_a^b f$ et $\int_a^c f + \int_c^b f$ appartiennent à un même intervalle de longueur inférieure à $2\varepsilon$, borné par les intégrales des fonctions en escalier ; ils sont égaux. Un segment $[c, d] \subset [a, b]$ s'obtient en coupant deux fois.

      (iv) Quitte à remplacer $\varphi_1$ par $\max(\varphi_1, -M)$ et $\psi_1$ par $\min(\psi_1, M)$, qui sont en escalier, encadrent encore $f$ et sont plus proches, on peut supposer que $\varphi_1$ et $\psi_1$ prennent leurs valeurs dans $[-M, M]$. Sur chaque intervalle ouvert $]x_i, x_{i+1}[$ d'une subdivision adaptée commune, $\varphi_1 = c_i$, $\psi_1 = d_i$, et $f(x) \in [c_i, d_i]$, d'où $|h(f(x)) - h(c_i)| \leqslant K(f(x) - c_i)$, puis
      $$|h(f(x)) - h(c_i)| \leqslant K(d_i - c_i).$$
      Les fonctions égales à $h(c_i) \mp K(d_i - c_i)$ sur $]x_i, x_{i+1}[$ et à $h(f(x_i))$ aux points $x_i$ sont en escalier, encadrent $h \circ f$, qui est bornée, et l'écart de leurs intégrales vaut $2K\int (\psi_1 - \varphi_1) < 2K\varepsilon$. Ainsi $h \circ f$ est intégrable.

      La valeur absolue est $1$-lipschitzienne, et $y \mapsto y^2$ est $2M$-lipschitzienne sur $[-M, M]$ puisque $|y^2 - z^2| = |y + z|\,|y - z|$. Donc $|f|$ est intégrable, ainsi que $(f + g)^2$ et $(f - g)^2$, dont la différence divisée par $4$ est $fg$ ; on conclut par (i). Enfin $-|f| \leqslant f \leqslant |f|$ et (ii) donnent $-\int |f| \leqslant \int f \leqslant \int |f|$.

      (v) Si deux des points $u, v, w$ sont égaux, la relation se lit sur les conventions. Sinon, l'un d'eux est entre les deux autres ; la relation (iii), écrite pour ces trois points rangés dans l'ordre croissant, donne une égalité entre trois intégrales, et chacune des six dispositions possibles s'y ramène en faisant passer un terme de l'autre côté et en changeant le sens des intégrales par la convention. L'inégalité vient de (iv), appliquée sur le segment d'extrémités $u$ et $v$.
    remarques:
      - |
        La réciproque de (iv) est fausse : sur $[0, 1]$, la fonction égale à $1$ aux points rationnels et à $-1$ ailleurs n'est pas intégrable, comme l'indicatrice de $\lex{ensemble-rationnels}{\mathbb Q}$ dont elle est une transformée affine, alors que sa valeur absolue est constante.
      - |
        L'intégrale d'un produit n'est pas le produit des intégrales : pour $f(x) = g(x) = x$ sur $[0, 1]$, on a $\int_0^1 f \int_0^1 g = \frac14$, alors que $\int_0^1 x^2\,dx = \frac13$, comme on le verra au nœud {{ri-monotones|Fonctions monotones}}.
      - |
        L'intégrale orientée de (v) est celle que demande le {{ar-tfa|théorème fondamental de l'analyse}}, où l'on intègre de $a$ à $x$ pour $x$ de part et d'autre de $a$. L'erreur la plus répandue est d'appliquer la croissance à une intégrale dont les bornes sont dans l'ordre décroissant : pour $u > v$ et $f \geqslant 0$, $\int_u^v f \leqslant 0$.

  - id: ri-continues
    etiquette: Fonctions continues
    nature: théorème
    titre: Intégrabilité des fonctions continues
    enonce: |
      Toute fonction continue sur un segment $[a,b]$ est intégrable au sens de Riemann.
    preuve: |
      Soit $f$ continue sur $[a,b]$ et $\varepsilon > 0$. Par le théorème de Heine, $f$ est [[continuite-uniforme|uniformément continue]] : il existe $\delta > 0$ tel que $|x - y| < \delta$ entraîne $|f(x) - f(y)| < \varepsilon$. Soit une [[subdivision]] $(x_i)$ de pas inférieur à $\delta$, et posons, sur chaque $[x_i, x_{i+1}[$,
      $$\varphi = f(x_i) - \varepsilon, \qquad \psi = f(x_i) + \varepsilon,$$
      en prolongeant en $b$ par $f(b)$. Pour $x \in [x_i, x_{i+1}[$, on a $|x - x_i| < \delta$, donc $\varphi(x) \leqslant f(x) \leqslant \psi(x)$. Ce sont des fonctions en escalier, et $\int (\psi - \varphi) = 2\varepsilon(b - a)$, qui est arbitrairement petit.

      ```schema ar-riemann
      Pour $f(x) = 1 + x - \frac{x^3}{3}$ sur $[0, 2]$, avec seize pas et $\varepsilon = 0{,}4$, l'escalier $\varphi$, en bleu, reste sous le graphe de $f$ et l'escalier $\psi$, en vert, au-dessus : sur chaque pas, $f$ s'écarte d'au plus $0{,}344$ de sa valeur au point gauche $x_i$. La bande grisée entre les deux escaliers a une hauteur constante $2\varepsilon$, donc une aire $2\varepsilon(b - a)$.
      ```

      Deux précisions achèvent la démonstration. Le théorème de Heine est celui du nœud {{c-heine|Théorème de Heine}}, et une subdivision de pas inférieur à $\delta$ existe ({{ri-subdivision|Subdivisions}}, (iii)). Pour conclure, étant donné $\varepsilon' > 0$, on fait la construction avec $\varepsilon = \frac{\varepsilon'}{3(b - a)}$ : alors $\int (\psi - \varphi) = \frac{2\varepsilon'}{3} < \varepsilon'$, et le critère d'intégrabilité ({{ri-critere|Critère d'intégrabilité}}) montre que $f$ est intégrable.
    remarques:
      - |
        Si $f$ est continue sur un [[intervalle]] $I$ quelconque, elle est continue, donc intégrable, sur tout segment contenu dans $I$, et l'intégrale orientée $\int_u^v f$ a un sens pour tous $u, v \in I$. C'est le cadre du {{ar-tfa|théorème fondamental de l'analyse}}.
      - |
        Avec la relation de Chasles, le théorème s'étend aux fonctions continues par morceaux, c'est-à-dire continues sur chaque intervalle ouvert d'une subdivision et prolongeables par continuité aux extrémités : sur chaque segment de la subdivision, la fonction coïncide avec une fonction continue sauf peut-être aux deux extrémités, et la modifier en un nombre fini de points ne change ni l'intégrabilité ni l'intégrale, la différence étant une fonction en escalier d'intégrale nulle. Ce cas sert au nœud {{nb-sommation|Sommation d'Abel}}.
      - |
        La démonstration de Heine donnée au chapitre Continuité choisit des suites et utilise le [[choix-denombrable]] ; ce théorème se démontre aussi sans choix, par un argument de borne supérieure semblable à celui des valeurs intermédiaires. Le présent nœud ne fait lui-même aucun choix : la subdivision et les escaliers y sont explicites.

  - id: ri-monotones
    etiquette: Fonctions monotones
    nature: théorème
    titre: Intégrabilité des fonctions monotones
    enonce: |
      Toute fonction monotone $f : [a, b] \to \lex{ensemble-reels}{\mathbb R}$ est intégrable au sens de Riemann. Plus précisément, si $f$ est croissante et si $x_k = a + kh$, avec $h = \frac{b - a}{n}$, est la subdivision régulière à $n$ pas, les fonctions en escalier $\varphi_n$ et $\psi_n$ égales respectivement à $f(x_k)$ et à $f(x_{k+1})$ sur $]x_k, x_{k+1}[$, et à $f$ aux points $x_k$, vérifient
      $$\varphi_n \leqslant f \leqslant \psi_n,$$
      $$\int_a^b (\psi_n - \varphi_n) = \frac{(b - a)\big(f(b) - f(a)\big)}{n}.$$
    preuve: |
      Supposons $f$ croissante ; elle est bornée, puisque $f(a) \leqslant f \leqslant f(b)$. Pour $x \in \,]x_k, x_{k+1}[$, la croissance donne $f(x_k) \leqslant f(x) \leqslant f(x_{k+1})$, c'est-à-dire $\varphi_n(x) \leqslant f(x) \leqslant \psi_n(x)$, et l'encadrement est une égalité aux points $x_k$. Par définition de l'intégrale d'une fonction en escalier,
      $$\int_a^b (\psi_n - \varphi_n) = \sum_{k=0}^{n-1} \big(f(x_{k+1}) - f(x_k)\big)h = h\big(f(b) - f(a)\big),$$
      la somme étant télescopique. Pour $\varepsilon > 0$, la propriété d'Archimède fournit $n$ tel que ce nombre soit inférieur à $\varepsilon$, et le critère d'intégrabilité ({{ri-critere|Critère d'intégrabilité}}) conclut. Si $f$ est décroissante, $-f$ est croissante, donc intégrable, et $f$ aussi par linéarité.

      ```schema ri-monotones
      Pour $f(x) = x^2$ sur $[0, 1]$ et $n = 5$, les rectangles rouges sont les écarts entre $\psi_n$, en vert, et $\varphi_n$, en bleu : le $k$-ième a pour base $h$ et pour hauteur $f(x_{k+1}) - f(x_k)$. Glissés horizontalement, ils s'empilent sans trou ni chevauchement en une colonne de base $h$ et de hauteur $f(b) - f(a)$ : c'est le télescopage, et l'aire totale vaut $\frac15$.
      ```

    remarques:
      - |
        Pour $f(x) = x^2$ sur $[0, 1]$, la formule $\sum_{k=1}^{n} k^2 = \frac{n(n+1)(2n+1)}{6}$, qui se démontre par récurrence, donne
        $$\int_0^1 \varphi_n = \frac{(n-1)(2n-1)}{6n^2},$$
        $$\int_0^1 \psi_n = \frac{(n+1)(2n+1)}{6n^2},$$
        dont la différence est bien $\frac1n$. Les deux tendent vers $\frac13$, qui est donc $\int_0^1 x^2\,dx$ : l'aire sous la parabole occupe le tiers du carré unité. Pour $n = 10$, l'encadrement est $0{,}285 \leqslant \frac13 \leqslant 0{,}385$.
      - |
        Ce théorème ne se déduit pas de l'intégrabilité des fonctions continues : une fonction monotone peut avoir une infinité de discontinuités. Sur $[0, 1]$, la fonction nulle en $0$ et égale à $\frac1m$ sur $]\frac1{m+1}, \frac1m]$ pour chaque entier $m \geqslant 1$ est croissante, discontinue en chaque point $\frac1m$ avec $m \geqslant 2$, et néanmoins intégrable. Elle n'est pas non plus en escalier, puisqu'elle prend une infinité de valeurs.
      - |
        La démonstration ne demande que la monotonie, pas la continuité, et donne une estimation explicite de l'erreur, en $\frac1n$. Elle est à l'origine de la comparaison entre une série et une intégrale ({{nb-sommation|Sommation d'Abel}}, (iv)), où $\varphi_n$ et $\psi_n$ sont remplacées par les escaliers de pas $1$ construits sur les entiers.

  - id: ri-moyenne
    etiquette: Inégalité de la moyenne
    nature: proposition
    titre: Inégalité et formule de la moyenne
    enonce: |
      (i) *Inégalité de la moyenne.* Si $f$ est intégrable sur $[a, b]$ et $m \leqslant f \leqslant M$, alors
      $$m(b - a) \leqslant \int_a^b f \leqslant M(b - a).$$
      Pour $f$ intégrable sur un segment contenant $u$ et $v$, dans un ordre quelconque, $\big|\int_u^v f\big| \leqslant |v - u| \sup |f|$.

      (ii) *Formule de la moyenne.* Si $f$ est continue sur $[a, b]$, il existe $c \in [a, b]$ tel que $\int_a^b f = (b - a)f(c)$.

      (iii) *Stricte positivité.* Si $f$ est continue et positive sur $[a, b]$ et si $\int_a^b f = 0$, alors $f$ est nulle.
    preuve: |
      (i) Les constantes $m$ et $M$ sont des fonctions en escalier d'intégrales $m(b - a)$ et $M(b - a)$ ; on applique la croissance ({{ri-proprietes|Propriétés de l'intégrale}}, (ii)). Pour la seconde inégalité, on applique la première à $|f| \leqslant \sup|f|$ sur le segment d'extrémités $u$ et $v$, puis l'inégalité $\big|\int_u^v f\big| \leqslant \big|\int_u^v |f|\,\big|$ de {{ri-proprietes|Propriétés de l'intégrale}}, (v).

      (ii) La fonction $f$ est intégrable ({{ri-continues|Fonctions continues}}), et l'image du segment $[a, b]$ est un segment $[m, M]$, où $m$ et $M$ sont le minimum et le maximum de $f$ ({{c-image|Image d'un segment}}). Par (i), le réel $\frac1{b - a}\int_a^b f$ appartient à $[m, M] = f([a, b])$ : c'est une valeur $f(c)$.

      (iii) Supposons qu'il existe $x_0 \in [a, b]$ avec $f(x_0) > 0$. Par continuité en $x_0$, avec $\varepsilon = \frac{f(x_0)}2$, il existe $\delta > 0$ tel que $f \geqslant \frac{f(x_0)}2$ sur $[a, b] \cap [x_0 - \delta, x_0 + \delta]$, qui contient un segment $[u, v]$ avec $u < v$, puisque $a < b$. Par Chasles et la positivité de $f$ sur $[a, u]$ et $[v, b]$, puis par (i),
      $$\int_a^b f \geqslant \int_u^v f \geqslant (v - u)\frac{f(x_0)}2 > 0.$$
    remarques:
      - |
        Le réel $\frac1{b - a}\int_a^b f$ est la **valeur moyenne** de $f$ sur $[a, b]$ : c'est la hauteur du rectangle de base $[a, b]$ qui a la même aire algébrique que le graphe. Pour $f(x) = x^2$ sur $[0, 1]$, elle vaut $\frac13$, atteinte en $c = \frac{\sqrt3}3 \approx 0{,}577$, et non au milieu $\frac12$ de l'intervalle.
      - |
        Le point $c$ de (ii) n'est pas unique en général. Pour $f(x) = x(1 - x)$ sur $[0, 1]$, la valeur moyenne vaut $\frac16$, prise aux deux points $c = \frac12 \pm \frac{\sqrt3}6$, symétriques par rapport au sommet de la parabole. L'erreur la plus répandue est aussi d'appliquer (ii) à une fonction discontinue : pour la fonction égale à $0$ sur $[0, 1[$ et à $1$ sur $[1, 2]$, la valeur moyenne $\frac12$ n'est pas une valeur de la fonction.

        ```schema ri-moyenne
        Pour $f(x) = x(1 - x)$, le rectangle de base $[0, 1]$ et de hauteur $\frac16$, délimité en rouge, a la même aire que le domaine sous le graphe : la partie bleue, au-dessus du niveau $\frac16$, compense exactement les deux parties grises, au-dessous, les deux aires valant $\frac{\sqrt3}{54}$. Ce niveau est atteint aux deux points $c_1$ et $c_2$ (l'échelle verticale est dilatée).
        ```

      - |
        L'inégalité (i), sous la forme $\big|\int_x^{x+h} (f(t) - f(x))\,dt\big| \leqslant |h| \sup |f(t) - f(x)|$, est exactement ce qu'emploie le {{ar-tfa|théorème fondamental de l'analyse}}.

  - id: ri-sommes
    etiquette: Sommes de Riemann
    nature: théorème
    titre: Convergence des sommes de Riemann
    texte: |
      Soit $f : [a, b] \to \lex{ensemble-reels}{\mathbb R}$ et $\sigma = (x_0 < \cdots < x_n)$ une subdivision de $[a, b]$. On appelle **pointage** de $\sigma$ une famille $\xi = (\xi_0, \dots, \xi_{n-1})$ de points avec $\xi_i \in [x_i, x_{i+1}]$, et [[somme-riemann|somme de Riemann]] associée le réel
      $$S(f, \sigma, \xi) = \sum_{i=0}^{n-1} f(\xi_i)\,(x_{i+1} - x_i).$$

      ```schema ri-sommes
      Pour $f(x) = \frac32 + \frac12 x(x - \frac95)(x - 3)$ sur $[0, 3]$, avec une subdivision à cinq intervalles et un pointage $\xi$, en rouge, la somme de Riemann est l'aire des rectangles bleus, de base $[x_i, x_{i+1}]$ et de hauteur $f(\xi_i)$. Elle vaut ici environ $4{,}99$, proche de l'intégrale $\frac{207}{40} = 5{,}175$ ; un autre pointage donnerait une autre somme, et le théorème dit que toutes se rapprochent de l'intégrale quand le pas tend vers $0$.
      ```

    enonce: |
      (i) Si $f$ est intégrable sur $[a, b]$, pour tout $\varepsilon > 0$, il existe $\delta > 0$ tel que, pour toute subdivision $\sigma$ de pas inférieur à $\delta$ et tout pointage $\xi$ de $\sigma$,
      $$\Big| S(f, \sigma, \xi) - \int_a^b f \Big| < \varepsilon.$$
      (ii) Si $f$ est continue sur $[a, b]$, et si $\delta > 0$ est tel que $|x - y| < \delta$ entraîne $|f(x) - f(y)| < \varepsilon$, alors $\big|S(f, \sigma, \xi) - \int_a^b f\big| \leqslant \varepsilon(b - a)$ pour toute subdivision de pas inférieur à $\delta$ et tout pointage.

      (iii) En particulier, pour $f$ intégrable, les sommes de Riemann régulières convergent : en notant $h = \frac{b - a}{n}$,
      $$h \sum_{k=0}^{n-1} f(a + kh) \xrightarrow[n \to \infty]{} \int_a^b f,$$
      et de même pour la somme d'indices $k = 1, \dots, n$, pointée aux extrémités droites.

      (iv) *Réciproque.* Soit $f : [a, b] \to \mathbb R$ quelconque et $I \in \mathbb R$. Si, pour tout $\varepsilon > 0$, il existe $\delta > 0$ tel que $|S(f, \sigma, \xi) - I| < \varepsilon$ pour toute subdivision $\sigma$ de pas inférieur à $\delta$ et tout pointage $\xi$, alors $f$ est intégrable et $\int_a^b f = I$.
    preuve: |
      (i) Soit $M > 0$ tel que $|f| \leqslant M$, et, par le critère d'intégrabilité ({{ri-critere|Critère d'intégrabilité}}), des fonctions en escalier $\varphi \leqslant f \leqslant \psi$ avec $\int_a^b (\psi - \varphi) < \frac\varepsilon2$, adaptées à une même subdivision $\sigma_0 = (y_0 < \cdots < y_p)$. On pose $\delta = \frac{\varepsilon}{8M(p + 1)}$. Soit $\sigma = (x_i)$ de pas inférieur à $\delta$ et $\xi$ un pointage.

      Disons que l'indice $i$ est *mauvais* si le segment $[x_i, x_{i+1}]$ contient un point de $\sigma_0$, et *bon* sinon. Un point $y_j$ appartient à au plus deux de ces segments : il y a au plus $2(p + 1)$ indices mauvais, et la somme des longueurs des segments correspondants est inférieure à $2(p + 1)\delta$. Si $i$ est bon, $[x_i, x_{i+1}]$ ne contient ni $a$ ni $b$ ni aucun $y_j$ : il est contenu dans un intervalle ouvert $]y_j, y_{j+1}[$, sur lequel $\psi$ est constante, égale à $d$, de sorte que $f(\xi_i)(x_{i+1} - x_i) \leqslant d\,(x_{i+1} - x_i) = \int_{x_i}^{x_{i+1}} \psi$. Si $i$ est mauvais, $f(\xi_i) \leqslant M$ et $\psi \geqslant f \geqslant -M$, d'où $f(\xi_i)(x_{i+1} - x_i) - \int_{x_i}^{x_{i+1}} \psi \leqslant 2M(x_{i+1} - x_i)$. En sommant, par Chasles ({{ri-escalier-proprietes|Propriétés (escalier)}}, (iii)),
      $$S(f, \sigma, \xi) - \int_a^b \psi \leqslant 4M(p + 1)\delta = \frac\varepsilon2.$$

      ```schema ri-sommes-2
      Les points $y_0 = a$, $y_1$, $y_2$ et $y_3 = b$ de $\sigma_0$ sont en bleu, la subdivision fine $\sigma$ en noir. Les segments mauvais, en rouge, sont ceux qui contiennent un $y_j$ : $y_0$, $y_1$ et $y_3$ n'en touchent qu'un chacun, tandis que $y_2$, qui appartient aussi à $\sigma$, en touche deux ; il y en a ici $5$, au plus $2(p + 1) = 8$ comme l'annonce la preuve.
      ```

      Comme $\int_a^b \psi - \int_a^b f \leqslant \int_a^b (\psi - \varphi) < \frac\varepsilon2$, on obtient $S(f, \sigma, \xi) - \int_a^b f < \varepsilon$. Le même raisonnement avec $\varphi$, ou appliqué à $-f$, donne $\int_a^b f - S(f, \sigma, \xi) < \varepsilon$.

      (ii) Par Chasles et linéarité ({{ri-proprietes|Propriétés de l'intégrale}}), et puisque l'intégrale de la constante $f(\xi_i)$ sur $[x_i, x_{i+1}]$ vaut $f(\xi_i)(x_{i+1} - x_i)$,
      $$\int_a^b f - S(f, \sigma, \xi) = \sum_{i} \int_{x_i}^{x_{i+1}} \big(f - f(\xi_i)\big).$$
      Pour $t \in [x_i, x_{i+1}]$, on a $|t - \xi_i| \leqslant x_{i+1} - x_i < \delta$, donc $|f(t) - f(\xi_i)| < \varepsilon$, et l'inégalité de la moyenne ({{ri-moyenne|Inégalité de la moyenne}}) borne chaque terme par $\varepsilon(x_{i+1} - x_i)$. La somme est au plus $\varepsilon(b - a)$.

      (iii) Les sommes écrites sont les sommes de Riemann de la subdivision régulière, de pas $\frac{b - a}{n}$, pointée par les extrémités gauches ou droites. Pour $\varepsilon > 0$ et $\delta$ donné par (i), elles sont à moins de $\varepsilon$ de l'intégrale dès que $\frac{b - a}{n} < \delta$, c'est-à-dire pour $n$ assez grand, par la propriété d'Archimède. C'est la définition de la [[limite-suite|limite d'une suite]].

      (iv) Soit $\varepsilon > 0$, $\delta$ associé, et $\sigma = (x_0 < \cdots < x_n)$ une subdivision de pas inférieur à $\delta$ ({{ri-subdivision|Subdivisions}}, (iii)), que l'on fixe. Si $f$ n'était pas majorée sur un segment $[x_i, x_{i+1}]$, on pourrait, les autres points $\xi_j$ étant fixés, rendre $S(f, \sigma, \xi)$ plus grande que $I + \varepsilon$ en déplaçant le seul point $\xi_i$ : $f$ est donc majorée, et de même minorée, sur chacun de ces segments, donc bornée. Soit $M_i$ la borne supérieure de $f$ sur $[x_i, x_{i+1}]$, et $\psi$ la fonction en escalier égale à $M_i$ sur $]x_i, x_{i+1}[$ et à $f$ aux points $x_i$ ; elle majore $f$. Pour $\eta > 0$, il existe des points $\xi_i \in [x_i, x_{i+1}]$, en nombre fini, tels que $f(\xi_i) > M_i - \eta$, et alors, puisque $S(f, \sigma, \xi) < I + \varepsilon$,
      $$\int_a^b \psi < I + \varepsilon + \eta(b - a).$$
      Ceci valant pour tout $\eta > 0$, on a $\int_a^b \psi \leqslant I + \varepsilon$. De même, avec les bornes inférieures, on obtient $\varphi \leqslant f$ en escalier avec $\int_a^b \varphi \geqslant I - \varepsilon$. Ainsi $I - \varepsilon \leqslant \int_a^b \varphi \leqslant \int_a^b \psi \leqslant I + \varepsilon$, donc $\int_a^b (\psi - \varphi) \leqslant 2\varepsilon$ : par le critère d'intégrabilité, $f$ est intégrable, et son intégrale, comprise entre $\int_a^b \varphi$ et $\int_a^b \psi$, est à distance au plus $\varepsilon$ de $I$ pour tout $\varepsilon > 0$ : elle est égale à $I$.
    remarques:
      - |
        Pour $f(x) = x^2$ sur $[0, 1]$, la somme régulière pointée à gauche vaut $\frac{(n-1)(2n-1)}{6n^2}$, et son écart à $\frac13$ est $\frac{3n - 1}{6n^2}$, de l'ordre de $\frac1{2n}$ ; la borne (ii), avec $|x^2 - y^2| \leqslant 2|x - y|$ sur $[0, 1]$, donne $\frac2n$, quatre fois trop, mais du bon ordre. Pointée aux milieux $\frac{2k+1}{2n}$, la somme vaut $\frac{4n^2 - 1}{12n^2}$, à $\frac1{12n^2}$ seulement de $\frac13$ : pour $n = 10$, l'écart passe de $0{,}048$ à $0{,}00083$. Le pointage ne change pas la limite, mais il change beaucoup la vitesse ; c'est le point de départ des méthodes de quadrature.
      - |
        L'erreur la plus répandue est de conclure à l'intégrabilité parce que des sommes de Riemann convergent. Pour l'indicatrice de $\lex{ensemble-rationnels}{\mathbb Q} \cap [0, 1]$, les sommes régulières, pointées en des rationnels, valent toutes $1$ et convergent donc, alors que la fonction n'est pas intégrable : pointées en des irrationnels, les sommes valent $0$. Ce que (iv) exige, c'est que les sommes soient proches d'un même réel pour tous les pointages à la fois, dès que le pas est assez petit.
      - |
        Ensemble, (i) et (iv) montrent que la définition par encadrement retenue ici, due à Darboux, équivaut à la définition par les sommes, qui est celle de Riemann dans son mémoire d'habilitation sur les séries trigonométriques, *Über die Darstellbarkeit einer Function durch eine trigonometrische Reihe*, présenté en 1854 et publié par Dedekind en 1867 (*Abhandlungen der Königlichen Gesellschaft der Wissenschaften zu Göttingen*, tome 13). C'est cette intégrale que prolonge l'intégrale de Lebesgue ({{m-riemann|Riemann et Lebesgue}}).

