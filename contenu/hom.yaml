# Niveau 1 : structure interne du nœud « Homologie ».
# Complexes de chaînes et suite exacte longue, homologie singulière, degré 0, invariance par
# homotopie (opérateur prisme), suite de Mayer-Vietoris (le théorème des petites chaînes, qui
# repose sur la subdivision barycentrique, est admis et signalé), homologie des sphères,
# Brouwer et invariance de la dimension.
# Coefficients entiers : les groupes abéliens sont des ℤ-modules (structures algébriques).

graphe: hom
titre: Homologie
conteneur: hom

entrees:
  topalg: [h-singuliere, h-degre0, h-homotopie]

noeuds:
  - id: h-complexes
    etiquette: Complexes de chaînes
    nature: définition
    titre: Complexes de chaînes et homologie
    texte: |
      Pour un ensemble $S$, le **groupe abélien libre** $\mathbb Z^{(S)}$ est l'ensemble des applications $S \to \mathbb Z$ nulles hors d'une partie finie ; on identifie $s \in S$ à l'application qui vaut $1$ en $s$ et $0$ ailleurs, de sorte que tout élément s'écrit $\sum n_s s$, somme finie ({{n-sommes|Sommes finies}}). Un [[complexe-chaines|complexe de chaînes]] $C$ est une suite $(C_n)_{n \in \mathbb Z}$ de groupes abéliens et de [[morphisme-groupes|morphismes]] $\partial_n : C_n \to C_{n-1}$ tels que $\partial_{n} \circ \partial_{n+1} = 0$. On pose $Z_n = \operatorname{Ker} \partial_n$ (les **cycles**), $B_n = \operatorname{Im} \partial_{n+1} \subset Z_n$ (les **bords**), et le [[groupe-homologie|groupe d'homologie]] $H_n(C) = Z_n/B_n$, quotient d'un groupe abélien par un sous-groupe ({{a-quotient|Groupe quotient}}). Un **morphisme de complexes** $f : C \to D$ est une suite de morphismes $f_n : C_n \to D_n$ tels que $\partial f_n = f_{n-1}\partial$.
    enonce: |
      (i) *Propriété universelle.* Toute application $\varphi : S \to A$ dans un groupe abélien se prolonge en un unique morphisme $\mathbb Z^{(S)} \to A$.

      (ii) Un morphisme de complexes $f$ envoie cycles sur cycles et bords sur bords, et induit des morphismes $f_* : H_n(C) \to H_n(D)$, avec $(g \circ f)_* = g_* \circ f_*$ et $\mathrm{id}_* = \mathrm{id}$.

      (iii) *Homotopie de chaînes.* S'il existe des morphismes $P_n : C_n \to D_{n+1}$ tels que $\partial P + P\partial = g - f$, alors $f_* = g_*$.
    preuve: |
      (i) Le prolongement doit envoyer $\sum n_s s$ sur $\sum n_s \varphi(s)$, où $n\,a$ désigne le multiple entier de $a$ ; cette formule définit un morphisme, par {{n-sommes|Sommes finies}}, (ii).

      (ii) Si $\partial z = 0$, $\partial f(z) = f(\partial z) = 0$ ; si $b = \partial c$, $f(b) = \partial f(c)$. On pose $f_*[z] = [f(z)]$, bien défini puisque $f(B_n) \subset B'_n$. La fonctorialité est immédiate.

      (iii) Pour un cycle $z$, $g(z) - f(z) = \partial P(z) + P(\partial z) = \partial P(z)$ est un bord.
    remarques:
      - |
        Le premier exemple est le complexe $\cdots \to 0 \to \mathbb Z \xrightarrow{\times 2} \mathbb Z \to 0$, concentré en degrés $1$ et $0$ : son homologie est nulle en degré $1$, puisque la multiplication par $2$ est injective, et vaut $\mathbb Z/2\mathbb Z$ en degré $0$. L'homologie mesure à la fois les cycles qui ne sont pas des bords et la torsion, ce qu'aucun invariant à valeurs dans un espace vectoriel réel ne voit.

  - id: h-suite-exacte
    etiquette: Suite exacte longue
    nature: théorème
    titre: Lemme du serpent et suite exacte longue
    texte: |
      Une suite de morphismes $A \xrightarrow{u} B \xrightarrow{v} C$ est **exacte** en $B$ si $\operatorname{Im} u = \operatorname{Ker} v$. Une [[suite-exacte|suite exacte courte]] de complexes est une suite $0 \to A \xrightarrow{i} B \xrightarrow{p} C \to 0$ de morphismes de complexes, exacte en chaque degré : $i$ injectif, $p$ surjectif, $\operatorname{Im} i = \operatorname{Ker} p$.
    enonce: |
      Une suite exacte courte de complexes induit une suite exacte longue
      $$\cdots \to H_n(A) \xrightarrow{i_*} H_n(B) \xrightarrow{p_*} H_n(C) \xrightarrow{\delta} H_{n-1}(A) \xrightarrow{i_*} H_{n-1}(B) \to \cdots$$
      où le **morphisme de connexion** $\delta$ est défini ainsi : pour un cycle $c \in C_n$, on choisit $b \in B_n$ tel que $p(b) = c$ ; alors $\partial b = i(a)$ pour un unique $a \in A_{n-1}$, qui est un cycle, et $\delta[c] = [a]$.
    preuve: |
      *Définition de $\delta$.* $p(\partial b) = \partial p(b) = \partial c = 0$, donc $\partial b \in \operatorname{Ker} p = \operatorname{Im} i$, et $a$ est unique par injectivité de $i$. De plus $i(\partial a) = \partial\partial b = 0$, donc $\partial a = 0$. Si l'on remplace $b$ par $b + i(a')$, $a$ devient $a + \partial a'$ ; si l'on remplace $c$ par $c + \partial c'$, avec $c' = p(b')$, on peut prendre $b + \partial b'$, et $a$ ne change pas. Donc $\delta$ est bien défini, et c'est un morphisme. Aucun axiome du choix n'intervient : la classe $\delta[c]$ ne dépend pas de $b$, dont on affirme seulement l'existence.

      *Exactitude en $H_n(B)$.* $p_* i_* = (p \circ i)_* = 0$. Si $p(b) = \partial c'$ avec $b$ cycle, écrivons $c' = p(b')$ ; alors $b - \partial b' \in \operatorname{Ker} p$, donc $b - \partial b' = i(a)$, avec $a$ cycle par injectivité de $i$, et $[b] = i_*[a]$.

      *Exactitude en $H_n(C)$.* Si $c = p(b)$ avec $b$ cycle, on prend ce $b$ et $\partial b = 0$ : $\delta[c] = 0$. Réciproquement, si $\delta[c] = 0$, $a = \partial a'$, et $b - i(a')$ est un cycle d'image $c$ : $[c] = p_*[b - i(a')]$.

      *Exactitude en $H_{n-1}(A)$.* $i_*\delta[c] = [\partial b] = 0$. Si $i(a) = \partial b$, alors $c = p(b)$ est un cycle, puisque $\partial c = p(i(a)) = 0$, et $\delta[c] = [a]$.
    remarques:
      - |
        La suite exacte longue est l'outil de calcul de toute l'homologie : on ne calcule presque jamais un groupe d'homologie directement, mais on le coince entre des groupes connus. C'est ainsi que les sphères seront traitées, au nœud {{h-spheres|Homologie des sphères}}.

  - id: h-singuliere
    etiquette: Homologie singulière
    nature: définition
    titre: Simplexes singuliers et homologie singulière
    texte: |
      Le **simplexe standard** $\Delta_n$ est l'ensemble des $t \in \mathbb R^{n+1}$ tels que $t_i \geqslant 0$ et $\sum t_i = 1$, muni de la topologie induite par la topologie produit ; ses sommets sont les vecteurs de base $e_0, \dots, e_n$. Pour $0 \leqslant i \leqslant n$, la **face** $\delta_i : \Delta_{n-1} \to \Delta_n$ insère un $0$ en position $i$. Un **simplexe singulier** de dimension $n$ d'un espace topologique $X$ est une application continue $\sigma : \Delta_n \to X$. Le groupe des **chaînes** $C_n(X)$ est le groupe abélien libre sur l'ensemble de ces simplexes, et le **bord** est le morphisme défini par
      $$\partial \sigma = \sum_{i=0}^n (-1)^i\, \sigma \circ \delta_i.$$
    enonce: |
      (i) $\partial \circ \partial = 0$ : les $C_n(X)$, nuls pour $n < 0$, forment un complexe, dont l'homologie $H_n(X)$ est l'[[homologie-singuliere|homologie singulière]] de $X$.

      (ii) Toute application continue $f : X \to Y$ induit un morphisme de complexes $f_\#(\sigma) = f \circ \sigma$, donc des morphismes $f_* : H_n(X) \to H_n(Y)$, avec $(g \circ f)_* = g_* \circ f_*$. Deux espaces homéomorphes ont des homologies isomorphes.
    preuve: |
      (i) Les faces sont affines, donc continues ({{ta-chemins|Chemins}}, (ii)), et vérifient $\delta_j \circ \delta_i = \delta_i \circ \delta_{j-1}$ pour $i < j$, comme on le voit en suivant où sont insérés les deux zéros. Dans $\partial\partial\sigma = \sum_{j}\sum_{i} (-1)^{i+j}\sigma \circ \delta_j \circ \delta_i$, le terme d'indices $(j, i)$ avec $i < j$ s'écrit $(-1)^{i+j}\sigma \circ \delta_i \circ \delta_{j-1}$ et annule le terme d'indices $(i, j - 1)$, de signe $(-1)^{i+j-1}$ ; les termes se compensent deux à deux.

      (ii) $f \circ \sigma$ est continue, et $f_\#(\partial\sigma) = \sum (-1)^i f \circ \sigma \circ \delta_i = \partial f_\#(\sigma)$. On applique {{h-complexes|Complexes de chaînes}}, (ii).
    remarques:
      - |
        L'erreur la plus répandue est de croire que $C_n(X)$ est un objet raisonnable : c'est un groupe libre sur un ensemble gigantesque, celui de toutes les applications continues $\Delta_n \to X$. Toute la théorie consiste à montrer que son homologie, elle, est petite et calculable.

  - id: h-degre0
    etiquette: Degré 0, point
    nature: proposition
    titre: Homologie d'un point et homologie de degré 0
    enonce: |
      (i) Pour un point, $H_0 \cong \mathbb Z$ et $H_n = 0$ pour $n \geqslant 1$.

      (ii) $H_0(X)$ est le groupe abélien libre sur l'ensemble des composantes connexes par arcs de $X$.
    preuve: |
      (i) Pour chaque $n$, il y a un seul simplexe singulier $\sigma_n$, et $\partial\sigma_n = \sum_{i=0}^n (-1)^i\sigma_{n-1}$ vaut $\sigma_{n-1}$ si $n \geqslant 2$ est pair, et $0$ si $n$ est impair. Le complexe est $\cdots \xrightarrow{\mathrm{id}} \mathbb Z \xrightarrow{0} \mathbb Z \xrightarrow{\mathrm{id}} \mathbb Z \xrightarrow{0} \mathbb Z \to 0$, d'homologie $\mathbb Z$ en degré $0$ et nulle ailleurs.

      (ii) La relation « être reliés par un [[chemin]] » est une relation d'équivalence ({{ta-chemins|Chemins}}) ; soit $\Pi$ l'ensemble de ses classes. Un simplexe de dimension $0$ est un point, et $\Delta_1$ est homéomorphe à $[0, 1]$ par $s \mapsto (1 - s, s)$ : un simplexe de dimension $1$ est un chemin $\gamma$, de bord $\gamma(1) - \gamma(0)$. Le morphisme $\varepsilon : C_0(X) \to \mathbb Z^{(\Pi)}$ qui envoie un point sur sa classe est surjectif et nul sur les bords. Réciproquement, soit $c = \sum n_x x$ tel que $\varepsilon(c) = 0$, c'est-à-dire que la somme des $n_x$ soit nulle dans chaque classe. Dans chaque classe rencontrée par les points de $c$, en nombre fini, fixons l'un de ces points $x_0$ et des chemins $\gamma_x$ de $x_0$ à chacun des autres ; alors $c = \partial\big(\sum n_x\gamma_x\big)$. Donc $\operatorname{Ker}\varepsilon = B_0$, et $H_0(X) = C_0(X)/B_0 \cong \mathbb Z^{(\Pi)}$.
    remarques:
      - |
        Les choix de (ii) portent sur un nombre fini de points et de chemins : aucun axiome du choix n'intervient. En degré $1$, l'homologie retrouve le groupe fondamental rendu commutatif (théorème de Hurewicz, admis ici) : pour un espace connexe par arcs, $H_1(X)$ est le quotient de $\pi_1(X)$ par le sous-groupe engendré par les commutateurs ({{ta-groupe-fondamental|Groupe fondamental}}).

  - id: h-homotopie
    etiquette: Invariance par homotopie
    nature: théorème
    titre: Invariance de l'homologie par homotopie
    texte: |
      Deux applications continues $f, g : X \to Y$ sont **homotopes** s'il existe $F : X \times [0, 1] \to Y$ continue avec $F(x, 0) = f(x)$ et $F(x, 1) = g(x)$. Une application $f : X \to Y$ est une [[equivalence-homotopie|équivalence d'homotopie]] s'il existe $g : Y \to X$ telle que $g \circ f$ et $f \circ g$ soient homotopes aux identités. Un espace est **contractile** s'il est homotopiquement équivalent à un point.
    enonce: |
      (i) Deux applications homotopes induisent les mêmes morphismes en homologie.

      (ii) Une équivalence d'homotopie induit des isomorphismes en homologie. Une partie étoilée de $\mathbb R^n$ est contractile, et a l'homologie d'un point.
    preuve: |
      (i) Pour des points $p_0, \dots, p_k$ d'un convexe de $\mathbb R^m$, notons $[p_0, \dots, p_k] : \Delta_k \to \mathbb R^m$ le simplexe affine $t \mapsto \sum t_jp_j$. Dans $\Delta_n \times [0, 1] \subset \mathbb R^{n+2}$, soit $v_i = (e_i, 0)$ et $w_i = (e_i, 1)$. L'**opérateur prisme** associe à $\sigma : \Delta_n \to X$ la chaîne
      $$P\sigma = \sum_{i=0}^n (-1)^i\, F \circ (\sigma \times \mathrm{id}) \circ [v_0, \dots, v_i, w_i, \dots, w_n].$$
      Calculons $\partial P\sigma$. Le bord de $[v_0, \dots, v_i, w_i, \dots, w_n]$ s'obtient en omettant un sommet. Omettre $v_i$, en position $i$, dans le simplexe d'indice $i$, et omettre $w_{i-1}$, en position $i$, dans le simplexe d'indice $i - 1$, donnent le même simplexe $[v_0, \dots, v_{i-1}, w_i, \dots, w_n]$, avec les signes $(-1)^i(-1)^i = 1$ et $(-1)^{i-1}(-1)^i = -1$ : ces termes se compensent pour $1 \leqslant i \leqslant n$. Il reste, d'une part, le terme où l'on omet $v_0$ dans le simplexe d'indice $0$, soit $[w_0, \dots, w_n]$, qui donne $g \circ \sigma$, et le terme où l'on omet $w_n$ dans celui d'indice $n$, soit $[v_0, \dots, v_n]$, qui donne $-f \circ \sigma$ ; d'autre part, les termes où l'on omet un sommet $v_j$ avec $j < i$ ou $w_j$ avec $j > i$, qui reconstituent exactement $-P(\partial\sigma)$, puisque les faces de $\sigma$ se lisent sur les faces de $\Delta_n \times [0, 1]$. Ainsi $\partial P + P\partial = g_\# - f_\#$, et l'on conclut par {{h-complexes|Complexes de chaînes}}, (iii).

      (ii) Si $g \circ f$ et $f \circ g$ sont homotopes aux identités, $g_* \circ f_*$ et $f_* \circ g_*$ sont les identités par (i). Si $U$ est étoilé par rapport à $a$, l'application constante $c_a$ et l'identité sont homotopes par $F(x, t) = a + t(x - a)$, continue ({{ta-chemins|Chemins}}, (ii)) : l'inclusion du point $a$ est une équivalence d'homotopie, et l'on applique {{h-degre0|Degré 0, point}}.
    remarques:
      - |
        L'invariance par homotopie fait de l'homologie un invariant bien plus grossier que l'homéomorphie : $\mathbb R^n$ a l'homologie d'un point, comme une boule fermée ou un disque. C'est précisément cette grossièreté qui la rend calculable.

  - id: h-mayer-vietoris
    etiquette: Mayer-Vietoris
    nature: théorème
    titre: La suite exacte de Mayer-Vietoris
    texte: |
      Soit $X = U \cup V$, avec $U$ et $V$ ouverts. Notons $C_n^{U,V}(X)$ le sous-groupe de $C_n(X)$ engendré par les simplexes à valeurs dans $U$ ou dans $V$ ; c'est un sous-complexe, puisque les faces d'un tel simplexe le sont aussi.
    enonce: |
      (i) *Petites chaînes.* L'inclusion $C^{U,V}(X) \to C(X)$ induit des isomorphismes en homologie.

      (ii) *Mayer-Vietoris.* Il existe une suite exacte longue
      $$\cdots \to H_n(U \cap V) \xrightarrow{(i_*, j_*)} H_n(U) \oplus H_n(V) \xrightarrow{k_* - l_*} H_n(X) \xrightarrow{\delta} H_{n-1}(U \cap V) \to \cdots$$
      où $i, j, k, l$ sont les inclusions de $U \cap V$ dans $U$ et $V$, et de $U$ et $V$ dans $X$.
    preuve: |
      (i) **Admis.** La difficulté contournée est la **subdivision barycentrique** : on construit un opérateur $S$ sur les chaînes, qui remplace chaque simplexe par la somme signée des simplexes de sa subdivision barycentrique, et un opérateur $T$ tel que $\partial T + T\partial = \mathrm{id} - S$. Le diamètre des simplexes affines est multiplié par au plus $n/(n+1)$ à chaque subdivision ; par compacité de $\Delta_n$ et un argument de nombre de Lebesgue appliqué au recouvrement $\{\sigma^{-1}(U), \sigma^{-1}(V)\}$, une chaîne donnée devient, après assez de subdivisions, une chaîne de $C^{U,V}(X)$. On en déduit que tout cycle est homologue à un cycle de $C^{U,V}$, et qu'un cycle de $C^{U,V}$ qui borde dans $C(X)$ borde dans $C^{U,V}$.

      (ii) La suite $0 \to C(U \cap V) \xrightarrow{(i_\#, j_\#)} C(U) \oplus C(V) \xrightarrow{k_\# - l_\#} C^{U,V}(X) \to 0$ est exacte. L'application de gauche est injective ; celle de droite est surjective, par définition de $C^{U,V}$ ; et $k_\#(a) = l_\#(b)$ signifie que $a$ et $b$ sont la même chaîne, formée de simplexes à valeurs dans $U \cap V$. On applique la suite exacte longue ({{h-suite-exacte|Suite exacte longue}}), puis (i) pour remplacer l'homologie de $C^{U,V}(X)$ par celle de $X$.
    remarques:
      - |
        Mayer-Vietoris est l'analogue homologique du théorème de van Kampen pour le groupe fondamental : on calcule l'invariant d'une réunion à partir de ceux des morceaux et de leur intersection. La différence essentielle est que l'homologie s'assemble par des suites exactes de groupes abéliens, beaucoup plus maniables que les produits amalgamés de groupes.

  - id: h-spheres
    etiquette: Homologie des sphères
    nature: théorème
    titre: Homologie des sphères
    texte: |
      Pour $n \geqslant 0$, la sphère $S^n$ est l'ensemble des $x \in \mathbb R^{n+1}$ tels que $x_1^2 + \cdots + x_{n+1}^2 = 1$, munie de la topologie induite. On note $\|x\| = \big(\sum x_i^2\big)^{1/2}$, fonction continue.
    enonce: |
      Pour $n \geqslant 1$, $H_k(S^n) \cong \mathbb Z$ si $k = 0$ ou $k = n$, et $H_k(S^n) = 0$ sinon. Pour $n = 0$, $H_0(S^0) \cong \mathbb Z^2$ et $H_k(S^0) = 0$ pour $k \geqslant 1$.
    preuve: |
      *Le cas $n = 0$.* $S^0 = \{-1, 1\}$ a deux composantes, chacune réduite à un point, et l'homologie d'une réunion disjointe d'ouverts est la somme directe, chaque simplexe ayant une image connexe par arcs ({{h-degre0|Degré 0, point}}).

      *Les ouverts.* Pour $n \geqslant 1$, soit $N = (0, \dots, 0, 1)$, $S = -N$, $U = S^n \setminus \{N\}$ et $V = S^n \setminus \{S\}$. La projection stéréographique $x \mapsto (x_1, \dots, x_n)/(1 - x_{n+1})$ est un homéomorphisme de $U$ sur $\mathbb R^n$, de réciproque $z \mapsto \big(2z, \|z\|^2 - 1\big)/(\|z\|^2 + 1)$, toutes deux continues comme composées d'opérations continues. Donc $U$, et de même $V$, ont l'homologie d'un point ({{h-homotopie|Invariance par homotopie}}).

      *L'intersection.* $U \cap V$ contient l'équateur $S^{n-1} \times \{0\}$, et $r(x) = (x_1, \dots, x_n, 0)/\|(x_1, \dots, x_n)\|$ est bien défini sur $U \cap V$, puisque $x \neq \pm N$. On a $r \circ \iota = \mathrm{id}$, où $\iota$ est l'inclusion de l'équateur, et $\iota \circ r$ est homotope à l'identité de $U \cap V$ par $F(x, t) = \big(x_1, \dots, x_n, (1 - t)x_{n+1}\big)/\|(x_1, \dots, x_n, (1 - t)x_{n+1})\|$, qui reste dans $U \cap V$. Donc $U \cap V$ a l'homologie de $S^{n-1}$.

      *Mayer-Vietoris* ({{h-mayer-vietoris|Mayer-Vietoris}}). Pour $k \geqslant 2$, $H_k(U) \oplus H_k(V) = 0$ et $H_{k-1}(U) \oplus H_{k-1}(V) = 0$, donc $\delta : H_k(S^n) \to H_{k-1}(S^{n-1})$ est un isomorphisme. En degrés bas, la suite se termine par $0 \to H_1(S^n) \to H_0(U \cap V) \to \mathbb Z \oplus \mathbb Z \to H_0(S^n) \to 0$. Pour $n = 1$, $U \cap V$ a deux composantes, $H_0(U \cap V) \cong \mathbb Z^2$, la flèche suivante envoie $(a, b)$ sur $(a + b, a + b)$, de noyau isomorphe à $\mathbb Z$, et $H_1(S^1) \cong \mathbb Z$. Pour $n \geqslant 2$, $U \cap V$ est connexe par arcs, la flèche $\mathbb Z \to \mathbb Z^2$, $a \mapsto (a, a)$, est injective, et $H_1(S^n) = 0$. Dans tous les cas $S^n$ est connexe par arcs et $H_0(S^n) \cong \mathbb Z$. Une récurrence sur $n$ conclut.
    remarques:
      - |
        Le calcul $H_1(S^1) \cong \mathbb Z$ retrouve, en version commutative, $\pi_1(S^1) \cong \mathbb Z$ ({{ta-cercle|Groupe fondamental du cercle}}). Mais le groupe fondamental ne distingue pas $S^2$ de $S^3$, tous deux simplement connexes, alors que $H_2$ et $H_3$ les séparent : c'est le gain des dimensions supérieures.

  - id: h-applications
    etiquette: Brouwer, dimension
    nature: théorème
    titre: Point fixe de Brouwer et invariance de la dimension
    texte: |
      La boule fermée $D^n$ est l'ensemble des $x \in \mathbb R^n$ tels que $\|x\| \leqslant 1$, de bord $S^{n-1}$. Une **rétraction** de $D^n$ sur $S^{n-1}$ est une application continue $r : D^n \to S^{n-1}$ égale à l'identité sur $S^{n-1}$.
    enonce: |
      (i) Pour $n \geqslant 1$, il n'existe pas de rétraction de $D^n$ sur $S^{n-1}$.

      (ii) *Brouwer.* Toute application continue $f : D^n \to D^n$ a un point fixe.

      (iii) *Invariance de la dimension.* Si $\mathbb R^m$ et $\mathbb R^n$ sont homéomorphes, avec $m, n \geqslant 1$, alors $m = n$.
    preuve: |
      (i) Pour $n = 1$, $D^1 = [-1, 1]$ est connexe et $S^0 = \{-1, 1\}$ ne l'est pas, alors qu'une rétraction serait continue et surjective. Pour $n \geqslant 2$, si $r \circ \iota = \mathrm{id}_{S^{n-1}}$, alors $r_* \circ \iota_*$ est l'identité de $H_{n-1}(S^{n-1}) \cong \mathbb Z$ ; mais elle se factorise par $H_{n-1}(D^n) = 0$, la boule étant convexe ({{h-homotopie|Invariance par homotopie}}), ce qui est absurde.

      (ii) Supposons $f(x) \neq x$ pour tout $x$. Posons $u = x - f(x) \neq 0$, et soit $t(x) \geqslant 0$ la plus grande racine du trinôme $\|x + tu\|^2 - 1 = \|u\|^2t^2 + 2\langle x, u\rangle t + \|x\|^2 - 1$, où $\langle x, u \rangle = \sum x_iu_i$ ; sa valeur en $t = 0$ est $\leqslant 0$, donc
      $$t(x) = \frac{-\langle x, u\rangle + \sqrt{\langle x, u \rangle^2 + \|u\|^2(1 - \|x\|^2)}}{\|u\|^2},$$
      qui dépend continûment de $x$. Alors $r(x) = x + t(x)u$ est continue, de norme $1$, et $r(x) = x$ si $\|x\| = 1$, puisque $t(x) = 0$ en ce cas. C'est une rétraction, ce que (i) interdit.

      (iii) Un homéomorphisme $h : \mathbb R^m \to \mathbb R^n$ induit un homéomorphisme de $\mathbb R^m \setminus \{0\}$ sur $\mathbb R^n \setminus \{h(0)\}$, et ce dernier est homéomorphe à $\mathbb R^n \setminus \{0\}$ par translation. Or $\mathbb R^k \setminus \{0\}$ a l'homologie de $S^{k-1}$, par la rétraction $x \mapsto x/\|x\|$ et l'homotopie $F(x, t) = x/\big((1 - t) + t\|x\|\big)$. Les homologies de $S^{m-1}$ et de $S^{n-1}$ diffèrent si $m \neq n$, par {{h-spheres|Homologie des sphères}} : si $m, n \geqslant 2$, le degré où $H$ est non nul, hors du degré $0$, les distingue ; si l'un vaut $1$, le nombre de composantes connexes par arcs, $2$ ou $1$, les distingue.
    remarques:
      - |
        Le théorème de Brouwer a des conséquences concrètes : en remuant un café sans le renverser, un point au moins retrouve sa place initiale, si le mouvement est continu et que le liquide reste dans la tasse. Sa démonstration est purement existentielle ; la recherche effective d'un point fixe est un problème algorithmique difficile.
      - |
        L'invariance du domaine de Brouwer (1911), qui affirme qu'un ouvert de $\mathbb R^n$ ne peut être homéomorphe à une partie non ouverte de $\mathbb R^n$, se démontre avec les mêmes outils, appliqués à l'homologie relative ; elle est admise ici. Elle justifie que la dimension d'une variété topologique soit bien définie, ce que la {{geod|géométrie différentielle}} obtenait plus facilement par la différentielle.

