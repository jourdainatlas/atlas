# Niveau 1 : structure interne du nœud « Homologie ».
# Complexes de chaînes et suite exacte longue, homologie singulière, degré 0, invariance par
# homotopie (opérateur prisme), subdivision barycentrique et théorème des petites chaînes (démontrés
# le 29 oct. 2026), suite de Mayer-Vietoris, homologie des sphères,
# Brouwer et invariance de la dimension.
# Chapitre hom-jordan (30 oct. 2026) : homologie réduite, complémentaires des cellules et des sphères
# topologiques de Sⁿ, séparation de Jordan-Brouwer (avec la frontière), théorème de Jordan, invariance du domaine.
# Coefficients entiers : les groupes abéliens sont des ℤ-modules (structures algébriques).

graphe: hom
titre: Homologie
conteneur: hom

entrees:
  topalg: [h-singuliere, h-degre0, h-homotopie]

noeuds:
  - id: h-complexes
    etiquette: Complexes de chaînes
    nature: définition
    titre: Complexes de chaînes et homologie
    texte: |
      Pour un ensemble $S$, le **groupe abélien libre** $\mathbb Z^{(S)}$ est l'ensemble des applications $S \to \lex{ensemble-entiers-relatifs}{\mathbb Z}$ nulles hors d'une partie finie ; on identifie $s \in S$ à l'application qui vaut $1$ en $s$ et $0$ ailleurs, de sorte que tout élément s'écrit $\sum n_s s$, somme finie ({{n-sommes|Sommes finies}}).

      Un [[complexe-chaines|complexe de chaînes]] $C$ est une suite $(C_n)_{n \in \mathbb Z}$ de groupes abéliens et de [[morphisme-groupes|morphismes]] $\partial_n : C_n \to C_{n-1}$ tels que
      $$\partial_{n} \circ \partial_{n+1} = 0.$$
      On pose $Z_n = \operatorname{Ker} \partial_n$ (les **cycles**), $B_n = \operatorname{Im} \partial_{n+1} \subset Z_n$ (les **bords**), et le [[groupe-homologie|groupe d'homologie]] $\lex{groupe-homologie}{H_n}(C) = Z_n/B_n$, quotient d'un groupe abélien par un sous-groupe ({{a-quotient|Groupe quotient}}).

      Un **morphisme de complexes** $f : C \to D$ est une suite de morphismes $f_n : C_n \to D_n$ tels que $\partial f_n = f_{n-1}\partial$.
    enonce: |
      (i) *Propriété universelle.* Toute application $\varphi : S \to A$ dans un groupe abélien se prolonge en un unique morphisme $\mathbb Z^{(S)} \to A$.

      (ii) Un morphisme de complexes $f$ envoie cycles sur cycles et bords sur bords, et induit des morphismes $f_* : H_n(C) \to H_n(D)$, avec $(g \circ f)_* = g_* \circ f_*$ et $\mathrm{id}_* = \mathrm{id}$.

      (iii) *Homotopie de chaînes.* S'il existe des morphismes $P_n : C_n \to D_{n+1}$ tels que $\partial P + P\partial = g - f$, alors $f_* = g_*$.
    preuve: |
      (i) Le prolongement doit envoyer $\sum n_s s$ sur $\sum n_s \varphi(s)$, où $n\,a$ désigne le multiple entier de $a$ ; cette formule définit un morphisme, par {{n-sommes|Sommes finies}}, (ii).

      (ii) Si $\partial z = 0$, $\partial f(z) = f(\partial z) = 0$ ; si $b = \partial c$, $f(b) = \partial f(c)$. On pose $f_*[z] = [f(z)]$, bien défini puisque $f(B_n) \subset B'_n$. La fonctorialité est immédiate.

      (iii) Pour un cycle $z$,
      $$\begin{aligned} g(z) - f(z) &= \partial P(z) + P(\partial z) \\ &= \partial P(z) \end{aligned}$$
      est un bord.
    remarques:
      - |
        Le premier exemple est le complexe $\cdots \to 0 \to \mathbb Z \xrightarrow{\times 2} \mathbb Z \to 0$, concentré en degrés $1$ et $0$ : son homologie est nulle en degré $1$, puisque la multiplication par $2$ est injective, et vaut $\lex{anneau-zn}{\mathbb Z/2\mathbb Z}$ en degré $0$. L'homologie mesure à la fois les cycles qui ne sont pas des bords et la torsion, ce qu'aucun invariant à valeurs dans un espace vectoriel réel ne voit.

  - id: h-suite-exacte
    etiquette: Suite exacte longue
    nature: théorème
    titre: Lemme du serpent et suite exacte longue
    texte: |
      Une suite de morphismes $A \xrightarrow{u} B \xrightarrow{v} C$ est **exacte** en $B$ si $\operatorname{Im} u = \operatorname{Ker} v$. Une [[suite-exacte|suite exacte courte]] de complexes est une suite $0 \to A \xrightarrow{i} B \xrightarrow{p} C \to 0$ de morphismes de complexes, exacte en chaque degré : $i$ injectif, $p$ surjectif, $\operatorname{Im} i = \operatorname{Ker} p$.
    enonce: |
      Une suite exacte courte de complexes induit une suite exacte longue
      $$\begin{aligned} \cdots \to \lex{groupe-homologie}{H_n}(A) &\xrightarrow{i_*} H_n(B) \\ &\xrightarrow{p_*} H_n(C) \\ &\xrightarrow{\delta} H_{n-1}(A) \\ &\xrightarrow{i_*} H_{n-1}(B) \to \cdots \end{aligned}$$
      où le **morphisme de connexion** $\delta$ est défini ainsi : pour un cycle $c \in C_n$, on choisit $b \in B_n$ tel que $p(b) = c$ ; alors $\partial b = i(a)$ pour un unique $a \in A_{n-1}$, qui est un cycle, et $\delta[c] = [a]$.

      $$\begin{CD} @. b @>p>> c \\ @. @V{\partial}VV @VV{\partial}V \\ a @>i>> \partial b @>p>> 0 \end{CD}$$

      Le diagramme se lit en zigzag : on relève $c \in C_n$ en $b \in B_n$, on prend le bord $\partial b \in B_{n-1}$, puis l'unique $a \in A_{n-1}$ tel que $i(a) = \partial b$. La commutation du carré de droite, $p(\partial b) = \partial c = 0$, est ce qui place $\partial b$ dans l'image de $i$.
    preuve: |
      *Définition de $\delta$.* $p(\partial b) = \partial p(b) = \partial c = 0$, donc $\partial b \in \operatorname{Ker} p = \operatorname{Im} i$, et $a$ est unique par injectivité de $i$. De plus $i(\partial a) = \partial\partial b = 0$, donc $\partial a = 0$.

      Si l'on remplace $b$ par $b + i(a')$, $a$ devient $a + \partial a'$ ; si l'on remplace $c$ par $c + \partial c'$, avec $c' = p(b')$, on peut prendre $b + \partial b'$, et $a$ ne change pas. Donc $\delta$ est bien défini, et c'est un morphisme.

      Aucun axiome du choix n'intervient : la classe $\delta[c]$ ne dépend pas de $b$, dont on affirme seulement l'existence.

      *Exactitude en $H_n(B)$.* $p_* i_* = (p \circ i)_* = 0$. Si $p(b) = \partial c'$ avec $b$ cycle, écrivons $c' = p(b')$ ; alors $b - \partial b' \in \operatorname{Ker} p$, donc $b - \partial b' = i(a)$, avec $a$ cycle par injectivité de $i$, et $[b] = i_*[a]$.

      *Exactitude en $H_n(C)$.* Si $c = p(b)$ avec $b$ cycle, on prend ce $b$ et $\partial b = 0$ : $\delta[c] = 0$. Réciproquement, si $\delta[c] = 0$, $a = \partial a'$, et $b - i(a')$ est un cycle d'image $c$ : $[c] = p_*[b - i(a')]$.

      *Exactitude en $H_{n-1}(A)$.* $i_*\delta[c] = [\partial b] = 0$. Si $i(a) = \partial b$, alors $c = p(b)$ est un cycle, puisque $\partial c = p(i(a)) = 0$, et $\delta[c] = [a]$.
    remarques:
      - |
        La suite exacte longue est l'outil de calcul de toute l'homologie : on ne calcule presque jamais un groupe d'homologie directement, mais on le coince entre des groupes connus. C'est ainsi que les sphères seront traitées, au nœud {{h-spheres|Homologie des sphères}}.

  - id: h-singuliere
    etiquette: Homologie singulière
    nature: définition
    titre: Simplexes singuliers et homologie singulière
    texte: |
      Le **simplexe standard** $\Delta_n$ est l'ensemble des $t \in \lex{n-uplet}{\mathbb R^{n+1}}$ tels que $t_i \geqslant 0$ et $\sum t_i = 1$, muni de la topologie induite par la topologie produit ; ses sommets sont les vecteurs de base $e_0, \dots, e_n$. Pour $0 \leqslant i \leqslant n$, la **face** $\delta_i : \Delta_{n-1} \to \Delta_n$ insère un $0$ en position $i$.

      Un **simplexe singulier** de dimension $n$ d'un espace topologique $X$ est une application continue $\sigma : \Delta_n \to X$. Le groupe des **chaînes** $C_n(X)$ est le groupe abélien libre sur l'ensemble de ces simplexes, et le **bord** est le morphisme défini par
      $$\partial \sigma = \sum_{i=0}^n (-1)^i\, \sigma \circ \delta_i.$$

      ```schema h-singuliere
      Pour $n = 2$, la face $\delta_0$ a pour image l'arête de $e_1$ à $e_2$, $\delta_1$ celle de $e_0$ à $e_2$, et $\delta_2$ celle de $e_0$ à $e_1$, orientées comme l'image des sommets de $\Delta_1$. Avec les signes du bord, $\partial\sigma$ parcourt le contour de $\Delta_2$ : de $e_0$ à $e_1$, de $e_1$ à $e_2$, puis de $e_2$ à $e_0$ grâce au signe $-$.
      ```
    enonce: |
      (i) $\partial \circ \partial = 0$ : les $C_n(X)$, nuls pour $n < 0$, forment un complexe, dont l'homologie $\lex{homologie-singuliere}{H_n}(X)$ est l'[[homologie-singuliere|homologie singulière]] de $X$.

      (ii) Toute application continue $f : X \to Y$ induit un morphisme de complexes $f_\#(\sigma) = f \circ \sigma$, donc des morphismes $f_* : H_n(X) \to H_n(Y)$, avec $(g \circ f)_* = g_* \circ f_*$. Deux espaces homéomorphes ont des homologies isomorphes.
    preuve: |
      (i) Les faces sont affines, donc continues ({{ta-chemins|Chemins}}, (ii)), et vérifient $\delta_j \circ \delta_i = \delta_i \circ \delta_{j-1}$ pour $i < j$, comme on le voit en suivant où sont insérés les deux zéros.

      Dans
      $$\partial\partial\sigma = \sum_{j}\sum_{i} (-1)^{i+j}\sigma \circ \delta_j \circ \delta_i,$$
      le terme d'indices $(j, i)$ avec $i < j$ s'écrit $(-1)^{i+j}\sigma \circ \delta_i \circ \delta_{j-1}$ et annule le terme d'indices $(i, j - 1)$, de signe $(-1)^{i+j-1}$ ; les termes se compensent deux à deux.

      (ii) $f \circ \sigma$ est continue, et
      $$\begin{aligned} f_\#(\partial\sigma) &= \sum (-1)^i f \circ \sigma \circ \delta_i \\ &= \partial f_\#(\sigma). \end{aligned}$$
      On applique {{h-complexes|Complexes de chaînes}}, (ii).
    remarques:
      - |
        L'erreur la plus répandue est de croire que $C_n(X)$ est un objet raisonnable : c'est un groupe libre sur un ensemble gigantesque, celui de toutes les applications continues $\Delta_n \to X$. Toute la théorie consiste à montrer que son homologie, elle, est petite et calculable.

  - id: h-degre0
    etiquette: Degré 0, point
    nature: proposition
    titre: Homologie d'un point et homologie de degré 0
    texte: |
      Dans un espace $X$, la relation « être reliés par un [[chemin]] » est une relation d'équivalence : le chemin constant $c_x$ relie $x$ à lui-même, le chemin inverse $\bar\gamma$ relie $y$ à $x$ quand $\gamma$ relie $x$ à $y$, et la concaténation $\gamma \cdot \delta$ relie $x$ à $z$ quand $\gamma$ relie $x$ à $y$ et $\delta$ relie $y$ à $z$ ({{ta-chemins|Chemins}}, (ii)). Ses classes sont les [[composante-connexe-par-arcs|composantes connexes par arcs]] de $X$. Chacune est connexe par arcs, car un chemin $\gamma$ reste dans la classe de son origine : $\gamma(s)$ y est relié par le chemin $t \mapsto \gamma(st)$. Par suite, toute partie connexe par arcs de $X$ est contenue dans l'une d'elles.
    enonce: |
      (i) Pour un point, $\lex{homologie-singuliere}{H_0} \cong \lex{ensemble-entiers-relatifs}{\mathbb Z}$ et $H_n = 0$ pour $n \geqslant 1$.

      (ii) $H_0(X)$ est le groupe abélien libre sur l'ensemble des composantes connexes par arcs de $X$.
    preuve: |
      (i) Pour chaque $n$, il y a un seul simplexe singulier $\sigma_n$, et
      $$\partial\sigma_n = \sum_{i=0}^n (-1)^i\sigma_{n-1}$$
      vaut $\sigma_{n-1}$ si $n \geqslant 2$ est pair, et $0$ si $n$ est impair. Le complexe est
      $$\cdots \xrightarrow{\mathrm{id}} \mathbb Z \xrightarrow{0} \mathbb Z \xrightarrow{\mathrm{id}} \mathbb Z \xrightarrow{0} \mathbb Z \to 0,$$
      d'homologie $\mathbb Z$ en degré $0$ et nulle ailleurs.

      (ii) La relation « être reliés par un [[chemin]] » est une relation d'équivalence ({{ta-chemins|Chemins}}) ; soit $\Pi$ l'ensemble de ses classes.

      Un simplexe de dimension $0$ est un point, et $\Delta_1$ est homéomorphe à $[0, 1]$ par $s \mapsto (1 - s, s)$ : un simplexe de dimension $1$ est un chemin $\gamma$, de bord $\gamma(1) - \gamma(0)$. Le morphisme $\varepsilon : C_0(X) \to \mathbb Z^{(\Pi)}$ qui envoie un point sur sa classe est surjectif et nul sur les bords.

      Réciproquement, soit $c = \sum n_x x$ tel que $\varepsilon(c) = 0$, c'est-à-dire que la somme des $n_x$ soit nulle dans chaque classe. Dans chaque classe rencontrée par les points de $c$, en nombre fini, fixons l'un de ces points $x_0$ et des chemins $\gamma_x$ de $x_0$ à chacun des autres ; alors
      $$c = \partial\Big(\sum n_x\gamma_x\Big).$$
      Donc $\operatorname{Ker}\varepsilon = B_0$, et $H_0(X) = C_0(X)/B_0 \cong \mathbb Z^{(\Pi)}$.
    remarques:
      - |
        Les choix de (ii) portent sur un nombre fini de points et de chemins : aucun axiome du choix n'intervient. En degré $1$, l'homologie retrouve le groupe fondamental rendu commutatif (théorème de Hurewicz, admis ici) : pour un espace connexe par arcs, $H_1(X)$ est le quotient de $\lex{groupe-fondamental}{\pi_1}(X)$ par le sous-groupe engendré par les commutateurs ({{ta-groupe-fondamental|Groupe fondamental}}).

  - id: h-homotopie
    etiquette: Invariance par homotopie
    nature: théorème
    titre: Invariance de l'homologie par homotopie
    texte: |
      Deux applications continues $f, g : X \to Y$ sont **homotopes** s'il existe $F : X \times [0, 1] \to Y$ continue avec $F(x, 0) = f(x)$ et $F(x, 1) = g(x)$. Une application $f : X \to Y$ est une [[equivalence-homotopie|équivalence d'homotopie]] s'il existe $g : Y \to X$ telle que $g \circ f$ et $f \circ g$ soient homotopes aux identités. Un espace est **contractile** s'il est homotopiquement équivalent à un point.
    enonce: |
      (i) Deux applications homotopes induisent les mêmes morphismes en homologie.

      (ii) Une équivalence d'homotopie induit des isomorphismes en homologie. Une partie étoilée de $\lex{n-uplet}{\mathbb R^n}$ est contractile, et a l'homologie d'un point.
    preuve: |
      (i) Pour des points $p_0, \dots, p_k$ d'un convexe de $\mathbb R^m$, notons $[p_0, \dots, p_k] : \Delta_k \to \mathbb R^m$ le simplexe affine $t \mapsto \sum t_jp_j$. Dans $\Delta_n \times [0, 1] \subset \mathbb R^{n+2}$, soit $v_i = (e_i, 0)$ et $w_i = (e_i, 1)$. L'**opérateur prisme** associe à $\sigma : \Delta_n \to X$ la chaîne
      $$\begin{aligned} P\sigma = \sum_{i=0}^n (-1)^i\, &F \circ (\sigma \times \mathrm{id}) \\ &\circ [v_0, \dots, v_i, w_i, \dots, w_n]. \end{aligned}$$

      Calculons $\partial P\sigma$. Le bord de $[v_0, \dots, v_i, w_i, \dots, w_n]$ s'obtient en omettant un sommet.

      Omettre $v_i$, en position $i$, dans le simplexe d'indice $i$, et omettre $w_{i-1}$, en position $i$, dans le simplexe d'indice $i - 1$, donnent le même simplexe $[v_0, \dots, v_{i-1}, w_i, \dots, w_n]$, avec les signes $(-1)^i(-1)^i = 1$ et $(-1)^{i-1}(-1)^i = -1$ : ces termes se compensent pour $1 \leqslant i \leqslant n$.

      Il reste, d'une part, le terme où l'on omet $v_0$ dans le simplexe d'indice $0$, soit $[w_0, \dots, w_n]$, qui donne $g \circ \sigma$, et le terme où l'on omet $w_n$ dans celui d'indice $n$, soit $[v_0, \dots, v_n]$, qui donne $-f \circ \sigma$.

      D'autre part, les termes où l'on omet un sommet $v_j$ avec $j < i$ ou $w_j$ avec $j > i$, qui reconstituent exactement $-P(\partial\sigma)$, puisque les faces de $\sigma$ se lisent sur les faces de $\Delta_n \times [0, 1]$.

      ```schema h-homotopie
      Pour $n = 1$, le prisme $\Delta_1 \times [0, 1]$ est un carré découpé en deux triangles, $[v_0, w_0, w_1]$ compté avec le signe $+$ et $[v_0, v_1, w_1]$ avec le signe $-$. Dans le bord de $P\sigma$, la diagonale commune se compense ; il reste le haut $g \circ \sigma$, le bas $-f \circ \sigma$, et les deux côtés verticaux, qui forment $-P(\partial\sigma)$.
      ```

      Ainsi $\partial P + P\partial = g_\# - f_\#$, et l'on conclut par {{h-complexes|Complexes de chaînes}}, (iii).

      (ii) Si $g \circ f$ et $f \circ g$ sont homotopes aux identités, $g_* \circ f_*$ et $f_* \circ g_*$ sont les identités par (i).

      Si $U$ est étoilé par rapport à $a$, l'application constante $c_a$ et l'identité sont homotopes par $F(x, t) = a + t(x - a)$, continue ({{ta-chemins|Chemins}}, (ii)) : l'inclusion du point $a$ est une équivalence d'homotopie, et l'on applique {{h-degre0|Degré 0, point}}.
    remarques:
      - |
        L'invariance par homotopie fait de l'homologie un invariant bien plus grossier que l'homéomorphie : $\mathbb R^n$ a l'homologie d'un point, comme une boule fermée ou un disque. C'est précisément cette grossièreté qui la rend calculable.

  - id: h-subdivision
    etiquette: Subdivision barycentrique
    nature: théorème
    titre: Subdivision barycentrique
    texte: |
      Soit $Y$ une partie convexe de $\lex{n-uplet}{\mathbb R^m}$. Pour $w_0, \dots, w_n \in Y$ et des réels $t_i \geqslant 0$ de somme $1$, le point $\sum_i t_iw_i$ appartient à $Y$. C'est clair pour $n = 0$ ou $t_n = 1$, le point valant alors $w_0$ ou $w_n$ ; c'est la définition de la convexité pour $n = 1$, et, pour $n \geqslant 2$ et $t_n \neq 1$, on écrit
      $$\begin{aligned} \sum_i t_iw_i &= (1 - t_n)\sum_{i < n}\frac{t_i}{1 - t_n}w_i \\ &\quad + t_nw_n \end{aligned}$$
      et l'on raisonne par récurrence sur $n$.

      Le **simplexe affine** $[w_0, \dots, w_n] : \Delta_n \to Y$ est l'application $t \mapsto \sum_i t_iw_i$, continue ({{ta-chemins|Chemins}}, (ii)) ; elle envoie $e_i$ sur $w_i$, de sorte que ses sommets la déterminent, et ses faces sont
      $$\begin{aligned} &[w_0, \dots, w_n] \circ \delta_i \\ &\quad = [w_0, \dots, \widehat{w_i}, \dots, w_n], \end{aligned}$$
      où le chapeau signale l'omission.

      Le groupe $LC_n(Y)$ des **chaînes linéaires**, pour $n \geqslant 0$, est le sous-groupe de $C_n(Y)$ engendré par les simplexes affines ; on y ajoute $LC_{-1}(Y) = \lex{ensemble-entiers-relatifs}{\mathbb Z}$, engendré par un symbole $[\varnothing]$, avec $\partial[w_0] = [\varnothing]$ et $\partial[\varnothing] = 0$.

      En degré $n \geqslant 1$, le bord de $LC(Y)$ est celui de $C(Y)$, et $LC(Y)$ est un complexe : $\partial\partial = 0$ en degré au moins $2$ par {{h-singuliere|Homologie singulière}}, (i), et $\partial\partial[w_0, w_1] = [\varnothing] - [\varnothing] = 0$.

      Une application $f : \mathbb R^m \to \mathbb R^{m'}$ est **affine** si elle s'écrit $f(x) = u(x) + c$, avec $u$ linéaire ; elle vérifie alors
      $$f\Big(\sum_i t_ix_i\Big) = \sum_i t_if(x_i)$$
      dès que $\sum_i t_i = 1$.

      Pour $b \in Y$, le **cône** de sommet $b$ est le morphisme $LC_n(Y) \to LC_{n+1}(Y)$ défini par
      $$b \cdot [w_0, \dots, w_n] = [b, w_0, \dots, w_n]$$
      et $b \cdot [\varnothing] = [b]$ ({{h-complexes|Complexes de chaînes}}, (i)). Le **barycentre** de $\lambda = [w_0, \dots, w_n]$ est
      $$b_\lambda = \frac1{n+1}\sum_i w_i \in Y.$$

      On définit, par récurrence sur $n \geqslant -1$, deux morphismes $S : LC_n(Y) \to LC_n(Y)$ et $T : LC_n(Y) \to LC_{n+1}(Y)$ par $S[\varnothing] = [\varnothing]$, $T[\varnothing] = 0$, et, pour un simplexe affine $\lambda$ de dimension $n \geqslant 0$,
      $$\begin{aligned} S\lambda &= b_\lambda \cdot S(\partial\lambda), \\ T\lambda &= b_\lambda \cdot (\lambda - T\partial\lambda). \end{aligned}$$

      Enfin, pour un espace $X$ et un simplexe singulier $\sigma : \Delta_n \to X$, on note $\iota_n = [e_0, \dots, e_n]$ l'identité de $\Delta_n$, et l'on pose $S\sigma = \sigma_\#(S\iota_n)$ et $T\sigma = \sigma_\#(T\iota_n)$, ce qui définit des morphismes $S : C_n(X) \to C_n(X)$ et $T : C_n(X) \to C_{n+1}(X)$. C'est la **subdivision barycentrique**.
    enonce: |
      (i) *Cône.* Pour $\alpha \in LC_n(Y)$, $n \geqslant -1$, on a $\partial(b \cdot \alpha) = \alpha - b \cdot \partial\alpha$.

      (ii) *Chaînes linéaires.* Sur $LC(Y)$, $\partial S = S\partial$ et $\partial T + T\partial = \mathrm{id} - S$. Si $f : Y \to Y'$ est la restriction d'une application affine, $f_\# S = Sf_\#$ et $f_\# T = Tf_\#$.

      (iii) *Chaînes singulières.* Sur $C(X)$, $S$ est un morphisme de complexes et $\partial T + T\partial = \mathrm{id} - S$. Pour $g : X \to X'$ continue, $g_\# S = Sg_\#$ et $g_\# T = Tg_\#$. Les simplexes qui figurent dans $S\sigma$ et $T\sigma$ sont de la forme $\sigma \circ \mu$, avec $\mu : \Delta_k \to \Delta_n$ affine : si $\sigma$ est à valeurs dans une partie $A$ de $X$, $S\sigma$ et $T\sigma$ sont des chaînes de $A$.

      (iv) *Diamètres.* Munissons les $\mathbb R^m$ de la distance $d_\infty$ ({{me-espace|Espaces métriques}}). L'image d'un simplexe affine $[w_0, \dots, w_n]$ a pour diamètre $\max_{i,j} d_\infty(w_i, w_j)$. Pour $k \in \lex{ensemble-entiers-naturels}{\mathbb N}$, $S^k\iota_n$ est une combinaison de simplexes affines de $\Delta_n$ dont les images ont un diamètre au plus égal à $\big(\frac n{n+1}\big)^k$.
    preuve: |
      (i) Pour $\alpha = [w_0, \dots, w_n]$ avec $n \geqslant 1$, le bord de $[b, w_0, \dots, w_n]$ comporte le terme $[w_0, \dots, w_n]$, où l'on omet $b$, et les termes $(-1)^{i+1}[b, w_0, \dots, \widehat{w_i}, \dots, w_n]$, dont la somme est $-b \cdot \partial\alpha$.

      Pour $n = 0$, $\partial[b, w_0] = [w_0] - [b] = \alpha - b \cdot [\varnothing]$ ; pour $n = -1$, $\partial[b] = [\varnothing]$. On conclut par linéarité.

      (ii) Montrons que $\partial S = S\partial$ par récurrence sur $n$ ; le cas $n = -1$ est clair. Pour un simplexe affine $\lambda$ de dimension $n \geqslant 0$, (i) et l'hypothèse de récurrence donnent
      $$\begin{aligned} \partial S\lambda &= S\partial\lambda - b_\lambda \cdot \partial S\partial\lambda \\ &= S\partial\lambda - b_\lambda \cdot S\partial\partial\lambda \\ &= S\partial\lambda. \end{aligned}$$

      Montrons de même que $\partial T + T\partial = \mathrm{id} - S$. En degré $-1$, les deux membres sont nuls, puisque $S[\varnothing] = [\varnothing]$. Pour $\lambda$ de dimension $n \geqslant 0$, l'hypothèse de récurrence en degré $n - 1$ s'écrit
      $$\begin{aligned} \partial T\partial\lambda &= \partial\lambda - S\partial\lambda - T\partial\partial\lambda \\ &= \partial\lambda - S\partial\lambda. \end{aligned}$$
      Par (i),
      $$\begin{aligned} \partial T\lambda &= \lambda - T\partial\lambda - b_\lambda \cdot (\partial\lambda - \partial T\partial\lambda) \\ &= \lambda - T\partial\lambda - b_\lambda \cdot S\partial\lambda \\ &= \lambda - T\partial\lambda - S\lambda. \end{aligned}$$

      *Naturalité.* Une application affine envoie barycentre sur barycentre et vérifie $f_\#[w_0, \dots, w_n] = [f(w_0), \dots, f(w_n)]$, donc $f_\#(b \cdot \alpha) = f(b) \cdot f_\#\alpha$ ; on prolonge $f_\#$ par $f_\#[\varnothing] = [\varnothing]$. Une récurrence sur $n$, appliquée aux deux formules de définition, donne
      $$\begin{aligned} f_\#S\lambda &= f(b_\lambda) \cdot f_\#S\partial\lambda \\ &= b_{f_\#\lambda} \cdot S\partial f_\#\lambda = Sf_\#\lambda, \end{aligned}$$
      et de même pour $T$.

      (iii) Un simplexe affine $\lambda : \Delta_n \to Y$ est l'image de $\iota_n$ par lui-même, $\lambda = \lambda_\#\iota_n$, et la naturalité donne $\lambda_\#(S\iota_n) = S\lambda$ : les deux définitions de $S$ coïncident sur les simplexes affines, et de même pour $T$.

      Les faces $\delta_i : \Delta_{n-1} \to \Delta_n$ sont affines, et $\iota_n \circ \delta_i = \delta_{i\#}\iota_{n-1}$. Pour $n \geqslant 1$,
      $$\begin{aligned} \partial S\sigma &= \sigma_\#\partial S\iota_n = \sigma_\#S\partial\iota_n \\ &= \sum_i (-1)^i\sigma_\#\delta_{i\#}S\iota_{n-1} \\ &= \sum_i (-1)^i S(\sigma \circ \delta_i) = S\partial\sigma, \end{aligned}$$
      et, de la même façon,
      $$\begin{aligned} \partial T\sigma &= \sigma_\#(\iota_n - S\iota_n - T\partial\iota_n) \\ &= \sigma - S\sigma - T\partial\sigma. \end{aligned}$$

      Pour $n = 0$, $S\iota_0 = [e_0]$ et $T\iota_0 = [e_0, e_0]$, donc $S\sigma = \sigma$ et $\partial T\sigma = \sigma - \sigma = 0$, ce qui est l'identité attendue, puisque le bord d'un $0$-simplexe singulier est nul.

      La naturalité vient de $g_\#\sigma_\# = (g \circ \sigma)_\#$. Enfin $S\iota_n$ et $T\iota_n$ sont des combinaisons de simplexes affines $\mu$ de $\Delta_n$, et les simplexes de $S\sigma$ et $T\sigma$ sont les $\sigma \circ \mu$.

      (iv) *Diamètre d'un simplexe affine.* Si $x = \sum_i t_iw_i$ et $y = \sum_j s_jw_j$, alors, puisque $\sum_{i,j} t_is_j = 1$,
      $$x - y = \sum_{i,j} t_is_j(w_i - w_j),$$
      et, en majorant coordonnée par coordonnée la valeur absolue de cette combinaison à coefficients positifs,
      $$d_\infty(x, y) \leqslant \max_{i,j} d_\infty(w_i, w_j) = \delta ;$$
      ce maximum est atteint en des sommets.

      De même, pour le barycentre $b$,
      $$b - x = \frac1{n+1}\sum_j t_j \sum_{i \neq j} (w_i - w_j),$$
      d'où $d_\infty(b, x) \leqslant \frac n{n+1}\,\delta$ pour tout point $x$ de l'image.

      *Une subdivision.* Montrons, par récurrence sur $n$, que $S\lambda$ est une combinaison de simplexes affines à sommets dans l'image de $\lambda$ et de diamètre au plus $\frac n{n+1}\delta$. Pour $n = 0$, $S\lambda = \lambda$, de diamètre $0$.

      Pour $n \geqslant 1$, $S\lambda = b_\lambda \cdot S(\partial\lambda)$ est une combinaison de simplexes $[b_\lambda, u_0, \dots, u_{n-1}]$, où $[u_0, \dots, u_{n-1}]$ figure dans $S$ d'une face de $\lambda$ ; par hypothèse de récurrence, les $u_j$ sont dans l'image de la face, donc de $\lambda$, et
      $$d_\infty(u_j, u_l) \leqslant \frac{n-1}{n}\delta \leqslant \frac n{n+1}\delta,$$
      la face ayant un diamètre au plus $\delta$. Enfin $d_\infty(b_\lambda, u_j) \leqslant \frac n{n+1}\delta$ par ce qui précède.

      *Itération.* $S$ étant linéaire, $S^{k+1}\iota_n$ est combinaison des $S\mu$, pour les simplexes $\mu$ de $S^k\iota_n$ ; par récurrence sur $k$, et puisque $\Delta_n$ a pour diamètre $d_\infty(e_0, e_1) = 1$ si $n \geqslant 1$, on obtient la borne $\big(\frac n{n+1}\big)^k$. Pour $n = 0$, $\Delta_0$ est un point.
    remarques:
      - |
        Pour le triangle $\Delta_2$, $S\iota_2$ est formé de six triangles et $S^2\iota_2$ de trente-six, ce que l'on vérifie en programmant les formules de définition ; les coefficients sont $\pm 1$, et l'orientation alterne d'un triangle à son voisin.

        ```schema h-subdivision
        À gauche, $S\iota_2$ : chaque triangle a pour sommets le barycentre de $\Delta_2$, en rouge, le milieu d'un côté et l'une de ses extrémités. À droite, $S^2\iota_2$ : on recommence dans chacun des six triangles. Les triangles comptés avec le signe $+$, en bleu, alternent avec ceux comptés avec le signe $-$, non remplis. Le plus grand côté passe de $1$ à $\frac23$, puis à $\frac7{18}$, pour la distance $d_\infty$, sous les bornes $\frac23$ et $\frac49$ de (iv).
        ```
      - |
        L'opérateur $T$ ne sert qu'à prouver que $S$ ne change pas l'homologie : la formule $\partial T + T\partial = \mathrm{id} - S$ est une homotopie de chaînes, comme l'opérateur prisme du nœud {{h-homotopie|Invariance par homotopie}}. L'erreur la plus répandue est de croire que l'on peut supprimer les simplexes à sommets répétés, comme dans les complexes simpliciaux : $T\iota_1 = [b, e_0, e_1] - [b, e_1, e_1] + [b, e_0, e_0]$ contient de tels simplexes, qui sont des simplexes singuliers légitimes et qu'il faut garder.

  - id: h-petites-chaines
    etiquette: Petites chaînes
    nature: théorème
    titre: Le théorème des petites chaînes
    texte: |
      Soit $\mathcal U$ un ensemble d'ouverts d'un espace $X$, de réunion $X$. Notons $C_n^{\mathcal U}(X)$ le sous-groupe de $C_n(X)$ engendré par les simplexes singuliers à valeurs dans un élément de $\mathcal U$ ; c'est un sous-complexe, puisque les faces d'un tel simplexe le sont aussi.

      Le simplexe $\Delta_n$ est muni de la distance $d_\infty$, dont la topologie est la topologie produit de $\lex{n-uplet}{\mathbb R^{n+1}}$ ({{me-rn|L'espace ℝⁿ}}, (i)), celle du nœud {{h-singuliere|Homologie singulière}}. Il est compact, comme partie fermée et bornée (même nœud, (iii)) : il est contenu dans $[0, 1]^{n+1}$, et c'est l'intersection des fermés $\{t_i \geqslant 0\}$ et $\{\sum_i t_i = 1\}$, images réciproques de fermés par des fonctions continues.
    enonce: |
      L'inclusion $\jmath : C^{\mathcal U}(X) \to C(X)$ induit des isomorphismes $H_n(C^{\mathcal U}(X)) \to \lex{homologie-singuliere}{H_n}(X)$. Plus précisément, il existe un morphisme de complexes $\rho : C(X) \to C^{\mathcal U}(X)$ tel que $\rho \circ \jmath = \mathrm{id}$ et que $\jmath \circ \rho$ soit homotope à l'identité, au sens de {{h-complexes|Complexes de chaînes}}, (iii).
    preuve: |
      *Un entier attaché à chaque simplexe.* Pour $\sigma : \Delta_n \to X$ et $k \in \lex{ensemble-entiers-naturels}{\mathbb N}$, notons $P(\sigma, k)$ la propriété : toute partie non vide de $\Delta_n$ de diamètre au plus $c_{n,k} = \big(\frac n{n+1}\big)^k$ est contenue dans l'un des ouverts $\sigma^{-1}(U)$, $U \in \mathcal U$.

      Ces ouverts recouvrent le compact $\Delta_n$, qui a donc un nombre de Lebesgue $\eta > 0$ ({{me-lebesgue|Nombre de Lebesgue}}) ; comme $0 \leqslant \frac n{n+1} < 1$, $c_{n,k} \to 0$ ({{su-infinies|Limites infinies}}, (iv)), et $P(\sigma, k)$ est vraie dès que $c_{n,k} < \eta$.

      Soit $m(\sigma)$ le plus petit entier $k$ tel que $P(\sigma, k)$ ({{n-ordre|Bon ordre sur ℕ}}). Comme $c_{n,k}$ décroît avec $k$, $P(\sigma, k)$ est vraie pour tout $k \geqslant m(\sigma)$.

      *Trois propriétés de $m$.* (a) Si $P(\sigma, k)$, alors $S^k\sigma \in C^{\mathcal U}(X)$. En effet, $S^k\sigma = \sigma_\#(S^k\iota_n)$ par naturalité ({{h-subdivision|Subdivision barycentrique}}, (iii)), et chaque simplexe $\mu$ de $S^k\iota_n$ a une image de diamètre au plus $c_{n,k}$ (même nœud, (iv)), contenue dans un $\sigma^{-1}(U)$ : $\sigma \circ \mu$ est à valeurs dans $U$.

      (b) Si $\sigma$ est à valeurs dans $U \in \mathcal U$, alors $\Delta_n = \sigma^{-1}(U)$, et $m(\sigma) = 0$.

      (c) Si $\tau = \sigma \circ \delta_i$ est une face de $\sigma$, $m(\tau) \leqslant m(\sigma)$. En effet, $\delta_i$, qui insère un $0$, préserve $d_\infty$, et $c_{n-1,k} \leqslant c_{n,k}$ ; une partie $A$ de $\Delta_{n-1}$ de diamètre au plus $c_{n-1,k}$ a donc une image $\delta_i(A)$ de même diamètre, contenue dans un $\sigma^{-1}(U)$ si $P(\sigma, k)$, et $A \subset \tau^{-1}(U)$.

      *L'opérateur $D$.* Posons
      $$D_k = \sum_{i < k} TS^i.$$
      Comme $S$ est un morphisme de complexes et que $\partial T + T\partial = \mathrm{id} - S$ ({{h-subdivision|Subdivision barycentrique}}, (iii)),
      $$\begin{aligned} \partial D_k + D_k\partial &= \sum_{i < k} (\partial T + T\partial)S^i \\ &= \sum_{i < k} (S^i - S^{i+1}) = \mathrm{id} - S^k. \end{aligned}$$
      On définit $D : C_n(X) \to C_{n+1}(X)$ par $D\sigma = D_{m(\sigma)}\sigma$ sur chaque simplexe, puis par linéarité ({{h-complexes|Complexes de chaînes}}, (i)), et $\rho = \mathrm{id} - \partial D - D\partial$.

      *$\rho$ est à valeurs dans $C^{\mathcal U}(X)$.* Soit $\sigma$ un simplexe, $m = m(\sigma)$, et $\partial\sigma = \sum_i (-1)^i\sigma_i$. D'après l'identité précédente,
      $$\partial D\sigma = \sigma - S^m\sigma - D_m\partial\sigma,$$
      donc
      $$\begin{aligned} \rho\sigma &= S^m\sigma + \sum_i (-1)^i\big(D_m - D_{m(\sigma_i)}\big)\sigma_i \\ &= S^m\sigma + \sum_i (-1)^i \sum_{m(\sigma_i) \leqslant j < m} TS^j\sigma_i, \end{aligned}$$
      puisque $m(\sigma_i) \leqslant m$ par (c).

      Le terme $S^m\sigma$ est dans $C^{\mathcal U}(X)$ par (a). Pour $j \geqslant m(\sigma_i)$, $S^j\sigma_i$ y est aussi, par (a), et $T$ conserve $C^{\mathcal U}(X)$, puisque $T\tau$ est une chaîne de l'image de $\tau$ ({{h-subdivision|Subdivision barycentrique}}, (iii)).

      *Conclusion.* $\rho$ est un morphisme de complexes : $\partial\rho = \partial - \partial D\partial = \rho\partial$.

      Si $\sigma \in C^{\mathcal U}(X)$, ses faces y sont aussi, et (b) donne $D\sigma = 0$ et $D\partial\sigma = 0$, d'où $\rho\sigma = \sigma$ : $\rho \circ \jmath = \mathrm{id}$.

      Enfin $\jmath \circ \rho = \mathrm{id} - \partial D - D\partial$ est homotope à l'identité, et induit l'identité en homologie ({{h-complexes|Complexes de chaînes}}, (iii)). Ainsi $\jmath_*$ et $\rho_*$ sont réciproques l'un de l'autre.
    remarques:
      - |
        L'idée se voit sur un $1$-simplexe : un chemin qui n'est contenu dans aucun des ouverts devient, après assez de subdivisions, une somme de petits chemins, chacun contenu dans l'un d'eux, et la subdivision ne change pas sa classe d'homologie.

        ```schema h-petites-chaines
        Le $1$-simplexe $\sigma$ n'est contenu ni dans $U$ ni dans $V$, et une seule subdivision ne suffit pas, puisque sa première moitié sort à la fois de $U$ et de $V$. Après deux subdivisions, chacun des quatre morceaux est dans $U$, en bleu, ou dans $V$, en vert : $S^2\sigma$ est déjà une petite chaîne. L'entier $m(\sigma)$ vaut pourtant $3$ ici, car la propriété $P(\sigma, k)$ porte sur toutes les parties de diamètre au plus $\big(\frac12\big)^k$, et pas seulement sur les morceaux de la subdivision.
        ```
      - |
        Aucun choix n'intervient : l'entier $m(\sigma)$ est le plus petit de ceux qui conviennent, et le nombre de Lebesgue ne sert qu'à prouver qu'il en existe. La subtilité de la preuve tient au fait que $m$ varie d'un simplexe à l'autre ; c'est la propriété (c), qui compare $m$ sur un simplexe et sur ses faces, qui permet de recoller les subdivisions de profondeurs différentes.

  - id: h-mayer-vietoris
    etiquette: Mayer-Vietoris
    nature: théorème
    titre: La suite exacte de Mayer-Vietoris
    texte: |
      Soit $X = U \cup V$, avec $U$ et $V$ ouverts. Notons $C_n^{U,V}(X)$ le sous-groupe de $C_n(X)$ engendré par les simplexes à valeurs dans $U$ ou dans $V$ ; c'est un sous-complexe, puisque les faces d'un tel simplexe le sont aussi.
    enonce: |
      (i) *Petites chaînes.* L'inclusion $C^{U,V}(X) \to C(X)$ induit des isomorphismes en homologie.

      (ii) *Mayer-Vietoris.* Il existe une suite exacte longue
      $$\begin{aligned} \cdots \to {}&\lex{homologie-singuliere}{H_n}(U \cap V) \\ &\xrightarrow{(i_*, j_*)} H_n(U) \oplus H_n(V) \\ &\xrightarrow{k_* - l_*} H_n(X) \\ &\xrightarrow{\delta} H_{n-1}(U \cap V) \to \cdots \end{aligned}$$
      où $i, j, k, l$ sont les inclusions de $U \cap V$ dans $U$ et $V$, et de $U$ et $V$ dans $X$.
    preuve: |
      (i) C'est le théorème du nœud {{h-petites-chaines|Petites chaînes}}, appliqué à $\mathcal U = \{U, V\}$, pour lequel $C^{\mathcal U}(X) = C^{U,V}(X)$.

      (ii) La suite
      $$\begin{aligned} 0 \to {}&C(U \cap V) \\ &\xrightarrow{(i_\#, j_\#)} C(U) \oplus C(V) \\ &\xrightarrow{k_\# - l_\#} C^{U,V}(X) \to 0 \end{aligned}$$
      est exacte. L'application de gauche est injective ; celle de droite est surjective, par définition de $C^{U,V}$ ; et $k_\#(a) = l_\#(b)$ signifie que $a$ et $b$ sont la même chaîne, formée de simplexes à valeurs dans $U \cap V$.

      On applique la suite exacte longue ({{h-suite-exacte|Suite exacte longue}}), puis (i) pour remplacer l'homologie de $C^{U,V}(X)$ par celle de $X$.
    remarques:
      - |
        Mayer-Vietoris est l'analogue homologique du théorème de van Kampen pour le groupe fondamental : on calcule l'invariant d'une réunion à partir de ceux des morceaux et de leur intersection. La différence essentielle est que l'homologie s'assemble par des suites exactes de groupes abéliens, beaucoup plus maniables que les produits amalgamés de groupes.

  - id: h-spheres
    etiquette: Homologie des sphères
    nature: théorème
    titre: Homologie des sphères
    texte: |
      Pour $n \geqslant 0$, la sphère unité $\lex{sphere-unite}{S^n}$ ({{ar-topo|Topologie de ℝ}}) est l'ensemble des $x \in \lex{n-uplet}{\mathbb R^{n+1}}$ tels que $x_1^2 + \cdots + x_{n+1}^2 = 1$, munie de la topologie induite. On note $\|x\| = \big(\sum x_i^2\big)^{1/2}$, fonction continue.
    enonce: |
      Pour $n \geqslant 1$, $\lex{homologie-singuliere}{H_k}(S^n) \cong \lex{ensemble-entiers-relatifs}{\mathbb Z}$ si $k = 0$ ou $k = n$, et $H_k(S^n) = 0$ sinon. Pour $n = 0$, $H_0(S^0) \cong \mathbb Z^2$ et $H_k(S^0) = 0$ pour $k \geqslant 1$.
    preuve: |
      *Le cas $n = 0$.* $S^0 = \{-1, 1\}$ a deux composantes, chacune réduite à un point, et l'homologie d'une réunion disjointe d'ouverts est la somme directe, chaque simplexe ayant une image connexe par arcs ({{h-degre0|Degré 0, point}}).

      *Les ouverts.* Pour $n \geqslant 1$, soit $N = (0, \dots, 0, 1)$, $S = -N$, $U = S^n \setminus \{N\}$ et $V = S^n \setminus \{S\}$. La projection stéréographique
      $$x \mapsto \frac{(x_1, \dots, x_n)}{1 - x_{n+1}}$$
      est un homéomorphisme de $U$ sur $\mathbb R^n$, de réciproque
      $$z \mapsto \frac{\big(2z, \|z\|^2 - 1\big)}{\|z\|^2 + 1},$$
      toutes deux continues comme composées d'opérations continues. Donc $U$, et de même $V$, ont l'homologie d'un point ({{h-homotopie|Invariance par homotopie}}).

      *L'intersection.* $U \cap V$ contient l'équateur $S^{n-1} \times \{0\}$, et
      $$r(x) = \frac{(x_1, \dots, x_n, 0)}{\|(x_1, \dots, x_n)\|}$$
      est bien défini sur $U \cap V$, puisque $x \neq \pm N$.

      On a $r \circ \iota = \mathrm{id}$, où $\iota$ est l'inclusion de l'équateur, et $\iota \circ r$ est homotope à l'identité de $U \cap V$ par
      $$\begin{aligned} &F(x, t) \\ &\quad = \frac{\big(x_1, \dots, x_n, (1 - t)x_{n+1}\big)}{\|(x_1, \dots, x_n, (1 - t)x_{n+1})\|}, \end{aligned}$$
      qui reste dans $U \cap V$. Donc $U \cap V$ a l'homologie de $S^{n-1}$.

      ```schema h-spheres
      Pour $n = 1$, $U$ est le cercle privé de $N$ et $V$ le cercle privé de $S$. Leur intersection est formée de deux arcs ouverts, que l'homotopie $F$ fait glisser, dans le sens des flèches, sur les deux points de l'équateur $S^0$.
      ```

      *Mayer-Vietoris* ({{h-mayer-vietoris|Mayer-Vietoris}}). Pour $k \geqslant 2$, $H_k(U) \oplus H_k(V) = 0$ et $H_{k-1}(U) \oplus H_{k-1}(V) = 0$, donc $\delta : H_k(S^n) \to H_{k-1}(S^{n-1})$ est un isomorphisme.

      En degrés bas, la suite se termine par
      $$\begin{aligned} 0 \to H_1(S^n) &\to H_0(U \cap V) \\ &\to \mathbb Z \oplus \mathbb Z \to H_0(S^n) \to 0. \end{aligned}$$

      Pour $n = 1$, $U \cap V$ a deux composantes, $H_0(U \cap V) \cong \mathbb Z^2$, la flèche suivante envoie $(a, b)$ sur $(a + b, a + b)$, de noyau isomorphe à $\mathbb Z$, et $H_1(S^1) \cong \mathbb Z$.

      Pour $n \geqslant 2$, $U \cap V$ est connexe par arcs, la flèche $\mathbb Z \to \mathbb Z^2$, $a \mapsto (a, a)$, est injective, et $H_1(S^n) = 0$.

      Dans tous les cas $S^n$ est connexe par arcs et $H_0(S^n) \cong \mathbb Z$. Une récurrence sur $n$ conclut.
    remarques:
      - |
        Le calcul $H_1(S^1) \cong \mathbb Z$ retrouve, en version commutative, $\lex{groupe-fondamental}{\pi_1}(S^1) \cong \mathbb Z$ ({{ta-cercle|Groupe fondamental du cercle}}). Mais le groupe fondamental ne distingue pas $S^2$ de $S^3$, tous deux simplement connexes, alors que $H_2$ et $H_3$ les séparent : c'est le gain des dimensions supérieures.

  - id: h-applications
    etiquette: Brouwer, dimension
    nature: théorème
    titre: Point fixe de Brouwer et invariance de la dimension
    texte: |
      La boule fermée $D^n$ est l'ensemble des $x \in \lex{n-uplet}{\mathbb R^n}$ tels que $\|x\| \leqslant 1$, de bord $\lex{sphere-unite}{S^{n-1}}$. Une **rétraction** de $D^n$ sur $S^{n-1}$ est une application continue $r : D^n \to S^{n-1}$ égale à l'identité sur $S^{n-1}$.
    enonce: |
      (i) Pour $n \geqslant 1$, il n'existe pas de rétraction de $D^n$ sur $S^{n-1}$.

      (ii) *Brouwer.* Toute application continue $f : D^n \to D^n$ a un point fixe.

      (iii) *Invariance de la dimension.* Si $\mathbb R^m$ et $\mathbb R^n$ sont homéomorphes, avec $m, n \geqslant 1$, alors $m = n$.
    preuve: |
      (i) Pour $n = 1$, $D^1 = [-1, 1]$ est connexe et $S^0 = \{-1, 1\}$ ne l'est pas, alors qu'une rétraction serait continue et surjective.

      Pour $n \geqslant 2$, si $r \circ \iota = \mathrm{id}_{S^{n-1}}$, alors $r_* \circ \iota_*$ est l'identité de $\lex{homologie-singuliere}{H_{n-1}}(S^{n-1}) \cong \lex{ensemble-entiers-relatifs}{\mathbb Z}$ ; mais elle se factorise par $H_{n-1}(D^n) = 0$, la boule étant convexe ({{h-homotopie|Invariance par homotopie}}), ce qui est absurde.

      (ii) Supposons $f(x) \neq x$ pour tout $x$. Posons $u = x - f(x) \neq 0$, et soit $t(x) \geqslant 0$ la plus grande racine du trinôme
      $$\begin{aligned} &\|x + tu\|^2 - 1 \\ &\quad = \|u\|^2t^2 + 2\langle x, u\rangle t + \|x\|^2 - 1, \end{aligned}$$
      où $\langle x, u \rangle = \sum x_iu_i$ ; sa valeur en $t = 0$ est $\leqslant 0$, donc
      $$\begin{aligned} t(x) = {}&\frac{1}{\|u\|^2}\Big(-\langle x, u\rangle \\ &+ \sqrt{\langle x, u \rangle^2 + \|u\|^2(1 - \|x\|^2)}\Big), \end{aligned}$$
      qui dépend continûment de $x$.

      Alors $r(x) = x + t(x)u$ est continue, de norme $1$, et $r(x) = x$ si $\|x\| = 1$, puisque $t(x) = 0$ en ce cas. C'est une rétraction, ce que (i) interdit.

      ```schema h-applications
      Dans le plan, pour $x = (0{,}3\,;\,0{,}2)$ et $f(x) = (-0{,}2\,;\,-0{,}1)$, la demi-droite issue de $f(x)$ qui passe par $x$ sort du disque en $r(x) \approx (0{,}849\,;\,0{,}529)$, atteint pour $t(x) \approx 1{,}097$. Si $x$ est sur le bord, $t(x) = 0$ et $r(x) = x$.
      ```

      (iii) Un homéomorphisme $h : \mathbb R^m \to \mathbb R^n$ induit un homéomorphisme de $\mathbb R^m \setminus \{0\}$ sur $\mathbb R^n \setminus \{h(0)\}$, et ce dernier est homéomorphe à $\mathbb R^n \setminus \{0\}$ par translation.

      Or $\mathbb R^k \setminus \{0\}$ a l'homologie de $S^{k-1}$, par la rétraction $x \mapsto x/\|x\|$ et l'homotopie
      $$F(x, t) = \frac{x}{(1 - t) + t\|x\|}.$$

      Les homologies de $S^{m-1}$ et de $S^{n-1}$ diffèrent si $m \neq n$, par {{h-spheres|Homologie des sphères}} : si $m, n \geqslant 2$, le degré où $H$ est non nul, hors du degré $0$, les distingue ; si l'un vaut $1$, le nombre de composantes connexes par arcs, $2$ ou $1$, les distingue.
    remarques:
      - |
        Le théorème de Brouwer a des conséquences concrètes : en remuant un café sans le renverser, un point au moins retrouve sa place initiale, si le mouvement est continu et que le liquide reste dans la tasse. Sa démonstration est purement existentielle ; la recherche effective d'un point fixe est un problème algorithmique difficile.
      - |
        L'invariance du domaine de Brouwer, qui affirme qu'un ouvert de $\mathbb R^n$ ne peut être homéomorphe à une partie non ouverte de $\mathbb R^n$, se démontre avec les mêmes outils, Mayer-Vietoris et les sphères, complétés par un argument de compacité. Elle l'est au chapitre {{hom-jordan|Théorème de Jordan-Brouwer}} ({{hj-invariance-domaine|Invariance du domaine}}), à la suite de la séparation de $\mathbb R^n$ par une sphère topologique. Elle justifie que la dimension d'une variété topologique soit bien définie, ce que la {{geod|géométrie différentielle}} obtenait plus facilement par la différentielle.

  - id: hom-jordan
    etiquette: Jordan-Brouwer
    nature: chapitre
    titre: Théorème de Jordan-Brouwer
    sous: hom-jordan
    texte: |
      Une courbe fermée du plan sans point double sépare le plan en deux régions, l'une bornée, l'autre non, dont elle est la frontière commune : c'est le théorème de Jordan, évident sur un cercle et difficile en général, parce que la courbe n'est supposée que continue. Le chapitre le démontre en toute dimension, sous la forme de Jordan-Brouwer : une sphère topologique de dimension $n - 1$ sépare $\mathbb R^n$, pour $n \geqslant 2$, en exactement deux composantes connexes par arcs, et elle est la frontière de chacune.

      La démonstration est homologique. L'homologie réduite du complémentaire d'une partie de la sphère $S^n$ homéomorphe à un cube est nulle, par récurrence sur la dimension du cube, en le coupant en deux moitiés et en passant à la limite par un argument de compacité ; celle du complémentaire d'une sphère topologique de dimension $k$ est celle de $S^{n-k-1}$, par Mayer-Vietoris. Il en découle aussi l'invariance du domaine de Brouwer : une application continue et injective d'un ouvert de $\mathbb R^n$ dans $\mathbb R^n$ a une image ouverte. Aucune forme du choix n'intervient. Le théorème de Schoenflies et la sphère cornue d'Alexander sont présentés en remarque, sans démonstration.

