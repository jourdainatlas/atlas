# Niveau 2 : structure interne du chapitre « Théorème de Hurewicz » (nœud hom-hurewicz du graphe hom, créé le
# 31 oct. 2026).
# Groupe dérivé et abélianisé (rappelés sur place : cohgr, où le terme est au lexique, n'est pas en amont de hom) ;
# chemins vus comme simplexes de dimension 1, congruences modulo les bords (chemin constant, inverse,
# concaténation, homotopie) ; théorème de Hurewicz en degré 1 : h : π₁(X, x₀) → H₁(X) morphisme, surjectif et de
# noyau le groupe dérivé quand X est connexe par arcs ; exemples : cercle (générateur explicite, degré), bouquet de
# deux cercles, tore, ℝPⁿ.
# Choix : aucun. Les chemins λ_x de x₀ à x ne sont fixés que pour les points, en nombre fini, d'une chaîne donnée ;
# la démonstration la plus répandue les fixe pour tous les points de X, ce qui serait un usage du choix.

graphe: hom-hurewicz
titre: Théorème de Hurewicz
conteneur: hom-hurewicz

entrees:
  h-homotopie: [hu-chemins]

noeuds:
  - id: hu-derive
    etiquette: Groupe dérivé
    nature: proposition
    titre: Groupe dérivé et abélianisé
    texte: |
      Dans un [[groupe]] $G$, le **commutateur** de deux éléments $x$ et $y$ est $[x, y] = xyx^{-1}y^{-1}$ ; il vaut $e$ si et seulement si $x$ et $y$ commutent. Le **groupe dérivé** $D(G)$ est le sous-groupe de $G$ engendré par les commutateurs ({{a-sous-groupe|Sous-groupe}}, (iii)).

      Le point (i) montre que $D(G)$ est distingué. Le groupe quotient $G^{\mathrm{ab}} = G/D(G)$ ({{a-quotient|Groupe quotient}}) est l'**abélianisé** de $G$.
    enonce: |
      (i) Pour tout [[morphisme-groupes|morphisme]] $f : G \to G'$, on a $f(D(G)) \subset D(G')$. En particulier, $D(G)$ est distingué dans $G$. Si $f$ est un isomorphisme, alors $f(D(G)) = D(G')$, et $f$ induit un isomorphisme de $G^{\mathrm{ab}}$ sur $G'^{\mathrm{ab}}$.

      (ii) Soit $N$ un sous-groupe distingué de $G$. Le quotient $G/N$ est commutatif si et seulement si $D(G) \subset N$. En particulier, $G^{\mathrm{ab}}$ est commutatif, et $D(G) = \{e\}$ si $G$ est commutatif.

      (iii) Tout morphisme $f$ de $G$ dans un groupe commutatif vérifie $D(G) \subset \operatorname{Ker} f$, et s'écrit de façon unique $f = \bar f \circ \pi$, où $\pi : G \to G^{\mathrm{ab}}$ est la projection et $\bar f$ un morphisme.

      (iv) Dans le [[groupe-libre|groupe libre]] $F(a, b)$, le groupe dérivé est le sous-groupe distingué engendré par $aba^{-1}b^{-1}$, et l'abélianisé $F(a, b)^{\mathrm{ab}}$ est isomorphe à $\lex{n-uplet}{\mathbb Z^2}$, par un isomorphisme qui envoie les classes de $a$ et de $b$ sur $(1, 0)$ et $(0, 1)$.
    preuve: |
      (i) Un morphisme respecte les produits et les inverses ({{a-morphisme|Morphisme}}, (i)), donc
      $$f([x, y]) = [f(x), f(y)].$$
      Ainsi $f^{-1}(D(G'))$ est un sous-groupe de $G$ (même nœud, (iii)) qui contient tous les commutateurs de $G$ ; il contient donc $D(G)$, plus petit sous-groupe qui les contienne, ce qui signifie $f(D(G)) \subset D(G')$.

      Pour $g \in G$, la conjugaison par $g$, $x \mapsto gxg^{-1}$, est un morphisme de $G$ dans lui-même, puisque $gxg^{-1}\,gyg^{-1} = gxyg^{-1}$. Ce qui précède donne $gD(G)g^{-1} \subset D(G)$ : le sous-groupe $D(G)$ est distingué.

      Si $f$ est un isomorphisme, sa réciproque est un morphisme (même nœud, (ii)), et $f^{-1}(D(G')) \subset D(G)$ ; d'où $f(D(G)) = D(G')$. Le morphisme $\pi' \circ f$, composé de $f$ et de la projection $\pi' : G' \to G'^{\mathrm{ab}}$, est alors surjectif, de noyau $f^{-1}(D(G')) = D(G)$. Le théorème d'isomorphisme ({{a-isomorphisme|Théorème d'isomorphisme}}) en déduit un isomorphisme de $G^{\mathrm{ab}}$ sur $G'^{\mathrm{ab}}$.

      (ii) Soit $\pi : G \to G/N$ la projection, dont le noyau est $N$ ({{a-quotient|Groupe quotient}}). Pour $x, y \in G$, l'égalité $\pi(x)\pi(y) = \pi(y)\pi(x)$ équivaut à
      $$\begin{aligned} \pi([x, y]) &= \pi(x)\pi(y)\pi(x)^{-1}\pi(y)^{-1} \\ &= \pi(e), \end{aligned}$$
      c'est-à-dire à $[x, y] \in N$. Le quotient est donc commutatif si et seulement si $N$ contient tous les commutateurs, c'est-à-dire, $N$ étant un sous-groupe, si et seulement si $D(G) \subset N$.

      Pour $N = D(G)$, distingué par (i), on obtient que $G^{\mathrm{ab}}$ est commutatif. Si $G$ est commutatif, tous les commutateurs valent $e$, et le sous-groupe $\{e\}$ les contient : $D(G) = \{e\}$.

      (iii) Dans un groupe commutatif, $f(x)f(y)f(x)^{-1}f(y)^{-1} = e$ : le sous-groupe $\operatorname{Ker} f$ contient tous les commutateurs, donc $D(G)$. Le théorème d'isomorphisme ({{a-isomorphisme|Théorème d'isomorphisme}}) fournit l'unique morphisme $\bar f$.

      (iv) Notons $F = F(a, b)$, et $N$ le sous-groupe distingué engendré par $r = aba^{-1}b^{-1}$, dont la classe est le commutateur $\big[\,[a], [b]\,\big]$ ({{vk-groupe-libre|Groupe libre}}, (i)). Comme $D(F)$ est distingué, par (i), et contient $r$, il contient $N$, qui est le plus petit sous-groupe distingué contenant $r$ ({{vk-presentations|Présentations}}, (i)).

      Inversement, le quotient $F/N = \langle a, b \mid aba^{-1}b^{-1} \rangle$ est isomorphe à $\mathbb Z^2$ (même nœud, (iii)), qui est commutatif ; par (ii), $D(F) \subset N$. Donc $D(F) = N$, et $F^{\mathrm{ab}} = F/N$ est isomorphe à $\mathbb Z^2$ par l'isomorphisme du même nœud, (iii), qui envoie les classes de $a$ et de $b$ sur $(1, 0)$ et $(0, 1)$.
    remarques:
      - |
        Le groupe dérivé apparaît aussi dans la théorie de la cohomologie des groupes, au nœud {{cg-conjugaison|Conjugaison des compléments}}, et dans le chapitre {{galois-representations|Représentations}} de la théorie de Galois, au nœud {{rp-lineaires|Caractères linéaires}}, qui montre qu'il est formé des produits finis de commutateurs. Aucune de ces théories n'est en amont de l'homologie : la notion est donc reprise ici, sans hypothèse de finitude, sous la seule forme dont le théorème de Hurewicz a besoin.
      - |
        Le point (iii) dit que l'abélianisé est le plus grand quotient commutatif de $G$ : tout morphisme vers un groupe commutatif oublie au moins ce que le passage à $G^{\mathrm{ab}}$ oublie. C'est la propriété qui servira au chapitre : l'homologie, étant commutative, ne peut voir du groupe fondamental que son abélianisé.
      - |
        Le point (iv) se lit sur le bouquet de deux cercles ({{vk-bouquet|Bouquet de deux cercles}}) et sur le tore ({{vk-tore|Tore}}) : le commutateur $aba^{-1}b^{-1}$, non trivial dans le groupe libre, devient trivial dans le tore, dont le groupe fondamental est $\mathbb Z^2$ ; rendre commutatif le groupe libre revient exactement à recoller le carré du tore.

  - id: hu-chemins
    etiquette: Chemins et chaînes
    nature: proposition
    titre: Chemins vus comme chaînes de dimension 1
    texte: |
      On identifie $\Delta_1$ au segment $I = [0, 1]$ par $s \mapsto (1 - s, s)$, comme au nœud {{h-degre0|Degré 0, point}}. À un [[chemin]] $\gamma$ d'un espace $X$, on associe le simplexe singulier
      $$\hat\gamma : \Delta_1 \to X, \qquad \hat\gamma(t_0, t_1) = \gamma(t_1),$$
      continu comme composé de $\gamma$ et de la seconde projection. Tout simplexe singulier $\sigma$ de dimension $1$ est de cette forme, pour l'unique chemin $\gamma(s) = \sigma(1 - s, s)$, et l'on a $\sigma(e_0) = \gamma(0)$, $\sigma(e_1) = \gamma(1)$.

      Pour deux chaînes $c, c' \in C_1(X)$, on écrit $c \equiv c'$ lorsque $c - c'$ est un bord, c'est-à-dire appartient à $B_1(X) = \partial(C_2(X))$ ({{h-complexes|Complexes de chaînes}}). C'est une relation d'équivalence, compatible avec l'addition.

      Pour un simplexe singulier $\tau$ de dimension $2$, de sommets $v_k = \tau(e_k)$, on note $\alpha$, $\beta$ et $\varepsilon$ les chemins associés aux faces $\tau \circ \delta_2$, $\tau \circ \delta_0$ et $\tau \circ \delta_1$ ({{h-singuliere|Homologie singulière}}) :
      $$\begin{aligned} \alpha(s) &= \tau(1 - s, s, 0), \\ \beta(s) &= \tau(0, 1 - s, s), \\ \varepsilon(s) &= \tau(1 - s, 0, s). \end{aligned}$$
      Le chemin $\alpha$ va de $v_0$ à $v_1$, $\beta$ de $v_1$ à $v_2$, et $\varepsilon$ de $v_0$ à $v_2$.
    enonce: |
      (i) *Calcul des chemins.* Soient $f$ un chemin de $x$ à $y$, $g$ un chemin de $y$ à $z$ et $k$ un chemin de $z$ à $w$. Alors
      $$\begin{aligned} (f \cdot g) \cdot k &\simeq f \cdot (g \cdot k), \\ c_x \cdot f \simeq f &\simeq f \cdot c_y, \\ f \cdot \bar f \simeq c_x, &\quad \bar f \cdot f \simeq c_y, \end{aligned}$$
      et $\overline{f \cdot g} = \bar g \cdot \bar f$.

      (ii) Pour tout chemin $\gamma$, $\partial\hat\gamma = \gamma(1) - \gamma(0)$. Si $\gamma$ est un lacet, $\hat\gamma$ est un cycle.

      (iii) Pour tout simplexe singulier $\tau$ de dimension $2$, on a $\partial\tau = \hat\beta - \hat\varepsilon + \hat\alpha$, et $\alpha \cdot \beta \simeq \varepsilon$.

      (iv) Pour tout point $x$ et tous chemins $\gamma$, $\delta$ tels que $\gamma(1) = \delta(0)$,
      $$\hat c_x \equiv 0, \qquad \hat{\bar\gamma} \equiv -\hat\gamma, \qquad \widehat{\gamma \cdot \delta} \equiv \hat\gamma + \hat\delta.$$

      (v) Si $\gamma$ et $\delta$ sont deux chemins homotopes, alors $\hat\gamma \equiv \hat\delta$.
    preuve: |
      (i) Les homotopies du nœud {{ta-groupe-fondamental|Groupe fondamental}} n'emploient pas que les chemins soient des lacets, comme l'observe déjà le nœud {{ta-fonctorialite|Fonctorialité}}, (ii). L'associativité et les neutres résultent des mêmes reparamétrages ({{ta-homotopie|Homotopie}}, (ii)).

      Pour l'inverse, l'application définie par $H(s, t) = f(2s(1 - t))$ si $s \leqslant \frac12$ et $H(s, t) = f((2 - 2s)(1 - t))$ si $s \geqslant \frac12$, continue par recollement ({{ta-chemins|Chemins}}, (i) et (ii)), puisque les deux formules valent $f(1 - t)$ en $s = \frac12$, vérifie $H(s, 0) = (f \cdot \bar f)(s)$, $H(s, 1) = f(0) = x$ et $H(0, t) = H(1, t) = x$ : c'est une homotopie de $f \cdot \bar f$ à $c_x$. Appliqué à $\bar f$, chemin de $y$ à $x$ dont l'inverse est $f$, cela donne $\bar f \cdot f \simeq c_y$.

      Enfin, pour $s \leqslant \frac12$, $(f \cdot g)(1 - s) = g(1 - 2s) = \bar g(2s)$ ; pour $s \geqslant \frac12$, $(f \cdot g)(1 - s) = f(2 - 2s) = \bar f(2s - 1)$. C'est la définition de $\bar g \cdot \bar f$.

      (ii) Le simplexe standard $\Delta_0$ est réduit au point $1$ de $\mathbb R$ ; la face $\delta_0$ l'envoie sur $(0, 1)$, la face $\delta_1$ sur $(1, 0)$. Donc
      $$\partial\hat\gamma = \hat\gamma(0, 1) - \hat\gamma(1, 0) = \gamma(1) - \gamma(0).$$

      (iii) La face $\delta_2$ envoie $(t_0, t_1)$ sur $(t_0, t_1, 0)$. Comme $t_0 = 1 - t_1$ sur $\Delta_1$, on a $\tau \circ \delta_2(t_0, t_1) = \alpha(t_1)$, c'est-à-dire $\tau \circ \delta_2 = \hat\alpha$ ; de même $\tau \circ \delta_0 = \hat\beta$ et $\tau \circ \delta_1 = \hat\varepsilon$. La formule du bord donne
      $$\begin{aligned} \partial\tau &= \tau \circ \delta_0 - \tau \circ \delta_1 + \tau \circ \delta_2 \\ &= \hat\beta - \hat\varepsilon + \hat\alpha. \end{aligned}$$

      Soit $\mu$ le chemin de $\Delta_2$ défini par $\mu(s) = (1 - 2s, 2s, 0)$ si $s \leqslant \frac12$ et $\mu(s) = (0, 2 - 2s, 2s - 1)$ si $s \geqslant \frac12$, continu par recollement ({{ta-chemins|Chemins}}, (i)), et $\nu(s) = (1 - s, 0, s)$. Alors $\alpha \cdot \beta = \tau \circ \mu$ et $\varepsilon = \tau \circ \nu$.

      Les coordonnées de $G(s, t) = (1 - t)\mu(s) + t\nu(s)$ sont positives et de somme $1$ : $G$ est à valeurs dans $\Delta_2$, et elle est continue (même nœud, (ii), et {{t-produit|Topologie produit}}). Elle vérifie $G(s, 0) = \mu(s)$, $G(s, 1) = \nu(s)$, $G(0, t) = e_0$ et $G(1, t) = e_2$. Donc $\tau \circ G$ est une homotopie de $\alpha \cdot \beta$ à $\varepsilon$.

      (iv) On applique (iii) à trois simplexes de dimension $2$.

      *Le chemin constant.* Pour le simplexe constant égal à $x$, les trois chemins $\alpha$, $\beta$, $\varepsilon$ sont égaux à $c_x$, et $\partial\tau = \hat c_x - \hat c_x + \hat c_x = \hat c_x$.

      *L'inverse.* Pour $\tau(t_0, t_1, t_2) = \gamma(t_1)$, on trouve $\alpha = \gamma$, $\beta = \bar\gamma$ et $\varepsilon = c_{\gamma(0)}$. Donc
      $$\hat\gamma + \hat{\bar\gamma} = \partial\tau + \hat c_{\gamma(0)} \equiv 0.$$

      *La concaténation.* Pour $\tau(t_0, t_1, t_2) = (\gamma \cdot \delta)\big(t_2 + \tfrac12 t_1\big)$, bien défini puisque $0 \leqslant t_2 + \frac12 t_1 \leqslant t_1 + t_2 \leqslant 1$, et continu, on trouve
      $$\begin{aligned} \alpha(s) &= (\gamma \cdot \delta)\big(\tfrac s2\big) = \gamma(s), \\ \beta(s) &= (\gamma \cdot \delta)\big(\tfrac{1 + s}2\big) = \delta(s), \\ \varepsilon(s) &= (\gamma \cdot \delta)(s). \end{aligned}$$
      Donc $\partial\tau = \hat\delta - \widehat{\gamma \cdot \delta} + \hat\gamma$.

      ```schema hu-chemins
      Le simplexe $\tau$ de la concaténation ne dépend que de $t_2 + \frac12 t_1$ : il est constant sur chacun des segments gris, parallèles à la médiane issue de $e_1$, et se lit sur l'arête de $e_0$ à $e_2$, qui parcourt $\gamma \cdot \delta$. L'arête de $e_0$ à $e_1$ parcourt donc $\gamma$, en rouge, celle de $e_1$ à $e_2$ parcourt $\delta$, en bleu, et le bord du triangle est $\hat\delta - \widehat{\gamma \cdot \delta} + \hat\gamma$.
      ```

      (v) Soit $H$ une homotopie de $\gamma$ à $\delta$, chemins de $x$ à $y$ ({{ta-homotopie|Homotopie}}), et $\kappa(s) = H(s, s)$. On découpe le carré $I \times I$ en deux triangles, comme pour l'opérateur prisme ({{h-homotopie|Invariance par homotopie}}), et l'on pose
      $$\begin{aligned} \tau_1(t) &= H(t_1 + t_2, t_2), \\ \tau_2(t) &= H(t_2, t_1 + t_2), \end{aligned}$$
      continus puisque $(t_1 + t_2, t_2)$ et $(t_2, t_1 + t_2)$ restent dans $I \times I$.

      Pour $\tau_1$, on trouve $\alpha = \gamma$, $\beta(s) = H(1, s) = y$ et $\varepsilon = \kappa$ ; pour $\tau_2$, $\alpha(s) = H(0, s) = x$, $\beta = \delta$ et $\varepsilon = \kappa$. Par (iii),
      $$\partial(\tau_1 - \tau_2) = \hat\gamma - \hat\delta + \hat c_y - \hat c_x,$$
      et (iv) donne $\hat\gamma \equiv \hat\delta$.
    remarques:
      - |
        Les trois congruences de (iv) disent qu'en homologie la concaténation devient une somme, l'inverse un opposé, et le chemin constant zéro. Le triangle de la concaténation « remplit » la différence entre le chemin $\gamma \cdot \delta$ et la succession de $\gamma$ et de $\delta$ : c'est la version homologique de l'homotopie qui reparamètre $\gamma \cdot \delta$.
      - |
        L'erreur la plus répandue est de croire que (v) découle directement de l'invariance par homotopie ({{h-homotopie|Invariance par homotopie}}). Celle-ci compare les morphismes induits sur l'homologie, et ne dit rien d'une chaîne qui n'est pas un cycle ; or $\hat\gamma$ n'est un cycle que si $\gamma$ est un lacet. Pour un lacet, on pourrait passer par le cercle $\mathbb R/\mathbb Z$, en factorisant $\gamma$ par le quotient ; le point (v) évite ce détour, vaut pour tous les chemins, et sa démonstration emprunte au prisme son découpage, non son résultat.

  - id: hu-hurewicz
    etiquette: Théorème de Hurewicz
    nature: théorème
    titre: Théorème de Hurewicz en degré 1
    texte: |
      Soit $X$ un espace topologique et $x_0 \in X$. Le [[morphisme-hurewicz|morphisme de Hurewicz]] est l'application
      $$\begin{aligned} h : \lex{groupe-fondamental}{\pi_1}(X, x_0) &\to \lex{homologie-singuliere}{H_1}(X), \\ [\gamma] &\mapsto [\hat\gamma], \end{aligned}$$
      qui envoie la classe d'un lacet $\gamma$ en $x_0$ sur la classe d'homologie du cycle $\hat\gamma$ ({{hu-chemins|Chemins et chaînes}}, (ii)).
    enonce: |
      (i) L'application $h$ est bien définie, et c'est un [[morphisme-groupes|morphisme de groupes]]. Son noyau contient le groupe dérivé $D(\pi_1(X, x_0))$.

      On suppose désormais $X$ [[connexe-par-arcs|connexe par arcs]].

      (ii) Le morphisme $h$ est surjectif.

      (iii) Son noyau est exactement $D(\pi_1(X, x_0))$.

      (iv) Par suite, $h$ induit un isomorphisme de l'abélianisé du groupe fondamental sur le premier groupe d'homologie :
      $$\pi_1(X, x_0)^{\mathrm{ab}} \cong H_1(X).$$
    preuve: |
      Notons $G = \pi_1(X, x_0)$. Les points (i) à (v) cités sont ceux du nœud {{hu-chemins|Chemins et chaînes}}. Une concaténation de plus de deux chemins se lit de gauche à droite ; par (i) et par la compatibilité de la concaténation à l'homotopie ({{ta-homotopie|Homotopie}}, (iii)), le parenthésage n'importe pas à homotopie près.

      (i) Si $\gamma \simeq \gamma'$, alors $\hat\gamma \equiv \hat\gamma'$ par (v) : la classe $[\hat\gamma]$ ne dépend que de la classe de $\gamma$. Par (iv),
      $$h([\gamma][\delta]) = [\widehat{\gamma \cdot \delta}] = [\hat\gamma] + [\hat\delta].$$
      Comme $H_1(X)$ est commutatif, $D(G) \subset \operatorname{Ker} h$ ({{hu-derive|Groupe dérivé}}, (iii)).

      (ii) Soit $z$ un cycle de dimension $1$. Notons $S$ l'ensemble fini des simplexes singuliers où son coefficient $n_\sigma$ n'est pas nul, de sorte que
      $$z = \sum_{\sigma \in S} n_\sigma\,\sigma$$
      ({{n-sommes|Sommes finies}}). Pour $\sigma \in S$, soit $\gamma_\sigma$ le chemin tel que $\sigma = \hat\gamma_\sigma$, d'origine $a_\sigma = \sigma(e_0)$ et d'extrémité $b_\sigma = \sigma(e_1)$.

      L'ensemble $F$ des points $a_\sigma$ et $b_\sigma$ est fini. Pour chaque $x \in F$, fixons un chemin $\lambda_x$ de $x_0$ à $x$, ce que permet la connexité par arcs, et formons le lacet en $x_0$
      $$\ell_\sigma = \lambda_{a_\sigma} \cdot \gamma_\sigma \cdot \bar\lambda_{b_\sigma}.$$

      Par (iv), $\hat\ell_\sigma \equiv \hat\lambda_{a_\sigma} + \sigma - \hat\lambda_{b_\sigma}$. Soit $\Lambda$ le morphisme de $\mathbb Z^{(F)}$, sous-groupe de $C_0(X)$, dans $C_1(X)$ qui envoie $x$ sur $\hat\lambda_x$ ({{h-complexes|Complexes de chaînes}}, (i)). Comme $z$ est un cycle, (ii) donne
      $$\partial z = \sum_{\sigma \in S} n_\sigma\,(b_\sigma - a_\sigma) = 0,$$
      élément de $\mathbb Z^{(F)}$, d'image nulle par $\Lambda$. Il vient
      $$\sum_{\sigma \in S} n_\sigma\,\hat\ell_\sigma \equiv z - \Lambda(\partial z) = z.$$
      Ainsi $[z] = \sum n_\sigma\,h([\ell_\sigma])$ appartient à l'image de $h$, qui est un sous-groupe ({{a-morphisme|Morphisme}}, (iii)).

      (iii) Par (i), il reste à montrer que $\operatorname{Ker} h \subset D(G)$. Soit $\gamma$ un lacet en $x_0$ tel que $\hat\gamma$ soit un bord :
      $$\hat\gamma = \partial\Big(\sum_{\tau \in T} m_\tau\,\tau\Big),$$
      où $T$ est un ensemble fini de simplexes de dimension $2$.

      *Une partie finie.* Soit $S$ l'ensemble fini formé de $\hat\gamma$ et des faces $\tau \circ \delta_i$, pour $\tau \in T$ et $i \in \{0, 1, 2\}$, et $F$ l'ensemble fini formé de $x_0$ et des sommets $\sigma(e_0)$, $\sigma(e_1)$ des éléments $\sigma$ de $S$. Fixons des chemins $\lambda_x$ de $x_0$ à $x$, pour $x \in F$, avec $\lambda_{x_0} = c_{x_0}$.

      *Le morphisme $\Phi$.* Soit $A = G^{\mathrm{ab}}$, commutatif ({{hu-derive|Groupe dérivé}}, (ii)), noté additivement, et $p : G \to A$ la projection. Pour $\sigma \in S$, d'origine $a$ et d'extrémité $b$, on pose $\ell_\sigma = \lambda_a \cdot \gamma_\sigma \cdot \bar\lambda_b$ comme en (ii). Le morphisme
      $$\Phi : \mathbb Z^{(S)} \to A, \qquad \Phi(\sigma) = p([\ell_\sigma]),$$
      est défini sur le sous-groupe $\mathbb Z^{(S)}$ de $C_1(X)$ ({{h-complexes|Complexes de chaînes}}, (i)).

      *$\Phi$ s'annule sur les bords des $\tau$.* Soit $\tau \in T$, de sommets $v_k$ et de chemins $\alpha$, $\beta$, $\varepsilon$, et $\lambda_k = \lambda_{v_k}$. Par (i), puis par (iii),
      $$\begin{aligned} [\ell_{\tau \circ \delta_2}][\ell_{\tau \circ \delta_0}] &= [\lambda_0 \cdot \alpha \cdot \bar\lambda_1 \cdot \lambda_1 \cdot \beta \cdot \bar\lambda_2] \\ &= [\lambda_0 \cdot \alpha \cdot \beta \cdot \bar\lambda_2] \\ &= [\lambda_0 \cdot \varepsilon \cdot \bar\lambda_2] = [\ell_{\tau \circ \delta_1}]. \end{aligned}$$
      Comme $p$ est un morphisme vers un groupe commutatif, et que $\partial\tau = \tau \circ \delta_0 - \tau \circ \delta_1 + \tau \circ \delta_2$ appartient à $\mathbb Z^{(S)}$,
      $$\Phi(\partial\tau) = p\big([\ell_{\tau \circ \delta_2}][\ell_{\tau \circ \delta_0}][\ell_{\tau \circ \delta_1}]^{-1}\big) = 0.$$

      ```schema hu-hurewicz
      Les chemins $\lambda_0$, $\lambda_1$, $\lambda_2$, en bleu, relient $x_0$ aux sommets du simplexe $\tau$. Le lacet $\ell_{\tau \circ \delta_2}$ part de $x_0$, longe l'arête $\alpha$ et revient par $\lambda_1$ ; le lacet $\ell_{\tau \circ \delta_0}$ repart par $\lambda_1$, longe $\beta$, puis revient par $\lambda_2$. Leur produit fait l'aller et retour sur $\lambda_1$, qui se contracte, puis parcourt $\alpha \cdot \beta$, homotope à $\varepsilon$ à travers le triangle, en rouge : il est homotope au lacet $\ell_{\tau \circ \delta_1}$.
      ```

      *Conclusion.* Comme $\lambda_{x_0} = c_{x_0}$, on a $\ell_{\hat\gamma} = c_{x_0} \cdot \gamma \cdot c_{x_0} \simeq \gamma$, et $\Phi(\hat\gamma) = p([\gamma])$. L'égalité $\hat\gamma = \sum m_\tau\,\partial\tau$ a lieu dans $\mathbb Z^{(S)}$, donc
      $$p([\gamma]) = \Phi(\hat\gamma) = \sum_{\tau \in T} m_\tau\,\Phi(\partial\tau) = 0,$$
      et $[\gamma]$ appartient au noyau de $p$, qui est $D(G)$ ({{a-quotient|Groupe quotient}}).

      (iv) Le morphisme $h$ est surjectif, de noyau $D(G)$ ; on applique le théorème d'isomorphisme ({{a-isomorphisme|Théorème d'isomorphisme}}).
    remarques:
      - |
        Aucune forme de l'axiome du choix n'intervient. Les chemins $\lambda_x$ ne sont fixés que pour les points d'un ensemble fini $F$, déterminé par la chaîne étudiée. L'existence d'une telle famille se démontre par récurrence sur le nombre $k$ d'éléments de $F$ : si $F = F' \cup \{x\}$ avec $|F'| = k$, on prolonge une famille donnée sur $F'$ par l'un des chemins de $x_0$ à $x$, dont l'existence est la connexité par arcs ; c'est un nombre fini d'instanciations d'énoncés existentiels. Le morphisme $h$ et l'isomorphisme de (iv), avec sa réciproque, ne dépendent d'aucun choix.
      - |
        La démonstration la plus répandue fixe au contraire un chemin $\lambda_x$ pour chaque point $x$ de $X$, afin de définir $\Phi$ sur tout $C_1(X)$ d'un seul coup. C'est choisir un élément dans chacun des ensembles non vides de chemins de $x_0$ à $x$, une famille indexée par $X$ tout entier : un usage de l'axiome du choix, qu'on évite ici en ne définissant $\Phi$ que sur la partie finie $\mathbb Z^{(S)}$ qu'une relation donnée fait intervenir.
      - |
        L'erreur la plus répandue est de croire qu'un lacet dont la classe d'homologie est nulle est homotope au lacet constant. Dans le bouquet de deux cercles, le lacet $a \cdot b \cdot \bar a \cdot \bar b$ n'est pas homotope au lacet constant, puisque son groupe fondamental est libre ({{vk-bouquet|Bouquet de deux cercles}}), mais il est d'homologie nulle, comme tout commutateur ({{hu-exemples|Exemples}}, (ii)). De même, $H_1(X) = 0$ n'entraîne pas que $X$ soit simplement connexe : cela dit seulement que $\pi_1(X, x_0)$ est égal à son groupe dérivé. Le complémentaire de la boule cornue d'Alexander, présenté en remarque au nœud {{hj-cellules|Complémentaire d'une cellule}}, a une homologie réduite nulle sans être simplement connexe (admis ici) : son groupe fondamental est non trivial et égal à son groupe dérivé.
      - |
        L'histoire du théorème précède le nom qu'il porte. H. Poincaré, au §13 d'*Analysis situs* (*Journal de l'École polytechnique*, 2e série, 1, 1895), considère les relations obtenues en laissant commuter les générateurs du groupe fondamental, et observe qu'elles donnent aussitôt le premier nombre de Betti ; les groupes d'homologie eux-mêmes ne seront dégagés que par E. Noether, en 1925, annonce publiée en 1926 (d'après J. Stillwell, introduction de sa traduction d'*Analysis situs*, 2010).
      - |
        Le manuel de H. Seifert et W. Threlfall (*Lehrbuch der Topologie*, Teubner, Leipzig, 1934) consacre son §48 à la relation entre groupe fondamental et groupe d'homologie, pour les complexes, un an avant l'article de Hurewicz.
      - |
        W. Hurewicz, dans *Beiträge zur Topologie der Deformationen II. Homotopie- und Homologiegruppen* (*Proc. Akad. Wetensch. Amsterdam* 38, 1935, p. 521-528), écrit qu'il est connu que, pour un polyèdre, le quotient du groupe fondamental par son groupe des commutateurs est le premier groupe d'homologie, et que l'extension aux espaces localement contractiles n'offre aucune difficulté ; son théorème principal (Satz I) est l'analogue en degré supérieur.
      - |
        En degré supérieur, les groupes d'homotopie $\pi_n(X)$, classes d'applications de $S^n$ dans $X$, ne sont pas définis dans l'édifice. Le théorème de Hurewicz général affirme que, si $X$ est connexe par arcs et si $\pi_1, \dots, \pi_{n-1}$ sont triviaux, avec $n \geqslant 2$, alors $\pi_n(X) \cong H_n(X)$ : l'abélianisation devient inutile, les groupes $\pi_n$ étant commutatifs pour $n \geqslant 2$. Il n'est pas démontré ici.

  - id: hu-exemples
    etiquette: Exemples
    nature: corollaire
    titre: Premier groupe d'homologie de quelques espaces
    texte: |
      On reprend les notations des nœuds {{ta-cercle|Groupe fondamental du cercle}} et {{vk-bouquet|Bouquet de deux cercles}} : $\lex{cercle-quotient}{S^1} = \mathbb R/\mathbb Z$, de projection $p$, le point $e = p(0)$, le [[tore]] $T = S^1 \times S^1$, le [[bouquet-cercles|bouquet de deux cercles]] $W \subset T$, le point $x_0 = (e, e)$ et les lacets $a(s) = (p(s), e)$ et $b(s) = (e, p(s))$. On note $\omega(s) = p(s)$, lacet de $S^1$ en $e$ qui fait une fois le tour du cercle.
    enonce: |
      (i) $\lex{homologie-singuliere}{H_1}(S^1) \cong \lex{ensemble-entiers-relatifs}{\mathbb Z}$, engendré par $[\hat\omega]$. Pour toute application continue $f : S^1 \to S^1$ telle que $f(e) = e$, on a
      $$f_*[\hat\omega] = \deg(f \circ \omega)\,[\hat\omega].$$

      (ii) $H_1(W) \cong \lex{n-uplet}{\mathbb Z^2}$, par un isomorphisme qui envoie $[\hat a]$ et $[\hat b]$ sur $(1, 0)$ et $(0, 1)$. Le lacet $a \cdot b \cdot \bar a \cdot \bar b$ n'est pas homotope au lacet constant dans $W$, mais sa classe d'homologie est nulle.

      (iii) $H_1(T) \cong \mathbb Z^2$, par un isomorphisme qui envoie $[\hat a]$ et $[\hat b]$ sur $(1, 0)$ et $(0, 1)$.

      (iv) Pour $n \geqslant 2$, $H_1(\lex{espace-projectif-reel}{\mathbb RP^n}) \cong \lex{anneau-zn}{\mathbb Z/2\mathbb Z}$. Si $y_0 \in S^n$ et si $\gamma$ est un chemin de $S^n$ de $y_0$ à $-y_0$, l'élément non nul est la classe du cycle $\widehat{q \circ \gamma}$, où $q : S^n \to \mathbb RP^n$ est la projection ({{rv-projectif|Espaces projectifs}}).
    preuve: |
      *Connexité par arcs.* Le point $p(s)$ est relié à $e$ par le chemin $t \mapsto p(ts)$ ; de même, $(p(s), p(s'))$ est relié à $x_0$ dans $T$ par $t \mapsto (p(ts), p(ts'))$, continu dans le produit ({{t-produit|Topologie produit}}), et les points $(p(s), e)$ et $(e, p(s))$ de $W$ le sont dans $W$ par $t \mapsto (p(ts), e)$ et $t \mapsto (e, p(ts))$. La sphère $S^n$, $n \geqslant 2$, est connexe par arcs ({{vk-spheres|Sphères Sⁿ, n ⩾ 2}}), donc aussi son image $\mathbb RP^n$ par l'application continue et surjective $q$. Le {{hu-hurewicz|théorème de Hurewicz}} s'applique aux quatre espaces.

      (i) Le degré est un isomorphisme de $\lex{groupe-fondamental}{\pi_1}(S^1, e)$ sur $\mathbb Z$ ({{ta-cercle|Groupe fondamental du cercle}}). Le groupe fondamental est donc commutatif, son groupe dérivé est trivial ({{hu-derive|Groupe dérivé}}, (ii)), et $h$ est un isomorphisme.

      Le relèvement de $\omega$ issu de $0$ est $s \mapsto s$, donc $\deg\omega = 1$. Comme $1$ engendre $\mathbb Z$ ({{vk-groupe-libre|Groupe libre}}, (i) et (iii)), $[\omega]$ engendre $\pi_1(S^1, e)$, et $h([\omega]) = [\hat\omega]$ engendre $H_1(S^1)$.

      Si $f(e) = e$, $f \circ \omega$ est un lacet en $e$ ; soit $m = \deg(f \circ \omega)$. Le morphisme $\deg$ envoie $[\omega]^m$ sur $m$ (même nœud, (iii)), donc $[f \circ \omega] = [\omega]^m$, par injectivité. Comme $f \circ \hat\omega = \widehat{f \circ \omega}$,
      $$f_*[\hat\omega] = h([f \circ \omega]) = h([\omega]^m) = m\,[\hat\omega].$$

      (ii) Le morphisme $\Theta : F(a, b) \to \pi_1(W, x_0)$, qui envoie les lettres sur les classes des lacets $a$ et $b$, est un isomorphisme ({{vk-bouquet|Bouquet de deux cercles}}, (ii)). Il induit un isomorphisme des abélianisés ({{hu-derive|Groupe dérivé}}, (i)), et $F(a, b)^{\mathrm{ab}} \cong \mathbb Z^2$ (même nœud, (iv)).

      En composant avec l'isomorphisme $\pi_1(W, x_0)^{\mathrm{ab}} \cong H_1(W)$ du théorème de Hurewicz, (iv), on obtient un isomorphisme de $\mathbb Z^2$ sur $H_1(W)$ qui envoie $(1, 0)$ sur $h([a]) = [\hat a]$ et $(0, 1)$ sur $[\hat b]$.

      La classe du lacet $a \cdot b \cdot \bar a \cdot \bar b$ est le commutateur $\big[\,[a], [b]\,\big]$, image par $\Theta$ du commutateur $\big[\,[a], [b]\,\big]$ de $F(a, b)$, qui n'est pas trivial ({{vk-groupe-libre|Groupe libre}}, (iv)) : le lacet n'est pas homotope au lacet constant. Sa classe d'homologie, image d'un commutateur par le morphisme $h$, est nulle ; on le voit aussi directement, puisque $\hat a + \hat b - \hat a - \hat b = 0$ ({{hu-chemins|Chemins et chaînes}}, (iv)).

      (iii) Le morphisme de $F(a, b)$ dans $\pi_1(T, x_0)$ qui envoie les lettres sur les classes de $a$ et de $b$ induit un isomorphisme de $\langle a, b \mid aba^{-1}b^{-1} \rangle$ sur $\pi_1(T, x_0)$ ({{vk-tore|Tore}}), et le premier est isomorphe à $\mathbb Z^2$, les classes de $a$ et de $b$ allant sur $(1, 0)$ et $(0, 1)$ ({{vk-presentations|Présentations}}, (iii)). Le groupe $\pi_1(T, x_0)$ est donc commutatif, de groupe dérivé trivial, et $h$ est un isomorphisme qui envoie $[a]$ et $[b]$ sur $[\hat a]$ et $[\hat b]$.

      (iv) Le groupe $\pi_1(\mathbb RP^n, q(y_0))$ a deux éléments, et la classe de $q \circ \gamma$ en est l'élément non trivial ({{rv-projectif|Espaces projectifs}}, (ii)). Il est commutatif, $h$ est un isomorphisme, et l'élément non nul de $H_1(\mathbb RP^n)$ est $h([q \circ \gamma]) = [\widehat{q \circ \gamma}]$.
    remarques:
      - |
        Le point (i) retrouve le calcul $H_1(S^1) \cong \mathbb Z$ du nœud {{h-spheres|Homologie des sphères}}, fait par Mayer-Vietoris pour le cercle unité du plan, homéomorphe à $\mathbb R/\mathbb Z$ : le nœud {{vk-bouquet|Bouquet de deux cercles}}, (i), identifie $\mathbb R/\mathbb Z$ à un losange sans trigonométrie, et la projection radiale envoie ce losange sur le cercle unité (ce dernier pas n'est pas rédigé ici). Il dit davantage : le générateur est la classe du lacet qui fait une fois le tour, et le degré des lacets se lit en homologie. Le nœud {{cw-degre|Degré}} du chapitre d'homologie cellulaire définit le degré d'une application de la sphère dans elle-même par son action sur $H_n$ ; le point (i) en est la version pour le cercle $\mathbb R/\mathbb Z$ : pour une application qui fixe $e$, ce degré homologique est le degré du lacet $f \circ \omega$. Le transport au cercle unité du plan n'est pas fait (remarque du nœud {{cw-degre|Degré}}).
      - |
        Les points (iii) et (iv) concordent avec les calculs cellulaires du chapitre {{hom-cellulaire|Homologie cellulaire}}, menés indépendamment : $H_1(T) \cong \mathbb Z^2$, de base les cycles $a$ et $b$ ({{cw-surfaces|Tore et surfaces}}), et $H_1(\mathbb RP^n) \cong \mathbb Z/2\mathbb Z$ pour $n \geqslant 2$ ({{cw-projectifs|Homologie de ℝPⁿ}}). Pour $n = 1$, la projection $q$ n'est pas un revêtement universel, et le même chapitre trouve $H_1(\mathbb RP^1) \cong \mathbb Z$, comme pour un cercle.
      - |
        Pour la surface de genre $g$, le chapitre d'homologie cellulaire établit $H_0(\Sigma_g) \cong \mathbb Z$. Or $H_0(\Sigma_g) \cong \mathbb Z^{(\Pi)}$, où $\Pi$ est l'ensemble des composantes connexes par arcs ({{h-degre0|Degré 0, point}}), et $\Pi$ n'est pas vide. Si $\Pi$ contenait deux éléments distincts $u$ et $v$, un isomorphisme $\varphi$ de $\mathbb Z^{(\Pi)}$ sur $\mathbb Z$ les enverrait sur des entiers $m$ et $n$ non nuls, et l'élément non nul $nu - mv$ aurait pour image $nm - mn = 0$, ce que l'injectivité interdit. Donc $\Pi$ a un seul élément, et $\Sigma_g$ est connexe par arcs. Le même chapitre établit $H_1(\Sigma_g) \cong \mathbb Z^{2g}$ ({{cw-surfaces|Tore et surfaces}}). Le théorème de Hurewicz en tire $\pi_1(\Sigma_g)^{\mathrm{ab}} \cong \mathbb Z^{2g}$ : les surfaces de genres distincts ont des groupes fondamentaux non isomorphes, par le point (i) du nœud {{hu-derive|Groupe dérivé}}, puisque $\mathbb Z^{2g}$ et $\mathbb Z^{2g'}$ ne sont pas isomorphes pour $g \neq g'$ ({{cw-surfaces|Tore et surfaces}}, preuve de (iii)). La présentation $\pi_1(\Sigma_g) \cong \langle a_1, b_1, \dots, a_g, b_g \mid a_1b_1a_1^{-1}b_1^{-1} \cdots a_gb_ga_g^{-1}b_g^{-1} \rangle$ reste admise ({{vk-tore|Tore}}, dernière remarque) ; elle est cohérente avec ce calcul, puisque sa relation, produit de commutateurs, devient triviale dans l'abélianisé.

