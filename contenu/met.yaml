# Niveau 1 : structure interne du nœud « Espaces métriques et normés ».
# Distances et boules, topologie associée, suites (caractérisation séquentielle des fermés, ⋆),
# suites de Cauchy et espaces complets, l'espace ℝⁿ (topologie produit, complétude, compacts =
# fermés bornés), nombre de Lebesgue et théorème de Heine sur un compact métrique (sans choix),
# compacité séquentielle (réciproque ⋆), parties précompactes (compactes dans un espace complet,
# sans choix quand les réseaux sont donnés) ; puis les normes, leur équivalence en dimension finie,
# le point fixe de Banach et le théorème de Baire (⋆, choix dépendant).
# Les nœuds gd-normes, gd-equivalence et gd-point-fixe (venus de la géométrie différentielle) et
# f-baire (venu de l'analyse fonctionnelle) gardent leur identifiant, cité par les rubriques.
# Ni ℂ, ni l'exponentielle, ni la trigonométrie ne sont des ancêtres de ce nœud : les exemples
# sont pris dans ℝ, ℚ et ℝⁿ, et les racines carrées viennent du théorème de la bijection.

graphe: met
titre: Espaces métriques et normés
conteneur: met

entrees:
  analyse-reelle: [me-espace]
  alglin: [gd-normes]

noeuds:
  - id: me-espace
    etiquette: Espaces métriques
    nature: définition
    titre: Distances et boules
    texte: |
      Une **distance** sur un ensemble $X$ est une application $d : X \times X \to [0, +\infty[$ telle que, pour tous $x, y, z \in X$, $d(x, y) = 0$ équivaut à $x = y$, $d(y, x) = d(x, y)$ et $d(x, z) \leqslant d(x, y) + d(y, z)$ ; le couple $(X, d)$ est un [[espace-metrique]].

      Pour $a \in X$ et $r > 0$, la **boule ouverte** est $B(a, r) = \{x \in X : d(a, x) < r\}$ et la **boule fermée** $\bar B(a, r) = \{x \in X : d(a, x) \leqslant r\}$. Une partie est **bornée** si elle est contenue dans une boule ; le **diamètre** d'une partie non vide $A$ est
      $$\operatorname{diam} A = \sup\{d(x, y) : x, y \in A\},$$
      élément de $[0, +\infty]$. Sur une partie $A$ de $X$, la restriction de $d$ à $A \times A$ est encore une distance, dite **induite**.

      Les premiers exemples sont $\lex{ensemble-reels}{\mathbb R}$ muni de $|x - y|$ ({{ar-corps|Borne supérieure}}), et la distance **discrète** sur un ensemble quelconque, égale à $1$ entre deux points distincts. Sur $\lex{n-uplet}{\mathbb R^n}$, on pose
      $$\begin{aligned} d_\infty(x, y) &= \max_i |x_i - y_i|, \\ d_1(x, y) &= \sum_i |x_i - y_i|, \\ d_2(x, y) &= \Big(\sum_i (x_i - y_i)^2\Big)^{1/2}. \end{aligned}$$
    enonce: |
      (i) Pour tout réel $t \geqslant 0$, il existe un unique réel $s \geqslant 0$ tel que $s^2 = t$ ; on le note $\sqrt t$ ou $t^{1/2}$, et $t \mapsto \sqrt t$ est croissante.

      (ii) $d_\infty$, $d_1$ et $d_2$ sont des distances sur $\mathbb R^n$, et
      $$d_\infty \leqslant d_2 \leqslant d_1 \leqslant n\, d_\infty.$$

      (iii) Dans un espace métrique, $|d(x, z) - d(y, z)| \leqslant d(x, y)$ pour tous $x, y, z$. Une partie non vide $A$ est bornée si et seulement si son diamètre est fini ; si $A \subset B(a, r)$, alors $\operatorname{diam} A \leqslant 2r$.
    preuve: |
      (i) La fonction $f(s) = s^2$ est continue et strictement croissante sur l'intervalle $[0, +\infty[$. Par le théorème de la bijection ({{c-bijection|Bijection continue}}), son image $J$ est un intervalle, sur lequel $f$ est une bijection de réciproque croissante.

      Or $J$ contient $f(0) = 0$ et $f(1 + t) = 1 + 2t + t^2 \geqslant t$, donc aussi $t$, puisque c'est un intervalle : il existe un unique $s \geqslant 0$ tel que $s^2 = t$, et $t \mapsto \sqrt t$, réciproque de $f$, est croissante.

      (ii) La séparation et la symétrie sont immédiates pour les trois applications : une somme ou un maximum de réels positifs n'est nul que si chacun l'est. Pour $d_\infty$ et $d_1$, l'inégalité triangulaire découle de $|x_i - z_i| \leqslant |x_i - y_i| + |y_i - z_i|$, coordonnée par coordonnée, en passant au maximum ou à la somme.

      Pour $d_2$, posons $u = x - y$, $v = y - z$, $A = \sum_i u_i^2$, $B = \sum_i u_iv_i$ et $C = \sum_i v_i^2$. Pour tout réel $t$,
      $$\begin{aligned} 0 &\leqslant \sum_i (u_i + tv_i)^2 \\ &= A + 2Bt + Ct^2. \end{aligned}$$
      Si $C > 0$, la valeur $t = -B/C$ donne $A - B^2/C \geqslant 0$, d'où $B^2 \leqslant AC$ ; si $C = 0$, alors $v = 0$ et $B = 0$.

      Dans les deux cas $B \leqslant \sqrt A\,\sqrt C$ (inégalité de Cauchy-Schwarz), par croissance de la racine carrée et parce que $\sqrt{AC} = \sqrt A\,\sqrt C$, les deux membres étant positifs et de même carré. Alors
      $$\begin{aligned} \sum_i (u_i + v_i)^2 &= A + 2B + C \\ &\leqslant \big(\sqrt A + \sqrt C\big)^2, \end{aligned}$$
      et, en prenant les racines carrées, $d_2(x, z) \leqslant d_2(x, y) + d_2(y, z)$.

      Pour les comparaisons, soit $w = x - y$. Le plus grand des $w_i^2$ est au plus leur somme, qui est au plus $\big(\sum_i |w_i|\big)^2$, puisque le développement de ce carré ajoute des termes $2|w_i||w_j|$ positifs ; on prend les racines carrées. Enfin chaque $|w_i|$ est au plus $\max_j |w_j|$, et il y a $n$ termes.

      (iii) L'inégalité triangulaire donne $d(x, z) - d(y, z) \leqslant d(x, y)$, et l'échange de $x$ et $y$ l'autre inégalité.

      Si $A \subset B(a, r)$, alors $d(x, y) \leqslant d(x, a) + d(a, y) < 2r$ pour $x, y \in A$. Réciproquement, si $\operatorname{diam} A = \delta$ est fini et $x \in A$, alors $A \subset B(x, \delta + 1)$.
    remarques:
      - |
        Les trois distances de $\mathbb R^2$ mesurent différemment le même écart. Pour $x = (0, 0)$ et $y = (4, 3)$, on trouve $d_\infty(x, y) = 4$, $d_2(x, y) = 5$ et $d_1(x, y) = 7$, et le point $y$ se trouve donc sur trois « sphères » de formes différentes.

        ```schema me-espace
        Les ensembles $\{z : d(x, z) = d(x, y)\}$ pour les trois distances passent tous par $y = (4, 3)$ : le carré bleu de demi-côté $d_\infty(x, y) = 4$, le cercle rouge de rayon $d_2(x, y) = 5$, le losange vert de rayon $d_1(x, y) = 7$. On lit $d_2$ sur le segment rouge, $d_1$ sur le chemin vert qui suit les axes, et $d_\infty$ sur le plus long des deux côtés de ce chemin ; l'encadrement $4 \leqslant 5 \leqslant 7$ est celui de $d_\infty \leqslant d_2 \leqslant d_1$ pour ce couple. Les trois figures, de rayons différents, se croisent sans s'emboîter.
        ```
      - |
        L'erreur la plus répandue est de croire que la boule fermée $\bar B(a, r)$ est toujours l'adhérence de la boule ouverte $B(a, r)$. Pour la distance discrète, $B(a, 1) = \{a\}$, alors que $\bar B(a, 1)$ est l'espace entier.

        Or toute partie y est fermée, puisque toute partie est réunion de boules $B(x, 1) = \{x\}$, de sorte que l'adhérence de $B(a, 1)$ est $\{a\}$.
      - |
        La distance $d_2$ est la distance euclidienne. Le module des nombres complexes est la distance $d_2$ lue dans $\mathbb R^2$, ce que l'analyse complexe exploite pour transporter à $\mathbb C$ les résultats de ce graphe ({{cx-suites|Suites et séries complexes}}).

  - id: me-topologie
    etiquette: Topologie d'une distance
    nature: proposition
    titre: Topologie associée à une distance
    enonce: |
      Soit $(X, d)$ un espace métrique.

      (i) Les boules ouvertes forment la [[base-topologie|base]] d'une topologie sur $X$, dite **associée** à $d$ : une partie $O$ est [[ouvert|ouverte]] si et seulement si, pour tout $a \in O$, il existe $r > 0$ tel que $B(a, r) \subset O$. Cette topologie est [[separe|séparée]], et toute boule fermée est [[ferme|fermée]].

      (ii) Une partie $V$ est un [[voisinage]] de $a$ si et seulement si elle contient une boule $B(a, r)$. Un point $a$ est [[adherence|adhérent]] à $A$ si et seulement si toute boule $B(a, r)$ rencontre $A$.

      (iii) Sur une partie $A$, la topologie associée à la distance induite est la [[topologie-induite]].

      (iv) Soit $f : X \to Y$, où $(Y, d')$ est un espace métrique, et $a \in X$. L'application $f$ est continue en $a$ si et seulement si
      $$\begin{gathered} \forall \varepsilon > 0,\ \exists \delta > 0,\ \forall x \in X, \\ d(x, a) < \delta \ \Longrightarrow\ d'(f(x), f(a)) < \varepsilon. \end{gathered}$$
      Une application $k$-lipschitzienne, c'est-à-dire telle que $d'(f(x), f(y)) \leqslant k\, d(x, y)$ pour tous $x, y$, est continue ; c'est le cas de $x \mapsto d(x, z)$, pour $z$ fixé, avec $k = 1$.

      (v) Si deux distances $d$ et $d'$ sur $X$ vérifient $\alpha d \leqslant d' \leqslant \beta d$ avec $\alpha, \beta > 0$, elles définissent la même topologie et les mêmes parties bornées.
    preuve: |
      (i) Les boules recouvrent $X$, puisque $a \in B(a, 1)$. Si $x \in B(a, r) \cap B(b, s)$, posons
      $$t = \min\big(r - d(a, x),\, s - d(b, x)\big) > 0 :$$
      pour $z \in B(x, t)$, $d(a, z) \leqslant d(a, x) + d(x, z) < r$, et de même $d(b, z) < s$, donc $B(x, t) \subset B(a, r) \cap B(b, s)$. Les deux conditions du nœud {{t-base|Bases d'une topologie}} sont remplies.

      ```schema me-topologie
      Dans le plan muni de $d_2$, le point $x$ est à distance $\frac52$ de $a$ et $\frac{13}{10}$ de $b$. La boule rouge de centre $x$ et de rayon $t = \min\big(3 - \frac52,\, \frac52 - \frac{13}{10}\big) = \frac12$ tient dans les deux boules, et touche le bord de $B(a, 3)$ au bout du rayon pointillé issu de $a$ : c'est le cas d'égalité de l'inégalité triangulaire.
      ```

      Si $O$ est une réunion de boules et $a \in O$, alors $a \in B(b, s) \subset O$ pour une boule, et le calcul précédent donne $B(a, s - d(a, b)) \subset B(b, s)$. Réciproquement, si la condition est remplie, $O$ est la réunion de **toutes** les boules qu'il contient.

      Si $x \neq y$, les boules de rayon $r = d(x, y)/2 > 0$ centrées en $x$ et en $y$ sont disjointes : un point $z$ commun donnerait $d(x, y) \leqslant d(x, z) + d(z, y) < 2r$.

      Enfin, si $d(a, x) > r$, la boule $B(x, d(a, x) - r)$ ne rencontre pas $\bar B(a, r)$, puisque
      $$d(a, z) \geqslant d(a, x) - d(x, z) > r$$
      pour chacun de ses points $z$ : le complémentaire de $\bar B(a, r)$ est ouvert.

      (ii) Par (i), un ouvert contenant $a$ contient une boule $B(a, r)$, et une boule est un ouvert ; la caractérisation des voisinages s'en déduit, puis celle de l'adhérence par le nœud {{t-adherence|Intérieur, adhérence}}, (iii).

      (iii) Pour $a \in A$, la boule de $A$ de centre $a$ et de rayon $r$ est $B(a, r) \cap A$. Si $O$ est ouvert dans $X$ et $a \in O \cap A$, une boule $B(a, r) \subset O$ donne $B(a, r) \cap A \subset O \cap A$ : la trace $O \cap A$ est ouverte pour la distance induite.

      Réciproquement, si $U \subset A$ est ouvert pour la distance induite, soit $O$ la réunion de toutes les boules $B(a, r)$ de $X$ telles que $a \in U$ et $B(a, r) \cap A \subset U$. C'est un ouvert de $X$, et $O \cap A = U$, puisque tout point de $U$ est le centre d'une telle boule.

      (iv) Par (ii), appliqué dans $X$ et dans $Y$, la continuité en $a$ au sens du nœud {{t-continue|Applications continues}} demande que chaque $f^{-1}\big(B(f(a), \varepsilon)\big)$ contienne une boule $B(a, \delta)$ : c'est exactement la condition écrite.

      Si $f$ est $k$-lipschitzienne, $\delta = \varepsilon/(k + 1)$ convient ; pour $x \mapsto d(x, z)$, c'est l'inégalité $|d(x, z) - d(y, z)| \leqslant d(x, y)$ du nœud {{me-espace|Espaces métriques}}, (iii).

      (v) Si $d'(a, x) < \alpha r$, alors $d(a, x) \leqslant d'(a, x)/\alpha < r$ : la boule de $d'$ de rayon $\alpha r$ est contenue dans celle de $d$ de rayon $r$, et de même la boule de $d$ de rayon $r/\beta$ est contenue dans celle de $d'$ de rayon $r$. Par la caractérisation (i), les ouverts sont les mêmes.

      Une boule de $d$ de rayon $r$ est contenue dans la boule de $d'$ de même centre et de rayon $\beta r$, et inversement avec $1/\alpha$.
    remarques:
      - |
        Aucun choix n'intervient dans (i) ni dans (iii) : un ouvert est la réunion de **toutes** les boules qu'il contient, sans qu'on ait à en désigner une par point, comme au nœud {{t-voisinages|Voisinages}}.
      - |
        Pour $X = \lex{ensemble-reels}{\mathbb R}$ muni de $|x - y|$, la topologie associée est la [[topologie-usuelle]] du nœud {{tr-ouverts|Ouverts de ℝ}}, et (iv) redonne la définition de la continuité du nœud {{c-point|Continuité en un point}}. Les deux notions de continuité, topologique et métrique, coïncident donc, ce qui permet d'employer l'une ou l'autre dans toute la suite.
      - |
        L'erreur la plus répandue est de croire que le caractère borné d'une partie est une propriété topologique. Sur $\mathbb R$, $d'(x, y) = \min(|x - y|, 1)$ est une distance, puisque $\min(a + b, 1) \leqslant \min(a, 1) + \min(b, 1)$ pour $a, b \geqslant 0$.

        Ses boules de rayon $r \leqslant 1$ sont celles de $|x - y|$, si bien qu'elle définit la même topologie ; pourtant $\mathbb R$ tout entier est contenu dans la boule $B'(0, 2)$. Aucune inégalité $|x - y| \leqslant \beta d'(x, y)$ n'est possible, et (v) ne s'applique pas.

  - id: me-sequentielle
    etiquette: Suites convergentes
    nature: proposition
    titre: Suites, adhérence et continuité dans un espace métrique
    choix: |
      Les réciproques de (ii), de (iii) et de (iv) choisissent un terme dans chacun des ensembles non vides $A \cap B(x, \frac1{n+1})$ : elles utilisent le [[choix-denombrable]]. On ne peut pas s'en passer, même dans $\mathbb R$ (Herrlich et Strecker, 1997, cités au nœud {{tr-sequentielle|Fermés et suites}}). Les sens directs n'utilisent aucun choix.
    texte: |
      Une [[suite]] $(x_n)$ d'éléments d'un espace métrique $(X, d)$ **converge** vers $\ell \in X$ si la suite réelle $d(x_n, \ell)$ tend vers $0$ : pour tout $\varepsilon > 0$, il existe $N$ tel que $d(x_n, \ell) < \varepsilon$ pour $n \geqslant N$. C'est la [[limite-suite|limite]] du chapitre {{ar-suites|Suites et limites}}, la distance remplaçant la valeur absolue.
    enonce: |
      (i) La suite $(x_n)$ converge vers $\ell$ si et seulement si tout voisinage de $\ell$ contient les $x_n$ à partir d'un certain rang. La limite, si elle existe, est unique, et toute [[suite-extraite]] d'une suite convergente converge vers la même limite.

      (ii) Si une suite d'éléments de $A$ converge vers $x$, alors $x \in \overline A$. Réciproquement, tout point de $\overline A$ est la limite d'une suite d'éléments de $A$.

      (iii) Une partie $A$ est fermée si et seulement si la limite de toute suite convergente d'éléments de $A$ appartient à $A$.

      (iv) Soit $f : X \to Y$ entre espaces métriques et $a \in X$. Si $f$ est continue en $a$, alors $f(x_n) \to f(a)$ pour toute suite $x_n \to a$. Réciproquement, cette propriété entraîne la continuité en $a$.
    preuve: |
      (i) Un voisinage de $\ell$ contient une boule $B(\ell, \varepsilon)$ ({{me-topologie|Topologie d'une distance}}, (ii)), et une boule est un voisinage. Si $x_n \to \ell$ et $x_n \to \ell'$, alors $d(\ell, \ell') \leqslant d(\ell, x_n) + d(x_n, \ell')$ tend vers $0$, donc $\ell = \ell'$.

      Pour une suite extraite, $\varphi(n) \geqslant n$ ({{su-extraites|Suites extraites}}), donc $d(x_{\varphi(n)}, \ell) < \varepsilon$ dès que $n \geqslant N$.

      (ii) Si $a_n \to x$ et $r > 0$, il existe $N$ tel que $a_N \in B(x, r)$, et cette boule rencontre $A$ : $x \in \overline A$ par {{me-topologie|Topologie d'une distance}}, (ii).

      Réciproquement, si $x \in \overline A$, chaque ensemble $A \cap B(x, \frac1{n+1})$ est non vide ; on y choisit $a_n$. Pour $\varepsilon > 0$, la propriété d'Archimède fournit $N$ tel que $\frac1{N+1} < \varepsilon$, et $d(a_n, x) < \varepsilon$ pour $n \geqslant N$.

      (iii) Si $A$ est fermée et si $a_n \to x$ avec $a_n \in A$, alors $x \in \overline A = A$ par (ii). Réciproquement, si la condition est remplie, tout point de $\overline A$ est limite d'une suite de $A$ par la réciproque de (ii), donc appartient à $A$ : $\overline A \subset A$.

      (iv) Si $f$ est continue en $a$, soit $\varepsilon > 0$ et $\delta$ associé par {{me-topologie|Topologie d'une distance}}, (iv) ; il existe $N$ tel que $d(x_n, a) < \delta$ pour $n \geqslant N$, et alors $d(f(x_n), f(a)) < \varepsilon$.

      Si $f$ n'est pas continue en $a$, il existe $\varepsilon > 0$ tel que chaque ensemble
      $$\begin{aligned} \{x :{} &d(x, a) < \frac1{n+1}, \\ &d(f(x), f(a)) \geqslant \varepsilon\} \end{aligned}$$
      soit non vide ; un $x_n$ choisi dans chacun tend vers $a$, sans que $f(x_n)$ tende vers $f(a)$.
    remarques:
      - |
        Ce sont, pour un espace métrique quelconque, les énoncés des nœuds {{tr-sequentielle|Fermés et suites}} et {{c-sequentielle|Caractérisation séquentielle}}, écrits pour $\mathbb R$. Comme là, le sens direct de (iii), « un fermé contient les limites de ses suites convergentes », est le plus employé, et il ne demande aucun choix.
      - |
        Dans un espace topologique qui n'est pas métrique, les suites ne suffisent plus à décrire l'adhérence, même avec l'axiome du choix. C'est une raison de préférer, quand on le peut, les arguments par recouvrements, comme celui du nombre de Lebesgue ({{me-lebesgue|Nombre de Lebesgue}}).

  - id: me-cauchy
    etiquette: Espaces complets
    nature: définition
    titre: Suites de Cauchy et espaces complets
    choix: |
      La réciproque de (iii) utilise la réciproque de la caractérisation séquentielle de l'adhérence, donc le [[choix-denombrable]] ; le sens direct n'en demande aucun.
    texte: |
      Une suite $(x_n)$ d'un espace métrique $(X, d)$ est une [[suite-cauchy|suite de Cauchy]] si, pour tout $\varepsilon > 0$, il existe $N$ tel que $d(x_p, x_q) < \varepsilon$ pour tous $p, q \geqslant N$. L'espace $X$ est [[espace-complet|complet]] si toute suite de Cauchy de $X$ converge dans $X$.
    enonce: |
      (i) Toute suite convergente est de Cauchy, et toute suite de Cauchy est bornée. Une suite de Cauchy qui a une suite extraite convergente converge, vers la même limite.

      (ii) $\lex{ensemble-reels}{\mathbb R}$, muni de $|x - y|$, est complet.

      (iii) Une partie fermée d'un espace complet est complète pour la distance induite. Réciproquement, une partie complète d'un espace métrique y est fermée.

      (iv) Si deux distances vérifient $\alpha d \leqslant d' \leqslant \beta d$ avec $\alpha, \beta > 0$, elles ont les mêmes suites de Cauchy et les mêmes suites convergentes ; l'une est complète si et seulement si l'autre l'est.
    preuve: |
      (i) Si $x_n \to \ell$, alors $d(x_p, x_q) \leqslant d(x_p, \ell) + d(\ell, x_q)$. Si $(x_n)$ est de Cauchy, il existe $N$ tel que $d(x_n, x_N) < 1$ pour $n \geqslant N$, et tous les termes sont dans la boule de centre $x_N$ et de rayon $1 + \max_{n < N} d(x_n, x_N)$.

      Supposons enfin $x_{\varphi(k)} \to \ell$. Pour $\varepsilon > 0$, soit $N$ tel que $d(x_p, x_q) < \varepsilon/2$ pour $p, q \geqslant N$, et $k \geqslant N$ tel que $d(x_{\varphi(k)}, \ell) < \varepsilon/2$ ; comme $\varphi(k) \geqslant k \geqslant N$, on a, pour $n \geqslant N$,
      $$\begin{aligned} &d(x_n, \ell) \\ &\quad \leqslant d(x_n, x_{\varphi(k)}) + d(x_{\varphi(k)}, \ell) \\ &\quad < \varepsilon. \end{aligned}$$

      (ii) C'est le théorème du nœud {{ar-cauchy|Complétude de ℝ}}.

      (iii) Soit $F$ fermée dans l'espace complet $X$, et $(x_n)$ une suite de Cauchy de $F$. Elle est de Cauchy dans $X$ et converge vers un $\ell \in X$, qui appartient à $F$ par le sens direct du nœud {{me-sequentielle|Suites convergentes}}, (iii).

      Réciproquement, soit $A$ complète et $x \in \overline A$. Par la réciproque du nœud {{me-sequentielle|Suites convergentes}}, (ii), une suite $(a_n)$ de $A$ tend vers $x$ ; elle est de Cauchy par (i), donc converge dans $A$ vers un $\ell$, et $\ell = x$ par unicité de la limite : $x \in A$.

      (iv) On a $d(x_p, x_q) \leqslant d'(x_p, x_q)/\alpha$ et $d'(x_p, x_q) \leqslant \beta\, d(x_p, x_q)$, et de même avec $\ell$ à la place de $x_q$.
    remarques:
      - |
        $\lex{ensemble-rationnels}{\mathbb Q}$, muni de $|x - y|$, n'est pas complet. La suite définie par $x_0 = 1$ et
        $$x_{n+1} = 1 + \frac{1}{1 + x_n}$$
        est formée de rationnels, $1$, $\frac32$, $\frac75$, $\frac{17}{12}$, $\frac{41}{29}$, …, qui encadrent alternativement $\sqrt 2$.

        Deux termes consécutifs diffèrent de $\frac12$, $\frac1{10}$, $\frac1{60}$, $\frac1{348}$, …, et chaque terme est compris entre les deux précédents.

        La suite est donc de Cauchy, et elle converge dans $\mathbb R$ vers $\sqrt 2$, qui n'est pas rationnel ({{tr-dense|Densité de ℚ}}) : elle n'a pas de limite dans $\mathbb Q$.

        ```schema me-cauchy
        En haut, les premiers termes de la suite sur la droite réelle ; le cadre gris autour de $x_2$ est agrandi en dessous. À partir du rang $N$, tous les termes restent entre $x_N$ et $x_{N+1}$, ici dans l'intervalle rouge de longueur $\frac1{60}$ pour $N = 2$ : c'est le critère de Cauchy. Les termes suivant $x_5$ se confondent à cette échelle avec le point vers lequel ils s'accumulent, $\sqrt 2$, cerclé, qui manque à $\mathbb Q$.
        ```
      - |
        L'erreur la plus répandue est de croire que la complétude est une propriété topologique. L'application $t \mapsto \frac{t}{1 - |t|}$ est une bijection continue et strictement croissante de $]{-1}, 1[$ sur $\mathbb R$, de réciproque $s \mapsto \frac{s}{1 + |s|}$, continue elle aussi : c'est un homéomorphisme.

        Pourtant $\mathbb R$ est complet, alors que $]{-1}, 1[$, muni de $|x - y|$, ne l'est pas, la suite $1 - \frac1{n+2}$ y étant de Cauchy sans limite.

        Le point (iv) montre ce qui est préservé : des distances comparables, et pas seulement une même topologie.
      - |
        C'est la complétude qui fait fonctionner les méthodes d'approximations successives de la suite de ce graphe, le point fixe de Banach ({{gd-point-fixe|Point fixe}}) et le théorème de Baire ({{f-baire|Théorème de Baire}}).

  - id: me-rn
    etiquette: L'espace ℝⁿ
    nature: théorème
    titre: "ℝⁿ : topologie produit, complétude, compacts"
    enonce: |
      Munissons $\lex{n-uplet}{\mathbb R^n}$ de l'une des distances $d_\infty$, $d_1$, $d_2$ ({{me-espace|Espaces métriques}}).

      (i) Les trois distances définissent la même topologie, qui est la [[topologie-produit]] de $n$ copies de $\lex{ensemble-reels}{\mathbb R}$, et les mêmes parties bornées. Une suite converge si et seulement si chacune de ses $n$ suites de coordonnées converge.

      (ii) $\mathbb R^n$ est complet.

      (iii) Une partie de $\mathbb R^n$ est [[compact|compacte]] si et seulement si elle est fermée et bornée.
    preuve: |
      (i) Par l'encadrement $d_\infty \leqslant d_2 \leqslant d_1 \leqslant n\, d_\infty$ ({{me-espace|Espaces métriques}}, (ii)) et le nœud {{me-topologie|Topologie d'une distance}}, (v), il suffit de traiter $d_\infty$.

      La boule $B_\infty(a, r)$ est le produit $\prod_i\, ]a_i - r, a_i + r[$, qui est un ouvert de la topologie produit.

      Réciproquement, soit $\prod_i U_i$ un produit d'ouverts de $\mathbb R$ contenant $a$ : chaque $U_i$ contient un intervalle $]a_i - r_i, a_i + r_i[$ ({{tr-ouverts|Ouverts de ℝ}}), et $B_\infty(a, \min_i r_i) \subset \prod_i U_i$. Les produits d'ouverts formant une base de la topologie produit, les deux topologies ont les mêmes ouverts.

      Enfin $d_\infty(x_k, x) < \varepsilon$ équivaut à $|x_{k, i} - x_i| < \varepsilon$ pour chacun des $n$ indices $i$, et un nombre fini de rangs se remplace par le plus grand.

      (ii) Si $(x_k)$ est de Cauchy pour $d_\infty$, chaque suite de coordonnées l'est dans $\mathbb R$, puisque $|x_{p, i} - x_{q, i}| \leqslant d_\infty(x_p, x_q)$, et converge ({{ar-cauchy|Complétude de ℝ}}) ; la suite converge alors par (i). Les deux autres distances ont les mêmes suites de Cauchy et les mêmes suites convergentes ({{me-cauchy|Espaces complets}}, (iv)).

      (iii) Soit $K$ compacte. Elle est fermée, comme partie compacte de l'espace séparé $\mathbb R^n$ ({{t-compact-prop|Parties compactes}}, (ii)). Les boules $B_\infty(0, k)$, pour les entiers $k \geqslant 1$, recouvrent $\mathbb R^n$ par la propriété d'Archimède ; un nombre fini d'entre elles recouvre $K$, qui est donc contenue dans la plus grande.

      Réciproquement, soit $K$ fermée et bornée, contenue dans une boule $B_\infty(a, r)$, donc dans le pavé $P = [-R, R]^n$ avec $R = d_\infty(0, a) + r$.

      Ce pavé est compact pour la topologie produit, comme produit fini de segments ({{tr-borel-lebesgue|Borel-Lebesgue}}, {{t-produit-fini|Produit fini de compacts}}), et cette topologie est celle que $\mathbb R^n$ induit sur $P$, comme on l'a vu pour $[-1, 1]^{n+1}$ au nœud {{tr-sphere|Sphère unité Sⁿ}}.

      Enfin $K = K \cap P$ est fermée dans $P$, donc compacte ({{t-compact-prop|Parties compactes}}, (i)), la topologie que $P$ induit sur $K$ étant celle que $\mathbb R^n$ induit.
    remarques:
      - |
        Pour $n = 1$, (iii) redonne le théorème du nœud {{tr-compacts|Compacts de ℝ}}. Toute la difficulté est dans la compacité du segment, c'est-à-dire, en dernier ressort, dans la propriété de la borne supérieure ; le passage à la dimension $n$ ne demande que le lemme du tube.
      - |
        L'erreur la plus répandue est d'étendre (iii) à un espace métrique quelconque. Pour la distance $\min(|x - y|, 1)$ sur $\mathbb R$ ({{me-topologie|Topologie d'une distance}}), l'espace entier est fermé et borné, mais il n'est pas compact, puisque sa topologie est la topologie usuelle et que les ouverts $]{-k}, k[$ le recouvrent sans qu'un nombre fini y suffise.

  - id: me-lebesgue
    etiquette: Nombre de Lebesgue
    nature: lemme
    titre: Lemme du nombre de Lebesgue
    texte: |
      Soit $\mathcal U$ un [[recouvrement]] ouvert d'un espace métrique $X$. Un [[nombre-lebesgue|nombre de Lebesgue]] de $\mathcal U$ est un réel $\eta > 0$ tel que toute partie non vide de $X$ de diamètre $< \eta$ soit contenue dans un élément de $\mathcal U$.
    enonce: |
      Tout recouvrement ouvert d'un espace métrique [[compact]] non vide $K$ admet un nombre de Lebesgue. Plus précisément, la fonction
      $$\begin{aligned} \rho(x) = \sup\big\{&r \in \,]0, 1] : \\ &B(x, r) \subset U \\ &\text{pour un } U \in \mathcal U\big\} \end{aligned}$$
      est bien définie, $1$-lipschitzienne et strictement positive sur $K$, et son minimum est un nombre de Lebesgue.
    preuve: |
      Pour $x \in K$, l'ensemble $R_x$ des $r \in \,]0, 1]$ tels que $B(x, r)$ soit contenue dans un élément de $\mathcal U$ est non vide : $x$ appartient à un ouvert $U \in \mathcal U$, qui contient une boule $B(x, r)$ ({{me-topologie|Topologie d'une distance}}, (i)), et l'on peut prendre $r \leqslant 1$. Il est majoré par $1$, et $\rho(x) = \sup R_x \in \,]0, 1]$ existe ({{ar-corps|Borne supérieure}}).

      *$\rho$ est $1$-lipschitzienne.* Soient $x, y \in K$. Si $d(x, y) < r$ avec $r \in R_x$, la boule $B(y, r - d(x, y))$ est contenue dans $B(x, r)$, par l'inégalité triangulaire, donc dans le même élément de $\mathcal U$, et $r - d(x, y) \in R_y$.

      En passant à la borne supérieure sur ces $r$, $\rho(y) \geqslant \rho(x) - d(x, y)$, inégalité évidente si $d(x, y) \geqslant \rho(x)$. Par symétrie, $|\rho(x) - \rho(y)| \leqslant d(x, y)$.

      *Conclusion.* $\rho$ est continue ({{me-topologie|Topologie d'une distance}}, (iv)), et $K$ est compact non vide : elle atteint son minimum $m$ en un point $x_0$ ({{tr-compacts|Compacts de ℝ}}, (iii)), et $m = \rho(x_0) > 0$.

      Soit $A \subset K$ non vide de diamètre $\delta < m$, et $x \in A$. Comme $\rho(x) \geqslant m > \delta$, il existe $r \in R_x$ avec $r > \delta$, par définition de la borne supérieure ; alors $A \subset B(x, r)$, puisque $d(x, y) \leqslant \delta$ pour $y \in A$, et $B(x, r)$ est contenue dans un élément de $\mathcal U$. Ainsi $m$ est un nombre de Lebesgue.

      ```schema me-lebesgue
      Le segment $[0, 1]$ est recouvert par les trois ouverts $[0, \frac{9}{20}[$, $]\frac{3}{10}, \frac45[$ et $]\frac{31}{50}, 1]$, en bleu et en vert. La fonction $\rho$, en rouge, mesure en chaque point la marge dont on dispose dans le meilleur des ouverts ; elle est faite de segments de pente $\pm 1$. Son minimum $m = \frac{3}{40}$, atteint en $\frac38$, au milieu de la zone où les deux premiers ouverts se chevauchent, est un nombre de Lebesgue : tout intervalle de longueur $< \frac{3}{40}$ tient dans l'un des ouverts.
      ```
    remarques:
      - |
        Aucun choix n'intervient : on ne désigne pas, pour chaque point, un ouvert ou un rayon, ce qui serait une infinité de choix ; la fonction $\rho$ est définie par une borne supérieure, et la compacité intervient seulement par le minimum d'une fonction continue.
      - |
        La compacité est indispensable. L'intervalle $]0, 1[$ est recouvert par les ouverts $]\frac1{k+2}, 1[$, $k \in \lex{ensemble-entiers-naturels}{\mathbb N}$, mais, pour tout $\eta > 0$, l'intervalle $]0, \frac\eta2[$, de diamètre $\frac\eta2 < \eta$, n'est contenu dans aucun d'eux : il n'y a pas de nombre de Lebesgue.
      - |
        Le lemme sert à découper un objet compact en morceaux assez petits pour que chacun soit sous le contrôle d'un ouvert du recouvrement : c'est ainsi que la topologie algébrique relève les chemins et les homotopies ({{ta-revetement|Revêtements, relèvement}}), et que le nœud suivant obtient le théorème de Heine.

  - id: me-heine
    etiquette: Théorème de Heine
    nature: théorème
    titre: Théorème de Heine sur un compact métrique
    enonce: |
      Soient $K$ un espace métrique [[compact]], $(Y, d')$ un espace métrique et $f : K \to Y$ continue. Alors $f$ est [[continuite-uniforme|uniformément continue]] :
      $$\begin{aligned} &\forall \varepsilon > 0,\ \exists \delta > 0,\ \forall x, x' \in K, \\ &\quad d(x, x') < \delta \ \Longrightarrow \\ &\qquad d'(f(x), f(x')) < \varepsilon. \end{aligned}$$
    preuve: |
      Si $K$ est vide, il n'y a rien à démontrer. Soit $\varepsilon > 0$. Les ouverts $f^{-1}\big(B(y, \varepsilon/2)\big)$, pour $y \in Y$, recouvrent $K$, puisque $x \in f^{-1}\big(B(f(x), \varepsilon/2)\big)$, et ils sont ouverts par continuité.

      Soit $\delta$ un nombre de Lebesgue de ce recouvrement ({{me-lebesgue|Nombre de Lebesgue}}). Si $d(x, x') < \delta$, la partie $\{x, x'\}$ est de diamètre $< \delta$, donc contenue dans un $f^{-1}\big(B(y, \varepsilon/2)\big)$, et
      $$\begin{aligned} &d'(f(x), f(x')) \\ &\quad \leqslant d'(f(x), y) + d'(y, f(x')) \\ &\quad < \varepsilon. \end{aligned}$$
    remarques:
      - |
        Le nœud {{c-heine|Théorème de Heine}} traite le cas d'un segment par la borne supérieure, sans choix ; la démonstration séquentielle usuelle, qu'il rappelle en remarque, utilise le choix dénombrable. Celle-ci, valable sur tout compact métrique, n'en fait aucun non plus : le théorème de Heine est démontrable dans $\mathsf{ZF}$, le segment étant compact par le théorème de Borel-Lebesgue, lui aussi démontré sans choix.
      - |
        La compacité ne peut pas être omise. Sur $]0, 1]$, la fonction $x \mapsto \frac1x$ est continue, mais $\frac1x - \frac1{2x} = \frac1{2x}$ dépasse $1$ dès que $x < \frac12$, bien que $|x - 2x| = x$ soit aussi petit qu'on veut.

  - id: me-compacite-sequentielle
    etiquette: Compacité séquentielle
    nature: théorème
    titre: Compacité et compacité séquentielle d'un espace métrique
    choix: |
      Le sens direct n'utilise aucun choix. La réciproque construit, à l'étape 1, une suite de points dont chacun est choisi en fonction des précédents, ce qui est le **choix dépendant**, et choisit, à l'étape 2, un point dans chacun des ensembles d'une suite, ce qui est le [[choix-denombrable]]. Une forme du choix est inévitable : K. Keremedis (« On sequential compactness and related notions of compactness of metric spaces in ZF », *Bull. Polish Acad. Sci. Math.* 64 (2016), p. 29-46) montre dans $\mathsf{ZF}$ que, si tout espace métrique séquentiellement compact est compact, alors tout ensemble infini contient une partie équipotente à $\mathbb N$, ce que $\mathsf{ZF}$ seul ne démontre pas ; il montre aussi que le choix dénombrable suffit.
    enonce: |
      Un espace métrique $K$ est [[compact]] si et seulement si toute suite d'éléments de $K$ admet une [[suite-extraite]] qui converge dans $K$.
    preuve: |
      *Sens direct.* Soit $K$ compact et $(x_n)$ une suite de $K$. Disons qu'un ouvert $V$ est *rare* si l'ensemble des $n$ tels que $x_n \in V$ est fini.

      Supposons qu'aucun point $a$ n'ait la propriété suivante : pour tout $r > 0$, l'ensemble des $n$ tels que $x_n \in B(a, r)$ est infini. Alors tout point est le centre d'une boule rare, et les ouverts rares recouvrent $K$.

      Un nombre fini d'entre eux suffit ; mais chaque entier $n$ est l'un des indices relatifs à l'un d'eux, puisque $x_n$ appartient à l'un d'eux, et $\lex{ensemble-entiers-naturels}{\mathbb N}$ serait une réunion finie d'ensembles finis. Il existe donc un point $a$ ayant la propriété.

      On pose alors $\varphi(0)$ le plus petit $n$ tel que $x_n \in B(a, 1)$, et $\varphi(k + 1)$ le plus petit $n > \varphi(k)$ tel que $x_n \in B(a, \frac1{k+2})$ ; la suite extraite $(x_{\varphi(k)})$ tend vers $a$, puisque $d(x_{\varphi(k)}, a) < \frac1{k+1}$.

      *Réciproque.* Supposons que toute suite de $K$ ait une suite extraite convergente.

      *Étape 1 : pour tout $\varepsilon > 0$, $K$ est réunion d'un nombre fini de boules de rayon $\varepsilon$.* Sinon, partant d'un point $x_0$, on choisit par récurrence $x_{n+1}$ hors de $B(x_0, \varepsilon) \cup \cdots \cup B(x_n, \varepsilon)$. Deux termes distincts de la suite sont à distance au moins $\varepsilon$ ; aucune suite extraite n'est de Cauchy, donc aucune ne converge ({{me-cauchy|Espaces complets}}, (i)).

      *Étape 2 : pour tout recouvrement ouvert $\mathcal U$, il existe $\eta > 0$ tel que toute boule de rayon $\eta$ soit contenue dans un élément de $\mathcal U$.* Sinon, on choisit pour chaque $n$ un point $x_n$ tel que $B(x_n, \frac1{n+1})$ ne soit contenue dans aucun élément de $\mathcal U$.

      Une suite extraite $(x_{\varphi(k)})$ tend vers un point $a$, qui appartient à un $U \in \mathcal U$ contenant une boule $B(a, r)$. Pour $k$ assez grand, $d(x_{\varphi(k)}, a) < r/2$ et $\frac1{\varphi(k)+1} < r/2$, donc
      $$\begin{aligned} B(x_{\varphi(k)}, \frac1{\varphi(k)+1}) &\subset B(a, r) \\ &\subset U : \end{aligned}$$
      contradiction.

      *Étape 3.* Soit $\mathcal U$ un recouvrement ouvert et $\eta$ comme à l'étape 2. Par l'étape 1, $K$ est la réunion d'un nombre fini de boules $B(c_1, \eta), \dots, B(c_m, \eta)$, et chacune est contenue dans un élément $U_j$ de $\mathcal U$ ; ces $m$ choix sont en nombre fini.

      Les ouverts $U_1, \dots, U_m$ recouvrent $K$, qui est séparé ({{me-topologie|Topologie d'une distance}}, (i)) : $K$ est compact.
    remarques:
      - |
        Le sens direct, sans choix, donne le théorème de Bolzano-Weierstrass dans $\lex{n-uplet}{\mathbb R^n}$ : une suite bornée est contenue dans un pavé fermé borné, compact par le théorème du nœud {{me-rn|L'espace ℝⁿ}}, (iii), et elle a donc une suite extraite convergente. Pour $n = 1$, c'est le théorème du nœud {{ar-bw|Bolzano-Weierstrass}}, démontré là par le lemme des pics.
      - |
        L'équivalence est propre aux espaces métriques : comme le rappelle le nœud {{tr-compacite-sequentielle|Compacité séquentielle}}, le produit $[0, 1]^{[0, 1]}$ est compact sans être séquentiellement compact.

  - id: me-precompacts
    etiquette: Parties précompactes
    nature: proposition
    titre: Parties précompactes d'un espace complet
    texte: |
      Une partie $A$ d'un espace métrique $X$ est [[partie-precompacte|précompacte]] si, pour tout $\varepsilon > 0$, il existe une famille finie $(a_1, \dots, a_m)$ de points de $X$ telle que
      $$A \subset B(a_1, \varepsilon) \cup \cdots \cup B(a_m, \varepsilon).$$
      Une telle famille est un **$\varepsilon$-réseau** de $A$.
    choix: |
      Le point (ii) suppose les réseaux donnés, sous la forme d'une suite de familles finies, et n'utilise alors aucun choix : à chaque étape, la démonstration prend le plus petit indice qui convient. Le point (iii) doit d'abord désigner un réseau pour chaque rayon $2^{-k}$, parmi tous ceux qui existent, ce qui fait une infinité dénombrable de choix : c'est le [[choix-denombrable]]. Les applications de l'analyse fonctionnelle fournissent le plus souvent les réseaux explicitement, et s'en tiennent à (ii).
    enonce: |
      (i) Une partie compacte d'un espace métrique est précompacte, et toute partie d'une partie précompacte l'est aussi. Si $A$ est contenue dans la réunion des boules $B(a_i, \varepsilon)$, $i \leqslant m$, son adhérence $\bar A$ est contenue dans la réunion des boules $B(a_i, 2\varepsilon)$ ; en particulier, l'adhérence d'une partie précompacte est précompacte.

      (ii) Soit $X$ un espace métrique [[espace-complet|complet]] et $Y$ une partie fermée de $X$. On suppose donnée, pour chaque $k \in \lex{ensemble-entiers-naturels}{\mathbb N}$, une famille finie $(a_{k,1}, \dots, a_{k,m_k})$ de points de $X$ telle que
      $$Y \subset \bigcup_{i \leqslant m_k} B(a_{k,i}, 2^{-k}).$$
      Alors $Y$ est [[compact|compacte]].

      (iii) Dans un espace complet, toute partie fermée et précompacte est compacte, et l'adhérence de toute partie précompacte est compacte.
    preuve: |
      (i) Soit $K$ compacte et $\varepsilon > 0$. Les traces sur $K$ des boules $B(x, \varepsilon)$, $x \in K$, sont des ouverts de $K$ ({{me-topologie|Topologie d'une distance}}, (iii)) qui recouvrent $K$ ; un nombre fini d'entre elles suffit, et leurs centres, en nombre fini, forment un $\varepsilon$-réseau. Une partie de $A$ est contenue dans les mêmes boules que $A$.

      Si enfin $y \in \bar A$, la boule $B(y, \varepsilon)$ rencontre $A$ ({{me-topologie|Topologie d'une distance}}, (ii)) en un point $z$, qui appartient à une boule $B(a_i, \varepsilon)$, et
      $$d(y, a_i) \leqslant d(y, z) + d(z, a_i) < 2\varepsilon.$$

      (ii) Si $Y$ est vide, il n'y a rien à démontrer. Soit $\mathcal U$ une famille d'ouverts de $X$ dont la réunion contient $Y$ ; par {{me-topologie|Topologie d'une distance}}, (iii), il suffit de montrer qu'une sous-famille finie de $\mathcal U$ recouvre $Y$. Supposons le contraire, et disons qu'une partie $S \subset Y$ est *mauvaise* si aucune sous-famille finie de $\mathcal U$ ne la recouvre. Une partie mauvaise n'est pas vide, puisque la famille vide recouvre le vide.

      Si $S$ est mauvaise et contenue dans une réunion finie de parties, l'une au moins des traces de ces parties sur $S$ est mauvaise : sinon, la réunion des sous-familles finies qui recouvrent chacune d'elles serait une sous-famille finie qui recouvre $S$.

      On définit donc par récurrence sur $k$, en appliquant le nœud {{n-recdef|Définition par récurrence}} aux couples $(k, S_k)$, puisque l'étape dépend du rang $k$, des parties mauvaises $S_k$ et des indices $i_k$ : $S_{-1} = Y$, et $i_k$ est le plus petit indice $i \leqslant m_k$ tel que
      $$S_k = S_{k-1} \cap B(a_{k,i}, 2^{-k})$$
      soit mauvaise ; il existe par ce qui précède, puisque $S_{k-1} \subset Y$ est contenue dans la réunion des $B(a_{k,i}, 2^{-k})$.

      ```schema me-precompacts
      Ici $Y$ est le carré $[0, 1]^2$ privé du point $p$, partie qui n'est pas fermée, et le réseau de rang $k$ est la grille de pas $2^{-k}$ (en gris pour $k = 3$), pour la distance $d_\infty$, dont les boules sont des carrés. Les ouverts « distance à $p$ supérieure à $\frac1{n+1}$ » recouvrent $Y$ sans qu'un nombre fini suffise, et les parties mauvaises sont celles dont $p$ est adhérent. Les parties emboîtées $S_0 \supset S_1 \supset S_2 \supset S_3$, la première presque égale à $Y$ et les suivantes en rouge, se resserrent autour de $p$, et leurs centres $c_k$, en bleu, tendent vers $p$, qui manque à $Y$ : c'est là que la démonstration utilise que $Y$ est fermée.
      ```

      Posons $c_k = a_{k,i_k}$. La partie $S_{k+1}$ n'est pas vide et elle est contenue dans $B(c_k, 2^{-k}) \cap B(c_{k+1}, 2^{-k-1})$, d'où $d(c_k, c_{k+1}) < 2^{-k} + 2^{-k-1} < 2^{1-k}$. Pour $l > k$, l'inégalité triangulaire donne
      $$d(c_k, c_l) < \sum_{j \geqslant k} 2^{1-j} = 2^{2-k}.$$
      La suite $(c_k)$ est de Cauchy, puisque $2^{-k} \leqslant \frac1{k+1}$ et que $\mathbb R$ est [[archimedien]] ; elle converge vers un point $x \in X$, et $d(c_k, x) \leqslant 2^{2-k}$ par continuité de la distance.

      Soit $r > 0$ et $k$ tel que $5 \cdot 2^{-k} < r$. Pour $z \in S_k$, on a
      $$d(z, x) \leqslant d(z, c_k) + d(c_k, x) < 5 \cdot 2^{-k},$$
      donc $S_k \subset B(x, r)$. Ainsi toute boule de centre $x$ rencontre $Y$, qui contient $S_k$ : le point $x$ est adhérent à $Y$, et il appartient à $Y$, qui est fermée.

      Il appartient donc à un ouvert $U \in \mathcal U$, qui contient une boule $B(x, r)$ ({{me-topologie|Topologie d'une distance}}, (i)). Pour $k$ comme ci-dessus, $S_k \subset B(x, r) \subset U$ est recouverte par le seul ouvert $U$, ce qui contredit le fait qu'elle est mauvaise. Enfin $Y$ est séparée, comme tout espace métrique ({{me-topologie|Topologie d'une distance}}, (i)) : elle est compacte.

      (iii) Soit $Y$ fermée et précompacte. Pour chaque $k$, il existe un $2^{-k}$-réseau de $Y$ ; en choisissant l'un d'eux pour chaque $k$, on applique (ii). Si $A$ est précompacte, $\bar A$ est fermée, et précompacte par (i).
    remarques:
      - |
        La complétude est indispensable. Dans $X = \lex{ensemble-rationnels}{\mathbb Q}$, la partie $Y = [1, 2] \cap \mathbb Q$ est fermée et précompacte, puisque les rationnels $1 + j2^{-k}$, $0 \leqslant j \leqslant 2^k$, en forment des $2^{-k}$-réseaux. Elle n'est pourtant pas compacte : la suite de rationnels du nœud {{me-cauchy|Espaces complets}}, qui tend vers $\sqrt 2$ dans $\mathbb R$, n'a aucune suite extraite qui converge dans $\mathbb Q$, ce qu'interdirait le sens direct, sans choix, du nœud {{me-compacite-sequentielle|Compacité séquentielle}}.
      - |
        L'erreur la plus répandue est de confondre précompacte et bornée. Une partie précompacte est bornée, car contenue dans une réunion finie de boules, mais la réciproque est fausse. Pour la distance $\min(|x - y|, 1)$ sur $\mathbb R$ ({{me-topologie|Topologie d'une distance}}), l'espace entier est borné ; ses boules de rayon $\frac12$ sont des intervalles de longueur $1$, et un nombre fini d'entre elles ne recouvre pas $\mathbb R$.

        En dimension infinie, le même phénomène atteint la boule unité d'un espace normé : dans l'espace des suites de carré sommable, les vecteurs de base sont à distance $\sqrt 2$ les uns des autres, et une boule de rayon $\frac{\sqrt 2}{2}$ en contient au plus un ({{f-compacts|Opérateurs compacts}}).
      - |
        Le point (ii) remplace, dans un espace complet, l'extraction de suites de la réciproque du nœud {{me-compacite-sequentielle|Compacité séquentielle}}, qui demande le choix dépendant, par une récurrence où chaque étape est désignée sans choix. Sa démonstration suit la même idée que celle du théorème de Baire ({{f-baire|Théorème de Baire}}) : des parties emboîtées de diamètres tendant vers $0$, dont les centres forment une suite de Cauchy. Mais là où Baire doit choisir une boule à chaque étape, on prend ici le premier indice d'une liste donnée d'avance.

  - id: gd-normes
    etiquette: Normes
    nature: définition
    titre: Normes et topologie associée
    texte: |
      Une [[norme]] sur un $\lex{ensemble-reels}{\mathbb R}$-[[espace-vectoriel|espace vectoriel]] $E$ est une application $N : E \to [0, +\infty[$ telle que, pour tous $x, y \in E$ et $\lambda \in \mathbb R$, $N(x) = 0$ entraîne $x = 0$, $N(\lambda x) = |\lambda|\, N(x)$ et $N(x + y) \leqslant N(x) + N(y)$.

      La **boule ouverte** de centre $a$ et de rayon $r > 0$ est $B(a, r) = \{x \in E : N(x - a) < r\}$.

      Sur $\lex{n-uplet}{\mathbb R^n}$, on dispose de $\|x\|_\infty = \max_i |x_i|$, de $\|x\|_1 = \sum_i |x_i|$ et de $\|x\|_2 = \big(\sum_i x_i^2\big)^{1/2}$.

      Ce sont des normes : l'homogénéité est immédiate, et la distance $(x, y) \mapsto \|x - y\|$ associée à chacune est la distance $d_\infty$, $d_1$ ou $d_2$ du nœud {{me-espace|Espaces métriques}}, dont l'inégalité triangulaire donne celle de la norme, puisque
      $$\begin{aligned} \|x + y\| &= d(x, -y) \\ &\leqslant d(x, 0) + d(0, -y). \end{aligned}$$
      On les note souvent $\|\cdot\|$ quand le choix est indifférent.
    enonce: |
      Soit $N$ une norme sur $E$.

      (i) $d(x, y) = N(x - y)$ est une distance, qui fait de $E$ un [[espace-metrique]] et vérifie $d(x + z, y + z) = d(x, y)$ et $d(\lambda x, \lambda y) = |\lambda|\, d(x, y)$. On munit $E$ de la topologie associée à cette distance, dite associée à $N$ : une partie $O$ est [[ouvert|ouverte]] si et seulement si, pour tout $a \in O$, il existe $r > 0$ tel que $B(a, r) \subset O$ ; les boules ouvertes en forment une [[base-topologie|base]], et elle est [[separe|séparée]].

      (ii) La topologie associée à $\|\cdot\|_\infty$ sur $\mathbb R^n$ est la [[topologie-produit]] de $n$ copies de $\mathbb R$.

      (iii) Soient $E$ et $F$ deux espaces normés, $A \subset E$ muni de la [[topologie-induite]], $f : A \to F$ et $a \in A$. L'application $f$ est continue en $a$ si et seulement si
      $$\begin{gathered} \forall \varepsilon > 0,\ \exists \delta > 0,\ \forall x \in A, \\ \|x - a\| < \delta \ \Longrightarrow\ \|f(x) - f(a)\| < \varepsilon. \end{gathered}$$
    preuve: |
      (i) $d(x, y) = 0$ entraîne $x = y$ ; $d(y, x) = N(-(x - y)) = |-1|\,N(x - y) = d(x, y)$ ; l'inégalité triangulaire de $d$ est celle de $N$ appliquée à $(x - y) + (y - z)$.

      Les deux égalités viennent de $(x + z) - (y + z) = x - y$ et de l'homogénéité. Le reste est le nœud {{me-topologie|Topologie d'une distance}}, (i).

      (ii) La distance associée à $\|\cdot\|_\infty$ est $d_\infty$, et c'est le nœud {{me-rn|L'espace ℝⁿ}}, (i).

      (iii) La topologie induite sur $A$ est celle de la distance induite, et c'est le critère de continuité du nœud {{me-topologie|Topologie d'une distance}}, (iii) et (iv).
    remarques:
      - |
        Une norme est déterminée par sa boule unité, qui est convexe et symétrique. Pour $\|\cdot\|_\infty$ sur $\mathbb R^2$, c'est un carré ; pour $\|\cdot\|_1$, un losange.

        ```schema gd-normes
        En notant $B_1$ et $B_\infty$ les boules de $\|\cdot\|_1$ et de $\|\cdot\|_\infty$, la boule unité de la première (losange rouge) et celle de la seconde (carré bleu) n'ont pas la même forme, mais elles s'emboîtent : $B_1(0, 1) \subset B_\infty(0, 1) \subset B_1(0, 2)$, cette dernière en pointillé. Cet encadrement traduit $\|x\|_\infty \leqslant \|x\|_1 \leqslant 2\|x\|_\infty$, et c'est lui qui rend les deux topologies égales.
        ```

        Le nœud suivant montre que ces différences de forme sont sans effet sur la topologie.
      - |
        Toutes les distances ne proviennent pas d'une norme : la distance discrète sur $\mathbb R^n$, $n \geqslant 1$, n'est pas homogène, puisque $d(2x, 0) = d(x, 0) = 1$ pour $x \neq 0$, alors qu'une distance issue d'une norme vérifierait $d(2x, 0) = 2\, d(x, 0)$.

  - id: gd-equivalence
    etiquette: Équivalence des normes
    nature: théorème
    titre: Normes en dimension finie
    texte: |
      Deux normes $N$ et $N'$ sur $E$ sont [[normes-equivalentes|équivalentes]] s'il existe $\alpha, \beta > 0$ tels que $\alpha N \leqslant N' \leqslant \beta N$. Les distances associées vérifient alors le même encadrement, si bien que les deux normes définissent la même topologie, les mêmes parties bornées ({{me-topologie|Topologie d'une distance}}, (v)) et les mêmes suites de Cauchy ({{me-cauchy|Espaces complets}}, (iv)).
    enonce: |
      (i) Sur $\lex{n-uplet}{\mathbb R^n}$, toutes les normes sont équivalentes ; elles définissent toutes la topologie produit.

      (ii) Pour n'importe quelle norme, les parties [[compact|compactes]] de $\mathbb R^n$ sont les parties fermées et bornées, et $\mathbb R^n$ est complet : toute [[suite-cauchy|suite de Cauchy]] converge.

      (iii) Munissons $\mathbb R^n$ et $\mathbb R^p$ de normes. Toute [[application-lineaire|application linéaire]] $u : \mathbb R^n \to \mathbb R^p$ est bornée sur la boule unité, et sa [[norme-subordonnee|norme subordonnée]] $|||u||| = \sup\{\|u(x)\| : \|x\| \leqslant 1\}$ est une norme sur $\lex{espace-applications-lineaires}{\mathcal L}(\mathbb R^n, \mathbb R^p)$, qui vérifie
      $$\|u(x)\| \leqslant |||u|||\,\|x\|,$$
      $$|||v \circ u||| \leqslant |||v|||\;|||u|||.$$
      En particulier, $u$ est lipschitzienne, donc continue.

      (iv) Sur un espace $E$ de [[dimension]] finie, toutes les normes sont équivalentes, et la topologie qu'elles définissent est celle que transporte n'importe quel isomorphisme $\mathbb R^n \to E$. Pour $E = \mathcal L(\mathbb R^n, \mathbb R^p)$, identifié aux matrices, c'est la topologie de $|||\cdot|||$ comme celle de $\max_{i,j} |a_{ij}|$.

      Pour toute norme sur $E$, l'espace $E$ est complet, ses parties compactes sont ses parties fermées et bornées, et toute application linéaire de $E$ dans un espace normé de dimension finie est continue.
    preuve: |
      (i) Soit $N$ une norme et $(e_i)$ la base canonique. Pour $x = \sum x_i e_i$,
      $$N(x) \leqslant \sum |x_i|\, N(e_i) \leqslant \beta \|x\|_\infty$$
      avec $\beta = \sum N(e_i)$. Par suite
      $$\begin{aligned} |N(x) - N(y)| &\leqslant N(x - y) \\ &\leqslant \beta \|x - y\|_\infty, \end{aligned}$$
      et $N$ est lipschitzienne, donc continue, pour $\|\cdot\|_\infty$ ({{me-topologie|Topologie d'une distance}}, (iv)).

      La sphère $S = \{x : \|x\|_\infty = 1\}$ est fermée, comme image réciproque d'un singleton par la fonction continue $\|\cdot\|_\infty$, et bornée : elle est compacte pour la topologie de $\|\cdot\|_\infty$ ({{me-rn|L'espace ℝⁿ}}, (iii)), qui est la topologie produit ({{gd-normes|Normes}}, (ii)).

      La fonction continue $N$ atteint donc sur $S$ sa borne inférieure $\alpha$ ({{tr-compacts|Compacts de ℝ}}, (iii)) : $\alpha = N(x_0)$ avec $x_0 \in S$, d'où $\alpha > 0$. Pour $x \neq 0$, $x/\|x\|_\infty \in S$ donne $N(x) \geqslant \alpha \|x\|_\infty$.

      Toute norme est ainsi équivalente à $\|\cdot\|_\infty$, et deux normes quelconques sont équivalentes entre elles.

      (ii) Par (i), la norme est équivalente à $\|\cdot\|_\infty$ : elle a les mêmes fermés, les mêmes parties bornées et les mêmes compacts, puisque la topologie est la même, et les mêmes suites de Cauchy et suites convergentes (texte ci-dessus). Pour $\|\cdot\|_\infty$, dont la distance est $d_\infty$, c'est le nœud {{me-rn|L'espace ℝⁿ}}, (ii) et (iii).

      (iii) Pour $\|x\| \leqslant 1$, $\|u(x)\| \leqslant \sum |x_j|\,\|u(e_j)\|$ est majoré par une constante, grâce à (i) ; la borne supérieure existe ({{ar-corps|Borne supérieure}}).

      Pour $x \neq 0$, $\|u(x/\|x\|)\| \leqslant |||u|||$ donne la première inégalité, et la seconde s'en déduit :
      $$\|v(u(x))\| \leqslant |||v|||\;|||u|||\,\|x\|.$$
      Les axiomes de norme se vérifient point par point avant de passer à la borne supérieure. Enfin $\|u(x) - u(y)\| \leqslant |||u|||\,\|x - y\|$.

      (iv) Si $\varphi : \mathbb R^n \to E$ est un isomorphisme et $N$ une norme sur $E$, alors $N \circ \varphi$ est une norme sur $\mathbb R^n$.

      Deux normes sur $E$ se transportent en deux normes équivalentes sur $\mathbb R^n$ ; elles sont donc équivalentes sur $E$. L'isomorphisme $\varphi$ envoie la topologie de $\|\cdot\|_\infty$ sur celle de la norme $\|\varphi^{-1}(\cdot)\|_\infty$, qui est l'une d'elles. Pour les applications linéaires, on utilise l'isomorphisme avec $\lex{espace-matrices}{\mathcal M_{p,n}}(\mathbb R) \cong \mathbb R^{pn}$ ({{v-matrices|Matrices}}).

      Enfin, pour une norme $N$ sur $E$, l'isomorphisme $\varphi$ est une isométrie de $\mathbb R^n$, muni de la norme $N \circ \varphi$, sur $(E, N)$. Il est continu ainsi que sa réciproque, puisque tous deux sont $1$-lipschitziens ({{me-topologie|Topologie d'une distance}}, (iv)), et il envoie boules sur boules et suites de Cauchy sur suites de Cauchy. Il conserve donc les fermés, les parties bornées, les compacts ({{t-compact-prop|Parties compactes}}, (iii)) et la complétude, et (ii) donne les deux premières affirmations.

      Pour la dernière, soit $u : E \to F$ linéaire, où $F$ est un espace normé de dimension finie $p$, et $\psi : \mathbb R^p \to F$ un isomorphisme, isométrique pour la norme transportée. L'application $\psi^{-1} \circ u \circ \varphi$ est continue par (iii), et $u = \psi \circ (\psi^{-1} \circ u \circ \varphi) \circ \varphi^{-1}$ l'est aussi.
    remarques:
      - |
        L'erreur la plus répandue est d'étendre ce théorème à la dimension infinie. Sur l'espace des polynômes réels, le maximum des valeurs absolues des coefficients et leur somme sont deux normes, mais le polynôme $1 + X + \cdots + X^k$ vaut $1$ pour la première et $k + 1$ pour la seconde : aucune constante $\beta$ ne convient.
      - |
        Toute la difficulté est concentrée dans la compacité du pavé $[-1, 1]^n$, c'est-à-dire, en dernier ressort, dans la propriété de la borne supérieure. Le théorème tombe si l'on remplace $\mathbb R$ par $\mathbb Q$, ce qui demande d'élargir un instant la définition : appelons norme sur le $\mathbb Q$-espace vectoriel $\mathbb Q^2$ une application qui vérifie les mêmes axiomes, les scalaires étant rationnels.

        L'application $N(a, b) = |a + b\sqrt 2|$ en est une. Elle est homogène et vérifie l'inégalité triangulaire comme la valeur absolue, et elle ne s'annule qu'en $(0, 0)$, puisque $\sqrt 2$ est irrationnel ({{tr-dense|Densité de ℚ}}, (ii)).

        Elle n'est pas équivalente à $\|\cdot\|_\infty$. Par densité de $\mathbb Q$ (même nœud, (i)), il existe des rationnels $r$ aussi proches qu'on veut de $\sqrt 2$, et
        $$N(-r, 1) = |\sqrt 2 - r|$$
        est alors aussi petit qu'on veut, alors que $\|(-r, 1)\|_\infty = \max(|r|, 1)$ reste au moins $1$ : aucune constante $\alpha > 0$ ne vérifie $N \geqslant \alpha\|\cdot\|_\infty$.

  - id: gd-point-fixe
    etiquette: Point fixe
    nature: théorème
    titre: Théorème du point fixe de Banach
    texte: |
      Soit $(X, d)$ un espace métrique. Une application $\varphi : X \to X$ est [[contractante|contractante]] s'il existe $k \in [0, 1[$ tel que $d(\varphi(x), \varphi(y)) \leqslant k\, d(x, y)$ pour tous $x, y \in X$.
    enonce: |
      (i) Soit $X$ un espace métrique [[espace-complet|complet]] non vide et $\varphi : X \to X$ contractante, de rapport $k$. Alors $\varphi$ a un unique point fixe $x^*$. Pour tout $x_0 \in X$, la suite définie par $x_{m+1} = \varphi(x_m)$ converge vers $x^*$, et
      $$d(x_m, x^*) \leqslant \frac{k^m}{1 - k}\,d(x_1, x_0).$$

      (ii) En particulier, si $F$ est une partie fermée non vide de $\lex{n-uplet}{\mathbb R^n}$ muni d'une norme quelconque, toute application contractante $\varphi : F \to F$ a un unique point fixe, avec la même estimation.
    preuve: |
      (i) Par récurrence, $d(x_{m+1}, x_m) \leqslant k^m\,d(x_1, x_0)$. Pour $q > m$, l'inégalité triangulaire et la somme géométrique donnent
      $$\begin{aligned} d(x_q, x_m) &\leqslant \sum_{j=m}^{q-1} k^j\,d(x_1, x_0) \\ &= k^m\frac{1 - k^{q-m}}{1 - k}\,d(x_1, x_0), \end{aligned}$$
      qui est majoré par $\dfrac{k^m}{1 - k}\,d(x_1, x_0)$.

      La suite $(k^m)$ tend vers $0$ : c'est clair si $k = 0$, et sinon $1/k = 1 + s$ avec $s > 0$, et $(1 + s)^m \geqslant 1 + ms$ par récurrence, ce qui tend vers $+\infty$ puisque $\lex{ensemble-reels}{\mathbb R}$ est [[archimedien]]. La suite $(x_m)$ est donc de Cauchy ; elle converge vers un $x^* \in X$, puisque $X$ est complet.

      $\varphi$ est lipschitzienne, donc continue ({{me-topologie|Topologie d'une distance}}, (iv)), et $x_{m+1} = \varphi(x_m)$ tend à la fois vers $x^*$ et vers $\varphi(x^*)$ ({{me-sequentielle|Suites convergentes}}, (i) et (iv)) ; l'unicité de la limite donne $\varphi(x^*) = x^*$.

      Si $y^*$ est un autre point fixe, $d(x^*, y^*) \leqslant k\,d(x^*, y^*)$ impose $x^* = y^*$. L'estimation s'obtient en faisant tendre $q$ vers l'infini dans l'inégalité ci-dessus, la fonction $y \mapsto d(y, x_m)$ étant continue.

      (ii) $\mathbb R^n$ est complet pour toute norme ({{gd-equivalence|Équivalence des normes}}, (ii)), et $F$, fermée, est complète pour la distance induite ({{me-cauchy|Espaces complets}}, (iii)) ; on applique (i) à $X = F$.
    remarques:
      - |
        La démonstration est constructive : elle fournit un algorithme et une majoration de l'erreur. Pour
        $$\varphi(x) = \frac12\Big(x + \frac2x\Big)$$
        sur $F = [1, 2]$, on a $\varphi(x) - 1 = \frac{(x - 1)^2 + 1}{2x} > 0$ et $2 - \varphi(x) = \frac{2 - (x - 2)^2}{2x} > 0$, donc $\varphi(F) \subset F$, et
        $$\varphi(x) - \varphi(y) = \frac12(x - y)\Big(1 - \frac{2}{xy}\Big)$$
        avec $\big|1 - \frac2{xy}\big| \leqslant 1$, donc $k = 1/2$. Le point fixe vérifie $x^2 = 2$.

        Partant de $1$, on obtient $3/2$, $17/12$, $577/408 \approx 1{,}4142157$ : ce sont les approximations de Héron du nœud {{q-irrationnel|√2 est irrationnel}}, et l'erreur décroît bien plus vite que la majoration $2^{-m}$, car $\varphi'(\sqrt 2) = 0$.

        ```schema gd-point-fixe
        Le graphe de $\varphi$ reste dans le carré $[1, 2]^2$, ce qui traduit $\varphi(F) \subset F$, et l'escalier rouge, qui va du graphe à la diagonale, produit $x_0 = 1$, $x_1 = 3/2$ et $x_2 = 17/12$. Le graphe est presque horizontal là où il coupe la diagonale, parce que $\varphi'(\sqrt 2) = 0$ : c'est pourquoi $x_2$ est déjà à moins de $1/400$ du point fixe, dont on ne peut le distinguer à cette échelle.
        ```
      - |
        La complétude est indispensable : la même $\varphi$ sur $F = [1, 2] \cap \lex{ensemble-rationnels}{\mathbb Q}$, qui n'est pas complet ({{me-cauchy|Espaces complets}}), envoie $F$ dans $F$ et reste contractante, mais n'a pas de point fixe, puisque $\sqrt 2$ est irrationnel.
      - |
        Le théorème s'applique aussi dans des espaces de fonctions : c'est par lui que le théorème de Cauchy-Lipschitz obtient la solution d'une équation différentielle comme point fixe d'un opérateur intégral ({{ed-cauchy-lipschitz|Cauchy-Lipschitz}}).

  - id: f-baire
    etiquette: Théorème de Baire
    nature: théorème
    titre: Théorème de Baire
    texte: |
      On rappelle qu'un espace métrique est [[espace-complet|complet]] si toute suite de Cauchy y converge ({{me-cauchy|Espaces complets}}), et qu'une partie est [[partie-dense|dense]] si son adhérence est l'espace entier, c'est-à-dire si elle rencontre tout ouvert non vide ({{tr-dense|Densité de ℚ}}).
    choix: |
      La démonstration construit une suite de boules emboîtées, chacune choisie en fonction de la précédente : c'est le **choix dépendant**. Blair a montré en 1977 que le théorème de Baire pour les espaces métriques complets lui est équivalent.
    enonce: |
      Dans un espace métrique complet $X$, toute intersection d'une suite $(U_n)$ d'ouverts denses est dense. De façon équivalente, une réunion d'une suite de fermés d'intérieurs vides est d'intérieur vide.
    preuve: |
      Soit $V$ un ouvert non vide ; montrons que $V \cap \bigcap_n U_n \neq \varnothing$. Comme $U_0$ est dense, $V \cap U_0$ est un ouvert non vide : il contient une boule $B(x_0, s)$ ({{me-topologie|Topologie d'une distance}}, (i)), donc la boule fermée $\bar B(x_0, r_0)$ pour $r_0 = \min(s/2, 1)$.

      Supposons construite $\bar B(x_n, r_n)$. L'ouvert $B(x_n, r_n) \cap U_{n+1}$ est non vide, par densité, et contient de même une boule fermée $\bar B(x_{n+1}, r_{n+1})$ avec $0 < r_{n+1} \leqslant 2^{-n-1}$.

      Les boules sont emboîtées, donc
      $$d(x_m, x_n) \leqslant r_n \leqslant 2^{-n}$$
      pour $m \geqslant n$ : la suite des centres est de Cauchy, et converge vers un $x$, qui appartient à chaque boule fermée $\bar B(x_n, r_n)$, puisqu'elles sont fermées ({{me-topologie|Topologie d'une distance}}, (i)) et contiennent les $x_m$ pour $m \geqslant n$ ({{me-sequentielle|Suites convergentes}}, (iii)).

      Donc $x \in V \cap \bigcap_n U_n$.

      ```schema f-baire
      Dans le plan, $V$ est un disque et chaque $U_n$ est le complémentaire d'une droite $L_n$. Les boules fermées rouges sont emboîtées, chacune contenue dans la boule ouverte précédente et disjointe de la droite de même indice, avec $r_n \leqslant 2^{-n}$ ; le médaillon agrandit $\bar B(x_2, r_2)$, que $L_3$ traverse sans toucher $\bar B(x_3, r_3)$. La limite des centres appartient à toutes les boules, donc à aucune des droites.
      ```

      La forme équivalente s'obtient par passage aux complémentaires.
    remarques:
      - |
        Le théorème redonne la non-dénombrabilité de $\lex{ensemble-reels}{\mathbb R}$, et plus précisément de $[0, 1]$, qui est complet comme partie fermée de $\mathbb R$ ({{me-cauchy|Espaces complets}}, (iii)) : si $[0, 1] = \{q_0, q_1, \dots\}$, ce serait une réunion dénombrable de singletons, fermés et d'intérieur vide. L'argument diagonal de Cantor ({{r-cantor|Théorème de Cantor}}) établit le même fait par une autre voie.
      - |
        La complétude est indispensable : $\lex{ensemble-rationnels}{\mathbb Q}$ est la réunion dénombrable de ses singletons, qui sont fermés et d'intérieur vide dans $\mathbb Q$.
      - |
        En analyse fonctionnelle, le théorème fonde ceux de Banach-Steinhaus ({{f-banach-steinhaus|Banach-Steinhaus}}) et de l'application ouverte ({{f-application-ouverte|Application ouverte}}).

