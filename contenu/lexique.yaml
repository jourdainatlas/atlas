# Lexique : chaque terme marqué [[id]] ou [[id|texte]] dans les fiches renvoie ici.
# Un même mot peut avoir plusieurs entrées (homonymes) : on les distingue par l'id.
#
# Champ facultatif « exemples » (4 nov. 2026) : liste de deux ou trois textes (blocs « | »), rédigés en phrases
# complètes et commentés, dont au moins un contre-exemple ou cas limite quand c'est pertinent. Ils sont visibles
# dans l'onglet Lexique seulement (pastille « + N exemples » entre la définition et « Défini dans »), jamais dans
# les fiches, et chargés à la demande (site/exemples.json). Matrices et calculs de plus d'une ligne en formule
# centrée, $$…$$, sur leur propre ligne. ORDRE : un exemple n'emploie que des notions définies en amont du nœud
# « defini_dans » du terme (ou en ce nœud) ; construire.py refuse un [[id]] ou un \lex{id}{…} défini ailleurs, et
# signale un renvoi {{nœud|…}} vers un nœud qui n'est pas en amont sauf si sa phrase l'annonce comme une ouverture
# (« Plus loin, … », « montrera »…). Une entrée de pure convention ou notation peut n'en avoir aucun.

- id: ensemble
  terme: ensemble
  defini_dans: zf-langage
  definition: |
    Notion primitive de $\mathsf{ZF}$ : on ne définit pas ce qu'est un ensemble, on énonce les axiomes que vérifie la relation d'appartenance $\in$. Dans $\mathsf{ZF}$, tout objet est un ensemble, y compris les éléments des ensembles.

- id: formule
  terme: formule
  defini_dans: l-formules
  definition: |
    Une formule d'un langage du premier ordre est un mot construit à partir des formules atomiques, $t_1 = t_2$ et $R\, t_1 \cdots t_n$ où les $t_i$ sont des [[terme|termes]], par les règles : si $\varphi$ et $\psi$ sont des formules, alors $\neg\varphi$, $(\varphi \to \psi)$ et $\forall x\, \varphi$ en sont aussi. Dans le langage de $\mathsf{ZF}$, les seules formules atomiques sont $x \in y$ et $x = y$. Une variable est libre dans une formule si elle y a au moins une [[occurrence]] qui n'est dans la [[portee-quantificateur|portée]] d'aucun quantificateur $\forall$ portant sur elle.

- id: couple
  terme: couple
  defini_dans: r-couple
  definition: |
    Le couple de Kuratowski est $(a,b) = \{\{a\},\{a,b\}\}$. Sa seule propriété utile est $(a,b) = (c,d) \Leftrightarrow (a = c \text{ et } b = d)$ ; tout autre codage qui la vérifie conviendrait.

- id: produit-cartesien
  terme: produit cartésien
  defini_dans: r-produit
  definition: |
    $A \times B = \{(a,b) : a \in A,\ b \in B\}$. C'est un ensemble, obtenu par séparation dans $\mathcal P(\mathcal P(A \cup B))$, puisque tout [[couple]] $(a,b)$ est une partie de $\mathcal P(A \cup B)$.

- id: relation
  terme: relation
  defini_dans: r-relation
  definition: |
    Une relation de $A$ vers $B$ est une partie $R$ du [[produit-cartesien]] $A \times B$. On écrit $x \mathrel{R} y$ pour $(x,y) \in R$.

- id: application
  terme: application
  defini_dans: r-application
  definition: |
    Une application $f : A \to B$ est un triplet $(A, B, \Gamma)$ où $\Gamma \subset A \times B$ vérifie : pour tout $a \in A$, il existe un unique $b \in B$ tel que $(a,b) \in \Gamma$. Cet élément est noté $f(a)$.

- id: bijection
  terme: bijection
  defini_dans: r-injections
  definition: |
    Une [[application]] $f : A \to B$ est bijective si tout $b \in B$ admet un unique antécédent. Le nœud {{r-inverses|Réciproque, rétraction}} montrera que cela revient à l'existence d'une application $g : B \to A$ telle que $g \circ f = \mathrm{id}_A$ et $f \circ g = \mathrm{id}_B$.

- id: relation-equivalence
  terme: relation d'équivalence
  defini_dans: r-equivalence
  definition: |
    Une [[relation]] $\sim$ sur $E$ est une relation d'équivalence si elle est [[relation-reflexive|réflexive]] ($x \sim x$), [[relation-symetrique|symétrique]] ($x \sim y \Rightarrow y \sim x$) et [[relation-transitive|transitive]] ($x \sim y$ et $y \sim z$ entraînent $x \sim z$).

- id: ensemble-quotient
  terme: ensemble quotient
  defini_dans: r-equivalence
  definition: |
    Pour une [[relation-equivalence]] $\sim$ sur $E$, la [[classe-equivalence|classe]] de $x$ est $\overline{x} = \{y \in E : y \sim x\}$. Le quotient $E/\!\sim$ est l'ensemble des classes, partie de $\mathcal P(E)$ ; les classes forment une [[partition]] de $E$.

- id: relation-ordre
  terme: relation d'ordre
  defini_dans: od-ordre
  definition: |
    Une [[relation]] $\leqslant$ sur $E$ est une relation d'ordre si elle est [[relation-reflexive|réflexive]], [[relation-antisymetrique|antisymétrique]] ($x \leqslant y$ et $y \leqslant x$ entraînent $x = y$) et [[relation-transitive|transitive]].

- id: ordre-total
  terme: ordre total
  defini_dans: od-ordre
  definition: |
    Une [[relation-ordre]] sur $E$ est totale si deux éléments quelconques sont comparables : pour tous $x, y \in E$, $x \leqslant y$ ou $y \leqslant x$.

- id: majorant
  terme: majorant
  defini_dans: od-majorants
  definition: |
    Soit $A$ une partie d'un ensemble ordonné $E$. Un élément $M \in E$ majore $A$ si $x \leqslant M$ pour tout $x \in A$. La partie $A$ est majorée si elle admet au moins un majorant.

- id: borne-superieure
  terme: borne supérieure
  defini_dans: od-majorants
  definition: |
    La borne supérieure d'une partie $A$, si elle existe, est le plus petit élément de l'ensemble des [[majorant|majorants]] de $A$ ; on la note $\sup A$.

- id: bon-ordre
  terme: bon ordre
  defini_dans: od-bon-ordre
  definition: |
    Une [[relation-ordre|relation d'ordre]] sur $E$ est un bon ordre si toute partie non vide de $E$ admet un plus petit élément ; elle est alors totale. Un bon ordre permet les raisonnements par induction : une partie qui contient $x$ dès qu'elle contient tous les éléments plus petits est $E$ tout entier.

- id: ensemble-transitif
  terme: ensemble transitif
  defini_dans: o-transitif
  definition: |
    Un ensemble $x$ est transitif si tout élément de $x$ est aussi une partie de $x$ : $y \in x \Rightarrow y \subset x$.

- id: ordinal
  terme: ordinal
  defini_dans: o-ordinal
  definition: |
    Un ordinal est un [[ensemble-transitif]] sur lequel la relation $\in$ est un [[bon-ordre]] strict. Chaque ordinal est l'ensemble des ordinaux qui le précèdent, et tout ensemble bien ordonné est isomorphe à un unique ordinal, son type d'ordre.

- id: equipotent
  terme: équipotent
  defini_dans: r-equipotence
  definition: |
    Deux ensembles sont équipotents s'il existe une [[bijection]] de l'un sur l'autre.

- id: cardinal
  terme: cardinal
  defini_dans: o-cardinal
  definition: |
    Un cardinal est un [[ordinal]] qui n'est [[equipotent]] à aucun ordinal strictement plus petit. Le cardinal d'un ensemble $A$ qui peut être bien ordonné, noté $|A|$, est le plus petit ordinal équipotent à $A$ ; c'est un cardinal, et c'est le seul cardinal équipotent à $A$ : un cardinal $\kappa$ vérifie $|\kappa| = \kappa$, puisqu'aucun ordinal plus petit ne lui est équipotent, et, si $\kappa$ est équipotent à $A$, le point (ii) du nœud {{o-cardinal|Cardinaux}} donne $\kappa = |\kappa| = |A|$. Sous l'[[axiome-choix]], tout ensemble peut être bien ordonné (théorème de Zermelo, démontré plus loin), et a donc un cardinal.

- id: denombrable
  terme: dénombrable
  defini_dans: n
  definition: |
    Un ensemble est dénombrable s'il est [[equipotent]] à $\mathbb N$, et au plus dénombrable s'il s'injecte dans $\mathbb N$. Les conventions varient selon les ouvrages ; on suit ici la plus restrictive.

- id: inductif-successeur
  terme: inductif (ensembles)
  defini_dans: zf-infini
  definition: |
    **Premier sens.** Un ensemble $X$ est inductif s'il a un élément qui n'a aucun élément et si, pour tout $x \in X$, l'ensemble dont les éléments sont ceux de $x$ et $x$ lui-même appartient à $X$. Avec les notations des nœuds {{zf-vide|Ensemble vide}} et {{zf-operations|Opérations booléennes}}, comme le dit la remarque du nœud {{zf-infini|Axiome de l'infini}} : $\varnothing \in X$, et $x \in X$ entraîne $x \cup \{x\} \in X$. L'axiome de l'infini affirme qu'il en existe. Le même mot a un second sens, en théorie des ordres.
  voir: [inductif-ordre]

- id: inductif-ordre
  terme: inductif (ordres)
  defini_dans: od-chaines
  definition: |
    **Second sens.** Un ensemble ordonné est inductif si toute [[chaine]] admet un [[majorant]]. C'est l'hypothèse du lemme de Zorn. Le même mot a un premier sens, en théorie des ensembles.
  voir: [inductif-successeur]

- id: chaine
  terme: chaîne
  defini_dans: od-chaines
  definition: |
    Une partie d'un [[ensemble-ordonne|ensemble ordonné]] sur laquelle l'[[ordre-induit|ordre induit]] est [[ordre-total|total]].
  voir: [chaine-markov]

- id: matrice-transition
  terme: matrice de transition
  defini_dans: mk-transition
  definition: |
    Sur un ensemble $I$ fini ou [[denombrable]] d'états, une famille $(Q(x, y))_{x, y \in I}$ de réels positifs dont chaque ligne est de somme $1$ : $Q(x, \cdot)$ est la loi du pas suivant depuis l'état $x$. Ses puissances, définies par $Q^{n+1}(x, z) = \sum_y Q^n(x, y)Q(y, z)$, donnent les probabilités de passage en $n$ pas ; une mesure $\lambda$ sur $I$ se transforme en $\lambda Q$.

- id: chaine-markov
  terme: chaîne de Markov
  defini_dans: mk-chaines
  definition: |
    Une suite $(X_n)$ de variables à valeurs dans un ensemble $I$ fini ou [[denombrable]] est une chaîne de Markov de loi initiale $\mu$ et de [[matrice-transition|matrice de transition]] $Q$, ou chaîne $(\mu, Q)$, si $P(X_0 = x_0, \dots, X_n = x_n) = \mu(x_0)Q(x_0, x_1)\cdots Q(x_{n-1}, x_n)$ pour tous $n$ et $x_0, \dots, x_n$. Sachant le présent $X_n$, l'avenir de la suite ne dépend pas de son passé, et la loi de $X_n$ est $\mu Q^n$.
  voir: [chaine]

- id: chaine-irreductible
  terme: irréductible (chaîne de Markov)
  defini_dans: mk-classes
  definition: |
    Une [[matrice-transition|matrice de transition]] $Q$, ou une [[chaine-markov|chaîne de Markov]] de matrice $Q$, est irréductible si deux états quelconques communiquent : pour tous $x$ et $y$, il existe $n$ tel que $Q^n(x, y) > 0$.

- id: periode-etat
  terme: période (d'un état)
  defini_dans: mk-classes
  definition: |
    Pour une [[matrice-transition|matrice de transition]] $Q$, la période d'un état $x$ est le plus grand commun diviseur des entiers $n \geqslant 1$ tels que $Q^n(x, x) > 0$, lorsque cet ensemble est non vide. Deux états qui communiquent ont la même période ; l'état est [[etat-aperiodique|apériodique]] si elle vaut $1$. La marche sur un cycle à $m$ états est de période $2$ si $m$ est pair, apériodique si $m$ est impair.

- id: etat-recurrent
  terme: état récurrent
  defini_dans: mk-recurrence
  definition: |
    Un état $x$ d'une [[chaine-markov|chaîne de Markov]] est récurrent si une chaîne [[chaine-issue|issue de]] $x$ y revient presque sûrement ; elle y revient alors une infinité de fois. C'est le cas si et seulement si $\sum_n Q^n(x, x) = +\infty$. Le théorème de Pólya ({{mk-polya|Théorème de Pólya}}) montrera que la marche aléatoire simple est récurrente sur $\mathbb Z$ et $\mathbb Z^2$, transiente sur $\mathbb Z^3$.
  voir: [etat-transient, recurrent-positif]

- id: etat-transient
  terme: état transient
  defini_dans: mk-recurrence
  definition: |
    Un état d'une [[chaine-markov|chaîne de Markov]] qui n'est pas [[etat-recurrent|récurrent]] : une chaîne qui en est issue a une probabilité non nulle de n'y jamais revenir, et n'y passe presque sûrement qu'un nombre fini de fois.

- id: mesure-invariante
  terme: mesure invariante
  defini_dans: mk-invariante
  definition: |
    Pour une [[matrice-transition|matrice de transition]] $Q$ sur $I$, une mesure $\lambda$ sur $I$ telle que $\lambda Q = \lambda$. Une [[probabilite-invariante|probabilité invariante]] $\pi$ est une loi d'équilibre : si $X_0$ suit $\pi$, chaque $X_n$ suit $\pi$. Pour une chaîne irréductible récurrente, il existe une mesure invariante non nulle à valeurs finies, unique à un facteur près parmi celles-ci (la mesure identiquement égale à $+\infty$ est toujours invariante).

- id: recurrent-positif
  terme: récurrent positif
  defini_dans: mk-recurrence-positive
  definition: |
    Un état $x$ est récurrent positif si l'espérance de son [[temps-retour|temps de retour]], partant de $x$, est finie. Une chaîne irréductible a tous ses états récurrents positifs si et seulement si elle a une [[probabilite-invariante|probabilité invariante]] $\pi$, et alors $\pi(x) = 1/E_x[T_x]$. La marche simple sur $\mathbb Z$ donne un état récurrent qui n'est pas récurrent positif : elle est récurrente par le théorème de Pólya ({{mk-polya|Théorème de Pólya}}), mais n'a pas de probabilité invariante.

- id: axiome-choix
  terme: axiome du choix
  defini_dans: zf-choix
  definition: |
    Pour tout ensemble $\mathcal F$ d'ensembles non vides et deux à deux disjoints, il existe un ensemble qui rencontre chaque élément de $\mathcal F$ en exactement un point (forme de Zermelo). Une fois les applications définies, il équivaut à l'existence, pour toute famille d'ensembles non vides, d'une fonction qui choisit un élément dans chacun ; dans $\mathsf{ZF}$, il équivaut aussi au lemme de Zorn et au théorème de Zermelo.
  voir: [application]

- id: choix-denombrable
  terme: choix dénombrable
  defini_dans: n
  definition: |
    L'axiome $\mathsf{AC}_\omega$ est l'[[axiome-choix]] restreint aux familles indexées par $\mathbb N$. Il n'est pas démontrable dans $\mathsf{ZF}$, il est strictement plus faible que $\mathsf{AC}$, et il suffit pour l'essentiel de l'analyse.
  voir: [choix-dependant]

- id: choix-dependant
  terme: choix dépendant
  notation: '$\mathsf{DC}$'
  defini_dans: n
  definition: |
    L'axiome $\mathsf{DC}$ : si $R$ est une [[relation]] sur un ensemble non vide $E$ telle que tout $x \in E$ admette un $y \in E$ avec $x \mathrel R y$, il existe une [[suite]] $(x_n)$ d'éléments de $E$ telle que $x_n \mathrel R x_{n+1}$ pour tout $n$. C'est la forme du choix qui construit une suite dont chaque terme est choisi en fonction du précédent. Il n'est pas démontrable dans $\mathsf{ZF}$ ; il entraîne le [[choix-denombrable]] sans lui être équivalent (T. Jech, *The Axiom of Choice*, North-Holland, 1973, p. 130-131), et il est strictement plus faible que l'[[axiome-choix]] : dans le modèle de Solovay (1970), il est vrai et toute partie de $\mathbb R$ est mesurable au sens de Lebesgue. Le théorème de Baire pour les espaces métriques complets lui est équivalent (Blair, 1977).
  voir: [choix-denombrable]

- id: groupe
  terme: groupe
  defini_dans: a-groupe
  definition: |
    Un ensemble $G$ muni d'une loi [[loi-associative|associative]], possédant un élément neutre $e$, et dans lequel tout $x$ admet un symétrique $x'$ tel que $xx' = x'x = e$. Le groupe est abélien si la loi est [[loi-commutative|commutative]].

- id: anneau
  terme: anneau
  defini_dans: a-anneau
  definition: |
    Un ensemble $A$ muni de deux lois $+$ et $\times$ telles que $(A, +)$ soit un [[groupe]] abélien, que $\times$ soit [[loi-associative|associative]] et possède un neutre $1$, et que $\times$ soit distributive sur $+$. L'anneau est commutatif si $\times$ l'est.

- id: corps
  terme: corps
  defini_dans: a-corps
  definition: |
    Un [[anneau]] commutatif dans lequel $1 \neq 0$ et où tout élément non nul est inversible pour $\times$. Une ancienne tradition française appelait corps tout anneau à division, commutatif ou non ; on suit ici l'usage actuel.

- id: corps-ordonne
  terme: corps ordonné
  defini_dans: q-ordre
  definition: |
    Un [[corps]] $K$ muni d'un [[ordre-total]] compatible avec ses lois : $x \leqslant y$ entraîne $x + z \leqslant y + z$, et $0 \leqslant x$, $0 \leqslant y$ entraînent $0 \leqslant xy$. Dans un corps ordonné, tout carré est positif.

- id: archimedien
  terme: archimédien
  defini_dans: q-archimede
  definition: |
    Un [[corps-ordonne]] est archimédien si pour tous $x > 0$ et $y$, il existe $n \in \mathbb N$ tel que $nx > y$.

- id: espace-topologique
  terme: espace topologique
  defini_dans: t-espace
  definition: |
    Un couple $(X, \mathcal T)$ où $\mathcal T$ est une [[topologie]] sur $X$ : $\mathcal T \subset \mathcal P(X)$ contient $\varnothing$ et $X$, et est stable par réunion quelconque et par intersection finie. Les éléments de $\mathcal T$ sont les [[ouvert|ouverts]].

- id: ouvert
  terme: ouvert
  defini_dans: t-espace
  definition: |
    Élément de la [[topologie|topologie]] $\mathcal T$ d'un [[espace-topologique]] $(X, \mathcal T)$.
  voir: [espace-metrique]

- id: ferme
  terme: fermé
  defini_dans: t-espace
  definition: |
    Une partie d'un [[espace-topologique]] dont le complémentaire est [[ouvert]]. Les fermés sont stables par intersection quelconque et par réunion finie.

- id: voisinage
  terme: voisinage
  defini_dans: t-voisinages
  definition: |
    Une partie $V$ est un voisinage du point $x$ si elle contient un [[ouvert]] contenant $x$.

- id: separe
  terme: séparé
  defini_dans: t-separe
  definition: |
    Un [[espace-topologique]] est séparé, au sens de Hausdorff, si deux points distincts admettent des [[voisinage|voisinages]] disjoints.
  voir: [espace-metrique]

- id: compact
  terme: compact
  defini_dans: t-compact
  definition: |
    Un [[espace-topologique]] est compact s'il est [[separe]] et si de tout recouvrement par des [[ouvert|ouverts]] on peut extraire un sous-recouvrement fini. La convention française inclut la séparation, contrairement à la convention anglo-saxonne.

- id: connexe
  terme: connexe
  defini_dans: t-connexe
  definition: |
    Un [[espace-topologique]] est connexe s'il n'est pas réunion de deux [[ouvert|ouverts]] disjoints non vides.
  voir: [intervalle]

- id: espace-metrique
  terme: espace métrique
  defini_dans: ar-corps
  definition: |
    Un ensemble $X$ muni d'une distance, c'est-à-dire d'une application $d : X \times X \to [0, +\infty[$ telle que $d(x,y) = 0 \Leftrightarrow x = y$, $d(x,y) = d(y,x)$ et $d(x,z) \leqslant d(x,y) + d(y,z)$. Sur $\mathbb R$, on prend $d(x,y) = |x - y|$.

- id: suite
  terme: suite
  defini_dans: n
  definition: |
    Une suite d'éléments de $E$ est une [[application]] $u : \mathbb N \to E$, notée $(u_n)_{n \in \mathbb N}$.

- id: limite-suite
  terme: limite d'une suite
  defini_dans: su-convergence
  definition: |
    Dans un [[espace-metrique]], la [[suite]] $(u_n)$ converge vers $\ell$ si
    $$\forall \varepsilon > 0,\ \exists N \in \mathbb N,\ \forall n \geqslant N,\quad d(u_n, \ell) < \varepsilon.$$
    La limite, si elle existe, est unique.

- id: limite-infinie
  terme: limite infinie
  defini_dans: su-infinies
  definition: |
    La [[suite]] réelle $(u_n)$ tend vers $+\infty$ si $\forall A \in \mathbb R,\ \exists N \in \mathbb N,\ \forall n \geqslant N,\ u_n > A$, et vers $-\infty$ si $(-u_n)$ tend vers $+\infty$. Une telle suite n'est pas bornée, donc diverge ; la réciproque est fausse, comme le montre $((-2)^n)$.

- id: suites-adjacentes
  terme: suites adjacentes
  defini_dans: su-adjacentes
  definition: |
    Deux [[suite|suites]] réelles $(u_n)$ et $(v_n)$ sont adjacentes si $(u_n)$ est croissante, $(v_n)$ décroissante, et $v_n - u_n \to 0$. Elles convergent alors vers une même limite $\ell$, et $u_n \leqslant \ell \leqslant v_n$ pour tout $n$.

- id: suite-extraite
  terme: suite extraite
  defini_dans: su-extraites
  definition: |
    Une suite extraite de $(u_n)$ est une suite $(u_{\varphi(n)})$, où $\varphi : \mathbb N \to \mathbb N$ est strictement croissante. On a alors $\varphi(n) \geqslant n$ pour tout $n$, par récurrence.

- id: suite-cauchy
  terme: suite de Cauchy
  defini_dans: r
  definition: |
    Une [[suite]] $(u_n)$ d'éléments d'un [[corps-ordonne|corps totalement ordonné]], comme $\mathbb Q$ ou $\mathbb R$, est de Cauchy si $\forall \varepsilon > 0,\ \exists N,\ \forall p, q \geqslant N,\ |u_p - u_q| < \varepsilon$. Le nœud {{me-cauchy|Espaces complets}} étendra la définition aux espaces métriques, avec $d(u_p, u_q)$ au lieu de $|u_p - u_q|$ ; il montrera que toute suite convergente est de Cauchy, et appellera complet un espace où la réciproque est vraie.
  voir: [espace-complet]

- id: espace-complet
  terme: espace complet
  defini_dans: me-cauchy
  definition: |
    Un [[espace-metrique]] dans lequel toute [[suite-cauchy|suite de Cauchy]] converge. $\mathbb R$ et $\mathbb R^n$ sont complets, $\mathbb Q$ ne l'est pas ; une partie fermée d'un espace complet est complète pour la distance [[distance-induite|induite]]. La complétude n'est pas une [[propriete-topologique|propriété topologique]] : $]{-1}, 1[$, [[espaces-homeomorphes|homéomorphe]] à $\mathbb R$, n'est pas complet.

- id: intervalle
  terme: intervalle
  defini_dans: od-intervalles
  definition: |
    Dans un ensemble muni d'un [[ordre-total]], une partie $I$ est un intervalle si, pour tous $x \leqslant y$ dans $I$, tout $z$ tel que $x \leqslant z \leqslant y$ appartient à $I$.
  voir: [connexe]

- id: segment
  terme: segment
  defini_dans: od-intervalles
  definition: |
    Dans un ensemble muni d'un [[ordre-total]], le segment d'extrémités $a \leqslant b$ est $[a,b] = \{x : a \leqslant x \leqslant b\}$. C'est un [[intervalle]].
  voir: [compact]

- id: continuite
  terme: continuité
  defini_dans: t-continue
  definition: |
    Une [[application]] $f : X \to Y$ entre [[espace-topologique|espaces topologiques]] est continue si l'image réciproque de tout [[ouvert]] de $Y$ est un ouvert de $X$.
  voir: [continuite-point]

- id: continuite-point
  terme: continuité en un point
  defini_dans: c-point
  definition: |
    Une application $f : X \to Y$ entre [[espace-metrique|espaces métriques]] est continue en $a$ si
    $$\forall \varepsilon > 0,\ \exists \delta > 0,\ \forall x \in X,\quad d(x,a) < \delta \Rightarrow d(f(x), f(a)) < \varepsilon.$$

- id: continuite-uniforme
  terme: continuité uniforme
  defini_dans: c-uniforme
  definition: |
    L'application $f$ est uniformément continue si $\forall \varepsilon > 0,\ \exists \delta > 0,\ \forall x, y,\ d(x,y) < \delta \Rightarrow d(f(x), f(y)) < \varepsilon$ : le même $\delta$ convient en tout point.

- id: homeomorphisme
  terme: homéomorphisme
  defini_dans: t-homeo
  definition: |
    Une [[bijection]] continue dont la réciproque est continue. Deux espaces sont [[espaces-homeomorphes|homéomorphes]] s'il existe un homéomorphisme de l'un sur l'autre.

- id: derivable
  terme: dérivable
  defini_dans: de-derivee
  definition: |
    Une fonction $f : I \to \mathbb R$, définie sur un intervalle non réduit à un point, est dérivable en $a \in I$ si le taux d'accroissement $\dfrac{f(x) - f(a)}{x - a}$ admet une [[limite-fonction|limite]] finie quand $x$ tend vers $a$ dans $I \setminus \{a\}$. Cette limite, le nombre dérivé de $f$ en $a$, est notée $f'(a)$. La fonction est dérivable sur $I$ si elle l'est en tout point de $I$, et $f' : x \mapsto f'(x)$ est alors sa dérivée.

- id: limite-fonction
  terme: limite d'une fonction
  defini_dans: de-limite
  definition: |
    Soit $D \subset \mathbb R$ et $a$ un réel adhérent à $D$, c'est-à-dire tel que tout intervalle $]a - \delta, a + \delta[$ rencontre $D$. Une fonction $g : D \to \mathbb R$ admet la limite $\ell$ en $a$ si $\forall \varepsilon > 0,\ \exists \delta > 0,\ \forall x \in D,\ |x - a| < \delta \Rightarrow |g(x) - \ell| < \varepsilon$. Cette limite, si elle existe, est unique.

- id: extremum-local
  terme: extremum local
  defini_dans: de-extremum
  definition: |
    Une fonction $f : I \to \mathbb R$ admet un maximum local en $a$ s'il existe $r > 0$ tel que $f(x) \leqslant f(a)$ pour tout $x \in I$ vérifiant $|x - a| < r$ ; un minimum local, si $f(x) \geqslant f(a)$ pour ces $x$. Un extremum local est l'un ou l'autre. En un point qui n'est pas une extrémité de $I$, la dérivée, si elle existe, y est nulle.

- id: derivee-successive
  terme: dérivées successives
  defini_dans: de-taylor
  definition: |
    Les dérivées successives de $f : I \to \mathbb R$ sont définies par $f^{(0)} = f$ et $f^{(n+1)} = \big(f^{(n)}\big)'$ lorsque $f^{(n)}$ est [[derivable]] sur $I$. La fonction est $n$ fois dérivable si $f^{(n)}$ existe, et de classe $C^n$ si de plus $f^{(n)}$ est continue.

- id: arc-tangente
  terme: arc tangente
  notation: $\arctan$
  defini_dans: tg-arctan
  definition: |
    La fonction $\arctan x = \int_0^x \frac{dt}{1 + t^2}$, définie sur $\mathbb R$. Elle est [[derivable]], de dérivée $\frac{1}{1 + x^2}$, impaire et strictement croissante, et bornée ; le double de sa borne supérieure est le nombre $\pi$, et $\arctan x$ tend vers $\frac\pi2$ en $+\infty$. C'est une [[bijection]] de $\mathbb R$ sur $]{-\frac\pi2}, \frac\pi2[$.
  voir: [fonction-tangente]

- id: fonction-tangente
  terme: tangente (fonction)
  notation: $\tan$
  defini_dans: tg-tangente
  definition: |
    La [[bijection]] réciproque $\tan : \,]{-\frac\pi2}, \frac\pi2[ \,\to \mathbb R$ de l'[[arc-tangente|arc tangente]]. Elle est impaire, strictement croissante, dérivable, et $\tan' = 1 + \tan^2$ ; elle tend vers $+\infty$ en $\frac\pi2$ et vers $-\infty$ en $-\frac\pi2$.
  voir: [cosinus-sinus]

- id: cosinus-sinus
  terme: cosinus et sinus
  notation: $\cos, \sin$
  defini_dans: tg-prolongement
  definition: |
    Les fonctions de $\mathbb R$ dans $\mathbb R$ égales, sur $]{-\frac\pi2}, \frac\pi2[$, à $\cos = \frac{1}{\sqrt{1 + \tan^2}}$ et $\sin = \tan \cdot \cos$, prolongées par continuité en $\pm\frac\pi2$ puis à $\mathbb R$ par $f(x + \pi) = -f(x)$. Elles sont [[derivable|dérivables]], $\cos' = -\sin$, $\sin' = \cos$, $\cos^2 + \sin^2 = 1$. Elles sont périodiques de période $2\pi$, puisque $f(x + 2\pi) = -f(x + \pi) = f(x)$. Le nœud {{tg-addition|Formules d'addition}} montrera que ce sont les seules fonctions dérivables qui vérifient ces deux relations de dérivation avec $\cos 0 = 1$ et $\sin 0 = 0$, et le nœud {{tg-cercle|Paramétrage du cercle}} que $2\pi$ est leur plus petite période.
  voir: [fonction-tangente]

- id: fonction-periodique
  terme: fonction périodique
  defini_dans: tg-addition
  definition: |
    Une fonction $f : \mathbb R \to \mathbb R$ est périodique de période $T > 0$ si $f(x + T) = f(x)$ pour tout réel $x$. Le cosinus et le sinus le sont, de période $2\pi$ ; le nœud {{tg-cercle|Paramétrage du cercle}} montrera que leurs périodes sont exactement les multiples entiers strictement positifs de $2\pi$.

- id: nombre-e
  terme: nombre e
  notation: $e$
  defini_dans: ex-exponentielle
  definition: |
    Le réel $e = \exp 1$, unique réel strictement positif dont le logarithme $\int_1^e \frac{dt}{t}$ vaut $1$. Le nœud {{ex-serie|Série de l'exponentielle}} montrera qu'il est la limite des sommes $\sum_{k \leqslant n} \frac{1}{k!}$ et de $(1 + 1/n)^n$, et qu'il vaut $2{,}7182818\ldots$ ; pour tout réel $a$, $e^a = \exp a$.

- id: fonction-convexe
  terme: fonction convexe
  defini_dans: ex-convexite
  definition: |
    Une fonction $f : I \to \mathbb R$, sur un [[intervalle]] $I$, est convexe si $f\big((1 - s)a + sb\big) \leqslant (1 - s)f(a) + sf(b)$ pour tous $a, b \in I$ et $s \in [0, 1]$ : son graphe est sous chacune de ses cordes. C'est le cas si $f$ est dérivable de dérivée croissante, par exemple pour l'exponentielle.

- id: subdivision
  terme: subdivision
  defini_dans: ri-subdivision
  definition: |
    Une subdivision de $[a,b]$ est une partie finie de $[a, b]$ contenant $a$ et $b$, numérotée $a = x_0 < x_1 < \dots < x_n = b$. Son pas est $\max_i (x_{i+1} - x_i)$. Elle est [[subdivision-plus-fine|plus fine]] qu'une autre si elle la contient ; deux subdivisions ont pour [[raffinement-commun|raffinement commun]] leur réunion.

- id: fonction-escalier
  terme: fonction en escalier
  defini_dans: ri-escalier
  definition: |
    Une fonction $\varphi : [a,b] \to \mathbb R$ est en escalier s'il existe une [[subdivision]] $(x_i)$ telle que $\varphi$ soit constante, égale à $c_i$, sur chaque $]x_i, x_{i+1}[$. Son intégrale est $\sum_i c_i (x_{i+1} - x_i)$, indépendante de la subdivision [[subdivision-adaptee|adaptée]] choisie.

- id: riemann-integrable
  terme: intégrable au sens de Riemann
  defini_dans: ri-integrable
  definition: |
    Une fonction bornée $f : [a,b] \to \mathbb R$ est intégrable au sens de Riemann si la borne supérieure des $\int \varphi$, pour $\varphi \leqslant f$ [[fonction-escalier|en escalier]], est égale à la borne inférieure des $\int \psi$, pour $\psi \geqslant f$ en escalier ; cette valeur commune est son intégrale. Cela équivaut à : pour tout $\varepsilon > 0$, il existe des fonctions en escalier $\varphi \leqslant f \leqslant \psi$ telles que $\int (\psi - \varphi) < \varepsilon$.

- id: somme-riemann
  terme: somme de Riemann
  defini_dans: ri-sommes
  definition: |
    Pour $f : [a, b] \to \mathbb R$, une [[subdivision]] $(x_i)$ de $[a, b]$ et des points $\xi_i \in [x_i, x_{i+1}]$, le réel $\sum_i f(\xi_i)(x_{i+1} - x_i)$. Pour $f$ [[riemann-integrable|intégrable]], il tend vers $\int_a^b f$ quand le pas de la subdivision tend vers $0$.

- id: interieur
  terme: intérieur
  defini_dans: t-adherence
  definition: |
    L'intérieur $\mathring A$ d'une partie $A$ d'un [[espace-topologique]] est la réunion des [[ouvert|ouverts]] inclus dans $A$ : c'est le plus grand ouvert inclus dans $A$.

- id: adherence
  terme: adhérence
  defini_dans: t-adherence
  definition: |
    L'adhérence $\overline A$ d'une partie $A$ est l'intersection des [[ferme|fermés]] contenant $A$ : c'est le plus petit fermé contenant $A$. Un point est adhérent à $A$ si et seulement si tout [[voisinage]] de ce point rencontre $A$.

- id: base-topologie
  terme: base d'une topologie
  defini_dans: t-base
  definition: |
    Une partie $\mathcal B$ d'une [[topologie|topologie]] $\mathcal T$ telle que tout [[ouvert]] soit réunion d'éléments de $\mathcal B$.

- id: topologie-discrete
  terme: topologie discrète
  defini_dans: t-espace
  definition: |
    La [[topologie|topologie]] $\mathcal P(X)$, pour laquelle toute partie de $X$ est [[ouvert|ouverte]]. Toute application définie sur un espace discret est continue.

- id: topologie-induite
  terme: topologie induite
  defini_dans: t-induite
  definition: |
    Sur une partie $A$ d'un [[espace-topologique]] $X$, la [[topologie|topologie]] dont les ouverts sont les $O \cap A$, pour $O$ ouvert dans $X$. C'est la moins fine qui rend continue l'inclusion de $A$ dans $X$.

- id: topologie-produit
  terme: topologie produit
  defini_dans: t-produit
  definition: |
    Sur $\prod_i X_i$, la [[topologie|topologie]] dont une [[base-topologie|base]] est formée des produits $\prod_i U_i$ d'ouverts, avec $U_i = X_i$ sauf pour un nombre fini d'indices. C'est la moins fine qui rend continues toutes les projections.

- id: topologie-quotient
  terme: topologie quotient
  defini_dans: t-quotient
  definition: |
    Sur un [[ensemble-quotient]] $X/\!\sim$, la [[topologie|topologie]] dont les ouverts sont les parties $V$ telles que $\pi^{-1}(V)$ soit ouvert dans $X$. C'est la plus fine qui rend continue la projection $\pi$.

- id: recouvrement
  terme: recouvrement
  defini_dans: t-compact
  definition: |
    Un recouvrement d'une partie $A$ est une famille d'ensembles dont la réunion contient $A$. Il est ouvert si ses éléments sont des [[ouvert|ouverts]] ; un sous-recouvrement est une sous-famille qui recouvre encore $A$.
  voir: [nombre-lebesgue]

- id: nombre-lebesgue
  terme: nombre de Lebesgue
  defini_dans: me-lebesgue
  definition: |
    Pour un [[recouvrement]] ouvert d'un [[espace-metrique]], un réel $\eta > 0$ tel que toute partie non vide de diamètre $< \eta$ soit contenue dans un élément du recouvrement. Tout recouvrement ouvert d'un espace métrique [[compact]] non vide en admet un, ce qui se démontre sans axiome du choix.

- id: partie-precompacte
  terme: partie précompacte
  defini_dans: me-precompacts
  definition: |
    Une partie d'un [[espace-metrique]] qui, pour tout $\varepsilon > 0$, est contenue dans une réunion finie de boules de rayon $\varepsilon$. Une partie compacte l'est ; dans un [[espace-complet|espace complet]], une partie fermée précompacte est [[compact|compacte]], sans axiome du choix lorsque les réseaux sont donnés pour chaque rayon $2^{-k}$, avec le [[choix-denombrable]] sinon.

- id: filtre
  terme: filtre
  defini_dans: o-ultrafiltre
  definition: |
    Un filtre sur un ensemble $X$ est une partie $\mathcal F \subset \mathcal P(X)$ qui contient $X$ mais pas $\varnothing$, qui contient l'intersection de deux quelconques de ses éléments, et qui contient toute partie de $X$ contenant l'un de ses éléments.
  voir: [ultrafiltre, filtre-convergent]

- id: ultrafiltre
  terme: ultrafiltre
  defini_dans: o-ultrafiltre
  definition: |
    Un [[filtre]] maximal pour l'inclusion. De manière équivalente, pour toute partie $A \subset X$, il contient $A$ ou son complémentaire. Le lemme de l'ultrafiltre, strictement plus faible que l'[[axiome-choix]], affirme que tout filtre est contenu dans un ultrafiltre.

- id: filtre-convergent
  terme: filtre convergent
  defini_dans: tr-ultrafiltres
  definition: |
    Dans un [[espace-topologique]] $X$, un [[filtre]] $\mathcal F$ sur $X$ converge vers $x$, qui en est une limite, si tout [[voisinage]] de $x$ appartient à $\mathcal F$. Dans un espace [[separe]], un filtre a au plus une limite.

- id: signature
  terme: signature
  defini_dans: l-langage
  definition: |
    La liste des symboles propres à un langage du premier ordre : constantes, symboles de fonctions et symboles de relations, chacun avec son arité. Exemple : $\{0, S, +, \times\}$ pour l'arithmétique.

- id: terme
  terme: terme
  defini_dans: l-termes
  definition: |
    Expression d'un langage du premier ordre qui désigne un élément : une variable, une constante, ou $f\, t_1 \cdots t_n$ pour un symbole de fonction $f$ d'arité $n$ appliqué à des termes. Exemple : $x + S(0)$ en arithmétique.

- id: enonce
  terme: énoncé
  defini_dans: l-formules
  definition: |
    Une [[formule]] sans variable libre, aussi appelée formule close.
  voir: [structure]

- id: structure
  terme: structure
  defini_dans: l-structure
  definition: |
    Pour une [[signature]] donnée : un ensemble non vide, le domaine, muni d'une interprétation de chaque symbole, c'est-à-dire d'un élément pour chaque constante, d'une application pour chaque symbole de fonction et d'une relation pour chaque symbole de relation.

- id: modele
  terme: modèle
  defini_dans: l-consequence
  definition: |
    Un modèle d'une [[theorie]] $T$ est une [[structure]] dans laquelle tous les énoncés de $T$ sont vrais. Exemple : tout groupe est un modèle de la théorie des groupes.

- id: theorie
  terme: théorie
  defini_dans: l-formules
  definition: |
    Un ensemble d'[[enonce|énoncés]] d'un langage du premier ordre, appelés ses axiomes.

- id: theorie-coherente
  terme: théorie cohérente
  defini_dans: l-coherence
  definition: |
    Une [[theorie]] qui ne démontre aucune formule en même temps que sa négation ; de façon équivalente, qui ne démontre pas toutes les formules.
  voir: [modele]

- id: terme-clos
  terme: terme clos
  defini_dans: hk-generalisation
  definition: |
    Un [[terme]] qui ne contient aucune variable, comme $S\,S\,0$ dans le langage de l'arithmétique. Sa valeur dans une [[structure]] ne dépend pas de la [[valuation-structure|valuation]], et il est substituable à toute variable dans toute formule.

- id: propriete-temoins
  terme: propriété des témoins
  defini_dans: hk-temoins
  definition: |
    Une [[theorie]] $T$ a la propriété des témoins si, pour tout [[enonce|énoncé]] $\exists x\, \varphi$ de son langage, il existe un symbole de constante $c$ tel que $T$ démontre $\exists x\, \varphi \to \varphi[c/x]$ : la constante $c$ est un témoin de l'énoncé. C'est la propriété qu'assurent les constantes ajoutées par Henkin.

- id: theorie-complete
  terme: théorie complète
  defini_dans: hk-lindenbaum
  definition: |
    Une [[theorie]] qui démontre, pour tout [[enonce|énoncé]] $\sigma$ de son langage, $\sigma$ ou sa négation. Par le lemme de Lindenbaum, toute [[theorie-coherente|théorie cohérente]] est contenue dans une théorie cohérente et complète.

- id: consequence-semantique
  terme: conséquence sémantique
  defini_dans: l-consequence
  definition: |
    Un énoncé $\varphi$ est conséquence sémantique d'une [[theorie]] $T$, noté $T \models \varphi$, s'il est vrai dans tout [[modele]] de $T$.

- id: demonstration-formelle
  terme: démonstration formelle
  defini_dans: l-deduction
  definition: |
    Une suite finie de [[formule|formules]], dont chacune est un axiome logique, un axiome de la [[theorie]], ou se déduit de formules précédentes par une règle d'inférence. On note $T \vdash \varphi$ lorsque $\varphi$ termine une telle suite.

- id: connecteur
  terme: connecteur
  defini_dans: l-connecteurs
  definition: |
    Symbole qui forme une formule à partir d'autres formules, et dont le sens est donné par une [[table-verite|table de vérité]] : la négation $\neg$ et l'implication $\to$ sont primitives ; la conjonction $\wedge$, la disjonction $\vee$ et l'équivalence $\leftrightarrow$ en sont des abréviations.

- id: quantificateur
  terme: quantificateur
  defini_dans: l-quantificateurs
  definition: |
    Le mot $\forall x$, placé devant une formule, est le quantificateur universel portant sur la variable $x$ ; le [[quantificateur-existentiel|quantificateur existentiel]] $\exists x$ abrège $\neg \forall x\, \neg$. Au premier ordre, les variables quantifiées parcourent les éléments du domaine, jamais ses parties.

- id: tautologie
  terme: tautologie
  defini_dans: l-tautologies
  definition: |
    Une [[formule-propositionnelle|formule propositionnelle]] qui prend la valeur $1$ pour toute [[valuation-booleenne|valuation booléenne]] de ses lettres, c'est-à-dire sur chaque ligne de sa [[table-verite|table de vérité]]. Exemple : $P \to (Q \to P)$.

- id: restriction
  terme: restriction
  defini_dans: r-application
  definition: |
    Pour une [[application]] $f : A \to B$ et $X \subset A$, la restriction $f|_X : X \to B$ est l'application qui coïncide avec $f$ sur $X$ ; son graphe est celui de $f$ intersecté avec $X \times B$. On dit aussi que $f$ prolonge $f|_X$.

- id: image-directe
  terme: image directe
  defini_dans: r-images
  definition: |
    Pour $f : A \to B$ et $X \subset A$, $f(X) = \{f(a) : a \in X\}$. Elle commute aux réunions, mais pas aux intersections : on a seulement $f(X \cap X') \subset f(X) \cap f(X')$.

- id: image-reciproque
  terme: image réciproque
  defini_dans: r-images
  definition: |
    Pour $f : A \to B$ et $Y \subset B$, $f^{-1}(Y) = \{a \in A : f(a) \in Y\}$. Elle est définie pour toute [[application]], inversible ou non, et commute aux réunions, aux intersections et au passage au complémentaire.

- id: composee
  terme: composée
  defini_dans: r-composition
  definition: |
    Pour $f : A \to B$ et $g : B \to C$, la composée $g \circ f : A \to C$ est l'[[application]] $a \mapsto g(f(a))$. La composition est associative, mais pas commutative.

- id: injection
  terme: injection
  defini_dans: r-injections
  definition: |
    Une [[application]] $f : A \to B$ est injective si deux éléments distincts ont des images distinctes : $f(a) = f(a')$ entraîne $a = a'$.

- id: surjection
  terme: surjection
  defini_dans: r-injections
  definition: |
    Une [[application]] $f : A \to B$ est surjective si tout élément de $B$ a au moins un antécédent, c'est-à-dire si $f(A) = B$. Que toute surjection admette une section équivaut à l'[[axiome-choix]].

- id: famille
  terme: famille
  defini_dans: r-familles
  definition: |
    Une famille $(x_i)_{i \in I}$ d'éléments de $X$ est une [[application]] $x : I \to X$, notée par ses valeurs $x_i = x(i)$. Contrairement à un ensemble, elle peut répéter un même élément sous deux indices.

- id: produit-famille
  terme: produit d'une famille
  defini_dans: r-familles
  definition: |
    Le produit $\prod_{i \in I} A_i$ d'une [[famille]] d'ensembles est l'ensemble des applications $g$ définies sur $I$ telles que $g(i) \in A_i$ pour tout $i$. Qu'il soit non vide dès que chaque $A_i$ l'est équivaut à l'[[axiome-choix]].
  voir: [produit-cartesien]

- id: partition
  terme: partition
  defini_dans: r-equivalence
  definition: |
    Une partition de $E$ est un ensemble de parties non vides de $E$, deux à deux disjointes, dont la réunion est $E$. Les partitions de $E$ correspondent exactement aux relations d'équivalence sur $E$, par leurs classes.

- id: loi-composition
  terme: loi de composition interne
  defini_dans: a-loi
  definition: |
    Une loi de composition interne sur $E$ est une [[application]] de $E \times E$ dans $E$. Elle peut être [[loi-associative|associative]], [[loi-commutative|commutative]], posséder un élément neutre ; aucune de ces propriétés n'est automatique.

- id: element-neutre
  terme: élément neutre
  defini_dans: a-loi
  definition: |
    Pour une [[loi-composition|loi]] $\ast$ sur $E$, un élément $e$ tel que $e \ast x = x \ast e = x$ pour tout $x$. S'il existe, il est unique.

- id: monoide
  terme: monoïde
  defini_dans: a-monoide
  definition: |
    Un ensemble muni d'une [[loi-composition|loi]] [[loi-associative|associative]] possédant un [[element-neutre|élément neutre]]. Exemple : les applications de $E$ dans $E$, pour la composition.

- id: inversible
  terme: inversible
  defini_dans: a-monoide
  definition: |
    Dans un [[monoide|monoïde]] de neutre $e$, $x$ est inversible s'il existe $y$ tel que $xy = yx = e$. Ce $y$ est alors unique, noté $x^{-1}$, et l'on a $(xy)^{-1} = y^{-1}x^{-1}$.

- id: sous-groupe
  terme: sous-groupe
  defini_dans: a-sous-groupe
  definition: |
    Une partie $H$ d'un [[groupe]] $G$, non vide, telle que $xy^{-1} \in H$ pour tous $x, y \in H$. Une intersection de sous-groupes en est un ; une réunion, en général non.

- id: morphisme-groupes
  terme: morphisme de groupes
  defini_dans: a-morphisme
  definition: |
    Une [[application]] $f : G \to G'$ entre [[groupe|groupes]] telle que $f(xy) = f(x)f(y)$. Elle envoie le neutre sur le neutre et le symétrique sur le symétrique.

- id: noyau
  terme: noyau
  defini_dans: a-morphisme
  definition: |
    Le noyau d'un [[morphisme-groupes|morphisme]] $f : G \to G'$ est $\operatorname{Ker} f = \{x \in G : f(x) = e'\}$. C'est un [[sous-groupe]], réduit au neutre si et seulement si $f$ est injectif.

- id: isomorphisme
  terme: isomorphisme
  defini_dans: a-morphisme
  definition: |
    Un [[morphisme-groupes|morphisme]] bijectif ; sa réciproque est encore un morphisme. On parle de même d'isomorphisme d'anneaux, de corps ordonnés, d'espaces topologiques : on exige alors que la réciproque soit continue, et l'on parle d'homéomorphisme. Une application linéaire bijective entre deux espaces vectoriels, ou $A$-linéaire bijective entre deux modules, est un isomorphisme d'espaces vectoriels, ou de modules : sa réciproque est encore linéaire.
  voir: [homeomorphisme]

- id: sous-groupe-distingue
  terme: sous-groupe distingué
  defini_dans: a-distingue
  definition: |
    Un [[sous-groupe]] $H$ de $G$ tel que $ghg^{-1} \in H$ pour tous $g \in G$, $h \in H$ ; de manière équivalente, $gH = Hg$ pour tout $g$. Ce sont exactement les [[noyau|noyaux]] de morphismes.

- id: groupe-quotient
  terme: groupe quotient
  defini_dans: a-quotient
  definition: |
    Pour $H$ [[sous-groupe-distingue|distingué]] dans $G$, l'[[ensemble-quotient|ensemble quotient]] $G/H$ des classes $xH$, muni de la loi $(xH)(yH) = xyH$. La surjection canonique $G \to G/H$ est un morphisme de noyau $H$.

- id: anneau-integre
  terme: anneau intègre
  defini_dans: a-anneau
  definition: |
    Un [[anneau]] commutatif non nul où $xy = 0$ entraîne $x = 0$ ou $y = 0$. Tout corps est intègre.
  voir: [corps]

- id: ideal
  terme: idéal
  defini_dans: a-ideal
  definition: |
    Dans un [[anneau]] commutatif $A$, un sous-groupe additif $I$ tel que $ax \in I$ pour tous $a \in A$, $x \in I$. Les idéaux sont exactement les noyaux de morphismes d'anneaux ; un idéal qui contient un élément inversible est $A$ tout entier.

- id: ideal-premier
  terme: idéal premier
  defini_dans: a-premier-maximal
  definition: |
    Un [[ideal|idéal]] $I \neq A$ tel que $xy \in I$ entraîne $x \in I$ ou $y \in I$. C'est le cas si et seulement si $A/I$ est [[anneau-integre|intègre]].

- id: ideal-maximal
  terme: idéal maximal
  defini_dans: a-premier-maximal
  definition: |
    Un [[ideal|idéal]] $I \neq A$ qu'aucun idéal différent de $A$ ne contient strictement. C'est le cas si et seulement si $A/I$ est un [[corps]]. Tout idéal maximal est [[ideal-premier|premier]].

- id: groupe-symetrise
  terme: symétrisé
  defini_dans: a-symetrise
  definition: |
    Pour un [[monoide|monoïde]] commutatif $M$ dont tout élément est [[element-regulier|régulier]], le groupe abélien quotient de $M \times M$ par $(a, b) \sim (c, d) \iff a + d = b + c$. La classe de $(a, b)$ représente $a - b$ ; $M$ s'y plonge par $a \mapsto \overline{(a, 0)}$, et tout élément du groupe est la différence de deux éléments de $M$.

- id: corps-fractions
  terme: corps des fractions
  defini_dans: a-fractions
  definition: |
    Pour un [[anneau-integre|anneau intègre]] $A$, le [[corps]] quotient de $A \times (A \setminus \{0\})$ par $(a, b) \sim (c, d) \iff ad = bc$, dont les éléments sont notés $a/b$. L'anneau $A$ s'y plonge par $a \mapsto a/1$.

- id: module
  terme: module
  defini_dans: a-module
  definition: |
    Sur un [[anneau]] commutatif $A$, un groupe abélien muni d'une multiplication externe par les éléments de $A$, distributive et compatible avec le produit de $A$, avec $1x = x$. Sur un corps, un module est un espace vectoriel.
  voir: [corps]

- id: ordinal-successeur
  terme: ordinal successeur
  defini_dans: o-successeur-limite
  definition: |
    Le successeur d'un [[ordinal]] $\alpha$ est $\alpha^+ = \alpha \cup \{\alpha\}$, aussi noté $\alpha + 1$ : c'est le plus petit ordinal strictement supérieur à $\alpha$.

- id: ordinal-limite
  terme: ordinal limite
  defini_dans: o-successeur-limite
  definition: |
    Un [[ordinal]] non vide qui n'est le [[ordinal-successeur|successeur]] d'aucun ordinal ; de manière équivalente, un ordinal non vide égal à la réunion de ses éléments. Son existence repose sur l'axiome de l'infini.

- id: recursion-transfinie
  terme: récursion transfinie
  defini_dans: o-recursion
  definition: |
    Procédé qui définit une fonction $F$ sur les [[ordinal|ordinaux]] en donnant $F(\alpha)$ en fonction de la restriction de $F$ aux ordinaux plus petits que $\alpha$. Son existence et son unicité reposent sur le schéma de remplacement.

- id: fonction-primitive-recursive
  terme: fonction primitive récursive
  defini_dans: cal-pr-definition
  definition: |
    Une fonction de $\mathbb N^n$ dans $\mathbb N$ obtenue à partir de la fonction nulle, du [[successeur-ensemble|successeur]] et des projections par un nombre fini de compositions et de récurrences primitives, $h(x, 0) = f(x)$ et $h(x, y + 1) = g(x, y, h(x, y))$. L'addition, la multiplication, l'exponentielle et la [[factorielle|factorielle]] en sont ; toutes sont totales.

- id: fonction-caracteristique-relation
  terme: fonction caractéristique (d'une relation)
  defini_dans: cal-pr-cloture
  definition: |
    La fonction $\chi_R : \mathbb N^n \to \mathbb N$ d'une relation $R \subset \mathbb N^n$, égale à $1$ sur $R$ et à $0$ ailleurs. Une relation est [[relation-primitive-recursive|primitive récursive]], ou récursive, quand sa fonction caractéristique l'est. Pour une partie quelconque, on dit aussi indicatrice ; en probabilités, le même nom désigne une tout autre fonction, $t \mapsto E[e^{itX}]$.
  voir: [fonction-caracteristique]

- id: fonction-ackermann
  terme: fonction d'Ackermann
  defini_dans: cal-ackermann-lemme
  definition: |
    La fonction $A$ de $\mathbb N^2$ dans $\mathbb N$ définie par $A(0, y) = y + 1$, $A(x + 1, 0) = A(x, 1)$ et $A(x + 1, y + 1) = A(x, A(x + 1, y))$. Elle est strictement croissante en chacune de ses variables, et $A(4, 2) = 2^{65536} - 3$. Les nœuds {{cal-ackermann|Ackermann}} et {{cal-ackermann-recursive|Ackermann est récursive}} montreront qu'elle croît plus vite que toute fonction primitive récursive, dont elle ne fait donc pas partie, mais qu'elle est récursive.

- id: fonction-partielle
  terme: fonction partielle
  defini_dans: cal-recursives
  definition: |
    Une application $f$ d'une partie $D(f)$ de $\mathbb N^n$, son domaine de définition, dans $\mathbb N$. On écrit $f(x)\!\downarrow$ si $x \in D(f)$ et $f(x)\!\uparrow$ sinon ; elle est [[fonction-totale|totale]] si $D(f) = \mathbb N^n$. Les calculs qui ne s'arrêtent pas sur certaines données définissent de telles fonctions.

- id: fonction-recursive
  terme: fonction récursive
  defini_dans: cal-recursives
  definition: |
    Une [[fonction-partielle|fonction partielle]] obtenue à partir de la fonction nulle, du [[successeur-ensemble|successeur]] et des projections par composition, récurrence primitive et minimisation $\mu y\, [f(x, y) = 0]$, recherche du plus petit zéro qui peut ne pas aboutir. Les nœuds {{cal-vers-machines|Récursive ⇒ machine}} et {{cal-kleene|Forme normale (Kleene)}} montreront que ce sont exactement les fonctions calculables par une machine à registres.
  voir: [machine-registres]

- id: ensemble-recursif
  terme: ensemble récursif
  defini_dans: cal-ensembles
  definition: |
    Une partie de $\mathbb N^n$ dont la [[fonction-caracteristique-relation|fonction caractéristique]] est une [[fonction-recursive|fonction récursive]] : un procédé de calcul décide, pour tout $x$, si $x$ lui appartient. On dit aussi ensemble décidable.

- id: ensemble-recursivement-enumerable
  terme: ensemble récursivement énumérable
  defini_dans: cal-ensembles
  definition: |
    Une partie $A$ de $\mathbb N^n$ de la forme $\{x : \exists y\ R(x, y)\}$, où $R$ est une [[relation-recursive|relation récursive]]. Elle est [[ensemble-recursif|récursive]] si et seulement si son complémentaire est aussi récursivement énumérable. Le nœud {{cal-re|Caractérisations des r.e.}} montrera qu'une partie $A$ de $\mathbb N$ est récursivement énumérable si et seulement si c'est le domaine d'une [[fonction-recursive|fonction récursive]], ou, si elle n'est pas vide, l'image d'une fonction récursive [[fonction-totale|totale]].

- id: machine-registres
  terme: machine à registres
  defini_dans: cal-machines
  definition: |
    Un modèle de calcul dont la mémoire est une suite de registres contenant des entiers, et dont le [[programme-machine|programme]] est une suite finie d'instructions $\mathrm{INC}(i)$, qui incrémente le registre $R_i$, et $\mathrm{DEC}(i, j)$, qui le décrémente s'il est non nul et saute à l'instruction $j$ sinon. Les fonctions qu'elles calculent sont les fonctions récursives.
  voir: [fonction-recursive]

- id: these-church-turing
  terme: thèse de Church-Turing
  defini_dans: cal-kleene
  definition: |
    L'affirmation, qui n'est pas un théorème, que toute fonction calculable par un procédé mécanique, au sens intuitif, est une [[fonction-recursive|fonction récursive]]. Elle s'appuie sur l'équivalence de tous les modèles de calcul proposés depuis 1936.

- id: probleme-arret
  terme: problème de l'arrêt
  defini_dans: cal-arret
  definition: |
    La question de savoir si le programme d'indice $e$ s'arrête sur la donnée $x$. L'ensemble des couples $(e, x)$ pour lesquels c'est le cas est [[ensemble-recursivement-enumerable|récursivement énumérable]], mais il n'est pas [[ensemble-recursif|récursif]] : aucun programme ne répond à la question pour tous les couples.

- id: fonction-beta
  terme: fonction β de Gödel
  defini_dans: cal-beta
  definition: |
    La fonction $\beta(a, b, i)$, reste de la division de $a$ par $1 + (i + 1)b$. Toute suite finie d'entiers s'écrit $(\beta(a, b, 0), \dots, \beta(a, b, n))$ pour des entiers $a$ et $b$ convenables, par le lemme chinois : elle code les suites finies avec l'addition et la multiplication seules.

- id: ensemble-definissable
  terme: partie définissable (de ℕ)
  defini_dans: cal-definissable
  definition: |
    Une partie $A$ de $\mathbb N^n$ pour laquelle il existe une [[formule]] $\varphi$ du langage $\{0, S, +, \times\}$ et des variables $v_1, \dots, v_n$ telles que $\varphi$ soit satisfaite dans $\mathbb N$ sous une valuation exactement quand $(s(v_1), \dots, s(v_n)) \in A$. Tout [[ensemble-recursivement-enumerable|ensemble récursivement énumérable]] est définissable.

- id: formule-delta0
  terme: formule Δ₀
  defini_dans: cal-rp-sigma1
  definition: |
    Une [[formule]] de l'arithmétique construite à partir des formules atomiques par $\neg$, $\to$ et les quantifications bornées $\forall x \leqslant t\ \varphi$, c'est-à-dire $\forall x\, (\exists z\, (z + x = t) \to \varphi)$, où $x$ et $z$ sont des variables distinctes qui ne figurent pas dans $t$. Chaque quantificateur n'y parcourt qu'un nombre fini de valeurs, et l'arithmétique de Robinson démontre les énoncés Δ₀ vrais et réfute les faux.

- id: formule-sigma1
  terme: formule Σ₁
  defini_dans: cal-rp-sigma1
  definition: |
    Une [[formule]] $\exists y_1 \cdots \exists y_k\ \delta$, où $\delta$ est une [[formule-delta0|formule Δ₀]] et $y_1, \dots, y_k$ des variables distinctes. Tout énoncé Σ₁ vrai dans $\mathbb N$ est démontrable dans l'arithmétique de Robinson (Σ₁-complétude) ; le nœud {{cal-rp-forme-sigma|Forme Σ₁ des r.e.}} montrera que tout ensemble récursivement énumérable est défini par une telle formule.

- id: ensembles-inseparables
  terme: ensembles récursivement inséparables
  defini_dans: cal-rp-inseparables
  definition: |
    Deux parties disjointes $A$ et $B$ de $\mathbb N$ telles qu'aucun [[ensemble-recursif|ensemble récursif]] $C$ ne vérifie $A \subset C$ et $C \cap B = \varnothing$. Les ensembles des indices $e$ tels que $\varphi_e(e) = 0$ et tels que $\varphi_e(e) = 1$ en sont un exemple, récursivement énumérables tous deux.

- id: relation-representable
  terme: relation représentable
  defini_dans: cal-rp-rosser
  definition: |
    Une relation $R \subset \mathbb N^k$ est représentable dans une [[theorie]] $T$ de l'arithmétique s'il existe une [[formule]] $\theta$ telle que $T$ démontre $\theta(\underline a)$, écrite avec les chiffres $\underline{a_i} = S \cdots S\, 0$, pour $a \in R$, et sa négation pour $a \notin R$. Toute [[relation-recursive|relation récursive]] est représentable dans l'arithmétique de Robinson.

- id: fonction-representable
  terme: fonction représentable
  defini_dans: cal-dg-fonctions
  definition: |
    Une fonction totale $f : \mathbb N^k \to \mathbb N$ est représentable dans une [[theorie]] $T$ de l'arithmétique s'il existe une [[formule]] $\varphi$ telle que $T$ démontre $\forall w\, \big(\varphi(\underline a, w) \leftrightarrow w = \underline{f(a)}\big)$ pour tout $a \in \mathbb N^k$, avec les chiffres $\underline n = S \cdots S\, 0$ : la théorie démontre que la valeur existe et qu'elle est unique. Toute fonction récursive totale est représentable dans l'arithmétique de Robinson, par la clause du plus petit témoin ; c'est ce qu'emploie le lemme diagonal.

- id: formule-demontrabilite
  terme: formule de démontrabilité
  notation: '$\mathrm{Pr}$'
  defini_dans: cal-dg-prov
  definition: |
    Pour une [[theorie]] $T$ de l'arithmétique dont les axiomes forment un ensemble récursivement énumérable, une [[formule-sigma1|formule Σ₁]] $\exists y\, \delta(v, y)$ qui définit dans $\mathbb N$ l'ensemble des codes des énoncés démontrables dans $T$. Pour toute formule de démontrabilité, $T \vdash \sigma$ si et seulement si l'arithmétique de Robinson démontre $\mathrm{Pr}(\underline{\ulcorner \sigma \urcorner})$ ; si $T$ contient l'arithmétique de Robinson, il en résulte la première condition de dérivabilité.

- id: theorie-omega-coherente
  terme: théorie ω-cohérente
  defini_dans: cal-dg-godel
  definition: |
    Une [[theorie]] $T$ de l'arithmétique est ω-cohérente s'il n'existe aucune [[formule]] $\psi$, de variables libres parmi une variable $y$, telle que $T$ démontre $\exists y\, \psi$ et chacune des négations $\neg\psi(\underline n)$, pour $n \in \mathbb N$. Une théorie ω-cohérente est [[theorie-coherente|cohérente]] ; Gödel (1931) supposait cette hypothèse pour montrer que l'énoncé qui dit de lui-même qu'il n'est pas démontrable n'est pas réfutable.

- id: conditions-derivabilite
  terme: conditions de dérivabilité
  defini_dans: cal-dg-second
  definition: |
    Trois conditions sur une formule $\mathrm{Pr}$ et une [[theorie]] $T$ qui contient l'arithmétique de Robinson : (D1) si $T \vdash \varphi$, alors $T \vdash \mathrm{Pr}(\underline{\ulcorner \varphi \urcorner})$ ; (D2) $T$ démontre $\mathrm{Pr}(\underline{\ulcorner \varphi \to \psi \urcorner}) \to (\mathrm{Pr}(\underline{\ulcorner \varphi \urcorner}) \to \mathrm{Pr}(\underline{\ulcorner \psi \urcorner}))$ ; (D3) $T$ démontre $\mathrm{Pr}(\underline{\ulcorner \varphi \urcorner}) \to \mathrm{Pr}(\underline{\ulcorner \mathrm{Pr}(\underline{\ulcorner \varphi \urcorner}) \urcorner})$. Elles remontent à Hilbert et Bernays (1939) ; la condition (D3), sous cette forme, est due à Löb (1955). Elles entraînent, avec le lemme diagonal, le théorème de Löb et le second théorème d'incomplétude.

- id: recurrence-valeurs
  terme: récurrence de valeurs
  defini_dans: cal-sx-valeurs
  definition: |
    Définition d'une fonction $f$ par une égalité $f(x, n) = G(x, n, \langle f(x, 0), \dots, f(x, n - 1) \rangle)$, où la valeur en $n$ dépend de toutes les valeurs précédentes, rassemblées en un seul code. Si $G$ est une [[fonction-primitive-recursive|fonction primitive récursive]], $f$ l'est aussi ; c'est ainsi que se reconnaissent les codes des termes et des formules, à partir de ceux de leurs sous-mots.

- id: formule-premiere
  terme: formule première
  defini_dans: cal-sx-instances
  definition: |
    Une [[formule-atomique|formule atomique]], ou de la forme $\forall x\, \psi$ : pour le calcul propositionnel, ce sont les formules indécomposables, que l'on traite comme des lettres. Une formule est une [[instance-tautologie|instance de tautologie]] si et seulement si elle prend la valeur $1$ pour toute attribution de valeurs de vérité à ses formules premières.

- id: ordinal-hartogs
  terme: ordinal de Hartogs
  defini_dans: o-hartogs
  definition: |
    Pour un ensemble $A$, l'ensemble $h(A)$ des [[ordinal|ordinaux]] qui s'[[injection|injectent]] dans $A$. C'est un ordinal, le plus petit qui ne s'injecte pas dans $A$, et son existence ne demande pas l'axiome du choix.

- id: lemme-zorn
  terme: lemme de Zorn
  defini_dans: o-zorn
  definition: |
    Tout ensemble ordonné [[inductif-ordre|inductif]] possède un [[element-maximal|élément maximal]]. Il équivaut, dans $\mathsf{ZF}$, à l'[[axiome-choix]].

- id: ordre-strict
  terme: ordre strict
  defini_dans: od-ordre
  definition: |
    Une [[relation]] [[relation-reflexive|irréflexive]] et [[relation-transitive|transitive]], notée $<$. Elle correspond exactement à une [[relation-ordre|relation d'ordre]] $\leqslant$, par $x < y \iff (x \leqslant y \text{ et } x \neq y)$.

- id: element-maximal
  terme: élément maximal
  defini_dans: od-majorants
  definition: |
    Un élément $m$ d'une partie $A$ d'un ensemble ordonné tel qu'aucun élément de $A$ ne soit strictement plus grand que $m$. Un plus grand élément est maximal ; la réciproque est fausse si l'ordre n'est pas [[ordre-total|total]].

- id: isomorphisme-ordres
  terme: isomorphisme d'ordres
  defini_dans: od-croissantes
  definition: |
    Une [[bijection]] $f$ entre ensembles ordonnés telle que $x \leqslant y \iff f(x) \leqslant f(y)$. Entre ordres totaux, toute bijection croissante en est un.

- id: treillis-complet
  terme: treillis complet
  defini_dans: od-treillis
  definition: |
    Un ensemble ordonné dont toute partie a une [[borne-superieure|borne supérieure]] ; toute partie y a alors aussi une borne inférieure. Exemple : les parties d'un ensemble, ordonnées par inclusion.

- id: propriete-borne-superieure
  terme: propriété de la borne supérieure
  defini_dans: od-sup-propriete
  definition: |
    Un ensemble totalement ordonné la possède si toute partie non vide et [[majorant|majorée]] y admet une [[borne-superieure|borne supérieure]]. Elle entraîne la propriété jumelle pour les bornes inférieures.

- id: coupure-dedekind
  terme: coupure de Dedekind
  defini_dans: od-coupures
  definition: |
    Dans un ensemble totalement ordonné $E$, un [[segment-initial|segment initial]] différent de $\varnothing$ et de $E$, sans plus grand élément. Les coupures, ordonnées par inclusion, forment un ensemble totalement ordonné qui a la [[propriete-borne-superieure|propriété de la borne supérieure]], et dans lequel $E$ se plonge si son ordre est [[ordre-dense|dense]] et sans extrémités.

- id: coupure-positive
  terme: coupure positive
  defini_dans: rm-positives
  definition: |
    Une [[coupure-dedekind|coupure]] $C$ de $\mathbb Q$ qui contient $0^* = \{x \in \mathbb Q : x < 0\}$ ; elle est strictement positive si de plus $C \neq 0^*$, c'est-à-dire si $0 \in C$. Le produit de deux coupures positives est $0^* \cup \{cd : c \in C,\ d \in D,\ c \geqslant 0,\ d \geqslant 0\}$ ; ce sont les éléments positifs du corps ordonné $\mathbb R$.

- id: division-euclidienne
  terme: division euclidienne
  defini_dans: z-division
  definition: |
    Pour $a \in \mathbb Z$ et $b \geqslant 1$, l'unique écriture $a = bq + r$ avec $q \in \mathbb Z$ et $0 \leqslant r < b$. Le reste est toujours positif, même si $a$ est négatif.

- id: anneau-principal
  terme: anneau principal
  defini_dans: z-ideaux
  definition: |
    Un [[anneau-integre|anneau intègre]] dont tout [[ideal|idéal]] est de la forme $xA$. L'anneau $\mathbb Z$ en est un, grâce à la [[division-euclidienne|division euclidienne]].

- id: pgcd
  terme: PGCD
  defini_dans: z-bezout
  definition: |
    Le plus grand commun diviseur $a \wedge b$ de deux entiers est l'unique $d \in \mathbb N$ tel que $a\mathbb Z + b\mathbb Z = d\mathbb Z$. Il s'écrit $au + bv$ (Bézout), et tout diviseur commun de $a$ et $b$ le divise.

- id: nombre-premier
  terme: nombre premier
  defini_dans: z-premiers
  definition: |
    Un entier $p \geqslant 2$ dont les seuls diviseurs positifs sont $1$ et $p$. S'il divise un produit, il divise l'un des facteurs (lemme d'Euclide) ; tout entier $\geqslant 2$ en est un produit, de manière unique à l'ordre près.

- id: corps-ordonne-complet
  terme: corps ordonné complet
  defini_dans: rr-complet
  definition: |
    Un [[corps-ordonne|corps ordonné]] qui a la [[propriete-borne-superieure|propriété de la borne supérieure]]. Il en existe un, $\mathbb R$, et il est unique à unique isomorphisme près.

- id: ensemble-fini
  terme: ensemble fini
  defini_dans: n-fini
  definition: |
    Un ensemble [[equipotent]] à un entier $n$, c'est-à-dire à l'ensemble $\{0, \dots, n - 1\}$ des entiers qui le précèdent, vide si $n = 0$. Cet entier est unique (principe des tiroirs) : c'est le nombre d'éléments de l'ensemble, noté $|E|$.

- id: espace-vectoriel
  terme: espace vectoriel
  defini_dans: v-espace
  definition: |
    Sur un [[corps]] $K$, un [[module]] : un groupe abélien muni d'une multiplication par les scalaires, distributive, compatible avec le produit de $K$, avec $1x = x$.

- id: sous-espace-vectoriel
  terme: sous-espace vectoriel
  defini_dans: v-espace
  definition: |
    Une partie non vide d'un [[espace-vectoriel|espace vectoriel]] [[partie-stable|stable par addition]] et par multiplication par un scalaire. Une intersection de sous-espaces en est un ; une réunion, en général non.

- id: combinaison-lineaire
  terme: combinaison linéaire
  defini_dans: v-combinaisons
  definition: |
    Une somme $\sum_i \lambda_i x_i$ où seul un [[ensemble-fini|nombre fini]] de coefficients $\lambda_i$ sont non nuls. Le sous-espace engendré par une partie est l'ensemble des combinaisons linéaires de ses éléments.

- id: application-lineaire
  terme: application linéaire
  defini_dans: v-applications
  definition: |
    Une [[application]] entre espaces vectoriels qui respecte l'addition et la multiplication par un scalaire. Elle est injective si et seulement si son [[noyau]] est réduit à $0$.

- id: supplementaire
  terme: supplémentaire
  defini_dans: v-somme-directe
  definition: |
    Deux sous-espaces $F$ et $G$ de $E$ sont supplémentaires si tout vecteur s'écrit de manière unique $f + g$ ; de manière équivalente, $F + G = E$ et $F \cap G = \{0\}$. Un supplémentaire n'est pas unique, et ne doit pas être confondu avec le complémentaire. La même définition vaut pour deux sous-groupes $H$ et $K$ d'un [[groupe-abelien|groupe abélien]] $A$ : $K$ est un supplémentaire de $H$ si $A = H + K$ et $H \cap K = \{0\}$ ; dans un groupe abélien fini d'ordre une puissance d'un nombre premier, le sous-groupe engendré par un élément d'ordre maximal en a toujours un.

- id: famille-libre
  terme: famille libre
  defini_dans: v-libre
  definition: |
    Une famille de vecteurs dont la seule [[combinaison-lineaire|combinaison linéaire]] nulle est celle dont tous les coefficients sont nuls.

- id: famille-generatrice
  terme: famille génératrice
  defini_dans: v-libre
  definition: |
    Une famille de vecteurs dont les [[combinaison-lineaire|combinaisons linéaires]] décrivent tout l'espace.

- id: base-vectorielle
  terme: base (algèbre linéaire)
  defini_dans: v-libre
  definition: |
    Une [[famille-libre|famille libre]] et [[famille-generatrice|génératrice]] ; tout vecteur s'y écrit de manière unique comme combinaison linéaire. Le même mot désigne autre chose en topologie.
  voir: [base-topologie]

- id: dimension
  terme: dimension
  defini_dans: v-dimension
  definition: |
    Le nombre d'éléments commun à toutes les [[base-vectorielle|bases]] d'un espace vectoriel [[espace-dimension-finie|de dimension finie]], c'est-à-dire engendré par une famille finie.

- id: trace
  terme: trace
  defini_dans: v-trace
  definition: |
    La somme des coefficients diagonaux d'une matrice carrée ; elle vérifie $\operatorname{tr}(AB) = \operatorname{tr}(BA)$, ne dépend donc pas de la base, et définit la trace d'un [[endomorphisme]].

- id: valeur-propre
  terme: valeur propre
  defini_dans: v-valeurs-propres
  definition: |
    Un scalaire $\lambda$ tel que $u(x) = \lambda x$ pour un vecteur $x$ non nul, c'est-à-dire tel que $\det(u - \lambda\,\mathrm{id}) = 0$.

- id: polynome-minimal-endomorphisme
  terme: polynôme minimal (d'un endomorphisme)
  notation: $\mu_u$
  defini_dans: rd-polynomes-endo
  definition: |
    Pour un [[endomorphisme]] $u$ d'un espace [[espace-dimension-finie|de dimension finie]], le générateur unitaire de l'[[ideal|idéal]] des polynômes $P$ tels que $P(u) = 0$. Il [[divisibilite-polynomes|divise]] tout polynôme annulateur, et ses [[racine-polynome|racines]] sont les [[valeur-propre|valeurs propres]] de $u$.
  voir: [polynome-minimal]

- id: sous-espace-stable
  terme: sous-espace stable
  defini_dans: v-valeurs-propres
  definition: |
    Pour un [[endomorphisme]] $u$ d'un espace vectoriel $E$, un sous-espace $F$ de $E$ est stable par $u$ si $u(F) \subset F$ ; la [[restriction]] de $u$ à $F$ est alors un endomorphisme de $F$. Les sous-espaces propres de $u$ sont stables par $u$, de même que $\operatorname{Ker} u$ et $\operatorname{Im} u$.

- id: polynome-caracteristique
  terme: polynôme caractéristique
  notation: $\chi_u$
  defini_dans: rd-caracteristique
  definition: |
    Pour une matrice carrée $A$ de taille $n$, le polynôme unitaire $\chi_A = \det(XI_n - A)$, de degré $n$, le [[determinant|déterminant]] étant calculé dans le [[corps-fractions|corps des fractions]] de $K[X]$. Il ne change pas par similitude, ce qui définit celui d'un [[endomorphisme]] ; ses [[racine-polynome|racines]] sont les [[valeur-propre|valeurs propres]] ; le nœud {{rd-cayley-hamilton|Cayley-Hamilton}} montrera qu'il annule l'endomorphisme.

- id: endomorphisme-trigonalisable
  terme: trigonalisable
  defini_dans: rd-trigonalisable
  definition: |
    Se dit d'un [[endomorphisme]] dont la matrice est [[matrice-triangulaire|triangulaire supérieure]] dans une base. C'est le cas si et seulement si son [[polynome-caracteristique|polynôme caractéristique]] est [[polynome-scinde|scindé]]. Sur $\mathbb C$, le théorème de d'Alembert-Gauss ({{c-dalembert|D'Alembert-Gauss}}) rend tout endomorphisme trigonalisable.

- id: endomorphisme-nilpotent
  terme: nilpotent (endomorphisme)
  defini_dans: rd-nilpotents
  definition: |
    Un [[endomorphisme]] $u$ tel que $u^r = 0$ pour un entier $r$ ; le plus petit tel $r$ est son indice. En dimension $n$, c'est équivalent à $u^n = 0$, et à $\chi_u = X^n$.

- id: sous-espace-caracteristique
  terme: sous-espace caractéristique
  defini_dans: rd-caracteristiques
  definition: |
    Quand le [[polynome-caracteristique|polynôme caractéristique]] $\chi_u$ est [[polynome-scinde|scindé]], le sous-espace $\operatorname{Ker}(u - \lambda\,\mathrm{id})^m$ associé à une valeur propre $\lambda$ de [[multiplicite-algebrique|multiplicité]] $m$ ; il est de dimension $m$, et $E$ est somme directe des sous-espaces caractéristiques.

- id: decomposition-dunford
  terme: décomposition de Dunford
  defini_dans: rd-dunford
  definition: |
    L'écriture unique $u = d + n$ d'un [[endomorphisme]] dont le [[polynome-caracteristique|polynôme caractéristique]] est [[polynome-scinde|scindé]], avec $d$ diagonalisable, $n$ [[endomorphisme-nilpotent|nilpotent]] et $dn = nd$ ; $d$ et $n$ sont des polynômes en $u$. On l'appelle aussi décomposition de Jordan-Chevalley.

- id: bloc-jordan
  terme: bloc de Jordan
  notation: $J_k(\lambda)$
  defini_dans: rd-jordan-nilpotent
  definition: |
    La matrice $J_k(\lambda)$ de taille $k$ qui porte $\lambda$ sur la diagonale, $1$ juste au-dessus et $0$ ailleurs. Tout [[endomorphisme]] dont le polynôme caractéristique est [[polynome-scinde|scindé]] a, dans une base convenable, une [[matrice-diagonale-blocs|matrice diagonale par blocs]] de Jordan, uniques à l'ordre près.

- id: rang
  terme: rang
  defini_dans: v-rang
  definition: |
    La [[dimension]] de l'image d'une [[application-lineaire|application linéaire]]. Le théorème du rang affirme $\dim E = \dim \operatorname{Ker} u + \operatorname{rg} u$.

- id: espace-dual
  terme: espace dual
  notation: '$E^*$'
  defini_dans: v-dual
  definition: |
    L'espace $E^*$ des [[application-lineaire|applications linéaires]] de $E$ dans le corps des scalaires. En [[dimension]] finie, il a même dimension que $E$, et $E$ s'identifie canoniquement à $E^{**}$.

- id: groupe-topologique
  terme: groupe topologique
  defini_dans: gt-definition
  definition: |
    Un [[groupe]] muni d'une [[topologie|topologie]] pour laquelle la multiplication et le passage au symétrique sont [[continuite|continus]]. Le nœud {{gt-translations|Translations, voisinages de e}} montrera que les translations en sont des [[homeomorphisme|homéomorphismes]].

- id: anneau-polynomes
  terme: anneau de polynômes
  notation: '$A[X]$'
  defini_dans: pol-anneau
  definition: |
    Pour un [[anneau]] commutatif $A$, l'anneau $A[X]$ des suites $(a_k)$ d'éléments de $A$ dont tous les termes sont nuls sauf un nombre fini, avec le produit $c_k = \sum_{i+j=k} a_i b_j$. Un polynôme n'est pas une fonction, même s'il définit une fonction par évaluation.

- id: polynome-irreductible
  terme: polynôme irréductible
  defini_dans: pol-irreductibles
  definition: |
    Sur un [[corps]] $K$, un [[polynome-constant|polynôme non constant]] qui n'est pas le produit de deux polynômes de degrés strictement plus petits. Tout polynôme non constant de $K[X]$ est, de manière unique, le produit d'une constante et de polynômes irréductibles unitaires. L'irréductibilité dépend du corps : $X^2 + 1$ est irréductible sur $\mathbb Z/3\mathbb Z$, mais pas sur $\mathbb Z/5\mathbb Z$.

- id: multiplicite-racine
  terme: multiplicité d'une racine
  defini_dans: pol-racines
  definition: |
    Pour un polynôme $P \neq 0$ et $a$ dans l'anneau des coefficients, le plus grand entier $m$ tel que $(X - a)^m$ [[divisibilite-polynomes|divise]] $P$ ; c'est aussi l'unique $m$ tel que $P = (X - a)^m Q$ avec $Q(a) \neq 0$. Sur un [[anneau-integre|anneau intègre]], la somme des multiplicités des [[racine-polynome|racines]] de $P$ est au plus $\deg P$.

- id: derivee-formelle
  terme: dérivée formelle
  defini_dans: pol-derivee
  definition: |
    La dérivée de $P = \sum_k a_k X^k$ est $P' = \sum_{k \geqslant 1} k\,a_k X^{k-1}$, définie sur les coefficients, sans aucune limite. Elle vérifie $(PQ)' = P'Q + PQ'$, et, pour $P \neq 0$, $a$ est [[racine-multiple|racine multiple]] de $P$ si et seulement si $P(a) = P'(a) = 0$.

- id: coefficient-binomial
  terme: coefficient binomial
  defini_dans: pol-binome
  definition: |
    Les entiers $\binom nk$ définis par la [[relation-pascal|relation de Pascal]] $\binom{n+1}{k+1} = \binom nk + \binom n{k+1}$. Ils donnent $(a + b)^n = \sum_k \binom nk a^k b^{n-k}$ dans tout [[anneau]] commutatif, et $p$ divise $\binom pk$ pour $p$ premier et $0 < k < p$.

- id: polynome-primitif
  terme: polynôme primitif
  defini_dans: pol-gauss
  definition: |
    Un polynôme non nul à coefficients entiers dont le contenu, [[pgcd|PGCD]] des coefficients, vaut $1$. Le produit de deux polynômes primitifs est primitif ; c'est la clé du lemme de Gauss, qui ramène la factorisation sur le corps des fractions à une factorisation à coefficients entiers.

- id: spectre-premier
  terme: spectre premier
  notation: '$\operatorname{Spec} A$'
  defini_dans: ga-spectre
  definition: |
    L'ensemble $\operatorname{Spec} A$ des [[ideal-premier|idéaux premiers]] d'un anneau commutatif $A$. On le munit ensuite de la topologie de Zariski.
  voir: [topologie-zariski]

- id: topologie-zariski
  terme: topologie de Zariski
  defini_dans: ga-zariski
  definition: |
    Sur le [[spectre-premier|spectre]] d'un anneau, la topologie dont les fermés sont les $V(I) = \{\mathfrak p : I \subset \mathfrak p\}$. Elle n'est presque jamais séparée.

- id: quasi-compact
  terme: quasi-compact
  defini_dans: ga-quasi-compact
  definition: |
    Un espace topologique est quasi-compact si de tout recouvrement ouvert on peut extraire un recouvrement fini. C'est la notion de [[compact]] sans l'exigence de séparation.

- id: radical-ideal
  terme: radical d'un idéal
  defini_dans: ga-nilradical
  definition: |
    L'ensemble $\sqrt I$ des éléments dont une puissance appartient à l'[[ideal|idéal]] $I$. C'est l'intersection des idéaux premiers contenant $I$, résultat qui utilise le lemme de Zorn pour un anneau quelconque, mais aucun choix pour un quotient d'un anneau de polynômes en un nombre fini d'indéterminées sur un corps, où c'est même l'intersection des idéaux maximaux contenant $I$.

- id: ensemble-algebrique
  terme: ensemble algébrique
  defini_dans: ga-zeros
  definition: |
    Une partie de $K^n$ formée des zéros communs d'une famille de [[anneau-polynomes|polynômes]]. Les ensembles algébriques sont les fermés de la [[topologie-zariski-kn|topologie de Zariski]] sur $K^n$.

- id: corps-algebriquement-clos
  terme: corps algébriquement clos
  defini_dans: ga-nullstellensatz
  definition: |
    Un [[corps]] dans lequel tout [[polynome-constant|polynôme non constant]] à une indéterminée a une [[racine-polynome|racine]]. C'est le cadre du Nullstellensatz de Hilbert.

- id: nombre-complexe
  terme: nombre complexe
  defini_dans: c-construction
  definition: |
    Un élément du [[corps]] $\mathbb C = \mathbb R[X]/(X^2 + 1)$. Il s'écrit de manière unique $a + ib$ avec $a, b$ réels, où $i$, classe de $X$, vérifie $i^2 = -1$.

- id: module-complexe
  terme: module (d'un complexe)
  defini_dans: c-calcul
  definition: |
    Pour $z = a + ib$, le réel positif $|z| = \sqrt{a^2 + b^2} = \sqrt{z \bar z}$. Il est multiplicatif, $|zw| = |z|\,|w|$, et vérifie $|z + w| \leqslant |z| + |w|$. Le même mot désigne autre chose en algèbre.
  voir: [module]

- id: chemin
  terme: chemin
  defini_dans: ta-chemins
  definition: |
    Une application [[continuite|continue]] $\gamma : [0, 1] \to X$ ; elle relie $\gamma(0)$ à $\gamma(1)$. Un [[lacet|lacet]] est un chemin dont les deux extrémités coïncident.

- id: connexe-par-arcs
  terme: connexe par arcs
  defini_dans: ta-chemins
  definition: |
    Un espace où deux points quelconques sont reliés par un [[chemin]]. Un tel espace est [[connexe]] ; la réciproque est fausse.

- id: homotopie-chemins
  terme: homotopie
  defini_dans: ta-homotopie
  definition: |
    Une déformation continue $H : [0, 1] \times [0, 1] \to X$ d'un [[chemin]] en un autre, à extrémités fixes. Deux chemins reliés par une homotopie sont dits homotopes.

- id: groupe-fondamental
  terme: groupe fondamental
  notation: '$\pi_1(X, x)$'
  defini_dans: ta-groupe-fondamental
  definition: |
    Le [[groupe]] $\pi_1(X, x)$ des classes d'[[homotopie-chemins|homotopie]] de [[lacet|lacets]] en $x$, pour la concaténation. Deux espaces [[espaces-homeomorphes|homéomorphes]] ont des groupes fondamentaux isomorphes. Celui du cercle est $\mathbb Z$.

- id: simplement-connexe
  terme: simplement connexe
  defini_dans: ta-simplement-connexe
  definition: |
    Un espace [[connexe-par-arcs|connexe par arcs]] dont le [[groupe-fondamental|groupe fondamental]] est trivial : tout [[lacet|lacet]] s'y contracte en un point. Les parties [[partie-convexe|convexes]] de $\mathbb R^n$ le sont.

- id: revetement
  terme: revêtement
  defini_dans: ta-revetement
  definition: |
    Une application continue surjective $p : E \to B$ telle que chaque point de $B$ ait un voisinage dont l'image réciproque soit une réunion disjointe d'ouverts, chacun envoyé homéomorphiquement sur ce voisinage. Les nœuds {{ta-relevement-chemins|Relèvement des chemins}} et {{ta-relevement-homotopies|Relèvement des homotopies}} montreront que les chemins et les homotopies s'y relèvent, de manière unique une fois fixé le point de départ.

- id: monodromie
  terme: action de monodromie
  defini_dans: rv-monodromie
  definition: |
    Pour un [[revetement|revêtement]] $p : E \to B$, l'action à droite du [[groupe-fondamental|groupe fondamental]] $\pi_1(B, b_0)$ sur la [[fibre-application|fibre]] $p^{-1}(b_0)$ : $e \cdot [\gamma]$ est l'extrémité du relèvement du [[lacet|lacet]] $\gamma$ issu de $e$. Le stabilisateur de $e$ est l'image de $\pi_1(E, e)$, et l'action est transitive lorsque $E$ est [[connexe-par-arcs|connexe par arcs]].

- id: indice-sous-groupe
  terme: indice d'un sous-groupe
  notation: '$[G : H]$'
  defini_dans: rv-fibre
  definition: |
    Le nombre d'éléments, lorsqu'il est fini, de l'ensemble des classes $Hg$ d'un [[sous-groupe]] $H$ d'un [[groupe]] $G$. Pour un [[revetement|revêtement]] connexe par arcs, l'indice de l'image du groupe fondamental du revêtement est le [[nombre-feuillets|nombre de feuillets]].

- id: localement-connexe-par-arcs
  terme: localement connexe par arcs
  defini_dans: rv-locale
  definition: |
    Un espace où tout [[voisinage]] d'un point contient un [[ouvert]] [[connexe-par-arcs|connexe par arcs]] qui contient ce point. Un tel espace, s'il est [[connexe]], est connexe par arcs. Les ouverts de $\mathbb R^n$, les sphères et leurs revêtements le sont ; le peigne, connexe par arcs, ne l'est pas.

- id: morphisme-revetements
  terme: morphisme de revêtements
  defini_dans: rv-morphismes
  definition: |
    Pour deux [[revetement|revêtements]] $p_1 : E_1 \to B$ et $p_2 : E_2 \to B$, une application continue $\varphi : E_1 \to E_2$ telle que $p_2 \circ \varphi = p_1$. Si $E_1$ est [[connexe]], un morphisme est déterminé par l'image d'un point ; il existe un morphisme envoyant $e_1$ sur $e_2$ si et seulement si l'image de $\pi_1(E_1, e_1)$ est contenue dans celle de $\pi_1(E_2, e_2)$, sous une hypothèse de connexité locale.

- id: automorphisme-revetement
  terme: automorphisme de revêtement
  notation: '$\operatorname{Aut}(E/B)$'
  defini_dans: rv-automorphismes
  definition: |
    Un [[homeomorphisme|homéomorphisme]] $\varphi$ de $E$ tel que $p \circ \varphi = p$, pour un [[revetement|revêtement]] $p : E \to B$ ; on dit aussi transformation du revêtement. Pour $E$ connexe et localement connexe par arcs, $\operatorname{Aut}(E/B) \cong N_G(H)/H$, où $H$ est l'image de $\pi_1(E, e_0)$ dans $G = \pi_1(B, b_0)$.

- id: normalisateur
  terme: normalisateur
  notation: '$N_G(H)$'
  defini_dans: a-distingue
  definition: |
    Le normalisateur d'un [[sous-groupe]] $H$ d'un [[groupe]] $G$ est l'ensemble $N_G(H)$ des $g \in G$ tels que $gHg^{-1} = H$, condition qui équivaut à $g^{-1}Hg = H$. C'est un sous-groupe de $G$ qui contient $H$, et c'est le plus grand sous-groupe de $G$ dans lequel $H$ est [[sous-groupe-distingue|distingué]] : si $H$ est distingué dans un sous-groupe $K$, tout $k \in K$ vérifie $kHk^{-1} \subset H$ et $k^{-1}Hk \subset H$, donc $kHk^{-1} = H$. On a $N_G(H) = G$ si et seulement si $H$ est distingué dans $G$.

- id: revetement-galoisien
  terme: revêtement galoisien
  defini_dans: rv-galoisiens
  definition: |
    Un [[revetement|revêtement]] connexe et localement connexe par arcs dont le groupe d'automorphismes agit transitivement sur chaque [[fibre-application|fibre]] ; on dit aussi régulier. C'est le cas si et seulement si l'image du groupe fondamental du revêtement est un [[sous-groupe-distingue|sous-groupe distingué]] $H$ de celui de la base, et le groupe des automorphismes est alors isomorphe à $\pi_1(B, b_0)/H$.

- id: semi-localement-simplement-connexe
  terme: semi-localement simplement connexe
  defini_dans: rv-slsc
  definition: |
    Un espace $X$ dont tout point a un [[voisinage]] $V$ tel que tout [[lacet|lacet]] de $V$ en ce point soit homotope, dans $X$, au lacet constant. C'est une condition nécessaire à l'existence d'un [[revetement|revêtement]] [[simplement-connexe|simplement connexe]] ; le nœud {{rv-universel|Revêtement universel}} montrera qu'elle est suffisante pour un espace connexe et localement connexe par arcs. La boucle d'oreille hawaïenne ne la vérifie pas.

- id: revetement-universel
  terme: revêtement universel
  defini_dans: rv-universel
  definition: |
    Un [[revetement|revêtement]] $\tilde B \to B$ dont l'espace $\tilde B$ est [[simplement-connexe|simplement connexe]]. Si $B$ est connexe, localement connexe par arcs et [[semi-localement-simplement-connexe|semi-localement simplement connexe]], il existe, unique à isomorphisme près : c'est l'espace des chemins issus d'un point, à homotopie près, et il se projette sur tout revêtement connexe de $B$.

- id: espace-projectif-reel
  terme: espace projectif réel
  notation: '$\mathbb RP^n$'
  defini_dans: rv-projectif
  definition: |
    Le quotient de la [[sphere-unite|sphère]] $S^n$ par la relation qui identifie chaque point $x$ à son opposé $-x$, muni de la [[topologie-quotient|topologie quotient]]. La projection $S^n \to \mathbb RP^n$ est un [[revetement|revêtement]] à deux [[nombre-feuillets|feuillets]], universel pour $n \geqslant 2$, et le groupe fondamental de $\mathbb RP^n$ est alors $\mathbb Z/2\mathbb Z$.

- id: convergence-uniforme
  terme: convergence uniforme
  defini_dans: cx-convergence-uniforme
  definition: |
    Une suite de fonctions $f_n : A \to \mathbb C$ converge uniformément vers $f$ sur $A$ si $\sup_A |f_n - f| \to 0$. Elle préserve la continuité et permet d'intervertir limite et intégrale sur un segment. La même notion, pour des applications d'un espace compact dans $\mathbb R^p$, est définie indépendamment en analyse fonctionnelle.
  voir: [convergence-uniforme-compact]

- id: convergence-uniforme-compact
  terme: convergence uniforme (sur un compact)
  defini_dans: fc-uniforme
  definition: |
    Une suite d'applications $f_n$ d'un espace [[compact]] $K$ dans $\mathbb R^p$ converge uniformément vers $f$ si $\sup_{x \in K} \|f_n(x) - f(x)\|_\infty \to 0$ : le même rang convient pour tous les points. Sur l'espace $C(K, \mathbb R^p)$ des applications continues, c'est la convergence pour la norme $\|f\|_\infty = \sup_{x \in K} \|f(x)\|_\infty$, et une limite uniforme d'applications continues est continue. C'est la même définition que pour les fonctions complexes de l'analyse complexe, posée dans une branche indépendante.
  voir: [convergence-uniforme]

- id: serie-entiere
  terme: série entière
  defini_dans: cx-series-entieres
  definition: |
    Une [[serie-complexe|série]] $\sum a_n z^n$. Elle converge [[serie-absolument-convergente|absolument]] sur un disque ouvert $D(0, R)$, où $R$ est son rayon de convergence ; sa somme y est continue, et le nœud {{cx-derivation-series|Dérivation terme à terme}} montrera qu'elle y est indéfiniment dérivable au sens complexe.

- id: holomorphe
  terme: holomorphe
  defini_dans: cx-holomorphe
  definition: |
    Une fonction définie sur un [[ouvert]] de $\mathbb C$ est holomorphe si elle est [[derivable]] au sens complexe en tout point : le taux d'accroissement $\frac{f(z) - f(z_0)}{z - z_0}$ a une limite quand $z \to z_0$. Le nœud {{cx-analytique|Analyticité}} montrera qu'elle est alors développable en série entière au voisinage de chaque point.
  voir: [serie-entiere]

- id: exponentielle
  terme: exponentielle
  defini_dans: ex-exponentielle
  definition: |
    La bijection réciproque $\exp : \mathbb R \to \,]0, +\infty[$ du [[logarithme]]. Elle est strictement croissante, dérivable et égale à sa dérivée, et transforme les sommes en produits ; on note $e = \exp 1$ et $e^x = \exp x$. Le nœud {{ex-serie|Série de l'exponentielle}} montrera que $\exp x$ est la somme de la série $\sum x^n/n!$ ; l'analyse complexe la prolongera à $\mathbb C$ par cette série ({{cx-exponentielle|Exponentielle}}), et l'on aura alors $\exp(it) = \cos t + i\sin t$ pour $t$ réel.

- id: pi
  terme: π
  defini_dans: tg-arctan
  definition: |
    Le double de la borne supérieure de l'[[arc-tangente|arc tangente]] : $\frac\pi2 = \sup_{x \in \mathbb R} \arctan x$, limite de $\int_0^x \frac{dt}{1 + t^2}$ quand $x$ tend vers $+\infty$. Le nœud {{tg-cercle|Paramétrage du cercle}} montrera que $\frac\pi2$ est aussi le plus petit zéro strictement positif du cosinus, et $2\pi$ la plus petite période du cosinus et du sinus ; en analyse complexe ({{cx-pi|Le nombre π}}), $\pi$ sera la demi-période de $t \mapsto \exp(it)$, et $\exp(i\pi) = -1$. On a $\pi = 3{,}14159\ldots$
  voir: [arc-tangente, cosinus-sinus, exponentielle]

- id: integrale-curviligne
  terme: intégrale curviligne
  defini_dans: cx-integrale-chemin
  definition: |
    L'intégrale $\int_\gamma f = \int_a^b f(\gamma(t))\gamma'(t)\,dt$ d'une fonction le long d'un [[chemin-c1-morceaux|chemin $C^1$ par morceaux]] du plan complexe. Elle est nulle sur les chemins fermés lorsque $f$ a une primitive holomorphe.

- id: point-accumulation
  terme: point d'accumulation
  defini_dans: cx-zeros-isoles
  definition: |
    Un point $a$ est un point d'accumulation d'une partie $E$ de $\mathbb C$ si tout disque $D(a, \rho)$, $\rho > 0$, contient un point de $E$ distinct de $a$. Une fonction holomorphe sur un ouvert connexe qui s'annule sur une partie ayant un point d'accumulation dans l'ouvert est nulle.

- id: indice-lacet
  terme: indice d'un lacet
  defini_dans: rs-indice
  definition: |
    Pour un [[chemin-c1-morceaux|chemin fermé $\gamma$ de classe $C^1$ par morceaux]] du plan complexe et un point $w$ hors de son image, le nombre $\operatorname{Ind}_\gamma(w) = \frac{1}{2i\pi}\int_\gamma \frac{dz}{z - w}$. C'est un entier, qui compte les tours de $\gamma$ autour de $w$ ; il est constant sur toute partie [[connexe]] du complémentaire de l'image, et nul hors de tout ouvert [[partie-convexe-complexe|convexe]] qui contient le chemin.
  voir: [integrale-curviligne]

- id: biholomorphe
  terme: biholomorphe
  defini_dans: cf-ouverte
  definition: |
    Une application $f : U \to V$ entre [[ouvert|ouverts]] du plan complexe est biholomorphe si elle est bijective, [[holomorphe]], et de réciproque holomorphe. Une application holomorphe injective est automatiquement biholomorphe sur son image, qui est ouverte ; sa dérivée ne s'annule pas, et elle conserve les angles, d'où le nom de représentation conforme.

- id: automorphismes-disque
  terme: automorphismes du disque
  defini_dans: cf-automorphismes
  definition: |
    Les applications [[biholomorphe|biholomorphes]] du disque unité $\mathbb D$ sur lui-même. Ce sont exactement les $z \mapsto \lambda\frac{z - a}{1 - \bar a z}$, avec $|a| < 1$ et $|\lambda| = 1$ ; celles qui fixent $0$ sont les rotations, par le lemme de Schwarz.

- id: convergence-compacte
  terme: convergence uniforme sur tout compact
  defini_dans: cf-compacte
  definition: |
    Une suite de fonctions sur un [[ouvert]] $U$ de $\mathbb C$ converge uniformément sur tout compact si elle converge uniformément sur chaque partie [[compact|compacte]] de $U$, ce qui revient à converger uniformément sur un disque centré en chaque point. Une limite de fonctions [[holomorphe|holomorphes]] en ce sens est holomorphe, et les dérivées convergent de la même façon.
  voir: [convergence-uniforme]

- id: famille-localement-bornee
  terme: famille localement bornée
  defini_dans: cf-montel
  definition: |
    Un ensemble de fonctions [[holomorphe|holomorphes]] sur un [[ouvert]] $U$ est localement borné si, sur chaque partie [[compact|compacte]] de $U$, toutes ses fonctions sont majorées en module par une même constante. Par le théorème de Montel, c'est alors une [[famille-normale|famille normale]].

- id: famille-normale
  terme: famille normale
  defini_dans: cf-montel
  definition: |
    Un ensemble de fonctions [[holomorphe|holomorphes]] sur un [[ouvert]] $U$ dont toute suite a une suite extraite qui converge [[convergence-compacte|uniformément sur tout compact]] de $U$. Une [[famille-localement-bornee|famille localement bornée]] est normale (théorème de Montel).

- id: logarithme-holomorphe
  terme: logarithme holomorphe
  defini_dans: cf-racines
  definition: |
    Un logarithme holomorphe d'une fonction $g$ [[holomorphe]] sur un [[ouvert]] $U$ est une fonction $L$ holomorphe sur $U$ telle que $\exp \circ L = g$. Il existe pour toute $g$ sans zéro si $U$ est [[connexe]] et si toute fonction holomorphe sur $U$ a une primitive, par exemple si $U$ est [[partie-convexe-complexe|convexe]] ; la fonction $z$ n'en a pas sur $\mathbb C \setminus \{0\}$.
  voir: [logarithme, propriete-racine-carree]

- id: propriete-racine-carree
  terme: propriété de la racine carrée
  defini_dans: cf-racines
  definition: |
    Un [[ouvert]] $U$ du plan complexe a la propriété de la racine carrée si toute fonction [[holomorphe]] sur $U$ qui ne s'annule pas y a une [[racine-carree-holomorphe|racine carrée holomorphe]]. Les ouverts [[partie-convexe-complexe|convexes]] l'ont ; le théorème de Riemann ({{cf-riemann|Théorème de Riemann}}) montrera qu'un ouvert [[connexe]] non vide qui l'a est $\mathbb C$ ou est [[biholomorphe]] au disque unité.
  voir: [logarithme-holomorphe]

- id: serie-laurent
  terme: série de Laurent
  defini_dans: rs-laurent
  definition: |
    Une [[serie-complexe|série]] $\sum_{n \in \mathbb Z} a_n(z - c)^n$, somme d'une [[serie-entiere|série entière]] en $z - c$ et d'une série entière en $\frac{1}{z - c}$. Toute fonction [[holomorphe]] sur une [[couronne|couronne]] $r_1 < |z - c| < r_2$ en est la somme, de manière unique, avec $a_n = \frac{1}{2i\pi}\int_{|w - c| = \rho} f(w)(w - c)^{-n-1}\,dw$ pour n'importe quel $\rho$ tel que $r_1 < \rho < r_2$.

- id: singularite-isolee
  terme: singularité isolée
  defini_dans: rs-singularites
  definition: |
    Un point $a$ d'un [[ouvert]] $U$ tel que $f$ soit [[holomorphe]] sur $U \setminus \{a\}$. Selon les coefficients d'indice négatif de sa [[serie-laurent|série de Laurent]] près de $a$, la singularité est fausse (tous nuls : $f$ se prolonge, ce qui arrive dès qu'elle est bornée près de $a$), un [[pole|pôle]] (en nombre fini non nul), ou essentielle (une infinité d'entre eux non nuls).

- id: pole
  terme: pôle
  defini_dans: rs-singularites
  definition: |
    Une [[singularite-isolee|singularité isolée]] $a$ de $f$ dont la [[serie-laurent|série de Laurent]] n'a qu'un nombre fini, non nul, de coefficients d'indice négatif ; le plus grand $m$ tel que le coefficient de $(z - a)^{-m}$ soit non nul est l'ordre du pôle, et un pôle d'ordre $1$ est dit simple. Le nœud {{rs-poles|Pôles}} montrera que ce sont les singularités isolées où $|f(z)| \to +\infty$, et qu'au voisinage d'un pôle d'ordre $m$, $f = g/(z - a)^m$ avec $g$ holomorphe et $g(a) \neq 0$.

- id: residu
  terme: résidu
  defini_dans: rs-residu
  definition: |
    Le coefficient de $(z - a)^{-1}$ dans la [[serie-laurent|série de Laurent]] de $f$ près d'une [[singularite-isolee|singularité isolée]] $a$, égal à $\frac{1}{2i\pi}\int_{|z - a| = \rho} f$ pour $\rho$ petit. En un [[pole|pôle]] simple, c'est la limite de $(z - a)f(z)$. Le théorème des résidus ramène à ces nombres les intégrales le long d'un [[lacet-c1|lacet]].

- id: meromorphe
  terme: fonction méromorphe
  defini_dans: rs-argument
  definition: |
    Une fonction [[holomorphe]] sur un [[ouvert]] $U$ privé d'une partie $P$ sans [[point-accumulation|point d'accumulation]] dans $U$, telle que chaque $p \in P$ ait un disque $D(p, r) \subset U$ qui ne rencontre $P$ qu'en $p$, et soit un [[pole|pôle]] de la restriction de $f$ à $D(p, r) \setminus \{p\}$. Le principe de l'argument compte ses zéros moins ses pôles, avec leurs ordres, par l'intégrale de $f'/f$.


- id: norme
  terme: norme
  defini_dans: gd-normes
  definition: |
    Une application $N : E \to [0, +\infty[$ sur un $\mathbb R$-[[espace-vectoriel|espace vectoriel]], nulle seulement en $0$, telle que $N(\lambda x) = |\lambda|\,N(x)$ et $N(x + y) \leqslant N(x) + N(y)$. Elle définit la distance $N(x - y)$, donc une [[topologie|topologie]].

- id: normes-equivalentes
  terme: normes équivalentes
  defini_dans: gd-equivalence
  definition: |
    Deux [[norme|normes]] $N$ et $N'$ telles que $\alpha N \leqslant N' \leqslant \beta N$ pour des constantes $\alpha, \beta > 0$. Elles définissent la même [[topologie|topologie]]. En dimension finie, toutes les normes sont équivalentes.

- id: norme-subordonnee
  terme: norme subordonnée
  defini_dans: gd-equivalence
  definition: |
    Pour $u$ linéaire entre espaces normés [[espace-dimension-finie|de dimension finie]], $|||u||| = \sup\{\|u(x)\| : \|x\| \leqslant 1\}$, plus petite constante $C$ telle que $\|u(x)\| \leqslant C\|x\|$. Elle vérifie $|||v \circ u||| \leqslant |||v|||\;|||u|||$.
  voir: [norme]

- id: produit-scalaire
  terme: produit scalaire
  notation: $\langle x, y \rangle$
  defini_dans: me-produit-scalaire
  definition: |
    Sur un [[espace-vectoriel|espace vectoriel]] réel $E$, une application $(x, y) \mapsto \langle x, y \rangle$ de $E \times E$ dans $\mathbb R$, linéaire en chaque variable, symétrique, et telle que $\langle x, x \rangle > 0$ pour tout $x \neq 0$. Sur $\mathbb R^n$, le [[produit-scalaire-usuel|produit scalaire usuel]] est $\sum_i x_iy_i = {}^tX\,Y$. Il vérifie l'inégalité de Cauchy-Schwarz $|\langle x, y \rangle| \leqslant \|x\|\,\|y\|$, avec égalité seulement pour des vecteurs [[vecteurs-colineaires|colinéaires]], et $\|x\| = \langle x, x \rangle^{1/2}$ est une [[norme]]. Deux vecteurs sont orthogonaux si leur produit scalaire est nul.
  voir: [norme, forme-bilineaire-symetrique, forme-definie-positive, espace-hilbert]

- id: differentiable
  terme: différentiable
  defini_dans: gd-differentielle
  definition: |
    Une application $f$ d'un ouvert de $\mathbb R^n$ dans $\mathbb R^p$ est différentiable en $a$ s'il existe une [[application-lineaire|application linéaire]] $df(a)$, la différentielle, telle que $f(a + h) = f(a) + df(a)(h) + o(\|h\|)$. Sa matrice est la matrice jacobienne des dérivées partielles.
  voir: [derivable]

- id: classe-ck
  terme: classe Cᵏ
  defini_dans: gd-classe-ck
  definition: |
    Une application est de classe $C^1$ si elle est [[differentiable]] et si sa différentielle dépend continûment du point ; de classe $C^{k+1}$ si sa différentielle est de classe $C^k$ ; de classe $C^\infty$ si elle est de classe $C^k$ pour tout $k$. C'est le cas si et seulement si ses dérivées partielles d'ordre $\leqslant k$ existent et sont continues.

- id: contractante
  terme: application contractante
  defini_dans: gd-point-fixe
  definition: |
    Une application $\varphi$ d'un [[espace-metrique]] dans lui-même telle que $d(\varphi(x), \varphi(y)) \leqslant k\, d(x, y)$ pour une constante $k < 1$. Sur un espace [[espace-complet|complet]] non vide, par exemple un fermé non vide de $\mathbb R^n$, elle a un unique point fixe, limite de toute suite itérée (Banach).

- id: groupe-lineaire
  terme: groupe linéaire
  notation: '$GL_n(K)$'
  defini_dans: v-matrices
  definition: |
    Pour un [[corps]] $K$, le groupe $GL_n(K)$ des [[matrice-inversible|matrices inversibles]] de $\mathcal M_n(K)$, pour le produit, de neutre $I_n$. On définit de même $GL_n(A)$ pour un [[anneau-commutatif|anneau commutatif]] $A$. Pour $K = \mathbb R$, le nœud Groupe linéaire du calcul différentiel montrera que $GL_n(\mathbb R)$ est un ouvert de $\mathcal M_n(\mathbb R)$, sur lequel l'inversion est de classe $C^\infty$.

- id: diffeomorphisme
  terme: difféomorphisme
  defini_dans: gd-inversion-locale
  definition: |
    Une bijection de classe $C^k$ ($k \geqslant 1$) entre ouverts de $\mathbb R^n$ dont la réciproque est de classe $C^k$. Entre variétés, une bijection lisse de réciproque lisse.
  voir: [homeomorphisme]

- id: submersion
  terme: submersion
  defini_dans: gd-submersions
  definition: |
    Une application de classe $C^k$ dont la différentielle est surjective. Localement, dans de bonnes coordonnées, c'est une projection $(z', z'') \mapsto z''$.

- id: sous-variete
  terme: sous-variété
  defini_dans: gd-sous-varietes
  definition: |
    Une partie $M$ de $\mathbb R^n$ qu'un [[diffeomorphisme]] local envoie, au voisinage de chacun de ses points, sur un morceau de $\mathbb R^d \times \{0\}$. De façon équivalente, $M$ est localement l'ensemble des zéros d'une [[submersion]] à valeurs dans $\mathbb R^{n-d}$.

- id: espace-tangent-niveau
  terme: espace tangent (ensemble de niveau)
  notation: '$T_a\Gamma$'
  defini_dans: el-niveau
  definition: |
    Pour un [[ensemble-niveau|ensemble de niveau]] $\Gamma = \{g = 0\}$ d'une application $g : U \subset \mathbb R^n \to \mathbb R^p$ de [[classe-ck|classe $C^1$]], et $a \in \Gamma$, l'ensemble $T_a\Gamma$ des vitesses $\gamma'(0)$ des courbes de classe $C^1$ tracées sur $\Gamma$ avec $\gamma(0) = a$. Si $g$ est une [[submersion]] en $a$, c'est le sous-espace vectoriel $\operatorname{Ker} dg(a)$, de dimension $n - p$ ; sans cette hypothèse, ce n'est pas toujours un sous-espace vectoriel. C'est le premier des trois espaces tangents de l'atlas, qui coïncident là où ils sont tous définis.
  voir: [espace-tangent-sv, espace-tangent]

- id: espace-tangent-sv
  terme: espace tangent (sous-variété)
  notation: '$T_aM$'
  defini_dans: gd-tangent-sm
  definition: |
    L'ensemble $T_aM$ des vecteurs vitesse $\gamma'(0)$ des courbes tracées sur une [[sous-variete|sous-variété]] $M$, passant par $a$ en $t = 0$ et dérivables en $0$. C'est un sous-espace vectoriel de dimension $\dim M$, le noyau de la différentielle d'une équation locale de $M$. Pour un [[ensemble-niveau|ensemble de niveau]] d'une submersion, il coïncide avec l'espace tangent défini par les courbes de classe $C^1$. Le nœud {{gd-espace-tangent|Espace tangent}} définira l'espace tangent d'une variété abstraite par les cartes, et montrera que, pour une sous-variété, il s'identifie à celui-ci.
  voir: [espace-tangent-niveau, espace-tangent]

- id: carte
  terme: carte
  defini_dans: gd-varietes
  definition: |
    Un [[homeomorphisme]] $\varphi$ d'un ouvert $U$ d'un espace topologique sur un ouvert de $\mathbb R^n$. Deux cartes sont compatibles si les changements de carte sont de classe $C^\infty$.

- id: atlas
  terme: atlas
  defini_dans: gd-varietes
  definition: |
    Une famille de [[carte|cartes]] deux à deux compatibles dont les domaines recouvrent l'espace. Tout atlas est contenu dans un unique atlas maximal.

- id: variete-differentiable
  terme: variété différentiable
  defini_dans: gd-varietes
  definition: |
    Un espace topologique [[separe|séparé]], à base au plus [[denombrable]], muni d'un [[atlas]] maximal de cartes à valeurs dans $\mathbb R^n$ ; $n$ est sa dimension.

- id: application-lisse
  terme: application lisse
  defini_dans: gd-applications-lisses
  definition: |
    Une application continue entre [[variete-differentiable|variétés]] dont toutes les expressions dans des cartes sont de classe $C^\infty$.

- id: espace-tangent
  terme: espace tangent
  notation: '$T_pM$'
  defini_dans: gd-espace-tangent
  definition: |
    En un point $p$ d'une [[variete-differentiable|variété]] de dimension $n$, l'espace vectoriel $T_pM$ de dimension $n$ formé des vecteurs de $\mathbb R^n$ lus dans une carte, identifiés par les différentielles des changements de carte. Pour une sous-variété de $\mathbb R^n$, il est canoniquement isomorphe à l'espace tangent défini par les vitesses des courbes.
  voir: [espace-tangent-sv, espace-tangent-niveau]

- id: fibre-tangent
  terme: fibré tangent
  notation: '$TM$'
  defini_dans: gd-fibre-tangent
  definition: |
    La réunion $TM$ des [[espace-tangent|espaces tangents]] d'une variété $M$ de dimension $n$. C'est une variété de dimension $2n$, localement difféomorphe à $U \times \mathbb R^n$.

- id: champ-vecteurs
  terme: champ de vecteurs
  defini_dans: gd-fibre-tangent
  definition: |
    Une application lisse $X : M \to TM$ qui associe à chaque point $p$ un vecteur de $T_pM$.
  voir: [fibre-tangent]

- id: groupe-symetrique
  terme: groupe symétrique
  notation: '$\mathfrak S(E),\ \mathfrak S_n$'
  defini_dans: a-groupe
  definition: |
    Le [[groupe]] $\mathfrak S(E)$ des [[bijection|bijections]] d'un ensemble $E$ sur lui-même, muni de la composition ; pour $E = \{1, \dots, n\}$, on le note $\mathfrak S_n$. Il n'est pas abélien dès que $E$ contient trois éléments distincts. Le chapitre des déterminants montrera que $\mathfrak S_n$ est engendré par les transpositions, qui échangent deux éléments et fixent les autres.

- id: signature-permutation
  terme: signature (permutation)
  defini_dans: v-permutations
  definition: |
    Le morphisme $\varepsilon : \mathfrak S_n \to \{1, -1\}$ qui vaut $-1$ sur les transpositions. $\varepsilon(\sigma)$ vaut $(-1)^k$ si $\sigma$ inverse l'ordre de $k$ paires $\{i, j\}$.
  voir: [groupe-symetrique]

- id: forme-alternee
  terme: forme alternée
  defini_dans: v-formes-alternees
  definition: |
    Une forme $n$-linéaire qui s'annule dès que deux de ses arguments sont égaux. Sur un espace de dimension $n$, les formes $n$-linéaires alternées forment un espace de dimension $1$.

- id: determinant
  terme: déterminant
  defini_dans: v-determinant
  definition: |
    Le scalaire $\det u$ par lequel un [[endomorphisme]] $u$ multiplie les [[forme-alternee|formes alternées]] de rang maximal ; pour une matrice, $\det A = \sum_{\sigma} \varepsilon(\sigma) \prod_j a_{\sigma(j)\, j}$. Il est multiplicatif, et $u$ est inversible si et seulement si $\det u \neq 0$.
  voir: [signature-permutation]

- id: tribu
  terme: tribu
  defini_dans: m-tribus
  definition: |
    Une partie de $\mathcal P(X)$ qui contient $X$ et qui est stable par complémentaire et par réunion [[denombrable]]. Ses éléments sont les parties mesurables.

- id: tribu-borelienne
  terme: tribu borélienne
  notation: '$\mathcal B(\mathbb R)$'
  defini_dans: m-tribus
  definition: |
    La plus petite [[tribu]] contenant les ouverts. Sur $\mathbb R$, elle est engendrée par les intervalles $]a, b]$ ; ses éléments sont les boréliens.

- id: mesure
  terme: mesure
  defini_dans: m-mesures
  definition: |
    Une application $\mu$ définie sur une [[tribu]], à valeurs dans $[0, +\infty]$, nulle en $\varnothing$ et σ-additive : la mesure d'une réunion dénombrable disjointe est la somme des mesures.

- id: negligeable
  terme: négligeable
  defini_dans: m-mesures
  definition: |
    Une partie mesurable de [[mesure]] nulle. Pour la mesure de Lebesgue, toute partie dénombrable est négligeable, mais il existe aussi des négligeables non dénombrables.

- id: presque-partout
  terme: presque partout
  defini_dans: m-mesures
  definition: |
    Une propriété est vraie presque partout si elle est vraie hors d'un ensemble [[negligeable]].

- id: mesure-exterieure
  terme: mesure extérieure
  defini_dans: m-caratheodory
  definition: |
    Une application $\mu^* : \mathcal P(X) \to [0, +\infty]$, nulle en $\varnothing$, croissante et dénombrablement sous-additive. Le théorème de Carathéodory en extrait une [[mesure]] sur la tribu des parties qui découpent additivement toute partie.

- id: mesure-lebesgue
  terme: mesure de Lebesgue
  defini_dans: m-lebesgue
  definition: |
    L'unique [[mesure]] sur les boréliens de $\mathbb R$ qui donne à tout intervalle $]a, b]$ sa longueur $b - a$. Elle est invariante par translation, et se prolonge à la [[partie-lebesgue-mesurable|tribu de Lebesgue]], qui est [[mesure-complete|complète]].

- id: fonction-mesurable
  terme: fonction mesurable
  defini_dans: m-mesurables
  definition: |
    Une fonction $f$ à valeurs réelles ou dans $[0, +\infty]$ telle que $\{f > a\}$ soit mesurable pour tout réel $a$ ; de façon équivalente, l'image réciproque de tout borélien est mesurable.

- id: fonction-etagee
  terme: fonction étagée
  defini_dans: m-etagees
  definition: |
    Une [[fonction-mesurable|fonction mesurable]] qui ne prend qu'un nombre fini de valeurs, c'est-à-dire une combinaison finie $\sum c_i \mathbf 1_{A_i}$ d'indicatrices de parties mesurables.

- id: integrale-lebesgue
  terme: intégrale (Lebesgue)
  defini_dans: m-integrale
  definition: |
    Pour $f \geqslant 0$ mesurable, la borne supérieure des $\sum c_i \mu(A_i)$ sur les [[fonction-etagee|fonctions étagées]] $\sum c_i \mathbf 1_{A_i} \leqslant f$. Elle prolonge l'intégrale de Riemann.

- id: integrable-lebesgue
  terme: intégrable (Lebesgue)
  defini_dans: m-integrables
  definition: |
    Une fonction mesurable réelle $f$ telle que $\int |f| \, d\mu < +\infty$. Son intégrale est $\int f^+ - \int f^-$.
  voir: [riemann-integrable]

- id: mesure-produit
  terme: mesure produit
  defini_dans: m-produit
  definition: |
    L'unique [[mesure]] $\mu \otimes \nu$ sur la [[tribu-produit|tribu produit]] telle que $(\mu \otimes \nu)(A \times B) = \mu(A)\nu(B)$, pour des mesures σ-finies. Le théorème de Fubini calcule ses intégrales par intégrations successives.

- id: cube-dyadique
  terme: cube dyadique
  defini_dans: cv-dyadiques
  definition: |
    Pour $k \in \mathbb N$ et $m \in \mathbb Z^n$, le [[pave-semi-ouvert|pavé]] $Q_{k,m} = \prod_i \,]m_i 2^{-k}, (m_i + 1)2^{-k}]$ de $\mathbb R^n$, de niveau $k$ et de côté $2^{-k}$. Les cubes d'un même niveau forment une partition de $\mathbb R^n$, deux cubes dyadiques sont disjoints ou emboîtés, et tout ouvert est la réunion disjointe d'une famille au plus dénombrable de cubes dyadiques dont les adhérences y sont contenues.

- id: transvection
  terme: transvection
  defini_dans: cv-elementaires
  definition: |
    La matrice $T_{ij}(s) = I_n + sE_{ij}$, pour $i \neq j$, où $E_{ij}$ n'a qu'un coefficient non nul, égal à $1$, en ligne $i$ et colonne $j$. La multiplier à gauche ajoute à la ligne $i$ la ligne $j$ multipliée par $s$. Son [[determinant|déterminant]] vaut $1$, et, pour $K = \mathbb R$, elle conserve la mesure de Lebesgue.

- id: jacobien
  terme: jacobien
  defini_dans: cv-changement
  definition: |
    Pour une application $\varphi$ de classe $C^1$ entre ouverts de $\mathbb R^n$, la fonction $J_\varphi(x) = \det d\varphi(x)$, déterminant de la matrice jacobienne ; la même lettre $J$ désigne ailleurs la matrice jacobienne elle-même, dont c'est ici le déterminant. Pour un [[diffeomorphisme|difféomorphisme]], sa valeur absolue est le facteur local de dilatation des volumes : $\lambda(\varphi(E)) = \int_E |J_\varphi|\,d\lambda$.

- id: coordonnees-polaires
  terme: coordonnées polaires
  defini_dans: cv-polaires
  definition: |
    L'application $P(r, \theta) = (r\cos\theta, r\sin\theta)$, [[diffeomorphisme|difféomorphisme]] de $]0, +\infty[ \times \,]{-\pi}, \pi[$ sur le plan privé de la demi-droite $]{-\infty}, 0] \times \{0\}$, de jacobien $r$. Elle donne $\int_{\mathbb R^2} f = \int\!\int f(r\cos\theta, r\sin\theta)\,r\,dr\,d\theta$.

- id: courbe-parametree
  terme: courbe paramétrée
  defini_dans: cb-courbes
  definition: |
    Une application $\gamma : I \to \mathbb R^n$ de [[classe-ck|classe $C^k$]], $k \geqslant 1$, sur un [[intervalle]] ouvert. Elle est régulière si sa vitesse $\gamma'(t)$ ne s'annule jamais ; une courbe régulière n'a ni pointe ni arrêt, et se reparamètre par sa longueur.

- id: longueur-courbe
  terme: longueur (d'une courbe)
  notation: '$L_a^b(\gamma)$'
  defini_dans: cb-courbes
  definition: |
    L'intégrale $L_a^b(\gamma) = \int_a^b \|\gamma'(t)\|\,dt$ de la norme de la vitesse d'une [[courbe-parametree|courbe paramétrée]]. Elle ne dépend pas du paramétrage, et majore la distance $\|\gamma(b) - \gamma(a)\|$, avec égalité pour un segment parcouru dans un seul sens.

- id: abscisse-curviligne
  terme: abscisse curviligne
  defini_dans: cb-abscisse
  definition: |
    Pour une [[courbe-parametree|courbe paramétrée]] régulière, la fonction $s(t) = \int_{t_0}^t \|\gamma'\|$, longueur algébrique de l'arc depuis $t_0$. C'est un difféomorphisme, et $\gamma \circ s^{-1}$ est parcourue à vitesse $1$ : la courbe est alors [[parametree-longueur|paramétrée par la longueur]].

- id: courbure-courbe
  terme: courbure (d'une courbe)
  notation: '$\kappa$'
  defini_dans: cb-courbure-plane
  definition: |
    Pour une courbe plane $\delta$ [[parametree-longueur|paramétrée par la longueur]], la courbure algébrique $\kappa = \det(\delta', \delta'')$, vitesse de rotation de la tangente, positive quand la courbe tourne à gauche. Un cercle de rayon $R$ parcouru dans le sens direct a la courbure $\frac1R$. Pour une courbe de l'espace, le nœud {{cb-frenet|Repère de Frenet}} appellera courbure la norme de l'accélération, $\kappa = \|\delta''\|$.

- id: repere-frenet
  terme: repère de Frenet
  defini_dans: cb-courbure-plane
  definition: |
    Dans le plan, le couple $(T, N)$ formé de la tangente unitaire d'une courbe [[parametree-longueur|paramétrée par la longueur]] et de sa rotation d'un quart de tour. Dans l'espace, le nœud {{cb-frenet|Repère de Frenet}} posera, pour une courbe dont l'accélération ne s'annule pas, le triplet [[famille-orthonormee|orthonormé]] direct $(T, N, B)$ : tangente $T = \delta'$, normale principale $N = \delta''/\|\delta''\|$ et binormale $B = T \wedge N$, dont les dérivées sont données par les formules de Frenet-Serret.

- id: produit-vectoriel
  terme: produit vectoriel
  notation: '$u \wedge v$'
  defini_dans: cb-frenet
  definition: |
    Dans $\mathbb R^3$, le vecteur $u \wedge v = (u_2v_3 - u_3v_2, u_3v_1 - u_1v_3, u_1v_2 - u_2v_1)$, caractérisé par $\langle u \wedge v, w \rangle = \det(u, v, w)$. Il est orthogonal à $u$ et à $v$, de norme $\sqrt{\|u\|^2\|v\|^2 - \langle u, v \rangle^2}$, et nul si et seulement si $u$ et $v$ sont liés.

- id: torsion-courbe
  terme: torsion (d'une courbe)
  notation: '$\tau$'
  defini_dans: cb-frenet
  definition: |
    Pour une courbe de l'espace [[parametree-longueur|paramétrée par la longueur]], d'accélération non nulle, le nombre $\tau = \langle N', B \rangle$, où $N$ et $B$ sont la normale principale et la binormale du [[repere-frenet|repère de Frenet]] : la vitesse à laquelle le plan osculateur tourne autour de la tangente. Elle est nulle si et seulement si la courbe est plane.

- id: deplacement
  terme: déplacement
  defini_dans: cb-fondamental
  definition: |
    Une application $x \mapsto Ax + c$ de $\mathbb R^3$, où $A$ est une [[matrice-orthogonale|matrice orthogonale]] de déterminant $1$ : la composée d'une rotation et d'une translation. Elle conserve distances, angles et orientation ; deux courbes [[courbe-bireguliere|birégulières]] [[parametree-longueur|paramétrées par la longueur]], de mêmes courbure et torsion, se déduisent l'une de l'autre par un déplacement. Les déplacements du plan, définis plus tôt avec les courbes planes, ont leur entrée propre.

- id: surface-parametree
  terme: surface paramétrée régulière
  defini_dans: sf-surfaces
  definition: |
    Une application $x : U \to \mathbb R^3$ de [[classe-ck|classe $C^\infty$]] sur un ouvert $U$ de $\mathbb R^2$, telle que $x_u \wedge x_v$ ne s'annule jamais ; son plan tangent en $(u, v)$ est engendré par $x_u$ et $x_v$. Localement, son image est une [[sous-variete|sous-variété]] de dimension $2$, et toute telle sous-variété se paramètre ainsi au voisinage de chaque point.

- id: premiere-forme-fondamentale
  terme: première forme fondamentale
  notation: '$E, F, G$'
  defini_dans: sf-premiere-forme
  definition: |
    Pour une [[surface-parametree|surface paramétrée régulière]], la restriction du [[produit-scalaire|produit scalaire]] au plan tangent, de coefficients $E = \|x_u\|^2$, $F = \langle x_u, x_v \rangle$ et $G = \|x_v\|^2$. Elle donne les longueurs des courbes tracées sur la surface, leurs angles et les aires ; deux surfaces de mêmes $E, F, G$ sont [[surfaces-isometriques|isométriques]].

- id: aire-surface
  terme: aire (d'une surface paramétrée)
  defini_dans: sf-aire
  definition: |
    Pour une [[surface-parametree|surface paramétrée régulière]] $x$ et un borélien $D$ de l'ouvert des paramètres, $\mathcal A_x(D) = \int_D \sqrt{EG - F^2}\,d\lambda = \int_D \|x_u \wedge x_v\|\,d\lambda$. Elle ne dépend pas du paramétrage ; la sphère de rayon $R$ a pour aire $4\pi R^2$.

- id: application-gauss
  terme: application de Gauss
  notation: '$N$'
  defini_dans: sf-gauss
  definition: |
    Pour une [[surface-parametree|surface paramétrée régulière]], le vecteur normal unitaire $N = \frac{x_u \wedge x_v}{\|x_u \wedge x_v\|}$, vu comme une application à valeurs dans la sphère unité. Sa différentielle mesure la façon dont le plan tangent tourne quand on se déplace sur la surface.

- id: seconde-forme-fondamentale
  terme: seconde forme fondamentale
  notation: '$e, f, g$'
  defini_dans: sf-gauss
  definition: |
    Pour une [[surface-parametree|surface paramétrée régulière]], la forme quadratique $I\!I(w) = \langle W(w), w \rangle$ sur le plan tangent, de coefficients $e = \langle x_{uu}, N \rangle$, $f = \langle x_{uv}, N \rangle$, $g = \langle x_{vv}, N \rangle$, où $W$ est l'[[endomorphisme-weingarten|endomorphisme de Weingarten]]. La valeur $I\!I(w)$ en un vecteur unitaire est la [[courbure-normale|courbure normale]] dans la direction $w$.

- id: endomorphisme-weingarten
  terme: endomorphisme de Weingarten
  notation: '$W$'
  defini_dans: sf-gauss
  definition: |
    L'[[endomorphisme]] $W$ du plan tangent d'une [[surface-parametree|surface paramétrée régulière]] défini par $W \circ dx = -dN$, où $N$ est l'[[application-gauss|application de Gauss]]. Il est autoadjoint ; ses valeurs propres sont les courbures principales, son déterminant la courbure de Gauss.

- id: courbures-principales
  terme: courbures principales
  notation: '$k_1, k_2$'
  defini_dans: sf-courbures
  definition: |
    Les deux valeurs propres $k_1 \geqslant k_2$ de l'[[endomorphisme-weingarten|endomorphisme de Weingarten]] en un point d'une surface : le maximum et le minimum de la [[courbure-normale|courbure normale]], atteints dans deux directions orthogonales. Pour $w$ unitaire faisant l'angle $\theta$ avec la première, la courbure normale vaut $k_1\cos^2\theta + k_2\sin^2\theta$ (formule d'Euler).

- id: courbure-gauss
  terme: courbure de Gauss
  notation: '$K$'
  defini_dans: sf-courbures
  definition: |
    Le produit $K = k_1k_2$ des [[courbures-principales|courbures principales]], déterminant de l'endomorphisme de Weingarten, égal à $\frac{eg - f^2}{EG - F^2}$. Elle ne dépend pas de l'orientation. Le Theorema egregium ({{sf-egregium|Theorema egregium}}) montrera qu'elle ne dépend que de la première forme fondamentale, et le nœud {{sf-exemples|Premiers exemples}} qu'elle vaut $\frac1{R^2}$ sur une sphère de rayon $R$, $0$ sur un plan ou un cylindre.

- id: courbure-moyenne
  terme: courbure moyenne
  notation: '$H$'
  defini_dans: sf-courbures
  definition: |
    La demi-somme $H = \frac12(k_1 + k_2)$ des [[courbures-principales|courbures principales]], demi-trace de l'endomorphisme de Weingarten. Elle change de signe avec l'orientation. Les surfaces où elle est nulle sont les surfaces minimales.

- id: surface-minimale
  terme: surface minimale
  defini_dans: sf-tore-catenoide
  definition: |
    Une surface dont la [[courbure-moyenne|courbure moyenne]] est identiquement nulle : en chaque point, les courbures principales sont opposées. Le plan, la caténoïde et l'hélicoïde en sont des exemples ; un film de savon tendu sur un contour en prend la forme.

- id: symboles-christoffel
  terme: symboles de Christoffel
  notation: '$\Gamma^k_{ij}$'
  defini_dans: sf-christoffel
  definition: |
    Pour une [[surface-parametree|surface paramétrée régulière]], les coefficients des composantes tangentes des dérivées secondes : $x_{uu} = \Gamma^1_{11}x_u + \Gamma^2_{11}x_v + eN$, et de même pour $x_{uv}$ et $x_{vv}$. Ils s'expriment par $E$, $F$, $G$ et leurs dérivées premières, et gouvernent l'équation des géodésiques.

- id: geodesique
  terme: géodésique
  defini_dans: sf-geodesiques
  definition: |
    Une courbe tracée sur une surface dont l'accélération est partout normale à la surface. Elle est parcourue à vitesse constante et satisfait une équation différentielle du second ordre qui ne dépend que de la [[premiere-forme-fondamentale|première forme fondamentale]]. Sur la sphère, ce sont les grands cercles parcourus à vitesse constante non nulle, et les courbes constantes : le point (v) du nœud montre que ces grands cercles en sont, et sa remarque déduit de l'unicité (iii), avec le changement d'échelle (iv), qu'il n'y en a pas d'autres ; le nœud {{sf-minimisation|Minimisation locale}} montrera qu'une géodésique minimise localement la longueur.

- id: application-exponentielle
  terme: application exponentielle
  notation: '$\operatorname{Exp}_m$'
  defini_dans: sf-exponentielle
  definition: |
    En un point $m$ d'une surface paramétrée, l'application qui envoie un vecteur $w$ sur la position au temps $1$ de la [[geodesique|géodésique]] issue de $m$ avec la vitesse $w$. Elle est de classe $C^\infty$, de différentielle l'identité en $0$, donc un difféomorphisme d'une petite boule sur un voisinage de $m$.

- id: coordonnees-polaires-geodesiques
  terme: coordonnées polaires géodésiques
  defini_dans: sf-polaires
  definition: |
    Les paramètres $(r, \theta)$ d'une surface paramétrée $x$ au voisinage d'un point $p = x(m)$ donnés par $X(r, \theta) = x\big(\operatorname{Exp}_m(r\,\omega(\theta))\big)$ : $r$ est la distance à $p$ le long de la géodésique de direction $\theta$. Le lemme de Gauss y donne la première forme $dr^2 + G\,d\theta^2$, et la courbure de Gauss y vaut $-\frac{(\sqrt G)_{rr}}{\sqrt G}$.

- id: courbure-geodesique
  terme: courbure géodésique
  notation: '$k_g$'
  defini_dans: sf-courbure-geodesique
  definition: |
    Pour une courbe $c$ tracée sur une surface orientée et [[parametree-longueur|paramétrée par la longueur]], la composante $k_g = \langle c'', N \wedge c' \rangle$ de l'accélération sur le vecteur tangent orthogonal à $c'$. Elle est nulle si et seulement si $c$ est une [[geodesique|géodésique]] ; dans le plan, c'est la courbure algébrique.

- id: triangle-geodesique
  terme: triangle géodésique
  defini_dans: sf-gauss-bonnet
  definition: |
    Une région d'une surface bordée par trois arcs de [[geodesique|géodésiques]]. Pour un triangle contenu dans des coordonnées polaires géodésiques centrées en l'un de ses sommets, la formule de Gauss-Bonnet dit que la somme de ses angles dépasse $\pi$ de l'intégrale de la courbure de Gauss sur la région : de son aire sur la sphère unité, de rien dans le plan.

- id: metrique-riemannienne
  terme: métrique riemannienne
  defini_dans: sf-riemann
  definition: |
    Sur une [[variete-differentiable|variété différentiable]], la donnée d'un [[produit-scalaire|produit scalaire]] sur chaque espace tangent, lu dans les cartes comme une matrice [[matrice-symetrique|symétrique]] définie positive de classe $C^\infty$, compatible aux changements de cartes. Elle définit la longueur des courbes ; la première forme fondamentale d'une surface de $\mathbb R^3$ en est l'exemple fondateur.

- id: divergence
  terme: divergence
  defini_dans: cv-liouville
  definition: |
    Pour un champ de vecteurs $X$ de classe $C^1$ sur un ouvert de $\mathbb R^n$, la fonction $\operatorname{div} X = \operatorname{tr} dX = \sum_i \partial_i X_i$. Elle mesure le taux de variation du volume le long du [[flot]] : si elle est nulle, le flot conserve la mesure de Lebesgue (théorème de Liouville).

- id: espace-probabilise
  terme: espace probabilisé
  defini_dans: p-espace
  definition: |
    Un espace mesuré $(\Omega, \mathcal A, P)$ de masse totale $P(\Omega) = 1$ ; la mesure $P$ est une [[probabilite|probabilité]]. Les éléments de $\mathcal A$ sont les événements ; c'est le cadre axiomatique de Kolmogorov (1933).

- id: independance
  terme: indépendance
  defini_dans: p-independance
  definition: |
    Des tribus, des événements ou des variables sont indépendants si la probabilité de toute intersection finie d'événements pris dans des tribus distinctes est le produit des probabilités. L'indépendance deux à deux ne suffit pas.

- id: variable-aleatoire
  terme: variable aléatoire
  defini_dans: p-variables
  definition: |
    Une fonction mesurable $X$ définie sur un [[espace-probabilise|espace probabilisé]], à valeurs réelles. Ce n'est ni une variable, ni aléatoire : c'est une fonction, et le hasard est porté par $P$.

- id: loi-variable
  terme: loi (d'une variable aléatoire)
  defini_dans: p-variables
  definition: |
    La [[probabilite|probabilité]] $P_X(B) = P(X \in B)$ sur les boréliens de $\mathbb R$, image de $P$ par la [[variable-aleatoire|variable]] $X$. Elle est déterminée par la [[fonction-repartition|fonction de répartition]] $x \mapsto P(X \leqslant x)$.

- id: esperance
  terme: espérance
  defini_dans: p-esperance
  definition: |
    L'intégrale $E[X] = \int X \, dP$ d'une [[variable-aleatoire|variable aléatoire]] positive ou intégrable. Elle se calcule sur la loi : $E[\varphi(X)] = \int \varphi \, dP_X$.

- id: espace-norme
  terme: espace vectoriel normé
  defini_dans: f-evn
  definition: |
    Un espace vectoriel réel muni d'une norme $\|\cdot\|$ : $\|x\| = 0$ seulement pour $x = 0$, $\|\lambda x\| = |\lambda|\,\|x\|$, $\|x + y\| \leqslant \|x\| + \|y\|$. C'est un [[espace-metrique]] pour la distance $\|x - y\|$.

- id: banach
  terme: espace de Banach
  defini_dans: f-evn
  definition: |
    Un [[espace-norme|espace vectoriel normé]] [[espace-complet|complet]]. De façon équivalente, toute série absolument convergente y converge.

- id: dual-topologique
  terme: dual topologique
  notation: "$E'$"
  defini_dans: f-operateurs
  definition: |
    L'espace $E'$ des [[forme-lineaire|formes linéaires]] continues sur un espace normé $E$, muni de la norme d'opérateur. C'est toujours un [[banach|espace de Banach]].
  voir: [espace-dual]

- id: norme-operateur
  terme: norme d'opérateur
  defini_dans: f-operateurs
  definition: |
    Pour $u$ linéaire continue, $|||u||| = \sup\{\|u(x)\| : \|x\| \leqslant 1\}$, plus petite constante $C$ telle que $\|u(x)\| \leqslant C\|x\|$.

- id: espace-hilbert
  terme: espace de Hilbert
  defini_dans: f-hilbert
  definition: |
    Un espace vectoriel réel muni d'un [[produit-scalaire|produit scalaire]] et complet pour la norme associée. Exemples : $\mathbb R^n$, $\ell^2$, $L^2(\mu)$. On y projette sur tout [[partie-convexe-ev|convexe]] fermé non vide.

- id: base-hilbertienne
  terme: base hilbertienne
  defini_dans: f-bases-hilbertiennes
  definition: |
    Une famille [[famille-orthonormee|orthonormale]] d'un [[espace-hilbert|espace de Hilbert]] dont l'espace engendré est dense. Tout vecteur est alors la somme de la série $\sum \langle x, e_n \rangle e_n$, sans être en général combinaison linéaire finie des $e_n$.
  voir: [base-vectorielle]

- id: operateur-autoadjoint
  terme: opérateur autoadjoint
  defini_dans: f-autoadjoints
  definition: |
    Un opérateur linéaire continu $u$ d'un [[espace-hilbert|espace de Hilbert]] tel que $\langle u(x), y \rangle = \langle x, u(y) \rangle$ pour tous $x, y$. Ses [[sous-espace-propre|sous-espaces propres]] sont deux à deux orthogonaux, l'[[orthogonal-partie|orthogonal]] d'un sous-espace stable est stable, et sa norme est la borne supérieure de $|\langle u(x), x \rangle|$ sur la boule unité. Sur $\mathbb R^n$ muni du [[produit-scalaire|produit scalaire]] usuel, les applications $x \mapsto Ax$ autoadjointes sont celles dont la matrice $A$ est [[matrice-symetrique|symétrique]].
  voir: [quotient-rayleigh]

- id: quotient-rayleigh
  terme: quotient de Rayleigh
  notation: $R_u$
  defini_dans: f-autoadjoints
  definition: |
    Pour un [[operateur-autoadjoint|opérateur autoadjoint]] $u$, la fonction $R_u(x) = \langle u(x), x \rangle / \|x\|^2$, définie pour $x \neq 0$. En un point où elle atteint son maximum ou son minimum, $x$ est un [[vecteur-propre|vecteur propre]], de [[valeur-propre|valeur propre]] $R_u(x)$ ; en dimension finie, ces extrema existent par compacité de la sphère unité.

- id: matrice-orthogonale
  terme: matrice orthogonale
  defini_dans: f-spectral-fini
  definition: |
    Une matrice $P \in \mathcal M_n(\mathbb R)$ telle que ${}^tP\,P = I_n$, c'est-à-dire dont les colonnes forment une base [[famille-orthonormee|orthonormée]] de $\mathbb R^n$ ; elle est [[matrice-inversible|inversible]], d'inverse ${}^tP$. Par le théorème spectral, toute matrice [[matrice-symetrique|symétrique]] réelle s'écrit $PD\,{}^tP$, avec $P$ orthogonale et $D$ [[matrice-diagonale|diagonale]].
  voir: [groupe-orthogonal]

- id: operateur-compact
  terme: opérateur compact
  defini_dans: f-compacts
  definition: |
    Une application linéaire $u : E \to F$ entre [[espace-norme|espaces normés]] telle que l'adhérence de l'image de la boule unité fermée soit [[compact|compacte]]. Elle est alors continue. Les opérateurs continus [[operateur-rang-fini|de rang fini]] sont compacts, ainsi que leurs limites pour la [[norme-operateur|norme d'opérateur]] lorsque $F$ est complet ; l'identité d'un espace de Hilbert de dimension infinie ne l'est pas.

- id: intervalle-dyadique
  terme: intervalle dyadique
  defini_dans: f-haar
  definition: |
    Un intervalle $I_{j,k} = [k2^{-j}, (k+1)2^{-j}[$ de $[0, 1[$, avec $j \in \mathbb N$ et $0 \leqslant k < 2^j$. Ceux d'un même rang $j$ partagent $[0, 1[$ en $2^j$ intervalles de longueur $2^{-j}$, et deux intervalles dyadiques sont toujours disjoints ou emboîtés.

- id: systeme-haar
  terme: système de Haar
  defini_dans: f-haar
  definition: |
    La famille des fonctions $h_{j,k} = 2^{j/2}\big(\mathbf 1_{I_{j+1,2k}} - \mathbf 1_{I_{j+1,2k+1}}\big)$, qui valent $\pm 2^{j/2}$ sur les deux moitiés de l'[[intervalle-dyadique|intervalle dyadique]] $I_{j,k}$ et $0$ ailleurs. Complétée par la constante $1$, c'est une [[base-hilbertienne|base hilbertienne]] de $L^2([0, 1])$ pour la mesure de Lebesgue.
  voir: [base-hilbertienne]

- id: logarithme
  terme: logarithme
  defini_dans: ex-logarithme
  definition: |
    La fonction $\ln x = \int_1^x \frac{dt}{t}$, définie pour $x > 0$ par une intégrale orientée. C'est une bijection strictement croissante de $]0, +\infty[$ sur $\mathbb R$, dérivable de dérivée $\frac1x$, qui transforme les produits en sommes ; sa réciproque est l'exponentielle réelle. Elle permet de définir les puissances $x^a = \exp(a\ln x)$ pour $x > 0$, $a$ réel, et, en analyse complexe, $a$ complexe.

- id: fonction-zeta
  terme: fonction zêta
  defini_dans: nb-zeta
  definition: |
    La fonction $\zeta(s) = \sum_{n \geqslant 1} n^{-s}$, [[holomorphe]] sur $\operatorname{Re} s > 1$, prolongée à $\operatorname{Re} s > 0$ avec un [[pole|pôle simple]] en $1$.

- id: produit-euler
  terme: produit eulérien
  defini_dans: nb-euler
  definition: |
    L'égalité $\zeta(s) = \prod_p (1 - p^{-s})^{-1}$ pour $\operatorname{Re} s > 1$, traduction analytique de la décomposition en facteurs premiers.
  voir: [fonction-zeta]

- id: fonction-tchebychev
  terme: fonction de Tchebychev
  defini_dans: nb-chebyshev
  definition: |
    La fonction $\theta(x) = \sum_{p \leqslant x} \ln p$, somme sur les [[nombre-premier|nombres premiers]]. Le nœud {{nb-tnp|Théorème des nombres premiers}} montrera que $\theta(x) \sim x$, et en déduira le théorème des nombres premiers.

- id: fonction-compte-premiers
  terme: fonction de compte des nombres premiers
  defini_dans: nb-chebyshev
  definition: |
    La fonction $\pi(x)$, nombre de [[nombre-premier|nombres premiers]] inférieurs ou égaux à $x$. Le théorème des nombres premiers, démontré au nœud {{nb-tnp|Théorème des nombres premiers}}, affirme que $\pi(x) \sim x/\ln x$.

- id: produit-exterieur
  terme: produit extérieur
  defini_dans: v-algebre-exterieure
  definition: |
    Le produit bilinéaire et associatif $\wedge$ des formes alternées, caractérisé par $(\varphi_1 \wedge \cdots \wedge \varphi_k)(x_1, \dots, x_k) = \det(\varphi_a(x_b))$ pour des [[forme-lineaire|formes linéaires]]. Il vérifie $\alpha \wedge \beta = (-1)^{kl}\beta \wedge \alpha$.
  voir: [forme-alternee]

- id: orientation
  terme: orientation
  defini_dans: gd-orientation
  definition: |
    Sur un espace vectoriel réel, une des deux classes de bases, deux bases étant équivalentes si la [[matrice-passage|matrice de passage]] a un [[determinant|déterminant]] positif. Une variété est orientable si elle a un atlas dont tous les changements de carte ont un jacobien de déterminant positif.

- id: forme-volume
  terme: forme volume
  defini_dans: gd-formes-varietes
  definition: |
    Sur une variété de dimension $n \geqslant 1$, une [[forme-differentielle|forme différentielle]] de degré $n$ qui ne s'annule en aucun point : dans chaque carte, son coefficient $a_\varphi$ devant $dz_1 \wedge \cdots \wedge dz_n$ ne s'annule pas. Une variété qui porte une forme volume est orientable. Le nœud {{gd-forme-volume|Forme volume}} montrera que deux formes volume diffèrent d'un facteur lisse qui ne s'annule pas, et que toute variété orientable en porte une ; cette réciproque use en général du [[choix-denombrable|choix dénombrable]] ⋆, dont on se passe pour une variété compacte, ou quand une suite de cartes directes qui la recouvre est donnée.
  voir: [orientation, variete-orientee]

- id: variete-orientee
  terme: variété orientée
  defini_dans: gd-forme-volume
  definition: |
    Une variété de dimension $n \geqslant 1$ munie d'une orientation, c'est-à-dire d'un [[atlas-oriente|atlas orienté]] maximal : tous ses changements de carte ont un jacobien de déterminant strictement positif, et il n'est contenu dans aucun autre atlas orienté. Tout atlas orienté est contenu dans une seule orientation ; une [[forme-volume|forme volume]] en détermine une, celle des cartes où son coefficient est positif.
  voir: [orientation, forme-volume]

- id: forme-differentielle
  terme: forme différentielle
  defini_dans: gd-formes
  definition: |
    Une application $C^\infty$ qui associe à chaque point une forme alternée de degré $k$ ; sur un ouvert de $\mathbb R^n$, $\omega = \sum_I a_I\,dx_I$. La [[differentielle-exterieure|différentielle extérieure]] $d$ vérifie $d \circ d = 0$ et commute aux images réciproques.
  voir: [produit-exterieur]

- id: cohomologie-de-rham
  terme: cohomologie de de Rham
  notation: '$H^k(U)$'
  defini_dans: gd-de-rham
  definition: |
    Le quotient $H^k$ des [[forme-differentielle|formes différentielles]] [[forme-fermee|fermées]] de degré $k$ par les formes [[forme-exacte|exactes]]. Il mesure l'obstruction à résoudre $d\eta = \omega$ ; il est nul en degré $k \geqslant 1$ sur un ouvert [[partie-etoilee|étoilé]].

- id: fonction-plateau
  terme: fonction plateau
  defini_dans: gd-partition
  definition: |
    Une fonction lisse sur une variété, par exemple sur $\mathbb R^n$, nulle hors d'une partie compacte, sans être identiquement nulle. Exemple sur $\mathbb R^n$ : le produit des $\theta\big(r^2 - (y_l - p_l)^2\big)$, où $\theta(x) = e^{-1/x}$ pour $x > 0$ et $\theta(x) = 0$ sinon, strictement positif sur le cube ouvert de centre $p$ et de rayon $r$, nul ailleurs. La fonction $\theta$ est de classe $C^\infty$ et a toutes ses dérivées nulles en $0$, sans être nulle à droite de $0$ ({{ex-plateau|Fonction plate en 0}}).
  voir: [partition-unite]

- id: localement-fini
  terme: famille localement finie
  defini_dans: gd-partition
  definition: |
    Une famille de parties d'un espace topologique est localement finie si tout point a un voisinage qui ne rencontre qu'un nombre fini d'entre elles. Une somme de fonctions dont les parties non nulles forment une famille localement finie n'a, au voisinage de chaque point, qu'un nombre fini de termes non nuls.
  voir: [recouvrement]

- id: partition-unite
  terme: partition de l'unité
  defini_dans: gd-partition
  definition: |
    Sur une variété, une famille $(\chi_t)$ de fonctions lisses et positives dont les parties non nulles forment une famille [[localement-fini|localement finie]], et de somme $1$. Elle est subordonnée à une famille d'ouverts $(U_t)$, indexée par le même ensemble, si l'adhérence de $\{\chi_t \neq 0\}$ est contenue dans $U_t$ pour tout $t$. Elle sert à recoller des objets définis localement, sous la forme $\sum_t \chi_t f_t$. Toute famille d'ouverts qui recouvre la variété a une partition de l'unité subordonnée ; c'est sans choix si la variété est compacte, et la démonstration générale fait un choix dénombrable.
  voir: [fonction-plateau]

- id: homotopie-lisse
  terme: homotopie lisse
  defini_dans: dc-homotopie
  definition: |
    Une application $F$ de classe $C^\infty$, définie sur un ouvert de $\mathbb R^{n+1}$ contenant $U \times [0, 1]$, qui relie $f_0 = F(\cdot, 0)$ à $f_1 = F(\cdot, 1)$. Deux applications lissement homotopes induisent la même application en [[cohomologie-de-rham|cohomologie de de Rham]].

- id: forme-angle-solide
  terme: forme angle solide
  notation: '$\sigma_n$'
  defini_dans: dc-angle-solide
  definition: |
    La forme $|x|^{-n}\sum_i (-1)^{i-1}x_i\,dx_1 \wedge \cdots \wedge \widehat{dx_i} \wedge \cdots \wedge dx_n$ sur $\mathbb R^n \setminus \{0\}$. Elle est [[forme-fermee|fermée]] sans être [[forme-exacte|exacte]], et sa classe engendre $H^{n-1}(\mathbb R^n \setminus \{0\})$ ; pour $n = 2$, c'est $\frac{x\,dy - y\,dx}{x^2 + y^2}$.

- id: simplexe-lisse
  terme: simplexe singulier lisse
  defini_dans: dt-simplexes
  definition: |
    Un simplexe singulier $\Delta_k \to U$ qui se prolonge en une application de classe $C^\infty$ sur un ouvert contenant $\Delta_k$. On y intègre les formes de degré $k$, et la formule de Stokes y vaut.

- id: complexe-double
  terme: complexe double
  defini_dans: dt-complexe-double
  definition: |
    Une famille d'espaces $K^{p,q}$ munie de deux différentielles qui commutent, l'une augmentant $p$, l'autre $q$. Si ses rangées sont exactes, augmentées par un complexe $A$, la cohomologie de $A$ est celle du complexe total ; c'est l'outil de la démonstration du théorème de de Rham par Weil.

- id: cohomologie-support-compact
  terme: cohomologie à support compact
  notation: '$H^k_c(U)$'
  defini_dans: pc-support
  definition: |
    Le quotient des formes [[forme-fermee|fermées]] à [[support-forme|support]] compact de degré $k$ par les différentielles de formes à support compact. Elle n'est pas invariante par homotopie : $H^n_c(\mathbb R^n)$ n'est pas nul, alors que la cohomologie à support compact d'un point est nulle en degré $n \geqslant 1$. Le nœud {{pc-fibre|Poincaré à support compact}} montrera que $H^n_c(\mathbb R^n) \cong \mathbb R$, par l'intégrale, et la dualité de Poincaré ({{pc-dualite|Dualité de Poincaré}}) que la [[cohomologie-de-rham|cohomologie de de Rham]] en est le dual : $H^k(U) \cong \big(H^{n-k}_c(U)\big)^*$.

- id: dualite-poincare
  terme: dualité de Poincaré
  defini_dans: pc-dualite
  definition: |
    Pour un ouvert $U$ de $\mathbb R^n$, l'accouplement $([\omega], [\eta]) \mapsto \int_U \omega \wedge \eta$ identifie $H^k(U)$ au dual de $H^{n-k}_c(U)$. Énoncée par Poincaré en 1893 pour les nombres de Betti des variétés fermées orientables ; sa démonstration de 1895 était lacunaire, et il la reprit après la critique de Heegaard.

- id: nerf-recouvrement
  terme: nerf d'un recouvrement
  defini_dans: dt-cech-de-rham
  definition: |
    Pour une famille d'ouverts $(B_i)_{i \in I}$, l'ensemble des suites finies $(i_0, \dots, i_p)$ telles que $B_{i_0} \cap \cdots \cap B_{i_p}$ ne soit pas vide. Les fonctions réelles sur ces suites forment le complexe des [[cochaine-cech|cochaînes de Čech]].

- id: support-fonction
  terme: support d'une fonction
  notation: '$\operatorname{supp} f$'
  defini_dans: ds-test
  definition: |
    L'adhérence, dans l'ouvert de définition $\Omega$, de l'ensemble des points où une fonction continue $f$ ne s'annule pas. C'est le plus petit fermé de $\Omega$ hors duquel $f$ est nulle.
  voir: [support-distribution]

- id: fonction-test
  terme: fonction test
  notation: '$\mathcal D(\Omega)$'
  defini_dans: ds-test
  definition: |
    Une fonction de classe $C^\infty$ sur un ouvert $\Omega$ de $\mathbb R^n$, dont le [[support-fonction|support]] est compact. Une suite de fonctions test converge dans $\mathcal D(\Omega)$ si leurs supports restent dans un même compact et si chaque dérivée partielle converge uniformément.
  voir: [fonction-plateau, distribution]

- id: noyau-regularisant
  terme: noyau régularisant
  notation: '$\rho_\varepsilon$'
  defini_dans: ds-test
  definition: |
    La famille des fonctions $\rho_\varepsilon(x) = \varepsilon^{-n}\rho(x/\varepsilon)$, où $\rho$ est une [[fonction-test|fonction test]] radiale, positive, d'intégrale $1$, nulle hors de la boule unité. Chaque $\rho_\varepsilon$ est nulle hors de la boule de rayon $\varepsilon$, d'intégrale $1$ : quand $\varepsilon \to 0$, elle se concentre en $0$.
  voir: [produit-convolution]

- id: localement-integrable
  terme: fonction localement intégrable
  notation: '$L^1_{\mathrm{loc}}(\Omega)$'
  defini_dans: ds-regularisation
  definition: |
    Une fonction [[application-borelienne-rn|borélienne]] sur un ouvert $\Omega$ de $\mathbb R^n$ dont l'intégrale de la valeur absolue est finie sur tout compact de $\Omega$. Les fonctions continues en sont ; les nœuds {{ds-laplacien|Solution élémentaire du laplacien}} et {{ds-derivation|Dérivation}} montreront que $\frac1{|x|}$ sur $\mathbb R^3$ et $\ln|x|$ sur $\mathbb R$ le sont aussi.

- id: produit-convolution
  terme: produit de convolution
  defini_dans: ds-regularisation
  definition: |
    Pour une [[localement-integrable|fonction localement intégrable]] $f$ et une fonction $\varphi$ de classe $C^\infty$ nulle hors d'une boule, $(f * \varphi)(x) = \int f(y)\,\varphi(x - y)\,dy$. C'est une fonction de classe $C^\infty$, dont les dérivées sont $f * \partial^\alpha\varphi$ ; avec le [[noyau-regularisant|noyau régularisant]], $f * \rho_\varepsilon$ approche $f$ quand $f$ est continue.
  voir: [noyau-regularisant]

- id: distribution
  terme: distribution
  notation: '$\mathcal D''(\Omega)$'
  defini_dans: ds-distributions
  definition: |
    Une [[forme-lineaire|forme linéaire]] $T$ sur l'espace des [[fonction-test|fonctions test]] d'un ouvert $\Omega$, telle que $T(\varphi_k) \to T(\varphi)$ chaque fois que $\varphi_k \to \varphi$ dans $\mathcal D(\Omega)$. Une forme linéaire telle que, sur chaque compact $K$, $|T(\varphi)|$ soit majoré par une constante fois le maximum des normes uniformes des dérivées de $\varphi$ jusqu'à un ordre $m$, pour $\varphi$ nulle hors de $K$, est une distribution. La réciproque est vraie, mais sa démonstration use du [[choix-denombrable|choix dénombrable]] ⋆.

- id: masse-dirac
  terme: masse de Dirac
  notation: '$\delta_a$'
  defini_dans: ds-exemples
  definition: |
    La [[distribution]] $\varphi \mapsto \varphi(a)$. Elle n'est associée à aucune fonction localement intégrable, mais elle est limite, au sens des distributions, des translatées du [[noyau-regularisant|noyau régularisant]].

- id: valeur-principale
  terme: valeur principale de 1/x
  notation: '$\operatorname{vp}\frac1x$'
  defini_dans: ds-exemples
  definition: |
    La [[distribution]] sur $\mathbb R$ définie par $\varphi \mapsto \lim_{\varepsilon \to 0^+}\int_{|x| \geqslant \varepsilon}\frac{\varphi(x)}x\,dx = \int_0^{+\infty}\frac{\varphi(x) - \varphi(-x)}x\,dx$. Elle est d'[[ordre-distribution|ordre]] au plus $1$ ; le nœud {{ds-derivation|Dérivation}} montrera que c'est la dérivée, au sens des distributions, de $\ln|x|$.

- id: derivee-distribution
  terme: dérivée d'une distribution
  defini_dans: ds-derivation
  definition: |
    La [[distribution]] $\partial_j T$ définie par $\langle \partial_j T, \varphi\rangle = -\langle T, \partial_j\varphi\rangle$. Elle prolonge la dérivée des fonctions de classe $C^1$, par intégration par parties, et toute distribution est indéfiniment dérivable : la dérivée de la fonction de Heaviside est la masse de Dirac.

- id: laplacien
  terme: laplacien
  notation: '$\Delta$'
  defini_dans: ds-derivation
  definition: |
    L'opérateur $\Delta = \sum_j \partial_j^2$, appliqué à une fonction de classe $C^2$ ou à une [[distribution]].
  voir: [fonction-harmonique]

- id: fonction-heaviside
  terme: fonction de Heaviside
  notation: '$H$'
  defini_dans: ds-derivation
  definition: |
    L'indicatrice $H = \mathbf 1_{]0, +\infty[}$. Sa [[derivee-distribution|dérivée au sens des distributions]] est la [[masse-dirac|masse de Dirac]] en $0$, alors que sa dérivée est nulle presque partout.

- id: support-distribution
  terme: support d'une distribution
  notation: '$\operatorname{supp} T$'
  defini_dans: ds-support
  definition: |
    Le complémentaire du plus grand ouvert sur lequel une [[distribution]] $T$ s'annule, c'est-à-dire sur les fonctions test duquel elle est nulle. Le support de $\delta_a$ est $\{a\}$ ; celui d'une fonction continue est son support au sens usuel.
  voir: [support-fonction]

- id: solution-elementaire
  terme: solution élémentaire
  defini_dans: ds-laplacien
  definition: |
    Pour un opérateur différentiel $P$ à coefficients constants, une [[distribution]] $E$ sur $\mathbb R^n$ telle que $PE = \delta$. La fonction de Heaviside en est une pour $\frac{d}{dx}$, et $-\frac1{4\pi|x|}$ pour le [[laplacien]] de $\mathbb R^3$ ; la convolution par $E$ résout $Pu = f$.

- id: fonction-harmonique
  terme: fonction harmonique
  defini_dans: ha-harmoniques
  definition: |
    Une fonction de classe $C^2$ sur un ouvert de $\mathbb R^n$ dont le [[laplacien]] est nul. On montrera plus loin qu'elle est égale en chaque point à sa moyenne sur les boules centrées en ce point ({{ha-moyenne|Propriété de la moyenne}}), qu'elle est de classe $C^\infty$ ({{ha-regularite|Régularité des fonctions harmoniques}}), et que, dans le plan, elle est la [[partie-reelle|partie réelle]] d'une fonction holomorphe sur tout ouvert [[partie-convexe-complexe|convexe]] ({{ha-holomorphes|Harmoniques et holomorphes}}).

- id: propriete-moyenne
  terme: propriété de la moyenne
  defini_dans: ha-moyenne
  definition: |
    Une fonction continue $u$ sur un ouvert $\Omega$ a la propriété de la moyenne si $u(x)$ est égal à la moyenne de $u$ sur toute boule de centre $x$ dont l'adhérence est contenue dans $\Omega$. Les [[fonction-harmonique|fonctions harmoniques]] l'ont ; le nœud {{ha-regularite|Régularité des fonctions harmoniques}} montrera que, réciproquement, une fonction continue qui l'a est harmonique.

- id: probleme-dirichlet
  terme: problème de Dirichlet
  defini_dans: ha-maximum
  definition: |
    Trouver une fonction continue sur l'adhérence d'un ouvert borné, [[fonction-harmonique|harmonique]] dans l'ouvert, et égale à une fonction donnée sur la frontière. Le principe du maximum en donne l'unicité ; le nœud {{ha-poisson|Problème de Dirichlet sur le disque}} en établira l'existence sur le disque, par le noyau de Poisson.

- id: noyau-poisson
  terme: noyau de Poisson
  defini_dans: ha-poisson
  definition: |
    La fonction $P(r, t) = \frac{1 - r^2}{1 - 2r\cos t + r^2}$, pour $0 \leqslant r < 1$, [[partie-reelle|partie réelle]] de $\frac{1 + re^{it}}{1 - re^{it}}$. Sa convolution avec une fonction continue sur le cercle résout le [[probleme-dirichlet|problème de Dirichlet]] sur le disque unité.

- id: equation-chaleur
  terme: équation de la chaleur
  defini_dans: ch-noyau
  definition: |
    L'équation $\partial_t u = \partial_x^2 u$, qui régit la température $u(t, x)$ d'une barre. Les nœuds {{ch-cauchy|Problème de Cauchy}} et {{ch-maximum|Principe du maximum parabolique}} montreront que, pour une donnée initiale continue et bornée sur $\mathbb R$, elle a une unique solution bornée, obtenue par convolution avec le [[noyau-chaleur|noyau de la chaleur]].

- id: noyau-chaleur
  terme: noyau de la chaleur
  defini_dans: ch-noyau
  definition: |
    La fonction $G(t, x) = \frac1{\sqrt{4\pi t}}e^{-x^2/(4t)}$, pour $t > 0$, solution de l'[[equation-chaleur|équation de la chaleur]], positive et d'intégrale $1$ en $x$ ; elle se concentre en $0$ quand $t \to 0$.

- id: cube-singulier
  terme: cube singulier lisse
  defini_dans: dr-cubes
  definition: |
    Une application $c : [0, 1]^k \to U$, à valeurs dans un ouvert $U$ de $\mathbb R^n$, qui est la restriction d'une application de classe $C^\infty$ définie sur un ouvert contenant $[0, 1]^k$ ; ni injectivité ni rang ne sont exigés. Son bord est la somme alternée $\partial c = \sum_{i, \varepsilon} (-1)^{i+\varepsilon} c_{i,\varepsilon}$ de ses $2k$ faces $c_{i,\varepsilon}$, obtenues en fixant la $i$-ième variable à $\varepsilon \in \{0, 1\}$, et $\partial \circ \partial = 0$.
  voir: [formule-stokes]

- id: formule-stokes
  terme: formule de Stokes
  defini_dans: dr-stokes
  definition: |
    Pour une [[forme-differentielle|forme différentielle]] $\omega$ de degré $k - 1$ sur un ouvert de $\mathbb R^n$ et une chaîne $z$ de [[cube-singulier|cubes singuliers lisses]] de dimension $k$, $\int_z d\omega = \int_{\partial z} \omega$. Pour $k = 1$, c'est le théorème fondamental de l'analyse ; le nœud {{dr-green|Green-Riemann, divergence}} en déduira la formule de Green-Riemann et le théorème de la divergence.

- id: diffeomorphisme-primitif
  terme: difféomorphisme primitif
  defini_dans: dv-primitifs
  definition: |
    Un [[diffeomorphisme|difféomorphisme]] entre ouverts de $\mathbb R^n$ qui ne change qu'une coordonnée : $h_l(x) = x_l$ pour tout $l \neq i$. Au voisinage de chaque point, tout difféomorphisme est, à une permutation des coordonnées près, la composée d'une application qui garde la dernière coordonnée et d'un difféomorphisme primitif qui ne change qu'elle ; c'est ce qui permet de démontrer la formule du changement de variables par récurrence sur la dimension.

- id: demi-espace
  terme: demi-espace
  notation: '$\mathbb H^n$'
  defini_dans: dv-varietes-bord
  definition: |
    La partie $\mathbb H^n = \{x \in \mathbb R^n : x_n \geqslant 0\}$, de bord l'hyperplan $\{x_n = 0\}$, identifié à $\mathbb R^{n-1}$. Ses ouverts, pour la topologie induite, sont les modèles locaux des [[variete-a-bord|variétés à bord]] ; un difféomorphisme entre deux de ses ouverts envoie le bord sur le bord.
  voir: [variete-a-bord]

- id: variete-a-bord
  terme: variété à bord
  defini_dans: dv-varietes-bord
  definition: |
    Un espace topologique séparé, à base au plus dénombrable, muni d'un atlas maximal de cartes à valeurs dans des ouverts du [[demi-espace]] $\mathbb H^n$, dont les changements de carte sont de classe $C^\infty$, au sens des prolongements locaux. Une boule fermée en est une ; une [[variete-differentiable|variété]] en est une, de bord vide.
  voir: [demi-espace, bord-variete, orientation-induite]

- id: bord-variete
  terme: bord d'une variété à bord
  notation: '$\partial M$'
  defini_dans: dv-varietes-bord
  definition: |
    L'ensemble des points d'une [[variete-a-bord|variété à bord]] $M$ qu'une carte envoie dans l'hyperplan $\{x_n = 0\}$, ce qui ne dépend pas de la carte. Il est fermé dans $M$, et c'est, pour $n \geqslant 2$, une variété de dimension $n - 1$ ; ce n'est pas, en général, la frontière topologique.
  voir: [variete-a-bord]

- id: orientation-induite
  terme: orientation induite
  defini_dans: dv-orientation-bord
  definition: |
    L'orientation du bord $\partial M$ d'une variété à bord orientée de dimension $n \geqslant 2$ qui contient les cartes $\kappa \circ \pi \circ \varphi$, où $\varphi$ est une carte directe, $\pi(x', 0) = x'$, et $\kappa$ change le signe de la première coordonnée si $n$ est impair. C'est la convention de la normale sortante placée en premier : dans $\mathbb H^n$, la normale sortante est $-e_n$, et $\det(-e_n, e_1, \dots, e_{n-1}) = (-1)^n$. C'est celle que demandera la [[formule-stokes|formule de Stokes]] sur une variété à bord ({{dv-stokes|Stokes sur une variété}}).
  voir: [variete-a-bord, orientation]

- id: integrale-variete
  terme: intégrale sur une variété orientée
  notation: '$\int_M \omega$'
  defini_dans: dv-integrale
  definition: |
    Pour une forme $\omega$ de degré maximal à [[support-forme|support]] compact sur une [[variete-orientee|variété orientée]], éventuellement à bord, la somme des intégrales des coefficients des formes $\chi_l\,\omega$ dans des cartes directes, $(\chi_l)$ étant une partition de l'unité finie au voisinage du support. Elle ne dépend ni des cartes ni de la partition, grâce à la formule du changement de variables.
  voir: [variete-orientee, formule-stokes]

- id: loi-poisson
  terme: loi de Poisson
  defini_dans: p-poisson-exp
  definition: |
    La loi sur $\mathbb N$ donnée par $P(X = k) = e^{-\lambda}\lambda^k/k!$, d'espérance et de variance $\lambda$. Elle est la limite des lois binomiales de paramètres $n$ et $\lambda/n$.

- id: ensemble-cantor
  terme: ensemble de Cantor
  defini_dans: p-cantor
  definition: |
    L'ensemble triadique de Cantor $K = \bigcap_N K_N$, où $K_0 = [0, 1]$ et où $K_{N+1}$ s'obtient en retirant de chacun des $2^N$ segments de $K_N$, de longueur $3^{-N}$, son tiers central ouvert. C'est un fermé [[negligeable|négligeable]] de $\mathbb R$ pour la [[mesure-lebesgue|mesure de Lebesgue]], qui n'est pas dénombrable.

- id: loi-cantor
  terme: loi de Cantor
  defini_dans: p-cantor
  definition: |
    La [[loi-variable|loi]] de $X = \sum_{k \geqslant 1} 2d_k3^{-k}$, où les $d_k$ sont les chiffres binaires d'un réel tiré selon la [[mesure-lebesgue|mesure de Lebesgue]] sur $[0, 1[$. Elle ne charge aucun point, mais, portée par l'[[ensemble-cantor|ensemble de Cantor]], qui est négligeable, elle n'a pas de [[densite-probabilite|densité]] ; sa [[fonction-repartition|fonction de répartition]], continue, est l'escalier de Cantor.

- id: loi-normale
  terme: loi normale
  defini_dans: p-normale
  definition: |
    La loi $\mathcal N(m, \sigma^2)$ de [[densite-probabilite|densité]] $\frac{1}{\sigma\sqrt{2\pi}}e^{-(x - m)^2/(2\sigma^2)}$. La somme de deux variables normales indépendantes est normale, et le théorème central limite en fait la loi universelle des fluctuations.

- id: complexe-chaines
  terme: complexe de chaînes
  defini_dans: h-complexes
  definition: |
    Une suite de groupes abéliens $C_n$ et de morphismes $\partial : C_n \to C_{n-1}$ tels que $\partial \circ \partial = 0$. Son homologie est le quotient des [[cycle-complexe|cycles]] par les [[bord-complexe|bords]].

- id: groupe-homologie
  terme: groupe d'homologie
  notation: '$H_n(C)$'
  defini_dans: h-complexes
  definition: |
    Le quotient $H_n = \operatorname{Ker}\partial_n / \operatorname{Im}\partial_{n+1}$ d'un [[complexe-chaines|complexe de chaînes]] : les [[cycle-complexe|cycles]] qui ne sont pas des [[bord-complexe|bords]].

- id: suite-exacte
  terme: suite exacte
  defini_dans: h-suite-exacte
  definition: |
    Une suite de morphismes $A \xrightarrow{u} B \xrightarrow{v} C$ est exacte en $B$ si $\operatorname{Im} u = \operatorname{Ker} v$ ; une suite de morphismes est exacte si elle l'est en chacun de ses termes intermédiaires, c'est-à-dire si l'image de chacun est le noyau du suivant. Une suite exacte courte de complexes induit une suite exacte longue en homologie.

- id: homologie-singuliere
  terme: homologie singulière
  notation: '$H_n(X)$'
  defini_dans: h-singuliere
  definition: |
    L'homologie du complexe des chaînes formées de simplexes continus $\Delta_n \to X$. C'est un invariant topologique, et même homotopique.
  voir: [groupe-homologie]

- id: morphisme-hurewicz
  terme: morphisme de Hurewicz
  notation: '$h : \pi_1(X, x_0) \to H_1(X)$'
  defini_dans: hu-hurewicz
  definition: |
    Le [[morphisme-groupes|morphisme]] qui envoie la classe d'un [[lacet|lacet]] en $x_0$ sur la classe d'homologie du simplexe singulier de dimension $1$ qu'il définit, qui est un [[cycle-complexe|cycle]]. Pour un espace [[connexe-par-arcs|connexe par arcs]], il est surjectif, de noyau le [[sous-groupe-engendre|sous-groupe engendré]] par les [[commutateur|commutateurs]] : $H_1(X)$ est l'[[abelianise|abélianisé]] du [[groupe-fondamental|groupe fondamental]].
  voir: [homologie-singuliere, groupe-fondamental]

- id: equivalence-homotopie
  terme: équivalence d'homotopie
  defini_dans: h-homotopie
  definition: |
    Une application continue $f : X \to Y$ qui admet un inverse à homotopie près. Elle induit des isomorphismes en homologie.

- id: composante-connexe-par-arcs
  terme: composante connexe par arcs
  defini_dans: h-degre0
  definition: |
    Une classe de la relation « être reliés par un [[chemin]] » dans un espace topologique. Les composantes sont [[connexe-par-arcs|connexes par arcs]] et forment une partition de l'espace ; toute partie connexe par arcs est contenue dans l'une d'elles.

- id: homologie-reduite
  terme: homologie réduite
  notation: '$\tilde H_n(X)$'
  defini_dans: hj-reduite
  definition: |
    L'homologie du complexe des [[chaine-singuliere|chaînes singulières]] augmenté par $\mathbb Z$ en degré $-1$, le bord d'un point valant $1$. Elle coïncide avec l'[[homologie-singuliere|homologie singulière]] en degré au moins $1$. Pour un espace non vide, elle est nulle en degré $0$ si et seulement s'il est [[connexe-par-arcs|connexe par arcs]] ; elle est nulle en degré $-1$ si et seulement si l'espace n'est pas vide. Celle d'un point est nulle en tout degré.

- id: calotte
  terme: calotte
  notation: '$C(p, \varepsilon)$'
  defini_dans: hj-calottes
  definition: |
    Sur la [[sphere-unite|sphère unité]] $S^m$, l'ensemble des points à distance euclidienne strictement inférieure à $\varepsilon$ d'un point $p$, pour $0 < \varepsilon < 2$ (calotte ouverte), ou au plus égale à $\varepsilon$ (calotte fermée). Une projection stéréographique l'envoie sur une boule de $\mathbb R^m$.

- id: frontiere
  terme: frontière
  notation: '$\operatorname{Fr} A$'
  defini_dans: hj-ouverts-sphere
  definition: |
    La frontière d'une partie $A$ d'un espace topologique est $\overline A \setminus \mathring A$, ensemble des points de l'[[adherence|adhérence]] de $A$ qui ne sont pas dans son [[interieur|intérieur]]. Celle d'un [[ouvert]] $U$ est $\overline U \setminus U$.

- id: sphere-topologique
  terme: sphère topologique
  defini_dans: hj-spheres-plongees
  definition: |
    Une partie d'un espace topologique [[homeomorphisme|homéomorphe]] à une [[sphere-unite|sphère unité]] $S^k$ ; $k$ est sa dimension. Dans un espace séparé, l'image d'une application continue et injective de $S^k$ en est une.

- id: courbe-jordan
  terme: courbe de Jordan
  defini_dans: hj-jordan
  definition: |
    L'image d'un [[lacet|lacet]] simple du plan, c'est-à-dire d'un [[chemin]] fermé $\gamma : [0, 1] \to \mathbb R^2$ qui ne repasse par aucun point, hormis $\gamma(0) = \gamma(1)$. C'est une [[sphere-topologique|sphère topologique]] de dimension $1$, et elle sépare le plan en deux composantes, l'une bornée, l'autre non, dont elle est la [[frontiere|frontière]] commune.

- id: complexe-cochaines
  terme: complexe de cochaînes
  notation: '$H^n(K)$'
  defini_dans: cs-cochaines
  definition: |
    Une suite de groupes abéliens $K^n$ et de morphismes $\delta : K^n \to K^{n+1}$, les [[cobord-complexe|cobords]], tels que $\delta \circ \delta = 0$ ; sa [[cohomologie-complexe|cohomologie]] $H^n(K)$ est le quotient des [[cocycle-complexe|cocycles]] par les cobords. Le dual $\operatorname{Hom}(C, G)$ d'un [[complexe-chaines|complexe de chaînes]] en est l'exemple principal, avec $(\delta\varphi)(c) = \varphi(\partial c)$.

- id: cohomologie-singuliere
  terme: cohomologie singulière
  notation: '$H^n(X; G)$'
  defini_dans: cs-singuliere
  definition: |
    La [[cohomologie-complexe|cohomologie]] du complexe des [[cochaine-singuliere|cochaînes singulières]] $\operatorname{Hom}(C_n(X), G)$, c'est-à-dire des applications de l'ensemble des simplexes singuliers de dimension $n$ dans un groupe abélien $G$. Elle est contravariante, invariante par homotopie, et se calcule par une suite de Mayer-Vietoris ; $H^0(X; G)$ est le groupe des fonctions constantes sur chaque composante connexe par arcs.
  voir: [homologie-singuliere, groupe-ext]

- id: groupe-projectif
  terme: groupe abélien projectif
  defini_dans: cs-projectifs
  definition: |
    Un groupe abélien $P$ tel que tout morphisme défini sur $P$ se relève le long de tout morphisme surjectif. Les groupes $\mathbb Z^k$ et leurs sous-groupes le sont ; $\mathbb Z/n\mathbb Z$ ne l'est pas pour $n \geqslant 2$. Que tout groupe abélien libre soit projectif est équivalent à l'axiome du choix.

- id: base-groupe-abelien
  terme: base (groupe abélien)
  defini_dans: cs-dedekind
  definition: |
    Une famille $(h_p)_{p \in P}$ d'éléments d'un groupe abélien $H$ telle que tout élément de $H$ s'écrive d'une unique façon $\sum_p c_p h_p$, avec des entiers presque tous nuls ; le groupe est libre s'il en a une, c'est-à-dire s'il est isomorphe à $\mathbb Z^{(P)}$. Tout sous-groupe de $\mathbb Z^{(I)}$, pour $I$ bien ordonné, a une base déterminée par cet ordre (théorème de Dedekind).
  voir: [base-vectorielle]

- id: groupe-ext
  terme: groupe Ext
  notation: '$\operatorname{Ext}(A, G)$'
  defini_dans: cs-ext
  definition: |
    Pour une présentation $0 \to R \to P \to A \to 0$ d'un groupe abélien $A$ où $P$ est [[groupe-projectif|projectif]], le groupe $\operatorname{Ext}(A, G)$ est le quotient de $\operatorname{Hom}(R, G)$ par les morphismes qui se prolongent à $P$ ; il ne dépend pas de la présentation. On a $\operatorname{Ext}(\mathbb Z/n\mathbb Z, G) \cong G/nG$, et $\operatorname{Ext}(P, G) = 0$ si $P$ est projectif.

- id: produit-cup
  terme: produit cup
  notation: '$\smile$'
  defini_dans: cup-produit
  definition: |
    Le produit de deux [[cochaine-singuliere|cochaînes singulières]] $\varphi$ et $\psi$ de degrés $k$ et $l$, à coefficients dans un anneau commutatif, défini sur un simplexe $\sigma$ de dimension $k + l$ par $(\varphi \smile \psi)(\sigma) = \varphi(\text{face avant}) \, \psi(\text{face arrière})$. Il vérifie la formule de Leibniz et passe à la cohomologie.
  voir: [anneau-cohomologie]

- id: anneau-cohomologie
  terme: anneau de cohomologie
  notation: '$H^*(X; R)$'
  defini_dans: cup-anneau
  definition: |
    La somme directe des groupes de cohomologie $H^k(X; R)$, $k \geqslant 0$, munie du [[produit-cup|produit cup]]. C'est un anneau, et une application continue induit un morphisme d'anneaux ; celui de $S^n$, pour $n \geqslant 1$, est $R[X]/(X^2)$. Il est commutatif au signe $(-1)^{kl}$ près, ce qui est admis au nœud {{cup-anneau|Anneau de cohomologie}} et démontré au nœud {{ku-commutativite|Commutativité graduée}} ; le nœud {{cup-projectif|Anneau de ℝPⁿ}} montrera que celui de $\mathbb RP^n$ modulo $2$ est $(\mathbb Z/2\mathbb Z)[X]/(X^{n+1})$.

- id: application-impaire
  terme: application impaire
  defini_dans: cup-transfert
  definition: |
    Une application continue $g : S^n \to S^m$ entre sphères telle que $g(-x) = -g(x)$ pour tout $x$. Une application impaire continue $S^n \to S^m$ passe au quotient en une application $\mathbb RP^n \to \mathbb RP^m$ ; le théorème de Borsuk-Ulam ({{cup-borsuk-ulam|Borsuk-Ulam}}) montrera qu'il n'en existe pas de $S^n$ dans $S^{n-1}$.

- id: produit-tensoriel
  terme: produit tensoriel
  notation: '$M \otimes N$'
  defini_dans: ku-tenseur
  definition: |
    Pour deux [[module|modules]] $M$ et $N$ sur un [[anneau]] commutatif, le quotient du [[module-libre-ensemble|module libre]] sur $M \times N$ par les relations de bilinéarité ; la classe de $(x, y)$ est notée $x \otimes y$. Les applications linéaires sur $M \otimes N$ correspondent bijectivement aux applications [[application-bilineaire-modules|bilinéaires]] sur $M \times N$. On a $(\mathbb Z/m\mathbb Z) \otimes (\mathbb Z/n\mathbb Z) \cong \mathbb Z/d\mathbb Z$, avec $d$ le pgcd de $m$ et $n$. Pour deux complexes, le produit tensoriel est formé des $C_i \otimes D_j$, avec la règle des signes $\partial(c \otimes d) = \partial c \otimes d + (-1)^i c \otimes \partial d$.
  voir: [module-plat, groupe-tor]

- id: module-plat
  terme: module plat
  defini_dans: ku-plat
  definition: |
    Un [[module]] $F$ tel que $F \otimes -$ préserve l'injectivité des applications linéaires. Les [[module-libre-ensemble|modules libres]], les groupes abéliens projectifs, et, sans axiome du choix, les sous-groupes des groupes abéliens libres et les espaces vectoriels sont plats ; $\mathbb Z/n\mathbb Z$ ne l'est pas pour $n \geqslant 2$.

- id: groupe-tor
  terme: groupe Tor
  notation: '$\operatorname{Tor}(A, G)$'
  defini_dans: ku-tor
  definition: |
    Pour une présentation $0 \to L \to P \to A \to 0$ d'un groupe abélien $A$ où $P$ est projectif, le noyau de $L \otimes G \to P \otimes G$ ; il ne dépend pas de la présentation. On a $\operatorname{Tor}(\mathbb Z/n\mathbb Z, G) \cong G[n]$, sous-groupe des éléments annulés par $n$, et $\operatorname{Tor}(A, G) = 0$ si $A$ est projectif ou si $G$ est plat. Il mesure le terme de torsion de la formule de Künneth.

- id: contraction-complexe
  terme: contraction d'un complexe
  defini_dans: ku-cone
  definition: |
    Pour un complexe augmenté par $\varepsilon : C_0 \to \mathbb Z$, la donnée d'un $v \in C_0$ tel que $\varepsilon(v) = 1$ et de morphismes $h : C_n \to C_{n+1}$ tels que $\partial h + h\partial = \mathrm{id} - \eta\varepsilon$, où $\eta\varepsilon(c) = \varepsilon(c)\,v$ en degré $0$. Tout [[cycle-complexe|cycle]] de degré positif $z$ est alors le [[bord-complexe|bord]] de $h(z)$. Le [[cone-singulier|cône]] d'un [[partie-convexe|convexe]] en fournit une pour ses [[chaine-singuliere|chaînes singulières]].

- id: modeles-acycliques
  terme: modèles acycliques
  defini_dans: ku-modeles
  definition: |
    Méthode d'Eilenberg et Mac Lane pour construire des morphismes de complexes naturels, et des [[homotopie-naturelle|homotopies naturelles]], entre foncteurs de chaînes : si le premier est libre sur des [[modele-foncteurs-chaines|modèles]], ici les couples $(\Delta_p, \Delta_q)$, et si le second y est contractile, il suffit de définir les morphismes sur les modèles, où la contraction fournit les antécédents nécessaires.

- id: application-alexander-whitney
  terme: application d'Alexander-Whitney
  notation: '$\mathrm{AW}$'
  defini_dans: ku-eilenberg-zilber
  definition: |
    Le morphisme de complexes $C(X \times Y) \to C(X) \otimes C(Y)$ qui envoie un simplexe $\sigma$, de composantes $\sigma_1$ et $\sigma_2$, sur $\sum_i \sigma_1|[0..i] \otimes \sigma_2|[i..n]$ : [[face-avant|face avant]] de la première composante, [[face-arriere|face arrière]] de la seconde. C'est une équivalence d'homotopie (théorème d'Eilenberg-Zilber).

- id: homologie-coefficients
  terme: homologie à coefficients
  notation: '$H_n(X; R)$'
  defini_dans: ku-homologie
  definition: |
    L'homologie du complexe $C(X) \otimes R$ des [[chaine-singuliere|chaînes singulières]] à coefficients dans un [[anneau]] commutatif $R$, $R$-[[module-libre-ensemble|module libre]] sur les simplexes singuliers. Sur un corps, la formule de Künneth y devient un isomorphisme $H_n(X \times Y; K) \cong \bigoplus_{i+j=n} H_i(X; K) \otimes H_j(Y; K)$.

- id: tore-n
  terme: tore de dimension n
  notation: '$T^n = (S^1)^n$'
  defini_dans: ku-homologie
  definition: |
    Le produit de $n$ copies du cercle $\mathbb R/\mathbb Z$, muni de la [[topologie-produit|topologie produit]] ; $T^2$ est le [[tore]]. Son homologie est libre, de rang $\binom nk$ en degré $k$ ; le nœud {{ku-tore|Anneau du tore}} montrera que son anneau de cohomologie est l'algèbre extérieure sur $n$ générateurs de degré $1$.

- id: produit-croise
  terme: produit croisé (cohomologie)
  notation: '$a \times b$'
  defini_dans: ku-croise
  definition: |
    Pour des classes de cohomologie $a$ de $X$ et $b$ de $Y$, la classe $a \times b = p_1^*a \smile p_2^*b$ de $X \times Y$ ; sur les cochaînes, elle se lit par l'application d'Alexander-Whitney. Avec le [[produit-croise-homologie|produit croisé homologique]], on a $\langle a \times b, x \times y \rangle = \langle a, x \rangle \langle b, y \rangle$.

- id: algebre-exterieure
  terme: algèbre extérieure
  notation: '$\Lambda_R(n)$'
  defini_dans: ku-tore
  definition: |
    Le [[module-libre-ensemble|module libre]] sur un [[anneau]] commutatif $R$ de base des symboles $e_I$, $I \subset \{1, \dots, n\}$, muni du produit $e_I e_J = \pm e_{I \cup J}$ si $I \cap J = \varnothing$, le signe étant la signature de la permutation qui range $I$ puis $J$, et $e_I e_J = 0$ sinon. C'est l'anneau de cohomologie du tore $T^n$ ; sur un corps, c'est l'algèbre des formes alternées.
  voir: [produit-exterieur]

- id: homologie-relative
  terme: homologie relative
  notation: '$H_n(X, A)$'
  defini_dans: cw-relative
  definition: |
    Pour une partie $A$ d'un espace $X$, l'homologie du complexe quotient $C(X)/C(A)$ des [[chaine-singuliere|chaînes singulières]] de $X$ par celles de $A$. Ses éléments sont représentés par les chaînes de $X$ dont le bord est dans $A$. Elle s'insère dans la [[suite-exacte|suite exacte]] longue de la paire, $\cdots \to H_n(A) \to H_n(X) \to H_n(X, A) \to H_{n-1}(A) \to \cdots$, et $H_n(X, \varnothing) = H_n(X)$.
  voir: [homologie-singuliere, excision]

- id: lemme-cinq
  terme: lemme des cinq
  defini_dans: cw-cinq
  definition: |
    Dans un diagramme commutatif formé de deux suites exactes de cinq groupes abéliens reliées par des morphismes, si les deuxième et quatrième morphismes sont des isomorphismes, le premier surjectif et le cinquième injectif, alors le morphisme du milieu est un isomorphisme.

- id: excision
  terme: excision
  defini_dans: cw-excision
  definition: |
    Le théorème selon lequel, si $Z \subset A \subset X$ et si l'adhérence de $Z$ est contenue dans l'intérieur de $A$, l'inclusion de $(X \setminus Z, A \setminus Z)$ dans $(X, A)$ induit des isomorphismes en [[homologie-relative|homologie relative]]. Il se déduit du théorème des petites chaînes.

- id: paire-bon-type
  terme: paire de bon type
  defini_dans: cw-bonnes-paires
  definition: |
    Une [[paire-espaces|paire]] $(X, A)$ formée d'un espace [[compact]] et d'une partie fermée non vide, [[retracte-deformation|rétracte par déformation]] d'une partie fermée dont l'intérieur la contient. Pour une telle paire, la projection sur le quotient $X/A$ induit des isomorphismes $H_n(X, A) \cong \tilde H_n(X/A)$.

- id: degre-application
  terme: degré (d'une application de la sphère)
  notation: '$\deg f$'
  defini_dans: cw-degre
  definition: |
    Pour une application continue $f : S^n \to S^n$, l'entier $d$ tel que $f_*$ soit la multiplication par $d$ sur $\tilde H_n(S^n) \cong \mathbb Z$. Il est multiplicatif et invariant par homotopie ; une réflexion a pour degré $-1$, l'application antipodale $(-1)^{n+1}$, ce qui donne le théorème de la boule chevelue.

- id: attachement-cellules
  terme: attachement de cellules
  defini_dans: cw-complexes
  definition: |
    Un espace séparé $X$ s'obtient à partir d'une partie fermée $Y$ par attachement de cellules de dimension $n$ s'il existe un nombre fini d'applications continues $\Phi_j : D^n \to X$, envoyant le bord $S^{n-1}$ dans $Y$, injectives sur la boule ouverte, et dont les images des boules ouvertes forment une partition de $X \setminus Y$. Le nœud {{cw-attachement|Attachement de cellules}} montrera que, lorsque $Y$ est compact, l'espace s'identifie au quotient de la réunion disjointe de $Y$ et des disques qui recolle chaque bord à $Y$.

- id: complexe-cellulaire
  terme: complexe cellulaire fini
  defini_dans: cw-complexes
  definition: |
    Un espace séparé muni d'une suite finie de parties fermées $\varnothing = X^{-1} \subset X^0 \subset \cdots \subset X^N = X$, les [[squelette|squelettes]], chacune obtenue à partir de la précédente par [[attachement-cellules|attachement de cellules]] de dimension $n$. Introduits par J. H. C. Whitehead en 1949 (CW-complexes), ils sont compacts et portent automatiquement la topologie faible.

- id: squelette
  terme: squelette
  notation: '$X^n$'
  defini_dans: cw-complexes
  definition: |
    Dans un [[complexe-cellulaire|complexe cellulaire fini]], la réunion des [[cellule|cellules]] de dimension au plus $n$. C'est une partie fermée et compacte ; $X^0$ est un ensemble fini de points.

- id: cellule
  terme: cellule
  defini_dans: cw-complexes
  definition: |
    Dans un [[complexe-cellulaire|complexe cellulaire fini]], l'image $e = \Phi(B^n)$ de la boule ouverte par une [[application-caracteristique-cellule|application caractéristique]] $\Phi : D^n \to X$ ; c'est un ouvert de son [[squelette]], [[espaces-homeomorphes|homéomorphe]] à $B^n$ par $\Phi$.

- id: surface-genre
  terme: surface orientable de genre g
  notation: '$\Sigma_g$'
  defini_dans: cw-exemples
  definition: |
    Le [[complexe-cellulaire|complexe cellulaire]] obtenu en attachant une cellule de dimension $2$ à un bouquet de $2g$ cercles, le long du [[mot-ensemble|mot]] $a_1b_1a_1^{-1}b_1^{-1} \cdots a_gb_ga_g^{-1}b_g^{-1}$ : un polygone à $4g$ côtés dont on recolle les côtés deux à deux. Pour $g = 1$, c'est le [[tore]]. Le nœud {{cw-surfaces|Tore et surfaces}} montrera que son homologie est $\mathbb Z$, $\mathbb Z^{2g}$, $\mathbb Z$ en degrés $0$, $1$, $2$, et nulle au-delà. L'adjectif « orientable » fait partie du nom usuel ; l'orientabilité n'est pas définie ici.

- id: homologie-cellulaire
  terme: homologie cellulaire
  notation: '$H^{\mathrm{cell}}_n(X)$'
  defini_dans: cw-complexe-cellulaire
  definition: |
    L'homologie du complexe $H_n(X^n, X^{n-1})$, libre de base les [[cellule|cellules]] de dimension $n$, dont le bord est la composée du morphisme de connexion et du morphisme induit par l'inclusion. Elle est isomorphe à l'[[homologie-singuliere|homologie singulière]], et la calcule par un nombre fini d'opérations sur des matrices d'entiers.

- id: caracteristique-euler
  terme: caractéristique d'Euler-Poincaré
  notation: '$\chi(X)$'
  defini_dans: cw-euler
  definition: |
    Pour un [[complexe-cellulaire|complexe cellulaire fini]], la somme alternée $\sum_n (-1)^n c_n$ des nombres de [[cellule|cellules]] de chaque dimension. Elle ne dépend que des groupes d'homologie, donc pas de la décomposition : $2$ pour la sphère $S^2$, $2 - 2g$ pour la surface de genre $g$, $1$ pour $\mathbb RP^2$.

- id: extension-corps
  terme: extension de corps
  defini_dans: gs-extensions
  definition: |
    Un [[corps]] $L$ contenant un sous-corps $K$. Son [[degre-extension|degré]] $[L:K]$ est la dimension de $L$ comme $K$-espace vectoriel, et il est multiplicatif dans les tours.

- id: polynome-minimal
  terme: polynôme minimal
  defini_dans: gs-algebriques
  definition: |
    Pour $\alpha$ [[element-algebrique|algébrique]] sur $K$, le polynôme unitaire de plus petit degré qui l'annule ; il est irréductible et [[divisibilite-polynomes|divise]] tout polynôme annulateur, et son degré est $[K(\alpha):K]$.

- id: corps-decomposition
  terme: corps de décomposition
  defini_dans: gs-decomposition
  definition: |
    Une extension engendrée par les [[racine-polynome|racines]] d'un polynôme, sur laquelle il est [[polynome-scinde|scindé]]. Il existe et il est unique à isomorphisme près.

- id: polynome-separable
  terme: polynôme séparable
  defini_dans: gs-separabilite
  definition: |
    Un polynôme dont toutes les [[racine-polynome|racines]], dans un corps de décomposition, sont simples ; c'est le cas si et seulement s'il est premier avec sa dérivée. En [[caracteristique-corps|caractéristique]] nulle, tout polynôme irréductible est séparable.

- id: extension-galoisienne
  terme: extension galoisienne
  defini_dans: gs-galoisiennes
  definition: |
    Une [[extension-corps|extension]] finie dont le corps des éléments fixés par tous les automorphismes est le corps de base ; de façon équivalente, le corps de décomposition d'un [[polynome-separable|polynôme séparable]].

- id: groupe-galois
  terme: groupe de Galois
  notation: '$\operatorname{Gal}(L/K)$'
  defini_dans: gs-galoisiennes
  definition: |
    Le groupe des automorphismes d'une [[extension-galoisienne|extension galoisienne]] $L/K$ qui fixent $K$ ; son ordre est $[L:K]$.

- id: extension-separable
  terme: extension séparable
  defini_dans: gc-element-primitif
  definition: |
    Une [[extension-corps|extension]] algébrique $L/K$ dont tout élément a un [[polynome-minimal|polynôme minimal]] sur $K$ [[polynome-separable|séparable]]. En [[caracteristique-corps|caractéristique]] nulle, toute [[extension-algebrique|extension algébrique]] est séparable ; une [[extension-finie|extension finie]] séparable a un [[element-primitif|élément primitif]].

- id: element-primitif
  terme: élément primitif
  defini_dans: gc-element-primitif
  definition: |
    Pour une [[extension-corps|extension]] $L/K$, un élément $\gamma$ tel que $L = K(\gamma)$. Toute [[extension-finie|extension finie]] séparable en a un, par exemple $\sqrt[3]2 + j$ pour le corps de décomposition $\mathbb Q(\sqrt[3]2, j)$ de $X^3 - 2$.

- id: racine-unite
  terme: racine primitive n-ième de l'unité
  defini_dans: gc-cyclotomiques
  definition: |
    Dans un [[corps]] $K$, un [[ordre-element|élément d'ordre]] exactement $n$ du groupe multiplicatif $K^\times$. S'il en existe une, $\zeta$, les [[racine-nieme-unite|racines $n$-ièmes de l'unité]] de $K$ sont ses $n$ puissances, et les racines primitives sont les $\zeta^k$ avec $k$ premier à $n$. À ne pas confondre avec une [[racine-primitive|racine primitive]] modulo un nombre premier.
  voir: [polynome-cyclotomique]

- id: polynome-cyclotomique
  terme: polynôme cyclotomique
  notation: $\Phi_n$
  defini_dans: gc-cyclotomiques
  definition: |
    Le polynôme unitaire $\Phi_n \in \mathbb Z[X]$, de degré $\varphi(n)$, dont les [[racine-polynome|racines]], dans un corps qui contient une [[racine-unite|racine primitive $n$-ième de l'unité]], sont exactement les racines primitives $n$-ièmes ; on a $X^n - 1 = \prod_{d \mid n}\Phi_d$. On a $\Phi_{12} = X^4 - X^2 + 1$ ; le nœud {{gc-irreductibilite|Irréductibilité de Φₙ}} montrera que $\Phi_n$ est irréductible sur $\mathbb Q$.

- id: point-constructible
  terme: nombre constructible
  notation: $\mathcal C$
  defini_dans: gc-constructibles
  definition: |
    Un point du plan $\mathbb C$ qu'on obtient à partir de $0$ et $1$ par une suite finie d'intersections de droites, tracées à la règle par deux points déjà obtenus, et de cercles, tracés au compas. Le nœud {{gc-corps-constructibles|Corps des constructibles}} montrera que les nombres constructibles forment un sous-corps de $\mathbb C$ stable par racine carrée, et le théorème de Wantzel ({{gc-wantzel|Wantzel}}) que le degré sur $\mathbb Q$ d'un nombre constructible est une puissance de $2$.

- id: nombre-fermat
  terme: nombre premier de Fermat
  defini_dans: gc-fermat
  definition: |
    Un [[nombre-fermat-entier|nombre de Fermat]] $F_j = 2^{2^j} + 1$ qui est [[nombre-premier|premier]]. Les seuls connus sont $3$, $5$, $17$, $257$ et $65\,537$. Le nœud {{gc-gauss-wantzel|Gauss-Wantzel}} montrera que le polygone régulier à $n$ côtés est constructible si et seulement si $n$ est le produit d'une puissance de $2$ et de nombres premiers de Fermat distincts.

- id: groupe-cyclique
  terme: groupe cyclique
  defini_dans: gf-cycliques
  definition: |
    Un groupe engendré par un seul élément ; un groupe cyclique d'ordre $n$ est isomorphe à $\mathbb Z/n\mathbb Z$ et a un unique sous-groupe d'ordre $d$ pour chaque diviseur $d$ de $n$.

- id: action-groupe
  terme: action de groupe
  defini_dans: gf-actions
  definition: |
    Une application $(g, x) \mapsto g \cdot x$ de $G \times X$ dans $X$ telle que $e \cdot x = x$ et $g \cdot (h \cdot x) = (gh) \cdot x$ ; le cardinal d'une orbite est l'indice du stabilisateur.

- id: sous-groupe-sylow
  terme: sous-groupe de Sylow
  defini_dans: gf-sylow
  definition: |
    Pour $|G| = p^am$ avec $p$ premier ne divisant pas $m$, un sous-groupe d'ordre $p^a$. Il en existe, ils sont [[sous-groupe-conjugue|conjugués]], et leur nombre divise $m$ et vaut $1$ modulo $p$.

- id: produit-semi-direct
  terme: produit semi-direct
  defini_dans: gf-produits
  definition: |
    Le groupe $N \rtimes_\varphi H$, ensemble $N \times H$ muni de $(n, h)(n', h') = (n\,\varphi(h)(n'), hh')$, pour un morphisme $\varphi : H \to \operatorname{Aut}(N)$.

- id: g-module
  terme: G-module
  defini_dans: cg-modules
  definition: |
    Un groupe abélien $A$ muni d'une action d'un [[groupe]] $G$ par automorphismes : $g \cdot (a + b) = g \cdot a + g \cdot b$. C'est la même chose qu'un morphisme de $G$ dans le groupe des automorphismes de $A$. Ses [[invariants-g-module|invariants]] $A^G$ sont les éléments fixés par tout $G$.

- id: cohomologie-groupes
  terme: cohomologie des groupes (groupe de)
  notation: '$H^n(G, A)$'
  defini_dans: cg-cochaines
  definition: |
    Pour un [[g-module|$G$-module]] $A$, le quotient $H^n(G, A) = Z^n(G, A)/B^n(G, A)$ des [[cocycle-groupe|cocycles]] de degré $n$ par les [[cobord-groupe|cobords]]. On a $H^0(G, A) = A^G$ ; $H^1$ classe les compléments dans $A \rtimes G$ à conjugaison près, et $H^2$ les extensions de $G$ par $A$. Pour $G$ fini, $|G|$ annule $H^n(G, A)$ si $n \geqslant 1$.

- id: cocycle-groupe
  terme: cocycle (cohomologie des groupes)
  defini_dans: cg-cochaines
  definition: |
    Une application $f : G^n \to A$, à valeurs dans un [[g-module|$G$-module]], dont la [[differentielle-cochaines-groupe|différentielle]] $d^nf$ est nulle. En degré $1$, c'est un [[homomorphisme-croise|homomorphisme croisé]] ; en degré $2$, la condition s'écrit $g\,c(h, k) - c(gh, k) + c(g, hk) - c(g, h) = 0$.

- id: cobord-groupe
  terme: cobord (cohomologie des groupes)
  defini_dans: cg-cochaines
  definition: |
    Une [[cochaine-groupe|cochaîne]] de la forme $d^{n-1}b$ ; tout cobord est un [[cocycle-groupe|cocycle]]. En degré $1$, ce sont les applications $g \mapsto ga - a$.

- id: homomorphisme-croise
  terme: homomorphisme croisé
  defini_dans: cg-cochaines
  definition: |
    Une application $f : G \to A$, à valeurs dans un [[g-module|$G$-module]], telle que $f(gh) = f(g) + g\,f(h)$ : un cocycle de degré $1$. Pour l'action triviale, c'est un morphisme de groupes.

- id: complement-groupe
  terme: complément (d'un sous-groupe distingué)
  defini_dans: cg-complements
  definition: |
    Un sous-groupe $H$ d'un [[groupe]] $E$ tel que $N \cap H = \{e\}$ et $NH = E$, pour un [[sous-groupe-distingue|sous-groupe distingué]] $N$ ; $E$ est alors un [[produit-semi-direct|produit semi-direct]] de $N$ par $H$. Pour un sous-groupe distingué d'un groupe fini, d'ordre premier à son indice, il en existe toujours (Schur-Zassenhaus).

- id: suite-exacte-groupes
  terme: suite exacte (de groupes)
  defini_dans: cg-modules
  definition: |
    Une suite de morphismes de groupes dans laquelle l'image de chacun est le noyau du suivant. Le nœud {{cg-suite-exacte|Suite exacte longue}} montrera que, pour un groupe $G$ fini, une suite exacte de [[g-module|$G$-modules]] de la forme $0 \to A \to B \to C \to 0$, dite courte, induit une suite exacte longue en cohomologie.
  voir: [suite-exacte]

- id: extension-groupes
  terme: extension (de groupes)
  defini_dans: cg-extensions
  definition: |
    Une [[suite-exacte-groupes|suite exacte]] $0 \to A \to E \to G \to 1$ dans laquelle la [[action-conjugaison|conjugaison]] dans $E$ induit une action donnée de $G$ sur le groupe abélien $A$. À équivalence près, les extensions munies d'une section sont classées par $H^2(G, A)$, la classe nulle correspondant aux produits semi-directs.

- id: norme-extension
  terme: norme (d'une extension galoisienne)
  defini_dans: h90-norme-trace
  definition: |
    Pour une [[extension-galoisienne|extension galoisienne]] $L/K$ de groupe $G$, l'élément $N_{L/K}(x) = \prod_{\sigma \in G}\sigma(x)$ de $K$. Elle est multiplicative. Pour une extension cyclique dont le groupe est engendré par $\sigma$, le théorème 90 de Hilbert ({{h90-cyclique|Forme cyclique}}) montrera que les éléments de norme $1$ sont les $y/\sigma(y)$.
  voir: [norme-algebrique]

- id: trace-extension
  terme: trace (d'une extension galoisienne)
  defini_dans: h90-norme-trace
  definition: |
    Pour une [[extension-galoisienne|extension galoisienne]] $L/K$ de groupe $G$, l'élément $\operatorname{Tr}_{L/K}(x) = \sum_{\sigma \in G}\sigma(x)$ de $K$. C'est une forme [[application-a-lineaire|$K$-linéaire]] non nulle, même quand $\operatorname{Tr}_{L/K}(1) = [L:K] \cdot 1$ est nul.
  voir: [trace]

- id: extension-cyclique
  terme: extension cyclique
  defini_dans: h90-cyclique
  definition: |
    Une [[extension-galoisienne|extension galoisienne]] dont le [[groupe-galois|groupe de Galois]] est cyclique. La théorie de Kummer ({{h90-kummer|Kummer}}) montrera que, si $K$ contient une racine primitive $n$-ième de l'unité, les extensions cycliques de [[degre-extension|degré]] $n$ sont engendrées par une racine $n$-ième d'un élément de $K$.

- id: racine-primitive
  terme: racine primitive
  defini_dans: gf-multiplicatif
  definition: |
    Pour un nombre premier $q$, un entier dont la classe engendre le groupe multiplicatif $(\mathbb Z/q\mathbb Z)^\times$. Il en existe toujours, car tout sous-groupe fini du groupe multiplicatif d'un [[corps]] est cyclique ; par exemple $2$ est une racine primitive modulo $13$. À ne pas confondre avec une racine primitive $n$-ième de l'unité, [[ordre-element|élément d'ordre]] exactement $n$ du groupe multiplicatif d'un corps.
  voir: [groupe-cyclique]

- id: residu-quadratique
  terme: résidu quadratique
  defini_dans: rq-legendre
  definition: |
    Pour un [[nombre-premier|nombre premier]] impair $p$, un entier $a$ non divisible par $p$ est un résidu quadratique modulo $p$ s'il existe $x$ tel que $x^2 \equiv a \pmod p$, et un [[non-residu-quadratique|non-résidu]] sinon. Il y a autant de résidus que de non-résidus parmi $1, \dots, p - 1$, et le produit de deux non-résidus est un résidu ; modulo $13$, les résidus sont $1, 3, 4, 9, 10, 12$.
  voir: [symbole-legendre]

- id: symbole-legendre
  terme: symbole de Legendre
  notation: $\big(\frac ap\big)$
  defini_dans: rq-legendre
  definition: |
    Pour un [[nombre-premier|nombre premier]] impair $p$ et un entier $a$, le nombre $\big(\frac ap\big)$ vaut $0$ si $p$ [[divisibilite-anneau|divise]] $a$, $1$ si $a$ est un [[residu-quadratique|résidu quadratique]] modulo $p$, et $-1$ sinon. Il est multiplicatif en $a$ et se calcule par le critère d'Euler, $\big(\frac ap\big) \equiv a^{\frac{p-1}2} \pmod p$, ou par la loi de réciprocité quadratique.
  voir: [loi-reciprocite-quadratique]

- id: loi-reciprocite-quadratique
  terme: loi de réciprocité quadratique
  defini_dans: rq-reciprocite
  definition: |
    Pour deux [[nombre-premier|nombres premiers]] impairs distincts $p$ et $q$, l'égalité $\big(\frac pq\big)\big(\frac qp\big) = (-1)^{\frac{p-1}2 \cdot \frac{q-1}2}$ entre [[symbole-legendre|symboles de Legendre]] : $p$ est un carré modulo $q$ si et seulement si $q$ est un carré modulo $p$, sauf si $p \equiv q \equiv 3 \pmod 4$, où exactement l'un des deux l'est. Elle se complète par $\big(\frac{-1}p\big) = (-1)^{\frac{p-1}2}$ et $\big(\frac 2p\big) = (-1)^{\frac{p^2-1}8}$.

- id: symbole-jacobi
  terme: symbole de Jacobi
  notation: $\big(\frac an\big)$
  defini_dans: rq-jacobi
  definition: |
    Pour un entier $n \geqslant 1$ impair, produit de [[nombre-premier|nombres premiers]] $p_1 \cdots p_r$ non nécessairement distincts, et un entier $a$, le produit $\big(\frac an\big) = \prod_i \big(\frac a{p_i}\big)$ de [[symbole-legendre|symboles de Legendre]]. Il est multiplicatif en $a$ et en $n$, vérifie les deux lois complémentaires et la [[loi-reciprocite-quadratique|loi de réciprocité]] pour deux entiers impairs positifs [[premiers-entre-eux|premiers entre eux]], et se calcule ainsi sans factoriser. La valeur $1$ ne fait pas de $a$ un carré modulo $n$ : $\big(\frac 2{15}\big) = 1$.
  voir: [symbole-legendre]

- id: somme-gauss
  terme: somme de Gauss
  defini_dans: rq-sommes-gauss
  definition: |
    Pour un [[nombre-premier|nombre premier]] impair $q$ et un élément $\zeta$ d'ordre $q$ du groupe multiplicatif d'un [[corps]] de caractéristique différente de $q$, la somme $\tau = \sum_{a=1}^{q-1} \big(\frac aq\big)\zeta^a$, pondérée par le [[symbole-legendre|symbole de Legendre]]. Son carré vaut $(-1)^{\frac{q-1}2}q$ ; dans un corps fini de [[caracteristique-corps|caractéristique]] $p$, la comparaison de $\tau^p$ et de $\tau$ donne la [[loi-reciprocite-quadratique|loi de réciprocité quadratique]].

- id: groupe-diedral
  terme: groupe diédral
  defini_dans: gf-diedraux
  definition: |
    Le groupe $\mathcal D_n = \mathbb Z/n\mathbb Z \rtimes \mathbb Z/2\mathbb Z$, d'ordre $2n$, où le facteur $\mathbb Z/2\mathbb Z$ agit par $x \mapsto -x$ ; pour $n \geqslant 3$, c'est le groupe des isométries du polygone régulier à $n$ côtés.

- id: groupe-resoluble
  terme: groupe résoluble
  defini_dans: gs-resolubles
  definition: |
    Un groupe qui admet une suite de sous-groupes emboîtés, chacun distingué dans le précédent, de quotients abéliens, jusqu'au groupe trivial. Le nœud {{gs-sn|𝔖ₙ non résoluble}} montrera que $\mathfrak S_n$ ne l'est pas pour $n \geqslant 5$ ; le nœud {{gf-moins-de-60|Ordres < 60}}, que tout groupe d'ordre inférieur à $60$ l'est, ce qui comprend $\mathfrak S_n$ pour $n \leqslant 4$, et que $\mathfrak A_5$, d'ordre $60$, ne l'est pas.

- id: groupe-simple
  terme: groupe simple
  defini_dans: gf-non-simples
  definition: |
    Un groupe non réduit au neutre dont les seuls sous-groupes distingués sont $\{e\}$ et lui-même. Le nœud {{gf-moins-de-60|Ordres < 60}} montrera qu'un groupe simple d'ordre inférieur à $60$ est cyclique d'ordre premier, et le nœud {{jh-a5-simple|𝔄₅ simple}} que le [[groupe-alterne|groupe alterné]] $\mathfrak A_5$, d'ordre $60$, est simple.
  voir: [groupe-resoluble, suite-composition]

- id: suite-normale
  terme: suite normale
  defini_dans: jh-schreier
  definition: |
    Une suite finie de sous-groupes $G = G_0 \supset G_1 \supset \cdots \supset G_r = \{e\}$, chacun distingué dans le précédent ; ses facteurs sont les quotients $G_{i-1}/G_i$. Le théorème de Schreier dit que deux suites normales d'un groupe non trivial ont des [[raffinement-suite|raffinements]] qui ont les mêmes facteurs, à l'ordre et à isomorphisme près.
  voir: [suite-composition]

- id: suite-composition
  terme: suite de composition
  defini_dans: jh-composition
  definition: |
    Une [[suite-normale|suite normale]] dont tous les [[facteurs-suite-normale|facteurs]], appelés [[facteurs-composition|facteurs de composition]], sont des [[groupe-simple|groupes simples]]. Tout groupe fini en a une, et $\mathbb Z$ n'en a pas. Selon les ouvrages, ce nom désigne parfois une suite normale quelconque.
  voir: [theoreme-jordan-holder]

- id: theoreme-jordan-holder
  terme: théorème de Jordan-Hölder
  defini_dans: jh-jordan-holder
  definition: |
    Deux [[suite-composition|suites de composition]] d'un même groupe ont la même longueur et les mêmes [[facteurs-suite-normale|facteurs]], à l'ordre et à isomorphisme près. Pour $\mathbb Z/12\mathbb Z$, les facteurs sont toujours $\mathbb Z/2\mathbb Z$, $\mathbb Z/2\mathbb Z$ et $\mathbb Z/3\mathbb Z$, rencontrés dans l'un des trois ordres possibles.
  voir: [groupe-resoluble]

- id: transformee-fourier
  terme: transformée de Fourier
  defini_dans: fo-transformee
  definition: |
    Pour $f$ intégrable sur $\mathbb R$, la fonction $\hat f(\xi) = \int f(x)e^{-ix\xi}\,dx$, continue et tendant vers $0$ à l'infini. Elle transforme la convolution en produit ; le nœud {{fo-inversion|Inversion}} montrera qu'elle s'inverse lorsque $\hat f$ est intégrable.

- id: fonction-caracteristique
  terme: fonction caractéristique
  defini_dans: fo-caracteristiques
  definition: |
    La fonction $t \mapsto E[e^{itX}]$ d'une [[variable-aleatoire|variable aléatoire]], transformée de Fourier de sa loi. Elle détermine la loi, et celle d'une somme de variables indépendantes est le produit des fonctions caractéristiques.
  voir: [transformee-fourier, fonction-caracteristique-relation]

- id: equation-differentielle
  terme: équation différentielle
  defini_dans: ed-cauchy-lipschitz
  definition: |
    Une relation $y' = F(t, y)$ entre une fonction inconnue $y$ de la variable $t$ et sa dérivée. Si $F$ est continue et lipschitzienne en $y$ sur un cylindre $[t_0 - a, t_0 + a] \times \bar B(y_0, r)$, le théorème de Cauchy-Lipschitz donne une solution qui passe par $(t_0, y_0)$, définie et unique sur un intervalle assez petit autour de $t_0$ ; le nœud {{ed-maximales|Solutions maximales}} montrera que, si $F$ est localement lipschitzienne en $y$, il passe par chaque point une unique solution maximale.

- id: exponentielle-matrice
  terme: exponentielle de matrice
  defini_dans: ed-lineaires
  definition: |
    La somme $e^A = \sum_k A^k/k!$, qui converge dans $\mathcal M_n(\mathbb R)$. La fonction $t \mapsto e^{tA}$ résout $Y' = AY$, $Y(0) = I$, et $\det e^A = e^{\operatorname{tr}A}$.
  voir: [exponentielle]

- id: flot
  terme: flot
  defini_dans: ed-flot
  definition: |
    La famille des applications $\varphi_t$ qui envoient un point sur la position, au temps $t$, de la [[courbe-integrale|courbe intégrale]] d'un champ de vecteurs issue de ce point. Elle vérifie $\varphi_{t+s} = \varphi_t \circ \varphi_s$.

- id: domaine-flot
  terme: domaine du flot
  defini_dans: ed-domaine-flot
  definition: |
    L'ensemble $D$ des couples $(t, x)$ tels que la [[courbe-integrale|courbe intégrale]] issue de $x$ soit définie au temps $t$. C'est un ouvert, et $\varphi_t$ est une bijection de $D_t = \{x : (t, x) \in D\}$ sur $D_{-t}$, de réciproque $\varphi_{-t}$.
  voir: [flot]

- id: equation-variationnelle
  terme: équation variationnelle
  defini_dans: ed-variationnelle
  definition: |
    Le système [[systeme-lineaire-edo|linéaire]] $Z' = dX(\varphi_s(x))\,Z$, $Z(0) = I$, obtenu en linéarisant un champ $X$ le long de sa [[courbe-integrale|courbe intégrale]] issue de $x$. Sa [[solution-edo|solution]] au temps $t$ est la différentielle $d\varphi_t(x)$ du flot.
  voir: [flot]

- id: equilibre
  terme: équilibre (d'un champ de vecteurs)
  defini_dans: ly-equilibres
  definition: |
    Un point $a$ où le champ $X$ s'annule. La [[courbe-integrale|courbe intégrale]] issue de $a$ est constante, et toute courbe intégrale qui a une limite dans l'ouvert de définition quand $t \to +\infty$ tend vers un équilibre.
  voir: [flot]

- id: equilibre-stable
  terme: équilibre stable (au sens de Liapounov)
  defini_dans: ly-equilibres
  definition: |
    Un [[equilibre|équilibre]] $a$ tel que, pour tout $\varepsilon > 0$, il existe $\delta > 0$ pour lequel toute [[courbe-integrale|courbe intégrale]] issue d'un point à distance moins de $\delta$ de $a$ soit définie pour tous les temps positifs et reste à distance moins de $\varepsilon$ de $a$. La notion ne dépend pas de la norme.

- id: asymptotiquement-stable
  terme: équilibre asymptotiquement stable
  defini_dans: ly-equilibres
  definition: |
    Un [[equilibre-stable|équilibre stable]] qui est de plus [[equilibre-attractif|attractif]] : les [[courbe-integrale|courbes intégrales]] issues des points assez proches tendent vers lui. Un équilibre attractif n'est pas forcément stable.

- id: fonction-liapounov
  terme: fonction de Liapounov
  defini_dans: ly-liapounov
  definition: |
    Pour un [[equilibre|équilibre]] $a$, une fonction $V$ de classe $C^1$ sur un voisinage ouvert de $a$, nulle en $a$, strictement positive ailleurs, dont la dérivée le long du champ, $\dot V = dV(X)$, est négative. Elle est stricte si de plus $\dot V < 0$ hors de $a$. Son existence entraîne la stabilité de $a$, et l'existence d'une fonction de Liapounov stricte sa stabilité asymptotique.

- id: equation-liapounov
  terme: équation de Liapounov
  defini_dans: ly-equation
  definition: |
    L'équation ${}^tAQ + QA = -I$, d'inconnue la matrice $Q$. Si toutes les [[valeurs-propres-complexes|valeurs propres complexes]] de $A$ ont une [[partie-reelle|partie réelle]] strictement négative, elle a pour unique solution $P = \int_0^{+\infty} e^{s\,{}^tA}e^{sA}\,ds$, symétrique définie positive, et ${}^tyPy$ est une [[fonction-liapounov|fonction de Liapounov]] pour $y' = Ay$.

- id: ensemble-omega-limite
  terme: ensemble ω-limite
  defini_dans: ly-lasalle
  definition: |
    L'ensemble $\omega(x) = \bigcap_{T \geqslant 0} \overline{\{\varphi_t(x) : t \geqslant T\}}$ des points d'accumulation, quand $t \to +\infty$, de la [[courbe-integrale|courbe intégrale]] issue de $x$. Si cette courbe reste dans un compact, il est compact, non vide et [[positivement-invariante|positivement invariant]].
  voir: [flot]

- id: systeme-linearise
  terme: système linéarisé
  defini_dans: ly-linearisation
  definition: |
    En un [[equilibre|équilibre]] $a$ d'un champ $X$ de classe $C^1$, le système [[systeme-lineaire-edo|linéaire]] $h' = Ah$, où $A = dX(a)$. Son flot $e^{tA}$ est la différentielle en $a$ du flot de $X$ ; s'il a toutes ses valeurs propres de [[partie-reelle|partie réelle]] strictement négative, $a$ est asymptotiquement stable.

- id: groupe-lie
  terme: groupe de Lie
  defini_dans: li-definition
  definition: |
    Un groupe muni d'une structure de [[variete-differentiable|variété]] pour laquelle la multiplication et l'inversion sont lisses. Exemples : le [[groupe-lineaire|groupe linéaire]] $GL_n(\mathbb R)$, $O(n)$, $SO(n)$.

- id: algebre-lie
  terme: algèbre de Lie
  notation: '$\mathfrak g$'
  defini_dans: li-algebre
  definition: |
    Pour un sous-groupe fermé $G$ du [[groupe-lineaire|groupe linéaire]] $GL_n(\mathbb R)$, l'ensemble des matrices $A$ telles que $e^{tA} \in G$ pour tout réel $t$ ; c'est un sous-espace vectoriel stable par le [[crochet-matrices|crochet]] $[A, B] = AB - BA$. Le théorème de Cartan-von Neumann ({{li-cartan|Théorème de Cartan}}) montrera que $G$ est une sous-variété, dont c'est l'espace tangent en l'identité.

- id: esperance-conditionnelle
  terme: espérance conditionnelle
  defini_dans: mt-conditionnelle
  definition: |
    Pour $X$ intégrable et une sous-tribu $\mathcal G$, l'unique variable $\mathcal G$-mesurable $Y$, à égalité presque sûre près, telle que $E[X\mathbf 1_G] = E[Y\mathbf 1_G]$ pour tout $G \in \mathcal G$ ; dans $L^2$, c'est une [[projection-orthogonale|projection orthogonale]].
  voir: [esperance]

- id: martingale
  terme: martingale
  defini_dans: mt-martingales
  definition: |
    Une suite $(M_n)$ de variables intégrables, adaptée à une filtration, telle que $E[M_{n+1} \mid \mathcal F_n] = M_n$ : le gain espéré, sachant le passé, est nul.
  voir: [esperance-conditionnelle]

- id: temps-arret
  terme: temps d'arrêt
  defini_dans: mt-martingales
  definition: |
    Pour une filtration $(\mathcal F_n)$, une variable $T$ à valeurs dans $\mathbb N \cup \{+\infty\}$ telle que $\{T = n\} \in \mathcal F_n$ pour tout $n$ : la décision de s'arrêter à l'instant $n$ ne dépend que de ce qui est connu à cet instant. Le premier instant où une suite adaptée atteint un niveau en est un ; le dernier n'en est pas un en général.
  voir: [martingale]

- id: tribu-passe
  terme: tribu du passé avant un temps d'arrêt
  defini_dans: mu-arret
  definition: |
    Pour un [[temps-arret|temps d'arrêt]] $T$, la tribu $\mathcal F_T$ des événements $A \in \mathcal F_\infty$ tels que $A \cap \{T = n\} \in \mathcal F_n$ pour tout $n$ : sur $\{T = n\}$, on sait à l'instant $n$ si $A$ est réalisé. Elle contient toute l'histoire de la suite jusqu'à $T$, et pas seulement $T$ et la valeur atteinte en $T$.

- id: martingale-arretee
  terme: martingale arrêtée
  defini_dans: mu-arret
  definition: |
    Pour une [[martingale]] $(M_n)$ et un [[temps-arret|temps d'arrêt]] $T$, la suite $M_{\min(T, n)}$, qui suit $(M_n)$ jusqu'à l'instant $T$ puis reste constante. C'est encore une martingale.

- id: uniformement-integrable
  terme: uniformément intégrable
  defini_dans: mu-ui
  definition: |
    Une famille $(X_i)$ de variables intégrables est uniformément intégrable si $\sup_i E\big[|X_i|\mathbf 1_{\{|X_i| > a\}}\big] \to 0$ quand $a \to +\infty$. C'est le cas d'une famille dominée par une variable intégrable, ou bornée dans $L^p$ pour un $p > 1$, mais pas forcément d'une famille bornée dans $L^1$. Le théorème de Vitali ({{mu-vitali|Théorème de Vitali}}) montrera que, pour une suite qui converge [[convergence-probabilite|en probabilité]], elle équivaut à la convergence dans $L^1$.

- id: martingale-fermee
  terme: martingale fermée
  defini_dans: mu-fermees
  definition: |
    Une [[martingale]] de la forme $M_n = E[X \mid \mathcal F_n]$ pour une variable intégrable $X$. Ce sont exactement les martingales [[uniformement-integrable|uniformément intégrables]], ou celles qui convergent dans $L^1$ ; leur limite $M_\infty$, intégrable et $\mathcal F_\infty$-mesurable, vérifie alors $M_n = E[M_\infty \mid \mathcal F_n]$, et l'on dit que la martingale est fermée par $M_\infty$. La variable $X$ n'est pas unique : si chaque $\mathcal F_n$ est réduite à $\{\varnothing, \Omega\}$, toute variable intégrable de même espérance convient.

- id: entier-algebrique
  terme: entier algébrique
  defini_dans: an-entiers
  definition: |
    Un nombre complexe [[racine-polynome|racine]] d'un polynôme unitaire à coefficients entiers. Les entiers algébriques forment un anneau, et les seuls qui soient rationnels sont les entiers.

- id: norme-algebrique
  terme: norme (corps de nombres)
  defini_dans: an-quadratiques
  definition: |
    Pour $\alpha = a + b\sqrt d$, le produit $N(\alpha) = \alpha\bar\alpha = a^2 - db^2$ par son [[conjugue-quadratique|conjugué]]. Elle est multiplicative, entière sur l'anneau des [[entier-algebrique|entiers]], et vaut $\pm 1$ exactement sur les unités.

- id: norme-ideal
  terme: norme d'un idéal
  defini_dans: an-norme-ideal
  definition: |
    Pour un idéal non nul $I$ de l'anneau des entiers $\mathcal O$ d'un corps quadratique, l'[[indice-ideal|indice]] $N(I) = [\mathcal O : I]$, nombre d'éléments de $\mathcal O/I$. Elle est multiplicative, et la norme de l'idéal principal $(\beta)$ est la valeur absolue de la [[norme-algebrique|norme]] de $\beta$.

- id: groupe-classes
  terme: groupe des classes
  defini_dans: an-classes
  definition: |
    Pour un corps quadratique $K$, le quotient de l'ensemble des idéaux non nuls de l'anneau des entiers par la relation $\alpha I = \beta J$ ($\alpha, \beta \in \mathcal O$ non nuls), c'est-à-dire l'ensemble des [[classe-ideaux|classes d'idéaux]], muni du [[produit-ideaux|produit des idéaux]]. C'est un [[groupe]] abélien fini, trivial si et seulement si l'anneau des entiers est [[anneau-principal|principal]] ; le nœud {{an-classes-z5|Classes de ℤ[√−5]}} montrera que, pour $\mathbb Q(\sqrt{-5})$, il a deux éléments.

# ------------------------------------------------------------------ ensembles usuels
# Ces entrées portent une « notation », composée par KaTeX à côté du terme. Dans les formules
# des fiches, on les marque par \lex{id}{notation}, ce qui les rend cliquables comme les termes.

- id: ensemble-entiers-naturels
  terme: entiers naturels (ensemble des)
  notation: $\mathbb N$
  defini_dans: n-omega
  definition: |
    L'ensemble $\mathbb N$, aussi noté $\omega$, est le plus petit ensemble [[inductif-successeur|inductif]] : il contient $0 = \varnothing$, il contient le [[successeur-ensemble|successeur]] $S(x) = x \cup \{x\}$ de chacun de ses éléments, et il est inclus dans tout ensemble qui a ces deux propriétés. Son existence repose sur l'axiome de l'infini. Chaque entier est l'ensemble des entiers qui le précèdent, par exemple $3 = \{0, 1, 2\}$.

- id: ensemble-entiers-relatifs
  terme: entiers relatifs (ensemble des)
  notation: $\mathbb Z$
  defini_dans: z-construction
  definition: |
    L'ensemble $\mathbb Z$ est le [[groupe-symetrise|symétrisé]] du monoïde $(\mathbb N, +)$ : le quotient de $\mathbb N \times \mathbb N$ par la relation $(a, b) \sim (c, d) \iff a + d = b + c$, la classe de $(a, b)$ représentant la différence $a - b$. On identifie l'entier naturel $n$ à la classe de $(n, 0)$ ; tout élément de $\mathbb Z$ s'écrit alors $n$ ou $-n$ avec $n \in \mathbb N$.

- id: ensemble-rationnels
  terme: nombres rationnels (ensemble des)
  notation: $\mathbb Q$
  defini_dans: q-construction
  definition: |
    L'ensemble $\mathbb Q$ est le [[corps-fractions|corps des fractions]] de l'anneau intègre $\mathbb Z$ : le quotient de $\mathbb Z \times (\mathbb Z \setminus \{0\})$ par la relation $(a, b) \sim (c, d) \iff ad = bc$, la classe de $(a, b)$ étant notée $a/b$. L'anneau $\mathbb Z$ s'y plonge par $a \mapsto a/1$.

- id: ensemble-reels
  terme: nombres réels (ensemble des)
  notation: $\mathbb R$
  defini_dans: rr-definition
  definition: |
    Dans l'atlas, $\mathbb R$ est l'ensemble des [[coupure-dedekind|coupures de Dedekind]] de $\mathbb Q$, ordonné par inclusion ; le rationnel $q$ y est représenté par la coupure $\{x \in \mathbb Q : x < q\}$. On montre ensuite que, muni de l'addition et de la multiplication des coupures, c'est un corps ordonné complet, unique à isomorphisme près : c'est cette propriété, et non la construction, qui sert dans toute la suite.
  voir: [corps-ordonne-complet]

- id: ensemble-complexes
  terme: nombres complexes (ensemble des)
  notation: $\mathbb C$
  defini_dans: c-construction
  definition: |
    L'ensemble $\mathbb C$ est le corps quotient $\mathbb R[X]/(X^2 + 1)$, l'idéal engendré par $X^2 + 1$ étant maximal. La classe $i$ de $X$ vérifie $i^2 = -1$, tout élément s'écrit de manière unique $a + ib$ avec $a$ et $b$ réels, et $\mathbb R$ s'y plonge par les classes des [[polynome-constant|polynômes constants]].
  voir: [nombre-complexe]

- id: ensemble-parties
  terme: ensemble des parties
  notation: $\mathcal P(A)$
  defini_dans: zf-parties
  definition: |
    Pour un ensemble $A$, l'ensemble $\mathcal P(A)$ a pour éléments exactement les parties de $A$, c'est-à-dire les ensembles $x$ tels que $x \subset A$. Son existence est l'axiome des parties, et son unicité vient de l'axiome d'extensionnalité.

- id: anneau-zn
  terme: entiers modulo n (anneau des)
  notation: $\mathbb Z/n\mathbb Z$
  defini_dans: z-zn
  definition: |
    Pour un entier $n \geqslant 1$, l'anneau quotient de $\mathbb Z$ par l'[[ideal|idéal]] $n\mathbb Z$ des multiples de $n$. Il a exactement $n$ éléments, les classes $\overline 0, \overline 1, \dots, \overline{n - 1}$, et c'est un [[corps]] si et seulement si $n$ est premier, ce qui équivaut aussi à ce qu'il soit intègre.

- id: n-uplet
  terme: n-uplet
  notation: $A^n$
  defini_dans: n-sommes
  definition: |
    Pour un ensemble $A$ et un entier $n \geqslant 1$, un $n$-uplet d'éléments de $A$ est une [[famille]] $(a_1, \dots, a_n)$ indexée par $\{1, \dots, n\}$ ; leur ensemble est noté $A^n$. Ainsi $\mathbb R^n$ est l'ensemble des $n$-uplets de réels, et $K^n$ celui des $n$-uplets d'éléments d'un corps $K$. On identifie $A^1$ à $A$, et $A^2$ au [[produit-cartesien|produit cartésien]] $A \times A$.

- id: sphere-unite
  terme: sphère unité
  notation: $S^n$
  defini_dans: tr-sphere
  definition: |
    Pour $n \geqslant 0$, la sphère unité de dimension $n$ est $S^n = \{x \in \mathbb R^{n+1} : x_1^2 + \cdots + x_{n+1}^2 = 1\}$, munie de la topologie induite par la [[topologie-produit]] de $\mathbb R^{n+1}$. C'est une partie compacte de $\mathbb R^{n+1}$. Ainsi $S^0 = \{-1, 1\}$, et $S^1$ est le cercle unité de $\mathbb R^2$. Il ne faut pas la confondre avec le quotient $\mathbb R/\mathbb Z$, que la topologie algébrique note aussi $S^1$ et qui lui est [[espaces-homeomorphes|homéomorphe]].
  voir: [cercle-quotient, sous-variete]

- id: topologie-usuelle
  terme: topologie usuelle de ℝ
  defini_dans: tr-ouverts
  definition: |
    La [[topologie|topologie]] de $\mathbb R$ dont les [[ouvert|ouverts]] sont les parties $U$ telles que, pour tout $x \in U$, il existe $r > 0$ avec $]x - r, x + r[ \,\subset U$. C'est celle de la distance $|x - y|$, et aussi celle de l'ordre : les intervalles ouverts bornés en forment une [[base-topologie|base]].

- id: partie-dense
  terme: partie dense
  defini_dans: tr-dense
  definition: |
    Une partie $D$ d'un [[espace-topologique]] $X$ est dense si son [[adherence|adhérence]] est $X$ tout entier, c'est-à-dire si tout ouvert non vide rencontre $D$. Ainsi $\mathbb Q$ et $\mathbb R \setminus \mathbb Q$ sont denses dans $\mathbb R$.

- id: cercle-quotient
  terme: cercle (quotient ℝ/ℤ)
  notation: $S^1 = \mathbb R/\mathbb Z$
  defini_dans: ta-cercle
  definition: |
    Le quotient de $\mathbb R$ par la relation $x \sim y \iff x - y \in \mathbb Z$, muni de la [[topologie-quotient|topologie quotient]]. La projection $p : \mathbb R \to \mathbb R/\mathbb Z$ est un [[revetement|revêtement]], ce qui permet de calculer son [[groupe-fondamental|groupe fondamental]], isomorphe à $\mathbb Z$. Il est [[espaces-homeomorphes|homéomorphe]] à la [[sphere-unite|sphère unité]] $S^1$ de $\mathbb R^2$ par $t \mapsto (\cos 2\pi t, \sin 2\pi t)$, que fournit la trigonométrie de l'analyse réelle, construite à partir de l'arc tangente. Un autre homéomorphisme, qui s'en passe, envoie $\mathbb R/\mathbb Z$ sur un losange, lui-même homéomorphe au cercle unité par projection radiale.
  voir: [bouquet-cercles]

- id: mot-reduit
  terme: mot réduit
  defini_dans: vk-mots
  definition: |
    Sur un ensemble $S$, un [[mot-ensemble|mot]] est une suite finie de [[lettre-ensemble|lettres]] $s$ ou $s^{-1}$, pour $s \in S$ ; il est réduit si aucune lettre n'y est immédiatement suivie de son inverse. Tout mot se réduit, en supprimant des facteurs $xx^{-1}$, en un unique mot réduit, ce que démontre l'action de van der Waerden sur les mots réduits. Le mot $aba^{-1}b^{-1}$ est réduit.

- id: groupe-libre
  terme: groupe libre
  notation: $F(S)$
  defini_dans: vk-groupe-libre
  definition: |
    Le groupe $F(S)$ des classes de [[mot-ensemble|mots]] sur un ensemble $S$, deux mots étant équivalents s'ils ont la même forme [[mot-reduit|réduite]], muni de la [[concatenation-mots|concaténation]]. Toute application de $S$ dans un [[groupe]] se prolonge en un unique [[morphisme-groupes|morphisme]] de $F(S)$ dans ce groupe. Le groupe $\mathbb Z$ est libre sur $\{1\}$ ; pour $S$ à deux éléments, $F(S)$ n'est pas commutatif.

- id: sous-groupe-distingue-engendre
  terme: sous-groupe distingué engendré
  notation: $N(A)$
  defini_dans: vk-presentations
  definition: |
    Pour une partie $A$ d'un groupe $G$, l'intersection $N(A)$ des [[sous-groupe-distingue|sous-groupes distingués]] de $G$ qui contiennent $A$ : le plus petit d'entre eux, engendré par les conjugués $gag^{-1}$ des éléments de $A$. On l'appelle aussi clôture normale de $A$.

- id: presentation-groupe
  terme: présentation d'un groupe
  notation: $\langle S \mid R \rangle$
  defini_dans: vk-presentations
  definition: |
    Le [[groupe-quotient|groupe quotient]] $\langle S \mid R \rangle = F(S)/N(R)$ du [[groupe-libre|groupe libre]] sur un ensemble $S$ de générateurs par le [[sous-groupe-distingue-engendre|sous-groupe distingué engendré]] par une partie $R$ de relations. Par exemple, $\langle a, b \mid aba^{-1}b^{-1} \rangle \cong \mathbb Z^2$ et $\langle a \mid a^n \rangle \cong \mathbb Z/n\mathbb Z$.

- id: produit-libre
  terme: produit libre
  notation: $G_1 * G_2$
  defini_dans: vk-produit-libre
  definition: |
    Le groupe $G_1 * G_2$ engendré par deux groupes $G_1$ et $G_2$ sans autre relation que celles de chacun d'eux : morphismes de $G_1 * G_2$ dans un groupe $L$ et couples de morphismes $G_1 \to L$, $G_2 \to L$ se correspondent. On a $\mathbb Z * \mathbb Z \cong F(a, b)$, groupe [[groupe-libre|libre]] non commutatif, à ne pas confondre avec le produit direct $\mathbb Z \times \mathbb Z$.

- id: produit-amalgame
  terme: produit amalgamé
  notation: $G_1 *_K G_2$
  defini_dans: vk-amalgame
  definition: |
    Pour deux morphismes $i_1 : K \to G_1$ et $i_2 : K \to G_2$, le quotient du [[produit-libre|produit libre]] $G_1 * G_2$ par le [[sous-groupe-distingue-engendre|sous-groupe distingué engendré]] par les $i_1(k)\,i_2(k)^{-1}$ : on y identifie les deux images de chaque élément de $K$. Le théorème de Seifert-van Kampen exprime le groupe fondamental d'une réunion de deux ouverts comme un tel produit.

- id: theoreme-van-kampen
  terme: théorème de Seifert-van Kampen
  defini_dans: vk-van-kampen
  definition: |
    Si $X = U \cup V$, où $U$ et $V$ sont des ouverts [[connexe-par-arcs|connexes par arcs]] d'intersection connexe par arcs non vide, et $x_0 \in U \cap V$, alors $\pi_1(X, x_0)$ est le [[produit-amalgame|produit amalgamé]] de $\pi_1(U, x_0)$ et de $\pi_1(V, x_0)$ au-dessus de $\pi_1(U \cap V, x_0)$, par les morphismes induits par les inclusions (Seifert, 1931 ; van Kampen, 1933).

- id: retracte-deformation
  terme: rétracte par déformation
  defini_dans: vk-retractes
  definition: |
    Une partie $A$ d'un espace $X$ telle qu'il existe une application continue $H : X \times [0, 1] \to X$ avec $H(x, 0) = x$, $H(x, 1) \in A$ et $H(a, t) = a$ pour $a \in A$. L'inclusion de $A$ dans $X$ induit alors des isomorphismes entre les [[groupe-fondamental|groupes fondamentaux]] en tout point de $A$.

- id: tore
  terme: tore
  notation: $T = S^1 \times S^1$
  defini_dans: vk-bouquet
  definition: |
    Le produit $S^1 \times S^1$ de deux copies du cercle $\mathbb R/\mathbb Z$, muni de la [[topologie-produit|topologie produit]]. Le nœud {{vk-tore-ouverts|Ouverts du tore}} montrera que c'est le carré $[0, 1]^2$ dont on recolle les côtés opposés, et le nœud {{vk-tore|Tore}} que son [[groupe-fondamental|groupe fondamental]] est $\mathbb Z^2$.

- id: bouquet-cercles
  terme: bouquet de deux cercles
  defini_dans: vk-bouquet
  definition: |
    La partie $(S^1 \times \{e\}) \cup (\{e\} \times S^1)$ du [[tore]] $S^1 \times S^1$, où $e$ est l'image de $0$ dans $S^1 = \mathbb R/\mathbb Z$ : deux cercles qui se touchent en un point. Son [[groupe-fondamental|groupe fondamental]] est le [[groupe-libre|groupe libre]] à deux générateurs, non commutatif.

- id: demi-droite-achevee
  terme: demi-droite achevée
  notation: $[0, +\infty]$
  defini_dans: m-droite-achevee
  definition: |
    L'ensemble $[0, +\infty[ \cup \{+\infty\}$, ordonné en plaçant $+\infty$ au-dessus de tous les réels positifs. Toute partie non vide y a une [[borne-superieure|borne supérieure]], et l'addition prolongée par $a + (+\infty) = +\infty$ permet de définir la somme de toute suite de termes, sans condition de convergence : c'est le cadre des mesures et des intégrales de fonctions positives.

- id: espace-fonctions-integrables
  terme: fonctions intégrables (espace des)
  notation: $\mathcal L^1(\mu)$
  defini_dans: m-integrables
  definition: |
    L'ensemble des fonctions mesurables $f : X \to \mathbb R$ telles que $\int |f| \, d\mu < +\infty$, pour une [[mesure]] $\mu$ sur $X$. Il est stable par addition et par multiplication par un réel : c'est un [[module|$\mathbb R$-module]], sur lequel l'intégrale est linéaire et croissante. Deux fonctions égales [[presque-partout|presque partout]] y sont distinctes mais ont même intégrale ; l'espace $L^1(\mu)$ de l'analyse fonctionnelle les identifie.
  voir: [espace-L1]

- id: espace-L1
  terme: espace L¹
  notation: $L^1(\mu)$
  defini_dans: f-lp
  definition: |
    L'ensemble des classes de fonctions [[integrable-lebesgue|intégrables]] pour la relation d'égalité [[presque-partout|presque partout]], muni de la norme $\|f\|_1 = \int |f| \, d\mu$. Le passage aux classes est indispensable : sans lui, $\|f\|_1 = 0$ n'entraînerait pas $f = 0$. Par le théorème de Riesz-Fischer, c'est un [[banach|espace de Banach]]. On écrit $L^1$ quand la mesure est claire.
  voir: [espace-fonctions-integrables]

- id: espace-L2
  terme: espace L²
  notation: $L^2(\mu)$
  defini_dans: f-lp
  definition: |
    L'ensemble des classes, pour l'égalité [[presque-partout|presque partout]], de fonctions mesurables $f$ telles que $\int f^2 \, d\mu < +\infty$, muni du [[produit-scalaire|produit scalaire]] $\langle f, g \rangle = \int fg \, d\mu$ et de la norme $\|f\|_2 = \big(\int f^2 \, d\mu\big)^{1/2}$. Par le théorème de Riesz-Fischer, il est complet ⋆ : la démonstration choisit un représentant de chaque classe d'une suite, par le [[choix-denombrable|choix dénombrable]], dont se passe la forme sans choix du même nœud, (iv), pour une suite de fonctions données. En probabilités ({{p-espace|Espace probabilisé}}), pour une probabilité $P$ sur un espace $(\Omega, \mathcal F)$, on écrit $L^2(\Omega, \mathcal F, P)$, ou simplement $L^2$ : ses éléments sont des classes de variables aléatoires de carré intégrable.
  voir: [espace-hilbert]

- id: espace-l2-suites
  terme: espace ℓ²
  notation: $\ell^2$
  defini_dans: f-lp
  definition: |
    L'ensemble des suites réelles $(a_n)$ telles que $\sum_n a_n^2 < +\infty$, muni de la norme $\|a\|_2 = \big(\sum_n a_n^2\big)^{1/2}$. C'est l'espace $L^2$ de la mesure de comptage sur $\mathbb N$ ; chaque classe y est réduite à une seule suite, puisque seul l'ensemble vide est de mesure nulle.

- id: espace-l1-suites
  terme: espace ℓ¹
  notation: $\ell^1$
  defini_dans: f-exemples
  definition: |
    L'ensemble des suites réelles $(a_n)$ telles que $\sum_n |a_n| < +\infty$, muni de la norme $\|a\|_1 = \sum_n |a_n|$. C'est un [[banach|espace de Banach]].

- id: espace-bornees
  terme: fonctions bornées (espace des)
  notation: $\mathcal B(X)$
  defini_dans: f-exemples
  definition: |
    Pour un ensemble $X$, l'espace des fonctions bornées de $X$ dans $\mathbb R$, muni de la norme uniforme $\|f\|_\infty = \sup_X |f|$. C'est un [[banach|espace de Banach]] ; converger pour cette norme, c'est converger uniformément sur $X$.

- id: espace-continues
  terme: fonctions continues (espace des)
  notation: $C(K)$
  defini_dans: f-exemples
  definition: |
    Pour un espace topologique [[compact]] $K$, l'espace des fonctions continues de $K$ dans $\mathbb R$, muni de la norme uniforme $\|f\|_\infty = \sup_K |f|$, finie parce qu'une fonction continue sur un compact est bornée. C'est un sous-espace fermé de $\mathcal B(K)$, donc un [[banach|espace de Banach]].
  voir: [espace-bornees, equicontinue, sous-algebre-fonctions]

- id: equicontinue
  terme: partie équicontinue
  defini_dans: fc-equicontinuite
  definition: |
    Une partie $A$ de l'espace des fonctions continues d'un [[espace-metrique]] $K$ dans $\mathbb R^p$ est équicontinue en $x$ si, pour tout $\varepsilon > 0$, un même $\delta > 0$ vérifie $\|f(y) - f(x)\|_\infty < \varepsilon$ pour toutes les $f \in A$ et tous les $y$ tels que $d(x, y) < \delta$ ; elle est équicontinue si elle l'est en tout point. Sur un compact, elle est alors [[equicontinue-uniforme|uniformément équicontinue]]. La suite $x \mapsto x^n$ n'est pas équicontinue en $1$ sur $[0, 1]$.
  voir: [partie-relativement-compacte]

- id: partie-relativement-compacte
  terme: partie relativement compacte
  defini_dans: fc-ascoli
  definition: |
    Une partie d'un [[espace-topologique]] [[separe]] dont l'[[adherence]] est [[compact|compacte]]. Dans l'espace des fonctions continues sur un espace métrique compact, muni de la norme uniforme, ce sont les parties bornées et [[equicontinue|équicontinues]] (théorème d'Ascoli).

- id: polynomes-bernstein
  terme: polynômes de Bernstein
  defini_dans: fc-bernstein
  definition: |
    Pour $f : [0, 1] \to \mathbb R$ et $n \geqslant 1$, la fonction polynomiale $B_nf(x) = \sum_{k=0}^n f(\frac kn)\binom nk x^k(1 - x)^{n-k}$. Si $f$ est continue, $B_nf$ converge uniformément vers $f$ ; si $f$ est $L$-lipschitzienne, l'écart est au plus $\frac{L}{2\sqrt n}$.

- id: treillis-fonctions
  terme: treillis de fonctions
  defini_dans: fc-treillis
  definition: |
    Une partie $L$ de l'espace des fonctions continues sur un espace [[compact]] telle que $\max(f, g)$ et $\min(f, g)$ appartiennent à $L$ dès que $f$ et $g$ y appartiennent. Si elle prend en deux points quelconques deux valeurs quelconques, elle est dense pour la norme uniforme.

- id: sous-algebre-fonctions
  terme: sous-algèbre de fonctions continues
  defini_dans: fc-stone-weierstrass
  definition: |
    Un sous-espace vectoriel $A$ de l'espace des fonctions continues réelles sur un espace [[compact]] $K$, [[partie-stable|stable par produit]]. Par le théorème de Stone-Weierstrass, il est dense pour la norme uniforme s'il [[separe-points|sépare les points]] et si, en chaque point, l'une de ses fonctions ne s'annule pas, par exemple s'il contient les constantes.

- id: separe-points
  terme: sépare les points
  defini_dans: fc-stone-weierstrass
  definition: |
    Un ensemble $A$ de fonctions sur $K$ sépare les points si, pour tous $x \neq y$ dans $K$, il existe $g \in A$ telle que $g(x) \neq g(y)$. Les fonctions polynomiales paires sur $[-1, 1]$ ne séparent pas $x$ de $-x$.

- id: espace-separable
  terme: espace séparable
  defini_dans: fc-separabilite
  definition: |
    Un [[espace-topologique]] qui contient une suite dont l'ensemble des termes est une [[partie-dense|partie dense]]. L'espace des fonctions continues sur un compact de $\mathbb R^n$ l'est, par les polynômes à coefficients rationnels ; pour un compact métrique quelconque, il l'est avec le [[choix-denombrable]], et $\mathsf{ZF}$ seul ne le démontre pas.

- id: espace-applications-lineaires
  terme: applications linéaires (espace des)
  notation: $\mathcal L(E, F)$
  defini_dans: v-applications
  definition: |
    L'ensemble des [[application-lineaire|applications linéaires]] d'un espace vectoriel $E$ dans un espace vectoriel $F$ sur le même corps. C'est un sous-espace vectoriel de l'espace $F^E$ de toutes les applications de $E$ dans $F$, muni des opérations point par point. On note $\mathcal L(E) = \mathcal L(E, E)$ l'ensemble des [[endomorphisme|endomorphismes]] de $E$.

- id: espace-applications-continues
  terme: applications linéaires continues (espace des)
  notation: $\mathcal L_c(E, F)$
  defini_dans: f-operateurs
  definition: |
    Pour des [[espace-norme|espaces normés]] $E$ et $F$, l'espace des applications linéaires continues de $E$ dans $F$, muni de la [[norme-operateur|norme d'opérateur]]. Il est complet dès que $F$ l'est ; en particulier le dual topologique $E' = \mathcal L_c(E, \mathbb R)$ est toujours un espace de Banach.
  voir: [espace-applications-lineaires, dual-topologique]

- id: matrice
  terme: matrice
  defini_dans: v-matrices
  definition: |
    Une matrice à $p$ lignes et $n$ colonnes à coefficients dans un [[corps]] $K$ est une famille $A = (a_{ij})$ d'éléments de $K$ indexée par $\{1, \dots, p\} \times \{1, \dots, n\}$, $a_{ij}$ étant le coefficient de la ligne $i$ et de la colonne $j$ ; elle est carrée si $p = n$. Le produit $AB$, de coefficients $\sum_k a_{ik} b_{kj}$, n'est défini que si $A$ a autant de colonnes que $B$ a de lignes ; il est associatif, mais en général $AB \neq BA$. Les mêmes définitions valent sur un [[anneau-commutatif|anneau commutatif]].
  voir: [espace-matrices, matrice-application-lineaire]

- id: matrice-forme-bilineaire
  terme: matrice d'une forme bilinéaire
  defini_dans: fq-formes
  definition: |
    Si $\mathcal B = (e_1, \dots, e_n)$ est une [[base-vectorielle|base]] de $E$, la matrice de la [[forme-bilineaire|forme bilinéaire]] $b$ dans $\mathcal B$ est la [[matrice]] carrée $A = \big(b(e_i, e_j)\big)_{i,j}$, de sorte que $b(x, y) = {}^tX A Y$ pour les colonnes $X$ et $Y$ des [[coordonnees-base|coordonnées]] de $x$ et $y$. Elle est symétrique si $b$ l'est. Si $\mathcal B'$ est une autre base et $P = \operatorname{Mat}_{\mathcal B', \mathcal B}(\mathrm{id})$ la [[matrice-passage|matrice de passage]] de $\mathcal B$ à $\mathcal B'$, la matrice de $b$ dans $\mathcal B'$ est ${}^tPAP$ : elle change par [[matrices-congruentes|congruence]], et non par similitude comme la [[matrice-application-lineaire|matrice]] d'une application linéaire de $E$ dans $E$. La matrice d'une forme quadratique est celle de sa forme polaire.

- id: matrice-application-lineaire
  terme: matrice d'une application linéaire
  notation: $\operatorname{Mat}_{\mathcal B, \mathcal C}(u)$
  defini_dans: v-matrices
  definition: |
    Si $\mathcal B = (e_1, \dots, e_n)$ et $\mathcal C = (f_1, \dots, f_p)$ sont des [[base-vectorielle|bases]] de $E$ et $F$, la matrice de l'[[application-lineaire|application linéaire]] $u : E \to F$ dans ces bases est la [[matrice]] $\operatorname{Mat}_{\mathcal B, \mathcal C}(u) \in \mathcal M_{p,n}(K)$ dont la $j$-ième colonne contient les [[coordonnees-base|coordonnées]] de $u(e_j)$ dans $\mathcal C$ ; si $E = F$, la matrice de $u$ dans la base $\mathcal B$ est $\operatorname{Mat}_{\mathcal B, \mathcal B}(u)$. L'application $u \mapsto \operatorname{Mat}_{\mathcal B, \mathcal C}(u)$ est un isomorphisme d'espaces vectoriels de $\mathcal L(E, F)$ sur $\mathcal M_{p,n}(K)$, et la matrice de $v \circ u$ est le produit de celle de $v$ par celle de $u$, dans des bases compatibles. La définition vaut aussi pour les modules libres de rang fini, munis de bases finies, sur un anneau commutatif.

- id: propriete-topologique
  terme: propriété topologique
  defini_dans: t-homeo
  definition: |
    Une propriété des espaces topologiques est topologique si elle se transporte par [[homeomorphisme]] : dès qu'un espace l'a, tout espace qui lui est [[espaces-homeomorphes|homéomorphe]] l'a aussi. Elle ne dépend donc que de la [[topologie|topologie]], et non de la manière dont celle-ci a été obtenue. Une propriété définie à l'aide d'une structure plus fine que la topologie n'est pas topologique en général ; le chapitre des espaces métriques en donne deux exemples, le caractère borné et la complétude.

- id: espace-matrices
  terme: matrices (espace des)
  notation: $\mathcal M_{p,n}(K)$
  defini_dans: v-matrices
  definition: |
    L'ensemble des matrices à $p$ lignes et $n$ colonnes à coefficients dans un corps $K$, c'est-à-dire des familles $(a_{ij})$ indexées par $\{1, \dots, p\} \times \{1, \dots, n\}$. C'est un espace vectoriel de dimension $pn$. On note $\mathcal M_n(K) = \mathcal M_{n,n}(K)$ ; c'est de plus un anneau pour le produit matriciel, non commutatif dès que $n \geqslant 2$.

- id: groupe-orthogonal
  terme: groupe orthogonal
  notation: $O(n)$
  defini_dans: li-definition
  definition: |
    Le groupe $O(n) = \{A \in \mathcal M_n(\mathbb R) : {}^tAA = I\}$ des matrices orthogonales, qui sont celles qui préservent le [[produit-scalaire|produit scalaire]] usuel de $\mathbb R^n$. C'est une sous-variété de $\mathcal M_n(\mathbb R)$ de dimension $n(n-1)/2$, et un [[groupe-lie|groupe de Lie]]. Le groupe spécial orthogonal $SO(n) = O(n) \cap \{\det = 1\}$ en est un sous-groupe ouvert et fermé.

- id: groupe-automorphismes
  terme: groupe des automorphismes (d'une extension)
  notation: $\operatorname{Aut}(L/K)$
  defini_dans: gs-artin
  definition: |
    Pour une [[extension-corps|extension]] $L/K$, le groupe, pour la composition, des automorphismes du corps $L$ qui fixent chaque élément de $K$. Quand le [[degre-extension|degré]] $[L:K]$ est fini, l'ordre de ce groupe est au plus $[L:K]$ ; le nœud {{gs-galoisiennes|Extensions galoisiennes}} montrera que l'égalité caractérise les extensions galoisiennes, pour lesquelles le groupe est noté $\operatorname{Gal}(L/K)$.
  voir: [groupe-galois]

- id: espace-formes-alternees
  terme: formes alternées de degré k (espace des)
  notation: $\Lambda^k(E)$
  defini_dans: v-algebre-exterieure
  definition: |
    Pour un espace vectoriel $E$ de dimension $n$, l'espace des [[forme-alternee|formes $k$-linéaires alternées]] sur $E$, avec $\Lambda^0(E) = K$. Sa dimension est le nombre de parties à $k$ éléments de $\{1, \dots, n\}$ ; il est réduit à $\{0\}$ pour $k > n$. Le [[produit-exterieur|produit extérieur]] envoie $\Lambda^k(E) \times \Lambda^l(E)$ dans $\Lambda^{k+l}(E)$.

- id: corps-engendre
  terme: sous-corps engendré
  notation: $K(\alpha_1, \dots, \alpha_n)$
  defini_dans: gs-extensions
  definition: |
    Pour une [[extension-corps|extension]] $L/K$ et des éléments $\alpha_1, \dots, \alpha_n$ de $L$, le plus petit sous-corps de $L$ qui contient $K$ et les $\alpha_i$, intersection de tous les sous-corps qui les contiennent. Par exemple, $\mathbb Q(\sqrt 2) = \{a + b\sqrt 2 : a, b \in \mathbb Q\}$ dans $\mathbb R$.

- id: anneau-entiers
  terme: anneau des entiers (d'un corps de nombres)
  notation: $\mathcal O_K$
  defini_dans: an-entiers
  definition: |
    Pour un corps de nombres $K$, [[extension-finie|extension finie]] de $\mathbb Q$ contenue dans $\mathbb C$, l'anneau des [[entier-algebrique|entiers algébriques]] qui appartiennent à $K$. On a $\mathcal O_{\mathbb Q} = \mathbb Z$ et $\mathcal O_{\mathbb Q(i)} = \mathbb Z[i]$. L'erreur la plus répandue est de croire que $\mathcal O_{\mathbb Q(\sqrt d)}$ est toujours $\mathbb Z[\sqrt d]$ : pour $d = 5$, il contient aussi $(1 + \sqrt 5)/2$, [[racine-polynome|racine]] de $X^2 - X - 1$.

- id: corps-fini
  terme: corps fini
  notation: $\mathbb F_q$
  defini_dans: gs-corps-finis
  definition: |
    Un corps fini a pour cardinal une puissance $q = p^n$ de sa [[caracteristique-corps|caractéristique]] $p$. Pour chaque telle puissance, il en existe un, unique à isomorphisme près, noté $\mathbb F_q$ : le corps de décomposition de $X^q - X$ sur $\mathbb F_p = \mathbb Z/p\mathbb Z$. Son groupe multiplicatif est cyclique. L'erreur la plus répandue est de confondre $\mathbb F_4$ avec $\mathbb Z/4\mathbb Z$, qui n'est pas même intègre.

- id: entiers-gauss
  terme: entiers de Gauss
  notation: $\mathbb Z[i]$
  defini_dans: an-gauss
  definition: |
    Le sous-anneau $\mathbb Z[i] = \{a + bi : a, b \in \mathbb Z\}$ de $\mathbb C$, anneau des entiers de $\mathbb Q(i)$. Il est euclidien pour la norme $N(a + bi) = a^2 + b^2$, donc principal, et c'est ce qui permet de démontrer le théorème des deux carrés de Fermat.

- id: partie-v-spectre
  terme: fermé V(S) du spectre
  notation: $V(S)$
  defini_dans: ga-spectre
  definition: |
    Pour une partie $S$ d'un anneau commutatif $A$, l'ensemble $V(S) = \{\mathfrak p \in \operatorname{Spec} A : S \subset \mathfrak p\}$ des [[ideal-premier|idéaux premiers]] qui contiennent $S$. Il ne dépend que de l'idéal engendré par $S$, et les parties de cette forme sont, par définition, les fermés de la topologie de Zariski.
  voir: [topologie-zariski]

- id: element-irreductible
  terme: élément irréductible
  defini_dans: ac-divisibilite
  definition: |
    Dans un [[anneau-integre|anneau intègre]], un élément non nul et non inversible $p$ tel que $p = ab$ entraîne que $a$ ou $b$ est inversible. Les irréductibles de $\mathbb Z$ sont les $\pm p$, $p$ premier.
  voir: [element-premier, anneau-factoriel]

- id: element-premier
  terme: élément premier
  defini_dans: ac-divisibilite
  definition: |
    Dans un [[anneau-integre|anneau intègre]], un élément non nul et non inversible $p$ tel que $p \mid ab$ entraîne $p \mid a$ ou $p \mid b$ ; c'est le cas exactement quand l'idéal $pA$ est [[ideal-premier|premier]]. Un élément premier est irréductible, la réciproque étant fausse en général.

- id: anneau-factoriel
  terme: anneau factoriel
  defini_dans: ac-factoriels
  definition: |
    Un [[anneau-integre|anneau intègre]] où tout élément non nul est produit d'un inversible et d'[[element-irreductible|irréductibles]], de façon unique à l'ordre et aux [[elements-associes|associés]] près. Il revient au même de demander l'existence des écritures et que tout irréductible soit [[element-premier|premier]]. Exemples : $\mathbb Z$, $K[X]$, $\mathbb Z[X]$, $K[X, Y]$.

- id: anneau-noetherien
  terme: anneau noethérien
  defini_dans: ac-noetheriens
  definition: |
    Un anneau commutatif dont tout [[ideal|idéal]] est engendré par une partie finie. Toute suite croissante d'idéaux y est alors stationnaire. Les anneaux principaux, et, par le théorème de Hilbert, les $K[X_1, \dots, X_n]$, sont noethériens.

- id: localise
  terme: localisé
  notation: $S^{-1}A$
  defini_dans: ac-localisation
  definition: |
    Pour une [[partie-multiplicative|partie multiplicative]] $S$ d'un anneau commutatif $A$, l'anneau $S^{-1}A$ des fractions $a/s$, $s \in S$, où $a/s = b/t$ s'il existe $u \in S$ tel que $u(at - bs) = 0$. Les éléments de $S$ y deviennent inversibles, et ses idéaux premiers sont en bijection avec ceux de $A$ qui ne rencontrent pas $S$.

- id: anneau-local
  terme: anneau local
  defini_dans: ac-locaux
  definition: |
    Un anneau commutatif non nul dont les éléments non inversibles forment un [[ideal|idéal]] $\mathfrak m$, qui est alors son unique [[ideal-maximal|idéal maximal]]. Exemples : un corps, l'anneau $\mathbb Z_{(p)}$ des fractions dont le dénominateur n'est pas multiple de $p$.

- id: convergence-loi
  terme: convergence en loi
  defini_dans: fo-levy
  definition: |
    Une suite de variables réelles $X_n$ converge en loi vers $X$ si $F_{X_n}(x) \to F_X(x)$ en tout point où la [[fonction-repartition|fonction de répartition]] $F_X$ est continue. Par le théorème de Lévy, la [[convergence-simple|convergence simple]] des fonctions caractéristiques vers celle de $X$ l'entraîne ; le nœud {{fo-loi-esperances|Loi et espérances}} établira la réciproque.

- id: suite-tendue
  terme: suite tendue
  defini_dans: fo-helly
  definition: |
    Une suite de variables réelles $(X_n)$ est tendue si, pour tout $\varepsilon > 0$, il existe $M > 0$ tel que $P(|X_n| > M) \leqslant \varepsilon$ pour tout $n$ : aucune masse ne s'échappe à l'infini. Par le théorème de sélection de Helly, une suite tendue a une suite extraite qui [[convergence-loi|converge en loi]].

- id: forme-bilineaire-symetrique
  terme: forme bilinéaire symétrique
  defini_dans: fq-formes
  definition: |
    Une application $b : E \times E \to K$, linéaire par rapport à chacune de ses deux variables, telle que $b(x, y) = b(y, x)$. Dans une base, $b(x, y) = {}^tXAY$, où la matrice $A = \big(b(e_i, e_j)\big)$ est [[matrice-symetrique|symétrique]].

- id: forme-quadratique
  terme: forme quadratique
  defini_dans: fq-formes
  definition: |
    Une application $q : E \to K$ de la forme $q(x) = b(x, x)$, où $b$ est une [[forme-bilineaire|forme bilinéaire]]. Dans une base, c'est un polynôme homogène de degré $2$ en les coordonnées. Quand $2$ est inversible dans $K$, on peut prendre $b$ symétrique, et elle est alors unique : c'est la [[forme-polaire|forme polaire]] de $q$.

- id: forme-polaire
  terme: forme polaire
  defini_dans: fq-formes
  definition: |
    L'unique [[forme-bilineaire-symetrique|forme bilinéaire symétrique]] $b$ telle que $q(x) = b(x, x)$, pour une [[forme-quadratique|forme quadratique]] $q$ sur un corps où $2$ est inversible : $b(x, y) = \frac12\big(q(x + y) - q(x) - q(y)\big)$.

- id: matrices-congruentes
  terme: matrices congruentes
  defini_dans: fq-formes
  definition: |
    Deux matrices carrées $A$ et $A'$ sont congruentes s'il existe $P$ [[matrice-inversible|inversible]] telle que $A' = {}^tPAP$. Ce sont les matrices d'une même [[forme-bilineaire|forme bilinéaire]] dans deux bases ; il ne faut pas confondre la congruence avec la similitude $A' = P^{-1}AP$, qui traduit le changement de base pour un [[endomorphisme]].

- id: forme-non-degeneree
  terme: forme non dégénérée
  defini_dans: fq-rang
  definition: |
    Une [[forme-bilineaire-symetrique|forme bilinéaire symétrique]] $b$ dont le noyau $\{x : b(x, y) = 0 \text{ pour tout } y\}$ est nul, c'est-à-dire dont la matrice dans une base a un déterminant non nul. Le rang de $b$ est celui de l'application $x \mapsto b(x, \cdot)$ de $E$ dans son dual.

- id: vecteur-isotrope
  terme: vecteur isotrope
  defini_dans: fq-orthogonalite
  definition: |
    Un vecteur non nul $x$ tel que $q(x) = 0$, pour une [[forme-quadratique|forme quadratique]] $q$. Il est orthogonal à lui-même : la droite qu'il engendre n'a pas son orthogonal pour supplémentaire. Pour $x_1^2 - x_2^2$, les vecteurs isotropes sont ceux des deux diagonales.

- id: base-orthogonale
  terme: base orthogonale
  defini_dans: fq-bases-orthogonales
  definition: |
    Une base $(e_i)$ telle que $b(e_i, e_j) = 0$ pour $i \neq j$, pour une [[forme-bilineaire-symetrique|forme bilinéaire symétrique]] $b$ : la matrice de $b$ y est [[matrice-diagonale|diagonale]], et $q(x) = \sum_i q(e_i)\, x_i^2$. Il en existe toujours quand $2$ est inversible dans le corps.

- id: reduction-gauss
  terme: réduction de Gauss
  defini_dans: fq-gauss
  definition: |
    L'algorithme qui écrit une [[forme-quadratique|forme quadratique]] comme combinaison linéaire $\sum_k d_k \ell_k^2$ de carrés de [[forme-lineaire|formes linéaires]] indépendantes, en complétant le carré des termes qui contiennent une variable, ou, s'il n'y a aucun terme carré, en écrivant $uv = \frac14\big((u + v)^2 - (u - v)^2\big)$.

- id: signature-forme-quadratique
  terme: signature (forme quadratique)
  defini_dans: fq-sylvester
  definition: |
    Le couple $(s_+, s_-)$ des nombres de coefficients strictement positifs et strictement négatifs de la [[matrice-diagonale|matrice diagonale]] d'une [[forme-quadratique|forme quadratique]] réelle dans une [[base-orthogonale|base orthogonale]]. Par la loi d'inertie de Sylvester, il ne dépend pas de la base ; deux formes réelles sont [[formes-quadratiques-equivalentes|équivalentes]] si et seulement si elles ont même signature.
  voir: [signature, signature-permutation]

- id: forme-positive
  terme: forme positive (quadratique)
  defini_dans: fq-positives
  definition: |
    Une [[forme-quadratique|forme quadratique]] réelle $q$ telle que $q(x) \geqslant 0$ pour tout $x$, c'est-à-dire, en dimension finie, de [[signature-forme-quadratique|signature]] $(s_+, 0)$. Elle vérifie l'inégalité de Cauchy-Schwarz $b(x, y)^2 \leqslant q(x)\,q(y)$, et ses vecteurs isotropes sont ceux de son noyau. Le même adjectif qualifie, en analyse fonctionnelle, une [[forme-lineaire|forme linéaire]] sur un espace de fonctions qui prend des valeurs positives sur les fonctions positives : c'est une autre notion.
  voir: [forme-definie-positive, forme-lineaire-positive]

- id: forme-definie-positive
  terme: forme définie positive
  defini_dans: fq-positives
  definition: |
    Une [[forme-quadratique|forme quadratique]] réelle $q$ telle que $q(x) > 0$ pour tout $x \neq 0$, c'est-à-dire de [[signature-forme-quadratique|signature]] $(n, 0)$ en dimension $n$. Sa forme polaire est un [[produit-scalaire|produit scalaire]]. Une matrice [[matrice-symetrique|symétrique]] est définie positive si et seulement si ses mineurs principaux dominants sont strictement positifs.

- id: matrice-hessienne
  terme: matrice hessienne
  notation: $H_f(a)$
  defini_dans: fq-taylor-young
  definition: |
    Pour $f$ de classe $C^2$ sur un ouvert de $\mathbb R^n$, la matrice $\big(\partial_i\partial_j f(a)\big)$ des dérivées secondes en $a$, symétrique par le théorème de Schwarz. La forme quadratique $h \mapsto {}^th\,H_f(a)\,h$ est le terme du second ordre de la formule de Taylor-Young, au facteur $\frac12$ près.

- id: formule-taylor-young
  terme: formule de Taylor-Young
  defini_dans: fq-taylor-young
  definition: |
    Pour $f$ de classe $C^2$ sur un ouvert de $\mathbb R^n$, $f(a + h) = f(a) + df(a)h + \frac12\,{}^th\,H_f(a)\,h + \|h\|^2\varepsilon(h)$, où $\varepsilon$ tend vers $0$ en $0$ et $H_f(a)$ est la [[matrice-hessienne|matrice hessienne]].

- id: point-critique
  terme: point critique
  defini_dans: fq-points-critiques
  definition: |
    Un point $a$ où la différentielle d'une fonction réelle $f$ s'annule : $df(a) = 0$. Un [[extremum-local-rn|extremum local]] intérieur d'une fonction différentiable est un point critique ; la réciproque est fausse, comme le montre $x \mapsto x^3$ en $0$.

- id: point-col
  terme: point col
  defini_dans: fq-extremums
  definition: |
    Un [[point-critique|point critique]] d'une fonction de classe $C^2$ en lequel la [[forme-hessienne|forme hessienne]] est [[forme-indefinie|indéfinie]], c'est-à-dire prend des valeurs strictement positives et strictement négatives ; la fonction n'y a pas d'extremum local. Exemple : l'origine pour $x^2 - y^2$. On dit aussi point selle.

- id: gradient
  terme: gradient
  notation: $\nabla f(a)$
  defini_dans: el-lagrange
  definition: |
    Pour $f$ [[differentiable]] en $a$, à valeurs réelles, sur un ouvert de $\mathbb R^n$, le vecteur $\nabla f(a) = \big(\partial_1 f(a), \dots, \partial_n f(a)\big)$ des dérivées partielles. Il représente la différentielle par le [[produit-scalaire|produit scalaire]] usuel : $df(a)h = \langle \nabla f(a), h \rangle$.

- id: extremum-lie
  terme: extremum lié
  defini_dans: el-lagrange
  definition: |
    Un extremum local, en un point $a \in \Gamma$, de la restriction d'une fonction $f$ à un ensemble de niveau $\Gamma = \{g = 0\}$ : il existe $r > 0$ tel que $f(x) \leqslant f(a)$ pour tout $x \in \Gamma$ à distance strictement inférieure à $r$ de $a$ (maximum lié), ou $f(x) \geqslant f(a)$ pour ces $x$ (minimum lié). On dit aussi extremum sous contrainte ; il est strict si l'inégalité est stricte pour $x \neq a$.

- id: multiplicateurs-lagrange
  terme: multiplicateurs de Lagrange
  defini_dans: el-lagrange
  definition: |
    Si $f$, différentiable en $a$, admet en $a$ un [[extremum-lie|extremum lié]] sous la contrainte $g = 0$, où $g = (g_1, \dots, g_p)$ est une [[submersion]] en $a$, les réels $\lambda_1, \dots, \lambda_p$, uniques, tels que $df(a) = \sum_i \lambda_i\, dg_i(a)$. Pour une seule contrainte, ils disent que $\nabla f(a)$ est [[vecteurs-colineaires|colinéaire]] à $\nabla g(a)$.

- id: lagrangien
  terme: lagrangien
  defini_dans: el-lagrange
  definition: |
    Pour une fonction $f$ et une contrainte $g = (g_1, \dots, g_p) = 0$ sur un ouvert $U$ de $\mathbb R^n$, la fonction $\Lambda(x, \mu) = f(x) - \sum_i \mu_i\, g_i(x)$ sur $U \times \mathbb R^p$. Ses points critiques sont les couples $(b, \mu)$ tels que $g(b) = 0$ et $df(b) = \sum_i \mu_i\, dg_i(b)$ ; à [[multiplicateurs-lagrange|multiplicateurs]] fixés, la hessienne de $x \mapsto \Lambda(x, \lambda)$, restreinte à l'espace tangent, décide de la nature d'un extremum lié.

- id: module-type-fini
  terme: module de type fini
  defini_dans: a-module
  definition: |
    Un [[module]] $M$ sur un anneau commutatif $A$ est de type fini s'il existe $x_1, \dots, x_n \in M$ tels que tout élément de $M$ s'écrive $a_1x_1 + \cdots + a_nx_n$ avec les $a_i \in A$. Cette notion demande les entiers, construits au nœud {{n|ℕ}} : elle n'est employée qu'après lui. Le nœud {{md-libres|Modules libres}}, (i), montrera qu'il est alors un quotient de $A^n$, et le nœud {{md-sous-modules|Sous-modules de Aⁿ}}, (ii), que, sur un anneau principal, ses sous-modules sont encore de type fini.

- id: module-libre
  terme: module libre
  defini_dans: md-libres
  definition: |
    Un [[module]] qui a une [[base-module|base]] $(x_1, \dots, x_n)$, famille [[famille-generatrice-module|génératrice]] et libre ; il est alors isomorphe à $A^n$. La base est finie par convention dans le chapitre des modules sur un anneau principal ; on parle ailleurs de modules libres de base quelconque. Le module $\mathbb Z/2\mathbb Z$ sur $\mathbb Z$ est de type fini sans être libre.
  voir: [rang-module]

- id: rang-module
  terme: rang (d'un module libre)
  defini_dans: md-libres
  definition: |
    Sur un [[anneau-integre|anneau intègre]], le nombre d'éléments commun à toutes les [[base-module|bases]] d'un [[module-libre|module libre]]. On le montre en passant au [[corps-fractions|corps des fractions]], où $A^m \cong A^n$ devient un isomorphisme d'espaces vectoriels.

- id: sous-module-torsion
  terme: sous-module de torsion
  notation: $T(M)$
  defini_dans: md-libres
  definition: |
    Pour un [[module]] $M$ sur un [[anneau-integre|anneau intègre]], l'ensemble des $x$ tels que $ax = 0$ pour un $a \neq 0$. C'est un sous-module, et $M/T(M)$ est [[module-sans-torsion|sans torsion]] ; sur un anneau principal et pour $M$ de type fini, $M$ est somme directe de $T(M)$ et d'un module libre.

- id: matrices-equivalentes
  terme: matrices équivalentes
  defini_dans: md-equivalence
  definition: |
    Deux matrices $M$ et $N$ à coefficients dans un anneau $A$ telles que $N = PMQ$ avec $P$ et $Q$ [[matrice-inversible|inversibles]]. À ne pas confondre avec la similitude $N = S^{-1}MS$, qui entraîne l'équivalence (avec $P = S^{-1}$ et $Q = S$) mais n'en découle pas : si $2 \neq 0$ dans $A$, les matrices $I_n$ et $-I_n$, $n \geqslant 1$, sont équivalentes, puisque $-I_n = (-I_n)I_nI_n$, mais pas semblables, puisque $S^{-1}I_nS = I_n$. Sur un corps, deux matrices de même taille sont équivalentes si et seulement si elles ont le même [[rang-matrice|rang]], ce que démontre le nœud {{md-equivalence|Opérations élémentaires}}.

- id: anneau-euclidien
  terme: anneau euclidien
  defini_dans: md-equivalence
  definition: |
    Un [[anneau-integre|anneau intègre]] muni d'un [[stathme|stathme]] $\nu$ à valeurs dans $\mathbb N$ tel que tout $a$ s'écrive $bq + r$, pour $b \neq 0$, avec $r = 0$ ou $\nu(r) < \nu(b)$. Il est principal. Exemples : $\mathbb Z$ avec la valeur absolue, $K[X]$ avec le degré.

- id: forme-smith
  terme: forme normale de Smith
  defini_dans: md-smith
  definition: |
    Une matrice dont les seuls coefficients non nuls sont diagonaux, $d_1, \dots, d_s$, avec $d_1 \mid d_2 \mid \cdots \mid d_s$. Sur un [[anneau-principal|anneau principal]], toute matrice est équivalente à une telle matrice, dont les coefficients sont uniques à des inversibles près.

- id: base-adaptee
  terme: base adaptée
  defini_dans: md-base-adaptee
  definition: |
    Pour un sous-module $L$ de $A^n$, $A$ principal, une [[base-module|base]] $(f_1, \dots, f_n)$ de $A^n$ telle que $(d_1f_1, \dots, d_kf_k)$ soit une base de $L$ pour des $d_1 \mid \cdots \mid d_k$ non nuls. Elle existe toujours ; c'est la [[forme-smith|forme de Smith]] traduite en termes de bases.

- id: facteurs-invariants
  terme: facteurs invariants
  defini_dans: md-unicite
  definition: |
    Pour un [[module-type-fini|module de type fini]] $M$ sur un [[anneau-principal|anneau principal]], les idéaux $d_1A \supset \cdots \supset d_kA$, avec $d_i$ non nul non inversible et $d_1 \mid \cdots \mid d_k$, tels que $M \cong A^r \oplus A/(d_1) \oplus \cdots \oplus A/(d_k)$. Ils sont uniques, et déterminent $M$ avec le rang $r$. Ceux d'un [[endomorphisme]] $u$ sont ceux du $K[X]$-module associé.

- id: diviseurs-elementaires
  terme: diviseurs élémentaires
  defini_dans: md-elementaires
  definition: |
    Pour un [[module-type-fini|module de type fini]] sur un anneau principal, les puissances d'irréductibles $q^b$ telles que $M \cong A^r \oplus \bigoplus A/(q^b)$, comptées avec répétition. On les obtient en décomposant les [[facteurs-invariants|facteurs invariants]] par le lemme chinois : $\mathbb Z/12\mathbb Z \cong \mathbb Z/4\mathbb Z \oplus \mathbb Z/3\mathbb Z$.

- id: matrice-compagnon
  terme: matrice compagnon
  notation: $C(P)$
  defini_dans: md-endomorphismes
  definition: |
    Pour un polynôme unitaire $P = X^d + c_{d-1}X^{d-1} + \cdots + c_0$, la matrice de taille $d$ qui porte des $1$ sous la diagonale, la colonne $(-c_0, \dots, -c_{d-1})$ en dernier, et des $0$ ailleurs. C'est la matrice de la multiplication par $X$ dans $K[X]/(P)$, et son [[polynome-minimal-endomorphisme|polynôme minimal]] comme son [[polynome-caracteristique|polynôme caractéristique]] valent $P$.

- id: forme-frobenius
  terme: forme de Frobenius
  defini_dans: md-frobenius
  definition: |
    La [[matrice-diagonale-blocs|matrice diagonale par blocs]] $\operatorname{diag}(C(P_1), \dots, C(P_k))$ de [[matrice-compagnon|matrices compagnons]] des [[facteurs-invariants|facteurs invariants]] $P_1 \mid \cdots \mid P_k$ d'un [[endomorphisme]]. Elle existe sur tout corps, est unique, et deux matrices sont [[matrices-semblables|semblables]] si et seulement si elles ont la même ; on dit aussi forme normale rationnelle.

- id: puissance
  terme: puissance (entière)
  notation: $x^n$
  defini_dans: n-sommes
  definition: |
    Pour un élément $x$ d'un ensemble muni d'une loi associative de neutre $1$, et $n \in \mathbb N$, la puissance $x^n$ est définie par récurrence : $x^0 = 1$ et $x^{n+1} = x^n x$. On a $x^{m+n} = x^m x^n$ et $(x^m)^n = x^{mn}$, et $(xy)^n = x^n y^n$ si $x$ et $y$ commutent. En notation additive, c'est le multiple $n \cdot x$.
  voir: [puissance-reelle]

- id: puissance-reelle
  terme: puissance réelle
  notation: $x^p$
  defini_dans: ex-puissances
  definition: |
    Pour $x > 0$ et $p$ réel, $x^p = \exp(p \ln x)$, où $\ln x = \int_1^x \frac{dt}{t}$ et où $\exp$ est la bijection réciproque de $\ln$ ; on pose $0^p = 0$ pour $p > 0$. Pour $p$ entier naturel, c'est la puissance entière, et pour $p = \frac mq$ rationnel, $x^p$ est l'unique réel positif dont la puissance $q$-ième est $x^m$. Les règles $x^{p+q} = x^px^q$, $(x^p)^q = x^{pq}$ et $(xy)^p = x^py^p$ valent pour des bases positives, mais l'erreur la plus répandue est de les appliquer à une base négative : $\big((-1)^2\big)^{1/2} = 1 \neq -1$.

- id: exposants-conjugues
  terme: exposants conjugués
  defini_dans: lp-young
  definition: |
    Deux réels $p, q > 1$ tels que $\frac1p + \frac1q = 1$, c'est-à-dire $q = \frac{p}{p-1}$ ; on convient que $1$ et $+\infty$ sont aussi conjugués. L'exposant $2$ est son propre conjugué, ce qui reflète la symétrie des espaces de Hilbert.

- id: espace-Lp
  terme: espace Lᵖ
  notation: $L^p(\mu)$
  defini_dans: lp-espaces
  definition: |
    Pour $1 \leqslant p < +\infty$, l'ensemble des classes, pour l'égalité [[presque-partout|presque partout]], de fonctions mesurables $f$ telles que $\int |f|^p \, d\mu < +\infty$, muni de $\|f\|_p = \big(\int |f|^p \, d\mu\big)^{1/p}$. Le nœud {{lp-completude|Complétude de Lᵖ}} montrera que c'est un [[banach|espace de Banach]], par une démonstration qui use du [[choix-denombrable|choix dénombrable]] ⋆, dont on se passe pour une suite de Cauchy de fonctions données ; pour la mesure de comptage sur $\mathbb N$, on le note $\ell^p$.
  voir: [espace-L1, espace-L2, espace-L-infini]

- id: espace-L-infini
  terme: espace L^∞
  notation: $L^\infty(\mu)$
  defini_dans: lp-espaces
  definition: |
    L'ensemble des classes de fonctions mesurables [[essentiellement-bornee|essentiellement bornées]], c'est-à-dire bornées hors d'un ensemble [[negligeable|négligeable]], muni de la borne supérieure essentielle $\|f\|_\infty = \inf\{M : |f| \leqslant M \text{ p.p.}\}$. Ce n'est pas la borne supérieure : l'indicatrice de $\mathbb Q$ est nulle dans $L^\infty(\lambda)$.
  voir: [espace-Lp]

- id: inegalite-holder
  terme: inégalité de Hölder
  defini_dans: lp-holder
  definition: |
    Pour des [[exposants-conjugues|exposants conjugués]] $p$ et $q$, $\int |fg| \, d\mu \leqslant \|f\|_p\|g\|_q$. Pour $1 < p < +\infty$, l'égalité n'a lieu que si $|f|^p$ et $|g|^q$ sont proportionnelles. Pour $p = q = 2$, c'est l'inégalité de Cauchy-Schwarz.

- id: inegalite-minkowski
  terme: inégalité de Minkowski
  defini_dans: lp-minkowski
  definition: |
    L'inégalité triangulaire $\|f + g\|_p \leqslant \|f\|_p + \|g\|_p$ dans $L^p$, $1 \leqslant p \leqslant +\infty$, conséquence de l'[[inegalite-holder|inégalité de Hölder]]. Elle est fausse pour $0 < p < 1$, où la boule unité n'est plus convexe.

- id: mesure-densite
  terme: mesure à densité
  notation: $f\cdot\mu$
  defini_dans: lp-absolue-continuite
  definition: |
    Pour une [[mesure]] $\mu$ et une fonction mesurable $f \geqslant 0$, la mesure $A \mapsto \int_A f \, d\mu$. On a $\int g \, d(f\cdot\mu) = \int gf \, d\mu$, et, si $\mu$ est σ-finie, la densité $f$ est déterminée par la mesure, à un ensemble négligeable près.

- id: absolument-continue
  terme: mesure absolument continue
  notation: $\nu \ll \mu$
  defini_dans: lp-absolue-continuite
  definition: |
    Une mesure $\nu$ est absolument continue par rapport à $\mu$ si toute partie $\mu$-[[negligeable|négligeable]] est $\nu$-négligeable. Une [[mesure-densite|mesure à densité]] l'est ; le théorème de Radon-Nikodym dit que, pour des mesures σ-finies, ce sont les seules.
  voir: [mesures-etrangeres]

- id: mesures-etrangeres
  terme: mesures étrangères
  notation: $\nu \perp \mu$
  defini_dans: lp-absolue-continuite
  definition: |
    Deux [[mesure|mesures]] $\mu$ et $\nu$ sont étrangères s'il existe une partie mesurable $S$ telle que $\mu(S) = 0$ et $\nu(X \setminus S) = 0$. Une mesure de Dirac est étrangère à la mesure de Lebesgue.

- id: decomposition-lebesgue
  terme: décomposition de Lebesgue
  defini_dans: lp-radon-nikodym
  definition: |
    L'écriture d'une mesure $\nu$ comme somme $\nu_a + \nu_s$ d'une mesure [[absolument-continue|absolument continue]] par rapport à $\mu$ et d'une mesure [[mesures-etrangeres|étrangère]] à $\mu$. Pour des mesures σ-finies, elle existe et elle est unique.

- id: derivee-radon-nikodym
  terme: dérivée de Radon-Nikodym
  notation: $\frac{d\nu}{d\mu}$
  defini_dans: lp-radon-nikodym
  definition: |
    Pour des mesures σ-finies telles que $\nu \ll \mu$, l'unique fonction (à un ensemble négligeable près) $f \geqslant 0$ telle que $\nu = f\cdot\mu$. Elle obéit à la règle de la chaîne $\frac{d\pi}{d\mu} = \frac{d\pi}{d\nu}\frac{d\nu}{d\mu}$ ; pour une loi de probabilité à densité, c'est la densité.
  voir: [mesure-densite, absolument-continue]

- id: distance-partie
  terme: distance à une partie
  notation: $d(x, A)$
  defini_dans: mk-urysohn
  definition: |
    Dans un [[espace-metrique]], $d(x, A) = \inf_{a \in A} d(x, a)$ pour $A$ non vide. C'est une fonction $1$-lipschitzienne de $x$, nulle exactement sur l'[[adherence]] de $A$ ; elle fournit, sans aucun choix, les fonctions d'Urysohn et les partitions de l'unité des espaces métriques.

- id: forme-lineaire-positive
  terme: forme linéaire positive
  defini_dans: mk-formes-positives
  definition: |
    Une [[forme-lineaire|forme linéaire]] $\Lambda$ sur un espace de fonctions, par exemple $C(K)$, telle que $\Lambda f \geqslant 0$ dès que $f \geqslant 0$. Sur $C(K)$, elle est automatiquement continue, de norme $\Lambda(1)$, et, pour $K$ compact métrique, c'est l'intégrale contre une unique [[mesure-borelienne|mesure borélienne]] finie (théorème de Riesz-Markov). À ne pas confondre avec une forme quadratique positive.
  voir: [espace-continues, forme-lineaire-positive-lp, forme-positive]

- id: forme-lineaire-positive-lp
  terme: forme linéaire positive (sur Lᵖ)
  defini_dans: lp-formes-positives
  definition: |
    Une [[forme-lineaire|forme linéaire]] $\psi$ sur $\lex{espace-Lp}{L^p}(\mu)$ telle que $\psi(f) \geqslant 0$ dès que $f \geqslant 0$ presque partout. Toute forme linéaire continue sur $L^p(\mu)$ est la différence de deux formes linéaires continues positives, ce qui ramène l'étude du dual de $L^p$ à celle des formes positives. C'est la même définition que sur l'espace des fonctions continues d'un compact, posée dans une branche indépendante ; à ne pas confondre avec une forme quadratique positive.
  voir: [forme-lineaire-positive, forme-positive]

- id: mesure-reguliere
  terme: mesure régulière
  defini_dans: mk-construction
  definition: |
    Une [[mesure]] borélienne finie $\mu$ sur un espace métrique est régulière si la mesure de tout borélien est la borne inférieure des mesures des [[ouvert|ouverts]] qui le contiennent et la borne supérieure des mesures des [[ferme|fermés]] qu'il contient. Sur un compact métrique, toute [[mesure-borelienne|mesure borélienne]] finie l'est ; sur un compact non métrisable, ce n'est plus vrai en général.

- id: representation-groupe
  terme: représentation (d'un groupe)
  defini_dans: rp-representations
  definition: |
    Une représentation d'un [[groupe]] $G$ sur un [[corps]] $K$ est un [[morphisme-groupes|morphisme de groupes]] $\rho$ de $G$ dans le groupe $GL(V)$ des applications linéaires bijectives d'un espace vectoriel $V$ [[espace-dimension-finie|de dimension finie]] sur $K$ ; son [[degre-representation|degré]] est $\dim V$. C'est une action de $G$ sur $V$ par des applications linéaires.
  voir: [representation-irreductible, caractere-representation]

- id: representation-irreductible
  terme: représentation irréductible
  defini_dans: rp-representations
  definition: |
    Une [[representation-groupe|représentation]] sur un espace $V \neq \{0\}$ dont les seuls [[sous-espace-stable-representation|sous-espaces stables]] par tous les $\rho(g)$ sont $\{0\}$ et $V$. L'irréductibilité dépend du corps. Le théorème de Maschke ({{rp-maschke|Maschke}}) montrera que, pour un groupe fini et un corps où $|G|$ est inversible, toute représentation non nulle est [[somme-directe-representations|somme directe]] de représentations irréductibles.

- id: representation-reguliere
  terme: représentation régulière
  defini_dans: rp-representations
  definition: |
    La [[representation-groupe|représentation]] d'un groupe fini $G$ sur l'espace de base $(e_h)_{h \in G}$ par $\rho(g)e_h = e_{gh}$, qui linéarise l'action de $G$ sur lui-même par translation. Le nœud {{rp-reguliere|Représentation régulière}} montrera que, sur $\mathbb C$, toute [[representation-irreductible|représentation irréductible]] $W$ y apparaît $\dim W$ fois, d'où $\sum (\dim W)^2 = |G|$.

- id: caractere-representation
  terme: caractère (d'une représentation)
  defini_dans: rp-caracteres
  definition: |
    Le caractère d'une [[representation-groupe|représentation]] complexe $\rho$ d'un groupe fini est la fonction $g \mapsto \operatorname{tr}\rho(g)$. C'est une [[fonction-centrale|fonction centrale]], et deux représentations [[isomorphisme-representations|isomorphes]] ont le même caractère. Les nœuds {{rp-orthogonalite|Orthogonalité}} et {{rp-classes|Fonctions centrales}} montreront qu'il détermine la représentation à isomorphisme près, et que les caractères des représentations irréductibles forment une base orthonormée des fonctions centrales. Le caractère d'une représentation de [[degre-representation|degré]] $> 1$ n'est pas un morphisme.

- id: caractere-lineaire
  terme: caractère linéaire
  defini_dans: rp-caracteres
  definition: |
    Le [[caractere-representation|caractère]] d'une représentation de [[degre-representation|degré]] $1$, c'est-à-dire un [[morphisme-groupes|morphisme]] d'un groupe dans $\mathbb C^\times$. Pour un groupe fini, ses valeurs sont des racines de l'unité ; le nœud {{rp-lineaires|Caractères linéaires}} montrera que les caractères linéaires de $G$ sont ceux de son [[abelianise|abélianisé]] $G/D(G)$.

- id: fonction-centrale
  terme: fonction centrale
  defini_dans: rp-caracteres
  definition: |
    Une fonction $f$ sur un [[groupe]] telle que $f(hgh^{-1}) = f(g)$ pour tous $g, h$, c'est-à-dire constante sur chaque classe de conjugaison. Pour un groupe fini, elles forment un espace de dimension égale au nombre de classes.

- id: groupe-derive
  terme: groupe dérivé
  notation: '$D(G)$'
  defini_dans: a-distingue
  definition: |
    Le groupe dérivé $D(G)$ d'un [[groupe]] $G$ est le [[sous-groupe-engendre|sous-groupe engendré]] par les [[commutateur|commutateurs]] $xyx^{-1}y^{-1}$. Il est [[sous-groupe-distingue|distingué]], puisque la conjugaison par un élément de $G$ est un morphisme qui envoie chaque commutateur sur un commutateur. On montre plus loin qu'un sous-groupe distingué $N$ de $G$ est de quotient $G/N$ abélien si et seulement s'il contient $D(G)$, que $D(G)$ est l'ensemble des produits finis de commutateurs et qu'il est stable par tout automorphisme de $G$ ; le quotient $G/D(G)$ en est l'abélianisé, défini avec le groupe quotient.

- id: table-caracteres
  terme: table des caractères
  defini_dans: rp-classes
  definition: |
    Le tableau carré des valeurs des [[caractere-representation|caractères]] irréductibles d'un groupe fini sur un représentant de chaque classe de conjugaison. Ses lignes et ses colonnes vérifient des relations d'orthogonalité. Elle ne détermine pas le groupe : le groupe diédral $\mathcal D_4$ et le groupe des quaternions $\mathcal Q_8$ ont la même.

# Notions définies en gras, lexicalisées (diagnostic H, 2 nov. 2026)

- id: identite
  terme: identité
  notation: '$\mathrm{id}_A$'
  defini_dans: r-application
  definition: |
    L'identité d'un ensemble $A$ est l'[[application]] $\mathrm{id}_A : A \to A$ de graphe $\{(a, a) : a \in A\}$, qui envoie chaque élément sur lui-même. Le nœud {{r-composition|Composition}} montrera qu'elle est neutre pour la composition : $f \circ \mathrm{id}_A = f$ et $\mathrm{id}_B \circ f = f$ pour toute application $f : A \to B$.

- id: application-croissante
  terme: application croissante
  defini_dans: od-croissantes
  definition: |
    Une [[application]] $f : E \to F$ entre ensembles munis d'une [[relation-ordre|relation d'ordre]] est croissante si $x \leqslant y$ entraîne $f(x) \leqslant f(y)$, et strictement croissante si $x < y$ entraîne $f(x) < f(y)$. Elle est décroissante si $x \leqslant y$ entraîne $f(y) \leqslant f(x)$.

- id: suite-monotone
  terme: suite monotone
  defini_dans: su-monotone
  definition: |
    Une [[suite]] réelle $(u_n)$ est croissante si $u_n \leqslant u_{n+1}$ pour tout $n$, décroissante si $u_{n+1} \leqslant u_n$ pour tout $n$, et monotone si elle est croissante ou décroissante. Une suite croissante vérifie $u_n \leqslant u_m$ pour $n \leqslant m$.

- id: suite-bornee
  terme: suite bornée
  defini_dans: su-bornee
  definition: |
    Une [[suite]] réelle $(u_n)$ est majorée s'il existe un réel $M$ tel que $u_n \leqslant M$ pour tout $n$, minorée s'il existe un réel $m$ tel que $u_n \geqslant m$ pour tout $n$, et bornée si elle est majorée et minorée, c'est-à-dire s'il existe $M$ tel que $|u_n| \leqslant M$ pour tout $n$.

- id: valeur-absolue
  terme: valeur absolue
  notation: '$|x|$'
  defini_dans: z-ordre
  definition: |
    La valeur absolue d'un entier relatif $x$ est $|x| = x$ si $x \geqslant 0$ et $|x| = -x$ sinon. Elle vérifie $|x| \geqslant 0$, avec égalité seulement pour $x = 0$, et $|xy| = |x|\,|y|$ ; la même formule la définit dans les ensembles de nombres construits ensuite.

- id: borne-inferieure
  terme: borne inférieure
  notation: '$\inf A$'
  defini_dans: od-majorants
  definition: |
    Dans un ensemble ordonné $E$, la borne inférieure d'une partie $A$, notée $\inf A$, est, s'il existe, le plus grand élément de l'ensemble des minorants de $A$ ; c'est la [[borne-superieure|borne supérieure]] de $A$ pour l'ordre opposé.

- id: plus-grand-element
  terme: plus grand élément
  defini_dans: od-majorants
  definition: |
    Un plus grand élément d'une partie $A$ d'un ensemble ordonné est un [[majorant]] de $A$ qui appartient à $A$. S'il existe, il est unique, par antisymétrie, et il est la [[borne-superieure|borne supérieure]] de $A$.

- id: plus-petit-element
  terme: plus petit élément
  defini_dans: od-majorants
  definition: |
    Un plus petit élément d'une partie $A$ d'un ensemble ordonné est un minorant de $A$ qui appartient à $A$, c'est-à-dire un $m \in A$ tel que $m \leqslant x$ pour tout $x \in A$. S'il existe, il est unique, par antisymétrie.

- id: minorant
  terme: minorant
  defini_dans: od-majorants
  definition: |
    Un minorant d'une partie $A$ d'un ensemble ordonné $E$ est un $m \in E$ tel que $m \leqslant x$ pour tout $x \in A$ ; c'est un [[majorant]] de $A$ pour l'ordre opposé. La partie $A$ est minorée si elle en a un.

- id: inegalite-triangulaire
  terme: inégalité triangulaire
  defini_dans: ar-corps
  definition: |
    Dans un corps totalement ordonné, l'inégalité $|x + y| \leqslant |x| + |y|$, obtenue en ajoutant $x \leqslant |x|$ et $y \leqslant |y|$, puis $-x \leqslant |x|$ et $-y \leqslant |y|$. Dans un [[espace-metrique|espace métrique]] $(X, d)$, le même nom désigne l'axiome $d(x, z) \leqslant d(x, y) + d(y, z)$ ; pour $d(x, y) = |x - y|$, c'est l'inégalité précédente appliquée à $x - y$ et $y - z$.

- id: premiers-entre-eux
  terme: premiers entre eux
  defini_dans: z-bezout
  definition: |
    Deux entiers relatifs $a$ et $b$ sont premiers entre eux si leur [[pgcd]] vaut $1$, c'est-à-dire si leurs seuls diviseurs communs sont $1$ et $-1$. Par Bézout, cela revient à l'existence d'entiers $u$ et $v$ tels que $au + bv = 1$.

- id: nombre-elements
  terme: nombre d'éléments
  notation: '$|E|$'
  defini_dans: n-fini
  definition: |
    Le nombre d'éléments d'un [[ensemble-fini|ensemble fini]] $E$ est l'unique entier naturel $n$ [[equipotent|équipotent]] à $E$ ; on le note $|E|$, ou $\operatorname{card} E$.

- id: a-partir-certain-rang
  terme: à partir d'un certain rang
  defini_dans: su-convergence
  definition: |
    Une propriété $P(n)$ d'un entier naturel $n$ est vraie à partir d'un certain rang s'il existe $N \in \mathbb N$ tel qu'elle soit vraie pour tout $n \geqslant N$.

- id: taux-accroissement
  terme: taux d'accroissement
  defini_dans: de-derivee
  definition: |
    Pour une fonction réelle $f : I \to \mathbb R$ définie sur un [[intervalle]] $I$ non réduit à un point et $a \in I$, le taux d'accroissement de $f$ en $a$ est la fonction $\tau_a(x) = \frac{f(x) - f(a)}{x - a}$, définie pour $x \in I \setminus \{a\}$. La fonction $f$ est [[derivable|dérivable]] en $a$ si $\tau_a$ a une limite finie en $a$.

- id: derivee-partielle
  terme: dérivée partielle
  notation: '$\partial_j f(a)$'
  defini_dans: gd-differentielle
  definition: |
    Pour $f$ définie sur un ouvert de $\mathbb R^n$ à valeurs dans $\mathbb R^p$, la dérivée partielle $\partial_j f(a)$ est, si elle existe, la limite de $\frac{f(a + te_j) - f(a)}{t}$ quand $t \to 0$, où $e_j$ est le $j$-ième vecteur de la [[base-canonique-kn|base canonique]]. Si $f$ est [[differentiable]] en $a$, elle existe et vaut $df(a)(e_j)$.

- id: matrice-jacobienne
  terme: matrice jacobienne
  notation: '$J_f(a)$'
  defini_dans: gd-differentielle
  definition: |
    La matrice jacobienne en $a$ d'une application $f = (f_1, \dots, f_p)$ définie sur un ouvert de $\mathbb R^n$ est la matrice $p \times n$ des [[derivee-partielle|dérivées partielles]] $\partial_j f_i(a)$, lorsqu'elles existent. Si $f$ est [[differentiable]] en $a$, c'est la matrice de $df(a)$ dans les [[base-canonique-kn|bases canoniques]].

- id: continue-par-morceaux
  terme: continue par morceaux
  defini_dans: nb-sommation
  definition: |
    Une fonction $h : [a, b] \to \mathbb C$ est continue par morceaux s'il existe une [[subdivision]] $a = x_0 < \cdots < x_k = b$ telle que, sur chaque intervalle ouvert $]x_{i-1}, x_i[$, $h$ se prolonge en une fonction continue sur $[x_{i-1}, x_i]$. Ses [[partie-reelle|parties réelle]] et imaginaire sont alors intégrables au sens de Riemann.

- id: inegalites-cauchy
  terme: inégalités de Cauchy
  defini_dans: cx-analytique
  definition: |
    Si $f$ est [[holomorphe]] sur un ouvert contenant le disque fermé $\overline D(c, r)$ et $M = \sup_{|w - c| = r} |f(w)|$, les coefficients du développement $f(z) = \sum c_n (z - c)^n$ vérifient $|c_n| \leqslant M r^{-n}$ ; autrement dit $|f^{(n)}(c)| \leqslant n!\, M r^{-n}$.

- id: solution-maximale
  terme: solution maximale
  defini_dans: ed-maximales
  definition: |
    Une [[solution-edo|solution]] d'une [[equation-differentielle|équation différentielle]] est maximale si elle n'est la [[restriction]] d'aucune solution définie sur un [[intervalle]] strictement plus grand.

- id: fonction-polynomiale
  terme: fonction polynomiale
  defini_dans: pol-evaluation
  definition: |
    Pour un polynôme $P \in A[X]$ à coefficients dans un anneau commutatif $A$, la fonction polynomiale associée est l'application $a \mapsto P(a)$ de $A$ dans $A$. Deux polynômes distincts peuvent avoir la même fonction polynomiale : sur $\mathbb Z/2\mathbb Z$, $X^2 + X$ et $0$. De même, pour $P$ à $n$ indéterminées, dans $A[X_1, \dots, X_n] = A[X_1, \dots, X_{n-1}][X_n]$, la fonction polynomiale associée est $(a_1, \dots, a_n) \mapsto P(a_1, \dots, a_n)$, de $A^n$ dans $A$ ; ce sont les sommes finies de fonctions $c\, a_1^{k_1} \cdots a_n^{k_n}$.

- id: polynome-unitaire
  terme: polynôme unitaire
  defini_dans: pol-anneau
  definition: |
    Un polynôme non nul est unitaire si son [[coefficient-dominant|coefficient dominant]] vaut $1$.

- id: coefficient-dominant
  terme: coefficient dominant
  defini_dans: pol-anneau
  definition: |
    Le coefficient dominant d'un polynôme non nul $P = \sum_k a_k X^k$ est $a_d$, où $d = \deg P$ est le plus grand $k$ tel que $a_k \neq 0$.

- id: groupe-abelien
  terme: groupe abélien
  defini_dans: a-groupe
  definition: |
    Un [[groupe]] est abélien, ou commutatif, si sa loi est [[loi-commutative|commutative]] : $xy = yx$ pour tous $x, y$. On le note alors souvent additivement, avec $0$ pour neutre et $-x$ pour symétrique de $x$.

- id: anneau-commutatif
  terme: anneau commutatif
  defini_dans: a-anneau
  definition: |
    Un [[anneau]] est commutatif si sa multiplication l'est : $xy = yx$ pour tous $x, y$.

- id: morphisme-anneaux
  terme: morphisme d'anneaux
  defini_dans: a-morph-anneau
  definition: |
    Un morphisme d'anneaux est une application $f : A \to A'$ entre [[anneau|anneaux]] telle que $f(x + y) = f(x) + f(y)$, $f(xy) = f(x)f(y)$ et $f(1) = 1$. C'est en particulier un [[morphisme-groupes|morphisme]] des groupes additifs.

- id: sous-anneau
  terme: sous-anneau
  defini_dans: a-morph-anneau
  definition: |
    Un sous-anneau d'un [[anneau]] $A$ est un [[sous-groupe]] du groupe additif $(A, +)$ qui contient $1$ et est [[partie-stable|stable par produit]] ; c'est un anneau pour les lois induites.

- id: sous-module
  terme: sous-module
  defini_dans: a-module
  definition: |
    Un sous-module d'un [[module|$A$-module]] $M$ est un [[sous-groupe]] $N$ de $(M, +)$ stable par la loi externe : $ax \in N$ pour tous $a \in A$ et $x \in N$.

- id: transposition
  terme: transposition
  notation: '$(a\ b)$'
  defini_dans: v-permutations
  definition: |
    Pour $a \neq b$ dans $\{1, \dots, n\}$, la transposition $(a\ b)$ est la permutation qui échange $a$ et $b$ et fixe les autres éléments ; c'est un élément du [[groupe-symetrique|groupe symétrique]], égal à son propre inverse.

- id: matrice-transposee
  terme: transposée (matrice)
  notation: '${}^tA$'
  defini_dans: v-matrices
  definition: |
    La transposée d'une matrice $A = (a_{ij}) \in \mathcal M_{p,n}(K)$ est la matrice ${}^tA = (a_{ji}) \in \mathcal M_{n,p}(K)$, obtenue en échangeant lignes et colonnes. On a ${}^t(AB) = {}^tB\,{}^tA$.

- id: comatrice
  terme: comatrice
  notation: '$\operatorname{com} A$'
  defini_dans: v-comatrice
  definition: |
    La comatrice d'une matrice carrée $A$ est la matrice $\operatorname{com} A = (C_{ij})$ de ses cofacteurs $C_{ij} = (-1)^{i+j}\Delta_{ij}$, où le mineur $\Delta_{ij}$ est le [[determinant|déterminant]] de la matrice obtenue en supprimant la ligne $i$ et la colonne $j$. Elle vérifie $A\,{}^t(\operatorname{com} A) = (\det A)\, I_n$.

- id: sous-espace-engendre
  terme: sous-espace engendré
  notation: '$\operatorname{Vect}(S)$'
  defini_dans: v-espace
  definition: |
    Le sous-espace engendré par une partie $S$ d'un [[espace-vectoriel|espace vectoriel]] $E$ est l'intersection des [[sous-espace-vectoriel|sous-espaces vectoriels]] de $E$ qui contiennent $S$ ; c'est le plus petit sous-espace contenant $S$.

- id: somme-directe
  terme: somme directe
  notation: '$F \oplus G$'
  defini_dans: v-somme-directe
  definition: |
    La somme $F + G$ de deux sous-espaces d'un espace vectoriel est directe, et notée $F \oplus G$, si tout élément de $F + G$ s'écrit de manière unique $f + g$ avec $f \in F$ et $g \in G$, ce qui équivaut à $F \cap G = \{0\}$. Plus généralement, une somme $F_1 + \cdots + F_k$ est directe si tout élément s'y décompose de manière unique. Les mêmes définitions valent pour des sous-groupes d'un [[groupe-abelien|groupe abélien]] et pour des [[sous-module|sous-modules]] d'un [[module]]. Pour une famille quelconque de modules $(M_i)_{i \in I}$, la somme directe externe $\bigoplus_i M_i$ est le module des familles $(x_i)$, avec $x_i \in M_i$, nulles sauf pour un nombre fini d'indices, muni des opérations terme à terme ; chaque $M_i$ s'y identifie à un sous-module, et la somme de ces sous-modules est directe. Pour un nombre fini de modules, c'est leur produit $M_1 \times \cdots \times M_s$, muni des lois composante par composante ; et si un module $M$ est somme directe de sous-modules $N_1, \dots, N_s$, l'application $(y_1, \dots, y_s) \mapsto y_1 + \cdots + y_s$ est un isomorphisme de la somme externe $N_1 \oplus \cdots \oplus N_s$ sur $M$.

- id: projecteur
  terme: projecteur
  defini_dans: v-somme-directe
  definition: |
    Si $E = F \oplus G$, le projecteur sur $F$ parallèlement à $G$ est l'[[application-lineaire|application linéaire]] $p$ qui à $x = f + g$, avec $f \in F$ et $g \in G$, associe $f$. Il vérifie $p \circ p = p$, $\operatorname{Im} p = F$ et $\operatorname{Ker} p = G$ ; réciproquement, tout [[endomorphisme]] $p$ tel que $p \circ p = p$ est le projecteur sur $\operatorname{Im} p$ parallèlement à $\operatorname{Ker} p$.

- id: diagonalisable
  terme: diagonalisable
  defini_dans: v-valeurs-propres
  definition: |
    Un [[endomorphisme]] $u$ d'un espace vectoriel [[espace-dimension-finie|de dimension finie]] est diagonalisable s'il existe une base formée de [[vecteur-propre|vecteurs propres]] de $u$, c'est-à-dire une base dans laquelle sa matrice est [[matrice-diagonale|diagonale]]. Une matrice carrée est diagonalisable si l'endomorphisme de $K^n$ qu'elle représente l'est.

- id: base-duale
  terme: base duale
  notation: '$(e_i^*)$'
  defini_dans: v-dual
  definition: |
    Pour une base $(e_1, \dots, e_n)$ d'un espace vectoriel $E$ [[espace-dimension-finie|de dimension finie]], la base duale est la famille des [[forme-lineaire|formes linéaires]] $e_1^*, \dots, e_n^*$ de l'[[espace-dual|espace dual]] définies par $e_i^*(e_j) = 1$ si $i = j$ et $0$ sinon ; $e_i^*(x)$ est la $i$-ième coordonnée de $x$.

- id: vecteurs-orthogonaux
  terme: vecteurs orthogonaux
  notation: '$x \perp y$'
  defini_dans: me-produit-scalaire
  definition: |
    Deux vecteurs $x$ et $y$ d'un espace muni d'un [[produit-scalaire|produit scalaire]] sont orthogonaux si $\langle x, y \rangle = 0$ ; on note $x \perp y$. Deux parties $F$ et $G$ sont orthogonales si tout vecteur de $F$ est orthogonal à tout vecteur de $G$.

- id: groupe-multiplicatif
  terme: groupe multiplicatif
  notation: '$K^\times$'
  defini_dans: gf-multiplicatif
  definition: |
    Le groupe multiplicatif d'un [[corps]] $K$ est $K^\times = K \setminus \{0\}$, muni de la multiplication : c'est le groupe des éléments inversibles de $K$. Il est abélien, de neutre $1$.

- id: orbite
  terme: orbite
  notation: '$G \cdot x$'
  defini_dans: gf-actions
  definition: |
    Pour une [[action-groupe|action]] d'un groupe $G$ sur un ensemble $X$, l'orbite de $x \in X$ est $G \cdot x = \{g \cdot x : g \in G\}$. Les orbites forment une [[partition]] de $X$.

- id: stabilisateur
  terme: stabilisateur
  notation: '$G_x$'
  defini_dans: gf-actions
  definition: |
    Pour une [[action-groupe|action]] d'un groupe $G$ sur un ensemble $X$, le stabilisateur de $x \in X$ est le [[sous-groupe]] $G_x = \{g \in G : g \cdot x = x\}$.

- id: classe-conjugaison
  terme: classe de conjugaison
  defini_dans: gf-actions
  definition: |
    Les classes de conjugaison d'un [[groupe]] $G$ sont les orbites de l'action de $G$ sur lui-même par [[action-conjugaison|conjugaison]], $g \cdot x = gxg^{-1}$ : la classe de $x$ est $\{gxg^{-1} : g \in G\}$.

- id: groupe-abelien-libre
  terme: groupe abélien libre
  notation: '$\mathbb Z^{(S)}$'
  defini_dans: h-complexes
  definition: |
    Le groupe abélien libre sur un ensemble $S$ est le groupe $\mathbb Z^{(S)}$ des applications $S \to \mathbb Z$ nulles hors d'une partie finie, muni de l'addition ; en identifiant $s$ à l'application qui vaut $1$ en $s$ et $0$ ailleurs, tout élément s'écrit de façon unique comme somme finie $\sum n_s s$.

- id: morphisme-complexes
  terme: morphisme de complexes
  defini_dans: h-complexes
  definition: |
    Un morphisme de complexes $f : C \to D$ entre [[complexe-chaines|complexes de chaînes]] est une suite de morphismes $f_n : C_n \to D_n$ tels que $\partial f_n = f_{n-1} \partial$. Il envoie [[cycle-complexe|cycles]] sur cycles et [[bord-complexe|bords]] sur bords, donc induit $f_* : H_n(C) \to H_n(D)$. La même définition vaudra pour les complexes de cochaînes, dont la différentielle augmente le degré d'une unité ({{cs-cochaines|Complexes de cochaînes}}), avec $\delta f^n = f^{n+1} \delta$.

- id: morphisme-connexion
  terme: morphisme de connexion
  notation: '$\delta$'
  defini_dans: h-suite-exacte
  definition: |
    Pour une suite exacte courte de complexes $0 \to A \xrightarrow{i} B \xrightarrow{p} C \to 0$, le morphisme de connexion $\delta : H_n(C) \to H_{n-1}(A)$ envoie la classe d'un [[cycle-complexe|cycle]] $c$ sur celle de l'unique $a$ tel que $i(a) = \partial b$, où $b$ est un antécédent quelconque de $c$ par $p$ ; il ne dépend pas des choix et rend exacte la suite longue d'homologie. La même construction vaudra pour les complexes de cochaînes, dont la différentielle augmente le degré d'une unité ({{cs-cochaines|Complexes de cochaînes}}) : $\delta$ ira alors de $H^n(C)$ dans $H^{n+1}(A)$.

- id: simplexe-singulier
  terme: simplexe singulier
  defini_dans: h-singuliere
  definition: |
    Un simplexe singulier de dimension $n$ d'un [[espace-topologique|espace topologique]] $X$ est une application continue $\sigma : \Delta_n \to X$, où $\Delta_n$ est le [[simplexe-standard|simplexe standard]] ; elle n'est pas supposée injective.

- id: relevement
  terme: relèvement
  notation: '$\tilde f$'
  defini_dans: ta-revetement
  definition: |
    Pour un [[revetement|revêtement]] $p : E \to B$ et une application continue $f : Y \to B$, un relèvement de $f$ est une application continue $\tilde f : Y \to E$ telle que $p \circ \tilde f = f$.

- id: partie-etoilee
  terme: partie étoilée
  defini_dans: tr-intervalles
  definition: |
    Pour $n \geqslant 1$, une partie $C$ de $\mathbb R^n$ est étoilée par rapport à un point $a$ de $C$ si $(1 - t)a + tx \in C$ pour tous $x \in C$ et $t \in [0, 1]$, les opérations étant faites coordonnée par coordonnée : le segment qui joint $a$ à chaque point de $C$ est contenu dans $C$. Une [[partie-convexe|partie convexe]] est étoilée par rapport à chacun de ses points ; le plan privé de la demi-droite $\{(x, 0) : x \leqslant 0\}$ est étoilé par rapport à $(1, 0)$ sans être convexe.

- id: pi-systeme
  terme: π-système
  defini_dans: m-dynkin
  definition: |
    Une partie $\mathcal C$ de $\mathcal P(X)$ est un π-système si elle est stable par intersection finie : $A, B \in \mathcal C$ entraîne $A \cap B \in \mathcal C$.

- id: classe-monotone
  terme: classe monotone
  defini_dans: m-dynkin
  definition: |
    Une partie $\mathcal C$ de $\mathcal P(X)$ est une classe monotone, ou λ-système, si elle contient $X$, contient $B \setminus A$ dès que $A \subset B$ sont dans $\mathcal C$, et contient la réunion de toute suite croissante d'éléments de $\mathcal C$. Le lemme de Dynkin dit que la classe monotone engendrée par un π-système est la [[tribu]] qu'il engendre.

- id: mesure-finie
  terme: mesure finie
  defini_dans: m-mesures
  definition: |
    Une [[mesure]] $\mu$ sur $(X, \mathcal A)$ est finie si $\mu(X) < +\infty$.

- id: mesure-sigma-finie
  terme: mesure σ-finie
  defini_dans: m-mesures
  definition: |
    Une [[mesure]] $\mu$ sur $(X, \mathcal A)$ est σ-finie si $X$ est la réunion d'une suite croissante de parties mesurables de mesure finie.

- id: espace-mesurable
  terme: espace mesurable
  notation: '$(X, \mathcal A)$'
  defini_dans: m-tribus
  definition: |
    Un espace mesurable est un couple $(X, \mathcal A)$ formé d'un ensemble $X$ et d'une [[tribu]] $\mathcal A$ sur $X$ ; les éléments de $\mathcal A$ sont les parties mesurables.

- id: variance
  terme: variance
  notation: '$\operatorname{Var} X$'
  defini_dans: p-esperance
  definition: |
    La variance d'une [[variable-aleatoire|variable aléatoire]] réelle $X$ de carré intégrable est $\operatorname{Var} X = E\big[(X - E[X])^2\big] = E[X^2] - E[X]^2$ ; elle est positive, et nulle si et seulement si $X = E[X]$ [[presque-partout|presque partout]].

- id: filtration
  terme: filtration
  notation: '$(\mathcal F_n)$'
  defini_dans: mt-martingales
  definition: |
    Une filtration d'un [[espace-probabilise|espace probabilisé]] $(\Omega, \mathcal F, P)$ est une suite croissante $(\mathcal F_n)_{n \in \mathbb N}$ de sous-tribus de $\mathcal F$ ; $\mathcal F_n$ représente l'information disponible à l'instant $n$.

- id: variable-libre
  terme: variable libre
  defini_dans: l-formules
  definition: |
    Dans une [[formule]], une [[occurrence]] d'une variable $x$ est liée si elle se trouve dans la [[portee-quantificateur|portée]] d'un quantificateur $\forall x$, c'est-à-dire dans une [[sous-formule]] $\forall x\, \psi$, et libre sinon. Une variable libre d'une formule est une variable qui y a au moins une occurrence libre ; une formule sans variable libre est un [[enonce|énoncé]]. Lue sur les rangs des lettres, la même définition s'étend à un mot quelconque $w$ de l'alphabet : une occurrence de $x$ dans $w$ est liée si elle est une lettre de $\psi$ pour une sous-formule $\forall x\, \psi$ de $w$, c'est-à-dire un facteur de $w$ qui est une formule, et libre sinon ; pour une formule, on retrouve la définition précédente.

- id: substituable
  terme: substituable
  defini_dans: l-substitution
  definition: |
    Un [[terme]] $t$ est substituable à la variable $x$ dans une [[formule]] $\varphi$ si aucune [[occurrence]] libre de $x$ dans $\varphi$ ne se trouve dans une [[sous-formule]] $\forall y\, \psi$ où $y$ est une variable de $t$ : la substitution $\varphi[t/x]$ ne capture alors aucune variable de $t$.

- id: axiomes-logiques
  terme: axiomes logiques
  defini_dans: l-deduction
  definition: |
    Les axiomes logiques du système de Hilbert retenu sont toutes les généralisations $\forall y_1 \cdots \forall y_k\, \alpha$ des formules $\alpha$ de cinq schémas : les [[instance-tautologie|instances de tautologies]] ; $\forall x\, \alpha \to \alpha[t/x]$, si $t$ est substituable à $x$ dans $\alpha$ ; $\forall x\, (\alpha \to \beta) \to (\forall x\, \alpha \to \forall x\, \beta)$ ; $\alpha \to \forall x\, \alpha$, si $x$ n'est pas libre dans $\alpha$ ; les axiomes de l'égalité. Avec le [[modus-ponens|modus ponens]] pour seule règle, ils définissent les [[demonstration-formelle|démonstrations formelles]].

- id: arithmetique-robinson
  terme: arithmétique de Robinson
  notation: '$\mathsf Q$'
  defini_dans: l-incompletude
  definition: |
    La [[theorie|théorie]] du premier ordre, dans la signature $0, S, +, \times$, qui a pour axiomes les [[cloture-universelle|clôtures universelles]] de $\neg(S\,x = 0)$, $S\,x = S\,y \to x = y$, $\neg(x = 0) \to \exists y\, (x = S\,y)$, $x + 0 = x$, $x + S\,y = S(x + y)$, $x \times 0 = 0$ et $x \times S\,y = x \times y + x$. Sans schéma de récurrence, elle démontre pourtant tous les énoncés Σ₁ vrais, et toute théorie cohérente qui la contient a un ensemble de théorèmes non récursif.

- id: arithmetique-peano
  terme: arithmétique de Peano
  notation: '$\mathsf{PA}$'
  defini_dans: l-incompletude
  definition: |
    L'arithmétique de Peano est la [[theorie|théorie]] du premier ordre, dans la signature $0, S, +, \times$, qui a pour axiomes les six axiomes de Robinson autres que « tout entier non nul est un successeur », et le schéma de récurrence : pour toute formule $\varphi$ et toute variable $x$, la [[cloture-universelle|clôture universelle]] de $\big(\varphi[0/x] \wedge \forall x\, (\varphi \to \varphi[S\,x/x])\big) \to \forall x\, \varphi$.

- id: isomorphisme-structures
  terme: isomorphisme (structures)
  defini_dans: l-non-standard
  definition: |
    Un isomorphisme de deux [[structure|structures]] $\mathcal M$ et $\mathcal N$ pour une même [[signature]] est une application de $M$ dans $N$, injective et surjective, qui respecte l'interprétation de chaque symbole : constantes, fonctions et relations.

- id: courbe-reguliere
  terme: courbe régulière
  defini_dans: cb-courbes
  definition: |
    Une [[courbe-parametree|courbe paramétrée]] $\gamma : I \to \mathbb R^n$ de classe $C^k$, $k \geqslant 1$, est régulière si $\gamma'(t) \neq 0$ pour tout $t \in I$.

- id: plan-tangent
  terme: plan tangent
  defini_dans: sf-surfaces
  definition: |
    Le plan tangent en $(u, v)$ à une [[surface-parametree|surface paramétrée]] $x$ est l'image $\operatorname{Im} dx(u, v)$, plan vectoriel engendré par les dérivées partielles $x_u$ et $x_v$, indépendantes puisque $x_u \wedge x_v \neq 0$.

- id: boule-ouverte
  terme: boule ouverte
  notation: '$B(a, r)$'
  defini_dans: me-espace
  definition: |
    Dans un [[espace-metrique|espace métrique]] $(X, d)$, la boule ouverte de centre $a$ et de rayon $r > 0$ est $B(a, r) = \{x \in X : d(a, x) < r\}$.

- id: boule-fermee
  terme: boule fermée
  notation: '$\bar B(a, r)$'
  defini_dans: me-espace
  definition: |
    Dans un [[espace-metrique|espace métrique]] $(X, d)$, la boule fermée de centre $a$ et de rayon $r \geqslant 0$ est $\bar B(a, r) = \{x \in X : d(a, x) \leqslant r\}$. Le rayon nul est permis, et $\bar B(a, 0) = \{a\}$ ; la boule ouverte, elle, ne se prend que pour $r > 0$.

- id: partie-bornee
  terme: partie bornée
  defini_dans: me-espace
  definition: |
    Une partie d'un [[espace-metrique|espace métrique]] est bornée si elle est contenue dans une boule ; de façon équivalente, si elle est vide ou de diamètre fini. Dans $\mathbb R$ muni de la distance $|x - y|$, ce sont les parties majorées et minorées.

- id: diametre
  terme: diamètre
  notation: '$\operatorname{diam} A$'
  defini_dans: me-espace
  definition: |
    Le diamètre d'une partie non vide $A$ d'un [[espace-metrique|espace métrique]] $(X, d)$ est $\operatorname{diam} A = \sup\{d(x, y) : x, y \in A\}$, élément de $[0, +\infty]$ ; il est fini si et seulement si $A$ est bornée.

# Notions masquées par l'ancienne règle H, lexicalisées après relecture (3 nov. 2026)

- id: point-fixe-action
  terme: point fixe (action)
  notation: '$X^G$'
  defini_dans: gf-actions
  definition: |
    Pour une [[action-groupe|action]] d'un groupe $G$ sur un ensemble $X$, un point fixe est un $x \in X$ tel que $g \cdot x = x$ pour tout $g \in G$, c'est-à-dire dont l'orbite est réduite à $\{x\}$ ; on note $X^G$ l'ensemble des points fixes. Pour un seul élément $g$, les points fixes de $g$ sont les $x$ tels que $g \cdot x = x$ ; pour une permutation $\sigma$ d'un ensemble, ce sont les $x$ tels que $\sigma(x) = x$.

- id: centralisateur
  terme: centralisateur
  notation: '$C(x)$'
  defini_dans: gf-actions
  definition: |
    Le centralisateur d'un élément $x$ d'un [[groupe]] $G$ est le [[sous-groupe]] $C(x) = \{g \in G : gx = xg\}$ des éléments qui commutent à $x$ ; c'est le stabilisateur de $x$ pour l'action de $G$ sur lui-même par [[action-conjugaison|conjugaison]].

- id: cofacteur
  terme: cofacteur
  notation: '$C_{ij}$'
  defini_dans: v-comatrice
  definition: |
    Pour une matrice carrée $A$, le cofacteur d'indice $(i, j)$ est $C_{ij} = (-1)^{i+j}\Delta_{ij}$, où le mineur $\Delta_{ij}$ est le [[determinant|déterminant]] de la matrice obtenue en supprimant la ligne $i$ et la colonne $j$ de $A$.

- id: degre-polynome
  terme: degré (polynôme)
  notation: '$\deg P$'
  defini_dans: pol-anneau
  definition: |
    Le degré d'un polynôme non nul $P = \sum_k a_k X^k$ est le plus grand $k$ tel que $a_k \neq 0$ ; par convention, le polynôme nul est de degré $-\infty$. Sur un anneau intègre, $\deg(PQ) = \deg P + \deg Q$.

- id: covariance
  terme: covariance
  defini_dans: p-esperance
  definition: |
    La covariance de deux [[variable-aleatoire|variables aléatoires]] réelles $X$ et $Y$ de carré intégrable est $\operatorname{Cov}(X, Y) = E[XY] - E[X]E[Y] = E\big[(X - E[X])(Y - E[Y])\big]$ ; on a $\operatorname{Cov}(X, X) = \operatorname{Var} X$, et elle est nulle si $X$ et $Y$ sont indépendantes.

- id: element-minimal
  terme: élément minimal
  defini_dans: od-majorants
  definition: |
    Un élément minimal d'une partie $A$ d'un ensemble ordonné est un $m \in A$ tel qu'aucun $x \in A$ ne vérifie $x < m$ ; c'est un [[element-maximal|élément maximal]] pour l'ordre opposé. Dans un ordre non total, une partie peut avoir plusieurs éléments minimaux et pas de plus petit élément.

- id: schema-recurrence
  terme: schéma de récurrence
  defini_dans: l-incompletude
  definition: |
    Le schéma de récurrence est la famille des axiomes de l'[[arithmetique-peano|arithmétique de Peano]] obtenus, pour toute [[formule]] $\varphi$ et toute variable $x$, comme [[cloture-universelle|clôtures universelles]] de $\big(\varphi[0/x] \wedge \forall x\, (\varphi \to \varphi[S\,x/x])\big) \to \forall x\, \varphi$.

# Notions définies en gras, lexicalisées (diagnostic H, lot L1, 4 nov. 2026)

- id: ensemble-depart
  terme: ensemble de départ
  defini_dans: r-application
  definition: |
    L'ensemble de départ d'une [[application]] $f = (A, B, \Gamma)$, notée $f : A \to B$, est $A$ : chacun de ses éléments a une image et une seule par $f$. Restreindre $f$ à une partie stricte de $A$ change l'ensemble de départ, donc l'application.

- id: ensemble-arrivee
  terme: ensemble d'arrivée
  defini_dans: r-application
  definition: |
    L'ensemble d'arrivée d'une [[application]] $f = (A, B, \Gamma)$, notée $f : A \to B$, est $B$ : il contient les images des éléments de $A$, mais un élément de $B$ peut n'être l'image d'aucun. Il fait partie de la donnée de $f$ : deux applications de même graphe et d'ensembles d'arrivée différents sont distinctes.

- id: graphe-application
  terme: graphe d'une application
  defini_dans: r-application
  definition: |
    Le graphe d'une [[application]] $f = (A, B, \Gamma)$ est la [[relation]] $\Gamma$ de $A$ vers $B$, c'est-à-dire l'ensemble $\{(a, f(a)) : a \in A\}$ des couples formés d'un élément et de son image. Deux applications de mêmes ensembles de départ et d'arrivée sont égales si et seulement si elles ont même graphe.

- id: fonction-choix
  terme: fonction de choix
  defini_dans: r-choix
  definition: |
    Pour une [[famille]] $(A_i)_{i \in I}$ d'ensembles, une fonction de choix est un élément du [[produit-famille|produit]] $\prod_{i \in I} A_i$, c'est-à-dire une application $g$ définie sur $I$ telle que $g(i) \in A_i$ pour tout $i$. Pour un ensemble $X$ de parties non vides, c'est de même une application $g$ définie sur $X$ telle que $g(A) \in A$ pour tout $A \in X$ (c'est le cas de la famille $(A)_{A \in X}$). Qu'il en existe une dès que les ensembles sont non vides est l'une des formes de l'[[axiome-choix|axiome du choix]].

- id: classe-equivalence
  terme: classe d'équivalence
  notation: '$\overline x$'
  defini_dans: r-equivalence
  definition: |
    Pour une [[relation-equivalence|relation d'équivalence]] $\sim$ sur un ensemble $E$, la classe d'un élément $x$ est $\overline x = \{y \in E : y \sim x\}$. Deux classes sont égales ou disjointes, et $\overline x = \overline y$ si et seulement si $x \sim y$ ; un élément d'une classe en est un représentant.

- id: application-canonique
  terme: application canonique
  defini_dans: r-equivalence
  definition: |
    Pour une [[relation-equivalence|relation d'équivalence]] $\sim$ sur $E$, l'application canonique est $\pi : E \to E/\!\sim$, $x \mapsto \overline x$, qui envoie chaque élément sur sa [[classe-equivalence|classe]] dans l'[[ensemble-quotient|ensemble quotient]]. Toute classe est l'image de chacun de ses éléments, et $\pi(x) = \pi(y)$ si et seulement si $x \sim y$. On l'appelle aussi surjection canonique, ou projection sur le quotient.

- id: projection-produit
  terme: projection d'un produit
  notation: '$p_j$'
  defini_dans: r-familles
  definition: |
    Pour une [[famille]] d'ensembles $(A_i)_{i \in I}$ et $j \in I$, la projection d'indice $j$ est l'application $p_j : \prod_{i \in I} A_i \to A_j$, $g \mapsto g(j)$, qui extrait la coordonnée d'indice $j$. On appelle de même projections les applications $(a, b) \mapsto a$ et $(a, b) \mapsto b$ du [[produit-cartesien|produit cartésien]] $A \times B$.

- id: retraction-application
  terme: rétraction d'une application
  defini_dans: r-inverses
  definition: |
    Une rétraction d'une [[application]] $f : A \to B$ est une application $r : B \to A$ telle que $r \circ f = \mathrm{id}_A$, c'est-à-dire un inverse à gauche de $f$. Une application qui admet une rétraction est [[injection|injective]] ; réciproquement, une injection de source non vide en admet une, construite sans choix.

- id: retraction-espace
  terme: rétraction d'un espace sur une partie
  defini_dans: h-applications
  definition: |
    Pour une partie $A$ d'un espace topologique $X$, une rétraction de $X$ sur $A$ est une application continue $r : X \to A$ égale à l'identité sur $A$, c'est-à-dire une [[retraction-application|rétraction]] continue de l'inclusion $A \to X$. Il n'existe pas de rétraction de la boule $D^n$ sur la sphère $S^{n-1}$ pour $n \geqslant 1$.

- id: section-application
  terme: section d'une application
  defini_dans: r-inverses
  definition: |
    Une section d'une [[application]] $f : A \to B$ est une application $s : B \to A$ telle que $f \circ s = \mathrm{id}_B$, c'est-à-dire un inverse à droite de $f$, qui associe à chaque $b \in B$ l'un de ses antécédents. Une application qui admet une section est [[surjection|surjective]] ; que toute surjection en admette une équivaut à l'[[axiome-choix|axiome du choix]].

- id: relation-reciproque
  terme: relation réciproque
  notation: '$R^{-1}$'
  defini_dans: r-relation
  definition: |
    La relation réciproque d'une [[relation]] $R$ de $A$ vers $B$ est la relation $R^{-1} = \{(y, x) \in B \times A : x \mathrel R y\}$ de $B$ vers $A$. On a $(R^{-1})^{-1} = R$.

- id: relation-reflexive
  terme: relation réflexive
  defini_dans: r-relation
  definition: |
    Une [[relation]] $R$ sur un ensemble $E$ est réflexive si $x \mathrel R x$ pour tout $x \in E$. L'égalité sur $E$ et l'inclusion sur $\mathcal P(E)$ le sont ; une relation est irréflexive si aucun $x$ ne vérifie $x \mathrel R x$.

- id: relation-symetrique
  terme: relation symétrique
  defini_dans: r-relation
  definition: |
    Une [[relation]] $R$ sur un ensemble $E$ est symétrique si $x \mathrel R y$ entraîne $y \mathrel R x$ pour tous $x, y \in E$, c'est-à-dire si $R$ est égale à sa [[relation-reciproque|relation réciproque]] $R^{-1}$.

- id: relation-antisymetrique
  terme: relation antisymétrique
  defini_dans: r-relation
  definition: |
    Une [[relation]] $R$ sur un ensemble $E$ est antisymétrique si $x \mathrel R y$ et $y \mathrel R x$ entraînent $x = y$ pour tous $x, y \in E$. Ce n'est pas le contraire de la symétrie : l'égalité est à la fois symétrique et antisymétrique, et une relation peut n'être ni l'une ni l'autre.

- id: relation-transitive
  terme: relation transitive
  defini_dans: r-relation
  definition: |
    Une [[relation]] $R$ sur un ensemble $E$ est transitive si $x \mathrel R y$ et $y \mathrel R z$ entraînent $x \mathrel R z$ pour tous $x, y, z \in E$.

- id: ordre-dense
  terme: ordre dense
  defini_dans: od-coupures
  definition: |
    Un [[ordre-total|ordre total]] sur un ensemble $E$ est dense si, pour tous $x < y$ dans $E$, il existe $z$ avec $x < z < y$ ; aucun élément n'a alors de successeur immédiat : si $x < y$, l'élément $y$ n'est jamais le plus petit des éléments strictement supérieurs à $x$. C'est une propriété de l'ordre seul, à ne pas confondre avec la densité d'une partie dans un espace.

- id: segment-initial
  terme: segment initial
  defini_dans: od-intervalles
  definition: |
    Dans un ensemble totalement ordonné $E$, une partie $C$ est un segment initial si $x \in C$ et $y \leqslant x$ entraînent $y \in C$. Pour tout $a \in E$, les demi-droites $]{\leftarrow}, a[$ et $]{\leftarrow}, a]$ en sont, de même que $\varnothing$ et $E$.

- id: ensemble-ordonne
  terme: ensemble ordonné
  defini_dans: od-ordre
  definition: |
    Un ensemble ordonné est un couple $(E, \leqslant)$ formé d'un ensemble $E$ et d'une [[relation-ordre|relation d'ordre]] $\leqslant$ sur $E$. On dit qu'il est totalement ordonné si l'ordre est [[ordre-total|total]].

- id: ordre-induit
  terme: ordre induit
  defini_dans: od-ordre
  definition: |
    Pour une partie $F$ d'un [[ensemble-ordonne|ensemble ordonné]] $(E, \leqslant)$, l'ordre induit sur $F$ est la restriction de $\leqslant$ à $F \times F$, c'est-à-dire la relation $\leqslant \cap\, (F \times F)$. C'est une [[relation-ordre|relation d'ordre]] sur $F$, totale si celle de $E$ l'est.

- id: application-domaine
  terme: application de domaine
  defini_dans: o-recursion
  definition: |
    Dans les nœuds qui emploient la récursion transfinie, on identifie une application à son [[graphe-application|graphe]] : une application de domaine $\delta$ est un ensemble $f$ de couples dont les premiers termes sont dans $\delta$ et tel que, pour tout $\alpha \in \delta$, il existe un unique $y$ avec $(\alpha, y) \in f$, noté $f(\alpha)$. Aucun ensemble d'arrivée n'est fixé : $f$ est le graphe d'une [[application]] de $\delta$ dans tout ensemble qui contient ses valeurs.

- id: type-ordre
  terme: type d'ordre
  defini_dans: o-representation
  definition: |
    Le type d'ordre d'un ensemble [[bon-ordre|bien ordonné]] $(E, \leqslant)$ est l'unique [[ordinal]] qui lui est isomorphe ; l'[[isomorphisme-ordres|isomorphisme]] est lui-même unique. Deux ensembles bien ordonnés sont isomorphes si et seulement s'ils ont le même type d'ordre.

- id: table-verite
  terme: table de vérité
  defini_dans: l-connecteurs
  definition: |
    La table de vérité d'un [[connecteur]] donne sa valeur, $1$ pour le vrai et $0$ pour le faux, en fonction des valeurs de ses arguments : $\neg P$ vaut $1$ si et seulement si $P$ vaut $0$, et $P \to Q$ vaut $0$ si et seulement si $P$ vaut $1$ et $Q$ vaut $0$. Ce sont des règles finies de la [[metatheorie|métathéorie]].

- id: modus-ponens
  terme: modus ponens
  defini_dans: l-deduction
  definition: |
    Le modus ponens est la règle d'inférence qui, des formules $\alpha$ et $\alpha \to \beta$, tire $\beta$. C'est la seule règle du système de Hilbert retenu : dans une [[demonstration-formelle|démonstration formelle]], chaque formule est un [[axiomes-logiques|axiome logique]], un élément de l'ensemble $T$ des hypothèses, ou se déduit de deux formules précédentes par modus ponens.

- id: metatheorie
  terme: métathéorie
  defini_dans: l-metatheorie
  definition: |
    La métathéorie est le cadre dans lequel on parle des langages formels, de leurs mots et des structures qui leur donnent un sens. On s'y autorise les notions du raisonnement mathématique ordinaire, ensembles, applications, entiers naturels, récurrence, ensembles finis et dénombrables, prises dans leur sens intuitif. Un énoncé de la métathéorie porte sur les mots du langage formel ; il n'est pas lui-même l'un de ces mots.

- id: lettre-propositionnelle
  terme: lettre propositionnelle
  defini_dans: l-prop-formules
  definition: |
    Les lettres propositionnelles sont des symboles $P_0, P_1, \dots$, en suite infinie, qui tiennent lieu d'énoncés quelconques ; avec les [[connecteur|connecteurs]], elles forment l'alphabet du calcul propositionnel.

- id: formule-propositionnelle
  terme: formule propositionnelle
  defini_dans: l-prop-formules
  definition: |
    Les formules propositionnelles forment le plus petit ensemble de mots qui contient les [[lettre-propositionnelle|lettres propositionnelles]] et qui contient $\neg\varphi$ et $\to \varphi\, \psi$ dès qu'il contient $\varphi$ et $\psi$. Cette écriture préfixée se passe de parenthèses ; $(\varphi \to \psi)$ n'en est qu'une abréviation lisible.

- id: valuation-structure
  terme: valuation dans une structure
  defini_dans: l-structure
  definition: |
    Une valuation dans une [[structure]] $\mathcal M$ de domaine $M$ est une application $s$ de l'ensemble des variables dans $M$. Elle donne une valeur $t^{\mathcal M}[s] \in M$ à chaque [[terme]], par récurrence sur sa construction : $x^{\mathcal M}[s] = s(x)$ pour une variable, $c^{\mathcal M}[s] = c^{\mathcal M}$ pour une constante, et $(f\, t_1 \cdots t_n)^{\mathcal M}[s] = f^{\mathcal M}(t_1^{\mathcal M}[s], \dots, t_n^{\mathcal M}[s])$.

- id: valuation-booleenne
  terme: valuation booléenne
  defini_dans: l-tautologies
  definition: |
    Une valuation booléenne est une application $v$ des [[lettre-propositionnelle|lettres propositionnelles]] dans $\{0, 1\}$. Elle se prolonge de manière unique en une application $\bar v$ définie sur toutes les [[formule-propositionnelle|formules propositionnelles]] et compatible avec les [[table-verite|tables de vérité]] : $\bar v(\neg\varphi) = 1 - \bar v(\varphi)$, et $\bar v(\to \varphi\, \psi) = 0$ si et seulement si $\bar v(\varphi) = 1$ et $\bar v(\psi) = 0$.

- id: instance-tautologie
  terme: instance de tautologie
  defini_dans: l-deduction
  definition: |
    Une instance de tautologie est une formule du premier ordre obtenue en remplaçant, dans une [[tautologie]] propositionnelle, chaque [[lettre-propositionnelle|lettre]] par une formule, la même lettre étant partout remplacée par la même formule. Ainsi $\forall x\, \varphi \to \forall x\, \varphi$ en est une, obtenue à partir de $P \to P$. Les instances de tautologies sont des [[axiomes-logiques|axiomes logiques]].

- id: formule-atomique
  terme: formule atomique
  defini_dans: l-formules
  definition: |
    Les formules atomiques d'un langage du premier ordre sont les mots $= t_1\, t_2$ et $R\, t_1 \cdots t_n$, où $R$ est un symbole de relation d'[[arite|arité]] $n$ et où les $t_i$ sont des [[terme|termes]]. Ce sont les formules sans connecteur ni quantificateur, à partir desquelles toutes les [[formule|formules]] sont construites.

- id: portee-quantificateur
  terme: portée d'un quantificateur
  defini_dans: l-formules
  definition: |
    Dans une formule $\forall x\, \psi$, la formule $\psi$ est la portée du [[quantificateur]] $\forall x$. Une occurrence de $x$ qui se trouve dans la portée d'un quantificateur $\forall x$ est liée, les autres sont libres ([[variable-libre|variable libre]]). Comme $\exists x\, \psi$ abrège $\neg \forall x\, \neg\psi$, la portée du [[quantificateur-existentiel|quantificateur existentiel]] $\exists x$ s'entend de celle du quantificateur $\forall x$ qu'il abrège, la formule $\neg\psi$ : les occurrences de $x$ qu'il lie sont celles de $\psi$ qui y sont libres.

- id: arite
  terme: arité
  defini_dans: l-langage
  definition: |
    Dans une [[signature]], chaque symbole de constante, de fonction ou de relation est muni d'un entier, son arité, qui est le nombre de ses arguments ; les constantes n'ont pas d'argument et sont d'arité $0$. Ainsi un symbole de fonction d'arité $n$, suivi de $n$ termes, forme un terme, et un symbole de relation d'arité $n$, suivi de $n$ termes, une formule. Par extension (nœud Primitives récursives), une fonction d'arité $n$ est une application, ou une fonction partielle, de $\mathbb N^n$ dans $\mathbb N$.

- id: poids-mot
  terme: poids d'un mot
  defini_dans: l-lecture
  definition: |
    Pour démontrer la lecture unique, on attribue à chaque symbole un poids entier : $1$ pour une variable ou une constante, $1 - n$ pour un symbole de fonction d'[[arite|arité]] $n$ et, pour les formules, $1$ pour une lettre propositionnelle, $1 - n$ pour un symbole de relation d'arité $n$, $-1$ pour $=$ et pour $\to$, $0$ pour $\neg$ et pour le bloc $\forall x$. Le poids d'un mot est la somme des poids de ses symboles. Tout [[terme]] est de poids $1$ et tout préfixe propre non vide d'un terme est de poids au plus $0$, de sorte qu'aucun terme n'est préfixe propre d'un autre ; il en va de même des formules.

- id: quantificateur-existentiel
  terme: quantificateur existentiel
  defini_dans: l-quantificateurs
  definition: |
    Le quantificateur existentiel $\exists x$ est une abréviation : $\exists x\, \varphi$ désigne la formule $\neg \forall x\, \neg\varphi$, lue « il existe $x$ tel que $\varphi$ ». Ce n'est pas un symbole de l'alphabet : une formule écrite avec $\exists$ s'écrit avec le seul [[quantificateur]] $\forall$.

- id: occurrence
  terme: occurrence
  defini_dans: l-formules
  definition: |
    Une occurrence d'un symbole dans un mot est une place où il figure ; un même symbole peut avoir plusieurs occurrences. Pour une variable $x$, on ne compte pas la lettre $x$ qui suit immédiatement un symbole $\forall$ et fait partie du bloc $\forall x$. Dans une [[formule]], une occurrence de $x$ est liée si elle se trouve dans la [[portee-quantificateur|portée]] d'un quantificateur $\forall x$, libre sinon ([[variable-libre|variable libre]]).

- id: sous-formule
  terme: sous-formule
  defini_dans: l-formules
  definition: |
    Une sous-formule d'une [[formule]] $\varphi$ est une formule formée de symboles consécutifs de $\varphi$. Toute formule est une sous-formule d'elle-même, et $\psi$ est une sous-formule de $\neg\psi$ et de $\forall x\, \psi$.

- id: modele-termes-clos
  terme: modèle des termes clos
  defini_dans: hk-modele
  definition: |
    Soit $\widehat T$ une [[theorie-coherente|théorie cohérente]], sur une signature qui a au moins une constante, qui contient, pour tout [[enonce|énoncé]] $\sigma$, $\sigma$ ou $\neg\sigma$. Son modèle des termes clos a pour domaine l'ensemble des classes $[t] = \{u : (t = u) \in \widehat T\}$ des [[terme-clos|termes clos]] $t$, et interprète les symboles sur les représentants : $c^{\mathcal M} = [c]$, $f^{\mathcal M}([t_1], \dots, [t_n]) = [f\, t_1 \cdots t_n]$, et $([t_1], \dots, [t_n]) \in R^{\mathcal M}$ si et seulement si $R\, t_1 \cdots t_n \in \widehat T$. C'est une [[structure]], où chaque terme clos a pour valeur sa classe.

- id: programme-machine
  terme: programme (machine à registres)
  defini_dans: cal-machines
  definition: |
    Un programme de [[machine-registres|machine à registres]] est une suite finie $I_0, \dots, I_{L-1}$ d'instructions de deux sortes : $\mathrm{INC}(i)$ ajoute $1$ au contenu du registre $R_i$ et passe à l'instruction suivante ; $\mathrm{DEC}(i, j)$ retire $1$ au contenu de $R_i$ et passe à l'instruction suivante si ce contenu est non nul, et passe sinon à l'instruction de numéro $j$.

- id: configuration-machine
  terme: configuration (machine à registres)
  defini_dans: cal-machines
  definition: |
    Une configuration d'une [[machine-registres|machine à registres]] est un couple $(\ell, r)$ formé d'un numéro d'instruction $\ell \in \mathbb N$ et d'une application $r : \mathbb N \to \mathbb N$ nulle sauf en un nombre fini de points, $r(i)$ étant le contenu du registre $R_i$. Si $\ell$ est le numéro d'une instruction du [[programme-machine|programme]], celle-ci la transforme en une configuration suivante.

- id: configuration-terminale
  terme: configuration terminale
  defini_dans: cal-machines
  definition: |
    Pour un [[programme-machine|programme]] $I_0, \dots, I_{L-1}$, une [[configuration-machine|configuration]] $(\ell, r)$ est terminale si $\ell \geqslant L$ : aucune instruction ne porte ce numéro, et le calcul s'arrête.

- id: calcul-machine
  terme: calcul (machine à registres)
  notation: '$f_P^{(n)}$'
  defini_dans: cal-machines
  definition: |
    Pour un [[programme-machine|programme]] $P$ et $x \in \mathbb N^n$, le calcul de $P$ sur $x$ est la suite des [[configuration-machine|configurations]] issue de $(0, r_x)$, où $r_x$ place $x_1, \dots, x_n$ dans les registres $R_1, \dots, R_n$ et $0$ dans les autres, chacune transformée en la suivante par l'instruction dont elle porte le numéro. S'il atteint une [[configuration-terminale|configuration terminale]] $(\ell, r)$, on pose $f_P^{(n)}(x) = r(0)$ ; sinon, $f_P^{(n)}(x)$ n'est pas défini.

- id: calculable-machine
  terme: calculable par machine
  defini_dans: cal-machines
  definition: |
    Une [[fonction-partielle|fonction partielle]] $f : \mathbb N^n \rightharpoonup \mathbb N$ est calculable par machine s'il existe un [[programme-machine|programme]] $P$ tel que $f = f_P^{(n)}$ : pour tout $x$, le [[calcul-machine|calcul]] de $P$ sur $x$ s'arrête si et seulement si $f(x)$ est défini, et laisse alors $f(x)$ dans le registre $R_0$.

- id: fonction-totale
  terme: fonction totale
  defini_dans: cal-recursives
  definition: |
    Une [[fonction-partielle|fonction partielle]] $f : \mathbb N^n \rightharpoonup \mathbb N$ est totale si son domaine de définition $D(f)$ est $\mathbb N^n$ tout entier, c'est-à-dire si $f(x)$ est défini pour tout $x$ ; c'est alors une application de $\mathbb N^n$ dans $\mathbb N$.

- id: indice-calculable
  terme: indice d'une fonction calculable
  notation: '$\varphi_e$'
  defini_dans: cal-kleene
  definition: |
    Tout entier $e$ code un [[programme-machine|programme]] $P_e$, et l'on note $\varphi_e^{(n)} = f_{P_e}^{(n)}$ la fonction partielle qu'il calcule ; on dit que $e$ est un indice de cette fonction, et aussi un indice du programme $P_e$, et l'on écrit $\varphi_e$ pour $\varphi_e^{(1)}$. Les fonctions récursives d'arité $n$ sont exactement les $\varphi_e^{(n)}$.

- id: code-mot
  terme: code d'un mot
  notation: '$\ulcorner w \urcorner$'
  defini_dans: cal-sx-codage
  definition: |
    Dans le langage de l'arithmétique, dont l'alphabet est énuméré par $a_0 = {=}$, $a_1 = \neg$, $a_2 = {\to}$, $a_3 = \forall$, $a_4 = 0$, $a_5 = S$, $a_6 = +$, $a_7 = \times$ et $a_{8+i} = x_i$, le code d'un mot $w = a_{k_0} \cdots a_{k_{m-1}}$ est l'entier $\ulcorner w \urcorner = \langle k_0, \dots, k_{m-1} \rangle$, code de la suite finie des indices de ses lettres. Tout entier est le code d'un unique mot, et les notions syntaxiques deviennent des relations entre entiers.

- id: facteur-mot
  terme: facteur d'un mot
  defini_dans: cal-sx-codage
  definition: |
    Un facteur d'un mot $w$ est un mot formé de lettres consécutives de $w$, c'est-à-dire un mot $u$ tel que $w = v u v'$ pour des mots $v$ et $v'$, éventuellement vides. Une [[sous-formule]] d'une formule en est un facteur qui est une formule.

- id: valuation-formules-premieres
  terme: valuation des formules premières
  defini_dans: cal-sx-instances
  definition: |
    Une valuation des formules premières est une application $v$ de l'ensemble des [[formule-premiere|formules premières]] dans $\{0, 1\}$. Elle se prolonge de manière unique, grâce à la lecture unique, en une application $\bar v$ définie sur toutes les formules, qui coïncide avec $v$ sur les formules premières et suit les [[table-verite|tables de vérité]] de $\neg$ et de $\to$. Une formule est une [[instance-tautologie|instance de tautologie]] si et seulement si $\bar v$ lui donne la valeur $1$ pour toute $v$.

- id: fonctions-base
  terme: fonctions de base
  defini_dans: cal-pr-definition
  definition: |
    Les fonctions de base sont la fonction nulle $Z : \mathbb N \to \mathbb N$, $x \mapsto 0$, le [[successeur-ensemble|successeur]] $S : x \mapsto x + 1$, restriction à $\mathbb N = \omega$ du successeur ensembliste, et les projections $P^n_i : \mathbb N^n \to \mathbb N$, $(x_1, \dots, x_n) \mapsto x_i$, pour $1 \leqslant i \leqslant n$. Les [[fonction-primitive-recursive|fonctions primitives récursives]] forment le plus petit ensemble de fonctions qui les contient et qui est stable par composition et par récurrence primitive.

- id: induction-primitives
  terme: principe d'induction (fonctions primitives récursives)
  defini_dans: cal-pr-definition
  definition: |
    Une propriété vraie des [[fonctions-base|fonctions de base]], et conservée par composition et par récurrence primitive, est vraie de toute [[fonction-primitive-recursive|fonction primitive récursive]] : l'ensemble des fonctions primitives récursives qui l'ont contient les fonctions de base et est stable par les deux opérations, donc contient le plus petit ensemble qui a ces propriétés.

- id: cloture-universelle
  terme: clôture universelle
  defini_dans: l-formules
  definition: |
    La clôture universelle d'une [[formule]] $\psi$ dont les [[variable-libre|variables libres]] sont $x_{i_1}, \dots, x_{i_g}$, avec $i_1 < \cdots < i_g$, est la formule $\forall x_{i_1} \cdots \forall x_{i_g}\, \psi$. C'est un [[enonce|énoncé]] ; si $\psi$ en est déjà un, sa clôture universelle est $\psi$ elle-même.

# Notions définies en gras, lexicalisées (diagnostic H, lot L2, 4 nov. 2026)

- id: multiple-element
  terme: multiple d'un élément
  notation: '$n \cdot x$'
  defini_dans: n-sommes
  definition: |
    Dans un ensemble muni d'une loi associative notée $+$ et d'un élément $0$ tel que $0 + x = x + 0 = x$ pour tout $x$, le multiple $n \cdot x$, ou $nx$, d'un élément $x$ par un entier naturel $n$ est la [[puissance|puissance]] $n$-ième de $x$ écrite en notation additive : $0 \cdot x = 0$ et $(n + 1) \cdot x = n \cdot x + x$. Dans $(\mathbb N, +)$, le multiple $n \cdot m$ est le produit $nm$.

- id: successeur-ensemble
  terme: successeur d'un ensemble
  notation: '$S(x)$'
  defini_dans: n-succ
  definition: |
    Le successeur d'un ensemble $x$ est l'ensemble $S(x) = x \cup \{x\}$, dont les éléments sont ceux de $x$ et $x$ lui-même. Les entiers naturels s'obtiennent ainsi à partir de $0 = \varnothing$ : $1 = S(0) = \{0\}$, $2 = S(1) = \{0, 1\}$, et un ensemble est [[inductif-successeur|inductif]] s'il contient $\varnothing$ et le successeur de chacun de ses éléments.

- id: ecriture-irreductible
  terme: écriture irréductible d'un rationnel
  defini_dans: q-construction
  definition: |
    Tout nombre rationnel s'écrit de manière unique $a/b$ avec $a \in \mathbb Z$, $b \geqslant 1$ et $a \wedge b = 1$, c'est-à-dire avec $a$ et $b$ [[premiers-entre-eux|premiers entre eux]] : c'est son écriture irréductible. Ainsi $6/4$ et $-9/(-6)$ ont pour écriture irréductible $3/2$.

- id: conjugue-complexe
  terme: conjugué d'un nombre complexe
  notation: '$\bar z$'
  defini_dans: c-calcul
  definition: |
    Le conjugué du [[nombre-complexe|nombre complexe]] $z = a + ib$, où $a$ et $b$ sont réels, est $\bar z = a - ib$. La conjugaison respecte la somme et le produit, $\bar{\bar z} = z$, $\bar z = z$ si et seulement si $z$ est réel, et $z\bar z = |z|^2$ est le carré du [[module-complexe|module]] de $z$.

- id: partie-reelle
  terme: partie réelle
  notation: '$\operatorname{Re} z$'
  defini_dans: c-construction
  definition: |
    Tout [[nombre-complexe|nombre complexe]] s'écrit de manière unique $z = a + ib$ avec $a$ et $b$ réels ; le réel $a$ est la partie réelle de $z$, notée $\operatorname{Re} z$. Un nombre complexe est réel si et seulement si sa [[partie-imaginaire|partie imaginaire]] est nulle.

- id: partie-imaginaire
  terme: partie imaginaire
  notation: '$\operatorname{Im} z$'
  defini_dans: c-construction
  definition: |
    Tout [[nombre-complexe|nombre complexe]] s'écrit de manière unique $z = a + ib$ avec $a$ et $b$ réels ; le réel $b$, et non $ib$, est la partie imaginaire de $z$, notée $\operatorname{Im} z$.

- id: polynome-constant
  terme: polynôme constant
  defini_dans: pol-anneau
  definition: |
    Un polynôme est constant s'il est nul ou de [[degre-polynome|degré]] $0$, c'est-à-dire si tous ses coefficients d'indice $k \geqslant 1$ sont nuls. Un polynôme non constant est donc de degré au moins $1$.

- id: relation-pascal
  terme: relation de Pascal
  defini_dans: pol-binome
  definition: |
    La relation de Pascal est l'égalité $\binom{n+1}{k+1} = \binom nk + \binom n{k+1}$, pour tous $n, k \in \mathbb N$. Avec $\binom 00 = 1$, $\binom 0k = 0$ pour $k \geqslant 1$ et $\binom{n+1}0 = 1$, elle définit par récurrence sur $n$ les [[coefficient-binomial|coefficients binomiaux]].

- id: divisibilite-polynomes
  terme: divisibilité des polynômes
  notation: '$B \mid P$'
  defini_dans: pol-division
  definition: |
    Pour deux polynômes $P$ et $B$ de [[anneau-polynomes|$A[X]$]], on dit que $B$ divise $P$, et l'on note $B \mid P$, s'il existe $C \in A[X]$ tel que $P = BC$. Lorsque le [[coefficient-dominant|coefficient dominant]] de $B$ est inversible, la [[division-euclidienne-polynomes|division euclidienne]] existe, et $B$ divise $P$ si et seulement si son reste est nul.

- id: evaluation-polynome
  terme: évaluation d'un polynôme
  notation: '$P(b)$'
  defini_dans: pol-evaluation
  definition: |
    Soit $\varphi : A \to B$ un [[morphisme-anneaux|morphisme d'anneaux]], avec $B$ commutatif, et $b \in B$. L'évaluation en $b$ du polynôme $P = \sum_k a_kX^k \in A[X]$ est $P(b) = \sum_k \varphi(a_k)\, b^k$ ; le plus souvent, $A$ est un [[sous-anneau|sous-anneau]] de $B$ et $\varphi$ l'inclusion. L'application $P \mapsto P(b)$ est un morphisme d'anneaux de $A[X]$ dans $B$.

- id: contenu-polynome
  terme: contenu d'un polynôme
  notation: '$c(P)$'
  defini_dans: pol-gauss
  definition: |
    Le contenu d'un polynôme non nul $P \in \mathbb Z[X]$ est l'unique entier $c(P) \geqslant 1$ tel que l'idéal engendré par les coefficients de $P$ soit $c(P)\,\mathbb Z$ ; c'est le [[pgcd|PGCD]] des coefficients. Le polynôme $P$ est [[polynome-primitif|primitif]] si $c(P) = 1$.

- id: reduction-modulo-p
  terme: réduction modulo p
  defini_dans: pol-gauss
  definition: |
    Pour un [[nombre-premier|nombre premier]] $p$, la réduction modulo $p$ est le [[morphisme-anneaux|morphisme d'anneaux]] $\mathbb Z[X] \to (\mathbb Z/p\mathbb Z)[X]$ qui prolonge la [[application-canonique|projection]] $\mathbb Z \to \mathbb Z/p\mathbb Z$ et envoie $X$ sur $X$ : il remplace chaque coefficient par sa classe modulo $p$.

- id: polynomes-associes
  terme: polynômes associés
  defini_dans: pol-principal
  definition: |
    Pour un [[corps]] $K$, deux polynômes de $K[X]$ sont associés si l'un est le produit de l'autre par une constante non nulle. Un polynôme non nul est associé à un unique [[polynome-unitaire|polynôme unitaire]], son quotient par son [[coefficient-dominant|coefficient dominant]].

- id: racine-simple
  terme: racine simple
  defini_dans: pol-racines
  definition: |
    Une [[racine-polynome|racine]] $a$ d'un polynôme non nul $P$ est simple si sa [[multiplicite-racine|multiplicité]] vaut $1$, c'est-à-dire si $X - a$ divise $P$ mais $(X - a)^2$ ne le divise pas.

- id: racine-multiple
  terme: racine multiple
  defini_dans: pol-racines
  definition: |
    Une [[racine-polynome|racine]] $a$ d'un polynôme non nul $P$ est multiple si sa [[multiplicite-racine|multiplicité]] est au moins $2$, c'est-à-dire si $(X - a)^2$ divise $P$.

- id: polynome-scinde
  terme: polynôme scindé
  defini_dans: pol-racines
  definition: |
    Un polynôme non nul $P \in A[X]$ est scindé sur $A$ s'il s'écrit $P = c\prod_{i=1}^d (X - \alpha_i)$ avec $c, \alpha_1, \dots, \alpha_d \in A$ et $d = \deg P$, c'est-à-dire s'il est le produit d'une constante par des polynômes unitaires de degré $1$ ; les $\alpha_i$ sont alors des [[racine-polynome|racines]] de $P$. Sur $\mathbb R$, $X^2 + 1$ n'est pas scindé ; sur $\mathbb C$, il l'est.

- id: frobenius
  terme: Frobenius (morphisme)
  defini_dans: pol-binome
  definition: |
    Si $p$ est un [[nombre-premier|nombre premier]] et $A$ un [[anneau-commutatif|anneau commutatif]] dans lequel $p \cdot 1 = 0$, l'application $x \mapsto x^p$ est un [[morphisme-anneaux|morphisme d'anneaux]] de $A$ dans $A$, le Frobenius de $A$ : $(a + b)^p = a^p + b^p$ par la formule du binôme, dont les [[coefficient-binomial|coefficients]] intermédiaires $\binom pk$ sont divisibles par $p$.

- id: factorielle
  terme: factorielle
  notation: '$k!$'
  defini_dans: n-sommes
  definition: |
    La factorielle d'un entier naturel $k$, notée $k!$, est définie par récurrence : $0! = 1$ et $(k + 1)! = (k + 1) \cdot k!$. Ainsi $1! = 1$, $2! = 2$, $3! = 6$ et $5! = 120$.

- id: congruence
  terme: congruence modulo n
  notation: '$a \equiv b \pmod n$'
  defini_dans: z-zn
  definition: |
    Pour un entier $n \geqslant 1$, deux entiers $a$ et $b$ sont congrus modulo $n$, ce que l'on note $a \equiv b \pmod n$, si $n$ divise $a - b$, c'est-à-dire si $a$ et $b$ ont la même classe dans $\mathbb Z/n\mathbb Z$. Les congruences modulo $n$ s'additionnent et se multiplient, puisque la [[application-canonique|projection]] de $\mathbb Z$ sur $\mathbb Z/n\mathbb Z$ est un [[morphisme-anneaux|morphisme d'anneaux]].

- id: ideal-principal
  terme: idéal principal
  notation: '$xA$'
  defini_dans: a-ideal
  definition: |
    Dans un anneau commutatif $A$, l'idéal principal engendré par $x \in A$ est $xA = \{xa : a \in A\}$, le plus petit [[ideal|idéal]] qui contient $x$. Un idéal est principal s'il est de cette forme : $\{0\} = 0A$ et $A = 1A$ le sont.

- id: loi-associative
  terme: loi associative
  defini_dans: a-loi
  definition: |
    Une [[loi-composition|loi de composition interne]] $\ast$ sur un ensemble $E$ est associative si $(x \ast y) \ast z = x \ast (y \ast z)$ pour tous $x, y, z \in E$. L'addition et la multiplication des entiers, la composition des applications d'un ensemble dans lui-même le sont ; la soustraction des entiers relatifs ne l'est pas.

- id: loi-commutative
  terme: loi commutative
  defini_dans: a-loi
  definition: |
    Une [[loi-composition|loi de composition interne]] $\ast$ sur un ensemble $E$ est commutative si $x \ast y = y \ast x$ pour tous $x, y \in E$. La composition des [[bijection|bijections]] d'un ensemble à trois éléments ne l'est pas.

- id: partie-stable
  terme: partie stable (pour une loi)
  defini_dans: a-loi
  definition: |
    Une partie $F$ d'un ensemble $E$ muni d'une [[loi-composition|loi de composition interne]] $\ast$ est stable si $x \ast y \in F$ pour tous $x, y \in F$. La [[restriction]] de $\ast$ à $F \times F$ est alors une loi de composition interne sur $F$, la loi induite.

- id: application-a-lineaire
  terme: application A-linéaire
  defini_dans: a-module
  definition: |
    Pour un [[anneau-commutatif|anneau commutatif]] $A$ et deux [[module|$A$-modules]] $M$ et $M'$, une application $f : M \to M'$ est $A$-linéaire si $f(x + y) = f(x) + f(y)$ et $f(ax) = af(x)$ pour tous $x, y \in M$ et $a \in A$. C'est un [[morphisme-groupes|morphisme]] des groupes additifs qui respecte de plus la loi externe.

- id: element-regulier
  terme: élément régulier
  defini_dans: a-monoide
  definition: |
    Un élément $x$ d'un [[monoide|monoïde]] est régulier si $xy = xz$ entraîne $y = z$ et si $yx = zx$ entraîne $y = z$ : on peut le simplifier à gauche et à droite. Tout élément [[inversible]] est régulier, en multipliant par son inverse.

- id: sous-groupe-engendre
  terme: sous-groupe engendré
  notation: '$\langle S \rangle$'
  defini_dans: a-sous-groupe
  definition: |
    Pour une partie $S$ d'un [[groupe]] $G$, le sous-groupe engendré par $S$, noté $\langle S \rangle$, est le plus petit [[sous-groupe]] de $G$ qui contient $S$ : c'est l'intersection de tous les sous-groupes de $G$ qui contiennent $S$.

- id: theoreme-base-incomplete
  terme: théorème de la base incomplète
  defini_dans: v-bases-existence
  definition: |
    Le théorème de la base incomplète affirme que, dans tout [[espace-vectoriel|espace vectoriel]], toute partie libre est contenue dans une [[base-vectorielle|base]] ; en particulier, tout espace vectoriel a une base. La démonstration, en dimension quelconque, utilise le lemme de Zorn ⋆ ; en dimension finie, on complète une famille libre par des vecteurs d'une base donnée, sans aucun choix.

- id: famille-support-fini
  terme: famille à support fini
  defini_dans: v-combinaisons
  definition: |
    Une famille $(\lambda_i)_{i \in I}$ de scalaires est à support fini si l'ensemble $\{i \in I : \lambda_i \neq 0\}$, son support, est un [[ensemble-fini|ensemble fini]]. C'est ce qui donne un sens à la [[combinaison-lineaire|combinaison linéaire]] $\sum_{i \in I} \lambda_i x_i$ lorsque $I$ est infini : on somme sur le support.

- id: espace-dimension-finie
  terme: espace de dimension finie
  defini_dans: v-dimension
  definition: |
    Un [[espace-vectoriel|espace vectoriel]] est de dimension finie s'il est engendré par une famille finie. Il a alors une [[base-vectorielle|base]] finie, et toutes ses bases ont le même nombre d'éléments, sa [[dimension]].

- id: forme-lineaire
  terme: forme linéaire
  defini_dans: v-dual
  definition: |
    Une forme linéaire sur un [[espace-vectoriel|espace vectoriel]] $E$ sur $K$ est une [[application-lineaire|application linéaire]] de $E$ dans $K$. Les formes linéaires forment l'[[espace-dual|espace dual]] $E^*$.

- id: coordonnees-base
  terme: coordonnées dans une base
  defini_dans: v-libre
  definition: |
    Si $(e_i)_{i \in I}$ est une [[base-vectorielle|base]] d'un espace vectoriel $E$, tout $x \in E$ s'écrit de manière unique $x = \sum_i \lambda_i e_i$ avec une famille $(\lambda_i)$ [[famille-support-fini|à support fini]] ; les scalaires $\lambda_i$ sont les coordonnées de $x$ dans cette base.

- id: vecteur-propre
  terme: vecteur propre
  defini_dans: v-valeurs-propres
  definition: |
    Pour un [[endomorphisme]] $u$ d'un espace vectoriel $E$ de dimension finie, un vecteur propre associé à une [[valeur-propre|valeur propre]] $\lambda$ est un vecteur $x \neq 0$ tel que $u(x) = \lambda x$. Le vecteur nul n'est jamais un vecteur propre, alors que $0$ peut être une valeur propre. La même définition vaut pour un endomorphisme d'un espace quelconque, par exemple un opérateur d'un espace de Hilbert.

- id: sous-espace-propre
  terme: sous-espace propre
  notation: '$E_\lambda$'
  defini_dans: v-valeurs-propres
  definition: |
    Pour un [[endomorphisme]] $u$ d'un espace vectoriel $E$ de dimension finie et une [[valeur-propre|valeur propre]] $\lambda$ de $u$, le sous-espace propre associé à $\lambda$ est $E_\lambda = \operatorname{Ker}(u - \lambda\,\mathrm{id})$ : il est formé de $0$ et des [[vecteur-propre|vecteurs propres]] associés à $\lambda$.

- id: matrices-semblables
  terme: matrices semblables
  defini_dans: v-trace
  definition: |
    Deux matrices carrées $A$ et $A'$ de $\mathcal M_n(K)$ sont semblables s'il existe une [[matrice-inversible|matrice inversible]] $P$ telle que $A' = P^{-1}AP$. Les matrices d'un même [[endomorphisme]] dans deux bases sont semblables, et deux matrices semblables ont la même [[trace]].

- id: trois-cycle
  terme: 3-cycle
  notation: '$(a\ b\ c)$'
  defini_dans: v-permutations
  definition: |
    Pour $a, b, c$ distincts dans $\{1, \dots, n\}$, le $3$-cycle $(a\ b\ c)$ est la permutation de $\mathfrak S_n$ qui envoie $a$ sur $b$, $b$ sur $c$, $c$ sur $a$ et fixe les autres éléments. On a $(a\ b\ c) = (b\ c\ a) = (c\ a\ b)$.

- id: double-transposition
  terme: double transposition
  defini_dans: v-permutations
  definition: |
    Une double transposition est un produit $(a\ b)(c\ d)$ de deux [[transposition|transpositions]] de supports disjoints, c'est-à-dire avec $\{a, b\} \cap \{c, d\} = \varnothing$. Elle a pour [[signature-permutation|signature]] $1$.

- id: groupe-alterne
  terme: groupe alterné
  notation: '$\mathfrak A_n$'
  defini_dans: v-permutations
  definition: |
    Le groupe alterné $\mathfrak A_n$ est l'ensemble des permutations de $\mathfrak S_n$ de [[signature-permutation|signature]] $1$. C'est le [[noyau]] du morphisme $\varepsilon$, donc un [[sous-groupe-distingue|sous-groupe distingué]] de $\mathfrak S_n$.

- id: p-groupe
  terme: p-groupe
  defini_dans: gf-actions
  definition: |
    Pour un [[nombre-premier|nombre premier]] $p$, un $p$-groupe est un [[groupe]] d'ordre $p^a$ avec $a \geqslant 1$ ; le groupe trivial n'en est donc pas un. Le [[centre-groupe|centre]] d'un $p$-groupe n'est pas réduit au neutre.

- id: centre-groupe
  terme: centre d'un groupe
  notation: '$Z(G)$'
  defini_dans: gf-actions
  definition: |
    Le centre $Z(G)$ d'un [[groupe]] $G$ est l'ensemble des éléments qui commutent à tous les autres. C'est l'ensemble des [[point-fixe-action|points fixes]] de l'action de $G$ sur lui-même par [[action-conjugaison|conjugaison]], $g \cdot x = gxg^{-1}$ ; il est égal à $G$ si et seulement si $G$ est abélien.

- id: ordre-element
  terme: ordre d'un élément
  defini_dans: gf-cycliques
  definition: |
    L'ordre d'un élément $x$ d'un [[groupe]], s'il est fini, est le nombre d'éléments du [[sous-groupe-engendre|sous-groupe engendré]] $\langle x \rangle = \{x^k : k \in \mathbb Z\}$. Si $d$ est cet ordre, $x^k = e$ si et seulement si $d$ divise $k$ ; dans un groupe fini, l'ordre de tout élément divise le cardinal du groupe.

- id: produit-direct-groupes
  terme: produit direct de groupes
  defini_dans: gf-cycliques
  definition: |
    Le produit direct $G \times G'$ de deux [[groupe|groupes]] est leur [[produit-cartesien|produit cartésien]] muni de la loi composante par composante, $(x, x')(y, y') = (xy, x'y')$ ; c'est un groupe, de neutre $(e, e')$, où l'inverse de $(x, x')$ est $(x^{-1}, x'^{-1})$.

- id: commutateur
  terme: commutateur
  notation: '$[x, y]$'
  defini_dans: a-distingue
  definition: |
    Le commutateur de deux éléments $x$ et $y$ d'un [[groupe]] est $[x, y] = xyx^{-1}y^{-1}$ ; il vaut $e$ si et seulement si $x$ et $y$ commutent. Les commutateurs engendrent le [[groupe-derive|groupe dérivé]] ; on montre plus loin que, si $N$ est un [[sous-groupe-distingue|sous-groupe distingué]] de $G$, le quotient $G/N$ est abélien si et seulement si $N$ contient tous les commutateurs.

- id: facteurs-composition
  terme: facteurs de composition
  defini_dans: jh-composition
  definition: |
    Les facteurs de composition d'une [[suite-composition|suite de composition]] $G = G_0 \supset G_1 \supset \cdots \supset G_r = \{e\}$ sont ses facteurs, les quotients $G_{i-1}/G_i$ ; ce sont des [[groupe-simple|groupes simples]].

- id: facteurs-suite-normale
  terme: facteurs d'une suite normale
  defini_dans: jh-schreier
  definition: |
    Les facteurs d'une [[suite-normale|suite normale]] $G = G_0 \supset G_1 \supset \cdots \supset G_r = \{e\}$ sont les $r$ groupes quotients $G_{i-1}/G_i$, pour $1 \leqslant i \leqslant r$. Les inclusions n'étant pas supposées strictes, un facteur peut être trivial.

- id: raffinement-suite
  terme: raffinement d'une suite normale
  defini_dans: jh-schreier
  definition: |
    Une [[suite-normale|suite normale]] $(K_k)_{0 \leqslant k \leqslant N}$ est un raffinement de $(G_i)_{0 \leqslant i \leqslant r}$ s'il existe des indices $0 = k_0 \leqslant k_1 \leqslant \cdots \leqslant k_r = N$ tels que $K_{k_i} = G_i$ pour tout $i$ : on l'obtient en insérant des termes.

- id: suites-normales-equivalentes
  terme: suites normales équivalentes
  defini_dans: jh-schreier
  definition: |
    Deux [[suite-normale|suites normales]] $(G_i)_{0 \leqslant i \leqslant r}$ et $(H_j)_{0 \leqslant j \leqslant s}$, éventuellement de deux groupes différents, sont équivalentes si $r = s$ et s'il existe une bijection $\sigma$ de $\{1, \dots, r\}$ sur lui-même telle que $G_{i-1}/G_i$ soit isomorphe à $H_{\sigma(i)-1}/H_{\sigma(i)}$ pour tout $i$ : elles ont les mêmes facteurs, à l'ordre et à l'isomorphisme près.

- id: produit-ideaux
  terme: produit d'idéaux
  notation: '$IJ$'
  defini_dans: ac-chinois
  definition: |
    Le produit $IJ$ de deux [[ideal|idéaux]] $I$ et $J$ d'un anneau commutatif est l'idéal engendré par les produits $xy$, $x \in I$, $y \in J$, c'est-à-dire l'ensemble des sommes finies de tels produits. Il est contenu dans $I \cap J$, et ce produit des idéaux est associatif et commutatif.

- id: anneau-produit
  terme: produit d'anneaux
  defini_dans: ac-chinois
  definition: |
    Le produit $A_1 \times \cdots \times A_n$ d'anneaux est leur [[produit-cartesien|produit cartésien]] muni de l'addition et de la multiplication composante par composante ; c'est un anneau, de neutres $(0, \dots, 0)$ et $(1, \dots, 1)$.

- id: ideaux-comaximaux
  terme: idéaux comaximaux
  defini_dans: ac-chinois
  definition: |
    Deux [[ideal|idéaux]] $I$ et $J$ d'un anneau commutatif $A$ sont comaximaux si $I + J = A$, c'est-à-dire s'il existe $x \in I$ et $y \in J$ tels que $x + y = 1$. Pour des idéaux deux à deux comaximaux, le lemme chinois dit que l'intersection est le [[produit-ideaux|produit]], et que $A/(I_1 \cdots I_n)$ est isomorphe à $A/I_1 \times \cdots \times A/I_n$.

- id: contenu-factoriel
  terme: contenu d'un polynôme sur un anneau factoriel
  notation: '$c(P)$'
  defini_dans: ac-contenu
  definition: |
    Pour un [[anneau-factoriel|anneau factoriel]] $A$, le contenu $c(P)$ d'un polynôme non nul $P \in A[X]$ est un [[pgcd-anneau|PGCD]] de ses coefficients ; il est défini à un [[inversible]] près. Le polynôme $P$ est [[polynome-primitif-factoriel|primitif]] si $c(P)$ est inversible. Pour $A = \mathbb Z$, on retrouve, au signe près, le [[contenu-polynome|contenu]] du lemme de Gauss.

- id: reduction-modulo-premier
  terme: réduction modulo un élément premier
  defini_dans: ac-contenu
  definition: |
    Pour un [[element-premier|élément premier]] $p$ d'un anneau factoriel $A$, la réduction modulo $p$ est le morphisme $\pi_p : A[X] \to (A/pA)[X]$ qui remplace chaque coefficient par sa classe modulo $pA$. Pour $A = \mathbb Z$, c'est la [[reduction-modulo-p|réduction modulo p]] du lemme de Gauss.

- id: elements-associes
  terme: éléments associés
  defini_dans: ac-divisibilite
  definition: |
    Dans un [[anneau-integre|anneau intègre]] $A$, deux éléments $a$ et $b$ sont associés si chacun divise l'autre ; cela revient à $aA = bA$, ou à $b = ua$ pour un $u$ [[inversible]]. Dans $\mathbb Z$, les associés de $n$ sont $n$ et $-n$.

- id: divisibilite-anneau
  terme: divisibilité dans un anneau intègre
  notation: '$a \mid b$'
  defini_dans: ac-divisibilite
  definition: |
    Dans un [[anneau-integre|anneau intègre]] $A$, on dit que $a$ divise $b$, et l'on note $a \mid b$, s'il existe $c \in A$ tel que $b = ac$, c'est-à-dire si $bA \subset aA$. Dans $\mathbb Z$ et dans $K[X]$, on retrouve la [[divisibilite-entiers|divisibilité des entiers]] et celle des [[divisibilite-polynomes|polynômes]].

- id: partie-multiplicative
  terme: partie multiplicative
  defini_dans: ac-localisation
  definition: |
    Une partie $S$ d'un anneau commutatif $A$ est multiplicative si $1 \in S$ et si $S$ est stable par produit. C'est la donnée à partir de laquelle on forme le [[localise|localisé]] $S^{-1}A$ ; le complémentaire d'un [[ideal-premier|idéal premier]] en est une.

- id: corps-residuel
  terme: corps résiduel
  notation: '$A/\mathfrak m$'
  defini_dans: ac-locaux
  definition: |
    Le corps résiduel d'un [[anneau-local|anneau local]] $A$, dont les éléments non inversibles forment l'idéal $\mathfrak m$, est le quotient $A/\mathfrak m$ ; c'est un [[corps]], puisque $\mathfrak m$ est l'unique idéal maximal de $A$.

- id: ideal-type-fini
  terme: idéal de type fini
  defini_dans: ac-noetheriens
  definition: |
    Un [[ideal|idéal]] $I$ d'un anneau commutatif $A$ est de type fini s'il est engendré par une partie finie, c'est-à-dire s'il s'écrit $I = a_1A + \cdots + a_nA$. Un anneau dont tous les idéaux sont de type fini est [[anneau-noetherien|noethérien]].

- id: groupe-abelien-type-fini
  terme: groupe abélien de type fini
  defini_dans: md-abeliens
  definition: |
    Un [[groupe-abelien|groupe abélien]] est de type fini s'il est engendré par une partie finie, c'est-à-dire s'il est un [[module-type-fini|module de type fini]] sur $\mathbb Z$. Le groupe $\mathbb Z^r \times \mathbb Z/n \mathbb Z$ l'est, le groupe additif de $\lex{anneau-polynomes}{\mathbb Z[X]}$ ne l'est pas, puisque le sous-groupe engendré par une partie finie ne contient aucun polynôme de degré plus grand que ceux des éléments de cette partie.

- id: matrice-elementaire
  terme: matrice élémentaire
  defini_dans: md-equivalence
  definition: |
    Sur un anneau commutatif $A$, les matrices élémentaires de taille $m$ sont les [[transvection-anneau|transvections]] $I_m + cE_{ij}$, avec $i \neq j$ et $c \in A$, les [[matrice-permutation|matrices de permutation]] qui échangent deux vecteurs de la [[base-canonique|base canonique]], et les [[matrice-dilatation|dilatations]], obtenues en remplaçant un coefficient diagonal de $I_m$ par un inversible. Elles sont [[matrice-inversible|inversibles]], et la multiplication par l'une d'elles effectue une opération élémentaire sur les lignes ou les colonnes.

- id: transvection-anneau
  terme: transvection (sur un anneau)
  notation: '$I_m + cE_{ij}$'
  defini_dans: md-equivalence
  definition: |
    Sur un anneau commutatif $A$, une transvection de taille $m$ est une matrice $I_m + cE_{ij}$, avec $i \neq j$ et $c \in A$, où $E_{ij}$ a pour seul coefficient non nul un $1$ en place $(i, j)$. La multiplier à gauche ajoute à la ligne $i$ la ligne $j$ multipliée par $c$.

- id: matrice-permutation
  terme: matrice de permutation
  defini_dans: md-equivalence
  definition: |
    Pour $\sigma \in \mathfrak S_m$, la matrice de permutation $P_\sigma$ a pour $j$-ième colonne $e_{\sigma(j)}$, où $(e_1, \dots, e_m)$ est la [[base-canonique|base canonique]] ; elle est [[matrice-inversible|inversible]], d'inverse $P_{\sigma^{-1}}$, puisque $P_\sigma P_\tau e_j = P_\sigma e_{\tau(j)} = e_{\sigma(\tau(j))}$ pour toutes permutations $\sigma$ et $\tau$. Celle d'une [[transposition]] $(i\ j)$ échange deux vecteurs de la base canonique, et la multiplier à gauche échange les lignes $i$ et $j$.

- id: matrice-dilatation
  terme: matrice de dilatation
  defini_dans: md-equivalence
  definition: |
    Sur un anneau commutatif $A$, une dilatation de taille $m$ est la matrice obtenue en remplaçant un coefficient diagonal de $I_m$ par un élément [[inversible]] $u$ de $A$ ; la multiplier à gauche multiplie une ligne par $u$.

- id: matrice-bezout
  terme: matrice de Bézout
  defini_dans: md-equivalence
  definition: |
    Une matrice de Bézout de taille $m$ s'obtient à partir de $I_m$ en plaçant, aux intersections des lignes et des colonnes d'indices $i < j$, les coefficients d'une matrice $\begin{pmatrix} \alpha & \beta \\ \gamma & \delta \end{pmatrix}$ de déterminant $\alpha\delta - \beta\gamma = 1$. Elle est [[matrice-inversible|inversible]], et la multiplier à gauche remplace les lignes $L_i$ et $L_j$ par $\alpha L_i + \beta L_j$ et $\gamma L_i + \delta L_j$.

- id: stathme
  terme: stathme
  notation: '$\nu$'
  defini_dans: md-equivalence
  definition: |
    Pour un [[anneau-integre|anneau intègre]] $A$, un stathme est une application $\nu : A \setminus \{0\} \to \mathbb N$ telle que, pour tous $a \in A$ et $b \neq 0$, on puisse écrire $a = bq + r$ avec $r = 0$ ou $\nu(r) < \nu(b)$ ; l'anneau est [[anneau-euclidien|euclidien]] s'il en possède un. La [[valeur-absolue|valeur absolue]] sur $\mathbb Z$ et le degré sur $K[X]$ sont des stathmes.

- id: base-canonique
  terme: base canonique de Aⁿ
  defini_dans: md-libres
  definition: |
    Pour un anneau commutatif $A$ et $n \in \mathbb N$, la base canonique du [[module|module]] $A^n$ des colonnes est $(e_1, \dots, e_n)$, où $e_j$ a pour seule composante non nulle un $1$ en place $j$ ; elle fait de $A^n$ un [[module-libre|module libre]].

- id: element-torsion
  terme: élément de torsion
  defini_dans: md-libres
  definition: |
    Si $A$ est un [[anneau-integre|anneau intègre]] et $M$ un [[module|$A$-module]], un élément $x$ de $M$ est de torsion s'il existe $a \neq 0$ dans $A$ tel que $ax = 0$. Ces éléments forment le [[sous-module-torsion|sous-module de torsion]] $T(M)$. Dans un groupe abélien, vu comme $\mathbb Z$-module, ce sont les éléments d'ordre fini.

- id: module-sans-torsion
  terme: module sans torsion
  defini_dans: md-libres
  definition: |
    Un [[module|module]] $M$ sur un [[anneau-integre|anneau intègre]] est sans torsion si son [[sous-module-torsion|sous-module de torsion]] est nul, c'est-à-dire si $ax = 0$ avec $a \neq 0$ entraîne $x = 0$. Le $\mathbb Z$-module $\mathbb Z/2\mathbb Z$ ne l'est pas, puisque $2 \cdot \bar 1 = \bar 0$.

- id: famille-libre-module
  terme: famille libre d'un module
  defini_dans: md-libres
  definition: |
    Une famille finie $(x_1, \dots, x_n)$ d'éléments d'un [[module|$A$-module]] $M$ est libre si $\sum_i a_ix_i = 0$, avec les $a_i \in A$, entraîne que tous les $a_i$ sont nuls. C'est la définition de la [[famille-libre|famille libre]] d'un espace vectoriel, mais sur un anneau une famille peut être liée sans qu'aucun de ses éléments soit combinaison des autres : dans $\mathbb Z$, on a $3 \cdot 2 - 2 \cdot 3 = 0$, alors que ni $2$ ni $3$ n'est multiple de l'autre.

- id: annulateur-module
  terme: annulateur d'un module
  defini_dans: md-structure
  definition: |
    L'annulateur d'un [[module|$A$-module]] $M$ est l'[[ideal|idéal]] des $a \in A$ tels que $ax = 0$ pour tout $x \in M$. Pour un anneau principal $A$ et $d \in A$, l'annulateur de $A/dA$ est l'idéal $dA$.

- id: polynome-annulateur
  terme: polynôme annulateur
  defini_dans: rd-polynomes-endo
  definition: |
    Pour un [[endomorphisme]] $u$ d'un espace vectoriel $E$ de dimension finie sur $K$, un polynôme $P \in K[X]$ est annulateur de $u$ si $P(u) = 0$. Ces polynômes forment un [[ideal|idéal]] non nul de $K[X]$, engendré par le [[polynome-minimal-endomorphisme|polynôme minimal]] $\mu_u$ de $u$.

- id: indice-nilpotence
  terme: indice de nilpotence
  defini_dans: rd-nilpotents
  definition: |
    L'indice d'un [[endomorphisme-nilpotent|endomorphisme nilpotent]] $u$ est le plus petit entier $r \in \mathbb N$ tel que $u^r = 0$.

- id: endomorphisme-induit
  terme: endomorphisme induit sur un quotient
  notation: '$\bar u$'
  defini_dans: rd-stables
  definition: |
    Si $F$ est un [[sous-espace-stable|sous-espace stable]] par un [[endomorphisme]] $u$ de $E$, et $\pi : E \to E/F$ la [[application-canonique|surjection canonique]], l'endomorphisme induit par $u$ sur $E/F$ est l'application linéaire $\bar u$ définie par $\bar u(\pi(x)) = \pi(u(x))$ ; elle est bien définie, puisque $x - x' \in F$ entraîne $u(x) - u(x') \in F$.

- id: cochaine-groupe
  terme: cochaîne (cohomologie des groupes)
  notation: '$C^n(G, A)$'
  defini_dans: cg-cochaines
  definition: |
    Pour un groupe $G$ et un [[g-module|$G$-module]] $A$, une cochaîne de degré $n$ est une application $f : G^n \to A$, où $G^n$ est l'ensemble des [[n-uplet|$n$-uplets]] d'éléments de $G$ ; une cochaîne de degré $0$ s'identifie à un élément de $A$. Les cochaînes de degré $n$ forment un groupe abélien $C^n(G, A)$ pour l'addition des valeurs.

- id: differentielle-cochaines-groupe
  terme: différentielle (cohomologie des groupes)
  notation: '$d^n$'
  defini_dans: cg-cochaines
  definition: |
    La différentielle $d^n : C^n(G, A) \to C^{n+1}(G, A)$ envoie une [[cochaine-groupe|cochaîne]] $f$ de degré $n$ sur la cochaîne $(d^nf)(g_1, \dots, g_{n+1}) = g_1 f(g_2, \dots, g_{n+1}) + \sum_{i=1}^n (-1)^i f(g_1, \dots, g_ig_{i+1}, \dots, g_{n+1}) + (-1)^{n+1} f(g_1, \dots, g_n)$. C'est un morphisme de groupes ; les [[cocycle-groupe|cocycles]] sont les éléments de son noyau, les [[cobord-groupe|cobords]] ceux de l'image de $d^{n-1}$.

- id: suite-exacte-courte-g-modules
  terme: suite exacte courte (de G-modules)
  defini_dans: cg-connectant
  definition: |
    Une suite $0 \to A \xrightarrow{u} B \xrightarrow{v} C \to 0$ de [[morphisme-g-modules|morphismes de $G$-modules]] est une suite exacte courte si $u$ est injectif, $v$ surjectif, et si l'image de $u$ est le noyau de $v$ ; c'est une [[suite-exacte-groupes|suite exacte]] de groupes formée de morphismes de $G$-modules.

- id: cochaine-normalisee
  terme: cochaîne normalisée
  defini_dans: cg-extensions
  definition: |
    Une [[cochaine-groupe|cochaîne]] $c$ de degré $2$ d'un groupe $G$ à valeurs dans un $G$-module est normalisée si $c(e, h) = c(g, e) = 0$ pour tous $g, h \in G$.

- id: extension-scindee
  terme: extension scindée
  defini_dans: cg-extensions
  definition: |
    Une [[extension-groupes|extension]] $(E, i, p)$ d'un groupe $G$ par un $G$-module $A$ est scindée si $p$ a une [[section-application|section]] qui est un [[morphisme-groupes|morphisme de groupes]].

- id: extensions-equivalentes
  terme: extensions équivalentes
  defini_dans: cg-extensions
  definition: |
    Deux [[extension-groupes|extensions]] $(E, i, p)$ et $(E', i', p')$ d'un groupe $G$ par un $G$-module $A$ sont équivalentes s'il existe un morphisme $\theta : E \to E'$ tel que $\theta \circ i = i'$ et $p' \circ \theta = p$.

- id: invariants-g-module
  terme: invariants d'un G-module
  notation: '$A^G$'
  defini_dans: cg-modules
  definition: |
    Les invariants d'un [[g-module|$G$-module]] $A$ sont les éléments fixés par tout le groupe : $A^G = \{a \in A : ga = a \text{ pour tout } g \in G\}$. Ils forment un sous-groupe de $A$ ; pour un sous-groupe $H$ de $G$, on note de même $A^H$.

- id: morphisme-g-modules
  terme: morphisme de G-modules
  defini_dans: cg-modules
  definition: |
    Un morphisme de [[g-module|$G$-modules]] $u : A \to B$ est un [[morphisme-groupes|morphisme de groupes]] qui commute à l'action : $u(ga) = g\,u(a)$ pour tous $g \in G$ et $a \in A$. Son noyau et son image sont des [[sous-g-module|sous-modules]], et il envoie $A^G$ dans $B^G$.

- id: action-triviale
  terme: action triviale (G-module)
  defini_dans: cg-modules
  definition: |
    L'action d'un groupe $G$ sur un [[g-module|$G$-module]] $A$ est triviale si $ga = a$ pour tous $g \in G$ et $a \in A$ ; tout groupe abélien est ainsi un $G$-module, dont tous les éléments sont [[invariants-g-module|invariants]].

- id: element-algebrique
  terme: élément algébrique
  defini_dans: gs-algebriques
  definition: |
    Pour une [[extension-corps|extension]] $L/K$, un élément $\alpha \in L$ est algébrique sur $K$ s'il est [[racine-polynome|racine]] d'un polynôme non nul de $K[X]$. Le [[polynome-unitaire|polynôme unitaire]] qui engendre l'idéal des polynômes qui l'annulent est son [[polynome-minimal|polynôme minimal]]. Le réel $\sqrt 2$ est algébrique sur $\mathbb Q$.

- id: corps-rupture
  terme: corps de rupture
  defini_dans: gs-algebriques
  definition: |
    Pour un polynôme [[polynome-irreductible|irréductible]] $P \in K[X]$, le quotient $K[X]/(P)$ est un corps, extension de $K$ de [[degre-extension|degré]] $\deg P$, dans laquelle la classe de $X$ est une [[racine-polynome|racine]] de $P$ : c'est un corps de rupture de $P$. Il ne contient pas toujours toutes les racines de $P$ : $\mathbb Q[X]/(X^3 - 2)$ s'identifie à $\mathbb Q(\sqrt[3]2) \subset \mathbb R$, qui ne contient pas les deux racines complexes non réelles.

- id: corps-fixe
  terme: corps fixe
  notation: '$L^G$'
  defini_dans: gs-artin
  definition: |
    Pour un groupe $G$ d'automorphismes d'un [[corps]] $L$, le corps fixe est $L^G = \{x \in L : \sigma(x) = x \text{ pour tout } \sigma \in G\}$, sous-corps de $L$.

- id: extension-finie
  terme: extension finie
  defini_dans: gs-extensions
  definition: |
    Une [[extension-corps|extension]] $L/K$ est finie si son [[degre-extension|degré]] $[L : K]$, dimension de $L$ comme espace vectoriel sur $K$, est fini. L'extension $\mathbb C/\mathbb R$ est finie, de degré $2$ ; l'extension $\mathbb R/\mathbb Q$ ne l'est pas.

- id: extension-radicale
  terme: extension radicale
  defini_dans: gs-radicaux
  definition: |
    Sur un corps $K$ de caractéristique nulle, une extension $R/K$ est radicale s'il existe une tour $K = K_0 \subset K_1 \subset \cdots \subset K_r = R$ avec $K_i = K_{i-1}(\beta_i)$ et $\beta_i^{m_i} \in K_{i-1}$ pour des entiers $m_i \geqslant 1$ : on l'obtient en adjoignant successivement des racines $m_i$-ièmes.

- id: polynome-resoluble-radicaux
  terme: polynôme résoluble par radicaux
  defini_dans: gs-radicaux
  definition: |
    Sur un corps $K$ de caractéristique nulle, un polynôme $P \in K[X]$ est résoluble par radicaux si son [[corps-decomposition|corps de décomposition]] est contenu dans une [[extension-radicale|extension radicale]] de $K$.

- id: caracteristique-corps
  terme: caractéristique d'un corps
  defini_dans: gs-separabilite
  definition: |
    La caractéristique d'un [[corps]] $K$ est $0$ si le morphisme $\mathbb Z \to K$, $n \mapsto n \cdot 1$, est injectif, et sinon le générateur positif de son noyau ; c'est alors un nombre premier $p$. Le sous-corps engendré par $1$ est isomorphe à $\mathbb Q$ dans le premier cas, à $\mathbb Z/p\mathbb Z$ dans le second.

- id: racine-nieme-unite
  terme: racine n-ième de l'unité
  notation: '$\mu_n(K)$'
  defini_dans: gc-cyclotomiques
  definition: |
    Une racine $n$-ième de l'unité dans un [[corps]] $K$ est un $x \in K$ tel que $x^n = 1$. Ces racines forment un sous-groupe $\mu_n(K)$ du groupe multiplicatif $K^\times$, qui a au plus $n$ éléments ; celles d'ordre exactement $n$ sont les [[racine-unite|racines primitives]].

- id: extension-algebrique
  terme: extension algébrique
  defini_dans: gc-element-primitif
  definition: |
    Une [[extension-corps|extension]] $L/K$ est algébrique si tout élément de $L$ est [[element-algebrique|algébrique]] sur $K$.

- id: extension-simple
  terme: extension simple
  defini_dans: gc-element-primitif
  definition: |
    Une [[extension-corps|extension]] $L/K$ est simple s'il existe $\gamma \in L$ tel que $L = K(\gamma)$ ; un tel $\gamma$ est un [[element-primitif|élément primitif]] de l'extension.

- id: caractere-irreductible
  terme: caractère irréductible
  defini_dans: rp-caracteres
  definition: |
    Un caractère irréductible d'un groupe fini est le [[caractere-representation|caractère]] d'une [[representation-irreductible|représentation irréductible]].

- id: invariants-representation
  terme: invariants d'une représentation
  notation: '$V^G$'
  defini_dans: rp-invariants
  definition: |
    Pour une [[representation-groupe|représentation]] complexe $(V, \rho)$ d'un groupe fini $G$, le sous-espace des invariants est $V^G = \{x \in V : \rho(g)x = x \text{ pour tout } g \in G\}$.

- id: abelianise
  terme: abélianisé
  notation: '$G/D(G)$'
  defini_dans: a-quotient
  definition: |
    L'abélianisé d'un [[groupe]] $G$ est le [[groupe-quotient|groupe quotient]] $G^{\mathrm{ab}} = G/D(G)$ par son [[groupe-derive|groupe dérivé]], qui est distingué. C'est un groupe abélien : pour $x, y \in G$, l'élément $(yx)^{-1}xy = x^{-1}y^{-1}xy$ est un [[commutateur]], donc $xy\,D(G) = yx\,D(G)$. Le nœud {{hu-derive|Groupe dérivé}} montrera que tout morphisme de $G$ dans un groupe abélien se factorise de façon unique par la projection de $G$ sur $G^{\mathrm{ab}}$.

- id: multiplicite-representation
  terme: multiplicité d'une représentation irréductible
  defini_dans: rp-orthogonalite
  definition: |
    Si une représentation complexe $V$ d'un groupe fini s'écrit $V = W_1 \oplus \cdots \oplus W_k$ avec des sous-représentations $W_i$ irréductibles, la multiplicité d'une représentation irréductible $W$ dans $V$ est le nombre des indices $i$ tels que $W_i \cong W$. Elle vaut $\langle \chi_V, \chi_W \rangle$, et ne dépend donc pas de la décomposition.

- id: morphisme-representations
  terme: morphisme de représentations
  defini_dans: rp-representations
  definition: |
    Un morphisme d'une [[representation-groupe|représentation]] $(V, \rho)$ dans une représentation $(V', \rho')$ du même groupe est une application linéaire $f : V \to V'$ telle que $f \circ \rho(g) = \rho'(g) \circ f$ pour tout $g$. Ils forment le sous-espace $\operatorname{Hom}_G(V, V')$ de $\mathcal L(V, V')$.

- id: sous-espace-stable-representation
  terme: sous-espace stable (représentation)
  defini_dans: rp-representations
  definition: |
    Un sous-espace $W$ de l'espace d'une [[representation-groupe|représentation]] $(V, \rho)$ est stable si $\rho(g)(W) \subset W$ pour tout $g$ du groupe, c'est-à-dire s'il est stable par chacun des [[endomorphisme|endomorphismes]] $\rho(g)$.

- id: sous-representation
  terme: sous-représentation
  defini_dans: rp-representations
  definition: |
    Si $W$ est un [[sous-espace-stable-representation|sous-espace stable]] d'une représentation $(V, \rho)$, chaque $\rho(g)$ induit un élément $\rho_W(g)$ de $GL(W)$, et $(W, \rho_W)$ est une représentation, appelée sous-représentation de $V$.

- id: representation-triviale
  terme: représentation triviale
  defini_dans: rp-representations
  definition: |
    La représentation triviale d'un groupe $G$ sur un corps $K$ est $V = K$, avec $\rho(g) = \mathrm{id}$ pour tout $g \in G$. Son caractère est constant, égal à $1$.

- id: representation-permutation
  terme: représentation de permutation
  notation: '$\rho_X$'
  defini_dans: rp-representations
  definition: |
    Pour une [[action-groupe|action]] d'un groupe fini $G$ sur un ensemble fini non vide $X$, la représentation de permutation est l'unique représentation $\rho_X$ de $G$ sur l'espace $K^X$, de base $(e_x)_{x \in X}$, telle que $\rho_X(g)e_x = e_{g \cdot x}$ pour tous $g$ et $x$.

- id: engendre-algebre
  terme: engendré comme algèbre
  defini_dans: ga-lemme-zariski
  definition: |
    Soit $L$ un [[corps]] et $K$ un sous-corps de $L$. Pour $x_1, \dots, x_n \in L$, $K[x_1, \dots, x_n]$ est l'image du morphisme d'évaluation de $K[X_1, \dots, X_n]$ dans $L$ qui envoie chaque $X_i$ sur $x_i$, plus petit sous-anneau de $L$ qui contient $K$ et les $x_i$. On dit que $L$ est engendré comme $K$-algèbre par $x_1, \dots, x_n$ si $L = K[x_1, \dots, x_n]$.

- id: nilradical
  terme: nilradical
  defini_dans: ga-nilradical
  definition: |
    Le nilradical d'un anneau commutatif $A$ est le [[radical-ideal|radical]] de l'idéal $\{0\}$, c'est-à-dire l'ensemble des éléments nilpotents de $A$, ceux dont une puissance est nulle.

- id: topologie-zariski-kn
  terme: topologie de Zariski (sur Kⁿ)
  defini_dans: ga-zeros
  definition: |
    Pour un [[corps]] $K$, la topologie de Zariski de $K^n$ est celle dont les fermés sont les [[ensemble-algebrique|ensembles algébriques]] $Z(S)$, lieux des zéros communs de parties $S$ de $K[X_1, \dots, X_n]$. Le même nom désigne aussi, au nœud ga-zariski, une topologie sur le spectre d'un anneau, qui est un autre ensemble.

- id: nombre-classes
  terme: nombre de classes
  notation: '$h_K$'
  defini_dans: an-classes
  definition: |
    Le nombre de classes d'un corps quadratique $K$ est le cardinal $h_K$ de son [[groupe-classes|groupe des classes]], qui est fini ; on a $h_K = 1$ si et seulement si l'anneau des entiers de $K$ est principal.

- id: indice-ideal
  terme: indice d'un idéal
  notation: '$[\mathcal O : I]$'
  defini_dans: an-dedekind-lemmes
  definition: |
    Pour un idéal non nul $I$ de l'[[anneau-entiers|anneau des entiers]] $\mathcal O$ d'un corps quadratique, l'indice $[\mathcal O : I]$ est le nombre d'éléments, fini, de l'anneau $\mathcal O/I$.

- id: conjugue-quadratique
  terme: conjugué dans un corps quadratique
  notation: '$\bar\alpha$'
  defini_dans: an-quadratiques
  definition: |
    Soit $d \neq 0, 1$ un entier sans facteur carré et $K = \mathbb Q(\sqrt d)$. Le conjugué de $\alpha = a + b\sqrt d$, avec $a, b \in \mathbb Q$, est $\bar\alpha = a - b\sqrt d$. Pour $d < 0$, c'est le [[conjugue-complexe|conjugué complexe]] de $\alpha$. La trace de $\alpha$ est $\alpha + \bar\alpha = 2a$, et sa [[norme-algebrique|norme]] $\alpha\bar\alpha = a^2 - db^2$.

- id: non-residu-quadratique
  terme: non-résidu quadratique
  defini_dans: rq-legendre
  definition: |
    Pour un nombre premier impair $p$, un entier $a$ non divisible par $p$ est un non-résidu quadratique modulo $p$ s'il n'est pas un [[residu-quadratique|résidu quadratique]], c'est-à-dire si sa classe n'est pas un carré dans $\mathbb F_p^\times$. Modulo $5$, les non-résidus sont les entiers congrus à $2$ ou à $3$.

- id: divisibilite-entiers
  terme: divisibilité des entiers
  notation: '$a \mid b$'
  defini_dans: z-division
  definition: |
    Pour deux entiers relatifs $a$ et $b$, on dit que $a$ divise $b$, et l'on note $a \mid b$, s'il existe un entier $c$ tel que $b = ac$. Tout entier divise $0$, et $0$ ne divise que $0$. Pour $b \geqslant 1$, $b$ divise $a$ si et seulement si le reste de la [[division-euclidienne|division euclidienne]] de $a$ par $b$ est nul.

# Notions définies en gras, lexicalisées (diagnostic H, lot L3, 4 nov. 2026)

- id: partie-convexe
  terme: partie convexe
  defini_dans: tr-intervalles
  definition: |
    Pour $n \geqslant 1$, une partie $C$ de $\mathbb R^n$ est convexe si, pour tous $a, b \in C$ et tout $t \in [0, 1]$, le point $(1 - t)a + tb$, calculé coordonnée par coordonnée, appartient à $C$ : elle contient chaque segment qui joint deux de ses points. Pour $n = 1$, les parties convexes sont exactement les [[intervalle|intervalles]]. Une partie convexe est [[partie-etoilee|étoilée]] par rapport à chacun de ses points.

- id: application-affine
  terme: application affine
  defini_dans: v-applications
  definition: |
    Une application $f : E \to F$ entre deux espaces vectoriels sur un même corps est affine s'il existe une [[application-lineaire|application linéaire]] $u : E \to F$ et un vecteur $c \in F$ tels que $f(x) = u(x) + c$ pour tout $x \in E$ ; alors $c = f(0)$ et $u(x) = f(x) - f(0)$. Une application affine respecte les combinaisons de coefficients de somme $1$ : si $\sum_i t_i = 1$, alors $f\big(\sum_i t_ix_i\big) = \sum_i t_i\big(u(x_i) + c\big) = \sum_i t_if(x_i)$.

- id: partie-entiere
  terme: partie entière
  notation: '$\lfloor x \rfloor$'
  defini_dans: rr-archimede
  definition: |
    La partie entière d'un réel $x$ est l'unique entier relatif $k$ tel que $k \leqslant x < k + 1$ ; elle existe parce que $\mathbb R$ est [[archimedien|archimédien]]. Ainsi $\lfloor 5/2 \rfloor = 2$ et $\lfloor -5/2 \rfloor = -3$, et $\lfloor x + m \rfloor = \lfloor x \rfloor + m$ pour tout entier relatif $m$.

- id: classe-a-gauche
  terme: classe à gauche
  notation: '$xH$'
  defini_dans: a-distingue
  definition: |
    Pour un [[sous-groupe]] $H$ d'un [[groupe]] $G$ et $x \in G$, la classe à gauche de $x$ modulo $H$ est $xH = \{xh : h \in H\}$. C'est la classe de $x$ pour la relation d'équivalence $x \sim_H y \iff x^{-1}y \in H$, et l'ensemble de ces classes est noté $G/H$.

- id: classe-a-droite
  terme: classe à droite
  notation: '$Hx$'
  defini_dans: a-distingue
  definition: |
    Pour un [[sous-groupe]] $H$ d'un [[groupe]] $G$ et $x \in G$, la classe à droite de $x$ modulo $H$ est $Hx = \{hx : h \in H\}$. Les classes à gauche et à droite de chaque élément coïncident, $gH = Hg$ pour tout $g$, si et seulement si $H$ est [[sous-groupe-distingue|distingué]].

- id: sous-groupe-conjugue
  terme: sous-groupe conjugué
  defini_dans: a-distingue
  definition: |
    Pour un [[sous-groupe]] $H$ d'un [[groupe]] $G$ et $g \in G$, l'ensemble $gHg^{-1} = \{ghg^{-1} : h \in H\}$ est un sous-groupe de $G$, image de $H$ par le morphisme $x \mapsto gxg^{-1}$ : c'est un conjugué de $H$. Deux sous-groupes $H$ et $K$ sont conjugués s'il existe $g \in G$ tel que $K = gHg^{-1}$, ce qui équivaut à $H = g^{-1}Kg$. Un sous-groupe est [[sous-groupe-distingue|distingué]] si et seulement s'il est égal à tous ses conjugués.

- id: fibre-application
  terme: fibre d'une application
  notation: '$f^{-1}(\{b\})$'
  defini_dans: r-images
  definition: |
    Pour une [[application]] $f : A \to B$ et $b \in B$, la fibre de $f$ au-dessus de $b$ est l'[[image-reciproque|image réciproque]] $f^{-1}(\{b\}) = \{a \in A : f(a) = b\}$. Chaque élément $a$ de $A$ appartient à la fibre de $f(a)$, et à elle seule : les fibres sont deux à deux disjointes et recouvrent $A$.

- id: espaces-homeomorphes
  terme: espaces homéomorphes
  defini_dans: t-homeo
  definition: |
    Deux espaces topologiques $X$ et $Y$ sont homéomorphes s'il existe un [[homeomorphisme|homéomorphisme]] de $X$ sur $Y$, c'est-à-dire une bijection continue dont la réciproque est continue. Les propriétés qui se transportent par homéomorphisme sont dites [[propriete-topologique|topologiques]].

- id: cylindre-ouvert
  terme: cylindre ouvert
  defini_dans: t-produit
  definition: |
    Pour une famille $(X_i)_{i \in I}$ d'espaces topologiques, un cylindre ouvert du produit $\prod_i X_i$ est une partie $\prod_i U_i$ où chaque $U_i$ est un ouvert de $X_i$ et où $U_i = X_i$ sauf pour un nombre fini d'indices. Les cylindres ouverts forment une base de la [[topologie-produit|topologie produit]].

- id: morphisme-groupes-topologiques
  terme: morphisme de groupes topologiques
  defini_dans: gt-definition
  definition: |
    Un morphisme de groupes topologiques est un [[morphisme-groupes|morphisme de groupes]] continu entre deux [[groupe-topologique|groupes topologiques]]. Un isomorphisme de groupes topologiques est un morphisme bijectif dont la réciproque est continue : c'est à la fois un isomorphisme de groupes et un [[homeomorphisme|homéomorphisme]].

- id: crochet-matrices
  terme: crochet de deux matrices
  notation: '$[A, B]$'
  defini_dans: li-algebre
  definition: |
    Le crochet de deux matrices carrées réelles $A$ et $B$ de même taille est $[A, B] = AB - BA$. Il est bilinéaire et antisymétrique, $[B, A] = -[A, B]$, et il est nul si et seulement si $A$ et $B$ commutent. L'[[algebre-lie|algèbre de Lie]] d'un sous-groupe fermé du [[groupe-lineaire|groupe linéaire]] $GL_n(\mathbb R)$ est stable par crochet.

- id: lacet
  terme: lacet (topologie)
  defini_dans: ta-chemins
  definition: |
    Un lacet en un point $x$ d'un espace topologique $X$ est un [[chemin]] de $x$ à $x$, c'est-à-dire une application continue $\gamma : [0, 1] \to X$ telle que $\gamma(0) = \gamma(1) = x$.

- id: ouvert-uniformement-couvert
  terme: ouvert uniformément couvert
  defini_dans: ta-revetement
  definition: |
    Pour une application continue $p : E \to B$, un ouvert $U$ de $B$ est uniformément couvert si $p^{-1}(U)$ est la réunion d'ouverts de $E$ deux à deux disjoints, les [[feuillet|feuillets]] au-dessus de $U$, dont chacun est envoyé homéomorphiquement sur $U$ par $p$. Un [[revetement|revêtement]] est une application continue surjective dont tout point de la base a un voisinage ouvert uniformément couvert.

- id: feuillet
  terme: feuillet
  defini_dans: ta-revetement
  definition: |
    Pour un [[revetement|revêtement]] $p : E \to B$ et un ouvert $U$ de $B$ [[ouvert-uniformement-couvert|uniformément couvert]], les feuillets au-dessus de $U$ sont les ouverts deux à deux disjoints de $E$ dont $p^{-1}(U)$ est la réunion et dont chacun est envoyé homéomorphiquement sur $U$ par $p$.

- id: nombre-feuillets
  terme: nombre de feuillets
  defini_dans: rv-fibre
  definition: |
    Pour un [[revetement|revêtement]] $p : E \to B$ de base [[connexe-par-arcs|connexe par arcs]], les [[fibre-application|fibres]] $p^{-1}(b)$ sont deux à deux en bijection ; lorsqu'elles sont finies, leur nombre commun d'éléments est le nombre de feuillets du revêtement.

- id: bon-ouvert
  terme: bon ouvert
  defini_dans: rv-slsc
  definition: |
    Dans un espace topologique $X$, un bon ouvert est un ouvert $U$ [[connexe-par-arcs|connexe par arcs]] tel que tout [[lacet]] contenu dans $U$ soit [[homotopie-chemins|homotope]], dans $X$, à un lacet constant.

- id: produit-equilibre
  terme: produit équilibré de chemins
  defini_dans: vk-decoupage
  definition: |
    Pour des [[chemin|chemins]] $\gamma_1, \dots, \gamma_m$ d'un espace topologique tels que $\gamma_k(1) = \gamma_{k+1}(0)$, le produit équilibré $\gamma_1 \star \cdots \star \gamma_m$ est le chemin qui parcourt $\gamma_k$ sur l'intervalle $[\frac{k - 1}m, \frac km]$, à vitesse $m$ : $(\gamma_1 \star \cdots \star \gamma_m)(s) = \gamma_k(ms - k + 1)$ pour $s$ dans cet intervalle.

- id: factorisation-van-kampen
  terme: factorisation d'un lacet (Seifert-van Kampen)
  defini_dans: vk-factorisations
  definition: |
    Pour un espace $X = U \cup V$, réunion de deux ouverts, et un point $x_0$ de $U \cap V$, une factorisation est une suite finie $((f_1, W_1), \dots, (f_k, W_k))$, avec $k \geqslant 1$, où chaque $f_i$ est un [[lacet]] en $x_0$ contenu dans l'ouvert $W_i \in \{U, V\}$. Son lacet est le [[produit-equilibre|produit équilibré]] $f_1 \star \cdots \star f_k$, et sa valeur est le produit, dans le [[produit-amalgame|produit amalgamé]] des groupes fondamentaux de $U$ et de $V$, des images des classes des $f_i$.

- id: lettre-ensemble
  terme: lettre (sur un ensemble)
  defini_dans: vk-mots
  definition: |
    Pour un ensemble $S$, une lettre sur $S$ est un élément de $S \times \{1, -1\}$ ; on écrit $s$ pour la lettre $(s, 1)$ et $s^{-1}$ pour la lettre $(s, -1)$. L'[[inverse-lettre|inverse]] de la lettre $(s, \varepsilon)$ est $(s, -\varepsilon)$.

- id: inverse-lettre
  terme: inverse d'une lettre
  notation: '$x^{-1}$'
  defini_dans: vk-mots
  definition: |
    L'inverse de la [[lettre-ensemble|lettre]] $x = (s, \varepsilon)$ sur un ensemble $S$ est $x^{-1} = (s, -\varepsilon)$ ; on a $(x^{-1})^{-1} = x$ et $x^{-1} \neq x$.

- id: mot-ensemble
  terme: mot (sur un ensemble)
  defini_dans: vk-mots
  definition: |
    Pour un ensemble $S$ et un entier $n \geqslant 1$, un mot de longueur $n$ sur $S$ est un [[n-uplet|$n$-uplet]] $(x_1, \dots, x_n)$ de [[lettre-ensemble|lettres]] sur $S$, qu'on écrit $x_1x_2 \cdots x_n$ ; le [[mot-vide|mot vide]] est l'unique mot de longueur $0$. L'ensemble des mots sur $S$ est noté $\mathcal W(S)$.

- id: mot-vide
  terme: mot vide
  defini_dans: vk-mots
  definition: |
    Le mot vide sur un ensemble $S$, noté $1$, est l'unique [[mot-ensemble|mot]] de longueur $0$, la suite vide de lettres. Il est neutre pour la [[concatenation-mots|concaténation]].

- id: concatenation-mots
  terme: concaténation de mots
  defini_dans: vk-mots
  definition: |
    La concaténation $uv$ de deux [[mot-ensemble|mots]] $u = x_1 \cdots x_m$ et $v = y_1 \cdots y_n$ sur un ensemble $S$ est le mot $x_1 \cdots x_m y_1 \cdots y_n$, formé des lettres de $u$ suivies de celles de $v$. Elle est [[loi-associative|associative]] et admet le [[mot-vide|mot vide]] pour neutre.

- id: cycle-complexe
  terme: cycle (complexe de chaînes)
  defini_dans: h-complexes
  definition: |
    Dans un [[complexe-chaines|complexe de chaînes]] $(C_n, \partial_n)$, un cycle de degré $n$ est un élément de $Z_n = \operatorname{Ker} \partial_n$, c'est-à-dire un $c \in C_n$ tel que $\partial_n c = 0$.

- id: bord-complexe
  terme: bord (complexe de chaînes)
  defini_dans: h-complexes
  definition: |
    Dans un [[complexe-chaines|complexe de chaînes]] $(C_n, \partial_n)$, un bord de degré $n$ est un élément de $B_n = \operatorname{Im} \partial_{n+1}$, c'est-à-dire de la forme $\partial_{n+1}c$ avec $c \in C_{n+1}$. Comme $\partial_n \circ \partial_{n+1} = 0$, tout bord est un [[cycle-complexe|cycle]], et le [[groupe-homologie|groupe d'homologie]] $H_n(C) = Z_n/B_n$ est le quotient des cycles par les bords. On appelle aussi bord le morphisme $\partial_n$ du complexe, ou sa différentielle ; les bords de degré $n$, au sens des éléments, sont ceux de $B_n$.

- id: contractile
  terme: espace contractile
  defini_dans: h-homotopie
  definition: |
    Un espace topologique est contractile s'il est homotopiquement équivalent à un point, c'est-à-dire si l'application de cet espace vers un point est une [[equivalence-homotopie|équivalence d'homotopie]]. Une [[partie-etoilee|partie étoilée]] de $\mathbb R^n$ est contractile, et a l'homologie d'un point.

- id: operateur-prisme
  terme: opérateur prisme
  defini_dans: h-homotopie
  definition: |
    Pour une application continue $F : X \times [0, 1] \to Y$, l'opérateur prisme associe à un [[simplexe-singulier|simplexe singulier]] $\sigma : \Delta_n \to X$ la chaîne $P\sigma = \sum_{i=0}^n (-1)^i\, F \circ (\sigma \times \mathrm{id}) \circ [v_0, \dots, v_i, w_i, \dots, w_n]$ de $C_{n+1}(Y)$, où $v_i = (e_i, 0)$ et $w_i = (e_i, 1)$ sont les sommets du prisme $\Delta_n \times [0, 1]$. C'est par lui que deux applications homotopes induisent les mêmes morphismes en homologie.

- id: simplexe-standard
  terme: simplexe standard
  notation: '$\Delta_n$'
  defini_dans: h-singuliere
  definition: |
    Le simplexe standard $\Delta_n$ est l'ensemble des $t = (t_0, \dots, t_n)$ de $\mathbb R^{n+1}$ tels que $t_i \geqslant 0$ pour tout $i$ et $\sum_i t_i = 1$, muni de la topologie induite par la [[topologie-produit|topologie produit]] ; ses sommets sont les vecteurs de base $e_0, \dots, e_n$. Ainsi $\Delta_0$ est un point, $\Delta_1$ un segment et $\Delta_2$ un triangle.

- id: face-simplexe
  terme: face du simplexe standard
  notation: '$\delta_i$'
  defini_dans: h-singuliere
  definition: |
    Pour $n \geqslant 1$ et $0 \leqslant i \leqslant n$, la $i$-ième face du [[simplexe-standard|simplexe standard]] est l'application $\delta_i : \Delta_{n-1} \to \Delta_n$ qui insère un $0$ en position $i$ : $\delta_i(t_0, \dots, t_{n-1}) = (t_0, \dots, t_{i-1}, 0, t_i, \dots, t_{n-1})$. Son image est la face de $\Delta_n$ opposée au sommet $e_i$, et, pour un [[simplexe-singulier|simplexe singulier]] $\sigma$, $\sigma \circ \delta_i$ est la $i$-ième face de $\sigma$.

- id: bord-singulier
  terme: bord (chaînes singulières)
  defini_dans: h-singuliere
  definition: |
    Le bord d'un [[simplexe-singulier|simplexe singulier]] $\sigma : \Delta_n \to X$, $n \geqslant 1$, est la chaîne $\partial\sigma = \sum_{i=0}^n (-1)^i\, \sigma \circ \delta_i$, somme alternée de ses [[face-simplexe|faces]] ; il se prolonge en un morphisme $\partial : C_n(X) \to C_{n-1}(X)$ des [[groupe-abelien-libre|groupes abéliens libres]] de chaînes, nul en degré $0$, et $\partial \circ \partial = 0$.

- id: simplexe-affine
  terme: simplexe affine
  notation: '$[w_0, \dots, w_n]$'
  defini_dans: h-subdivision
  definition: |
    Pour des points $w_0, \dots, w_n$ d'une partie [[partie-convexe|convexe]] $Y$ de $\mathbb R^m$, le simplexe affine $[w_0, \dots, w_n] : \Delta_n \to Y$ est l'application continue $t \mapsto \sum_i t_iw_i$. Il envoie le sommet $e_i$ du [[simplexe-standard|simplexe standard]] sur $w_i$, et ses faces s'obtiennent en omettant un sommet : $[w_0, \dots, w_n] \circ \delta_i = [w_0, \dots, \widehat{w_i}, \dots, w_n]$.

- id: cone-lineaire
  terme: cône (chaînes linéaires)
  defini_dans: h-subdivision
  definition: |
    Pour une partie [[partie-convexe|convexe]] $Y$ de $\mathbb R^m$ et un point $b$ de $Y$, le cône de sommet $b$ est le morphisme du groupe des chaînes linéaires de degré $n$ dans celui de degré $n + 1$ qui envoie chaque [[simplexe-affine|simplexe affine]] $[w_0, \dots, w_n]$ sur $[b, w_0, \dots, w_n]$, et le symbole $[\varnothing]$ de degré $-1$ sur $[b]$. Il vérifie $\partial(b \cdot \alpha) = \alpha - b \cdot \partial\alpha$.

- id: application-caracteristique-cellule
  terme: application caractéristique (cellule)
  defini_dans: cw-complexes
  definition: |
    Lorsqu'un espace séparé $X$ s'obtient à partir d'une partie fermée $Y$ par [[attachement-cellules|attachement de cellules]] de dimension $n$, les applications continues $\Phi_j : D^n \to X$ de la définition, injectives sur la boule ouverte $B^n$, telles que $\Phi_j(S^{n-1}) \subset Y$ et que $X \setminus Y$ soit la réunion disjointe des [[cellule|cellules]] $\Phi_j(B^n)$, sont les applications caractéristiques ; leurs restrictions à $S^{n-1}$ sont les [[application-attachement|applications d'attachement]].

- id: application-attachement
  terme: application d'attachement
  defini_dans: cw-complexes
  definition: |
    Dans un attachement de cellules de dimension $n$ à une partie fermée $Y$, l'application d'attachement d'une cellule est la restriction $\varphi_j = \Phi_j|_{S^{n-1}} : S^{n-1} \to Y$ de son [[application-caracteristique-cellule|application caractéristique]] $\Phi_j : D^n \to X$ : elle dit sur quels points de $Y$ le bord de la boule est recollé.

- id: paire-espaces
  terme: paire d'espaces
  defini_dans: cw-relative
  definition: |
    Une paire $(X, A)$ est formée d'un espace topologique $X$ et d'une partie $A$ de $X$, munie de la topologie induite.

- id: application-paires
  terme: application de paires
  defini_dans: cw-relative
  definition: |
    Une application de paires $f : (X, A) \to (Y, B)$ entre deux [[paire-espaces|paires]] est une application continue $f : X \to Y$ telle que $f(A) \subset B$.

- id: cycle-relatif
  terme: cycle relatif
  defini_dans: cw-relative
  definition: |
    Pour une [[paire-espaces|paire]] $(X, A)$, un cycle relatif de degré $n$ est une chaîne singulière $c \in C_n(X)$ dont le [[bord-singulier|bord]] est une chaîne de $A$. Sa classe dans $C_n(X)/C_n(A)$ est un cycle du complexe des chaînes relatives, et tout élément de l'[[homologie-relative|homologie relative]] $H_n(X, A)$ est la classe d'un cycle relatif.

- id: cobord-complexe
  terme: cobord (complexe de cochaînes)
  defini_dans: cs-cochaines
  definition: |
    Dans un [[complexe-cochaines|complexe de cochaînes]] $(K^n, \delta^n)$, les cobords sont les morphismes $\delta^n : K^n \to K^{n+1}$, qui vérifient $\delta^{n+1} \circ \delta^n = 0$ ; on appelle aussi cobords de degré $n$ les éléments de $B^n = \operatorname{Im} \delta^{n-1}$, c'est-à-dire les $\delta^{n-1}y$, $y \in K^{n-1}$. Tout cobord de degré $n$ est un [[cocycle-complexe|cocycle]].

- id: cocycle-complexe
  terme: cocycle (complexe de cochaînes)
  defini_dans: cs-cochaines
  definition: |
    Dans un [[complexe-cochaines|complexe de cochaînes]] $(K^n, \delta^n)$, un cocycle de degré $n$ est un élément de $Z^n = \operatorname{Ker} \delta^n$, c'est-à-dire un $x \in K^n$ tel que $\delta^n x = 0$.

- id: cohomologie-complexe
  terme: cohomologie d'un complexe de cochaînes
  notation: '$H^n(K)$'
  defini_dans: cs-cochaines
  definition: |
    La cohomologie d'un [[complexe-cochaines|complexe de cochaînes]] $K$ est la suite des groupes $H^n(K) = Z^n/B^n$, quotients des [[cocycle-complexe|cocycles]] de degré $n$ par les [[cobord-complexe|cobords]] de degré $n$, qu'ils contiennent puisque $\delta^n \circ \delta^{n-1} = 0$.

- id: complexe-dual
  terme: complexe dual
  defini_dans: cs-cochaines
  definition: |
    Le complexe dual d'un [[complexe-chaines|complexe de chaînes]] $C$ à coefficients dans un [[groupe-abelien|groupe abélien]] $G$ est le [[complexe-cochaines|complexe de cochaînes]] $\operatorname{Hom}(C, G)$, de terme $\operatorname{Hom}(C_n, G)$ en degré $n$ et de cobord $\delta^n = \partial_{n+1}^*$, c'est-à-dire $(\delta\varphi)(c) = \varphi(\partial c)$ ; sa cohomologie est notée $H^n(C; G)$.

- id: support-element-libre
  terme: support d'un élément d'un groupe abélien libre
  defini_dans: cs-division
  definition: |
    Pour un ensemble $I$ et un élément $x$ du [[groupe-abelien-libre|groupe abélien libre]] $\mathbb Z^{(I)}$, de coordonnées $x(i)$, le support de $x$ est l'ensemble des $i \in I$ tels que $x(i) \neq 0$ ; il est fini.

- id: hauteur-element-libre
  terme: hauteur d'un élément d'un groupe abélien libre
  notation: '$\operatorname{ht}(x)$'
  defini_dans: cs-division
  definition: |
    Pour un ensemble $I$ muni d'un [[bon-ordre|bon ordre]] et un élément non nul $x$ du [[groupe-abelien-libre|groupe abélien libre]] $\mathbb Z^{(I)}$, la hauteur $\operatorname{ht}(x)$ est le plus grand élément du [[support-element-libre|support]] de $x$, partie finie non vide de $I$.

- id: pivot-sous-groupe
  terme: pivot d'un sous-groupe d'un groupe abélien libre
  defini_dans: cs-division
  definition: |
    Soit $I$ un ensemble muni d'un [[bon-ordre|bon ordre]], $F = \mathbb Z^{(I)}$ et $H$ un sous-groupe de $F$. Pour $i \in I$, les coordonnées en $i$ des éléments de $H$ nuls au-delà de $i$ forment un sous-groupe $n_i\mathbb Z$ de $\mathbb Z$, avec $n_i \in \mathbb N$ ; les pivots de $H$ sont les indices $i$ tels que $n_i > 0$.

- id: element-reduit
  terme: élément réduit sous un indice
  defini_dans: cs-division
  definition: |
    Avec les notations de l'entrée [[pivot-sous-groupe|pivot]], un élément $x$ de $\mathbb Z^{(I)}$ est réduit sous un indice $i$ si $0 \leqslant x(j) < n_j$ pour tout pivot $j < i$ de $H$ ; aucune condition ne porte sur les coordonnées qui ne sont pas des pivots.

- id: presentation-projective
  terme: présentation projective
  defini_dans: cs-ext
  definition: |
    Une présentation projective d'un [[groupe-abelien|groupe abélien]] $A$ est une [[suite-exacte|suite exacte]] courte $0 \to R \to P \to A \to 0$ de groupes abéliens où $P$ est [[groupe-projectif|projectif]]. Le groupe $\operatorname{Ext}(A, G)$ se calcule sur l'une quelconque d'entre elles.

- id: relevement-morphisme
  terme: relèvement d'un morphisme
  defini_dans: cs-projectifs
  definition: |
    Pour un morphisme surjectif $p : M \to N$ de groupes abéliens et un morphisme $u : P \to N$, un relèvement de $u$ le long de $p$ est un morphisme $v : P \to M$ tel que $p \circ v = u$ ; on dit que $v$ relève $u$. Un groupe abélien est [[groupe-projectif|projectif]] si tout morphisme défini sur lui se relève le long de toute surjection.

- id: retracte-groupe
  terme: rétracte d'un groupe abélien
  defini_dans: cs-projectifs
  definition: |
    Un groupe abélien $Q$ est un rétracte d'un groupe abélien $P$ s'il existe des morphismes $s : Q \to P$ et $r : P \to Q$ tels que $r \circ s = \mathrm{id}_Q$ ; alors $s$ est injectif et $r$ surjectif. Un rétracte d'un groupe [[groupe-projectif|projectif]] est projectif.

- id: section-morphisme
  terme: section d'un morphisme surjectif
  defini_dans: cs-projectifs
  definition: |
    Une section d'un morphisme surjectif $p : M \to P$ de groupes abéliens est un morphisme $s : P \to M$ tel que $p \circ s = \mathrm{id}_P$, c'est-à-dire une [[section-application|section]] de $p$ qui est un morphisme. Lorsque $P$ est [[groupe-projectif|projectif]], toute surjection sur $P$ en a une, et son noyau est un [[retracte-groupe|rétracte]] de $M$.

- id: cochaine-singuliere
  terme: cochaîne singulière
  notation: '$C^n(X; G)$'
  defini_dans: cs-singuliere
  definition: |
    Pour un espace topologique $X$ et un [[groupe-abelien|groupe abélien]] $G$, une cochaîne singulière de degré $n \geqslant 0$ est un élément de $C^n(X; G) = \operatorname{Hom}(C_n(X), G)$, c'est-à-dire, par la propriété universelle des [[groupe-abelien-libre|groupes abéliens libres]], une application quelconque de l'ensemble des [[simplexe-singulier|simplexes singuliers]] de dimension $n$ de $X$ dans $G$ ; on pose $C^n(X; G) = 0$ pour $n < 0$.

- id: element-homogene
  terme: élément homogène (anneau de cohomologie)
  defini_dans: cup-anneau
  definition: |
    Un élément de l'[[anneau-cohomologie|anneau de cohomologie]] $H^*(X; R) = \bigoplus_k H^k(X; R)$ est homogène de degré $k$ s'il provient de $H^k(X; R)$, c'est-à-dire si tous ses termes d'indice différent de $k$ sont nuls.

- id: face-avant
  terme: face avant d'un simplexe
  defini_dans: cup-produit
  definition: |
    Pour un [[simplexe-singulier|simplexe singulier]] $\sigma$ de dimension $k + l$, la face avant de dimension $k$ est $\sigma|[0, \dots, k]$, composée de $\sigma$ et du [[simplexe-affine|simplexe affine]] $[e_0, \dots, e_k]$ ; la [[face-arriere|face arrière]] de dimension $l$ est $\sigma|[k, \dots, k + l]$. Elles ont en commun le seul sommet d'indice $k$, et le [[produit-cup|produit cup]] évalue son premier facteur sur la première, son second sur la seconde.

- id: face-arriere
  terme: face arrière d'un simplexe
  defini_dans: cup-produit
  definition: |
    Pour un [[simplexe-singulier|simplexe singulier]] $\sigma$ de dimension $k + l$, la face arrière de dimension $l$ est $\sigma|[k, \dots, k + l]$, composée de $\sigma$ et du [[simplexe-affine|simplexe affine]] $[e_k, \dots, e_{k+l}]$ ; elle partage avec la [[face-avant|face avant]] $\sigma|[0, \dots, k]$ le seul sommet d'indice $k$.

- id: augmentation-singuliere
  terme: augmentation (chaînes singulières)
  notation: '$\varepsilon$'
  defini_dans: hj-reduite
  definition: |
    L'augmentation d'un espace topologique $X$ est le morphisme $\varepsilon : C_0(X) \to \mathbb Z$ qui envoie chaque point de $X$, simplexe singulier de dimension $0$, sur $1$ : $\varepsilon\big(\sum_x n_x x\big) = \sum_x n_x$. Elle est nulle sur les bords, puisque le bord d'un simplexe de dimension $1$ est la différence de ses deux extrémités.

- id: complexe-augmente-espace
  terme: complexe augmenté (d'un espace)
  notation: '$\tilde C(X)$'
  defini_dans: hj-reduite
  definition: |
    Le complexe augmenté $\tilde C(X)$ d'un espace topologique $X$ est le complexe des chaînes singulières prolongé par $\tilde C_{-1}(X) = \mathbb Z$ et $\tilde C_n(X) = 0$ pour $n \leqslant -2$, le [[bord-complexe|bord]] de degré $0$ étant l'[[augmentation-singuliere|augmentation]] ; son homologie est l'[[homologie-reduite|homologie réduite]] de $X$.

- id: module-libre-ensemble
  terme: module libre sur un ensemble
  notation: '$R^{(S)}$'
  defini_dans: ku-tenseur
  definition: |
    Pour un [[anneau-commutatif|anneau commutatif]] $R$ et un ensemble $S$, le module libre $R^{(S)}$ est l'ensemble des applications de $S$ dans $R$ nulles hors d'une partie finie, muni des lois point par point ; on identifie $s \in S$ à l'application qui vaut $1$ en $s$ et $0$ ailleurs. Toute application de $S$ dans un [[module|$R$-module]] $M$ se prolonge en une unique application linéaire de $R^{(S)}$ dans $M$. Pour $R = \mathbb Z$, c'est le [[groupe-abelien-libre|groupe abélien libre]] sur $S$.

- id: application-bilineaire-modules
  terme: application bilinéaire (modules)
  defini_dans: ku-tenseur
  definition: |
    Pour des [[module|modules]] $M$, $N$ et $P$ sur un [[anneau-commutatif|anneau commutatif]] $R$, une application $\beta : M \times N \to P$ est bilinéaire si elle est linéaire en chaque variable : pour tout $y \in N$, $x \mapsto \beta(x, y)$ est [[application-a-lineaire|$R$-linéaire]], et pour tout $x \in M$, $y \mapsto \beta(x, y)$ l'est aussi.

- id: complexe-modules
  terme: complexe de modules
  defini_dans: ku-tenseur
  definition: |
    Un complexe de modules sur un [[anneau-commutatif|anneau commutatif]] $R$ est un [[complexe-chaines|complexe de chaînes]] dont les termes sont des [[module|$R$-modules]] et les [[bord-complexe|bords]] des applications [[application-a-lineaire|$R$-linéaires]] ; ses groupes d'homologie sont alors des $R$-modules.

- id: regle-signes
  terme: règle des signes (produit de complexes)
  defini_dans: ku-complexes
  definition: |
    Le [[bord-complexe|bord]] du [[produit-tensoriel|produit tensoriel]] $C \otimes D$ de deux complexes de modules est donné, pour $c \in C_i$ et $d \in D_j$, par la règle des signes $\partial(c \otimes d) = \partial c \otimes d + (-1)^i\, c \otimes \partial d$ ; le signe $(-1)^i$ assure $\partial \circ \partial = 0$, les deux termes croisés de $\partial\partial(c \otimes d)$ se compensant.

- id: produit-croise-complexes
  terme: produit croisé (complexes)
  defini_dans: ku-complexes
  definition: |
    Pour deux [[complexe-modules|complexes de modules]] $C$ et $D$ sur un anneau commutatif, le produit croisé est l'application linéaire $\times : H_i(C) \otimes H_j(D) \to H_{i+j}(C \otimes D)$ qui envoie $[z] \otimes [w]$ sur $[z \otimes w]$ ; elle est bien définie parce que $z \otimes w$ est un cycle dont la classe ne dépend que de $[z]$ et de $[w]$, et elle est naturelle : $(f \otimes g)_* \circ \times = \times \circ (f_* \otimes g_*)$ pour des morphismes de complexes $f$ et $g$.

- id: produit-croise-homologie
  terme: produit croisé (homologie)
  notation: '$x \times y$'
  defini_dans: ku-homologie
  definition: |
    Pour des espaces topologiques $X$ et $Y$ et un anneau commutatif $R$, le produit croisé homologique $H_i(X; R) \otimes_R H_j(Y; R) \to H_{i+j}(X \times Y; R)$ est la composée du [[produit-croise-complexes|produit croisé]] des complexes $C(X; R)$ et $C(Y; R)$ et de l'isomorphisme d'Eilenberg-Zilber ; on note $x \times y$ l'image de $x \otimes y$.

- id: complexe-augmente
  terme: complexe augmenté (par un morphisme)
  defini_dans: ku-cone
  definition: |
    Un complexe $C$ de [[groupe-abelien|groupes abéliens]], nul en degré négatif, est augmenté par un morphisme $\varepsilon : C_0 \to \mathbb Z$, son augmentation, si $\varepsilon \circ \partial_1 = 0$. C'est la donnée qui permet de parler d'une [[contraction-complexe|contraction]] de $C$.

- id: cone-singulier
  terme: cône d'un simplexe singulier
  notation: '$b \cdot \sigma$'
  defini_dans: ku-cone
  definition: |
    Pour une partie [[partie-convexe|convexe]] $Q$ de $\mathbb R^m$, un point $b \in Q$ et un [[simplexe-singulier|simplexe singulier]] $\sigma : \Delta_n \to Q$, le cône $b \cdot \sigma : \Delta_{n+1} \to Q$ est défini par $(b \cdot \sigma)(e_0) = b$ et, pour $t_0 < 1$, $(b \cdot \sigma)(t) = t_0\, b + (1 - t_0)\,\sigma(s(t))$, où $s(t) = \frac{1}{1 - t_0}(t_1, \dots, t_{n+1})$ ; il joint $b$ à chaque point de l'image de $\sigma$ par un segment.

- id: transformation-naturelle
  terme: transformation naturelle (foncteurs de chaînes)
  defini_dans: ku-modeles
  definition: |
    Un foncteur de chaînes $T$ associe à chaque couple $(X, Y)$ d'espaces topologiques un complexe augmenté $T(X, Y)$ et à chaque couple $(f, g)$ d'applications continues un [[morphisme-complexes|morphisme de complexes]] $T(f, g)$, en respectant identités et composées. Une transformation naturelle $\Phi : T \to T'$ entre deux tels foncteurs est une famille de morphismes de complexes $\Phi_{X,Y} : T(X, Y) \to T'(X, Y)$ telle que $\Phi \circ T(f, g) = T'(f, g) \circ \Phi$ pour tout $(f, g)$.

- id: homotopie-naturelle
  terme: homotopie naturelle
  defini_dans: ku-modeles
  definition: |
    Pour deux foncteurs de chaînes $T$ et $T'$, une homotopie naturelle est une famille de morphismes $D_n : T_n(X, Y) \to T'_{n+1}(X, Y)$, un par couple d'espaces et par degré, qui commutent aux $T(f, g)$ et aux $T'(f, g)$ comme une [[transformation-naturelle|transformation naturelle]] : $D \circ T(f, g) = T'(f, g) \circ D$. Deux transformations naturelles $\Phi, \Phi' : T \to T'$ sont naturellement homotopes s'il existe une homotopie naturelle $D$ telle que $\partial D + D\partial = \Phi' - \Phi$.

- id: acyclique-modeles
  terme: acyclique sur les modèles
  defini_dans: ku-modeles
  definition: |
    Un foncteur de chaînes $T$ est acyclique sur les modèles si chacun des complexes $T(\Delta_p, \Delta_q)$, pour les couples de [[simplexe-standard|simplexes standard]], est muni d'une [[contraction-complexe|contraction]]. Avec la liberté sur les modèles, c'est l'hypothèse de la méthode des [[modeles-acycliques|modèles acycliques]].

- id: pave
  terme: pavé (intégrales itérées)
  defini_dans: dr-iterees
  definition: |
    Un pavé de $\mathbb R^n$, $n \geqslant 1$, est un produit $P = \prod_{i=1}^n [a_i, b_i]$ de segments, avec $a_i < b_i$ ; son volume est $v(P) = \prod_i (b_i - a_i)$. Par convention, $\mathbb R^0$ est réduit à un point, ainsi que tout pavé de $\mathbb R^0$.

- id: cube-unite
  terme: cube unité
  notation: '$I^n$'
  defini_dans: dr-iterees
  definition: |
    Le cube unité de dimension $n$ est le [[pave|pavé]] $I^n = [0, 1]^n$ de $\mathbb R^n$ ; par convention, $I^0$ est le point de $\mathbb R^0$.

- id: integrale-iteree
  terme: intégrale itérée (sur un pavé)
  defini_dans: dr-iterees
  definition: |
    Pour une fonction réelle continue $g$ sur un [[pave|pavé]] $P = \prod_{i=1}^n [a_i, b_i]$, l'intégrale itérée $\int_P g$ est le nombre obtenu en intégrant successivement, au sens de Riemann, par rapport à $x_1$, puis à $x_2$, et ainsi de suite jusqu'à $x_n$, chaque étape produisant une fonction continue des variables restantes. Elle est linéaire et croissante en $g$, et $\int_P 1$ est le volume de $P$ ; on montre ensuite que l'ordre des intégrations est indifférent.

- id: cube-degenere
  terme: cube dégénéré
  defini_dans: dr-integrale-cubes
  definition: |
    Un [[cube-singulier|cube singulier lisse]] $c : I^k \to U$ est dégénéré s'il ne dépend pas de l'une des variables $t_i$ sur $I^k$. L'intégrale d'une forme de degré $k$ sur un cube dégénéré est nulle.

- id: chaine-cubique
  terme: chaîne cubique
  notation: '$Q_k(U)$'
  defini_dans: dr-cubes
  definition: |
    Pour un ouvert $U$ de $\mathbb R^n$, le groupe $Q_k(U)$ des chaînes cubiques de dimension $k$ est le [[groupe-abelien-libre|groupe abélien libre]] sur l'ensemble des [[cube-singulier|cubes singuliers lisses]] de dimension $k$ de $U$ ; on pose $Q_k(U) = 0$ pour $k < 0$.

- id: face-cube
  terme: face d'un cube singulier
  notation: '$c_{i,\varepsilon}$'
  defini_dans: dr-cubes
  definition: |
    Pour un [[cube-singulier|cube singulier lisse]] $c : I^k \to U$ de dimension $k \geqslant 1$, un indice $1 \leqslant i \leqslant k$ et $\varepsilon \in \{0, 1\}$, la face $(i, \varepsilon)$ de $c$ est le cube $c_{i,\varepsilon} = c \circ \iota_{i,\varepsilon}$ de dimension $k - 1$, où $\iota_{i,\varepsilon}(t_1, \dots, t_{k-1}) = (t_1, \dots, t_{i-1}, \varepsilon, t_i, \dots, t_{k-1})$ : on fixe la $i$-ième variable à $\varepsilon$.

- id: bord-cubique
  terme: bord (chaînes cubiques)
  defini_dans: dr-cubes
  definition: |
    Le bord d'un [[cube-singulier|cube singulier lisse]] $c$ de dimension $k \geqslant 1$ est la chaîne $\partial c = \sum_{i=1}^k \sum_{\varepsilon=0}^1 (-1)^{i+\varepsilon} c_{i,\varepsilon}$, somme alternée de ses $2k$ [[face-cube|faces]] ; il se prolonge en un morphisme $\partial : Q_k(U) \to Q_{k-1}(U)$ des [[chaine-cubique|chaînes cubiques]], nul sur $Q_0(U)$.

- id: primitive-forme
  terme: primitive d'une forme de degré 1
  defini_dans: dr-primitives
  definition: |
    Pour une forme différentielle $\omega$ de degré $1$ sur un ouvert $U$ de $\mathbb R^n$ et un ouvert $V \subset U$, une primitive de $\omega$ sur $V$ est une fonction $f$ de classe $C^\infty$ sur $V$ telle que $df = \omega$ sur $V$. Une forme qui a une primitive sur $U$ tout entier est [[forme-exacte|exacte]].

- id: suite-mayer-vietoris-formes
  terme: suite de Mayer-Vietoris (formes)
  defini_dans: dc-mayer-vietoris
  definition: |
    Pour deux ouverts $U$ et $V$ de $\mathbb R^n$ et $X = U \cup V$, la suite de Mayer-Vietoris des formes est la [[suite-exacte|suite exacte]] longue de [[cohomologie-de-rham|cohomologie de de Rham]] $0 \to H^0(X) \to H^0(U) \oplus H^0(V) \to H^0(U \cap V) \to H^1(X) \to \cdots$, dont les deux premières flèches de chaque degré sont induites par les restrictions et la différence des restrictions, et la troisième, $\delta : H^k(U \cap V) \to H^{k+1}(X)$, est le morphisme de connexion de la suite exacte courte des complexes de formes $0 \to \Omega(X) \to \Omega(U) \oplus \Omega(V) \to \Omega(U \cap V) \to 0$.

- id: nulle-pres
  terme: fonction nulle près d'une partie
  defini_dans: dc-partition
  definition: |
    Une fonction $\chi$ sur un espace topologique $X$ est nulle près d'une partie $P$ de $X$ si tout point de $P$ a un voisinage ouvert dans $X$ sur lequel $\chi$ est nulle ; c'est plus fort qu'être nulle sur $P$.

- id: famille-compatible
  terme: famille compatible de classes
  defini_dans: pc-limite
  definition: |
    Pour une suite croissante d'ouverts $U_0 \subset U_1 \subset \cdots$ de $\mathbb R^n$, une famille compatible de classes de degré $k$ est une suite $(c_m)$, avec $c_m \in H^k(U_m)$ en [[cohomologie-de-rham|cohomologie de de Rham]], telle que la restriction de $c_{m+1}$ à $U_m$ soit $c_m$ pour tout $m$.

- id: extension-par-zero
  terme: extension par zéro
  notation: '$j_*\eta$'
  defini_dans: pc-support
  definition: |
    Pour un ouvert $V$ d'un ouvert $U$ de $\mathbb R^n$ et une forme $\eta$ de degré $k$ sur $V$ à [[support-forme|support]] compact, l'extension par zéro $j_*\eta$ est la forme sur $U$ égale à $\eta$ sur $V$ et à $0$ hors de $V$.

- id: cochaine-cech
  terme: cochaîne de Čech
  notation: '$\check C^p$'
  defini_dans: dt-cech-de-rham
  definition: |
    Pour le recouvrement d'un ouvert de $\mathbb R^n$ par des cubes $B_i$, $i \in I$, une cochaîne de Čech de degré $p$ est une fonction réelle sur l'ensemble $N_p$ des suites $\sigma = (i_0, \dots, i_p)$ d'indices telles que $B_{i_0} \cap \cdots \cap B_{i_p}$ soit non vide, le [[nerf-recouvrement|nerf]] du recouvrement ; le cobord est $(\delta c)(\sigma) = \sum_{l=0}^{p+1} (-1)^l c(\sigma^{(l)})$, où $\sigma^{(l)}$ est la suite $\sigma$ privée de son terme d'indice $l$.

- id: cohomologie-singuliere-lisse
  terme: cohomologie singulière lisse
  notation: '$H^k_\infty(U)$'
  defini_dans: dt-cochaines
  definition: |
    Pour un ouvert $U$ de $\mathbb R^n$, la cohomologie singulière lisse $H^k_\infty(U)$ est la cohomologie du complexe des fonctions réelles sur l'ensemble des [[simplexe-lisse|simplexes singuliers lisses]] de dimension $k$ de $U$, de cobord $\delta f = f \circ \partial$.

- id: integration-cochaines
  terme: morphisme d'intégration
  defini_dans: dt-cochaines
  definition: |
    Pour un ouvert $U$ de $\mathbb R^n$, l'intégration est l'application linéaire $I : \Omega^k(U) \to C^k(U)$ qui associe à une forme $\omega$ de degré $k$ la cochaîne lisse $\sigma \mapsto \int_\sigma \omega$. C'est un [[morphisme-complexes|morphisme de complexes]], $I(d\omega) = \delta I(\omega)$, d'où des applications linéaires de la [[cohomologie-de-rham|cohomologie de de Rham]] vers la [[cohomologie-singuliere-lisse|cohomologie singulière lisse]].

- id: complexe-total
  terme: complexe total
  notation: '$\operatorname{Tot}^n K$'
  defini_dans: dt-complexe-double
  definition: |
    Le complexe total d'un [[complexe-double|complexe double]] $(K^{p,q}, \delta, d)$ est formé des espaces $\operatorname{Tot}^n K = \bigoplus_{p+q=n} K^{p,q}$, munis de la différentielle $D$ égale à $\delta + (-1)^p d$ sur $K^{p,q}$ ; le signe assure $D \circ D = 0$, puisque $\delta d = d\delta$.

- id: variete-produit
  terme: structure produit (variétés)
  defini_dans: gd-exemples-varietes
  definition: |
    Pour des [[variete-differentiable|variétés]] $M$ et $N$ de dimensions $m$ et $n$, la structure produit fait de $M \times N$, muni de la [[topologie-produit|topologie produit]], une variété de dimension $m + n$ : c'est la structure définie par l'[[atlas]] des cartes $(U \times V, \varphi \times \psi)$, où $(U, \varphi)$ et $(V, \psi)$ sont des [[carte|cartes]] de $M$ et de $N$.

- id: differentielle-exterieure
  terme: différentielle extérieure
  notation: '$d\omega$'
  defini_dans: gd-formes
  definition: |
    Sur un ouvert de $\mathbb R^n$, la différentielle extérieure associe à une [[forme-differentielle|forme différentielle]] $\omega = \sum_I a_I\, dx_I$ de degré $k$ la forme $d\omega = \sum_I da_I \wedge dx_I$ de degré $k + 1$, où $da = \sum_j \partial_j a\, dx_j$ est la différentielle d'une fonction. Elle est linéaire, vérifie $d \circ d = 0$ et commute aux images réciproques.

- id: forme-fermee
  terme: forme fermée
  defini_dans: gd-formes
  definition: |
    Une [[forme-differentielle|forme différentielle]] $\omega$ sur un ouvert de $\mathbb R^n$ est fermée si sa [[differentielle-exterieure|différentielle extérieure]] est nulle, $d\omega = 0$. Toute forme [[forme-exacte|exacte]] est fermée, puisque $d \circ d = 0$.

- id: forme-exacte
  terme: forme exacte
  defini_dans: gd-formes
  definition: |
    Une [[forme-differentielle|forme différentielle]] $\omega$ de degré $k \geqslant 1$ sur un ouvert de $\mathbb R^n$ est exacte s'il existe une forme $\eta$ de degré $k - 1$ telle que $\omega = d\eta$ ; en degré $1$, cela signifie $\omega = df$ pour une fonction $f$. Une forme exacte est [[forme-fermee|fermée]].

- id: meme-orientation
  terme: même orientation (bases)
  defini_dans: gd-orientation
  definition: |
    Deux bases d'un espace vectoriel réel $E$ de dimension $n \geqslant 1$ ont même orientation si la [[matrice-passage|matrice de passage]] de l'une à l'autre a un [[determinant|déterminant]] strictement positif. C'est une relation d'équivalence à deux classes, les [[orientation|orientations]] de $E$.

- id: atlas-oriente
  terme: atlas orienté
  defini_dans: gd-orientation
  definition: |
    Un [[atlas]] d'une variété est orienté si tous ses changements de carte $\tau$ vérifient $\det d\tau(z) > 0$ en tout point $z$ où ils sont définis ; une variété est orientable si elle possède un atlas orienté.

# Notions définies en gras, lexicalisées (diagnostic H, lot L3, 4 nov. 2026)

- id: chaine-singuliere
  terme: chaîne singulière
  notation: '$C_n(X)$'
  defini_dans: h-singuliere
  definition: |
    Pour un espace topologique $X$ et $n \in \mathbb Z$, le groupe $C_n(X)$ des chaînes singulières de dimension $n$ est le [[groupe-abelien-libre|groupe abélien libre]] sur l'ensemble des [[simplexe-singulier|simplexes singuliers]] de dimension $n$ de $X$, nul pour $n < 0$ : une chaîne est une somme finie $\sum_\sigma n_\sigma \sigma$ à coefficients entiers. Muni du [[bord-singulier|bord]], c'est le complexe dont l'homologie est l'[[homologie-singuliere|homologie singulière]].

- id: degre-lacet
  terme: degré d'un lacet du cercle
  notation: '$\deg\gamma$'
  defini_dans: ta-cercle
  definition: |
    Pour la projection $p : \mathbb R \to S^1$ et un [[lacet]] $\gamma$ de $S^1$ en $p(0)$, le degré de $\gamma$ est l'entier $\deg\gamma = \tilde\gamma(1)$, où $\tilde\gamma$ est le [[relevement|relèvement]] de $\gamma$ issu de $0$. Il ne dépend que de la classe d'homotopie de $\gamma$, et $\deg$ est un isomorphisme du groupe fondamental de $S^1$ sur $\mathbb Z$ : c'est le nombre de tours de $\gamma$.

- id: complexe-cellulaire-chaines
  terme: complexe cellulaire (chaînes)
  notation: '$C^{\mathrm{cell}}(X)$'
  defini_dans: cw-complexe-cellulaire
  definition: |
    Le complexe cellulaire $C^{\mathrm{cell}}(X)$ d'un [[complexe-cellulaire|complexe cellulaire fini]] $X$, de squelettes $X^n$, est le complexe de chaînes de groupes $C^{\mathrm{cell}}_n(X) = H_n(X^n, X^{n-1})$, en [[homologie-relative|homologie relative]], dont le bord $d_n$ est la composée du [[morphisme-connexion|morphisme de connexion]] de la paire $(X^n, X^{n-1})$ et du morphisme $H_{n-1}(X^{n-1}) \to H_{n-1}(X^{n-1}, X^{n-2})$ induit par l'inclusion. Son homologie est l'[[homologie-cellulaire|homologie cellulaire]] de $X$, isomorphe à son homologie singulière.

- id: homotopie-complexes
  terme: homotopie de complexes
  defini_dans: h-complexes
  definition: |
    Pour deux [[morphisme-complexes|morphismes de complexes]] de chaînes $f, g : C \to D$, une homotopie de $f$ à $g$ est une suite de morphismes $P_n : C_n \to D_{n+1}$ telle que $\partial P + P\partial = g - f$ ; $f$ et $g$ induisent alors les mêmes morphismes en homologie. Pour les complexes de cochaînes $K$ et $L$ du nœud {{cs-cochaines|Complexes de cochaînes}}, une homotopie sera de même une suite de morphismes $Q^n : K^n \to L^{n-1}$ telle que $\delta Q + Q\delta = g - f$.

- id: relation-presentation
  terme: relation d'une présentation
  defini_dans: vk-presentations
  definition: |
    Pour un ensemble $S$ et une partie $R$ du [[groupe-libre|groupe libre]] $F(S)$, les éléments de $R$ sont les relations de la [[presentation-groupe|présentation]] $\langle S \mid R \rangle = F(S)/N(R)$, quotient par le plus petit sous-groupe distingué $N(R)$ qui les contient ; leurs classes y valent l'élément neutre. On désigne une relation par l'un de ses mots, comme $aba^{-1}b^{-1}$ dans $\langle a, b \mid aba^{-1}b^{-1} \rangle$.

- id: isomorphisme-revetements
  terme: isomorphisme de revêtements
  defini_dans: rv-morphismes
  definition: |
    Un isomorphisme d'un [[revetement|revêtement]] $p_1 : E_1 \to B$ sur un revêtement $p_2 : E_2 \to B$ de même base est un [[morphisme-revetements|morphisme]] $\varphi : E_1 \to E_2$, c'est-à-dire une application continue telle que $p_2 \circ \varphi = p_1$, qui est bijectif et de réciproque continue ; sa réciproque est alors un morphisme de $p_2$ dans $p_1$. Deux revêtements sont isomorphes s'il existe un isomorphisme de l'un sur l'autre.

- id: image-reciproque-forme
  terme: image réciproque d'une forme
  notation: '$\varphi^*\omega$'
  defini_dans: gd-formes
  definition: |
    Pour une application $\varphi : V \to U$ de classe $C^\infty$ entre ouverts de $\mathbb R^m$ et de $\mathbb R^n$ et une [[forme-differentielle|forme différentielle]] $\omega$ sur $U$, l'image réciproque $\varphi^*\omega$ est la forme sur $V$ définie par $(\varphi^*\omega)_y = d\varphi(y)^*\,\omega_{\varphi(y)}$. Elle respecte le produit extérieur, vérifie $(\psi \circ \varphi)^* = \varphi^* \circ \psi^*$ et commute à la [[differentielle-exterieure|différentielle extérieure]].

- id: applications-homotopes
  terme: applications homotopes
  defini_dans: h-homotopie
  definition: |
    Deux applications continues $f, g : X \to Y$ entre espaces topologiques sont homotopes s'il existe une application continue $F : X \times [0, 1] \to Y$ telle que $F(x, 0) = f(x)$ et $F(x, 1) = g(x)$ pour tout $x \in X$ ; aucune condition n'est imposée en dehors de $t = 0$ et $t = 1$, contrairement à l'[[homotopie-chemins|homotopie]] des chemins, qui fixe les extrémités. Deux applications homotopes induisent les mêmes morphismes en homologie.

- id: cartes-compatibles
  terme: cartes compatibles
  defini_dans: gd-varietes
  definition: |
    Deux [[carte|cartes]] $(U, \varphi)$ et $(V, \psi)$ d'un espace topologique, de même dimension $n$, sont compatibles si le changement de carte $\psi \circ \varphi^{-1} : \varphi(U \cap V) \to \psi(U \cap V)$ et sa réciproque sont de classe $C^\infty$, comme applications entre ouverts de $\mathbb R^n$. Un [[atlas]] est formé de cartes deux à deux compatibles.

# Notions définies en gras, lexicalisées (diagnostic H, lot L3, 4 nov. 2026)

- id: partie-convexe-complexe
  terme: partie convexe (de ℂ)
  defini_dans: cx-cauchy-convexe
  definition: |
    Une partie $C$ de $\mathbb C$ est convexe si $(1 - t)a + tb \in C$ pour tous $a, b \in C$ et tout $t \in [0, 1]$. Comme la bijection $a + ib \mapsto (a, b)$ de $\mathbb C$ sur $\mathbb R^2$ respecte la somme et la multiplication par un réel, cela revient à la [[partie-convexe|convexité]] de l'image de $C$ dans $\mathbb R^2$.

# Notions définies en gras, lexicalisées (diagnostic H, lot L4, 4 nov. 2026)

- id: base-canonique-kn
  terme: base canonique de Kⁿ
  notation: '$(e_1, \dots, e_n)$'
  defini_dans: v-libre
  definition: |
    Pour un corps $K$ et $n \geqslant 1$, la base canonique de $K^n$ est la famille $(e_1, \dots, e_n)$, où $e_j$ a sa $j$-ième coordonnée égale à $1$ et toutes les autres nulles. Tout $x = (x_1, \dots, x_n)$ s'écrit de façon unique $x = \sum_j x_je_j$ : les [[coordonnees-base|coordonnées]] de $x$ dans cette base sont ses composantes. Pour les modules $A^n$ sur un anneau commutatif, la même famille a son entrée propre, base canonique de $A^n$.

- id: matrice-symetrique
  terme: matrice symétrique
  defini_dans: v-matrices
  definition: |
    Une matrice carrée $A = (a_{ij})$ à coefficients dans un corps est symétrique si elle est égale à sa [[matrice-transposee|transposée]], ${}^tA = A$, c'est-à-dire si $a_{ij} = a_{ji}$ pour tous $i, j$.

- id: matrice-triangulaire
  terme: matrice triangulaire supérieure
  defini_dans: v-matrices
  definition: |
    Une matrice carrée $T = (t_{ij})$ est triangulaire supérieure si $t_{ij} = 0$ pour $i > j$ : tous ses coefficients situés sous la diagonale sont nuls. Elle est strictement triangulaire supérieure si de plus ses coefficients diagonaux sont nuls.

- id: convergence-simple
  terme: convergence simple
  defini_dans: su-convergence
  definition: |
    Une suite $(f_n)$ d'applications d'un ensemble $X$ dans un [[espace-metrique|espace métrique]] $(Y, d)$ converge simplement vers $f : X \to Y$ si, pour tout $x \in X$, la suite $(f_n(x))$ converge vers $f(x)$, c'est-à-dire si $d(f_n(x), f(x)) \to 0$. Le rang à partir duquel $d(f_n(x), f(x)) < \varepsilon$ dépend en général du point $x$ ; $f$ est la limite simple de la suite. Pour des fonctions à valeurs dans $[0, +\infty]$ ou dans la droite achevée, $f_n(x) \to f(x)$ s'entend dans cet ensemble ordonné, la limite $+\infty$ comprise.

- id: limite-fonction-infini
  terme: limite en l'infini (fonction réelle)
  notation: '$\lim_{x \to +\infty} g(x)$'
  defini_dans: de-limite
  definition: |
    Une fonction $g$ définie sur une demi-droite $[A_0, +\infty[$ de $\mathbb R$ tend vers le réel $\ell$ quand $x$ tend vers $+\infty$ si, pour tout $\varepsilon > 0$, il existe $B \geqslant A_0$ tel que $|g(x) - \ell| < \varepsilon$ pour tout $x \geqslant B$ ; elle tend vers $+\infty$ si, pour tout réel $A$, il existe $B$ tel que $g(x) > A$ pour tout $x \geqslant B$. On définit de même les limites en $-\infty$, la limite $-\infty$, et la limite $\pm\infty$ en un point adhérent au domaine, le seuil $x \geqslant B$ étant remplacé par $|x - a| < \delta$. Une limite finie, si elle existe, est unique.

- id: famille-orthonormee
  terme: famille orthonormée
  defini_dans: f-hilbert
  definition: |
    Une famille $(e_i)_{i \in I}$ d'un espace vectoriel réel muni d'un [[produit-scalaire|produit scalaire]] est orthonormée, ou orthonormale, si $\langle e_i, e_j \rangle$ vaut $1$ pour $i = j$ et $0$ sinon. Elle est libre : le produit scalaire d'une combinaison finie nulle $\sum_i \lambda_ie_i$ avec $e_j$ donne $\lambda_j = 0$. Une base orthonormée est une base qui est une famille orthonormée.

- id: partie-convexe-ev
  terme: partie convexe (espace vectoriel réel)
  defini_dans: gd-normes
  definition: |
    Une partie $C$ d'un espace vectoriel réel $E$ est convexe si $(1 - t)x + ty \in C$ pour tous $x, y \in C$ et tout $t \in [0, 1]$ : elle contient chaque segment qui joint deux de ses points. Les boules ouvertes d'une [[norme]] sont convexes, par l'inégalité triangulaire. Pour $E = \mathbb R^n$, c'est la [[partie-convexe|partie convexe]] de $\mathbb R^n$.

- id: application-ouverte
  terme: application ouverte
  defini_dans: t-continue
  definition: |
    Une application $f : X \to Y$ entre espaces topologiques est ouverte si l'[[image-directe|image directe]] par $f$ de tout [[ouvert]] de $X$ est un ouvert de $Y$. Cette propriété porte sur les images directes, là où la [[continuite|continuité]] porte sur les images réciproques.

- id: densite-probabilite
  terme: densité (d'une probabilité sur ℝ)
  defini_dans: p-variables
  definition: |
    Une [[probabilite|probabilité]] $\mu$ sur $\mathbb R$ a pour densité une fonction [[fonction-borelienne|borélienne]] $f \geqslant 0$ telle que $\int_{\mathbb R} f(x)\,dx = 1$ si $\mu(B) = \int_B f(x)\,dx$ pour tout borélien $B$, les intégrales étant prises pour la [[mesure-lebesgue|mesure de Lebesgue]] ; une [[variable-aleatoire|variable aléatoire]] a pour densité $f$ si sa loi l'a. Inversement, toute telle fonction $f$ est la densité d'une probabilité (Beppo Levi, nœud Poisson, exponentielle).

- id: fonction-borelienne
  terme: fonction borélienne
  defini_dans: m-mesurables
  definition: |
    Une fonction réelle, ou à valeurs dans $[0, +\infty]$, définie sur un espace topologique $X$ est borélienne si elle est [[fonction-mesurable|mesurable]] pour la [[tribu-borelienne|tribu borélienne]] de $X$, engendrée par ses ouverts. Une fonction continue de $\mathbb R$ dans $\mathbb R$ est borélienne, l'image réciproque d'un ouvert étant ouverte.

- id: chemin-c1-morceaux
  terme: chemin de classe C¹ par morceaux
  defini_dans: cx-integrale-chemin
  definition: |
    Un chemin de classe $C^1$ par morceaux est une application continue $\gamma : [a, b] \to \mathbb C$, où $a < b$ sont réels, pour laquelle il existe une [[subdivision]] $a = t_0 < \cdots < t_m = b$ telle que la restriction de $\gamma$ à chaque segment $[t_{j-1}, t_j]$ soit dérivable, de dérivée continue, les dérivées aux extrémités étant prises à droite ou à gauche. Il est fermé si $\gamma(a) = \gamma(b)$.

- id: longueur-chemin
  terme: longueur d'un chemin (dans ℂ)
  notation: '$L(\gamma)$'
  defini_dans: cx-integrale-chemin
  definition: |
    La longueur d'un [[chemin-c1-morceaux|chemin de classe $C^1$ par morceaux]] $\gamma : [a, b] \to \mathbb C$ est $L(\gamma) = \int_a^b |\gamma'(t)|\,dt$, somme des intégrales sur les segments de la subdivision. Elle majore les [[integrale-curviligne|intégrales curvilignes]] : $\big|\int_\gamma f\big| \leqslant L(\gamma)\sup_\gamma |f|$ pour $f$ continue sur l'image de $\gamma$.

- id: serie-complexe
  terme: série (nombres complexes)
  notation: '$\sum z_n$'
  defini_dans: cx-suites
  definition: |
    Pour une suite $(z_n)$ de nombres complexes, la série $\sum z_n$ est la suite de ses sommes partielles $S_N = \sum_{n \leqslant N} z_n$. Elle converge si $(S_N)$ converge dans $\mathbb C$, et sa somme est alors la limite, notée $\sum_{n \geqslant 0} z_n$.

- id: serie-absolument-convergente
  terme: série absolument convergente (nombres complexes)
  defini_dans: cx-suites
  definition: |
    Une [[serie-complexe|série]] $\sum z_n$ de nombres complexes converge absolument si la série réelle $\sum |z_n|$ converge. Une série absolument convergente converge, et $\big|\sum z_n\big| \leqslant \sum |z_n|$.

- id: bord-ouvert-complexe
  terme: bord d'un ouvert borné de ℂ
  notation: '$\partial U$'
  defini_dans: cf-maximum
  definition: |
    Pour un [[ouvert]] borné $U$ de $\mathbb C$, d'[[adherence|adhérence]] $\overline U$, le bord de $U$ est $\partial U = \overline U \setminus U$. C'est l'intersection de $\overline U$ et du fermé $\mathbb C \setminus U$ : une partie fermée et bornée de $\mathbb C$.

- id: racine-carree-holomorphe
  terme: racine carrée holomorphe
  defini_dans: cf-racines
  definition: |
    Pour une fonction $g$ [[holomorphe]] sur un [[ouvert]] $U$ de $\mathbb C$, une racine carrée holomorphe de $g$ est une fonction $h$ holomorphe sur $U$ telle que $h^2 = g$. Si $L$ est un [[logarithme-holomorphe|logarithme holomorphe]] de $g$, la fonction $\exp(L/2)$ en est une.

- id: couronne
  terme: couronne
  notation: '$A(c; r_1, r_2)$'
  defini_dans: rs-couronne
  definition: |
    Pour $c \in \mathbb C$ et $0 \leqslant r_1 < r_2 \leqslant +\infty$, la couronne de centre $c$ et de rayons $r_1$ et $r_2$ est l'[[ouvert]] $A(c; r_1, r_2) = \{z : r_1 < |z - c| < r_2\}$. Pour $r_1 = 0$, c'est le disque $D(c, r_2)$ privé de son centre.

- id: lacet-c1
  terme: lacet (analyse complexe)
  defini_dans: rs-indice
  definition: |
    En analyse complexe, un lacet est un [[chemin-c1-morceaux|chemin fermé de classe $C^1$ par morceaux]] $\gamma : [a, b] \to \mathbb C$, c'est-à-dire tel que $\gamma(a) = \gamma(b)$ ; son image est $\gamma^* = \gamma([a, b])$. C'est une notion distincte du lacet de la topologie algébrique, seulement continu et paramétré par $[0, 1]$.

- id: partie-principale
  terme: partie principale
  defini_dans: rs-singularites
  definition: |
    Si $a$ est une [[singularite-isolee|singularité isolée]] de $f$ et si $(c_n)_{n \in \mathbb Z}$ sont les coefficients de la [[serie-laurent|série de Laurent]] de $f$ près de $a$, la partie principale de $f$ en $a$ est la série $\sum_{n \geqslant 1} c_{-n}(z - a)^{-n}$. Elle est nulle si et seulement si la singularité est fausse, et c'est un polynôme non nul en $1/(z - a)$ si et seulement si $a$ est un [[pole|pôle]].

- id: ordre-zero
  terme: ordre d'un zéro (fonction holomorphe)
  defini_dans: rs-singularites
  definition: |
    Si $h$ est [[holomorphe]] au voisinage de $a$ et $h(a) = 0$, l'ordre du zéro $a$ est le plus petit entier $k$ tel que $h^{(k)}(a) \neq 0$, s'il existe ; c'est l'indice du premier coefficient non nul du développement de $h$ en série entière en $a$, et l'on dit aussi multiplicité. Il n'existe pas si et seulement si $h$ est nulle au voisinage de $a$. Le même indice, plus petit $k$ tel que $h^{(k)}(a) \neq 0$, est encore appelé ordre de $h$ en $a$ lorsque $h(a) \neq 0$ ; il vaut alors $0$.

- id: operateur-rang-fini
  terme: opérateur de rang fini
  defini_dans: f-compacts
  definition: |
    Un opérateur continu $u : E \to F$ entre [[espace-norme|espaces normés]] est de rang fini si son image $u(E)$ est de [[dimension]] finie.

- id: identite-parallelogramme
  terme: identité du parallélogramme
  defini_dans: f-hilbert
  definition: |
    Dans un espace muni d'un [[produit-scalaire|produit scalaire]], la norme associée vérifie $\|x + y\|^2 + \|x - y\|^2 = 2\|x\|^2 + 2\|y\|^2$ : la somme des carrés des diagonales d'un parallélogramme est celle des carrés de ses quatre côtés. On l'obtient en ajoutant les développements de $\|x + y\|^2$ et de $\|x - y\|^2$.

- id: orthogonal-partie
  terme: orthogonal d'une partie
  notation: '$A^\perp$'
  defini_dans: f-hilbert
  definition: |
    Dans un espace muni d'un [[produit-scalaire|produit scalaire]], l'orthogonal d'une partie $A$ est $A^\perp = \{x : \langle x, a \rangle = 0 \text{ pour tout } a \in A\}$, ensemble des vecteurs [[vecteurs-orthogonaux|orthogonaux]] à tous ceux de $A$. C'est un sous-espace vectoriel, puisque chaque condition $\langle x, a \rangle = 0$ est linéaire en $x$.

- id: projection-orthogonale
  terme: projection orthogonale
  notation: '$p_F$'
  defini_dans: f-spectral-compact
  definition: |
    Pour un sous-espace $F$ d'un [[espace-hilbert|espace de Hilbert]] $H$, fermé, et en particulier de dimension finie, la projection orthogonale $p_F$ associe à $x \in H$ l'unique $p_F(x) \in F$ tel que $x - p_F(x)$ appartienne à l'[[orthogonal-partie|orthogonal]] $F^\perp$. Elle est linéaire, et $\|x\|^2 = \|p_F(x)\|^2 + \|x - p_F(x)\|^2$ ; si $F$ est de dimension finie et $(b_1, \dots, b_d)$ en est une base orthonormée, $p_F(x) = \sum_i \langle x, b_i \rangle b_i$.

- id: multiplicite-valeur-propre
  terme: multiplicité d'une valeur propre (opérateur autoadjoint)
  defini_dans: f-spectral-fini
  definition: |
    Pour un opérateur [[operateur-autoadjoint|autoadjoint]] $u$, la multiplicité d'une [[valeur-propre|valeur propre]] $\lambda$ est la dimension du [[sous-espace-propre|sous-espace propre]] $E_\lambda = \operatorname{Ker}(u - \lambda\,\mathrm{id})$. En dimension finie, par le théorème spectral, c'est le nombre de fois que $\lambda$ figure parmi les $\lambda_i$ d'une base orthonormée de vecteurs propres, $u(e_i) = \lambda_ie_i$.

- id: equicontinue-uniforme
  terme: uniformément équicontinue
  defini_dans: fc-equicontinuite
  definition: |
    Une partie $A$ de l'ensemble des applications continues d'un espace métrique $(K, d)$ dans $\mathbb R^p$ est uniformément équicontinue si, pour tout $\varepsilon > 0$, il existe $\delta > 0$ tel que $\|f(y) - f(x)\|_\infty < \varepsilon$ pour toute $f \in A$ et tous $x, y \in K$ vérifiant $d(x, y) < \delta$ : le même $\delta$ convient pour toutes les fonctions et tous les points. Elle est alors [[equicontinue|équicontinue]].

- id: interpole-deux-points
  terme: interpolation en deux points
  defini_dans: fc-treillis
  definition: |
    Pour un espace compact $K$, une partie $L$ de l'ensemble $C(K)$ des fonctions continues de $K$ dans $\mathbb R$ interpole en deux points si, pour tous $x, y \in K$ et tous réels $a, b$, avec $a = b$ lorsque $x = y$, il existe $h \in L$ telle que $h(x) = a$ et $h(y) = b$.

- id: essentiellement-bornee
  terme: fonction essentiellement bornée
  defini_dans: lp-espaces
  definition: |
    Une fonction [[fonction-mesurable|mesurable]] $f$ sur un espace mesuré est essentiellement bornée s'il existe un réel $M$ tel que $|f| \leqslant M$ [[presque-partout|presque partout]]. La borne inférieure de ces réels $M \geqslant 0$ est sa borne supérieure essentielle $\|f\|_\infty$.

- id: mesure-borelienne
  terme: mesure borélienne
  defini_dans: mk-urysohn
  definition: |
    Une mesure borélienne sur un espace topologique $K$ est une [[mesure]] définie sur sa [[tribu-borelienne|tribu borélienne]] $\mathcal B(K)$, la plus petite tribu qui contient les ouverts de $K$.

- id: noyau-integral
  terme: noyau (opérateur intégral)
  defini_dans: f-compacts-exemples
  definition: |
    Une fonction continue $K : [0, 1]^2 \to \mathbb R$ est le noyau de l'opérateur $T_K$ défini sur $L^2([0, 1])$ par $T_Kf(x) = \int_0^1 K(x, y)f(y)\,dy$ ; un tel opérateur à noyau continu est compact. Ce noyau n'a pas de rapport avec le [[noyau|noyau]] d'un morphisme.

- id: derivees-laterales
  terme: dérivée à droite, dérivée à gauche
  notation: '$f''_d(a), f''_g(a)$'
  defini_dans: de-derivee
  definition: |
    Pour $f : I \to \mathbb R$ et $a \in I$, la dérivée à droite $f'_d(a)$ est la [[limite-fonction|limite]], si elle existe et est finie, du taux d'accroissement $\frac{f(x) - f(a)}{x - a}$ quand $x$ tend vers $a$ dans $I \cap \,]a, +\infty[$, et la dérivée à gauche $f'_g(a)$ sa limite dans $I \cap \,]{-\infty}, a[$, lorsque ces ensembles ne sont pas vides.

- id: polynome-taylor
  terme: polynôme de Taylor
  defini_dans: de-taylor
  definition: |
    Pour $f$ dérivable $n$ fois en $a$, le polynôme de Taylor de $f$ à l'ordre $n$ en $a$ est $\sum_{k \leqslant n} \frac{f^{(k)}(a)}{k!}(x - a)^k$. Pour $f$ dérivable $n + 1$ fois sur un intervalle $I$ contenant $a$ et $b$, la formule de Taylor-Lagrange majore l'écart entre $f(b)$ et sa valeur en $b$ par $\frac{M\,|b - a|^{n+1}}{(n+1)!}$ lorsque $|f^{(n+1)}| \leqslant M$ entre $a$ et $b$.

- id: classe-cinfini-reelle
  terme: classe C^∞ (fonction d'une variable réelle)
  defini_dans: ex-plateau
  definition: |
    Une fonction $f : \mathbb R \to \mathbb R$ est de classe $C^\infty$ si elle est de classe $C^n$ pour tout entier $n$, c'est-à-dire si toutes ses [[derivee-successive|dérivées successives]] existent sur $\mathbb R$ ; chacune est alors continue, puisqu'elle est dérivable. Les applications de plusieurs variables ont leur propre notion de classe $C^k$, au chapitre du calcul différentiel.

- id: subdivision-adaptee
  terme: subdivision adaptée (fonction en escalier)
  defini_dans: ri-escalier
  definition: |
    Une [[subdivision]] $a = x_0 < \cdots < x_n = b$ de $[a, b]$ est adaptée à une [[fonction-escalier|fonction en escalier]] $\varphi$ si $\varphi$ est constante sur chacun des intervalles ouverts $]x_i, x_{i+1}[$ ; les valeurs aux points $x_i$ sont quelconques. Toute subdivision plus fine qu'une subdivision adaptée l'est encore.

- id: integrale-escalier
  terme: intégrale d'une fonction en escalier
  notation: '$\int_a^b \varphi$'
  defini_dans: ri-integrale-escalier
  definition: |
    Pour une [[fonction-escalier|fonction en escalier]] $\varphi$ sur $[a, b]$, valant $c_i$ sur $]x_i, x_{i+1}[$ pour une [[subdivision-adaptee|subdivision adaptée]] $(x_0 < \cdots < x_n)$, l'intégrale de $\varphi$ est $\int_a^b \varphi = \sum_{i=0}^{n-1} c_i\,(x_{i+1} - x_i)$ ; elle ne dépend pas de la subdivision adaptée choisie.

- id: subdivision-plus-fine
  terme: subdivision plus fine
  defini_dans: ri-subdivision
  definition: |
    Une [[subdivision]] $\sigma'$ d'un segment $[a, b]$ est plus fine qu'une subdivision $\sigma$ si $\sigma \subset \sigma'$ : elle a tous les points de $\sigma$, et éventuellement d'autres. Son pas est alors au plus celui de $\sigma$.

- id: raffinement-commun
  terme: raffinement commun
  defini_dans: ri-subdivision
  definition: |
    Le raffinement commun de deux [[subdivision|subdivisions]] $\sigma$ et $\sigma'$ de $[a, b]$ est leur réunion $\sigma \cup \sigma'$ : c'est une subdivision [[subdivision-plus-fine|plus fine]] que chacune d'elles, et la moins fine de ces subdivisions.

- id: subdivision-reguliere
  terme: subdivision régulière
  defini_dans: ri-subdivision
  definition: |
    Pour $n \geqslant 1$, la subdivision régulière de $[a, b]$ à $n$ intervalles est formée des points $x_k = a + k\frac{b - a}{n}$, $0 \leqslant k \leqslant n$ ; son pas est $\frac{b - a}{n}$, aussi petit qu'on veut pour $n$ assez grand, par la propriété d'Archimède.

- id: segments-emboites
  terme: segments emboîtés
  defini_dans: su-segments
  definition: |
    Une suite de [[segment|segments]] $([a_n, b_n])$ de $\mathbb R$ est emboîtée si $[a_{n+1}, b_{n+1}] \subset [a_n, b_n]$ pour tout $n$. Leur intersection n'est alors pas vide : c'est le segment $[\lim a_n, \lim b_n]$, réduit à un point si $b_n - a_n \to 0$.

- id: point-adherent-reel
  terme: point adhérent (à une partie de ℝ)
  defini_dans: de-limite
  definition: |
    Un réel $a$ est adhérent à une partie $D$ de $\mathbb R$ si, pour tout $\delta > 0$, il existe $x \in D$ tel que $|x - a| < \delta$. Comme tout voisinage de $a$ contient un intervalle $]a - \delta, a + \delta[$, et que ces intervalles sont ouverts, c'est dire que $a$ appartient à l'[[adherence|adhérence]] de $D$ pour la [[topologie-usuelle|topologie usuelle]].

- id: ensemble-niveau
  terme: ensemble de niveau
  defini_dans: el-niveau
  definition: |
    Pour une application $g : U \to \mathbb R^p$ définie sur un ouvert $U$ de $\mathbb R^n$ et $c \in \mathbb R^p$, l'ensemble de niveau $c$ de $g$ est $\{x \in U : g(x) = c\}$ ; c'est celui de niveau $0$ de $g - c$. C'est un fermé de $U$ lorsque $g$ est continue.

- id: forme-bilineaire
  terme: forme bilinéaire
  defini_dans: fq-formes
  definition: |
    Une forme bilinéaire sur un espace vectoriel $E$ sur un corps $K$ est une application $b : E \times E \to K$ linéaire par rapport à chacune de ses deux variables, l'autre étant fixée. Elle est [[forme-bilineaire-symetrique|symétrique]] si $b(x, y) = b(y, x)$ pour tous $x, y$.

- id: formes-quadratiques-equivalentes
  terme: formes quadratiques équivalentes
  defini_dans: fq-formes
  definition: |
    Deux [[forme-quadratique|formes quadratiques]], $q$ sur $E$ et $q'$ sur $E'$, sont équivalentes s'il existe un isomorphisme $u : E \to E'$ tel que $q'(u(x)) = q(x)$ pour tout $x \in E$. Pour des espaces de même dimension finie sur un corps $K$ où $2$ est inversible, comme dans tout le chapitre, c'est dire que les matrices de leurs [[forme-polaire|formes polaires]] sont [[matrices-congruentes|congruentes]].

- id: mineur-principal
  terme: mineur principal
  defini_dans: fq-mineurs
  definition: |
    Pour une matrice carrée $A = (a_{ij})$ de taille $n$ et une partie non vide $S$ de $\{1, \dots, n\}$, le mineur principal d'indice $S$ est le déterminant de la sous-matrice $(a_{ij})_{i, j \in S}$, obtenue en ne gardant que les lignes et les colonnes d'indices dans $S$.

- id: mineur-principal-dominant
  terme: mineur principal dominant
  notation: '$\Delta_k$'
  defini_dans: fq-mineurs
  definition: |
    Le mineur principal dominant d'ordre $k$ d'une matrice carrée $A$ est son [[mineur-principal|mineur principal]] $\Delta_k$ d'indice $\{1, \dots, k\}$, déterminant du bloc formé de ses $k$ premières lignes et colonnes. Par le critère de Sylvester, une matrice symétrique réelle est définie positive si et seulement si tous ses mineurs principaux dominants sont strictement positifs.

- id: orthogonalite-forme-bilineaire
  terme: orthogonalité (forme bilinéaire symétrique)
  notation: '$A^\perp$'
  defini_dans: fq-orthogonalite
  definition: |
    Pour une [[forme-bilineaire-symetrique|forme bilinéaire symétrique]] $b$ sur $E$, deux vecteurs $x$ et $y$ sont orthogonaux pour $b$ si $b(x, y) = 0$, et l'orthogonal d'une partie $A$ est le sous-espace $A^\perp = \{x \in E : b(x, a) = 0 \text{ pour tout } a \in A\}$. Pour un [[produit-scalaire|produit scalaire]], on retrouve les [[vecteurs-orthogonaux|vecteurs orthogonaux]] ; pour une forme quelconque, un vecteur [[vecteur-isotrope|isotrope]] est orthogonal à lui-même.

- id: rang-forme-bilineaire
  terme: rang d'une forme bilinéaire
  notation: '$\operatorname{rg} b$'
  defini_dans: fq-rang
  definition: |
    Le rang d'une forme bilinéaire $b$ sur un espace de dimension finie $E$, ou de sa forme quadratique $q$, est le [[rang]] de l'application linéaire $\varphi_b : E \to E^*$, $x \mapsto b(x, \cdot)$ ; c'est aussi le [[rang-matrice|rang]] de la matrice de $b$ dans une base quelconque.

- id: noyau-forme-bilineaire
  terme: noyau d'une forme bilinéaire
  notation: '$\operatorname{Ker} b$'
  defini_dans: fq-rang
  definition: |
    Le noyau d'une forme bilinéaire $b$ sur $E$, ou de sa forme quadratique, est $\operatorname{Ker} b = \{x \in E : b(x, y) = 0 \text{ pour tout } y \in E\}$, noyau de l'application linéaire $x \mapsto b(x, \cdot)$ de $E$ dans son dual. La forme est [[forme-non-degeneree|non dégénérée]] si ce noyau est nul.

- id: extremum-local-rn
  terme: extremum local (plusieurs variables)
  defini_dans: fq-points-critiques
  definition: |
    Soit $f : U \to \mathbb R$, où $U$ est un ouvert de $\mathbb R^n$ muni d'une norme. La fonction $f$ admet un maximum local en $a \in U$ s'il existe $r > 0$ tel que $f(x) \leqslant f(a)$ pour tout $x \in U$ vérifiant $\|x - a\| < r$, et un minimum local si l'inégalité inverse est vraie ; l'extremum local est strict si l'inégalité est stricte pour $x \neq a$. Par l'équivalence des normes sur $\mathbb R^n$, ces notions ne dépendent pas de la norme ; pour $n = 1$, ce sont celles de l'entrée [[extremum-local|extremum local]].

- id: forme-negative
  terme: forme négative (quadratique)
  defini_dans: fq-positives
  definition: |
    Une forme quadratique réelle $q$ est négative si $-q$ est [[forme-positive|positive]], c'est-à-dire si $q(x) \leqslant 0$ pour tout $x$.

- id: forme-definie-negative
  terme: forme définie négative
  defini_dans: fq-positives
  definition: |
    Une forme quadratique réelle $q$ est définie négative si $-q$ est [[forme-definie-positive|définie positive]], c'est-à-dire si $q(x) < 0$ pour tout $x \neq 0$. On dit de même qu'une matrice symétrique réelle $A$ est définie négative si la forme $X \mapsto {}^tXAX$ l'est.

- id: forme-indefinie
  terme: forme indéfinie
  defini_dans: fq-positives
  definition: |
    Une forme quadratique réelle est indéfinie si elle prend des valeurs strictement positives et des valeurs strictement négatives : elle n'est alors ni [[forme-positive|positive]] ni négative.

- id: forme-definie-sous-espace
  terme: forme définie positive sur un sous-espace
  defini_dans: fq-sylvester
  definition: |
    Une forme quadratique réelle $q$ sur $E$ est définie positive sur un sous-espace $F$ si $q(x) > 0$ pour tout $x \in F$ non nul ; elle est définie négative sur $F$ si $q(x) < 0$ pour tout $x \in F$ non nul. Les dimensions maximales de tels sous-espaces sont les deux nombres de la [[signature-forme-quadratique|signature]].

- id: forme-hessienne
  terme: forme hessienne
  defini_dans: fq-taylor-young
  definition: |
    Pour $f$ de classe $C^2$ sur un ouvert de $\mathbb R^n$, la forme hessienne de $f$ en $a$ est la [[forme-quadratique|forme quadratique]] $h \mapsto {}^th\,H_f(a)\,h = \sum_{i,j} \partial_i\partial_j f(a)\,h_ih_j$, dont la forme polaire a pour matrice la [[matrice-hessienne|matrice hessienne]] $H_f(a)$. Elle donne le terme d'ordre $2$ de la formule de Taylor-Young.

- id: solution-edo
  terme: solution d'une équation différentielle
  defini_dans: ed-cauchy-lipschitz
  definition: |
    Pour une application continue $F : \Omega \to \mathbb R^n$ définie sur un ouvert $\Omega$ de $\mathbb R \times \mathbb R^n$, une solution de l'[[equation-differentielle|équation différentielle]] $y' = F(t, y)$ est une fonction dérivable $y : J \to \mathbb R^n$, définie sur un intervalle $J$, telle que $(t, y(t)) \in \Omega$ et $y'(t) = F(t, y(t))$ pour tout $t \in J$. Elle est alors de classe $C^1$, puisque $y'$ est la composée de fonctions continues.

- id: equation-autonome
  terme: équation autonome
  defini_dans: ed-flot
  definition: |
    Une [[equation-differentielle|équation différentielle]] est autonome si elle s'écrit $y' = X(y)$, le second membre ne dépendant pas du temps : c'est l'équation d'un champ de vecteurs $X : U \to \mathbb R^n$ sur un ouvert $U$ de $\mathbb R^n$. Si $y$ en est une solution, $t \mapsto y(t + s)$ en est une aussi.

- id: courbe-integrale
  terme: courbe intégrale (champ de vecteurs sur un ouvert)
  defini_dans: ed-flot
  definition: |
    Pour un champ $X : U \to \mathbb R^n$ de classe $C^1$ sur un ouvert $U$ de $\mathbb R^n$ et $x \in U$, la courbe intégrale issue de $x$ est la [[solution-maximale|solution maximale]] $t \mapsto \varphi_t(x)$ de l'équation $y' = X(y)$ telle que $y(0) = x$, définie sur un intervalle ouvert $]\alpha(x), \beta(x)[$ contenant $0$ ; la famille des $\varphi_t$ est le [[flot]] de $X$.

- id: courbe-integrale-variete
  terme: courbe intégrale (champ de vecteurs sur une variété)
  defini_dans: ed-varietes
  definition: |
    Pour un [[champ-vecteurs|champ de vecteurs]] $X$ sur une variété $M$, une courbe intégrale de $X$ est une application lisse $\gamma : J \to M$, définie sur un intervalle ouvert $J$ de $\mathbb R$, telle que $\gamma'(t) = X(\gamma(t))$ pour tout $t$, la vitesse $\gamma'(t)$ étant l'image par l'application tangente du vecteur $1$ de $T_tJ$. Dans une carte, c'est une [[courbe-integrale|courbe intégrale]] du champ lu dans la carte.

- id: systeme-lineaire-edo
  terme: système différentiel linéaire
  defini_dans: ed-lineaires
  definition: |
    Un système différentiel linéaire est une équation $y' = A(t)y + b(t)$, où $A : I \to \mathcal M_n(\mathbb R)$ et $b : I \to \mathbb R^n$ sont continues sur un intervalle ouvert $I$. Ses solutions maximales sont définies sur $I$ tout entier ; pour $A$ constante et $b = 0$, ce sont les $t \mapsto e^{(t - t_0)A}y_0$.

- id: localement-lipschitzienne
  terme: localement lipschitzienne en y
  defini_dans: ed-maximales
  definition: |
    Une application continue $F : \Omega \to \mathbb R^n$, sur un ouvert $\Omega$ de $\mathbb R \times \mathbb R^n$, est localement lipschitzienne en $y$ si, pour tout cylindre $C = [t_1 - a, t_1 + a] \times \bar B(y_1, r)$ contenu dans $\Omega$, il existe $L$ tel que $\|F(t, y) - F(t, z)\| \leqslant L\|y - z\|$ pour $(t, y), (t, z) \in C$.

- id: matrice-permutation-reelle
  terme: matrice de permutation (réelle)
  notation: '$P_\sigma$'
  defini_dans: cv-elementaires
  definition: |
    Pour une permutation $\sigma$ de $\{1, \dots, n\}$, la matrice de permutation $P_\sigma \in \mathcal M_n(\mathbb R)$ a pour $j$-ième colonne le vecteur $e_{\sigma(j)}$ de la [[base-canonique-kn|base canonique]] ; elle envoie $e_j$ sur $e_{\sigma(j)}$. La même matrice, sur un anneau commutatif, a son entrée propre au chapitre des modules.

- id: matrices-elementaires-reelles
  terme: matrice élémentaire (changement de variables)
  defini_dans: cv-elementaires
  definition: |
    Dans le chapitre du changement de variables, les matrices élémentaires de $\mathcal M_n(\mathbb R)$ sont les transvections $I_n + cE_{ij}$, $i \neq j$, les [[matrice-permutation-reelle|matrices de permutation]] $P_\sigma$ et les [[matrice-diagonale|matrices diagonales]] $\operatorname{diag}(d_1, \dots, d_n)$ ; toute [[matrice-inversible|matrice inversible]] est un produit de telles matrices. Cette liste diffère de celle des matrices élémentaires sur un anneau commutatif, au chapitre des modules, qui retient les dilatations au lieu des matrices diagonales.

- id: application-borelienne-rn
  terme: application borélienne (sur un borélien de ℝⁿ)
  defini_dans: cv-lebesgue-rn
  definition: |
    Pour un borélien $W$ de $\mathbb R^n$, l'ensemble $\mathcal B(W)$ des boréliens contenus dans $W$ est une tribu sur $W$, et une application définie sur $W$ est borélienne si elle est [[fonction-mesurable|mesurable]] pour $\mathcal B(W)$. Pour $W = \mathbb R^n$, c'est une [[fonction-borelienne|fonction borélienne]].

- id: pave-semi-ouvert
  terme: pavé semi-ouvert (de ℝⁿ)
  defini_dans: cv-lebesgue-rn
  definition: |
    Un pavé semi-ouvert de $\mathbb R^n$ est un produit $\prod_{i=1}^n \,]a_i, b_i]$, avec $a_i \leqslant b_i$ réels ; sa [[mesure-lebesgue-rn|mesure de Lebesgue]] est $\prod_i (b_i - a_i)$. Il ne faut pas le confondre avec les [[pave-mesurable|pavés mesurables]] d'une tribu produit, ni avec les pavés fermés des intégrales itérées.

- id: mesure-lebesgue-rn
  terme: mesure de Lebesgue de ℝⁿ
  notation: '$\lambda_n$'
  defini_dans: cv-lebesgue-rn
  definition: |
    La mesure de Lebesgue de $\mathbb R^n$ est la mesure $\lambda_n$ sur la [[tribu-borelienne|tribu borélienne]] de $\mathbb R^n$ définie par récurrence par $\lambda_1$, restriction aux boréliens de la [[mesure-lebesgue|mesure de Lebesgue]] de $\mathbb R$, et $\lambda_n = \lambda_{n-1} \otimes \lambda_1$, [[mesure-produit|mesure produit]]. C'est l'unique mesure sur les boréliens qui donne à tout pavé $\prod_i \,]a_i, b_i]$ le volume $\prod_i (b_i - a_i)$, et elle est invariante par translation.

- id: parametree-longueur
  terme: courbe paramétrée par la longueur
  defini_dans: cb-abscisse
  definition: |
    Une [[courbe-parametree|courbe paramétrée]] $\delta : J \to \mathbb R^n$ de classe $C^k$, $k \geqslant 1$, est paramétrée par la longueur si $\|\delta'(\sigma)\| = 1$ pour tout $\sigma \in J$ : sa longueur entre $\sigma_1 < \sigma_2$ est $\sigma_2 - \sigma_1$. Toute courbe régulière se reparamètre ainsi, par son [[abscisse-curviligne|abscisse curviligne]].

- id: reparametrage
  terme: reparamétrage
  defini_dans: cb-courbes
  definition: |
    Un reparamétrage de classe $C^k$ d'une [[courbe-parametree|courbe paramétrée]] $\gamma : I \to \mathbb R^n$ est une bijection $\varphi : J \to I$ de classe $C^k$ entre intervalles ouverts, dont la dérivée ne s'annule pas ; la courbe $\gamma \circ \varphi$ est une autre paramétrisation du même arc, et sa [[longueur-courbe|longueur]] est la même.

- id: courbe-bireguliere
  terme: courbe birégulière
  defini_dans: cb-frenet
  definition: |
    Une courbe $\delta : I \to \mathbb R^3$ de classe $C^3$, [[parametree-longueur|paramétrée par la longueur]], est birégulière si $\delta''$ ne s'annule pas. Sa [[courbure-courbe|courbure]] $\kappa = \|\delta''\|$ est alors strictement positive, et son [[repere-frenet|repère de Frenet]] est défini en tout point.

- id: base-orthonormee-directe
  terme: base orthonormée directe (de ℝ³)
  defini_dans: cb-frenet
  definition: |
    Une base orthonormée $(e_1, e_2, e_3)$ de $\mathbb R^3$, pour le [[produit-scalaire-usuel|produit scalaire usuel]], est directe si $\det(e_1, e_2, e_3) = 1$.

- id: deplacement-plan
  terme: déplacement du plan
  defini_dans: cb-planes
  definition: |
    Un déplacement du plan est une application $x \mapsto Ax + c$ de $\mathbb R^2$ dans lui-même, où $c \in \mathbb R^2$ et $A$ est une matrice de rotation $\begin{pmatrix} \cos\varphi & -\sin\varphi \\ \sin\varphi & \cos\varphi \end{pmatrix}$. Il conserve les distances et l'orientation ; deux courbes planes paramétrées par la longueur de même courbure se déduisent l'une de l'autre par un déplacement.

- id: equilibre-attractif
  terme: équilibre attractif
  defini_dans: ly-equilibres
  definition: |
    Un [[equilibre|équilibre]] $a$ d'un champ $X$ sur un ouvert $U$ de $\mathbb R^n$ est attractif s'il existe $\eta > 0$ tel que, pour tout $x \in U$ vérifiant $\|x - a\| < \eta$, la [[courbe-integrale|courbe intégrale]] issue de $x$ soit définie sur $[0, +\infty[$ et tende vers $a$ quand $t \to +\infty$. Un équilibre stable et attractif est [[asymptotiquement-stable|asymptotiquement stable]].

- id: equilibre-instable
  terme: équilibre instable
  defini_dans: ly-equilibres
  definition: |
    Un [[equilibre|équilibre]] est instable s'il n'est pas [[equilibre-stable|stable]] : il existe $\varepsilon > 0$ et des points $x$ aussi proches qu'on veut de l'équilibre dont la courbe intégrale sort de la boule $B(a, \varepsilon)$, ou n'est pas définie sur $[0, +\infty[$.

- id: positivement-invariante
  terme: partie positivement invariante
  defini_dans: ly-lasalle
  definition: |
    Pour un champ de vecteurs de [[flot]] $\varphi$ sur un ouvert $U$ de $\mathbb R^n$, une partie $M$ de $U$ est positivement invariante si, pour tout $y \in M$ et tout $s \geqslant 0$, $\varphi_s(y)$ est défini et appartient à $M$ : une courbe intégrale qui part de $M$ y reste pour tous les temps positifs.

- id: valeurs-propres-complexes
  terme: valeurs propres complexes (d'une matrice réelle)
  defini_dans: ly-triangulaire
  definition: |
    Les valeurs propres complexes d'une matrice réelle $A \in \mathcal M_n(\mathbb R)$ sont les [[valeur-propre|valeurs propres]] de l'[[endomorphisme]] $z \mapsto Az$ de $\mathbb C^n$, c'est-à-dire de $A$ vue comme élément de $\mathcal M_n(\mathbb C)$. Elles comprennent les valeurs propres réelles de $A$, et les autres vont par paires conjuguées, puisque $A\bar z = \overline{Az}$.

- id: directions-principales
  terme: directions principales
  defini_dans: sf-courbures
  definition: |
    En un point d'une [[surface-parametree|surface paramétrée régulière]], les directions principales sont les [[vecteur-propre|vecteurs propres]] de l'[[endomorphisme-weingarten|endomorphisme de Weingarten]], autoadjoint sur le plan tangent ; les valeurs propres associées sont les [[courbures-principales|courbures principales]].

- id: ombilic
  terme: ombilic
  defini_dans: sf-courbures
  definition: |
    Un point d'une [[surface-parametree|surface paramétrée régulière]] est un ombilic si ses deux [[courbures-principales|courbures principales]] sont égales, $k_1 = k_2$ ; l'endomorphisme de Weingarten y est alors une homothétie, et toute direction tangente est principale.

- id: courbure-normale
  terme: courbure normale
  defini_dans: sf-gauss
  definition: |
    La courbure normale d'une surface paramétrée régulière en un point, dans la direction d'un vecteur tangent unitaire $w$, est $I\!I(w)$, valeur de la [[seconde-forme-fondamentale|seconde forme fondamentale]]. Par le théorème de Meusnier, toute courbe tracée sur la surface, paramétrée par la longueur et de tangente $w$ en ce point, a une accélération de composante normale $\langle c'', N \rangle = I\!I(w)$.

- id: angle-vecteurs
  terme: angle de deux vecteurs
  defini_dans: sf-premiere-forme
  definition: |
    L'angle de deux vecteurs non nuls $w_1$ et $w_2$ de $\mathbb R^3$ est l'unique $\vartheta \in [0, \pi]$ tel que $\cos\vartheta = \frac{\langle w_1, w_2 \rangle}{\|w_1\|\,\|w_2\|}$ ; il existe et est unique parce que $\cos$ est une bijection décroissante de $[0, \pi]$ sur $[-1, 1]$, et que ce quotient est dans $[-1, 1]$ par l'inégalité de Cauchy-Schwarz.

- id: surfaces-isometriques
  terme: surfaces isométriques
  defini_dans: sf-premiere-forme
  definition: |
    Deux [[surface-parametree|surfaces paramétrées régulières]] $x$ et $y$ définies sur le même ouvert $U$ sont isométriques si elles ont les mêmes coefficients $E$, $F$ et $G$ de la [[premiere-forme-fondamentale|première forme fondamentale]].

- id: changement-parametres
  terme: changement de paramètres (surface)
  defini_dans: sf-surfaces
  definition: |
    Un changement de paramètres d'une [[surface-parametree|surface paramétrée régulière]] $x : U \to \mathbb R^3$ est un [[diffeomorphisme|$C^\infty$-difféomorphisme]] $\varphi$ d'un ouvert $\tilde U$ de $\mathbb R^2$ sur $U$ ; la surface $\tilde x = x \circ \varphi$ est une autre paramétrisation du même morceau de surface.

- id: longueur-riemannienne
  terme: longueur d'une courbe (variété riemannienne)
  defini_dans: sf-riemann
  definition: |
    Pour une [[metrique-riemannienne|métrique riemannienne]] $g$ sur une variété $M$, la longueur d'une courbe $c : [a, b] \to M$ de classe $C^1$, contenue dans le domaine d'une carte $(U, \varphi)$, est $L(c) = \int_a^b \sqrt{{}^t\gamma'\,g^\varphi(\gamma)\,\gamma'}\,dt$, où $\gamma = \varphi \circ c$ ; pour la métrique euclidienne d'un ouvert de $\mathbb R^d$, c'est la [[longueur-courbe|longueur]] usuelle.

- id: ordre-distribution
  terme: ordre d'une distribution
  defini_dans: ds-distributions
  definition: |
    Une [[distribution]] $T$ sur un ouvert $\Omega$ est d'ordre fini s'il existe $m \in \mathbb N$ tel que, pour tout compact $K \subset \Omega$, on ait $|\langle T, \varphi\rangle| \leqslant C_K\,p_m(\varphi)$ pour toute fonction test $\varphi$ à support dans $K$ ; le plus petit tel $m$ est l'ordre de $T$.

- id: boule-fermee-ouvert
  terme: boule fermée d'un ouvert
  defini_dans: ds-parametre
  definition: |
    Pour un ouvert $W$ de $\mathbb R^d$, une boule fermée de $W$ est une [[boule-fermee|boule fermée]] $\bar B(p, r)$, de rayon $r > 0$, contenue dans $W$. C'est une partie compacte et convexe de $W$.

- id: multi-indice
  terme: multi-indice
  notation: '$\alpha, |\alpha|, \partial^\alpha$'
  defini_dans: ds-test
  definition: |
    Un multi-indice est un $n$-uplet $\alpha = (\alpha_1, \dots, \alpha_n)$ d'entiers naturels, de longueur $|\alpha| = \alpha_1 + \cdots + \alpha_n$. Pour $f$ de classe $C^\infty$, on note $\partial^\alpha f = \partial_1^{\alpha_1} \cdots \partial_n^{\alpha_n} f$, l'ordre des dérivations étant indifférent par le théorème de Schwarz.

- id: nombre-montees
  terme: nombre de montées
  notation: '$U_n$'
  defini_dans: mt-montees
  definition: |
    Pour une suite réelle $(M_k)$ et deux réels $a < b$, le nombre de montées de $a$ à $b$ avant l'instant $n$ est le nombre $U_n$ de fois où la suite passe d'une valeur $\leqslant a$ à une valeur $\geqslant b$ entre les instants $0$ et $n$ : avec $\tau_0 = 0$, $\sigma_j = \inf\{k \geqslant \tau_{j-1} : M_k \leqslant a\}$ et $\tau_j = \inf\{k > \sigma_j : M_k \geqslant b\}$, c'est $U_n = \max\{j : \tau_j \leqslant n\}$.

- id: cylindre-trajectoires
  terme: cylindre (trajectoires)
  notation: '$C(x_0, \dots, x_n)$'
  defini_dans: mk-chaines
  definition: |
    Pour un ensemble $I$ fini ou dénombrable, le cylindre $C(x_0, \dots, x_n)$ est l'ensemble des suites $w \in I^{\mathbb N}$ telles que $w_0 = x_0, \dots, w_n = x_n$. Les cylindres engendrent la tribu des trajectoires sur $I^{\mathbb N}$.

- id: chaine-issue
  terme: chaîne de Markov issue d'un état
  defini_dans: mk-chaines
  definition: |
    Une [[chaine-markov|chaîne de Markov]] de matrice $Q$ est issue de l'état $x$ si sa loi initiale est la masse de Dirac $\delta_x$, qui vaut $1$ en $x$ et $0$ ailleurs : c'est une chaîne $(\delta_x, Q)$, et $X_0 = x$ presque sûrement. On note $P_x$ et $E_x$ la [[probabilite|probabilité]] et l'espérance correspondantes.

- id: chaine-jusqu-instant
  terme: chaîne de Markov jusqu'à un instant
  defini_dans: mk-chaines
  definition: |
    Une suite finie $(X_0, \dots, X_m)$ de variables à valeurs dans $I$ est une chaîne $(\mu, Q)$ jusqu'à l'instant $m$ si $P(X_0 = x_0, \dots, X_n = x_n) = \mu(x_0)Q(x_0, x_1)\cdots Q(x_{n-1}, x_n)$ pour tout $n \leqslant m$ et tous $x_0, \dots, x_n$ : c'est la définition de la [[chaine-markov|chaîne de Markov]] restreinte aux $m + 1$ premiers instants.

- id: variable-valeurs-denombrable
  terme: variable à valeurs dans un ensemble dénombrable
  defini_dans: mk-chaines
  definition: |
    Sur un [[espace-probabilise|espace probabilisé]] $(\Omega, \mathcal A, P)$, une variable à valeurs dans un ensemble $I$ fini ou [[denombrable]] est une application $X : \Omega \to I$ telle que $\{X = x\} \in \mathcal A$ pour tout $x \in I$ ; sa loi est la [[probabilite|probabilité]] $x \mapsto P(X = x)$ sur $I$.

- id: etat-aperiodique
  terme: état apériodique
  defini_dans: mk-classes
  definition: |
    Un état $x$ d'une chaîne de Markov de matrice $Q$ est apériodique si sa [[periode-etat|période]] vaut $1$, c'est-à-dire si le plus grand commun diviseur des $n \geqslant 1$ tels que $Q^n(x, x) > 0$ est $1$, lorsque cet ensemble est non vide. Si la matrice $Q$ est [[chaine-irreductible|irréductible]], tous les états ont la même période, et $Q$ est dite apériodique lorsque cette période vaut $1$.

- id: classe-fermee
  terme: classe fermée (chaîne de Markov)
  defini_dans: mk-classes
  definition: |
    Une classe de communication $C$ d'une chaîne de Markov est fermée si $x \in C$ et $\lex{mene-a}{x \to y}$ entraînent $y \in C$ : la chaîne, une fois dans $C$, n'en sort plus.

- id: probabilite-invariante
  terme: probabilité invariante
  defini_dans: mk-invariante
  definition: |
    Une [[probabilite|probabilité]] invariante pour une matrice de transition $Q$ est une [[mesure-invariante|mesure invariante]] de masse $1$, c'est-à-dire une probabilité $\pi$ sur l'espace des états telle que $\pi Q = \pi$. Si $X_0$ a pour loi $\pi$, chaque $X_n$ a pour loi $\pi$.

- id: temps-retour
  terme: temps de retour
  notation: '$T_y$'
  defini_dans: mk-markov-forte
  definition: |
    Pour une chaîne de Markov $(X_n)$ et un état $y$, le temps de retour en $y$ est $T_y = \inf\{n \geqslant 1 : X_n = y\}$, avec $\inf \varnothing = +\infty$ ; c'est un [[temps-arret|temps d'arrêt]]. Il diffère du temps d'atteinte $H_y = \inf\{n \geqslant 0 : X_n = y\}$ seulement si $X_0 = y$.

- id: nombre-visites
  terme: nombre de visites
  notation: '$N_x$'
  defini_dans: mk-recurrence
  definition: |
    Le nombre de visites d'une chaîne de Markov $(X_n)$ en un état $x$ est $N_x = \sum_{n \geqslant 0} \mathbf 1_{\{X_n = x\}}$, à valeurs dans $\mathbb N \cup \{+\infty\}$. L'état est [[etat-recurrent|récurrent]] si et seulement si, partant de $x$, ce nombre est presque sûrement infini.

- id: mesure-denombrable
  terme: mesure sur un ensemble dénombrable
  defini_dans: mk-transition
  definition: |
    Une mesure sur un ensemble $I$ fini ou [[denombrable]], muni de toutes ses parties, est une famille $\lambda = (\lambda(x))_{x \in I}$ d'éléments de $[0, +\infty]$, identifiée à la [[mesure]] $A \mapsto \sum_{x \in A}\lambda(x)$ sur les parties de $I$ ; c'est une [[probabilite|probabilité]] si $\sum_{x \in I}\lambda(x) = 1$. Toute mesure sur les parties de $I$ s'écrit ainsi, avec $\lambda(x) = \mu(\{x\})$, par σ-additivité.

- id: partie-mesurable-exterieure
  terme: partie μ*-mesurable
  defini_dans: m-caratheodory
  definition: |
    Pour une [[mesure-exterieure|mesure extérieure]] $\mu^*$ sur $X$, une partie $A$ de $X$ est $\mu^*$-mesurable si $\mu^*(E) = \mu^*(E \cap A) + \mu^*(E \setminus A)$ pour toute partie $E$ de $X$ : elle découpe additivement toute partie. Par le théorème de Carathéodory, ces parties forment une tribu, sur laquelle $\mu^*$ est une [[mesure-complete|mesure complète]].

- id: mesure-complete
  terme: mesure complète
  defini_dans: m-caratheodory
  definition: |
    Une [[mesure]] $\mu$ sur une tribu $\mathcal A$ est complète si toute partie d'un ensemble [[negligeable|négligeable]] appartient à $\mathcal A$ ; elle est alors négligeable. La mesure obtenue par le théorème de Carathéodory est complète.

- id: ecriture-canonique
  terme: écriture canonique d'une fonction étagée
  defini_dans: m-etagees
  definition: |
    Une [[fonction-etagee|fonction étagée]] $s$ de valeurs distinctes $c_1, \dots, c_m$ s'écrit $s = \sum_i c_i\mathbf 1_{A_i}$ avec $A_i = s^{-1}(\{c_i\})$ ; les $A_i$ forment une partition mesurable de $X$. Cette écriture, unique à l'ordre près des termes, est son écriture canonique.

- id: partie-lebesgue-mesurable
  terme: partie mesurable au sens de Lebesgue
  defini_dans: m-lebesgue
  definition: |
    Une partie de $\mathbb R$ est mesurable au sens de Lebesgue si elle est $\lambda^*$-mesurable, au sens de Carathéodory, pour la mesure extérieure $\lambda^*(A) = \inf \sum_k (b_k - a_k)$, la borne inférieure portant sur les suites d'intervalles $]a_k, b_k]$ qui recouvrent $A$. Ces parties forment la tribu de Lebesgue, qui contient les boréliens, et la [[mesure-lebesgue|mesure de Lebesgue]] est la restriction de $\lambda^*$ à cette tribu.

- id: espace-mesure
  terme: espace mesuré
  defini_dans: m-mesures
  definition: |
    Un espace mesuré est un triplet $(X, \mathcal A, \mu)$ formé d'un ensemble $X$, d'une [[tribu]] $\mathcal A$ sur $X$ et d'une [[mesure]] $\mu$ sur $\mathcal A$. Une partie de $\mathcal A$ est dite mesurable.

- id: pave-mesurable
  terme: pavé mesurable (tribu produit)
  defini_dans: m-produit
  definition: |
    Pour deux [[espace-mesurable|espaces mesurables]] $(X, \mathcal A)$ et $(Y, \mathcal B)$, un pavé mesurable est une partie $A \times B$ de $X \times Y$, avec $A \in \mathcal A$ et $B \in \mathcal B$. Les pavés mesurables engendrent la [[tribu-produit|tribu produit]]. Ils ne sont pas à confondre avec les pavés de $\mathbb R^n$, produits de segments, qu'emploie le nœud {{dr-iterees|Intégrales itérées}}.

- id: section-partie-produit
  terme: section d'une partie d'un produit
  notation: '$E_x, E^y$'
  defini_dans: m-produit
  definition: |
    Pour une partie $E$ d'un produit $X \times Y$ et $x \in X$, la section de $E$ en $x$ est $E_x = \{y \in Y : (x, y) \in E\}$ ; on définit de même $E^y = \{x \in X : (x, y) \in E\}$ pour $y \in Y$. Les sections d'une partie de la [[tribu-produit|tribu produit]] sont mesurables.

- id: tribu-produit
  terme: tribu produit
  notation: '$\mathcal A \otimes \mathcal B$'
  defini_dans: m-produit
  definition: |
    La tribu produit de deux [[espace-mesurable|espaces mesurables]] $(X, \mathcal A)$ et $(Y, \mathcal B)$ est la tribu $\mathcal A \otimes \mathcal B$ sur $X \times Y$ engendrée par les [[pave-mesurable|pavés mesurables]] $A \times B$ ; la [[mesure-produit|mesure produit]] y est définie.

- id: tribu-engendree
  terme: tribu engendrée
  notation: '$\sigma(\mathcal C)$'
  defini_dans: m-tribus
  definition: |
    Pour une partie $\mathcal C$ de $\mathcal P(X)$, la tribu engendrée par $\mathcal C$ est l'intersection $\sigma(\mathcal C)$ des [[tribu|tribus]] sur $X$ qui contiennent $\mathcal C$ : c'est une tribu, puisqu'une intersection non vide de tribus en est une, et c'est la plus petite qui contient $\mathcal C$.

- id: distance-induite
  terme: distance induite
  defini_dans: me-espace
  definition: |
    Pour une partie $A$ d'un [[espace-metrique|espace métrique]] $(X, d)$, la restriction de $d$ à $A \times A$ est une distance sur $A$, dite induite, et fait de $A$ un espace métrique.

- id: distance-discrete
  terme: distance discrète
  defini_dans: me-espace
  definition: |
    La distance discrète sur un ensemble $X$ vaut $1$ entre deux points distincts et $0$ entre un point et lui-même. Chaque boule $B(a, 1)$ est alors réduite à $\{a\}$, et la topologie associée est la [[topologie-discrete|topologie discrète]].

- id: vecteurs-colineaires
  terme: vecteurs colinéaires
  defini_dans: me-produit-scalaire
  definition: |
    Deux vecteurs $x$ et $y$ d'un espace vectoriel réel sont colinéaires si l'un des deux est le produit de l'autre par un réel. C'est le cas d'égalité de l'inégalité de Cauchy-Schwarz $|\langle x, y \rangle| \leqslant \|x\|\,\|y\|$.

- id: produit-scalaire-usuel
  terme: produit scalaire usuel
  defini_dans: me-produit-scalaire
  definition: |
    Le produit scalaire usuel de $\mathbb R^n$ est $\langle x, y \rangle = \sum_{i=1}^n x_iy_i = {}^tX\,Y$, où $X$ et $Y$ sont les colonnes de $x$ et de $y$. C'est un [[produit-scalaire|produit scalaire]], dont la norme associée est $\|x\|_2 = \big(\sum_i x_i^2\big)^{1/2}$.

- id: integrale-convergente
  terme: intégrale convergente (sur une demi-droite)
  defini_dans: nb-sommation
  definition: |
    Pour une fonction $h$ à valeurs complexes, [[continue-par-morceaux|continue par morceaux]] sur tout segment de $[a, +\infty[$, l'intégrale $\int_a^{+\infty} h$ converge si $\int_a^T h$ a une limite finie quand $T \to +\infty$ ; cette limite est sa valeur.

- id: convergence-presque-sure
  terme: convergence presque sûre
  defini_dans: p-convergences
  definition: |
    Une suite de variables aléatoires $(X_n)$ converge presque sûrement vers $X$ si $P(X_n \to X) = 1$ : hors d'un événement de probabilité nulle, la suite réelle $(X_n(\omega))$ converge vers $X(\omega)$. Elle entraîne la [[convergence-probabilite|convergence en probabilité]].

- id: convergence-probabilite
  terme: convergence en probabilité
  defini_dans: p-convergences
  definition: |
    Une suite de variables aléatoires $(X_n)$ converge en probabilité vers $X$ si $P(|X_n - X| > \varepsilon) \to 0$ pour tout $\varepsilon > 0$.

- id: convergence-moyenne
  terme: convergence en moyenne
  defini_dans: p-convergences
  definition: |
    Une suite de variables aléatoires intégrables $(X_n)$ converge en moyenne vers $X$ si $E[|X_n - X|] \to 0$. Elle entraîne la [[convergence-probabilite|convergence en probabilité]].

- id: probabilite-conditionnelle
  terme: probabilité conditionnelle
  notation: '$P(A \mid B)$'
  defini_dans: p-espace
  definition: |
    Dans un [[espace-probabilise|espace probabilisé]] $(\Omega, \mathcal A, P)$, pour un événement $B$ de probabilité $P(B) > 0$, la probabilité conditionnelle de $A$ sachant $B$ est $P(A \mid B) = P(A \cap B)/P(B)$ ; l'application $A \mapsto P(A \mid B)$ est une probabilité sur $\mathcal A$.

- id: fonction-repartition
  terme: fonction de répartition
  notation: '$F_X$'
  defini_dans: p-variables
  definition: |
    La fonction de répartition d'une [[variable-aleatoire|variable aléatoire]] réelle $X$ est $F_X(x) = P(X \leqslant x)$, pour $x \in \mathbb R$. Elle est croissante, continue à droite, de limites $0$ en $-\infty$ et $1$ en $+\infty$, et elle détermine la [[loi-variable|loi]] de $X$.

- id: tribu-asymptotique
  terme: tribu asymptotique
  notation: '$\mathcal T$'
  defini_dans: p-zero-un
  definition: |
    La tribu asymptotique d'une suite de variables aléatoires $(X_n)$ est $\mathcal T = \bigcap_n \sigma(X_k : k \geqslant n)$ : ses événements ne dépendent d'aucun nombre fini de variables. Par la loi du $0$-$1$ de Kolmogorov, si les $X_n$ sont indépendantes, chacun de ses événements a pour probabilité $0$ ou $1$.

- id: fonction-escalier-droite
  terme: fonction en escalier (sur ℝ)
  defini_dans: fo-densite
  definition: |
    Dans le chapitre de Fourier, une fonction en escalier sur $\mathbb R$ est une combinaison linéaire finie d'indicatrices d'intervalles bornés. Elle est nulle hors d'un segment, et sa restriction à un segment $[a, b]$ qui contient ces intervalles est une [[fonction-escalier|fonction en escalier]] au sens de l'intégrale de Riemann.

# Notions définies en gras, lexicalisées (diagnostic H, lot L4, 4 nov. 2026)

- id: subdivision-adaptee-chemin
  terme: subdivision adaptée (intégrale le long d'un chemin continu)
  defini_dans: dr-integrale
  definition: |
    Pour un chemin continu $\gamma : [a, b] \to U$, à valeurs dans un ouvert $U$ de $\mathbb R^n$, et une forme fermée $\omega$ de degré $1$ sur $U$, une subdivision adaptée est la donnée d'une suite $a = s_0 < \cdots < s_m = b$ et de boules $B_1, \dots, B_m$ contenues dans $U$, munies de [[primitive-forme|primitives]] $f_1, \dots, f_m$ de $\omega$, telles que $\gamma([s_{k-1}, s_k]) \subset B_k$ ; l'intégrale de $\omega$ le long de $\gamma$ est alors $\sum_k \big(f_k(\gamma(s_k)) - f_k(\gamma(s_{k-1}))\big)$. Ce n'est pas la [[subdivision-adaptee|subdivision adaptée]] à une fonction en escalier.

- id: epsilon-reseau
  terme: ε-réseau
  defini_dans: me-precompacts
  definition: |
    Pour une partie $A$ d'un [[espace-metrique|espace métrique]] $X$ et un réel $\varepsilon > 0$, un $\varepsilon$-réseau de $A$ est une famille finie $(a_1, \dots, a_m)$ de points de $X$ telle que $A \subset B(a_1, \varepsilon) \cup \cdots \cup B(a_m, \varepsilon)$. Une partie est [[partie-precompacte|précompacte]] si et seulement si elle a un $\varepsilon$-réseau pour tout $\varepsilon > 0$.

- id: temps-atteinte
  terme: temps d'atteinte
  notation: '$H_y$'
  defini_dans: mk-markov-forte
  definition: |
    Pour une chaîne de Markov $(X_n)$ et un état $y$, le temps d'atteinte de $y$ est $H_y = \inf\{n \geqslant 0 : X_n = y\}$, avec $\inf \varnothing = +\infty$ ; c'est un [[temps-arret|temps d'arrêt]]. Il vaut $0$ si $X_0 = y$, et coïncide sinon avec le [[temps-retour|temps de retour]] $T_y$.

- id: mene-a
  terme: mène à (chaîne de Markov)
  notation: '$x \to y$'
  defini_dans: mk-classes
  definition: |
    Pour une [[matrice-transition|matrice de transition]] $Q$, un état $x$ mène à un état $y$, ce que l'on note $x \to y$, s'il existe $n \in \mathbb N$ tel que $Q^n(x, y) > 0$ ; en particulier, tout état mène à lui-même. Deux états communiquent si chacun mène à l'autre.

# Faux rappels du diagnostic H : notions nouvelles homonymes d'une entrée d'amont (lot L5, 4 nov. 2026)

- id: famille-generatrice-module
  terme: famille génératrice d'un module
  defini_dans: md-libres
  definition: |
    Une famille finie $(x_1, \dots, x_n)$ d'éléments d'un [[module|$A$-module]] $M$ est génératrice si tout élément de $M$ s'écrit $\sum_i a_ix_i$ avec des $a_i \in A$ ; le module est [[module-type-fini|de type fini]] s'il en a une. C'est la définition de la [[famille-generatrice|famille génératrice]] d'un espace vectoriel, mais sur un anneau une famille génératrice ne contient pas toujours de base : la famille $(2, 3)$ engendre $\mathbb Z$, puisque $1 = 3 - 2$, et aucune de ses sous-familles n'est une base.

- id: base-module
  terme: base d'un module
  defini_dans: md-libres
  definition: |
    Une famille finie $(x_1, \dots, x_n)$ d'éléments d'un [[module|$A$-module]] $M$ est une base si elle est [[famille-libre-module|libre]] et [[famille-generatrice-module|génératrice]], c'est-à-dire si tout élément de $M$ s'écrit d'une unique façon $\sum_i a_ix_i$ avec des $a_i \in A$ ; l'application $(a_1, \dots, a_n) \mapsto \sum_i a_ix_i$ est alors un isomorphisme de $A^n$ sur $M$. Un module qui a une base est [[module-libre|libre]], et la famille vide est une base du module nul. Sur un anneau intègre, toutes les bases d'un module libre ont le même nombre d'éléments, son [[rang-module|rang]]. Une famille libre ne se complète pas toujours en une base : la famille $(2)$ de $\mathbb Z$ est libre, et aucune base de $\mathbb Z$ ne la contient.

- id: multiplicite-algebrique
  terme: multiplicité algébrique d'une valeur propre
  defini_dans: rd-caracteristique
  definition: |
    Pour un [[endomorphisme]] $u$ d'un espace vectoriel [[espace-dimension-finie|de dimension finie]] dont le [[polynome-caracteristique|polynôme caractéristique]] $\chi_u$ est [[polynome-scinde|scindé]], la multiplicité d'une [[valeur-propre|valeur propre]] $\lambda$ est sa [[multiplicite-racine|multiplicité]] comme [[racine-polynome|racine]] de $\chi_u$ ; la somme des multiplicités est la dimension de l'espace. Le nœud {{rd-stables|Sous-espaces stables}} montrera qu'elle majore la dimension du [[sous-espace-propre|sous-espace propre]] $E_\lambda$ ; elle ne lui est pas égale en général : pour la matrice $\begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}$, la valeur propre $1$ est de multiplicité $2$, et $E_1$ est une droite.

- id: pgcd-polynomes
  terme: PGCD de deux polynômes
  notation: '$P \wedge Q$'
  defini_dans: pol-principal
  definition: |
    Pour un [[corps]] $K$ et deux polynômes $P$, $Q$ de $K[X]$ non tous deux nuls, le PGCD $P \wedge Q$ est le générateur [[polynome-unitaire|unitaire]] de l'[[ideal|idéal]] $(P) + (Q)$. Il [[divisibilite-polynomes|divise]] $P$ et $Q$, tout diviseur commun de $P$ et $Q$ le divise, et il s'écrit $UP + VQ$ avec $U, V \in K[X]$ (Bézout). Il ne change pas quand on passe de $K[X]$ à $L[X]$, pour un corps $L$ contenant $K$. Ce n'est pas le [[pgcd|PGCD]] de deux entiers, mais il se définit de la même façon, le degré tenant lieu de la valeur absolue.

- id: premiers-entre-eux-polynomes
  terme: polynômes premiers entre eux
  defini_dans: pol-principal
  definition: |
    Deux polynômes $P$ et $Q$ de $K[X]$, pour un [[corps]] $K$, sont premiers entre eux si leur [[pgcd-polynomes|PGCD]] $P \wedge Q$ vaut $1$, c'est-à-dire si leurs seuls diviseurs communs sont les constantes non nulles ; par Bézout, cela équivaut à l'existence de $U, V \in K[X]$ tels que $UP + VQ = 1$. Ainsi $X - a$ et $X - b$, pour $a \neq b$, sont premiers entre eux, puisque $\frac{(X - a) - (X - b)}{b - a} = 1$.

- id: division-euclidienne-polynomes
  terme: division euclidienne des polynômes
  defini_dans: pol-division
  definition: |
    Pour un anneau commutatif $A$ et un polynôme $B \neq 0$ de $A[X]$ dont le [[coefficient-dominant|coefficient dominant]] est [[inversible]], et pour tout $P \in A[X]$, l'unique couple $(Q, R)$ de polynômes de $A[X]$ tel que $P = BQ + R$ et $\deg R < \deg B$ ; $Q$ est le quotient et $R$ le reste. Sur un [[corps]], elle existe pour tout $B \neq 0$. C'est l'analogue de la [[division-euclidienne|division euclidienne]] des entiers, le degré du reste tenant lieu de sa taille.

- id: pgcd-anneau
  terme: PGCD dans un anneau intègre
  defini_dans: ac-factoriels
  definition: |
    Dans un [[anneau-integre|anneau intègre]] $A$, un PGCD d'une famille finie $(a_1, \dots, a_n)$ est un diviseur commun $d$ des $a_i$ tel que tout diviseur commun des $a_i$ [[divisibilite-anneau|divise]] $d$. Deux PGCD d'une même famille sont [[elements-associes|associés]], et tout associé d'un PGCD en est un. Un PGCD n'existe pas toujours. Soit $\mathbb Z[\sqrt{-5}]$ l'anneau quotient $\mathbb Z[X]/(X^2 + 5)$ ({{a-anneau-quotient|Anneau quotient}}), où l'on note $\sqrt{-5}$ la classe de $X$. Par division euclidienne par $X^2 + 5$, tout élément s'écrit de façon unique $a + b\sqrt{-5}$, avec $a, b \in \mathbb Z$, et $(a + b\sqrt{-5})(c + d\sqrt{-5}) = (ac - 5bd) + (ad + bc)\sqrt{-5}$. La norme $N(a + b\sqrt{-5}) = a^2 + 5b^2$ est multiplicative, puisque $(ac - 5bd)^2 + 5(ad + bc)^2 = (a^2 + 5b^2)(c^2 + 5d^2)$, et ne s'annule qu'en $0$ : l'anneau est intègre, et si $x$ divise $y \neq 0$, $N(x)$ divise $N(y)$. Les éléments $6$ et $2(1 + \sqrt{-5})$ n'ont pas de PGCD. Un PGCD serait divisible par $2$ et par $1 + \sqrt{-5}$, qui divisent tous deux $6 = (1 + \sqrt{-5})(1 - \sqrt{-5})$ et $2(1 + \sqrt{-5})$, et il diviserait $6$ et $2(1 + \sqrt{-5})$ : sa norme serait multiple de $4$ et de $6$ et diviserait $36$ et $24$, donc vaudrait $12$, qui n'est pas de la forme $a^2 + 5b^2$. Dans un [[anneau-factoriel|anneau factoriel]], toute famille finie d'éléments non tous nuls en a un. Dans $\mathbb Z$, le [[pgcd|PGCD]] de deux entiers est l'unique PGCD positif ou nul ; dans $K[X]$, le [[pgcd-polynomes|PGCD]] de deux polynômes non tous deux nuls est l'unique PGCD unitaire.

- id: polynome-primitif-factoriel
  terme: polynôme primitif (sur un anneau factoriel)
  defini_dans: ac-contenu
  definition: |
    Pour un [[anneau-factoriel|anneau factoriel]] $A$, un polynôme non nul $P \in A[X]$ est primitif si son [[contenu-factoriel|contenu]] $c(P)$, [[pgcd-anneau|PGCD]] de ses coefficients, est [[inversible]], c'est-à-dire si ses coefficients n'ont pas d'autre diviseur commun que les inversibles. Tout polynôme non nul s'écrit $c(P)\,P_0$ avec $P_0$ primitif, et le produit de deux polynômes primitifs est primitif (lemme de Gauss). Pour $A = \mathbb Z$, on retrouve le [[polynome-primitif|polynôme primitif]] à coefficients entiers.

- id: matrice-identite
  terme: matrice identité
  notation: '$I_n$'
  defini_dans: v-matrices
  definition: |
    Pour un entier $n \geqslant 1$, la matrice identité $I_n$ de $\mathcal M_n(K)$ a ses coefficients diagonaux égaux à $1$ et tous les autres nuls. C'est la matrice de l'[[identite|identité]] d'un espace de dimension $n$ dans toute base, prise au départ et à l'arrivée (dans deux bases distinctes, la matrice de l'identité est la [[matrice-passage|matrice de passage]]), et elle est neutre pour le produit : $AI_n = A$ et $I_nB = B$ dès que ces produits ont un sens. La même définition vaut pour les matrices à coefficients dans un anneau commutatif.

- id: relation-primitive-recursive
  terme: relation primitive récursive
  defini_dans: cal-pr-cloture
  definition: |
    Une relation $R \subset \mathbb N^n$ est primitive récursive si sa [[fonction-caracteristique-relation|fonction caractéristique]] $\chi_R$, égale à $1$ sur $R$ et à $0$ ailleurs, est une [[fonction-primitive-recursive|fonction primitive récursive]]. Les relations $x = y$, $x < y$ et $x \leqslant y$ le sont, et ces relations sont stables par les connecteurs, par substitution de fonctions primitives récursives et par les quantifications bornées $\exists z < y$ et $\forall z < y$. Un ensemble $A \subset \mathbb N$, relation unaire, est primitif récursif au même sens ; c'est ainsi que l'ensemble des codes des axiomes de $\mathsf{PA}$ est primitif récursif.

- id: sous-g-module
  terme: sous-module (d'un G-module)
  defini_dans: cg-modules
  definition: |
    Un sous-module d'un [[g-module|$G$-module]] $A$ est un sous-groupe $B$ de $A$ stable par l'action : $gb \in B$ pour tous $g \in G$ et $b \in B$. Le groupe quotient $A/B$ est alors un $G$-module, pour $g(a + B) = ga + B$, et le noyau et l'image d'un [[morphisme-g-modules|morphisme de $G$-modules]] sont des sous-modules. La stabilité demandée est celle par l'action du groupe, et non par la loi externe d'un [[sous-module|module sur un anneau]].

- id: degre-representation
  terme: degré (d'une représentation)
  defini_dans: rp-representations
  definition: |
    Le degré d'une [[representation-groupe|représentation]] $(V, \rho)$ d'un groupe $G$ est la [[dimension]] de l'espace $V$. Une représentation de degré $1$ s'identifie à un morphisme de $G$ dans le groupe multiplicatif $K^\times$, puisque $GL(V)$ est alors formé des multiplications par les scalaires non nuls. On appelle aussi degré d'un caractère celui de la représentation, qui est la valeur du caractère en l'élément neutre.

- id: isomorphisme-representations
  terme: isomorphisme de représentations
  defini_dans: rp-representations
  definition: |
    Un isomorphisme d'une [[representation-groupe|représentation]] $(V, \rho)$ sur une représentation $(V', \rho')$ du même groupe est un [[morphisme-representations|morphisme de représentations]] bijectif, c'est-à-dire une application linéaire bijective $f$ telle que $f \circ \rho(g) = \rho'(g) \circ f$ pour tout $g$ ; sa réciproque est encore un morphisme. Deux représentations sont isomorphes s'il existe un isomorphisme de l'une sur l'autre : elles ont alors le même degré.

- id: somme-directe-representations
  terme: somme directe de représentations
  notation: '$\rho \oplus \rho''$'
  defini_dans: rp-representations
  definition: |
    La somme directe de deux [[representation-groupe|représentations]] $(V, \rho)$ et $(V', \rho')$ d'un même groupe est l'espace $V \times V'$ muni de $(\rho \oplus \rho')(g)(x, x') = \big(\rho(g)x, \rho'(g)x'\big)$ ; c'est une représentation, de [[degre-representation|degré]] $\dim V + \dim V'$. Si $V = W \oplus W'$ avec $W$ et $W'$ stables, l'application $(w, w') \mapsto w + w'$ est un [[isomorphisme-representations|isomorphisme]] de la somme directe de $W$ et $W'$ sur $V$ : la décomposition d'un espace en sous-espaces stables est une somme directe de représentations.

- id: degre-extension
  terme: degré d'une extension
  notation: '$[L:K]$'
  defini_dans: gs-extensions
  definition: |
    Pour une [[extension-corps|extension]] $L/K$, le degré $[L:K]$ est la [[dimension]] de $L$ comme $K$-espace vectoriel si $L$ est [[espace-dimension-finie|de dimension finie]] sur $K$, et $[L:K] = \infty$ sinon ; l'extension est [[extension-finie|finie]] si son degré l'est. Pour un corps intermédiaire $M$, $[L:K] = [L:M]\,[M:K]$ quand ces degrés sont finis (multiplicativité des degrés). Ainsi $[\mathbb C:\mathbb R] = 2$, de base $(1, i)$.

- id: partition-entier
  terme: partition d'un entier
  defini_dans: gf-abeliens
  definition: |
    Une partition d'un entier $a \geqslant 1$ est une suite décroissante, au sens large, d'entiers $k_1 \geqslant \cdots \geqslant k_r \geqslant 1$ de somme $a$. Les partitions de $3$ sont $(3)$, $(2, 1)$ et $(1, 1, 1)$ : ce sont, pour un nombre premier $p$, les exposants des trois groupes abéliens d'ordre $p^3$ à isomorphisme près, $\mathbb Z/p^3\mathbb Z$, $\mathbb Z/p^2\mathbb Z \times \mathbb Z/p\mathbb Z$ et $(\mathbb Z/p\mathbb Z)^3$. Ce n'est pas une [[partition]] d'un ensemble.

# Notions masquées par les règles d'écartement du diagnostic H (lot L6, 4 nov. 2026)

- id: support-forme
  terme: support d'une forme différentielle
  defini_dans: pc-support
  definition: |
    Pour une [[forme-differentielle|forme différentielle]] $\omega$ sur un ouvert $U$ de $\mathbb R^n$, le support de $\omega$ est l'[[adherence|adhérence]], dans $U$, de l'ensemble des points $x$ où $\omega_x \neq 0$ ; c'est le plus petit fermé de $U$ hors duquel $\omega$ est nulle, et celui de $d\omega$ y est contenu. Les formes de degré $k$ dont le support est [[compact]] forment l'espace $\Omega^k_c(U)$, sur lequel on définit la [[cohomologie-support-compact|cohomologie à support compact]]. Le support d'une forme sur une variété se définit de même, comme une adhérence dans la variété. L'erreur à éviter est de prendre l'ensemble $\{\omega \neq 0\}$ lui-même : pour $\omega = x\,dx$ sur $\mathbb R$, il ne contient pas $0$, qui est pourtant dans le support $\mathbb R$.

- id: treillis
  terme: treillis
  defini_dans: od-treillis
  definition: |
    Un [[ensemble-ordonne|ensemble ordonné]] est un treillis si toute paire $\{x, y\}$ a une [[borne-superieure|borne supérieure]] $x \vee y$ et une [[borne-inferieure|borne inférieure]] $x \wedge y$. Un ensemble totalement ordonné en est un, avec $x \vee y = \max(x, y)$ et $x \wedge y = \min(x, y)$ ; l'ensemble des parties d'un ensemble, ordonné par inclusion, aussi, avec la réunion et l'intersection. Un [[treillis-complet|treillis complet]] est un treillis, puisque toute partie y a aussi une borne inférieure ; la réciproque est fausse, car un ensemble totalement ordonné sans plus grand élément est un treillis où la partie formée de tous les éléments n'a pas de borne supérieure.

- id: topologie
  terme: topologie
  defini_dans: t-espace
  definition: |
    Une topologie sur un ensemble $X$ est une partie $\mathcal T$ de l'[[ensemble-parties|ensemble des parties]] $\mathcal P(X)$ qui contient $\varnothing$ et $X$, et qui est stable par réunion quelconque et par intersection de deux éléments, donc par intersection finie ; ses éléments sont les [[ouvert|ouverts]], et le couple $(X, \mathcal T)$ est un [[espace-topologique|espace topologique]]. Un même ensemble porte en général plusieurs topologies : la [[topologie-discrete|topologie discrète]] $\mathcal P(X)$ et la topologie grossière $\{\varnothing, X\}$ sont la plus grande et la plus petite pour l'inclusion. Il faut donc toujours préciser de quelle topologie on munit un ensemble.

- id: racine-polynome
  terme: racine d'un polynôme
  defini_dans: pol-racines
  definition: |
    Pour un [[anneau-commutatif|anneau commutatif]] $A$ et $P \in A[X]$, un élément $a \in A$ est une racine de $P$ si $P(a) = 0$, $P(a)$ étant l'[[evaluation-polynome|évaluation]] de $P$ en $a$ ; cela revient à dire que $X - a$ [[divisibilite-polynomes|divise]] $P$. Si $A$ est un [[sous-anneau]] d'un anneau commutatif $B$, par exemple un corps contenu dans un plus grand corps, une racine de $P$ dans $B$ est une racine de $P$ vu dans $B[X]$, et $P$ peut en avoir dans $B$ sans en avoir dans $A$. Sur un [[anneau-integre|anneau intègre]], un polynôme non nul de degré $d$ a au plus $d$ racines, même comptées avec leur [[multiplicite-racine|multiplicité]] ; sans intégrité, c'est faux : dans $\mathbb Z/8\mathbb Z$, $X^2 - 1$ a les quatre racines $1, 3, 5, 7$.

- id: vecteur-tangent-niveau
  terme: vecteur tangent (ensemble de niveau)
  defini_dans: el-niveau
  definition: |
    Soit $\Gamma$ l'[[ensemble-niveau|ensemble de niveau]] $0$ d'une application $g : U \to \mathbb R^p$ de [[classe-ck|classe $C^k$]], $k \geqslant 1$, sur un ouvert $U$ de $\mathbb R^n$, et $a \in \Gamma$. Un vecteur $v \in \mathbb R^n$ est tangent à $\Gamma$ en $a$ s'il existe $\varepsilon > 0$ et une courbe $\gamma : \,]{-\varepsilon}, \varepsilon[ \to \mathbb R^n$ de classe $C^1$, à valeurs dans $\Gamma$, telle que $\gamma(0) = a$ et $\gamma'(0) = v$ ; ces vecteurs forment l'[[espace-tangent-niveau|espace tangent]] $T_a\Gamma$. Si $g$ est une [[submersion]] en $a$, ce sont exactement les $v$ tels que $dg(a)(v) = 0$ : pour la sphère unité, ensemble de niveau $0$ de $x \mapsto x_1^2 + \cdots + x_n^2 - 1$, ce sont les vecteurs orthogonaux à $a$. Au chapitre des sous-variétés, on ne demande aux courbes que d'être dérivables en $0$, et l'on trouve encore le noyau de la différentielle d'une équation.

- id: modele-foncteurs-chaines
  terme: modèle (foncteurs de chaînes)
  defini_dans: ku-modeles
  definition: |
    Dans la méthode des [[modeles-acycliques|modèles acycliques]], les modèles sont les couples $(\Delta_p, \Delta_q)$ de [[simplexe-standard|simplexes standard]], pour $p, q \geqslant 0$, parmi les couples d'espaces topologiques sur lesquels sont définis les foncteurs de chaînes. Un foncteur de chaînes $T$ est libre sur les modèles si chaque $T_n(X, Y)$ a pour base les images, par les $T(f, g)$, d'éléments fixés une fois pour toutes dans des $T_n(M)$, $M$ modèle ; il est [[acyclique-modeles|acyclique sur les modèles]] si chaque complexe $T(\Delta_p, \Delta_q)$ est muni d'une contraction. Le mot n'a pas ici le sens de la logique, où un [[modele|modèle]] d'une théorie est une structure qui en satisfait les énoncés.

- id: classe-ideaux
  terme: classe d'idéaux
  defini_dans: an-classes
  definition: |
    Pour un corps quadratique $K$, d'[[anneau-entiers|anneau des entiers]] $\mathcal O$, deux [[ideal|idéaux]] non nuls $I$ et $J$ de $\mathcal O$ sont dans la même classe, ce que l'on note $I \sim J$, s'il existe $\alpha, \beta \in \mathcal O$ non nuls tels que $\alpha I = \beta J$ ; c'est une [[relation-equivalence|relation d'équivalence]], et la classe de $I$ est notée $[I]$. Les [[ideal-principal|idéaux principaux]] non nuls forment une seule classe, celle de $\mathcal O$, et les classes forment, pour le produit $[I][J] = [IJ]$, le [[groupe-classes|groupe des classes]] $\operatorname{Cl}(K)$. Deux idéaux d'une même classe ne sont pas égaux en général : $(2)$ et $(3)$ sont dans la classe de $\mathcal O$.

- id: relation-recursive
  terme: relation récursive
  defini_dans: cal-recursives
  definition: |
    Une relation $R \subset \mathbb N^n$ est récursive si sa [[fonction-caracteristique-relation|fonction caractéristique]] $\chi_R$, égale à $1$ sur $R$ et à $0$ ailleurs, est une [[fonction-recursive|fonction récursive]], nécessairement définie partout. Toute [[relation-primitive-recursive|relation primitive récursive]] est récursive, et les relations récursives sont stables par les connecteurs, par substitution de fonctions récursives totales et par les quantifications bornées $\exists z < y$ et $\forall z < y$. Un ensemble $A \subset \mathbb N$, relation unaire, est récursif au même sens. Le point essentiel est que $\chi_R$ soit définie partout : une fonction récursive partielle égale à $1$ sur $R$ et indéfinie ailleurs ne suffit pas, car elle ne permet pas de conclure qu'un $n$-uplet n'est pas dans $R$.

- id: ideal-radical
  terme: idéal radical
  defini_dans: ga-nilradical
  definition: |
    Un [[ideal|idéal]] $I$ d'un anneau commutatif est radical s'il est égal à son [[radical-ideal|radical]] $\sqrt I$, c'est-à-dire si $x^n \in I$, pour un entier $n \geqslant 1$, entraîne $x \in I$. Tout [[ideal-premier|idéal premier]] est radical, et le radical de tout idéal est un idéal radical, puisque $\sqrt{\sqrt I} = \sqrt I$. Dans $\mathbb Z$, l'idéal $(12)$ n'est pas radical : $6^2 \in (12)$, et son radical est $(6)$.

- id: action-conjugaison
  terme: action par conjugaison
  defini_dans: gf-actions
  definition: |
    Un [[groupe]] $G$ agit sur lui-même par conjugaison, $g \cdot x = gxg^{-1}$ : c'est une [[action-groupe|action]], puisque $exe^{-1} = x$ et $g(hxh^{-1})g^{-1} = (gh)x(gh)^{-1}$. Ses orbites sont les [[classe-conjugaison|classes de conjugaison]], le [[stabilisateur]] de $x$ est son [[centralisateur]], et ses points fixes forment le [[centre-groupe|centre]] de $G$. Pour chaque $g$, la conjugaison par $g$, $x \mapsto gxg^{-1}$, est un [[isomorphisme]] de $G$ sur lui-même. On fait agir de même $G$ par conjugaison sur l'ensemble de ses sous-groupes, $g \cdot H = gHg^{-1}$, ou sur un sous-groupe distingué. Ce n'est pas la conjugaison des nombres complexes.

- id: nombre-fermat-entier
  terme: nombre de Fermat
  defini_dans: gc-fermat
  definition: |
    Pour $j \in \mathbb N$, le $j$-ième nombre de Fermat est $F_j = 2^{2^j} + 1$ : $F_0 = 3$, $F_1 = 5$, $F_2 = 17$, $F_3 = 257$ et $F_4 = 65\,537$ sont premiers, mais $F_5 = 2^{32} + 1 = 641 \times 6\,700\,417$ ne l'est pas. Un nombre de Fermat qui est premier est un [[nombre-fermat|nombre premier de Fermat]]. Si $2^m + 1$ est premier, avec $m \geqslant 1$, alors $m$ est une puissance de $2$, et $2^m + 1$ est un nombre de Fermat ; la réciproque est fausse, comme le montre $F_5$.

- id: probabilite
  terme: probabilité (mesure)
  defini_dans: p-espace
  definition: |
    Une probabilité sur un ensemble $\Omega$ muni d'une [[tribu]] $\mathcal A$ est une [[mesure]] $P$ sur $(\Omega, \mathcal A)$ de masse totale $P(\Omega) = 1$ ; le triplet $(\Omega, \mathcal A, P)$ est alors un [[espace-probabilise|espace probabilisé]]. Le mot désigne ici la mesure tout entière, non le nombre $P(A)$ attaché à un événement $A$, que l'on appelle aussi la probabilité de $A$ : l'erreur à éviter est de confondre la fonction $A \mapsto P(A)$ avec l'une de ses valeurs. Sur un ensemble fini ou dénombrable muni de toutes ses parties, une probabilité est donnée par des poids $p(x) \geqslant 0$ de somme $1$, avec $P(A) = \sum_{x \in A} p(x)$.

- id: endomorphisme
  terme: endomorphisme
  defini_dans: v-applications
  definition: |
    Une [[application-lineaire|application linéaire]] d'un espace vectoriel $E$ dans lui-même ; leur ensemble est noté $\mathcal L(E) = \mathcal L(E, E)$. On parle de même d'endomorphisme d'un [[groupe]], d'un [[anneau]] ou d'un [[module]] : c'est un [[morphisme-groupes|morphisme de groupes]], un [[morphisme-anneaux|morphisme d'anneaux]] ou une [[application-a-lineaire|application linéaire]] de cet objet dans lui-même.

- id: matrice-diagonale
  terme: matrice diagonale
  notation: '$\operatorname{diag}(d_1, \dots, d_n)$'
  defini_dans: v-matrices
  definition: |
    Une [[matrice]] carrée $A = (a_{ij})$ de taille $n$ est diagonale si $a_{ij} = 0$ pour $i \neq j$ ; on la note $\operatorname{diag}(a_{11}, \dots, a_{nn})$. La même définition vaut sur un [[anneau-commutatif|anneau commutatif]].

- id: matrice-diagonale-blocs
  terme: matrice diagonale par blocs
  notation: '$\operatorname{diag}(A_1, \dots, A_k)$'
  defini_dans: v-matrices
  definition: |
    Pour des [[matrice|matrices]] carrées $A_1, \dots, A_k$ de tailles $n_1, \dots, n_k$, la matrice $\operatorname{diag}(A_1, \dots, A_k)$, de taille $n = n_1 + \cdots + n_k$, porte les blocs $A_i$ le long de la diagonale, $A_i$ occupant les lignes et les colonnes d'indices $n_1 + \cdots + n_{i-1} + 1$ à $n_1 + \cdots + n_i$, et tous ses autres coefficients sont nuls. Une [[matrice-diagonale|matrice diagonale]] en est le cas où tous les blocs sont de taille $1$. La même définition vaut sur un anneau commutatif.

- id: matrice-inversible
  terme: matrice inversible
  defini_dans: v-matrices
  definition: |
    Une [[matrice]] carrée $A \in \mathcal M_n(K)$ est inversible s'il existe $B \in \mathcal M_n(K)$ telle que $AB = BA = I_n$, c'est-à-dire si $A$ est un élément [[inversible]] du [[monoide|monoïde]] $\mathcal M_n(K)$ muni du produit ; son inverse $B$ est unique, noté $A^{-1}$. C'est le cas si et seulement si $A$ est la [[matrice-application-lineaire|matrice]] d'un [[isomorphisme]] dans des bases, et les matrices inversibles forment le [[groupe-lineaire|groupe linéaire]] $GL_n(K)$. La même définition vaut sur un [[anneau-commutatif|anneau commutatif]].

- id: matrice-passage
  terme: matrice de passage
  defini_dans: v-matrices
  definition: |
    Si $\mathcal B$ et $\mathcal B'$ sont deux [[base-vectorielle|bases]] d'un espace vectoriel $E$ de dimension finie, la matrice de passage de $\mathcal B$ à $\mathcal B'$ est $P = \operatorname{Mat}_{\mathcal B', \mathcal B}(\mathrm{id}_E)$, [[matrice-application-lineaire|matrice]] de l'identité avec $\mathcal B'$ au départ et $\mathcal B$ à l'arrivée : sa $j$-ième colonne contient les [[coordonnees-base|coordonnées]] du $j$-ième vecteur de $\mathcal B'$ dans $\mathcal B$. Elle est [[matrice-inversible|inversible]], d'inverse la matrice de passage de $\mathcal B'$ à $\mathcal B$, et les colonnes $X$ et $X'$ des coordonnées d'un même vecteur dans $\mathcal B$ et dans $\mathcal B'$ vérifient $X = PX'$ : elle exprime les anciennes coordonnées en fonction des nouvelles.

- id: rang-matrice
  terme: rang d'une matrice
  notation: '$\operatorname{rg} A$'
  defini_dans: v-matrices
  definition: |
    Le rang d'une [[matrice]] $A \in \mathcal M_{p,n}(K)$ est la [[dimension]] du [[sous-espace-engendre|sous-espace]] de $K^p$ engendré par ses colonnes, c'est-à-dire de l'image de l'[[application-lineaire|application linéaire]] $x \mapsto Ax$ de $K^n$ dans $K^p$.
