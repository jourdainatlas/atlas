# Niveau 0 : l'édifice entier, de la logique aux grandes théories.
# Les arêtes vont de la notion requise vers la notion qui la requiert.
# Le script de construction ne trace que la réduction transitive.

graphe: edifice
titre: L'édifice
conteneur: null

noeuds:
  - id: top
    etiquette: Structures topologiques
    nature: théorie
    famille: top
    sous: top
    choix: |
      Le théorème de Tychonov, selon lequel tout produit d'espaces [[compact|compacts]] est compact, équivaut à l'[[axiome-choix]] pour des espaces quasi-compacts quelconques (Kelley, 1950), et au lemme de l'ultrafiltre pour des espaces séparés.
    texte: |
      Un [[espace-topologique]] est un ensemble muni d'une famille d'[[ouvert|ouverts]] stable par réunion quelconque et par intersection finie. Les notions de [[voisinage]], de [[continuite]], d'espace [[separe]], [[compact]] et [[connexe]] s'en déduisent.
    remarques:
      - |
        Les [[espace-metrique|espaces métriques]], qui demandent d'abord la construction de $\mathbb R$, en fourniront la classe d'exemples la plus utilisée en analyse.

  - id: log
    etiquette: Logique du premier ordre
    nature: théorie
    famille: fond
    sous: log
    texte: |
      Un langage du premier ordre comporte des variables, des symboles de relation et de fonction, les connecteurs $\neg, \wedge, \vee, \Rightarrow, \Leftrightarrow$ et les quantificateurs $\forall, \exists$, qui portent sur les éléments et jamais sur les parties ni sur les propriétés.

      Une **démonstration** à partir d'une théorie $T$ est une suite finie de formules dont chacune est un axiome logique, un axiome de $T$, ou se déduit des précédentes par une règle d'inférence. Le théorème de complétude de Gödel (1929) affirme qu'une formule est démontrable dans $T$ si et seulement si elle est vraie dans tous les modèles de $T$.

  - id: zf
    etiquette: Axiomes de ZF
    nature: théorie
    famille: fond
    sous: zf
    texte: |
      $\mathsf{ZF}$ est la théorie du premier ordre sur le seul symbole $\in$ dont les axiomes sont l'extensionnalité, la paire, la réunion, les parties, l'infini, la fondation, et les schémas de séparation et de remplacement. Tout objet y est un [[ensemble]].

      $\mathsf{ZFC}$ ajoute l'[[axiome-choix]]. Si $\mathsf{ZF}$ est cohérente, $\mathsf{ZFC}$ l'est aussi (Gödel, 1938), de même que $\mathsf{ZF} + \neg\mathsf{AC}$ (Cohen, 1963).

  - id: rel
    etiquette: Relations, fonctions
    nature: théorie
    famille: fond
    sous: rel
    texte: |
      Le [[couple]] de Kuratowski $(a,b) = \{\{a\},\{a,b\}\}$ vérifie $(a,b) = (c,d) \Leftrightarrow (a = c \text{ et } b = d)$. Il permet de définir le [[produit-cartesien]], puis les [[relation|relations]] et les [[application|applications]], identifiées à leurs graphes. Une application est une [[bijection]] si tout élément de l'ensemble d'arrivée a exactement un antécédent, et deux ensembles sont [[equipotent|équipotents]] s'il existe une bijection de l'un sur l'autre. Aucun ensemble n'est équipotent à l'ensemble de ses parties (Cantor), et deux ensembles qui s'injectent chacun dans l'autre sont équipotents (Cantor-Bernstein), sans recours à l'axiome du choix.

    remarques:
      - |
        Les relations d'équivalence et les ensembles quotients sont l'outil de toutes les constructions de la colonne des nombres, de {{z|$\mathbb Z$}} à {{c|$\mathbb C$}}.

  - id: ordin
    etiquette: Ordinaux, cardinaux
    nature: théorie
    famille: fond
    sous: ordin
    texte: |
      Un [[ordinal]] est un [[ensemble-transitif]] bien ordonné par $\in$. Tout [[bon-ordre]] est isomorphe à un unique ordinal, par un unique isomorphisme.

      Un [[cardinal]] est un ordinal qui n'est [[equipotent]] à aucun ordinal strictement plus petit. Sous l'[[axiome-choix]], tout ensemble est équipotent à un unique cardinal ; sans lui, la comparaison des tailles de deux ensembles quelconques n'est plus garantie.

  - id: ord
    etiquette: Structures d'ordre
    nature: théorie
    famille: ord
    sous: ord
    texte: |
      Une [[relation-ordre]] est réflexive, antisymétrique et transitive. Les notions de [[majorant]], de [[borne-superieure]], d'[[ordre-total]] et de [[bon-ordre]] s'en déduisent, ainsi que celles d'[[intervalle]] et de [[segment]] dans un ensemble totalement ordonné.

      Le lemme de Zorn porte sur les ensembles ordonnés [[inductif-ordre|inductifs]], où toute [[chaine]] est majorée.

      Le théorème du point fixe de Knaster-Tarski, la [[propriete-borne-superieure|propriété de la borne supérieure]] et les [[coupure-dedekind|coupures de Dedekind]] sont purement d'ordre : ils ne mentionnent aucune opération.
    remarques:
      - |
        Le mot « inductif » a ici un sens différent de celui qu'il a pour {{n|$\mathbb N$}}, où il désigne un ensemble contenant $\varnothing$ et stable par successeur.
      - |
        Les coupures de Dedekind de l'ordre de {{q|$\mathbb Q$}} fourniront la construction de {{r|$\mathbb R$}}, et les bons ordres celle des {{ordin|ordinaux}}.

  - id: alg
    etiquette: Structures algébriques
    nature: théorie
    famille: alg
    sous: alg
    texte: |
      Ce sont les ensembles munis de lois de composition $E \times E \to E$ soumises à des axiomes : [[groupe|groupes]], [[anneau|anneaux]], [[corps]], [[module|modules]].

      Les [[groupe-quotient|groupes quotients]] et les quotients d'un anneau par un [[ideal|idéal]] sont l'outil commun de toutes ces théories. Le [[groupe-symetrise|symétrisé]] d'un monoïde et le [[corps-fractions|corps des fractions]] d'un anneau intègre y sont construits en toute généralité, avant même les entiers.
    remarques:
      - |
        Le passage au quotient par un sous-groupe distingué ou par un idéal fournit les constructions de $\mathbb Z/n\mathbb Z$, de $\mathbb C = \mathbb R[X]/(X^2+1)$ et, plus généralement, des extensions de corps.

  - id: n
    etiquette: ℕ
    titre: Les entiers naturels
    nature: théorie
    famille: n
    sous: n
    texte: |
      $\lex{ensemble-entiers-naturels}{\mathbb N} = \omega$ est le plus petit ensemble [[inductif-successeur|inductif]] ; son existence est garantie par l'axiome de l'infini. Muni de $0 = \varnothing$ et du successeur $S(n) = n \cup \{n\}$, il vérifie les axiomes de Peano, qui deviennent ici des théorèmes.

      Chaque entier est l'ensemble des entiers qui le précèdent : $3 = \{0, 1, 2\}$. L'addition et la multiplication se définissent par récurrence sur le second argument.

      Une fois $\mathbb N$ construit, une [[suite]] d'éléments d'un ensemble $E$ est une application de $\mathbb N$ dans $E$, et un ensemble est [[denombrable]] s'il est équipotent à $\mathbb N$. Le [[choix-denombrable]] est l'axiome du choix restreint aux familles indexées par $\mathbb N$.

  - id: z
    etiquette: ℤ
    nature: théorie
    famille: z
    sous: z
    texte: |
      On munit $\lex{ensemble-entiers-naturels}{\mathbb N} \times \mathbb N$ de la [[relation-equivalence]] définie par $(a,b) \sim (c,d) \Leftrightarrow a + d = b + c$ ; la classe de $(a,b)$ représente $a - b$. Le [[ensemble-quotient|quotient]], muni des opérations induites, est un [[anneau]] commutatif [[anneau-integre|intègre]], le [[groupe-symetrise|symétrisé]] du monoïde $(\mathbb N, +)$ muni de la multiplication induite, dans lequel $\mathbb N$ se plonge par $n \mapsto \overline{(n,0)}$.

  - id: q
    etiquette: ℚ
    nature: théorie
    famille: q
    sous: q
    texte: |
      $\lex{ensemble-rationnels}{\mathbb Q}$ est le [[corps-fractions|corps des fractions]] de $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ : le quotient de $\mathbb Z \times (\mathbb Z \setminus \{0\})$ par $(a,b) \sim (c,d) \Leftrightarrow ad = bc$.

      C'est un [[corps-ordonne|corps totalement ordonné]] [[archimedien]]. Il lui manque une propriété essentielle : la partie $\{x \in \mathbb Q : x^2 < 2\}$, non vide et majorée, n'admet pas de [[borne-superieure]] dans $\mathbb Q$.

  - id: r
    etiquette: ℝ
    nature: théorie
    famille: r
    sous: r
    texte: |
      $\lex{ensemble-reels}{\mathbb R}$ est un [[corps-ordonne|corps totalement ordonné]] dans lequel toute partie non vide et [[majorant|majorée]] admet une [[borne-superieure]].

      Un tel corps existe : on le construit par les [[coupure-dedekind|coupures de Dedekind]] de $\lex{ensemble-rationnels}{\mathbb Q}$, ou comme quotient de l'anneau des [[suite-cauchy|suites de Cauchy]] rationnelles par l'[[ideal|idéal]] des suites de limite nulle. Il est unique à isomorphisme de corps ordonnés près, et cet isomorphisme est lui-même unique.

  - id: c
    etiquette: ℂ
    nature: théorie
    famille: c
    sous: c
    texte: |
      $\lex{ensemble-complexes}{\mathbb C} = \lex{anneau-polynomes}{\mathbb R[X]}/(X^2+1)$ est le quotient d'un [[anneau]] par un [[ideal-maximal|idéal maximal]], donc un [[corps]]. La classe $i$ de $X$ vérifie $i^2 = -1$, et tout élément s'écrit de manière unique $a + ib$ avec $a, b \in \lex{ensemble-reels}{\mathbb R}$.

      Aucun ordre total n'en fait un [[corps-ordonne|corps ordonné]], puisque dans un tel corps tout carré est positif et l'on aurait $-1 = i^2 \geqslant 0$. $\mathbb C$ est algébriquement clos, mais toutes les démonstrations connues de ce fait utilisent une propriété analytique de $\mathbb R$.

  - id: analyse-reelle
    etiquette: Analyse réelle
    nature: théorie
    famille: ana
    sous: analyse-reelle
    texte: |
      L'analyse réelle étudie les fonctions de $\lex{ensemble-reels}{\mathbb R}$ dans $\mathbb R$ : limites, [[continuite]], dérivation, intégration. Elle repose sur la propriété de la [[borne-superieure]], qui distingue $\mathbb R$ de $\lex{ensemble-rationnels}{\mathbb Q}$, et sur la topologie de $\mathbb R$.

  - id: anc
    etiquette: Analyse complexe
    nature: théorie
    famille: mix
    sous: anc
    texte: |
      Elle étudie les fonctions holomorphes, c'est-à-dire [[derivable|dérivables]] au sens complexe en tout point d'un [[ouvert]] de $\lex{ensemble-complexes}{\mathbb C}$.

      La formule de Cauchy entraîne qu'une fonction holomorphe est développable en série entière au voisinage de chaque point. Ce phénomène n'a pas d'équivalent en analyse réelle, où une fonction peut être dérivable une fois sans l'être deux.

      L'exponentielle, les fonctions trigonométriques et le nombre $\pi$ y sont construits par les [[serie-entiere|séries entières]] ; le théorème de Liouville y démontre que $\mathbb C$ est algébriquement clos.

      Près d'un point isolé où elle n'est pas définie, une fonction holomorphe se développe en série de Laurent, dont le coefficient de $\frac{1}{z - a}$ est le résidu. Le théorème des résidus ramène à ces coefficients l'intégrale le long d'un lacet ; il donne le principe de l'argument, le théorème de Rouché, qui localise les racines d'un polynôme, et le calcul d'intégrales réelles.

  - id: mes
    etiquette: Mesure, intégration
    nature: théorie
    famille: ana
    sous: mes
    choix: |
      La $\sigma$-additivité de la mesure de Lebesgue n'est pas démontrable dans $\mathsf{ZF}$ seul : elle requiert le [[choix-denombrable]]. Dans le modèle de Feferman et Levy, $\lex{ensemble-reels}{\mathbb R}$ est une réunion dénombrable d'ensembles dénombrables.
    texte: |
      Une tribu sur $X$ est une partie de $\lex{ensemble-parties}{\mathcal P}(X)$ contenant $X$, stable par complémentaire et par réunion [[denombrable]]. Une mesure est une application $\mu$ définie sur une tribu, à valeurs dans $\lex{demi-droite-achevee}{[0, +\infty]}$, nulle en $\varnothing$ et $\sigma$-additive :
      $$\mu\Big(\bigcup_{n \in \lex{ensemble-entiers-naturels}{\mathbb N}} A_n\Big) = \sum_{n \in \mathbb N} \mu(A_n) \quad \text{pour des } A_n \text{ deux à deux disjoints.}$$

      La mesure de Lebesgue de $\lex{n-uplet}{\mathbb R^n}$ et la formule du changement de variables sont établies au chapitre « Changement de variables » des équations différentielles, qui réunit la mesure et le calcul différentiel.
    remarques:
      - |
        La formule du changement de variables dans $\mathbb R^n$, avec le facteur $|\det d\varphi|$, les coordonnées polaires et l'intégrale de Gauss, est démontrée au chapitre {{edo-changement|Changement de variables}} des équations différentielles, première théorie qui descend à la fois de la mesure, du calcul différentiel et de l'algèbre linéaire.

  - id: proba
    etiquette: Probabilités
    nature: théorie
    famille: mix
    sous: proba
    texte: |
      Un espace probabilisé est un espace mesuré $(\Omega, \mathcal A, P)$ de masse totale $P(\Omega) = 1$ ; c'est l'axiomatique de Kolmogorov (1933). Une variable aléatoire est une application mesurable définie sur $\Omega$, et son espérance est son intégrale par rapport à $P$.

  - id: anf
    etiquette: Analyse fonctionnelle
    nature: théorie
    famille: ana
    sous: anf
    choix: |
      Le théorème de Hahn-Banach découle du lemme de l'ultrafiltre. Les théorèmes de Banach-Steinhaus et de l'application ouverte reposent sur le théorème de Baire, établi avec les {{met|espaces métriques}}, qui équivaut au choix dépendant (Blair, 1977). Le théorème spectral des opérateurs compacts autoadjoints est démontré sans choix ; la base hilbertienne de vecteurs propres, dans un espace qui n'est pas séparable, et la compacité d'une limite quelconque d'opérateurs compacts utilisent ici le choix dénombrable. La complétude des espaces $L^p$ choisit des représentants, et le théorème de Radon-Nikodym hérite, par le théorème de Riesz, du choix d'une suite minimisante ; le dual de $L^p$ en dépend. Le théorème de Riesz-Markov utilise le choix dénombrable, comme la mesure de Lebesgue, qu'il redonne à partir de l'intégrale de Riemann. Le théorème d'Ascoli, pour une partie quelconque, choisit un réseau fini par rayon (choix dénombrable) ; sa forme séquentielle et le théorème de Stone-Weierstrass sont démontrés sans choix, et la séparabilité de $C(K)$ pour un compact métrique quelconque demande le choix dénombrable.
    texte: |
      Elle étudie les espaces vectoriels normés de dimension infinie et les applications linéaires continues entre eux.

      Le théorème de Hahn-Banach prolonge toute forme linéaire continue définie sur un sous-espace en une forme linéaire continue de même norme sur l'espace entier.

      Les espaces $L^p$ sont complets, et, pour une mesure σ-finie et $1 \leqslant p < +\infty$, le dual de $L^p$ est $L^q$, avec $\frac1p + \frac1q = 1$. Le théorème de Radon-Nikodym, démontré par le théorème de Riesz dans un espace de Hilbert, écrit, pour des mesures σ-finies, toute mesure qui ne charge pas les ensembles $\mu$-négligeables comme une mesure de densité par rapport à $\mu$. Sur un espace métrique compact, le théorème de Riesz-Markov identifie les formes linéaires positives sur les fonctions continues aux intégrales contre des mesures.

      Dans l'espace des fonctions continues sur un compact, muni de la norme uniforme, le théorème d'Ascoli caractérise les parties d'adhérence compacte : ce sont les parties bornées et équicontinues. Le théorème de Stone-Weierstrass caractérise des parties denses : toute sous-algèbre qui contient les constantes et sépare les points est dense, ce qui étend le théorème de Weierstrass, démontré par les polynômes de Bernstein, de la densité des polynômes sur un segment à celle des polynômes de plusieurs variables sur un compact de $\lex{n-uplet}{\mathbb R^n}$.

      Sur un espace de Hilbert, un opérateur autoadjoint se diagonalise dans une base orthonormée de vecteurs propres : en dimension finie, par le maximum du quotient de Rayleigh sur la sphère unité, compacte, sans passer par les nombres complexes ; en dimension infinie, lorsque l'opérateur est compact, ses valeurs propres non nulles sont de multiplicité finie et tendent vers $0$. C'est le théorème spectral.

  - id: grtop
    etiquette: Groupes topologiques
    nature: théorie
    famille: mix
    sous: grtop
    texte: |
      Un [[groupe-topologique|groupe topologique]] est un [[groupe]] muni d'une topologie pour laquelle $(x,y) \mapsto xy$ et $x \mapsto x^{-1}$ sont [[continuite|continues]]. Sa topologie est déterminée par les voisinages du neutre, il est séparé dès que le neutre forme un fermé, et ses quotients par des sous-groupes fermés sont séparés.
    remarques:
      - |
        Sur tout groupe localement compact, il existe une mesure de Haar, invariante par translation à gauche et unique à un facteur positif près. Son énoncé demande la théorie de la {{mes|mesure}}.

  - id: cdiff
    etiquette: Calcul différentiel
    nature: théorie
    famille: ana
    sous: cdiff
    texte: |
      Il étudie les applications d'un ouvert de $\lex{n-uplet}{\mathbb R^n}$ dans $\mathbb R^p$ au voisinage de chaque point, en les approchant par des applications linéaires : une application [[differentiable]] est celle dont l'accroissement est, au premier ordre, une application linéaire, sa différentielle. Il repose sur l'analyse réelle, pour les fonctions d'une variable, sur les espaces normés de dimension finie, où toutes les normes sont équivalentes, et sur l'algèbre linéaire.

      Ses résultats centraux sont les accroissements finis, le théorème d'inversion locale, obtenu par un point fixe, et ses conséquences sur les submersions. Ils ne font intervenir aucune variété : les équations différentielles s'en servent directement, et la géométrie différentielle les transporte sur les variétés par les cartes. La formule du changement de variables, qui demande aussi la mesure, est démontrée au chapitre « Changement de variables » des équations différentielles.

      Au second ordre, la formule de Taylor-Young fait apparaître la forme hessienne, une forme quadratique. Le chapitre « Formes quadratiques » en fait la théorie, sur un corps où $2$ est inversible puis sur $\mathbb R$ : bases orthogonales, réduction de Gauss, loi d'inertie de Sylvester et signature, critère des mineurs. Il l'applique aux extremums locaux, que la signature de la hessienne détermine en un point critique non dégénéré.

      Le chapitre « Extremums liés » réunit les deux branches : sur un ensemble de niveau d'une submersion, paramétré par la forme locale des submersions, un extremum de $f$ annule $df$ sur l'espace tangent, ce qui donne les multiplicateurs de Lagrange, et la hessienne du lagrangien restreinte à l'espace tangent décide au second ordre.
    remarques:
      - |
        Le déterminant jacobien $\det d\varphi$ d'un difféomorphisme mesure la déformation des volumes : c'est la formule du changement de variables, démontrée au chapitre {{edo-changement|Changement de variables}} des équations différentielles.

  - id: geod
    etiquette: Géométrie différentielle
    nature: théorie
    famille: geo
    sous: geod
    texte: |
      Elle étudie les variétés différentiables : espaces topologiques [[separe|séparés]] à base au plus dénombrable, localement [[homeomorphisme|homéomorphes]] à $\lex{n-uplet}{\mathbb R^n}$, munis d'un atlas dont les changements de cartes sont de classe $C^\infty$.

      Le calcul différentiel y est transporté par les cartes, et les espaces tangents relèvent de l'algèbre linéaire. Les formes différentielles y sont définies carte par carte ; celles de degré $1$ s'intègrent le long des chemins, et la cohomologie de de Rham mesure la forme globale de la variété.
    remarques:
      - |
        La formule de Stokes, $\int_c d\omega = \int_{\partial c} \omega$, qui relie la différentielle extérieure au bord, est démontrée pour les chaînes de cubes singuliers lisses au nœud {{dr-stokes|Formule de Stokes}} du théorème de de Rham, première théorie qui dispose à la fois des formes différentielles et des chaînes de l'homologie.

  - id: topalg
    etiquette: Topologie algébrique
    nature: théorie
    famille: mix
    sous: topalg
    texte: |
      Elle associe à tout [[espace-topologique]] des invariants algébriques : groupe fondamental, groupes d'homologie. Deux espaces [[homeomorphisme|homéomorphes]] ont des invariants isomorphes, de sorte que des invariants distincts prouvent que deux espaces ne sont pas homéomorphes.

      Les chemins et les homotopies sont paramétrés par le [[segment]] $[0,1]$, dont l'analyse réelle établit qu'il est compact et connexe : c'est ce qui permet de les découper en un nombre fini de morceaux. Le premier résultat, $\lex{groupe-fondamental}{\pi_1}(\lex{sphere-unite}{S^1}) \cong \lex{ensemble-entiers-relatifs}{\mathbb Z}$, fait apparaître les entiers comme invariant topologique.

      Un chapitre est consacré au théorème de Seifert-van Kampen, qui calcule le groupe fondamental d'une réunion de deux ouverts comme un [[produit-amalgame|produit amalgamé]]. Il construit les [[groupe-libre|groupes libres]], par les mots réduits, les présentations par générateurs et relations, le produit libre et le produit amalgamé, puis démontre le théorème en découpant les lacets et les homotopies par le nombre de Lebesgue. Il en tire que les sphères $S^n$ sont simplement connexes pour $n \geqslant 2$, que le groupe fondamental du bouquet de deux cercles est libre à deux générateurs, et que celui du tore est $\mathbb Z^2$.

  - id: gf
    etiquette: Groupes finis
    nature: théorie
    famille: alg
    sous: gf
    texte: |
      Elle étudie les [[groupe|groupes]] qui n'ont qu'un nombre fini d'éléments. Le théorème de Lagrange contraint les ordres des sous-groupes, et les actions de groupe, en particulier par conjugaison, permettent de compter : l'équation aux classes, puis les théorèmes de Sylow, produisent des sous-groupes distingués à partir de la seule arithmétique de l'ordre. Elle repose sur les structures algébriques, sur $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ et ses quotients, et sur l'algèbre linéaire, qui fournit le groupe symétrique et sa signature.

      Le graphe intérieur classe les groupes abéliens finis, puis les vingt-quatre groupes d'ordre au plus $12$ ; un document de référence, téléchargeable depuis le nœud qui les dresse, les décrit un par un. Il montre enfin que tout groupe d'ordre inférieur à $60$ est résoluble, ce qui fait du groupe alterné $\mathfrak A_5$ le plus petit groupe non résoluble.

      Un chapitre est consacré au théorème de Jordan-Hölder : les quotients simples successifs d'une suite de composition, les facteurs de composition, ne dépendent pas de la suite, à l'ordre et à isomorphisme près. Il passe par les théorèmes d'isomorphisme, le lemme du papillon de Zassenhaus et le théorème de raffinement de Schreier, démontre que $\mathfrak A_5$ est simple, et caractérise les groupes finis résolubles comme ceux dont les facteurs de composition sont d'ordre premier.
    remarques:
      - |
        Les représentations linéaires des groupes finis, qui demandent les nombres complexes pour le lemme de Schur et pour les caractères, sont étudiées au chapitre {{galois-representations|Représentations des groupes finis}} de la théorie de Galois, première théorie qui descende à la fois de celle-ci et de $\mathbb C$. On y voit notamment que $\mathcal D_4$ et $\mathcal Q_8$ ont la même table des caractères.

  - id: ac
    etiquette: Algèbre commutative
    nature: théorie
    famille: alg
    sous: ac
    choix: |
      Le choix dépendant intervient en deux endroits : pour déduire de la stationnarité des suites croissantes d'idéaux qu'ils sont de type fini, et pour obtenir l'existence des factorisations dans un anneau principal quelconque. Il s'ensuit pour les modules sur un anneau principal quelconque que l'existence des diviseurs élémentaires demande la factorisation, que ZF seul ne démontre pas pour tous les anneaux principaux (Hodges, 1976) ; la forme normale de Smith, le théorème de structure et l'unicité des facteurs invariants sont démontrés sans choix. Pour $\mathbb Z$ et $K[X]$, la valeur absolue et le degré permettent de s'en passer, si bien que les diviseurs élémentaires y sont aussi obtenus sans choix. Le lemme de Gauss, le théorème de Hilbert, la localisation, le lemme de Nakayama et les sous-modules d'un module libre sont démontrés sans aucun choix.
    texte: |
      Elle étudie les [[anneau|anneaux]] commutatifs et leurs [[ideal|idéaux]], en prolongeant l'arithmétique de $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ et des polynômes : divisibilité, factorisation unique et ses défaillances, finitude des idéaux. Elle repose sur les structures algébriques, sur $\mathbb Z$ et ses anneaux de polynômes, et sur l'algèbre linéaire, qui sert au lemme de Nakayama et à la réduction des endomorphismes.

      Le graphe intérieur démontre qu'un anneau principal est factoriel, que la factorialité passe de $A$ à $A[X]$ (Gauss) et la noethérianité aussi (théorème de la base de Hilbert), puis construit la localisation, qui permet d'étudier un anneau près d'un idéal premier. C'est le socle de la géométrie algébrique et de la théorie algébrique des nombres.

      Un chapitre y mène la réduction des endomorphismes en dimension finie, que l'algèbre linéaire ne peut pas traiter faute de polynômes : polynôme minimal, lemme des noyaux, qui est le lemme chinois dans $K[X]$, polynôme caractéristique et théorème de Cayley-Hamilton, diagonalisation et trigonalisation, décomposition de Dunford et forme de Jordan.

      Un second chapitre décrit les modules de type fini sur un anneau principal : forme normale de Smith d'une matrice, base adaptée, théorème de structure, facteurs invariants et diviseurs élémentaires. Il en tire la structure des groupes abéliens de type fini, et, pour l'anneau $K[X]$, la forme de Frobenius d'un endomorphisme et un critère de similitude valable sur tout corps.

  - id: galois
    etiquette: Théorie de Galois
    nature: théorie
    famille: mix
    sous: galois
    texte: |
      Elle associe à une extension de corps $L/K$ le groupe $\lex{groupe-galois}{\operatorname{Gal}}(L/K)$ des automorphismes de $L$ qui fixent $K$. Pour une extension galoisienne, la correspondance de Galois met en bijection les sous-groupes de ce groupe et les corps intermédiaires.

      Un polynôme est résoluble par radicaux seulement si son groupe de Galois est résoluble ; comme $\lex{groupe-symetrique}{\mathfrak S_5}$ ne l'est pas, il n'existe pas de formule générale par radicaux pour les équations de degré $5$ (Abel, Ruffini, Galois).

      Première théorie qui descende à la fois des groupes finis et de $\lex{ensemble-complexes}{\mathbb C}$, elle accueille aussi un chapitre sur les représentations linéaires des groupes finis : théorème de Maschke, lemme de Schur, caractères et relations d'orthogonalité, nombre de classes d'isomorphisme de représentations irréductibles égal au nombre de classes de conjugaison, et tables des caractères de $\mathfrak S_3$, de $\mathfrak S_4$, du groupe diédral $\mathcal D_4$ et du groupe des quaternions, qui ont la même table sans être isomorphes.

  - id: met
    etiquette: Espaces métriques et normés
    nature: théorie
    famille: ana
    sous: met
    choix: |
      La caractérisation des fermés par les suites et la réciproque du théorème de compacité séquentielle utilisent le [[choix-denombrable]], la seconde aussi le choix dépendant dans la démonstration donnée. Le théorème de Baire équivaut au choix dépendant (Blair, 1977). Le lemme du nombre de Lebesgue et le théorème de Heine sur un compact métrique sont démontrés sans aucun choix.
    texte: |
      Un [[espace-metrique]] est un ensemble muni d'une distance. Ses boules ouvertes engendrent une topologie séparée, et les notions de suite convergente, de [[suite-cauchy|suite de Cauchy]] et d'espace [[espace-complet|complet]] s'y expriment par des inégalités. Une [[norme]] sur un espace vectoriel réel définit une distance invariante par translation : c'est le cadre commun du calcul différentiel dans $\lex{n-uplet}{\mathbb R^n}$ et de l'analyse fonctionnelle.

      Sur un espace métrique [[compact]], tout recouvrement ouvert a un [[nombre-lebesgue|nombre de Lebesgue]], ce qui donne le théorème de Heine, et la compacité équivaut à la compacité séquentielle. Dans $\mathbb R^n$, les compacts sont les fermés bornés et toutes les normes sont équivalentes. Dans un espace complet, une application [[contractante|contractante]] a un unique point fixe (Banach), et une intersection dénombrable d'ouverts denses est dense (Baire).
    remarques:
      - |
        Toute distance définit une topologie séparée, mais toute topologie ne provient pas d'une distance : la topologie grossière d'un ensemble à deux points n'est pas séparée, et le produit $[0, 1]^{[0, 1]}$ des {{top|structures topologiques}} est compact sans être séquentiellement compact, ce qu'aucun espace métrique ne peut être.

  - id: fourier
    etiquette: Analyse de Fourier
    nature: théorie
    famille: mix
    sous: fourier
    texte: |
      Elle décompose les fonctions en superpositions d'oscillations. Sur un intervalle, le système trigonométrique est une base hilbertienne de $\lex{espace-L2}{L^2}$ ; sur la droite, la transformée de Fourier $\hat f(\xi) = \int f(x)e^{-ix\xi}\,dx$ s'inverse et préserve la norme de $L^2$ à un facteur près (Plancherel).

      Appliquée aux lois de probabilité, elle donne les fonctions caractéristiques, qui caractérisent les lois et transforment les sommes de variables indépendantes en produits.

  - id: edo
    etiquette: Équations différentielles
    nature: théorie
    famille: mix
    sous: edo
    texte: |
      Elle étudie les équations $y' = F(t, y)$. Le théorème de Cauchy-Lipschitz, obtenu par un point fixe dans un espace de Banach, donne l'existence et l'unicité locales lorsque $F$ est lipschitzienne en $y$ ; le lemme de Grönwall contrôle la dépendance par rapport aux conditions initiales. Lorsque $F$ est seulement continue, le théorème de Peano donne encore l'existence, par le théorème d'Ascoli appliqué aux polygones d'Euler, mais plus l'unicité.

      Les systèmes linéaires se résolvent par l'exponentielle de matrices. Le flot d'un champ de vecteurs de classe $C^k$ est de classe $C^k$, et sa différentielle par rapport à la condition initiale résout l'équation variationnelle, ce que démontre Grönwall appliqué au reste de Taylor ; les champs de vecteurs d'une variété compacte engendrent des flots, groupes à un paramètre de transformations.

      C'est la première théorie de l'édifice dont la mesure, le calcul différentiel, l'algèbre linéaire et l'analyse complexe sont tous des ancêtres : la formule du changement de variables dans $\lex{n-uplet}{\mathbb R^n}$, $\int_V f = \int_U f \circ \varphi\,|\det d\varphi|$ pour un difféomorphisme $\varphi$ de $U$ sur $V$, y est démontrée, avec les coordonnées polaires et l'intégrale de Gauss. Appliquée au flot, elle donne le théorème de Liouville : le flot d'un champ de divergence nulle conserve le volume.

      La stabilité d'un équilibre au sens de Liapounov s'y étudie de deux façons : par une fonction qui décroît le long des trajectoires, comme l'énergie du pendule amorti, complétée par le principe d'invariance de LaSalle ; et par linéarisation, l'équilibre étant asymptotiquement stable si toutes les valeurs propres complexes de la différentielle du champ ont une partie réelle strictement négative, et instable si l'une d'elles a une partie réelle strictement positive.

  - id: lie
    etiquette: Groupes de Lie
    nature: théorie
    famille: mix
    sous: lie
    texte: |
      Un groupe de Lie est un groupe muni d'une structure de variété pour laquelle les opérations sont lisses : $\lex{groupe-lineaire}{GL_n}(\lex{ensemble-reels}{\mathbb R})$, le groupe orthogonal, les rotations. L'exponentielle de matrices relie le groupe à son algèbre de Lie, espace vectoriel muni du crochet $[A, B] = AB - BA$, qui en est la version infinitésimale.

  - id: mart
    etiquette: Martingales
    nature: théorie
    famille: ana
    sous: mart
    texte: |
      L'espérance conditionnelle par rapport à une sous-tribu est la projection orthogonale de $\lex{espace-L2}{L^2}$ sur le sous-espace des variables mesurables pour cette sous-tribu. Une martingale est une suite de variables dont chacune est l'espérance conditionnelle de la suivante sachant le passé : c'est le modèle d'un jeu équitable.

      Les martingales bornées dans $L^2$ convergent presque sûrement, ce qui donne la convergence de séries aléatoires et le comportement limite de processus de renforcement.

  - id: tan
    etiquette: Théorie algébrique des nombres
    nature: théorie
    famille: ari
    sous: tan
    texte: |
      Elle étudie les anneaux d'entiers des corps de nombres, extensions finies de $\lex{ensemble-rationnels}{\mathbb Q}$ : les entiers de Gauss $\lex{entiers-gauss}{\mathbb Z[i]}$, les anneaux $\mathbb Z[\sqrt d]$. La factorisation unique en irréductibles peut y échouer, comme dans $\mathbb Z[\sqrt{-5}]$, où $6 = 2 \cdot 3 = (1 + \sqrt{-5})(1 - \sqrt{-5})$ ; elle est restaurée au niveau des idéaux (Kummer, Dedekind).

      Un chapitre est consacré à la loi de réciprocité quadratique, qui relie, pour deux nombres premiers impairs distincts $p$ et $q$, les réponses aux questions « $p$ est-il un carré modulo $q$ ? » et « $q$ est-il un carré modulo $p$ ? », démontrée par le lemme de Gauss et le comptage, dû à Eisenstein, des points d'un réseau, puis par les sommes de Gauss dans un corps fini ; il contient aussi les théorèmes de Fermat et de Wilson.

  - id: hom
    etiquette: Homologie
    nature: théorie
    famille: mix
    sous: hom
    texte: |
      Elle associe à tout espace topologique des groupes abéliens $\lex{homologie-singuliere}{H_n}(X)$, construits à partir des simplexes singuliers $\Delta_n \to X$ : les cycles modulo les bords. Ces groupes sont invariants par homotopie et se calculent par des suites exactes, comme celle de Mayer-Vietoris.

      Le calcul $H_n(\lex{sphere-unite}{S^n}) \cong \lex{ensemble-entiers-relatifs}{\mathbb Z}$ donne le théorème du point fixe de Brouwer et l'invariance de la dimension.

      Un chapitre démontre le théorème de Jordan : une courbe fermée du plan sans point double sépare le plan en deux régions, l'une bornée, l'autre non, dont elle est la frontière commune. Il le fait en toute dimension, sous la forme de Jordan-Brouwer, en calculant l'homologie du complémentaire d'une sphère topologique de $S^n$, et en déduit l'invariance du domaine.

  - id: derham
    etiquette: Théorème de de Rham
    nature: théorie
    famille: mix
    sous: derham
    texte: |
      Pour une variété différentiable $M$, l'intégration des formes différentielles sur les simplexes singuliers lisses définit un isomorphisme entre la cohomologie de de Rham $\lex{cohomologie-de-rham}{H^k_{\mathrm{dR}}}(M)$ et la cohomologie singulière à coefficients réels, dual de l'homologie singulière.

      Le graphe intérieur développe le degré $1$ pour les ouverts de $\lex{n-uplet}{\mathbb R^n}$ : une forme fermée s'intègre le long de chemins seulement continus grâce à ses primitives locales, l'intégrale est invariante par homotopie, et elle définit un isomorphisme de $H^1$ sur le dual réel de $H_1$. L'injectivité s'obtient par intégration le long de lignes brisées, la surjectivité par recollement de primitives locales au moyen d'une partition de l'unité. Sur $\mathbb R^2 \setminus \{0\}$, on obtient $H^1 \cong \mathbb R$.

      La formule de Stokes $\int_z d\omega = \int_{\partial z} \omega$ y est démontrée en tout degré, pour les chaînes de cubes singuliers lisses, par le théorème de Fubini pour les fonctions continues et le théorème fondamental de l'analyse sur le cube unité. Elle montre que l'intégrale d'une forme exacte sur un cycle est nulle, caractérise les formes fermées par leurs intégrales sur le bord des petits cubes, et donne la formule de Green-Riemann et le théorème de la divergence sur un pavé. La version pour une variété compacte orientée à bord demande les variétés à bord, que l'atlas ne définit pas, et la formule du changement de variables, qui n'est pas un ancêtre de cette théorie ; l'isomorphisme de de Rham en degré supérieur, qui demande en outre un recollement par Mayer-Vietoris, n'est pas développé.

    remarques:
      - |
        En degré $1$ sur $\lex{n-uplet}{\mathbb R^2} \setminus \{0\}$, le théorème dit qu'une forme fermée est exacte si et seulement si son intégrale sur le cercle est nulle : c'est l'énoncé de la cohomologie de de Rham ({{geod|Géométrie différentielle}}) retrouvé par l'homologie, où $\lex{homologie-singuliere}{H_1} \cong \lex{ensemble-entiers-relatifs}{\mathbb Z}$ est engendré par le cercle.

  - id: geoalg
    etiquette: Géométrie algébrique
    nature: théorie
    famille: geo
    sous: geoalg
    choix: |
      L'existence d'un idéal maximal dans tout anneau commutatif non nul (théorème de Krull) équivaut à l'[[axiome-choix]] (Hodges, 1979).
    texte: |
      Elle étudie les lieux de zéros de systèmes de [[anneau-polynomes|polynômes]], puis plus généralement les schémas. Elle repose sur les anneaux de polynômes, construits avec $\lex{ensemble-entiers-relatifs}{\mathbb Z}$, sur la topologie, et sur l'algèbre linéaire, qui démontre le lemme de Zariski : un corps engendré par un nombre fini d'éléments sur un sous-corps $K$ est de dimension finie sur $K$. Le spectre d'un [[anneau]] commutatif est l'ensemble de ses [[ideal-premier|idéaux premiers]], muni de la topologie de Zariski, dont les [[ferme|fermés]] sont les ensembles $V(I) = \{\mathfrak p : \mathfrak p \supset I\}$.

  - id: alglin
    etiquette: Algèbre linéaire
    nature: théorie
    famille: alg
    sous: alglin
    choix: |
      L'énoncé « tout espace vectoriel admet une base » équivaut à l'[[axiome-choix]] (Blass, 1984). En dimension finie, il est démontrable dans $\mathsf{ZF}$.
    texte: |
      Elle étudie les espaces vectoriels sur un [[corps]] $K$ quelconque et les applications linéaires entre eux. Elle repose sur les structures algébriques et sur $\lex{ensemble-entiers-naturels}{\mathbb N}$, qui donne un sens aux combinaisons linéaires, sommes d'un nombre fini de termes, et à la dimension ; elle ne demande en revanche la construction d'aucun autre ensemble de nombres, le corps $K$ restant quelconque.

  - id: nban
    etiquette: Théorie analytique des nombres
    nature: théorie
    famille: ari
    sous: nban
    texte: |
      Elle étudie les entiers par des méthodes d'analyse complexe. Le théorème des nombres premiers, $\pi(x) \sim x/\ln x$, démontré en 1896 par Hadamard et La Vallée Poussin, repose sur l'absence de zéro de la fonction $\zeta$ de Riemann sur la droite $\operatorname{Re}(s) = 1$.

