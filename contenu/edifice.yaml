# Niveau 0 : l'édifice entier, de la logique aux grandes théories.
# Les arêtes vont de la notion requise vers la notion qui la requiert.
# Le script de construction ne trace que la réduction transitive.

graphe: edifice
titre: L'édifice
conteneur: null

noeuds:
  - id: log
    etiquette: Logique du premier ordre
    nature: théorie
    famille: fond
    texte: |
      Un langage du premier ordre comporte des variables, des symboles de relation et de fonction, les connecteurs $\neg, \wedge, \vee, \Rightarrow, \Leftrightarrow$ et les quantificateurs $\forall, \exists$, qui portent sur les éléments et jamais sur les parties ni sur les propriétés.

      Une **démonstration** à partir d'une théorie $T$ est une suite finie de formules dont chacune est un axiome logique, un axiome de $T$, ou se déduit des précédentes par une règle d'inférence. Le théorème de complétude de Gödel (1929) affirme qu'une formule est démontrable dans $T$ si et seulement si elle est vraie dans tous les modèles de $T$.

  - id: zf
    etiquette: Axiomes de ZF
    nature: théorie
    famille: fond
    sous: zf
    texte: |
      $\mathsf{ZF}$ est la théorie du premier ordre sur le seul symbole $\in$ dont les axiomes sont l'extensionnalité, la paire, la réunion, les parties, l'infini, la fondation, et les schémas de séparation et de remplacement. Tout objet y est un [[ensemble]].

      $\mathsf{ZFC}$ ajoute l'[[axiome-choix]]. Si $\mathsf{ZF}$ est cohérente, $\mathsf{ZFC}$ l'est aussi (Gödel, 1938), de même que $\mathsf{ZF} + \neg\mathsf{AC}$ (Cohen, 1963).

  - id: rel
    etiquette: Relations, fonctions
    nature: théorie
    famille: fond
    texte: |
      Le [[couple]] de Kuratowski $(a,b) = \{\{a\},\{a,b\}\}$ vérifie $(a,b) = (c,d) \Leftrightarrow (a = c \text{ et } b = d)$. Il permet de définir le [[produit-cartesien]], puis les [[relation|relations]] et les [[application|applications]], identifiées à leurs graphes.

      Les [[relation-equivalence|relations d'équivalence]] et les [[ensemble-quotient|ensembles quotients]] sont l'outil de toutes les constructions de la colonne des nombres, de {{z|$\mathbb Z$}} à {{c|$\mathbb C$}}.

  - id: ordin
    etiquette: Ordinaux, cardinaux
    nature: théorie
    famille: fond
    texte: |
      Un [[ordinal]] est un [[ensemble-transitif]] bien ordonné par $\in$. Tout [[bon-ordre]] est isomorphe à un unique ordinal, par un unique isomorphisme.

      Un [[cardinal]] est un ordinal qui n'est [[equipotent]] à aucun ordinal strictement plus petit. Sous l'[[axiome-choix]], tout ensemble est équipotent à un unique cardinal ; sans lui, la comparaison des tailles de deux ensembles quelconques n'est plus garantie.

  - id: ord
    etiquette: Structures d'ordre
    nature: théorie
    famille: ord
    texte: |
      Une [[relation-ordre]] est réflexive, antisymétrique et transitive. Les notions de [[majorant]], de [[borne-superieure]], d'[[ordre-total]] et de [[bon-ordre]] s'en déduisent.

      Le lemme de Zorn porte sur les ensembles ordonnés [[inductif-ordre|inductifs]], où toute [[chaine]] est majorée. Le mot « inductif » y a un sens différent de celui qu'il a pour {{n|$\mathbb N$}}.

  - id: alg
    etiquette: Structures algébriques
    nature: théorie
    famille: alg
    texte: |
      Ce sont les ensembles munis de lois de composition $E \times E \to E$ soumises à des axiomes : [[groupe|groupes]], [[anneau|anneaux]], [[corps]], modules.

      Le passage au quotient par un sous-groupe distingué ou par un idéal fournit les constructions de $\mathbb Z/n\mathbb Z$, de $\mathbb C = \mathbb R[X]/(X^2+1)$ et, plus généralement, des extensions de corps.

  - id: top
    etiquette: Structures topologiques
    nature: théorie
    famille: top
    sous: top
    choix: |
      Le théorème de Tychonov, selon lequel tout produit d'espaces [[compact|compacts]] est compact, équivaut à l'[[axiome-choix]] pour des espaces quasi-compacts quelconques (Kelley, 1950), et au lemme de l'ultrafiltre pour des espaces séparés.
    texte: |
      Un [[espace-topologique]] est un ensemble muni d'une famille d'[[ouvert|ouverts]] stable par réunion quelconque et par intersection finie. Les notions de [[voisinage]], de [[continuite]], d'espace [[separe]], [[compact]] et [[connexe]] s'en déduisent.

      Les [[espace-metrique|espaces métriques]] en fournissent la classe d'exemples la plus utilisée en analyse.

  - id: n
    etiquette: ℕ
    titre: Les entiers naturels
    nature: théorie
    famille: n
    sous: n
    texte: |
      $\mathbb N = \omega$ est le plus petit ensemble [[inductif-successeur|inductif]] ; son existence est garantie par l'axiome de l'infini. Muni de $0 = \varnothing$ et du successeur $S(n) = n \cup \{n\}$, il vérifie les axiomes de Peano, qui deviennent ici des théorèmes.

      Chaque entier est l'ensemble des entiers qui le précèdent : $3 = \{0, 1, 2\}$. L'addition et la multiplication se définissent par récurrence sur le second argument.

  - id: z
    etiquette: ℤ
    nature: théorie
    famille: z
    texte: |
      On munit $\mathbb N \times \mathbb N$ de la [[relation-equivalence]] définie par $(a,b) \sim (c,d) \Leftrightarrow a + d = b + c$ ; la classe de $(a,b)$ représente $a - b$. Le [[ensemble-quotient|quotient]], muni des opérations induites, est un [[anneau]] commutatif intègre, dans lequel $\mathbb N$ se plonge par $n \mapsto \overline{(n,0)}$.

  - id: q
    etiquette: ℚ
    nature: théorie
    famille: q
    texte: |
      $\mathbb Q$ est le corps des fractions de $\mathbb Z$ : le quotient de $\mathbb Z \times (\mathbb Z \setminus \{0\})$ par $(a,b) \sim (c,d) \Leftrightarrow ad = bc$.

      C'est un [[corps-ordonne|corps totalement ordonné]] [[archimedien]]. Il lui manque une propriété essentielle : la partie $\{x \in \mathbb Q : x^2 < 2\}$, non vide et majorée, n'admet pas de [[borne-superieure]] dans $\mathbb Q$.

  - id: r
    etiquette: ℝ
    nature: théorie
    famille: r
    texte: |
      $\mathbb R$ est un [[corps-ordonne|corps totalement ordonné]] dans lequel toute partie non vide et [[majorant|majorée]] admet une [[borne-superieure]].

      Un tel corps existe : on le construit par les coupures de Dedekind de $\mathbb Q$, ou comme quotient de l'anneau des [[suite-cauchy|suites de Cauchy]] rationnelles par l'idéal des suites de limite nulle. Il est unique à isomorphisme de corps ordonnés près, et cet isomorphisme est lui-même unique.

  - id: c
    etiquette: ℂ
    nature: théorie
    famille: c
    texte: |
      $\mathbb C = \mathbb R[X]/(X^2+1)$ est le quotient d'un [[anneau]] par un idéal maximal, donc un [[corps]]. La classe $i$ de $X$ vérifie $i^2 = -1$, et tout élément s'écrit de manière unique $a + ib$ avec $a, b \in \mathbb R$.

      Aucun ordre total n'en fait un [[corps-ordonne|corps ordonné]], puisque dans un tel corps tout carré est positif et l'on aurait $-1 = i^2 \geqslant 0$. $\mathbb C$ est algébriquement clos, mais toutes les démonstrations connues de ce fait utilisent une propriété analytique de $\mathbb R$.

  - id: analyse-reelle
    etiquette: Analyse réelle
    nature: théorie
    famille: mix
    sous: analyse-reelle
    texte: |
      L'analyse réelle étudie les fonctions de $\mathbb R$ dans $\mathbb R$ : limites, [[continuite]], dérivation, intégration. Elle repose sur la propriété de la [[borne-superieure]], qui distingue $\mathbb R$ de $\mathbb Q$, et sur la topologie de $\mathbb R$.

  - id: anc
    etiquette: Analyse complexe
    nature: théorie
    famille: mix
    texte: |
      Elle étudie les fonctions holomorphes, c'est-à-dire [[derivable|dérivables]] au sens complexe en tout point d'un [[ouvert]] de $\mathbb C$.

      La formule de Cauchy entraîne qu'une fonction holomorphe est développable en série entière au voisinage de chaque point. Ce phénomène n'a pas d'équivalent en analyse réelle, où une fonction peut être dérivable une fois sans l'être deux.

  - id: mes
    etiquette: Mesure, intégration
    nature: théorie
    famille: mix
    choix: |
      La $\sigma$-additivité de la mesure de Lebesgue n'est pas démontrable dans $\mathsf{ZF}$ seul : elle requiert le [[choix-denombrable]]. Dans le modèle de Feferman et Levy, $\mathbb R$ est une réunion dénombrable d'ensembles dénombrables.
    texte: |
      Une tribu sur $X$ est une partie de $\mathcal P(X)$ contenant $X$, stable par complémentaire et par réunion [[denombrable]]. Une mesure est une application $\mu$ définie sur une tribu, à valeurs dans $[0, +\infty]$, nulle en $\varnothing$ et $\sigma$-additive :
      $$\mu\Big(\bigcup_{n \in \mathbb N} A_n\Big) = \sum_{n \in \mathbb N} \mu(A_n) \quad \text{pour des } A_n \text{ deux à deux disjoints.}$$

  - id: proba
    etiquette: Probabilités
    nature: théorie
    famille: mix
    texte: |
      Un espace probabilisé est un espace mesuré $(\Omega, \mathcal A, P)$ de masse totale $P(\Omega) = 1$ ; c'est l'axiomatique de Kolmogorov (1933). Une variable aléatoire est une application mesurable définie sur $\Omega$, et son espérance est son intégrale par rapport à $P$.

  - id: anf
    etiquette: Analyse fonctionnelle
    nature: théorie
    famille: mix
    choix: |
      Le théorème de Hahn-Banach découle du lemme de l'ultrafiltre. Le théorème de Baire, qui fonde ceux de Banach-Steinhaus et de l'application ouverte, équivaut au choix dépendant (Blair, 1977).
    texte: |
      Elle étudie les espaces vectoriels normés de dimension infinie et les applications linéaires continues entre eux.

      Le théorème de Hahn-Banach prolonge toute forme linéaire continue définie sur un sous-espace en une forme linéaire continue de même norme sur l'espace entier.

  - id: grtop
    etiquette: Groupes topologiques
    nature: théorie
    famille: mix
    texte: |
      Un groupe topologique est un [[groupe]] muni d'une topologie pour laquelle $(x,y) \mapsto xy$ et $x \mapsto x^{-1}$ sont [[continuite|continues]].

      Sur tout groupe localement [[compact]], il existe une mesure de Haar, invariante par translation à gauche et unique à un facteur positif près.

  - id: geod
    etiquette: Géométrie différentielle
    nature: théorie
    famille: mix
    texte: |
      Elle étudie les variétés différentiables : espaces topologiques [[separe|séparés]] à base dénombrable, localement [[homeomorphisme|homéomorphes]] à $\mathbb R^n$, munis d'un atlas dont les changements de cartes sont de classe $C^\infty$.

      Le calcul différentiel y est transporté par les cartes, et les espaces tangents relèvent de l'algèbre linéaire.

  - id: topalg
    etiquette: Topologie algébrique
    nature: théorie
    famille: mix
    texte: |
      Elle associe à tout [[espace-topologique]] des invariants algébriques : groupe fondamental, groupes d'homologie. Deux espaces [[homeomorphisme|homéomorphes]] ont des invariants isomorphes, de sorte que des invariants distincts prouvent que deux espaces ne sont pas homéomorphes.

      Les chemins et les homotopies sont paramétrés par le [[segment]] $[0,1]$, d'où la dépendance envers $\mathbb R$.

  - id: geoalg
    etiquette: Géométrie algébrique
    nature: théorie
    famille: mix
    choix: |
      L'existence d'un idéal maximal dans tout anneau commutatif non nul (théorème de Krull) équivaut à l'[[axiome-choix]] (Hodges, 1979).
    texte: |
      Elle étudie les lieux de zéros de systèmes de polynômes, puis plus généralement les schémas. Le spectre d'un [[anneau]] commutatif est l'ensemble de ses idéaux premiers, muni de la topologie de Zariski, dont les [[ferme|fermés]] sont les ensembles $V(I) = \{\mathfrak p : \mathfrak p \supset I\}$.

  - id: alglin
    etiquette: Algèbre linéaire
    nature: théorie
    famille: mix
    choix: |
      L'énoncé « tout espace vectoriel admet une base » équivaut à l'[[axiome-choix]] (Blass, 1984). En dimension finie, il est démontrable dans $\mathsf{ZF}$.
    texte: |
      Elle étudie les espaces vectoriels sur un [[corps]] $K$ quelconque et les applications linéaires entre eux. Elle ne présuppose aucune construction de nombres, ce qui explique son rang peu élevé dans l'édifice.

  - id: nban
    etiquette: Théorie analytique des nombres
    nature: théorie
    famille: mix
    texte: |
      Elle étudie les entiers par des méthodes d'analyse complexe. Le théorème des nombres premiers, $\pi(x) \sim x/\ln x$, démontré en 1896 par Hadamard et La Vallée Poussin, repose sur l'absence de zéro de la fonction $\zeta$ de Riemann sur la droite $\operatorname{Re}(s) = 1$.

