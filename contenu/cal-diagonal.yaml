# Niveau 2 : structure interne du chapitre « Lemme diagonal et démontrabilité » (nœud cal-diagonal du graphe
# calc, après cal-representation). Représentation des fonctions récursives totales dans Q par le plus petit
# témoin ; fonction diagonale primitive récursive (Sb de cal-syntaxe) et lemme diagonal ; non-définissabilité de
# la vérité (Tarski) ; formule de démontrabilité Σ₁ d'une théorie à axiomes r.e. et première condition de
# dérivabilité (D1) ; premier théorème sous la forme de Gödel (cohérence, ω-cohérence) ; théorème de Löb et second
# théorème d'incomplétude sous les conditions (D1) à (D3). Lève l'admis « lemme diagonal » du point (ii) de
# l-incompletude ; (D2) et (D3) dans PA pour la formule de démontrabilité naturelle sont démontrées plus loin
# (cal-sp-derivabilite, cal-sg-d3).
# Chapitre distinct de cal-representation : celui-ci s'achève sur le point (i) de l-incompletude, sans
# diagonale ; celui-là est la voie autoréférente vers le point (ii), et le chapitre qui démontrera (D2) et (D3)
# dans PA s'y rattachera. Tout est démontré dans le système de l-deduction, avec les règles de cal-rp-calcul.
# Aucune forme de l'axiome du choix. Identifiants « cal-dg- ».

graphe: cal-diagonal
titre: Lemme diagonal et démontrabilité
conteneur: cal-diagonal

entrees:
  cal-representation: [cal-dg-fonctions, cal-dg-prov]
  cal-syntaxe: [cal-dg-diagonal]
  cal-incompletude: [cal-dg-prov]

noeuds:
  - id: cal-dg-fonctions
    etiquette: Représentation des fonctions
    nature: proposition
    titre: Représentation des fonctions récursives totales
    texte: |
      Les conventions sont celles de {{cal-rp-calculs-q|Calculs dans Q}} et de {{cal-rp-sigma1|Σ₁-complétude}} : $\underline n$ est le chiffre de $n$, et $t \leqslant u$, comme les quantifications bornées, s'écrit avec le témoin à gauche. Une théorie $T$ *contient* $\mathsf Q$ si elle en démontre les axiomes ; elle démontre alors tout ce que démontre $\mathsf Q$ ({{cal-rp-godel-rosser|Gödel-Rosser}}).

      Soit $v_1, \dots, v_k, w$ des variables distinctes. Pour une formule $\alpha$ dont les variables libres sont parmi elles et pour $a = (a_1, \dots, a_k) \in \lex{n-uplet}{\mathbb N^k}$, on note $\alpha_a$ la formule obtenue en substituant à chaque $v_i$ le chiffre $\underline{a_i}$ ; ces termes sont clos, donc substituables, et l'ordre des substitutions est indifférent. Les variables libres de $\alpha_a$ sont parmi $w$, et, pour un entier $c$, $\alpha_a[\underline c/w]$ est l'énoncé $\alpha\langle s \rangle$ de {{cal-rp-sigma1|Σ₁-complétude}}, pour une [[valuation-structure|valuation]] $s$ qui vaut $a_i$ en $v_i$ et $c$ en $w$.

      Une fonction [[fonction-totale|totale]] $f : \mathbb N^k \to \mathbb N$ est [[fonction-representable|représentable]] dans $T$ s'il existe une formule $\varphi$, de variables libres parmi $v_1, \dots, v_k, w$, telle que, pour tout $a \in \mathbb N^k$,
      $$T \vdash \forall w\, \big(\varphi_a \leftrightarrow w = \underline{f(a)}\big) ;$$
      on dit que $\varphi$ représente $f$ dans $T$. Le [[graphe-application|graphe]] de $f$ est la relation $\{(a, b) \in \mathbb N^{k+1} : f(a) = b\}$.
    enonce: |
      Soit $T$ une théorie qui contient $\mathsf Q$, et $f : \mathbb N^k \to \mathbb N$ une fonction totale.

      (i) Si $f$ est [[fonction-recursive|récursive]], son graphe est une relation récursive.

      (ii) **Plus petit témoin.** Soit $\theta$ une formule, de variables libres parmi $v_1, \dots, v_k, w$, qui représente le graphe de $f$ dans $T$ au sens de {{cal-rp-rosser|Astuce de Rosser}} : pour tous $a \in \mathbb N^k$ et $c \in \mathbb N$, $T \vdash \theta_a[\underline c/w]$ si $c = f(a)$, et $T \vdash \neg\theta_a[\underline c/w]$ sinon. Soit $z$ et $u$ deux variables distinctes, qui ne figurent pas dans $\theta$ et sont distinctes des $v_i$ et de $w$. La formule
      $$\begin{aligned} \varphi = \theta \wedge \forall z \leqslant w\ \big(&z = w \\ &\vee \neg\theta[z/w]\big), \end{aligned}$$
      où la quantification bornée est écrite avec la variable $u$, représente $f$ dans $T$.

      (iii) Toute fonction récursive totale est représentable dans $\mathsf Q$ et dans $T$, avec des variables distinctes $v_1, \dots, v_k, w$ données.
    preuve: |
      (i) La fonction caractéristique du graphe est $(a, b) \mapsto \chi_=\big(f(a), b\big)$ : c'est la relation $x = y$, [[relation-primitive-recursive|primitive récursive]] par le point (i) de {{cal-pr-cloture|Clôture}}, composée avec les fonctions récursives totales $(a, b) \mapsto f(a)$ et $(a, b) \mapsto b$. Elle est récursive par le point (ii) de {{cal-recursives|Fonctions récursives}}.

      (ii) Comme $z$ ne figure pas dans $\theta$, elle y est substituable à $w$, et $\theta[z/w]$ porte la lettre $z$ exactement aux places des [[occurrence|occurrences]] libres de $w$ dans $\theta$. Les variables libres de $\varphi$ sont parmi $v_1, \dots, v_k, w$.

      Fixons $a \in \mathbb N^k$ et posons $b = f(a)$. Substituer un chiffre à $v_i$ traverse les blocs $\forall z$ et $\forall u$, puisque $v_i$ est distincte de $z$ et de $u$, et commute avec la substitution de $z$ à $w$, puisque les chiffres n'ont pas de variable et que $z \neq v_i$. Ainsi $\varphi_a = \theta_a \wedge B_a$, avec
      $$\begin{aligned} B_a = \forall z\, \Big(&\exists u\, (u + z = w) \\ &\to \big(z = w \vee \neg\theta_a[z/w]\big)\Big). \end{aligned}$$
      Comme $z$ ne figure pas dans $\theta_a$, on a $\theta_a[z/w][\underline c/z] = \theta_a[\underline c/w]$ pour tout entier $c$. Par hypothèse, $T \vdash \theta_a[\underline b/w]$, et $T \vdash \neg\theta_a[\underline c/w]$ pour $c \neq b$. On emploie les règles de {{cal-rp-calcul|Calcul à variables libres}} : une variable est toujours substituable à elle-même, puisqu'une occurrence libre de $y$ n'est dans la [[portee-quantificateur|portée]] d'aucun $\forall y$, et un chiffre, qui est clos, est substituable à toute variable.

      *La théorie $T$ démontre $\varphi_a[\underline b/w]$.* Soit $c \leqslant b$. Si $c = b$, l'instance $P \to (P \vee Q)$ donne $\vdash z = \underline b \to (z = \underline b \vee \neg\theta_a[z/w])$. Si $c < b$, le remplacement d'un terme (point (v) de Calcul à variables libres), appliqué à la formule $\neg\theta_a[z/w]$, à la variable $z$ et aux termes $\underline c$ et $z$, donne $\vdash \underline c = z \to (\neg\theta_a[\underline c/w] \to \neg\theta_a[z/w])$ ; avec la symétrie de l'égalité et $T \vdash \neg\theta_a[\underline c/w]$, il vient $T \vdash z = \underline c \to \neg\theta_a[z/w]$, puis $T \vdash z = \underline c \to (z = \underline b \vee \neg\theta_a[z/w])$ par l'instance $Q \to (P \vee Q)$. Le raisonnement par cas sur $D_b(z)$ de {{cal-rp-calculs-q|Calculs dans Q}}, puis le point (v) de ce nœud, $\mathsf Q \vdash \exists u\, (u + z = \underline b) \to D_b(z)$, donnent
      $$\begin{aligned} T \vdash {}&\exists u\, (u + z = \underline b) \\ &\to \big(z = \underline b \vee \neg\theta_a[z/w]\big). \end{aligned}$$
      Les seules occurrences libres de $w$ dans $B_a$ sont celles de $u + z = w$ et de $z = w$ ; la généralisation en $z$ ({{hk-generalisation|Règles dérivées}}, (ii)) donne donc $T \vdash B_a[\underline b/w]$. Avec $T \vdash \theta_a[\underline b/w]$, la règle des tautologies donne $T \vdash \varphi_a[\underline b/w]$.

      *Si $w = \underline b$, alors $\varphi_a$.* Le remplacement d'un terme, appliqué à $\varphi_a$, à la variable $w$ et aux termes $\underline b$ et $w$, et la symétrie donnent $\vdash w = \underline b \to (\varphi_a[\underline b/w] \to \varphi_a)$, d'où $T \vdash w = \underline b \to \varphi_a$.

      *Si $\varphi_a$, alors $w = \underline b$.* Par le point (vi) de {{cal-rp-calculs-q|Calculs dans Q}}, $T \vdash \exists u\, (u + w = \underline b) \vee \exists u\, (u + \underline b = w)$ : ce sont les formules $w \leqslant \underline b$ et $\underline b \leqslant w$, écrites avec la variable liée $u$. On traite les deux termes de la disjonction.

      Le chiffre $\underline b$ est clos et $u \neq z$ : l'axiome (2), qui instancie $z$ par $\underline b$ dans $B_a$, donne
      $$\begin{aligned} \vdash B_a \to \Big(&\exists u\, (u + \underline b = w) \\ &\to \big(\underline b = w \vee \neg\theta_a[\underline b/w]\big)\Big). \end{aligned}$$
      Avec $T \vdash \theta_a[\underline b/w]$, la symétrie et la règle des tautologies, $T \vdash \exists u\, (u + \underline b = w) \to (B_a \to w = \underline b)$.

      Par le point (v) de {{cal-rp-calculs-q|Calculs dans Q}}, $T \vdash \exists u\, (u + w = \underline b) \to D_b(w)$. Pour $c < b$, le remplacement d'un terme, appliqué à $\theta_a$, à la variable $w$ et aux termes $w$ et $\underline c$, donne $\vdash w = \underline c \to (\theta_a \to \theta_a[\underline c/w])$, et, avec $T \vdash \neg\theta_a[\underline c/w]$, la règle des tautologies donne $T \vdash w = \underline c \to (\theta_a \to w = \underline b)$ ; pour $c = b$, c'est une [[instance-tautologie|instance de tautologie]]. Le raisonnement par cas donne $T \vdash D_b(w) \to (\theta_a \to w = \underline b)$, d'où $T \vdash \exists u\, (u + w = \underline b) \to (\theta_a \to w = \underline b)$.

      La règle des tautologies, appliquée à la disjonction et à ces deux implications, donne $T \vdash \theta_a \to (B_a \to w = \underline b)$, puis $T \vdash \varphi_a \to w = \underline b$ par l'instance $(P \to (Q \to R)) \to ((P \wedge Q) \to R)$.

      *Conclusion.* L'instance $(P \to Q) \to ((Q \to P) \to (P \leftrightarrow Q))$ donne $T \vdash \varphi_a \leftrightarrow w = \underline b$, et la généralisation en $w$ donne $T \vdash \forall w\, (\varphi_a \leftrightarrow w = \underline b)$. Aucune hypothèse à variable libre n'a été introduite : toutes les généralisations portent sur des théorèmes de $T$.

      (iii) Par (i), le graphe de $f$ est une relation récursive de $\mathbb N^{k+1}$. Par le point (ii) de {{cal-rp-rosser|Astuce de Rosser}}, il est représentable dans $\mathsf Q$, et dans $T$, par une formule $\theta$ de variables libres parmi $v_1, \dots, v_k, w$, prises pour les variables de la définition ; (ii) conclut.
    remarques:
      - |
        Représenter le graphe ne suffit pas. Pour l'identité de $\mathbb N$, avec $k = 1$, la formule $\theta = \big(w = v_1 \vee \neg(0 + w = w)\big)$ représente le graphe dans $\mathsf Q$ : pour $c = n$, la réflexivité de l'égalité donne $\mathsf Q \vdash \theta_n[\underline c/w]$ ; pour $c \neq n$, $\mathsf Q$ démontre $\neg(\underline c = \underline n)$ et $0 + \underline c = \underline c$ par les points (i) et (ii) de {{cal-rp-calculs-q|Calculs dans Q}}, donc $\neg\theta_n[\underline c/w]$. Soit $\mathcal M$ la structure de la deuxième remarque de ce même nœud, où $0 + a = b \neq a$. L'élément $a$ y satisfait $\theta_0 = \big(w = 0 \vee \neg(0 + w = w)\big)$ sans être égal à $0$, et le {{l-correction|théorème de correction}} montre que $\mathsf Q$ ne démontre pas $\forall w\, (\theta_0 \to w = 0)$. La clause du plus petit témoin écarte $a$ : on a $a + 0 = a$, donc $0 \leqslant a$ dans $\mathcal M$, et $0$, différent de $a$, satisfait $\theta_0$. L'erreur la plus répandue est de croire qu'une formule qui donne la bonne réponse sur chaque chiffre définit une fonction aux yeux de la théorie ; c'est le point (vi) de Calculs dans Q, « $w \leqslant \underline b$ ou $\underline b \leqslant w$ », qui ramène tout élément, standard ou non, à la comparaison avec le chiffre $\underline b$.
      - |
        La clause $\forall z \leqslant w\ (z = w \vee \cdots)$ dit qu'aucun $z < w$ ne convient : c'est la forme de la minimisation au point (ii) de {{cal-rp-forme-sigma|Forme Σ₁ des r.e.}}, et la même comparaison des témoins que dans la {{cal-rp-rosser|séparation de Rosser}}. Elle ne demande rien de plus à $\mathsf Q$ que les calculs sur les chiffres, sans aucune récurrence interne.

  - id: cal-dg-diagonal
    etiquette: Lemme diagonal
    nature: théorème
    titre: Lemme diagonal
    texte: |
      Les mots sont codés comme au nœud {{cal-sx-codage|Codage des mots}}, et $\underline n$ est le chiffre de $n$ ; pour une formule $\chi$, on note $\underline{\ulcorner \chi \urcorner}$ le chiffre de son [[code-mot|code]]. On fixe la variable $x_0$, c'est-à-dire la lettre $a_8$, et l'on pose
      $$d(n) = \mathrm{Sb}\big(n, \ulcorner \underline n \urcorner, 8\big),$$
      avec la fonction $\mathrm{Sb}$ de {{cal-sx-substitution|Substitution}}. Si $n$ est le code d'une formule $\chi$, $d(n)$ est le code de $\chi[\underline n/x_0]$ : la formule $\chi$, appliquée au chiffre de son propre code. On appelle $d$ la *fonction diagonale*.
    enonce: |
      (i) La fonction $d$ est primitive récursive, et $d(\ulcorner \chi \urcorner) = \ulcorner \chi[\underline{\ulcorner \chi \urcorner}/x_0] \urcorner$ pour toute formule $\chi$.

      (ii) Soit $\psi$ une formule dont les variables libres sont parmi une variable $x$. Il existe un énoncé $G$ tel que
      $$\mathsf Q \vdash G \leftrightarrow \psi\big[\underline{\ulcorner G \urcorner}/x\big],$$
      et toute théorie qui contient $\mathsf Q$ démontre la même équivalence.
    preuve: |
      (i) La fonction $n \mapsto \ulcorner \underline n \urcorner$ est primitive récursive, comme au point (i) de {{cal-tarski|Vérité et incomplétude}} ; $\mathrm{Sb}$ l'est par le point (i) de {{cal-sx-substitution|Substitution}}, et $d$ l'est par composition. Si $\chi$ est une formule de code $n$, le mot $\underline n$ est un terme, de code $\ulcorner \underline n \urcorner$, et $x_0 = a_8$ : le point (i) de Substitution donne $d(n) = \ulcorner \chi[\underline n/x_0] \urcorner$.

      (ii) Soit $y$ une variable qui ne figure pas dans $\psi$ et qui est distincte de $x_0$. La fonction $d$, primitive récursive, est récursive et [[fonction-totale|totale]] ({{cal-recursives|Fonctions récursives}}, (i)) ; par le point (iii) de {{cal-dg-fonctions|Représentation des fonctions}}, elle est représentée dans $\mathsf Q$ par une formule $\delta$ de variables libres parmi $x_0$ et $y$ : pour tout entier $n$, $\mathsf Q \vdash \forall y\, (\delta_n \leftrightarrow y = \underline{d(n)})$, où $\delta_n = \delta[\underline n/x_0]$. Posons $\psi' = \psi[y/x]$ ; comme $y$ ne figure pas dans $\psi$, elle y est substituable à $x$, et les variables libres de $\psi'$ sont parmi $y$. Soit
      $$\begin{aligned} \chi &= \exists y\, \big(\delta \wedge \psi'\big), \quad n = \ulcorner \chi \urcorner, \\ G &= \chi[\underline n/x_0]. \end{aligned}$$
      Les variables libres de $\chi$ sont parmi $x_0$. Comme $x_0$ n'est pas libre dans $\psi'$ et que $x_0 \neq y$, la substitution ne touche que $\delta$ : $G = \exists y\, (\delta_n \wedge \psi')$, et c'est un énoncé. Par (i), son code est $g = d(n)$.

      L'axiome (2), avec le terme $y$, donne $\mathsf Q \vdash \delta_n \leftrightarrow y = \underline g$, et la règle des tautologies donne $\mathsf Q \vdash (\delta_n \wedge \psi') \to (y = \underline g \wedge \psi')$ et la réciproque. Or, pour deux formules $A$ et $B$ telles que $\mathsf Q \vdash A \to B$, l'introduction de l'existentiel avec le terme $y$, qui donne $\vdash B \to \exists y\, B$, puis l'élimination, permise puisque $y$ n'est pas libre dans $\exists y\, B$, donnent $\mathsf Q \vdash \exists y\, A \to \exists y\, B$ (point (iii) de {{cal-rp-calcul|Calcul à variables libres}}). Ainsi $\mathsf Q \vdash G \leftrightarrow \exists y\, (y = \underline g \wedge \psi')$.

      Il reste à voir que $\vdash \exists y\, (y = \underline g \wedge \psi') \leftrightarrow \psi'[\underline g/y]$. Le remplacement d'un terme (point (v) du même nœud), appliqué à $\psi'$, à la variable $y$ et aux termes $y$ et $\underline g$, donne $\vdash y = \underline g \to (\psi' \to \psi'[\underline g/y])$, donc $\vdash (y = \underline g \wedge \psi') \to \psi'[\underline g/y]$ ; comme $\psi'[\underline g/y]$ est un énoncé, l'élimination donne $\vdash \exists y\, (y = \underline g \wedge \psi') \to \psi'[\underline g/y]$. Inversement, $(y = \underline g \wedge \psi')[\underline g/y]$ est la formule $\underline g = \underline g \wedge \psi'[\underline g/y]$, et l'introduction de l'existentiel avec le terme clos $\underline g$, avec $\vdash \underline g = \underline g$, donne $\vdash \psi'[\underline g/y] \to \exists y\, (y = \underline g \wedge \psi')$.

      Enfin, $\psi'[\underline g/y] = \psi[\underline g/x]$ : comme $y$ ne figure pas dans $\psi$, les lettres $y$ de $\psi'$ sont exactement aux places des [[occurrence|occurrences]] libres de $x$ dans $\psi$, et elles y sont libres. La règle des tautologies donne $\mathsf Q \vdash G \leftrightarrow \psi[\underline g/x]$, l'équivalence annoncée, puisque $g = \ulcorner G \urcorner$. Une théorie qui contient $\mathsf Q$ démontre tout ce que démontre $\mathsf Q$, par le lemme de remplacement de la preuve de {{cal-craig|Théorème de Craig}}.
    remarques:
      - |
        La formule $\chi$ dit, de la formule de code $x_0$ : « sa diagonale a la propriété $\psi$ ». L'énoncé $G$ affirme cela de $\chi$ elle-même, et la diagonale de $\chi$ est précisément $G$. Le carré suivant résume la construction :
        $$\begin{CD} \chi @>{[\underline n/x_0]}>> G \\ @V{\ulcorner\cdot\urcorner}VV @VV{\ulcorner\cdot\urcorner}V \\ n @>{d}>> g \end{CD}$$
        Substituer à $x_0$ le chiffre du code de $\chi$, puis coder, revient à appliquer $d$ au code de $\chi$ ; la représentation de $d$ dans $\mathsf Q$ transporte ce calcul dans la théorie, et c'est ce qui rend l'équivalence démontrable, et non seulement vraie dans $\mathcal N$.
      - |
        L'énoncé $G$ n'est pas le mot $\psi[\underline g/x]$. Si $x$ est libre dans $\psi$, ce mot contient le chiffre $\underline g$, formé de $g + 1$ lettres ; par le point (ii) de {{cal-sx-codage|Codage des mots}} et l'inégalité $\mathrm{lg}(N) \leqslant N$ de la preuve du {{cal-craig|théorème de Craig}}, son code est au moins $g + 1$, et diffère donc de $g$. L'erreur la plus répandue est de lire le lemme comme la construction d'un énoncé qui contient son propre code : il fournit seulement un énoncé que $\mathsf Q$ démontre équivalent à celui qui parle de son code.
      - |
        Gödel (1931) construit directement l'énoncé dont il a besoin, pour la propriété de ne pas être démontrable. Une forme générale, pour une propriété quelconque, a été publiée par Rudolf Carnap (*Logische Syntax der Sprache*, Vienne, Springer, 1934, § 35), qui l'énonce en termes de vérité, et non de démontrabilité dans une théorie. La construction suit la diagonale de l'{{cal-arret|indécidabilité de l'arrêt}} : on applique un objet à son propre code.

  - id: cal-dg-tarski
    etiquette: Théorème de Tarski
    nature: théorème
    titre: Non-définissabilité de la vérité
    texte: |
      Pour une formule $\tau$ dont les variables libres sont parmi une variable $v$ et pour un énoncé $\sigma$, on note $\tau(\underline{\ulcorner \sigma \urcorner})$ l'énoncé $\tau[\underline{\ulcorner \sigma \urcorner}/v]$. La [[ensemble-definissable|définissabilité]] dans $\mathcal N$ est celle de {{cal-definissable|Définissabilité}}.
    enonce: |
      (i) Soit $T$ une [[theorie-coherente|théorie cohérente]] qui contient $\mathsf Q$. Il n'existe aucune formule $\tau$, de variables libres parmi $v$, telle que $T \vdash \sigma \leftrightarrow \tau(\underline{\ulcorner \sigma \urcorner})$ pour tout énoncé $\sigma$.

      (ii) **Théorème de Tarski.** L'ensemble des [[code-mot|codes]] des énoncés vrais dans $\mathcal N$ n'est pas définissable.
    preuve: |
      (i) Soit $\tau$ une telle formule. Le {{cal-dg-diagonal|lemme diagonal}}, appliqué à $\neg\tau$, donne un énoncé $G$ tel que $T \vdash G \leftrightarrow \neg\tau(\underline{\ulcorner G \urcorner})$, puisque $(\neg\tau)[\underline{\ulcorner G \urcorner}/v] = \neg\,\tau(\underline{\ulcorner G \urcorner})$. Avec $T \vdash G \leftrightarrow \tau(\underline{\ulcorner G \urcorner})$, les instances $(P \leftrightarrow \neg R) \to ((P \leftrightarrow R) \to P)$ et $(P \leftrightarrow \neg R) \to ((P \leftrightarrow R) \to \neg P)$ donnent $T \vdash G$ et $T \vdash \neg G$ : $T$ serait incohérente.

      (ii) Supposons l'ensemble $V$ de ces codes défini par une formule $\tau$ et la variable $v$, qui contient alors ses variables libres. Soit $\sigma$ un énoncé de code $c$. Par le {{l-substitution|lemme de substitution}}, $\mathcal N \models \tau(\underline c)$ si et seulement si $\tau$ est satisfaite sous une [[valuation-structure|valuation]] qui vaut $c$ en $v$, c'est-à-dire si et seulement si $c \in V$, ou encore $\mathcal N \models \sigma$. Par la table de $\leftrightarrow$ ({{l-connecteurs|Connecteurs}}), $\mathcal N \models \sigma \leftrightarrow \tau(\underline c)$.

      Soit $T$ l'ensemble des énoncés vrais dans $\mathcal N$. C'est une théorie cohérente, puisque $\mathcal N$ en est un modèle : par le {{l-correction|théorème de correction}}, une formule et sa négation ne peuvent pas y être démontrées toutes deux. Elle contient $\mathsf Q$, dont les axiomes sont vrais dans $\mathcal N$ (preuve du point (iii) de {{cal-rp-godel-rosser|Gödel-Rosser}}). Elle a pour éléments tous les énoncés $\sigma \leftrightarrow \tau(\underline{\ulcorner \sigma \urcorner})$, et les démontre donc, ce que (i) exclut.
    remarques:
      - |
        Le point (ii) renforce le point (i) de {{cal-tarski|Vérité et incomplétude}}, selon lequel cet ensemble n'est pas récursivement énumérable : il n'est même pas définissable, alors que tout ensemble récursivement énumérable l'est ({{cal-definissable|Définissabilité}}, (iii)). On en tire une autre preuve du point (ii) de {{cal-tarski|Vérité et incomplétude}} : pour une théorie dont les axiomes sont vrais et forment un ensemble récursivement énumérable, l'ensemble des codes des théorèmes est définissable, il est donc différent de l'ensemble des codes des énoncés vrais, qui le contient par le théorème de correction ; un énoncé vrai $\sigma$ non démontrable n'est pas réfuté non plus, puisque $\neg\sigma$ est faux et que tout théorème de $T$ est vrai. L'énoncé n'est pas désigné pour autant.
      - |
        La {{l-satisfaction|satisfaction}} est définie par récurrence sur les formules, dans la métathéorie, qui parle de la structure $\mathcal N$ tout entière. Le théorème dit que cette récurrence ne se transcrit pas en une formule du langage de l'arithmétique lui-même : la formule $\tau$ échouerait sur l'énoncé diagonal $G$, qui dit de lui-même qu'il est faux. L'erreur la plus répandue est d'y voir une limite de la notion de vérité ; c'est une limite du langage qui voudrait la décrire de l'intérieur.
      - |
        Le théorème est dû à Alfred Tarski (*Pojęcie prawdy w językach nauk dedukcyjnych*, Varsovie, Towarzystwo Naukowe Warszawskie, 1933 ; traduction allemande par L. Blaustein, « Der Wahrheitsbegriff in den formalisierten Sprachen », *Studia Philosophica* 1, 1935, p. 261-405, augmentée d'une postface).

  - id: cal-dg-prov
    etiquette: Démontrabilité (D1)
    nature: proposition
    titre: Formule de démontrabilité et première condition de dérivabilité
    texte: |
      Soit $T$ une [[theorie]] sur la signature de l'arithmétique dont l'ensemble des [[code-mot|codes]] des axiomes est [[ensemble-recursivement-enumerable|récursivement énumérable]], et $\mathrm{Th}(T)$ l'ensemble des codes des énoncés que $T$ démontre, comme au nœud {{cal-rp-godel-rosser|Gödel-Rosser}}. Soit $v$ et $y$ deux variables distinctes. Une [[formule-demontrabilite|formule de démontrabilité]] pour $T$ est une [[formule-sigma1|formule Σ₁]] $\mathrm{Pr} = \exists y\, \delta$, où $\delta$ est une [[formule-delta0|formule Δ₀]] de variables libres parmi $v$ et $y$, qui définit $\mathrm{Th}(T)$ dans $\mathcal N$ avec la variable $v$ : pour tout entier $c$, on a $c \in \mathrm{Th}(T)$ si et seulement s'il existe un entier $m$ tel que $\delta$ soit satisfaite sous une [[valuation-structure|valuation]] qui vaut $c$ en $v$ et $m$ en $y$.

      Pour un énoncé $\sigma$, on note $\mathrm{Pr}\,\ulcorner \sigma \urcorner$ l'énoncé $\mathrm{Pr}[\underline{\ulcorner \sigma \urcorner}/v]$, et $\bot$ l'énoncé $\neg(0 = 0)$. On pose $\mathrm{Coh}_{\mathrm{Pr}} = \neg\mathrm{Pr}\,\ulcorner \bot \urcorner$.
    enonce: |
      (i) La théorie $T$ a une formule de démontrabilité.

      (ii) **Première condition de dérivabilité.** Soit $\mathrm{Pr}$ une formule de démontrabilité pour $T$. Pour tout énoncé $\sigma$, les trois conditions suivantes sont équivalentes : $T \vdash \sigma$ ; $\mathcal N \models \mathrm{Pr}\,\ulcorner \sigma \urcorner$ ; $\mathsf Q \vdash \mathrm{Pr}\,\ulcorner \sigma \urcorner$. En particulier, si $T$ contient $\mathsf Q$, alors $T \vdash \sigma$ entraîne $T \vdash \mathrm{Pr}\,\ulcorner \sigma \urcorner$.

      (iii) On a $\mathcal N \models \mathrm{Coh}_{\mathrm{Pr}}$ si et seulement si $T$ est [[theorie-coherente|cohérente]].
    preuve: |
      (i) Par le point (iii) de {{cal-theoremes|Théorèmes r.e.}}, $\mathrm{Th}(T)$ est récursivement énumérable. Le point (ii) de {{cal-rp-forme-sigma|Forme Σ₁ des r.e.}}, avec $n = 1$ et la variable $v$, et le renommage de sa preuve, qui permet de prendre $y$ pour variable quantifiée, fournissent la formule $\exists y\, \delta$.

      (ii) Soit $\sigma$ un énoncé, de code $c$. La variable $v$ étant distincte de $y$, $\mathrm{Pr}\,\ulcorner \sigma \urcorner = \exists y\, \delta[\underline c/v]$, et $\delta[\underline c/v]$ est une formule Δ₀ par le point (i) de {{cal-rp-sigma1|Σ₁-complétude}}, le chiffre $\underline c$ n'ayant pas de variable : $\mathrm{Pr}\,\ulcorner \sigma \urcorner$ est un énoncé Σ₁. Par le {{l-substitution|lemme de substitution}} et la définition de la satisfaction de $\exists$, il est vrai dans $\mathcal N$ si et seulement s'il existe $m$ tel que $\delta$ soit satisfaite sous une valuation qui vaut $c$ en $v$ et $m$ en $y$, c'est-à-dire si et seulement si $T \vdash \sigma$.

      S'il est vrai, $\mathsf Q$ le démontre par le point (iii) de {{cal-rp-sigma1|Σ₁-complétude}}. Réciproquement, si $\mathsf Q \vdash \mathrm{Pr}\,\ulcorner \sigma \urcorner$, cet énoncé est vrai dans $\mathcal N$, qui est un modèle de $\mathsf Q$ (preuve du point (iii) de {{cal-rp-godel-rosser|Gödel-Rosser}}), par le {{l-correction|théorème de correction}}. Si $T$ contient $\mathsf Q$, elle démontre tout ce que démontre $\mathsf Q$.

      (iii) Par (ii), $\mathcal N \models \mathrm{Coh}_{\mathrm{Pr}}$ si et seulement si $T \nvdash \bot$. Si $T \vdash \bot$, comme $\vdash 0 = 0$ ({{hk-egalite|Égalité démontrable}}, (i)), $T$ démontre une formule et sa négation ; si $T$ est incohérente, elle démontre toutes les formules ({{l-coherence|Cohérence}}, (i)), dont $\bot$.
    remarques:
      - |
        Le point (ii) est la première des trois conditions de dérivabilité de Hilbert, Bernays et Löb, énoncées au nœud {{cal-dg-second|Löb et second théorème}}. Elle vaut pour toute formule de démontrabilité ; les deux autres dépendent de la façon dont la formule est écrite, et pas seulement de l'ensemble qu'elle définit.
      - |
        Le point (ii) ne dit pas que $\mathsf Q$ réfute $\mathrm{Pr}\,\ulcorner \sigma \urcorner$ quand $T$ ne démontre pas $\sigma$ : l'énoncé $\neg\mathrm{Pr}\,\ulcorner \sigma \urcorner$ n'est pas Σ₁, et la Σ₁-complétude ne s'y applique pas. L'erreur la plus répandue est de croire que la non-démontrabilité se constate aussi mécaniquement que la démontrabilité. Pour $\sigma = \bot$ et une théorie cohérente, $\mathrm{Coh}_{\mathrm{Pr}}$ est vrai par (iii), et le {{l-incompletude|second théorème d'incomplétude}} dit qu'il n'est pas démontrable dans $T$ quand $T$ contient l'arithmétique de Peano et que la formule est écrite convenablement.

  - id: cal-dg-godel
    etiquette: Premier théorème (Gödel)
    nature: théorème
    titre: Premier théorème d'incomplétude sous la forme de Gödel
    texte: |
      Une théorie $T$ sur la signature de l'arithmétique est [[theorie-omega-coherente|ω-cohérente]] s'il n'existe aucune formule $\psi$, de variables libres parmi une variable $y$, telle que $T \vdash \exists y\, \psi$ et $T \vdash \neg\psi[\underline n/y]$ pour tout entier $n$. Une théorie ω-cohérente est cohérente : une théorie incohérente démontre toutes les formules ({{l-coherence|Cohérence}}, (i)), en particulier $\exists y\, \neg(y = y)$ et chacun des énoncés $\neg\neg(\underline n = \underline n)$.

      Les notations $\mathrm{Pr}\,\ulcorner \sigma \urcorner$ sont celles de {{cal-dg-prov|Démontrabilité (D1)}}.
    enonce: |
      Soit $T$ une théorie cohérente, dont l'ensemble des [[code-mot|codes]] des axiomes est récursivement énumérable et qui contient $\mathsf Q$, et $\mathrm{Pr} = \exists y\, \delta$ une [[formule-demontrabilite|formule de démontrabilité]] pour $T$. Soit $G$ un énoncé tel que
      $$\mathsf Q \vdash G \leftrightarrow \neg\mathrm{Pr}\,\ulcorner G \urcorner ;$$
      il en existe par le {{cal-dg-diagonal|lemme diagonal}}, appliqué à $\neg\mathrm{Pr}$.

      (i) $T \nvdash G$.

      (ii) L'énoncé $G$ est vrai dans $\mathcal N$.

      (iii) Si $T$ est ω-cohérente, $T \nvdash \neg G$ : l'énoncé $G$ n'est ni démontrable ni réfutable dans $T$.
    preuve: |
      Notons $g = \ulcorner G \urcorner$. Comme $T$ contient $\mathsf Q$, elle démontre $G \leftrightarrow \neg\mathrm{Pr}\,\ulcorner G \urcorner$.

      (i) Si $T \vdash G$, la première condition de dérivabilité ({{cal-dg-prov|Démontrabilité (D1)}}, (ii)) donne $T \vdash \mathrm{Pr}\,\ulcorner G \urcorner$, et l'équivalence donne $T \vdash \neg\mathrm{Pr}\,\ulcorner G \urcorner$ : $T$ serait incohérente.

      (ii) Par (i) et le point (ii) de {{cal-dg-prov|Démontrabilité (D1)}}, $\mathcal N \not\models \mathrm{Pr}\,\ulcorner G \urcorner$. Les axiomes de $\mathsf Q$ sont vrais dans $\mathcal N$ (preuve du point (iii) de {{cal-rp-godel-rosser|Gödel-Rosser}}), et le {{l-correction|théorème de correction}} donne $\mathcal N \models G \leftrightarrow \neg\mathrm{Pr}\,\ulcorner G \urcorner$ ; par la table de $\leftrightarrow$, $\mathcal N \models G$.

      (iii) Supposons $T \vdash \neg G$. L'équivalence et la règle des tautologies donnent $T \vdash \mathrm{Pr}\,\ulcorner G \urcorner$, c'est-à-dire $T \vdash \exists y\, \delta_g$, où $\delta_g = \delta[\underline g/v]$ est une formule Δ₀, par le point (i) de {{cal-rp-sigma1|Σ₁-complétude}}, de variables libres parmi $y$. Pour tout entier $m$, l'énoncé Δ₀ $\delta_g[\underline m/y]$ est faux dans $\mathcal N$ : sinon, par le {{l-substitution|lemme de substitution}}, $\delta$ serait satisfaite sous une [[valuation-structure|valuation]] qui vaut $g$ en $v$ et $m$ en $y$, et $T$ démontrerait $G$, contrairement à (i). Par le point (ii) de {{cal-rp-sigma1|Σ₁-complétude}}, $\mathsf Q \vdash \neg\delta_g[\underline m/y]$, donc $T \vdash \neg\delta_g[\underline m/y]$, pour tout $m$. Avec $T \vdash \exists y\, \delta_g$, la formule $\delta_g$ contredit l'ω-cohérence de $T$.
    remarques:
      - |
        L'énoncé $G$ dit de lui-même qu'il n'est pas démontrable dans $T$ : par le point (ii) de {{cal-dg-prov|Démontrabilité (D1)}}, $\mathcal N \models G$ si et seulement si $T \nvdash G$. C'est le contenu du premier théorème de Gödel (« Über formal unentscheidbare Sätze der Principia Mathematica und verwandter Systeme I », *Monatshefte für Mathematik und Physik* 38, 1931, p. 173-198, théorème VI), énoncé pour le système P des *Principia* étendu par une classe récursive d'axiomes ω-cohérente, où l'énoncé indécidable est construit directement. Le point (i) n'emploie que la cohérence ; c'est l'irréfutabilité qui demande davantage, et l'hypothèse sert exactement à interdire qu'une théorie démontre $\exists y\, \delta_g$ tout en réfutant chacun des témoins possibles.
      - |
        Rosser (1936) a obtenu un énoncé indécidable sous la seule hypothèse de cohérence en changeant d'énoncé : le sien dit que toute démonstration de lui-même est précédée d'une démonstration de sa négation. Le nœud {{cal-rp-godel-rosser|Gödel-Rosser}} obtient le même résultat sans lemme diagonal, par une paire récursivement inséparable ; ici, c'est la diagonale qui désigne l'énoncé.
      - |
        Le raisonnement du point (i), « si $T$ démontrait $G$, elle serait incohérente », porte sur les démonstrations de $T$. Le second théorème d'incomplétude naît de la remarque qu'une théorie assez forte peut mener ce raisonnement elle-même ; le nœud {{cal-dg-second|Löb et second théorème}} dit à quelles conditions.

  - id: cal-dg-second
    etiquette: Löb et second théorème
    nature: théorème
    titre: Théorème de Löb et second théorème d'incomplétude sous les conditions de dérivabilité
    texte: |
      Soit $T$ une théorie qui contient $\mathsf Q$, et $\mathrm{Pr}$ une formule dont les variables libres sont parmi une variable $v$. Pour un énoncé $\varphi$, on note $\mathrm{Pr}\,\ulcorner \varphi \urcorner$ l'énoncé $\mathrm{Pr}[\underline{\ulcorner \varphi \urcorner}/v]$, où $\underline{\ulcorner \varphi \urcorner}$ est le chiffre du [[code-mot|code]] de $\varphi$, et $\bot$ l'énoncé $\neg(0 = 0)$. La formule $\mathrm{Pr}$ satisfait dans $T$ les [[conditions-derivabilite|conditions de dérivabilité]] si, pour tous énoncés $\varphi$ et $\psi$ :

      (D1) si $T \vdash \varphi$, alors $T \vdash \mathrm{Pr}\,\ulcorner \varphi \urcorner$ ;

      (D2) $T \vdash \mathrm{Pr}\,\ulcorner \varphi \to \psi \urcorner \to (\mathrm{Pr}\,\ulcorner \varphi \urcorner \to \mathrm{Pr}\,\ulcorner \psi \urcorner)$ ;

      (D3) $T \vdash \mathrm{Pr}\,\ulcorner \varphi \urcorner \to \mathrm{Pr}\,\ulcorner \mathrm{Pr}\,\ulcorner \varphi \urcorner \urcorner$.

      On note $\mathrm{Coh}_{\mathrm{Pr}}$ l'énoncé $\neg\mathrm{Pr}\,\ulcorner \bot \urcorner$.
    enonce: |
      Soit $T$ une théorie qui contient $\mathsf Q$, et $\mathrm{Pr}$ une formule qui satisfait dans $T$ les conditions de dérivabilité.

      (i) **Théorème de Löb.** Pour tout énoncé $\varphi$, si $T \vdash \mathrm{Pr}\,\ulcorner \varphi \urcorner \to \varphi$, alors $T \vdash \varphi$.

      (ii) **Second théorème d'incomplétude.** Si $T$ est [[theorie-coherente|cohérente]], alors $T \nvdash \mathrm{Coh}_{\mathrm{Pr}}$.
    preuve: |
      (i) Le {{cal-dg-diagonal|lemme diagonal}}, appliqué à la formule $\mathrm{Pr} \to \varphi$, dont les variables libres sont parmi $v$ puisque $\varphi$ est un énoncé, donne un énoncé $L$ tel que $T \vdash L \leftrightarrow (\mathrm{Pr}\,\ulcorner L \urcorner \to \varphi)$. Notons $B$ l'énoncé $\mathrm{Pr}\,\ulcorner L \urcorner$. La règle des tautologies donne $T \vdash L \to (B \to \varphi)$, et (D1) donne $T \vdash \mathrm{Pr}\,\ulcorner L \to (B \to \varphi) \urcorner$. Deux applications de (D2), la première aux énoncés $L$ et $B \to \varphi$, la seconde à $B$ et $\varphi$, donnent
      $$\begin{aligned} &T \vdash B \to \mathrm{Pr}\,\ulcorner B \to \varphi \urcorner, \\ &T \vdash \mathrm{Pr}\,\ulcorner B \to \varphi \urcorner \to (\mathrm{Pr}\,\ulcorner B \urcorner \to \mathrm{Pr}\,\ulcorner \varphi \urcorner), \end{aligned}$$
      et (D3), appliquée à $L$, donne $T \vdash B \to \mathrm{Pr}\,\ulcorner B \urcorner$. La règle des tautologies enchaîne ces trois formules : $T \vdash B \to \mathrm{Pr}\,\ulcorner \varphi \urcorner$. Avec l'hypothèse $T \vdash \mathrm{Pr}\,\ulcorner \varphi \urcorner \to \varphi$, il vient $T \vdash B \to \varphi$, puis $T \vdash L$ par l'équivalence qui définit $L$. Alors (D1) donne $T \vdash B$, et le [[modus-ponens|modus ponens]] donne $T \vdash \varphi$.

      (ii) Si $T \vdash \neg\mathrm{Pr}\,\ulcorner \bot \urcorner$, l'instance $\neg P \to (P \to Q)$ donne $T \vdash \mathrm{Pr}\,\ulcorner \bot \urcorner \to \bot$, et (i) donne $T \vdash \bot$. Comme $\vdash 0 = 0$ ({{hk-egalite|Égalité démontrable}}, (i)), $T$ démontrerait une formule et sa négation, ce qui est exclu.
    remarques:
      - |
        Pour une théorie qui contient $\mathsf Q$ et dont les axiomes forment un ensemble récursivement énumérable, toute formule de démontrabilité satisfait (D1), par le point (ii) de {{cal-dg-prov|Démontrabilité (D1)}}. Les conditions (D2) et (D3), elles, portent sur la façon dont la formule est écrite, comme le montre la remarque suivante. Pour la formule naturelle, qui transcrit dans l'arithmétique la définition des démonstrations formelles à partir d'une formule qui définit les axiomes, (D2) revient à démontrer dans l'arithmétique de Peano que deux démonstrations mises bout à bout et suivies d'un modus ponens en forment une, et (D3) à démontrer à l'intérieur de l'arithmétique de Peano la {{cal-rp-sigma1|Σ₁-complétude}}, appliquée à l'énoncé Σ₁ $\mathrm{Pr}\,\ulcorner \varphi \urcorner$. Le point (ii) du nœud {{l-incompletude|Incomplétude}} repose sur ces deux démonstrations, que ce chapitre ne contient pas : (D2) est démontrée au nœud {{cal-sp-derivabilite|Deuxième condition (D2)}}, et (D3) au nœud {{cal-sg-d3|Troisième condition (D3)}}, qui en tire ce théorème pour la formule naturelle.
      - |
        La façon d'écrire la formule compte. Soit $T$ une théorie cohérente qui contient $\mathsf Q$ et dont les axiomes forment un ensemble récursivement énumérable, $\mathrm{Pr} = \exists y\, \delta$ une formule de démontrabilité pour $T$, et $c = \ulcorner \bot \urcorner$. La formule $\mathrm{Pr}' = \exists y\, \big(\delta \wedge \neg(v = \underline c)\big)$ est encore une formule de démontrabilité pour $T$ : la conjonction est Δ₀, et elle définit le même ensemble, puisque $c \notin \mathrm{Th}(T)$. Mais $\vdash \neg\mathrm{Pr}'\,\ulcorner \bot \urcorner$ : de $\vdash \underline c = \underline c$, la règle des tautologies tire $\vdash \neg\big(\delta[\underline c/v] \wedge \neg(\underline c = \underline c)\big)$, la généralisation en $y$ donne la formule universelle correspondante, et la règle des tautologies conclut, puisque $\exists y = \neg\forall y\, \neg$. Par (ii), $\mathrm{Pr}'$ ne satisfait donc pas à la fois (D2) et (D3) dans $T$, alors qu'elle satisfait (D1). L'erreur la plus répandue est de parler de « l'énoncé qui exprime la cohérence de $T$ » comme s'il n'y en avait qu'un : le second théorème porte sur un énoncé écrit d'une façon déterminée.
      - |
        Le théorème de Löb répond à une question posée par Leon Henkin en 1952 (problème 3, *Journal of Symbolic Logic* 17, 1952, p. 160) : un énoncé $H$ qui affirme sa propre démontrabilité, $T \vdash H \leftrightarrow \mathrm{Pr}\,\ulcorner H \urcorner$, est-il démontrable ? Oui, puisque $T \vdash \mathrm{Pr}\,\ulcorner H \urcorner \to H$. La réponse est de M. H. Löb (« Solution of a problem of Leon Henkin », *Journal of Symbolic Logic* 20, 1955, p. 115-118), à qui l'on doit aussi la condition (D3) sous cette forme. Les conditions de dérivabilité remontent à D. Hilbert et P. Bernays (*Grundlagen der Mathematik*, vol. 2, Berlin, Springer, 1939), qui ont donné la première démonstration détaillée du second théorème ; Gödel (1931, théorème XI) n'en avait publié qu'une esquisse.

