# Niveau 1 : structure interne du nœud « Analyse de Fourier ».
# Séries de Fourier sous forme réelle (cos, sin), l'analyse fonctionnelle de l'atlas étant
# réelle : densité des fonctions en escalier, coefficients et Bessel, Fejér, Parseval et
# Σ 1/n² = π²/6, Riemann-Lebesgue et Dini, divergence par Banach-Steinhaus ; transformée de
# Fourier sur L¹(ℝ) (intégrales de fonctions complexes par parties réelle et imaginaire),
# gaussienne, inversion, Plancherel, fonctions caractéristiques ; convergence en loi, lemme de Scheffé et
# théorème de continuité de Lévy (sens direct, démontré le 29 oct. 2026) ; convergence en loi et espérances,
# troncature, sélection de Helly, forme complète de Lévy, TCL sous un moment d'ordre 2 (29 oct. 2026).
# Parents : analyse fonctionnelle, analyse complexe (cos, sin, π, exp), probabilités (loi
# normale et ∫ e^{-x²/2} = √(2π)).

graphe: fourier
titre: Analyse de Fourier
conteneur: fourier

entrees:
  anf: [fo-densite, fo-coefficients, fo-divergence]
  anc: [fo-coefficients, fo-transformee]
  proba: [fo-transformee, fo-caracteristiques]

noeuds:
  - id: fo-densite
    etiquette: Densité
    nature: proposition
    titre: Densité des fonctions en escalier et continuité des translations
    texte: |
      On munit $\lex{ensemble-reels}{\mathbb R}$ de la tribu borélienne et de la mesure de Lebesgue $\lambda$ ({{m-lebesgue|Mesure de Lebesgue}}). Une **fonction en escalier** est ici une combinaison linéaire finie d'indicatrices d'intervalles bornés. Pour $p \in \{1, 2\}$, $L^p$ désigne $L^p(\lambda)$ sur $\mathbb R$ ou sur un intervalle borné ({{f-lp|Espaces L¹ et L²}}).
    enonce: |
      (i) Pour tout borélien $A$ de mesure finie et tout $\varepsilon > 0$, il existe une réunion finie $E$ d'intervalles telle que $\lambda(A \,\triangle\, E) < \varepsilon$.

      (ii) Les fonctions en escalier, et les fonctions continues nulles hors d'un segment, sont denses dans $\lex{espace-L1}{L^1}$ et dans $\lex{espace-L2}{L^2}$.

      (iii) *Continuité des translations.* Pour $f \in L^p$ et $\tau_yf(x) = f(x - y)$, $\|\tau_yf - f\|_p \to 0$ quand $y \to 0$.
    preuve: |
      (i) Supposons d'abord $A$ contenu dans un segment $I$. Soit $\mathcal D$ l'ensemble des boréliens $A \subset I$ approchables comme annoncé. Il contient les intervalles $]a, b] \cap I$, qui forment un π-système engendrant les boréliens de $I$ ({{m-tribus|Tribus}}).

      Il contient $I$, est stable par différence $B \setminus A$ avec $A \subset B$, puisque $(B \setminus A) \triangle (F \setminus E) \subset (B \triangle F) \cup (A \triangle E)$, et par réunion croissante, puisque $\lambda(A \setminus A_n) \to 0$ par continuité. C'est une classe monotone ; par le lemme de Dynkin ({{m-dynkin|Classes monotones}}), elle contient tous les boréliens de $I$.

      Si $A$ est quelconque de mesure finie, $\lambda\big(A \setminus [-n, n]\big) \to 0$, et l'on applique ce qui précède à $A \cap [-n, n]$.

      (ii) Par (i), $\|\mathbf 1_A - \mathbf 1_E\|_p^p = \lambda(A \triangle E)$ est petit. Une fonction étagée intégrable est combinaison finie d'indicatrices d'ensembles de mesure finie ; et toute $f \in L^p$ est limite dans $L^p$ de fonctions étagées, par l'approximation du nœud {{m-etagees|Fonctions étagées}} appliquée à $f^+$ et $f^-$, tronquée à $[-n, n]$, et par convergence dominée.

      Enfin l'indicatrice d'un intervalle $[a, b]$ est limite dans $L^p$ des fonctions continues affines par morceaux qui valent $1$ sur $[a, b]$, $0$ hors de $[a - \delta, b + \delta]$.

      (iii) Soit $g$ continue nulle hors d'un segment $[a, b]$, et $\eta > 0$. Le théorème de Heine ({{c-heine|Théorème de Heine}}), appliqué sur le segment $[a - 1, b + 1]$, fournit $\delta \in \,]0, 1]$ tel que $|g(x) - g(x')| \leqslant \eta$ pour $x, x'$ dans ce segment avec $|x - x'| < \delta$. Si $|x - x'| < \delta$ et que l'un des deux points sort de $[a - 1, b + 1]$, aucun n'est dans $[a, b]$, et $g(x) = g(x') = 0$ : $g$ est uniformément continue sur $\mathbb R$.

      Pour $|y| < \delta$, la fonction $\tau_yg - g$ est nulle hors de $[a - 1, b + 1]$ et bornée par $\eta$, d'où $\|\tau_yg - g\|_p \leqslant \eta\,(b - a + 2)^{1/p}$ : ainsi $\|\tau_yg - g\|_p \to 0$. On écrit
      $$\begin{aligned} \|\tau_yf - f\|_p &\leqslant \|\tau_y(f - g)\|_p \\ &\quad + \|\tau_yg - g\|_p + \|g - f\|_p, \end{aligned}$$
      le premier terme valant $\|f - g\|_p$ par invariance de $\lambda$ par translation.
    remarques:
      - |
        La continuité des translations est fausse dans $L^\infty$ : pour $f = \mathbf 1_{[0, 1]}$, $\sup|\tau_yf - f| = 1$ pour tout $y \neq 0$. C'est la raison pour laquelle l'analyse de Fourier se fait d'abord dans $L^1$ et $L^2$.
      - |
        Les points (i) et (ii) valent dans tout $L^p$, $1 \leqslant p < +\infty$, pour la tribu de Lebesgue comme pour la tribu borélienne : le nœud {{lp-densite|Densité}} de l'analyse fonctionnelle les obtient directement à partir de la définition de la mesure extérieure, sans le lemme de Dynkin.

  - id: fo-coefficients
    etiquette: Coefficients de Fourier
    nature: proposition
    titre: Système trigonométrique et coefficients de Fourier
    texte: |
      On travaille sur $[-\pi, \pi]$ avec le produit scalaire $\langle f, g \rangle = \frac1\pi\int_{-\pi}^{\pi} fg\,d\lambda$ de $\lex{espace-L2}{L^2}$.

      Les **coefficients de Fourier** de $f \in \lex{espace-L1}{L^1}([-\pi, \pi])$ sont $a_n(f) = \frac1\pi\int f(x)\cos(nx)\,dx$ et $b_n(f) = \frac1\pi\int f(x)\sin(nx)\,dx$, et sa **somme partielle de Fourier** est
      $$\begin{aligned} S_Nf(x) = {}&\frac{a_0}{2} + \sum_{n=1}^N \big(a_n\cos(nx) \\ &\qquad + b_n\sin(nx)\big). \end{aligned}$$
    enonce: |
      (i) *Orthogonalité.* Pour $m, n \geqslant 0$, $\langle \cos(m\,\cdot), \cos(n\,\cdot) \rangle$ vaut $0$ si $m \neq n$, $1$ si $m = n \geqslant 1$ et $2$ si $m = n = 0$ ; $\langle \sin(m\,\cdot), \sin(n\,\cdot) \rangle$ vaut $0$ si $m \neq n$ et $1$ si $m = n \geqslant 1$ ; $\langle \cos(m\,\cdot), \sin(n\,\cdot) \rangle = 0$.

      (ii) La famille $\frac{1}{\sqrt 2}, \cos x, \sin x, \cos 2x, \sin 2x, \dots$ est orthonormale, et $S_Nf$ est la projection orthogonale de $f \in L^2$ sur l'espace qu'engendrent ses $2N + 1$ premiers termes.

      (iii) *Bessel.* Pour $f \in L^2$, $\frac{a_0^2}2 + \sum_{n \geqslant 1}(a_n^2 + b_n^2) \leqslant \frac1\pi\int_{-\pi}^\pi f^2$.
    preuve: |
      (i) Les formules $\cos a\cos b = \frac12\big(\cos(a - b) + \cos(a + b)\big)$, $\sin a\sin b = \frac12\big(\cos(a - b) - \cos(a + b)\big)$ et $\sin a\cos b = \frac12\big(\sin(a + b) + \sin(a - b)\big)$ découlent de $\exp(i(a + b)) = \exp(ia)\exp(ib)$ ({{cx-exponentielle|Exponentielle}}).

      Pour $k \neq 0$ entier, $\int_{-\pi}^\pi \cos(kx)\,dx = \big[\frac{\sin(kx)}{k}\big]_{-\pi}^{\pi} = 0$, puisque $\sin(k\pi) = 0$ ({{cx-pi|Le nombre π}}), et $\int_{-\pi}^{\pi}\sin(kx)\,dx = 0$ par imparité.

      (ii) Les coefficients de $S_Nf$ sont les produits scalaires de $f$ avec la famille orthonormale ; la projection sur un sous-espace de dimension finie, fermé, est donnée par cette formule ({{f-bases-hilbertiennes|Bases hilbertiennes}}, (ii)).

      (iii) C'est l'inégalité de Bessel ({{f-bases-hilbertiennes|Bases hilbertiennes}}, (i)).
    remarques:
      - |
        Pour $f(x) = x$ sur $]{-\pi}, \pi[$, l'imparité annule les $a_n$, et une intégration par parties donne $b_n = \frac{2(-1)^{n+1}}{n}$. La série de Fourier est donc $2\big(\sin x - \frac{\sin 2x}{2} + \frac{\sin 3x}{3} - \cdots\big)$ ; on la retrouvera au nœud {{fo-parseval|Parseval}}.

  - id: fo-fejer
    etiquette: Théorème de Fejér
    nature: théorème
    titre: Noyaux de Dirichlet et de Fejér, théorème de Fejér
    texte: |
      Une fonction $f : \lex{ensemble-reels}{\mathbb R} \to \mathbb R$ est $2\pi$-**périodique** si $f(x + 2\pi) = f(x)$. Le **noyau de Dirichlet** est $D_N(t) = 1 + 2\sum_{k=1}^N \cos(kt)$ et le **noyau de Fejér** $F_N = \frac{1}{N + 1}\sum_{k=0}^N D_k$. La **moyenne de Fejér** de $f$ est $\sigma_Nf = \frac1{N + 1}\sum_{k=0}^N S_kf$.
    enonce: |
      (i) Pour $t \notin 2\pi\lex{ensemble-entiers-relatifs}{\mathbb Z}$, $D_N(t) = \dfrac{\sin\big((N + \frac12)t\big)}{\sin(t/2)}$ et $F_N(t) = \dfrac{1}{N + 1}\Big(\dfrac{\sin\big((N + 1)t/2\big)}{\sin(t/2)}\Big)^2$.

      On a
      $$S_Nf(x) = \frac1{2\pi}\int_{-\pi}^\pi f(x - t)D_N(t)\,dt$$
      et
      $$\sigma_Nf(x) = \frac1{2\pi}\int_{-\pi}^\pi f(x - t)F_N(t)\,dt$$
      pour $f$ périodique intégrable sur une période.

      (ii) $F_N \geqslant 0$, $\frac1{2\pi}\int_{-\pi}^\pi F_N = 1$, et pour tout $\delta \in \,]0, \pi[$, $\sup_{\delta \leqslant |t| \leqslant \pi} F_N(t) \to 0$.

      ```schema fo-fejer
      Pour $N = 8$, le noyau de Dirichlet $D_8$ (bleu) culmine à $17$ et prend des valeurs négatives, tandis que le noyau de Fejér $F_8$ (rouge) culmine à $9$ et reste positif. Dans les zones grisées $|t| \geqslant \delta$, ici avec $\delta = \frac\pi4$, $F_8$ reste sous la borne $\frac{1}{9\sin^2(\pi/8)} \approx 0{,}76$ de la preuve, qui tend vers $0$ quand $N$ grandit.
      ```

      (iii) *Fejér.* Pour $f$ continue et $2\pi$-périodique, $\sigma_Nf \to f$ uniformément. En particulier, les polynômes trigonométriques sont denses dans l'espace des fonctions continues $2\pi$-périodiques, pour la norme uniforme.
    preuve: |
      (i) Avec $w = \exp(it/2)$, $D_N(t) = \sum_{k=-N}^N w^{2k}$, somme géométrique égale à
      $$\frac{w^{2N+1} - w^{-2N-1}}{w - w^{-1}} = \frac{\sin((N + \frac12)t)}{\sin(t/2)}.$$

      En sommant,
      $$\begin{aligned} &\sum_{k=0}^N \sin\Big((k + \frac12)t\Big)\sin(t/2) \\ &= \frac12\sum_k \big(\cos(kt) - \cos((k + 1)t)\big) \\ &= \frac12\big(1 - \cos((N + 1)t)\big) \\ &= \sin^2\big((N + 1)t/2\big), \end{aligned}$$
      d'où $F_N$.

      La formule intégrale vient de $\cos(n(x - t)) = \cos(nx)\cos(nt) + \sin(nx)\sin(nt)$ et de la périodicité.

      (ii) $\frac1{2\pi}\int D_k = 1$ par l'orthogonalité ({{fo-coefficients|Coefficients de Fourier}}), donc $\frac1{2\pi}\int F_N = 1$. Pour $\delta \leqslant |t| \leqslant \pi$, $\sin^2(t/2) \geqslant \sin^2(\delta/2) > 0$, et $F_N(t) \leqslant \frac{1}{(N + 1)\sin^2(\delta/2)}$.

      (iii) $f$ est uniformément continue sur une période, donc sur $\mathbb R$. Pour $\varepsilon > 0$, soit $\delta$ tel que $|t| < \delta$ entraîne $|f(x - t) - f(x)| < \varepsilon$. Par (ii),
      $$\begin{aligned} &|\sigma_Nf(x) - f(x)| \\ &\leqslant \frac1{2\pi}\int_{-\pi}^\pi |f(x - t) - f(x)|\,F_N(t)\,dt \\ &\leqslant \varepsilon + 2\sup|f| \sup_{\delta \leqslant |t| \leqslant \pi} F_N(t), \end{aligned}$$
      qui est inférieur à $2\varepsilon$ pour $N$ grand, indépendamment de $x$.
    remarques:
      - |
        La densité des polynômes trigonométriques découle aussi du théorème de Stone-Weierstrass, appliqué aux fonctions polynomiales en $(x, y)$ sur le cercle unité de $\lex{n-uplet}{\mathbb R^2}$, puis composé avec $t \mapsto (\cos t, \sin t)$ ({{fc-polynomes|Applications}}, (ii)). Cette voie, par compacité, ne dit pas quel polynôme convient ; celle de Fejér fournit $\sigma_Nf$, et une majoration de l'erreur par le module de continuité de $f$.
      - |
        La positivité du noyau de Fejér est l'ingrédient décisif ; celui de Dirichlet change de signe, et l'on verra au nœud {{fo-divergence|Divergence}} que les sommes $S_Nf$ elles-mêmes peuvent diverger pour une fonction continue. Faire la moyenne des sommes partielles, comme Cesàro, suffit à tout régulariser.

  - id: fo-parseval
    etiquette: Parseval
    nature: théorème
    titre: Le système trigonométrique est une base hilbertienne
    enonce: |
      (i) La famille $\frac{1}{\sqrt 2}, \cos x, \sin x, \cos 2x, \sin 2x, \dots$ est une [[base-hilbertienne|base hilbertienne]] de $\lex{espace-L2}{L^2}([-\pi, \pi])$ : pour tout $f \in L^2$, $S_Nf \to f$ dans $L^2$.

      (ii) *Parseval.* $\dfrac{a_0^2}{2} + \displaystyle\sum_{n \geqslant 1}(a_n^2 + b_n^2) = \dfrac1\pi\int_{-\pi}^\pi f^2$.

      (iii) $\displaystyle\sum_{n \geqslant 1}\frac1{n^2} = \frac{\pi^2}{6}$.
    preuve: |
      (i) Il suffit que l'espace engendré soit dense ({{f-bases-hilbertiennes|Bases hilbertiennes}}, (ii)). Les fonctions continues nulles hors d'un segment intérieur à $]{-\pi}, \pi[$ sont denses dans $L^2$ ({{fo-densite|Densité}}) ; elles se prolongent en fonctions continues $2\pi$-périodiques, que le théorème de Fejér ({{fo-fejer|Théorème de Fejér}}) approche uniformément, donc dans $L^2$, par des polynômes trigonométriques.

      (ii) C'est l'égalité de Parseval pour une base hilbertienne.

      (iii) Pour $f(x) = x$, $a_n = 0$ et $b_n = 2(-1)^{n+1}/n$ ({{fo-coefficients|Coefficients de Fourier}}), et $\frac1\pi\int_{-\pi}^{\pi} x^2\,dx = \frac{2\pi^2}{3}$. Parseval donne $\sum 4/n^2 = 2\pi^2/3$.
    remarques:
      - |
        Le problème de Bâle, posé par Mengoli en 1650 et résolu par Euler en 1735, tombe ainsi en une ligne. Numériquement, $\sum_{n < 10^5} 1/n^2 \approx 1{,}644924$, à comparer à $\pi^2/6 \approx 1{,}644934$ : l'écart, de l'ordre de $10^{-5}$, est bien celui du reste $\sum_{n \geqslant N} 1/n^2 \approx 1/N$.
      - |
        La convergence a lieu dans $L^2$, c'est-à-dire en moyenne quadratique, et non point par point. L'erreur la plus répandue est de conclure de Parseval que $S_Nf(x) \to f(x)$ pour tout $x$ ; la convergence ponctuelle demande une hypothèse de régularité, objet du nœud suivant.

  - id: fo-dirichlet
    etiquette: Convergence ponctuelle
    nature: théorème
    titre: Riemann-Lebesgue et critère de Dini
    enonce: |
      (i) *Riemann-Lebesgue.* Pour $g \in \lex{espace-L1}{L^1}([-\pi, \pi])$, $\int g(t)\cos(\lambda t)\,dt$ et $\int g(t)\sin(\lambda t)\,dt$ tendent vers $0$ quand le réel $\lambda \to +\infty$.

      (ii) *Dini.* Soit $f$ intégrable sur une période, $2\pi$-périodique, et $x$ tel que $t \mapsto \frac{f(x - t) - f(x)}{t}$ soit intégrable au voisinage de $0$. Alors $S_Nf(x) \to f(x)$. C'est le cas si $f$ est dérivable en $x$, ou lipschitzienne au voisinage de $x$.
    preuve: |
      (i) Pour l'indicatrice d'un intervalle $[a, b]$, $\int_a^b \cos(\lambda t)\,dt = \frac{\sin(\lambda b) - \sin(\lambda a)}{\lambda}$ est majoré par $2/\lambda$. Par linéarité, l'énoncé vaut pour les fonctions en escalier, et par densité ({{fo-densite|Densité}}) pour toute $g \in L^1$, puisque $\big|\int (g - h)\cos(\lambda t)\big| \leqslant \|g - h\|_1$.

      (ii) Par {{fo-fejer|Théorème de Fejér}}, (i), et $\frac1{2\pi}\int D_N = 1$,
      $$\begin{aligned} &S_Nf(x) - f(x) \\ &= \frac1{2\pi}\int_{-\pi}^\pi \frac{f(x - t) - f(x)}{\sin(t/2)} \\ &\qquad \sin\big((N + \tfrac12)t\big)\,dt. \end{aligned}$$
      Sur $[-\pi, \pi]$, $|\sin(t/2)| \geqslant |t|/\pi$, par concavité du sinus sur $[0, \frac\pi2]$ ; la fonction $g(t) = \frac{f(x - t) - f(x)}{\sin(t/2)}$ est donc intégrable, et l'on applique (i) avec $\lambda = N + \frac12$, en développant $\sin((N + \frac12)t)$.
    remarques:
      - |
        Au point $x = \frac\pi2$, la série de $f(x) = x$ donne $\frac\pi2 = 2\big(1 - \frac13 + \frac15 - \cdots\big)$, c'est-à-dire la formule de Leibniz $\frac\pi4 = 1 - \frac13 + \frac15 - \frac17 + \cdots$. Aux points de discontinuité de la fonction prolongée par périodicité, $\pm\pi$, la série converge vers $0$, moyenne des limites à gauche et à droite.

        ```schema fo-dirichlet
        La fonction $f(x) = x$ sur $]{-\pi}, \pi[$, prolongée par périodicité (noir), et ses sommes partielles $S_3f$ (vert) et $S_{20}f$ (bleu) valent toutes $0$ en $\pm\pi$ (points rouges), moyenne des limites $\pi$ et $-\pi$. Près des sauts, $S_{20}f$ dépasse nettement $\pm\pi$ : c'est le phénomène de Gibbs, que la convergence ponctuelle n'empêche pas.
        ```

  - id: fo-divergence
    etiquette: Divergence
    nature: théorème
    titre: Une fonction continue dont la série de Fourier diverge
    choix: |
      Le point (ii) applique le théorème de Banach-Steinhaus ({{f-banach-steinhaus|Banach-Steinhaus}}) et hérite du [[choix-dependant|choix dépendant]] qu'emploie le théorème de Baire. Le point (i) n'en fait aucun.
    enonce: |
      (i) Les **constantes de Lebesgue** $L_N = \frac1{2\pi}\int_{-\pi}^{\pi}|D_N(t)|\,dt$ tendent vers $+\infty$.

      (ii) Il existe une fonction continue $2\pi$-périodique $f$ telle que la suite $S_Nf(0)$ ne soit pas bornée.
    preuve: |
      (i) Comme $|\sin u| \leqslant |u|$, $|D_N(t)| \geqslant \frac{2|\sin((N + \frac12)t)|}{|t|}$. Avec $u = (N + \frac12)t$,
      $$\begin{aligned} L_N &\geqslant \frac2\pi\int_0^{(N + \frac12)\pi}\frac{|\sin u|}{u}\,du \\ &\geqslant \frac2\pi\sum_{k=0}^{N-1}\frac{1}{(k + 1)\pi}\int_{k\pi}^{(k+1)\pi}|\sin u|\,du \\ &= \frac{4}{\pi^2}\sum_{k=1}^N\frac1k, \end{aligned}$$
      et la série harmonique diverge.

      (ii) Soit $E$ l'espace des fonctions continues $2\pi$-périodiques, de Banach pour la norme uniforme ({{f-exemples|Exemples d'espaces de Banach}}), et $u_N(f) = S_Nf(0) = \frac1{2\pi}\int f(-t)D_N(t)\,dt$, forme linéaire continue de norme au plus $L_N$.

      Elle vaut exactement $L_N$ : la fonction $\operatorname{signe}(D_N(-t))$, qui n'a qu'un nombre fini de sauts, est limite, en dehors de voisinages arbitrairement petits de ces sauts, de fonctions continues de norme $1$, et l'intégrale correspondante tend vers $L_N$.

      Si les $S_Nf(0)$ étaient bornés pour toute $f \in E$, le théorème de Banach-Steinhaus ({{f-banach-steinhaus|Banach-Steinhaus}}) bornerait les $L_N$, ce que (i) contredit.
    remarques:
      - |
        Numériquement, $L_{10} \approx 2{,}22$, $L_{100} \approx 3{,}14$, $L_{1000} \approx 4{,}07$ : la croissance est logarithmique, en $\frac{4}{\pi^2}\ln N$.

        Du Bois-Reymond a construit une fonction continue dont la série diverge en un point, annoncée en 1873 dans les *Göttinger Nachrichten* et publiée en détail en 1876 dans les *Abhandlungen* de l'Académie de Bavière ; la démonstration par Banach-Steinhaus, non constructive, en montre l'existence en quelques lignes. Carleson a prouvé en 1966 qu'au contraire, la série de Fourier d'une fonction de $\lex{espace-L2}{L^2}$ converge presque partout ; ce théorème difficile est admis ici.

  - id: fo-transformee
    etiquette: Transformée de Fourier
    nature: théorème
    titre: Transformée de Fourier des fonctions intégrables
    texte: |
      Une fonction $h = u + iv : \lex{ensemble-reels}{\mathbb R} \to \lex{ensemble-complexes}{\mathbb C}$ est intégrable si $u$ et $v$ le sont, et $\int h = \int u + i\int v$. La [[transformee-fourier|transformée de Fourier]] de $f \in \lex{espace-L1}{L^1}(\mathbb R)$ est
      $$\hat f(\xi) = \int_{\mathbb R} f(x)\,e^{-ix\xi}\,dx.$$
    enonce: |
      (i) $\big|\int h\big| \leqslant \int |h|$ ; en particulier $|\hat f(\xi)| \leqslant \|f\|_1$.

      (ii) $\hat f$ est continue, et $\hat f(\xi) \to 0$ quand $|\xi| \to \infty$ (Riemann-Lebesgue).

      (iii) Pour $\gamma(x) = e^{-x^2/2}$, $\hat\gamma(\xi) = \sqrt{2\pi}\,e^{-\xi^2/2}$. Plus généralement, pour $\varepsilon > 0$, la fonction $G_\varepsilon(x) = \frac{1}{\varepsilon\sqrt{2\pi}}e^{-x^2/(2\varepsilon^2)}$ vérifie $\hat G_\varepsilon(\xi) = e^{-\varepsilon^2\xi^2/2}$.

      (iv) Pour $f, g \in L^1$, la **convolée** $f * g(x) = \int f(x - y)g(y)\,dy$ est définie presque partout, intégrable, et $\widehat{f * g} = \hat f\,\hat g$.
    preuve: |
      (i) Si $\int h \neq 0$, écrivons $\int h = |\int h|\,e^{i\theta}$ ({{cx-pi|Le nombre π}}, (iii)) ; alors $|\int h| = \int \operatorname{Re}(e^{-i\theta}h) \leqslant \int |h|$.

      (ii) *Continuité.* Les fonctions $\cos$ et $\sin$ ont des dérivées bornées par $1$ ({{cx-exponentielle|Exponentielle}}, (iii) et (iv)) ; elles sont donc $1$-lipschitziennes ({{de-iaf|Accroissements finis}}, (ii)), et $|e^{-ix\xi} - e^{-ix\xi'}| \leqslant \min\big(2|x|\,|\xi - \xi'|, 2\big)$. Par (i), pour $|\xi - \xi'| \leqslant h$, on a $|\hat f(\xi) - \hat f(\xi')| \leqslant \omega(h)$, où
      $$\omega(h) = \int |f(x)|\min(2|x|h, 2)\,dx.$$

      La fonction $\omega$ est croissante. Les fonctions $|f(x)|\min(2|x|/m, 2)$ sont dominées par $2|f|$ et tendent vers $0$ en tout point quand $m \to \infty$ ; par convergence dominée ({{m-convergence-dominee|Convergence dominée}}, (i)), $\omega(\frac1m) \to 0$. Pour $\varepsilon > 0$, un entier $m$ tel que $\omega(\frac1m) \leqslant \varepsilon$ donne $|\hat f(\xi) - \hat f(\xi')| \leqslant \varepsilon$ dès que $|\xi - \xi'| \leqslant \frac1m$ : $\hat f$ est uniformément continue. Cet argument n'ajoute aucun choix, contrairement au passage par des suites quelconques.

      *Limite à l'infini.* Pour la limite, on applique l'argument de {{fo-dirichlet|Convergence ponctuelle}}, (i) : vrai pour l'indicatrice d'un intervalle, il passe aux fonctions en escalier, puis à $L^1$ par densité ({{fo-densite|Densité}}).

      (iii) Par imparité, $\hat\gamma(\xi) = g(\xi) = \int e^{-x^2/2}\cos(x\xi)\,dx$. Posons $s(\xi) = \int xe^{-x^2/2}\sin(x\xi)\,dx$ et $c_2 = \int x^2e^{-x^2/2}\,dx$, fini ({{p-normale|Loi normale}}, (ii)).

      *Dérivée, sans dérivation sous l'intégrale.* La dérivée seconde de $\cos$, qui est $-\cos$, est bornée par $1$ ; la formule de Taylor-Lagrange à l'ordre $1$ ({{de-taylor|Taylor-Lagrange}}) donne, pour tous réels $x$, $\xi$ et $h$, l'inégalité étant évidente si $xh = 0$,
      $$\begin{aligned} &\big|\cos(x(\xi + h)) - \cos(x\xi) + xh\sin(x\xi)\big| \\ &\leqslant \frac{x^2h^2}2. \end{aligned}$$

      En multipliant par $e^{-x^2/2}$ et en intégrant,
      $$|g(\xi + h) - g(\xi) + h\,s(\xi)| \leqslant \frac{c_2h^2}2,$$
      donc $g$ est dérivable et $g'(\xi) = -s(\xi)$. Une intégration par parties donne $s(\xi) = \xi g(\xi)$, d'où $g' = -\xi g$.

      Donc $\big(g(\xi)e^{\xi^2/2}\big)' = 0$, et $g(\xi) = g(0)e^{-\xi^2/2}$, avec $g(0) = \sqrt{2\pi}$ ({{p-normale|Loi normale}}). Le cas de $G_\varepsilon$ s'en déduit par le changement de variable $x = \varepsilon u$.

      (iv) Par Tonelli, $\int\!\!\int |f(x - y)g(y)|\,dy\,dx = \|f\|_1\|g\|_1$, par invariance de $\lambda$ par translation ; par Fubini ({{m-fubini|Tonelli, Fubini}}), $f * g$ est définie presque partout, intégrable, et
      $$\begin{aligned} &\widehat{f * g}(\xi) \\ &= \int\!\!\int f(x - y)e^{-i(x - y)\xi}g(y)e^{-iy\xi}\,dy\,dx \\ &= \hat f(\xi)\hat g(\xi). \end{aligned}$$
    remarques:
      - |
        La gaussienne est, à un facteur près, sa propre transformée de Fourier. C'est ce qui la rend omniprésente : elle sert de « noyau d'approximation » dans les deux nœuds suivants, et c'est elle que produit le théorème central limite ({{p-tcl|Théorème central limite}}).

  - id: fo-inversion
    etiquette: Inversion
    nature: théorème
    titre: Formule d'inversion de Fourier
    enonce: |
      (i) *Approximation de l'unité.* Pour $f \in \lex{espace-L1}{L^1}$, $f * G_\varepsilon \to f$ dans $L^1$ quand $\varepsilon \to 0$. Si $f$ est bornée et continue en $x$, $f * G_\varepsilon(x) \to f(x)$.

      ```schema fo-inversion
      Les régularisées $f * G_\varepsilon$ de $f = \mathbf 1_{[-1, 1]}$, pour $\varepsilon = 0{,}5$, $0{,}2$ et $0{,}05$, se rapprochent de $f$ en tout point où elle est continue. Aux deux sauts, elles valent toutes $\frac12$ à $10^{-4}$ près (points rouges), et non $f(\pm1) = 1$ : l'hypothèse de continuité en $x$ ne peut pas être omise.
      ```

      (ii) *Inversion.* Si $f \in L^1$ et $\hat f \in L^1$, alors, pour presque tout $x$,
      $$f(x) = \frac{1}{2\pi}\int_{\lex{ensemble-reels}{\mathbb R}} \hat f(\xi)\,e^{ix\xi}\,d\xi,$$
      et l'égalité a lieu en tout point où $f$ est continue. En particulier, $\hat f = 0$ entraîne $f = 0$ presque partout.
    preuve: |
      (i) $\int G_\varepsilon = 1$ ({{p-normale|Loi normale}}). Par Tonelli,
      $$\begin{aligned} &\|f * G_\varepsilon - f\|_1 \\ &\leqslant \int \|\tau_yf - f\|_1\,G_\varepsilon(y)\,dy \\ &= \int \|\tau_{\varepsilon u}f - f\|_1\,G_1(u)\,du, \end{aligned}$$
      intégrale où $\|\tau_{\varepsilon u}f - f\|_1 \leqslant 2\|f\|_1$.

      Soit $\eta > 0$. Par convergence monotone ({{m-beppo-levi|Convergence monotone}}), $\int_{|u| \leqslant m} G_1 \to \int G_1 = 1$ ; soit $R \geqslant 1$ un entier tel que $\int_{|u| > R} G_1 \leqslant \eta$. Par la continuité des translations ({{fo-densite|Densité}}, (iii)), il existe $\delta > 0$ tel que $\|\tau_yf - f\|_1 \leqslant \eta$ pour $|y| \leqslant \delta$.

      Pour $0 < \varepsilon \leqslant \delta/R$, on coupe l'intégrale en $|u| \leqslant R$, où $\|\tau_{\varepsilon u}f - f\|_1 \leqslant \eta$, et $|u| > R$ :
      $$\|f * G_\varepsilon - f\|_1 \leqslant \eta + 2\|f\|_1\,\eta.$$
      La limite est ainsi obtenue directement quand $\varepsilon \to 0$ ; cet argument n'ajoute aucun choix.

      Le second point se traite de même : $f * G_\varepsilon(x) - f(x) = \int \big(f(x - \varepsilon u) - f(x)\big)G_1(u)\,du$, on choisit $\delta$ par la continuité de $f$ en $x$, et la partie $|u| > R$ est majorée par $2\sup|f|\,\eta$.

      (ii) Posons $I_\varepsilon(x) = \frac1{2\pi}\int \hat f(\xi)e^{ix\xi}e^{-\varepsilon^2\xi^2/2}\,d\xi$. Par Fubini, licite puisque $|f(y)|e^{-\varepsilon^2\xi^2/2}$ est intégrable sur $\lex{n-uplet}{\mathbb R^2}$,
      $$\begin{aligned} I_\varepsilon(x) &= \int f(y)\,\Big(\frac1{2\pi}\int e^{-i(y - x)\xi} \\ &\qquad\qquad e^{-\varepsilon^2\xi^2/2}\,d\xi\Big)\,dy \\ &= \int f(y)\,G_\varepsilon(x - y)\,dy \\ &= f * G_\varepsilon(x), \end{aligned}$$
      la parenthèse se calculant par le changement de variable $\xi = s/\varepsilon$ et la formule $\hat\gamma = \sqrt{2\pi}\,\gamma$ ({{fo-transformee|Transformée de Fourier}}, (iii)), qui donnent
      $$\frac{1}{2\pi\varepsilon}\sqrt{2\pi}\,e^{-(y - x)^2/(2\varepsilon^2)} = G_\varepsilon(x - y).$$

      Prenons $\varepsilon = \frac1k$. Quand $k \to \infty$, $I_{1/k}(x)$ tend vers l'intégrale annoncée par convergence dominée ({{m-convergence-dominee|Convergence dominée}}, (i)), appliquée aux parties réelle et imaginaire, $\hat f$ étant intégrable. D'autre part, $f * G_{1/k} \to f$ dans $L^1$ par (i), donc presque partout le long d'une suite extraite ({{f-lp|Espaces L¹ et L²}}, (iii)) ; les $f * G_{1/k}$ sont des fonctions définies en tout point, et non des classes, si bien qu'aucun représentant n'est à choisir.

      *Points de continuité.* Le second membre $F(x) = \frac1{2\pi}\int \hat f(\xi)e^{ix\xi}\,d\xi$ est continu en tout point : comme en {{fo-transformee|Transformée de Fourier}}, (ii), pour $|x - x'| \leqslant h$,
      $$\begin{aligned} &|F(x) - F(x')| \\ &\leqslant \frac1{2\pi}\int |\hat f(\xi)|\min(2|\xi|h, 2)\,d\xi, \end{aligned}$$
      majorant croissant en $h$ qui tend vers $0$ le long de $h = \frac1m$.

      Soit $x$ un point de continuité de $f$, et supposons $|f(x) - F(x)| = 3\eta > 0$. Il existe $\delta > 0$ tel que $|f(y) - f(x)| < \eta$ et $|F(y) - F(x)| < \eta$ pour $|y - x| < \delta$. Alors $|f(y) - F(y)| > \eta$ sur $]x - \delta, x + \delta[$, ensemble de mesure $2\delta > 0$, ce qui contredit l'égalité presque partout : $f(x) = F(x)$.
    remarques:
      - |
        La transformée d'une fonction intégrable n'est pas toujours intégrable : pour $f = \mathbf 1_{[-1, 1]}$, $\hat f(\xi) = \frac{2\sin\xi}{\xi}$, dont l'intégrale du module diverge. La formule d'inversion ne s'applique alors pas telle quelle, ce qui annonce le cadre $\lex{espace-L2}{L^2}$ du nœud suivant.

  - id: fo-plancherel
    etiquette: Plancherel
    nature: théorème
    titre: Théorème de Plancherel
    texte: |
      Une fonction $h = u + iv : \lex{ensemble-reels}{\mathbb R} \to \lex{ensemble-complexes}{\mathbb C}$ est dite de carré intégrable si $u$ et $v$ le sont, et l'on pose $\|h\|_2^2 = \|u\|_2^2 + \|v\|_2^2 = \int |h|^2$.
    enonce: |
      Pour $f \in \lex{espace-L1}{L^1}(\lex{ensemble-reels}{\mathbb R}) \cap \lex{espace-L2}{L^2}(\mathbb R)$, $\hat f$ est de carré intégrable et
      $$\int_{\mathbb R} |\hat f(\xi)|^2\,d\xi = 2\pi\int_{\mathbb R} f(x)^2\,dx.$$
      La transformation $f \mapsto \hat f/\sqrt{2\pi}$ se prolonge donc en une isométrie de $L^2$ dans l'espace des fonctions complexes de carré intégrable.
    preuve: |
      Soit $\tilde f(x) = f(-x)$ et $g = f * \tilde f$, c'est-à-dire $g(x) = \int f(x + y)f(y)\,dy$. Par Cauchy-Schwarz ({{f-lp|Espaces L¹ et L²}}), $g$ est bornée par $\|f\|_2^2$ et continue, puisque $|g(x) - g(x')| \leqslant \|\tau_{-x}f - \tau_{-x'}f\|_2\|f\|_2$ ({{fo-densite|Densité}}) ; et $g(0) = \|f\|_2^2$.

      Par {{fo-transformee|Transformée de Fourier}}, (iv), $\hat g = \hat f\,\hat{\tilde f} = |\hat f|^2$, puisque $\hat{\tilde f} = \overline{\hat f}$, $f$ étant réelle.

      Le calcul de la preuve de l'inversion, qui n'utilisait que $f \in L^1$, donne
      $$\frac1{2\pi}\int |\hat f(\xi)|^2\,e^{-\varepsilon^2\xi^2/2}\,d\xi = g * G_\varepsilon(0).$$

      Prenons $\varepsilon = \frac1k$. Quand $k \to \infty$, le second membre tend vers $g(0) = \|f\|_2^2$ ({{fo-inversion|Inversion}}, (i)), et le premier croît vers $\frac1{2\pi}\int|\hat f|^2$ par convergence monotone.

      Le prolongement découle de la densité de $L^1 \cap L^2$ dans $L^2$ ({{fo-densite|Densité}}). Pour $f \in L^2$, les tronquées $f\mathbf 1_{[-n, n]}$ sont intégrables par Cauchy-Schwarz et convergent vers $f$ dans $L^2$ par convergence dominée ; par l'égalité établie, leurs transformées $h_n$ divisées par $\sqrt{2\pi}$ forment une suite de Cauchy de fonctions complexes de carré intégrable.

      Une telle suite $(h_n)$ est de Cauchy si et seulement si $(\operatorname{Re} h_n)$ et $(\operatorname{Im} h_n)$ le sont dans $L^2$ réel ; le théorème de Riesz-Fischer ({{f-lp|Espaces L¹ et L²}}, (ii)), appliqué à chacune, fournit la limite. Ces suites sont des fonctions et non des classes, ce qui écarte le choix de représentants signalé à ce nœud : le prolongement n'ajoute aucun choix.
    remarques:
      - |
        En mécanique quantique, $f$ et $\hat f$ décrivent un même état en position et en impulsion, et Plancherel dit que la probabilité totale est la même dans les deux descriptions. Le principe d'incertitude de Heisenberg, $\big(\int x^2f^2\big)\big(\int \xi^2|\hat f|^2\big) \geqslant \frac{\pi}{2}\|f\|_2^4$ dans cette normalisation, en découle par une intégration par parties et Cauchy-Schwarz.

  - id: fo-caracteristiques
    etiquette: Fonctions caractéristiques
    nature: théorème
    titre: Fonctions caractéristiques des variables aléatoires
    texte: |
      La [[fonction-caracteristique|fonction caractéristique]] d'une variable aléatoire réelle $X$ est $\varphi_X(t) = E[e^{itX}] = \int e^{itx}\,dP_X(x)$, intégrale de fonctions bornées.
    enonce: |
      (i) $|\varphi_X| \leqslant 1$, $\varphi_X(0) = 1$, et $\varphi_X$ est continue.

      (ii) Si $X$ et $Y$ sont indépendantes, $\varphi_{X+Y} = \varphi_X\,\varphi_Y$.

      (iii) Si $X$ suit $\mathcal N(0, 1)$, $\varphi_X(t) = e^{-t^2/2}$.

      (iv) *Unicité.* Si $\varphi_X = \varphi_Y$, alors $X$ et $Y$ ont même loi.
    preuve: |
      (i) Comme au nœud {{fo-transformee|Transformée de Fourier}}, (ii), on a $|\varphi_X(t) - \varphi_X(t')| \leqslant E\big[\min(2|X|h, 2)\big]$ pour $|t - t'| \leqslant h$ ; ce majorant croît avec $h$ et tend vers $0$ le long de $h = \frac1m$ par convergence dominée pour une suite ({{m-convergence-dominee|Convergence dominée}}, (i)), de sorte que $\varphi_X$ est uniformément continue, sans intégrale à paramètre.

      (ii) $e^{it(X+Y)} = e^{itX}e^{itY}$ ; en séparant parties réelles et imaginaires, l'espérance d'un produit de fonctions bornées de variables indépendantes est le produit des espérances ({{p-esperance|Espérance, variance}}, (iv)).

      (iii) $\varphi_X(t) = \frac1{\sqrt{2\pi}}\hat\gamma(-t) = e^{-t^2/2}$ ({{fo-transformee|Transformée de Fourier}}, (iii)).

      (iv) Soit $N$ de loi $\mathcal N(0, 1)$, indépendante de $X$, sur un espace produit, et $\sigma > 0$. La variable $X + \sigma N$ a pour densité $h_\sigma(x) = E\big[G_\sigma(x - X)\big]$, par Fubini ; en écrivant $G_\sigma(u) = \frac1{2\pi}\int e^{iut}e^{-\sigma^2t^2/2}\,dt$ par l'inversion ({{fo-inversion|Inversion}}), puis Fubini,
      $$h_\sigma(x) = \frac1{2\pi}\int \varphi_X(-t)\,e^{ixt}\,e^{-\sigma^2t^2/2}\,dt,$$
      qui ne dépend que de $\varphi_X$. Donc $X + \sigma N$ et $Y + \sigma N$ ont même loi pour tout $\sigma$.

      En un point $x$ tel que $P(X = x) = 0$, $\mathbf 1_{X + \sigma N \leqslant x} \to \mathbf 1_{X \leqslant x}$ presque sûrement quand $\sigma = \frac1k$ et $k \to \infty$, d'où $F_{X+N/k}(x) \to F_X(x)$ par convergence dominée.

      Les fonctions de répartition de $X$ et $Y$ coïncident donc en dehors des points où l'une a un saut, qui sont au plus dénombrables, au plus $n$ sauts de taille supérieure à $\frac1n$ ; par continuité à droite, elles coïncident partout, et les lois sont égales ({{p-variables|Variables aléatoires}}).
    remarques:
      - |
        Le théorème de continuité de Lévy relie la convergence simple des fonctions caractéristiques à la convergence des fonctions de répartition ; le sens utile est démontré au nœud suivant, {{fo-levy|Continuité de Lévy}}, et la forme complète, où la limite n'est supposée que continue en $0$, au nœud {{fo-levy-complet|Lévy, forme complète}}.

  - id: fo-levy
    etiquette: Continuité de Lévy
    nature: théorème
    titre: Théorème de continuité de Lévy
    texte: |
      Pour des variables réelles $X_n$ et $X$, éventuellement définies sur des espaces différents, on dit que $X_n$ [[convergence-loi|converge en loi]] vers $X$ si $F_{X_n}(x) \to F_X(x)$ en tout point $x$ où la fonction de répartition $F_X$ est continue ({{p-variables|Variables aléatoires}}).
    enonce: |
      (i) *Lemme de Scheffé.* Si des densités de probabilité $h_n$ convergent presque partout vers une densité $h$, alors $\int |h_n - h| \to 0$.

      (ii) *Lévy.* Si $\varphi_{X_n}(t) \to \varphi_X(t)$ pour tout $t \in \lex{ensemble-reels}{\mathbb R}$, alors $X_n$ converge en loi vers $X$.
    preuve: |
      (i) Comme $\int h_n = \int h = 1$, on a $\int (h - h_n) = 0$, donc $\int |h_n - h| = 2\int (h - h_n)^+$. Or $0 \leqslant (h - h_n)^+ \leqslant h$, intégrable, et $(h - h_n)^+ \to 0$ presque partout : la convergence dominée ({{m-convergence-dominee|Convergence dominée}}, (i)) conclut.

      (ii) *Lissage.* Soit $\sigma > 0$ et $N$ de loi $\mathcal N(0, 1)$, indépendante de $X_n$ sur un espace produit, comme dans la preuve de {{fo-caracteristiques|Fonctions caractéristiques}}, (iv).

      La variable $X_n + \sigma N$ a pour densité
      $$h_{n,\sigma}(x) = \frac1{2\pi}\int \varphi_{X_n}(-t)\,e^{ixt}\,e^{-\sigma^2t^2/2}\,dt,$$
      et de même $X + \sigma N$ a pour densité $h_\sigma$, avec $\varphi_X$.

      Comme $|\varphi_{X_n}| \leqslant 1$ et que $e^{-\sigma^2t^2/2}$ est intégrable, la convergence dominée ({{m-convergence-dominee|Convergence dominée}}, (i)), appliquée aux parties réelle et imaginaire, donne $h_{n,\sigma}(x) \to h_\sigma(x)$ pour tout $x$.

      Par (i), pour tout $y$,
      $$\begin{aligned} &|P(X_n + \sigma N \leqslant y) - P(X + \sigma N \leqslant y)| \\ &\leqslant \int |h_{n,\sigma} - h_\sigma| \to 0. \end{aligned}$$

      *Encadrement.* Soient $x \in \mathbb R$, $\varepsilon > 0$, et $r_\sigma = P(|\sigma N| > \varepsilon) \leqslant \sigma^2/\varepsilon^2$ (Bienaymé-Tchebychev, {{p-esperance|Espérance, variance}}, (iii)).

      Si $X_n \leqslant x$ et $\sigma N \leqslant \varepsilon$, alors $X_n + \sigma N \leqslant x + \varepsilon$ ; et si $X + \sigma N \leqslant x + \varepsilon$ et $\sigma N \geqslant -\varepsilon$, alors $X \leqslant x + 2\varepsilon$. Donc
      $$F_{X_n}(x) \leqslant P(X_n + \sigma N \leqslant x + \varepsilon) + r_\sigma$$
      et
      $$P(X + \sigma N \leqslant x + \varepsilon) \leqslant F_X(x + 2\varepsilon) + r_\sigma.$$

      En faisant tendre $n$ vers l'infini,
      $$\limsup_n F_{X_n}(x) \leqslant F_X(x + 2\varepsilon) + 2r_\sigma,$$
      puis, avec $\sigma \to 0$, $\limsup_n F_{X_n}(x) \leqslant F_X(x + 2\varepsilon)$, et, avec $\varepsilon \to 0$ et la continuité à droite de $F_X$, $\limsup_n F_{X_n}(x) \leqslant F_X(x)$.

      Les inclusions symétriques,
      $$\begin{aligned} \{X_n + \sigma N \leqslant x - \varepsilon\} &\subset \{X_n \leqslant x\} \\ &\quad \cup \{\sigma N < -\varepsilon\} \end{aligned}$$
      et
      $$\begin{aligned} \{X \leqslant x - 2\varepsilon\} &\subset \{X + \sigma N \leqslant x - \varepsilon\} \\ &\quad \cup \{\sigma N > \varepsilon\}, \end{aligned}$$
      donnent de même $\liminf_n F_{X_n}(x) \geqslant F_X(x - 2\varepsilon)$ pour tout $\varepsilon > 0$. Si $F_X$ est continue en $x$, $F_X(x - 2\varepsilon) \to F_X(x)$, et $F_{X_n}(x) \to F_X(x)$.
    remarques:
      - |
        Soit $X_n$ uniforme sur $\{\frac1n, \frac2n, \dots, 1\}$ et $X$ uniforme sur $[0, 1]$. Alors
        $$\varphi_{X_n}(t) = \frac1n\sum_{k=1}^n e^{itk/n}$$
        est une somme de Riemann de $x \mapsto e^{itx}$ sur $[0, 1]$, et tend vers $\int_0^1 e^{itx}\,dx = \varphi_X(t)$ ({{ri-sommes|Sommes de Riemann}}, appliqué à $\cos(tx)$ et à $\sin(tx)$).

        Le théorème donne la convergence en loi, que l'on vérifie directement : $F_{X_n}(x) = \lfloor nx \rfloor/n \to x$ pour $x \in [0, 1]$.

        ```schema fo-levy
        Les fonctions de répartition des lois uniformes sur $\{\frac kn : 1 \leqslant k \leqslant n\}$, pour $n = 4$ en bleu et $n = 12$ en rouge, sont des escaliers de marches $\frac1n$ ; elles se rapprochent de la diagonale $F_X(x) = x$, en gris, à moins de $\frac1n$ près.
        ```
      - |
        L'hypothèse porte sur une fonction limite qui est déjà une fonction caractéristique. La forme complète du théorème de Lévy ne suppose que la continuité en $0$ de la limite simple $\varphi$ : il faut alors montrer que la suite des lois ne laisse pas de masse s'échapper à l'infini, propriété de tension, puis extraire une sous-suite qui converge, ce qui demande un argument de compacité. Elle est démontrée au nœud {{fo-levy-complet|Lévy, forme complète}}, par l'inégalité de troncature ({{fo-troncature|Troncature}}) et le théorème de sélection de Helly ({{fo-helly|Sélection de Helly}}).

        L'exemple de $X_n$ de loi $\mathcal N(0, n)$, pour laquelle $\varphi_{X_n}(t) = e^{-nt^2/2}$ tend vers l'indicatrice de $\{0\}$, discontinue en $0$, montre que l'on ne peut pas omettre cette hypothèse : $F_{X_n}(x) \to \frac12$ pour tout $x$, et la limite n'est pas une fonction de répartition.
      - |
        Avec ce théorème, le théorème central limite ({{p-tcl|Théorème central limite}}) se ramène à un calcul de fonctions caractéristiques. Si $X_1, X_2, \dots$ sont indépendantes, de même loi que $X$ centrée réduite, et $S_n = X_1 + \cdots + X_n$, alors $\varphi_{S_n/\sqrt n}(t) = \varphi_X(t/\sqrt n)^n$ par {{fo-caracteristiques|Fonctions caractéristiques}}, (ii) ; comme $e^{-t^2/2}$ est la fonction caractéristique de la loi $\mathcal N(0, 1)$, dont la fonction de répartition est continue, il suffit de montrer que $\varphi_X(t/\sqrt n)^n \to e^{-t^2/2}$.

        Un développement de $\varphi_X$ à l'ordre $2$ en $0$, qui existe sous la seule hypothèse d'un moment d'ordre $2$, le permet, alors que la preuve de Lindeberg du nœud cité demande un moment d'ordre $3$. Ce développement et le théorème central limite qui s'en déduit sont démontrés au nœud {{fo-tcl|TCL par Fourier}}.

  - id: fo-loi-esperances
    etiquette: Loi et espérances
    nature: proposition
    titre: Convergence en loi et espérances des fonctions continues bornées
    enonce: |
      (i) Pour toute variable réelle $X$ et tout réel $x$, le saut $F_X(x) - \sup_{y < x} F_X(y)$ vaut $P(X = x)$. L'ensemble des points où $F_X$ est discontinue est de mesure de Lebesgue nulle ; en particulier, tout intervalle ouvert non vide contient un point où $F_X$ est continue.

      (ii) Si $X_n$ [[convergence-loi|converge en loi]] vers $X$, alors $E[f(X_n)] \to E[f(X)]$ pour toute fonction $f : \lex{ensemble-reels}{\mathbb R} \to \mathbb R$ continue et bornée. En particulier, $\varphi_{X_n}(t) \to \varphi_X(t)$ pour tout réel $t$.
    preuve: |
      (i) Les événements $\{X \leqslant x - \frac1k\}$ croissent vers $\{X < x\}$ ; par continuité croissante ({{m-mesures|Mesures}}, (iii)) et croissance de $F_X$, $\sup_{y < x} F_X(y) = P(X < x)$. Le saut vaut donc $P(X \leqslant x) - P(X < x) = P(X = x)$. Comme $F_X$ est continue à droite ({{p-variables|Variables aléatoires}}, (i)), elle est continue en $x$ si et seulement si $P(X = x) = 0$.

      Pour $m \geqslant 1$, soit $D_m$ l'ensemble des $x$ tels que $P(X = x) > \frac1m$. Si $x_1, \dots, x_r$ sont des points distincts de $D_m$, alors
      $$\begin{aligned} \frac rm &< \sum_{i=1}^r P(X = x_i) \\ &= P\big(X \in \{x_1, \dots, x_r\}\big) \leqslant 1, \end{aligned}$$
      donc $r < m$ : chaque $D_m$ est fini.

      L'ensemble $D$ des points de discontinuité est la réunion des $D_m$. Chaque $D_m$, fini, est de mesure de Lebesgue nulle ({{m-lebesgue|Mesure de Lebesgue}}), donc $\lambda(D) = 0$ par sous-additivité ({{m-mesures|Mesures}}, (ii)). Un intervalle $]a, b[$ avec $a < b$, de mesure $b - a > 0$, n'est donc pas contenu dans $D$.

      (ii) Soient $f$ continue et bornée, $\|f\| = \sup|f|$, et $\varepsilon > 0$. Notons $F = F_X$ et $F_n = F_{X_n}$. Comme $F$ tend vers $0$ en $-\infty$ et vers $1$ en $+\infty$, il existe des réels $A < B$ tels que $F(A) \leqslant \varepsilon$ et $F(B) \geqslant 1 - \varepsilon$.

      Par (i), il existe des points de continuité $a \in \,]A - 1, A[$ et $b \in \,]B, B + 1[$ de $F$ ; par croissance, $F(a) \leqslant \varepsilon$ et $F(b) \geqslant 1 - \varepsilon$.

      *Une fonction en escalier.* La fonction $f$ est uniformément continue sur $[a, b]$ ({{me-heine|Théorème de Heine}}) : soit $\delta > 0$ tel que $|f(x) - f(y)| \leqslant \varepsilon$ pour $x, y \in [a, b]$ et $|x - y| < \delta$. Soit $r \geqslant 2$ un entier tel que $h = \frac{b - a}r < \frac\delta2$.

      Par (i), chaque intervalle $]a + (j - 1)h, a + jh[$, pour $1 \leqslant j \leqslant r - 1$, contient un point de continuité $x_j$ de $F$. Avec $x_0 = a$ et $x_r = b$, on obtient des points de continuité $a = x_0 < x_1 < \cdots < x_r = b$ tels que $x_j - x_{j-1} < 2h < \delta$.

      Posons
      $$s = \sum_{j=1}^r f(x_j)\,\mathbf 1_{]x_{j-1}, x_j]}.$$
      Alors $|f - s| \leqslant \varepsilon$ sur $]a, b]$, et $|f - s| = |f| \leqslant \|f\|$ ailleurs. Pour toute variable $Y$, on a donc
      $$\begin{aligned} &|E[f(Y)] - E[s(Y)]| \\ &\leqslant \varepsilon + \|f\|\,P(Y \notin \,]a, b]) \\ &= \varepsilon + \|f\|\big(F_Y(a) + 1 - F_Y(b)\big), \end{aligned}$$
      et
      $$\begin{aligned} &E[s(Y)] \\ &= \sum_{j=1}^r f(x_j)\big(F_Y(x_j) - F_Y(x_{j-1})\big). \end{aligned}$$

      *Passage à la limite.* Tous les $x_j$ étant des points de continuité de $F$, la convergence en loi donne $E[s(X_n)] \to E[s(X)]$ et $F_n(a) + 1 - F_n(b) \to F(a) + 1 - F(b) \leqslant 2\varepsilon$. Par l'inégalité triangulaire,
      $$\begin{aligned} &\limsup_n |E[f(X_n)] - E[f(X)]| \\ &\leqslant 2\varepsilon\big(1 + 2\|f\|\big), \end{aligned}$$
      et $\varepsilon$ est arbitraire.

      Enfin $\varphi_X(t) = E[\cos(tX)] + iE[\sin(tX)]$, et l'on applique ce qui précède à $\cos(t\,\cdot)$ et à $\sin(t\,\cdot)$, continues et bornées par $1$ ({{cx-exponentielle|Exponentielle}}, (iii) et (iv)).
    remarques:
      - |
        L'hypothèse de continuité de $f$ ne peut pas être omise. La variable constante $X_n = \frac1n$ converge en loi vers $X = 0$, puisque $F_{X_n}(x) = \mathbf 1_{x \geqslant 1/n}$ tend vers $\mathbf 1_{x \geqslant 0}$ en tout $x \neq 0$, seul point de discontinuité de $F_X$. Pour $f = \mathbf 1_{]0, +\infty[}$, pourtant, $E[f(X_n)] = 1$ pour tout $n$, alors que $E[f(X)] = 0$ : la masse arrive en $0$ par la droite, exactement là où $f$ saute.
      - |
        L'hypothèse que $f$ est bornée ne peut pas l'être non plus, et c'est l'erreur la plus répandue : la convergence en loi ne dit rien des espérances elles-mêmes. Si $X_n$ vaut $n$ avec probabilité $\frac1n$ et $0$ sinon, $F_{X_n}(x) \to \mathbf 1_{x \geqslant 0}$ en tout $x$, et $X_n$ converge en loi vers $0$ ; mais $E[X_n] = 1$ pour tout $n$. Une masse de plus en plus petite, partie de plus en plus loin, suffit à maintenir l'espérance.
      - |
        Avec le théorème de Lévy ({{fo-levy|Continuité de Lévy}}), le point (ii) montre que la convergence en loi équivaut à la convergence simple des fonctions caractéristiques vers celle de la limite. Le nœud {{fo-levy-complet|Lévy, forme complète}} s'en sert pour identifier une limite qu'on ne connaît pas d'avance.

  - id: fo-troncature
    etiquette: Troncature
    nature: proposition
    titre: Inégalité de troncature et contrôle des queues
    enonce: |
      (i) *Inégalité de troncature.* Pour toute variable réelle $X$ et tout $u > 0$,
      $$\begin{aligned} &P\Big(|X| \geqslant \frac2u\Big) \\ &\leqslant \frac1u\int_{-u}^{u}\big(1 - \operatorname{Re}\varphi_X(t)\big)\,dt. \end{aligned}$$

      (ii) Soient $X_n$ des variables réelles dont les fonctions caractéristiques convergent simplement vers une fonction $\varphi$ continue en $0$. Pour tout $\varepsilon > 0$, il existe $M > 0$ tel que $P(|X_n| > M) \leqslant \varepsilon$ pour tout $n$.
    preuve: |
      (i) *Le noyau.* Pour $y$ réel, $\sin y = \int_0^y \cos s\,ds$ ({{cx-exponentielle|Exponentielle}}, (iv)), puisque la différence des deux membres a une dérivée nulle ({{ar-tfa|Théorème fondamental}}) et s'annule en $0$ ({{de-monotonie|Signe de la dérivée}}, (ii)), et $|\cos| \leqslant 1$ ({{cx-exponentielle|Exponentielle}}, (iii)) ; donc $|\sin y| \leqslant |y|$.

      Posons $k(0) = 0$ et, pour $y \neq 0$,
      $$k(y) = 2\Big(1 - \frac{\sin y}{y}\Big).$$
      Alors $k \geqslant 0$ ; et si $|y| \geqslant 2$, $\big|\frac{\sin y}{y}\big| \leqslant \frac1{|y|} \leqslant \frac12$, donc $k(y) \geqslant 1$.

      ```schema fo-troncature
      Le noyau $k(y) = 2\big(1 - \frac{\sin y}{y}\big)$, en rouge, reste positif et ne descend plus sous $1$ dès que $|y| \geqslant 2$ : il majore l'indicatrice de $\{|y| \geqslant 2\}$, en bleu. C'est toute l'inégalité de troncature, une fois $y$ remplacé par $uX$ et l'espérance prise.
      ```

      Pour $x$ réel non nul, une primitive de $t \mapsto \cos(tx)$ est $t \mapsto \frac{\sin(tx)}{x}$, d'où, par le théorème fondamental et {{m-riemann|Riemann et Lebesgue}},
      $$\begin{aligned} &\int_{-u}^{u}\big(1 - \cos(tx)\big)\,dt \\ &= 2u - \frac{2\sin(ux)}{x} = u\,k(ux), \end{aligned}$$
      égalité qui vaut aussi pour $x = 0$, les deux membres étant nuls.

      *Interversion.* La fonction $(t, x) \mapsto 1 - \cos(tx)$ est positive, et mesurable sur $\lex{n-uplet}{\mathbb R^2}$ pour la tribu produit, comme composée de la fonction continue $\cos$ et du produit des deux coordonnées ({{m-mesurables|Fonctions mesurables}}, (iii)).

      Comme $\operatorname{Re}\varphi_X(t) = E[\cos(tX)]$, le théorème de Tonelli ({{m-fubini|Tonelli, Fubini}}), appliqué à la mesure de Lebesgue sur $[-u, u]$ et à $P_X$, et le transfert ({{p-esperance|Espérance, variance}}, (i)) donnent
      $$\frac1u\int_{-u}^{u}\big(1 - \operatorname{Re}\varphi_X(t)\big)\,dt = E[k(uX)].$$
      Enfin $k(uX) \geqslant \mathbf 1_{\{|uX| \geqslant 2\}}$, d'où $E[k(uX)] \geqslant P(|X| \geqslant \frac2u)$.

      (ii) Chaque $\varphi_{X_n}$ est continue ({{fo-caracteristiques|Fonctions caractéristiques}}, (i)) ; la limite simple $\varphi$ a donc des parties réelle et imaginaire mesurables ({{m-mesurables|Fonctions mesurables}}, (ii)), elle est bornée par $1$, et $\varphi(0) = \lim_n \varphi_{X_n}(0) = 1$.

      Soit $\varepsilon > 0$. Par continuité de $\varphi$ en $0$, il existe $u > 0$ tel que $|1 - \varphi(t)| \leqslant \frac\varepsilon4$ pour $|t| \leqslant u$, d'où
      $$\frac1u\int_{-u}^{u}\big(1 - \operatorname{Re}\varphi\big) \leqslant \frac\varepsilon2.$$
      Sur $[-u, u]$, les fonctions $1 - \operatorname{Re}\varphi_{X_n}$ sont dominées par la constante $2$ et convergent simplement vers $1 - \operatorname{Re}\varphi$ ; par convergence dominée ({{m-convergence-dominee|Convergence dominée}}, (i)), leurs intégrales convergent.

      Il existe donc $N$ tel que $\frac1u\int_{-u}^{u}(1 - \operatorname{Re}\varphi_{X_n}) \leqslant \varepsilon$ pour $n \geqslant N$, et (i) donne alors $P(|X_n| > \frac2u) \leqslant \varepsilon$.

      Pour chaque $n < N$, les événements $\{|X_n| > m\}$, $m \in \lex{ensemble-entiers-naturels}{\mathbb N}$, décroissent et ont une intersection vide ; par continuité décroissante ({{m-mesures|Mesures}}, (iii)), $P(|X_n| > m) \to 0$. Soit $m_n$ le plus petit entier tel que $P(|X_n| > m_n) \leqslant \varepsilon$ ; le réel $M = \max\big(\frac2u, m_0, \dots, m_{N-1}\big)$ convient.
    remarques:
      - |
        L'intuition est la suivante : une masse placée loin de l'origine, en $x$, fait tourner $e^{itx}$ très vite, si bien que $1 - \operatorname{Re}\varphi_X(t)$ devient grand dès que $|t|$ est de l'ordre de $\frac1{|x|}$. La régularité de $\varphi_X$ près de $0$ contrôle donc les queues de la loi.

        Pour $X$ de loi $\mathcal N(0, 1)$ et $u = 1$, le membre de droite vaut $\int_{-1}^{1}(1 - e^{-t^2/2})\,dt \approx 0{,}289$, alors que $P(|X| \geqslant 2) \approx 0{,}0455$. La borne est grossière, mais elle ne fait intervenir que $\varphi_X$ sur $[-u, u]$, et c'est ce qui permet de passer à la limite en (ii).
      - |
        L'hypothèse de continuité en $0$ est indispensable. Pour $X_n$ de loi $\mathcal N(0, n)$, $\varphi_{X_n}(t) = e^{-nt^2/2}$ tend vers l'indicatrice de $\{0\}$, et le membre de droite de (i) tend vers $2$ pour tout $u$ : l'inégalité ne dit plus rien, et en effet $P(|X_n| > M) = P(|N| > M/\sqrt n)$ tend vers $1$ pour tout $M$, la masse s'échappant des deux côtés.

  - id: fo-helly
    etiquette: Sélection de Helly
    nature: théorème
    titre: Théorème de sélection de Helly
    texte: |
      Une suite de variables réelles $(X_n)$ est [[suite-tendue|tendue]] si, pour tout $\varepsilon > 0$, il existe $M > 0$ tel que $P(|X_n| > M) \leqslant \varepsilon$ pour tout $n$. On fixe une énumération $(q_j)_{j \in \lex{ensemble-entiers-naturels}{\mathbb N}}$ de $\lex{ensemble-rationnels}{\mathbb Q}$ ({{q-denombrable|ℚ est dénombrable}}), et l'on note $F_n = F_{X_n}$.
    enonce: |
      (i) *Sélection.* Pour toute suite de variables réelles $(X_n)$, il existe une suite extraite $(X_{n_k})$ et une fonction $G : \lex{ensemble-reels}{\mathbb R} \to [0, 1]$, croissante et continue à droite, telles que $F_{n_k}(x) \to G(x)$ en tout point $x$ où $G$ est continue.

      (ii) Si de plus la suite $(X_n)$ est tendue, $G$ tend vers $0$ en $-\infty$ et vers $1$ en $+\infty$. Il existe alors une variable $X$ de fonction de répartition $G$, et $X_{n_k}$ [[convergence-loi|converge en loi]] vers $X$.
    preuve: |
      (i) *Une extraction déterminée.* Pour une suite réelle bornée $v$, notons $\beta(v) : \mathbb N \to \mathbb N$ l'application strictement croissante construite dans la preuve du théorème de Bolzano-Weierstrass ({{ar-bw|Bolzano-Weierstrass}}), par le lemme des pics.

      Elle est entièrement déterminée par $v$ : si les pics sont en nombre infini, $\beta(v)(m)$ est le $(m + 1)$-ième pic dans l'ordre croissant ; sinon, $\beta(v)(0)$ est le plus petit entier strictement supérieur à tous les pics, et $\beta(v)(m + 1)$ le plus petit indice $p > \beta(v)(m)$ tel que $v_p > v_{\beta(v)(m)}$. La suite $\big(v_{\beta(v)(m)}\big)_m$ est monotone et bornée, donc converge.

      *Extraction diagonale.* On définit par récurrence des applications strictement croissantes $\psi_j : \mathbb N \to \mathbb N$ :
      $$\psi_0 = \beta\big((F_n(q_0))_n\big)$$
      et
      $$\begin{aligned} \psi_{j+1} &= \psi_j \circ \beta_{j+1}, \\ \beta_{j+1} &= \beta\big((F_{\psi_j(m)}(q_{j+1}))_m\big). \end{aligned}$$
      Par construction, la suite $\big(F_{\psi_j(m)}(q_j)\big)_m$ converge, vers un réel $H(q_j) \in [0, 1]$.

      Posons $n_k = \psi_k(k)$. Comme $\beta_{k+1}(m) \geqslant m$ ({{su-extraites|Suites extraites}}),
      $$\begin{aligned} n_{k+1} &= \psi_k\big(\beta_{k+1}(k + 1)\big) \\ &\geqslant \psi_k(k + 1) > \psi_k(k) = n_k. \end{aligned}$$

      ```schema fo-helly
      Exemple d'extractions emboîtées, choisi pour l'illustration : chaque ligne figure l'ensemble $\psi_j(\mathbb N)$ des indices retenus après $j + 1$ extractions, chacune retirant de la ligne précédente un point sur quatre. Le terme diagonal $n_k = \psi_k(k)$, en rouge, est le $(k + 1)$-ième point de la ligne $k$ ; à partir du rang $j$, tous les $n_k$ sont dans la ligne $j$, d'où la convergence en $q_j$.
      ```

      Fixons $j$. Pour $k \geqslant j$, $\psi_k = \psi_j \circ \beta_{j+1} \circ \cdots \circ \beta_k$, donc $n_k = \psi_j(m_k)$ pour un entier $m_k$ ; comme $n_k$ et $\psi_j$ sont strictement croissants, $m_k$ l'est aussi. La suite $\big(F_{n_k}(q_j)\big)_{k \geqslant j}$ est donc extraite de $\big(F_{\psi_j(m)}(q_j)\big)_m$, et converge vers $H(q_j)$ ({{su-extraites|Suites extraites}}, (i)). Ainsi $F_{n_k}(q) \to H(q)$ pour tout rationnel $q$.

      *La fonction $G$.* Comme limite de fonctions croissantes, $H$ est croissante sur $\mathbb Q$. Posons
      $$G(x) = \inf\{H(q) : q \in \mathbb Q,\ q > x\},$$
      borne inférieure d'une partie non vide de $[0, 1]$. La fonction $G$ est croissante, l'ensemble des rationnels $q > x$ diminuant quand $x$ augmente.

      Elle est continue à droite : pour $\varepsilon > 0$, il existe un rationnel $q > x$ tel que $H(q) < G(x) + \varepsilon$, et pour $x \leqslant y < q$, on a $G(x) \leqslant G(y) \leqslant H(q) < G(x) + \varepsilon$.

      *Convergence.* Soit $x$ un point de continuité de $G$. Pour tout rationnel $q > x$, $F_{n_k}(x) \leqslant F_{n_k}(q) \to H(q)$ ; donc $\limsup_k F_{n_k}(x) \leqslant H(q)$, puis $\limsup_k F_{n_k}(x) \leqslant G(x)$.

      Pour $y < x$, il existe un rationnel $r$ tel que $y < r < x$ ({{rr-archimede|Archimède, densité de ℚ}}, (ii)). Alors $G(y) \leqslant H(r)$, et $F_{n_k}(x) \geqslant F_{n_k}(r) \to H(r)$, d'où $\liminf_k F_{n_k}(x) \geqslant G(y)$. Par continuité de $G$ en $x$, $G(y)$ tend vers $G(x)$ quand $y$ tend vers $x$ par la gauche, et $\liminf_k F_{n_k}(x) \geqslant G(x)$.

      (ii) Soient $\varepsilon > 0$ et $M$ comme dans la définition. Pour un rationnel $q < -M$, $F_n(q) \leqslant P(|X_n| > M) \leqslant \varepsilon$, donc $H(q) \leqslant \varepsilon$ ; pour $x < -M$, en prenant un rationnel $q \in \,]x, -M[$, on obtient $G(x) \leqslant H(q) \leqslant \varepsilon$.

      Pour un rationnel $q > M$, $F_n(q) \geqslant 1 - P(|X_n| > M) \geqslant 1 - \varepsilon$, donc $H(q) \geqslant 1 - \varepsilon$, et $G(x) \geqslant 1 - \varepsilon$ pour $x \geqslant M$, comme borne inférieure de tels $H(q)$.

      La fonction $G$ est donc croissante, continue à droite, de limites $0$ et $1$. La preuve de {{p-suites-iid|Suites indépendantes}}, (ii), n'utilise de $F$ que ces propriétés : elle fournit une variable $X = h(U)$ telle que $F_X = G$, où $U$ est l'identité de $[0, 1[$ muni de la mesure de Lebesgue, de loi uniforme ({{p-variables|Variables aléatoires}}). Par (i), $F_{n_k}(x) \to F_X(x)$ en tout point de continuité de $F_X$.
    remarques:
      - |
        La sélection (i) n'utilise aucune forme de l'axiome du choix. Une rédaction qui dirait « on extrait de chaque suite une suite convergente, et l'on recommence » choisirait une infinité d'extractions, chacune dépendant de la précédente, ce qui relève du choix dépendant. Ici, chaque extraction est l'application $\beta$ déterminée par la suite, sans aucun choix ({{ar-bw|Bolzano-Weierstrass}}), et la récurrence ne fait que composer des objets définis ; l'énumération de $\mathbb Q$ est fixée une fois pour toutes.

        Seule l'existence de la variable $X$, en (ii), repose sur la mesure de Lebesgue, et donc sur le [[choix-denombrable|choix dénombrable]] qui en assure la σ-additivité, comme partout dans ce chapitre.
      - |
        Sans la tension, $G$ peut ne pas être une fonction de répartition. Pour $X_n = n$, $F_n(x) = \mathbf 1_{x \geqslant n}$ tend vers $0$ en tout point, et $G = 0$ : toute la masse s'est échappée vers $+\infty$. Pour $X_n$ de loi $\mathcal N(0, n)$, $F_n(x) \to \frac12$ et $G = \frac12$ : la moitié de la masse s'échappe de chaque côté.
      - |
        L'extraction ne peut pas être omise : pour $X_n = (-1)^n$, la suite $F_n(0)$ vaut alternativement $0$ et $1$ et ne converge pas, alors que les sous-suites d'indices pairs et impairs convergent en loi, vers $1$ et vers $-1$.
      - |
        Le théorème est dû à Helly, dans son article de 1912 sur les fonctionnelles linéaires (*Über lineare Funktionaloperationen*, Sitzungsberichte de l'Académie des sciences de Vienne, tome 121). C'est un énoncé de compacité : de toute suite tendue de lois, on peut extraire une suite qui converge en loi.

  - id: fo-levy-complet
    etiquette: Lévy, forme complète
    nature: théorème
    titre: Théorème de continuité de Lévy, forme complète
    enonce: |
      (i) Soient $X_n$ des variables réelles dont les fonctions caractéristiques convergent simplement vers une fonction $\varphi$ continue en $0$. Alors $\varphi$ est la fonction caractéristique d'une variable $X$, et $X_n$ [[convergence-loi|converge en loi]] vers $X$.

      (ii) En particulier, $X_n$ converge en loi vers $X$ si et seulement si $\varphi_{X_n}(t) \to \varphi_X(t)$ pour tout réel $t$.
    preuve: |
      (i) *Tension.* Par {{fo-troncature|Troncature}}, (ii), la suite $(X_n)$ est [[suite-tendue|tendue]].

      *Une limite pour une suite extraite.* Le théorème de Helly ({{fo-helly|Sélection de Helly}}, (ii)) fournit une suite extraite $(X_{n_k})$ et une variable $X$ telles que $X_{n_k}$ converge en loi vers $X$.

      *Identification.* Par {{fo-loi-esperances|Loi et espérances}}, (ii), $\varphi_{X_{n_k}}(t) \to \varphi_X(t)$ pour tout $t$. Mais $\varphi_{X_{n_k}}(t)$ tend aussi vers $\varphi(t)$, comme suite extraite d'une suite convergente ({{su-extraites|Suites extraites}}, (i), appliqué aux parties réelle et imaginaire). Par unicité de la limite, $\varphi = \varphi_X$.

      *Toute la suite.* Les fonctions caractéristiques des $X_n$ convergent donc simplement vers celle de $X$, et le théorème de Lévy ({{fo-levy|Continuité de Lévy}}, (ii)) donne la convergence en loi de toute la suite.

      (ii) Le sens direct est {{fo-levy|Continuité de Lévy}}, (ii), et la réciproque {{fo-loi-esperances|Loi et espérances}}, (ii).
    remarques:
      - |
        L'erreur la plus répandue est de croire que le théorème de Helly suffit, et que toute la suite converge dès qu'une suite extraite converge. Il n'en est rien, comme le montre $X_n = (-1)^n$. C'est l'identification $\varphi = \varphi_X$, puis l'unicité de la loi de fonction caractéristique donnée ({{fo-caracteristiques|Fonctions caractéristiques}}, (iv)), sur laquelle repose le nœud {{fo-levy|Continuité de Lévy}}, qui transfèrent la convergence d'une suite extraite à la suite entière : toutes les suites extraites convergentes ont la même limite.
      - |
        La forme complète produit des lois que l'on ne connaît pas d'avance. Soient $\varepsilon_1, \varepsilon_2, \dots$ des variables indépendantes valant $1$ et $-1$ avec probabilité $\frac12$ ({{p-suites-iid|Suites indépendantes}}, (iii)), et
        $$T_n = \sum_{k=1}^n \frac{\varepsilon_k}{k}.$$

        Chaque $\varepsilon_k/k$ a pour fonction caractéristique $\frac12\big(e^{it/k} + e^{-it/k}\big) = \cos\frac tk$ ; et $T_{n-1}$, mesurable pour la tribu engendrée par $\varepsilon_1, \dots, \varepsilon_{n-1}$, est indépendante de $\varepsilon_n/n$, mesurable pour $\sigma(\varepsilon_n)$, par regroupement ({{p-independance|Indépendance}}, (ii)). Par {{fo-caracteristiques|Fonctions caractéristiques}}, (ii), et récurrence,
        $$\varphi_{T_n}(t) = \prod_{k=1}^{n} \cos\frac tk.$$

        Pour $y$ réel, $1 - \cos y = \int_0^y \sin s\,ds \leqslant \frac{y^2}2$, par la majoration $|\sin s| \leqslant |s|$ de {{fo-troncature|Troncature}} ; en particulier $\cos y \geqslant \frac78 > 0$ pour $|y| \leqslant \frac12$.

        Le produit converge donc pour tout $t$ : à partir du rang $k \geqslant 2|t|$, les facteurs sont dans $]0, 1]$, et le produit des facteurs suivants décroît, minoré par $0$ ({{su-monotone|Limite monotone}}). Sa limite $\varphi$ est continue en $0$ : pour $|t| \leqslant 1$, on a $1 \geqslant \cos\frac tk \geqslant 1 - \frac{t^2}{2k^2} \geqslant 0$.

        L'inégalité $\prod_{k \leqslant n}(1 - a_k) \geqslant 1 - \sum_{k \leqslant n} a_k$, pour des $a_k \in [0, 1]$, se vérifie par récurrence : si elle vaut au rang $n$, on la multiplie par $1 - a_{n+1} \geqslant 0$, et $\big(1 - \sum_{k \leqslant n} a_k\big)(1 - a_{n+1}) \geqslant 1 - \sum_{k \leqslant n+1} a_k$, puisque le produit $a_{n+1}\sum_{k \leqslant n} a_k$ est positif. Elle donne
        $$1 \geqslant \varphi(t) \geqslant 1 - \frac{t^2}2\sum_{k \geqslant 1}\frac1{k^2} \geqslant 1 - t^2,$$
        la somme étant au plus $2$ ({{su-monotone|Limite monotone}}).

        Le théorème affirme alors que $\varphi$ est la fonction caractéristique d'une loi, limite en loi des $T_n$, sans en donner d'expression. Numériquement, $\varphi(1) \approx 0{,}3885$ et $\varphi(\frac12) \approx 0{,}8093$.

        ```schema fo-levy-complet
        Les fonctions caractéristiques $\prod_{k \leqslant n}\cos\frac tk$, pour $n = 1$ en vert, $n = 3$ en bleu, et leur limite $\varphi$, en rouge, calculée avec $10^5$ facteurs. La limite vaut $1$ en $0$ et reste au-dessus de la parabole grise $1 - t^2$ sur $[-1, 1]$ : elle est continue en $0$, ce qui suffit au théorème.
        ```
      - |
        On ne peut pas remplacer la continuité en $0$ par l'existence de la limite simple : dans l'exemple des lois $\mathcal N(0, n)$ ({{fo-levy|Continuité de Lévy}}), la limite existe partout, mais elle est discontinue en $0$, et aucune loi limite n'existe. La continuité en $0$ est exactement ce qui empêche la masse de s'échapper, par l'inégalité de troncature.

  - id: fo-tcl
    etiquette: TCL par Fourier
    nature: théorème
    titre: Théorème central limite sous un moment d'ordre 2
    enonce: |
      (i) *Restes de l'exponentielle.* Pour tout réel $y$, $|e^{iy} - 1| \leqslant |y|$, $|e^{iy} - 1 - iy| \leqslant \frac{y^2}2$, et
      $$\Big|e^{iy} - 1 - iy + \frac{y^2}2\Big| \leqslant \min\Big(\frac{|y|^3}6, y^2\Big).$$

      (ii) *Développement à l'ordre $2$.* Si $E[X^2] < +\infty$, alors pour tout réel $t$,
      $$\begin{aligned} &\Big|\varphi_X(t) - 1 - itE[X] + \frac{t^2}2E[X^2]\Big| \\ &\leqslant t^2\,\eta(t), \end{aligned}$$
      où $\eta(t) = E\big[\min\big(\frac{|t|\,|X|^3}6, X^2\big)\big]$ tend vers $0$ quand $t$ tend vers $0$.

      (iii) *Théorème central limite.* Soient $X_1, X_2, \dots$ des variables indépendantes, de même loi, avec $E[X_1] = 0$ et $E[X_1^2] = 1$, et $S_n = X_1 + \cdots + X_n$. Si $N$ suit la loi $\mathcal N(0, 1)$, alors pour tout réel $x$,
      $$P\Big(\frac{S_n}{\sqrt n} \leqslant x\Big) \longrightarrow P(N \leqslant x).$$
    preuve: |
      (i) Posons $r_0(y) = e^{iy}$, $r_1(y) = e^{iy} - 1$, $r_2(y) = e^{iy} - 1 - iy$ et
      $$r_3(y) = e^{iy} - 1 - iy + \frac{y^2}2.$$

      Chaque $r_{k+1}$ s'annule en $0$ et a pour dérivée $i\,r_k$, puisque $\frac{d}{dy}e^{iy} = ie^{iy}$ ({{cx-exponentielle|Exponentielle}}, (iv)). Le théorème fondamental ({{ar-tfa|Théorème fondamental}}) et le fait qu'une fonction de dérivée nulle sur un intervalle est constante ({{de-monotonie|Signe de la dérivée}}, (ii)), appliqués aux parties réelle et imaginaire, donnent
      $$r_{k+1}(y) = i\int_0^y r_k(s)\,ds.$$

      Par {{fo-transformee|Transformée de Fourier}}, (i), si $|r_k(s)| \leqslant c\,|s|^p$ entre $0$ et $y$, alors $|r_{k+1}(y)| \leqslant \frac{c\,|y|^{p+1}}{p+1}$. Partant de $|r_0| = 1$ ({{cx-exponentielle|Exponentielle}}, (iii)), on obtient successivement $|r_1(y)| \leqslant |y|$, $|r_2(y)| \leqslant \frac{y^2}2$ et $|r_3(y)| \leqslant \frac{|y|^3}6$.

      D'autre part, $|r_2(s)| \leqslant |r_1(s)| + |s| \leqslant 2|s|$, d'où $|r_3(y)| \leqslant y^2$.

      (ii) La variable $X$ est intégrable ({{p-esperance|Espérance, variance}}, (ii)). Par linéarité de l'espérance, appliquée aux parties réelle et imaginaire,
      $$\begin{aligned} &\varphi_X(t) - 1 - itE[X] + \frac{t^2}2E[X^2] \\ &= E[r_3(tX)]. \end{aligned}$$

      La preuve de {{fo-transformee|Transformée de Fourier}}, (i), vaut pour toute probabilité, et donne $|E[r_3(tX)]| \leqslant E[|r_3(tX)|]$. Par (i), $|r_3(tX)| \leqslant t^2\min\big(\frac{|t|\,|X|^3}6, X^2\big)$, d'où l'inégalité annoncée.

      La fonction $\eta$ est croissante en $|t|$, puisque $\min\big(\frac{|t|\,|X|^3}6, X^2\big)$ l'est en chaque point. Les variables $\min\big(\frac{|X|^3}{6m}, X^2\big)$ sont dominées par $X^2$, intégrable, et tendent vers $0$ en tout point quand $m \to \infty$ ; par convergence dominée ({{m-convergence-dominee|Convergence dominée}}, (i)), $\eta(\frac1m) \to 0$.

      Pour $\varepsilon > 0$, soit $m \geqslant 1$ tel que $\eta(\frac1m) \leqslant \varepsilon$ ; pour $|t| \leqslant \frac1m$, on a $0 \leqslant \eta(t) \leqslant \eta(\frac1m) \leqslant \varepsilon$. Donc $\eta(t) \to 0$ quand $t \to 0$, sans passer par les suites quelconques, dont l'usage demanderait le choix dénombrable.

      (iii) *Produit.* Notons $\varphi = \varphi_{X_1}$, qui est aussi la fonction caractéristique de chaque $X_k$, de même loi. La variable $S_{n-1}$ est mesurable pour la tribu engendrée par $X_1, \dots, X_{n-1}$, indépendante de $\sigma(X_n)$ par regroupement ({{p-independance|Indépendance}}, (ii)). Par {{fo-caracteristiques|Fonctions caractéristiques}}, (ii), et récurrence, $\varphi_{S_n} = \varphi^n$, d'où
      $$\varphi_{S_n/\sqrt n}(t) = \varphi\Big(\frac t{\sqrt n}\Big)^n.$$

      *Comparaison.* Fixons $t$ et $n \geqslant 1$, et posons $a = \varphi(t/\sqrt n)$ et $b = e^{-t^2/(2n)}$. Comme $|a| \leqslant 1$ et $|b| \leqslant 1$, l'identité $a^n - b^n = (a - b)\sum_{k=0}^{n-1}a^kb^{n-1-k}$ donne $|a^n - b^n| \leqslant n\,|a - b|$ ; et $b^n = e^{-t^2/2}$ ({{cx-exponentielle|Exponentielle}}, (ii)).

      Par (ii), avec $E[X_1] = 0$ et $E[X_1^2] = 1$,
      $$\Big|a - \Big(1 - \frac{t^2}{2n}\Big)\Big| \leqslant \frac{t^2}n\,\eta\Big(\frac t{\sqrt n}\Big).$$

      Pour $x \geqslant 0$, on a $0 \leqslant e^{-x} - 1 + x \leqslant \frac{x^2}2$. En effet, $e^{-x} - 1 + x = \int_0^x (1 - e^{-s})\,ds$, et $0 \leqslant 1 - e^{-s} = \int_0^s e^{-v}\,dv \leqslant s$ pour $s \geqslant 0$, puisque $0 < e^{-v} \leqslant 1$ pour $v \geqslant 0$ ({{cx-exponentielle|Exponentielle}}, (iv)). Avec $x = \frac{t^2}{2n}$, il vient $\big|b - \big(1 - \frac{t^2}{2n}\big)\big| \leqslant \frac{t^4}{8n^2}$.

      En rassemblant,
      $$\begin{aligned} &\big|\varphi_{S_n/\sqrt n}(t) - e^{-t^2/2}\big| \\ &\leqslant t^2\,\eta\Big(\frac t{\sqrt n}\Big) + \frac{t^4}{8n} \longrightarrow 0. \end{aligned}$$

      *Conclusion.* La limite $e^{-t^2/2}$ est la fonction caractéristique de $N$ ({{fo-caracteristiques|Fonctions caractéristiques}}, (iii)). Le théorème de Lévy ({{fo-levy|Continuité de Lévy}}, (ii)) donne la convergence en loi de $S_n/\sqrt n$ vers $N$.

      La fonction de répartition de $N$ est continue en tout point, puisque
      $$P(N = x) = \int_{\{x\}} \frac{e^{-u^2/2}}{\sqrt{2\pi}}\,du = 0,$$
      la mesure de Lebesgue de $\{x\}$ étant nulle ({{m-lebesgue|Mesure de Lebesgue}}) : la convergence a lieu pour tout réel $x$.
    remarques:
      - |
        Ce théorème s'applique là où la version démontrée au nœud {{p-tcl|Théorème central limite}}, qui suppose $E|X|^3 < +\infty$, ne s'applique pas. La loi de Student à trois degrés de liberté, de densité $\frac{6\sqrt3}{\pi(3 + x^2)^2}$, a une variance égale à $3$, mais $E|X|^3 = +\infty$, l'intégrande se comportant comme $\frac{c}{|x|}$ à l'infini.

        La variable réduite $Y = X/\sqrt3$ a pour densité $h(x) = \frac{2}{\pi(1 + x^2)^2}$. Soit $g(t) = (1 + |t|)e^{-|t|}$, paire, continue et intégrable. Les intégrales
        $$\int_0^\infty e^{-t}\cos(t\xi)\,dt = \frac1{1 + \xi^2}$$
        et
        $$\int_0^\infty te^{-t}\cos(t\xi)\,dt = \frac{1 - \xi^2}{(1 + \xi^2)^2}$$
        donnent $\hat g(\xi) = \frac{4}{(1 + \xi^2)^2} = 2\pi h(\xi)$, qui est intégrable. La formule d'inversion ({{fo-inversion|Inversion}}), appliquée à $g$, continue, donne alors $g(t) = \int h(\xi)e^{it\xi}\,d\xi = \varphi_Y(t)$ pour tout $t$.

        Par la série de l'exponentielle ({{cx-exponentielle|Exponentielle}}),
        $$g(t) = 1 - \frac{t^2}2 + \frac{|t|^3}3 + O(t^4).$$

        Supposons qu'il existe un polynôme $P$ de degré au plus $3$ tel que $g = P + o(t^3)$. Alors $P - (1 - \frac{t^2}2 + \frac{t^3}3)$, polynôme de degré au plus $3$, est un $o(t^3)$ quand $t \to 0^+$, donc nul, ses coefficients s'annulant l'un après l'autre ; de même $P = 1 - \frac{t^2}2 - \frac{t^3}3$ en considérant $t \to 0^-$.

        Le coefficient de $t^3$ vaudrait à la fois $\frac13$ et $-\frac13$, ce qui est absurde.

        La fonction $\varphi_Y$ n'a donc pas de développement d'ordre $3$, ce qui confirme ici l'absence de moment d'ordre $3$ (la réciproque est fausse en général) : seul le développement d'ordre $2$ de (ii) est disponible.

        ```schema fo-tcl
        Pour des copies indépendantes de $Y$, les fonctions caractéristiques $g(t/\sqrt n)^n$ de $S_n/\sqrt n$, pour $n = 1$ en vert et $n = 10$ en bleu, se rapprochent de $e^{-t^2/2}$, en rouge. La convergence est lente : en $t = 1$, l'écart, qu'on ne voit plus à cette échelle, vaut encore environ $0{,}019$ pour $n = 100$, de l'ordre de $\frac{e^{-1/2}}{3\sqrt n}$, à cause du terme en $|t|^3$.
        ```
      - |
        Pour des variables valant $1$ et $-1$ avec probabilité $\frac12$, $\varphi = \cos$, et $\cos(1/\sqrt n)^n$ vaut environ $0{,}6060$ pour $n = 100$, contre $e^{-1/2} \approx 0{,}6065$. L'écart, voisin de $\frac{e^{-1/2}}{12n}$, est d'ordre $\frac1n$, bien plus petit que dans l'exemple précédent : la vitesse dépend des moments supérieurs, que le théorème n'utilise pas, et qu'il ne quantifie pas non plus, contrairement à la majoration de Lindeberg.

