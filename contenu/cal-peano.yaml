# Niveau 2 : structure interne du chapitre « Arithmétique dans PA » (nœud cal-peano du graphe calc, après
# cal-representation, en parallèle de cal-diagonal, dont il ne dépend pas). Premier des quatre sous-lots qui
# démontreront la formule naturelle de démontrabilité et les conditions (D2), (D3) dans PA (point (ii) de
# l-incompletude, levé au dernier, cal-sigma-pa) : règles de démonstration sous hypothèses et règle de
# récurrence avec paramètres ; lois de l'addition et de la multiplication ; ordre t ≤ u := ∃z (z + t = u) et
# quantifications bornées ; plus petit élément, récurrence forte, division euclidienne ; divisibilité,
# congruences, Bézout, lemme chinois pour deux modules ; collection bornée et équivalence, démontrable dans PA,
# des formules de la classe 𝒮 de cal-rp-forme-sigma avec des formules Σ₁.
# Tout est démontré dans le système de l-deduction, avec les règles de cal-rp-calcul et celles de
# cal-pa-recurrence. Aucune forme de l'axiome du choix. Identifiants « cal-pa- ».

graphe: cal-peano
titre: Arithmétique dans PA
conteneur: cal-peano

entrees:
  cal-representation: [cal-pa-recurrence, cal-pa-sigma]

noeuds:
  - id: cal-pa-recurrence
    etiquette: Récurrence dans PA
    nature: lemme
    titre: Règles de démonstration dans l'arithmétique de Peano
    texte: |
      L'[[arithmetique-peano|arithmétique de Peano]] $\mathsf{PA}$ est celle de {{cal-theoremes|Théorèmes r.e.}} : six des axiomes de l'arithmétique de Robinson, et le [[schema-recurrence|schéma de récurrence]]. Elle démontre le septième, $\mathrm Q_3$ ({{cal-rp-godel-rosser|Gödel-Rosser}}, (iii)), donc tout ce que démontre $\mathsf Q$, par le lemme de remplacement de la preuve de {{cal-craig|Théorème de Craig}}. En particulier, les calculs de {{cal-rp-calculs-q|Calculs dans Q}} valent dans $\mathsf{PA}$, ainsi que les instances de $\mathrm Q_1$, $\mathrm Q_2$, $\mathrm Q_4$ à $\mathrm Q_7$ par des termes quelconques, écrites au début de leur preuve, et, pour tout terme $t$ où ne figure pas la variable $w$, l'instance $\neg(t = 0) \to \exists w\, (t = S\,w)$ du point (iii) de {{cal-rp-calculs-q|Calculs dans Q}}, obtenue par le point (ii) de {{cal-rp-calcul|Calcul à variables libres}}.

      Dans tout ce chapitre, $\Gamma$ désigne un ensemble fini de formules, closes ou non, et l'on écrit $\Gamma \vdash_{\mathsf{PA}} \varphi$ pour $\mathsf{PA} \cup \Gamma \vdash \varphi$, et $\vdash_{\mathsf{PA}} \varphi$ quand $\Gamma$ est vide. Dire que, *sous les hypothèses* $H_1, \dots, H_p$, on a $C$, c'est dire que $\{H_1, \dots, H_p\} \vdash_{\mathsf{PA}} C$. Par le point (i) de {{cal-rp-calcul|Calcul à variables libres}}, toute formule $\psi$ telle que $\vdash_{\mathsf{PA}} \psi$ ou $\vdash \psi$ peut alors servir sous ces hypothèses, et la règle des tautologies s'y applique ; c'est ainsi qu'on emploie sous hypothèses les instances des axiomes, le remplacement d'un terme et les règles de l'égalité, points (v) et (vi) du même nœud. On écrit $t + u + r$ pour $(t + u) + r$, et $t \times u + r$ pour $(t \times u) + r$.
    enonce: |
      Soit $\Gamma$ un ensemble fini de formules, $\alpha$, $\beta$, $\varphi$, $\psi$ des formules et $x$ une variable.

      (i) **Hypothèses.** Si $\Gamma \vdash_{\mathsf{PA}} \varphi$ et si $x$ n'est libre dans aucune formule de $\Gamma$, alors $\Gamma \vdash_{\mathsf{PA}} \forall x\, \varphi$. Si $\Gamma \cup \{\varphi\} \vdash_{\mathsf{PA}} \psi$ et si $x$ n'est libre ni dans $\psi$ ni dans aucune formule de $\Gamma$, alors $\Gamma \cup \{\exists x\, \varphi\} \vdash_{\mathsf{PA}} \psi$. Si une variable $b$ ne figure ni dans $\varphi$, ni dans $\psi$, ni dans aucune formule de $\Gamma$, et si $\Gamma \cup \{\varphi[b/x]\} \vdash_{\mathsf{PA}} \psi$, alors $\Gamma \cup \{\exists x\, \varphi\} \vdash_{\mathsf{PA}} \psi$.

      (ii) **Monotonie.** Si $\Gamma \vdash_{\mathsf{PA}} \alpha \to \beta$ et si $x$ n'est libre dans aucune formule de $\Gamma$, alors $\Gamma \vdash_{\mathsf{PA}} \forall x\, \alpha \to \forall x\, \beta$ et $\Gamma \vdash_{\mathsf{PA}} \exists x\, \alpha \to \exists x\, \beta$.

      Les points (i) et (ii) valent encore quand on remplace $\mathsf{PA}$ par une théorie quelconque, en particulier par la théorie vide, qui donne $\vdash$.

      (iii) **Récurrence.** Si $x$ n'est libre dans aucune formule de $\Gamma$, si $\Gamma \vdash_{\mathsf{PA}} \varphi[0/x]$ et si $\Gamma \cup \{\varphi\} \vdash_{\mathsf{PA}} \varphi[S\,x/x]$, alors $\Gamma \vdash_{\mathsf{PA}} \varphi$ et $\Gamma \vdash_{\mathsf{PA}} \forall x\, \varphi$.

      (iv) **Substitution simultanée.** Soit $T$ une théorie, $x_1, \dots, x_k$ des variables distinctes et $t_1, \dots, t_k$ des termes dont aucune variable n'est quantifiée dans $\alpha$. Si $T \vdash \alpha$, alors $T \vdash \alpha[t_1, \dots, t_k / x_1, \dots, x_k]$.
    preuve: |
      (i) Montrons, par récurrence sur une démonstration formelle de $\varphi$ à partir de $\mathsf{PA} \cup \Gamma$, que $\Gamma \vdash_{\mathsf{PA}} \forall x\, \gamma$ pour chacune de ses formules $\gamma$. Si $\gamma$ est un axiome logique, $\forall x\, \gamma$ en est un aussi, puisque les axiomes logiques sont toutes les généralisations des formules des groupes (1) à (5) de {{l-deduction|Démonstrations formelles}}. Si $\gamma$ est un axiome de $\mathsf{PA}$, c'est un énoncé, et si $\gamma$ est dans $\Gamma$, la variable $x$ n'y est pas libre : dans les deux cas, l'axiome (4) $\gamma \to \forall x\, \gamma$ et le [[modus-ponens|modus ponens]] concluent. Si $\gamma$ se déduit de $\beta$ et de $\beta \to \gamma$ par modus ponens, on a par hypothèse $\forall x\, \beta$ et $\forall x\, (\beta \to \gamma)$, et l'axiome (3) $\forall x\, (\beta \to \gamma) \to (\forall x\, \beta \to \forall x\, \gamma)$ et deux modus ponens donnent $\forall x\, \gamma$.

      Pour l'élimination, le point (i) de {{cal-rp-calcul|Calcul à variables libres}} donne $\Gamma \vdash_{\mathsf{PA}} \varphi \to \psi$, puis $\Gamma \vdash_{\mathsf{PA}} \neg\psi \to \neg\varphi$ par l'instance $(P \to Q) \to (\neg Q \to \neg P)$. Ce qui précède donne $\Gamma \vdash_{\mathsf{PA}} \forall x\, (\neg\psi \to \neg\varphi)$, et l'axiome (3) donne $\Gamma \vdash_{\mathsf{PA}} \forall x\, \neg\psi \to \forall x\, \neg\varphi$. Comme $x$ n'est pas libre dans $\psi$, l'axiome (4) donne $\vdash \neg\psi \to \forall x\, \neg\psi$, et la règle des tautologies donne $\Gamma \vdash_{\mathsf{PA}} \neg\forall x\, \neg\varphi \to \psi$, c'est-à-dire $\Gamma \vdash_{\mathsf{PA}} \exists x\, \varphi \to \psi$ ({{l-quantificateurs|Quantificateurs}}) ; le modus ponens conclut sous l'hypothèse supplémentaire $\exists x\, \varphi$.

      Enfin, si $b$ ne figure ni dans $\varphi$, ni dans $\psi$, ni dans $\Gamma$, ce qui précède, appliqué à la variable $b$, donne $\Gamma \cup \{\exists b\, \varphi[b/x]\} \vdash_{\mathsf{PA}} \psi$, et le renommage du point (iii) de {{cal-rp-calcul|Calcul à variables libres}} donne $\vdash \exists x\, \varphi \to \exists b\, \varphi[b/x]$, puisque $b$ ne figure pas dans $\varphi$.

      (ii) Par (i), $\Gamma \vdash_{\mathsf{PA}} \forall x\, (\alpha \to \beta)$, et l'axiome (3) donne la première implication. Pour la seconde, l'instance $(P \to Q) \to (\neg Q \to \neg P)$ donne $\Gamma \vdash_{\mathsf{PA}} \neg\beta \to \neg\alpha$, la première donne $\Gamma \vdash_{\mathsf{PA}} \forall x\, \neg\beta \to \forall x\, \neg\alpha$, et la même instance donne $\Gamma \vdash_{\mathsf{PA}} \neg\forall x\, \neg\alpha \to \neg\forall x\, \neg\beta$.

      Ces deux preuves n'emploient des axiomes de $\mathsf{PA}$ que le fait que ce sont des énoncés ; elles valent mot pour mot pour toute théorie, et pour la théorie vide.

      (iii) Soit $I$ la formule $\big(\varphi[0/x] \wedge \forall x\, (\varphi \to \varphi[S\,x/x])\big) \to \forall x\, \varphi$. Sa [[cloture-universelle|clôture universelle]] $\forall x_{i_1} \cdots \forall x_{i_g}\, I$ est un axiome de $\mathsf{PA}$, et $g$ applications du point (iii) de {{hk-generalisation|Règles dérivées}} donnent $\vdash_{\mathsf{PA}} I$. Le théorème de la déduction, sous la forme (i) de {{cal-rp-calcul|Calcul à variables libres}}, donne $\Gamma \vdash_{\mathsf{PA}} \varphi \to \varphi[S\,x/x]$, et (i) donne $\Gamma \vdash_{\mathsf{PA}} \forall x\, (\varphi \to \varphi[S\,x/x])$, puisque $x$ n'est pas libre dans $\Gamma$. Avec $\Gamma \vdash_{\mathsf{PA}} \varphi[0/x]$ et $\vdash_{\mathsf{PA}} I$, l'instance $P \to (Q \to (((P \wedge Q) \to R) \to R))$ donne $\Gamma \vdash_{\mathsf{PA}} \forall x\, \varphi$. Enfin, $x$ est substituable à elle-même dans $\varphi$, et l'axiome (2) $\forall x\, \varphi \to \varphi$ donne $\Gamma \vdash_{\mathsf{PA}} \varphi$.

      (iv) Soit $w_1, \dots, w_k$ des variables distinctes, différentes des $x_i$, qui ne figurent ni dans $\alpha$ ni dans les $t_j$ ; sans cette précaution, un $x_i$ absent de $\alpha$ pourrait servir de $w_j$, et une étape ultérieure remplacerait des lettres venues d'une autre variable. On substitue successivement $w_1$ à $x_1$, …, $w_k$ à $x_k$ par le point (ii) de {{cal-rp-calcul|Calcul à variables libres}} : chaque $w_i$, absente de la formule où on la substitue, y est substituable, et l'on obtient $T \vdash \alpha'$, où $\alpha'$ porte la lettre $w_i$ exactement aux places des [[occurrence|occurrences]] libres de $x_i$ dans $\alpha$. On n'a remplacé que des occurrences libres : les blocs $\forall v$ de $\alpha'$ sont ceux de $\alpha$, et aucune variable des $t_j$ n'y est quantifiée. On substitue ensuite successivement $t_1$ à $w_1$, …, $t_k$ à $w_k$ : chaque $t_i$ est substituable, puisque aucune variable de $t_i$ n'est quantifiée, et chaque étape remplace exactement les lettres $w_i$ venues des occurrences libres de $x_i$, puisque les $w_j$ ne figurent pas dans les termes $t_l$ déjà placés. Le résultat est $\alpha[t_1, \dots, t_k / x_1, \dots, x_k]$.
    remarques:
      - |
        Voici une première récurrence. L'énoncé $\forall x\, \neg(S\,x = x)$ est vrai dans $\mathcal N$, mais $\mathsf Q$ ne le démontre pas : dans la structure $\mathcal M$ de la deuxième remarque de {{cal-rp-calculs-q|Calculs dans Q}}, on a $S\,a = a$, et le {{l-correction|théorème de correction}} conclut. Dans $\mathsf{PA}$, prenons $\varphi = \neg(S\,x = x)$ et $\Gamma$ vide. La formule $\varphi[0/x] = \neg(S\,0 = 0)$ est une instance de $\mathrm Q_1$. Sous l'hypothèse $\neg(S\,x = x)$, l'instance $S\,S\,x = S\,x \to S\,x = x$ de $\mathrm Q_2$ et la contraposition donnent $\neg(S\,S\,x = S\,x)$, qui est $\varphi[S\,x/x]$. Le point (iii) donne $\vdash_{\mathsf{PA}} \forall x\, \neg(S\,x = x)$ : la récurrence exclut exactement les éléments comme $a$, que les axiomes de $\mathsf Q$, qui ne parlent que d'un pas à la fois, laissent passer.
      - |
        La condition « $x$ n'est libre dans aucune formule de $\Gamma$ » est indispensable, et l'erreur la plus répandue est de l'oublier en raisonnant sous une hypothèse qui porte sur la variable de récurrence. Soit $\Gamma = \{x = S\,0\}$ et $\varphi = \neg(x = S\,0)$. On a $\vdash_{\mathsf{PA}} \varphi[0/x]$ par le point (ii) de {{cal-rp-calculs-q|Calculs dans Q}}, et $\Gamma \cup \{\varphi\}$, qui contient une formule et sa négation, démontre $\varphi[S\,x/x]$. Pourtant $\Gamma \vdash_{\mathsf{PA}} \varphi$ est faux : il donnerait $\vdash_{\mathsf{PA}} x = S\,0 \to \neg(x = S\,0)$, donc $\vdash_{\mathsf{PA}} \neg(x = S\,0)$, puis $\vdash_{\mathsf{PA}} \neg(S\,0 = S\,0)$ par instanciation, alors que $\mathsf{PA}$ est cohérente ({{cal-rp-godel-rosser|Gödel-Rosser}}, (iii)). Le pas de récurrence doit valoir pour un $x$ dont les hypothèses ne disent rien ; une hypothèse sur $x$ change en même temps que lui.
      - |
        Le schéma prend la clôture universelle : les variables libres de $\varphi$ autres que $x$ sont des *paramètres*, et le point (iii) est la récurrence avec paramètres, alors que la preuve de $\mathrm Q_3$ au nœud {{cal-rp-godel-rosser|Gödel-Rosser}} n'en avait pas besoin. Les hypothèses de $\Gamma$ où $x$ n'est pas libre jouent le même rôle. Les nœuds qui suivent n'emploient que ces règles et celles de {{cal-rp-calcul|Calcul à variables libres}} ; le point (iv) étend aux formules quantifiées la substitution simultanée de ce nœud, qui ne portait que sur les formules sans quantificateur.

  - id: cal-pa-lois
    etiquette: Lois de + et ×
    nature: proposition
    titre: Lois de l'addition et de la multiplication dans l'arithmétique de Peano
    texte: |
      Les conventions sont celles de {{cal-pa-recurrence|Récurrence dans PA}}. Une *chaîne* $t_0 = t_1 = \cdots = t_n$, sous des hypothèses données, signifie que chaque égalité $t_{i-1} = t_i$ est démontrable sous ces hypothèses : instance d'un axiome ou d'une égalité déjà établie, hypothèse, ou leur image par la congruence $t = u \to r[t/v] = r[u/v]$, qui remplace un sous-terme par un terme égal. La transitivité et la symétrie de l'égalité ({{cal-rp-calcul|Calcul à variables libres}}, (vi)) donnent alors $t_0 = t_n$.
    enonce: |
      Pour tous termes $t$, $u$ et $r$ :

      (i) **Addition.** $\vdash_{\mathsf{PA}} 0 + t = t$, $\vdash_{\mathsf{PA}} S\,t + u = S(t + u)$, $\vdash_{\mathsf{PA}} S\,t = t + S\,0$, $\vdash_{\mathsf{PA}} t + u = u + t$ et $\vdash_{\mathsf{PA}} t + u + r = t + (u + r)$.

      (ii) **Simplification.** $\vdash_{\mathsf{PA}} t + r = u + r \to t = u$ et $\vdash_{\mathsf{PA}} t + u = 0 \to (t = 0 \wedge u = 0)$.

      (iii) **Multiplication.** $\vdash_{\mathsf{PA}} 0 \times t = 0$, $\vdash_{\mathsf{PA}} t \times S\,0 = t$, $\vdash_{\mathsf{PA}} S\,t \times u = t \times u + u$, $\vdash_{\mathsf{PA}} t \times u = u \times t$, $\vdash_{\mathsf{PA}} t \times (u + r) = t \times u + t \times r$, $\vdash_{\mathsf{PA}} (t + u) \times r = t \times r + u \times r$ et $\vdash_{\mathsf{PA}} (t \times u) \times r = t \times (u \times r)$.

      (iv) $\vdash_{\mathsf{PA}} t \times S\,r = u \times S\,r \to t = u$ et $\vdash_{\mathsf{PA}} t \times u = 0 \to (t = 0 \vee u = 0)$.
    preuve: |
      Toutes ces formules sont sans quantificateur. Il suffit donc de les démontrer quand $t$, $u$ et $r$ sont trois variables distinctes $x$, $y$ et $z$ : le point (ii) de {{cal-rp-calcul|Calcul à variables libres}} donne ensuite le cas de termes quelconques. Chaque récurrence est celle du point (iii) de {{cal-pa-recurrence|Récurrence dans PA}}, avec $\Gamma$ vide ; on indique la variable de récurrence, les autres étant des paramètres.

      (i) *$0 + x = x$, par récurrence sur $x$.* Le cas $0$ est l'instance $0 + 0 = 0$ de $\mathrm Q_4$. Sous l'hypothèse $0 + x = x$, la chaîne $0 + S\,x = S(0 + x) = S\,x$ emploie $\mathrm Q_5$ puis l'hypothèse.

      *$S\,x + y = S(x + y)$, par récurrence sur $y$.* Pour $0$ : $S\,x + 0 = S\,x = S(x + 0)$, par $\mathrm Q_4$ deux fois. Sous l'hypothèse $S\,x + y = S(x + y)$ : $S\,x + S\,y = S(S\,x + y) = S\,S(x + y) = S(x + S\,y)$, par $\mathrm Q_5$, l'hypothèse et $\mathrm Q_5$.

      *$S\,x = x + S\,0$*, sans récurrence : $x + S\,0 = S(x + 0) = S\,x$, par $\mathrm Q_5$ et $\mathrm Q_4$.

      *$x + y = y + x$, par récurrence sur $y$.* Pour $0$ : $x + 0 = x = 0 + x$, par $\mathrm Q_4$ et le premier calcul. Sous l'hypothèse $x + y = y + x$ : $x + S\,y = S(x + y) = S(y + x) = S\,y + x$, par $\mathrm Q_5$, l'hypothèse et le deuxième calcul, appliqué aux variables $y$ et $x$.

      *$x + y + z = x + (y + z)$, par récurrence sur $z$.* Pour $0$ : $x + y + 0 = x + y = x + (y + 0)$, par $\mathrm Q_4$ deux fois. Sous l'hypothèse : $x + y + S\,z = S(x + y + z) = S(x + (y + z)) = x + S(y + z) = x + (y + S\,z)$, par $\mathrm Q_5$, l'hypothèse, $\mathrm Q_5$ et $\mathrm Q_5$.

      (ii) *$x + z = y + z \to x = y$, par récurrence sur $z$.* Pour $0$ : sous l'hypothèse $x + 0 = y + 0$, la chaîne $x = x + 0 = y + 0 = y$ conclut, et le théorème de la déduction donne la formule. Sous les hypothèses $x + z = y + z \to x = y$ et $x + S\,z = y + S\,z$ : la chaîne $S(x + z) = x + S\,z = y + S\,z = S(y + z)$ et l'instance $S(x + z) = S(y + z) \to x + z = y + z$ de $\mathrm Q_2$ donnent $x + z = y + z$, puis $x = y$ par la première hypothèse ; le théorème de la déduction décharge la seconde.

      *$x + y = 0 \to (x = 0 \wedge y = 0)$*, sans récurrence. Soit $w$ une variable distincte de $x$ et de $y$, et $C$ la formule $x = 0 \wedge y = 0$. Sous les hypothèses $x + y = 0$ et $y = S\,w$, la chaîne $S(x + w) = x + S\,w = x + y = 0$ contredit l'instance $\neg(S(x + w) = 0)$ de $\mathrm Q_1$, et l'instance $P \to (\neg P \to Q)$ donne $C$. La variable $w$ n'est libre ni dans $x + y = 0$ ni dans $C$ : l'élimination du point (i) de {{cal-pa-recurrence|Récurrence dans PA}} donne $C$ sous les hypothèses $x + y = 0$ et $\exists w\, (y = S\,w)$. Sous les hypothèses $x + y = 0$ et $y = 0$, la chaîne $x = x + 0 = x + y = 0$ donne $x = 0$, d'où $C$. Le raisonnement par cas, avec l'instance $\neg(y = 0) \to \exists w\, (y = S\,w)$ de $\mathrm Q_3$ et la tautologie $(\neg A \to B) \to ((A \to C) \to ((B \to C) \to C))$, donne $C$ sous la seule hypothèse $x + y = 0$.

      (iii) *$0 \times x = 0$, par récurrence sur $x$.* Pour $0$, c'est $\mathrm Q_6$. Sous l'hypothèse $0 \times x = 0$ : $0 \times S\,x = 0 \times x + 0 = 0 \times x = 0$, par $\mathrm Q_7$, $\mathrm Q_4$ et l'hypothèse.

      *$x \times S\,0 = x$*, sans récurrence : $x \times S\,0 = x \times 0 + x = 0 + x = x$, par $\mathrm Q_7$, $\mathrm Q_6$ et (i).

      *$S\,x \times y = x \times y + y$, par récurrence sur $y$.* Pour $0$ : $S\,x \times 0 = 0 = x \times 0 = x \times 0 + 0$, par $\mathrm Q_6$ deux fois et $\mathrm Q_4$. Sous l'hypothèse $S\,x \times y = x \times y + y$ :
      $$\begin{aligned} S\,x \times S\,y &= S\,x \times y + S\,x \\ &= x \times y + y + S\,x \\ &= x \times y + (y + S\,x) \\ &= x \times y + (x + S\,y) \\ &= x \times y + x + S\,y \\ &= x \times S\,y + S\,y, \end{aligned}$$
      par $\mathrm Q_7$, l'hypothèse, l'associativité, l'égalité $y + S\,x = S(y + x) = S(x + y) = x + S\,y$, tirée de $\mathrm Q_5$ et de la commutativité, l'associativité et $\mathrm Q_7$.

      *$x \times y = y \times x$, par récurrence sur $y$.* Pour $0$ : $x \times 0 = 0 = 0 \times x$. Sous l'hypothèse : $x \times S\,y = x \times y + x = y \times x + x = S\,y \times x$, par $\mathrm Q_7$, l'hypothèse et le calcul précédent, appliqué aux variables $y$ et $x$.

      *$x \times (y + z) = x \times y + x \times z$, par récurrence sur $z$.* Pour $0$ : $x \times (y + 0) = x \times y = x \times y + 0 = x \times y + x \times 0$, par $\mathrm Q_4$ deux fois et $\mathrm Q_6$. Sous l'hypothèse :
      $$\begin{aligned} x \times (y + S\,z) &= x \times S(y + z) \\ &= x \times (y + z) + x \\ &= x \times y + x \times z + x \\ &= x \times y + (x \times z + x) \\ &= x \times y + x \times S\,z, \end{aligned}$$
      par $\mathrm Q_5$, $\mathrm Q_7$, l'hypothèse, l'associativité et $\mathrm Q_7$. La distributivité à droite s'en déduit : $(x + y) \times z = z \times (x + y) = z \times x + z \times y = x \times z + y \times z$, par la commutativité trois fois.

      *$(x \times y) \times z = x \times (y \times z)$, par récurrence sur $z$.* Pour $0$ : les deux membres valent $0$, par trois instances de $\mathrm Q_6$, $(x \times y) \times 0 = 0$, $y \times 0 = 0$ sous la congruence, qui donne $x \times (y \times 0) = x \times 0$, et $x \times 0 = 0$. Sous l'hypothèse :
      $$\begin{aligned} &(x \times y) \times S\,z \\ &\quad = (x \times y) \times z + x \times y \\ &\quad = x \times (y \times z) + x \times y \\ &\quad = x \times (y \times z + y) \\ &\quad = x \times (y \times S\,z), \end{aligned}$$
      par $\mathrm Q_7$, l'hypothèse, la distributivité et $\mathrm Q_7$.

      (iv) *$x \times S\,z = y \times S\,z \to x = y$, par récurrence sur $x$*, appliquée à la formule $\varphi = \forall y\, (x \times S\,z = y \times S\,z \to x = y)$. Soit $w$ une variable distincte de $x$, $y$ et $z$.

      Pour $0$ : sous l'hypothèse $0 \times S\,z = y \times S\,z$, la chaîne $y \times z + y = y \times S\,z = 0 \times S\,z = 0$ et (ii) donnent $y = 0$, d'où $0 = y$. Le théorème de la déduction et la généralisation en $y$ donnent $\vdash_{\mathsf{PA}} \varphi[0/x]$.

      Pas : sous les hypothèses $\varphi$ et $S\,x \times S\,z = y \times S\,z$, montrons $S\,x = y$. Sous l'hypothèse supplémentaire $y = 0$, la chaîne $S(S\,x \times z + x) = S\,x \times z + S\,x = S\,x \times S\,z = y \times S\,z = 0 \times S\,z = 0$, par $\mathrm Q_5$, $\mathrm Q_7$, l'hypothèse, le remplacement et (iii), contredit $\mathrm Q_1$, et $S\,x = y$ s'en déduit. Sous l'hypothèse supplémentaire $y = S\,w$, la chaîne $x \times S\,z + S\,z = S\,x \times S\,z = y \times S\,z = S\,w \times S\,z = w \times S\,z + S\,z$, par (iii) deux fois, donne $x \times S\,z = w \times S\,z$ par (ii). L'axiome (2), avec le terme $w$, donne $\varphi \to (x \times S\,z = w \times S\,z \to x = w)$, d'où $x = w$, puis $S\,x = S\,w = y$. La variable $w$ n'est libre ni dans les hypothèses ni dans la conclusion : l'élimination et le raisonnement par cas sur l'instance de $\mathrm Q_3$ donnent $S\,x = y$. Le théorème de la déduction décharge l'hypothèse $S\,x \times S\,z = y \times S\,z$, et la généralisation en $y$, qui n'est pas libre dans $\varphi$, donne $\varphi[S\,x/x]$. Le point (iii) de {{cal-pa-recurrence|Récurrence dans PA}} donne $\vdash_{\mathsf{PA}} \varphi$, et l'axiome (2), avec le terme $y$, conclut.

      *$x \times y = 0 \to (x = 0 \vee y = 0)$*, sans récurrence. Sous les hypothèses $x \times y = 0$ et $y = 0$, la conclusion est immédiate. Sous les hypothèses $x \times y = 0$ et $y = S\,w$, la chaîne $x \times w + x = x \times S\,w = x \times y = 0$ et (ii) donnent $x = 0$. L'élimination de $w$ et le raisonnement par cas concluent comme en (ii).
    remarques:
      - |
        Les trois formules établies sans récurrence, $S\,t = t + S\,0$ et les secondes formules de (ii) et de (iv), sont démontrables dans $\mathsf Q$, puisque leurs preuves n'emploient que ses axiomes. Les lois dont la preuve demande une récurrence, au contraire, ne le sont pas en général, alors que $\mathsf Q$ en démontre toutes les instances par des chiffres ({{cal-rp-calculs-q|Calculs dans Q}}, (i) et (ii)). Dans la structure $\mathcal M$ de la deuxième remarque de ce nœud, on a $0 + a = b \neq a$ ; $a + 0 = a$ et $0 + a = b$, donc l'addition n'est pas commutative ; $(0 + 0) + a = b$ et $0 + (0 + a) = 0 + b = a$, donc elle n'est pas associative ; $0 + a = 1 + a = b$, donc elle n'est pas simplifiable. Pour la multiplication, $a \times S\,0 = b$ ; $1 \times a = a$ et $a \times 1 = b$ ; $(1 \times a) \times 1 = b$ et $1 \times (a \times 1) = a$ ; $1 \times (0 + a) = a$ et $1 \times 0 + 1 \times a = b$ ; enfin $1 \times S\,a = 2 \times S\,a = a$, avec $1 \neq 2$. Par le {{l-correction|théorème de correction}}, $\mathsf Q$ ne démontre aucune de ces lois. Ces valeurs ont été vérifiées par un calcul sur la table de $\mathcal M$ ; les seules formules de l'énoncé qui y restent vraies sont les trois formules démontrables dans $\mathsf Q$, $S\,t + u = S(t + u)$ et $0 \times t = 0$, et $\mathcal M$ ne tranche pas pour ces deux dernières. Pour $0 \times t = 0$, il suffit de modifier $\mathcal M$ en posant $0 \times a = a$ : les sept axiomes restent satisfaits, puisque $\mathrm Q_7$ en $x = 0$, $y = a$ s'écrit $0 \times a = 0 \times a + 0$ et qu'aucun autre axiome ne fait intervenir $0 \times a$, ce qu'a confirmé le même calcul ; cette structure réfute $0 \times t = 0$.
      - |
        L'ordre des démonstrations n'est pas indifférent, et l'erreur la plus répandue est de tenter la commutativité d'emblée. Par récurrence sur $y$, le cas $0$ demande $x + 0 = 0 + x$, c'est-à-dire $0 + x = x$, qui est déjà une récurrence, et le pas demande de faire passer $S$ à gauche, ce que fait la deuxième formule de (i), récurrence elle aussi. De même, la commutativité de la multiplication demande d'abord $0 \times x = 0$ et $S\,x \times y = x \times y + y$ : les axiomes ne calculent que sur le second argument, et presque chaque loi qui touche au premier coûte une récurrence ; $t + u = 0 \to (t = 0 \wedge u = 0)$ y échappe, parce qu'il suffit de décomposer $u$.
      - |
        Hermann Grassmann a défini l'addition et la multiplication par récurrence et en a tiré les lois usuelles dans son *Lehrbuch der Arithmetik* (1861) ; Peano s'est largement servi de ce travail, comme le rapporte H. Wang (« The axiomatization of arithmetic », *Journal of Symbolic Logic* 22, 1957, p. 145-158). La différence est ici que chaque récurrence est une instance d'un schéma du premier ordre, appliquée dans un système formel.

  - id: cal-pa-ordre
    etiquette: Ordre dans PA
    nature: proposition
    titre: Ordre et quantifications bornées dans l'arithmétique de Peano
    texte: |
      Comme au nœud {{cal-rp-calculs-q|Calculs dans Q}}, $t \leqslant u$ désigne l'une quelconque des formules $\exists z\, (z + t = u)$, où $z$ ne figure ni dans $t$ ni dans $u$, et l'on note $t < u$ la formule $S\,t \leqslant u$. Deux de ces formules, écrites avec des variables $z$ et $z'$, sont démontrablement équivalentes, par le renommage du point (iii) de {{cal-rp-calcul|Calcul à variables libres}}, appliqué dans les deux sens : $z'$ ne figure pas dans $z + t = u$, et $(z + t = u)[z'/z]$ est $z' + t = u$. Les quantifications bornées $\forall x \leqslant t\ \varphi$ et $\exists x \leqslant t\ \varphi$ sont celles de {{cal-rp-sigma1|Σ₁-complétude}}, où la variable liée $z$ de la borne est distincte de $x$ et où $t$ ne contient ni $x$ ni $z$.

      Dans les énoncés, les variables liées des formules $t \leqslant u$ et des bornes ne figurent dans aucun des termes ; dans les preuves, $a$, $b$, $c$ désignent des variables qui ne figurent nulle part ailleurs, et l'on raisonne comme au nœud {{cal-pa-lois|Lois de + et ×}}, par chaînes d'égalités.
    enonce: |
      Pour tous termes $t$, $u$ et $r$ :

      (i) $\vdash_{\mathsf{PA}} t \leqslant t$, $\vdash_{\mathsf{PA}} 0 \leqslant t$, $\vdash_{\mathsf{PA}} t \leqslant u + t$ et $\vdash_{\mathsf{PA}} t \leqslant t + u$.

      (ii) $\vdash_{\mathsf{PA}} t \leqslant 0 \leftrightarrow t = 0$ et $\vdash_{\mathsf{PA}} t \leqslant S\,u \leftrightarrow (t \leqslant u \vee t = S\,u)$.

      (iii) $\vdash_{\mathsf{PA}} (t \leqslant u \wedge u \leqslant r) \to t \leqslant r$ et $\vdash_{\mathsf{PA}} (t \leqslant u \wedge u \leqslant t) \to t = u$.

      (iv) **Ordre total.** $\vdash_{\mathsf{PA}} t \leqslant u \vee u \leqslant t$.

      (v) **Ordre strict.** $\vdash_{\mathsf{PA}} t < u \leftrightarrow (t \leqslant u \wedge \neg(t = u))$, $\vdash_{\mathsf{PA}} \neg(t < 0)$, $\vdash_{\mathsf{PA}} t < S\,u \leftrightarrow t \leqslant u$, $\vdash_{\mathsf{PA}} t < u \vee t = u \vee u < t$ et $\vdash_{\mathsf{PA}} \neg(t < u \wedge u \leqslant t)$.

      (vi) **Compatibilité.** $\vdash_{\mathsf{PA}} t \leqslant u \leftrightarrow t + r \leqslant u + r$, $\vdash_{\mathsf{PA}} t \leqslant u \to t \times r \leqslant u \times r$ et $\vdash_{\mathsf{PA}} \neg(r = 0) \to t \leqslant t \times r$.

      (vii) **Quantifications bornées.** Soit $\varphi$ une formule, $x$ une variable, et les bornes écrites avec une variable liée $z$, comme ci-dessus.

      (a) Si $u$ est substituable à $x$ dans $\varphi$ et ne contient pas $z$, alors $\vdash \forall x \leqslant t\ \varphi \to (u \leqslant t \to \varphi[u/x])$ et $\vdash u \leqslant t \to (\varphi[u/x] \to \exists x \leqslant t\ \varphi)$, où $u \leqslant t$ est écrite avec $z$.

      (b) Si $x$ n'est libre dans aucune formule de $\Gamma$ et si $\Gamma \cup \{x \leqslant t\} \vdash_{\mathsf{PA}} \varphi$, alors $\Gamma \vdash_{\mathsf{PA}} \forall x \leqslant t\ \varphi$. Si $b$ est distincte de $z$ et ne figure ni dans $\varphi$, ni dans $t$, ni dans $\psi$, ni dans $\Gamma$, et si $\Gamma \cup \{b \leqslant t, \varphi[b/x]\} \vdash_{\mathsf{PA}} \psi$, alors $\Gamma \cup \{\exists x \leqslant t\ \varphi\} \vdash_{\mathsf{PA}} \psi$.

      (c) $\vdash \exists x \leqslant t\ \varphi \leftrightarrow \exists x\, (x \leqslant t \wedge \varphi)$.

      (d) $\vdash_{\mathsf{PA}} \forall x \leqslant 0\ \varphi \leftrightarrow \varphi[0/x]$, et, si $S\,t$ est substituable à $x$ dans $\varphi$,
      $$\begin{aligned} &\vdash_{\mathsf{PA}} \forall x \leqslant S\,t\ \varphi \\ &\qquad \leftrightarrow \big(\forall x \leqslant t\ \varphi \wedge \varphi[S\,t/x]\big), \\ &\vdash_{\mathsf{PA}} \exists x \leqslant S\,t\ \varphi \\ &\qquad \leftrightarrow \big(\exists x \leqslant t\ \varphi \vee \varphi[S\,t/x]\big). \end{aligned}$$

      (e) Si $x$ n'est libre dans aucune formule de $\Gamma$ et si $\Gamma \vdash_{\mathsf{PA}} \varphi \to \psi$, alors $\Gamma \vdash_{\mathsf{PA}} \forall x \leqslant t\ \varphi \to \forall x \leqslant t\ \psi$ et $\Gamma \vdash_{\mathsf{PA}} \exists x \leqslant t\ \varphi \to \exists x \leqslant t\ \psi$. Si $x$ et $z$ ne figurent pas dans $u$, alors $\vdash_{\mathsf{PA}} t \leqslant u \to (\forall x \leqslant u\ \varphi \to \forall x \leqslant t\ \varphi)$ et $\vdash_{\mathsf{PA}} t \leqslant u \to (\exists x \leqslant t\ \varphi \to \exists x \leqslant u\ \varphi)$.
    preuve: |
      Une formule $\exists z\, (z + t = u)$ s'obtient, par l'introduction du point (iii) de {{cal-rp-calcul|Calcul à variables libres}}, de toute égalité $s + t = u$ où $s$ est un terme : $z$ n'est sous aucun quantificateur dans $z + t = u$. On dit qu'on introduit $t \leqslant u$ avec le témoin $s$. Inversement, sous une hypothèse $t \leqslant u$, le point (i) de {{cal-pa-recurrence|Récurrence dans PA}}, avec une variable nouvelle, permet de raisonner sous l'hypothèse $a + t = u$ : c'est l'élimination avec le témoin $a$.

      (i) Les témoins sont $0$, $t$, $u$ et $u$ : $0 + t = t$, $t + 0 = t$, $u + t = u + t$ et $u + t = t + u$, par les points (i) de {{cal-pa-lois|Lois de + et ×}} et (vi) de {{cal-rp-calcul|Calcul à variables libres}}.

      (ii) Sous l'hypothèse $a + t = 0$, le point (ii) de {{cal-pa-lois|Lois de + et ×}} donne $t = 0$ ; sous l'hypothèse $t = 0$, le remplacement d'un terme et $0 \leqslant 0$ donnent $t \leqslant 0$.

      Sous l'hypothèse $a + t = S\,u$, on raisonne par cas sur l'instance de $\mathrm Q_3$ pour $a$, avec une variable nouvelle $b$. Si $a = 0$, la chaîne $t = 0 + t = a + t = S\,u$ donne $t = S\,u$. Si $a = S\,b$, la chaîne $S(b + t) = S\,b + t = a + t = S\,u$ et $\mathrm Q_2$ donnent $b + t = u$, et l'on introduit $t \leqslant u$ avec le témoin $b$. Réciproquement, sous l'hypothèse $a + t = u$, la chaîne $S\,a + t = S(a + t) = S\,u$ donne $t \leqslant S\,u$, avec le témoin $S\,a$ ; sous l'hypothèse $t = S\,u$, le remplacement et $S\,u \leqslant S\,u$ donnent $t \leqslant S\,u$.

      (iii) Sous les hypothèses $a + t = u$ et $b + u = r$, la chaîne $b + a + t = b + (a + t) = b + u = r$ donne $t \leqslant r$, avec le témoin $b + a$. Sous les hypothèses $a + t = u$ et $b + u = t$, la chaîne $b + a + t = b + u = t = 0 + t$ et (ii) de {{cal-pa-lois|Lois de + et ×}} donnent $b + a = 0$, puis $a = 0$, et la chaîne $t = 0 + t = a + t = u$ conclut. Dans les deux cas, on élimine $b$, puis $a$.

      (iv) Soit $x$ et $y$ deux variables distinctes, différentes des variables liées $z$ et $z'$ des deux formules $x \leqslant y$ et $y \leqslant x$. Montrons $x \leqslant y \vee y \leqslant x$ par récurrence sur $y$ ; le point (iv) de {{cal-pa-recurrence|Récurrence dans PA}} donnera le cas de termes quelconques, puisque seules $z$ et $z'$ sont quantifiées. Pour $0$, c'est (i). Sous l'hypothèse $x \leqslant y \vee y \leqslant x$, on raisonne par cas. Si $x \leqslant y$, alors $x \leqslant S\,y$ par (ii). Sous l'hypothèse $a + y = x$, on raisonne par cas sur $a$ : si $a = 0$, la chaîne $x = a + y = 0 + y = y$, le point (i) et le remplacement donnent $x \leqslant y$, puis $x \leqslant S\,y$ par (ii) ; si $a = S\,b$, la chaîne $b + S\,y = S(b + y) = S\,b + y = x$ donne $S\,y \leqslant x$, avec le témoin $b$. Dans tous les cas, $x \leqslant S\,y \vee S\,y \leqslant x$, et le point (iii) de {{cal-pa-recurrence|Récurrence dans PA}} conclut.

      (v) Sous l'hypothèse $a + S\,t = u$, la chaîne $S\,a + t = S(a + t) = a + S\,t = u$ donne $t \leqslant u$ ; si de plus $t = u$, la chaîne $S\,a + t = u = t = 0 + t$ et la simplification donnent $S\,a = 0$, ce que $\mathrm Q_1$ exclut. Réciproquement, sous les hypothèses $a + t = u$ et $\neg(t = u)$ : si $a = 0$, alors $t = u$, ce qui est exclu ; si $a = S\,b$, la chaîne $b + S\,t = S(b + t) = S\,b + t = u$ donne $t < u$. On obtient la première équivalence.

      Par (ii), $S\,t \leqslant 0$ donnerait $S\,t = 0$, contraire à $\mathrm Q_1$. Sous l'hypothèse $a + S\,t = S\,u$, la chaîne $S(a + t) = a + S\,t = S\,u$ et $\mathrm Q_2$ donnent $a + t = u$ ; sous l'hypothèse $a + t = u$, la chaîne $a + S\,t = S(a + t) = S\,u$ donne $S\,t \leqslant S\,u$. La trichotomie découle de (iv) et de la première équivalence, appliquée à $t \leqslant u$ et à $u \leqslant t$, par la symétrie de l'égalité, qui fait passer de $u = t$ à $t = u$, et la règle des tautologies. Enfin, $t < u$ et $u \leqslant t$ donneraient $t \leqslant u$, puis $t = u$ par (iii), contre $\neg(t = u)$.

      (vi) Sous l'hypothèse $a + t = u$, la chaîne $a + (t + r) = a + t + r = u + r$ donne $t + r \leqslant u + r$, et la chaîne $a \times r + t \times r = (a + t) \times r = u \times r$ donne $t \times r \leqslant u \times r$. Sous l'hypothèse $a + (t + r) = u + r$, la chaîne $a + t + r = a + (t + r) = u + r$ et la simplification donnent $a + t = u$. Sous les hypothèses $\neg(r = 0)$ et $r = S\,b$, la chaîne $t \times b + t = t \times S\,b = t \times r$ donne $t \leqslant t \times r$, avec le témoin $t \times b$ ; l'élimination de $b$ et l'instance de $\mathrm Q_3$ concluent.

      (vii) (a) La formule $\forall x \leqslant t\ \varphi$ est $\forall x\, (\exists z\, (z + x = t) \to \varphi)$. Le terme $u$ y est substituable à $x$ dans la formule qui suit $\forall x$ : les [[occurrence|occurrences]] libres de $x$ y sont dans $z + x = t$, sous le seul quantificateur $\exists z$, et $z$ ne figure pas dans $u$, ou dans $\varphi$, où $u$ est substituable. Comme $x \neq z$ et que $x$ ne figure pas dans $t$, le résultat est $u \leqslant t \to \varphi[u/x]$, et l'axiome (2) donne la première formule. La seconde s'obtient en appliquant la première à $\neg\varphi$, avec l'instance $(P \to (Q \to \neg R)) \to (Q \to (R \to \neg P))$.

      (b) Le théorème de la déduction donne $\Gamma \vdash_{\mathsf{PA}} x \leqslant t \to \varphi$, et la généralisation du point (i) de {{cal-pa-recurrence|Récurrence dans PA}} donne la première assertion. Pour la seconde, (c) ci-dessous ramène l'hypothèse à $\exists x\, (x \leqslant t \wedge \varphi)$, et la formule $(x \leqslant t \wedge \varphi)[b/x]$ est $b \leqslant t \wedge \varphi[b/x]$ ; l'élimination avec la variable nouvelle $b$, du même point (i), conclut.

      (c) La formule $\exists x \leqslant t\ \varphi$ est $\neg\forall x\, (B \to \neg\varphi)$, avec $B = (x \leqslant t)$, et $\exists x\, (B \wedge \varphi)$ est $\neg\forall x\, \neg\neg(B \to \neg\varphi)$, puisque $B \wedge \varphi$ abrège $\neg(B \to \neg\varphi)$. Les instances $P \to \neg\neg P$ et $\neg\neg P \to P$ et la monotonie du point (ii) de {{cal-pa-recurrence|Récurrence dans PA}} donnent $\vdash \forall x\, (B \to \neg\varphi) \leftrightarrow \forall x\, \neg\neg(B \to \neg\varphi)$, et la contraposition conclut.

      (d) Sous l'hypothèse $\forall x \leqslant S\,t\ \varphi$ : (a), avec le terme $S\,t$ et $S\,t \leqslant S\,t$, donne $\varphi[S\,t/x]$ ; sous l'hypothèse supplémentaire $x \leqslant t$, le point (ii) donne $x \leqslant S\,t$, et (a), avec le terme $x$, donne $\varphi$ ; comme $x$ n'est pas libre dans $\forall x \leqslant S\,t\ \varphi$, (b) donne $\forall x \leqslant t\ \varphi$. Réciproquement, sous les hypothèses $\forall x \leqslant t\ \varphi$, $\varphi[S\,t/x]$ et $x \leqslant S\,t$, le point (ii) donne $x \leqslant t$ ou $x = S\,t$ : dans le premier cas, (a) donne $\varphi$ ; dans le second, le remplacement d'un terme, appliqué à $\varphi$ avec les termes $S\,t$ et $x$, et la symétrie donnent $\varphi$. Le point (b) conclut. Pour la borne $0$, on raisonne de même avec $t \leqslant 0 \leftrightarrow t = 0$. La formule existentielle s'obtient en appliquant la formule universelle à $\neg\varphi$, avec $(\neg\varphi)[S\,t/x] = \neg\,\varphi[S\,t/x]$ et l'instance $(A \leftrightarrow (B \wedge \neg C)) \to (\neg A \leftrightarrow (\neg B \vee C))$.

      (e) Sous les hypothèses de $\Gamma$, $\forall x \leqslant t\ \varphi$ et $x \leqslant t$, le point (a), avec le terme $x$, donne $\varphi$, puis $\psi$, et (b) donne $\forall x \leqslant t\ \psi$. Pour la borne, sous les hypothèses $t \leqslant u$, $\forall x \leqslant u\ \varphi$ et $x \leqslant t$, (iii) donne $x \leqslant u$, puis (a) donne $\varphi$, et (b) conclut, $x$ n'étant libre ni dans $t \leqslant u$ ni dans $\forall x \leqslant u\ \varphi$. Les formules existentielles s'obtiennent en appliquant les formules universelles à $\neg\psi \to \neg\varphi$ et à $\neg\varphi$, par contraposition.
    remarques:
      - |
        Dans la structure $\mathcal M$ de la deuxième remarque de {{cal-rp-calculs-q|Calculs dans Q}}, l'élément $a$ n'est pas inférieur ou égal à lui-même : $z + a = b$ pour tout $z$, et $b \neq a$. Ni la réflexivité (i) ni l'ordre total (iv) ne sont donc démontrables dans $\mathsf Q$, et l'antisymétrie non plus, puisque $a \leqslant b$ et $b \leqslant a$, avec les témoins $1$ et $0$, alors que $a \neq b$. Dans la structure $\mathcal M'$ de la troisième remarque, la réflexivité et l'ordre total échouent aussi, puisque $z + a = b$ pour tout $z$, donc $a \not\leqslant a$, et l'ordre strict y échoue en outre : $z + b = b$ pour tout $z$, donc $S\,b \leqslant b$, c'est-à-dire $b < b$. Ces cas ont été vérifiés par un calcul sur les tables des deux structures. L'erreur la plus répandue est de croire qu'une formule qui définit l'ordre de $\mathbb N$ dans $\mathcal N$ en a les propriétés dans toute théorie qui parle des entiers.
      - |
        Le point (vii) (d) est l'outil des chapitres qui suivront : il ramène une quantification bornée par $S\,t$ à une quantification bornée par $t$ et à un cas de plus, et permet de raisonner par récurrence sur la borne, comme au nœud {{cal-pa-sigma|Collection et forme Σ₁}}. Dans $\mathsf Q$, la Σ₁-complétude n'employait que le cas d'une borne qui est un chiffre, par la disjonction $D_n(x)$ ({{cal-rp-calculs-q|Calculs dans Q}}, (v)) ; ici la borne est un terme quelconque, et la récurrence remplace l'énumération des cas.

  - id: cal-pa-division
    etiquette: Plus petit élément, division
    nature: proposition
    titre: Plus petit élément, récurrence forte et division euclidienne dans l'arithmétique de Peano
    texte: |
      Les conventions sont celles de {{cal-pa-ordre|Ordre dans PA}}. Pour une formule $\varphi$, une variable $x$ et une variable $y$ distincte de $x$ qui ne figure pas dans $\varphi$, on écrit les quantifications bornées $\forall y \leqslant x$ avec une variable liée $u$, distincte de $x$ et de $y$, qui ne figure pas dans $\varphi$. Comme $y$ ne figure pas dans $\varphi$, elle y est substituable à $x$, la variable $x$ est substituable à $y$ dans $\varphi[y/x]$, et $\varphi[y/x][x/y] = \varphi$, comme dans la preuve du renommage au point (iii) de {{cal-rp-calcul|Calcul à variables libres}}.
    enonce: |
      (i) **Plus petit élément.** Pour toute formule $\varphi$ et toutes variables $x$, $y$ comme ci-dessus,
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\exists x\, \varphi \to \exists x\, \big(\varphi \wedge {} \\ &\forall y \leqslant x\ (y = x \vee \neg\varphi[y/x])\big). \end{aligned}$$

      (ii) **Récurrence forte.** Si $x$ n'est libre dans aucune formule de $\Gamma$ et si
      $$\begin{aligned} &\Gamma \cup \big\{\forall y \leqslant x\ (y = x \vee \varphi[y/x])\big\} \\ &\qquad \vdash_{\mathsf{PA}} \varphi, \end{aligned}$$
      alors $\Gamma \vdash_{\mathsf{PA}} \varphi$.

      (iii) **Division euclidienne.** Soit $t$ et $m$ des termes, et $q$, $r$ deux variables distinctes qui n'y figurent pas. Alors
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\neg(m = 0) \to \exists q\, \exists r\, \\ &(q \times m + r = t \wedge r < m), \end{aligned}$$
      et, pour tous termes $q$, $r$, $q'$, $r'$,
      $$\begin{aligned} \vdash_{\mathsf{PA}} \big(&q \times m + r = q' \times m + r' \\ &\wedge r < m \wedge r' < m\big) \\ &\to (q = q' \wedge r = r'). \end{aligned}$$
    preuve: |
      (i) Notons $M$ la formule $\forall y \leqslant x\ (y = x \vee \neg\varphi[y/x])$ et $C$ la formule $\exists x\, (\varphi \wedge M)$. La variable $x$ n'est pas libre dans $\varphi[y/x]$ ; pour un terme $w$ substituable à $x$ dans $\varphi$ et où ne figurent ni $y$ ni $u$, $w$ est substituable à $x$ dans $\varphi \wedge M$, et $(\varphi \wedge M)[w/x]$ est $\varphi[w/x] \wedge \forall y \leqslant w\ (y = w \vee \neg\varphi[y/x])$. Comme $\neg C$ est $\neg\neg\forall x\, \neg(\varphi \wedge M)$, l'instance $\neg\neg P \to P$ et l'axiome (2) donnent $\neg C \to \neg(\varphi \wedge M)[w/x]$.

      Soit $v$ une variable qui ne figure pas dans $\varphi$ et distincte de $x$, $y$ et $u$, et $\chi = \forall y \leqslant v\ \neg\varphi[y/x]$. Montrons $\{\neg C\} \vdash_{\mathsf{PA}} \chi$ par récurrence sur $v$, qui n'est pas libre dans $\neg C$ ; le terme $S\,v$ est substituable à $y$ dans $\neg\varphi[y/x]$, puisque $v$ n'y figure pas, et $\neg\varphi[y/x][S\,v/y] = \neg\varphi[S\,v/x]$.

      *Cas $0$.* Par le point (vii) (d) de {{cal-pa-ordre|Ordre dans PA}}, $\chi[0/v] = \forall y \leqslant 0\ \neg\varphi[y/x]$ équivaut à $\neg\varphi[0/x]$. Sous les hypothèses $\neg C$ et $\varphi[0/x]$, le même point donne $\forall y \leqslant 0\ (y = 0 \vee \neg\varphi[y/x])$, qui équivaut à $0 = 0 \vee \neg\varphi[0/x]$, démontrable ; avec $w = 0$, cela contredit $\neg C$. Donc $\{\neg C\} \vdash_{\mathsf{PA}} \neg\varphi[0/x]$, puis $\chi[0/v]$.

      *Pas.* Sous les hypothèses $\neg C$ et $\chi$, il suffit, par le point (vii) (d) de {{cal-pa-ordre|Ordre dans PA}}, de démontrer $\neg\varphi[S\,v/x]$. Sous l'hypothèse supplémentaire $\varphi[S\,v/x]$, le point (vii) (e), appliqué à $\chi$ avec l'instance $\neg A \to (B \vee \neg A)$, donne $\forall y \leqslant v\ (y = S\,v \vee \neg\varphi[y/x])$, et $S\,v = S\,v \vee \neg\varphi[S\,v/x]$ est démontrable ; le point (vii) (d) donne $\forall y \leqslant S\,v\ (y = S\,v \vee \neg\varphi[y/x])$, ce qui, avec $\varphi[S\,v/x]$ et $w = S\,v$, contredit $\neg C$. Le théorème de la déduction et la règle des tautologies donnent $\neg\varphi[S\,v/x]$.

      Le point (iii) de {{cal-pa-recurrence|Récurrence dans PA}} donne $\{\neg C\} \vdash_{\mathsf{PA}} \forall v\, \chi$. Le terme $x$ est substituable à $v$ dans $\chi$, dont les [[occurrence|occurrences]] libres de $v$ ne sont que sous $\forall y$ et $\exists u$ : l'axiome (2) donne $\forall y \leqslant x\ \neg\varphi[y/x]$, et le point (vii) (a) de {{cal-pa-ordre|Ordre dans PA}}, avec le terme $x$ et $x \leqslant x$, donne $\neg\varphi[y/x][x/y]$, c'est-à-dire $\neg\varphi$. La généralisation en $x$, qui n'est pas libre dans $\neg C$, donne $\{\neg C\} \vdash_{\mathsf{PA}} \forall x\, \neg\varphi$, puis $\neg\exists x\, \varphi$ par l'instance $P \to \neg\neg P$, et la contraposition conclut.

      (ii) Appliquons (i) à $\neg\varphi$, avec $(\neg\varphi)[y/x] = \neg\varphi[y/x]$. Sous les hypothèses de $\Gamma$, $\neg\varphi$ et $\forall y \leqslant x\ (y = x \vee \neg\neg\varphi[y/x])$, le point (vii) (e) de {{cal-pa-ordre|Ordre dans PA}}, avec l'instance $(B \vee \neg\neg A) \to (B \vee A)$, donne $\forall y \leqslant x\ (y = x \vee \varphi[y/x])$, donc $\varphi$ par hypothèse, ce qui contredit $\neg\varphi$. Ainsi $\Gamma \vdash_{\mathsf{PA}} \neg(\neg\varphi \wedge \forall y \leqslant x\ (y = x \vee \neg\neg\varphi[y/x]))$ ; la généralisation en $x$ et la règle des tautologies donnent la négation du second membre de (i), puis $\Gamma \vdash_{\mathsf{PA}} \neg\exists x\, \neg\varphi$, c'est-à-dire $\neg\neg\forall x\, \neg\neg\varphi$. L'instance $\neg\neg P \to P$, la monotonie du point (ii) de {{cal-pa-recurrence|Récurrence dans PA}} avec $\neg\neg\varphi \to \varphi$, et l'axiome (2) donnent $\Gamma \vdash_{\mathsf{PA}} \varphi$.

      (iii) *Existence.* Soit $a$ et $m$ deux variables distinctes, différentes de $q$, de $r$ et de la variable liée de $r < m$. On montre $\{\neg(m = 0)\} \vdash_{\mathsf{PA}} \exists q\, \exists r\, (q \times m + r = a \wedge r < m)$ par récurrence sur $a$, qui n'est pas libre dans $\neg(m = 0)$ ; le théorème de la déduction donne l'implication, et le point (iv) de {{cal-pa-recurrence|Récurrence dans PA}} donne ensuite le cas des termes $t$ et $m$. Sous l'hypothèse $\neg(m = 0)$, l'instance de $\mathrm Q_3$ et l'élimination avec une variable nouvelle $k$ permettent de supposer $m = S\,k$ ; alors $0 \leqslant k$ et le point (v) de {{cal-pa-ordre|Ordre dans PA}} donnent $0 < S\,k$, d'où $0 < m$ par le remplacement, et l'élimination de $k$, qui n'est pas libre dans $0 < m$, donne $0 < m$ sous la seule hypothèse $\neg(m = 0)$.

      Pour $0$ : la chaîne $0 \times m + 0 = 0 \times m = 0$ et $0 < m$ donnent la conclusion, par deux introductions de l'existentiel avec le terme $0$. Pas : sous l'hypothèse de récurrence, l'élimination avec des variables nouvelles $c$ et $d$ permet de supposer $c \times m + d = a$ et $d < m$. Par le point (v) de {{cal-pa-ordre|Ordre dans PA}}, $S\,d \leqslant m$ donne $S\,d < m$ ou $S\,d = m$. Dans le premier cas, la chaîne $c \times m + S\,d = S(c \times m + d) = S\,a$ donne la conclusion pour $S\,a$, avec les termes $c$ et $S\,d$. Dans le second, la chaîne $S\,c \times m + 0 = c \times m + m = c \times m + S\,d = S(c \times m + d) = S\,a$, avec $0 < m$, la donne avec les termes $S\,c$ et $0$.

      *Unicité.* Soit $\Gamma$ formé des trois hypothèses. Par le point (v) de {{cal-pa-ordre|Ordre dans PA}}, on a $q < q'$, $q = q'$ ou $q' < q$. Sous l'hypothèse $q < q'$, l'élimination avec un témoin $a$ donne $a + S\,q = q'$, et la chaîne
      $$\begin{aligned} &q \times m + r \\ &\quad = q' \times m + r' \\ &\quad = (a + S\,q) \times m + r' \\ &\quad = q \times m + (a \times m + m + r'), \end{aligned}$$
      obtenue par la distributivité, le point (iii) de {{cal-pa-lois|Lois de + et ×}}, l'associativité et la commutativité, donne $r = a \times m + r' + m$ par la simplification, puis $m \leqslant r$, avec le témoin $a \times m + r'$, ce qui contredit $r < m$ ({{cal-pa-ordre|Ordre dans PA}}, (v)). Le cas $q' < q$ est symétrique. Il reste $q = q'$ ; la chaîne $r + q \times m = q \times m + r = q' \times m + r' = r' + q \times m$ et la simplification donnent $r = r'$.
    remarques:
      - |
        Le point (i) est la forme dans $\mathsf{PA}$ du {{n-ordre|bon ordre sur ℕ}}, restreinte aux parties définies par une formule. Sa preuve est une récurrence sur la formule « aucun entier au plus égal à $v$ ne vérifie $\varphi$ » : si $\varphi$ n'avait pas de plus petit élément, cette formule passerait de $v$ à $S\,v$, et $\varphi$ ne serait vérifiée nulle part. L'erreur la plus répandue est de croire que le principe vaut pour n'importe quelle partie. Dans un modèle de $\mathsf{PA}$ non isomorphe à $\mathcal N$, comme celui du nœud {{l-non-standard|Modèles non standard}}, appelons non standards les éléments qui ne sont la valeur d'aucun chiffre $\underline n$. Il y en a : sinon, l'application qui envoie $n$ sur la valeur de $\underline n$ serait surjective, injective par le point (ii) de {{cal-rp-calculs-q|Calculs dans Q}}, et compatible avec $S$, $+$ et $\times$ par le point (i) du même nœud, donc un isomorphisme. Leur ensemble n'a pas de plus petit élément : un élément non standard n'est pas la valeur de $0$, il est donc, par $\mathrm Q_3$, le successeur d'un élément $p$, qui est non standard, sans quoi il serait la valeur d'un chiffre, et qui le précède strictement par le point (v) de {{cal-pa-ordre|Ordre dans PA}}. Par le point (i) et le théorème de correction, cet ensemble n'est défini dans le modèle par aucune formule, même avec des paramètres.
      - |
        La division euclidienne est ce qui donne un sens, dans $\mathsf{PA}$, à la {{cal-beta|fonction β}} : la formule $B(a, b, i, u)$ de {{cal-rp-forme-sigma|Forme Σ₁ des r.e.}} dit que $u$ est le reste de la division de $a$ par $S(S\,i \times b)$. Elle écrit $r + u = S\,i \times b$, c'est-à-dire $u \leqslant S\,i \times b$, qui équivaut à $u < S(S\,i \times b)$ par le point (v) de {{cal-pa-ordre|Ordre dans PA}}. Le point (iii), appliqué au terme $m = S(S\,i \times b)$, qui n'est jamais nul par $\mathrm Q_1$, montre que $\mathsf{PA}$ démontre l'existence et l'unicité de ce reste. Le chapitre suivant en tirera que la formule définit une fonction aux yeux de $\mathsf{PA}$, et non seulement dans $\mathcal N$.

  - id: cal-pa-bezout
    etiquette: Bézout, lemme chinois
    nature: proposition
    titre: Divisibilité, congruences, Bézout et lemme chinois dans l'arithmétique de Peano
    texte: |
      Les conventions sont celles de {{cal-pa-ordre|Ordre dans PA}}. Pour des termes $t$, $u$ et $m$, on écrit $t \mid u$ pour la formule $\exists q\, (q \times t = u)$, et $t \equiv u \pmod m$ pour la formule $\exists q\, \exists q'\, (t + q \times m = u + q' \times m)$, où $q$ et $q'$ sont des variables distinctes qui ne figurent ni dans $t$, ni dans $u$, ni dans $m$ ; deux écritures sont équivalentes par le renommage, comme pour $t \leqslant u$. On écrit $t \perp u$ pour la formule $\forall d\, \big((d \mid t \wedge d \mid u) \to d = S\,0\big)$, où $d$ ne figure ni dans $t$ ni dans $u$, et où les formules $d \mid t$ et $d \mid u$ sont écrites avec une variable liée distincte de $d$ : dans $\mathcal N$, elle dit que les valeurs de $t$ et de $u$ n'ont pas d'autre diviseur commun que $1$. Comme $d \mid t \wedge d \mid u$ et $d \mid u \wedge d \mid t$ sont équivalentes par une tautologie, la monotonie du point (ii) de {{cal-pa-recurrence|Récurrence dans PA}} donne $\vdash t \perp u \leftrightarrow u \perp t$.

      Dans les énoncés, les variables liées ne figurent dans aucun des termes ; dans les preuves, $a$, $b$, $c$, $e$, $k$ désignent des variables nouvelles. Une hypothèse $t \mid u$ s'élimine avec un témoin $a$, sous la forme $a \times t = u$, et s'introduit à partir d'une égalité $s \times t = u$, comme $t \leqslant u$ ; de même pour $t \equiv u \pmod m$, avec deux témoins.
    enonce: |
      Pour tous termes $t$, $u$, $r$, $m$, $n$ et $P$ :

      (i) **Divisibilité.** $\vdash_{\mathsf{PA}} t \mid 0$, $\vdash_{\mathsf{PA}} t \mid t$, $\vdash_{\mathsf{PA}} (t \mid u \wedge u \mid r) \to t \mid r$, $\vdash_{\mathsf{PA}} t \mid u \to t \mid u \times r$, $\vdash_{\mathsf{PA}} (r \mid t + u \wedge r \mid t) \to r \mid u$, $\vdash_{\mathsf{PA}} 0 \mid t \to t = 0$ et $\vdash_{\mathsf{PA}} t \mid S\,0 \to t = S\,0$.

      (ii) **Congruences.** On a $\vdash_{\mathsf{PA}} t \equiv t \pmod m$, $\vdash_{\mathsf{PA}} t \equiv u \pmod m \to u \equiv t \pmod m$, $\vdash_{\mathsf{PA}} (t \equiv u \pmod m \wedge u \equiv r \pmod m) \to t \equiv r \pmod m$, et
      $$\begin{aligned} &\vdash_{\mathsf{PA}} t \equiv u \pmod m \\ &\qquad \to t + r \equiv u + r \pmod m, \\ &\vdash_{\mathsf{PA}} t \equiv u \pmod m \\ &\qquad \to t \times r \equiv u \times r \pmod m, \\ &\vdash_{\mathsf{PA}} t + r \times m \equiv t \pmod m, \\ &\vdash_{\mathsf{PA}} m \mid t \leftrightarrow t \equiv 0 \pmod m, \\ &\vdash_{\mathsf{PA}} t \equiv u \pmod{S\,0}, \\ &\vdash_{\mathsf{PA}} m \mid P \to \big(t \equiv u \pmod P \\ &\qquad \to t \equiv u \pmod m\big). \end{aligned}$$

      (iii) **Bézout.** Si la variable $e$ ne figure ni dans $t$ ni dans $m$,
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\big(\neg(m = 0) \wedge t \perp m\big) \\ &\to \exists e\, \big(e \times t \\ &\qquad \equiv S\,0 \pmod m\big). \end{aligned}$$

      (iv) **Lemme d'Euclide.** $\vdash_{\mathsf{PA}} (\neg(m = 0) \wedge t \perp m \wedge m \mid t \times u) \to m \mid u$ et $\vdash_{\mathsf{PA}} (\neg(m = 0) \wedge t \perp m \wedge u \perp m) \to t \times u \perp m$.

      (v) **Lemme chinois.** Si la variable $c$ ne figure dans aucun des termes,
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\big(\neg(m = 0) \wedge m \perp n\big) \\ &\to \exists c\, \big(c \equiv t \pmod m \\ &\qquad \wedge c \equiv u \pmod n\big). \end{aligned}$$
    preuve: |
      Les chaînes d'égalités emploient les lois de {{cal-pa-lois|Lois de + et ×}} sans les nommer.

      (i) Les témoins de $t \mid 0$ et $t \mid t$ sont $0$ et $S\,0$. Sous les hypothèses $a \times t = u$ et $b \times u = r$, la chaîne $(b \times a) \times t = b \times (a \times t) = r$ donne $t \mid r$ ; sous l'hypothèse $a \times t = u$, la chaîne $(r \times a) \times t = r \times u = u \times r$ donne $t \mid u \times r$. Sous les hypothèses $a \times r = t + u$ et $b \times r = t$, le point (iv) de {{cal-pa-ordre|Ordre dans PA}} donne $b \leqslant a$ ou $a \leqslant b$. Sous l'hypothèse $c + b = a$, la chaîne $c \times r + t = c \times r + b \times r = a \times r = t + u = u + t$ et la simplification donnent $c \times r = u$. Sous l'hypothèse $c + a = b$, la chaîne $t + 0 = t = c \times r + a \times r = t + (c \times r + u)$, réordonnée, et la simplification donnent $c \times r + u = 0$, donc $u = 0$, et $r \mid u$ par le premier point. Sous l'hypothèse $a \times 0 = t$, $\mathrm Q_6$ donne $t = 0$.

      Sous l'hypothèse $a \times t = S\,0$, on raisonne par cas sur $t$ et sur $a$. Si $t = 0$, alors $S\,0 = a \times 0 = 0$, ce que $\mathrm Q_1$ exclut. Si $a = 0$, de même $S\,0 = 0 \times t = 0$. Si $t = S\,k$ et $a = S\,b$, la chaîne $S(S\,b \times k + b) = S\,b \times k + S\,b = S\,b \times S\,k = S\,0$ et $\mathrm Q_2$ donnent $S\,b \times k + b = 0$, donc $b = 0$ et $S\,b \times k = 0$ ; alors $k = S\,0 \times k = 0$, et $t = S\,0$.

      (ii) La réflexivité a les témoins $0$ et $0$ ; la symétrie échange les témoins. Sous les hypothèses $t + a \times m = u + b \times m$ et $u + c \times m = r + e \times m$, la chaîne
      $$\begin{aligned} &t + (a + c) \times m \\ &\quad = t + a \times m + c \times m \\ &\quad = u + b \times m + c \times m \\ &\quad = u + c \times m + b \times m \\ &\quad = r + e \times m + b \times m \\ &\quad = r + (e + b) \times m \end{aligned}$$
      donne la transitivité. Sous l'hypothèse $t + a \times m = u + b \times m$, les chaînes $t + r + a \times m = u + r + b \times m$ et $t \times r + (a \times r) \times m = (t + a \times m) \times r = u \times r + (b \times r) \times m$ donnent les deux compatibilités. Les témoins de $t + r \times m \equiv t$ sont $0$ et $r$.

      Si $a \times m = t$, les témoins $0$ et $a$ donnent $t + 0 \times m = 0 + a \times m$. Réciproquement, sous l'hypothèse $t + a \times m = 0 + b \times m$, on a $b \leqslant a$ ou $a \leqslant b$. Si $c + a = b$, la chaîne $t + a \times m = c \times m + a \times m$ et la simplification donnent $c \times m = t$. Si $c + b = a$, la chaîne $t + c \times m + b \times m = b \times m = 0 + b \times m$ et la simplification donnent $t + c \times m = 0$, donc $t = 0$, et $m \mid t$. Pour le module $S\,0$, les témoins $u$ et $t$ donnent $t + u \times S\,0 = t + u = u + t \times S\,0$. Enfin, sous les hypothèses $k \times m = P$ et $t + a \times P = u + b \times P$, la chaîne $t + (a \times k) \times m = t + a \times P = u + b \times P = u + (b \times k) \times m$ conclut.

      (iii) Soit $x$ et $m$ deux variables distinctes, différentes des variables liées de l'énoncé ; le point (iv) de {{cal-pa-recurrence|Récurrence dans PA}} donnera le cas des termes $t$ et $m$. On raisonne sous les hypothèses $\neg(m = 0)$ et $x \perp m$ ; la conclusion $\exists e\, (e \times x \equiv S\,0 \pmod m)$ est notée $E$.

      *Si $x = 0$.* L'axiome (2), avec le terme $m$, donne $(m \mid x \wedge m \mid m) \to m = S\,0$, et (i) donne $m \mid 0$ et $m \mid m$ ; donc $m = S\,0$, et (ii), avec le remplacement, donne $0 \times x \equiv S\,0 \pmod m$, puis $E$.

      *Si $\neg(x = 0)$.* Soit $\varphi(d)$ la formule $\neg(d = 0) \wedge \exists e\, \exists f\, (e \times x = f \times m + d)$, où $d$, $e$, $f$ sont des variables distinctes, différentes de $x$ et de $m$. On a $\varphi(x)$ : la chaîne $S\,0 \times x = x = 0 \times m + x$ fournit les témoins $S\,0$ et $0$. Le point (i) de {{cal-pa-division|Plus petit élément, division}} donne alors un $d$ tel que $\varphi(d)$ et $\forall y \leqslant d\ (y = d \vee \neg\varphi(y))$, et l'on élimine $e$ et $f$ de $\varphi(d)$ : $e \times x = f \times m + d$. Par le point (vii) (a) de {{cal-pa-ordre|Ordre dans PA}} et la première équivalence de (v), pour tout terme $s$ convenable, $s < d$ entraîne $\neg\varphi(s)$ : c'est la *minimalité* de $d$.

      *Symétrisation.* Montrons que, sous les hypothèses $\neg(x = 0)$, $\neg(m = 0)$ et $V \times m = U \times x + s$, pour des termes $U$, $V$, $s$, il existe $U'$ et $V'$ tels que $U' \times x = V' \times m + s$. Soit $K = U + V$. Par le point (i) et le point (vi) de {{cal-pa-ordre|Ordre dans PA}}, et la transitivité, $U \leqslant K \times m$ et $V \leqslant K \times x$ ; l'élimination fournit $U'$ et $V'$ tels que $U' + U = K \times m$ et $V' + V = K \times x$. La chaîne
      $$\begin{aligned} &U' \times x + U \times x \\ &\quad = (K \times m) \times x \\ &\quad = (K \times x) \times m \\ &\quad = V' \times m + V \times m \\ &\quad = V' \times m + s + U \times x \end{aligned}$$
      et la simplification donnent $U' \times x = V' \times m + s$. Il en résulte que, si $\neg(s = 0)$, alors $\varphi(s)$.

      *$d$ divise $m$.* Le point (iii) de {{cal-pa-division|Plus petit élément, division}}, avec $\neg(d = 0)$, fournit $g$ et $s$ tels que $g \times d + s = m$ et $s < d$. La chaîne
      $$\begin{aligned} &(g \times f + S\,0) \times m \\ &\quad = (g \times f) \times m + S\,0 \times m \\ &\quad = g \times (f \times m) + m \\ &\quad = g \times (f \times m) + (g \times d + s) \\ &\quad = g \times (f \times m + d) + s \\ &\quad = g \times (e \times x) + s \\ &\quad = (g \times e) \times x + s \end{aligned}$$
      est de la forme $V \times m = U \times x + s$ ; si $\neg(s = 0)$, la symétrisation donne $\varphi(s)$, contraire à la minimalité. Donc $s = 0$ et $g \times d = m$ : $d \mid m$.

      *$d$ divise $x$.* De même, soit $g \times d + s = x$ avec $s < d$, et $h = g \times e$. La chaîne
      $$\begin{aligned} &h \times x + s \\ &\quad = g \times (e \times x) + s \\ &\quad = g \times (f \times m + d) + s \\ &\quad = (g \times f) \times m + (g \times d + s) \\ &\quad = (g \times f) \times m + x \end{aligned}$$
      donne $h \times x + s = (g \times f) \times m + x$. Si $h = 0$, la chaîne $s = h \times x + s = (g \times f) \times m + x$ donne $x \leqslant s$ ; or $\varphi(x)$ et la minimalité excluent $x < d$, donc $d \leqslant x$ par le point (v) de {{cal-pa-ordre|Ordre dans PA}}, puis $d \leqslant s$, ce qui contredit $s < d$. Si $h = S\,k$, la chaîne $k \times x + s + x = h \times x + s = (g \times f) \times m + x$ et la simplification donnent $(g \times f) \times m = k \times x + s$ ; la symétrisation et la minimalité donnent $s = 0$ comme ci-dessus, et $d \mid x$.

      *Conclusion.* L'axiome (2), avec le terme $d$, et $x \perp m$ donnent $d = S\,0$. Alors $e \times x = f \times m + S\,0$, et la chaîne $e \times x + 0 \times m = S\,0 + f \times m$ donne $e \times x \equiv S\,0 \pmod m$, puis $E$. On élimine les variables introduites, qui ne sont libres ni dans les hypothèses ni dans $E$, et le raisonnement par cas sur $x = 0$ conclut.

      (iv) Sous les hypothèses de la première formule, (iii) fournit $e$ tel que $e \times t \equiv S\,0 \pmod m$, et (ii) donne $(e \times t) \times u \equiv S\,0 \times u \pmod m$, c'est-à-dire $u \equiv (e \times t) \times u \pmod m$ par la symétrie et $S\,0 \times u = u$. Par (ii), $m \mid t \times u$ donne $t \times u \equiv 0 \pmod m$, puis $(t \times u) \times e \equiv 0 \times e \pmod m$, et $(e \times t) \times u = (t \times u) \times e$, $0 \times e = 0$. La transitivité donne $u \equiv 0 \pmod m$, et (ii) donne $m \mid u$.

      Pour la seconde, raisonnons sous ses hypothèses et sous $d \mid t \times u$ et $d \mid m$, avec une variable $d$ nouvelle. On a $\neg(d = 0)$, puisque $0 \mid m$ donnerait $m = 0$ par (i). Sous les hypothèses supplémentaires $k \mid t$ et $k \mid d$, la transitivité de (i) donne $k \mid m$, et $t \perp m$ donne $k = S\,0$ ; le théorème de la déduction décharge $k \mid t$ et $k \mid d$, puis la généralisation en $k$, qui n'est libre dans aucune des hypothèses restantes, donne $t \perp d$, écrite avec la variable liée $k$. La première formule, appliquée aux termes $d$, $t$, $u$, donne $d \mid u$, et $u \perp m$ donne $d = S\,0$. Le théorème de la déduction et la généralisation en $d$ donnent $t \times u \perp m$.

      (v) Sous les hypothèses, l'instance de $\mathrm Q_3$ permet de supposer $m = S\,k$. Comme $n \perp m$, le point (iii) fournit $e$ tel que $e \times n \equiv S\,0 \pmod m$. Posons $s = t + k \times u$ et $c_0 = u + (e \times s) \times n$. Les témoins $0$ et $e \times s$ donnent $c_0 \equiv u \pmod n$. Par (ii), $(e \times n) \times s \equiv S\,0 \times s \pmod m$, et $(e \times s) \times n = (e \times n) \times s$, $S\,0 \times s = s$ ; la compatibilité avec l'addition de $u$ et la commutativité donnent $c_0 \equiv u + s \pmod m$. Or la chaîne $u + s = t + (k \times u + u) = t + u \times S\,k = t + u \times m$ et (ii) donnent $u + s \equiv t \pmod m$, et la transitivité donne $c_0 \equiv t \pmod m$. L'introduction de l'existentiel, avec le terme $c_0$, conclut.
    remarques:
      - |
        La preuve de (iii) est celle de Bézout dans $\mathbb Z$ ({{z-bezout|Bézout}}, par le nœud {{z-ideaux|Idéaux de ℤ}}, qui prend le plus petit élément strictement positif d'un sous-groupe et conclut par la division euclidienne), débarrassée des entiers négatifs : le plus petit élément non nul de l'ensemble des $e x - f m$ y devient le plus petit $d$ non nul tel que $e \times x = f \times m + d$, et l'étape de symétrisation remplace le changement de signe, en ajoutant à $e$ et à $f$ des multiples de $m$ et de $x$. L'erreur la plus répandue est d'écrire $e \times x - f \times m$ comme si la soustraction existait : dans le langage de $\mathsf{PA}$, toute différence doit être lue comme le témoin d'une inégalité.
      - |
        Le lemme chinois sert au chapitre suivant à prolonger une suite codée par la {{cal-beta|fonction β}} : si $a$ code des restes modulo des entiers $m_0, \dots, m_{i-1}$ qui divisent $P$, et si $P \perp m_i$, le point (v), appliqué aux modules $P$ et $m_i$, fournit un $c$ congru à $a$ modulo $P$, donc modulo chaque $m_j$ par (ii), et à la valeur voulue modulo $m_i$. Le point (iv) assure que le produit $P \times m_i$ reste étranger aux modules suivants. Ce n'est pas le lemme chinois général du nœud {{cal-beta|fonction β}}, qui porte sur une famille finie de modules : dans $\mathsf{PA}$, une famille finie ne se désigne qu'à travers un codage, et c'est précisément ce que le chapitre suivant construit.

  - id: cal-pa-sigma
    etiquette: Collection et forme Σ₁
    nature: théorème
    titre: Collection bornée et forme Σ₁ dans l'arithmétique de Peano
    texte: |
      Les conventions sont celles de {{cal-pa-ordre|Ordre dans PA}}, et $\mathcal S$ est la classe de formules de {{cal-rp-forme-sigma|Forme Σ₁ des r.e.}} : le plus petit ensemble qui contient les [[formule-delta0|formules Δ₀]] et qui est stable par $\wedge$, par $\vee$, par les quantifications $\exists x$ et par les quantifications bornées $\forall x \leqslant t$. Le point (i) de {{cal-rp-forme-sigma|Forme Σ₁ des r.e.}} dit que toute formule de $\mathcal S$ est équivalente dans $\mathcal N$ à une [[formule-sigma1|formule Σ₁]] à un seul quantificateur ; on montre ici que $\mathsf{PA}$ démontre cette équivalence. Le seul pas qui ne relève pas de la logique est l'échange d'une quantification bornée et d'un [[quantificateur-existentiel|quantificateur existentiel]].
    enonce: |
      (i) **Collection bornée.** Soit $\delta$ une formule, $x$, $y$, $w$ des variables distinctes, $w$ ne figurant pas dans $\delta$, et $t$ un terme où ne figurent ni $x$, ni $w$, ni les variables liées des bornes. Alors
      $$\begin{aligned} \vdash_{\mathsf{PA}} {}&\forall x \leqslant t\ \exists y\ \delta \\ &\leftrightarrow \exists w\ \forall x \leqslant t\ \exists y \leqslant w\ \delta. \end{aligned}$$

      (ii) **Forme Σ₁.** Pour toute formule $\varphi$ de $\mathcal S$, toute formule $\exists y\, \delta$ que la preuve du point (i) de {{cal-rp-forme-sigma|Forme Σ₁ des r.e.}} associe à une construction de $\varphi$, où $\delta$ est Δ₀ et a ses variables libres parmi celles de $\varphi$ et $y$, vérifie $\vdash_{\mathsf{PA}} \varphi \leftrightarrow \exists y\, \delta$.
    preuve: |
      (i) *Sens réciproque.* Sous les hypothèses $\forall x \leqslant t\ \exists y \leqslant w\ \delta$ et $x \leqslant t$, le point (vii) (a) de {{cal-pa-ordre|Ordre dans PA}}, avec le terme $x$, donne $\exists y \leqslant w\ \delta$, puis $\exists y\, (y \leqslant w \wedge \delta)$ par le point (vii) (c), et $\exists y\, \delta$ par la monotonie de {{cal-pa-recurrence|Récurrence dans PA}}, (ii). Le point (vii) (b) donne $\forall x \leqslant t\ \exists y\, \delta$, et l'élimination de $w$, qui n'est libre ni dans cette formule ni dans $t$, conclut.

      *Sens direct.* Soit $v$ une variable qui ne figure ni dans $\delta$ ni dans $t$, distincte de $x$, $y$, $w$ et des variables liées des bornes. Notons $\theta(v)$ la formule $\forall x \leqslant v\ \exists y\, \delta \to \exists w\, \forall x \leqslant v\ \exists y \leqslant w\ \delta$, et montrons $\vdash_{\mathsf{PA}} \theta(v)$ par récurrence sur $v$. Les [[occurrence|occurrences]] libres de $v$ dans $\theta(v)$ ne sont que dans les bornes $\forall x \leqslant v$, sous $\forall x$, sous la variable liée de la borne et, pour la seconde, sous $\exists w$ : aucune variable de $t$ n'y est quantifiée, et l'axiome (2) donnera, avec le terme $t$, la formule annoncée. Le terme $S\,v$ est substituable à $x$ dans $\exists y\, \delta$, puisque $v$ n'y figure pas ; on emploie le point (vii) (d) de {{cal-pa-ordre|Ordre dans PA}} avec la formule $\exists y\, \delta$, puis avec la formule $\exists y \leqslant w\ \delta$, et l'on note $\delta'$ la formule $\delta[S\,v/x]$.

      *Cas $0$.* Sous l'hypothèse $\forall x \leqslant 0\ \exists y\, \delta$, le point (vii) (d) donne $\exists y\, \delta[0/x]$, et l'élimination avec une variable nouvelle $b$ donne $\delta[0/x][b/y]$. Par le point (vii) (a), avec $b \leqslant b$, il vient $\exists y \leqslant b\ \delta[0/x]$, qui est $(\exists y \leqslant b\ \delta)[0/x]$, puis $\forall x \leqslant 0\ \exists y \leqslant b\ \delta$ par le point (vii) (d). C'est la formule $(\forall x \leqslant 0\ \exists y \leqslant w\ \delta)[b/w]$, puisque $w$ ne figure pas dans $\delta$, et l'introduction de l'existentiel avec le terme $b$ donne la conclusion.

      *Pas.* Sous les hypothèses $\theta(v)$ et $\forall x \leqslant S\,v\ \exists y\, \delta$, le point (vii) (d) donne $\forall x \leqslant v\ \exists y\, \delta$ et $\exists y\, \delta'$. La première et $\theta(v)$ donnent $\exists w\, \forall x \leqslant v\ \exists y \leqslant w\ \delta$, et l'élimination avec des variables nouvelles $c$ et $b$ donne $\forall x \leqslant v\ \exists y \leqslant c\ \delta$ et $\delta'[b/y]$. Par le point (i) de {{cal-pa-ordre|Ordre dans PA}}, $c \leqslant c + b$ et $b \leqslant c + b$. Le point (vii) (e), appliqué sous la borne $\forall x \leqslant v$ à l'implication $\exists y \leqslant c\ \delta \to \exists y \leqslant c + b\ \delta$, donne $\forall x \leqslant v\ \exists y \leqslant c + b\ \delta$, et le point (vii) (a) donne $\exists y \leqslant c + b\ \delta'$. Le point (vii) (d) réunit ces deux formules en $\forall x \leqslant S\,v\ \exists y \leqslant c + b\ \delta$, et l'introduction de l'existentiel avec le terme $c + b$, substituable à $w$ puisque $c$ et $b$ sont nouvelles, donne $\exists w\, \forall x \leqslant S\,v\ \exists y \leqslant w\ \delta$. On élimine $b$ et $c$, qui ne sont libres ni dans les hypothèses ni dans la conclusion, et le théorème de la déduction donne $\theta(S\,v)$ sous l'hypothèse $\theta(v)$. Le cas $0$ se décharge de même, et le point (iii) de {{cal-pa-recurrence|Récurrence dans PA}} donne $\vdash_{\mathsf{PA}} \forall v\, \theta(v)$.

      (ii) On reprend la récurrence sur la construction de $\mathcal S$ de la preuve citée, avec ses conditions sur les variables, en démontrant chaque équivalence dans $\mathsf{PA}$. On emploie ces trois faits. Si $\vdash_{\mathsf{PA}} \varphi_1 \leftrightarrow \psi_1$ et $\vdash_{\mathsf{PA}} \varphi_2 \leftrightarrow \psi_2$, alors $\varphi_1 \wedge \varphi_2$ et $\varphi_1 \vee \varphi_2$ équivalent à $\psi_1 \wedge \psi_2$ et $\psi_1 \vee \psi_2$, par la règle des tautologies, et $\exists x\, \varphi_1$, $\forall x \leqslant t\ \varphi_1$ à $\exists x\, \psi_1$, $\forall x \leqslant t\ \psi_1$, par la monotonie de {{cal-pa-recurrence|Récurrence dans PA}}, (ii), et le point (vii) (e) de {{cal-pa-ordre|Ordre dans PA}}. Si $y'$ ne figure pas dans $\delta$, alors $\vdash \exists y\, \delta \leftrightarrow \exists y'\, \delta[y'/y]$ : un sens est le renommage du point (iii) de {{cal-rp-calcul|Calcul à variables libres}} ; pour l'autre, l'introduction avec le terme $y'$ donne $\delta[y'/y] \to \exists y\, \delta$, et l'élimination de $y'$, qui n'est pas libre dans $\exists y\, \delta$, conclut. Enfin, si $y$ ne figure pas dans la formule Δ₀ $\delta$, l'introduction avec le terme $y$ et l'élimination donnent $\vdash \delta \leftrightarrow \exists y\, \delta$.

      *Conjonction.* Il reste à voir $\vdash_{\mathsf{PA}} (\exists y_1\, \delta_1 \wedge \exists y_2\, \delta_2) \leftrightarrow \exists w\, \exists y_1 \leqslant w\ \exists y_2 \leqslant w\ (\delta_1 \wedge \delta_2)$, sous les conditions de la preuve citée : $y_1$, $y_2$, $w$ distinctes, $y_1$ absente de $\delta_2$, $y_2$ absente de $\delta_1$, $w$ et les variables liées des bornes nouvelles. Sous les hypothèses $\delta_1[a/y_1]$ et $\delta_2[b/y_2]$, avec des variables nouvelles $a$ et $b$ : le point (vii) (a) de {{cal-pa-ordre|Ordre dans PA}}, avec $b \leqslant a + b$, donne $\exists y_2 \leqslant a + b\ (\delta_1[a/y_1] \wedge \delta_2)$, qui est $(\exists y_2 \leqslant a + b\ (\delta_1 \wedge \delta_2))[a/y_1]$, puisque $y_1$ ne figure ni dans $\delta_2$ ni dans la borne, et le même point, avec $a \leqslant a + b$, donne $\exists y_1 \leqslant a + b\ \exists y_2 \leqslant a + b\ (\delta_1 \wedge \delta_2)$ ; l'introduction avec le terme $a + b$, substituable à $w$, et l'élimination de $b$ et $a$ donnent le sens direct. Réciproquement, le point (vii) (c) et la monotonie donnent $\vdash \exists y_2 \leqslant w\ (\delta_1 \wedge \delta_2) \to \exists y_2\, (\delta_1 \wedge \delta_2)$ ; le point (vii) (e), qui fait passer cette implication sous $\exists y_1 \leqslant w$, puis de nouveau le point (vii) (c) et la monotonie, donnent $\vdash_{\mathsf{PA}} \exists y_1 \leqslant w\ \exists y_2 \leqslant w\ (\delta_1 \wedge \delta_2) \to \exists y_1\, \exists y_2\, (\delta_1 \wedge \delta_2)$ ; sous l'hypothèse $\delta_1 \wedge \delta_2$, l'introduction donne $\exists y_1\, \delta_1 \wedge \exists y_2\, \delta_2$, formule où ni $y_1$ ni $y_2$ ne sont libres, et deux éliminations, puis celle de $w$, concluent.

      *Disjonction.* Pour $w$ nouvelle, $\exists y_1\, \delta_1 \to \exists w\, \delta_1[w/y_1]$ par le renommage, et $\exists w\, \delta_1[w/y_1] \to \exists w\, (\delta_1[w/y_1] \vee \delta_2[w/y_2])$ par la monotonie, et de même pour $\delta_2$ ; le raisonnement par cas donne le sens direct. Réciproquement, l'introduction avec le terme $w$ donne $\delta_1[w/y_1] \to \exists y_1\, \delta_1$ et $\delta_2[w/y_2] \to \exists y_2\, \delta_2$, et l'élimination de $w$ conclut.

      *Quantification existentielle.* Pour $x \neq y_1$ et $w$ nouvelle, $\vdash_{\mathsf{PA}} \exists x\, \exists y_1\, \delta_1 \leftrightarrow \exists w\, \exists x \leqslant w\ \exists y_1 \leqslant w\ \delta_1$ se démontre comme la conjonction, sous les hypothèses $\delta_1[a/x][b/y_1]$, avec le témoin $a + b$.

      *Quantification bornée.* Pour $\varphi = \forall x \leqslant t\ \varphi_1$, avec $\varphi_1$ équivalente à $\exists y_1\, \delta_1$, et $y_1$, $w$ absentes de $t$ et distinctes de $x$ et de la variable liée de la borne, c'est le point (i).

      Dans chaque cas, la formule obtenue est celle de la preuve citée, et ses variables libres sont celles qui y sont indiquées.
    remarques:
      - |
        La preuve citée prenait pour témoin commun le maximum des témoins ; ici, c'est leur somme, qui majore chacun d'eux par le point (i) de {{cal-pa-ordre|Ordre dans PA}} sans qu'il faille définir le maximum dans $\mathsf{PA}$. Le pas de collection, lui, est une vraie récurrence, sur la borne : dans $\mathcal N$, on prenait le plus grand de $m + 1$ témoins ; dans $\mathsf{PA}$, on ne peut pas parler d'une famille de $m + 1$ témoins avant d'avoir codé les suites, et la récurrence ajoute les témoins un par un. L'erreur la plus répandue est de faire la récurrence sur la borne $t$ elle-même : $t$ est un terme, qui peut contenir des variables de $\delta$, et c'est pourquoi on la fait sur une variable nouvelle $v$, remplacée par $t$ à la fin.
      - |
        Ce point sert au {{l-incompletude|second théorème d'incomplétude}}. La formule naturelle de démontrabilité, qui transcrira la définition des démonstrations formelles avec la formule $B$ de la {{cal-beta|fonction β}}, sera écrite, dans les chapitres suivants, comme une formule de $\mathcal S$ ; le point (ii) montrera alors que $\mathsf{PA}$ la démontre équivalente à une formule $\exists y\, \delta$, la forme exigée d'une {{cal-dg-prov|formule de démontrabilité}} au chapitre voisin {{cal-diagonal|Lemme diagonal et démontrabilité}}. Il restera à établir, dans les chapitres suivants, que $\mathsf{PA}$ démontre les propriétés de $\beta$ et des fonctions de la syntaxe, puis les conditions (D2) et (D3), aux nœuds {{cal-sp-derivabilite|Deuxième condition (D2)}} et {{cal-sg-d3|Troisième condition (D3)}}.

