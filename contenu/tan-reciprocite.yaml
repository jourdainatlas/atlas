# Niveau 2 : structure interne du chapitre « Réciprocité quadratique » (nœud tan-reciprocite du graphe
# tan, créé le 30 oct. 2026). Congruences, inversibles de ℤ/nℤ et théorèmes de Fermat et d'Euler ;
# théorème de Wilson et sa réciproque, racine carrée explicite de −1 ; résidus quadratiques, symbole de
# Legendre, critère d'Euler et première loi complémentaire ; lemme de Gauss et seconde loi
# complémentaire ; lemme d'Eisenstein ; loi de réciprocité quadratique, démontrée par le comptage des
# points d'un réseau, dû à Eisenstein, puis une seconde fois par les sommes de Gauss dans un corps fini ;
# applications (premiers ≡ 1 mod 4 et mod 8, caractères de 3 et de 5).
# Le chapitre suit le nœud an-gauss (deux carrés), qu'il éclaire ; il emploie ℤ/nℤ (z), les groupes
# cycliques et le groupe multiplicatif d'un corps (gf), les racines des polynômes (z-polynomes) et les
# corps finis (galois). Aucune forme du choix n'intervient.

graphe: tan-reciprocite
titre: Réciprocité quadratique
conteneur: tan-reciprocite

entrees:
  an-gauss: [rq-fermat, rq-wilson]

noeuds:
  - id: rq-fermat
    etiquette: Fermat, Euler
    nature: théorème
    titre: Théorèmes de Fermat et d'Euler
    texte: |
      Pour $n \geqslant 1$ et $a, b \in \lex{ensemble-entiers-relatifs}{\mathbb Z}$, on écrit $a \equiv b \pmod n$, et l'on dit que $a$ est **congru** à $b$ modulo $n$, lorsque $n$ divise $a - b$, c'est-à-dire lorsque $a$ et $b$ ont la même classe dans $\lex{anneau-zn}{\mathbb Z/n\mathbb Z}$. Les congruences modulo $n$ s'additionnent et se multiplient, puisque la projection de $\mathbb Z$ sur $\mathbb Z/n\mathbb Z$ est un morphisme d'anneaux ({{a-anneau-quotient|Anneau quotient}}).

      Comme au nœud {{gf-produits|Produits semi-directs}}, $(\mathbb Z/n\mathbb Z)^\times$ est le groupe des éléments inversibles de l'anneau $\mathbb Z/n\mathbb Z$, et $\varphi(n)$ désigne, comme au nœud {{gf-cycliques|Groupes cycliques}}, le nombre d'entiers $k \in \{1, \dots, n\}$ premiers à $n$.
    enonce: |
      (i) La classe $\bar a$ est inversible dans $\mathbb Z/n\mathbb Z$ si et seulement si $a \wedge n = 1$. Le groupe $(\mathbb Z/n\mathbb Z)^\times$ a donc $\varphi(n)$ éléments.

      (ii) *Euler.* Si $a \wedge n = 1$, alors $a^{\varphi(n)} \equiv 1 \pmod n$.

      (iii) *Fermat.* Si $p$ est un [[nombre-premier|nombre premier]], alors $a^p \equiv a \pmod p$ pour tout $a \in \mathbb Z$, et $a^{p-1} \equiv 1 \pmod p$ si $p$ ne divise pas $a$.
    preuve: |
      (i) Si $\bar a\bar u = \bar 1$, il existe $v \in \mathbb Z$ tel que $au - 1 = nv$, d'où $au + n(-v) = 1$, et $a \wedge n = 1$ par le théorème de Bézout ({{z-bezout|PGCD, Bézout}}, (ii)). Réciproquement, une relation $au + nv = 1$ donne $\bar a\bar u = \bar 1$.

      La condition $a \wedge n = 1$ ne dépend que de la classe de $a$, puisque l'idéal $(a + kn)\mathbb Z + n\mathbb Z$ est égal à $a\mathbb Z + n\mathbb Z$ pour tout $k \in \mathbb Z$.

      Comme $\bar n = \bar 0$, les classes $\bar 1, \dots, \bar n$ sont, à l'ordre près, les $n$ éléments $\bar 0, \dots, \overline{n - 1}$ de $\mathbb Z/n\mathbb Z$, deux à deux distincts ({{z-zn|ℤ/nℤ}}). Les inversibles sont donc les classes des entiers $k \in \{1, \dots, n\}$ premiers à $n$, au nombre de $\varphi(n)$.

      (ii) Dans un groupe fini $G$, tout élément $x$ vérifie $x^{|G|} = e$ ({{gf-cycliques|Groupes cycliques}}, (i)). Pour $G = (\mathbb Z/n\mathbb Z)^\times$, d'ordre $\varphi(n)$ par (i), et $x = \bar a$, c'est l'égalité $\bar a^{\varphi(n)} = \bar 1$.

      (iii) Les seuls diviseurs positifs de $p$ étant $1$ et $p$, les entiers de $\{1, \dots, p\}$ premiers à $p$ sont $1, \dots, p - 1$, et $\varphi(p) = p - 1$. Si $p$ ne divise pas $a$, le pgcd $a \wedge p$, diviseur positif de $p$ différent de $p$, vaut $1$, et (ii) donne $a^{p-1} \equiv 1$ ; en multipliant par $a$, $a^p \equiv a$. Si $p$ divise $a$, les deux membres de $a^p \equiv a$ sont congrus à $0$.
    remarques:
      - |
        L'exposant $\varphi(n)$ est un multiple de l'ordre de $\bar a$, pas toujours cet ordre. Modulo $11$, on a $2^{10} = 1024 = 93 \cdot 11 + 1$, et $2$ est d'ordre exactement $10$ ; modulo $12$, où $\varphi(12) = 4$, on a déjà $5^2 = 25 = 2 \cdot 12 + 1$.
      - |
        L'erreur la plus répandue est de lire le théorème de Fermat comme un critère de primalité. La réciproque est fausse : $341 = 11 \cdot 31$ n'est pas premier, et pourtant $2^{340} \equiv 1 \pmod{341}$.

        Il y a pire : pour $561 = 3 \cdot 11 \cdot 17$, la congruence $a^{560} \equiv 1 \pmod{561}$ vaut pour tout $a$ premier à $561$. Le théorème de Wilson, lui, caractérise exactement les nombres premiers par une congruence, comme l'établira le nœud voisin ({{rq-wilson|Wilson}}, (ii)), mais il est inutilisable en pratique.
      - |
        La preuve passe par le théorème de Lagrange. On peut aussi démontrer $a^p \equiv a$ par récurrence sur $a \geqslant 0$, à partir de $(a + 1)^p \equiv a^p + 1 \pmod p$, que donne le binôme de Newton en caractéristique $p$ ({{pol-binome|Binôme de Newton}}, (iv)) ; le cas $a < 0$ s'en déduit, puisque $a^p \equiv (a + kp)^p$.
      - |
        Fermat énonce le théorème, sans démonstration, dans une lettre à Frénicle de Bessy du 18 octobre 1640 ; Euler en rédige en 1736 la première démonstration, publiée en 1741, et l'étend plus tard aux modules quelconques par la fonction $\varphi$ qui porte son nom.

  - id: rq-wilson
    etiquette: Wilson
    nature: théorème
    titre: Théorème de Wilson et sa réciproque
    enonce: |
      (i) *Wilson.* Si $p$ est un [[nombre-premier|nombre premier]], alors $(p - 1)! \equiv -1 \pmod p$.

      (ii) *Réciproque.* Si $n \geqslant 2$ et $(n - 1)! \equiv -1 \pmod n$, alors $n$ est premier.

      (iii) Si $p$ est premier et $p \equiv 1 \pmod 4$, l'entier $x = \big(\frac{p-1}2\big)!$ vérifie $x^2 \equiv -1 \pmod p$.
    preuve: |
      (i) Pour $p = 2$, $1! = 1 \equiv -1 \pmod 2$. Soit $p$ impair, et $\lex{corps-fini}{\mathbb F_p} = \lex{anneau-zn}{\mathbb Z/p\mathbb Z}$, qui est un [[corps]] ({{z-zn|ℤ/nℤ}}). Pour $x \in \mathbb F_p^\times$, l'égalité $x = x^{-1}$ équivaut à $x^2 = 1$, c'est-à-dire à $(x - 1)(x + 1) = 0$, donc à $x = 1$ ou $x = -1$, le corps étant intègre. Ces deux éléments sont distincts, puisque $2 \neq 0$ dans $\mathbb F_p$ pour $p$ impair.

      Soit $E = \mathbb F_p^\times \setminus \{1, -1\}$. Pour $x \in E$, l'inverse $x^{-1}$ est dans $E$ et différent de $x$ ; deux paires $\{x, x^{-1}\}$ et $\{y, y^{-1}\}$ sont égales ou disjointes, puisque $y \in \{x, x^{-1}\}$ entraîne $\{y, y^{-1}\} = \{x, x^{-1}\}$. L'ensemble $E$ est donc réunion disjointe de paires dont le produit des deux éléments vaut $1$.

      Le produit de tous les éléments de $E$, calculé paire par paire, ce que permet la commutativité, vaut donc $1$, et celui de tous les éléments de $\mathbb F_p^\times$ vaut $1 \cdot (-1) \cdot 1 = -1$. Or $\mathbb F_p^\times$ est formé des classes de $1, \dots, p - 1$, dont le produit est la classe de $(p - 1)!$.

      ```schema rq-wilson
      Pour $p = 13$, chaque classe non nulle est reliée à son inverse : les cinq cordes bleues sont les paires $\{x, x^{-1}\}$, de produit $1$ ; seules $1$ et $12 \equiv -1$, en rouge, sont leurs propres inverses. Le produit des douze classes se réduit ainsi à $1 \cdot 12$, et $12! \equiv -1 \pmod{13}$.
      ```

      (ii) Supposons $n$ composé : $n = ab$ avec $1 < a < n$. Comme $a \leqslant n - 1$, l'entier $a$ divise $(n - 1)!$. Si l'on avait $(n - 1)! \equiv -1 \pmod n$, l'entier $a$, qui divise $n$, diviserait aussi $(n - 1)! + 1$, donc $1$, ce qui contredit $a > 1$.

      (iii) Posons $P = \frac{p-1}2$. Les entiers $1, \dots, p - 1$ sont les $k$ et les $p - k$ pour $1 \leqslant k \leqslant P$, chacun une fois, puisque $p - P = P + 1$. Comme $p - k \equiv -k \pmod p$,
      $$\begin{aligned} (p - 1)! &= \prod_{k=1}^P k\,(p - k) \\ &\equiv (-1)^P\,(P!)^2 \pmod p. \end{aligned}$$

      Par (i), $-1 \equiv (-1)^P x^2$. Si $p \equiv 1 \pmod 4$, l'entier $P$ est pair, et $x^2 \equiv -1 \pmod p$.
    remarques:
      - |
        Pour $p = 13$, on a $12! = 479\,001\,600 = 36\,846\,277 \cdot 13 - 1$. L'entier $6! = 720 = 55 \cdot 13 + 5$ donne $5^2 = 25 = 2 \cdot 13 - 1$ : la classe de $5$ est une racine carrée de $-1$ modulo $13$.

        La démonstration du théorème des deux carrés ({{an-gauss|Deux carrés}}, (ii)) obtient un tel $x$ par la cyclicité de $\mathbb F_p^\times$, sans le calculer ; le point (iii) le donne explicitement. L'algorithme d'Euclide dans $\lex{entiers-gauss}{\mathbb Z[i]}$, appliqué à $13$ et $5 + i$, achève le calcul : $5 + i = (1 + i)(3 - 2i)$ et $13 = (3 - 2i)(3 + 2i)$, d'où $13 = 3^2 + 2^2$.
      - |
        Pour $n$ composé, $(n - 1)!$ n'est pas seulement différent de $-1$ modulo $n$ : il est nul dès que $n > 4$. Écrivons $n = ab$ avec $2 \leqslant a \leqslant b < n$. Si $a < b$, les facteurs $a$ et $b$ de $(n - 1)!$ sont distincts, et $n$ divise leur produit.

        Si $a = b$, alors $n = a^2$ avec $a \geqslant 3$, et $a < 2a < a^2$ : les facteurs $a$ et $2a$ sont distincts, et $n$ divise $2a^2$. Le seul cas d'exception est $n = 4$, où $3! = 6 \equiv 2 \pmod 4$.
      - |
        Le critère (ii) caractérise les nombres premiers, mais il est sans intérêt pratique : calculer $(n - 1)!$ modulo $n$ demande environ $n$ multiplications, bien plus que les essais de division par les entiers jusqu'à $\sqrt n$.
      - |
        Le théorème est publié sans démonstration par Waring en 1770, dans ses *Meditationes algebraicae*, qui l'attribue à son élève John Wilson. Lagrange en donne la première démonstration, avec la réciproque, dans les *Nouveaux Mémoires de l'Académie de Berlin* pour l'année 1771.

  - id: rq-legendre
    etiquette: Symbole de Legendre
    nature: théorème
    titre: Résidus quadratiques, critère d'Euler
    texte: |
      Dans la suite du chapitre, $p$ est un nombre premier impair, et $\lex{corps-fini}{\mathbb F_p} = \lex{anneau-zn}{\mathbb Z/p\mathbb Z}$. Un entier $a$ non divisible par $p$ est un [[residu-quadratique|résidu quadratique]] modulo $p$ s'il existe $x \in \lex{ensemble-entiers-relatifs}{\mathbb Z}$ tel que $x^2 \equiv a \pmod p$, c'est-à-dire si sa classe est un carré dans $\mathbb F_p^\times$ ; sinon, c'est un **non-résidu** quadratique.

      Le [[symbole-legendre|symbole de Legendre]] de $a \in \mathbb Z$ modulo $p$ est
      $$\lex{symbole-legendre}{\Big(\frac ap\Big)} = \begin{cases} 0 & \text{si } p \mid a, \\ 1 & \text{si } a \text{ est un résidu}, \\ -1 & \text{si } a \text{ est un non-résidu}. \end{cases}$$
    enonce: |
      (i) Les carrés de $\mathbb F_p^\times$ forment un sous-groupe $C$ d'indice $2$, à $\frac{p-1}2$ éléments. Pour $x, y \in \mathbb F_p^\times$, on a $x^2 = y^2$ si et seulement si $y = x$ ou $y = -x$.

      (ii) *Critère d'Euler.* Pour tout $a \in \mathbb Z$,
      $$\Big(\frac ap\Big) \equiv a^{\frac{p-1}2} \pmod p.$$

      (iii) Le symbole ne dépend que de la classe de $a$ modulo $p$, et il est multiplicatif : $\big(\frac{ab}p\big) = \big(\frac ap\big)\big(\frac bp\big)$ pour tous $a, b \in \mathbb Z$.

      (iv) *Première loi complémentaire.* $\big(\frac{-1}p\big) = (-1)^{\frac{p-1}2}$ : l'entier $-1$ est un résidu quadratique modulo $p$ si et seulement si $p \equiv 1 \pmod 4$.
    preuve: |
      (i) L'application $s : x \mapsto x^2$ est un morphisme du groupe abélien $\mathbb F_p^\times$ dans lui-même, d'image $C$. Son noyau est formé des $x$ tels que $(x - 1)(x + 1) = 0$, c'est-à-dire de $1$ et $-1$, qui sont distincts puisque $p$ est impair ; il a deux éléments.

      Le théorème d'isomorphisme ({{a-isomorphisme|Théorème d'isomorphisme}}) identifie $C$ au quotient de $\mathbb F_p^\times$ par ce noyau, et le théorème de Lagrange ({{gs-lagrange|Lagrange}}) donne $|C| = \frac{p-1}2$. Enfin $x^2 = y^2$ équivaut à $(yx^{-1})^2 = 1$, c'est-à-dire à $yx^{-1} = \pm 1$.

      (ii) Si $p$ divise $a$, les deux membres sont congrus à $0$. Sinon, soit $b$ la classe de $a^{\frac{p-1}2}$. Alors $b^2 = \bar a^{p-1} = 1$ par le théorème de Fermat ({{rq-fermat|Fermat, Euler}}, (iii)), donc $b = \pm 1$ par (i).

      Si $\bar a = x^2$ est un carré, $b = x^{p-1} = 1$. Les $\frac{p-1}2$ éléments de $C$ sont ainsi des racines dans $\mathbb F_p$ du polynôme $X^{\frac{p-1}2} - 1$. Ce polynôme non nul, de degré $\frac{p-1}2$, a au plus $\frac{p-1}2$ racines dans le corps $\mathbb F_p$ ({{pol-racines|Racines}}, (iii)) : ses racines sont exactement les éléments de $C$. Si $\bar a$ n'est pas un carré, il n'en est donc pas une racine, et $b = -1$.

      (iii) La définition ne fait intervenir que la classe de $a$. Par (ii),
      $$\Big(\frac{ab}p\Big) \equiv a^{\frac{p-1}2}\,b^{\frac{p-1}2} \equiv \Big(\frac ap\Big)\Big(\frac bp\Big) \pmod p.$$
      Les deux membres appartiennent à $\{-1, 0, 1\}$, et deux éléments de cet ensemble congrus modulo $p \geqslant 3$ sont égaux, leur différence étant de valeur absolue au plus $2$.

      (iv) Par (ii), $\big(\frac{-1}p\big) \equiv (-1)^{\frac{p-1}2} \pmod p$, et ces deux nombres valent $\pm 1$, donc sont égaux comme en (iii). L'entier impair $p$ est congru à $1$ ou à $3$ modulo $4$, et $\frac{p-1}2$ est pair exactement dans le premier cas.
    remarques:
      - |
        Modulo $13$, les carrés de $1, \dots, 6$ sont $1, 4, 9, 3, 12, 10$ : ce sont les six résidus, en accord avec (i), et $2, 5, 6, 7, 8, 11$ sont les six non-résidus. Le critère d'Euler le confirme : $2^6 = 64 = 5 \cdot 13 - 1$, alors que $3^6 = 729 = 56 \cdot 13 + 1$. Comme $13 \equiv 1 \pmod 4$, le résidu $12 \equiv -1$ est bien un carré, celui de $5$.
      - |
        L'erreur la plus répandue est de croire que le produit de deux non-résidus est un non-résidu. La multiplicativité dit le contraire : modulo $13$, les non-résidus $2$ et $5$ ont pour produit $10 \equiv 6^2$, qui est un résidu. Les carrés forment un sous-groupe d'indice $2$, et le symbole de Legendre est le morphisme de $\mathbb F_p^\times$ sur $\{\pm 1\}$ de noyau $C$.
      - |
        Avec une [[racine-primitive|racine primitive]] $g$ modulo $p$ ({{gf-multiplicatif|Groupe multiplicatif}}, (iii)), le critère se lit sur les exposants : $g^k$ est un carré si et seulement si $k$ est pair, et $g^{\frac{p-1}2} = -1$, seul élément d'ordre $2$. La démonstration ci-dessus s'en passe : elle n'emploie que la borne sur le nombre de racines d'un polynôme.
      - |
        Le point (iv) relie trois propriétés d'un nombre premier impair $p$ : être somme de deux carrés, être congru à $1$ modulo $4$, avoir $-1$ pour carré modulo $p$. Le théorème des deux carrés ({{an-gauss|Deux carrés}}, (ii)) passe précisément par la troisième pour établir l'équivalence des deux premières.

  - id: rq-lemme-gauss
    etiquette: Lemme de Gauss
    nature: lemme
    titre: Lemme de Gauss et seconde loi complémentaire
    texte: |
      Soit $a$ un entier non divisible par $p$, et $P = \frac{p-1}2$. Les $p$ entiers $-P, \dots, P$ sont deux à deux non congrus modulo $p$, leurs différences étant comprises entre $1$ et $p - 1$ en valeur absolue ; ils représentent donc chacun l'une des $p$ classes de $\lex{anneau-zn}{\mathbb Z/p\mathbb Z}$ ({{z-zn|ℤ/nℤ}}). Pour $1 \leqslant k \leqslant P$, on note $r_k$ l'unique entier de $\{-P, \dots, P\}$ congru à $ak$ modulo $p$.
    enonce: |
      (i) *Lemme de Gauss.* Les entiers $|r_1|, \dots, |r_P|$ sont les entiers $1, \dots, P$, chacun une fois. Si $\mu$ est le nombre d'indices $k$ tels que $r_k < 0$, alors
      $$\Big(\frac ap\Big) = (-1)^\mu.$$

      (ii) *Seconde loi complémentaire.* $\big(\frac 2p\big) = (-1)^{\frac{p^2-1}8}$ : l'entier $2$ est un [[residu-quadratique|résidu quadratique]] modulo $p$ si et seulement si $p \equiv \pm 1 \pmod 8$.
    preuve: |
      (i) Comme $p$ ne divise ni $a$ ni $k$, il ne divise pas $ak$ (lemme d'Euclide, {{z-premiers|Nombres premiers}}, (i)) : $r_k \neq 0$, et $|r_k| \in \{1, \dots, P\}$.

      Si $|r_k| = |r_l|$, alors $ak \equiv \pm al$, et, la classe de $a$ étant inversible ({{rq-fermat|Fermat, Euler}}, (i)), $k \equiv \pm l \pmod p$. Or $2 \leqslant k + l \leqslant p - 1$, si bien que $p$ ne divise pas $k + l$ : c'est donc $k \equiv l$, et $k = l$, puisque $|k - l| < p$. L'application $k \mapsto |r_k|$, injective de $\{1, \dots, P\}$ dans lui-même, en est une bijection.

      En multipliant les congruences $ak \equiv r_k$ pour $k = 1, \dots, P$, on obtient
      $$\begin{aligned} a^P\,P! &\equiv \prod_{k=1}^P r_k = (-1)^\mu \prod_{k=1}^P |r_k| \\ &= (-1)^\mu\,P! \pmod p. \end{aligned}$$

      L'entier $P!$, produit d'entiers compris entre $1$ et $p - 1$, n'est pas divisible par $p$, et sa classe est inversible : $a^P \equiv (-1)^\mu$. Le critère d'Euler ({{rq-legendre|Symbole de Legendre}}, (ii)) donne $\big(\frac ap\big) \equiv (-1)^\mu$, et ces deux nombres, qui valent $\pm 1$, sont égaux.

      ```schema rq-lemme-gauss
      Pour $p = 13$ et $a = 5$, les multiples $5k$, $1 \leqslant k \leqslant 6$, sont placés en leur représentant $r_k$ entre $-6$ et $6$. Trois tombent du côté négatif, en rouge ; repliés sur leur opposé, ils viennent occuper, avec les trois points bleus, les entiers $1, \dots, 6$, chacun une fois. Ainsi $\mu = 3$ et $\big(\frac 5{13}\big) = -1$.
      ```

      (ii) Pour $a = 2$ et $1 \leqslant k \leqslant P$, l'entier $2k$ est compris entre $2$ et $p - 1$. Si $2k \leqslant P$, alors $r_k = 2k > 0$ ; si $2k > P$, alors $r_k = 2k - p$, compris entre $-P$ et $-1$. Il y a $\lfloor P/2 \rfloor$ indices de la première sorte, où $\lfloor P/2 \rfloor$ est le quotient de la division euclidienne de $P$ par $2$, d'où $\mu = P - \lfloor P/2 \rfloor$.

      Écrivons $p = 8m + j$ avec $j \in \{1, 3, 5, 7\}$ et $c = \frac{j-1}2 \in \{0, 1, 2, 3\}$. Alors $P = 4m + c$ et $\mu = 2m + c - \lfloor c/2 \rfloor$, qui vaut $2m$, $2m + 1$, $2m + 1$ et $2m + 2$ pour $c = 0, 1, 2, 3$ : $\mu$ est pair si et seulement si $j = 1$ ou $j = 7$.

      De même, pour $p = 8m \pm 1$, l'entier $\frac{p^2 - 1}8 = 8m^2 \pm 2m$ est pair, et pour $p = 8m \pm 3$, l'entier $\frac{p^2 - 1}8 = 8m^2 \pm 6m + 1$ est impair. Les deux exposants ont la même parité, et (i) conclut.
    remarques:
      - |
        Ce lemme de Gauss n'a rien de commun avec celui de l'arithmétique ({{z-bezout|PGCD, Bézout}}, (iii)), ni avec celui qui porte sur le contenu des polynômes ({{pol-gauss|Lemme de Gauss}}) : trois résultats différents portent le même nom. Celui-ci est le point de départ de la troisième démonstration de la loi de réciprocité par Gauss, *Theorematis arithmetici demonstratio nova*, parue en 1808.
      - |
        Modulo $7$, on a $3^2 = 9 \equiv 2$, et $7 \equiv -1 \pmod 8$, conformément à (ii) ; modulo $13 \equiv 5 \pmod 8$, l'entier $2$ est un non-résidu, comme le montrait $2^6 \equiv -1$ ({{rq-legendre|Symbole de Legendre}}).
      - |
        La seconde loi complémentaire a une conséquence pour les nombres de Mersenne $2^q - 1$. Si $q \equiv 3 \pmod 4$ et $p = 2q + 1$ sont premiers, alors $p \equiv 7 \pmod 8$, donc $2$ est un résidu modulo $p$, et le critère d'Euler donne $2^q = 2^{\frac{p-1}2} \equiv 1 \pmod p$ : $p$ divise $2^q - 1$. Pour $q = 11$, on trouve $2^{11} - 1 = 2047 = 23 \cdot 89$.

  - id: rq-eisenstein
    etiquette: Lemme d'Eisenstein
    nature: lemme
    titre: Lemme d'Eisenstein
    texte: |
      Pour des entiers $m$ et $n \geqslant 1$, on note $\lfloor m/n \rfloor$ le quotient de la division euclidienne de $m$ par $n$ ({{z-division|Division euclidienne}}), et, pour $a \in \lex{ensemble-entiers-relatifs}{\mathbb Z}$,
      $$S(a, p) = \sum_{k=1}^{P} \Big\lfloor \frac{ak}p \Big\rfloor, \qquad P = \frac{p-1}2.$$
    enonce: |
      Si $a$ est impair et non divisible par $p$, alors
      $$\Big(\frac ap\Big) = (-1)^{S(a, p)}.$$
    preuve: |
      Pour $1 \leqslant k \leqslant P$, écrivons $ak = p\,q_k + t_k$ avec $q_k = \lfloor ak/p \rfloor$ et $0 \leqslant t_k < p$ ; on a $t_k \neq 0$, puisque $p$ ne divise pas $ak$. Avec les notations du lemme de Gauss ({{rq-lemme-gauss|Lemme de Gauss}}), $r_k = t_k$ si $t_k \leqslant P$, et $r_k = t_k - p < 0$ si $t_k > P$ : le nombre $\mu$ est celui des indices $k$ tels que $t_k > P$.

      Notons $A$ la somme des $t_k$ qui sont au plus $P$, et $B$ celle des $t_k$ qui dépassent $P$. En additionnant les égalités $ak = p\,q_k + t_k$, on obtient
      $$a\sum_{k=1}^P k = p\,S(a, p) + A + B.$$

      Les $|r_k|$ sont les entiers $1, \dots, P$, chacun une fois (même nœud, (i)) ; ils valent $t_k$ dans le premier cas et $p - t_k$ dans le second, si bien que
      $$\sum_{k=1}^P k = A + \mu p - B.$$

      En retranchant, $(a - 1)\sum_k k = p\,S(a, p) - \mu p + 2B$. Comme $a - 1$ est pair et $p$ impair, la réduction modulo $2$ donne $S(a, p) \equiv \mu \pmod 2$, et le lemme de Gauss conclut.
    remarques:
      - |
        Pour $p = 13$ et $a = 5$, les quotients $\lfloor 5k/13 \rfloor$, pour $k = 1, \dots, 6$, sont $0, 0, 1, 1, 1, 2$, de somme $S = 5$ : on retrouve $\big(\frac 5{13}\big) = -1$. Les entiers $S = 5$ et $\mu = 3$ sont différents ; seule leur parité est la même.
      - |
        L'hypothèse « $a$ impair » ne peut pas être omise. Pour $p = 3$ et $a = 2$, on a $S(2, 3) = \lfloor 2/3 \rfloor = 0$, alors que $\big(\frac 23\big) = -1$, le seul carré non nul modulo $3$ étant $1$. Pour $a = 2$, c'est le lemme de Gauss lui-même qui donne la réponse ({{rq-lemme-gauss|Lemme de Gauss}}, (ii)).
      - |
        Ce lemme ne doit pas être confondu avec le critère d'irréductibilité d'Eisenstein ({{pol-eisenstein|Critère d'Eisenstein}}). Il transforme un signe en une somme de parties entières, que la démonstration suivante interprète comme un nombre de points d'un réseau.

  - id: rq-reciprocite
    etiquette: Réciprocité quadratique
    nature: théorème
    titre: Loi de réciprocité quadratique
    enonce: |
      Soient $p$ et $q$ deux nombres premiers impairs distincts. Alors
      $$\Big(\frac pq\Big)\Big(\frac qp\Big) = (-1)^{\frac{p-1}2 \cdot \frac{q-1}2}.$$

      Autrement dit, $\big(\frac pq\big) = \big(\frac qp\big)$, sauf si $p \equiv q \equiv 3 \pmod 4$, auquel cas $\big(\frac pq\big) = -\big(\frac qp\big)$. C'est la [[loi-reciprocite-quadratique|loi de réciprocité quadratique]].
    preuve: |
      Posons $P = \frac{p-1}2$ et $Q = \frac{q-1}2$. Les entiers $q$ et $p$ sont impairs, et chacun est premier à l'autre : le lemme d'Eisenstein ({{rq-eisenstein|Lemme d'Eisenstein}}) donne $\big(\frac qp\big) = (-1)^{S(q, p)}$ et $\big(\frac pq\big) = (-1)^{S(p, q)}$. Il suffit donc de montrer que $S(q, p) + S(p, q) = PQ$.

      Soit $E$ l'ensemble des couples d'entiers $(x, y)$ tels que $1 \leqslant x \leqslant P$ et $1 \leqslant y \leqslant Q$ ; il a $PQ$ éléments. Aucun d'eux ne vérifie $qx = py$ : sinon $p$ diviserait $qx$, donc $x$ par le lemme d'Euclide ({{z-premiers|Nombres premiers}}, (i)), ce qui est impossible puisque $1 \leqslant x < p$. Ainsi $E$ est la réunion disjointe de $E_1 = \{(x, y) \in E : py < qx\}$ et de $E_2 = \{(x, y) \in E : qx < py\}$.

      Fixons $x$, et écrivons $qx = p\,\lfloor qx/p \rfloor + t$ avec $0 < t < p$. Si $y \leqslant \lfloor qx/p \rfloor$, alors $py \leqslant qx - t < qx$ ; si $y \geqslant \lfloor qx/p \rfloor + 1$, alors $py \geqslant qx - t + p > qx$. Les $y \geqslant 1$ tels que $py < qx$ sont donc les entiers de $1$ à $\lfloor qx/p \rfloor$.

      Ils sont tous au plus $Q$ : de $p\,\lfloor qx/p \rfloor \leqslant qx$ et $2x \leqslant p - 1$, on tire $2p\,\lfloor qx/p \rfloor \leqslant q(p - 1) < pq$, donc $2\lfloor qx/p \rfloor < q$ et $\lfloor qx/p \rfloor \leqslant Q$. Par conséquent
      $$|E_1| = \sum_{x=1}^P \Big\lfloor \frac{qx}p \Big\rfloor = S(q, p),$$
      et, les rôles de $p$ et $q$ étant symétriques, $|E_2| = S(p, q)$. D'où $S(q, p) + S(p, q) = |E| = PQ$.

      ```schema rq-reciprocite
      Pour $p = 7$ et $q = 11$, le rectangle $E$ compte $3 \cdot 5 = 15$ points, et la droite $7y = 11x$ n'en contient aucun. Colonne par colonne, $1 + 3 + 4 = 8$ points sont au-dessous, en rouge : c'est $S(11, 7)$ ; ligne par ligne, $0 + 1 + 1 + 2 + 3 = 7$ points sont au-dessus, en bleu : c'est $S(7, 11)$. Le point $(2, 3)$ est juste au-dessous, puisque $7 \cdot 3 = 21 < 22 = 11 \cdot 2$. Comme $15$ est impair, $\big(\frac 7{11}\big)\big(\frac{11}7\big) = -1$.
      ```

      Enfin $PQ$ est impair si et seulement si $P$ et $Q$ le sont, c'est-à-dire si $p \equiv q \equiv 3 \pmod 4$ ; comme $\big(\frac qp\big)^2 = 1$, l'égalité s'écrit $\big(\frac pq\big) = (-1)^{PQ}\big(\frac qp\big)$.
    remarques:
      - |
        Pour $p = 7$ et $q = 11$, tous deux congrus à $3$ modulo $4$, on a $\big(\frac{11}7\big) = \big(\frac 47\big) = 1$, alors que $7$ n'est pas un carré modulo $11$, dont les carrés non nuls sont $1, 3, 4, 5, 9$ : les deux symboles sont bien opposés.
      - |
        Avec la multiplicativité et les deux lois complémentaires ({{rq-legendre|Symbole de Legendre}}, (iv), et {{rq-lemme-gauss|Lemme de Gauss}}, (ii)), la loi calcule tout symbole sans chercher de racine carrée. Pour les nombres premiers $2017$ et $1\,000\,003$, on a $2017 \equiv 1 \pmod 4$ et $1\,000\,003 \equiv 1588 = 4 \cdot 397 \pmod{2017}$, où $397$ est premier ; d'où
        $$\Big(\frac{2017}{1\,000\,003}\Big) = \Big(\frac{1\,000\,003}{2017}\Big) = \Big(\frac{397}{2017}\Big),$$
        le facteur $4$, qui est un carré, ne changeant pas le symbole.

        Comme $397 \equiv 1 \pmod 4$ et $2017 = 5 \cdot 397 + 32$, ce dernier symbole vaut $\big(\frac{2017}{397}\big) = \big(\frac 2{397}\big)^5 = \big(\frac 2{397}\big) = -1$, puisque $397 \equiv 5 \pmod 8$. Le critère d'Euler confirme le résultat : le calcul de $2017^{500\,001}$ modulo $1\,000\,003$, fait à la machine, donne $1\,000\,002 \equiv -1$. L'entier $2017$ n'est donc pas un carré modulo $1\,000\,003$.
      - |
        La loi dit que $\big(\frac qp\big)$, vu comme fonction de $p$, ne dépend que de la classe de $p$ modulo $4q$, alors que rien dans la définition ne le laissait prévoir : $\big(\frac qp\big) = (-1)^{PQ}\big(\frac pq\big)$, où $(-1)^P$ ne dépend que de $p$ modulo $4$, et $\big(\frac pq\big)$ que de $p$ modulo $q$. Le nœud {{rq-applications|Applications}} en donnera les exemples $q = 3$ et $q = 5$.
      - |
        Le **symbole de Jacobi** prolonge celui de Legendre à un module $n \geqslant 1$ impair quelconque, $n = p_1 \cdots p_r$ étant un produit de nombres premiers non nécessairement distincts, par $\big(\frac an\big) = \prod_i \big(\frac a{p_i}\big)$. Il vérifie encore les deux lois complémentaires, et la loi de réciprocité pour deux entiers $m$ et $n$ impairs, positifs et premiers entre eux, ce qui permet de calculer un symbole de Legendre sans factoriser les entiers rencontrés. Ce prolongement est admis ici ; il se déduit du cas premier par multiplicativité, la seule difficulté étant la congruence $\frac{ab - 1}2 \equiv \frac{a - 1}2 + \frac{b - 1}2 \pmod 2$ pour $a$ et $b$ impairs, et son analogue pour $\frac{a^2b^2 - 1}8$.

        L'erreur la plus répandue est d'en conclure que $\big(\frac an\big) = 1$ fait de $a$ un carré modulo $n$. Pour $n = 15$, on a $\big(\frac 2{15}\big) = \big(\frac 23\big)\big(\frac 25\big) = (-1)(-1) = 1$, alors que les carrés modulo $15$ sont $0, 1, 4, 6, 9, 10$.
      - |
        Euler a formulé la loi sans la démontrer, et Legendre en a donné en 1785, dans ses *Recherches d'analyse indéterminée* (parues en 1788), une démonstration incomplète ; il introduit son symbole en 1798, dans l'*Essai sur la théorie des nombres*. Gauss en trouve la première démonstration complète le 8 avril 1796, par récurrence, et la publie dans la section IV des *Disquisitiones arithmeticae* (1801, art. 135 à 145), où il l'appelle le théorème fondamental.

        La démonstration ci-dessus, par les points d'un réseau, est celle d'Eisenstein, *Geometrischer Beweis des Fundamentaltheorems für die quadratischen Reste* (J. reine angew. Math. 28, 1844, p. 246-248), qui simplifie la troisième démonstration de Gauss.

  - id: rq-sommes-gauss
    etiquette: Sommes de Gauss
    nature: théorème
    titre: Seconde démonstration, par les sommes de Gauss
    texte: |
      Soient $p$ et $q$ deux nombres premiers impairs distincts, $P = \frac{p-1}2$ et $Q = \frac{q-1}2$. La classe de $p$ est inversible modulo $q$ ; soit $n$ son ordre dans le groupe $(\lex{anneau-zn}{\mathbb Z/q\mathbb Z})^\times$, de sorte que $p^n \equiv 1 \pmod q$ ({{gf-cycliques|Groupes cycliques}}, (i)).

      Soit $F = \lex{corps-fini}{\mathbb F_{p^n}}$ le corps à $p^n$ éléments ({{gs-corps-finis|Corps finis}}, (iii)), qui contient $\mathbb F_p$. Son groupe multiplicatif est cyclique d'ordre $p^n - 1$ (même nœud, (ii)), multiple de $q$ ; il a donc un sous-groupe cyclique d'ordre $q$ ({{gf-cycliques|Groupes cycliques}}, (iii)), dont on fixe un générateur $\zeta$, élément d'ordre $q$.

      Comme $\zeta^q = 1$, la puissance $\zeta^a$ ne dépend que de la classe de $a$ modulo $q$. Les entiers sont vus dans $F$ par le morphisme $\mathbb Z \to F$, de noyau $p\lex{ensemble-entiers-relatifs}{\mathbb Z}$, $F$ étant de caractéristique $p$ ({{gs-corps-finis|Corps finis}}, (i)). La [[somme-gauss|somme de Gauss]] est
      $$\tau = \sum_{a=1}^{q-1} \Big(\frac aq\Big)\zeta^a \in F,$$
      et l'on pose $q^* = (-1)^Q q$.
    enonce: |
      (i) $\tau^2 = q^*$ dans $F$ ; en particulier $\tau \neq 0$.

      (ii) $\tau^p = \big(\frac pq\big)\tau$.

      (iii) Par conséquent $\big(\frac pq\big) = \big(\frac{q^*}p\big)$, ce qui équivaut à la loi de réciprocité quadratique ({{rq-reciprocite|Réciprocité quadratique}}).
    preuve: |
      *Deux sommes nulles.* Pour $c \in \mathbb Z$ non divisible par $q$, l'élément $\eta = \zeta^c$ est différent de $1$, puisque $\zeta$ est d'ordre $q$ ({{gf-cycliques|Groupes cycliques}}, (i)). Comme $(\eta - 1)\sum_{a=0}^{q-1}\eta^a = \eta^q - 1 = 0$ et que $F$ est un corps, $\sum_{a=0}^{q-1}\zeta^{ac} = 0$ ; si $q$ divise $c$, cette somme vaut $q$.

      Par ailleurs, $\sum_{a=1}^{q-1}\big(\frac aq\big) = 0$, puisqu'il y a autant de résidus que de non-résidus parmi $1, \dots, q - 1$ ({{rq-legendre|Symbole de Legendre}}, (i)).

      (i) Par multiplicativité du symbole (même nœud, (iii)),
      $$\tau^2 = \sum_{a=1}^{q-1}\sum_{b=1}^{q-1}\Big(\frac{ab}q\Big)\zeta^{a+b}.$$

      Pour $a$ fixé, la multiplication par la classe inversible de $a$ permute les classes non nulles modulo $q$ : quand $b$ parcourt $1, \dots, q - 1$, l'unique $c \in \{1, \dots, q - 1\}$ tel que $b \equiv ac$ les parcourt aussi. Comme $\big(\frac{ab}q\big) = \big(\frac aq\big)^2\big(\frac cq\big) = \big(\frac cq\big)$,
      $$\tau^2 = \sum_{c=1}^{q-1}\Big(\frac cq\Big)\sum_{a=1}^{q-1}\zeta^{a(1+c)}.$$

      La somme intérieure vaut $q - 1$ pour $c = q - 1$, et $-1$ sinon, par le calcul préliminaire, dont on retire le terme $a = 0$. Ainsi
      $$\begin{aligned} \tau^2 &= \Big(\frac{-1}q\Big)(q - 1) - \sum_{c=1}^{q-2}\Big(\frac cq\Big) \\ &= \Big(\frac{-1}q\Big)q, \end{aligned}$$
      la somme de tous les $\big(\frac cq\big)$ étant nulle. Par la première loi complémentaire (même nœud, (iv)), $\big(\frac{-1}q\big) = (-1)^Q$, et $\tau^2 = q^*$. L'entier $q^*$ n'est pas divisible par $p$, donc n'est pas nul dans $F$, et $\tau \neq 0$.

      (ii) Le Frobenius $x \mapsto x^p$ est un morphisme d'anneaux de $F$, qui est de caractéristique $p$ ({{pol-binome|Binôme de Newton}}, (iv)). Comme $\big(\frac aq\big)^p = \big(\frac aq\big)$, le symbole valant $\pm 1$ et $p$ étant impair,
      $$\tau^p = \sum_{a=1}^{q-1}\Big(\frac aq\Big)\zeta^{ap} = \Big(\frac pq\Big)\sum_{a=1}^{q-1}\Big(\frac{ap}q\Big)\zeta^{ap},$$
      où l'on a écrit $\big(\frac aq\big) = \big(\frac pq\big)\big(\frac{ap}q\big)$, puisque $\big(\frac pq\big)^2 = 1$. Quand $a$ parcourt $1, \dots, q - 1$, la classe de $ap$ parcourt les classes non nulles modulo $q$, et chaque terme ne dépend que de cette classe : la dernière somme est $\tau$.

      (iii) Par (i), $\tau^p = \tau\,(\tau^2)^P = \tau\,(q^*)^P$, et le critère d'Euler dans $\mathbb F_p \subset F$ (même nœud, (ii)) donne $(q^*)^P = \big(\frac{q^*}p\big)$. Avec (ii), $\big(\frac pq\big)\tau = \big(\frac{q^*}p\big)\tau$, et, comme $\tau \neq 0$, les deux symboles sont égaux dans $F$ ; valant $\pm 1$, avec $1 \neq -1$ dans $F$, ils sont égaux.

      Enfin, par multiplicativité et par la première loi complémentaire, $\big(\frac{q^*}p\big) = \big(\frac{-1}p\big)^Q\big(\frac qp\big) = (-1)^{PQ}\big(\frac qp\big)$, ce qui est la loi de réciprocité.
    remarques:
      - |
        Pour $q = 5$ et $p = 11$, on a $11 \equiv 1 \pmod 5$, donc $n = 1$ et $F = \mathbb F_{11}$. L'élément $\zeta = 3$ est d'ordre $5$, puisque $3^5 = 243 = 22 \cdot 11 + 1$, et ses puissances $\zeta, \zeta^2, \zeta^3, \zeta^4$ sont $3, 9, 5, 4$. Les résidus modulo $5$ étant $1$ et $4$, il vient $\tau = 3 - 9 - 5 + 4 = -7 \equiv 4$.

        On vérifie $\tau^2 = 16 \equiv 5 = q^*$, puis $\tau^{11} = \tau \cdot 5^5 \equiv \tau$, puisque $5^5 = 3125 = 284 \cdot 11 + 1$ : on retrouve $\big(\frac{11}5\big) = 1$, ce qui est clair directement, $11 \equiv 1^2 \pmod 5$.
      - |
        L'erreur la plus répandue est de chercher $\zeta$ dans $\mathbb F_p$ lui-même. Cela n'est possible que si $q$ divise $p - 1$ ; pour $p = 3$ et $q = 7$, l'ordre de $3$ modulo $7$ est $6$, et il faut aller jusqu'au corps $\mathbb F_{3^6}$, à $729$ éléments. C'est la raison pour laquelle cette démonstration se place après la théorie des corps finis, alors que celle d'Eisenstein n'emploie que $\mathbb Z/p\mathbb Z$.
      - |
        Le même calcul vaut dans tout corps de caractéristique différente de $q$ qui contient un élément d'ordre $q$, par exemple dans $\lex{ensemble-complexes}{\mathbb C}$ avec $\zeta = e^{2i\pi/q}$, que l'analyse complexe construira : on y trouve $\tau^2 = q^*$, si bien que $\sqrt{q^*}$ appartient au corps engendré par les racines $q$-ièmes de l'unité. C'est le premier exemple du lien entre corps quadratiques et corps cyclotomiques.

  - id: rq-applications
    etiquette: Applications
    nature: proposition
    titre: Premiers dans des progressions, caractères de 3 et de 5
    enonce: |
      (i) Il existe une infinité de nombres premiers congrus à $1$ modulo $4$.

      (ii) Il existe une infinité de nombres premiers congrus à $1$ modulo $8$.

      (iii) Pour un nombre premier $p \geqslant 5$, $\big(\frac 3p\big) = 1$ si et seulement si $p \equiv \pm 1 \pmod{12}$.

      (iv) Pour un nombre premier impair $p \neq 5$, $\big(\frac 5p\big) = 1$ si et seulement si $p \equiv \pm 1 \pmod 5$.
    preuve: |
      (i) Soit $p_1, \dots, p_k$ des nombres premiers en nombre fini, et $x = 2p_1 \cdots p_k$. L'entier $N = x^2 + 1 \geqslant 2$ a un facteur premier $\ell$ ({{z-premiers|Nombres premiers}}, (ii)). Il est impair, puisque $N$ l'est, et différent de chaque $p_i$, qui ne divise pas $N - x^2 = 1$.

      Comme $x^2 \equiv -1 \pmod \ell$, l'entier $-1$ est un résidu quadratique modulo $\ell$, et $\ell \equiv 1 \pmod 4$ ({{rq-legendre|Symbole de Legendre}}, (iv)). Aucun ensemble fini de nombres premiers ne contient donc tous ceux qui sont congrus à $1$ modulo $4$.

      (ii) Avec les mêmes notations, soit $\ell$ un facteur premier de $N = x^4 + 1$ ; il est impair et différent des $p_i$. Dans $\mathbb F_\ell^\times$, la classe $\bar x$ vérifie $\bar x^4 = -1 \neq 1$, puisque $\ell$ est impair, et $\bar x^8 = 1$.

      Son ordre divise $8$ sans diviser $4$ ({{gf-cycliques|Groupes cycliques}}, (i)) : c'est $8$. Cet ordre divise l'ordre $\ell - 1$ du groupe, et $\ell \equiv 1 \pmod 8$.

      (iii) Par la loi de réciprocité ({{rq-reciprocite|Réciprocité quadratique}}), $\big(\frac 3p\big) = (-1)^{\frac{p-1}2}\big(\frac p3\big)$, et $\big(\frac p3\big) = 1$ si et seulement si $p \equiv 1 \pmod 3$, le seul carré non nul modulo $3$ étant $1$.

      Si $p \equiv 1 \pmod 4$, la condition est $p \equiv 1 \pmod 3$ ; si $p \equiv 3 \pmod 4$, c'est $p \equiv 2 \pmod 3$. Dans le premier cas, $3$ et $4$, premiers entre eux, divisent $p - 1$, donc $12$ le divise par le lemme de Gauss ({{z-bezout|PGCD, Bézout}}, (iii)) ; dans le second, ils divisent $p + 1$, et $p \equiv -1 \pmod{12}$.

      Réciproquement, $p \equiv \pm 1 \pmod{12}$ entraîne $p \equiv \pm 1$ modulo $4$ et modulo $3$, avec le même signe, ce qui est l'un des deux cas.

      (iv) Comme $5 \equiv 1 \pmod 4$, la loi donne $\big(\frac 5p\big) = \big(\frac p5\big)$, et les carrés non nuls modulo $5$ sont $1$ et $4 \equiv -1$.
    remarques:
      - |
        Pour $p_1 = 3$ et $p_2 = 5$, on obtient $N = 30^2 + 1 = 901 = 17 \cdot 53$, et les deux facteurs sont bien congrus à $1$ modulo $4$. De même, $10^4 + 1 = 10\,001 = 73 \cdot 137$, et $73 = 9 \cdot 8 + 1$, $137 = 17 \cdot 8 + 1$. Avec le théorème des deux carrés ({{an-gauss|Deux carrés}}), le point (i) dit aussi qu'une infinité de nombres premiers sont sommes de deux carrés : $17 = 1 + 16$, $53 = 4 + 49$.
      - |
        La démonstration de (ii) n'emploie pas la réciprocité, seulement l'ordre d'un élément ; celle de (i) peut se lire de même, $\bar x$ étant alors d'ordre $4$. Le même argument, appliqué au polynôme cyclotomique $\Phi_m$, qui n'est pas défini ici, donne une infinité de premiers congrus à $1$ modulo $m$ pour tout $m$, ce qui n'est pas démontré ici.
      - |
        Le théorème de Dirichlet (1837) affirme qu'il y a une infinité de nombres premiers congrus à $a$ modulo $m$ dès que $a \wedge m = 1$. Les arguments algébriques de ce nœud n'en atteignent que des cas particuliers ; le cas général demande les méthodes analytiques, et il est admis ici.
      - |
        Ainsi $3$ est un carré modulo $11$ et modulo $13$, puisque $5^2 = 25 \equiv 3 \pmod{11}$ et $4^2 = 16 \equiv 3 \pmod{13}$, conformément à $11 \equiv -1$ et $13 \equiv 1 \pmod{12}$ ; il n'en est pas un modulo $7$, dont les carrés non nuls sont $1, 2, 4$, et $7 \not\equiv \pm 1 \pmod{12}$.

        Le caractère « $3$ est un carré modulo $p$ » dépend donc de $p$ modulo $12$, et non modulo $3$ : c'est ce que la loi de réciprocité rend visible. Les énoncés (iii) et (iv) ont été vérifiés, par le critère d'Euler, pour tous les nombres premiers inférieurs à $3000$.

