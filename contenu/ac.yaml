# Niveau 1 : structure interne du nœud « Algèbre commutative » (créé le 29 oct. 2026).
# Divisibilité, anneaux factoriels, noethériens et principaux, lemme de Gauss pour A[X], théorème de
# la base de Hilbert, lemme chinois, localisation, anneaux locaux et lemme de Nakayama. Les anneaux
# sont commutatifs. Le choix dépendant (⋆) intervient dans la condition maximale des anneaux
# noethériens et dans l'existence des factorisations dans un anneau principal quelconque.

graphe: ac
titre: Algèbre commutative
conteneur: ac

entrees:
  alg: [ac-divisibilite, ac-noetheriens, ac-chinois, ac-localisation]
  z: [ac-divisibilite]
  alglin: [ac-nakayama]

noeuds:
  - id: ac-divisibilite
    etiquette: Divisibilité
    nature: proposition
    titre: Divisibilité dans un anneau intègre
    texte: |
      Dans ce graphe, les anneaux sont commutatifs. Soit $A$ un [[anneau-integre|anneau intègre]]. On dit que $a$ **divise** $b$, et l'on note $a \mid b$, s'il existe $c \in A$ tel que $b = ac$, c'est-à-dire si $bA \subset aA$ ({{a-ideal|Idéal}}). Deux éléments sont **associés** si chacun divise l'autre. Un élément $p$ est [[element-irreductible|irréductible]] s'il est non nul, non inversible, et si $p = ab$ entraîne que $a$ ou $b$ est inversible. Il est [[element-premier|premier]] s'il est non nul, non inversible, et si $p \mid ab$ entraîne $p \mid a$ ou $p \mid b$.
    enonce: |
      (i) Deux éléments $a$ et $b$ sont associés si et seulement si $aA = bA$, si et seulement si $b = ua$ pour un $u \in A^\times$.

      (ii) Un élément non nul $p$ est premier si et seulement si l'idéal $pA$ est [[ideal-premier|premier]].

      (iii) Tout élément premier est irréductible.
    preuve: |
      (i) La première équivalence est la définition, puisque $a \mid b$ s'écrit $bA \subset aA$. Si $b = ua$ avec $u$ inversible, alors $a = u^{-1}b$, et chacun divise l'autre. Réciproquement, écrivons $b = ac$ et $a = bd$. Si $a = 0$, alors $b = 0 = 1 \cdot a$. Sinon $a = acd$, soit $a(1 - cd) = 0$, et l'intégrité donne $cd = 1$ : $c$ est inversible.

      (ii) L'idéal $pA$ est différent de $A$ si et seulement s'il ne contient pas $1$, c'est-à-dire si $p$ n'est pas inversible ({{a-ideal|Idéal}}, (iv)). L'appartenance $ab \in pA$ s'écrit $p \mid ab$, et $a \in pA$ s'écrit $p \mid a$. Pour $p$ non nul, les deux définitions disent donc la même chose.

      (iii) Soit $p$ premier et $p = ab$. Alors $p \mid ab$ ; disons $p \mid a$, et $a = pc$. Il vient $p = pcb$, donc $p(1 - cb) = 0$, et $cb = 1$ puisque $p \neq 0$ : $b$ est inversible. Le cas $p \mid b$ est symétrique.
    remarques:
      - |
        La réciproque de (iii) est fausse, et l'exemple le plus simple se construit dans les polynômes. Soit $K$ un [[corps]] et $A$ l'ensemble des polynômes de $\lex{anneau-polynomes}{K[X]}$ dont le coefficient de $X$ est nul. C'est un sous-anneau, car le coefficient de $X$ dans un produit $PQ$ vaut $a_0b_1 + a_1b_0 = 0$ ; il est intègre comme $K[X]$, et ses inversibles sont les constantes non nulles, puisque $K[X]^\times = K^\times$ ({{pol-anneau|Anneau A[X]}}, (iii)). Un élément non nul et non inversible de $A$ est donc de degré au moins $2$. Par suite $X^2$ et $X^3$ sont irréductibles dans $A$ : une factorisation en deux non-inversibles demanderait deux degrés au moins égaux à $2$, de somme $2$ ou $3$. Pourtant
        $$X^6 = X^2 \cdot X^2 \cdot X^2 = X^3 \cdot X^3,$$
        deux écritures en irréductibles, et $X^2$ n'est pas premier : il divise $X^3 \cdot X^3 = X^2 \cdot X^4$, avec $X^4 \in A$, mais ne divise pas $X^3$, le seul quotient possible dans $K[X]$ étant $X \notin A$.

        ```schema ac-divisibilite
        Les exposants des monômes de $A$ sont les entiers $0, 2, 3, 4, \dots$ : le trou en $1$, en gris, est ce qui empêche de couper $X^2$ et $X^3$. L'exposant $6$ s'obtient comme $2 + 2 + 2$, en bleu, et comme $3 + 3$, en rouge : deux factorisations de $X^6$ en irréductibles, de longueurs différentes.
        ```
      - |
        Le point (ii) prépare ce que la {{geoalg|géométrie algébrique}} appellera le spectre : les éléments premiers sont les générateurs des idéaux premiers principaux non nuls. C'est le même phénomène que la théorie algébrique des nombres rencontrera dans $\mathbb Z[\sqrt{-5}]$, où $2$ est irréductible sans être premier.

  - id: ac-factoriels
    etiquette: Anneaux factoriels
    nature: théorème
    titre: Anneaux factoriels et PGCD
    texte: |
      Un anneau intègre $A$ est [[anneau-factoriel|factoriel]] si tout élément non nul $a$ s'écrit $a = u\,p_1 \cdots p_r$, avec $u \in A^\times$, $r \in \lex{ensemble-entiers-naturels}{\mathbb N}$ et $p_1, \dots, p_r$ [[element-irreductible|irréductibles]], et si cette écriture est unique au sens suivant : si $u\,p_1 \cdots p_r = v\,q_1 \cdots q_s$ avec $u, v$ inversibles et des $p_i$, $q_j$ irréductibles, alors $r = s$ et il existe une permutation $\sigma$ de $\{1, \dots, r\}$ telle que $q_{\sigma(i)}$ soit associé à $p_i$ pour tout $i$. Un élément non nul est inversible exactement quand $r = 0$.

      Dans un anneau intègre, un **PGCD** d'une famille finie $(a_1, \dots, a_n)$ est un diviseur commun $d$ des $a_i$ tel que tout diviseur commun des $a_i$ divise $d$.
    enonce: |
      (i) Soit $A$ un anneau intègre dans lequel tout élément non nul s'écrit $u\,p_1 \cdots p_r$ comme ci-dessus. Alors $A$ est factoriel si et seulement si tout élément irréductible est [[element-premier|premier]].

      (ii) Dans un anneau factoriel, toute famille finie d'éléments non tous nuls a un PGCD, unique à association près.

      (iii) Dans un anneau intègre, si $d$ est un PGCD de $(b_1, \dots, b_n)$ et si $a \neq 0$, alors $ad$ est un PGCD de $(ab_1, \dots, ab_n)$, dès que ce dernier existe.
    preuve: |
      (i) *Si les irréductibles sont premiers.* Montrons, par récurrence sur $r$, que $u\,p_1 \cdots p_r = v\,q_1 \cdots q_s$ entraîne $r = s$ et l'appariement annoncé. Si $r = 0$, l'élément $v\,q_1 \cdots q_s = u$ est inversible ; si l'on avait $s \geqslant 1$, $q_1$ diviserait un inversible, donc serait inversible, ce qui est exclu : $s = 0$. Si $r \geqslant 1$, $p_r$ est premier et divise $v\,q_1 \cdots q_s$ ; par récurrence sur le nombre de facteurs, il divise l'un d'eux, qui n'est pas l'inversible $v$, soit $q_j$. Écrivons $q_j = p_rc$ ; comme $q_j$ est irréductible et $p_r$ non inversible, $c$ est inversible : $q_j$ et $p_r$ sont associés ({{ac-divisibilite|Divisibilité}}, (i)). En simplifiant par $p_r$, ce que permet l'intégrité, $u\,p_1 \cdots p_{r-1} = (vc)\prod_{k \neq j} q_k$, et l'hypothèse de récurrence conclut.

      *Si $A$ est factoriel.* Soit $p$ irréductible, divisant $ab$ : $ab = pc$. Si $a = 0$, $p \mid a$ ; de même si $b = 0$. Sinon $c \neq 0$, et l'on écrit $a$, $b$ et $c$ comme produits d'un inversible et d'irréductibles. Les égalités $ab = pc$ donnent deux écritures du même élément ; par unicité, $p$ est associé à l'un des facteurs irréductibles de $a$ ou de $b$, donc divise $a$ ou $b$.

      (ii) Deux PGCD se divisent l'un l'autre, donc sont associés. Pour l'existence, il suffit de traiter deux éléments : si $d'$ est un PGCD de $(a_1, \dots, a_{n-1})$, un PGCD de $(d', a_n)$ en est un de $(a_1, \dots, a_n)$, puisque les diviseurs communs des $a_i$ sont ceux de $d'$ et de $a_n$. Si $a = 0$, $b$ est un PGCD de $(a, b)$. Pour $a \neq 0$, notons $\ell(a)$ le nombre $r$ de facteurs irréductibles de $a$, bien défini par unicité, et raisonnons par récurrence sur $\ell(a)$. Si $\ell(a) = 0$, $a$ est inversible et $1$ convient. Sinon, soit $p$ un facteur irréductible de $a$, $a = pa'$ avec $\ell(a') = \ell(a) - 1$. On utilise le fait suivant : si $c \mid px$ et $p \nmid c$, alors $c \mid x$. En effet, $px = ce$, et $p$, premier par (i), divise $c$ ou $e$ ; donc $e = pe'$, et $x = ce'$ après simplification par $p$.

      Si $p \mid b$, écrivons $b = pb'$, et soit $d'$ un PGCD de $(a', b')$, qui existe par hypothèse de récurrence ; montrons que $pd'$ est un PGCD de $(a, b)$. Il divise $a$ et $b$. Soit $c$ un diviseur commun. Si $p \mid c$, $c = pc'$, et $c'$ divise $a'$ et $b'$, après simplification par $p$, donc $d'$, et $c \mid pd'$. Sinon, le fait ci-dessus donne $c \mid a'$ et $c \mid b'$, donc $c \mid d' \mid pd'$.

      Si $p \nmid b$, soit $d'$ un PGCD de $(a', b)$ ; il divise $a$ et $b$. Un diviseur commun $c$ de $a$ et $b$ n'est pas multiple de $p$, sinon $p \mid b$ ; il divise donc $a'$, par le fait ci-dessus, puis $d'$.

      (iii) L'élément $ad$ divise chaque $ab_i$. Soit $e$ un PGCD des $ab_i$ ; alors $ad \mid e$, et l'on écrit $e = adf$. Comme $e \mid ab_i$, on a $adf \mid ab_i$, puis $df \mid b_i$ après simplification par $a$, pour tout $i$ ; donc $df \mid d$, soit $d = dfg$. Si $d \neq 0$, $fg = 1$ et $f$ est inversible, de sorte que $ad$ est associé à $e$, donc est un PGCD. Si $d = 0$, tous les $b_i$ sont nuls, et $ad = 0$ est un PGCD des $ab_i = 0$.
    remarques:
      - |
        Les anneaux $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ et $\lex{anneau-polynomes}{K[X]}$, pour un corps $K$, sont factoriels : c'est le théorème fondamental de l'arithmétique ({{z-premiers|Nombres premiers}}) et la factorisation des polynômes ({{pol-irreductibles|Irréductibles}}), les inversibles étant $\pm 1$ et les constantes non nulles. L'anneau du nœud {{ac-divisibilite|Divisibilité}} n'est pas factoriel, puisqu'il a un irréductible non premier, ce que (i) interdit.
      - |
        L'erreur la plus répandue est de croire qu'un PGCD s'écrit toujours comme combinaison $au + bv$, comme dans $\mathbb Z$. C'est faux dans un anneau factoriel quelconque : dans $K[X, Y]$, qui sera factoriel ({{ac-gauss|Gauss}}), $1$ est un PGCD de $X$ et $Y$, mais $XU + YV$ s'annule toujours en $(0, 0)$ et ne vaut donc jamais $1$. La relation de Bézout n'est pas une conséquence de la factorialité ; parmi les anneaux factoriels, ceux où tout PGCD s'écrit $au + bv$ sont exactement les principaux, ce qui est admis ici.

  - id: ac-noetheriens
    etiquette: Anneaux noethériens
    nature: théorème
    titre: Anneaux noethériens
    choix: |
      Le point (ii), réciproque de (i), et la condition maximale qu'il énonce utilisent l'axiome du choix dépendant, pour construire une suite strictement croissante d'idéaux, chaque terme étant choisi en fonction du précédent. Les points (i) et (iii) n'utilisent aucun choix : on n'y manipule que des familles finies de générateurs.
    texte: |
      Un idéal $I$ de $A$ est **de type fini** s'il est engendré par une partie finie, c'est-à-dire s'il s'écrit $I = a_1A + \cdots + a_nA$ ({{a-ideal|Idéal}}, (ii) et (iii)). L'anneau $A$ est [[anneau-noetherien|noethérien]] si tous ses idéaux sont de type fini.
    enonce: |
      (i) Si $A$ est noethérien, toute suite croissante d'idéaux $I_0 \subset I_1 \subset \cdots$ est stationnaire : il existe $N$ tel que $I_n = I_N$ pour tout $n \geqslant N$.

      (ii) ⋆ Si toute suite croissante d'idéaux de $A$ est stationnaire, tout ensemble non vide d'idéaux de $A$ a un élément maximal pour l'inclusion, et $A$ est noethérien.

      (iii) Un [[anneau-principal|anneau principal]], en particulier un [[corps]], $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ ou $\lex{anneau-polynomes}{K[X]}$ pour un corps $K$, est noethérien. Si $A$ est noethérien et $I$ un idéal, l'anneau $A/I$ est noethérien.
    preuve: |
      (i) La réunion $J$ des $I_n$ est un idéal : deux de ses éléments appartiennent à un même $I_n$, la suite étant croissante, et leur différence aussi, ainsi que leurs multiples. Écrivons $J = a_1A + \cdots + a_kA$, et $a_i \in I_{n_i}$. Pour $N = \max_i n_i$, tous les $a_i$ sont dans $I_N$, donc $J \subset I_N \subset I_n \subset J$ pour $n \geqslant N$.

      (ii) Soit $\mathcal E$ un ensemble non vide d'idéaux sans élément maximal. Pour tout $I \in \mathcal E$, l'ensemble des $J \in \mathcal E$ tels que $I \subsetneq J$ est non vide ; le choix dépendant fournit une suite $I_0 \subsetneq I_1 \subsetneq \cdots$ d'éléments de $\mathcal E$, qui n'est pas stationnaire. Pour la seconde assertion, soit $I$ un idéal et $\mathcal E$ l'ensemble des idéaux de type fini contenus dans $I$, qui contient $\{0\}$. Soit $J$ un élément maximal. Si l'on avait $J \neq I$, pour $a \in I \setminus J$, l'idéal $J + aA$ serait de type fini, contenu dans $I$, et contiendrait strictement $J$ : contradiction. Donc $I = J$ est de type fini.

      (iii) Dans un anneau principal, tout idéal est engendré par un élément ; c'est le cas d'un corps, dont les seuls idéaux sont $\{0\}$ et $K$ ({{a-corps|Corps}}), de $\mathbb Z$ ({{z-ideaux|Idéaux de ℤ}}) et de $K[X]$ ({{pol-principal|K[X] principal}}). Soit $\pi : A \to A/I$ la surjection canonique et $\bar J$ un idéal de $A/I$. L'image réciproque $\pi^{-1}(\bar J)$ est un idéal de $A$, comme on le vérifie sur les définitions ; elle s'écrit $a_1A + \cdots + a_kA$, et, $\pi$ étant surjective, $\bar J = \pi(\pi^{-1}(\bar J)) = \pi(a_1)(A/I) + \cdots + \pi(a_k)(A/I)$.
    remarques:
      - |
        Un sous-anneau d'un anneau noethérien ne l'est pas toujours. Soit $F$ le corps des fractions de $\mathbb Z$ ({{a-fractions|Corps des fractions}}) et $A$ l'ensemble des polynômes $P \in F[X]$ tels que $P(0) \in \mathbb Z$, sous-anneau de l'anneau principal $F[X]$. Les idéaux $I_n = \frac{X}{2^n}A$ forment une suite croissante, puisque $\frac X{2^n} = 2 \cdot \frac X{2^{n+1}}$, et elle n'est pas stationnaire : si l'on avait $\frac X{2^{n+1}} = \frac X{2^n}P$ avec $P \in A$, il faudrait $P = \frac12$, dont la valeur en $0$ n'est pas entière. Par (i), $A$ n'est pas noethérien.
      - |
        Le choix dépendant de (ii) n'est pas un artifice de la preuve : sans lui, on ne sait pas, en général, passer de la condition sur les suites à la finitude des idéaux. Dans les anneaux usuels, $\mathbb Z$ ou $K[X]$, on évite le problème en montrant directement que les idéaux sont de type fini, ce que fait (iii).

  - id: ac-principaux
    etiquette: Principal ⇒ factoriel
    nature: théorème
    titre: Un anneau principal est factoriel
    choix: |
      Le point (ii), et donc (iii), utilise la condition maximale de {{ac-noetheriens|Anneaux noethériens}}, (ii), qui repose sur le choix dépendant. Pour $\mathbb Z$ et $K[X]$, la valeur absolue et le degré permettent de s'en passer, comme aux nœuds {{z-premiers|Nombres premiers}} et {{pol-irreductibles|Irréductibles}}.
    enonce: |
      (i) Dans un [[anneau-principal|anneau principal]] $A$, pour $p \neq 0$, les conditions suivantes sont équivalentes : $p$ est irréductible ; $pA$ est [[ideal-maximal|maximal]] ; $pA$ est premier. En particulier, tout idéal premier non nul est maximal.

      (ii) ⋆ Dans un anneau noethérien intègre, tout élément non nul s'écrit $u\,p_1 \cdots p_r$ avec $u$ inversible et $p_i$ irréductibles.

      (iii) ⋆ Tout anneau principal est [[anneau-factoriel|factoriel]].
    preuve: |
      (i) Soit $p$ irréductible ; $pA \neq A$ puisque $p$ n'est pas inversible. Si $J$ est un idéal tel que $pA \subsetneq J$, écrivons $J = aA$ ; alors $p = ab$, et $a$ n'est pas associé à $p$, sinon $J = pA$. L'irréductibilité donne $a$ ou $b$ inversible ; si $b$ l'était, $a$ serait associé à $p$ ; donc $a$ est inversible et $J = A$ : $pA$ est maximal. Un idéal maximal est premier ({{a-premier-maximal|Idéaux premiers, maximaux}}, (iii)). Si $pA$ est premier, $p$ est premier, donc irréductible ({{ac-divisibilite|Divisibilité}}, (ii) et (iii)). Enfin un idéal premier non nul s'écrit $pA$ avec $p \neq 0$, et il est maximal.

      (ii) Soit $\mathcal E$ l'ensemble des idéaux $aA$ où $a$ est non nul et n'admet pas d'écriture $u\,p_1 \cdots p_r$. Supposons-le non vide ; par la condition maximale ({{ac-noetheriens|Anneaux noethériens}}, (ii)), il a un élément maximal $aA$. L'élément $a$ n'est pas inversible, sans quoi l'écriture $a = a$, avec $r = 0$, conviendrait, ni irréductible, sans quoi $a = 1 \cdot a$ conviendrait ; donc $a = bc$ avec $b$ et $c$ non inversibles, tous deux non nuls. On a $aA \subsetneq bA$ : l'inclusion est claire, et l'égalité donnerait $b = ad = bcd$, puis $cd = 1$ par intégrité, alors que $c$ n'est pas inversible. De même $aA \subsetneq cA$. Par maximalité, $bA$ et $cA$ ne sont pas dans $\mathcal E$ : $b$ et $c$ s'écrivent comme annoncé, et leur produit $a$ aussi, ce qui contredit $aA \in \mathcal E$.

      (iii) Un anneau principal est noethérien ({{ac-noetheriens|Anneaux noethériens}}, (iii)), et (ii) fournit les écritures. Par (i), tout irréductible $p$ engendre un idéal premier, donc est premier ({{ac-divisibilite|Divisibilité}}, (ii)), et l'unicité découle de {{ac-factoriels|Anneaux factoriels}}, (i).
    remarques:
      - |
        La réciproque est fausse : $\lex{ensemble-entiers-relatifs}{\mathbb Z}[X]$ est factoriel, comme le montrera le nœud {{ac-gauss|Gauss}}, sans être principal, puisque l'idéal engendré par $2$ et $X$ ne l'est pas ({{pol-principal|K[X] principal}}). De même $K[X, Y]$, où l'idéal engendré par $X$ et $Y$ n'est pas principal.
      - |
        Le point (i) dit que, parmi les idéaux premiers d'un anneau principal qui n'est pas un corps, ce que la {{geoalg|géométrie algébrique}} appellera son spectre, il n'y a que deux étages : le point $\{0\}$, contenu dans tous les autres idéaux premiers, et les idéaux maximaux $pA$. Pour $\mathbb Z$, ce sont les $p\mathbb Z$, $p$ premier ; pour $\mathbb C[X]$, ce sont les $(X - a)$, l'un par point du plan complexe. C'est ce que la géométrie algébrique appellera un schéma de dimension $1$, une courbe arithmétique pour $\mathbb Z$.

  - id: ac-contenu
    etiquette: Contenu, lemme de Gauss
    nature: lemme
    titre: Contenu et lemme de Gauss sur un anneau factoriel
    texte: |
      Soit $A$ un anneau [[anneau-factoriel|factoriel]] et $K$ son [[corps-fractions|corps des fractions]] ({{a-fractions|Corps des fractions}}), dans lequel on identifie $a \in A$ à $a/1$, de sorte que $\lex{anneau-polynomes}{A[X]} \subset K[X]$. Le **contenu** $c(P)$ d'un polynôme non nul $P \in A[X]$ est un PGCD de ses coefficients ({{ac-factoriels|Anneaux factoriels}}, (ii)), défini à un inversible près ; $P$ est **primitif** si $c(P)$ est inversible. Pour un élément premier $p$ de $A$, la **réduction modulo $p$** est le morphisme $\pi_p : A[X] \to (A/pA)[X]$ qui réduit chaque coefficient ({{pol-evaluation|Évaluation}}, (i)).
    enonce: |
      (i) Tout $P \in A[X]$ non nul s'écrit $P = c(P)\,P_0$ avec $P_0$ primitif. Le produit de deux polynômes primitifs est primitif, et $c(PQ)$ est associé à $c(P)\,c(Q)$.

      (ii) Tout $P \in K[X]$ non nul s'écrit $\lambda P_0$, avec $\lambda \in K$ non nul et $P_0 \in A[X]$ primitif ; $P_0$ est unique à un inversible de $A$ près.
    preuve: |
      *Un outil.* Si $p \in A$ est premier, $A/pA$ est intègre ({{ac-divisibilite|Divisibilité}}, (ii), et {{a-premier-maximal|Idéaux premiers, maximaux}}, (i)), donc $(A/pA)[X]$ aussi ({{pol-anneau|Anneau A[X]}}, (iii)). Le noyau de $\pi_p$ est formé des polynômes dont $p$ divise tous les coefficients. Ainsi, si $p$ divise tous les coefficients de $FG$, il divise tous ceux de $F$ ou tous ceux de $G$.

      (i) Soit $c = c(P)$ et $a_k = cb_k$. Par {{ac-factoriels|Anneaux factoriels}}, (iii), $c \cdot c(P_0)$ est un PGCD des $a_k$, donc associé à $c$, et $c(P_0)$ est inversible après simplification par $c \neq 0$. Soient $P$ et $Q$ primitifs. Le produit $PQ$ est non nul ; si $c(PQ)$ n'était pas inversible, il aurait un facteur irréductible $p$, premier puisque $A$ est factoriel ({{ac-factoriels|Anneaux factoriels}}, (i)), qui diviserait tous les coefficients de $PQ$, donc, par l'outil, tous ceux de $P$ ou tous ceux de $Q$ : il diviserait $c(P)$ ou $c(Q)$, et serait inversible. En général, $PQ = c(P)c(Q)\,P_0Q_0$ avec $P_0Q_0$ primitif, et l'on applique encore {{ac-factoriels|Anneaux factoriels}}, (iii).

      (ii) Soit $v \neq 0$ le produit des dénominateurs d'écritures des coefficients de $P$ ; alors $vP \in A[X]$, et $vP = c(vP)\,P_0$ par (i), d'où $\lambda = c(vP)/v$. Si $\lambda P_0 = \mu Q_0$ avec $Q_0$ primitif, écrivons $\mu/\lambda = a/b$ avec $a, b \in A$ non nuls ; alors $bP_0 = aQ_0$ dans $A[X]$, et les contenus, associés à $b$ et à $a$ par (i), donnent $a = ub$ avec $u$ inversible. Il reste $bP_0 = ubQ_0$, et $P_0 = uQ_0$ par intégrité.
    remarques:
      - |
        C'est la généralisation du nœud {{pol-gauss|Lemme de Gauss}}, écrit pour $\mathbb Z$ : le nombre premier $p$ y est remplacé par un élément premier de $A$, le PGCD des entiers par celui de l'anneau factoriel. La démonstration est la même, ce qui montre qu'elle n'utilisait de $\mathbb Z$ que sa factorialité.

  - id: ac-gauss
    etiquette: Gauss
    nature: théorème
    titre: Si A est factoriel, A[X] l'est aussi
    texte: |
      Les notations sont celles du nœud {{ac-contenu|Contenu, lemme de Gauss}} : $A$ est factoriel, $K$ son corps des fractions, et $c(P)$ le contenu d'un polynôme non nul de $\lex{anneau-polynomes}{A[X]}$.
    enonce: |
      (i) Les éléments irréductibles de $A[X]$ sont les irréductibles de $A$, vus comme constantes, et les polynômes primitifs de degré au moins $1$ qui sont [[polynome-irreductible|irréductibles]] dans $K[X]$. Ils sont tous premiers dans $A[X]$.

      (ii) L'anneau $A[X]$ est factoriel. Par suite, $A[X_1, \dots, X_n]$ est factoriel ; en particulier $\lex{ensemble-entiers-relatifs}{\mathbb Z}[X_1, \dots, X_n]$ et $K[X_1, \dots, X_n]$, pour un corps $K$, le sont.
    preuve: |
      (i) Les inversibles de $A[X]$ sont ceux de $A$ ({{pol-anneau|Anneau A[X]}}, (iii)).

      *Les irréductibles de $A$.* Si $p \in A$ est irréductible dans $A$, une écriture $p = FG$ dans $A[X]$ impose $\deg F = \deg G = 0$, et c'est une écriture dans $A$ : $p$ est irréductible dans $A[X]$. Il y est premier : il l'est dans $A$, et s'il divise $FG$, il divise tous les coefficients de $FG$, donc, par l'outil de la preuve de {{ac-contenu|Contenu, lemme de Gauss}}, $F$ ou $G$.

      *Les primitifs irréductibles sur $K$.* Soit $P$ primitif de degré au moins $1$, irréductible dans $K[X]$. Si $P = FG$ dans $A[X]$, l'un des facteurs, disons $F$, est de degré $0$ par irréductibilité dans $K[X]$ : c'est une constante $a \in A$ qui divise tous les coefficients de $P$, donc $c(P)$, et $a$ est inversible. Ainsi $P$ est irréductible dans $A[X]$. Il y est premier : si $P$ divise $FG$ dans $A[X]$, il le divise dans $K[X]$, où il est premier ({{pol-irreductibles|Irréductibles}}, (i)) ; disons $F = PH$ avec $H \in K[X]$, et $F \neq 0$, le cas $F = 0$ étant clair. Écrivons $H = \lambda H_0$ par {{ac-contenu|Contenu, lemme de Gauss}}, (ii), puis $\lambda = a/b$ avec $a, b \in A$, $b \neq 0$ : $bF = a\,PH_0$, où $PH_0$ est primitif par le même nœud, (i). Les contenus donnent $a$ associé à $b\,c(F)$, soit $a = w\,b\,c(F)$ avec $w$ inversible, donc $\lambda = w\,c(F) \in A$, et $H = \lambda H_0 \in A[X]$ : $P$ divise $F$ dans $A[X]$.

      *Il n'y en a pas d'autres.* Soit $F$ irréductible dans $A[X]$. Si $\deg F = 0$, c'est un élément de $A$, irréductible dans $A$, les inversibles étant les mêmes. Si $\deg F \geqslant 1$, l'écriture $F = c(F)\,F_0$ et l'irréductibilité imposent $c(F)$ inversible, $F_0$ ne l'étant pas : $F$ est primitif. Si l'on avait $F = GH$ dans $K[X]$ avec $\deg G, \deg H \geqslant 1$, on écrirait $G = \lambda G_0$ et $H = \mu H_0$ par {{ac-contenu|Contenu, lemme de Gauss}}, (ii) ; $G_0H_0$ est primitif par le même nœud, (i), et l'unicité de ce même point (ii), appliquée à $F = (\lambda\mu)\,G_0H_0 = 1 \cdot F$, donne $F = u\,G_0H_0$ avec $u \in A^\times$ : une factorisation de $F$ en deux non-inversibles de $A[X]$, ce qui est exclu.

      (ii) *Existence des écritures.* Par récurrence sur le degré, montrons que tout $F \in A[X]$ non nul est produit d'un inversible et d'irréductibles. On écrit $F = c(F)\,F_0$ ({{ac-contenu|Contenu, lemme de Gauss}}, (i)) ; la constante $c(F)$ s'écrit ainsi dans $A$, donc dans $A[X]$ par (i). Si $F_0$ est inversible ou irréductible, c'est fini. Sinon $F_0 = GH$ avec $G$, $H$ non inversibles ; aucun n'est une constante, car une constante qui divise $F_0$ divise $c(F_0)$, inversible, et serait inversible. Donc $\deg G, \deg H \geqslant 1$, et ces degrés sont strictement inférieurs à $\deg F$ : l'hypothèse de récurrence s'applique à $G$ et $H$.

      *Unicité.* Tout irréductible de $A[X]$ est premier par (i), et {{ac-factoriels|Anneaux factoriels}}, (i), conclut. La dernière assertion s'obtient par récurrence sur $n$, puisque $A[X_1, \dots, X_n] = A[X_1, \dots, X_{n-1}][X_n]$ ({{pol-evaluation|Évaluation}}, (iii)), en partant de $\mathbb Z$, factoriel par {{ac-factoriels|Anneaux factoriels}}, (i), puisque ses irréductibles sont les $\pm p$, $p$ premier, qui sont premiers par le lemme d'Euclide, et que tout entier non nul est $\pm 1$ fois un produit de nombres premiers ({{z-premiers|Nombres premiers}}, (i) et (ii)), ou d'un corps $K$, trivialement factoriel : ses éléments non nuls sont inversibles, il n'a aucun irréductible, et toutes les écritures ont $r = 0$.
    remarques:
      - |
        L'erreur la plus répandue est de confondre l'irréductibilité dans $A[X]$ et dans $K[X]$. Avec $A = \mathbb Z$, le polynôme $2X$ est irréductible dans $K[X]$, où $K$ est le corps des fractions de $\mathbb Z$, puisqu'il est de degré $1$, mais pas dans $\mathbb Z[X]$, où $2X = 2 \cdot X$ est un produit de deux non-inversibles : le point (i) exige un polynôme primitif. À l'inverse, $X^2 + 1$, primitif et sans racine dans $K$, est irréductible dans les deux.
      - |
        Dans $K[X, Y]$, factoriel, l'idéal engendré par $X$ et $Y$ n'est pas principal. Un générateur $D$ diviserait $X$, donc serait, vu dans $K[X][Y]$, de degré $0$ en $Y$ ; il diviserait $Y = DE$, où $E$ est de degré $1$ en $Y$, de coefficient dominant $e$ avec $De = 1$ : $D$ serait inversible. Mais $1 = XU + YV$ est impossible, l'évaluation en $(0, 0)$ donnant $1 = 0$. Le point (ii) fournit donc une infinité d'anneaux factoriels non principaux.

  - id: ac-hilbert
    etiquette: Base de Hilbert
    nature: théorème
    titre: Théorème de la base de Hilbert
    enonce: |
      Si $A$ est [[anneau-noetherien|noethérien]], l'anneau $\lex{anneau-polynomes}{A[X]}$ l'est aussi. Par suite, $A[X_1, \dots, X_n]$ et ses quotients sont noethériens ; en particulier, pour un corps $K$, tout idéal de $K[X_1, \dots, X_n]$ est engendré par un nombre fini de polynômes.
    preuve: |
      Soit $I$ un idéal de $A[X]$. Pour $d \in \lex{ensemble-entiers-naturels}{\mathbb N}$, soit $L_d$ l'ensemble formé de $0$ et des coefficients dominants des éléments de $I$ de degré $d$.

      *Chaque $L_d$ est un idéal, et $L_d \subset L_{d+1}$.* Soient $a, b \in L_d$, coefficients d'indice $d$ de polynômes $P, Q \in I$ de degré au plus $d$ (on prend $P = 0$ si $a = 0$). Le polynôme $P - Q$ est dans $I$, de degré au plus $d$, de coefficient d'indice $d$ égal à $a - b$ : si $a - b \neq 0$, c'est son coefficient dominant, et $a - b \in L_d$ ; de même $ca$ est le coefficient d'indice $d$ de $cP$. Enfin $XP \in I$ a pour coefficient dominant celui de $P$, en degré $d + 1$.

      *Des générateurs en nombre fini.* La suite croissante $(L_d)$ est stationnaire ({{ac-noetheriens|Anneaux noethériens}}, (i)) : $L_d = L_N$ pour $d \geqslant N$. Pour chaque $d \leqslant N$, l'idéal $L_d$ est de type fini ; on fixe des générateurs non nuls $a_{d,1}, \dots, a_{d,k_d}$, et pour chacun un polynôme $P_{d,j} \in I$ de degré $d$ et de coefficient dominant $a_{d,j}$. Ce sont des choix en nombre fini. Soit $J$ l'idéal engendré par les $P_{d,j}$ ; on a $J \subset I$.

      *L'égalité $I = J$.* Montrons que tout $F \in I$ appartient à $J$, par récurrence sur son degré, le polynôme nul étant dans $J$. Soit $F \in I$ de degré $m$ et de coefficient dominant $c \in L_m$. Posons $d = \min(m, N)$ : alors $L_m = L_d$, et $c = \sum_j u_ja_{d,j}$ avec $u_j \in A$. Le polynôme
      $$G = F - \sum_j u_j\,X^{m-d}\,P_{d,j}$$
      est dans $I$, et son coefficient d'indice $m$ est $c - \sum_j u_ja_{d,j} = 0$ : il est de degré strictement inférieur à $m$, donc dans $J$ par hypothèse de récurrence, et $F \in J$.

      Le cas de $n$ indéterminées s'obtient par récurrence, puisque $A[X_1, \dots, X_n] = A[X_1, \dots, X_{n-1}][X_n]$ ({{pol-evaluation|Évaluation}}, (iii)), celui des quotients par {{ac-noetheriens|Anneaux noethériens}}, (iii), et un corps est noethérien.
    remarques:
      - |
        Pour $I = (4, 2X, X^2)$ dans $\mathbb Z[X]$, les idéaux de coefficients dominants sont $L_0 = 4\mathbb Z$, $L_1 = 2\mathbb Z$ et $L_d = \mathbb Z$ pour $d \geqslant 2$. En effet, le terme constant d'un élément $4U + 2XV + X^2W$ de $I$ est multiple de $4$ et son coefficient de $X$ est pair. La suite se stabilise au rang $N = 2$, et la démonstration, avec les choix les plus simples, retrouve les trois générateurs $4$, $2X$ et $X^2$, un par marche de l'escalier.

        ```schema ac-hilbert
        En abscisse le degré $d$, en ordonnée l'indice de $L_d$ dans $\mathbb Z$, soit $4$, $2$, puis $1$. Chaque marche descendante est franchie par un générateur, $4$, $2X$ puis $X^2$, en rouge ; au-delà de $N = 2$, l'escalier est plat, et aucun générateur nouveau n'est nécessaire.
        ```
      - |
        Hilbert a démontré ce théorème, pour les polynômes à coefficients dans un corps, dans « Ueber die Theorie der algebraischen Formen » (*Mathematische Annalen* 36, 1890, p. 473-534), pour établir la finitude des invariants. Sa démonstration établissait l'existence d'un système fini de générateurs sans le calculer, ce qui surprit ses contemporains. Celle-ci est de même nature : elle ne dit pas à partir de quel rang la suite $(L_d)$ est stationnaire.
      - |
        En géométrie algébrique, le théorème dit que tout ensemble algébrique de $K^n$ est l'ensemble des zéros communs d'un nombre **fini** de polynômes, même s'il a été défini par une infinité d'équations.

  - id: ac-chinois
    etiquette: Lemme chinois
    nature: théorème
    titre: Lemme chinois
    texte: |
      Le **produit** $IJ$ de deux idéaux est l'idéal engendré par les produits $xy$, $x \in I$, $y \in J$ : c'est l'ensemble des sommes finies de tels produits. Il est contenu dans $I \cap J$. Par récurrence, en développant les produits de sommes, $(I_1 \cdots I_{n-1})I_n$ est l'idéal engendré par les produits $x_1 \cdots x_n$, $x_k \in I_k$ ; l'associativité et la commutativité du produit des idéaux en découlent. Deux idéaux $I$ et $J$ sont **comaximaux** si $I + J = A$. Le **produit** $A_1 \times \cdots \times A_n$ d'anneaux est le produit cartésien muni des lois composante par composante ; c'est un anneau, de neutres $(0, \dots, 0)$ et $(1, \dots, 1)$.
    enonce: |
      Soient $I_1, \dots, I_n$ des idéaux de $A$ deux à deux comaximaux, avec $n \geqslant 1$. Alors $I_1 \cap \cdots \cap I_n = I_1 \cdots I_n$, et l'application
      $$\begin{aligned} A &\to A/I_1 \times \cdots \times A/I_n, \\ a &\mapsto (a + I_1, \dots, a + I_n) \end{aligned}$$
      est un morphisme d'anneaux surjectif de noyau $I_1 \cap \cdots \cap I_n$. Il induit un isomorphisme $A/(I_1 \cdots I_n) \cong \prod_k A/I_k$.
    preuve: |
      *Cas $n = 2$.* Écrivons $1 = x + y$ avec $x \in I$ et $y \in J$. Si $a \in I \cap J$, alors $a = ax + ay$, où $ax \in IJ$ puisque $a \in J$, et $ay \in IJ$ puisque $a \in I$ : $I \cap J \subset IJ$, et l'autre inclusion est claire. L'application est un morphisme, chaque composante étant une surjection canonique ({{a-anneau-quotient|Anneau quotient}}), et son noyau est $I \cap J$. Elle est surjective : pour $a, b \in A$, l'élément $c = ay + bx$ vérifie $c - a = a(y - 1) + bx = -ax + bx \in I$ et, de même, $c - b \in J$. Le théorème d'isomorphisme (même nœud) donne la dernière assertion.

      *Cas général*, par récurrence sur $n$. Pour $k \geqslant 2$, écrivons $1 = x_k + y_k$ avec $x_k \in I_1$, $y_k \in I_k$. En développant $1 = \prod_{k \geqslant 2}(x_k + y_k)$, tous les termes contiennent un facteur $x_k$, donc sont dans $I_1$, sauf $y_2 \cdots y_n \in I_2 \cdots I_n$ : les idéaux $I_1$ et $I_2 \cdots I_n$ sont comaximaux. Par le cas $n = 2$ et l'hypothèse de récurrence, $I_1 \cap (I_2 \cap \cdots \cap I_n) = I_1 \cap (I_2 \cdots I_n) = I_1 \cdots I_n$, et l'application est la composée de $A \to A/I_1 \times A/(I_2 \cdots I_n)$, surjective, et du produit de l'identité de $A/I_1$ et de l'isomorphisme $A/(I_2 \cdots I_n) \cong \prod_{k \geqslant 2} A/I_k$.
    remarques:
      - |
        Pour $A = \lex{ensemble-entiers-relatifs}{\mathbb Z}$, $m\mathbb Z$ et $n\mathbb Z$ sont comaximaux si et seulement si $m \wedge n = 1$, par Bézout ({{z-bezout|PGCD, Bézout}}), et l'on obtient $\mathbb Z/mn\mathbb Z \cong \mathbb Z/m\mathbb Z \times \mathbb Z/n\mathbb Z$, isomorphisme d'anneaux et pas seulement de groupes. Pour $m = 3$ et $n = 4$, l'élément $c = ay + bx$ de la preuve, avec $1 = 4 - 3$, soit $x = -3$ et $y = 4$, est $c = 4a - 3b$ : pour $a = 2$ et $b = 3$, $c = -1$, qui vaut bien $2$ modulo $3$ et $3$ modulo $4$.

        ```schema ac-chinois
        La case de ligne $a$ et de colonne $b$ contient l'unique $k \in \{0, \dots, 11\}$ tel que $k \equiv a \pmod 3$ et $k \equiv b \pmod 4$. En partant de $0$ et en avançant d'une case en diagonale à chaque pas, avec retour au bord opposé, les entiers $0$ à $11$ visitent les douze cases une fois chacune : c'est la bijection $\mathbb Z/12\mathbb Z \to \mathbb Z/3\mathbb Z \times \mathbb Z/4\mathbb Z$. La case rouge, $(2, 3)$, est atteinte par $11$, c'est-à-dire par $-1$.
        ```
      - |
        L'erreur la plus répandue est d'oublier la comaximalité. Les idéaux $2\mathbb Z$ et $2\mathbb Z$ ne sont pas comaximaux, et $\mathbb Z/4\mathbb Z$ n'est pas isomorphe à $\mathbb Z/2\mathbb Z \times \mathbb Z/2\mathbb Z$, qui n'a aucun élément d'ordre additif $4$ ; ici $2\mathbb Z \cap 2\mathbb Z = 2\mathbb Z$, alors que le produit est $4\mathbb Z$.
      - |
        Pour des éléments $a_1, \dots, a_n$ deux à deux distincts d'un corps $K$, les idéaux $(X - a_k)$ de $K[X]$ sont deux à deux comaximaux, puisque $(X - a_k) - (X - a_l) = a_l - a_k$ est inversible. Le lemme chinois dit alors qu'il existe un polynôme qui prend des valeurs prescrites aux points $a_k$, unique modulo $\prod_k (X - a_k)$ : c'est l'interpolation de Lagrange.

  - id: ac-localisation
    etiquette: Localisation
    nature: théorème
    titre: Localisation
    texte: |
      Une partie $S$ de $A$ est **multiplicative** si $1 \in S$ et si $S$ est stable par produit. Sur $A \times S$, on pose
      $$\begin{aligned} &(a, s) \sim (b, t) \\ &\iff u(at - bs) = 0 \text{ pour un } u \in S. \end{aligned}$$
      On note $a/s$ la classe de $(a, s)$, et $S^{-1}A$ l'ensemble des classes, le [[localise|localisé]] de $A$ en $S$.
    enonce: |
      (i) La relation $\sim$ est une relation d'équivalence, et $S^{-1}A$, muni de
      $$\frac as + \frac bt = \frac{at + bs}{st}, \qquad \frac as \cdot \frac bt = \frac{ab}{st},$$
      est un anneau commutatif. L'application $\iota : a \mapsto a/1$ est un morphisme d'anneaux, $\iota(s)$ est inversible pour tout $s \in S$, et $\operatorname{Ker} \iota = \{a : ua = 0 \text{ pour un } u \in S\}$. L'anneau $S^{-1}A$ est nul si et seulement si $0 \in S$.

      (ii) *Propriété universelle.* Si $f : A \to B$ est un morphisme d'anneaux tel que $f(s)$ soit inversible pour tout $s \in S$, il existe un unique morphisme $g : S^{-1}A \to B$ tel que $g \circ \iota = f$, à savoir $g(a/s) = f(a)f(s)^{-1}$.

      (iii) Si $A$ est intègre et $0 \notin S$, $\iota$ est injective, et $S^{-1}A$ s'identifie au sous-anneau $\{a/s : a \in A, s \in S\}$ du [[corps-fractions|corps des fractions]] de $A$ ; pour $S = A \setminus \{0\}$, c'est le corps des fractions lui-même.

      (iv) Tout idéal $J$ de $S^{-1}A$ est formé des $a/s$ avec $a \in \iota^{-1}(J)$ et $s \in S$. L'application $\mathfrak q \mapsto \iota^{-1}(\mathfrak q)$ est une bijection des idéaux premiers de $S^{-1}A$ sur les idéaux premiers de $A$ qui ne rencontrent pas $S$ ; sa réciproque envoie $\mathfrak p$ sur $S^{-1}\mathfrak p = \{a/s : a \in \mathfrak p, s \in S\}$.
    preuve: |
      (i) La réflexivité et la symétrie sont claires. Si $u(at - bs) = 0$ et $v(bw - ct) = 0$, multiplions la première égalité par $vw$ et la seconde par $us$ : leur somme donne $uvt\,(aw - cs) = 0$, avec $uvt \in S$. Les opérations sont bien définies : si $u(as' - a's) = 0$, alors
      $$\begin{aligned} &u\big[(at + bs)s't - (a't + bs')st\big] \\ &\quad = ut^2(as' - a's) = 0, \\ &u\,[ab\,s't - a'b\,st] = ubt\,(as' - a's) = 0, \end{aligned}$$
      et de même pour le second argument. On a $(av)/(sv) = a/s$ pour $v \in S$, puisque $av \cdot s - a \cdot sv = 0$ ; avec cette règle, chaque axiome d'anneau commutatif se ramène à une identité de $A$, comme au nœud {{a-fractions|Corps des fractions}}. L'application $\iota$ respecte somme, produit et $1$, et $(s/1)(1/s) = s/s = 1/1$. Enfin $a/1 = 0/1$ s'écrit $u(a \cdot 1 - 0 \cdot 1) = ua = 0$ pour un $u \in S$, et $S^{-1}A$ est nul si et seulement si $1/1 = 0/1$, c'est-à-dire si $u = 0$ pour un $u \in S$.

      (ii) *Unicité.* Si $g \circ \iota = f$, alors $g(a/s)\,f(s) = g(a/s)\,g(s/1) = g(a/1) = f(a)$, d'où la formule. *Existence.* La formule ne dépend pas du représentant : si $u(at - bs) = 0$, alors $f(u)\big(f(a)f(t) - f(b)f(s)\big) = 0$, et, $f(u)$, $f(s)$, $f(t)$ étant inversibles, $f(a)f(s)^{-1} = f(b)f(t)^{-1}$. Elle respecte les lois, comme on le vérifie en développant, et $g(1/1) = 1$.

      (iii) Si $ua = 0$ avec $u \in S$, alors $u \neq 0$ et $a = 0$ par intégrité : $\iota$ est injective. Le morphisme $g$ fourni par (ii) pour l'inclusion de $A$ dans son corps des fractions $K$ est injectif, puisque $g(a/s) = 0$ impose $a = 0$, et son image est l'ensemble des $a/s$ de $K$. Pour $S = A \setminus \{0\}$, la relation $u(at - bs) = 0$ équivaut à $at = bs$, et l'on retrouve la construction de $K$.

      (iv) Soit $I = \iota^{-1}(J)$, idéal de $A$. Si $a/s \in J$, alors $a/1 = (s/1)(a/s) \in J$, donc $a \in I$ ; réciproquement, si $a \in I$, $a/s = (1/s)(a/1) \in J$. Si $\mathfrak q$ est premier, $\mathfrak p = \iota^{-1}(\mathfrak q)$ l'est : $1 \notin \mathfrak p$ puisque $\iota(1) = 1 \notin \mathfrak q$, et $ab \in \mathfrak p$ s'écrit $\iota(a)\iota(b) \in \mathfrak q$. Il ne rencontre pas $S$, car $s \in \mathfrak p$ rendrait $s/1$, inversible, élément de $\mathfrak q$. Et $\mathfrak q = S^{-1}\mathfrak p$ par ce qui précède.

      Réciproquement, soit $\mathfrak p$ premier ne rencontrant pas $S$. L'ensemble $S^{-1}\mathfrak p$ est un idéal, comme on le lit sur les formules de (i). Il ne contient pas $1/1$ : $1/1 = a/s$ avec $a \in \mathfrak p$ donnerait $u(s - a) = 0$, soit $us = ua \in \mathfrak p$, alors que $u$ et $s$ sont hors de $\mathfrak p$. Il est premier : si $(a/s)(b/t) = c/w$ avec $c \in \mathfrak p$, alors $u(abw - cst) = 0$, d'où $uw\,ab = ucst \in \mathfrak p$, puis $ab \in \mathfrak p$, et $a$ ou $b$ est dans $\mathfrak p$. Enfin $\iota^{-1}(S^{-1}\mathfrak p) = \mathfrak p$ : si $a/1 = c/w$ avec $c \in \mathfrak p$, alors $uwa = uc \in \mathfrak p$, et $a \in \mathfrak p$. Les deux applications sont donc réciproques l'une de l'autre.
    remarques:
      - |
        Le facteur $u$ de la définition est indispensable dès que $A$ n'est pas intègre. Dans $\lex{anneau-zn}{\mathbb Z/6\mathbb Z}$, la partie $S = \{\bar 1, \bar 3\}$ est multiplicative, puisque $\bar 3 \cdot \bar 3 = \bar 3$, et $\bar 3 \cdot \bar 2 = \bar 0$ : on a donc $\bar 2/\bar 1 = \bar 0/\bar 1$, et le noyau de $\iota$ contient $\bar 2$. Sans le facteur $u$, la relation ne serait pas transitive : on aurait $(\bar 2, \bar 1) \sim (\bar 0, \bar 3)$, puisque $\bar 2 \cdot \bar 3 = \bar 0$, et $(\bar 0, \bar 3) \sim (\bar 0, \bar 1)$, mais pas $(\bar 2, \bar 1) \sim (\bar 0, \bar 1)$, comme le signalait le nœud {{a-fractions|Corps des fractions}}.
      - |
        Les deux exemples fondamentaux sont $S = A \setminus \mathfrak p$, pour un idéal premier $\mathfrak p$, qui donne l'anneau $A_{\mathfrak p}$, et $S = \{1, f, f^2, \dots\}$, qui donne $A_f$. Pour $A = \mathbb Z$ et $\mathfrak p = 3\mathbb Z$, l'anneau $\mathbb Z_{(3)}$ est formé des fractions dont le dénominateur n'est pas multiple de $3$ ; pour $f = 6$, $\mathbb Z_6 = \mathbb Z[\frac16]$ est formé des fractions dont le dénominateur n'a que $2$ et $3$ pour facteurs premiers.

        ```schema ac-localisation
        Les idéaux premiers de $\mathbb Z$ : l'idéal $\{0\}$, à gauche, puis les idéaux $p\mathbb Z$. Le point (iv) dit ce que voit chaque localisé. Dans $\mathbb Z_{(3)}$, en bleu, il ne reste que $\{0\}$ et $3\mathbb Z$ ; dans $\mathbb Z[\frac16]$, en rouge, tous les points sauf $2\mathbb Z$ et $3\mathbb Z$, barrés en gris. Localiser en $\mathfrak p$, c'est regarder près d'un point ; inverser $f$, c'est retirer des points.
        ```

  - id: ac-locaux
    etiquette: Anneaux locaux
    nature: proposition
    titre: Anneaux locaux
    texte: |
      Un anneau $A$ est [[anneau-local|local]] s'il est non nul et si ses éléments non inversibles forment un idéal $\mathfrak m$. L'anneau $A/\mathfrak m$ est son **corps résiduel**.
    enonce: |
      (i) Si $A$ est local, $\mathfrak m$ est son unique idéal maximal, $A/\mathfrak m$ est un corps, et $1 + \mathfrak m \subset A^\times$. Réciproquement, si $\mathfrak m \neq A$ est un idéal tel que tout élément hors de $\mathfrak m$ soit inversible, $A$ est local d'idéal maximal $\mathfrak m$.

      (ii) Pour tout idéal premier $\mathfrak p$ de $A$, l'anneau $A_{\mathfrak p} = (A \setminus \mathfrak p)^{-1}A$ est local, d'idéal maximal $\mathfrak pA_{\mathfrak p} = \{a/s : a \in \mathfrak p,\ s \notin \mathfrak p\}$.

      (iii) Pour un nombre premier $p$, soit $\mathbb Z_{(p)}$ le localisé de $\lex{ensemble-entiers-relatifs}{\mathbb Z}$ en $p\mathbb Z$. Tout élément non nul s'écrit $p^ku$ avec $k \in \lex{ensemble-entiers-naturels}{\mathbb N}$ et $u$ inversible, et les idéaux non nuls de $\mathbb Z_{(p)}$ sont les $p^k\mathbb Z_{(p)}$.
    preuve: |
      (i) Comme $1$ est inversible, $1 \notin \mathfrak m$ et $\mathfrak m \neq A$. Un idéal $J \neq A$ ne contient aucun inversible ({{a-ideal|Idéal}}, (iv)), donc $J \subset \mathfrak m$ : $\mathfrak m$ est maximal, et c'est le seul. Le quotient est un corps ({{a-premier-maximal|Idéaux premiers, maximaux}}, (ii)). Si $x \in \mathfrak m$ et si $1 + x$ n'était pas inversible, on aurait $1 + x \in \mathfrak m$, puis $1 \in \mathfrak m$. Pour la réciproque, les éléments de $\mathfrak m$ ne sont pas inversibles, puisque $\mathfrak m \neq A$, et les autres le sont : $\mathfrak m$ est exactement l'ensemble des non-inversibles, et $A \neq \{0\}$ puisque $\mathfrak m \neq A$.

      (ii) La partie $S = A \setminus \mathfrak p$ est multiplicative, puisque $\mathfrak p$ est premier, et ne contient pas $0$. D'après {{ac-localisation|Localisation}}, (iv), $\mathfrak m = S^{-1}\mathfrak p$ est un idéal premier, donc différent de $A_{\mathfrak p}$. Un élément $a/s$ qui n'est pas dans $\mathfrak m$ a son numérateur $a$ hors de $\mathfrak p$, donc dans $S$, et $s/a$ est son inverse. On conclut par (i).

      (iii) Par {{ac-localisation|Localisation}}, (iii), $\mathbb Z_{(p)}$ est l'anneau des $a/b$, $p \nmid b$, du corps des fractions de $\mathbb Z$. Pour $a \neq 0$, écrivons $a = p^ka'$ avec $p \nmid a'$, par la décomposition en facteurs premiers ({{z-premiers|Nombres premiers}}, (ii)) ; alors $a/b = p^k \cdot a'/b$, et $a'/b$ est inversible, d'inverse $b/a'$. Soit $I$ un idéal non nul, et $k$ le plus petit exposant d'un élément non nul $p^ku$ de $I$ ({{n-ordre|Bon ordre sur ℕ}}) : $I$ contient $p^k = (p^ku)u^{-1}$, donc $p^k\mathbb Z_{(p)}$, et tout élément non nul de $I$, de la forme $p^lv$ avec $l \geqslant k$, appartient à $p^k\mathbb Z_{(p)}$. L'exposant $k$ d'un élément non nul est unique : $p^ku = p^lv$ avec $k < l$ donnerait $u = p^{l-k}v$, qui n'est pas inversible puisque $p$ ne l'est pas, $\frac1p$ n'ayant pas un dénominateur premier à $p$.
    remarques:
      - |
        On définit souvent un anneau local comme un anneau qui a un seul idéal maximal. L'équivalence avec la définition adoptée ici demande de savoir que tout non-inversible est contenu dans un idéal maximal, ce qui est le théorème de Krull et repose sur le lemme de Zorn ; c'est pourquoi on part ici de l'idéal des non-inversibles, qui ne demande aucun choix.
      - |
        Dans $\mathbb Z_{(p)}$, la chaîne des idéaux $\mathbb Z_{(p)} \supset p\mathbb Z_{(p)} \supset p^2\mathbb Z_{(p)} \supset \cdots$ est la seule : l'anneau ne retient de $\mathbb Z$ que la divisibilité par $p$, et l'exposant $k$ de (iii) est la **valuation $p$-adique**. Pour $p = 3$, on a $\frac{18}{5} = 3^2 \cdot \frac25$, de valuation $2$, et $\frac{7}{10}$, de valuation $0$, est inversible.

  - id: ac-nakayama
    etiquette: Nakayama
    nature: théorème
    titre: Lemme de Nakayama
    texte: |
      Un [[module|$A$-module]] $M$ est **de type fini** s'il existe $x_1, \dots, x_n \in M$ tels que $M = Ax_1 + \cdots + Ax_n$, c'est-à-dire que tout élément de $M$ s'écrive $\sum_i a_ix_i$. Pour un idéal $I$, on note $IM$ l'ensemble des sommes finies $\sum_j b_jy_j$ avec $b_j \in I$ et $y_j \in M$ ; c'est un sous-module de $M$.
    enonce: |
      (i) *Lemme de Nakayama.* Soit $I$ un idéal tel que $1 + I \subset A^\times$, et $M$ un $A$-module de type fini. Si $IM = M$, alors $M = \{0\}$.

      (ii) Sous les mêmes hypothèses, si $N$ est un sous-module de $M$ tel que $M = N + IM$, alors $M = N$.

      (iii) Soit $A$ un [[anneau-local|anneau local]], d'idéal maximal $\mathfrak m$ et de corps résiduel $k = A/\mathfrak m$, et $M$ un $A$-module de type fini. Alors $M/\mathfrak mM$ est un $k$-[[espace-vectoriel|espace vectoriel]] de [[dimension]] finie $d$ ; des éléments $x_1, \dots, x_n$ engendrent $M$ si et seulement si leurs classes engendrent $M/\mathfrak mM$ ; et une famille génératrice de $M$ dont aucune sous-famille stricte n'engendre $M$ a exactement $d$ éléments.
    preuve: |
      (i) Par récurrence sur le nombre $n$ de générateurs. Si $n = 0$, $M = \{0\}$. Soit $M = Ax_1 + \cdots + Ax_n$ avec $n \geqslant 1$. Un élément de $IM$ s'écrit $\sum_j b_jy_j$, et, en développant chaque $y_j$ sur les $x_i$, $\sum_i a_ix_i$ avec des $a_i \in I$. Comme $x_n \in M = IM$, on écrit ainsi $x_n = \sum_i a_ix_i$, soit $(1 - a_n)x_n = \sum_{i < n} a_ix_i$. Or $1 - a_n \in 1 + I$ est inversible : $x_n \in M' = Ax_1 + \cdots + Ax_{n-1}$, donc $M = M'$, engendré par $n - 1$ éléments, avec $IM' = IM = M = M'$. L'hypothèse de récurrence donne $M = \{0\}$.

      (ii) Le quotient $M/N$ ({{a-module|Module}}) est de type fini, engendré par les classes des générateurs de $M$, et $I(M/N) = M/N$ : toute classe $x + N$ s'écrit, puisque $x \in N + IM$, comme classe d'un élément $\sum_j b_jy_j$ de $IM$, c'est-à-dire $\sum_j b_j(y_j + N)$. Par (i), $M/N = \{0\}$, et $M = N$.

      (iii) L'idéal $\mathfrak m$ vérifie $1 + \mathfrak m \subset A^\times$ ({{ac-locaux|Anneaux locaux}}, (i)). Le module quotient $V = M/\mathfrak mM$ est annulé par $\mathfrak m$ : pour $a \in \mathfrak m$, $a(x + \mathfrak mM) = ax + \mathfrak mM = \mathfrak mM$. La loi $(a + \mathfrak m)\cdot \bar x = a\bar x$ est donc bien définie, et munit $V$ d'une structure de $k$-espace vectoriel, les axiomes se lisant sur ceux du $A$-module. Les classes de générateurs de $M$ engendrent $V$, qui est donc de dimension finie ({{v-dimension|Dimension}}). Si les classes de $x_1, \dots, x_n$ engendrent $V$, le sous-module $N = Ax_1 + \cdots + Ax_n$ vérifie $M = N + \mathfrak mM$, et $N = M$ par (ii) ; la réciproque est claire.

      Soit enfin $(x_1, \dots, x_n)$ une famille génératrice dont aucune sous-famille stricte n'engendre $M$. Les classes engendrent $V$. Si elles formaient une famille liée, une relation $\sum_i \lambda_i\bar x_i = 0$ avec $\lambda_j \neq 0$ exprimerait $\bar x_j$ comme combinaison linéaire des autres classes, qui engendreraient encore $V$ ; les éléments correspondants engendreraient $M$ par ce qui précède, contrairement à l'hypothèse. Les classes forment donc une base, et $n = d$.
    remarques:
      - |
        L'hypothèse « de type fini » ne peut pas être omise. Pour $A = \mathbb Z_{(p)}$ et $M$ le corps des fractions de $\mathbb Z$, vu comme $A$-module, on a $pM = M$, puisque tout élément $x$ s'écrit $p \cdot \frac xp$, et pourtant $M \neq \{0\}$ : d'après (i), appliqué à $I = p\mathbb Z_{(p)}$, $M$ n'est donc pas de type fini sur $A$. L'hypothèse $1 + I \subset A^\times$ non plus : pour $A = \mathbb Z$, $I = 2\mathbb Z$ et $M = \mathbb Z/3\mathbb Z$, on a $2M = M$, puisque $2 \cdot \bar 2 = \bar 1$, mais $1 + 2 = 3$ n'est pas inversible dans $\mathbb Z$.
      - |
        Le point (iii) dit qu'au-dessus d'un anneau local, le nombre minimal de générateurs d'un module se lit sur un espace vectoriel. C'est l'outil de base de la géométrie algébrique locale : pour l'anneau local d'un point, l'espace $\mathfrak m/\mathfrak m^2$ joue le rôle d'espace cotangent, et, par (iii), sa dimension est le nombre minimal de générateurs de $\mathfrak m$, c'est-à-dire de fonctions qui suffisent à décrire le point au premier ordre : c'est la dimension de plongement.

