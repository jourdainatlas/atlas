# Niveau 1 : structure interne de l'analyse réelle.
# Les entrées sont des nœuds du graphe parent ; chacune doit être un ancêtre
# du conteneur, et chaque parent direct du conteneur doit figurer parmi elles.

graphe: analyse-reelle
titre: Analyse réelle
conteneur: analyse-reelle

entrees:
  r: [ar-corps]
  top: [ar-topo]

noeuds:
  - id: ar-corps
    etiquette: Borne supérieure
    nature: axiome
    titre: ℝ, corps ordonné complet
    enonce: |
      $\lex{ensemble-reels}{\mathbb R}$ est un [[corps-ordonne|corps totalement ordonné]] dans lequel toute partie non vide et majorée admet une [[borne-superieure]].
    texte: |
      C'est la seule propriété qui distingue $\mathbb R$ de $\lex{ensemble-rationnels}{\mathbb Q}$ parmi les corps totalement ordonnés : tout le reste de l'analyse réelle s'en déduit. L'existence d'un tel corps est établie au nœud {{rr-complet|Corps ordonné complet}}, et son unicité, à unique isomorphisme près, au nœud {{rr-unicite|Unicité de ℝ}}.

      La valeur absolue $|x| = \max(x, -x)$ vérifie l'inégalité triangulaire, et $d(x,y) = |x-y|$ fait de $\mathbb R$ un [[espace-metrique]].
    remarques:
      - |
        Dans $\mathbb R$, $s = \sup A$ équivaut à : $s$ majore $A$, et pour tout $\varepsilon > 0$, il existe $x \in A$ tel que $x > s - \varepsilon$. C'est la forme sous laquelle la borne supérieure s'emploie en analyse ; la définition générale, purement d'ordre, est au nœud {{od-majorants|Majorants, bornes}}.

  - id: ar-archimede
    etiquette: Archimède, densité de ℚ
    nature: théorème
    titre: Propriété d'Archimède et densité de ℚ
    enonce: |
      $\lex{ensemble-reels}{\mathbb R}$ est [[archimedien]], et tout intervalle ouvert non vide $]a,b[$ contient un rationnel.
    preuve: |
      C'est le théorème du nœud {{rr-archimede|Archimède, densité de ℚ}}, appliqué au corps ordonné complet $\mathbb R$. La démonstration y est faite pour un corps ordonné complet quelconque : l'existence d'un majorant pour $\{nx : n \in \lex{ensemble-entiers-naturels}{\mathbb N}\}$ contredirait la propriété de la borne supérieure, et la densité s'obtient en encadrant $nx$ entre deux entiers consécutifs.

  - id: ar-suites
    etiquette: Suites et limites
    nature: chapitre
    titre: Suites réelles et limites
    sous: ar-suites
    texte: |
      [[limite-suite|Convergence]] d'une [[suite]] réelle, unicité de la limite, opérations et passage à la limite dans les inégalités, encadrement, limites infinies et suites extraites, puis les trois théorèmes qui exploitent la borne supérieure : limite monotone, suites adjacentes, segments emboîtés.

  - id: ar-bw
    etiquette: Bolzano-Weierstrass
    nature: théorème
    titre: Théorème de Bolzano-Weierstrass
    enonce: |
      Toute suite réelle bornée admet une [[suite-extraite]] convergente.
    preuve: |
      **Lemme des pics.** Toute suite réelle $(u_n)$ admet une suite extraite monotone. Disons que $n$ est un *pic* si $u_n \geqslant u_m$ pour tout $m > n$.

      Si les pics sont en nombre infini, on les range par ordre croissant $n_0 < n_1 < \cdots$, ce qui ne demande aucun choix puisque $\lex{ensemble-entiers-naturels}{\mathbb N}$ est bien ordonné ; la suite $(u_{n_k})$ est alors décroissante.

      S'ils sont en nombre fini, soit $n_0$ un entier strictement supérieur à tous les pics. Aucun $n \geqslant n_0$ n'est un pic, donc il existe $m > n$ avec $u_m > u_n$ ; on définit par récurrence $n_{k+1}$ comme le **plus petit** tel entier pour $n = n_k$. La suite $(u_{n_k})$ est strictement croissante.

      ```schema ar-bw
      En haut, $u_n = (-1)^n\frac{n}{n+1} + \frac{2}{n+1}$ a une infinité de pics, les indices pairs, cerclés : chacun majore tous les termes qui le suivent, et ils forment une suite extraite décroissante. En bas, $u_n = (-1)^n\frac{n-3}{n+1}$ n'a qu'un pic, $n = 1$ ; à partir de $n_0 = 2$, on prend chaque fois le plus petit indice dont le terme dépasse le terme courant, ce qui donne $n_k = 2, 3, 4, 6, 8, \dots$ et une suite extraite strictement croissante.
      ```

      Si $(u_n)$ est bornée, la suite extraite monotone obtenue l'est aussi ; elle converge par le théorème de la limite monotone, appliqué à elle ou à son opposée.
    remarques:
      - |
        Cette démonstration n'utilise aucune forme de l'axiome du choix : chaque choix est remplacé par la désignation d'un plus petit élément de $\mathbb N$.

  - id: ar-cauchy
    etiquette: Complétude
    nature: théorème
    titre: Complétude de ℝ
    enonce: |
      Toute [[suite-cauchy|suite de Cauchy]] réelle converge : $\lex{ensemble-reels}{\mathbb R}$ est un espace métrique complet.
    preuve: |
      Soit $(u_n)$ de Cauchy. Pour $\varepsilon = 1$, il existe $N$ tel que $|u_n - u_N| < 1$ pour $n \geqslant N$ ; la suite est donc bornée par $\max(|u_0|, \dots, |u_{N-1}|, |u_N| + 1)$. Par Bolzano-Weierstrass, une suite extraite $(u_{\varphi(n)})$ converge vers un réel $\ell$.

      Soit $\varepsilon > 0$, et $N'$ tel que $|u_p - u_q| < \varepsilon/2$ pour $p, q \geqslant N'$. Il existe $k \geqslant N'$ tel que $|u_{\varphi(k)} - \ell| < \varepsilon/2$, et $\varphi(k) \geqslant k \geqslant N'$. Pour $n \geqslant N'$, on obtient
      $$|u_n - \ell| \leqslant |u_n - u_{\varphi(k)}| + |u_{\varphi(k)} - \ell| < \varepsilon.$$

  - id: ar-topo
    etiquette: Topologie de ℝ
    nature: chapitre
    titre: Topologie de ℝ
    sous: ar-topo
    texte: |
      Ouverts, fermés, adhérence et densité pour la distance $|x - y|$, caractérisation séquentielle des fermés, puis les deux théorèmes qui décrivent les parties remarquables de $\lex{ensemble-reels}{\mathbb R}$ : les connexes sont les intervalles, et les compacts sont les fermés bornés (Borel-Lebesgue). On y fixe aussi la notation $\lex{sphere-unite}{S^n}$ de la sphère unité.

  - id: continuite
    etiquette: Continuité
    nature: chapitre
    titre: Continuité
    sous: continuite
    texte: |
      [[continuite-point|Continuité en un point]], caractérisation séquentielle, puis les grands théorèmes sur un intervalle ou un segment : valeurs intermédiaires, bornes atteintes, continuité uniforme, bijection continue.

  - id: ar-deriv
    etiquette: Dérivabilité
    nature: chapitre
    titre: Dérivabilité
    sous: ar-deriv
    texte: |
      Fonction [[derivable]] en un point, par le taux d'accroissement ou par un développement limité à l'ordre 1 ; règles de calcul, dérivée d'une composée et d'une réciproque. Puis les théorèmes qui relient la dérivée aux variations de la fonction : extremum local, Rolle, égalité et inégalité des accroissements finis, signe de la dérivée et monotonie, et la formule de Taylor-Lagrange.

  - id: ar-riemann
    etiquette: Intégrale de Riemann
    nature: chapitre
    titre: Intégrale de Riemann
    sous: ar-riemann
    texte: |
      L'intégrale est d'abord définie pour les [[fonction-escalier|fonctions en escalier]], puis étendue aux fonctions [[riemann-integrable|intégrables au sens de Riemann]], encadrées d'aussi près qu'on veut par des fonctions en escalier : linéarité, croissance, relation de Chasles, intégrabilité des fonctions continues et des fonctions monotones, inégalité de la moyenne et convergence des sommes de Riemann.

  - id: ar-tfa
    etiquette: Théorème fondamental
    nature: théorème
    titre: Théorème fondamental de l'analyse
    enonce: |
      Soit $f$ continue sur un [[intervalle]] $I$ et $a \in I$. La fonction $F : x \mapsto \displaystyle\int_a^x f$ est dérivable sur $I$, et $F' = f$.
    preuve: |
      Soit $x \in I$ et $h \neq 0$ tel que $x + h \in I$. La relation de Chasles et l'intégrale d'une constante donnent
      $$\begin{aligned} \left| \frac{F(x+h) - F(x)}{h} - f(x) \right| &= \left| \frac{1}{h} \int_x^{x+h} \big(f(t) - f(x)\big)\,dt \right| \\ &\leqslant \sup_{|t - x| \leqslant |h|} |f(t) - f(x)|. \end{aligned}$$
      Par continuité de $f$ en $x$, ce majorant tend vers $0$ quand $h \to 0$.

