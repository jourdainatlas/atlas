# Niveau 1 : structure interne du nœud « Analyse fonctionnelle ».
# Espaces vectoriels normés réels (les complexes ne sont pas des ancêtres de ce nœud), espaces
# de Banach, opérateurs continus, espaces L¹ et L², espaces de Hilbert (projection, Riesz,
# bases hilbertiennes, système de Haar), Hahn-Banach, Banach-Steinhaus, application ouverte ;
# opérateurs autoadjoints, théorème spectral en dimension finie (quotient de Rayleigh, sans ℂ),
# opérateurs compacts (diagonaux, à noyau continu) et théorème spectral des opérateurs compacts
# autoadjoints.
# Les normes, les espaces métriques complets et le théorème de Baire viennent du graphe
# « Espaces métriques et normés » (met), parent de celui-ci. Les espaces Lᵖ pour p quelconque
# demandent les puissances réelles, donc l'exponentielle, et ne sont pas traités.
# Choix : Hahn-Banach (Zorn), bases hilbertiennes en général (Zorn), projection (choix
# dénombrable), application ouverte (choix dépendant, comme Baire), limites quelconques
# d'opérateurs compacts et base hilbertienne de vecteurs propres d'un opérateur compact
# autoadjoint (choix dénombrable ; sans choix pour des approximations explicites, ou dans un
# espace séparable). Le théorème spectral lui-même est démontré sans choix : la valeur propre
# extrême vient d'une intersection de fermés emboîtés d'un compact, non d'une suite maximisante.

graphe: anf
titre: Analyse fonctionnelle
conteneur: anf

entrees:
  met: [f-evn, f-banach-steinhaus]
  alglin: [f-hahn-banach]
  mes: [f-lp, f-haar]

noeuds:
  - id: f-evn
    etiquette: Espaces normés
    nature: définition
    titre: Espaces vectoriels normés et espaces de Banach
    texte: |
      Un [[espace-norme|espace vectoriel normé]] est un $\lex{ensemble-reels}{\mathbb R}$-espace vectoriel $E$ muni d'une [[norme]] $\|\cdot\|$ ({{gd-normes|Normes}}) : $\|x\| = 0$ entraîne $x = 0$, $\|\lambda x\| = |\lambda|\,\|x\|$ et $\|x + y\| \leqslant \|x\| + \|y\|$.

      La distance $d(x, y) = \|x - y\|$ en fait un [[espace-metrique]], et l'on munit $E$ de la topologie associée, dont les ouverts sont les parties qui contiennent une boule $B(a, r)$ autour de chacun de leurs points ({{me-topologie|Topologie d'une distance}}).

      Un [[banach|espace de Banach]] est un espace normé [[espace-complet|complet]] : toute [[suite-cauchy|suite de Cauchy]] y converge.
    enonce: |
      (i) Les boules ouvertes forment une base de cette topologie, qui est séparée. Une partie $F$ est fermée si et seulement si toute suite d'éléments de $F$ qui converge a sa limite dans $F$.

      (ii) L'addition, la multiplication par un scalaire et la norme sont continues, la norme vérifiant $\big|\|x\| - \|y\|\big| \leqslant \|x - y\|$. L'adhérence d'un sous-espace est un sous-espace.

      (iii) $E$ est un espace de Banach si et seulement si toute série $\sum x_n$ telle que $\sum \|x_n\| < +\infty$ converge.

      (iv) Un sous-espace fermé d'un espace de Banach est un espace de Banach.
    preuve: |
      (i) C'est, pour la distance d'une norme, le contenu des nœuds {{gd-normes|Normes}}, (i), et {{me-sequentielle|Suites convergentes}}, (iii). La réciproque de la caractérisation des fermés utilise le [[choix-denombrable]] ; on n'emploiera que le sens direct.

      (ii) $\|(x + y) - (x_0 + y_0)\| \leqslant \|x - x_0\| + \|y - y_0\|$ et $\|\lambda x - \lambda_0 x_0\| \leqslant |\lambda|\,\|x - x_0\| + |\lambda - \lambda_0|\,\|x_0\|$. L'inégalité sur la norme découle de l'inégalité triangulaire. Si $F$ est un sous-espace, $\bar F$ est stable par les opérations, qui sont continues.

      (iii) Si $E$ est complet et $\sum \|x_n\| < +\infty$, les sommes partielles forment une suite de Cauchy, puisque $\|S_q - S_p\| \leqslant \sum_{p < n \leqslant q} \|x_n\|$.

      Réciproquement, soit $(y_n)$ de Cauchy, et $n_k$ le plus petit entier $n > n_{k-1}$ tel que $\|y_m - y_{m'}\| \leqslant 2^{-k}$ pour $m, m' \geqslant n$. La série $\sum (y_{n_{k+1}} - y_{n_k})$ converge absolument, donc converge, et la suite extraite $(y_{n_k})$ converge. Une suite de Cauchy qui a une suite extraite convergente converge, vers la même limite ({{me-cauchy|Espaces complets}}, (i)).

      (iv) C'est le sens direct du nœud {{me-cauchy|Espaces complets}}, (iii), qui n'emploie que le sens direct de (i).
    remarques:
      - |
        En dimension infinie, deux normes sur un même espace peuvent définir des topologies différentes. Sur l'espace des fonctions continues sur $[0, 1]$, les fonctions $x \mapsto x^n$ ont pour norme uniforme $1$ et pour intégrale $\frac1{n+1}$ : elles tendent vers $0$ pour la norme $\int_0^1 |f|$, mais pas pour la norme uniforme. En dimension finie, au contraire, toutes les normes sont équivalentes ({{gd-equivalence|Équivalence des normes}}).

  - id: f-exemples
    etiquette: Exemples d'espaces de Banach
    nature: proposition
    titre: Fonctions bornées, fonctions continues, suites sommables
    enonce: |
      (i) Pour tout ensemble $X$, l'espace $\lex{espace-bornees}{\mathcal B}(X)$ des fonctions bornées $X \to \lex{ensemble-reels}{\mathbb R}$, muni de $\|f\|_\infty = \sup_X |f|$, est un espace de Banach.

      (ii) Si $K$ est un espace [[compact]], l'espace $\lex{espace-continues}{C}(K)$ des fonctions continues $K \to \mathbb R$ est un sous-espace fermé de $\mathcal B(K)$, donc un espace de Banach. En particulier, une limite uniforme de fonctions continues est continue.

      (iii) L'espace $\lex{espace-l1-suites}{\ell^1}$ des suites réelles $(a_n)$ telles que $\|a\|_1 = \sum_n |a_n| < +\infty$ est un espace de Banach.
    preuve: |
      (i) Si $(f_k)$ est de Cauchy pour $\|\cdot\|_\infty$, chaque suite $(f_k(x))$ est de Cauchy dans $\mathbb R$ et converge ({{ar-cauchy|Complétude}}) vers $f(x)$.

      Pour $\varepsilon > 0$, soit $N$ tel que $|f_k(x) - f_l(x)| \leqslant \varepsilon$ pour $k, l \geqslant N$ et tout $x$ ; en faisant tendre $l$ vers l'infini, $|f_k(x) - f(x)| \leqslant \varepsilon$ pour $k \geqslant N$. Donc $f$ est bornée et $\|f_k - f\|_\infty \to 0$.

      (ii) Une fonction continue sur un compact a une image compacte, donc bornée ({{t-compact-prop|Parties compactes}}, {{ar-topo|Topologie de ℝ}}).

      Soit $f$ adhérente à $C(K)$, $a \in K$ et $\varepsilon > 0$. La boule $B(f, \varepsilon)$ rencontre $C(K)$ : il existe $g$ continue avec $\|f - g\|_\infty < \varepsilon$, et un voisinage $V$ de $a$ sur lequel $|g(x) - g(a)| < \varepsilon$ ; sur $V$, $|f(x) - f(a)| < 3\varepsilon$. Donc $f$ est continue : $C(K)$ est fermé, et l'on conclut par {{f-evn|Espaces normés}}, (iv), dont la démonstration n'utilise que le sens direct de (i).

      (iii) $\ell^1$ est un espace vectoriel normé, par l'inégalité triangulaire terme à terme. Si $(a^k)$ est de Cauchy, chaque coordonnée l'est, de limite $a_n$.

      Pour $\varepsilon > 0$, soit $K$ tel que $\|a^k - a^l\|_1 \leqslant \varepsilon$ pour $k, l \geqslant K$. Pour $N$ fixé et $k \geqslant K$, on a
      $$\begin{aligned} \sum_{n < N} |a^k_n - a_n| &= \lim_l \sum_{n < N} |a^k_n - a^l_n| \\ &\leqslant \varepsilon ; \end{aligned}$$
      en passant à la borne supérieure sur $N$, $\|a^k - a\|_1 \leqslant \varepsilon$, d'où $a \in \ell^1$ et $a^k \to a$.
    remarques:
      - |
        L'erreur la plus répandue est de croire que tout espace naturel de fonctions est complet. L'espace des fonctions continues sur $[0, 1]$, muni de $\int_0^1 |f|$, ne l'est pas : les fonctions affines par morceaux qui valent $0$ sur $[0, \frac12 - \frac1n]$ et $1$ sur $[\frac12, 1]$ forment une suite de Cauchy dont la « limite » serait l'indicatrice de $[\frac12, 1]$, qui n'est pas continue.

        ```schema f-exemples
        Les rampes $f_3$, $f_4$, $f_6$ et $f_{12}$ montent de $0$ à $1$ sur $[\frac12 - \frac1n, \frac12]$ ; l'aire comprise entre $f_n$ et $f_m$ vaut $\frac12\big|\frac1n - \frac1m\big|$, soit $\frac1{12}$ pour $f_3$ et $f_6$, et tend vers $0$. La « limite », en rouge, saute de $0$ à $1$ en $\frac12$ et n'est donc pas continue.
        ```

        Le complété de cet espace est $L^1$ ({{f-lp|Espaces L¹ et L²}}).

  - id: f-operateurs
    etiquette: Opérateurs continus
    nature: proposition
    titre: Applications linéaires continues et dual topologique
    texte: |
      Pour $u : E \to F$ linéaire entre espaces normés, on pose $|||u||| = \sup\{\|u(x)\| : \|x\| \leqslant 1\}$, éventuellement infini. On note $\lex{espace-applications-continues}{\mathcal L_c}(E, F)$ l'espace des applications linéaires continues, et $\lex{dual-topologique}{E'} = \mathcal L_c(E, \lex{ensemble-reels}{\mathbb R})$ le [[dual-topologique|dual topologique]] de $E$.
    enonce: |
      (i) Pour $u$ linéaire, sont équivalents : $u$ est continue ; $u$ est continue en $0$ ; $|||u||| < +\infty$ ; il existe $C$ tel que $\|u(x)\| \leqslant C\|x\|$ pour tout $x$. On a alors $\|u(x)\| \leqslant |||u|||\,\|x\|$.

      (ii) $|||\cdot|||$ est une norme sur $\mathcal L_c(E, F)$, la [[norme-operateur|norme d'opérateur]], et $|||v \circ u||| \leqslant |||v|||\;|||u|||$.

      (iii) Si $F$ est un espace de Banach, $\mathcal L_c(E, F)$ en est un. En particulier, le dual $E'$ d'un espace normé quelconque est un espace de Banach.
    preuve: |
      (i) Si $u$ est continue en $0$, il existe $\delta > 0$ tel que $\|x\| \leqslant \delta$ entraîne $\|u(x)\| \leqslant 1$ ; par homogénéité, $\|u(x)\| \leqslant \|x\|/\delta$. Si $\|u(x)\| \leqslant C\|x\|$, alors $\|u(x) - u(y)\| \leqslant C\|x - y\|$ et $u$ est continue. L'équivalence avec $|||u||| < +\infty$ et la dernière inégalité s'obtiennent en appliquant $u$ à $x/\|x\|$.

      (ii) Les axiomes se vérifient en chaque $x$ avant de passer à la borne supérieure ; $\|v(u(x))\| \leqslant |||v|||\;|||u|||\,\|x\|$.

      (iii) Si $(u_k)$ est de Cauchy, chaque $(u_k(x))$ l'est, puisque $\|u_k(x) - u_l(x)\| \leqslant |||u_k - u_l|||\,\|x\|$, et converge vers $u(x)$ ; $u$ est linéaire, par passage à la limite.

      Pour $\varepsilon > 0$, soit $N$ tel que $|||u_k - u_l||| \leqslant \varepsilon$ pour $k, l \geqslant N$ ; pour tout $x$, $\|u_k(x) - u_l(x)\| \leqslant \varepsilon\|x\|$ ; en faisant tendre $l$ vers l'infini, $\|u_k(x) - u(x)\| \leqslant \varepsilon\|x\|$. Donc $u - u_k$, puis $u$, est continue, et $|||u_k - u||| \leqslant \varepsilon$. Enfin $\mathbb R$ est complet.
    remarques:
      - |
        En dimension infinie, une application linéaire n'est pas toujours continue. Sur l'espace des polynômes muni de la norme uniforme sur $[0, 1]$, la forme $P \mapsto P'(1)$ envoie $X^n$, de norme $1$, sur $n$ : elle n'est bornée sur aucune boule. En dimension finie, au contraire, toute application linéaire est continue ({{gd-equivalence|Équivalence des normes}}).

  - id: f-lp
    etiquette: Espaces L¹ et L²
    nature: théorème
    titre: Les espaces L¹ et L² et le théorème de Riesz-Fischer
    texte: |
      Soit $(X, \mathcal A, \mu)$ un espace mesuré. On identifie deux fonctions mesurables égales presque partout.

      L'espace $\lex{espace-L1}{L^1}(\mu)$ est formé des classes de fonctions [[integrable-lebesgue|intégrables]], muni de $\|f\|_1 = \int |f| \, d\mu$ ; l'espace $\lex{espace-L2}{L^2}(\mu)$, des classes de fonctions mesurables $f$ telles que $\int f^2 \, d\mu < +\infty$, muni de $\|f\|_2 = \big(\int f^2 \, d\mu\big)^{1/2}$.

      Pour la mesure de comptage sur $\lex{ensemble-entiers-naturels}{\mathbb N}$, on obtient l'espace $\lex{espace-l2-suites}{\ell^2}$ des suites de carré sommable.
    choix: |
      La démonstration de (ii) et (iii) part d'une suite de Cauchy de classes et choisit un représentant de chacune : c'est un usage du [[choix-denombrable]]. Il disparaît lorsque la suite est donnée par des fonctions, par exemple les sommes partielles d'une série de fonctions explicites, comme au nœud {{f-haar|Système de Haar}}.
    enonce: |
      (i) $L^1(\mu)$ est un espace normé. $L^2(\mu)$ est un espace vectoriel ; pour $f, g \in L^2$, $fg$ est intégrable, $\langle f, g \rangle = \int fg \, d\mu$ vérifie l'inégalité de Cauchy-Schwarz $|\langle f, g \rangle| \leqslant \|f\|_2\|g\|_2$, et $\|\cdot\|_2$ est une norme.

      (ii) *Riesz-Fischer.* $L^1(\mu)$ et $L^2(\mu)$ sont des espaces de Banach.

      (iii) Toute suite qui converge dans $L^1$ ou dans $L^2$ a une suite extraite qui converge presque partout.
    preuve: |
      (i) Les opérations et la norme ne dépendent pas du représentant ({{m-integrables|Fonctions intégrables}}, (iii)), et $\|f\|_1 = 0$ entraîne $f = 0$ presque partout ({{m-integrale|Intégrale positive}}, (iv)).

      Pour $L^2$ : $(f + g)^2 \leqslant 2f^2 + 2g^2$ et $|fg| \leqslant \frac12(f^2 + g^2)$.

      Pour tout réel $t$,
      $$\begin{aligned} 0 \leqslant \int (|f| - t|g|)^2 &= \|f\|_2^2 - 2t\int |fg| \\ &\quad + t^2\|g\|_2^2, \end{aligned}$$
      d'où l'inégalité de Cauchy-Schwarz en prenant $t = \int |fg| / \|g\|_2^2$ si $\|g\|_2 \neq 0$, le cas $\|g\|_2 = 0$ étant trivial. Elle donne
      $$\begin{aligned} \|f + g\|_2^2 &\leqslant \|f\|_2^2 + 2\|f\|_2\|g\|_2 \\ &\quad + \|g\|_2^2, \end{aligned}$$
      c'est-à-dire l'inégalité triangulaire.

      (ii) et (iii) Notons $\|\cdot\|$ l'une des deux normes. Soit $(f_n)$ de Cauchy, et $n_k$ le plus petit entier $n > n_{k-1}$ tel que $\|f_m - f_{m'}\| \leqslant 2^{-k}$ pour $m, m' \geqslant n$.

      Posons
      $$g = \sum_k |f_{n_{k+1}} - f_{n_k}|,$$
      à valeurs dans $\lex{demi-droite-achevee}{[0, +\infty]}$. Les sommes partielles $g_K$ croissent vers $g$ et vérifient $\|g_K\| \leqslant \sum_k 2^{-k} \leqslant 2$ ; par convergence monotone, appliquée à $g_K$ ou à $g_K^2$, $\int g$ ou $\int g^2$ est fini.

      Donc $g < +\infty$ presque partout, et la série $f_{n_1} + \sum_k (f_{n_{k+1}} - f_{n_k})$ converge absolument presque partout, vers une fonction $f$, que l'on prend nulle sur le négligeable restant.

      Ainsi $f_{n_k} \to f$ presque partout, et
      $$|f - f_{n_k}| \leqslant \sum_{j \geqslant k} |f_{n_{j+1}} - f_{n_j}|,$$
      dont la norme est au plus $2^{1-k}$ par le même argument : $f$ est dans l'espace et $\|f - f_{n_k}\| \to 0$. Une suite de Cauchy ayant une suite extraite convergente converge.

      Si enfin $f_n \to f$ dans l'espace, la suite est de Cauchy, et la construction fournit une suite extraite qui converge presque partout vers une limite égale à $f$ presque partout.
    remarques:
      - |
        La convergence dans $L^1$ n'entraîne pas la convergence presque partout de la suite entière : la « machine à écrire » du nœud {{p-convergences|Modes de convergence}} tend vers $0$ dans $L^1$ et dans $L^2$ sans converger en aucun point. Seule une suite extraite converge presque partout, comme le dit (iii).
      - |
        Les espaces $L^p$, $1 \leqslant p < +\infty$, se définissent de même avec $\int |f|^p$, et leur théorie repose sur l'inégalité de Hölder. Ils demandent les puissances réelles $|f|^p$, donc l'exponentielle de l'{{anc|analyse complexe}}, qui n'est pas un ancêtre de cette branche ; seuls $L^1$ et $L^2$ sont traités ici.

  - id: f-hilbert
    etiquette: Espaces de Hilbert
    nature: théorème
    titre: Espaces de Hilbert et théorème de projection
    texte: |
      Un **produit scalaire** sur un $\lex{ensemble-reels}{\mathbb R}$-espace vectoriel $H$ est une forme bilinéaire symétrique $\langle \cdot, \cdot \rangle$ telle que $\langle x, x \rangle > 0$ pour $x \neq 0$ ; il définit la norme $\|x\| = \langle x, x \rangle^{1/2}$.

      Un [[espace-hilbert|espace de Hilbert]] est un espace muni d'un produit scalaire et complet pour cette norme. Exemples : $\lex{n-uplet}{\mathbb R^n}$, $\lex{espace-l2-suites}{\ell^2}$, $\lex{espace-L2}{L^2}(\mu)$. L'**orthogonal** d'une partie $A$ est
      $$\begin{aligned} A^\perp = \{x :{} &\langle x, a \rangle = 0 \\ &\text{pour tout } a \in A\}. \end{aligned}$$
    choix: |
      La démonstration du théorème de projection choisit une suite minimisante : c'est un usage du [[choix-denombrable]].
    enonce: |
      (i) $|\langle x, y \rangle| \leqslant \|x\|\,\|y\|$, $\|\cdot\|$ est une norme, et l'**identité du parallélogramme** $\|x + y\|^2 + \|x - y\|^2 = 2\|x\|^2 + 2\|y\|^2$ est vérifiée.

      (ii) *Projection.* Soit $C$ une partie convexe, fermée, non vide d'un espace de Hilbert $H$, et $x \in H$. Il existe un unique $p \in C$ tel que $\|x - p\| = d(x, C) = \inf_{y \in C} \|x - y\|$, et il est caractérisé par $\langle x - p, y - p \rangle \leqslant 0$ pour tout $y \in C$.

      ```schema f-hilbert
      Le projeté $p$ de $x$ sur le convexe $C$ est le point où le cercle de centre $x$ et de rayon $d(x, C)$ touche $C$. Pour tout point $y$ de $C$, ici un sommet, le vecteur $y - p$ fait avec $x - p$ un angle droit ou obtus : c'est l'inégalité $\langle x - p, y - p \rangle \leqslant 0$.
      ```

      (iii) Si $F$ est un sous-espace fermé, la projection $p_F$ sur $F$ est linéaire, $x - p_F(x) \in F^\perp$, et $H = F \oplus F^\perp$. De plus $F^{\perp\perp} = F$.
    preuve: |
      (i) Comme au nœud {{f-lp|Espaces L¹ et L²}}, en développant $\|x - ty\|^2 \geqslant 0$ ; le parallélogramme s'obtient en développant les deux carrés.

      (ii) Soit $d = d(x, C)$, et choisissons $y_n \in C$ tels que $\|x - y_n\|^2 \leqslant d^2 + \frac1{n+1}$. Par le parallélogramme appliqué à $x - y_n$ et $x - y_m$, et puisque $\frac{y_n + y_m}2 \in C$ par convexité,
      $$\begin{aligned} \|y_n - y_m\|^2 &= 2\|x - y_n\|^2 + 2\|x - y_m\|^2 \\ &\quad - 4\Big\|x - \frac{y_n + y_m}{2}\Big\|^2 \\ &\leqslant \frac{2}{n+1} + \frac{2}{m+1}. \end{aligned}$$
      La suite est de Cauchy, converge vers un $p$ qui est dans $C$, fermé, et $\|x - p\| = d$ par continuité de la norme.

      ```schema f-hilbert-2
      Les points $y_n$ et $y_m$ sont dans $C$ et dans le disque des points presque minimisants (cercle en trait plein), alors qu'aucun point de $C$ n'est à distance $< d$ de $x$ (cercle pointillé). Leur milieu, en bleu, est dans $C$ par convexité, si bien que la diagonale bleue du parallélogramme construit sur $x - y_n$ et $x - y_m$ mesure au moins $2d$ ; l'identité du parallélogramme force alors l'autre diagonale, $y_n - y_m$ en rouge, à être courte.
      ```

      Le même calcul, appliqué à deux points réalisant la distance, montre qu'ils sont égaux.

      Pour $y \in C$ et $t \in \,]0, 1]$, $p + t(y - p) \in C$, d'où
      $$\begin{aligned} \|x - p\|^2 &\leqslant \|x - p - t(y - p)\|^2 \\ &= \|x - p\|^2 - 2t\langle x - p, y - p \rangle \\ &\quad + t^2\|y - p\|^2 ; \end{aligned}$$
      en divisant par $t$ et en faisant tendre $t$ vers $0$, $\langle x - p, y - p \rangle \leqslant 0$.

      Réciproquement, cette inégalité donne
      $$\begin{aligned} \|x - y\|^2 &= \|x - p\|^2 - 2\langle x - p, y - p \rangle \\ &\quad + \|y - p\|^2 \\ &\geqslant \|x - p\|^2. \end{aligned}$$

      (iii) Pour un sous-espace, on applique la caractérisation à $y = p \pm z$, $z \in F$ : $\langle x - p, z \rangle = 0$, donc $x - p \in F^\perp$. Réciproquement, un $p \in F$ tel que $x - p \in F^\perp$ vérifie la caractérisation : c'est la projection.

      La linéarité en découle, puisque $\lambda p_F(x) + \mu p_F(y)$ vérifie cette condition pour $\lambda x + \mu y$. On a $x = p_F(x) + (x - p_F(x))$ et $F \cap F^\perp = \{0\}$.

      Enfin $F \subset F^{\perp\perp}$, et si $x \in F^{\perp\perp}$, $x - p_F(x)$ est à la fois dans $F^\perp$ et dans $F^{\perp\perp}$, donc orthogonal à lui-même, et nul.
    remarques:
      - |
        L'hypothèse que $F$ est fermé est indispensable. Dans $\ell^2$, le sous-espace des suites à support fini est dense et distinct de $\ell^2$ ; son orthogonal est $\{0\}$, si bien que $F \oplus F^\perp \neq \ell^2$ et $F^{\perp\perp} = \ell^2 \neq F$.
      - |
        La norme de $\lex{espace-L1}{L^1}$ ne vérifie pas l'identité du parallélogramme : sur $\ell^1$, $x = (1, 0, 0, \dots)$ et $y = (0, 1, 0, \dots)$ donnent $\|x + y\|_1^2 + \|x - y\|_1^2 = 8$ et $2\|x\|_1^2 + 2\|y\|_1^2 = 4$. Elle ne provient donc d'aucun produit scalaire, et le théorème de projection y est faux en général.

  - id: f-riesz
    etiquette: Théorème de Riesz
    nature: théorème
    titre: Théorème de représentation de Riesz
    choix: |
      L'existence utilise $F^\perp \neq \{0\}$, tiré du théorème de projection ({{f-hilbert|Espaces de Hilbert}}, (iii)), dont la démonstration choisit une suite minimisante : c'est un usage du [[choix-denombrable]].
    enonce: |
      Soit $H$ un espace de Hilbert. Pour toute forme linéaire continue $\varphi \in H'$, il existe un unique $a \in H$ tel que $\varphi(x) = \langle a, x \rangle$ pour tout $x$, et $|||\varphi||| = \|a\|$. L'application $a \mapsto \langle a, \cdot \rangle$ est une bijection linéaire isométrique de $H$ sur $H'$.
    preuve: |
      Par Cauchy-Schwarz, $\langle a, \cdot \rangle$ est continue, de norme au plus $\|a\|$, atteinte en $x = a$. Si $\langle a, \cdot \rangle = \langle a', \cdot \rangle$, en évaluant en $a - a'$ on trouve $\|a - a'\|^2 = 0$.

      Pour l'existence, si $\varphi = 0$, $a = 0$ convient. Sinon, le noyau $F$ de $\varphi$ est un sous-espace fermé, image réciproque de $\{0\}$, distinct de $H$ ; par le théorème de projection ({{f-hilbert|Espaces de Hilbert}}, (iii)), $F^\perp \neq \{0\}$.

      Soit $z \in F^\perp$ non nul ; quitte à le diviser par $\varphi(z)$, qui n'est pas nul puisque $z \notin F$, on suppose $\varphi(z) = 1$. Pour tout $x$, $x - \varphi(x)z \in F$, donc $\langle x - \varphi(x)z, z \rangle = 0$, c'est-à-dire
      $$\varphi(x) = \langle z/\|z\|^2, x \rangle.$$
    remarques:
      - |
        Le théorème identifie un espace de Hilbert à son dual, ce qu'aucun autre espace de Banach n'autorise en général. Le dual de $\ell^1$, par exemple, est $\ell^\infty$, l'espace des suites bornées, qui est strictement plus gros. C'est cette identification qui rend les espaces de Hilbert si commodes pour résoudre des équations, par exemple au moyen du théorème de Lax-Milgram.

  - id: f-bases-hilbertiennes
    etiquette: Bases hilbertiennes
    nature: théorème
    titre: Familles orthonormales et bases hilbertiennes
    texte: |
      Une famille $(e_i)_{i \in I}$ d'un espace de Hilbert $H$ est **orthonormale** si $\langle e_i, e_j \rangle$ vaut $1$ pour $i = j$ et $0$ sinon. C'est une [[base-hilbertienne|base hilbertienne]] si, de plus, le sous-espace qu'elle engendre est dense dans $H$.
    choix: |
      L'existence d'une famille orthonormale maximale dans un espace quelconque, en (iv), repose sur le [[lemme-zorn|lemme de Zorn]]. Les points (i) à (iii) ne font aucun choix : en (ii), la projection sur $F$ est obtenue directement comme somme de la série, sans le théorème de projection et sa suite minimisante. Dans un espace séparable, une suite dense étant fixée, le procédé de Gram-Schmidt construit donc une base hilbertienne sans aucun choix.
    enonce: |
      (i) *Bessel.* Pour toute famille orthonormale et tout $x$, $\sum_{i \in I} \langle x, e_i \rangle^2 \leqslant \|x\|^2$, la somme étant prise dans $\lex{demi-droite-achevee}{[0, +\infty]}$.

      (ii) Soit $(e_n)_{n \in \lex{ensemble-entiers-naturels}{\mathbb N}}$ orthonormale. Pour tout $x$, la série $\sum_n \langle x, e_n \rangle e_n$ converge, vers la projection de $x$ sur l'adhérence $F$ du sous-espace engendré. Sont équivalents : $(e_n)$ est une base hilbertienne ; $x = \sum_n \langle x, e_n \rangle e_n$ pour tout $x$ ; *Parseval* : $\|x\|^2 = \sum_n \langle x, e_n \rangle^2$ pour tout $x$ ; le seul vecteur orthogonal à tous les $e_n$ est $0$.

      (iii) *Gram-Schmidt.* Si $H$ contient une suite dense, il a une base hilbertienne finie ou indexée par $\mathbb N$.

      (iv) Tout espace de Hilbert a une famille orthonormale maximale, et le seul vecteur orthogonal à tous ses éléments est $0$.
    preuve: |
      (i) Pour $J \subset I$ fini, $x - \sum_{j \in J} \langle x, e_j \rangle e_j$ est orthogonal à chaque $e_j$, d'où, en développant,
      $$\begin{aligned} \|x\|^2 &= \Big\|x - \sum_J \langle x, e_j \rangle e_j\Big\|^2 \\ &\quad + \sum_J \langle x, e_j \rangle^2 \\ &\geqslant \sum_J \langle x, e_j \rangle^2. \end{aligned}$$
      On passe à la borne supérieure sur $J$.

      (ii) Pour $p < q$, on a
      $$\Big\|\sum_{p < n \leqslant q} \langle x, e_n \rangle e_n\Big\|^2 = \sum_{p < n \leqslant q} \langle x, e_n \rangle^2,$$
      reste d'une série convergente par (i) : les sommes partielles forment une suite de Cauchy, de limite $s \in F$.

      Pour tout $k$,
      $$\begin{aligned} \langle x - s, e_k \rangle &= \lim_N \langle x - \sum_{n \leqslant N} \langle x, e_n \rangle e_n, e_k \rangle \\ &= 0, \end{aligned}$$
      donc $x - s$ est orthogonal à l'espace engendré, et par continuité à $F$.

      Pour $y \in F$, le vecteur $s - y$ est dans $F$, donc orthogonal à $x - s$, et
      $$\|x - y\|^2 = \|x - s\|^2 + \|s - y\|^2.$$
      Ainsi $s$ est l'unique point de $F$ le plus proche de $x$ : c'est la projection $p_F(x)$ ({{f-hilbert|Espaces de Hilbert}}, (ii)), obtenue ici sans suite minimisante.

      Si $F = H$, le vecteur $x - s$ est orthogonal à lui-même, donc $s = x$ ; alors $\|x\|^2 = \lim \|S_N\|^2 = \sum \langle x, e_n \rangle^2$. Parseval entraîne que le seul vecteur orthogonal à tous les $e_n$ est nul, puisqu'il a une norme nulle. Enfin, si cette dernière condition est vérifiée, elle s'applique à $x - s$ : on a $x = s \in F$ pour tout $x$, donc $F = H$.

      (iii) Soit $(x_k)$ dense. On parcourt la suite en ne retenant que les $x_k$ qui ne sont pas dans l'espace engendré par les précédents ; on obtient une suite $(y_m)$, finie ou non, de même espace engendré, dont toute sous-famille finie est libre.

      On pose $e_0 = y_0/\|y_0\|$ et $e_{m} = z_m/\|z_m\|$, où
      $$z_m = y_m - \sum_{j < m} \langle y_m, e_j \rangle e_j$$
      est non nul. Les $e_m$ sont orthonormaux et engendrent le même espace que les $x_k$, qui est dense.

      (iv) Les familles orthonormales, vues comme parties de $H$, forment un ensemble ordonné par inclusion, où la réunion d'une chaîne est encore orthonormale. Le lemme de Zorn donne une famille maximale. Si $x \neq 0$ était orthogonal à tous ses éléments, on pourrait lui adjoindre $x/\|x\|$.
    remarques:
      - |
        Dans $\lex{espace-l2-suites}{\ell^2}$, les suites $e_n$, nulles sauf un $1$ en position $n$, forment une base hilbertienne, et Parseval n'est autre que la définition de la norme. L'erreur la plus répandue est de confondre base hilbertienne et base algébrique : un élément de $\ell^2$ comme $(1, \frac12, \frac13, \dots)$ n'est pas combinaison linéaire **finie** des $e_n$ ; il en est seulement la somme d'une série convergente.
      - |
        Dans $\lex{espace-L2}{L^2}([0, 1])$, pour la mesure de Lebesgue, le système de Haar, formé des fonctions valant $\pm 2^{j/2}$ sur les deux moitiés d'un intervalle dyadique de longueur $2^{-j}$ et nulles ailleurs, complété par la constante $1$, est une base hilbertienne : c'est le théorème de Haar, démontré au nœud suivant ({{f-haar|Système de Haar}}) au moyen du critère (ii). Le système trigonométrique, plus célèbre, demande les fonctions $\cos$ et $\sin$ de l'{{anc|analyse complexe}}.

  - id: f-haar
    etiquette: Système de Haar
    nature: théorème
    titre: Le système de Haar est une base hilbertienne de L²([0, 1])
    texte: |
      On munit $[0, 1]$ de la tribu des parties mesurables au sens de Lebesgue et de la [[mesure-lebesgue|mesure de Lebesgue]] $\lambda$, et l'on note $L^2 = \lex{espace-L2}{L^2}([0, 1])$. Le point $1$ étant [[negligeable|négligeable]], il suffit qu'une fonction soit définie sur $[0, 1[$.

      Pour $j \in \lex{ensemble-entiers-naturels}{\mathbb N}$ et $0 \leqslant k < 2^j$, l'[[intervalle-dyadique|intervalle dyadique]] de rang $j$ et d'indice $k$ est
      $$I_{j,k} = [k2^{-j}, (k+1)2^{-j}[.$$
      Ses deux moitiés sont $I_{j+1,2k}$ et $I_{j+1,2k+1}$. La fonction de Haar associée est
      $$h_{j,k} = 2^{j/2}\big(\mathbf 1_{I_{j+1,2k}} - \mathbf 1_{I_{j+1,2k+1}}\big),$$
      où $2^{j/2}$ désigne $(\sqrt 2)^j$.

      Le [[systeme-haar|système de Haar]] est la famille des $h_{j,k}$. On le complète par la constante $1$ et on l'indexe par $\mathbb N$ en posant $e_0 = 1$ et $e_{2^j + k} = h_{j,k}$ : tout entier $n \geqslant 1$ s'écrit d'une seule manière $2^j + k$ avec $0 \leqslant k < 2^j$, $j$ étant l'unique entier tel que $2^j \leqslant n < 2^{j+1}$.
    choix: |
      La démonstration de (iv) fait appel au choix en un seul endroit, la quatrième étape, par la régularité de la mesure de Lebesgue ({{m-regularite|Régularité de λ}}), qui choisit des recouvrements : c'est le [[choix-denombrable]]. Le développement en série est établi directement, sans le théorème de projection, qui choisit une suite minimisante ; et la complétude de $L^2$ n'y est appliquée qu'aux sommes partielles, fonctions en escalier explicites, ce qui dispense de choisir des représentants ({{f-lp|Espaces L¹ et L²}}). Pour la tribu borélienne de $[0, 1]$, la quatrième étape devient inutile, et il ne reste que le choix dénombrable qui sert à construire $\lambda$.
    enonce: |
      (i) Deux intervalles dyadiques sont disjoints ou emboîtés. Plus précisément, pour chaque rang $j$, les $I_{j,k}$ forment une partition de $[0, 1[$, et si $i \leqslant j$, l'intervalle $I_{j,l}$ est contenu dans $I_{i,k}$ pour $k = \lfloor l/2^{j-i} \rfloor$.

      (ii) La famille $(e_n)_{n \in \mathbb N}$ est orthonormale dans $L^2$.

      ```schema f-haar
      Les fonctions de rang $2$ vivent chacune sur une moitié d'un intervalle de rang $1$. Sur le support de $h_{2,1}$, la bande rouge $[\frac14, \frac12[$, les fonctions $h_{0,0}$ et $h_{1,0}$ sont constantes, égales à $1$ et à $-\sqrt 2$ : leur produit scalaire avec $h_{2,1}$ est cette constante multipliée par $\int h_{2,1} = 0$.
      ```

      (iii) Pour tout $j$, le sous-espace $V_j$ engendré par $1$ et les $h_{i,k}$ avec $i < j$ est engendré par les $2^j$ indicatrices $\mathbf 1_{I_{j,k}}$ : c'est l'espace des fonctions constantes sur chaque intervalle dyadique de rang $j$. La somme partielle
      $$S_j f = \sum_{n < 2^j} \langle f, e_n \rangle\, e_n$$
      vaut, sur chaque $I_{j,k}$, la moyenne $2^j \int_{I_{j,k}} f \, d\lambda$ de $f$ sur cet intervalle.

      (iv) *Théorème de Haar.* La famille $(e_n)$ est une [[base-hilbertienne|base hilbertienne]] de $L^2$. Pour tout $f \in L^2$, on a donc, au sens de la convergence dans $L^2$ et dans l'ordre des $e_n$,
      $$f = \langle f, 1 \rangle + \sum_{j \geqslant 0} \sum_{k < 2^j} \langle f, h_{j,k} \rangle\, h_{j,k},$$
      et l'égalité de Parseval $\|f\|_2^2 = \langle f, 1 \rangle^2 + \sum_{j,k} \langle f, h_{j,k} \rangle^2$.
    preuve: |
      (i) Pour $x \in [0, 1[$, on a $x \in I_{j,l}$ si et seulement si $l \leqslant 2^j x < l + 1$, c'est-à-dire $l = \lfloor 2^j x \rfloor$, la partie entière, qui existe parce que $\lex{ensemble-reels}{\mathbb R}$ est [[archimedien]]. Comme $0 \leqslant 2^j x < 2^j$, cet entier est compris entre $0$ et $2^j - 1$ : chaque point de $[0, 1[$ est dans un et un seul intervalle de rang $j$.

      Montrons que, pour $t \geqslant 0$ réel et $m \geqslant 1$ entier, $\lfloor t/m \rfloor = \lfloor \lfloor t \rfloor / m \rfloor$. Soit $n = \lfloor t \rfloor$ et $q = \lfloor n/m \rfloor$. On a $qm \leqslant n \leqslant t$, et $n < (q + 1)m$ entraîne $n + 1 \leqslant (q + 1)m$ entre entiers, d'où $t < n + 1 \leqslant (q + 1)m$. Ainsi $q \leqslant t/m < q + 1$.

      Pour $x \in I_{j,l}$ et $i \leqslant j$, appliquons cette égalité à $t = 2^j x$ et $m = 2^{j-i}$ :
      $$\lfloor 2^i x \rfloor = \Big\lfloor \frac{\lfloor 2^j x \rfloor}{2^{j-i}} \Big\rfloor = \Big\lfloor \frac{l}{2^{j-i}} \Big\rfloor.$$
      Tous les points de $I_{j,l}$ sont donc dans le même intervalle de rang $i$, celui d'indice $\lfloor l/2^{j-i} \rfloor$, et $I_{j,l}$ ne rencontre aucun autre intervalle de rang $i$.

      (ii) Les fonctions $e_n$ sont boréliennes et bornées, donc de carré intégrable sur $[0, 1]$. Un intervalle $[a, b[$ ne diffère de $]a, b]$ que par deux points, négligeables, si bien que $\lambda(I_{j,k}) = 2^{-j}$ ({{m-lebesgue|Mesure de Lebesgue}}, (ii) et (iv)).

      On a $\|1\|_2 = 1$. Les deux moitiés de $I_{j,k}$ étant disjointes, $h_{j,k}^2 = 2^j\, \mathbf 1_{I_{j,k}}$, d'intégrale $2^j \cdot 2^{-j} = 1$. Enfin
      $$\langle 1, h_{j,k} \rangle = 2^{j/2}\big(2^{-j-1} - 2^{-j-1}\big) = 0.$$

      Soient $(i, k) \neq (j, l)$, avec, quitte à les échanger, $i \leqslant j$. Si $I_{i,k}$ et $I_{j,l}$ sont disjoints, $h_{i,k} h_{j,l} = 0$. Sinon, par (i), $I_{j,l} \subset I_{i,k}$, et $i < j$, puisque deux intervalles distincts de même rang sont disjoints.

      Toujours par (i), $I_{j,l}$ est alors contenu dans un seul intervalle de rang $i + 1$ ; celui-ci rencontre $I_{i,k}$, donc y est contenu, et c'est l'une de ses deux moitiés. Sur cette moitié, $h_{i,k}$ est constante, égale à un réel $c$, et
      $$\langle h_{i,k}, h_{j,l} \rangle = c \int h_{j,l} \, d\lambda = c\, \langle 1, h_{j,l} \rangle = 0.$$

      (iii) Notons $W_j$ le sous-espace engendré par les $\mathbf 1_{I_{j,k}}$, $k < 2^j$.

      *$V_j \subset W_j$.* Par (i), $1 = \sum_k \mathbf 1_{I_{j,k}}$ presque partout. Pour $i < j$, la fonction $h_{i,k}$ est combinaison de deux indicatrices d'intervalles de rang $i + 1 \leqslant j$. Chacune est la somme des indicatrices des intervalles de rang $j$ qu'il contient, car, par (i), tout point d'un intervalle $I$ de rang $i + 1$ est dans un intervalle de rang $j$, qui rencontre $I$ et lui est donc contenu.

      *$W_j \subset V_j$*, par récurrence sur $j$. Pour $j = 0$, $\mathbf 1_{I_{0,0}} = \mathbf 1_{[0, 1[}$ est égale à $1$ presque partout. Si $W_j \subset V_j$, les identités
      $$\begin{aligned} \mathbf 1_{I_{j+1,2k}} &= \tfrac12\big(\mathbf 1_{I_{j,k}} + 2^{-j/2} h_{j,k}\big), \\ \mathbf 1_{I_{j+1,2k+1}} &= \tfrac12\big(\mathbf 1_{I_{j,k}} - 2^{-j/2} h_{j,k}\big), \end{aligned}$$
      qui se vérifient sur chaque moitié de $I_{j,k}$, montrent que $W_{j+1} \subset V_j + \operatorname{Vect}(h_{j,k})_k = V_{j+1}$.

      *Sommes partielles.* La fonction $S_j f$ appartient à $V_j = W_j$, donc vaut une constante $c_k$ sur chaque $I_{j,k}$. Pour $m < 2^j$, l'orthonormalité donne
      $$\langle f - S_j f, e_m \rangle = \langle f, e_m \rangle - \langle f, e_m \rangle = 0,$$
      si bien que $f - S_j f$ est orthogonale à $V_j$, qui contient $\mathbf 1_{I_{j,k}}$. Ainsi $\int_{I_{j,k}} f \, d\lambda = \int_{I_{j,k}} S_j f \, d\lambda = c_k\, 2^{-j}$.

      (iv) Montrons d'abord que le seul $f \in L^2$ orthogonal à tous les $e_n$ est $0$ ; on en déduira le développement en série à la fin. Soit $f$ un tel vecteur.

      *Première étape : $\int_I f \, d\lambda = 0$ pour tout intervalle dyadique $I$.* En effet $\mathbf 1_I$ appartient à un $V_j$ par (iii), donc est combinaison linéaire finie des $e_n$, et $\int_I f \, d\lambda = \langle f, \mathbf 1_I \rangle = 0$.

      *Deuxième étape : deux mesures finies.* La fonction $f$ est intégrable sur $[0, 1]$, puisque le produit de $f$ et de la constante $1$, toutes deux de carré intégrable, l'est ({{f-lp|Espaces L¹ et L²}}, (i)). Posons, pour $A \subset [0, 1[$ mesurable,
      $$\begin{aligned} \nu^+(A) &= \int_A f^+ \, d\lambda, \\ \nu^-(A) &= \int_A f^- \, d\lambda. \end{aligned}$$
      Ce sont des mesures ({{m-beppo-levi|Convergence monotone}}, (iii)), finies, et la première étape s'écrit $\nu^+(I) = \nu^-(I)$ pour tout intervalle dyadique $I$ ({{m-integrables|Fonctions intégrables}}).

      *Troisième étape : $\nu^+$ et $\nu^-$ coïncident sur les boréliens contenus dans $[0, 1[$.* Par (i), l'ensemble $\mathcal C$ formé du vide et des intervalles dyadiques est un π-système sur $[0, 1[$ : l'intersection de deux d'entre eux est vide ou égale au plus petit.

      Soit $O$ un ouvert de $\mathbb R$ et $x \in O \cap [0, 1[$. Il existe $r > 0$ tel que $O$ contienne $]x - r, x + r[$, puis, $\mathbb R$ étant archimédien, un rang $j$ tel que $2^{-j} < r$. L'intervalle $I_{j, \lfloor 2^j x \rfloor}$ contient $x$, est de longueur $2^{-j}$, donc est contenu dans $]x - r, x + r[$, puis dans $O$.

      Ainsi $O \cap [0, 1[$ est la réunion des intervalles dyadiques contenus dans $O$. Ceux-ci sont indexés par une partie de $\mathbb N \times \mathbb N$, qui est dénombrable ({{q-denombrable|ℚ est dénombrable}}), et $O \cap [0, 1[$ appartient à la tribu $\sigma(\mathcal C)$.

      Appliqué à l'inclusion $\iota$ de $[0, 1[$ dans $\mathbb R$, le point (iv) du nœud {{m-tribus|Tribus}} montre que les $B \subset \mathbb R$ dont la trace $B \cap [0, 1[$ appartient à $\sigma(\mathcal C)$ forment une tribu. Elle contient les ouverts, donc la [[tribu-borelienne|tribu borélienne]] : tout borélien contenu dans $[0, 1[$ appartient à $\sigma(\mathcal C)$.

      Les intervalles dyadiques sont boréliens, donc mesurables au sens de Lebesgue ({{m-lebesgue|Mesure de Lebesgue}}, (iii)) : la tribu $\sigma(\mathcal C)$ est contenue dans celle des parties de $[0, 1[$ mesurables au sens de Lebesgue, sur laquelle $\nu^+$ et $\nu^-$ sont définies.

      Le lemme de Dynkin ({{m-dynkin|Classes monotones}}, (ii)), appliqué sur $[0, 1[$ avec la suite constante $X_n = I_{0,0}$, c'est-à-dire $[0, 1[$, élément de $\mathcal C$ de mesures finies égales, donne $\nu^+ = \nu^-$ sur $\sigma(\mathcal C)$, donc sur tout borélien contenu dans $[0, 1[$.

      *Quatrième étape : $f = 0$.* L'ensemble $A$ des $x \in [0, 1[$ tels que $f(x) > 0$ est mesurable au sens de Lebesgue, mais pas nécessairement borélien. Par la régularité de la mesure de Lebesgue ({{m-regularite|Régularité de λ}}, (i)), il existe un borélien $B$, que l'on peut supposer contenu dans $[0, 1[$, tel que $A \subset B$ et $\lambda(B \setminus A) = 0$.

      Les fonctions $f^\pm \mathbf 1_{B \setminus A}$ sont nulles presque partout, donc $\nu^\pm(B \setminus A) = 0$ ({{m-integrale|Intégrale positive}}, (iv)). Comme $f^- = 0$ sur $A$,
      $$\nu^+(A) = \nu^+(B) = \nu^-(B) = \nu^-(A) = 0.$$

      Donc $f^+ \mathbf 1_A$ est nulle presque partout ; or $f^+$ est nulle hors de $A$ sur $[0, 1[$, et $f^+ = 0$ presque partout. Le vecteur $-f$ est lui aussi orthogonal à tous les $e_n$, si bien que $f^- = (-f)^+ = 0$ presque partout. Finalement $f = 0$ dans $L^2$.

      *Conclusion.* Soit maintenant $f \in L^2$ quelconque, et $S_N = \sum_{n < N} \langle f, e_n \rangle e_n$. Pour $p < q$, l'orthonormalité donne
      $$\|S_q - S_p\|_2^2 = \sum_{p \leqslant n < q} \langle f, e_n \rangle^2,$$
      reste d'une série convergente par l'inégalité de Bessel ({{f-bases-hilbertiennes|Bases hilbertiennes}}, (i)). La suite $(S_N)$ est donc de Cauchy ; ses termes sont des fonctions en escalier explicites, et elle converge dans $L^2$, complet ({{f-lp|Espaces L¹ et L²}}, (ii)), vers un $s$.

      Par l'inégalité de Cauchy-Schwarz, le produit scalaire est continu, et pour tout $m$
      $$\langle f - s, e_m \rangle = \lim_N \langle f - S_N, e_m \rangle = 0.$$
      Par ce qui précède, $f - s = 0$ : $f$ est la somme de la série. Le sous-espace engendré par les $e_n$, qui contient les $S_N$, est donc dense, et $(e_n)$ est une base hilbertienne. Enfin $\|S_N\|_2^2 = \sum_{n < N} \langle f, e_n \rangle^2$ tend vers $\|f\|_2^2$ par continuité de la norme, ce qui est l'égalité de Parseval.
    remarques:
      - |
        Pour $f(x) = x$, on a $\langle f, 1 \rangle = \frac12$. Sur $I_{j,k}$, dont les moitiés ont pour longueur $\delta = 2^{-j-1}$, l'intégrale de $x$ sur la seconde moitié dépasse celle sur la première de $\delta^2$, d'où
        $$\langle f, h_{j,k} \rangle = -2^{j/2} \cdot 2^{-2j-2} = -\tfrac14\, 2^{-3j/2},$$
        indépendamment de $k$, parce que la pente de $f$ est la même partout.

        L'égalité de Parseval se vérifie alors directement :
        $$\begin{aligned} \frac14 + \sum_{j \geqslant 0} 2^j \cdot \frac{2^{-3j}}{16} &= \frac14 + \frac1{16} \cdot \frac43 \\ &= \frac13 = \int_0^1 x^2 \, dx. \end{aligned}$$

        ```schema f-haar-2
        Les sommes partielles $S_1 f$ (gris), $S_2 f$ (vert) et $S_3 f$ (bleu) de la série de Haar de $f(x) = x$ sont les fonctions en escalier qui valent, sur chaque intervalle dyadique de rang $j$, la moyenne de $f$, c'est-à-dire sa valeur au milieu. À chaque rang, le pas est divisé par deux, et l'écart quadratique $\|f - S_j f\|_2$ aussi.
        ```

        Le reste de la série mesure l'erreur commise par $S_j f$ :
        $$\|f - S_j f\|_2^2 = \sum_{i \geqslant j} 2^i \cdot \frac{2^{-3i}}{16} = \frac{4^{-j}}{12}.$$
        C'est bien la somme, sur les $2^j$ intervalles de longueur $2^{-j}$, de l'intégrale $\frac{(2^{-j})^3}{12}$ de $(x - m)^2$ autour du milieu $m$. L'erreur $\|f - S_j f\|_2 = \frac{2^{-j}}{2\sqrt 3}$ est donc proportionnelle au pas : une fonction régulière est approchée au premier ordre seulement, ce qui est le prix d'une approximation constante par morceaux.
      - |
        L'erreur la plus répandue est d'oublier la constante $1$. Chaque $h_{j,k}$ est d'intégrale nulle, si bien que la fonction $1$ est orthogonale à tout le système de Haar : celui-ci, seul, n'est pas total, et il n'engendre un sous-espace dense que dans l'orthogonal des constantes, formé des fonctions d'intégrale nulle.
      - |
        La démonstration n'utilise pas la densité des fonctions en escalier dans $L^2$, établie plus loin, pour la tribu borélienne ({{fo-densite|Densité}}) ; elle passe par l'unicité des mesures. Les trois premières étapes ne donnent l'égalité de $\nu^+$ et $\nu^-$ que sur les boréliens, et la quatrième est indispensable, car l'ensemble $\{f > 0\}$ peut ne pas être borélien quand $f$ est seulement mesurable au sens de Lebesgue : l'indicatrice d'une partie non borélienne de l'ensemble de Cantor, évoquée au nœud {{m-riemann|Riemann et Lebesgue}} et dont l'existence est admise ici, en donne un exemple. C'est la régularité de la mesure de Lebesgue qui comble cet écart.
      - |
        Les deux cadres n'en font d'ailleurs qu'un : le $L^2$ de la tribu de Lebesgue sur $[0, 1]$, employé ici, et celui de la tribu borélienne, employé au nœud {{fo-densite|Densité}}, sont le même espace. Envoyons la classe d'une fonction borélienne de carré intégrable sur sa classe pour la tribu de Lebesgue. C'est bien défini, car un borélien négligeable l'est pour les deux tribus, et c'est linéaire.

        Les intégrales sont conservées : pour une fonction borélienne positive, les intégrales relatives aux deux tribus sont toutes deux la limite des intégrales des fonctions étagées $s_n$ du nœud {{m-etagees|Fonctions étagées}}, qui sont boréliennes, par convergence monotone ({{m-beppo-levi|Convergence monotone}}). L'application conserve donc la norme, et elle est injective.

        Elle est surjective, car toute $f : [0, 1] \to \mathbb R$ mesurable au sens de Lebesgue est presque partout égale à une fonction borélienne $h$, qui a la même intégrale de carré ({{m-integrables|Fonctions intégrables}}, (iii)).

        Pour chaque rationnel $r$, choisissons par {{m-regularite|Régularité de λ}}, (ii), un borélien $C_r \subset A_r = \{f > r\}$ tel que $\lambda(A_r \setminus C_r) = 0$ : c'est un nouvel usage du [[choix-denombrable]]. La réunion $N$ des $A_r \setminus C_r$ est négligeable, $\lex{ensemble-rationnels}{\mathbb Q}$ étant dénombrable.

        Posons $g(x) = \sup\{r \in \mathbb Q : x \in C_r\}$, dans la droite achevée, avec $\sup \varnothing = -\infty$. Pour tout réel $a$,
        $$\{g > a\} = \bigcup_{r > a} C_r$$
        est borélien, comme réunion dénombrable, et l'ensemble $E$ où $g$ est finie l'est aussi, puisque $\{g = +\infty\} = \bigcap_n \{g > n\}$ et que $\{g = -\infty\}$ est le complémentaire de $\bigcup_n \{g > -n\}$.

        Hors de $N$, on a $x \in C_r$ si et seulement si $f(x) > r$, d'où $g(x) = \sup\{r \in \mathbb Q : r < f(x)\} = f(x)$ par densité de $\mathbb Q$. La fonction $h$ égale à $g$ sur $E$ et à $0$ ailleurs est borélienne, puisque $\{h > a\}$ vaut $\{g > a\} \cap E$, augmenté du complémentaire de $E$ si $a < 0$ ; et $h = f$ hors de $N$.
      - |
        Pour $f$ continue sur $[0, 1]$, les sommes partielles $S_j f$ convergent même uniformément vers $f$. Pour $x \in I_{j,k}$, par (iii),
        $$\begin{aligned} &|S_j f(x) - f(x)| \\ &\quad = \Big|2^j \int_{I_{j,k}} \big(f(y) - f(x)\big) \, dy\Big|, \end{aligned}$$
        majoré par la borne supérieure de $|f(y) - f(x)|$ pour $|y - x| \leqslant 2^{-j}$, qui tend vers $0$ uniformément en $x$ par le théorème de Heine ({{c-heine|Théorème de Heine}}).

        La série de Fourier d'une fonction continue, au contraire, peut diverger en un point : Paul du Bois-Reymond en a construit un exemple, annoncé en 1873 dans les *Göttinger Nachrichten* et publié en détail en 1876 ({{fourier|Analyse de Fourier}}). Haar a introduit son système dans sa thèse, soutenue à Göttingen en 1909 sous la direction de Hilbert, et l'a publié en 1910 (« Zur Theorie der orthogonalen Funktionensysteme », *Math. Ann.* 69, p. 331-371).
      - |
        Les sommes $S_j f$ sont les espérances conditionnelles de $f$ sachant la tribu engendrée par les intervalles dyadiques de rang $j$ : elles forment une martingale pour la mesure de probabilité $\lambda$ sur $[0, 1[$, bornée dans $L^1$ puisque $\|S_j f\|_1 \leqslant \|f\|_1$.

        Le théorème de convergence des martingales bornées dans $L^1$ ({{mt-doob-l1|Martingales bornées dans L¹}}) montre qu'elle converge presque partout, et sa limite est $f$, car une suite extraite converge presque partout vers la limite $f$ dans $L^2$ ({{f-lp|Espaces L¹ et L²}}, (iii)).

        La série de Haar converge donc presque partout, et non seulement en moyenne quadratique, pour les sommes partielles d'indices $2^j$.

  - id: f-hahn-banach
    etiquette: Hahn-Banach
    nature: théorème
    titre: Théorème de Hahn-Banach
    texte: |
      Une application $q : E \to \lex{ensemble-reels}{\mathbb R}$ est **sous-linéaire** si $q(x + y) \leqslant q(x) + q(y)$ et $q(tx) = t\,q(x)$ pour tous $x, y$ et $t \geqslant 0$. Une norme en est un exemple.
    choix: |
      La démonstration utilise le [[lemme-zorn|lemme de Zorn]]. Le théorème découle déjà du lemme de l'[[ultrafiltre]], lui-même strictement plus faible que l'axiome du choix (J. D. Halpern et A. Lévy, « The Boolean prime ideal theorem does not imply the axiom of choice », *Axiomatic Set Theory*, Proc. Sympos. Pure Math. 13, partie I, AMS, 1971, p. 83-134). Dans un espace séparable, une récurrence sur une suite dense suffit.
    enonce: |
      (i) *Forme analytique.* Soit $E$ un $\mathbb R$-espace vectoriel, $q$ sous-linéaire, $G$ un sous-espace et $g : G \to \mathbb R$ linéaire avec $g \leqslant q$ sur $G$. Il existe $f : E \to \mathbb R$ linéaire qui prolonge $g$ et vérifie $f \leqslant q$ sur $E$.

      (ii) Dans un espace normé, toute forme linéaire continue sur un sous-espace se prolonge en une forme linéaire continue sur $E$ de même norme.

      (iii) Pour tout $x \neq 0$, il existe $f \in \lex{dual-topologique}{E'}$ tel que $|||f||| = 1$ et $f(x) = \|x\|$. Par suite $\|x\| = \max\{f(x) : f \in E',\ |||f||| \leqslant 1\}$, et $E'$ sépare les points de $E$.
    preuve: |
      (i) *Un pas.* Soit $x_0 \notin G$. Pour $y, y' \in G$,
      $$\begin{aligned} g(y) + g(y') &= g(y + y') \leqslant q(y + y') \\ &\leqslant q(y + x_0) + q(y' - x_0), \end{aligned}$$
      donc
      $$\begin{aligned} &g(y') - q(y' - x_0) \\ &\quad \leqslant q(y + x_0) - g(y). \end{aligned}$$
      La borne supérieure $\alpha$ du premier membre en $y'$ est donc majorée par la borne inférieure du second en $y$, et l'on choisit $c$ entre les deux.

      On pose $h(y + tx_0) = g(y) + tc$ sur $G + \mathbb R x_0$. Pour $t > 0$,
      $$\begin{aligned} h(y + tx_0) &= t\big(g(y/t) + c\big) \\ &\leqslant t\,q(y/t + x_0) = q(y + tx_0) ; \end{aligned}$$
      pour $t < 0$, on utilise de même l'autre inégalité.

      *Zorn.* Considérons l'ensemble des couples $(K, k)$ où $K \supset G$ est un sous-espace et $k$ une forme linéaire sur $K$ qui prolonge $g$ et vérifie $k \leqslant q$, ordonné par prolongement.

      Toute chaîne a pour majorant la forme définie sur la réunion des sous-espaces, qui est un sous-espace parce que la famille est totalement ordonnée. Le lemme de Zorn ({{o-zorn|Lemme de Zorn}}) donne un élément maximal $(K, f)$, et $K = E$, sans quoi le pas précédent le prolongerait.

      (ii) Si $g$ est continue sur $G$, de norme $c$, on applique (i) avec $q(x) = c\|x\|$ ; alors $f(x) \leqslant c\|x\|$ et $-f(x) = f(-x) \leqslant c\|x\|$.

      (iii) Sur $G = \mathbb R x$, $g(tx) = t\|x\|$ est de norme $1$ ; on la prolonge par (ii). L'égalité $\|x\| = \max f(x)$ en découle, puisque $f(x) \leqslant |||f|||\,\|x\|$. Si $x \neq y$, une forme $f$ telle que $f(x - y) = \|x - y\| \neq 0$ les sépare.
    remarques:
      - |
        Dans un espace de Hilbert, le théorème est immédiat : une forme continue sur un sous-espace $G$ se prolonge à $\bar G$ par continuité, puis par $0$ sur $\bar G^\perp$, sans changer de norme, grâce au théorème de projection. Toute la force de Hahn-Banach est dans les espaces dépourvus de produit scalaire, comme $\ell^1$ ou $C(K)$.

  - id: f-banach-steinhaus
    etiquette: Banach-Steinhaus
    nature: théorème
    titre: Théorème de Banach-Steinhaus
    enonce: |
      Soit $E$ un espace de Banach, $F$ un espace normé et $(u_i)_{i \in I}$ une famille d'applications linéaires continues de $E$ dans $F$. Si $\sup_i \|u_i(x)\| < +\infty$ pour tout $x \in E$, alors $\sup_i |||u_i||| < +\infty$.

      En particulier, si une suite $(u_n)$ d'applications linéaires continues converge simplement vers $u$ sur $E$, alors $u$ est linéaire et continue.
    preuve: |
      Les ensembles
      $$\begin{aligned} F_n = \{x :{} &\|u_i(x)\| \leqslant n \\ &\text{pour tout } i\} \end{aligned}$$
      sont fermés, comme intersections de fermés, et leur réunion est $E$. Par le théorème de Baire ({{f-baire|Théorème de Baire}}), l'un d'eux contient une boule $B(x_0, r)$.

      Pour $\|z\| < r$,
      $$\begin{aligned} \|u_i(z)\| &\leqslant \|u_i(x_0 + z)\| + \|u_i(x_0)\| \\ &\leqslant 2n, \end{aligned}$$
      d'où $|||u_i||| \leqslant 2n/r$ pour tout $i$.

      Pour la seconde assertion, la suite $(u_n(x))$ converge, donc est bornée, pour tout $x$ ; $u$ est linéaire par passage à la limite, et $\|u(x)\| = \lim \|u_n(x)\| \leqslant \sup_n |||u_n|||\,\|x\|$.
    remarques:
      - |
        La complétude de $E$ est indispensable. Sur l'espace des suites à support fini, muni de la norme $\sup_n |x_n|$, les formes $u_n(x) = n x_n$ sont continues et simplement bornées, puisque chaque suite n'a qu'un nombre fini de termes non nuls ; pourtant $|||u_n||| = n$.

  - id: f-application-ouverte
    etiquette: Application ouverte
    nature: théorème
    titre: Théorème de l'application ouverte et du graphe fermé
    choix: |
      Outre le théorème de Baire, la démonstration construit par récurrence une suite d'antécédents approchés, chacun choisi en fonction des précédents : c'est encore le choix dépendant.
    enonce: |
      Soient $E$ et $F$ des espaces de Banach et $u \in \lex{espace-applications-continues}{\mathcal L_c}(E, F)$.

      (i) *Application ouverte.* Si $u$ est surjective, l'image de tout ouvert est ouverte ; plus précisément, il existe $c > 0$ tel que $u(B(0, 1)) \supset B(0, c)$.

      (ii) *Isomorphisme de Banach.* Si $u$ est bijective, $u^{-1}$ est continue.

      (iii) *Graphe fermé.* Une application linéaire $v : E \to F$ dont le graphe est fermé dans $E \times F$ est continue.
    preuve: |
      (i) *Étape 1.* $F = \bigcup_n \overline{u(B(0, n))}$, par surjectivité. Par le théorème de Baire ({{f-baire|Théorème de Baire}}), l'un de ces fermés contient une boule $B(y_0, \rho)$. Comme $\overline{u(B(0, n))}$ est convexe et symétrique, il contient
      $$\begin{aligned} &\frac12\big(B(y_0, \rho) + B(-y_0, \rho)\big) \\ &\quad \supset B(0, \rho), \end{aligned}$$
      et par homogénéité $\overline{u(B(0, 1))} \supset B(0, 2c)$ avec $2c = \rho/n$.

      *Étape 2.* Soit $y$ avec $\|y\| < c$. Par l'étape 1 et homogénéité, il existe $x_1 \in B(0, \frac12)$ tel que $\|y - u(x_1)\| < c/2$, puis $x_2 \in B(0, \frac14)$ tel que $\|y - u(x_1) - u(x_2)\| < c/4$, et ainsi de suite : $\|x_k\| < 2^{-k}$ et $\|y - u(x_1 + \cdots + x_k)\| < c\,2^{-k}$.

      La série $\sum x_k$ converge absolument, donc converge dans l'espace de Banach $E$ ({{f-evn|Espaces normés}}, (iii)), vers $x$ de norme $< 1$, et $u(x) = y$ par continuité. Donc $B(0, c) \subset u(B(0, 1))$.

      Si $O$ est ouvert et $x \in O$ avec $B(x, r) \subset O$, alors $u(O) \supset u(x) + B(0, rc)$.

      (ii) Par (i), $\|u^{-1}(y)\| < 1$ dès que $\|y\| < c$, donc $|||u^{-1}||| \leqslant 1/c$.

      (iii) Le graphe $\Gamma$, sous-espace fermé de l'espace de Banach $E \times F$ muni de $\|x\| + \|y\|$, est un espace de Banach. La projection $(x, v(x)) \mapsto x$ est une bijection linéaire continue de $\Gamma$ sur $E$ ; par (ii), sa réciproque $x \mapsto (x, v(x))$ est continue, et $v$ aussi.

      $$\begin{CD} E @>{x \,\mapsto\, (x,\, v(x))}>> \Gamma \\ @V{v}VV @VV{(x,\, y) \,\mapsto\, y}V \\ F @= F \end{CD}$$

      La flèche du haut est la réciproque de la projection, continue par (ii) ; la projection sur le second facteur est continue, puisque $\|y\| \leqslant \|x\| + \|y\|$, et le diagramme montre que $v$ est leur composée.
    remarques:
      - |
        Une conséquence frappante : si un même espace est complet pour deux normes, et si l'une est dominée par l'autre, elles sont équivalentes, par (ii) appliqué à l'identité. L'espace des fonctions continues sur $[0, 1]$ est complet pour la norme uniforme, qui domine $\int_0^1 |f|$, mais les deux normes ne sont pas équivalentes ; c'est bien que la seconde n'est pas complète ({{f-exemples|Exemples d'espaces de Banach}}).

  - id: f-autoadjoints
    etiquette: Opérateurs autoadjoints
    nature: proposition
    titre: Opérateurs autoadjoints d'un espace de Hilbert
    texte: |
      Soit $H$ un [[espace-hilbert|espace de Hilbert]], et $\mathcal L_c(H) = \lex{espace-applications-continues}{\mathcal L_c}(H, H)$. Un opérateur $u \in \mathcal L_c(H)$ est [[operateur-autoadjoint|autoadjoint]] si
      $$\langle u(x), y \rangle = \langle x, u(y) \rangle$$
      pour tous $x, y \in H$.

      Comme en dimension finie ({{v-valeurs-propres|Valeurs propres}}), un réel $\lambda$ est une [[valeur-propre|valeur propre]] de $u$ s'il existe $x \neq 0$ tel que $u(x) = \lambda x$ ; un tel $x$ est un **vecteur propre**. On note $E_\lambda = \operatorname{Ker}(u - \lambda\,\mathrm{id})$ pour tout réel $\lambda$. Un sous-espace $F$ est **stable** par $u$ si $u(F) \subset F$.

      Le [[quotient-rayleigh|quotient de Rayleigh]] de $u$ est la fonction définie sur $H \setminus \{0\}$ par
      $$R_u(x) = \frac{\langle u(x), x \rangle}{\|x\|^2}.$$
    enonce: |
      Soit $u \in \mathcal L_c(H)$ autoadjoint.

      (i) Chaque $E_\lambda$ est un sous-espace fermé. Si $\lambda \neq \mu$, les sous-espaces $E_\lambda$ et $E_\mu$ sont orthogonaux : $\langle x, y \rangle = 0$ pour $x \in E_\lambda$ et $y \in E_\mu$.

      (ii) Si $F$ est stable par $u$, son orthogonal $F^\perp$ est un sous-espace fermé stable par $u$. Si $G$ est un sous-espace fermé stable par $u$, c'est un espace de Hilbert pour le produit scalaire de $H$, et la restriction de $u$ à $G$ en est un opérateur autoadjoint.

      (iii) La norme de $u$ se lit sur sa forme quadratique :
      $$|||u||| = \sup\big\{|\langle u(x), x \rangle| : \|x\| \leqslant 1\big\}.$$

      (iv) *Rayleigh.* Si $R_u$ atteint en un point $x_0$ son maximum, ou son minimum, sur $H \setminus \{0\}$, alors $x_0$ est un vecteur propre de $u$, associé à la valeur propre $R_u(x_0)$.
    preuve: |
      (i) L'application $u - \lambda\,\mathrm{id}$ est linéaire et continue ({{f-evn|Espaces normés}}, (ii)), et $E_\lambda$ est l'image réciproque du fermé $\{0\}$. Pour $x \in E_\lambda$ et $y \in E_\mu$,
      $$\lambda \langle x, y \rangle = \langle u(x), y \rangle = \langle x, u(y) \rangle = \mu \langle x, y \rangle,$$
      donc $(\lambda - \mu)\langle x, y \rangle = 0$, puis $\langle x, y \rangle = 0$.

      (ii) Soit $x \in F^\perp$. Pour $y \in F$, on a $u(y) \in F$, donc $\langle u(x), y \rangle = \langle x, u(y) \rangle = 0$ : $u(x) \in F^\perp$. L'orthogonal est l'intersection des noyaux des formes linéaires $x \mapsto \langle x, a \rangle$, $a \in F$, qui sont continues par l'inégalité de Cauchy-Schwarz ({{f-hilbert|Espaces de Hilbert}}, (i)) : c'est un sous-espace fermé.

      Un sous-espace fermé $G$ d'un espace complet est complet ({{f-evn|Espaces normés}}, (iv)), et la restriction du produit scalaire en est un, qui définit la même norme. La restriction $v$ de $u$ à $G$ est linéaire, à valeurs dans $G$, et vérifie $\|v(x)\| \leqslant |||u|||\,\|x\|$ ; l'égalité $\langle v(x), y \rangle = \langle x, v(y) \rangle$ est celle de $u$.

      (iii) Notons $M$ la borne supérieure. Par l'inégalité de Cauchy-Schwarz, $|\langle u(x), x \rangle| \leqslant |||u|||\,\|x\|^2$, donc $M \leqslant |||u|||$ ; par homogénéité, $|\langle u(x), x \rangle| \leqslant M\|x\|^2$ pour tout $x$.

      En développant, et grâce à l'autoadjonction, on a pour tous $x, y$
      $$\begin{aligned} &\langle u(x + y), x + y \rangle - \langle u(x - y), x - y \rangle \\ &\quad = 2\langle u(x), y \rangle + 2\langle u(y), x \rangle \\ &\quad = 4\langle u(x), y \rangle. \end{aligned}$$
      Par l'identité du parallélogramme ({{f-hilbert|Espaces de Hilbert}}, (i)), il vient
      $$\begin{aligned} 4\langle u(x), y \rangle &\leqslant M\big(\|x + y\|^2 + \|x - y\|^2\big) \\ &= 2M\big(\|x\|^2 + \|y\|^2\big). \end{aligned}$$

      Soit $x$ tel que $\|x\| \leqslant 1$ et $u(x) \neq 0$, et $y = u(x)/\|u(x)\|$. L'inégalité devient $4\|u(x)\| \leqslant 2M(\|x\|^2 + 1) \leqslant 4M$. Ainsi $\|u(x)\| \leqslant M$ pour $\|x\| \leqslant 1$, et $|||u||| \leqslant M$.

      (iv) Supposons que $m = R_u(x_0)$ soit le maximum, c'est-à-dire que $\langle u(x), x \rangle \leqslant m\|x\|^2$ pour tout $x$, avec égalité en $x_0$. Posons $w = u(x_0) - m x_0$, et fixons $y \in H$. Pour tout réel $t$, l'expression $\langle u(x_0 + ty), x_0 + ty \rangle - m\|x_0 + ty\|^2$ est négative ; en la développant grâce à l'autoadjonction, on obtient
      $$2t\,\langle w, y \rangle + t^2 c \leqslant 0,$$
      où $c = \langle u(y), y \rangle - m\|y\|^2$.

      Pour $t > 0$, en divisant par $t$, $2\langle w, y \rangle \leqslant -tc$. Si $\langle w, y \rangle$ était strictement positif, un $t > 0$ tel que $t|c| < 2\langle w, y \rangle$ donnerait une contradiction ; donc $\langle w, y \rangle \leqslant 0$. De même, avec $t < 0$, $\langle w, y \rangle \geqslant 0$.

      Ainsi $\langle w, y \rangle = 0$ pour tout $y$ ; pour $y = w$, il vient $w = 0$, c'est-à-dire $u(x_0) = m x_0$. Pour le minimum, on applique ce qui précède à $-u$, autoadjoint, dont le quotient de Rayleigh est $-R_u$.
    remarques:
      - |
        L'autoadjonction est indispensable au point (iii). La rotation d'un quart de tour $J(x_1, x_2) = (-x_2, x_1)$ de $\lex{n-uplet}{\mathbb R^2}$, muni du produit scalaire $x_1y_1 + x_2y_2$, conserve la norme, si bien que $|||J||| = 1$ ; pourtant $\langle J(x), x \rangle = -x_2x_1 + x_1x_2 = 0$ pour tout $x$. Elle n'est pas autoadjointe : pour la base canonique, $\langle J(e_1), e_2 \rangle = 1$ alors que $\langle e_1, J(e_2) \rangle = -1$.

        Pour un opérateur autoadjoint, au contraire, le calcul de la démonstration montre que $\langle u(x), y \rangle$ s'exprime au moyen de la forme quadratique $x \mapsto \langle u(x), x \rangle$, qui détermine donc $u$ entièrement.
      - |
        Pour $u \in \mathcal L_c(H)$ quelconque et $y \in H$, la forme $x \mapsto \langle u(x), y \rangle$ est linéaire et continue ; le théorème de Riesz ({{f-riesz|Théorème de Riesz}}) fournit un unique $u^*(y)$ tel que $\langle u(x), y \rangle = \langle x, u^*(y) \rangle$ pour tout $x$. C'est l'**adjoint** de $u$, et $u$ est autoadjoint lorsque $u^* = u$. La définition adoptée ici évite de construire $u^*$, ce qui, par le théorème de Riesz, ferait appel au théorème de projection et au choix dénombrable.
      - |
        L'hypothèse de continuité est en fait superflue. Soit $u : H \to H$ linéaire, telle que $\langle u(x), y \rangle = \langle x, u(y) \rangle$ pour tous $x, y$. Son graphe est l'ensemble des couples $(x, z)$ tels que $\langle z, y \rangle = \langle x, u(y) \rangle$ pour tout $y$ : en effet, cette condition s'écrit $\langle z - u(x), y \rangle = 0$, et, pour $y = z - u(x)$, elle impose $z = u(x)$.

        Chacune de ces conditions définit un fermé de $H \times H$, image réciproque de $\{0\}$ par une fonction continue, si bien que le graphe est fermé, et le théorème du graphe fermé ({{f-application-ouverte|Application ouverte}}, (iii)) montre que $u$ est continue. C'est le théorème qui porte les noms d'E. Hellinger et O. Toeplitz, d'après leur article « Grundlagen für eine Theorie der unendlichen Matrizen » (*Math. Ann.* 69, 1910, p. 289-330) ; par le théorème de Baire, il repose sur le choix dépendant.

  - id: f-spectral-fini
    etiquette: Théorème spectral
    nature: théorème
    titre: Théorème spectral en dimension finie
    texte: |
      Soit $E$ un espace vectoriel réel de [[dimension]] finie $n \geqslant 1$, muni d'un produit scalaire. Il est complet, et toute application linéaire $u : E \to E$ est continue ({{gd-equivalence|Équivalence des normes}}, (iv)) : $E$ est un [[espace-hilbert|espace de Hilbert]], et $u$ est [[operateur-autoadjoint|autoadjoint]] dès que $\langle u(x), y \rangle = \langle x, u(y) \rangle$ pour tous $x, y$.

      Une base $(e_1, \dots, e_n)$ de $E$ est **orthonormée** si $\langle e_i, e_j \rangle$ vaut $1$ pour $i = j$ et $0$ sinon. Une matrice $A \in \lex{espace-matrices}{\mathcal M_n}(\mathbb R)$ est **symétrique** si ${}^tA = A$ ; une matrice $P \in \mathcal M_n(\mathbb R)$ est [[matrice-orthogonale|orthogonale]] si ${}^tP\,P = I_n$.
    enonce: |
      Soit $u : E \to E$ linéaire et autoadjoint.

      (i) Le [[quotient-rayleigh|quotient de Rayleigh]] $R_u$ atteint sur $E \setminus \{0\}$ un maximum $\lambda_{\max}$ et un minimum $\lambda_{\min}$, qui sont des [[valeur-propre|valeurs propres]] de $u$. Toute valeur propre est comprise entre eux, et pour tout $x \in E$
      $$\lambda_{\min}\|x\|^2 \leqslant \langle u(x), x \rangle \leqslant \lambda_{\max}\|x\|^2.$$

      (ii) *Théorème spectral.* Il existe une base orthonormée $(e_1, \dots, e_n)$ de $E$ formée de vecteurs propres de $u$, $u(e_i) = \lambda_i e_i$. Pour tout $x \in E$,
      $$\begin{aligned} x &= \sum_i \langle x, e_i \rangle\, e_i, \\ u(x) &= \sum_i \lambda_i \langle x, e_i \rangle\, e_i, \\ \langle u(x), x \rangle &= \sum_i \lambda_i \langle x, e_i \rangle^2. \end{aligned}$$
      Les $\lambda_i$ sont les valeurs propres de $u$, et chacune, $\lambda$, figure parmi eux autant de fois que la dimension de $E_\lambda$, sa **multiplicité**.

      (iii) *Forme matricielle.* Pour toute matrice symétrique $A \in \mathcal M_n(\mathbb R)$, il existe une matrice orthogonale $P$ et une matrice diagonale $D$ telles que
      $$A = P D\, {}^tP.$$
      Une matrice $A$ est symétrique si et seulement si $x \mapsto Ax$ est autoadjointe pour le produit scalaire usuel. La matrice $P$ est inversible, d'inverse ${}^tP$, et les coefficients diagonaux de $D$ sont les valeurs propres de $A$, répétées selon leur multiplicité.
    preuve: |
      (i) La sphère unité $S = \{x : \|x\| = 1\}$ n'est pas vide, puisque $x/\|x\|$ lui appartient pour tout $x \neq 0$. Elle est fermée, comme image réciproque de $\{1\}$ par la norme, qui est continue ({{f-evn|Espaces normés}}, (ii)), et bornée : elle est compacte ({{gd-equivalence|Équivalence des normes}}, (iv)).

      L'application $x \mapsto \langle u(x), x \rangle$ est continue sur $E$, puisque $u$ l'est et que, par l'inégalité de Cauchy-Schwarz,
      $$\begin{aligned} &|\langle a, b \rangle - \langle a', b' \rangle| \\ &\quad \leqslant \|a - a'\|\,\|b\| + \|a'\|\,\|b - b'\|. \end{aligned}$$
      Elle atteint donc sur le compact non vide $S$ un maximum et un minimum ({{tr-compacts|Compacts de ℝ}}, (iii)).

      Comme $R_u(x) = \langle u(x/\|x\|), x/\|x\| \rangle$ pour $x \neq 0$, ce sont le maximum $\lambda_{\max}$ et le minimum $\lambda_{\min}$ de $R_u$ sur $E \setminus \{0\}$, et le point (iv) du nœud {{f-autoadjoints|Opérateurs autoadjoints}} montre que ce sont des valeurs propres. Si $u(x) = \lambda x$ avec $x \neq 0$, alors $R_u(x) = \lambda$, compris entre eux. L'encadrement s'obtient en multipliant $\lambda_{\min} \leqslant R_u(x) \leqslant \lambda_{\max}$ par $\|x\|^2$, et il est évident pour $x = 0$.

      (ii) Raisonnons par récurrence sur $n$, l'énoncé portant sur tous les espaces de dimension $n$ munis d'un produit scalaire, et sur tous les endomorphismes autoadjoints de ces espaces. Par (i), $u$ a un vecteur propre $e_1$ de norme $1$. La droite $F = \mathbb R e_1$ est stable par $u$, donc $G = F^\perp$ l'est aussi ({{f-autoadjoints|Opérateurs autoadjoints}}, (ii)).

      Le sous-espace $G$ est le noyau de la forme linéaire $x \mapsto \langle x, e_1 \rangle$, qui vaut $1$ en $e_1$ ; son image est $\mathbb R$, et $\dim G = n - 1$ par le théorème du rang ({{v-rang|Théorème du rang}}). Si $n = 1$, la famille $(e_1)$, libre à un élément, est une base ({{v-dimension|Dimension}}, (ii)). Sinon, la restriction de $u$ à $G$ est un endomorphisme autoadjoint de $G$, muni du produit scalaire induit ({{f-autoadjoints|Opérateurs autoadjoints}}, (ii)), et l'hypothèse de récurrence fournit une base orthonormée $(e_2, \dots, e_n)$ de $G$ formée de vecteurs propres.

      Les vecteurs $e_1, \dots, e_n$ sont de norme $1$ et deux à deux orthogonaux, puisque $e_2, \dots, e_n \in G$. Une telle famille est libre : si $\sum_i a_i e_i = 0$, le produit scalaire avec $e_j$ donne $a_j = 0$. Formée de $n$ vecteurs, c'est une base ({{v-dimension|Dimension}}, (ii)).

      Pour $x = \sum_i x_i e_i$, le produit scalaire avec $e_j$ donne $x_j = \langle x, e_j \rangle$, d'où les trois formules, la dernière par orthonormalité. Enfin $u(x) = \lambda x$ s'écrit $\sum_i (\lambda_i - \lambda) x_i e_i = 0$, c'est-à-dire $x_i = 0$ pour tout $i$ tel que $\lambda_i \neq \lambda$. Le sous-espace $E_\lambda$ a donc pour base les $e_i$ tels que $\lambda_i = \lambda$ : ils sont au nombre de $\dim E_\lambda$, et $E_\lambda$ est nul si $\lambda$ n'est aucun des $\lambda_i$.

      (iii) Sur $\mathbb R^n$, l'expression $\langle x, y \rangle = \sum_i x_i y_i$ est un produit scalaire : elle est bilinéaire et symétrique, et $\sum_i x_i^2 > 0$ si $x \neq 0$. Si $A = (a_{ij})$ est symétrique, l'application $x \mapsto Ax$ est autoadjointe : en permutant les deux sommes finies, comme au nœud {{v-trace|Trace}}, (ii), puis en utilisant $a_{ij} = a_{ji}$,
      $$\begin{aligned} \langle Ax, y \rangle &= \sum_i \sum_j a_{ij} x_j y_i \\ &= \sum_j x_j \sum_i a_{ji} y_i = \langle x, Ay \rangle. \end{aligned}$$
      Réciproquement, si $x \mapsto Ax$ est autoadjointe, la base canonique $(\varepsilon_j)$ donne $a_{ij} = \langle A\varepsilon_j, \varepsilon_i \rangle = \langle \varepsilon_j, A\varepsilon_i \rangle = a_{ji}$.

      Soit $(e_1, \dots, e_n)$ la base fournie par (ii), $P$ la matrice dont la $j$-ième colonne est $e_j$, et $D$ la matrice diagonale de coefficients $\lambda_1, \dots, \lambda_n$. Le coefficient d'indice $(i, j)$ de ${}^tP\,P$ est $\sum_k p_{ki}\, p_{kj} = \langle e_i, e_j \rangle$, si bien que ${}^tP\,P = I_n$.

      La matrice $P$ est celle de l'identité, de la base $(e_j)$ dans la base canonique. Elle est inversible, et la matrice de $x \mapsto Ax$ dans la base $(e_j)$, qui est $D$ puisque $Ae_j = \lambda_j e_j$, vaut $P^{-1}AP$ ({{v-trace|Trace}}, (iii)). En multipliant ${}^tP\,P = I_n$ à droite par $P^{-1}$, le produit étant associatif ({{v-matrices|Matrices}}, (iii)), on obtient ${}^tP = P^{-1}$, puis
      $$A = PDP^{-1} = PD\,{}^tP.$$
      Les valeurs propres et leurs multiplicités sont celles que donne (ii).
    remarques:
      - |
        Pour la matrice
        $$A = \begin{pmatrix} 2 & 1 & 1 \\ 1 & 2 & 1 \\ 1 & 1 & 2 \end{pmatrix},$$
        on a $Ax = x + (x_1 + x_2 + x_3)(1, 1, 1)$, donc $R_A(x) = 1 + (x_1 + x_2 + x_3)^2/\|x\|^2$. Par l'inégalité de Cauchy-Schwarz, ce quotient est compris entre $1$ et $1 + 3 = 4$ ; son maximum $4$ est atteint en $e_1 = \frac1{\sqrt3}(1, 1, 1)$, qui est bien un vecteur propre, de valeur propre $4$.

        L'orthogonal de $e_1$ est le plan $x_1 + x_2 + x_3 = 0$, sur lequel $A$ est l'identité : toute base orthonormée de ce plan poursuit la récurrence, par exemple $e_2 = \frac1{\sqrt2}(1, -1, 0)$ et $e_3 = \frac1{\sqrt6}(1, 1, -2)$. On obtient $A = PD\,{}^tP$ avec $D$ diagonale de coefficients $4, 1, 1$ et
        $$P = \frac1{\sqrt6}\begin{pmatrix} \sqrt2 & \sqrt3 & 1 \\ \sqrt2 & -\sqrt3 & 1 \\ \sqrt2 & 0 & -2 \end{pmatrix}.$$

        La valeur propre $1$ est double, et c'est ce qui rend $P$ non unique : dans le plan propre, n'importe quelle base orthonormée convient.
      - |
        Le point (i) a une lecture géométrique. Pour $A = \begin{pmatrix} 5 & 2 \\ 2 & 2 \end{pmatrix}$, la forme $\langle Ax, x \rangle = 5x_1^2 + 4x_1x_2 + 2x_2^2$ varie entre $1$ et $6$ sur le cercle unité. Son maximum est atteint en $\pm\frac1{\sqrt5}(2, 1)$ et son minimum en $\pm\frac1{\sqrt5}(1, -2)$, qui sont des vecteurs propres, de valeurs propres $6$ et $1$.

        ```schema f-spectral-fini
        Le cercle unité est pris entre les lignes de niveau $\langle Ax, x \rangle = 1$, en bleu, et $\langle Ax, x \rangle = 6$, en rouge, qu'il touche aux points de minimum et de maximum. En ces points, la ligne de niveau est tangente au cercle, et sa normale, dirigée par $Ax$, est radiale : $Ax$ est colinéaire à $x$. En un autre point du cercle, en vert, la flèche $Ax$ n'est pas colinéaire à la direction radiale de $x$, en pointillé.
        ```

        C'est le calcul du point (iv) du nœud {{f-autoadjoints|Opérateurs autoadjoints}} : au point de maximum $x_0$, la dérivée en $t = 0$ de $\langle A(x_0 + ty), x_0 + ty \rangle - 6\|x_0 + ty\|^2$ est nulle dans toute direction $y$.
      - |
        La démonstration usuelle passe par les nombres complexes : le polynôme caractéristique a une racine complexe par le théorème de d'Alembert-Gauss, et l'autoadjonction force cette racine à être réelle. Ni $\mathbb C$ ni le théorème de d'Alembert-Gauss ({{cx-liouville|Liouville}}) ne sont des ancêtres de cette branche ; la compacité de la sphère, c'est-à-dire en dernier ressort le théorème de Borel-Lebesgue ({{tr-borel-lebesgue|Borel-Lebesgue}}), en tient lieu, et aucun choix n'intervient.

        C'est déjà par les extremums d'une forme quadratique sur la sphère que Cauchy, en 1829, aborde la recherche des axes principaux et établit que les racines de l'équation correspondante sont réelles (T. Hawkins, « Cauchy and the spectral theory of matrices », *Historia Mathematica* 2, 1975, p. 1-29).
      - |
        L'erreur la plus répandue est de croire qu'une matrice diagonalisable se diagonalise en base orthonormée. La matrice $\begin{pmatrix} 1 & 1 \\ 0 & 2 \end{pmatrix}$ a deux valeurs propres distinctes, $1$ et $2$, et elle est diagonalisable ({{v-valeurs-propres|Valeurs propres}}, (iii)). Mais ses sous-espaces propres sont les droites engendrées par $(1, 0)$ et $(1, 1)$, qui ne sont pas orthogonales ; une base de vecteurs propres prend un vecteur sur chacune, et aucune n'est orthonormée.

        La symétrie est en effet nécessaire : si $A = PD\,{}^tP$ avec $D$ diagonale de coefficients $d_k$, le coefficient d'indice $(i, j)$ de $A$ vaut $\sum_k p_{ik}\, d_k\, p_{jk}$, expression symétrique en $i$ et $j$. Une matrice réelle se diagonalise donc dans une base orthonormée si et seulement si elle est symétrique.
      - |
        Le point (ii) est la réduction des formes quadratiques en base orthonormée : dans les coordonnées $y_i = \langle x, e_i \rangle$, la forme $\langle u(x), x \rangle$ s'écrit $\sum_i \lambda_i y_i^2$, sans terme croisé. Pour la matrice du schéma ci-dessus, la courbe $5x_1^2 + 4x_1x_2 + 2x_2^2 = 6$ s'écrit $6y_1^2 + y_2^2 = 6$ : c'est une ellipse de demi-axes $1$ et $\sqrt 6$, dirigés par les vecteurs propres.

        Les nombres de $\lambda_i$ strictement positifs et strictement négatifs ne dépendent même pas de la base, orthonormée ou non, dans laquelle on réduit la forme : c'est la loi d'inertie de Sylvester, point de départ de la classification des formes quadratiques réelles, qui n'est pas menée ici.
      - |
        Les matrices orthogonales sont celles qui conservent le produit scalaire de $\mathbb R^n$ : un calcul de sommes, comme en (iii), donne $\langle Px, Py \rangle = \langle x, y \rangle$. Elles forment le groupe orthogonal $O(n)$, sous-variété de $\mathcal M_n(\mathbb R)$ de dimension $n(n - 1)/2$ ({{gd-sous-varietes|Sous-variétés de ℝⁿ}}) et groupe de Lie ({{li-definition|Groupes de Lie}}).

        Le compte des dimensions éclaire (iii) : une matrice symétrique dépend de $n(n + 1)/2$ coefficients, autant que $n$ valeurs propres et une matrice de $O(n)$, puisque $n + n(n - 1)/2 = n(n + 1)/2$.
      - |
        Le théorème s'applique aux matrices hessiennes. Pour $f$ de classe $C^2$ sur un ouvert de $\mathbb R^n$, la matrice $(\partial_i\partial_j f(a))$ est symétrique par le théorème de Schwarz ({{gd-schwarz|Schwarz, intégrales à paramètre}}), donc se diagonalise en base orthonormée, et en un point critique le signe de ses valeurs propres décide du comportement de $f$ au second ordre.

        Pour $f(x_1, x_2) = x_1^2 + 4x_1x_2 + x_2^2$, la hessienne $\begin{pmatrix} 2 & 4 \\ 4 & 2 \end{pmatrix}$ a pour valeurs propres $6$ et $-2$, de vecteurs propres $(1, 1)$ et $(1, -1)$ ; en effet $f(t, t) = 6t^2$ et $f(t, -t) = -2t^2$, et l'origine est un col. Le critère général, qui passe par la formule de Taylor à l'ordre $2$, relève du {{cdiff|calcul différentiel}}.

  - id: f-compacts
    etiquette: Opérateurs compacts
    nature: proposition
    titre: Opérateurs compacts
    texte: |
      Soient $E$ et $F$ des [[espace-norme|espaces normés]], et $\bar B_E = \{x \in E : \|x\| \leqslant 1\}$ la boule unité fermée de $E$. Une application linéaire $u : E \to F$ est un [[operateur-compact|opérateur compact]] si l'adhérence de $u(\bar B_E)$ dans $F$ est [[compact|compacte]].

      Un opérateur continu est **de rang fini** si son image est de [[dimension]] finie.
    choix: |
      Les points (i) et (ii) n'utilisent aucun choix : en (ii), les réseaux qui rendent l'image de la boule précompacte sont construits sur une grille, à partir des familles $(b_{k,i})$ données. Le point (iii), où les opérateurs $u_k$ sont seulement supposés compacts, choisit un réseau de l'image de la boule par chaque $u_k$ : c'est le [[choix-denombrable]], comme au nœud {{me-precompacts|Parties précompactes}}, (iii).
    enonce: |
      (i) Un opérateur compact est continu, et l'image par lui de toute partie bornée a une adhérence compacte. Tout opérateur continu de rang fini est compact.

      (ii) *Limites explicites.* Soit $F$ un espace de Banach, $u \in \lex{espace-applications-continues}{\mathcal L_c}(E, F)$, et $(u_k)$ une suite de $\mathcal L_c(E, F)$ telle que $|||u - u_k||| \to 0$. On suppose donnée, pour chaque $k$, une famille finie $(b_{k,1}, \dots, b_{k,d_k})$ de $F$ dont le sous-espace engendré contient l'image de $u_k$. Alors $u$ est compact.

      (iii) Si $F$ est un espace de Banach, toute limite, pour la norme d'opérateur, d'une suite d'opérateurs compacts de $E$ dans $F$ est un opérateur compact.
    preuve: |
      (i) Soit $u$ compact et $K$ l'adhérence de $u(\bar B_E)$. Les boules $B(0, k)$, pour les entiers $k \geqslant 1$, recouvrent $F$ par la propriété d'Archimède ; un nombre fini d'entre elles recouvre le compact $K$, qui est donc contenu dans la plus grande, $B(0, k)$. Ainsi $\|u(x)\| < k$ pour $\|x\| \leqslant 1$, et $u$ est continu ({{f-operateurs|Opérateurs continus}}, (i)).

      Si $A \subset E$ est bornée, elle est contenue dans une boule fermée de centre $0$ et de rayon $r > 0$, et $u(A) \subset r\,u(\bar B_E) \subset rK$. L'homothétie $y \mapsto ry$ est continue, donc $rK$ est compact ({{t-compact-prop|Parties compactes}}, (iii)), et fermé dans $F$, qui est séparé (même nœud, (ii)). L'adhérence de $u(A)$ est ainsi une partie fermée de $rK$, donc compacte (même nœud, (i)).

      Soit enfin $u$ continu de rang fini, et $G = \operatorname{Im} u$. La partie $L = \{y \in G : \|y\| \leqslant |||u|||\}$ est fermée et bornée dans l'espace normé $G$, de dimension finie : elle est compacte ({{gd-equivalence|Équivalence des normes}}, (iv)), pour la topologie que $G$ induit, qui est aussi celle que $F$ induit sur $L$. Elle contient $u(\bar B_E)$, et elle est fermée dans $F$ ({{t-compact-prop|Parties compactes}}, (ii)) : l'adhérence de $u(\bar B_E)$ est une partie fermée de $L$, donc compacte.

      (ii) Soit $Y$ l'adhérence de $u(\bar B_E)$, fermée dans l'espace complet $F$. Construisons, pour chaque $j \in \lex{ensemble-entiers-naturels}{\mathbb N}$, un $2^{-j-1}$-réseau fini de $u(\bar B_E)$ : par le point (i) du nœud {{me-precompacts|Parties précompactes}}, ce sera un $2^{-j}$-réseau de $Y$, et le point (ii) du même nœud montrera que $Y$ est compacte.

      Fixons $j$, soit $k$ le plus petit entier tel que $|||u - u_k||| < 2^{-j-2}$, et notons $v = u_k$. En retenant, parmi les $b_{k,i}$ pris dans l'ordre, ceux qui n'appartiennent pas au sous-espace engendré par les précédents retenus, on obtient une famille $(c_1, \dots, c_d)$, libre par {{v-libre|Familles libres, bases}}, (iv). Chaque $b_{k,i}$ écarté est dans le sous-espace engendré par les précédents retenus, si bien que la famille retenue engendre le même sous-espace $G$ que les $b_{k,i}$ : c'est une base de $G$. Si $d = 0$, alors $v = 0$, et le seul point $0$ forme un $2^{-j-1}$-réseau de $u(\bar B_E)$.

      Si $d \geqslant 1$, les coordonnées dans la base $(c_i)$ sont des formes linéaires sur $G$, continues ({{gd-equivalence|Équivalence des normes}}, (iv)). Il existe donc un réel $C$ tel que les coordonnées $\beta_1, \dots, \beta_d$ de $v(x)$ vérifient $|\beta_i| \leqslant C$ pour $\|x\| \leqslant 1$ : le produit de $|||v|||$ et de la plus grande des normes de ces formes convient. Posons $S = \|c_1\| + \cdots + \|c_d\|$ et $\delta = 2^{-j-2}/S$, et considérons les points
      $$g = \sum_{i = 1}^d n_i \delta\, c_i,$$
      où les $n_i$ sont des entiers relatifs tels que $|n_i| \delta \leqslant C + \delta$. Ils sont en nombre fini, et on les range dans l'ordre lexicographique des $(n_1, \dots, n_d)$.

      Pour $\|x\| \leqslant 1$, prenons pour $n_i$ la partie entière de $\beta_i/\delta$, qui existe parce que $\mathbb R$ est [[archimedien]]. Alors $|\beta_i - n_i\delta| < \delta$ et $|n_i|\delta \leqslant C + \delta$, si bien que le point $g$ correspondant vérifie
      $$\begin{aligned} \|v(x) - g\| &\leqslant \sum_i |\beta_i - n_i\delta|\,\|c_i\| \\ &< \delta S = 2^{-j-2}. \end{aligned}$$
      Comme $\|u(x) - v(x)\| < 2^{-j-2}$, on a $\|u(x) - g\| < 2^{-j-1}$ : ces points forment un $2^{-j-1}$-réseau de $u(\bar B_E)$, défini sans aucun choix à partir des données.

      (iii) Soit $u$ limite d'une suite $(u_k)$ d'opérateurs compacts, et $Y$ l'adhérence de $u(\bar B_E)$. Pour chaque $j$, soit $k$ le plus petit entier tel que $|||u - u_k||| < 2^{-j-2}$. L'adhérence de $u_k(\bar B_E)$ est compacte, donc précompacte ({{me-precompacts|Parties précompactes}}, (i)) : elle a un $2^{-j-2}$-réseau fini, que l'on choisit.

      Tout point de $u(\bar B_E)$ est à distance $< 2^{-j-2}$ d'un point de $u_k(\bar B_E)$, donc à distance $< 2^{-j-1}$ d'un point du réseau : celui-ci est un $2^{-j-1}$-réseau de $u(\bar B_E)$, donc un $2^{-j}$-réseau de $Y$ ({{me-precompacts|Parties précompactes}}, (i)). Le point (ii) du même nœud montre que $Y$ est compacte.
    remarques:
      - |
        L'identité d'un espace de Hilbert $H$ de dimension infinie n'est pas compacte, et l'on peut le voir sans aucun choix. Si la boule unité fermée $\bar B$ était compacte, elle serait contenue dans une réunion finie de boules $B(a_1, \frac12), \dots, B(a_m, \frac12)$ ({{me-precompacts|Parties précompactes}}, (i)) ; soit $V$ le sous-espace engendré par les $a_i$.

        Par récurrence sur $k$, $\bar B \subset V + 2^{-k}\bar B$ : si $x = v + 2^{-k}z$ avec $v \in V$ et $z \in \bar B$, on écrit $z = a_i + w$ avec $\|w\| < \frac12$, et $x = (v + 2^{-k}a_i) + 2^{-k-1}(2w)$, où $2w \in \bar B$. Tout point de $\bar B$ est donc à distance au plus $2^{-k}$ de $V$ pour tout $k$, c'est-à-dire adhérent à $V$. Or $V$, de dimension finie, est fermé, comme noyau de $\mathrm{id} - p_V$, où $p_V$ est la projection orthogonale continue du nœud {{f-spectral-compact|Théorème spectral compact}}. Ainsi $\bar B \subset V$, puis $H = V$ par homogénéité, et $H$ serait de dimension finie.

        Dans l'espace $\ell^2$ des suites de carré sommable ({{f-lp|Espaces L¹ et L²}}), on le voit plus directement : les suites $e_n$, nulles sauf un $1$ en position $n$, sont dans la boule unité, à distance $\sqrt 2$ les unes des autres, et une boule de rayon $\frac{\sqrt 2}2$ en contient au plus une. Un opérateur compact est donc, en un sens, presque de rang fini, ce que précisent (ii) et (iii).
      - |
        Réciproquement, tout opérateur compact d'un espace de Hilbert est limite d'opérateurs de rang fini. Pour un opérateur autoadjoint, c'est une conséquence du théorème spectral ({{f-spectral-compact|Théorème spectral compact}}, (iii)) ; le cas général, où l'on compose l'opérateur avec des projections orthogonales sur des sous-espaces de dimension finie, est admis ici.

        Dans les espaces de Banach, cette réciproque est fausse en général : le premier exemple d'un espace de Banach où des opérateurs compacts à valeurs dans cet espace ne sont pas limites d'opérateurs de rang fini est dû à P. Enflo (« A counterexample to the approximation problem in Banach spaces », *Acta Math.* 130, 1973, p. 309-317).

  - id: f-compacts-exemples
    etiquette: Exemples d'opérateurs compacts
    nature: proposition
    titre: Opérateurs diagonaux et opérateurs à noyau
    texte: |
      Pour $n \in \lex{ensemble-entiers-naturels}{\mathbb N}$, on note $e_n \in \lex{espace-l2-suites}{\ell^2}$ la suite nulle sauf un $1$ en position $n$. À une suite réelle bornée $a = (a_n)$, on associe l'**opérateur diagonal** $D_a$, défini sur $\ell^2$ par
      $$D_a(x) = (a_n x_n)_{n \in \mathbb N}.$$

      On munit $[0, 1]$ de la [[mesure-lebesgue|mesure de Lebesgue]], on note $L^2 = \lex{espace-L2}{L^2}([0, 1])$, et l'on munit $[0, 1]^2$ de la distance $d_\infty$. À une fonction continue $K : [0, 1]^2 \to \mathbb R$, le **noyau**, on associe l'**opérateur à noyau** $T_K$, défini par
      $$T_K f(x) = \int_0^1 K(x, y) f(y) \, dy.$$
    enonce: |
      (i) L'opérateur $D_a$ est continu, [[operateur-autoadjoint|autoadjoint]], de norme $\sup_n |a_n|$, et $D_a(e_n) = a_n e_n$ pour tout $n$. Il est [[operateur-compact|compact]] si et seulement si $a_n \to 0$.

      (ii) Pour $f \in L^2$, la fonction $T_K f$ est continue sur $[0, 1]$, et $T_K$ est un opérateur compact de $L^2$, de norme au plus $\max |K|$. Si $K(x, y) = K(y, x)$ pour tous $x, y$, il est autoadjoint.
    preuve: |
      (i) Soit $M = \sup_n |a_n|$. Pour $x \in \ell^2$, on a $\sum_n a_n^2 x_n^2 \leqslant M^2 \|x\|^2$, si bien que $D_a(x) \in \ell^2$ et $\|D_a(x)\| \leqslant M\|x\|$. L'opérateur $D_a$, linéaire, est donc continu, de norme au plus $M$, et au moins chaque $|a_n| = \|D_a(e_n)\|$. Pour $x, y \in \ell^2$, $\langle D_a(x), y \rangle = \sum_n a_n x_n y_n = \langle x, D_a(y) \rangle$.

      *Si $a_n \to 0$.* Pour $N \in \mathbb N$, soit $D_N$ l'opérateur diagonal associé à la suite $(a_0, \dots, a_{N-1}, 0, 0, \dots)$, dont l'image est contenue dans le sous-espace engendré par $e_0, \dots, e_{N-1}$. L'opérateur $D_a - D_N$ est diagonal, associé à la suite nulle jusqu'au rang $N - 1$ puis égale à $(a_n)$, et sa norme $\sup_{n \geqslant N} |a_n|$ tend vers $0$. Le point (ii) du nœud {{f-compacts|Opérateurs compacts}}, appliqué aux familles $(e_0, \dots, e_{N-1})$, montre que $D_a$ est compact.

      *Si $(a_n)$ ne tend pas vers $0$*, il existe $\varepsilon > 0$ tel que l'ensemble $I$ des $n$ vérifiant $|a_n| \geqslant \varepsilon$ soit infini.

      Si $D_a$ était compact, l'adhérence de l'image de la boule unité serait contenue dans un nombre fini de boules $B(c_1, \varepsilon/\sqrt2), \dots, B(c_m, \varepsilon/\sqrt2)$ ({{me-precompacts|Parties précompactes}}, (i)). Or, pour $n \neq p$ dans $I$,
      $$\|D_a(e_n) - D_a(e_p)\|^2 = a_n^2 + a_p^2 \geqslant 2\varepsilon^2,$$
      alors que deux points d'une même boule sont à distance $< \sqrt2\,\varepsilon$. En associant à $n \in I$ le plus petit indice $i$ tel que $D_a(e_n) \in B(c_i, \varepsilon/\sqrt2)$, on obtiendrait une injection de l'ensemble infini $I$ dans $\{1, \dots, m\}$.

      (ii) La partie $[0, 1]^2$ est fermée et bornée dans $\mathbb R^2$, donc compacte ({{me-rn|L'espace ℝⁿ}}, (iii)) ; soit $M$ le maximum de $|K|$ ({{tr-compacts|Compacts de ℝ}}, (iii)). Soit $f \in L^2$, dont on fixe un représentant. Par l'inégalité de Cauchy-Schwarz appliquée à $|f|$ et à la constante $1$ ({{f-lp|Espaces L¹ et L²}}, (i)), $f$ est intégrable et $\|f\|_1 \leqslant \|f\|_2$.

      Pour $x$ fixé, la fonction $y \mapsto K(x, y)$ est continue, donc mesurable, et bornée par $M$ : le produit $y \mapsto K(x, y) f(y)$ est intégrable ({{m-mesurables|Fonctions mesurables}}, (iii)), et $T_K f(x)$ ne dépend pas du représentant de $f$ ({{m-integrables|Fonctions intégrables}}, (iii)).

      Par le théorème de Heine ({{me-heine|Théorème de Heine}}), $K$ est uniformément continue : pour $\varepsilon > 0$, il existe $\delta > 0$ tel que $|K(p) - K(q)| < \varepsilon$ dès que $d_\infty(p, q) < \delta$.

      Pour $|x - x'| < \delta$, on a donc
      $$\begin{aligned} &|T_K f(x) - T_K f(x')| \\ &\quad \leqslant \int_0^1 |K(x, y) - K(x', y)|\,|f(y)| \, dy \\ &\quad \leqslant \varepsilon\|f\|_1. \end{aligned}$$
      Ainsi $T_K f$ est continue, donc mesurable, et bornée par $M\|f\|_1$ ; elle appartient à $L^2$, et $\|T_K f\|_2 \leqslant M\|f\|_1 \leqslant M\|f\|_2$, la mesure de $[0, 1]$ valant $1$. L'application $T_K$ est linéaire, comme l'intégrale ({{m-integrables|Fonctions intégrables}}, (i)) : c'est un opérateur continu de norme au plus $M$.

      *Approximations.* Pour $m \geqslant 1$ entier et $k < m$, soit $J_k = [\frac km, \frac{k+1}m[$ ; ces intervalles forment une partition de $[0, 1[$, puisque $x$ appartient au seul $J_k$ d'indice $k = \lfloor mx \rfloor$. Notons $\kappa_{kl} = K\big(\frac km, \frac lm\big)$, et posons
      $$T_m f = \sum_{k < m} \Big(\sum_{l < m} \kappa_{kl} \int_{J_l} f\Big)\, \mathbf 1_{J_k}.$$
      C'est un opérateur continu de $L^2$, puisque $|T_m f| \leqslant M\|f\|_1$, et son image est contenue dans le sous-espace engendré par les $m$ fonctions $\mathbf 1_{J_k}$.

      Soit $\varepsilon$ et $\delta$ comme ci-dessus, et $m > 1/\delta$. Pour $x \in J_k$ et $y \in J_l$, on a $d_\infty\big((x, y), (\frac km, \frac lm)\big) < \frac1m < \delta$. Le point $1$ étant négligeable, il vient, pour $x \in J_k$,
      $$\begin{aligned} &|T_K f(x) - T_m f(x)| \\ &\quad = \Big|\sum_{l < m} \int_{J_l} \big(K(x, y) - \kappa_{kl}\big) f(y) \, dy\Big| \\ &\quad \leqslant \varepsilon\|f\|_1 \leqslant \varepsilon\|f\|_2. \end{aligned}$$
      Donc $|||T_K - T_m||| \leqslant \varepsilon$ : la suite $(T_m)$ tend vers $T_K$, et le point (ii) du nœud {{f-compacts|Opérateurs compacts}}, appliqué aux familles $(\mathbf 1_{J_0}, \dots, \mathbf 1_{J_{m-1}})$, montre que $T_K$ est compact.

      *Symétrie.* Si $K$ est symétrique,
      $$\langle T_m f, g \rangle = \sum_{k, l < m} \kappa_{kl} \int_{J_l} f \int_{J_k} g$$
      ne change pas quand on échange $f$ et $g$, en échangeant aussi $k$ et $l$. Comme $|\langle (T_K - T_m)f, g \rangle| \leqslant |||T_K - T_m|||\,\|f\|_2\|g\|_2$, on obtient à la limite $\langle T_K f, g \rangle = \langle f, T_K g \rangle$.
    remarques:
      - |
        Pour $a_n = \frac1{n+1}$, l'opérateur $D_a$ est compact et injectif ; ses valeurs propres sont les $\frac1{n+1}$, de vecteurs propres $e_n$, et elles tendent vers $0$, qui n'est pas valeur propre. Il n'est pas surjectif : la suite $(\frac1{n+1})$ appartient à $\ell^2$, mais son seul antécédent possible, la suite constante égale à $1$, n'y appartient pas.

        Ainsi $D_a - 0 \cdot \mathrm{id}$ n'est pas bijectif, sans que $0$ soit valeur propre. En dimension infinie, les valeurs propres ne suffisent plus à décrire un opérateur, et l'on introduit son **spectre**, ensemble des $\lambda$ tels que $u - \lambda\,\mathrm{id}$ ne soit pas bijectif.
      - |
        La symétrie de $T_K$ s'établit ici sans le théorème de Fubini, par les approximations $T_m$, pour lesquelles elle se réduit à une somme finie. La même méthode, qui passe par des opérateurs de rang fini explicites, donne la compacité sans aucun choix : la complétude de $L^2$ n'y sert qu'à faire converger la suite des centres des réseaux, formée de combinaisons explicites des fonctions $\mathbf 1_{J_l}$, pour laquelle aucun représentant n'est à choisir.
      - |
        Aucune forme du choix n'intervient dans cette fiche. Les deux compacités passent par le point (ii) du nœud {{f-compacts|Opérateurs compacts}}, qui suppose l'espace d'arrivée complet ; la complétude de $L^2$ est signalée avec le [[choix-denombrable]] au nœud {{f-lp|Espaces L¹ et L²}}, parce qu'elle choisit un représentant de chaque classe d'une suite de Cauchy. Elle n'est employée ici, au point (ii) du nœud {{me-precompacts|Parties précompactes}}, que pour la suite des centres des réseaux, combinaisons explicites des fonctions $\mathbf 1_{J_l}$ données, si bien que ce choix disparaît. Pour $\ell^2$, les classes sont réduites à une suite, et la question ne se pose pas.

  - id: f-spectral-compact
    etiquette: Théorème spectral compact
    nature: théorème
    titre: Théorème spectral des opérateurs compacts autoadjoints
    texte: |
      Soit $H$ un [[espace-hilbert|espace de Hilbert]], $\bar B$ sa boule unité fermée, et $u$ un opérateur [[operateur-compact|compact]] et [[operateur-autoadjoint|autoadjoint]] de $H$.

      Si $F$ est un sous-espace de dimension finie de $H$, il existe un unique $p_F(x) \in F$ tel que $x - p_F(x) \in F^\perp$. L'unicité vient de ce que la différence de deux tels points est dans $F \cap F^\perp = \{0\}$. Pour l'existence, le procédé de Gram-Schmidt, tel que le décrit la démonstration du nœud {{f-bases-hilbertiennes|Bases hilbertiennes}}, (iii), appliqué à une famille libre finie, en fait une famille orthonormale de même espace engendré ; appliqué à une base de $F$, il en donne une base orthonormée $(b_1, \dots, b_d)$, et $\sum_i \langle x, b_i \rangle b_i$ convient.

      L'application $p_F$, la **projection orthogonale** sur $F$, est linéaire par unicité, et $\|x\|^2 = \|p_F(x)\|^2 + \|x - p_F(x)\|^2$.
    choix: |
      Les points (i) à (iii) n'utilisent aucun choix. En (i), la valeur propre n'est pas obtenue, comme d'ordinaire, par une suite maximisante dont on extrait une suite convergente, ce qui demanderait le [[choix-denombrable]] pour choisir la suite, mais par l'intersection d'une famille emboîtée de fermés non vides d'un compact. En (iii), les projections $p_n$ sont définies par une propriété qui les caractérise, et non par le choix d'une base de chaque sous-espace propre, et les valeurs propres sont rangées par un ordre explicite.

      Le point (iv) choisit une base orthonormée de chaque sous-espace propre, ce qui fait une infinité dénombrable de choix : c'est le choix dénombrable. Il disparaît si $H$ contient une suite dense donnée, car une base de chaque sous-espace propre s'obtient alors par le procédé de Gram-Schmidt appliqué aux projections des termes de cette suite.
    enonce: |
      (i) *Valeur propre extrême.* Si $u \neq 0$, l'un des deux réels $|||u|||$ et $-|||u|||$ est une [[valeur-propre|valeur propre]] de $u$.

      (ii) *Valeurs propres non nulles.* Pour tout $\varepsilon > 0$, $u$ n'a qu'un nombre fini de valeurs propres $\lambda$ telles que $|\lambda| \geqslant \varepsilon$, et, pour $\lambda \neq 0$, le sous-espace propre $E_\lambda$ est de dimension finie. Les valeurs propres non nulles, rangées par valeurs absolues décroissantes, et $\lambda$ avant $-\lambda$ en cas d'égalité, forment donc une suite $(\lambda_n)_{n < N}$, finie si $N \in \lex{ensemble-entiers-naturels}{\mathbb N}$, ou infinie si $N = \infty$ ; dans ce second cas, $\lambda_n \to 0$.

      (iii) *Théorème spectral.* Soit $p_n$ la projection orthogonale sur $E_{\lambda_n}$, et $F$ l'adhérence du sous-espace engendré par les $E_{\lambda_n}$. Alors $F = (\operatorname{Ker} u)^\perp$ et $H = F \oplus \operatorname{Ker} u$. Pour tout $x \in H$,
      $$\begin{aligned} x &= q(x) + \sum_{n < N} p_n(x), \\ u(x) &= \sum_{n < N} \lambda_n\, p_n(x), \end{aligned}$$
      où $q(x) \in \operatorname{Ker} u$ et où les séries convergent dans $H$. Si $N = \infty$, la norme d'opérateur de $u - \sum_{n < k} \lambda_n p_n$ vaut $|\lambda_k|$, qui tend vers $0$ : $u$ est limite d'opérateurs de rang fini.

      (iv) *Base de vecteurs propres.* Le sous-espace $(\operatorname{Ker} u)^\perp$ a une [[base-hilbertienne|base hilbertienne]] $(e_k)$, finie ou indexée par $\mathbb N$, formée de vecteurs propres, $u(e_k) = \mu_k e_k$, où chaque $\lambda_n$ figure parmi les $\mu_k$ autant de fois que la dimension de $E_{\lambda_n}$. Pour tout $x \in H$,
      $$u(x) = \sum_k \mu_k \langle x, e_k \rangle\, e_k.$$
    preuve: |
      (i) Notons $Y$ l'adhérence de $u(\bar B)$, qui est compacte. Par le point (iii) du nœud {{f-autoadjoints|Opérateurs autoadjoints}}, $|||u|||$ est la plus grande des bornes supérieures de $\langle u(x), x \rangle$ et de $\langle -u(x), x \rangle$ sur $\bar B$. Quitte à remplacer $u$ par $-u$, encore autoadjoint, et compact puisque $(-u)(\bar B) = u(-\bar B) = u(\bar B)$, on peut supposer que $\lambda = |||u|||$, qui n'est pas nul, est la borne supérieure de $\langle u(x), x \rangle$ sur $\bar B$.

      Pour $\varepsilon > 0$, l'ensemble $A_\varepsilon$ des $x \in \bar B$ tels que $\langle u(x), x \rangle > \lambda - \varepsilon$ n'est pas vide, par définition de la borne supérieure. Pour $x \in A_\varepsilon$, puisque $\|u(x)\| \leqslant \lambda$ et $\|x\| \leqslant 1$,
      $$\begin{aligned} \|u(x) - \lambda x\|^2 &= \|u(x)\|^2 - 2\lambda\langle u(x), x \rangle \\ &\quad + \lambda^2\|x\|^2 \\ &\leqslant 2\lambda^2 - 2\lambda(\lambda - \varepsilon) \\ &= 2\lambda\varepsilon. \end{aligned}$$

      *Un point limite, sans suite.* Soit $C_\varepsilon$ l'adhérence de $u(A_\varepsilon)$ : c'est un fermé non vide contenu dans $Y$, et $C_\varepsilon \subset C_{\varepsilon'}$ pour $\varepsilon \leqslant \varepsilon'$. Une intersection finie $C_{\varepsilon_1} \cap \cdots \cap C_{\varepsilon_r}$ contient le plus petit de ces fermés et n'est pas vide ; comme $Y$ est compact ({{t-compact|Compacité}}), l'intersection de tous les $C_\varepsilon$ contient un point $y$.

      *Ce point est un vecteur propre.* Soit $\varepsilon > 0$. Comme $y \in C_\varepsilon$, il existe $x \in A_\varepsilon$ tel que $\|u(x) - y\| < \varepsilon$ ({{me-topologie|Topologie d'une distance}}, (ii)). Alors $\|y - \lambda x\| < \varepsilon + \sqrt{2\lambda\varepsilon}$, et
      $$u(y) - \lambda y = u(y - \lambda x) + \lambda\big(u(x) - y\big)$$
      a une norme au plus $\lambda\big(2\varepsilon + \sqrt{2\lambda\varepsilon}\big)$. Ceci valant pour tout $\varepsilon > 0$, $u(y) = \lambda y$.

      De plus, $\|u(x)\| \geqslant \langle u(x), x \rangle > \lambda - \varepsilon$ par l'inégalité de Cauchy-Schwarz, d'où $\|y\| > \|u(x)\| - \varepsilon > \lambda - 2\varepsilon$. Donc $\|y\| \geqslant \lambda > 0$, et $y$ est un vecteur propre associé à $\lambda$.

      (ii) Soit $\varepsilon > 0$. La partie compacte $Y$ est précompacte ({{me-precompacts|Parties précompactes}}, (i)) : elle est contenue dans une réunion de boules $B(c_1, r), \dots, B(c_m, r)$ de rayon $r = \varepsilon/\sqrt2$, et deux points d'une même boule sont à distance $< \sqrt2\,\varepsilon$.

      Soient $e_1, \dots, e_k$ des vecteurs de norme $1$, deux à deux orthogonaux, propres pour des valeurs propres $\mu_1, \dots, \mu_k$ telles que $|\mu_i| \geqslant \varepsilon$. Pour $i \neq j$,
      $$\begin{aligned} \|u(e_i) - u(e_j)\|^2 &= \|\mu_i e_i - \mu_j e_j\|^2 \\ &= \mu_i^2 + \mu_j^2 \geqslant 2\varepsilon^2, \end{aligned}$$
      si bien que les $u(e_i)$, qui sont dans $Y$, appartiennent à des boules distinctes : $k \leqslant m$.

      Des vecteurs propres de norme $1$ associés à des valeurs propres distinctes sont deux à deux orthogonaux ({{f-autoadjoints|Opérateurs autoadjoints}}, (i)). Il y a donc au plus $m$ valeurs propres $\lambda$ telles que $|\lambda| \geqslant \varepsilon$.

      Soit $\lambda \neq 0$ une valeur propre, et prenons $\varepsilon = |\lambda|$. Si $E_\lambda$ contenait une famille libre de $m + 1$ vecteurs, le procédé de Gram-Schmidt, tel que le décrit la démonstration du nœud {{f-bases-hilbertiennes|Bases hilbertiennes}}, (iii), appliqué à une famille libre finie, en fait une famille orthonormale de même espace engendré, formée de $m + 1$ vecteurs propres de norme $1$ deux à deux orthogonaux, ce qui est exclu. Une famille libre de $E_\lambda$ ayant le plus grand nombre d'éléments, au plus $m$, engendre alors $E_\lambda$ ({{v-libre|Familles libres, bases}}, (iv)) : $E_\lambda$ est de dimension finie.

      *Rangement.* Soit $\Lambda$ l'ensemble des valeurs propres non nulles, ordonné en plaçant $\lambda$ avant $\mu$ si $|\lambda| > |\mu|$, ou si $|\lambda| = |\mu|$ et $\lambda > \mu$. C'est un ordre total, pour lequel chaque $\mu$ n'a qu'un nombre fini de prédécesseurs, puisque ceux-ci vérifient $|\lambda| \geqslant |\mu|$.

      On définit par récurrence sur $n$, la donnée à chaque étape étant la liste $(\lambda_0, \dots, \lambda_{n-1})$ déjà construite, $\lambda_n$ comme le premier élément de $\Lambda$ distinct de $\lambda_0, \dots, \lambda_{n-1}$, tant qu'il en reste. Il existe : si $\mu$ est l'un des éléments restants, les éléments restants qui précèdent $\mu$ ou lui sont égaux forment un ensemble fini, non vide et totalement ordonné ; leur premier élément est le premier des éléments restants, puisque tout élément restant qui le précède précède aussi $\mu$. Tout $\mu \in \Lambda$ est atteint, au plus tard au rang égal au nombre de ses prédécesseurs. Si la suite est infinie, seuls un nombre fini de ses termes vérifient $|\lambda_n| \geqslant \varepsilon$, pour tout $\varepsilon > 0$ : elle tend vers $0$.

      (iii) Notons $E_n = E_{\lambda_n}$, de dimension finie et non nul. Les $E_n$ sont deux à deux orthogonaux ({{f-autoadjoints|Opérateurs autoadjoints}}, (i)), et chacun est stable par $u$, qui y vaut $\lambda_n\,\mathrm{id}$.

      *Développement de $x$.* Fixons $x$, et posons $s_k = \sum_{n < k} p_n(x)$ pour $k \leqslant N$. Pour $z \in E_n$ avec $n < k$, on a $\langle p_{n'}(x), z \rangle = 0$ pour $n' \neq n$, et $\langle x - p_n(x), z \rangle = 0$, d'où $\langle x - s_k, z \rangle = 0$. Le vecteur $x - s_k$ est donc orthogonal à $s_k$, et, les $p_n(x)$ étant deux à deux orthogonaux,
      $$\|x\|^2 = \|x - s_k\|^2 + \sum_{n < k} \|p_n(x)\|^2.$$

      Ainsi $\sum_n \|p_n(x)\|^2 \leqslant \|x\|^2$. Si $N$ est fini, on pose $s(x) = s_N$. Sinon, pour $k < l$,
      $$\|s_l - s_k\|^2 = \sum_{k \leqslant n < l} \|p_n(x)\|^2$$
      est le reste d'une série convergente : la suite $(s_k)$ est de Cauchy, et converge vers un $s(x) \in F$, $H$ étant complet. Par continuité du produit scalaire, $q(x) = x - s(x)$ est orthogonal à chaque $E_n$.

      *Le noyau.* Soit $G$ l'ensemble des vecteurs orthogonaux à tous les $E_n$, c'est-à-dire l'orthogonal du sous-espace qu'ils engendrent, lequel est stable par $u$. C'est un sous-espace fermé stable par $u$, et la restriction $v$ de $u$ à $G$ est un opérateur autoadjoint de l'espace de Hilbert $G$ ({{f-autoadjoints|Opérateurs autoadjoints}}, (ii)).

      Elle est compacte : $v(\bar B \cap G)$ est contenu dans $Y \cap G$, partie fermée du compact $Y$, donc compacte ({{t-compact-prop|Parties compactes}}, (i)) et fermée ; l'adhérence de $v(\bar B \cap G)$, dans $G$ comme dans $H$, en est une partie fermée, donc compacte.

      Si $v$ n'était pas nul, il aurait par (i) une valeur propre non nulle $\mu$, de vecteur propre $z \in G$. Alors $u(z) = \mu z$, $\mu$ serait l'un des $\lambda_n$, et $z \in E_n \cap G$ serait orthogonal à lui-même, donc nul. Ainsi $v = 0$, c'est-à-dire $G \subset \operatorname{Ker} u$. Réciproquement, $\operatorname{Ker} u$, sous-espace propre de la valeur $0$, est orthogonal à chaque $E_n$, puisque $\lambda_n \neq 0$ ({{f-autoadjoints|Opérateurs autoadjoints}}, (i)). Donc $G = \operatorname{Ker} u$.

      *Conclusion.* Le vecteur $q(x)$ appartient donc à $\operatorname{Ker} u$, ce qui donne la première formule. Par continuité du produit scalaire, $G$ est aussi l'orthogonal de $F$, de sorte que $\operatorname{Ker} u = F^\perp$ ; la première formule donne $H = F + \operatorname{Ker} u$, et la somme est directe puisque $F \cap F^\perp = \{0\}$.

      L'égalité $\operatorname{Ker} u = F^\perp$ donne $F \subset (\operatorname{Ker} u)^\perp$. Réciproquement, si $x \in (\operatorname{Ker} u)^\perp$, le vecteur $q(x) = x - s(x)$, qui est dans $\operatorname{Ker} u = F^\perp$, est orthogonal à $x$ et à $s(x) \in F$, donc à lui-même : $x = s(x) \in F$. Enfin, $u$ étant continu et nul sur $\operatorname{Ker} u$,
      $$u(x) = u(s(x)) = \lim_k \sum_{n < k} \lambda_n\, p_n(x).$$

      *Norme du reste.* Si $N = \infty$, le vecteur $\big(u - \sum_{n < k} \lambda_n p_n\big)(x)$ est la limite des sommes $\sum_{k \leqslant n < l} \lambda_n p_n(x)$, dont les termes sont deux à deux orthogonaux. Le carré de sa norme vaut donc
      $$\sum_{n \geqslant k} \lambda_n^2 \|p_n(x)\|^2 \leqslant \lambda_k^2 \|x\|^2,$$
      les $|\lambda_n|$ décroissant ; il y a égalité pour un vecteur propre de norme $1$ associé à $\lambda_k$. L'opérateur $\sum_{n < k} \lambda_n p_n$ a son image dans $E_0 + \cdots + E_{k-1}$, de dimension finie.

      (iv) Choisissons, pour chaque $n < N$, une base orthonormée de $E_n$, et mettons ces bases bout à bout dans l'ordre des $n$. On obtient une famille $(e_k)$ de vecteurs propres, finie ou indexée par $\mathbb N$, orthonormale puisque les $E_n$ sont deux à deux orthogonaux, et contenue dans $F = (\operatorname{Ker} u)^\perp$, qui est un espace de Hilbert ({{f-evn|Espaces normés}}, (iv)).

      Un vecteur $z \in F$ orthogonal à tous les $e_k$ est orthogonal à chaque $E_n$, donc à $F$, et il est nul. Si la famille est infinie, le critère du nœud {{f-bases-hilbertiennes|Bases hilbertiennes}}, (ii), montre que c'est une base hilbertienne de $F$ ; si elle est finie, $N$ est fini, et pour $x \in F = (\operatorname{Ker} u)^\perp$, le point (iii) donne $x = s(x) = \sum_{n < N} p_n(x)$ : donc $F = E_0 + \cdots + E_{N-1}$, et la famille en est une base orthonormée.

      Pour chaque $n$, $p_n(x) = \sum \langle x, e_k \rangle e_k$, la somme portant sur les indices $k$ de la base de $E_n$, et $\lambda_n p_n(x) = \sum \mu_k \langle x, e_k \rangle e_k$ sur ces mêmes indices. Les sommes partielles de la série $\sum_k \mu_k \langle x, e_k \rangle e_k$ forment une suite de Cauchy, puisque $\sum_k \mu_k^2 \langle x, e_k \rangle^2 \leqslant |||u|||^2 \|x\|^2$ par l'inégalité de Bessel ; leur sous-suite formée des fins de blocs tend vers $u(x)$ par (iii), et la série converge donc vers $u(x)$ ({{me-cauchy|Espaces complets}}, (i)).

      *Sans choix dans le cas séparable.* Si $(d_j)$ est une suite dense de $H$, les $p_n(d_j)$ forment une suite dense de $E_n$, puisque $p_n$ est surjective sur $E_n$ et vérifie $\|p_n(x) - p_n(x')\| \leqslant \|x - x'\|$. Le procédé de Gram-Schmidt ({{f-bases-hilbertiennes|Bases hilbertiennes}}, (iii)), appliqué à cette suite, fournit sans choix une famille orthonormale finie de $E_n$, qui engendre un sous-espace $V$ dense dans $E_n$. Or $V$ est fermé, comme noyau de $\mathrm{id} - p_V$, qui est continue : donc $V = E_n$, et cette famille est une base orthonormée de $E_n$.
    remarques:
      - |
        La compacité ne peut pas être omise. Sur $\lex{espace-L2}{L^2}([0, 1])$, l'opérateur de multiplication $M f(x) = x f(x)$ est continu, de norme au plus $1$, et autoadjoint, puisque $\langle Mf, g \rangle = \int_0^1 x f(x) g(x) \, dx$. Il n'a aucune valeur propre : $x f(x) = \lambda f(x)$ presque partout entraîne que $f$ est nulle presque partout hors de $\{\lambda\}$, qui est négligeable.

        Le point (i) tombe donc, alors que $1$ est bien la borne supérieure de $\langle Mf, f \rangle$ sur la boule unité : pour $f = \frac1{\sqrt h}\mathbf 1_{[1 - h, 1]}$, de norme $1$, on trouve $\langle Mf, f \rangle = 1 - \frac h2$. Cette borne n'est pas atteinte, puisque $\|f\|_2^2 - \langle Mf, f \rangle = \int_0^1 (1 - x) f(x)^2 \, dx$ est strictement positif pour $f \neq 0$. La théorie spectrale des opérateurs autoadjoints qui ne sont pas compacts remplace les valeurs propres par une mesure, et dépasse ce chapitre.
      - |
        L'autoadjonction ne peut pas non plus être omise. L'opérateur $S$ de $\lex{espace-l2-suites}{\ell^2}$ défini par $S(x) = (0, x_0, \frac{x_1}2, \frac{x_2}3, \dots)$, c'est-à-dire $S(x)_{n+1} = \frac{x_n}{n+1}$, est compact. Il est en effet limite des opérateurs $S_N$ qui ne retiennent que $x_0, \dots, x_{N-1}$, d'image contenue dans le sous-espace engendré par $e_1, \dots, e_N$, avec $|||S - S_N||| = \frac1{N+1}$, et l'on conclut par le point (ii) du nœud {{f-compacts|Opérateurs compacts}}.

        Il n'a pourtant aucune valeur propre. L'égalité $S(x) = \lambda x$ donne $\lambda x_0 = 0$ et $\lambda x_{n+1} = \frac{x_n}{n+1}$ : si $\lambda = 0$, tous les $x_n$ sont nuls, et si $\lambda \neq 0$, $x_0 = 0$, puis, de proche en proche, tous les $x_n$. Il n'est pas autoadjoint : $\langle S(e_0), e_1 \rangle = 1$, alors que $\langle e_0, S(e_1) \rangle = 0$.
      - |
        Le théorème dit que tout opérateur compact autoadjoint ressemble à un opérateur diagonal du nœud {{f-compacts-exemples|Exemples d'opérateurs compacts}} : dans la base hilbertienne $(e_k)$ de $(\operatorname{Ker} u)^\perp$, il multiplie chaque coordonnée par un réel $\mu_k$, et les $\mu_k$ tendent vers $0$. C'est l'analogue exact de la forme matricielle du théorème en dimension finie ({{f-spectral-fini|Théorème spectral}}, (iii)), où la dimension finie dispense de toute question de convergence.
      - |
        Pour le noyau symétrique $K(x, y) = \min(x, y)$ sur $[0, 1]^2$, on a $T_K f(x) = \int_0^x y f(y) \, dy + x \int_x^1 f(y) \, dy$. En dérivant deux fois, l'équation $T_K f = \lambda f$ avec $\lambda \neq 0$ se ramène à $\lambda f'' = -f$, avec $f(0) = 0$ et $f'(1) = 0$. Ses solutions font appel aux fonctions trigonométriques de l'{{anc|analyse complexe}}, qui ne sont pas des ancêtres de cette branche.

        Les valeurs propres sont les $\frac{1}{(n + \frac12)^2\pi^2}$, de fonctions propres $\sin\big((n + \frac12)\pi x\big)$, et leur somme vaut $\frac12 = \int_0^1 K(x, x) \, dx$. C'est un cas de la formule de la trace, conséquence, admise ici, du théorème de J. Mercer sur les noyaux continus positifs (*Phil. Trans. R. Soc. A* 209, 1909).
      - |
        Le théorème est né de l'étude des équations intégrales. Dans la quatrième des communications qu'il leur consacre à partir de 1904, Hilbert étend le théorème des axes principaux aux formes quadratiques en une infinité de variables (« Grundzüge einer allgemeinen Theorie der linearen Integralgleichungen. Vierte Mitteilung », *Nachr. Ges. Wiss. Göttingen*, 1906, p. 157-228).

