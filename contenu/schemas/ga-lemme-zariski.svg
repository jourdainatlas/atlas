<svg class="schema" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Lemme de Zariski : la tour K ⊂ F ⊂ L, cas algébrique et cas transcendant">
<circle class="s-b f-b" cx="150" cy="44" r="19"/>
<text class="x-b" x="150" y="44" text-anchor="middle" dominant-baseline="central" font-size="19"><tspan font-family="KaTeX_Math" font-style="italic">L</tspan></text>
<circle class="s-b f-b" cx="150" cy="150" r="19"/>
<text class="x-b" x="150" y="150" text-anchor="middle" dominant-baseline="central" font-size="19"><tspan font-family="KaTeX_Math" font-style="italic">F</tspan></text>
<circle class="s-b f-b" cx="150" cy="256" r="19"/>
<text class="x-b" x="150" y="256" text-anchor="middle" dominant-baseline="central" font-size="19"><tspan font-family="KaTeX_Math" font-style="italic">K</tspan></text>
<line class="s-b" x1="150" y1="63" x2="150" y2="131" style="stroke-width:1.8"/>
<line class="s-b" x1="150" y1="169" x2="150" y2="237" style="stroke-width:1.8"/>
<circle class="s-r f-r" cx="380" cy="44" r="19"/>
<text class="x-r" x="380" y="44" text-anchor="middle" dominant-baseline="central" font-size="19"><tspan font-family="KaTeX_Math" font-style="italic">L</tspan></text>
<circle class="s-r f-r" cx="380" cy="150" r="19"/>
<text class="x-r" x="380" y="150" text-anchor="middle" dominant-baseline="central" font-size="19"><tspan font-family="KaTeX_Math" font-style="italic">F</tspan></text>
<circle class="s-r f-r" cx="380" cy="256" r="19"/>
<text class="x-r" x="380" y="256" text-anchor="middle" dominant-baseline="central" font-size="19"><tspan font-family="KaTeX_Math" font-style="italic">K</tspan></text>
<line class="s-r" x1="380" y1="63" x2="380" y2="131" style="stroke-width:1.8"/>
<line class="s-r d" x1="380" y1="169" x2="380" y2="237" style="stroke-width:1.8"/>
<text class="x-b ui" x="150" y="14" text-anchor="middle" dominant-baseline="central" font-size="14">x algébrique</text>
<text class="x-r ui" x="380" y="14" text-anchor="middle" dominant-baseline="central" font-size="14">x transcendant</text>
<text class="x-b ui" x="122" y="97" text-anchor="end" dominant-baseline="central" font-size="13">dim finie</text>
<text class="x-b ui" x="122" y="114" text-anchor="end" dominant-baseline="central" font-size="13">(récurrence)</text>
<text class="x-b" x="122" y="203" text-anchor="end" dominant-baseline="central" font-size="15"><tspan font-family="KaTeX_Math" font-style="italic">F</tspan><tspan font-family="KaTeX_Main"> = </tspan><tspan font-family="KaTeX_Math" font-style="italic">K</tspan><tspan font-family="KaTeX_Main">[</tspan><tspan font-family="KaTeX_Math" font-style="italic">x</tspan><tspan font-family="KaTeX_Main">]</tspan></text>
<text class="x-b ui" x="122" y="222" text-anchor="end" dominant-baseline="central" font-size="13">dim ≤ deg Q</text>
<text class="x-r ui" x="408" y="97" text-anchor="start" dominant-baseline="central" font-size="13">dim finie</text>
<text class="x-r ui" x="408" y="114" text-anchor="start" dominant-baseline="central" font-size="13">(récurrence)</text>
<text class="x-r" x="408" y="193" text-anchor="start" dominant-baseline="central" font-size="15"><tspan font-family="KaTeX_Math" font-style="italic">F</tspan><tspan font-family="KaTeX_Main"> = </tspan><tspan font-family="KaTeX_Math" font-style="italic">A</tspan><tspan font-family="KaTeX_Main">,</tspan></text>
<text class="x-r ui" x="460" y="193" text-anchor="start" dominant-baseline="central" font-size="13">mais</text>
<text class="x-r" x="408" y="217" text-anchor="start" dominant-baseline="central" font-size="15"><tspan font-family="KaTeX_Main">1/(1 + </tspan><tspan font-family="KaTeX_Math" font-style="italic">x</tspan><tspan font-family="KaTeX_Main"> </tspan><tspan font-family="KaTeX_Math" font-style="italic">f</tspan><tspan font-family="KaTeX_Main">(</tspan><tspan font-family="KaTeX_Math" font-style="italic">x</tspan><tspan font-family="KaTeX_Main">)) ∉ </tspan><tspan font-family="KaTeX_Math" font-style="italic">A</tspan></text>
<text class="x-t ui" x="265" y="194" text-anchor="middle" dominant-baseline="central" font-size="13">⟹ L de dim</text>
<text class="x-t ui" x="265" y="212" text-anchor="middle" dominant-baseline="central" font-size="13">finie sur K</text>
</svg>
