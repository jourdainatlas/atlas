<text class="x-v" x="300" y="28" text-anchor="middle" dominant-baseline="central"><tspan font-family="KaTeX_Main">{</tspan><tspan font-family="KaTeX_Math" font-style="italic">b</tspan><tspan font-family="KaTeX_Main">, </tspan><tspan font-family="KaTeX_Math" font-style="italic">c</tspan><tspan font-family="KaTeX_Main">}</tspan></text>
</svg>
