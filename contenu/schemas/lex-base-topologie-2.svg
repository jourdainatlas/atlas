<text class="x-t" x="110" y="118" text-anchor="middle" dominant-baseline="central" font-size="17"><tspan font-family="KaTeX_Math" font-style="italic">a</tspan></text>
<circle class="p-r" cx="210" cy="100" r="3.6"/>
<text class="x-r" x="210" y="118" text-anchor="middle" dominant-baseline="central" font-size="17"><tspan font-family="KaTeX_Math" font-style="italic">b</tspan></text>
