<svg class="schema" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200" role="img" aria-label="Les parties {a, b} et {b, c} se chevauchent en b">
<ellipse class="s-b f-b" cx="160" cy="100" rx="92" ry="60"/>
<ellipse class="s-v f-v" cx="260" cy="100" rx="92" ry="60"/>
