# Niveau 2 : structure interne du chapitre « Groupe symétrique et déterminant » (nœud v-det du graphe
# alglin, regroupé le 29 oct. 2026 pour alléger le graphe de l'algèbre linéaire ; ids inchangés).
# Groupe symétrique et signature, formes n-linéaires alternées, déterminant d'un endomorphisme, d'une
# matrice, développement et comatrice.

graphe: v-det
titre: Groupe symétrique et déterminant
conteneur: v-det

