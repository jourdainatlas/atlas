  - id: projet
    titre: Le projet ATLAS
    texte: |
      ATLAS montre l'architecture des mathématiques comme un graphe qui part des axiomes de la théorie des ensembles. Chaque théorie s'ouvre sur un graphe de définitions et de théorèmes, et chaque notion n'y est employée qu'après avoir été définie. Les démonstrations sont complètes, ou explicitement marquées « Admis » avec l'indication de la difficulté contournée ; les termes et les notations renvoient à un lexique commun.

      Les cours, les exercices et les annales prolongent l'édifice vers l'enseignement : un chapitre de lycée ou un sujet de concours y est rattaché aux théories qui le fondent.
  - id: principes
    titre: Principes de rédaction
    texte: |
      Les textes sont écrits en phrases complètes, les exemples sont vérifiés par le calcul, et les pièges sont signalés là où ils se présentent. L'ordre d'exposition est strict : aucune notion n'est employée avant d'avoir été introduite, et quand un résultat servira plus loin, on l'annonce au lieu de s'y appuyer.
