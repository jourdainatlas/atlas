auteur: Armand Jourdain
fonction: Professeur agrégé de mathématiques
etablissement: Lycée de la Sauque, La Brède
initiales: AJ

sections:
  - id: parcours
    titre: Parcours
    texte: |
      Armand Jourdain a fait toute sa formation dans l'agglomération bordelaise. Après un baccalauréat scientifique, option sciences de l'ingénieur, au lycée Pape-Clément de Pessac, il entre en classes préparatoires au lycée Gustave-Eiffel, en PCSI puis en PSI*, et intègre l'école d'ingénieurs ENSEIRB-MATMECA. Il la quitte au bout d'un an pour revenir aux mathématiques elles-mêmes : licence, master de mathématiques approfondies, puis master de préparation à l'agrégation à l'université de Bordeaux, de 2016 à 2018.

      Reçu au CAFEP en 2018, il fait son année de titularisation au collège de l'Assomption, à Bordeaux, puis enseigne sept ans au collège et au lycée Saint-Joseph de Périgueux. Il obtient en 2025 le CAER-PA, le concours de l'agrégation pour l'enseignement privé sous contrat, et enseigne depuis la rentrée 2026 au lycée de la Sauque, à La Brède, où il avait fait ses premiers remplacements en 2017.
    etapes:
      - periode: 2008 – 2011
        titre: Baccalauréat scientifique, sciences de l'ingénieur
        lieu: Lycée Pape-Clément, Pessac
      - periode: 2011 – 2013
        titre: Classes préparatoires PCSI, puis PSI*
        lieu: Lycée Gustave-Eiffel, Bordeaux
      - periode: 2013 – 2014
        titre: École d'ingénieurs
        lieu: ENSEIRB-MATMECA, Bordeaux
      - periode: 2016 – 2018
        titre: Licence, master de mathématiques approfondies, master de préparation à l'agrégation
        lieu: Université de Bordeaux, Talence
      - periode: 2018
        titre: CAFEP de mathématiques, puis année de titularisation
        lieu: Collège de l'Assomption, Bordeaux
      - periode: 2019 – 2026
        titre: Professeur de mathématiques au collège et au lycée
        lieu: Saint-Joseph, Périgueux
      - periode: 2025
        titre: Agrégation de mathématiques (CAER-PA)
      - periode: Depuis 2026
        titre: Professeur agrégé de mathématiques
        lieu: Lycée de la Sauque, La Brède

  - id: enseignements
    titre: Enseignements
    texte: |
      Au lycée de la Sauque, il enseigne en Seconde, en spécialité mathématiques de Première et de Terminale, et en Maths expertes, l'option de Terminale qui prolonge la spécialité vers l'arithmétique, les nombres complexes, les graphes et les matrices.

      La rubrique Cours vient de cet enseignement : les chapitres de Terminale y sont en ligne, chacun avec sa feuille d'exercices corrigés, et rattachés aux théories de l'édifice qui les fondent. Les autres niveaux annoncés dans la rubrique seront versés au fil de leur rédaction.

  - id: concours
    titre: Préparation aux concours
    texte: |
      Il est responsable, au lycée, de la préparation aux concours et aux épreuves de mathématiques ouverts aux lycéens. Il y entraîne les élèves volontaires aux problèmes qui ne ressemblent pas à des exercices de cours : ceux où il faut chercher longtemps, essayer des cas particuliers, et rédiger une démonstration que personne n'a dictée. Il a accompagné des équipes au TFJM² à quatre reprises depuis 2023.
    epreuves:
      - nom: TFJM²
        public: Équipes de lycéens
        texte: |
          Le Tournoi français des jeunes mathématiciennes et mathématiciens, organisé par l'association Animath, réunit des équipes de quatre à six élèves. Elles travaillent pendant plusieurs mois sur des problèmes de recherche ouverts, puis défendent leurs résultats lors de tournois régionaux, en tenant tour à tour les rôles de défenseur, d'opposant et de rapporteur ; les meilleures équipes se retrouvent en finale nationale.
      - nom: Olympiades de mathématiques
        public: Élèves de Première
        texte: |
          Les Olympiades nationales de mathématiques sont une épreuve de quatre heures en deux parties : la première, nationale, se compose individuellement ; la seconde, académique, peut se traiter en équipe de deux à quatre élèves, qui rendent une seule copie.
      - nom: Concours général
        public: Élèves de Terminale
        texte: |
          Le Concours général des lycées distingue chaque année, sur proposition de leurs professeurs, les meilleurs élèves de Terminale. L'épreuve de mathématiques, individuelle, dure cinq heures.
      - nom: TeSciA
        public: Élèves de Terminale
        texte: |
          Le TeSciA, proposé par l'association AORES, n'est pas un concours mais un test : il situe le niveau des élèves de Terminale en mathématiques et en raisonnement, pour éclairer leur orientation vers les études scientifiques.

  - id: projet
    titre: Le projet ATLAS
    texte: |
      ATLAS montre l'architecture des mathématiques comme un graphe qui part des axiomes de la théorie des ensembles. Chaque théorie s'ouvre sur un graphe de définitions et de théorèmes, et chaque notion n'y est employée qu'après avoir été définie. Les démonstrations sont complètes, ou explicitement marquées « Admis » avec l'indication de la difficulté contournée ; les termes et les notations renvoient à un lexique commun.

      Les cours, les exercices et les annales prolongent l'édifice vers l'enseignement : un chapitre de lycée ou un sujet de concours y est rattaché aux théories qui le fondent.
  - id: principes
    titre: Principes de rédaction
    texte: |
      Les textes sont écrits en phrases complètes, les exemples sont vérifiés par le calcul, et les pièges sont signalés là où ils se présentent. L'ordre d'exposition est strict : aucune notion n'est employée avant d'avoir été introduite, et quand un résultat servira plus loin, on l'annonce au lieu de s'y appuyer.
  - id: contact
    titre: Contact
    a_rediger: true
    texte: |
      Coordonnées à venir.
