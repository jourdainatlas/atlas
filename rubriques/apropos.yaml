# Rubrique « À propos ».
# Les champs marqués « a_rediger » attendent le texte de l'auteur.
# Une section peut porter, en plus de son texte :
#   etapes:   frise du parcours (periode, titre, lieu) ;
#   epreuves: cartes des concours préparés (nom, public, texte).

auteur: Armand Jourdain
fonction: Professeur agrégé de mathématiques
etablissement: Lycée de la Sauque, La Brède
initiales: AJ
portrait: portrait.jpg   # fichier de identite/, copié dans site/ par rendu.mjs

sections:
  - id: parcours
    titre: Parcours
    texte: |
      Après les classes préparatoires du lycée Gustave-Eiffel, à Bordeaux, et un court passage en école d'ingénieurs, je suis revenu aux mathématiques elles-mêmes : j'ai poursuivi mes études à l'université de Bordeaux, jusqu'au master de préparation à l'agrégation. J'ai été reçu au CAFEP en 2018, puis à l'agrégation en 2025.
    etapes:
      - periode: 2011 – 2013
        titre: Classes préparatoires PCSI, puis PSI*
        lieu: Lycée Gustave-Eiffel, Bordeaux
      - periode: 2016 – 2018
        titre: Licence, master de mathématiques approfondies, master de préparation à l'agrégation
        lieu: Université de Bordeaux
      - periode: 2018
        titre: CAFEP de mathématiques
      - periode: 2025
        titre: Agrégation de mathématiques (CAER-PA)

  - id: enseignements
    titre: Enseignements
    texte: |
      J'enseigne au lycée de la Sauque, à La Brède, en Seconde, en spécialité mathématiques de Première et de Terminale, et en Maths expertes, l'option de Terminale qui prolonge la spécialité vers l'arithmétique, les nombres complexes, les graphes et les matrices.

      La rubrique Cours rassemble les cours et les feuilles d'exercices corrigés que j'écris pour ces classes ; chaque chapitre y est rattaché aux théories de l'édifice qui le fondent. S'y ajoutent des cours de classes préparatoires, en Maths approfondies, et d'autres niveaux suivront.

  - id: concours
    titre: Préparation aux concours
    texte: |
      Au lycée, je suis responsable de la préparation aux concours et aux épreuves de mathématiques ouverts aux lycéens. J'y entraîne les élèves volontaires aux problèmes qui ne ressemblent pas à des exercices de cours : ceux où il faut chercher longtemps, essayer des cas particuliers, et rédiger une démonstration que personne n'a dictée. Depuis 2023, j'ai accompagné des équipes au TFJM² à quatre reprises.
    epreuves:
      - nom: TFJM²
        public: Équipes de lycéens
        texte: |
          Le Tournoi français des jeunes mathématiciennes et mathématiciens, organisé par l'association Animath, réunit des équipes de quatre à six élèves. Elles travaillent pendant plusieurs mois sur des problèmes de recherche ouverts, puis défendent leurs résultats lors de tournois régionaux, en tenant tour à tour les rôles de défenseur, d'opposant et de rapporteur ; les meilleures équipes se retrouvent en finale nationale.
      - nom: Olympiades de mathématiques
        public: Élèves de Première
        texte: |
          Les Olympiades nationales de mathématiques sont une épreuve de quatre heures en deux parties : la première, nationale, se compose individuellement ; la seconde, académique, peut se traiter en équipe de deux à quatre élèves, qui rendent une seule copie.
      - nom: Concours général
        public: Élèves de Terminale
        texte: |
          Le Concours général des lycées distingue chaque année, sur proposition de leurs professeurs, les meilleurs élèves de Terminale. L'épreuve de mathématiques, individuelle, dure cinq heures.
      - nom: TeSciA
        public: Élèves de Terminale
        texte: |
          Le TeSciA, proposé par l'association AORES, n'est pas un concours mais un test : il situe le niveau des élèves de Terminale en mathématiques et en raisonnement, pour éclairer leur orientation vers les études scientifiques.

  - id: projet
    titre: Le projet ATLAS
    texte: |
      J'ai conçu ATLAS pour montrer l'architecture des mathématiques : un graphe qui part des axiomes de la théorie des ensembles, où chaque théorie s'ouvre sur ses définitions et ses théorèmes, et où chaque notion n'est employée qu'après avoir été définie. Les démonstrations sont complètes, ou explicitement marquées « Admis » avec l'indication de la difficulté contournée ; les termes et les notations renvoient à un lexique commun.

      Les cours, les exercices et les annales prolongent l'édifice vers l'enseignement : un chapitre de lycée ou un sujet de concours y est rattaché aux théories qui le fondent, pour que l'on voie d'où vient ce que l'on apprend.
  - id: principes
    titre: Principes de rédaction
    texte: |
      J'écris en phrases complètes, je vérifie les exemples par le calcul, et je signale les pièges là où ils se présentent. L'ordre d'exposition est strict : aucune notion n'est employée avant d'avoir été introduite, et quand un résultat servira plus loin, je l'annonce au lieu de m'y appuyer.
  - id: contact
    titre: Contact
    texte: |
      Une remarque, une question sur un cours ou une démonstration, une suggestion pour l'atlas : écrivez-moi à l'adresse ci-dessous. Les signalements d'erreurs me sont particulièrement précieux, qu'il s'agisse d'une coquille, d'un calcul faux ou d'une démonstration incomplète ; en indiquant la page concernée (le bouton « Partager » de l'en-tête en donne l'adresse), vous me permettez de la corriger rapidement.
    # L'adresse est stockée en deux morceaux et assemblée dans la page, pour gêner les robots
    # qui collectent les adresses dans le code source.
    courriel:
      local: contact
      domaine: atlasjourdain.fr
