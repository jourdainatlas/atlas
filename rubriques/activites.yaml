# Rubrique « Activités » (MEMO_atlas_activites.md) : catalogue des activités interactives.
# Une activité = un module activites/<id>.js, chargé seulement quand on l'ouvre.
#   groupes: [{id, titre, intro, couleur}]  (couleur: jeu, calcul, raison, geo, annales ou marque, facultatif : teinte propre au groupe, sinon olive ; marque = rouge du logo, réservé au parcours du jour)
#   groupes, suite :  un intercalaire par groupe ; ses activités sont dans un sous-menu.
#             L'identifiant d'un groupe ne doit pas être celui d'une activité.
#   activites: id (module et adresse #activites/<id>), titre, onglet (titre court), niveau, resume (une ou deux
#             phrases, cartes et descriptions), texte (page de lecture : ce qu'on observe, ce que cela signifie, le
#             piège), cours: [chapitres], noeuds: [fiches de l'édifice], et soit groupe: <id>, soit rien : une
#             activité sans groupe a son propre intercalaire, sans sous-menu.
#             domaine: un identifiant de la liste domaines ; il colore la carte aux couleurs des familles de
#             l'édifice et sert de filtre. niveaux: [identifiants de la liste niveaux], pour le filtre par niveau
#             (niveau, lui, est le texte affiché).
#             vignette: intérieur d'un dessin SVG de 120 sur 72 (classes a, f, p, t, e : voir .activites-vig).
#   niveaux, domaines: [{id, titre}] listes des filtres, dans l'ordre d'affichage. Les intercalaires suivent l'ordre du fichier.
intro: |
  Cinq façons de faire des mathématiques avec les mains. Les **explorations** font varier une figure ou un nombre pour voir une définition ou un théorème à l'œuvre, du nombre dérivé à la loi binomiale. Les **casse-têtes** se jouent sur la page, à la taille que l'on veut, avant de livrer l'invariant, la récurrence ou le système linéaire qui les explique. Le **calcul mental** propose chaque jour un nombre à atteindre avec six autres, et des séries de dix calculs chronométrés sur le programme de chaque classe. **Raisonner** fait reconstruire des démonstrations classiques, chercher l'erreur dans des raisonnements faux, trouver le contre-exemple d'un énoncé faux et distinguer un théorème de sa réciproque. Le **parcours du jour** réunit six de ces exercices, au niveau de la classe choisie. L'**atelier de construction** propose des figures à bâtir à la règle et au compas, que l'on secoue pour vérifier qu'elles tiennent. Chaque activité signale le piège le plus courant et renvoie au chapitre de cours et à la fiche de l'édifice où le résultat est énoncé et démontré.

niveaux:
  - {id: seconde, titre: "Seconde"}
  - {id: premiere, titre: "Première"}
  - {id: terminale, titre: "Terminale"}
  - {id: expertes, titre: "Maths expertes"}
  - {id: sup, titre: "Maths Sup"}

domaines:
  - {id: analyse, titre: "Analyse"}
  - {id: geometrie, titre: "Géométrie"}
  - {id: algebre, titre: "Algèbre"}
  - {id: probabilites, titre: "Probabilités"}
  - {id: denombrement, titre: "Dénombrement"}

groupes:
  - id: explorations
    titre: "Explorations"
    intro: |
      Chaque exploration part d'une phrase vague (« la pente en un point », « les termes se rapprochent de 2 ») et la remplace, figure après figure, par la définition exacte : on fait varier un nombre, on regarde ce qui se stabilise, puis on lit l'énoncé.
  - id: casse-tetes
    titre: "Casse-têtes"
    couleur: jeu
    intro: |
      Ici, on joue d'abord. Chaque casse-tête se règle (taille du plateau, nombre de pièces) et se résout sur la page ; la page connaît le jeu assez bien pour dire combien de coups il reste, ou qu'il n'y a pas de solution. Les mathématiques viennent après la partie : un invariant, une récurrence, un dénombrement.
  - id: calcul
    titre: "Calcul mental"
    couleur: calcul
    intro: |
      Du calcul à faire de tête, avec un rendez-vous quotidien : chaque jour, un nouveau nombre à atteindre, le même pour tous les visiteurs, en trois niveaux de difficulté. La page vérifie chaque opération, donne un indice sur demande et rappelle à la fin le plus court calcul possible. S'y ajoutent des séries de dix calculs chronométrés, fabriqués par la page sur le programme de Seconde, de Première, de Terminale ou de Maths Sup.
  - id: raisonner
    titre: "Raisonner"
    couleur: raison
    intro: |
      Quatre façons de travailler le raisonnement lui-même, de la Seconde à Maths Sup : reconstruire une démonstration classique dont les étapes ont été mélangées, en écartant les phrases fausses qui s'y sont glissées ; débusquer la ligne fautive d'un raisonnement qui aboutit à une absurdité ; désigner, parmi quatre objets, le contre-exemple qui réfute un énoncé faux ; et dire, de deux propriétés, laquelle entraîne l'autre.

activites:
  - id: parcours
    vignette: '<path class="t" d="M16 54C34 54 30 20 48 20S62 54 80 54 94 28 106 20"/><circle class="p" cx="16" cy="54" r="4"/><circle class="p" cx="48" cy="20" r="4"/><circle class="p" cx="64" cy="37" r="4"/><circle cx="80" cy="54" r="4" fill="var(--surface)"/><circle cx="95.25" cy="40" r="4" fill="var(--surface)"/><circle cx="106" cy="20" r="4" fill="var(--surface)"/>'
    titre: "Parcours du jour"
    onglet: "Parcours du jour"
    niveau: "Seconde, Première, Terminale, Maths expertes, Maths Sup"
    niveaux: [seconde, premiere, terminale, expertes, sup]
    couleur: marque
    resume: |
      Six étapes par jour, au niveau de votre classe : le nombre du « Compte est bon », dix calculs de tête, une démonstration à remettre en ordre, une erreur à trouver, un contre-exemple et une question de logique. Un quart d'heure pour entretenir le calcul et le raisonnement.
    texte: |
      On choisit sa classe une fois, Seconde, Première, Terminale, Terminale avec l'option Maths expertes, ou Maths Sup, et la page propose chaque jour six étapes, les mêmes pour tous les visiteurs de cette classe. Chaque étape ouvre l'activité correspondante, déjà réglée sur la classe et sur la pièce du jour, puis ramène au parcours, où elle est marquée comme faite. Le parcours change à minuit, heure de Paris.

      Ce que cela signifie : le calcul et le raisonnement s'entretiennent par une pratique courte et régulière. La difficulté suit la classe : « Le compte est bon » est au niveau $1$ en Seconde et en Première, au niveau $2$ ensuite (le niveau $3$, plus long, reste proposé dans l'activité), les dix calculs portent sur le programme de la classe, et les quatre pièces de raisonnement sont tirées parmi celles de la classe.

      Le piège le plus courant est de traiter le parcours comme une liste de cases à cocher : une étape réussie par élimination mérite que l'on relise l'explication donnée par la page, car c'est elle qui fait progresser.
    cours: [ma-01]
    noeuds: [n-recurrence]
  - id: derivee
    vignette: '<path class="e" d="M8 58Q70 58 112 10"/><path class="a" d="M40 61L110 20.5"/><circle class="p" cx="75.2" cy="40.7" r="3.6"/>'
    titre: "La pente en un point"
    onglet: "La pente en un point"
    niveau: "Première"
    niveaux: [premiere]
    groupe: explorations
    domaine: analyse
    resume: |
      On mesure la pente d'une sécante, on rapproche ses deux points, puis on grossit la courbe jusqu'à ne plus voir qu'une droite : le nombre dérivé est la limite du taux d'accroissement, et cette limite n'existe pas toujours.
    texte: |
      On place deux points $A$ et $B$ sur la courbe d'une fonction $f$, d'abscisses $a$ et $a+h$, et l'on lit la pente de la sécante $(AB)$, qui est le taux d'accroissement $\dfrac{f(a+h)-f(a)}{h}$. En rapprochant $B$ de $A$, la sécante pivote puis se stabilise, et un tableau montre les taux pour $h = \pm 1$, $\pm 0{,}1$, …, $\pm 0{,}0001$ : pour $f(x)=x^2$ en $a=1$, ils valent $3$, $2{,}1$, $2{,}01$, … à droite et $1$, $1{,}9$, $1{,}99$, … à gauche, et s'approchent tous de $2$.

      Ce que cela signifie : le nombre dérivé $f'(a)$ n'est pas une valeur du taux d'accroissement, qui n'est pas défini en $h=0$ ; c'est sa limite quand $h$ tend vers $0$. Une loupe réglable montre la même chose sans calcul : vue d'assez près, la courbe d'une fonction dérivable en $a$ se confond avec sa tangente. En reportant la pente de la tangente au-dessus de chaque abscisse, on voit se dessiner la courbe de la fonction dérivée, que l'on est ensuite invité à tracer soi-même pour quatre courbes données sans formule.

      Le piège le plus courant est de croire que cette limite existe toujours. Pour $f(x)=|x|$ en $a=0$, tous les taux à droite valent $1$ et tous les taux à gauche valent $-1$ : il n'y a pas de pente commune, la fonction n'est pas dérivable en $0$, et la courbe garde son coin à toutes les échelles.
    cours: [p-04, ma-05, ma-09]
    noeuds: [de-derivee, de-monotonie]
  - id: limite-suite
    vignette: '<rect class="f" x="0" y="26" width="120" height="16"/><path class="t" d="M0 26H120M0 42H120"/><path class="a" d="M0 34H120"/><g class="p"><circle cx="10" cy="58" r="2.6"/><circle cx="20" cy="22" r="2.6"/><circle cx="30" cy="42" r="2.6"/><circle cx="40" cy="28" r="2.6"/><circle cx="50" cy="38.8" r="2.6"/><circle cx="60" cy="30" r="2.6"/><circle cx="70" cy="37.4" r="2.6"/><circle cx="80" cy="31" r="2.6"/><circle cx="90" cy="36.7" r="2.6"/><circle cx="100" cy="31.6" r="2.6"/><circle cx="110" cy="36.2" r="2.6"/></g>'
    titre: "La limite d'une suite"
    onglet: "La limite d'une suite"
    niveau: "Terminale"
    niveaux: [terminale]
    groupe: explorations
    domaine: analyse
    resume: |
      Une bande de tolérance autour d'une limite proposée, un rang à partir duquel plus aucun terme n'en sort : la définition de la convergence se joue contre un adversaire qui choisit la bande.
    texte: |
      On choisit une suite parmi cinq, une limite proposée $\ell$ et une tolérance $\varepsilon > 0$. Elles dessinent la bande $]\ell-\varepsilon\,;\ \ell+\varepsilon[$, et la page indique le plus petit rang $N$ à partir duquel tous les termes restent dans la bande, ou signale qu'aucun rang ne convient. Pour $u_n = 2 + \dfrac{(-1)^n}{n}$ et $\ell = 2$, on lit $N = 3$ pour $\varepsilon = 0{,}5$, puis $N = 11$ pour $\varepsilon = 0{,}1$ et $N = 101$ pour $\varepsilon = 0{,}01$ : le rang dépend de la tolérance.

      Ce que cela signifie : la suite $(u_n)$ converge vers $\ell$ si, pour tout $\varepsilon > 0$, il existe un rang $N$ tel que, pour tout $n \geqslant N$, $|u_n - \ell| < \varepsilon$. Un jeu en trois manches fait pratiquer l'ordre des quantificateurs : un adversaire choisit $\varepsilon$, on répond par un rang, ou l'on affirme qu'aucun rang ne convient.

      Le piège le plus courant est de croire que quelques bandes gagnées prouvent la convergence. Avec la mauvaise limite $\ell = 2{,}3$, la bande large $\varepsilon = 0{,}5$ contient tous les termes à partir du rang $6$, mais dès que $\varepsilon < 0{,}3$ une infinité de termes lui échappent. À l'inverse, une seule bande sans rang possible suffit à réfuter : la suite $u_n = 2 + (-1)^n$ ne converge vers aucun réel.
    cours: [t-01, ma-07]
    noeuds: [su-convergence, su-bornee]
  - id: cercle-trigo
    vignette: '<path d="M22 36H98M60 4V68"/><circle class="e" cx="60" cy="36" r="26"/><path d="M60 36L76.7 16.1"/><path class="t" d="M76.7 16.1V36M76.7 16.1H60"/><path class="a" d="M60 36H76.7"/><circle class="p" cx="76.7" cy="16.1" r="3.6"/>'
    titre: "Le cercle trigonométrique"
    onglet: "Le cercle trigonométrique"
    niveau: "Première"
    niveaux: [premiere]
    groupe: explorations
    domaine: geometrie
    resume: |
      Un point tourne sur le cercle de rayon 1 : son abscisse est le cosinus, son ordonnée le sinus. On les regarde se dérouler en deux courbes, puis on relit sur le cercle les formules des angles associés.
    texte: |
      On enroule la droite des réels sur le cercle de centre $O$ et de rayon $1$ à partir du point $I(1\,;0)$ : le réel $t$ arrive en un point $M$, et l'on pose $\cos t$ égal à l'abscisse de $M$, $\sin t$ égal à son ordonnée. La page fait tourner $M$ à la souris, au doigt ou par un curseur qui avance degré par degré, et affiche les valeurs exactes aux multiples de $\dfrac{\pi}{6}$ et de $\dfrac{\pi}{4}$ : pour $t = \dfrac{2\pi}{3}$, on lit $\cos t = -\dfrac12$ et $\sin t = \dfrac{\sqrt3}{2}$.

      Ce que cela signifie : comme $OM = 1$, on a $\cos^2 t + \sin^2 t = 1$ pour tout réel $t$, et comme un tour mesure $2\pi$, les deux fonctions sont périodiques de période $2\pi$. Une seconde figure reporte $t$ en abscisse : les coordonnées de $M$ dessinent les courbes du cosinus et du sinus, la seconde étant la première décalée de $\dfrac{\pi}{2}$. Une troisième partie place le point associé à $-t$, $\pi - t$, $\pi + t$, $\dfrac{\pi}{2} - t$ ou $\dfrac{\pi}{2} + t$, et fait lire les formules sur la symétrie qui relie les deux points.

      Le piège le plus courant est l'erreur de signe : $\cos(\pi - t) = -\cos t$, mais $\sin(\pi - t) = \sin t$. L'autre est l'unité : $t$ est une longueur d'arc, donc un nombre de radians, et une calculatrice réglée en degrés donne $\cos 3 \approx 0{,}9986$ au lieu de $\cos 3 \approx -0{,}9900$.
    cours: [p-06, ma-04]
    noeuds: [tg-prolongement, tg-cercle]
  - id: second-degre
    vignette: '<path d="M10 40H110"/><path class="t" d="M60 4V68"/><path class="e" d="M30 8Q60 100 90 8"/><circle class="p" cx="43.4" cy="40" r="3.4"/><circle class="p" cx="76.6" cy="40" r="3.4"/><circle class="p" cx="60" cy="54" r="3.4"/>'
    titre: "Le trinôme du second degré"
    onglet: "Le trinôme du second degré"
    niveau: "Première"
    niveaux: [premiere]
    groupe: explorations
    domaine: algebre
    resume: |
      Trois coefficients, une parabole : on règle $a$, $b$ et $c$ et l'on voit bouger ensemble le sommet, la forme canonique, le discriminant et les racines.
    texte: |
      Trois curseurs règlent les coefficients de $f(x) = ax^2 + bx + c$, par pas de $0{,}05$. La page trace la parabole, son axe et son sommet $S(\alpha\,;\beta)$, et écrit en valeurs exactes les trois formes du trinôme, le discriminant $\Delta = b^2 - 4ac$ et les racines. Pour $f(x) = x^2 - 2x - 3$, on lit $\Delta = 16$, le sommet $S(1\,;-4)$, la forme canonique $(x-1)^2 - 4$ et la forme factorisée $(x+1)(x-3)$.

      Ce que cela signifie : $c = f(0)$ fixe la hauteur, le signe de $a$ le sens d'ouverture, et $b$ fait glisser le sommet le long de la parabole d'équation $y = -ax^2 + c$. L'axe de symétrie est $x = \alpha$ avec $\alpha = -\dfrac{b}{2a}$, et $f(x) = a(x-\alpha)^2 + \beta$ avec $\beta = -\dfrac{\Delta}{4a}$ : le signe de $\Delta$ dit donc si la parabole coupe l'axe des abscisses en deux points, le touche en un seul, ou ne le rencontre pas.

      Le piège le plus courant est le signe de $\alpha = -\dfrac{b}{2a}$ : pour $x^2 - 2x - 3$, l'axe est $x = 1$ et non $x = -1$. L'autre est de lire $\Delta < 0$ comme « le trinôme est négatif » : il signifie seulement que le trinôme ne s'annule pas, et celui-ci garde alors partout le signe de $a$.
    cours: [p-01]
    noeuds: [c-racines-carrees]
  - id: aire-primitive
    vignette: '<path class="f" d="M40 62L39.9 24.8L55 20L71 18.8L85.7 20.7V62Z"/><path d="M6 62H114"/><path class="e" d="M8 50Q50 0 112 30"/><path class="a" d="M39.9 24.8V62M85.7 20.7V62"/>'
    titre: "L'aire sous la courbe"
    onglet: "L'aire sous la courbe"
    niveau: "Terminale"
    niveaux: [terminale]
    groupe: explorations
    domaine: analyse
    resume: |
      L'aire comprise entre une courbe et l'axe, de $a$ à $x$, est une fonction de $x$. En avançant d'une fine tranche, on voit pourquoi sa dérivée est la fonction de départ, et pourquoi il faut que celle-ci soit continue.
    texte: |
      On choisit une fonction $f$, une borne fixe $a$ et une borne mobile $x$. La page colore l'aire algébrique entre la courbe et l'axe, de $a$ à $x$, et trace en dessous la courbe de $F(x) = \displaystyle\int_a^x f(t)\,\mathrm dt$. Pour $f(x) = \dfrac{x}{2} + 1$ et $a = 0$, on lit $F(2) = 3$, l'aire d'un trapèze de bases $1$ et $2$ et de hauteur $2$.

      Ce que cela signifie : entre $x$ et $x + h$, l'aire gagne une tranche $F(x+h) - F(x)$. Un rectangle de base $h$ et de même aire a pour hauteur le taux d'accroissement $\dfrac{F(x+h)-F(x)}{h}$, qui est la valeur moyenne de $f$ sur $[x\,;x+h]$ ; quand $h$ tend vers $0$, cette hauteur tend vers $f(x)$ si $f$ est continue en $x$. C'est le théorème fondamental : $F$ est dérivable et $F' = f$. Une fonction en escalier, qui saute de $1$ à $2{,}5$ en $x = 1$, montre que l'hypothèse compte : en $1$, les taux valent $2{,}5$ à droite et $1$ à gauche, et $F$ n'est pas dérivable.

      Le piège le plus courant est de prendre l'intégrale pour une aire ordinaire. C'est une aire algébrique : pour $f(x) = \dfrac{x^2}{4} - 1$, négative sur $]-2\,;2[$, on a $\displaystyle\int_{-2}^{2} f(t)\,\mathrm dt = -\dfrac83$, alors que l'aire du domaine vaut $\dfrac83$.
    cours: [t-06, ma-18]
    noeuds: [ar-tfa]
  - id: toile-suite
    vignette: '<path d="M10 66L80 6"/><path class="e" d="M10 44Q60 30 112 22"/><path class="a" d="M100 66V23.5H59.6V31.7H50V33.7H47.7"/><circle class="p" cx="46.5" cy="34.6" r="3.2"/>'
    titre: "Suites récurrentes : la toile d'araignée"
    onglet: "La toile d'araignée"
    niveau: "Terminale, Maths Sup"
    niveaux: [terminale, sup]
    groupe: explorations
    domaine: analyse
    resume: |
      Une suite $u_{n+1} = f(u_n)$ se construit avec la courbe de $f$ et la droite $y = x$. L'escalier ou la spirale obtenus disent si elle converge, et la pente de $f$ au point fixe explique pourquoi.
    texte: |
      On choisit une fonction $f$ (affine de pente réglable, cosinus, ou $x \mapsto rx(1-x)$) et un premier terme $u_0$. La page construit les termes de la suite $u_{n+1} = f(u_n)$ en allant verticalement jusqu'à la courbe de $f$, puis horizontalement jusqu'à la droite $y = x$, et affiche leurs valeurs. Pour $f = \cos$, quel que soit $u_0$, les termes s'enroulent autour du point d'abscisse $\ell \approx 0{,}7391$.

      Ce que cela signifie : si la suite converge vers $\ell$ et si $f$ est continue en $\ell$, alors $\ell = f(\ell)$ ; les limites possibles sont les points fixes de $f$. Près d'un point fixe, tout dépend de $f'(\ell)$ : la suite avance en escalier si $f'(\ell) > 0$, en spirale si $f'(\ell) < 0$, et elle converge vers $\ell$ dès que $u_0$ en est assez proche lorsque $|f'(\ell)| < 1$. Pour $x \mapsto rx(1-x)$, le point fixe $1 - \dfrac1r$ a pour pente $2 - r$ : il attire pour $1 < r < 3$ et repousse pour $r > 3$.

      Le piège le plus courant est de croire qu'un point fixe suffit. Pour $f(x) = -1{,}2\,(x - 0{,}5) + 0{,}5$, le point fixe est $0{,}5$, mais $u_n - 0{,}5 = (-1{,}2)^n (u_0 - 0{,}5)$ : la suite s'en éloigne dès que $u_0 \neq 0{,}5$.
    cours: [t-01, ma-07]
    noeuds: [su-convergence, gd-point-fixe]
  - id: binomiale
    vignette: '<path d="M8 64H112"/><g class="f"><rect x="14" y="61" width="8" height="3"/><rect x="24" y="56" width="8" height="8"/><rect x="34" y="46" width="8" height="18"/><rect x="44" y="32" width="8" height="32"/><rect x="54" y="20" width="8" height="44"/><rect x="64" y="24" width="8" height="40"/><rect x="74" y="36" width="8" height="28"/><rect x="84" y="48" width="8" height="16"/><rect x="94" y="57" width="8" height="7"/></g><path class="a" d="M10 63C40 62 44 14 60 14S82 62 110 63"/>'
    titre: "De la loi binomiale à la courbe en cloche"
    onglet: "Binomiale et courbe en cloche"
    niveau: "Terminale, Maths Sup"
    niveaux: [terminale, sup]
    groupe: explorations
    domaine: probabilites
    resume: |
      Le diagramme de la loi binomiale, calculé exactement, se déplace et s'étale quand $n$ grandit. Centré et réduit, il se cale sur une courbe fixe : la densité de la loi normale.
    texte: |
      Deux curseurs règlent $n$, de $1$ à $200$, et $p$, de $0{,}02$ à $0{,}98$. La page trace le diagramme en barres de la loi binomiale $\mathcal B(n\,;p)$, dont chaque probabilité est calculée exactement, et indique l'espérance $np$ et l'écart-type $\sigma = \sqrt{np(1-p)}$. Une case centre et réduit le diagramme : la barre de $k$ est placée en $\dfrac{k - np}{\sigma}$, avec la largeur $\dfrac1\sigma$ et la hauteur $\sigma\,P(X = k)$, de sorte que son aire reste $P(X = k)$.

      Ce que cela signifie : quand $n$ grandit à $p$ fixé, le diagramme centré réduit se rapproche de la courbe de $\varphi(x) = \dfrac{1}{\sqrt{2\pi}}\,\mathrm e^{-x^2/2}$. C'est le théorème de De Moivre-Laplace : la probabilité que $\dfrac{X_n - np}{\sigma}$ soit entre $a$ et $b$ tend vers l'aire sous la courbe de $\varphi$ entre $a$ et $b$. Un tableau compare les probabilités exactes d'être à moins de un, deux ou trois écarts-types de l'espérance aux limites $0{,}6827$, $0{,}9545$ et $0{,}9973$ ; pour $n = 50$ et $p = 0{,}3$, on lit $0{,}7204$, $0{,}9567$ et $0{,}9969$.

      Le piège le plus courant est d'oublier que la loi binomiale ne prend que des valeurs entières. Pour $n = 100$ et $p = 0{,}5$, où $\sigma = 5$, on a $P(45 \leqslant X \leqslant 55) \approx 0{,}7287$ alors que la loi normale annonce $0{,}6827$ : les deux valeurs extrêmes, comptées en entier, pèsent lourd. Et quand $np$ est petit, comme pour $n = 30$ et $p = 0{,}05$, le diagramme reste dissymétrique.
    cours: [t-10, ma-21]
    noeuds: [p-tcl]
  - id: produit-scalaire
    vignette: '<path class="t" d="M6 62L112 31M57.8 12.6L67.5 44"/><path class="e" d="M18 58.5L98 35"/><path class="a" d="M18 58.5L57.8 12.6"/><path class="f" d="M18 56.5L67 42L68 46L19 60.5Z"/><circle class="p" cx="67.5" cy="44" r="3.4"/><circle class="p" cx="57.8" cy="12.6" r="3.4"/>'
    titre: "Le produit scalaire"
    onglet: "Le produit scalaire"
    niveau: "Première"
    niveaux: [premiere]
    groupe: explorations
    domaine: geometrie
    resume: |
      Deux vecteurs, un nombre, trois façons de le calculer : par les coordonnées, par les longueurs et l'angle, par un projeté. Son signe dit si l'angle est aigu ou obtus, et il s'annule exactement quand les vecteurs sont orthogonaux.
    texte: |
      On déplace les extrémités $A$ et $B$ de deux vecteurs $\vec u = \overrightarrow{OA}$ et $\vec v = \overrightarrow{OB}$, dont les coordonnées avancent par pas de $0{,}05$, et la page calcule $\vec u \cdot \vec v$ de trois façons : $xx' + yy'$, puis $\|\vec u\| \times \|\vec v\| \times \cos\theta$, puis $OA \times OH$ compté avec son signe, où $H$ est le projeté orthogonal de $B$ sur la droite $(OA)$. Pour $\vec u(4\,;1)$ et $\vec v(1{,}5\,;3)$, les trois calculs donnent $9$.

      Ce que cela signifie : le produit scalaire de deux vecteurs non nuls a le signe de $\cos\theta$, positif pour un angle aigu, négatif pour un angle obtus, et il est nul si et seulement si les vecteurs sont orthogonaux ; dans un repère orthonormé, cela se teste par $xx' + yy' = 0$. La troisième expression montre que déplacer $B$ perpendiculairement à $(OA)$ ne change pas le produit scalaire, puisque $H$ ne bouge pas.

      Le piège le plus courant est de traiter le produit scalaire comme un produit de nombres. Il peut être nul sans qu'aucun des deux vecteurs le soit : $(3\,;2) \cdot (-2\,;3) = -6 + 6 = 0$. On ne peut donc pas simplifier par $\vec u$ dans une égalité $\vec u \cdot \vec v = \vec u \cdot \vec w$.
    cours: [p-07, ma-19]
    noeuds: [me-produit-scalaire]
  - id: chemins-grille
    vignette: '<path d="M20 12V60M46.7 12V60M73.3 12V60M100 12V60M20 12H100M20 28H100M20 44H100M20 60H100"/><path class="a" d="M20 60H46.7V44H73.3V28H100V12"/><circle class="p" cx="20" cy="60" r="3.4"/><circle class="p" cx="100" cy="12" r="3.4"/>'
    titre: "Chemins sur une grille"
    onglet: "Chemins sur une grille"
    niveau: "Terminale, Maths Sup"
    niveaux: [terminale, sup]
    groupe: explorations
    domaine: denombrement
    resume: |
      Combien de chemins mènent d'un coin à l'autre d'un quadrillage en n'allant que vers la droite ou vers le haut ? Un chemin est un mot, leur nombre un coefficient binomial, et la grille se remplit comme le triangle de Pascal.
    texte: |
      Sur un quadrillage de $n$ pas vers la droite et $p$ pas vers le haut, avec $n$ et $p$ de $1$ à $8$, on trace des chemins qui n'avancent que vers la droite ou vers le haut ; la page écrit le mot de chaque chemin et inscrit en chaque nœud le nombre de chemins qui y mènent. Pour $n = 4$ et $p = 3$, on lit $35$ au coin d'arrivée.

      Ce que cela signifie : un chemin est un mot de $n + p$ lettres dont $n$ sont des pas vers la droite, et le choix des positions de ces $n$ lettres détermine le chemin. Il y a donc $\dbinom{n+p}{n} = \dfrac{(n+p)!}{n!\,p!}$ chemins. Le dernier pas d'un chemin qui arrive en un nœud vient de la gauche ou du dessous : le nombre inscrit en un nœud est la somme de ceux de ses deux voisins, ce qui est la relation de Pascal $\dbinom{i+j}{i} = \dbinom{i+j-1}{i-1} + \dbinom{i+j-1}{i}$.

      Le piège le plus courant est de multiplier au lieu d'additionner, ou de compter les nœuds au lieu des pas : pour $n = 4$ et $p = 3$, la réponse n'est ni $4 \times 3 = 12$ ni $5 \times 4 = 20$, mais $\dbinom{7}{4} = 35$.
    cours: [t-07, ma-21]
    noeuds: [pol-binome]
  - id: euler
    vignette: '<path d="M10 62H112M14 8V66"/><path class="e" d="M14 56C50 52 80 38 108 8"/><path class="a" d="M14 56L45 52.5L76 43L108 24"/><circle class="p" cx="14" cy="56" r="3"/><circle class="p" cx="45" cy="52.5" r="3"/><circle class="p" cx="76" cy="43" r="3"/><circle class="p" cx="108" cy="24" r="3"/>'
    titre: "La méthode d'Euler"
    onglet: "La méthode d'Euler"
    niveau: "Terminale, Maths Sup"
    niveaux: [terminale, sup]
    groupe: explorations
    domaine: analyse
    resume: |
      Résoudre $y' = ky$ en avançant tout droit pendant un petit pas, puis en recommençant : la ligne brisée se rapproche de l'exponentielle quand le pas diminue, et devient folle quand il est trop grand.
    texte: |
      On résout $y' = ky$, $y(0) = 1$ sur $[0\,;2]$ en découpant l'intervalle en $N$ pas de longueur $h = \dfrac2N$ : à chaque pas, l'ordonnée est multipliée par $1 + kh$. La page trace la ligne brisée obtenue et la solution exacte $x \mapsto \mathrm e^{kx}$, et compare leurs valeurs en $2$. Pour $k = 1$, on lit $6{,}1917$ avec $N = 10$, $6{,}7275$ avec $N = 20$ et $7{,}0400$ avec $N = 40$, pour une valeur exacte $\mathrm e^2 \approx 7{,}3891$.

      Ce que cela signifie : la méthode donne en $2$ la valeur $\left(1 + \dfrac{2k}{N}\right)^N$, qui tend vers $\mathrm e^{2k}$ quand $N$ tend vers l'infini. Les écarts $1{,}1973$, $0{,}6616$ et $0{,}3491$ sont à peu près divisés par $2$ quand le pas l'est : l'erreur est proportionnelle au pas, la méthode est d'ordre $1$.

      Le piège le plus courant est de croire le résultat fiable quel que soit le pas. Pour $k = -3$ et $h = 1$, le facteur $1 + kh$ vaut $-2$ et la méthode fournit $1$, $-2$, $4$, alors que la solution exacte vaut $\mathrm e^{-6} \approx 0{,}0025$ en $2$ : dès que $h > \dfrac{2}{|k|}$, le calcul est instable.
    cours: [t-08, ma-06]
    noeuds: [ed-cauchy-lipschitz]
  - id: complexes
    vignette: '<path d="M14 44H106M52 6V68"/><circle cx="52" cy="44" r="18"/><path class="f" d="M52 44H70L77 26Z"/><path class="f" d="M52 44L61 28.4L50 10Z"/><path class="a" d="M52 44L77 26M52 44L50 10"/><circle class="p" cx="77" cy="26" r="3.2"/><circle class="p" cx="61" cy="28.4" r="3.2"/><circle class="p" cx="50" cy="10" r="3.2"/>'
    titre: "Multiplier par un nombre complexe"
    onglet: "Multiplier par un complexe"
    niveau: "Maths expertes, Maths Sup"
    niveaux: [expertes, sup]
    groupe: explorations
    domaine: geometrie
    resume: |
      Multiplier par un nombre complexe, c'est tourner et agrandir : les arguments s'ajoutent, les modules se multiplient. Les puissances dessinent une spirale et, sur le cercle unité, les racines de l'unité forment un polygone régulier.
    texte: |
      On règle le module et l'argument de deux nombres complexes $z$ et $w$, ou l'on déplace leurs points, et la page place le point d'affixe $zw$, calculé par $(a + \mathrm i b)(c + \mathrm i d) = (ac - bd) + \mathrm i(ad + bc)$. Les triangles de sommets $0, 1, z$ et $0, w, zw$ ont toujours la même forme.

      Ce que cela signifie : $|zw| = |z| \times |w|$ et $\arg(zw) = \arg z + \arg w$ à un multiple de $2\pi$ près ; multiplier par $w$, c'est appliquer la rotation d'angle $\arg w$ suivie de l'agrandissement de rapport $|w|$. Les puissances de $z$ dessinent donc une spirale, qui s'éloigne si $|z| > 1$ et s'enroule vers $0$ si $|z| < 1$. Si $|z| = 1$ et si $\arg z = \dfrac{2\pi}{n}$, les puissances de $z$ sont les $n$ sommets d'un polygone régulier : les racines $n$-ièmes de l'unité, solutions de $z^n = 1$.

      Le piège le plus courant est d'intervertir les deux règles : pour $z = w = \mathrm i$, le produit $\mathrm i^2 = -1$ a pour module $1 \times 1 = 1$, et non $2$, et pour argument $\dfrac\pi2 + \dfrac\pi2 = \pi$. L'autre oubli est que $z^n = 1$ a $n$ solutions dans $\mathbb C$.
    cours: [me-02, me-05, ma-04]
    noeuds: [gc-cyclotomiques]
  - id: dichotomie
    vignette: '<path d="M10 40H112M16 8V66"/><path class="e" d="M18 62C50 58 78 40 108 8"/><path class="f" d="M62 6H86V68H62Z"/><path class="a" d="M38 6V68M98 6V68"/><path class="t" d="M62 6V68M86 6V68"/><circle class="p" cx="72.1" cy="40" r="3.4"/>'
    titre: "Valeurs intermédiaires et dichotomie"
    onglet: "Dichotomie"
    niveau: "Terminale, Maths Sup"
    niveaux: [terminale, sup]
    groupe: explorations
    domaine: analyse
    resume: |
      Une fonction continue qui change de signe s'annule ; la dichotomie enferme la solution dans un intervalle deux fois plus court à chaque étape. Et quand la fonction n'est pas continue, la méthode se resserre sur un point qui n'est pas une solution.
    texte: |
      On cherche une solution de $f(x) = 0$ sur un intervalle $[a\,;b]$ aux bornes duquel $f$ change de signe : à chaque étape, on calcule le signe de $f$ au milieu et l'on garde la moitié où le changement de signe a lieu. La page propose $x^3 - 2x - 5 = 0$ sur $[2\,;3]$, $\cos x = x$ sur $[0\,;1]$, $x^2 = 2$ sur $[1\,;2]$, et une fonction piège ; elle trace la courbe, l'intervalle courant, et dresse la liste des intervalles successifs.

      Ce que cela signifie : après $n$ étapes, la solution est enfermée dans un intervalle de longueur $\dfrac{b - a}{2^n}$, soit une incertitude divisée par $1\,024$ en dix étapes. On trouve ainsi $2{,}0945515$ pour la première équation, $0{,}7390851$ pour la deuxième et $\sqrt2 \approx 1{,}4142136$ pour la troisième. Les deux suites de bornes sont adjacentes, et leur limite commune annule $f$ par continuité : la dichotomie démontre le théorème des valeurs intermédiaires.

      Le piège le plus courant est d'oublier l'hypothèse de continuité. La fonction $x \mapsto \dfrac{1}{x - 1{,}3}$ est négative en $1$ et positive en $2$ ; la dichotomie se resserre sans protester autour de $1{,}3$, où la fonction n'est pas définie, alors que l'équation n'a aucune solution. L'autre oubli : le théorème donne au moins une solution, et il faut la stricte monotonie pour affirmer qu'elle est unique.
    cours: [t-03, ma-08]
    noeuds: [c-tvi]
  - id: matrice
    vignette: '<path d="M10 52H112M40 6V68"/><path class="t" d="M40 52H64V28H40Z"/><path class="f" d="M40 52L88 40L100 16L52 28Z"/><path class="e" d="M40 52L88 40"/><path class="a" d="M40 52L52 28"/><circle class="p" cx="88" cy="40" r="3.2"/><circle class="p" cx="52" cy="28" r="3.2"/>'
    titre: "Une matrice déforme le plan"
    onglet: "Une matrice déforme le plan"
    niveau: "Maths expertes, Maths Sup"
    niveaux: [expertes, sup]
    groupe: explorations
    domaine: algebre
    resume: |
      Les deux colonnes d'une matrice de taille 2 disent où vont les vecteurs de base : le carré unité devient un parallélogramme, dont l'aire munie d'un signe est le déterminant. On voit le plan s'étirer, se retourner, s'écraser.
    texte: |
      La matrice $M = \begin{pmatrix} a & b \\ c & d \end{pmatrix}$ envoie le vecteur $(1\,;0)$ sur sa première colonne et le vecteur $(0\,;1)$ sur la seconde. On règle les quatre coefficients, ou l'on déplace les extrémités des deux colonnes ; la page dessine l'image du carré unité et d'une lettre F, calcule le déterminant $ad - bc$ et, sur demande, trace les directions propres.

      Ce que cela signifie : la valeur absolue du déterminant est le facteur par lequel $M$ multiplie les aires, et son signe dit si la figure est retournée. Pour $a = 1{,}5$, $b = c = 0{,}5$, $d = 1$, le déterminant vaut $1{,}25$ et les valeurs propres, racines de $\lambda^2 - 2{,}5\lambda + 1{,}25$, valent environ $0{,}691$ et $1{,}809$. Quand le déterminant est nul, les colonnes sont colinéaires, le plan est écrasé sur une droite et la matrice n'est pas inversible. Le quart de tour n'a aucune direction propre réelle, le cisaillement n'en a qu'une.

      Le piège le plus courant est de prendre le déterminant pour une aire sans signe et de lui prêter une linéarité qu'il n'a pas : la matrice identité et son opposée ont pour déterminant $1$, et leur somme, la matrice nulle, a pour déterminant $0$.
    cours: [me-03, me-06, ma-16, mp-02]
    noeuds: [v-det-matrice, v-valeurs-propres]
  - id: euclide
    vignette: '<rect class="e" x="12" y="14" width="96" height="44"/><rect class="f" x="12" y="14" width="44" height="44"/><rect class="f" x="56" y="14" width="44" height="44"/><path d="M56 14V58M100 14V58M100 22H108M100 30H108M100 38H108M100 46H108M100 54H108"/><rect class="p" x="100" y="54" width="4" height="4"/><rect class="p" x="104" y="54" width="4" height="4"/>'
    titre: "L'algorithme d'Euclide en rectangles"
    onglet: "Euclide en rectangles"
    niveau: "Maths expertes, Maths Sup"
    niveaux: [expertes, sup]
    groupe: explorations
    domaine: algebre
    resume: |
      Découper dans un rectangle de côtés entiers les plus grands carrés possibles, puis recommencer dans ce qui reste : le côté du dernier carré est le PGCD des deux côtés, et les nombres de carrés sont les quotients de l'algorithme d'Euclide.
    texte: |
      On choisit deux entiers $a$ et $b$ entre $1$ et $120$. Dans le rectangle de côtés $a$ et $b$, la page enlève autant de carrés que possible de côté égal au petit côté, puis recommence dans le rectangle restant ; elle écrit en regard les divisions euclidiennes successives. Pour $45$ et $12$ : $45 = 12 \times 3 + 9$, $12 = 9 \times 1 + 3$, $9 = 3 \times 3 + 0$, soit trois carrés de côté $12$, un de côté $9$ et trois de côté $3$.

      Ce que cela signifie : si $a = bq + r$, les couples $(a\,;b)$ et $(b\,;r)$ ont les mêmes diviseurs communs, donc le même PGCD ; les restes décroissent strictement, l'un d'eux est nul, et le PGCD est le dernier reste non nul, ici $3$. Le dernier carré est le plus grand carré qui pave tout le rectangle. Avec $89$ et $55$, deux termes consécutifs de la suite de Fibonacci, chaque étape sauf la dernière n'enlève qu'un carré et il faut neuf divisions ; avec $120$ et $7$, deux suffisent. Les quotients successifs forment la fraction continue de $\dfrac ab$.

      Le piège le plus courant est de s'arrêter un cran trop tard et de répondre $0$ : le PGCD est le dernier reste non nul, c'est-à-dire le diviseur de la division qui tombe juste.
    cours: [me-07, ma-12, mp-01]
    noeuds: [z-division, z-bezout]
  - id: suites
    vignette: '<path d="M10 62H112M14 8V66"/><path class="t" d="M14 46L104 22"/><g class="p"><circle cx="14" cy="46" r="2.6"/><circle cx="32" cy="41.2" r="2.6"/><circle cx="50" cy="36.4" r="2.6"/><circle cx="68" cy="31.6" r="2.6"/><circle cx="86" cy="26.8" r="2.6"/><circle cx="104" cy="22" r="2.6"/></g><path class="a" d="M14 60C50 58 82 46 104 10"/><g class="e"><circle cx="14" cy="60" r="1.6"/><circle cx="50" cy="53.6" r="1.6"/><circle cx="86" cy="32.5" r="1.6"/><circle cx="104" cy="10" r="1.6"/></g>'
    titre: "Suites arithmétiques et géométriques"
    onglet: "Suites arithmétiques et géométriques"
    niveau: "Première, Terminale"
    niveaux: [premiere, terminale]
    groupe: explorations
    domaine: analyse
    resume: |
      Ajouter toujours le même nombre, ou multiplier toujours par le même nombre : on fait courir les deux suites côte à côte, on calcule leurs sommes de deux façons, et l'on voit la suite géométrique rattraper l'autre, puis s'envoler.
    texte: |
      On règle le premier terme et la raison d'une suite arithmétique, $u_n = u_0 + nr$, et d'une suite géométrique, $v_n = v_0 q^n$, ainsi que le rang affiché. La page place les termes des deux suites sur une même figure, donne $u_n$, $v_n$ et les sommes $u_0 + \dots + u_n = \dfrac{(n+1)(u_0 + u_n)}{2}$ et $v_0 + \dots + v_n = v_0\,\dfrac{1 - q^{n+1}}{1 - q}$, calculées par la formule et vérifiées par addition.

      Ce que cela signifie : les points d'une suite arithmétique sont alignés, ceux d'une suite géométrique de raison $q > 1$ suivent une courbe exponentielle. Avec $u_n = 5 + 3n$ et $v_n = 0{,}5 \times 1{,}2^n$, la suite arithmétique domine longtemps ($u_{20} = 65$ contre $v_{20} \approx 19{,}17$), puis la suite géométrique la dépasse pour toujours à partir du rang $29$ et vaut déjà environ $734{,}9$ au rang $40$, contre $125$. Avec $-1 < q < 1$, $v_n$ tend vers $0$ et la somme tend vers $\dfrac{v_0}{1 - q}$ : $1 + \dfrac12 + \dfrac14 + \dots$ s'approche de $2$.

      Le piège le plus courant est de se tromper d'une unité sur le nombre de termes : de $u_0$ à $u_n$ il y en a $n + 1$, de sorte que $1 + 2 + 4 + \dots + 2^{10}$ compte onze termes et vaut $2^{11} - 1 = 2\,047$.
    cours: [p-02, t-01, ma-07]
    noeuds: [su-convergence]
  - id: nombre-e
    vignette: '<path d="M10 56H112M56 6V68"/><path class="t" d="M16.5 68L90.1 8"/><path class="a" d="M12 53C40 50 62 38 80 6"/><circle class="p" cx="56" cy="35.8" r="3.4"/>'
    titre: "Le nombre e"
    onglet: "Le nombre e"
    niveau: "Première, Terminale"
    niveaux: [premiere, terminale]
    groupe: explorations
    domaine: analyse
    resume: |
      Parmi les courbes $y = a^x$, une seule a une tangente de pente $1$ en $0$ : on cherche sa base à la main, puis on compare deux suites qui tendent vers ce nombre, l'une très lentement, l'autre à toute allure.
    texte: |
      On fait varier la base $a$ de la fonction $x \mapsto a^x$ et l'on regarde pivoter sa tangente au point $(0\,;1)$, dont la pente est $\ln a$ : elle vaut $1$ pour $a = \mathrm e \approx 2{,}718$. La page compare ensuite deux suites de limite $\mathrm e$ : $\left(1 + \dfrac1n\right)^n$, pour $n$ de $1$ à $10^6$, et $1 + \dfrac1{1!} + \dfrac1{2!} + \dots + \dfrac1{m!}$, pour $m$ de $0$ à $17$.

      Ce que cela signifie : la première suite converge lentement, son écart avec $\mathrm e$ étant voisin de $\dfrac{\mathrm e}{2n}$ : $2{,}5937$ pour $n = 10$, $2{,}7048$ pour $n = 100$, $2{,}7169$ pour $n = 1\,000$, et seulement cinq décimales exactes pour $n = 10^6$. La seconde atteint cette précision dès $m = 9$ et quinze décimales pour $m = 17$, parce que les factorielles croissent plus vite que toute suite géométrique.

      Le piège le plus courant est le raisonnement « $1 + \dfrac1n$ tend vers $1$, et $1$ à toute puissance vaut $1$, donc la limite est $1$ » : la base et l'exposant varient ensemble, la forme $1^\infty$ est indéterminée, et la limite est $\mathrm e$. Une machine commet la même erreur pour $n = 10^{16}$, où elle arrondit $1 + \dfrac1n$ à $1$.
    cours: [p-08, t-05, ma-20]
    noeuds: [ex-exponentielle, ex-serie]
  - id: rectangles
    vignette: '<path d="M10 60H112M16 8V66"/><g class="f"><rect x="24" y="48" width="16" height="12"/><rect x="40" y="40" width="16" height="20"/><rect x="56" y="29" width="16" height="31"/><rect x="72" y="17" width="16" height="43"/></g><path class="a" d="M24 48V60M40 40V60M56 29V60M72 17V60M88 17V60M24 48H40M40 40H56M56 29H72M72 17H88"/><path class="e" d="M18 52C44 44 70 28 100 4"/>'
    titre: "L'intégrale par les rectangles"
    onglet: "L'intégrale par les rectangles"
    niveau: "Terminale, Maths Sup"
    niveaux: [terminale, sup]
    groupe: explorations
    domaine: analyse
    resume: |
      On remplace l'aire sous une courbe par des rectangles de plus en plus étroits, pris à gauche, à droite ou au milieu, ou par des trapèzes. Toutes les sommes tendent vers l'intégrale, mais pas à la même vitesse : le tableau des erreurs le mesure.
    texte: |
      On découpe l'intervalle en $n$ parts égales, de $1$ à $200$, et l'on choisit la hauteur des rectangles : valeur à gauche, à droite, au milieu, ou trapèzes. Quatre fonctions sont proposées, dont l'intégrale est connue : $x^2$ sur $[0\,;1]$ ($\tfrac13$), $\dfrac1x$ sur $[1\,;2]$ ($\ln 2$), $\sin x$ sur $[0\,;\pi]$ ($2$) et $\sqrt x$ sur $[0\,;1]$ ($\tfrac23$). La page dessine les rectangles, donne la somme, l'erreur, et un tableau des erreurs pour $n = 10$ à $160$.

      Ce que cela signifie : pour $x^2$ et $n = 10$, on trouve $0{,}285$ à gauche, $0{,}385$ à droite, $0{,}3325$ au milieu et $0{,}335$ par les trapèzes. Doubler $n$ divise l'erreur par $2$ environ pour les rectangles à gauche ou à droite, et par $4$ pour le point milieu et les trapèzes : l'erreur est de l'ordre de $\dfrac1n$ dans le premier cas, de $\dfrac1{n^2}$ dans le second. Pour $\sqrt x$, dont la dérivée n'est pas bornée près de $0$, le rapport du point milieu tombe à $2{,}8$ environ.

      Le piège le plus courant est de croire que les rectangles à gauche donnent toujours une valeur par défaut : c'est vrai pour une fonction croissante, c'est l'inverse pour $\dfrac1x$, et pour $\sin$ sur $[0\,;\pi]$ les sommes à gauche et à droite sont égales.
    cours: [t-06, ma-18]
    noeuds: [ri-sommes]
  - id: taylor
    vignette: '<path d="M10 38H112M60 6V68"/><path class="e" d="M12 38C24 14 36 14 48 38S72 62 84 38S108 14 110 30"/><path class="a" d="M36 4C40 30 50 50 60 38S74 20 82 68"/><circle class="p" cx="60" cy="38" r="3.2"/>'
    titre: "Les polynômes de Taylor"
    onglet: "Les polynômes de Taylor"
    niveau: "Maths Sup"
    niveaux: [sup]
    groupe: explorations
    domaine: analyse
    resume: |
      Près de $0$, une fonction régulière ressemble à un polynôme, d'autant mieux que le degré monte. Loin de $0$, monter en degré peut tout améliorer, ou tout gâcher ; et une fonction peut même échapper entièrement à ses polynômes de Taylor.
    texte: |
      On choisit une fonction parmi $\sin$, $\cos$, $\exp$, $\ln(1 + x)$, $\dfrac{1}{1 - x}$, $\sqrt{1 + x}$ et $x \mapsto \mathrm e^{-1/x^2}$ prolongée par $0$, puis l'ordre $n$, de $0$ à $15$. La page trace la fonction et son polynôme de Taylor d'ordre $n$ en $0$, écrit ce polynôme, et donne leur écart au point $x$ que l'on déplace.

      Ce que cela signifie : la formule de Taylor-Young affirme que l'écart est négligeable devant $x^n$ quand $x$ tend vers $0$, à $n$ fixé. C'est un énoncé local. Pour $\sin$, $\cos$ et $\exp$, l'écart en un point fixé tend aussi vers $0$ quand $n$ grandit ; pour $\ln(1 + x)$ et $\dfrac{1}{1 - x}$, seulement si $-1 < x < 1$ (et en $1$ pour le logarithme). La fonction $\mathrm e^{-1/x^2}$ a toutes ses dérivées nulles en $0$ : ses polynômes de Taylor sont tous nuls, sans qu'elle le soit.

      Le piège le plus courant est d'employer un développement limité loin de $0$ en croyant qu'un ordre plus élevé donne une meilleure valeur : pour $\ln(1 + x)$ en $x = 1{,}5$, la valeur exacte est $\ln 2{,}5 \approx 0{,}916$, l'ordre $2$ donne $0{,}375$ et l'ordre $10$ donne environ $-2{,}40$.
    cours: [ma-10]
    noeuds: [as-taylor-young, de-taylor, ex-plateau]
  - id: grands-nombres
    vignette: '<path d="M10 62H112M14 8V66"/><path class="f" d="M14 8C30 26 60 33 110 35V39C60 41 30 48 14 66Z"/><path class="t" d="M14 37H110"/><path class="a" d="M14 14L20 52L26 24L32 46L40 30L50 42L62 34L76 39L90 36L110 37.5"/>'
    titre: "La loi des grands nombres"
    onglet: "La loi des grands nombres"
    niveau: "Terminale, Maths Sup"
    niveaux: [terminale, sup]
    groupe: explorations
    domaine: probabilites
    resume: |
      On répète une épreuve de probabilité $p$ et l'on regarde la fréquence des succès entrer dans un entonnoir qui se resserre autour de $p$. Et l'on constate que l'écart du nombre de succès, lui, ne se resserre pas : le hasard dilue, il ne compense pas.
    texte: |
      On règle $p$ et l'on ajoute des épreuves indépendantes par paquets de $10$ à $10\,000$, jusqu'à $100\,000$. La page trace la fréquence $\dfrac{S_n}{n}$ des succès en fonction de $n$ (échelle logarithmique), la zone $p \pm \dfrac{2\sigma}{\sqrt n}$ avec $\sigma = \sqrt{p(1-p)}$, garde les séries précédentes en gris, et donne les deux écarts $\dfrac{S_n}{n} - p$ et $S_n - np$.

      Ce que cela signifie : $\dfrac{S_n}{n}$ a pour espérance $p$ et pour écart-type $\dfrac{\sigma}{\sqrt n}$ ; l'inégalité de Bienaymé-Tchebychev donne $P\left(\left|\dfrac{S_n}{n} - p\right| \geqslant \delta\right) \leqslant \dfrac{p(1-p)}{n\delta^2}$, qui tend vers $0$. Pour $p = 0{,}5$, elle garantit une fréquence à moins de $0{,}05$ de $p$ avec une probabilité d'au moins $95\ \%$ dès $n = 2\,000$, et à moins de $0{,}01$ dès $n = 50\,000$.

      Le piège le plus courant est de croire à une compensation : après cinq piles, face ne devient pas plus probable. L'écart $S_n - np$ est de l'ordre de $\sigma\sqrt n$, qui grandit ($50$ pour $n = 10\,000$ et $p = 0{,}5$) ; la fréquence converge parce que cet écart est divisé par $n$.
    cours: [t-10, ma-21]
    noeuds: [p-loi-faible, p-loi-forte]
  - id: anniversaires
    vignette: '<path d="M10 62H112M14 8V66"/><path class="t" d="M14 36H110"/><path d="M14 62C50 60 80 54 110 44"/><path class="a" d="M14 62C30 60 40 20 62 12S96 10 110 10"/><circle class="p" cx="37.9" cy="36" r="3.4"/>'
    titre: "Le paradoxe des anniversaires"
    onglet: "Le paradoxe des anniversaires"
    niveau: "Terminale, Maths Sup"
    niveaux: [terminale, sup]
    groupe: explorations
    domaine: denombrement
    resume: |
      Dans un groupe de $23$ personnes, il y a plus d'une chance sur deux que deux d'entre elles aient le même anniversaire. On le calcule en comptant les listes sans répétition, on le vérifie en tirant des groupes au hasard, et l'on voit pourquoi l'intuition se trompe.
    texte: |
      On choisit le nombre $n$ de personnes et le calendrier ($d = 365$ jours, $12$ mois ou $7$ jours). La page trace la probabilité $P(n) = 1 - \dfrac{d(d-1)\cdots(d-n+1)}{d^n}$ que deux personnes au moins aient le même anniversaire, et celle, $1 - \left(1 - \dfrac1d\right)^n$, que l'une d'elles ait le même anniversaire que vous ; elle tire des groupes au hasard et signale leurs coïncidences.

      Ce que cela signifie : avec $365$ jours, $P(22) \approx 0{,}4757$ et $P(23) \approx 0{,}5073$ ; $P(50) \approx 0{,}9704$, et $P(57) \approx 0{,}9901$. Un groupe de $23$ personnes contient $253$ paires, autant d'occasions de coïncidence. Dès que $n > d$, la probabilité vaut exactement $1$ : c'est le principe des tiroirs.

      Le piège le plus courant est de confondre les deux questions : pour $n = 23$, la probabilité que quelqu'un ait le même anniversaire que vous n'est que d'environ $0{,}061$, et il faut $253$ personnes pour qu'elle dépasse $\dfrac12$. L'autre erreur est d'additionner les probabilités des $253$ paires, ce qui donnerait $\dfrac{253}{365} \approx 0{,}69$.
    cours: [t-07, ma-21]
    noeuds: [n-fini]
  - id: accroissements
    vignette: '<path d="M10 58H112M16 8V66"/><path class="e" d="M18 56C46 56 52 12 106 20"/><path class="a" d="M22.8 55.5L101.3 19.4"/><path class="t" d="M41.3 36.8L95.8 11.7"/><circle class="p" cx="22.8" cy="55.5" r="3.2"/><circle class="p" cx="101.3" cy="19.4" r="3.2"/><circle class="p" cx="68.5" cy="24.2" r="2.8"/>'
    titre: "Les accroissements finis"
    onglet: "Les accroissements finis"
    niveau: "Maths Sup"
    niveaux: [sup]
    groupe: explorations
    domaine: analyse
    resume: |
      Entre deux points d'une courbe sans angle, il existe toujours un endroit où la tangente est parallèle à la corde. On déplace les deux points, la page trouve tous ces endroits, et montre ce qui se passe quand la fonction a un seul point anguleux.
    texte: |
      On choisit une fonction ($x^3 - 3x$, $x^2$, $\sin x$ ou $|x|$) et deux points $A$ et $B$ de sa courbe, d'abscisses $a < b$. La page trace la corde, calcule sa pente $\dfrac{f(b) - f(a)}{b - a}$, cherche tous les réels $c$ de $]a\,;b[$ où $f'(c)$ est égal à cette pente et y trace la tangente.

      Ce que cela signifie : l'égalité des accroissements finis affirme qu'un tel $c$ existe dès que $f$ est continue sur $[a\,;b]$ et dérivable sur $]a\,;b[$ ; elle ne dit ni où il est ni combien il y en a. Pour $x^3 - 3x$ sur $[-2\,;2]$, la pente est $1$ et il y a deux points, $c = \pm\dfrac{2}{\sqrt3} \approx \pm 1{,}155$. Pour $x^2$, il n'y en a qu'un et c'est toujours le milieu, ce qui est propre aux trinômes. Pour $|x|$ entre $-1$ et $2$, la pente vaut $\dfrac13$ et la dérivée ne prend que les valeurs $-1$ et $1$ : il n'y en a aucun, la fonction n'étant pas dérivable en $0$.

      Le piège le plus courant est de prendre $c$ pour le milieu de l'intervalle, ou de le croire unique ; l'autre est d'oublier l'hypothèse de dérivabilité en tout point intérieur.
    cours: [ma-09]
    noeuds: [de-rolle, de-taf, de-iaf]
  - id: convexite
    vignette: '<path d="M10 60H112M16 8V66"/><path class="e" d="M18 14C34 50 70 62 108 10"/><path class="a" d="M24.6 25.9L92.2 28.2"/><path class="t" d="M20.7 38.3L79.5 50.5"/><circle class="p" cx="24.6" cy="25.9" r="3.2"/><circle class="p" cx="92.2" cy="28.2" r="3.2"/><circle class="p" cx="50.1" cy="44.4" r="2.8"/>'
    titre: "Convexité : cordes et tangentes"
    onglet: "Convexité"
    niveau: "Terminale, Maths Sup"
    niveaux: [terminale, sup]
    groupe: explorations
    domaine: analyse
    resume: |
      Une fonction convexe passe sous ses cordes et au-dessus de ses tangentes. On déplace une corde et une tangente sur six courbes, on retrouve les inégalités $\mathrm e^x \geqslant 1 + x$ et $\ln x \leqslant x - 1$, et l'on distingue un vrai point d'inflexion d'un faux.
    texte: |
      On choisit une fonction ($\exp$, $x^2$, $\ln$, $x^3 - 3x$, $x^4$ ou $\sin$), deux points $A$ et $B$ qui portent une corde et un point $T$ où l'on trace la tangente. La page dit si la courbe est sous la corde ou au-dessus entre $A$ et $B$, de quel côté de la tangente elle se trouve, et donne $f''(t)$.

      Ce que cela signifie : $f$ est convexe quand sa courbe est sous toutes ses cordes ; si $f$ est deux fois dérivable, cela équivaut à $f'' \geqslant 0$, et la courbe est alors au-dessus de toutes ses tangentes. La tangente à l'exponentielle en $0$ donne $\mathrm e^x \geqslant 1 + x$ pour tout réel $x$ ; celle du logarithme, concave, en $1$ donne $\ln x \leqslant x - 1$ pour tout $x > 0$. En $0$, la courbe de $x^3 - 3x$ traverse sa tangente : c'est un point d'inflexion.

      Le piège le plus courant est de conclure à une inflexion dès que $f''$ s'annule : pour $x^4$, $f''(0) = 0$ sans changement de signe, et la fonction est convexe sur $\mathbb R$.
    cours: [t-03, ma-09]
    noeuds: [ex-convexite]
  - id: asymptotes
    vignette: '<path d="M10 52H112M40 6V68"/><path class="t" d="M10 28H112M58 6V68"/><path class="e" d="M12 31C36 33 50 40 54 66"/><path class="e" d="M62 6C66 18 82 24 110 26"/><circle class="p" cx="88" cy="23.1" r="3.2"/>'
    titre: "Asymptotes : les droites que la courbe rejoint"
    onglet: "Asymptotes"
    niveau: "Terminale, Maths Sup"
    niveaux: [terminale, sup]
    groupe: explorations
    domaine: analyse
    resume: |
      On règle les coefficients d'une fonction et l'on voit sa courbe rejoindre ses asymptotes : horizontales et verticales en Terminale, obliques en plus en Maths Sup. La page donne les limites, mesure l'écart à l'asymptote et montre les cas où il n'y en a pas.
    texte: |
      On choisit sa classe, puis une fonction parmi quatre, par exemple $x \mapsto \dfrac{ax + b}{x - c}$ ou $x \mapsto a + b\,\mathrm e^{-x}$ ; on règle ses coefficients et l'on déplace un point $M$ sur la courbe. Les asymptotes sont tracées en pointillés, la page donne les limites en $-\infty$, en $+\infty$ et près de la valeur interdite, et un tableau évalue la fonction en $10$, $100$, $1\,000$. En Maths Sup, une seconde figure traite les asymptotes obliques : pour $x \mapsto \dfrac{x^2 - x + 2}{x - 1}$, la division donne $x + \dfrac{2}{x - 1}$, et la droite $y = x$ est asymptote.

      Ce que cela signifie : une asymptote horizontale $y = \ell$ traduit $\lim f(x) = \ell$ en l'infini, une asymptote verticale $x = c$ une limite infinie en $c$, et la droite $y = ax + b$ est asymptote quand $f(x) - (ax + b)$ tend vers $0$. On trouve la pente comme limite de $\dfrac{f(x)}{x}$, puis l'ordonnée à l'origine comme limite de $f(x) - ax$ ; si la seconde limite n'existe pas, comme pour $x \mapsto ax + b\ln x$, la courbe n'a qu'une direction asymptotique.

      Le piège le plus courant est de croire qu'une courbe ne coupe jamais son asymptote : celle de $x \mapsto a + b\,\dfrac{\sin x}{x}$ coupe la droite $y = a$ en chaque multiple non nul de $\pi$. L'autre est de voir une asymptote verticale dès qu'un dénominateur s'annule : $\dfrac{\sin x}{x}$ tend vers $1$ en $0$.
    cours: [t-03, ma-05, ma-10]
    noeuds: [de-limite, as-etude-locale]
  - id: racines
    vignette: '<path d="M10 40H112M60 6V68"/><path class="e" d="M14 66C24 10 40 14 52 40S76 70 88 40S100 14 106 6"/><g class="p"><circle cx="20.4" cy="40" r="3.4"/><circle cx="52" cy="40" r="3.4"/><circle cx="88" cy="40" r="3.4"/></g>'
    titre: "Racines et coefficients"
    onglet: "Racines et coefficients"
    niveau: "Première, Maths Sup"
    niveaux: [premiere, sup]
    groupe: explorations
    domaine: algebre
    resume: |
      On déplace les racines d'un polynôme de degré $2$ ou $3$ et l'on voit ses coefficients se recalculer : la somme et le produit des racines s'y lisent directement. Dans l'autre sens, on retrouve deux nombres dont on connaît la somme et le produit.
    texte: |
      On place deux ou trois racines réelles sur l'axe, par pas de $0{,}05$. La page trace la courbe du polynôme unitaire qui a ces racines, l'écrit sous forme factorisée puis développée, et donne la somme des racines, la somme de leurs produits deux à deux et leur produit. Une seconde figure part d'une somme $S$ et d'un produit $P$ et cherche les deux nombres correspondants.

      Ce que cela signifie : en développant $(x - r_1)(x - r_2)(x - r_3) = x^3 + bx^2 + cx + d$, on obtient $r_1 + r_2 + r_3 = -b$, $r_1r_2 + r_1r_3 + r_2r_3 = c$ et $r_1r_2r_3 = -d$. Pour les racines $1$, $2$ et $3$, le polynôme est $x^3 - 6x^2 + 11x - 6$. Réciproquement, deux nombres de somme $S$ et de produit $P$ sont les racines de $x^2 - Sx + P$ et existent dans $\mathbb R$ si et seulement si $S^2 - 4P \geqslant 0$ : pour $S = 5$ et $P = 6$, ce sont $2$ et $3$ ; pour $S = 2$ et $P = 2$, il n'y en a pas.

      Le piège le plus courant est le signe : pour $x^2 + bx + c$, la somme des racines est $-b$. L'autre est d'oublier de diviser par le coefficient dominant : pour $2x^2 - 10x + 12$, la somme vaut $5$ et le produit $6$.
    cours: [p-01, ma-13]
    noeuds: [pol-racines]
  - id: derangements
    vignette: '<g class="e"><circle cx="24" cy="16" r="6"/><circle cx="48" cy="16" r="6"/><circle cx="72" cy="16" r="6"/><circle cx="96" cy="16" r="6"/></g><g class="f"><rect x="17" y="50" width="14" height="12" rx="2"/><rect x="41" y="50" width="14" height="12" rx="2"/><rect x="65" y="50" width="14" height="12" rx="2"/><rect x="89" y="50" width="14" height="12" rx="2"/></g><path class="a" d="M24 23L48 49M48 23L96 49M72 23L24 49M96 23L72 49"/>'
    titre: "Les chapeaux mélangés"
    onglet: "Les chapeaux mélangés"
    niveau: "Terminale, Maths Sup"
    niveaux: [terminale, sup]
    groupe: explorations
    domaine: denombrement
    resume: |
      Chacun reprend un chapeau au hasard : quelle est la probabilité que personne ne retrouve le sien ? On mélange, on compte les dérangements par une récurrence, et l'on voit la probabilité se fixer très vite près de $1/\mathrm e$.
    texte: |
      On choisit le nombre $n$ de personnes, de $2$ à $12$, on mélange les chapeaux ou l'on en échange deux, et la page signale les points fixes, c'est-à-dire les personnes qui ont retrouvé le leur. Elle donne le nombre $D_n$ de permutations sans point fixe (les dérangements), calculé par la récurrence $D_n = (n-1)(D_{n-1} + D_{n-2})$, démontrée dans la page, et la proportion $\dfrac{D_n}{n!}$.

      Ce que cela signifie : $D_n = n!\displaystyle\sum_{k=0}^{n} \dfrac{(-1)^k}{k!}$, de sorte que la probabilité que personne ne retrouve son chapeau tend vers $\dfrac1{\mathrm e} \approx 0{,}3679$, avec un écart inférieur à $\dfrac{1}{(n+1)!}$. On trouve $D_3 = 2$, $D_4 = 9$, $D_5 = 44$, $D_6 = 265$, et $\dfrac{D_6}{6!} \approx 0{,}3681$. Le nombre moyen de points fixes vaut exactement $1$ pour tout $n$.

      Le piège le plus courant est de traiter les personnes comme indépendantes et d'annoncer $\left(1 - \dfrac1n\right)^n$ : pour $n = 3$, cela donne $\dfrac{8}{27} \approx 0{,}296$ au lieu de $\dfrac26 \approx 0{,}333$. Les deux expressions ont la même limite, ce qui masque l'erreur.
    cours: [t-07, ma-17, ma-20, ma-21]
    noeuds: [v-permutations, ex-serie]
  - id: catalan
    vignette: '<path d="M8 56H112"/><path class="t" d="M8 62H112"/><path class="a" d="M12 56L24 40L36 24L48 40L60 24L72 8L84 24L96 40L108 56"/><g class="p"><circle cx="12" cy="56" r="2.8"/><circle cx="108" cy="56" r="2.8"/></g>'
    titre: "Les nombres de Catalan"
    onglet: "Les nombres de Catalan"
    niveau: "Terminale, Maths Sup"
    niveaux: [terminale, sup]
    groupe: explorations
    domaine: denombrement
    resume: |
      Des profils de montagne qui ne passent jamais sous le niveau de la mer, ou des parenthèses bien écrites : on les trace, on les compte, et une symétrie démontre la formule $C_n = \dfrac{1}{n+1}\dbinom{2n}{n}$.
    texte: |
      On trace pas à pas un chemin de $n$ montées et $n$ descentes, pour $n$ de $1$ à $8$ ; s'il ne passe jamais sous le niveau $0$, c'est un chemin de Dyck, et il se lit comme une écriture correcte de $n$ paires de parenthèses. La page montre tous les chemins de Dyck jusqu'à $n = 4$, compte les chemins quelconques et ceux qui passent sous $0$, et dessine la symétrie qui transforme un mauvais chemin en un chemin finissant au niveau $-2$.

      Ce que cela signifie : cette symétrie par rapport à la droite de niveau $-1$, appliquée à partir du premier contact, met en bijection les mauvais chemins et les chemins de $n - 1$ montées et $n + 1$ descentes. Il y a donc $\dbinom{2n}{n+1}$ mauvais chemins, et $C_n = \dbinom{2n}{n} - \dbinom{2n}{n+1} = \dfrac{1}{n+1}\dbinom{2n}{n}$ : $1$, $2$, $5$, $14$, $42$, $132$, $429$, $1\,430$ pour $n$ de $1$ à $8$. Le découpage au premier retour au niveau $0$ donne la récurrence $C_{n+1} = \displaystyle\sum_{k=0}^{n} C_k\,C_{n-k}$.

      Le piège le plus courant est de croire qu'il suffit d'autant de parenthèses ouvrantes que de fermantes : pour deux paires, il y a $6$ mots et seulement $2$ écritures correctes.
    cours: [t-07, ma-21]
    noeuds: [pol-binome, r-injections]
  - id: anagrammes
    vignette: '<g class="e"><rect x="12" y="10" width="20" height="22" rx="3"/><rect x="38" y="10" width="20" height="22" rx="3"/><rect x="64" y="10" width="20" height="22" rx="3"/><rect x="90" y="10" width="20" height="22" rx="3"/></g><g class="f"><rect x="12" y="42" width="20" height="22" rx="3"/><rect x="64" y="42" width="20" height="22" rx="3"/></g><g><rect x="38" y="42" width="20" height="22" rx="3"/><rect x="90" y="42" width="20" height="22" rx="3"/></g><path class="a" d="M22 32L48 42M48 32L22 42M74 32L100 42M100 32L74 42"/>'
    titre: "Les anagrammes"
    onglet: "Les anagrammes"
    niveau: "Terminale, Maths Sup"
    niveaux: [terminale, sup]
    groupe: explorations
    domaine: denombrement
    resume: |
      Combien de mots peut-on écrire avec les lettres d'ANANAS ? On numérote les lettres répétées, on compte $n!$ rangements, puis on regarde combien de rangements donnent le même mot : c'est le principe des bergers, et la formule $\dfrac{n!}{m_1!\cdots m_k!}$.
    texte: |
      On écrit un mot de douze lettres au plus. La page compte ses lettres, calcule le nombre de ses anagrammes et en dresse la liste quand elle est courte. Une seconde figure prend un mot de trois ou quatre lettres, numérote les lettres répétées et range les $n!$ rangements numérotés dans des cases, une par mot obtenu.

      Ce que cela signifie : chaque mot provient du même nombre de rangements numérotés, à savoir le produit des factorielles des nombres de répétitions. Un mot de $n$ lettres dont les lettres distinctes apparaissent $m_1, \dots, m_k$ fois a donc $\dfrac{n!}{m_1!\cdots m_k!}$ anagrammes : $120$ pour MATHS, $\dfrac{6!}{3!\,2!} = 60$ pour ANANAS, $\dfrac{6!}{2!\,2!} = 180$ pour BANANE, $34\,650$ pour MISSISSIPPI. Avec deux lettres seulement, on retrouve les coefficients binomiaux : AABBB a $\dbinom52 = 10$ anagrammes.

      Le piège le plus courant est de diviser par le nombre de répétitions au lieu de sa factorielle : ELEVE a $\dfrac{5!}{3!} = 20$ anagrammes, et non $\dfrac{5!}{3} = 40$.
    cours: [t-07, ma-21]
    noeuds: [v-permutations, pol-binome]
  - id: espace
    vignette: '<path class="f" d="M18 50L62 62L104 36L60 24Z"/><path class="e" d="M18 50L62 62L104 36L60 24Z"/><path class="a" d="M36 8L60 43"/><path class="t" d="M60 43L74 64"/><path d="M60 43V20"/><circle class="p" cx="60" cy="43" r="3.4"/><circle class="p" cx="36" cy="8" r="2.6"/>'
    titre: "Droites et plans de l'espace"
    onglet: "Droites et plans de l'espace"
    niveau: "Terminale"
    niveaux: [terminale]
    groupe: explorations
    domaine: geometrie
    resume: |
      Un plan se décrit par son vecteur normal, une droite par son vecteur directeur. On règle l'un et l'autre, on fait tourner la vue, et un produit scalaire dit si la droite coupe le plan, où, et à quelle distance du plan se trouve un point.
    texte: |
      On règle les coefficients du plan d'équation $ax + by + cz + d = 0$ et le vecteur directeur $\vec u$ d'une droite passant par un point $A$. La page dessine le plan, son vecteur normal $\vec n(a\,;b\,;c)$, la droite, leur point d'intersection $I$ et le projeté orthogonal $H$ de $A$ sur le plan, dans une vue que l'on fait tourner ; elle calcule $\vec n \cdot \vec u$ et la distance de $A$ au plan.

      Ce que cela signifie : un point $A + t\vec u$ de la droite est dans le plan quand $t\,(\vec n \cdot \vec u) = -(ax_A + by_A + cz_A + d)$. Si $\vec n \cdot \vec u \neq 0$, la droite coupe le plan en un point ; sinon elle lui est parallèle, ou y est contenue. Pour le plan $x + y + 2z - 4 = 0$, le point $A(1\,;2\,;3)$ et $\vec u(0\,;-0{,}5\,;-1)$, on trouve $\vec n \cdot \vec u = -2{,}5$, $I(1\,;1\,;1)$, et la distance de $A$ au plan vaut $\dfrac{5}{\sqrt6} \approx 2{,}041$.

      Le piège le plus courant est de confondre vecteur directeur et vecteur normal : la droite est parallèle au plan quand $\vec u$ est orthogonal à $\vec n$, et perpendiculaire au plan quand $\vec u$ est colinéaire à $\vec n$.
    cours: [t-04, ma-19]
    noeuds: [me-produit-scalaire, f-hilbert]
  - id: monty-hall
    vignette: '<g class="f"><rect x="14" y="14" width="24" height="46"/><rect x="82" y="14" width="24" height="46"/></g><path class="e" d="M14 60V14H38V60M82 60V14H106V60"/><path class="t" d="M48 60V14H72V60"/><path d="M8 60H112"/><circle class="p" cx="33" cy="38" r="1.8"/><circle class="p" cx="101" cy="38" r="1.8"/><path class="a" d="M26 10Q60 -2 94 10M90.1 5.4L94 10L88.1 11.1"/>'
    titre: "Le problème de Monty Hall"
    onglet: "Le problème de Monty Hall"
    niveau: "Première, Terminale, Maths Sup"
    niveaux: [premiere, terminale, sup]
    groupe: explorations
    domaine: probabilites
    resume: |
      Trois portes, une voiture, un animateur qui ouvre une porte et propose de changer d'avis. On joue, on regarde un mur de $300$ parties, puis on lit la réponse sur un carré dont les aires sont des probabilités : changer gagne deux fois sur trois, à condition que l'animateur sache où est la voiture.
    texte: |
      On joue d'abord, avec $3$ à $10$ portes, contre un animateur qui sait où est la voiture ou qui ouvre au hasard. La page joue ensuite $300$ parties d'un coup et colorie chacune selon la stratégie qui la gagne. Enfin un carré d'aire $1$ est découpé selon la place de la voiture et la porte ouverte, avec un curseur pour la préférence $p$ de l'animateur quand il a le choix entre deux chèvres.

      Ce que cela signifie : avec $n$ portes et un animateur qui sait, garder gagne avec probabilité $\dfrac1n$ et changer avec probabilité $\dfrac{n-1}{n}$, ce que la page démontre. Avec trois portes, sachant que la porte $3$ s'est ouverte, la formule de Bayes donne $\dfrac{p}{1+p}$ pour la porte gardée : $\dfrac13$ si l'animateur n'a pas de préférence, et jamais plus de $\dfrac12$. Si l'animateur ouvre au hasard et montre une chèvre, les deux stratégies se valent.

      Le piège le plus courant est de dire « il reste deux portes, donc une chance sur deux » : deux issues ne sont pas forcément équiprobables, et tout dépend de la façon dont la porte a été ouverte.
    cours: [p-05, t-02, ma-21]
    noeuds: [p-espace]
  - id: taquin
    vignette: '<g class="e"><rect x="31" y="7" width="18" height="18" rx="3"/><rect x="51" y="7" width="18" height="18" rx="3"/><rect x="71" y="7" width="18" height="18" rx="3"/><rect x="31" y="27" width="18" height="18" rx="3"/><rect x="71" y="27" width="18" height="18" rx="3"/><rect x="31" y="47" width="18" height="18" rx="3"/><rect x="51" y="47" width="18" height="18" rx="3"/><rect x="71" y="47" width="18" height="18" rx="3"/></g><rect class="t" x="51" y="27" width="18" height="18" rx="3"/><path class="a" d="M60 50V33M55.5 37.5L60 33L64.5 37.5"/>'
    titre: "Le taquin"
    onglet: "Le taquin"
    niveau: "Jeu · Maths Sup"
    niveaux: [sup]
    groupe: casse-tetes
    resume: |
      Des pièces numérotées à remettre en ordre en les faisant glisser, sur un plateau de 2 à 5 lignes et colonnes. Une position sur deux est sans solution : la signature d'une permutation l'explique.
    texte: |
      Le plateau a de $2$ à $5$ lignes et de $2$ à $5$ colonnes. On fait glisser vers la case vide une pièce voisine, à la souris, au doigt ou avec les flèches du clavier, pour retrouver la position rangée, case vide en bas à droite. Un bouton mélange par des coups permis, un autre échange les pièces $1$ et $2$. Jusqu'à neuf cases, la page indique le nombre minimal de coups restants et peut en jouer un.

      Ce que cela signifie : une position est une permutation des cases, la case vide comptant pour une pièce. Un coup est une transposition, qui change la signature en son opposée, et il change de $1$ la distance $d$ de la case vide au coin en bas à droite. Le produit de la signature par $(-1)^d$ est donc invariant ; il vaut $+1$ dans la position rangée. Échanger deux pièces le fait passer à $-1$ : la position obtenue ne peut pas être rangée. Réciproquement, dès qu'il y a au moins deux lignes et deux colonnes, toute position de produit $+1$ peut l'être : exactement la moitié des positions sont solubles, soit $181\,440$ sur $362\,880$ pour le jeu de $3$ sur $3$, ce que la page vérifie par un parcours complet ; le cas général est admis.

      Le piège le plus courant est de juger une position à l'œil : celle qui ne diffère de la position rangée que par deux pièces échangées paraît presque résolue, et elle n'a aucune solution.
    cours: [ma-17]
    noeuds: [v-permutations]
  - id: inversions
    vignette: '<g class="e"><rect x="33" y="9" width="16" height="16" rx="3"/><rect x="71" y="9" width="16" height="16" rx="3"/><rect x="33" y="47" width="16" height="16" rx="3"/><rect x="71" y="47" width="16" height="16" rx="3"/></g><g class="f" style="fill-opacity:.85"><rect x="52" y="9" width="16" height="16" rx="3"/><rect x="33" y="28" width="16" height="16" rx="3"/><rect x="52" y="28" width="16" height="16" rx="3"/><rect x="71" y="28" width="16" height="16" rx="3"/><rect x="52" y="47" width="16" height="16" rx="3"/></g>'
    titre: "Tout éteindre"
    onglet: "Tout éteindre"
    niveau: "Jeu · Maths Sup"
    niveaux: [sup]
    groupe: casse-tetes
    resume: |
      Appuyer sur une lampe l'inverse, ainsi que ses voisines ; il faut tout éteindre, sur un plateau de 2 à 7 lignes et colonnes. Le jeu est un système linéaire sur le corps à deux éléments, que le pivot de Gauss résout.
    texte: |
      Sur un plateau de $2$ à $7$ lignes et colonnes, appuyer sur une case inverse sa lampe et celles de ses voisines immédiates. On part d'une position mélangée, du plateau tout allumé ou de lampes tirées au hasard, et il faut tout éteindre ; un bouton ramène à la position de départ pour réessayer. La page dit si la position a une solution, combien d'appuis il faut au minimum, et peut montrer où appuyer.

      Ce que cela signifie : l'ordre des appuis ne compte pas et appuyer deux fois sur une case ne fait rien. En codant allumé par $1$ et éteint par $0$ et en calculant modulo $2$, éteindre la position $b$ revient à résoudre le système linéaire $Ax = b$ sur le corps $\mathbb F_2$, où $A$ est la matrice carrée de taille $N$ (le nombre de cases) qui décrit l'effet de chaque appui. Si le noyau de $A$ est de dimension $k$, le théorème du rang dit qu'une position sur $2^k$ est soluble, chacune ayant $2^k$ solutions. Pour le plateau de $3$ sur $3$, $k = 0$ ; pour celui de $5$ sur $5$, le rang vaut $23$ et $k = 2$ ; pour celui de $4$ sur $4$, $k = 4$.

      Le piège le plus courant est de chercher une stratégie ordonnée, alors qu'une solution n'est qu'un ensemble de cases, et de croire toute position soluble : sur le plateau de $5$ sur $5$, trois positions sur quatre ne le sont pas.
    cours: [ma-15, ma-16]
    noeuds: [v-rang, gs-corps-finis]
  - id: dames
    vignette: '<g class="f"><rect x="45" y="6" width="15" height="15"/><rect x="75" y="6" width="15" height="15"/><rect x="30" y="21" width="15" height="15"/><rect x="60" y="21" width="15" height="15"/><rect x="45" y="36" width="15" height="15"/><rect x="75" y="36" width="15" height="15"/><rect x="30" y="51" width="15" height="15"/><rect x="60" y="51" width="15" height="15"/></g><rect class="e" x="30" y="6" width="60" height="60"/><g class="p"><circle cx="52.5" cy="13.5" r="4.6"/><circle cx="82.5" cy="28.5" r="4.6"/><circle cx="37.5" cy="43.5" r="4.6"/><circle cx="67.5" cy="58.5" r="4.6"/></g>'
    titre: "Le problème des dames"
    onglet: "Le problème des dames"
    niveau: "Jeu · Terminale, Maths Sup"
    niveaux: [terminale, sup]
    groupe: casse-tetes
    resume: |
      Poser $n$ dames sur un échiquier de $n$ sur $n$, de 4 à 10, sans que deux d'entre elles se menacent. Une solution est une permutation soumise à deux conditions sur les diagonales ; on les compte toutes par retour arrière.
    texte: |
      Sur un échiquier de $n$ lignes et $n$ colonnes, avec $n$ de $4$ à $10$, on pose et l'on retire des dames ; deux dames se menacent si elles partagent une ligne, une colonne ou une diagonale. Il faut en poser $n$ sans aucune menace. La page encadre les dames qui se menacent, teinte les cases menacées, signale l'impasse quand il ne reste plus aucune case libre, et peut ajouter sur demande une dame qui ne ferme pas la porte.

      Ce que cela signifie : une solution a exactement une dame par ligne et par colonne, c'est donc une permutation $\sigma$ de $\{1, \dots, n\}$, et les conditions sur les diagonales s'écrivent : les nombres $i - \sigma(i)$ sont deux à deux distincts, ainsi que les nombres $i + \sigma(i)$. On ne connaît pas de formule pour le nombre de solutions ; la page les énumère par retour arrière et trouve $2$, $10$, $4$, $40$, $92$, $352$ et $724$ solutions pour $n$ de $4$ à $10$. Pour $n = 8$, les $92$ solutions, parmi $8! = 40\,320$ permutations, forment $12$ familles sous les huit symétries du carré.

      Le piège le plus courant est de croire qu'une position sans menace mène toujours à une solution : sur l'échiquier de $8$ sur $8$, une dame en ligne $1$, colonne $1$ et une autre en ligne $2$, colonne $3$ ne se menacent pas, mais aucune solution ne les contient toutes les deux.
    cours: [t-07, ma-17]
    noeuds: [v-permutations]
  - id: grenouilles
    vignette: '<path d="M8 50H112"/><g class="p"><circle cx="18" cy="40" r="6.5"/><circle cx="35" cy="40" r="6.5"/><circle cx="52" cy="40" r="6.5"/></g><rect class="t" x="62" y="33" width="14" height="14" rx="3"/><g class="e"><circle cx="86" cy="40" r="6"/><circle cx="103" cy="40" r="6"/></g><path class="a" d="M52 30C56 14 66 14 69 28M66 24L69 28L73 24"/>'
    titre: "Les grenouilles"
    onglet: "Les grenouilles"
    niveau: "Jeu · dès la Première"
    niveaux: [premiere, terminale]
    groupe: casse-tetes
    resume: |
      Deux rangées de grenouilles se font face, séparées par un nénuphar libre ; elles avancent ou sautent par-dessus une adversaire, sans jamais reculer. Il faut les échanger. Un double comptage montre que toute solution a exactement $nm + n + m$ coups.
    texte: |
      Sur une file de $n + m + 1$ nénuphars, $n$ grenouilles bleues à gauche et $m$ orange à droite, de $1$ à $6$ par couleur, doivent échanger leurs places. Une grenouille avance d'un nénuphar s'il est libre, ou saute par-dessus une seule grenouille de l'autre couleur ; elle ne recule jamais. La page signale l'impasse quand plus rien ne bouge, permet d'annuler, et peut jouer un bon coup sur demande.

      Ce que cela signifie : chaque bleue doit croiser chaque orange, et un croisement est un saut, donc toute solution compte exactement $nm$ sauts. La distance totale à parcourir est $n(m+1) + m(n+1) = 2nm + n + m$, dont les sauts couvrent $2nm$ : il reste $n + m$ pas. Toute solution a donc $nm + n + m$ coups, soit $15$ pour trois grenouilles de chaque couleur. Par parcours exhaustif, la page trouve pour ce cas $72$ positions accessibles, dont $13$ impasses, et exactement deux solutions, comme pour toutes les tailles où chaque couleur compte au moins deux grenouilles.

      Le piège le plus courant est de chercher une solution plus courte : il n'y en a pas, toutes ont la même longueur. La difficulté est de ne pas se bloquer.
    cours: [t-07]
    noeuds: [n-recurrence]
  - id: dominos
    vignette: '<g class="f"><rect x="45" y="6" width="15" height="15"/><rect x="75" y="6" width="15" height="15"/><rect x="30" y="21" width="15" height="15"/><rect x="60" y="21" width="15" height="15"/><rect x="45" y="36" width="15" height="15"/><rect x="75" y="36" width="15" height="15"/><rect x="30" y="51" width="15" height="15"/><rect x="60" y="51" width="15" height="15"/></g><rect class="e" x="30" y="6" width="60" height="60"/><path class="t" d="M30 6L45 21M45 6L30 21M75 51L90 66M90 51L75 66"/><g class="a" style="stroke-width:7"><path d="M52 13.5H67"/><path d="M37.5 28V44"/><path d="M67.5 43V59"/></g>'
    titre: "Dominos sur l'échiquier"
    onglet: "Dominos sur l'échiquier"
    niveau: "Jeu · dès la Première"
    niveaux: [premiere, terminale]
    groupe: casse-tetes
    resume: |
      Recouvrir de dominos un échiquier auquel on a retiré deux cases. Avec deux coins opposés en moins, c'est impossible, et il suffit de compter les couleurs pour le démontrer ; avec une case de chaque couleur en moins, c'est toujours possible.
    texte: |
      Sur un plateau de $2$ à $8$ lignes et colonnes, entier ou privé de deux cases, on pose des dominos qui couvrent chacun deux cases voisines. La page compte les cases libres de chaque couleur, signale l'impasse quand il ne reste plus deux cases voisines, et répond sur demande à la question « est-ce possible ? » en cherchant un couplage parfait.

      Ce que cela signifie : un domino couvre une case claire et une case foncée, donc un plateau pavé en a autant de chaque sorte ; la différence entre les deux compteurs est un invariant. L'échiquier de $8$ sur $8$ privé de deux coins opposés garde $30$ cases d'une couleur et $32$ de l'autre : aucun pavage n'existe. Si l'on retire une case de chaque couleur, le pavage existe toujours (théorème de Gomory, admis dans la page). L'échiquier entier admet $12\,988\,816 = 3\,604^2$ pavages, nombre que la page recalcule.

      Le piège le plus courant est de croire qu'on a presque réussi : après $30$ dominos, il reste deux cases de même couleur, et aucune habileté n'y changera rien. À l'inverse, un décompte équilibré est nécessaire, mais ne suffit pas en général.
    cours: [t-07]
    noeuds: [r-injections]
  - id: solitaire
    vignette: '<g class="p"><circle cx="50" cy="12" r="4.4"/><circle cx="60" cy="12" r="4.4"/><circle cx="70" cy="12" r="4.4"/><circle cx="50" cy="24" r="4.4"/><circle cx="60" cy="24" r="4.4"/><circle cx="70" cy="24" r="4.4"/><circle cx="26" cy="36" r="4.4"/><circle cx="38" cy="36" r="4.4"/><circle cx="50" cy="36" r="4.4"/><circle cx="70" cy="36" r="4.4"/><circle cx="82" cy="36" r="4.4"/><circle cx="94" cy="36" r="4.4"/><circle cx="50" cy="48" r="4.4"/><circle cx="60" cy="48" r="4.4"/><circle cx="70" cy="48" r="4.4"/><circle cx="50" cy="60" r="4.4"/><circle cx="60" cy="60" r="4.4"/><circle cx="70" cy="60" r="4.4"/></g><circle class="t" cx="60" cy="36" r="4.4"/>'
    titre: "Le solitaire"
    onglet: "Le solitaire"
    niveau: "Jeu · dès la Première"
    niveaux: [premiere, terminale]
    groupe: casse-tetes
    resume: |
      Un pion saute par-dessus son voisin, qui est retiré ; il faut n'en laisser qu'un. Trois couleurs et un argument de parité disent où le dernier pion peut finir, et pourquoi le plateau français ne peut pas être vidé en partant du centre.
    texte: |
      On joue sur le plateau anglais, à $33$ trous, ou sur le plateau français, à $37$ trous, avec le trou de départ de son choix. La page signale les blocages, permet d'annuler, colorie les trous de trois couleurs en diagonale et compte les pions sur chacune ; elle montre les arrivées permises pour le dernier pion et peut chercher un coup menant à la victoire.

      Ce que cela signifie : un saut retire un pion de deux couleurs et en ajoute un sur la troisième, donc les trois nombres de pions par couleur changent tous de parité à chaque coup. Avec un seul pion, ils valent $1$, $0$, $0$. Sur le plateau anglais, trou central vide, cela ne laisse que $5$ arrivées : le centre et les milieux des quatre bords, toutes atteintes. Sur le plateau français, trou central vide, les trois nombres valent $12$ au départ et gardent la même parité : finir avec un seul pion est impossible.

      Le piège le plus courant est de prendre des échecs répétés pour une preuve d'impossibilité, ou un invariant satisfait pour une preuve de possibilité : l'invariant ne donne qu'une condition nécessaire.
    cours: [t-07]
    noeuds: [n-recurrence]
  - id: sudoku
    vignette: '<rect class="e" x="27" y="3" width="66" height="66"/><path d="M49 3V69M71 3V69M27 25H93M27 47H93"/><g class="p"><circle cx="38" cy="14" r="3.2"/><circle cx="60" cy="36" r="3.2"/><circle cx="82" cy="58" r="3.2"/><circle cx="82" cy="14" r="3.2"/><circle cx="38" cy="58" r="3.2"/></g>'
    titre: "Sudoku"
    onglet: "Sudoku"
    niveau: "Jeu · pour tous, théorie jusqu'en Maths Sup"
    niveaux: [premiere, terminale, sup]
    groupe: casse-tetes
    resume: |
      Des grilles fabriquées à la demande, en cinq niveaux définis par les raisonnements qu'elles exigent, de $4 \times 4$ à $9 \times 9$ ; un indice discret, puis une déduction expliquée ; et des grilles construites autour de vos propres chiffres. Derrière le jeu : carrés latins, coloriage de graphe, et des nombres vertigineux.
    texte: |
      On remplit une grille de $4 \times 4$, $6 \times 6$ ou $9 \times 9$ de sorte que chaque ligne, chaque colonne et chaque bloc contienne une fois chaque chiffre. La page engendre des grilles à solution unique, en cinq niveaux, ou construit une grille autour de chiffres que l'on a posés soi-même. Elle ne signale que deux chiffres qui se gênent directement, jamais une grille devenue impossible. Trois aides : un indice qui montre où regarder, une déduction expliquée qui remplit une case, et la résolution complète.

      Ce que cela signifie : une grille remplie est un carré latin soumis à la condition des blocs, ou encore un coloriage en $n$ couleurs d'un graphe où chaque case de la grille $9 \times 9$ a $20$ voisines. Il y a $288$ grilles de $4 \times 4$, que la page compte, et $6\,670\,903\,752\,021\,072\,936\,960$ grilles de $9 \times 9$ (Felgenhauer et Jarvis, 2005), dont $5\,472\,730\,538$ essentiellement différentes (Russell et Jarvis, 2006). Une grille à solution unique montre au moins $n - 1$ chiffres différents, ce qui est démontré dans la page, et il faut au moins $17$ indices pour $9 \times 9$ (McGuire, Tugemann et Civario, 2012), ce qui est admis.

      Le piège le plus courant est de croire qu'une grille est d'autant plus facile qu'elle a plus d'indices : la difficulté tient aux raisonnements nécessaires, non au nombre d'indices.
    cours: [t-07, ma-17]
    noeuds: [v-permutations]
  - id: polyominos
    vignette: '<path class="f" d="M28 4H76V20H60V36H44V20H28Z"/><path class="p" d="M28 20H44V36H60V52H28Z"/><path class="f" d="M28 52H76V68H28Z"/><path class="p" d="M76 36H92V68H76Z"/><path class="e" d="M28 4H92V68H28ZM28 20H44V36H60V20H76V4M44 36H60V52H28M76 20V68M60 36H76M76 36H92"/>'
    titre: "Polyominos"
    onglet: "Polyominos"
    niveau: "Jeu · pour tous, théorie jusqu'en Maths Sup"
    niveaux: [premiere, terminale, sup]
    groupe: casse-tetes
    resume: |
      Des formes quadrillées à recouvrir exactement, du rectangle à la forme trouée, en faisant glisser des pièces. Le but : y parvenir avec le moins de pièces possible, parmi celles qui sont proposées. D'autres défis imposent un seul type de pièce, ou une liste comme les douze pentominos. Les coloriages et la récurrence disent quand un pavage est impossible, et quand il existe toujours.
    texte: |
      On recouvre une forme quadrillée (rectangle, rectangle troué, escalier, croix ou forme tirée au hasard) avec des polyominos que l'on fait glisser, tourner et retourner. Le défi d'ouverture, « type TFJM² de Marie », donne six pièces à volonté (monomino, domino, tromino droit, tromino en L, tétromino en T, pentomino en X) : il s'agit de recouvrir la forme avec le moins de pièces possible, et la page compare votre résultat au minimum, qu'elle a cherché ($7$ pièces pour un rectangle de $5 \times 5$, $10$ pour $6 \times 6$, $16$ pour $8 \times 8$). Trois autres familles de défis : un seul type de pièce, toutes les pièces de $3$, $4$ ou $5$ cases, ou une liste dont chaque pièce sert une fois. Chaque forme proposée a été pavée par la page avant d'être affichée.

      Ce que cela signifie : la page énumère les polyominos à rotation et retournement près et en trouve $1$, $1$, $2$, $5$, $12$, $35$ et $108$ pour $1$ à $7$ cases. Que l'aire soit un multiple de la taille des pièces est nécessaire, et loin de suffire : par un coloriage en damier, les cinq tétrominos ne pavent aucun rectangle, le tétromino en T couvrant trois cases d'une couleur et une de l'autre. À l'inverse, une récurrence montre qu'un carré de côté $2^n$ privé d'une case quelconque se pave par des trominos en L. Les douze pentominos pavent le rectangle de $6 \times 10$ de $2\,339$ façons et celui de $3 \times 20$ de $2$ façons seulement (résultats admis, obtenus par ordinateur).

      Le piège le plus courant est de conclure qu'une forme est pavable dès que son aire s'y prête : le carré de $6 \times 6$ a $36$ cases et ne peut pas être pavé par des tétrominos en T.
    cours: [t-07]
    noeuds: [n-recurrence, r-injections]
  - id: nim
    vignette: '<g class="p"><rect x="20" y="10" width="9" height="13" rx="2"/><rect x="33" y="10" width="9" height="13" rx="2"/><rect x="46" y="10" width="9" height="13" rx="2"/><rect x="20" y="30" width="9" height="13" rx="2"/><rect x="33" y="30" width="9" height="13" rx="2"/><rect x="46" y="30" width="9" height="13" rx="2"/><rect x="59" y="30" width="9" height="13" rx="2"/><rect x="20" y="50" width="9" height="13" rx="2"/><rect x="33" y="50" width="9" height="13" rx="2"/><rect x="46" y="50" width="9" height="13" rx="2"/></g><g class="t"><rect x="59" y="50" width="9" height="13" rx="2"/><rect x="72" y="50" width="9" height="13" rx="2"/></g><path class="a" d="M88 56H104M98 50L104 56L98 62"/>'
    titre: "Le jeu de Nim"
    onglet: "Le jeu de Nim"
    niveau: "Jeu à deux · pour tous, théorie de Maths Sup"
    niveaux: [premiere, terminale, sup]
    groupe: casse-tetes
    resume: |
      Des tas d'objets ; chacun en retire autant qu'il veut dans un seul tas, et qui prend le dernier gagne. On joue contre la page, ou à deux sur le même écran. Le jeu est résolu depuis 1901 par une addition en base $2$ sans retenue, et la démonstration est donnée en entier.
    texte: |
      De $2$ à $6$ tas d'objets ; à tour de rôle, chaque joueur retire autant d'objets qu'il veut d'un seul tas, et celui qui prend le dernier gagne. On affronte la page, qui joue parfaitement ou se trompe parfois, ou un ami sur le même écran, la page servant d'arbitre. Elle peut afficher les tas en base $2$ et leur somme de Nim, et indiquer un coup gagnant.

      Ce que cela signifie : la somme de Nim $a_1 \oplus \dots \oplus a_k$ est l'addition en base $2$ sans retenue. Le théorème de Bouton (1901), démontré dans la page, dit que le joueur au trait gagne si et seulement si cette somme n'est pas nulle, en la rendant nulle à chaque coup. Avec les tas $3$, $4$, $5$, la somme vaut $2$ et le seul coup gagnant ramène le tas de $3$ à $1$. Avec $1$, $3$, $5$, $7$, la somme est nulle : celui qui commence perd. La page a vérifié le théorème par recherche exhaustive sur $3\,072$ positions.

      Le piège le plus courant est de chercher une règle simple (prendre beaucoup, égaliser les tas, laisser un nombre pair) : seule l'égalisation est juste, et seulement pour deux tas.
    cours: [ma-14, t-07]
    noeuds: [n-recurrence, gs-corps-finis]
  - id: ponts
    vignette: '<path class="a" d="M52 36Q38 23 52 10M52 36Q66 23 52 10M52 36Q38 49 52 62M52 36Q66 49 52 62M52 36H92M52 10L92 36L52 62"/><g class="p"><circle cx="52" cy="36" r="5.4"/><circle cx="52" cy="10" r="4.6"/><circle cx="52" cy="62" r="4.6"/><circle cx="92" cy="36" r="4.6"/></g>'
    titre: "Les ponts de Königsberg"
    onglet: "Les ponts de Königsberg"
    niveau: "Jeu · pour tous, théorie de Maths Sup"
    niveaux: [premiere, terminale, sup]
    groupe: casse-tetes
    resume: |
      Tracer une figure d'un seul trait, sans repasser sur aucun. Pour les sept ponts de Königsberg, c'est impossible, et Euler l'a montré en comptant les traits qui aboutissent à chaque sommet. On joue sur des figures classiques, tirées au hasard, ou que l'on dessine soi-même.
    texte: |
      On parcourt tous les traits d'une figure, chacun une fois, sans lever le crayon : la figure de Königsberg (quatre quartiers, sept ponts), l'enveloppe, le pentagone étoilé, des figures tirées au hasard ou dessinées par le joueur. La page peut afficher les degrés des sommets, dire si le tracé est possible, et conseiller un trait.

      Ce que cela signifie : une figure connexe se trace d'un seul trait si et seulement si elle a zéro ou deux sommets de degré impair ; dans le second cas, il faut partir de l'un et l'on finit à l'autre. À Königsberg, les degrés sont $5$, $3$, $3$ et $3$ : quatre sommets impairs, la promenade est impossible. Les deux sens du théorème sont démontrés dans la page, ainsi que le lemme des poignées de main : la somme des degrés est le double du nombre de traits, donc le nombre de sommets impairs est pair.

      Le piège le plus courant est de partir de n'importe où : avec deux sommets impairs, comme dans l'enveloppe ouverte, il faut partir de l'un d'eux.
    cours: [t-07]
    noeuds: [n-recurrence, n-fini]
  - id: cavalier
    vignette: '<g class="f"><rect x="45" y="6" width="15" height="15"/><rect x="75" y="6" width="15" height="15"/><rect x="30" y="21" width="15" height="15"/><rect x="60" y="21" width="15" height="15"/><rect x="45" y="36" width="15" height="15"/><rect x="75" y="36" width="15" height="15"/><rect x="30" y="51" width="15" height="15"/><rect x="60" y="51" width="15" height="15"/></g><rect class="e" x="30" y="6" width="60" height="60"/><path class="a" d="M37.5 58.5L52.5 28.5L82.5 43.5L67.5 13.5L37.5 28.5"/><g class="p"><circle cx="37.5" cy="58.5" r="3.6"/><circle cx="52.5" cy="28.5" r="3"/><circle cx="82.5" cy="43.5" r="3"/><circle cx="67.5" cy="13.5" r="3"/><circle cx="37.5" cy="28.5" r="3"/></g>'
    titre: "La promenade du cavalier"
    onglet: "La promenade du cavalier"
    niveau: "Jeu · pour tous, théorie de Maths Sup"
    niveaux: [premiere, terminale, sup]
    groupe: casse-tetes
    resume: |
      Faire visiter au cavalier toutes les cases d'un échiquier, de $3 \times 3$ à $8 \times 8$, une seule fois chacune. Les couleurs disent d'où il faut partir et quand le retour au départ est impossible ; pour le reste, il faut chercher, et c'est ce qui distingue ce problème de celui des ponts.
    texte: |
      Sur un échiquier de $3$ à $8$ lignes et colonnes, on pose le cavalier puis on le fait sauter de case en case, sans repasser sur aucune. La page numérote les cases visitées, peut compter les sorties de chaque case accessible, conseiller un saut, et dire si un parcours complet existe.

      Ce que cela signifie : un saut change de couleur, donc sur un échiquier au nombre impair de cases, tout parcours part de la couleur la plus nombreuse et ne peut pas revenir à son point de départ, ce qui est démontré dans la page. Par recherche exhaustive, la page ne trouve aucun parcours pour $3 \times 3$, $3 \times 5$, $3 \times 6$ et $4 \times 4$, et en trouve un pour toutes les autres tailles proposées. Le théorème de Schwenk (1991), admis, décrit exactement les échiquiers qui admettent un parcours fermé.

      Le piège le plus courant est de croire le point de départ indifférent : sur $5 \times 5$, seules les $13$ cases de la couleur des coins conviennent.
    cours: [t-07]
    noeuds: [r-injections, n-recurrence]
  - id: coloriage
    vignette: '<g class="f"><path d="M14 8H52V34H14ZM72 34H106V64H72Z"/></g><g class="p"><path d="M52 8H106V34H52Z" opacity=".55"/><path d="M14 34H40V64H14Z" opacity=".55"/></g><path class="e" d="M14 8H106V64H14ZM14 34H106M52 8V34M40 34V64M72 34V64"/>'
    titre: "Le coloriage de cartes"
    onglet: "Le coloriage de cartes"
    niveau: "Jeu · pour tous, théorie de Maths expertes et de Maths Sup"
    niveaux: [premiere, terminale, expertes, sup]
    groupe: casse-tetes
    resume: |
      Colorier une carte sans que deux régions voisines aient la même couleur, avec le moins de couleurs possible. La page tire des cartes au hasard, signale les fautes directes et calcule le minimum. Deux couleurs suffisent pour des rectangles superposés ; quatre suffisent toujours, et c'est un théorème de 1976.
    texte: |
      On choisit une couleur, puis on clique sur les régions d'une carte tirée au hasard, de $8$ à $26$ régions. La page ne signale que les frontières séparant deux régions voisines de même couleur, donne un indice sur demande, et annonce à la fin le plus petit nombre de couleurs possible, qu'elle calcule exactement.

      Ce que cela signifie : une carte découpée par des rectangles superposés se colorie avec $2$ couleurs, selon la parité du nombre de rectangles qui contiennent chaque région ; la page le démontre. Une région entourée d'un anneau de $5$ autres exige $4$ couleurs. Le théorème des quatre couleurs (Appel et Haken, 1976), admis, dit que $4$ suffisent toujours ; la page démontre que $6$ suffisent, en admettant qu'une région a toujours au plus $5$ voisines.

      Le piège le plus courant est de croire que $4$ couleurs ne sont nécessaires que si $4$ régions se touchent deux à deux : la roue à cinq quartiers montre le contraire.
    cours: [me-06]
    noeuds: [n-recurrence]
  - id: transvasements
    vignette: '<g class="f"><rect x="26" y="38" width="22" height="22"/><rect x="70" y="26" width="26" height="34"/></g><path class="e" d="M26 24V60H48V24M70 10V60H96V10"/><path class="a" d="M50 22Q60 8 68 14M63 9L68 14L62 18"/><path d="M12 60H110"/>'
    titre: "Les transvasements"
    onglet: "Les transvasements"
    niveau: "Jeu · pour tous, théorie de Maths expertes"
    niveaux: [premiere, terminale, expertes, sup]
    groupe: casse-tetes
    resume: |
      Deux récipients sans graduation, de $3$ et $5$ litres : comment mesurer exactement $4$ litres ? On remplit, on vide, on transvase, en cherchant le chemin le plus court. Le théorème de Bézout dit quelles quantités sont accessibles, et la démonstration est donnée en entier.
    texte: |
      On règle les capacités $a$ et $b$ (de $2$ à $12$ litres) et la quantité à mesurer, puis on remplit, vide ou transvase. Chaque état est un point d'un quadrillage où le parcours se dessine. La page compte les opérations, donne le minimum à la fin, conseille un coup sur demande et dit si le but est accessible.

      Ce que cela signifie : les quantités accessibles sont exactement les multiples de $\operatorname{pgcd}(a, b)$ compris entre $0$ et $\max(a, b)$. La page le démontre, par un invariant dans un sens et par le théorème de Bézout dans l'autre. Avec $3$ et $5$ litres, on mesure $4$ litres en $6$ opérations au minimum ; avec $6$ et $9$ litres, on ne mesure jamais $4$ litres.

      Le piège le plus courant est de croire qu'avec de la patience toute quantité finit par être mesurable : les multiples du PGCD sont les seules.
    cours: [me-07, ma-12]
    noeuds: [z-bezout, n-recurrence]
  - id: carres-latins
    vignette: '<path d="M30 6H90V66H30ZM50 6V66M70 6V66M30 26H90M30 46H90"/><g class="p"><circle cx="40" cy="16" r="6"/><circle cx="60" cy="36" r="6"/><circle cx="80" cy="56" r="6"/></g><g class="f"><circle cx="60" cy="16" r="6"/><circle cx="80" cy="36" r="6"/><circle cx="40" cy="56" r="6"/></g><g class="a"><circle cx="80" cy="16" r="6"/><circle cx="40" cy="36" r="6"/><circle cx="60" cy="56" r="6"/></g>'
    titre: "Carrés latins et gréco-latins"
    onglet: "Carrés latins et gréco-latins"
    niveau: "Jeu · pour tous, théorie de Maths Sup"
    niveaux: [premiere, terminale, sup]
    groupe: casse-tetes
    resume: |
      Ranger en carré des officiers de plusieurs régiments et de plusieurs grades, de façon que chaque ligne et chaque colonne contienne une fois chaque régiment et une fois chaque grade : c'est le problème posé par Euler en 1782. Possible à l'ordre $3$, $4$, $5$, $7$ ; impossible à l'ordre $6$.
    texte: |
      On pose un à un les $n^2$ officiers, chacun portant une lettre latine et une lettre grecque, dans un carré d'ordre $n$ de $3$ à $7$ ; un jeu plus simple n'emploie que les lettres latines. La page peut poser une partie de la grille, signale les fautes directes et donne un indice sur demande.

      Ce que cela signifie : un carré latin d'ordre $n$ existe toujours (la table d'addition modulo $n$) ; deux carrés latins sont orthogonaux quand leur superposition donne $n^2$ couples distincts. La page démontre que les restes de $i + j$ et de $2i + j$ modulo $n$ donnent un carré gréco-latin pour tout $n$ impair, que l'ordre $2$ est impossible, et qu'il y a au plus $n - 1$ carrés deux à deux orthogonaux. L'impossibilité à l'ordre $6$ (Tarry) et l'existence pour tous les autres ordres (Bose, Shrikhande et Parker, 1960) sont admises.

      Le piège le plus courant est de croire que deux carrés latins se superposent toujours en un carré gréco-latin : la table d'addition modulo $n$ n'a aucun carré orthogonal quand $n$ est pair.
    cours: [ma-12, t-07]
    noeuds: [gs-corps-finis, z-bezout]
  - id: go
    vignette: '<path d="M30 6H90V66H30ZM45 6V66M60 6V66M75 6V66M30 21H90M30 36H90M30 51H90"/><g class="p"><circle cx="45" cy="21" r="6.5"/><circle cx="60" cy="36" r="6.5"/><circle cx="45" cy="51" r="6.5"/><circle cx="75" cy="21" r="6.5"/></g><g class="e"><circle cx="60" cy="21" r="6.5" fill="var(--surface)"/><circle cx="75" cy="36" r="6.5" fill="var(--surface)"/><circle cx="60" cy="51" r="6.5" fill="var(--surface)"/></g>'
    titre: "Le jeu de go"
    onglet: "Le jeu de go"
    niveau: "Jeu à deux · pour tous"
    niveaux: [premiere, terminale, expertes, sup]
    groupe: casse-tetes
    resume: |
      Le go sur $5$, $7$ ou $9$ lignes, contre la page ou à deux sur le même écran. La page applique les règles, compte les points et propose les pierres mortes. Des problèmes de vie et de mort, résolus par l'examen de toutes les suites, montrent pourquoi un groupe a besoin de deux yeux.
    texte: |
      On pose tour à tour une pierre sur une intersection ; une chaîne privée de sa dernière liberté est prise ; la partie s'arrête quand les deux joueurs passent, et l'on compte pierres et intersections entourées. La page joue par recherche de Monte-Carlo, sans prétendre à la perfection : le go n'est résolu que jusqu'à $5$ lignes. Dix problèmes de vie et de mort se jouent contre une défense parfaite, la page examinant toutes les suites.

      Ce que cela signifie : le plateau est un graphe, une chaîne est une composante connexe et ses libertés sont ses voisins vides. La page démontre qu'une partie compte au plus $2 \times 3^{n^2}$ coups quand aucune disposition ne se répète, et qu'une chaîne à deux yeux ne peut pas être prise. Sur $3^{n^2}$ dispositions, $57$ sont légales pour $n = 2$, $12\,675$ pour $n = 3$ et $24\,318\,165$ pour $n = 4$. Un espace intérieur de trois cases en ligne se tue ou se sauve au centre ; quatre cases en ligne vivent, quatre cases en carré meurent.

      Le piège le plus courant est de croire qu'un groupe vit parce qu'il entoure beaucoup d'intersections : c'est la forme de l'espace intérieur qui décide, non sa taille.
    cours: [me-06, t-10]
    noeuds: [n-fini]
  - id: hanoi
    vignette: '<path d="M25 14V60M60 14V60M95 14V60"/><path class="e" d="M8 60H42M43 60H77M78 60H112"/><g class="a" style="stroke-width:6"><path d="M11 54H39"/><path d="M15 46H35"/><path d="M19 38H31"/><path d="M52 54H68"/><path d="M91 54H99"/></g>'
    titre: "Les tours de Hanoï"
    onglet: "Les tours de Hanoï"
    niveau: "Jeu · Terminale, Maths Sup"
    niveaux: [terminale, sup]
    groupe: casse-tetes
    resume: |
      De 1 à 8 disques à transporter d'une tour à une autre, avec 3, 4 ou 5 tours. Avec trois tours, le minimum est $2^n - 1$ coups ; une tour de plus, et la question devient un problème de recherche.
    texte: |
      On transporte une pile de $n$ disques, de $1$ à $8$, de la première tour à la dernière, un disque à la fois et sans jamais poser un disque sur un plus petit ; le jeu se joue avec $3$, $4$ ou $5$ tours. La page compte les coups, indique le minimum depuis le départ et depuis la position courante, et peut jouer un coup ou montrer une solution.

      Ce que cela signifie : avec trois tours, le nombre minimal $T(n)$ de coups vérifie $T(n) = 2T(n-1) + 1$ et $T(1) = 1$, donc $T(n) = 2^n - 1$, soit $255$ coups pour huit disques. La majoration vient d'une stratégie (déplacer $n-1$ disques, puis le grand, puis les $n-1$ disques) ; la minoration vient de ce que, au premier et au dernier déplacement du grand disque, les $n-1$ autres sont empilés sur une seule tour. Avec quatre tours, les minimums sont $1, 3, 5, 9, 13, 17, 25, 33$ pour un à huit disques ; l'optimalité de la stratégie de Frame et Stewart n'a été démontrée qu'en 2014 par Thierry Bousch, et la question reste ouverte pour cinq tours et plus. Les nombres affichés viennent d'un parcours de toutes les positions, au plus $5^8 = 390\,625$.

      Le piège le plus courant est de confondre « j'ai une solution en $2^n - 1$ coups » avec « $2^n - 1$ est le minimum » : une stratégie ne donne qu'une majoration, et il faut un second raisonnement pour la minoration.
    cours: [t-01]
    noeuds: [n-recurrence]
  - id: compte-est-bon
    vignette: '<rect class="e" x="42" y="6" width="36" height="18" rx="2"/><path class="a" d="M52 15H68"/><g class="f"><rect x="8" y="48" width="14" height="16"/><rect x="26" y="48" width="14" height="16"/><rect x="44" y="48" width="14" height="16"/><rect x="62" y="48" width="14" height="16"/><rect x="80" y="48" width="14" height="16"/><rect x="98" y="48" width="14" height="16"/></g><path d="M22 36H42M32 29V43M77 30L91 42M77 42L91 30"/>'
    titre: "Le compte est bon"
    onglet: "Le compte est bon"
    niveau: "Calcul mental · pour tous"
    niveaux: [premiere, terminale, expertes, sup]
    groupe: calcul
    resume: |
      Six nombres, quatre opérations, un nombre à atteindre : un tirage nouveau chaque jour, le même pour tous, en trois niveaux. Le premier se résout en deux ou trois opérations, le deuxième en demande quatre, le troisième en demande cinq et n'a qu'une seule solution.
    texte: |
      On combine six nombres par des additions, des soustractions, des multiplications et des divisions pour atteindre un nombre compris entre $101$ et $999$. Chaque nombre et chaque résultat intermédiaire sert une fois au plus, et tous les résultats doivent être des entiers strictement positifs. La page propose un nombre du jour, d'autres tirages à volonté, un indice en deux temps et une solution parmi les plus courtes.

      Ce que cela signifie : chaque tirage a été classé en énumérant toutes les suites d'opérations permises. Au niveau $1$, le but s'atteint en $2$ ou $3$ opérations, de plusieurs façons ; au niveau $2$, il en faut $4$, et plusieurs chemins existent ; au niveau $3$, il en faut $5$ et la solution est unique, à l'ordre des calculs près. Pour chercher, on décompose le but plutôt que d'essayer au hasard : $855 = 9 \times 95$ et $95 = 9 \times 10 + 4 + 1$ donnent $855$ avec $1$, $4$, $9$, $9$ et $10$ en quatre opérations.

      Le piège le plus courant est de s'obstiner sur le premier produit trouvé : quand l'écart restant ne se fabrique pas avec les nombres disponibles, il faut repartir du but et de ses diviseurs.
    cours: [ma-12]
    noeuds: [z-division]
  - id: serie
    vignette: '<g class="f"><rect x="14" y="40" width="42" height="22" rx="4"/><rect x="64" y="40" width="42" height="22" rx="4"/></g><rect class="a" x="14" y="40" width="42" height="22" rx="4"/><path class="e" d="M30 14H90M30 26H74"/><circle cx="100" cy="18" r="9"/><path class="a" d="M100 12V18L104 21"/>'
    titre: "Dix calculs"
    onglet: "Dix calculs"
    niveau: "Seconde, Première, Terminale, Maths expertes, Maths Sup"
    niveaux: [seconde, premiere, terminale, expertes, sup]
    groupe: calcul
    resume: |
      Dix calculs de tête contre la montre, sur le programme de votre classe : fractions, racines carrées, équations et inéquations du premier degré en Seconde, carrés, développements et factorisations en Première, dérivées, primitives, limites et intégrales en Terminale, PGCD, congruences et nombres complexes avec l'option Maths expertes, dérivées et primitives des fonctions usuelles, développements limités, équivalents et déterminants en Maths Sup.
    texte: |
      On choisit sa classe et un thème, ou un mélange, puis on répond à dix calculs en choisissant chaque fois parmi quatre réponses. La page chronomètre, compte les réponses justes, puis reprend les dix calculs avec la réponse exacte en regard de celle que l'on a donnée. Les calculs sont fabriqués à chaque série : par exemple $17^2 = 289$, $\dfrac23 + \dfrac14 = \dfrac{11}{12}$, $\ln\left(e^{5}\right) = 5$, $|3 + 4i| = 5$. Le calcul littéral a ses propres thèmes : développer $(2x - 3)^2 = 4x^2 - 12x + 9$, factoriser $x^2 - x - 6 = (x + 2)(x - 3)$, reconnaître la dérivée de $x\,e^{2x}$ ou une primitive de $\cos(3x)$, écrire le développement limité de $\sqrt{1 + 2x}$ ou un équivalent de $1 - \cos x$.

      Ce que cela signifie : dans un problème, le calcul doit se faire sans y penser, pour laisser l'attention au raisonnement. Les réponses fausses proposées sont celles que donnent les règles appliquées de travers, comme $\dfrac23 + \dfrac14 = \dfrac37$ ou $(2x - 3)^2 = 4x^2 + 9$ : se tromper désigne donc la règle à revoir, et le bilan donne alors le corrigé du calcul manqué.

      Le piège le plus courant est d'aller vite avant d'aller juste : la page classe d'abord par le nombre de réponses justes, et seulement ensuite par le temps.
    cours: [s-01, s-02, s-04, s-05, s-06, s-08, s-09, s-10, s-11, p-01, p-02, p-04, p-06, p-08, t-01, t-02, t-05, t-06, t-07, me-01, me-02, me-04, me-07, ma-03, ma-04, ma-10, ma-12, ma-17, ma-18]
    noeuds: [n-recurrence]
  - id: ordonner
    vignette: '<g class="f"><rect x="14" y="8" width="60" height="12" rx="2"/><rect x="14" y="30" width="60" height="12" rx="2"/><rect x="14" y="52" width="60" height="12" rx="2"/></g><path class="a" d="M92 14V58M86 20L92 14L98 20M86 52L92 58L98 52"/><path class="e" d="M20 14H50M20 36H62M20 58H42"/>'
    titre: "Démonstrations à remettre en ordre"
    onglet: "Démonstrations à ordonner"
    niveau: "Seconde, Première, Terminale, Maths expertes, Maths Sup"
    niveaux: [seconde, premiere, terminale, expertes, sup]
    groupe: raisonner
    resume: |
      Les étapes d'une démonstration classique sont mélangées, et une ou deux phrases fausses s'y sont glissées. On reconstruit le raisonnement ; la page vérifie que chaque étape s'appuie sur ce qui la précède. Cent soixante-huit démonstrations, de la Seconde à Maths Sup, où elles sont classées par thème.
    texte: |
      On choisit un niveau, puis une démonstration parmi cent soixante-huit : quinze de Seconde (un tiers n'est pas décimal, variations des fonctions carré et inverse, colinéarité et déterminant), dix-neuf de Première (forme canonique, dérivée d'un produit, formule d'Al-Kashi), vingt-neuf de Terminale (inégalité de Bernoulli, croissances comparées, intégration par parties), vingt-sept de Maths expertes (petit théorème de Fermat, formule de Moivre, formule du binôme), niveau sous lequel apparaissent aussi le théorème de Bézout et le lemme de Gauss, rangés en Maths Sup, et soixante-dix-huit de Maths Sup, classées en fondements, algèbre, algèbre linéaire, analyse et probabilités, du théorème de Cantor à la formule de Taylor avec reste intégral. Les démonstrations que les programmes du lycée demandent de connaître y figurent presque toutes. On fait glisser les phrases dans l'ordre, en écartant zéro, un ou deux intrus selon la difficulté choisie, puis on demande la vérification.

      Ce que cela signifie : une démonstration n'est pas une liste de phrases vraies, c'est un ordre. La page connaît, pour chaque étape, celles dont elle dépend, et accepte tout ordre qui les respecte : dans une récurrence, l'initialisation peut précéder ou suivre l'hérédité. Quand une étape arrive trop tôt, elle dit ce qui lui manque, par exemple un entier $k$ qui n'a pas encore été introduit.

      Le piège le plus courant est de juger une étape sur sa seule vérité : « le carré d'un nombre pair est pair, donc $p$ est pair » part d'un fait exact et arrive à une conclusion exacte, mais le « donc » est faux, car c'est la réciproque qu'il fallait.
