  - id: erreur
    vignette: '<g class="f"><rect x="14" y="8" width="92" height="10" rx="2"/><rect x="14" y="24" width="92" height="10" rx="2"/><rect x="14" y="56" width="92" height="10" rx="2"/></g><rect class="a" x="14" y="40" width="92" height="10" rx="2"/><path class="e" d="M20 13H60M20 29H74M20 45H52M20 61H66"/>'
    titre: "Trouver l'erreur"
    onglet: "Trouver l'erreur"
    niveau: "Seconde, Première, Terminale, Maths expertes, Maths Sup"
    niveaux: [seconde, premiere, terminale, expertes, sup]
    groupe: raisonner
    resume: |
      Cent trente-huit raisonnements qui « prouvent » que $1 = 2$, que $2 > 3$ ou que tous les chevaux ont la même couleur. Toutes les lignes sont justes, sauf une : on la cherche, et la page explique pourquoi les autres tiennent.
    texte: |
      On lit un raisonnement en lignes numérotées, qui aboutit à une absurdité ou à un résultat faux, et l'on clique sur la ligne fautive. Si l'on se trompe, la page explique pourquoi la ligne désignée est correcte ; si l'on trouve, elle explique la faute et ce qu'il faut en retenir. Cent trente-huit raisonnements : seize de Seconde, vingt de Première, vingt-huit de Terminale, vingt-trois de Maths expertes et cinquante et un de Maths Sup, classés en fondements, algèbre, algèbre linéaire, analyse et probabilités.

      Ce que cela signifie : une conclusion absurde prouve qu'une étape est fausse, sans dire laquelle. Les fautes proposées sont celles que l'on commet soi-même : diviser par $a - b$ quand $a = b$, diviser une inégalité par $\ln\frac12 < 0$ sans en changer le sens, simplifier une congruence par un entier qui n'est pas premier avec le module, nommer la somme d'une série qui diverge, ou conduire une récurrence dont l'hérédité échoue au premier rang.

      Le piège le plus courant est de désigner la dernière ligne, parce que c'est elle qui est absurde : elle découle correctement de la précédente, et l'erreur est en amont, là où une règle a été appliquée hors de ses conditions.
    cours: [s-01, s-02, s-03, s-04, s-05, s-06, s-07, s-08, s-09, s-11, p-01, p-02, p-03, p-04, p-05, p-06, p-07, p-08, t-01, t-02, t-03, t-04, t-05, t-06, t-07, t-08, t-09, t-10, me-01, me-02, me-03, me-04, me-05, me-06, me-07, me-08, me-09, ma-01, ma-02, ma-03, ma-04, ma-05, ma-06, ma-07, ma-08, ma-09, ma-10, ma-11, ma-12, ma-13, ma-14, ma-15, ma-16, ma-17, ma-18, ma-19, ma-20, ma-21, ma-22]
    noeuds: [n-recurrence]
  - id: contre-exemple
    vignette: '<g class="f"><rect x="14" y="30" width="42" height="14" rx="3"/><rect x="14" y="50" width="42" height="14" rx="3"/><rect x="64" y="50" width="42" height="14" rx="3"/></g><rect class="a" x="64" y="30" width="42" height="14" rx="3"/><path class="e" d="M20 14H100"/><path class="a" d="M26 8L94 20"/>'
    titre: "Le contre-exemple"
    onglet: "Le contre-exemple"
    niveau: "Seconde, Première, Terminale, Maths expertes, Maths Sup"
    niveaux: [seconde, premiere, terminale, expertes, sup]
    groupe: raisonner
    resume: |
      Quatre-vingt-quinze énoncés faux, comme « toute suite bornée converge », et pour chacun quatre objets : un seul le réfute. Les autres ne vérifient pas l'hypothèse, ou vérifient aussi la conclusion, et la page dit pourquoi.
    texte: |
      Un énoncé faux est affiché, avec quatre objets ; on clique sur celui qui le réfute. Si l'on se trompe, la page explique pourquoi l'objet désigné ne réfute rien : soit il ne vérifie pas l'hypothèse, soit il vérifie aussi la conclusion. Quatre-vingt-quinze énoncés : quatorze de Seconde, seize de Première, seize de Terminale, quatorze de Maths expertes et trente-cinq de Maths Sup, classés en fondements, algèbre, algèbre linéaire, analyse et probabilités ; chaque chapitre du cours en a au moins un.

      Ce que cela signifie : un contre-exemple à « si $H$, alors $C$ » vérifie $H$ sans vérifier $C$, et un seul suffit, alors que mille exemples favorables ne démontrent rien. Le polynôme $n^2 + n + 41$ donne un nombre premier pour tous les entiers de $0$ à $39$, et $41^2$ pour $n = 40$.

      Le piège le plus courant est de proposer un objet qui ne vérifie pas l'hypothèse : pour réfuter « toute suite bornée converge », la suite de terme général $n$ ne sert à rien, puisqu'elle n'est pas bornée.
    cours: [s-01, s-03, s-04, s-05, s-06, s-07, s-09, s-10, s-11, p-01, p-02, p-03, p-04, p-05, p-06, p-07, p-08, t-01, t-02, t-03, t-04, t-05, t-06, t-07, t-08, t-09, t-10, me-01, me-02, me-03, me-04, me-05, me-06, me-07, me-08, me-09, ma-01, ma-02, ma-03, ma-04, ma-05, ma-06, ma-07, ma-08, ma-09, ma-10, ma-11, ma-12, ma-13, ma-14, ma-15, ma-16, ma-17, ma-18, ma-19, ma-20, ma-21, ma-22]
    noeuds: [l-connecteurs]
  - id: implication
    vignette: '<rect class="f" x="12" y="24" width="34" height="24" rx="4"/><rect class="a" x="12" y="24" width="34" height="24" rx="4"/><rect class="f" x="74" y="24" width="34" height="24" rx="4"/><rect class="a" x="74" y="24" width="34" height="24" rx="4"/><path class="e" d="M52 31H66M62 27L67 31L62 35"/><path class="t" d="M68 42H54M58 38L53 42L58 46"/>'
    titre: "Nécessaire ou suffisant ?"
    onglet: "Nécessaire ou suffisant ?"
    niveau: "Seconde, Première, Terminale, Maths expertes, Maths Sup"
    niveaux: [seconde, premiere, terminale, expertes, sup]
    groupe: raisonner
    resume: |
      Deux propriétés, A et B : l'une entraîne-t-elle l'autre, dans un sens, dans les deux, dans aucun ? Cent vingt-cinq questions pour ne plus confondre un théorème et sa réciproque, avec la raison ou le contre-exemple de chaque sens.
    texte: |
      Un cadre et deux propriétés sont affichés ; on choisit entre « A entraîne B seulement », « B entraîne A seulement », « les deux » et « aucune ». La page donne ensuite, pour chaque sens, la raison pour laquelle l'implication est vraie, ou un objet qui la met en défaut. Cent vingt-cinq questions : dix-huit de Seconde, vingt de Première, vingt-quatre de Terminale, dix-neuf de Maths expertes et quarante-quatre de Maths Sup, classées par thème ; chaque chapitre du cours en a au moins une.

      Ce que cela signifie : « si A, alors B » et sa réciproque « si B, alors A » sont deux énoncés indépendants. Une suite convergente est bornée, et $(-1)^n$ est bornée sans converger ; si $f$ a un extremum en $a$, alors $f'(a) = 0$, et $x \mapsto x^3$ a une dérivée nulle en $0$ sans extremum.

      Le piège le plus courant est de prendre la réciproque d'un théorème pour le théorème lui-même ; l'autre est d'oublier le cadre, comme la dimension finie pour « injectif équivaut à surjectif ».
    cours: [s-01, s-03, s-04, s-05, s-06, s-07, s-08, s-09, s-10, s-11, p-01, p-02, p-03, p-04, p-05, p-06, p-07, p-08, t-01, t-02, t-03, t-04, t-05, t-06, t-07, t-08, t-09, t-10, me-01, me-02, me-03, me-04, me-05, me-06, me-07, me-08, me-09, ma-01, ma-02, ma-03, ma-04, ma-05, ma-06, ma-07, ma-08, ma-09, ma-10, ma-11, ma-12, ma-13, ma-14, ma-15, ma-16, ma-17, ma-18, ma-19, ma-20, ma-21, ma-22]
