# Programmes officiels de mathématiques des concours et examens de la rubrique Annales (vue « Programme »,
# MEMO_atlas_annales.md §45). Le texte de chaque programme, découpé en sections, blocs et points, et les liens de
# chaque point vers les cours, les exercices et les thèmes d'annales sont dans rubriques/annales-programmes/<id>.yaml.
# « filieres » dit quels programmes la vue montre pour une famille et une filière de la grille (« * » : famille
# sans filières), dans l'ordre des onglets.
programmes:
  - id: mpsi
    court: MPSI
    court_filiere: {MPI: MP2I}
    annee: Première année
  - id: mp
    court: MP
    court_filiere: {MPI: MPI}
    annee: Seconde année
  - id: pcsi
    court: PCSI
    annee: Première année
  - id: pc
    court: PC
    annee: Seconde année
  - id: psi
    court: PSI
    annee: Seconde année
  - id: capes
    court: CAPES externe
    concours: capes
  - id: capes-bac3
    court: CAPES bac+3
    concours: capes-bac3
  - id: agreg-ext
    court: Agrégation externe
    concours: agreg-ext
  - id: agreg-int
    court: Agrégation interne
    concours: agreg-int
  - id: premiere2026
    court: Première
    annee: programme de 2026
  - id: premiere2019
    court: Première
    annee: programme de 2019
  - id: terminale
    court: Terminale
    annee: programme de 2019
filieres:
  ingenieurs:
    MP: [mpsi, mp]
    MPI: [mpsi, mp]
    PC: [pcsi, pc]
    PSI: [pcsi, psi]
  enseignement:
    "*": [capes, capes-bac3, agreg-ext, agreg-int]
  bac:
    Première: [premiere2026, premiere2019]
    Terminale: [premiere2019, terminale]
# Onglet ouvert par défaut (sinon le dernier de la liste) et phrase affichée sous les onglets, par famille et filière
# (décision de l'auteur du 26 nov. 2026 pour la Première : les sujets de 2026 portent sur le programme de 2019).
defaut:
  bac:
    Première: premiere2026
avis:
  bac:
    Première: "La spécialité de Première suit le programme de 2026 depuis la rentrée 2026. Les sujets de l'épreuve anticipée de 2026 (et les sujets zéro) portent encore sur le programme de 2019, qu'on trouve dans le second onglet."
