# Programmes officiels de mathématiques des concours et examens de la rubrique Annales (vue « Programme »,
# MEMO_atlas_annales.md §45). Le texte de chaque programme, découpé en sections, blocs et points, et les liens de
# chaque point vers les cours, les exercices et les thèmes d'annales sont dans rubriques/annales-programmes/<id>.yaml.
# « filieres » dit quels programmes la vue montre pour une famille et une filière de la grille (« * » : famille
# sans filières), dans l'ordre des onglets.
programmes:
  - id: mpsi
    court: MPSI
    annee: Première année
  - id: mp
    court: MP
    annee: Seconde année
filieres:
  ingenieurs:
    MP: [mpsi, mp]
