  nom: Matrices symétriques positives, loi conjointe binomiale, sous-espaces de matrices diagonalisables, listes en Python
  apercu: Le premier exercice caractérise les matrices symétriques positives (forme quadratique, spectre, racine carrée) et montre qu'une telle matrice à coefficients hors diagonaux strictement négatifs
    est de rang au moins $n - 1$. Le deuxième étudie un couple $(X, Y)$ de loi $P(X = i, Y = j) = \alpha \binom{n}{i-1} \binom{n}{j-1}$, ses lois marginales binomiales décalées et la formule de Vandermonde.
    Le troisième cherche la dimension maximale d'un sous-espace de $\mathcal{M}_n(\mathbb{R})$ formé de matrices diagonalisables ($n(n+1)/2$, atteinte par les matrices symétriques) et construit une base
    de matrices diagonalisables ; le quatrième, d'informatique, programme le comptage d'occurrences et la suite de Robinson.
