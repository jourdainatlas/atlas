- sujet: https://www.vmaths.fr/wp-content/uploads/XENS/MP/X_ENS_2018_MP_MD_enonce.pdf
  nom: Approximation uniforme par des polynômes à coefficients entiers
  apercu: Le sujet établit l'existence et l'unicité de la meilleure approximation uniforme par des polynômes de degré au plus $n$, définit la capacité d'un compact (via les polynômes unitaires de norme
    minimale et un lemme de type Fekete) et la calcule pour un segment grâce aux polynômes de Tchebychev. Il en déduit que si $b - a \geqslant 4$, seules les fonctions polynomiales à coefficients entiers
    sont limites uniformes de tels polynômes, et que si $b - a < 4$ ce sont exactement les fonctions qui coïncident avec un polynôme à coefficients entiers sur un ensemble fini $J(I)$. Après les polynômes
    symétriques et les entiers algébriques, il montre par un argument de géométrie des nombres que $J(I)$ est le noyau de Fekete $F(I)$.
  pages: 8
