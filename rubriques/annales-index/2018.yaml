  nom: Théorème de Komlós
  apercu: Le sujet démontre que la probabilité qu'une matrice aléatoire $n \times n$ à coefficients $\pm 1$ indépendants et équiprobables soit singulière tend vers $0$. Après des estimations sur le coefficient
    binomial central (via la formule de Stirling) et le cas $n = 2$, il majore la probabilité qu'une ligne tombe dans l'espace engendré par les précédentes (au plus $2^{j-n}$), démontre le lemme de Sperner
    sur les anti-chaînes et en déduit l'inégalité d'Erdős-Littlewood-Offord ; une notion d'ensemble $k$-universel permet de traiter les dernières lignes et de conclure au théorème de Komlós.
