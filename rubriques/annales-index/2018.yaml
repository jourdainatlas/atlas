  nom: Décomposition en valeurs singulières, approximation de rang faible et matrices de rang fixé
  apercu: 'Le sujet construit la décomposition en valeurs singulières $A = U\Sigma V^\top$ d''une matrice de rang $k$ à partir de la réduction de $AA^\top$, puis démontre le théorème d''Eckart-Young : la
    meilleure approximation de $A$ pour la norme de Frobenius par une matrice de rang $l$ s''obtient en tronquant la décomposition. Il étudie ensuite des projecteurs obliques définis par une matrice par
    blocs et leur continuité, et en déduit que l''espace tangent en $A$ à l''ensemble des matrices de rang $k$ est exactement l''espace $T_A$, dont il calcule la dimension et l''orthogonal.'
  pages: 6
