  nom: Résolution de l'équation $\ln(x) = ax$
  apercu: Le sujet discute le nombre de solutions de $\ln(x) = ax$ selon $a$, résout l'équation fonctionnelle continue $\varphi(x + y) = \varphi(x)\varphi(y)$, puis introduit les polynômes $P_n = X(X +
    n)^{n-1}/n!$, qui vérifient $P_n' = P_{n-1}(X + 1)$ et une formule de type binomial. À l'aide de la formule de Stirling et du produit de Cauchy, il montre que $F_a(x) = \sum P_n(x) a^n$ converge pour
    $|a| \leqslant 1/e$, que $F_a(x) = F_a(1)^x$ et que $F_a(1)$ est la plus petite solution de $\ln(x) = ax$ ; il en déduit un développement en série de la solution de $y^y = C$.
