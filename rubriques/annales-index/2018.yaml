  nom: Moments d'une variable aléatoire, d'une suite et d'une fonction
  apercu: La partie I définit la fonction génératrice des moments $M_X(t) = \sum m_n(X) t^n/n!$, montre qu'elle vaut $\mathbb{E}(e^{tX})$, qu'elle est multiplicative pour des variables indépendantes, et
    la calcule pour la loi de Poisson, pour une somme de $n$ variables de Bernoulli indépendantes de paramètre $\lambda/n$ (loi binomiale de paramètres $n$ et $\lambda/n$, avec passage à la limite) et pour
    une loi uniforme. La partie II construit une suite non nulle dont tous les moments $\sum n^p a_n$ sont nuls, à partir du développement en série entière de $\varphi(x) = \exp\left(-x/\sqrt{1-x}\right)$,
    des polynômes de Hilbert et d'une formule intégrale de Cauchy. La partie III construit une fonction de classe $\mathcal{C}^\infty$ non nulle sur $\mathbb{R}$ dont tous les moments sont nuls.
