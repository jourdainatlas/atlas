- sujet: https://www.ens.psl.eu/sites/default/files/2018_mpi_sujet_mathc.pdf
  nom: Chaînes de Markov réversibles et semi-groupe d'Ornstein-Uhlenbeck
  apercu: 'Deux parties indépendantes. La première étudie une chaîne de Markov $X_n = F(X_{n-1}, U_n)$ de matrice de transition $P$ réversible par rapport à une probabilité $\pi$ : invariance et unicité
    de $\pi$, irréductibilité, puis, sur un espace fini, symétrie de $P$ pour $\langle \cdot, \cdot \rangle_\pi$ et convergence géométrique de la loi de $X_n$ vers $\pi$. La seconde étudie le noyau de la
    chaleur $\gamma_t$ et le semi-groupe $P_t f = \gamma_t * f$, puis le semi-groupe d''Ornstein-Uhlenbeck $Q_t$, son générateur $Lf = f'''' - xf''$ et démontre l''inégalité de Poincaré gaussienne $\operatorname{Var}(f)
    \leqslant \int f''^2 \,\mathrm{d}\gamma_1$ ainsi que la décroissance $\operatorname{Var}(Q_t f) \leqslant e^{-2t} \operatorname{Var}(f)$.'
  pages: 6
