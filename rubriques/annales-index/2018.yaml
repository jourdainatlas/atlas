  nom: 'Racines carrées de matrices complexes : existence et calcul numérique'
  apercu: 'Le sujet étudie l''équation $X^2 = A$ dans $\mathcal{M}_n(\mathbb{C})$ : exemples (infinité de racines de $I_2$, cas nilpotent sans racine polynomiale en $A$, unicité de la racine symétrique
