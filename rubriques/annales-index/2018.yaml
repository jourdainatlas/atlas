  nom: Fonction zêta, série entière associée et loi zêta
  apercu: 'Le sujet étudie la fonction $\zeta$ sur $\left]1, +\infty\right[$ (continuité, encadrement par comparaison série-intégrale, limites et courbe), puis la fonction $f(x) = \sum \left(\frac{1}{n+x}
    - \frac{1}{n}\right)$ : domaine, équivalents, développement en série entière $\sum (-1)^k \zeta(k+1) x^k$ sur $\left]-1, 1\right[$ et représentations intégrales de $\zeta(k+1)$. Il introduit enfin la
    loi zêta sur $\mathbb{N}^*$, montre l''indépendance des événements de divisibilité par des nombres premiers distincts, en déduit le produit eulérien de $1/\zeta(x)$ et la probabilité $1/\zeta(2x)$ que
    deux variables zêta indépendantes soient premières entre elles, puis identifie la loi limite du pgcd de deux variables uniformes sur $[\![1, n]\!]$.'
