  nom: Moyenne arithmético-géométrique et intégrales elliptiques
  apercu: Le sujet définit la moyenne arithmético-géométrique $M(a, b)$ comme limite commune de deux suites adjacentes, puis démontre la formule de Gauss $M(a, b) = \pi/(2I(a, b))$ où $I(a, b)$ est l'intégrale
    de $1/\sqrt{(a^2+t^2)(b^2+t^2)}$ sur $\left]0, +\infty\right[$, par un changement de variable qui laisse $I$ invariante. Il en déduit des équivalents de $f(x) = M(1, x)$ en $0$ et en $+\infty$ et l'allure
    de sa courbe, une écriture de $I(1, x)$ comme produit infini, puis le lien avec l'intégrale elliptique $K$ et son développement en série entière via les intégrales de Wallis, permettant d'exprimer $M(3,
    5)$ par une série.
