  apercu: 'Le sujet établit la décomposition multiplicative d''une matrice inversible en produit commutant d''une matrice diagonalisable et d''une matrice unipotente, définit $f(S)$ pour $S$ diagonalisable
    par interpolation et démontre la surjectivité de $\exp : \mathcal{M}_n(\mathbb{C}) \to \mathrm{GL}_n(\mathbb{C})$ grâce aux polynômes tronqués $E_n$ et $L_n$ de l''exponentielle et du logarithme. Il
    étudie ensuite la fonction matricielle $z^A = \exp((\log z)A)$ sur $\mathbb{C}$ privé de $\mathbb{R}_-$, solution de $\delta X = AX$ pour la dérivation d''Euler $\delta = z \frac{\mathrm{d}}{\mathrm{d}z}$,
    et sa monodromie, représentation de $\mathbb{Z}$. Il décrit enfin le groupe des automorphismes différentiels de l''algèbre engendrée par les $z^{\alpha_i}$ et $\log$, isomorphe au produit du dual de
    $G$ par $\mathbb{C}$.'
