  nom: Estimations numériques d'intégrales
  apercu: Le sujet approche l'intégrale $\int_0^1 e^{-x^2}\,\mathrm{d}x$ d'abord par une série alternée issue d'une série entière, puis comme limite de $\int (1 - x^2/n)^n$ par convergence dominée. Il étudie
    ensuite le polynôme interpolateur de Lagrange, l'expression de l'erreur d'interpolation via le théorème de Rolle et le phénomène de Runge, construit les polynômes de Legendre par Gram-Schmidt et montre
    qu'ils ont $n$ racines simples dans $[-1, 1]$. Il en déduit les méthodes de quadrature de Newton-Cotes (trapèzes) et la quadrature de Gauss, exacte sur $\mathbb{R}_{2n+1}[X]$ et à poids strictement
    positifs ; des questions d'informatique en Python jalonnent le sujet.
