  nom: Constante d'Euler, matrices de Hadamard et nombre de valeurs distinctes d'un échantillon
  apercu: 'Trois exercices indépendants. Le premier définit la constante d''Euler $\gamma$ comme somme commune des séries $\sum u_n$ et $\sum v_n$, avec $u_n = 1/n + \ln(1 - 1/n)$ et $v_n = 1/n - \ln(1
    + 1/n)$, dont la différence est télescopique, montre que $h_n - \ln(n)$ décroît vers $\gamma$, puis établit par comparaison série-intégrale un lemme (si $w_n \to 0$ et $n^r(w_{n+1} - w_n) \to \ell >
    0$, alors $n^{r-1} w_n$ converge) qui donne le terme suivant $\alpha/n$ du développement asymptotique de la série harmonique. Le deuxième étudie les matrices de Hadamard (coefficients $\pm 1$, colonnes
    orthogonales) : valeur de $|\det M|$, normalisation de la première colonne et preuve que leur ordre $n > 2$ est multiple de 4, avec une fonction Python de test. Le troisième calcule l''espérance du
    nombre de valeurs distinctes prises par $n$ variables uniformes indépendantes sur $[\![1, \ell]\!]$, avec simulation Python, étude des limites et application aux dates d''anniversaire.'
  pages: 8
