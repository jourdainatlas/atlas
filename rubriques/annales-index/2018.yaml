    une solution explicite à variables séparées), puis développe une fonction harmonique sur un disque en série de termes $a_n r^{|n|} e^{int}$ grâce à l'équation d'Euler $r^2v'' + rv' - n^2v = 0$. Il en
    tire qu'une fonction harmonique bornée sur $\mathbb{R}^2$ est constante, et enfin une preuve du théorème de d'Alembert-Gauss.
