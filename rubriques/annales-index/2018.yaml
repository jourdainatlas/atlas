  nom: Transformation d'Ornstein-Uhlenbeck
  apercu: 'Le sujet définit, pour les fonctions continues à croissance lente, le semi-groupe d''Ornstein-Uhlenbeck $P_t f(x) = \int f\big(e^{-t}x + \sqrt{1-e^{-2t}}\, y\big)\, e^{-y^2/2}\, \mathrm{d}y/\sqrt{2\pi}$,
    en étudie la continuité en $t$, la limite gaussienne quand $t \to +\infty$ et la régularité en $x$ par dérivation sous l''intégrale. Il calcule le générateur infinitésimal $Lf = f'''' - x f''$, puis,
    par la méthode de Stein et la formule de Taylor avec reste intégral, montre que pour des variables indépendantes de même loi centrées réduites à moment d''ordre 3 fini, l''écart entre $\mathbb{E}(f(S))$
    et l''intégrale gaussienne de $f$ est en $O(1/\sqrt{n})$ : vitesse de convergence dans le théorème central limite.'
