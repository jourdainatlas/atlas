  nom: Aplatissement aléatoire d'un ensemble de points en grande dimension
  apercu: 'Le sujet démontre le théorème de Johnson-Lindenstrauss : $N$ points de $\mathbb{R}^d$ peuvent être envoyés linéairement dans $\mathbb{R}^k$ avec $k \geqslant c \ln(N)/\varepsilon^2$ en préservant
    les distances à un facteur $1 \pm \varepsilon$ près. Après des préliminaires (projection sur un convexe fermé, inégalité de Hölder pour l''espérance, espérance conditionnelle, variables à queue sous-gaussienne),
    il établit par récurrence sur la dimension l''inégalité de concentration de Talagrand pour un vecteur de variables de Rademacher, puis l''applique à la norme $\|Mu\|$ d''une matrice aléatoire de Rademacher
    via une médiane, et conclut par une borne de réunion.'
