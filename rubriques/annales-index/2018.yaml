  nom: Équation d'Euler, équation de Bessel et loi forte des grands nombres
  apercu: 'Deux problèmes indépendants. Le premier étudie l''équation $x^2 y'''' + a x y'' + b y = 0$ : solutions polynomiales via l''opérateur $P \mapsto XP''$ (diagonalisable sur $\mathbb{R}_n[X]$), résolution
    sur $\left]0, +\infty\right[$ par le changement de variable $x = e^t$, puis, pour l''équation de Bessel $x^2 y'''' + x y'' + x^2 y = 0$, construction de $J_0$ en série entière, inversion d''une série
    entière non nulle en $0$ et obtention d''une seconde solution de la forme $\eta(x) + J_0(x) \ln(x)$. Le second démontre, pour des variables i.i.d. centrées à valeurs dans $[-1, 1]$, la majoration $P(|S_n|
    \geqslant \varepsilon) \leqslant 2e^{-n\varepsilon^2/2}$ (inégalités de Markov et de type Hoeffding) puis la convergence presque sûre de $S_n$ vers $0$, cas particulier de la loi forte des grands nombres.'
  pages: 8
