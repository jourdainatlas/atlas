  nom: Suites adjacentes, écriture binaire et développement dyadique
  apercu: Le sujet traite des suites adjacentes, qu'il applique à l'approximation et à l'irrationalité de $e$ ainsi qu'au calcul de $\ln 2$ comme somme de la série harmonique alternée. Il établit l'existence
