  nom: Transformées de Laplace et de Fourier, espaces de Sobolev et compacité
  apercu: Le sujet établit l'holomorphie et l'injectivité de la transformée de Laplace et l'utilise pour résoudre $y'' + y = 2\cos t$, puis calcule des transformées de Fourier (indicatrice, gaussienne par
    un contour, $e^{-|x|}$) pour résoudre $y'' - y = f$ au sens fort et au sens faible. Il étudie ensuite la transformée de Fourier en dimension 2, montre que l'espace $H^\alpha$ défini par le poids $1
    + \|\xi\|^{2\alpha}$ est un espace de Hilbert et donne un critère de relative compacité dans $L^2$. Les deux dernières parties prouvent que les moyennes $\rho_n(x) = \int f_n(x, k)\, \varphi(k)\,\mathrm{d}k$
    forment une partie relativement compacte de $L^2$, d'abord en les bornant dans $H^{1/2}$, puis sous une hypothèse affaiblie.
