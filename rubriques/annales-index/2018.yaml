  nom: Distance à une partie et courbe médiatrice de deux fermés
  apercu: 'Le sujet étudie la fonction distance à une partie d''un espace métrique (caractérisation de l''adhérence, caractère 1-lipschitzien, distance atteinte sur un compact ou un fermé d''un espace euclidien,
    distance à un hyperplan) et l''applique dans $\mathcal{M}_n(\mathbb{R})$ muni de la norme subordonnée euclidienne : grâce à la décomposition polaire, il montre que $d(0, \mathrm{SL}_n(\mathbb{R})) =
    1$ et que la distance de $T$ inversible aux matrices singulières vaut $1/\|T^{-1}\|$. Une partie d''analyse étudie les points du graphe de $f(x) = 2x/(e^x + 1)$ à égale distance de l''axe des abscisses
    et calcule $\int_0^\infty f = \pi^2/6$. Enfin, il montre que la courbe médiatrice $\{d_A = d_B\}$ de deux fermés séparés par une droite est le graphe d''une fonction continue, localement lipschitzienne,
    et que pour deux compacts elle admet une asymptote, médiatrice d''un segment porté par la droite d''appui commune.'
