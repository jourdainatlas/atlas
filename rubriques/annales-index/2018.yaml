  nom: 'Polynômes de Legendre : éléments propres, orthogonalité, fonction génératrice et quadrature de Gauss'
  apercu: Le sujet définit les polynômes de Legendre par la formule de Rodrigues $L_n = \frac{1}{2^n n!} \left((X^2-1)^n\right)^{(n)}$ et montre, grâce au théorème de Rolle, qu'ils ont $n$ racines simples
    dans $\left]-1, 1\right[$. Il les identifie aux vecteurs propres de l'endomorphisme $\varphi(P) = \left((X^2-1)P'\right)'$, autoadjoint pour le produit scalaire $\int PQ$ sur $[-1, 1]$, en déduit leur
    orthogonalité et l'inégalité de Bessel, puis calcule leur fonction génératrice $1/\sqrt{t^2 - 2xt + 1}$ et leur expression intégrale de Laplace. Il termine par la méthode de quadrature de Gauss aux
    racines de $L_n$, exacte sur $\mathbb{R}_{2n-1}[X]$, avec une majoration de l'erreur par interpolation d'Hermite.
