  nom: 'Problème aux limites $-u'''' + cu = f$ : existence, discrétisation et convergence'
  apercu: Le sujet montre par une méthode de tir que le problème $-u'' + c(x)u = f$, $u(0) = u(1) = 0$ ($c \geqslant 0$) admet une unique solution, positive si $f$ l'est. Il étudie la matrice tridiagonale
    $A_n$ de discrétisation (valeurs propres, vecteurs propres, M-matrices et positivité de l'inverse), puis le schéma aux différences finies associé, dont il prouve la convergence en $O(1/n^2)$ à l'aide
    de la norme subordonnée à $\|\cdot\|_\infty$. Enfin, pour $f$ höldérienne et $c = 0$, il majore l'erreur d'approximation par les polynômes de Bernstein, via une interprétation probabiliste avec des
    variables de Bernoulli, et en déduit une approximation polynomiale de la solution.
  pages: 8
