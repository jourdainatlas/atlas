  nom: 'Matrices à coefficients $\pm 1$ : déséquilibre maximal par changements de signes'
  apercu: Pour $A \in \mathcal{M}_n(\{-1, 1\})$, le sujet étudie $M(A)$, maximum de ${}^t\!XAY$ sur $X, Y \in \{-1, 1\}^n$, et $M(n)$, minimum de $M(A)$. Après des cas particuliers ($n^2$ est atteint exactement
