  nom: Lemme de Fekete et théorème de Erdös-Szekeres
  apercu: 'Le sujet démontre le lemme de sous-additivité de Fekete après avoir étudié limites inférieure et supérieure d''une suite bornée, puis l''applique pour montrer que $P(Y_n \geqslant x)^{1/n}$ converge,
    où $Y_n$ est la moyenne empirique de variables i.i.d. Il prouve ensuite le théorème d''Erdös-Szekeres par un algorithme de rangement en piles, et l''utilise avec une majoration de $P(C_n \geqslant k)$
    par $\binom{n}{k}/k!$ pour encadrer l''espérance de la longueur $C_n$ de la plus longue sous-suite croissante d''une permutation aléatoire uniforme : $\sqrt{n}/2 \leqslant \mathrm{E}(C_n)$ et $\limsup
    \mathrm{E}(C_n)/\sqrt{n} \leqslant e$.'
  pages: 6
