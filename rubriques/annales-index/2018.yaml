  nom: Positivité d'un déterminant par blocs complexe et résultant de deux polynômes
  apercu: Le problème démontre que, pour $A$ et $B$ dans $\mathcal{M}_n(\mathbb{C})$, le déterminant de la matrice par blocs de première ligne $(A, B)$ et de seconde ligne $(-\overline{B}, \overline{A})$
    est un réel positif, en le ramenant à la positivité de $\det(I_n + C\overline{C})$. Ce résultat est d'abord établi lorsque le polynôme caractéristique de $C\overline{C}$ est scindé à racines simples,
    puis étendu par densité grâce au résultant et au discriminant ; on en déduit que les valeurs propres réelles strictement négatives d'un carré de matrice réelle sont de multiplicité paire. Le sujet donne
    enfin une autre construction du résultant et une preuve directe par une application semi-linéaire $\theta$ commutant aux matrices étudiées.
