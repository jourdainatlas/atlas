  nom: Probabilités conditionnelles, loi binomiale et somme de variables aléatoires, suite récurrente définie par une fonction logarithme, géométrie dans l'espace, vrai-faux d'analyse et de dénombrement
  apercu: Le premier exercice étudie l'orientation des élèves vers les études d'ingénieur par un arbre pondéré et la formule de Bayes, puis par une loi binomiale (plus petit nombre de lycéennes à interroger
    pour que la probabilité qu'au moins l'une d'elles envisage de devenir ingénieure atteigne $0{,}99$, puis probabilité d'atteindre le quart sur 29 lycéennes), et enfin par la somme $S = X_1 + \dots +
    X_{10}$ de dix variables indépendantes, dont on calcule espérance et variance avant de discuter une affirmation sur $P(2000 < S < 2500)$. Le deuxième étudie $f(x) = \ln(8x^3 - 1)$ sur $[4, 10]$, localise
    l'unique solution $\alpha$ de $f(x) = x$, puis montre par récurrence que la suite définie par $u_0 = 5$ et $u_{n+1} = f(u_n)$ est croissante et comprise entre $4$ et $10$, et en déduit qu'elle converge,
    puis que sa limite est $\alpha$, avant d'interpréter une fonction Python de seuil. Le troisième, de géométrie dans l'espace, établit une équation cartésienne du plan $(ABC)$, la perpendicularité de
    deux plans, l'intersection d'une droite et d'un plan, puis le projeté orthogonal $H$ de $A$ sur une droite et l'aire du triangle $AHE$. Le quatrième est un vrai-faux sur la convexité de $x\mathrm{e}^{x^2}$,
    le nombre de répartitions de 24 rapaces en trois groupes de 8, l'équation différentielle $y' = -y + 1$, la limite de $\frac{\sin(n)}{n}$ et l'aire comprise entre une parabole et une droite.
