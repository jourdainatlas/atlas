  nom: Probabilités conditionnelles, loi binomiale, loi d'une variable aléatoire et inégalité de Bienaymé-Tchebychev, suite récurrente et équation différentielle, géométrie dans une pyramide, fonction logarithme
    et convexité
  apercu: 'Le premier exercice étudie les abonnements d''une plateforme musicale par un arbre pondéré et une probabilité conditionnelle inverse, puis par une loi binomiale avec recherche d''une taille d''échantillon,
    et enfin par la loi du montant mensuel $Y$, son espérance et sa variance, avant d''appliquer l''inégalité de Bienaymé-Tchebychev à une autre variable $Z$. Le deuxième compare deux modèles d''une population
    de poissons : la suite $u_{n+1} = 4 - \frac{4}{u_n}$, étudiée par récurrence et par un algorithme de seuil, puis la solution de $y'' + y = 2$ vérifiant $p(0) = 4$. Le troisième travaille dans une pyramide
    $SABCD$ : produit scalaire et angle $\widehat{BSC}$, puis distance du point $O$ au plan $(SBC)$, obtenue d''abord par un projeté orthogonal, puis par un calcul de volumes. Le quatrième étudie $f(x)
    = 5\ln(x^2 + 1) - 3x$ : limites, variations, convexité, tangente au point d''abscisse $1$ et inégalité qui s''en déduit.'
