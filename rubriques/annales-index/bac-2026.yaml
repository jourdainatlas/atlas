  nom: Probabilités conditionnelles, loi binomiale et Bienaymé-Tchebychev, suite récurrente et somme de termes, géométrie dans l'espace, fonction logarithme et intégration par parties
  apercu: Le premier exercice étudie la commercialisation de tomates issues de deux fournisseurs à l'aide d'un arbre pondéré et l'origine d'une tomate non commercialisable par une probabilité conditionnelle
    inverse, puis le nombre de tomates non commercialisables par une loi binomiale et la fréquence $F_n$ par l'inégalité de Bienaymé-Tchebychev. Le deuxième étudie la fonction $f(x) = \frac{2x}{\sqrt{1
    + x^2}}$, puis la suite $u_{n+1} = f(u_n)$ de premier terme $u_0 = 1$, dont la convergence est obtenue par récurrence et monotonie, puis retrouvée à l'aide de la suite géométrique $v_n = \frac{u_n^2}{3
    - u_n^2}$, avant d'encadrer la somme $S_n$ des carrés des termes. Le troisième, dans un repère de l'espace, détermine un plan perpendiculaire à une droite, un projeté orthogonal, le volume du tétraèdre
    $ABCD$ et la distance de $D$ au plan $(ABC)$. Le quatrième étudie $f(x) = x(\ln x)^2$ (limites, variations, équation $f(x) = 2$) et calcule par deux intégrations par parties une intégrale dont il cherche
    la limite quand $a$ tend vers 0.
  pages: 5
