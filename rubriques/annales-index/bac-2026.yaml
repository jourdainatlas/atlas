  apercu: 'Le premier exercice étudie la fonction $f(x) = \frac{x - 2}{2x - 3}$ puis la suite $u_{n+1} = f(u_n)$ de premier terme $u_0 = 0$ : encadrement par récurrence, convergence vers 1, interprétation
    d''une fonction seuil en Python, puis conjecture et démonstration d''une expression de $u_n$. Le deuxième étudie les lancers-francs d''un basketteur par une loi binomiale, puis, pour trois lancers,
    exprime $P(Y \geqslant 2) = -2p^3 + 3p^2$ et étudie cette fonction pour encadrer la probabilité de réussite $\alpha$ pour laquelle $P(Y \geqslant 2) = 0{,}9$. Le troisième détermine dans l''espace une
    équation du plan $(ABC)$, le projeté orthogonal de $D$ sur ce plan, le cosinus de l''angle $\widehat{BAC}$, l''aire du triangle $ABC$ et le volume du tétraèdre $ABCD$. Le quatrième est un vrai-faux
    portant sur la convexité d''une puissance de fonction affine, un nombre de tirages simultanés, une probabilité conditionnelle inverse calculée à partir d''un arbre et l''équation différentielle $y''
    + y = \mathrm{e}^{-x}\cos(x)$.'
