  nom: 'Chaîne de relais : probabilités conditionnelles, loi binomiale, Bienaymé-Tchebychev et suite arithmético-géométrique, tétraèdre dans l''espace, vrai-faux d''analyse, famille de fonctions logarithmes
    et valeur moyenne'
  apercu: 'Le premier exercice modélise la transmission d''un message à travers une chaîne de relais : arbre pondéré et probabilité conditionnelle $P_{A_2}(\overline{A_1})$, loi binomiale du nombre de tests
    positifs, inégalité de Bienaymé-Tchebychev pour la moyenne $M$ de 25 variables, puis étude par récurrence de la suite $p_{n+1} = 0{,}59p_n + 0{,}35$ et de sa limite. Le deuxième étudie un module d''escalade
    en forme de tétraèdre $ABCD$ : triangle isocèle, projeté orthogonal, volume, vecteur normal au plan $(BCD)$, intersection d''une droite et d''un plan, puis mesure de l''angle $\widehat{LDH}$. Le troisième
    est un vrai-faux d''analyse sur deux équations différentielles, la convexité de $x - \cos(x)$ et une asymptote horizontale. Le quatrième étudie la famille $f_k(x) = 1 - x + \frac{k(1 + \ln x)}{x}$ :
    lectures graphiques pour $k = 2$, étude de $f_1''$, existence d''un maximum de $f_1$ avec un programme Python d''approximation, puis se demande s''il existe une valeur de $k$ pour laquelle la valeur
    moyenne de $f_k$ sur $[1, \mathrm{e}]$ est nulle.'
