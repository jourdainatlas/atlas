  apercu: 'Le premier exercice traite le contrôle des réacteurs nucléaires par un arbre pondéré, les probabilités totales et une probabilité conditionnelle inverse, puis étudie la production journalière
    $X$ d''un réacteur (loi, espérance, variance) et la production totale $S$ de 12 réacteurs indépendants, dont on se demande, à l''aide de l''inégalité de Bienaymé-Tchebychev, si elle est strictement
    comprise entre 100 et 200 avec une probabilité supérieure à $0{,}80$. Le deuxième compare deux protocoles d''administration d''un médicament : une perfusion modélisée par l''équation différentielle
    $y'' = -\frac{3}{10}y + 1$, puis des injections horaires modélisées par la suite $u_{n+1} = 0{,}7u_n + 0{,}75$, étudiée par récurrence et à l''aide d''une suite géométrique. Le troisième est un vrai-faux
    de géométrie dans l''espace sur un vecteur normal, la position relative de deux droites, celle d''une droite et d''un plan, et un projeté orthogonal. Le quatrième étudie $f(x) = x\ln(2x - 1)$ par lecture
    graphique puis par le calcul (limite, point d''inflexion, aire par intégration par parties), et généralise à la famille $f_a(x) = x\ln(ax - 1)$ dont il montre que les points d''inflexion sont alignés.'
