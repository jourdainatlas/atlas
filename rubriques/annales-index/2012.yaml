  nom: Une transformation intégrale généralisant la transformée de Laplace
  apercu: Le sujet étudie la transformation $Lf(x) = \int_0^{+\infty} f(t)\, e^{-\lambda(t)x} \,\mathrm{d}t$, où $\lambda$ est continue, croissante et non majorée, en comparant l'ensemble des $x$ où l'intégrande
    est intégrable et celui où l'intégrale converge. Il en tire la valeur de l'intégrale de Gauss, un développement en série pour $f(t) = t/(e^t - 1) - 1 + t/2$, l'intégrale de Dirichlet, le comportement
    asymptotique de $Lf$ en $+\infty$ et en $0$, puis l'injectivité de la transformée de Laplace via le théorème de Weierstrass. La dernière partie applique la transformation à un endomorphisme autoadjoint
    de l'espace des polynômes dont les vecteurs propres sont les polynômes de Laguerre.
