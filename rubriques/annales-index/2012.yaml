  nom: Congruences modulo 11 ; éléments propres de l'endomorphisme $M \mapsto AM - MA$
  apercu: 'Un court exercice détermine l''ordre de 3 modulo 11 et en déduit que $3^{n+2012} - 9 \times 5^{2n}$ est divisible par 11. Le problème étudie l''endomorphisme $\varphi_A : M \mapsto AM - MA$ de
    $\mathcal{M}_n(\mathbb{R})$ : il montre que $\varphi_A$ est diagonalisable si et seulement si $A$ l''est (calcul direct pour $n = 2$, puis cas général via les matrices $P E_{ij} P^{-1}$ et un argument
    sur les valeurs propres complexes), minore la dimension de son noyau par le degré du polynôme minimal de $A$, calcule ce noyau quand $A$ est nilpotente d''indice $n$ ou diagonalisable, et prouve qu''un
    vecteur propre associé à une valeur propre non nulle est une matrice nilpotente.'
