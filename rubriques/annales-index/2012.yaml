- sujet: https://www.vmaths.fr/wp-content/uploads/E3A/MP/E3A_2012_MP_MathsB_enonce.pdf
  nom: Projecteurs orthogonaux, déterminants par blocs et une courbe plane
  apercu: Trois exercices indépendants. Le premier montre que le composé de deux projecteurs orthogonaux est diagonalisable à valeurs propres dans $[0, 1]$ et majore sa trace par le rang. Le second établit
    $\det(M) = \det(AD - CB)$ pour une matrice par blocs quand $A$ et $C$ commutent, caractérise le caractère défini positif d'une matrice par blocs symétrique et étudie une suite récurrente de matrices
    complexes. Le troisième construit une courbe plane à partir d'un cercle tangent à deux droites, calcule une aire et étudie son image par l'inversion $z \mapsto 1/\bar{z}$.
