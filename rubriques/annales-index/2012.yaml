  nom: Fonctions coercives et méthodes de descente de gradient
  apercu: Le sujet montre qu'une fonction coercive sur $\mathbb{R}^n$ atteint un minimum global, où le gradient s'annule si elle est $\mathcal{C}^1$. Il étudie la méthode du gradient à pas fixe pour une
    fonctionnelle quadratique $\frac{1}{2}(Ax, x) - (b, x)$ avec $A$ symétrique définie positive, donne pour $x^2$ des suites de descente qui ne convergent pas vers le minimum, puis définit les suites de
    descente générales. Sous une condition de décroissance suffisante (type Armijo) et un pas minoré, il prouve que le gradient tend vers $0$, et en dimension 1 pour $f$ strictement convexe que la suite
    converge vers l'unique minimum.
