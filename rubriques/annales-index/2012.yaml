  nom: Réduction de certaines matrices de coefficients binomiaux
  apercu: Le sujet étudie les polynômes réciproques de première et deuxième espèce, puis dénombre des familles d'entiers de somme fixée à l'aide de coefficients binomiaux et démontre, de façon indépendante,
    que $AB$ et $BA$ ont même polynôme caractéristique. Il montre ensuite que la matrice $S$ des coefficients binomiaux obtenus est symétrique définie positive, grâce à un produit scalaire intégral à poids
    exponentiel et aux polynômes de Laguerre, l'exprime à l'aide de la matrice de la translation $P(X)$ donne $P(X - 1)$, et montre que son polynôme caractéristique est réciproque.
