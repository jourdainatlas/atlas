  nom: Image numérique d'une matrice et inégalités sur les déterminants
  apercu: 'Le sujet étudie l''ensemble $R(A)$ des valeurs ${}^t\!XAX$ pour $X$ unitaire : il contient les valeurs propres réelles et la diagonale, il est un intervalle, et une matrice symétrique a une trace
    dans $R(A)$ si et seulement si elle est orthogonalement semblable à une matrice de diagonale $(\operatorname{Tr} A, 0, \ldots, 0)$. Pour les matrices symétriques $2 \times 2$, il classe les coniques
    ${}^t\!XAX = 1$, majore $\operatorname{Tr}(AB)$, établit une inégalité sur $\det(A + B)$ avec cas d''égalité et montre qu''une suite croissante majorée converge. Il prouve enfin, par réduction simultanée,
    que $\det(A + B)$ est au moins $\det A + \det B$ et la log-concavité du déterminant sur les matrices définies positives.'
  pages: 3
