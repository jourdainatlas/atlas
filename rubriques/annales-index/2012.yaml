  apercu: 'Le premier problème caractérise les inversibles de $\mathbb{Z}/n\mathbb{Z}$, étudie le groupe $(I_n, \times)$ avec ordres et cyclicité pour $n = 10$ et $12$, demande des algorithmes, et montre
