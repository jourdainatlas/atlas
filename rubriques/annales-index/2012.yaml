  nom: Représentations de dimension finie de l'algèbre de Lie de $\mathrm{SU}(2, \mathbb{C})$
  apercu: 'Le sujet étudie l''espace $L$ des matrices $2 \times 2$ antihermitiennes de trace nulle, réel de dimension 3 et stable par crochet, et l''exponentielle de matrices, dont il établit les propriétés
    (conjugaison, déterminant, $\exp(A + B)$ quand $A$ et $B$ commutent). Il décrit $\mathrm{SU}(2, \mathbb{C})$, montre que tout élément est conjugué dans $\mathrm{SU}(2, \mathbb{C})$ à une matrice $\operatorname{diag}(e^{i\theta},
    e^{-i\theta})$, que deux éléments sont conjugués si et seulement s''ils ont même trace, que $\exp$ envoie $L$ surjectivement sur $\mathrm{SU}(2, \mathbb{C})$, et que tout sous-groupe distingué contenant
    un élément autre que $\pm I_2$ est $\mathrm{SU}(2, \mathbb{C})$ entier. Il étudie enfin les représentations de dimension finie de l''algèbre de Lie : à partir d''un vecteur propre $v_0$ de $e$ annulé
    par $z$ (vecteur de plus haut poids), il construit une famille libre $v_0, \ldots, v_n$, avec $v_k = w^k(v_0)$, sur laquelle $e$, $z$ et $w$ agissent par des formules explicites, $e(v_k) = i(n - 2k)v_k$.'
