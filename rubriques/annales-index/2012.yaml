  nom: Équations linéaires
  apercu: Le sujet illustre le théorème de structure des solutions d'une équation linéaire $f(x) = b$. Il interprète géométriquement l'algorithme du pivot (plans et vecteurs de $\mathbb{R}^3$) et en tire
    un algorithme de pivots synchronisés donnant simultanément une base du noyau et de l'image. Il découple ensuite en parallèle un système différentiel et un système de récurrences de la forme $X' = AX$
    et $U_{n+1} = AU_n$, compte les zones découpées sur la sphère par $n$ cercles grâce à l'opérateur de différence sur les suites polynomiales, et étudie enfin l'équation fonctionnelle $y(x + 1) - y(x)
    = 1/(1 + x)^2$ à l'aide d'une série de fonctions et d'une représentation intégrale.
