  nom: Fonctions d'endomorphismes
  apercu: 'Le sujet définit $f(t)$ pour un endomorphisme symétrique $t$ et une fonction $f$ définie sur un intervalle contenant son spectre, en agissant par $f(\lambda)$ sur chaque sous-espace propre, et
    en établit les propriétés (polynômes, produit, inverse, racine carrée) après avoir caractérisé les valeurs propres extrêmes par le quotient de Rayleigh. Il étudie l''ordre de Löwner $t_2 \geqslant t_1$
    sur les endomorphismes symétriques, montre que $t \mapsto t^2$ n''est pas croissante pour cet ordre alors que $t \mapsto -1/t$ et $t \mapsto \sqrt{t}$ le sont, puis démontre l''inégalité de Löwner-Heinz
    : $t \mapsto t^a$ est croissante pour $0 < a < 1$, à l''aide d''une représentation intégrale de $t^a$.'
