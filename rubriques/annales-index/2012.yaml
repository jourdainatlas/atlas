- sujet: https://www.vmaths.fr/wp-content/uploads/E3A/PSI/E3A_2012_PSI_MathsA_enonce.pdf
  nom: Suites récurrentes linéaires et suites périodiques
  apercu: 'Après des questions de cours en vrai/faux sur les suites vérifiant $u_{n+2} = a u_{n+1} + b u_n$ et sur des rayons de convergence (coefficients $n^n/n!$ et $\sin(n)/n$), le problème étudie l''espace
    des suites telles que $u_{n+2} + u_n = 0$, puis celui des suites telles que $u_{n+2} + u_n = 2a$ : base, périodicité de période 4, sommes de séries entières associées et endomorphisme induit par l''extraction
    $u_n$ donne $u_{3n}$, qui est une symétrie. La dernière partie généralise à $u_{n+p} + u_n = 2a$, montre la périodicité de période $2p$ et étudie une matrice de type compagnon ainsi que l''opérateur
    de décalage sur cet espace.'
  pages: 5
