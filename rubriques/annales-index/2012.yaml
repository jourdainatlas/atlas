  nom: Produit de convolution, transformée de Fourier et convolution de codimension finie
  apercu: 'Le sujet étudie le produit de convolution $f \ast g$ sur $\mathbb{R}$ (existence, continuité uniforme, dérivabilité, lien avec les séries de Fourier), les approximations de l''unité, et en déduit
    le théorème de Weierstrass grâce aux noyaux $(1 - t^2)^n/\lambda_n$. Il définit ensuite la transformée de Fourier, montre que celle d''une convolée est le produit des transformées et prouve la formule
    d''inversion à l''aide du noyau de Fejér construit à partir de $(\sin x/x)^2$. Il caractérise enfin les fonctions continues bornées $g$ pour lesquelles le sous-espace des $f$ intégrables telles que
    $f \ast g = 0$ est de codimension finie : ce sont les solutions bornées d''équations différentielles linéaires à coefficients constants, c''est-à-dire les combinaisons de $x \mapsto e^{i\beta x}$.'
