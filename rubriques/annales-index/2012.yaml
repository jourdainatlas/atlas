  nom: Primitives itérées, déterminants tridiagonaux et une hypocycloïde
  apercu: 'Trois exercices indépendants. Le premier étudie la suite des primitives itérées d''une fonction continue nulles en $0$, montre que leur somme converge vers une fonction de classe $\mathcal{C}^1$
    solution d''un problème de Cauchy, la retrouve par la formule de Taylor avec reste intégral, puis cherche les éléments propres d''un opérateur intégral. Le deuxième relie la convergence d''une suite
    de déterminants tridiagonaux à celle d''une série par un encadrement par un produit infini. Le troisième étudie une courbe paramétrée à trois points de rebroussement : symétries, tangentes, cercles
    tangents, invariance par rotation et longueur.'
