  nom: Intégrale de Gauss, rotations, sommation des équivalents, théorème de Burnside
  apercu: Quatre exercices indépendants. Le premier calcule l'intégrale de Gauss par convergence dominée appliquée à $(1 - x^2/n)^n$ et par les intégrales de Wallis et la formule de Stirling. Le deuxième
    identifie un demi-tour de $\mathbb{R}^3$, cherche quand $X^3 + X^2 + d$ est scindé sur $\mathbb{R}$, puis détermine, via les relations coefficients-racines, les polynômes $X^3 + aX^2 + bX + c$ dont
    les racines $\alpha$, $\beta$, $\gamma$ font de la matrice symétrique de lignes $(\alpha, \beta, \gamma)$, $(\beta, \gamma, \alpha)$, $(\gamma, \alpha, \beta)$ une rotation. Le troisième utilise la
    sommation des équivalents pour des séries divergentes (série harmonique, séries de Bertrand, moyennes logarithmiques $b_n$). Le quatrième montre qu'un sous-groupe de $\mathrm{GL}_n(\mathbb{C})$ d'exposant
    fini est fini (théorème de Burnside), en caractérisant les nilpotents par les traces de leurs puissances.
