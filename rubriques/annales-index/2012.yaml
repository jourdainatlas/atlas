  nom: Suites récurrentes linéaires et matrices de Hankel
  apercu: 'Le sujet définit le polynôme minimal d''une suite récurrente linéaire comme générateur d''un idéal de $\mathbb{K}[X]$ et décrit, par le lemme des noyaux, l''espace des suites vérifiant une récurrence
    de polynôme caractéristique scindé. Il montre que le rang des matrices de Hankel $H_n(x) = (x_{i+j-2})$ d''une telle suite se stabilise à son ordre minimal et que le noyau de $H_{p+1}(x)$ fournit la
    récurrence minimale, avec un exemple traité par programme. La dernière partie, indépendante, cherche quels $n$-uplets ordonnés sont spectres de matrices de Hankel réelles : elle établit des conditions
    nécessaires (dont l''inégalité (III.1) et des inégalités linéaires obtenues par une inégalité de trace) et traite complètement le cas $n = 3$.'
