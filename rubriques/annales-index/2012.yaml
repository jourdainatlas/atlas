  nom: Polynômes de Bernstein et théorème taubérien de Hardy-Littlewood
  apercu: La première partie calcule des sommes binomiales, majore $S(x)$, somme des $|x - k/n| \binom{n}{k} x^k (1 - x)^{n-k}$, par $1/(2\sqrt{n})$ via Cauchy-Schwarz, et en déduit que les polynômes de
    Bernstein $B_n(f)$ approchent une fonction lipschitzienne ou $\mathcal{C}^1$ par morceaux à $O(1/\sqrt{n})$ près en norme uniforme. La seconde partie, pour une série entière réelle de rayon 1 dont la
    somme est équivalente à $1/(1 - x)$ en $1$, montre par des contre-exemples que cette hypothèse n'entraîne ni $a_n \to 1$ ni la convergence vers $1$ des moyennes de Cesàro, puis, si de plus $a_n \geqslant
    0$, démontre par la méthode de Karamata que les moyennes $(a_0 + \ldots + a_n)/(n + 1)$ tendent vers $1$ (théorème de Hardy-Littlewood).
