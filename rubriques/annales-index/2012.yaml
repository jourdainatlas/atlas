  nom: Valeurs d'adhérence d'une suite
  apercu: 'Le sujet étudie l''ensemble $V(u)$ des valeurs d''adhérence d''une suite dans un espace normé de dimension finie : fermeture, compacité, caractérisation de la convergence, exemples construits
    à partir de l''écriture $n = 2^p + k$, limite inférieure et connexité de $V(u)$ pour une suite bornée à évolution lente. Il examine ensuite les suites itératives de l''application tente, ultimement
    périodiques si et seulement si le premier terme est rationnel, définit la force d''un point par rapport à une suite, et justifie enfin un algorithme qui compte les valeurs d''adhérence par les composantes
    connexes d''une union de segments.'
