- sujet: https://www.ens.psl.eu/IMG/file/concours/2012/MP%20I/mp2012_sujet_math_d_6h_u%5B1%5D.pdf
  nom: Invariants polynomiaux des formes binaires sous $\mathrm{SL}_2(\mathbb{C})$
  apercu: Le sujet démontre que l'algèbre des fonctions polynomiales sur l'espace des formes binaires de degré $m$ invariantes par $\mathrm{SL}_2(\mathbb{C})$ est engendrée par un nombre fini d'invariants.
    Il traite d'abord les polynômes homogènes et le cas des matrices symétriques $2 \times 2$, où les invariants sont les polynômes en le déterminant, puis établit le théorème de la base de Hilbert par
    un ordre monomial et une division multivariée. Il caractérise ensuite les invariants à l'aide de deux opérateurs de dérivation et de leurs relations de commutation, et conclut par le processus Oméga
    de Cayley.
