  nom: Matrices stochastiques à coefficients strictement positifs
  apercu: Le sujet étudie les matrices réelles à coefficients strictement positifs dont chaque ligne est de somme $1$. Pour $n = 3$, il montre que si les valeurs propres autres que $1$ sont $\lambda$ et
    son conjugué, alors $\lambda$ est dans l'intérieur $T$ du triangle de sommets $1, j, j^2$, et réciproquement construit pour un tel $\lambda$ une matrice circulante $A = P(J)$ qui convient. En dimension
    $n$, il prouve que $1$ est valeur propre, que toute valeur propre est de module au plus $1$ avec égalité seulement pour $1$, que le sous-espace propre de la transposée pour $1$ est une droite engendrée
    par un vecteur de probabilité $\Omega$ à coefficients strictement positifs, et que $1$ est valeur propre simple.
