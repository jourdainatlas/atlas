- sujet: https://www.vmaths.fr/wp-content/uploads/CCINP/PC/CCP_2012_PC_M2_enonce.pdf
  nom: Le polylogarithme
  apercu: 'Le sujet étudie la fonction polylogarithme, somme de la série entière des $x^n/n^\alpha$ : rayon de convergence, relation entre deux indices, valeurs pour $\alpha = 0, -1, 1$ et comportement
    en $1$. Pour $\alpha > 1$, il la prolonge à l''intervalle des $x$ inférieurs ou égaux à $1$, puis au plan complexe privé de $\left]1, +\infty\right[$, grâce à une représentation intégrale faisant intervenir
    la fonction Gamma, obtenue par intégration terme à terme. Le cas $\alpha = 2$ donne $\zeta(2)$ par Parseval, la valeur en $1/2$ par une relation fonctionnelle et un équivalent en moins l''infini.'
