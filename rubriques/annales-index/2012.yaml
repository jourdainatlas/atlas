  nom: Continuité uniforme ; marches aléatoires ; équation de Pell-Fermat
  apercu: 'Le premier problème étudie la continuité uniforme : fonctions lipschitziennes, exemples ($1/(1 + |x|)$, racine carrée uniformément continue mais non lipschitzienne, $x^2$ non uniformément continue),
    majoration affine d''une fonction uniformément continue sur $\mathbb{R}_+$, puis démonstration du théorème de Heine par Bolzano-Weierstrass. Le deuxième établit des estimations sur $H_n$, sur la suite
    $a_n = \sqrt{n}\,\binom{2n}{n}/4^n$ (croissante, de limite $1/\sqrt{\pi}$ grâce à Stirling) et en déduit que le nombre moyen de retours à l''origine avant l''instant $2n$ d''une marche aléatoire simple
    est équivalent à une constante fois $\sqrt{n}$ sur la droite et à $\ln(n)/\pi$ dans le plan. Le troisième ramène l''égalité $1 + \dots + m = m + \dots + n$ à l''équation $x^2 - 2y^2 = 1$ et montre que
    ses solutions sont exactement les $(x_n, y_n)$ définis par $(3 + 2\sqrt{2})^n = x_n + y_n\sqrt{2}$.'
