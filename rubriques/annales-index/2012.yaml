  nom: Réseaux euclidiens, constante d'Hermite et sommes de carrés
  apercu: 'Le sujet étudie les réseaux d''un espace euclidien : $\mathbb{Z}$-bases et groupe $\mathrm{GL}_n(\mathbb{Z})$, déterminant d''un réseau, existence de vecteurs minimaux, sous-groupes d''un réseau,
    complétion d''un vecteur minimal en $\mathbb{Z}$-base, matrices de Gram et réseaux semblables, avec les exemples $\mathbb{Z}^n$, $D_n$ et $A_2$ (réseau hexagonal). Il démontre l''inégalité d''Hermite
    $m(\Lambda)^2 \leqslant (4/3)^{(n-1)/2} (\det \Lambda)^{2/n}$, calcule $\gamma_2 = 2/\sqrt{3}$ en caractérisant le cas d''égalité, puis applique ces réseaux pour montrer qu''un premier $p \equiv 1 \pmod{4}$
    (resp. $\mathrm{mod}\ 8$, $\mathrm{mod}\ 3$) s''écrit $a^2 + b^2$ (resp. $a^2 + 2b^2$, $a^2 + 3b^2$).'
