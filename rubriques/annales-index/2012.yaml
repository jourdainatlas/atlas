  nom: Équations différentielles matricielles et matrice résolvante
  apercu: Le sujet résout d'abord un système différentiel $X' = AX + B(t)$ à coefficients constants en dimension 4, par les éléments propres de $A$ puis par résolution en cascade. Il définit ensuite, pour
    $X' = A(t)X$, la matrice résolvante $R(t, t_0) = W(t)W(t_0)^{-1}$ à partir d'un système fondamental, en établit les propriétés et obtient par variation des constantes la solution particulière intégrale
