  nom: Points à coordonnées entières dans des polytopes
  apercu: Le sujet compte les points entiers de parties de $\mathbb{R}^d$ et montre que ces nombres sont des fonctions quasi-polynomiales de la dilatation. Il traite d'abord le nombre de solutions de $m_1k_1
    + \dots + m_dk_d = n$ par séries formelles et éléments simples, démontre la formule de Pick pour les polygones à sommets entiers par triangulation et en déduit que $n \mapsto \operatorname{Card}(n\mathscr{P}
    \cap \mathbb{Z}^2)$ est polynomiale, puis établit le caractère quasi-polynomial pour un simplexe à sommets rationnels via un cône et sa série génératrice. Il applique enfin ces résultats aux polynômes
    quasi-homogènes et à l'algèbre des invariants d'un groupe cyclique agissant diagonalement, dont il discute la factorialité.
