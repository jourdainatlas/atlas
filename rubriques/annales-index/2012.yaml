  nom: Propriétés spectrales des opérateurs compacts positifs
  apercu: Le problème démontre le théorème de Perron-Frobenius pour une matrice qui envoie les vecteurs positifs non nuls sur des vecteurs strictement positifs, et l'applique au comportement asymptotique
    de $y' = Ay$. Il développe ensuite la théorie spectrale des opérateurs compacts sur un Banach, étudie un opérateur intégral et un opérateur de convolution périodique, établit le théorème de point fixe
    de Schauder à partir de celui de Brouwer et en déduit un analogue en dimension infinie (théorème de Krein-Rutman) pour les opérateurs compacts fortement positifs relativement à un cône. Il traite enfin
    un opérateur aux différences sur l'espace des suites $\ell^2(\mathbb{Z})$ par une méthode variationnelle.
