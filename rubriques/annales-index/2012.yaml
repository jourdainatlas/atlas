  nom: Diagonalisabilité d'un couple de matrices
  apercu: Le sujet étudie les valeurs propres d'un couple $(A, B)$, racines de $\chi_{(A,B)}(\lambda) = \det(A - \lambda B)$, et la diagonalisabilité d'un couple, c'est-à-dire l'existence de $P, Q$ inversibles
    et $D, D'$ diagonales avec $A = PDQ$ et $B = PD'Q$. Après un exemple en dimension 3, il relie le degré de $\chi_{(A,B)}$ à l'inversibilité de $B$, montre qu'un couple de matrices symétriques réelles
    avec $B$ définie positive (ou un couple régulier de symétriques positives) est diagonalisable, établit un critère par les dimensions des sous-espaces propres, valeur propre infinie comprise, et donne
    un couple non diagonalisable en dimension 4.
