- sujet: https://www.ens.psl.eu/IMG/file/concours/2012/PC/pc2012_sujet_mathematiques%5B1%5D.pdf
  nom: Étude qualitative des systèmes différentiels autonomes
  apercu: Le sujet étudie le comportement asymptotique des solutions de $y' = f(y)$. Après un exemple logistique en dimension 1 résolu explicitement, il construit l'exponentielle de matrice comme résolvante
    du système linéaire $Y' = AY$, établit le lemme de Grönwall et montre la décroissance exponentielle quand les valeurs propres sont strictement négatives. La dernière partie justifie la stabilité asymptotique
    d'un équilibre par linéarisation, avec des exemples d'explosion en temps fini et un système plan concret.
