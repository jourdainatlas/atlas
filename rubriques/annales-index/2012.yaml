  nom: Réciproque de $x e^x$ et série entière $\sum n^{n-1} z^n / n!$
  apercu: 'Le sujet étudie la réciproque $g$ de la restriction de $f(x) = x e^x$ à $\left[-1, +\infty\right[$ (fonction de Lambert) : régularité, expression de $g''$ en fonction de $g$, branche parabolique
    et primitive. Il l''utilise pour la limite de la tour d''exponentielles $u_{n+1} = c^{u_n}$ avec $0 < c < e^{1/e}$, puis détermine le rayon $1/e$ de la série $S(z) = \sum n^{n-1} z^n / n!$ et sa convergence
    normale sur le cercle grâce à un équivalent de type Stirling de $n^{n-1}/(e^n n!)$, établi via la suite $n!\, e^n/(n^n \sqrt{n})$. Une forme linéaire « coefficient $\alpha_{-1}$ » sur des fonctions
    à développement de Laurent sert enfin à calculer les coefficients du développement en série entière de $g$ (inversion de Lagrange) et à relier $g$ à $S$.'
