  nom: Nombres de Pisot
  apercu: 'Le sujet étudie les nombres de Pisot, entiers algébriques $\theta$ de module au moins 1 dont tous les autres conjugués sont de module strictement inférieur à 1 (on montre qu''ils sont réels).
    Après le lemme de Gauss sur les polynômes primitifs, il montre que la série des $\sin^2(\pi\theta^n)$ converge lorsque $\theta$ est de Pisot, puis caractérise les séries entières rationnelles par une
    récurrence linéaire ou l''annulation des déterminants de Hankel et prouve qu''une telle série à coefficients entiers a un dénominateur de terme constant $\pm 1$. Il en déduit la réciproque (théorème
    de Pisot : si $\theta > 1$ et si la série des $\sin^2(\lambda\pi\theta^n)$ converge pour un $\lambda > 0$, $\theta$ est de Pisot) et montre enfin que si le produit infini $\Gamma(u)$ des $\cos(u\theta^{-k})$
    ne tend pas vers $0$ à l''infini, $\theta$ est un nombre de Pisot, la réciproque étant établie pour $\theta$ de Pisot différent de $2$.'
