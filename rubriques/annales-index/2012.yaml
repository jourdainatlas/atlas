  nom: Valeurs d'adhérence de séries entières sur le cercle de convergence
  apercu: Le sujet introduit la convergence au sens de Cesàro et l'applique aux séries entières sur leur cercle de convergence pour trois exemples. Il démontre ensuite le théorème de Kronecker sur l'approximation
    simultanée des $e^{i\alpha_j}$ par les $e^{i\lambda_j N}$ quand $\lambda_1, \ldots, \lambda_n, \pi$ sont $\mathbb{Q}$-linéairement indépendants, à l'aide de la moyenne $M(f)$ des polynômes trigonométriques
    généralisés et du noyau de Fejér, en montrant que la norme infinie de $r_0 + \sum r_j e^{i\alpha_j} e^{i\lambda_j x}$ vaut $r_0 + \sum r_j$. Il en déduit, pour chacun des trois exemples et sous des
    hypothèses d'indépendance sur $\mathbb{Q}$, que l'ensemble des valeurs d'adhérence des sommes partielles en un point du cercle est un cercle, une réunion de deux cercles ou une couronne centrés en la
    C-limite.
