- sujet: https://www.vmaths.fr/wp-content/uploads/MinesPonts/PC/MinesPonts_2012_PC_M1_enonce.pdf
  nom: Le sinus lemniscatique
  apercu: Le sujet calcule la longueur de la lemniscate de Bernoulli, ce qui fait apparaître l'intégrale $\sigma$ de $1/\sqrt{1 - r^4}$ entre $0$ et $1$, puis définit le sinus lemniscatique $\mathrm{sl}$
    comme réciproque de $F$ prolongée par symétrie et périodicité. Il montre que $\mathrm{sl}$ vérifie $\mathrm{sl}'' + 2\,\mathrm{sl}^3 = 0$, décrit toutes les solutions de cette équation à l'aide d'une
    intégrale première, introduit le cosinus lemniscatique et établit une formule d'addition, puis la formule de duplication de Fagnano.
