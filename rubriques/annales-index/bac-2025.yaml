  nom: Probabilités conditionnelles, loi binomiale et inégalité de Bienaymé-Tchebychev, fonction logarithme, convexité et aire, vrai-faux de géométrie dans l'espace, suite récurrente et équation différentielle
  apercu: 'Le premier exercice traite des groupes sanguins par un arbre pondéré et les probabilités totales, puis du nombre de donneurs universels dans un échantillon par une loi binomiale, et enfin d''une
    moyenne $M_N$ de variables indépendantes, pour laquelle l''inégalité de Bienaymé-Tchebychev fournit le nombre minimal $N$ de villes. Le deuxième part de lectures graphiques puis étudie $f(x) = x\left[2(\ln
    x)^2 - 3\ln x + 2\right]$ : limites, convexité, point d''inflexion, position par rapport à une tangente, et calcul par intégration par parties de l''aire entre la courbe et cette tangente. Le troisième
    est un vrai-faux de géométrie dans l''espace (représentation paramétrique, vecteur normal, coplanarité de deux droites, distance d''un point à un plan). Le quatrième modélise la croissance d''une posidonie,
    d''abord par la suite $u_{n+1} = -0{,}02u_n^2 + 1{,}3u_n$ étudiée par récurrence et par un algorithme de seuil, puis par une équation différentielle ramenée par $g = \frac{1}{f}$ à une équation linéaire.'
