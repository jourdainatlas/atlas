  apercu: Le premier exercice étudie les contrôles d'une caisse automatique à l'aide d'un arbre pondéré et d'une probabilité conditionnelle inverse, puis d'une loi binomiale (probabilité d'au moins une
    erreur, nombre de contrôles nécessaire) et enfin de la somme $S = X_1 + X_2 + X_3$ de trois variables binomiales, à laquelle on applique l'inégalité de Bienaymé-Tchebychev. Le deuxième est un QCM de
    géométrie dans l'espace sur les positions relatives de droites et de plans et sur la mesure d'un angle $\widehat{BAC}$. Le troisième étudie la fonction $f(x) = 4\ln(x+1) - \frac{x^2}{25}$, localise
    par le théorème des valeurs intermédiaires et un script Python la solution $\alpha$ de $f(x) = x$, puis montre que la suite $u_{n+1} = f(u_n)$, $u_0 = 2$, converge vers $\alpha$. Le quatrième résout
    l'équation $y' + 0{,}48y = \frac{1}{250}$ et s'en sert, par le changement de fonction $p = \frac{1}{y}$, pour obtenir l'expression d'une population de bactéries, sa limite et le temps de dépassement
    d'un seuil.
