  nom: Probabilités conditionnelles, loi binomiale et Bienaymé-Tchebychev, suite homographique et suite auxiliaire, vrai-faux de géométrie dans l'espace, équation différentielle et étude de fonction
  apercu: Le premier exercice étudie la stabilité des connexions via trois serveurs à l'aide d'un arbre pondéré, des probabilités totales et d'une probabilité conditionnelle inverse, puis le nombre de connexions
    instables par une loi binomiale, la plus petite taille d'échantillon garantissant au moins une connexion instable avec une probabilité au moins égale à 0,99, et la fréquence $F_n$ par l'inégalité de
    Bienaymé-Tchebychev. Le deuxième détermine la limite de la suite $u_{n+1} = \frac{2u_n + 1}{u_n + 2}$ grâce à la suite auxiliaire $a_n = \frac{u_n}{u_n - 1}$, minorée par récurrence, et interprète un
    algorithme de seuil en Python. Le troisième est un vrai-faux de géométrie dans l'espace sur la coplanarité de deux droites, un plan orthogonal à une droite, la mesure d'un angle et la distance d'un
    point à son projeté orthogonal sur un plan. Le quatrième associe une fonction et sa dérivée sur un graphique, résout l'équation différentielle $y + y' = (2x+3)\mathrm{e}^{-x}$ et cherche les solutions
    à deux points d'inflexion, puis étudie $f(x) = (x^2 + 3x + 2)\mathrm{e}^{-x}$ et calcule une aire sous sa courbe.
  pages: 6
