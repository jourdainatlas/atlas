    Python. Le quatrième étudie $f(x) = \frac{\mathrm{e}^{\sqrt{x}}}{2\sqrt{x}}$ : limites et asymptote, variations, solution de $f(x) = 2$, calcul de $\int_1^2 f(x)\,\mathrm{d}x$ à l''aide de la primitive
    $\mathrm{e}^{\sqrt{x}}$ et convexité.'
