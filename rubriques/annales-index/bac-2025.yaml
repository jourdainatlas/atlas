  apercu: 'Le premier exercice est un vrai-faux de géométrie dans l''espace dépendant d''un paramètre $\alpha$ : vecteur normal au plan $(ABC)$, parallélisme de droites, mesure d''un angle, projeté orthogonal
    sur une droite et intersection d''une droite avec une sphère. Le deuxième étudie deux tests de conformité de jouets par un arbre pondéré et une probabilité conditionnelle inverse, puis le nombre de
    jouets conformes dans un lot par une loi binomiale et la proportion $F_n$ par l''inégalité de Bienaymé-Tchebychev pour déterminer une taille de lot. Le troisième modélise la quantité de médicament par
