  nom: Étude de fonction, convexité et aire, vrai-faux de géométrie dans l'espace, probabilités conditionnelles et loi binomiale, suite récurrente d'ordre 2
  apercu: 'Le premier exercice étudie $f(x) = x\mathrm{e}^{-x} + 2x - 1$ : limites, convexité à l''aide de $f''''(x) = (x-2)\mathrm{e}^{-x}$, variations de $f''$ puis de $f$, existence et encadrement de
    l''unique solution de $f(x) = 0$, position par rapport à la droite $y = 2x - 1$, puis aire entre la courbe et cette droite calculée par intégration par parties et sa limite. Le deuxième est un vrai-faux
    de géométrie dans l''espace sur le parallélisme et l''intersection de droites, l''orthogonalité d''une droite et d''un plan, un projeté orthogonal et le parallélisme d''une droite et d''un plan dépendant
    d''un paramètre. Le troisième traite la vaccination et la contamination par un arbre pondéré et des probabilités conditionnelles, puis par une loi binomiale sur un échantillon de 20 personnes. Le quatrième
    étudie la suite $u_{n+2} = u_{n+1} - \frac{1}{4}u_n$ grâce à une suite auxiliaire géométrique, établit par récurrence que $u_n = n\left(\frac{1}{2}\right)^n$, puis montre sa décroissance et sa convergence.'
  pages: 4
