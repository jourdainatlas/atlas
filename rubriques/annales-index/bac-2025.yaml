    à partir de sa limite en $+\infty$ et d''une tangente, étudie $f(x) = \frac{1}{1 + \mathrm{e}^{-0{,}2x}}$, applique le théorème des valeurs intermédiaires et calcule sa valeur moyenne sur $[0, 40]$.
    Le troisième dénombre des séquences de quatre caractères du codage base64, puis étudie le nombre de caractères mal transmis par une loi binomiale et l''espérance et la variance d''une somme de quatre
    variables indépendantes. Le quatrième établit une équation du plan $(ABC)$, étudie deux plans sécants et leur droite d''intersection, et montre que cette droite est incluse dans $(ABC)$.'
