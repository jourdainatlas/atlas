  nom: Probabilités conditionnelles et suite arithmético-géométrique, vrai-faux de dénombrement et de probabilités, équation différentielle et concentration d'un médicament, distance minimale et orthocentre
    dans l'espace
  apercu: Le premier exercice modélise le choix quotidien d'un plat végétarien par un arbre pondéré, calcule une probabilité conditionnelle inverse, établit la relation $p_{n+1} = 0{,}2p_n + 0{,}7$, choisit
    le bon programme Python parmi trois, puis démontre par récurrence la forme explicite de $p_n$ et en déduit sa limite. Le deuxième est un vrai-faux sur des dénombrements (poignées de main, choix des
    trois premiers, podiums), la loi de la somme de deux variables indépendantes et une probabilité conditionnelle pour une loi binomiale. Le troisième lit graphiquement la concentration d'un médicament,
    résout l'équation différentielle $y' + y = 5\mathrm{e}^{-t}$ pour obtenir $f(t) = 5t\mathrm{e}^{-t}$, étudie cette fonction pour déterminer la durée du risque de somnolence, puis calcule la concentration
    moyenne durant la première heure. Le quatrième minimise la distance $OM(t) = \sqrt{4t^2 - 2t + 1}$ pour obtenir le projeté orthogonal de $O$ sur la droite $(CK)$, montre que ce point est l'orthocentre
    du triangle $ABC$, en déduit une équation du plan $(ABC)$ et l'aire du triangle.
