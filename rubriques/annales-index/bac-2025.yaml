  apercu: Le premier exercice étudie le service au tennis par un arbre pondéré, une probabilité conditionnelle inverse et l'étude de l'indépendance de deux évènements, puis la conformité de balles par une
    loi binomiale et la moyenne $M_n$ d'un échantillon par l'inégalité de Bienaymé-Tchebychev. Le deuxième est un QCM de géométrie dans l'espace sur la position relative de droites, d'une droite et d'un
    plan, la coplanarité de quatre points et l'intersection de deux plans. Le troisième étudie la suite $v_{n+1} = \ln(-1 + 2\mathrm{e}^{v_n})$ à l'aide d'un tableur, démontre sa croissance par récurrence,
    montre que $w_n = -1 + \mathrm{e}^{v_n}$ est géométrique, en déduit $v_n = \ln(1 + 3 \times 2^n)$ et justifie la terminaison d'un algorithme de seuil. Le quatrième dénombre les couples $(a ; c)$ pour
    lesquels $ax^2 + 2x + c = 0$ a deux solutions réelles distinctes, résout l'équation différentielle $y' + 10y = (30x^2 + 22x - 8)\mathrm{e}^{-5x+1}$ et réutilise ces résultats pour étudier $f(x) = (6x^2
    + 2x - 2)\mathrm{e}^{-5x+1}$, ses tangentes horizontales, le nombre de solutions de $f(x) = 1$ et la question de savoir si l'intégrale $I_m$ peut s'annuler.
