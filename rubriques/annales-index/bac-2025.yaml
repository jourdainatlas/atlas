  apercu: 'Le premier exercice est un vrai-faux sur la fonction $f(x) = x\mathrm{e}^{-2x}$ : dérivée, équation différentielle $y'' + 2y = \mathrm{e}^{-2x}$, convexité, nombre de solutions d''une équation
    et aire sous la courbe. Le deuxième étudie dans un cube le triangle $ABG$ : intersection de deux médianes, vecteur normal et équation du plan $(ABG)$, point équidistant des trois sommets, triangle rectangle,
    puis alignement du centre du cercle circonscrit, du centre de gravité et de l''orthocentre sur la droite d''Euler. Le troisième modélise les réponses au hasard à un QCM par une loi binomiale, puis étudie
    la note $Y = 1{,}5X - 5$ obtenue avec des points négatifs et son espérance. Le quatrième étudie une suite d''événements par des arbres pondérés et une probabilité conditionnelle, établit $p_{n+1} =
    -0{,}4p_n + 0{,}7$ et la limite de $(p_n)$ par une suite géométrique, puis généralise avec un paramètre $x$ et démontre par récurrence que $p_n = \frac{1}{2}(1 - 2x)^{n-1} + \frac{1}{2}$.'
  pages: 4
