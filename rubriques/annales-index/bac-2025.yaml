  nom: Test de dépistage, probabilités conditionnelles et loi binomiale, suites arithmético-géométriques et récurrence, vrai-faux de géométrie dans l'espace, équation différentielle, étude de fonction et
    valeur moyenne
  apercu: Le premier exercice étudie un test de dépistage du chikungunya par un arbre pondéré et la formule de Bayes, d'abord sur l'exemple de La Réunion, puis en fonction de la proportion $p$ de malades
    avec $P_T(M) = \frac{999p}{994p + 5}$ pour déterminer quand le test est fiable, et enfin par une loi binomiale pour la taille d'échantillon. Le deuxième exprime $u_n$ pour la suite $u_{n+1} = \frac{1}{2}u_n
    + 10$ grâce à la suite géométrique $v_n = u_n - 20$, corrige une fonction Python, puis démontre par récurrence que $w_n = 10n\left(\frac{1}{2}\right)^n + 11\left(\frac{1}{2}\right)^n + 34$ et étudie
    la convergence de $(w_n)$ à l'aide d'un encadrement admis. Le troisième est un vrai-faux de géométrie dans l'espace sur l'orthogonalité d'une droite et d'un plan, la mesure d'un angle, l'intersection
    de deux plans et le projeté orthogonal d'un point sur une droite. Le quatrième lit graphiquement l'instant où la température revient à sa valeur initiale, détermine les constantes de $f(t) = (at + b)\mathrm{e}^{-0{,}5t}$
    à l'aide de $f(0) = 40$ et d'une équation différentielle, étudie les variations de $f(t) = (60t + 40)\mathrm{e}^{-0{,}5t}$ et la solution de $f(t) = 40$, puis calcule par intégration par parties la
    température moyenne sur les quatre premières minutes.
