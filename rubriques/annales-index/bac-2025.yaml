  nom: Loi binomiale et inégalité de Bienaymé-Tchebychev, suite des racines carrées et approximation de $\ln(2)$ par la méthode de Briggs, vrai-faux de géométrie dans l'espace, fonction exponentielle-sinus,
    convexité et intégrales
  apercu: 'Le premier exercice étudie les paniers à trois points d''un basketteur par une loi binomiale et l''espérance des points marqués, puis la moyenne $M_n$ de ses points sur $n$ matchs, dont l''écart
    à 22 est contrôlé par l''inégalité de Bienaymé-Tchebychev. Le deuxième montre que la suite $u_{n+1} = \sqrt{u_n}$, de premier terme 2, converge vers 1, établit que $v_n = \ln(u_n)$ est géométrique et
    que $\ln(2) = 2^n\ln(u_n)$, puis en déduit une approximation de $\ln(2)$ par la tangente $y = x - 1$ et un programme Python pour la méthode de Briggs. Le troisième est un vrai-faux de géométrie dans
    l''espace sur un cube (combinaison de vecteurs, base, produit scalaire), puis sur un plan et des droites (parallélisme, plan parallèle, distance d''un point à un plan, coplanarité). Le quatrième étudie
    $f(x) = \mathrm{e}^{x}\sin(x)$ sur $[0, \pi]$ : variations, convexité et inégalité de tangente, point d''inflexion, calcul de $\int_0^{\frac{\pi}{2}} \mathrm{e}^{x}\sin(x)\,\mathrm{d}x$ par deux intégrations
    par parties et aire entre la courbe et la droite $y = x$.'
  pages: 5
