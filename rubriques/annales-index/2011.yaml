  nom: Transformation d'Euler et accélération de la convergence
  apercu: Le sujet étudie l'opérateur de différence $\Delta$ et les suites complètement monotones, notamment les suites de moments $u_n = \int_0^1 t^n \omega(t) \,\mathrm{d}t$. Il démontre que pour toute
    série alternée convergente $\sum (-1)^k u_k$, la transformée d'Euler $\sum (-1)^p (\Delta^p u)_0 / 2^{p+1}$ converge vers la même somme (avec erreur en $S/2^{n+1}$ pour les suites de moments), d'où
    $\ln 2 = \sum 1/((p+1)2^{p+1})$. Il améliore ensuite la méthode avec des polynômes $P_n$ vérifiant $P_n(\sin^2 t) = \cos(2nt)$ (polynômes de Tchebychev décalés) et compare les vitesses de convergence
    sur la série de $\ln 2$.
  pages: 4
