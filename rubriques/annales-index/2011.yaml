  nom: Fonction Gamma, formules d'Euler et distribution de Boltzmann
  apercu: Après les propriétés de base de la fonction Gamma, le sujet établit le développement $\ln n! = n \ln n - n + \frac{1}{2} \ln n + a + \frac{1}{12n} + O\left(\frac{1}{n^2}\right)$, la valeur $a
    = \frac{1}{2} \ln(2\pi)$ de la constante de Stirling étant admise, puis l'identité d'Euler donnant $\Gamma(x)$ comme limite de $n!\, n^x / \bigl(x(x+1)\cdots(x+n)\bigr)$, et une formule intégrale pour
    $\ln \Gamma(x+1)$ faisant intervenir la fonction $h(u) = u - [u] - 1/2$. Il l'applique enfin à la maximisation de $-\sum \ln \Gamma(1+x_i)$ sous deux contraintes linéaires, ce qui conduit à la loi de
    répartition de Boltzmann.
