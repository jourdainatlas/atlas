  nom: Construction de triangles ; théorème des valeurs intermédiaires ; polynômes de Laguerre
  apercu: 'Le sujet comporte trois problèmes. Le premier cherche, $B$, $C$ et $M$ étant donnés, les points $A$ tels que $M$ soit le centre de gravité, le centre du cercle circonscrit, l''orthocentre ou
    le centre du cercle inscrit du triangle $ABC$. Le deuxième démontre le théorème des valeurs intermédiaires par dichotomie, ses applications (point fixe, formule de la moyenne, cordes horizontales) et
    étudie la réciproque ($\sin(1/x)$, théorème de Darboux sur les dérivées). Le troisième étudie les polynômes de Laguerre $L_n = e^x \left(x^n e^{-x}\right)^{(n)}/n!$ : relations de récurrence, équation
    différentielle, une identité binomiale obtenue par développements limités et l''orthonormalité pour le poids $e^{-x}$.'
