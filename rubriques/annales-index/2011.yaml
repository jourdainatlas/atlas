  nom: Cône nilpotent, endomorphismes réguliers et adhérence des classes de similitude nilpotentes
  apercu: Le sujet étudie d'abord le cône nilpotent de $\mathcal{M}_2(\mathbb{R})$, image du cône $a^2 + bc = 0$, ses plans tangents et les composantes connexes de son complémentaire. Il établit ensuite
    la réduction de Jordan d'un endomorphisme nilpotent complexe, la dimension de son commutant, puis des propriétés des endomorphismes réguliers (cycliques) et des couples de nilpotents qui commutent.
    Après l'étude de l'ordre de dominance sur les partitions et de la partition conjuguée, il démontre que l'adhérence de la classe de similitude $\mathcal{N}_\lambda$ d'une matrice de Jordan nilpotente
    est la réunion des $\mathcal{N}_\mu$ pour $\mu$ dominée par $\lambda$.
