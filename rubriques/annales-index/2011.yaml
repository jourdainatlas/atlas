    $\det(tA + (1 - t)B) \geqslant (\det A)^t (\det B)^{1-t}$ et l''inégalité de Minkowski ; il termine par l''unicité et le calcul de la décomposition de Cholesky, un algorithme, et l''inégalité d''Hadamard.'
