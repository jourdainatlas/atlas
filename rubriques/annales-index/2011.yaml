  nom: Droites des moindres carrés
  apercu: 'Le problème étudie les deux droites des moindres carrés d''un nuage de points du plan, régression de $y$ en $x$ et de $x$ en $y$. Il les calcule d''abord pour trois points, puis les interprète
    dans un espace préhilbertien comme des projections orthogonales, en introduisant moyenne, écart type, covariance et coefficient de corrélation $\rho$, ce qui donne les équations $(y - m_y)/\sigma_y
    = \rho(x - m_x)/\sigma_x$ et leur symétrique. Une partie sur les matrices de Gram (matrice symétrique à spectre strictement positif associée à une base, bases adaptées) prépare le cas général : les
    deux droites se coupent à l''isobarycentre des points, et l''on caractérise le cas où elles sont orthogonales.'
