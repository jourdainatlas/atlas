  nom: Étude de la fonction $F(x) = \int \mathrm{d}t/\sqrt{1+t^4}$ et intégrales de Wallis
  apercu: Le problème étudie $f(x) = 1/\sqrt{1+x^4}$, sa primitive $F$ nulle en $0$ et l'intégrale $\alpha = \int_0^{+\infty} \mathrm{d}t/\sqrt{1+t^4}$, ainsi que la suite $a_n = (2n)!/(4^n (n!)^2)$. Les
    intégrales de Wallis fournissent l'équivalent $a_n \sim 1/\sqrt{\pi n}$ ; l'étude de $F$ (variations, développement limité, limite $\alpha$ en $+\infty$, courbe paramétrée, fonction de deux variables)
    aboutit au développement en série entière de $F$ sur $[-1, 1]$, d'où $\alpha = 2 \sum (-1)^n a_n/(4n+1)$ et une valeur approchée de $\alpha$.
