  nom: Équation fonctionnelle polynomiale, cubique nodale et loi de corde-tangente, série de Fourier d'une périodisée
  apercu: Le premier exercice détermine les polynômes complexes $P$ vérifiant $P(X^2 - 1) = P(X - 1)P(X + 1)$ en étudiant l'orbite d'une racine sous une suite récurrente. Le deuxième étudie la courbe paramétrée
    $x = \varphi(t)$, $y = t\varphi(t)$ avec $\varphi(t) = (t^2 - 1)/(t^2 + 1)$ et montre, à l'aide de déterminants, qu'une droite sécante ou tangente recoupe la courbe au point de paramètre $-(1 + ab)/(a
    + b)$. Le troisième calcule les coefficients de Fourier de la fonction $2\pi$-périodique $F(t) = \sum 1/\bigl(1 + (t + 2n\pi)^2\bigr)$ en les ramenant à l'intégrale $\int \cos(xs)/(1 + s^2) \,\mathrm{d}s$,
    obtenue grâce à l'équation différentielle $\phi'' = \phi$, d'où une expression explicite de $F$.
  pages: 4
