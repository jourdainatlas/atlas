  nom: Sous-algèbres de $\mathcal{M}_4(\mathbb{R})$, intégrale de Gauss et fonction erreur, parabole et paraboloïde
  apercu: Le premier exercice étudie des sous-espaces de $\mathcal{M}_4(\mathbb{R})$ stables par produit, engendrés par $I$ et la matrice $K$ de coefficients tous égaux à $1$ ou par $K$ et une matrice $Z$,
    les diagonalise simultanément par une matrice orthogonale à coefficients $\pm 1/2$, puis décompose une matrice $A$ diagonalisable à l'aide de projecteurs et calcule son commutant. Le deuxième calcule
    l'intégrale de Gauss par l'intégrale à paramètre $F(x) = \int e^{-xt^2}/(1 + t^2) \,\mathrm{d}t$, développe en série entière la primitive de $e^{-t^2}$ et $e^{x^2}$ fois celle-ci, et étudie la fonction
    $\Phi(x) = \int_x^{+\infty} e^{-t^2} \,\mathrm{d}t$. Le troisième porte sur la parabole $x^2 = 2y$, sa propriété focale de réflexion, la surface de révolution engendrée et une surface réglée.
  pages: 4
