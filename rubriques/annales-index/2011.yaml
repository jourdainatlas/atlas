  nom: Commutant d'une matrice cyclique d'ordre 3, équivalent d'une série trigonométrique, volume de l'intersection de deux cylindres
  apercu: Le premier exercice montre, en distinguant trois cas selon la forme du polynôme minimal, que le commutant d'une matrice $A$ de $\mathcal{M}_3(\mathbb{C})$ dont le polynôme caractéristique est
    égal au polynôme minimal est l'ensemble des polynômes en $A$. Le deuxième représente la somme de la série des $\sin(nx)/\sqrt{n}$ par une intégrale faisant intervenir $\operatorname{ch}(t^2) - \cos
    x$, ce qui en donne un équivalent quand $x$ tend vers $0$. Le troisième calcule le volume de l'intersection de deux cylindres $x^2 + z^2 \leqslant 1$ et $y^2 + z^2 \leqslant 1$ et l'aire d'une portion
    de surface.
