  nom: Inégalité de Prékopa et Leindler
  apercu: 'Le problème démontre l''inégalité de Prékopa-Leindler sur $\mathbb{R}$ : si $h(\lambda x + (1 - \lambda)y) \geqslant f(x)^\lambda g(y)^{1-\lambda}$, alors l''intégrale de $h$ majore le produit
    des intégrales de $f$ et $g$ élevées aux puissances $\lambda$ et $1 - \lambda$, d''abord pour $f$ et $g$ strictement positives par un changement de variable construit à partir des fonctions de répartition,
    puis en général par approximation et convergence dominée. Il étudie ensuite les fonctions log-concaves, étend l''inégalité au plan et en déduit une inégalité de type Brunn-Minkowski $V(\lambda A + (1
    - \lambda)B) \geqslant V(A)^\lambda V(B)^{1-\lambda}$ pour l''aire d''ouverts bornés.'
  pages: 5
