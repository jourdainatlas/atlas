  nom: La fonction dilogarithme
  apercu: Le problème étudie la fonction $L(x) = -\int_0^x \ln(1-t)/t \,\mathrm{d}t$ (dilogarithme), à partir du développement en série entière de $f(t) = \ln(1-t)/t$. Il établit la régularité de $L$, son
    développement $\sum x^n/n^2$ sur $\left]-1, 1\right]$, la relation $L(x) + L(-x) = L(x^2)/2$, calcule $\sum 1/(2k+1)^2 = \pi^2/8$ par une identité trigonométrique en $1/\sin^2$, d'où $L(1) = \pi^2/6$,
    la formule des compléments $L(1-x) = L(1) - \ln x \ln(1-x) - L(x)$ donnant $L(1/2)$, étudie le comportement en $-\infty$ et résout des équations différentielles dont $L$ est solution.
