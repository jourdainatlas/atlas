  nom: Solutions bornées de $y' + f(y) = h$ et homéomorphismes
  apercu: 'Le problème étudie l''opérateur non linéaire $L_f : \varphi \mapsto \varphi'' + f\circ\varphi$ de l''espace $BC^1$ des fonctions de classe $\mathcal{C}^1$ bornées à dérivée bornée vers l''espace
    $BC^0$ des fonctions continues bornées. Il traite d''abord le cas linéaire $y'' + ay = h$, montre que si $L_f$ est un homéomorphisme alors $f$ l''est aussi, puis prouve la réciproque lorsque $f$ a des
    taux d''accroissement compris entre deux constantes $m$ et $M$ strictement positives, grâce au théorème du point fixe de Banach. Un exemple, $\varphi'' + 2\varphi + \sin^2\varphi = h$, est étudié en
    détail, avec l''existence d''une solution bornée périodique attractive lorsque $h = \sin$.'
