  nom: Commutant d'une matrice ; inégalités sur les déterminants de matrices symétriques
  apercu: 'L''exercice détermine le commutant d''une matrice $A$ de taille 3 semblable à une matrice triangulaire $T$ et montre qu''il est réduit aux polynômes en $A$. Le problème établit, à partir de l''inégalité
