  nom: Valeurs singulières d'une matrice et inégalités de traces
  apercu: 'Le problème caractérise les matrices normales (diagonalisables en base orthonormée, adjointe polynôme en $A$, $A^* = AU$ avec $U$ unitaire commutant), construit la racine carrée d''une matrice
    hermitienne positive puis la décomposition en valeurs singulières. Il établit ensuite des inégalités de traces : principe de Ky Fan pour les projecteurs orthogonaux de rang $k$, maximum de $\sum A_{ij}
    \alpha_i \beta_j$ sur les matrices bistochastiques, inégalité de von Neumann $|\operatorname{Tr}(AB)| \leqslant \sum \alpha_i \beta_i$, et enfin la distance minimale de Frobenius entre $A$ et les $U^*BU$,
    égale à la racine de $\sum (\alpha_i - \beta_i)^2$ (théorème de Hoffman-Wielandt).'
