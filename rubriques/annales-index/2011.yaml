  nom: 'Matrices symétriques positives : compacité, racine carrée, trace et inégalité de Kantorovich'
  apercu: Le problème étudie les matrices symétriques positives et définies positives. Il montre que l'ensemble des $x$ tels que $(s(x)|x) = 1$ est compact si et seulement si toutes les valeurs propres
    de $s$ sont strictement positives (dans les exemples plans, une ellipse puis, pour une matrice de valeurs propres $0$ et $6$, un couple de droites parallèles), construit et caractérise la racine carrée
    d'une matrice positive, l'exprime par un polynôme d'interpolation de Lagrange, caractérise les matrices positives par $\operatorname{tr}(SU) \leqslant \operatorname{tr}(S)$ pour toute $U$ orthogonale,
    et établit l'inégalité de Kantorovich $(s(x)|x)(s^{-1}(x)|x) \leqslant \frac{(\lambda_1+\lambda_n)^2}{4\lambda_1\lambda_n} \|x\|^4$ avec son cas d'égalité.
