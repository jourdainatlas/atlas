  nom: Développement eulérien de $\operatorname{sh}$ et une intégrale à paramètre
  apercu: Le sujet étudie la série de fonctions $U(x) = \sum 2x/(x^2 + n^2\pi^2)$, sa primitive $V = \sum \ln(1 + x^2/(n^2\pi^2))$ et le produit infini $p(x) = x \prod (1 + x^2/(k^2\pi^2))$. Grâce à la
    série de Fourier de la fonction $2\pi$-périodique égale à $\operatorname{ch}(xt/\pi)$ sur $\left]-\pi, \pi\right]$, il montre que $U(x) = \operatorname{ch} x/\operatorname{sh} x - 1/x$ puis $\operatorname{sh}
    x = x \prod (1 + x^2/(k^2\pi^2))$. Enfin il prouve que $f(x) = \int_0^{+\infty} \sin(tx)/(e^{\pi t} - 1) \,\mathrm{d}t$ est de classe $\mathcal{C}^\infty$ et l'exprime à l'aide de $U$ par un développement
    en série de l'intégrande.
