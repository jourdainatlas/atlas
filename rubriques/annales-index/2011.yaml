  nom: Sur le calcul des variations
  apercu: Le problème étudie le minimum de fonctionnelles intégrales $J(f) = \int (P(f) + Q(f'))$ sur des fonctions à bords fixés. Après la résolution de $y'''' + y'' + y = 0$ par diagonalisation de la
    matrice compagnon et un lemme de du Bois-Reymond, il établit la condition nécessaire d'Euler-Lagrange, l'illustre sur $\int f'^2$ (minimum atteint) et sur $\int (f'^2 + f'^3)$ (pas de minimum), puis
    montre que $J(f) = \int_0^{+\infty} (f^2 - f'^2 + f''^2)$ atteint son minimum en les multiples de $\psi(t) = e^{-t/2} \sin(\sqrt{3}\, t/2 - \pi/3)$, et en déduit l'inégalité de Hardy-Littlewood $\|f'\|^2
    \leqslant 2 \|f\| \|f''\|$ avec ses cas d'égalité.
  pages: 5
