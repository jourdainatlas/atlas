  nom: Matrices, réversibilité, entropie et hypocoercivité
  apercu: Le sujet étudie le système différentiel $U' = AU$ et montre, via la trigonalisation de Schur et un lemme de Grönwall, qu'il est « irréversible bien orienté » (toute solution tend vers $0$) si
    et seulement si toutes les valeurs propres de $A$ sont de partie réelle strictement négative. Il construit alors une norme euclidienne strictement décroissante le long des trajectoires (entropie stricte)
    à partir du produit scalaire $\int \langle \exp(sA)U_1, \exp(sA)U_2 \rangle \,\mathrm{d}s$, puis étudie l'hypocoercivité, situation où la norme usuelle est une entropie non stricte, sur des exemples
    $A = S + K + \kappa N$ et du point de vue de la convexité et de la topologie des ensembles de matrices concernés.
