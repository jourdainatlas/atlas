  nom: Oscillations linéaires et un théorème ergodique
  apercu: Le sujet résout le système $Ax'' = -Kx$, avec $A$ et $K$ symétriques définies positives, en diagonalisant $A^{-1}K$, autoadjoint pour le produit scalaire $(Ax|y)$, et montre la conservation de
