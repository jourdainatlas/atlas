  nom: Matrices infiniment divisibles
  apercu: Le sujet étudie les matrices symétriques à coefficients positifs dont toutes les puissances de Hadamard réelles $A^{*r} = (a_{ij}^r)$ sont positives. Après la formule de Gauss pour la fonction
    $\Gamma$ et le théorème de Schur sur le produit de Hadamard de deux matrices positives, il montre que les matrices de Cauchy $(1/(\lambda_i+\lambda_j))$ et $(\Gamma(\lambda_i+\lambda_j+1)/(\Gamma(\lambda_i+1)\Gamma(\lambda_j+1)))$
    sont infiniment divisibles, puis relie cette propriété à la positivité conditionnelle de la matrice des logarithmes, ce qui donne l'infinie divisibilité de $(\exp(-|z_i-z_j|^2))$ et $(\exp(-|z_i-z_j|))$.
