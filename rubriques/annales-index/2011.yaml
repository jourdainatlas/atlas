  nom: Applications lipschitziennes entre espaces normés, théorèmes de Mazur-Ulam et de Figiel
  apercu: Le problème étudie les applications lipschitziennes et les isométries non linéaires entre espaces normés. Après des préliminaires (prolongement, régularisation par convolution gaussienne), il
    montre qu'une isométrie à valeurs dans un préhilbertien fixant $0$ est linéaire, établit le théorème de Hahn-Banach dans un espace normé séparable et un résultat d'extraction diagonale dans le dual,
    prouve à l'aide du lemme de Baire que les points de différentiabilité d'une fonction convexe sur $\mathbb{R}^n$ forment une partie dense, puis démontre le théorème de Figiel et celui de Mazur-Ulam ;
    il conclut que si un Banach séparable $X$ se plonge isométriquement dans un Banach $Y$, alors $Y$ contient un sous-espace fermé linéairement isométrique à $X$ (Godefroy-Kalton).
