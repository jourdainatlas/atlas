  nom: Réduction d'une matrice tridiagonale (matrice de Kac)
  apercu: Le sujet étudie la matrice tridiagonale $A$ de taille $n+1$, de sous-diagonale $n, n-1, \ldots, 1$ et de sur-diagonale $1, 2, \ldots, n$, à diagonale nulle. Après des questions de cours sur la
    similitude, il traite le cas $n = 2$ (matrice ${}^t\!A\,A$, quadrique associée, puissances et exponentielle via un polynôme annulateur) et le cas $n = 3$ (base cyclique, système différentiel), puis
    montre que $A$ est diagonalisable de valeurs propres $n, n-2, \ldots, -n$ en l'identifiant à l'endomorphisme $Q \mapsto nXQ - (X^2-1)Q'$ de $\mathbb{R}_n[X]$ et à la dérivation sur l'espace engendré
    par les $\operatorname{ch}^{n-k} \operatorname{sh}^k$.
