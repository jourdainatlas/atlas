  nom: Critère de diagonalisation de Klarès
  apercu: 'Le problème établit la décomposition de Dunford d''une matrice complexe $A$ à partir des sous-espaces caractéristiques, puis montre que $A$ est diagonalisable si et seulement si l''endomorphisme
    $\operatorname{comm}_A : X \mapsto AX - XA$ de $\mathcal{M}_n(\mathbb{C})$ l''est, en décrivant la décomposition de Dunford de $\operatorname{comm}_A$. Après une étude de l''orthogonal relativement
    à une forme bilinéaire symétrique non dégénérée, il démontre le critère de Klarès : $A$ est diagonalisable si et seulement si $\operatorname{Ker}(\operatorname{comm}_A) = \operatorname{Ker}(\operatorname{comm}_A^2)$.'
