  nom: Représentation connaissant les distances mutuelles
  apercu: 'Le problème étudie le positionnement multidimensionnel : à partir de la matrice $M$ des carrés des distances mutuelles de $n$ points centrés, la relation de Torgerson ${}^t\!U U = -\Phi(M)/2$,
    où $\Phi(M) = PMP$ est le centrage, permet de retrouver les produits scalaires, et une matrice symétrique à diagonale nulle est une matrice de distances au carré si et seulement si $\Phi(M)$ a ses valeurs
    propres négatives ou nulles. Il traite l''exemple de quatre points $AB = BC = CD = DA = 1$, $AC = a$, $BD = b$ (condition $a^2 + b^2 \leqslant 4$), puis trois façons de corriger une matrice qui n''est
    pas de distances : projection sur le cône $\mathcal{S}_n^+$ par moindres carrés, décalage des carrés des distances, et constante additive de Cailliez obtenue comme valeur propre d''une matrice de taille
    $2n$.'
  pages: 4
