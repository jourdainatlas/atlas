  nom: Spectre du laplacien normalisé d'un graphe
  apercu: Le problème étudie le laplacien normalisé $L$ d'un graphe sans sommet isolé, de coefficients $1$ sur la diagonale et $-1/\sqrt{d_i d_j}$ pour deux sommets voisins, et les informations combinatoires
    portées par ses valeurs propres $\lambda_1 \leqslant \dots \leqslant \lambda_n$. Il calcule le spectre pour un graphe à trois sommets, le graphe complet et le graphe cyclique (via les matrices circulantes),
    montre que $\lambda_1 = 0$, que le graphe est connexe si et seulement si $\lambda_2 > 0$, établit le principe du minimax, caractérise $\lambda_2 = n/(n-1)$ (graphe complet) et $\lambda_n = 2$ (graphe
    biparti), et minore le nombre chromatique par $\chi(G) \geqslant 1 + 1/(\lambda_n - 1)$.
