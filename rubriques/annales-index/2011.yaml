  nom: Limite d'intégrales oscillantes et sommes de séries trigonométriques
  apercu: 'La première partie calcule des sommes de séries : la série alternée de terme $(-1)^{k-1}/k$ par continuité de la somme d''une série entière au bord, la série des $\cos(2k\pi/3)/k$, puis les séries
    des $\cos(k\alpha)/k$ et $\sin(k\alpha)/k$ à l''aide du noyau $\varphi(t) = 1/(e^{it} - 1)$. La seconde étudie la limite quand $x$ tend vers $+\infty$ de $\int f(t) g(xt) \,\mathrm{d}t$ : lemme de Riemann-Lebesgue
    pour $g(t) = e^{it}$, calcul explicite pour $f(t) = e^{-t}$, puis, grâce au développement en série de Fourier de $|\sin t|$, convergence vers $(2/\pi)$ fois l''intégrale de $f$, d''abord pour $f$ de
    classe $\mathcal{C}^1$ puis pour $f$ en escalier et continue par morceaux.'
