  nom: Similitude entière des matrices
  apercu: Le problème étudie la similitude des matrices à coefficients entiers par des matrices de $\mathrm{GL}_n(\mathbb{Z})$. Après des préliminaires sur la similitude sur un corps (matrices compagnons,
    diagonalisabilité, critère de similitude des matrices triangulaires par blocs par l'équation $B = AY - YA'$), il montre qu'il n'y a qu'un nombre fini de classes de similitude entière de polynôme caractéristique
    $X^2 - \delta$ par un argument de réduction, que la diagonalisabilité se conserve modulo $p$ pour presque tout $p$, et qu'il y a une infinité de classes dès que le polynôme a une racine multiple. Il
    établit enfin, via la finitude du nombre de classes d'idéaux de $\mathbb{Z}[\alpha]$ et la correspondance entre classes de matrices et classes d'idéaux (théorème de Latimer-MacDuffee), que les matrices
    entières diagonalisables sur $\mathbb{C}$ de polynôme caractéristique donné forment un nombre fini de classes de similitude entière.
