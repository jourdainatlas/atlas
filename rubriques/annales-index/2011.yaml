  nom: Diffusion sur des ensembles finis
  apercu: Le sujet étudie le système différentiel $u' = (P - \mathrm{Id})u$ associé à une matrice $P$ symétrique, bistochastique et irréductible, et sa convergence vers le vecteur uniforme. La constante
    de Poincaré (trou spectral de $\mathrm{Id} - P$) donne la décroissance exponentielle de l'énergie $\|u(t) - \pi\|^2$, la constante de Sobolev logarithmique celle de l'entropie $H(u) = \sum u_i \ln u_i
    / N$, reliée à la variation totale par une inégalité de type Pinsker ; l'exemple de l'hypercube $(\mathbb{Z}/2\mathbb{Z})^d$ est traité par transformée de Fourier (Walsh) et donne la constante de Poincaré
    $2/d$.
