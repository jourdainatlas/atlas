  nom: Fonctions test et distributions sur $\mathcal{D}$
  apercu: 'Le sujet construit la fonction plateau $\varphi(x) = \exp(-x^2/(1-x^2))$ sur $\left]-1, 1\right[$, en déduit une suite régularisante $\rho_n$ et étudie les régularisées par convolution de l''indicatrice
    de $[-1, 1]$, puis introduit l''espace $\mathcal{S}$ des fonctions à décroissance rapide. Il définit ensuite les distributions sur $\mathcal{D}$, les distributions régulières, la masse de Dirac et la
    dérivation au sens des distributions, établit la formule des sauts $T_f'' = T_{f''} + \sum \sigma(a_i) \delta_{a_i}$ et étudie la convergence de suites de distributions : dérivées des $T_{U_n}$, qui
    tendent vers $\delta_0$, puis suites associées à $n/(1 + n^2x^2)$, à $nx^n$ sur $[0, 1]$ et à $n^2 \sin(nx)$ sur $[-\pi/n, \pi/n]$.'
  pages: 3
  blocs:
  - nom: Partie I — Étude de nouveaux espaces fonctionnels
    pages:
    - 1
