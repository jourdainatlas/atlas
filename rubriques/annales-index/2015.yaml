  nom: Processus de Galton-Watson
  apercu: 'Le sujet étudie d''abord la suite u_(n+1) = f(u_n), u_0 = 0, pour f convexe croissante avec f(1) = 1 : convergence vers le plus petit point fixe et vitesse (1 − u_n ∼ 2/(f″(1)n) si m = f′(1)
    = 1, 1 − u_n ∼ c mⁿ si m < 1). Il établit la formule de Wald G_S = G_T ∘ G_X pour une somme d''un nombre aléatoire de variables, puis l''applique au processus de Galton-Watson : probabilité d''extinction,
    temps d''extinction en cas sous-critique, loi de la taille totale Z de la lignée (G_Z(s) = s f(G_Z(s))), exemple explicite avec la loi géométrique p_k = 1/2^(k+1), et, en cas surcritique, dichotomie
    extinction ou divergence vers l''infini.'
