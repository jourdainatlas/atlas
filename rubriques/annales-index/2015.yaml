  nom: Matrice de Kac, fonctions $\operatorname{Arctan}$, endomorphismes symétriques et antisymétriques, nombres de Fibonacci
  apercu: Le sujet comporte quatre exercices indépendants. Le premier étudie la matrice tridiagonale $A_n$ (matrice de Kac) en la reconnaissant comme matrice de l'endomorphisme $P \mapsto (n-1)XP + (1-X^2)P'$
    dont les polynômes $(X-1)^h(X+1)^{n-1-h}$ sont vecteurs propres, et calcule le commutant de $A_4$. Le deuxième part du développement en série entière d'$\operatorname{Arctan}$ pour étudier $H(x) = \int
    \operatorname{Arctan}(t)/t \,\mathrm{d}t$ et $\varphi(x) = \int \operatorname{Arctan}(tx)/(t(t^2+1)) \,\mathrm{d}t$, puis en déduit l'intégrale de $\ln(\sin \theta)$ sur $[0, \pi/2]$. Le troisième décompose
    $\mathcal{L}(E)$ en endomorphismes symétriques et antisymétriques de l'espace euclidien de dimension 3 ; le quatrième calcule les nombres de Fibonacci en Python (récurrence, doublement d'indice, puissances
    de matrice) et étudie une série alternée et la série génératrice.
