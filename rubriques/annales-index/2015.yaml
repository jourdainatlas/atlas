  nom: Développement en série entière de la tangente et polynômes de Bernoulli
  apercu: Le sujet exprime les dérivées successives de $\tan$ sous la forme $\tan^{(n)}(x) = T_n(\tan x)$ avec des polynômes $T_n$ à coefficients entiers naturels, puis montre, par un contrôle du reste
    intégral de Taylor valable pour les fonctions impaires à dérivées positives (théorème de Bernstein), que $\tan$ est développable en série entière sur $\left]-\pi/2, \pi/2\right[$. Il construit ensuite
    les polynômes de Bernoulli $S_k$ ($S_0 = 1$, $S'_{k+1} = (k+1)S_k$, intégrale nulle sur $[0, 1]$) à l'aide de l'endomorphisme $P \mapsto \int_x^{x+1} P$, en déduit les nombres de Bernoulli $\sigma_k$
    et leur relation de récurrence, et relie enfin les coefficients du développement de $\tan$ aux $\sigma_n$ par la série génératrice $z/(e^z - 1)$.
  pages: 5
