  nom: Autour des sommes d'Euler
  apercu: Le sujet étudie les sommes Sr = Σ Hn/(n+1)^r, où Hn est la somme harmonique, pour obtenir la relation d'Euler 2Sr = rζ(r+1) - Σ_{k=1}^{r-2} ζ(k+1)ζ(r-k) pour r ≥ 3. Il les représente d'abord par
    des intégrales sur ]0, 1[ (ce qui donne S2 en fonction de ζ(3)), établit la relation β(x, y) = Γ(x)Γ(y)/Γ(x+y), étudie la fonction digamma ψ (série de fonctions, développement en série entière faisant
    intervenir les ζ(n+1)), puis exprime Sr à l'aide des dérivées de ∂²β/∂y²(x, 1).
