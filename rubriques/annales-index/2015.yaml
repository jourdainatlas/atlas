  nom: Entrelacement des valeurs propres et théorème de Schur-Horn
  apercu: Le sujet caractérise les $n$-uplets entrelacés avec $n + 1$ réels ordonnés à l'aide de la décomposition $P = (X - a)Q_0 - \sum \alpha_j Q_0/(X - \mu_j)$ à coefficients $\alpha_j$ positifs, puis,
    par le complément de Schur, montre que le spectre d'une matrice symétrique et celui de sa sous-matrice principale d'ordre $n$ sont entrelacés, et que tout $n$-uplet entrelacé est atteint (théorème d'entrelacement
    de Cauchy et sa réciproque). Il établit ensuite les inégalités de Schur $m_{11} + \cdots + m_{ss} \leqslant \lambda_1 + \cdots + \lambda_s$ pour la diagonale d'une matrice symétrique et décrit, pour
    $n = 3$ et $M$ de trace nulle à valeurs propres distinctes, l'ensemble des diagonales des matrices orthogonalement semblables à $M$ comme un hexagone (cas du théorème de Schur-Horn).
