- sujet: https://www.ens.psl.eu/IMG/file/concours/2015/PC/sujets/sujet_pc_math2015.pdf
  nom: Spectre de la somme de deux matrices symétriques
  apercu: 'Le sujet étudie l''application s↓ qui associe à une matrice symétrique réelle son spectre ordonné : par la caractérisation min-max de Courant-Fischer, il montre qu''elle est 1-lipschitzienne
    pour la norme d''opérateur, donc continue, et de classe C¹ sur l''ouvert des matrices à valeurs propres simples en dimension 2. Il établit ensuite des inégalités sur le spectre c d''une somme C = A
    + B (inégalités de Weyl c(j+k−1) ≤ aj + bk, inégalité de Schur sur la diagonale, inégalité de Ky Fan sur les sommes partielles) et décrit complètement, pour n = 2, l''ensemble des spectres possibles
    de A + B à spectres de A et B fixés : c''est un segment.'
