  nom: Formes quadratiques binaires entières et représentation des entiers
  apercu: 'Le sujet étudie les formes quadratiques binaires définies positives $q = [a, b, c]$ à coefficients entiers de discriminant $4ac - b^2 = d$, à équivalence propre près sous $\mathrm{SL}_2(\mathbb{Z})$
    : réduction de Gauss, finitude du nombre de classes, calcul pour $d = 20$, groupe $\mathrm{SO}(q, \mathbb{Z}) \cong \mathbb{Z}/2\mathbb{Z}$. Il relie le nombre de représentations primitives d''un entier
    $m$ par les formes de discriminant $d$ au nombre de racines carrées de $-d$ modulo $4m$, compte ces racines à l''aide du symbole de Legendre et du lemme chinois, puis, pour $d = 20$, démontre la loi
    de réciprocité $\left(\frac{5}{p}\right) = \left(\frac{p}{5}\right)$ par une action de $\mathbb{Z}/p\mathbb{Z}$ sur une quadrique de $\mathbb{F}_5^p$ et caractérise les nombres premiers de la forme
    $x^2 + 5y^2$ ou $2x^2 + 2xy + 3y^2$.'
