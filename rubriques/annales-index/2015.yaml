  nom: Formule de Bernstein et loi de Poisson ; matrices à coefficients $\pm 1$ et matrices de Hadamard
  apercu: 'Le premier problème étudie la suite de fonctions $f_n(t) = e^{-t} t^n / n!$ (convergence uniforme vers $0$, intégrales à paramètre, convergence de la série) puis interprète $e^{-n} \sum_{k \leqslant
