  nom: 'La fonction Gamma : formules de Gauss, Stirling, Weierstrass et approche probabiliste'
  apercu: 'Le sujet établit les propriétés classiques de la fonction Γ : constante d''Euler γ, formule de Gauss Γ(s) = lim n! n^s/(s(s+1)…(s+n)), développement de ln Γ et de Γ''/Γ en série, puis la formule
    de Stirling Γ(s+1) ~ √(2πs) s^s e^(-s). Il développe la théorie des produits infinis (convergence uniforme de produits de fonctions), en déduit le produit eulérien de sin t / t, la formule des compléments
    Γ(s)Γ(1-s) = π/sin(πs) et le produit de Weierstrass de 1/Γ. Enfin, à l''aide de variables de loi Gamma et de variables exponentielles indépendantes, il montre que ln Xt a même loi qu''une série de variables
    et en déduit la formule de duplication 2^(2s-1) Γ(s)Γ(s+1/2) = Γ(2s)Γ(1/2).'
