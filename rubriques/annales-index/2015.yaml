- sujet: https://www.ens.psl.eu/IMG/file/concours/2015/MPI/sujets/sujet_mpi_mathd2015.pdf
  nom: Répartition d'ensembles d'entiers dans les progressions arithmétiques
  apercu: 'Le sujet étudie la discrépance d''une partie de $\{1, \dots, N\}$ relativement aux progressions arithmétiques : une moyenne sur toutes les parties montre qu''on peut la rendre inférieure à $C
    N^{2/3}$, tandis qu''un argument de Fourier (Parseval, convolution, principe des tiroirs de Dirichlet) montre qu''elle est toujours au moins de l''ordre de $N^{1/4}$. Il introduit ensuite la fonction
    de Buchstab $\omega$, définie par une équation intégrale à retard, montre qu''elle a une limite $L$ autour de laquelle elle oscille, et l''utilise, avec le théorème des nombres premiers admis, pour
    estimer le nombre $\Phi(x, y)$ d''entiers sans facteur premier inférieur à $y$. La dernière partie applique la méthode matricielle de Maier pour montrer une irrégularité de la répartition des nombres
    premiers dans les petits intervalles ou dans les progressions arithmétiques.'
  pages: 8
