- sujet: documents/annales/2015/mines-ponts/Maths-PC-2.pdf
  nom: Suites de Lucas
  apercu: 'À partir des matrices $R(\lambda) = J + (\lambda + 1/2)I$, où $J$ est une matrice de taille 2 non multiple de $I$ vérifiant $J^2 = (5/4)I$, le sujet exploite la « formule de Moivre » admise $R(\lambda)^n
    = F_n(\lambda)J + (1/2)L_n(\lambda)I$, qui exprime les puissances à l''aide des suites de Fibonacci et de Lucas généralisées : il établit la relation $R(\lambda)^2 = (1 + 2\lambda)R(\lambda) + (1 -
    \lambda - \lambda^2)I$, calcule $R(\lambda)^{-1}$ et étend la formule aux exposants négatifs. Il en déduit des identités remarquables (sommes, suite géométrique de déterminants, valeurs de $F$ et $L$
    en $L_{k-1}/L_k$) et termine en construisant une loi de probabilité à partir des nombres de Lucas.'
