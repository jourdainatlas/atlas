  nom: Équation de Schrödinger non linéaire et flot binormal des courbes
  apercu: Le sujet étudie une équation différentielle non linéaire complexe $(E_\alpha)$ dont les solutions, par un changement d'échelle autosimilaire, fournissent des solutions d'une équation de type Schrödinger
    non linéaire $(F_\alpha)$ ; il établit une intégrale première, des bornes et le comportement asymptotique de $|f|$. Il calcule ensuite l'exponentielle d'une matrice antisymétrique (une rotation) puis
    étudie une courbe $G$ solution de $G'' = \frac{1}{2}((I_3 + M)G) \wedge G'$ à l'aide du repère de Frenet, et relie sa courbure et sa torsion à une solution de $(F_\alpha)$ par la transformation de Hasimoto.
