  nom: Développements asymptotiques d'intégrales, série divergente, polynômes trigonométriques et flot linéaire sur le tore
  apercu: 'La première partie établit un lemme de type Watson donnant le développement asymptotique de F(x) = ∫ e^(-t/x) f(t) dt quand x → 0+, puis l''applique, après le changement de variable par φ(s)
    = s - ln(1+s), pour obtenir Γ(y) = e^(-y) y^y (2π/y)^(1/2) (1 + 1/(12y) + o(1/y)). La deuxième partie montre qu''une série divergente fournit une bonne approximation de F(x) = ∫_1^∞ e^(-t/x) t^(-1)
    dt, le reste étant de l''ordre du premier terme négligé. La troisième démontre la densité des polynômes trigonométriques en deux variables dans les fonctions continues périodiques, et la quatrième étudie
    un système différentiel sur le tore : pour ω non résonnant, la primitive F de f(ωt) est en o(t), puis un développement de la solution perturbée.'
