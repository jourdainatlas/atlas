- sujet: documents/annales/2015/mines-ponts/Maths-PC-1.pdf
  nom: Méthode de Stein
  apercu: Le sujet caractérise la loi de Poisson de paramètre λ par l'identité λ Σ f(n+1)pn = Σ n f(n)pn valable pour toute fonction bornée f, puis résout l'équation de Stein λf(n+1) − nf(n) = h(n) − Σ
    h(k)pk et montre que ses solutions sont bornées et que leurs accroissements sont majorés par (1 − e^(−λ))/λ fois l'oscillation de h. Il en déduit que la distance en variation totale entre la loi d'une
    somme S de variables de Bernoulli indépendantes de paramètres rk et la loi de Poisson de paramètre λ = Σ rk est majorée par ((1 − e^(−λ))/λ) Σ rk².
