  nom: Sous-espaces stables par un endomorphisme
  apercu: 'Le sujet étudie les sous-espaces stables par un endomorphisme : droites stables et vecteurs propres, caractérisation sur $\mathbb{C}$ des endomorphismes diagonalisables par l''existence de supplémentaires
    stables, et description des sous-espaces stables d''un endomorphisme diagonalisable comme sommes directes de $F \cap E_i$ (d''où $2^n$ sous-espaces stables quand les valeurs propres sont distinctes).
    Il détermine ensuite les sous-espaces stables par la dérivation sur $\mathbb{K}[X]$ et par un nilpotent d''indice $n$, montre qu''un endomorphisme réel admet une droite ou un plan stable et l''applique
    aux trajectoires rectilignes et planes d''un système différentiel, puis caractérise les hyperplans stables à l''aide de la transposée.'
