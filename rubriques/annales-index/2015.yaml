  nom: 'Matrices hermitiennes aléatoires : localisation du spectre et loi du demi-cercle'
  apercu: Le sujet étudie l'ensemble gaussien des matrices hermitiennes (mesure Pn proportionnelle à e^(-Tr M²) sur Hn(C)). À l'aide des polynômes d'Hermite, du noyau Kn(x, y) = Σ_{k<n} Hk(x)Hk(y)/(2^k
    k!) et de la formule d'intégration de Weyl, il exprime les statistiques des valeurs propres par des déterminants de Kn, montre que la probabilité d'avoir k valeurs propres dans un intervalle [a/√(2n),
    b/√(2n)] converge vers une quantité gouvernée par le noyau sinus sin(x - y)/(x - y), puis prouve, via la transformée de Stieltjes et les distributions, que la mesure spectrale moyenne de M/√n converge
    vers la loi du demi-cercle de densité √(2 - t²)/π sur [-√2, √2].
