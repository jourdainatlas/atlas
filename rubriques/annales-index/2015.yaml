  nom: Matrice de Kac, fonctions Arctan, endomorphismes symétriques et antisymétriques, nombres de Fibonacci
  apercu: Le sujet comporte quatre exercices indépendants. Le premier étudie la matrice tridiagonale An (matrice de Kac) en la reconnaissant comme matrice de l'endomorphisme P ↦ (n−1)XP + (1−X²)P' dont
    les polynômes (X−1)^h(X+1)^(n−1−h) sont vecteurs propres, et calcule le commutant de A4. Le deuxième part du développement en série entière d'Arctan pour étudier H(x) = ∫ Arctan(t)/t dt et φ(x) = ∫
    Arctan(tx)/(t(t²+1)) dt, puis en déduit l'intégrale de ln(sin θ) sur [0, π/2]. Le troisième décompose L(E) en endomorphismes symétriques et antisymétriques de l'espace euclidien de dimension 3 ; le
    quatrième calcule les nombres de Fibonacci en Python (récurrence, doublement d'indice, puissances de matrice) et étudie une série alternée et la série génératrice.
