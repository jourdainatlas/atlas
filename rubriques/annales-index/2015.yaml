- sujet: https://ens-paris-saclay.fr/sites/default/files/CONCOURS/ANNALES_1C/1C_PSI/2015_Sujet_1C_PSI_Maths.pdf
  nom: Équation de Schrödinger non linéaire et flot binormal des courbes
  apercu: Le sujet étudie une équation différentielle non linéaire complexe (Eα) dont les solutions, par un changement d'échelle autosimilaire, fournissent des solutions d'une équation de type Schrödinger
    non linéaire (Fα) ; il établit une intégrale première, des bornes et le comportement asymptotique de |f|. Il calcule ensuite l'exponentielle d'une matrice antisymétrique (une rotation) puis étudie une
    courbe G solution de G'' = (1/2)((I3 + M)G) ∧ G' à l'aide du repère de Frenet, et relie sa courbure et sa torsion à une solution de (Fα) par la transformation de Hasimoto.
