  nom: Formes quadratiques binaires entières et représentation des entiers
  apercu: 'Le sujet étudie les formes quadratiques binaires définies positives q = [a, b, c] à coefficients entiers de discriminant 4ac − b² = d, à équivalence propre près sous SL₂(Z) : réduction de Gauss,
