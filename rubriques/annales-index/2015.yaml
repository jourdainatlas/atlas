- sujet: https://www.vmaths.fr/wp-content/uploads/E3A/MP/E3A_2015_MP_Maths1_enonce.pdf
  nom: 'Quatre exercices : matrice $J + I$, matrices tridiagonales, intégrale de Dirichlet, canal binaire bruité'
  apercu: 'Le premier exercice étudie la matrice $A = I_n + J$ (des 2 sur la diagonale, des 1 ailleurs) : polynôme annulateur, inverse, diagonalisation en base orthonormée, dimension de l''espace des $U$
    tels que ${}^t\!U A = AU$, et réduction simultanée via le produit scalaire ${}^t\!X A Y$. Le deuxième montre qu''une matrice tridiagonale symétrique à coefficients sous-diagonaux non nuls a $n$ valeurs
    propres distinctes et que les racines de $P_{n+1}$ et $P_n$ s''entrelacent. Le troisième calcule, à partir de l''intégrale de Dirichlet, l''intégrale de $(1 - \cos \alpha t)/t^2$ et sa transformée de
    Fourier ; le quatrième modélise un canal binaire bruité (formule de Bayes, loi binomiale, décodage par vote majoritaire, probabilité d''erreur et programme Python).'
