  nom: Parcours du cavalier, diagonalisation aléatoire, intégrale à paramètre et matrices trigonalisables
  apercu: Le sujet comporte quatre exercices indépendants. Le premier fait écrire en Python une recherche par retour sur trace d'un parcours du cavalier sur l'échiquier, avec détection des situations bloquantes
    puis tri fusion des cases par nombre de coups possibles (heuristique de Warnsdorff). Le deuxième calcule la probabilité qu'une matrice 2x2 à coefficients aléatoires soit diagonalisable, à l'aide de
    fonctions génératrices ; le troisième étudie f(x) = ∫ dt/(t^x √(t² − 1)) sur [1, +∞[ (relation f(x+2) = x f(x)/(x+1), fonction xf(x)f(x+1) constante, équivalents en 0 et en +∞) ; le quatrième montre
    qu'un polynôme unitaire est scindé sur R si et seulement si |P(z)| ≥ |Im z|^deg P et en déduit que l'ensemble des matrices trigonalisables est fermé.
