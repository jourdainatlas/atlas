  nom: Méthode de Stein et théorème central limite quantitatif
  apercu: Le sujet étudie l'équation de Stein $\varphi'(x) - x\varphi(x) = f(x) - \langle f\rangle$, où $\langle f\rangle$ est l'intégrale de $f$ contre la gaussienne $G$, et majore sa solution bornée et
    ses dérivées en fonction de $\|f\|_\infty$ et $\|f'\|_\infty$. Il caractérise la convergence vers la loi normale par l'identité de Stein, puis en déduit pour $Z_n = (X_1 + \cdots + X_n)/\sqrt{n}$, avec
    des $X_i$ indépendantes, centrées, réduites et bornées, une vitesse en $1/\sqrt{n}$ pour $E(f(Z_n))$ et en $O(n^{-1/4})$ pour $P(Z_n < a)$. Une dernière partie établit des inégalités de concentration
    de type Hoeffding puis Bennett (fonction $\Phi(x) = (1 + x) \log(1 + x) - x$).
