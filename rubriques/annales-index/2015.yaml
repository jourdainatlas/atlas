  nom: Opérateur de Volterra et équations différentielles
  apercu: Le sujet étudie l'opérateur de Volterra $V(f)(x) = \int_0^x f$ et son adjoint $V^*$, montre que $V^* \circ V$ est symétrique défini positif sur $\mathcal{C}([0, \pi/2])$ et que ses valeurs propres
    sont les $1/(2n+1)^2$, avec pour vecteurs propres des cosinus. Il démontre le théorème de Weierstrass par les polynômes de Bernstein et l'inégalité de Bienaymé-Tchebychev, en déduit que la famille des
    $\cos(nt)$ est totale, développe $V^* \circ V(f)$ en série trigonométrique, puis résout le problème aux limites $y'' + \lambda y + h = 0$, $y(\pi/2) = 0$, $y'(0) = 0$, avec une alternative de Fredholm
    lorsque $\lambda = (2p+1)^2$.
