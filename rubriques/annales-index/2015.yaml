  nom: Inégalité triangulaire et point de Fermat ; suites monotones et convergence au sens de Cesàro
  apercu: 'Le premier problème généralise l''inégalité triangulaire dans $\mathbb{C}$ et son cas d''égalité, l''applique à la minimisation de la somme des distances $MA_1 + \dots + MA_n$ lorsque $\sum z_k/|z_k|
    = 0$ (minimum atteint uniquement en $O$), puis en déduit que le point de concours des droites $(AA'')$, $(BB'')$, $(CC'')$ construites à partir de triangles équilatéraux extérieurs minimise $MA + MB
    + MC$ (point de Fermat). Le second problème traite des suites monotones et de la série harmonique (équivalent $\ln n$, constante d''Euler), puis de la convergence au sens de Cesàro : lemme de Cesàro,
    équivalent d''une suite récurrente, contre-exemples $(-1)^n$ et $\sin(na)$, et théorème taubérien pour une suite croissante.'
