  nom: Systèmes différentiels linéaires X′ = A(t)X
  apercu: Le sujet étudie le système X′(t) = A(t)X(t). Il résout d'abord des exemples d'ordre 2 en exploitant des vecteurs propres communs à toutes les matrices A(t), ce qui ramène le système à des équations
    scalaires du premier ordre. Pour A constante, il montre à l'aide d'une norme subordonnée et de la formule de Taylor avec reste intégral que la solution est X(t) = Σ t^k A^k X_0 / k!, et calcule les
    puissances d'une matrice 4 × 4 par division euclidienne de X^k par le polynôme caractéristique. Il calcule enfin l'intégrale de Gauss, puis les intégrales u(t) et v(t) de e^(−x)cos(tx)/√x et e^(−x)sin(tx)/√x,
    solutions d'un système différentiel.
