- sujet: documents/annales/2015/mines-ponts/Maths-MP-2.pdf
  nom: Norme d'une matrice aléatoire
  apercu: 'Le sujet établit une inégalité de concentration pour la norme d''opérateur d''une matrice aléatoire de taille n à coefficients indépendants α-sous-gaussiens : P(‖M‖op ≥ 2r√n) ≤ (25 e^(−γr²))^n
    avec γ = 1/(4α²). Il étudie d''abord la norme d''opérateur (lien avec le spectre pour une matrice symétrique, comparaison avec la norme de Frobenius), puis les variables sous-gaussiennes (lemme de Hoeffding,
    borne de Chernoff, inégalité d''Orlicz), enfin les recouvrements de la sphère unité par des boules (ε-réseaux de cardinal au plus 5^n par un argument de volume).'
