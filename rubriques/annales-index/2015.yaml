  nom: Anneaux de matrices $xI + yB$, test de Lucas-Lehmer et classes de similitude de $\mathrm{GL}_2(\mathbb{F}_p)$
  apercu: 'Le sujet étudie l''anneau $\mathcal{A}_a$ des matrices $xI + yB$, où $B$ est la matrice de carré $aI$ : c''est un corps si et seulement si $a$ n''est pas un carré, et il est isomorphe à $k \times
    k$ si $a$ est un carré non nul en caractéristique différente de 2. Sur $\mathbb{F}_p$, il exploite le morphisme de Frobenius $M \mapsto M^p$ et la relation $M^{p+1} = \det(M) I$ pour démontrer le critère
    de primalité de Lucas-Lehmer : pour $q \geqslant 3$, $2^q - 1$ est premier si et seulement s''il divise $T_{q-2}$, où $T_0 = 2$ et $T_{n+1} = 2T_n^2 - 1$. La dernière partie dénombre les classes de
    similitude de $\mathrm{GL}_2(\mathbb{F}_p)$ et leurs cardinaux à l''aide de l''extension quadratique $\mathcal{A}_a$.'
