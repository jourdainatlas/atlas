- sujet: https://www.vmaths.fr/wp-content/uploads/E3A/PSI/E3A_2015_PSI_Maths2_enonce.pdf
  nom: Meilleure approximation d'un endomorphisme symétrique par un endomorphisme positif de rang au plus 1
  apercu: 'Le sujet munit l''espace $S(E)$ des endomorphismes symétriques du produit scalaire $(f, g) \mapsto \operatorname{Tr}(f \circ g)$ et montre que les endomorphismes symétriques positifs de rang
    au plus 1 sont exactement les $u_a : x \mapsto (x|a)a$. Pour $f$ symétrique fixé, il minimise $\Phi(x) = N(f - u_x)^2$ : le minimum vaut $N(f)^2$, atteint seulement en $0$, quand la plus grande valeur
    propre $\lambda_p$ est négative ou nulle, et la somme des carrés des $p - 1$ plus petites valeurs propres quand $\lambda_p > 0$, atteint exactement pour les vecteurs propres associés à $\lambda_p$ de
    norme $\sqrt{\lambda_p}$. Il applique ce résultat à une matrice symétrique stochastique, à la matrice $B$ dont tous les coefficients valent 1 et à la matrice $C = B - I$ (zéros sur la diagonale, 1 ailleurs).'
  pages: 3
