  nom: Problème de Dirichlet sur le disque et polynômes harmoniques
  apercu: 'Le sujet étudie les polynômes harmoniques de deux variables, puis le noyau de Poisson $N(x, y, t) = (1 - |z|^2)/|z - e^{it}|^2$, dont il montre l''harmonicité et la moyenne égale à $1$. Il résout
    le problème de Dirichlet sur le disque unité : l''intégrale de Poisson d''une donnée continue au bord fournit une solution continue sur le disque fermé, et le principe du maximum en donne l''unicité.
    Il en déduit que, pour une donnée polynomiale de degré au plus $m$, la solution est la restriction d''un polynôme harmonique de degré au plus $m$, décompose tout polynôme sous la forme $H + (1 - x^2
    - y^2)Q$ et calcule la dimension des polynômes harmoniques de degré au plus $m$, dans $\mathbb{R}^2$ puis dans $\mathbb{R}^n$.'
