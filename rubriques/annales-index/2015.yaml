  nom: 'La fonction Gamma : formules de Gauss, Stirling, Weierstrass et approche probabiliste'
  apercu: 'Le sujet établit les propriétés classiques de la fonction $\Gamma$ : constante d''Euler $\gamma$, formule de Gauss $\Gamma(s) = \lim n!\, n^s/(s(s+1)\cdots(s+n))$, développement de $\ln \Gamma$
    et de $\Gamma''/\Gamma$ en série, puis la formule de Stirling $\Gamma(s+1) \sim \sqrt{2\pi s}\, s^s e^{-s}$. Il développe la théorie des produits infinis (convergence uniforme de produits de fonctions),
    en déduit le produit eulérien de $\sin t / t$, la formule des compléments $\Gamma(s)\Gamma(1-s) = \pi/\sin(\pi s)$ et le produit de Weierstrass de $1/\Gamma$. Enfin, à l''aide de variables de loi Gamma
    et de variables exponentielles indépendantes, il montre que $\ln X_t$ a même loi qu''une série de variables et en déduit la formule de duplication $2^{2s-1} \Gamma(s)\Gamma(s+1/2) = \Gamma(2s)\Gamma(1/2)$.'
  pages: 7
