  nom: 'Matrices hermitiennes aléatoires : localisation du spectre et loi du demi-cercle'
  apercu: Le sujet étudie l'ensemble gaussien des matrices hermitiennes (mesure $P_n$ proportionnelle à $e^{-\operatorname{Tr} M^2}$ sur $\mathcal{H}_n(\mathbb{C})$). À l'aide des polynômes d'Hermite, du
    noyau $K_n(x, y) = \sum_{k<n} H_k(x)H_k(y)/(2^k k!)$ et de la formule d'intégration de Weyl, il exprime les statistiques des valeurs propres par des déterminants de $K_n$, montre que la probabilité
    d'avoir $k$ valeurs propres dans un intervalle $[a/\sqrt{2n}, b/\sqrt{2n}]$ converge vers une quantité gouvernée par le noyau sinus $\sin(x - y)/(x - y)$, puis prouve, via la transformée de Stieltjes
    et les distributions, que la mesure spectrale moyenne de $M/\sqrt{n}$ converge vers la loi du demi-cercle de densité $\sqrt{2 - t^2}/\pi$ sur $[-\sqrt{2}, \sqrt{2}]$.
  pages: 12
