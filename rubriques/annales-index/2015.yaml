  nom: Parcours du cavalier, diagonalisation aléatoire, intégrale à paramètre et matrices trigonalisables
  apercu: Le sujet comporte quatre exercices indépendants. Le premier fait écrire en Python une recherche par retour sur trace d'un parcours du cavalier sur l'échiquier, avec détection des situations bloquantes
    puis tri fusion des cases par nombre de coups possibles (heuristique de Warnsdorff). Le deuxième calcule la probabilité qu'une matrice $2\times 2$ à coefficients aléatoires soit diagonalisable, à l'aide
    de fonctions génératrices ; le troisième étudie $f(x) = \int \mathrm{d}t/(t^x \sqrt{t^2 - 1})$ sur $\left[1, +\infty\right[$ (relation $f(x+2) = x f(x)/(x+1)$, fonction $xf(x)f(x+1)$ constante, équivalents
    en $0$ et en $+\infty$) ; le quatrième montre qu'un polynôme unitaire est scindé sur $\mathbb{R}$ si et seulement si $|P(z)| \geqslant |\operatorname{Im} z|^{\deg P}$ et en déduit que l'ensemble des
    matrices trigonalisables est fermé.
