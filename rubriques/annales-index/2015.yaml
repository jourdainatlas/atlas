- sujet: documents/annales/2015/mines-ponts/Maths-PC-1.pdf
  nom: Méthode de Stein
  apercu: Le sujet caractérise la loi de Poisson de paramètre $\lambda$ par l'identité $\lambda \sum f(n+1)p_n = \sum n f(n)p_n$ valable pour toute fonction bornée $f$, puis résout l'équation de Stein $\lambda
    f(n+1) - nf(n) = h(n) - \sum h(k)p_k$ et montre que ses solutions sont bornées et que leurs accroissements sont majorés par $(1 - e^{-\lambda})/\lambda$ fois l'oscillation de $h$. Il en déduit que la
    distance en variation totale entre la loi d'une somme $S$ de variables de Bernoulli indépendantes de paramètres $r_k$ et la loi de Poisson de paramètre $\lambda = \sum r_k$ est majorée par $((1 - e^{-\lambda})/\lambda)
    \sum r_k^2$.
