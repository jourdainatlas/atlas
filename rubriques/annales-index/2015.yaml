- sujet: documents/annales/2015/mines-ponts/Maths-PC-2.pdf
  nom: Suites de Lucas
  apercu: 'À partir des matrices R(λ) = J + (λ + 1/2)I, où J est une matrice de taille 2 non multiple de I vérifiant J² = (5/4)I, le sujet exploite la « formule de Moivre » admise R(λ)^n = Fn(λ)J + (1/2)Ln(λ)I,
    qui exprime les puissances à l''aide des suites de Fibonacci et de Lucas généralisées : il établit la relation R(λ)² = (1 + 2λ)R(λ) + (1 − λ − λ²)I, calcule R(λ)^(−1) et étend la formule aux exposants
    négatifs. Il en déduit des identités remarquables (sommes, suite géométrique de déterminants, valeurs de F et L en L(k-1)/Lk) et termine en construisant une loi de probabilité à partir des nombres de
    Lucas.'
