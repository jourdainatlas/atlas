- sujet: https://www.concours-commun-inp.fr/_resource/annales%20%C3%A9crits/MP/2015/MP-Math1.pdf
  nom: Autour du théorème d'approximation de Weierstrass
  apercu: 'Deux exercices courts ouvrent le sujet : la fonction génératrice d''une loi de Poisson, puis une série de fonctions fn(x) = e^(−nx) − 2e^(−2nx) pour laquelle on ne peut pas intervertir somme
    et intégrale. Le problème explore le théorème de Weierstrass : exemples et contre-exemples (fonction 1/x, fermeture des polynômes de degré borné, dépendance de la limite vis-à-vis de la norme), application
    au problème des moments sur un segment et contre-exemple sur [0, +∞[, approximation uniforme de √x par une suite de polynômes via le théorème de Dini, et enfin démonstration probabiliste du théorème
    par les polynômes de Bernstein et l''inégalité de Bienaymé-Tchebychev.'
