- sujet: documents/annales/2015/mines-ponts/Maths-PSI-2.pdf
  nom: Matrices symplectiques
  apercu: Le sujet étudie le groupe symplectique Sp2n des matrices M de taille 2n vérifiant tM J M = J. Il en établit la structure de groupe stable par transposition, caractérise ses éléments par blocs,
    montre que son centre est réduit à {-I2n, I2n}, puis prouve que toute matrice symplectique est de déterminant 1, d'abord quand le bloc D est inversible, puis en général en trouvant un réel α tel que
    D - αB soit inversible.
