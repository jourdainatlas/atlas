  nom: Autour des sommes d'Euler
  apercu: Le sujet étudie les sommes $S_r = \sum H_n/(n+1)^r$, où $H_n$ est la somme harmonique, pour obtenir la relation d'Euler $2S_r = r\zeta(r+1) - \sum_{k=1}^{r-2} \zeta(k+1)\zeta(r-k)$ pour $r \geqslant
    3$. Il les représente d'abord par des intégrales sur $\left]0, 1\right[$ (ce qui donne $S_2$ en fonction de $\zeta(3)$), établit la relation $\beta(x, y) = \Gamma(x)\Gamma(y)/\Gamma(x+y)$, étudie la
    fonction digamma $\psi$ (série de fonctions, développement en série entière faisant intervenir les $\zeta(n+1)$), puis exprime $S_r$ à l'aide des dérivées de $\frac{\partial^2 \beta}{\partial y^2}(x,
    1)$.
