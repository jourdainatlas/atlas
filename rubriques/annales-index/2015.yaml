  nom: Chiffrement multiplicatif et chiffrement de Hill ; coefficients binomiaux et marche aléatoire sur un axe
  apercu: 'Le premier problème démontre les théorèmes de Bézout et de Gauss, les met en œuvre dans un chiffrement lettre à lettre ($y$ reste de $ex$ modulo $n$, clé de décodage obtenue par l''algorithme
    d''Euclide étendu programmé sur tableur), puis étudie le chiffrement de Hill par blocs de deux lettres à l''aide d''une matrice $2\times 2$ inversible modulo 26. Le second problème établit les propriétés
