  nom: Opérateur de Volterra et équations différentielles
  apercu: Le sujet étudie l'opérateur de Volterra V(f)(x) = ∫_0^x f et son adjoint V*, montre que V*∘V est symétrique défini positif sur C([0, π/2]) et que ses valeurs propres sont les 1/(2n+1)², avec pour
    vecteurs propres des cosinus. Il démontre le théorème de Weierstrass par les polynômes de Bernstein et l'inégalité de Bienaymé-Tchebychev, en déduit que la famille des cos(nt) est totale, développe
    V*∘V(f) en série trigonométrique, puis résout le problème aux limites y'' + λy + h = 0, y(π/2) = 0, y'(0) = 0, avec une alternative de Fredholm lorsque λ = (2p+1)².
