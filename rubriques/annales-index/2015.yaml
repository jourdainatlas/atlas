  nom: Écriture en base $b$ en Python ; projection orthogonale dans $\mathcal{M}_2(\mathbb{R})$ ; surjectivité de l'exponentielle de $\mathcal{M}_n(\mathbb{C})$ vers $\mathrm{GL}_n(\mathbb{R})$
  apercu: 'L''exercice d''informatique étudie en Python l''algorithme de décomposition d''un entier en base $b$ (terminaison, nombre d''itérations) et la somme des chiffres, en version itérative et récursive.
    Le deuxième exercice calcule la projection orthogonale d''une matrice sur les matrices triangulaires supérieures pour le produit scalaire $\operatorname{trace}({}^t\!A B)$. Le problème montre, pour
    une matrice réelle inversible $A$ d''ordre 3, l''existence de racines $p$-ièmes et d''un logarithme complexes : on interpole les coefficients de $A^n$ par des fonctions $\gamma(t)$ du type $t^k \rho^t
    e^{i\theta t}$ obtenues par division de $X^n$ par le polynôme caractéristique, on montre que $\gamma(x + y) = \gamma(x)\gamma(y)$, puis que $\exp(\gamma''(0)) = A$.'
