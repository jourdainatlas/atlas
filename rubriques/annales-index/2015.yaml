  nom: Inverse d'une série entière et nombres de Bernoulli
  apercu: Le sujet montre d'abord qu'une série entière de terme constant 1 et de rayon non nul admet un inverse développable en série entière au voisinage de $0$. Il l'applique à $f(z) = (e^z - 1)/z$ pour
    obtenir le développement de $g(z) = z/(e^z - 1) = \sum \gamma_n z^n$, dont les coefficients sont rationnels, vérifient une relation de récurrence et sont nuls aux rangs impairs $\geqslant 3$. Il étudie
    ensuite les séries $\sum a_n h^n$ avec $h(t) = 1 - e^t$, puis écrit $g(t) = \sum (1 - e^t)^k/(k+1)$ pour en déduire, grâce à la formule de Leibniz, une expression explicite de $\gamma_n$ sous forme
    de sommes doubles faisant intervenir les $j^n$.
  pages: 5
