  nom: 'Quatre exercices : fonction Gamma, maximum de tirages, forme quadratique sur la boule, matrice circulante'
  apercu: Le premier exercice calcule Γ(n + 1/2) puis l'intégrale H(x) = ∫₀^{+∞} cos(xt) exp(−t²) dt de deux façons, par série entière et par une équation différentielle. Le deuxième étudie le maximum Xₙ
    de k tirages indépendants uniformes sur ⟦1, n⟧, calcule son espérance et en donne un équivalent à l'aide de sommes de Riemann. Le troisième détermine le maximum n − 1 de la forme quadratique Σ_{i≠j}
