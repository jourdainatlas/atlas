    Le second développe la théorie des fonctions convexes d''une variable réelle : définition, inégalité de Jensen et inégalité arithmético-géométrique, inégalité des trois pentes, continuité et dérivées
    latérales, caractérisation des fonctions convexes dérivables, jusqu''à l''inégalité de Hölder.'
