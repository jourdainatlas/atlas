  nom: Exemples de contraintes symplectiques linéaires
  apercu: 'Le sujet introduit les formes symplectiques sur un espace de dimension finie (qui imposent une dimension paire) et le groupe symplectique $\mathrm{Sp}_{2m}(\mathbb{R})$ des matrices $M$ telles
    que $M^\top J M = J$. Il montre par deux méthodes que toute matrice symplectique est de déterminant $1$ : par la décomposition polaire et le commutant de $J$, puis en écrivant tout endomorphisme symplectique
    d''un espace de dimension $2m$ comme composée d''au plus $4m$ transvections symplectiques, ce qui donne aussi la connexité par arcs de $\mathrm{Sp}_{2m}(\mathbb{R})$. Il termine par le théorème de non-tassement
    linéaire : une boule de rayon $R$ s''envoie symplectiquement dans un cylindre de rayon $R''$ si et seulement si $R \leqslant R''$, alors qu''un endomorphisme de déterminant $1$ peut toujours envoyer
    la boule unité dans un cylindre arbitrairement fin.'
