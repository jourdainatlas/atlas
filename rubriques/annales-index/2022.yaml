  nom: Étude asymptotique du nombre de partitions d'un entier
  apercu: Le sujet introduit L(z) = Σ zⁿ/n sur le disque unité ouvert, montre que exp(L(z)) = 1/(1 − z), puis définit P(z) = exp(Σ L(zⁿ)) = Π 1/(1 − zⁿ). Une étude fine en variable réelle donne ln P(e^(−t))
    = π²/(6t) + ln(t)/2 − ln(2π)/2 + o(1) quand t tend vers 0⁺. Il prouve que P est la somme de la série entière Σ pₙzⁿ, où pₙ est le nombre de partitions de n, exprime pₙ par une intégrale sur un cercle
    et, en contrôlant P sur ce cercle, obtient pₙ = O(exp(π√(2n/3))/n).
  pages: 6
