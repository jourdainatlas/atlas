  nom: Déterminant de Vandermonde, exponentielle de matrices et produit de Hadamard
  apercu: Un premier exercice établit par récurrence la formule du déterminant de Vandermonde et l'applique au calcul de det(i^j) et à des sommes de puissances de nombres complexes distincts. Un second
    exercice définit l'exponentielle d'une matrice pour une norme d'algèbre, en prouve la continuité et la différentiabilité en 0. Le problème montre que l'exponentielle d'une matrice symétrique positive
    est symétrique positive, puis, grâce au produit de Hadamard et à la fermeture de l'ensemble des matrices symétriques positives, que la matrice des exponentielles des coefficients d'une telle matrice
    l'est aussi.
