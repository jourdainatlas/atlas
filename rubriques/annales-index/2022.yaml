  nom: Matrice de covariance et analyse en composantes principales
  apercu: Le sujet établit d'abord qu'une matrice réelle est orthodiagonalisable si et seulement si elle est symétrique, puis montre que le rayon spectral d'une matrice symétrique est le maximum de $|U^\top
    A U|$ sur la sphère unité et définit une norme sur les matrices symétriques. Il étudie ensuite la matrice de covariance d'un vecteur aléatoire discret (symétrique à valeurs propres positives, toute
    telle matrice étant une covariance, $Y - \mathbb{E}(Y)$ presque sûrement dans son image), et termine par la maximisation de la variance de $U^\top Y$ sur la sphère, principe de l'analyse en composantes
    principales.
