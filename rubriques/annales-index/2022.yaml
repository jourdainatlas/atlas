  nom: Fractions au cycle 4 et géométrie repérée en seconde
  apercu: 'Épreuve disciplinaire appliquée sur dossier. La première partie porte sur les fractions au collège : analyse d''erreurs d''élèves (dont $\frac{1}{2} + \frac{2}{5} = \frac{3}{7}$), justification
    de la règle $\frac{a}{b} \times \frac{c}{d} = \frac{ac}{bd}$ à partir de la définition du quotient, étude de La Disme de Stevin pour le passage à l''écriture à virgule, et résolution d''un problème
    d''âge moyen. La seconde porte sur la colinéarité et le déterminant de deux vecteurs en seconde : démonstration du critère de colinéarité, équation cartésienne de droite, utilité de la démonstration
    (paradoxe de Lewis Carroll, aiguilles dans un cube) et analyse de productions de groupes d''élèves.'
