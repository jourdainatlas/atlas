  nom: Autour des exponentielles de matrices
  apercu: 'Le sujet établit d''abord que exp(t(A+B)) = exp(tA)exp(tB) pour tout t réel si et seulement si A et B commutent, ainsi que det(exp A) = exp(tr A), puis démontre la formule de Trotter-Kato : (exp(A/k)exp(B/k))^k
    tend vers exp(A+B). Il introduit l''algèbre de Lie d''un sous-groupe fermé de GLn(R), montre qu''elle est un sous-espace vectoriel stable par le crochet de Lie, et l''identifie à l''espace tangent en
    In pour SLn(R) (matrices de trace nulle) et On(R) (matrices antisymétriques). Il étudie enfin le comportement de exp(tA) quand t tend vers l''infini à l''aide de la décomposition de Dunford, et caractérise
    les sous-espaces stable, instable et neutre du système X'' = AX.'
