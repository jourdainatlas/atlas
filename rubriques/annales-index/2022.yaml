  nom: Séries entières formelles, série réciproque et linéarisation
  apercu: 'Le sujet étudie l''algèbre des séries entières formelles munie du produit de Cauchy et de la composition, avec la relation de majoration terme à terme des modules, et montre que composée et série
    réciproque d''une série de rayon strictement positif ont encore un rayon strictement positif (méthode des séries majorantes). Il traite ensuite le problème de linéarisation : pour $f = \lambda z + F$
    avec $\lambda$ non racine de l''unité, il existe une unique série $h = z + H$ telle que $h^\dagger \circ f \circ h = \lambda z$ ; son rayon est strictement positif dans le cas hyperbolique $|\lambda|
    \neq 1$, et dans le cas elliptique $|\lambda| = 1$ un schéma itératif à convergence rapide minore le rayon de $h$ par une quantité $r_\infty$ dépendant de $\lambda$.'
  pages: 7
