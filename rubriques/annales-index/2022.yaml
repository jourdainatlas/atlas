  nom: Convergence des polynômes d'interpolation de Lagrange et phénomène de Runge
  apercu: 'Le sujet étudie les polynômes de Lagrange, qui forment une base orthonormée pour un produit scalaire discret, puis les polynômes de Tchebychev, dont il établit la propriété de minimalité : un
    polynôme unitaire de degré $n$ a une norme uniforme sur $[-1, 1]$ au moins égale à $1/2^{n-1}$. Il majore l''erreur d''interpolation d''une fonction de classe $\mathcal{C}^n$ et en déduit la convergence
    uniforme des polynômes interpolateurs pour l''exponentielle, pour $1/(1+x^2)$ sur un petit segment et pour une somme de série entière, avec un gain aux points de Tchebychev. Il montre enfin le phénomène
    de Runge : pour des points équirépartis, l''interpolation de $1/(\alpha^2+x^2)$ diverge en $x = 1$ quand $\alpha$ est petit.'
