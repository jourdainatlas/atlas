  nom: Formule asymptotique de Hardy et Ramanujan
  apercu: Le sujet introduit P(z) = exp(Σ L(zⁿ)) = Π 1/(1 − zⁿ) sur le disque unité et montre que c'est la série génératrice Σ pₙzⁿ du nombre pₙ de partitions de l'entier n, avec une formule intégrale pour
    pₙ. Après des majorations de |P(xe^{iθ})/P(x)|, des estimations de sommes par comparaison à des intégrales et un contrôle des fonctions caractéristiques (loi géométrique, variables centrées à moment
    d'ordre 4), il établit une convergence vers une gaussienne et en déduit l'équivalent pₙ ∼ exp(π√(2n/3))/(4n√3).
