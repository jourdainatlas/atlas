  nom: Étude asymptotique du nombre de partitions d'un entier
  apercu: Le sujet étudie le nombre p_n de partitions de l'entier n. Il définit sur le disque unité la fonction P(z) = exp(Σ L(z^n)), où L(z) = Σ z^n/n, l'écrit comme un produit infini des 1/(1 − z^k) et
    établit en variable réelle le développement ln P(e^(−t)) = π²/(6t) + ln(t)/2 − ln(2π)/2 + o(1) quand t tend vers 0⁺, grâce à une intégrale faisant intervenir la partie fractionnaire et à la formule
    de Stirling. Il montre ensuite que P est la somme de la série entière Σ p_n z^n, exprime p_n par une intégrale de Cauchy sur un cercle, et en déduit par une majoration fine que p_n = O(exp(π√(2n/3))/n),
    proche de l'équivalent de Hardy et Ramanujan.
