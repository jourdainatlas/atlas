  nom: Racines carrées de matrices, matrices unipotentes et représentations du groupe de Heisenberg
  apercu: 'Quatre exercices préparent le problème : dénombrement des classes de similitude des racines carrées de matrices complexes à l''aide de la réduction de Jordan, bijectivité de $U \mapsto U^2$ sur
    les matrices unipotentes en caractéristique différente de 2, construction des corps finis $\mathbb{F}_q$ comme points fixes du Frobenius, et caractérisation des $p$-groupes finis comme sous-groupes
    de matrices unipotentes de $\mathrm{GL}_r(\mathbb{F}_p)$. Le problème étudie le groupe de Heisenberg $\mathcal{H}_3(\mathbb{F})$ des matrices unipotentes triangulaires supérieures de taille 3, son centre,
    son groupe dérivé et ses caractères, l''algèbre de convolution $\mathbb{C}[G]$ et les représentations distinguées pour une involution d''un groupe d''ordre impair, puis classe les représentations irréductibles
    de $\mathcal{H}_3(\mathbb{F}_q)$ et montre que celles de $\mathcal{H}_3(\mathbb{F}_{q^2})$ distinguées par $\mathcal{H}_3(\mathbb{F}_q)$ sont en bijection avec les irréductibles de $\mathcal{H}_3(\mathbb{F}_q)$.'
  pages: 12
