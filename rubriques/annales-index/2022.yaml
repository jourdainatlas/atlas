  nom: Un opérateur intégral sur un espace préhilbertien et ses vecteurs propres polynomiaux
  apercu: 'Le sujet munit l''espace $E$ des fonctions continues $f$ sur $\mathbb{R}_+^*$ telles que $\int f(t)^2 \mathrm{e}^{-t}/t \,\mathrm{d}t$ converge du produit scalaire $\langle f|g\rangle = \int_0^{+\infty}
    f(t)g(t) \mathrm{e}^{-t}/t \,\mathrm{d}t$, puis étudie l''opérateur $U$ défini par $U(f)(x) = \langle k_x|f\rangle$ avec $k_x(t) = \mathrm{e}^{\min(x,t)} - 1$ : $U$ est un endomorphisme continu ($\|U(f)\|
    \leqslant 4\|f\|$), injectif et symétrique de $E$, et $U(f)$ est solution de $y'''' - y'' = -f(x)/x$. L''étude des solutions développables en série entière de $x(y'''' - y'') + py = 0$ fournit des solutions
    polynomiales exactement pour $p$ entier naturel non nul, les autres solutions développables n''étant pas dans $E$ ; on en déduit que les seules valeurs propres de $U$ à vecteur propre développable en
    série entière sont les $1/p$, de vecteurs propres polynomiaux $P_p(x) = x \mathrm{e}^x (x^{p-1}\mathrm{e}^{-x})^{(p)}$ deux à deux orthogonaux.'
  pages: 4
