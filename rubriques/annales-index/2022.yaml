  nom: Points fixes, matrices contractantes et méthode de la sécante
  apercu: Le sujet établit plusieurs théorèmes de point fixe (fonction continue sur un segment, application contractante sur un fermé de $\mathbb{R}^\ell$, fonction croissante de $[0, 1]$ dans lui-même),
    puis construit pour toute matrice $A$ de $\mathcal{M}_2(\mathbb{C})$ une norme adaptée $N$ vérifiant $N(Ax) \leqslant (\rho(A) + \eta)N(x)$, ce qui donne la convergence locale des itérations autour
    d'un point fixe attractif. Il étudie enfin la fonction de deux variables $H_f(x, y) = (xf(y) - yf(x))/(f(y) - f(x))$ et en déduit la convergence locale de la méthode de la sécante, d'ordre le nombre
    d'or $\varphi = (1 + \sqrt{5})/2$ dans le cas d'un polynôme du second degré.
