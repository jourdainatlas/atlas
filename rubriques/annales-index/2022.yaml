  nom: Un opérateur intégral sur un espace préhilbertien et ses vecteurs propres polynomiaux
  apercu: 'Le sujet munit l''espace E des fonctions continues f sur R+* telles que ∫ f(t)² e^{−t}/t dt converge du produit scalaire ⟨f|g⟩ = ∫₀^{+∞} f(t)g(t) e^{−t}/t dt, puis étudie l''opérateur U défini
    par U(f)(x) = ⟨k_x|f⟩ avec k_x(t) = e^{min(x,t)} − 1 : U est un endomorphisme continu (‖U(f)‖ ≤ 4‖f‖), injectif et symétrique de E, et U(f) est solution de y'''' − y'' = −f(x)/x. L''étude des solutions
    développables en série entière de x(y'''' − y'') + py = 0 fournit des solutions polynomiales exactement pour p entier naturel non nul, les autres solutions développables n''étant pas dans E ; on en
    déduit que les seules valeurs propres de U à vecteur propre développable en série entière sont les 1/p, de vecteurs propres polynomiaux P_p(x) = x eˣ (x^{p−1}e^{−x})^{(p)} deux à deux orthogonaux.'
