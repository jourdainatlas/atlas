  nom: Étude asymptotique du nombre de partitions d'un entier
  apercu: Le sujet introduit $L(z) = \sum z^n/n$ sur le disque unité ouvert, montre que $\exp(L(z)) = 1/(1 - z)$, puis définit $P(z) = \exp\left(\sum L(z^n)\right) = \prod 1/(1 - z^n)$. Une étude fine en
    variable réelle donne $\ln P(e^{-t}) = \pi^2/(6t) + \ln(t)/2 - \ln(2\pi)/2 + o(1)$ quand $t$ tend vers $0^+$. Il prouve que $P$ est la somme de la série entière $\sum p_n z^n$, où $p_n$ est le nombre
    de partitions de $n$, exprime $p_n$ par une intégrale sur un cercle et, en contrôlant $P$ sur ce cercle, obtient $p_n = O\left(\exp\left(\pi\sqrt{2n/3}\right)/n\right)$.
  pages: 6
