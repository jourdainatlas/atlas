  nom: Points rationnels de la quadrique $3x^2 + 3y^2 - z^2 = -1$
  apercu: 'Le sujet étudie les points rationnels de la nappe $H$ de la quadrique $3x^2 + 3y^2 - z^2 = -1$, munie de la forme bilinéaire de signature $(2, 1)$ qui en fait un modèle du plan hyperbolique :
    réflexions, distance hyperbolique avec $\operatorname{ch}(d(u, v)) = -B(u, v)$, groupe $\Gamma$ des isométries entières et domaine fondamental compact. Il compte les points de dénominateur fixé et de
    hauteur bornée (croissance linéaire en la coordonnée $z$, croissance exponentielle de $\Gamma(R)$), étudie l''équation $a^2 + b^2 \equiv 0 \mod d$ par des sommes exponentielles, et conclut via une projection
    stéréographique et un critère d''équidistribution que le nombre de points rationnels de hauteur au plus $h$ dans une boule hyperbolique est compris entre $h^{2-\varepsilon}$ et $h^{2+\varepsilon}$.'
