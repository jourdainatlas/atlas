  nom: 'Quatre exercices : fonction Gamma, maximum de tirages, forme quadratique sur la boule, matrice circulante'
  apercu: Le premier exercice calcule $\Gamma(n + 1/2)$ puis l'intégrale $H(x) = \int_0^{+\infty} \cos(xt) \exp(-t^2) \,\mathrm{d}t$ de deux façons, par série entière et par une équation différentielle.
    Le deuxième étudie le maximum $X_n$ de $k$ tirages indépendants uniformes sur $[\![1, n]\!]$, calcule son espérance et en donne un équivalent à l'aide de sommes de Riemann. Le troisième détermine le
    maximum $n - 1$ de la forme quadratique $\sum_{i\neq j} x_i x_j$ sur la boule unité, directement puis par le théorème spectral. Le quatrième réduit la matrice de permutation circulante $F$ et la matrice
    $A = P(F)$, avec $P = \sum kX^{k-1}$, et exprime $A^{-1}$ à l'aide des puissances de $F$.
