  nom: L'équation de Fermat matricielle $X^n + Y^n = Z^n$
  apercu: Le problème cherche des solutions non nulles de l'équation matricielle $X^n + Y^n = Z^n$. Dans les matrices symétriques positives, l'existence et l'unicité d'une racine $n$-ième fournit une bijection
    explicite avec les couples de telles matrices. Dans $\mathrm{SL}_2(\mathbb{Z})$, des arguments de traces et de congruences (modulo 8 et modulo 9, réduction dans $\mathbb{Z}/3\mathbb{Z}$) excluent les
    cas où 4 ou 3 divise $n$, tandis que des matrices périodiques donnent des solutions dans les autres cas. Les dernières parties étudient les réseaux de $\mathbb{Q}^n$ (existence d'une $\mathbb{Z}$-base)
    et montrent qu'un sous-groupe de $\mathrm{SL}_2(\mathbb{Q})$ engendré par $A$ et $B$ est conjugué à un sous-groupe de $\mathrm{SL}_2(\mathbb{Z})$ dès que $\operatorname{Tr} A$, $\operatorname{Tr} B$
    et $\det(A + B)$ sont entiers, ce qui permet de ramener des solutions rationnelles à des puissances entières.
  pages: 11
