  nom: L'équation de Fermat matricielle Xⁿ + Yⁿ = Zⁿ
  apercu: Le problème cherche des solutions non nulles de l'équation matricielle Xⁿ + Yⁿ = Zⁿ. Dans les matrices symétriques positives, l'existence et l'unicité d'une racine n-ième fournit une bijection
    explicite avec les couples de telles matrices. Dans SL₂(Z), des arguments de traces et de congruences (modulo 8 et modulo 9, réduction dans Z/3Z) excluent les cas où 4 ou 3 divise n, tandis que des
    matrices périodiques donnent des solutions dans les autres cas. Les dernières parties étudient les réseaux de Qⁿ (existence d'une Z-base) et montrent qu'un sous-groupe de SL₂(Q) engendré par A et B
    est conjugué à un sous-groupe de SL₂(Z) dès que Tr A, Tr B et det(A + B) sont entiers, ce qui permet de ramener des solutions rationnelles à des puissances entières.
