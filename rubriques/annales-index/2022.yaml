  nom: Matrices nilpotentes, matrices aléatoires à coefficients ±1 et familles presque orthogonales
  apercu: 'Le sujet étudie d''abord les matrices nilpotentes réelles (trace, déterminant, cas symétrique et antisymétrique) à l''aide du produit scalaire tr(AᵀB). Il considère ensuite des matrices aléatoires
    dont les coefficients sont indépendants et uniformes sur {−1, 1} : espérance et variance n! du déterminant, minoration de la probabilité d''inversibilité par 1/2^(n−1), puis simulation en Python. Il
    termine par un argument de concentration sous-gaussienne montrant l''existence de très nombreux vecteurs unitaires de Rⁿ deux à deux presque orthogonaux (nombre de l''ordre de exp(ε²n/4)).'
