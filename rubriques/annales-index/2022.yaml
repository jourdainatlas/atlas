  nom: Le théorème matriciel de Kreiss
  apercu: Le sujet étudie les matrices $M$ dont les puissances sont bornées en norme d'opérateur, de borne $b(M)$, et les compare à la quantité $b'(M) = \sup (|z| - 1)\|(zI_n - M)^{-1}\|$ sur $|z| > 1$.
    Après l'étude de la résolvante (série de Neumann, coefficients fractions rationnelles de dénominateur $\chi_M$) et d'une représentation intégrale de $X^\top M^k Y$, il établit l'inégalité de Spijker
    $V(f) \leqslant 2\pi n\|f\|_\infty$ sur la variation totale d'une fraction rationnelle de degré $n$ restreinte au cercle, et en déduit le théorème de Kreiss sous la forme $b(M) \leqslant \mathrm{e}
    \cdot n \cdot b'(M)$.
  pages: 7
