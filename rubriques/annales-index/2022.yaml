  nom: Le théorème des nombres premiers
  apercu: Le problème démontre le théorème des nombres premiers π(x) ∼ x/log x en le ramenant à la limite (1/n) Σ_{k≤n} Λ(k) → 1 pour la fonction de von Mangoldt. Il établit un théorème taubérien de type
    Karamata par approximation de Weierstrass, développe la transformée de Mellin et sa formule d'inversion (avec un détour par la transformée de Fourier de l'indicatrice de R₊ au sens des distributions
    tempérées), obtient le produit eulérien de ζ par un argument probabiliste, prolonge ζ au demi-plan Re s > 0, montre qu'elle ne s'annule pas sur la droite Re s = 1 grâce à l'inégalité 5 + 8 cos θ + 4
    cos 2θ + cos 3θ ≥ 0, et conclut par la formule d'inversion de Mellin.
  pages: 16
