  nom: Développement de la cotangente, valeurs de $\zeta$ et probabilité que des entiers soient premiers entre eux
  apercu: 'La première partie établit le développement eulérien $\pi x \operatorname{cotan}(\pi x) = 1 + 2 \sum x^2/(x^2 - n^2)$ par une équation fonctionnelle et un argument de maximum, puis en tire les
    nombres de Bernoulli $b_{2n}$ et les valeurs $\zeta(2)$, $\zeta(4)$, $\zeta(6)$. La deuxième partie munit les probabilités sur un ensemble dénombrable de la norme uniforme sur les parties, montre que
    la convergence en norme équivaut à la convergence ponctuelle des masses et, par extraction diagonale, qu''une suite tendue admet une valeur d''adhérence. Les dernières parties appliquent ces outils
    à la divisibilité : la loi du pgcd de $s$ entiers tirés uniformément dans $\{1, \dots, n\}$ converge vers la loi zêta, et la probabilité que $s$ entiers soient premiers entre eux tend vers $1/\zeta(s)$.'
