  nom: Convexité, points extrémaux, dualité et systèmes linéaires sous-déterminés
  apercu: Le sujet établit l'existence et les propriétés de la projection sur un convexe fermé de $\mathbb{R}^d$, puis la séparation stricte d'un convexe compact et d'un convexe fermé disjoints. Il étudie
    les points extrémaux (cas des polyèdres, existence pour un convexe compact, qui est l'enveloppe convexe de ses points extrémaux), les cônes polaires et le lemme de Farkas, d'où la dualité de la programmation
    linéaire. Il montre enfin qu'un système linéaire sous-déterminé $Mx = b$ de rang $k$ admet une solution de norme 1 minimale ayant au plus $k$ coordonnées non nulles.
