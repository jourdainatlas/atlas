- sujet: https://www.concours-centrale-supelec.fr/sites/default/files/documents/M041.pdf
  nom: Dérivation des séries de fonctions, déterministes et aléatoires
  apercu: Le sujet démontre une inégalité d'interpolation contrôlant les dérivées intermédiaires d'une fonction de classe $\mathcal{C}^K$ par sa dérivée $K$-ième et ses valeurs en $K$ points, grâce aux
    polynômes de Lagrange et au théorème de Rolle. Il en déduit qu'une série de fonctions est de classe $\mathcal{C}^K$ dès que la série des dérivées $K$-ièmes converge normalement et que les séries des
    valeurs en $K$ points convergent absolument. Une partie probabiliste prouve, via l'inégalité maximale de Lévy et un argument de type Borel-Cantelli, que la série de Rademacher $\sum X_n a_n$ converge
    presque sûrement lorsque $\sum a_n^2$ converge, puis applique ce résultat aux séries aléatoires de fonctions.
