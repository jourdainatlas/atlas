  nom: Formule asymptotique de Hardy et Ramanujan
  apercu: Le sujet introduit $P(z) = \exp\left(\sum L(z^n)\right) = \prod 1/(1 - z^n)$ sur le disque unité et montre que c'est la série génératrice $\sum p_n z^n$ du nombre $p_n$ de partitions de l'entier
    $n$, avec une formule intégrale pour $p_n$. Après des majorations de $|P(xe^{i\theta})/P(x)|$, des estimations de sommes par comparaison à des intégrales et un contrôle des fonctions caractéristiques
    (loi géométrique, variables centrées à moment d'ordre 4), il établit une convergence vers une gaussienne et en déduit l'équivalent $p_n \sim \exp\left(\pi\sqrt{2n/3}\right)/(4n\sqrt{3})$.
