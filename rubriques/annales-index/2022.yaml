  apercu: Le premier exercice étudie l'endomorphisme de C_n[X] qui associe à P le reste de la division euclidienne de AP par B, avec deg B = n + 1 ; à l'aide des polynômes d'interpolation de Lagrange, il
    montre que si B est scindé à racines simples x_k, cet endomorphisme est diagonalisable de valeurs propres A(x_k). Le deuxième exercice, sur une suite de lancers d'une pièce équilibrée, étudie la longueur
    de la première série puis, par une récurrence et une fonction génératrice G_n(x) = x((1 + x)/2)^(n−1), la loi du nombre de séries. Le troisième définit la constante d'Euler γ et établit γ = −∫₀^∞ e^(−t)
    ln t dt par convergence dominée.
