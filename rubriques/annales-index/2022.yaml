  nom: Angles entre sous-espaces, volumes et grassmannienne orientée
  apercu: Dans un espace euclidien, le sujet construit pour deux sous-espaces de même dimension $p$ des bases orthonormées adaptées réalisant successivement les maxima des produits scalaires, ce qui définit
    les angles principaux $\theta_1 \leqslant \dots \leqslant \theta_p$ et donne $\det \operatorname{Gram}(u, u') = \prod \cos \theta_k \leqslant 1$. Il étudie ensuite les formes $p$-linéaires alternées
    $\Omega_p(e)(u) = \det \operatorname{Gram}(e, u)$, le $p$-volume d'une famille (inégalité de Hadamard), munit l'espace des formes alternées d'un produit scalaire canonique, puis plonge la grassmannienne
    des sous-espaces orientés dans la sphère unité et en étudie compacité et connexité par arcs.
