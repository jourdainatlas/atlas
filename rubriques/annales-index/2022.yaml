    $x y'''' + y'' - 4 x y = 0$ par une série entière et l''identifie à l''intégrale à paramètre $\frac{1}{2\pi} \int_0^{2\pi} \exp(2x\cos t)\,\mathrm{d}t$ grâce aux intégrales de Wallis. Le quatrième montre
    que $AB$ et $BA$ ont même polynôme caractéristique, puis étudie les matrices semblables à leur transposée par une matrice orthogonale : toutes le sont en taille 2, et en dimension impaire $\det[M^\top,
