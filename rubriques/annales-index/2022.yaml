  nom: Racines carrées de matrices, matrices unipotentes et représentations du groupe de Heisenberg
  apercu: 'Quatre exercices préparent le problème : dénombrement des classes de similitude des racines carrées de matrices complexes à l''aide de la réduction de Jordan, bijectivité de U ↦ U² sur les matrices
    unipotentes en caractéristique différente de 2, construction des corps finis F_q comme points fixes du Frobenius, et caractérisation des p-groupes finis comme sous-groupes de matrices unipotentes de
    GL_r(F_p). Le problème étudie le groupe de Heisenberg H₃(F) des matrices unipotentes triangulaires supérieures de taille 3, son centre, son groupe dérivé et ses caractères, l''algèbre de convolution
    C[G] et les représentations distinguées pour une involution d''un groupe d''ordre impair, puis classe les représentations irréductibles de H₃(F_q) et montre que celles de H₃(F_q²) distinguées par H₃(F_q)
    sont en bijection avec les irréductibles de H₃(F_q).'
