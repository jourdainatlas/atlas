  nom: Développement de la cotangente, valeurs de ζ et probabilité que des entiers soient premiers entre eux
  apercu: 'La première partie établit le développement eulérien πx cotan(πx) = 1 + 2 Σ x²/(x² − n²) par une équation fonctionnelle et un argument de maximum, puis en tire les nombres de Bernoulli b_2n et
    les valeurs ζ(2), ζ(4), ζ(6). La deuxième partie munit les probabilités sur un ensemble dénombrable de la norme uniforme sur les parties, montre que la convergence en norme équivaut à la convergence
    ponctuelle des masses et, par extraction diagonale, qu''une suite tendue admet une valeur d''adhérence. Les dernières parties appliquent ces outils à la divisibilité : la loi du pgcd de s entiers tirés
    uniformément dans {1, …, n} converge vers la loi zêta, et la probabilité que s entiers soient premiers entre eux tend vers 1/ζ(s).'
