  nom: Le théorème des nombres premiers
  apercu: Le problème démontre le théorème des nombres premiers $\pi(x) \sim x/\log x$ en le ramenant à la limite $(1/n) \sum_{k \leqslant n} \Lambda(k) \to 1$ pour la fonction de von Mangoldt. Il établit
    un théorème taubérien de type Karamata par approximation de Weierstrass, développe la transformée de Mellin et sa formule d'inversion (avec un détour par la transformée de Fourier de l'indicatrice de
    $\mathbb{R}_+$ au sens des distributions tempérées), obtient le produit eulérien de $\zeta$ par un argument probabiliste, prolonge $\zeta$ au demi-plan $\operatorname{Re} s > 0$, montre qu'elle ne s'annule
    pas sur la droite $\operatorname{Re} s = 1$ grâce à l'inégalité $5 + 8 \cos \theta + 4 \cos 2\theta + \cos 3\theta \geqslant 0$, et conclut par la formule d'inversion de Mellin.
