  nom: Matrices de Hurwitz
  apercu: Le sujet relie, pour le système différentiel X' = MX avec M réelle semi-simple (diagonalisable dans C), le comportement des solutions en +∞ et la localisation des valeurs propres. Il montre qu'une
    matrice semi-simple est semblable sur R à une matrice presque diagonale (blocs 2×2), qu'un endomorphisme complexe est diagonalisable si et seulement si tout sous-espace admet un supplémentaire stable,
    puis étudie les polynômes de Hurwitz (racines de partie réelle strictement négative). Il conclut à l'équivalence entre « χ_M est de Hurwitz », « toutes les solutions tendent vers 0 » et « les solutions
    décroissent exponentiellement ».
  pages: 7
