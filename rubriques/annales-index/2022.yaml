  nom: Séries entières formelles, série réciproque et linéarisation
  apercu: 'Le sujet étudie l''algèbre des séries entières formelles munie du produit de Cauchy et de la composition, avec la relation de majoration terme à terme des modules, et montre que composée et série
    réciproque d''une série de rayon strictement positif ont encore un rayon strictement positif (méthode des séries majorantes). Il traite ensuite le problème de linéarisation : pour f = λz + F avec λ
    non racine de l''unité, il existe une unique série h = z + H telle que h† ∘ f ∘ h = λz ; son rayon est strictement positif dans le cas hyperbolique |λ| ≠ 1, et dans le cas elliptique |λ| = 1 un schéma
    itératif à convergence rapide minore le rayon de h par une quantité r∞ dépendant de λ.'
