  nom: Le théorème matriciel de Kreiss
  apercu: Le sujet étudie les matrices M dont les puissances sont bornées en norme d'opérateur, de borne b(M), et les compare à la quantité b′(M) = sup (|z| − 1)‖(zIₙ − M)⁻¹‖ sur |z| > 1. Après l'étude
    de la résolvante (série de Neumann, coefficients fractions rationnelles de dénominateur χ_M) et d'une représentation intégrale de XᵀMᵏY, il établit l'inégalité de Spijker V(f) ≤ 2πn‖f‖∞ sur la variation
    totale d'une fraction rationnelle de degré n restreinte au cercle, et en déduit le théorème de Kreiss sous la forme b(M) ≤ e·n·b′(M).
  pages: 7
