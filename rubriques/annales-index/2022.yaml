  nom: Points rationnels de la quadrique 3x² + 3y² − z² = −1
  apercu: 'Le sujet étudie les points rationnels de la nappe H de la quadrique 3x² + 3y² − z² = −1, munie de la forme bilinéaire de signature (2, 1) qui en fait un modèle du plan hyperbolique : réflexions,
    distance hyperbolique avec ch(d(u, v)) = −B(u, v), groupe Γ des isométries entières et domaine fondamental compact. Il compte les points de dénominateur fixé et de hauteur bornée (croissance linéaire
    en la coordonnée z, croissance exponentielle de Γ(R)), étudie l''équation a² + b² ≡ 0 mod d par des sommes exponentielles, et conclut via une projection stéréographique et un critère d''équidistribution
    que le nombre de points rationnels de hauteur au plus h dans une boule hyperbolique est compris entre h^{2−ε} et h^{2+ε}.'
