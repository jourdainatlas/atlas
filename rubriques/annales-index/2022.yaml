  nom: Intégrales de Gauss et théorème de Moivre-Laplace ; factorisation QR
  apercu: Le premier problème calcule les intégrales de Wallis $I_m = \int_0^1 (1 - t^2)^{m/2} \,\mathrm{d}t$, en déduit l'équivalent du coefficient binomial central, puis la valeur de l'intégrale de Gauss
    par convergence dominée. Après une majoration fine des quotients de coefficients binomiaux, il montre que l'histogramme renormalisé de la loi binomiale $\mathcal{B}(2n, 1/2)$ converge simplement vers
    la densité gaussienne, étape clé du théorème de Moivre-Laplace. Le second problème étudie les matrices de rang 1 et les matrices de Householder (projections et symétries orthogonales), puis démontre
    par récurrence que toute matrice carrée réelle admet une factorisation QR.
