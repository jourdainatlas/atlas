  nom: Formule de Bayes, lois normales et loi exponentielle, suite géométrique complexe, fonction logarithme et suite d'intégrales, plan et droite de l'espace ou équation diophantienne et points entiers
    d'un plan
  apercu: 'Le premier exercice traite des trajets de Romane : arbre pondéré et formule de Bayes, lois normales des temps de trajet, puis loi exponentielle de la durée de fonctionnement d''une ampoule. Le
    deuxième exercice étudie la suite $z_{n+1} = \frac{\mathrm{i}}{3}z_n$ avec $z_0 = 100$, établit un alignement et montre qu''à partir d''un certain rang les points sont dans le disque de centre $O$ et
    de rayon 1. Le troisième exercice étudie $f(x) = \frac{1}{x}\ln(x)$ puis la suite d''intégrales $u_n = \int_1^2 \frac{1}{x^{n+1}}\ln(x)\,\mathrm{d}x$, qu''il encadre pour en obtenir la limite. Au choix,
    les non-spécialistes étudient le plan $6x + 8y - z = 0$, une droite et l''intersection de ce plan avec une courbe paramétrée, et les spécialistes résolvent $3x + 4y = p$ pour décrire les points à coordonnées
    entières du même plan, puis étudient une transformation définie par une matrice $3 \times 3$.'
