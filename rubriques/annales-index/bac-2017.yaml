    (ce document ne reproduit pas l''exercice de spécialité), étudie deux suites logistiques : convergence vers 0 de $u_{n+1} = 0{,}9u_n(1 - u_n)$ par majoration géométrique avec un algorithme de seuil,
    puis équation de la limite de $v_{n+1} = 1{,}06v_n(1 - v_n)$.'
