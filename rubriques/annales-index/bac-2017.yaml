  apercu: 'Le premier exercice étudie $h(x) = x\mathrm{e}^{-x}$ et en trouve une primitive, puis compare les courbes de $f(x) = x\mathrm{e}^{-x} + \ln(x+1)$ et $g(x) = \ln(x+1)$ : écart maximal, aire $\mathcal{A}_\lambda
