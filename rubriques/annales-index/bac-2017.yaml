  nom: Équation complexe du quatrième degré et losange, loi normale et prise de décision, tangentes aux courbes exponentielles, suites de solutions d'une équation logarithmique, arithmétique d'une suite
    ou géométrie dans l'espace
  apercu: Le premier exercice résout $z^4 + 2z^3 - z - 2 = 0$ par factorisation et se demande si les quatre points obtenus forment un losange. Le deuxième exercice traite l'épaisseur d'un dépôt de nickel
    par une loi normale, compare deux écarts-types puis teste une affirmation au seuil de 95 %, et le troisième démontre que les tangentes aux courbes de $x \mapsto \mathrm{e}^x$ et de $x \mapsto \mathrm{e}^{-x}$
    en des points de même abscisse sont perpendiculaires, puis démontre la conjecture tirée d'un tableur sur la longueur $PQ$. Le quatrième exercice étudie $f(x) = \frac{\ln(x)}{x}$ et les solutions $\alpha_n$
    et $\beta_n$ de l'équation $\frac{\ln(x)}{x} = \frac{1}{n}$, établit le sens de variation et la convergence de $(\alpha_n)$, puis la limite de $(\beta_n)$. Au choix, les spécialistes étudient la divisibilité
    et le PGCD des termes de la suite $u_n = 9 \times 2^n - 6$, et les non-spécialistes un plan, deux plans sécants et l'intersection d'une droite avec un plan de l'espace.
