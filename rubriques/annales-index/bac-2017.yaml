  nom: Fonction exponentielle et concentration d'un médicament, suite et conjecture, vrai-faux (probabilités, complexes, espace), intégrales et méthode de Monte-Carlo, loi exponentielle et loi normale ou
    matrices et code de Hamming
  apercu: 'Le premier exercice étudie la concentration $C(t) = \frac{d}{a}\left(1 - \mathrm{e}^{-\frac{a}{80}t}\right)$ d''un médicament perfusé : sens de variation et plateau, étude de la fonction $f(x)
    = \frac{105}{x}\left(1 - \mathrm{e}^{-\frac{3}{40}x}\right)$, unicité d''une solution de $f(x) = 5{,}9$ par le théorème des valeurs intermédiaires, puis détermination de la clairance et du débit. Le
    deuxième exercice fait conjecturer à l''aide d''un tableur puis démontrer l''expression de $v_n = (n+1)u_n$ pour la suite $u_{n+1} = \frac{n+1}{2n+4}u_n$, et le troisième est un vrai-faux portant sur
    la formule de Bayes, des complexes sous forme exponentielle, l''orthogonalité d''une droite et d''un plan et la coplanarité de deux droites. Le quatrième exercice calcule $I = \int_0^1 \frac{1}{1+x}\,\mathrm{d}x$
    puis estime $J = \int_0^1 \frac{1}{1+x^2}\,\mathrm{d}x$ par la méthode de Monte-Carlo, avec un algorithme et un intervalle de confiance. Au choix, les non-spécialistes étudient des lampes à led : leur
    durée de vie par une loi exponentielle, la proportion annoncée par le fabricant par un intervalle de fluctuation, et le nombre de lampes encore en état de marche au bout d''un an par une loi normale,
    et les spécialistes calculent $A^n = PD^nP^{-1}$ pour une transmission de bits puis étudient le code correcteur de Hamming (7, 4).'
  pages: 8
