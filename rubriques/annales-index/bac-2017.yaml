  nom: Loi normale, probabilités conditionnelles et prise de décision, portail à courbe exponentielle et aires, suites dont la somme égale le produit, géométrie dans l'espace ou matrices et clé de contrôle
  apercu: Le premier exercice modélise le montant de devis par une loi normale, puis traite un filtre anti-spam par les probabilités conditionnelles et une prise de décision par intervalle de fluctuation.
    Le deuxième exercice étudie la fonction paire $f(x) = -\frac{b}{8}\left(\mathrm{e}^{\frac{x}{b}} + \mathrm{e}^{-\frac{x}{b}}\right) + \frac{9}{4}$ qui dessine le haut d'un portail, détermine ses paramètres
    à l'aide du théorème des valeurs intermédiaires et compare par des calculs d'aires deux découpes, dont l'une fait intervenir une tangente. Le troisième exercice étudie les suites dont la somme des $n$
    premiers termes égale leur produit, établit $u_n = \frac{s_n}{s_n - 1}$, complète un algorithme et détermine les limites de $(s_n)$ et de $(u_n)$. Au choix, les non-spécialistes déterminent dans l'espace
    la limite ombre-soleil d'une véranda par un plan, et les spécialistes étudient une répartition d'effectifs par $U_{n+1} = U_n M$ puis une clé de contrôle par congruences modulo 10.
