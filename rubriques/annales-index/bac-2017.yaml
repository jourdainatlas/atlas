  apercu: Ce document est un corrigé qui reproduit l'énoncé avec les solutions. Le premier exercice applique la formule des probabilités totales, une loi exponentielle avec son absence de mémoire, une loi
    normale et un intervalle de fluctuation, et le deuxième étudie les solutions conjuguées de $z^2 - 6z + c = 0$ et la valeur de $c$ qui rend le triangle $OAB$ rectangle. Le troisième étudie $f(x) = \ln\left(-2x^2
    + 13{,}5\right)$ et encadre l'aire de la zone de creusement d'un tunnel à l'aide d'un algorithme de type méthode des rectangles. Au choix, les non-spécialistes démontrent $u_n = 3 \times 2^n + n - 2$
    pour $u_{n+1} = 2u_n - n + 3$ et la limite de $\frac{u_n}{2^n}$, et les spécialistes établissent $2u_n - 3v_n = (-1)^{n+1}$ pour des suites couplées, en déduisent leur PGCD puis, par le calcul matriciel,
    la limite de $\frac{u_n}{v_n}$ ; le dernier exercice construit la section d'un cube par le plan $x + \frac{1}{2}y + \frac{1}{3}z - 1 = 0$.
