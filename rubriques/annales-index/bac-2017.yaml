  nom: Loi exponentielle, probabilités totales et intervalle de fluctuation, volume maximal d'un cône, tétraèdre régulier dans un cube, fonction exponentielle et vitesse d'une goutte ou chiffrement affine
  apercu: Le premier exercice modélise des durées d'attente par des lois exponentielles, en déduit un paramètre, applique la formule des probabilités totales et une probabilité conditionnelle inversée,
    puis discute un taux de satisfaction annoncé par un intervalle de fluctuation. Le deuxième cherche le cône de volume maximal $V(h) = \frac{1}{3}\pi\left(400 - h^2\right)h$ obtenu en découpant un secteur
    dans un disque, et le troisième inscrit la molécule de méthane dans un cube pour calculer l'angle entre deux liaisons par le produit scalaire. Au choix, les non-spécialistes étudient la vitesse $v(t)
    = 9{,}81\frac{m}{k}\left(1 - \mathrm{e}^{-\frac{k}{m}t}\right)$ d'une goutte (variations, vitesse limite, durée et vitesse moyenne), et les spécialistes déterminent les clés d'un chiffrement affine
    modulo 26 par analyse de fréquences et congruences.
