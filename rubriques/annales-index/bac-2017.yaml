  nom: QCM de probabilités, perpendiculaire commune à deux droites de l'espace, pharmacocinétique (exponentielle, intégrale, suite arithmético-géométrique), polygones réguliers et suite ou arbre de Stern-Brocot
  apercu: 'Le premier exercice est un QCM de probabilités sur une loi normale, une loi binomiale, une probabilité conditionnelle inversée, une loi exponentielle et la taille d''un échantillon pour un intervalle
    de confiance. Le deuxième construit dans l''espace une droite perpendiculaire et sécante à deux droites non coplanaires, à l''aide d''un plan d''équation $5x + 4y - z - 22 = 0$. Le troisième étudie
    la concentration plasmatique d''un médicament : demi-vie et aire sous la courbe pour $f(t) = 20\mathrm{e}^{-0{,}1t}$, maximum de $g(t) = 20\left(\mathrm{e}^{-0{,}1t} - \mathrm{e}^{-t}\right)$, puis
    injections répétées décrites par $u_{n+1} = 0{,}5u_n + 20$. Au choix, les non-spécialistes expriment le rayon $r_n$ d''un polygone régulier d''aire 1 à l''aide de la trigonométrie et des complexes et
    montrent que la suite $(r_n)$ décroît et converge, et les spécialistes étudient l''arbre de Stern-Brocot par des produits de matrices et montrent que les fractions associées sont irréductibles.'
  pages: 6
