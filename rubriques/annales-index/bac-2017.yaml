  nom: Fonction logarithme, valeurs intermédiaires et aire, orthogonalité dans un cube, loi normale et prise de décision, complexes et cercle circonscrit, suite récurrente d'une population ou graphe probabiliste
    à trois états
  apercu: Le premier exercice étudie $f(x) = \frac{x^2 - 2x - 2 - 3\ln x}{x}$ à l'aide de la fonction auxiliaire $\varphi(x) = x^2 - 1 + 3\ln x$, localise ses zéros $\alpha$ et $\beta$ et utilise une primitive
    pour décider si un palet de chocolat en forme de goutte respecte une contrainte de rentabilité. Le deuxième exercice montre dans un cube que $(AG)$ est orthogonale au plan $(BDE)$ et calcule le volume
    d'une pyramide, et le troisième estime la moyenne et l'écart-type d'une série, discute une modélisation par la loi normale de paramètres $\mu = 140$ et $\sigma = 19$, puis décide d'une anomalie au risque
    de 5 % puis de 1 %. Le quatrième exercice montre que $OAB$ est rectangle isocèle et qu'une solution de $z^2 - \sqrt{6}z + 2 = 0$ est l'affixe d'un point de son cercle circonscrit. Au choix, les non-spécialistes
    modélisent une population par une suite géométrique puis par $u_{n+1} = -\frac{1{,}1}{605}u_n^2 + 1{,}1u_n$, et les spécialistes un jeu en ligne à trois statuts par une matrice de transition, un état
    stable et un algorithme.
