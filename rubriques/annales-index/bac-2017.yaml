  nom: Suite d'intégrales de $\mathrm{e}^{-x^2}$, Monte-Carlo et rectangle d'aire maximale, transformation complexe $z' = -z^2 + 2z$, loi normale, conditionnement et échantillonnage, géométrie dans le cube
    ou matrices et équations diophantiennes
  apercu: 'Le premier exercice montre que la suite $u_n = \int_0^n \mathrm{e}^{-x^2}\,\mathrm{d}x$ est croissante et majorée, donc convergente, estime $u_2$ par une méthode de Monte-Carlo programmée, puis
    cherche le rectangle d''aire maximale $\mathcal{A}(x) = x\mathrm{e}^{-x^2}$ inscrit sous la courbe. Le deuxième étudie la transformation $z'' = -z^2 + 2z$ : équation du second degré, milieu d''un segment,
    construction à la règle et au compas lorsque $|z| = 1$ et nature d''un triangle. Le troisième combine une loi normale (taux de cholestérol), un arbre pondéré avec probabilité conditionnelle inversée,
    un intervalle de fluctuation et la taille minimale d''un échantillon pour un intervalle de confiance. Au choix, les non-spécialistes déterminent dans un cube une équation du plan $(BGI)$, le volume
    du tétraèdre $FBIG$ et le projeté orthogonal de $F$ sur ce plan pour obtenir l''aire du triangle $BGI$, et les spécialistes obtiennent l''équation d''un plan par inversion de matrice puis cherchent
    ses points à coordonnées entières par l''équation $2x + 3y = 11$ et des congruences.'
