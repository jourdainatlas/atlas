  nom: Factorisation des polynômes de $\mathbb{Z}[t]$ par réduction modulo $p$ et réduction de réseaux
  apercu: Le problème développe les outils d'un algorithme de factorisation des polynômes unitaires de $\mathbb{Z}[t]$ à partir d'une factorisation dans $\mathbb{Z}/p\mathbb{Z}[t]$. Il étudie une suite
    matricielle arithmético-géométrique $X_{\ell+1} = A X_\ell + G$ construite à partir de matrices de moyennes, borne le déterminant de la matrice de Sylvester pour montrer qu'un polynôme à petits coefficients
    révèle un facteur non trivial, puis factorise dans $\mathbb{Z}/p\mathbb{Z}[t]$ par la décomposition en degrés distincts et un algorithme probabiliste à la Cantor-Zassenhaus. Les deux dernières parties
    décrivent la réduction de Gauss en dimension 2 et une réduction de réseaux de type LLL fournissant un vecteur presque minimal.
