  nom: 'Minimisation sous contraintes : pénalisation, Karush-Kuhn-Tucker et algorithme d''Uzawa'
  apercu: Le problème étudie la minimisation d'une fonction $f$ sur une partie $K$ de $\mathbb{R}^n$ définie par des contraintes $g_i(x) \leqslant 0$. Après des préliminaires sur les fonctions convexes
    et $\alpha$-convexes, les fonctions coercives, la projection sur un convexe fermé et le cône des directions admissibles, il justifie la méthode de pénalisation, démontre le lemme de Farkas puis le théorème
    de Karush-Kuhn-Tucker, et étudie le problème dual via le lagrangien et ses points selles, jusqu'à la convergence de l'algorithme d'Uzawa $\mu_{k+1} = P(\mu_k + \rho g(x_{\mu_k}))$ pour des contraintes
    affines.
