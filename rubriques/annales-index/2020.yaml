  nom: Espaces vectoriels d'endomorphismes nilpotents
  apercu: 'Le sujet démontre le théorème de Gerstenhaber (1958) : un sous-espace vectoriel de $\mathcal{L}(E)$ formé d''endomorphismes nilpotents, avec $\dim E = n$, est de dimension au plus $n(n-1)/2$,
    et s''il atteint cette dimension il existe une base dans laquelle tous ses éléments sont triangulaires supérieurs stricts. La preuve passe par des généralités sur le nilindice, la représentation des
    endomorphismes de rang 1 d''un espace euclidien sous la forme $z \mapsto (a|z)x$, une identité de traces $\operatorname{tr}(u^k v) = 0$ et une récurrence sur la dimension utilisant une projection orthogonale.'
