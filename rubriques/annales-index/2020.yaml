  nom: Développements ternaires et fonction de Cantor-Lebesgue
  apercu: Le problème montre que tout réel de $\left[0, 1\right[$ admet un développement ternaire propre, la somme des $t_n/3^n$ définissant une forme linéaire continue sur l'espace des suites bornées,
    avec des fonctions Python de conversion et de contrôle de parité. Il étudie ensuite la fonction $\varphi(x)$, somme des $(1 + \sin(nx))/3^n$, pour calculer une intégrale, puis des développements ternaires
    aléatoires dont il prouve la convergence en probabilité vers $1$. Il construit enfin la fonction de Cantor-Lebesgue comme limite uniforme d'une suite de fonctions et établit qu'elle est continue, croissante
    et surjective sur $[0, 1]$.
