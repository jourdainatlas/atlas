  nom: Gestion des erreurs dans un processus industriel
  apercu: Le sujet cherche à montrer que la probabilité $P(S_n > nam)$ que le nombre cumulé d'erreurs dépasse $a$ fois sa moyenne décroît exponentiellement. Il traite d'abord le cas de variables de Poisson
    indépendantes de paramètre $1/2$, avec un équivalent de $P(S_n > n)$ obtenu via la formule de Stirling, puis démontre partiellement le théorème de Perron-Frobenius pour les matrices strictement positives,
    et l'applique à une chaîne de Markov pour établir une majoration de type Chernoff $P(S_n \geqslant nam) \leqslant \exp(-n(\lambda^*(am) - \varepsilon))$, avec une illustration numérique en Python.
