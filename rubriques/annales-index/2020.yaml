  nom: Régularisation inf-convolution, fonctions concaves et semi-concaves
  apercu: Le sujet étudie l'opérateur $T_\varepsilon f(x) = \inf_y \left(f(y) + \|y - x\|^\alpha / \varepsilon\right)$, qui approche une fonction bornée par des fonctions plus régulières, et relie la convergence
    uniforme au module de continuité. Il établit la continuité des fonctions concaves sur $\mathbb{R}^d$ et l'existence de surgradients par projection sur un convexe fermé, puis montre qu'une fonction à
    la fois semi-concave et semi-convexe est de classe $\mathcal{C}^1$ à gradient lipschitzien.
