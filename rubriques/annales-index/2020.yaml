  nom: Nombre de sites visités par une marche aléatoire
  apercu: 'Le sujet étudie l''espérance $E(N_n)$ du nombre de points de $\mathbb{Z}^d$ visités en $n$ pas par une marche aléatoire. À l''aide des séries génératrices $F$ et $G$ du retour en $0$ et du premier
    temps de retour $R$, il montre que $E(N_n)/n$ tend vers $P(R = +\infty)$, que la marche revient presque sûrement en $0$ si et seulement si la série des $P(S_n = 0)$ diverge, et calcule la loi de $R$
    pour la marche de Bernoulli sur $\mathbb{Z}$. Un lemme taubérien sur les suites vérifiant $\sum a_k b_{n-k} = 1$ conduit au théorème d''Erdős et Dvoretzky : pour la marche simple sur $\mathbb{Z}^2$,
    $E(N_n)$ est équivalent à $\pi n/\ln n$.'
