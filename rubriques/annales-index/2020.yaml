- sujet: https://www.vmaths.fr/wp-content/uploads/XENS/MP/X_ENS_2020_MP_MB_enonce.pdf
  nom: Grandes déviations, méthode de Laplace et phase stationnaire
  apercu: 'Le sujet établit d''abord un principe de grandes déviations pour la moyenne $S_n$ de variables de Rademacher : $(1/n) \log P(S_n \geqslant t)$ tend vers $\inf_{\lambda \geqslant 0} (\psi(\lambda) - \lambda
    t)$, avec $\psi(\lambda) = \log \operatorname{ch} \lambda$, par la borne de Chernoff et une pondération exponentielle. Il démontre ensuite la méthode de Laplace et en déduit la formule de Stirling,
    puis étudie les intégrales de Fresnel et obtient le développement de la phase stationnaire pour $\int g(x) \sin(t f(x)) \,\mathrm{d}x$ à $O(1/t)$ près.'
