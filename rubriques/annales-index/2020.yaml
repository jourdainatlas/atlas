  nom: 'Quatre exercices : série alternée de fonctions, matrices à diagonale propre, intégrales impropres et fonctions périodiques, isométrie d''un plan'
  apercu: Le sujet comporte quatre exercices indépendants. Le premier étudie la série de fonctions de terme général $(-1)^n/\sqrt{1+nx}$ sur $\left[1, +\infty\right[$ et le développement asymptotique de
    sa somme ; le deuxième étudie les matrices « à diagonale propre », dont le polynôme caractéristique est le produit des $X - a_{ii}$, calcule la probabilité qu'une matrice construite à partir de trois
    variables géométriques indépendantes le soit et détermine les matrices symétriques réelles à diagonale propre ; le troisième étudie la convergence de $\int_a^{+\infty} (\lambda - f(t))/t \,\mathrm{d}t$
    pour $f$ périodique et en tire un équivalent de $\int_0^{\pi/2} |\sin(nt)|/\sin t \,\mathrm{d}t$ ; le quatrième montre qu'un endomorphisme du plan est une rotation pour un produit scalaire non usuel
    et détermine quand $f^m = \mathrm{id}$.
