- sujet: https://www.ens.psl.eu/sites/default/files/20_mp_mathd_sujet.pdf
  nom: Fonctions simples, permutations alternées et nombres d'Euler
  apercu: Le sujet classe les fonctions « simples » (continues, à ensemble fini d'extremums relatifs sur lequel elles sont injectives), à reparamétrage croissant près au départ et à l'arrivée, par une permutation
    de montée-descente ou de descente-montée, et montre, en redémontrant le théorème d'inversion locale, que toute fonction simple tendant vers l'infini en valeur absolue en $\pm\infty$ est équivalente
    à un polynôme. Il dénombre les permutations alternées (nombres d'Euler $E_n$), relie leur série génératrice exponentielle à $\tan(x/2 + \pi/4)$, étudie leur périodicité modulo un nombre premier, et
    montre enfin la continuité d'un « code » associé aux extremums.
  pages: 12
