  nom: Fonctions arithmétiques multiplicatives et applications
  apercu: Le sujet munit les fonctions arithmétiques du produit de convolution de Dirichlet, montre que les fonctions multiplicatives forment un groupe, établit la formule d'inversion de Möbius, $\varphi
    = \mu * \mathbf{I}$, le déterminant de Smith $\det(f(i \wedge j)) = \prod (f * \mu)(k)$ et la multiplicativité des séries de Dirichlet. Il l'applique à la preuve que deux matrices de permutation sont
    semblables si et seulement si les permutations sont conjuguées, à une caractérisation des endomorphismes de permutation, puis montre que le déterminant de la matrice de Redheffer $H_n$ est la fonction
    de Mertens $M(n)$ et que $1$ est valeur propre de $H_n$ de multiplicité $n - \lfloor \log_2 n \rfloor - 1$.
