- sujet: https://www.vmaths.fr/wp-content/uploads/XENS/MP/X_ENS_2020_MP_MA_enonce.pdf
  nom: Valeurs propres des matrices symétriques rationnelles
  apercu: Le sujet caractérise les réels qui sont valeurs propres d'une matrice symétrique à coefficients rationnels. Après des exemples ($\sqrt{2}$ l'est, $\sqrt{3}$ ne l'est pas pour une matrice $2 \times
    2$, la racine cubique de 2 jamais), il introduit les nombres totalement réels, montre qu'ils forment un corps grâce aux sommes de Newton, puis prouve que tout nombre totalement réel est valeur propre
    d'une matrice symétrique rationnelle en symétrisant une matrice compagnon par une forme bilinéaire définie positive.
