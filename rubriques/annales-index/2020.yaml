- sujet: documents/annales/2020/mines-ponts/Maths-PSI-2.pdf
  nom: Caractérisation et exponentielle des matrices normales
  apercu: 'Le sujet montre que pour une matrice réelle $A$ sont équivalents : la transposée de $A$ est un polynôme en $A$, $A$ est normale, $\|{}^t\!A X\| = \|A X\|$ pour tout $X$, et $A$ est orthogonalement
    semblable à une matrice diagonale par blocs de tailles 1 et 2 (blocs $r \mathrm{R}(\theta)$). Il définit ensuite l''exponentielle de matrice par une série, calcule l''exponentielle des matrices normales
    et décrit son image.'
