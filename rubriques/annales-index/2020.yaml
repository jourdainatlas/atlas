  nom: Différentiabilité de la fonction distance à une partie fermée
  apercu: 'Le problème étudie la différentiabilité de la fonction $d_F : x \mapsto d(x, F)$ pour une partie fermée non vide $F$ d''un espace euclidien. Après la projection sur un convexe fermé, il traite
    la dimension 1 (distance à $\mathbb{Z}$ et sa série de Fourier, qui donne $\zeta(2)$ et $\zeta(4)$, décomposition d''un ouvert de $\mathbb{R}$ en intervalles), puis des cas particuliers (point, sous-espace,
    sphère unité) ; il montre enfin qu''en un point $a$ hors de $F$, $d_F$ est différentiable si et seulement si $a$ admet un unique point le plus proche $\pi(a)$, avec alors $\nabla d_F(a) = (a - \pi(a))/d_F(a)$,
    et qu''en un point de $F$ le gradient éventuel est nul.'
