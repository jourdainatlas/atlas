  nom: Fonction caractéristique d'une variable aléatoire réelle
  apercu: Le sujet définit la fonction caractéristique $\phi_X(t) = \mathbb{E}(e^{itX})$ d'une variable aléatoire discrète, la calcule pour les lois usuelles et caractérise $|\phi_X(t_0)| = 1$ par une loi
    portée par un réseau. Il montre par deux méthodes que $\phi_X$ détermine la loi, relie la régularité de $\phi_X$ à l'existence des moments, et établit son développement en série entière sous une hypothèse
    de croissance des moments.
