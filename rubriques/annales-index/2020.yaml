  nom: Barycentres, polynômes de Bernstein et courbes de Bézier
  apercu: 'Le sujet construit le barycentre d''un système de points pondérés et en établit l''homogénéité, l''associativité et la conservation par les applications affines. Il étudie les polynômes de Bernstein
    (partition de l''unité, récurrences, maximum en $k/n$, base de $\mathbb{R}_n[X]$ formée de vecteurs propres d''un endomorphisme diagonalisable), puis les courbes de Bézier qu''ils définissent : tangentes
    aux extrémités, effet du déplacement d''un point de contrôle, algorithme de Casteljau. Il classe enfin, à l''aide du groupe des isométries du carré, les courbes de Bézier dont les points de contrôle
    sont les sommets d''un carré, et étudie le raccordement lisse ou $\mathcal{C}^1$ de deux courbes.'
