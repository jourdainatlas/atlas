  nom: Matrices symétriques positives, noyau gaussien et interpolation de norme minimale
  apercu: Le sujet établit d'abord que le produit de Hadamard de deux matrices symétriques positives est symétrique positif, puis en déduit que la matrice de noyau gaussien de coefficients $\exp(-|x_i -
    x_j|^2/(2\lambda))$ est symétrique positive. Il construit ensuite, à partir de l'opérateur de convolution par une gaussienne, un espace $H$ de combinaisons de gaussiennes translatées muni d'un produit
    scalaire à noyau reproduisant, et montre qu'il existe une unique interpolante de norme minimale, obtenue en résolvant le système $K\alpha = a$.
