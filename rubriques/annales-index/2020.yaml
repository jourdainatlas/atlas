  nom: Autour de la fonction sinus cardinal ; les matrices de Kac
  apercu: 'Deux problèmes indépendants. Le premier calcule la transformée de Laplace $F(x)$ de $\sin(t)/t$, égale à $\pi/2 - \operatorname{Arctan}(x)$, par dérivation sous l''intégrale, puis utilise une
    variante de la formule de Viète pour en déduire que $\pi/4$ est limite d''une somme finie, ce qu''il retrouve par une somme de Riemann. Le second étudie les matrices tridiagonales de Kac $A_n$ et $B_n$
    : $B_n$ est la matrice de la dérivation sur l''espace engendré par les $\cos^k \sin^{n-k}$, ce qui montre que $A_n$ est diagonalisable de valeurs propres $2k - n$ ; on en déduit que la loi binomiale
    $\mathcal{B}(n, 1/2)$ est l''unique loi invariante du modèle des urnes d''Ehrenfest.'
  pages: 8
