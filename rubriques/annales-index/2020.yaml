  nom: Espaces vectoriels d'endomorphismes nilpotents
  apercu: 'Le sujet démontre le théorème de Gerstenhaber (1958) : un sous-espace vectoriel de $\mathcal{L}(E)$ formé d''endomorphismes nilpotents et de dimension maximale $n(n - 1)/2$ est, dans une base
    convenable, formé de matrices triangulaires supérieures strictes. Il réunit des généralités sur le nilindice, la représentation des endomorphismes de rang 1 d''un espace euclidien par $a \otimes x$,
    un lemme sur les traces $\operatorname{tr}(u^k v) = 0$ et un critère de vecteur propre commun, puis conclut par récurrence sur la dimension en projetant orthogonalement sur un hyperplan.'
