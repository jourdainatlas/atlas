- sujet: https://www.concours-centrale-supelec.fr/sites/default/files/documents/M027.pdf
  nom: Les fonctions de Lambert
  apercu: Le sujet définit la fonction $W$ de Lambert, réciproque de $x \mapsto x e^x$ sur $\left[-1, +\infty\right[$, et étudie sa régularité, ses équivalents et la résolution d'équations transcendantes
    qu'elle permet. Il l'applique à deux problèmes probabilistes (loi de Poisson, loi binomiale, inégalité de Markov), établit son développement en série entière à l'aide de l'identité binomiale d'Abel,
    puis l'approche par une suite récurrente de point fixe.
