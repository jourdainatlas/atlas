  nom: 'Cinq exercices : lois géométriques, produit infini de cosinus hyperboliques, suites indexées par $\mathbb{Z}$, orthogonal de $\mathbb{R}_{n-1}[X]$, lemme de Cesàro'
  apercu: Le sujet comporte cinq exercices indépendants. On y calcule $P(X = Y)$ et la loi de $X + Y$ pour deux variables géométriques sur $\mathbb{N}$ indépendantes, on étudie le produit infini des $\operatorname{ch}(x/k)$
