  nom: Espaces à noyau reproduisant
  apercu: 'Le problème introduit les espaces préhilbertiens de fonctions où l''évaluation en chaque point est continue et représentée par un produit scalaire $f(x) = \langle k_x, f\rangle$. Il étudie d''abord
    l''opérateur intégral autoadjoint $T$ de noyau $k_s(t)$ (fonction de Green de $-f''''$ avec conditions de Dirichlet sur $[0, 1]$), dont il détermine valeurs propres et vecteurs propres $\sqrt{2}\sin(k\pi
    x)$, puis il donne des exemples : l''espace des fonctions nulles au bord muni de l''intégrale de $f''g''$, un espace de séries entières à coefficients de carré sommable, le noyau $\min(x, y)$. Il montre
    enfin que les fonctions d''un tel espace sont continues si le noyau l''est et construit un espace à noyau reproduisant à partir d''un opérateur intégral.'
  pages: 4
