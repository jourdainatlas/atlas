  nom: Étude de certaines matrices symplectiques
  apercu: Le problème définit les matrices symplectiques, qui vérifient $M^\top J_n M = J_n$, et la forme bilinéaire alternée $\varphi(X, Y) = X^\top J_n Y$. Après le cas $2 \times 2$ (symplectique équivaut
    à déterminant $1$) et l'étude des colonnes d'une matrice orthogonale et symplectique, il montre qu'une matrice symétrique symplectique se diagonalise dans une base orthonormée et symplectique avec des
    valeurs propres deux à deux inverses. Il établit enfin une réduction par blocs des matrices antisymétriques et symplectiques, avec deux exemples numériques en taille 4.
