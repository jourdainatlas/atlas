  nom: Approximation par des exponentielles-polynômes
  apercu: Le sujet établit par des méthodes euclidiennes des théorèmes d'approximation en moyenne quadratique pondérée. Après un développement en série entière de $(1 - x)$ à la puissance $-(\alpha + 1)$
    via la fonction Gamma et des rappels sur la projection orthogonale, il construit les polynômes de Laguerre généralisés, orthogonaux pour le poids $x^\alpha e^{-x}$ sur $\left[0, +\infty\right[$, et
    calcule leurs normes. Il approche d'abord les exponentielles $e^{-kx}$ par leurs projections sur ces polynômes, puis, grâce au théorème de Weierstrass admis, montre que toute fonction continue tendant
    vers $0$ en $+\infty$ est approchée par des polynômes pour la norme pondérée ; il en déduit l'approximation en moyenne quadratique de fonctions continues paires à support compact sur $\mathbb{R}$ par
    des produits $p(x) \exp(-x^2/2)$.
