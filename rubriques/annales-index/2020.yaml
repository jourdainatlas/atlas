  nom: Intégrale de Dirichlet, extremums d'une forme quadratique, retour à l'origine d'une marche aléatoire
  apercu: Trois exercices indépendants. Le premier calcule l'intégrale de Dirichlet de $\sin(t)/t$ sur $\left]0, +\infty\right[$ en étudiant l'intégrale à paramètre $F(x)$ obtenue avec le facteur $\exp(-xt)$,
    qui vaut $\pi/2 - \operatorname{Arctan}(x)$, puis en prouvant sa continuité en $0$. Le deuxième montre que les extremums d'une forme quadratique sur la boule unité fermée sont liés aux valeurs propres
    extrêmes de sa matrice symétrique ; le troisième détermine, par fonctions génératrices, la loi du premier temps de retour en $0$ de la marche aléatoire simple sur $\mathbb{Z}$, qui est presque sûrement
    fini mais sans espérance.
