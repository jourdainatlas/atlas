  nom: Transformée de Mellin, fonction zêta et critère de Báez-Duarte
  apercu: 'Le sujet étudie la transformée de Mellin et l''utilise pour relier la fonction partie fractionnaire $\rho(x) = \{1/x\}$ à la fonction zêta de Riemann, prolongée méromorphiquement au demi-plan
    $\operatorname{Re}(s) > 0$ via la série alternée $G$, avec $M\rho(s) = -\zeta(s)/s$ pour $0 < \operatorname{Re}(s) < 1$. Il démontre le sens « facile » du critère de Báez-Duarte : si l''indicatrice
    de $\left]0, 1\right]$ est dans l''adhérence $L^2$ de l''espace engendré par les $x \mapsto \rho(nx)$, alors $\zeta$ ne s''annule pas dans la bande $1/2 < \operatorname{Re}(s) < 1$. Il construit enfin
    un opérateur continu invariant $V$ de $L^2(\left]0, +\infty\right[)$ vérifiant $V\rho = J\rho$ et s''en sert pour montrer qu''une suite construite avec la fonction de Möbius converge simplement vers
    cette indicatrice mais ne converge pas dans $L^2$.'
