  nom: Nombres complexes et géométrie du triangle, fonctions exponentielle et logarithme, QCM de probabilités, équations diophantiennes ou distance entre deux droites
  apercu: Le premier exercice place en nombres complexes le centre du cercle circonscrit, l'orthocentre et le centre de gravité d'un triangle, et montre qu'ils sont alignés. Le deuxième étudie $f(x) = x\mathrm{e}^x
    - 1$ pour minimiser la distance verticale entre les courbes de l'exponentielle et du logarithme, puis calcule une aire avec une primitive de $\ln$. Le troisième est un QCM de probabilités (répétition
    d'épreuves, loi exponentielle, loi binomiale, indépendance). Le dernier résout, pour les spécialistes, l'équation $11x - 7y = 5$ et étudie modulo 5 l'équation $11x^2 - 7y^2 = 5$, et construit, pour
    les autres, la perpendiculaire commune à deux droites de l'espace et la distance entre elles.
