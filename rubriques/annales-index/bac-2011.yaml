  nom: Plans, barycentre et sphère, QCM de probabilités, nombres complexes ou similitudes directes, suite récurrente et logarithme
  apercu: Le premier exercice établit que deux plans sont perpendiculaires, utilise un barycentre pour reconnaître une sphère et détermine son intersection avec un plan. Le deuxième est un QCM de probabilités
