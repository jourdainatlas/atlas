  apercu: Le premier exercice est un vrai-faux justifié sur les nombres complexes (triangle, ensemble défini par une égalité de modules, puissances, argument). L'exercice 2 de l'enseignement obligatoire
    modélise une suite de parties d'un jeu vidéo par un arbre pondéré et aboutit à la suite $p_{n+1} = \frac{1}{5}p_n + \frac{3}{5}$, dont on établit la forme explicite par récurrence, la limite et un seuil
    ; celui de spécialité étudie la divisibilité des termes de la suite d'entiers $u_{n+1} = 10u_n + 21$ à l'aide de congruences et du petit théorème de Fermat. Le troisième redémontre la formule d'intégration
    par parties, étudie $f(x) = x^2\ln x$, cherche la tangente passant par l'origine et calcule le volume d'un solide de révolution. Le dernier, dans un cube, utilise un barycentre, l'orthogonalité, un
    volume de tétraèdre et la distance d'un point à un plan dont on cherche le maximum.
