  nom: Suite géométrique définie par des milieux, vrai-faux de complexes et probabilités ou d'arithmétique et similitudes, angle maximal dans un cube, fonctions exponentielles et intégrales
  apercu: Le premier exercice définit une suite de points par des milieux successifs et ramène la récurrence $a_{n+2} = \frac{a_n + a_{n+1}}{2}$ à une suite géométrique pour obtenir la limite. Le deuxième
    est un vrai-faux, sur les nombres complexes, la loi exponentielle et des tirages avec remise pour les non-spécialistes, sur une équation diophantienne, une congruence, des similitudes et une section
    de la surface $z = 4xy$ pour les spécialistes. Le troisième cherche dans un cube la position d'un point de la diagonale qui rend maximal un angle, en se ramenant à la minimisation d'une distance. Le
    dernier étudie $x\mathrm{e}^{1-x}$ et $x^2\mathrm{e}^{1-x}$, établit par intégration par parties une relation entre les intégrales $I_n$, calcule une aire entre les courbes et se ramène à l'équation
    $\mathrm{e}^a = a^2 + a + 1$.
  pages: 6
