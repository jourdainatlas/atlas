  nom: QCM de géométrie dans l'espace, probabilités et loi binomiale, fonction exponentielle et fonction intégrale, nombres complexes ou similitude et équation diophantienne
  apercu: Le premier exercice est un QCM de géométrie dans l'espace sur les positions relatives de droites et de plans, l'ensemble des points équidistants de deux points et un ensemble défini par une condition
    barycentrique. Le deuxième dénombre des tirages simultanés de bulletins, applique la formule des probabilités totales et une probabilité conditionnelle, puis une loi binomiale. Le troisième étudie la
    fonction $f(x) = 1 - \frac{4\mathrm{e}^x}{\mathrm{e}^{2x} + 1}$, sa symétrie et son signe, puis la fonction $F(x) = \int_0^x f(t)\,\mathrm{d}t$ et sa limite en $+\infty$. Le dernier commence par une
    restitution de connaissances sur l'écriture complexe d'une rotation (non-spécialistes) ou d'une similitude directe (spécialistes), puis étudie un quadrilatère défini par des transformations, ou les
    points à coordonnées entières de deux droites.
