  nom: Suite récurrente, probabilités conditionnelles, fonction logarithme et aire, nombres complexes, géométrie dans l'espace ou arithmétique
  apercu: Le premier exercice conjecture graphiquement puis démontre la monotonie et la convergence de la suite $u_{n+1} = f(u_n)$ avec $f(x) = 3 - \frac{4}{x+1}$ et $u_0 = 4$. Le deuxième tire un dé dans
    une urne contenant deux dés verts et un dé rouge et calcule, par probabilités totales et conditionnelles, la probabilité que le dé soit rouge sachant qu'on a obtenu 6 à chacun de $n$ lancers. Le troisième
    étudie $g(x) = x^2(1 - \ln x)$, sa tangente au point d'abscisse 1 et une aire, et le quatrième résout $z^2 - 2z + 5 = 0$ pour étudier un triangle et des points cocycliques. Le dernier est un vrai-faux,
    de géométrie dans l'espace pour les non-spécialistes, d'arithmétique et de sections d'un cône pour les spécialistes.
  pages: 5
