  nom: Fonction logarithme et intégration par parties, géométrie dans l'espace ou paraboloïde et équation diophantienne, nombres complexes, suite de probabilités et loi binomiale
  apercu: Le premier exercice étudie $f(x) = x\ln x - 1$, isole son unique zéro $\alpha$ et calcule par intégration par parties l'intégrale de $f$ entre $\alpha$ et 4. Le deuxième détermine, pour les non-spécialistes,
    la droite d'intersection de deux plans et ses points communs avec une sphère, et pour les spécialistes des sections du paraboloïde $z = x^2 + y^2$ et ses points à coordonnées entières sur le plan $-3x
    + 2y = 1$. Le troisième relie, en nombres complexes, la médiatrice et le cercle unité, puis étudie un triangle dont l'origine est à la fois le centre de gravité et le centre du cercle circonscrit. Le
    dernier ramène l'enchaînement de parties gagnées ou perdues à une suite arithmético-géométrique, puis étudie un jeu avec la loi binomiale.
  pages: 6
