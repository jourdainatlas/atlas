  nom: Loi binomiale et loi exponentielle, fonction logarithme et suite récurrente, plans et sphère, nombres complexes ou symétrie et congruences
  apercu: Le premier exercice modélise des pannes de moteurs par une loi binomiale puis par une loi exponentielle, dont il calcule la durée de vie moyenne comme limite d'une intégrale. Le deuxième étudie
    $f(x) = x^2 + 4\ln x$ et son zéro $\alpha$, approche $\alpha$ par la suite $u_{n+1} = \mathrm{e}^{-\frac{1}{4}u_n^2}$, puis montre qu'un seul point de la courbe de $2\ln x$ est le plus proche de l'origine.
    Le troisième démontre qu'un vecteur de coordonnées $(a, b, c)$ est normal au plan $ax + by + cz + d = 0$, puis pose un QCM sur des plans, une droite et une sphère. Le dernier étudie l'application $z'
    = \frac{z - \mathrm{i}}{\overline{z} + \mathrm{i}}$ (non-spécialistes), ou l'écriture complexe d'une symétrie orthogonale et les points à coordonnées entières dont l'image l'est aussi, à l'aide de congruences
    modulo 13 (spécialistes).
