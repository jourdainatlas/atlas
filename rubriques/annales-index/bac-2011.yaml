  nom: Fonctions logarithme et aire entre deux courbes, rotations et carrés dans le plan complexe, géométrie du cube, loi exponentielle ou décomposition en facteurs premiers
  apercu: Le premier exercice étudie $f(x) = \frac{\ln x}{x}$ et $g(x) = \frac{(\ln x)^2}{x}$, la position relative de leurs courbes et l'aire comprise entre elles de 1 à $\mathrm{e}$. Le deuxième utilise
    des rotations du plan complexe pour étudier les carrés construits extérieurement sur les côtés d'un triangle. Le troisième place dans un cube le point d'intersection d'une diagonale et d'un plan, montre
    que c'est un projeté orthogonal et classe le tétraèdre $EAFH$ selon les aires de ses faces et l'orthogonalité de ses arêtes opposées. Le dernier traite, pour les non-spécialistes, une loi exponentielle
    (avec une restitution de connaissances sur la durée de vie sans vieillissement) et une loi binomiale, et pour les spécialistes l'existence d'une décomposition en facteurs premiers et les points à coordonnées
    entières de l'intersection de la surface $z = xy$ avec le cylindre $x^2 + z^2 = 1$ puis avec les plans $z = n^4 + 4$.
  pages: 7
