  nom: Fonction logarithme, primitive et aires, tétraèdre régulier et géométrie dans l'espace, sections de surfaces et arithmétique, probabilités et espérance
  apercu: Le long premier exercice commence par un QCM de lecture graphique sur les limites et les asymptotes, étudie $f(x) = \ln x + 1 - \frac{1}{x}$ et sa primitive $F(x) = x\ln x - \ln x$, encadre la
    solution de $F(x) = 1 - \frac{1}{\mathrm{e}}$, puis calcule des aires entre les courbes de $\frac{1}{x}$ et de $\ln x + 1$. L'exercice 2 de l'enseignement obligatoire démontre que les médianes d'un
    tétraèdre régulier sont orthogonales aux faces opposées et concourantes, puis examine un tétraèdre quelconque en coordonnées ; celui de spécialité étudie les sections des surfaces $z = (x-y)^2$ et $z
    = xy$ par des plans, puis montre que leur seul point commun à coordonnées entières naturelles est l'origine. Le dernier exercice étudie un jeu de fléchettes avec un arbre pondéré, la répétition indépendante
    de parties et l'espérance d'un gain.
