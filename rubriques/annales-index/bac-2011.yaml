  nom: Rotations dans le plan complexe, loi exponentielle, barycentres et sphère ou théorèmes de Gauss et de Fermat, fonction exponentielle et suite récurrente
  apercu: Le premier exercice compose des rotations du plan complexe pour obtenir un rectangle puis un parallélogramme, et cherche l'ensemble des points pour lesquels ce parallélogramme est un rectangle.
    Le deuxième calcule la probabilité de tirer deux ordinateurs défectueux, puis exploite une loi exponentielle et la répétition d'épreuves indépendantes. Le troisième, au choix, établit par restitution
    de connaissances qu'une condition barycentrique définit une sphère et l'applique dans un cube, ou démontre le théorème de Gauss puis cherche, avec le petit théorème de Fermat, les nombres premiers qui
    divisent un terme de la suite $u_n = 2^n + 3^n + 6^n - 1$. Le dernier étudie $g(x) = \mathrm{e}^x - x - 1$, la position de la courbe de $f(x) = \frac{\mathrm{e}^x - 1}{\mathrm{e}^x - x}$ par rapport
    à la droite $y = x$, une aire, et la suite $u_{n+1} = f(u_n)$.
