  nom: 'Contrôle antidopage : fonction homographique et valeur prédictive positive, fonction $2x\mathrm{e}^{-x}$ et suite récurrente convergeant vers $\ln(2)$, équation différentielle $y'' = y - \cos(x)
    - 3\sin(x)$, hauteurs d''un tétraèdre'
  apercu: Le premier exercice étudie la fonction $f(x) = \frac{0{,}96x}{0{,}93x + 0{,}03}$, puis l'utilise pour exprimer la valeur prédictive positive d'un test antidopage en fonction de la proportion $x$
    de sportifs dopés, à l'aide d'un arbre pondéré et de la formule de Bayes. Le deuxième étudie $f(x) = 2x\mathrm{e}^{-x}$ sur $[0, 1]$, montre par récurrence que la suite $u_{n+1} = f(u_n)$ est croissante
    et bornée, établit qu'elle converge vers $\ln(2)$ et complète un script Python de seuil. Le troisième résout l'équation $y' = y - \cos(x) - 3\sin(x)$ à l'aide d'une solution particulière, détermine
    la solution nulle en 0 et calcule une intégrale. Le quatrième établit une équation du plan $(ABC)$, montre que deux hauteurs du tétraèdre $ABCD$ sont sécantes et calcule la distance de $D$ au plan $(ABC)$.
  pages: 4
