  nom: 'Groupes sanguins : probabilités conditionnelles et loi binomiale, vrai-faux sur une suite arithmético-géométrique et l''équation $y'' = \frac{3}{2}y + 2$, fonction $(x^2 - 4)\mathrm{e}^{-x}$ et
    suite d''intégrales, distance d''un point à un plan et tétraèdre trirectangle'
  apercu: Le premier exercice exploite la répartition des groupes sanguins en France pour calculer des probabilités conditionnelles comme $P_{\mathrm{Rh}+}(A)$, puis étudie le nombre $X$ de donneurs universels
    parmi 50 personnes avec une loi binomiale, une fonction Python cumulant les probabilités et la recherche d'un effectif minimal. Le deuxième exercice est un vrai-faux sur la suite $u_{n+1} = \frac{1}{3}u_n
    + 2$ et sur l'équation différentielle $y' = \frac{3}{2}y + 2$. Le troisième étudie la fonction $f(x) = (x^2 - 4)\mathrm{e}^{-x}$, établit par intégration par parties une relation de récurrence pour
    $I_n = \int_{-2}^{0} x^n\mathrm{e}^{-x}\,\mathrm{d}x$ et en déduit l'aire d'un domaine. Le quatrième calcule la distance de $O$ au plan $(ABC)$ puis le volume du tétraèdre $OABC$ afin de démontrer que
    le carré de l'aire de $ABC$ est la somme des carrés des aires des trois autres faces.
