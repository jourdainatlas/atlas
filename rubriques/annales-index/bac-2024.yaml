  nom: 'Objets rares d''un jeu vidéo : probabilités conditionnelles et loi binomiale, QCM de géométrie dans l''espace, fonction $x\ln(x^2) - \frac{1}{x}$ et convexité, intégrales $\int_0^{\pi} \mathrm{e}^{-nx}\sin(x)\,\mathrm{d}x$'
  apercu: 'Le premier exercice calcule par un arbre pondéré la probabilité de tirer une épée et celle qu''une épée soit rare, puis étudie une loi binomiale sur 30 défis (espérance, $P(X < 6)$, plus grand
    $k$ tel que $P(X \geqslant k) \geqslant 0{,}5$) et le nombre minimal de tirages pour obtenir au moins un objet rare avec une probabilité d''au moins $0{,}95$. Le deuxième exercice est un QCM de géométrie
    dans l''espace : représentation paramétrique, appartenance d''un point à une droite, position de deux droites et plan perpendiculaire à une droite. Le troisième exercice étudie $f(x) = x\ln(x^2) - \frac{1}{x}$,
    d''abord par lecture graphique, puis par le calcul (limites, $f''''(x) = \frac{2(x+1)(x-1)}{x^3}$, convexité, variations, solution $\alpha$ de $f(x) = 0$ vérifiant $\alpha^2 = \exp\left(\frac{1}{\alpha^2}\right)$).
    Le quatrième exercice étudie $I_n = \int_0^{\pi} \mathrm{e}^{-nx}\sin(x)\,\mathrm{d}x$ : positivité, décroissance, majoration, limite, puis deux intégrations par parties qui donnent $I_n = \frac{1 +
    \mathrm{e}^{-n\pi}}{n^2 + 1}$ et un script Python de seuil.'
  pages: 4
