  apercu: Ce document n'est pas une épreuve mais un recueil de huit exercices d'exemple publié pour la session 2024, qui couvre l'ensemble du programme du cycle terminal. Le premier résout l'équation différentielle
    $y' + y = \mathrm{e}^{-x}$, puis reconnaît sur une annexe la courbe de $h(x) = \mathrm{e}^{-x}$ et détermine le paramètre $k$ de $f_k(x) = (x+k)\mathrm{e}^{-x}$ ; le deuxième étudie la suite $I_n =
    \int_0^1 x^n\mathrm{e}^{x}\,\mathrm{d}x$ par intégration par parties, programme Python, encadrement et limite. Le troisième combine arbre pondéré, espérance et variance d'une note $X = X_1 + X_2$, loi
    binomiale et moyenne d'un échantillon $M_n$, dont il fait encadrer la probabilité d'un écart à l'espérance ; les quatrième et cinquième sont des QCM, l'un sur un prisme droit (vecteur normal, parallélisme,
    base, volume), l'autre sur la trigonométrie, la convexité, le dénombrement et le nombre de « pile » en $n$ lancers. Les sixième et huitième sont des vrai-faux sur les suites $u_{n+1} = \frac{u_n}{1
    + 2u_n}$ et $u_{n+1} = 3u_n + 1$, la seconde avec deux fonctions Python, tandis que le septième étudie le minimum des fonctions $f_k(x) = x + k\mathrm{e}^{-x}$ et se conclut par une affirmation à justifier
    sur l'alignement des points $A_k$ de minimum.
