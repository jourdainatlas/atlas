  apercu: 'Le premier exercice calcule par un arbre pondéré la probabilité qu''un véhicule soit hybride rechargeable et celle qu''il soit neuf sachant qu''il l''est, puis utilise une loi binomiale sur 500
    véhicules et cherche le plus petit $n$ tel que $q_n \geqslant 0{,}9999$. Le deuxième exercice, dans un pavé droit, établit l''équation $2x + 6y + 3z - 9 = 0$ du plan $(HMF)$, teste le parallélisme avec
    un autre plan, calcule l''intersection $N$ de $(DG)$ avec ce plan et examine si un point donné est le projeté orthogonal de $G$. Le troisième exercice étudie $u_0 = \frac{1}{2}$, $u_{n+1} = g(u_n)$
    avec $g(x) = 2x - x^2$ : encadrement par récurrence, convergence et limite, puis suite géométrique de raison 2 $v_n = \ln(1 - u_n)$ donnant la forme explicite, et script Python de seuil. Le quatrième
    exercice vérifie une primitive de $a\ln(x)$, calcule l''aire d''un domaine sous la courbe et montre que la longueur $AB$ définie par la tangente en $x_0$ ne dépend pas de $x_0$.'
