  nom: 'Équation différentielle $y'' + \frac{1}{4}y = 20\mathrm{e}^{-\frac{1}{4}x}$ et dichotomie, urnes : probabilités conditionnelles, loi binomiale et combinaisons, vrai-faux sur les suites et une suite
    d''intégrales, distance entre deux droites non coplanaires'
  apercu: Le premier exercice résout l'équation différentielle $y' + \frac{1}{4}y = 20\mathrm{e}^{-\frac{1}{4}x}$ à l'aide d'une solution particulière $ax\mathrm{e}^{-\frac{1}{4}x}$, étudie la solution
    $f(x) = (20x + 8)\mathrm{e}^{-\frac{1}{4}x}$ (variations, maximum) et encadre la solution de $f(x) = 8$ dans $[14, 15]$ par une fonction Python de dichotomie. Le deuxième exercice traite deux urnes
    par un arbre pondéré (probabilités totales, conditionnelle inversée), puis une loi binomiale et l'inéquation $1 - 0{,}72^n \geqslant 0{,}9$, enfin un tirage simultané de deux boules dénombré par combinaisons.
    Le troisième exercice est un vrai-faux justifié sur la convergence de $u_n = \frac{25 + (-1)^n}{n}$, la nature de la suite $t_n = \frac{k}{w_n}$, la monotonie de $v_{n+1} = \ln(1 + v_n)$ et la relation
    $I_{n+1} = \mathrm{e} - (n+1)I_n$ pour $I_n = \int_1^{\mathrm{e}} (\ln x)^n\,\mathrm{d}x$. Le quatrième exercice montre que deux droites sont non coplanaires et calcule leur distance à l'aide d'un plan
    $P$ d'équation $-2x + y + 5z + 5 = 0$ et de la perpendiculaire commune $(EF)$.
