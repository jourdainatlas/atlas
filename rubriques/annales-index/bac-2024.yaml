  nom: 'Fonction $(4x - 2)\mathrm{e}^{-x+1}$ : lecture graphique, convexité, primitive et intégrale, pyramide à base trapézoïdale dans l''espace, loi binomiale et test de dépistage, vrai-faux sur les suites,
    Python et intégrale'
  apercu: Le premier exercice associe graphiquement une fonction à ses dérivées et à une primitive, puis étudie $f(x) = (4x - 2)\mathrm{e}^{-x+1}$ (variations, convexité, point d'inflexion), en cherche
    une primitive et calcule une intégrale pour estimer la surface d'un mur de piste de trottinette. Le deuxième montre que $SABDC$ est une pyramide de base le trapèze $ABDC$, calcule sa hauteur grâce au
    projeté orthogonal $I$ de $S$ sur $(ABC)$ et en déduit son volume. Le troisième utilise une loi binomiale pour un échantillon de 100 adultes, puis un arbre pondéré et la formule de Bayes pour un test
    de sensibilité 0,8 et de spécificité 0,99, et retrouve enfin, dans un autre pays, la proportion d'individus infectés à partir de la proportion de tests positifs. Le quatrième est un vrai-faux sur la
    convergence des suites, un programme Python, la comparaison de deux gains dont l'un double chaque jour et la monotonie de $v_n = \int_1^n \ln x\,\mathrm{d}x$.
