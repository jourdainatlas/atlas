  nom: Vrai-faux (loi normale, valeurs intermédiaires, droites de l'espace), partage d'une aire et suite récurrente, loi binomiale, intervalle de confiance et probabilités conditionnelles, spirale de points
    complexes ou chiffrement de Hill
  apercu: Le premier exercice est un vrai-faux portant sur une loi normale, sur l'unicité de la solution de $x - \cos x = 0$ dans $\left[0, \frac{\pi}{2}\right]$ et sur la position relative de droites et
    d'un plan de l'espace. Le deuxième exercice cherche, à l'aide d'une primitive, le réel $a$ qui partage en deux aires égales le domaine situé sous une courbe, puis approche ce réel pour $f(x) = 4 - 3x^2$
    par la suite $u_{n+1} = g(u_n)$ avec $g(x) = \frac{x^3}{4} + \frac{3}{8}$. Le troisième exercice traite un sondage par une loi binomiale, un intervalle de confiance et un arbre pondéré qui corrige l'effet
    des réponses non sincères. Au choix, les non-spécialistes étudient l'aire délimitée par une ligne brisée en spirale joignant les points d'affixes $z_k = \left(1 + \frac{k}{n}\right)\mathrm{e}^{\mathrm{i}\frac{2k\pi}{n}}$,
    avec deux algorithmes, et les spécialistes le chiffrement de Hill par une matrice $2 \times 2$ et un inverse modulo 26.
