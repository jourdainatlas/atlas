  nom: Probabilités totales et loi normale, intégrale dépendant d'un paramètre, suite arithmético-géométrique et fonction logistique avec contrôle de qualité, réflexions dans un coin de cube ou chiffrement
    de Hill
  apercu: Le premier exercice examine en vrai-faux des probabilités totales et conditionnelles sur des fleurs de fraisier, puis détermine l'écart-type d'une loi normale et des intervalles de conformité.
    Le deuxième étudie l'intégrale $I(a) = \int_0^1 (a\mathrm{e}^{ax} + a)\,\mathrm{d}x$ et se demande s'il existe une valeur de $a$ pour laquelle elle vaut 2, question qui relève du théorème des valeurs
    intermédiaires. Le troisième modélise une masse de bactéries d'abord par la suite $u_{n+1} = 1{,}2u_n - 100$ avec un algorithme de seuil, puis par la fonction $f(t) = \frac{50}{1 + 49\mathrm{e}^{-0{,}2t}}$,
    et contrôle une proportion par un intervalle de fluctuation. Au choix, les non-spécialistes suivent un rayon lumineux réfléchi par les trois faces d'un catadioptre et étudient la coplanarité des rayons,
    et les spécialistes résolvent $9d - 26m = 1$ puis chiffrent et déchiffrent par la méthode de Hill avec une matrice inversible modulo 26.
