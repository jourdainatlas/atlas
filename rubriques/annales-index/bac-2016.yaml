  nom: Double pyramide dans l'espace, loi binomiale et probabilité conditionnelle, intégrale et suite d'intégrales de fonctions exponentielles, vrai-faux (loi normale, complexes, exponentielle) ou (congruences,
    graphe probabiliste), suite géométrique complexe
  apercu: Le premier exercice place dans un repère un solide formé de deux pyramides à base carrée pour obtenir un vecteur normal, une équation de plan, le parallélisme de deux plans et une section. Le
    deuxième exercice modélise un lance-balle par une loi binomiale, examine si 42 balles à droite sur 100 mettent en doute le bon fonctionnement de l'appareil, puis calcule une probabilité conditionnelle.
    Le troisième exercice calcule l'intégrale sur $[0, 1]$ de $f(x) = \frac{1}{1 + \mathrm{e}^{1-x}}$, puis fait conjecturer et démontrer le sens de variation de la suite $u_n = \int_0^1 f_n(x)\,\mathrm{d}x$
    avec $f_n(x) = \frac{1}{1 + n\mathrm{e}^{1-x}}$ et pose la question de sa limite. Le quatrième exercice est un vrai-faux portant, au choix, sur une loi normale, des nombres complexes, une fonction exponentielle
    et un algorithme, ou sur un système de congruences et un graphe probabiliste à deux états ; le cinquième étudie la suite complexe $z_{n+1} = \frac{1}{2}\mathrm{i}\,z_n + 5$ par la suite géométrique
    $u_n = z_n - z_A$ et établit un alignement.
