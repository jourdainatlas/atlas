  nom: Probabilités conditionnelles, lois normale et binomiale, fonction avec logarithme et volume d'une cuve, puissances de $1 + \mathrm{i}$, pyramide régulière ou chaîne de Markov à trois états
  apercu: Le premier exercice traite la production de billes par un arbre pondéré, des lois normales dont on détermine un écart-type, une loi binomiale avec une prise de décision par intervalle de fluctuation
    et le nombre minimal de billes pour obtenir au moins une bille noire avec une probabilité de 99 %. Le deuxième modélise une cuve par $f(x) = x\ln\left(\frac{x}{2}\right) - x + 2$, encadre puis calcule
    une aire par une primitive et interprète un algorithme de dichotomie. Le troisième cherche à partir de quel rang les points d'affixe $(1+\mathrm{i})^n$ sortent d'un carré. Au choix, les non-spécialistes
    étudient dans une pyramide régulière l'alignement de points, la section par le plan $(BCI)$ et la position relative de deux plans, et les spécialistes modélisent des échanges de boules entre deux urnes
    par une matrice de transition diagonalisée dont ils déduisent les probabilités limites.
