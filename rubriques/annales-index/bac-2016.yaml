  nom: Suite d'intégrales de fonctions exponentielles, droite orthogonale à un plan dans un cube, QCM sur complexes, fonction et loi exponentielle, suites de matrices
  apercu: Le premier exercice étudie la suite $u_n = \int_0^1 \frac{\mathrm{e}^{-(n-1)x}}{1 + \mathrm{e}^{x}}\,\mathrm{d}x$, d'abord graphiquement puis en démontrant sa convergence à partir du signe de
    $f_{n+1} - f_n$, et obtient sa limite grâce à la relation $u_n + u_{n+1} = \frac{1 - \mathrm{e}^{-n}}{n}$. Le deuxième montre dans un cube que la droite $(BH)$ est perpendiculaire au plan $(DEG)$ et
    se demande ce que représente pour le triangle $DEG$ leur point d'intersection. Le troisième est un QCM sur une équation du second degré dans $\mathbb{C}$, l'argument de $1 + \mathrm{e}^{\mathrm{i}\theta}$,
    la fonction $\mathrm{e}^{-x}\sin x$ et la loi exponentielle. Ce sujet ne comporte que l'exercice de spécialité, qui suit la proportion d'ordinateurs défaillants d'un parc par la relation $X_{n+1} =
    AX_n$ puis $X_{n+1} = DX_n + B$ et en déduit le comportement à long terme.
  pages: 4
