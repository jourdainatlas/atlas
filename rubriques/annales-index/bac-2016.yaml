  nom: Formule de Bayes, intervalle de confiance et loi exponentielle, vrai-faux de géométrie dans l'espace, fonction logarithme et suite récurrente ou droites rationnelles et points à coordonnées entières,
    angle de tir maximal au rugby
  apercu: Le premier exercice traite de composants électroniques par les probabilités totales et la formule de Bayes, par un intervalle de confiance et une taille d'échantillon, puis par une durée de vie
    de loi exponentielle dont on établit $P(T \leqslant t) = 1 - \mathrm{e}^{-\lambda t}$ avant d'en calculer l'espérance. Le deuxième exercice est un vrai-faux sur des points, un vecteur normal, une droite
    et un plan de l'espace. Au choix, les non-spécialistes étudient $f(x) = x - \ln(x^2 + 1)$, un algorithme de seuil et la suite $u_{n+1} = u_n - \ln(u_n^2 + 1)$, dont ils établissent la convergence et
    la limite, et les spécialistes cherchent une condition nécessaire et suffisante pour qu'une droite rationnelle $y = \frac{m}{n}x - \frac{p}{q}$ passe par un point à coordonnées entières, à l'aide des
    théorèmes de Bézout et de Gauss. Le dernier exercice cherche la position qui maximise l'angle de tir d'une transformation au rugby, à l'aide de la fonction tangente et du minimum de $x \mapsto x + \frac{765}{x}$.
