  nom: Probabilités conditionnelles, lois binomiale et exponentielle, fluctuation, cercle et droite dans le plan complexe, position relative de deux courbes exponentielles, section d'un cube ou équation
    diophantienne et puissances d'une matrice
  apercu: Le premier exercice traite des ampoules par un arbre pondéré, une loi binomiale, une loi exponentielle dont on démontre l'absence de mémoire et un intervalle de fluctuation pour contester une
    affirmation. Le deuxième détermine, selon le réel $a$, le nombre de points communs au cercle $|z - 2| = 1$ et à la droite $y = ax$. Le troisième étudie $f(x) = x\mathrm{e}^{1-x^2}$, montre à l'aide
    de $\Phi(x) = \ln x - x^2 + x$ que sa courbe reste sous celle de $\mathrm{e}^{1-x}$ en les touchant en un seul point avec la même tangente, puis calcule une aire. Au choix, les non-spécialistes étudient
    la section hexagonale d'un cube par un plan parallèle à $(BGE)$, et les spécialistes résolvent $7x - 3y = 1$ puis montrent par diagonalisation d'une matrice que des points définis par récurrence restent
    sur la droite $7x - 3y - 1 = 0$.
