  apercu: Le premier exercice étudie $f(x) = x\mathrm{e}^{-x}$ et une primitive, exprime l'aire $H(a)$ comprise entre la courbe et la droite $y = ax$, justifie l'existence d'un unique $\alpha$ tel que $H(\alpha)
    = 0{,}5$ et l'encadre par un algorithme de dichotomie. Le deuxième exercice est un vrai-faux sur une loi exponentielle de durée de vie moyenne quatre ans et sur les solutions de $z^3 - 3z^2 + 3z = 0$,
    et le troisième combine une prise de décision par intervalle de fluctuation, la formule de Bayes et la détermination de l'écart-type d'une loi normale. Le quatrième exercice demande de prouver la convergence
    de la suite $u_{n+1} = \frac{1}{2 - u_n}$, dont un tableur donne les premiers termes, et le cinquième, sans variante de spécialité dans ce document, étudie un plan, la nature et l'aire d'un triangle,
    un projeté orthogonal et le volume d'un tétraèdre.
