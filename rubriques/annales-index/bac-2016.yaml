  nom: Loi normale et réponse aléatorisée avec intervalle de confiance, construction du pentagone régulier par les complexes, section d'un cube et distance minimale ou équation diophantienne et codage matriciel,
    rectangle sous une courbe logarithme, stérilisation par suite et intégrale
  apercu: Le premier exercice détermine l'écart-type d'une loi normale du temps de connexion, puis exploite un protocole de réponse aléatorisée par un dé, un arbre pondéré et un intervalle de confiance.
    Le deuxième exercice justifie par les nombres complexes et la valeur de $\cos\left(\frac{4\pi}{5}\right)$ une construction à la règle et au compas du pentagone régulier. Au choix, les non-spécialistes
    construisent la section d'un cube par le plan $(IJK)$, en obtiennent une équation grâce au vecteur normal $\overrightarrow{AG}$ et minimisent une distance, et les spécialistes résolvent l'équation $3a
    - 5b = 3$ puis codent et décodent des mots avec une matrice $2 \times 2$ et l'inverse de 3 modulo 26. Le quatrième exercice étudie l'aire d'un rectangle construit sur la courbe de $f(x) = 2 - \ln\left(\frac{x}{2}\right)$,
    et le cinquième la température d'une boîte de conserve, d'abord par la suite $T_n = 100 - 75 \times 0{,}85^n$, puis par $f(t) = 100 - 75\mathrm{e}^{-\frac{\ln 5}{10}t}$ et une aire exprimée par une
    intégrale.
