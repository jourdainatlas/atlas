    choix, un dé fait retourner deux pièces, ce qu'on étudie par un algorithme puis par la suite arithmético-géométrique $y_{n+1} = -\frac{1}{3}y_n + \frac{2}{3}$, ou trois pièces, ce qu'on étudie par la
    matrice $M$ telle que $U_{n+1} = U_n M$. Le dernier exercice étudie la vitesse d'un colis parachuté, donnée par $v_1(t) = 5 \times \frac{\mathrm{e}^{0{,}3t} - 1}{\mathrm{e}^{0{,}3t} + 1}$ ou par $v_2(t)
    = 32{,}7\left(1 - \mathrm{e}^{-0{,}3t}\right)$, puis la distance parcourue comme intégrale de la vitesse.
