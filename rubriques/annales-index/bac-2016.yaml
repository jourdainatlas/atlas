  nom: Fonction $2x\mathrm{e}^{-x^2}$ comme densité, vrai-faux sur les complexes, suite homographique, pyramide équilatère et volumes, lois normale et exponentielle ou rep-units et congruences
  apercu: Le premier exercice détermine $f(x) = 2x\mathrm{e}^{-x^2}$ par une condition de tangence, l'étudie, calcule $\int_0^m f(t)\,\mathrm{d}t$ et sa limite, puis la reconnaît comme densité et en calcule
    la médiane. Le deuxième est un vrai-faux sur une médiatrice, une équation de degré 3 dans $\mathbb{C}$ et un argument de $(-\sqrt{3} + \mathrm{i})^8$, et le troisième conjecture puis démontre l'expression
    explicite de la suite $u_{n+1} = \frac{1}{2 - u_n}$. Le quatrième calcule des volumes dans une pyramide équilatère, d'abord sans repère puis avec un vecteur normal et un projeté orthogonal, pour décider
    si une découpe partage un gâteau équitablement. Au choix, les non-spécialistes traitent des durées de fonctionnement par une loi normale, une loi exponentielle sans vieillissement, l'indépendance et
    un intervalle de fluctuation, et les spécialistes étudient par congruences la divisibilité des rep-units et montrent qu'aucun rep-unit supérieur à 1 n'est un carré.
  pages: 6
