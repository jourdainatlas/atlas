  nom: Fonction exponentielle à paramètre et valeur moyenne, QCM et problèmes de probabilités, tétraèdre régulier et section plane, nombres complexes et algorithme ou équation de Pell-Fermat et matrices
  apercu: 'Le premier exercice étudie la masse de crevettes $f_p(t) = \frac{100p}{1 - (1-p)\mathrm{e}^{-pt}}$ : encadrement, variations pour $p = 0{,}9$, limite en fonction de $p$, puis valeur moyenne sur
    $[0, 5]$ à l''aide d''une primitive donnée. Le deuxième réunit un QCM (formule de Bayes, taille minimale d''échantillon, écart-type d''une loi normale) et deux problèmes sur une loi exponentielle décalée
    de 12 mois et sur la taille d''un stock de médicaments. Le troisième coupe un tétraèdre régulier par le plan $2\sqrt{3}y + \sqrt{6}z - 9 = 0$ détermine la nature de la section, puis se demande si un
    point $M$ de l''arête $[BD]$ peut rendre le triangle $OIM$ rectangle en $M$. Au choix, les non-spécialistes cherchent des points d''affixes $x + \mathrm{i}$ et $y + \mathrm{i}$ vérifiant des conditions
    de module et d''argument, avec un algorithme et l''étude de $h = f - g$, et les spécialistes étudient l''équation $v^2 - 2u^2 = 1$ par des arguments de parité et l''itération d''une matrice.'
  pages: 7
