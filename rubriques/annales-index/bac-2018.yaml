  nom: Probabilités conditionnelles, loi normale et fluctuation, famille de fonctions exponentielles et intégrale, section d'un cube, suite récurrente et logarithme ou suite d'entiers et congruences
  apercu: Le premier exercice enchaîne un arbre pondéré avec une probabilité conditionnelle inversée, une loi normale dont on règle l'espérance pour atteindre 98 % de paquets conformes, puis un intervalle
    de fluctuation. Le deuxième fait conjecturer graphiquement le comportement de $f_2(x) = (x+2)\mathrm{e}^{-x}$, puis étudie la famille $f_m(x) = (x+m)\mathrm{e}^{-x}$ (limites, variations, tangentes
    en $0$ passant par un même point, signe) et la limite de $\int_{-2}^{x} f_2(t)\,\mathrm{d}t$. Le troisième coupe un cube par le plan $4x + 15z - 9 = 0$ et cherche un plan parallèle qui le partage en
    deux prismes de même volume. Au choix, les non-spécialistes étudient la suite $u_{n+1} = \mathrm{e} \times \sqrt{u_n}$ à l'aide de $v_n = \ln(u_n) - 2$, et les spécialistes la suite d'entiers $u_{n+1}
    = 3u_n + 1$ (termes consécutifs premiers entre eux, parité, congruences modulo $7$ et $5$).
  pages: 6
