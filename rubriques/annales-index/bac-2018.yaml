  nom: Fonction exponentielle et chaînette, probabilités conditionnelles et loi binomiale, tétraèdres orthocentriques, suite géométrique complexe ou équation de Pell-Fermat et nombres puissants
  apercu: Le premier exercice ramène l'égalité de la largeur et de la hauteur d'un arc de chaînette à l'équation $\mathrm{e}^x + \mathrm{e}^{-x} - 4x - 2 = 0$, étudie la fonction associée, localise sa solution
    par dichotomie et l'applique à la Gateway Arch. Le deuxième utilise un arbre pondéré sur la vaccination contre la grippe, puis une loi binomiale et son approximation par la loi normale centrée réduite.
    Le troisième examine si les hauteurs d'un tétraèdre sont concourantes, établit que les arêtes opposées d'un tétraèdre orthocentrique sont orthogonales et l'applique à un tétraèdre donné par coordonnées.
    Au choix, les non-spécialistes étudient la suite $z_{n+1} = \frac{3 - \mathrm{i}\sqrt{3}}{4}z_n$ et la longueur d'une ligne brisée, et les spécialistes l'équation $x^2 - 8y^2 = 1$ à l'aide d'une matrice
    pour obtenir une infinité de couples d'entiers consécutifs puissants.
