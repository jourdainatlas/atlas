  nom: Suite arithmético-géométrique et fonction exponentielle (refroidissement d'un four), nombres complexes et géométrie, loi normale, Bayes, fluctuation et confiance, géométrie dans l'espace ou chiffre
    de Rabin
  apercu: Le premier exercice modélise le refroidissement d'un four d'abord par la suite $T_n = 980 \times 0{,}82^n + 20$, puis par la fonction $f(t) = 980\mathrm{e}^{-\frac{t}{5}} + 20$ issue de la relation
    $f'(t) + \frac{1}{5}f(t) = 4$, dont on étudie les variations, la valeur moyenne sur 15 heures et l'abaissement horaire. Le deuxième multiplie les affixes de trois points par $j = -\frac{1}{2} + \mathrm{i}\frac{\sqrt{3}}{2}$
    et montre un alignement puis qu'un triangle est isocèle. Le troisième calibre des cristaux de sucre par des lois normales, applique la formule de Bayes, puis mène un test par intervalle de fluctuation
    et une estimation par intervalle de confiance. Au choix, les non-spécialistes étudient un tétraèdre $ABCD$ (distance minimale, vecteur normal, projeté orthogonal, volume), et les spécialistes le chiffre
    de Rabin, dont le déchiffrement passe par un système de congruences modulo $3$ et $11$.
