  nom: Probabilités conditionnelles, loi normale et fluctuation, cube et tétraèdre dans l'espace, fonctions exponentielle et trigonométriques et aire, suite arithmético-géométrique ou matrice de transition
  apercu: 'Le premier exercice traite la vente d''arbres abattus par un arbre pondéré à trois branches et la formule de Bayes, puis une loi normale d''espérance $4000$ et d''écart-type $300$ et un intervalle
    de fluctuation. Le deuxième étudie un tétraèdre $SELM$ posé sur un cube : parallélisme, plan $(BDL) : 3x + 3y + 2z - 18 = 0$, intersections, volume et mesure de l''angle $\widehat{SLE}$. Le troisième
    encadre $f(x) = \mathrm{e}^{-x}(-\cos x + \sin x + 1)$, en étudie les variations sur $[-\pi, \pi]$ et calcule l''aire du domaine compris entre sa courbe et celle de $g(x) = -\mathrm{e}^{-x}\cos x$.
    Au choix, les non-spécialistes étudient la suite $u_{n+1} = 0{,}95u_n + 76$ avec tableur et algorithme de seuil, et les spécialistes une matrice de transition $M = QDQ^{-1}$ pour l''évolution de cartes
    de pêche.'
