  apercu: Le premier exercice traite l'entretien d'un parc automobile par un arbre pondéré, la formule de Bayes et l'espérance du coût d'entretien, puis un intervalle de fluctuation et une loi normale d'espérance
    $450$ et d'écart-type $100$. Le deuxième étudie la fonction auxiliaire $g(x) = (x+2)\mathrm{e}^{x-4} - 2$, puis $f(x) = x^2 - x^2\mathrm{e}^{x-4}$, dont le maximum s'exprime à l'aide de la solution
    $\alpha$ de $g(x) = 0$, et calcule l'aire entre sa courbe et la parabole $y = x^2$. Le troisième est un vrai-faux sur une équation complexe, un ensemble de points, la suite $z_n = (1 - \mathrm{i}\sqrt{3})^n$
    et l'équation $\sin(x)(2\cos^2(x) - 1) = 0$. Le quatrième, pour les non-spécialistes, conjecture au tableur puis démontre le comportement de la suite $u_{n+1} = \frac{u_n}{u_n + 8}$ grâce à la suite
    géométrique $v_n = 1 + \frac{7}{u_n}$ ; le document ne contient pas d'exercice de spécialité.
