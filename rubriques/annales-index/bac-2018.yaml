  nom: Probabilités conditionnelles, loi normale et intervalle de fluctuation, fonction $10\mathrm{e}^{u(x)}$ et vitesse de croissance, droites non coplanaires et distance minimale, carré par les complexes,
    suite et logarithme ou nombres de Fermat
  apercu: 'Le premier exercice calcule des probabilités conditionnelles à partir d''une étude de marché, utilise une loi normale pour un stock de farine et teste la représentativité d''une clientèle par
    un intervalle de fluctuation. Le deuxième étudie $f(x) = 10\mathrm{e}^{u(x)}$ avec $u(x) = -\mathrm{e}^{2 - \frac{x}{10}}$ : variations, longueur au bout de vingt jours, possibilité d''atteindre 11
    cm, et maximum de la vitesse de croissance $f''$ par l''étude de $f''''$. Le troisième montre que deux droites de l''espace ne se coupent pas, calcule leur distance minimale à l''aide d''un vecteur
    normal commun et d''un calcul formel, puis la distance d''un point à l''une d''elles, et le quatrième démontre par les complexes qu''un quadrilatère est un carré. Au choix, les non-spécialistes étudient
    la suite $u_{n+2} = \frac{u_{n+1}^2}{ku_n}$ au tableur puis, pour $k = \mathrm{e}$, par la suite arithmétique $v_n = \ln(u_{n+1}) - \ln(u_n)$ et une somme, et les spécialistes réfutent la conjecture
    de Fermat sur les nombres $F_n = 2^{2^n} + 1$ et prouvent que deux nombres de Fermat distincts sont toujours premiers entre eux.'
  pages: 5
