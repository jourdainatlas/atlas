  nom: Fonction exponentielle, seuil et valeur moyenne, vrai-faux (lois exponentielle et binomiale, logarithme, complexes), loi normale et fluctuation puis suite de probabilités, section d'un cube ou chiffrement
    RSA
  apercu: 'Le premier exercice étudie le taux de dioxyde de carbone $f(t) = (0{,}8t + 0{,}2)\mathrm{e}^{-0{,}5t} + 0{,}03$ : valeurs, unicité d''un instant par le théorème des valeurs intermédiaires, algorithme
    de seuil et valeur moyenne à l''aide d''une primitive. Le deuxième est un vrai-faux sur une loi exponentielle, une loi binomiale, l''équation $\ln(6x - 2) + \ln(2x - 1) = \ln(x)$ et une équation complexe
    dont on se demande si les solutions sont les affixes de points d''un même cercle de centre le point d''affixe $2$. Le troisième détermine les paramètres d''une loi uniforme et d''une loi normale, mène
    un test par intervalle de fluctuation, puis établit à l''aide d''un arbre la relation $p_{n+1} = 0{,}5p_n + 0{,}4$ et en déduit $p_n = 0{,}8 + 0{,}2 \times 0{,}5^{n-1}$. Au choix, les non-spécialistes
    construisent la section d''un cube par le plan $(IJK)$ et étudient un projeté orthogonal, et les spécialistes mettent en œuvre le chiffrement RSA avec $N = 55$ et $c = 23$.'
  pages: 7
