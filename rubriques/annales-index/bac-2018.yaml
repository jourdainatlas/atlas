  nom: Lois exponentielle et normale, probabilités totales et loi binomiale (supermarché), maximum d'une fonction logarithme, perpendiculaire commune, courbe de poursuite par suite et par fonction ou matrices
    proies-prédateurs
  apercu: Le premier exercice démontre que l'espérance d'une loi exponentielle de paramètre $0{,}2$ vaut 5 grâce à la primitive $G(t) = (-t-5)\mathrm{e}^{-0{,}2t}$, détermine l'écart-type d'une loi normale,
    fixe une proportion minimale par la formule des probabilités totales et étudie le nombre de cartes gagnantes par une loi binomiale. Le deuxième montre que le maximum de $f(x) = bx + 2\ln(1-x)$ vaut
    $b - 2 + 2\ln\frac{2}{b}$ et en déduit les valeurs de $b$ pour lesquelles la hauteur maximale ne dépasse pas 1,6 mètre, puis l'angle de tir pour $b = 5{,}69$, et le troisième détermine la perpendiculaire
    commune à deux droites non coplanaires et prouve qu'elle réalise la distance minimale. Au choix, les non-spécialistes modélisent la poursuite d'un scooter par un chien, d'abord par une suite de points
    calculée au tableur, puis par la courbe de $f(x) = -2{,}5\ln(1 - 0{,}2x) - 0{,}5x + 0{,}05x^2$ et une tangente, et les spécialistes étudient deux modèles proies-prédateurs, l'un linéaire par $A = PDP^{-1}$,
    l'autre non linéaire au tableur avec recherche d'un état stable.
