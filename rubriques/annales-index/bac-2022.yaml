  nom: Probabilités totales, loi binomiale et coût moyen, fonction logarithme et convexité, suite arithmético-géométrique, géométrie dans l'espace
  apercu: Le premier exercice traite la production de composants sur trois chaînes par un arbre pondéré et la formule des probabilités totales, étudie le nombre de défectueux dans un lot par une loi binomiale
    et calcule un coût moyen de fabrication. Le deuxième étudie, à l'aide de la fonction auxiliaire $g(x) = 2(x - 1) - x\ln x$, les variations et la convexité de $f(x) = 3x - x\ln x - 2\ln x$ ainsi que
    son point d'inflexion. Le troisième modélise une population par la suite $u_{n+1} = 0{,}9u_n + 100$, l'étudie par récurrence et par une suite géométrique auxiliaire, et complète un programme Python
    de seuil. Le quatrième établit une équation du plan $(ABC)$, la nature et l'aire du triangle $ABC$, un angle par le produit scalaire et la distance de l'origine à ce plan.
