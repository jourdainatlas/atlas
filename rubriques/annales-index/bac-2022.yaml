  nom: Probabilités conditionnelles, loi binomiale et espérance, suite arithmético-géométrique, géométrie dans l'espace, vrai-faux sur la fonction exponentielle
  apercu: 'Le premier exercice traite le trajet de Paul vers la gare par un arbre pondéré et une probabilité conditionnelle inversée, puis compte les jours à vélo par une loi binomiale et calcule l''espérance
    d''un temps de trajet donné par un tableau. Le deuxième étudie la suite $T_{n+1} = 0{,}955T_n + 0{,}9$, qui modélise le refroidissement d''un gâteau, par récurrence et suite géométrique auxiliaire,
    et interprète une fonction Python de seuil. Le troisième montre qu''un triangle $JKL$ est rectangle, calcule un angle, une équation du plan $(JKL)$, le projeté orthogonal d''un point $T$ et le volume
    du tétraèdre $JKLT$. Le quatrième est un vrai-faux de six affirmations sur la fonction exponentielle : une égalité, une équation, une tangence, un point d''inflexion, une limite et une inégalité.'
  pages: 3
