  nom: Probabilités conditionnelles et loi binomiale, suite récurrente et logarithme, fonction logarithme et concavité, géométrie dans le pavé droit
  apercu: Le premier exercice étudie une alarme par un arbre pondéré et des probabilités conditionnelles, puis le nombre d'alarmes défaillantes dans un prélèvement par une loi binomiale, et cherche la taille
    minimale d'un prélèvement. Le deuxième étudie la suite $u_{n+1} = \frac{1}{5}u_n^2$ par récurrence, monotonie et limite, puis retrouve sa limite par les suites $v_n = \ln(u_n)$ et $w_n = v_n - \ln 5$,
    cette dernière géométrique de raison 2. Le troisième étudie $g(x) = 1 + x^2(1 - 2\ln x)$ et son unique zéro $\alpha$ sur $\left[1, +\infty\right[$, puis, grâce à la concavité, minore $g$ sur $[1, \alpha]$
    par la fonction affine dont la courbe est la corde joignant les points d'abscisses 1 et $\alpha$. Le quatrième, dans un pavé droit, cherche les points $M$ de $[GH]$ qui rendent le triangle $AMC$ rectangle
    en $M$, puis calcule un volume et la distance d'un point à un plan.
  pages: 4
