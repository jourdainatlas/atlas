  apercu: Le premier exercice traite par un arbre pondéré les forfaits et l'option coupe-file d'une station de ski (probabilités totales, probabilité conditionnelle inversée), puis une loi binomiale de
    paramètres 30 et 0,112. Le deuxième exercice est un QCM portant sur une diminution de 15 % par heure, les propriétés de $f(x) = 4\ln(3x)$, les asymptotes de $g(x) = \frac{\ln(x)}{x-1}$, la fonction
    $h(x) = x^2\left[1 + 2\ln(x)\right]$ (zéros, tangente, points d'inflexion) et une suite arithmético-géométrique. Le troisième exercice étudie $f(x) = 1 + x - \mathrm{e}^{0{,}5x-2}$ (limites, variations,
    théorème des valeurs intermédiaires) puis la suite $u_{n+1} = f(u_n)$, dont il démontre la convergence vers 4 et interprète un programme Python de seuil. Le quatrième exercice établit une équation du
    plan $\mathcal{P}_1$ passant par le milieu de $[AB]$ et de vecteur normal $\overrightarrow{AB}$, détermine la droite d'intersection de deux plans et son point d'intersection $\Omega$ avec un troisième,
    puis, ces trois plans étant admis comme plans médiateurs de $[AB]$, $[AC]$ et $[AD]$, en déduit que $A$, $B$, $C$, $D$ sont sur une même sphère de centre $\Omega$.
