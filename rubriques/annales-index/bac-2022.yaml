  apercu: 'Le premier exercice est un QCM sur la fonction exponentielle : dérivée de $f(x) = \frac{x}{\mathrm{e}^x}$, lecture de la convexité sur la courbe de $f''''$, primitives de $x^3\mathrm{e}^{-x^2}$
    et de $\mathrm{e}^{2x+1}$, limite d''un quotient et identification graphique de la dérivée seconde. Le deuxième exercice étudie $f(x) = x\ln(x) + 1$ (limites, variations, tangente, convexité, inégalité
    $f(x) \geqslant x$) puis la suite $u_{n+1} = f(u_n)$, dont il établit par récurrence l''encadrement $0 < u_n < 1$, la croissance et la convergence. Le troisième exercice montre que $(AD)$ est perpendiculaire
    au plan $(ABC)$, calcule le volume du tétraèdre $ABCD$, puis utilise le projeté orthogonal $H$ de $A$ sur $(BCD)$ pour obtenir la distance de $A$ à ce plan et l''aire de $BCD$. Le quatrième exercice
    détermine la loi du gain d''un jeu de tirages avec remise de jetons, cherche par une inéquation du second degré le nombre de jetons noirs rendant le jeu favorable, puis calcule une probabilité « au
    moins un » pour 10 joueurs indépendants.'
