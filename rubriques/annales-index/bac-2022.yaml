  apercu: Le premier exercice suit la position d'un vélo entre deux points de location par des arbres pondérés, en déduit la relation $a_{n+1} = 0{,}6a_n + 0{,}24$, établit par récurrence la forme explicite
    de $a_n$ et en étudie la limite. Le deuxième étudie un polynôme du troisième degré et son unique racine, puis, à l'aide de la dérivée seconde donnée, compte les points d'inflexion de la courbe de $f(x)
    = \frac{\mathrm{e}^x}{1 + x^2}$, profil d'un toboggan. Le troisième, dans une salle en forme de pavé droit, calcule un angle par le produit scalaire, une équation du plan $(ART)$, l'intersection de
    ce plan avec une droite orthogonale et un point $N$ d'un segment qui rend deux rayons perpendiculaires. Le quatrième est un QCM sur le calcul avec le logarithme, une équation logarithmique, une étude
    de fonction et une loi binomiale.
