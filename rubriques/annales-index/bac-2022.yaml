    pondéré le suivi d'un stage par les salariés, puis une loi binomiale de paramètres 20 et 0,25 avec un programme Python cumulant les probabilités, et un pourcentage moyen d'augmentation. Le quatrième
    exercice est un QCM sur une asymptote, des primitives, la convexité lue sur la courbe de $f'$, une limite avec logarithme et l'équation $\mathrm{e}^{2x} + \mathrm{e}^x - 12 = 0$.
