  nom: Géométrie dans l'espace et volume d'une pyramide, fonction logarithme et convexité, probabilités conditionnelles, loi binomiale et surbooking, suite récurrente d'une population de bactéries
  apercu: 'Le premier exercice montre que $ABCD$ est un rectangle, détermine une équation du plan $(ABD)$ et le projeté orthogonal de $K$ sur ce plan, puis calcule le volume de la pyramide $KABCD$. Le deuxième
    associe les courbes d''une fonction et de sa dérivée, puis étudie $f(x) = \ln(x^2 - x - 6)$ sur $\left]3, +\infty\right[$ : limites, asymptote, variations, solution de $f(x) = 3$ et convexité. Le troisième
    traite un trajet vers l''aéroport par un arbre pondéré, puis le surbooking d''un vol par une loi binomiale et l''espérance du chiffre d''affaires. Le quatrième étudie la suite $p_{n+1} = 0{,}3 + 0{,}7p_n^2$
    issue d''un modèle de descendance de bactéries : conjectures sur tableur, récurrence, convergence et limite obtenue par une équation du second degré, puis une fonction Python à compléter.'
