  nom: Probabilités conditionnelles, indépendance et loi binomiale, suite arithmético-géométrique et modèle exponentiel, géométrie dans le cube, fonction logarithme et convexité
  apercu: Le premier exercice étudie un jeu de kermesse par un arbre pondéré, une probabilité conditionnelle inversée et un test d'indépendance, puis le nombre de parties gagnées par une loi binomiale et
    le nombre minimal de parties pour gagner au moins une fois avec une probabilité au moins égale à 0,99. Le deuxième modélise la quantité de médicament dans le sang d'abord par la suite $u_{n+1} = 0{,}9u_n
    + 0{,}25$, avec récurrence, programme Python et suite géométrique auxiliaire, puis par la fonction $f(t) = 2{,}5 - 1{,}5\mathrm{e}^{-0{,}2t}$, et compare les deux modèles. Le troisième, dans un cube,
    détermine une équation du plan $(PQR)$, le projeté orthogonal de $E$ sur ce plan, la distance correspondante et l'aire du triangle $PQR$ par un calcul de volume. Le quatrième détermine $a$ et $b$ dans
    $f(x) = \ln(ax^2 + 1) + b$ à partir d'une tangente, puis étudie parité, variations et convexité de $f$.
