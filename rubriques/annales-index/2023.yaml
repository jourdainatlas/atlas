  nom: Chaîne de Markov en temps continu
  apercu: Pour une matrice stochastique $K$, on étudie $H_t = e^{-t}\sum t^n K^n/n!$, noyau de Markov vérifiant $H_{t+s} = H_t H_s$, que l'on interprète comme une chaîne dont le nombre de sauts suit une
    loi de Poisson de paramètre $t$. Lorsque $K$ est réversible pour une probabilité $\pi$ et que $1$ est valeur propre simple, le théorème spectral pour le produit scalaire pondéré par $\pi$ donne $|H_t[i,j]
    - \pi[j]| \leqslant e^{-\lambda t}\sqrt{\pi[j]/\pi[i]}$, où $\lambda$ est la plus petite valeur propre non nulle de $I-K$, d'où la convergence de $H_t[i,j]$ vers $\pi[j]$.
