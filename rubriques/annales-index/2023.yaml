  nom: Loi binomiale et matrice de rang 1, développement asymptotique d'une suite d'intégrales, matrices $A^\top = A^n$, intégrales de Fresnel
  apercu: Quatre exercices indépendants. Le premier étudie un couple $(X, Y)$ de loi proportionnelle à $\binom{n}{i-1} \binom{n}{j-1}$, montre que $X - 1$ suit une loi binomiale $\mathcal{B}(n, 1/2)$ et
    étudie une matrice de rang 1 vérifiant $B^2 = \operatorname{tr}(B) B$. Le deuxième montre que $u_n = \int_0^1 \mathrm{d}t/(1 + t + \dots + t^n)$ tend vers $1/2$ et que $u_n = 1/2 + \pi^2/(6n^2) + o(1/n^2)$
    grâce à une série de fonctions. Le troisième étudie les matrices réelles $A$ telles que $A^\top = A^n$, montre que $A^{n+1}$ est un projecteur orthogonal et que $\operatorname{Im} A$ et $\operatorname{Ker}
    A$ sont supplémentaires orthogonaux, et le quatrième calcule les intégrales de Fresnel $\int \cos(x^2)\,\mathrm{d}x = \int \sin(x^2)\,\mathrm{d}x = \sqrt{\pi}/(2\sqrt{2})$ au moyen d'une intégrale à
    paramètre et d'une série alternée.
