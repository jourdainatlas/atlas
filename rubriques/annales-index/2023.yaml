  nom: Quelques inégalités de convexité autour du déterminant
  apercu: Le sujet établit des inégalités de convexité sur les matrices symétriques positives. Après la caractérisation spectrale de $\mathcal{S}_n^{+}(\mathbb{R})$ et $\mathcal{S}_n^{++}(\mathbb{R})$,
    leur convexité, l'existence d'une racine carrée et l'inégalité de Jensen discrète, il compare trace et déterminant par l'inégalité arithmético-géométrique (avec un terme correctif en norme de Frobenius),
    puis prouve l'inégalité de Minkowski $\det^{1/n}(A+B) \geqslant \det^{1/n}(A) + \det^{1/n}(B)$ et la log-concavité du déterminant par réduction simultanée. Il termine par l'inégalité $\ln \det(I + tA)
    \leqslant t \operatorname{Tr}(A)$, le développement limité de $\det(A + tM)$ et le calcul de la dérivée seconde de $\varphi_\alpha = (1/\alpha) \det^{-\alpha}(A + tM)$, dont il montre la positivité
    en $0$.
