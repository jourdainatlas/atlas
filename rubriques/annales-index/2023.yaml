  nom: Modèles matriciels de dynamique de populations
  apercu: 'Le sujet montre d''abord qu''une matrice stochastique vérifiant une condition de minoration $P_{i,j} \geqslant c\nu_j$ est contractante pour la norme 1 sur les probabilités, d''où l''existence
    et l''unicité d''une probabilité invariante et une convergence géométrique en $2(1-c)^n$. Il en déduit, pour une matrice positive $M$ vérifiant la même minoration et possédant une valeur propre $\lambda
    > 0$ à vecteur propre strictement positif, la convergence de $\lambda^{-n}M^n$ (résultat de type Perron-Frobenius), appliquée aux matrices de Leslie. Il étudie enfin un processus de branchement multitype
    dont la matrice des moyennes est $M$ : extinction presque sûre si $\lambda < 1$ et, si $\lambda > 1$, convergence presque sûre vers $0$ de $W_n = \lambda^{-n}(X_n - \|X_n\|_1\pi)$, où $\pi$ est le vecteur
    propre à gauche normalisé.'
