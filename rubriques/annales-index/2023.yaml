- sujet: https://www.concours-commun-inp.fr/_resource/annales%20%C3%A9crits/MP/2023/MP1M1.pdf
  nom: Graphes en Python et SQL, point critique, intégrale de $x^{\alpha-1}/(1+x)$ et formule des compléments
  apercu: Un exercice d'informatique manipule des matrices d'adjacence et des distances dans un graphe, avec des requêtes SQL, et un exercice de calcul différentiel étudie le point critique unique de $f(x,
    y) = x^2 - 2xy + 2y^2 + e^{-x}$ à l'aide de la hessienne. Le problème calcule, pour $\alpha$ dans $\left]0, 1\right[$, l'intégrale de $x^{\alpha-1}/(1+x)$ sur $\left]0, +\infty\right[$ en la développant
    en série et trouve $\pi/\sin(\alpha\pi)$, puis relie cette intégrale à la fonction Gamma par une intégrale à paramètre solution d'une équation différentielle linéaire, ce qui conduit à la formule des
    compléments $\Gamma(\alpha)\Gamma(1-\alpha) = \pi/\sin(\alpha\pi)$.
