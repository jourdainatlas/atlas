  apercu: Le premier exercice montre que la norme subordonnée à la norme infinie d'une matrice est le maximum des sommes des modules des coefficients d'une ligne ; le second établit que $f(x,y) = x^2-2xy+2y^2+e^{-x}$
    a un unique point critique, qui est un minimum local. Le problème calcule $\int_0^{+\infty} x^{\alpha-1}/(1+x) \,\mathrm{d}x = \pi/\sin(\alpha\pi)$ par une série et la convergence dominée, puis, par
    une intégrale à paramètre solution d'une équation différentielle linéaire, démontre la formule des compléments $\Gamma(\alpha)\Gamma(1-\alpha) = \pi/\sin(\alpha\pi)$ et en déduit l'intégrale de Gauss.
  pages: 8
  blocs:
