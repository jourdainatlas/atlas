  nom: Théorème de stabilité de Liapounov
  apercu: Le sujet démontre que si $\varphi$ est de classe $\mathcal{C}^1$ avec $\varphi(0) = 0$ et si toutes les valeurs propres de $\mathrm{d}\varphi(0)$ ont une partie réelle strictement négative, alors
    les solutions de $y' = \varphi(y)$ issues d'un point assez proche de $0$ tendent vers $0$ à vitesse exponentielle. Il étudie d'abord la norme subordonnée et, grâce à la décomposition en sous-espaces
    caractéristiques, majore $\|e^{ta}\|$ par $P(|t|) \sum e^{t \operatorname{Re} \lambda_i}$. Il construit ensuite le produit scalaire $b(x, y) = \int_0^{+\infty} \langle e^{ta} x \mid e^{ta} y\rangle
    \,\mathrm{d}t$, dont la forme quadratique décroît le long des solutions (fonction de Liapounov), ce qui fournit l'estimation exponentielle.
