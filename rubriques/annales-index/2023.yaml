- sujet: https://www.concours-commun-inp.fr/_resource/annales%20%C3%A9crits/MPI/2023/MPI3M2.pdf
  nom: Projection orthogonale, maximum de lois géométriques, projecteurs spectraux et décomposition spectrale
  apercu: 'Le premier exercice minimise $\int (x^2 - ax - b)^2 e^{-x} \,\mathrm{d}x$ sur $\left]0, +\infty\right[$ en projetant $X^2$ sur $\mathbb{R}_1[X]$ pour un produit scalaire intégral, et le second
    détermine, pour deux variables indépendantes de même loi $P(X = k) = p q^k$ sur $\mathbb{N}$, la loi conjointe de leur maximum $Z$ et de leur minimum $T$, puis la loi de $Z$. Le problème démontre le
    lemme des noyaux pour deux facteurs, construit les projecteurs associés à un endomorphisme à partir d''une relation de Bézout sur les facteurs de son polynôme minimal et montre que leurs images sont
    les sous-espaces caractéristiques. Dans le cas diagonalisable, il les obtient par décomposition en éléments simples de $1/\pi_u$, établit la décomposition spectrale $u = \sum \lambda_i p_i$, montre
    que ces projecteurs forment une base de $\mathbb{K}[u]$ et prouve la réciproque : s''il existe des $f_i$ non nuls et des $\lambda_i$ distincts avec $u^q = \sum \lambda_i^q f_i$ pour tout $q$, alors
    $u$ est diagonalisable.'
  pages: 8
