  nom: Fonction de Wallis
  apercu: Le sujet étudie la fonction $f$ définie par $f(x) = \int_0^{\pi/2} \sin^x(t) \,\mathrm{d}t$, en s'appuyant sur la série $\sigma(x) = \sum x^k/k^2$ dont on calcule d'abord $\sigma(1) = \pi^2/6$.
    On établit la relation fonctionnelle $(x+1)f(x) = (x+2)f(x+2)$, des équivalents en $-1$ et en $+\infty$, un développement en série entière de $f$, puis on calcule $f''(0)$ grâce au développement en
    série trigonométrique de $\ln(a^2\cos^2 x + b^2\sin^2 x)$ et à la convergence simple d'une suite de fonctions. On montre enfin que $f$ est l'unique fonction ln-convexe vérifiant la relation fonctionnelle
    et $f(0) = \pi/2$, à la manière du théorème de Bohr-Mollerup.
