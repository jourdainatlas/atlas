  nom: Théorème de Moivre-Laplace et marche aléatoire symétrique
  apercu: Le sujet calcule l'intégrale de Gauss à partir des intégrales $I_n = \int_0^1 \frac{\mathrm{d}t}{(1 + t^2)^n}$, donne l'équivalent $\varphi(x)/x$ de $1 - \Phi(x)$ en $+\infty$ et démontre une
    inégalité maximale pour les sommes de variables indépendantes. Il montre ensuite, par la formule de Stirling, que les fonctions en escalier $B_n$ construites sur la loi binomiale $\mathcal{B}(n, 1/2)$
    convergent uniformément vers la densité gaussienne $\varphi$. Il en déduit le théorème central limite pour la marche aléatoire symétrique $S_n$, sous la forme $P(u \leqslant S_n/\sqrt{n} \leqslant v)
    \to \int_u^v \varphi$, puis un critère de tension pour $\max |S_p|$.
