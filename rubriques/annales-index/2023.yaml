  nom: Quelques applications de la formule de Stirling
  apercu: 'Le sujet calcule l''intégrale de Gauss au moyen d''une intégrale à paramètre, démontre la formule de Stirling par convergence dominée à partir de $n! = \int t^n e^{-t}\,\mathrm{d}t$, puis le
    raffinement $n! = \sqrt{2\pi n}(n/e)^n(1 + 1/(12n) + q_n/n)$ avec $q_n \to 0$ par sommation des équivalents de restes. Il applique ces résultats à la marche aléatoire sur $\mathbb{Z}$ : la probabilité
    de ne jamais revenir en $0$ vaut $|p-q|$ (séries entières $A$ et $B$ des retours), puis, dans le cas symétrique, le principe de réflexion et des sommes de Riemann établissent la loi de l''arcsinus pour
    le dernier passage en $0$.'
