  nom: Distance entre deux distributions de probabilités sur $\mathbb{N}$
  apercu: Le sujet détermine la loi du nombre de points fixes d'une permutation aléatoire uniforme à l'aide de la série des dérangements ($s(x)e^x = 1/(1-x)$), calcule son espérance et sa variance et montre
    sa convergence vers la loi de Poisson de paramètre $1$. La distance en variation totale permet de quantifier cette convergence, en $O(2^n/(n+1)!)$, puis, grâce au produit de convolution, d'obtenir $d_{\mathrm{VT}}(\mathcal{B}(n,\lambda),
    \mathcal{P}(n\lambda)) \leqslant n\lambda^2$ et $d_{\mathrm{VT}}(\mathcal{P}(\alpha), \mathcal{P}(\beta)) \leqslant |\beta-\alpha|$.
