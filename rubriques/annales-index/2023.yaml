- sujet: documents/annales/2023/mines-ponts/Maths-MP-2.pdf
  nom: Fonction de Wallis
  apercu: Le sujet étudie la fonction $f(x) = \int_0^{\pi/2} (\sin t)^x \, \mathrm{d}t$ sur $\left]-1, +\infty\right[$ après avoir établi $\sigma(1) = \pi^2/6$ pour $\sigma(x) = \sum_{k \geqslant 1} x^k/k^2$.
    Il établit la relation $(x + 1)f(x) = (x + 2)f(x + 2)$, montre que $f$ est convexe et décroissante, en donne des équivalents en $-1$ et en $+\infty$ ($f(x) \sim \sqrt{\pi/(2x)}$), la développe en série
    entière sur $\left]-1, 1\right[$ grâce aux intégrales de $(\ln \sin t)^n$, et calcule $f''(0)$ via un développement en série de cosinus de $\ln(a^2 \cos^2 x + b^2 \sin^2 x)$. Il caractérise enfin $f$,
    à la manière du théorème de Bohr-Mollerup, comme l'unique fonction ln-convexe vérifiant cette relation et $f(0) = \pi/2$.
  pages: 6
