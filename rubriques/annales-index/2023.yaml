- sujet: https://www.devenirenseignant.gouv.fr/media/4727/download
  nom: Endomorphismes nilpotents, partitions et sous-espaces stables
  apercu: Trois exercices courts portent sur les sous-groupes de $\mathbb{Z}/n\mathbb{Z}$, des équations quadratiques modulo 3 et dans $\mathbb{Z}^2$ et $\mathbb{Q}^2$, et l'adjoint d'une application entre
    espaces euclidiens. Le problème établit la décomposition en valeurs singulières et la décomposition polaire, classe les matrices réelles de carré nul sous l'action du groupe orthogonal, puis associe
    à tout endomorphisme nilpotent une partition, son type, qui détermine sa classe de similitude (réduction de Jordan) et se lit sur un diagramme de Ferrers. Il étudie ensuite les matrices semblables à
    des matrices symétriques (racines carrées polynomiales, nombres de Catalan) et dénombre enfin, sur un corps fini $\mathbb{F}_q$, les sous-espaces stables d'un nilpotent de type donné, cardinaux qui
    s'expriment par des polynômes en $q$.
  pages: 12
