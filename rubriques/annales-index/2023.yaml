- sujet: https://www.concours-centrale-supelec.fr/sites/default/files/2025-01/M048.pdf
  nom: Sur le calcul ombral
  apercu: Le sujet étudie les endomorphismes de $\mathbb{K}[X]$ qui commutent aux translations, montre qu'ils s'écrivent comme des séries en la dérivation $D$ (formule de Taylor généralisée) et introduit
    les endomorphismes delta. À chacun il associe une unique suite de polynômes de type binomial, $q_n(x + y) = \sum q_k(x) q_{n-k}(y)$, dont $X^n/n!$ et les polynômes binomiaux $X(X - 1)\cdots(X - n +
    1)/n!$ sont des exemples. Il établit une formule de récurrence à l'aide de la dérivée de Pincherle et l'applique aux polynômes de Laguerre de paramètre $-1$, puis aux opérateurs ombraux.
