  nom: Introduction aux nombres $p$-adiques
  apercu: Après un vrai-faux et deux exercices préliminaires (cardinal de $\mathrm{GL}_n(\mathbb{Z}/p\mathbb{Z})$, égalité $n = \sum \varphi(d)$ et cyclicité du groupe multiplicatif d'un corps fini), le
    problème définit la valuation et la valeur absolue $p$-adiques, puis construit l'anneau $\mathbb{Z}_p$ des entiers $p$-adiques comme suites compatibles, son corps des fractions $\mathbb{Q}_p$ et sa
    topologie (densité de $\mathbb{Z}$, complétude). Il en déduit que l'ensemble des zéros d'une suite récurrente linéaire à coefficients entiers est, par classes de congruence, fini ou égal à $\mathbb{N}$,
    et utilise l'exponentielle et le logarithme $p$-adiques pour montrer que $(\mathbb{Z}/p^n\mathbb{Z})^*$ est cyclique lorsque $p$ est impair.
