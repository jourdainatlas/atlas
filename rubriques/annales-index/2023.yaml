  nom: Problème de Sturm-Liouville
  apercu: 'Le sujet étudie le problème de Sturm-Liouville $-y'''' + p y = f$ sur $[0, 1]$ avec les conditions aux limites séparées $a y(0) + b y''(0) = 0$ et $c y(1) + d y''(1) = 0$. Après des préliminaires
    sur les équations linéaires d''ordre 2 et le wronskien, il traite l''exemple $-y'''' = f$ avec $y(0) = y(1) = 0$, dont il exprime la solution par un noyau de Green puis par développement sur les fonctions
    propres $\sqrt{2} \sin(n\pi x)$, de valeurs propres $n^2\pi^2$, et le cas $p = -\pi^2$, où le problème a plusieurs solutions ou aucune selon $f$. Il montre ensuite que $H_p$ est symétrique, que ses
    sous-espaces propres sont des droites deux à deux orthogonales et que ses valeurs propres sont minorées, construit lorsque $H_q$ est injectif sa fonction de Green et son inverse $\Phi_q$, et conclut
    par une alternative : si $0$ n''est pas valeur propre de $H_p$, le problème a une unique solution ; sinon il en a une infinité si $f$ est orthogonale à la fonction propre associée à $0$, et aucune dans
    le cas contraire.'
  pages: 13
