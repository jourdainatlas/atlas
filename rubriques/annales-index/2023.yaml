- sujet: https://www.concours-centrale-supelec.fr/sites/default/files/documents/M056.pdf
  nom: Endomorphismes de $\mathcal{M}_n(\mathbb{R})$ conservant le rang, le déterminant ou le polynôme caractéristique
  apercu: Le sujet caractérise les endomorphismes de $\mathcal{M}_n(\mathbb{R})$ qui conservent le rang, le déterminant ou le polynôme caractéristique. Après l'étude de $M \mapsto AM$ (même spectre que
    $A$, diagonalisable si et seulement si $A$ l'est) et des applications $M \mapsto PMQ$ et $M \mapsto PM^\top Q$, il démontre pour $n = 2$, à partir de la réduction au type $J_{n,r}$, qu'un endomorphisme
    conserve le rang si et seulement s'il est de l'une de ces deux formes. Il en déduit que conserver le déterminant revient à cette forme avec $\det(PQ) = 1$, et, avec le produit scalaire $\operatorname{tr}(A^\top
    B)$, que conserver le polynôme caractéristique revient à $M \mapsto PMP^{-1}$ ou $M \mapsto PM^\top P^{-1}$.
  pages: 5
