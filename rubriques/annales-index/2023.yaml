- sujet: https://ens-paris-saclay.fr/sites/default/files/CONCOURS/ANNALES_1C/1C_PSI/2023_MATHS_PSI_001.pdf
  nom: Transport optimal régularisé par l'entropie et algorithme de Sinkhorn
  apercu: 'Le sujet rappelle d''abord des outils d''optimisation convexe : minimisation d''une fonction convexe, extremum sous une contrainte affine $Ax = b$ et points selles d''un lagrangien. Il introduit
    ensuite l''entropie d''une loi discrète et la divergence de Kullback-Leibler et en déduit, via l''inégalité de Kraft, que la longueur moyenne d''un code préfixe est au moins $H(p)/\ln 2$. Il étudie
    enfin le problème de transport entre deux lois discrètes régularisé par l''entropie, montre l''existence, l''unicité et la stricte positivité du couplage optimal, puis, par dualité, introduit les itérations
    de Sinkhorn, montre que la fonction duale croît le long de ces itérations et que, si les potentiels convergent, les couplages associés convergent vers le couplage optimal.'
