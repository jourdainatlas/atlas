  nom: Fonction de Bessel, marche aléatoire sur $\mathbb{Z}$ et puissances de matrices
  apercu: 'L''exercice montre que $f(x) = \int_0^\pi \cos(x \sin t)\,\mathrm{d}t$ est solution de $xy''''+y''+xy = 0$ et développable en série entière, ce qui fait intervenir les intégrales de Wallis. Le
