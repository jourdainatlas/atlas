  nom: Quaternions, rotations et théorème de Frobenius-Hurwitz
  apercu: 'Le sujet introduit l''algèbre $\mathbb{H}$ des quaternions et sa norme multiplicative, puis identifie ses automorphismes aux rotations de $\mathrm{SO}(3)$ et décrit $\mathrm{SO}(4)$ à l''aide
    des couples de quaternions unitaires. Il montre qu''une norme sur $\mathbb{R}^2$ vérifiant $\|x+y\|^2 + \|x-y\|^2 \geqslant 4$ pour tous vecteurs unitaires $x, y$ est euclidienne (par un déterminant
    maximal sur un compact convexe), établit le théorème de Frobenius sur les $\mathbb{R}$-algèbres algébriques sans diviseur de zéro, et en déduit le théorème de Hurwitz : une $\mathbb{R}$-algèbre munie
    d''une norme multiplicative est isomorphe à $\mathbb{R}$, $\mathbb{C}$ ou $\mathbb{H}$.'
