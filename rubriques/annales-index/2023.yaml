    de partie réelle strictement négative, grâce aux sous-espaces caractéristiques et à l'exponentielle d'endomorphisme. Il démontre enfin le théorème de Liapounov pour un système non linéaire au voisinage
    d'un point d'équilibre, à l'aide d'une forme quadratique servant de fonction de Liapounov.
