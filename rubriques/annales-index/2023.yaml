  nom: Endomorphisme cyclique, fonction dilogarithme et jeu de société
  apercu: Trois exercices indépendants. Le premier étudie les endomorphismes cycliques (exemples, opérateur $\Delta(P) = P(X+1) - P(X)$, déterminant de Vandermonde) et montre qu'un endomorphisme diagonalisable
