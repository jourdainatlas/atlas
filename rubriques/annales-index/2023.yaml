  nom: Un endomorphisme de $\mathbb{R}_n[X]$, la fonction $x \mapsto \int_0^1 t^{t^x}\,\mathrm{d}t$, un opérateur de moyenne, matrices aléatoires diagonalisables
  apercu: Quatre exercices indépendants. Le premier détermine les éléments propres de l'endomorphisme $P \mapsto X P - (1/n)(X^2 - 1) P'$ de $\mathbb{R}_n[X]$ et montre qu'il est diagonalisable. Le deuxième
    étudie $F(x) = \int_0^1 t^{t^x} \,\mathrm{d}t$ (domaine, variations, limites) et l'écrit comme la somme $\sum (-1)^n/(1 + nx)^{n+1}$ par intégration terme à terme. Le troisième étudie l'opérateur $\Psi(f)(x)
    = \int_0^1 f(xt) \,\mathrm{d}t$ sur les fonctions continues sur $\mathbb{R}_+$, injectif et non surjectif, en détermine les éléments propres par une équation différentielle et l'étudie sur un sous-espace
    engendré par les $x^i$ et $x^i \ln x$. Le quatrième étudie une matrice aléatoire semblable à $\operatorname{diag}(X_1, \ldots, X_n)$ avec des $X_i$ de Bernoulli et détermine les lois de sa trace, de
    son rang et de son déterminant.
