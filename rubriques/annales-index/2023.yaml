  nom: Factorisation eulérienne du sinus et théorème de Paley-Wiener
  apercu: Le sujet établit la factorisation partielle $\sin(z) = P_n(z)\cdot\hat{\rho}_n(z)$, où $P_n(z) = z\prod_{k=1}^{n}(1 - z^2/(\pi k)^2)$ et $\hat{\rho}_n$ est la transformée de Fourier d'une densité
    en $\cos^{2n}(\pi x/2)$ portée par $[-1, 1]$, en déduit le produit eulérien du sinus et la rationalité de $\pi^{-2\ell}\sum 1/k^{2\ell}$. Il démontre ensuite que la transformation de Fourier réalise
    une bijection des fonctions $\mathcal{C}^\infty$ à support dans $[-1, 1]$ sur un espace de fonctions entières de type exponentiel (théorème de Paley-Wiener), puis l'étend aux distributions tempérées
    à support dans $[-1, 1]$, avec une application aux fonctions caractéristiques.
