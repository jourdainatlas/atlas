  nom: Théorème de Peano et inclusions différentielles
  apercu: 'Le sujet étudie le problème de Cauchy $y'' = F(y)$ lorsque $F$ est seulement continue. Après des exemples explicites (modèles de croissance de type Gompertz), il démontre le théorème d''Ascoli
    (une partie de $\mathcal{C}(K, \mathbb{R}^d)$ est relativement compacte si et seulement si elle est équicontinue et ponctuellement bornée), en déduit le théorème de Peano à partir des approximations
    du schéma d''Euler et exhibe une infinité de solutions globales pour $y'' = 3|y|^{2/3}$, $y(0) = 0$. Il aborde enfin les inclusions différentielles $y'' \in F(y)$ : unicité de la solution maximale sous
    une condition de monotonie, puis détermination de toutes les solutions maximales pour un champ du plan discontinu le long de la droite $x_1 = 0$, selon que cette condition est vérifiée ou non.'
