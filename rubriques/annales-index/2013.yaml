  nom: 'Indice d''une courbe plane fermée : suites de Sturm et théorème de Hopf'
  apercu: 'Le sujet définit d''abord un indice algébrique (indice de Cauchy) d''une fraction rationnelle sur un intervalle, montre que l''indice de P''/P compte les racines réelles de P et l''applique aux
    lignes polygonales fermées, puis démontre le théorème de Sturm et relie le nombre de racines réelles à la signature d''une matrice tridiagonale. Il établit ensuite un théorème de relèvement pour une
    application continue d''un compact étoilé dans le cercle unité, et l''utilise pour prouver le théorème de Hopf : l''indice de rotation d''un arc de Jordan régulier vaut 1 ou −1.'
