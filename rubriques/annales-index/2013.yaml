  nom: L'algorithme de Jacobi pour les matrices symétriques
  apercu: Le sujet étudie la conjugaison d'une matrice symétrique S par une rotation plane Rp,q(θ) choisie pour annuler le coefficient spq, et suit l'effet de cette opération sur les parties diagonale et
    extra-diagonale pour la norme euclidienne de Mn. Il en déduit la convergence de la partie diagonale dans l'algorithme de Jacobi incomplet, puis, dans la version optimale (pivot de plus grande valeur
    absolue), la convergence vers une matrice diagonale formée des valeurs propres, avec une estimation géométrique ||D − D(m)|| ≤ ρ^m ||E(0)||/(1 − ρ).
