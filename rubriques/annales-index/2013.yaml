- sujet: https://capes-math.org/data/uploads/ecrits/EP1_2013.pdf
  nom: Nombres irrationnels ; statistiques, probabilités et entropie
  apercu: Le premier problème démontre l'irrationalité de racine de n (n non carré), de ln 2/ln 3, de e (par les suites adjacentes un et un + 1/(n·n!)) et de π (par les polynômes Pn(x) = x^n(a − bx)^n/n!
    et les intégrales de Pn sin), puis construit le développement en série de Engel d'un réel de ]0, 1], en prouve l'unicité et caractérise les rationnels par une suite stationnaire. Le second problème
    compare moyenne et médiane comme minimiseurs de la somme des carrés ou des valeurs absolues des écarts, puis montre que l'entropie d'un système complet est maximale en cas d'équiprobabilité (via l'inégalité
    de Jensen) et que, à moyenne nulle et variance 1, la densité gaussienne maximise l'entropie.
