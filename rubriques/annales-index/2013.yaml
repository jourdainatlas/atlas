  nom: Matrices de Hilbert
  apercu: 'Le sujet définit sur les matrices symétriques la norme N(A) = sup |(Ax|x)| sur la sphère unité et l''identifie, par le théorème spectral, au plus grand module des valeurs propres. Il l''applique
    à la matrice de Hilbert Hn de coefficients 1/(j + k − 1) : écriture de qn(x) comme intégrale de Q(t)², positivité définie, encadrement du spectre dans ]0, π[ par une intégrale sur le demi-cercle, limite
    nulle de la plus petite valeur propre, puis limite π de N(Hn) grâce à une intégrale double équivalente à (π/4) ln n. Il calcule enfin det(Hn) par une décomposition en éléments simples et montre que
    1/det(Hn) est un entier.'
  pages: 8
