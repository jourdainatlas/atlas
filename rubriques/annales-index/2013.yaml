  nom: Intégrales liées à 1/ch et développements en série
  apercu: Le sujet calcule les intégrales C_n et S_n de tⁿ/ch(t) et tⁿ/sh(t) sur ]0, +∞[ sous forme de séries, par développement de 1/(2 ch t) et 1/(2 sh t) et intégration terme à terme, et retrouve C₀
    = π/2 et S₁ = π²/4 par la série de Fourier d'un créneau. Il étudie ensuite l'intégrale à paramètre F(x) = intégrale de e^(ixt)/ch(t), développable en série entière de rayon 1, et H(x) = intégrale de
    cos(xt)/ch(t), qu'il exprime comme une série puis évalue en π/(2 ch(πx/2)) grâce à la série de Fourier de sh(xt). Il résout enfin l'équation y'' − y = 1/ch(t) et montre que 1/ch, la solution paire valant
    1 en 0, et ln(ch) sont développables en série entière sur ]−1, 1[.
