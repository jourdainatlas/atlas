  nom: Fonctions de Bessel comme coefficients de Fourier de e^(ix sin t)
  apercu: 'Le sujet définit φn(x) comme les coefficients de Fourier exponentiels de t ↦ e^(ix sin t) et retrouve les fonctions de Bessel de première espèce : parité, égalité de Parseval, développement en
    série entière et relation de dérivation. Il montre ensuite que φn est solution de l''équation de Bessel x²y'''' + xy'' + (x² − n²)y = 0, en déduit son comportement asymptotique en αn cos(x − βn)/√x
    et, par un argument de comparaison de Sturm, que ses zéros forment une suite tendant vers l''infini dont les écarts sont asymptotiquement majorés par π/c pour tout c dans ]0, 1[.'
  pages: 4
