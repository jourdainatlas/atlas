  nom: Points entiers sur une hyperbole ; matrices « toutes-puissantes »
  apercu: 'Un exercice fait tracer l''hyperbole x² − 13y² = 1 et chercher par algorithme ses points à coordonnées entières avec y ≤ 200. Le problème appelle « toute-puissante » une matrice A admettant pour
    tout n ≥ 1 une racine n-ième B (A = B^n) : après des exemples et contre-exemples (taille 1, déterminant, rotation, nilpotentes), il ramène par les sous-espaces caractéristiques le cas d''un polynôme
    caractéristique scindé aux blocs λI + N, traite les matrices unipotentes I + N grâce au développement limité de (1 + x)^(1/n), et conclut que toute matrice inversible de Mp(C) est toute-puissante sur
    C.'
  pages: 5
