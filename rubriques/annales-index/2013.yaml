  nom: Applications bilinéaires symétriques plates
  apercu: Une application bilinéaire symétrique φ de Rⁿ × Rⁿ dans Rᵖ est dite plate si ⟨φ(x, y), φ(z, w)⟩ = ⟨φ(x, w), φ(z, y)⟩. Le sujet montre qu'une forme bilinéaire symétrique (p = 1) non nulle est plate
    si et seulement si elle est de rang 1, démontre la diagonalisation simultanée en base orthonormée d'une famille d'endomorphismes autoadjoints qui commutent, étudie les vecteurs réguliers (ouverts et
    denses), et conclut que, pour p = n et un noyau nul, une application bilinéaire symétrique plate est diagonalisable.
