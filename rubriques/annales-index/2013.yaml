  nom: Espaces de Müntz
  apercu: 'Pour une suite strictement croissante d''entiers Λ, le sujet étudie l''adhérence MΛ dans C([0, 1]) de l''espace engendré par les monômes t^λ, λ ∈ Λ. Il démontre le théorème de Müntz (densité
    lorsque Σ 1/λn diverge, avec λ0 = 0) et, dans le cas convergent, construit à l''aide d''un produit de Blaschke une fonction orthogonale à MΛ, ce qui donne le théorème de Clarkson-Erdős : les éléments
    de MΛ sont des séries Σ ai x^λi sur [0, 1[. Il montre ensuite que les sous-espaces fermés de fonctions C¹ sur [0, 1[ ont un dual séparable alors que celui de C([0, 1]) ne l''est pas, minore les normes
    de projections à l''aide des constantes de Lebesgue, et construit l''exemple de Newman d''un espace de Müntz non complémenté.'
