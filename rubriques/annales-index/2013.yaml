  nom: Deux suites récurrentes doubles et normes matricielles
  apercu: Le sujet étudie les suites définies par u(n+2) = 2/(u(n+1) + u(n)) et v(n+2) = 1/√(v(n+1)v(n)) avec des termes initiaux strictement positifs. Pour v, le passage au logarithme ramène à une récurrence
    linéaire d'ordre deux et donne la convergence vers 1. Pour u, il construit des normes ‖PZ‖∞ adaptées, montre que le rayon spectral est la borne inférieure des normes subordonnées associées, choisit
    P pour que la norme de la jacobienne au point fixe (1, 1) soit égale à son rayon spectral √2/2, en déduit une convergence locale géométrique, puis obtient la convergence globale par un argument sur
    les valeurs d'adhérence.
