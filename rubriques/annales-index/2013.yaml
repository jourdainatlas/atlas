  nom: Le flot de Toda
  apercu: Le sujet montre d'abord, à l'aide des matrices de Householder h = I − 2u tu, que toute matrice symétrique réelle est orthogonalement semblable à une matrice tridiagonale, puis que les matrices
    de Jacobi à coefficients sous-diagonaux non nuls ont des valeurs propres simples. Il étudie ensuite le système différentiel de Toda t' = ut − tu (paire de Lax), montre que le flot est isospectral grâce
    à une matrice orthogonale v(t), puis, par une loi de conservation, que les coefficients diagonaux tendent vers les valeurs propres rangées dans l'ordre décroissant, à vitesse exponentielle.
