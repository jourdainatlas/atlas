  nom: Décomposition de Cholesky, intégrale de Dirichlet et parabole
  apercu: Le premier exercice établit l'existence et l'unicité de la décomposition de Cholesky S = tT T d'une matrice symétrique définie positive, avec T triangulaire supérieure à diagonale strictement
    positive, via l'orthonormalisation de Schmidt pour le produit scalaire défini par S, après un exemple 3×3. Le deuxième étudie g(t) = (1 − e^(−t))/t puis h(x) = ∫ (1 − e^(−xt))/t sin t dt, montre que
    h = Arctan et en déduit que l'intégrale de Dirichlet vaut π/2. Le troisième étudie la parabole de foyer F et de directrice D (tangente, normale, repère de Frenet, rayon et centre de courbure) puis trace
    une courbe paramétrée avec point stationnaire et branche infinie.
