  nom: Morphismes et isomorphismes entre groupes spéciaux linéaires (théorèmes de Schreier et Van der Waerden)
  apercu: 'Le sujet démontre, pour des corps de caractéristique différente de 2, trois théorèmes de Schreier et Van der Waerden : tout morphisme de SLn(K) dans SLp(L) avec n > p est trivial ; si SLn(K)
    et SLp(L) sont isomorphes alors n = p et K est isomorphe à L ; tout isomorphisme de SL2(K) sur SL2(L) est de la forme M ↦ P M^σ P^(−1) avec σ un isomorphisme de corps. Il s''appuie sur des calculs de
    commutants (matrices diagonales par blocs, matrices compagnons), sur les transvections, le centre et le groupe dérivé de SLn(K), le dénombrement de GLn(Fq), et sur l''étude de centralisateurs et de
    normalisateurs.'
