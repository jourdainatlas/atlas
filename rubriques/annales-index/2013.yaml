  nom: Exponentielle de matrices
  apercu: Le sujet définit l'exponentielle d'une matrice comme la limite E(A) de (I + A/n)^n, après avoir établi la limite analogue pour un nombre complexe. Il montre que l'exponentielle d'une antisymétrique
    réelle d'ordre 2 ou 3 est une rotation, puis étudie les cas diagonalisable (det E(A) = e^tr(A), E(A + B) = E(A)E(B) pour des matrices qui commutent) et nilpotent, avant de prouver l'existence de E(A)
    pour toute matrice complexe par division euclidienne de (1 + X/n)^n par le polynôme caractéristique et une matrice diagonale par blocs de Jordan.
