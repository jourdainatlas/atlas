  nom: Matrices circulantes et intégrale de ln(1 − 2x cos t + x²)
  apercu: Le sujet calcule h(x), intégrale sur [0, π] de ln(1 − 2x cos t + x²), par dérivation sous le signe intégrale et le changement de variable u = tan(t/2). Il diagonalise ensuite les matrices circulantes
    Cα, dont les valeurs propres sont les q(ω^ℓ) avec ω = e^(2iπ/n), calcule le déterminant (1 − a^n)^(n−1) d'une matrice circulante de puissances de a, et retrouve h par des sommes de Riemann en passant
    à la limite dans (det A)^(1/n).
