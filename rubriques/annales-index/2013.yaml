  nom: Calcul d'une intégrale à l'aide de l'intégrale de Gauss
  apercu: 'Le sujet étudie f(x), intégrale de 0 à x de e^(−t²) : régularité, dérivées de la forme pn(x)e^(−x²), développement en série entière, puis calcul de sa limite Δ en +∞ par un encadrement faisant
    intervenir les intégrales de Wallis. Il calcule ensuite h(b), intégrale de cos(2bt)e^(−t²), par une intégrale curviligne d''une forme différentielle exacte sur le bord d''un rectangle, et φ(x), intégrale
    de exp(−t² − x²/t²), via une équation différentielle. Il en déduit la valeur de ψ(x), intégrale sur [0, +∞[ de cos(2xt)/(1 + t²), par interversion de limites et d''intégrales.'
