  nom: Matrices directement orthogonalement semblables et cercle propre
  apercu: Le sujet décrit O(2) et SO(2) (rotations et réflexions planes), puis étudie la relation « A et B sont semblables par une matrice de SO(n) » et la compare à la similitude et à la similitude orthogonale.
    À toute matrice réelle A d'ordre 2 il associe un cercle propre, d'équation det(A(x, y)) = 0 où A(x, y) s'obtient en retranchant x aux coefficients diagonaux, y au coefficient b et en ajoutant y au coefficient
    c, et montre que deux matrices sont directement orthogonalement semblables si et seulement si elles ont le même cercle propre. Il lit sur ce cercle et sur un rectangle propre les valeurs propres, la
    diagonalisabilité, les vecteurs propres et une décomposition f = kρ + ℓσ, puis prolonge l'étude par une quadrique propre dans l'espace.
