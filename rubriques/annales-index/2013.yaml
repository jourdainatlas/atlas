- sujet: https://www.ens.psl.eu/IMG/file/concours/2013/MPI/13_mp_math_d_u.pdf
  nom: Polynômes hyperboliques
  apercu: Un polynôme homogène p de degré d sur un espace réel est hyperbolique dans la direction a si p(a) ≠ 0 et si t ↦ p(ta − x) n'a que des racines réelles λ1(x; a) ≤ … ≤ λd(x; a). Après des exemples
    (déterminant sur les matrices symétriques, formes de Lorentz, polynômes symétriques élémentaires), le sujet montre la continuité des racines, la convexité du cône C(p; a) et son indépendance par rapport
    à la direction choisie dans le cône, d'abord dans le cas strictement hyperbolique puis en général par une analyse locale des racines. Il en déduit l'inégalité de Gårding, la concavité de p^(1/d) sur
    le cône, une minoration du permanent et des inégalités de Weyl sur les λj(x + y).
