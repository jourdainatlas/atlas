  nom: Exposant de Hölder ponctuel d'une fonction continue
  apercu: 'Le sujet définit l''exposant de Hölder ponctuel α_f(x₀) d''une fonction continue sur [0, 1] et le module de continuité ω_f, puis introduit le système de Schauder (fonctions chapeaux θ_jk sur
    les intervalles dyadiques) : les sommes partielles S_n f interpolent f aux points dyadiques et convergent uniformément vers f. Il montre qu''une régularité höldérienne en x₀ entraîne une majoration
    des coefficients c_jk(f), et établit une réciproque : sous cette majoration et une hypothèse faible sur ω_f, on a α_f(x₀) ≥ s.'
