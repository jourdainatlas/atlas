  nom: Le rayon de Bohr
  apercu: 'Pour une série entière h de rayon au moins 1, le sujet exprime les coefficients à l''aide des coefficients de Fourier de la partie réelle de h(re^(iθ)) et en déduit le théorème de Bohr : si |f(z)|
    ≤ 1 sur le disque unité, alors Σ |bn| |z|^n ≤ 1 pour |z| < 1/3. Les fonctions (z − λ)/(1 − λz) montrent que la constante 1/3 est optimale. Une dernière partie, fondée sur une formule de type Parseval
    et la positivité d''une matrice 2×2, établit une estimation Σ |bn| |z|^n ≤ m(|z|) valable au-delà de 1/3.'
