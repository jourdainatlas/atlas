- sujet: https://www.vmaths.fr/wp-content/uploads/E3A/PSI/E3A_2013_PSI_MathsB_enonce.pdf
  nom: Podaires d'une parabole, série et intégrale, familles de Parseval, sous-groupes bornés de GLn(C)
  apercu: Le sujet comporte quatre exercices indépendants. On étudie d'abord la parabole x = t², y = 2t et ses podaires par rapport au foyer F(1, 0) et à l'origine ; on montre ensuite que f(x), somme des
    1/(1 + (nx)²), a pour équivalent π/(2x) en 0 et coïncide avec l'intégrale de sin(t)/(e^(xt) − 1) sur ]0, +∞[. Le troisième exercice prouve qu'un espace préhilbertien dans lequel une famille finie vérifie
    ||x||² = Σ (x|ei)² est de dimension finie, et que cette famille en est une base orthonormale dès qu'elle est libre ou que ses vecteurs sont de norme au moins 1 ; le dernier montre que tout élément d'un
    sous-groupe de GLn(C) contenu dans la boule fermée de centre In et de rayon 1 pour une norme subordonnée a pour seule valeur propre 1, puis que, pour n = 2, un tel sous-groupe est réduit à {I2}.
  pages: 5
