  nom: Algèbres d'opérateurs quantiques sur les fonctions à support fini
  apercu: Le sujet étudie, sur l'espace V des fonctions de Z dans C à support fini, l'opérateur de décalage E et des opérateurs diagonaux H et de pondération F soumis à des relations de commutation, d'abord
    du type sl2 (H∘E = E∘H + 2E), puis dans une version quantique en une racine primitive ℓ-ième de l'unité q (H∘E = q²E∘H). Il établit que l'opérateur de Casimir C est une homothétie, puis construit une
    sous-algèbre d'opérateurs compatibles avec un projecteur Pa et un morphisme d'algèbres vers L(Wℓ), dont il étudie les images de E, H et F.
