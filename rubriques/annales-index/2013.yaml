  nom: 'Trois exercices : matrice par blocs, calcul de la somme des 1/(2n+1)², hyperbole équilatère'
  apercu: Le premier exercice montre que la matrice par blocs M_A = (0, I_n ; A, 0) est diagonalisable si et seulement si A est inversible et diagonalisable. Le deuxième calcule xS(x) = ½ ln((1+x)/(1−x))
    pour la série des x^(2n)/(2n+1), en déduit une intégrale égale à la somme des 1/(2n+1)², puis évalue cette somme, égale à π²/8, via l'intégrale de ln t/(1 − t²) et une intégrale double sur un triangle.
    Le troisième établit que quatre points cocycliques d'une hyperbole équilatère d'équation XY = k ont un produit d'abscisses constant.
