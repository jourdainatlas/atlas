  nom: Les intégrales Tm et un modèle d'acoustique des gaz raréfiés
  apercu: 'Le sujet étudie les fonctions Tm(x), intégrales sur ]0, +∞[ de t^m e^(−(t² + x/t)) : convergence, continuité, régularité et convexité, relations de récurrence et équation différentielle, développement
    en série entière de Tk(1 + x), puis comportement en O(x^((m+1)/3) e^(−3(x/2)^(2/3))) quand x tend vers l''infini. Il majore ensuite T−1 et l''opérateur intégral de noyau T−1(|x − y|) sur [0, L], et
    en déduit par un théorème de point fixe l''existence d''une solution à une équation cinétique simplifiée pour L < 1/20.'
