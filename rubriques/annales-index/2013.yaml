  nom: Surjectivité de l'application a ↦ a exp a
  apercu: Le sujet construit une norme d'algèbre sur toute C-algèbre unitaire de dimension finie et établit des identités d'Abel. Dans une telle algèbre normée, il montre que la série ω(a) des (−1)^(n−1)
    n^(n−1) a^n/n!, de rayon 1/e, est réciproque de Φ(a) = a exp a au voisinage de 0. Il prouve ensuite que z ↦ z e^z est surjective sur C, par l'absurde, en majorant la partie réelle d'une fonction entière
    ; enfin, en réduisant aux blocs λI + U avec U nilpotente et en composant des polynômes, il établit la surjectivité de A ↦ A exp A sur Mn(C).
