  nom: Puissances de matrices ; théorèmes de Lagrange, Wilson et Wolstenholme
  apercu: 'Le premier problème établit une condition nécessaire et suffisante de convergence de la suite (A^n) dans Mp(C) : soit toutes les valeurs propres sont de module strictement inférieur à 1, soit
    1 est valeur propre avec Ker(u − Id) ∩ Im(u − Id) = {0} et les autres valeurs propres sont de module strictement inférieur à 1 ; la preuve passe par la trigonalisation et un exemple 2×2 diagonalisable
    ouvre le problème. Le second démontre le théorème de Lagrange sur la divisibilité par p des coefficients de (x + 1)…(x + p − 1), en déduit le théorème de Wilson et sa réciproque, puis le théorème de
    Wolstenholme : p² divise le numérateur de Hp−1 pour p premier supérieur à 3.'
