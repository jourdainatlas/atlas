  nom: Équation de Boltzmann simplifiée et théorème H
  apercu: 'Le sujet caractérise d''abord les fonctions positives f vérifiant f(x cos θ − y sin θ) f(x sin θ + y cos θ) = f(x) f(y), qui, sous la seule hypothèse de continuité, sont nulles ou de la forme
    C e^(ax²) (via l''équation de Cauchy). Il établit ensuite des lemmes de type Grönwall pour des suites d''inégalités intégrales, qui servent à construire, par un schéma itératif convergeant uniformément,
    une solution locale d''une équation de type Boltzmann. Il montre enfin la conservation de la masse, puis une version simplifiée du théorème H : l''intégrale de f ln f décroît, et elle est stationnaire
    seulement pour une gaussienne (maxwellienne).'
  pages: 5
