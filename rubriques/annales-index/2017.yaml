  nom: Endomorphisme nilpotent anticommutant avec une symétrie et problème aux valeurs propres généralisé
  apercu: Dans un espace euclidien de dimension $2m + 1$, le sujet considère un endomorphisme nilpotent $T$ d'indice $2m + 1$ et une symétrie orthogonale $M$ avec $TM + MT = 0$ ; il étudie les images et
    noyaux des puissances de $T$, un sous-espace $G$ muni du produit scalaire $(v, w) \mapsto \langle T(v) \mid T(w) \rangle$ et construit une paire caractérisante $(w_1, w_2)$. Il montre que le problème
    « $\langle u \mid v \rangle = \lambda \langle T(u) \mid T(v) \rangle$ pour tout $v$ de $G$ » a une solution non nulle si et seulement si $\lambda$ annule un produit $Q_1Q_2$ de polynômes scindés à racines
    simples, proportionnel à $\psi(\lambda) = \det(A - \lambda B)/\det(B)$. Le cas $E = \mathbb{R}_{2m}[X]$, $T =$ dérivation, $M = P \mapsto P(-X)$ fait intervenir les polynômes de Legendre et l'inégalité
    $\int P^2 \leqslant 4\int P'^2$ pour $P(\pm 1) = 0$.
