  nom: Calcul approché de l'aire du quart de disque ; marches aléatoires sur un graphe et PageRank
  apercu: 'Le premier problème approche l''aire $\pi/4$ du quart de disque unité par la méthode des rectangles (encadrement, écart égal à $1/n$, suites adjacentes pour les subdivisions dyadiques), par la
    méthode des trapèzes puis par la méthode de Monte-Carlo avec un intervalle de confiance à 95 %, en commentant la réponse à donner à un élève. Le second étudie les marches aléatoires sur un graphe orienté
    via leur matrice de transition (tétraèdre, pyramide tronquée où la loi oscille), les matrices stochastiques, puis les deux modèles du PageRank : avec facteur d''amortissement $\alpha$, la suite $Q B^k$
    converge vers l''unique densité $H = (\alpha/n) L (I - (1 - \alpha)A)^{-1}$.'
