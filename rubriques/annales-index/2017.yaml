- sujet: https://www.vmaths.fr/wp-content/uploads/E3A/PC/E3A_2017_PC_Maths1_enonce.pdf
  nom: Fonction zêta, matrices de rang 1, loi de Poisson et nombres premiers en Python
  apercu: Épreuve en quatre exercices indépendants. Le premier étudie la fonction $\zeta$ sur $\left]1, +\infty\right[$ (classe $\mathcal{C}^\infty$, limite $1$ en $+\infty$, équivalent $1/(x-1)$ en $1$
    par comparaison série-intégrale) et la série alternée $F(x) = \sum (-1)^n/n^x$, reliée par $\zeta(x) + F(x) = 2^{1-x} \zeta(x)$. Le deuxième montre qu'une matrice de rang 1 vérifie $A^2 = \operatorname{tr}(A)A$
    et est diagonalisable si et seulement si sa trace est non nulle ; le troisième majore les queues d'une loi de Poisson et compare la loi binomiale $\mathcal{B}(n, \lambda/n)$ à la loi de Poisson ; le
    quatrième programme en Python le comptage des nombres premiers.
