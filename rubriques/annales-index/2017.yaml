  nom: Variables aléatoires décomposables et infiniment divisibles
  apercu: Le sujet étudie la représentation de la loi d'une variable aléatoire comme loi d'une somme de variables indépendantes. Il caractérise les lois binomiales et uniformes sur $[\![0, n - 1]\!]$ décomposables
    ($n$ non premier) par factorisation des fonctions génératrices en polynômes à coefficients positifs, montre qu'une variable bornée infiniment divisible est constante et que les lois de Poisson et les
    sommes $\sum iX_i$ de variables de Poisson indépendantes sont infiniment divisibles. Il établit enfin, à l'aide d'une série entière auxiliaire $H_X$ telle que $G_X = \exp(H_X)$, qu'une variable entière
    avec $P(X = 0) > 0$ est infiniment divisible si et seulement si ses coefficients $\lambda_k$ sont positifs, si et seulement si elle a la loi d'une somme $\sum iX_i$.
