  nom: Intégrales et fonction Gamma, endomorphismes antisymétriques, méthode de Newton et extinction, chemins de Manhattan
  apercu: Épreuve en quatre exercices. Le premier obtient par changement de variable et convergence dominée un équivalent de $I_n = \int_0^{\infty} \mathrm{d}t/(1 + t^\alpha)^n$ faisant intervenir $\Gamma(1/\alpha)$,
    puis exprime la série entière $\sum I_n x^n$ par une intégrale. Le deuxième montre qu'un automorphisme antisymétrique d'un espace euclidien est en dimension paire, que $u \circ u$ est diagonalisable
    en base orthonormée à valeurs propres strictement négatives, et réduit $u$ en blocs $2 \times 2$ de la forme $\begin{pmatrix} 0 & -a \\ a & 0 \end{pmatrix}$. Le troisième étudie la méthode de Newton
    pour un polynôme de degré 3 (convergence quadratique, programme Python) et l'applique à la probabilité d'extinction d'un processus de Galton-Watson ; le quatrième dénombre les chemins Nord-Est, calcule
    par le principe de réflexion la probabilité d'un premier passage sur la diagonale à l'étape $2n$ et en donne un équivalent en $N^{-3/2}$.
  pages: 12
