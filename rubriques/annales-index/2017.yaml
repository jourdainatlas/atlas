  nom: Sous-groupes compacts du groupe linéaire
  apercu: Le sujet démontre le théorème du point fixe de Markov-Kakutani pour un sous-groupe compact $G$ de $\mathrm{GL}(E)$ agissant sur un convexe compact non vide, en construisant une norme invariante
