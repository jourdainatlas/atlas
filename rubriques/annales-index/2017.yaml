  nom: 'Dynamique des applications de l''intervalle : plis et entropie'
  apercu: Le sujet étudie l'itération d'applications $f$ d'un intervalle dans lui-même et le nombre de plis $\lambda(f^{\circ n})$ de leurs itérées. Il décrit l'ensemble des points d'orbite bornée de $x
    \mapsto x^2 + c$ (vide pour $c > 1/4$, segment pour $c \in [-2, 1/4]$, compact non vide totalement discontinu pour $c < -2$), puis, pour une famille de fractions rationnelles $f_a$ semi-conjuguée à
    $x \mapsto 2x^2 - 1$, montre que les points périodiques sont denses pour $a < 3/5$ et ne le sont pas pour $a > 3/5$. Il définit ensuite l'entropie $h(f) = \lim (1/n) \log \lambda(f^{\circ n})$ par sous-additivité
    et la calcule pour un cubique (logarithme de la plus grande valeur propre d'une matrice de transition) et pour les applications tentes de pente $p$ ($h = \log p$). Enfin, pour les applications unimodales,
    il relie la série génératrice des nombres de plis à un invariant de pétrissage $\Delta_f$ (théorie de Milnor-Thurston) et obtient l'entropie $\log((1+\sqrt{5})/2)$ pour $x^2 - 7/4$.
