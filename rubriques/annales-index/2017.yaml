- sujet: https://www.vmaths.fr/wp-content/uploads/E3A/PSI/E3A_2017_PSI_Maths2_enonce.pdf
  nom: Matrices nilpotentes réelles
  apercu: 'Le sujet étudie l''ensemble $\mathcal{N}$ des matrices nilpotentes de $\mathcal{M}_n(\mathbb{R})$ : propriétés élémentaires (spectre, trigonalisation, critère $A^n = 0$, nilpotentes symétriques
    et antisymétriques), exemples en taille 2, puis il montre que $\mathcal{N}$ engendre l''hyperplan des matrices de trace nulle et que la dimension maximale d''un sous-espace contenu dans $\mathcal{N}$
    est $n(n-1)/2$. Il établit enfin que $\mathcal{N}$ est un fermé d''intérieur vide et construit une racine carrée de $I + \alpha A$ comme polynôme en $A$.'
  pages: 3
