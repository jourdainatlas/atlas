  nom: Théorème de Fejér, équirépartition et théorème de Weyl
  apercu: Le sujet démontre le théorème de Fejér (convergence uniforme des moyennes de Cesàro $\sigma_N(f)$ des sommes de Fourier d'une fonction continue 1-périodique, via le noyau de Fejér) et la convergence
    uniforme de $S_n(f)$ pour $f$ de classe $\mathcal{C}^\infty$. Il caractérise l'équirépartition modulo 1 par les moyennes de fonctions continues puis par le critère de Weyl, montre que $(\alpha n + x)$
    est équirépartie pour $\alpha$ irrationnel, établit l'inégalité et le lemme de van der Corput et en déduit le théorème de Weyl sur $(P(n))$. Il termine par les nombres de Liouville, le théorème de Liouville
    sur l'approximation des algébriques, la transcendance de $\sum 10^{-n!}$ et une version quantitative en $C/N$ de l'équirépartition de $(\alpha n + x)$.
