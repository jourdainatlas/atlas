  nom: Sur la partie symétrique d'une matrice
  apercu: 'Le sujet étudie les matrices réelles $A$ dont la partie symétrique $A_s = (A + A^\top)/2$ est définie positive. Il montre que $A_s$ est la projection orthogonale de $A$ sur les matrices symétriques,
    encadre les valeurs propres réelles de $A$ par celles de $A_s$, établit $\det(A) \geqslant \det(A_s)$ et caractérise les parties symétriques des matrices orthogonales. Il prouve ensuite qu''une telle
    matrice est $F$-régulière pour tout sous-espace $F$ (calculs de déterminants par blocs, exemples explicites), puis étudie les matrices positivement stables (valeurs propres de partie réelle $> 0$) :
    $A_s$ définie positive entraîne la stabilité positive, et pour $A$ positivement stable l''équation de Lyapounov $A^\top B + BA = I_n$ a une unique solution $B$, symétrique définie positive.'
