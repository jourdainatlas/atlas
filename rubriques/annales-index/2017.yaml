  nom: Racines des sommes partielles de la série exponentielle
  apercu: Le sujet étudie les polynômes $S_n = \sum_{i \leqslant n} X^i/i!$. Après l'étude de l'endomorphisme $P \mapsto P - P'$ de $\mathbb{R}_n[X]$, il montre que $S_n$ n'a pas de racine réelle pour $n$
    pair et une seule, $\alpha_n$, pour $n$ impair, que $\alpha_{2m+1}$ tend vers $-\infty$, puis, à l'aide de $h(x) = x e^{1-x}$ et du réel $\rho$ tel que $h(\rho) = -1$, que $\alpha_n \in \left]-n, n\rho\right[$
    et que $\alpha_{2m+1}$ est équivalent à $(2m + 1)\rho$. La dernière partie démontre le résultat admis (les racines complexes de $S_n$ sont de module $< n$) par un théorème de type Eneström-Kakeya sur
    les polynômes à coefficients monotones.
