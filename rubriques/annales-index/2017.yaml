  nom: Inégalités fonctionnelles pour la mesure gaussienne
  apercu: Le sujet introduit variance et entropie d'une fonction relativement à une densité de probabilité $m$, puis étudie l'opérateur $Lf = f''/2 - x f'$ associé à la gaussienne $\mu(x) = \exp(-x^2)/\sqrt{\pi}$
    et la famille $\Phi_f(t, x)$ obtenue en intégrant $f(x \cos t + y \sin t)$ contre $\mu(y)$, ce qui conduit à l'inégalité de Sobolev logarithmique gaussienne $\operatorname{Ent}(f) \leqslant \int f'^2
    \,\mathrm{d}\mu$. Il en déduit, pour une mesure vérifiant une telle inégalité, une inégalité de Poincaré et des bornes de concentration exponentielles (argument de Herbst), puis démontre une inégalité
    de type Prékopa-Leindler et en tire une inégalité de concentration gaussienne pour les voisinages d'unions finies d'intervalles.
