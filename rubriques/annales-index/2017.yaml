  nom: Vitesse de convergence de suites réelles
  apercu: 'La partie I définit la vitesse de convergence d''une suite à partir de la limite de $|u_{n+1} - \ell| / |u_n - \ell|$ (lente, géométrique, rapide, d''ordre $r$) et la calcule sur des exemples
    : $(1 + 1/2^n)^{2^n}$, sommes partielles de séries de Riemann, sommes partielles de $\sum 1/k!$, intégrale à paramètre, suites itératives $u_{n+1} = f(u_n)$ où l''ordre $r$ équivaut à l''annulation
    des $r - 1$ premières dérivées en $\ell$. La partie II calcule des moments exponentiels (lois de Poisson, géométrique, binomiale), montre que, pour une variable admettant un moment exponentiel, $\mathbb{P}(|S_n/n
    - m| \geqslant \varepsilon)$ est majorée par une suite géométrique, puis établit l''inégalité de Hoeffding $\mathbb{P}(|S_n/n| \geqslant \varepsilon) \leqslant 2 \exp(-n\varepsilon^2/(2c^2))$ pour des
    variables bornées centrées, appliquée à la loi binomiale.'
  pages: 4
