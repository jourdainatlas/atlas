  nom: Nombres de Stirling de seconde espèce et nombres de Bell
  apercu: Le sujet dénombre les partitions de $[\![1, n]\!]$ en $k$ parties, établit la récurrence $S(n, k) = S(n-1, k-1) + k S(n-1, k)$ et la programme en Python, puis étudie les nombres de Bell, dont
    la série génératrice exponentielle vaut $\exp(e^x - 1)$. Il décompose $X^n$ sur la base des factorielles descendantes $H_k$, obtient la série génératrice $(e^x - 1)^k/k!$ des $S(n, k)$, relie les dérivées
