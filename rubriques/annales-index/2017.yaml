  nom: Théorie de Floquet
  apercu: Le sujet étudie les systèmes linéaires à coefficients périodiques. Pour la récurrence d'ordre 2 $b(k) z(k+1) + a(k) z(k) + b(k-1) z(k-1) = 0$ à coefficients $p$-périodiques, la matrice de monodromie
    $Q$ est de déterminant 1 et l'existence d'une solution $p$-périodique équivaut à $\operatorname{tr}(Q) = 2$ ; toutes les solutions sont bornées si $|\operatorname{tr} Q| < 2$. Il généralise au cas vectoriel
    $Y(k+1) = A(k) Y(k)$ avec la factorisation $\Phi(k) = P(k) B^k$, traite le système différentiel $X' = A(t)X$ à coefficients $T$-périodiques (multiplicateurs de Floquet, $\rho_1\rho_2 = \exp \int \operatorname{tr}
    A$), et prouve enfin que toute matrice inversible complexe admet une racine $p$-ième.
  pages: 4
