  nom: Exponentielle intégrale, opérateur $T$ et équation $xy'' + y' - (x + 1)y = 1$
  apercu: La partie I étudie $S(x) = \int_0^x (1 - e^{-t})/t \,\mathrm{d}t$ et $R(x) = \int_x^\infty e^{-t}/t \,\mathrm{d}t$ (développement en série entière, relation $S(x) = R(x) + \ln x + \gamma$, expression
    de $\gamma$ comme limite et comme $-\int_0^\infty \ln(t) e^{-t} \,\mathrm{d}t$, intégrales de Frullani). La partie II étudie l'opérateur $T(P)(x) = \int_0^\infty e^{-t} P(x + t) \,\mathrm{d}t$ sur les
    polynômes, où $T = \sum D^k$, puis sur les fonctions continues bornées et sur $\operatorname{Vect}(\cos, \sin)$. La partie III résout l'équation $xy'' + y' - (x + 1)y = 1$ par série entière et par changement
