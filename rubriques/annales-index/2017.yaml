  nom: Transformée de Cayley des matrices antisymétriques ; phénomène de Gibbs
  apercu: Le problème d'algèbre montre que les valeurs propres d'une matrice antisymétrique réelle sont imaginaires pures, que $R = (I + A)^{-1}(I - A)$ est alors une matrice orthogonale de déterminant
    1, et réciproquement que toute matrice orthogonale $R$ telle que $I + R$ est inversible s'écrit ainsi, en particulier toute rotation de $\mathbb{R}^3$ d'angle $\theta \in \left]-\pi, \pi\right[$. Le
    problème d'analyse établit des lemmes de Riemann-Lebesgue, calcule l'intégrale de Dirichlet $\int_0^\infty \sin(t)/t \,\mathrm{d}t = \pi/2$ par une transformée de Laplace solution de $y'' + y = 1/x$,
    puis met en évidence le phénomène de Gibbs pour la série de Fourier d'un signal créneau, dont le dépassement limite dépasse $0{,}17$.
