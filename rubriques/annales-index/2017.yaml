  nom: Exponentielles de matrices et d'opérateurs, formule de Trotter-Kato
  apercu: Le sujet étudie les exponentielles de matrices et d'opérateurs et la convergence en norme des produits $(e^{-tA/n} e^{-tB/n})^n$ vers $e^{-t(A+B)}$. En dimension finie, il établit la formule de
    Lie-Trotter-Kato avec une erreur en $C/n$, et en $C/n^2$ pour la version symétrisée de Strang. Il introduit ensuite les semi-groupes d'opérateurs bornés sur un espace de Hilbert et leur générateur (multiplication
    sur $\ell^2$, translations et changement de variable sur $L^2(\mathbb{R})$), exhibe un cas de non-convergence, puis construit sur $\ell^2(\mathbb{N}^*, \mathbb{R}^2)$ un exemple d'opérateurs diagonaux
    par blocs montrant que la vitesse ne peut dépasser $c_t/n^{2\alpha-1}$.
