- sujet: https://www.ens.psl.eu/sites/default/files/2017_PC_sujet_Math.pdf
  nom: Rayon spectral et théorème de Perron
  apercu: 'Le sujet munit $\mathcal{M}_n(\mathbb{C})$ de la norme subordonnée à la norme 1, montre qu''elle vaut le maximum des sommes de colonnes et que $A^k$ tend vers $0$ dès que le rayon spectral est
    $< 1$ (par conjugaison d''une matrice triangulaire). Il établit la formule de Gelfand $\lim \|A^k\|^{1/k} = \rho(A)$ et l''inégalité $\rho(A) \leqslant \rho(A_+)$, puis démontre le théorème de Perron
    pour une matrice strictement positive : $\rho(A)$ est valeur propre simple dominante, de vecteur propre strictement positif, et $A^k x / \rho(A)^k$ converge vers un multiple de ce vecteur.'
  pages: 4
