  nom: Formule sommatoire de Poisson et une fonction doublement périodique
  apercu: Le sujet établit la formule sommatoire de Poisson pour une fonction de classe $\mathcal{C}^1$ dont la fonction et la dérivée sont des $O(1/x^2)$, puis développe en série de Fourier la fonction
    $2\pi$-périodique égale à $x \mapsto e^{tx}$ sur $\left[-\pi, \pi\right[$ pour obtenir des développements de $\pi t/\operatorname{sh}(\pi t)$. Après un travail sur les suites doubles sommables indexées
    par $\mathbb{Z}^2$, il étudie la série $\phi(x) = \sum (-1)^{n-1} n \operatorname{ch}(nx)/\operatorname{sh}(n\pi)$ et l'intégrale $\gamma(x) = \int_0^{+\infty} \cos(2tx)/\operatorname{ch}^2(t) \,\mathrm{d}t$
    pour démontrer l'identité $1/(2\pi) + \sum (-1)^n n/\operatorname{sh}(n\pi) (\operatorname{ch}(nx) + \cos(nx)) = 0$ sur $\left]-\pi, \pi\right[$. Il en déduit une fonction $\wp$, $2\pi$- et $2i\pi$-périodique
    et paire, définie sur $\mathbb{C}$ privé de $\Lambda = (2\mathbb{Z}+1)\pi + i(2\mathbb{Z}+1)\pi$ (translaté du réseau $2\pi\mathbb{Z} + 2i\pi\mathbb{Z}$), développable en série entière au voisinage
    de chaque point, avec un rayon $\sqrt{2}\,\pi$ en $0$.
