  nom: Le réseau $\mathbb{Z}^2$ et ses isométries ; une équation fonctionnelle
  apercu: 'Le premier problème caractérise les $\mathbb{Z}$-bases du réseau $\mathbb{Z}^2$ (matrices à coefficients entiers de déterminant $\pm 1$, vecteurs à coordonnées premières entre elles), puis les
    applications linéaires qui conservent le réseau, et montre que toute isométrie affine du plan qui le préserve s''écrit de façon unique comme composée d''une translation de vecteur entier et d''un élément
    d''un groupe fini à huit éléments fixant l''origine. Il en déduit un pavage du plan par des triangles et étudie un sous-groupe et des frises. Le second problème détermine les fonctions $f$ de $\left]0,
    +\infty\right[$ dans lui-même vérifiant $f(x f(y)) = y f(x)$ et bornées sur $\left[1, +\infty\right[$ : la seule solution est $x \mapsto 1/x$.'
