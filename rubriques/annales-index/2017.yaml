- sujet: documents/annales/2017/mines-ponts/Maths-PC-2.pdf
  nom: Première répétition
  apercu: Le sujet étudie l'exponentielle tronquée $T_n(x) = \sum_{k \leqslant n} n^k x^k/k!$ et montre, grâce à une formule de Taylor avec reste intégral, que $T_n(x)$ est équivalent à $e^{nx}$ pour $0
    < x < 1$ et négligeable devant $e^{nx}$ pour $x > 1$. Il établit la méthode de Laplace pour les intégrales $\int f(x)^n \,\mathrm{d}x$, en déduit la formule de Stirling puis l'équivalent $T_n(1) \sim
    e^n/2$. Il l'applique enfin au rang $X$ de la première répétition lors de tirages avec remise dans une urne à $n$ boules, dont l'espérance est équivalente à $\sqrt{\pi n/2}$.
