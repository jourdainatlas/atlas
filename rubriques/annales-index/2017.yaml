  nom: Grandes déviations
  apercu: 'Pour une suite de variables discrètes indépendantes de même loi que $X$, de somme $S_n$, le sujet montre que $P(S_n \geqslant na)$ tend géométriquement vers $0$ lorsque $a > E(X)$ et que $X$
    admet des moments exponentiels. Il étudie la fonction génératrice des moments $\varphi_X(t) = E(e^{tX})$ (intervalle de définition, régularité $\mathcal{C}^\infty$, croissance de $\varphi''/\varphi$),
    la loi faible des grands nombres par Bienaymé-Tchebychev et le lemme de Fekete pour les suites sur-additives, puis établit le théorème de Cramér : la limite de $\ln P(S_n \geqslant na)/n$ est la borne
    inférieure de $\ln \varphi_X(t) - ta$ sur $t \geqslant 0$, avec calculs explicites pour les lois de Bernoulli et de Poisson et applications asymptotiques à des sommes de coefficients binomiaux.'
