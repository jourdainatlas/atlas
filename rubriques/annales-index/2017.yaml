  nom: Étude d'un endomorphisme d'un espace de fonctions numériques
  apercu: Sur l'espace $\mathcal{E}$ des fonctions de classe $\mathcal{C}^\infty$ de $[-a, a]$ dans $\mathbb{C}$, le sujet étudie les endomorphismes $u(f)(x) = (2/\pi)\int_0^{\pi/2} f(x \sin t) \,\mathrm{d}t$
    et $v(f)(x) = f(0) + x\int_0^{\pi/2} f'(x \sin t) \,\mathrm{d}t$, à l'aide des intégrales de Wallis ($W_n W_{n+1} = \pi/(2(n + 1))$). Il examine leur continuité pour la norme uniforme et pour la norme
    $M(f) + M(f')$, la densité des polynômes, montre que $u$ et $v$ sont des automorphismes réciproques l'un de l'autre, puis détermine leurs valeurs propres et vecteurs propres, qui sont des monômes.
