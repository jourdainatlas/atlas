  nom: Fonction signe de matrice, racine carrée et décomposition polaire
  apercu: 'Le sujet étudie l''itération $U_{\ell+1} = (U_\ell + U_\ell^{-1})/2$ partant d''une matrice inversible $A$ sans valeur propre imaginaire pure : après le cas scalaire (méthode de Héron complexe
    et homographie $z \mapsto (z - 1)/(z + 1)$) et la convergence vers $0$ des puissances d''une matrice de spectre dans le disque unité, il montre que la suite converge vers une involution (fonction signe).
    Appliquée à une matrice par blocs, l''itération fournit l''unique racine carrée de spectre dans le demi-plan $\operatorname{Re} > 0$, puis le sujet caractérise le facteur orthogonal (ou unitaire) de
    la décomposition polaire comme la meilleure approximation de $M$ par une matrice orthogonale pour la norme de Frobenius.'
