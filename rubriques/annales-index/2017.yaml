  nom: Réduction de Jordan, bicommutant, décomposition de Dunford et répliques de Chevalley
  apercu: 'Sur un corps de caractéristique nulle, le sujet caractérise les nilpotents par la nullité des traces de leurs puissances, montre que le commutant d''un endomorphisme cyclique est $\mathbb{K}[u]$
    et démontre la réduction de Jordan des nilpotents en sous-espaces cycliques. Il établit le théorème du bicommutant $\mathcal{C}\mathcal{C}(u) = \mathbb{K}[u]$, construit la décomposition de Dunford
    par un algorithme de type Newton $A_{k+1} = A_k - P(A_k)S(A_k)$, puis développe la théorie des répliques de Chevalley via les produits tensoriels $\mathcal{N}_{r,s}$ : les répliques de $A = D + N$ sont
    décrites, et $A$ est nilpotente si et seulement si $\operatorname{Tr}(AA'') = 0$ pour toute réplique $A''$.'
