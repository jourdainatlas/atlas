  nom: Marche aléatoire dans un labyrinthe
  apercu: 'Un rat se déplace au hasard dans un labyrinthe de cinq salles, et la loi de sa position vérifie $X_{k+1} = B X_k$. Le sujet démontre un théorème ergodique en moyenne : pour un endomorphisme $1$-lipschitzien
