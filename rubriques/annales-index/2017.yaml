  nom: Endomorphismes échangeurs
  apercu: 'Un endomorphisme $u$ d''un $\mathbb{C}$-espace de dimension finie est dit échangeur s''il existe une décomposition $E = F \oplus G$ avec $u(F) \subset G$ et $u(G) \subset F$. Le sujet établit
    l''équivalence entre trois conditions : $u$ est échangeur, $u$ est somme de deux endomorphismes de carré nul, $u$ est semblable à $-u$. Il passe par la dimension 2, des calculs par blocs, la décomposition
    de $E$ en sous-espace caractéristique et image d''une puissance (lemme de Fitting), puis une réduction au cas d''un endomorphisme indécomposable.'
