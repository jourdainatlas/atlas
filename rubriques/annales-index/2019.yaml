  nom: Comportement asymptotique de sommes de séries entières et application à l'équation d'Airy
  apercu: Le sujet établit l'équivalent S_{r,p}(x) ∼ x^r e^x / p en +∞ pour S_{r,p}(z) = somme des (pn)^r z^{pn}/(pn)!. Il montre d'abord que le cas p ≥ 2 se ramène au cas p = 1 en sommant sur les racines
    p-ièmes de l'unité, traite le cas p = 1 et r > 0 par une méthode probabiliste reposant sur la loi de Poisson, puis étend le résultat à r réel grâce à un lemme de comparaison des séries entières. Il
    en déduit, via la formule d'Euler pour Γ, un équivalent en +∞ de la solution de l'équation d'Airy x'' = t x telle que f(0) = 1 et f'(0) = 0.
