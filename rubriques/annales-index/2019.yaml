  nom: Polynômes de Laguerre et quadrature de Gauss, équation différentielle, marche aléatoire sur trois points
  apercu: Le premier exercice munit R_n[X] du produit scalaire (P | Q) = ∫_0^{+∞} P(t)Q(t)e^{-t} dt, construit les polynômes de Laguerre unitaires comme vecteurs propres de l'endomorphisme α(P) = XP'' +
