  nom: Convergence faible, transformée de Fourier sur l'espace de Schwartz et lemme div-rot
  apercu: Le sujet introduit la convergence faible dans un espace préhilbertien, puis l'espace S(R²) des fonctions C∞ à décroissance rapide ainsi que toutes leurs dérivées. Il montre qu'un endomorphisme
