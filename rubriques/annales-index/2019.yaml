- sujet: https://www.vmaths.fr/wp-content/uploads/XENS/MP/X_ENS_2019_MP_MB_enonce.pdf
  nom: Solutions de viscosité d'une équation de Hamilton-Jacobi en dimension un
  apercu: Le sujet étudie l'équation u(x) + H(x, u'(x)) = 0 sur [−1, 1]. Il montre d'abord que le problème u + |u'| = 0 avec u(−1) = u(1) = −1 n'a pas de solution de classe C¹, alors que u_0(x) = −e^{−1+|x|}
    et u_1(x) = −e^{1−|x|} le vérifient hors de 0. Il introduit ensuite les sur- et sous-différentiels D⁺u(x) et D⁻u(x) d'une fonction continue, en donne une caractérisation par limites supérieures de taux
    d'accroissement et les calcule pour une fonction concave. Il définit les sur- et sous-solutions, démontre un principe de comparaison par la méthode du dédoublement des variables, en déduit que u_0 est
    l'unique solution au sens de viscosité pour H(x, p) = |p|, et l'obtient comme limite uniforme des solutions u_ε du problème régularisé u + |u'| − εu'' = 0.
  pages: 7
