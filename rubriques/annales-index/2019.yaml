- sujet: https://www.e3a-polytech.fr/wp-content/uploads/2019/12/math_1_e3a_psi_2019.pdf
  nom: 'Quatre exercices : opérateur de moyenne glissante, loi de Poisson, hyperplans de Mn(ℝ), suite u(n+1) = un + un²'
  apercu: 'Le premier exercice étudie l''endomorphisme U de C⁰(ℝ, ℝ) défini par U(f)(x) = ∫ de x−1 à x de f : sa restriction aux polynômes, son noyau (fonctions 1-périodiques d''intégrale nulle) et le fait
    que tout réel λ > 0 est valeur propre. Le deuxième calcule la loi et l''espérance d''une variable déduite d''une variable de Poisson. Le troisième montre que tout hyperplan de Mn(ℝ) contient une matrice
    inversible et qu''aucun hyperplan n''est stable par produit pour n ⩾ 3 ; le quatrième établit que la suite définie par u(n+1) = un + un² est équivalente à tn = e^(2^n L), puis que un = tn + b + o(1)
    pour un réel b.'
