  nom: Comportement asymptotique de sommes de séries entières
  apercu: Le sujet établit que S_{r,p}(x) = somme des (pn)^r x^{pn}/(pn)! est équivalente à x^r e^x / p quand x tend vers +∞. Le cas p = 1 est obtenu par une méthode probabiliste fondée sur la loi de Poisson
    et l'inégalité de Bienaymé-Tchebychev, le cas p ≥ 2 s'en déduit en majorant S_{r,1}(zx) pour |z| = 1, z ≠ 1, et en sommant sur les racines p-ièmes de l'unité. On en tire un équivalent de la solution
    développable en série entière de t x'' − x = 0 avec f'(0) = 1.
