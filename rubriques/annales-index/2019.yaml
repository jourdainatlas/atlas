  nom: Identités de Newton et méthode de Le Verrier-Faddeev
  apercu: Pour une matrice A de M_n(R) ayant n valeurs propres distinctes, le sujet relie les traces des puissances de A aux sommes de Newton S_k = Σ λ_i^k, puis démontre les identités de Newton exprimant
    les sommes T_k des puissances des racines d'un polynôme à partir de ses coefficients. Il en déduit que les coefficients du polynôme caractéristique sont l'unique solution d'un système triangulaire,
    puis justifie l'algorithme de Le Verrier-Faddeev (B_k = B_{k−1}A + d_k I_n, d_k = −tr(B_{k−1}A)/k) qui fournit à la fois le polynôme caractéristique et l'inverse de A comme polynôme en A, avec une application
    numérique pour n = 4 et une programmation en Python.
