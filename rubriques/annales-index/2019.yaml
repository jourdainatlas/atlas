- sujet: https://www.concours-centrale-supelec.fr/sites/default/files/documents/M018.pdf
  nom: Réduction de sous-algèbres de L(E)
  apercu: 'Le sujet étudie les sous-algèbres de L(E) et de Mn(K) : exemples (matrices triangulaires, stabilisateur d''un sous-espace, de dimension n² − pn + p²), puis l''algèbre commutative des matrices
    circulantes, codiagonalisable sur ℂ. À l''aide du produit scalaire tr(AᵀB), il montre qu''une sous-algèbre stricte de Mn(ℝ) est de dimension au plus n² − n + 1. Il prouve enfin qu''une algèbre de nilpotents
    est trigonalisable (en fait strictement triangulaire dans une même base) en admettant puis en démontrant le théorème de Burnside sur les algèbres irréductibles.'
