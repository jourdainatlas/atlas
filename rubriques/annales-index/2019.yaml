  nom: Quaternions et rotations ; lois géométriques et absence de mémoire ; base 3 équilibrée et compilation
  apercu: L'option mathématiques comporte deux problèmes. Le premier étudie les rotations et translations du plan par les nombres complexes, construit le centre d'une composée de rotations par décomposition
    en symétries axiales, puis introduit les quaternions comme matrices M(a, b) de M_2(C), leur norme multiplicative et la représentation des rotations vectorielles de R^3 par q ↦ pqp^{−1} pour p unitaire.
    Le second calcule des sommes de séries entières dérivées de Σ x^n pour obtenir espérance et variance de la loi géométrique, étudie deux archers et la loi du nombre de succès G, puis caractérise les
    lois géométriques par l'absence de mémoire et par un taux de panne constant. L'option informatique traite en Python l'écriture des entiers en base 3 équilibrée et les chemins de Delannoy, puis l'ordre
    topologique d'un graphe de dépendances, la durée de vie des variables et la coloration gloutonne d'un graphe de coexistence.
