  nom: Comportement asymptotique de sommes de séries entières
  apercu: 'Le sujet établit l''équivalent S_{r,p}(x) ~ (1/p) x^r e^x quand x → +∞, où S_{r,p}(z) = Σ_{n⩾1} (pn)^r z^{pn}/(pn)!. Le cas p = 1 est obtenu par une méthode probabiliste : avec X_x de loi de
    Poisson de paramètre x, on montre que 𝔼((X_x/x)^r) tend vers 1 grâce à l''inégalité de Bienaymé-Tchebychev et aux moments factoriels. Le cas p ⩾ 2 s''en déduit en montrant que S_{r,1}(zx) = o(x^r e^x)
    pour |z| = 1, z ≠ 1, par une transformation d''Abel, puis en sommant sur les racines p-ièmes de l''unité. En application, la solution développable en série entière de t x'''' − x = 0 avec f''(0) = 1
    vérifie f(t) ~ t^{1/4} e^{2√t}/(2√π).'
