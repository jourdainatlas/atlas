  nom: Reconstruction d'une suite binaire à partir d'observations bruitées
  apercu: Le sujet démontre d'abord, au moyen d'une dilatation unitaire et de la norme d'opérateur, que le maximum du module d'un polynôme sur le disque unité fermé est atteint sur le cercle unité. Il en
    déduit qu'un polynôme non nul de degré au plus n − 1 à coefficients dans {−1, 0, 1} vérifie sup_{θ ∈ [−π/L, π/L]} |A(e^{iθ})| ⩾ 1/n^{L−1}, puis établit l'inégalité de concentration P(|S_n/n − q| ⩽ |S_n/n
    − p|) ⩽ e^{−n(p−q)²/2} pour une somme de variables de Bernoulli. La dernière partie combine ces résultats pour montrer qu'une source x ∈ {0, 1}^n peut être reconstruite avec grande probabilité à partir
    de e^{3 ln(n) n^{1/3}} observations bruitées où chaque coordonnée est conservée avec probabilité p.
