  nom: Entiers cyclotomiques et théorème de Fermat pour p = 3 et pour p régulier
  apercu: 'Le sujet construit les outils d''arithmétique des corps de nombres utilisés pour deux cas du théorème de Fermat : anneau euclidien Z[j], polynômes cyclotomiques (irréductibilité de Φp démontrée,
    celle de Φn admise), matrices compagnons, entiers algébriques (caractérisation par le polynôme minimal et par les groupes de type fini, structure d''anneau). Pour K = Q(ζ), ζ = e^(2iπ/p), il montre
    que l''anneau des entiers est Z[ζ], que l''idéal engendré par λ = 1 − ζ est premier de quotient Fp et que les unités sont les ζ^r ε avec ε réelle (lemme de Kronecker). Il en déduit que x³ + y³ + z³
    = 0 n''a pas de solution non triviale (descente infinie dans Z[j]) puis que x^p + y^p + z^p = 0 n''en a pas avec p ∤ xyz lorsque p > 3 est régulier.'
