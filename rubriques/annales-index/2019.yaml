  nom: Réduction des matrices nilpotentes et partitions d'entiers
  apercu: Le sujet réduit d'abord les endomorphismes nilpotents d'indice 2 et caractérise les matrices nilpotentes par leurs valeurs propres, leur polynôme caractéristique X^n et leurs polynômes annulateurs,
    puis étudie l'existence de racines carrées de matrices nilpotentes (aucune si 2p − 1 > n). Il démontre ensuite que tout nilpotent est semblable à une matrice diag(J_{α_1}, …, J_{α_k}) de blocs de Jordan,
    la partition (α_1, …, α_k) de n étant déterminée par les rangs des puissances, ce qui met les classes de similitude des nilpotents en bijection avec les partitions de n. Il en déduit que M, 2M et M^⊤
    sont semblables pour M nilpotente et termine par un algorithme récursif de calcul du nombre de partitions, programmé en Python.
