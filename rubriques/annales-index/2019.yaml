- sujet: https://www.concours-centrale-supelec.fr/sites/default/files/documents/M005_0.pdf
  nom: Endomorphismes cycliques, commutant et décomposition de Frobenius
  apercu: Le sujet étudie les endomorphismes cycliques, c'est-à-dire ceux qui admettent une base de la forme (x0, f(x0), …, f^(n−1)(x0)), à travers leurs matrices compagnons ; il en tire une démonstration
    du théorème de Cayley-Hamilton et montre, sur ℂ, que f est cyclique dès que (Id, f, …, f^(n−1)) est libre. Il établit ensuite que le commutant d'un endomorphisme cyclique est K[f], démontre la décomposition
    de Frobenius en blocs compagnons et en déduit que dim C(f) ⩾ n ; il termine par les isométries et les nilpotents « orthocycliques » d'un espace euclidien.
