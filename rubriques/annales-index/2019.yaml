  nom: Logarithmes et approximation de ln 2 ; somme des cancres et suites de Farey
  apercu: 'Le premier problème définit les logarithmes comme primitives de a/x nulles en 1, en établit les propriétés (morphisme, monotonie, bijectivité), introduit le logarithme décimal avec des exercices
