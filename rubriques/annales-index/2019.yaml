  nom: La méthode du gradient conjugué
  apercu: Le sujet étudie la résolution de Ax = b pour A symétrique définie positive. Après des préliminaires sur la norme subordonnée, la norme ∥x∥_A et la racine carrée A^{1/2}, il introduit les espaces
    de Krylov H_k engendrés par les P(A)r_0 et montre que le minimiseur x_k de J(x) = ½⟨x, Ax⟩ − ⟨b, x⟩ sur x_0 + H_k atteint la solution en au plus d étapes. Les polynômes de Tchebychev donnent la majoration
    ∥x_k − x̄∥_A ≤ 2∥x_0 − x̄∥_A ((√κ − 1)/(√κ + 1))^k, et l'algorithme du gradient conjugué est construit par récurrence avec des directions A-orthogonales.
