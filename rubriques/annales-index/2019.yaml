- sujet: https://www.e3a-polytech.fr/wp-content/uploads/2019/12/math_2_e3a_psi_2019.pdf
  nom: Équations différentielles y^(n) = a0 y + ⋯ + a(n−1) y^(n−1), Vandermonde et sommes de séries entières
  apercu: Après des questions de cours sur le nombre j et le déterminant de Vandermonde, le sujet montre l'inversibilité de la matrice de Vandermonde par un argument polynomial et en déduit la liberté des
    exponentielles x ↦ e^(γk x). Il résout l'équation y''' = y de deux façons (équation du premier ordre, puis système X' = AX) pour exprimer la somme de la série des x^(3n)/(3n)! à l'aide de fonctions
    usuelles, étudie l'espace des solutions d'une équation linéaire d'ordre n à coefficients constants et la dérivation sur cet espace, puis munit l'espace des solutions de y^(2p) = y d'un produit scalaire
    intégral pour décomposer orthogonalement la somme des x^(4k)/(4k)!.
