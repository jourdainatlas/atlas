  nom: Le problème des moments
  apercu: Le problème se demande si une densité de probabilité est déterminée par ses moments mn(f) = ∫ x^n f(x) dx. Après des calculs de moments (densité exponentielle, densité gaussienne), il démontre
    le théorème de Weierstrass par les polynômes de Bernstein et en déduit que la réponse est positive sur [0, 1]. Il calcule la transformée de Fourier de la gaussienne par une équation différentielle,
    puis l'utilise pour montrer que la densité log-normale f et les densités f(x)(1 + α sin(2π ln x)) ont les mêmes moments, ce qui donne une réponse négative sur [0, +∞[.
