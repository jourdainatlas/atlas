- sujet: https://agreg.org/data/uploads/sujets/AP/AP19.pdf
  nom: Points critiques de polynômes aléatoires
  apercu: Le sujet montre que, pour un polynôme Pn dont les n racines sont des variables aléatoires indépendantes de même loi µ, la mesure empirique des racines de Pn' converge vers µ (en probabilité, contre
    toute fonction test lisse à support compact). Il prépare ce résultat par l'étude du Laplacien au sens des distributions (Δ ln|z| = 2π δ0, d'où Δ ln|f| = 2π Σ δ des zéros pour f holomorphe), la résolution
    du problème de Dirichlet sur le disque par le noyau de Poisson et la formule de Poisson-Jensen ; il traite d'abord le cas de racines sur le cercle unité de loi non uniforme (critère de Weyl, théorème
    de Rouché sous forme d'intégrale de f'/f), puis le cas général par un théorème de convergence dominée en probabilité.
