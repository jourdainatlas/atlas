  nom: Étude d'une série de fonctions
  apercu: Le sujet étudie la dérivabilité de la fonction de Riemann R(x) = somme des sin(n²x)/n². Il montre que h Σ f(nh) tend vers l'intégrale de f sur R+ quand h tend vers 0, ce qui donne un équivalent
    de R en 0+ et sa non-dérivabilité en 0, puis il démontre la formule sommatoire de Poisson à l'aide des coefficients de Fourier. Appliquée à f(t) = (e^{it²} − 1)/t², elle fournit un développement de
    F(x) = Σ e^{in²x}/n² en 0+ et permet de prouver que R est dérivable en π.
