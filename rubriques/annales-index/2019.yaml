- sujet: documents/annales/2019/mines-ponts/Maths-MP-2.pdf
  nom: Majoration du rayon spectral de la matrice de Hilbert
  apercu: Le problème étudie la plus grande valeur propre ρn de la matrice de Hilbert Hn = (1/(j + k + 1)). Il montre que Hn est symétrique définie positive et que l'espace propre associé à ρn est une droite
    engendrée par un vecteur sans coordonnée nulle (propriété de type Perron-Frobenius), puis établit l'inégalité de Hilbert ᵗX Hn X ⩽ π‖X‖² par une intégration sur le cercle unité. Il identifie ensuite
    ρn à une borne inf-sup issue d'un opérateur intégral à noyau Kn(tx) et, par un choix de fonction test solution d'une équation différentielle et la fonction Bêta, obtient la majoration explicite ρn ⩽
    2ωn arcsin(1/ωn) avec ωn = 2((n!)²/(2n)!)^(1/2n), dont il étudie l'écart à π.
  pages: 5
