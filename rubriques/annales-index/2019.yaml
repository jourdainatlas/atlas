- sujet: https://www.concours-centrale-supelec.fr/sites/default/files/documents/M013.pdf
  nom: Nombres d'Euler, tangente et permutations alternantes
  apercu: Le sujet définit les entiers αn = f^(n)(0) pour f(x) = (sin x + 1)/cos x, montre que f est développable en série entière de rayon π/2 grâce à l'équation 2f' = f² + 1, et relie les αn d'indice
    impair au développement de tan. À l'aide d'intégrales de type Wallis, il établit la formule du produit de sin(πx) et le développement π tan(πx) = Σ 2(2^(2p) − 1) ζ(2p) x^(2p−1), d'où un équivalent de
    α(2n+1). Il montre enfin que αn compte les permutations alternantes de ⟦1, n⟧ et en déduit la probabilité asymptotique d'être alternante et la limite (sin 1 + 1)/cos 1 d'une espérance.
