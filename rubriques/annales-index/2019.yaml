- sujet: https://www.ens.psl.eu/sites/default/files/19_mpi_mathd_sujet.pdf
  nom: Annulation de séries de Dirichlet tordues par des fonctions périodiques
  apercu: Le problème cherche quand une fonction f impaire et p-périodique vérifie Dk(1, f) = 0, où Dk(s, f) est la série de Dirichlet de τk·f et τk = 1 ∗ ⋯ ∗ 1 compte les factorisations en k facteurs.
    Après les outils de sommation (Abel, méthode de l'hyperbole, produit eulérien), il introduit les caractères modulo p, exprime Dk(1, f) à l'aide de sommes de cotangentes, de sommes de Gauss et des valeurs
    L(1, χ), puis, par un argument d'automorphismes de Q(ζp) et un calcul de déterminant circulant, montre que pour f à valeurs rationnelles et k premier à p − 1, Dk(1, f) = 0 force f = 0 dès que les L(1,
    χ) des caractères impairs sont non nuls.
