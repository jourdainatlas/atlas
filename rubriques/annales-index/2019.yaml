  nom: Entiers algébriques ayant beaucoup de conjugués de module 1 (théorème de Kronecker et nombres de Salem)
  apercu: Le sujet étudie les polynômes unitaires de Z[X], irréductibles sur Q, ayant beaucoup de racines de module 1. Il introduit le polynôme minimal d'un nombre algébrique et montre qu'il est à coefficients
    entiers pour un entier algébrique, puis démontre le théorème de Kronecker (si toutes les racines sont de module 1, ce sont des racines de l'unité) et l'irréductibilité des polynômes cyclotomiques Φ_n
    sur Q. Il définit ensuite l'ensemble S des entiers algébriques réels α > 1 dont tous les conjugués sont de module au plus 1 avec au moins un de module 1 (nombres de Salem), prouve que leur degré est
    pair et au moins 4, et construit la famille X^4 − (6 + n)X^3 + (10 + n)X^2 − (6 + n)X + 1 pour exhiber des éléments de S et déterminer le plus petit élément de S de degré 4.
  pages: 9
