  nom: Analyse combinatoire de différents modèles d'urne
  apercu: 'Le sujet présente la méthode de Flajolet pour les urnes équilibrées : après des préliminaires sur le développement en série entière de (1 − x)^{−α} à l''aide des polynômes L_k = X(X + 1)⋯(X +
    k − 1), il montre que, dans l''urne de Pólya élémentaire, le nombre de boules blanches après n tirages suit la loi uniforme sur ⟦1, n + 1⟧. Il code ensuite les issues d''une urne équilibrée par des
    polynômes P_n(u, v) dont la série génératrice exponentielle H vérifie une équation aux dérivées partielles, ce qui donne la loi explicite de X_n pour l''urne de Pólya générale. Il termine avec l''urne
    de Friedman, dont la loi s''obtient par développement limité, et une bijection entre tirages et permutations qui identifie le nombre de permutations de S_n ayant m montées.'
