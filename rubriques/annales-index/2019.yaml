  nom: Développement dyadique, loi uniforme et dénombrabilité
  apercu: Le sujet calcule d'abord la fonction caractéristique de X_n = Σ_{k=1}^n ε_k/2^k, où les ε_k sont des signes indépendants équiprobables, sous la forme Π_{k=1}^n cos(t/2^k), et en tire la limite
    simple sinc t. Il étudie ensuite l'écriture binaire des entiers et des nombres dyadiques D_n, montre que Y_n = Σ_{k=1}^n U_k/2^k (U_k de Bernoulli de paramètre 1/2 indépendantes) suit la loi uniforme
    sur D_n, puis que ℙ(Y_n ∈ I) tend vers la longueur de I et que 𝔼(f(Y_n)) converge pour f continue, avec pour application le calcul de ∫_0^1 (t − 1)/ln t dt. Il se termine par l'argument diagonal de
    Cantor et la non-dénombrabilité de [0, 1[.
