  nom: 'Quatre exercices : un endomorphisme de dérivation, Fibonacci et lois de Poisson, intégrales ∫ exp(−tⁿ), projecteurs spectraux'
  apercu: 'Le premier exercice étudie l''endomorphisme f ↦ (1 + x) f'' sur l''espace engendré par ln(1 + x) et les (1 + x)^(−k), sa diagonalisabilité et celle de son carré, puis des équations différentielles
    itérées et une série de fonctions. Le deuxième combine la suite de Fibonacci et une suite de variables aléatoires X(n+2) = X(n+1) + X(n) issue de deux lois de Poisson indépendantes : loi, espérance,
    variance et covariance. Le troisième obtient un équivalent de Iₙ = ∫₁^∞ exp(−tⁿ) dt par convergence dominée, et le quatrième montre que u est diagonalisable si et seulement si ses puissances s''écrivent
    u^k = Σ λⱼ^k pⱼ, avec pⱼ = Lⱼ(u) pour les polynômes de Lagrange Lⱼ.'
