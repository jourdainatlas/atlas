- sujet: https://www.concours-centrale-supelec.fr/sites/default/files/documents/M047.pdf
  nom: Autour des fonctions hypergéométriques
  apercu: Le sujet définit les suites hypergéométriques, vérifiant P(n) uₙ = Q(n) uₙ₊₁ pour deux polynômes P et Q, puis la fonction Γ et le symbole de Pochhammer. Il étudie la fonction hypergéométrique
    de Gauss F(a, b, c) (rayon de convergence, dérivées, exemples) et en tire l'identité de Vandermonde, puis la fonction hypergéométrique confluente, solution d'une équation différentielle du second ordre,
    dont il montre que les polynômes de Laguerre sont des cas particuliers. La dernière partie calcule l'espérance et la variance de la loi hypergéométrique et montre qu'elle converge vers la loi binomiale
    quand la taille de l'urne tend vers l'infini.
