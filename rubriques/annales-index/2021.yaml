- sujet: https://www.ens.psl.eu/sites/default/files/2021_mp_sujet_mathc.pdf
  nom: Intersections atypiques
  apercu: Le sujet montre que le graphe d'une fonction ne rencontre un ensemble « exceptionnel » qu'en peu de points, sauf si la fonction est elle-même exceptionnelle. La partie algébrique décrit les fractions
    rationnelles qui envoient une infinité de points du cercle unité dans le cercle unité (X^d fois un produit de facteurs de Blaschke) et celles qui envoient les racines de l'unité dans les racines de
    l'unité (les cX^d, avec c racine de l'unité et d ∈ Z), à l'aide de l'indicatrice d'Euler. La partie analytique établit, pour une fonction transcendante f, une borne uniforme du nombre de points du graphe
    sur une courbe algébrique de degré fixé, une majoration de déterminants de type Vandermonde, puis que le graphe contient au plus c·n^ε points de (1/n)Z² (méthode de Bombieri-Pila).
  pages: 8
