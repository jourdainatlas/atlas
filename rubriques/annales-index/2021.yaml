  nom: Inégalités de Bernstein
  apercu: La première partie démontre, à l'aide des polynômes de Tchebychev et d'une formule d'interpolation aux racines de X^(2n) + 1, l'inégalité de Bernstein |f'(θ)| ⩽ n‖f‖∞ pour un polynôme trigonométrique
    f de degré n, puis en déduit l'inégalité ‖P'‖ ⩽ n²‖P‖ sur [−1, 1] pour un polynôme P de degré au plus n, avec égalité pour Tₙ. La seconde partie introduit la transformée de Fourier, le produit de convolution
    et une fonction plateau de classe C∞, et établit ‖f'‖∞ ⩽ Cλ‖f‖∞ pour une fonction dont la transformée de Fourier est nulle hors de [−λ, λ].
