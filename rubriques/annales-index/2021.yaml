  nom: Formules de quadrature, polynômes orthogonaux et accélération de la méthode des trapèzes
  apercu: Le sujet construit des formules de quadrature exactes sur ℝₙ[X] grâce à la base de Lagrange et majore leur erreur avec le noyau de Peano, ce qui donne une erreur en (b−a)³/(12n²) pour la méthode
    des trapèzes. Il montre que les polynômes orthogonaux associés à un poids ont des racines simples intérieures, qui sont les nœuds des méthodes de Gauss d'ordre 2n+1, avec les exemples de Legendre et
    de Tchebychev. Il introduit enfin les nombres et polynômes de Bernoulli par la série de z/(e^z − 1) pour obtenir le développement asymptotique de l'erreur des trapèzes en puissances de 1/n².
