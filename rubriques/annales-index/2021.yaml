  nom: 'Quatre exercices : intégrale de x^(−x), inverse généralisé, fonctions génératrices, formes linéaires sur Rn[X]'
  apercu: Le premier exercice développe x^(−x) en série de fonctions normalement convergente sur [0, 1] et en déduit, grâce à la fonction Γ, l'identité ∫₀¹ x^(−x) dx = Σ n^(−n). Le deuxième construit l'inverse
    généralisé d'un endomorphisme symétrique à partir de sa décomposition spectrale, l'interprète en termes de moindres carrés et le calcule sur une matrice 4 × 4. Les deux derniers portent sur des variables
    aléatoires définies par leurs fonctions génératrices (loi géométrique, développement de √(1 + t)) et sur la forme linéaire P ↦ ∫₀¹ P dans Rn[X] et la base duale des P ↦ P^(k)(0)/k!.
