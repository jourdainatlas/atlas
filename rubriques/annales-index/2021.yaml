  nom: Marche aléatoire, nombres de Catalan et déterminants de Hankel
  apercu: Le sujet étudie le premier retour à l'origine T d'une marche aléatoire sur Z de paramètre p, dont la loi s'exprime par les nombres de Catalan C_n qui comptent les chemins de Dyck. La série génératrice
    des C_n donne P(T ≠ 0) = 1 − √(1 − 4p(1 − p)), l'expression C_n = (2n choose n)/(n + 1) et l'absence d'espérance de T pour p = 1/2. Il montre ensuite que le déterminant de Gram des X^i vaut le produit
    des ‖V_i‖² pour un système orthogonal unitaire, et l'applique à un produit scalaire à poids dont les moments sont les C_n pour obtenir la valeur des déterminants de Hankel des nombres de Catalan.
