  nom: Sous-groupes finis de GL_n(Z)
  apercu: Le sujet montre que le cardinal d'un sous-groupe fini de GL_n(Z) est borné par une constante ne dépendant que de n. Il établit que les ordres possibles des éléments d'ordre fini forment un ensemble
    fini ({1, 2, 3, 4, 6} pour n = 2), puis que la réduction modulo 3 est injective sur un tel sous-groupe, d'où card(G) ≤ 3^(n²). Pour un p-groupe, il détermine les traces possibles par des congruences
    (Tr(M^ℓ) ≡ Tr(M) mod ℓ), montre que card(G) divise la somme des Tr(g)^s par un argument de projecteur et de produits tensoriels, et en déduit card(G) ≤ 4^n.
