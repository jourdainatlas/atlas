  nom: Fonctions presque-périodiques et solutions bornées d'équations différentielles
  apercu: 'Le problème étudie les fonctions presque-périodiques, limites uniformes de combinaisons de fonctions périodiques continues, dont il montre qu''elles forment un espace de Banach stable par produit
    et par composition avec une fonction continue. Il approche les fonctions périodiques par le noyau de Fejér, définit la moyenne M et les coefficients de Fourier-Bohr, et établit la relation de Parseval
    pour ces fonctions. Il conclut sur les solutions bornées des équations différentielles linéaires X'' = A(t)X + B(t) sous une hypothèse de stabilité exponentielle : la solution bornée est périodique
    quand A et B le sont, et presque-périodique quand A est constante à valeurs propres de partie réelle strictement négative et B presque-périodique.'
