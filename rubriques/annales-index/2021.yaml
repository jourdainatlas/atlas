  nom: Marches aléatoires sur un graphe, matrices stochastiques et algorithme PageRank
  apercu: Le sujet étudie les marches aléatoires sur un graphe orienté au moyen de leur matrice de transition, sur l'exemple du tétraèdre (convergence vers la loi uniforme) puis d'un graphe biparti où la
    loi ne converge pas. Il montre ensuite que les valeurs propres d'une matrice stochastique sont de module au plus 1 et que, si tous ses coefficients sont strictement positifs, ses puissances convergent
    vers une matrice à lignes égales donnant l'unique distribution invariante. Il applique ce résultat à l'algorithme PageRank et compare deux calculs de B^k en Python (naïf et exponentiation rapide).
