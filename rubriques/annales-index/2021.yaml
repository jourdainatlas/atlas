  nom: La loi du demi-cercle
  apercu: 'Le sujet démontre le théorème de Wigner : pour une matrice symétrique aléatoire à coefficients indépendants centrés de variance 1, la moyenne des f(Λ) sur les valeurs propres de M/√n tend vers
    l''intégrale de f contre la densité √(4−x²)/(2π). Il établit l''inégalité de Hoffman-Wielandt via les matrices bistochastiques, dénombre les mots bien parenthésés (nombres de Catalan) par une série
    génératrice, prouve la convergence des moments dans le cas borné, puis passe au cas général par troncature.'
