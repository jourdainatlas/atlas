  nom: Intégration et dérivation fractionnaires de Riemann-Liouville et de Caputo
  apercu: Le sujet construit, pour α > 0, une intégrale fractionnaire J^α f = Φ_α ∗ f avec Φ_α(t) = t^(α−1)/Γ(α), qui vérifie J^α ∘ J^β = J^(α+β), puis les dérivées fractionnaires de Riemann-Liouville D^α
    = D^m ∘ J^(m−α) et de Caputo D_*^α = J^(m−α) ∘ D^m, dont il étudie la loi des exposants. Les préliminaires établissent les propriétés de la fonction Γ, une version du théorème de Fubini, le produit
    de convolution et l'injectivité de la transformée de Laplace (via le théorème de Weierstrass). Il résout enfin l'équation d'Abel et l'équation D_*^α u = −u à l'aide de la fonction de Mittag-Leffler
    E_α.
