  nom: Théorème de décomposition de Dunford
  apercu: Après un court exercice sur l'orthogonal des matrices diagonales pour le produit scalaire (A, B) ↦ tr(ᵗAB), le problème étudie la décomposition de Dunford A = D + N (D diagonalisable, N nilpotente,
    DN = ND). Il la calcule sur des exemples, l'utilise pour une exponentielle de matrice, l'obtient sur un exemple de deux façons (base adaptée aux sous-espaces caractéristiques, puis projecteurs construits
    par une relation de Bézout), démontre son unicité par codiagonalisation et montre que A ↦ D n'est pas continue, grâce à la densité des matrices diagonalisables dans M_n(C).
