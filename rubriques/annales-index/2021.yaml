    1. Le deuxième établit que f(x+1)+f(x) = 1/x² avec f nulle à l'infini a pour unique solution φ(x) = Σ(−1)ᵏ/(x+k)², en donne des équivalents en 0 et en +∞ et une expression intégrale. Le troisième étudie
    la méthode de Héron pour √x, avec une erreur en (1+x)/2ᵏ, puis l'applique à une matrice symétrique positive pour approcher sa racine carrée.
