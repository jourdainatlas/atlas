  nom: Normes sup de polynômes, mesure de Mahler et inégalités de produits
  apercu: Le problème cherche la meilleure constante λ telle que ‖Q‖_K ‖R‖_K ≤ λ ‖QR‖_K pour des polynômes complexes, la norme étant le sup sur un compact K. Après l'existence d'une paire extrémale par
