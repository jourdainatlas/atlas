- sujet: documents/annales/2021/mines-ponts/Maths-PSI-2.pdf
  nom: Noyaux de type positif
  apercu: Le sujet définit les noyaux de type positif K, dont toutes les matrices (K(xᵢ, xⱼ)) sont symétriques positives, les relie aux noyaux de la forme ⟨φ(x) | φ(y)⟩ et montre que min(x, y) en est un.
    Il étudie ensuite l'opérateur intégral u_K, endomorphisme symétrique continu à valeurs propres positives ; pour K(x, t) = min(x, t), u_K résout le problème aux limites g'' = −f, g(0) = g'(1) = 0, dont
    il calcule les éléments propres. Il démontre sur cet exemple le théorème de Mercer, K(x, y) = Σ λₖ eₖ(x) eₖ(y), et la formule de la trace, ce qui donne la somme Σ 1/(k + 1/2)².
