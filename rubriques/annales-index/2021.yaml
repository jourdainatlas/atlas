  nom: Théorème de De Moivre-Laplace
  apercu: 'Pour X_n de loi binomiale B(n, p), le sujet étudie d''abord la probabilité modale p_n = P(X_n = ⌈np − q⌉) et montre à l''aide de la formule de Stirling que la suite √(npq) p_n converge. Il établit
    ensuite le théorème de De Moivre-Laplace : pour la variable centrée réduite Y_n, P(a ≤ Y_n ≤ b) tend vers l''intégrale de Φ(t) = e^(−t²/2)/√(2π) sur [a, b], par convergence de fonctions en escalier
    et convergence dominée, puis en déduit la valeur de l''intégrale de Gauss et une généralisation à φ∘Y_n.'
