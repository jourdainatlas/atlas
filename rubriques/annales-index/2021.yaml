  nom: Extremums d'une fonction de deux variables, séries entières Σ xⁿ/n^α et signe de det(In + C C̄)
  apercu: 'Un exercice étudie les points critiques et les extremums de f(x, y) = x³ + y³ − 3xy. Le premier problème étudie les séries entières fα(x) = Σ xⁿ/n^α : domaine, continuité, lien avec une fonction
    génératrice, construction d''un logarithme complexe par une équation différentielle (exp(S(z)) = 1 + z), puis un équivalent de fα(x) quand x tend vers 1 grâce à la fonction Γ. Le second problème montre
    que det(In + C C̄) est un réel positif pour toute matrice complexe C, via des matrices par blocs et un endomorphisme semi-linéaire.'
