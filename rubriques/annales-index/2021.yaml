  nom: Polynômes à valeurs entières et factorielles généralisées
  apercu: Le sujet étudie les polynômes de Q[X] à valeurs entières sur un anneau ou une partie E de Z. Il montre que les polynômes binomiaux H_k = X(X−1)···(X−k+1)/k! forment une base régulière de Ent(Z),
    étend l'existence d'une base régulière aux anneaux principaux (exemple de Z[i]), puis introduit les suites p-ordonnées de Bhargava et la factorielle généralisée k!_E, calculée pour les carrés et les
    puissances de q. Il en déduit des résultats de divisibilité, dont celle de ∏(a_j − a_i) par 1!2!···n!, et le nombre de fonctions polynomiales de E dans Z/nZ.
