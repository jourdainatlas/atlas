- sujet: documents/annales/2021/mines-ponts/Maths-MP-2.pdf
  nom: Fonctions de matrices symétriques, continuité et convexité
  apercu: Le sujet associe à toute fonction f d'un intervalle I la fonction de matrices u(f)(S) = ᵗΩ Diag(f(sᵢ)) Ω, définie sur les matrices symétriques à spectre dans I grâce au théorème spectral, après
    une étude de la conjugaison des matrices diagonales par les matrices de permutation. Il montre que u(f)(S) est un polynôme en S, munit Sₙ(R) de la norme spectrale à l'aide du quotient de Rayleigh, et
    prouve la continuité du spectre ordonné, puis celle de u(f) quand f est continue. Il établit enfin que S ↦ Tr(u(f)(S)) est convexe si et seulement si f est convexe.
