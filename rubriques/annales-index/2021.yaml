  nom: Polynômes à racines toutes réelles
  apercu: 'Le sujet étudie les polynômes réels dont toutes les racines sont réelles : stabilité par dérivation (théorème de Rolle) et par les opérateurs Q(D), log-concavité de leurs coefficients, exemples
    venant des matrices symétriques, des polynômes orthogonaux pour le poids e^(−x) et des sommes de variables de Bernoulli indépendantes. Il démontre le théorème de Hermite-Sylvester (P est à racines toutes
    réelles si et seulement si la forme quadratique Σ s(i+j−2) xᵢxⱼ construite sur les sommes de Newton est positive), puis étudie les suites multiplicatives de Pólya-Schur et les caractérise par la série
    entière Σ γₙ xⁿ/n!.'
