  nom: 'Produit de matrices aléatoires : le théorème de Furstenberg–Kesten'
  apercu: 'Pour des matrices aléatoires inversibles indépendantes de même loi à support fini, le sujet étudie le produit Π_n = M^(n)···M^(1) et établit le théorème de Furstenberg–Kesten : (1/n) log|||Π_n|||
