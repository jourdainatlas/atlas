  nom: Le théorème de Burnside et la co-trigonalisation
  apercu: 'Après des préliminaires sur la trace et les formes linéaires sur Mₙ(K), le sujet démontre le théorème de Burnside : une sous-algèbre irréductible de L(E), avec E complexe de dimension finie au
    moins 2, est L(E) tout entier, et il montre par deux contre-exemples que les hypothèses sont nécessaires. Il l''applique aux sous-groupes de GLₙ(C) (groupe unitaire, groupes irréductibles à valeurs
    propres de module 1, théorème de Kolchin), puis prouve que les matrices magiques forment l''espace engendré par les matrices de permutation. Il établit enfin, par passage au quotient, un lemme de co-trigonalisation
    qui donne le théorème de McCoy et la diagonalisation unitaire des matrices normales.'
