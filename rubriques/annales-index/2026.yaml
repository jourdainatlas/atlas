  nom: Équation d'Euler-Lagrange et quelques applications
  apercu: 'Le sujet établit le lemme fondamental du calcul des variations à l''aide de fonctions plateau de classe $\mathcal{C}^\infty$ construites à partir de $\exp(-1/x)$, puis en déduit l''équation d''Euler-Lagrange
    satisfaite par une fonction qui rend extrémale une intégrale, ainsi que l''identité de Beltrami. Il l''applique à trois problèmes classiques : le plus court chemin entre deux points est un segment,
    la courbe de descente la plus rapide (brachistochrone) est une cycloïde, et la surface de révolution d''aire minimale est une caténoïde.'
