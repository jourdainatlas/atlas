  nom: 'Sommes d''inverses de puissances d''entiers distincts : séries de Sylvester, théorèmes de Paul Lévy et de Ronald Graham'
  apercu: Le sujet part des développements $p$-adiques et de la série de Sylvester, construite sur la suite $s(n+1) = s(n)^2 - s(n) + 1$, puis établit des estimations par analyse complexe (fonction $\pi^2/\sin^2(\pi
    z)$, déterminations du logarithme). Il étudie quels réels sont sommes d'une sous-famille d'une série donnée, notamment de fractions unitaires ou d'inverses de carrés, démontre un théorème de Paul Lévy
    de type limite centrale sur les séries de Sylvester, et termine par le théorème de Graham sur les sommes d'inverses de puissances $p$-ièmes d'entiers distincts.
