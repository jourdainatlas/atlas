  nom: Extremum d'une fonction de $n$ variables, suite récurrente, polynômes propres d'un opérateur différentiel et dés truqués
  apercu: Quatre exercices indépendants. On étudie d'abord l'unique point critique d'une fonction quadratique sur $\mathbb{R}^n$ grâce à la hessienne $2(I_n + J)$ ; puis la suite $v(n+1) = \ln(1 - v(n)/2)$
    par l'inégalité des accroissements finis et la convergence uniforme de la série de fonctions associée. On diagonalise ensuite l'endomorphisme $P \mapsto ((X^2 - 1)P)''$ de $\mathbb{R}_n[X]$, dont les
    polynômes propres forment une base orthogonale pour le poids $1 - t^2$ sur $[-1, 1]$ ; enfin, on montre par les fonctions génératrices qu'on ne peut pas truquer deux dés pour que leur somme suive une
    loi uniforme.
