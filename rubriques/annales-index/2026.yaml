  nom: Autour de $\mathrm{O}_n(\mathbb{R})$ et $\mathrm{SL}_n(\mathbb{R})$
  apercu: 'Le sujet étudie le groupe orthogonal et le groupe spécial linéaire : propriétés topologiques de $\mathrm{O}_n(\mathbb{R})$ (compacité, non-connexité, connexité par arcs de $\mathrm{SO}_n(\mathbb{R})$)
    et maximalité de $\mathrm{O}_n(\mathbb{R})$ parmi les sous-groupes compacts de $\mathrm{GL}_n(\mathbb{R})$, puis calcul différentiel sur ces groupes, avec l''espace tangent à $\mathrm{O}_n(\mathbb{R})$
    formé des matrices antisymétriques et la minimisation de $\operatorname{tr}(M^\top M)$ sur $\mathrm{SL}_n(\mathbb{R})$, atteinte exactement sur $\mathrm{SO}_n(\mathbb{R})$. Les deux dernières parties
    étudient un morphisme continu $\varphi$ de $\mathbb{U}$ dans $\mathrm{GL}_n(\mathbb{R})$ : $x \mapsto \varphi(e^{ix})$ est de la forme $x \mapsto \exp(xM)$, puis, grâce à la décomposition de Dunford,
    $M$ est semblable sur $\mathbb{R}$ à une matrice diagonale par blocs de rotations $R_{kx}$ ($k$ entier non nul) et de $1$.'
  pages: 5
