  nom: Réduction de matrices par blocs, autour de la loi géométrique, équation $f'(x) = f(\lambda x)$
  apercu: Le premier exercice réduit les matrices par blocs de la forme $\begin{pmatrix} A & A \\ A & A \end{pmatrix}$ et $\begin{pmatrix} A & A \\ 0 & A \end{pmatrix}$ et caractérise leur diagonalisabilité
    à l'aide des polynômes annulateurs. Le deuxième détermine, pour des variables géométriques indépendantes, la loi de leur somme par fonction génératrice et celle de leur maximum, dont l'espérance est
    équivalente à $-\ln(n)/\ln(q)$ par comparaison série-intégrale. Le troisième résout l'équation $f'(x) = f(\lambda x)$ pour $\lambda$ dans $[-1, 1]$ et montre, par la formule de Taylor avec reste intégral,
    que pour $\lambda \neq 0$ les solutions sont les multiples d'une série entière explicite.
