  nom: Polynômes de Jacobi
  apercu: 'Le sujet construit, par orthonormalisation de Gram-Schmidt pour le produit scalaire $\int P Q (1-t)^\alpha (1+t)^\beta$ sur $\left]-1, 1\right[$, une famille de polynômes orthogonaux dont il
    montre la relation de récurrence à trois termes et le caractère simple et réel des racines. Il les identifie aux polynômes de Jacobi donnés par une formule de Rodrigues, en s''appuyant sur la formule
    de Vandermonde et des coefficients binomiaux généralisés. Le cas $\alpha = \beta = 0$ conduit aux polynômes de Legendre : équation différentielle, majoration $|L_k| \leqslant 1$, récurrence et série
    génératrice $1/\sqrt{1 - 2tx + t^2}$.'
