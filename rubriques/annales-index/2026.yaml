  nom: Vrai-faux, suite d'intégrales, puissances universelles et lancers de dés
  apercu: 'Quatre exercices indépendants : un vrai-faux d''analyse et d''algèbre ; l''étude de la suite $I_n = \int_0^1 \frac{\mathrm{d}x}{(x+1)(x+2)\cdots(x+n)}$, encadrée à l''aide de $H_n = 1 + 1/2 +
    \cdots + 1/n$ et de la somme des $1/k^2$, jusqu''à l''équivalent $I_n \sim 1/(n! \ln n)$ ; la recherche des puissances universelles dans $\mathbb{Z}/n\mathbb{Z}$, à l''aide du petit théorème de Fermat,
    puis dans $\mathcal{M}_n(\mathbb{R})$ pour les matrices diagonalisables et les rotations ; enfin un problème de lancers de dés où l''on relance ceux qui n''ont pas donné 6, le nombre de 6 obtenus après
    $n$ lancers suivant une loi binomiale établie par la formule des probabilités totales et une suite arithmético-géométrique.'
