  nom: Un endomorphisme antisymétrique de $\mathbb{R}^5$, une transformation intégrale et la variance maximale d'une variable à trois valeurs
  apercu: 'Trois exercices indépendants. Le premier étudie l''endomorphisme $f$ de $\mathbb{R}^5$ de matrice antisymétrique tridiagonale : $f^2$ est symétrique, $0$ est la seule valeur propre réelle de
    $f$, $E = \operatorname{Ker} f \oplus \operatorname{Im} f$, et $M$ est semblable à une matrice diagonale par blocs. Le deuxième étudie la transformation $f \mapsto F$, $F(x) = \int_0^1 \frac{f(t)}{x+t}\,\mathrm{d}t$,
    pour $f(t) = t^n$ puis $f(t) = e^t$, jusqu''à un équivalent en $0$. Le troisième cherche les lois sur $\{1, 2, 3\}$ de variance maximale et minimale en optimisant une fonction de deux variables sur
    un triangle.'
