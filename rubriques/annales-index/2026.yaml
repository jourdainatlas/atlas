  nom: Introduction aux distributions et théorème d'unicité de Cantor
  apercu: 'Le sujet construit des fonctions test de classe $\mathcal{C}^\infty$ à support compact, définit les distributions sur $\mathbb{R}$ comme formes linéaires sur ces fonctions (masse de Dirac, valeur
    principale de $1/x$) et leur dérivation, en montrant qu''une distribution de dérivée nulle est constante. Il étudie ensuite la convergence des suites de distributions et l''utilise pour démontrer le
    théorème d''unicité de Cantor : une série trigonométrique qui converge vers $0$ en tout point a tous ses coefficients nuls.'
