- sujet: https://concoursminesponts.fr/wp-content/uploads/2026/04/Maths-PSI-1.pdf
  nom: Sommes d'endomorphismes de carré nul
  apercu: Le sujet réduit d'abord les endomorphismes $u$ tels que $u^2 = 0$ (trace nulle, rang au plus $n/2$, forme par blocs), puis montre que les sommes de tels endomorphismes sont exactement les endomorphismes
    de trace nulle. Il admet le théorème de Wang-Wu, qui caractérise les sommes de deux endomorphismes de carré nul, pour exhiber un endomorphisme de trace nulle qui n'est pas somme de trois, étudie les
    matrices de Hessenberg régulières et le vecteur cyclique, et aboutit à l'écriture de tout endomorphisme de trace nulle comme somme de quatre endomorphismes de carré nul.
