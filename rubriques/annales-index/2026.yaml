  nom: Inégalités variationnelles, minimax de von Neumann, itérations de Krasnoselskii-Mann et théorème de Baillon-Haddad
  apercu: Le sujet étudie les inégalités variationnelles associées à un opérateur monotone sur un convexe fermé de l'espace euclidien, en s'appuyant sur la projection sur un convexe fermé. Il en déduit
    l'existence de solutions et le théorème du minimax de von Neumann, puis établit la convergence des itérations de Krasnoselskii-Mann vers un point fixe d'une application $1$-lipschitzienne, et démontre
    enfin le théorème de Baillon-Haddad sur les fonctions convexes à gradient lipschitzien, appliqué à la descente de gradient.
