  nom: Sur quelques sous-groupes de $\mathrm{GL}_n(\mathbb{R})$
  apercu: Le sujet caractérise d'abord les sous-groupes finis de $\mathrm{SO}_2(\mathbb{R})$ et de $\mathrm{O}_2(\mathbb{R})$ (groupes cycliques et diédraux), puis montre qu'un sous-groupe de $\mathrm{O}_n(\mathbb{R})$
    est fini si et seulement s'il est d'exposant fini, si et seulement si l'ensemble de ses traces est fini. Il établit ensuite qu'un sous-groupe compact de $\mathrm{GL}_n(\mathbb{R})$ préserve un produit
    scalaire, grâce à l'ellipsoïde de déterminant maximal et à la stricte log-concavité du déterminant sur les matrices symétriques définies positives. Il termine par la croissance polynomiale de degré
    4 du groupe de Heisenberg discret.
