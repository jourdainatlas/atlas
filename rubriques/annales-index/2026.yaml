  nom: Fonctionnelles quadratiques, séries de Fourier et problème aux limites $-(au')' = f$
  apercu: Le problème relie séries de Fourier, optimisation quadratique et résolution d'un problème aux limites. Il établit d'abord la décroissance des coefficients de Fourier d'une fonction régulière et
    l'erreur de la méthode des rectangles, puis minimise $J(x) = (Ax \mid x)/2 - (b \mid x)$, sans puis avec contraintes linéaires, avec un algorithme de gradient projeté. Il résout ensuite $-(au')' = f$
    avec $u(0) = u(\pi) = 0$ par la méthode de tir et par une formulation variationnelle, approche la solution sur les sinus $\sin(kx)$ et montre la convergence uniforme de cette approximation dans un espace
    de Hilbert défini par les coefficients de Fourier.
