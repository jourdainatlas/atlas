  nom: Obtention de piles successifs lors de lancers d'une pièce
  apercu: On étudie le rang $X_n$ du premier lancer où l'on obtient $n$ piles consécutifs avec une pièce de paramètre $p$. Les cas $n = 1$ et $n = 2$ se traitent par récurrence linéaire et série entière,
    le cas $n = 3$ par réduction d'une matrice $3 \times 3$ qui donne un équivalent géométrique de $P(X_3 = k)$, et le cas général par la fonction génératrice $G_{X_n}(z) = p^n z^n (1 - pz)/(q p^n z^{n+1}
    - z + 1)$, dont on tire l'espérance. La dernière partie montre qu'une série d'au moins $n$ piles finit presque sûrement par apparaître et majore la probabilité qu'elle n'apparaisse pas en $k$ lancers.
