  nom: Probabilité qu'un entier choisi au hasard dans $[\![1;n]\!]$ soit sans facteur à la puissance $k$
  apercu: Le sujet calcule $\sum 1/(n^2+x^2)$ à l'aide de la série $\sum \cos(nt)/n^2$ et d'une équation différentielle, en déduit le développement en série entière de $x/(e^x - 1)$ et les valeurs de $\zeta(2k)$
    au moyen des nombres de Bernoulli. Il exprime ensuite par la formule du crible et la fonction de Möbius la probabilité $q_n(k)$ qu'un entier de $[\![1;n]\!]$ soit sans facteur puissance $k$-ième, et
    montre que $q_n(k)$ tend vers $1/\zeta(k)$.
