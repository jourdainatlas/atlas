  nom: Requêtes SQL, fonctions génératrices et formule sommatoire de Poisson
  apercu: 'Deux exercices ouvrent le sujet : des requêtes SQL sur une base de données, puis le calcul par fonctions génératrices de la loi d''une somme de variables de Poisson indépendantes. Le problème
    calcule d''abord l''intégrale à paramètre $g(x) = \int x\,e^{it}/(x^2 + t^2)\,\mathrm{d}t$ sur $\mathbb{R}$ en montrant qu''elle vérifie $y'''' = y$, ce qui fournit la transformée de Fourier de $1/(1+t^2)$.
    Il étudie ensuite la fonction $1$-périodique $F(x) = \sum 1/(1 + (x+n)^2)$, somme sur $n \in \mathbb{Z}$, et ses coefficients de Fourier, puis établit pour cette fonction la formule sommatoire de Poisson
    $F = G$ et en déduit la valeur explicite de $F(x)$.'
  pages: 4
