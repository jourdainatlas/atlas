  nom: Deux exercices de réduction et polynômes de Laguerre
  apercu: Le premier exercice réduit les matrices $aJ + bI$, où $J$ est la matrice dont tous les coefficients valent $1$, et calcule leurs puissances par division euclidienne par le polynôme minimal $(X
    - b)(X - 3a - b)$ ; le deuxième diagonalise la matrice de permutation circulaire, en déduit la réduction des matrices circulantes $A = P(J)$ et montre que le produit $P(\omega_1)\cdots P(\omega_{n-1})$
    est réel. Le problème munit les fonctions sur $\left[0, +\infty\right[$ du produit scalaire $\int f g\, e^{-t}$, construit la base orthonormée des polynômes de Laguerre par la formule de Rodrigues et
    établit l'inégalité de Bessel, avec égalité pour les fonctions $x \mapsto e^{-\alpha x}$, $\alpha > -1/2$.
