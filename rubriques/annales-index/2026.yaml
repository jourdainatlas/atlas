  nom: 'Modèles de ferromagnétisme : Ising unidimensionnel et Curie-Weiss'
  apercu: Le sujet étudie l'énergie libre de deux modèles de spins $\pm 1$. Après des préliminaires sur la convexité de $\lambda \mapsto \ln \mathbb{E}[\exp(\lambda \cdot X)]$ et de ses limites, il traite
    le modèle d'Ising unidimensionnel par une matrice de transfert $2 \times 2$, la fonction de partition s'écrivant à l'aide de $\operatorname{tr}(A^N)$ et l'énergie libre limite à l'aide de la plus grande
    valeur propre. Il établit enfin, pour le modèle de Curie-Weiss, une formule variationnelle via la formule de Stirling et l'équation $x = \operatorname{th}(h + 2\beta x)$, et met en évidence une transition
    de phase en $\beta = 1/2$.
