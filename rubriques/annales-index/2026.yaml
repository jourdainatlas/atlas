  nom: Vrai-faux ; irrationalités, théorèmes de Lucas et de Niven
  apercu: 'Le premier problème est un vrai-faux portant sur le programme du lycée (calculs dans $\mathbb{R}$, évolutions, analyse, arithmétique, géométrie et nombres complexes, dénombrement et probabilités,
    matrices). Le second suit un fil géométrique et arithmétique : preuve du théorème de Pythagore selon Garfield, preuves géométriques de l''irrationalité de $\sqrt{2}$ (Apostol) et de $\sqrt{3}$, théorème
    de Lucas (trois points à coordonnées rationnelles ne forment jamais un triangle équilatéral), irrationalité de $e$ par la méthode des intervalles emboîtés de Sondow, puis théorème de Niven : si $\theta$
    est un angle rationnel dont le cosinus est rationnel, alors $\cos\theta \in \{-1, -1/2, 0, 1/2, 1\}$, appliqué aux triangles à côtés et angles rationnels.'
