  nom: 'Trois exercices : collectionneur et convexité, cotangente et zêta, matrices en flèche'
  apercu: Le premier exercice minimise, sous la contrainte $x_1 + \dots + x_r = 1$, l'espérance $\sum (1 - x_j)^n$ du nombre de résultats non obtenus après $n$ épreuves, à l'aide du calcul différentiel
    (points critiques, hessienne) puis de l'inégalité de Jensen, le minimum étant atteint exactement pour $x_j = 1/r$. Le deuxième étudie $E_1(x) = 1/x + \sum (1/(x-n) + 1/(x+n))$ et les fonctions $E_k$,
    liées par $E_k' = -k E_{k+1}$, et établit pour $0 < |x| < 1$ le développement $E_1(x) = 1/x - 2\sum \zeta(2s) x^{2s-1}$ et son analogue pour $E_k$. Le troisième réduit les matrices symétriques « en
    flèche » et caractérise, dans le cas complexe, celles qui ne sont pas diagonalisables.
