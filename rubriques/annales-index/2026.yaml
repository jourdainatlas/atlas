  nom: Un critère de non-annulation de la fonction zêta (type Nyman-Beurling)
  apercu: Le sujet établit les propriétés de base de $\zeta$ (produit eulérien, non-annulation pour $\operatorname{Re} s > 1$), puis calcule les transformées de Mellin des fonctions $f_k(t) = (1/k)\lfloor
    1/t \rfloor - \lfloor 1/(kt) \rfloor$, à savoir $\int_0^1 f_k(t)\, t^{s-1} \,\mathrm{d}t = (1/s)(1/k - 1/k^s)\, \zeta(s)$, et prolonge $\zeta$ par $\zeta(s) = 1/(s-1) + G(s)$, d'où $\int_0^1 f_k = \ln(k)/k$.
    Il munit ensuite l'espace engendré par $1$ et les $f_k$ d'un produit scalaire de type $L^2$ et, par Gram-Schmidt, exprime la distance $d_n$ de la fonction $1$ à $\operatorname{Vect}(f_2, \dots, f_n)$.
    Il conclut, par l'inégalité de Cauchy-Schwarz, que si $d_n$ tend vers $0$ alors $\zeta$ ne s'annule pas sur le demi-plan $\operatorname{Re} s > 1/2$.
  pages: 6
