  nom: Probabilités conditionnelles, loi normale et échantillonnage, fonction exponentielle et aire, géométrie dans le cube, vrai-faux (suites, algorithme, complexes) ou équation $x^2 - 5y^2 = 1$ et matrices
  apercu: Le premier exercice exploite un arbre pondéré et une probabilité conditionnelle inversée, puis la loi normale (recherche d'un écart type $\sigma$) et un intervalle de fluctuation pour tester un
    taux de covoiturage. Le deuxième étudie $f(x) = (x-1)\mathrm{e}^{-kx} + 1$ et la tangente en son point d'abscisse 1, dont l'ordonnée à l'origine vaut $g(k) = 1 - \mathrm{e}^{-k}$, puis majore et calcule
    l'aire comprise entre la courbe de $h(x) = (x-1)\mathrm{e}^{-2x} + 1$ et la droite $y = x$. Le troisième place dans un cube les points $K$ et $L$ par des représentations paramétriques et un vecteur
    normal, et construit la section du cube par le plan $(HMN)$. Au choix, les non-spécialistes traitent un vrai-faux sur les suites, un algorithme, une équation complexe et une suite $z_{n+1} = 2\mathrm{e}^{\mathrm{i}\frac{\pi}{2}}z_n$,
    et les spécialistes étudient l'équation $x^2 - 5y^2 = 1$ par la parité et les congruences modulo 5, puis en engendrent des solutions à l'aide de la matrice $A = \begin{pmatrix} 9 & 20 \\ 4 & 9 \end{pmatrix}$.
