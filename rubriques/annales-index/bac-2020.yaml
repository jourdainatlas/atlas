- sujet: https://www.apmep.fr/IMG/pdf/S_Metropole_sept_2020_DV_3.pdf
  nom: Fonction exponentielle et volume de révolution, loi normale, loi exponentielle et probabilités avec des complexes, plan et sphère dans l'espace, suite produit ou congruences, PGCD et matrices
  apercu: Le premier exercice étudie $f(x) = \frac{2\mathrm{e}^x}{\mathrm{e}^x + 1}$ (asymptotes, dérivée, tangente), puis calcule par des primitives le volume $V(a) = \pi\int_0^a (f(x))^2\,\mathrm{d}x$
    d'une flûte et teste la conformité d'un lot par un intervalle de fluctuation. Le deuxième combine la loi normale (réglage d'un écart type), la loi exponentielle (lecture graphique, durée moyenne, absence
    de mémoire) et un tirage dans deux urnes où l'on associe au résultat le nombre complexe $z = x + \mathrm{i}y$. Le troisième établit la position relative d'un plan, d'une droite et d'une sphère dans
    l'espace. Au choix, les non-spécialistes étudient la suite produit $v_n = u_1 \times u_2 \times \dots \times u_n$ et sa limite, et les spécialistes étudient les entiers $a_n = 6 \times 5^n - 2$ et $b_n
    = 3 \times 5^n + 1$ (PGCD, divisibilité par 7), corrigent un algorithme et relient ces entiers aux puissances d'une matrice.
  pages: 7
