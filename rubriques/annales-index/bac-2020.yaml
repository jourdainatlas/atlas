- sujet: https://www.apmep.fr/IMG/pdf/S_Caledonie_2_12_2020_DV_2-2.pdf
  nom: Équation complexe du troisième degré et géométrie, loi normale et probabilités conditionnelles, distance d'un point à une courbe, vrai-faux (logarithme, suites, espace) ou vrai-faux (arithmétique,
    matrices)
  apercu: Le premier exercice résout $z^3 = 4z^2 - 8z + 8$ par factorisation, écrit les solutions sous forme exponentielle et en tire la nature du quadrilatère $OABC$, un alignement et un triangle rectangle.
    Le deuxième détermine l'espérance d'une loi normale par centrage-réduction, reconnaît parmi deux courbes celle de la densité de $X$, puis utilise un arbre pondéré et une probabilité conditionnelle inversée.
    Le troisième étudie $g(x) = x^2 + x + \frac{1}{4} + \frac{4}{(1 + \mathrm{e}^x)^2}$, qui est le carré de la distance d'un point fixe $A$ à un point $M$ de la courbe de $f(x) = 3 - \frac{2}{1 + \mathrm{e}^x}$,
    pour trouver le point de la courbe le plus proche de $A$, puis montre que la tangente en $B$ est perpendiculaire à $(AB)$. Au choix, les non-spécialistes traitent un vrai-faux sur une équation avec
    logarithme, deux suites et des droites de l'espace, et les spécialistes un vrai-faux sur une équation diophantienne, des restes, une équation en entiers et des puissances de matrices.
  pages: 5
