- sujet: https://www.apmep.fr/IMG/pdf/S_Polynesie_sept_2020_DV_3.pdf
  nom: QCM de probabilités, droites orthogonales non coplanaires dans un cube, fonction $x\mathrm{e}^{-x^2+1}$ et aire, suite complexe ou matrices et divisibilité
  apercu: 'Le premier exercice est un QCM de probabilités : répétition d''épreuves indépendantes, probabilités totales, probabilité conditionnelle pour une loi normale, loi exponentielle et loi uniforme.
    Le deuxième montre que les droites $(BH)$ et $(FC)$ d''un cube sont orthogonales et non coplanaires, minimise la distance $MM''$ entre leurs points et en déduit leur perpendiculaire commune $(PQ)$.
    Le troisième étudie $f(x) = x\mathrm{e}^{-x^2+1}$ (limite, symétrie de la courbe, variations, équation $f(x) = 0{,}5$), calcule $I_A = \int_0^A f(x)\,\mathrm{d}x$ et sa limite, puis en déduit l''aire
    d''une figure. Au choix, les non-spécialistes étudient la suite complexe $z_{n+1} = (1+\mathrm{i})z_n - \mathrm{i}$ (module, forme exponentielle, récurrence), et les spécialistes calculent les puissances
    d''une matrice par diagonalisation pour obtenir $a_n$ et établir sa divisibilité par 5 lorsque $n$ est multiple de 4.'
  pages: 5
