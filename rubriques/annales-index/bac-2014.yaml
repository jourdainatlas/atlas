  nom: Étude de fonction et aire, loi exponentielle et approximation normale d'une loi binomiale, suites géométriques et algorithme, tétraèdre régulier, matrices et répartition à long terme
  apercu: Le premier exercice détermine le paramètre $a$ de $f(x) = x + 1 + ax\mathrm{e}^{-x^2}$ par une condition de tangence, localise un zéro de $f$ et calcule une intégrale qui approche une aire. Le
    deuxième exercice modélise un temps d'attente par une loi exponentielle, puis le nombre de clients ayant réservé qui se présentent par une loi binomiale approchée par une loi normale. Le troisième exercice
    étudie l'élimination d'un médicament par une suite géométrique, un protocole de réinjection décrit par un algorithme, puis la suite $w_{n+1} = 0{,}8w_n + 1$. Le quatrième exercice démontre qu'un tétraèdre
    est régulier pour les non-spécialistes, et étudie pour les spécialistes la répartition de souris entre deux compartiments par $M^n = PD^nP^{-1}$ ; le fichier reproduit le sujet deux fois (pages 1 à
    5 et 6 à 10).
