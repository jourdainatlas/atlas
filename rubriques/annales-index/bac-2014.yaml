  nom: Loi exponentielle et intervalle de fluctuation, vrai-faux sur suites, logarithme et plans, suite géométrique complexe ou suites de matrices, fonction exponentielle et aire
  apercu: Le premier exercice étudie la durée de vie d'un moteur suivant une loi exponentielle, avec la propriété d'absence de mémoire et l'espérance, puis teste un pourcentage de défauts par intervalle
    de fluctuation. Le deuxième exercice est un vrai-faux sur les suites croissantes, la fonction $g(x) = 2x\ln(2x+1)$ et l'orthogonalité de deux plans. Au choix, les non-spécialistes étudient la suite
    $z_{n+1} = \left(\frac{3}{4} + \mathrm{i}\frac{\sqrt{3}}{4}\right)z_n$, dont le module forme une suite géométrique, et les spécialistes modélisent le choix entre trois marques par la relation matricielle
    $U_{n+1} = AU_n + B$. Le dernier exercice identifie la courbe d'une dérivée, détermine $f(x) = \mathrm{e}^{-x} + ax + b$ et calcule l'aire d'un logo entre la courbe et sa tangente.
