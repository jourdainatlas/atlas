  nom: Loi normale, intervalle de fluctuation et probabilités conditionnelles, QCM de géométrie, suite récurrente, matrices, étude de fonction et aire
  apercu: 'Le premier exercice modélise la masse et la circonférence de ballons par des lois normales, confronte l''affirmation d''une entreprise à un intervalle de fluctuation, puis traite un arbre de
    probabilité et une probabilité conditionnelle. Le deuxième exercice est un QCM de géométrie : nature d''un triangle de l''espace, droite perpendiculaire à un plan, ensemble des points $M$ du plan tels
    que $\overrightarrow{MA} \cdot \overrightarrow{MB} = 0$ et position de deux droites dans un cube. Le troisième exercice étudie, pour les non-spécialistes, la suite $u_{n+1} = -\frac{1}{2}u_n^2 + 3u_n
    - \frac{3}{2}$ par conjecture puis par la suite auxiliaire $v_n = u_n - 3$, et, pour les spécialistes, des flux de vélos entre deux stations décrits par des matrices. Le quatrième exercice modélise
    le bord d''un portail par $f(x) = \left(x + \frac{1}{4}\right)\mathrm{e}^{-4x} + b$, calcule l''aire d''un vantail à l''aide d''une primitive et complète un algorithme sommant des aires de planches.'
  pages: 8
