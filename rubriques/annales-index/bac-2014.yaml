  nom: Intersection de la courbe exponentielle et d'une droite, probabilités conditionnelles et lois exponentielle et binomiale, perpendiculaire commune à deux droites, suites couplées et nombres complexes
  apercu: 'Le premier exercice détermine, selon le réel $a > 0$, le nombre de points communs à la courbe de l''exponentielle et à la droite d''équation $y = ax$, en étudiant $f_a(x) = \mathrm{e}^x - ax$
    dont le minimum vaut $a - a\ln a$. Le deuxième exercice porte sur des puces électroniques : probabilités conditionnelles, durée de vie de loi exponentielle de paramètre $\lambda = -\ln(0{,}98)/1000$,
    puis loi binomiale. Le troisième exercice établit dans l''espace l''existence d''une droite perpendiculaire à deux droites non coplanaires. Le quatrième exercice, le seul proposé dans ce document et
    réservé aux candidats n''ayant pas suivi l''enseignement de spécialité, corrige un algorithme calculant deux suites couplées puis les exprime à l''aide de $z_n = u_n + \mathrm{i}v_n$ et de la forme
    exponentielle de $\sqrt{3} + \mathrm{i}$.'
