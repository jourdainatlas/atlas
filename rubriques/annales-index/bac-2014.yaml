- sujet: https://www.apmep.fr/IMG/pdf/Antilles__S_sept_2014_DV.pdf
  nom: Probabilités conditionnelles, loi exponentielle et loi normale, suite récurrente associée à une fonction, équation exponentielle à paramètre, complexes et lieux de points, matrices
  apercu: Le premier exercice traite un test de conformité de peluches par un arbre pondéré et une probabilité conditionnelle, puis une durée de vie suivant une loi exponentielle et une loi normale dont
    on détermine l'écart-type. Le deuxième exercice étudie $f(x) = x\mathrm{e}^{-x}$ et la suite $u_{n+1} = f(u_n)$, montre qu'elle converge et détermine sa limite, puis complète un algorithme calculant
    une somme de termes. Le troisième exercice ramène l'équation $\mathrm{e}^{x} - x^n = 0$ à $\ln(x) - \frac{x}{n} = 0$ et cherche pour quels $n$ elle admet deux solutions. Le quatrième exercice étudie
    $f(z) = z^2 + 2z + 9$ dans $\mathbb{C}$ avec des équations et des lieux de points pour les non-spécialistes, et, pour les spécialistes, l'évolution des fonds de deux agences par $U_{n+1} = AU_n + B$
    et $A^n = PD^nQ$.
  pages: 6
