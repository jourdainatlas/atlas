  nom: Géométrie dans l'espace, suite récurrente et algorithme ou congruences, vrai-faux de probabilités, fonctions exponentielles et aire entre deux courbes
  apercu: Le premier exercice étudie dans l'espace le triangle BCD, le plan qui le contient, le projeté orthogonal H de A et le volume du tétraèdre ABCD. Au choix, les non-spécialistes étudient la suite
    $u_{n+1} = u_n + 2n + 2$ par algorithme, conjecture puis somme télescopique, et les spécialistes retrouvent une date de naissance par congruences et par l'équation $12x + 31y = 503$. Le troisième exercice
    est un vrai-faux sur les probabilités totales, l'indépendance, la loi exponentielle et l'intervalle de fluctuation. Le quatrième exercice compare les courbes de $\mathrm{e}^x$ et de $2\mathrm{e}^{x/2}
    - 1$, leur tangente commune et l'aire comprise entre elles sur $[0, 1]$.
