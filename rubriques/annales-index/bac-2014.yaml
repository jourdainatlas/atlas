  nom: QCM de géométrie dans l'espace, loi normale, probabilités conditionnelles et fluctuation, étude de fonction et chaînette, suite d'intégrales, nombres premiers et nombres de Mersenne
  apercu: Le premier exercice est un QCM de géométrie dans l'espace sur une représentation paramétrique, l'intersection d'une droite et d'un plan, la position de deux plans et la mesure d'un angle. Le deuxième
    exercice modélise le taux d'hématocrite par une loi normale, calcule des probabilités conditionnelles liées à une maladie, puis utilise un intervalle de fluctuation asymptotique pour juger de l'influence
    d'un gène. Le troisième exercice étudie $f(x) = (x-1)\mathrm{e}^{2x} - 1 - x$ à l'aide de sa dérivée seconde pour localiser le paramètre d'une chaînette, puis calcule une longueur par une intégrale.
    Le quatrième exercice étudie, pour les non-spécialistes, la suite $I_n = \int_0^1 \frac{1}{1+x^n}\,\mathrm{d}x$ par encadrement et un algorithme d'approximation, et, pour les spécialistes, l'infinité
    des nombres premiers, les nombres de Mersenne $M_k = 2^k - 1$ et le test de Lucas-Lehmer.
