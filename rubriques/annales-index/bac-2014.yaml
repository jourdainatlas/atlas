  nom: Probabilités conditionnelles, loi normale et intervalle de fluctuation, étude de fonction et aire, vrai-faux de géométrie dans l'espace, suite récurrente, équation diophantienne
  apercu: Le premier exercice traite une production d'huîtres par un arbre pondéré et une probabilité conditionnelle, une loi normale, puis teste une affirmation par un intervalle de fluctuation asymptotique.
    Le deuxième exercice étudie $f(x) = x + 1 + \frac{x}{\mathrm{e}^{x}}$ à l'aide de la fonction auxiliaire $g(x) = 1 - x + \mathrm{e}^{x}$, encadre l'unique solution de $f(x) = 0$, étudie la position
    de la courbe par rapport à une tangente, puis calcule une aire grâce à une primitive. Le troisième exercice est un vrai-faux sur les points, plans et droites de l'espace. Le quatrième exercice étudie,
    pour les non-spécialistes, la suite $u_{n+1} = \frac{1}{5}u_n + 3 \times 0{,}5^n$ et un algorithme de seuil, et, pour les spécialistes, l'équation $8x + 15y = 146$ issue d'un problème de nuitées.
