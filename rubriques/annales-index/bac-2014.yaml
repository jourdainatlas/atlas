  nom: Suite d'intégrales et fonction exponentielle, test de dépistage et loi normale, équation complexe du quatrième degré, géométrie dans l'espace ou suites de matrices
  apercu: Le premier exercice étudie la fonction $x \mapsto x + \mathrm{e}^{-x}$, puis fait conjecturer à partir des courbes puis démontrer la monotonie et la convergence de la suite d'intégrales $I_n =
    \int_0^1 (x + \mathrm{e}^{-nx})\,\mathrm{d}x$, dont on calcule enfin l'expression et la limite. Le deuxième exercice traite un test de dépistage par un arbre pondéré et une probabilité conditionnelle,
    puis la masse de comprimés modélisée par une loi normale et un contrôle par intervalle de fluctuation asymptotique. Le troisième exercice résout l'équation $z^4 + 4z^2 + 16 = 0$ par changement d'inconnue,
    avec une restitution organisée de connaissances sur le conjugué. Au choix, les non-spécialistes cherchent dans un tétraèdre trirectangle la position d'un point de la droite (DF) qui maximise un angle,
    et les spécialistes étudient deux bassins de pisciculture par la relation matricielle $X_{n+1} = AX_n + B$ et un algorithme.
