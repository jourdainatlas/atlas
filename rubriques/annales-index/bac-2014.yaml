  nom: Lois binomiale et normale et intervalle de fluctuation, vrai-faux sur complexes, logarithme et intégrale, géométrie dans l'espace, suite récurrente ou équation diophantienne
  apercu: Le premier exercice traite le remplissage de cônes glacés par une loi binomiale, une loi normale dont on détermine l'écart-type, puis une question de stabilité d'une proportion à partir d'un échantillon.
    Le deuxième exercice propose cinq affirmations à justifier sur les nombres complexes, le calcul avec $\ln$ et $\exp$, une intégrale et une équation logarithmique. Le troisième exercice construit un
    plan de l'espace à partir de milieux et d'un point défini vectoriellement, puis l'intersection de ce plan avec une droite. Au choix, les non-spécialistes étudient la suite $u_{n+1} = f(u_n)$ avec $f(x)
    = 5 - \frac{4}{x+2}$ et la divergence de ses sommes partielles, et les spécialistes analysent un algorithme de PGCD puis résolvent l'équation $221x - 331y = 1$.
