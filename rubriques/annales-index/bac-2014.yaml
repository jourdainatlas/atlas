  nom: QCM de probabilités, suite géométrique de complexes et ligne brisée, fonctions de retouche d'image et aires, géométrie dans l'espace, codage matriciel modulo 26
  apercu: 'Le premier exercice est un QCM de probabilités qui mobilise la formule de Bayes, une loi binomiale, une loi exponentielle et une loi normale. Le deuxième exercice étudie la suite $z_{n+1} = \frac{1+\mathrm{i}}{2}
    z_n$, la suite géométrique des modules et la longueur de la ligne brisée qui joint les points successifs. Le troisième exercice étudie des fonctions de retouche d''image : variations et maximum de $g(x)
    = \ln[1 + (\mathrm{e}-1)x] - x$, nombre de solutions d''une équation, algorithme de comptage des nuances modifiées et comparaison d''aires sous les courbes de deux fonctions. Le quatrième exercice traite
    de plans, droites et intersections dans l''espace pour les non-spécialistes, et, pour les spécialistes, un codage de mots par une matrice $2 \times 2$ et son décodage modulo 26.'
