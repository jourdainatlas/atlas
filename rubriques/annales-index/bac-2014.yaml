  nom: Loi normale, loi binomiale et intervalle de confiance, étude de fonction et aire entre courbe et droite, section d'un cube, suite arithmético-géométrique
  apercu: Le premier exercice modélise la contenance de pots de crème par une loi normale, détermine l'écart-type permettant d'atteindre une proportion donnée de pots non conformes, utilise une loi binomiale,
    puis estime une proportion par un intervalle de confiance. Le deuxième exercice étudie $f(x) = 5\mathrm{e}^{-x} - 3\mathrm{e}^{-2x} + x - 3$, l'écart entre sa courbe et la droite d'équation $y = x -
    3$, puis l'aire comprise entre elles comme fonction de la borne d'intégration. Le troisième exercice construit la section d'un cube par un plan, puis calcule des coordonnées et étudie si un triangle
    est rectangle. Le quatrième exercice, pour les non-spécialistes, étudie des transferts d'eau entre deux bassins par la suite $a_{n+1} = \frac{3}{4}a_n + 330$ et un algorithme de seuil ; le fichier ne
    contient pas d'exercice de spécialité.
