  apercu: 'Le premier exercice modélise un nombre d''abonnés par $u_{n+1} = 0{,}9u_n + 250$ : majoration par récurrence, monotonie, suite géométrique auxiliaire, limite et seuil programmé en Python. Le
    deuxième détermine dans un cube l''équation du plan $(PQR)$, puis le projeté orthogonal $L$ du centre $\Omega$ sur ce plan et la distance de $\Omega$ au plan. Le troisième dénombre des tirages simultanés
    de deux lettres, étudie le gain algébrique d''un jeu et utilise la loi binomiale. Au choix, l''exercice A lit la convexité sur la courbe d''une dérivée puis étudie $f(x) = \ln\left(x^2 + x + \frac{5}{2}\right)$,
    et l''exercice B résout $y'' = -0{,}4y + 0{,}4$, étudie $p(t) = \frac{1}{1 + 9\mathrm{e}^{-0{,}4t}}$ et vérifie qu''elle est solution de l''équation logistique $y'' = 0{,}4y(1 - y)$.'
