    et la lecture du graphe d'une dérivée. Le deuxième, dans un cube, établit une équation du plan $(BGI)$, le projeté orthogonal de $F$ sur ce plan et l'aire du triangle $BGI$ par un calcul de volume.
    Le troisième modélise les présentations au permis de conduire par un arbre pondéré, détermine la loi et l'espérance du nombre de présentations, puis interprète une fonction Python de seuil. Au choix,
    l'exercice A exploite deux tangentes lues sur un graphique puis étudie $f(x) = \frac{2 + \ln x}{x}$ et sa convexité, et l'exercice B résout l'équation différentielle $y' + 6y = 150$ qui modélise le
    refroidissement d'une baguette et étudie la suite des baisses de température minute par minute.
