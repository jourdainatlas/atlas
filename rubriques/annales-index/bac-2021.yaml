  apercu: 'Le premier exercice est un QCM sur la fonction $f(x) = \frac{\mathrm{e}^{2x}}{x}$ : dérivée, extremum, limite et convexité. Le deuxième calcule la valeur prédictive positive d''un test par un
    arbre pondéré, puis utilise la loi binomiale. Le troisième compare un modèle affine et un modèle par la suite $T_{n+1} = 0{,}94T_n + 1{,}5$ pour la décongélation de gâteaux : majoration par récurrence,
    monotonie, suite géométrique auxiliaire, limite et seuil en Python. Au choix, l''exercice A détermine le point $M_0$ d''une droite le plus proche d''un point $A$ et calcule le volume d''une pyramide,
    et l''exercice B résout $y'' = y + 2x\mathrm{e}^x$ à l''aide de la solution particulière $u(x) = x^2\mathrm{e}^x$, puis étudie les variations et la concavité de $u$.'
