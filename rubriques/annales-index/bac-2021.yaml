  apercu: 'Le premier exercice traduit un test anti-dopage par un arbre pondéré, calcule la probabilité qu''un athlète positif soit dopé, puis utilise la loi binomiale (espérance, au moins un succès, nombre
    minimal de contrôles). Le deuxième étudie la suite $u_{n+1} = 0{,}75u_n(1 - 0{,}15u_n)$ à l''aide de la fonction associée : encadrement par récurrence, convergence, limite et seuil calculé par une fonction
    Python. Le troisième traite de parallélisme et de coplanarité dans un cube, puis de droites et d''un plan donnés par leurs équations et d''un projeté orthogonal. Au choix, l''exercice A est un vrai-faux
    sur la fonction exponentielle et la convexité, et l''exercice B détermine $f(x) = \frac{a + b\ln x}{x}$ par lecture graphique, l''étudie et montre que sa courbe a un unique point d''inflexion.'
