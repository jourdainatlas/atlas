  apercu: Le premier exercice est un QCM sur une dérivée seconde, un nombre de combinaisons, la lecture des variations sur la courbe de $f'$, la probabilité d'une intersection et le signe de $f'$ d'après
    un tableau de variations. Le deuxième exploite un arbre pondéré sur l'usage des transports en commun, puis la loi binomiale. Le troisième modélise le télétravail par la suite arithmético-géométrique
    $a_{n+1} = 0{,}85a_n + 450$, puis étudie la suite $u_{n+1} = \frac{5u_n + 4}{u_n + 2}$ par récurrence et en déduit sa limite par encadrement. Au choix, l'exercice A vérifie dans l'espace un vecteur
    normal au plan $(ABC)$, puis calcule le projeté $H$ de $S$ sur le plan $(ABC)$, le volume du tétraèdre $SABC$ et un angle, et l'exercice B résout $3y' + y = 0$, étudie la position de la courbe de $f(x)
    = 2\mathrm{e}^{-\frac{1}{3}x}$ par rapport à sa tangente et une construction des tangentes.
