  nom: Racine carrée complexe, suites récurrentes linéaires et polynômes de Tchebychev de seconde espèce
  apercu: Le sujet construit une racine carrée $R(z)$ sur $\mathbb{C}$ privé de $\mathbb{R}_-$, à valeurs dans le demi-plan $\operatorname{Re} Z > 0$, et l'utilise pour résoudre les récurrences $u_{n+2}
    = 2a u_{n+1} + b u_n$ ; les polynômes $V_n(z) = U_{n+1}(z, -1)$ sont explicités par une somme de coefficients binomiaux. Il étudie ensuite la série génératrice $\sum V_n(z) Z^n = 1/(1 - 2zZ + Z^2)$
    (avec la lemniscate $|Z(Z - 2z)| = 1$), puis l'opérateur $y \mapsto (1 - t^2)y'' - (2\alpha + 1)t y'$, autoadjoint pour un produit scalaire à poids $(1 - t^2)^{\alpha - 1/2}$, dont les vecteurs propres
    sont orthogonaux ; pour $\alpha = 1$ il identifie $V_n(\cos t) = \sin((n+1)t)/\sin t$ et détermine les racines.
