  nom: Points fixes, intégrale de Gauss et loi normale, géométrie du triangle
  apercu: Le premier problème étudie l'existence et l'unicité de points fixes, la méthode de Héron vue comme méthode de Newton pour $x^2 - \alpha$ et sa convergence quadratique, puis démontre le théorème
    du point fixe pour une fonction contractante d'un segment stable. Le deuxième calcule l'intégrale de Gauss par les intégrales de Wallis et un encadrement de $e^{-t^2}$, puis établit les propriétés de
    la loi normale et la loi du carré d'une gaussienne centrée réduite. Le troisième caractérise les triangles dont certaines droites remarquables sont perpendiculaires et en tire une construction à la
