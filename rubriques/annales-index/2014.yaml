  nom: Groupe symétrique, matrices monomiales et sous-groupes d'Heisenberg
  apercu: Le sujet porte sur le groupe symétrique $\mathfrak{S}_n$ et sur le groupe $G_n$ des matrices monomiales. Il ordonne les partitions d'un ensemble fini, étudie les sous-groupes paraboliques de $\mathfrak{S}_n$
    et leurs sous-groupes maximaux, puis montre que $G_n$ est le stabilisateur de l'algèbre des matrices diagonales et que tout automorphisme de $\mathcal{M}_n(\mathbb{C})$ est intérieur. Il décrit les
    automorphismes des produits d'algèbres de matrices pour établir qu'un sous-groupe fini $H$ de $\mathrm{GL}_n(\mathbb{C})$ avec $[H, H] \subset \mathbb{C}^\times$ est conjugué à un sous-groupe de $G_n$,
    et classe enfin les sous-groupes d'Heisenberg anisotropes de $\mathrm{GL}_p(\mathbb{C})$ pour $p$ premier.
