  nom: Endomorphismes de carré nul, développement asymptotique d'intégrales et heptagone régulier
  apercu: Le premier exercice étudie les endomorphismes $u$ tels que $u^2 = 0$ et montre que le produit de $m$ tels endomorphismes commutant deux à deux est nul dès que $n < 2^m$. Le deuxième établit un
    développement asymptotique $u_n = \alpha/n + \beta/n^2 + o(1/n^2)$ de $u_n = \int_0^1 x^n/\sqrt{1+x} \,\mathrm{d}x$, puis un développement à tout ordre en $1/n$ de $\int_0^1 x^n g(x) \,\mathrm{d}x$
    pour $g$ de classe $\mathcal{C}^\infty$, par intégrations par parties successives. Le troisième étudie l'hyperbole équilatère $x^2 - y^2 + ax + by = 1/2$ et montre, avec $\omega = e^{2i\pi/7}$ et $p
    = \omega + \omega^2 + \omega^4$, que $1, \omega, \omega^2, \omega^4$ sont exactement ses points d'intersection avec le cercle unité ; la réunion de la conique et de sa symétrique par rapport à $Ox$
    recoupe alors le cercle aux sept sommets de l'heptagone régulier.
