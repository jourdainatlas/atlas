  nom: Opérateur de moyenne
  apercu: 'Le sujet étudie l''opérateur $A_\omega$ qui associe à $f$ continue la moyenne pondérée $x \mapsto (\int_0^x f\omega)/(\int_0^x \omega)$, avec un poids $\omega$ continu strictement positif : prolongement
    en $0$, injectivité, puis valeurs propres et sous-espaces propres sur les fonctions bornées via une équation différentielle. Lorsque $f$ et $\omega$ sont périodiques, il montre que $A_\omega f$ a une
    limite en $+\infty$ : par un argument de périodicité commune si les périodes sont commensurables, et, si elles ne le sont pas, par la série de Fourier de $\omega$ et le théorème de Weierstrass trigonométrique.'
