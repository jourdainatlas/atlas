  nom: Propriétés asymptotiques d'intégrales à paramètre
  apercu: Le sujet étudie le comportement asymptotique d'intégrales à paramètre. Il établit la méthode de Laplace pour $F(t) = \int e^{-t\phi(x)} f(x) \,\mathrm{d}x$, sans puis avec point critique, et en
    déduit la formule de Stirling. Il montre ensuite que $\int \psi(x/\varepsilon) f(x) \,\mathrm{d}x$ tend vers la valeur moyenne de $\psi$ multipliée par $\int f$, avec une application à une équation
    différentielle à second membre rapidement oscillant. Il termine par des majorations d'intégrales oscillantes $\int e^{i\lambda\phi(x)} f(x) \,\mathrm{d}x$ en $\lambda^{-N}$, $\lambda^{-1}$ et $\lambda^{-1/2}$
    (lemme de van der Corput).
