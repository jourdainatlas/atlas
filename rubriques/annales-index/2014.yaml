  nom: Minima de Minkowski
  apercu: Pour une matrice symétrique définie positive $M$ de taille 2, le sujet étudie les minima de Minkowski $\lambda_1(M) \leqslant \lambda_2(M)$ du réseau $\mathbb{Z}^2$ pour la norme $\|u\|_M$. Il
    les encadre par les racines des valeurs propres de $M$, prouve l'existence d'une base $M$-réduite du réseau et l'encadrement $(2/\pi)\sqrt{\det M} \leqslant \lambda_1\lambda_2 \leqslant (8/\pi)\sqrt{\det
    M}$ par des arguments d'aires, puis montre que leurs valeurs moyennes après conjugaison par une rotation sont de l'ordre de $(\det M)^{1/4}$. Il termine par la norme euclidienne des vecteurs d'une base
    réduite, uniformément et en moyenne.
