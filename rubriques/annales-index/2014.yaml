  nom: Fonctions de Bessel
  apercu: 'Le problème étudie l''équation de Bessel $x^2y'''' + xy'' + (x^2 - \alpha^2)y = 0$ : il la résout explicitement pour $\alpha = 1/2$ par le changement de fonction $z = \sqrt{x}\,y$, puis construit
    pour $\alpha \geqslant 0$ une solution $f_\alpha$ développable en série entière (à un facteur $x^\alpha$ près) à l''aide de la fonction $\Gamma$. Pour $\alpha = p$ entier, il identifie $f_p$ à l''intégrale
    de Bessel $g_p(x) = (1/\pi)\int_0^\pi \cos(pt - x \sin t)\,\mathrm{d}t$ grâce aux intégrales de Wallis et à la relation $f_{p-1} - f_{p+1} = 2f_p''$, et termine par le développement en série de Fourier
    de $t \mapsto \operatorname{Re}(e^{ix\cos t})$ dont les coefficients sont les $g_{2n}(x)$.'
