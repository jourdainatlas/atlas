  nom: Polynômes, matrices et systèmes différentiels stables
  apercu: 'Un polynôme est dit stable si toutes ses racines complexes ont une partie réelle strictement négative, et une matrice l''est si son polynôme caractéristique l''est. Le sujet traite le degré 2,
    puis introduit la norme subordonnée et la mesure de Lozinskiĭ $\mu(A) = \lim (\|I_n + uA\| - 1)/u$ quand $u \to 0^+$, qui majore la partie réelle des valeurs propres, la calcule pour la norme euclidienne
    (plus grande valeur propre de $({}^t\!A + A)/2$) et ses transportées $\|Hx\|$, et en déduit le critère de Routh-Hurwitz en degré 3 : $X^3 + aX^2 + bX + c$ est stable si et seulement si $a, b, c > 0$
    et $ab - c > 0$. Il l''applique à un système différentiel $X'' = CX$ dont toutes les solutions tendent vers $0$.'
