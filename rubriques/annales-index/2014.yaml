  nom: Intégrale double, raccord de solutions d'une équation différentielle singulière et transformation d'Abel
  apercu: Le sujet calcule d'abord une intégrale double sur le disque unité, puis étudie la dimension de l'espace des solutions sur $\mathbb{R}$ entier d'une équation $x^2y'' + a(x)y' + b(x)y = 0$ en raccordant
    les solutions sur les deux demi-droites, avec des exemples où cette dimension vaut 0 ou dépasse 2. Le problème établit la transformation d'Abel, en déduit le critère des séries alternées et la convergence
    de séries trigonométriques, montre par Parseval que la somme de $\sin(nx)/\sqrt{n}$ n'est pas continue par morceaux, et prouve que la série entière de terme général $z^n/\sqrt{n}$ converge uniformément
    sur certains compacts du disque fermé touchant le cercle unité.
  pages: 8
