  nom: Opérateurs de convolution sur les fonctions continues $2\pi$-périodiques
  apercu: 'Le sujet étudie des endomorphismes de l''espace des fonctions continues $2\pi$-périodiques définis par des intégrales à noyau. Il montre d''abord que $\Phi(f)(x) = \int_{-\pi}^{\pi} |\sin((x-t)/2)|
    f(t) \,\mathrm{d}t$, réalise un isomorphisme de cet espace sur le sous-espace des fonctions de classe $\mathcal{C}^2$, via l''équation $g'''' + g/4 = f$ et les coefficients de Fourier, puis détermine
    les valeurs propres de l''opérateur associé au noyau de Poisson. Il termine par le produit de convolution général : continuité pour la norme quadratique, ensemble des valeurs propres égal à l''ensemble
    des coefficients de Fourier du noyau, critère d''injectivité.'
