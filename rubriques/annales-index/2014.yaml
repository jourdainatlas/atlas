  nom: Sous-groupes à un paramètre, groupe affine et exponentielle dans les groupes classiques
  apercu: Le sujet rassemble des préliminaires sur l'exponentielle de matrices, les applications affines et les matrices de trace nulle, puis montre qu'un sous-groupe de $\mathrm{GL}_n(\mathbb{R})$ contenu
    dans la boule ouverte de centre $I$ et de rayon 1 est trivial. Il prouve que tout sous-groupe à un paramètre continu de $\mathrm{GL}_n(\mathbb{R})$ est de la forme $t \mapsto \exp(tA)$, décrit les orbites
    des vecteurs du plan sous les sous-groupes à un paramètre de $\mathrm{SL}_2(\mathbb{R})$ et classe les morphismes continus de $\mathbb{R}$ dans le groupe affine spécial du plan. Enfin il étudie la connexité
    par arcs de $\mathrm{SL}_n(\mathbb{R})$, $\mathrm{SO}_n(\mathbb{R})$ et $\mathrm{SU}_n(\mathbb{C})$, leurs algèbres de Lie, la surjectivité de l'exponentielle sur $\mathrm{SO}_n(\mathbb{R})$ et $\mathrm{SU}_n(\mathbb{C})$,
    et le morphisme surjectif de $\mathrm{SU}_2(\mathbb{C})$ sur $\mathrm{SO}_3(\mathbb{R})$.
