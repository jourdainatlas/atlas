  nom: Somme de projecteurs
  apercu: 'Le sujet caractérise les endomorphismes d''un espace réel de dimension finie qui sont sommes finies de projecteurs : ce sont exactement ceux dont la trace est un entier naturel supérieur ou égal
    au rang. La preuve passe par l''égalité entre rang et trace d''un projecteur, puis par le fait qu''un endomorphisme qui n''est pas une homothétie admet, dans une base convenable, une diagonale prescrite
    de somme égale à sa trace.'
