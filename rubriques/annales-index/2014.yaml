  nom: Points fixes et opérateurs à noyau
  apercu: 'Dans un espace de Banach, le sujet démontre le théorème de Picard puis un principe d''invariance par homotopie : si une application contractante homotope à $g$ admet un point fixe et qu''aucune
    application de l''homotopie n''a de point fixe sur le bord de $A$, alors $g$ en admet un unique intérieur à $A$. Il l''applique à des opérateurs intégraux à noyau, généralise le résultat aux applications
    continues d''image compacte grâce au théorème de Schauder (admis), et conclut à l''existence d''une solution pour une équation intégrale non linéaire de Fredholm par un argument d''équicontinuité et
    d''extraction diagonale.'
