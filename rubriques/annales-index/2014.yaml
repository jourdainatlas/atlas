  nom: Racine de l'opposé du laplacien et équation de la chaleur généralisée
  apercu: 'Le sujet travaille sur les fonctions $2\pi$-périodiques via leurs coefficients de Fourier : régularité et décroissance des coefficients, caractérisation des opérateurs différentiels comme multiplicateurs
    polynomiaux. Il définit un opérateur $A$ de multiplicateur $\rho(|n|)$ et le semi-groupe $Q_t$ de multiplicateur $e^{-t\rho(|n|)}$, solution de l''équation de la chaleur généralisée $\frac{\partial}{\partial
    t} Q_t f = -A Q_t f$, dont il déduit la résolvante et les valeurs propres de $A$. Pour $\rho(y) = y$, $A$ est une racine carrée de $-\mathrm{d}^2/\mathrm{d}x^2$, $Q_t$ s''exprime par le noyau de Poisson,
    converge vers la donnée initiale, et l''énergie associée décroît.'
