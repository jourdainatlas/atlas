  nom: Transformée d'Abel, sphères aléatoires et problèmes mal posés
  apercu: 'Le problème étudie la transformée d''Abel $Af(x) = \int_x^1 f(t)/\sqrt{t - x}\,\mathrm{d}t$ comme opérateur sur $\mathcal{C}^0([0, 1])$ puis sur $L^p([0, 1])$ : formule d''inversion $A \circ
    A = \pi V$ avec $V$ l''intégration, semi-groupe des intégrales fractionnaires $V^\alpha$ ($A = \sqrt{\pi}\, V^{1/2}$), injectivité, compacité pour $p > 2$ et quasi-nilpotence. Il l''applique à un modèle
    de sphères aléatoires coupées par un plan, où la loi du rayon des sphères se reconstitue à partir de celle des cercles observés via la transformée d''Abel, puis montre que l''équation $Af = g$ est mal
    posée et que la solution de $(tI + A)f = g$ converge vers $A^{-1}g$ dans $L^1$ lorsque $t \to 0^+$.'
