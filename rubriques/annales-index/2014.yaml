  nom: Suites récurrentes couplées, endomorphismes de rang 1 et inégalité d'Hadamard
  apercu: Le sujet comporte deux exercices et un problème. Le premier exercice explicite trois suites récurrentes couplées en diagonalisant une matrice symétrique réelle ; le second relie trace et rang
    d'un projecteur et caractérise les endomorphismes de rang 1 diagonalisables par leur trace non nulle. Le problème étudie, pour $S$ symétrique positive, le maximum de $A \mapsto \operatorname{Tr}(AS)$
    sur le groupe orthogonal compact, égal à $\operatorname{Tr}(S)$, démontre l'inégalité d'Hadamard $\det S \leqslant s_{11} \cdots s_{nn}$ par l'inégalité arithmético-géométrique, puis en déduit que le
    minimum de $\operatorname{Tr}(AS)$ sur les matrices définies positives de déterminant $1$ vaut $n (\det S)^{1/n}$.
