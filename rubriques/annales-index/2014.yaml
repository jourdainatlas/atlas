  nom: Polynômes de Tchebychev et quadrature de Gauss-Tchebychev
  apercu: 'Le sujet construit les polynômes de Tchebychev à partir de $c_n(x) = \cos(n \arccos x)$ et de la relation de récurrence, puis montre qu''ils forment une base orthogonale pour le produit scalaire
    de poids $1/\sqrt{1 - t^2}$ sur $[-1, 1]$, ce qui permet de calculer le minimum de $\|P\|^2$ parmi les polynômes unitaires de degré $n$. Il établit enfin la formule de quadrature exacte sur les polynômes
    de degré au plus $2n - 1$ : l''intégrale de $R(t)/\sqrt{1 - t^2}$ sur $[-1, 1]$ vaut $(\pi/n)$ fois la somme des $R\left(\cos\frac{(2k - 1)\pi}{2n}\right)$.'
