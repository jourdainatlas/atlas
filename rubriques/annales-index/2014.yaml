  nom: Matrices totalement positives et décomposition de Bruhat
  apercu: Le sujet étudie les matrices totalement positives inversibles, dont tous les mineurs sont positifs. Après la formule de Binet-Cauchy et l'identité de Sylvester, il démontre l'inégalité $\det A
    \leqslant \Delta_{[\![1, p]\!]}(A)\, \Delta_{[\![p+1, n]\!]}(A)$, d'où la factorisation LDU. Il classe ensuite les couples de drapeaux par des permutations, étudie les écritures réduites des permutations
    en transpositions adjacentes et les relations de tresses, établit la décomposition de Bruhat de $\mathrm{GL}_n(\mathbb{K})$ et décrit l'adhérence de chaque cellule à l'aide de l'ordre de Bruhat, pour
    paramétrer enfin les matrices unitriangulaires inférieures totalement positives par des produits de matrices élémentaires $y_k(a)$.
