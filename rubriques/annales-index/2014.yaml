  nom: Jacobien, divergence, matrices jacobiennes symétriques, antisymétriques et orthogonales
  apercu: Le sujet interprète le jacobien en $0$ comme limite de rapports de déterminants, donc comme facteur de dilatation des aires et des volumes, puis interprète la divergence d'un champ linéaire du
    plan par l'évolution de l'aire d'un parallélogramme transporté par le flot de $X' = AX$. Il montre ensuite qu'une application de classe $\mathcal{C}^2$ à jacobienne partout antisymétrique est affine,
    qu'une jacobienne partout symétrique caractérise les champs de gradients, et qu'une jacobienne partout orthogonale force $f$ à être une isométrie affine, ce qui équivaut à la commutation de $f$ avec
    le laplacien.
