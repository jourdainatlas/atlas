  nom: Le groupe orthogonal généralisé $\mathrm{O}(1, p)$ et le groupe de Lorentz
  apercu: Le sujet étudie l'ensemble $\mathrm{O}(1, p)$ des matrices $L$ telles que ${}^t\!L \Delta L = \Delta$, avec $\Delta = \operatorname{diag}(1, -1, \dots, -1)$, c'est-à-dire le groupe des endomorphismes
    préservant la forme quadratique de signature $(1, p)$. Il décrit $\mathrm{O}^+(1, 1)$ à l'aide des fonctions hyperboliques (matrices $L(\gamma)$ de coefficients $\operatorname{ch}\gamma$, $\operatorname{sh}\gamma$,
    avec $L(\gamma)L(\gamma') = L(\gamma + \gamma')$), montre qu'il est commutatif et formé de matrices diagonalisables dans une même base orthonormée, et étudie la compacité du sous-groupe des éléments
    de coefficient $\ell_{1,1} > 0$. Il établit enfin, pour les éléments de $\mathrm{O}^+(1, 3)$ de coefficient $\ell_{1,1} > 0$ (sous-groupe du groupe de Lorentz $\mathrm{O}(1, 3)$), une décomposition
    standard $L =$ (rotation) $\times$ (transformation hyperbolique) $\times$ (rotation), avec des procédures Maple de construction.
