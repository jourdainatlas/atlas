  nom: Symétries, quaternions et sommes de carrés
  apercu: 'Le sujet étudie les familles de symétries vectorielles complexes qui anticommutent deux à deux (H-systèmes) et détermine leur longueur maximale $p(n)$ en fonction de la valuation 2-adique de
    $n$. Il construit les quaternions comme sous-algèbre réelle de $\mathcal{M}_2(\mathbb{C})$, en déduit des formules de produit de sommes de 2, 4 et 8 carrés, puis démontre le théorème de Hurwitz : une
    application bilinéaire $B$ de $\mathbb{R}^n \times \mathbb{R}^n$ dans $\mathbb{R}^n$ avec $\|B(X, Y)\| = \|X\|\|Y\|$ n''existe que pour $n = 1, 2, 4, 8$. Il se termine par des algorithmes (crible d''Ératosthène,
    sommes de parties) et par une preuve, par les quaternions entiers et une descente, du théorème des quatre carrés de Lagrange.'
