    reconnaît une rotation vectorielle. Le deuxième part du développement en série de Fourier de $|\sin x|$ pour exprimer $\rho_m = (2/\pi)\int_0^{\pi/2} |\sin(mx)|/\sin(x)\,\mathrm{d}x$, comme une série,
