  nom: Applications du plan affine conservant les droites ; équations différentielles linéaires du second ordre
  apercu: Le premier problème démontre que les bijections du plan qui envoient toute droite sur une droite sont exactement les applications affines bijectives $X \mapsto AX + B$, en passant par le fait
    que le seul endomorphisme d'anneau de $\mathbb{R}$ vérifiant $\varphi(1) = 1$ est l'identité. Le second problème établit la structure de l'espace des solutions d'une équation linéaire du second ordre
    et les propriétés du wronskien, détermine les $b$ pour lesquels toutes les solutions de $y'' + by = 0$ sont bornées, résout $y'' + y = f$ par une formule intégrale, puis montre que les zéros d'une solution
    non nulle de $y'' + b(t)y = 0$ sont isolés et qu'il y en a au plus un lorsque $b$ est strictement négative.
