  nom: Longueur du graphe d'une fonction
  apercu: 'Le sujet étudie la longueur $L(f) = \int \sqrt{1 + f''(t)^2}\,\mathrm{d}t$ du graphe d''une fonction de classe $\mathcal{C}^1$ : calculs explicites, développement en série de la longueur d''un
    arc d''hyperbole, et limite égale à $2$ des longueurs des graphes de $t \mapsto t^n$ sur $[0, 1]$. Il construit ensuite, à partir de $\sin(1/t)/t$, une fonction continue sur $[0, 1]$ dont le graphe
    est de longueur infinie, et montre que la longueur n''est pas continue pour la norme uniforme mais l''est pour la norme $|f(0)| + \|f''\|_\infty$.'
