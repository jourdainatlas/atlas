  nom: 'Opérateurs en dimension infinie : spectres et opérateurs de Hilbert-Schmidt'
  apercu: Le sujet étudie des endomorphismes continus d'espaces normés de dimension infinie. Il calcule la norme d'opérateur de $f \mapsto (x \mapsto x f(x/2))$ pour deux normes, les spectres ponctuels
    des décalages à gauche et à droite dans $\ell^2$ et $\ell^\infty$ ainsi que leurs spectres dans $\ell^\infty$, puis le spectre ponctuel d'un opérateur intégral à noyau, ramené à l'équation $\lambda
    f'' + f = 0$ avec conditions aux bords nulles. Il termine par les opérateurs de Hilbert-Schmidt sur $\ell^2$, dont la norme ne dépend pas de la base hilbertienne, qui forment un espace préhilbertien
    et qui sont stables par composition à gauche par un opérateur quelconque.
