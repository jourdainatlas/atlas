- sujet: https://www.vmaths.fr/wp-content/uploads/XENS/MP/X_ENS_2014_MP_MB_enonce.pdf
  nom: Groupe de Heisenberg, formule de Trotter et chemins de Carnot
  apercu: Le sujet munit l'espace des matrices $3\times 3$ triangulaires supérieures strictes de la loi $M \ast N = M + N + [M, N]/2$ et montre que l'exponentielle en fait un groupe isomorphe au groupe
    $H$ des matrices triangulaires supérieures unipotentes. Il établit la formule $\exp(A)\exp(B) = \exp(A + B + [A, B]/2)$ lorsque $A$ et $B$ commutent avec leur commutateur, puis la formule de Trotter
    $\exp(A + B) = \lim (\exp(A/n)\exp(B/n))^n$. Enfin il étudie les chemins de Carnot dans $H$, solutions d'une équation différentielle matricielle contrôlée, décrit la sphère de Carnot et encadre, à des
    constantes près, par $\sqrt{p^2 + q^2 + |r|}$ le temps $T$ nécessaire pour atteindre $\exp(M_{p,q,r})$ par un tel chemin.
  pages: 4
