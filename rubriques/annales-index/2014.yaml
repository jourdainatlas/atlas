  nom: Fonctions définies sur des espaces de matrices
  apercu: 'Le sujet munit $\mathcal{M}_d(\mathbb{R})$ de la norme associée au produit scalaire $(A, B) \mapsto \operatorname{Tr}({}^t\!A B)$, sous-multiplicative, et montre que pour $\|A\| < R$ la somme
    $\varphi(A) = \sum a_n A^n$ d''une série entière de matrices est un polynôme en $A$ de degré strictement inférieur au degré du polynôme minimal. Il en tire deux applications : la formule $\cos(A)^2
    + \sin(A)^2 = I_d$ par produit de Cauchy d''exponentielles, et une démonstration du théorème de Cayley-Hamilton par une intégrale de type Cauchy de la résolvante. Il montre ensuite que les solutions
    continues de l''équation fonctionnelle $2f(x + y) = f(2x) + f(2y)$ sont affines, et l''utilise pour déterminer les fonctions continues $\xi$ telles que la matrice $(\xi(A_{i,j}))$ soit inversible dès
    que $A$ l''est : une telle $\xi$ est impaire et de la forme $x \mapsto C x^\beta$ sur $\mathbb{R}_+^*$, et le déterminant des matrices à diagonale constante $\lambda$ et coefficients $1$ hors diagonale
    permet de conclure.'
