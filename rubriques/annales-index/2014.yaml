  nom: Comportement asymptotique des solutions d'équations $y'' + q(x)y = 0$
  apercu: Le sujet étudie la fonction $f(x) = \int_0^1 \cos(xt)/\sqrt{1 - t^2}\,\mathrm{d}t$, solution de $xy'' + y' + xy = 0$, et montre par une fonction d'énergie qu'elle est dominée par $1/\sqrt{x}$
    à l'infini. Il résout ensuite $4x^4y'' - y = 0$ par changement de variable et série entière, puis établit des lemmes sur les limites de $g(x)/x$. Il conclut que, si $t \mapsto t\,q(t)$ est intégrable
    d'intégrale de $|t\,q(t)|$ inférieure à $1$ et si $t \mapsto t^2 q(t)$ est intégrable, toute solution de $y'' + q(x)y = 0$ vérifie que $y(x)/x$ admet une limite finie en $+\infty$.
