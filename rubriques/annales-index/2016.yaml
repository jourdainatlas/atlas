- sujet: documents/annales/2016/mines-ponts/Maths-MP-2.pdf
  nom: Théorème taubérien de Hardy–Littlewood–Karamata
  apercu: 'Le sujet calcule d''abord K = ∫ e^(−u)/√u du = √π grâce à une intégrale à paramètre F solution d''une équation différentielle linéaire. Il étudie les séries f(x) = Σ e^(−nx)/√n et g(x) = Σ √n
    e^(−nx) et leurs équivalents en 0, puis associe à une partie A de N la fonction f_A(x) = Σ_{n∈A} e^(−nx) et la quantité Φ(A) = lim x f_A(x), calculée pour les carrés et majorée pour les sommes de deux
    carrés. Il démontre enfin le théorème taubérien : si x Σ α_n e^(−nx) tend vers ℓ en 0 avec α_n ≥ 0, alors (1/N) Σ_{k≤N} α_k tend vers ℓ, via une forme linéaire continue étendue des polynômes aux fonctions
    continues par morceaux, et l''applique à la densité de A et au nombre moyen de représentations comme somme de deux carrés.'
  pages: 5
