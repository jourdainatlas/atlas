  nom: Matrices de Gram, splines quadratiques, récurrence linéaire et jeu de pile ou face
  apercu: 'Le sujet comporte trois exercices indépendants. Le premier caractérise les matrices de Gram de taille 2 et une famille de matrices de taille 3, étudie la stabilité de cette propriété par les
