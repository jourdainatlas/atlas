  nom: Nombre de contact en dimension 8 et polynômes harmoniques zonaux
  apercu: On note τ_n le nombre maximal de boules unité deux à deux disjointes ou tangentes et tangentes à la boule unité de Rn. Le sujet montre τ_2 = 6 et exhibe en dimension 8 une configuration de 240
    points de la sphère, d'où τ_8 ≥ 240. Il étudie ensuite les polynômes homogènes harmoniques de degré k sur la boule, leur invariance par le groupe orthogonal, la droite des éléments invariants par le
    stabilisateur de e_n et le noyau reproduisant f_a, ce qui fournit des polynômes p_k (de type Gegenbauer) tels que les matrices (p_k(v_i·v_j)) soient positives. La méthode de programmation linéaire de
    Delsarte donne alors m ≤ f(1)/a_0 pour un code sphérique d'angle minimal π/3, d'où τ_8 = 240, et la dernière partie établit l'inégalité Σ s_{ij}² ≥ m²/n pour une matrice symétrique positive de rang
    au plus n à diagonale unité.
