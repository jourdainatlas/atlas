    − 1)/2, d'abord dans le cas réel en exploitant l'intersection avec les matrices symétriques, puis en général grâce au « lemme des colonnes » (il existe j tel que V ne contient aucune matrice non nulle
    à seule j-ième colonne non nulle), établi par récurrence à l'aide des matrices de permutation, et à une récurrence par blocs sur la dimension.
