- sujet: https://www.ens.psl.eu/IMG/file/concours/2016/sujets/MPI/16_sujet_mpi_mathd.pdf
  nom: Spectres de graphes, constante de Cheeger et expanseurs
  apercu: 'Le sujet étudie le laplacien T_G d''un graphe fini : positivité, caractérisation min-max des valeurs propres, noyau des constantes pour un graphe connexe, majoration par 2d_G avec cas d''égalité
    (graphe régulier et biparti), monotonie par rapport aux arêtes et spectre du graphe complet. Il traite ensuite le graphe de Cayley de A5 pour les générateurs (12345) et (12)(34), modèle du buckminsterfullerène,
    où des arguments de représentation donnent des multiplicités au moins 3 puis 4. Il relie la constante de Cheeger h_G au diamètre et à λ2 (h_G²/(2d_G) ≤ λ2 ≤ 2h_G), majore λ2 pour les graphes à plongement
    sphérique, et étudie enfin par transformée de Fourier discrète sur (Z/nZ)² le tore discret et l''opérateur de Gabber-Galil, dont les valeurs propres non nulles sont minorées par 7/20.'
