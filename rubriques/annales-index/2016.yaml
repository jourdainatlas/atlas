  nom: Puissances d'une matrice stochastique
  apercu: Le sujet étudie la suite des puissances d'une matrice stochastique. Il traite d'abord le cas 2×2 par diagonalisation, avec une application à la transmission d'un message binaire à travers une
    chaîne de relais bruités, puis montre que le rayon spectral d'une matrice stochastique vaut 1 et, grâce aux disques de Gershgorin et aux matrices à diagonale strictement dominante, que, pour une matrice
    strictement stochastique, le sous-espace propre associé à 1 est une droite et 1 est la seule valeur propre de module 1. Il calcule ensuite la probabilité invariante d'une marche sur quatre points et
    conclut en prouvant, par encadrement des minima et maxima de colonnes, que les puissances d'une matrice strictement stochastique convergent vers une matrice stochastique à lignes identiques.
