  nom: Transformations de Fourier et de Laplace, échantillonnage de Shannon
  apercu: Le sujet étudie la transformée de Fourier des fonctions intégrables continues par morceaux et des fonctions à décroissance rapide (continuité, dérivées, invariance de la gaussienne exp(−πx²))
    et démontre la formule d'inversion par une régularisation gaussienne. Il montre qu'une fonction dont la transformée est à support dans [−1/2, 1/2] est développable en série entière et ne peut être à
    support compact sans être nulle, établit la convergence en O(1/(2n+1)) des sommes de Fourier d'une fonction périodique C∞ via le noyau de Dirichlet, et en déduit la formule d'échantillonnage de Shannon
    f = Σ f(−k) ψ_k avec le sinus cardinal. Il prouve enfin, à l'aide de sommes de lois de Poisson et de l'inégalité de Bienaymé-Tchebychev, l'injectivité de la transformée de Laplace sur les fonctions
    continues à support compact.
