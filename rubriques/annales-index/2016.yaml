  nom: Algorithme d'Euclide, matrices annulées par X³ + X² + X, interpolation et polynômes de Hermite
  apercu: Le sujet comporte deux exercices et un problème indépendants. Le premier exercice programme en Python le calcul du pgcd par recherche exhaustive et par l'algorithme d'Euclide (itératif et récursif)
    et compare leurs nombres de divisions sur deux nombres de Fibonacci consécutifs ; le second montre qu'une matrice réelle vérifiant A³ + A² + A = 0 est diagonalisable sur C et que son déterminant vaut
    1 si elle est inversible. Le problème établit l'existence et l'unicité du polynôme d'interpolation de Hermite avec une formule explicite, puis étudie les polynômes de Hermite définis par H_{n+1} = X
    H_n − H_n', qui forment une base orthogonale pour le poids gaussien et ont n racines réelles distinctes.
