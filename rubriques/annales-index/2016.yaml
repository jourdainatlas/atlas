  nom: Wronskien et problème de Waring
  apercu: 'Le sujet étudie le wronskien d''une famille de fonctions : calcul pour des monômes à l''aide d''un déterminant de type Vandermonde, comportement par multiplication par une fonction, lien entre
    famille liée et annulation du wronskien, puis non-annulation au voisinage de 0 pour une famille libre de fonctions développables en série entière. Il l''applique à l''analogue polynomial du problème
    de Waring : si k(n) est le plus petit k tel que X = f1^n + ... + fk^n ait des solutions dans C[X], on montre k(n) ≤ n à l''aide de l''opérateur de différence Δ, k(2) = 2, et n < k(n)² − k(n) pour n
    ≥ 3.'
