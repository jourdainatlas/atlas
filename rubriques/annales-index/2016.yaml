  nom: Groupe symplectique, lagrangiens et indices de Maslov
  apercu: 'Le sujet présente les espaces vectoriels symplectiques (forme bilinéaire antisymétrique non dégénérée, base symplectique ramenant au modèle de matrice J), puis étudie le groupe symplectique Sp(2n)
    : stabilité par transposée, symétrie λ ↔ 1/λ du spectre, identification de Sp(2n) ∩ O(2n) à U(n), décomposition polaire, connexité par arcs, conjugaison de tout sous-groupe compact dans U(n) via une
    mesure invariante, et structure de sous-variété. Il étudie ensuite les sous-espaces lagrangiens, l''action de Sp(2n) sur les triplets de lagrangiens deux à deux transverses et l''invariant donné par
    la signature d''une forme quadratique associée, avant de définir des indices de Maslov par relèvement de chemins dans le cercle et de démontrer la formule de Leray reliant indice de Maslov et signature.'
