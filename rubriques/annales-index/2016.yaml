- sujet: https://www.vmaths.fr/wp-content/uploads/E3A/PSI/E3A_2016_PSI_Maths1_enonce.pdf
  nom: Séries, endomorphismes, programmation Python, projecteurs spectraux et variables aléatoires
  apercu: Le sujet comporte cinq exercices. Le premier compare les séries Σ a_n et Σ n(a_n − a_{n+1}) (exemples 1/2^(n−1) et 1/(n ln n), puis cas d'une suite décroissante positive). Le deuxième étudie la
    dérivation et l'opérateur f ↦ Σ f(n+x) sur Vect(x^k e^(−x)), qui ne sont pas diagonalisables. Le troisième porte sur des programmes Python (test de primalité, nombres premiers jumeaux, fonction 91 de
    McCarthy). Le quatrième construit, pour une matrice à n valeurs propres distinctes, les projecteurs B_k = V_k tW_k/(tV_k W_k) et calcule Σ B_k, Σ λ_k B_k et Σ λ_k^r B_k. Le cinquième étudie Y = ∫_0^1
    max(X, t) dt pour X géométrique, binomiale ou à quatre valeurs, jusqu'au coefficient de corrélation de X et Y.
