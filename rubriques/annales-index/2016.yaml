  nom: Interpolation de Lagrange et déterminant de Vandermonde ; différences finies pour un problème aux limites
  apercu: Le premier problème construit les polynômes de Lagrange, majore l'erreur d'interpolation par max|f^(n)|/n! · max|Π(x − ak)| grâce au théorème de Rolle, compare sur la fonction sinus l'interpolation
    en 0, π/2, π à l'interpolation affine par morceaux (erreur au plus π²/(8n²)), caractérise par deux méthodes l'inversibilité de la matrice de Vandermonde (bijectivité de l'application d'interpolation,
    puis calcul du déterminant Π(al − ak)) et l'applique à la recherche des paraboles passant par trois points. Le second problème calcule le déterminant de la matrice tridiagonale An (2 sur la diagonale,
    −1 à côté), établit un principe du maximum discret et une majoration de A_n^{-1}B, démontre la formule de Taylor avec reste intégral et l'inégalité de Taylor-Lagrange, puis majore l'erreur du schéma
    aux différences finies pour f'' = g avec conditions aux bords.
