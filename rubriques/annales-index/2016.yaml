  nom: Entropie et principe du maximum d'entropie
  apercu: Le sujet étudie l'entropie H_N(p), somme des −p_i ln p_i, d'une loi de probabilité sur {1, …, N}. Il montre que son maximum est atteint en l'unique loi uniforme, étudie l'entropie de lois sur
    ℕ* (loi géométrique, exemple d'entropie infinie) et prouve par la loi faible des grands nombres que (1/n) ln(p_X1 ⋯ p_Xn) tend en probabilité vers −H_N(p). Il détermine ensuite le maximum de H_N(p)
    + Σ p_i f_i, atteint en la loi de Gibbs proportionnelle à exp(f_i) avec valeur ln(Σ exp(f_i)), puis montre que, sous des contraintes d'espérances fixées, l'entropie atteint son maximum en une unique
    loi p(θ*) de la famille exponentielle, proportionnelle à exp((Mθ*)_i), où θ* est l'unique point de minimum (supposé exister) de la fonction convexe L(θ) = ln Z(θ) − qᵀMθ.
