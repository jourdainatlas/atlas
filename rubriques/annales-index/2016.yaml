  nom: Autour de l'inégalité de Hoffman-Wielandt
  apercu: 'Le sujet étudie d''abord la matrice de permutation circulaire J, sa diagonalisation et la marche aléatoire symétrique sur Z/nZ (n impair) dont il calcule la loi limite. Il démontre ensuite le
    théorème de Birkhoff-von Neumann : l''ensemble des matrices bistochastiques est un convexe compact dont les points extrémaux sont les matrices de permutation, et toute forme linéaire y atteint son minimum
    en une matrice de permutation. Il en déduit l''inégalité de Hoffman-Wielandt, qui majore min sur σ de Σ |λσ(j)(A) − λj(B)|² par ‖A − B‖² pour A, B symétriques réelles, puis calcule la distance de transport
    quadratique d2 entre deux lois uniformes discrètes, égale à la moyenne des carrés des écarts entre valeurs triées, et en déduit n d2(P1, P2) ≤ ‖A − B‖².'
