- sujet: documents/annales/2016/mines-ponts/Maths-PC-1.pdf
  nom: 'Marche aléatoire : retour à 0'
  apercu: 'Le sujet établit d''abord le développement de 1/√(1−x) et une identité de Karamata : si (1−x)^(1/2) Σ a_k x^k tend vers √π en 1−, alors Σ_{k≤n} a_k ∼ 2√n. Un théorème taubérien montre ensuite
    que pour (a_n) décroissante positive, S_n ∼ 2√n entraîne a_n ∼ 1/√n. Ces résultats sont appliqués à la marche aléatoire simple sur Z : par une décomposition selon le dernier passage en 0 et des séries
    génératrices, on obtient Σ P(T > n) x^n = √((1+x)/(1−x)), d''où P(T > n) ∼ √(2/(πn)), la récurrence P(T = +∞) = 0 et la loi du temps de retour P(T = 2n) = C(2n,n)/((2n−1)4^n).'
