  nom: Matrices positives (im)primitives
  apercu: Le sujet étudie les matrices positives primitives (une puissance est strictement positive) et irréductibles à l'aide de la notion de chemin dans une matrice. Il montre que les puissances d'une
    matrice de rayon spectral strictement inférieur à 1 tendent vers 0, prouve via la matrice de Wielandt que l'indice de primitivité est au plus n² − 2n + 2 et que cette borne est atteinte, puis établit
    que (A/r)^m converge vers le projecteur x yᵀ et que le rayon spectral d'une matrice primitive est valeur propre simple. Il caractérise enfin l'irréductibilité et démontre que le coefficient d'imprimitivité
    est le pgcd des écarts k_i entre n et les exposants des monômes non nuls du polynôme caractéristique X^n + c_1 X^(n−k_1) + ⋯ et le pgcd des longueurs des circuits (théorème de Romanovsky).
