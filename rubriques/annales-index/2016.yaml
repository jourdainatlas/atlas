  nom: Fonction Gamma et théorème de Bohr-Mollerup
  apercu: Le sujet définit Γ(x) = ∫_0^{+∞} t^{x−1} e^{−t} dt en scindant l'intégrale en 0 et en +∞, montre que Γ est de classe C² par dérivation sous le signe intégrale, établit Γ(x + 1) = xΓ(x), Γ(n) =
    (n − 1)!, la convexité de Γ et l'existence d'un unique zéro α de Γ' où Γ atteint son minimum. Il étudie ensuite les fonctions ln-convexes (une fonction f > 0 telle que x ↦ e^{cx} f(x) est convexe pour
    tout c > 0 est ln-convexe), prouve que Γ est ln-convexe, puis démontre que toute fonction g ln-convexe vérifiant g(x + 1) = xg(x) et g(1) = 1 est égale à Γ, via la limite de n^x (n − 1)!/(x(x + 1)···(x
    + n − 1)).
