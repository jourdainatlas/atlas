  nom: Sommes aléatoires de variables de Rademacher et intégrales de Borwein
  apercu: Le sujet étudie les variables T_n = Σ a_k X_k où les X_k sont indépendantes et uniformes sur {1, −1}. Il calcule d'abord f(x) = ∫_0^∞ (1 − cos t) e^{−xt}/t² dt, en déduit |s| = (2/π) ∫_0^∞ (1
    − cos(st))/t² dt, et montre que u_n = ∫_0^∞ (1 − cos^n t)/t² dt est équivalent à √(nπ/2). Il en tire E(|S_n|) = (2/π) u_n grâce à E(cos(S_n t)) = cos^n t, démontre une loi forte des grands nombres pour
    S_n/n par un moment d'ordre 4, puis étudie E(|T_n|) et l'applique aux intégrales J_n = ∫_0^∞ (1 − cos t cos(t/3) ··· cos(t/(2n − 1)))/t² dt, égales à π/2 pour n ≤ 7 puis strictement croissantes.
