  nom: Contrôlabilité, classes de Gevrey et contrôle de l'équation de la chaleur
  apercu: 'Le sujet étudie la contrôlabilité à zéro : on montre d''abord qu''une équation différentielle linéaire scalaire d''ordre n peut être ramenée à l''état nul au temps T par un second membre continu
    u, puis que le système y'' = Ay + u(t)b est contrôlable si et seulement si (b, Ab, ..., A^{n-1}b) est une base de Rn (critère de Kalman), via une forme compagnon. Il introduit ensuite les classes de
    Gevrey d''ordre s, en établit la stabilité par produit et par inverse, montre que t ↦ exp(−1/t²) et une fonction de raccord φ sont Gevrey d''ordre 3/2 grâce à la formule de Cauchy pour les séries entières,
    et en déduit le contrôle à zéro de l''équation de la chaleur sur [0, 1] par la série H(t, x) = Σ f^(n)(t) x^{2n}/(2n)!.'
  pages: 6
