- sujet: https://www.vmaths.fr/wp-content/uploads/XENS/MP/X_ENS_2016_MP_MA_enonce.pdf
  nom: Points entiers des simplexes entiers
  apercu: Le sujet étudie les simplexes entiers de R^n et leurs points entiers intérieurs. Il caractérise GLn(Z) (matrices entières de déterminant ±1), construit une matrice entière de première colonne
    donnée et de déterminant le pgcd, et établit une forme triangulaire réduite (forme d'Hermite) par multiplication par GLn(Z). Il en déduit une minoration du nombre de points intérieurs entiers d'un simplexe
    contenant 0 dans son intérieur en fonction de son volume et de son coefficient de symétrie a(S), puis la finitude, à équivalence unimodulaire près, des simplexes entiers ayant exactement k points intérieurs
    ; une dernière partie démontre les deux théorèmes admis (de type Blichfeldt, et borne sur le volume via une approximation diophantienne simultanée).
