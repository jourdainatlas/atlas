  nom: Théorème du renouvellement
  apercu: 'Le sujet considère une suite i.i.d. (X_k) de variables discrètes strictement positives d''espérance m et le nombre N(a, b) de sommes partielles S_n dans [a, b]. Il majore E(N(x, x+ℓ)) par e^ℓ/(1
    − E(e^(−X))) (inégalité de type Chernoff), puis étudie l''équation de renouvellement f(x) = g(x) + Σ p_i f(x − x_i) : existence et unicité d''une solution bornée à support dans R+, régularité. Après
    une étude des parties de R+* stables par addition (contenues dans dZ ou à écarts arbitrairement petits), il montre sous l''hypothèse non arithmétique qu''une solution bornée uniformément continue de
    l''équation homogène atteignant son maximum en 0 est constante, et en déduit que Σ E(g(x − S_k)) tend vers (1/E(X)) ∫ g, donc que E(N(x, x+ℓ)) tend vers ℓ/E(X).'
