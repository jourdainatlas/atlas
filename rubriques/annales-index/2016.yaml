  nom: Matrices à coefficients dans {0, 1}
  apercu: 'Le sujet étudie, à travers quatre parties indépendantes, les matrices dont les coefficients sont dans {0, 1} et celles dont les coefficients sont dans [0, 1]. Il établit des propriétés élémentaires
    (cardinal, compacité et convexité, majoration du déterminant et du spectre), calcule la projection sur l''ensemble des matrices à coefficients dans [0, 1] et montre que le maximum du déterminant est
    le même sur les deux ensembles et tend vers l''infini. Il caractérise ensuite les matrices de permutation comme matrices orthogonales à coefficients 0 ou 1, puis comme matrices inversibles à coefficients
    entiers naturels dont les puissances ont un ensemble fini de coefficients, et détermine les sous-espaces stables par toutes les matrices de permutation puis étudie deux modèles de matrices aléatoires
    : M = U tU construite à partir d''une colonne de variables de Bernoulli, et un remplissage aléatoire par vagues dont on cherche le temps de remplissage total, avec simulation en Python.'
