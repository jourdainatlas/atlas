- sujet: https://agreg.org/data/uploads/sujets/AP/AP16.pdf
  nom: Fractions continues, théorème ergodique de Birkhoff et théorèmes de Khintchine et Lévy
  apercu: 'Le sujet définit le développement en fraction continue d''un irrationnel de [0, 1] par l''application de Gauss T(x) = 1/x − ⌊1/x⌋, établit les propriétés des réduites p_n/q_n et calcule quelques
    intégrales, dont ∫_0^1 ln(x)/(1+x) dx = −π²/12 par une série de Fourier. Il démontre le théorème ergodique de Birkhoff (lemme de Riesz, inégalité maximale), puis montre que la mesure de Gauss de densité
    1/(ln 2 (1+x)) est invariante par T et que T est ergodique, grâce aux intervalles fondamentaux et à une inégalité de sous-mélange. Il en déduit le théorème de Khintchine sur la moyenne géométrique des
    quotients partiels et les théorèmes de Lévy : (1/n) ln q_n tend vers π²/(12 ln 2) et (1/n) ln|x − p_n/q_n| vers −π²/(6 ln 2) presque partout.'
  pages: 10
