  nom: Méthode d'Euler pour le refroidissement d'un café ; tirages dans une urne avec remplacement des boules rouges
  apercu: 'Le premier problème part d''une activité de première (qui d''Aline ou de Bertrand boit le café au lait le plus chaud ?) : on applique la méthode d''Euler à l''équation T'' = −0,04 (T − Ta), on
    analyse une production d''élève sur tableur, on écrit un algorithme, puis on compare à la solution exacte et on obtient un équivalent de l''erreur |T(3) − Tn(3)| à l''aide d''une suite arithmético-géométrique.
    Le second problème étudie une urne à b boules blanches et r rouges où chaque rouge tirée est remplacée par une blanche : loi et espérance du nombre de tirages jusqu''à la première blanche, puis espérance
    et variance du nombre Yn de rouges tirées en n tirages, et convergence en probabilité de Yn vers r par Bienaymé-Tchebychev.'
