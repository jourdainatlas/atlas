  nom: Équation différentielle, famille sommable et fonction Digamma
  apercu: 'Le sujet comporte un exercice sur les solutions développables en série entière de x²y'''' + (x² − x)y'' + 2y = 0 et un exercice sur la famille sommable ((i+j)/2^(i+j)) et le couple (X, Y) de
    loi P(X=i, Y=j) = (i+j)/2^(i+j+3). Le problème étudie la fonction Digamma ψ = Γ''/Γ : formule de Gauss par convergence dominée, formule de Weierstrass 1/Γ(x) = x e^(γx) Π (1+x/k) e^(−x/k), puis ψ(x)
