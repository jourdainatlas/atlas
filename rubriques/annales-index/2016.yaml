  nom: Récurrences indexées par Z, opérateur de shift et méthode de Newton
  apercu: Le sujet étudie l'existence et l'unicité de suites x = (x_t) indexées par Z vérifiant a_0 x_t + ... + a_N x_{t+N} = b_t lorsqu'un coefficient domine strictement la somme des modules des autres.
    Après des rappels sur les séries indexées par Z et sur les espaces ℓ^1 et ℓ^∞ (normes, complétude), il étudie le spectre et les valeurs propres de l'opérateur de shift S sur des suites indexées par
    N puis par Z, inverse Id − f par une série de Neumann et en déduit que P_0(S)x = b a une unique solution bornée (resp. sommable), puis établit le procédé de sommation d'Euler Σ u_n = (1/2) Σ 2^{−n}
    Σ_k C(n, k) u_k. Il démontre ensuite la convergence de la méthode de Newton en dimension p, en déduit la surjectivité d'une application G dont la jacobienne vérifie (J_G(x)h, h) ≥ γ‖h‖², et l'applique
    à une version non linéaire périodique du problème.
