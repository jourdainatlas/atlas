  nom: 'Marche aléatoire : retour à 0'
  apercu: Le sujet part du développement en série entière de 1/√(1 − x), admet l'identité de Karamata pour une série entière f vérifiant √(1 − x) f(x) → √π quand x → 1⁻, et en déduit que les sommes partielles
    a_0 + ... + a_n sont équivalentes à 2√n ; un théorème taubérien montre ensuite que, si (a_n) est décroissante positive, a_n ∼ 1/√n. Pour la marche aléatoire simple sur Z, il établit la relation de renouvellement
    1 = Σ P(S_k = 0) P(T > n − k), obtient la série génératrice Σ P(T > n) x^n = √((1 + x)/(1 − x)), un équivalent de P(T > n), la récurrence P(T = +∞) = 0 et la loi du premier retour P(T = 2n) = C(2n,
    n)/((2n − 1) 4^n).
