  nom: Commutant d'une matrice symétrique, résolution approchée de y'' + y = v, série de fonctions et intégrale, clients d'un commerçant
  apercu: Le sujet comporte quatre exercices. Le premier diagonalise en base orthonormée une matrice symétrique A d'ordre 3 et montre que son commutant est Vect(I3, A, A²), qui contient le projecteur orthogonal
    sur Ker A. Le deuxième résout de façon approchée y'' + y = v, où v est 2π-périodique impaire « en triangle », par projection orthogonale sur Vect(sin t, sin 2t), méthode d'Euler et méthode des rectangles
    en Python. Le troisième étudie F(x) = Σ 1/(1 + 4n²x²) (équivalent en 0+ par comparaison série-intégrale) et la relie à G(x) = ∫ sin t/(e^{2xt} − 1) dt ; le quatrième étudie des ventes de deux produits
    quand le nombre de clients suit une loi de Poisson (indépendance de X et Y, loi du maximum, calcul en Python de la probabilité de rupture de stock).
