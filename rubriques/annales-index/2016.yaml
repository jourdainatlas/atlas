- sujet: https://www.concours-commun-inp.fr/_resource/annales%20%C3%A9crits/PC/2016/PC-Math.pdf
  nom: Polynômes de Bernstein
  apercu: 'Le sujet étudie les polynômes de Bernstein p_{k,n}(X) = C(n,k) X^k (1−X)^(n−k) sous plusieurs angles : une courbe de Bézier quadratique tangente aux segments [A(t), B(t)], la diagonalisation
    de l''endomorphisme φn(P) = nXP + X(1−X)P'' dans la base de Bernstein (φn(p_{k,n}) = k p_{k,n}) et l''étude de l''opérateur Bn restreint à R2[X] via la loi binomiale. Il démontre par les probabilités
    la convergence uniforme de Bn(f) vers f pour f de classe C1 (majoration en Mf/(2√n)), puis étudie des intégrales (sommes de Riemann, intégrale de p_{k,n} égale à 1/(n+1), intégrale généralisée à paramètre)
    et, pour k fixé, la série de fonctions Σ_n p_{k,n}(t), de somme 1/t.'
  pages: 8
