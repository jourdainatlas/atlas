  nom: 'Représentations des groupes finis : théorèmes de Maschke et de Kronecker'
  apercu: Le problème introduit les représentations linéaires complexes d'un groupe fini, homomorphismes de G dans GL(E), et démontre le lemme de Schur puis le théorème de Maschke, par moyennisation d'un
    projecteur sur le groupe. Dans le cas abélien, les représentations irréductibles sont de dimension 1 et s'identifient aux caractères, ce qui mène au prolongement des caractères, à l'égalité entre l'ordre
    de G et celui de son dual, puis à la décomposition de Kronecker G ≅ Z/N₁Z × … × Z/N_kZ. La dernière partie établit les relations d'orthogonalité des caractères pour le produit hermitien sur les fonctions
    centrales.
