  nom: Transformation intégrale à noyau arctan, produit scalaire sur les polynômes, boules dans des cases et matrices équitables
  apercu: 'Quatre exercices indépendants. Le premier étudie l''endomorphisme Φ qui associe à une fonction continue bornée f la fonction x ↦ ∫₀^{+∞} arctan(tx) f(t)/(1+t²) dt, puis la fonction g = Φ(1) :
    limite, dérivée sous forme intégrale et expression explicite. Le deuxième munit les polynômes complexes de degré au plus n du produit scalaire défini par une intégrale sur le cercle unité et en déduit
    que le maximum du module d''un polynôme unitaire sur le cercle est au moins 1, avec égalité seulement pour Xⁿ. Le troisième calcule, par une fonction génératrice, l''espérance du nombre de cases non
    vides après n lancers de boules dans N cases ; le quatrième étudie les matrices « équitables » (a_ij a_jk = a_ik) : celles qui sont non nulles sont de rang 1 et semblables à diag(n, 0, …, 0), et il
    dénombre celles à coefficients dans un sous-groupe fini de K*.'
