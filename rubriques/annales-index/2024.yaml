  nom: Le problème du collectionneur de vignettes et la loi de Gumbel
  apercu: 'Après deux exercices (une équation fonctionnelle intégrale ramenée à des équations différentielles, et le comportement de la médiane d''une loi de Poisson via le théorème central limite), le
    sujet établit des résultats préliminaires : fonction Γ, inégalité de Hölder, développement asymptotique de Hₙ et somme des 1/n². Il étudie ensuite le temps Tₙ nécessaire pour compléter un album de n
    vignettes (espérance, variance, fonction génératrice), démontre le théorème de Bohr-Mollerup et la formule d''Euler pour Γ, introduit la fonction caractéristique et la loi de Gumbel, et prouve que (Tₙ
    − n ln n)/n converge en loi vers la loi de Gumbel.'
