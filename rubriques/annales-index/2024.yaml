  nom: 'Quatre exercices : un endomorphisme de polynômes, parité d''une loi de Poisson, une série oscillante, un produit scalaire pondéré'
  apercu: 'Quatre exercices indépendants. Le premier décompose R₂ₙ[X] en somme orthogonale de Vect(1) et du noyau de la forme linéaire L : P ↦ ∫₋₁¹ P(t) dt, puis étudie l''endomorphisme T_λ(P) = P + λL(P)X
    (valeurs propres, diagonalisabilité, composée T_α ∘ T_β, inverse). Le deuxième calcule, à l''aide de ch et sh, la loi de la parité d''une variable de Poisson et celle du produit XZ, où Z vaut 1 ou 2
    avec probabilité 1/2 ; le troisième compare la série de terme général sin(n^α)/n, avec α ∈ ]0, 1[, à l''intégrale de sin(t^α)/t pour en établir la convergence, puis montre qu''elle n''est pas absolument
    convergente ; le quatrième munit R[X] du produit scalaire Σ 2⁻ⁿ P(n)Q(n) et calcule la distance de X² à R₁[X].'
