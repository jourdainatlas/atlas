  nom: Inégalité de log-Sobolev pour la gaussienne
  apercu: Le sujet introduit le semi-groupe d'Ornstein-Uhlenbeck Pₜ(f)(x) = ∫ f(e⁻ᵗx + √(1−e⁻²ᵗ) y) φ(y) dy, où φ est la densité gaussienne standard, agissant sur les fonctions continues à croissance lente,
    et son générateur L(f) = f″ − x f′. Il établit la formule d'intégration par parties gaussienne et l'équation ∂Pₜ(f)/∂t = L(Pₜ(f)) par dérivation sous l'intégrale. En dérivant l'entropie S(t) = Ent_φ(Pₜ(f))
    et en utilisant l'inégalité de Cauchy-Schwarz, il démontre l'inégalité de log-Sobolev Ent_φ(f) ≤ ½ ∫ f′²/f φ.
