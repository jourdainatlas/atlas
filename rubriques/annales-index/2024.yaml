  nom: Fonctions de matrices définies par des séries entières
  apercu: À une série entière de rayon R et à une matrice A de rayon spectral strictement inférieur à R, le sujet associe une matrice u(A) définie comme Q(A), où Q est le polynôme d'interpolation d'Hermite
    qui coïncide avec la somme de la série et ses dérivées aux valeurs propres de A, avec les multiplicités du polynôme minimal. Il étudie les propriétés de cette construction, la calcule pour les matrices
    diagonalisables à l'aide des polynômes de Lagrange et des projecteurs spectraux, puis pour un bloc de Jordan, une matrice de rang 1, la matrice de Fourier discrète et des séries issues de lois binomiale
    et géométrique.
