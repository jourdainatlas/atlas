  nom: Problème inverse pour les matrices de distance euclidienne
  apercu: Le sujet étudie les matrices de distance euclidienne (MDE), dont les coefficients sont les carrés des distances entre n points. Il établit d'abord que l'ordre d'une matrice de Hadamard est 1,
    2 ou un multiple de 4, puis démontre le théorème de Courant-Fischer et une factorisation des matrices symétriques. Il caractérise les MDE par la positivité de −PDP/2, où P est la projection orthogonale
    sur l'orthogonal du vecteur e = (1, …, 1), montre qu'une MDE non nulle a exactement une valeur propre strictement positive et une trace nulle, puis construit, à l'aide d'une matrice de Hadamard, une
    MDE de spectre prescrit.
  pages: 6
