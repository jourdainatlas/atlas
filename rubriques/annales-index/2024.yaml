  nom: Solutions évanescentes de y − y'' = (3/2)y² et minimisation sous contrainte
  apercu: Le sujet étudie l'opérateur T f(x) = ½ ∫ e^(−|x−t|) f(t) dt, qui fournit l'unique solution tendant vers 0 à l'infini de y − y'' = f, et l'espace de Banach E des fonctions continues tendant vers
    0 à l'infini, dans lequel C² ∩ E est dense. Il détermine toutes les solutions évanescentes non nulles de l'équation non linéaire y − y'' = (3/2)y², translatées de x ↦ 1/ch²(x/2), puis introduit l'espace
    de Sobolev H = H¹(R) et montre, par les multiplicateurs de Lagrange et un argument de compacité (suite minimisante recentrée, convergence faible et convergence uniforme sur les compacts), que l'infimum
    de ‖v‖²_H sous la contrainte ∫ v³ = 1 est atteint et fournit une solution de l'équation.
