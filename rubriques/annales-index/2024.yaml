  nom: 'Racines carrées : de la méthode de Héron à la décomposition de Dunford'
  apercu: 'Le sujet compare deux approximations de √2 : par la série entière binomiale de √(1+x), d''erreur en O(n^{−3/2}), et par la méthode de Héron, de convergence quadratique. Il généralise la méthode
    de Héron aux matrices symétriques positives, après avoir établi l''existence et l''unicité de leur racine carrée symétrique positive. Il démontre la convergence locale de la méthode de Newton et la
    programme en Python, puis l''adapte aux matrices pour obtenir la décomposition de Jordan-Chevalley-Dunford M = A + N et en déduire une racine carrée de certaines matrices réelles trigonalisables à spectre
    strictement positif.'
