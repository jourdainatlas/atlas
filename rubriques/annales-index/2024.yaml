  nom: Racine cubique d'une matrice, la fonction ln Γ, temps d'attente avant une collision
  apercu: Trois exercices indépendants. Le premier détermine les racines cubiques d'une matrice diagonalisable de taille 2, construit une racine cubique de toute matrice diagonalisable réelle et montre
    qu'une racine cubique d'une matrice diagonalisable inversible est diagonalisable sur C. Le deuxième caractérise ln Γ comme unique fonction C¹ à dérivée croissante vérifiant f(x+1) − f(x) = ln x et f(1)
    = 0, obtenue comme somme d'une série de fonctions, et en déduit la formule de duplication à l'aide de la formule de Stirling. Le troisième étudie le premier instant de répétition lors de tirages avec
    remise dans une urne à n boules (paradoxe des anniversaires) et montre que son espérance est équivalente à √(πn/2).
