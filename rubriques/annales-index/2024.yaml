- sujet: https://www.concours-centrale-supelec.fr/sites/default/files/2025-01/M070.pdf
  nom: Intégrale de Gauss, fonction de Bessel et polynômes d'Hermite
  apercu: Le sujet calcule l'intégrale de Gauss par les intégrales de Wallis, puis montre que la fonction x ↦ (1/π)∫₀^π cos(x sin t) dt est l'unique solution développable en série entière valant 1 en 0
    de l'équation xy″ + y′ + xy = 0. Il construit ensuite les polynômes d'Hermite, établit qu'ils sont orthogonaux pour le poids e^(−x²), les obtient comme vecteurs propres d'un endomorphisme autoadjoint
    de ℝ[X], et prouve enfin, à l'aide d'une transformation de Fourier développable en série entière, que cette famille est totale.
