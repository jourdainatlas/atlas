  nom: 'Quatre exercices : matrices aléatoires binomiales, un opérateur intégral à noyau min, une perturbation de rang deux de l''identité, un développement asymptotique'
  apercu: 'Quatre exercices indépendants. Le premier calcule, à l''aide de l''identité Σ C(n,k)² = C(2n,n), la probabilité que la matrice triangulaire de coefficients diagonaux Y et Z, de lois binomiales
    B(n, 1/2) indépendantes, et de coefficient sous-diagonal 2, soit diagonalisable, puis inversible. Le deuxième étudie l''opérateur T(f)(x) = ∫₀¹ min(x, t) f(t) dt sur C⁰([0, 1]) : T(f) résout F″ = −f
    avec F(0) = F′(1) = 0, ce qui donne son image et ses éléments propres. Le troisième détermine les valeurs propres de Iₙ + αXXᵀ + βYYᵀ par la stabilité de Vect(X, Y) et de son orthogonal ; le quatrième
    établit, par des encadrements de l''exponentielle et le calcul de ∫₀¹ −ln(t) tᵖ dt = 1/(p + 1)², que γₙ = ∫₀¹ (1 − t^{1/n})/(1 − t)^{1+1/n} dt vérifie γₙ = π²/(6n) + o(1/n).'
