  nom: Le théorème d'Hermite-Lindemann-Weierstrass sur les rationnels et les fonctions E
  apercu: 'Le sujet démontre que, pour des rationnels distincts a₁, …, a_r, les nombres e^{a₁}, …, e^{a_r} sont linéairement indépendants sur ℚ (preuve de Beukers, Bézivin et Robba), ce qui entraîne l''irrationalité
    de log a et la transcendance de e^a. Il étudie pour cela les séries formelles à coefficients rationnels : développements de fractions rationnelles, séries globalement bornées, séries solutions d''équations
    différentielles et récurrences polynomiales, transformée de Laplace formelle. L''argument final est arithmétique : une suite de rationnels à dénominateurs contrôlés, divisibles par k! et majorés, est
    nulle. Une dernière partie introduit les fonctions E et la fonction de Bessel J₀.'
  pages: 11
