  nom: Distance entre nuages de points à déplacement près (problème de Procuste)
  apercu: Le sujet définit le groupe des déplacements de Rᵈ, couples (τ, R) avec R ∈ SOd(R), et la distance δ(x, y) entre deux familles de n points comme la plus petite distance de y à l'image de x par
    un déplacement. Après avoir montré que δ est symétrique et vérifie l'inégalité triangulaire, il ramène le calcul au maximum de ⟨Z, R⟩ = tr(ZᵀR) sur SOd(R) en centrant les nuages, l'existence d'un optimum
    venant de la compacité. Une décomposition en valeurs singulières de Z donne alors δ(x, y) en fonction des variances des nuages et des valeurs singulières, avec une correction sur la plus petite d'entre
    elles lorsque det Z < 0.
