  nom: L'équation aux différences f(x + 1) − f(x) = h(x) et les polynômes de Bernoulli
  apercu: Le sujet étudie l'équation f(x + 1) − f(x) = h(x). Il résout d'abord le cas polynomial par l'étude de l'opérateur de différence finie Δ (noyau, image, nilpotence), puis introduit les fonctions
    entières et une intégrale sur le cercle unité. Il définit les polynômes de Bernoulli par une représentation intégrale, établit B′ₙ = nBₙ₋₁, Bₙ(z + 1) − Bₙ(z) = nzⁿ⁻¹ et leur caractérisation, les relie
    à la fonction génératrice x/(eˣ − 1), et construit enfin une solution entière de l'équation lorsque h est entière, grâce à une minoration de |e^z − 1| sur des cercles.
