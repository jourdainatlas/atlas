  nom: Étude de marche aléatoire
  apercu: 'Le sujet étudie d''abord les fonctions intégrables sur ]a, b[ pour lesquelles les sommes de Riemann convergent vers l''intégrale, construit un contre-exemple, puis montre que t ↦ 1/√(t(1−t))
    vérifie cette propriété, d''intégrale π, et en déduit un équivalent de Σ 1/√k. Il étudie ensuite une marche aléatoire simple symétrique sur 2n pas : probabilité de retour à l''origine, espérance du
    nombre d''indices d''égalité, équivalente à 2√n/√π, puis compare avec le tirage sans remise de n boules blanches et n noires, où l''espérance du nombre d''indices d''égalité est équivalente à √(πn).'
