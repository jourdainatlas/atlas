  nom: Inégalité de log-Sobolev pour la gaussienne
  apercu: 'Le sujet introduit, pour les fonctions continues à croissance lente, le semi-groupe d''Ornstein-Uhlenbeck P_t(f)(x) = ∫ f(e^{−t}x + √(1−e^{−2t}) y) φ(y) dy, où φ est la densité gaussienne, et
    l''opérateur L(f) = f'''' − x f''. Il établit une formule d''intégration par parties contre φ, montre que t ↦ P_t(f)(x) vérifie ∂_t P_t(f) = L(P_t(f)), puis étudie l''entropie S(t) de P_t(f) par rapport
    à φ. En dérivant S et grâce à l''inégalité de Cauchy-Schwarz, il démontre l''inégalité de log-Sobolev gaussienne : l''entropie de f est majorée par la moitié de ∫ f''²/f φ.'
