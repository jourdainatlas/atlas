  nom: File d'attente, formule de Stirling et blocs de Jordan
  apercu: 'Le premier problème modélise une file d''attente : les temps d''arrivée suivent des lois géométriques et le temps d''arrivée du n-ième client une loi binomiale négative obtenue par fonction génératrice
    ; l''étude des groupes de clients servis conduit à la suite z_{n+1} = exp(λp(z_n − 1)), dont la limite selon la position de λp par rapport à 1 décide si la file finit par se vider. Un exercice établit
    la formule de Stirling grâce à la fonction Γ et à la formule de Gauss Γ(x) = lim nˣ n!/(x(x+1)⋯(x+n)). Le second problème montre qu''un bloc de Jordan n''admet pas de décomposition en somme directe
    de sous-espaces stables non triviaux, puis étudie le caractère borné des solutions de X'' = J_λ X selon le signe de λ.'
