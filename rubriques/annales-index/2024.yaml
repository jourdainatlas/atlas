  nom: Lemme de Cesàro, théorème d'Abel et théorèmes taubériens
  apercu: 'Le sujet démontre le lemme de Cesàro et l''applique (limites de racines n-ièmes, produit de Cauchy de séries convergentes), puis établit des réciproques partielles : cas monotone, théorèmes de
    Hardy faible et fort sous les hypothèses u_{n+1} − u_n = o(1/n) ou O(1/n). Il démontre ensuite le théorème d''Abel pour les séries entières dans un secteur angulaire, puis les théorèmes taubériens faible
    et fort de Tauber et Littlewood, ce dernier par approximation polynomiale de Weierstrass. Il termine par les versions continues : moyenne de Cesàro d''une fonction, comportement en 0 de la transformée
    de Laplace et calcul de l''intégrale de Dirichlet ∫₀^{+∞} sin x/x dx = π/2.'
