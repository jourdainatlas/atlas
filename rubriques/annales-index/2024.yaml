  nom: Théorie de Floquet des équations différentielles linéaires périodiques
  apercu: Le sujet étudie les équations et systèmes différentiels linéaires à coefficients périodiques. Il traite d'abord l'équation de Hill y″ + qy = 0 par le wronskien et les multiplicateurs, démontre
    ensuite une version du théorème d'inversion locale, et s'en sert pour prouver que l'exponentielle de matrices est surjective de Mₙ(ℂ) sur GLₙ(ℂ) par un argument de connexité. Il en déduit la forme normale
    de Floquet M(t) = Q(t)exp(tB) d'une matrice fondamentale, puis étudie la stabilité et l'existence de solutions périodiques.
