  nom: Généralisation d'une intégrale de Dirichlet et application
  apercu: 'Le sujet calcule d''abord, pour x dans ]0, 1[, l''intégrale ∫₀^{+∞} t^{x−1}/(1+t) dt = π/sin(πx) : il montre que θ ↦ e^{ixθ} ∫₀^{+∞} t^{x−1}/(1+te^{iθ}) dt, intégrale à paramètre réel à valeurs
    complexes, est constante, puis fait tendre θ vers π par convergence dominée. Il en tire le développement π/sin(πx) = 1/x − Σ_{n≥1} 2(−1)ⁿx/(n² − x²), puis calcule l''intégrale de Dirichlet généralisée
    ∫₀^{+∞} (1 − cos(t)^{2p+1})/t² dt = π(2p+1)!/(2^{2p+1}(p!)²). Il l''applique enfin à une marche aléatoire symétrique S_n = X₁ + … + X_n : grâce à E(cos(tS_n)) = cos(t)ⁿ, il exprime E(|S_n|) par une
    intégrale et obtient E(|S_{2n}|) = E(|S_{2n−1}|) = (2n−1)!/(2^{2n−2}((n−1)!)²).'
  pages: 6
