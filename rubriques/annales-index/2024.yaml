  nom: Partie entière d'une loi géométrique, série entière Σ cos(n)xⁿ/n, matrice vérifiant Aᵀ = 3A² − A − I, produit de convolution
  apercu: 'Quatre exercices indépendants. Le premier détermine la loi de ⌊(X + 1)/2⌋ pour X de loi géométrique. Le deuxième calcule le rayon de convergence et la somme de la série entière Σ cos(n)xⁿ/n en
    passant par la série Σ e^{in}xⁿ. Le troisième montre qu''une matrice réelle vérifiant Aᵀ = 3A² − A − I est diagonalisable grâce à un polynôme annulateur, exprime ses puissances à l''aide des polynômes
    de Lagrange et prouve que la suite (Aᵏ) converge vers un projecteur. Le quatrième étudie le produit de convolution de fonctions bornées et intégrables : régularité, approximation de l''identité et norme
    subordonnée de l''opérateur h ↦ h ∗ g.'
