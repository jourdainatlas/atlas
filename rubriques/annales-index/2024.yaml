  nom: Sous-algèbres commutatives de dimension maximale et sous-groupes abéliens finis de GLn(Q)
  apercu: Le sujet détermine la dimension maximale ⌊n²/4⌋ + 1 d'une sous-algèbre commutative de Mn(K) et décrit, pour n ≥ 4, celles qui l'atteignent, en passant par la trigonalisation simultanée et l'étude
    des espaces commutatifs de matrices nilpotentes ; il en déduit le cardinal maximal (q − 1)q^⌊n²/4⌋ d'un sous-groupe abélien de GLn(Fq). La dernière partie établit l'irréductibilité des polynômes cyclotomiques
    sur Q, étudie les sous-groupes abéliens finis de On(R), et montre que le cardinal maximal d'un sous-groupe abélien fini de GLn(Q) est 6^(n/2) si n est pair et 2·6^((n−1)/2) si n est impair.
