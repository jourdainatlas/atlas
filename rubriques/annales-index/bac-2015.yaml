  nom: Lois binomiale, normale et exponentielle, vrai-faux sur plans, intervalle de confiance et dichotomie, suite de fonctions et intégrales, nombre j ou équation de Pell-Fermat
  apercu: Le premier exercice traite un concours de tir à l'arc par une loi binomiale, une loi normale et une loi exponentielle, avec la démonstration de l'espérance $\frac{1}{\lambda}$ en restitution organisée
    de connaissances. Le deuxième exercice est un vrai-faux sur deux plans de l'espace, un intervalle de confiance et un algorithme de dichotomie. Le troisième exercice étudie les fonctions $f_n(x) = x
    + \mathrm{e}^{n(x-1)}$ sur $[0, 1]$, la limite de $f_n(x)$ à $x$ fixé et la limite des aires sous les courbes. Au choix, les non-spécialistes étudient le nombre $j = -\frac{1}{2} + \mathrm{i}\frac{\sqrt{3}}{2}$
    et les triangles équilatéraux, et les spécialistes cherchent des nombres triangulaires carrés par l'équation $x^2 - 8y^2 = 1$ et une matrice.
