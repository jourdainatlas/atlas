  nom: Géométrie dans le cube, suite d'intégrales, tangente et intersection exponentielle-droite, probabilités conditionnelles et sondage ou matrices et suites
  apercu: Le premier exercice établit dans un cube que la droite (FD) est orthogonale au plan (IJK), puis calcule un point d'intersection, l'aire de IJK et le volume du tétraèdre FIJK. Le deuxième exercice
    étudie la suite d'intégrales $u_n = \int_0^1 \frac{x^n}{1+x}\,\mathrm{d}x$ à l'aide de la relation $u_{n+1} + u_n = \frac{1}{n+1}$, puis d'un algorithme qui fait conjecturer son comportement, avant
    de démontrer qu'elle décroît, converge et a pour limite 0. Le troisième exercice fait conjecturer puis démontrer le nombre de points communs à la courbe de l'exponentielle et à la droite d'équation
    $y = mx$. Au choix, les non-spécialistes redressent un sondage par probabilités conditionnelles et un intervalle de confiance, et les spécialistes étudient l'arrêt du tabac par la décomposition $M^n
    = A + 0{,}5^n B$.
  pages: 4
