    détermine l'écart-type d'une loi normale, utilise une loi binomiale et calcule l'espérance du gain d'une extension de garantie. Au choix, les non-spécialistes étudient dans un cube un triangle à l'aide
    d'algorithmes de produit scalaire, un plan, un projeté orthogonal et le volume d'un tétraèdre, et les spécialistes étudient la divisibilité des nombres de Mersenne $2^{33} - 1$ et $2^7 - 1$ par le théorème
    de Gauss, les congruences et un algorithme de recherche de diviseurs.
