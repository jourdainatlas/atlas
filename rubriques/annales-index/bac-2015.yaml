  nom: Intersection de la courbe du logarithme et de paraboles, loi exponentielle et circuits, suite complexe $z_{n+1} = \frac{z_n + |z_n|}{4}$, suite récurrente avec suite géométrique auxiliaire ou codage
    affine
  apercu: Le premier exercice conjecture graphiquement puis démontre, selon le réel $a > 0$, le nombre de points communs à la courbe de $\ln$ et à la parabole d'équation $y = ax^2$, par l'étude de $h_a(x)
    = \ln x - ax^2$. Le deuxième exercice établit que l'espérance d'une loi exponentielle vaut $\frac{1}{\lambda}$, l'applique à la durée de vie d'un composant, puis compare des montages en série et en
    parallèle. Le troisième exercice étudie le comportement de $|z_n|$ pour la suite $z_{n+1} = \frac{z_n + |z_n|}{4}$ selon le premier terme. Au choix, les non-spécialistes étudient la suite $u_{n+1} =
    0{,}5u_n + 0{,}5n - 1{,}5$ et un algorithme, et les spécialistes un algorithme d'Euclide et un codage affine modulo 26.
