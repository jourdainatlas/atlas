  nom: Section d'une pyramide et volumes, suite de points et rotation complexe ou matrices et congruences, loi normale et probabilités conditionnelles, fonction logarithme et intégrale
  apercu: Le premier exercice étudie la section d'une pyramide à base carrée par le plan (EAU), le projeté orthogonal du sommet sur ce plan et la comparaison des volumes des deux solides obtenus. Au choix,
    les non-spécialistes construisent des points $A_n$ dont l'affixe vérifie $z_{n+1} = \mathrm{e}^{\mathrm{i}\theta}z_n$ et qui restent sur un cercle de rayon 5, et les spécialistes inversent une matrice
    $3 \times 3$ pour trouver des paraboles à coefficients entiers, avec des conditions de congruence. Le troisième exercice règle l'écart-type d'une loi normale et traite des probabilités conditionnelles
    sur trois fournisseurs. Le quatrième exercice étudie $f(x) = \left(1 - \frac{1}{x}\right)(\ln x - 2) + 2$ à l'aide d'une fonction auxiliaire et calcule une intégrale interprétée comme une aire.
