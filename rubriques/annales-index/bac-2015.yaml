  nom: Suite d'intégrales de fonctions exponentielles, probabilités conditionnelles, loi binomiale et fluctuation, questions sur suites et complexes, distance de deux droites ou chiffrement affine
  apercu: Le premier exercice étudie la fonction $f_1(x) = x^2\mathrm{e}^{-2x}$, puis la suite d'intégrales $I_n = \int_0^1 x^2\mathrm{e}^{-2nx}\,\mathrm{d}x$, dont on établit la décroissance et la limite
    par encadrement. Le deuxième exercice traite des bouteilles de jus de fruits par un arbre pondéré, une loi binomiale et un intervalle de fluctuation asymptotique. Le troisième exercice pose trois questions
    indépendantes sur une suite définie par son logarithme, la majoration d'une suite et le module d'une suite géométrique de nombres complexes. Au choix, les non-spécialistes cherchent dans un cube la
    perpendiculaire commune aux droites (DB) et (AG) et la distance minimale, et les spécialistes résolvent $51x - 26y = 1$ pour décoder un chiffrement affine.
  pages: 5
