  nom: Fluctuation, confiance, loi normale et probabilités conditionnelles, vrai-faux sur complexes et espace, suite récurrente exponentielle, aires et logarithme ou triplets pythagoriciens
  apercu: 'Le premier exercice porte sur des cadenas : intervalle de fluctuation et intervalle de confiance, loi normale pour la gestion d''un stock, puis arbre pondéré et probabilité conditionnelle. Le
    deuxième exercice est un vrai-faux sur un ensemble de points du plan complexe, la puissance $(\sqrt{3} + \mathrm{i})^{1515}$, une représentation paramétrique et un angle dans l''espace. Le troisième
    exercice étudie la suite $u_{n+1} = \mathrm{e}^{2u_n} - \mathrm{e}^{u_n}$ selon le signe de $u_0 = a$, grâce à la fonction $g(x) = \mathrm{e}^{2x} - \mathrm{e}^x - x$. Au choix, les non-spécialistes
    calculent des aires délimitées par des segments, puis par les courbes de $\ln(2x + 1)$ et de $k\frac{1-x}{x}$, pour valider un logo, et les spécialistes cherchent des triplets pythagoriciens contenant
    2015.'
