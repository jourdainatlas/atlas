  nom: Fonction logarithme et aires, vrai-faux de géométrie dans l'espace, test de dépistage et estimation, suite arithmético-géométrique ou diagonalisation d'une matrice
  apercu: Le premier exercice détermine une fonction rationnelle $u$ d'après sa courbe, établit qu'elle est la dérivée de $f(x) = x - 5\ln x - \frac{4}{x}$ et compare deux aires. Le deuxième exercice est
    un vrai-faux sur l'orthogonalité de droites, l'équation d'un plan et le parallélisme dans l'espace. Le troisième exercice étudie un test de dépistage du chikungunya par la fonction $f(p) = \frac{98p}{97p
    + 1}$, puis un intervalle de fluctuation et un intervalle de confiance, et enfin une loi normale dont on cherche la moyenne. Le quatrième exercice modélise les migrations entre villes et campagnes,
    par la suite $u_{n+1} = 0{,}85u_n + 6$ pour les non-spécialistes et par la diagonalisation d'une matrice $2 \times 2$ pour les spécialistes.
  pages: 8
