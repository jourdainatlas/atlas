  nom: Arbre pondéré, espérance et loi binomiale, plan tangent à une sphère, suite récurrente et suite géométrique auxiliaire, fonction logarithme et convexité
  apercu: 'Le premier exercice modélise trois tirs successifs sur une cible par un arbre pondéré, établit la loi et l''espérance du nombre de cibles atteintes, puis compte les joueurs gagnants par une loi
    binomiale et cherche le nombre minimal de joueurs pour qu''il y ait au moins un gagnant avec une probabilité d''au moins $0{,}98$. Le deuxième, dans l''espace, établit l''équation $x + y + z + 2 = 0$
    du plan $(ABC)$, calcule le projeté orthogonal de $\Omega$ sur ce plan, montre qu''un plan est tangent à la sphère de centre $\Omega$ et de rayon $2\sqrt{3}$, et paramètre l''intersection de deux plans.
    Le troisième étudie la suite $u_{n+1} = 5u_n - 8n + 6$ : il fait compléter une fonction Python qui la calcule, démontrer par récurrence que $u_n \geqslant 2n$, en déduire sa limite et établir sa croissance,
    puis conjecturer à partir d''un affichage Python et démontrer que $v_n = u_n - 2n + 1$ est géométrique, d''où la forme explicite de $u_n$. Le quatrième étudie $f(x) = \ln\left(1 + \mathrm{e}^{-x}\right)
    + \frac{1}{4}x$, ses variations et la solution $\alpha$ de $f(x) = 1$, puis utilise sa convexité pour montrer que la portion de courbe sur $[-\alpha, \alpha]$ est inscrite dans le quadrilatère $MNPQ$
    formé avec la tangente en 0, et démontre que ce quadrilatère est un parallélogramme.'
  pages: 5
