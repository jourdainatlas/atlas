  nom: Géométrie dans l'espace et aire d'un triangle, fonction logarithme composée et conjectures graphiques, suite arithmético-géométrique et radioactivité, QCM sur une liste arithmétique et des probabilités
  apercu: 'Le premier exercice, dans deux cubes accolés, calcule le volume du tétraèdre $FIGB$, montre que $\overrightarrow{DJ}$ est normal au plan $(BIG)$ d''équation $2x - y + z - 2 = 0$, vérifie que
    le projeté orthogonal de $F$ sur ce plan est $L''\left(\frac{2}{3} ; \frac{1}{6} ; \frac{5}{6}\right)$, calcule $FL''$ et en déduit l''aire du triangle $IGB$. Le deuxième étudie la fonction auxiliaire
