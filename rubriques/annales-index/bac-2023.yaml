  apercu: 'Le premier exercice est un QCM sur un jeu vidéo à deux mondes : probabilité d''une intersection, probabilité conditionnelle $P_B(G)$ obtenue par les probabilités totales, puis loi binomiale de
    paramètres $10$ et $\frac{12}{25}$. Le deuxième exercice modélise une population d''insectes, d''abord par la suite géométrique $u_n = 0{,}1 \times 1{,}6^n$, puis par la suite $v_{n+1} = 1{,}6v_n -
