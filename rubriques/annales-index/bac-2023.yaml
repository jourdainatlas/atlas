  nom: Suite de probabilités et loi binomiale, distance d'un point à une droite d'intersection de deux plans, lecture de $f$, $f'$, $f''$ et fonction logistique, vrai-faux sur suites, convexité et Python
  apercu: Le premier exercice modélise les réussites d'un athlète par un arbre pondéré menant à $p_{n+1} = 0{,}6p_n + 0{,}3$, dont il obtient la forme explicite par une suite géométrique auxiliaire et la
    limite, puis utilise une loi binomiale de paramètres $10$ et $0{,}75$. Le deuxième exercice montre que la droite $D$ est l'intersection de deux plans, puis minimise $f(t) = AM^2 = 9t^2 - 18t + 17$ pour
    obtenir le point $H$ de $D$ le plus proche de $A$ et vérifie que $(AH)$ est perpendiculaire à $D$. Le troisième exercice associe trois courbes à $f$, $f'$ et $f''$ par lecture graphique, puis étudie
    $g(x) = \frac{4}{1 + \mathrm{e}^{-kx}}$ (limites, $g'(0) = k$, point d'inflexion en 0 à partir d'un calcul formel). Le quatrième exercice est un vrai-faux justifié sur les liens entre suites bornées,
    convergentes et croissantes, la convexité de $\ln(x^2 + 2x + 2)$ sur $[-3, 1]$ et la valeur renvoyée par une fonction Python parcourant une liste.
