  nom: Fonction logarithme et fonction auxiliaire, probabilités conditionnelles et suite arithmético-géométrique, QCM d'analyse, géométrie dans l'espace et distance d'un point à un plan
  apercu: 'Le premier exercice étudie la fonction auxiliaire $g(x) = \ln\left(x^2\right) + x - 2$ et son unique zéro $\alpha$, puis la fonction $f(x) = \frac{x - 2}{x}\ln(x)$ : limites, asymptote, dérivée
    $f''(x) = \frac{g(x)}{x^2}$, variations, et position de sa courbe par rapport à celle de $\ln$. Le deuxième modélise le choix quotidien entre vélo et transports en commun par un arbre pondéré, calcule
    une probabilité conditionnelle inverse, établit $p_{n+1} = 0{,}2p_n + 0{,}6$, démontre par récurrence $p_n = 0{,}75 + 0{,}25 \times 0{,}2^{n-1}$ et en déduit la limite. Le troisième est un QCM sur une
