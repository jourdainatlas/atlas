  apercu: 'Le premier exercice lit sur la courbe de $f''$ les variations et la convexité de $f$, puis étudie $f(x) = \left(x^2 - 5x + 6\right)\mathrm{e}^{x}$ : limites, dérivée, tangente en 0, convexité
    à l''aide de $f''''(x) = (x+1)(x-2)\mathrm{e}^{x}$ et inégalité $f(x) \leqslant x + 6$ sur $[-1, 2]$. Le deuxième modélise les effectifs de deux clubs sportifs par la suite $a_{n+1} = 0{,}75a_n + 300$,
    établit son encadrement par récurrence, l''exprime à l''aide d''une suite géométrique auxiliaire et complète un programme Python de seuil. Le troisième, dans l''espace, calcule l''aire du triangle $EFG$
    à l''aide d''un projeté orthogonal sur une droite, une équation du plan $(EFG)$, le projeté $K$ de $D$ sur ce plan, puis le volume du tétraèdre $DEFG$. Le quatrième est un QCM sur une limite comportant
    un logarithme, une fonction continue dont on connaît trois valeurs, des limites de suites, le gain moyen d''un jeu et une loi binomiale.'
