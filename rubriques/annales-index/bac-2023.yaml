    pour obtenir la limite, puis fait donner la valeur renvoyée par une fonction Python de seuil. Le troisième détermine l''intersection d''une droite et d''un plan, une équation du plan $(ABC)$, l''aire
    du triangle isocèle $ABC$, puis le volume de la pyramide $ABCD$ de hauteur $(BD)$. Le quatrième est un QCM sur des fonctions exponentielle et logarithme : nombre de solutions d''une équation, limite,
    convexité, tangente, équation du second degré en $\ln(x)$.'
