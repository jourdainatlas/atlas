  nom: Fonction logarithme, dichotomie et tangentes, loi binomiale et probabilités conditionnelles sur les jumeaux, sphère et tétraèdre dans l'espace, suite logistique et modèle de Verhulst
  apercu: Le premier exercice étudie $f(x) = 1 + x^2 - 2x^2\ln(x)$, localise l'unique solution $\alpha$ de $f(x) = 0$ sur $\left[1, +\infty\right[$ par le théorème des valeurs intermédiaires et identifie
    la sortie d'une fonction Python de dichotomie, puis montre que $g(x) = \frac{\ln(x)}{1 + x^2}$ atteint son maximum en $\alpha$ et calcule le point d'intersection de deux tangentes. Le deuxième, à partir
    des naissances de jumeaux, utilise une loi binomiale pour le nombre d'accouchements doubles et cherche le plus petit $n$ tel que $P(X \geqslant 1) \geqslant 0{,}99$, puis un arbre pondéré et une probabilité
    conditionnelle inverse pour les jumeaux monozygotes. Le troisième, dans l'espace, place des points sur une sphère de centre $K$ et de rayon 13, établit une équation du plan $(ABC)$, la distance de $D$
    à ce plan et le volume du tétraèdre $ABCD$. Le quatrième montre que la suite $u_{n+1} = 2u_n(1 - u_n)$ est croissante et converge vers $\frac{1}{2}$, puis s'en sert pour un modèle de population inspiré
    de Verhulst.
