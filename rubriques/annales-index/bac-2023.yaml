  nom: Suite arithmético-géométrique et algorithme de seuil, géométrie dans l'espace et volume d'un tétraèdre, nombre de solutions de l'équation $\ln(x) = kx$, QCM de probabilités
  apercu: 'Le premier exercice étudie la suite $u_{n+1} = 0{,}9u_n + 60$ avec $u_0 = 400$ : il démontre par récurrence l''encadrement $0 \leqslant u_n \leqslant u_{n+1} \leqslant 600$, en déduit la convergence
    et la limite, fait donner la valeur renvoyée par une fonction Python de seuil, puis applique ces résultats au nombre d''arbres d''un verger limité à 500 places. Le deuxième, dans un cube, calcule le
    produit scalaire $\overrightarrow{MN} \cdot \overrightarrow{MP}$ et l''aire du triangle $MNP$, établit l''équation $5x - 8y + 4z = 0$ du plan $(MNP)$, le projeté orthogonal $L$ de $F$ sur ce plan et
    le volume du tétraèdre $FMNP$. Le troisième conjecture graphiquement puis détermine, selon la valeur de $k > 0$, le nombre de solutions de l''équation $\ln(x) = kx$ en étudiant $f(x) = \ln(x) - x$ puis
    $g(x) = \ln(x) - kx$. Le quatrième est un QCM sur le tirage d''une bille dans une urne : probabilité d''une réunion, probabilités conditionnelles et loi d''un gain algébrique.'
