    calcule le projeté de $A$ sur $P_1$ et montre que $AH_1HH_2$ est un rectangle. Le quatrième exercice étudie $f(x) = \ln(1 + \mathrm{e}^{-x})$ (limites, asymptote, variations, convexité, position par
    rapport à la tangente en 0) et montre que la corde $(M_aN_a)$ est parallèle à cette tangente.'
