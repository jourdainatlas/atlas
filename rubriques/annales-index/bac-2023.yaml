  nom: Probabilités conditionnelles et loi binomiale, fonction logarithme, convexité et inégalité, suite récurrente et QCM, géométrie dans un cube
  apercu: 'Le premier exercice modélise des appels téléphoniques par un arbre pondéré, établit $P(A) = 0{,}204$, calcule une probabilité conditionnelle inverse, puis étudie le nombre d''acheteurs dans un
    échantillon par une loi binomiale (probabilité, espérance) et cherche la taille d''échantillon garantissant au moins un acheteur avec une probabilité d''au moins $0{,}99$. Le deuxième étudie $f(x) =
    3x + 1 - 2x\ln(x)$ : limites, variations, unique zéro $\alpha$, sens de variation d''une primitive, convexité et tangente en 1, d''où l''inégalité $\ln(x) \geqslant 1 - \frac{1}{x}$. Le troisième traite
    la suite $u_{n+1} = \frac{1}{2}u_n + \frac{1}{2}n + 1$ par un QCM (terme, suite auxiliaire, programme Python), puis démontre $n \leqslant u_n \leqslant n + 3$ par récurrence et en déduit les limites
    de $u_n$ et de $\frac{u_n}{n}$. Le quatrième, dans un cube, montre que $\overrightarrow{AG}$ est normal au plan $(HFC)$, montre que $R\left(\frac{2}{3} ; \frac{2}{3} ; \frac{1}{3}\right)$ est le projeté
    orthogonal de $G$ sur ce plan, démontre qu''il existe un unique point $K$ de $(FG)$ tel que le triangle $KMN$ soit rectangle en $K$, et calcule la fraction du volume du cube occupée par le tétraèdre
    $FNKM$.'
