  nom: Probabilités conditionnelles et loi binomiale, fonction exponentielle et fonction auxiliaire, QCM de géométrie dans l'espace, suite récurrente et méthode de Héron
  apercu: Le premier exercice classe les déchets d'une entreprise à l'aide d'un arbre pondéré, calcule $P(R) = 0{,}6514$ par les probabilités totales et une probabilité conditionnelle inverse, puis étudie
    le nombre de déchets recyclables dans un échantillon par une loi binomiale et cherche la taille d'échantillon à partir de laquelle la probabilité qu'au moins un déchet soit recyclable atteint $0{,}9999$.
    Le deuxième exercice étudie la fonction $f(x) = \mathrm{e}^{3x} - (2x+1)\mathrm{e}^{x}$ grâce à la fonction auxiliaire $g(x) = 3\mathrm{e}^{2x} - 2x - 3$, dont il établit le minimum $\ln(3) - 2$ et
    les deux zéros, puis en déduit les variations de $f$ et explique pourquoi $f$ n'est pas convexe sur $\mathbb{R}$. Le troisième est un QCM de géométrie dans l'espace (nature du triangle $ABC$, équation
    du plan $(BCD)$, projeté orthogonal, position relative de droites et de plans). Le quatrième étudie la suite $u_{n+1} = \frac{1}{2}\left(u_n + \frac{11}{u_n}\right)$, montre par récurrence qu'elle décroît
    et reste minorée par $\sqrt{11}$, détermine sa limite, puis la retrouve comme la suite des longueurs de rectangles d'aire 11 dont il interprète géométriquement la convergence, et fait lire et interpréter
    les valeurs renvoyées par un script Python donné (méthode de Héron).
  pages: 5
