    et solution de $f(x) = 2$, afin de valider ou de rejeter trois conjectures d''un élève. Le troisième modélise la désintégration du polonium par la suite $v_{n+1} = 0{,}995v_n + 1{,}5 \times 10^{19}$,
    établit sa convergence et son expression explicite, cherche un seuil par le calcul et complète une fonction Python. Le quatrième est un QCM sur une liste de termes d''une suite arithmétique de premier
    terme 7 et de raison 3 : nombre de termes, probabilités, probabilités conditionnelles et tirages successifs avec remise.'
