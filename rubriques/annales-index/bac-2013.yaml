  nom: Loi exponentielle, probabilités conditionnelles, fluctuation et loi normale, géométrie dans l'espace, aires et exponentielle, suite récurrente ou modèle matriciel
  apercu: L'exercice 1 étudie des vannes électroniques dont la durée de vie suit une loi exponentielle, le fonctionnement d'un circuit de trois vannes avec une probabilité conditionnelle, un intervalle
    de fluctuation, puis une demande mensuelle modélisée par une loi normale. L'exercice 2 est un vrai-faux de géométrie dans l'espace sur des plans et des droites. L'exercice 3 partage en deux parties
    d'égale aire le domaine sous la courbe de $g(x) = 1 + \mathrm{e}^{-x}$ sur $[0, 1]$, d'abord par une droite verticale, ce qui conduit à une équation dont le théorème des valeurs intermédiaires assure
    l'unique solution, approchée au centième, puis par une droite horizontale. L'exercice 4 étudie soit la suite $u_{n+1} = \frac{nu_n + 1}{2(n+1)}$ par la suite géométrique $v_n = nu_n - 1$, soit, en spécialité,
    l'évolution de deux populations d'oiseaux par une matrice $2 \times 2$ et ses puissances.
