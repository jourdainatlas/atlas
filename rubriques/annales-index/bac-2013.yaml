  nom: Géométrie dans l'espace, suite récurrente avec logarithme ou chiffrement affine, loi normale et loi exponentielle, fonction logarithme et aire
  apercu: L'exercice 1 détermine dans l'espace une équation du plan (ABC) à l'aide d'une droite orthogonale, un projeté et la position d'une droite d'intersection de deux plans. L'exercice 2 étudie soit
    la suite $u_{n+1} = \sqrt{2u_n}$, bornée et croissante, dont on obtient la limite grâce à la suite géométrique $v_n = \ln u_n - \ln 2$, soit, en spécialité, un algorithme de division euclidienne et
    un chiffrement affine modulo 26. L'exercice 3 utilise la loi normale, un intervalle de fluctuation asymptotique et la loi exponentielle dans le contexte d'une boulangerie. L'exercice 4 étudie $f(x)
    = \frac{1+\ln x}{x^2}$ et calcule des aires $I_n$ à l'aide d'une primitive donnée.
  pages: 6
