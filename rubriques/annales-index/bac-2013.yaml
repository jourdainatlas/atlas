    de fluctuation asymptotique et une loi normale. Le quatrième exercice étudie la suite $u_{n+1} = \frac{3u_n}{1+2u_n}$ à l'aide d'une suite géométrique auxiliaire pour les non-spécialistes, et, pour
    les spécialistes, une évolution d'abonnés décrite par $U_{n+1} = MU_n + P$.
