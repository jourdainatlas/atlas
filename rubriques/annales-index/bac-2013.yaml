  nom: Étude de fonction avec fonction auxiliaire, suites adjacentes, loi normale et loi binomiale, vrai-faux sur les complexes, chiffrement affine modulo 27
  apercu: Le premier exercice étudie $f(x) = \mathrm{e}^{x} + \frac{1}{x}$ sur $\left]0, +\infty\right[$ à l'aide de la fonction auxiliaire $g(x) = x^2\mathrm{e}^{x} - 1$, dont l'unique zéro est encadré,
    et en déduit un encadrement du minimum de $f$. Le deuxième exercice étudie deux suites définies par des récurrences croisées, montre qu'elles convergent vers la même limite et identifie celle-ci grâce
    à une combinaison constante, après l'exécution d'un algorithme. Le troisième exercice modélise le diamètre de billes par une loi normale, étudie un contrôle de qualité par un arbre pondéré, puis le
    nombre de billes hors norme dans un sac par une loi binomiale. Le quatrième exercice est un vrai-faux sur les nombres complexes pour les non-spécialistes, et, pour les spécialistes, l'étude d'un codage
    affine modulo 27 et de son décodage.
