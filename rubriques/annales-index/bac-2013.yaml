  nom: Fonction exponentielle et somme géométrique dérivée, géométrie dans le cube, complexes et suite géométrique ou chaîne de Markov, probabilités et fluctuation
  apercu: 'L''exercice 1 étudie $f(x) = x\mathrm{e}^{1-x}$, puis dérive la somme géométrique $1 + x + \dots + x^n$ pour calculer $S_n = f(1) + \dots + f(n)$ et sa limite. L''exercice 2 travaille dans un
    cube : vecteur normal au plan (BGE), droite perpendiculaire, aire d''un triangle et volume d''un tétraèdre. L''exercice 3 étudie soit les points d''affixes $z_n = 2^n\mathrm{e}^{\mathrm{i}(-1)^n\frac{\pi}{6}}$
    et la longueur d''une ligne brisée, calculée comme une somme géométrique, soit, en spécialité, une navigation entre trois pages web décrite par une matrice $3 \times 3$ et son état stable. L''exercice
    4 combine probabilités conditionnelles, loi binomiale et intervalle de fluctuation asymptotique.'
