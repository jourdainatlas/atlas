  nom: QCM de géométrie dans le cube, intervalle de confiance et loi binomiale, fonctions exponentielles à paramètre, suites couplées par matrice ou suite complexe
  apercu: 'L''exercice 1 est un QCM sur le cube ABCDEFGH : positions de droites, produit scalaire, équation du plan (AFH) et vecteur normal. L''exercice 2 établit l''intervalle de confiance à partir de
    l''intervalle de fluctuation, puis estime la proportion d''étudiants connaissant une réponse à l''aide d''un arbre, d''une loi binomiale et d''un intervalle de confiance, avant d''approcher cette loi
    binomiale par une loi normale pour calculer une probabilité. L''exercice 3 étudie $f(x) = (x+1)\mathrm{e}^x$ puis la famille $g_m(x) = x + 1 - m\mathrm{e}^{-x}$ : nombre de zéros, position par rapport
    à une droite et aire $\mathcal{A}(a) = 2\mathrm{e} - 2\mathrm{e}^{1-a}$. L''exercice 4 étudie soit, en spécialité, deux suites couplées par $X_{n+1} = AX_n$ avec $A = P''BP$ et $B$ diagonale, soit la
    suite complexe $z_{n+1} = \frac{z_n + |z_n|}{3}$ dont on étudie la convergence des parties réelle et imaginaire à l''aide du module et de l''inégalité triangulaire.'
