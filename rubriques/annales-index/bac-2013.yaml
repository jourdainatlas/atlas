  nom: Géométrie dans l'espace, famille de fonctions exponentielles, loi normale, marche aléatoire ou chiffrement matriciel
  apercu: L'exercice 1 démontre le critère d'orthogonalité d'une droite et d'un plan, puis examine quatre affirmations sur un plan et des droites de l'espace. L'exercice 2 étudie $f_1(x) = x\mathrm{e}^{-x}$,
    une primitive et une aire, puis montre que les courbes de la famille $f_k(x) = kx\mathrm{e}^{-kx}$ passent par un même point, calcule le maximum de $f_k$ et sa tangente à l'origine, et exploite un graphique
    pour situer deux valeurs du paramètre. L'exercice 3 calcule des probabilités de conformité avec deux lois normales, puis utilise l'indépendance de deux événements. L'exercice 4 étudie soit la traversée
    d'un pont par un robot qui se déplace au hasard, par simulation puis par des suites de probabilités, soit, en spécialité, un codage par blocs de deux lettres avec une matrice $2 \times 2$ modulo 26
    et son décodage par la matrice inverse.
