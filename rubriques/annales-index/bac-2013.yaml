  nom: Probabilités conditionnelles, loi binomiale et fluctuation, tangentes communes à deux courbes exponentielles, vrai-faux complexes et espace, suites homographiques ou matrice de transformation
  apercu: L'exercice 1 traite la provenance de boîtes de thé par un arbre pondéré et la formule de Bayes, puis une loi binomiale et un intervalle de fluctuation pour tester une publicité. L'exercice 2 cherche
    les tangentes communes aux courbes de $x \mapsto \mathrm{e}^x$ et $x \mapsto 1 - \mathrm{e}^{-x}$, ce qui conduit à étudier $\varphi(x) = 2(x-1)\mathrm{e}^x + 1$ et ses deux zéros. L'exercice 3 est
    un vrai-faux sur des nombres complexes, une droite et un plan de l'espace, et l'orthogonalité dans un cube. L'exercice 4 étudie soit deux suites homographiques, l'une par monotonie, l'autre par la suite
    géométrique $v_n = \frac{u_n - 1}{u_n + 1}$, soit, en spécialité, les itérées d'une transformation du plan définie par une matrice $2 \times 2$ dont on calcule les puissances par récurrence.
