  nom: Fonction exponentielle et équation différentielle, transformation complexe, similitude directe dans un rectangle, probabilités et suite arithmético-géométrique, vrai-faux de géométrie dans l'espace
  apercu: Le premier exercice redémontre que $\frac{\mathrm{e}^x}{x}$ tend vers $+\infty$, étudie $f(x) = \frac{1}{2}x\mathrm{e}^{-\frac{1}{2}x}$, montre qu'elle est la solution nulle en 0 de l'équation
    $y' + \frac{1}{2}y = \frac{1}{2}\mathrm{e}^{-\frac{1}{2}t}$ modélisant un médicament, puis interprète un algorithme de seuil. L'exercice 2 de l'enseignement obligatoire étudie la transformation $z'
    = \frac{2\mathrm{i}z}{z - \mathrm{i}}$ (points invariants, image d'un cercle, angles, isobarycentre) ; celui de spécialité étudie une similitude directe dans un rectangle de côtés $\frac{1 + \sqrt{5}}{2}$
    et 1, sa composée avec elle-même et son écriture complexe. Le troisième modélise des services au tennis par un arbre pondéré, calcule une espérance et étudie la suite $x_{n+1} = 0{,}1x_n + 0{,}7$ à
    l'aide d'une suite géométrique auxiliaire. Le dernier est un vrai-faux justifié sur un plan, des droites, un projeté orthogonal et une sphère.
