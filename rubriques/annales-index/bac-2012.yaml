  nom: QCM de géométrie dans l'espace, configurations par les nombres complexes et similitudes, chemins sur un quadrillage et loi binomiale, fonction $\frac{x}{\ln x}$ et suite récurrente
  apercu: Le premier exercice est un QCM justifié sur une droite, des plans et une sphère de l'espace. L'exercice 2 de l'enseignement obligatoire montre, d'abord sur un exemple puis en général à l'aide
    de $\frac{z_D - z_A}{z_E} = \mathrm{i}$, que deux segments issus de deux triangles rectangles isocèles sont perpendiculaires et de même longueur ; celui de spécialité établit une propriété analogue
    par deux méthodes utilisant des similitudes directes et leur composée. Le troisième dénombre les chemins sur un quadrillage, dont le nombre est un coefficient binomial, puis montre que le nombre de
    déplacements vers le nord d'un promeneur aléatoire suit une loi binomiale. Le dernier étudie $f(x) = \frac{x}{\ln x}$ et la suite définie par $u_0 = 5$ et $u_{n+1} = f(u_n)$, dont on conjecture graphiquement
    le comportement avant de démontrer qu'elle converge, puis exploite un algorithme de seuil.
