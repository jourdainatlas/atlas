  nom: Lecture graphique et équation différentielle, tirages et loi binomiale, suite récurrente d'approximation de $\sqrt{7}$, vrai-faux de complexes et d'espace, vrai-faux d'arithmétique et de similitudes
  apercu: Le premier exercice identifie sur un graphique les courbes de $f'$ et d'une primitive de $f$, puis exploite la relation $f(x) - 2f'(x) = x$ en se ramenant à l'équation $y' = \frac{1}{2}y$ pour
    déterminer $f$. Le deuxième calcule des probabilités pour des tirages avec ou sans remise, dont une probabilité conditionnelle inversée, puis utilise une loi binomiale et un seuil. Le troisième étudie
    la suite $u_{n+1} = \frac{1}{2}\left(u_n + \frac{7}{u_n}\right)$, démontre qu'elle converge vers $\sqrt{7}$ et contrôle l'erreur à l'aide de la suite $d_{n+1} = \frac{1}{2}d_n^2$ et d'un algorithme.
    Le quatrième exercice est, au choix, un vrai-faux sur les nombres complexes et la géométrie dans l'espace, ou, pour la spécialité, un vrai-faux sur une équation diophantienne, un reste modulo 7 et des
    similitudes.
