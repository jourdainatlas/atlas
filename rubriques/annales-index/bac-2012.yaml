  nom: Géométrie dans le cube, suite d'intégrales et intégration par parties, équation $\mathrm{e}^x = 3(x^2 + x^3)$, vrai-faux de probabilités et de complexes, vrai-faux d'arithmétique et de similitudes
  apercu: Le premier exercice, dans un cube, étudie deux droites sécantes selon un paramètre, un parallélogramme, puis la section du cube par un plan dont on détermine une équation et ses points d'intersection
    avec les droites $(BF)$ et $(DH)$. Le deuxième étudie la suite $I_n = \int_0^1 x^n\mathrm{e}^{x^2}\,\mathrm{d}x$, établit par intégration par parties une relation entre $I_{n+2}$ et $I_n$, interprète
    un algorithme, puis démontre la convergence et cherche la limite. Le troisième confronte une conjecture graphique sur le nombre de solutions de $\mathrm{e}^x = 3(x^2 + x^3)$ à l'étude d'une fonction
    auxiliaire logarithmique. Le quatrième exercice est, au choix, un vrai-faux sur une formule de Bayes, un tirage simultané et des nombres complexes, ou, pour la spécialité, un vrai-faux sur les équations
    diophantiennes, le PGCD, la division euclidienne et les similitudes.
