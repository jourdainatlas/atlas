  nom: Fonction logarithme, asymptote oblique et aire, vrai-faux de géométrie dans l'espace et de suites, probabilités conditionnelles et loi binomiale, suites de points et transformations complexes
  apercu: Le premier exercice étudie une fonction auxiliaire $g(x) = 2x^3 - 1 + 2\ln x$ et son unique zéro, puis $f(x) = 2x - \frac{\ln x}{x^2}$, son asymptote oblique et ses variations, et calcule par
    intégration par parties une aire dont on cherche la limite. Le deuxième est un vrai-faux justifié sur des droites coplanaires, un projeté orthogonal, des suites adjacentes et une suite majorée. Le troisième
    combine un tirage de jeton et un tirage simultané de boules, calcule des probabilités conditionnelles, applique la formule des probabilités totales et de Bayes, puis une loi binomiale. Le quatrième
    exercice, au choix, étudie un cercle circonscrit puis les points d'affixes $z_{n+1} = \frac{1 + \mathrm{i}\sqrt{3}}{2}z_n + 2$, images successives par une rotation et donc périodiques, ou, pour la spécialité,
    les points d'affixes $z_{n+1} = \frac{1 + \mathrm{i}}{2}z_n + 1$, images successives par une similitude directe, et la limite de la longueur d'une ligne polygonale.
