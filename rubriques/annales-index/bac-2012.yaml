  nom: Vrai-faux d'analyse et de géométrie dans l'espace, rotation et symétrie dans le plan complexe, similitudes, tirages avec remise et loi binomiale, suites définies par deux moyennes
  apercu: Le premier exercice est un vrai-faux justifié portant sur une droite et un plan, la distance d'un point à un plan, les asymptotes de $\frac{3}{1 + \mathrm{e}^{-2x}}$, le signe d'une intégrale
    fonction de sa borne et l'intégrale $\int_1^{\mathrm{e}} t^2\ln t\,\mathrm{d}t$. L'exercice 2 de l'enseignement obligatoire utilise une rotation de centre $O$ et d'angle $\frac{\pi}{6}$, un conjugué
    et une symétrie par rapport à une droite ; celui de spécialité détermine une similitude directe de centre $O$, puis étudie la composée $g = s \circ f$ de cette similitude $f$ et de la réflexion $s$
    d'axe des abscisses, d'écriture $z' = 2\mathrm{e}^{-\mathrm{i}\frac{\pi}{6}}\overline{z}$, et la nature de $g \circ g$. Le troisième étudie un jeu de tirages avec remise à l'aide d'une loi binomiale,
    détermine un nombre minimal de parties, puis recherche les valeurs de $k$ rendant le jeu favorable. Le dernier fait tourner un algorithme puis démontre la convergence de deux suites définies par $u_{n+1}
    = \frac{u_n + v_n}{2}$ et $v_{n+1} = \sqrt{\frac{u_n^2 + v_n^2}{2}}$.
