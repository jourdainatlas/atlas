  nom: Fonction exponentielle, tangente et aire, transformation complexe, suite et suite géométrique auxiliaire, questions de probabilités, arithmétique et similitude
  apercu: Le premier exercice étudie $f(x) = x\mathrm{e}^{x-1} + 1$, cherche la tangente passant par l'origine en résolvant $1 - x^2\mathrm{e}^{x-1} = 0$, puis calcule une aire par intégration par parties.
    Le deuxième étudie le triangle $OAB$ par le quotient $\frac{b}{a}$, l'ensemble des points où $|z'| = 1$ pour $z' = \frac{z + 1 - 2\mathrm{i}}{z + 2 + \mathrm{i}}$, et une propriété de médiane et de
    hauteur obtenue par rotations. Le troisième étudie la suite $u_{n+1} = \frac{n+1}{2n}u_n$, montre qu'elle converge, obtient $u_n = \frac{n}{2^n}$ par une suite géométrique auxiliaire et en déduit sa
    limite. Le quatrième exercice, au choix, pose cinq questions indépendantes de probabilités (probabilités totales, combinaisons, loi binomiale, indépendance, simulation) ou, pour la spécialité, quatre
    questions sur une équation diophantienne, des congruences modulo 7, une similitude et un algorithme de recherche de diviseurs.
