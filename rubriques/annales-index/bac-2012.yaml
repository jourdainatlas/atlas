  apercu: Le premier exercice est un vrai-faux justifié qui déduit de la courbe de $f'$ des propriétés de $f$ et de sa tangente en 0. Le deuxième modélise une procédure de recrutement par un arbre pondéré,
    puis utilise une loi binomiale et cherche un nombre minimal de dossiers. Le troisième étudie $f(x) = \frac{1}{x+1} + \ln\left(\frac{x}{x+1}\right)$, puis la suite $u_n = 1 + \frac{1}{2} + \cdots + \frac{1}{n}
    - \ln n$, conjecture son comportement à l'aide d'un algorithme et démontre sa convergence en comparant $\frac{1}{k}$ à $\int_k^{k+1}\frac{1}{x}\,\mathrm{d}x$. Le quatrième exercice, au choix, détermine
    l'image d'une droite par $z \mapsto \frac{1}{z+1}$ ou, pour la spécialité, par $z \mapsto \frac{1}{(1+\mathrm{i})z + 3 - \mathrm{i}}$, en décomposant chaque application en une transformation suivie
    de $z \mapsto \frac{1}{z}$.
