  nom: Probabilités conditionnelles et loi binomiale, fonction logarithme et asymptote oblique, fonction de dérivée $\frac{1}{1+x^2}$ et suite d'intégrales, transformations complexes, similitude et équations
    diophantiennes
  apercu: Le premier exercice calcule des probabilités conditionnelles dans une association sportive, puis utilise une loi binomiale, un seuil sur $p_n = 1 - \left(\frac{7}{10}\right)^n$ et l'espérance
    d'un gain à une loterie à tirage simultané. Le deuxième redémontre que $\frac{\ln x}{x}$ tend vers 0 en $+\infty$, étudie $f(x) = x - \frac{\ln x}{x}$, son asymptote oblique $y = x$, et écrit un algorithme
    de seuil. Le troisième étudie une fonction $f$ telle que $f(0) = 0$ et $f'(x) = \frac{1}{1+x^2}$ en la composant avec la tangente, obtient $f(1) = \frac{\pi}{4}$, puis encadre la suite $I_n = \int_0^1
    x^n f(x)\,\mathrm{d}x$. Le quatrième exercice, au choix, étudie l'application $z \mapsto z^2$ (points invariants, antécédents, triangle rectangle isocèle, alignement) ou, pour la spécialité, une similitude
    directe et des équations en nombres entiers.
