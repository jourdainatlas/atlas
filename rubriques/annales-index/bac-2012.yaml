  nom: Fonction logarithme et suite récurrente, loi binomiale et temps d'attente, équations différentielles, complexes ou similitudes
  apercu: L'exercice 1 étudie $f(x) = 5\ln(x+3) - x$, localise l'unique zéro $\alpha$ de $f$ puis montre que la suite $u_{n+1} = 5\ln(u_n+3)$, de premier terme 4, croît et converge vers $\alpha$, avec un
    algorithme de seuil. L'exercice 2 compare un tirage avec remise de trois boules, modélisé par une loi binomiale, à une expérience où l'on s'arrête à la première boule rouge, en trois tirages au plus,
    dont on calcule les lois et les espérances. L'exercice 3 démontre la forme des solutions de $y' = ay + b$ puis examine trois affirmations sur des équations différentielles, dont un calcul d'aire. L'exercice
    4 étudie soit la transformation $z' = \dfrac{2z-1}{2z-2}$ et l'image d'une droite, soit, en spécialité, des similitudes directes associées à deux carrés et à un quadrilatère.
