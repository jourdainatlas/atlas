  nom: Loi de refroidissement par une suite et une équation différentielle, QCM de géométrie dans l'espace, probabilités conditionnelles, fluctuation et variable à densité, équation complexe et orthogonalité
    ou matrices et équation de Bézout
  apercu: Le premier exercice modélise le refroidissement d'un café d'abord par la suite $T_{n+1} = 0{,}8T_n + 2$, ramenée à une suite géométrique et complétée d'un algorithme de seuil, puis par l'équation
    $\theta' = -0{,}2(\theta - M)$, résolue pour $M = 0$ et exploitée pour $g(t) = 10 + 70\mathrm{e}^{-0{,}2t}$. Le deuxième exercice est un QCM de géométrie dans l'espace (position relative d'une droite
    et d'un plan, section d'un cube, distance d'un point à une droite, position relative de deux plans), et le troisième combine probabilités conditionnelles, intervalle de fluctuation et la densité $f(x)
    = \frac{2}{(x - 2)^2}$ sur $[3, 4]$, dont on calcule une probabilité et l'espérance. Au choix, les non-spécialistes résolvent une équation de degré 3 dans $\mathbb{C}$ et démontrent qu'un triangle est
    rectangle par un critère d'orthogonalité, et les spécialistes étudient les bases de l'ensemble des matrices colonnes à deux lignes et à coefficients entiers à l'aide de l'équation $11x + 6y = 1$ et
    de l'inverse d'une matrice.
