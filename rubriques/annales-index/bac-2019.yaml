  nom: Loi normale, fluctuation et arbre pondéré, vrai-faux sur les complexes, inégalité logarithmique et suite récurrente, géométrie dans un cube ou chiffrement matriciel modulo 5
  apercu: Le premier exercice calcule des probabilités pour une loi normale d'espérance $1{,}5$, détermine un écart-type pour atteindre 98 % de tubes acceptés, décide d'une révision de machine par un intervalle
    de fluctuation et complète un arbre pondéré. Le deuxième est un vrai-faux sur une équation complexe, la forme exponentielle de $1 + \mathrm{e}^{2\mathrm{i}x}$, un ensemble de points et l'équation $z^5
    + z - \mathrm{i} + 1 = 0$. Le troisième établit $\ln(x + 1) \leqslant x$ et l'applique à la suite $u_{n+1} = u_n - \ln(1 + u_n)$, dont on montre la convergence et détermine la limite avant d'écrire
    un algorithme de seuil. Au choix, les non-spécialistes étudient le solide formé par les centres des faces d'un cube (orthogonalité, plans, intersection de deux plans), et les spécialistes un codage
    de lettres par multiplication matricielle modulo $5$, son décodage et une matrice inutilisable.
