  nom: QCM de probabilités (lois binomiale, normale, exponentielle, intervalle de confiance), suite récurrente et suite d'intégrales, complexes et alignement, plan et section d'un cube ou décompositions
    arithmétiques de 40
  apercu: Le premier exercice est un QCM sur une station de ski qui mobilise une loi binomiale, une loi normale d'écart-type inconnu, une loi exponentielle d'espérance 5 et la taille d'échantillon d'un
    intervalle de confiance. Le deuxième exercice étudie la suite $u_{n+1} = (n+1)u_n - 1$, dont un algorithme fait conjecturer un comportement très sensible à $u_1$, puis la suite d'intégrales $I_n = \int_0^1
    x^n\mathrm{e}^{1-x}\,\mathrm{d}x$, qu'il encadre et dont il calcule la limite, avant d'établir $u_n = n!\,(u_1 - \mathrm{e} + 2) + I_n$ pour trancher entre les cas $u_1 = 0{,}7$ et $u_1 = 0{,}8$. Le
    troisième cherche les complexes $z$ non nuls pour lesquels les points d'affixes $1$, $z^2$ et $\frac{1}{z}$ sont alignés, condition ramenée au fait que $z^2 + z + 1$ est réel. Au choix, les non-spécialistes
    déterminent le plan $(PQR)$ d'équation $x - y + z - 2 = 0$, le projeté du centre du cube et la section du cube par ce plan, et les spécialistes résolvent $20x + 19y = 40$ et $x^2 - y^2 = 40$, puis montrent
    par congruences modulo 9 que 40 n'est pas une « somme » de trois cubes.
