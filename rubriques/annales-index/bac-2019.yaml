- sujet: https://www.apmep.fr/IMG/pdf/S_Polynesie_19_juin_2019_DV-2.pdf
  nom: Loi exponentielle, loi normale et fluctuation, fonction modélisant un écoulement et volume, suite d'intégrales et somme, droites et plans dans un pavé ou matrice, congruences et irrationalité
  apercu: Le premier exercice étudie la durée de fonctionnement d'un distributeur par une loi exponentielle de paramètre $\lambda = 0{,}1$, la masse d'une glace par une loi normale, puis met en doute une
    hypothèse de proportion par un intervalle de fluctuation. Le deuxième exercice cherche une fonction vérifiant trois conditions en testant un trinôme, $k\ln x$ et $\frac{a}{x^4} + bx$, puis étudie $f(x)
    = \frac{1}{20}\left(x - \frac{1}{x^4}\right)$ et calcule le volume $V = \int_{\alpha}^1 \pi x^2 f'(x)\,\mathrm{d}x$ ; le troisième étudie $I_n = \int_0^{\frac{1}{2}} \frac{x^n}{1 - x}\,\mathrm{d}x$,
    la relation $I_n - I_{n+1} = \frac{\left(\frac{1}{2}\right)^{n+1}}{n+1}$, un encadrement et la limite de la somme $S_n = I_0 - I_n$. Au choix, les non-spécialistes déterminent le plan $(EBD)$ d'un parallélépipède
    rectangle et son intersection $K$ avec $(AG)$, et les spécialistes étudient les chiffres des unités d'une suite définie par la matrice $M$ par congruences modulo 5, puis démontrent l'irrationalité de
    $\sqrt{3}$ à l'aide de $M^{-1}$.
