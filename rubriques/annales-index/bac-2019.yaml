  nom: Arbre pondéré, loi normale et intervalle de fluctuation, géométrie dans l'espace, fonction avec logarithme et primitive, suites (vrai-faux et algorithmes) ou matrice de transition
  apercu: Le premier exercice exploite un arbre pondéré et la formule de Bayes, détermine l'écart-type d'une loi normale à partir d'une probabilité imposée et teste une proportion annoncée par un intervalle
    de fluctuation. Le deuxième exercice calcule l'angle $\widehat{AOB}$ par un produit scalaire, vérifie l'équation $7x + 9y - 70z = 0$ du plan $(OAB)$, coupe les droites $(CA)$ et $(CB)$ par un plan parallèle
    et montre que $(EF)$ est parallèle à $(AB)$ ; le troisième examine les conjectures d'un élève sur $g(x) = 4x - x\ln x$, en dresse le tableau de variations et utilise la primitive $G(x) = \frac{1}{4}x^2(9
    - 2\ln x)$. Au choix, les non-spécialistes traitent un vrai-faux sur les suites puis la suite $U_{n+1} = \frac{2U_n}{1 + U_n}$, dont ils démontrent la forme explicite par récurrence avant de comparer
    trois algorithmes, et les spécialistes modélisent le trajet d'une bouteille entre deux ports et l'océan par la matrice $M$, établissent $M^n = \left(\frac{2}{3}\right)^{n-1}M$ et en déduisent la probabilité
    que la bouteille soit dans l'océan.
