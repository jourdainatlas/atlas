  apercu: Le premier exercice modélise des notes par deux lois normales, calcule une probabilité totale, discute un échantillon par un intervalle de fluctuation et détermine un seuil de note. Le deuxième
    exercice étudie $G(t) = \int_0^t g(u)\,\mathrm{d}u$ pour $g(u) = \mathrm{e}^{-u^2}$, d'abord graphiquement, puis estime $G(1)$ par la méthode de Monte-Carlo avec un algorithme et un intervalle de confiance,
    et établit enfin $G(t) \leqslant 2 - \frac{1}{t}$ pour $t \geqslant 1$ ; le troisième est un vrai-faux sur une équation du second degré à paramètre, l'ensemble $|z - 6| = |z + 5\mathrm{i}|$, la coplanarité
    de deux droites et un vecteur normal dans un cube. Au choix, les non-spécialistes étudient les suites $u_{n+1} = f(u_n)$ et $v_{n+1} = f(v_n)$ pour $f(x) = \frac{2 + 3x}{4 + x}$, par monotonie pour
    la première et par l'encadrement $0 \leqslant 1 - v_n \leqslant \left(\frac{1}{2}\right)^n$ pour la seconde, et les spécialistes étudient une population de larves et d'adultes à l'aide de vecteurs propres
    de la matrice $A$, puis l'équation $19x - 6y = 1$ et un PGCD.
