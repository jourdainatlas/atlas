    normale pour la durée de parties de jeux vidéo, puis étudie la suite $a_{n+1} = 0{,}5a_n + 0{,}3$ issue d'un arbre pondéré ; le troisième est un vrai-faux sur la nature d'un triangle, $u^{2019} + \overline{u}^{2019}$,
