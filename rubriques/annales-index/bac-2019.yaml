  apercu: 'Le premier exercice étudie $f(x) = x(1 - \ln x)^2$ sur $\left]0, 1\right]$, puis l''aire du triangle formé par les axes et la tangente à la courbe de $\ln$, égale à $\frac{1}{2}a(1 - \ln a)^2$,
    dont il détermine le maximum. Le deuxième exercice étudie la transformation $z'' = -\frac{1}{z}$ : image de points, image de l''intérieur du disque unité, et appartenance à la droite d''équation $x
    = 1$ de l''image de tout point, distinct de $O$, du cercle d''équation $x^2 + x + y^2 = 0$. Le troisième définit le bicoin, tétraèdre dont les quatre faces sont des triangles rectangles, montre que
    le milieu de la plus longue arête est équidistant des sommets, puis construit un tel tétraèdre dans un repère et détermine le centre et le rayon de la sphère passant par ses quatre sommets. Au choix,
    les non-spécialistes étudient le retour des bouteilles par un arbre pondéré et la suite $r_{n+1} = 0{,}75r_n + 0{,}2$, et les spécialistes suivent le remplissage de deux bassins par $U_{n+1} = MU_n
    + C$ et une diagonalisation de $M$.'
