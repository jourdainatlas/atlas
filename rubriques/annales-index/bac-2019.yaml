  nom: Loi exponentielle, arbre pondéré et loi normale, fonction exponentielle et valeur moyenne, cube et plan de l'espace, suite homographique ou PGCD et puissances d'une matrice
  apercu: Le premier exercice étudie la durée de vie d'un chronomètre par une loi exponentielle, l'origine d'un roulement défectueux par un arbre pondéré et la formule de Bayes, puis le diamètre d'un roulement
    par une loi normale, avec un intervalle de fluctuation et la recherche de l'écart-type $\sigma$. Le deuxième exercice étudie la fonction $f(t) = 3t\mathrm{e}^{-\frac{1}{4}t} + 2$ (variations, solution
    de $f(t_0) = 2{,}5$ par le théorème des valeurs intermédiaires) et calcule une valeur moyenne à l'aide d'une primitive, et le troisième construit la section d'un cube par le plan $(MNP)$, détermine
    le projeté orthogonal $K$ de $G$ sur ce plan et le volume de la pyramide $GMEDI$. Au choix, les non-spécialistes étudient la suite $u_{n+1} = 3 - \frac{10}{u_n + 4}$ à l'aide d'une suite géométrique
    auxiliaire et d'un algorithme de seuil, et les spécialistes calculent $\mathrm{PGCD}(4^3 - 1, 4^2 - 1)$ par soustractions successives puis expriment la suite $u_{n+2} = 5u_{n+1} - 4u_n$ par diagonalisation
    pour en déduire $\mathrm{PGCD}(4^{n+1} - 1, 4^n - 1)$.
  pages: 6
