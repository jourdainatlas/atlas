# Rubrique « Exercices » — PROTOTYPE.
# Deux échelles : la feuille (un chapitre, énoncé et corrigé en PDF) et l'exercice isolé,
# repris de la feuille avec son énoncé et son corrigé, pour la recherche par notion.
# Les exercices de chaque feuille sont dans rubriques/exercices/<feuille>.yaml.
# Difficulté : 1 à 4 étoiles, selon les conventions des feuilles.
#   1 application directe · 2 mise en œuvre · 3 problème structuré · 4 problème long

intro: |
  La banque réunit les feuilles d'exercices de chaque chapitre et, exercice par exercice, leurs énoncés et leurs corrigés. On peut la parcourir par feuille, ou chercher un exercice par niveau, par difficulté, par type d'activité ou par notion de l'atlas : chaque exercice indique les nœuds de l'édifice qu'il met en jeu, et la fiche de ces nœuds renvoie en retour aux exercices correspondants.

types: [Calcul, Démonstration, Conjecture, Algorithmique, Lecture graphique, Modélisation, QCM, Vrai ou faux, Type Bac, Problème]

