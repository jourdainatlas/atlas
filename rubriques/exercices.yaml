exercices:
  - id: t-08-01
    feuille: f-t-08
    numero: 1
    partie: Notion d'équation différentielle
    etoiles: 1
    types: [Calcul]
    noeuds: [edo]
    notions: [equation-differentielle]
    enonce: |
      Dans chaque cas, vérifier que la fonction $f$ proposée est solution de l'équation différentielle donnée. On calculera $f'(x)$ d'une part, et le second membre d'autre part, avant de les comparer.

      **1.** $f(x) = 3\mathrm e^{4x}$ et $y' = 4y$

      **2.** $f(x) = -2\mathrm e^{-x}$ et $y' = -y$

      **3.** $f(x) = \mathrm e^{3x} + 1$ et $y' = 3y - 3$

      **4.** $f(x) = 4\mathrm e^{-2x} + 5$ et $y' = -2y + 10$

      **5.** $f(x) = x\mathrm e^{2x}$ et $y' = 2y + \mathrm e^{2x}$.
    corrige: |
      La méthode est toujours la même : on calcule $f'(x)$, on calcule le second membre en remplaçant $y$ par $f(x)$, et l'on compare.

      **1.** $f'(x) = 3 \times 4\mathrm e^{4x} = 12\mathrm e^{4x}$ et $4f(x) = 12\mathrm e^{4x}$ : les deux expressions coïncident pour tout réel $x$, donc $f$ est solution de $y' = 4y$.

      **5.** On dérive le produit : $f'(x) = \mathrm e^{2x} + 2x\mathrm e^{2x}$, et $2f(x) + \mathrm e^{2x} = 2x\mathrm e^{2x} + \mathrm e^{2x}$. Donc $f$ est solution de $y' = 2y + \mathrm e^{2x}$.

      *Les questions 2 à 4, présentes dans le corrigé complet, sont omises dans ce prototype.*
  - id: t-08-10
    feuille: f-t-08
    numero: 10
    partie: L'équation $y' = ay$
    etoiles: 2
    types: [Calcul]
    noeuds: [edo, anc]
    notions: [equation-differentielle, exponentielle]
    enonce: |
      Soit $f$ la solution de l'équation $y' = -4y$ vérifiant $f(0) = 5$.

      **1.** Déterminer l'expression de $f(x)$.

      **2.** Calculer $f'(x)$ et en déduire le sens de variation de $f$ sur $\mathbb R$.

      **3.** Déterminer $\lim_{x \to +\infty} f(x)$ et $\lim_{x \to -\infty} f(x)$.

      **4.** La fonction $f$ s'annule-t-elle ? Justifier.

      **5.** Résoudre l'équation $f(x) = 1$. On donnera la valeur exacte puis une valeur approchée au millième.

      **6.** Reprendre les questions 2 et 3 pour la solution de $y' = 3y$ vérifiant $g(0) = -2$. Quel rôle joue le signe de $a$ ?
    corrige: |
      **1.** Les solutions de $y' = -4y$ sont $x \mapsto C\mathrm e^{-4x}$, et $f(0) = C = 5$, donc $f(x) = 5\mathrm e^{-4x}$.

      **2.** $f'(x) = -20\mathrm e^{-4x}$. Comme l'exponentielle est strictement positive, $f'(x) < 0$ pour tout $x$ : $f$ est strictement décroissante sur $\mathbb R$.

      **3.** Comme $-4 < 0$, $\lim_{x \to +\infty} f(x) = 0$ et $\lim_{x \to -\infty} f(x) = +\infty$.

      **4.** Non : $f(x)$ est le produit d'un réel non nul par une exponentielle, qui ne s'annule jamais. C'est un phénomène général : une solution non nulle de $y' = ay$ garde un signe constant.

      **5.** $5\mathrm e^{-4x} = 1 \iff -4x = -\ln 5$, d'où $x = \dfrac{\ln 5}{4} \approx 0{,}402$.

      **6.** $g(x) = -2\mathrm e^{3x}$ et $g'(x) = -6\mathrm e^{3x} < 0$ : $g$ est strictement décroissante, avec $\lim_{+\infty} g = -\infty$ et $\lim_{-\infty} g = 0$. Le signe de $a$ décide du côté où la solution tend vers $0$ : en $+\infty$ si $a < 0$, en $-\infty$ si $a > 0$. Le signe de $C$, lui, ne fait que décider si la courbe est au-dessus ou en dessous de l'axe.
  - id: t-08-29
    feuille: f-t-08
    numero: 29
    partie: Exercices de synthèse
    etoiles: 3
    types: [Démonstration, Problème]
    noeuds: [edo, analyse-reelle]
    notions: [equation-differentielle, derivable]
    enonce: |
      Dans tout l'exercice, $a$ et $b$ désignent deux réels avec $a \neq 0$.

      **Partie A : structure des solutions.**

      **1.** Soient $f$ et $g$ deux solutions de $y' = ay$. Démontrer que $f + g$ et $f - g$ sont également solutions.

      **2.** Soit $f$ une solution de $y' = ay$ et $k$ un réel. Démontrer que $kf$ est solution.

      **3.** Soient $f_1$ et $f_2$ deux solutions de $y' = ay + b$. Démontrer que $f_1 - f_2$ est solution de $y' = ay$.

      **4.** En déduire que si l'on connaît *une* solution particulière de $y' = ay + b$, alors on les connaît toutes.

      **Partie B : redémonstration du théorème 1.**

      Soit $f$ une solution quelconque de $y' = ay$ sur $\mathbb R$. On pose, pour tout réel $x$, $g(x) = f(x)\,\mathrm e^{-ax}$.

      **5.** Justifier que $g$ est dérivable sur $\mathbb R$, puis calculer $g'(x)$.

      **6.** En utilisant le fait que $f$ est solution de $y' = ay$, démontrer que $g'(x) = 0$ pour tout réel $x$.

      **7.** Qu'en déduit-on pour la fonction $g$ ? Conclure quant à l'expression de $f$.
    corrige: |
      **7.** Une fonction de dérivée nulle sur un *intervalle* y est constante. Comme $\mathbb R$ est un intervalle, il existe un réel $C$ tel que $f(x)\mathrm e^{-ax} = C$ pour tout $x$ ; en multipliant par $\mathrm e^{ax}$, qui n'est jamais nul, $f(x) = C\mathrm e^{ax}$. On a bien démontré qu'il n'existe pas d'autres solutions que celles annoncées par le théorème 1.

      *Les questions 1 à 6, présentes dans le corrigé complet, sont omises dans ce prototype.*
