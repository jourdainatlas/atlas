      - { nom: La feuille d'exercices, ancre: exercices/feuille/f-m-galois }

  - date: "2026-10-31"
    rubrique: edifice
    titre: Cohomologie, Hurewicz et une nouvelle théorie, la cohomologie des groupes
    texte: |
      L'homologie s'enrichit de la cohomologie singulière et du produit cup, de l'homologie cellulaire, de la formule de Künneth et du théorème de Hurewicz en degré 1. Une théorie nouvelle, la cohomologie des groupes, traite $H^1$, $H^2$, les extensions et le théorème de Schur-Zassenhaus, et la théorie de Galois gagne un chapitre sur Hilbert 90.
    liens:
      - { nom: Cohomologie des groupes, ancre: cohgr }
      - { nom: Homologie singulière, ancre: hom }

  - date: "2026-10-31"
    rubrique: site
    titre: Signaler une erreur en deux gestes
    texte: |
      Un petit drapeau accompagne désormais chaque fiche, chapitre, exercice et sujet d'annales. Il ouvre un message déjà adressé, qui désigne précisément le passage concerné.

  - date: "2026-10-30"
    rubrique: edifice
    titre: Deux théories nouvelles, la calculabilité et les distributions
    texte: |
      La calculabilité (fonctions récursives, machines à registres, problème de l'arrêt, théorème de Rice) mène à une démonstration de l'incomplétude ; « Distributions et EDP » va jusqu'à la solution élémentaire du laplacien et à l'équation de la chaleur. Parmi les chapitres ajoutés le même jour : Seifert-van Kampen, les théorèmes de Jordan, la représentation conforme de Riemann et le théorème de Gauss-Bonnet local.
    liens:
      - { nom: Calculabilité, ancre: calc }
      - { nom: Distributions et EDP, ancre: edp }

