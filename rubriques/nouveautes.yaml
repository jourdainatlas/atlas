  - date: "2026-11-03"
    rubrique: edifice
    titre: Le second théorème d'incomplétude entièrement démontré dans l'arithmétique de Peano
    texte: |
      Cinq chapitres nouveaux de la calculabilité mènent pas à pas au second théorème d'incomplétude pour l'arithmétique de Peano. Ils y démontrent, avec le système formel de l'atlas, l'arithmétique élémentaire jusqu'au lemme chinois, la fonction $\beta$ de Gödel et les fonctions primitives récursives, le codage de la syntaxe et la deuxième condition de dérivabilité, la substitution et les instances, enfin la $\Sigma_1$-complétude formalisée et la troisième condition, d'où le second théorème et le théorème de Löb pour la formule naturelle de démontrabilité. Le dernier résultat admis de l'édifice est ainsi levé : tout y est désormais démontré, hors les prolongements déclarés hors cadre.
    liens:
      - { nom: Arithmétique dans PA, ancre: calc.cal-peano }
      - { nom: β et récurrence dans PA, ancre: calc.cal-beta-pa }
      - { nom: Suites codées dans PA, ancre: calc.cal-syntaxe-pa }
      - { nom: Instances dans PA, ancre: calc.cal-instances-pa }
      - { nom: Σ₁-complétude dans PA, ancre: calc.cal-sigma-pa }
      - { nom: Second théorème d'incomplétude, ancre: log.l-incompletude }

  - date: "2026-11-03"
    rubrique: edifice
    titre: Lemme diagonal, théorèmes de Tarski et de Löb
    texte: |
      Un chapitre nouveau de la calculabilité démontre le lemme diagonal dans l'arithmétique de Robinson, la non-définissabilité de la vérité, le premier théorème d'incomplétude sous la forme de Gödel, puis le théorème de Löb et le second théorème pour toute formule de démontrabilité qui vérifie les conditions de dérivabilité.
    liens:
      - { nom: Lemme diagonal, ancre: cal-diagonal.cal-dg-diagonal }
      - { nom: Théorème de Löb, ancre: cal-diagonal.cal-dg-second }

