  - date: "2026-11-08"
    rubrique: site
    titre: Revenir au terme précédent dans le lexique
    texte: |
      Quand on passe d'une entrée du lexique à une autre en cliquant sur un terme de sa définition ou de ses exemples, un petit bouton « ← » placé à côté du titre ramène à l'entrée d'où l'on venait, à l'endroit où on l'avait laissée. Après une suite de trois ou quatre termes, des clics successifs remontent la chaîne jusqu'au premier ; le bouton « Précédent » du navigateur fait de même.
  - date: "2026-11-05"
    rubrique: site
    titre: Naviguer plus facilement entre une fiche et le lexique
    texte: |
      Sur téléphone, un glissement latéral du doigt fait passer de l'onglet Fiche à l'onglet Lexique et inversement, et chaque onglet retrouve sa position quand on y revient ; toucher l'onglet déjà ouvert remonte en haut de son contenu. Après un lien vers l'édifice depuis un cours, une annale ou une feuille d'exercices, un bouton « Revenir à … » ramène à la page et à l'endroit exacts d'où l'on venait, et le bouton « Précédent » du navigateur fait de même à chaque étape.
  - date: "2026-11-05"
    rubrique: edifice
    titre: "Tout le lexique illustré par des exemples ; comparaison asymptotique et développements limités"
    texte: |
      Les 1 079 entrées du lexique de l'édifice ont maintenant leurs exemples : 3 130 en tout, rédigés et commentés, avec au moins un vrai contre-exemple quand la notion s'y prête, et 335 schémas calculés. Chaque exemple n'emploie que des notions définies avant la fiche du terme ; les calculs ont été vérifiés par programme et chaque lot relu par un second lecteur. Plusieurs fiches ont reçu à cette occasion des énoncés démontrés nouveaux, comme l'anneau des parties d'un ensemble, les six bijections de trois points ou le corps ordonné non archimédien ℚ(X).

      Un nouveau chapitre de l'analyse réelle définit, pour les fonctions comme pour les suites, les relations « négligeable devant », « dominée par » et « équivalente à », avec leurs règles de calcul et les opérations qu'il ne faut pas faire. Il établit les développements limités à tout ordre, la formule de Taylor-Young sous la plus faible des hypothèses usuelles, les développements usuels et l'étude locale des fonctions, puis applique les équivalents aux séries à termes positifs, aux séries de Riemann et à la constante d'Euler ; tout y est démontré, sans axiome du choix.
    liens:
      - { nom: Lacet, ancre: lexique/lacet }
      - { nom: Revêtement, ancre: lexique/revetement }
      - { nom: Forme fermée, ancre: lexique/forme-fermee }
      - { nom: Comparaison asymptotique et développements limités, ancre: analyse-reelle.ar-asymptotique }
      - { nom: Formule de Taylor-Young, ancre: ar-asymptotique.as-taylor-young }
      - { nom: Séries et équivalents, ancre: ar-asymptotique.as-series }
