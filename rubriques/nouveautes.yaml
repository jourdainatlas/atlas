    texte: |
      Le théorème de complétude de Gödel est démontré par la construction de Henkin. Deux théories apparaissent, les espaces métriques et normés et le calcul différentiel, et les fiches s'illustrent de schémas. On peut aussi chercher une notion dans tout l'édifice et zoomer le graphe à deux doigts.
    liens:
