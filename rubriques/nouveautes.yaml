# Rubrique « Nouveautés » (domaine À propos – Contact).
# Une entrée par nouveauté notable, la plus récente en tête. Champs :
#   date: "AAAA-MM-JJ" (entre guillemets)       rubrique: edifice | cours | exercices | annales | site
#   titre: court            texte: une ou deux phrases rédigées (formules et liens permis)
#   liens: [{nom, ancre}] ancre sans « # » (cours/m-galois, exercices/feuille/f-m-galois, calc…)
#   couvre: [ids]           facultatif : identifiants annoncés que les liens ne nomment pas
#                           (théorie, cours, feuille, session « annales-AAAA »)
#
# RÈGLE (MEMO_atlas.md, section 0, point 8) : toute conversation qui publie un AJOUT COMPLET (nouveau
# chapitre ou niveau de cours, nouvelle feuille, nouvelle théorie ou nouveau chapitre de l'édifice,
# nouvelle session d'annales, nouvelle fonction du site) ajoute ici, dans la même modification, une entrée
# en tête, rédigée en une ou deux phrases. JAMAIS pour une correction (coquille, calcul, démonstration
# complétée, reformulation, mise en page). En cas de doute, s'abstenir. construire.py signale par un
# avertissement toute théorie, tout cours, toute feuille ou toute session nouvelle qui n'est pas annoncée.

intro: |
  Ce qui a été ajouté ou amélioré sur le site, du plus récent au plus ancien. Les nouveautés parues depuis votre dernière visite sont signalées.

entrees:
  - date: "2026-11-03"
    rubrique: edifice
    titre: La fonction β et les fonctions primitives récursives dans PA
    texte: |
      Un chapitre nouveau démontre dans l'arithmétique de Peano le lemme chinois et le prolongement des suites codées par la fonction $\beta$ de Gödel, puis que chaque fonction primitive récursive y est définie par une formule dont PA démontre qu'elle est fonctionnelle et qu'elle vérifie les équations de récurrence. C'est la deuxième étape vers le second théorème d'incomplétude.
    liens:
      - { nom: β et récurrence dans PA, ancre: calc.cal-beta-pa }

  - date: "2026-11-03"
    rubrique: edifice
    titre: L'arithmétique de Peano dans le système formel
    texte: |
      Un chapitre nouveau de la calculabilité démontre dans l'arithmétique de Peano, avec le système formel de l'atlas, les lois de l'addition et de la multiplication, l'ordre, la division euclidienne, la relation de Bézout et le lemme chinois, puis la forme $\Sigma_1$ des formules de la classe utilisée pour la démontrabilité. C'est la première étape vers le second théorème d'incomplétude pour l'arithmétique de Peano.
    liens:
      - { nom: Arithmétique dans PA, ancre: calc.cal-peano }

  - date: "2026-11-03"
    rubrique: edifice
    titre: Lemme diagonal, théorèmes de Tarski et de Löb
    texte: |
      Un chapitre nouveau de la calculabilité démontre le lemme diagonal dans l'arithmétique de Robinson, la non-définissabilité de la vérité, le premier théorème d'incomplétude sous la forme de Gödel, puis le théorème de Löb et le second théorème pour toute formule de démontrabilité qui vérifie les conditions de dérivabilité.
    liens:
      - { nom: Lemme diagonal, ancre: cal-diagonal.cal-dg-diagonal }
      - { nom: Théorème de Löb, ancre: cal-diagonal.cal-dg-second }

  - date: "2026-11-03"
    rubrique: site
    titre: Une page de lecture pour chaque cours et chaque exercice
    texte: |
      Chaque cours, chaque feuille et chacun des 2 129 exercices a désormais sa page à une adresse propre, lisible sans ouvrir l'atlas interactif et trouvable par les moteurs de recherche : énoncé composé, corrigé replié, PDF, notions de l'édifice en liens. Le bouton « Partager » d'un cours, d'une feuille ou d'un exercice copie l'adresse de cette page.
    liens:
      - { nom: Les cours, ancre: cours }
      - { nom: Les exercices, ancre: exercices }

  - date: "2026-11-03"
    rubrique: edifice
    titre: Le premier théorème d'incomplétude entièrement démontré
    texte: |
      Un chapitre nouveau de la calculabilité établit, dans le système formel de l'atlas, les calculs dans l'arithmétique de Robinson, la $\Sigma_1$-complétude et la représentation des relations récursives, puis le théorème de Gödel-Rosser : une théorie cohérente, récursivement axiomatisable, qui démontre les axiomes de Robinson est incomplète.
    liens:
      - { nom: Représentation et Gödel-Rosser, ancre: calc.cal-representation }
      - { nom: Théorème de Gödel-Rosser, ancre: cal-representation.cal-rp-godel-rosser }

  - date: "2026-11-03"
    rubrique: edifice
    titre: La formule de Stokes sur les variétés à bord
    texte: |
      Un chapitre nouveau de la théorie de de Rham démontre le changement de variables pour l'intégrale de Riemann, définit les variétés à bord, leur orientation induite et l'intégrale d'une forme de degré maximal, puis établit la formule de Stokes $\int_M \mathrm d\omega = \int_{\partial M} \omega$, sans axiome du choix. La géométrie différentielle construit désormais les partitions de l'unité et les formes volume sur une variété.
    liens:
      - { nom: Variétés à bord et Stokes, ancre: derham.derham-varietes }
      - { nom: Partitions de l'unité, ancre: geod.gd-partition }

  - date: "2026-11-02"
    rubrique: edifice
    titre: L'exponentielle et la trigonométrie dès l'analyse réelle
    texte: |
      Deux chapitres nouveaux de l'analyse réelle construisent le logarithme comme une intégrale, l'exponentielle comme sa réciproque, puis l'arc tangente, le nombre $\pi$, le cosinus et le sinus, sans séries entières. L'analyse complexe prolonge désormais ces fonctions au lieu de les définir, et les probabilités n'en dépendent plus.
    liens:
      - { nom: Exponentielle et logarithme, ancre: analyse-reelle.ar-exp }
      - { nom: Fonctions trigonométriques, ancre: analyse-reelle.ar-trigo }

  - date: "2026-11-02"
    rubrique: cours
    titre: "MPSI : limites et continuité, dérivabilité et convexité, analyse asymptotique, avec leurs exercices"
    texte: |
      Trois nouveaux chapitres de Maths Sup – MPSI sont en ligne : limites et continuité, avec les théorèmes des valeurs intermédiaires, des bornes atteintes et de Heine ; dérivabilité et convexité, de Rolle aux fonctions convexes ; analyse asymptotique et développements limités, jusqu'à la formule de Stirling. Chacun a sa feuille d'exercices corrigés, soit 158 exercices.
    liens:
      - { nom: Limites et continuité, ancre: cours/ma-08 }
      - { nom: Dérivabilité et convexité, ancre: cours/ma-09 }
      - { nom: Analyse asymptotique, ancre: cours/ma-10 }
    couvre: [f-ma-08, f-ma-09, f-ma-10]

  - date: "2026-11-01"
    rubrique: cours
    titre: Le niveau Maths Sup – MPSI s'ouvre avec sept chapitres et leurs exercices
    texte: |
      Les sept premiers chapitres du cours de première année sont en ligne, de la logique et des ensembles aux nombres réels et aux suites, en passant par le calcul algébrique, les complexes, les fonctions usuelles et les équations différentielles. Chacun a sa feuille d'exercices corrigés, soit 354 exercices.
    liens:
      - { nom: Le premier chapitre, ancre: cours/ma-01 }
      - { nom: Les exercices du premier chapitre, ancre: exercices/feuille/f-ma-01 }
    couvre: [ma-02, ma-03, ma-04, ma-05, ma-06, ma-07, f-ma-01, f-ma-02, f-ma-03, f-ma-04, f-ma-05, f-ma-06, f-ma-07]

  - date: "2026-11-01"
    rubrique: edifice
    titre: Fondements et portée d'un résultat
    texte: |
      Chaque fiche de l'édifice propose deux boutons : « Fondements » surligne dans le graphe tout ce dont le résultat dépend, de proche en proche jusqu'à la logique, et « Portée » tout ce qui en dépend. Les fiches qui ne sont pas entièrement démontrées sur place portent désormais le signe †, avec un encadré qui dit ce qui est admis et où se trouve la démonstration.
    liens:
      - { nom: Le théorème de Borsuk-Ulam, ancre: hom-cup.cup-borsuk-ulam }
      - { nom: L'édifice, ancre: edifice }

  - date: "2026-10-31"
    rubrique: edifice
    titre: L'état de l'édifice, admis et axiome du choix
    texte: |
      Une page recense désormais tout ce que l'édifice admet, fiche par fiche : les résultats démontrés plus loin dans l'arbre, ceux qui sortent du cadre et les lacunes encore à combler, ainsi que chaque usage de l'axiome du choix. Chaque fiche y déclare ses admis, et la construction du site vérifie qu'aucun n'est oublié ni périmé.
    liens:
      - { nom: État de l'édifice, ancre: edifice/etat }

  - date: "2026-10-31"
    rubrique: cours
    titre: Le niveau Master s'ouvre avec la théorie de Galois
    texte: |
      Premier cours de Master en ligne, « Théorie de Galois », accompagné de sa feuille de 55 exercices. Le cours est rattaché aux théories de l'édifice qui le fondent, des corps aux groupes résolubles.
    liens:
      - { nom: Lire le cours, ancre: cours/m-galois }
      - { nom: La feuille d'exercices, ancre: exercices/feuille/f-m-galois }

  - date: "2026-10-31"
    rubrique: edifice
    titre: Cohomologie, Hurewicz et une nouvelle théorie, la cohomologie des groupes
    texte: |
      L'homologie s'enrichit de la cohomologie singulière et du produit cup, de l'homologie cellulaire, de la formule de Künneth et du théorème de Hurewicz en degré 1. Une théorie nouvelle, la cohomologie des groupes, traite $H^1$, $H^2$, les extensions et le théorème de Schur-Zassenhaus, et la théorie de Galois gagne un chapitre sur Hilbert 90.
    liens:
      - { nom: Cohomologie des groupes, ancre: cohgr }
      - { nom: Homologie singulière, ancre: hom }

  - date: "2026-10-31"
    rubrique: site
    titre: Signaler une erreur en deux gestes
    texte: |
      Un petit drapeau accompagne désormais chaque fiche, chapitre, exercice et sujet d'annales. Il ouvre un message déjà adressé, qui désigne précisément le passage concerné.

  - date: "2026-10-30"
    rubrique: edifice
    titre: Deux théories nouvelles, la calculabilité et les distributions
    texte: |
      La calculabilité (fonctions récursives, machines à registres, problème de l'arrêt, théorème de Rice) mène à une démonstration de l'incomplétude ; « Distributions et EDP » va jusqu'à la solution élémentaire du laplacien et à l'équation de la chaleur. Parmi les chapitres ajoutés le même jour : Seifert-van Kampen, les théorèmes de Jordan, la représentation conforme de Riemann et le théorème de Gauss-Bonnet local.
    liens:
      - { nom: Calculabilité, ancre: calc }
      - { nom: Distributions et EDP, ancre: edp }

  - date: "2026-10-30"
    rubrique: site
    titre: ATLAS s'installe comme une application
    texte: |
      Sur téléphone, le site peut être ajouté à l'écran d'accueil : il s'ouvre alors en plein écran, et les pages déjà consultées restent lisibles hors connexion.

  - date: "2026-10-29"
    rubrique: edifice
    titre: Groupes finis, algèbre commutative, et sept résultats admis désormais démontrés
    texte: |
      Deux théories nouvelles, les groupes finis et l'algèbre commutative, ainsi que la réduction des endomorphismes, le théorème des résidus et le théorème spectral. Sept énoncés jusqu'ici admis sont maintenant démontrés, parmi lesquels le théorème de Tychonov.
    liens:
      - { nom: Groupes finis, ancre: gf }
      - { nom: Algèbre commutative, ancre: ac }

  - date: "2026-10-29"
    rubrique: exercices
    titre: Les feuilles d'exercices dans leur nouvelle présentation
    texte: |
      Les 49 feuilles ont été reconverties depuis leurs sources mises à jour : énoncés, corrigés, PDF et figures suivent désormais la nouvelle mise en page.
    liens:
      - { nom: Toutes les feuilles, ancre: exercices }

  - date: "2026-10-28"
    rubrique: edifice
    titre: Le théorème de complétude démontré, et plus de cent trente schémas
    texte: |
      Le théorème de complétude de Gödel est démontré par la construction de Henkin. Deux théories apparaissent, les espaces métriques et normés et le calcul différentiel, et les fiches s'illustrent de schémas. On peut aussi chercher une notion dans tout l'édifice et zoomer le graphe à deux doigts.
    liens:
      - { nom: Espaces métriques et normés, ancre: met }
      - { nom: Calcul différentiel, ancre: cdiff }

  - date: "2026-10-27"
    rubrique: cours
    titre: Seconde, Première, Maths expertes et Maths approfondies en ligne
    texte: |
      Quatre niveaux rejoignent la Terminale, chacun avec ses cours et ses feuilles d'exercices corrigés, soit plus de mille exercices nouveaux.
    liens:
      - { nom: Les cours, ancre: cours }
      - { nom: Les exercices par niveau, ancre: exercices }

  - date: "2026-10-26"
    rubrique: annales
    titre: Les annales de 2011 à 2026, et leur moteur de recherche par thème
    texte: |
      Les sujets d'écrit des concours d'ingénieurs (X-ENS, Mines-Ponts, Centrale, CCINP, e3a) et de l'enseignement (CAPES, agrégations), avec les rapports de jury. Chaque sujet est décrit partie par partie, et le moteur retrouve ceux qui traitent d'un thème donné.
    liens:
      - { nom: Les annales, ancre: annales }

  - date: "2026-10-25"
    rubrique: cours
    titre: Les premiers cours et exercices de Terminale
    texte: |
      Les chapitres de Terminale paraissent avec leurs feuilles d'exercices corrigés, chaque exercice relié aux notions de l'édifice qu'il met en jeu.
    liens:
      - { nom: Le premier chapitre, ancre: cours/t-01 }
