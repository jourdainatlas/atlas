# Rubrique « Nouveautés » (domaine À propos – Contact).
# Une entrée par nouveauté notable, la plus récente en tête. Champs :
#   date: "AAAA-MM-JJ" (entre guillemets)       rubrique: edifice | cours | exercices | annales | site
#   titre: court            texte: une ou deux phrases rédigées (formules et liens permis)
#   liens: [{nom, ancre}] ancre sans « # » (cours/m-galois, exercices/feuille/f-m-galois, calc…)
#   couvre: [ids]           facultatif : identifiants annoncés que les liens ne nomment pas
#                           (théorie, cours, feuille, session « annales-AAAA »)
#
# RÈGLE (MEMO_atlas.md, section 0, point 8) : toute conversation qui publie un AJOUT COMPLET (nouveau
# chapitre ou niveau de cours, nouvelle feuille, nouvelle théorie ou nouveau chapitre de l'édifice,
# nouvelle session d'annales, nouvelle fonction du site) ajoute ici, dans la même modification, une entrée
# en tête, rédigée en une ou deux phrases. JAMAIS pour une correction (coquille, calcul, démonstration
# complétée, reformulation, mise en page). En cas de doute, s'abstenir. Une série de chapitres vers un même but
# complète l'entrée existante (texte et liens) au lieu d'en ajouter une. construire.py signale par un
# avertissement toute théorie, tout cours, toute feuille ou toute session nouvelle qui n'est pas annoncée.

intro: |
  Ce qui a été ajouté ou amélioré sur le site, du plus récent au plus ancien. Les nouveautés parues depuis votre dernière visite sont signalées.

entrees:
  - date: "2026-11-11"
    rubrique: site
    titre: "Nouvelle rubrique : Activités"
    texte: |
      Une rubrique d'activités interactives ouvre avec trois pages où l'on manipule avant de lire : la pente d'une courbe en un point, obtenue comme limite de la pente d'une sécante ; la limite d'une suite, jouée contre un adversaire qui choisit la bande de tolérance ; et un atelier de constructions à la règle et au compas, où seule une vraie construction résiste au déplacement des points. Chaque activité renvoie au chapitre de cours et aux fiches de l'édifice qui énoncent et démontrent le résultat.
    liens:
      - {nom: "La pente en un point", ancre: activites/derivee}
      - {nom: "La limite d'une suite", ancre: activites/limite-suite}
      - {nom: "Atelier de construction", ancre: activites/atelier}
