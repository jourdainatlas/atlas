    texte: |
      Chaque cours, chaque feuille et chacun des 2 129 exercices a désormais sa page à une adresse propre, lisible sans ouvrir l'atlas interactif et trouvable par les moteurs de recherche : énoncé composé, corrigé replié, PDF, notions de l'édifice en liens. Le bouton « Partager » d'un cours, d'une feuille ou d'un exercice copie l'adresse de cette page.
    liens:
      - { nom: Les cours, ancre: cours }
      - { nom: Les exercices, ancre: exercices }

  - date: "2026-11-03"
    rubrique: edifice
    titre: Le premier théorème d'incomplétude entièrement démontré
    texte: |
      Un chapitre nouveau de la calculabilité établit, dans le système formel de l'atlas, les calculs dans l'arithmétique de Robinson, la $\Sigma_1$-complétude et la représentation des relations récursives, puis le théorème de Gödel-Rosser : une théorie cohérente, récursivement axiomatisable, qui démontre les axiomes de Robinson est incomplète.
    liens:
      - { nom: Représentation et Gödel-Rosser, ancre: calc.cal-representation }
      - { nom: Théorème de Gödel-Rosser, ancre: cal-representation.cal-rp-godel-rosser }

  - date: "2026-11-03"
    rubrique: edifice
    titre: La formule de Stokes sur les variétés à bord
    texte: |
      Un chapitre nouveau de la théorie de de Rham démontre le changement de variables pour l'intégrale de Riemann, définit les variétés à bord, leur orientation induite et l'intégrale d'une forme de degré maximal, puis établit la formule de Stokes $\int_M \mathrm d\omega = \int_{\partial M} \omega$, sans axiome du choix. La géométrie différentielle construit désormais les partitions de l'unité et les formes volume sur une variété.
    liens:
      - { nom: Variétés à bord et Stokes, ancre: derham.derham-varietes }
      - { nom: Partitions de l'unité, ancre: geod.gd-partition }

  - date: "2026-11-02"
    rubrique: edifice
    titre: L'exponentielle et la trigonométrie dès l'analyse réelle
    texte: |
      Deux chapitres nouveaux de l'analyse réelle construisent le logarithme comme une intégrale, l'exponentielle comme sa réciproque, puis l'arc tangente, le nombre $\pi$, le cosinus et le sinus, sans séries entières. L'analyse complexe prolonge désormais ces fonctions au lieu de les définir, et les probabilités n'en dépendent plus.
    liens:
      - { nom: Exponentielle et logarithme, ancre: analyse-reelle.ar-exp }
      - { nom: Fonctions trigonométriques, ancre: analyse-reelle.ar-trigo }

  - date: "2026-11-02"
