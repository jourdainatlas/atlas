    texte: |
      Trois nouveaux chapitres de Maths Sup – MPSI sont en ligne : limites et continuité, avec les théorèmes des valeurs intermédiaires, des bornes atteintes et de Heine ; dérivabilité et convexité, de Rolle aux fonctions convexes ; analyse asymptotique et développements limités, jusqu'à la formule de Stirling. Chacun a sa feuille d'exercices corrigés, soit 158 exercices.
    liens:
      - { nom: Limites et continuité, ancre: cours/ma-08 }
      - { nom: Dérivabilité et convexité, ancre: cours/ma-09 }
      - { nom: Analyse asymptotique, ancre: cours/ma-10 }
    couvre: [f-ma-08, f-ma-09, f-ma-10]

