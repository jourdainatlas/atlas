- sujet: https://www.concours-centrale-supelec.fr/sites/default/files/documents/M062.pdf
  nom: Irrationalité de ζ(2)
  apercu: Le sujet démontre l'irrationalité de ζ(2) par la méthode de Beukers. Il encadre d'abord la fonction de comptage des nombres premiers à l'aide des coefficients binomiaux centraux, en déduit que
    le PPCM des entiers de 1 à n est au plus 3^n à partir d'un certain rang, grâce au théorème des nombres premiers (admis), établit un critère d'irrationalité par approximation rationnelle, puis exprime
    des intégrales doubles comme combinaisons de ζ(2) et de rationnels de dénominateur contrôlé. Il conclut sur l'irrationalité de ζ(2), puis de π.
