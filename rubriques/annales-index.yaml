  nom: Matrices d'ordre fini et sous-groupes finis de GL₂
  apercu: Le sujet étudie les matrices A vérifiant A^n = I sur C, R et Q. Il établit la décomposition de X^n − 1 en polynômes cyclotomiques et la décomposition de Frobenius des endomorphismes à polynôme
    minimal sans facteur carré, puis en déduit les formes réduites des matrices d'ordre fini, la classification des sous-groupes finis de GL₂(R) (cycliques ou diédraux) et de GL₂(Q). Il se termine par le
    dénombrement des matrices de chaque ordre dans GL₂(Z/3Z).
