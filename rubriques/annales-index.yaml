  nom: Étude d'un modèle probabiliste de ferromagnétisme
  apercu: Le sujet étudie des modèles de spins (Curie-Weiss, Ising) où la loi des configurations est proportionnelle à l'exponentielle d'une énergie. La première partie détermine le spectre de plusieurs
    matrices d'interaction (matrice de rang un, matrice sinus orthogonale, matrices circulantes, produit de Kronecker). La seconde calcule la pression limite par matrice de transfert pour le modèle d'Ising,
    puis par méthode de Laplace pour le modèle de Curie-Weiss, montre l'apparition d'une aimantation spontanée pour β > 1 et établit une convergence en loi au point critique.
