- sujet: https://www.vmaths.fr/wp-content/uploads/XENS/MP/X_ENS_2025_MP_MC_enonce.pdf
  nom: Fonctions d'un grand nombre de variables aléatoires
  apercu: Le sujet estime la taille d'une somme de variables aléatoires bornées centrées sous des hypothèses de dépendance de plus en plus fortes (décorrélation, k-indépendance, indépendance), jusqu'à une
    borne sous-gaussienne obtenue par la méthode des moments. Il démontre ensuite l'inégalité de concentration de Talagrand pour les fonctions convexes lipschitziennes d'un vecteur de variables indépendantes,
    par récurrence sur la dimension et à l'aide d'enveloppes convexes.
