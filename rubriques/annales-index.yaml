  nom: Un principe d'incertitude matriciel
  apercu: Après avoir établi le cas d'égalité de l'inégalité d'Heisenberg pour les gaussiennes via leur transformée de Fourier, le sujet en construit un analogue discret à partir du laplacien d'un graphe.
    Il montre que le laplacien est symétrique positif, de noyau engendré par le vecteur constant pour un graphe connexe, puis étudie pour le graphe étoile la région de faisabilité des couples (étalement
    spectral, étalement spatial) et calcule explicitement la courbe d'incertitude.
