- sujet: documents/annales/2025/mines-ponts/Maths-PSI-2.pdf
  nom: Modèle SIR pour la propagation d'épidémie et séries de Dirichlet
  apercu: Le sujet étudie l'équation différentielle non linéaire y' + y + 1 = exp(y)/2 qui décrit un modèle épidémique SIR. Après une linéarisation, il cherche la solution sous forme de série de Dirichlet
    (somme de a_n exp(-λ_n x)), établit la convergence uniforme et la régularité de telles séries, obtient des relations de récurrence sur les moments b_k = Σ λ_nᵏ a_n et une méthode d'approximation par
    troncature via un système de Vandermonde. Il relie enfin l'équation au système SIR et étudie une version probabiliste discrète de l'épidémie.
  pages: 9
