- sujet: documents/annales/2025/mines-ponts/Maths-PC-2.pdf
  nom: Étude des séries congruo-harmoniques alternées
  apercu: Le sujet étudie les séries alternées de terme général (-1)^k/(pk+q). Il les exprime comme l'intégrale de t^(q-1)/(1+t^p) sur [0, 1], calcule leur somme explicitement dans trois familles de cas
    grâce à une décomposition en éléments simples faisant intervenir les racines de -1, puis évalue la probabilité qu'un couple d'entiers tiré au hasard relève de ces cas, et termine par la vitesse de convergence
    des sommes partielles.
