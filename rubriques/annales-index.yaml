- sujet: https://www.vmaths.fr/wp-content/uploads/XENS/MP/X_ENS_2025_MP_MD_enonce.pdf
  nom: Points entiers dans les polytopes
  apercu: Le problème démontre le théorème de Brion, généralisation en dimension quelconque de la formule de la somme géométrique, qui exprime la série des points entiers d'un polytope rationnel comme somme
    des séries associées aux cônes de ses sommets. Il passe par les fonctions quasi-polynomiales, la caractéristique d'Euler des polytopes, les triangulations et le polytope de Birkhoff, et en déduit le
    théorème d'Ehrhart sur le dénombrement des points entiers des dilatés d'un polytope.
  pages: 9
