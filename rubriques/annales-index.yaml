  nom: Réduction de Jordan des nilpotents et classification de couples de matrices
  apercu: Le sujet démontre que toute matrice nilpotente est semblable à une matrice diagonale par blocs de Jordan, en passant par l'endomorphisme « multiplication par X » sur un espace de polynômes de
    Laurent. Il en déduit une version « graduée » en présence d'un endomorphisme diagonalisable d'ordre fini, puis classe les couples de matrices rectangulaires (A, B) à équivalence simultanée près.
  pages: 7
