  apercu: Pour un polynôme réel scindé p, le sujet construit la matrice symétrique J(p) à l'aide de la matrice de décalage et du polynôme réciproque, et montre que le nombre de racines de p dans ]-1, 1[
    égale le nombre de valeurs propres strictement positives de J(p) lorsque celle-ci est inversible (critère de Schur-Cohn). Il caractérise l'inversibilité par l'absence de racines « stables » et propose
    une méthode générale de comptage dans le cas non inversible, par passage au polynôme dérivé et argument de continuité des valeurs propres.
  pages: 7
