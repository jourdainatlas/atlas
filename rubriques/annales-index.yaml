  nom: Interpolation d'Hermite, polynômes orthogonaux et fonctions de type positif
  apercu: Le problème étudie l'interpolation d'Hermite d'une fonction de classe C∞ et le reste associé, puis des familles de polynômes orthogonaux pour un poids sur [−1, 1] (formule de quadrature de Gauss,
    entrelacement des racines). Il construit les polynômes de Gegenbauer par une fonction génératrice et conclut sur les fonctions de type positif sur la sphère, via le produit de Hadamard de matrices symétriques
    positives.
