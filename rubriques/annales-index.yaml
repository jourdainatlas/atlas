  nom: Opérateur d'intégration, intégrales fractionnaires et opérateurs de Hilbert-Schmidt
  apercu: 'Le sujet étudie l''opérateur de Volterra f ↦ ∫₀ˣ f sur C([0,1]) puis sur L²(0,1) : continuité, valeurs propres, compacité, calcul exact de sa norme grâce à une base hilbertienne de cosinus. Il
    introduit ensuite le semi-groupe des intégrales fractionnaires V_s, montre qu''elles sont compactes, obtient par intégration sur un contour complexe un équivalent asymptotique qui montre que V_s n''est
    de Hilbert-Schmidt que si s > 1/2 (la réciproque venant du critère du noyau L²), et établit que V_s est somme d''une série absolument convergente d''opérateurs de rang 1 si et seulement si s > 1.'
  pages: 12
