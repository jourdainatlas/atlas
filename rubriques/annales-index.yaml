  nom: Corps différentiels et théorème de Liouville sur les primitives élémentaires
  apercu: 'Après une étude des extensions de corps (éléments algébriques, polynôme minimal, trace et norme via la matrice compagnon), le sujet introduit les dérivations sur un corps et leur prolongement
    aux extensions finies. Il démontre ensuite le théorème de Liouville : une fonction admettant une primitive élémentaire est une somme de Liouville, ce qui prouve que des fonctions comme e^{T^n} ou e^T/T
    n''ont pas de primitive élémentaire.'
