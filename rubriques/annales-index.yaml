- sujet: documents/annales/2025/mines-ponts/Maths-PC-1.pdf
  nom: Matrices semblables à leur inverse
  apercu: Le sujet étudie les matrices complexes inversibles semblables à leur inverse. Il montre d'abord que leur polynôme caractéristique est réciproque ou antiréciproque, ce qui caractérise ces matrices
    dans le cas diagonalisable mais pas en général. Il prouve ensuite, à l'aide des blocs de Jordan et d'opérateurs sur les polynômes, qu'une matrice est semblable à son inverse si et seulement si elle
    est produit de deux matrices de symétrie.
