- sujet: https://www.concours-centrale-supelec.fr/sites/default/files/documents/M074.pdf
  nom: 'Approximation trigonométrique : théorèmes de Jackson et de Bernstein'
  apercu: Le sujet étudie l'approximation uniforme des fonctions continues 2π-périodiques par des polynômes trigonométriques. À l'aide du module de continuité et d'un noyau de type Jackson, il prouve la
    convergence uniforme et une vitesse en ω(1/n). Il établit ensuite l'inégalité de Bernstein sur la dérivée d'un polynôme via la décomposition en éléments simples, et en déduit qu'une fonction est α-höldérienne
    si et seulement si sa distance aux polynômes trigonométriques de degré n est un O(1/n^α).
