  nom: Inégalités de Khintchine
  apercu: Le sujet établit, pour une somme de variables de Rademacher indépendantes, l'inégalité de déviation de Hoeffding puis les inégalités de Khintchine, qui comparent les moments d'ordre p à la norme
    quadratique des coefficients. Il en déduit que toutes les normes Lp sont équivalentes sur l'espace engendré par ces variables, et construit un sous-espace de dimension k de R^(2^k) sur lequel les normes
    1 et 2 sont proportionnelles à constantes près.
