  nom: Perturbations de rang 1 de matrices
  apercu: Le sujet étudie les matrices de rang 1, puis l'effet d'une perturbation de rang 1 sur le déterminant et l'inverse d'une matrice (lemme du déterminant matriciel, formule de Sherman-Morrison). Pour
