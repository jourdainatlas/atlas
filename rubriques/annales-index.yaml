  nom: Attribution d'une valeur à des séries divergentes
  apercu: 'Le sujet justifie de plusieurs manières la valeur −1/12 attribuée à la série divergente 1 + 2 + 3 + ⋯ : par le développement asymptotique de la somme de n e^{−nx}, puis par une régularisation
    à l''aide d''une fonction à support compact et des sommes de Riemann. Il établit la formule d''Euler-Maclaurin avec les polynômes de Bernoulli, définit la somme de Ramanujan d''une série, et généralise
    enfin la formule de Taylor à des familles de polynômes d''Appell (Bernoulli, Euler) jusqu''à la formule d''Euler-Boole.'
