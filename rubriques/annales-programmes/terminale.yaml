- intitule: Probabilités
  objectif: "On diversifie et on approfondit les modèles probabilistes en exploitant des situations où interviennent les probabilités conditionnelles, l'indépendance, les variables aléatoires ; un axe majeur\
    \ est l'étude de la succession d'un nombre quelconque d'épreuves aléatoires indépendantes, le schéma de Bernoulli étant fondamental. La linéarité de l'espérance et l'additivité de la variance pour les\
    \ variables indépendantes sont étudiées ; l'inégalité de Bienaymé-Tchebychev explicite le rôle de la variance comme indicateur de dispersion, et tous ces outils se conjuguent pour établir l'inégalité\
    \ de concentration pour la moyenne d'un échantillon, qui justifie le facteur $1/\\sqrt{n}$ en théorie de l'estimation, et aboutir à la loi des grands nombres. Exemples d'algorithmes : simulation de\
    \ la planche de Galton, problème de la surréservation, simulation d'échantillons et d'une marche aléatoire, comparaison avec l'inégalité de Bienaymé-Tchebychev."
  hors_programme:
  - "Les variables indépendantes sont toujours envisagées dans le cadre de la succession d'épreuves indépendantes ; toute question visant à justifier l'indépendance de variables aléatoires données a priori\
    \ est en dehors des objectifs du programme."
  - "La relation $E(XY) = E(X)E(Y)$ pour des variables indépendantes n'est pas un attendu du programme."
  blocs:
  - intitule: "Succession d'épreuves indépendantes, schéma de Bernoulli"
    points:
    - contenu: "Modèle de la succession d'épreuves indépendantes : la probabilité d'une issue $(x_1,\\dots,x_n)$ est égale au produit des probabilités des composantes $x_i$. Représentation par un produit\
        \ cartésien, par un arbre."
      precisions: "Modéliser une situation par une succession d'épreuves indépendantes, ou une succession de deux ou trois épreuves quelconques. Représenter la situation par un arbre. Calculer une probabilité\
        \ en utilisant l'indépendance, des probabilités conditionnelles, la formule des probabilités totales."
      cours:
      - "t-02:2"
      - "t-02:3"
      ex:
      - t-02-04
      - t-02-10
      - t-02-27
      - t-02-29
      - t-02-40
      themes:
      - ly-proba-cond
    - contenu: Épreuve de Bernoulli, loi de Bernoulli.
      cours:
      - "t-02:3"
      ex:
      - t-02-12
      - t-10-03
      themes:
