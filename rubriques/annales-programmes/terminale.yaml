    - contenu: "Schéma de Bernoulli : répétition de $n$ épreuves de Bernoulli indépendantes."
      precisions: "L'univers est formalisé par $\\{0,1\\}^n$ (ou $\\{a,b\\}^n$). Modéliser une situation par un schéma de Bernoulli, par une loi binomiale."
      cours:
