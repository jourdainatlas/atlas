      - ly-esperance-variance
      note: "Le cours admet E(X) = np et V(X) = np(1-p) (Terminale, ch. 2, section 3, proposition 6), en esquissant seulement l'argument pour l'espérance : il n'y a donc pas de renvoi au cours. Les exercices\
        \ exercice 2.34 (Terminale) (calcul direct de l'espérance) et 10.3 (Terminale) (somme de variables de Bernoulli indépendantes) en tiennent lieu."
  - intitule: Concentration, loi des grands nombres
    points:
    - contenu: "Inégalité de Bienaymé-Tchebychev. Pour une variable aléatoire $X$ d'espérance $\\mu$ et de variance $V$, et quel que soit le réel strictement positif $\\delta$ : $P(|X - \\mu| \\geqslant\
        \ \\delta) \\leqslant \\dfrac{V(X)}{\\delta^2}$."
      precisions: "Appliquer l'inégalité de Bienaymé-Tchebychev pour définir une taille d'échantillon, en fonction de la précision et du risque choisi."
      cours:
      - "t-10:4"
      ex:
      - t-10-14
      - t-10-15
      - t-10-16
      - t-10-18
      - t-10-17
      - t-10-20
      themes:
      - ly-bienayme
    - contenu: "Inégalité de concentration. Si $M_n$ est la variable aléatoire moyenne d'un échantillon de taille $n$ d'une variable aléatoire d'espérance $\\mu$ et de variance $V$, alors pour tout $\\\
        delta > 0$, $P(|M_n - \\mu| \\geqslant \\delta) \\leqslant \\dfrac{V}{n\\delta^2}$."
      cours:
      - "t-10:5"
      ex:
      - t-10-21
      - t-10-22
      - t-10-23
      - t-10-24
      - t-10-25
      - t-10-26
      themes:
      - ly-bienayme
    - contenu: Loi des grands nombres.
      cours:
      - "t-10:6"
      ex:
      - t-10-27
      - t-10-28
      - t-10-29
      - t-10-30
      themes:
      - ly-bienayme
- intitule: Algorithmique et programmation
  objectif: "Le programme reprend les programmes de seconde et de première sans introduire de notion nouvelle, afin de consolider le travail des classes précédentes (variable, type, affectation, instruction\
    \ conditionnelle, boucle, fonction informatique, liste). Les algorithmes peuvent être écrits en langage naturel, avec le symbole « ← » pour l'affectation, ou en langage Python ; l'accent est mis sur\
    \ la programmation modulaire, et l'algorithmique trouve sa place dans toutes les parties du programme."
  hors_programme:
  - "Afin d'éviter des confusions, on se limite aux listes sans présenter d'autres types de collections."
  blocs:
  - intitule: Notion de liste
    points:
    - contenu: Générer une liste (en extension, par ajouts successifs ou en compréhension).
      precisions: "La génération des listes en compréhension et en extension est mise en lien avec la notion d'ensemble ; les conditions apparaissant dans les listes définies en compréhension permettent\
        \ de travailler la logique."
      cours:
      - "py-01:7"
      ex:
      - py-01-28
      - py-01-29
      - py-01-33
      themes:
      - ly-algo
    - contenu: "Manipuler des éléments d'une liste (ajouter, supprimer…) et leurs indices."
      cours:
      - "py-01:7"
      ex:
      - py-01-28
      - py-01-31
      - py-01-33
      - py-01-43
      themes:
      - ly-algo
      note: "Le cours traite l'accès par indice, la modification et l'ajout (append), mais pas la suppression d'un élément."
    - contenu: Parcourir une liste.
      cours:
      - "py-01:7"
      - "py-01:8"
      ex:
      - py-01-30
      - py-01-32
      - py-01-34
      - py-01-37
      themes:
      - ly-algo
    - contenu: "Itérer sur les éléments d'une liste."
      cours:
      - "py-01:7"
      ex:
      - py-01-30
      - py-01-32
      - py-01-33
      themes:
      - ly-algo
- intitule: Vocabulaire ensembliste et logique
  objectif: "L'apprentissage des notations mathématiques et de la logique est transversal à tous les chapitres du programme : on y travaille d'abord dans des contextes où ils se présentent naturellement,\
    \ puis on prévoit des temps où les concepts et types de raisonnement sont étudiés, après avoir été rencontrés plusieurs fois en situation."
  hors_programme:
  - "La manipulation du symbole de somme pour démontrer des égalités n'est pas un objectif du programme."
  - Les symboles $\forall$ et $\exists$ ne sont pas exigibles.
  blocs:
  - points:
    - contenu: "Élément d'un ensemble, sous-ensemble, appartenance et inclusion, réunion, intersection et complémentaire ; symboles $\\in$, $\\subset$, $\\cap$, $\\cup$ ; notation des ensembles de nombres\
        \ et des intervalles."
      precisions: "Pour le complémentaire d'un sous-ensemble $A$ de $E$, on utilise la notation des probabilités $\\overline{A}$, ou la notation $E \\setminus A$."
      cours:
      - "s-01:3"
      - "s-01:4"
      - "s-03:2"
      ex:
      - s-01-25
      - s-01-33
      - s-03-02
      - s-01-34
      - t-07-03
      note: "Rappels de Seconde : ensembles de nombres, intervalles, réunion et intersection (Seconde, ch. 1), complémentaire noté comme un événement contraire (Seconde, ch. 3)."
    - contenu: Couple, triplet et plus généralement $n$-uplet ; produit cartésien.
      cours:
      - "t-07:2"
      ex:
      - t-07-07
      - t-07-04
      - t-07-05
      note: "Le cours définit les p-uplets d'un ensemble fini, mais pas le produit cartésien de plusieurs ensembles en tant que tel."
    - contenu: "Notion de fonction, mise en évidence dans les diverses parties du programme : fonctions d'une variable réelle, suites, variables aléatoires, exemples en géométrie."
      cours:
      - "s-07:2"
      - "t-02:2"
      note: Rappel de Seconde (notion de fonction) ; en Terminale, la variable aléatoire est présentée comme une fonction en Terminale, ch. 2, section 2.
    - contenu: "Notion de bijection, rencontrée en analyse, en géométrie (notamment bijection entre le plan et $\\mathbb{R}^2$, l'espace et $\\mathbb{R}^3$), en dénombrement."
      cours:
      - "t-03:4"
      note: "La bijection n'apparaît qu'à travers le corollaire du théorème des valeurs intermédiaires (théorème de la bijection)."
    - contenu: "Composition de deux fonctions, utilisée principalement dans le cadre des fonctions d'une variable réelle."
      cours:
      - "t-03:3"
      ex:
      - t-03-16
      - t-09-12
    - contenu: Symbole de somme, introduit et utilisé pour écrire certaines expressions de façon concise.
      precisions: "La manipulation de ce symbole pour démontrer des égalités n'est pas un objectif du programme."
      ex:
      - p-sa-02
      - p-sg-02
      note: "Le symbole Σ n'est présenté dans aucun cours (il est employé en Terminale, ch. 2, section 2 pour l'espérance) ; les exercices de Première 2 (Sommes de termes d'une suite arithmétique) et 2\
        \ (Sommes de termes d'une suite géométrique) font calculer des sommes écrites avec ce symbole."
    - contenu: "Reconnaître ce qu'est une proposition mathématique, utiliser des variables pour écrire des propositions mathématiques."
      precisions: Les élèves apprennent ces points en situation.
    - contenu: Lire et écrire des propositions contenant les connecteurs « et », « ou ».
      cours:
      - "py-01:3"
      - "s-01:4"
      ex:
      - s-01-32
      - py-01-11
      - py-01-15
      note: "Les connecteurs « et », « ou » sont présentés à travers les booléens de Python (table de vérité, « ou » inclusif) et, en Seconde, à propos de l'intersection et de la réunion d'intervalles."
    - contenu: Formuler la négation de propositions simples, pouvant contenir un ou deux quantificateurs.
      cours:
      - "py-01:3"
      note: "Seule la négation d'une conjonction (lois de De Morgan) est vue, à propos des booléens de Python ; rien sur la négation d'une proposition quantifiée."
    - contenu: "Mobiliser un contre-exemple pour montrer qu'une proposition est fausse."
      ex:
      - t-03-22
      - t-04-31
      - t-05-24
      - t-07-24
      note: "Pas de cours de logique : ces exercices « vrai ou faux » demandent un contre-exemple pour chaque affirmation fausse."
    - contenu: Formuler une implication, une équivalence logique, et les mobiliser dans un raisonnement simple.
    - contenu: "Formuler la réciproque d'une implication, ou sa contraposée."
      ex:
      - t-03-22
      - me-04-24
      note: "Pas de cours de logique (le cours Terminale, ch. 3, section 4 signale seulement en remarque que la réciproque de « dérivable implique continue » est fausse) : l'exercice 3.22 (Terminale) confronte\
        \ cette implication à sa réciproque, exercice 4.24 (Maths expertes) montre que la réciproque du petit théorème de Fermat est fausse."
    - contenu: Lire et écrire des propositions contenant une quantification universelle ou existentielle.
      precisions: Les symboles $\forall$ et $\exists$ ne sont pas exigibles.
    - contenu: "Raisonner par disjonctions des cas, par l'absurde, par contraposée."
      ex:
      - s-01-29
      - me-03-22
      - me-01-27
      note: "Pas de cours de logique : l'exercice 1.29 (Seconde), exercice 3.22 (Maths expertes) et 1.27 (Maths expertes) (question 4) font raisonner par l'absurde, exercice 1.27 (Maths expertes) (question\
        \ 1) par disjonction des cas selon le reste modulo 6 ; rien de spécifique sur la contraposée."
    - contenu: Raisonner par équivalence, utiliser une propriété caractéristique.
      ex:
      - t-04-32
      - t-08-28
      note: "Pas de cours de logique : ces exercices font établir une caractérisation par équivalences (équation d'une sphère, solutions d'une équation différentielle)."
    - contenu: Distinguer condition nécessaire et condition suffisante.
    - contenu: Démontrer une propriété par récurrence.
      cours:
      - "t-01:2"
      ex:
      - t-01-01
      - t-01-02
      - t-01-08
      - t-01-10
      - t-01-14
      - t-01-17
      themes:
      - ly-recurrence
