      precisions: "Calculer la dérivée d'une fonction donnée par une formule simple mettant en jeu opérations algébriques et composition. Calculer la fonction dérivée, déterminer les limites et étudier\
        \ les variations d'une fonction construite simplement à partir des fonctions de référence."
