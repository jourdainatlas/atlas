# Programme officiel « Programme de l'enseignement de spécialité de mathématiques de Terminale » (Bulletin officiel spécial n° 8 du 25 juillet 2019, arrêté du 19 juillet 2019 (NOR MENE1921246A), annexe ; en vigueur depuis la rentrée 2020, et encore en terminale en 2026-2027, donc pour la session 2027 du baccalauréat. Son annexe est remplacée par celle de l'arrêté du 26 février 2026 (BO n° 14 du 2 avril 2026, NOR MENE2602919A), applicable à la rentrée 2027-2028 seulement.), structuré pour la vue « Programme »
# des Annales (MEMO_atlas_annales.md §45). Liens : cours « chapitre:section » (rang du sommaire, à partir de 1),
# exercices, thèmes d'annales ; un point sans cours ni exercice est affiché « à venir ».
id: terminale
intitule: "Programme de l'enseignement de spécialité de mathématiques de Terminale"
source:
  nom: "Bulletin officiel spécial n° 8 du 25 juillet 2019, arrêté du 19 juillet 2019 (NOR MENE1921246A), annexe ; en vigueur depuis la rentrée 2020, et encore en terminale en 2026-2027, donc pour la session\
    \ 2027 du baccalauréat. Son annexe est remplacée par celle de l'arrêté du 26 février 2026 (BO n° 14 du 2 avril 2026, NOR MENE2602919A), applicable à la rentrée 2027-2028 seulement."
  url: "https://cache.media.education.gouv.fr/file/SPE8_MENJ_25_7_2019/90/7/spe246_annexe_1158907.pdf"
preambule: "Le programme s'organise en quatre grandes parties, « Algèbre et géométrie », « Analyse », « Probabilités » et « Algorithmique et programmation », complétées par un texte transversal « Vocabulaire\
  \ ensembliste et logique » ; ce découpage n'est pas un plan de cours. Chaque section énumère des contenus, des capacités attendues et quelques démonstrations exemplaires ; les approfondissements proposés\
  \ ne sont en aucun cas obligatoires et offrent des pistes pour l'épreuve orale terminale. L'épreuve écrite porte sur le programme de l'enseignement de spécialité de terminale en vigueur, les notions du\
  \ programme de première en vigueur pouvant être mobilisées : règle fixée à compter de la session 2024 par la note de service du 26 septembre 2023 (BO n° 36 du 28 septembre 2023, NOR MENE2323020N) et reprise\
  \ par la note de service du 11 septembre 2026 définissant l'épreuve (BO spécial n° 4 du 17 septembre 2026, NOR MENE2622642N)."
sections:
- intitule: Algèbre et géométrie
  objectif: "La partie commence par la combinatoire et le dénombrement : manipuler les notions ensemblistes de produit cartésien, de couple, de liste ou k-uplet, et dénombrer quelques objets combinatoires\
    \ de base (listes, combinaisons, permutations), ce qui offre une initiation aux mathématiques discrètes et l'occasion de travailler le raisonnement par récurrence. L'étude de la géométrie dans l'espace\
    \ est ensuite l'occasion de travailler les notions vectorielles afin de préparer l'étude de l'algèbre linéaire dans l'enseignement supérieur. Exemples d'algorithmes : génération des coefficients $\\\
    binom{n}{k}$ par la relation de Pascal, génération des permutations ou des parties à 2, 3 éléments d'un ensemble fini."
  hors_programme:
  - "L'étude générale des systèmes linéaires n'est pas un objectif du programme mais des exemples seront traités dans le contexte de la géométrie repérée."
  blocs:
  - intitule: Combinatoire et dénombrement
    points:
    - contenu: "Couple, triplet, $k$-uplet (ou $k$-liste) ; produit cartésien de deux, trois, $k$ ensembles ; ensemble $A^k$ des $k$-uplets d'éléments d'un ensemble $A$."
      precisions: "Les ensembles considérés dans cette section sont finis, mais ces notions sont introduites dans le cas général (ensembles quelconques). Dans le cadre d'un problème de dénombrement, utiliser\
        \ une représentation adaptée (ensembles, arbres, tableaux, diagrammes) et reconnaître les objets à dénombrer."
      cours:
      - "t-07:2"
      ex:
      - t-07-07
      - t-07-04
      - t-07-05
      themes:
      - ly-denombrement
      note: "Le cours définit les p-uplets d'un ensemble fini, mais pas le produit cartésien de plusieurs ensembles en tant que tel."
    - contenu: "Principe additif : nombre d'éléments d'une réunion d'ensembles deux à deux disjoints."
      cours:
      - "t-07:2"
      ex:
      - t-07-02
      - t-07-03
      - t-07-06
      - t-07-08
      themes:
      - ly-denombrement
    - contenu: "Principe multiplicatif : nombre d'éléments d'un produit cartésien. Nombre de $k$-uplets (ou $k$-listes) d'un ensemble à $n$ éléments."
      precisions: Effectuer des dénombrements simples dans des situations issues de divers domaines scientifiques (informatique, génétique, théorie des jeux, probabilités, etc.).
      cours:
      - "t-07:2"
      ex:
      - t-07-04
      - t-07-05
      - t-07-07
      - t-07-06
      - t-07-08
      - t-07-26
      themes:
      - ly-denombrement
    - contenu: "Nombre des parties d'un ensemble à $n$ éléments. Lien avec les $n$-uplets de $\\{0,1\\}$, les mots de longueur $n$ sur un alphabet à deux éléments, les chemins dans un arbre, les issues\
        \ dans une succession de $n$ épreuves de Bernoulli."
      ex:
      - t-07-29
      - t-07-32
      themes:
      - ly-denombrement
      note: "Le nombre 2^n des parties d'un ensemble à n éléments n'est établi que dans l'exercice 7.29 (Terminale) ; le cours ne l'énonce pas."
    - contenu: "Nombre des $k$-uplets d'éléments distincts d'un ensemble à $n$ éléments. Définition de $n!$. Nombre de permutations d'un ensemble fini à $n$ éléments."
      cours:
      - "t-07:3"
      ex:
      - t-07-10
      - t-07-11
      - t-07-13
      - t-07-14
      - t-07-12
      - t-07-15
      themes:
      - ly-denombrement
    - contenu: "Combinaisons de $k$ éléments d'un ensemble à $n$ éléments : parties à $k$ éléments de l'ensemble. Représentation en termes de mots ou de chemins."
      cours:
      - "t-07:3"
      - "t-02:3"
      ex:
      - t-07-17
      - t-02-16
      - t-07-18
      - t-07-21
      - t-07-30
      themes:
      - ly-denombrement
      - ly-loi-binomiale
    - contenu: "Pour $0 \\leqslant k \\leqslant n$, formules : $\\binom{n}{k} = \\dfrac{n(n-1)\\cdots(n-k+1)}{k!} = \\dfrac{n!}{k!\\,(n-k)!}$."
      cours:
      - "t-07:3"
      ex:
      - t-07-16
      - t-02-15
      - t-07-20
      - t-07-28
      themes:
      - ly-denombrement
    - contenu: Explicitation pour $k = 0, 1, 2$. Symétrie. Relation et triangle de Pascal.
      cours:
      - "t-07:3"
      - "t-02:3"
      ex:
      - t-02-13
      - t-02-14
      - t-07-19
      - t-02-15
      - t-07-20
      themes:
      - ly-denombrement
    - contenu: "Démonstration : par dénombrement de la relation $\\sum_{k=0}^{n} \\binom{n}{k} = 2^n$."
      demo: exigible
      ex:
      - t-07-29
      themes:
      - ly-denombrement
      note: "La relation est démontrée par dénombrement dans l'exercice 7.29 (Terminale) ; le cours ne la démontre pas (il la vérifie seulement pour n = 3 au chapitre 2)."
    - contenu: "Démonstration : relation de Pascal (par le calcul, par une méthode combinatoire)."
      demo: exigible
      cours:
      - "t-02:3"
      ex:
      - t-07-20
      - t-07-24
      themes:
      - ly-denombrement
      note: "Le chapitre 2 donne la démonstration combinatoire ; la démonstration par le calcul n'est faite que dans l'exercice 7.20 (Terminale) (le chapitre 7 énonce la relation sans la redémontrer)."
  - intitule: "Manipulation des vecteurs, des droites et des plans de l'espace"
    points:
    - contenu: "Vecteurs de l'espace. Translations."
      cours:
      - "t-04:2"
      ex:
      - t-04-02
      - t-04-03
      themes:
      - ly-espace
      note: "Les vecteurs de l'espace sont employés sans définition propre et les translations ne sont pas traitées."
    - contenu: "Combinaisons linéaires de vecteurs de l'espace."
      precisions: Représenter des combinaisons linéaires de vecteurs donnés. Exploiter une figure pour exprimer un vecteur comme combinaison linéaire de vecteurs.
      cours:
      - "t-04:2"
      ex:
      - t-04-02
      - t-04-03
      - t-04-05
      themes:
      - ly-droites-plans
    - contenu: "Droites de l'espace. Vecteurs directeurs d'une droite. Vecteurs colinéaires."
      cours:
      - "t-04:2"
      - "t-04:3"
      ex:
      - t-04-04
      - t-04-18
      - t-04-11
      themes:
      - ly-droites-plans
    - contenu: "Caractérisation d'une droite par un point et un vecteur directeur."
      cours:
      - "t-04:3"
      ex:
      - t-04-16
      - t-04-18
      themes:
      - ly-droites-plans
    - contenu: "Plans de l'espace. Direction d'un plan de l'espace."
      ex:
      - t-04-12
      - t-04-17
      themes:
      - ly-droites-plans
      note: "Le cours emploie les plans et leurs vecteurs directeurs sans définir la direction d'un plan."
    - contenu: "Caractérisation d'un plan de l'espace par un point et un couple de vecteurs non colinéaires."
      precisions: "Décrire la position relative de deux droites, d'une droite et d'un plan, de deux plans. Étudier géométriquement des problèmes simples de configurations dans l'espace (alignement, colinéarité,\
        \ parallélisme, coplanarité)."
      cours:
      - "t-04:2"
      - "t-04:4"
      ex:
      - t-04-05
      - t-04-11
      - t-04-12
      - t-04-20
      - t-04-21
      - t-04-29
      themes:
      - ly-droites-plans
      note: Le cours caractérise la coplanarité de trois vecteurs (u = av + bw) plutôt que le plan défini par un point et deux vecteurs ; les positions relatives sont en Terminale, ch. 4, section 4.
    - contenu: "Bases et repères de l'espace. Décomposition d'un vecteur sur une base."
      precisions: "Lire sur une figure si deux vecteurs d'un plan, trois vecteurs de l'espace, forment une base. Lire sur une figure la décomposition d'un vecteur dans une base."
      cours:
      - "t-04:2"
      ex:
      - t-04-01
      - t-04-02
      - t-04-05
      - t-04-13
      - t-04-31
      themes:
      - ly-espace
      - ly-droites-plans
  - intitule: "Orthogonalité et distances dans l'espace"
    points:
    - contenu: "Produit scalaire de deux vecteurs de l'espace. Bilinéarité, symétrie."
      precisions: "Utiliser le produit scalaire pour démontrer une orthogonalité, pour calculer un angle, une longueur dans l'espace."
      cours:
      - "t-04:2"
      ex:
      - t-04-06
      - t-04-08
      - t-04-10
      - t-04-26
      themes:
      - ly-produit-scalaire
    - contenu: Orthogonalité de deux vecteurs. Caractérisation par le produit scalaire.
      cours:
      - "t-04:2"
      ex:
      - t-04-07
      - t-04-06
      - t-04-10
      themes:
      - ly-produit-scalaire
    - contenu: Base orthonormée, repère orthonormé.
      cours:
      - "t-04:2"
      ex:
      - t-04-01
      - t-04-13
      themes:
      - ly-espace
    - contenu: "Coordonnées d'un vecteur dans une base orthonormée. Expressions du produit scalaire et de la norme. Expression de la distance entre deux points."
      precisions: "Résoudre des problèmes impliquant des grandeurs et mesures : longueur, angle, aire, volume."
      cours:
      - "t-04:2"
      ex:
      - t-04-06
      - t-04-08
      - t-04-26
      - t-04-28
      - t-04-34
      themes:
      - ly-produit-scalaire
      - ly-volumes
    - contenu: "Développement de $\\|\\vec{u} + \\vec{v}\\|^2$, formules de polarisation."
      cours:
      - "t-04:2"
      ex:
      - t-04-09
      - t-04-35
      - t-04-36
      themes:
      - ly-produit-scalaire
    - contenu: "Orthogonalité de deux droites, d'un plan et d'une droite."
      precisions: "Étudier des problèmes de configuration dans l'espace : orthogonalité de deux droites, d'une droite et d'un plan ; lieux géométriques simples, par exemple plan médiateur de deux points."
      ex:
      - t-04-10
      - t-04-14
      - t-04-18
      - t-04-25
      - t-04-31
      themes:
      - ly-produit-scalaire
      note: "L'orthogonalité de deux droites, ou d'une droite et d'un plan, est employée dans les exercices sans être définie dans le cours ; le plan médiateur n'est pas traité."
    - contenu: "Vecteur normal à un plan. Étant donnés un point $A$ et un vecteur non nul $\\vec{n}$, plan passant par $A$ et normal à $\\vec{n}$."
      cours:
      - "t-04:3"
      ex:
      - t-04-14
      - t-04-15
      - t-04-17
      - t-04-25
      - t-04-26
      themes:
      - ly-produit-scalaire
    - contenu: "Projeté orthogonal d'un point sur une droite, sur un plan."
      precisions: "Utiliser la projection orthogonale pour déterminer la distance d'un point à une droite ou à un plan."
      cours:
      - "t-04:5"
      ex:
      - t-04-23
      - t-04-24
      - t-04-25
      - t-04-28
      - t-04-34
      themes:
      - ly-projete-distances
      note: "Seul le projeté orthogonal sur un plan est traité ; le projeté sur une droite ne l'est pas."
    - contenu: "Démonstration : le projeté orthogonal d'un point $M$ sur un plan $\\mathcal{P}$ est le point de $\\mathcal{P}$ le plus proche de $M$."
      demo: exigible
      cours:
      - "t-04:5"
      ex:
      - t-04-35
      themes:
      - ly-projete-distances
      note: "Le cours (Terminale, ch. 4, section 5, théorème 5) démontre la propriété par le théorème de Pythagore ; l'exercice 4.35 (Terminale) (question 3) en donne une autre preuve, par l'inégalité de\
        \ Cauchy-Schwarz, sans passer par le projeté."
  - intitule: Représentations paramétriques et équations cartésiennes
    points:
    - contenu: "Représentation paramétrique d'une droite."
      precisions: "Le repère est supposé orthonormé. Déterminer une représentation paramétrique d'une droite ; reconnaître une droite donnée par une représentation paramétrique. Dans un cadre géométrique\
        \ repéré, traduire par un système d'équations linéaires des problèmes de types suivants : décider si trois vecteurs forment une base, déterminer les coordonnées d'un vecteur dans une base, étudier\
        \ une configuration dans l'espace (alignement, colinéarité, parallélisme, coplanarité, intersection et orthogonalité de droites ou de plans), etc. ; dans des cas simples, résoudre le système obtenu\
        \ et interpréter géométriquement les solutions."
      cours:
      - "t-04:3"
      ex:
      - t-04-16
      - t-04-18
      - t-04-19
      - t-04-21
      - t-04-22
      - t-04-29
      themes:
      - ly-droites-plans
    - contenu: "Équation cartésienne d'un plan."
      precisions: "Déterminer l'équation cartésienne d'un plan dont on connaît un vecteur normal et un point ; reconnaître un plan donné par une équation cartésienne et préciser un vecteur normal à ce plan.\
        \ Déterminer les coordonnées du projeté orthogonal d'un point sur un plan donné par une équation cartésienne, ou sur une droite donnée par un point et un vecteur directeur."
      cours:
      - "t-04:3"
      ex:
      - t-04-14
      - t-04-15
      - t-04-17
      - t-04-26
      - t-04-28
      - t-04-23
      themes:
      - ly-produit-scalaire
      - ly-droites-plans
      - ly-projete-distances
    - contenu: "Démonstration : équation cartésienne du plan normal au vecteur $\\vec{n}$ et passant par le point $A$."
      demo: exigible
      cours:
      - "t-04:3"
      themes:
      - ly-produit-scalaire
- intitule: Analyse
  objectif: "Les buts essentiels sont de donner aux élèves une bonne intuition des notions fondamentales (convergence, limites, dérivées, intégrales) et une solide pratique des calculs afférents ; la notion\
    \ de limite est présentée de manière intuitive, on explicite ensuite les définitions mais la maîtrise complète du formalisme n'est pas un attendu. Le thème des fonctions s'enrichit de la convexité,\
    \ des fonctions trigonométriques, du logarithme, des limites et de la continuité ; le dernier volet porte sur les équations différentielles et le calcul intégral, l'intégrale étant introduite à partir\
    \ de la notion intuitive d'aire. Exemples d'algorithmes : recherche de seuils, valeurs approchées de $\\pi$, $e$, $\\sqrt{2}$, $\\frac{1+\\sqrt{5}}{2}$, $\\ln(2)$, méthodes de dichotomie, de Newton,\
    \ de la sécante, algorithme de Briggs, méthode d'Euler, méthodes des rectangles, des milieux, des trapèzes, méthode de Monte-Carlo, algorithme de Brouncker."
  hors_programme:
  - "La notion de limite est présentée de manière intuitive ; on explicite ensuite les définitions, mais la maîtrise complète du formalisme n'est pas un attendu."
  - "La justification de la continuité ou de la dérivabilité d'une fonction sur un intervalle n'est pas un objectif du programme."
  - "Hormis pour la fonction exponentielle, l'étude de la réciproque d'une fonction continue n'est pas au programme."
  - "Autres exemples d'équations différentielles ($y' = y^2$, $y'' + \\omega^2 y = 0$) : aucune connaissance n'est exigible sur ces exemples."
  blocs:
  - intitule: Suites
    points:
    - contenu: "La suite $(u_n)$ tend vers $+\\infty$ si tout intervalle de la forme $[A;+\\infty[$ contient toutes les valeurs $u_n$ à partir d'un certain rang. Cas des suites croissantes non majorées.\
        \ Suite tendant vers $-\\infty$."
      precisions: "Établir la convergence d'une suite, ou sa divergence vers $+\\infty$ ou $-\\infty$."
      cours:
      - "t-01:3"
      ex:
      - t-01-19
      - t-01-20
      - t-01-25
      themes:
      - ly-limites-suites
    - contenu: "La suite $(u_n)$ converge vers le nombre réel $\\ell$ si tout intervalle ouvert contenant $\\ell$ contient toutes les valeurs $u_n$ à partir d'un certain rang."
      cours:
      - "t-01:3"
      ex:
      - t-01-19
      - t-01-26
      - t-01-20
      - t-01-31
      themes:
      - ly-limites-suites
    - contenu: Limites et comparaison. Théorèmes des gendarmes.
      cours:
      - "t-01:3"
      ex:
      - t-01-21
      themes:
      - ly-limites-suites
    - contenu: Opérations sur les limites.
      cours:
      - "t-01:3"
      ex:
      - t-01-19
      - t-01-20
      - t-01-24
      - t-01-30
      themes:
      - ly-limites-suites
    - contenu: "Comportement d'une suite géométrique $(q^n)$ où $q$ est un nombre réel."
      cours:
      - "t-01:3"
      ex:
      - t-01-19
      - t-01-25
      - t-01-27
      - t-01-30
      themes:
      - ly-limites-suites
      - ly-suites-arith-geom
    - contenu: "Théorème admis : toute suite croissante majorée (ou décroissante minorée) converge."
      precisions: "Raisonner par récurrence pour établir une propriété d'une suite. Étudier des phénomènes d'évolution modélisables par une suite."
      cours:
      - "t-01:3"
      - "t-01:2"
      ex:
      - t-01-22
      - t-01-23
      - t-01-28
      - t-01-29
      - t-01-33
      - t-03-33
      themes:
      - ly-limites-suites
      - ly-suites-recurrentes
      - ly-recurrence
    - contenu: "Démonstration : toute suite croissante non majorée tend vers $+\\infty$."
      demo: exigible
      cours:
      - "t-01:3"
      themes:
      - ly-limites-suites
    - contenu: "Démonstration : limite de $(q^n)$, après démonstration par récurrence de l'inégalité de Bernoulli."
      demo: exigible
      cours:
      - "t-01:3"
      - "t-01:2"
      themes:
      - ly-limites-suites
      - ly-recurrence
      note: "L'inégalité de Bernoulli est démontrée en Terminale, ch. 1, section 2 (proposition 1), la limite de (q^n) en Terminale, ch. 1, section 3 (proposition 4)."
    - contenu: "Démonstration : divergence vers $+\\infty$ d'une suite minorée par une suite divergeant vers $+\\infty$."
      demo: exigible
      cours:
      - "t-01:3"
      themes:
      - ly-limites-suites
    - contenu: "Démonstration : limite en $+\\infty$ et en $-\\infty$ de la fonction exponentielle."
      demo: exigible
      cours:
      - "t-05:2"
      themes:
      - ly-exp-ln
      - ly-limites-fonctions
  - intitule: Limites des fonctions
    points:
    - contenu: "Limite finie ou infinie d'une fonction en $+\\infty$, en $-\\infty$, en un point. Asymptote parallèle à un axe de coordonnées."
      precisions: "Faire le lien entre l'existence d'une asymptote parallèle à un axe et celle de la limite correspondante."
      cours:
      - "t-03:2"
      ex:
      - t-03-05
      - t-03-06
      - t-03-09
      - t-03-10
      themes:
      - ly-limites-fonctions
    - contenu: "Limites faisant intervenir les fonctions de référence étudiées en classe de première : puissances entières, racine carrée, fonction exponentielle."
      cours:
      - "t-03:2"
      - "t-05:2"
      ex:
      - t-03-01
      - t-03-03
      - t-05-06
      themes:
      - ly-limites-fonctions
      - ly-exp-ln
    - contenu: Limites et comparaison.
      cours:
      - "t-03:2"
      ex:
      - t-03-07
      - t-03-08
      - t-03-35
      themes:
      - ly-limites-fonctions
    - contenu: Opérations sur les limites.
      precisions: "Les opérations sur les limites sont admises ; l'utilisation de la composition des limites se fait en contexte. Déterminer dans des cas simples la limite d'une suite ou d'une fonction\
        \ en un point, en $\\pm\\infty$, en utilisant les limites usuelles, les croissances comparées, les opérations sur les limites, des majorations, minorations ou encadrements, la factorisation du terme\
        \ prépondérant dans une somme."
      cours:
      - "t-03:2"
      ex:
      - t-03-02
      - t-03-03
      - t-03-04
      - t-03-05
      - t-05-08
      - t-05-18
      themes:
