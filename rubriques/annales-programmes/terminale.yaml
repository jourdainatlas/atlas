        \ par rapport aux tangentes, la croissance de $f'$, la positivité de $f''$."
      precisions: "Démontrer des inégalités en utilisant la convexité d'une fonction. Esquisser l'allure de la courbe représentative d'une fonction $f$ à partir de la donnée de tableaux de variations de\
        \ $f$, de $f'$ ou de $f''$. Dans le cadre de la résolution de problème, étudier et utiliser la convexité d'une fonction."
