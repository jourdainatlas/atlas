      precisions: "On met en regard les écritures $\\int_a^b f(x)\\,\\mathrm{d}x$ et $\\sum_{i=1}^{n} f(x_i)\\,\\Delta x_i$. Estimer graphiquement ou encadrer une intégrale, une valeur moyenne."
