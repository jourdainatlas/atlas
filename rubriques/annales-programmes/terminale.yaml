      note: "La démonstration figure au cours (Terminale, ch. 2, section 3, théorème 1) ; l'exercice 2.40 (Terminale) (question 4) en fait reprendre l'argument, pour des tirages sans remise."
  - intitule: Sommes de variables aléatoires
    points:
    - contenu: "Somme de deux variables aléatoires. Linéarité de l'espérance : $E(X + Y) = E(X) + E(Y)$ et $E(aX) = aE(X)$."
      precisions: "La démonstration de la linéarité de l'espérance peut être admise ou justifiée sur un exemple. Représenter une variable comme somme de variables aléatoires plus simples. Calculer l'espérance\
        \ d'une variable aléatoire, notamment en utilisant la propriété de linéarité."
