    - contenu: "Loi binomiale $\\mathcal{B}(n,p)$ : loi du nombre de succès. Expression à l'aide des coefficients binomiaux."
      precisions: "Utiliser l'expression de la loi binomiale pour résoudre un problème de seuil, de comparaison, d'optimisation relatif à des probabilités de nombre de succès. Dans le cadre d'une résolution\
        \ de problème modélisé par une variable binomiale $X$, calculer numériquement une probabilité du type $P(X = k)$, $P(X \\leqslant k)$, $P(k \\leqslant X \\leqslant k')$, en s'aidant au besoin d'un\
        \ algorithme ; chercher un intervalle $I$ pour lequel la probabilité $P(X \\in I)$ est inférieure à une valeur donnée $\\alpha$, ou supérieure à $1 - \\alpha$."
      cours:
      - "t-02:3"
      ex:
      - t-02-18
      - t-02-19
      - t-02-22
      - t-02-23
      - t-02-24
      - t-02-33
      themes:
