    - contenu: "Dans le cadre de la succession d'épreuves indépendantes, exemples de variables indépendantes $X, Y$ et relation d'additivité $V(X + Y) = V(X) + V(Y)$. Relation $V(aX) = a^2 V(X)$."
      precisions: "L'additivité de la variance pour deux variables indépendantes est admise. Calculer la variance d'une variable aléatoire, notamment en l'exprimant comme somme de variables aléatoires indépendantes."
