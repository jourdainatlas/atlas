      cours:
      - "mp-12:3"
      ex:
      - mp-12-38
      - mp-12-31
      themes:
      - integrales-generalisees
    - contenu: Inégalité triangulaire.
      cours:
      - "mp-12:3"
      themes:
      - integrales-generalisees
    - contenu: "Si $f$ est continue et intégrable sur $I$, à valeurs dans $\\mathbb{R}^+$ et si $\\int_I f=0$, alors $f$ est identiquement nulle."
      cours:
      - "mp-12:3"
