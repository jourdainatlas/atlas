- intitule: Équations différentielles linéaires
  objectif: "La notion générale d'équation différentielle linéaire est introduite à partir des exemples étudiés en première année : équation scalaire d'ordre 1, équation scalaire homogène d'ordre 2 à coefficients\
    \ constants. La pratique de la résolution explicite des systèmes linéaires à coefficients constants n'est pas un objectif du programme ; on peut en revanche présenter divers exemples d'études qualitatives\
    \ d'équations différentielles linéaires scalaires ou de systèmes linéaires (rôle du signe des parties réelles des valeurs propres, courbes intégrales en dimension 2). Dans cette section, $I$ est un\
    \ intervalle de $\\mathbb{R}$, $E$ un espace normé de dimension finie."
