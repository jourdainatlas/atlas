    - contenu: "Pour $\\lambda$ dans $\\mathbb{R}_+^*$, loi de Poisson de paramètre $\\lambda$. Variable de Poisson de paramètre $\\lambda$."
      precisions: "Notations $\\mathcal{P}(\\lambda)$, $X\\sim\\mathcal{P}(\\lambda)$. Interprétation en termes d'événements rares."
      cours:
      - "mp-14:8"
      ex:
      - mp-14-34
      - mp-14-38
      - mp-14-39
      - mp-14-44
      themes:
