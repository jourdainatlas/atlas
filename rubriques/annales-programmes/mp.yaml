  - intitule: "h) Espérance d'une variable aléatoire réelle ou complexe"
    points:
    - contenu: "Si $X$ est une variable aléatoire à valeurs dans $\\mathbb{R}^+\\cup\\{+\\infty\\}$, l'espérance de $X$ est la somme, dans $[0,+\\infty]$, de la famille $(x\\,P(X=x))_{x\\in X(\\Omega)}$."
      precisions: "Notation $\\mathrm{E}(X)$."
      cours:
      - "mp-15:2"
      ex:
      - mp-15-01
      - mp-15-04
      - mp-15-41
      themes:
      - esperance-variance
    - contenu: "Pour une variable aléatoire à valeurs dans $\\mathbb{N}\\cup\\{+\\infty\\}$, égalité $\\mathrm{E}(X)=\\sum_{n=1}^{+\\infty}P(X\\geqslant n)$."
      cours:
      - "mp-15:2"
      ex:
      - mp-15-07
      - mp-15-10
      - mp-15-11
      - mp-15-26
      - mp-15-14
      themes:
      - esperance-variance
    - contenu: "Une variable aléatoire complexe $X$ est dite d'espérance finie si la famille $(x\\,P(X=x))_{x\\in X(\\Omega)}$ est sommable ; dans ce cas, la somme de cette famille est l'espérance de $X$."
      precisions: "Notation $\\mathrm{E}(X)$. Variables centrées. La notation $X\\in L^1$ signifie que $X$ est d'espérance finie. On ne soulèvera aucune difficulté quant à la définition précise de $L^1$."
      cours:
      - "mp-15:2"
      ex:
      - mp-15-01
      - mp-15-37
      themes:
      - esperance-variance
    - contenu: "Espérance d'une variable géométrique, d'une variable de Poisson."
      cours:
      - "mp-15:2"
      ex:
      - mp-15-08
      - mp-15-09
      - mp-15-27
      themes:
      - esperance-variance
      - loi-geometrique
      - loi-poisson
    - contenu: "Formule de transfert : soit $X$ une variable aléatoire discrète, $f$ une fonction définie sur $X(\\Omega)$ à valeurs complexes ; alors $f(X)$ est d'espérance finie si et seulement si la\
        \ famille $(f(x)P(X=x))_{x\\in X(\\Omega)}$ est sommable ; si tel est le cas, $\\mathrm{E}(f(X))=\\sum_{x\\in X(\\Omega)}f(x)P(X=x)$."
      cours:
      - "mp-15:2"
      ex:
      - mp-15-02
      - mp-15-35
      - mp-15-15
      themes:
      - esperance-variance
    - contenu: Linéarité, positivité, croissance, inégalité triangulaire.
      precisions: "Caractérisation des variables aléatoires à valeurs dans $\\mathbb{R}^+$ d'espérance nulle."
      cours:
      - "mp-15:2"
      ex:
      - mp-15-08
      - mp-15-19
      - mp-15-13
      themes:
      - esperance-variance
    - contenu: "Si $|X|\\leqslant Y$ et si $Y\\in L^1$, alors $X\\in L^1$."
      cours:
      - "mp-15:2"
      ex:
      - mp-15-15
      themes:
      - esperance-variance
    - contenu: "Si $X$ et $Y$ sont dans $L^1$ et indépendantes, alors $XY$ est dans $L^1$ et $\\mathrm{E}(XY)=\\mathrm{E}(X)\\mathrm{E}(Y)$."
      precisions: Extension au cas de $n$ variables aléatoires.
      cours:
