  - intitule: f) Convergence dominée
    points:
    - contenu: "Théorème de convergence dominée : soit $(f_n)$ une suite de fonctions continues par morceaux de $I$ dans $\\mathbb{K}$ convergeant simplement sur $I$ vers une fonction $f$ continue par morceaux\
        \ et telle qu'il existe une fonction $\\varphi$ positive intégrable sur $I$ vérifiant $|f_n|\\leqslant\\varphi$ pour tout $n$. Alors $\\int_I f_n\\longrightarrow\\int_I f$."
      precisions: "Pour l'application pratique des énoncés de ce paragraphe, on vérifie les hypothèses de convergence simple et de domination, sans expliciter celles relatives à la continuité par morceaux\
        \ par rapport à $t$. La démonstration est hors programme."
      demo: hors programme
      cours:
      - "mp-13:2"
      ex:
      - mp-13-01
      - mp-13-02
      - mp-13-03
      - mp-13-04
      - mp-13-06
      - mp-13-10
      themes:
      - convergence-dominee
      - convergence-integrales
    - contenu: "Extension au cas d'une famille à paramètre réel $(f_\\lambda)_{\\lambda\\in J}$ où $J$ est un intervalle de $\\mathbb{R}$."
      cours:
      - "mp-13:2"
      ex:
      - mp-13-35
      - mp-13-08
      themes:
      - convergence-dominee
  - intitule: g) Intégration terme à terme
    points:
    - contenu: "Si $(f_n)$ est une suite de fonctions continues par morceaux et intégrables sur $I$, à valeurs dans $\\mathbb{R}^+$, telle que la série $\\sum f_n$ converge simplement et que sa somme soit\
        \ continue par morceaux sur $I$, alors, dans $[0,+\\infty]$, $\\int_I\\Big(\\sum_{n=0}^{+\\infty}f_n(t)\\Big)\\mathrm{d}t=\\sum_{n=0}^{+\\infty}\\int_I f_n(t)\\,\\mathrm{d}t$."
      precisions: "Pour l'application pratique des énoncés de ce paragraphe, on vérifie les hypothèses de convergence simple et de positivité ou de sommabilité, sans expliciter celles relatives à la continuité\
        \ par morceaux par rapport à $t$. La démonstration est hors programme. En particulier, l'intégrabilité de $\\sum_{n=0}^{+\\infty}f_n$ sur $I$ équivaut à $\\sum_{n=0}^{+\\infty}\\int_I f_n(t)\\,\\\
        mathrm{d}t<+\\infty$."
      demo: hors programme
      cours:
      - "mp-13:3"
      ex:
      - mp-13-11
      - mp-13-13
      themes:
      - interversions
      - convergence-integrales
    - contenu: "Si $(f_n)$ est une suite de fonctions continues par morceaux et intégrables sur $I$, à valeurs dans $\\mathbb{K}$, telle que la série $\\sum f_n$ converge simplement, que sa somme soit continue\
        \ par morceaux sur $I$ et que $\\sum_{n=0}^{+\\infty}\\int_I|f_n(t)|\\,\\mathrm{d}t<+\\infty$, alors $\\sum_{n=0}^{+\\infty}f_n$ est intégrable sur $I$ et $\\int_I\\sum_{n=0}^{+\\infty}f_n(t)\\\
        ,\\mathrm{d}t=\\sum_{n=0}^{+\\infty}\\int_I f_n(t)\\,\\mathrm{d}t$."
      precisions: "La démonstration est hors programme. On met en évidence le parallélisme de cet énoncé et du précédent avec ceux issus de la théorie des familles sommables. On présente des exemples sur\
        \ lesquels cet énoncé ne s'applique pas, mais dans lesquels l'intégration terme à terme peut être justifiée par le théorème de convergence dominée pour les sommes partielles."
      demo: hors programme
      cours:
      - "mp-13:3"
      ex:
      - mp-13-11
      - mp-13-12
      - mp-13-14
      - mp-13-15
      - mp-13-17
      themes:
      - interversions
      - convergence-integrales
  - intitule: "h) Régularité d'une fonction définie par une intégrale à paramètre"
    points:
    - contenu: "Soit $A$ une partie d'un espace normé de dimension finie, $I$ un intervalle de $\\mathbb{R}$, $f$ une fonction définie sur $A\\times I$ à valeurs dans $\\mathbb{K}$ telle que : pour tout\
        \ $t\\in I$, $f(\\cdot,t)$ est continue ; pour tout $x\\in A$, $f(x,\\cdot)$ est continue par morceaux ; il existe une fonction $\\varphi$ intégrable sur $I$ telle que, pour tout $x$ de $A$, $|f(x,\\\
        cdot)|\\leqslant\\varphi$. Alors $x\\mapsto\\int_I f(x,t)\\,\\mathrm{d}t$ est définie et continue sur $A$."
      precisions: "Pour l'application pratique des énoncés de ce paragraphe, on vérifie les hypothèses de régularité par rapport à $x$ et de domination, sans expliciter celles relatives à la continuité\
        \ par morceaux par rapport à $t$. En pratique, on vérifie l'hypothèse de domination sur tout segment de $A$, ou sur d'autres intervalles adaptés à la situation."
      cours:
      - "mp-13:4"
      ex:
      - mp-13-18
      - mp-13-19
      - mp-13-21
      - mp-13-22
      - mp-13-24
      themes:
      - integrales-parametre
    - contenu: "Soit $I$ et $A$ deux intervalles de $\\mathbb{R}$, $f$ une fonction définie sur $A\\times I$ à valeurs dans $\\mathbb{K}$ telle que : pour tout $t\\in I$, $f(\\cdot,t)$ est de classe $\\\
        mathcal{C}^1$ sur $A$ ; pour tout $x\\in A$, $f(x,\\cdot)$ est intégrable sur $I$ ; pour tout $x\\in A$, $\\frac{\\partial f}{\\partial x}(x,\\cdot)$ est continue par morceaux sur $I$ ; il existe\
        \ une fonction $\\varphi$ positive intégrable sur $I$ telle que, pour tout $x$ de $A$, $\\left|\\frac{\\partial f}{\\partial x}(x,\\cdot)\\right|\\leqslant\\varphi$. Alors $g:x\\mapsto\\int_I f(x,t)\\\
        ,\\mathrm{d}t$ est de classe $\\mathcal{C}^1$ sur $A$ et vérifie $\\forall x\\in A,\\ g'(x)=\\int_I\\frac{\\partial f}{\\partial x}(x,t)\\,\\mathrm{d}t$."
      precisions: "En pratique, on vérifie l'hypothèse de domination sur tout segment de $A$, ou sur d'autres intervalles adaptés à la situation."
      cours:
      - "mp-13:5"
      ex:
      - mp-13-25
      - mp-13-26
      - mp-13-27
      - mp-13-28
      - mp-13-29
      - mp-13-34
      themes:
      - integrales-parametre
    - contenu: "Extension à la classe $\\mathcal{C}^k$ d'une intégrale à paramètre, sous hypothèse de domination de $\\frac{\\partial^k f}{\\partial x^k}(x,t)$ et d'intégrabilité des $\\frac{\\partial^j\
        \ f}{\\partial x^j}(x,\\cdot)$ pour $0\\leqslant j\\leqslant k-1$."
      precisions: "Exemples d'études de fonctions définies comme intégrales à paramètre : régularité, étude asymptotique."
      cours:
      - "mp-13:5"
      - "mp-13:6"
      ex:
      - mp-13-30
      - mp-13-31
      - mp-13-33
      themes:
      - integrales-parametre
      - fonction-gamma
- intitule: Variables aléatoires discrètes
  objectif: "Cette section généralise aux variables aléatoires discrètes l'étude menée en première année des variables aléatoires à valeurs dans un ensemble fini. Les notions générales de théorie des probabilités\
    \ font l'objet d'un exposé a minima : la notion de tribu n'appelle aucun développement théorique et la construction d'espaces probabilisés n'est pas un objectif du programme. La théorie des familles\
    \ sommables permet une extension très naturelle des notions et résultats de première année, effectuée rapidement pour libérer du temps pour les exemples (objets aléatoires, inégalités de concentration,\
    \ marches aléatoires, chaînes de Markov...)."
  hors_programme:
  - Les diverses notions de convergence (presque sûre, en probabilité, en loi).
  - La notion de variable à densité.
  - "La notion d'espérance conditionnelle."
  - "Tout développement supplémentaire sur les événements négligeables, presque sûrs et les systèmes quasi-complets d'événements."
  - "La démonstration de l'existence d'espaces probabilisés portant une suite de variables indépendantes de lois discrètes données."
  blocs:
  - intitule: a) Ensembles dénombrables
    points:
    - contenu: "Un ensemble est dit dénombrable s'il est en bijection avec $\\mathbb{N}$."
      precisions: "Les parties infinies de $\\mathbb{N}$ sont dénombrables."
      cours:
      - "mp-14:2"
      ex:
      - mp-14-01
      themes:
      - denombrabilite
    - contenu: "Un ensemble est fini ou dénombrable si et seulement s'il est en bijection avec une partie de $\\mathbb{N}$."
      precisions: Un tel ensemble est dit au plus dénombrable.
      cours:
      - "mp-14:2"
      ex:
      - mp-14-03
      themes:
      - denombrabilite
    - contenu: "Un produit cartésien fini d'ensembles dénombrables est dénombrable. Une réunion finie ou dénombrable d'ensembles finis ou dénombrables est finie ou dénombrable."
      precisions: "Les démonstrations ne sont pas exigibles. Les ensembles $\\mathbb{N}^p$ ($p\\in\\mathbb{N}^*$), $\\mathbb{Z}$ et $\\mathbb{Q}$ sont dénombrables. Le support d'une famille sommable de\
        \ nombres complexes est dénombrable."
      demo: non exigible
      cours:
      - "mp-14:2"
      ex:
      - mp-14-01
      - mp-14-03
      - mp-14-42
      themes:
      - denombrabilite
    - contenu: "L'ensemble $\\mathbb{R}$ n'est pas dénombrable."
      precisions: "La démonstration n'est pas exigible."
      demo: non exigible
      cours:
      - "mp-14:2"
      ex:
      - mp-14-01
      - mp-14-02
      themes:
      - denombrabilite
  - intitule: b) Espaces probabilisés
    points:
    - contenu: "Tribu sur un ensemble $\\Omega$. Espace probabilisable $(\\Omega,\\mathcal{A})$."
      precisions: "La manipulation de tribus n'est pas un objectif du programme."
      cours:
      - "mp-14:3"
      ex:
      - mp-14-05
      themes:
      - probabilites-discretes
    - contenu: Événements.
      precisions: Généralisation du vocabulaire relatif aux événements introduit en première année.
      cours:
      - "mp-14:3"
      ex:
      - mp-14-04
      - mp-14-07
      themes:
      - probabilites-discretes
    - contenu: "Probabilité sur un espace probabilisable, $\\sigma$-additivité. Espace probabilisé $(\\Omega,\\mathcal{A},P)$."
      cours:
      - "mp-14:3"
      ex:
      - mp-14-06
      - mp-14-42
      themes:
      - probabilites-discretes
    - contenu: Continuité croissante, continuité décroissante.
      precisions: "Application : pour une suite $(A_n)_{n\\in\\mathbb{N}}$ d'événements (non nécessairement monotone), limites quand $n$ tend vers l'infini de $P\\big(\\bigcup_{k=0}^n A_k\\big)$ et $P\\\
        big(\\bigcap_{k=0}^n A_k\\big)$."
      cours:
      - "mp-14:3"
      ex:
      - mp-14-08
      - mp-14-07
      - mp-14-09
      themes:
      - probabilites-discretes
    - contenu: "Propriété de sous-additivité de $P$ pour une réunion dénombrable d'événements."
      cours:
      - "mp-14:3"
      ex:
      - mp-14-09
      themes:
      - probabilites-discretes
      - borel-cantelli
    - contenu: "Événements négligeables, événements presque sûrs. Une réunion (resp. intersection) finie ou dénombrable d'événements négligeables (resp. presque sûrs) est un événement négligeable (resp.\
        \ presque sûr)."
      precisions: "Systèmes quasi-complets d'événements. Tout développement supplémentaire sur ces notions est hors programme."
      cours:
      - "mp-14:3"
      ex:
      - mp-14-08
      - mp-14-09
      - mp-14-42
      themes:
      - probabilites-discretes
      - borel-cantelli
  - intitule: c) Probabilités conditionnelles et indépendance
    points:
    - contenu: "Extension des résultats vus en première année : probabilité conditionnelle, formule des probabilités composées, formule des probabilités totales, formule de Bayes."
      precisions: Notations $P_B(A)$, $P(A\mid B)$.
      cours:
      - "mp-14:4"
      - "ma-21:4"
      ex:
      - mp-14-10
      - mp-14-11
      - mp-14-12
      - mp-14-13
      - mp-14-15
      - mp-14-16
      themes:
      - conditionnement
      - bayes
    - contenu: Par définition, les événements $A$ et $B$ sont indépendants si $P(A\cap B)=P(A)P(B)$.
      precisions: "Lorsque $P(B)>0$, l'indépendance de $A$ et $B$ s'écrit $P(A\\mid B)=P(A)$."
      cours:
      - "mp-14:4"
      ex:
      - mp-14-22
      - mp-14-23
      themes:
      - conditionnement
    - contenu: "Famille d'événements indépendants."
      precisions: "L'indépendance deux à deux n'implique pas l'indépendance."
      cours:
      - "mp-14:4"
      ex:
      - mp-14-18
      - mp-14-19
      - mp-14-24
      - mp-14-42
      themes:
      - conditionnement
    - contenu: "Si $A$ et $B$ sont indépendants, $A$ et $\\overline{B}$ le sont aussi."
      cours:
      - "mp-14:4"
      ex:
      - mp-14-19
      - mp-14-24
      - mp-14-09
      themes:
      - conditionnement
  - intitule: d) Espaces probabilisés discrets
    points:
    - contenu: "Si $\\Omega$ est un ensemble, une distribution de probabilités discrètes sur $\\Omega$ est une famille d'éléments de $\\mathbb{R}^+$ indexée par $\\Omega$ et de somme 1."
      precisions: "Support d'une distribution de probabilités discrète ; le support est au plus dénombrable."
      cours:
      - "mp-14:5"
      ex:
      - mp-14-22
      - mp-14-23
      themes:
      - probabilites-discretes
    - contenu: "Probabilité définie sur $\\mathcal{A}=\\mathcal{P}(\\Omega)$ associée à une distribution de probabilités discrètes sur $\\Omega$."
      precisions: "Si $\\Omega$ est au plus dénombrable, on obtient ainsi toutes les probabilités sur $\\mathcal{P}(\\Omega)$."
      cours:
      - "mp-14:5"
      ex:
      - mp-14-22
      - mp-14-42
      - mp-14-24
      themes:
      - probabilites-discretes
  - intitule: e) Variables aléatoires discrètes
    points:
    - contenu: "Une variable aléatoire discrète $X$ définie sur l'espace probabilisé $(\\Omega,\\mathcal{A},P)$ et à valeurs dans $E$ est une application définie sur $\\Omega$, à valeurs dans l'ensemble\
        \ $E$, telle que $X(\\Omega)$ soit au plus dénombrable et que, pour tout $x\\in X(\\Omega)$, l'ensemble $X^{-1}(\\{x\\})$ appartienne à $\\mathcal{A}$."
      precisions: "Notations $(X=x)$, $(X\\in A)$, $\\{X=x\\}$, $\\{X\\in A\\}$. Lorsque $E=\\mathbb{R}$, la variable aléatoire $X$ est dite réelle. Notations $(X\\leqslant x)$, $(X\\geqslant x)$, $(X<x)$,\
        \ $(X>x)$ (et analogues avec accolades) pour une variable aléatoire réelle $X$."
      cours:
      - "mp-14:6"
      ex:
      - mp-15-11
      - mp-14-39
      - mp-14-41
      themes:
      - variables-aleatoires
    - contenu: "Loi $P_X$ d'une variable aléatoire discrète $X$."
      precisions: La loi de $X$ peut au besoin être définie sur un ensemble contenant $X(\Omega)$.
      cours:
      - "mp-14:6"
      ex:
      - mp-14-25
      - mp-14-30
      themes:
      - variables-aleatoires
    - contenu: "La probabilité $P_X$ est déterminée par la distribution de probabilités discrète $(P(X=x))_{x\\in X(\\Omega)}$."
      precisions: Dans ce qui suit, toutes les variables aléatoires sont supposées discrètes.
      cours:
      - "mp-14:6"
      themes:
      - variables-aleatoires
    - contenu: Notation $X\sim Y$.
      precisions: La notation $X\sim Y$ ne suppose pas que $X$ et $Y$ sont définies sur le même espace probabilisé.
      cours:
      - "mp-14:6"
      themes:
      - variables-aleatoires
    - contenu: Variable aléatoire $f(X)$. Si $X\sim Y$ alors $f(X)\sim f(Y)$.
      cours:
      - "mp-14:6"
      ex:
      - mp-14-42
      themes:
      - variables-aleatoires
    - contenu: "Loi conditionnelle d'une variable aléatoire $X$ sachant un événement $A$."
      cours:
      - "mp-14:6"
      ex:
      - mp-14-28
      - mp-15-05
      - mp-14-33
      - mp-14-38
      themes:
      - variables-aleatoires
      - conditionnement
    - contenu: Couple de variables aléatoires. Loi conjointe, lois marginales.
      precisions: Un couple est une variable aléatoire à valeurs dans un produit. Notation $P(X=x,Y=y)$. Extension aux $n$-uplets de variables aléatoires.
      cours:
      - "mp-14:6"
      ex:
      - mp-14-27
      - mp-14-28
      - mp-14-29
      - mp-14-31
      - mp-14-33
      themes:
      - couples-variables
    - contenu: Détermination des lois marginales à partir de la loi conjointe.
      cours:
      - "mp-14:6"
      ex:
      - mp-14-28
      - mp-14-29
      - mp-14-32
      - mp-15-06
      themes:
      - couples-variables
  - intitule: f) Variables aléatoires indépendantes
    points:
    - contenu: Couple de variables aléatoires indépendantes, famille finie de variables aléatoires indépendantes.
      precisions: "Notation $X\\perp\\!\\!\\!\\perp Y$. Les variables aléatoires $X$ et $Y$ sont indépendantes si et seulement si la distribution de probabilités de $(X,Y)$ est le produit des distributions\
        \ de probabilités de $X$ et $Y$. Extension aux $n$-uplets de variables aléatoires."
      cours:
      - "mp-14:7"
      ex:
      - mp-14-28
      - mp-14-29
      - mp-14-31
      - mp-14-32
      themes:
      - couples-variables
      - variables-aleatoires
    - contenu: Famille quelconque de variables aléatoires indépendantes.
      cours:
      - "mp-14:7"
      themes:
      - variables-aleatoires
    - contenu: "Fonctions de variables aléatoires indépendantes : si $X\\perp\\!\\!\\!\\perp Y$, alors $f(X)\\perp\\!\\!\\!\\perp g(Y)$."
      precisions: Extension au cas de plus de deux variables.
      cours:
      - "mp-14:7"
      themes:
      - variables-aleatoires
    - contenu: "Lemme des coalitions : si les variables aléatoires $X_1,\\dots,X_n$ sont indépendantes, les variables aléatoires $f(X_1,\\dots,X_m)$ et $g(X_{m+1},\\dots,X_n)$ le sont aussi."
      precisions: Extension au cas de plus de deux coalitions.
      cours:
      - "mp-14:7"
      ex:
      - mp-14-36
      - mp-15-28
      - ma-21-67
      themes:
      - variables-aleatoires
    - contenu: "Existence d'espaces probabilisés portant une suite de variables indépendantes de lois discrètes données."
      precisions: "La démonstration est hors programme. Suites i.i.d. Modélisation du jeu de pile ou face infini : suite i.i.d. de variables de Bernoulli."
      demo: hors programme
      cours:
      - "mp-14:7"
      ex:
      - mp-14-24
      themes:
      - variables-aleatoires
  - intitule: g) Lois usuelles
    points:
    - contenu: "Pour $p$ dans $]0,1[$, loi géométrique de paramètre $p$. Variable géométrique de paramètre $p$."
      precisions: "Notations $\\mathcal{G}(p)$, $X\\sim\\mathcal{G}(p)$. Interprétation comme rang du premier succès dans le jeu de pile ou face infini."
      cours:
