- intitule: Topologie des espaces vectoriels normés
  objectif: "Les objectifs sont d'introduire, dans le cadre des espaces vectoriels normés, le vocabulaire de la topologie ; de donner, à travers l'étude des espaces vectoriels normés de dimension finie,\
    \ un cadre commode pour diverses applications à l'analyse (fonctions vectorielles, équations différentielles linéaires) ; d'introduire la notion de partie compacte, en soulignant son rôle dans les résultats\
    \ d'existence, notamment en optimisation, et celle de composante connexe par arcs, qui généralise le théorème des valeurs intermédiaires ; de dégager l'idée fondamentale d'inégalité linéaire, quantifiée\
    \ par la notion de norme d'opérateur. Les notions sont illustrées par des exemples variés ($\\mathbb{K}^n$, espaces de polynômes, d'applications linéaires, de matrices, espaces fonctionnels) et par\
    \ de nombreuses figures ; lors de l'étude de la connexité par arcs, un dessin pertinent peut valoir preuve. Dans toute la section, $\\mathbb{K}$ désigne $\\mathbb{R}$ ou $\\mathbb{C}$."
  hors_programme:
  - "Les notions d'espace métrique et, a fortiori, d'espace topologique."
  - "Les notions de suite de Cauchy et d'espace de Banach."
  - La propriété de Borel-Lebesgue.
