    - contenu: Adaptation du théorème de comparaison en une borne quelconque.
      cours:
      - "mp-12:3"
      ex:
      - mp-12-06
      - mp-12-07
      - mp-12-08
      themes:
      - integrales-generalisees
      - equivalents
    - contenu: "Si $\\alpha\\in\\mathbb{R}$, nature de l'intégrale de Riemann $\\int_a^b\\frac{1}{|x-a|^\\alpha}\\,\\mathrm{d}x$."
      precisions: La fonction $f$ est intégrable en $a$ (resp. $b$) si et seulement si $t\mapsto f(a+t)$ (resp. $t\mapsto f(b-t)$) est intégrable en $0$.
      cours:
