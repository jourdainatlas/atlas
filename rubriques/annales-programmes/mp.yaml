    - contenu: "Dérivée le long d'un arc : si $\\gamma$ est une application définie sur l'intervalle $I$ de $\\mathbb{R}$, dérivable en $t$, si $f$ est différentiable en $\\gamma(t)$, alors $(f\\circ\\\
        gamma)'(t)=\\mathrm{d}f(\\gamma(t))\\cdot\\gamma'(t)$."
      precisions: "Interprétation géométrique en termes de tangentes. Cas particulier fondamental : $\\gamma(t)=x+tv$. Dérivation de $t\\mapsto f(x_1(t),\\dots,x_n(t))$."
      cours:
