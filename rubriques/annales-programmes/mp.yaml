- intitule: Suites et séries de fonctions, séries entières
  objectif: "A - Suites et séries de fonctions : définir différents modes usuels de convergence des suites et séries de fonctions, étudier la stabilité des propriétés des fonctions par passage à la limite,\
    \ introduire la thématique de l'approximation, reliée à la notion topologique de densité, à travers deux théorèmes d'approximation uniforme ; la technique n'est pas un but en soi et l'on privilégie\
    \ les exemples significatifs. Les fonctions sont définies sur une partie A d'un espace vectoriel de dimension finie et à valeurs dans un espace normé F de dimension finie ; dans la pratique, on se limite\
    \ pour l'essentiel au cas de fonctions à valeurs dans $\\mathbb{R}$ ou $\\mathbb{C}$. B - Séries entières : étudier la convergence d'une série entière et les propriétés de sa somme, introduire la notion\
    \ de fonction développable en série entière, établir les développements des fonctions usuelles ; les séries entières sont un outil pour les équations différentielles linéaires et les fonctions génératrices\
    \ en probabilités, et donnent l'occasion d'introduire la « variable complexe ». Les coefficients des séries entières considérées sont réels ou complexes."
  hors_programme:
  - La démonstration du théorème de la double limite.
  - "La démonstration du théorème d'Abel radial."
  blocs:
  - intitule: A - Suites et séries de fonctions · a) Convergence simple, convergence uniforme
    points:
    - contenu: "Convergence simple d'une suite de fonctions. Convergence uniforme. La convergence uniforme entraîne la convergence simple."
      precisions: Pour des fonctions bornées, interprétation en termes de norme.
      cours:
      - "mp-08:2"
      ex:
      - mp-08-01
      - mp-08-02
      - mp-08-05
      - mp-08-03
      - mp-08-06
      - mp-08-04
      themes:
      - convergence-uniforme
      - suites-series-fonctions
  - intitule: A - Suites et séries de fonctions · b) Continuité, double limite
    points:
    - contenu: Si les $u_n$ sont continues en $a$ et si $(u_n)$ converge uniformément vers $u$ sur $A$, alors $u$ est continue en $a$. En particulier, toute limite uniforme de fonctions continues sur $A$
        est continue sur $A$.
      precisions: "Le théorème s'applique dans le cas où l'hypothèse de convergence uniforme est satisfaite de façon locale, en particulier sur tout segment. En pratique, on vérifie la convergence uniforme\
        \ sur des intervalles adaptés à la situation."
      cours:
      - "mp-08:3"
      - "mp-08:2"
      ex:
      - mp-08-13
      - mp-08-54
      - mp-08-14
      - mp-08-15
      themes:
      - convergence-uniforme
      - interversions
    - contenu: "Théorème de la double limite : soit $(u_n)$ une suite de fonctions de $A$ dans $F$ convergeant uniformément vers $u$ sur $A$, et soit $a$ un point adhérent à $A$ ; si, pour tout $n$, $u_n$\
        \ admet une limite $\\ell_n$ en $a$, alors $(\\ell_n)$ admet une limite $\\ell$ et $u(x)\\xrightarrow[x\\to a]{}\\ell$."
      precisions: "La démonstration est hors programme. Adaptation, si $A\\subset\\mathbb{R}$, aux cas où $a=+\\infty$ et $a=-\\infty$."
      demo: hors programme
      cours:
      - "mp-08:3"
      ex:
      - mp-08-13
      - mp-08-38
      - mp-08-42
      themes:
      - interversions
      - convergence-uniforme
  - intitule: "A - Suites et séries de fonctions · c) Intégration d'une limite uniforme sur un segment"
    points:
    - contenu: "Soit $(u_n)$ une suite de fonctions continues définies sur un intervalle $I$ de $\\mathbb{R}$ et à valeurs dans $F$, $a$ un point de $I$. On suppose que $(u_n)$ converge uniformément sur\
        \ tout segment de $I$ vers une fonction $u$. Pour $n\\in\\mathbb{N}$ et $x\\in I$, soit $U_n(x)=\\int_a^x u_n$, $U(x)=\\int_a^x u$. Alors $(U_n)$ converge uniformément vers $U$ sur tout segment\
        \ de $I$."
      precisions: "En particulier, si $(u_n)$ converge uniformément vers $u$ sur le segment $[a,b]$, alors $\\int_a^b u_n\\to\\int_a^b u$."
      cours:
      - "mp-08:4"
      ex:
      - mp-08-16
      - mp-08-17
      - mp-08-18
      - mp-08-19
      - mp-08-22
      themes:
      - interversions
      - convergence-uniforme
  - intitule: "A - Suites et séries de fonctions · d) Dérivation d'une suite de fonctions"
    points:
    - contenu: "Soit $(u_n)$ une suite de fonctions de classe $\\mathcal{C}^1$ sur un intervalle $I$ de $\\mathbb{R}$, à valeurs dans $F$. Si $(u_n)$ converge simplement sur $I$ vers une fonction $u$, et\
        \ si $(u_n')$ converge uniformément sur tout segment de $I$ vers une fonction $v$, alors $(u_n)$ converge uniformément vers $u$ sur tout segment de $I$, $u$ est de classe $\\mathcal{C}^1$ sur $I$\
        \ et $u'=v$."
      precisions: "En pratique, on vérifie la convergence uniforme de $(u_n')$ sur des intervalles adaptés à la situation."
      cours:
      - "mp-08:4"
      ex:
      - mp-08-20
      - mp-08-21
      - mp-08-22
      themes:
      - interversions
      - convergence-uniforme
    - contenu: "Extension aux suites de fonctions de classe $\\mathcal{C}^k$, sous l'hypothèse de convergence simple de $(u_n^{(j)})$ pour $0\\leqslant j\\leqslant k-1$ et de convergence uniforme sur tout\
        \ segment de $(u_n^{(k)})$."
      precisions: "En pratique, on vérifie la convergence uniforme de $(u_n^{(k)})$ sur des intervalles adaptés à la situation."
      cours:
      - "mp-08:4"
      themes:
      - interversions
      note: "Le cas des fonctions de classe $\\mathcal{C}^k$ n'est travaillé en exercice que pour des séries de fonctions : voir le point « Adaptation des résultats aux séries de fonctions »."
  - intitule: A - Suites et séries de fonctions · e) Séries de fonctions
    points:
    - contenu: Convergence simple, convergence uniforme. Une série de fonctions converge uniformément si et seulement si elle converge simplement et si la suite de ses restes converge uniformément vers
        0.
      cours:
      - "mp-08:5"
      ex:
