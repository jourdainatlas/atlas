      - reduction
  - intitule: i) Polynômes annulateurs et réduction
    points:
    - contenu: "Un endomorphisme est diagonalisable si et seulement s'il annule un polynôme simplement scindé, ou encore si et seulement si son polynôme minimal est simplement scindé."
