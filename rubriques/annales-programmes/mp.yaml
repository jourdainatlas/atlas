      themes:
      - esperance-variance
    - contenu: "Inégalité de Cauchy-Schwarz : si $X$ et $Y$ sont dans $L^2$, $XY$ est dans $L^1$ et $\\mathrm{E}(XY)^2\\leqslant\\mathrm{E}(X^2)\\,\\mathrm{E}(Y^2)$."
      precisions: "Cas d'égalité."
      cours:
      - "mp-15:3"
      ex:
      - mp-15-18
      - mp-15-19
      themes:
      - cauchy-schwarz
      - esperance-variance
    - contenu: Pour $X\in L^2$, variance et écart type de $X$.
      precisions: "Notations $\\mathrm{V}(X)$, $\\sigma(X)$. Variables réduites. Caractérisation des variables aléatoires de variance nulle."
      cours:
