      note: "Le théorème d'Abel radial est exposé en 9.5.4, dans la section « Fonctions développables en série entière », et non dans la section sur la régularité de la somme."
    - contenu: "La somme d'une série entière est de classe $\\mathcal{C}^\\infty$ sur l'intervalle ouvert de convergence et ses dérivées s'obtiennent par dérivation terme à terme."
      precisions: Relation $R\big(\sum a_n x^n\big)=R\big(\sum n a_n x^n\big)$.
