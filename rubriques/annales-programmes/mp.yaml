  - intitule: "i) Variance d'une variable aléatoire réelle, écart type et covariance"
    points:
    - contenu: "Si $\\mathrm{E}(X^2)<+\\infty$, $X$ est d'espérance finie."
      precisions: "La notation $X\\in L^2$ signifie que $X^2$ est d'espérance finie. On ne soulèvera aucune difficulté quant à la définition précise de $L^2$."
      cours:
