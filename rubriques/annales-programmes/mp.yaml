    - contenu: "Rayon de convergence d'une série entière, défini comme borne supérieure dans $[0,+\\infty]$ de l'ensemble des réels positifs $r$ tels que la suite $(a_n r^n)$ est bornée. Disque ouvert de\
        \ convergence. Intervalle ouvert de convergence."
