    - contenu: "Une fonction est dite intégrable sur l'intervalle $I$ si elle y est continue par morceaux et si son intégrale sur $I$ est absolument convergente."
      precisions: "On utilise indifféremment les expressions « $f$ est intégrable sur $[a,b[$ » et « l'intégrale $\\int_a^b f$ converge absolument ». Fonction intégrable en $b$, en $a$."
      cours:
      - "mp-12:3"
      ex:
      - mp-12-06
      - mp-12-08
      - mp-12-11
