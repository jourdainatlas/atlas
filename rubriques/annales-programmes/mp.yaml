      - mp-17-25
      - mp-17-28
      - mp-17-26
      - mp-17-27
      - mp-17-48
      themes:
      - optimisation
      - points-critiques
    - contenu: "Si $f$ est une fonction numérique définie sur l'ouvert $\\Omega$, si $X$ est une partie de $\\Omega$, si la restriction de $f$ à $X$ admet un extremum local en $x$ et si $f$ est différentiable\
        \ en $x$, alors $\\mathrm{d}f(x)$ s'annule en tout vecteur tangent à $X$ en $x$."
      cours:
      - "mp-17:5"
      ex:
      - mp-17-50
      themes:
      - extrema-lies
      - optimisation
    - contenu: "Théorème d'optimisation sous une contrainte : si $f$ et $g$ sont des fonctions numériques définies et de classe $\\mathcal{C}^1$ sur l'ouvert $\\Omega$ de $E$, si $X$ est l'ensemble des\
        \ zéros de $g$, si $x\\in X$ et $\\mathrm{d}g(x)\\neq0$ et si la restriction de $f$ à $X$ admet un extremum local en $x$, alors $\\mathrm{d}f(x)$ est colinéaire à $\\mathrm{d}g(x)$."
      precisions: "Si $E$ est euclidien, traduction en termes de gradient. Exemples de recherches d'extremums sous contrainte."
      cours:
      - "mp-17:5"
      ex:
      - mp-17-30
