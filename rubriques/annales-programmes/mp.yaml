    - contenu: "Relation $\\mathrm{V}(aX+b)=a^2\\,\\mathrm{V}(X)$."
      precisions: "Si $\\sigma(X)>0$, la variable aléatoire $\\frac{X-\\mathrm{E}(X)}{\\sigma(X)}$ est centrée réduite."
      cours:
