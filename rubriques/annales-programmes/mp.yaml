      precisions: "La démonstration de la réciproque n'est pas exigible. Utilisation de $G_X$ pour le calcul de $\\mathrm{E}(X)$ et $\\mathrm{V}(X)$. Les étudiants doivent savoir calculer rapidement la\
        \ fonction génératrice d'une variable aléatoire de Bernoulli, binomiale, géométrique, de Poisson."
