  - intitule: k) Fonctions génératrices
    points:
    - contenu: "Fonction génératrice de la variable aléatoire $X$ à valeurs dans $\\mathbb{N}$ : $G_X(t)=\\mathrm{E}(t^X)=\\sum_{k=0}^{+\\infty}P(X=k)\\,t^k$."
      precisions: La série entière définissant $G_X$ est de rayon supérieur ou égal à 1 et converge normalement sur le disque fermé de centre 0 et de rayon 1. Continuité de $G_X$.
