    - contenu: "Si $f$ est une fonction de classe $\\mathcal{C}^2$ sur un ouvert de $\\mathbb{R}^n$, si $x$ est point critique de $f$ et si $H_f(x)\\in\\mathcal{S}_n^{++}(\\mathbb{R})$, alors $f$ atteint\
