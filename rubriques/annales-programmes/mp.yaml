- intitule: Intégration sur un intervalle quelconque
  objectif: "L'objectif est triple : définir, dans le cadre restreint des fonctions continues par morceaux, les notions d'intégrale convergente et d'intégrabilité sur un intervalle non compact ; donner\
    \ des outils efficaces de passage à la limite sous l'intégrale, en particulier le théorème de convergence dominée ; compléter l'étude des séries de fonctions par celle des intégrales à paramètre. La\
    \ technique n'est pas un but en soi : on privilégie les exemples significatifs (transformées intégrales de Fourier, Laplace, intégrales eulériennes) et l'on évite tout excès de rigueur dans la rédaction,\
    \ en se limitant à la vérification des hypothèses cruciales. Les fonctions sont à valeurs dans $\\mathbb{K}$, corps des nombres réels ou des nombres complexes."
  hors_programme:
  - La démonstration du théorème de convergence dominée.
  - "Les démonstrations des théorèmes d'intégration terme à terme."
  blocs:
  - intitule: "a) Intégrales généralisées sur un intervalle de la forme $[a,+\\infty[$"
    points:
    - contenu: "Pour $f$ continue par morceaux de $[a,+\\infty[$ dans $\\mathbb{K}$, l'intégrale $\\int_a^{+\\infty}f$ est dite convergente si la fonction $x\\mapsto\\int_a^x f$ a une limite finie en $+\\\
        infty$."
      precisions: "Notations $\\int_a^{+\\infty}f$, $\\int_a^{+\\infty}f(t)\\,\\mathrm{d}t$. Intégrale convergente en $+\\infty$. Dérivation de $x\\mapsto\\int_x^{+\\infty}f$ si $f$ est continue."
      cours:
      - "mp-12:2"
      ex:
      - mp-12-01
      - mp-12-02
      - mp-12-05
      themes:
      - integrales-generalisees
    - contenu: "Si $f$ est continue par morceaux sur $[a,+\\infty[$ et à valeurs positives, l'intégrale $\\int_a^{+\\infty}f$ converge si et seulement si $x\\mapsto\\int_a^x f$ est majorée."
      precisions: "Écriture $\\int_a^{+\\infty}f=+\\infty$ en cas de divergence."
      cours:
      - "mp-12:2"
      ex:
      - mp-12-38
      themes:
      - integrales-generalisees
    - contenu: "Si $f$ et $g$ sont deux fonctions continues par morceaux sur $[a,+\\infty[$ telles que $0\\leqslant f\\leqslant g$, la convergence de $\\int_a^{+\\infty}g$ implique celle de $\\int_a^{+\\\
        infty}f$."
      cours:
      - "mp-12:2"
      ex:
      - mp-12-06
      - mp-12-03
      themes:
      - integrales-generalisees
    - contenu: "Pour $\\alpha\\in\\mathbb{R}$, nature de l'intégrale de Riemann $\\int_1^{+\\infty}\\frac{1}{t^\\alpha}\\,\\mathrm{d}t$."
      cours:
      - "mp-12:2"
      ex:
      - mp-12-03
      - mp-12-08
      themes:
      - integrales-generalisees
    - contenu: "Pour $a\\in\\mathbb{R}$, nature de l'intégrale $\\int_0^{+\\infty}e^{-at}\\,\\mathrm{d}t$."
      cours:
      - "mp-12:2"
      themes:
      - integrales-generalisees
  - intitule: "b) Intégrabilité sur un intervalle de la forme $[a,+\\infty[$"
    points:
    - contenu: "Une fonction $f$ est dite intégrable sur $[a,+\\infty[$ si elle est continue par morceaux sur $[a,+\\infty[$ et si $\\int_a^{+\\infty}|f|$ converge."
      precisions: "On utilise indifféremment les expressions « $f$ est intégrable sur $[a,+\\infty[$ » et « l'intégrale $\\int_a^{+\\infty}f$ converge absolument ». Pour $f$ de signe constant, $\\int_a^{+\\\
        infty}f$ converge si et seulement si $f$ est intégrable sur $[a,+\\infty[$. Un calcul montrant que $\\int_I|f|<+\\infty$ vaut preuve d'intégrabilité."
      cours:
      - "mp-12:3"
      ex:
      - mp-12-06
      - mp-12-09
      themes:
      - integrales-generalisees
    - contenu: "Si $f$ est intégrable sur $[a,+\\infty[$, alors $\\int_a^{+\\infty}f$ converge."
      precisions: "Fonction intégrable en $+\\infty$. L'étude des intégrales semi-convergentes n'est pas un objectif du programme."
      cours:
      - "mp-12:3"
      ex:
      - mp-12-09
      - mp-12-20
      - mp-12-10
      themes:
      - integrales-generalisees
    - contenu: "Théorème de comparaison : pour $f$ et $g$ deux fonctions continues par morceaux sur $[a,+\\infty[$, à valeurs dans $\\mathbb{K}$ : si $f(x)\\underset{x\\to+\\infty}{=}O(g(x))$, alors l'intégrabilité\
        \ de $g$ sur $[a,+\\infty[$ implique celle de $f$ ; si $f(x)\\underset{x\\to+\\infty}{\\sim}g(x)$, alors l'intégrabilité de $g$ sur $[a,+\\infty[$ équivaut à celle de $f$."
      precisions: "Le résultat s'applique en particulier si $f(x)\\underset{x\\to+\\infty}{=}o(g(x))$."
      cours:
      - "mp-12:3"
      ex:
      - mp-12-06
      - mp-12-07
      - mp-12-08
      - mp-12-10
      themes:
      - integrales-generalisees
      - equivalents
  - intitule: c) Intégrales généralisées sur un intervalle quelconque
    points:
    - contenu: "Intégrale généralisée d'une fonction continue par morceaux sur un intervalle semi-ouvert ou ouvert de $\\mathbb{R}$."
      precisions: "Notations $\\int_a^b f$, $\\int_a^b f(t)\\,\\mathrm{d}t$. Intégrale convergente en $b$, en $a$. Écriture $\\int_a^b f=+\\infty$ si $f$ est à valeurs dans $\\mathbb{R}^+$ et d'intégrale\
        \ divergente. Pour une fonction à valeurs dans $\\mathbb{R}^+$, un calcul aboutissant à un résultat fini vaut preuve de convergence."
      cours:
      - "mp-12:2"
      ex:
      - mp-12-01
      - mp-12-02
      - mp-12-04
      themes:
      - integrales-generalisees
    - contenu: "Propriétés des intégrales généralisées : linéarité, positivité, croissance, relation de Chasles."
      cours:
      - "mp-12:2"
      ex:
      - mp-12-02
      themes:
      - integrales-generalisees
    - contenu: "Intégration par parties sur un intervalle quelconque : $\\int_a^b f(t)g'(t)\\,\\mathrm{d}t=\\big[fg\\big]_a^b-\\int_a^b f'(t)g(t)\\,\\mathrm{d}t$."
      precisions: "L'existence des limites du produit $fg$ aux bornes de l'intervalle assure que les intégrales de $fg'$ et de $f'g$ sont de même nature. Pour les applications pratiques, on ne demande pas\
        \ de rappeler les hypothèses de régularité."
      cours:
      - "mp-12:4"
      ex:
      - mp-12-12
      - mp-12-13
      - mp-12-17
      themes:
      - integrales-generalisees
    - contenu: "Changement de variable : étant données une fonction $f$ continue sur $]a,b[$ et une fonction $\\varphi:\\,]\\alpha,\\beta[\\,\\to\\,]a,b[$ bijective, strictement croissante et de classe\
        \ $\\mathcal{C}^1$, les intégrales $\\int_a^b f(t)\\,\\mathrm{d}t$ et $\\int_\\alpha^\\beta f(\\varphi(u))\\,\\varphi'(u)\\,\\mathrm{d}u$ sont de même nature et égales en cas de convergence."
      precisions: Adaptation au cas où $\varphi$ est strictement décroissante. On applique ce résultat sans justification dans des cas de changements de variable usuels.
      cours:
      - "mp-12:4"
      ex:
      - mp-12-14
      - mp-12-15
      - mp-12-18
      themes:
      - integrales-generalisees
  - intitule: d) Intégrales absolument convergentes et fonctions intégrables
    points:
    - contenu: Intégrale absolument convergente. La convergence absolue implique la convergence.
      cours:
      - "mp-12:3"
