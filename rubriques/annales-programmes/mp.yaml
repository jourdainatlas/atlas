  - intitule: "e) Vecteurs tangents à une partie d'un espace normé de dimension finie"
    points:
    - contenu: "Si $X$ est une partie de $E$ et $x$ un point de $X$, un vecteur $v$ de $E$ est tangent à $X$ en $x$ s'il existe $\\varepsilon>0$ et un arc $\\gamma$ défini sur $]-\\varepsilon,\\varepsilon[$,\
        \ à valeurs dans $X$, dérivable en 0, tel que $\\gamma(0)=x$, $\\gamma'(0)=v$."
      precisions: "Notation $T_xX$ pour l'ensemble des vecteurs tangents à $X$ en $x$. Exemples : sous-espace affine, sphère d'un espace euclidien, graphe d'une fonction numérique définie sur un ouvert\
        \ de $\\mathbb{R}^2$."
      cours:
      - "mp-17:5"
      ex:
      - mp-17-32
      - mp-17-51
      themes:
      - calcul-differentiel
      - courbes-surfaces
    - contenu: "Si $g$ est une fonction numérique définie et de classe $\\mathcal{C}^1$ sur l'ouvert $\\Omega$ de $E$, si $x\\in X$ et $\\mathrm{d}g(x)\\neq0$, alors $T_xX$ est égal au noyau de $\\mathrm{d}g(x)$."
      precisions: "La démonstration de cet énoncé et le théorème des fonctions implicites sont hors programme. Traduction en termes de gradient si $E$ est euclidien, en particulier pour $E=\\mathbb{R}^n$\
        \ muni de sa structure euclidienne canonique. Exemple : plan tangent à une surface de $\\mathbb{R}^3$ définie par une équation."
      demo: hors programme
      cours:
      - "mp-17:5"
      ex:
      - mp-17-24
      themes:
      - courbes-surfaces
      - extrema-lies
      - calcul-differentiel
  - intitule: "f) Optimisation : étude au premier ordre"
    points:
    - contenu: "Point critique d'une application différentiable."
      cours:
