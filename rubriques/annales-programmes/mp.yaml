    - contenu: "Dérivées partielles d'une composée d'applications différentiables."
      precisions: Dérivées partielles de $(u_1,\dots,u_m)\mapsto f(x_1(u_1,\dots,u_m),\dots,x_n(u_1,\dots,u_m))$.
      cours:
