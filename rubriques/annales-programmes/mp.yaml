      - mp-17-05
      - mp-17-19
      themes:
      - calcul-differentiel
    - contenu: "L'application $f$ est de classe $\\mathcal{C}^1$ sur $\\Omega$ si et seulement si les dérivées partielles relativement à une base de $E$ existent en tout point de $\\Omega$ et sont continues\
        \ sur $\\Omega$."
      precisions: "La démonstration n'est pas exigible."
      demo: non exigible
      cours:
      - "mp-17:4"
      ex:
      - mp-17-19
      - mp-17-20
      - ma-22-10
      - mp-17-22
      - mp-17-23
      themes:
      - calcul-differentiel
    - contenu: "Opérations algébriques sur les applications de classe $\\mathcal{C}^1$."
      cours:
      - "mp-17:4"
      ex:
      - mp-17-14
      - mp-17-17
      themes:
      - calcul-differentiel
    - contenu: "Si $f$ est une application de classe $\\mathcal{C}^1$ de $\\Omega$ dans $F$, si $\\gamma$ est une application de classe $\\mathcal{C}^1$ de $[0,1]$ dans $\\Omega$, si $\\gamma(0)=a$ et $\\\
        gamma(1)=b$, alors $f(b)-f(a)=\\int_0^1\\mathrm{d}f(\\gamma(t))\\cdot\\gamma'(t)\\,\\mathrm{d}t$."
      precisions: "Cas particulier $\\gamma(t)=a+tv$ pour tout $t\\in[0,1]$."
      cours:
      - "mp-17:4"
      themes:
      - calcul-differentiel
    - contenu: Si $\Omega$ est connexe par arcs, caractérisation des fonctions constantes sur $\Omega$.
      precisions: Démonstration pour $\Omega$ convexe.
      cours:
      - "mp-17:4"
      ex:
      - ma-22-08
      - mp-17-21
      - mp-17-47
      - mp-17-44
      themes:
