  - intitule: "h) Optimisation : étude au second ordre"
    points:
    - contenu: "Matrice hessienne en un point d'une fonction de classe $\\mathcal{C}^2$ sur un ouvert de $\\mathbb{R}^n$, à valeurs réelles."
      precisions: Notation $H_f(x)$.
      cours:
      - "mp-17:6"
      ex:
      - mp-17-33
      - mp-17-44
      - mp-17-47
      themes:
