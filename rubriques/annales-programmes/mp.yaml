    - contenu: "Formule de Taylor-Young à l'ordre 2 : $f(x+h)\\underset{h\\to0}{=}f(x)+\\langle\\nabla f(x),h\\rangle+\\frac12\\langle H_f(x)\\cdot h,h\\rangle+o(\\|h\\|^2)$, $f(x+h)\\underset{h\\to0}{=}f(x)+\\\
        nabla f(x)^\\top h+\\frac12h^\\top H_f(x)h+o(\\|h\\|^2)$."
      precisions: "La démonstration n'est pas exigible."
      demo: non exigible
      cours:
      - "mp-17:6"
      ex:
      - mp-17-33
      themes:
      - points-critiques
    - contenu: "Si $f$ est une fonction de classe $\\mathcal{C}^2$ sur un ouvert de $\\mathbb{R}^n$ et si $f$ admet un minimum local en $x$, alors $x$ est point critique de $f$ et $H_f(x)\\in\\mathcal{S}_n^+(\\\
        mathbb{R})$."
      precisions: "Adaptation au cas d'un maximum local."
