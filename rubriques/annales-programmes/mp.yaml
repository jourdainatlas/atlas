- intitule: Calcul différentiel et optimisation
  objectif: "En première année, l'étudiant a rencontré les dérivées partielles d'une fonction numérique définie sur un ouvert de $\\mathbb{R}^2$. Les objectifs sont de généraliser et approfondir cette étude,\
    \ en présentant les notions fondamentales de calcul différentiel dans le cadre des espaces vectoriels normés de dimension finie sur $\\mathbb{R}$, et de donner une introduction à la thématique de l'optimisation,\
    \ en lien avec le théorème des bornes atteintes. On souligne le caractère géométrique des notions, en exploitant la dérivée d'une fonction le long d'un arc et la notion de vecteur tangent à une partie\
    \ en un point. Les fonctions sont définies sur un ouvert d'un $\\mathbb{R}$-espace vectoriel normé $E$ de dimension finie et à valeurs dans un $\\mathbb{R}$-espace vectoriel normé $F$ de dimension finie\
    \ ; le choix d'une base de l'espace d'arrivée permet de se ramener au cas des fonctions à valeurs réelles."
  hors_programme:
  - Le théorème des fonctions implicites.
  - "La démonstration de l'égalité $T_xX=\\operatorname{Ker}\\mathrm{d}g(x)$."
  - La notion de différentielle seconde.
  blocs:
  - intitule: a) Dérivée selon un vecteur, dérivées partielles
    points:
    - contenu: "Dérivée de l'application $f$ au point $a$ selon le vecteur $v$."
      precisions: "Notations $\\mathrm{D}_v f(a)$, $\\mathrm{D}_v f$."
      cours:
      - "mp-17:2"
      ex:
      - mp-17-03
      themes:
      - calcul-differentiel
    - contenu: Dérivées partielles dans une base.
      precisions: "Notations $\\frac{\\partial f}{\\partial x_i}(a)$, $\\partial_i f(a)$. Lorsqu'une base de $E$ est fixée, identification entre $f(x)$ et $f(x_1,\\dots,x_n)$."
      cours:
      - "mp-17:2"
      - "ma-22:3"
      ex:
      - mp-17-02
      - mp-17-04
      themes:
      - calcul-differentiel
  - intitule: b) Différentielle
    points:
    - contenu: Application différentiable au point $a$.
      precisions: "Notation $o(h)$. Développement limité à l'ordre 1. Lorsque $f=(f_1,\\dots,f_p)$, $f$ est différentiable en $a$ si et seulement si toutes les $f_i$ le sont."
      cours:
      - "mp-17:2"
      ex:
      - mp-17-06
      - mp-17-08
      - mp-17-10
      - mp-17-05
      themes:
      - calcul-differentiel
    - contenu: Si $f$ est différentiable en $a$, alors $f$ est continue en $a$ et dérivable en $a$ selon tout vecteur.
      cours:
      - "mp-17:2"
      ex:
      - mp-17-03
      - mp-17-47
      - mp-17-09
      themes:
      - calcul-differentiel
    - contenu: "Différentielle de $f$ en $a$, encore appelée application linéaire tangente à $f$ en $a$. Unicité de la différentielle et relation $\\mathrm{d}f(a)\\cdot v=\\mathrm{D}_v f(a)$."
      precisions: "Notation $\\mathrm{d}f(a)$."
      cours:
      - "mp-17:2"
      ex:
      - mp-17-07
      - mp-17-08
      - mp-17-03
      themes:
      - calcul-differentiel
    - contenu: Application différentiable sur un ouvert $\Omega$. Différentielle sur $\Omega$.
      precisions: "Notation $\\mathrm{d}f$."
      cours:
      - "mp-17:2"
      ex:
      - mp-17-06
      - mp-17-09
      - mp-17-05
      themes:
      - calcul-differentiel
    - contenu: "Cas particuliers : application constante, application linéaire."
      cours:
      - "mp-17:2"
      ex:
      - mp-17-47
      themes:
      - calcul-differentiel
    - contenu: Lien entre différentielle et dérivées partielles.
      precisions: "Si $\\Omega$ est un ouvert de $\\mathbb{R}^n$ et si $f$ est à valeurs dans $\\mathbb{R}^m$, la matrice jacobienne de $f$ en $a$ est la matrice de $\\mathrm{d}f(a)$ dans les bases canoniques."
      cours:
      - "mp-17:2"
      ex:
      - mp-17-02
      - mp-17-06
      - mp-17-12
      themes:
      - calcul-differentiel
    - contenu: "Cas des fonctions d'une variable : si $\\Omega$ est un intervalle ouvert de $\\mathbb{R}$, la différentiabilité de $f$ en $a$ équivaut à la dérivabilité de $f$ en $a$ ; relation $f'(a)=\\\
        mathrm{d}f(a)\\cdot1$."
      cours:
      - "mp-17:2"
      themes:
      - calcul-differentiel
    - contenu: "Si l'espace $E$ est euclidien, gradient en $a$ d'une application numérique différentiable en $a$. Expression du gradient en base orthonormée."
      precisions: "Notation $\\nabla f(a)$. Interprétation géométrique : si $\\nabla f(a)\\neq0$, $\\nabla f(a)$ est positivement colinéaire au vecteur unitaire selon lequel la dérivée de $f$ en $a$ est\
        \ maximale."
      cours:
      - "mp-17:2"
      ex:
      - mp-17-09
      - mp-17-48
      - mp-17-49
      themes:
      - calcul-differentiel
      - descente-gradient
  - intitule: c) Opérations sur les applications différentiables
    points:
