      - mp-08-27
      - mp-08-28
      - mp-08-26
      - mp-08-29
      themes:
      - convergence-uniforme
      - suites-series-fonctions
    - contenu: Adaptation des résultats des paragraphes précédents au cas des séries de fonctions.
      cours:
      - "mp-08:5"
      ex:
      - mp-08-33
      - mp-08-32
      - mp-08-37
      - mp-08-39
      - mp-08-40
      - mp-08-34
      themes:
      - suites-series-fonctions
      - interversions
      - fonction-zeta
    - contenu: "Convergence normale d'une série de fonctions. La convergence normale implique la convergence uniforme."
      precisions: "La convergence normale implique la convergence absolue en tout point. Exemples d'études de fonctions définies comme sommes de séries : régularité, étude asymptotique, utilisation de la\
        \ comparaison série-intégrale."
      cours:
      - "mp-08:5"
      ex:
      - mp-08-23
      - mp-08-24
      - mp-08-26
      - mp-08-36
      - mp-08-41
      - mp-08-43
      themes:
