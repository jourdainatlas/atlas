  - intitule: "d) Applications de classe $\\mathcal{C}^1$"
    points:
    - contenu: "Une application $f$ est dite de classe $\\mathcal{C}^1$ sur un ouvert $\\Omega$ si elle est différentiable sur $\\Omega$ et si $\\mathrm{d}f$ est continue sur $\\Omega$."
      cours:
      - "mp-17:4"
