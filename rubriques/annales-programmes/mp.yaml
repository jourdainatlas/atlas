    points:
    - contenu: "Théorème d'Abel radial : si $\\sum a_n x^n$ a pour rayon de convergence $R\\in\\mathbb{R}_+^*$ et si $\\sum a_n R^n$ converge, alors $\\sum_{n=0}^{+\\infty}a_n x^n\\xrightarrow[x\\to R^-]{}\\\
        sum_{n=0}^{+\\infty}a_n R^n$."
      precisions: La démonstration est hors programme.
      demo: hors programme
