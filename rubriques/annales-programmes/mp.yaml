# Programme officiel « Programme de mathématiques de MP (seconde année) » (Bulletin officiel n° 31 du 26 août 2021, annexe 1 (Classes préparatoires MP et MPI, programme de mathématiques)), structuré pour la vue « Programme »
# des Annales (MEMO_atlas_annales.md §45). Liens : cours « chapitre:section » (rang du sommaire, à partir de 1),
# exercices, thèmes d'annales ; un point sans cours ni exercice est affiché « à venir ».
id: mp
intitule: Programme de mathématiques de MP (seconde année)
source:
  nom: Bulletin officiel n° 31 du 26 août 2021, annexe 1 (Classes préparatoires MP et MPI, programme de mathématiques)
  url: "https://cache.media.education.gouv.fr/file/31/08/5/ensecsup702_annexes_1417085.pdf"
preambule: "Ce programme, commun aux classes MP et MPI, comprend trois sections d'algèbre (structures algébriques usuelles, réduction des endomorphismes et des matrices carrées, endomorphismes d'un espace\
  \ euclidien), puis la topologie des espaces vectoriels normés, les séries numériques et vectorielles, les suites et séries de fonctions et les séries entières, les fonctions vectorielles, l'intégration\
  \ sur un intervalle quelconque, les variables aléatoires discrètes, les équations différentielles linéaires et le calcul différentiel et l'optimisation. Chaque section comporte un bandeau définissant\
  \ les objectifs essentiels et délimitant le cadre d'étude, puis un texte en deux colonnes : à gauche les contenus exigibles, à droite les capacités exigibles, notations et limites. Les points signalés\
  \ « hors programme » ne doivent pas être traités ni évalués, et l'ordre de présentation des sections ne doit pas être interprété comme un modèle de progression."
sections:
- intitule: Structures algébriques usuelles
  objectif: "L'étude des structures algébriques offre l'occasion d'approfondir plusieurs points abordés en première année : arithmétique de $\\mathbb{Z}$ et de $\\mathbb{K}[X]$, congruences, algèbre linéaire,\
    \ groupe symétrique, groupes issus de l'algèbre linéaire, ou, ultérieurement, de la géométrie des espaces euclidiens. Le paragraphe relatif aux polynômes permet de revenir sur l'étude menée en première\
    \ année, dans un cadre étendu et dans un esprit plus algébrique mettant l'accent sur la notion d'idéal."
  hors_programme:
  - "La démonstration du théorème de d'Alembert-Gauss."
  blocs:
  - intitule: a) Compléments sur les groupes
    points:
    - contenu: Intersection de sous-groupes.
      cours:
      - "ma-11:3"
      - "mp-01:2"
      ex:
      - ma-11-20
      themes:
      - groupes
    - contenu: "Sous-groupe engendré par une partie. Partie génératrice d'un groupe."
      cours:
      - "mp-01:2"
      ex:
      - mp-01-43
      - mp-01-05
      - ma-11-20
      - ma-11-50
      - mp-01-09
      themes:
      - groupes
    - contenu: "Sous-groupes du groupe $(\\mathbb{Z},+)$."
      cours:
      - "ma-12:2"
      - "mp-01:4"
      ex:
      - mp-01-01
      - mp-01-27
      themes:
      - groupes
      - arithmetique
    - contenu: "Groupe $(\\mathbb{Z}/n\\mathbb{Z},+)$. Générateurs de $\\mathbb{Z}/n\\mathbb{Z}$."
      cours:
      - "mp-01:2"
      ex:
      - mp-01-35
      - mp-01-01
      - mp-01-46
      themes:
      - groupes-cycliques
      - congruences
    - contenu: Groupe monogène, groupe cyclique.
      precisions: "Groupe des racines $n$-ièmes de l'unité."
      cours:
      - "mp-01:2"
      ex:
      - mp-01-01
      - mp-01-02
      - mp-01-42
      - mp-01-70
      themes:
      - groupes-cycliques
      - groupes
    - contenu: "Tout groupe monogène infini est isomorphe à $(\\mathbb{Z},+)$. Tout groupe monogène fini de cardinal $n$ est isomorphe à $(\\mathbb{Z}/n\\mathbb{Z},+)$."
      cours:
      - "mp-01:2"
      ex:
      - mp-01-01
      - mp-01-43
      themes:
      - groupes-cycliques
    - contenu: "Ordre d'un élément d'un groupe. Si $x$ est d'ordre fini $d$ et si $e$ désigne le neutre de $G$, alors, pour tout $n\\in\\mathbb{Z}$, $x^n=e \\iff d\\mid n$."
      precisions: "L'ordre de $x$ est le cardinal du sous-groupe de $G$ engendré par $x$."
      cours:
      - "mp-01:2"
      ex:
      - mp-01-04
      - mp-01-06
      - mp-01-38
      - mp-01-44
      - mp-01-70
      themes:
      - groupes-cycliques
      - groupes
    - contenu: "L'ordre d'un élément d'un groupe fini divise le cardinal du groupe."
      precisions: "La démonstration n'est exigible que pour $G$ commutatif."
      demo: non exigible (sauf G commutatif)
      cours:
      - "mp-01:2"
      ex:
      - ma-11-31
      - mp-01-44
      - ma-11-49
      - mp-01-07
      themes:
      - groupes
      - groupes-cycliques
  - intitule: b) Compléments sur les anneaux
    points:
    - contenu: "Produit fini d'anneaux."
      cours:
      - "mp-01:3"
      ex:
      - mp-01-24
      - mp-01-62
      - mp-01-26
      themes:
      - anneaux
    - contenu: "Idéal d'un anneau commutatif."
      precisions: "Noyau d'un morphisme d'anneaux commutatifs."
      cours:
      - "mp-01:3"
      ex:
      - mp-01-13
      - mp-01-15
      - mp-01-28
      - mp-01-21
      - mp-01-23
      - mp-01-30
      themes:
      - anneaux
    - contenu: Idéal engendré par un élément.
      precisions: Notation $xA$.
      cours:
      - "mp-01:3"
      ex:
      - mp-01-22
      - mp-01-25
      - mp-01-68
      themes:
      - anneaux
    - contenu: Divisibilité dans un anneau commutatif intègre.
      precisions: "Interprétation en termes d'idéaux."
      cours:
      - "mp-01:3"
      ex:
      - mp-01-68
      themes:
      - anneaux
  - intitule: "c) Idéaux de $\\mathbb{Z}$"
    points:
    - contenu: "Idéaux de $\\mathbb{Z}$."
      cours:
      - "mp-01:4"
      ex:
      - mp-01-27
      - mp-01-28
      - mp-01-54
      - mp-01-30
      themes:
      - anneaux
      - arithmetique
    - contenu: "Définition du PGCD de $n\\geqslant 2$ entiers relatifs en termes d'idéaux, relation de Bézout."
      precisions: Lien avec le programme de première année.
      cours:
      - "mp-01:4"
      - "ma-12:3"
      - "ma-12:4"
      ex:
      - ma-12-20
      - mp-01-23
      themes:
      - pgcd-bezout
  - intitule: "d) Anneaux $\\mathbb{Z}/n\\mathbb{Z}$"
    points:
    - contenu: "Anneau $\\mathbb{Z}/n\\mathbb{Z}$. Inversibles de $\\mathbb{Z}/n\\mathbb{Z}$. Condition nécessaire et suffisante pour que $\\mathbb{Z}/n\\mathbb{Z}$ soit un corps."
      precisions: "Notation $\\mathbb{F}_p$ lorsque $p$ est premier."
      cours:
      - "mp-01:5"
      ex:
      - mp-01-32
      - mp-01-33
      - mp-01-34
      - mp-01-37
      - mp-01-39
      - mp-01-45
      themes:
      - congruences
      - anneaux
    - contenu: "Théorème chinois : isomorphisme naturel de $\\mathbb{Z}/mn\\mathbb{Z}$ sur $\\mathbb{Z}/m\\mathbb{Z}\\times\\mathbb{Z}/n\\mathbb{Z}$ si $m\\wedge n=1$ ; extension à plus de deux facteurs."
      precisions: "Application aux systèmes de congruences et à la résolution de systèmes d'équations dans $\\mathbb{Z}/n\\mathbb{Z}$."
      cours:
      - "mp-01:5"
      ex:
      - mp-01-36
      - mp-01-40
      - mp-01-41
      - mp-01-47
      themes:
      - restes-chinois
      - congruences
    - contenu: "Indicatrice d'Euler $\\varphi$. Calcul à l'aide de la décomposition en produits de facteurs premiers."
      precisions: Relation $\varphi(mn)=\varphi(m)\varphi(n)$ si $m$ et $n$ sont premiers entre eux ; expression de $\varphi(p^k)$ pour $p$ premier.
      cours:
      - "mp-01:5"
      ex:
      - mp-14-18
      - mp-01-70
      themes:
      - fermat-euler
    - contenu: "Théorème d'Euler."
      precisions: Lien avec le petit théorème de Fermat.
      cours:
      - "mp-01:5"
      - "ma-12:6"
      ex:
      - ma-12-44
      - mp-01-38
      - mp-01-44
      - mp-01-48
      - mp-01-79
      themes:
      - fermat-euler
      - congruences
  - intitule: "e) Anneaux $\\mathbb{K}[X]$"
    points:
    - contenu: "Idéaux de $\\mathbb{K}[X]$."
      precisions: "Dans ce paragraphe, $\\mathbb{K}$ est un sous-corps de $\\mathbb{C}$."
      cours:
      - "mp-01:6"
      ex:
      - mp-01-49
      - mp-01-54
      themes:
      - polynomes
      - anneaux
    - contenu: "Définition du PGCD de $n\\geqslant 2$ polynômes en termes d'idéaux, relation de Bézout."
      precisions: Par convention, le PGCD est unitaire.
      cours:
      - "mp-01:6"
      - "ma-13:6"
      ex:
      - ma-13-28
      - ma-13-29
      - mp-01-56
      - mp-01-58
      - ma-13-32
      themes:
      - polynomes
    - contenu: "Irréductibles de $\\mathbb{K}[X]$. Existence et unicité de la décomposition en facteurs irréductibles unitaires."
      cours:
      - "mp-01:6"
      - "ma-13:7"
      ex:
      - mp-01-53
      - mp-01-54
      themes:
      - polynomes
    - contenu: "Irréductibles de $\\mathbb{C}[X]$ et $\\mathbb{R}[X]$."
      precisions: "La démonstration du théorème de d'Alembert-Gauss est hors programme. L'étude des irréductibles de $\\mathbb{K}[X]$ pour un corps autre que $\\mathbb{R}$ ou $\\mathbb{C}$ n'est pas un\
        \ objectif du programme."
      cours:
      - "ma-13:7"
      - "mp-01:6"
      ex:
      - mp-01-51
      - ma-13-34
      - ma-13-35
      - ma-13-36
      - ma-13-37
      themes:
      - polynomes
      - racines-polynomes
  - intitule: f) Algèbres
    points:
    - contenu: Algèbre.
      precisions: "Les algèbres sont unitaires. Exemples : $\\mathbb{K}[X]$, $\\mathcal{L}(E)$, $\\mathcal{M}_n(\\mathbb{K})$, $\\mathcal{F}(X,\\mathbb{K})$."
      cours:
      - "mp-01:7"
      ex:
      - mp-01-61
      - mp-01-63
      - mp-01-66
      themes:
      - algebres
    - contenu: "Sous-algèbre. Morphisme d'algèbres."
      cours:
      - "mp-01:7"
      ex:
      - mp-01-60
      - mp-01-63
      - mp-01-64
      - mp-01-65
      themes:
      - algebres
- intitule: Réduction des endomorphismes et des matrices carrées
  objectif: "La réduction des endomorphismes et des matrices carrées prolonge les notions d'algèbre linéaire vues en première année ; elle trouve des applications et des illustrations dans d'autres domaines\
    \ du programme (topologie, équations différentielles, systèmes dynamiques discrets, chaînes de Markov) et permet de tisser des liens entre l'algèbre linéaire et l'algèbre générale, notamment polynomiale.\
    \ Le but est de donner une introduction substantielle au problème de la réduction, selon deux approches qu'il convient d'identifier : la première, de nature géométrique, repose sur les notions de sous-espace\
    \ stable et d'éléments propres ; la seconde, plus algébrique, fait appel aux polynômes annulateurs. Sans soulever de difficulté, on signale que les notions d'algèbre linéaire de première année s'étendent\
    \ au cas d'un corps de base quelconque ; pour éviter les difficultés liées aux polynômes en caractéristique non nulle, la section est traitée sous l'hypothèse que $\\mathbb{K}$ est un sous-corps de\
    \ $\\mathbb{C}$."
  hors_programme:
  - La notion de valeur spectrale.
  blocs:
  - intitule: "a) Compléments d'algèbre linéaire"
    points:
    - contenu: "Somme, somme directe d'une famille finie de sous-espaces vectoriels."
      precisions: Projecteurs associés à une décomposition de $E$ en somme directe.
      cours:
      - "mp-02:2"
      - "ma-14:5"
      ex:
      - ma-14-33
      - mp-02-01
      themes:
      - espaces-vectoriels
      - projecteurs
    - contenu: "Si $F_1,\\dots,F_p$ sont des sous-espaces de dimension finie, $\\dim\\big(\\sum_{i=1}^p F_i\\big)\\leqslant\\sum_{i=1}^p\\dim(F_i)$, avec égalité si et seulement si la somme est directe."
      precisions: Base adaptée à une décomposition en somme directe.
      cours:
      - "mp-02:2"
      - "ma-15:3"
      ex:
      - ma-14-33
      themes:
      - espaces-vectoriels
    - contenu: "Si $E_1,\\dots,E_p$ sont des sous-espaces de $E$ tels que $E=\\bigoplus E_i$ et si $u_i\\in\\mathcal{L}(E_i,F)$ pour tout $i$, alors il existe une et une seule $u\\in\\mathcal{L}(E,F)$ telle\
        \ que $u_{|E_i}=u_i$ pour tout $i$."
      cours:
      - "mp-02:2"
      ex:
      - mp-02-36
      themes:
      - applications-lineaires
    - contenu: Matrices définies par blocs.
      precisions: Interprétation géométrique des blocs.
      cours:
      - "mp-02:2"
      - "mp-02:3"
      ex:
      - mp-02-02
      - mp-02-04
      themes:
      - matrices-blocs
    - contenu: Opérations par blocs de tailles compatibles (combinaison linéaire, produit, transposition).
      precisions: "La démonstration concernant le produit par blocs n'est pas exigible. Transvections par blocs. Invariance du déterminant."
      demo: non exigible (produit par blocs)
      cours:
      - "mp-02:2"
      ex:
      - mp-02-02
      - mp-02-40
      themes:
      - matrices-blocs
    - contenu: "Déterminant d'une matrice triangulaire par blocs."
      cours:
      - "mp-02:2"
      ex:
      - mp-02-39
      - ma-17-45
      - mp-02-41
      - mp-02-42
      themes:
      - matrices-blocs
      - determinants
  - intitule: "b) Éléments propres d'un endomorphisme, d'une matrice carrée"
    points:
    - contenu: Sous-espace stable par un endomorphisme. Endomorphisme induit.
      precisions: En dimension finie, traduction matricielle.
      cours:
      - "mp-02:3"
      ex:
      - mp-02-07
      - mp-02-09
      - mp-03-25
      - mp-03-24
      - mp-03-43
      - mp-02-35
      themes:
      - sous-espaces-stables
    - contenu: Droite stable par un endomorphisme. Valeur propre, vecteur propre (non nul), sous-espace propre.
      precisions: Équation aux éléments propres $u(x)=\lambda x$.
      cours:
      - "mp-02:3"
      ex:
      - mp-02-05
      - mp-02-10
      - mp-02-11
      - mp-02-12
      themes:
      - reduction
      - sous-espaces-stables
    - contenu: "Spectre d'un endomorphisme en dimension finie."
      precisions: La notion de valeur spectrale est hors programme.
      cours:
      - "mp-02:3"
      ex:
      - mp-02-12
      - mp-02-16
      themes:
      - reduction
      - gershgorin
    - contenu: "La somme d'une famille finie de sous-espaces propres d'un endomorphisme est directe."
      precisions: Toute famille de vecteurs propres associés à des valeurs propres distinctes est libre.
      cours:
      - "mp-02:3"
      ex:
      - mp-02-33
      - mp-02-30
      themes:
      - reduction
    - contenu: "Le spectre d'un endomorphisme d'un espace de dimension finie $n$ est fini, et de cardinal au plus $n$."
      cours:
      - "mp-02:3"
      ex:
      - mp-02-51
      themes:
      - reduction
    - contenu: Si deux endomorphismes $u$ et $v$ commutent, tout sous-espace propre de $u$ est stable par $v$.
      precisions: "Le noyau et l'image de $u$ sont stables par $v$."
      cours:
      - "mp-02:3"
      ex:
      - mp-02-07
      - mp-02-08
      - mp-02-37
      - mp-02-36
      - mp-02-51
      themes:
      - sous-espaces-stables
      - reduction
    - contenu: "Valeur propre, vecteur propre, sous-espace propre et spectre d'une matrice carrée."
      precisions: "Équation aux éléments propres $MX=\\lambda X$. Deux matrices semblables ont même spectre. Si $\\mathbb{K}$ est un sous-corps de $\\mathbb{K}'$ et si $M\\in\\mathcal{M}_n(\\mathbb{K})$,\
        \ le spectre de $M$ dans $\\mathbb{K}$ est contenu dans le spectre de $M$ dans $\\mathbb{K}'$."
      cours:
      - "mp-02:3"
      ex:
      - mp-02-06
      - mp-02-12
      - mp-02-32
      themes:
      - reduction
  - intitule: c) Polynôme caractéristique
    points:
    - contenu: "Polynôme caractéristique d'une matrice carrée, d'un endomorphisme d'un espace vectoriel de dimension finie."
      precisions: Par convention le polynôme caractéristique est unitaire. Notations $\chi_A$, $\chi_u$. Coefficients du polynôme caractéristique de degrés $0$ et $n-1$.
      cours:
      - "mp-02:4"
      ex:
      - mp-02-13
      - mp-02-14
      - mp-02-15
      - mp-02-48
      themes:
      - cayley-hamilton
      - reduction
    - contenu: "Les valeurs propres d'un endomorphisme d'un espace vectoriel de dimension finie sont les racines de son polynôme caractéristique."
      precisions: Deux matrices semblables ont même polynôme caractéristique.
      cours:
      - "mp-02:4"
      ex:
      - mp-02-13
      - mp-02-19
      - mp-02-14
      - mp-02-45
      themes:
      - cayley-hamilton
      - reduction
    - contenu: "Polynôme caractéristique d'une matrice triangulaire."
      cours:
      - "mp-02:4"
      ex:
      - mp-02-44
      themes:
      - cayley-hamilton
    - contenu: "Polynôme caractéristique d'un endomorphisme induit."
      cours:
      - "mp-02:4"
      ex:
      - mp-03-07
      themes:
      - cayley-hamilton
      - sous-espaces-stables
    - contenu: "Multiplicité d'une valeur propre. La dimension du sous-espace propre associé à $\\lambda$ est majorée par la multiplicité de $\\lambda$."
      cours:
      - "mp-02:4"
      ex:
      - mp-02-13
      - mp-02-20
      - mp-02-41
      themes:
      - diagonalisation
      - reduction
  - intitule: d) Endomorphismes et matrices carrées diagonalisables
    points:
    - contenu: "Un endomorphisme d'un espace vectoriel $E$ de dimension finie est dit diagonalisable s'il existe une base de $E$ dans laquelle sa matrice est diagonale."
      precisions: Une telle base est constituée de vecteurs propres. Cas des projecteurs, des symétries.
      cours:
      - "mp-02:5"
      ex:
      - mp-02-29
      - mp-02-33
      - mp-02-34
      - mp-02-30
      themes:
      - diagonalisation
    - contenu: "Pour qu'un endomorphisme soit diagonalisable, il faut et il suffit que la somme de ses sous-espaces propres soit égale à $E$."
      precisions: Caractérisation par la somme des dimensions des sous-espaces propres.
      cours:
      - "mp-02:5"
      ex:
      - mp-02-18
      - mp-02-25
      - mp-02-31
      - mp-02-33
      themes:
      - diagonalisation
    - contenu: Une matrice carrée est dite diagonalisable si elle est semblable à une matrice diagonale.
      precisions: "Interprétation en termes d'endomorphisme. Dans les exercices pratiques, on se limite à $n=2$ ou $n=3$."
      cours:
      - "mp-02:5"
      ex:
      - mp-02-17
      - mp-02-24
      - mp-02-20
      - mp-02-21
      - mp-02-22
      - mp-02-38
      themes:
      - diagonalisation
    - contenu: "Cas d'un endomorphisme d'un espace de dimension $n$ admettant $n$ valeurs propres distinctes."
      precisions: Traduction matricielle.
      cours:
      - "mp-02:5"
      ex:
      - mp-02-29
      - mp-02-30
      - mp-02-37
      themes:
      - diagonalisation
    - contenu: "Pour qu'un endomorphisme $u$ soit diagonalisable, il faut et il suffit que $\\chi_u$ soit scindé et que, pour toute valeur propre de $u$, la dimension de l'espace propre associé soit égale\
        \ à sa multiplicité."
      precisions: Traduction matricielle. Cas où $\chi_u$ est scindé à racines simples.
      cours:
      - "mp-02:5"
      ex:
      - mp-02-17
      - mp-02-20
      - mp-02-23
      - mp-02-26
      - mp-02-42
      themes:
      - diagonalisation
  - intitule: e) Endomorphismes et matrices carrées trigonalisables
    points:
    - contenu: "Un endomorphisme d'un espace vectoriel $E$ de dimension finie est dit trigonalisable s'il existe une base de $E$ dans laquelle sa matrice est triangulaire."
      precisions: Interprétation géométrique.
      cours:
      - "mp-02:6"
      ex:
      - mp-02-43
      - mp-03-25
      - mp-03-30
      themes:
      - trigonalisation
    - contenu: Une matrice carrée est dite trigonalisable si elle est semblable à une matrice triangulaire.
      precisions: "Interprétation en termes d'endomorphisme. La pratique de la trigonalisation n'est pas un objectif du programme."
      cours:
      - "mp-02:6"
      ex:
      - mp-02-43
      themes:
      - trigonalisation
    - contenu: Un endomorphisme est trigonalisable si et seulement si son polynôme caractéristique est scindé.
      precisions: "Traduction matricielle. Expression à l'aide des valeurs propres de la trace et du déterminant d'un endomorphisme trigonalisable, d'une matrice trigonalisable."
      cours:
      - "mp-02:6"
      ex:
      - mp-02-43
      - mp-02-44
      - mp-02-45
      - mp-02-50
      themes:
      - trigonalisation
  - intitule: f) Endomorphismes nilpotents, matrices nilpotentes
    points:
    - contenu: "Endomorphisme nilpotent d'un espace vectoriel $E$ de dimension finie, matrice nilpotente."
      cours:
      - "mp-02:7"
      ex:
      - mp-02-46
      - mp-02-04
      - mp-02-47
      - mp-02-48
      themes:
      - nilpotents
    - contenu: "Un endomorphisme est nilpotent si et seulement s'il est trigonalisable avec pour seule valeur propre $0$."
      precisions: Caractérisation des endomorphismes nilpotents et des matrices nilpotentes par le polynôme caractéristique.
      cours:
      - "mp-02:7"
      ex:
      - mp-03-44
      - mp-02-50
      - mp-02-51
      themes:
      - nilpotents
    - contenu: "L'indice de nilpotence est majoré par la dimension de $E$."
      cours:
      - "mp-02:7"
      ex:
      - mp-02-49
      - mp-03-43
      themes:
      - nilpotents
  - intitule: "g) Polynômes d'un endomorphisme, d'une matrice carrée"
    points:
    - contenu: "Pour $u$ dans $\\mathcal{L}(E)$, morphisme d'algèbres $P\\mapsto P(u)$ de $\\mathbb{K}[X]$ dans $\\mathcal{L}(E)$. Le noyau de ce morphisme est l'idéal annulateur de $u$. Son image est la\
        \ sous-algèbre commutative $\\mathbb{K}[u]$ de $\\mathcal{L}(E)$."
      precisions: Traduction matricielle.
      cours:
      - "mp-03:2"
      ex:
      - mp-03-04
      - mp-03-03
      - mp-03-08
      - mp-03-35
      themes:
      - polynomes-endomorphismes
    - contenu: "Polynôme minimal d'un endomorphisme d'un espace de dimension finie, d'une matrice carrée."
      precisions: Le polynôme minimal est unitaire. Notations $\pi_u$, $\mu_u$, $\pi_M$, $\mu_M$.
      cours:
      - "mp-03:2"
      ex:
      - mp-03-01
      - mp-03-02
      - mp-03-33
      - mp-03-05
      - mp-03-06
      - mp-03-07
      themes:
      - polynomes-endomorphismes
    - contenu: "Si $d$ est le degré du polynôme minimal de $u$, alors la famille $(u^k)_{0\\leqslant k\\leqslant d-1}$ est une base de $\\mathbb{K}[u]$."
      cours:
      - "mp-03:2"
      ex:
      - mp-03-35
      - mp-03-36
      themes:
      - polynomes-endomorphismes
    - contenu: Si $P$ annule $u$, toute valeur propre de $u$ est racine de $P$.
      precisions: Si $u(x)=\lambda x$, alors $P(u)(x)=P(\lambda)x$.
      cours:
      - "mp-03:2"
      ex:
      - mp-03-01
      - mp-03-16
      - mp-03-18
      - mp-03-21
      themes:
      - polynomes-endomorphismes
    - contenu: "Les racines de $\\pi_u$ dans $\\mathbb{K}$ sont les valeurs propres de $u$."
      cours:
      - "mp-03:2"
      ex:
      - mp-03-33
      - mp-03-34
      themes:
      - polynomes-endomorphismes
  - intitule: h) Lemme de décomposition des noyaux
    points:
    - contenu: "Si $P_1,\\dots,P_r$ sont des éléments de $\\mathbb{K}[X]$ deux à deux premiers entre eux de produit égal à $P$, alors $\\operatorname{Ker}(P(u))=\\bigoplus_{i=1}^r\\operatorname{Ker}(P_i(u))$."
