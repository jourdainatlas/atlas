      - suites-series-fonctions
    - contenu: "Norme de la convergence uniforme sur l'espace des fonctions bornées à valeurs dans $\\mathbb{R}$ ou $\\mathbb{C}$."
      cours:
      - "mp-04:2"
      - "mp-08:2"
      ex:
      - mp-04-24
      - mp-04-19
      - mp-04-11
      themes:
      - convergence-uniforme
      - espaces-normes
    - contenu: "Convergence simple, convergence uniforme, convergence normale d'une série de fonctions."
      precisions: "Utilisation d'une majoration uniforme de $|f_n(x)|$ pour établir la convergence normale de $\\sum f_n$."
      cours:
      - "mp-08:5"
      ex:
