    - contenu: Covariance de deux variables aléatoires.
      cours:
      - "mp-15:3"
      ex:
      - mp-15-16
      - mp-15-17
      - mp-15-19
      - mp-15-28
      themes:
      - covariance
    - contenu: "Relation $\\mathrm{Cov}(X,Y)=\\mathrm{E}(XY)-\\mathrm{E}(X)\\mathrm{E}(Y)$, cas de deux variables indépendantes."
      cours:
      - "mp-15:3"
      ex:
      - mp-15-16
      - mp-15-19
      - mp-15-41
      themes:
      - covariance
    - contenu: "Variance d'une somme finie, cas de variables deux à deux indépendantes."
      cours:
      - "mp-15:3"
      ex:
      - mp-15-17
      - mp-15-19
      - mp-15-28
      - mp-15-41
      themes:
      - covariance
      - esperance-variance
  - intitule: C - Espérance et variance · c) Fonctions génératrices
    points:
    - contenu: "Fonction génératrice de la variable aléatoire $X$ à valeurs dans $\\mathbb{N}$ : $G_X(t)=\\mathrm{E}\\big(t^X\\big)=\\sum_{n=0}^{+\\infty}P(X=n)t^n$."
      precisions: "La série entière définissant $G_X$ est de rayon $\\geqslant1$ et converge normalement sur $[-1,1]$. Continuité de $G_X$. Les étudiants doivent savoir calculer rapidement la fonction génératrice\
        \ d'une variable aléatoire de Bernoulli, binomiale, géométrique, de Poisson."
      cours:
      - "mp-15:5"
      ex:
      - mp-15-32
      - mp-15-35
      - mp-15-34
      themes:
      - fonction-generatrice-va
    - contenu: "La loi d'une variable aléatoire $X$ à valeurs dans $\\mathbb{N}$ est caractérisée par sa fonction génératrice $G_X$."
      cours:
      - "mp-15:5"
      ex:
      - mp-15-31
      - mp-15-41
      themes:
      - fonction-generatrice-va
    - contenu: "La variable aléatoire $X$ est d'espérance finie si et seulement si $G_X$ est dérivable en 1 ; dans ce cas $\\mathrm{E}(X)=G_X'(1)$."
      precisions: "La démonstration de la réciproque n'est pas exigible. Utilisation de $G_X$ pour calculer $\\mathrm{E}(X)$ et $\\mathrm{V}(X)$."
