- intitule: Intégration sur un intervalle quelconque
  objectif: "Cette section vise à étendre la notion d'intégrale étudiée en première année à des fonctions continues par morceaux sur un intervalle quelconque par le biais des intégrales généralisées, à\
    \ définir, dans le cadre des fonctions continues par morceaux, la notion de fonction intégrable, à compléter la section dédiée aux suites et aux séries de fonctions par les théorèmes de convergence\
    \ dominée et d'intégration terme à terme, et à étudier les fonctions définies par des intégrales dépendant d'un paramètre. On évite tout excès de rigueur dans la rédaction : dans les calculs concrets\
    \ mettant en jeu l'intégration par parties ou le changement de variable, on n'impose pas de rappeler les hypothèses de régularité des résultats utilisés, et dans l'application des théorèmes de passage\
    \ à la limite sous l'intégrale ou de régularité des intégrales à paramètre, on se limite à la vérification des hypothèses cruciales, sans insister sur la continuité par morceaux en la variable d'intégration.\
    \ Les fonctions considérées sont définies sur un intervalle de $\\mathbb{R}$ et à valeurs dans $\\mathbb{K}$, ensemble des nombres réels ou des nombres complexes."
  hors_programme:
  - La démonstration du théorème de convergence dominée est hors programme.
  - "La démonstration du théorème d'intégration terme à terme est hors programme."
  blocs:
  - intitule: a) Fonctions continues par morceaux
    points:
    - contenu: "Fonctions continues par morceaux sur un segment, sur un intervalle de $\\mathbb{R}$."
      cours:
      - "ma-18:2"
      - "mp-12:2"
      ex:
      - ma-18-01
      themes:
      - integration-segment
    - contenu: "Intégrale sur un segment d'une fonction continue par morceaux."
      precisions: "Brève extension des propriétés de l'intégrale d'une fonction continue sur un segment étudiées en première année. Aucune construction n'est exigible."
      cours:
      - "ma-18:3"
      ex:
      - ma-18-01
      - ma-18-03
      - ma-18-04
      - ma-18-05
      - ma-18-17
      themes:
      - integration-segment
  - intitule: "b) Intégrales généralisées sur un intervalle de la forme $[a,+\\infty[$"
    points:
    - contenu: "Pour $f$ continue par morceaux sur $[a,+\\infty[$, l'intégrale $\\int_a^{+\\infty}f(t)\\,\\mathrm{d}t$ est dite convergente si $\\int_a^x f(t)\\,\\mathrm{d}t$ a une limite finie lorsque\
        \ $x$ tend vers $+\\infty$."
      precisions: "Notations $\\int_a^{+\\infty}f$, $\\int_a^{+\\infty}f(t)\\,\\mathrm{d}t$. Intégrale convergente (resp. divergente) en $+\\infty$."
      cours:
      - "mp-12:2"
      ex:
      - mp-12-01
      - mp-12-02
      - mp-12-05
      themes:
      - integrales-generalisees
    - contenu: "Si $f$ est continue par morceaux sur $[a,+\\infty[$ et à valeurs positives, alors $\\int_a^{+\\infty}f(t)\\,\\mathrm{d}t$ converge si et seulement si $x\\mapsto\\int_a^x f(t)\\,\\mathrm{d}t$\
        \ est majorée."
      cours:
      - "mp-12:2"
      ex:
      - mp-12-38
      - mp-12-31
      - mp-12-40
      themes:
      - integrales-generalisees
    - contenu: "Si $f$ et $g$ sont deux fonctions continues par morceaux sur $[a,+\\infty[$ telles que $0\\leqslant f\\leqslant g$, la convergence de $\\int_a^{+\\infty}g$ implique celle de $\\int_a^{+\\\
        infty}f$."
      cours:
      - "mp-12:2"
      ex:
      - mp-12-06
      - mp-12-03
      themes:
      - integrales-generalisees
  - intitule: c) Intégrales généralisées sur un intervalle quelconque
    points:
    - contenu: "Adaptation du paragraphe précédent aux fonctions continues par morceaux définies sur un intervalle semi-ouvert ou ouvert de $\\mathbb{R}$."
      precisions: "Notations $\\int_a^b f$, $\\int_a^b f(t)\\,\\mathrm{d}t$. Intégrale convergente (resp. divergente) en $b$, en $a$."
      cours:
      - "mp-12:2"
      ex:
      - mp-12-01
      - mp-12-02
      - mp-12-04
      themes:
      - integrales-generalisees
    - contenu: "Propriétés des intégrales généralisées : linéarité, positivité, croissance, relation de Chasles."
      cours:
      - "mp-12:2"
      ex:
      - mp-12-02
      themes:
      - integrales-generalisees
    - contenu: "Intégration par parties sur un intervalle quelconque : $\\int_a^b f(t)g'(t)\\,\\mathrm{d}t=\\big[fg\\big]_a^b-\\int_a^b f'(t)g(t)\\,\\mathrm{d}t$."
      precisions: "La démonstration n'est pas exigible. L'existence des limites finies du produit $fg$ aux bornes de l'intervalle assure que les intégrales de $fg'$ et $f'g$ sont de même nature. Pour les\
        \ applications pratiques, on ne demande pas de rappeler les hypothèses de régularité."
      demo: non exigible
      cours:
      - "mp-12:4"
      ex:
      - mp-12-12
      - mp-12-13
      - mp-12-17
      themes:
      - integrales-generalisees
    - contenu: "Changement de variable : si $\\varphi:\\,]\\alpha,\\beta[\\,\\to\\,]a,b[$ est une bijection strictement croissante de classe $\\mathcal{C}^1$, et si $f$ est continue sur $]a,b[$, alors $\\\
        int_a^b f(t)\\,\\mathrm{d}t$ et $\\int_\\alpha^\\beta (f\\circ\\varphi)(u)\\varphi'(u)\\,\\mathrm{d}u$ sont de même nature, et égales en cas de convergence."
      precisions: "La démonstration n'est pas exigible. Adaptation au cas où $\\varphi$ est strictement décroissante. On applique ce résultat sans justification dans les cas de changements de variable usuels."
      demo: non exigible
      cours:
      - "mp-12:4"
      ex:
      - mp-12-14
      - mp-12-15
      - mp-12-18
      themes:
      - integrales-generalisees
  - intitule: d) Intégrales absolument convergentes et fonctions intégrables
    points:
    - contenu: Intégrale absolument convergente. La convergence absolue implique la convergence. Inégalité triangulaire.
      precisions: "L'étude des intégrales semi-convergentes n'est pas un objectif du programme."
      cours:
      - "mp-12:3"
      ex:
      - mp-12-06
      - mp-12-24
      themes:
      - integrales-generalisees
    - contenu: Une fonction est dite intégrable sur un intervalle $I$ si elle est continue par morceaux sur $I$ et son intégrale sur $I$ est absolument convergente.
      precisions: "Notations $\\int_I f$, $\\int_I f(t)\\,\\mathrm{d}t$. Pour $I=[a,b[$ (respectivement $]a,b]$), fonction intégrable en $b$ (resp. en $a$)."
      cours:
      - "mp-12:3"
      ex:
      - mp-12-06
      - mp-12-08
      - mp-12-11
      themes:
      - integrales-generalisees
    - contenu: "Espace vectoriel $L^1(I,\\mathbb{K})$ des fonctions intégrables sur $I$ à valeurs dans $\\mathbb{K}$."
      cours:
      - "mp-12:3"
      ex:
      - mp-12-38
      themes:
      - integrales-generalisees
    - contenu: "Si $f$ est continue, intégrable et positive sur $I$, et si $\\int_I f(t)\\,\\mathrm{d}t=0$, alors $f$ est identiquement nulle."
      cours:
      - "mp-12:3"
      themes:
      - integrales-generalisees
    - contenu: "Théorème de comparaison : pour $f$ et $g$ deux fonctions continues par morceaux sur $[a,+\\infty[$ : si $f(t)\\underset{t\\to+\\infty}{=}O(g(t))$, alors l'intégrabilité de $g$ en $+\\infty$\
        \ implique celle de $f$ ; si $f(t)\\underset{t\\to+\\infty}{\\sim}g(t)$, alors l'intégrabilité de $f$ en $+\\infty$ est équivalente à celle de $g$."
      precisions: "Adaptation au cas d'un intervalle quelconque. Le résultat s'applique en particulier si $f(t)\\underset{t\\to+\\infty}{=}o(g(t))$."
      cours:
      - "mp-12:3"
      ex:
      - mp-12-06
      - mp-12-07
      - mp-12-08
      themes:
      - integrales-generalisees
      - equivalents
    - contenu: "Fonctions de référence : pour $\\alpha\\in\\mathbb{R}$, intégrales de Riemann : étude de l'intégrabilité de $t\\mapsto\\frac{1}{t^\\alpha}$ en $+\\infty$, en $0^+$ ; étude de l'intégrabilité\
        \ de $t\\mapsto\\mathrm{e}^{-\\alpha t}$ en $+\\infty$."
      precisions: "L'intégrabilité de $t\\mapsto\\ln t$ en 0 peut être directement utilisée. Les résultats relatifs à l'intégrabilité de $x\\mapsto\\frac{1}{|x-a|^\\alpha}$ en $a$ peuvent être directement\
        \ utilisés. Plus généralement, les étudiants doivent savoir que la fonction $x\\mapsto f(x)$ est intégrable en $a^+$ (resp. en $b^-$) si $t\\mapsto f(a+t)$ (resp. $t\\mapsto f(b-t)$) l'est en $0^+$."
      cours:
      - "mp-12:2"
      - "mp-12:3"
      ex:
      - mp-12-06
      - mp-12-03
      - mp-12-08
      themes:
      - integrales-generalisees
  - intitule: e) Suites et séries de fonctions intégrables
    points:
    - contenu: "Théorème de convergence dominée : si une suite $(f_n)$ de fonctions continues par morceaux sur $I$ converge simplement vers une fonction $f$ continue par morceaux sur $I$ et s'il existe\
        \ une fonction $\\varphi$ intégrable sur $I$ vérifiant $|f_n|\\leqslant\\varphi$ pour tout $n$, alors les fonctions $f_n$ et $f$ sont intégrables sur $I$ et $\\int_I f_n(t)\\,\\mathrm{d}t\\xrightarrow[n\\\
        to+\\infty]{}\\int_I f(t)\\,\\mathrm{d}t$."
      precisions: "Pour l'application pratique des énoncés de ce paragraphe, on vérifie les hypothèses de convergence simple et de domination (resp. convergence de la série des intégrales), sans expliciter\
        \ celles relatives à la continuité par morceaux. La démonstration est hors programme."
      demo: hors programme
      cours:
      - "mp-13:2"
      ex:
      - mp-13-01
      - mp-13-02
      - mp-13-03
      - mp-13-04
      - mp-13-06
      - mp-13-10
      themes:
      - convergence-dominee
    - contenu: "Théorème d'intégration terme à terme : si une série $\\sum f_n$ de fonctions intégrables sur $I$ converge simplement, si sa somme est continue par morceaux sur $I$, et si la série $\\sum\\\
        int_I|f_n(t)|\\,\\mathrm{d}t$ converge, alors $\\sum_{n=0}^{+\\infty}f_n$ est intégrable sur $I$ et $\\int_I\\sum_{n=0}^{+\\infty}f_n(t)\\,\\mathrm{d}t=\\sum_{n=0}^{+\\infty}\\int_I f_n(t)\\,\\\
        mathrm{d}t$."
      precisions: "La démonstration est hors programme. On présente des exemples sur lesquels cet énoncé ne s'applique pas, mais dans lesquels l'intégration terme à terme peut être justifiée par le théorème\
        \ de convergence dominée pour les sommes partielles."
      demo: hors programme
      cours:
      - "mp-13:3"
      ex:
      - mp-13-11
      - mp-13-12
      - mp-13-13
      - mp-13-14
      - mp-13-15
      - mp-13-17
      themes:
      - convergence-integrales
      - interversions
  - intitule: "f) Régularité d'une fonction définie par une intégrale à paramètre"
    points:
    - contenu: "Théorème de continuité : si $A$ et $I$ sont deux intervalles de $\\mathbb{R}$ et $f$ une fonction définie sur $A\\times I$, telle que : pour tout $t\\in I$, $x\\mapsto f(x,t)$ est continue\
        \ sur $A$ ; pour tout $x\\in A$, $t\\mapsto f(x,t)$ est continue par morceaux sur $I$ ; il existe une fonction $\\varphi$ intégrable sur $I$, telle que pour tout $(x,t)\\in A\\times I$, on ait $|f(x,t)|\\\
        leqslant\\varphi(t)$ ; alors la fonction $x\\mapsto\\int_I f(x,t)\\,\\mathrm{d}t$ est définie et continue sur $A$."
      precisions: "Pour l'application pratique des énoncés de ce paragraphe, on vérifie les hypothèses de régularité par rapport à $x$ et de domination, sans expliciter celles relatives à la continuité\
        \ par morceaux par rapport à $t$. En pratique, on vérifie l'hypothèse de domination sur tout segment de $A$, ou sur d'autres intervalles adaptés à la situation."
      cours:
      - "mp-13:4"
      ex:
      - mp-13-18
      - mp-13-19
      - mp-13-21
      - mp-13-22
      themes:
      - integrales-parametre
    - contenu: "Théorème de convergence dominée à paramètre continu : si $A$ et $I$ sont deux intervalles de $\\mathbb{R}$, $a$ une borne de $A$ et $f$ une fonction définie sur $A\\times I$ telle que :\
        \ pour tout $t\\in I$, $f(x,t)\\xrightarrow[x\\to a]{}\\ell(t)$ ; pour tout $x\\in A$, $t\\mapsto f(x,t)$ et $t\\mapsto\\ell(t)$ sont continues par morceaux sur $I$ ; il existe une fonction $\\\
        varphi$ intégrable sur $I$, telle que pour tout $(x,t)\\in A\\times I$, on ait $|f(x,t)|\\leqslant\\varphi(t)$ ; alors $\\ell$ est intégrable sur $I$ et $\\int_I f(x,t)\\,\\mathrm{d}t\\xrightarrow[x\\\
        to a]{}\\int_I\\ell(t)\\,\\mathrm{d}t$."
      precisions: "On remarque qu'il s'agit d'une simple extension du théorème relatif aux suites de fonctions."
      cours:
      - "mp-13:2"
      ex:
      - mp-13-08
      - mp-13-18
      - mp-13-35
      themes:
      - convergence-dominee
      - integrales-parametre
    - contenu: "Théorème de dérivation : si $A$ et $I$ sont deux intervalles de $\\mathbb{R}$ et $f$ une fonction définie sur $A\\times I$, telle que : pour tout $t\\in I$, $x\\mapsto f(x,t)$ est de classe\
        \ $\\mathcal{C}^1$ sur $A$ ; pour tout $x\\in A$, $t\\mapsto f(x,t)$ est intégrable sur $I$ ; pour tout $x\\in A$, $t\\mapsto\\frac{\\partial f}{\\partial x}(x,t)$ est continue par morceaux sur\
        \ $I$ ; il existe une fonction $\\varphi$ intégrable sur $I$, telle que pour tout $(x,t)\\in A\\times I$, on ait $\\left|\\frac{\\partial f}{\\partial x}(x,t)\\right|\\leqslant\\varphi(t)$ ; alors\
        \ la fonction $g:x\\mapsto\\int_I f(x,t)\\,\\mathrm{d}t$ est de classe $\\mathcal{C}^1$ sur $A$ et vérifie : $\\forall x\\in A,\\ g'(x)=\\int_I\\frac{\\partial f}{\\partial x}(x,t)\\,\\mathrm{d}t$."
      precisions: "La démonstration n'est pas exigible. En pratique, on vérifie l'hypothèse de domination sur tout segment de $A$, ou sur d'autres intervalles adaptés à la situation."
      demo: non exigible
      cours:
      - "mp-13:5"
      ex:
      - mp-13-25
      - mp-13-26
      - mp-13-27
      - mp-13-28
      - mp-13-29
      themes:
      - integrales-parametre
    - contenu: "Extension à la classe $\\mathcal{C}^k$ d'une intégrale à paramètre, sous hypothèse de domination de $t\\mapsto\\frac{\\partial^k f}{\\partial x^k}(x,t)$ et d'intégrabilité des $t\\mapsto\\\
        frac{\\partial^j f}{\\partial x^j}(x,t)$ pour $0\\leqslant j<k$."
      precisions: "Exemples d'études de fonctions définies comme intégrales à paramètre : régularité, étude asymptotique, exploitation d'une équation différentielle élémentaire."
      cours:
      - "mp-13:5"
      - "mp-13:6"
      ex:
      - mp-13-30
      - mp-13-20
      - mp-13-31
      - mp-13-33
      themes:
      - integrales-parametre
- intitule: Variables aléatoires discrètes
  objectif: "On généralise l'étude des variables aléatoires à valeurs dans un ensemble fini menée en première année aux variables aléatoires discrètes ; ces outils permettent d'aborder, sur des exemples\
    \ simples, l'étude de procédés stochastiques à temps discret. La mise en place du cadre se veut à la fois minimale, pratique et rigoureuse : la notion de tribu n'appelle aucun autre développement que\
    \ sa définition, et toutes les variables aléatoires mentionnées dans le programme sont implicitement supposées discrètes. La partie A propose une introduction a minima de la dénombrabilité et des familles\
    \ sommables, afin de poser les bases de vocabulaire, méthodes et résultats qui seront admis, et directement utilisés ; chaque professeur est libre d'en adapter le contenu au niveau de formalisme qu'il\
    \ juge préférable, et ces notions ne feront l'objet d'aucune évaluation spécifique, leur usage étant strictement réservé au contexte probabiliste."
  hors_programme:
  - "L'étude de la dénombrabilité d'un ensemble et la construction d'espaces probabilisés sont hors programme."
  - Les diverses notions de convergences (presque sûre, en probabilité, en loi, etc.) sont hors programme.
  - La notion de variable à densité est hors programme.
  - "La notion d'espérance conditionnelle est hors programme."
  blocs:
  - intitule: A - Ensembles dénombrables, familles sommables
    points:
    - contenu: "Un ensemble est dit (au plus) dénombrable s'il est en bijection avec (une partie de) $\\mathbb{N}$, c'est-à-dire s'il peut être décrit en extension sous la forme $\\{x_i,\\ i\\in I\\}$ où\
        \ $I=\\mathbb{N}$ ($I\\subset\\mathbb{N}$) avec des $x_i$ distincts."
      cours:
      - "mp-14:2"
      themes:
      - denombrabilite
      note: "Le programme de PSI déclare hors programme l'étude de la dénombrabilité ; l'exercice 14.1 et l'exercice 14.3, qui en relèvent, ne sont pas retenus."
    - contenu: "Sont dénombrables : $\\mathbb{Z}$, un produit cartésien d'un nombre fini d'ensembles dénombrables, une union au plus dénombrable d'ensembles dénombrables. Une partie d'un ensemble dénombrable\
        \ est au plus dénombrable."
      cours:
      - "mp-14:2"
      ex:
      - mp-14-42
      themes:
      - denombrabilite
      note: "Le programme de PSI déclare hors programme l'étude de la dénombrabilité ; l'exercice 14.1 et l'exercice 14.3, qui en relèvent, ne sont pas retenus."
    - contenu: "En vue de généraliser les sommes finies et les sommes de séries de réels positifs, on admet sans soulever de difficulté qu'on sait associer à toute famille au plus dénombrable $(x_i)_{i\\\
        in I}$ d'éléments de $[0,+\\infty]$ sa somme $\\sum_{i\\in I}x_i\\in[0,+\\infty]$, et que pour tout découpage en paquets $I=\\bigcup_{n\\in\\mathbb{N}}I_n$ de $I$, $\\sum_{i\\in I}x_i=\\sum_{n=0}^{+\\\
        infty}\\Big(\\sum_{i\\in I_n}x_i\\Big)$."
      cours:
      - "ma-20:6"
      ex:
      - ma-20-45
      - ma-20-47
      themes:
      - familles-sommables
      note: Le cours de MPSI définit la somme comme une borne supérieure et démontre la sommation par paquets, que le programme de PSI admet.
    - contenu: "La famille $(x_i)_{i\\in I}$ d'éléments de $[0,+\\infty]$ est dite sommable si $\\sum_{i\\in I}x_i<\\infty$."
      precisions: En pratique, dans le cas positif, les étudiants peuvent découper, calculer et majorer leurs sommes directement, la finitude de la somme valant preuve de sommabilité.
      cours:
      - "ma-20:6"
      ex:
      - ma-20-45
      - ma-20-46
      themes:
      - familles-sommables
    - contenu: "Une famille $(x_i)_{i\\in I}$ au plus dénombrable de nombres complexes est dite sommable si $(|x_i|)_{i\\in I}$ l'est. Pour $I=\\mathbb{N}$, la sommabilité d'une suite équivaut à la convergence\
        \ absolue de la série associée. Si $|x_i|\\leqslant y_i$ pour tout $i\\in I$, la sommabilité de $(y_i)_{i\\in I}$ implique celle de $(x_i)_{i\\in I}$."
      cours:
      - "ma-20:7"
      ex:
      - ma-20-53
      - ma-20-52
      themes:
      - familles-sommables
    - contenu: "En cas de sommabilité, les sommes se manipulent naturellement grâce aux propriétés suivantes : croissance, linéarité, sommation par paquets, théorème de Fubini, produit de deux sommes."
      cours:
      - "ma-20:7"
      - "ma-20:6"
      ex:
      - ma-20-53
      - ma-20-54
      themes:
      - familles-sommables
  - intitule: B - Probabilités, variables aléatoires discrètes et lois usuelles · a) Univers, événements, variables aléatoires discrètes
    points:
    - contenu: "Univers $\\Omega$, tribu $\\mathcal{A}$. Espace probabilisable $(\\Omega,\\mathcal{A})$."
      precisions: "On se limite à la définition et à la stabilité par les opérations ensemblistes finies ou dénombrables. Traduction de la réalisation des événements $\\bigcap_{n=0}^{+\\infty}A_n$ à l'aide\
        \ des quantificateurs $\\exists$ et $\\forall$."
      cours:
      - "mp-14:3"
      ex:
      - mp-14-07
