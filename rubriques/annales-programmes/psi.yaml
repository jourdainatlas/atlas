    - contenu: "Loi faible des grands nombres : si $(X_n)_{n\\geqslant1}$ est une suite i.i.d. de variables aléatoires de variance finie, alors en notant $S_n=\\sum_{k=1}^n X_k$ et $m=\\mathrm{E}(X_1)$,\
        \ pour tout $\\varepsilon>0$ : $P\\left(\\left|\\frac{S_n}{n}-m\\right|\\geqslant\\varepsilon\\right)\\xrightarrow[n\\to+\\infty]{}0$."
      precisions: "Les étudiants doivent savoir retrouver, avec $\\sigma=\\sigma(X_1)$ : $P\\left(\\left|\\frac{S_n}{n}-m\\right|\\geqslant\\varepsilon\\right)\\leqslant\\frac{\\sigma^2}{n\\varepsilon^2}$."
      cours:
      - "mp-15:4"
      ex:
      - mp-15-27
      - mp-15-28
      themes:
      - loi-grands-nombres
- intitule: Calcul différentiel
  objectif: "La partie B généralise aux fonctions à valeurs dans $\\mathbb{R}^n$ la notion de dérivée d'une fonction numérique ; toutes les fonctions y sont définies sur un intervalle $I$ de $\\mathbb{R}$\
    \ et à valeurs dans $\\mathbb{R}^n$. Les dérivées partielles d'une fonction numérique définie sur un ouvert de $\\mathbb{R}^2$ ont été introduites en première année ; la partie C approfondit et généralise\
    \ cette étude aux fonctions de $p\\geqslant2$ variables. L'étude d'une fonction de $\\mathbb{R}^p$ dans $\\mathbb{R}^n$ se ramenant à celle de ses coordonnées, cette partie se consacre à l'étude des\
    \ fonctions de $\\mathbb{R}^p$ dans $\\mathbb{R}$ ; elle est axée sur la mise en place d'outils permettant de traiter des applications du calcul différentiel à l'analyse et la géométrie, et on se limite\
    \ en pratique au cas $p=2$ ou $p=3$."
  hors_programme:
  - "L'étude et le tracé d'arcs paramétrés sont hors programme."
  - La démonstration du théorème de Schwarz est hors programme.
  - "La démonstration de la formule de Taylor-Young à l'ordre 2 est hors programme."
  blocs:
