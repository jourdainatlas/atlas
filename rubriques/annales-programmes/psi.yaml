    - contenu: Suites de variables aléatoires indépendantes, suites i.i.d.
      precisions: "On ne soulève aucune difficulté quant à l'existence d'un espace probabilisé portant une suite i.i.d. Modélisation du jeu de pile ou face infini : suite i.i.d. de variables de Bernoulli."
      cours:
      - "mp-14:7"
      ex:
      - mp-14-33
      - mp-14-41
      - mp-15-10
      themes:
      - temps-attente-motifs
      - variables-aleatoires
    - contenu: "Fonctions de variables indépendantes : si $X\\perp\\!\\!\\!\\perp Y$, alors $f(X)\\perp\\!\\!\\!\\perp g(Y)$."
      precisions: Extension au cas de plus de deux variables aléatoires.
      cours:
      - "mp-14:7"
      themes:
      - couples-variables
    - contenu: "Lemme des coalitions : si les variables aléatoires $X_1,\\dots,X_n$ sont indépendantes, alors $f(X_1,\\dots,X_m)$ et $g(X_{m+1},\\dots,X_n)$ le sont aussi."
      precisions: Extension au cas de plus de deux coalitions.
      cours:
