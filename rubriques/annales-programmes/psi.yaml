# Programme officiel « Programme de mathématiques de PSI (seconde année) » (Bulletin officiel n° 31 du 26 août 2021, annexe 1 de l'arrêté du 13 juillet 2021 (Classe préparatoire PSI, programme de mathématiques)), structuré pour la vue « Programme »
# des Annales (MEMO_atlas_annales.md §45). Liens : cours « chapitre:section » (rang du sommaire, à partir de 1),
# exercices, thèmes d'annales ; un point sans cours ni exercice est affiché « à venir ».
id: psi
intitule: Programme de mathématiques de PSI (seconde année)
source:
  nom: "Bulletin officiel n° 31 du 26 août 2021, annexe 1 de l'arrêté du 13 juillet 2021 (Classe préparatoire PSI, programme de mathématiques)"
  url: "https://cache.media.education.gouv.fr/file/31/03/9/ensecsup748_annexes_1417039.pdf"
preambule: "Le programme comprend deux sections d'algèbre (algèbre linéaire et réduction : diagonalisation, trigonalisation ; espaces préhilbertiens réels et espaces euclidiens, avec le théorème de projection\
  \ orthogonale, les isométries vectorielles, le théorème spectral et les endomorphismes autoadjoints positifs), puis les espaces vectoriels normés, les suites et séries de fonctions et les séries entières,\
  \ l'intégration sur un intervalle quelconque, les variables aléatoires discrètes et le calcul différentiel (équations différentielles linéaires scalaires d'ordre 2, dérivabilité des fonctions vectorielles,\
  \ fonctions de plusieurs variables jusqu'à l'étude au second ordre des extremums). Chaque section comporte un bandeau définissant les objectifs essentiels et délimitant le cadre d'étude, puis un texte\
  \ en deux colonnes : à gauche les contenus exigibles, à droite les capacités exigibles, notations et limites. Les points signalés « hors programme » ne doivent pas être traités et ne peuvent faire l'objet\
  \ d'aucune épreuve d'évaluation, et l'ordre de présentation des sections ne doit pas être interprété comme un modèle de progression."
sections:
- intitule: Algèbre linéaire
  objectif: "Dans toute cette partie, $\\mathbb{K}$ désigne $\\mathbb{R}$ ou $\\mathbb{C}$. La partie A vise à consolider les acquis de première année, à introduire des concepts préliminaires à la réduction\
    \ (somme de plusieurs sous-espaces, somme directe, sous-espaces stables, matrices par blocs, trace, polynômes d'endomorphismes et de matrices carrées, polynômes interpolateurs de Lagrange) et à passer\
    \ du point de vue vectoriel au point de vue matriciel et inversement ; elle valorise les interprétations géométriques et l'illustration par de nombreuses figures. La partie B, consacrée à la réduction,\
    \ attend des étudiants qu'ils maîtrisent l'aspect géométrique (sous-espaces stables, éléments propres) et l'aspect algébrique (utilisation de polynômes annulateurs)."
  hors_programme:
  - "L'étude des classes de similitude est hors programme ainsi que la notion de polynôme minimal."
  - La notion de valeur spectrale est hors programme.
  - Le lemme de décomposition des noyaux est hors programme.
  - La technique générale de trigonalisation est hors programme.
  blocs:
  - intitule: "A - Compléments sur les espaces vectoriels, les endomorphismes et les matrices · a) Produit d'espaces vectoriels, somme de sous-espaces vectoriels"
    points:
    - contenu: "Produit d'un nombre fini d'espaces vectoriels ; dimension dans le cas où ces espaces sont de dimension finie."
      cours:
      - "ma-14:2"
      - "ma-15:2"
      themes:
      - espaces-vectoriels
    - contenu: "Somme, somme directe d'une famille finie de sous-espaces vectoriels."
      cours:
      - "mp-02:2"
      - "ma-14:5"
      ex:
      - ma-14-27
      - ma-14-33
      - mp-02-01
      themes:
      - espaces-vectoriels
    - contenu: En dimension finie, base adaptée à un sous-espace vectoriel, à une décomposition $E=\bigoplus E_i$.
      precisions: "Décomposition en somme directe obtenue par partition d'une base."
      cours:
      - "mp-02:2"
      - "ma-15:3"
      ex:
      - ma-15-18
      - ma-14-33
      themes:
      - espaces-vectoriels
    - contenu: "Si $F_1,\\dots,F_p$ sont des sous-espaces de dimension finie, $\\dim\\big(\\sum_{i=1}^p F_i\\big)\\leqslant\\sum_{i=1}^p\\dim(F_i)$ avec égalité si et seulement si la somme est directe."
      cours:
      - "mp-02:2"
      - "ma-15:3"
      ex:
      - ma-14-33
      themes:
      - espaces-vectoriels
  - intitule: A - Compléments sur les espaces vectoriels, les endomorphismes et les matrices · b) Matrices par blocs et sous-espaces stables
    points:
    - contenu: "Matrices définies par blocs, opérations par blocs de tailles compatibles (combinaison linéaire, produit, transposition). Déterminant d'une matrice triangulaire par blocs."
      cours:
      - "mp-02:2"
      ex:
      - mp-02-02
      - mp-02-40
      - mp-02-39
      - ma-17-45
      - mp-02-42
      themes:
      - matrices-blocs
      - determinants
    - contenu: Sous-espace vectoriel stable par un endomorphisme, endomorphisme induit.
      precisions: "Traduction matricielle de la stabilité d'un sous-espace vectoriel par un endomorphisme et interprétation en termes d'endomorphismes d'une matrice triangulaire ou diagonale par blocs."
      cours:
      - "mp-02:3"
      ex:
      - mp-02-09
      - mp-03-24
      - mp-03-25
      - mp-02-35
      themes:
      - sous-espaces-stables
    - contenu: Si $u$ et $v$ commutent alors le noyau de $u$ est stable par $v$.
      cours:
      - "mp-02:3"
      ex:
      - mp-02-07
      - mp-02-08
      - mp-02-37
      themes:
      - sous-espaces-stables
      - commutant
  - intitule: A - Compléments sur les espaces vectoriels, les endomorphismes et les matrices · c) Trace
    points:
    - contenu: "Trace d'une matrice carrée. Linéarité, trace d'une transposée. Relation $\\operatorname{tr}(AB)=\\operatorname{tr}(BA)$."
      precisions: "Notation $\\operatorname{tr}(A)$."
      cours:
      - "ma-16:5"
      ex:
      - ma-16-05
      - ma-16-06
      - ma-16-56
      - ma-16-42
      themes:
      - trace
    - contenu: "Invariance de la trace par similitude. Trace d'un endomorphisme d'un espace de dimension finie."
      cours:
      - "ma-16:5"
      ex:
      - ma-16-40
      - ma-17-29
      - mp-02-34
      - ma-16-64
      themes:
      - trace
      - similitude
  - intitule: "A - Compléments sur les espaces vectoriels, les endomorphismes et les matrices · d) Polynômes d'endomorphismes et de matrices carrées"
    points:
    - contenu: "Polynôme d'un endomorphisme, d'une matrice carrée."
      precisions: Relation $(PQ)(u)=P(u)\circ Q(u)$.
      cours:
      - "mp-03:2"
      ex:
      - mp-03-04
      - mp-03-03
      themes:
      - polynomes-endomorphismes
    - contenu: Polynôme annulateur.
      precisions: "Application au calcul de l'inverse et des puissances."
      cours:
      - "mp-03:2"
      ex:
      - ma-16-12
      - ma-16-11
      - mp-03-04
      - mp-03-19
      themes:
      - polynomes-endomorphismes
    - contenu: "Deux polynômes de l'endomorphisme $u$ commutent."
      precisions: Le noyau de $P(u)$ est stable par $u$.
      cours:
      - "mp-03:2"
      ex:
      - mp-02-09
      - mp-03-03
      themes:
      - polynomes-endomorphismes
      - commutant
    - contenu: Adaptation de ces résultats aux matrices carrées.
      cours:
      - "mp-03:2"
      ex:
      - ma-16-12
      - ma-16-11
      - mp-03-03
      themes:
      - polynomes-endomorphismes
  - intitule: A - Compléments sur les espaces vectoriels, les endomorphismes et les matrices · e) Interpolation de Lagrange
    points:
    - contenu: "Base de $\\mathbb{K}_n[X]$ constituée des polynômes interpolateurs de Lagrange en $n+1$ points distincts de $\\mathbb{K}$."
      precisions: "Expression d'un polynôme $P\\in\\mathbb{K}_n[X]$ dans cette base. La somme des polynômes interpolateurs de Lagrange en $n+1$ points est le polynôme constant égal à 1."
      cours:
      - "ma-14:4"
      - "ma-13:8"
      ex:
      - ma-13-38
      - ma-13-39
      - ma-14-33
      - ma-16-27
      - ma-15-47
      themes:
      - interpolation
    - contenu: Déterminant de Vandermonde.
      precisions: "Lien avec le problème d'interpolation de Lagrange."
      cours:
      - "ma-17:5"
      ex:
      - ma-16-27
      - ma-17-21
      - ma-17-42
      - ma-17-55
      themes:
      - determinant-vandermonde
      - interpolation
      note: "Le corrigé de l'exercice 17.55 passe par la comatrice, hors programme de PSI ; on peut l'éviter par les polynômes de Lagrange, dont les dénominateurs divisent le déterminant de Vandermonde."
  - intitule: B - Réduction des endomorphismes et des matrices carrées · a) Éléments propres
    points:
    - contenu: Droite stable par un endomorphisme.
      cours:
      - "mp-02:3"
      ex:
      - mp-02-09
      - mp-03-25
      themes:
      - sous-espaces-stables
      - reduction
    - contenu: "Valeur propre, vecteur propre (non nul), sous-espace propre d'un endomorphisme."
      precisions: Équation aux éléments propres $u(x)=\lambda x$. Si $u$ et $v$ commutent, les sous-espaces propres de $u$ sont stables par $v$.
      cours:
      - "mp-02:3"
      ex:
      - mp-02-05
      - mp-02-10
      - mp-02-11
      - mp-02-12
      - mp-02-08
      - mp-02-37
      themes:
      - reduction
      - sous-espaces-stables
    - contenu: "Spectre d'un endomorphisme en dimension finie."
      precisions: "Notation $\\operatorname{Sp}(u)$. La notion de valeur spectrale est hors programme."
      cours:
      - "mp-02:3"
      ex:
      - mp-02-12
      - mp-02-16
      themes:
      - reduction
    - contenu: "La somme d'une famille finie de sous-espaces propres d'un endomorphisme est directe."
      precisions: Toute famille finie de vecteurs propres associés à des valeurs propres distinctes est libre.
      cours:
      - "mp-02:3"
      ex:
      - mp-02-33
      - mp-02-30
      themes:
      - reduction
    - contenu: Si un polynôme $P$ annule $u$, toute valeur propre de $u$ est racine de $P$.
      precisions: Si $u(x)=\lambda x$, alors $P(u)(x)=P(\lambda)x$.
      cours:
      - "mp-03:2"
      ex:
      - mp-03-16
      - mp-03-18
      - mp-03-21
      themes:
      - polynomes-endomorphismes
      - reduction
    - contenu: "Valeur propre, vecteur propre, sous-espace propre et spectre d'une matrice carrée."
      precisions: Équation aux éléments propres $AX=\lambda X$.
      cours:
      - "mp-02:3"
      ex:
      - mp-02-06
      - mp-02-12
      - mp-02-32
      themes:
      - reduction
  - intitule: B - Réduction des endomorphismes et des matrices carrées · b) Polynôme caractéristique
    points:
    - contenu: "Polynôme caractéristique d'une matrice carrée, d'un endomorphisme d'un espace vectoriel de dimension finie."
      precisions: Par convention le polynôme caractéristique est unitaire. Notations $\chi_A$, $\chi_u$. Coefficients de degrés $0$ et $n-1$.
      cours:
      - "mp-02:4"
      ex:
      - mp-02-13
      - mp-02-14
      - mp-02-15
      - mp-02-48
      themes:
      - cayley-hamilton
      - trace
    - contenu: "Les valeurs propres d'un endomorphisme sont les racines de son polynôme caractéristique."
      precisions: "Spectre complexe d'une matrice carrée réelle."
      cours:
      - "mp-02:4"
      ex:
      - mp-02-13
      - mp-02-19
      - mp-02-14
      - mp-02-45
      themes:
      - cayley-hamilton
      - reduction
    - contenu: "Multiplicité d'une valeur propre. Majoration de la dimension d'un sous-espace propre par la multiplicité."
      precisions: Deux matrices semblables ont le même polynôme caractéristique, donc les mêmes valeurs propres avec mêmes multiplicités.
      cours:
      - "mp-02:4"
      ex:
      - mp-02-13
      - mp-02-19
      - mp-02-20
      - mp-02-41
      themes:
      - cayley-hamilton
      - diagonalisation
    - contenu: Théorème de Cayley-Hamilton.
      precisions: "La démonstration n'est pas exigible."
      demo: non exigible
      cours:
      - "mp-03:5"
      ex:
      - me-03-22
      - mp-03-39
      themes:
      - cayley-hamilton
      note: Les exercices du chapitre de MP sur ce théorème passent presque tous par le polynôme minimal, hors programme de PSI ; ne restent que le cas de la dimension 2 (Maths expertes) et une application
        en dimension quelconque.
  - intitule: B - Réduction des endomorphismes et des matrices carrées · c) Diagonalisation en dimension finie
    points:
    - contenu: "Un endomorphisme d'un espace vectoriel de dimension finie est dit diagonalisable s'il existe une base dans laquelle sa matrice est diagonale."
      precisions: Une telle base est constituée de vecteurs propres.
      cours:
      - "mp-02:5"
      ex:
      - mp-02-29
      - mp-02-33
      - mp-02-30
      - mp-02-34
      themes:
      - diagonalisation
    - contenu: Une matrice carrée est dite diagonalisable si elle est semblable à une matrice diagonale.
      precisions: "Interprétation en termes d'endomorphisme. Application au calcul des puissances d'une matrice diagonalisable, à des exemples de systèmes différentiels à coefficients constants. Dans la\
        \ pratique des cas numériques, on se limite à $n=2$ ou $n=3$."
      cours:
      - "mp-02:5"
      ex:
      - mp-02-17
      - mp-02-24
      - mp-02-20
      - mp-02-21
      - mp-02-22
      - mp-02-38
      themes:
      - diagonalisation
    - contenu: "Un endomorphisme d'un espace vectoriel $E$ est diagonalisable si et seulement si la somme de ses sous-espaces propres est égale à $E$."
      precisions: Exemple des projecteurs et des symétries.
      cours:
      - "mp-02:5"
      ex:
      - mp-02-33
      - mp-02-34
      - mp-02-18
      - mp-02-31
      themes:
      - diagonalisation
      - projecteurs
    - contenu: "Un endomorphisme est diagonalisable si et seulement si la somme des dimensions de ses sous-espaces propres est égale à la dimension de l'espace."
      precisions: Traduction matricielle.
      cours:
      - "mp-02:5"
      ex:
      - mp-02-18
      - mp-02-25
      - mp-02-31
      - mp-02-26
      themes:
      - diagonalisation
    - contenu: "Un endomorphisme est diagonalisable si et seulement si son polynôme caractéristique est scindé sur $\\mathbb{K}$ et si, pour toute valeur propre, la dimension du sous-espace propre associé\
        \ est égale à sa multiplicité."
      precisions: Traduction matricielle.
      cours:
      - "mp-02:5"
      ex:
      - mp-02-17
      - mp-02-20
      - mp-02-23
      - mp-02-42
      - mp-02-41
      themes:
      - diagonalisation
    - contenu: "Un endomorphisme d'un espace vectoriel de dimension $n$ admettant $n$ valeurs propres distinctes est diagonalisable."
      precisions: Polynôme caractéristique scindé à racines simples. Traduction matricielle.
      cours:
      - "mp-02:5"
      ex:
      - mp-02-29
      - mp-02-30
      - mp-02-37
      themes:
      - diagonalisation
  - intitule: B - Réduction des endomorphismes et des matrices carrées · d) Diagonalisabilité et polynômes annulateurs
    points:
    - contenu: "Un endomorphisme est diagonalisable si et seulement s'il admet un polynôme annulateur scindé à racines simples."
      precisions: "La démonstration n'est pas exigible. Traduction matricielle. Le lemme de décomposition des noyaux est hors programme."
      demo: non exigible
      cours:
      - "mp-03:4"
      ex:
      - mp-03-16
      - mp-03-17
      - mp-03-19
      - mp-03-22
      - mp-03-23
      themes:
      - diagonalisation
      - polynomes-endomorphismes
      note: "Le corrigé de la question 2 de l'exercice 3.22 passe par le polynôme minimal, hors programme de PSI ; on peut le remplacer par le fait que $\\prod_{\\lambda\\in\\operatorname{Sp}(A)}(X-\\lambda)$\
        \ annule un endomorphisme diagonalisable."
    - contenu: "L'endomorphisme induit par un endomorphisme diagonalisable sur un sous-espace vectoriel stable est diagonalisable."
      cours:
      - "mp-03:4"
      ex:
      - mp-03-24
      - mp-03-29
      themes:
      - diagonalisation
      - sous-espaces-stables
    - contenu: "Un endomorphisme $u$ est diagonalisable si et seulement s'il admet $\\prod_{\\lambda\\in\\operatorname{Sp}(u)}(X-\\lambda)$ pour polynôme annulateur."
      cours:
      - "mp-03:4"
      ex:
      - mp-03-28
      themes:
      - diagonalisation
      - polynomes-endomorphismes
  - intitule: B - Réduction des endomorphismes et des matrices carrées · e) Trigonalisation en dimension finie
    points:
    - contenu: "Un endomorphisme d'un espace vectoriel de dimension finie est dit trigonalisable s'il existe une base dans laquelle sa matrice est triangulaire."
      precisions: "Expression de la trace et du déterminant d'un endomorphisme trigonalisable, d'une matrice trigonalisable à l'aide des valeurs propres."
      cours:
      - "mp-02:6"
      ex:
      - mp-02-43
      - mp-02-44
      - mp-03-25
      - mp-02-50
      themes:
      - trigonalisation
    - contenu: Une matrice carrée est dite trigonalisable si elle est semblable à une matrice triangulaire.
      precisions: "Interprétation en termes d'endomorphisme."
      cours:
      - "mp-02:6"
      ex:
      - mp-02-43
      - mp-02-44
      themes:
      - trigonalisation
    - contenu: "Un endomorphisme est trigonalisable si et seulement si son polynôme caractéristique est scindé sur $\\mathbb{K}$."
      precisions: "La démonstration n'est pas exigible. Traduction matricielle."
      demo: non exigible
      cours:
      - "mp-02:6"
      ex:
      - mp-02-43
      - mp-02-44
      - mp-02-50
      themes:
      - trigonalisation
    - contenu: "Toute matrice de $\\mathcal{M}_n(\\mathbb{C})$ est trigonalisable."
      precisions: La technique générale de trigonalisation est hors programme. On se limite dans la pratique à des exemples simples en petite dimension et tout exercice de trigonalisation effective doit
        comporter une indication.
      cours:
      - "mp-02:6"
      ex:
      - mp-03-21
      - mp-02-45
      - mp-02-50
      themes:
      - trigonalisation
- intitule: Espaces préhilbertiens réels, espaces euclidiens
  objectif: "Pour les espaces préhilbertiens réels, l'objectif majeur est le théorème de projection orthogonale et l'existence de la meilleure approximation quadratique ; on s'appuie sur des exemples de\
    \ géométrie du plan et de l'espace pour illustrer les différentes notions. La partie consacrée aux endomorphismes d'un espace euclidien vise à étudier les isométries vectorielles et matrices orthogonales,\
    \ et à les décrire en dimension deux et trois en insistant sur les représentations géométriques ; à approfondir la réduction dans le cadre euclidien en énonçant les formes géométrique et matricielle\
    \ du théorème spectral ; à introduire la notion d'endomorphisme autoadjoint positif, qui trouvera notamment son application au calcul différentiel d'ordre 2."
  hors_programme:
  - "La notion d'adjoint est hors programme."
  - La définition axiomatique des groupes est hors programme.
  blocs:
  - intitule: A - Espaces préhilbertiens réels · a) Produit scalaire et norme associée
    points:
    - contenu: Produit scalaire.
      precisions: "Notations $\\langle x,y\\rangle$, $(x\\,|\\,y)$, $x\\cdot y$."
      cours:
      - "ma-19:2"
      - "mp-10:2"
      ex:
      - ma-19-01
      - mp-10-01
      - ma-19-02
      - ma-19-03
      - ma-19-08
      themes:
      - prehilbertiens
    - contenu: Espace préhilbertien réel, espace euclidien.
      cours:
      - "ma-19:2"
      - "mp-10:2"
      themes:
      - prehilbertiens
    - contenu: "Exemples de référence : produit scalaire euclidien canonique sur $\\mathbb{R}^n$, produit scalaire canonique sur $\\mathcal{M}_n(\\mathbb{R})$, produit scalaire défini par une intégrale\
        \ sur $\\mathcal{C}^0([a,b],\\mathbb{R})$."
      precisions: "Expression $X^\\top Y$. Expression $\\operatorname{tr}(A^\\top B)$."
      cours:
      - "ma-19:2"
      - "mp-10:2"
      ex:
      - ma-19-05
      - ma-19-03
      - ma-19-32
      - ma-19-34
      themes:
      - prehilbertiens
    - contenu: "Inégalité de Cauchy-Schwarz, cas d'égalité."
      cours:
      - "ma-19:3"
      - "mp-10:2"
      ex:
      - ma-19-04
      - mp-10-03
      - ma-19-05
      - ma-19-07
      - ma-19-09
      themes:
      - cauchy-schwarz
      - prehilbertiens
    - contenu: Norme associée au produit scalaire.
      precisions: "Cas d'égalité dans l'inégalité triangulaire. Les étudiants doivent savoir manipuler les identités remarquables sur les normes (développement de $\\|u\\pm v\\|^2$, identité de polarisation)."
      cours:
      - "ma-19:3"
      - "mp-10:2"
      ex:
      - ma-19-06
      - mp-10-07
      - mp-10-05
      - ma-19-10
      - ma-19-11
      themes:
      - prehilbertiens
  - intitule: A - Espaces préhilbertiens réels · b) Orthogonalité
    points:
    - contenu: "Vecteurs orthogonaux, sous-espaces orthogonaux, orthogonal d'un sous-espace vectoriel $F$, d'une partie $X$."
      precisions: "Notation $F^\\perp$. L'orthogonal d'une partie est un sous-espace vectoriel."
      cours:
      - "ma-19:4"
      - "mp-10:3"
      ex:
      - ma-19-12
      - ma-19-33
      - mp-10-13
      - mp-10-16
      - mp-10-14
      themes:
      - prehilbertiens
    - contenu: Famille orthogonale, orthonormée (ou orthonormale). Toute famille orthogonale de vecteurs non nuls est libre.
      cours:
      - "ma-19:4"
      - "mp-10:3"
      ex:
      - ma-19-21
      - ma-19-17
      - mp-10-19
      themes:
      - prehilbertiens
    - contenu: Théorème de Pythagore.
      cours:
      - "ma-19:4"
      - "mp-10:3"
      ex:
      - ma-19-13
      - ma-19-49
      themes:
      - prehilbertiens
    - contenu: "Algorithme d'orthonormalisation de Gram-Schmidt."
      cours:
      - "ma-19:4"
      - "mp-10:3"
      ex:
      - ma-19-14
      - mp-10-09
      - ma-19-15
      - mp-10-12
      - ma-19-16
      - mp-07-24
      themes:
      - gram-schmidt
      - polynomes-orthogonaux
  - intitule: "A - Espaces préhilbertiens réels · c) Bases orthonormées d'un espace euclidien"
    points:
    - contenu: Existence de bases orthonormées dans un espace euclidien. Théorème de la base orthonormée incomplète.
      cours:
      - "ma-19:5"
      - "mp-10:3"
      ex:
      - ma-19-24
      - ma-19-25
      themes:
      - prehilbertiens
      - gram-schmidt
    - contenu: Expression des coordonnées, du produit scalaire et de la norme dans une base orthonormée.
      cours:
      - "ma-19:5"
      - "mp-10:3"
      ex:
      - ma-19-19
      - ma-19-20
      - mp-10-18
      - ma-19-23
      themes:
      - prehilbertiens
  - intitule: A - Espaces préhilbertiens réels · d) Projection orthogonale sur un sous-espace de dimension finie
    points:
    - contenu: "Supplémentaire orthogonal d'un sous-espace de dimension finie."
      precisions: Dimension de $F^\perp$ en dimension finie.
      cours:
      - "ma-19:6"
      - "mp-10:4"
      ex:
      - ma-19-31
      - ma-19-33
      - mp-10-13
      - ma-19-39
      themes:
      - projection-orthogonale
      - prehilbertiens
    - contenu: Projection orthogonale $p_F$ sur un sous-espace vectoriel $F$ de dimension finie.
      precisions: "Les étudiants doivent savoir déterminer $p_F(x)$ en calculant son expression dans une base orthonormée de $F$ ou en résolvant un système linéaire traduisant l'orthogonalité de $x-p_F(x)$\
        \ aux vecteurs d'une famille génératrice de $F$."
      cours:
      - "ma-19:6"
      - "mp-10:4"
      ex:
      - ma-19-29
      - ma-19-30
      - mp-10-20
      - mp-10-21
      - mp-07-12
      - ma-19-42
      themes:
      - projection-orthogonale
    - contenu: "Distance d'un vecteur à un sous-espace. Le projeté orthogonal de $x$ sur $F$ est l'unique élément de $F$ qui réalise la distance de $x$ à $F$."
      precisions: Notation $d(x,F)$.
      cours:
      - "ma-19:6"
      - "mp-10:4"
      ex:
      - ma-19-28
      - ma-19-35
      - mp-10-26
      - ma-19-36
      - ma-19-45
      - ma-19-52
      themes:
      - projection-orthogonale
    - contenu: "Projeté orthogonal d'un vecteur sur l'hyperplan $\\operatorname{Vect}(u)^\\perp$ ; distance entre $x$ et $\\operatorname{Vect}(u)^\\perp$."
      precisions: Application géométrique à des calculs de distances.
      cours:
      - "ma-19:6"
      - "mp-10:4"
      ex:
      - ma-19-28
      - mp-10-22
      - mp-10-23
      - mp-10-24
      themes:
      - projection-orthogonale
  - intitule: A - Espaces préhilbertiens réels · e) Formes linéaires sur un espace euclidien
    points:
    - contenu: "Représentation d'une forme linéaire à l'aide d'un produit scalaire."
      precisions: Vecteur normal à un hyperplan.
      cours:
      - "mp-07:2"
      ex:
      - ma-19-22
      - mp-07-01
      themes:
      - dualite
      - prehilbertiens
      note: "L'énoncé et sa démonstration figurent au début de la section « Adjoint » du cours de MP (7.2.1), qui enchaîne ensuite sur l'adjoint, hors programme de PSI."
  - intitule: "B - Endomorphismes d'un espace euclidien · a) Isométries vectorielles d'un espace euclidien"
    points:
    - contenu: "Un endomorphisme d'un espace euclidien est une isométrie vectorielle s'il conserve la norme."
      precisions: "Exemple : symétries orthogonales, cas particulier des réflexions."
      cours:
      - "mp-07:3"
      ex:
      - mp-07-13
      - mp-07-12
      - mp-07-20
      - mp-07-21
      - mp-07-23
      themes:
      - isometries
      - matrices-orthogonales
    - contenu: "Caractérisations par la conservation du produit scalaire, par l'image d'une base orthonormée."
      cours:
      - "mp-07:3"
      ex:
      - mp-07-21
      - mp-07-20
      themes:
      - isometries
    - contenu: Groupe orthogonal.
      precisions: "Notation $\\mathrm{O}(E)$. On vérifie les propriétés lui conférant une structure de groupe, mais la définition axiomatique des groupes est hors programme."
      cours:
      - "mp-07:3"
      ex:
      - mp-07-23
      - mp-07-35
      themes:
      - isometries
      - groupes-matrices
    - contenu: "Stabilité de l'orthogonal d'un sous-espace stable."
      cours:
      - "mp-07:5"
      ex:
      - mp-07-32
      - mp-07-35
      themes:
      - isometries
      - sous-espaces-stables
      note: "Le cours (Maths Spé – MP, ch. 7, section 5) démontre ce résultat à l'aide de l'adjoint, hors programme de PSI ; preuve directe : $u(F)=F$, et pour $y\\in F^\\perp$ et $x\\in F$, $\\langle u(y),x\\\
        rangle=\\langle y,u^{-1}(x)\\rangle=0$."
  - intitule: "B - Endomorphismes d'un espace euclidien · b) Matrices orthogonales"
    points:
    - contenu: "Une matrice $A$ de $\\mathcal{M}_n(\\mathbb{R})$ est orthogonale si $A^\\top A=I_n$."
      precisions: Interprétation en termes de colonnes et de lignes. Caractérisation comme matrice de changement de base orthonormée.
      cours:
      - "mp-07:3"
      ex:
      - mp-07-14
      - mp-07-15
      - ma-19-19
      - mp-07-16
      - mp-07-17
      - mp-07-24
      themes:
      - matrices-orthogonales
    - contenu: "Caractérisation d'une isométrie vectorielle à l'aide de sa matrice dans une base orthonormée."
      precisions: "On mentionne la terminologie « automorphisme orthogonal », tout en lui préférant celle d'« isométrie vectorielle »."
      cours:
      - "mp-07:3"
      ex:
      - mp-07-11
      - mp-07-13
      - mp-07-30
      themes:
      - isometries
      - matrices-orthogonales
    - contenu: Groupe orthogonal.
      precisions: "Notations $\\mathrm{O}_n(\\mathbb{R})$, $\\mathrm{O}(n)$."
      cours:
      - "mp-07:3"
      ex:
      - mp-07-16
      themes:
      - matrices-orthogonales
      - groupes-matrices
    - contenu: "Déterminant d'une matrice orthogonale. Groupe spécial orthogonal."
      precisions: "Notations $\\mathrm{SO}_n(\\mathbb{R})$, $\\mathrm{SO}(n)$."
      cours:
      - "mp-07:3"
      ex:
      - mp-07-14
      - mp-07-15
      - mp-07-16
      themes:
      - matrices-orthogonales
    - contenu: Orientation. Bases orthonormées directes.
      cours:
      - "mp-07:3"
      - "ma-17:3"
      themes:
      - matrices-orthogonales
  - intitule: "B - Endomorphismes d'un espace euclidien · c) Espace euclidien orienté de dimension 2 ou 3"
    points:
    - contenu: "Déterminant d'une famille de vecteurs dans une base orthonormée directe : produit mixte."
      precisions: "Notations $[u,v]$, $[u,v,w]$. Interprétation géométrique comme aire ou volume."
      cours:
      - "mp-07:3"
      ex:
      - mp-07-27
      - ma-19-22
      themes:
      - determinants
      - geometrie-euclidienne
      note: "Le produit mixte est défini en quelques lignes (cours de MP, 7.3.2) ; aucun exercice ne lui est consacré, mais deux s'en servent : l'angle orienté en dimension 2 et la représentation de x ↦\
        \ det(a, b, x) en dimension 3."
    - contenu: Produit vectoriel. Calcul dans une base orthonormée directe.
      cours:
      - "mp-07:3"
      ex:
      - mp-07-41
      - mp-07-28
      - ma-19-22
      - mp-07-30
      themes:
      - antisymetriques
      - matrices-orthogonales
      - geometrie-euclidienne
      note: Le cours définit le produit vectoriel par le produit mixte sans écrire la formule en coordonnées ; les exercices le manipulent en base orthonormée directe.
    - contenu: "Orientation d'un plan ou d'une droite dans un espace euclidien orienté de dimension 3."
      cours:
      - "mp-07:5"
      ex:
      - mp-07-28
      themes:
      - isometries
      - matrices-orthogonales
      note: "Seule l'orientation de l'axe d'une rotation et son effet sur l'angle sont traités ; l'orientation d'un plan par un vecteur normal n'est pas exposée en tant que telle."
  - intitule: "B - Endomorphismes d'un espace euclidien · d) Isométries vectorielles d'un plan euclidien"
    points:
    - contenu: "Description des matrices de $\\mathrm{O}_2(\\mathbb{R})$, de $\\mathrm{SO}_2(\\mathbb{R})$."
      precisions: "Commutativité de $\\mathrm{SO}_2(\\mathbb{R})$."
      cours:
      - "mp-07:4"
      ex:
      - mp-07-27
      - mp-07-26
      - mp-07-11
      themes:
      - matrices-orthogonales
      - isometries
    - contenu: "Rotation vectorielle d'un plan euclidien orienté."
      precisions: "On introduit à cette occasion, sans soulever de difficulté, la notion de mesure d'un angle orienté de vecteurs non nuls."
      cours:
      - "mp-07:4"
      ex:
      - mp-07-25
      - mp-07-26
      - mp-07-27
      themes:
      - isometries
      - matrices-orthogonales
    - contenu: "Classification des isométries vectorielles d'un plan euclidien."
      cours:
      - "mp-07:4"
      ex:
      - mp-07-11
      - mp-07-25
      - mp-07-26
      themes:
      - isometries
  - intitule: "B - Endomorphismes d'un espace euclidien · e) Isométries d'un espace euclidien de dimension 3"
    points:
    - contenu: "Description des matrices de $\\mathrm{SO}_3(\\mathbb{R})$."
      cours:
      - "mp-07:5"
      ex:
      - mp-07-11
      - mp-07-28
      - mp-07-30
      themes:
      - matrices-orthogonales
      - isometries
    - contenu: "Rotation vectorielle d'un espace euclidien orienté de dimension 3."
      precisions: "Axe et mesure de l'angle d'une rotation."
      cours:
      - "mp-07:5"
      ex:
      - mp-07-11
      - mp-07-28
      - mp-07-30
      themes:
      - isometries
      - matrices-orthogonales
  - intitule: "B - Endomorphismes d'un espace euclidien · f) Réduction des endomorphismes autoadjoints et des matrices symétriques réelles"
    points:
    - contenu: "Endomorphisme autoadjoint d'un espace euclidien."
      precisions: "Notation $\\mathcal{S}(E)$. Caractérisation des projecteurs orthogonaux."
      cours:
      - "mp-07:6"
      ex:
      - mp-07-40
      - mp-07-41
      - mp-07-42
      - mp-07-31
      themes:
      - endomorphismes-symetriques
      note: "Le cours de MP définit l'endomorphisme autoadjoint par $u^*=u$ (adjoint hors programme de PSI), mais écrit aussitôt la définition équivalente $\\langle u(x),y\\rangle=\\langle x,u(y)\\rangle$,\
        \ qui est celle du programme."
    - contenu: "Caractérisation d'un endomorphisme autoadjoint à l'aide de sa matrice dans une base orthonormée."
      precisions: "On mentionne la terminologie « endomorphisme symétrique », tout en lui préférant celle d'« endomorphisme autoadjoint »."
      cours:
      - "mp-07:6"
      ex:
      - ma-19-42
      - mp-07-41
      themes:
      - endomorphismes-symetriques
    - contenu: "Théorème spectral : tout endomorphisme autoadjoint d'un espace euclidien admet une base orthonormée de vecteurs propres."
      precisions: "La démonstration n'est pas exigible. Forme matricielle du théorème spectral."
      demo: non exigible
      cours:
      - "mp-07:6"
      ex:
      - mp-07-38
      - mp-07-39
      - mp-07-44
      - mp-07-45
      - mp-07-47
      themes:
      - theoreme-spectral
      - endomorphismes-symetriques
    - contenu: Endomorphisme autoadjoint positif, défini positif.
      precisions: "Caractérisation spectrale. Notations $\\mathcal{S}^+(E)$, $\\mathcal{S}^{++}(E)$."
      cours:
      - "mp-07:7"
      ex:
      - mp-07-40
      - mp-07-52
      - mp-07-53
      themes:
      - matrices-symetriques-positives
    - contenu: Matrice symétrique positive, définie positive.
      precisions: "Caractérisation spectrale. Notations $\\mathcal{S}_n^+(\\mathbb{R})$, $\\mathcal{S}_n^{++}(\\mathbb{R})$."
      cours:
      - "mp-07:7"
      ex:
      - mp-07-50
      - mp-07-51
      - mp-07-52
      - mp-07-55
      - mp-07-56
      themes:
      - matrices-symetriques-positives
- intitule: Espaces vectoriels normés
  objectif: "Cette section vise à généraliser au cas des espaces vectoriels sur $\\mathbb{K}=\\mathbb{R}$ ou $\\mathbb{C}$ certaines notions (convergence de suites, limite et continuité de fonctions) étudiées\
    \ en première année dans le cadre de l'analyse réelle, indispensables pour aborder l'étude des suites de matrices, des fonctions à valeurs vectorielles et du calcul différentiel, et à fournir un cadre\
    \ topologique à la convergence des suites et séries de fonctions. Les notions seront illustrées par des exemples concrets et variés ; il convient de souligner l'aspect géométrique des concepts topologiques\
    \ à l'aide de nombreuses figures."
  hors_programme:
  - "Toute autre propriété de l'adhérence (que la caractérisation comme ensemble des points adhérents et la caractérisation séquentielle) est hors programme."
  - "La démonstration de l'équivalence des normes en dimension finie est hors programme."
  - La démonstration du théorème des bornes atteintes est hors programme.
  - La notion de norme subordonnée est hors programme.
  blocs:
  - intitule: a) Normes
    points:
    - contenu: Norme sur un espace vectoriel réel ou complexe.
      precisions: "Normes usuelles $\\|\\ \\|_1$, $\\|\\ \\|_2$ et $\\|\\ \\|_\\infty$ sur $\\mathbb{K}^n$."
      cours:
      - "mp-04:2"
      ex:
      - mp-04-05
      - l3-cd-01-01
      - mp-04-06
      - mp-04-23
      - mp-04-09
      themes:
      - espaces-normes
    - contenu: Espace vectoriel normé.
      precisions: "Norme $\\|\\ \\|_\\infty$ sur un espace de fonctions bornées à valeurs dans $\\mathbb{K}$. L'égalité $\\sup(kA)=k\\sup(A)$ pour $A$ partie non vide de $\\mathbb{R}$ et $k\\in\\mathbb{R}^+$\
        \ peut être directement utilisée."
      cours:
      - "mp-04:2"
      ex:
      - mp-04-02
      - mp-04-11
      - mp-04-24
      themes:
      - espaces-normes
    - contenu: Norme associée à un produit scalaire sur un espace préhilbertien réel.
      cours:
      - "mp-04:2"
      - "ma-19:3"
      ex:
      - mp-04-06
      - mp-04-08
      - mp-04-10
      - mp-04-28
      themes:
      - espaces-normes
      - prehilbertiens
    - contenu: Distance associée à une norme.
      cours:
      - "mp-04:2"
      ex:
      - l3-cd-01-02
      - mp-04-04
      - mp-04-07
      themes:
      - espaces-normes
    - contenu: Boule ouverte, boule fermée, sphère. Partie convexe.
      precisions: Convexité des boules.
      cours:
      - "mp-04:2"
      ex:
      - mp-04-01
      - l3-cd-01-08
      - mp-04-04
      - l3-cd-01-05
      themes:
      - espaces-normes
      - convexite-ensembles
    - contenu: Partie bornée, suite bornée, fonction bornée.
      cours:
      - "mp-04:2"
      ex:
      - mp-04-03
      - mp-04-37
      themes:
      - espaces-normes
  - intitule: "b) Suites d'éléments d'un espace vectoriel normé"
    points:
    - contenu: "Convergence et divergence d'une suite."
      precisions: Exemples dans des espaces de matrices, dans des espaces de fonctions.
      cours:
      - "mp-04:3"
      ex:
      - mp-04-14
      - mp-04-20
      - mp-04-55
      themes:
      - espaces-normes
    - contenu: Unicité de la limite. Opérations sur les limites.
      cours:
      - "mp-04:3"
      ex:
      - mp-04-20
      - mp-04-55
      themes:
      - espaces-normes
    - contenu: "Une suite convergente est bornée. Toute suite extraite d'une suite convergente est convergente."
      cours:
      - "mp-04:3"
      ex:
      - mp-04-13
      - mp-04-14
      - mp-04-16
      themes:
      - espaces-normes
  - intitule: c) Comparaison des normes
    points:
    - contenu: Normes équivalentes.
      precisions: "Invariance du caractère borné, de la convergence d'une suite. Utilisation de suites pour montrer que deux normes ne sont pas équivalentes. La comparaison effective de deux normes n'est\
        \ pas un objectif du programme. On se limite en pratique à des exemples élémentaires."
      cours:
      - "mp-04:4"
      ex:
      - mp-04-31
      - mp-04-24
      - mp-04-26
      - mp-04-29
      - mp-04-30
      themes:
      - normes-equivalentes
  - intitule: "d) Topologie d'un espace vectoriel normé"
    points:
    - contenu: Point intérieur à une partie.
      cours:
      - "mp-04:5"
      ex:
      - mp-04-36
      - mp-04-35
      themes:
      - topologie-evn
    - contenu: "Ouvert d'un espace normé. Stabilité par réunion quelconque, par intersection finie."
      precisions: Une boule ouverte est un ouvert.
      cours:
      - "mp-04:5"
      ex:
      - mp-04-36
      - mp-04-37
      themes:
      - topologie-evn
    - contenu: "Fermé d'un espace normé. Stabilité par réunion finie, par intersection quelconque."
      precisions: Caractérisation séquentielle. Une boule fermée, une sphère, sont des fermés.
      cours:
      - "mp-04:5"
      ex:
      - mp-04-44
      - mp-04-43
      - mp-04-45
      themes:
      - topologie-evn
    - contenu: Point adhérent à une partie, adhérence.
      precisions: "L'adhérence est l'ensemble des points adhérents. Caractérisation séquentielle. Toute autre propriété de l'adhérence est hors programme."
      cours:
      - "mp-04:5"
      ex:
      - mp-04-36
      - mp-04-39
      themes:
      - topologie-evn
    - contenu: Partie dense.
      cours:
      - "mp-04:5"
      ex:
      - mp-04-22
      - mp-04-44
      - mp-04-47
      - mp-04-62
      themes:
      - densite
      - topologie-evn
    - contenu: Invariance des notions topologiques par passage à une norme équivalente.
      cours:
      - "mp-04:5"
      - "mp-04:4"
      ex:
      - mp-04-26
      - mp-05-05
      - mp-04-44
      themes:
      - normes-equivalentes
      - topologie-evn
  - intitule: e) Limite et continuité en un point
    points:
    - contenu: "Limite d'une fonction en un point adhérent à son domaine de définition."
      precisions: Caractérisation séquentielle.
      cours:
      - "mp-05:2"
      ex:
      - mp-05-01
      - mp-05-02
      - mp-05-03
      themes:
      - continuite
      - espaces-normes
    - contenu: Opérations algébriques sur les limites, composition.
      cours:
      - "mp-05:2"
      ex:
      - mp-05-03
      themes:
      - continuite
    - contenu: Continuité en un point.
      precisions: Caractérisation séquentielle.
      cours:
      - "mp-05:2"
      ex:
      - mp-05-03
      - mp-05-09
      themes:
      - continuite
  - intitule: f) Continuité sur une partie
    points:
    - contenu: Opérations algébriques, composition.
      cours:
      - "mp-05:2"
      ex:
      - mp-05-03
      themes:
      - continuite
    - contenu: "Image réciproque d'un ouvert, d'un fermé par une application continue."
      precisions: "Si $f$ est une application continue de $E$ dans $\\mathbb{R}$ alors l'ensemble défini par $f(x)>0$ est un ouvert et les ensembles définis par $f(x)=0$ ou $f(x)\\geqslant0$ sont des fermés."
      cours:
      - "mp-05:2"
      ex:
      - mp-05-04
      - mp-05-05
      - mp-05-38
      themes:
      - topologie-evn
      - continuite
    - contenu: Fonction lipschitzienne. Toute fonction lipschitzienne est continue.
      cours:
      - "mp-05:2"
      ex:
      - mp-05-07
      - mp-04-39
      themes:
      - continuite-uniforme
  - intitule: g) Espaces vectoriels normés de dimension finie
    points:
    - contenu: Équivalence des normes en dimension finie.
      precisions: "La démonstration est hors programme. La convergence d'une suite (ou l'existence de la limite d'une fonction) à valeurs dans un espace vectoriel normé de dimension finie équivaut à celle\
        \ de chacune de ses coordonnées dans une base."
      demo: hors programme
      cours:
      - "mp-05:6"
      ex:
      - mp-05-36
      - mp-05-34
      - l3-cd-01-17
      - mp-05-40
      themes:
      - normes-equivalentes
    - contenu: "Théorème des bornes atteintes : toute fonction réelle continue sur une partie non vide fermée bornée d'un espace vectoriel normé de dimension finie est bornée et atteint ses bornes."
      precisions: La démonstration est hors programme.
      demo: hors programme
      cours:
      - "mp-05:5"
      - "mp-05:6"
      ex:
      - mp-05-34
      - mp-05-54
      themes:
      - compacite
      - continuite
      note: "Le cours passe par la compacité (hors programme de PSI) : théorème des bornes atteintes sur un compact (5.5) et caractérisation des compacts comme fermés bornés en dimension finie (5.6)."
    - contenu: Continuité des applications linéaires, multilinéaires et polynomiales.
      precisions: La notion de norme subordonnée est hors programme. Exemples du déterminant, du produit matriciel.
      cours:
      - "mp-05:6"
      ex:
      - mp-04-20
      - mp-04-46
      - mp-05-35
      - mp-05-38
      - mp-05-41
      themes:
      - topologie-matrices
      - continuite
      note: "Le corrigé de la question 1 de l'exercice 5.35 passe par une norme subordonnée, hors programme ; la continuité du produit matriciel, bilinéaire en dimension finie, suffit."
- intitule: Suites et séries de fonctions
  objectif: "La partie A consolide et élargit les acquis de première année sur les séries, notamment la convergence absolue, en vue de l'étude des probabilités discrètes et des séries de fonctions ; l'étude\
    \ de la semi-convergence n'est pas un objectif du programme. La partie B définit différents modes de convergence d'une suite, d'une série de fonctions et étudie le transfert à la limite, à la somme\
    \ des propriétés des fonctions ; les fonctions sont définies sur un intervalle $I$ de $\\mathbb{R}$ et à valeurs dans $\\mathbb{R}$ ou $\\mathbb{C}$. La partie C étudie la convergence d'une série entière\
    \ et la notion de rayon de convergence, les propriétés de sa somme en se limitant à la continuité dans le cas d'une variable complexe, et établit les développements en série entière des fonctions usuelles\
    \ ; les séries entières trouveront un cadre d'application dans la notion de fonction génératrice en probabilités et au détour d'exemples de résolution d'équations différentielles linéaires."
  hors_programme:
  - "La transformation d'Abel est hors programme."
  - La démonstration du théorème de la double limite est hors programme.
  - "La démonstration de la continuité de la somme d'une série entière de la variable complexe sur le disque ouvert de convergence est hors programme."
  blocs:
  - intitule: A - Compléments sur les séries numériques · a) Compléments sur les séries numériques
    points:
    - contenu: Technique de comparaison série-intégrale.
      precisions: "Les étudiants doivent savoir utiliser la comparaison série-intégrale pour établir des convergences et des divergences de séries, estimer des sommes partielles de séries divergentes ou\
        \ des restes de séries convergentes dans le cas d'une fonction monotone."
      cours:
      - "mp-06:3"
      - "ma-20:3"
      ex:
      - mp-06-20
      - ma-20-10
      - mp-06-22
      - mp-06-23
      - mp-06-21
      - ma-20-15
      themes:
      - comparaison-serie-integrale
      - series-numeriques
    - contenu: "Formule de Stirling : équivalent de $n!$."
      precisions: "La démonstration n'est pas exigible."
      demo: non exigible
      cours:
      - "ma-10:5"
      - "ma-18:7"
      ex:
      - ma-20-32
      - mp-06-27
      - mp-06-51
      themes:
      - stirling
    - contenu: "Règle de d'Alembert."
      cours:
      - "mp-06:3"
      ex:
      - mp-06-02
      - mp-06-24
      themes:
      - series-numeriques
    - contenu: Théorème spécial des séries alternées, majoration et signe du reste.
      precisions: "La transformation d'Abel est hors programme."
      cours:
      - "ma-20:5"
      ex:
      - ma-20-35
      - ma-20-38
      - mp-08-26
      - ma-20-41
      themes:
      - series-alternees
    - contenu: Produit de Cauchy de deux séries absolument convergentes.
      precisions: "La démonstration n'est pas exigible."
      demo: non exigible
      cours:
      - "ma-20:7"
      themes:
      - familles-sommables
  - intitule: "B - Suites et séries de fonctions · a) Modes de convergence d'une suite ou d'une série de fonctions"
    points:
    - contenu: "Convergence simple d'une suite de fonctions. Convergence uniforme. La convergence uniforme entraîne la convergence simple."
      cours:
      - "mp-08:2"
      ex:
      - mp-08-01
