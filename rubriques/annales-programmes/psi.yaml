    - contenu: "Sous-additivité : $P\\Big(\\bigcup_{n=0}^{+\\infty}A_n\\Big)\\leqslant\\sum_{n=0}^{+\\infty}P(A_n)$."
      precisions: "En cas de divergence de la série à termes positifs $\\sum P(A_n)$, on rappelle que $\\sum_{n=0}^{+\\infty}P(A_n)=+\\infty$."
      cours:
      - "mp-14:3"
      ex:
