  - intitule: B - Probabilités, variables aléatoires discrètes et lois usuelles · b) Probabilité
    points:
    - contenu: "Probabilité sur $(\\Omega,\\mathcal{A})$, $\\sigma$-additivité. Espace probabilisé $(\\Omega,\\mathcal{A},P)$."
      precisions: Notation $P(A)$.
      cours:
