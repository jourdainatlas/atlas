    - contenu: Continuité croissante, continuité décroissante.
      precisions: "Application : pour une suite $(A_n)_{n\\in\\mathbb{N}}$ d'événements (non nécessairement monotone), limites quand $n$ tend vers l'infini de $P\\Big(\\bigcup_{k=0}^n A_k\\Big)$ et $P\\\
        Big(\\bigcap_{k=0}^n A_k\\Big)$."
      cours:
