      precisions: "Si $(A_n)_{n\\geqslant0}$ est un système complet ou quasi-complet d'événements, alors $P(B)=\\sum_{n=0}^{+\\infty}P(B\\cap A_n)=\\sum_{n=0}^{+\\infty}P(B\\,|\\,A_n)P(A_n)$. On rappelle\
        \ la convention $P(B\\,|\\,A_n)P(A_n)=0$ lorsque $P(A_n)=0$."
      cours:
