  - intitule: "B - Suites et séries de fonctions · b) Régularité de la limite d'une suite de fonctions"
    points:
    - contenu: "Continuité de la limite d'une suite de fonctions : si une suite $(f_n)$ de fonctions continues sur $I$ converge uniformément vers $f$ sur $I$, alors $f$ est continue sur $I$."
      precisions: "En pratique, on vérifie la convergence uniforme sur tout segment, ou sur d'autres intervalles adaptés à la situation."
      cours:
      - "mp-08:3"
      ex:
      - mp-08-13
      - mp-08-54
      themes:
      - convergence-uniforme
      - interversions
    - contenu: "Intégration sur un segment de la limite d'une suite de fonctions : si une suite $(f_n)$ de fonctions continues converge uniformément vers $f$ sur $[a,b]$ alors $\\int_a^b f_n(t)\\,\\mathrm{d}t\\\
        xrightarrow[n\\to+\\infty]{}\\int_a^b f(t)\\,\\mathrm{d}t$."
      cours:
      - "mp-08:4"
      ex:
      - mp-08-16
      - mp-08-17
      - mp-08-18
      - mp-08-19
      themes:
      - interversions
      - convergence-uniforme
    - contenu: "Dérivabilité de la limite d'une suite de fonctions : si une suite $(f_n)$ de fonctions de classe $\\mathcal{C}^1$ sur un intervalle $I$ converge simplement sur $I$ vers une fonction $f$,\
        \ et si la suite $(f_n')$ converge uniformément sur $I$ vers une fonction $g$, alors $f$ est de classe $\\mathcal{C}^1$ sur $I$ et $f'=g$."
      precisions: "En pratique, on vérifie la convergence uniforme sur tout segment, ou sur d'autres intervalles adaptés à la situation."
      cours:
      - "mp-08:4"
      ex:
      - mp-08-20
      - mp-08-21
      - mp-08-22
      themes:
      - interversions
      - convergence-uniforme
      note: "La question 2 de l'exercice 8.21 (convergence uniforme sur tout segment pour f de classe $\\mathcal{C}^1$) repose sur la continuité uniforme de f′ sur un segment (théorème de Heine), hors programme\
        \ de PSI."
    - contenu: "Extension aux suites de fonctions de classe $\\mathcal{C}^k$, sous l'hypothèse de convergence uniforme de $(f_n^{(k)})$ et de convergence simple de $(f_n^{(j)})$ pour $0\\leqslant j<k$."
      cours:
      - "mp-08:4"
      themes:
      - interversions
      note: "Le cas des fonctions de classe $\\mathcal{C}^k$ n'est travaillé en exercice que pour les séries de fonctions : voir le point correspondant du paragraphe c)."
  - intitule: "B - Suites et séries de fonctions · c) Régularité de la somme d'une série de fonctions"
    points:
    - contenu: "Continuité de la somme d'une série de fonctions : si une série $\\sum f_n$ de fonctions continues sur $I$ converge uniformément sur $I$, alors sa somme est continue sur $I$."
      precisions: "En pratique, on vérifie la convergence uniforme sur tout segment, ou sur d'autres intervalles adaptés à la situation."
      cours:
      - "mp-08:5"
      ex:
      - mp-08-33
      - mp-08-36
      - mp-08-38
      - mp-08-34
      - mp-08-40
      themes:
      - suites-series-fonctions
      - interversions
    - contenu: "Théorème de la double limite : si une série $\\sum f_n$ de fonctions définies sur $I$ converge uniformément sur $I$ et si, pour tout $n$, $f_n$ admet une limite $\\ell_n$ en $a$ borne de\
        \ $I$ (éventuellement infinie), alors la série $\\sum \\ell_n$ converge, la somme de la série admet une limite en $a$ et $\\sum_{n=0}^{+\\infty} f_n(x)\\xrightarrow[x\\to a]{}\\sum_{n=0}^{+\\infty}\\\
        ell_n$."
      precisions: La démonstration est hors programme.
      demo: hors programme
      cours:
      - "mp-08:3"
      - "mp-08:5"
      ex:
      - mp-08-38
      - mp-08-39
      - mp-08-33
      themes:
      - interversions
      - suites-series-fonctions
    - contenu: "Intégration de la somme d'une série de fonctions sur un segment : si une série $\\sum f_n$ de fonctions continues converge uniformément sur $[a,b]$ alors la série des intégrales est convergente\
        \ et $\\int_a^b\\sum_{n=0}^{+\\infty}f_n(t)\\,\\mathrm{d}t=\\sum_{n=0}^{+\\infty}\\int_a^b f_n(t)\\,\\mathrm{d}t$."
      cours:
      - "mp-08:5"
      - "mp-08:4"
      ex:
      - mp-08-31
      - mp-08-55
      themes:
      - interversions
      - suites-series-fonctions
    - contenu: "Dérivation de la somme d'une série de fonctions : si une série $\\sum f_n$ de classe $\\mathcal{C}^1$ converge simplement sur un intervalle $I$ et si la série $\\sum f_n'$ converge uniformément\
        \ sur $I$, alors la somme $\\sum_{n=0}^{+\\infty}f_n$ est de classe $\\mathcal{C}^1$ sur $I$ et sa dérivée est $\\sum_{n=0}^{+\\infty}f_n'$."
      precisions: "En pratique, on vérifie la convergence uniforme sur tout segment ou sur d'autres intervalles adaptés à la situation."
      cours:
      - "mp-08:5"
      ex:
      - mp-08-37
      - mp-08-38
      - mp-08-32
      - mp-08-39
      - mp-08-35
      - mp-08-40
      themes:
      - interversions
      - suites-series-fonctions
    - contenu: "Extension à la classe $\\mathcal{C}^k$ sous hypothèse similaire à celle décrite dans le cas des suites de fonctions."
      cours:
      - "mp-08:5"
      ex:
      - mp-08-32
      - mp-08-40
      - mp-08-34
      themes:
      - interversions
      - suites-series-fonctions
  - intitule: C - Séries entières · a) Rayon de convergence
    points:
    - contenu: Série entière de la variable réelle, de la variable complexe.
      cours:
      - "mp-09:2"
      themes:
      - series-entieres
    - contenu: "Lemme d'Abel : si la suite $(a_n z_0^n)$ est bornée alors, pour tout nombre complexe $z$ tel que $|z|<|z_0|$, la série $\\sum a_n z^n$ est absolument convergente."
      cours:
      - "mp-09:2"
      themes:
      - series-entieres
    - contenu: "Rayon de convergence $R$ défini comme borne supérieure dans $[0,+\\infty]$ de l'ensemble des réels positifs $r$ tels que la suite $(a_n r^n)$ est bornée."
      precisions: "La série $\\sum a_n z^n$ converge absolument si $|z|<R$, et elle diverge grossièrement si $|z|>R$."
      cours:
      - "mp-09:2"
      ex:
      - mp-09-01
      - mp-09-02
      - mp-09-03
      - mp-09-05
      - mp-09-04
      - mp-09-06
      themes:
      - series-entieres
    - contenu: Intervalle ouvert de convergence. Disque ouvert de convergence.
      cours:
      - "mp-09:2"
      ex:
      - mp-09-02
      themes:
      - series-entieres
    - contenu: "Avec $R_a$ (resp. $R_b$) le rayon de convergence de $\\sum a_n z^n$ (resp. $\\sum b_n z^n$) : si $a_n=O(b_n)$, alors $R_a\\geqslant R_b$ ; si $a_n\\sim b_n$, alors $R_a=R_b$."
      precisions: "Pour $\\alpha\\in\\mathbb{R}$, $R\\big(\\sum n^\\alpha x^n\\big)=1$. Le résultat s'applique en particulier lorsque $a_n=o(b_n)$."
      cours:
      - "mp-09:2"
      ex:
      - mp-09-01
      - mp-09-06
      - mp-09-05
      themes:
      - series-entieres
    - contenu: "Application de la règle de d'Alembert pour les séries numériques au calcul du rayon."
      precisions: "La limite du rapport $\\frac{|a_{n+1}|}{|a_n|}$ peut être directement utilisée."
      cours:
      - "mp-09:2"
      ex:
      - mp-09-01
      - mp-09-03
      - mp-09-11
      themes:
      - series-entieres
    - contenu: Rayon de convergence de la somme et du produit de Cauchy de deux séries entières.
      cours:
      - "mp-09:2"
      ex:
      - mp-09-07
      - mp-09-28
      - mp-09-45
      themes:
      - series-entieres
      - familles-sommables
