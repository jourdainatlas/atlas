  - intitule: B - Probabilités, variables aléatoires discrètes et lois usuelles · f) Variables aléatoires indépendantes
    points:
    - contenu: Deux variables aléatoires discrètes $X$ et $Y$ définies sur $\Omega$ sont indépendantes si, pour tout $A\subset X(\Omega)$ et $B\subset Y(\Omega)$, les événements $(X\in A)$ et $(Y\in B)$
        sont indépendants.
      precisions: "Notation $X\\perp\\!\\!\\!\\perp Y$. De façon équivalente, la distribution de probabilités de $(X,Y)$ est donnée par $P(X=x,Y=y)=P(X=x)P(Y=y)$. Extension au cas de $n$ variables aléatoires."
      cours:
      - "mp-14:7"
      ex:
      - mp-14-27
      - mp-14-29
      - mp-14-28
      - mp-14-31
      - mp-14-32
      themes:
