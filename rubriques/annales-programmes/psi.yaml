  - intitule: "C - Espérance et variance · a) Espérance d'une variable aléatoire discrète réelle ou complexe"
    points:
    - contenu: "Espérance d'une variable aléatoire à valeurs dans $[0,+\\infty]$, définie par $\\mathrm{E}(X)=\\sum_{x\\in X(\\Omega)}xP(X=x)$."
      precisions: On adopte la convention $xP(X=x)=0$ lorsque $x=+\infty$ et $P(X=+\infty)=0$.
      cours:
      - "mp-15:2"
      ex:
      - mp-15-01
      - mp-15-04
      - mp-15-41
      themes:
      - esperance-variance
    - contenu: "Variable aléatoire $X$ à valeurs réelles ou complexes d'espérance finie, espérance de $X$."
      precisions: "$X$ est d'espérance finie si la famille $\\big(xP(X=x)\\big)_{x\\in X(\\Omega)}$ est sommable. Dans ce cas, la somme de cette famille est l'espérance de $X$. Variable centrée."
      cours:
      - "mp-15:2"
      ex:
      - mp-15-01
      - mp-15-41
      themes:
      - esperance-variance
    - contenu: "Pour $X$ variable aléatoire à valeurs dans $\\mathbb{N}\\cup\\{+\\infty\\}$, relation : $\\mathrm{E}(X)=\\sum_{n=1}^{+\\infty}P(X\\geqslant n)$."
      cours:
      - "mp-15:2"
      ex:
      - mp-15-07
      - mp-15-10
      - mp-15-11
      - mp-15-26
      - mp-15-14
      - mp-15-41
      themes:
      - esperance-queue
    - contenu: "Espérance d'une variable géométrique, de Poisson."
      cours:
      - "mp-15:2"
      ex:
      - mp-15-08
      - mp-15-27
      - mp-15-35
      themes:
      - esperance-variance
      - loi-geometrique
      - loi-poisson
    - contenu: "Formule de transfert : $f(X)$ est d'espérance finie si et seulement si la famille $\\big(f(x)P(X=x)\\big)_{x\\in X(\\Omega)}$ est sommable. Dans ce cas : $\\mathrm{E}\\big(f(X)\\big)=\\\
        sum_{x\\in X(\\Omega)}f(x)P(X=x)$."
      precisions: "On remarque que la formule s'applique aux couples, aux $n$-uplets de variables aléatoires."
      cours:
      - "mp-15:2"
      ex:
      - mp-15-02
      - mp-15-35
      - ma-21-70
      themes:
      - esperance-variance
    - contenu: "Linéarité de l'espérance."
      cours:
      - "mp-15:2"
      ex:
      - mp-15-08
      - mp-15-19
      - mp-15-13
      themes:
      - variables-indicatrices
      - esperance-variance
    - contenu: "Si $|X|\\leqslant Y$ et $\\mathrm{E}(Y)<+\\infty$, alors $X$ est d'espérance finie."
      cours:
      - "mp-15:2"
      ex:
      - mp-15-41
      themes:
      - esperance-variance
    - contenu: "Positivité, croissance de l'espérance."
      cours:
      - "mp-15:2"
      ex:
      - mp-15-04
      - mp-15-12
      themes:
      - esperance-variance
    - contenu: "Si $X$ est positive et d'espérance nulle, alors $(X=0)$ est presque sûr."
      cours:
      - "mp-15:2"
      themes:
      - esperance-variance
    - contenu: "Pour $X$ et $Y$ deux variables aléatoires indépendantes d'espérance finie, alors $XY$ est d'espérance finie et : $\\mathrm{E}(XY)=\\mathrm{E}(X)\\mathrm{E}(Y)$."
      precisions: Extension au cas de $n$ variables aléatoires.
      cours:
      - "mp-15:2"
      ex:
      - mp-15-33
      - mp-15-41
      - mp-15-13
      themes:
      - esperance-variance
  - intitule: "C - Espérance et variance · b) Variance d'une variable aléatoire discrète réelle, écart type et covariance"
    points:
    - contenu: "Si $X^2$ est d'espérance finie, $X$ est d'espérance finie."
      cours:
      - "mp-15:3"
      ex:
      - mp-15-41
      themes:
      - esperance-variance
    - contenu: "Inégalité de Cauchy-Schwarz : si $X^2$ et $Y^2$ sont d'espérance finie, alors $XY$ l'est aussi et : $\\mathrm{E}(XY)^2\\leqslant\\mathrm{E}(X^2)\\mathrm{E}(Y^2)$."
      precisions: "Cas d'égalité."
      cours:
      - "mp-15:3"
      ex:
      - mp-15-18
      - mp-15-19
      - ma-21-85
      themes:
      - cauchy-schwarz
      - esperance-variance
    - contenu: Variance, écart type.
      precisions: "Notations $\\mathrm{V}(X)$, $\\sigma(X)$. Variable réduite."
      cours:
      - "mp-15:3"
      ex:
      - mp-15-01
      - mp-15-16
      - mp-15-41
      themes:
      - esperance-variance
    - contenu: "Relation $\\mathrm{V}(X)=\\mathrm{E}(X^2)-\\mathrm{E}(X)^2$."
      cours:
      - "mp-15:3"
      ex:
      - mp-15-16
      - mp-15-20
      - mp-15-21
      themes:
      - esperance-variance
    - contenu: "Relation $\\mathrm{V}(aX+b)=a^2\\mathrm{V}(X)$."
      precisions: "Si $\\sigma(X)>0$, la variable $\\frac{X-\\mathrm{E}(X)}{\\sigma(X)}$ est centrée réduite."
      cours:
      - "mp-15:3"
      ex:
      - ma-21-82
      themes:
      - esperance-variance
    - contenu: "Variance d'une variable géométrique, de Poisson."
