  - intitule: B - Probabilités, variables aléatoires discrètes et lois usuelles · e) Événements indépendants
    points:
    - contenu: Indépendance de deux événements.
      precisions: "Si $P(B)>0$, l'indépendance de $A$ et $B$ équivaut à $P(A\\,|\\,B)=P(A)$."
