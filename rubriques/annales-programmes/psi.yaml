      - mp-14-07
      themes:
      - probabilites-discretes
    - contenu: "Une variable aléatoire discrète $X$ est une application définie sur $\\Omega$, telle que $X(\\Omega)$ est au plus dénombrable et, pour tout $x\\in X(\\Omega)$, $X^{-1}(\\{x\\})$ est un événement."
      precisions: "L'univers $\\Omega$ n'est en général pas explicité. Notations $(X=x)$, $\\{X=x\\}$, $(X\\in A)$. Notation $(X\\geqslant x)$ (et analogues) lorsque $X$ est à valeurs réelles."
