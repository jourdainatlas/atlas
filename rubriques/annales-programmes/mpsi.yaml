- intitule: Intégration
  periode: Deuxième semestre
  objectif: "Cette section a pour principal objectif de définir l’intégrale d’une fonction continue par morceaux sur un segment et d’en établir les propriétés principales ; elle offre l’occasion de revenir\
    \ sur les techniques de calcul intégral, mais aussi de traiter des exercices d’esprit plus théorique. Les méthodes de calcul approché d’intégrales donnent l’occasion de revenir sur la problématique\
    \ de l’approximation (on pourra comparer les performances de la méthode des rectangles et de celle des trapèzes). La notion de continuité uniforme est introduite uniquement en vue de la construction\
    \ de l’intégrale ; l’étude systématique des fonctions uniformément continues n’est pas un attendu du programme. Le corps $\\mathbb{K}$ est pris égal à $\\mathbb{R}$ ou $\\mathbb{C}$, le professeur pouvant\
    \ se placer d’emblée dans le cadre complexe ou traiter d’abord le cas réel."
  hors_programme:
  - L’égalité de Taylor-Lagrange.
  blocs:
  - intitule: a) Continuité uniforme
    points:
    - contenu: Continuité uniforme.
      precisions: Exemple des fonctions lipschitziennes.
      cours:
      - "ma-08:5"
      ex:
      - ma-08-42
      - ma-08-44
      - ma-08-43
      - ma-08-45
      - ma-08-46
      themes:
      - continuite-uniforme
    - contenu: Théorème de Heine.
      precisions: La démonstration n’est pas exigible.
      demo: non exigible
      cours:
      - "ma-08:5"
      ex:
      - ma-08-45
      - ma-08-47
      - ma-18-40
      themes:
      - continuite-uniforme
  - intitule: b) Fonctions continues par morceaux
    points:
    - contenu: Subdivision d’un segment, pas d’une subdivision.
      cours:
      - "ma-18:2"
      ex:
      - ma-18-01
      themes:
      - integration-segment
    - contenu: Fonction en escalier, fonction continue par morceaux.
      precisions: "Les fonctions sont définies sur un segment et à valeurs dans $\\mathbb{K}$. Structure de sous-espace vectoriel et de sous-anneau de l’ensemble des fonctions continues par morceaux sur\
        \ un segment à valeurs dans $\\mathbb{K}$."
      cours:
      - "ma-18:2"
      ex:
      - ma-18-01
      - ma-18-48
      - ma-18-02
      themes:
      - integration-segment
  - intitule: c) Intégrale d’une fonction continue par morceaux sur un segment
    points:
    - contenu: "Intégrale d’une fonction continue par morceaux sur un segment à valeurs dans $\\mathbb{K}$."
      precisions: "Le programme n’impose pas de construction particulière. Interprétation géométrique de l’intégrale. Notations $\\int_{[a,b]}f$, $\\int_a^bf$, $\\int_a^bf(t)\\,\\mathrm{d}t$."
      cours:
      - "ma-18:3"
      ex:
      - ma-18-01
      - ma-18-02
      themes:
      - integration-segment
    - contenu: Linéarité, positivité et croissance de l’intégrale.
      cours:
      - "ma-18:3"
      ex:
      - ma-18-04
      - ma-18-03
      - ma-18-10
      - ma-18-11
      - ma-18-14
      themes:
      - integration-segment
    - contenu: "Inégalité triangulaire intégrale : $\\left|\\int_{[a,b]}f\\right|\\leqslant\\int_{[a,b]}|f|$."
      cours:
      - "ma-18:3"
      ex:
      - ma-18-05
      - ma-18-09
      themes:
      - integration-segment
    - contenu: Relation de Chasles.
      precisions: "Extension de la notation $\\int_a^bf(t)\\,\\mathrm{d}t$ au cas où $b\\leqslant a$. Propriétés correspondantes."
      cours:
      - "ma-18:3"
      ex:
      - ma-18-01
      - ma-18-03
      themes:
      - integration-segment
    - contenu: "Si $f$ est continue, à valeurs dans $\\mathbb{R}^+$ et si $\\int_{[a,b]}f=0$, alors $f=0$."
      cours:
      - "ma-18:3"
      ex:
      - ma-18-07
      - ma-18-09
      - ma-18-48
      - ma-18-14
      themes:
      - integration-segment
    - contenu: Intégrale d’une fonction paire ou impaire sur un segment centré en 0. Intégrale d’une fonction périodique sur un intervalle de période.
      precisions: Valeur moyenne d’une fonction continue par morceaux sur un segment.
      cours:
      - "ma-06:3"
      - "ma-18:3"
      ex:
      - ma-18-03
      - ma-06-06
      - ma-18-12
      themes:
      - integration-segment
      note: La parité et la périodicité sont démontrées au chapitre 6 pour les fonctions continues seulement ; la valeur moyenne est au chapitre 18.
  - intitule: d) Sommes de Riemann
    points:
    - contenu: "Pour $f$ continue par morceaux sur le segment $[a,b]$, $\\frac{b-a}{n}\\sum_{k=0}^{n-1}f\\Big(a+k\\frac{b-a}{n}\\Big)\\underset{n\\to+\\infty}{\\longrightarrow}\\int_a^bf(t)\\,\\mathrm{d}t$."
      precisions: Interprétation géométrique. Démonstration exigible pour $f$ lipschitzienne.
      cours:
      - "ma-18:6"
      ex:
      - ma-18-38
      - ma-18-39
      - ma-18-40
      - ma-18-43
      - ma-18-42
      themes:
      - sommes-riemann
  - intitule: e) Lien entre intégrale et primitive
    points:
    - contenu: "Dérivation de $x\\mapsto\\int_a^xf(t)\\,\\mathrm{d}t$ pour $f$ continue."
      cours:
      - "ma-18:4"
      ex:
      - ma-18-17
      - ma-18-24
      - ma-18-23
      - ma-18-22
      - ma-18-25
      - ma-18-28
      themes:
      - integration-segment
    - contenu: Toute fonction continue sur un intervalle possède des primitives.
      cours:
      - "ma-18:4"
      ex:
      - ma-18-26
      themes:
      - integration-segment
  - intitule: f) Formules de Taylor globales
    points:
    - contenu: Formule de Taylor avec reste intégral et inégalité de Taylor-Lagrange.
      precisions: L’égalité de Taylor-Lagrange est hors programme. On souligne la différence de nature entre la formule de Taylor-Young (locale) et les formules de Taylor globales.
      cours:
      - "ma-18:5"
      ex:
      - ma-18-32
      - ma-18-33
      - ma-18-35
      - ma-18-34
      - ma-18-36
      - ma-18-37
      themes:
      - formules-taylor
- intitule: Dénombrement
  periode: Deuxième semestre
  objectif: "Cette section est introduite essentiellement en vue de son utilisation en probabilités ; rattaché aux mathématiques discrètes, le dénombrement interagit également avec l’algèbre et l’informatique.\
    \ Toute formalisation excessive est exclue : parmi les propriétés du paragraphe a), les plus intuitives sont admises sans démonstration, et l’utilisation de bijections dans les problèmes de dénombrement\
    \ n’est pas un attendu du programme."
  hors_programme:
  - Tout fondement théorique des notions d’entier naturel et de cardinal.
  - La formule du crible.
  blocs:
  - intitule: a) Cardinal d’un ensemble fini
    points:
    - contenu: Cardinal d’un ensemble fini.
      precisions: "Notations $|A|$, $\\operatorname{Card}(A)$. Tout fondement théorique des notions d’entier naturel et de cardinal est hors programme."
      cours:
      - "ma-21:2"
      - "ma-02:5"
      themes:
      - denombrement
    - contenu: Cardinal d’une partie d’un ensemble fini, cas d’égalité.
      cours:
      - "ma-21:2"
      - "ma-02:5"
      themes:
      - denombrement
    - contenu: Une application entre deux ensembles finis de même cardinal est bijective si et seulement si elle est injective, si et seulement si elle est surjective.
      cours:
      - "ma-21:2"
      - "ma-02:5"
      ex:
      - ma-11-44
      themes:
      - denombrement
    - contenu: "Opérations sur les cardinaux : union disjointe ou quelconque, complémentaire, différence, produit cartésien."
      precisions: La formule du crible est hors programme.
      cours:
      - "ma-21:2"
      - "ma-02:5"
      ex:
      - ma-21-04
      - ma-21-01
      - ma-21-06
      - ma-02-25
      themes:
      - denombrement
    - contenu: Cardinal de l’ensemble des applications d’un ensemble fini dans un autre.
      cours:
      - "ma-21:2"
      ex:
      - ma-21-02
      - ma-02-25
      themes:
      - denombrement
    - contenu: Cardinal de l’ensemble des parties d’un ensemble fini.
      cours:
      - "ma-21:2"
      ex:
      - ma-01-39
      - ma-02-25
      - ma-21-05
      - ma-21-10
      - ma-21-11
      themes:
      - denombrement
  - intitule: b) Listes et combinaisons
    points:
    - contenu: Nombre de $p$-listes (ou $p$-uplets) d’éléments distincts d’un ensemble de cardinal $n$, nombre de permutations d’un ensemble de cardinal $n$.
      precisions: Nombre d’applications injectives d’un ensemble de cardinal $p$ dans un ensemble de cardinal $n$.
      cours:
      - "ma-21:2"
      ex:
      - ma-21-01
      - ma-21-02
      - ma-02-25
      - ma-21-03
      - ma-21-19
      themes:
      - denombrement
    - contenu: Nombre de parties à $p$ éléments (ou $p$-combinaisons) d’un ensemble de cardinal $n$.
      precisions: Démonstration combinatoire des formules de Pascal et du binôme.
      cours:
      - "ma-21:2"
      - "ma-03:4"
      ex:
      - ma-21-06
      - ma-21-07
      - ma-03-31
      - ma-03-36
      - ma-21-12
      - ma-21-20
      themes:
      - denombrement
      - coefficients-binomiaux
- intitule: Probabilités
  periode: Deuxième semestre
  objectif: "Cette section, qui a vocation à interagir avec l’ensemble du programme, a pour objectif de donner aux étudiants une bonne pratique des variables aléatoires dans le cadre fini. On met en évidence\
    \ qu’une situation probabiliste finie peut être décrite par un $n$-uplet de variables aléatoires, l’univers étant vu comme une source suffisante d’aléa, afin de travailler le plus tôt possible avec\
    \ des événements construits en termes de variables aléatoires ; la construction d’un univers fini susceptible de porter un $n$-uplet de variables aléatoires peut être présentée, mais ne constitue pas\
    \ un objectif du programme. On pourra faire travailler les étudiants sur des marches aléatoires ou des chaînes de Markov en temps fini, des permutations aléatoires (loi uniforme sur $\\mathcal{S}_n$),\
    \ des graphes aléatoires, des inégalités de concentration. Le programme de première année s’achève sur une approche non asymptotique de la loi faible des grands nombres qui justifie l’approche fréquentiste\
    \ des probabilités."
  hors_programme:
  - La formule du crible.
  blocs:
  - intitule: A - Probabilités sur un univers fini, variables aléatoires et lois · a) Univers, événements, variables aléatoires
    points:
    - contenu: Lien entre vocabulaire ensembliste et vocabulaire des probabilités.
      precisions: On se limite au cas d’un univers fini. Événement élémentaire (singleton), système complet d’événements, événements disjoints (ou incompatibles).
      cours:
      - "ma-21:3"
      themes:
      - probabilites-discretes
    - contenu: Une variable aléatoire $X$ est une application définie sur l’univers $\Omega$ à valeurs dans un ensemble $E$.
      precisions: "Notations $\\{X\\in A\\}$ et $(X\\in A)$."
      cours:
      - "ma-21:5"
      themes:
      - variables-aleatoires
  - intitule: A - Probabilités sur un univers fini, variables aléatoires et lois · b) Espaces probabilisés finis
    points:
    - contenu: Probabilité sur un univers fini.
      precisions: Espace probabilisé fini $(\Omega,P)$. Notations $P(X\in A)$, $P(X=x)$ et $P(X\leqslant x)$.
      cours:
      - "ma-21:3"
      ex:
      - ma-21-23
      - ma-21-24
      - ma-21-25
      - ma-21-32
      themes:
      - probabilites-discretes
    - contenu: "Une distribution de probabilités sur un ensemble $E$ est une famille d’éléments de $\\mathbb{R}^+$ indexée par $E$ et de somme 1."
      precisions: "Une probabilité $P$ sur $\\Omega$ est déterminée par la distribution de probabilités $\\big(P(\\{\\omega\\})\\big)_{\\omega\\in\\Omega}$."
      cours:
      - "ma-21:3"
      ex:
      - ma-21-24
      themes:
      - probabilites-discretes
    - contenu: Une distribution de probabilités sur un ensemble fini est une famille de réels positifs indexée par cet ensemble et de somme 1.
      cours:
      - "ma-21:3"
      ex:
      - ma-21-24
      themes:
      - probabilites-discretes
    - contenu: Probabilité uniforme.
      cours:
      - "ma-21:3"
      ex:
      - ma-21-25
      - ma-21-27
      - ma-21-29
      - ma-21-30
      - ma-21-33
      themes:
      - loi-uniforme-discrete
      - denombrement
    - contenu: Probabilité de la réunion ou de la différence de deux événements, de l’événement contraire. Croissance.
      precisions: La formule du crible est hors programme.
      cours:
      - "ma-21:3"
      ex:
      - ma-21-23
      - ma-21-25
      - ma-21-32
      themes:
      - probabilites-discretes
  - intitule: A - Probabilités sur un univers fini, variables aléatoires et lois · c) Probabilités conditionnelles
    points:
    - contenu: "Si $P(B)>0$, la probabilité conditionnelle de $A$ sachant $B$ est définie par la relation $P(A|B)=P_B(A)=\\frac{P(A\\cap B)}{P(B)}$."
      cours:
      - "ma-21:4"
      ex:
      - ma-21-36
      - ma-21-42
      - ma-21-40
      themes:
      - conditionnement
    - contenu: L’application $P_B$ est une probabilité.
      cours:
      - "ma-21:4"
      themes:
      - conditionnement
    - contenu: Formules des probabilités composées, des probabilités totales, de Bayes.
      precisions: "Par convention, $P(A|B)P(B)=0$ lorsque $P(B)=0$."
      cours:
      - "ma-21:4"
      ex:
      - ma-21-35
      - ma-21-36
      - ma-21-37
      - ma-21-43
      - ma-21-50
      - ma-21-53
      themes:
      - bayes
      - conditionnement
  - intitule: A - Probabilités sur un univers fini, variables aléatoires et lois · d) Loi d’une variable aléatoire
    points:
    - contenu: Loi $P_X$ d’une variable aléatoire $X$ à valeurs dans $E$.
      precisions: "La probabilité $P_X$ est déterminée par la distribution de probabilités $\\big(P(X=x)\\big)_{x\\in E}$. On note $X\\sim Y$ la relation $P_X=P_Y$."
      cours:
      - "ma-21:5"
      ex:
      - ma-21-58
      - ma-21-71
      - ma-21-90
      themes:
      - variables-aleatoires
    - contenu: Variable aléatoire $f(X)$.
      precisions: Si $X\sim Y$ alors $f(X)\sim f(Y)$.
      cours:
      - "ma-21:5"
      ex:
      - ma-21-55
      - ma-21-71
      - ma-21-102
      themes:
      - variables-aleatoires
    - contenu: Variable uniforme sur un ensemble fini non vide $E$.
      precisions: "Notation $X\\sim\\mathcal{U}(E)$."
      cours:
      - "ma-21:5"
      ex:
      - ma-21-61
      - ma-21-63
      - ma-21-66
      themes:
      - loi-uniforme-discrete
    - contenu: "Variable de Bernoulli de paramètre $p\\in[0,1]$."
      precisions: "Notation $X\\sim\\mathcal{B}(p)$. Interprétation comme succès d’une expérience."
      cours:
      - "ma-21:5"
      ex:
      - ma-21-55
      themes:
      - loi-binomiale
    - contenu: "Variable binomiale de paramètres $n\\in\\mathbb{N}^*$ et $p\\in[0,1]$."
      precisions: "Notation $X\\sim\\mathcal{B}(n,p)$."
      cours:
      - "ma-21:5"
      ex:
      - ma-21-59
      - ma-21-60
      - ma-21-98
      themes:
      - loi-binomiale
    - contenu: Loi conditionnelle d’une variable aléatoire $X$ sachant un événement $A$.
      cours:
      - "ma-21:5"
      ex:
      - ma-21-87
      themes:
      - variables-aleatoires
      - conditionnement
    - contenu: Couple de variables aléatoires. Loi conjointe, lois marginales.
      precisions: Un couple de variables aléatoires est une variable aléatoire à valeurs dans un produit. Notation $P(X=x,Y=y)$. Extension aux $n$-uplets de variables aléatoires.
      cours:
      - "ma-21:5"
      ex:
      - ma-21-55
      - ma-21-81
      - ma-21-66
      - ma-21-87
      themes:
      - couples-variables
  - intitule: A - Probabilités sur un univers fini, variables aléatoires et lois · e) Événements indépendants
    points:
    - contenu: Les événements $A$ et $B$ sont indépendants si $P(A\cap B)=P(A)P(B)$.
      precisions: "Si $P(B)>0$, l’indépendance de $A$ et $B$ s’écrit $P(A|B)=P(A)$."
      cours:
      - "ma-21:4"
      ex:
      - ma-21-38
      - ma-21-47
      - ma-21-102
      themes:
      - conditionnement
    - contenu: Famille finie d’événements indépendants.
      precisions: L’indépendance deux à deux n’implique pas l’indépendance.
      cours:
      - "ma-21:4"
      ex:
      - ma-21-41
      - ma-21-46
      - ma-21-48
      - ma-21-54
      themes:
      - conditionnement
    - contenu: "Si $A$ et $B$ sont indépendants, $A$ et $\\overline{B}$ le sont aussi."
      precisions: Extension au cas de $n$ événements.
      cours:
      - "ma-21:4"
      ex:
      - ma-21-38
      - ma-21-41
      - ma-21-48
      themes:
      - conditionnement
  - intitule: A - Probabilités sur un univers fini, variables aléatoires et lois · f) Variables aléatoires indépendantes
    points:
    - contenu: "Les variables aléatoires $X$ et $Y$ définies sur l’univers $\\Omega$ sont indépendantes si pour tout $A\\in\\mathcal{P}(X(\\Omega))$ et tout $B\\in\\mathcal{P}(Y(\\Omega))$, les événements\
        \ $(X\\in A)$ et $(Y\\in B)$ sont indépendants."
      precisions: "Notation $X\\perp\\!\\!\\!\\perp Y$. Cette condition équivaut au fait que la distribution de probabilités de $(X,Y)$ est donnée par $P\\big((X,Y)=(x,y)\\big)=P(X=x)P(Y=y)$."
      cours:
      - "ma-21:5"
      ex:
      - ma-21-55
      - ma-21-81
      - ma-21-62
      - ma-21-66
      themes:
      - couples-variables
    - contenu: Extension aux $n$-uplets de variables aléatoires.
      precisions: "Modélisation de $n$ expériences aléatoires indépendantes par une suite finie $(X_i)_{1\\leqslant i\\leqslant n}$ de variables aléatoires indépendantes."
      cours:
      - "ma-21:5"
      ex:
      - ma-21-88
      - ma-21-61
      - ma-21-67
      themes:
      - couples-variables
    - contenu: "Si $X_1,\\dots,X_n$ sont indépendantes de loi $\\mathcal{B}(p)$, alors $X_1+\\dots+X_n$ suit la loi $\\mathcal{B}(n,p)$."
      precisions: "Interprétation : nombre de succès lors de la répétition de $n$ expériences indépendantes ayant chacune la probabilité $p$ de succès."
      cours:
      - "ma-21:5"
      ex:
      - ma-21-88
      - ma-21-60
      themes:
      - loi-binomiale
      - couples-variables
    - contenu: Si les variables aléatoires $X$ et $Y$ sont indépendantes, alors $f(X)$ et $g(Y)$ sont indépendantes.
      cours:
      - "ma-21:5"
      themes:
      - couples-variables
      note: "La proposition est démontrée au cours (proposition 16) ; les exercices de la feuille ne s'en servent qu'en passant, aucun ne la travaille pour elle-même."
    - contenu: "Lemme des coalitions : si les variables aléatoires $X_1,\\dots,X_n$ sont indépendantes, alors $f(X_1,\\dots,X_m)$ et $g(X_{m+1},\\dots,X_n)$ le sont aussi."
      precisions: Extension au cas de plus de deux coalitions.
      cours:
      - "ma-21:5"
      ex:
      - ma-21-61
      - ma-21-67
      themes:
      - couples-variables
  - intitule: B - Espérance et variance · a) Espérance d’une variable aléatoire réelle ou complexe
    points:
    - contenu: "Espérance $\\mathrm{E}(X)=\\sum_{x\\in X(\\Omega)}xP(X=x)$ d’une variable aléatoire $X$."
      precisions: "L’espérance est un indicateur de position. Formule $\\mathrm{E}(X)=\\sum_{\\omega\\in\\Omega}X(\\omega)P(\\{\\omega\\})$. Variable aléatoire centrée."
      cours:
      - "ma-21:6"
      ex:
      - ma-21-70
      - ma-21-71
      - ma-21-83
      themes:
      - esperance-variance
    - contenu: Linéarité, positivité, croissance, inégalité triangulaire.
      cours:
      - "ma-21:6"
      ex:
      - ma-21-72
      - ma-21-73
      - ma-21-76
      - ma-21-80
      themes:
      - esperance-variance
      - variables-indicatrices
    - contenu: Espérance d’une variable constante, de Bernoulli, binomiale.
      precisions: "Exemple : $\\mathrm{E}(\\mathbf{1}_A)=P(A)$."
      cours:
      - "ma-21:6"
      ex:
      - ma-21-88
      - ma-21-89
      themes:
      - esperance-variance
      - loi-binomiale
      - variables-indicatrices
    - contenu: "Formule de transfert : $\\mathrm{E}\\big(f(X)\\big)=\\sum_{x\\in X(\\Omega)}f(x)P(X=x)$."
      precisions: On souligne que la formule de transfert s’applique en particulier aux couples et aux $n$-uplets.
      cours:
      - "ma-21:6"
      ex:
      - ma-21-70
      - ma-21-71
      - ma-21-72
      themes:
      - esperance-variance
    - contenu: "Si $X$ et $Y$ sont indépendantes, alors $\\mathrm{E}(XY)=\\mathrm{E}(X)\\mathrm{E}(Y)$."
      precisions: Extension au cas de $n$ variables aléatoires indépendantes.
      cours:
      - "ma-21:6"
      ex:
      - ma-21-74
      - ma-21-102
      themes:
      - esperance-variance
      - couples-variables
  - intitule: B - Espérance et variance · b) Variance d’une variable aléatoire réelle, écart type et covariance
    points:
    - contenu: Variance et écart type d’une variable aléatoire réelle.
      precisions: Variance et écart type sont des indicateurs de dispersion. Variable aléatoire réduite.
      cours:
      - "ma-21:7"
      ex:
      - ma-21-83
      - ma-21-86
      themes:
      - esperance-variance
    - contenu: "Relation $\\mathrm{V}(aX+b)=a^2\\mathrm{V}(X)$."
      precisions: "Si $\\sigma(X)>0$, la variable $\\frac{X-\\mathrm{E}(X)}{\\sigma(X)}$ est centrée réduite."
      cours:
      - "ma-21:7"
      ex:
      - ma-21-82
      themes:
      - esperance-variance
    - contenu: "Relation $\\mathrm{V}(X)=\\mathrm{E}(X^2)-\\mathrm{E}(X)^2$."
      cours:
      - "ma-21:7"
      ex:
      - ma-21-83
      - ma-21-90
      themes:
      - esperance-variance
    - contenu: Variance d’une variable de Bernoulli, d’une variable binomiale.
      cours:
      - "ma-21:7"
      ex:
      - ma-21-95
      - ma-21-88
      themes:
      - esperance-variance
      - loi-binomiale
    - contenu: Covariance de deux variables aléatoires.
      precisions: Deux variables aléatoires dont la covariance est nulle sont dites décorrélées.
      cours:
      - "ma-21:7"
      ex:
      - ma-21-81
      - ma-21-86
      - ma-21-85
      - ma-21-94
      themes:
      - covariance
    - contenu: "Relation $\\operatorname{Cov}(X,Y)=\\mathrm{E}(XY)-\\mathrm{E}(X)\\mathrm{E}(Y)$, cas de deux variables indépendantes."
      cours:
      - "ma-21:7"
      ex:
      - ma-21-81
      - ma-21-86
      - ma-21-85
      themes:
      - covariance
    - contenu: Variance d’une somme, cas de variables décorrélées.
      precisions: On retrouve la variance d’une variable binomiale.
      cours:
      - "ma-21:7"
      ex:
      - ma-21-88
      - ma-21-89
      - ma-21-91
      - ma-21-93
      - ma-21-100
      themes:
      - esperance-variance
      - covariance
  - intitule: B - Espérance et variance · c) Inégalités probabilistes
    points:
    - contenu: Inégalité de Markov.
      precisions: Application à l’obtention d’inégalités de concentration.
      cours:
      - "ma-21:8"
      ex:
      - ma-21-99
      - ma-21-97
      - ma-21-101
      themes:
      - markov-bienayme
      - concentration
    - contenu: Inégalité de Bienaymé-Tchebychev.
      precisions: Application à une moyenne de variables indépendantes de même loi, interprétation fréquentiste.
      cours:
      - "ma-21:8"
      ex:
      - ma-21-95
      - ma-21-96
      - ma-21-98
      - ma-21-99
      themes:
      - markov-bienayme
      - loi-grands-nombres
- intitule: Espaces préhilbertiens réels
  periode: Deuxième semestre
  objectif: La notion de produit scalaire a été étudiée d’un point de vue élémentaire dans l’enseignement secondaire. L’objectif de cette section, qu’il est essentiel d’illustrer par de nombreuses figures,
    est de la généraliser, afin d’exploiter l’intuition acquise en dimension 2 ou 3 pour résoudre des problèmes posés dans un contexte plus abstrait. Les familles de polynômes orthogonaux donnent des illustrations
    pertinentes des notions abordées dans cette section.
  blocs:
  - intitule: a) Produit scalaire
    points:
    - contenu: Produit scalaire.
      precisions: "Notations $\\langle x,y\\rangle$, $(x|y)$, $x\\cdot y$."
      cours:
      - "ma-19:2"
      ex:
      - ma-19-01
      - ma-19-02
      - ma-19-03
      - ma-19-08
      themes:
      - prehilbertiens
    - contenu: Espace préhilbertien, espace euclidien.
      cours:
      - "ma-19:2"
      themes:
      - prehilbertiens
    - contenu: "Produit scalaire canonique sur $\\mathbb{R}^n$, sur $\\mathcal{M}_{n,p}(\\mathbb{R})$."
      precisions: "Expressions $X^\\top Y$, $\\operatorname{tr}(A^\\top B)$."
      cours:
      - "ma-19:2"
      ex:
      - ma-19-05
      - ma-19-32
      - ma-19-34
      themes:
      - prehilbertiens
    - contenu: "Produit scalaire $\\langle f,g\\rangle=\\int_a^bfg$ sur $\\mathcal{C}([a,b],\\mathbb{R})$."
      precisions: "Exemples de produits scalaires intégraux sur $\\mathbb{R}[X]$ et $\\mathcal{C}([a,b],\\mathbb{R})$."
      cours:
      - "ma-19:2"
      ex:
      - ma-19-02
      - ma-19-15
      - ma-19-03
      themes:
      - prehilbertiens
  - intitule: b) Norme associée à un produit scalaire
    points:
    - contenu: Norme associée à un produit scalaire, distance.
      cours:
      - "ma-19:3"
      ex:
      - ma-19-06
      - ma-19-10
      - ma-19-11
      themes:
      - prehilbertiens
    - contenu: Inégalité de Cauchy-Schwarz, cas d’égalité.
      precisions: "Exemples : sommes finies, intégrales."
      cours:
      - "ma-19:3"
      ex:
      - ma-19-04
      - ma-19-05
      - ma-19-07
      - ma-19-09
      themes:
      - cauchy-schwarz
      - prehilbertiens
    - contenu: Inégalité triangulaire, cas d’égalité.
      cours:
      - "ma-19:3"
      ex:
      - ma-19-10
      - ma-19-49
      themes:
      - prehilbertiens
    - contenu: "Identité remarquable $\\|x+y\\|^2=\\|x\\|^2+\\|y\\|^2+2\\langle x,y\\rangle$."
      precisions: Formule de polarisation associée.
      cours:
      - "ma-19:3"
      ex:
      - ma-19-06
      - ma-19-11
      themes:
      - prehilbertiens
  - intitule: c) Orthogonalité
    points:
    - contenu: Vecteurs orthogonaux, orthogonal d’une partie.
      precisions: Notation $X^\perp$. L’orthogonal d’une partie est un sous-espace.
      cours:
      - "ma-19:4"
      ex:
      - ma-19-12
      - ma-19-13
      - ma-19-33
      themes:
      - prehilbertiens
    - contenu: Famille orthogonale, orthonormée (ou orthonormale).
      cours:
      - "ma-19:4"
      ex:
      - ma-19-21
      themes:
      - prehilbertiens
    - contenu: Toute famille orthogonale de vecteurs non nuls est libre.
      cours:
      - "ma-19:4"
      ex:
      - ma-19-17
      themes:
      - prehilbertiens
    - contenu: Théorème de Pythagore.
      cours:
      - "ma-19:4"
      ex:
      - ma-19-13
      - ma-19-49
      themes:
      - prehilbertiens
    - contenu: Algorithme d’orthonormalisation de Gram-Schmidt.
      cours:
      - "ma-19:4"
      ex:
      - ma-19-14
      - ma-19-15
      - ma-19-16
      - ma-19-18
      themes:
      - gram-schmidt
  - intitule: d) Bases orthonormées
    points:
    - contenu: Existence de bases orthonormées dans un espace euclidien. Théorème de la base orthonormée incomplète.
      cours:
      - "ma-19:5"
      ex:
      - ma-19-24
      - ma-19-25
      themes:
      - prehilbertiens
      - gram-schmidt
    - contenu: Expression des coordonnées, du produit scalaire et de la norme dans une base orthonormée.
      cours:
      - "ma-19:5"
      ex:
      - ma-19-19
      - ma-19-20
      - ma-19-23
      - ma-19-22
      themes:
      - prehilbertiens
  - intitule: e) Projection orthogonale sur un sous-espace de dimension finie
    points:
    - contenu: Supplémentaire orthogonal d’un sous-espace $F$ de dimension finie. Projection orthogonale sur $F$. Expression du projeté orthogonal d’un vecteur $x$ dans une base orthonormée de $F$.
      precisions: "En dimension finie : dimension de $F^\\perp$, vecteur normal à un hyperplan."
      cours:
      - "ma-19:6"
      ex:
      - ma-19-28
      - ma-19-29
      - ma-19-30
      - ma-19-32
      - ma-19-41
      themes:
      - projection-orthogonale
    - contenu: Distance d’un vecteur à $F$.
      precisions: Notation $d(x,F)$.
      cours:
      - "ma-19:6"
      ex:
      - ma-19-29
      - ma-19-30
      - ma-19-35
      - ma-19-36
      - ma-19-52
      themes:
      - projection-orthogonale
    - contenu: Le projeté orthogonal de $x$ sur $F$ est l’unique élément de $F$ qui réalise la distance de $x$ à $F$.
      precisions: "En dimension finie, projeté orthogonal d’un vecteur sur l’hyperplan $\\operatorname{Vect}(u)^\\perp$ ; distance de $x$ à $\\operatorname{Vect}(u)^\\perp$."
      cours:
      - "ma-19:6"
      ex:
      - ma-19-28
      - ma-19-35
      - ma-19-45
      - ma-19-52
      themes:
      - projection-orthogonale
- intitule: Procédés sommatoires discrets
  periode: Deuxième semestre
  objectif: "L’étude des séries prolonge celle des suites et permet d’appliquer les techniques d’analyse asymptotique ; les objectifs majeurs portent sur les séries à termes positifs et la convergence absolue,\
    \ l’étude des séries semi-convergentes étant limitée aux exemples fournis par le théorème des séries alternées. L’étude des familles sommables est menée dans un deuxième temps : elle met en évidence\
    \ un cadre permettant de sommer « en vrac » une famille infinie ; dans le cas d’une famille positive, le calcul dans $[0,+\\infty]$ se suffit à lui-même et contient l’étude de la sommabilité, et dans\
    \ le cas d’une famille quelconque il est préconisé de commencer par un calcul formel à justifier dans un second temps. On se concentre sur la pratique, qui jouera un rôle important en deuxième année."
  hors_programme:
  - Le critère de Cauchy.
  - La démonstration des théorèmes de sommation par paquets.
  blocs:
  - intitule: a) Convergence et divergence
    points:
    - contenu: Sommes partielles d’une série numérique.
      precisions: La série est notée $\sum u_n$.
      cours:
      - "ma-20:2"
      ex:
      - ma-20-02
      - ma-20-06
      themes:
      - series-numeriques
    - contenu: Convergence, divergence, somme.
      precisions: "En cas de convergence, sa somme est notée $\\sum_{n=0}^{+\\infty}u_n$."
      cours:
      - "ma-20:2"
      ex:
      - ma-20-01
      - ma-20-02
      - ma-20-04
      - ma-20-05
      themes:
      - series-numeriques
    - contenu: Linéarité de la somme.
      cours:
      - "ma-20:2"
      ex:
      - ma-20-03
      - ma-20-30
      themes:
      - series-numeriques
    - contenu: Le terme général d’une série convergente tend vers 0.
      precisions: Divergence grossière.
      cours:
      - "ma-20:2"
      ex:
      - ma-20-04
      - ma-20-56
      themes:
      - series-numeriques
    - contenu: Reste d’une série convergente.
      cours:
      - "ma-20:2"
      ex:
      - ma-20-24
      - ma-20-41
      themes:
      - series-numeriques
    - contenu: Lien suite-série.
      precisions: "La suite $(u_n)$ et la série télescopique $\\sum(u_{n+1}-u_n)$ sont de même nature."
      cours:
      - "ma-20:2"
      ex:
      - ma-20-02
      - ma-20-05
      - ma-20-25
      themes:
      - series-numeriques
      - suites
    - contenu: "Séries géométriques : condition nécessaire et suffisante de convergence, somme."
      cours:
      - "ma-20:2"
      ex:
      - ma-20-21
      - ma-20-31
      themes:
      - series-numeriques
    - contenu: "Relation $e^z=\\sum_{n=0}^{+\\infty}\\frac{z^n}{n!}$ pour $z\\in\\mathbb{C}$."
      cours:
      - "ma-20:2"
      ex:
      - ma-20-03
      - ma-20-38
      themes:
      - series-numeriques
      - exponentielle-complexe
  - intitule: b) Séries à termes positifs ou nuls
    points:
    - contenu: Une série à termes positifs converge si et seulement si la suite de ses sommes partielles est majorée.
      cours:
      - "ma-20:3"
      ex:
      - ma-20-08
      themes:
      - series-numeriques
    - contenu: Si $0\leqslant u_n\leqslant v_n$ pour tout $n$, la convergence de $\sum v_n$ implique celle de $\sum u_n$.
      cours:
      - "ma-20:3"
      ex:
      - ma-20-07
      - ma-20-09
      - ma-20-17
      - ma-20-22
      themes:
      - series-numeriques
    - contenu: "Si $(u_n)_{n\\in\\mathbb{N}}$ et $(v_n)_{n\\in\\mathbb{N}}$ sont positives et si $u_n\\sim v_n$, les séries $\\sum u_n$ et $\\sum v_n$ sont de même nature."
      cours:
      - "ma-20:3"
      ex:
      - ma-20-07
      - ma-20-11
      - ma-20-12
      - ma-20-25
      themes:
      - series-numeriques
      - equivalents
    - contenu: Si $f$ est monotone, encadrement des sommes partielles de $\sum f(n)$ à l’aide de la méthode des rectangles.
      precisions: Application à l’étude de sommes partielles.
      cours:
      - "ma-20:3"
      ex:
      - ma-20-10
      - ma-20-15
      - ma-20-13
      - ma-20-23
      themes:
      - comparaison-serie-integrale
    - contenu: Séries de Riemann.
      cours:
      - "ma-20:3"
      ex:
      - ma-20-11
      - ma-20-13
      - ma-20-19
      - ma-20-14
      themes:
      - series-numeriques
      - comparaison-serie-integrale
  - intitule: c) Séries absolument convergentes à termes réels ou complexes
    points:
    - contenu: Une série numérique absolument convergente est convergente.
      precisions: Le critère de Cauchy est hors programme.
      cours:
      - "ma-20:4"
      ex:
      - ma-20-30
      - ma-20-31
      - ma-20-32
      - ma-20-34
      themes:
      - series-numeriques
    - contenu: "Si $(u_n)$ est une suite complexe, si $(v_n)$ est une suite d’éléments de $\\mathbb{R}^+$, si $u_n=O(v_n)$ et si $\\sum v_n$ converge, alors $\\sum u_n$ est absolument convergente donc convergente."
      cours:
      - "ma-20:4"
      ex:
      - ma-20-31
      - ma-20-32
      - ma-20-26
      themes:
      - series-numeriques
  - intitule: d) Théorème des séries alternées
    points:
    - contenu: "Si la suite réelle $(u_n)_{n\\in\\mathbb{N}}$ converge en décroissant vers 0, $\\sum(-1)^nu_n$ converge."
      precisions: Signe et majoration en valeur absolue de la somme, des restes.
      cours:
      - "ma-20:5"
      ex:
      - ma-20-35
      - ma-20-36
      - ma-20-38
      - ma-20-40
      - ma-20-41
      themes:
      - series-alternees
  - intitule: e) Familles sommables de nombres réels positifs
    points:
    - contenu: "Convention de calcul et relation d’ordre dans $[0,+\\infty]$."
      cours:
      - "ma-20:6"
      themes:
      - familles-sommables
    - contenu: "Borne supérieure dans $[0,+\\infty]$."
      cours:
      - "ma-20:6"
      themes:
      - familles-sommables
    - contenu: "Somme d’une famille $(u_i)_{i\\in I}$ d’éléments de $[0,+\\infty]$, définie comme borne supérieure dans $[0,+\\infty]$ de l’ensemble des sommes $\\sum_{i\\in F}u_i$ quand $F$ décrit l’ensemble\
        \ des parties finies de $I$."
      precisions: "La somme est notée $\\sum_{i\\in I}u_i$. Cas où $I$ est fini, où $I=\\mathbb{N}$ (lien avec les séries). On note $\\sum_{n=0}^{\\infty}u_n=+\\infty$ si la série $\\sum u_n$ d’éléments\
        \ de $\\mathbb{R}^+$ diverge. Invariance de la somme par permutation."
      cours:
      - "ma-20:6"
      ex:
      - ma-20-45
      - ma-20-57
      - ma-20-51
      themes:
      - familles-sommables
    - contenu: "La famille $(u_i)_{i\\in I}$ d’éléments de $\\mathbb{R}^+$ est dite sommable si $\\sum_{i\\in I}u_i<+\\infty$."
      precisions: On souligne que les calculs sont justifiés par la seule positivité et qu’ils fournissent un moyen d’étudier la sommabilité.
      cours:
      - "ma-20:6"
      ex:
      - ma-20-45
      - ma-20-46
      - ma-20-48
      - ma-20-57
      themes:
      - familles-sommables
    - contenu: "Opérations : somme, multiplication par un réel positif."
      cours:
      - "ma-20:6"
      themes:
      - familles-sommables
    - contenu: "Théorème de sommation par paquets : si $I$ est réunion disjointe des $I_j$ pour $j\\in J$ et si $(u_i)_{i\\in I}$ est à valeurs dans $\\mathbb{R}^+$, alors $\\sum_{j\\in J}\\Big(\\sum_{i\\\
        in I_j}u_i\\Big)=\\sum_{i\\in I}u_i$."
      precisions: La démonstration est hors programme.
      demo: hors programme
      cours:
      - "ma-20:6"
      ex:
      - ma-20-47
      - ma-20-48
      - ma-20-49
      - ma-20-51
      - ma-20-62
      themes:
      - familles-sommables
    - contenu: "Cas où $I$ est un produit : théorème de Fubini positif."
      cours:
      - "ma-20:6"
      ex:
      - ma-20-47
      - ma-20-46
      - ma-20-50
      themes:
      - familles-sommables
  - intitule: f) Familles sommables de nombres complexes
    points:
    - contenu: "La famille $(u_i)_{i\\in I}$ de $\\mathbb{C}^I$ est dite sommable si $\\sum_{i\\in I}|u_i|<+\\infty$."
      precisions: "Notation $\\ell^1(I)$. Pour $I=\\mathbb{N}$, lien avec les séries. Sommabilité d’une sous-famille d’une famille sommable."
      cours:
      - "ma-20:7"
      ex:
      - ma-20-52
      - ma-20-53
      - ma-20-56
      - ma-20-55
      themes:
      - familles-sommables
    - contenu: Somme d’une famille sommable de nombres complexes.
      precisions: "Si $(a_i)_{i\\in I}$ est sommable et si $\\varepsilon\\in\\mathbb{R}^{+*}$, il existe une partie finie $F$ de $I$ telle que $\\left|\\sum_{i\\in I}a_i-\\sum_{i\\in F}a_i\\right|\\leqslant\\\
        varepsilon$. Invariance de la somme par permutation."
      cours:
      - "ma-20:7"
      ex:
      - ma-20-56
      - ma-20-55
      themes:
      - familles-sommables
    - contenu: "Soit $(u_i)_{i\\in I}$ une famille de nombres complexes et soit $(v_i)$ une famille sommable de réels positifs vérifiant, pour tout $i\\in I$, $|u_i|\\leqslant v_i$. Alors $(u_i)_{i\\in\
        \ I}$ est sommable."
      cours:
      - "ma-20:7"
      ex:
      - ma-20-53
      - ma-20-60
      themes:
      - familles-sommables
    - contenu: Linéarité de la somme.
      cours:
      - "ma-20:7"
      themes:
      - familles-sommables
    - contenu: "Théorème de sommation par paquets : si $I$ est réunion disjointe des $I_j$ pour $j\\in J$, si $(u_i)_{i\\in I}$ est sommable, alors $\\sum_{j\\in J}\\Big(\\sum_{i\\in I_j}u_i\\Big)=\\sum_{i\\\
        in I}u_i$."
      precisions: La démonstration est hors programme.
      demo: hors programme
      cours:
      - "ma-20:7"
      ex:
      - ma-20-54
      - ma-20-60
      themes:
      - familles-sommables
    - contenu: "Cas où $I$ est un produit : théorème de Fubini."
      cours:
      - "ma-20:7"
      ex:
      - ma-20-52
      - ma-20-53
      - ma-20-54
      themes:
      - familles-sommables
    - contenu: "Si $(a_i)_{i\\in I}$ et $(b_{i'})_{i'\\in I'}$ sont sommables alors $(a_ib_{i'})_{(i,i')\\in I\\times I'}$ est sommable et $\\sum_{(i,i')\\in I\\times I'}a_ib_{i'}=\\sum_{i\\in I}a_i\\times\\\
        sum_{i'\\in I'}b_{i'}$."
      precisions: Extension, sans rédaction de la démonstration, au produit d’un nombre fini de familles sommables.
      cours:
      - "ma-20:7"
      ex:
      - ma-20-60
      themes:
      - familles-sommables
    - contenu: Produit de Cauchy de deux séries absolument convergentes.
      precisions: "On retrouve le fait que l’exponentielle complexe est un morphisme de $(\\mathbb{C},+)$ dans $(\\mathbb{C}^*,\\times)$."
      cours:
      - "ma-20:7"
      themes:
      - familles-sommables
      - exponentielle-complexe
- intitule: Fonctions de deux variables
  periode: Deuxième semestre
  objectif: Le but de cette section, dont le contenu sera entièrement repris dans un cadre plus général en seconde année, est de familiariser les étudiants avec les calculs sur les dérivées partielles,
    notamment avec la « règle de la chaîne », et de développer une vision géométrique des fonctions de deux variables. Le point de vue est donc essentiellement pratique. Il est fortement préconisé de traiter
    cette section en fin de semestre.
  hors_programme:
  - Toute extension et tout développement théorique supplémentaire.
  - La notion de fonction différentiable.
  - "La démonstration du développement limité à l’ordre 1 d’une fonction de classe $\\mathcal{C}^1$."
  blocs:
  - intitule: "a) Ouverts de $\\mathbb{R}^2$, fonctions continues"
    points:
    - contenu: "Boules de $\\mathbb{R}^2$ muni de la norme euclidienne canonique."
      cours:
      - "ma-22:2"
      ex:
      - ma-22-01
      themes:
      - topologie-evn
    - contenu: Ouverts.
      cours:
      - "ma-22:2"
      ex:
      - ma-22-01
      - ma-22-04
      themes:
      - topologie-evn
    - contenu: "Continuité d’une fonction définie sur un ouvert de $\\mathbb{R}^2$, à valeurs dans $\\mathbb{R}$."
      precisions: Représentation graphique d’une fonction de deux variables par une surface. La notion de continuité est introduite uniquement en vue du calcul différentiel. L’étude de la continuité d’une
        fonction n’est pas un objectif du programme.
      cours:
      - "ma-22:2"
      ex:
      - ma-22-02
      - ma-22-03
      - ma-22-07
      themes:
      - calcul-differentiel
  - intitule: b) Dérivées partielles
    points:
    - contenu: "Dérivées partielles en un point d’une fonction $f$ définie sur un ouvert de $\\mathbb{R}^2$, à valeurs dans $\\mathbb{R}$."
      precisions: "Notations $\\frac{\\partial f}{\\partial x}(x_0,y_0)$, $\\frac{\\partial f}{\\partial y}(x_0,y_0)$. L’existence des dérivées partielles n’entraîne pas la continuité."
      cours:
      - "ma-22:3"
      ex:
      - ma-22-05
      - ma-22-07
      - ma-22-16
      - ma-22-11
      - ma-22-13
      themes:
      - calcul-differentiel
    - contenu: "Fonction de classe $\\mathcal{C}^1$ sur un ouvert."
      precisions: Définition par la continuité des dérivées partielles. La notion de fonction différentiable est hors programme.
      cours:
      - "ma-22:3"
      ex:
      - ma-22-05
      - ma-22-06
      - ma-22-10
      - ma-22-12
      - ma-22-11
      themes:
      - calcul-differentiel
    - contenu: "Développement limité à l’ordre 1 au point $(x_0,y_0)$ d’une fonction $f$ de classe $\\mathcal{C}^1$ : $f(x_0+h,y_0+k)=f(x_0,y_0)+\\frac{\\partial f}{\\partial x}(x_0,y_0)h+\\frac{\\partial\
        \ f}{\\partial y}(x_0,y_0)k+o(\\|(h,k)\\|)$."
      precisions: "Démonstration hors programme. On met en évidence l’idée de l’approximation linéaire de $f(x_0+h,y_0+k)-f(x_0,y_0)$ et l’interprétation de $z-z_0=\\frac{\\partial f}{\\partial x}(x_0,y_0)(x-x_0)+\\\
        frac{\\partial f}{\\partial y}(x_0,y_0)(y-y_0)$ comme équation du plan tangent en $(x_0,y_0)$ à la surface d’équation $z=f(x,y)$."
      demo: hors programme
      cours:
      - "ma-22:3"
      ex:
      - ma-22-05
      - ma-22-11
      themes:
      - calcul-differentiel
    - contenu: "Gradient d’une fonction de classe $\\mathcal{C}^1$."
      precisions: Notation $\nabla f(x_0,y_0)$.
      cours:
      - "ma-22:3"
      ex:
      - ma-22-08
      - ma-22-21
      - ma-22-35
      themes:
      - calcul-differentiel
    - contenu: Expression du développement limité à l’aide du gradient.
      precisions: Le gradient de $f$ en $(x_0,y_0)$ définit la direction dans laquelle $f$ croît le plus vite.
      cours:
      - "ma-22:3"
      - "ma-22:4"
      themes:
      - calcul-differentiel
  - intitule: c) Dérivées partielles et composées
    points:
    - contenu: Dérivée selon un vecteur.
      precisions: Expression à l’aide du gradient $\langle\nabla f(x_0,y_0),u\rangle$.
      cours:
      - "ma-22:4"
      ex:
      - ma-22-16
      - ma-22-29
      themes:
      - calcul-differentiel
    - contenu: "Règle de la chaîne : les fonctions considérées étant de classe $\\mathcal{C}^1$, la fonction $t\\mapsto f(x(t),y(t))$ est de classe $\\mathcal{C}^1$ et $\\frac{\\mathrm{d}}{\\mathrm{d}t}\\\
        big(f(x(t),y(t))\\big)=\\frac{\\partial f}{\\partial x}(x(t),y(t))\\,x'(t)+\\frac{\\partial f}{\\partial y}(x(t),y(t))\\,y'(t)$."
      precisions: "Interprétation comme dérivée de $f$ le long d’un arc $\\gamma$ donné par $\\gamma(t)=(x(t),y(t))$ et expression à l’aide du gradient $(f\\circ\\gamma)'(t)=\\langle\\nabla f(\\gamma(t)),\\\
        gamma'(t)\\rangle$ où $\\gamma'(t)$ est défini par $(x'(t),y'(t))$. Le gradient de $f$ est orthogonal aux lignes de niveau de $f$."
      cours:
      - "ma-22:4"
      ex:
      - ma-22-14
      - ma-22-29
      - ma-22-34
      themes:
      - calcul-differentiel
    - contenu: Sous les hypothèses appropriées, dérivées partielles de $(u,v)\mapsto f\big(\varphi(u,v),\psi(u,v)\big)$.
      cours:
      - "ma-22:4"
      ex:
      - ma-22-15
      - ma-22-17
      - ma-22-18
      - ma-22-19
      - ma-22-20
      - ma-22-22
      themes:
      - calcul-differentiel
  - intitule: d) Extremums
    points:
    - contenu: "Maximum et minimum, local ou global d’une fonction définie sur une partie de $\\mathbb{R}^2$."
      cours:
      - "ma-22:5"
      ex:
      - ma-22-24
      - ma-22-32
      - ma-22-31
      - ma-22-33
      themes:
      - optimisation
    - contenu: "Point critique. Tout extremum local d’une fonction de classe $\\mathcal{C}^1$ sur un ouvert de $\\mathbb{R}^2$ est un point critique."
      precisions: Exemples d’étude de points critiques.
      cours:
      - "ma-22:5"
      ex:
      - ma-22-23
      - ma-22-25
      - ma-22-26
      - ma-22-27
      - ma-22-28
      - ma-22-30
      themes:
      - points-critiques
      - optimisation
