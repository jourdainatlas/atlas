# Programme officiel « Programme de mathématiques de MPSI (première année) » (Bulletin officiel spécial n° 1 du 11 février 2021, annexe 1 (programme de mathématiques des classes MPSI et MP2I)), structuré pour la vue « Programme »
# des Annales (MEMO_atlas_annales.md §45). Liens : cours « chapitre:section » (rang du sommaire, à partir de 1),
# exercices, thèmes d'annales ; un point sans cours ni exercice est affiché « à venir ».
id: mpsi
intitule: Programme de mathématiques de MPSI (première année)
source:
  nom: Bulletin officiel spécial n° 1 du 11 février 2021, annexe 1 (programme de mathématiques des classes MPSI et MP2I)
  url: "https://cache.media.education.gouv.fr/file/SPE1-MEN-MESRI-4-2-2021/64/8/spe779_annexe_1373648.pdf"
preambule: "Le programme, commun aux classes MPSI et MP2I, est découpé en deux semestres ; ses contenus se répartissent en trois champs, algèbre, analyse et probabilités, l’algèbre et l’analyse occupant\
  \ le plus grand volume sur les deux semestres tandis que les probabilités, limitées aux univers finis, sont introduites au second semestre. Le premier semestre ménage la transition avec la terminale (consolidation\
  \ du raisonnement et des techniques de calcul, dont une partie s’appuie sur des théorèmes admis puis démontrés plus loin) ; les ensembles $\\mathbb{N}$, $\\mathbb{Z}$, $\\mathbb{Q}$, $\\mathbb{R}$ y sont\
  \ supposés connus et toute construction est hors programme. Chaque section comporte un bandeau d’objectifs et un texte en deux colonnes : à gauche les contenus, exigibles ; à droite les capacités et commentaires,\
  \ qui précisent notations, limites et mentions « hors programme » ou « démonstration non exigible ». La chronologie des sections à l’intérieur d’un semestre ne constitue pas un modèle de progression."
sections:
- intitule: Raisonnement et vocabulaire ensembliste
  periode: Premier semestre
  objectif: Cette section regroupe les différents points de vocabulaire, notations, outils et raisonnements nécessaires aux étudiants pour la conception et la rédaction efficace d’une démonstration mathématique.
    Ces notions doivent être introduites de manière progressive ; leur acquisition est un objectif pour la fin du premier semestre, et la section n’a pas vocation à être enseignée d’un seul tenant ni en
    tout début de semestre. Le programme se limite strictement aux notions de base figurant ci-dessous.
  hors_programme:
  - Toute étude systématique de la logique ou de la théorie des ensembles.
  - "Toute construction et toute axiomatique de $\\mathbb{N}$."
  - La notion d’ensemble quotient.
  blocs:
  - intitule: a) Rudiments de logique
    points:
    - contenu: Quantificateurs.
      precisions: L’emploi de quantificateurs en guise d’abréviation est exclu.
      cours:
      - "ma-01:3"
      ex:
      - ma-01-04
      - ma-01-05
      - ma-01-06
      - ma-01-08
      - ma-01-09
      - ma-01-10
      themes:
      - logique-raisonnement
    - contenu: Implication, contraposition, équivalence.
      precisions: Les étudiants doivent savoir formuler la négation d’une proposition.
      cours:
      - "ma-01:2"
      - "ma-01:3"
      ex:
      - ma-01-01
      - ma-01-02
      - ma-01-05
      - ma-01-03
      themes:
      - logique-raisonnement
    - contenu: "Modes de raisonnement : par disjonction des cas, par contraposition, par l’absurde, par analyse-synthèse."
      precisions: Le raisonnement par analyse-synthèse est l’occasion de préciser les notions de condition nécessaire et condition suffisante.
      cours:
      - "ma-01:4"
      ex:
      - ma-01-11
      - ma-01-13
      - ma-01-15
      - ma-01-17
      - ma-01-18
      themes:
      - logique-raisonnement
    - contenu: Raisonnement par récurrence (simple, double, forte).
      precisions: "On pourra relier le raisonnement par récurrence au fait que toute partie non vide de $\\mathbb{N}$ possède un plus petit élément. Toute construction et toute axiomatique de $\\mathbb{N}$\
        \ sont hors programme."
      cours:
      - "ma-01:4"
      ex:
      - ma-01-22
      - ma-01-19
      - ma-01-20
      - ma-01-23
      - ma-01-35
      - ma-01-25
      themes:
      - logique-raisonnement
  - intitule: b) Ensembles
    points:
    - contenu: Ensemble, appartenance. Ensemble vide.
      cours:
      - "ma-01:5"
      ex:
      - ma-01-28
    - contenu: Inclusion. Partie (ou sous-ensemble).
      cours:
      - "ma-01:5"
      ex:
      - ma-01-28
      - ma-01-31
      - ma-01-33
      - ma-01-34
      - ma-01-37
    - contenu: "Opérations sur les parties d’un ensemble : réunion, intersection, différence, complémentaire."
      precisions: "Notation $A\\setminus B$ pour la différence et $E\\setminus A$, $\\overline{A}$ et $A^c$ pour le complémentaire."
      cours:
      - "ma-01:5"
      ex:
      - ma-01-29
      - ma-01-30
      - ma-01-33
      - ma-01-39
    - contenu: Produit cartésien d’un nombre fini d’ensembles.
      cours:
      - "ma-01:5"
      ex:
      - ma-01-36
      - ma-01-37
    - contenu: Ensemble des parties d’un ensemble.
      precisions: "Notation $\\mathcal{P}(E)$."
      cours:
      - "ma-01:5"
      ex:
      - ma-01-28
      - ma-01-36
      - ma-01-41
      - ma-01-48
    - contenu: Recouvrement disjoint, partition.
      cours:
      - "ma-01:5"
      - "ma-02:7"
      ex:
      - ma-01-40
  - intitule: c) Applications et relations
    points:
    - contenu: Application d’un ensemble dans un ensemble. Graphe d’une application.
      precisions: "Le point de vue est intuitif : une application de $E$ dans $F$ associe à tout élément de $E$ un unique élément de $F$. Le programme ne distingue pas les notions de fonction et d’application.\
        \ Notations $\\mathcal{F}(E,F)$ et $F^E$."
      cours:
      - "ma-02:2"
      ex:
      - ma-02-01
      - ma-02-02
      - ma-02-04
    - contenu: Famille d’éléments d’un ensemble.
      cours:
      - "ma-02:2"
    - contenu: Fonction indicatrice d’une partie d’un ensemble.
      precisions: "Notation $\\mathbf{1}_A$."
      cours:
      - "ma-02:2"
      ex:
      - ma-02-03
      - ma-05-05
      - ma-02-25
    - contenu: Restriction et prolongement.
      precisions: "Notation $f|_A$."
      cours:
      - "ma-02:2"
      ex:
      - ma-02-16
    - contenu: Image directe.
      precisions: Notation $f(A)$.
      cours:
      - "ma-02:3"
      ex:
      - ma-02-05
      - ma-02-06
      - ma-02-07
      - ma-02-08
      - ma-02-09
    - contenu: Image réciproque.
      precisions: "Notation $f^{-1}(B)$. Cette notation pouvant prêter à confusion, on peut provisoirement en utiliser une autre."
      cours:
      - "ma-02:3"
      ex:
      - ma-02-05
      - ma-02-06
      - ma-02-08
      - ma-02-09
    - contenu: Composition.
      cours:
      - "ma-02:4"
      ex:
      - ma-02-10
      - ma-02-11
      - ma-02-43
    - contenu: Injection, surjection. Composée de deux injections, de deux surjections.
      cours:
      - "ma-02:5"
      ex:
      - ma-02-12
      - ma-02-13
      - ma-02-15
      - ma-02-17
      - ma-02-19
      - ma-02-20
    - contenu: Bijection, réciproque. Composée de deux bijections, réciproque de la composée.
      precisions: "Notation $f^{-1}$. Compatibilité de cette notation avec celle de l’image réciproque."
      cours:
      - "ma-02:5"
      ex:
      - ma-02-14
      - ma-02-15
      - ma-02-17
      - ma-02-26
    - contenu: Relation binaire sur un ensemble.
      cours:
      - "ma-02:6"
      ex:
      - ma-02-27
      - ma-02-28
      - ma-02-29
      themes:
      - relations-binaires
    - contenu: Relation d’équivalence, classes d’équivalence.
      precisions: "La notion d’ensemble quotient est hors programme. Les classes d’équivalence forment une partition de l’ensemble sous-jacent. Congruences dans $\\mathbb{R}$, dans $\\mathbb{Z}$. Notation\
        \ $a\\equiv b\\ [c]$."
      cours:
      - "ma-02:7"
      ex:
      - ma-02-30
      - ma-02-31
      - ma-02-32
      - ma-02-33
      - ma-02-34
      themes:
      - relations-binaires
      - congruences
    - contenu: Relation d’ordre. Ordre partiel, total.
      cours:
      - "ma-02:8"
      ex:
      - ma-02-35
      - ma-02-36
      - ma-02-37
      - ma-02-38
      - ma-02-40
      themes:
      - relations-binaires
- intitule: Compléments de calcul algébrique et de trigonométrie
  periode: Premier semestre
  objectif: "Cette section « boîte à outils » complète l’enseignement du lycée sur un certain nombre de points importants pour la suite : calculs de sommes et de produits, dont la formule du binôme ; résolution\
    \ de petits systèmes linéaires par l’algorithme du pivot ; manipulation d’inégalités et résolution d’inéquations ; utilisation du cercle trigonométrique, manipulation des lignes et fonctions trigonométriques.\
    \ Elle est, avec la section « Techniques fondamentales de calcul différentiel et intégral », axée sur les techniques de calcul."
  blocs:
  - intitule: a) Sommes et produits
    points:
    - contenu: Somme et produit d’une famille finie de nombres réels.
      precisions: "Notations $\\sum_{i\\in I}a_i$, $\\sum_{i=1}^{n}a_i$, $\\prod_{i\\in I}a_i$, $\\prod_{i=1}^{n}a_i$. Cas où $I$ est vide."
      cours:
      - "ma-03:2"
      ex:
      - ma-03-01
      - ma-03-02
      - ma-03-03
      - ma-03-04
      themes:
      - sommes-finies
    - contenu: Sommes et produits télescopiques, exemples de changements d’indices et de regroupements de termes.
      precisions: Dans la pratique, on est libre de présenter les calculs avec des points de suspension.
      cours:
      - "ma-03:2"
      ex:
      - ma-03-05
      - ma-03-09
      - ma-03-10
      - ma-03-11
      - ma-03-13
      - ma-03-16
      themes:
      - sommes-finies
    - contenu: "Expressions simplifiées de $\\sum_{k=1}^{n}k$, $\\sum_{k=1}^{n}k^2$, $\\sum_{k=0}^{n}x^k$."
      cours:
      - "ma-03:2"
      ex:
      - ma-03-03
      - ma-03-09
      - ma-03-12
      - ma-03-14
      themes:
      - sommes-finies
    - contenu: Factorisation de $a^n-b^n$ par $a-b$.
      cours:
      - "ma-03:2"
      ex:
      - ma-03-15
      themes:
      - sommes-finies
    - contenu: Sommes doubles. Produit de deux sommes finies.
      precisions: Exemples de sommes triangulaires.
      cours:
      - "ma-03:3"
      ex:
      - ma-03-17
      - ma-03-18
      - ma-03-19
      - ma-03-20
      - ma-03-21
      - ma-03-22
      themes:
      - sommes-finies
    - contenu: Rappels sur la factorielle, les coefficients binomiaux.
      precisions: "Convention $\\binom{n}{k}=0$ pour $k<0$ et $k>n$."
      cours:
      - "ma-03:4"
      ex:
      - ma-03-25
      - ma-03-27
      - ma-03-28
      - ma-03-31
      - ma-03-32
      - ma-03-36
      themes:
      - coefficients-binomiaux
    - contenu: "Formule du binôme dans $\\mathbb{R}$."
      cours:
      - "ma-03:4"
      ex:
      - ma-03-26
      - ma-03-30
      - ma-03-37
      - ma-03-47
      themes:
      - coefficients-binomiaux
  - intitule: b) Résolution de petits systèmes linéaires par la méthode du pivot
    points:
    - contenu: Système linéaire à coefficients réels de deux ou trois équations à deux ou trois inconnues.
      precisions: "Interprétation géométrique : intersection de droites dans $\\mathbb{R}^2$, de plans dans $\\mathbb{R}^3$."
      cours:
      - "ma-03:5"
      ex:
      - ma-03-38
      - ma-03-39
      - ma-03-41
      themes:
      - systemes-lineaires
    - contenu: Algorithme du pivot et mise en évidence des opérations élémentaires.
      precisions: Notations $L_i\leftrightarrow L_j$, $L_i\leftarrow\lambda L_i$ ($\lambda\neq0$), $L_i\leftarrow L_i+\lambda L_j$.
      cours:
      - "ma-03:5"
      ex:
      - ma-03-38
      - ma-03-40
      - ma-03-41
      - ma-03-42
      - ma-03-44
      themes:
      - systemes-lineaires
  - intitule: c) Inégalités
    points:
    - contenu: "Relation d’ordre sur $\\mathbb{R}$. Compatibilité avec les opérations. Intervalles de $\\mathbb{R}$."
      precisions: Exemples de majoration et de minoration de sommes, de produits et de quotients. Utilisation de factorisations et de tableaux de signes. Résolution d’inéquations.
      cours:
      - "ma-07:2"
      ex:
      - ma-01-15
      - ma-05-27
      - ma-03-21
      note: "Pas de section dédiée aux inégalités : la relation d'ordre de $\\mathbb{R}$ et les intervalles sont rappelés au chapitre 7 ; les inéquations sont travaillées dans des exercices épars."
    - contenu: Valeur absolue. Inégalité triangulaire.
      precisions: "Interprétation sur la droite réelle d’inégalités du type $|x-a|\\leqslant b$."
      cours:
      - "ma-07:2"
      - "ma-04:3"
      ex:
      - ma-01-15
      - ma-07-11
    - contenu: "Dans $\\mathbb{R}$, parties majorées, minorées, bornées."
      cours:
      - "ma-07:2"
      ex:
      - ma-07-01
      - ma-07-03
    - contenu: Majorant, minorant ; maximum, minimum.
      cours:
      - "ma-07:2"
      - "ma-02:8"
      ex:
      - ma-07-01
      - ma-02-36
    - contenu: Partie entière d’un nombre réel.
      precisions: Notation $\lfloor x\rfloor$.
      cours:
      - "ma-07:2"
      ex:
      - ma-07-02
  - intitule: d) Trigonométrie
    points:
    - contenu: Cercle trigonométrique. Paramétrisation par cosinus et sinus.
      cours:
      - "ma-04:2"
      ex:
      - ma-04-01
      themes:
      - trigonometrie
    - contenu: "Relation de congruence modulo $2\\pi$ sur $\\mathbb{R}$."
      precisions: "Notation $a\\equiv b\\ [2\\pi]$."
      cours:
      - "ma-04:2"
      - "ma-02:7"
      ex:
      - ma-02-31
      - ma-04-03
      themes:
      - trigonometrie
    - contenu: "Cosinus et sinus de $\\pi\\pm x$, de $\\frac{\\pi}{2}\\pm x$. Cosinus et sinus des angles usuels."
      precisions: Les étudiants doivent savoir retrouver ces résultats et résoudre des équations et inéquations trigonométriques simples en s’aidant du cercle trigonométrique.
      cours:
      - "ma-04:2"
      ex:
      - ma-04-01
      - ma-04-02
      - ma-04-03
      - ma-04-06
      themes:
      - trigonometrie
    - contenu: "Formules d’addition $\\cos(a\\pm b)$, $\\sin(a\\pm b)$. Cas particulier des formules de duplication : $\\cos(2a)$, $\\sin(2a)$."
      precisions: On présente une justification géométrique de l’une de ces formules. Les étudiants doivent savoir retrouver rapidement les formules donnant $\cos(a)\cos(b)$, $\cos(a)\sin(b)$, $\sin(a)\sin(b)$.
      cours:
      - "ma-04:2"
      ex:
      - ma-04-05
      - ma-04-04
      - ma-04-10
      themes:
      - trigonometrie
    - contenu: Fonctions circulaires cosinus et sinus.
      precisions: On justifie les formules donnant les fonctions dérivées de sinus et cosinus vues en classe de terminale.
      cours:
      - "ma-04:2"
      ex:
      - ma-04-09
      - ma-05-15
      - ma-05-19
      themes:
      - trigonometrie
    - contenu: "Pour $x\\in\\mathbb{R}$, inégalité $|\\sin(x)|\\leqslant|x|$."
      cours:
      - "ma-04:2"
      ex:
      - ma-05-20
      themes:
      - trigonometrie
      - inegalites
    - contenu: Fonction tangente.
      precisions: Notation $\tan$. Dérivée, variations, représentation graphique.
      cours:
      - "ma-04:2"
      themes:
      - trigonometrie
    - contenu: Tangente de $\pi\pm x$. Tangente des angles usuels.
      precisions: Interprétation sur le cercle trigonométrique.
      cours:
      - "ma-04:2"
      ex:
      - ma-04-01
      - ma-04-02
      themes:
      - trigonometrie
    - contenu: Formule d’addition $\tan(a\pm b)$.
      precisions: Les étudiants doivent savoir retrouver l’expression de $\cos(t)$ et $\sin(t)$ en fonction de $\tan(t/2)$.
      cours:
      - "ma-04:2"
      ex:
      - ma-04-04
      - ma-04-05
      - ma-04-25
      themes:
      - trigonometrie
- intitule: Nombres complexes
  periode: Premier semestre
  objectif: "L’objectif de cette section, que l’on illustrera par de nombreuses figures, est de donner une solide pratique des nombres complexes, à travers l’étude algébrique du corps $\\mathbb{C}$ et la\
    \ notion d’équation algébrique, l’interprétation géométrique des nombres complexes et leur utilisation en géométrie plane, enfin l’exponentielle complexe et ses applications à la trigonométrie."
  hors_programme:
  - "La construction de $\\mathbb{C}$."
  - L’étude générale des similitudes.
  blocs:
  - intitule: a) Nombres complexes
    points:
    - contenu: Parties réelle et imaginaire.
      precisions: "La construction de $\\mathbb{C}$ est hors programme."
      cours:
      - "ma-04:3"
      ex:
      - ma-04-12
      - ma-04-13
      themes:
      - nombres-complexes
    - contenu: Opérations sur les nombres complexes.
      cours:
      - "ma-04:3"
      ex:
      - ma-04-12
      - ma-04-13
      - ma-04-14
      themes:
      - nombres-complexes
    - contenu: "Brève extension du calcul de $\\sum_{k=0}^{n}x^k$, de la factorisation de $a^n-b^n$, de la formule du binôme."
      cours:
      - "ma-04:3"
      ex:
      - ma-04-14
      - ma-04-44
      themes:
      - nombres-complexes
      - sommes-finies
      - coefficients-binomiaux
    - contenu: Point du plan associé à un nombre complexe, affixe d’un point, affixe d’un vecteur.
      precisions: "On identifie $\\mathbb{C}$ au plan usuel muni d’un repère orthonormé direct (« plan complexe »)."
      cours:
      - "ma-04:3"
      themes:
      - geometrie-complexe
  - intitule: b) Conjugaison et module
    points:
    - contenu: Conjugaison, compatibilité avec les opérations.
      precisions: Image du conjugué dans le plan complexe.
      cours:
      - "ma-04:3"
      ex:
      - ma-04-13
      themes:
      - nombres-complexes
    - contenu: Module.
      precisions: "Interprétation géométrique de $|z-z'|$, cercles et disques."
      cours:
      - "ma-04:3"
      - "ma-04:9"
      ex:
      - ma-04-12
      - ma-04-48
      - ma-04-16
      themes:
      - nombres-complexes
      - geometrie-complexe
    - contenu: "Relation $|z|^2=z\\overline{z}$, module d’un produit, d’un quotient."
      cours:
      - "ma-04:3"
      ex:
      - ma-04-16
      - ma-04-18
      - ma-04-19
      themes:
      - nombres-complexes
    - contenu: Inégalité triangulaire, cas d’égalité.
      cours:
      - "ma-04:3"
      ex:
      - ma-04-16
      - ma-04-17
      themes:
      - nombres-complexes
  - intitule: c) Nombres complexes de module 1 et trigonométrie
    points:
    - contenu: "Identification du cercle trigonométrique et de l’ensemble des nombres complexes de module 1. Définition de $e^{it}$ pour $t\\in\\mathbb{R}$."
      precisions: "Notation $\\mathbb{U}$."
      cours:
      - "ma-04:4"
      ex:
      - ma-04-26
      - ma-04-24
      themes:
      - exponentielle-complexe
      - trigonometrie
    - contenu: Exponentielle d’une somme.
      cours:
      - "ma-04:4"
      themes:
      - exponentielle-complexe
    - contenu: "Formules d’Euler. Technique de l’angle moitié : factorisation de $1\\pm e^{it}$, de $e^{ip}\\pm e^{iq}$."
      precisions: "Les étudiants doivent savoir retrouver les formules donnant $\\cos(p)\\pm\\cos(q)$, $\\sin(p)\\pm\\sin(q)$. Linéarisation, calcul de $\\sum_{k=0}^{n}\\cos(kt)$ et de $\\sum_{k=0}^{n}\\\
        sin(kt)$."
      cours:
      - "ma-04:4"
      ex:
      - ma-04-20
      - ma-04-29
      - ma-04-22
      - ma-04-23
      themes:
      - nombres-complexes
      - trigonometrie
    - contenu: Formule de Moivre.
      precisions: Les étudiants doivent savoir retrouver les expressions de $\cos(nt)$ et $\sin(nt)$ en fonction de $\cos t$ et $\sin t$.
      cours:
      - "ma-04:4"
      ex:
      - ma-04-21
      - ma-04-11
      themes:
      - nombres-complexes
      - trigonometrie
  - intitule: d) Forme trigonométrique
    points:
    - contenu: "Forme trigonométrique $re^{i\\theta}$ ($r>0$) d’un nombre complexe non nul. Arguments. Arguments d’un produit, d’un quotient."
      cours:
      - "ma-04:5"
      ex:
      - ma-04-27
      - ma-04-28
      - ma-04-30
      - ma-04-29
      themes:
      - exponentielle-complexe
      - nombres-complexes
    - contenu: Transformation de $a\cos t+b\sin t$ en $A\cos(t-\varphi)$.
      cours:
      - "ma-04:5"
      ex:
      - ma-04-07
      themes:
      - trigonometrie
  - intitule: e) Équations algébriques
    points:
    - contenu: Pour $P$ fonction polynomiale à coefficients complexes admettant $a$ pour racine, factorisation de $P(z)$ par $z-a$.
      cours:
      - "ma-04:6"
      ex:
      - ma-04-34
      - ma-04-35
      themes:
      - racines-polynomes
      - nombres-complexes
    - contenu: "Résolution des équations du second degré dans $\\mathbb{C}$. Somme et produit des racines."
      precisions: Calcul des racines carrées d’un nombre complexe donné sous forme algébrique.
      cours:
      - "ma-04:6"
      ex:
      - ma-04-31
      - ma-04-32
