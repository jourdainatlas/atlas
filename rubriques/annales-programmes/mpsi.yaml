      ex:
      - ma-11-33
      - ma-11-47
      - ma-11-30
      themes:
      - groupe-symetrique
      - groupes
    - contenu: Groupe produit.
      cours:
      - "ma-11:3"
      ex:
      - ma-11-28
      themes:
      - groupes
    - contenu: "Sous-groupe : définition, caractérisation."
      cours:
      - "ma-11:3"
      ex:
