    - contenu: "Si $(x_i)_{1\\leqslant i\\leqslant n}$ engendre $E$ et si $(x_i)_{i\\in I}$ est libre pour une certaine partie $I$ de $\\{1,\\dots,n\\}$, alors il existe une partie $J$ de $\\{1,\\dots,n\\\
        }$ contenant $I$ pour laquelle $(x_j)_{j\\in J}$ est une base de $E$."
      precisions: Existence de bases en dimension finie. Théorèmes de la base extraite (de toute famille génératrice on peut extraire une base), de la base incomplète (toute famille libre peut être complétée
        en une base).
