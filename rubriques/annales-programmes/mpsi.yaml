    - contenu: Calcul des primitives, application au calcul d’intégrales.
      precisions: "Primitives de $x\\mapsto e^{\\lambda x}$ pour $\\lambda\\in\\mathbb{C}$, application aux primitives de $x\\mapsto e^{ax}\\cos(bx)$ et $x\\mapsto e^{ax}\\sin(bx)$."
