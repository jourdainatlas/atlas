    - contenu: Somme directe de deux sous-espaces. Caractérisation par l’intersection.
      precisions: La somme $F+G$ est directe si la décomposition de tout vecteur de $F+G$ comme somme d’un élément de $F$ et d’un élément de $G$ est unique.
      cours:
