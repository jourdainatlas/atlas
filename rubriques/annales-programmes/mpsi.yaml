      - applications-lineaires
    - contenu: Application linéaire de rang fini.
      precisions: "Notation $\\operatorname{rg}(u)$."
      cours:
      - "ma-15:4"
      ex:
      - ma-15-49
      themes:
      - applications-lineaires
    - contenu: "Le rang de $v\\circ u$ est majoré par $\\min\\big(\\operatorname{rg}(u),\\operatorname{rg}(v)\\big)$. Invariance du rang par composition par un isomorphisme."
      cours:
      - "ma-15:4"
      ex:
      - ma-15-34
      - ma-15-36
      - ma-15-56
      themes:
      - applications-lineaires
  - intitule: C - Applications linéaires · b) Endomorphismes
    points:
    - contenu: Identité, homothéties.
      precisions: "Notations $\\mathrm{id}_E$, $\\mathrm{id}$."
      cours:
      - "ma-14:6"
      ex:
      - ma-14-52
      themes:
      - applications-lineaires
    - contenu: "Anneau $(\\mathcal{L}(E),+,\\circ)$."
      precisions: "Non commutativité si $\\dim E\\geqslant2$. Notation $vu$ pour la composée $v\\circ u$. Notation $u^k$ pour $u\\in\\mathcal{L}(E)$ et $k\\in\\mathbb{N}$."
      cours:
      - "ma-14:7"
      ex:
      - ma-14-44
      - ma-14-45
      themes:
      - applications-lineaires
    - contenu: "Projection ou projecteur, symétrie : définition géométrique, caractérisation par $p^2=p$, par $s^2=\\mathrm{id}$."
      precisions: On incite les étudiants à se représenter géométriquement ces notions par des figures en dimension 2 et 3.
      cours:
      - "ma-14:7"
      ex:
      - ma-14-53
      - ma-14-54
      - ma-14-55
      - ma-14-57
      - ma-14-58
      - ma-14-63
      themes:
      - projecteurs
    - contenu: Automorphismes. Groupe linéaire.
      precisions: "Notation $\\mathrm{GL}(E)$. Notation $u^k$ pour $u\\in\\mathrm{GL}(E)$ et $k\\in\\mathbb{Z}$."
      cours:
      - "ma-14:7"
      ex:
      - ma-14-38
      - ma-14-40
      - ma-14-44
      themes:
      - applications-lineaires
  - intitule: C - Applications linéaires · c) Détermination d’une application linéaire
    points:
    - contenu: "Si $(e_i)_{i\\in I}$ est une base de $E$ et $(f_i)_{i\\in I}$ une famille de vecteurs de $F$, alors il existe une unique application $u\\in\\mathcal{L}(E,F)$ telle que, pour tout $i\\in\
        \ I$, $u(e_i)=f_i$."
      precisions: Caractérisation de l’injectivité, de la surjectivité, de la bijectivité de $u$.
      cours:
      - "ma-14:6"
      themes:
      - applications-lineaires
    - contenu: Espaces vectoriels isomorphes, caractérisation par la dimension.
      cours:
      - "ma-15:4"
      ex:
      - ma-15-11
      - ma-14-72
      themes:
      - applications-lineaires
      - espaces-vectoriels
    - contenu: Pour une application linéaire entre deux espaces de même dimension finie, équivalence entre injectivité, surjectivité et bijectivité.
      cours:
      - "ma-15:4"
      ex:
      - ma-14-40
      - ma-15-27
      - ma-15-48
      themes:
      - applications-lineaires
    - contenu: Un endomorphisme d’un espace de dimension finie inversible à gauche ou à droite est inversible.
      cours:
      - "ma-15:4"
      themes:
      - applications-lineaires
    - contenu: "Dimension de $\\mathcal{L}(E,F)$ si $E$ et $F$ sont de dimension finie."
      cours:
      - "ma-15:4"
      ex:
      - ma-15-35
      themes:
      - applications-lineaires
    - contenu: "Si $E_1$ et $E_2$ sont des sous-espaces de $E$ tels que $E=E_1\\oplus E_2$, si $u_1\\in\\mathcal{L}(E_1,F)$, $u_2\\in\\mathcal{L}(E_2,F)$, il existe une unique application $u\\in\\mathcal{L}(E,F)$\
        \ coïncidant avec $u_1$ sur $E_1$ et avec $u_2$ sur $E_2$."
      cours:
      - "ma-14:6"
      ex:
      - ma-14-51
      themes:
      - applications-lineaires
  - intitule: C - Applications linéaires · d) Théorème du rang
    points:
    - contenu: "Forme géométrique du théorème du rang : si $u\\in\\mathcal{L}(E,F)$ et si $S$ est un supplémentaire de $\\operatorname{Ker}u$ dans $E$, alors $u$ induit un isomorphisme de $S$ sur $\\operatorname{Im}u$."
      cours:
      - "ma-15:4"
      ex:
      - ma-15-26
      - ma-15-37
      - ma-15-42
      themes:
      - applications-lineaires
    - contenu: "Théorème du rang : si $E$ est de dimension finie $n$ et $u\\in\\mathcal{L}(E,F)$, alors $n=\\dim\\operatorname{Ker}u+\\operatorname{rg}(u)$."
      cours:
      - "ma-15:4"
      ex:
      - ma-15-26
      - ma-15-28
      - ma-15-29
      - ma-15-30
      - ma-15-31
      - ma-15-43
      themes:
      - applications-lineaires
  - intitule: C - Applications linéaires · e) Formes linéaires et hyperplans
    points:
    - contenu: Forme linéaire.
      precisions: Formes coordonnées relativement à une base.
      cours:
      - "ma-14:8"
      ex:
      - ma-14-61
      - ma-14-65
      themes:
      - dualite
      - espaces-vectoriels
    - contenu: Hyperplan, défini comme noyau d’une forme linéaire non nulle.
      precisions: Équations d’un hyperplan dans une base en dimension finie.
      cours:
      - "ma-14:8"
      - "ma-15:5"
      ex:
      - ma-14-64
      - ma-14-65
      themes:
      - dualite
      - espaces-vectoriels
    - contenu: Si $H$ est un hyperplan de $E$ et $D$ une droite non contenue dans $H$, alors $E=H\oplus D$.
      cours:
      - "ma-14:8"
      ex:
      - ma-14-64
      - ma-14-65
      themes:
      - dualite
      - espaces-vectoriels
    - contenu: Réciproquement, tout supplémentaire d’une droite est un hyperplan.
      precisions: En dimension $n$, les hyperplans sont exactement les sous-espaces de dimension $n-1$.
      cours:
      - "ma-14:8"
      - "ma-15:5"
      ex:
      - ma-15-44
      themes:
      - dualite
      - espaces-vectoriels
    - contenu: Comparaison de deux équations d’un même hyperplan.
      cours:
      - "ma-14:8"
      ex:
      - ma-14-64
      - ma-14-66
      themes:
      - dualite
    - contenu: Si $E$ est un espace de dimension finie $n$, l’intersection de $m$ hyperplans est de dimension au moins $n-m$. Réciproquement, tout sous-espace de $E$ de dimension $n-m$ est l’intersection
        de $m$ hyperplans.
      precisions: "Système d’équations d’un sous-espace vectoriel ; cas des droites vectorielles de $\\mathbb{R}^2$, des droites et plans vectoriels de $\\mathbb{R}^3$. L’étude de la dualité est hors programme."
      cours:
      - "ma-15:5"
      ex:
      - ma-14-10
      - ma-15-44
      - ma-15-45
      themes:
      - dualite
      - espaces-vectoriels
  - intitule: D - Sous-espaces affines d’un espace vectoriel
    points:
    - contenu: "Présentation informelle de la structure affine d’un espace vectoriel : points et vecteurs. Translation."
      precisions: "L’écriture $B=A+\\vec{u}$ est équivalente à la relation $\\overrightarrow{AB}=\\vec{u}$."
      cours:
      - "ma-14:9"
      themes:
      - geometrie-affine
    - contenu: Sous-espace affine d’un espace vectoriel, direction. Hyperplan affine.
      precisions: "Sous-espaces affines de $\\mathbb{R}^2$ et $\\mathbb{R}^3$."
      cours:
      - "ma-14:9"
      ex:
      - ma-14-67
      - ma-14-69
      themes:
      - geometrie-affine
    - contenu: Intersection de sous-espaces affines.
      cours:
      - "ma-14:9"
      ex:
      - ma-14-67
      - ma-14-69
      themes:
      - geometrie-affine
    - contenu: "Notion d’équation linéaire, i.e. de la forme $u(x)=a$ où $u\\in\\mathcal{L}(E,F)$, $a\\in F$. L’ensemble des solutions est soit l’ensemble vide, soit un sous-espace affine dirigé par $\\\
        operatorname{Ker}u$."
      precisions: Retour sur les systèmes linéaires, les équations différentielles linéaires d’ordres 1 et 2, les suites arithmético-géométriques, la recherche de polynômes interpolateurs.
      cours:
      - "ma-14:9"
      ex:
      - ma-14-68
      themes:
      - geometrie-affine
      - applications-lineaires
      - systemes-lineaires
- intitule: Matrices
  periode: Deuxième semestre
  objectif: "Les objectifs de cette section sont de présenter les liens entre applications linéaires et matrices, de manière à exploiter les changements de registres (géométrique, numérique, formel), d’étudier\
    \ l’effet d’un changement de bases sur la représentation matricielle d’une application linéaire et la relation d’équivalence qui s’en déduit sur $\\mathcal{M}_{n,p}(\\mathbb{K})$, et d’introduire brièvement\
    \ la relation de similitude sur $\\mathcal{M}_n(\\mathbb{K})$."
  blocs:
  - intitule: A - Matrices et applications linéaires · a) Matrice d’une application linéaire dans des bases
    points:
    - contenu: Matrice d’un vecteur, d’une famille de vecteurs dans une base, d’une application linéaire dans un couple de bases, d’un endomorphisme dans une base.
      precisions: "Exemple : matrice, dans la base $(1,i)$ de $\\mathbb{C}$ vu comme plan vectoriel réel, de la similitude de multiplicateur $a+ib$."
      cours:
      - "ma-16:4"
      ex:
      - ma-16-18
      - ma-16-19
      - ma-16-30
      - ma-16-24
      themes:
      - matrices
      - applications-lineaires
    - contenu: "Isomorphisme d’espaces vectoriels de $\\mathcal{L}(E,F)$ sur $\\mathcal{M}_{n,p}(\\mathbb{K})$ induit par le choix d’un couple de bases."
      cours:
      - "ma-16:4"
      themes:
      - matrices
      - applications-lineaires
    - contenu: "Isomorphisme d’espaces vectoriels et d’anneaux de $\\mathcal{L}(E)$ sur $\\mathcal{M}_n(\\mathbb{K})$ induit par le choix d’une base."
      cours:
      - "ma-16:4"
      ex:
      - ma-16-18
      - ma-16-26
      - ma-16-25
      themes:
      - matrices
      - applications-lineaires
    - contenu: Coordonnées de l’image d’un vecteur par une application linéaire.
      cours:
      - "ma-16:4"
      ex:
      - ma-16-18
      - ma-16-20
      themes:
      - matrices
      - applications-lineaires
    - contenu: Matrice d’une composée d’applications linéaires. Lien entre matrices inversibles et isomorphismes.
      precisions: Cas particulier des endomorphismes.
      cours:
      - "ma-16:4"
      ex:
      - ma-16-20
      - ma-16-22
      - ma-16-23
      - ma-16-24
      - ma-16-26
      themes:
      - matrices
      - applications-lineaires
  - intitule: A - Matrices et applications linéaires · b) Application linéaire canoniquement associée à une matrice
    points:
    - contenu: Application linéaire canoniquement associée à une matrice.
      precisions: "On identifie ici $\\mathcal{M}_{n,1}(\\mathbb{K})$ et $\\mathbb{K}^n$."
      cours:
      - "ma-16:4"
      ex:
      - ma-16-21
      - ma-16-53
      themes:
      - matrices
      - applications-lineaires
    - contenu: Noyau, image et rang d’une matrice.
      precisions: Les colonnes engendrent l’image, les lignes donnent un système d’équations du noyau.
      cours:
      - "ma-16:4"
      - "ma-16:6"
      ex:
      - ma-16-24
      - ma-16-46
      - ma-16-50
      - ma-16-51
      - ma-16-53
      themes:
      - matrices
      - applications-lineaires
    - contenu: "Une matrice de $\\mathcal{M}_n(\\mathbb{K})$ est inversible si et seulement si son noyau est réduit au sous-espace nul, ou si et seulement si ses colonnes engendrent l’espace $\\mathbb{K}^n$\
        \ ou si et seulement si son rang est $n$."
      precisions: Retour sur la condition d’inversibilité d’une matrice triangulaire. Lien entre les diverses notions de rang.
      cours:
      - "ma-16:4"
      ex:
      - ma-16-48
      - ma-16-47
      - ma-16-54
      - ma-16-52
      - ma-16-58
      themes:
      - matrices
      - applications-lineaires
    - contenu: Toute matrice carrée inversible à gauche ou à droite est inversible.
      cours:
      - "ma-16:4"
      ex:
      - ma-16-10
      - ma-16-21
      - ma-16-54
      themes:
      - matrices
      - applications-lineaires
  - intitule: A - Matrices et applications linéaires · c) Systèmes linéaires
    points:
    - contenu: Interprétation de l’ensemble des solutions d’un système homogène comme noyau d’une matrice. Rang d’un tel système, dimension de l’espace des solutions.
      cours:
      - "ma-16:6"
      - "ma-15:5"
      ex:
      - ma-15-03
      - ma-15-44
      - ma-16-65
      themes:
      - systemes-lineaires
      - applications-lineaires
    - contenu: Le système $AX=B$ est compatible si et seulement si $B$ appartient à l’image de $A$.
      precisions: Structure affine de l’ensemble des solutions.
      cours:
      - "ma-16:6"
      ex:
      - ma-03-40
      - ma-03-41
      - ma-16-56
      themes:
      - systemes-lineaires
      - applications-lineaires
    - contenu: Si $A$ est carrée et inversible, le système $AX=B$ possède une unique solution.
      precisions: Dans ce cas, le système est dit de Cramer.
      cours:
      - "ma-16:6"
      - "ma-17:6"
      ex:
      - ma-16-20
      - ma-16-49
      - ma-17-50
      themes:
      - systemes-lineaires
  - intitule: B - Changements de bases, équivalence et similitude · a) Changements de bases
    points:
    - contenu: Matrice de passage d’une base à une autre.
      cours:
      - "ma-16:5"
      ex:
      - ma-16-30
      - ma-16-31
      themes:
      - matrices
    - contenu: Inversibilité et inverse d’une matrice de passage.
      cours:
      - "ma-16:5"
      ex:
      - ma-16-31
      themes:
      - matrices
    - contenu: Effet d’un changement de base sur la matrice d’un vecteur.
      cours:
      - "ma-16:5"
      ex:
      - ma-16-30
      themes:
      - matrices
    - contenu: Effet d’un changement du couple de bases sur la matrice d’une application linéaire.
      cours:
      - "ma-16:5"
      ex:
      - ma-16-30
      - ma-16-41
      themes:
      - matrices
    - contenu: Effet d’un changement de base sur la matrice d’un endomorphisme.
      precisions: Exemples de recherche d’une base dans laquelle la matrice d’un endomorphisme donné est simple.
      cours:
      - "ma-16:5"
      ex:
      - ma-16-31
      - ma-16-33
      - ma-16-32
      - ma-16-34
      - ma-16-38
      - ma-16-39
      themes:
      - matrices
      - similitude
  - intitule: B - Changements de bases, équivalence et similitude · b) Matrices équivalentes et rang
    points:
    - contenu: "Si $u\\in\\mathcal{L}(E,F)$ est de rang $r$, il existe un couple de bases dans lequel $u$ a pour matrice $J_r$."
      precisions: La matrice $J_r$ a tous ses coefficients nuls à l’exception des $r$ premiers coefficients diagonaux, égaux à 1.
      cours:
      - "ma-16:5"
      ex:
      - ma-16-41
      - ma-16-57
      themes:
      - applications-lineaires
      - matrices
    - contenu: Matrices équivalentes.
      cours:
      - "ma-16:5"
      ex:
      - ma-16-37
      - ma-16-41
      themes:
      - applications-lineaires
      - matrices
    - contenu: Une matrice est de rang $r$ si et seulement si elle est équivalente à $J_r$.
      precisions: Classification des matrices équivalentes par le rang.
      cours:
      - "ma-16:5"
      ex:
      - ma-16-37
      - ma-16-41
      - ma-16-57
      - ma-16-68
      themes:
      - applications-lineaires
      - matrices
    - contenu: Invariance du rang par transposition.
      cours:
      - "ma-16:5"
      themes:
      - applications-lineaires
      - matrices
    - contenu: Rang d’une matrice extraite. Caractérisation du rang par les matrices carrées extraites.
      cours:
      - "ma-16:5"
      themes:
      - applications-lineaires
      - matrices
    - contenu: Les opérations élémentaires sur les colonnes (resp. lignes) conservent l’image (resp. le noyau). Les opérations élémentaires conservent le rang.
      precisions: "Application : calcul du rang."
      cours:
      - "ma-16:6"
      ex:
      - ma-16-46
      - ma-16-47
      - ma-16-50
      - ma-16-51
      themes:
      - matrices
      - applications-lineaires
      - systemes-lineaires
  - intitule: B - Changements de bases, équivalence et similitude · c) Matrices semblables et trace
    points:
    - contenu: Matrices semblables.
      precisions: Interprétation géométrique. Exemples de recherche d’une matrice simple semblable à une matrice donnée.
      cours:
      - "ma-16:5"
      ex:
      - ma-16-35
      - ma-16-37
      - ma-16-36
      - ma-16-28
      - ma-16-43
      - ma-17-61
      themes:
      - similitude
    - contenu: Trace d’une matrice carrée.
      precisions: "Notation $\\operatorname{tr}(A)$."
      cours:
      - "ma-16:5"
      ex:
      - ma-16-05
      - ma-16-06
      themes:
      - trace
    - contenu: "Linéarité de la trace, relation $\\operatorname{tr}(AB)=\\operatorname{tr}(BA)$, invariance par similitude."
      cours:
      - "ma-16:5"
      ex:
      - ma-16-05
      - ma-16-56
      - ma-16-42
      - ma-16-45
      - ma-16-64
      themes:
      - trace
      - similitude
    - contenu: "Trace d’un endomorphisme d’un espace de dimension finie. Linéarité, relation $\\operatorname{tr}(uv)=\\operatorname{tr}(vu)$."
      precisions: "Notation $\\operatorname{tr}(u)$. Trace d’un projecteur."
      cours:
      - "ma-16:5"
      ex:
      - ma-16-40
      - ma-17-29
      - ma-16-62
      themes:
