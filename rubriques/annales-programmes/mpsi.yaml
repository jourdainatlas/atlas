- intitule: Structures algébriques usuelles
  periode: Premier semestre
  objectif: Cette section a pour but l’introduction des notions les plus élémentaires relatives aux groupes, anneaux, corps, afin de traiter de manière unifiée un certain nombre de situations.
  blocs:
  - intitule: a) Loi de composition interne
    points:
    - contenu: Loi de composition interne.
      precisions: On évite l’étude de lois artificielles.
      cours:
      - "ma-11:2"
      ex:
      - ma-11-01
      - ma-11-02
    - contenu: Associativité, commutativité, élément neutre, inversibilité, distributivité.
      precisions: Inversibilité et inverse du produit de deux éléments inversibles.
      cours:
      - "ma-11:2"
      ex:
      - ma-11-01
      - ma-11-03
      - ma-11-05
      - ma-11-07
    - contenu: Partie stable.
