- intitule: Analyse asymptotique
  periode: Deuxième semestre
  objectif: L’objectif de cette section est d’introduire les techniques asymptotiques fondamentales, dans les cadres continu et discret ; les fonctions et les suites y sont à valeurs réelles ou complexes,
    le cas réel jouant un rôle prépondérant, et la priorité est donnée à la pratique d’exercices plutôt qu’à la vérification de propriétés élémentaires relatives aux relations de comparaison. Les développements
    limités sont les principaux outils du calcul asymptotique ; afin d’en disposer au plus tôt, on traite en premier lieu les fonctions. Les étudiants doivent connaître les développements limités usuels
    et savoir mener à bien rapidement des calculs asymptotiques simples, les situations dont la gestion manuelle ne relèverait que de la technicité étant traitées à l’aide d’outils logiciels. Il est fortement
    préconisé de traiter cette section en début de semestre ; elle permet de revenir sur la problématique de la vitesse de convergence.
  hors_programme:
  - La notion d’échelle de comparaison.
  blocs:
  - intitule: "a) Relations de comparaison : cas des fonctions"
    points:
    - contenu: "Relations de domination, de négligeabilité, d’équivalence en un point $a$ de $\\overline{\\mathbb{R}}$. Lien entre ces relations."
      precisions: "Notations $f(x)\\underset{x\\to a}{=}O(g(x))$, $f(x)\\underset{x\\to a}{=}o(g(x))$, $f(x)\\underset{x\\to a}{\\sim}g(x)$. La relation $f(x)\\underset{x\\to a}{=}o(g(x))$ est définie à\
        \ partir du quotient $\\frac{f(x)}{g(x)}$ sous l’hypothèse que la fonction $g$ ne s’annule pas localement. Pour la relation $f(x)\\underset{x\\to a}{\\sim}g(x)$, on donne les deux formes $\\frac{f(x)}{g(x)}\\\
        underset{x\\to a}{\\longrightarrow}1$ et $f(x)\\underset{x\\to a}{=}g(x)+o(g(x))$, en insistant sur l’intérêt de la seconde dans les calculs. Pour mener une étude locale de $f$ au voisinage de $a\\\
        neq0$, on étudie $f(a+h)$ pour $h\\to0$. Traduction à l’aide du symbole $o$ des croissances comparées de $\\ln^\\beta(x)$, $x^\\alpha$, $e^{\\gamma x}$ en $+\\infty$, de $\\ln^\\beta(x)$, $x^\\\
        alpha$ en 0."
      cours:
      - "ma-10:2"
      ex:
      - ma-10-01
      - ma-10-02
      - ma-10-04
      - ma-10-06
      themes:
      - equivalents
    - contenu: Règles usuelles de manipulation des équivalents et des symboles $o$ et $O$.
      cours:
      - "ma-10:2"
      ex:
      - ma-10-03
      - ma-10-05
      - ma-10-08
      - ma-10-11
      themes:
      - equivalents
    - contenu: "Obtention d’un équivalent par encadrement : si les fonctions réelles $f$, $g$, $h$ vérifient $f\\leqslant g\\leqslant h$ et si $f(x)\\underset{x\\to a}{\\sim}h(x)$, alors $g(x)\\underset{x\\\
        to a}{\\sim}f(x)$."
      cours:
      - "ma-10:2"
      ex:
      - ma-10-07
      - ma-10-09
      - ma-10-12
      themes:
      - equivalents
    - contenu: "Propriétés conservées par équivalence : signe, limite."
      cours:
      - "ma-10:2"
      ex:
      - ma-10-05
      - ma-10-49
      themes:
      - equivalents
  - intitule: b) Développements limités
    points:
    - contenu: Développement limité à l’ordre $n$ d’une fonction en un point. Unicité des coefficients, troncature.
      precisions: Le développement limité à l’ordre $n$ de $f$ en $a$ peut se ramener à celui de $h\mapsto f(a+h)$ en 0. Signe de $f$ au voisinage de $a$.
      cours:
      - "ma-10:3"
      ex:
      - ma-10-13
      - ma-10-16
      themes:
      - developpements-limites
    - contenu: Développement limité en 0 d’une fonction paire, impaire.
      cours:
      - "ma-10:3"
      ex:
      - ma-10-20
      - ma-10-26
      - ma-10-49
      themes:
      - developpements-limites
    - contenu: Caractérisation de la dérivabilité par l’existence d’un développement limité à l’ordre 1.
      cours:
      - "ma-10:3"
      ex:
      - ma-10-49
      - ma-10-26
      themes:
      - developpements-limites
    - contenu: "Opérations sur les développements limités : combinaison linéaire, produit, quotient."
      precisions: On privilégie la factorisation par le terme prépondérant pour prévoir l’ordre d’un développement. Les étudiants doivent savoir déterminer sur des exemples simples le développement limité
        d’une composée, mais aucun résultat général n’est exigible.
      cours:
      - "ma-10:3"
      ex:
      - ma-10-13
      - ma-10-14
      - ma-10-15
      - ma-10-23
      themes:
      - developpements-limites
    - contenu: Primitivation d’un développement limité.
      cours:
      - "ma-10:3"
      ex:
      - ma-10-17
      - ma-10-22
      - ma-10-25
      themes:
      - developpements-limites
    - contenu: "Formule de Taylor-Young : pour $f$ de classe $\\mathcal{C}^n$, développement limité à l’ordre $n$ en 0 de $h\\mapsto f(a+h)$."
      cours:
      - "ma-10:3"
      ex:
      - ma-10-19
      - ma-10-21
      - ma-10-20
      themes:
      - developpements-limites
    - contenu: "Développement limité à tout ordre en 0 de $\\exp$, $\\sin$, $\\cos$, $\\operatorname{sh}$, $\\operatorname{ch}$, $x\\mapsto\\ln(1+x)$, $x\\mapsto\\frac{1}{1-x}$, $x\\mapsto(1+x)^\\alpha$,\
        \ $\\operatorname{Arctan}$."
      cours:
      - "ma-10:3"
      ex:
      - ma-10-13
      themes:
      - developpements-limites
    - contenu: Développement limité à l’ordre 3 en 0 de $\tan$.
      cours:
      - "ma-10:3"
      ex:
      - ma-10-22
      themes:
      - developpements-limites
    - contenu: Application des développements limités à l’étude locale d’une fonction.
      precisions: Calculs d’équivalents et de limites, position relative d’une courbe et de sa tangente, détermination d’asymptotes.
      cours:
      - "ma-10:4"
      ex:
      - ma-10-27
      - ma-10-28
      - ma-10-29
      - ma-10-32
      - ma-10-30
      - ma-10-37
      themes:
      - developpements-limites
      - equivalents
    - contenu: Condition nécessaire, condition suffisante à l’ordre 2 pour un extremum local en un point intérieur.
      cours:
      - "ma-10:4"
      ex:
      - ma-10-31
      - ma-10-49
      themes:
      - optimisation
      - points-critiques
  - intitule: "c) Relations de comparaison : cas des suites"
    points:
    - contenu: Adaptation rapide aux suites des définitions et résultats relatifs aux fonctions.
      precisions: Notations $u_n=O(v_n)$, $u_n=o(v_n)$, $u_n\sim v_n$.
      cours:
      - "ma-10:5"
      ex:
      - ma-10-01
      - ma-10-03
      - ma-10-06
      - ma-10-10
      themes:
      - equivalents
  - intitule: d) Problèmes d’analyse asymptotique
    points:
    - contenu: "Exemples de développements asymptotiques, dans les cadres discret et continu : fonctions réciproques, équations à paramètre, suites récurrentes, suites d’intégrales."
      precisions: La notion d’échelle de comparaison est hors programme.
      cours:
      - "ma-10:5"
      - "ma-18:7"
      ex:
      - ma-10-38
      - ma-10-39
      - ma-10-24
      - ma-10-42
      - ma-10-45
      - ma-18-46
      themes:
      - asymptotique
      - suites-recurrentes
      note: "Les suites d'intégrales ne sont pas traitées au chapitre 10 ; elles le sont au chapitre 18, avec les intégrales de Wallis."
    - contenu: "Formule de Stirling. Traduction comme développement asymptotique de $\\ln(n!)$."
      precisions: La démonstration n’est pas exigible.
      demo: non exigible
      cours:
      - "ma-10:5"
      - "ma-18:7"
      ex:
      - ma-10-49
      - ma-20-32
      - ma-20-26
      themes:
      - stirling
- intitule: Espaces vectoriels et applications linéaires
  periode: Deuxième semestre
  objectif: "Les objectifs de cette section sont d’acquérir les notions de base relatives aux espaces vectoriels et à l’indépendance linéaire, de reconnaître les problèmes linéaires et de les traduire à\
    \ l’aide des notions d’espace vectoriel et d’application linéaire, de définir la notion de dimension, qui décrit le nombre de degrés de liberté d’un problème linéaire (en insistant sur les méthodes\
    \ de calcul de dimension, qui reposent sur deux types de représentation : paramétrisation linéaire d’un sous-espace, description par équations linéaires), et de présenter quelques notions de géométrie\
    \ affine. En petite dimension, l’intuition géométrique permet d’interpréter les notions de l’algèbre linéaire ; on en tire parti par de nombreuses figures. Le corps $\\mathbb{K}$ est égal à $\\mathbb{R}$\
    \ ou $\\mathbb{C}$. La partie D, à illustrer par de nombreuses figures, montre comment l’algèbre linéaire étend les notions de géométrie affine du collège et du lycée, et modélise un problème affine\
    \ par une équation $u(x)=a$ où $u$ est une application linéaire."
  hors_programme:
  - Tout développement théorique sur les espaces de dimension infinie.
  - L’étude de la dualité.
  blocs:
  - intitule: A - Espaces vectoriels · a) Espaces vectoriels
    points:
    - contenu: "Structure de $\\mathbb{K}$-espace vectoriel."
      precisions: "Espaces $\\mathbb{K}^n$, $\\mathbb{K}[X]$, $\\mathcal{M}_{n,p}(\\mathbb{K})$."
      cours:
      - "ma-14:2"
      ex:
      - ma-14-01
      - ma-14-02
      themes:
      - espaces-vectoriels
    - contenu: "Produit d’un nombre fini de $\\mathbb{K}$-espaces vectoriels."
      cours:
      - "ma-14:2"
      themes:
      - espaces-vectoriels
    - contenu: Espace vectoriel des fonctions d’un ensemble dans un espace vectoriel.
      precisions: "Espace $\\mathbb{K}^\\Omega$, cas particulier $\\mathbb{K}^\\mathbb{N}$."
      cours:
      - "ma-14:2"
      themes:
      - espaces-vectoriels
    - contenu: Famille presque nulle (ou à support fini) de scalaires, combinaison linéaire d’une famille de vecteurs.
      precisions: On commence par la notion de combinaison linéaire d’une famille finie de vecteurs.
      cours:
      - "ma-14:2"
      ex:
      - ma-14-03
      - ma-14-04
      themes:
      - espaces-vectoriels
      note: "Le cours définit les combinaisons linéaires d'une partie par ses sous-familles finies, sans nommer les familles presque nulles."
  - intitule: A - Espaces vectoriels · b) Sous-espaces vectoriels
    points:
    - contenu: "Sous-espace vectoriel : définition, caractérisation."
      precisions: "Sous-espace nul. Droite vectorielle. Plan vectoriel de $\\mathbb{R}^3$. Sous-espace $\\mathbb{K}_n[X]$ de $\\mathbb{K}[X]$."
      cours:
      - "ma-14:3"
      ex:
      - ma-14-05
      - ma-14-06
      - ma-14-07
      - ma-14-08
      themes:
      - espaces-vectoriels
    - contenu: Intersection d’une famille de sous-espaces vectoriels.
      precisions: Ensemble des solutions d’un système linéaire homogène.
      cours:
      - "ma-14:3"
      ex:
      - ma-14-10
      - ma-14-34
      themes:
      - espaces-vectoriels
    - contenu: Sous-espace vectoriel engendré par une partie $A$.
      precisions: "Notations $\\operatorname{Vect}(A)$, $\\operatorname{Vect}(x_i)_{i\\in I}$. Tout sous-espace vectoriel contenant $A$ contient $\\operatorname{Vect}(A)$."
      cours:
      - "ma-14:3"
      ex:
      - ma-14-09
      - ma-14-10
      - ma-14-12
      - ma-14-13
      themes:
