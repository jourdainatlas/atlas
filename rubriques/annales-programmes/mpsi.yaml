      precisions: "Bases canoniques de $\\mathbb{K}^n$, $\\mathcal{M}_{n,p}(\\mathbb{K})$, $\\mathbb{K}_n[X]$, $\\mathbb{K}[X]$. Bases de polynômes à degrés échelonnés dans $\\mathbb{K}[X]$ et $\\mathbb{K}_n[X]$."
      cours:
