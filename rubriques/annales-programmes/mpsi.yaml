      cours:
      - "ma-11:3"
      ex:
      - ma-11-22
      - ma-11-24
      - ma-11-32
      themes:
      - groupes
    - contenu: Isomorphisme.
      cours:
      - "ma-11:3"
      ex:
      - ma-11-11
      - ma-11-27
      - ma-11-28
      - ma-11-59
      themes:
      - groupes
  - intitule: c) Structures d’anneau et de corps
    points:
    - contenu: Anneau.
      precisions: "Tout anneau est unitaire. Exemples usuels : $\\mathbb{Z}$, $\\mathbb{Q}$, $\\mathbb{R}$, $\\mathbb{C}$."
