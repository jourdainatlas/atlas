- intitule: Calcul matriciel et systèmes linéaires
  periode: Premier semestre
  objectif: Le but de cette section est de présenter une initiation au calcul matriciel. Ainsi, on prépare l’étude géométrique de l’algèbre linéaire menée au second semestre, on revient sur l’étude des
    systèmes linéaires et on obtient des exemples fondamentaux d’anneaux.
  blocs:
  - intitule: a) Opérations sur les matrices
    points:
    - contenu: "Ensemble $\\mathcal{M}_{n,p}(\\mathbb{K})$ des matrices à $n$ lignes et $p$ colonnes à coefficients dans le corps $\\mathbb{K}$. Addition, multiplication par un scalaire, combinaisons linéaires."
      cours:
      - "ma-16:2"
      themes:
      - matrices
    - contenu: Matrices élémentaires.
      precisions: "Toute matrice de $\\mathcal{M}_{n,p}(\\mathbb{K})$ est combinaison linéaire de matrices élémentaires."
      cours:
      - "ma-16:2"
      themes:
      - matrices
    - contenu: Produit matriciel ; bilinéarité, associativité.
      precisions: Si $X$ est une matrice colonne, $AX$ est une combinaison linéaire des colonnes de $A$.
      cours:
      - "ma-16:2"
      ex:
      - ma-16-01
      - ma-16-03
      - ma-16-04
      themes:
      - matrices
    - contenu: "Produit d’une matrice élémentaire de $\\mathcal{M}_{n,p}(\\mathbb{K})$ par une matrice élémentaire de $\\mathcal{M}_{p,q}(\\mathbb{K})$."
      precisions: "Symbole de Kronecker $\\delta_{i,j}$."
      cours:
      - "ma-16:2"
      ex:
      - ma-16-05
      - ma-16-10
      themes:
      - matrices
    - contenu: Transposée d’une matrice.
      precisions: Notation $A^\top$.
      cours:
      - "ma-16:2"
      ex:
      - ma-16-06
      - ma-16-16
      themes:
      - matrices
    - contenu: "Opérations sur les transposées : combinaison linéaire, produit."
      cours:
      - "ma-16:2"
      ex:
      - ma-16-07
      - ma-16-16
      themes:
      - matrices
  - intitule: b) Opérations élémentaires
    points:
    - contenu: Interprétation des opérations élémentaires sur les lignes et sur les colonnes en termes de produit matriciel.
      cours:
      - "ma-16:6"
      ex:
      - ma-16-41
      themes:
      - systemes-lineaires
      - matrices
  - intitule: c) Systèmes linéaires
    points:
    - contenu: Écriture matricielle $AX=B$ d’un système linéaire. Système homogène associé.
      cours:
      - "ma-16:6"
      - "ma-03:5"
      ex:
      - ma-16-49
      themes:
      - systemes-lineaires
    - contenu: Système compatible.
      precisions: Le système $AX=B$ est compatible si $B$ est combinaison linéaire des colonnes de $A$.
      cours:
      - "ma-16:6"
      - "ma-03:5"
      ex:
      - ma-03-40
      - ma-03-41
      themes:
      - systemes-lineaires
    - contenu: Les solutions du système compatible $AX=B$ sont les $X_0+Y$, où $X_0$ est une solution particulière et où $Y$ parcourt l’ensemble des solutions du système homogène associé.
      precisions: On reprend brièvement l’algorithme du pivot, en termes d’opérations élémentaires sur les lignes, dans ce contexte général. Toute technicité est exclue.
      cours:
      - "ma-16:6"
      - "ma-03:5"
      ex:
      - ma-03-38
      - ma-03-40
      - ma-03-42
      themes:
      - systemes-lineaires
  - intitule: e) Anneau des matrices carrées
    points:
    - contenu: "Anneau $\\mathcal{M}_n(\\mathbb{K})$."
      precisions: Non commutativité si $n\geqslant2$. Exemples de diviseurs de zéro, d’éléments nilpotents.
      cours:
      - "ma-16:3"
      ex:
      - ma-16-01
      - ma-16-03
      - ma-16-13
      - ma-16-54
      themes:
      - matrices
    - contenu: Matrice identité, matrice scalaire.
      precisions: Notation $I_n$.
      cours:
      - "ma-16:3"
      ex:
      - ma-16-05
      themes:
      - matrices
    - contenu: Matrices symétriques, antisymétriques.
      precisions: "Notations $\\mathcal{S}_n(\\mathbb{K})$, $\\mathcal{A}_n(\\mathbb{K})$."
      cours:
      - "ma-16:3"
      ex:
      - ma-16-07
      - ma-16-57
      themes:
      - antisymetriques
      - matrices
    - contenu: Formule du binôme.
      precisions: Application au calcul de puissances.
      cours:
      - "ma-16:3"
      ex:
      - ma-16-01
      - ma-16-09
      - ma-16-10
      - ma-16-13
      themes:
      - matrices
      - coefficients-binomiaux
    - contenu: Produit de matrices diagonales, de matrices triangulaires supérieures, inférieures.
      cours:
      - "ma-16:3"
      ex:
      - ma-16-10
      - ma-16-16
      - ma-16-29
      themes:
      - matrices
    - contenu: Matrice inversible, inverse. Groupe linéaire.
      precisions: "Notation $\\mathrm{GL}_n(\\mathbb{K})$."
      cours:
      - "ma-16:3"
      ex:
      - ma-16-12
      - ma-16-14
      - ma-16-17
      themes:
      - matrices
      - groupes-matrices
    - contenu: Inverse d’une transposée.
      cours:
      - "ma-16:3"
      ex:
      - ma-16-16
      themes:
      - matrices
    - contenu: Les opérations élémentaires préservent l’inversibilité.
      cours:
      - "ma-16:6"
      ex:
      - ma-16-47
      - ma-16-48
      themes:
      - matrices
    - contenu: Calcul de l’inverse d’une matrice, par opérations élémentaires ou par résolution du système $AX=Y$.
      precisions: Toute technicité est exclue.
      cours:
      - "ma-16:6"
      - "ma-16:3"
      ex:
      - ma-16-20
      - ma-16-47
      - ma-16-48
      - ma-16-49
      themes:
      - matrices
      - systemes-lineaires
    - contenu: Condition nécessaire et suffisante d’inversibilité d’une matrice triangulaire ; l’inverse d’une matrice triangulaire inversible est triangulaire.
      precisions: Cas particulier des matrices diagonales.
      cours:
      - "ma-16:4"
      ex:
      - ma-16-20
      - ma-16-10
      themes:
      - matrices
- intitule: Polynômes et fractions rationnelles
  periode: Premier semestre
  objectif: "L’objectif de cette section est d’étudier les propriétés de base des polynômes et fractions rationnelles, objets particulièrement riches dont l’étude interagit avec beaucoup de thèmes du semestre\
    \ : l’étude des équations algébriques suggère des problèmes de localisation des racines (techniques analytiques dans le cas réel, plus géométriques dans le cas complexe), et l’interpolation de Lagrange\
    \ donne lieu à des problèmes issus de la théorie de l’approximation. L’arithmétique de $\\mathbb{K}[X]$ est développée selon le plan déjà utilisé pour l’arithmétique de $\\mathbb{Z}$, ce qui autorise\
    \ un exposé allégé. Le programme se limite au cas où le corps de base $\\mathbb{K}$ est égal à $\\mathbb{R}$ ou $\\mathbb{C}$."
  hors_programme:
  - "La construction de $\\mathbb{K}[X]$."
  - La démonstration du théorème de d’Alembert-Gauss.
  - "La construction de $\\mathbb{K}(X)$."
  - La démonstration de l’existence et de l’unicité de la décomposition en éléments simples.
  blocs:
  - intitule: a) Anneau des polynômes à une indéterminée
    points:
    - contenu: "Anneau $\\mathbb{K}[X]$."
      precisions: "La construction de $\\mathbb{K}[X]$ est hors programme."
      cours:
      - "ma-13:2"
      ex:
      - ma-13-01
      themes:
      - polynomes
    - contenu: Degré, coefficient dominant, polynôme unitaire.
      precisions: "Ensemble $\\mathbb{K}_n[X]$ des polynômes de degré au plus $n$."
      cours:
      - "ma-13:2"
      ex:
      - ma-13-02
      - ma-13-54
      themes:
      - polynomes
    - contenu: Degré d’une somme, d’un produit.
      precisions: "L’anneau $\\mathbb{K}[X]$ est intègre."
      cours:
      - "ma-13:2"
      ex:
      - ma-13-02
      - ma-13-03
      themes:
      - polynomes
    - contenu: Composition.
      cours:
      - "ma-13:2"
      ex:
      - ma-13-03
      - ma-13-09
      - ma-13-04
      themes:
      - polynomes
  - intitule: b) Divisibilité et division euclidienne
    points:
    - contenu: "Divisibilité dans $\\mathbb{K}[X]$, diviseurs, multiples. Caractérisation des couples de polynômes associés."
      cours:
      - "ma-13:3"
      ex:
      - ma-13-06
      - ma-13-07
      - ma-13-09
      themes:
      - arithmetique-polynomes
      - polynomes
    - contenu: Théorème de la division euclidienne.
      precisions: Algorithme de la division euclidienne.
      cours:
      - "ma-13:3"
      ex:
      - ma-13-05
      - ma-13-08
      - ma-13-20
      - ma-13-21
      themes:
      - polynomes
  - intitule: c) Fonctions polynomiales et racines
    points:
    - contenu: Fonction polynomiale associée à un polynôme. Racine (ou zéro) d’un polynôme, caractérisation en termes de divisibilité.
      precisions: Lien avec l’introduction aux équations algébriques de la section « Nombres complexes ». Méthode de Horner pour l’évaluation polynomiale.
      cours:
      - "ma-13:4"
      ex:
      - ma-13-10
      - ma-13-11
      - ma-13-12
      themes:
      - racines-polynomes
    - contenu: Le nombre de racines d’un polynôme non nul est majoré par son degré.
      precisions: Détermination d’un polynôme par la fonction polynomiale associée.
      cours:
      - "ma-13:4"
      ex:
      - ma-13-04
      - ma-13-18
      - ma-13-68
      themes:
      - racines-polynomes
    - contenu: Multiplicité d’une racine.
      cours:
      - "ma-13:4"
      ex:
      - ma-13-13
      - ma-13-22
      themes:
      - racines-polynomes
    - contenu: Polynôme scindé. Relations entre coefficients et racines (formules de Viète).
      precisions: Les formules concernant la somme et le produit doivent être connues des étudiants ; les autres doivent être retrouvées rapidement.
      cours:
      - "ma-13:4"
      ex:
      - ma-13-13
      - ma-13-14
      - ma-13-15
      - ma-13-17
      - ma-13-57
      themes:
      - racines-polynomes
  - intitule: d) Dérivation
    points:
    - contenu: Dérivée formelle d’un polynôme.
      precisions: "Pour $\\mathbb{K}=\\mathbb{R}$, lien avec la dérivée de la fonction polynomiale associée."
      cours:
      - "ma-13:5"
      ex:
      - ma-13-19
      - ma-13-23
      themes:
      - polynomes
    - contenu: "Opérations sur les polynômes dérivés : combinaison linéaire, produit. Formule de Leibniz."
      cours:
      - "ma-13:5"
      themes:
      - polynomes
    - contenu: Formule de Taylor polynomiale.
      cours:
      - "ma-13:5"
      ex:
      - ma-13-19
      - ma-15-04
      themes:
      - polynomes
    - contenu: Caractérisation de la multiplicité d’une racine par les polynômes dérivés successifs.
      cours:
      - "ma-13:5"
      ex:
      - ma-13-20
      - ma-13-21
      - ma-13-22
      - ma-13-26
      themes:
      - racines-polynomes
  - intitule: "e) Arithmétique dans $\\mathbb{K}[X]$"
    points:
    - contenu: PGCD de deux polynômes dont l’un au moins est non nul.
      precisions: Tout diviseur commun à $A$ et $B$ de degré maximal est appelé un PGCD de $A$ et $B$.
      cours:
      - "ma-13:6"
      ex:
      - ma-13-28
      - ma-13-31
      themes:
      - arithmetique-polynomes
    - contenu: Algorithme d’Euclide.
      precisions: L’ensemble des diviseurs communs à $A$ et $B$ est égal à l’ensemble des diviseurs d’un de leurs PGCD. Tous les PGCD de $A$ et $B$ sont associés. Un seul est unitaire, on le note $A\wedge
        B$.
      cours:
      - "ma-13:6"
      ex:
      - ma-13-28
      - ma-13-30
      themes:
      - arithmetique-polynomes
    - contenu: Relation de Bézout.
      precisions: Détermination d’un couple de Bézout par l’algorithme d’Euclide étendu.
      cours:
      - "ma-13:6"
      ex:
      - ma-13-28
      - ma-13-29
      - ma-13-47
      - ma-13-32
      themes:
      - arithmetique-polynomes
    - contenu: PPCM.
      precisions: Notation $A\vee B$.
      cours:
      - "ma-13:6"
      ex:
      - ma-13-30
      themes:
      - arithmetique-polynomes
    - contenu: Couple de polynômes premiers entre eux. Théorème de Bézout. Lemme de Gauss.
      precisions: "Adaptation des résultats présentés lors de l’étude de l’arithmétique dans $\\mathbb{Z}$."
      cours:
      - "ma-13:6"
      ex:
      - ma-13-30
      - ma-13-33
      - ma-13-32
      themes:
      - arithmetique-polynomes
    - contenu: PGCD d’un nombre fini de polynômes, relation de Bézout. Polynômes premiers entre eux dans leur ensemble, premiers entre eux deux à deux.
      cours:
      - "ma-13:6"
      themes:
      - arithmetique-polynomes
  - intitule: "f) Polynômes irréductibles de $\\mathbb{C}[X]$ et $\\mathbb{R}[X]$"
    points:
    - contenu: Théorème de d’Alembert-Gauss.
      precisions: La démonstration est hors programme.
      demo: hors programme
      cours:
      - "ma-13:7"
      themes:
      - racines-polynomes
    - contenu: "Polynômes irréductibles de $\\mathbb{C}[X]$. Théorème de décomposition en facteurs irréductibles dans $\\mathbb{C}[X]$."
      precisions: "Caractérisation de la divisibilité dans $\\mathbb{C}[X]$ à l’aide des racines et des multiplicités. Deux polynômes de $\\mathbb{C}[X]$ sont premiers entre eux si et seulement s’ils n’ont\
        \ pas de racine commune. Factorisation de $X^n-1$ dans $\\mathbb{C}[X]$."
      cours:
      - "ma-13:7"
      ex:
      - ma-13-11
      - ma-13-16
      - ma-13-33
      - ma-13-36
      themes:
      - arithmetique-polynomes
      - racines-polynomes
    - contenu: "Polynômes irréductibles de $\\mathbb{R}[X]$. Théorème de décomposition en facteurs irréductibles dans $\\mathbb{R}[X]$."
      precisions: "Deux racines complexes conjuguées d’un polynôme de $\\mathbb{R}[X]$ ont même multiplicité."
