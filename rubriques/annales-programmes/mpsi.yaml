- intitule: Nombres réels et suites numériques
  periode: Premier semestre
  objectif: L’objectif de cette section est de donner une base solide à l’étude des suites réelles ; on insiste sur le caractère fondamental de la propriété de la borne supérieure. Dans l’étude des suites,
    on distingue nettement les aspects qualitatifs (monotonie, convergence, divergence) des aspects quantitatifs (majoration, encadrement, vitesse de convergence ou de divergence).
  hors_programme:
  - "Les constructions des ensembles de nombres usuels (et en particulier celle de $\\mathbb{R}$)."
  blocs:
  - intitule: a) Ensembles de nombres usuels
    points:
    - contenu: Entiers naturels, relatifs, nombres décimaux, rationnels, réels, irrationnels.
      precisions: "Les constructions des ensembles de nombres usuels (et en particulier celle de $\\mathbb{R}$) sont hors programme."
      cours:
      - "ma-07:2"
      ex:
      - ma-07-04
      - ma-12-31
      - ma-07-22
      themes:
      - irrationalite
      - rationnels-decimaux
    - contenu: Approximations décimales d’un réel.
      precisions: "Valeurs décimales approchées à la précision $10^{-n}$ par défaut et par excès."
      cours:
      - "ma-07:2"
      ex:
      - ma-07-07
      themes:
      - rationnels-decimaux
    - contenu: "Tout intervalle ouvert non vide rencontre $\\mathbb{Q}$ et $\\mathbb{R}\\setminus\\mathbb{Q}$."
      cours:
      - "ma-07:2"
      ex:
      - ma-07-07
      themes:
      - densite
    - contenu: "Droite achevée $\\overline{\\mathbb{R}}$."
      cours:
      - "ma-07:2"
  - intitule: b) Propriété de la borne supérieure
    points:
    - contenu: "Borne supérieure (resp. inférieure) d’une partie de $\\mathbb{R}$."
      precisions: Notations $\sup X$, $\inf X$.
      cours:
      - "ma-07:2"
      ex:
      - ma-07-01
      - ma-07-03
      - ma-07-05
    - contenu: "Toute partie non vide et majorée (resp. minorée) de $\\mathbb{R}$ admet une borne supérieure (resp. inférieure)."
      cours:
      - "ma-07:2"
      ex:
      - ma-07-45
      - ma-07-46
      - ma-07-51
    - contenu: "Une partie $X$ de $\\mathbb{R}$ est un intervalle si et seulement si pour tous $a,b\\in X$ tels que $a\\leqslant b$, $[a,b]\\subset X$."
      cours:
      - "ma-07:2"
  - intitule: c) Généralités sur les suites réelles
    points:
    - contenu: Suite majorée, minorée, bornée. Suite stationnaire, monotone, strictement monotone.
      precisions: "Une suite $(u_n)_{n\\in\\mathbb{N}}$ est bornée si et seulement si $\\big(|u_n|\\big)_{n\\in\\mathbb{N}}$ est majorée."
      cours:
      - "ma-07:3"
      ex:
      - ma-07-17
      themes:
      - suites
    - contenu: "Mode de définition d’une suite réelle : explicite, implicite, par récurrence."
      cours:
      - "ma-07:3"
      ex:
      - ma-07-42
      - ma-07-43
      - ma-07-44
      themes:
      - suites
  - intitule: d) Limite d’une suite réelle
    points:
    - contenu: Limite finie ou infinie d’une suite.
      precisions: Les définitions sont énoncées avec des inégalités larges.
      cours:
      - "ma-07:4"
      ex:
      - ma-07-08
      - ma-07-09
      - ma-07-15
      themes:
      - suites
    - contenu: Unicité de la limite.
      precisions: Notations $u_n\longrightarrow\ell$, $\lim u_n$.
      cours:
      - "ma-07:4"
      themes:
      - suites
    - contenu: Suite convergente, divergente.
      cours:
      - "ma-07:4"
      ex:
      - ma-07-09
      - ma-07-10
      themes:
      - suites
    - contenu: Toute suite convergente est bornée.
      cours:
      - "ma-07:4"
      themes:
      - suites
    - contenu: "Opérations sur les limites : combinaison linéaire, produit, quotient."
      precisions: Produit d’une suite bornée et d’une suite de limite nulle.
      cours:
      - "ma-07:4"
      ex:
      - ma-07-08
      - ma-07-10
      - ma-07-11
      - ma-07-13
      themes:
      - suites
    - contenu: Passage à la limite d’une inégalité large.
      cours:
      - "ma-07:4"
      ex:
      - ma-07-45
      themes:
      - suites
    - contenu: "Si $(u_n)_{n\\in\\mathbb{N}}$ converge vers $\\ell>0$, alors $u_n>0$ à partir d’un certain rang."
      cours:
      - "ma-07:4"
      themes:
      - suites
    - contenu: Existence d’une limite par encadrement (limite finie), par minoration (limite $+\infty$), par majoration (limite $-\infty$).
      precisions: "Utilisation d’une majoration de la forme $|u_n-\\ell|\\leqslant v_n$, où $(v_n)$ converge vers 0."
      cours:
      - "ma-07:4"
      ex:
      - ma-07-12
      - ma-07-16
      - ma-07-47
      themes:
      - suites
  - intitule: e) Suites monotones
    points:
    - contenu: Théorème de la limite monotone.
      cours:
      - "ma-07:5"
      ex:
      - ma-07-18
      - ma-07-27
      themes:
      - suites
    - contenu: Théorème des suites adjacentes.
      cours:
      - "ma-07:5"
      ex:
      - ma-07-19
      - ma-07-20
      - ma-07-23
      - ma-07-21
      - ma-07-24
      themes:
      - suites
  - intitule: f) Suites extraites
    points:
    - contenu: Suite extraite. Si une suite possède une limite, toutes ses suites extraites possèdent la même limite.
      precisions: "Utilisation pour montrer la divergence d’une suite. Si $(u_{2n})$ et $(u_{2n+1})$ tendent vers $\\ell$, alors $(u_n)$ tend vers $\\ell$."
      cours:
      - "ma-07:6"
      ex:
      - ma-07-25
      - ma-07-26
      - ma-07-28
      - ma-07-29
      themes:
      - suites
    - contenu: Théorème de Bolzano-Weierstrass.
