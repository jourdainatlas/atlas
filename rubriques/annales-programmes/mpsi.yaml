    - contenu: "Primitives des fonctions exponentielle, logarithme, puissances, trigonométriques et hyperboliques, et des fonctions $x\\mapsto\\frac{1}{1+x^2}$, $x\\mapsto\\frac{1}{\\sqrt{1-x^2}}$."
      precisions: "Les étudiants doivent savoir calculer les primitives de fonctions du type $x\\mapsto\\frac{1}{ax^2+bx+c}$ et reconnaître les dérivées de fonctions composées."
