  - intitule: B - Primitives et équations différentielles linéaires · a) Calcul de primitives
    points:
    - contenu: Primitives d’une fonction définie sur un intervalle à valeurs complexes. Lien entre intégrales et primitives.
      precisions: "Description de l’ensemble des primitives d’une fonction sur un intervalle connaissant l’une d’entre elles. On rappelle sans démonstration que, pour une fonction continue $f$, $x\\mapsto\\\
        int_{x_0}^{x}f(t)\\,\\mathrm{d}t$ a pour dérivée $f$. On pourra noter $\\int^{x}f(t)\\,\\mathrm{d}t$ une primitive générique de $f$."
