- intitule: "Fonctions d’une variable réelle : limites et continuité, dérivabilité, convexité"
  periode: Premier semestre
  objectif: "Dans cette section, on démontre les théorèmes de base relatifs aux fonctions réelles de variable réelle et on développe l’étude des fonctions convexes amorcée en terminale, en visualisant les\
    \ fonctions par leur graphe à l’aide de nombreuses figures. Les fonctions sont définies sur un intervalle $I$ de $\\mathbb{R}$ non vide et non réduit à un point et, sauf dans les paragraphes A-d) et\
    \ B-e), sont à valeurs réelles ; une propriété est vraie au voisinage de $a$ si elle est vraie sur l’intersection de $I$ avec un intervalle ouvert centré en $a$ si $a$ est réel, avec un intervalle $]A,+\\\
    infty[$ si $a=+\\infty$, avec un intervalle $]-\\infty,A[$ si $a=-\\infty$. L’étude des suites récurrentes $u_{n+1}=f(u_n)$ est l’occasion d’introduire la notion de vitesse de convergence (convergence\
    \ lente, géométrique, quadratique ; on pourra présenter la méthode de Newton), et l’étude de la dérivabilité celle de discrétisation, à travers la méthode d’Euler. En A-a), adaptation au cas continu\
    \ de notions étudiées pour les suites, le professeur a la liberté d’admettre certains résultats, et l’on se borne à des calculs de limites très simples en attendant les développements limités."
