- intitule: Groupe symétrique et déterminants
  periode: Deuxième semestre
  objectif: Le groupe symétrique est introduit en vue de l’étude des déterminants, mais aussi pour son intérêt propre et ses interventions possibles dans diverses questions d’algèbre et de probabilités.
    La partie sur les déterminants a pour objectifs d’introduire la notion de déterminant d’une famille de vecteurs, en motivant sa construction par la géométrie, d’établir les principales propriétés des
    déterminants des matrices carrées et des endomorphismes, et d’indiquer quelques méthodes simples de calcul de déterminants.
  blocs:
  - intitule: A - Groupe symétrique · a) Généralités
    points:
    - contenu: "Groupe des permutations de l’ensemble $\\{1,\\dots,n\\}$."
      precisions: "Notation $\\mathcal{S}_n$."
      cours:
      - "ma-17:2"
      - "ma-11:3"
      ex:
      - ma-11-33
      - ma-17-10
      - ma-17-13
      themes:
      - groupe-symetrique
    - contenu: Cycle, transposition.
      precisions: Notation $(a_1\ a_2\ \dots\ a_p)$.
      cours:
      - "ma-17:2"
      ex:
      - ma-17-04
      - ma-17-08
      - ma-17-11
      - ma-17-15
      - ma-17-17
      themes:
      - groupe-symetrique
    - contenu: "Décomposition d’une permutation en produit de cycles à supports disjoints : existence, unicité, commutativité."
      precisions: La démonstration n’est pas exigible, mais les étudiants doivent savoir décomposer une permutation.
      demo: non exigible
      cours:
      - "ma-17:2"
      ex:
      - ma-17-01
      - ma-17-03
      - ma-17-07
      - ma-17-11
      - ma-17-15
      themes:
      - groupe-symetrique
  - intitule: A - Groupe symétrique · b) Signature d’une permutation
    points:
    - contenu: Décomposition d’une permutation en produit de transpositions.
      cours:
      - "ma-17:2"
      ex:
      - ma-17-03
      - ma-17-04
      - ma-17-09
      - ma-17-16
      themes:
      - groupe-symetrique
    - contenu: "Signature : il existe un unique morphisme de groupes de $\\mathcal{S}_n$ dans $\\{-1,1\\}$ envoyant toute transposition sur $-1$."
      precisions: La démonstration n’est pas exigible.
      demo: non exigible
      cours:
      - "ma-17:2"
      ex:
      - ma-17-01
      - ma-17-02
      - ma-17-05
      - ma-17-06
      - ma-17-12
      - ma-17-58
      themes:
      - groupe-symetrique
  - intitule: B - Déterminants · a) Formes $n$-linéaires alternées
    points:
    - contenu: "Forme $n$-linéaire alternée sur un $\\mathbb{K}$-espace vectoriel de dimension $n$."
      precisions: La définition est motivée par les notions intuitives d’aire et de volume algébriques, en s’appuyant sur des figures.
      cours:
      - "ma-17:3"
      ex:
      - ma-17-19
      - ma-17-22
      - ma-17-20
      themes:
      - determinants
    - contenu: Antisymétrie, effet d’une permutation.
      precisions: Si $f$ est une forme $n$-linéaire alternée et si $(x_1,\dots,x_n)$ est une famille liée, alors $f(x_1,\dots,x_n)=0$.
      cours:
      - "ma-17:3"
      ex:
      - ma-17-34
      - ma-17-19
      - ma-17-22
      themes:
      - determinants
  - intitule: B - Déterminants · b) Déterminant d’une famille de vecteurs dans une base
    points:
    - contenu: Si $e$ est une base, il existe une unique forme $n$-linéaire alternée $f$ pour laquelle $f(e)=1$ ; toute forme $n$-linéaire alternée est un multiple de $\det_e$.
      precisions: Notation $\det_e$. La démonstration de l’existence n’est pas exigible.
      demo: non exigible (existence)
      cours:
      - "ma-17:3"
      ex:
      - ma-17-22
      themes:
      - determinants
    - contenu: Expression du déterminant dans une base en fonction des coordonnées.
      precisions: "Dans $\\mathbb{R}^2$ (resp. $\\mathbb{R}^3$), interprétation du déterminant dans la base canonique comme aire orientée (resp. volume orienté) d’un parallélogramme (resp. parallélépipède)."
      cours:
      - "ma-17:3"
      ex:
      - ma-17-18
      - ma-17-23
      themes:
      - determinants
    - contenu: "Comparaison, si $e$ et $e'$ sont deux bases, de $\\det_e$ et $\\det_{e'}$."
      cours:
      - "ma-17:3"
