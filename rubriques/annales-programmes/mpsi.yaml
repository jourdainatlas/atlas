        \ $\\mathbb{Q}^*$, $\\mathbb{Q}_+^*$, $\\mathbb{R}^*$, $\\mathbb{R}_+^*$, $\\mathbb{C}^*$, $\\mathbb{U}$, $\\mathbb{U}_n$."
      cours:
