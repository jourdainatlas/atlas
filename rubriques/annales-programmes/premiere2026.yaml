- intitule: Analyse
  objectif: "Deux points fondamentaux sont étudiés : le concept de dérivée, avec ses applications à l'étude des fonctions, et la fonction exponentielle. L'étude de la dérivation distingue le point de vue\
    \ local (nombre dérivé) et le point de vue global (fonction dérivée) ; les fonctions étudiées sont toutes régulières et le nombre dérivé est introduit à partir de la perception intuitive de la limite\
    \ du taux de variation, en s'appuyant sur des représentations graphiques, le calcul algébrique du taux de variation (fonctions du second degré, fonction inverse) et le calcul numérique de $f(a+h) -\
    \ f(a)$ pour $h$ proche de $0$ ; taux de variation et nombre dérivé sont illustrés en géométrie (pentes), en cinématique (vitesses) et en économie (cout marginal). La fonction exponentielle est étudiée\
    \ en liaison avec les suites géométriques et les autres disciplines ; on peut signaler et utiliser les notations $\\dfrac{\\Delta y}{\\Delta x}$ pour un taux de variation et $\\dfrac{\\mathrm{d}y}{\\\
    mathrm{d}x}$ pour une dérivée. Exemples d'algorithme : liste des coefficients directeurs des sécantes pour un pas donné ; méthode de Newton (cas favorables) ; construction de l'exponentielle par la\
    \ méthode d'Euler ; valeur approchée de $e$ à l'aide de la suite $\\left(\\left(1+\\frac{1}{n}\\right)^n\\right)$ ; approximation de $\\pi$ par la méthode d'Archimède."
  hors_programme:
  - "Nombre dérivé : on n'en donne pas de définition formelle."
  blocs:
  - intitule: Dérivation · Point de vue local
    points:
    - contenu: "Taux de variation. Sécantes à la courbe représentative d'une fonction en un point donné."
      precisions: "Calculer un taux de variation, la pente d'une sécante."
      cours:
      - "p-04:2"
      ex:
      - p-04-01
      - p-04-02
      - p-04-04
      themes:
      - ly-derivation
    - contenu: "Nombre dérivé d'une fonction en un point, comme limite du taux de variation. Notation $f'(a)$."
      precisions: "Interpréter le nombre dérivé en contexte : pente d'une tangente, vitesse instantanée, cout marginal, etc."
      cours:
      - "p-04:2"
      ex:
      - p-04-02
      - p-04-03
      - p-04-04
      - p-04-05
      - p-04-06
      themes:
      - ly-derivation
    - contenu: "Tangente à la courbe représentative d'une fonction en un point, comme « limite des sécantes ». Pente. Équation : la tangente à la courbe représentative de $f$ au point d'abscisse $a$ est\
        \ la droite d'équation $y = f(a) + f'(a)(x-a)$."
      precisions: "Déterminer graphiquement un nombre dérivé par la pente de la tangente. Construire la tangente en un point à une courbe représentative connaissant le nombre dérivé. Déterminer l'équation\
        \ de la tangente en un point à la courbe représentative d'une fonction."
      cours:
      - "p-04:4"
      - "p-04:2"
      ex:
      - p-04-05
      - p-04-16
      - p-04-17
      - p-04-18
      - p-04-19
      themes:
      - ly-derivation
      note: "Le cours définit directement la tangente par son équation (Première, ch. 4, section 4) ; l'idée de limite des sécantes n'apparaît que dans une remarque de Première, ch. 4, section 2."
    - contenu: "Approximation linéaire : fonction affine tangente $x \\mapsto f(a) + f'(a)(x-a)$ et approximation de $f(a+h)$ par $f(a) + f'(a)h$."
      precisions: Calculer une valeur approchée de $f(a+h)$.
      ex:
      - p-04-03
      - p-04-04
      themes:
      - ly-derivation
      note: "L'approximation affine f(a+h) ≈ f(a) + f'(a)h n'est pas dans le cours ; elle est introduite dans ces exercices."
    - contenu: "Démonstration : équation de la tangente en un point à une courbe représentative."
      demo: exigible
      themes:
      - ly-derivation
      note: "Le cours (Première, ch. 4, section 4) pose l'équation de la tangente comme définition, sans démonstration."
