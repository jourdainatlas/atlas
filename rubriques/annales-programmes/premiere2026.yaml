- intitule: Probabilités et statistiques
  objectif: "La notion de probabilité conditionnelle permet d'introduire de manière intuitive celle d'évènements indépendants : deux évènements $A$ et $B$ sont dits indépendants si la probabilité conditionnelle\
    \ de $A$ sachant $B$ est égale à la probabilité de $A$ (sous réserve de la non-nullité de celle de $B$). En première, on développe l'étude du modèle probabiliste sur un univers fini : formaliser la\
    \ notion d'indépendance, introduire la notion de variable aléatoire, ainsi que celles d'espérance, de variance et d'écart type ; comme en seconde, on distingue nettement modèle et réalité. Les notions\
    \ de statistique descriptive sont articulées avec le cours de probabilités en considérant le tirage au sort avec équiprobabilité dans une population. Exemples d'algorithme : méthode de Monte-Carlo (estimation\
    \ de l'aire sous la parabole, du nombre $\\pi$) ; algorithme renvoyant l'espérance, la variance ou l'écart type d'une variable aléatoire ; fréquence d'apparition des lettres d'un texte donné, en français,\
    \ en anglais."
  hors_programme:
  - Le programme ne considère que des univers finis et des variables aléatoires réelles.
  blocs:
  - intitule: Probabilités conditionnelles et indépendance
