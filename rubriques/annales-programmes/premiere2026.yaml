# Programme officiel « Programme de l'enseignement de spécialité de mathématiques de Première » (Arrêté du 26 février 2026 (JO du 27-3-2026), Bulletin officiel n° 14 du 2 avril 2026 (NOR MENE2602917A), annexe « Programme d'enseignement de spécialité de mathématiques de la classe de première de la voie générale » ; elle remplace l'annexe de l'arrêté du 17 janvier 2019 et entre en application à la rentrée scolaire 2026-2027 (page de l'arrêté : https://www.education.gouv.fr/bo/2026/Hebdo14/MENE2602917A).), structuré pour la vue « Programme »
# des Annales (MEMO_atlas_annales.md §45). Liens : cours « chapitre:section » (rang du sommaire, à partir de 1),
# exercices, thèmes d'annales ; un point sans cours ni exercice est affiché « à venir ».
id: premiere2026
intitule: "Programme de l'enseignement de spécialité de mathématiques de Première"
source:
  nom: "Arrêté du 26 février 2026 (JO du 27-3-2026), Bulletin officiel n° 14 du 2 avril 2026 (NOR MENE2602917A), annexe « Programme d'enseignement de spécialité de mathématiques de la classe de première\
    \ de la voie générale » ; elle remplace l'annexe de l'arrêté du 17 janvier 2019 et entre en application à la rentrée scolaire 2026-2027 (page de l'arrêté : https://www.education.gouv.fr/bo/2026/Hebdo14/MENE2602917A)."
  url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%20%E2%80%93%20Programme%20d%26%23039%3Benseignement%20de%20sp%C3%A9cialit%C3%A9%20de%20math%C3%A9matiques%20de%20la%20classe%20de%20premi%C3%A8re%20de%20la%20voie%20g%C3%A9n%C3%A9rale-515408.pdf"
preambule: "Ce programme remplace l'annexe de l'arrêté du 17 janvier 2019 et entre en application à la rentrée scolaire 2026-2027. Il s'organise en quatre parties thématiques, « Algèbre », « Analyse »,\
  \ « Géométrie », « Probabilités et statistiques », et trois parties transversales, « Vocabulaire ensembliste et logique », « Algorithmique et programmation », « Automatismes » ; ce découpage n'est pas\
  \ un plan de cours. Chaque sous-partie précise des contenus, des capacités attendues et, le cas échéant, des démonstrations exemplaires, des exemples d'algorithme et des approfondissements possibles,\
  \ en aucun cas obligatoires ; des items « Histoire des mathématiques » identifient des possibilités de contextualisation historique."
sections:
- intitule: Vocabulaire ensembliste et logique
  objectif: "L'apprentissage des notations mathématiques et de la logique est transversal à tous les chapitres du programme. Il importe d'y travailler d'abord dans des contextes où ils se présentent naturellement,\
    \ puis de prévoir des temps où les concepts et types de raisonnement sont étudiés, après avoir été rencontrés plusieurs fois en situation."
  blocs:
  - points:
    - contenu: "Élément d'un ensemble, sous-ensemble, ensemble vide, appartenance et inclusion, réunion, intersection et complémentaire ; symboles de base $\\varnothing$, $\\in$, $\\subset$, $\\cap$, $\\\
        cup$, $\\{\\ldots\\}$ ; notation des ensembles de nombres et des intervalles."
      precisions: "Les élèves doivent connaitre ces notions et savoir utiliser les symboles correspondants. Pour le complémentaire d'un sous-ensemble $A$ de $E$, on utilise la notation $\\overline{A}$ des\
        \ probabilités, ou la notation $E \\setminus A$."
      cours:
      - "s-01:3"
      - "s-01:4"
      - "s-03:2"
      ex:
      - s-01-25
      - s-01-33
      - s-01-34
      - s-03-02
      note: "Rappels de Seconde : appartenance et inclusion avec les ensembles de nombres (Seconde, ch. 1, section 3), réunion, intersection et ensemble vide avec les intervalles (Seconde, ch. 1, section\
        \ 4), complémentaire noté comme l'événement contraire (Seconde, ch. 3, section 2). La notation E \\ A n'apparaît pas."
    - contenu: Notion de couple ; produit cartésien de deux ensembles.
      precisions: Les élèves rencontrent ces notions.
      cours:
      - "t-07:2"
      note: "Seul le cours de Terminale définit les p-uplets (dont les couples) d'un ensemble fini ; le produit cartésien de deux ensembles n'est pas défini en tant que tel."
    - contenu: "Cardinal (nombre d'éléments) d'un ensemble fini $A$ : notation $\\operatorname{Card}(A)$."
      cours:
      - "t-07:2"
      ex:
      - t-07-01
      - t-07-02
      themes:
      - ly-denombrement
      note: Le cardinal et la notation Card(A) ne sont définis que dans le cours de Terminale (dénombrement).
    - contenu: Lire et écrire des propositions contenant les connecteurs logiques « et », « ou ».
      cours:
      - "py-01:3"
      - "s-01:4"
      ex:
      - py-01-11
      - py-01-15
      - s-01-32
      note: "Pas de cours de logique : les connecteurs « et », « ou » sont présentés avec les booléens de Python (Python – Lycée, ch. 1, section 3) et avec l'intersection et la réunion d'intervalles (Seconde,\
        \ ch. 1, section 4)."
    - contenu: "Mobiliser un contre-exemple pour montrer qu'une proposition est fausse."
      ex:
      - s-01-26
      - p-04-34
      - p-05-30
      - p-06-27
      - p-07-31
      - p-08-24
      note: "Pas de cours de logique : ces exercices « vrai ou faux » demandent un contre-exemple pour chaque affirmation fausse."
    - contenu: Formuler une implication, une équivalence logique, et les mobiliser dans un raisonnement simple.
      ex:
      - s-10-25
      - p-07-28
      - p-07-35
      note: "Pas de cours de logique : l'exercice 10.25 (Seconde) fait juger des implications et une équivalence, exercice 7.28 (Première) et l'exercice 7.35 (Première) font établir une équivalence (caractérisation\
        \ d'un ensemble de points par une équation)."
    - contenu: "Formuler la réciproque d'une implication, la contraposée."
      ex:
      - s-10-25
      note: "Pas de cours de logique ; seule la réciproque est travaillée (exercice 10.25 (Seconde)), la contraposée ne l'est nulle part."
    - contenu: Employer les expressions « condition nécessaire », « condition suffisante ».
    - contenu: Identifier le statut des égalités (identité, équation) et celui des lettres utilisées (variable, inconnue, paramètre).
      cours:
      - "s-04:2"
      - "s-02:2"
      ex:
      - s-04-01
      note: "Rappels de Seconde : l'inconnue d'une équation (Seconde, ch. 4, section 2), les variables d'une expression littérale et les identités remarquables, égalités vraies pour toutes les valeurs des\
        \ lettres (Seconde, ch. 2, section 2) ; le mot « identité » n'y est pas opposé à « équation », et le statut de paramètre n'est pas traité."
    - contenu: Utiliser les quantificateurs et repérer les quantifications implicites dans certaines propositions, particulièrement dans les propositions conditionnelles.
      precisions: Les symboles $\forall$ et $\exists$ ne sont pas exigibles.
      ex:
      - s-01-20
      - p-06-27
      - p-08-24
      note: "Pas de cours de logique : ces vrai-faux font juger des propositions introduites par « pour tout » et « il existe », et des propositions conditionnelles dont la quantification est implicite."
    - contenu: Formuler la négation de propositions quantifiées.
      ex:
      - p-08-24
      note: "Pas de cours de logique ; un seul exemple, dans le corrigé de l'exercice 8.24 (Première), de négation d'une proposition quantifiée."
    - contenu: "Raisonnements par disjonction des cas, par l'absurde, par contraposée."
      precisions: Les élèves produisent ces raisonnements et en découvrent la structure.
      ex:
      - s-01-29
      note: "Pas de cours de logique : l'exercice 1.29 (Seconde) fait raisonner par l'absurde ; rien sur la disjonction des cas ni sur la contraposée."
- intitule: Algorithmique et programmation
  objectif: "L'enseignement de spécialité de première vise la consolidation des notions de variable, d'instruction conditionnelle et de boucle ainsi que l'utilisation des fonctions ; la seule notion nouvelle\
    \ est celle de liste, qui aide à la compréhension de notions telles que les suites numériques, les tableaux de valeurs, les séries statistiques. Comme en seconde, les algorithmes peuvent être écrits\
    \ en langage naturel ou utiliser le langage Python, et le symbole « ← » désigne l'affectation dans un algorithme écrit en langage naturel ; les notions relatives aux types de variables et à l'affectation\
    \ sont consolidées. L'accent est mis sur la programmation modulaire, qui permet de découper une tâche complexe en tâches plus simples."
  hors_programme:
  - "Afin d'éviter des confusions, on se limite aux listes sans présenter d'autres types de collections."
  blocs:
  - intitule: Notion de liste
    points:
    - contenu: Générer une liste (en extension, par ajouts successifs ou en compréhension).
      precisions: "La génération des listes en compréhension et en extension est mise en lien avec la notion d'ensemble ; les conditions apparaissant dans les listes définies en compréhension permettent\
        \ de travailler la logique."
      cours:
      - "py-01:7"
      ex:
      - py-01-29
      themes:
      - ly-algo
      note: "La construction par ajouts successifs est la méthode du cours ; la liste en compréhension n'y fait l'objet que d'une remarque."
    - contenu: "Manipuler des éléments d'une liste (ajouter, supprimer, etc.) et leurs indices."
      cours:
      - "py-01:7"
      ex:
      - py-01-28
      - py-01-31
      themes:
      - ly-algo
      note: "Le cours traite l'accès par indice, la modification et l'ajout (append), mais pas la suppression d'un élément."
    - contenu: Parcourir une liste.
      cours:
      - "py-01:7"
      ex:
      - py-01-30
      - py-01-32
      themes:
      - ly-algo
    - contenu: "Itérer sur les éléments d'une liste."
      cours:
      - "py-01:7"
      ex:
      - py-01-30
      - py-01-32
      - py-01-33
      themes:
      - ly-algo
- intitule: Automatismes
  objectif: "Cette partie vise à construire et à entretenir des habiletés dans les domaines du calcul, de l'information chiffrée et des représentations graphiques, en automatisant le recours à des connaissances,\
    \ procédures, méthodes et stratégies. Les nouvelles notions du programme peuvent donner lieu également à un travail d'automatisation tout le long de l'année. Les capacités attendues n'ont pas vocation\
    \ à faire l'objet d'un chapitre d'enseignement spécifique : elles relèvent d'un entrainement régulier sur l'ensemble du cycle terminal privilégiant l'activité mentale, les thèmes étant travaillés tout\
    \ au long de l'année et non les uns après les autres. À cette liste s'ajoute celle des automatismes de seconde, qui doivent être entretenus en première."
  blocs:
  - intitule: Évolutions et variations
    points:
    - contenu: "Appliquer un taux d'évolution pour calculer une valeur finale ou initiale."
      cours:
      - "s-06:3"
      ex:
      - s-06-13
      - s-06-14
      themes:
      - ly-automatismes
      note: Automatisme travaillé dans le cours de Seconde (pourcentages).
    - contenu: "Calculer un taux d'évolution, l'exprimer en pourcentage."
      cours:
      - "s-06:3"
      ex:
      - s-06-11
      - s-06-12
      - s-06-15
      - s-06-16
      themes:
      - ly-automatismes
      note: Automatisme travaillé dans le cours de Seconde (pourcentages).
    - contenu: "Calculer le taux d'évolution équivalent à plusieurs évolutions successives."
      cours:
      - "s-06:3"
      ex:
      - s-06-17
      - s-06-18
      - s-06-19
      - s-06-20
      themes:
      - ly-automatismes
      note: Automatisme travaillé dans le cours de Seconde (pourcentages).
    - contenu: "Calculer un taux d'évolution réciproque."
      cours:
      - "s-06:3"
      ex:
      - s-06-22
      - s-06-23
      - s-06-32
      themes:
      - ly-automatismes
      note: Automatisme travaillé dans le cours de Seconde (pourcentages).
  - intitule: Calcul numérique et algébrique
    points:
    - contenu: "Déterminer les solutions d'une équation produit nul."
      cours:
      - "s-04:3"
      ex:
      - s-04-11
      - s-04-12
      - s-04-15
      themes:
      - ly-automatismes
      note: Automatisme travaillé dans le cours de Seconde (équations).
    - contenu: "Déterminer le signe d'une expression du premier degré, d'une expression factorisée du second degré."
      cours:
      - "s-09:3"
      - "s-09:4"
      - "p-01:5"
      ex:
      - s-09-09
      - s-09-10
      - s-09-13
      - p-01-19
      themes:
      - ly-automatismes
      note: "Signe d'une expression du premier degré et d'un produit en Seconde (Seconde, ch. 9) ; signe d'un trinôme factorisé en Première (Première, ch. 1, section 5)."
    - contenu: Développer, factoriser, réduire une expression algébrique simple.
      cours:
      - "s-02:2"
      - "s-02:3"
      ex:
      - s-02-07
      - s-02-08
      - s-02-17
      - s-02-20
      - s-02-31
      themes:
      - ly-automatismes
      note: Automatisme travaillé dans le cours de Seconde (calcul littéral).
  - intitule: Fonctions et représentations
    points:
    - contenu: Résoudre graphiquement une équation, une inéquation du type $f(x) = k$, $f(x) < k$, etc.
      cours:
      - "s-07:3"
      - "s-09:6"
      ex:
      - s-07-09
      - s-07-12
      - s-09-11
      - s-09-24
      - p-01-21
      themes:
      - ly-automatismes
      note: Automatisme travaillé dans le cours de Seconde (lecture des antécédents de k sur la courbe, position relative de deux courbes).
    - contenu: "Déterminer graphiquement le signe d'une fonction ou son tableau de variations."
      cours:
      - "s-07:4"
      - "s-09:3"
      ex:
      - s-09-11
      - s-07-13
      - p-01-21
      themes:
      - ly-automatismes
      note: "Automatisme travaillé dans le cours de Seconde (variations, signe d'une fonction affine)."
    - contenu: Tracer une droite donnée par son équation réduite ou par un point et son coefficient directeur.
      cours:
      - "s-08:2"
      ex:
      - s-08-14
      - s-08-18
      themes:
      - ly-automatismes
      note: "Automatisme travaillé dans le cours de Seconde (équation réduite d'une droite)."
    - contenu: "Lire graphiquement l'équation réduite d'une droite."
      cours:
      - "s-08:2"
      ex:
      - s-08-13
      - s-08-16
      - p-03-21
      themes:
      - ly-automatismes
      note: "Automatisme travaillé dans le cours de Seconde (équation réduite d'une droite)."
    - contenu: "Déterminer le coefficient directeur d'une droite à partir des coordonnées de deux de ses points."
      cours:
      - "s-08:2"
      ex:
      - s-08-10
      - s-08-12
      themes:
      - ly-automatismes
      note: Automatisme travaillé dans le cours de Seconde (coefficient directeur).
  - intitule: Statistiques
    points:
    - contenu: "Lire un graphique, un histogramme, un diagramme en barres ou circulaire, un diagramme en boite ou toute autre représentation (repérer l'origine du repère, les unités de graduations ou les\
        \ échelles, etc.)."
      cours:
      - "s-11:2"
      - "s-11:5"
      ex:
      - s-11-05
      - s-11-27
      - s-11-29
      themes:
      - ly-automatismes
      note: "Automatisme travaillé dans le cours de Seconde (diagramme en bâtons, diagramme en boîte) ; histogrammes et diagrammes circulaires n'y sont pas traités."
    - contenu: Passer du graphique aux données et vice-versa.
      cours:
      - "s-11:2"
      - "s-11:5"
      ex:
      - s-11-05
      - s-11-28
      themes:
      - ly-automatismes
      note: Automatisme travaillé dans le cours de Seconde (statistiques).
    - contenu: Calculer et interpréter des indicateurs statistiques pour une série statistique.
      cours:
      - "s-11:3"
      - "s-11:4"
      ex:
      - s-11-08
      - s-11-22
      - s-11-24
      - s-11-33
      themes:
      - ly-automatismes
      note: Automatisme travaillé dans le cours de Seconde (statistiques).
  - intitule: Probabilités
    points:
    - contenu: "Calculer des probabilités conditionnelles lorsque les évènements sont présentés sous forme de tableau croisé d'effectifs ou d'arbres pondérés."
      cours:
      - "p-05:2"
      - "p-05:3"
      - "s-03:4"
      ex:
      - s-03-20
      - p-05-01
      - p-05-03
      - p-05-09
      - p-05-11
      - p-05-15
      themes:
      - ly-automatismes
      - ly-proba-cond
      note: La probabilité conditionnelle relève désormais du programme de Seconde (cours Seconde, ch. 3, section 4), dont les automatismes sont à entretenir en Première ; le cours de Première, écrit pour
        le programme de 2019, la reprend avec les arbres pondérés (Première, ch. 5, section 2 et Première, ch. 5, section 3).
    - contenu: Distinguer $P(A \cap B)$, $P_A(B)$, $P_B(A)$.
      cours:
      - "p-05:2"
      - "s-03:4"
      ex:
      - s-03-20
      - p-05-01
      - p-05-05
      - p-05-06
      - p-05-14
      - p-05-30
      themes:
      - ly-automatismes
      - ly-proba-cond
- intitule: Algèbre
  objectif: "En classe de première, les suites sont présentées d'un point de vue principalement algébrique : l'élève est confronté à des systèmes discrets pour lesquels les suites apparaissent comme modélisation\
    \ adaptée, aborde le concept de définition par récurrence et rencontre différents modes de génération (formule explicite $u_n = f(n)$, relation de récurrence $u_{n+1} = f(u_n)$, motifs géométriques\
    \ ou combinatoires) ; il doit automatiser le fait qu'une évolution à taux fixe est modélisée par une suite géométrique, et l'étude des suites est l'occasion d'une sensibilisation à l'idée de limite.\
    \ L'étude des fonctions polynômes du second degré réactive les connaissances de seconde ; les élèves doivent savoir qu'une telle fonction admet une forme canonique et la déterminer dans des cas simples\
    \ à l'aide de l'identité $x^2 + 2ax = (x+a)^2 - a^2$ (complétion du carré), et pratiquer la factorisation directe dans les cas qui s'y prêtent (racines apparentes, coefficient de $x$ nul, racines entières\
    \ détectées par calcul mental à partir de leur somme et de leur produit). Exemples d'algorithme : calcul de termes d'une suite, de sommes de termes, de seuil ; calcul de factorielle ; liste des premiers\
    \ termes (suites de Syracuse, suite de Fibonacci)."
  hors_programme:
  - "D'autres types simples de suites peuvent être abordés, mais aucune connaissance spécifique à leur sujet n'est au programme."
  - "Limite d'une suite : toute formalisation est exclue."
  - "Le calcul effectif de la forme canonique dans le cas général n'est pas un attendu du programme."
  blocs:
  - intitule: Suites numériques, modèles discrets
    points:
    - contenu: "Exemples de modes de génération d'une suite : explicite $u_n = f(n)$, par une relation de récurrence $u_{n+1} = f(u_n)$, par un algorithme, par des motifs géométriques."
      precisions: "Dans le cadre de l'étude d'une suite, utiliser le registre de la langue naturelle, le registre algébrique, le registre graphique, et passer de l'un à l'autre. Proposer, modéliser une\
        \ situation permettant de générer une suite de nombres. Déterminer une relation explicite ou une relation de récurrence pour une suite définie par un motif géométrique, par une question de dénombrement.\
        \ Calculer des termes d'une suite définie explicitement, par récurrence ou par un algorithme."
      cours:
      - "p-02:2"
      ex:
      - p-02-01
      - p-02-02
      - p-02-08
      - p-02-09
      - p-02-22
      - p-02-30
      themes:
      - ly-suites
      note: "Le cours présente les suites explicites et récurrentes ; la génération par un algorithme ou par un motif géométrique n'est travaillée qu'en exercices."
    - contenu: "Notations : $u(n)$, $u_n$, $(u(n))$, $(u_n)$."
      cours:
      - "p-02:2"
      themes:
      - ly-suites
      note: "Le cours emploie u_n et (u_n) et présente la suite comme une fonction de ℕ dans ℝ, mais n'écrit pas la notation u(n)."
    - contenu: "Suites arithmétiques : exemples, définition, calcul du terme général. Lien avec l'étude d'évolutions successives à accroissements constants. Lien avec les fonctions affines. Calcul de $1\
        \ + 2 + \\cdots + n$."
      precisions: Pour une suite arithmétique, calculer le terme général, la somme de termes consécutifs, déterminer le sens de variation. Modéliser un phénomène discret à croissance linéaire par une suite
        arithmétique.
      cours:
      - "p-02:4"
      - "p-02:6"
      ex:
      - p-02-12
      - p-02-13
      - p-02-14
      - p-02-15
      - p-02-24
      - p-02-27
      themes:
      - ly-suites-arith-geom
      note: "Le lien avec les fonctions affines n'est pas explicité dans le cours."
    - contenu: "Suites géométriques : exemples, définition, calcul du terme général. Lien avec l'étude d'évolutions successives à taux constant. Lien avec la fonction exponentielle. Calcul de $1 + q + \\\
        cdots + q^n$."
      precisions: Pour une suite géométrique, calculer le terme général, la somme de termes consécutifs, déterminer le sens de variation. Modéliser un phénomène discret à croissance exponentielle par une
        suite géométrique.
      cours:
      - "p-02:5"
      - "p-02:6"
      ex:
      - p-02-17
      - p-02-18
      - p-02-19
      - p-02-20
      - p-02-23
      - p-02-25
      themes:
      - ly-suites-arith-geom
      note: "Le lien avec la fonction exponentielle n'est pas explicité dans le chapitre des suites."
    - contenu: "Sens de variation d'une suite."
      cours:
      - "p-02:3"
      ex:
      - p-02-05
      - p-02-06
      - p-02-10
      - p-02-20
      themes:
      - ly-suites
    - contenu: "Sur des exemples, introduction intuitive de la notion de limite, finie ou infinie, ou l'absence de limite d'une suite."
      precisions: "Conjecturer, dans des cas simples, la limite éventuelle d'une suite."
      ex:
      - p-02-07
      - p-02-10
      - p-02-29
      - p-02-30
      themes:
      - ly-limites-suites
      note: "Le cours de Première n'aborde pas la limite d'une suite ; ces exercices font conjecturer une limite finie."
    - contenu: "Démonstration : calcul du terme général d'une suite arithmétique, d'une suite géométrique."
      demo: exigible
      themes:
