      precisions: "Interpréter en situation et utiliser les notations $\\{X = a\\}$, $\\{X \\leqslant a\\}$, $P(X = a)$, $P(X \\leqslant a)$. Passer du registre de la langue naturelle au registre symbolique\
        \ et inversement. Modéliser une situation à l'aide d'une variable aléatoire."
      cours:
      - "p-05:5"
      ex:
      - p-05-20
      - p-05-21
      - p-05-22
      themes:
      - ly-va
      note: "Le cours note P(X = x_i) mais n'introduit pas la notation des événements {X = a}, {X ⩽ a}."
    - contenu: "Loi d'une variable aléatoire."
      precisions: "Déterminer la loi de probabilité d'une variable aléatoire."
      cours:
      - "p-05:5"
      ex:
      - p-05-20
      - p-05-21
      - p-05-22
      - p-05-23
      themes:
      - ly-va
    - contenu: "Espérance, variance, écart type d'une variable aléatoire."
      precisions: "Calculer une espérance, une variance, un écart type. Utiliser la notion d'espérance dans une résolution de problème (mise pour un jeu équitable, etc.)."
      cours:
      - "p-05:6"
      ex:
      - p-05-24
      - p-05-25
      - p-05-26
      - p-05-28
      - p-05-32
      - p-05-35
      themes:
      - ly-esperance-variance
    - contenu: "Linéarité de l'espérance."
      cours:
      - "p-05:6"
      ex:
      - p-05-27
      themes:
      - ly-esperance-variance
      note: "Le programme écrit seulement « Linéarité de l'espérance » et ne mentionne nulle part de somme de variables aléatoires ; le cours, comme celui de Terminale (Terminale, ch. 2, section 2, proposition\
        \ 3), nomme ainsi E[aX+b] = aE[X] + b, établie en Première, ch. 5, section 6. L'additivité E(X+Y) = E(X) + E(Y) n'est pas dans le cours de Première."
    - contenu: Formule de König-Huygens.
      cours:
      - "p-05:6"
      ex:
      - p-05-25
      - p-05-26
      themes:
      - ly-esperance-variance
  - intitule: Expérimentations
    points:
    - contenu: Simuler une variable aléatoire avec Python ou un tableur.
      precisions: "Le travail expérimental de simulation d'échantillons prolonge celui entrepris en seconde ; l'objectif est de faire percevoir le principe de l'estimation de l'espérance d'une variable\
        \ aléatoire, ou de la moyenne d'une variable statistique dans une population, par une moyenne observée sur un échantillon."
      cours:
      - "py-01:6"
      - "py-01:8"
      ex:
      - py-01-38
      - py-01-42
      themes:
      - ly-algo
      note: "La simulation est présentée dans le cours Python (module random, fréquence d'apparition d'une face) ; le tableur n'est pas traité."
    - contenu: "Lire, comprendre et écrire une fonction Python renvoyant la moyenne d'un échantillon de taille $n$ d'une variable aléatoire."
      cours:
      - "py-01:6"
      - "py-01:8"
      themes:
      - ly-algo
      note: "Le cours Python calcule la moyenne de vingt lancers d'un dé par une boucle (Python – Lycée, ch. 1, section 6), et écrit en Python – Lycée, ch. 1, section 8 une fonction de n renvoyant une fréquence,\
        \ moyenne d'un échantillon d'une variable de Bernoulli ; il n'écrit pas de fonction générale de la taille n pour une variable quelconque."
    - contenu: "Étudier sur des exemples la distance entre la moyenne d'un échantillon simulé de taille $n$ d'une variable aléatoire et l'espérance de cette variable aléatoire."
      cours:
      - "py-01:8"
      ex:
      - py-01-38
      - py-01-42
      note: "Seule la fréquence observée (moyenne d'une variable indicatrice) est comparée à la probabilité théorique, dans le cours Python (Python – Lycée, ch. 1, section 8) et dans l'exercice 1.38 (Python\
        \ – Lycée) et l'exercice 1.42 (Python – Lycée)."
    - contenu: "Simuler, avec Python ou un tableur, $N$ échantillons de taille $n$ d'une variable aléatoire, d'espérance $\\mu$ et d'écart type $\\sigma$. Si $m$ désigne la moyenne d'un échantillon, calculer\
        \ la proportion des cas où l'écart entre $m$ et $\\mu$ est inférieur ou égal à $\\dfrac{2\\sigma}{\\sqrt{n}}$."
