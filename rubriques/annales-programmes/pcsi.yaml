    - contenu: Déterminant d’une transposée.
      precisions: La démonstration est hors programme.
      demo: hors programme
      cours:
      - "ma-17:4"
      themes:
      - determinants
  - intitule: B - Déterminants · d) Calcul des déterminants
    points:
    - contenu: Effet des opérations élémentaires.
      cours:
      - "ma-17:5"
      ex:
      - ma-17-33
      - ma-17-34
      - ma-17-35
