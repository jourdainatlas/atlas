  - intitule: g) Exponentielle complexe
    points:
    - contenu: "Définition de $\\mathrm{e}^z$ pour $z$ complexe : $\\mathrm{e}^z=\\mathrm{e}^{\\operatorname{Re}(z)}\\mathrm{e}^{\\mathrm{i}\\operatorname{Im}(z)}$."
      precisions: "Notations $\\exp(z)$, $\\mathrm{e}^z$. Module et arguments de $\\mathrm{e}^z$."
      cours:
      - "ma-04:8"
