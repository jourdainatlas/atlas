      - racines-polynomes
  - intitule: "e) Polynômes irréductibles de $\\mathbb{C}[X]$ et $\\mathbb{R}[X]$"
    points:
    - contenu: Théorème de d’Alembert-Gauss.
      precisions: La démonstration est hors programme.
      demo: hors programme
      cours:
      - "ma-13:7"
      themes:
