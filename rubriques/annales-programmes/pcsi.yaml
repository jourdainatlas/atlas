      - integrales-wallis
      note: "Les suites d'intégrales ne sont pas traitées au chapitre 10 ; elles le sont au chapitre 18, avec les intégrales de Wallis."
- intitule: Espaces vectoriels et applications linéaires
  periode: Deuxième semestre
  objectif: "Les objectifs de cette section sont d’acquérir les notions de base relatives aux espaces vectoriels et à l’indépendance linéaire, de reconnaître les problèmes linéaires et de les traduire à\
    \ l’aide des notions d’espace vectoriel et d’application linéaire, et de définir la notion de dimension, qui décrit le nombre de degrés de liberté d’un problème linéaire ; on insiste sur les méthodes\
    \ de calcul de dimension, qui reposent sur deux types de représentation : paramétrisation linéaire d’un sous-espace, description d’un sous-espace par équations linéaires. En petite dimension, l’intuition\
    \ géométrique permet d’interpréter les notions de l’algèbre linéaire, ce dont on tire parti par de nombreuses figures. $\\mathbb{K}$ désigne $\\mathbb{R}$ ou $\\mathbb{C}$."
  hors_programme:
  - Tout développement théorique sur les espaces de dimension infinie.
  - La définition axiomatique des groupes.
  blocs:
  - intitule: A - Espaces vectoriels · a) Espaces vectoriels
