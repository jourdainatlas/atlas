  - intitule: B - Espaces de dimension finie · a) Existence de bases
    points:
    - contenu: Un espace vectoriel est dit de dimension finie s’il possède une famille génératrice finie.
      cours:
      - "ma-15:2"
      themes:
      - espaces-vectoriels
    - contenu: "Si $(x_i)_{1\\leqslant i\\leqslant n}$ engendre $E$ et si $(x_i)_{i\\in I}$ est libre pour une certaine partie $I$ de $\\{1,\\dots,n\\}$, alors il existe une partie $J$ de $\\{1,\\dots,n\\\
        }$ contenant $I$ pour laquelle $(x_j)_{j\\in J}$ est une base de $E$."
      precisions: Existence de bases en dimension finie. Théorèmes de la base extraite (de toute famille génératrice on peut extraire une base), de la base incomplète (toute famille libre peut être complétée
        en une base).
      cours:
      - "ma-15:2"
      ex:
      - ma-15-02
      - ma-14-25
      - ma-15-05
      - ma-16-46
      themes:
      - espaces-vectoriels
  - intitule: B - Espaces de dimension finie · b) Dimension d’un espace de dimension finie
    points:
    - contenu: Dans un espace engendré par $n$ vecteurs, toute famille de $n+1$ vecteurs est liée.
      cours:
      - "ma-15:2"
      ex:
      - ma-15-24
      - ma-15-51
      themes:
      - espaces-vectoriels
    - contenu: Dimension d’un espace de dimension finie.
      precisions: "Dimension de $\\mathbb{K}^n$, de $\\mathbb{K}_n[X]$, de $\\mathcal{M}_{n,p}(\\mathbb{K})$. Dimension de l’espace des solutions d’une équation différentielle linéaire homogène d’ordre\
        \ 1, de l’espace des solutions d’une équation différentielle linéaire homogène d’ordre 2 à coefficients constants, de l’espace des suites vérifiant une relation de récurrence linéaire homogène d’ordre\
        \ 2 à coefficients constants."
      cours:
      - "ma-15:2"
      ex:
      - ma-15-03
      - ma-15-08
      - ma-15-10
      themes:
      - espaces-vectoriels
      - suites-recurrentes-lineaires
      - equations-differentielles-lineaires
    - contenu: Dans un espace de dimension $n$, caractérisation des bases comme familles libres ou génératrices de $n$ vecteurs.
      cours:
      - "ma-15:2"
      ex:
      - ma-15-01
      - ma-15-06
      - ma-15-07
      themes:
      - espaces-vectoriels
    - contenu: Rang d’une famille finie de vecteurs.
      precisions: "Notation $\\operatorname{rg}(x_1,\\dots,x_n)$."
      cours:
      - "ma-15:2"
      ex:
      - ma-16-46
      - ma-15-13
      - ma-15-14
      themes:
      - espaces-vectoriels
  - intitule: B - Espaces de dimension finie · c) Sous-espaces et dimension
    points:
    - contenu: Dimension d’un sous-espace d’un espace de dimension finie, cas d’égalité.
      cours:
      - "ma-15:3"
      ex:
      - ma-15-15
      - ma-15-18
      themes:
      - espaces-vectoriels
    - contenu: "Dimension d’une somme de deux sous-espaces : formule de Grassmann."
      cours:
      - "ma-15:3"
      ex:
      - ma-15-16
      - ma-15-17
      - ma-15-21
      - ma-15-23
      themes:
      - espaces-vectoriels
    - contenu: Tout sous-espace d’un espace de dimension finie possède un supplémentaire.
      cours:
      - "ma-15:3"
      ex:
      - ma-15-18
      - ma-15-22
      themes:
      - espaces-vectoriels
    - contenu: Caractérisation dimensionnelle des couples de sous-espaces supplémentaires.
      cours:
      - "ma-15:3"
      ex:
      - ma-15-16
      - ma-15-17
      - ma-15-18
      - ma-15-22
      - ma-15-25
      themes:
      - espaces-vectoriels
    - contenu: Base adaptée à un sous-espace, à une décomposition en somme directe de deux sous-espaces.
      cours:
      - "ma-15:3"
      themes:
      - espaces-vectoriels
  - intitule: C - Applications linéaires · a) Généralités
    points:
    - contenu: Application linéaire.
      cours:
      - "ma-14:6"
      ex:
      - ma-14-36
      - ma-14-37
      themes:
      - applications-lineaires
    - contenu: "Opérations sur les applications linéaires : combinaison linéaire, composition. Isomorphisme, réciproque."
      precisions: "Espace vectoriel $\\mathcal{L}(E,F)$ des applications linéaires de $E$ dans $F$. Bilinéarité de la composition."
      cours:
      - "ma-14:6"
      ex:
      - ma-14-39
      - ma-14-40
      - ma-14-44
      themes:
      - applications-lineaires
    - contenu: Image directe et image réciproque d’un sous-espace par une application linéaire.
      cours:
      - "ma-14:6"
      ex:
      - ma-14-47
      - ma-14-48
      themes:
      - applications-lineaires
    - contenu: Image d’une application linéaire.
      precisions: "Notation $\\operatorname{Im}u$."
      cours:
      - "ma-14:6"
      ex:
      - ma-14-37
      - ma-14-38
      - ma-14-42
      themes:
      - applications-lineaires
    - contenu: Noyau d’une application linéaire.
      precisions: "Notation $\\operatorname{Ker}u$. Caractérisation de l’injectivité."
      cours:
      - "ma-14:6"
      ex:
      - ma-14-37
      - ma-14-38
      - ma-14-42
      - ma-14-46
      - ma-14-49
      themes:
      - applications-lineaires
    - contenu: "Si $(x_i)_{i\\in I}$ est une famille finie génératrice de $E$ et si $u\\in\\mathcal{L}(E,F)$, alors $\\operatorname{Im}u=\\operatorname{Vect}(u(x_i))_{i\\in I}$."
      cours:
      - "ma-14:6"
      ex:
      - ma-14-38
      themes:
      - applications-lineaires
    - contenu: Application linéaire de rang fini.
      precisions: "Notation $\\operatorname{rg}(u)$."
      cours:
      - "ma-15:4"
      ex:
      - ma-15-49
      themes:
      - applications-lineaires
    - contenu: "Le rang de $v\\circ u$ est majoré par $\\min(\\operatorname{rg}(u),\\operatorname{rg}(v))$. Invariance du rang par composition par un isomorphisme."
      cours:
      - "ma-15:4"
      ex:
      - ma-15-34
      - ma-15-36
      - ma-15-56
      themes:
      - applications-lineaires
  - intitule: C - Applications linéaires · b) Endomorphismes
    points:
    - contenu: Identité, homothéties.
      precisions: "Notations $\\mathrm{id}_E$, $\\mathrm{id}$."
      cours:
      - "ma-14:6"
      ex:
      - ma-14-52
      themes:
      - applications-lineaires
    - contenu: "Opérations sur les endomorphismes : combinaison linéaire, composition."
      precisions: "Notation $u^k$ pour $u\\in\\mathcal{L}(E)$ et $k\\in\\mathbb{N}$."
      cours:
      - "ma-14:7"
      ex:
      - ma-14-44
      - ma-14-45
      themes:
      - applications-lineaires
    - contenu: "Projection ou projecteur, symétrie : définition géométrique, caractérisation par $p^2=p$, par $s^2=\\mathrm{id}$."
      precisions: On incite les étudiants à se représenter géométriquement ces notions par des figures en dimension 2 et 3.
      cours:
      - "ma-14:7"
      ex:
      - ma-14-53
      - ma-14-54
      - ma-14-55
      - ma-14-57
      - ma-14-58
      - ma-14-63
      themes:
      - projecteurs
    - contenu: Automorphismes. Groupe linéaire.
      precisions: "Notation $\\mathrm{GL}(E)$. On vérifie les propriétés lui conférant une structure de groupe, mais la définition axiomatique des groupes est hors programme. Notation $u^k$ pour $u\\in\\\
        mathrm{GL}(E)$ et $k\\in\\mathbb{Z}$."
      cours:
      - "ma-14:7"
      ex:
      - ma-14-38
      - ma-14-40
      - ma-14-44
      themes:
      - applications-lineaires
  - intitule: C - Applications linéaires · c) Détermination d’une application linéaire lorsque $E$ est de dimension finie
    points:
    - contenu: "Si $(e_i)_{i\\in I}$ est une base de $E$ de dimension finie et $(f_i)_{i\\in I}$ une famille de vecteurs de $F$, alors il existe une unique application $u\\in\\mathcal{L}(E,F)$ telle que,\
        \ pour tout $i\\in I$, $u(e_i)=f_i$."
      precisions: Caractérisation de l’injectivité, de la surjectivité, de la bijectivité de $u$.
      cours:
      - "ma-14:6"
      themes:
      - applications-lineaires
    - contenu: Espaces vectoriels isomorphes, caractérisation par la dimension.
      cours:
      - "ma-15:4"
      ex:
      - ma-15-22
      themes:
      - applications-lineaires
      - espaces-vectoriels
    - contenu: Pour une application linéaire entre deux espaces de même dimension finie, équivalence entre injectivité, surjectivité et bijectivité.
      cours:
      - "ma-15:4"
      ex:
      - ma-14-40
      - ma-15-27
      - ma-15-48
      themes:
      - applications-lineaires
    - contenu: Un endomorphisme d’un espace de dimension finie inversible à gauche ou à droite est inversible.
      cours:
      - "ma-15:4"
      themes:
      - applications-lineaires
    - contenu: "Dimension de $\\mathcal{L}(E,F)$ si $E$ et $F$ sont de dimension finie."
      precisions: "La démonstration peut être traitée plus tard, à l’aide de la dimension de $\\mathcal{M}_{n,p}(\\mathbb{K})$."
      cours:
      - "ma-15:4"
      ex:
      - ma-15-35
      themes:
      - applications-lineaires
    - contenu: "Si $E_1$ et $E_2$ sont des sous-espaces de $E$ tels que $E=E_1\\oplus E_2$, si $u_1\\in\\mathcal{L}(E_1,F)$, $u_2\\in\\mathcal{L}(E_2,F)$, il existe une unique application $u\\in\\mathcal{L}(E,F)$\
        \ coïncidant avec $u_1$ sur $E_1$ et avec $u_2$ sur $E_2$."
      cours:
      - "ma-14:6"
      ex:
      - ma-14-51
      themes:
      - applications-lineaires
  - intitule: C - Applications linéaires · d) Théorème du rang
    points:
    - contenu: "Forme géométrique du théorème du rang : si $u\\in\\mathcal{L}(E,F)$ et si $S$ est un supplémentaire de $\\operatorname{Ker}u$ dans $E$, alors $u$ induit un isomorphisme de $S$ sur $\\operatorname{Im}u$."
      cours:
      - "ma-15:4"
      ex:
      - ma-15-26
      - ma-15-37
      - ma-15-42
      themes:
      - applications-lineaires
    - contenu: "Théorème du rang : si $E$ est de dimension finie $n$ et $u\\in\\mathcal{L}(E,F)$, alors $n=\\dim\\operatorname{Ker}u+\\operatorname{rg}(u)$."
      cours:
      - "ma-15:4"
      ex:
      - ma-15-26
      - ma-15-28
      - ma-15-29
      - ma-15-30
      - ma-15-31
      - ma-15-43
      themes:
      - applications-lineaires
  - intitule: C - Applications linéaires · e) Équations linéaires
    points:
    - contenu: "Notion d’équation linéaire, i.e. de la forme $u(x)=a$ où $u\\in\\mathcal{L}(E,F)$, $a\\in F$. L’ensemble des solutions est soit l’ensemble vide, soit de la forme $x_0+\\operatorname{Ker}u$."
      precisions: Retour sur les systèmes linéaires, les équations différentielles linéaires d’ordres 1 et 2, les suites arithmético-géométriques.
      cours:
      - "ma-14:9"
      ex:
      - ma-14-68
      - ma-14-40
      themes:
      - systemes-lineaires
      - applications-lineaires
      note: Le cours expose cette notion dans sa section sur les sous-espaces affines, plus générale que le programme de PCSI.
  - intitule: C - Applications linéaires · f) Formes linéaires et hyperplans en dimension finie
    points:
    - contenu: Forme linéaire.
      cours:
      - "ma-14:8"
      ex:
      - ma-14-65
      themes:
      - dualite
      - espaces-vectoriels
    - contenu: Hyperplan.
      precisions: Un hyperplan est le noyau d’une forme linéaire non nulle. Équations d’un hyperplan dans une base en dimension finie.
      cours:
      - "ma-14:8"
      - "ma-15:5"
      ex:
      - ma-14-64
      - ma-14-65
      - ma-15-44
      themes:
      - dualite
      - espaces-vectoriels
    - contenu: Si $H$ est un hyperplan de $E$ et $D$ une droite non contenue dans $H$, alors $E=H\oplus D$.
      cours:
      - "ma-14:8"
      ex:
      - ma-14-64
      - ma-14-65
      themes:
      - dualite
      - espaces-vectoriels
- intitule: Matrices et déterminants
  periode: Deuxième semestre
  objectif: Les objectifs de cette section sont de présenter les liens entre applications linéaires et matrices, de manière à exploiter les changements de registres (géométrique, numérique, formel), d’étudier
    l’effet d’un changement de bases sur la représentation matricielle d’une application linéaire et d’un vecteur, d’introduire la notion de déterminant d’une famille de vecteurs, en motivant sa construction
    par la géométrie, et d’établir les principales propriétés des déterminants des endomorphismes et des matrices carrées, en indiquant quelques méthodes simples de calcul.
  hors_programme:
  - La démonstration du théorème d’existence et d’unicité de $\det_e$ et la notion générale de forme multilinéaire.
  - La comatrice.
  - La démonstration de la formule du déterminant d’une transposée.
  blocs:
  - intitule: A - Matrices et applications linéaires · a) Matrice d’une application linéaire dans des bases
    points:
    - contenu: Matrice d’un vecteur, d’une famille de vecteurs dans une base, d’une application linéaire dans un couple de bases, d’un endomorphisme dans une base.
      precisions: "Exemple : matrice d’une rotation vectorielle du plan, d’une homothétie."
      cours:
      - "ma-16:4"
      ex:
      - ma-16-18
      - ma-16-19
      - ma-16-30
      - ma-16-24
      themes:
      - matrices
      - applications-lineaires
    - contenu: "Isomorphisme de $\\mathcal{L}(E,F)$ sur $\\mathcal{M}_{n,p}(\\mathbb{K})$ induit par le choix d’un couple de bases."
      cours:
      - "ma-16:4"
      themes:
      - matrices
      - applications-lineaires
    - contenu: Coordonnées de l’image d’un vecteur par une application linéaire.
      cours:
      - "ma-16:4"
      ex:
      - ma-16-18
      - ma-16-20
      themes:
      - matrices
      - applications-lineaires
    - contenu: Matrice d’une composée d’applications linéaires.
      cours:
      - "ma-16:4"
      ex:
      - ma-16-18
      - ma-16-26
      themes:
      - matrices
      - applications-lineaires
    - contenu: Lien entre matrices inversibles et isomorphismes.
      precisions: Cas particulier des endomorphismes. Matrice de la réciproque d’un isomorphisme.
      cours:
      - "ma-16:4"
      ex:
      - ma-16-20
      - ma-16-22
      - ma-16-23
      - ma-16-24
      - ma-16-26
      themes:
      - matrices
      - applications-lineaires
  - intitule: A - Matrices et applications linéaires · b) Application linéaire canoniquement associée à une matrice, rang d’une matrice
    points:
    - contenu: Application linéaire canoniquement associée à une matrice.
      precisions: "On identifie ici $\\mathcal{M}_{n,1}(\\mathbb{K})$ et $\\mathbb{K}^n$."
      cours:
      - "ma-16:4"
      ex:
      - ma-16-21
      - ma-16-53
      themes:
      - matrices
      - applications-lineaires
    - contenu: Noyau, image et rang d’une matrice.
      precisions: Les colonnes engendrent l’image, les lignes donnent un système d’équations du noyau.
      cours:
      - "ma-16:4"
      - "ma-16:6"
      ex:
      - ma-16-24
      - ma-16-46
      - ma-16-50
      - ma-16-51
      - ma-16-53
      themes:
      - matrices
      - applications-lineaires
    - contenu: "Une matrice de $\\mathcal{M}_n(\\mathbb{K})$ est inversible si et seulement si son noyau est réduit au sous-espace nul, ou si et seulement si ses colonnes engendrent l’espace $\\mathbb{K}^n$\
        \ ou si et seulement si son rang est $n$."
      precisions: Retour sur la condition d’inversibilité d’une matrice triangulaire. Lien entre les diverses notions de rang.
      cours:
      - "ma-16:4"
      ex:
      - ma-16-10
      - ma-16-48
      - ma-16-47
      - ma-16-52
      - ma-16-58
      themes:
      - matrices
      - applications-lineaires
    - contenu: Toute matrice carrée inversible à gauche ou à droite est inversible.
      cours:
      - "ma-16:4"
      ex:
      - ma-16-10
      - ma-16-21
      themes:
      - matrices
      - applications-lineaires
    - contenu: Les opérations élémentaires sur les colonnes (resp. lignes) conservent l’image (resp. le noyau). Les opérations élémentaires conservent le rang.
      precisions: "Application : calcul du rang."
      cours:
      - "ma-16:6"
      ex:
      - ma-16-46
      - ma-16-47
      - ma-16-50
      - ma-16-51
      themes:
      - matrices
      - systemes-lineaires
      - applications-lineaires
    - contenu: Invariance du rang par transposition.
      precisions: Ce résultat est admis.
      cours:
      - "ma-16:5"
      themes:
      - matrices
      - applications-lineaires
  - intitule: A - Matrices et applications linéaires · c) Changements de bases
    points:
    - contenu: Matrice de passage d’une base à une autre. Inversibilité et inverse d’une matrice de passage.
      cours:
      - "ma-16:5"
      ex:
      - ma-16-30
      - ma-16-31
      themes:
      - matrices
    - contenu: Effet d’un changement de base sur la matrice d’un vecteur.
      cours:
      - "ma-16:5"
      ex:
      - ma-16-30
      themes:
      - matrices
    - contenu: Effet d’un changement du couple de bases sur la matrice d’une application linéaire.
      cours:
      - "ma-16:5"
      ex:
      - ma-16-30
      themes:
      - matrices
    - contenu: Effet d’un changement de base sur la matrice d’un endomorphisme.
      precisions: Exemples de recherche d’une base dans laquelle la matrice d’un endomorphisme donné est simple.
      cours:
      - "ma-16:5"
      ex:
      - ma-16-31
      - ma-16-33
      - ma-16-32
      - ma-16-34
      - ma-16-38
      - ma-16-39
      themes:
      - matrices
      - similitude
    - contenu: Matrices semblables.
      precisions: Exemples de recherche d’une matrice simple semblable à une matrice donnée.
      cours:
      - "ma-16:5"
      ex:
      - ma-16-35
      - ma-16-28
      - ma-17-61
      themes:
      - similitude
  - intitule: A - Matrices et applications linéaires · d) Systèmes linéaires
    points:
    - contenu: Interprétation de l’ensemble des solutions d’un système homogène comme noyau d’une matrice. Rang d’un tel système, dimension de l’espace des solutions.
      cours:
      - "ma-16:6"
      - "ma-15:5"
      ex:
      - ma-15-03
      - ma-15-44
      - ma-14-10
      themes:
      - systemes-lineaires
      - applications-lineaires
    - contenu: Le système $AX=B$ est compatible si et seulement si $B$ appartient à l’image de $A$.
      cours:
      - "ma-16:6"
      ex:
      - ma-03-40
      - ma-03-41
      themes:
      - systemes-lineaires
    - contenu: Si $A$ est carrée et inversible, le système $AX=B$ possède une unique solution.
      precisions: Dans ce cas, le système est dit de Cramer.
      cours:
      - "ma-16:6"
      ex:
      - ma-16-49
      - ma-16-20
      - ma-16-65
      themes:
      - systemes-lineaires
  - intitule: B - Déterminants · a) Déterminant d’une famille de vecteurs dans une base
    points:
    - contenu: "Si $E$ est un $\\mathbb{K}$-espace vectoriel de dimension $n$ et si $e$ est une base de $E$, il existe une unique application $\\det_e : E^n\\to\\mathbb{K}$ linéaire par rapport à chaque\
        \ variable, alternée, et vérifiant $\\det_e(e)=1$. Si $f : E^n\\to\\mathbb{K}$ est linéaire par rapport à chaque variable, alternée, alors elle est un multiple de $\\det_e$."
      precisions: La démonstration de ce théorème et la notion générale de forme multilinéaire sont hors programme.
      demo: hors programme
      cours:
      - "ma-17:3"
      themes:
      - determinants
    - contenu: En dimension 2 et 3, expression du déterminant dans une base en fonction des coordonnées.
      precisions: "Dans $\\mathbb{R}^2$ (resp. $\\mathbb{R}^3$), interprétation du déterminant dans la base canonique comme aire orientée (resp. volume orienté) d’un parallélogramme (resp. parallélépipède)."
      cours:
      - "ma-17:3"
      ex:
      - ma-17-18
      - ma-17-23
      themes:
      - determinants
    - contenu: "Comparaison, si $e$ et $e'$ sont deux bases, de $\\det_e$ et $\\det_{e'}$."
      cours:
      - "ma-17:3"
      themes:
      - determinants
    - contenu: La famille $(x_1,\dots,x_n)$ est une base si et seulement si $\det_e(x_1,\dots,x_n)\neq0$.
      cours:
      - "ma-17:3"
      ex:
      - ma-17-18
      - ma-17-20
      - ma-17-24
      themes:
      - determinants
  - intitule: B - Déterminants · b) Déterminant d’un endomorphisme
