      ex:
      - ma-14-01
      - ma-14-02
      themes:
      - espaces-vectoriels
    - contenu: Espace vectoriel des fonctions d’un ensemble dans un espace vectoriel.
      precisions: "Espace $\\mathbb{K}^\\Omega$, cas particulier $\\mathbb{K}^\\mathbb{N}$."
      cours:
      - "ma-14:2"
      themes:
      - espaces-vectoriels
    - contenu: Combinaison linéaire d’une famille finie de vecteurs.
      cours:
      - "ma-14:2"
      ex:
      - ma-14-03
      - ma-14-04
      themes:
      - espaces-vectoriels
  - intitule: A - Espaces vectoriels · b) Sous-espaces vectoriels
    points:
