- intitule: "Fonctions d’une variable réelle : limites et continuité, dérivabilité"
  periode: Premier semestre
  objectif: "Dans cette section, on démontre les théorèmes de base relatifs aux fonctions réelles de variable réelle, en visualisant une fonction par son graphe à l’aide de nombreuses figures. Les fonctions\
    \ sont définies sur un intervalle $I$ de $\\mathbb{R}$ non vide et non réduit à un point et, sauf dans les paragraphes A-d) et B-f), sont à valeurs réelles ; une propriété est vraie au voisinage de\
    \ $a$ si elle est vraie sur l’intersection de $I$ avec un intervalle ouvert centré en $a$ (si $a$ est réel), avec $]A,+\\infty[$ (si $a=+\\infty$), avec $]-\\infty,A[$ (si $a=-\\infty$). L’étude des\
    \ suites récurrentes $u_{n+1}=f(u_n)$ est l’occasion d’introduire la notion de vitesse de convergence (convergence lente, géométrique, quadratique, nombre d’itérations nécessaires pour une précision\
    \ donnée, méthode de Newton) ; l’étude de la dérivabilité donne un prétexte pour présenter la notion de discrétisation, à travers la méthode d’Euler. Le paragraphe A-a) consiste largement en des adaptations\
    \ au cas continu de notions déjà étudiées pour les suites, et le professeur a la liberté d’admettre certains résultats ; pour la pratique du calcul de limites, on se borne à ce stade à des calculs très\
    \ simples, en attendant les développements limités."
  hors_programme:
  - La démonstration du théorème des bornes atteintes.
  - L’inégalité de Jensen et les développements généraux sur les barycentres.
  blocs:
  - intitule: A - Limites et continuité · a) Limite d’une fonction en un point
    points:
    - contenu: Étant donné $a$ fini ou infini appartenant à $I$ ou extrémité de $I$, limite finie ou infinie d’une fonction en $a$.
      precisions: Les définitions sont énoncées avec des inégalités larges.
      cours:
      - "ma-08:2"
      ex:
      - ma-08-01
      - ma-08-04
      - ma-08-07
      - ma-08-10
      themes:
      - continuite
    - contenu: Unicité de la limite.
      precisions: "Notations $f(x)\\underset{x\\to a}{\\longrightarrow}\\ell$, $\\lim_{x\\to a}f(x)$."
      cours:
      - "ma-08:2"
      themes:
      - continuite
    - contenu: "Si $f$ est définie en $a$ et possède une limite en $a$, alors $\\lim_{x\\to a}f(x)=f(a)$."
      cours:
      - "ma-08:2"
      themes:
      - continuite
    - contenu: Si $f$ possède une limite finie en $a$, alors $f$ est bornée au voisinage de $a$.
      cours:
      - "ma-08:2"
      themes:
      - continuite
    - contenu: Limite à droite, limite à gauche.
      precisions: "Notations $\\lim_{x\\to a,\\,x>a}f(x)$ ou $\\lim_{x\\to a^+}f(x)$."
      cours:
      - "ma-08:2"
      ex:
      - ma-08-03
      - ma-08-12
      themes:
      - continuite
    - contenu: Caractérisation séquentielle de la limite (finie ou infinie).
      cours:
      - "ma-08:2"
      ex:
      - ma-08-05
      - ma-08-09
      themes:
      - continuite
    - contenu: "Opérations sur les limites : combinaison linéaire, produit, quotient, composition."
      cours:
      - "ma-08:2"
      ex:
      - ma-08-01
      - ma-08-02
      - ma-08-06
      themes:
      - continuite
    - contenu: Passage à la limite d’une inégalité large.
      cours:
      - "ma-08:2"
      ex:
      - ma-08-17
      themes:
      - continuite
    - contenu: Existence d’une limite par encadrement (limite finie), par minoration (limite $+\infty$), par majoration (limite $-\infty$).
      cours:
      - "ma-08:2"
      ex:
      - ma-08-03
      themes:
      - continuite
    - contenu: Théorème de la limite monotone.
      cours:
      - "ma-08:2"
      ex:
      - ma-08-08
      - ma-08-20
      - ma-08-12
      themes:
      - continuite
  - intitule: A - Limites et continuité · b) Continuité en un point
    points:
    - contenu: Continuité, prolongement par continuité en un point.
      precisions: "La continuité de $f$ au point $a$ de $I$ est définie par la relation $f(x)\\underset{x\\to a}{\\longrightarrow}f(a)$."
      cours:
