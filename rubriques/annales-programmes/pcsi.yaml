    - contenu: Variance d’une variable de Bernoulli, d’une variable binomiale.
      cours:
      - "ma-21:7"
      ex:
      - ma-21-95
      - ma-21-88
      themes:
      - esperance-variance
      - loi-binomiale
    - contenu: Covariance de deux variables aléatoires.
      precisions: Deux variables aléatoires dont la covariance est nulle sont dites décorrélées.
