      - "ma-04:3"
      themes:
      - geometrie-complexe
- intitule: Techniques fondamentales de calcul différentiel et intégral
  periode: Premier semestre
  objectif: "Le point de vue adopté dans cette section est pratique : il s’agit, en prenant appui sur les acquis du lycée, de mettre en œuvre les techniques de base de l’analyse, la mise en place rigoureuse\
    \ des notions abordées faisant l’objet de sections ultérieures. Les objectifs de formation sont l’introduction de fonctions pour établir des inégalités et résoudre des problèmes d’optimisation, la manipulation\
    \ des fonctions classiques dont le corpus est étendu, le calcul de dérivées et de primitives, la mise en pratique, sur des exemples simples, de l’intégration par parties et du changement de variable,\
    \ et l’application des deux points précédents aux équations différentielles. Le cours sur les équations différentielles est illustré par des exemples issus des autres disciplines scientifiques."
  hors_programme:
  - La fonction tangente hyperbolique et les fonctions hyperboliques réciproques.
  - La démonstration de l’existence et de l’unicité de la solution d’un problème de Cauchy pour les équations différentielles linéaires du second ordre à coefficients constants.
  blocs:
  - intitule: A - Fonctions d’une variable réelle à valeurs réelles ou complexes · a) Généralités sur les fonctions
    points:
    - contenu: Ensemble de définition.
      cours:
      - "ma-05:2"
      ex:
      - ma-05-01
      - ma-05-04
      - ma-05-10
    - contenu: Représentation graphique d’une fonction $f$ à valeurs réelles.
      precisions: Les étudiants doivent savoir déduire de la représentation graphique de $f$ celles de fonctions obtenues par des transformations simples, comme $x\mapsto f(x+a)$ ou $x\mapsto f(ax)$.
      cours:
      - "ma-05:2"
      ex:
      - ma-05-04
    - contenu: Parité, imparité, périodicité.
      precisions: Interprétation géométrique de ces propriétés. Utilisation pour la réduction du domaine d’étude.
      cours:
      - "ma-05:2"
      ex:
      - ma-05-03
      - ma-05-02
      - ma-05-05
      - ma-05-06
      - ma-05-08
      - ma-05-09
    - contenu: Somme, produit, composée.
      cours:
      - "ma-05:2"
      ex:
      - ma-05-02
    - contenu: Monotonie (large et stricte).
      cours:
      - "ma-05:2"
      ex:
      - ma-05-07
    - contenu: Fonctions majorées, minorées, bornées.
      precisions: "Traduction géométrique de ces propriétés. La fonction $f$ est bornée si et seulement si $|f|$ est majorée."
      cours:
      - "ma-05:2"
      ex:
      - ma-01-08
  - intitule: A - Fonctions d’une variable réelle à valeurs réelles ou complexes · b) Dérivation
    points:
    - contenu: Dérivée d’une fonction.
      precisions: "Notations $f'(x)$, $\\dfrac{\\mathrm{d}}{\\mathrm{d}x}\\big(f(x)\\big)$."
      cours:
      - "ma-05:3"
      ex:
      - ma-05-10
      - ma-05-12
      - ma-05-13
      themes:
      - derivabilite
    - contenu: Dérivée d’une combinaison linéaire, d’un produit, d’un quotient, d’une composée.
      precisions: Ces résultats sont rappelés, avec la définition de la dérivée et l’équation de la tangente ; ils ne sont pas démontrés à ce stade. Exemples simples de calculs de dérivées partielles.
      cours:
      - "ma-05:3"
      - "ma-09:2"
      - "ma-22:3"
      ex:
      - ma-05-10
      - ma-05-12
      - ma-22-05
      themes:
      - derivabilite
      note: Formules rappelées au chapitre 5 et démontrées au chapitre 9 (section 2) ; les exemples de dérivées partielles relèvent du chapitre 22 (section 3).
    - contenu: Caractérisation des fonctions constantes, (dé)croissantes, strictement (dé)croissantes, parmi les fonctions dérivables sur un intervalle.
      precisions: Résultats admis à ce stade.
      cours:
      - "ma-05:3"
      - "ma-09:3"
      themes:
      - derivabilite
    - contenu: Tableau de variations. Étude pratique d’une fonction. Tracé du graphe.
      precisions: "Application : recherche d’extremums, démonstration d’inégalités."
      cours:
      - "ma-05:3"
      ex:
      - ma-05-15
      - ma-05-16
      - ma-05-17
      - ma-05-18
      - ma-05-20
      - ma-05-21
      themes:
      - inegalites
      - derivabilite
    - contenu: Représentation graphique et dérivée d’une fonction réciproque.
      precisions: La formule donnant la dérivée est admise, mais on en donne l’interprétation géométrique.
      cours:
      - "ma-05:3"
      - "ma-09:2"
      ex:
      - ma-05-22
      - ma-05-23
      - ma-09-10
      themes:
      - fonctions-reciproques
    - contenu: "Fonction de classe $\\mathcal{C}^1$. Dérivées d’ordre supérieur."
      cours:
      - "ma-05:3"
      - "ma-09:4"
      ex:
      - ma-05-24
      - ma-09-29
      - ma-05-25
      - ma-05-53
      themes:
      - derivabilite
  - intitule: A - Fonctions d’une variable réelle à valeurs réelles ou complexes · c) Fonctions usuelles
    points:
    - contenu: Fonctions exponentielle, logarithme népérien, puissances.
      precisions: "Dérivée, variations, représentation graphique. Les fonctions puissances sont définies sur $\\mathbb{R}_+^*$ et prolongées en 0 le cas échéant. Seules les fonctions puissances entières\
        \ sont en outre définies sur $\\mathbb{R}_-^*$. Logarithme décimal, logarithme en base 2."
      cours:
      - "ma-05:4"
      - "ma-05:5"
      ex:
      - ma-05-26
      - ma-05-27
      - ma-05-28
      - ma-05-36
      themes:
      - fonctions-exp-ln
    - contenu: "Relations $(xy)^\\alpha=x^\\alpha y^\\alpha$, $x^{\\alpha+\\beta}=x^\\alpha x^\\beta$, $(x^\\alpha)^\\beta=x^{\\alpha\\beta}$."
      cours:
      - "ma-05:5"
      ex:
      - ma-05-34
      themes:
      - fonctions-exp-ln
    - contenu: Croissances comparées des fonctions logarithme, puissances et exponentielle.
      cours:
      - "ma-05:5"
      ex:
      - ma-05-35
      - ma-05-38
      themes:
      - fonctions-exp-ln
    - contenu: Inégalités $\exp(x)\geqslant1+x$, $\ln(1+x)\leqslant x$.
      cours:
      - "ma-05:4"
      ex:
      - ma-05-32
      - ma-05-37
      themes:
      - inegalites
      - fonctions-exp-ln
    - contenu: Fonctions circulaires réciproques Arcsin, Arccos, Arctan.
      precisions: Dérivée, variations, représentation graphique.
      cours:
      - "ma-05:6"
      ex:
      - ma-05-39
      - ma-05-40
      - ma-05-41
      - ma-05-43
      - ma-05-44
      - ma-05-46
      themes:
      - fonctions-circulaires-reciproques
    - contenu: Fonctions hyperboliques sh, ch.
      precisions: "Dérivée, variations, représentation graphique. La fonction tangente hyperbolique et les fonctions hyperboliques réciproques sont hors programme. La seule formule exigible est $\\operatorname{ch}^2(x)-\\\
        operatorname{sh}^2(x)=1$."
      cours:
      - "ma-05:7"
      ex:
      - ma-05-47
      - ma-05-49
      themes:
      - fonctions-hyperboliques
      note: "Le cours d'ATLAS (MPSI) présente aussi th, hors programme en PCSI."
  - intitule: A - Fonctions d’une variable réelle à valeurs réelles ou complexes · d) Dérivation d’une fonction complexe d’une variable réelle
    points:
    - contenu: Dérivée d’une fonction à valeurs complexes.
      precisions: La dérivée est définie par les parties réelle et imaginaire.
      cours:
      - "ma-05:8"
      - "ma-09:5"
      ex:
      - ma-05-54
      - ma-09-33
      themes:
      - derivabilite
    - contenu: Dérivée d’une combinaison linéaire, d’un produit, d’un quotient.
      precisions: Brève extension des résultats sur les fonctions à valeurs réelles.
      cours:
      - "ma-05:8"
      themes:
      - derivabilite
    - contenu: Dérivée de $\exp(\varphi)$ où $\varphi$ est une fonction dérivable à valeurs complexes.
      cours:
      - "ma-05:8"
      ex:
      - ma-05-54
      - ma-05-53
      themes:
      - derivabilite
      - exponentielle-complexe
  - intitule: B - Primitives et équations différentielles linéaires · a) Calcul de primitives
    points:
    - contenu: Primitives d’une fonction définie sur un intervalle à valeurs complexes.
      precisions: Description de l’ensemble des primitives d’une fonction sur un intervalle connaissant l’une d’entre elles.
      cours:
      - "ma-06:2"
      ex:
      - ma-06-01
      - ma-06-03
      themes:
      - integration-segment
    - contenu: Lien entre intégrales et primitives.
      precisions: "On rappelle sans démonstration que, pour une fonction continue $f$, $x\\mapsto\\int_{x_0}^{x}f(t)\\,\\mathrm{d}t$ a pour dérivée $f$. On pourra noter $\\int^x f(t)\\,\\mathrm{d}t$ une\
        \ primitive générique de $f$."
      cours:
      - "ma-06:2"
      - "ma-18:4"
      ex:
      - ma-06-04
      - ma-06-07
      - ma-06-05
      - ma-06-06
      themes:
      - integration-segment
    - contenu: Calcul des primitives, application au calcul d’intégrales.
      precisions: "Primitives de $x\\mapsto\\mathrm{e}^{\\lambda x}$ pour $\\lambda\\in\\mathbb{C}$, application aux primitives de $x\\mapsto\\mathrm{e}^{ax}\\cos(bx)$ et $x\\mapsto\\mathrm{e}^{ax}\\sin(bx)$."
      cours:
      - "ma-06:3"
      ex:
      - ma-06-10
      - ma-06-14
      themes:
      - integration-segment
    - contenu: "Primitives des fonctions exponentielle, logarithme, puissances, trigonométriques et hyperboliques, et des fonctions $x\\mapsto\\dfrac{1}{1+x^2}$, $x\\mapsto\\dfrac{1}{\\sqrt{1-x^2}}$."
      precisions: "Les étudiants doivent savoir calculer les primitives de fonctions du type $x\\mapsto\\dfrac{1}{ax^2+bx+c}$ et reconnaître les dérivées de fonctions composées."
      cours:
      - "ma-06:3"
      ex:
      - ma-06-01
      - ma-06-02
      - ma-06-11
      - ma-06-13
      - ma-06-12
      themes:
      - integration-segment
    - contenu: Intégration par parties, changement de variable.
      precisions: Pour les applications pratiques, on ne demande pas de rappeler les hypothèses de régularité.
      cours:
      - "ma-06:3"
      ex:
      - ma-06-15
      - ma-06-16
      - ma-06-18
      - ma-06-19
      - ma-06-23
      - ma-06-24
      themes:
      - integration-segment
  - intitule: B - Primitives et équations différentielles linéaires · b) Équations différentielles linéaires du premier ordre
    points:
    - contenu: "Équation différentielle linéaire du premier ordre $y'+a(x)y=b(x)$ où $a$ et $b$ sont des fonctions réelles ou complexes définies et continues sur un intervalle $I$ de $\\mathbb{R}$."
      precisions: Équation homogène associée. Cas particulier où la fonction $a$ est constante.
      cours:
      - "ma-06:4"
      ex:
      - ma-06-27
      - ma-06-28
      - ma-06-29
      themes:
      - edl-ordre1
    - contenu: Ensemble des solutions de l’équation homogène.
      cours:
      - "ma-06:4"
      themes:
      - edl-ordre1
    - contenu: Principe de superposition.
      cours:
      - "ma-06:4"
      themes:
      - edl-ordre1
    - contenu: Description de l’ensemble des solutions de l’équation à partir d’une solution particulière et des solutions de l’équation homogène associée.
      cours:
      - "ma-06:4"
      ex:
      - ma-06-27
      - ma-06-30
      themes:
      - edl-ordre1
    - contenu: Méthode de la variation de la constante.
      cours:
      - "ma-06:4"
      ex:
      - ma-06-28
      - ma-06-29
      themes:
      - edl-ordre1
    - contenu: Existence et unicité de la solution d’un problème de Cauchy.
      cours:
      - "ma-06:4"
      ex:
      - ma-06-27
      - ma-06-31
      - ma-06-32
      themes:
      - edl-ordre1
  - intitule: B - Primitives et équations différentielles linéaires · c) Équations différentielles linéaires du second ordre à coefficients constants
    points:
    - contenu: "Équation différentielle linéaire du second ordre à coefficients constants $y''+ay'+by=f(x)$ où $a$ et $b$ sont des scalaires et $f$ est une fonction réelle ou complexe, définie et continue\
        \ sur un intervalle."
      precisions: Équation homogène associée.
      cours:
      - "ma-06:5"
      ex:
      - ma-06-37
      - ma-06-38
      themes:
      - edl-ordre2
    - contenu: Ensemble des solutions de l’équation homogène.
      precisions: Si $a$ et $b$ sont réels, description des solutions réelles.
      cours:
      - "ma-06:5"
      ex:
      - ma-06-37
      - ma-06-42
      themes:
      - edl-ordre2
    - contenu: Principe de superposition.
      cours:
      - "ma-06:5"
      ex:
      - ma-06-38
      themes:
      - edl-ordre2
    - contenu: Description de l’ensemble des solutions de l’équation à partir d’une solution particulière et des solutions de l’équation homogène associée.
      precisions: "Les étudiants doivent savoir déterminer une solution particulière dans le cas d’un second membre polynôme, de la forme $x\\mapsto A\\mathrm{e}^{\\lambda x}$ avec $(A,\\lambda)\\in\\mathbb{C}^2$,\
        \ $x\\mapsto B\\cos(\\omega x)$ et $x\\mapsto B\\sin(\\omega x)$ avec $(B,\\omega)\\in\\mathbb{R}^2$."
      cours:
      - "ma-06:5"
      ex:
      - ma-06-38
      - ma-06-41
      themes:
      - edl-ordre2
    - contenu: Existence et unicité de la solution d’un problème de Cauchy.
      precisions: La démonstration de ce résultat est hors programme.
      demo: hors programme
      cours:
      - "ma-06:5"
      ex:
      - ma-06-40
      themes:
      - edl-ordre2
- intitule: Nombres réels et suites numériques
  periode: Premier semestre
  objectif: L’objectif de cette section est de donner une base solide à l’étude des suites réelles, notamment les suites définies par une relation de récurrence. Dans l’étude des suites, on distingue nettement
    les aspects qualitatifs (monotonie, convergence, divergence) des aspects quantitatifs (majoration, encadrement, vitesse de convergence ou de divergence).
  hors_programme:
  - Tout développement théorique sur les suites extraites.
  - Le théorème de Bolzano-Weierstrass.
  blocs:
  - intitule: a) Propriété de la borne supérieure
    points:
    - contenu: "Borne supérieure (resp. inférieure) d’une partie de $\\mathbb{R}$."
      precisions: Notations $\sup X$, $\inf X$.
      cours:
      - "ma-07:2"
      ex:
      - ma-07-01
      - ma-07-03
      - ma-07-05
    - contenu: "Toute partie non vide et majorée (resp. minorée) de $\\mathbb{R}$ admet une borne supérieure (resp. inférieure)."
      precisions: On convient que $\sup X=+\infty$ si $X$ est non majorée.
      cours:
      - "ma-07:2"
      ex:
      - ma-07-45
      - ma-07-46
      note: "L'exercice 7.45 (vrai-faux) est retenu pour ses questions 1 et 2 ; sa question 10 relève du théorème de Bolzano-Weierstrass, hors programme de PCSI."
    - contenu: "Une partie $X$ de $\\mathbb{R}$ est un intervalle si et seulement si pour tous $a,b\\in X$ tels que $a\\leqslant b$, $[a,b]\\subset X$."
      cours:
      - "ma-07:2"
  - intitule: b) Généralités sur les suites réelles
    points:
    - contenu: Suite majorée, minorée, bornée. Suite stationnaire, monotone, strictement monotone.
      precisions: "Une suite $(u_n)_{n\\in\\mathbb{N}}$ est bornée si et seulement si $(|u_n|)_{n\\in\\mathbb{N}}$ est majorée."
      cours:
      - "ma-07:3"
      ex:
      - ma-07-17
      themes:
      - suites
    - contenu: "Mode de définition d’une suite réelle : explicite, implicite, par récurrence."
      cours:
      - "ma-07:3"
      ex:
      - ma-07-42
      - ma-07-43
      - ma-07-44
      themes:
      - suites
  - intitule: c) Limite d’une suite réelle
    points:
    - contenu: Limite finie ou infinie d’une suite.
      precisions: Les définitions sont énoncées avec des inégalités larges.
      cours:
      - "ma-07:4"
      ex:
      - ma-07-08
      - ma-07-09
      - ma-07-15
      themes:
      - suites
    - contenu: Unicité de la limite.
      precisions: Notations $u_n\longrightarrow\ell$, $\lim u_n$.
      cours:
      - "ma-07:4"
      themes:
      - suites
    - contenu: Suite convergente, divergente.
      cours:
      - "ma-07:4"
      ex:
      - ma-07-09
      - ma-07-10
      themes:
      - suites
    - contenu: Toute suite convergente est bornée.
      cours:
      - "ma-07:4"
      themes:
      - suites
    - contenu: "Opérations sur les limites : combinaison linéaire, produit, quotient."
      precisions: Produit d’une suite bornée et d’une suite de limite nulle.
      cours:
      - "ma-07:4"
      ex:
      - ma-07-08
      - ma-07-10
      - ma-07-11
      - ma-07-13
      themes:
      - suites
    - contenu: Passage à la limite d’une inégalité large.
      cours:
      - "ma-07:4"
      ex:
      - ma-07-45
      themes:
      - suites
      note: Le vrai-faux 7.45 est retenu pour ses questions 1, 2 et 5 ; sa question 10 relève du théorème de Bolzano-Weierstrass, hors programme de PCSI.
    - contenu: "Si $(u_n)_{n\\in\\mathbb{N}}$ converge vers $\\ell>0$, alors $u_n>0$ à partir d’un certain rang."
      cours:
      - "ma-07:4"
      themes:
      - suites
    - contenu: Existence d’une limite par encadrement (limite finie), par minoration (limite $+\infty$), par majoration (limite $-\infty$).
      precisions: "Utilisation d’une majoration de la forme $|u_n-\\ell|\\leqslant v_n$, où $(v_n)$ converge vers 0."
      cours:
      - "ma-07:4"
      ex:
      - ma-07-12
      - ma-07-16
      - ma-07-47
      themes:
      - suites
  - intitule: d) Suites monotones
    points:
    - contenu: Théorème de la limite monotone.
      cours:
      - "ma-07:5"
      ex:
      - ma-07-18
      - ma-07-27
      themes:
      - suites
    - contenu: Théorème des suites adjacentes.
      cours:
      - "ma-07:5"
      ex:
