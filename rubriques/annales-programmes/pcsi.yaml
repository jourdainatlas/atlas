    - contenu: "Polynômes irréductibles de $\\mathbb{C}[X]$. Théorème de décomposition en facteurs irréductibles dans $\\mathbb{C}[X]$."
      precisions: "Caractérisation de la divisibilité dans $\\mathbb{C}[X]$ à l’aide des racines et des multiplicités. Factorisation de $X^n-1$ dans $\\mathbb{C}[X]$."
      cours:
