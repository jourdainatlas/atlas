- intitule: Intégration
  periode: Deuxième semestre
  objectif: Cette section a pour objectif d’établir les principales propriétés de l’intégrale d’une fonction continue sur un segment de manière à achever la justification des propriétés présentées dans
    la section « Techniques fondamentales de calcul en analyse » ; elle offre l’occasion de revenir sur les techniques de calcul intégral, mais aussi de traiter des exercices d’esprit plus théorique. Les
    méthodes de calcul approché d’intégrales donnent l’occasion de revenir sur la problématique de l’approximation, en comparant par exemple les performances de la méthode des rectangles et de celle des
    trapèzes. La construction de l’intégrale n’est pas un attendu du programme, mais les étudiants doivent avoir été sensibilisés à cette problématique.
  hors_programme:
  - L’égalité de Taylor-Lagrange.
  blocs:
  - intitule: a) Fonctions en escalier
    points:
    - contenu: Subdivision d’un segment, pas d’une subdivision.
      cours:
      - "ma-18:2"
      ex:
      - ma-18-01
      themes:
      - integration-segment
      note: "La question 2 de l'exercice 18.1 parle de fonction continue par morceaux, notion hors programme de PCSI ; les autres questions (fonctions en escalier, partie entière, minimum de deux fonctions\
        \ continues) sont dans le programme."
    - contenu: Fonction en escalier.
      precisions: "Les fonctions sont définies sur un segment et à valeurs dans $\\mathbb{R}$."
      cours:
      - "ma-18:2"
      ex:
      - ma-18-01
      themes:
      - integration-segment
    - contenu: Intégrale d’une fonction en escalier.
      cours:
      - "ma-18:3"
      ex:
      - ma-18-01
      themes:
      - integration-segment
  - intitule: b) Intégrale d’une fonction continue sur un segment
    points:
    - contenu: "Intégrale d’une fonction continue sur un segment à valeurs dans $\\mathbb{R}$."
      precisions: "Interprétation géométrique de l’intégrale. Notations $\\int_{[a,b]}f$, $\\int_a^b f$, $\\int_a^b f(t)\\,\\mathrm{d}t$."
      cours:
      - "ma-18:3"
      ex:
      - ma-18-01
      - ma-18-27
      themes:
      - integration-segment
      note: "Le cours de MPSI construit l'intégrale des fonctions continues par morceaux, cadre plus large que celui de PCSI (fonctions continues). La question 2 de l'exercice 18.1 emploie elle aussi les\
        \ fonctions continues par morceaux."
    - contenu: Linéarité, positivité et croissance de l’intégrale.
      cours:
      - "ma-18:3"
      ex:
      - ma-18-04
      - ma-18-03
      - ma-18-10
      - ma-18-11
      - ma-18-14
      themes:
      - integration-segment
    - contenu: "Inégalité triangulaire intégrale : $\\left|\\int_{[a,b]}f\\right|\\leqslant\\int_{[a,b]}|f|$."
      cours:
      - "ma-18:3"
      ex:
      - ma-18-05
      - ma-18-09
      themes:
      - integration-segment
    - contenu: Relation de Chasles.
      precisions: "Extension de la notation $\\int_a^b f(t)\\,\\mathrm{d}t$ au cas où $b\\leqslant a$. Propriétés correspondantes."
      cours:
      - "ma-18:3"
      ex:
      - ma-18-01
      - ma-18-03
      themes:
      - integration-segment
    - contenu: "Si $f$ est continue, à valeurs dans $\\mathbb{R}^+$ et si $\\int_{[a,b]}f=0$, alors $f=0$."
      cours:
      - "ma-18:3"
      ex:
      - ma-06-05
      - ma-18-07
      - ma-18-09
      - ma-18-14
      themes:
      - integration-segment
    - contenu: Intégrale d’une fonction paire ou impaire sur un segment centré en 0. Intégrale d’une fonction périodique sur un intervalle de période.
      precisions: Valeur moyenne d’une fonction continue sur un segment.
      cours:
      - "ma-06:3"
      - "ma-18:3"
      ex:
      - ma-18-03
      - ma-06-06
      - ma-18-12
      themes:
      - integration-segment
      note: La parité et la périodicité sont démontrées au chapitre 6 pour les fonctions continues seulement ; la valeur moyenne est au chapitre 18.
  - intitule: c) Sommes de Riemann
    points:
    - contenu: "Pour $f$ continue sur le segment $[a,b]$, $\\dfrac{b-a}{n}\\sum_{k=0}^{n-1}f\\Big(a+k\\dfrac{b-a}{n}\\Big)\\underset{n\\to+\\infty}{\\longrightarrow}\\int_a^b f(t)\\,\\mathrm{d}t$."
      precisions: Interprétation géométrique. La démonstration pourra être proposée dans le cas où $f$ est lipschitzienne.
      cours:
      - "ma-18:6"
      ex:
      - ma-18-38
      - ma-18-39
      - ma-18-43
      - ma-18-42
      themes:
      - sommes-riemann
  - intitule: d) Lien entre intégrale et primitive
    points:
    - contenu: "Dérivation de $x\\mapsto\\int_a^x f(t)\\,\\mathrm{d}t$ pour $f$ continue."
      cours:
      - "ma-18:4"
      ex:
      - ma-06-04
      - ma-18-24
      - ma-18-23
      - ma-18-22
      - ma-18-25
      - ma-18-28
      themes:
      - integration-segment
    - contenu: Toute fonction continue sur un intervalle possède des primitives.
      cours:
      - "ma-18:4"
      ex:
      - ma-18-26
      themes:
      - integration-segment
  - intitule: e) Inégalité de Taylor-Lagrange
    points:
    - contenu: Inégalité de Taylor-Lagrange.
      precisions: La formule de Taylor avec reste intégral n’est pas exigible. L’égalité de Taylor-Lagrange est hors programme. On souligne la différence de nature entre la formule de Taylor-Young (locale)
        et l’inégalité de Taylor-Lagrange (globale).
      cours:
      - "ma-18:5"
      ex:
      - ma-18-33
      - ma-18-42
      - ma-18-36
      themes:
      - formules-taylor
      note: "Le cours de MPSI déduit l'inégalité de la formule avec reste intégral, qui n'est pas exigible en PCSI ; les exercices retenus n'utilisent que l'inégalité."
  - intitule: f) Brève extension au cas des fonctions à valeurs complexes
    points:
    - contenu: "Intégrale d’une fonction continue sur un segment à valeurs dans $\\mathbb{C}$."
      precisions: Définition au moyen des parties réelle et imaginaire.
      cours:
      - "ma-18:3"
      ex:
      - ma-06-14
      - ma-06-52
      themes:
      - integration-segment
    - contenu: Linéarité, majoration du module de l’intégrale.
      cours:
      - "ma-18:3"
      ex:
      - ma-18-09
      themes:
      - integration-segment
    - contenu: Inégalité de Taylor-Lagrange.
      cours:
      - "ma-18:5"
      themes:
      - formules-taylor
- intitule: Dénombrement
  periode: Deuxième semestre
  objectif: "Cette section est introduite essentiellement en vue de son utilisation en probabilités ; rattaché aux mathématiques discrètes, le dénombrement interagit également avec l’algèbre et l’informatique.\
    \ Toute formalisation excessive est exclue : en particulier, parmi les propriétés du paragraphe a), les plus intuitives sont admises sans démonstration, et l’utilisation de bijections dans les problèmes\
    \ de dénombrement n’est pas un attendu du programme."
  hors_programme:
  - Tout fondement théorique des notions d’entier naturel et de cardinal.
  - La formule du crible.
  blocs:
  - intitule: a) Cardinal d’un ensemble fini
    points:
    - contenu: Cardinal d’un ensemble fini.
      precisions: "Notations $|A|$, $\\operatorname{Card}(A)$. Tout fondement théorique des notions d’entier naturel et de cardinal est hors programme."
      cours:
      - "ma-02:5"
      - "ma-21:2"
      themes:
      - denombrement
    - contenu: Cardinal d’une partie d’un ensemble fini, cas d’égalité.
      cours:
      - "ma-02:5"
      - "ma-21:2"
      themes:
      - denombrement
    - contenu: Une application entre deux ensembles finis de même cardinal est bijective si et seulement si elle est injective, si et seulement si elle est surjective.
      cours:
      - "ma-02:5"
      - "ma-21:2"
      themes:
      - denombrement
      note: "Le résultat est démontré au cours (Maths Sup – MPSI, ch. 2, section 5) ; le seul exercice du site qui l'emploie, l'exercice 11.44 (anneaux intègres finis), sort du programme de PCSI."
    - contenu: "Opérations sur les cardinaux : union disjointe ou quelconque, complémentaire, différence, produit cartésien."
      precisions: La formule du crible est hors programme.
      cours:
      - "ma-21:2"
      - "ma-02:5"
      ex:
      - ma-21-04
      - ma-21-01
      - ma-21-06
      - ma-02-25
      themes:
      - denombrement
    - contenu: Cardinal de l’ensemble des applications d’un ensemble fini dans un autre.
      cours:
      - "ma-21:2"
      ex:
      - ma-21-02
      - ma-02-25
      themes:
      - denombrement
    - contenu: Cardinal de l’ensemble des parties d’un ensemble fini.
      cours:
      - "ma-21:2"
      ex:
      - ma-01-39
      - ma-02-25
      - ma-21-05
      - ma-21-10
      - ma-21-11
      themes:
      - denombrement
  - intitule: b) Listes et combinaisons
    points:
    - contenu: Nombre de $p$-listes (ou $p$-uplets) d’éléments distincts d’un ensemble de cardinal $n$, nombre de permutations d’un ensemble de cardinal $n$.
      precisions: Nombre d’applications injectives d’un ensemble de cardinal $p$ dans un ensemble de cardinal $n$.
      cours:
      - "ma-21:2"
      ex:
      - ma-21-01
      - ma-21-02
      - ma-02-25
      - ma-21-03
      themes:
      - denombrement
    - contenu: Nombre de parties à $p$ éléments (ou $p$-combinaisons) d’un ensemble de cardinal $n$.
      precisions: Démonstration combinatoire des formules de Pascal et du binôme.
      cours:
      - "ma-21:2"
      - "ma-03:4"
      ex:
      - ma-21-06
      - ma-21-07
      - ma-03-31
      - ma-03-36
      - ma-21-12
      - ma-21-20
      themes:
      - denombrement
      - coefficients-binomiaux
- intitule: Probabilités
  periode: Deuxième semestre
  objectif: Cette section, qui a vocation à interagir avec l’ensemble du programme, a pour objectif de donner aux étudiants une bonne pratique des variables aléatoires dans le cadre fini. On met en évidence
    qu’une situation probabiliste finie peut être décrite par un $n$-uplet de variables aléatoires, l’univers étant vu comme une source suffisante d’aléa, afin de travailler le plus tôt possible avec des
    événements construits en termes de variables aléatoires ; la construction d’un univers fini susceptible de porter un $n$-uplet de variables aléatoires peut être présentée, mais ne constitue pas un objectif
    du programme. On pourra faire travailler les étudiants sur des marches aléatoires ou des chaînes de Markov en temps fini, des graphes aléatoires, des inégalités de concentration. Le programme de probabilités
    de première année s’achève sur une approche non asymptotique de la loi faible des grands nombres qui justifie l’approche fréquentiste des probabilités.
  hors_programme:
  - La formule du crible.
  - La démonstration du lemme des coalitions.
  blocs:
  - intitule: A - Probabilités sur un univers fini, variables aléatoires et lois · a) Univers, événements, variables aléatoires
    points:
    - contenu: Lien entre vocabulaire ensembliste et vocabulaire des probabilités.
      precisions: On se limite au cas d’un univers fini. Événement élémentaire (singleton), système complet d’événements, événements disjoints (ou incompatibles).
      cours:
      - "ma-21:3"
      themes:
      - probabilites-discretes
    - contenu: Une variable aléatoire $X$ est une application définie sur l’univers $\Omega$ à valeurs dans un ensemble $E$.
      precisions: "Notations $\\{X\\in A\\}$ et $(X\\in A)$."
      cours:
      - "ma-21:5"
      themes:
      - variables-aleatoires
  - intitule: A - Probabilités sur un univers fini, variables aléatoires et lois · b) Espaces probabilisés finis
    points:
    - contenu: Probabilité sur un univers fini.
      precisions: Espace probabilisé fini $(\Omega,P)$. Notations $P(X\in A)$, $P(X=x)$ et $P(X\leqslant x)$.
      cours:
      - "ma-21:3"
      ex:
      - ma-21-23
      - ma-21-24
      - ma-21-25
      - ma-21-32
      themes:
      - probabilites-discretes
    - contenu: "Une distribution de probabilités sur un ensemble $E$ est une famille d’éléments de $\\mathbb{R}^+$ indexée par $E$ et de somme 1."
      precisions: "Une probabilité $P$ sur $\\Omega$ est déterminée par la distribution de probabilités $(P(\\{\\omega\\}))_{\\omega\\in\\Omega}$."
      cours:
      - "ma-21:3"
      ex:
      - ma-21-24
      themes:
      - probabilites-discretes
    - contenu: Probabilité uniforme.
      cours:
      - "ma-21:3"
      ex:
      - ma-21-25
      - ma-21-27
      - ma-21-29
      - ma-21-30
      - ma-21-33
      themes:
      - loi-uniforme-discrete
      - denombrement
    - contenu: Probabilité de la réunion ou de la différence de deux événements, de l’événement contraire. Croissance.
      precisions: La formule du crible est hors programme.
      cours:
      - "ma-21:3"
      ex:
      - ma-21-23
      - ma-21-25
      - ma-21-32
      themes:
      - probabilites-discretes
  - intitule: A - Probabilités sur un univers fini, variables aléatoires et lois · c) Probabilités conditionnelles
    points:
    - contenu: "Si $P(B)>0$, la probabilité conditionnelle de $A$ sachant $B$ est définie par la relation $P(A\\mid B)=P_B(A)=\\dfrac{P(A\\cap B)}{P(B)}$."
      cours:
      - "ma-21:4"
      ex:
      - ma-21-36
      - ma-21-42
      - ma-21-40
      themes:
      - conditionnement
    - contenu: L’application $P_B$ est une probabilité.
      cours:
      - "ma-21:4"
      themes:
      - conditionnement
    - contenu: Formules des probabilités composées, des probabilités totales, de Bayes.
      precisions: Par convention, $P(A\mid B)P(B)=0$ lorsque $P(B)=0$.
      cours:
      - "ma-21:4"
      ex:
      - ma-21-35
      - ma-21-36
      - ma-21-37
      - ma-21-43
      - ma-21-50
      - ma-21-53
      themes:
      - bayes
      - conditionnement
  - intitule: A - Probabilités sur un univers fini, variables aléatoires et lois · d) Loi d’une variable aléatoire
    points:
    - contenu: Loi $P_X$ d’une variable aléatoire $X$ à valeurs dans $E$.
      precisions: "La probabilité $P_X$ est déterminée par la distribution de probabilités $(P(X=x))_{x\\in E}$. On note $X\\sim Y$ la relation $P_X=P_Y$."
      cours:
      - "ma-21:5"
      ex:
      - ma-21-58
      - ma-21-71
      - ma-21-90
      themes:
      - variables-aleatoires
    - contenu: Variable aléatoire $f(X)$.
      precisions: Si $X\sim Y$ alors $f(X)\sim f(Y)$.
      cours:
      - "ma-21:5"
      ex:
      - ma-21-55
      - ma-21-71
      - ma-21-102
      themes:
      - variables-aleatoires
    - contenu: Variable uniforme sur un ensemble fini non vide $E$.
      precisions: "Notation $X\\sim\\mathcal{U}(E)$."
      cours:
      - "ma-21:5"
      ex:
      - ma-21-61
      - ma-21-63
      themes:
      - loi-uniforme-discrete
    - contenu: "Variable de Bernoulli de paramètre $p\\in[0,1]$."
      precisions: "Notation $X\\sim\\mathcal{B}(p)$. Interprétation comme succès d’une expérience."
      cours:
      - "ma-21:5"
      ex:
      - ma-21-55
      themes:
      - loi-binomiale
    - contenu: "Variable binomiale de paramètres $n\\in\\mathbb{N}^*$ et $p\\in[0,1]$."
      precisions: "Notation $X\\sim\\mathcal{B}(n,p)$."
      cours:
      - "ma-21:5"
      ex:
      - ma-21-59
      - ma-21-60
      - ma-21-98
      themes:
      - loi-binomiale
    - contenu: Loi conditionnelle d’une variable aléatoire $X$ sachant un événement $A$.
      cours:
      - "ma-21:5"
      ex:
      - ma-21-87
      themes:
      - variables-aleatoires
      - conditionnement
    - contenu: Couple de variables aléatoires. Loi conjointe, lois marginales.
      precisions: Un couple de variables aléatoires est une variable aléatoire à valeurs dans un produit. Notation $P(X=x,Y=y)$. Extension aux $n$-uplets de variables aléatoires.
      cours:
      - "ma-21:5"
      ex:
      - ma-21-55
      - ma-21-81
      - ma-21-87
      themes:
      - couples-variables
  - intitule: A - Probabilités sur un univers fini, variables aléatoires et lois · e) Événements indépendants
    points:
    - contenu: Les événements $A$ et $B$ sont indépendants si $P(A\cap B)=P(A)P(B)$.
      precisions: "Si $P(B)>0$, l’indépendance de $A$ et $B$ s’écrit $P(A\\mid B)=P(A)$."
      cours:
      - "ma-21:4"
      ex:
      - ma-21-38
      - ma-21-47
      - ma-21-102
      themes:
      - conditionnement
    - contenu: Famille finie d’événements indépendants.
      precisions: L’indépendance deux à deux n’implique pas l’indépendance.
      cours:
      - "ma-21:4"
      ex:
      - ma-21-41
      - ma-21-46
      - ma-21-48
      - ma-21-54
      themes:
      - conditionnement
    - contenu: "Si $A$ et $B$ sont indépendants, $A$ et $\\overline{B}$ le sont aussi."
      precisions: Extension au cas de $n$ événements.
      cours:
      - "ma-21:4"
      ex:
      - ma-21-38
      - ma-21-41
      - ma-21-48
      themes:
      - conditionnement
  - intitule: A - Probabilités sur un univers fini, variables aléatoires et lois · f) Variables aléatoires indépendantes
    points:
    - contenu: "Les variables aléatoires $X$ et $Y$ définies sur l’univers $\\Omega$ sont indépendantes si pour tout $A\\in\\mathcal{P}(X(\\Omega))$ et tout $B\\in\\mathcal{P}(Y(\\Omega))$, les événements\
        \ $(X\\in A)$ et $(Y\\in B)$ sont indépendants."
      precisions: "Notation $X\\perp\\!\\!\\!\\perp Y$. Cette condition équivaut au fait que la distribution de probabilités de $(X,Y)$ est donnée par $P\\big((X,Y)=(x,y)\\big)=P(X=x)P(Y=y)$."
      cours:
      - "ma-21:5"
      ex:
      - ma-21-55
      - ma-21-81
      - ma-21-62
      themes:
      - couples-variables
    - contenu: Extension aux $n$-uplets de variables aléatoires.
      precisions: "Modélisation de $n$ expériences aléatoires indépendantes par une suite finie $(X_i)_{1\\leqslant i\\leqslant n}$ de variables aléatoires indépendantes."
      cours:
      - "ma-21:5"
      ex:
      - ma-21-88
      - ma-21-61
      - ma-21-67
      themes:
      - couples-variables
    - contenu: "Si $X_1,\\dots,X_n$ sont indépendantes de loi $\\mathcal{B}(p)$, alors $X_1+\\cdots+X_n$ suit la loi $\\mathcal{B}(n,p)$."
      precisions: "Interprétation : nombre de succès lors de la répétition de $n$ expériences indépendantes ayant chacune la probabilité $p$ de succès."
      cours:
      - "ma-21:5"
      ex:
      - ma-21-88
      - ma-21-60
      themes:
      - loi-binomiale
      - couples-variables
    - contenu: Si les variables aléatoires $X$ et $Y$ sont indépendantes, alors $f(X)$ et $g(Y)$ sont indépendantes.
      cours:
      - "ma-21:5"
      themes:
      - couples-variables
      note: "La proposition est démontrée au cours (proposition 16) ; les exercices de la feuille ne s'en servent qu'en passant, aucun ne la travaille pour elle-même."
    - contenu: "Lemme des coalitions : si les variables aléatoires $X_1,\\dots,X_n$ sont indépendantes, alors $f(X_1,\\dots,X_m)$ et $g(X_{m+1},\\dots,X_n)$ le sont aussi."
      precisions: La démonstration est hors programme. Extension au cas de plus de deux coalitions.
      demo: hors programme
      cours:
      - "ma-21:5"
      ex:
      - ma-21-61
      - ma-21-67
      themes:
      - couples-variables
  - intitule: B - Espérance et variance · a) Espérance d’une variable aléatoire réelle ou complexe
    points:
    - contenu: "Espérance $\\mathrm{E}(X)=\\sum_{x\\in X(\\Omega)}xP(X=x)$ d’une variable aléatoire $X$."
      precisions: "L’espérance est un indicateur de position. Formule $\\mathrm{E}(X)=\\sum_{\\omega\\in\\Omega}X(\\omega)P(\\{\\omega\\})$. Variable aléatoire centrée."
      cours:
      - "ma-21:6"
      ex:
      - ma-21-70
      - ma-21-71
      - ma-21-83
      themes:
      - esperance-variance
    - contenu: Linéarité, positivité, croissance, inégalité triangulaire.
      cours:
      - "ma-21:6"
      ex:
      - ma-21-72
      - ma-21-73
      - ma-21-76
      - ma-21-80
      themes:
      - esperance-variance
      - variables-indicatrices
    - contenu: Espérance d’une variable constante, de Bernoulli, binomiale.
      precisions: "Exemple : $\\mathrm{E}(\\mathbb{1}_A)=P(A)$."
      cours:
      - "ma-21:6"
      ex:
      - ma-21-88
      - ma-21-89
      themes:
      - esperance-variance
      - loi-binomiale
      - variables-indicatrices
    - contenu: "Formule de transfert : $\\mathrm{E}\\big(f(X)\\big)=\\sum_{x\\in X(\\Omega)}f(x)P(X=x)$."
      precisions: On souligne que la formule de transfert s’applique en particulier aux couples et aux $n$-uplets.
      cours:
      - "ma-21:6"
      ex:
      - ma-21-70
      - ma-21-71
      - ma-21-72
      themes:
      - esperance-variance
    - contenu: "Si $X$ et $Y$ sont indépendantes, alors $\\mathrm{E}(XY)=\\mathrm{E}(X)\\mathrm{E}(Y)$."
      precisions: Extension au cas de $n$ variables aléatoires indépendantes.
      cours:
      - "ma-21:6"
      ex:
      - ma-21-74
      - ma-21-102
      themes:
      - esperance-variance
      - couples-variables
  - intitule: B - Espérance et variance · b) Variance d’une variable aléatoire réelle, écart type et covariance
    points:
    - contenu: Variance et écart type d’une variable aléatoire réelle.
      precisions: Variance et écart type sont des indicateurs de dispersion. Variable aléatoire réduite.
      cours:
      - "ma-21:7"
      ex:
      - ma-21-83
      - ma-21-86
      themes:
      - esperance-variance
    - contenu: "Relation $\\mathrm{V}(aX+b)=a^2\\mathrm{V}(X)$."
      precisions: "Si $\\sigma(X)>0$, la variable $\\dfrac{X-\\mathrm{E}(X)}{\\sigma(X)}$ est centrée réduite."
      cours:
      - "ma-21:7"
      ex:
      - ma-21-82
      themes:
      - esperance-variance
    - contenu: "Relation $\\mathrm{V}(X)=\\mathrm{E}(X^2)-\\mathrm{E}(X)^2$."
      cours:
