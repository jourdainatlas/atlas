      precisions: "Sous-espace nul. Droite vectorielle. Plan vectoriel de $\\mathbb{R}^3$. Sous-espace $\\mathbb{K}_n[X]$ de $\\mathbb{K}[X]$."
      cours:
      - "ma-14:3"
      ex:
      - ma-14-05
      - ma-14-06
      - ma-14-07
      - ma-14-08
      themes:
      - espaces-vectoriels
    - contenu: Intersection d’une famille de sous-espaces vectoriels.
      cours:
      - "ma-14:3"
      ex:
      - ma-14-10
      - ma-14-34
      themes:
      - espaces-vectoriels
    - contenu: Sous-espace vectoriel engendré par une famille finie de vecteurs.
      precisions: "Notation $\\operatorname{Vect}(x_i)_{i\\in I}$. Tout sous-espace vectoriel contenant les $x_i$ contient $\\operatorname{Vect}(x_i)_{i\\in I}$."
      cours:
      - "ma-14:3"
      ex:
      - ma-14-09
      - ma-14-10
      - ma-14-11
      themes:
