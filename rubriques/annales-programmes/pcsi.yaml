- intitule: Espaces préhilbertiens réels
  periode: Deuxième semestre
  objectif: La notion de produit scalaire a été étudiée d’un point de vue élémentaire dans l’enseignement secondaire. L’objectif de cette section, qu’il est essentiel d’illustrer par de nombreuses figures,
    est de la généraliser, afin d’exploiter l’intuition acquise en dimension 2 ou 3 pour résoudre des problèmes posés dans un contexte plus abstrait. Les familles de polynômes orthogonaux donnent des illustrations
    pertinentes des notions abordées dans cette section.
  blocs:
  - intitule: a) Produit scalaire
    points:
    - contenu: Produit scalaire.
      precisions: Notations $\langle x,y\rangle$, $(x\mid y)$, $x\cdot y$.
      cours:
      - "ma-19:2"
      ex:
      - ma-19-01
      - ma-19-02
      - ma-19-03
      - ma-19-08
      themes:
      - prehilbertiens
    - contenu: Espace préhilbertien, espace euclidien.
      cours:
      - "ma-19:2"
      themes:
      - prehilbertiens
    - contenu: "Produit scalaire canonique sur $\\mathbb{R}^n$."
      precisions: Expression $X^\top Y$.
      cours:
      - "ma-19:2"
      ex:
      - ma-19-19
      - ma-19-44
      themes:
      - prehilbertiens
    - contenu: "Produit scalaire $\\langle f,g\\rangle=\\int_a^b fg$ sur $\\mathcal{C}([a,b],\\mathbb{R})$."
      precisions: "Exemples de produits scalaires intégraux sur $\\mathbb{R}[X]$ et $\\mathcal{C}([a,b],\\mathbb{R})$."
      cours:
      - "ma-19:2"
      ex:
      - ma-19-02
      - ma-19-15
      - ma-19-03
      themes:
      - prehilbertiens
  - intitule: b) Norme associée à un produit scalaire
    points:
    - contenu: Norme associée à un produit scalaire, distance.
      cours:
      - "ma-19:3"
      ex:
      - ma-19-06
      - ma-19-10
      - ma-19-11
      themes:
      - prehilbertiens
    - contenu: Inégalité de Cauchy-Schwarz, cas d’égalité.
      precisions: "Exemples : sommes finies, intégrales."
      cours:
      - "ma-19:3"
      ex:
      - ma-19-04
      - ma-19-07
      - ma-19-09
      themes:
      - cauchy-schwarz
      - prehilbertiens
    - contenu: Inégalité triangulaire, cas d’égalité.
      cours:
      - "ma-19:3"
      ex:
      - ma-19-10
      - ma-19-49
      themes:
      - prehilbertiens
      note: "L'item 3 de l'exercice 19.49 (vrai-faux) porte sur les fonctions continues par morceaux, hors programme de PCSI."
    - contenu: "Identité remarquable $\\|x+y\\|^2=\\|x\\|^2+\\|y\\|^2+2\\langle x,y\\rangle$."
      precisions: Formule de polarisation associée.
      cours:
      - "ma-19:3"
      ex:
      - ma-19-06
      - ma-19-11
      themes:
      - prehilbertiens
  - intitule: c) Orthogonalité
    points:
    - contenu: Vecteurs orthogonaux, orthogonal d’une partie.
      precisions: Notation $X^\perp$. L’orthogonal d’une partie est un sous-espace.
      cours:
      - "ma-19:4"
      ex:
      - ma-19-12
      - ma-19-13
      - ma-19-33
      themes:
      - prehilbertiens
    - contenu: Famille orthogonale, orthonormée (ou orthonormale).
      cours:
      - "ma-19:4"
      ex:
      - ma-19-21
      themes:
      - prehilbertiens
    - contenu: Toute famille orthogonale de vecteurs non nuls est libre.
      cours:
      - "ma-19:4"
      ex:
      - ma-19-17
      themes:
      - prehilbertiens
    - contenu: Théorème de Pythagore.
      cours:
      - "ma-19:4"
      ex:
      - ma-19-13
      - ma-19-49
      themes:
      - prehilbertiens
      note: "L'item 3 de l'exercice 19.49 (vrai-faux) porte sur les fonctions continues par morceaux, hors programme de PCSI."
    - contenu: Algorithme d’orthonormalisation de Gram-Schmidt.
      cours:
      - "ma-19:4"
      ex:
      - ma-19-14
      - ma-19-15
      - ma-19-16
      - ma-19-18
      themes:
      - gram-schmidt
  - intitule: d) Bases orthonormées
    points:
    - contenu: Existence de bases orthonormées dans un espace euclidien.
      cours:
      - "ma-19:5"
      ex:
      - ma-19-24
      themes:
      - prehilbertiens
      - gram-schmidt
    - contenu: Théorème de la base orthonormée incomplète.
      cours:
      - "ma-19:5"
      ex:
      - ma-19-25
      themes:
      - prehilbertiens
    - contenu: Expression des coordonnées, du produit scalaire et de la norme dans une base orthonormée.
      cours:
      - "ma-19:5"
      ex:
      - ma-19-19
      - ma-19-20
      - ma-19-23
      - ma-19-22
      themes:
      - prehilbertiens
      note: "La question 3 (a) de l'exercice 19.22 prend pour forme linéaire la trace, hors programme de PCSI."
  - intitule: e) Projection orthogonale sur un sous-espace de dimension finie
    points:
    - contenu: Supplémentaire orthogonal d’un sous-espace $F$ de dimension finie.
      precisions: "En dimension finie : dimension de $F^\\perp$, vecteur normal à un hyperplan."
      cours:
      - "ma-19:6"
      ex:
      - ma-19-12
      - ma-19-28
      - ma-19-33
      - ma-19-39
      themes:
      - projection-orthogonale
      - prehilbertiens
    - contenu: Projection orthogonale sur $F$. Expression du projeté orthogonal d’un vecteur $x$ dans une base orthonormée de $F$.
      cours:
      - "ma-19:6"
      ex:
      - ma-19-29
      - ma-19-30
      - ma-19-28
      - ma-19-43
      - ma-19-41
      themes:
      - projection-orthogonale
    - contenu: Distance d’un vecteur à $F$.
      precisions: Notation $d(x,F)$.
      cours:
      - "ma-19:6"
      ex:
      - ma-19-28
      - ma-19-29
      - ma-19-30
      - ma-19-37
      - ma-19-52
      themes:
      - projection-orthogonale
    - contenu: Le projeté orthogonal de $x$ sur $F$ est l’unique élément de $F$ qui réalise la distance de $x$ à $F$.
      cours:
      - "ma-19:6"
      ex:
      - ma-19-35
      - ma-19-36
      - ma-19-45
      - ma-19-52
      themes:
      - projection-orthogonale
- intitule: Séries numériques
  periode: Deuxième semestre
  objectif: Cette section a pour but de prolonger l’étude des suites et de permettre d’appliquer les techniques d’analyse asymptotique pour étudier les séries numériques. La notion de suite sommable est
    introduite mais n’appelle aucun développement théorique.
  hors_programme:
  - Le critère de Cauchy et la notion de semi-convergence.
  blocs:
  - intitule: a) Convergence et divergence
    points:
    - contenu: Sommes partielles d’une série numérique. Convergence, divergence, somme.
      precisions: "La série est notée $\\sum u_n$. En cas de convergence, sa somme est notée $\\sum_{n=0}^{+\\infty}u_n$."
      cours:
      - "ma-20:2"
      ex:
      - ma-20-02
      - ma-20-01
      - ma-20-06
      - ma-20-04
      - ma-20-05
      themes:
      - series-numeriques
      note: "Dans la question 4 de l'exercice 20.6, le cas a + b + c = 0 donne une série qui converge sans converger absolument ; on l'établit par les sommes partielles (question 3), sans la notion de semi-convergence,\
        \ hors programme de PCSI."
    - contenu: Linéarité de la somme.
      cours:
      - "ma-20:2"
      ex:
      - ma-20-03
      - ma-20-30
      themes:
      - series-numeriques
    - contenu: Le terme général d’une série convergente tend vers 0.
      precisions: Divergence grossière.
      cours:
      - "ma-20:2"
      ex:
      - ma-20-04
      themes:
      - series-numeriques
    - contenu: Reste d’une série convergente.
      cours:
      - "ma-20:2"
      ex:
      - ma-20-24
      themes:
      - series-numeriques
    - contenu: Lien suite-série.
      precisions: "La suite $(u_n)$ et la série télescopique $\\sum(u_{n+1}-u_n)$ sont de même nature."
      cours:
      - "ma-20:2"
      ex:
      - ma-20-02
      - ma-20-05
      - ma-20-25
      themes:
      - series-numeriques
      - suites
    - contenu: "Séries géométriques : condition nécessaire et suffisante de convergence, somme."
      cours:
      - "ma-20:2"
      ex:
      - ma-20-21
      - ma-20-31
      themes:
      - series-numeriques
    - contenu: "Relation $\\mathrm{e}^z=\\sum_{n=0}^{+\\infty}\\dfrac{z^n}{n!}$ pour $z\\in\\mathbb{C}$."
      cours:
      - "ma-20:2"
      ex:
      - ma-20-03
      themes:
      - series-numeriques
      - exponentielle-complexe
  - intitule: b) Séries à termes positifs ou nuls
    points:
    - contenu: "Convention de calcul et relation d’ordre dans $[0,+\\infty]$."
      precisions: "On note $\\sum_{n=0}^{+\\infty}u_n=+\\infty$ si la série $\\sum u_n$ d’éléments de $\\mathbb{R}^+$ diverge."
      cours:
      - "ma-20:3"
      - "ma-20:6"
      themes:
      - series-numeriques
    - contenu: Une série à termes positifs converge si et seulement si la suite de ses sommes partielles est majorée.
      cours:
      - "ma-20:3"
      ex:
      - ma-20-08
      themes:
      - series-numeriques
    - contenu: Si $0\leqslant u_n\leqslant v_n$ pour tout $n$, la convergence de $\sum v_n$ implique celle de $\sum u_n$.
      cours:
      - "ma-20:3"
      ex:
      - ma-20-07
      - ma-20-09
      - ma-20-17
      - ma-20-22
      themes:
      - series-numeriques
    - contenu: "Si $(u_n)_{n\\in\\mathbb{N}}$ et $(v_n)_{n\\in\\mathbb{N}}$ sont positives et si $u_n\\sim v_n$, les séries $\\sum u_n$ et $\\sum v_n$ sont de même nature."
      cours:
      - "ma-20:3"
      ex:
      - ma-20-07
      - ma-20-11
      - ma-20-12
      - ma-20-25
      themes:
      - series-numeriques
      - equivalents
      note: "Dans l'exercice 20.11 (a), la tangente hyperbolique, hors programme de PCSI, se réécrit $1-\\operatorname{th}n=\\frac{2}{\\mathrm{e}^{2n}+1}$."
    - contenu: Si $f$ est monotone, encadrement des sommes partielles de $\sum f(n)$ à l’aide de la méthode des rectangles.
      precisions: Application à l’étude de sommes partielles.
      cours:
      - "ma-20:3"
      ex:
      - ma-20-10
      - ma-20-15
      - ma-20-13
      - ma-20-23
      themes:
      - comparaison-serie-integrale
    - contenu: Séries de Riemann.
      cours:
      - "ma-20:3"
      ex:
      - ma-20-11
      - ma-20-13
      - ma-20-19
      - ma-20-14
      themes:
      - series-numeriques
      - comparaison-serie-integrale
      note: "Dans l'exercice 20.11 (a), la tangente hyperbolique, hors programme de PCSI, se réécrit $1-\\operatorname{th}n=\\frac{2}{\\mathrm{e}^{2n}+1}$."
  - intitule: c) Séries absolument convergentes à termes réels ou complexes, suites sommables
    points:
    - contenu: Convergence absolue de la série numérique $\sum u_n$, encore appelée sommabilité de la suite $(u_n)$.
      precisions: "Notation $\\sum_{n=0}^{+\\infty}|u_n|<+\\infty$. Le critère de Cauchy et la notion de semi-convergence sont hors programme."
      cours:
      - "ma-20:4"
      ex:
      - ma-20-31
      themes:
      - series-numeriques
    - contenu: Une série numérique absolument convergente est convergente.
      precisions: Somme d’une suite sommable.
      cours:
      - "ma-20:4"
      ex:
      - ma-20-31
      - ma-20-30
      - ma-20-34
      themes:
      - series-numeriques
    - contenu: "Si $(u_n)$ est une suite complexe, si $(v_n)$ est une suite d’éléments de $\\mathbb{R}^+$, si $u_n=O(v_n)$ et si $\\sum v_n$ converge, alors $\\sum u_n$ est absolument convergente donc convergente."
      cours:
      - "ma-20:4"
      ex:
      - ma-20-31
      - ma-20-26
      themes:
      - series-numeriques
      note: "La dernière phrase de l'exercice 20.26 (retrouver le résultat par la formule de Stirling) sort du programme de PCSI ; le reste de l'exercice n'emploie que des outils du programme."
- intitule: Fonctions de deux variables
  periode: Deuxième semestre
  objectif: Le but de cette section, dont le contenu sera entièrement repris dans un cadre plus général en seconde année, est de familiariser les étudiants avec les calculs sur les dérivées partielles,
    notamment avec la « règle de la chaîne », et de développer une vision géométrique des fonctions de deux variables. Le point de vue est donc essentiellement pratique.
  hors_programme:
  - Toute extension et tout développement théorique supplémentaire.
  - La notion de fonction différentiable.
  - "La démonstration du développement limité à l’ordre 1 d’une fonction de classe $\\mathcal{C}^1$."
  blocs:
  - intitule: "a) Ouverts de $\\mathbb{R}^2$, fonctions continues"
    points:
    - contenu: "Boules de $\\mathbb{R}^2$ muni de la norme euclidienne canonique. Ouverts."
      cours:
      - "ma-22:2"
      ex:
      - ma-22-01
      themes:
      - topologie-evn
    - contenu: "Continuité d’une fonction définie sur un ouvert de $\\mathbb{R}^2$, à valeurs dans $\\mathbb{R}$."
      precisions: Représentation graphique d’une fonction de deux variables par une surface. La notion de continuité est introduite uniquement en vue du calcul différentiel. L’étude de la continuité d’une
        fonction n’est pas un objectif du programme.
      cours:
      - "ma-22:2"
      ex:
      - ma-22-07
      themes:
      - calcul-differentiel
      note: "L'étude de la continuité n'étant pas un objectif du programme, on ne retient qu'un exercice simple, où la continuité prépare l'étude des dérivées partielles."
  - intitule: b) Dérivées partielles
    points:
    - contenu: "Dérivées partielles en un point d’une fonction $f$ définie sur un ouvert de $\\mathbb{R}^2$, à valeurs dans $\\mathbb{R}$."
      precisions: "Notations $\\dfrac{\\partial f}{\\partial x}(x_0,y_0)$, $\\dfrac{\\partial f}{\\partial y}(x_0,y_0)$. L’existence des dérivées partielles n’entraîne pas la continuité."
      cours:
      - "ma-22:3"
      ex:
      - ma-22-05
      - ma-22-07
      - ma-22-16
      - ma-22-11
      - ma-22-13
      themes:
      - calcul-differentiel
    - contenu: "Fonction de classe $\\mathcal{C}^1$ sur un ouvert."
      precisions: Définition par la continuité des dérivées partielles. La notion de fonction différentiable est hors programme.
      cours:
      - "ma-22:3"
      ex:
      - ma-22-05
      - ma-22-06
      - ma-22-10
      - ma-22-11
      themes:
      - calcul-differentiel
    - contenu: "Développement limité à l’ordre 1 au point $(x_0,y_0)$ d’une fonction $f$ de classe $\\mathcal{C}^1$ : $f(x_0+h,y_0+k)=f(x_0,y_0)+\\dfrac{\\partial f}{\\partial x}(x_0,y_0)h+\\dfrac{\\partial\
        \ f}{\\partial y}(x_0,y_0)k+o(\\|(h,k)\\|)$."
      precisions: "Démonstration hors programme. On met en évidence l’idée de l’approximation linéaire de $f(x_0+h,y_0+k)-f(x_0,y_0)$ et l’interprétation de $z-z_0=\\dfrac{\\partial f}{\\partial x}(x_0,y_0)(x-x_0)+\\\
        dfrac{\\partial f}{\\partial y}(x_0,y_0)(y-y_0)$ comme équation du plan tangent en $(x_0,y_0)$ à la surface d’équation $z=f(x,y)$."
      demo: hors programme
      cours:
      - "ma-22:3"
      ex:
      - ma-22-05
      - ma-22-11
      themes:
      - calcul-differentiel
    - contenu: "Gradient d’une fonction de classe $\\mathcal{C}^1$."
      precisions: Notation $\nabla f(x_0,y_0)$.
      cours:
      - "ma-22:3"
      ex:
      - ma-22-08
      - ma-22-21
      - ma-22-35
      themes:
      - calcul-differentiel
    - contenu: Expression du développement limité à l’aide du gradient.
      precisions: Le gradient de $f$ en $(x_0,y_0)$ définit la direction dans laquelle $f$ croît le plus vite.
      cours:
      - "ma-22:3"
      - "ma-22:4"
      themes:
      - calcul-differentiel
  - intitule: c) Dérivées partielles et composées
    points:
    - contenu: Dérivée selon un vecteur.
      precisions: Expression à l’aide du gradient $\langle\nabla f(x_0,y_0),u\rangle$.
      cours:
      - "ma-22:4"
      ex:
      - ma-22-16
      - ma-22-29
      themes:
      - calcul-differentiel
    - contenu: "Règle de la chaîne : les fonctions considérées étant de classe $\\mathcal{C}^1$, la fonction $t\\mapsto f(x(t),y(t))$ est de classe $\\mathcal{C}^1$ et $\\dfrac{\\mathrm{d}}{\\mathrm{d}t}\\\
        big(f(x(t),y(t))\\big)=\\dfrac{\\partial f}{\\partial x}(x(t),y(t))\\,x'(t)+\\dfrac{\\partial f}{\\partial y}(x(t),y(t))\\,y'(t)$."
      precisions: "Interprétation comme dérivée de $f$ le long d’un arc $\\gamma$ donné par $\\gamma(t)=(x(t),y(t))$ et expression à l’aide du gradient $(f\\circ\\gamma)'(t)=\\langle\\nabla f(\\gamma(t)),\\\
        gamma'(t)\\rangle$ où $\\gamma'(t)$ est défini par $(x'(t),y'(t))$. Le gradient de $f$ est orthogonal aux lignes de niveau de $f$."
      cours:
      - "ma-22:4"
      ex:
      - ma-22-14
      - ma-22-29
      - ma-22-34
      themes:
      - calcul-differentiel
    - contenu: Sous les hypothèses appropriées, dérivées partielles de $(u,v)\mapsto f(\varphi(u,v),\psi(u,v))$.
      cours:
      - "ma-22:4"
      ex:
      - ma-22-15
      - ma-22-17
      - ma-22-18
      - ma-22-19
      - ma-22-20
      themes:
      - calcul-differentiel
  - intitule: d) Extremums
    points:
    - contenu: "Maximum et minimum, local ou global d’une fonction définie sur une partie de $\\mathbb{R}^2$."
      cours:
      - "ma-22:5"
      ex:
      - ma-22-24
      - ma-22-32
      - ma-22-31
      - ma-22-33
      themes:
      - optimisation
    - contenu: "Point critique. Tout extremum local d’une fonction de classe $\\mathcal{C}^1$ sur un ouvert de $\\mathbb{R}^2$ est un point critique."
      precisions: Exemples d’étude de points critiques.
      cours:
      - "ma-22:5"
      ex:
      - ma-22-23
      - ma-22-25
      - ma-22-26
      - ma-22-27
      - ma-22-28
