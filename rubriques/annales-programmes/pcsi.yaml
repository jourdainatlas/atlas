      - arithmetique-polynomes
      - racines-polynomes
      - racines-unite
    - contenu: "Polynômes irréductibles de $\\mathbb{R}[X]$. Théorème de décomposition en facteurs irréductibles dans $\\mathbb{R}[X]$."
      precisions: "Deux racines complexes conjuguées d’un polynôme de $\\mathbb{R}[X]$ ont même multiplicité."
      cours:
      - "ma-13:7"
      ex:
      - ma-13-34
      - ma-13-35
      - ma-13-36
      - ma-13-37
      themes:
      - arithmetique-polynomes
      - racines-polynomes
  - intitule: f) Décomposition en éléments simples de certaines fonctions rationnelles
    points:
    - contenu: "Expression de la décomposition en éléments simples sur $\\mathbb{C}$ et $\\mathbb{R}$ des fonctions rationnelles à pôles simples."
      precisions: La démonstration est hors programme. Dans le cas où le dénominateur possède une racine multiple ou un facteur irréductible de degré 2, la forme cherchée doit être fournie. Application
        au calcul de primitives, de dérivées $k$-ièmes.
      demo: hors programme
      cours:
      - "ma-13:10"
      ex:
      - ma-13-49
      - ma-13-50
      - ma-13-46
      - ma-13-51
      themes:
      - fractions-rationnelles
      note: "Le cours du site traite la décomposition en éléments simples dans le cas général. Parmi les exercices retenus, seule la fraction (iv) de l'exercice 13.46 (pôle double en 1) et la somme (ii)\
        \ de l'exercice 13.50 (facteurs irréductibles de degré 2, factorisation indiquée) dépassent les pôles simples du programme de PCSI ; l'exercice 13.45, presque entièrement hors de ce cadre, n'est\
        \ pas retenu."
- intitule: Analyse asymptotique
  periode: Deuxième semestre
  objectif: L’objectif de cette section est d’introduire les techniques asymptotiques fondamentales, dans les cadres continu et discret ; les fonctions et les suites y sont à valeurs réelles ou complexes,
    le cas réel jouant un rôle prépondérant, et l’on donne la priorité à la pratique d’exercices plutôt qu’à la vérification de propriétés élémentaires relatives aux relations de comparaison. Les développements
    limités sont les principaux outils du calcul asymptotique ; afin d’en disposer au plus tôt, on traite en premier lieu les fonctions. Les étudiants doivent connaître les développements limités usuels
    et savoir mener à bien rapidement des calculs asymptotiques simples, les situations dont la gestion manuelle ne relèverait que de la technicité étant traitées à l’aide d’outils logiciels. Cette section
    permet de revenir sur la problématique de la vitesse de convergence introduite au premier semestre.
  hors_programme:
  - La notion d’échelle de comparaison.
  blocs:
  - intitule: "a) Relations de comparaison : cas des fonctions"
    points:
    - contenu: "Relations de domination, de négligeabilité, d’équivalence en un point $a$ de $\\mathbb{R}$ ou $a=\\pm\\infty$."
      precisions: "Notations $f(x)\\underset{x\\to a}{=}O(g(x))$, $f(x)\\underset{x\\to a}{=}o(g(x))$, $f(x)\\underset{x\\to a}{\\sim}g(x)$. La relation $f(x)\\underset{x\\to a}{=}o(g(x))$ est définie à\
        \ partir du quotient $\\frac{f(x)}{g(x)}$ sous l’hypothèse que la fonction $g$ ne s’annule pas localement. Pour la relation $f(x)\\underset{x\\to a}{\\sim}g(x)$, on donne les deux formes $\\frac{f(x)}{g(x)}\\\
        underset{x\\to a}{\\longrightarrow}1$ et $f(x)\\underset{x\\to a}{=}g(x)+o(g(x))$, en insistant sur l’intérêt de la seconde dans les calculs. Pour mener une étude locale de $f$ au voisinage de $a\\\
        neq0$, on étudie $f(a+h)$ pour $h\\to0$."
      cours:
      - "ma-10:2"
      ex:
      - ma-10-01
      - ma-10-02
      - ma-10-04
      - ma-10-06
      themes:
      - equivalents
    - contenu: Lien entre ces relations.
      precisions: "Traduction à l’aide du symbole $o$ des croissances comparées de $\\ln^\\beta(x)$, $x^\\alpha$, $\\mathrm{e}^{\\gamma x}$ en $+\\infty$, de $\\ln^\\beta(x)$, $x^\\alpha$ en 0."
      cours:
      - "ma-10:2"
      ex:
      - ma-10-06
      - ma-10-10
      themes:
      - equivalents
    - contenu: Règles usuelles de manipulation des équivalents et des symboles $o$ et $O$.
      cours:
      - "ma-10:2"
      ex:
      - ma-10-03
      - ma-10-05
      - ma-10-08
      - ma-10-11
      themes:
      - equivalents
    - contenu: "Obtention d’un équivalent par encadrement : si les fonctions réelles $f$, $g$, $h$ vérifient $f\\leqslant g\\leqslant h$ et si $f(x)\\underset{x\\to a}{\\sim}h(x)$, alors $g(x)\\underset{x\\\
        to a}{\\sim}f(x)$."
      cours:
      - "ma-10:2"
      ex:
      - ma-10-07
      - ma-10-09
      - ma-10-12
      themes:
      - equivalents
    - contenu: "Propriétés conservées par équivalence : signe, limite."
      cours:
      - "ma-10:2"
      ex:
      - ma-10-05
      - ma-10-49
      themes:
      - equivalents
  - intitule: b) Développements limités
    points:
    - contenu: Développement limité à l’ordre $n$ d’une fonction en un point.
      precisions: Le développement limité à l’ordre $n$ de $f$ en $a$ peut se ramener à celui de $h\mapsto f(a+h)$ en 0. Signe de $f$ au voisinage de $a$.
      cours:
      - "ma-10:3"
      ex:
      - ma-10-13
      - ma-10-16
      themes:
      - developpements-limites
    - contenu: Unicité des coefficients, troncature.
      cours:
      - "ma-10:3"
      themes:
      - developpements-limites
    - contenu: Développement limité en 0 d’une fonction paire, impaire.
      cours:
      - "ma-10:3"
      ex:
      - ma-10-20
      - ma-10-26
      - ma-10-49
      themes:
      - developpements-limites
    - contenu: Caractérisation de la dérivabilité par l’existence d’un développement limité à l’ordre 1.
      cours:
      - "ma-10:3"
      ex:
      - ma-10-49
      - ma-10-26
      themes:
      - developpements-limites
    - contenu: "Opérations sur les développements limités : combinaison linéaire, produit, quotient."
      precisions: On privilégie la factorisation par le terme prépondérant pour prévoir l’ordre d’un développement. Les étudiants doivent savoir déterminer sur des exemples simples le développement limité
        d’une composée, mais aucun résultat général n’est exigible.
      cours:
      - "ma-10:3"
      ex:
      - ma-10-13
      - ma-10-14
      - ma-10-15
      - ma-10-23
      themes:
      - developpements-limites
    - contenu: Primitivation d’un développement limité.
      cours:
      - "ma-10:3"
      ex:
      - ma-10-17
      - ma-10-22
      - ma-10-25
      themes:
      - developpements-limites
    - contenu: "Formule de Taylor-Young : pour $f$ de classe $\\mathcal{C}^n$, développement limité à l’ordre $n$ en 0 de $h\\mapsto f(a+h)$."
      cours:
      - "ma-10:3"
      ex:
      - ma-10-19
      - ma-10-21
      - ma-10-20
      themes:
      - developpements-limites
      - formules-taylor
    - contenu: "Développement limité à tout ordre en 0 de $\\exp$, $\\sin$, $\\cos$, $\\operatorname{sh}$, $\\operatorname{ch}$, $x\\mapsto\\ln(1+x)$, $x\\mapsto\\dfrac{1}{1-x}$, $x\\mapsto(1+x)^\\alpha$,\
        \ $\\operatorname{Arctan}$."
      cours:
      - "ma-10:3"
      ex:
      - ma-10-13
      themes:
      - developpements-limites
    - contenu: Développement limité à l’ordre 3 en 0 de $\tan$.
      cours:
      - "ma-10:3"
      ex:
      - ma-10-22
      themes:
      - developpements-limites
    - contenu: Application des développements limités à l’étude locale d’une fonction.
      precisions: Calculs d’équivalents et de limites, position relative d’une courbe et de sa tangente, détermination d’asymptotes.
      cours:
      - "ma-10:4"
      ex:
      - ma-10-27
      - ma-10-28
      - ma-10-29
      - ma-10-32
      - ma-10-30
      - ma-10-37
      themes:
      - developpements-limites
      - equivalents
    - contenu: Condition nécessaire, condition suffisante à l’ordre 2 pour un extremum local en un point intérieur.
      cours:
      - "ma-10:4"
      ex:
      - ma-10-31
      - ma-10-49
      themes:
      - optimisation
      - points-critiques
  - intitule: "c) Relations de comparaison : cas des suites"
    points:
    - contenu: Adaptation rapide aux suites des définitions et résultats relatifs aux fonctions.
      precisions: Notations $u_n=O(v_n)$, $u_n=o(v_n)$, $u_n\sim v_n$.
      cours:
      - "ma-10:5"
      ex:
      - ma-10-01
      - ma-10-03
      - ma-10-06
      - ma-10-10
      themes:
      - equivalents
  - intitule: d) Problèmes d’analyse asymptotique
    points:
    - contenu: "Exemples de développements asymptotiques, dans les cadres discret et continu : fonctions réciproques, équations à paramètre, suites récurrentes, suites d’intégrales."
      precisions: La notion d’échelle de comparaison est hors programme.
      cours:
      - "ma-10:5"
      - "ma-18:7"
      ex:
