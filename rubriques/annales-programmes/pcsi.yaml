      themes:
      - exponentielle-complexe
    - contenu: "Pour tous $z$ et $z'$ dans $\\mathbb{C}$, $\\exp(z)=\\exp(z')$ si et seulement si $z-z'\\in2\\mathrm{i}\\pi\\mathbb{Z}$."
      cours:
      - "ma-04:8"
      ex:
      - ma-04-46
      themes:
      - exponentielle-complexe
  - intitule: h) Interprétation géométrique des nombres complexes
    points:
    - contenu: "Interprétation géométrique des module et arguments de $\\dfrac{c-a}{b-a}$."
