      - nombres-complexes
    - contenu: "Résolution des équations du second degré dans $\\mathbb{C}$."
      precisions: Calcul des racines carrées d’un nombre complexe donné sous forme algébrique.
      cours:
      - "ma-04:6"
      ex:
      - ma-04-31
      - ma-04-32
      themes:
