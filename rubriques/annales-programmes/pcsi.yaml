      - ma-13-14
      - ma-13-16
      themes:
      - racines-polynomes
      note: "Les exercices du site qui font intervenir les autres fonctions symétriques élémentaires (sommes de Newton, méthode de Cardan) sortent du programme de PCSI et ne sont pas retenus ; dans l'exercice\
        \ 13.14, le dernier calcul (somme des carrés des racines) passe par la deuxième fonction symétrique élémentaire."
  - intitule: d) Dérivation
    points:
    - contenu: Dérivée formelle d’un polynôme.
