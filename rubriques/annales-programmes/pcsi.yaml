    - contenu: "Inégalité des accroissements finis : si $f$ est dérivable et si $|f'|$ est majorée par $K$, alors $f$ est $K$-lipschitzienne."
      precisions: "La notion de fonction lipschitzienne est introduite à cette occasion. Application à l’étude de suites définies par une relation de récurrence $u_{n+1}=f(u_n)$."
