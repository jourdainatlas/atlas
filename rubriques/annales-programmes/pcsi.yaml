      note: "L'indication de l'exercice 21.85 renvoie à l'inégalité de Cauchy-Schwarz pour les variables aléatoires, qui n'est pas au programme de probabilités de PCSI ; l'inégalité demandée se démontre\
        \ sans elle."
    - contenu: "Relation $\\operatorname{Cov}(X,Y)=\\mathrm{E}(XY)-\\mathrm{E}(X)\\mathrm{E}(Y)$, cas de deux variables indépendantes."
      cours:
      - "ma-21:7"
      ex:
      - ma-21-81
      - ma-21-86
      - ma-21-85
      themes:
      - covariance
      note: "L'indication de l'exercice 21.85 renvoie à l'inégalité de Cauchy-Schwarz pour les variables aléatoires, qui n'est pas au programme de probabilités de PCSI ; l'inégalité demandée se démontre\
        \ sans elle."
    - contenu: Variance d’une somme, cas de variables décorrélées.
