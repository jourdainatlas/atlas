    - contenu: Somme et produit des racines.
      cours:
      - "ma-04:6"
      ex:
      - ma-04-33
      - ma-04-36
      themes:
      - racines-polynomes
  - intitule: f) Racines $n$-ièmes
    points:
    - contenu: Description des racines $n$-ièmes de l’unité, d’un nombre complexe non nul donné sous forme trigonométrique.
      precisions: "Notation $\\mathbb{U}_n$. Représentation géométrique."
      cours:
