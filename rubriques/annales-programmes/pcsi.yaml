- intitule: Polynômes
  periode: Premier semestre
  objectif: "L’objectif de cette section est d’étudier les propriétés de base des polynômes et de les exploiter pour la résolution de problèmes portant sur les équations algébriques et les fonctions numériques.\
    \ On présente la décomposition en éléments simples des fonctions rationnelles, uniquement dans des situations simples, afin de fournir un outil pour mener à bien des calculs d’intégration, de dérivation,\
    \ de somme, etc. Le programme se limite aux polynômes à coefficients dans $\\mathbb{K}$ où $\\mathbb{K}$ désigne $\\mathbb{R}$ ou $\\mathbb{C}$."
  hors_programme:
  - "La construction de $\\mathbb{K}[X]$."
  - Les fonctions symétriques élémentaires.
  - La démonstration du théorème de d’Alembert-Gauss.
  - La démonstration de la décomposition en éléments simples des fonctions rationnelles à pôles simples.
  blocs:
  - intitule: a) Ensemble des polynômes à une indéterminée
    points:
    - contenu: "Ensemble $\\mathbb{K}[X]$."
      precisions: "La construction de $\\mathbb{K}[X]$ est hors programme."
      cours:
      - "ma-13:2"
      ex:
      - ma-13-01
      themes:
      - polynomes
    - contenu: Combinaison linéaire et produit de polynômes, formule du binôme.
      cours:
      - "ma-13:2"
      ex:
      - ma-13-01
      themes:
      - polynomes
    - contenu: Degré, coefficient dominant, polynôme unitaire.
      precisions: "Ensemble $\\mathbb{K}_n[X]$ des polynômes de degré au plus $n$."
      cours:
      - "ma-13:2"
      ex:
      - ma-13-02
      themes:
      - polynomes
    - contenu: Degré d’une somme, d’un produit.
      precisions: Le produit de deux polynômes non nuls est non nul.
      cours:
      - "ma-13:2"
      ex:
      - ma-13-02
      - ma-13-03
      themes:
      - polynomes
    - contenu: Composition.
      cours:
      - "ma-13:2"
      ex:
      - ma-13-03
      - ma-13-09
      - ma-13-04
      themes:
      - polynomes
  - intitule: b) Divisibilité et division euclidienne
    points:
    - contenu: "Divisibilité dans $\\mathbb{K}[X]$, diviseurs, multiples."
      cours:
      - "ma-13:3"
      ex:
      - ma-13-06
      - ma-13-07
      - ma-13-09
      themes:
      - polynomes
    - contenu: Théorème de la division euclidienne.
      precisions: Algorithme de la division euclidienne.
      cours:
      - "ma-13:3"
      ex:
      - ma-13-05
      - ma-13-08
      - ma-13-20
      - ma-13-21
      themes:
      - polynomes
  - intitule: c) Fonctions polynomiales et racines
    points:
    - contenu: Fonction polynomiale associée à un polynôme.
      cours:
      - "ma-13:4"
      themes:
      - polynomes
    - contenu: Racine (ou zéro) d’un polynôme, caractérisation en termes de divisibilité.
      precisions: Lien avec l’introduction aux équations algébriques de la section « Nombres complexes ». Méthode de Horner pour l’évaluation polynomiale.
      cours:
      - "ma-13:4"
      ex:
      - ma-13-10
      - ma-13-11
      - ma-13-12
      themes:
      - racines-polynomes
    - contenu: Le nombre de racines d’un polynôme non nul est majoré par son degré.
      precisions: Détermination d’un polynôme par la fonction polynomiale associée.
      cours:
      - "ma-13:4"
      ex:
      - ma-13-04
      - ma-13-18
      - ma-13-68
      themes:
      - racines-polynomes
    - contenu: Multiplicité d’une racine.
      cours:
      - "ma-13:4"
      ex:
      - ma-13-13
      - ma-13-22
      themes:
      - racines-polynomes
    - contenu: Polynôme scindé. Expressions de la somme et du produit des racines d’un polynôme scindé en fonction de ses coefficients.
      precisions: Les fonctions symétriques élémentaires sont hors programme.
      cours:
      - "ma-13:4"
      ex:
