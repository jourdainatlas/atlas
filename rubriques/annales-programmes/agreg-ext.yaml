      - l3-cd-01-35
      themes:
      - convexite-ensembles
      - points-extremaux
      note: "Le cours définit les parties convexes et la convexité des boules ; l'enveloppe convexe et les points extrémaux ne sont pas exposés, et l'enveloppe convexe n'apparaît qu'à travers le théorème\
        \ de Gauss-Lucas (exercice 13.69)."
  - intitule: b)
