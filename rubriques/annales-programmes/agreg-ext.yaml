- intitule: Méthodes numériques
  blocs:
  - intitule: "12.1 Résolution de systèmes d'équations linéaires"
    points:
    - contenu: Notion de conditionnement.
      themes:
      - valeurs-singulieres
      - systemes-lineaires-numeriques
    - contenu: Théorème de Gershgorin-Hadamard.
      ex:
      - ma-16-52
      - mp-02-16
      themes:
      - gershgorin
      note: "Le théorème n'est pas exposé en cours ; il est établi en exercice : la partie Hadamard (exercice 16.52), puis les disques de Gershgorin (exercice 2.16, question 1)."
    - contenu: Pivot de Gauss, décomposition $LU$.
      cours:
      - "ma-16:6"
      - "ma-03:5"
      ex:
      - ma-16-47
      - ma-16-49
      themes:
      - systemes-lineaires-numeriques
      - decompositions-matricielles
      note: "Le pivot de Gauss est exposé ; la décomposition LU ne l'est pas."
    - contenu: "Méthodes itératives (par exemple méthode de Jacobi, méthode de Gauss-Seidel) ; analyse de convergence : normes subordonnées, rayon spectral."
      cours:
      - "l3-cd-01:8"
      - "mp-05:3"
      ex:
      - l3-cd-01-31
      - l3-cd-01-32
      - mp-04-59
      themes:
      - systemes-lineaires-numeriques
      - rayon-spectral
      - normes-subordonnees
      note: Les normes subordonnées et le rayon spectral sont exposés ; les méthodes de Jacobi et de Gauss-Seidel ne le sont pas.
    - contenu: Décomposition en valeurs singulières.
      ex:
      - mp-07-62
      themes:
      - valeurs-singulieres
      note: "La décomposition en valeurs singulières n'est établie qu'en exercice."
    - contenu: Exemple de la matrice de discrétisation par différences finies du laplacien en dimension un.
      ex:
      - mp-02-28
      themes:
      - differences-finies
      - matrices-particulieres
      note: "L'exercice calcule les éléments propres de la matrice tridiagonale dont se déduit celle du laplacien discret ; la discrétisation elle-même n'est pas traitée."
  - intitule: "12.2 Méthodes itératives de résolution approchée d'équations réelles et vectorielles"
    points:
    - contenu: "Cas des systèmes linéaires : méthodes itératives."
      ex:
      - mp-04-59
      themes:
      - systemes-lineaires-numeriques
      note: "Les méthodes itératives ne sont pas exposées ; l'exercice établit le critère de convergence par le rayon spectral."
    - contenu: "Recherche d'éléments propres : méthode de la puissance."
      ex:
      - mp-07-61
      themes:
      - valeurs-propres-numeriques
      note: "La méthode de la puissance n'est traitée qu'en exercice, pour une matrice symétrique."
    - contenu: Optimisation de fonctions convexes en dimension finie, méthode du gradient à pas constant, moindres carrés.
      cours:
      - "l3-cd-05:2"
      - "ma-19:6"
      ex:
      - ma-19-45
      - mp-17-46
      - mp-10-47
      - mp-17-49
      themes:
      - optimisation
      - projection-orthogonale
      - descente-gradient
      note: "La convexité et les moindres carrés sont traités ; la méthode du gradient à pas constant ne l'est pas."
    - contenu: "Problèmes non linéaires réels et vectoriels : méthode de dichotomie, méthode de Picard, méthode de Newton, vitesse de convergence et estimation de l'erreur."
      cours:
      - "ma-08:4"
      - "l3-cd-01:9"
      - "l3-cd-03:2"
      ex:
      - ma-08-24
      - ma-09-21
      - l3-cd-03-01
      - mp-04-54
      - l3-cd-07-10
      themes:
      - methode-newton
      - point-fixe
      - analyse-numerique
  - intitule: 12.3 Intégration numérique
    points:
    - contenu: "Méthode des rectangles, estimation de l'erreur."
      cours:
      - "ma-18:6"
      ex:
      - ma-18-42
      - ma-18-45
      themes:
      - quadrature
      - sommes-riemann
    - contenu: "Méthode de Monte-Carlo : vitesse de convergence, application au calcul d'intégrales multiples."
      themes:
      - simulation-monte-carlo
  - intitule: 12.4 Approximation de fonctions numériques
    points:
    - contenu: "Interpolation de Lagrange : polynôme de Lagrange d'une fonction en $(n+1)$ points, estimation de l'erreur."
      cours:
      - "ma-13:8"
      ex:
      - ma-13-38
      - ma-13-39
      - ma-16-27
      themes:
      - interpolation
      note: "Le polynôme d'interpolation de Lagrange est exposé ; l'estimation de l'erreur d'interpolation ne l'est pas."
  - intitule: 12.5 Équations différentielles ordinaires
    points:
    - contenu: "Aspects numériques du problème de Cauchy : méthode d'Euler explicite, consistance, stabilité, convergence, ordre."
