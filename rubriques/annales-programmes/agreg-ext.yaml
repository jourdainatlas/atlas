- intitule: Géométries affine et euclidienne
  objectif: Tous les espaces considérés dans ce chapitre sont de dimension finie.
  blocs:
  - intitule: a)
    points:
    - contenu: Espace affine et espace vectoriel associé.
      cours:
      - "ma-14:9"
      themes:
      - geometrie-affine
      note: "Le site ne présente que le modèle d'un espace vectoriel vu comme espace affine (points, vecteurs, direction) ; la définition axiomatique d'un espace affine n'est pas exposée."
    - contenu: Application affine et application linéaire associée.
      themes:
      - geometrie-affine
    - contenu: Sous-espaces affines, barycentres.
      cours:
      - "ma-14:9"
      ex:
      - ma-14-67
      - ma-14-69
      - ma-13-69
      themes:
      - geometrie-affine
      - barycentres-bezier
      note: "Les sous-espaces affines sont traités dans un espace vectoriel ; les barycentres ne sont pas exposés et n'apparaissent qu'en exercice (exercice 13.69)."
    - contenu: "Repères affines, équations d'un sous-espace affine."
      cours:
      - "ma-14:9"
      ex:
      - ma-14-67
      themes:
      - geometrie-affine
      note: "Le cours décrit un sous-espace affine comme ensemble des solutions d'une équation linéaire u(x) = b et donne des équations de droites et de plans de R^2 et R^3 ; les repères affines ne sont\
        \ pas exposés."
    - contenu: Groupe affine, notion de propriété affine.
      ex:
      - ma-11-10
      - ma-11-51
      - m-galois-15
      themes:
      - geometrie-affine
      - groupes
      note: Seul le groupe affine de la droite (sur R ou sur F_p) est étudié, en exercice.
    - contenu: Groupe des homothéties-translations, affinités.
      cours:
      - "ma-04:9"
      ex:
      - ma-04-49
      themes:
      - geometrie-complexe
      - geometrie-affine
      note: Homothéties et translations du plan en écriture complexe seulement ; les affinités ne sont pas traitées.
    - contenu: "Parties convexes, enveloppe convexe d'une partie d'un espace affine réel, points extrémaux."
      cours:
      - "mp-04:2"
      ex:
      - l3-cd-01-05
