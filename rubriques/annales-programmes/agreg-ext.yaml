# Programme officiel « Programme de l'agrégation externe de mathématiques (session 2027) » (Concours externe de l'agrégation du second degré, section mathématiques, programme de la session 2027 (publié le 6 mai 2026 sur devenirenseignant.gouv.fr)), structuré pour la vue « Programme »
# des Annales (MEMO_atlas_annales.md §45). Liens : cours « chapitre:section » (rang du sommaire, à partir de 1),
# exercices, thèmes d'annales ; un point sans cours ni exercice est affiché « à venir ».
id: agreg-ext
intitule: "Programme de l'agrégation externe de mathématiques (session 2027)"
source:
  nom: "Concours externe de l'agrégation du second degré, section mathématiques, programme de la session 2027 (publié le 6 mai 2026 sur devenirenseignant.gouv.fr)"
  url: "https://www.devenirenseignant.gouv.fr/media/20311/download"
preambule: "Le programme n'est pas rédigé comme un plan de cours : il décrit un ensemble de connaissances que le candidat doit maîtriser et savoir illustrer, avec des répétitions lorsque des notions interviennent\
  \ suivant différents points de vue, et les exemples cités y sont purement indicatifs ; dans les titres 1 à 5, tous les corps sont supposés commutatifs. Il comporte douze titres (algèbre linéaire ; groupes\
  \ ; anneaux, corps et polynômes ; formes bilinéaires et quadratiques ; géométries affine et euclidienne ; analyse réelle ; analyse complexe ; topologie ; calcul différentiel ; calcul intégral ; probabilités\
  \ et statistiques ; méthodes numériques), qui constituent le programme des deux épreuves écrites (composition de mathématiques générales et composition d'analyse et probabilités, chacune de six heures\
  \ et de coefficient 4 selon la page des épreuves de devenirenseignant.gouv.fr, le texte du programme ne donnant ni durée ni coefficient) et des deux premières épreuves orales (algèbre et géométrie ; analyse\
  \ et probabilités), communes à toutes les options. La troisième épreuve orale, de modélisation, porte en outre sur un programme spécifique à l'option choisie (A : probabilité et statistiques ; B : calcul\
  \ scientifique ; C : algèbre et calcul formel), qui n'est pas transcrit ici ; pour la session 2027 le texte ne mentionne que ces trois options."
