  - intitule: "7.2 Fonctions d'une variable complexe · a)"
    points:
    - contenu: Fonctions holomorphes.
      cours:
      - "l3-in-05:4"
      themes:
      - analyse-complexe
      note: "Seule la définition d'une fonction holomorphe est donnée, au service des intégrales à paramètre complexe."
    - contenu: Conditions de Cauchy-Riemann.
      ex:
      - ma-22-13
      themes:
      - analyse-complexe
      note: "Seul un exercice établit les équations de Cauchy-Riemann, pour les fonctions polynomiales (exercice 22.13) ; l'équivalence avec l'holomorphie n'est pas traitée."
    - contenu: "Intégrale d'une fonction continue le long d'un chemin $\\mathcal{C}^1$ par morceaux."
      ex:
      - mp-13-41
      themes:
      - analyse-complexe
      note: "L'intégrale le long d'un lacet n'apparaît que dans l'exercice sur l'indice (exercice 13.41), pour la seule fonction z ↦ 1/(z − a)."
    - contenu: "Primitives d'une fonction holomorphe."
      themes:
      - analyse-complexe
    - contenu: Déterminations du logarithme.
      ex:
      - mp-05-55
      themes:
      - exponentielle-complexe
      - analyse-complexe
      note: "Seule l'inexistence d'un logarithme continu sur C* est établie, en exercice."
    - contenu: "Théorème d'holomorphie sous le signe intégrale."
      cours:
      - "l3-in-05:4"
      themes:
      - integrales-parametre
      - analyse-complexe
  - intitule: "7.2 Fonctions d'une variable complexe · b)"
    points:
    - contenu: "Indice d'un chemin fermé $\\mathcal{C}^1$ par morceaux par rapport à un point."
      ex:
      - mp-13-41
      themes:
      - analyse-complexe
      note: "Indice d'un lacet C^1 étudié en exercice (valeurs entières, constance sur les composantes)."
  - intitule: "7.2 Fonctions d'une variable complexe · c)"
    points:
    - contenu: Formules de Cauchy.
      ex:
      - mp-09-15
      themes:
      - analyse-complexe
      note: "Seule la formule de Cauchy pour les coefficients d'une série entière sur un cercle est établie, en exercice (exercice 9.15), avec les inégalités de Cauchy et le théorème de Liouville."
    - contenu: "Analyticité d'une fonction holomorphe."
      themes:
      - analyse-complexe
    - contenu: Principe des zéros isolés.
      ex:
      - mp-09-19
      themes:
      - analyse-complexe
      - series-entieres
      note: "Seul le cas d'une série entière de la variable réelle, au voisinage de son centre, est traité en exercice (exercice 9.19) ; le passage aux fonctions holomorphes sur un ouvert connexe n'est\
        \ pas fait."
    - contenu: Principe du prolongement analytique.
      themes:
      - analyse-complexe
    - contenu: Principe du maximum.
      themes:
      - analyse-complexe
  - intitule: "7.2 Fonctions d'une variable complexe · d)"
    points:
