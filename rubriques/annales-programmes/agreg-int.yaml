        \ I_p$ de $\\mathbb{R}$, $P(\\{X_1 \\in I_1\\} \\cap \\dots \\cap \\{X_p \\in I_p\\}) = \\int_{I_1} \\dots \\int_{I_p} f(x_1, \\dots, x_p)\\,\\mathrm{d}x_1 \\dots \\mathrm{d}x_p$."
