        \ différentielle, ch. 5, section 7), et la longueur d'un arc dans Licence 3 – Géométrie différentielle, ch. 1, section 4 ; le travail d'une force n'est pas nommé."
    - contenu: "Formule de Fubini et définition de l'intégrale double d'une fonction continue sur un rectangle $[a, b] \\times [c, d]$. Adaptation à l'intégrale triple."
      demo: admis
      cours:
