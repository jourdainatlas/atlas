    - contenu: Produit vectoriel. Produit mixte.
      cours:
      - "mp-07:3"
      ex:
      - mp-07-28
      - mp-07-41
      - mp-07-29
      themes:
      - geometrie-euclidienne
  - intitule: 6.5 Espaces hermitiens
    points:
    - contenu: Inégalité de Cauchy-Schwarz et inégalité triangulaire ; norme hermitienne.
      cours:
      - "mp-10:2"
      ex:
      - mp-10-02
      - mp-10-06
      - l3-hf-01-02
      themes:
      - espaces-hermitiens
      - cauchy-schwarz
    - contenu: Sommes directes orthogonales. Bases orthonormales.
      cours:
      - "mp-10:3"
      ex:
      - mp-10-11
      - mp-10-17
      - mp-10-46
      themes:
      - espaces-hermitiens
    - contenu: "Adjoint d'un endomorphisme, matrice dans une base orthonormale."
      cours:
      - "mp-10:7"
      ex:
      - mp-10-39
      - l3-hf-04-06
      - mp-10-17
      themes:
      - espaces-hermitiens
      - adjoint-normaux
    - contenu: "Endomorphismes hermitiens. Groupe unitaire $\\mathrm{U}(E)$ et spécial unitaire $\\mathrm{SU}(E)$."
      cours:
      - "mp-10:7"
      ex:
      - mp-10-40
      - mp-10-41
      - mp-10-43
      - l3-hf-04-12
      themes:
      - espaces-hermitiens
      note: "Le groupe spécial unitaire SU(E) n'est pas traité."
    - contenu: "Réduction d'un endomorphisme hermitien, endomorphismes hermitiens positifs, applications (norme d'un endomorphisme)."
      cours:
      - "mp-10:7"
      ex:
      - mp-10-41
      - l3-hf-04-11
      - mp-10-42
      - mp-10-45
      themes:
      - espaces-hermitiens
      note: "Les endomorphismes hermitiens positifs ne sont abordés que dans l'exercice 10.42. La norme d'un endomorphisme n'est traitée qu'en exercice : l'exercice 7.46 dans le cas euclidien (la norme\
        \ d'un autoadjoint est le plus grand module de ses valeurs propres), exercice 4.11 (Licence 3 – Espaces de Hilbert et séries de Fourier) dans un espace de Hilbert complexe (‖T*T‖ = ‖T‖²) ; l'égalité\
        \ entre la norme d'un endomorphisme hermitien et le plus grand module de ses valeurs propres n'est pas établie dans le cas complexe."
- intitule: Géométrie affine réelle en dimension finie
  blocs:
  - points:
    - contenu: "Définition d'un espace affine réel. Espace vectoriel associé."
      cours:
      - "ma-14:9"
      themes:
      - geometrie-affine
      note: "Le site présente la structure affine d'un espace vectoriel (points, vecteurs, translations), pas la définition axiomatique d'un espace affine."
    - contenu: "Sous-espaces affines, direction d'un sous-espace affine. Droites, plans, hyperplans."
      cours:
      - "ma-14:9"
      ex:
      - ma-14-67
      - t-04-20
      - ma-14-69
      themes:
      - geometrie-affine
    - contenu: "Repères. Orientation. Volume algébrique d'un parallélépipède orienté."
      cours:
      - "ma-17:3"
      - "mp-07:3"
      - "l3-in-06:2"
      ex:
      - ma-17-23
      themes:
      - determinants
      - geometrie-affine
      note: "Repères affines non traités ; l'orientation et le produit mixte sont vus par le déterminant (MPSI ch. 17, MP ch. 7) ; l'interprétation du déterminant comme volume, admise en MPSI, est démontrée\
        \ au chapitre 6 d'intégration de L3."
    - contenu: "Applications affines. Projecteurs. Groupe affine. Isomorphisme entre le stabilisateur d'un point et le groupe linéaire."
      ex:
      - ma-11-10
      themes:
      - geometrie-affine
      note: "Applications affines, projecteurs affines et isomorphisme entre stabilisateur d'un point et groupe linéaire ne sont pas traités ; seuls les projecteurs vectoriels le sont (Maths Sup – MPSI,\
        \ ch. 14, section 7), et l'exercice 11.10 étudie le groupe affine de la droite réelle."
    - contenu: "Symétries. Groupe des homothéties et translations. Effet d'une application affine sur les volumes."
      cours:
      - "ma-04:9"
      - "ma-17:4"
      - "l3-in-06:2"
      ex:
      - ma-04-49
      themes:
      - geometrie-affine
      - geometrie-complexe
      note: "Homothéties et translations ne sont étudiées que dans le plan complexe (similitudes directes) ; l'effet sur les volumes est établi pour une application linéaire (aires en MPSI, mesure de Lebesgue\
        \ en L3), la translation ne changeant pas les volumes."
    - contenu: Barycentres. Repères et coordonnées barycentriques. Isobarycentre.
      ex:
      - ma-19-06
      - me-08-25
      - t-04-36
      - ma-13-69
      themes:
      - barycentres-bezier
      - geometrie-affine
      note: "Le cours ne définit pas les barycentres ; les exercices travaillent l'isobarycentre (centre de gravité) et les combinaisons convexes."
    - contenu: "Parties convexes. Intersection, images directe et réciproque par une application affine. Enveloppe convexe d'une partie. Exemples de problèmes d'optimisation."
      cours:
      - "mp-04:2"
      ex:
      - l3-cd-01-35
      - ma-13-69
      - mp-10-52
      themes:
      - convexite-ensembles
      - projection-convexe
      - points-extremaux
      note: "Seule la définition d'une partie convexe est donnée (avec la convexité des boules) ; enveloppe convexe et images par une application affine ne sont pas traitées."
- intitule: Géométrie affine euclidienne orientée
  objectif: Pour toutes les situations géométriques, on distinguera les propriétés de caractère affine et celles de nature métrique (ou euclidienne), ainsi pour les coniques ou pour certaines notions différentielles
    (tangentes, normales, courbure, etc.).
  blocs:
  - intitule: 8.1 Préliminaires
    points:
    - contenu: "Exemples d'utilisation de repères pour traiter des problèmes de géométrie."
      ex:
      - t-04-25
      - t-04-26
      - me-08-14
      - t-04-34
      themes:
      - geometrie-euclidienne
  - intitule: 8.2 Généralités
    points:
    - contenu: Espaces affines euclidiens. Distance de deux points. Inégalité triangulaire.
      cours:
      - "ma-19:3"
      ex:
      - ma-19-10
      - t-04-35
      - me-08-28
      themes:
      - geometrie-euclidienne
      - prehilbertiens
    - contenu: Groupes des isométries et des déplacements. Génération du groupe des isométries par les réflexions, du groupe des déplacements par les demi-tours en dimension 3.
      cours:
      - "mp-07:3"
      ex:
      - mp-07-25
      - mp-07-23
      - mp-07-35
      themes:
      - isometries-affines
      - isometries
      note: Le site traite le groupe orthogonal vectoriel (engendré par les réflexions, exercice 7.35), pas le groupe des isométries affines ni les demi-tours.
    - contenu: "Décomposition canonique d'une isométrie en $u = t \\circ f = f \\circ t$ où $t$ est une translation et $f$ une isométrie admettant au moins un point fixe."
      themes:
      - isometries-affines
    - contenu: Application à la classification des isométries en dimension 2 et 3.
      cours:
      - "mp-07:4"
      - "mp-07:5"
      ex:
      - mp-07-11
      - mp-07-26
      - mp-07-28
      - mp-07-30
      themes:
      - isometries-affines
      - isometries
      - matrices-orthogonales
      note: "Classification des isométries vectorielles du plan et de l'espace seulement ; le passage aux isométries affines n'est pas fait."
    - contenu: "Exemples de groupes d'isométries laissant stable une partie du plan ou de l'espace. Polygones réguliers et groupes diédraux. Tétraèdres réguliers, cubes, octaèdres."
      cours:
      - "m-galois:1"
      - "m-galois:2"
      ex:
      - m-galois-05
      themes:
      - isometries-affines
      - groupes
      note: "Les groupes diédraux d'ordre 6 et 8 servent d'exemples ; les groupes du tétraèdre, du cube et de l'octaèdre ne sont qu'évoqués."
    - contenu: Groupe des similitudes affines du plan.
      cours:
      - "ma-04:9"
      - "ma-11:3"
      ex:
      - ma-04-49
      - ma-04-53
      themes:
      - geometrie-complexe
      note: Le site étudie le groupe des similitudes directes ; les similitudes indirectes ne sont que mentionnées.
  - intitule: 8.3 Géométrie plane
    points:
    - contenu: Propriétés angulaires du cercle (angles au centre, angles inscrits) et applications.
      themes:
      - geometrie-euclidienne
    - contenu: Géométrie du triangle, éléments remarquables. Exemples de relations métriques et trigonométriques dans le triangle.
      ex:
      - me-08-14
      - p-07-34
      - t-04-36
      - t-04-38
      - me-08-31
      - ma-22-35
      themes:
      - geometrie-triangle
      note: "Pas de section de cours sur le triangle ; les exercices traitent Al-Kashi, médianes, hauteurs, droite d'Euler et point de Fermat."
    - contenu: "Utilisation des nombres complexes : affixe d'un point dans un repère orthonormé direct, équations de droites et de cercles. Exemples d'applications géométriques (polygones réguliers, géométrie\
        \ des cercles)."
      cours:
      - "ma-04:9"
      - "ma-04:7"
      ex:
      - ma-04-48
      - me-08-06
      - ma-04-58
      - ma-04-52
      - me-08-18
      - me-08-27
      themes:
      - geometrie-complexe
      - racines-unite
    - contenu: "Puissance d'un point par rapport à un cercle. Axe radical de deux cercles. Orthogonalité entre cercles."
      ex:
      - p-07-35
      - t-04-37
      themes:
      - geometrie-euclidienne
      note: "La puissance d'un point n'est travaillée qu'en exercice (cercle de diamètre donné dans le plan, sphère dans l'espace) ; axe radical et cercles orthogonaux ne sont pas traités."
  - intitule: 8.4 Coniques
    points:
    - contenu: "Définitions bifocale et par foyer et directrice. Classification par l'excentricité. Équations réduites."
      themes:
      - coniques
    - contenu: "Image par une application affine et classification affine : ellipse, parabole, hyperbole."
      themes:
      - coniques
    - contenu: "Équations polaires des coniques propres lorsque l'origine est en un foyer."
      themes:
      - coniques
    - contenu: Exemples de propriétés géométriques communes ou spécifiques à chaque genre.
      themes:
      - coniques
    - contenu: "Sections planes d'un cône de révolution."
      themes:
      - coniques
    - contenu: "Trajectoire parabolique d'un objet pesant dans un champ de pesanteur. Mouvement à accélération centrale, notions sur le mouvement des planètes."
- intitule: Analyse réelle et complexe
  blocs:
  - intitule: 9.1 Nombres réels, nombres complexes
    points:
    - contenu: "Corps $\\mathbb{R}$ des nombres réels et $\\mathbb{C}$ des nombres complexes."
      cours:
      - "ma-07:2"
      - "ma-04:3"
      ex:
      - ma-07-04
      - ma-07-02
      - ma-04-16
      themes:
      - nombres-complexes
    - contenu: "Suites convergentes, divergentes, suites extraites, valeurs d'adhérence. Opérations sur les limites."
      cours:
      - "ma-07:4"
      - "ma-07:6"
      ex:
      - ma-07-09
      - ma-07-10
      - ma-07-11
      - ma-07-26
      - ma-07-29
      - ma-07-53
      themes:
      - suites
      - valeurs-adherence
    - contenu: "Toute partie non vide majorée de $\\mathbb{R}$ possède une borne supérieure."
      cours:
      - "ma-07:2"
      ex:
      - ma-07-01
      - ma-07-03
      - ma-07-46
      - ma-07-05
    - contenu: Toute suite croissante majorée est convergente. Suites adjacentes, théorème des segments emboités. Droite numérique achevée.
      cours:
      - "ma-07:5"
      - "ma-07:2"
      ex:
      - ma-07-18
      - ma-07-19
      - ma-07-20
      - ma-07-22
      - ma-07-21
      themes:
      - suites
      note: "Le théorème des segments emboîtés n'est pas énoncé comme tel ; il résulte des suites adjacentes."
    - contenu: "Complétude de $\\mathbb{R}$ : toute suite de Cauchy de $\\mathbb{R}$ converge."
      cours:
      - "l3-cd-01:6"
      ex:
      - mp-04-18
      - ma-07-51
      themes:
      - suites
      note: "Les suites de Cauchy ne sont définies qu'au chapitre de L3 ; en MPSI et en MP elles n'apparaissent qu'en exercice."
    - contenu: "Théorème de Bolzano-Weierstrass : de toute suite bornée de $\\mathbb{R}$ on peut extraire une sous-suite convergente. Extension de ces résultats à $\\mathbb{C}$."
      cours:
      - "ma-07:6"
      - "ma-07:8"
      ex:
      - ma-07-31
      - ma-07-30
      - ma-07-53
      themes:
      - valeurs-adherence
      - compacite
      - suites
    - contenu: "Développement décimal d'un nombre réel. Cas des nombres rationnels."
      cours:
      - "ma-07:2"
      ex:
      - ma-07-07
      themes:
      - rationnels-decimaux
      - numeration
      note: "Le cours traite les approximations décimales d'un réel, pas le développement décimal illimité ni la périodicité pour les rationnels."
    - contenu: "Comportement asymptotique d'une suite. Relations de comparaison : domination, prépondérance ($u$ est négligeable devant $v$), équivalence. Notations $u = O(v)$ et $u = o(v)$."
      cours:
      - "ma-10:2"
      - "ma-10:5"
      ex:
      - ma-10-01
      - ma-10-03
      - ma-10-06
      - ma-10-10
      themes:
      - equivalents
      - asymptotique
    - contenu: "Suites de nombres réels définies par une relation de récurrence $u_{n+1} = f(u_n)$."
      cours:
      - "ma-07:9"
      - "ma-09:3"
      ex:
      - ma-07-38
      - ma-07-39
      - ma-07-40
      - ma-09-21
      - ma-10-42
      - ma-07-41
      themes:
      - suites-recurrentes
      - point-fixe
    - contenu: Suites définies par une relation de récurrence linéaire à deux termes et à coefficients constants, ou par une relation homographique.
      cours:
      - "ma-07:9"
      ex:
      - ma-07-32
      - ma-07-33
      - ma-07-34
      - ma-07-35
      themes:
      - suites-recurrentes-lineaires
      - suites-recurrentes
  - intitule: 9.2 Séries de nombres réels ou complexes
    points:
    - contenu: Séries à termes positifs. La série converge si et seulement si la suite des sommes partielles est majorée.
      cours:
      - "ma-20:3"
      ex:
      - ma-20-08
      - ma-20-09
      themes:
      - series-numeriques
    - contenu: Étude de la convergence par utilisation des relations de comparaison, comparaison à une série géométrique, à une série de Riemann.
      cours:
