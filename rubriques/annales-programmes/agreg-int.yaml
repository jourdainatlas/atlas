      - "l3-cd-01:6"
      ex:
      - ma-20-30
      - ma-20-32
      - mp-06-48
      - ma-20-34
      themes:
      - series-numeriques
      note: "Le critère de Cauchy n'est énoncé qu'au chapitre de L3 (séries dans un espace de Banach)."
    - contenu: "Convergence d'une série alternée dont le terme général décroît vers 0 en valeur absolue, signe et majoration du reste."
