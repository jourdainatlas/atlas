      - ma-20-18
      - ma-03-16
      - ma-20-42
      - mp-06-56
      themes:
      - transformation-abel
      - series-numeriques
    - contenu: "Exemples d'emploi d'un développement asymptotique du terme général."
      cours:
      - "ma-20:5"
      ex:
      - ma-20-36
      - ma-20-38
      - ma-20-26
      - ma-20-43
      themes:
      - series-numeriques
      - asymptotique
    - contenu: Opérations sur les séries. Produit de Cauchy de deux séries absolument convergentes.
      cours:
      - "ma-20:7"
      - "ma-20:2"
      ex:
      - ma-20-53
      - mp-09-25
      themes:
      - familles-sommables
      - series-numeriques
  - intitule: 9.3 Continuité
    points:
