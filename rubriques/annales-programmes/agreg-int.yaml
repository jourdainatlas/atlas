      - "ma-20:5"
      ex:
      - ma-20-35
      - ma-20-36
      - mp-06-33
      - ma-20-40
      - ma-20-41
      themes:
      - series-alternees
    - contenu: "Exemples d'emploi de la transformation d'Abel."
