  - intitule: "9.10 Intégrales sur un intervalle quelconque d'une fonction dépendant d'un paramètre"
    points:
    - contenu: "Théorème de continuité : soient $X$ un ouvert de $\\mathbb{R}^n$, $I$ un intervalle ouvert de $\\mathbb{R}$ et $f$ une fonction définie sur $X \\times I$ et à valeurs complexes. On suppose\
        \ que, pour tout $t$ dans $I$, la fonction partielle $x \\mapsto f(x, t)$ est continue sur $X$ et que, pour tout $x$ dans $X$, la fonction partielle $t \\mapsto f(x, t)$ est continue par morceaux\
        \ sur $I$. S'il existe une fonction $g$ intégrable sur $I$ et telle que, pour tout $x$ dans $X$ et tout $t$ dans $I$, $|f(x, t)| \\leqslant g(t)$, alors la fonction $F$ associant à $x$ de $X$ l'intégrale\
        \ de $f(x, t)$ sur $I$ est continue sur $X$."
      cours:
      - "mp-13:4"
      - "l3-in-05:2"
      ex:
      - mp-13-18
      - mp-13-19
      - mp-13-21
      - mp-13-22
      - mp-13-24
      themes:
      - integrales-parametre
    - contenu: "Théorème de dérivation : soient $X$ et $I$ deux intervalles ouverts de $\\mathbb{R}$ et $f$ une fonction définie sur $X \\times I$ et à valeurs complexes, telle que, pour tout $x$ dans $X$,\
        \ la fonction partielle $t \\mapsto f(x, t)$ est intégrable sur $I$. On suppose que $f$ admet une dérivée partielle $f'_x(x, t)$ en tout point de $X \\times I$, que pour tout $t$ dans $I$, la fonction\
        \ $x \\mapsto f'_x(x, t)$ est continue sur $X$. S'il existe une fonction $h$ intégrable sur $I$ et telle que, pour tout $x$ dans $X$ et tout $t$ dans $I$, $|f'_x(x, t)| \\leqslant h(t)$, alors la\
        \ fonction $F$ associant à $x$ de $X$ l'intégrale de $f(x, t)$ sur $I$ est dérivable sur $X$ et on a $F'(x) = \\int_I f'_x(x, t)\\,\\mathrm{d}t$."
      cours:
      - "mp-13:5"
      - "l3-in-05:3"
      ex:
      - mp-13-25
      - mp-13-26
      - mp-13-27
      - mp-13-28
      - mp-13-29
      - mp-13-34
      themes:
      - integrales-parametre
    - contenu: "Application des théorèmes précédents à la fonction Gamma d'Euler, à la transformée de Fourier, à la transformée de Laplace."
      cours:
      - "mp-13:6"
      - "l3-in-05:5"
      - "l3-in-05:6"
      ex:
      - mp-13-35
      - l3-in-05-17
      - mp-13-21
      - mp-13-22
      - mp-13-36
      - mp-13-37
      themes:
      - fonction-gamma
      - transformee-fourier
      - transformee-laplace
