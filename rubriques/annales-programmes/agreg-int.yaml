# Programme officiel « Programme de l'agrégation interne de mathématiques et du CAERPA (session 2027) » (Concours interne de l'agrégation et CAER-PA, section mathématiques, programme de la session 2027 (publié en octobre 2026 sur devenirenseignant.gouv.fr ; le programme de la session 2026 est reconduit)), structuré pour la vue « Programme »
# des Annales (MEMO_atlas_annales.md §45). Liens : cours « chapitre:section » (rang du sommaire, à partir de 1),
# exercices, thèmes d'annales ; un point sans cours ni exercice est affiché « à venir ».
id: agreg-int
intitule: "Programme de l'agrégation interne de mathématiques et du CAERPA (session 2027)"
source:
  nom: "Concours interne de l'agrégation et CAER-PA, section mathématiques, programme de la session 2027 (publié en octobre 2026 sur devenirenseignant.gouv.fr ; le programme de la session 2026 est reconduit)"
  url: "https://www.devenirenseignant.gouv.fr/media/21306/download"
preambule: "Les épreuves écrites et orales de l'agrégation interne et du CAERPA (section mathématiques) portent sur tous les programmes de l'enseignement secondaire en vigueur, de la classe de seconde à\
  \ la terminale incluse, et dans toutes les sections, ainsi que sur le programme complémentaire reproduit ici, organisé en treize rubriques allant des ensembles et de la logique au calcul intégral et aux\
  \ probabilités. L'admissibilité comporte deux épreuves écrites de six heures (coefficient 5 chacune) ; l'admission comporte deux épreuves orales d'une heure, après trois heures de préparation avec documents\
  \ (coefficient 5 chacune), l'une présentant une séquence d'enseignement, l'autre un choix d'exemples et d'exercices sur un thème donné, chacune faite d'un exposé suivi d'un entretien. Les épreuves orales\
  \ portent sur le programme de l'enseignement du second degré et sur une partie du programme complémentaire de l'écrit."
sections:
- intitule: Ensembles et logique
  blocs:
  - points:
    - contenu: "Vocabulaire de la théorie des ensembles. Produit d'un nombre fini d'ensembles. Applications. Relations d'ordre."
      cours:
      - "ma-01:5"
      - "ma-02:2"
      - "ma-02:8"
      ex:
      - ma-01-36
      - ma-02-05
      - ma-02-12
      - ma-02-35
      - ma-02-36
      themes:
      - relations-binaires
    - contenu: "Ensemble $\\mathbb{N}$ des entiers naturels. Ensembles dénombrables. Dénombrabilité de l'union d'une suite d'ensembles dénombrables."
      cours:
      - "mp-14:2"
      ex:
      - mp-14-01
      - mp-14-03
      - mp-14-42
      themes:
      - denombrabilite
      note: "L'ensemble N lui-même n'est pas construit : il est pris comme donné."
    - contenu: "Relations d'équivalence et ensemble quotient."
      cours:
      - "ma-02:7"
      ex:
      - ma-02-30
      - ma-02-32
      - ma-02-33
      - ma-02-34
      themes:
      - relations-binaires
- intitule: Algorithmique et informatique
  objectif: "Aucun développement théorique n'est exigé."
  blocs:
  - points:
    - contenu: "Notions de variable et de type. Instructions d'affectation, conditionnelles, d'itération."
      cours:
      - "py-01:2"
      - "py-01:3"
      - "py-01:4"
      ex:
      - py-01-05
      - py-01-07
      - py-01-12
      - py-01-16
      - py-01-20
      themes:
      - informatique
    - contenu: "Fonctions et procédures (ou sous-programmes) : définition, passage de paramètre, variables locales, notion de récursivité."
      cours:
      - "py-01:6"
      ex:
      - py-01-23
      - py-01-24
      - py-01-25
      - py-01-27
      themes:
      - informatique
      note: "La récursivité n'est pas traitée par le cours de Python du site."
    - contenu: "Rédaction en français ou dans un langage au choix du candidat de programmes ne comportant qu'un faible nombre d'instructions et pouvant utiliser des fonctions (ou sous-programmes)."
      cours:
      - "py-01:8"
      ex:
      - py-01-22
      - py-01-27
      - py-01-34
      - py-01-36
      themes:
      - informatique
    - contenu: "Exemples d'algorithmes illustrant les notions figurant dans le présent programme."
      cours:
      - "py-01:8"
      ex:
      - py-01-27
      - py-01-36
      - py-01-37
      - py-01-43
      themes:
      - informatique
      - algorithmique-arithmetique
- intitule: Algèbre générale
  blocs:
  - intitule: 3.1 Extensions successives de la notion de nombre
    points:
    - contenu: "Anneau $\\mathbb{Z}$ des entiers relatifs. Division euclidienne. Sous-groupes additifs et idéaux de $\\mathbb{Z}$."
      cours:
      - "ma-12:2"
      - "mp-01:4"
      ex:
      - ma-12-01
      - ma-12-03
      - mp-01-27
      - l3-sa-02-01
      - mp-01-28
      themes:
      - arithmetique
      - anneaux
    - contenu: Nombres premiers. Décomposition en facteurs premiers.
      cours:
      - "ma-12:5"
      ex:
      - ma-12-24
      - ma-12-27
      - ma-12-32
      - ma-12-33
      themes:
      - nombres-premiers
    - contenu: "Plus grand commun diviseur (PGCD) et plus petit commun multiple (PPCM). Théorème de Bachet-Bézout. Algorithme d'Euclide étendu."
      cours:
      - "ma-12:3"
      - "ma-12:4"
      ex:
      - ma-12-08
      - me-07-12
      - ma-12-16
      - ma-12-20
      - py-01-27
      themes:
      - pgcd-bezout
      - algorithmique-arithmetique
    - contenu: "Congruences. Applications arithmétiques des anneaux quotients $\\mathbb{Z}/n\\mathbb{Z}$. Théorème chinois. Groupe des éléments inversibles de $\\mathbb{Z}/n\\mathbb{Z}$."
      cours:
      - "ma-12:6"
      - "mp-01:5"
      ex:
      - ma-12-38
      - mp-01-32
      - ma-12-41
      - mp-01-36
      - mp-01-38
      - mp-01-40
      themes:
      - congruences
      - restes-chinois
      - groupe-inversibles-zn
    - contenu: Applications à des problèmes de calendriers. Exemples de méthodes de codage et de cryptage. Équations diophantiennes $ax + by = c$.
      cours:
      - "ma-12:4"
      - "mp-01:5"
      ex:
      - ma-12-14
      - me-07-24
      - me-07-31
      - me-04-25
      - me-04-26
      - l3-sa-03-09
      themes:
      - equations-diophantiennes
      - cryptographie
      - congruences
      note: Les problèmes de calendriers ne sont pas traités ; le cryptage RSA est un exemple du cours de MP et un exercice de Maths expertes.
    - contenu: "Corps $\\mathbb{Q}$ des nombres rationnels, $\\mathbb{R}$ des nombres réels, $\\mathbb{C}$ des nombres complexes. Théorème de d'Alembert-Gauss."
      cours:
      - "ma-07:2"
      - "ma-04:3"
      - "mp-05:5"
      ex:
      - ma-02-32
      themes:
      - nombres-complexes
      - racines-polynomes
      note: "Le théorème de d'Alembert-Gauss, admis en MPSI, est démontré au chapitre 5 de MP (section citée)."
    - contenu: "Non-dénombrabilité de $\\mathbb{R}$."
      cours:
      - "mp-14:2"
      ex:
      - mp-14-02
      themes:
      - denombrabilite
    - contenu: "Groupe multiplicatif des nombres complexes de module 1. Sous-groupes des racines $n$-ièmes de l'unité. Relations d'inclusion entre ces groupes. Polygones réguliers."
      cours:
      - "ma-04:7"
      - "mp-01:2"
      ex:
      - ma-04-38
      - ma-04-40
      - ma-12-53
      - ma-04-43
      themes:
      - racines-unite
      - groupes-cycliques
  - intitule: 3.2 Anneaux et corps
    points:
    - contenu: Définition (les anneaux sont supposés unitaires par définition).
      cours:
      - "ma-11:4"
      ex:
      - ma-11-37
      - ma-11-40
      - ma-11-38
      - l3-sa-01-17
      themes:
      - anneaux
    - contenu: Formule du binôme pour des éléments commutables.
      cours:
      - "ma-11:4"
      - "ma-16:3"
      ex:
      - ma-11-36
      - ap-05-05
      - ma-16-09
      - ma-11-39
      themes:
      - anneaux
      - coefficients-binomiaux
    - contenu: "Idéaux d'un anneau commutatif. Anneaux quotients. Anneaux commutatifs intègres."
      cours:
      - "l3-sa-02:3"
      - "mp-01:3"
      - "ma-11:4"
      ex:
      - mp-01-13
      - mp-01-15
      - m-galois-20
      - mp-01-28
      - l3-sa-02-04
      - l3-sa-02-06
      themes:
      - anneaux
    - contenu: "Morphismes d'anneaux. Isomorphisme entre $\\operatorname{Im}(f)$ et $A/\\operatorname{Ker}(f)$ pour $f$ morphisme d'anneaux de $A$ dans $A'$."
      cours:
      - "l3-sa-02:3"
      - "m-galois:3"
      - "ma-11:4"
      ex:
      - ap-05-18
      - ma-11-45
      - mp-01-40
      - ma-11-48
      - l3-sa-02-05
      - l3-sa-02-07
      themes:
      - anneaux
    - contenu: Anneaux principaux. Exemple des entiers de Gauss, applications.
      cours:
      - "l3-sa-03:4"
      - "mp-01:6"
      - "m-galois:3"
      ex:
      - l3-sa-03-01
      - ap-05-07
      - l3-sa-03-07
      - l3-sa-03-11
      themes:
      - anneaux
      - entiers-algebriques
      - sommes-carres
    - contenu: "Sous-corps. Corps premier. Caractéristique d'un corps. Corps des fractions d'un anneau intègre."
      cours:
      - "l3-sa-01:5"
      - "l3-sa-01:4"
      - "ma-11:4"
      ex:
      - ma-11-43
      - l3-sa-01-19
      - ma-02-32
      - l3-sa-01-20
      themes:
      - corps
    - contenu: "Éléments algébriques, transcendants sur un sous-corps. Dénombrabilité du corps des nombres algébriques sur $\\mathbb{Q}$."
      cours:
      - "l3-sa-07:3"
      - "m-galois:4"
      ex:
      - l3-sa-07-06
      - ma-15-54
      - mp-14-01
      - m-galois-23
      - l3-sa-07-01
      themes:
      - corps
      - transcendance
      - denombrabilite
  - intitule: "3.3 Polynômes à une indéterminée sur un corps commutatif $\\mathbb{K}$"
    points:
    - contenu: "Algèbre $\\mathbb{K}[X]$. Division euclidienne. Idéaux de $\\mathbb{K}[X]$."
      cours:
      - "ma-13:2"
      - "ma-13:3"
      - "mp-01:6"
      ex:
      - ma-13-05
      - ma-13-08
      - mp-01-49
      - l3-sa-02-01
      - mp-01-54
      themes:
      - polynomes
      - arithmetique-polynomes
    - contenu: "Plus grand commun diviseur (PGCD) et plus petit commun multiple (PPCM). Théorème de Bézout. Algorithme d'Euclide."
      cours:
      - "ma-13:6"
      - "mp-01:6"
      ex:
      - ma-13-28
      - m-galois-18
      - ma-13-29
      - l3-sa-03-10
      - ma-13-30
      themes:
      - arithmetique-polynomes
    - contenu: Polynômes irréductibles. Décomposition en produit de facteurs irréductibles.
      cours:
      - "mp-01:6"
      - "l3-sa-05:4"
      - "m-galois:3"
      ex:
      - mp-01-53
      - ma-13-34
      - m-galois-22
      - m-galois-19
      - l3-sa-05-09
      - l3-sa-05-10
      themes:
      - arithmetique-polynomes
    - contenu: Fonctions polynômes. Racines, ordre de multiplicité, polynômes scindés.
      cours:
      - "ma-13:4"
      ex:
      - ma-13-10
      - ma-13-13
      - ma-13-22
      - ma-13-18
      themes:
      - racines-polynomes
    - contenu: "Correspondance entre polynômes et fonctions polynômes. Cas où $\\mathbb{K} = \\mathbb{Z}/p\\mathbb{Z}$, $p$ étant un nombre premier."
      cours:
      - "ma-13:4"
      themes:
      - polynomes
      note: "La correspondance est démontrée pour un corps infini ; le cas de Z/pZ n'est signalé que par une remarque (le polynôme X² − X s'annule sur {0, 1})."
    - contenu: "Relations entre coefficients et racines d'un polynôme scindé."
      cours:
      - "ma-13:4"
      - "l3-sa-06:2"
      ex:
      - ma-13-14
      - ma-13-15
      - ma-13-17
      - ma-13-57
      - l3-sa-06-02
      themes:
      - racines-polynomes
    - contenu: "Théorème de d'Alembert-Gauss, polynômes irréductibles sur $\\mathbb{R}$ et $\\mathbb{C}$."
      cours:
      - "ma-13:7"
      - "mp-05:5"
      - "m-galois:7"
      ex:
      - ma-13-11
      - ma-13-16
      - ma-13-34
      - ma-13-36
      - mp-01-51
      - ma-13-37
      themes:
      - racines-polynomes
      - arithmetique-polynomes
    - contenu: Dérivation des polynômes. Identité de Taylor lorsque la caractéristique est nulle.
      cours:
      - "ma-13:5"
      ex:
      - ma-13-19
      - ma-13-20
      - ma-13-21
      - ma-13-23
      - l3-sa-05-05
      themes:
      - polynomes
      - formules-taylor
  - intitule: "3.4 Fractions rationnelles sur un corps commutatif $\\mathbb{K}$"
    points:
    - contenu: "Corps $\\mathbb{K}(X)$ des fractions rationnelles. Forme irréductible."
      cours:
      - "ma-13:9"
      ex:
      - ma-13-40
      - ma-13-41
      - ma-13-43
      - ma-13-44
      themes:
      - fractions-rationnelles
    - contenu: Fonctions rationnelles, zéros, pôles, ordre de multiplicité des zéros et pôles.
      cours:
      - "ma-13:9"
      ex:
      - ma-13-41
      - ma-13-42
      - ma-13-43
      themes:
      - fractions-rationnelles
    - contenu: "Décomposition en éléments simples. Cas où le corps est $\\mathbb{R}$ ou $\\mathbb{C}$."
      cours:
      - "ma-13:10"
      ex:
      - ma-13-45
      - ma-13-46
      - ma-13-49
      - ma-13-48
      - ma-13-50
      - ma-13-52
      themes:
      - fractions-rationnelles
    - contenu: "Exemples simples de problèmes d'élimination ; applications à la géométrie."
      cours:
      - "l3-sa-06:3"
      ex:
      - l3-sa-06-09
      - l3-sa-06-10
      themes:
      - resultant
- intitule: Groupes et géométrie
  objectif: "Les diverses notions sur les groupes ont vocation à être illustrées dans des situations géométriques (par exemple, isométries d'un tétraèdre régulier, d'un cube, etc.)."
  blocs:
  - points:
    - contenu: Groupes, morphismes, sous-groupe engendré par une partie.
      cours:
      - "ma-11:3"
      - "mp-01:2"
      - "m-galois:1"
      ex:
      - ma-11-08
      - m-galois-01
      - ma-11-15
      - ma-11-22
      - mp-01-43
      themes:
      - groupes
    - contenu: "Groupes cycliques, ordre d'un élément. Théorème de Lagrange."
      cours:
      - "mp-01:2"
      - "l3-sa-01:2"
      - "m-galois:1"
      ex:
      - mp-01-01
      - mp-01-04
      - mp-01-06
      - l3-sa-01-10
      - m-galois-07
      - m-galois-13
      themes:
      - groupes-cycliques
      - groupes
    - contenu: Sous-groupe distingué (ou normal). Groupe quotient.
      cours:
      - "m-galois:2"
      - "l3-sa-01:2"
      ex:
      - m-galois-10
      - m-galois-08
      - m-galois-09
      - m-galois-16
      themes:
      - groupes
    - contenu: "Image et noyau d'un morphisme de groupes. Isomorphisme entre $\\operatorname{Im}(f)$ et $G/\\operatorname{Ker}(f)$ pour $f$ morphisme de groupes de $G$ dans $G'$."
      cours:
      - "m-galois:2"
      - "ma-11:3"
      - "l3-sa-01:2"
      ex:
      - ma-11-22
      - ma-11-24
      - m-galois-10
      - m-galois-15
      themes:
      - groupes
    - contenu: Groupe opérant sur un ensemble, orbites. Stabilisateurs. Formule des classes.
      cours:
      - "m-galois:2"
      ex:
      - m-galois-11
      - m-galois-15
      - mp-01-73
      - m-galois-14
      - l3-sa-08-21
      themes:
      - actions-groupes
      - groupes
    - contenu: "Éléments conjugués, classes de conjugaison, sous-groupes conjugués. Automorphismes intérieurs d'un groupe."
      cours:
      - "m-galois:2"
      ex:
      - m-galois-11
      - mp-07-23
      - mp-01-73
      themes:
      - actions-groupes
      - groupes
    - contenu: Polygones réguliers et groupes diédraux.
      cours:
      - "m-galois:1"
      ex:
      - m-galois-05
      themes:
      - groupes
      - isometries-affines
      note: "Seuls les groupes diédraux du triangle équilatéral et du carré sont étudiés ; le groupe diédral D_n d'un polygone régulier quelconque ne l'est pas."
    - contenu: "Permutations d'un ensemble fini, groupe symétrique ; cycles, génération par les transpositions. Décomposition d'une permutation en produit de cycles à supports disjoints. Signature. Groupe\
        \ alterné."
      cours:
      - "ma-17:2"
      - "m-galois:1"
      - "m-galois:2"
      ex:
      - ma-17-01
      - ma-17-04
      - m-galois-03
      - ma-17-09
      - ma-17-12
      - m-galois-07
      themes:
      - groupe-symetrique
    - contenu: "Groupes $\\mathrm{GL}(E)$ et $\\mathrm{SL}(E)$ où $E$ est un espace vectoriel de dimension finie sur un corps commutatif $\\mathbb{K}$."
      cours:
      - "ma-14:7"
      - "ma-17:4"
      - "l3-sa-01:2"
      ex:
      - ap-07-13
      - m-galois-16
      themes:
      - groupes-matrices
      note: "Le groupe SL n'est défini que comme noyau du déterminant, sur un corps quelconque, avec GL_n(K)/SL_n(K) ≃ K* (Licence 3 – Structures algébriques, ch. 1, section 2), et étudié dans l'exercice\
        \ sur SL_2(F_3)."
    - contenu: "Groupes $\\mathrm{O}(E)$ et $\\mathrm{SO}(E)$ où $E$ est un espace vectoriel euclidien. Groupes $\\mathrm{U}(E)$ et $\\mathrm{SU}(E)$ où $E$ est un espace hermitien."
      cours:
      - "mp-07:3"
      - "mp-10:7"
      ex:
      - mp-07-16
      - mp-10-40
      - mp-07-36
      themes:
      - isometries
      - groupes-matrices
      - espaces-hermitiens
      note: "Le groupe spécial unitaire SU(E) n'est pas traité."
    - contenu: "Groupe affine, groupe des homothéties et translations d'un espace affine."
      cours:
      - "ma-14:9"
      - "ma-04:9"
      ex:
      - ma-11-10
      - m-galois-15
      themes:
      - geometrie-affine
      note: "Le groupe affine n'est pas étudié en général : seuls les translations (Maths Sup – MPSI, ch. 14) et le cas du plan complexe, par les applications z ↦ az + b, sont exposés."
    - contenu: "Groupe des isométries et des déplacements d'un espace affine euclidien. Groupe des isométries laissant stable une partie de l'espace."
      cours:
      - "m-galois:1"
      ex:
      - m-galois-05
      themes:
      - isometries-affines
      - geometrie-euclidienne
      note: "Seuls les groupes d'isométries d'un triangle équilatéral et d'un carré sont étudiés ; les isométries affines en général ne sont pas traitées."
    - contenu: "Groupe des similitudes directes et indirectes d'un plan affine euclidien."
      cours:
      - "ma-04:9"
      ex:
      - ma-04-49
      - ma-04-53
      themes:
      - geometrie-complexe
      note: Seules les similitudes directes sont étudiées ; les similitudes indirectes z ↦ a z̄ + b ne sont que nommées dans une remarque.
- intitule: "Algèbre linéaire sur un corps commutatif $\\mathbb{K}$"
  objectif: "À partir du paragraphe 5.2 : « Dans la suite, les espaces vectoriels sont tous supposés de dimension finie. » (phrase placée par le texte à la fin du paragraphe 5.1)."
  blocs:
  - intitule: 5.1 Espaces vectoriels et algèbres
    points:
    - contenu: "Définitions. Applications linéaires. Espace vectoriel $\\mathcal{L}(E, F)$. Algèbre $\\mathcal{L}(E)$. Groupe linéaire $\\mathrm{GL}(E)$."
      cours:
      - "ma-14:2"
      - "ma-14:6"
      - "ma-14:7"
      ex:
      - ma-14-01
      - ma-14-36
      - ma-14-39
      - ma-14-44
      themes:
      - espaces-vectoriels
      - applications-lineaires
    - contenu: "Espace produit d'une famille finie d'espaces vectoriels."
      cours:
      - "ma-14:2"
      - "ma-15:2"
      themes:
      - espaces-vectoriels
    - contenu: Sous-espaces vectoriels. Espaces vectoriels quotients.
      cours:
      - "ma-14:3"
      ex:
      - ma-14-05
      - ma-14-06
      - ma-14-08
      themes:
      - espaces-vectoriels
      note: Les espaces vectoriels quotients ne sont pas traités.
    - contenu: "Image et noyau d'une application linéaire. Sous-espace engendré par une partie."
      cours:
      - "ma-14:6"
      - "ma-14:3"
      ex:
      - ma-14-09
      - ma-14-37
      - ma-14-38
      - ma-14-12
      themes:
      - applications-lineaires
      - espaces-vectoriels
    - contenu: "Somme d'un nombre fini de sous-espaces. Sous-espaces en somme directe. Sous-espaces supplémentaires. Projecteurs. Endomorphismes involutifs."
      cours:
      - "ma-14:5"
      - "ma-14:7"
      - "mp-02:2"
