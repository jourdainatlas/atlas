    - contenu: "Bijection, à l'aide de l'orthogonalité, entre l'ensemble des sous-espaces de $E$ et l'ensemble des sous-espaces de $E^*$. Orthogonal d'une somme ou d'une intersection de deux sous-espaces.\
        \ Dimension de l'orthogonal."
      cours:
      - "ma-15:5"
      ex:
      - ma-15-45
      themes:
      - dualite
      note: "La bijection par orthogonalité n'est pas énoncée ; seule la dimension d'une intersection d'hyperplans l'est, et l'exercice 15.45 établit qu'une forme nulle sur l'intersection des noyaux est\
        \ combinaison des autres."
