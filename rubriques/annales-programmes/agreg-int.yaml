      - l3-in-07-12
      themes:
      - integrales-multiples
      note: "Le site construit l'intégrale double par la mesure de Lebesgue et la mesure produit, et non par la formule de Fubini sur un rectangle."
    - contenu: "Théorème de Fubini-Tonelli : si $f$ est une fonction de deux variables continue positive sur un rectangle borné ou non, on peut intervertir l'ordre des intégrations ; lorsque la valeur commune\
        \ de ces intégrales est finie, $f$ est dite intégrable et son intégrale double est cette valeur commune."
      demo: admis
