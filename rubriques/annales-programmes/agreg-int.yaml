      - mp-06-24
      - ma-20-11
      - ma-20-12
      - mp-06-25
      - ma-20-13
      themes:
      - series-numeriques
    - contenu: "Sommation des relations de prépondérance et d'équivalence pour les séries convergentes et divergentes."
      cours:
      - "mp-06:3"
      ex:
      - mp-06-26
      - mp-06-28
      - mp-06-30
      - mp-06-34
      - ma-20-24
      - mp-06-29
      themes:
      - equivalents
      - series-numeriques
      - procedes-sommation
    - contenu: "Comparaison d'une série et d'une intégrale, cas des séries de Riemann."
      cours:
      - "ma-20:3"
      - "mp-06:3"
      ex:
      - ma-20-10
      - mp-06-20
      - ma-20-15
      - mp-06-22
      - mp-06-21
      - mp-06-23
      themes:
      - comparaison-serie-integrale
      - series-numeriques
    - contenu: Critère de Cauchy pour les séries à termes réels ou complexes. Convergence absolue.
      cours:
