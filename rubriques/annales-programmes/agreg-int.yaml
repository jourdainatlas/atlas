  - intitule: 9.8 Intégration sur un intervalle quelconque
    points:
    - contenu: "Intégrale d'une fonction positive (comme borne supérieure, éventuellement infinie, des intégrales sur les segments inclus dans $I$). Emploi des relations de comparaison."
      precisions: "Les fonctions considérées dans ce paragraphe sont supposées continues par morceaux sur l'intervalle $I$ de définition, c'est-à-dire continues par morceaux sur tout segment contenu dans\
        \ $I$."
      cours:
      - "mp-12:2"
      - "mp-12:3"
      ex:
      - mp-12-06
      - mp-12-03
      - mp-12-07
      - mp-12-08
      - mp-12-38
      themes:
      - integrales-generalisees
    - contenu: "Une fonction définie sur $I$ à valeurs complexes est dite intégrable si l'intégrale de son module est finie."
      cours:
      - "mp-12:3"
      ex:
      - mp-12-06
      - mp-12-08
      - mp-12-09
      - mp-12-11
      themes:
      - integrales-generalisees
    - contenu: "Théorème de convergence monotone : soit $(f_n)$ une suite croissante de fonctions intégrables, convergeant simplement sur $I$ vers une fonction $f$ continue par morceaux sur $I$. Alors $f$\
        \ est intégrable sur $I$ si, et seulement si, la suite des intégrales des $f_n$ est majorée ; en ce cas, l'intégrale de $f$ est la limite de celles des $f_n$."
      demo: admis
      cours:
      - "l3-in-03:6"
      - "mp-13:3"
      ex:
      - l3-in-03-15
      - l3-in-03-23
      - mp-13-11
      - mp-13-13
      - l3-in-03-17
      themes:
      - convergence-integrales
      - interversions
      note: "En MP, le théorème est donné sous sa forme « intégration terme à terme positive », admis dans le cas non intégrable ; la convergence monotone est démontrée au chapitre de L3 pour l'intégrale\
        \ de Lebesgue."
    - contenu: "Théorème de convergence dominée : soit $(f_n)$ une suite de fonctions à valeurs complexes convergeant simplement sur $I$ vers une fonction $f$ continue par morceaux sur $I$. Si la suite\
        \ des modules des $f_n$ est majorée par une fonction $g$ intégrable sur $I$, alors $f$ est intégrable sur $I$ et son intégrale est la limite de celles des $f_n$."
      demo: admis
      cours:
      - "l3-in-04:3"
      - "mp-13:2"
      ex:
      - mp-13-01
      - mp-13-02
      - mp-13-03
      - mp-13-04
      - mp-13-06
      - mp-13-10
      themes:
      - convergence-dominee
    - contenu: "Théorème d'intégration terme à terme : soit une suite $(u_n)$ de fonctions à valeurs complexes, intégrables sur $I$, telle que la série $\\sum u_n$ converge simplement vers une fonction\
        \ $S$ continue par morceaux sur $I$, et telle que la série $\\sum \\int_I |u_n|$ converge. Alors $S$ est intégrable sur $I$ et on a $\\int_I S = \\sum_n \\int_I u_n$."
      demo: admis
      cours:
      - "l3-in-04:3"
      - "mp-13:3"
      ex:
      - mp-13-11
      - mp-13-12
      - l3-in-04-19
      - mp-13-14
      - mp-13-15
      - mp-13-17
      themes:
      - interversions
      - convergence-integrales
