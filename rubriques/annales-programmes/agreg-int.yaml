      - "ma-09:4"
      ex:
      - ma-09-27
      - ma-09-28
      - ma-09-31
      themes:
      - derivabilite
    - contenu: "Fonctions convexes de classe $\\mathcal{C}^1$, convexité de l'épigraphe, croissance de la dérivée, position de la courbe relativement aux cordes et aux tangentes. Cas des fonctions de classe\
        \ $\\mathcal{C}^2$."
