      note: La covariance et le coefficient de corrélation sont définis pour toutes les variables de carré intégrable (Licence 3 – Probabilités, ch. 5, sections 4 et 5), avec des exemples discrets ; les
        exercices les calculent pour des couples à densité.
    - contenu: "Espérance et variance d'une somme de $p$ v.a.r. indépendantes et possédant une loi avec densité. Application aux lois normales."
      cours:
      - "l3-pr-03:7"
      - "l3-pr-06:5"
      - "l3-pr-07:6"
      ex:
      - l3-pr-07-13
      - l3-pr-07-12
      - l3-in-09-04
      - l3-pr-07-09
      - l3-in-09-24
      themes:
      - loi-normale
      - variables-densite
      note: "La variance d'une somme de variables indépendantes de carré intégrable est établie pour toutes les variables réelles (Licence 3 – Probabilités, ch. 3, section 7, théorème 4), ce que Licence\
        \ 3 – Probabilités, ch. 4, section 4 rappelle pour les variables à densité ; la somme de variables normales indépendantes est normale, moyennes et variances s'ajoutant (Licence 3 – Probabilités,\
        \ ch. 6, section 5, proposition 12), ce que retrouve le calcul de la densité de la somme par convolution (Licence 3 – Probabilités, ch. 7, section 6)."
