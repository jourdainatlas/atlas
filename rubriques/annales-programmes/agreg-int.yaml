- intitule: Géométrie différentielle
  objectif: Les notions qui suivent doivent être illustrées par des exemples.
  blocs:
  - intitule: 11.1 Courbes paramétrées en dimension 2 et 3
    points:
    - contenu: "Étude locale d'une courbe paramétrée du plan. Changement birégulier de paramètre."
      cours:
      - "l3-gd-01:2"
      - "l3-gd-01:3"
      ex:
      - mp-06-35
      - mp-06-45
      - ma-10-55
      themes:
      - arcs-parametres
      note: "Le changement de paramétrage par un C^k-difféomorphisme est défini dans Licence 3 – Géométrie différentielle, ch. 1, section 2 ; l'étude locale se limite à la tangente en un point régulier\
        \ et aux points biréguliers ou d'inflexion (Licence 3 – Géométrie différentielle, ch. 1, section 3), les points singuliers n'apparaissant qu'en exemple (rebroussement de y² = x³) et dans les exercices\
        \ sur l'astroïde et la cycloïde."
    - contenu: "Tangente, concavité, forme d'un arc au voisinage d'un point régulier ou singulier."
      cours:
      - "l3-gd-01:3"
      - "mp-06:4"
      ex:
      - mp-06-35
      - mp-06-45
      - ma-10-55
      themes:
      - arcs-parametres
      note: "Le cours définit la tangente, les points biréguliers et les points d'inflexion, où la courbe change de concavité (Licence 3 – Géométrie différentielle, ch. 1, section 3) ; la forme de l'arc\
        \ au voisinage d'un point singulier n'est vue que sur un exemple de rebroussement et dans les exercices."
    - contenu: "Construction d'une courbe en coordonnées polaires."
      themes:
      - arcs-parametres
      note: "La construction d'une courbe en coordonnées polaires n'est pas traitée : le site ne donne que la courbure algébrique d'une courbe polaire, appliquée à la cardioïde (Licence 3 – Géométrie différentielle,\
        \ ch. 1, section 6, proposition 11)."
    - contenu: "Étude locale d'une courbe paramétrée de l'espace. Plan osculateur."
      cours:
      - "l3-gd-01:3"
      - "l3-gd-01:7"
      themes:
      - arcs-parametres
      - courbes-surfaces
  - intitule: 11.2 Propriétés métriques des courbes
    points:
    - contenu: "Longueur d'un arc paramétré de classe $\\mathcal{C}^1$. Abscisse curviligne."
      cours:
      - "l3-gd-01:4"
      ex:
      - mp-10-05
      - ma-18-54
      themes:
      - longueur-courbure
      note: "Les deux exercices ne portent que sur la longueur d'un graphe, intégrale de √(1 + f′²) ; l'abscisse curviligne et le paramétrage par longueur d'arc ne sont traités que dans le cours (Licence\
        \ 3 – Géométrie différentielle, ch. 1, section 4)."
    - contenu: En dimension 2, repère de Frenet. Courbure, centre de courbure, cercle osculateur.
      cours:
      - "l3-gd-01:5"
      - "l3-gd-01:6"
      themes:
      - longueur-courbure
  - intitule: 11.3 Modélisation géométrique
    points:
    - contenu: Polynômes de Bernstein et courbes de Bézier (définies par points de contrôle ou par un algorithme).
