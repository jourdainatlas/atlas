# Programme officiel « Programme du CAPES externe de mathématiques (concours bac + 5), session 2027 » (Concours externe du Capes et Cafep, section mathématiques (concours externe bac + 5) — Programme de la session 2027, devenirenseignant.gouv.fr, juillet 2026 (publié le 15 juillet 2026) ; texte identique au programme de la session 2026 (15 mai 2025), prorogé pour la session 2027 par l'arrêté du 18 septembre 2026 (NOR MENH2622482A, JORF du 30 septembre 2026), dont la section mathématiques n'est pas exclue ; épreuves définies par l'arrêté du 25 janvier 2021 modifié (MENH2033181A)), structuré pour la vue « Programme »
# des Annales (MEMO_atlas_annales.md §45). Liens : cours « chapitre:section » (rang du sommaire, à partir de 1),
# exercices, thèmes d'annales ; un point sans cours ni exercice est affiché « à venir ».
id: capes
intitule: Programme du CAPES externe de mathématiques (concours bac + 5), session 2027
source:
  nom: "Concours externe du Capes et Cafep, section mathématiques (concours externe bac + 5) — Programme de la session 2027, devenirenseignant.gouv.fr, juillet 2026 (publié le 15 juillet 2026) ; texte identique\
    \ au programme de la session 2026 (15 mai 2025), prorogé pour la session 2027 par l'arrêté du 18 septembre 2026 (NOR MENH2622482A, JORF du 30 septembre 2026), dont la section mathématiques n'est pas\
    \ exclue ; épreuves définies par l'arrêté du 25 janvier 2021 modifié (MENH2033181A)"
  url: "https://www.devenirenseignant.gouv.fr/media/20635/download"
preambule: "Le programme des épreuves est constitué des programmes du collège et du lycée général et technologique en vigueur, auxquels s'ajoute, pour la première épreuve d'admissibilité, le programme spécifique\
  \ détaillé ci-dessous, organisé en quinze rubriques allant du raisonnement et du vocabulaire ensembliste aux probabilités. Les épreuves, définies par l'arrêté du 25 janvier 2021, comprennent deux écrits\
  \ d'admissibilité de cinq heures chacun et de coefficient 2 (une épreuve disciplinaire constituée d'un ou plusieurs problèmes, et une épreuve disciplinaire appliquée portant sur un dossier : exercices,\
  \ productions d'élèves, documents institutionnels). L'admission comporte une épreuve de leçon (préparation de 2 h 30, épreuve d'une heure, coefficient 5) et une épreuve d'entretien avec le jury (35 minutes,\
  \ coefficient 3)."
