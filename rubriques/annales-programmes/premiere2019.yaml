      precisions: "Dans cette section, le plan est rapporté à un repère orthonormé. Déterminer une équation cartésienne d'une droite connaissant un point et un vecteur normal. Déterminer les coordonnées\
        \ du projeté orthogonal d'un point sur une droite. Utiliser un repère pour étudier une configuration."
