# Programme officiel « Programme de l'enseignement de spécialité de mathématiques de Première (2019) » (Arrêté du 17 janvier 2019 (JO du 20-1-2019, NOR MENE1901632A), Bulletin officiel spécial n° 1 du 22 janvier 2019, annexe « Programme de mathématiques de première générale ». En vigueur à la rentrée scolaire 2019 ; son annexe est remplacée, à compter de la rentrée scolaire 2026-2027, par celle de l'arrêté du 26 février 2026 (JO du 27-3-2026, Bulletin officiel n° 14 du 2 avril 2026, NOR MENE2602917A).), structuré pour la vue « Programme »
# des Annales (MEMO_atlas_annales.md §45). Liens : cours « chapitre:section » (rang du sommaire, à partir de 1),
# exercices, thèmes d'annales ; un point sans cours ni exercice est affiché « à venir ».
id: premiere2019
intitule: "Programme de l'enseignement de spécialité de mathématiques de Première (2019)"
source:
  nom: "Arrêté du 17 janvier 2019 (JO du 20-1-2019, NOR MENE1901632A), Bulletin officiel spécial n° 1 du 22 janvier 2019, annexe « Programme de mathématiques de première générale ». En vigueur à la rentrée\
    \ scolaire 2019 ; son annexe est remplacée, à compter de la rentrée scolaire 2026-2027, par celle de l'arrêté du 26 février 2026 (JO du 27-3-2026, Bulletin officiel n° 14 du 2 avril 2026, NOR MENE2602917A)."
  url: "https://cache.media.education.gouv.fr/file/SP1-MEN-22-1-2019/16/8/spe632_annexe_1063168.pdf"
preambule: "C'est le programme de spécialité de première en vigueur de la rentrée 2019 à l'année scolaire 2025-2026, celui qu'ont suivi les élèves de terminale de 2026-2027 ; il a été remplacé à la rentrée\
  \ 2026 par le programme fixé par l'arrêté du 26 février 2026. Le programme s'organise en cinq grandes parties : « Algèbre », « Analyse », « Géométrie », « Probabilités et statistiques » et « Algorithmique\
  \ et programmation », auxquelles s'ajoute le « Vocabulaire ensembliste et logique », transversal à tous les chapitres ; ce découpage n'est pas un plan de cours. Chaque sous-partie précise des contenus,\
  \ des capacités attendues, et le cas échéant des démonstrations exemplaires, des exemples d'algorithme et des approfondissements possibles, en aucun cas obligatoires. Des items « Histoire des mathématiques\
  \ » identifient des possibilités de contextualisation historique."
sections:
- intitule: Algèbre
  objectif: "En classe de première, les suites sont présentées d'un point de vue principalement algébrique : l'élève rencontre différents modes de génération (formule explicite $u_n = f(n)$, relation de\
    \ récurrence $u_{n+1} = f(u_n)$, motifs géométriques ou combinatoires), les suites arithmétiques et géométriques sont formalisées, et les suites interviennent comme modélisations d'évolutions à temps\
    \ discret ; l'étude des suites est l'occasion d'une sensibilisation à l'idée de limite. L'étude des fonctions polynômes du second degré réactive les connaissances de seconde ; les élèves doivent savoir\
    \ qu'une telle fonction admet une forme canonique et la déterminer dans des cas simples par complétion du carré ($x^2 + 2ax = (x+a)^2 - a^2$), et pratiquer la factorisation directe dans les cas qui\
    \ s'y prêtent. Exemples d'algorithme : calcul de termes, de sommes de termes, de seuil, de factorielle ; liste des premiers termes (suites de Syracuse, suite de Fibonacci)."
  hors_programme:
  - "D'autres types simples de suites peuvent être abordés, mais aucune connaissance spécifique à leur sujet n'est au programme."
  - "Limite d'une suite : toute formalisation est exclue."
  - "Le calcul effectif de la forme canonique dans le cas général n'est pas un attendu du programme."
  blocs:
  - intitule: Suites numériques, modèles discrets
    points:
    - contenu: "Exemples de modes de génération d'une suite : explicite $u_n = f(n)$, par une relation de récurrence $u_{n+1} = f(u_n)$, par un algorithme, par des motifs géométriques. Notations : $u(n)$,\
        \ $u_n$, $(u(n))$, $(u_n)$."
      precisions: "Dans le cadre de l'étude d'une suite, utiliser le registre de la langue naturelle, le registre algébrique, le registre graphique, et passer de l'un à l'autre. Proposer, modéliser une\
        \ situation permettant de générer une suite de nombres. Déterminer une relation explicite ou une relation de récurrence pour une suite définie par un motif géométrique, par une question de dénombrement.\
        \ Calculer des termes d'une suite définie explicitement, par récurrence ou par un algorithme."
      cours:
      - "p-02:2"
      ex:
      - p-02-01
      - p-02-02
      - p-02-08
      - p-02-11
      - p-02-30
      themes:
      - ly-suites
      - ly-suites-recurrentes
    - contenu: "Suites arithmétiques : exemples, définition, calcul du terme général. Lien avec l'étude d'évolutions successives à accroissements constants. Lien avec les fonctions affines. Calcul de $1\
        \ + 2 + \\cdots + n$."
      precisions: Pour une suite arithmétique, calculer le terme général, la somme de termes consécutifs, déterminer le sens de variation. Modéliser un phénomène discret à croissance linéaire par une suite
        arithmétique.
      cours:
      - "p-02:4"
      - "p-02:6"
      ex:
      - p-02-12
      - p-02-13
      - p-02-15
      - p-sa-01
      - p-sa-04
      - p-02-23
      themes:
      - ly-suites-arith-geom
      - ly-suites
    - contenu: "Suites géométriques : exemples, définition, calcul du terme général. Lien avec l'étude d'évolutions successives à taux constant. Lien avec la fonction exponentielle. Calcul de $1 + q + \\\
        cdots + q^n$."
      precisions: Pour une suite géométrique, calculer le terme général, la somme de termes consécutifs, déterminer le sens de variation. Modéliser un phénomène discret à croissance exponentielle par une
        suite géométrique.
      cours:
      - "p-02:5"
      - "p-02:6"
      ex:
      - p-02-17
      - p-02-18
      - p-02-19
      - p-sg-04
      - p-sg-08
      - p-02-23
      themes:
      - ly-suites-arith-geom
      - ly-suites
    - contenu: "Sens de variation d'une suite."
      cours:
      - "p-02:3"
      ex:
      - p-02-05
      - p-02-06
      - p-02-07
      - p-02-10
      themes:
      - ly-suites
    - contenu: "Sur des exemples, introduction intuitive de la notion de limite, finie ou infinie, d'une suite."
      precisions: "Conjecturer, dans des cas simples, la limite éventuelle d'une suite."
      ex:
      - p-02-07
      - p-02-10
      - p-sg-09
      - p-02-29
      - p-02-30
      themes:
      - ly-limites-suites
      - ly-suites
      note: "Le cours de Première n'introduit pas la limite d'une suite ; les exercices liés font conjecturer des limites. La définition formelle n'apparaît qu'en Terminale (Terminale, ch. 1, section 3)."
    - contenu: "Démonstration : calcul du terme général d'une suite arithmétique, d'une suite géométrique."
      demo: exigible
      themes:
      - ly-suites-arith-geom
      - ly-suites
      note: "Le cours de Première énonce les formules explicites (Première, ch. 2, sections 4 et 5) mais les admet, avec une simple justification intuitive ; la démonstration n'est pas sur le site."
    - contenu: "Démonstration : calcul de $1 + 2 + \\cdots + n$."
      demo: exigible
      cours:
      - "p-02:6"
      themes:
      - ly-suites-arith-geom
      - ly-suites
      note: "Le cours écrit « Admise » mais donne aussitôt l'argument de Gauss (somme écrite dans les deux sens), qui est la démonstration attendue."
    - contenu: "Démonstration : calcul de $1 + q + \\cdots + q^n$."
      demo: exigible
      cours:
      - "p-02:6"
      themes:
      - ly-suites-arith-geom
      - ly-suites
      note: Le cours écrit « Admise » mais donne aussitôt le calcul de S − qS, qui est la démonstration attendue.
  - intitule: Équations, fonctions polynômes du second degré
    points:
    - contenu: Fonction polynôme du second degré donnée sous forme factorisée. Racines, signe, expression de la somme et du produit des racines.
      precisions: "Étudier le signe d'une fonction polynôme du second degré donnée sous forme factorisée. Déterminer les fonctions polynômes du second degré s'annulant en deux nombres réels distincts."
      cours:
      - "p-01:4"
      - "p-01:5"
      ex:
      - p-01-15
      - p-01-16
      - p-01-17
      - p-01-19
      - p-01-18
      themes:
      - ly-second-degre
    - contenu: "Forme canonique d'une fonction polynôme du second degré. Discriminant. Factorisation éventuelle. Résolution d'une équation du second degré. Signe."
      precisions: "Factoriser une fonction polynôme du second degré, en diversifiant les stratégies : racine évidente, détection des racines par leur somme et leur produit, identité remarquable, application\
        \ des formules générales. Choisir une forme adaptée (développée réduite, canonique, factorisée) d'une fonction polynôme du second degré dans le cadre de la résolution d'un problème (équation, inéquation,\
        \ optimisation, variations)."
      cours:
      - "p-01:2"
      - "p-01:3"
      - "p-01:5"
      ex:
      - p-01-04
      - p-01-05
      - p-01-08
      - p-01-16
      - p-01-20
      - p-01-22
      themes:
      - ly-second-degre
    - contenu: "Démonstration : résolution de l'équation du second degré."
      demo: exigible
      cours:
      - "p-01:3"
      themes:
      - ly-second-degre
- intitule: Analyse
  objectif: "Deux points fondamentaux sont étudiés : le concept de dérivée, avec ses applications à l'étude des fonctions, et la fonction exponentielle. L'étude de la dérivation distingue le point de vue\
    \ local (nombre dérivé) et le point de vue global (fonction dérivée) ; les fonctions étudiées sont toutes régulières et le nombre dérivé est introduit à partir de la perception intuitive de la limite\
    \ du taux de variation, en s'appuyant sur des représentations graphiques, le calcul algébrique du taux de variation et le calcul numérique de $f(a+h) - f(a)$ pour $h$ proche de $0$. Les fonctions trigonométriques\
    \ font l'objet d'une première approche, d'un point de vue principalement graphique. En liaison avec les autres disciplines, on peut signaler et utiliser les notations $\\dfrac{\\Delta y}{\\Delta x}$\
    \ pour un taux de variation et $\\dfrac{\\mathrm{d}y}{\\mathrm{d}x}$ pour une dérivée. Exemples d'algorithme : liste des coefficients directeurs des sécantes pour un pas donné, méthode de Newton (cas\
    \ favorables), méthode d'Euler pour l'exponentielle, valeur approchée de $e$ à l'aide de la suite $\\left(\\left(1+\\frac{1}{n}\\right)^n\\right)$, approximation de $\\pi$ par la méthode d'Archimède."
  hors_programme:
  - On ne donne pas de définition formelle du nombre dérivé.
  blocs:
  - intitule: Dérivation · Point de vue local
    points:
    - contenu: "Taux de variation. Sécantes à la courbe représentative d'une fonction en un point donné."
      precisions: "Calculer un taux de variation, la pente d'une sécante."
      cours:
      - "p-04:2"
      ex:
      - p-04-01
      - p-04-02
      - p-04-04
      themes:
      - ly-derivation
    - contenu: "Nombre dérivé d'une fonction en un point, comme limite du taux de variation. Notation $f'(a)$."
      precisions: "Interpréter le nombre dérivé en contexte : pente d'une tangente, vitesse instantanée, coût marginal… À partir de la définition, calculer le nombre dérivé en un point de la fonction carré,\
        \ de la fonction inverse."
      cours:
      - "p-04:2"
      ex:
      - p-04-02
      - p-04-03
      - p-04-04
      - p-04-05
      - p-04-06
      themes:
      - ly-derivation
    - contenu: "Tangente à la courbe représentative d'une fonction en un point, comme « limite des sécantes ». Pente. Équation : la tangente à la courbe représentative de $f$ au point d'abscisse $a$ est\
        \ la droite d'équation $y = f(a) + f'(a)(x - a)$."
      precisions: "Déterminer graphiquement un nombre dérivé par la pente de la tangente. Construire la tangente en un point à une courbe représentative connaissant le nombre dérivé. Déterminer l'équation\
        \ de la tangente en un point à la courbe représentative d'une fonction."
      cours:
      - "p-04:4"
      - "p-04:2"
      ex:
      - p-04-05
      - p-04-06
      - p-04-16
      - p-04-19
      - p-04-17
      - p-04-18
      themes:
      - ly-derivation
    - contenu: "Démonstration : équation de la tangente en un point à une courbe représentative."
      demo: exigible
      themes:
      - ly-derivation
      note: "Le cours de Première pose l'équation de la tangente comme définition (Première, ch. 4, section 4), sans la démontrer."
  - intitule: Dérivation · Point de vue global
    points:
    - contenu: Fonction dérivable sur un intervalle. Fonction dérivée.
      cours:
      - "p-04:3"
      ex:
      - p-04-07
      - p-04-08
      themes:
      - ly-derivation
    - contenu: Fonction dérivée des fonctions carré, cube, inverse, racine carrée.
      precisions: À partir de la définition, calculer la fonction dérivée de la fonction carré, de la fonction inverse.
      cours:
      - "p-04:3"
      ex:
      - p-04-02
      - p-04-07
      - p-04-08
      themes:
      - ly-derivation
    - contenu: "Opérations sur les fonctions dérivables : somme, produit, inverse, quotient, fonction dérivée de $x \\mapsto g(ax + b)$."
      precisions: Dans des cas simples, calculer une fonction dérivée en utilisant les propriétés des opérations sur les fonctions dérivables.
      cours:
      - "p-04:3"
      ex:
      - p-04-09
      - p-04-10
      - p-04-11
      - p-04-13
      - p-04-12
      - p-04-14
      themes:
      - ly-derivation
    - contenu: "Pour $n$ dans $\\mathbb{Z}$, fonction dérivée de la fonction $x \\mapsto x^n$."
      cours:
      - "p-04:3"
      ex:
      - p-04-07
      - p-04-08
      - p-04-33
      themes:
      - ly-derivation
    - contenu: "Fonction valeur absolue : courbe représentative, étude de la dérivabilité en $0$."
      note: "Le site ne traite pas ce point au niveau de la Première ; seule une remarque du cours de Terminale (Terminale, ch. 3, section 4) affirme, sans étude, que la valeur absolue n'est pas dérivable\
        \ en 0."
    - contenu: "Démonstration : la fonction racine carrée n'est pas dérivable en $0$."
      demo: exigible
      themes:
      - ly-derivation
    - contenu: "Démonstration : fonction dérivée de la fonction carrée, de la fonction inverse."
      demo: exigible
      cours:
      - "p-04:3"
      ex:
      - p-04-02
      themes:
      - ly-derivation
      note: "Le cours démontre la dérivée de l'inverse (en admettant la limite finale) ; celle du carré y est admise (cas de x^n). L'exercice 4.2 (Première) refait le calcul du taux de variation pour x²\
        \ et 1/x en un point donné."
    - contenu: "Démonstration : fonction dérivée d'un produit."
      demo: exigible
      cours:
      - "p-04:3"
      themes:
      - ly-derivation
  - intitule: Variations et courbes représentatives des fonctions
    points:
    - contenu: "Lien entre le sens de variation d'une fonction dérivable sur un intervalle et signe de sa fonction dérivée ; caractérisation des fonctions constantes."
      precisions: "Étudier les variations d'une fonction. Exploiter les variations d'une fonction pour établir une inégalité. Étudier la position relative de deux courbes représentatives. Étudier, en lien\
        \ avec la dérivation, une fonction polynôme du second degré : variations, extremum, allure selon le signe du coefficient de $x^2$."
      cours:
      - "p-04:5"
      ex:
      - p-04-22
      - p-04-23
      - p-04-24
      - p-04-25
      - p-08-29
      themes:
      - ly-derivation
    - contenu: Nombre dérivé en un extremum, tangente à la courbe représentative.
      precisions: "Déterminer les extremums. Résoudre un problème d'optimisation."
      cours:
      - "p-04:5"
      ex:
      - p-04-20
      - p-04-26
      - p-04-27
      - p-04-28
      - p-04-34
      - p-04-35
      themes:
      - ly-derivation
  - intitule: Fonction exponentielle
    points:
    - contenu: "Définition de la fonction exponentielle, comme unique fonction dérivable sur $\\mathbb{R}$ vérifiant $f' = f$ et $f(0) = 1$. L'existence et l'unicité sont admises. Notation $\\exp(x)$."
      cours:
      - "p-08:2"
      ex:
      - p-08-15
      themes:
      - ly-exp-ln
    - contenu: Pour tous réels $x$ et $y$, $\exp(x + y) = \exp(x)\exp(y)$ et $\exp(x)\exp(-x) = 1$. Nombre $e$. Notation $e^x$.
      precisions: Transformer une expression en utilisant les propriétés algébriques de la fonction exponentielle.
      cours:
      - "p-08:2"
      ex:
      - p-08-01
      - p-08-02
      - p-08-03
      - p-08-04
      - p-08-05
      - p-08-06
      themes:
      - ly-exp-ln
    - contenu: "Pour tout réel $a$, la suite $(e^{na})$ est une suite géométrique."
      precisions: "Modéliser une situation par une croissance, une décroissance exponentielle (par exemple évolution d'un capital à taux fixe, décroissance radioactive)."
      cours:
      - "p-08:2"
      ex:
      - p-08-27
      themes:
      - ly-exp-ln
      note: "Le cours établit e^{na} = (e^a)^n sans énoncer explicitement que (e^{na}) est géométrique."
    - contenu: Signe, sens de variation et courbe représentative de la fonction exponentielle.
      precisions: "Pour une valeur numérique strictement positive de $k$, représenter graphiquement les fonctions $t \\mapsto e^{-kt}$ et $t \\mapsto e^{kt}$."
      cours:
      - "p-08:3"
      ex:
      - p-08-13
      - p-08-14
      - p-08-16
      - p-08-28
      themes:
      - ly-exp-ln
  - intitule: Fonctions trigonométriques
    points:
    - contenu: "Cercle trigonométrique. Longueur d'arc. Radian."
      cours:
      - "p-06:2"
      ex:
      - p-06-01
      - p-06-02
      - p-06-03
      themes:
      - ly-trigo
    - contenu: "Enroulement de la droite sur le cercle trigonométrique. Image d'un nombre réel."
      precisions: Placer un point sur le cercle trigonométrique.
      cours:
      - "p-06:2"
      ex:
      - p-06-04
      - p-06-05
      - p-06-06
      - p-06-07
      - p-06-08
      themes:
      - ly-trigo
    - contenu: "Cosinus et sinus d'un nombre réel. Lien avec le sinus et le cosinus dans un triangle rectangle. Valeurs remarquables."
      precisions: "Par lecture du cercle trigonométrique, déterminer, pour des valeurs remarquables de $x$, les cosinus et sinus d'angles associés à $x$."
      cours:
      - "p-06:3"
      ex:
      - p-06-09
      - p-06-10
      - p-06-16
      - p-06-11
      - p-06-12
      themes:
      - ly-trigo
    - contenu: Fonctions cosinus et sinus. Parité, périodicité. Courbes représentatives.
      precisions: Lier la représentation graphique des fonctions cosinus et sinus et le cercle trigonométrique. Traduire graphiquement la parité et la périodicité des fonctions trigonométriques.
      cours:
      - "p-06:3"
      - "t-09:2"
      ex:
      - t-09-03
      - t-09-07
      - t-09-08
      - t-09-09
      themes:
      - ly-trigo
      note: "Le cours de Première établit cos(x + 2kπ) = cos(x) et les formules des angles associés (dont cos(−x) et sin(−x)), mais n'étudie pas les fonctions cosinus et sinus ni leurs courbes ; celles-ci\
        \ sont exposées en Terminale (Terminale, ch. 9, section 2), d'où proviennent aussi les exercices."
    - contenu: "Démonstration : calcul de $\\sin\\frac{\\pi}{4}$, $\\cos\\frac{\\pi}{3}$, $\\sin\\frac{\\pi}{3}$."
      demo: exigible
      cours:
      - "p-06:3"
      themes:
      - ly-trigo
- intitule: Géométrie
  objectif: "En première, on poursuit l'étude de la géométrie plane en introduisant de nouveaux outils, autour de deux objectifs : donner des outils efficaces pour la résolution de problèmes géométriques\
    \ du point de vue métrique (produit scalaire) ; enrichir la géométrie repérée de manière à pouvoir traiter des problèmes faisant intervenir l'orthogonalité. Les élèves doivent conserver une pratique\
    \ du calcul vectoriel en géométrie non repérée."
  blocs:
  - intitule: Calcul vectoriel et produit scalaire
    points:
    - contenu: "Produit scalaire à partir de la projection orthogonale et de la formule avec le cosinus. Caractérisation de l'orthogonalité."
      precisions: "Utiliser le produit scalaire pour démontrer une orthogonalité, pour calculer un angle, une longueur dans le plan ou dans l'espace. En vue de la résolution d'un problème, calculer le produit\
        \ scalaire de deux vecteurs en choisissant une méthode adaptée (en utilisant la projection orthogonale, à l'aide des coordonnées, à l'aide des normes et d'un angle, à l'aide de normes)."
      cours:
      - "p-07:2"
      ex:
      - p-07-01
      - p-07-02
      - p-07-03
      - p-07-05
      - p-07-06
      - p-07-08
      themes:
      - ly-plan
    - contenu: "Bilinéarité, symétrie. En base orthonormée, expression du produit scalaire et de la norme, critère d'orthogonalité."
      cours:
      - "p-07:4"
      - "p-07:3"
      ex:
      - p-07-09
      - p-07-10
      - p-07-11
      - p-07-14
      - p-07-12
      themes:
      - ly-plan
    - contenu: "Développement de $\\|\\vec{u} + \\vec{v}\\|^2$. Formule d'Al-Kashi."
      precisions: Utiliser le produit scalaire pour résoudre un problème géométrique.
      cours:
      - "p-07:4"
      ex:
      - p-07-14
      - p-07-15
      - p-07-16
      - p-07-17
      - p-07-34
      themes:
      - ly-plan
      note: "La formule d'Al-Kashi n'est pas énoncée dans le cours ; elle est établie dans l'exercice 7.34 (Première)."
    - contenu: "Transformation de l'expression $\\overrightarrow{MA} \\cdot \\overrightarrow{MB}$."
      ex:
      - p-07-35
      themes:
      - ly-plan
    - contenu: "Démonstration : formule d'Al-Kashi (démonstration avec le produit scalaire)."
      demo: exigible
      ex:
      - p-07-34
      themes:
      - ly-plan
    - contenu: "Démonstration : ensemble des points $M$ tels que $\\overrightarrow{MA} \\cdot \\overrightarrow{MB} = 0$ (démonstration avec le produit scalaire)."
