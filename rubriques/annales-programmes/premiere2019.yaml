- intitule: Probabilités et statistiques
  objectif: "On développe l'étude du modèle probabiliste sur un univers fini abordé en seconde : introduire la probabilité conditionnelle et mettre en évidence la problématique de l'inversion des conditionnements,\
    \ formaliser l'indépendance, introduire la notion de variable aléatoire, ainsi que l'espérance, la variance et l'écart type. On distingue nettement modèle et réalité ; les notions de statistique descriptive\
    \ vues en seconde sont articulées avec le cours de probabilités par le tirage au sort avec équiprobabilité dans une population. Les arbres pondérés sont introduits à partir des arbres de dénombrement\
    \ vus en seconde. Exemples d'algorithme : méthode de Monte-Carlo (aire sous la parabole, estimation de $\\pi$), algorithme renvoyant l'espérance, la variance ou l'écart type d'une variable aléatoire,\
    \ fréquence d'apparition des lettres d'un texte."
  hors_programme:
  - "La notion de fréquence conditionnelle ne fait pas l'objet d'une étude (on donne des situations de calcul de probabilité conditionnelle à partir d'un tableau croisé d'effectifs)."
  - Le programme ne considère que des univers finis et des variables aléatoires réelles.
  blocs:
  - intitule: Probabilités conditionnelles et indépendance
    points:
    - contenu: "Probabilité conditionnelle d'un événement $B$ sachant un événement $A$ de probabilité non nulle. Notation $P_A(B)$. Indépendance de deux événements."
      precisions: "Calculer des probabilités conditionnelles lorsque les événements sont présentés sous forme de tableau croisé d'effectifs (tirage au sort avec équiprobabilité d'un individu dans une population).\
        \ Distinguer en situation $P_A(B)$ et $P_B(A)$, par exemple dans des situations de type « faux positifs »."
      cours:
      - "p-05:2"
      - "p-05:4"
      ex:
      - p-05-01
      - p-05-02
      - p-05-05
      - p-05-04
      - p-05-17
      - p-05-16
      themes:
      - ly-proba-cond
    - contenu: "Arbres pondérés et calcul de probabilités : règle du produit, de la somme."
      precisions: Construire un arbre pondéré ou un tableau en lien avec une situation donnée. Passer du registre de la langue naturelle au registre symbolique et inversement. Utiliser un arbre pondéré
        ou un tableau pour calculer une probabilité.
      cours:
      - "p-05:3"
      ex:
      - p-05-09
      - p-05-11
      - p-05-10
      - p-05-15
      - p-05-33
      themes:
      - ly-proba-cond
    - contenu: "Partition de l'univers (systèmes complets d'événements). Formule des probabilités totales."
      precisions: "Dans des cas simples, calculer une probabilité à l'aide de la formule des probabilités totales."
      cours:
      - "p-05:3"
      ex:
      - p-05-12
      - p-05-10
      - p-05-13
      - p-05-31
      themes:
      - ly-proba-cond
    - contenu: Succession de deux épreuves indépendantes. Représentation par un arbre ou un tableau.
      precisions: Représenter une répétition de deux épreuves indépendantes par un arbre ou un tableau.
      cours:
      - "t-02:2"
      - "s-03:3"
      ex:
      - p-05-21
      - p-05-23
      themes:
      - ly-proba-cond
      note: "Le cours de Première ne traite pas à part la succession d'épreuves indépendantes (seul un exemple de Première, ch. 5, section 5, en dessine l'arbre) ; la Seconde la représente par un arbre\
        \ (tirage avec remise), la Terminale (Terminale, ch. 2, section 2) définit l'indépendance d'expériences successives."
  - intitule: Variables aléatoires réelles
    points:
    - contenu: "Variable aléatoire réelle : modélisation du résultat numérique d'une expérience aléatoire ; formalisation comme fonction définie sur l'univers et à valeurs réelles."
      precisions: "Le programme ne considère que des univers finis et des variables aléatoires réelles. Interpréter en situation et utiliser les notations $\\{X = a\\}$, $\\{X \\leqslant a\\}$, $P(X = a)$,\
        \ $P(X \\leqslant a)$. Passer du registre de la langue naturelle au registre symbolique et inversement. Modéliser une situation à l'aide d'une variable aléatoire."
      cours:
      - "p-05:5"
      ex:
      - p-05-20
      - p-05-21
      themes:
      - ly-va
      - ly-esperance-variance
    - contenu: "Loi d'une variable aléatoire."
      precisions: "Déterminer la loi de probabilité d'une variable aléatoire."
      cours:
      - "p-05:5"
      ex:
      - p-05-20
      - p-05-21
      - p-05-22
      - p-05-23
      themes:
      - ly-va
      - ly-esperance-variance
    - contenu: "Espérance, variance, écart type d'une variable aléatoire."
      precisions: "Calculer une espérance, une variance, un écart type. Utiliser la notion d'espérance dans une résolution de problème (mise pour un jeu équitable…)."
      cours:
      - "p-05:6"
      ex:
      - p-05-24
      - p-05-25
      - p-05-26
      - p-05-27
      - p-05-28
      themes:
      - ly-esperance-variance
  - intitule: Expérimentations
    points:
    - contenu: Simuler une variable aléatoire avec Python.
      precisions: "Le travail expérimental de simulation d'échantillons prolonge celui de seconde ; l'objectif est de faire percevoir le principe de l'estimation de l'espérance d'une variable aléatoire,\
        \ ou de la moyenne d'une variable statistique dans une population, par une moyenne observée sur un échantillon."
      cours:
      - "py-01:6"
      - "py-01:8"
      ex:
      - py-01-38
      themes:
      - ly-algo
    - contenu: "Lire, comprendre et écrire une fonction Python renvoyant la moyenne d'un échantillon de taille $n$ d'une variable aléatoire."
      cours:
      - "py-01:8"
      - "py-01:6"
      themes:
      - ly-algo
      - ly-bienayme
      note: "Le cours de Python écrit une fonction de n renvoyant la fréquence du 6 sur n lancers (moyenne d'un échantillon d'une variable de Bernoulli) et calcule la moyenne de vingt lancers d'un dé, sans\
        \ fonction générale de moyenne d'échantillon."
    - contenu: "Étudier sur des exemples la distance entre la moyenne d'un échantillon simulé de taille $n$ d'une variable aléatoire et l'espérance de cette variable aléatoire."
      cours:
      - "py-01:8"
      ex:
      - py-01-38
      - py-01-42
      themes:
      - ly-bienayme
      - ly-algo
    - contenu: "Simuler, avec Python ou un tableur, $N$ échantillons de taille $n$ d'une variable aléatoire, d'espérance $\\mu$ et d'écart type $\\sigma$. Si $m$ désigne la moyenne d'un échantillon, calculer\
        \ la proportion des cas où l'écart entre $m$ et $\\mu$ est inférieur ou égal à $\\dfrac{2\\sigma}{\\sqrt{n}}$."
      themes:
      - ly-bienayme
- intitule: Algorithmique et programmation
  objectif: "L'enseignement vise la consolidation des notions de variable, d'instruction conditionnelle et de boucle ainsi que l'utilisation des fonctions ; la seule notion nouvelle est celle de liste.\
    \ Comme en seconde, les algorithmes peuvent être écrits en langage naturel ou utiliser le langage Python, et le symbole « ← » désigne l'affectation dans un algorithme écrit en langage naturel. Les notions\
    \ relatives aux types de variables et à l'affectation sont consolidées, et l'accent est mis sur la programmation modulaire."
  blocs:
  - intitule: Notion de liste
    points:
    - contenu: Générer une liste (en extension, par ajouts successifs ou en compréhension).
      precisions: "La génération des listes en compréhension et en extension est mise en lien avec la notion d'ensemble ; les conditions apparaissant dans les listes définies en compréhension permettent\
        \ de travailler la logique. Afin d'éviter des confusions, on se limite aux listes sans présenter d'autres types de collections."
      cours:
      - "py-01:7"
      ex:
      - py-01-28
      - py-01-29
      themes:
      - ly-algo
    - contenu: "Manipuler des éléments d'une liste (ajouter, supprimer…) et leurs indices."
      cours:
      - "py-01:7"
      ex:
      - py-01-28
      - py-01-31
      themes:
      - ly-algo
      note: Le cours ajoute et modifie des éléments, mais ne présente pas la suppression.
    - contenu: Parcourir une liste.
      cours:
      - "py-01:7"
      ex:
      - py-01-30
      - py-01-32
      - py-01-34
      themes:
      - ly-algo
    - contenu: "Itérer sur les éléments d'une liste."
      cours:
      - "py-01:7"
      ex:
      - py-01-30
      - py-01-32
      - py-01-33
      themes:
      - ly-algo
- intitule: Vocabulaire ensembliste et logique
  objectif: "L'apprentissage des notations mathématiques et de la logique est transversal à tous les chapitres du programme : on y travaille d'abord dans des contextes où ils se présentent naturellement,\
    \ puis on prévoit des temps où les concepts et types de raisonnement sont étudiés, après avoir été rencontrés plusieurs fois en situation."
  blocs:
