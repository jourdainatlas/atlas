      - p-07-21
      - p-07-22
      - p-07-23
      - p-07-24
      themes:
      - ly-plan
    - contenu: Équation de cercle.
      precisions: "Déterminer et utiliser l'équation d'un cercle donné par son centre et son rayon. Reconnaître une équation de cercle, déterminer centre et rayon."
