      note: "Les théorèmes classiques du triangle et du cercle ne sont pas exposés dans le cours ; les exercices les démontrent par le calcul vectoriel ou complexe (médianes, hauteurs et droite d'Euler,\
        \ angle droit inscrit dans un demi-cercle, théorème de la médiane, théorème de Napoléon) ; l'angle au centre n'est pas traité."
