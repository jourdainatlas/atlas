# Programme officiel « Programme du CAPES externe bac + 3 de mathématiques (CAPES-CAFEP), session 2027 » (devenirenseignant.gouv.fr, « Capes externe bac + 3 section mathématiques - Programme de la session 2027 » (publié le 15 juillet 2026, modifié le 20 juillet 2026 et le 2 septembre 2026) ; le PDF porte la mention « Publié le 20 juillet 2026 et modifié septembre 2026 » ; version en vigueur pour la session 2027), structuré pour la vue « Programme »
# des Annales (MEMO_atlas_annales.md §45). Liens : cours « chapitre:section » (rang du sommaire, à partir de 1),
# exercices, thèmes d'annales ; un point sans cours ni exercice est affiché « à venir ».
id: capes-bac3
intitule: Programme du CAPES externe bac + 3 de mathématiques (CAPES-CAFEP), session 2027
source:
  nom: devenirenseignant.gouv.fr, « Capes externe bac + 3 section mathématiques - Programme de la session 2027 » (publié le 15 juillet 2026, modifié le 20 juillet 2026 et le 2 septembre 2026) ; le PDF porte
    la mention « Publié le 20 juillet 2026 et modifié septembre 2026 » ; version en vigueur pour la session 2027
  url: "https://www.devenirenseignant.gouv.fr/media/20674/download"
preambule: "Le CAPES externe bac + 3, organisé depuis la session 2026, comporte deux épreuves écrites d'admissibilité de 4 heures (la première, coefficient 3, formée d'exercices ou de problèmes ; la seconde,\
  \ coefficient 2, fondée sur l'analyse de documents) et deux épreuves orales d'admission (un exposé sur la résolution d'un exercice et la notion qu'il met en jeu, 2 h 30 de préparation et 1 heure d'épreuve\
  \ dont 20 minutes d'exposé et 40 minutes d'échanges, coefficient 5 ; un entretien de 35 minutes, coefficient 3). Les épreuves d'admissibilité portent sur le tronc commun des programmes des différentes\
  \ licences de mathématiques, dont le texte officiel énumère les dix-sept chapitres repris ici ; les concepteurs de sujets pourront être amenés à rappeler certains théorèmes ou résultats dans les énoncés.\
  \ La première épreuve d'admission renvoie au programme du cycle terminal du lycée, complété par le programme de l'option Mathématiques expertes et par le programme des épreuves écrites ; ces programmes\
  \ du lycée ne sont pas transcrits ici. La seconde épreuve d'admission (entretien sur la motivation, les valeurs de la République et le métier) n'a pas de programme disciplinaire."
