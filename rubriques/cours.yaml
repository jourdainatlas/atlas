    titre: Analyse asymptotique et développements limités
    resume: |
      Le chapitre définit d'abord la domination, la négligeabilité et les fonctions équivalentes, établit les opérations permises sur les équivalents et dresse la liste des équivalents usuels. Il définit ensuite les développements limités, en établit l'unicité et les opérations (combinaisons linéaires, produits, composition), démontre la primitivation d'un développement limité à partir de l'inégalité des accroissements finis, puis en tire la formule de Taylor-Young et les développements limités usuels en $0$. Ces outils s'appliquent à l'étude locale des fonctions : recherche d'équivalents, de limites et de signes, position d'une courbe par rapport à sa tangente, extrema et asymptotes. La dernière partie transpose les relations de comparaison aux suites, présente les développements asymptotiques et démontre la formule de Stirling, la constante $\sqrt{2\pi}$ étant admise jusqu'au calcul des intégrales de Wallis au chapitre 18.
