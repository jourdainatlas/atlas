  - id: me-06
    niveau: expertes
    chapitre: 6
    titre: Applications des matrices
    resume: |
      Trois usages du calcul matriciel. Un système linéaire de $n$ équations à $n$ inconnues s'écrit $AX = B$ et se résout par l'inverse de $A$. Les transformations du plan (translations, symétries axiales, homothéties, rotations de centre $O$) se traduisent par des matrices. Enfin, la matrice d'adjacence d'un graphe compte, par ses puissances, les chaînes et les chemins de longueur donnée.
