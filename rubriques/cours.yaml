  - id: mp-06
    niveau: mp
    chapitre: 6
    titre: Séries et fonctions à valeurs vectorielles
    resume: |
      Le chapitre transporte dans un espace vectoriel normé de dimension finie deux outils de première année, les séries et le calcul différentiel et intégral d'une variable réelle. Pour une série vectorielle, il définit sommes partielles, convergence, somme et reste, montre qu'une série absolument convergente converge, et l'applique aux séries de matrices, en particulier à l'exponentielle d'une matrice. Il complète ensuite l'étude des séries numériques : comparaison série-intégrale pour une fonction monotone, avec l'exemple des séries de Riemann et de la série harmonique, règle de d'Alembert, puis sommation des relations de comparaison, pour les sommes partielles d'une série divergente comme pour les restes d'une série convergente, avec une méthode pour obtenir le développement asymptotique d'une suite. La dérivation d'une fonction d'une variable réelle à valeurs vectorielles se lit sur les coordonnées dans une base ; le chapitre en donne l'interprétation cinématique (vecteur dérivé, vitesse, tangente), les opérations, la composition par une application linéaire ou bilinéaire, la formule de Leibniz et les fonctions de classe $\mathcal{C}^k$. L'intégrale d'une fonction continue par morceaux sur un segment est définie par les coordonnées, avec sa linéarité, l'inégalité triangulaire intégrale et les sommes de Riemann ; le chapitre établit enfin l'inégalité des accroissements finis et les formules de Taylor avec reste intégral et de Taylor-Young pour les fonctions vectorielles.
