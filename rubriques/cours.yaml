  - id: l3-gt-03
    niveau: l3
    ue: l3-s6-gt
    chapitre: 3
    titre: 'Constructions d''espaces'
    resume: |
      Le chapitre construit des espaces en identifiant des points. L'union disjointe a des morceaux ouverts et fermés ; la topologie quotient est la plus fine qui rende la projection continue, et une application définie sur un quotient est continue dès que sa composée avec la projection l'est. Pour reconnaître un quotient, on cherche une application continue et surjective, ouverte ou fermée, qui identifie exactement les bons points ; une application continue d'un compact sur un séparé suffit. On obtient ainsi le cercle $\mathbb{R}/\mathbb{Z}$, le tore, le ruban de Möbius, la bouteille de Klein, le plan projectif, et $D^{n}/\mathbb{S}^{n-1} \simeq \mathbb{S}^{n}$. Un quotient peut perdre la séparation ($\mathbb{R}/\mathbb{Q}$ est grossier, la droite à deux origines n'est pas séparée) ; le critère des ouverts saturés disjoints dit quand elle subsiste. Le chapitre termine par le cône, la suspension, le recollement de deux disques le long de leur bord et la somme connexe.
    sommaire:
      - 'Introduction historique'
      - 'Union disjointe'
      - 'Topologie quotient'
      - 'Exemples fondamentaux'
      - 'Séparation des quotients'
      - 'Cône, suspension, recollement'
      - 'Bilan'
