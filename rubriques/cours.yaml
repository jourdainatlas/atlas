  - id: ap-02
    niveau: approfondies
    chapitre: 2
    titre: Applications
    resume: |
      Une application y est définie comme un triplet formé d'un ensemble de départ, d'un ensemble d'arrivée et d'un graphe dans lequel chaque élément de départ a une image et une seule. L'égalité de deux applications porte donc sur ces trois données, et non sur la seule formule. Le chapitre traite ensuite l'application identité et la composition, qui est associative mais non commutative. Il définit l'injectivité, la surjectivité et la bijectivité, avec les rédactions types et la lecture graphique par les droites horizontales. Trois versions de la fonction sinus montrent qu'on obtient la surjectivité en restreignant l'ensemble d'arrivée, et l'injectivité en restreignant l'ensemble de départ. Elles conduisent à la bijection réciproque et à la fonction arcsinus. Le chapitre se termine par l'image directe et l'image réciproque d'une partie.
