  - id: mp-12
    niveau: mp
    chapitre: 12
    titre: Intégrales généralisées
    resume: |
      Le chapitre étend l'intégrale à des intervalles quelconques. Une fonction continue par morceaux sur $[a, b[$ a une intégrale convergente lorsque $\int_{a}^{x} f$ admet une limite finie quand $x$ tend vers $b$ ; le chapitre en tire les propriétés de linéarité, de positivité et la relation de Chasles, puis les intégrales de référence, $\int_{1}^{+\infty} t^{-\alpha}\,\mathrm{d}t$, $\int_{0}^{1} t^{-\alpha}\,\mathrm{d}t$ et $\int_{0}^{+\infty} \mathrm{e}^{-\alpha t}\,\mathrm{d}t$. Une fonction est intégrable lorsque l'intégrale de sa valeur absolue converge ; l'intégrabilité entraîne la convergence, et le théorème de comparaison, par majoration, domination ou équivalence, ramène l'étude aux fonctions de référence, avec une méthode d'étude aux bornes. Les techniques de calcul sont adaptées aux bornes ouvertes : intégration par parties, avec la vérification de l'existence des crochets, et changement de variable par une bijection de classe $\mathcal{C}^{1}$ strictement monotone ; elles conduisent à l'intégrale de Gauss. Le chapitre établit ensuite l'intégration des relations de comparaison, pour les restes d'intégrales convergentes comme pour les intégrales partielles divergentes, pendant du résultat analogue pour les séries. Il se termine par les produits scalaires définis par une intégrale, $\langle f, g \rangle = \int_{I} f g\,w$ pour un poids $w$, qui fournissent les espaces de fonctions de carré intégrable et les polynômes orthogonaux du chapitre 10.
    sommaire:
      - Introduction historique
      - Intégrales généralisées
      - Fonctions intégrables
      - Intégration par parties et changement de variable
      - Intégration des relations de comparaison
      - Produits scalaires définis par une intégrale
      - Bilan
