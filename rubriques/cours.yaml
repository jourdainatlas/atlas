    titre: Limites et continuité
    resume: |
      Le chapitre définit la limite d'une fonction en un point adhérent, à l'aide des voisinages, établit ses premières propriétés et les limites à gauche et à droite. Il démontre la caractérisation séquentielle de la limite, les opérations, la composition et le passage à la limite dans les inégalités, puis le théorème de la limite monotone. La continuité en un point vient ensuite, avec le prolongement par continuité, la caractérisation séquentielle et deux fonctions dépourvues de continuité. Sur un intervalle, le chapitre démontre à partir de la borne supérieure du chapitre 7 le théorème des valeurs intermédiaires, qui donne l'existence des racines $n$-ièmes admise au chapitre 4, puis le théorème des bornes atteintes et le théorème de la bijection continue, qui fonde les fonctions réciproques du chapitre 5. La dernière partie traite des fonctions lipschitziennes, de la continuité uniforme, de la façon de montrer qu'une fonction ne l'est pas et du théorème de Heine. Un court passage étend les résultats aux fonctions à valeurs complexes.
