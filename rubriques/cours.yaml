  - id: mp-07
    niveau: mp
    chapitre: 7
    titre: Endomorphismes des espaces euclidiens
    resume: |
      Le chapitre étudie les endomorphismes d'un espace euclidien qui respectent le produit scalaire, ou s'expriment simplement à travers lui. Il établit d'abord la représentation des formes linéaires par le produit scalaire, d'où l'existence et l'unicité de l'adjoint $u^{*}$, caractérisé par $\langle u(x), y \rangle = \langle x, u^{*}(y) \rangle$, ses propriétés algébriques, sa matrice dans une base orthonormée, qui est la transposée, et la stabilité de l'orthogonal d'un sous-espace stable. Il définit ensuite les matrices orthogonales, caractérisées par leurs colonnes ou leurs lignes orthonormées, le groupe orthogonal et le groupe spécial orthogonal, l'orientation d'un espace euclidien et le produit mixte, puis les isométries vectorielles, qui conservent la norme ou le produit scalaire et envoient une base orthonormée sur une base orthonormée, avec les symétries orthogonales et les réflexions. Les isométries du plan sont entièrement décrites : les rotations, de matrice $\begin{pmatrix} \cos\theta & -\sin\theta \\ \sin\theta & \cos\theta \end{pmatrix}$ dans toute base orthonormée directe, et les réflexions, avec la mesure de l'angle orienté. Le théorème de réduction des isométries donne, dans une base orthonormée, une matrice diagonale par blocs formée de $1$, de $-1$ et de blocs de rotation, ce qui décrit les rotations de l'espace de dimension $3$, leur axe et leur angle. Le chapitre démontre enfin le théorème spectral : un endomorphisme autoadjoint, ou une matrice symétrique réelle, se diagonalise dans une base orthonormée ; il en tire les endomorphismes autoadjoints positifs et définis positifs, leur caractérisation par le spectre et le quotient de Rayleigh.
    sommaire:
      - Introduction historique
      - Adjoint d'un endomorphisme
      - Matrices orthogonales et isométries vectorielles
      - Isométries du plan euclidien
      - Réduction des isométries
      - Endomorphismes autoadjoints, théorème spectral
      - Endomorphismes autoadjoints positifs
      - Bilan
