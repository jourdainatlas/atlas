  - id: l3-pr-03
    niveau: l3
    ue: l3-s6-pr
    chapitre: 3
    titre: "Variables aléatoires discrètes"
    resume: |
      Une variable aléatoire est une application mesurable de l'univers ; ce qui compte d'elle est sa loi, probabilité image sur l'ensemble de ses valeurs, déterminée dans le cas discret par les nombres $\mathbb{P}(X = x)$. Le chapitre définit l'espérance d'une variable discrète, en établit la linéarité et la positivité, et démontre la formule de transfert, qui calcule $\mathbb{E}[\varphi(X)]$ sans déterminer la loi de $\varphi(X)$ ; il définit ensuite les moments, la variance et l'écart type. Il étudie les lois uniforme, de Bernoulli, binomiale, géométrique et de Poisson, puis l'indépendance de variables aléatoires : l'espérance d'un produit se factorise et les variances s'ajoutent. Il construit enfin une suite infinie d'épreuves de Bernoulli indépendantes.
