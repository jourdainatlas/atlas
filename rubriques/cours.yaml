  - id: l3-pr-02
    niveau: l3
    ue: l3-s6-pr
    chapitre: 2
    titre: "Probabilités conditionnelles, indépendance"
    resume: |
      Conditionner par un évènement $B$ de probabilité non nulle revient à remplacer la probabilité $\mathbb{P}$ par $\mathbb{P}(\cdot \mid B)$, qui est encore une probabilité. Le chapitre en déduit trois formules : la formule des probabilités composées, qui multiplie les probabilités le long des branches d'un arbre pondéré, la formule des probabilités totales sur un système complet d'évènements, et la formule de Bayes, qui remonte des effets aux causes. Il définit ensuite l'indépendance de deux évènements, puis d'une famille, en distinguant l'indépendance deux à deux de l'indépendance mutuelle, et modélise les épreuves répétées indépendantes.
