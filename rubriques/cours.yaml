  - id: l3-hf-05
    niveau: l3
    ue: l3-s6-hf
    chapitre: 5
    titre: 'Séries de Fourier dans $L^{2}$, formule de Parseval'
    resume: |
      Le chapitre identifie les fonctions $2\pi$-périodiques aux fonctions sur le cercle $\mathbb{T}$ et définit les polynômes trigonométriques, puis la convolution sur $\mathbb{T}$, qui régularise. Une approximation de l'unité (suite de fonctions positives, de masse $1$, concentrées en $0$) approche uniformément toute fonction continue par convolution ; avec les noyaux $(1 + \cos t)^{n}$ normalisés, c'est le théorème de Weierstrass trigonométrique. Les coefficients de Fourier sont les produits scalaires avec les exponentielles $e_{n}$, qui forment une base hilbertienne de $L^{2}(\mathbb{T})$ : toute série de Fourier converge en moyenne quadratique et la formule de Parseval vaut. Le chapitre l'applique au calcul de $\zeta(2)$ et $\zeta(4)$ et à la rotation irrationnelle du cercle.
