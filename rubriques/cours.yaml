  - id: ma-05
    niveau: ma
    chapitre: 5
    titre: Fonctions usuelles et dérivation pratique
    resume: |
      Le chapitre commence par les généralités sur les fonctions : ensemble de définition, représentation graphique, parité, périodicité, symétries par rapport à une droite verticale ou à un point, opérations, monotonie, fonctions bornées. La partie consacrée à la dérivation rassemble les règles pratiques. Le lien entre signe de la dérivée et monotonie y est admis, de même que le théorème donnant la dérivabilité de la bijection réciproque ; ils seront démontrés aux chapitres 8 et 9. Cette partie traite aussi les branches infinies, l'étude complète d'une fonction, menée en exemple sur la fonction périodique $x \mapsto \sin x \cos^{2} x$, et les dérivées successives. L'exponentielle est définie comme l'unique fonction dérivable égale à sa dérivée et valant $1$ en $0$. Le logarithme népérien en est la réciproque, et le chapitre en déduit les logarithmes de base $a$, les puissances réelles et les croissances comparées. Le chapitre étudie ensuite les fonctions circulaires réciproques arc sinus, arc cosinus et arc tangente, puis les fonctions hyperboliques. Il se termine par la dérivation des fonctions à valeurs complexes, en particulier de $t \mapsto \mathrm{e}^{\mathrm{i}t}$. Le bilan rassemble le tableau des dérivées usuelles.
