  - id: l3-gt-07
    niveau: l3
    ue: l3-s6-gt
    chapitre: 7
    titre: 'Classification des surfaces compactes'
    resume: |
      Recoller deux à deux les côtés d'un polygone selon un mot où chaque lettre apparaît deux fois donne une surface compacte connexe, et le théorème de Radó, admis, affirme que toute surface compacte connexe s'obtient ainsi. Les règles de découpage-recollement transforment le mot sans changer la surface ; la somme connexe correspond à la juxtaposition des mots, la sphère en est le neutre, la bouteille de Klein est la somme de deux plans projectifs, et la somme d'un plan projectif et d'un tore est celle d'un plan projectif et d'une bouteille de Klein. Le chapitre ramène tout mot à une forme normale à une seule classe de sommets : toute surface compacte connexe est une sphère, une somme connexe de tores ou une somme connexe de plans projectifs. La caractéristique d'Euler, dont l'invariance est admise, et l'orientabilité, qu'une lettre tordue détruit, distinguent les surfaces de la liste, ce qui achève la classification.
    sommaire:
      - 'Introduction historique'
      - 'L''énoncé'
      - 'Quotients de polygones'
      - 'La forme normale'
      - 'Les invariants'
      - 'Bilan'
