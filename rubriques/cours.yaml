  - id: ap-04
    niveau: approfondies
    chapitre: 4
    titre: Morphismes
    resume: |
      Le chapitre étudie les applications qui respectent une loi de groupe : morphismes, endomorphismes, isomorphismes et automorphismes, lus sur un diagramme commutatif. L'exponentielle, isomorphisme de $(\mathbb{R}\,;+)$ sur $(\mathbb{R}_{+}^{*}\,;\times)$, est présentée comme le principe de la règle à calcul ; le module, la conjugaison et $k \mapsto nk$ complètent les exemples. Un morphisme envoie le neutre sur le neutre et les symétriques sur les symétriques ; la composée de deux morphismes, et la réciproque d'un isomorphisme, sont encore des morphismes. La seconde partie définit le noyau et l'image, montre que ce sont des sous-groupes, et caractérise l'injectivité par $\mathrm{Ker}\,f = \{e_G\}$. Les exemples retrouvent $\mathbb{U}$ comme noyau du module et montrent que $\mathbb{Z}$ est isomorphe à son sous-groupe propre $n\mathbb{Z}$.
