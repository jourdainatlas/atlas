  - id: l3-cd-07
    niveau: l3
    ue: l3-s5-cd
    chapitre: 7
    titre: "Équations différentielles : approximation numérique"
    resume: |
      Le chapitre approche les solutions des équations différentielles par des schémas numériques et les juge sur trois critères : l'ordre, qui fixe la vitesse de convergence quand le pas tend vers 0, la stabilité, qui dit si les erreurs commises à chaque pas restent maîtrisées, et le coût. Il commence par la méthode d'Euler, dont il démontre la convergence, et montre son instabilité sur l'équation $y' = -\lambda y$ quand le pas est trop grand, que corrige le schéma implicite. Les portraits de phase des systèmes autonomes, et en particulier des systèmes linéaires du plan (nœuds, cols, foyers, centres), permettent de lire le comportement qualitatif des solutions et de juger un schéma. Le théorème central majore l'erreur d'un schéma à un pas consistant d'ordre $p$ et stable par un $O(h^{p})$, grâce au lemme de Gronwall discret. Viennent ensuite les schémas d'ordre 2, Euler modifiée et Heun, puis les méthodes de Runge-Kutta, dont la méthode classique d'ordre 4. Le chapitre se termine en Python, par la méthode de Picard discrétisée et par les solveurs de la bibliothèque scipy, à pas adaptatif ou adaptés aux équations raides.
    sommaire:
      - "Introduction historique"
      - "La méthode d'Euler"
      - "Portraits de phase"
      - "Majoration de l'erreur des schémas à un pas"
      - "Schémas d'ordre 2 : Euler modifiée et Heun"
