  - id: ma-16
    niveau: ma
    chapitre: 16
    titre: Matrices
    resume: |
      Le chapitre définit l'espace des matrices, sa base canonique et le produit matriciel, avec ses règles de calcul et la transposition. Il étudie ensuite l'anneau des matrices carrées, qui n'est ni commutatif ni intègre, les matrices diagonales, triangulaires, symétriques et antisymétriques, la formule du binôme pour deux matrices qui commutent et le groupe linéaire des matrices inversibles. La partie centrale construit le dictionnaire entre matrices et applications linéaires : matrice d'une application linéaire dans des bases, traduction de la composition en produit et des isomorphismes en matrices inversibles, application linéaire canoniquement associée, noyau, image et rang d'une matrice. Viennent ensuite les matrices de passage et les formules de changement de bases, les matrices équivalentes, dont le rang est le seul invariant, le rang de la transposée et les matrices extraites, puis les matrices semblables et la trace. La dernière partie traduit les opérations élémentaires en produits par des matrices de transvection, de dilatation et de transposition, présente l'algorithme de Gauss-Jordan, qui calcule le rang et l'inverse, et décrit l'ensemble des solutions d'un système linéaire, jusqu'aux systèmes de Cramer.
    sommaire:
      - Introduction historique
      - Calcul matriciel
      - Matrices carrées
      - Matrices et applications linéaires
      - Changements de bases, équivalence et similitude
      - Opérations élémentaires et systèmes linéaires
      - Bilan
