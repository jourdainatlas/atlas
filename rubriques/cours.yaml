  - id: l3-gd-02
    niveau: l3
    ue: l3-s6-gd
    chapitre: 2
    titre: 'Sous-variétés de $\mathbb{R}^{n}$'
    resume: |
      Une sous-variété de dimension $d$ de $\mathbb{R}^{n}$ est une partie qui, près de chacun de ses points, se redresse par un difféomorphisme local en un morceau de $\mathbb{R}^{d} \times \{0\}$. Le chapitre définit les immersions et les submersions et, à l'aide du théorème d'inversion locale, établit leurs formes normales locales. Il en déduit le théorème des quatre caractérisations : une partie est une sous-variété si et seulement si elle est localement définie par une équation submersive, par un paramétrage qui est une immersion et un homéomorphisme sur son image, ou comme un graphe ; une immersion injective ne suffit pas. Les sphères et le groupe orthogonal sont des sous-variétés, le cône $x^{2} + y^{2} = z^{2}$ n'en est pas une. L'espace tangent, formé des vitesses des courbes tracées sur la sous-variété, est un sous-espace de dimension $d$, noyau de la différentielle de l'équation ou image de celle du paramétrage ; il fournit la condition des extrema liés et les multiplicateurs de Lagrange.
