  - id: ma-17
    niveau: ma
    chapitre: 17
    titre: Groupe symétrique et déterminants
    resume: |
      Le chapitre commence par le groupe symétrique : permutations, support, cycles et transpositions, décomposition de toute permutation en produit de cycles à supports disjoints, signature, dont il démontre qu'elle est un morphisme de groupes, et groupe alterné. Il définit ensuite les formes $n$-linéaires alternées et établit que, sur un espace de dimension $n$ muni d'une base, il en existe une seule qui vaut $1$ sur cette base : c'est le déterminant dans la base, qui caractérise les bases et permet d'orienter l'espace. Il en tire le déterminant d'un endomorphisme, puis celui d'une matrice carrée, avec leurs propriétés : multiplicativité, caractérisation de l'inversibilité, invariance par similitude et par transposition. La partie calculatoire traite des opérations élémentaires, des matrices triangulaires, du développement selon une ligne ou une colonne et du déterminant de Vandermonde. La dernière partie introduit la comatrice, en déduit une expression de l'inverse d'une matrice et les formules de Cramer.
