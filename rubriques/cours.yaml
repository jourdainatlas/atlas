    chapitre: 7
    titre: "Produit de mesures, théorèmes de Fubini-Tonelli et de Fubini"
    resume: |
      Sur le produit de deux espaces mesurés $\sigma$-finis, le chapitre construit la tribu produit, engendrée par les pavés mesurables et dont les sections sont mesurables, puis la mesure produit, unique mesure qui multiplie les mesures des côtés des pavés, obtenue en intégrant la mesure des sections ; la mesure de Lebesgue de $\mathbb{R}^{n_{1} + n_{2}}$ en est le produit. Le théorème de Fubini-Tonelli permet d'intégrer une fonction positive dans l'ordre que l'on veut, sans autre hypothèse ; celui de Fubini fait de même pour une fonction de signe quelconque, une fois vérifié, par Fubini-Tonelli, que son module est intégrable. Le chapitre traite aussi les fonctions mesurables au sens de Lebesgue, puis les applications : intégrale de Gauss, volume des boules euclidiennes, fonction bêta, formule des ensembles de niveau et pavage d'un rectangle.
