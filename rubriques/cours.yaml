  - id: mp-02
    niveau: mp
    chapitre: 2
    titre: Éléments propres et diagonalisation
    resume: |
      Le chapitre ouvre la réduction des endomorphismes en dimension finie. Il commence par des compléments d'algèbre linéaire : somme directe d'une famille finie de sous-espaces, base adaptée et projecteurs associés, définition d'une application linéaire par recollement, matrices définies par blocs, leurs opérations et le déterminant d'une matrice triangulaire par blocs. Il définit ensuite les sous-espaces stables et l'endomorphisme induit, que traduisent les matrices triangulaires par blocs, puis les valeurs propres, vecteurs propres, sous-espaces propres et le spectre, pour un endomorphisme comme pour une matrice, et démontre que des sous-espaces propres associés à des valeurs propres distinctes sont en somme directe. Le polynôme caractéristique, unitaire de degré $n$, dont le coefficient sous-dominant est l'opposé de la trace et le terme constant est lié au déterminant, a pour racines les valeurs propres ; le chapitre définit la multiplicité d'une valeur propre, l'encadrement de la dimension du sous-espace propre par cette multiplicité, et montre que $AB$ et $BA$ ont le même polynôme caractéristique. La diagonalisation est caractérisée par les sous-espaces propres, dont la somme doit valoir $E$, puis par le polynôme caractéristique, qui doit être scindé avec des sous-espaces propres de dimension égale à la multiplicité ; une valeur propre simple suffit pour son sous-espace, et un polynôme caractéristique scindé à racines simples entraîne la diagonalisabilité. Une méthode pratique de diagonalisation en taille $2$ et $3$ et le calcul des puissances d'une matrice en sont les applications. Le chapitre traite enfin la trigonalisation, possible exactement lorsque le polynôme caractéristique est scindé, donc toujours sur $\mathbb{C}$, avec la trace et le déterminant comme somme et produit des valeurs propres, et les endomorphismes nilpotents, caractérisés comme trigonalisables avec pour seule valeur propre $0$, avec leur indice de nilpotence.
    sommaire:
      - Introduction historique
      - Compléments d'algèbre linéaire
      - Sous-espaces stables et éléments propres
      - Polynôme caractéristique
      - Diagonalisation
      - Trigonalisation
      - Endomorphismes nilpotents
      - Bilan
