# Rubrique « Cours » — PROTOTYPE.
# Les chapitres de Seconde, de Première, de Terminale, de Maths expertes et de Maths approfondies sont
# en ligne (PDF dans documents/cours/<niveau>/).
# Champs d'un cours :
#   id, niveau, chapitre, titre, resume (texte riche), sommaire (liste de sections),
#   theories (nœuds de l'édifice), notions (termes du lexique), exercices (id d'une feuille),
#   liens (id d'autres cours, affichés dans les deux sens comme « chapitres liés »),
#   pdf, tex (chemins des fichiers déposés), pages, statut (depose | a-deposer)

intro: |
  Les cours sont rédigés en LaTeX, chapitre par chapitre, et déposés ici au fil de l'année sous forme de PDF. Chaque chapitre indique les théories de l'édifice sur lesquelles il repose, ce qui permet de passer d'un cours de lycée aux fondements qui le justifient.

niveaux:
  - id: seconde
    titre: Seconde
    description: Seconde générale.
  - id: premiere
    titre: Première
    description: Enseignement de spécialité mathématiques.
  - id: terminale
    titre: Terminale
    description: Enseignement de spécialité mathématiques.
  - id: expertes
    titre: Maths expertes
    description: Terminale, option mathématiques expertes, suivie en complément de la spécialité.
  - id: approfondies
    titre: Maths approfondies
    description: Terminale, option de préparation aux classes préparatoires scientifiques (MPSI principalement) ; initiation au programme de première année.
  - id: ma
    titre: Maths Sup – MPSI
    description: Classe préparatoire, première année (MPSI) ; cours de mathématiques de première année, chapitre par chapitre.
  - id: mp
    titre: Maths Spé – MP
    description: Classe préparatoire, seconde année (MP) ; cours de mathématiques de deuxième année, chapitre par chapitre, à la suite du niveau MPSI.
  - id: ecg
    titre: Maths ECG
    description: Classe préparatoire économique et commerciale.
  - id: l3
    titre: Licence 3
    description: Troisième année de licence de mathématiques, rangée par semestre puis par unité d'enseignement ; chaque UE se lit chapitre par chapitre.
  - id: master
    titre: Master
    description: Cours de niveau master, un document par thème, avec sa feuille d'exercices corrigés.
  - id: python
    titre: Python – Lycée
    description: Initiation à la programmation en Python, des premières instructions aux algorithmes du programme de lycée.

ues:
  - id: l3-s5-cd
    niveau: l3
    semestre: 5
    titre: Calcul différentiel et équations différentielles
    resume: |
      L'UE étend le calcul différentiel aux applications entre espaces vectoriels normés, le plus souvent complets, et en tire deux grands usages : l'optimisation et les équations différentielles. Elle commence par le cadre, normes, compacité, complétude et théorème du point fixe, puis définit la différentielle et l'étudie jusqu'aux théorèmes d'inversion locale et des fonctions implicites et aux formules de Taylor à tous les ordres. Les extrema libres et liés en sont la première application. Les deux derniers chapitres traitent des équations différentielles, d'abord l'existence et l'unicité des solutions (Peano, Cauchy-Lipschitz, solutions maximales), puis leur approximation numérique (Euler, Runge-Kutta, portraits de phase, solveurs de Python). Chaque chapitre a sa fiche de synthèse d'une page.
    pdf_complet: documents/ue/l3/calcul_differentiel_cours_complet.pdf
    fiches: documents/ue/l3/calcul_differentiel_fiches.pdf
    pages: 108
    prerequis: [mp-04, mp-05, mp-17]
  - id: l3-s5-int
    niveau: l3
    semestre: 5
    titre: Intégration
    resume: |
      L'UE construit l'intégrale de Lebesgue et ses principaux outils. Elle part des tribus et des mesures positives, construit la mesure de Lebesgue sur $\mathbb{R}^{n}$, puis l'intégrale des fonctions mesurables positives et celle des fonctions intégrables, avec les théorèmes de convergence monotone et de convergence dominée. Elle en tire les intégrales à paramètres et les transformations de Fourier, de Laplace et de Mellin, la formule de changement de variables, les théorèmes de Fubini-Tonelli et de Fubini, les espaces $L^{p}$ avec le théorème de Radon-Nikodym et la dualité, et se termine par la convolution, la régularisation et les théorèmes de densité.
    pdf_complet: documents/ue/l3/integration_cours_complet.pdf
    pages: 84
    prerequis: [ma-18, mp-12, mp-13]
  - id: l3-s5-sa
    niveau: l3
    semestre: 5
    titre: Structures algébriques
    resume: |
      L'UE reprend les structures de l'algèbre générale et les mène jusqu'aux extensions de corps. Elle part des groupes, du groupe symétrique, des anneaux et des corps, puis étudie les idéaux et les anneaux quotients (idéaux premiers et maximaux, théorème de Krull, lemme chinois), la divisibilité dans les anneaux factoriels, principaux et euclidiens, et les modules et anneaux noethériens jusqu'au théorème de la base de Hilbert. Les polynômes occupent deux chapitres : le lemme de Gauss et la factorialité de $A[X]$, les critères d'irréductibilité, puis les polynômes symétriques, le résultant et le discriminant. Les deux derniers chapitres traitent des extensions de corps (degré, éléments algébriques, corps de rupture et de décomposition, clôture algébrique, théorème de d'Alembert-Gauss) et de leurs exemples remarquables : extensions quadratiques, corps finis et extensions cyclotomiques.
    pdf_complet: documents/ue/l3/structures_algebriques_cours_complet.pdf
    pages: 65
    prerequis: [ma-11, ma-13, mp-01]
  - id: l3-s6-pr
    niveau: l3
    semestre: 6
    titre: Probabilités
    resume: |
      L'UE fonde le calcul des probabilités sur la théorie de la mesure et le mène jusqu'aux théorèmes limites. Elle définit les espaces probabilisés, les probabilités conditionnelles et l'indépendance, puis les variables aléatoires discrètes et à densité, leur loi, leur espérance et leur variance, et les vecteurs aléatoires avec la covariance et la corrélation. Les séries génératrices et les fonctions caractéristiques codent les lois par des fonctions ; elles servent à étudier les quatre modes de convergence des variables aléatoires, la loi faible et la loi forte des grands nombres et le théorème central limite. L'UE se termine par les vecteurs gaussiens, le théorème de Cochran et les lois du khi-deux et de Student.
    pdf_complet: documents/ue/l3/probabilites_cours_complet.pdf
    pages: 102
    prerequis: [ma-21, mp-14, mp-15]
  - id: l3-s6-hf
    niveau: l3
    semestre: 6
    titre: Espaces de Hilbert et séries de Fourier
    resume: |
      L'UE étend la géométrie euclidienne aux espaces de dimension infinie et l'applique à l'analyse de Fourier. Elle part des espaces préhilbertiens, de l'inégalité de Cauchy-Schwarz et du procédé de Gram-Schmidt, puis montre que la complétude des espaces de Hilbert garantit l'existence de la projection sur un convexe fermé. Les bases hilbertiennes et la formule de Parseval identifient tout espace de Hilbert séparable à $\ell^{2}$ ; le théorème de représentation de Riesz donne l'adjoint d'un opérateur et le théorème ergodique de von Neumann. Les exponentielles forment une base hilbertienne de $L^{2}(\mathbb{T})$ : l'UE en tire la convergence en moyenne quadratique des séries de Fourier, puis étudie leur convergence ponctuelle (Fejér, Dirichlet, divergence en un point). Elle se termine par la transformation de Fourier sur $L^{1}(\mathbb{R})$ et sur $L^{2}(\mathbb{R})$, la formule de Plancherel, le principe d'incertitude de Heisenberg et le théorème d'échantillonnage de Shannon.
    pdf_complet: documents/ue/l3/hilbert_fourier_cours_complet.pdf
    pages: 81
    prerequis: [mp-10, mp-11, mp-04]
  - id: l3-s6-gd
    niveau: l3
    semestre: 6
    titre: Géométrie différentielle
    resume: |
      L'UE étudie la géométrie des courbes et des surfaces de l'espace euclidien, puis les outils qui la rendent intrinsèque. Elle commence par les courbes : arcs géométriques, longueur, paramétrage par longueur d'arc, courbure et torsion, qui déterminent une courbe à un déplacement près. Elle définit ensuite les sous-variétés de $\mathbb{R}^{n}$, reconnues par redressement, équation, paramétrage ou graphe grâce au théorème d'inversion locale, et leur espace tangent. Sur une surface, la première forme fondamentale mesure longueurs, angles et aires ; l'application de Weingarten donne les courbures principales et la courbure de Gauss. Les géodésiques, solutions d'une équation qui ne dépend que de la première forme, réalisent localement le plus court chemin et conduisent au Theorema egregium : la courbure de Gauss est intrinsèque. L'UE se termine par les formes différentielles, la différentielle extérieure et le lemme de Poincaré.
    pdf_complet: documents/ue/l3/geometrie_differentielle_cours_complet.pdf
    pages: 70
    prerequis: [l3-cd-03, mp-17, mp-07]
  - id: l3-s6-gt
    niveau: l3
    semestre: 6
    titre: Géométrie et topologie
    resume: |
      L'UE pose les bases de la topologie générale puis de la topologie algébrique, avec un fil conducteur : reconnaître quand deux espaces sont, ou ne sont pas, homéomorphes. Elle définit les espaces topologiques, la continuité et les homéomorphismes, puis les deux premiers invariants, la connexité et la compacité. Elle construit ensuite de nouveaux espaces par quotient et recollement (tore, ruban de Möbius, bouteille de Klein, plan projectif) et étudie les variétés topologiques, les revêtements et les quotients par des actions de groupes. Le groupe fondamental, calculé grâce au relèvement des chemins dans les revêtements, distingue le cercle, le tore et les espaces projectifs, et donne le théorème de Brouwer en dimension 2 et le théorème de d'Alembert-Gauss. L'UE se termine par la classification des surfaces compactes à l'aide de la forme normale des polygones, de la caractéristique d'Euler et de l'orientabilité.
    pdf_complet: documents/ue/l3/geometrie_topologie_cours_complet.pdf
    pages: 78
    prerequis: [mp-04, mp-05, ma-11]
cours:
  - id: s-01
    niveau: seconde
    chapitre: 1
    titre: Nombres et calculs
    resume: |
      Les règles de calcul sur les fractions, les puissances d'exposant entier relatif et les racines carrées, avec l'écriture scientifique et la simplification des radicaux. Le chapitre présente ensuite les ensembles emboîtés $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{D} \subset \mathbb{Q} \subset \mathbb{R}$, caractérise les rationnels par leur écriture décimale finie ou périodique et démontre par l'absurde l'irrationalité de $\sqrt{2}$. Il se termine par les intervalles, leur représentation sur la droite graduée, leur intersection et leur réunion.
    sommaire:
    - Introduction historique
    - Fractions, puissances et racines carrées
    - Ensembles de nombres
    - Intervalles
    sommaire_pages: [1, 2, 3, 5]
    theories:
    - q-irrationnel
    - c-racine-reelle
    - q
    - r
    notions:
    - ensemble-entiers-naturels
    - ensemble-entiers-relatifs
    - ensemble-rationnels
    - ensemble-reels
    - intervalle
    liens:
    - s-09
    pdf: documents/cours/seconde/chap01_nombres.pdf
    pages: 6
    exercices: f-s-01
    statut: depose
  - id: s-02
    niveau: seconde
    chapitre: 2
    titre: Calcul littéral
    resume: |
      Les expressions littérales, leur valeur numérique et la distinction entre somme et produit. Le chapitre établit la simple et la double distributivité, illustrées par des aires, puis les trois identités remarquables, qu'il démontre et utilise pour le calcul mental. La factorisation est présentée comme l'opération inverse, par facteur commun ou par identité remarquable, et appliquée à l'équation produit nul. La dernière partie traite des expressions rationnelles : valeurs interdites, simplification par un facteur commun et réduction au même dénominateur.
    sommaire:
    - Introduction historique
    - Développement
    - Factorisation
    - Expressions rationnelles
    sommaire_pages: [1, 2, 4, 6]
    theories: [z-anneau, pol-anneau, pol-racines, z-polynomes]
    notions:
    - anneau
    - anneau-polynomes
    liens:
    - s-04
    - p-01
    pdf: documents/cours/seconde/chap02_calcul_litteral.pdf
    pages: 7
    exercices: f-s-02
    statut: depose
  - id: s-03
    niveau: seconde
    chapitre: 3
    titre: Probabilités
    resume: |
      Le vocabulaire des expériences aléatoires : issues, univers, événements, événement contraire, intersection, réunion et événements incompatibles, représentés par des diagrammes. Le chapitre définit une loi de probabilité sur un univers fini, traite l'équiprobabilité, démontre les formules $P(\overline{A}) = 1-P(A)$ et $P(A \cup B) = P(A)+P(B)-P(A \cap B)$, et calcule sur des arbres et des tableaux à double entrée. Il introduit enfin la probabilité conditionnelle $P_A(B)$, la formule $P(A \cap B) = P(A) \times P_A(B)$ et l'indépendance de deux événements.
    sommaire:
    - Introduction historique
    - Vocabulaire et schémas
    - Calculs de probabilités
    - Probabilités conditionnelles
    sommaire_pages: [1, 2, 4, 6]
    theories:
    - p-espace
    - p-independance
    - proba
    notions:
    - espace-probabilise
    - independance
    liens:
    - p-05
    pdf: documents/cours/seconde/chap03_probabilites.pdf
    pages: 8
    exercices: f-s-03
    statut: depose
  - id: s-04
    niveau: seconde
    chapitre: 4
    titre: Équations
    resume: |
      La résolution des équations du premier degré par le principe de la balance : on ajoute, retranche, multiplie ou divise les deux membres par un même nombre non nul, avec les cas où l'inconnue disparaît (aucune solution ou tous les réels). Le chapitre démontre qu'un produit est nul si et seulement si l'un de ses facteurs l'est et en tire la méthode des équations produit, puis traite les équations quotient, où les valeurs interdites du dénominateur doivent être écartées.
    sommaire:
    - Introduction historique
    - Équations du premier degré
    - Équations produit
    - Équations quotient
    sommaire_pages: [1, 2, 4, 5]
    theories:
    - z-anneau
    - ar-corps
    notions:
    - anneau-integre
    - corps
    liens:
    - s-02
    - s-09
    pdf: documents/cours/seconde/chap04_equations.pdf
    pages: 6
    exercices: f-s-04
    statut: depose
  - id: s-05
    niveau: seconde
    chapitre: 5
    titre: Géométrie cartésienne
    resume: |
      Les repères du plan (quelconque, orthogonal, orthonormé) et les coordonnées d'un point. Le chapitre établit la formule du milieu d'un segment, valable dans tout repère, et l'utilise pour trouver un symétrique ou reconnaître un parallélogramme ; il démontre par le théorème de Pythagore la formule de la distance entre deux points, qui exige un repère orthonormé, et l'applique à la nature d'un triangle. Une dernière partie traduit ces formules en fonctions Python et discute les limites des tests d'égalité sur des valeurs approchées.
    sommaire:
    - Introduction historique
    - Repères et coordonnées
    - Milieu d'un segment
    - Distance entre deux points
    - Applications Python
    sommaire_pages: [1, 2, 3, 4, 5]
    theories: [v-espace, me-espace, gd-normes]
    notions:
    - couple
    - norme
    liens:
    - s-08
    - s-10
    - p-03
    pdf: documents/cours/seconde/chap05_geometrie_cartesienne.pdf
    pages: 6
    exercices: f-s-05
    statut: depose
  - id: s-06
    niveau: seconde
    chapitre: 6
    titre: Pourcentages
    resume: |
      Une proportion et ses trois écritures (fraction, décimal, pourcentage), l'application d'un pourcentage à une quantité et la proportion d'une proportion, qui se calcule par produit. Le chapitre définit ensuite le taux d'évolution et le coefficient multiplicateur $CM = 1+t$, montre que des évolutions successives se composent en multipliant les coefficients et non en ajoutant les taux, et traite l'évolution réciproque, de coefficient $\dfrac{1}{CM}$. Il distingue enfin points de pourcentage et pourcentage d'évolution.
    sommaire:
    - Introduction historique
    - Proportions
    - Évolutions
    sommaire_pages: [1, 2, 3]
    theories:
    - q
    notions:
    - ensemble-rationnels
    liens:
    - s-11
    - p-02
    pdf: documents/cours/seconde/chap06_pourcentages.pdf
    pages: 5
    exercices: f-s-06
    statut: depose
  - id: s-07
    niveau: seconde
    chapitre: 7
    titre: Fonctions numériques
    resume: |
      La notion de fonction : ensemble de définition, image et antécédents, expression algébrique, tableau de valeurs et courbe représentative, avec la lecture graphique des images et des antécédents. Le chapitre définit les fonctions croissantes et décroissantes, le tableau de variations, puis le maximum et le minimum. Il étudie les fonctions de référence carré, racine carrée, inverse et cube, démontre leurs variations (celle de la fonction cube est admise) et compare $\sqrt{x}$, $x$, $x^2$ et $x^3$ selon que $x$ est inférieur ou supérieur à $1$. Il résout enfin $x^2 = a$ et énonce la résolution de $x^2 \leqslant a$.
    sommaire:
    - Introduction historique
    - Notion de fonction
    - Courbe représentative d'une fonction
    - Variations d'une fonction
    - Extremum d'une fonction
    - Fonctions de référence
    sommaire_pages: [1, 2, 3, 3, 4, 5]
    theories: [r-application, od-croissantes, ar-corps, c-racine-reelle]
    notions: [application, intervalle, extremum-local]
    liens:
    - s-09
    - p-04
    - t-03
    pdf: documents/cours/seconde/chap07_fonctions.pdf
    pages: 10
    exercices: f-s-07
    statut: depose
  - id: s-08
    niveau: seconde
    chapitre: 8
    titre: Équations cartésiennes
    resume: |
      Le vecteur directeur d'une droite, puis l'équation cartésienne $ax+by+c=0$, démontrée par la nullité d'un déterminant, avec ses vecteurs directeurs usuels. Le chapitre en déduit l'équation réduite $y = mx+p$ lorsque $b \neq 0$, le coefficient directeur et l'ordonnée à l'origine, avec leur lecture graphique. Il donne le critère $ab'-a'b \neq 0$ pour que deux droites soient sécantes, puis résout le système formé par leurs équations par substitution et par combinaison linéaire.
    sommaire:
    - Introduction historique
    - Vecteur et droite
    - Intersection et systèmes
    sommaire_pages: [1, 2, 4]
    theories: [v-libre, v-det-matrice, v-espace]
    notions:
    - determinant
    - famille-libre
    liens:
    - s-05
    - s-10
    - p-03
    pdf: documents/cours/seconde/chap08_equations_droites.pdf
    pages: 5
    exercices: f-s-08
    statut: depose
  - id: s-09
    niveau: seconde
    chapitre: 9
    titre: Inéquations
    resume: |
      Les règles de manipulation des inégalités, dont le changement de sens lors d'une multiplication par un nombre strictement négatif, et la résolution des inéquations du premier degré. Le chapitre rappelle les fonctions affines, la détermination de $m$ et $p$ à partir de deux images, et démontre le signe de $mx+p$ de part et d'autre de sa racine. Il résout ensuite les inéquations produit et quotient par tableau de signes, en excluant les valeurs interdites, et termine par la position relative de deux courbes, ramenée au signe de leur différence.
    sommaire:
    - Introduction historique
    - Règles de base
    - Signe des fonctions affines
    - Inéquations produit
    - Inéquations quotient
    - Position relative de deux courbes représentatives
    sommaire_pages: [1, 2, 3, 5, 6, 6]
    theories:
    - q-ordre
    - ar-corps
    notions:
    - corps-ordonne
    - intervalle
    liens:
    - s-01
    - s-04
    - s-07
    pdf: documents/cours/seconde/chap09_inequations.pdf
    pages: 7
    exercices: f-s-09
    statut: depose
  - id: s-10
    niveau: seconde
    chapitre: 10
    titre: Vecteurs
    resume: |
      Le vecteur défini par une translation, avec sa direction, son sens et sa norme, l'égalité de deux vecteurs caractérisée par un parallélogramme, la somme comme enchaînement de deux translations, la relation de Chasles, le vecteur nul et le vecteur opposé. Le chapitre passe ensuite aux coordonnées dans un repère, à la norme en repère orthonormé, puis aux coordonnées d'une somme et d'un produit par un réel. Il se termine par la colinéarité, le déterminant de deux vecteurs et le critère de colinéarité, appliqué à l'alignement et au parallélisme.
    sommaire:
    - Introduction historique
    - Vecteurs du plan
    - Vecteurs dans un repère
    - Opérations sur les vecteurs
    - Colinéarité
    sommaire_pages: [1, 2, 4, 5, 6]
    theories: [v-espace, v-combinaisons, v-libre, v-det-matrice]
    notions:
    - espace-vectoriel
    - famille-libre
    - determinant
    liens:
    - s-05
    - s-08
    - p-07
    pdf: documents/cours/seconde/chap10_vecteurs.pdf
    pages: 7
    exercices: f-s-10
    statut: depose
  - id: s-11
    niveau: seconde
    chapitre: 11
    titre: Statistiques
    resume: |
      Le vocabulaire des séries statistiques (population, caractère, effectif, fréquence) et le diagramme en bâtons. Le chapitre définit la moyenne, interprétée comme point d'équilibre, la moyenne pondérée et l'effet d'une transformation affine des données, puis la médiane, insensible aux valeurs extrêmes. Il mesure ensuite la dispersion par l'étendue, les quartiles et l'écart interquartile, lus aussi sur un tableau d'effectifs cumulés croissants, et résume une série par un diagramme en boîte, qui permet de comparer deux séries.
    sommaire:
