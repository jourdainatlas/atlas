  - id: l3-gt-05
    niveau: l3
    ue: l3-s6-gt
    chapitre: 5
    titre: 'Groupe fondamental'
    resume: |
      Deux chemins de mêmes extrémités sont homotopes s'ils se déforment continûment l'un en l'autre ; c'est une relation d'équivalence, et l'homotopie rectiligne rend homotopes deux chemins d'un convexe. La concaténation passe aux classes et y est associative, avec un neutre et des inverses : les classes de lacets en un point forment le groupe fondamental, qui ne dépend du point base qu'à isomorphisme près, par conjugaison, dans un espace connexe par arcs. Un espace est simplement connexe si tout lacet s'y contracte, ce qui revient à dire que tout cercle se prolonge en disque ; le petit théorème de Van Kampen, pour une réunion de deux ouverts simplement connexes d'intersection connexe par arcs, montre que les sphères de dimension au moins $2$ le sont. Une application continue induit un morphisme de groupes fondamentaux, de façon fonctorielle, et un homéomorphisme un isomorphisme. Les homotopies d'applications et les rétractions par déformation ramènent le calcul à des espaces plus petits ; le calcul d'un groupe non trivial est l'objet du chapitre suivant.
    sommaire:
      - 'Introduction historique'
      - 'Homotopie de chemins'
      - 'Le groupe fondamental'
      - 'Espaces simplement connexes'
      - 'Morphisme induit par une application continue'
      - 'Homotopie d''applications et rétractions'
      - 'Bilan'
