  - id: l3-in-06
    niveau: l3
    ue: l3-s5-int
    chapitre: 6
    titre: "Changement de variables, lemme de Sard"
    resume: |
      Le chapitre établit la formule du changement de variables pour l'intégrale de Lebesgue. Une application linéaire multiplie la mesure de toute partie mesurable par la valeur absolue de son déterminant, et les isométries la conservent. Une application de classe $C^{1}$ envoie les parties négligeables sur des parties négligeables et les mesurables sur des mesurables ; elle ressemble localement à sa différentielle, et la mesure de l'image d'un petit cube est majorée par l'intégrale de la valeur absolue du jacobien sur ce cube. La formule de changement de variables entre ouverts s'en déduit par découpage en cubes ; elle donne les coordonnées polaires, cylindriques et sphériques, l'aire du disque, l'intégrale de la gaussienne du plan et l'intégration des fonctions radiales. Le lemme de Sard, selon lequel l'ensemble des valeurs critiques est négligeable, permet enfin d'appliquer la formule à une application injective sans hypothèse sur son jacobien.
