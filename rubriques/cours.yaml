  - id: mp-08
    niveau: mp
    chapitre: 8
    titre: Suites et séries de fonctions
    resume: |
      Le chapitre étudie les suites et séries de fonctions à valeurs dans un espace vectoriel normé de dimension finie, et les conditions sous lesquelles on peut échanger une limite avec une autre opération. Il définit la convergence simple, la convergence uniforme, exprimée avec la norme de la convergence uniforme, et la convergence uniforme sur tout segment, montre que la convergence uniforme entraîne la convergence simple sans réciproque, et donne une méthode pour établir ou réfuter la convergence uniforme. Les théorèmes d'interversion forment le cœur du chapitre : une limite uniforme de fonctions continues est continue, le théorème de la double limite permet d'échanger deux limites, l'intégrale d'une limite uniforme sur un segment est la limite des intégrales, et la dérivée passe à la limite lorsque la suite des dérivées converge uniformément, ce qui s'étend aux fonctions de classe $\mathcal{C}^{k}$. Pour les séries de fonctions, le chapitre ajoute la convergence normale, qui entraîne la convergence uniforme et se montre en majorant le terme général par une série numérique convergente, puis transpose les théorèmes de régularité à la somme d'une série de fonctions, avec l'exemple de la fonction zêta de Riemann. Il se termine par l'approximation uniforme : toute fonction continue par morceaux sur un segment est limite uniforme de fonctions en escalier, et le théorème de Weierstrass affirme que toute fonction continue sur un segment est limite uniforme de fonctions polynomiales, avec la méthode des moments qui en découle.
    sommaire:
      - Introduction historique
      - Convergence simple, convergence uniforme
      - Continuité et double limite
      - Intégration et dérivation
      - Séries de fonctions
      - Approximation uniforme
      - Bilan
