  - id: py-01
    niveau: python
    chapitre: 1
    titre: Initiation à Python
    resume: |
      Le cours mène des premières instructions aux algorithmes du programme de lycée. Il définit d'abord ce qu'est un programme, une suite finie d'instructions exécutées par l'interpréteur, montre la différence entre la console et le script, l'instruction `print`, les commentaires, et apprend à lire un message d'erreur de bas en haut. Il présente ensuite les variables et l'affectation, exécutée en deux temps, les quatre types fondamentaux et les conversions, les opérations, dont `//` et `%` qui donnent le quotient et le reste de la division euclidienne, le module `math` et la saisie par `input`, dont le résultat doit être converti. Viennent les booléens, les comparaisons et les connecteurs `and`, `or` et `not`, puis l'instruction conditionnelle sous ses formes `if`, `else` et `elif`, sur des exemples rédigés : signe d'un nombre, équation du second degré, année bissextile. Les deux chapitres suivants traitent des boucles : la boucle bornée `for` sur `range`, l'accumulation d'une somme, d'un produit ou d'un compte, le calcul des termes d'une suite récurrente et les boucles imbriquées, puis la boucle `while`, la recherche d'un seuil, le choix entre les deux boucles et deux algorithmes d'arithmétique, la division par soustractions successives et l'algorithme d'Euclide. Le chapitre sur les fonctions distingue `return` de `print` et définit la portée des variables ; celui sur les listes en présente la lecture, la modification, les tranches, la construction par une boucle, le parcours et le piège de deux noms pour une même liste. Le dernier chapitre réunit des algorithmes classiques : maximum d'une liste, balayage, dichotomie, tri par sélection, simulation et loi des grands nombres, aire sous une courbe par la méthode des rectangles. Deux annexes donnent les messages d'erreur les plus courants avec un mémento, et présentent deux environnements de travail, Programiz dans le navigateur et Thonny sur l'ordinateur.
    sommaire:
      - Découvrir Python
      - Variables, types et calculs
      - Tests et conditions
      - "Boucles bornées : for"
      - "Boucles non bornées : while"
      - Les fonctions
      - Les listes
      - Quelques algorithmes classiques
      - Erreurs fréquentes et mémento
      - Deux environnements
    sommaire_pages: [4, 8, 12, 16, 20, 24, 28, 32, 36, 38]
