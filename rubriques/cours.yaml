  - id: l3-in-01
    niveau: l3
    ue: l3-s5-int
    chapitre: 1
    titre: "Tribus et mesures positives"
    resume: |
      Le chapitre pose le cadre de toute la théorie de l'intégration : une tribu est la famille des parties que l'on accepte de mesurer, et une mesure positive leur attribue une valeur dans $[0, +\infty]$, additive pour les réunions dénombrables disjointes. Il étudie les algèbres de Boole et les tribus sur un ensemble abstrait (tribu engendrée, tribu engendrée par une partition, tribu trace, image réciproque et lemme de transport), puis la tribu borélienne de $\mathbb{R}^{n}$ et de la droite achevée, engendrée par les ouverts, par les pavés ou par les cubes dyadiques. Les propriétés des mesures se déduisent de la seule $\sigma$-additivité par désunion : sous-additivité dénombrable, continuité monotone, formule de Poincaré, lemme de Borel-Cantelli, mesure image. Le lemme de classe monotone fournit enfin l'outil d'unicité : deux mesures finies qui coïncident sur un $\pi$-système coïncident sur la tribu qu'il engendre.
