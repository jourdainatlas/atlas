  - id: l3-hf-04
    niveau: l3
    ue: l3-s6-hf
    chapitre: 4
    titre: 'Dualité, adjoint, théorème ergodique'
    resume: |
      Le chapitre caractérise les applications linéaires continues entre espaces normés et définit leur norme. Il démontre le théorème de représentation de Riesz : dans un espace de Hilbert, toute forme linéaire continue est le produit scalaire par un unique vecteur, de même norme. Il en déduit l'existence de l'adjoint d'un opérateur continu, de même norme que lui, établit ses règles de calcul et la relation entre le noyau de l'adjoint et l'orthogonal de l'image. Il démontre enfin le théorème ergodique de von Neumann : pour une contraction, les moyennes de Cesàro des itérés convergent vers la projection orthogonale sur l'espace des vecteurs fixes, ce qui s'interprète comme l'égalité d'une moyenne temporelle et d'une moyenne spatiale.
