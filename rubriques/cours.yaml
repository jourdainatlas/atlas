  - id: mp-10
    niveau: mp
    chapitre: 10
    titre: Espaces préhilbertiens
    resume: |
      Le chapitre reprend la géométrie du produit scalaire, réel et complexe, dans des espaces de dimension quelconque. Il définit le produit scalaire réel puis le produit scalaire complexe, sesquilinéaire et à symétrie hermitienne, les espaces préhilbertiens, euclidiens et hermitiens, et démontre l'inégalité de Cauchy-Schwarz, avec son cas d'égalité, d'où la norme et la distance associées, l'identité de polarisation et l'égalité du parallélogramme. Viennent l'orthogonalité, le théorème de Pythagore, l'existence de bases orthonormées et le procédé d'orthonormalisation de Gram-Schmidt, qui donne une base orthonormée adaptée à un drapeau, ainsi que la matrice de Gram. Le théorème de projection orthogonale sur un sous-espace de dimension finie caractérise le projeté comme meilleure approximation et fournit la formule du projeté dans une base orthonormée, l'inégalité de Bessel et le calcul d'une distance à un sous-espace. Le chapitre étudie ensuite les suites orthonormales et les suites totales, pour lesquelles toute approximation devient exacte à la limite, puis les polynômes orthogonaux pour un produit scalaire intégral, leur relation de récurrence, le fait que leurs racines sont réelles, simples et dans l'intervalle, et les polynômes de Legendre avec la formule de Rodrigues. Il se termine par les endomorphismes des espaces hermitiens : adjoint et transposée conjuguée, matrices unitaires et groupe unitaire, endomorphismes autoadjoints et normaux, et théorème spectral hermitien.
    sommaire:
      - Introduction historique
      - Produits scalaires réels et complexes
      - Orthogonalité et bases orthonormées
      - Projection sur un sous-espace de dimension finie
      - Suites orthonormales et suites totales
      - Polynômes orthogonaux
      - Endomorphismes des espaces hermitiens
      - Bilan
