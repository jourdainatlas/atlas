    chapitre: 6
    titre: Espaces vectoriels
    resume: |
      Le chapitre définit la loi de composition externe et l'espace vectoriel sur un corps $K$, illustré par $\mathbb{R}^{n}$, les suites et les espaces de fonctions, où une fonction devient un vecteur. Il caractérise les sous-espaces vectoriels par la stabilité de $\lambda x + y$ et oppose une droite passant par l'origine à une droite qui l'évite. Après la notion de famille, il montre que l'intersection de sous-espaces en est un. La réunion de deux sous-espaces n'en est un que si l'un contient l'autre, alors que la somme $F+G$ en est toujours un. La somme directe et les supplémentaires sont caractérisés par la condition $F_1 \cap F_2 = \{0_E\}$. Le chapitre se termine par les systèmes libres, liés et générateurs et par les bases, avec la vérification complète qu'une famille de trois vecteurs est une base de $\mathbb{R}^{3}$, puis la base canonique de $K^{n}$.
