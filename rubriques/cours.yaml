  - id: mp-11
    niveau: mp
    chapitre: 11
    titre: Séries de Fourier
    resume: |
      Le chapitre décompose une fonction périodique en harmoniques. Il définit, pour une fonction $2\pi$-périodique et continue par morceaux, les coefficients de Fourier exponentiels $c_{n}(f)$ et trigonométriques $a_{n}(f)$ et $b_{n}(f)$, avec leurs relations, leur comportement par parité, par translation et par dérivation, la série de Fourier et ses sommes partielles, et démontre le lemme de Riemann-Lebesgue. Le point de vue hilbertien vient ensuite : pour le produit scalaire moyen, la famille des $e_{n} : t \mapsto \mathrm{e}^{\mathrm{i}nt}$ est orthonormée, la somme partielle d'ordre $n$ est la projection orthogonale sur les polynômes trigonométriques de degré au plus $n$, et l'inégalité de Bessel s'en déduit ; le théorème de Fejér, démontré par le noyau de Fejér et les sommes de Fejér, montre que les polynômes trigonométriques approchent uniformément toute fonction continue, ce qui donne l'égalité de Parseval et l'injectivité de $f \mapsto (c_{n}(f))$ sur les fonctions continues. Le théorème de Dirichlet, établi à l'aide du noyau de Dirichlet, décrit la convergence ponctuelle de la série de Fourier d'une fonction de classe $\mathcal{C}^{1}$ par morceaux vers la demi-somme des limites à gauche et à droite. Le chapitre se termine par la convergence normale de la série de Fourier d'une fonction continue et de classe $\mathcal{C}^{1}$ par morceaux, et par le calcul de sommes de séries numériques à partir de Parseval ou de Dirichlet.
    sommaire:
      - Introduction historique
      - Coefficients de Fourier
      - "Le point de vue hilbertien : Bessel et Parseval"
      - "Convergence ponctuelle : le théorème de Dirichlet"
      - Convergence normale
      - Bilan
