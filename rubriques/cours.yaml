  - id: ma-07
    niveau: ma
    chapitre: 7
    titre: Nombres réels et suites numériques
    resume: |
      Le chapitre ne construit pas les réels : il admet l'existence d'un ensemble $\mathbb{R}$ qui prolonge $\mathbb{Q}$ et possède la propriété de la borne supérieure, et en déduit tout le reste. Il établit la propriété d'Archimède, la partie entière, l'existence de la racine carrée, les approximations décimales et la densité de $\mathbb{D}$, de $\mathbb{Q}$ et des irrationnels, puis décrit les intervalles et la droite achevée. Pour les suites réelles, il définit la limite et démontre son unicité. Il traite les opérations sur les limites, le passage à la limite dans les inégalités, l'existence d'une limite par comparaison et les suites de référence. Le théorème de la limite monotone, celui qui arrêtait Dedekind, conduit au théorème des suites adjacentes. Les suites extraites conduisent au théorème de Bolzano-Weierstrass. Le chapitre donne ensuite les caractérisations séquentielles et étend les résultats aux suites complexes. Il se termine par les suites arithmético-géométriques, les suites récurrentes linéaires d'ordre 2 et les suites définies par $u_{n+1} = f(u_{n})$. Le bilan montre comment tous ces résultats découlent de l'axiome de la borne supérieure.
