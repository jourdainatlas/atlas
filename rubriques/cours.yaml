  - id: ma-15
    niveau: ma
    chapitre: 15
    titre: Dimension finie et rang
    resume: |
      Le chapitre définit les espaces de dimension finie, ceux qu'engendre une famille finie, et tire tout du lemme fondamental : dans un espace engendré par $n$ vecteurs, toute famille de $n + 1$ vecteurs est liée. Il en déduit l'existence de bases et le théorème de la base incomplète, définit la dimension, montre qu'une famille de $n$ vecteurs d'un espace de dimension $n$ est une base dès qu'elle est libre ou génératrice, et définit le rang d'une famille de vecteurs. Il étudie ensuite la dimension d'un sous-espace, l'existence de supplémentaires et les bases adaptées, puis établit la formule de Grassmann. Pour les applications linéaires, il définit le rang, démontre le théorème du rang sous sa forme géométrique puis numérique, en déduit qu'entre deux espaces de même dimension finie une application linéaire est injective si et seulement si elle est surjective, et classe les espaces de dimension finie à isomorphisme près. La dernière partie traite des hyperplans en dimension finie et de leurs intersections, puis des systèmes linéaires : l'ensemble des solutions d'un système homogène de rang $r$ à $p$ inconnues est de dimension $p - r$, et une méthode permet de passer des équations d'un sous-espace à une base, et inversement.
    sommaire:
      - Introduction historique
      - Espaces de dimension finie
      - Sous-espaces et dimension
      - Applications linéaires en dimension finie
      - Hyperplans et systèmes d'équations
      - Bilan
