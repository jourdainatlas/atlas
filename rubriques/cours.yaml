  - id: mp-03
    niveau: mp
    chapitre: 3
    titre: Polynômes d'endomorphismes et réduction
    resume: |
      Le chapitre reprend la réduction avec l'outil des polynômes. Le morphisme d'algèbres $P \mapsto P(u)$ de $\mathbb{K}[X]$ dans $\mathcal{L}(E)$ définit les polynômes d'un endomorphisme et la sous-algèbre $\mathbb{K}[u]$ ; son noyau, l'idéal annulateur, est non nul en dimension finie, et son générateur unitaire est le polynôme minimal, dont le degré donne la dimension de $\mathbb{K}[u]$ et dont les racines sont exactement les valeurs propres. Le lemme de décomposition des noyaux, démontré par la relation de Bézout, découpe $E$ en sous-espaces stables à partir d'une factorisation d'un polynôme annulateur en facteurs premiers entre eux. Il fournit les critères de réduction : un endomorphisme est diagonalisable si et seulement s'il annule un polynôme simplement scindé, c'est-à-dire si son polynôme minimal est scindé à racines simples, ce qui passe aux endomorphismes induits et permet la diagonalisation simultanée d'endomorphismes diagonalisables qui commutent ; il est trigonalisable si et seulement s'il annule un polynôme scindé. Le théorème de Cayley-Hamilton affirme que le polynôme caractéristique annule l'endomorphisme, donc que le polynôme minimal le divise, et sert, avec la division euclidienne, à calculer les puissances et l'inverse d'une matrice. Le chapitre se termine par les sous-espaces caractéristiques : lorsque le polynôme caractéristique est scindé, $E$ est somme directe des $\operatorname{Ker}(u - \lambda\,\mathrm{id}_{E})^{m}$, de dimension égale à la multiplicité, ce qui se traduit par une matrice diagonale par blocs à blocs triangulaires de diagonale constante, et l'endomorphisme est diagonalisable exactement lorsque chaque sous-espace caractéristique est égal au sous-espace propre.
    sommaire:
      - Introduction historique
      - Polynômes d'un endomorphisme
      - Lemme de décomposition des noyaux
      - Polynômes annulateurs et réduction
      - Théorème de Cayley-Hamilton
      - Sous-espaces caractéristiques
      - Bilan
