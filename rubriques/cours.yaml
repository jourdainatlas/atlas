  - id: l3-pr-01
    niveau: l3
    ue: l3-s6-pr
    chapitre: 1
    titre: "Espaces probabilisés"
    resume: |
      Le chapitre construit le modèle probabiliste. Il définit l'univers des issues, les évènements et leurs opérations, les systèmes complets d'évènements, puis les tribus, la tribu engendrée par une famille de parties et la tribu borélienne de $\mathbb{R}$. Une probabilité est une mesure de masse totale $1$ sur un espace probabilisable : de la $\sigma$-additivité découlent toutes les règles de calcul, la continuité monotone et la formule de Poincaré, ainsi que les notions d'évènement négligeable et de propriété presque sûre. Sur un univers fini ou dénombrable, une probabilité est donnée par sa loi, famille de nombres positifs de somme $1$ ; le chapitre en tire l'équiprobabilité et le dénombrement, le problème des dérangements et les premières lois discrètes usuelles.
