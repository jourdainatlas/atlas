  - id: l3-sa-02
    niveau: l3
    ue: l3-s5-sa
    chapitre: 2
    titre: "Idéaux, anneaux quotients"
    resume: |
      Un idéal est un sous-groupe additif stable par multiplication par tout élément de l'anneau. Le chapitre décrit l'idéal engendré par une partie, les opérations sur les idéaux (somme, intersection, produit) et montre que les idéaux de $\mathbb{Z}$ et de $K[X]$ sont principaux. Il construit l'anneau quotient $A/I$, démontre le théorème de factorisation des morphismes d'anneaux et la correspondance entre les idéaux de $A/I$ et ceux de $A$ qui contiennent $I$ ; l'exemple central est $K[X]/\langle P \rangle$, $K$-algèbre de dimension $\deg P$. Les idéaux premiers et maximaux sont caractérisés par leurs quotients, intègres ou corps, d'où le fait que $K[X]/\langle P \rangle$ est un corps exactement quand $P$ est irréductible. Le théorème de Krull, démontré par le lemme de Zorn, assure l'existence d'idéaux maximaux ; le chapitre étudie aussi le radical d'un idéal et le nilradical, puis le lemme chinois, qui décompose le quotient par un produit d'idéaux étrangers et donne la formule de l'indicatrice d'Euler.
