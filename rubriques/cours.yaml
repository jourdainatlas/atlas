  - id: mp-04
    niveau: mp
    chapitre: 4
    titre: Espaces vectoriels normés
    resume: |
      Le chapitre pose le cadre de toute l'analyse de seconde année : un espace vectoriel muni d'une norme. Il définit la norme, la distance associée, les boules ouvertes et fermées, les sphères et les parties bornées, puis les normes usuelles : les normes $\|\cdot\|_1$, $\|\cdot\|_2$ et $\|\cdot\|_\infty$ sur $\mathbb{K}^n$, la norme de la convergence uniforme sur les fonctions bornées, les normes de la moyenne et de la moyenne quadratique sur les fonctions continues sur un segment, la norme associée à un produit scalaire et la norme produit. Les suites d'un espace vectoriel normé sont étudiées comme celles de $\mathbb{R}$ : convergence, unicité de la limite, opérations, suites extraites et valeurs d'adhérence ; le chapitre montre que la convergence dépend de la norme choisie, ce qui conduit aux normes équivalentes, à leur caractérisation par les suites et à une méthode pour prouver que deux normes ne sont pas équivalentes. La topologie est ensuite construite à partir des boules : ouverts et voisinages, fermés, stabilité par réunion et intersection, intérieur, adhérence, frontière, parties denses, avec la caractérisation séquentielle des fermés et de l'adhérence, et l'invariance de ces notions par passage à une norme équivalente. Le chapitre se termine par les ouverts, fermés et voisinages relatifs à une partie, qui préparent l'étude de la continuité sur une partie quelconque.
