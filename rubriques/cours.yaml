  - id: l3-sa-05
    niveau: l3
    ue: l3-s5-sa
    chapitre: 5
    titre: "Polynômes : factorialité et irréductibilité"
    resume: |
      Le chapitre construit l'anneau $A[X]$ à partir des suites presque nulles et en donne la propriété universelle, l'évaluation. Il étudie le degré, l'intégrité et les inversibles de $A[X]$ quand $A$ est intègre, la division par un polynôme de coefficient dominant inversible, les racines et le critère des racines multiples par la dérivée formelle. Sur un anneau factoriel, le contenu d'un polynôme est multiplicatif (lemme de Gauss) : un polynôme primitif est irréductible dans $A[X]$ si et seulement s'il l'est sur le corps des fractions, et $A[X]$ est factoriel, ce qui s'applique à $\mathbb{Z}[X]$ et aux $K[X_{1}, \dots, X_{n}]$. Le chapitre se termine par les critères d'irréductibilité : absence de racine en degré $2$ ou $3$, recherche des racines rationnelles, critère d'Eisenstein, appliqué en particulier au polynôme cyclotomique $\Phi_{p}$, et réduction modulo un nombre premier.
    sommaire:
      - "Introduction historique"
      - "L'anneau $A[X]$"
      - "Contenu, lemme de Gauss, factorialité de $A[X]$"
      - "Critères d'irréductibilité"
      - "Bilan"
