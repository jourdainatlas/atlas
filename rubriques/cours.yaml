  - id: l3-sa-07
    niveau: l3
    ue: l3-s5-sa
    chapitre: 7
    titre: "Extensions de corps"
    resume: |
      Une extension $L/K$ est un $K$-espace vectoriel, dont la dimension est le degré ; le théorème de la base télescopique montre que les degrés se multiplient dans une tour, ce qui contient l'argument de Wantzel. Un élément algébrique a un polynôme minimal, irréductible, et engendre le corps $K(\alpha) \simeq K[X]/\langle \mu_{\alpha} \rangle$, de degré $\deg \mu_{\alpha}$ ; les éléments algébriques forment un sous-corps, et la propriété est transitive. Le chapitre construit le corps de rupture d'un polynôme irréductible et le corps de décomposition d'un polynôme quelconque, de degré au plus $n!$, et démontre leur unicité par prolongement des isomorphismes. Il établit l'existence et l'unicité de la clôture algébrique (théorème de Steinitz, par le lemme de Zorn), puis démontre que $\mathbb{C}$ est algébriquement clos par l'argument de Laplace, qui n'emprunte à l'analyse que les valeurs intermédiaires et les racines carrées complexes.
    sommaire:
      - "Introduction historique"
      - "Extensions, degré"
      - "Éléments algébriques"
      - "Corps de rupture"
      - "Corps de décomposition"
      - "Clôture algébrique"
