  - id: ap-05
    niveau: approfondies
    chapitre: 5
    titre: Structures algébriques
    resume: |
      Le chapitre passe des structures à une loi à celles qui en portent deux. Il définit la distributivité et l'anneau, situe groupes, anneaux et corps dans un schéma emboîté, et donne pour exemples $\mathbb{Z}$, les fonctions de $\mathbb{R}$ dans $\mathbb{R}$ et les matrices carrées. Il signale ensuite les diviseurs de zéro, puis caractérise les sous-anneaux, ce qu'il applique à $\mathbb{Z}[\sqrt{2}]$. L'anneau $\mathbb{Z}/n\mathbb{Z}$ est construit à partir des classes de congruence, en vérifiant que les opérations ne dépendent pas des représentants. On y voit des diviseurs de zéro, par exemple $\overline{2} \times \overline{3} = \overline{0}$ dans $\mathbb{Z}/6\mathbb{Z}$. Le chapitre définit ensuite les corps et démontre par le théorème de Bézout que $\mathbb{Z}/n\mathbb{Z}$ est un corps si et seulement si $n$ est premier ; les tables de $\mathbb{Z}/5\mathbb{Z}$ et de $\mathbb{Z}/6\mathbb{Z}$ illustrent ce résultat. Il se termine par les morphismes d'anneaux, avec l'exemple de la réduction modulo $n$, et par la notion d'idéal.
