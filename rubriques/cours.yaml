  - id: l3-gt-06
    niveau: l3
    ue: l3-s6-gt
    chapitre: 6
    titre: 'Revêtements et calcul du groupe fondamental'
    resume: |
      Un revêtement permet de relever les chemins, de façon unique une fois l'origine choisie, puis les homotopies de chemins ; deux chemins homotopes ont donc des relevés de même extrémité, et le morphisme induit par un revêtement est injectif. Quand un espace est le quotient d'un espace simplement connexe par une action de groupe totalement discontinue, l'extrémité du relevé d'un lacet identifie le groupe fondamental au groupe qui agit. Le chapitre en déduit les groupes fondamentaux du cercle ($\mathbb{Z}$), du tore ($\mathbb{Z}^{2}$), des espaces projectifs de dimension au moins $2$ ($\mathbb{Z}/2\mathbb{Z}$) et de la bouteille de Klein (non commutatif). Les applications suivent : la sphère et le plan projectif ne sont pas homéomorphes, $\mathbb{R}^{2}$ n'est homéomorphe à aucun autre $\mathbb{R}^{n}$, il n'existe pas de rétraction du disque fermé sur le cercle, d'où le théorème du point fixe de Brouwer en dimension $2$, et le théorème de d'Alembert-Gauss.
    sommaire:
      - 'Introduction historique'
      - 'Relèvement des chemins'
      - 'Relèvement des homotopies'
      - 'Calcul du groupe fondamental'
      - 'Applications'
      - 'Bilan'
