    resume: |
      La série génératrice d'une variable à valeurs dans $\mathbb{N}$ code sa loi par une série entière de rayon au moins $1$ : elle la détermine, donne l'espérance et les moments par dérivation en $1$, et transforme la loi d'une somme de variables indépendantes en un produit. Pour une variable réelle quelconque, le chapitre définit la fonction caractéristique $t \mapsto \mathbb{E}[\mathrm{e}^{\mathrm{i}tX}]$, en calcule les exemples usuels, relie ses dérivées aux moments et l'applique aux sommes de variables indépendantes. Il démontre, par régularisation par une gaussienne, que la fonction caractéristique détermine la loi (théorème de Lévy) et donne la formule d'inversion.
