  - id: ma-20
    niveau: ma
    chapitre: 20
    titre: 'Séries numériques et familles sommables'
    resume: |
      Le chapitre définit la série de terme général $u_{n}$ comme la suite de ses sommes partielles, avec sa nature, sa somme et ses restes, et commence par les séries de référence : séries géométriques, série exponentielle, série harmonique, qui diverge bien que son terme général tende vers $0$. Pour les séries à termes positifs, il établit les théorèmes de comparaison, par inégalités puis par équivalents, la comparaison à une intégrale et la nature des séries de Riemann, et en tire la constante d'Euler ; il démontre la formule $\sum_{n \geqslant 1} \frac{1}{n^{2}} = \frac{\pi^{2}}{6}$ (problème de Bâle), avec une majoration du reste. Il montre ensuite que la convergence absolue entraîne la convergence, traite le critère des séries alternées avec l'encadrement du reste, et présente la série harmonique alternée comme exemple de série semi-convergente. La seconde moitié définit les familles sommables de réels positifs, indexées par un ensemble quelconque, par une borne supérieure de sommes finies, démontre la sommation par paquets et le théorème de Fubini positif, puis étend ces résultats aux familles sommables de nombres complexes, jusqu'au produit de Cauchy de deux séries absolument convergentes, qui donne $\mathrm{e}^{a}\mathrm{e}^{b} = \mathrm{e}^{a + b}$.
    sommaire:
      - Introduction historique
      - "Séries numériques : généralités"
      - Séries à termes positifs
      - Séries absolument convergentes
      - Séries alternées
      - Familles sommables de réels positifs
      - Familles sommables de nombres complexes
      - Bilan
