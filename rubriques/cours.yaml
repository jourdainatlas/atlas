    resume: |
      Le chapitre définit la dérivée comme une limite et démontre les règles de calcul admises au chapitre 5 : nombre dérivé, opérations, dérivée d'une composée et d'une fonction réciproque. Le théorème des bornes atteintes du chapitre 8 conduit au théorème de Rolle, puis à l'égalité et à l'inégalité des accroissements finis. Le chapitre en déduit le lien entre signe de la dérivée et monotonie, l'étude des suites récurrentes $u_{n+1} = f(u_{n})$ et le théorème de la limite de la dérivée. Il définit ensuite les fonctions de classe $\mathcal{C}^{k}$, établit la formule de Leibniz et les opérations sur ces fonctions, puis étend la dérivation aux fonctions à valeurs complexes. La dernière partie traite des fonctions convexes : définition et inégalité de Jensen, croissance des pentes, caractérisation par la dérivée et par la dérivée seconde, points d'inflexion. Le bilan montre comment tous les résultats globaux passent par les accroissements finis.
