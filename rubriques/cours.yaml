  - id: m-galois
    niveau: master
    titre: Théorie de Galois
    resume: |
      Le cours mène des groupes de permutations à l'impossibilité d'une formule par radicaux pour l'équation générale du cinquième degré. Il ne suppose que l'arithmétique élémentaire et le maniement des polynômes. Les deux premiers chapitres construisent l'outillage des groupes finis : sous-groupes, morphismes, groupe symétrique et théorème de Lagrange, puis sous-groupes distingués, quotients, théorèmes d'isomorphisme, actions de groupes, théorèmes de Cauchy et de Sylow, groupes résolubles et simplicité de $\mathfrak{A}_{n}$ pour $n \geqslant 5$. Les chapitres 3 à 5 construisent celui des corps : anneaux et idéaux, caractéristique, anneau $K[X]$ et critères d'irréductibilité, corps de rupture, degré d'une extension, polynôme minimal, corps de décomposition, constructions à la règle et au compas, séparabilité, extensions normales, corps finis et théorème de l'élément primitif. Le chapitre 6 établit la correspondance de Galois, par le théorème d'Artin, et la traite sur trois exemples complets. Le chapitre 7 étudie les extensions cyclotomiques, avec l'irréductibilité de $\Phi_{n}$, et les extensions cycliques (théorie de Kummer), puis en tire le critère de résolubilité par radicaux, le théorème d'Abel-Ruffini, la classification de Gauss-Wantzel des polygones réguliers constructibles et une démonstration algébrique du théorème fondamental de l'algèbre. Les résultats admis sont l'existence et l'unicité de la clôture algébrique et la transcendance de $\pi$. Les épigraphes sont tirées des écrits de Galois.
    sommaire:
      - Groupes
      - Quotients, actions et groupes résolubles
      - Anneaux, corps et polynômes
      - Extensions de corps
      - Séparabilité, normalité et corps finis
      - La correspondance de Galois
      - Résolubilité par radicaux et applications
