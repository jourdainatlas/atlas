  - id: ap-08
    niveau: approfondies
    chapitre: 8
    titre: Dimension finie
    resume: |
      Un espace est de dimension finie lorsqu'il admet une famille génératrice finie. Le chapitre admet l'existence des bases et l'invariance de leur cardinal, en indiquant le rôle du lemme d'échange, et en tire la dimension. Il donne les dimensions usuelles ($K^{n}$, $K_n[X]$, $\mathcal{M}_{n,p}(K)$, $\mathbb{C}$ sur $\mathbb{R}$ ou sur $\mathbb{C}$). Il montre ensuite qu'une famille de $n$ vecteurs en dimension $n$ est libre si et seulement si elle est génératrice. Un sous-espace a une dimension au plus égale, avec égalité seulement s'il est l'espace entier. La formule de Grassmann donne un critère de supplémentarité par les dimensions, appliqué à un plan et à une droite de $\mathbb{R}^{3}$. Le chapitre se termine par le rang et le théorème du rang, démontré à l'aide d'un supplémentaire du noyau. Entre espaces de même dimension finie, une application linéaire est donc injective, surjective et bijective à la fois, dès que l'une de ces trois propriétés est vraie. Le décalage des suites montre que cette équivalence tombe en dimension infinie.
    sommaire:
      - Dimension d'un espace vectoriel
      - Sous-espaces et dimension
      - Rang et théorème du rang
    sommaire_pages: [1, 2, 3]
    theories: [v-dimension, v-echange, v-libre, v-rang, v-somme-directe, alglin]
    notions: [dimension, rang, base-vectorielle, supplementaire]
    liens: [ap-06, ap-07]
