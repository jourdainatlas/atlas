  - id: l3-gt-02
    niveau: l3
    ue: l3-s6-gt
    chapitre: 2
    titre: 'Connexité et compacité'
    resume: |
      Un espace est connexe s'il ne se partage pas en deux ouverts disjoints non vides, c'est-à-dire si toute application continue à valeurs dans $\{0, 1\}$ est constante. Les connexes de $\mathbb{R}$ sont les intervalles, d'où le théorème des valeurs intermédiaires ; la connexité passe à l'adhérence, aux réunions ayant un point commun et aux produits. La connexité par arcs l'entraîne, la réciproque étant fausse (sinus du topologue) mais vraie pour un espace localement connexe par arcs ; les composantes connexes sont fermées, et leur nombre est un invariant topologique. Un compact est un espace séparé dont tout recouvrement ouvert admet un sous-recouvrement fini ; les segments de $\mathbb{R}$ sont compacts, un fermé d'un compact est compact, un compact d'un séparé est fermé, et une bijection continue d'un compact sur un séparé est un homéomorphisme. Pour les espaces métriques, la compacité équivaut à la propriété de Bolzano-Weierstrass. Le retrait d'un point distingue déjà $\mathbb{R}$ de $\mathbb{R}^{2}$ et le cercle de la droite.
    sommaire:
      - 'Introduction historique'
      - 'Connexité'
      - 'Connexité par arcs'
      - 'Composantes connexes'
      - 'Compacité'
      - 'Compacité des espaces métriques'
      - 'Bilan'
