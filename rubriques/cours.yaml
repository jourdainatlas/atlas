  - id: l3-sa-04
    niveau: l3
    ue: l3-s5-sa
    chapitre: 4
    titre: "Modules, anneaux noethériens, théorème de Hilbert"
    resume: |
      Un module est un espace vectoriel dont les scalaires forment un anneau : les groupes abéliens sont les $\mathbb{Z}$-modules, et les idéaux d'un anneau sont ses sous-modules. Le chapitre définit sous-modules, morphismes, quotients et modules de type fini, qui sont les quotients des $A^{n}$, et montre qu'un module de type fini n'a pas toujours de base. Il établit l'équivalence de trois conditions sur un module (sous-modules de type fini, suites croissantes stationnaires, existence d'éléments maximaux), qui définissent les modules noethériens, et leur stabilité par sous-module, quotient et produit fini. Un anneau noethérien a ses idéaux de type fini ; les anneaux principaux et leurs quotients le sont, tout idéal strict y est contenu dans un idéal maximal sans recours au lemme de Zorn, et les décompositions en irréductibles y existent sans être forcément uniques. Le théorème de la base de Hilbert étend la propriété à $A[X]$, puis aux anneaux de polynômes en plusieurs indéterminées et à leurs quotients.
