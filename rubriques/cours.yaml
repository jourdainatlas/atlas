  - id: l3-cd-06
    niveau: l3
    ue: l3-s5-cd
    chapitre: 6
    titre: "Équations différentielles : existence et unicité"
    resume: |
      Le chapitre étudie les équations $y' = F(t, y)$ avec $F$ continue sur un ouvert de $\mathbb{R} \times \mathbb{R}^{p}$. Après l'intégration et la dérivation des fonctions à valeurs vectorielles, il écrit le problème de Cauchy sous forme intégrale, ramène les équations d'ordre $n$ à des systèmes d'ordre 1 et établit le lemme de Gronwall. Le théorème de Peano, démontré à l'aide du théorème d'Ascoli, donne l'existence d'une solution locale dès que $F$ est continue, sur un cylindre de sécurité explicite. Le chapitre définit les solutions maximales et démontre le théorème des bouts : une solution maximale sort de tout compact, et explose si elle s'arrête avant la fin de l'intervalle. Lorsque $F$ est localement lipschitzienne en $y$, le théorème de Cauchy-Lipschitz donne l'existence et l'unicité d'une solution maximale par tout point, et une majoration affine de $F$ rend les solutions globales. La méthode itérative de Picard en fournit une construction, avec une estimation de l'erreur. Le chapitre se termine par l'étude qualitative de l'équation $y' = t + y^{2}$.
