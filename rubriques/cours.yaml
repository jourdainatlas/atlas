  - id: ap-01
    niveau: approfondies
    chapitre: 1
    titre: Ensembles et logique
    resume: |
      Le chapitre installe le langage dont se sert tout le supérieur. La partie de logique définit les propositions et les connecteurs (négation, conjonction, disjonction inclusive, implication, équivalence) par leur table de vérité, énonce les lois de De Morgan et la distributivité, puis précise les mots « condition nécessaire » et « condition suffisante ». Viennent ensuite les modes de raisonnement : la contraposée, le raisonnement par l'absurde, illustré par l'irrationalité de $\sqrt{2}$, et le contre-exemple. La partie ensembliste introduit les quantificateurs et leur négation, l'inclusion et l'égalité par double inclusion, l'intersection, la réunion et le complémentaire, représentés par des diagrammes de Venn, l'ensemble des parties $\mathcal{P}(E)$ et le produit cartésien. Le chapitre se termine sur l'ordre des quantificateurs. Chaque schéma de démonstration est accompagné d'une rédaction type.
    sommaire:
      - Propositions et connecteurs
      - Implication et équivalence
      - Modes de raisonnement
      - Ensembles et quantificateurs
      - Inclusion et égalité
      - Opérations sur les ensembles
      - Parties d'un ensemble et produit cartésien
    sommaire_pages: [1, 2, 2, 3, 5, 5, 6]
    theories: [l-connecteurs, l-tautologies, zf-operations, zf-parties, r-produit, log, zf]
