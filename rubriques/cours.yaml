    chapitre: 3
    titre: Fonctions numériques
    resume: |
      Limites en l'infini et en un réel, opérations sur les limites, théorèmes de comparaison et asymptotes ; dérivée d'une fonction composée et convexité ; continuité et théorème des valeurs intermédiaires. L'introduction historique va du siècle des courbes à la rigueur retrouvée.
    sommaire:
      - Introduction historique
      - Limites d'une fonction
      - Dérivation et convexité
