    niveau: expertes
    chapitre: 7
    titre: PGCD
    resume: |
      Le plus grand commun diviseur, les entiers premiers entre eux et l'algorithme d'Euclide, puis l'identité et le théorème de Bézout et leur corollaire sur les équations $ax + by = c$. Le chapitre établit enfin le théorème de Gauss et son corollaire. L'introduction historique va de Bachet de Méziriac et Bézout aux *Disquisitiones arithmeticae* de Gauss, et ouvre vers la cryptographie.
