  - id: ma-01
    niveau: ma
    chapitre: 1
    titre: Logique et ensembles
    resume: |
      Ce premier chapitre fixe la langue dans laquelle tous les autres seront écrits. Le chapitre construit d'abord le calcul des assertions : connecteurs, tables de vérité, implication et équivalence, lois de la logique et lois de De Morgan. Il traite ensuite les quantificateurs, leur négation et l'importance de leur ordre. Une longue section passe en revue les modes de raisonnement : raisonnement direct, disjonction des cas, contraposition, absurde (avec l'irrationalité de $\sqrt{2}$ et le théorème d'Euclide sur les nombres premiers), analyse-synthèse (décomposition d'une fonction en parties paire et impaire) et récurrence, simple, double et forte, illustrée par l'inégalité de Bernoulli. La dernière partie définit ensembles, parties, inclusion, opérations sur les parties, réunions et intersections d'une famille, produit cartésien et partitions. Elle explique pourquoi la description en compréhension se fait dans un ensemble déjà donné, ce qui écarte le paradoxe de Russell. Le bilan rassemble le dictionnaire entre opérations logiques et opérations ensemblistes.
    sommaire:
      - Introduction historique
      - Assertions et connecteurs logiques
      - Quantificateurs
      - Modes de raisonnement
      - Ensembles
      - "Bilan : le dictionnaire logique / ensembles"
