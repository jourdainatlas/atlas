  - id: l3-cd-04
    niveau: l3
    ue: l3-s5-cd
    chapitre: 4
    titre: "Différentielles d'ordre supérieur, formules de Taylor"
    resume: |
      Le fil du chapitre est la restriction à un segment : en posant $\varphi(t) = f(a + th)$, toute formule de Taylor pour une variable devient une formule pour $f$. Le chapitre établit d'abord les formules de Taylor pour une fonction d'une variable réelle à valeurs dans un espace de Banach : reste intégral, inégalité de Taylor-Lagrange, l'égalité n'étant vraie que pour des fonctions réelles, et Taylor-Young. Il étudie ensuite les applications bilinéaires continues et définit la différentielle seconde, qui s'identifie à une application bilinéaire ; dans $\mathbb{R}^{p}$, elle se calcule avec la matrice hessienne, et la formule de Taylor à l'ordre 2 donne le terme $\frac{1}{2}\mathrm{d}^{2}f(a)(h, h)$. Les applications multilinéaires continues conduisent aux différentielles d'ordre $k$, symétriques grâce au théorème de Schwarz pour les fonctions de classe $\mathcal{C}^{k}$ ; un contre-exemple de Peano montre que l'hypothèse ne peut pas être affaiblie. Le chapitre se termine par la formule de Taylor à l'ordre $n$ et la stabilité de la classe $\mathcal{C}^{k}$ par composition et par inversion.
