  - id: mp-15
    niveau: mp
    chapitre: 15
    titre: Espérance, variance et fonctions génératrices
    resume: |
      Le chapitre définit l'espérance d'une variable aléatoire discrète, d'abord pour une variable positive, à valeurs dans $[0, +\infty]$, puis pour une variable dont la famille $(x\,\mathbb{P}(X = x))$ est sommable. La formule de transfert calcule $\mathbb{E}(f(X))$ à partir de la loi de $X$ ; l'espérance est linéaire, croissante, et multiplicative pour des variables indépendantes ; elle se lit aussi sur les queues de la loi, $\mathbb{E}(X) = \sum_{n \geqslant 1} \mathbb{P}(X \geqslant n)$ pour $X$ à valeurs dans $\mathbb{N}$. Pour les variables qui ont un moment d'ordre $2$, l'inégalité de Cauchy-Schwarz ouvre la variance, l'écart type et la covariance, avec la variance d'une somme et les valeurs pour les lois usuelles. Les inégalités de Markov et de Bienaymé-Tchebychev donnent la loi faible des grands nombres, et l'inégalité exponentielle $\mathbb{P}(X \geqslant a) \leqslant \mathrm{e}^{-ta}\,\mathbb{E}(\mathrm{e}^{tX})$ amorce les inégalités de concentration. Le chapitre se termine par les fonctions génératrices $G_{X}(t) = \mathbb{E}(t^{X})$ des variables à valeurs dans $\mathbb{N}$ : elles caractérisent la loi, donnent l'espérance et la variance par dérivation en $1$, transforment la somme de variables indépendantes en produit et calculent la loi d'une somme d'un nombre aléatoire de variables, $G_{S} = G_{N} \circ G_{X_{1}}$.
    sommaire:
      - Introduction historique
      - Espérance
      - Variance, écart type et covariance
      - Inégalités probabilistes et loi faible des grands nombres
      - Fonctions génératrices
      - Bilan
