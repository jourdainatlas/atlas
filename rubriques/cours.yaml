  - id: l3-sa-08
    niveau: l3
    ue: l3-s5-sa
    chapitre: 8
    titre: "Extensions quadratiques, corps finis, extensions cyclotomiques"
    resume: |
      Le chapitre applique la théorie des extensions à trois familles d'exemples. En caractéristique différente de $2$, les extensions quadratiques sont les $K(\sqrt{d})$, et deux d'entre elles coïncident quand le quotient des $d$ est un carré. Un corps fini a $p^{n}$ éléments et porte le morphisme de Frobenius ; ses éléments sont exactement les racines de $X^{q} - X$, ce qui donne l'existence et l'unicité de $\mathbb{F}_{q}$, son groupe multiplicatif est cyclique, ses sous-corps correspondent aux diviseurs de $n$, et $X^{p^{n}} - X$ est le produit des irréductibles unitaires de degré divisant $n$. Les polynômes cyclotomiques $\Phi_{n}$, définis par les racines primitives de l'unité, vérifient $X^{n} - 1 = \prod_{d \mid n}\Phi_{d}$, sont à coefficients entiers et irréductibles sur $\mathbb{Q}$, ce qui se démontre par réduction modulo $p$ ; l'extension cyclotomique $\mathbb{Q}(\zeta_{n})$ est donc de degré $\varphi(n)$.
    sommaire:
      - "Introduction historique"
      - "Extensions quadratiques"
      - "Corps finis"
      - "Extensions cyclotomiques"
      - "Bilan"
