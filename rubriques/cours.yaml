  - id: l3-hf-03
    niveau: l3
    ue: l3-s6-hf
    chapitre: 3
    titre: 'Bases hilbertiennes, formule de Parseval'
    resume: |
      Pour une suite orthonormée, l'inégalité de Bessel montre que les coefficients $\langle x, e_{n}\rangle$ d'un vecteur sont de carré sommable ; réciproquement, une série orthogonale $\sum a_{n}e_{n}$ converge si et seulement si $(a_{n})$ est de carré sommable, et la série des coefficients de $x$ est sa projection sur l'adhérence de l'espace engendré. Une base hilbertienne est une famille orthonormée dont l'espace engendré est dense ; ce n'est pas une base algébrique en dimension infinie. Le chapitre démontre qu'un espace de Hilbert séparable admet une base hilbertienne dénombrable (le cas général, qui utilise le lemme de Zorn, est admis), puis la formule de Parseval et l'isomorphisme isométrique avec $\ell^{2}$, illustrés par les polynômes de Legendre.
    sommaire:
      - 'Introduction historique'
      - 'Inégalité de Bessel, séries orthogonales'
      - 'Espaces séparables, bases hilbertiennes'
      - 'Existence de bases hilbertiennes'
      - 'Formule de Parseval, isomorphisme avec $\ell^{2}$'
      - 'Bilan'
