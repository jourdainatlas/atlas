  - id: l3-sa-01
    niveau: l3
    ue: l3-s5-sa
    chapitre: 1
    titre: "Groupes, anneaux, corps"
    resume: |
      Le chapitre rassemble les structures sur lesquelles repose toute l'UE. Il définit les groupes, leurs sous-groupes et leurs morphismes, l'ordre d'un élément et les groupes cycliques, démontre le théorème de Lagrange et construit le groupe quotient par un sous-groupe distingué, avec le théorème de factorisation des morphismes ; le groupe $\mathbb{Z}/n\mathbb{Z}$ et ses générateurs en sont le premier exemple. Le groupe symétrique est étudié pour lui-même : décomposition d'une permutation en cycles à supports disjoints, génération par les transpositions, signature et groupe alterné. Viennent ensuite les anneaux (inversibles, diviseurs de zéro, intégrité, morphismes, caractéristique, indicatrice d'Euler) et les corps : un anneau intègre fini est un corps, tout anneau intègre se plonge dans son corps des fractions, et tout corps contient $\mathbb{Q}$ ou un $\mathbb{F}_{p}$. Le chapitre se termine par des rappels sur les espaces vectoriels et par les algèbres sur un corps, où une sous-algèbre $K[a]$ est de dimension finie exactement quand $a$ annule un polynôme non nul.
