  - id: l3-hf-01
    niveau: l3
    ue: l3-s6-hf
    chapitre: 1
    titre: 'Espaces préhilbertiens'
    resume: |
      Le chapitre définit le produit scalaire, réel ou complexe (linéaire à gauche, à symétrie hermitienne, défini positif), et en donne les exemples fondamentaux : $\mathbb{R}^{n}$, $\mathbb{C}^{n}$ et les fonctions continues sur un segment. Il établit les identités de Pythagore, du parallélogramme et de polarisation, démontre l'inégalité de Cauchy-Schwarz avec son cas d'égalité, et en déduit que $\sqrt{\langle x, x\rangle}$ est une norme ; l'exemple de la norme $\|\cdot\|_{\infty}$ sur $\mathbb{R}^{2}$ montre qu'une norme quelconque ne vérifie pas l'identité du parallélogramme. Il étudie les familles orthonormées et le procédé de Gram-Schmidt, puis, en dimension finie, les bases orthonormées et la projection orthogonale, qui donne la meilleure approximation. Un exemple montre qu'en dimension infinie le projeté peut ne pas exister, faute de complétude.
