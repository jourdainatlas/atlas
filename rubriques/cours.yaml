  - id: ma-04
    niveau: ma
    chapitre: 4
    titre: Nombres complexes et trigonométrie
    resume: |
      Le chapitre commence par la trigonométrie : cercle trigonométrique, formules d'addition démontrées par la longueur d'une corde, équations trigonométriques, étude des fonctions cosinus, sinus et tangente. Il construit ensuite $\mathbb{C}$ à la manière de Hamilton, comme $\mathbb{R}^{2}$ muni d'une addition et d'une multiplication, et en établit les règles de calcul. Viennent ensuite le plan complexe, la conjugaison, le module et l'inégalité triangulaire. L'étude du groupe $\mathbb{U}$ des complexes de module $1$ donne les formules d'Euler et de Moivre, la technique de l'angle moitié et la linéarisation. Viennent ensuite la forme trigonométrique et les équations algébriques. Le chapitre traite la factorisation par $z - a$, les racines carrées d'un nombre complexe et les équations du second degré, puis les racines $n$-ièmes de l'unité et d'un complexe non nul. Il définit l'exponentielle complexe et caractérise l'égalité $\mathrm{e}^{z} = \mathrm{e}^{z'}$. L'interprétation géométrique, par les angles orientés et les similitudes directes, dont il donne la classification, termine le chapitre.
