  - id: l3-gd-05
    niveau: l3
    ue: l3-s6-gd
    chapitre: 5
    titre: 'Formes différentielles'
    resume: |
      Le chapitre commence par l'algèbre multilinéaire : tenseurs, formes alternées, projection d'alternance et produit extérieur, associatif et anticommutatif au signe $(-1)^{kl}$ près ; les produits extérieurs de formes linéaires se calculent par un déterminant et l'espace des $k$-formes alternées est de dimension $\binom{n}{k}$. Une forme différentielle est un champ de formes alternées, qui s'écrit dans les coordonnées $\sum a_{I}\,dx_{I}$. La différentielle extérieure de Cartan, unique opérateur qui prolonge la différentielle des fonctions et vérifie la règle de Leibniz graduée et $d \circ d = 0$, rend toute forme exacte fermée ; la forme angle sur le plan privé de l'origine est fermée sans être exacte. Le lemme de Poincaré montre que, sur un ouvert étoilé, toute forme fermée est exacte. L'image réciproque par une application lisse commute au produit extérieur et à $d$. Le chapitre termine par l'intégrale des $1$-formes le long des chemins : une forme est exacte si et seulement si ses intégrales sur les lacets sont nulles, et une forme fermée est exacte sur un ouvert simplement connexe.
    sommaire:
      - 'Introduction historique'
      - 'Préliminaires algébriques'
      - 'Formes différentielles'
      - 'Différentielle extérieure'
      - 'Le lemme de Poincaré'
      - 'Image réciproque par une application lisse'
      - '$1$-formes et intégrales'
      - 'Bilan'
