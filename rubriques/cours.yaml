  - id: l3-in-05
    niveau: l3
    ue: l3-s5-int
    chapitre: 5
    titre: "Intégrales à paramètres ; Fourier, Laplace, Mellin"
    resume: |
      Les trois théorèmes du chapitre sont des applications de la convergence dominée : une intégrale à paramètre est continue, dérivable ou holomorphe dès qu'une domination locale est disponible, sur l'intégrande pour la continuité, sur sa dérivée partielle pour la dérivabilité et sur les disques fermés pour l'holomorphie. Ils s'appliquent d'abord aux fonctions $\Gamma$ et $\zeta$ (convexité, régularité, holomorphie de $\Gamma$ dans le demi-plan $\operatorname{Re} z > 0$), puis aux trois grandes transformations intégrales. La transformée de Fourier d'une fonction intégrable est continue, bornée et tend vers 0 à l'infini (lemme de Riemann-Lebesgue), et sa régularité dépend des moments de la fonction. La transformée de Laplace est holomorphe dans un demi-plan, ce qui donne la valeur $\pi/2$ de l'intégrale de Dirichlet. La transformée de Mellin est holomorphe dans une bande et relie $\Gamma$ et $\zeta$.
    sommaire:
      - "Introduction historique"
      - "Continuité"
      - "Dérivabilité"
      - "Paramètre complexe : holomorphie"
      - "La transformation de Fourier"
