    chapitre: 7
    titre: Produit scalaire
    resume: |
      Le produit scalaire de deux vecteurs, d'abord défini géométriquement par le cosinus de leur angle, puis par le projeté orthogonal, par les normes et en coordonnées dans un repère orthonormé. Le chapitre en établit les propriétés, puis l'utilise pour le vecteur normal à une droite et l'équation d'un cercle. L'introduction historique présente les multiplications intérieure et extérieure de Grassmann et de Clifford.
    sommaire:
