  - id: ma-18
    niveau: ma
    chapitre: 18
    titre: Intégration
    resume: |
      Le chapitre construit l'intégrale des fonctions continues par morceaux sur un segment. Il définit les subdivisions, les fonctions en escalier et leur intégrale, puis les fonctions continues par morceaux, qu'il approche uniformément par des fonctions en escalier, et définit leur intégrale comme la valeur commune de deux bornes, supérieure et inférieure, d'intégrales de fonctions en escalier. Il établit les propriétés de l'intégrale : linéarité, positivité, relation de Chasles, inégalité triangulaire, valeur moyenne, nullité d'une fonction continue positive d'intégrale nulle, puis l'extension aux fonctions à valeurs complexes. Le théorème fondamental de l'analyse relie l'intégrale aux primitives ; il permet de construire le logarithme et l'exponentielle admis au chapitre 5, de démontrer l'inégalité des accroissements finis et d'intégrer les fractions rationnelles. Viennent ensuite la formule de Taylor avec reste intégral et l'inégalité de Taylor-Lagrange, puis la convergence des sommes de Riemann et les méthodes des rectangles et des trapèzes, avec leur erreur. La dernière partie étudie les intégrales de Wallis et en déduit la constante de la formule de Stirling.
    sommaire:
      - Introduction historique
      - Fonctions en escalier et fonctions continues par morceaux
      - Intégrale d'une fonction continue par morceaux
      - Intégrale et primitives
      - Formules de Taylor globales
      - Sommes de Riemann et calcul approché
