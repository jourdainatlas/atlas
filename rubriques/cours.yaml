  - id: mp-13
    niveau: mp
    chapitre: 13
    titre: Convergence dominée et intégrales à paramètre
    resume: |
      Le chapitre donne les outils pour échanger une intégrale et un passage à la limite. Le théorème de convergence dominée, admis faute de théorie de la mesure, affirme que si une suite $(f_{n})$ de fonctions continues par morceaux converge simplement sur un intervalle $I$ et vérifie $|f_{n}| \leqslant \varphi$ pour une fonction $\varphi$ intégrable indépendante de $n$, alors $\int_{I} f_{n}$ tend vers $\int_{I} \lim f_{n}$ ; des exemples montrent comment l'aire se perd quand aucune domination n'existe. Le chapitre en tire la version pour une famille à paramètre réel, puis l'intégration terme à terme d'une série de fonctions, dans le cas positif et sous l'hypothèse $\sum \int_{I} |f_{n}| < +\infty$, avec le recours aux sommes partielles quand cette hypothèse échoue. Viennent ensuite la continuité, la dérivabilité et la classe $\mathcal{C}^{k}$ d'une intégrale à paramètre $x \mapsto \int_{I} f(x, t)\,\mathrm{d}t$, sous une hypothèse de domination sur tout segment ; elles donnent la transformée de Fourier de la gaussienne et la valeur $\frac{\pi}{2}$ de l'intégrale de Dirichlet $\int_{0}^{+\infty} \frac{\sin t}{t}\,\mathrm{d}t$. Le chapitre se termine par la fonction $\Gamma$ d'Euler : domaine, régularité, relation $\Gamma(x + 1) = x\,\Gamma(x)$, valeur $\Gamma'(1) = -\gamma$ et formule de Gauss.
    sommaire:
      - Introduction historique
      - Le théorème de convergence dominée
      - Intégration terme à terme
      - Continuité d'une intégrale à paramètre
      - Dérivation d'une intégrale à paramètre
      - La fonction $\Gamma$ d'Euler
      - Bilan
