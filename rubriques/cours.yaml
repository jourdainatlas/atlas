  - id: l3-sa-03
    niveau: l3
    ue: l3-s5-sa
    chapitre: 3
    titre: "Anneaux factoriels et principaux"
    resume: |
      Le chapitre étudie la divisibilité dans un anneau intègre et la question de l'unicité des décompositions en facteurs irréductibles. Il définit les éléments associés, la norme des anneaux $\mathbb{Z}[\mathrm{i}\sqrt{d}]$ qui sert à les comparer, les éléments irréductibles et les éléments premiers : un premier est irréductible, et l'unicité des décompositions équivaut à la réciproque, ce que traduisent les critères de factorialité. Dans un anneau factoriel, le PGCD et le PPCM se calculent par les valuations, et les lemmes d'Euclide et de Gauss restent vrais. Un anneau principal est factoriel ; il dispose en plus de la relation de Bézout, et ses idéaux premiers non nuls sont maximaux, engendrés par les irréductibles. Un stathme euclidien rend l'anneau principal : l'anneau $\mathbb{Z}[\mathrm{i}]$ des entiers de Gauss est euclidien, et l'algorithme d'Euclide étendu y calcule PGCD et coefficients de Bézout.
