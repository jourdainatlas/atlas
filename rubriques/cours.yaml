    chapitre: 7
    titre: Dénombrement
    resume: |
      Cardinal d'un ensemble fini, principe multiplicatif, listes et $p$-uplets ; permutations, arrangements et combinaisons. L'introduction historique montre comment on apprend à compter sans énumérer, jusqu'à l'*Art de conjecturer* de Bernoulli.
    sommaire:
