  - id: mp-17
    niveau: mp
    chapitre: 17
    titre: Calcul différentiel et optimisation
    resume: |
      Le chapitre étend le calcul différentiel aux applications d'un ouvert d'un espace vectoriel normé de dimension finie dans un autre. Il part des dérivées selon un vecteur et des dérivées partielles, qui ne suffisent pas à la régularité, puis définit la différentielle, application linéaire $\mathrm{d}f(a)$ telle que $f(a + h) = f(a) + \mathrm{d}f(a)(h) + o(h)$ ; la matrice jacobienne la représente, et le gradient donne la direction de plus forte pente. Viennent les opérations : combinaisons linéaires, applications multilinéaires, règle de la chaîne, dérivée le long d'un arc et dérivées partielles d'une composée. Une application est de classe $\mathcal{C}^{1}$ lorsque ses dérivées partielles existent et sont continues ; le chapitre établit la formule intégrale, l'inégalité des accroissements finis et la caractérisation des fonctions constantes sur un ouvert connexe par arcs. Pour l'optimisation au premier ordre, un extremum local sur un ouvert est un point critique ; les vecteurs tangents à une partie conduisent aux extremums sous une contrainte $g = 0$, où le gradient de $f$ est colinéaire à celui de $g$. Le chapitre se termine par la classe $\mathcal{C}^{k}$, le théorème de Schwarz, quelques équations aux dérivées partielles, la matrice hessienne, la formule de Taylor-Young à l'ordre $2$ et les conditions du second ordre, détaillées dans le cas de deux variables.
