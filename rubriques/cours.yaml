  - id: l3-cd-05
    niveau: l3
    ue: l3-s5-cd
    chapitre: 5
    titre: "Extrema libres, extrema liés"
    resume: |
      Chercher un extremum se fait en trois temps : établir qu'il existe, dresser la liste des candidats, puis les départager. Pour l'existence, le chapitre emploie la compacité du chapitre 1 et la coercivité. Sur un ouvert, un extremum local est un point critique ; la différentielle seconde y est positive en un minimum, et une différentielle seconde définie positive assure un minimum local strict, ce que traduisent, dans $\mathbb{R}^{2}$, les signes de $rt - s^{2}$ et de $r$ (notations de Monge). Pour une fonction convexe, tout point critique est un minimum global, et une fonction de classe $\mathcal{C}^{2}$ est convexe exactement quand sa hessienne est positive. Pour un extremum sur une partie définie par des contraintes $g_{1} = \dots = g_{k} = 0$ à gradients indépendants, le théorème des multiplicateurs de Lagrange affirme que $\nabla f(a)$ est combinaison linéaire des $\nabla g_{i}(a)$, et une condition du second ordre sur le lagrangien, restreinte à l'espace tangent, assure un minimum lié strict.
