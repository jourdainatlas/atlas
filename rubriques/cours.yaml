  - id: mp-09
    niveau: mp
    chapitre: 9
    titre: Séries entières
    resume: |
      Le chapitre étudie les séries de fonctions les plus simples, les séries entières $\sum a_{n} z^{n}$, dont la somme se comporte presque comme un polynôme. Le lemme d'Abel conduit au rayon de convergence, borne supérieure des $r$ pour lesquels $(a_{n} r^{n})$ est bornée, avec la convergence absolue dans le disque ouvert de convergence et la divergence grossière à l'extérieur ; le rayon se compare par domination ou équivalence et se calcule par la règle de d'Alembert, et le chapitre traite la somme et le produit de Cauchy de deux séries entières. La convergence normale sur tout disque fermé inclus dans le disque ouvert donne la continuité de la somme, ce qui permet de définir l'exponentielle complexe, de démontrer $\mathrm{e}^{a+b} = \mathrm{e}^{a}\mathrm{e}^{b}$ et de retrouver les fonctions trigonométriques. Sur l'intervalle ouvert de convergence, la somme d'une série entière d'une variable réelle s'intègre et se dérive terme à terme, sans changer le rayon ; elle est donc de classe $\mathcal{C}^{\infty}$, avec $a_{n} = f^{(n)}(0)/n!$, ce qui donne l'unicité du développement. Le chapitre définit enfin les fonctions développables en série entière, montre qu'une telle fonction est sa série de Taylor, établit les développements usuels (exponentielle, fonctions trigonométriques et hyperboliques, $\ln(1+x)$, $\arctan$, $(1+x)^{\alpha}$) et décrit les méthodes pour obtenir un développement, par opérations, par une équation différentielle ou par l'inégalité de Taylor-Lagrange ; le théorème d'Abel radial précise le comportement de la somme au bord de l'intervalle de convergence.
    sommaire:
      - Introduction historique
      - Rayon de convergence
      - Continuité de la somme, exponentielle complexe
      - Régularité de la somme sur l'intervalle de convergence
      - Fonctions développables en série entière
      - Bilan
