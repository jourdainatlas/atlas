  - id: l3-in-04
    niveau: l3
    ue: l3-s5-int
    chapitre: 4
    titre: "Fonctions intégrables, convergence dominée"
    resume: |
      Une fonction mesurable est intégrable quand l'intégrale de son module est finie ; son intégrale se définit par différence des parties positive et négative, puis composante par composante pour les fonctions à valeurs complexes ou vectorielles. Le chapitre établit la linéarité, la croissance, l'inégalité triangulaire et son cas d'égalité, l'inégalité de Jensen, et l'intégrabilité des fonctions puissances. Le théorème de convergence dominée, déduit du lemme de Fatou, autorise l'échange d'une limite et d'une intégrale dès qu'une même fonction intégrable domine la suite ; il donne la convergence bornée, l'intégration terme à terme des séries de fonctions intégrables et la continuité de l'intégrale par rapport au domaine. Il s'applique aux séries doubles, à la formule d'Euler pour la fonction $\Gamma$ et au produit eulérien. Le retour à l'intégrale de Riemann montre qu'une intégrale impropre définit une fonction intégrable si et seulement si elle converge absolument, et caractérise les fonctions intégrables au sens de Riemann par la négligeabilité de leurs points de discontinuité.
