  - id: l3-hf-02
    niveau: l3
    ue: l3-s6-hf
    chapitre: 2
    titre: 'Espaces de Hilbert, théorème de projection'
    resume: |
      Un espace de Hilbert est un espace préhilbertien complet ; un sous-espace l'est si et seulement s'il est fermé. Le chapitre démontre que $\ell^{2}$ et les espaces $L^{2}$ sont des espaces de Hilbert. Il établit le théorème de projection : la distance d'un point à un convexe fermé non vide est atteinte en un unique point, caractérisé par une condition d'angle obtus, et la projection est $1$-lipschitzienne ; des exemples montrent que chaque hypothèse est nécessaire. Sur un sous-espace fermé, la projection est orthogonale et linéaire, de norme au plus $1$. Le chapitre définit enfin l'orthogonal d'une partie, sous-espace fermé, et démontre qu'un sous-espace fermé admet un supplémentaire orthogonal, d'où un critère de densité.
    sommaire:
      - 'Introduction historique'
      - 'Espaces de Hilbert'
      - 'Théorème de projection sur un convexe fermé'
      - 'Projection orthogonale sur un sous-espace fermé'
      - 'Orthogonal d''une partie, supplémentaire orthogonal'
      - 'Bilan'
