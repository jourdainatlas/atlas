  - id: mp-14
    niveau: mp
    chapitre: 14
    titre: Espaces probabilisés et variables aléatoires discrètes
    resume: |
      Le chapitre étend les probabilités de première année aux univers infinis. Il commence par les ensembles dénombrables : stabilité par produit fini et par réunion dénombrable, non-dénombrabilité de $\mathbb{R}$. Un espace probabilisé est un triplet $(\Omega, \mathcal{A}, \mathbb{P})$, où la tribu $\mathcal{A}$ est stable par complémentaire et par réunion dénombrable et où la probabilité $\mathbb{P}$ est $\sigma$-additive ; le chapitre en tire la continuité croissante et décroissante, puis les notions d'événement négligeable et de système quasi-complet d'événements. Les probabilités conditionnelles conduisent à la formule des probabilités totales et à la formule de Bayes, et l'indépendance est définie pour une famille quelconque d'événements. Sur un univers dénombrable, une probabilité est déterminée par une famille sommable de réels positifs de somme $1$. Une variable aléatoire discrète a une loi, que transporte toute fonction ; les couples de variables ont une loi conjointe et des lois marginales, et l'indépendance des variables se lit sur la loi conjointe. Le théorème d'existence de suites de variables indépendantes de lois données est admis. Le chapitre se termine par la loi géométrique, rang du premier succès et seule loi sans mémoire sur $\mathbb{N}^{*}$, et la loi de Poisson, stable par somme indépendante et limite de lois binomiales.
    sommaire:
      - Introduction historique
      - Ensembles dénombrables
      - Espaces probabilisés
      - Conditionnement et indépendance
      - Espaces probabilisés discrets
      - Variables aléatoires discrètes
      - Variables aléatoires indépendantes
      - Lois usuelles
      - Bilan
