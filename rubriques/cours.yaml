# Rubrique « Cours » — PROTOTYPE.
# Les chapitres de Première, de Terminale et de Maths expertes sont en ligne
# (PDF dans documents/cours/premiere/, documents/cours/terminale/ et documents/cours/expertes/).
# Champs d'un cours :
#   id, niveau, chapitre, titre, resume (texte riche), sommaire (liste de sections),
#   theories (nœuds de l'édifice), notions (termes du lexique), exercices (id d'une feuille),
#   liens (id d'autres cours, affichés dans les deux sens comme « chapitres liés »),
#   pdf, tex (chemins des fichiers déposés), pages, statut (depose | a-deposer)

intro: |
  Les cours sont rédigés en LaTeX, chapitre par chapitre, et déposés ici au fil de l'année sous forme de PDF. Chaque chapitre indique les théories de l'édifice sur lesquelles il repose, ce qui permet de passer d'un cours de lycée aux fondements qui le justifient.

niveaux:
  - id: seconde
    titre: Seconde
    description: Seconde générale.
  - id: premiere
    titre: Première
    description: Enseignement de spécialité mathématiques.
  - id: terminale
    titre: Terminale
    description: Enseignement de spécialité mathématiques.
  - id: expertes
    titre: Maths expertes
    description: Terminale, option mathématiques expertes, suivie en complément de la spécialité.
  - id: ma
    titre: Maths approfondies
    description: Classe préparatoire, première année (MPSI).
  - id: ecg
    titre: Maths ECG
    description: Classe préparatoire économique et commerciale.
  - id: master
    titre: Master
    description: Cours de niveau recherche, un fichier par thème.

cours:
  - id: p-01
    niveau: premiere
    chapitre: 1
    titre: Polynôme du second degré
    resume: |
      La fonction trinôme $x \mapsto ax^2 + bx + c$, sa forme canonique et le sommet $(\alpha ; \beta)$ de sa parabole, puis la résolution de l'équation du second degré par le discriminant. Le chapitre établit les relations entre les coefficients et les racines (somme et produit), la factorisation d'un trinôme et son signe. L'introduction historique part des tablettes babyloniennes et suit le problème jusqu'à son écriture algébrique.
    sommaire:
      - Introduction historique
      - Fonction polynôme
      - Solutions de l'équation
      - Propriétés des trinômes
      - Signe d'un trinôme
    theories: [z-polynomes, c-racine-reelle, r]
    notions: [anneau-polynomes]
    liens: [me-02, t-03]
    pdf: documents/cours/premiere/chap01_second_degre.pdf
    pages: 7
    exercices: f-p-01
    statut: depose
  - id: p-02
    niveau: premiere
    chapitre: 2
    titre: Notion de suite
    resume: |
      Les suites numériques, définies de manière explicite ou par récurrence, et leur sens de variation. Le chapitre étudie les suites arithmétiques et géométriques, leurs formules explicites, puis le calcul des sommes de termes consécutifs. L'introduction historique part de la méthode de Héron pour approcher une racine carrée par des valeurs successives.
    sommaire:
      - Introduction historique
      - Généralités
      - Variations d'une suite
      - Suites arithmétiques
      - Suites géométriques
      - Calcul de sommes
    theories: [n-recdef, n-sommes, ar-suites, n]
    notions: [suite]
    liens: [t-01]
    pdf: documents/cours/premiere/chap02_suites.pdf
    pages: 7
    exercices: f-p-02
    statut: depose
  - id: p-03
    niveau: premiere
    chapitre: 3
    titre: Géométrie cartésienne
    resume: |
      Le calcul vectoriel dans un repère du plan, puis la colinéarité de deux vecteurs et son critère par le déterminant. Le chapitre en tire les équations cartésiennes de droites, le vecteur directeur, l'équation réduite et les positions relatives de deux droites. L'introduction historique montre comment la physique et le mouvement ont rapproché l'algèbre et la géométrie depuis Descartes.
    sommaire:
      - Introduction historique
      - Vecteurs
      - Équations de droite
    theories: [v-espace, v-libre, v-determinant, alglin]
    notions: [espace-vectoriel, famille-libre]
    liens: [p-07, t-04]
    pdf: documents/cours/premiere/chap03_geometrie_cartesienne.pdf
    pages: 6
    exercices: f-p-03
    statut: depose
  - id: p-04
    niveau: premiere
    chapitre: 4
    titre: Dérivation
    resume: |
      Le taux de variation, le nombre dérivé et la fonction dérivée, les dérivées des fonctions usuelles (puissances, inverse, racine carrée) et les opérations sur les dérivées : somme, produit, quotient et composition. Le chapitre établit l'équation de la tangente, puis le lien entre le signe de la dérivée, le sens de variation et les extrema. L'introduction historique va des indivisibles au calcul infinitésimal de Newton et de Leibniz.
    sommaire:
      - Introduction historique
      - Taux de variation et nombre dérivé
      - Fonction dérivée
      - Équation de tangente
      - Dérivée et variation
    theories: [ar-deriv, continuite, analyse-reelle]
    notions: [derivable]
    liens: [p-08, t-03]
    pdf: documents/cours/premiere/chap04_derivation.pdf
    pages: 9
    exercices: f-p-04
    statut: depose
  - id: p-05
    niveau: premiere
    chapitre: 5
    titre: Probabilités conditionnelles
    resume: |
      Les probabilités conditionnelles, les arbres pondérés et la formule des probabilités totales, puis l'indépendance de deux événements. Le chapitre introduit ensuite les variables aléatoires, leur espérance, sa linéarité, leur variance et la formule de König-Huygens. L'introduction historique présente la formule de Bayes et la fondation axiomatique de Kolmogorov.
    sommaire:
      - Introduction historique
      - Définitions
      - Arbre pondéré
      - Indépendance
      - Variable aléatoire
      - Espérance
    theories: [p-espace, p-independance, p-variables, p-esperance, proba]
    notions: [espace-probabilise, independance, variable-aleatoire, esperance]
    liens: [t-02]
    pdf: documents/cours/premiere/chap05_probabilites_conditionnelles.pdf
    pages: 7
    exercices: f-p-05
    statut: depose
  - id: p-06
    niveau: premiere
    chapitre: 6
    titre: Trigonométrie
    resume: |
      Le cercle trigonométrique, le radian et l'enroulement de la droite numérique, puis les angles orientés et leur mesure principale. Le chapitre définit le cosinus et le sinus d'un réel, donne les valeurs remarquables et les angles associés, et termine par l'angle orienté de deux vecteurs. L'introduction historique va des cordes d'Hipparque et de Ptolémée à l'analyse harmonique.
    sommaire:
      - Introduction historique
      - Angles orientés
      - Sinus et cosinus d'un angle
    theories: [cx-pi, cx-exponentielle, anc]
    notions: [pi]
    liens: [p-07, t-09, me-05]
    pdf: documents/cours/premiere/chap06_trigonometrie.pdf
    pages: 8
    exercices: f-p-06
    statut: depose
  - id: p-07
    niveau: premiere
    chapitre: 7
    titre: Produit scalaire
    resume: |
      Le produit scalaire de deux vecteurs, d'abord défini géométriquement par le cosinus de leur angle, puis par le projeté orthogonal, par les normes et en coordonnées dans un repère orthonormé. Le chapitre en établit les propriétés, puis l'utilise pour le vecteur normal à une droite et l'équation d'un cercle. L'introduction historique présente les multiplications intérieure et extérieure de Grassmann et de Clifford.
    sommaire:
      - Introduction historique
      - Définition géométrique
      - Approche analytique
      - Propriétés du produit scalaire
      - Vecteur normal
      - Équation de cercle
    theories: [gd-normes, f-hilbert, alglin]
    notions: [norme]
    liens: [t-04]
    pdf: documents/cours/premiere/chap07_produit_scalaire.pdf
    pages: 6
    exercices: f-p-07
    statut: depose
  - id: p-08
    niveau: premiere
    chapitre: 8
    titre: Fonction exponentielle
    resume: |
      La fonction exponentielle, unique fonction dérivable égale à sa dérivée et valant $1$ en $0$, sa relation fonctionnelle $\exp(a + b) = \exp(a)\exp(b)$ et la notation $e^x$. Le chapitre étudie son signe, son sens de variation et la dérivée de $e^{u}$. L'introduction historique part de l'équation différentielle $y' = y$ et du travail d'Euler.
    sommaire:
      - Introduction historique
      - Définitions
      - Étude de la fonction exponentielle
    theories: [cx-exponentielle, ar-deriv, anc]
    notions: [exponentielle]
    liens: [p-04, t-05, t-08]
    pdf: documents/cours/premiere/chap08_exponentielle.pdf
    pages: 4
    exercices: f-p-08
    statut: depose
  - id: t-01
    niveau: terminale
    chapitre: 1
    titre: Suites numériques
    resume: |
      Le raisonnement par récurrence, puis la limite d'une suite : limites finies et infinies, opérations sur les limites, théorèmes de comparaison, convergence des suites monotones et cas des suites géométriques. Une introduction historique va du paradoxe de Zénon au principe de récurrence de Pascal et aux axiomes de Peano.
    sommaire:
      - Introduction historique
      - Raisonnement par récurrence
      - Limite d'une suite
    theories: [n-recurrence, ar-suites, n, analyse-reelle]
    notions: [suite, limite-suite]
    exercices: f-t-01
    pdf: documents/cours/terminale/chap01_suites.pdf
    pages: 9
    statut: depose
  - id: t-02
    niveau: terminale
    chapitre: 2
    titre: Probabilités
    resume: |
      Rappels de probabilités, variables aléatoires, espérance, variance et écart-type, puis épreuve et schéma de Bernoulli, combinaisons et loi binomiale. L'introduction historique confronte les points de vue fréquentiste et bayésien, et remonte à Bernoulli.
    sommaire:
      - Introduction historique
      - Probabilités et variables aléatoires
      - Loi binomiale
    theories: [p-variables, p-esperance, p-independance, proba]
    notions: [variable-aleatoire, esperance, independance]
    pdf: documents/cours/terminale/chap02_probabilites.pdf
    exercices: f-t-02
    pages: 9
    statut: depose
  - id: t-03
    niveau: terminale
    chapitre: 3
    titre: Fonctions numériques
    resume: |
      Limites en l'infini et en un réel, opérations sur les limites, théorèmes de comparaison et asymptotes ; dérivée d'une fonction composée et convexité ; continuité et théorème des valeurs intermédiaires. L'introduction historique va du siècle des courbes à la rigueur retrouvée.
    sommaire:
      - Introduction historique
      - Limites d'une fonction
      - Dérivation et convexité
      - Continuité
    theories: [ar-deriv, continuite, c-tvi, analyse-reelle]
    notions: [continuite, derivable]
    pdf: documents/cours/terminale/chap03_fonctions.pdf
    exercices: f-t-03
    pages: 10
    statut: depose
  - id: t-04
    niveau: terminale
    chapitre: 4
    titre: Géométrie dans l'espace
    resume: |
      Bases et repères de l'espace, vecteurs coplanaires et produit scalaire ; vecteur normal et équation cartésienne d'un plan, représentation paramétrique d'une droite ; positions relatives de droites et de plans ; projeté orthogonal sur un plan. L'introduction historique va des solides des Anciens à l'espace mis en coordonnées.
    sommaire:
      - Introduction historique
      - Vecteurs et produit scalaire dans l'espace
      - Équations et représentations paramétriques
      - Positions relatives
      - Projeté orthogonal sur un plan
    theories: [v-libre, v-dimension, alglin]
    notions: [espace-vectoriel, base-vectorielle]
    pdf: documents/cours/terminale/chap04_espace.pdf
    exercices: f-t-04
    pages: 14
    statut: depose
  - id: t-05
    niveau: terminale
    chapitre: 5
    titre: Fonctions exponentielle et logarithme
    resume: |
      Limites et croissances comparées de l'exponentielle ; le logarithme népérien, ses propriétés algébriques et son étude ; exponentielles de base $a$ et logarithme décimal. L'introduction historique part des logarithmes, outil de calcul, et arrive au nombre $\mathrm e$ d'Euler.
    sommaire:
      - Introduction historique
      - Fonction exponentielle
      - Fonction logarithme népérien
      - Autres exponentielles et logarithmes
    theories: [cx-exponentielle, nb-logarithme, anc, nban]
    notions: [exponentielle, logarithme]
    pdf: documents/cours/terminale/chap05_exp_log.pdf
    exercices: f-t-05
    pages: 8
    statut: depose
  - id: t-06
    niveau: terminale
    chapitre: 6
    titre: Calcul intégral
    resume: |
      Primitives et primitives usuelles ; intégrale d'une fonction continue sur un segment, approchée par la méthode des rectangles, théorème fondamental de l'analyse et calcul par les primitives ; linéarité, positivité, valeur moyenne ; intégration par parties. L'introduction historique présente les intégrales de Riemann et de Lebesgue.
    sommaire:
      - Introduction historique
      - Primitives d'une fonction
      - Intégrale d'une fonction continue sur un segment
      - Propriétés de l'intégrale
      - Intégration par parties
    theories: [ar-riemann, ar-tfa, analyse-reelle, mes]
    notions: [riemann-integrable]
    pdf: documents/cours/terminale/chap06_integration.pdf
    exercices: f-t-06
    pages: 10
    statut: depose
  - id: t-07
    niveau: terminale
    chapitre: 7
    titre: Dénombrement
    resume: |
      Cardinal d'un ensemble fini, principe multiplicatif, listes et $p$-uplets ; permutations, arrangements et combinaisons. L'introduction historique montre comment on apprend à compter sans énumérer, jusqu'à l'*Art de conjecturer* de Bernoulli.
    sommaire:
      - Introduction historique
      - Principes de base
      - Arrangements et combinaisons
    theories: [n-fini, n]
    notions: [ensemble-fini, n-uplet, produit-cartesien]
    pdf: documents/cours/terminale/chap07_denombrement.pdf
    exercices: f-t-07
    pages: 6
    statut: depose
  - id: t-08
    niveau: terminale
    chapitre: 8
    titre: Équations différentielles
    resume: |
      Notion d'équation différentielle, courbes intégrales et condition initiale, résolution de $y' = ay$ puis de $y' = ay + b$, et modélisation : désintégration radioactive, loi de refroidissement de Newton. L'introduction historique montre comment les équations différentielles sont devenues le langage du mouvement.
    sommaire:
      - Introduction historique
      - Notion d'équation différentielle
      - L'équation $y' = ay$
      - L'équation $y' = ay + b$
      - Modélisation
    theories: [ed-lineaires, edo, cx-exponentielle]
    notions: [equation-differentielle, exponentielle]
    exercices: f-t-08
    pdf: documents/cours/terminale/chap08_equadiff.pdf
    pages: 6
    statut: depose
  - id: t-09
    niveau: terminale
    chapitre: 9
    titre: Fonctions trigonométriques
    resume: |
      Les fonctions cosinus et sinus, leurs valeurs remarquables, une limite fondamentale et leurs dérivées, puis leur étude et leurs courbes de référence. L'introduction historique raconte la querelle des cordes vibrantes et la naissance des séries de Fourier.
    sommaire:
      - Introduction historique
      - Les fonctions cosinus et sinus
      - Dérivation
      - Étude et représentation graphique
    theories: [cx-pi, anc, fourier]
    notions: [pi]
    exercices: f-t-09
    pdf: documents/cours/terminale/chap09_trigonometrie.pdf
    pages: 6
    statut: depose
  - id: t-10
    niveau: terminale
    chapitre: 10
    titre: Loi des grands nombres
    resume: |
      Échantillon d'une variable aléatoire, inégalités de Markov et de Bienaymé-Tchebychev, inégalité de concentration et loi faible des grands nombres. L'introduction historique va du théorème d'or de Bernoulli à l'école russe et à ses inégalités.
    sommaire:
      - Introduction historique
      - Échantillon d'une variable aléatoire
      - Inégalité de Markov
      - Inégalité de Bienaymé-Tchebychev
      - Inégalité de concentration
      - Loi faible des grands nombres
    theories: [p-loi-faible, p-esperance, proba]
    notions: [esperance, variable-aleatoire]
    exercices: f-t-10
    pdf: documents/cours/terminale/chap10_lgn.pdf
    pages: 6
    statut: depose
  - id: me-01
    niveau: expertes
    chapitre: 1
    titre: Divisibilité et primalité
    resume: |
      La divisibilité dans ℤ et ses règles de calcul, puis la division euclidienne, démontrée en existence et en unicité à partir de la partie entière. Le chapitre établit ensuite que tout entier au moins égal à 2 admet un diviseur premier, l'infinitude des nombres premiers, le lemme d'Euclide et le théorème fondamental de l'arithmétique, avec le nombre de diviseurs qui s'en déduit. L'introduction historique va des *Éléments* d'Euclide au petit et au grand théorème de Fermat.
    sommaire:
      - Introduction historique
      - Divisibilité dans ℤ
      - Division euclidienne
      - Primalité
    theories: [z-division, z-premiers, n-recurrence, z]
    notions: [division-euclidienne, nombre-premier]
    liens: [t-01, me-04, me-07]
    exercices: f-me-01
    pdf: documents/cours/expertes/chap01_divisibilite.pdf
    pages: 6
    statut: depose
  - id: me-02
    niveau: expertes
    chapitre: 2
    titre: Nombres complexes
    resume: |
      L'ensemble ℂ, la forme algébrique et les règles de calcul, puis le conjugué et ses propriétés. Le chapitre résout dans ℂ les équations du second degré à coefficients réels et aborde les fonctions polynômes : factorisation par $z - a$ lorsque $a$ est une racine. L'introduction historique part de la formule de Cardan et des « nombres sophistiques » de Bombelli pour arriver au théorème fondamental de l'algèbre.
    sommaire:
      - Introduction historique
      - L'ensemble ℂ
      - Résolution d'équations
    theories: [c-construction, c-calcul, c-racines-carrees, z-polynomes, c]
    notions: [ensemble-complexes, nombre-complexe, anneau-polynomes]
    liens: [me-05, t-09]
    exercices: f-me-02
    pdf: documents/cours/expertes/chap02_complexes.pdf
    pages: 7
    statut: depose
  - id: me-03
    niveau: expertes
    chapitre: 3
    titre: Matrices
    resume: |
      Le vocabulaire des matrices (matrices carrées, lignes, colonnes, diagonales, symétriques, identité), les opérations (somme, produit par un réel, produit de matrices) et leurs propriétés, les puissances d'une matrice et le cas des matrices diagonales. Le chapitre se termine par l'inversion, avec le critère d'inversibilité et la formule de l'inverse pour une matrice carrée d'ordre 2. L'introduction historique va des déterminants de Cramer et Cauchy aux matrices de Cayley.
    sommaire:
      - Introduction historique
      - Vocabulaire
      - Opérations
      - Inversion de matrice
    theories: [v-matrices, v-determinant, alglin]
    notions: [espace-matrices, inversible, determinant]
    liens: [me-06, t-04]
    exercices: f-me-03
    pdf: documents/cours/expertes/chap03_matrices.pdf
    pages: 6
    statut: depose
  - id: me-04
    niveau: expertes
    chapitre: 4
    titre: Congruences
    resume: |
      La congruence modulo $n$, définie par l'égalité des restes dans la division euclidienne par $n$, sa caractérisation par la divisibilité de $a - b$ par $n$, et sa compatibilité avec l'addition, la multiplication et les puissances. Le chapitre culmine avec le petit théorème de Fermat. L'introduction historique part d'un problème de restes du *Sunzi Suanjing* et présente l'arithmétique modulaire des *Disquisitiones arithmeticae* de Gauss.
    sommaire:
      - Introduction historique
      - Vocabulaire et propriétés
      - Petit théorème de Fermat
    theories: [z-zn, z-division, z]
    notions: [anneau-zn, division-euclidienne]
    liens: [me-01, me-07]
    exercices: f-me-04
    pdf: documents/cours/expertes/chap04_congruences.pdf
    pages: 4
    statut: depose
  - id: me-05
    niveau: expertes
    chapitre: 5
    titre: Géométrie complexe
    resume: |
      La représentation des nombres complexes dans le plan, le module et l'argument, puis la forme trigonométrique, les formules d'addition et de duplication et les règles de calcul du module et de l'argument d'un produit, d'un quotient et d'une puissance. Le chapitre introduit enfin la forme exponentielle $re^{i\theta}$, les formules d'Euler et de Moivre et l'identité $e^{i\pi} + 1 = 0$. L'introduction historique présente Wessel, Argand et Euler.
    sommaire:
      - Introduction historique
      - Représentation complexe
      - Forme trigonométrique
      - Forme exponentielle
    theories: [c-calcul, cx-exponentielle, cx-pi, anc]
    notions: [module-complexe, exponentielle]
    liens: [me-02, me-08, t-05, t-09]
    exercices: f-me-05
    pdf: documents/cours/expertes/chap05_geometrie_complexe.pdf
    pages: 6
    statut: depose
  - id: me-06
    niveau: expertes
    chapitre: 6
    titre: Applications des matrices
    resume: |
      Trois usages du calcul matriciel. Un système linéaire de $n$ équations à $n$ inconnues s'écrit $AX = B$ et se résout par l'inverse de $A$. Les transformations du plan (translations, symétries axiales, homothéties, rotations de centre $O$) se traduisent par des matrices. Enfin, la matrice d'adjacence d'un graphe compte, par ses puissances, les chaînes et les chemins de longueur donnée.
    sommaire:
      - Résolution de systèmes
      - Transformations du plan
      - Graphes
    theories: [v-matrices, v-applications, v-determinant, alglin]
    notions: [espace-matrices, inversible]
    liens: [me-03, me-09]
    exercices: f-me-06
    pdf: documents/cours/expertes/chap06_applications_matrices.pdf
    pages: 4
    statut: depose
  - id: me-07
    niveau: expertes
    chapitre: 7
    titre: PGCD
    resume: |
      Le plus grand commun diviseur, les entiers premiers entre eux et l'algorithme d'Euclide, puis l'identité et le théorème de Bézout et leur corollaire sur les équations $ax + by = c$. Le chapitre établit enfin le théorème de Gauss et son corollaire. L'introduction historique va de Bachet de Méziriac et Bézout aux *Disquisitiones arithmeticae* de Gauss, et ouvre vers la cryptographie.
    sommaire:
      - Introduction historique
      - PGCD
      - Théorème de Bézout
      - Théorème de Gauss
    theories: [z-bezout, z-ideaux, z-division, z]
    notions: [pgcd]
    liens: [me-01, me-04]
    exercices: f-me-07
    pdf: documents/cours/expertes/chap07_pgcd.pdf
    pages: 6
    statut: depose
  - id: me-08
    niveau: expertes
    chapitre: 8
    titre: Configurations géométriques
    resume: |
      L'ensemble $\mathbb U$ des complexes de module 1 et les racines $n$-ièmes de l'unité, sommets d'un polygone régulier inscrit dans le cercle unité. Le chapitre traduit ensuite la géométrie plane en calcul complexe : affixe d'un vecteur, inégalité triangulaire, cercles et médiatrices, alignement, parallélisme et orthogonalité exprimés par des quotients d'affixes.
    sommaire:
