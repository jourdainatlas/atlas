    pdf: documents/cours/seconde/chap10_vecteurs.pdf
    pages: 7
    exercices: f-s-10
    statut: depose
  - id: s-11
    niveau: seconde
    chapitre: 11
    titre: Statistiques
    resume: |
      Le vocabulaire des séries statistiques (population, caractère, effectif, fréquence) et le diagramme en bâtons. Le chapitre définit la moyenne, interprétée comme point d'équilibre, la moyenne pondérée et l'effet d'une transformation affine des données, puis la médiane, insensible aux valeurs extrêmes. Il mesure ensuite la dispersion par l'étendue, les quartiles et l'écart interquartile, lus aussi sur un tableau d'effectifs cumulés croissants, et résume une série par un diagramme en boîte, qui permet de comparer deux séries.
    sommaire:
