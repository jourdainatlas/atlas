    niveau: l3
    ue: l3-s6-pr
    chapitre: 9
    titre: "Lois des grands nombres, théorème central limite"
    resume: |
      Pour une suite de variables indépendantes de même loi, la moyenne empirique converge vers l'espérance : en probabilité si la variance est finie, par l'inégalité de Bienaymé-Tchebychev (loi faible des grands nombres), et presque sûrement dès que la variable est intégrable (loi forte), démontrée d'abord sous un moment d'ordre $4$, puis dans le cas général par le lemme de Borel-Cantelli. Le théorème central limite, démontré par les fonctions caractéristiques et le théorème de Lévy, montre que les fluctuations autour de l'espérance, d'ordre $\sigma / \sqrt{n}$, sont asymptotiquement gaussiennes. Le chapitre en déduit le théorème de Moivre-Laplace, les intervalles de confiance pour une proportion et la méthode de Monte-Carlo.
