    resume: |
      Un vecteur aléatoire à densité se décrit par une fonction de $n$ variables, dont les intégrales sur les boréliens de $\mathbb{R}^{n}$ sont les probabilités. Le chapitre en tire les densités marginales, en intégrant par rapport aux autres variables, et montre que l'indépendance des composantes équivaut à la factorisation de la densité. La formule du changement de variables donne la densité de l'image d'un vecteur par un difféomorphisme, appliquée au quotient de deux gaussiennes et aux coordonnées polaires (méthode de Box-Muller) ; la densité de la somme de deux variables indépendantes est la convolution de leurs densités.
