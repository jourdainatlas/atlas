  - id: ma-03
    niveau: ma
    chapitre: 3
    titre: Calcul algébrique
    resume: |
      Ce chapitre forge les outils de calcul dont tout le reste du cours se servira. Il définit les sommes et les produits finis et établit leurs règles de calcul. Il présente ensuite trois techniques fondamentales : le changement d'indice, justifié par une bijection entre ensembles d'indices, le télescopage et l'interversion des sommes. Ces techniques donnent les sommes usuelles (entiers, carrés, somme géométrique) et la factorisation de $a^{n} - b^{n}$. Les sommes doubles sont traitées sur un produit cartésien puis sur un ensemble d'indices triangulaire, que l'on découpe de deux façons. La factorielle et les coefficients binomiaux sont définis par le calcul. Le chapitre démontre la formule de Pascal, puis la formule de la crosse de hockey. L'interprétation combinatoire de $\binom{n}{k}$ comme nombre de parties à $k$ éléments est démontrée, et la formule du binôme de Newton est établie par récurrence. La dernière section résout les systèmes linéaires par la méthode du pivot de Gauss : vocabulaire, interprétation géométrique, opérations élémentaires qui conservent l'ensemble des solutions, puis algorithme d'échelonnement.
