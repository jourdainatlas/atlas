    resume: |
      La fonction trinôme $x \mapsto ax^2 + bx + c$, sa forme canonique et le sommet $(\alpha ; \beta)$ de sa parabole, puis la résolution de l'équation du second degré par le discriminant. Le chapitre établit les relations entre les coefficients et les racines (somme et produit), la factorisation d'un trinôme et son signe.
    sommaire:
