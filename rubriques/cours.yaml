  - id: l3-in-03
    niveau: l3
    ue: l3-s5-int
    chapitre: 3
    titre: "Fonctions mesurables, intégrale des fonctions positives"
    resume: |
      Le chapitre définit les fonctions mesurables, avec le critère par une famille génératrice et, pour les fonctions à valeurs dans la droite achevée, celui des demi-droites, et montre leur stabilité par les opérations et par les limites simples. Toute fonction mesurable positive est limite croissante de fonctions étagées. L'intégrale est construite en deux étages : celle d'une fonction étagée positive pondère chaque valeur par la mesure de l'ensemble où elle est prise, celle d'une fonction mesurable positive est la borne supérieure des intégrales des fonctions étagées qu'elle majore. Le théorème de convergence monotone, conséquence de la $\sigma$-additivité, en donne les propriétés : linéarité positive, intégration terme à terme des séries positives, mesures à densité, intégrale par rapport à une mesure image, inégalité de Markov, lemme de Fatou. Le chapitre compare enfin l'intégrale de Lebesgue à celle de Riemann pour les fonctions positives, sur un segment puis sur un intervalle quelconque.
