  - id: l3-hf-07
    niveau: l3
    ue: l3-s6-hf
    chapitre: 7
    titre: 'Transformation de Fourier sur $L^{1}(\mathbb{R})$'
    resume: |
      Le chapitre établit la continuité des translations dans $L^{1}(\mathbb{R})$ et les propriétés de la convolution sur $\mathbb{R}$. La transformée de Fourier d'une fonction intégrable est uniformément continue, bornée par la norme $L^{1}$, et tend vers $0$ à l'infini (lemme de Riemann-Lebesgue) ; elle change la convolution en produit. Toute fonction continue tendant vers $0$ n'est pas pour autant une transformée de Fourier. Quand la transformée est intégrable, la formule d'inversion reconstitue la fonction presque partout, d'où l'injectivité de la transformation. Le chapitre démontre la formule sommatoire de Poisson, qu'il applique au calcul de $\sum_{k}\frac{1}{k^{2} + a^{2}}$, puis relie dérivation et multiplication par la variable.
