    chapitre: 9
    titre: Chaînes de Markov
    resume: |
      Les graphes pondérés et probabilistes, puis les chaînes de Markov homogènes sur un ensemble fini d'états : matrice de transition, relation de Chapman-Kolmogorov et suite des distributions $\pi_{n+1} = \pi_n P$. Le chapitre se termine par les distributions invariantes, leur existence et la convergence des distributions. L'introduction historique présente les processus stochastiques et les travaux de Markov (1906).
