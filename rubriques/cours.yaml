  - id: ma-22
    niveau: ma
    chapitre: 22
    titre: Fonctions de deux variables
    resume: |
      Le chapitre étend le calcul différentiel aux fonctions définies sur un ouvert de $\mathbb{R}^{2}$. Il définit la distance euclidienne, les boules et les ouverts du plan, représente une fonction de deux variables par sa surface d'équation $z = f(x, y)$ et ses lignes de niveau, définit la convergence des suites de points et la continuité, par $\varepsilon$ et $\delta$, caractérisée par les suites, avec ses opérations. Il introduit ensuite les dérivées partielles, montre sur un exemple que leur existence n'entraîne pas la continuité, puis définit les fonctions de classe $\mathcal{C}^{1}$ et démontre qu'elles admettent un développement limité à l'ordre $1$, ce qui donne le plan tangent et la continuité. Le gradient, la dérivée selon un vecteur et le théorème selon lequel le gradient indique la direction de plus forte pente préparent la règle de la chaîne, appliquée aux arcs tracés sur une ligne de niveau, à laquelle le gradient est orthogonal, puis aux dérivées partielles d'une composée, aux coordonnées polaires et à la résolution d'équations aux dérivées partielles simples. La dernière partie traite des extrema : extrema globaux et locaux, condition nécessaire d'extremum local en un point intérieur, qui doit être un point critique, points col, et méthode de recherche des extrema.
