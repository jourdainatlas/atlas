  - id: ap-03
    niveau: approfondies
    chapitre: 3
    titre: Groupes
    resume: |
      Le chapitre ouvre la démarche structurale par les lois de composition interne : commutativité, associativité, élément neutre, dont l'unicité est démontrée, et symétrique, unique dès que la loi est associative. Un tableau passe en revue des lois usuelles, et la table de Cayley de $\{1\,;\mathrm{i}\,;-1\,;-\mathrm{i}\}$ montre comment lire ces propriétés sur une table. Le groupe est défini par ses quatre axiomes, puis illustré par $(\mathbb{Z}\,;+)$, $(\mathbb{R}^{*}\,;\times)$ et le groupe symétrique. Le chapitre établit la formule $(xy)^{-1} = y^{-1}x^{-1}$ et construit le groupe produit. Il étudie enfin les sous-groupes et leur caractérisation par $xy^{-1} \in H$, l'appliquant aux $n\mathbb{Z}$, dont les inclusions reflètent la divisibilité.
