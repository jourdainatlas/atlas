    pages: 4
    statut: depose
  - id: ap-09
    niveau: approfondies
    chapitre: 9
    titre: Matrices
    resume: |
      Le chapitre présente les matrices, leur structure d'espace vectoriel et leur produit, qui n'est pas commutatif. $\mathcal{M}_n(K)$ est un anneau qui possède des diviseurs de zéro, et dont le groupe des inversibles est $GL_n(K)$. La matrice d'une application linéaire a pour colonnes les images des vecteurs de la base de départ, et le produit des matrices correspond à la composition des applications. La dérivation sur $\mathbb{R}_2[X]$ et la rotation d'angle $\theta$ servent d'exemples. Pour les matrices inversibles, le chapitre établit l'inverse d'un produit et le lien avec les automorphismes. Il inverse une matrice $2 \times 2$ par la résolution d'un système, puis expose la méthode du pivot de Gauss : opérations élémentaires, principe de la matrice augmentée et inversion complète d'une matrice $3 \times 3$. Il se termine par la transposée, avec la formule ${}^{t}(AB) = {}^{t}B\,{}^{t}A$, et par les matrices diagonales, triangulaires et symétriques.
    sommaire:
      - Matrices et opérations
      - Matrice d'une application linéaire
      - Matrices inversibles et méthode du pivot de Gauss
      - Transposition et matrices remarquables
