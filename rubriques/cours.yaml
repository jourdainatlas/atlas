  - id: t-08
    niveau: terminale
    chapitre: 8
    titre: Équations différentielles
    resume: |
      Notion d'équation différentielle, résolution de $y' = ay$ puis de $y' = ay + b$, unicité de la solution qui vérifie une condition initiale, et modélisation : radioactivité, refroidissement, croissance d'une population.
