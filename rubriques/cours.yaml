# Rubrique « Cours » — PROTOTYPE.
# Les chapitres de Première, de Terminale et de Maths expertes sont en ligne
# (PDF dans documents/cours/premiere/, documents/cours/terminale/ et documents/cours/expertes/).
# Champs d'un cours :
#   id, niveau, chapitre, titre, resume (texte riche), sommaire (liste de sections),
#   theories (nœuds de l'édifice), notions (termes du lexique), exercices (id d'une feuille),
#   liens (id d'autres cours, affichés dans les deux sens comme « chapitres liés »),
#   pdf, tex (chemins des fichiers déposés), pages, statut (depose | a-deposer)

intro: |
  Les cours sont rédigés en LaTeX, chapitre par chapitre, et déposés ici au fil de l'année sous forme de PDF. Chaque chapitre indique les théories de l'édifice sur lesquelles il repose, ce qui permet de passer d'un cours de lycée aux fondements qui le justifient.

niveaux:
  - id: seconde
    titre: Seconde
    description: Seconde générale.
  - id: premiere
    titre: Première
    description: Enseignement de spécialité mathématiques.
  - id: terminale
    titre: Terminale
    description: Enseignement de spécialité mathématiques.
  - id: expertes
    titre: Maths expertes
    description: Terminale, option mathématiques expertes, suivie en complément de la spécialité.
  - id: ma
    titre: Maths approfondies
    description: Classe préparatoire, première année (MPSI).
  - id: ecg
    titre: Maths ECG
    description: Classe préparatoire économique et commerciale.
  - id: master
    titre: Master
    description: Cours de niveau recherche, un fichier par thème.

cours:
  - id: s-01
    niveau: seconde
    chapitre: 1
    titre: Nombres et calculs
    resume: 'Les règles de calcul sur les fractions, les puissances d''exposant entier relatif et les racines
      carrées, avec l''écriture scientifique et la simplification des radicaux. Le chapitre présente ensuite
      les ensembles emboîtés $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{D} \subset \mathbb{Q} \subset
      \mathbb{R}$, caractérise les rationnels par leur écriture décimale finie ou périodique et démontre
      par l''absurde l''irrationalité de $\sqrt{2}$. Il se termine par les intervalles, leur représentation
      sur la droite graduée, leur intersection et leur réunion. L''introduction historique part de la crise
      pythagoricienne de l''irrationnel.

      '
    sommaire:
    - Introduction historique
    - Fractions, puissances et racines carrées
    - Ensembles de nombres
    - Intervalles
    theories:
    - q-irrationnel
    - c-racine-reelle
    - q
    - r
    notions:
    - ensemble-entiers-naturels
    - ensemble-entiers-relatifs
    - ensemble-rationnels
    - ensemble-reels
    - intervalle
    liens:
    - s-09
    pdf: documents/cours/seconde/chap01_nombres.pdf
    pages: 6
    exercices: f-s-01
    statut: depose
  - id: s-02
    niveau: seconde
    chapitre: 2
    titre: Calcul littéral
    resume: 'Les expressions littérales, leur valeur numérique et la distinction entre somme et produit.
      Le chapitre établit la simple et la double distributivité, illustrées par des aires, puis les trois
      identités remarquables, qu''il démontre et utilise pour le calcul mental. La factorisation est présentée
      comme l''opération inverse, par facteur commun ou par identité remarquable, et appliquée à l''équation
      produit nul. La dernière partie traite des expressions rationnelles : valeurs interdites, simplification
      par un facteur commun et réduction au même dénominateur. L''introduction historique va d''al-Khwarizmi
      à Viète et Descartes.

      '
    sommaire:
    - Introduction historique
    - Développement
    - Factorisation
    - Expressions rationnelles
    theories:
    - z-anneau
    - z-polynomes
    notions:
    - anneau
    - anneau-polynomes
    liens:
    - s-04
    - p-01
    pdf: documents/cours/seconde/chap02_calcul_litteral.pdf
    pages: 7
    exercices: f-s-02
    statut: depose
  - id: s-03
    niveau: seconde
    chapitre: 3
    titre: Probabilités
    resume: 'Le vocabulaire des expériences aléatoires : issues, univers, événements, événement contraire,
      intersection, réunion et événements incompatibles, représentés par des diagrammes. Le chapitre définit
      une loi de probabilité sur un univers fini, traite l''équiprobabilité, démontre les formules $P(\overline{A})
      = 1-P(A)$ et $P(A \cup B) = P(A)+P(B)-P(A \cap B)$, et calcule sur des arbres et des tableaux à double
      entrée. Il introduit enfin la probabilité conditionnelle $P_A(B)$, la formule $P(A \cap B) = P(A)
      \times P_A(B)$ et l''indépendance de deux événements. L''introduction historique part du problème
      du chevalier de Méré.

      '
    sommaire:
    - Introduction historique
    - Vocabulaire et schémas
    - Calculs de probabilités
    - Probabilités conditionnelles
    theories:
    - p-espace
    - p-independance
    - proba
    notions:
    - espace-probabilise
    - independance
    liens:
    - p-05
    pdf: documents/cours/seconde/chap03_probabilites.pdf
    pages: 8
    exercices: f-s-03
    statut: depose
  - id: s-04
    niveau: seconde
    chapitre: 4
    titre: Équations
    resume: 'La résolution des équations du premier degré par le principe de la balance : on ajoute, retranche,
      multiplie ou divise les deux membres par un même nombre non nul, avec les cas où l''inconnue disparaît
      (aucune solution ou tous les réels). Le chapitre démontre qu''un produit est nul si et seulement si
      l''un de ses facteurs l''est et en tire la méthode des équations produit, puis traite les équations
      quotient, où les valeurs interdites du dénominateur doivent être écartées. L''introduction historique
      va de la fausse position du papyrus Rhind au signe $=$ de Robert Recorde.

      '
    sommaire:
    - Introduction historique
    - Équations du premier degré
    - Équations produit
    - Équations quotient
    theories:
    - z-anneau
    - ar-corps
    notions:
    - anneau-integre
    - corps
    liens:
    - s-02
    - s-09
    pdf: documents/cours/seconde/chap04_equations.pdf
    pages: 6
    exercices: f-s-04
    statut: depose
  - id: s-05
    niveau: seconde
    chapitre: 5
    titre: Géométrie cartésienne
    resume: 'Les repères du plan (quelconque, orthogonal, orthonormé) et les coordonnées d''un point. Le
      chapitre établit la formule du milieu d''un segment, valable dans tout repère, et l''utilise pour
      trouver un symétrique ou reconnaître un parallélogramme ; il démontre par le théorème de Pythagore
      la formule de la distance entre deux points, qui exige un repère orthonormé, et l''applique à la nature
      d''un triangle. Une dernière partie traduit ces formules en fonctions Python et discute les limites
      des tests d''égalité sur des valeurs approchées. L''introduction historique présente la géométrie
      analytique de Descartes.

      '
    sommaire:
    - Introduction historique
    - Repères et coordonnées
    - Milieu d'un segment
    - Distance entre deux points
    - Applications Python
    theories:
    - v-espace
    - gd-normes
    notions:
    - couple
    - norme
    liens:
    - s-08
    - s-10
    - p-03
    pdf: documents/cours/seconde/chap05_geometrie_cartesienne.pdf
    pages: 6
    exercices: f-s-05
    statut: depose
  - id: s-06
    niveau: seconde
    chapitre: 6
    titre: Pourcentages
    resume: 'Une proportion et ses trois écritures (fraction, décimal, pourcentage), l''application d''un
      pourcentage à une quantité et la proportion d''une proportion, qui se calcule par produit. Le chapitre
      définit ensuite le taux d''évolution et le coefficient multiplicateur $CM = 1+t$, montre que des évolutions
      successives se composent en multipliant les coefficients et non en ajoutant les taux, et traite l''évolution
      réciproque, de coefficient $\dfrac{1}{CM}$. Il distingue enfin points de pourcentage et pourcentage
      d''évolution. L''introduction historique va de la taxe romaine du centième au symbole %.

      '
    sommaire:
    - Introduction historique
    - Proportions
    - Évolutions
    theories:
    - q
    notions:
    - ensemble-rationnels
    liens:
    - s-11
    - p-02
    pdf: documents/cours/seconde/chap06_pourcentages.pdf
    pages: 5
    exercices: f-s-06
    statut: depose
  - id: s-07
    niveau: seconde
    chapitre: 7
    titre: Fonctions numériques
    resume: 'La notion de fonction : ensemble de définition, image et antécédents, expression algébrique,
      tableau de valeurs et courbe représentative, avec la lecture graphique des images et des antécédents.
      Le chapitre définit les fonctions croissantes et décroissantes, le tableau de variations, puis le
      maximum et le minimum. Il étudie les fonctions de référence carré, racine carrée, inverse et cube,
      démontre leurs variations (celle de la fonction cube est admise) et compare $\sqrt{x}$, $x$, $x^2$
      et $x^3$ selon que $x$ est inférieur ou supérieur à $1$. Il résout enfin $x^2 = a$ et énonce la résolution
      de $x^2 \leqslant a$. L''introduction historique est consacrée à Euler et Jean Bernoulli.

      '
    sommaire:
    - Introduction historique
    - Notion de fonction
    - Courbe représentative d'une fonction
    - Variations d'une fonction
    - Extremum d'une fonction
    - Fonctions de référence
    theories:
    - r-application
    - ar-corps
    - c-racine-reelle
    notions:
    - application
    - intervalle
    liens:
    - s-09
    - p-04
    - t-03
    pdf: documents/cours/seconde/chap07_fonctions.pdf
    pages: 10
    exercices: f-s-07
    statut: depose
  - id: s-08
    niveau: seconde
    chapitre: 8
    titre: Équations cartésiennes
    resume: 'Le vecteur directeur d''une droite, puis l''équation cartésienne $ax+by+c=0$, démontrée par
      la nullité d''un déterminant, avec ses vecteurs directeurs usuels. Le chapitre en déduit l''équation
      réduite $y = mx+p$ lorsque $b \neq 0$, le coefficient directeur et l''ordonnée à l''origine, avec
      leur lecture graphique. Il donne le critère $ab''-a''b \neq 0$ pour que deux droites soient sécantes,
      puis résout le système formé par leurs équations par substitution et par combinaison linéaire. L''introduction
      historique évoque Gabriel Cramer et les systèmes d''équations.

      '
    sommaire:
    - Introduction historique
    - Vecteur et droite
    - Intersection et systèmes
    theories:
    - v-libre
    - v-determinant
    - v-espace
    notions:
    - determinant
    - famille-libre
    liens:
    - s-05
    - s-10
    - p-03
    pdf: documents/cours/seconde/chap08_equations_droites.pdf
    pages: 5
    exercices: f-s-08
    statut: depose
  - id: s-09
    niveau: seconde
    chapitre: 9
    titre: Inéquations
    resume: 'Les règles de manipulation des inégalités, dont le changement de sens lors d''une multiplication
      par un nombre strictement négatif, et la résolution des inéquations du premier degré. Le chapitre
      rappelle les fonctions affines, la détermination de $m$ et $p$ à partir de deux images, et démontre
      le signe de $mx+p$ de part et d''autre de sa racine. Il résout ensuite les inéquations produit et
      quotient par tableau de signes, en excluant les valeurs interdites, et termine par la position relative
      de deux courbes, ramenée au signe de leur différence. L''introduction historique est consacrée à Thomas
      Harriot et à l''invention des symboles $<$ et $>$.

      '
    sommaire:
    - Introduction historique
    - Règles de base
    - Signe des fonctions affines
    - Inéquations produit
    - Inéquations quotient
    - Position relative de deux courbes représentatives
    theories:
    - q-ordre
    - ar-corps
    notions:
    - corps-ordonne
    - intervalle
    liens:
    - s-01
    - s-04
    - s-07
    pdf: documents/cours/seconde/chap09_inequations.pdf
    pages: 7
    exercices: f-s-09
    statut: depose
  - id: s-10
    niveau: seconde
    chapitre: 10
    titre: Vecteurs
    resume: 'Le vecteur défini par une translation, avec sa direction, son sens et sa norme, l''égalité
      de deux vecteurs caractérisée par un parallélogramme, la somme comme enchaînement de deux translations,
      la relation de Chasles, le vecteur nul et le vecteur opposé. Le chapitre passe ensuite aux coordonnées
      dans un repère, à la norme en repère orthonormé, puis aux coordonnées d''une somme et d''un produit
      par un réel. Il se termine par la colinéarité, le déterminant de deux vecteurs et le critère de colinéarité,
      appliqué à l''alignement et au parallélisme. L''introduction historique va de la règle du parallélogramme
      de Stevin et Newton à Hamilton, Grassmann et Gibbs.

      '
    sommaire:
    - Introduction historique
    - Vecteurs du plan
    - Vecteurs dans un repère
    - Opérations sur les vecteurs
    - Colinéarité
    theories:
    - v-espace
    - v-combinaisons
    - v-libre
    - v-determinant
    notions:
    - espace-vectoriel
    - famille-libre
    - determinant
    liens:
    - s-05
    - s-08
    - p-07
    pdf: documents/cours/seconde/chap10_vecteurs.pdf
    pages: 7
    exercices: f-s-10
    statut: depose
  - id: s-11
    niveau: seconde
    chapitre: 11
    titre: Statistiques
    resume: 'Le vocabulaire des séries statistiques (population, caractère, effectif, fréquence) et le diagramme
      en bâtons. Le chapitre définit la moyenne, interprétée comme point d''équilibre, la moyenne pondérée
      et l''effet d''une transformation affine des données, puis la médiane, insensible aux valeurs extrêmes.
      Il mesure ensuite la dispersion par l''étendue, les quartiles et l''écart interquartile, lus aussi
      sur un tableau d''effectifs cumulés croissants, et résume une série par un diagramme en boîte, qui
      permet de comparer deux séries. L''introduction historique va des recensements antiques à John Graunt
      et Adolphe Quetelet.

      '
    sommaire:
    - Introduction historique
    - Vocabulaire et représentations
    - Indicateurs de position
    - Indicateurs de dispersion
    - Diagramme en boîte
    theories:
    - p-esperance
