  - id: l3-in-09
    niveau: l3
    ue: l3-s5-int
    chapitre: 9
    titre: "Convolution, régularisation, densité ; tore et $\\mathbb{Z}/N\\mathbb{Z}$"
    resume: |
      La convolution est une moyenne glissante. Le chapitre établit la continuité des translations dans $L^{p}$ pour $p$ fini, puis les propriétés de la convolution sur $\mathbb{R}^{n}$ : l'inégalité $\|f * g\|_{p} \leqslant \|f\|_{1}\|g\|_{p}$, la continuité de la convolée d'une fonction de $L^{p}$ et d'une fonction de $L^{q}$, et la transformation de Fourier, qui change la convolution en produit. Faute d'élément neutre, on dispose d'approximations de l'unité, avec lesquelles on régularise : la convolée par une fonction de classe $C^{\infty}$ à support compact est de classe $C^{\infty}$, et la suite des régularisées converge dans $L^{p}$. On en déduit la densité de $C_{c}^{\infty}(U)$ dans $L^{p}(U)$ et le théorème de Weierstrass. Sur le cercle, une approximation de l'unité polynomiale donne la densité des polynômes trigonométriques et l'égalité de Parseval ; sur $\mathbb{Z}/N\mathbb{Z}$, la transformée de Fourier discrète change encore la convolution en produit, et la transformée de Fourier rapide la calcule en $O(N \log N)$ opérations.
    sommaire:
      - "Introduction historique"
      - "Convolution sur $\\mathbb{R}^{n}$"
      - "Approximations de l'unité et régularisation"
      - "Théorèmes de densité"
