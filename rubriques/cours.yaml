  - id: p-05
    niveau: premiere
    chapitre: 5
    titre: Probabilités conditionnelles
    resume: |
      Les probabilités conditionnelles, les arbres pondérés et la formule des probabilités totales, puis l'indépendance de deux événements. Le chapitre introduit ensuite les variables aléatoires, leur espérance, sa linéarité, leur variance et la formule de König-Huygens. L'introduction historique présente la formule de Bayes et la fondation axiomatique de Kolmogorov.
    sommaire:
