    titre: Endomorphismes
    resume: |
      Le chapitre définit les applications linéaires, les endomorphismes, les isomorphismes et les formes linéaires, et montre qu'on caractérise la linéarité par la seule condition $f(\lambda x + y) = \lambda f(x) + f(y)$. Il en déduit $f(0_E) = 0_F$. Les exemples vont de l'homothétie et de la rotation à la dérivation, au décalage des suites et à l'évaluation. Le noyau et l'image sont des sous-espaces, et l'injectivité équivaut à $\mathrm{Ker}\,f = \{0_E\}$ ; un exemple de $\mathbb{R}^{3}$ dans $\mathbb{R}^{2}$ annonce le théorème du rang. L'ensemble $\mathcal{L}(E)$ est à la fois un espace vectoriel et un anneau non commutatif, comme le montre la relation $D \circ M - M \circ D = \mathrm{Id}$ sur les polynômes, et $GL(E)$ en est le groupe des inversibles. Le chapitre se termine par les projecteurs et les symétries : il établit $E = \mathrm{Ker}\,p \oplus \mathrm{Im}\,p$, puis la correspondance $s = 2p - \mathrm{Id}$, et traite un exemple dans $\mathbb{R}^{2}$.
    sommaire:
      - Applications linéaires
      - Noyau et image
      - Structure de l'ensemble des endomorphismes
      - Projecteurs et symétries
