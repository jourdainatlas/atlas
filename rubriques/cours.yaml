  - id: ma-19
    niveau: ma
    chapitre: 19
    titre: Espaces préhilbertiens réels
    resume: |
      Le chapitre définit le produit scalaire sur un espace vectoriel réel, forme bilinéaire, symétrique et définie positive, et les espaces préhilbertiens réels et euclidiens, avec leurs exemples de référence : produit scalaire canonique de $\mathbb{R}^{n}$, produit scalaire intégral sur les fonctions continues, avec ou sans poids, et sur les polynômes. Il en tire la norme associée, démontre l'inégalité de Cauchy-Schwarz et son cas d'égalité, puis l'inégalité triangulaire, et définit distance et écart angulaire. Il étudie ensuite l'orthogonalité : familles orthogonales et orthonormées, théorème de Pythagore, algorithme d'orthonormalisation de Gram-Schmidt, appliqué notamment aux polynômes de Legendre, et existence de bases orthonormées en dimension finie, dans lesquelles coordonnées, produit scalaire et norme se calculent simplement. La dernière partie construit le supplémentaire orthogonal d'un sous-espace de dimension finie et la projection orthogonale sur lui, établit qu'elle réalise la meilleure approximation, et en tire la distance à un sous-espace, les équations normales des moindres carrés et l'inégalité de Bessel.
