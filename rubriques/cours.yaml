  - id: ma-14
    niveau: ma
    chapitre: 14
    titre: Espaces vectoriels et applications linéaires
    resume: |
      Le chapitre définit les espaces vectoriels, les espaces de référence et les combinaisons linéaires. Il étudie ensuite les sous-espaces vectoriels, leur intersection et le sous-espace engendré, puis les familles génératrices, les familles libres et les bases, avec les coordonnées dans une base. Viennent ensuite la somme de sous-espaces, la somme directe et les sous-espaces supplémentaires. Les applications linéaires sont étudiées par leurs opérations, leur noyau et leur image, la caractérisation de l'injectivité et de la surjectivité, et leur détermination par l'image d'une base. Le chapitre traite l'anneau $\mathcal{L}(E)$, le groupe $\mathrm{GL}(E)$, les projecteurs et les symétries, puis les formes linéaires et les hyperplans. Il se termine par les sous-espaces affines et la structure des solutions d'une équation linéaire.
