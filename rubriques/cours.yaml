  - id: ma-12
    niveau: ma
    chapitre: 12
    titre: Arithmétique dans $\mathbb{Z}$
    resume: |
      Le chapitre établit la divisibilité et la division euclidienne, puis détermine les sous-groupes de $\mathbb{Z}$. Il définit le PGCD et le PPCM et démontre la relation de Bézout, que l'algorithme d'Euclide rend effective. Il établit ensuite le théorème de Bézout et le lemme de Gauss pour les entiers premiers entre eux, résout les équations $ax + by = c$ et étend ces notions aux familles finies d'entiers. Les nombres premiers viennent ensuite : crible d'Ératosthène, infinité des nombres premiers, lemme d'Euclide, décomposition en facteurs premiers et valuations $p$-adiques. La dernière partie traite des congruences, de l'inverse modulo $n$ et du petit théorème de Fermat.
