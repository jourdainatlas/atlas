  - id: l3-gt-04
    niveau: l3
    ue: l3-s6-gt
    chapitre: 4
    titre: 'Variétés topologiques'
    resume: |
      Une variété de dimension $m$ est un espace séparé, à base dénombrable, dont chaque point a un voisinage homéomorphe à un ouvert de $\mathbb{R}^{m}$ ; les trois hypothèses sont indépendantes. Les sphères en sont, par projection stéréographique, la croix n'en est pas une, et l'invariance de la dimension est admise. Un atlas décrit une variété par des cartes dont les changements sont des homéomorphismes entre ouverts de $\mathbb{R}^{m}$, et l'on peut construire la topologie à partir de l'atlas. Un revêtement est une application dont chaque point de la base a un voisinage au-dessus duquel elle se découpe en feuillets homéomorphes ; $\mathbb{R} \to \mathbb{S}^{1}$ et $z \mapsto z^{n}$ en sont les modèles. Le quotient d'un espace par une action de groupe totalement discontinue est un revêtement, et une variété si l'action est de plus séparante : le chapitre en déduit le cercle, le tore, le cylindre, le ruban de Möbius et les espaces projectifs, droites de $\mathbb{R}^{n+1}$. Il montre enfin que toute variété compacte se plonge dans un espace euclidien.
    sommaire:
      - 'Introduction historique'
      - 'Variétés topologiques'
      - 'Atlas'
      - 'Revêtements'
      - 'Actions de groupes et quotients'
      - 'Espaces projectifs'
      - 'Plongement dans un espace euclidien'
      - 'Bilan'
