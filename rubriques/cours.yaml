    niveau: l3
    ue: l3-s6-gd
    chapitre: 4
    titre: 'Géodésiques et Theorema egregium'
    resume: |
      Une géodésique d'une surface est une courbe dont l'accélération est normale à la surface ; sa vitesse est constante, et les grands cercles de la sphère en sont l'exemple type. Les symboles de Christoffel, qui ne dépendent que de la première forme fondamentale, permettent d'écrire l'équation des géodésiques, qui est donc intrinsèque ; le théorème de Cauchy-Lipschitz donne une géodésique maximale par chaque point et chaque vitesse. L'application exponentielle, dont la différentielle en $0$ est l'identité, conduit aux coordonnées polaires géodésiques, dans lesquelles la première forme s'écrit $\mathrm{diag}(1, J^{2})$ (lemme de Gauss) ; le chapitre en déduit que les géodésiques sont localement les plus courts chemins. Les isométries locales sont caractérisées par la conservation de la première forme ; la formule de Brioschi exprime la courbure de Gauss à l'aide de celle-ci, d'où le Theorema egregium : la courbure de Gauss est invariante par isométrie locale. La formule de Bertrand-Diguet-Puiseux la lit sur le périmètre des petits cercles géodésiques.
    sommaire:
      - 'Introduction historique'
      - 'Géodésiques'
      - 'Application exponentielle'
      - 'Géodésiques et plus courts chemins'
      - 'Isométries et Theorema egregium'
      - 'La formule de Bertrand-Diguet-Puiseux'
      - 'Bilan'
