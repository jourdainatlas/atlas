  - id: mp-16
    niveau: mp
    chapitre: 16
    titre: Équations différentielles linéaires
    resume: |
      Le chapitre étudie les équations $x' = a(t)(x) + b(t)$, où $a$ est une fonction continue sur un intervalle $I$ à valeurs dans $\mathcal{L}(E)$, avec $E$ de dimension finie, et les équations scalaires d'ordre $n$, qu'une écriture vectorielle ramène à ce cadre. Après le principe de superposition et la forme intégrale du problème de Cauchy, il établit le théorème de Cauchy linéaire : existence et unicité d'une solution définie sur tout $I$ pour toute condition initiale, d'où la structure de l'ensemble des solutions, espace affine de dimension $n$ dirigé par celui de l'équation homogène. L'exponentielle d'un endomorphisme ou d'une matrice est définie par une série ; le chapitre en donne le spectre, la continuité, la dérivée de $t \mapsto \mathrm{e}^{tA}$, l'exponentielle d'une somme de matrices qui commutent et le calcul pratique par la décomposition $D + N$. Les systèmes à coefficients constants se résolvent par $t \mapsto \mathrm{e}^{tA}x_{0}$, explicitement dans le cas diagonalisable, et le signe des parties réelles des valeurs propres décide du comportement des solutions en $+\infty$. Pour les équations scalaires du second ordre viennent le wronskien, la formule d'Abel et la variation des constantes. Le chapitre se termine par les équations non normalisées, le raccordement des solutions de part et d'autre d'un point singulier, et la recherche de solutions développables en série entière.
    sommaire:
      - Introduction historique
      - Généralités
      - Le théorème de Cauchy linéaire
      - Exponentielle d'un endomorphisme, d'une matrice
      - Systèmes différentiels linéaires à coefficients constants
      - Équations scalaires du second ordre
