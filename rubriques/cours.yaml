  - id: ma-13
    niveau: ma
    chapitre: 13
    titre: Polynômes et fractions rationnelles
    resume: |
      Le chapitre construit l'anneau $\mathbb{K}[X]$, établit son intégrité, détermine ses inversibles et étudie le degré et la composition. Il traite la divisibilité et la division euclidienne, puis l'évaluation, les racines, leur multiplicité et les relations entre coefficients et racines. La dérivation conduit à la formule de Leibniz, à la formule de Taylor pour les polynômes et à la caractérisation de la multiplicité par les dérivées. L'arithmétique de $\mathbb{K}[X]$ reprend le plan du chapitre 12 : PGCD et PPCM, relation de Bézout, algorithme d'Euclide, théorème de Bézout et lemme de Gauss. Viennent ensuite la décomposition en facteurs irréductibles et les irréductibles de $\mathbb{C}[X]$ et de $\mathbb{R}[X]$, le théorème de d'Alembert-Gauss étant admis. Le chapitre présente l'interpolation de Lagrange. Il construit enfin le corps $\mathbb{K}(X)$ des fractions rationnelles et démontre la décomposition en éléments simples, avec le calcul des coefficients et ses applications.
