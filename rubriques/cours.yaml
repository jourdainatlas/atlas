  - id: l3-in-02
    niveau: l3
    ue: l3-s5-int
    chapitre: 2
    titre: "La mesure de Lebesgue sur $\\mathbb{R}^{n}$"
    resume: |
      La mesure de Lebesgue est construite en trois étages : le volume des pavés, la mesure extérieure obtenue par recouvrements dénombrables de pavés, puis, grâce à la mesure intérieure définie par les compacts, la tribu des parties sur lesquelles les deux approches coïncident. La compacité empêche un pavé d'être recouvert à moindre coût, et la séparation des compacts disjoints donne l'additivité. Le théorème de Lebesgue établit que les parties mesurables forment une tribu qui contient les boréliens, et que la mesure de Lebesgue est l'unique mesure borélienne invariante par translation qui donne la valeur 1 au cube unité ; le chapitre en tire la régularité et l'effet des homothéties. L'ensemble de Cantor, non dénombrable et de mesure nulle, et l'ensemble de Vitali, non mesurable, en marquent les limites. Les notions de « presque partout » et de tribu complétée terminent le chapitre : la tribu de Lebesgue est la complétée de la tribu borélienne.
    sommaire:
      - "Introduction historique"
      - "Le volume des pavés"
      - "La mesure extérieure"
      - "Mesurer de l'intérieur ; la tribu des ensembles mesurables"
      - "Le théorème de Lebesgue"
      - "Deux ensembles remarquables : Cantor et Vitali"
      - "Les notions de « presque partout » et de tribu complétée"
      - "Bilan"
