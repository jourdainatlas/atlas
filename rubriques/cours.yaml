  - id: l3-gd-03
    niveau: l3
    ue: l3-s6-gd
    chapitre: 3
    titre: 'Surfaces : formes fondamentales et courbures'
    resume: |
      Le chapitre étudie les surfaces paramétrées et montre que les changements de paramétrisation sont lisses. La première forme fondamentale, matrice ${}^{t}J\,J$ des produits scalaires des dérivées partielles, transporte sur le domaine des paramètres la géométrie de la surface : elle donne la longueur des courbes tracées sur la surface, leurs angles et l'aire, qui ne dépend pas de la paramétrisation. La variation de la normale définit l'application de Weingarten $W = -dN$, endomorphisme symétrique du plan tangent, et la seconde forme fondamentale ; la courbure normale d'une courbe ne dépend que de sa tangente. Les valeurs propres de $W$ sont les courbures principales, leur produit la courbure de Gauss et leur demi-somme la courbure moyenne ; la formule d'Euler donne la courbure normale dans chaque direction, et le signe de la courbure de Gauss dit si la surface reste d'un côté de son plan tangent. Le chapitre termine par les formules en coordonnées locales et l'interprétation de la courbure de Gauss comme rapport d'aires par l'application de Gauss.
