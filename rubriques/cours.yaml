  - id: l3-pr-04
    niveau: l3
    ue: l3-s6-pr
    chapitre: 4
    titre: "Variables aléatoires réelles, variables à densité"
    resume: |
      La loi d'une variable aléatoire réelle est caractérisée par sa fonction de répartition, croissante, continue à droite, de limites $0$ et $1$ ; réciproquement, toute fonction qui a ces propriétés est une fonction de répartition, et la méthode d'inversion construit une variable qui l'admet. Une variable à densité a une fonction de répartition continue, primitive de sa densité, et ses probabilités sont des aires ; son espérance et la formule de transfert s'écrivent avec des intégrales. Le chapitre étudie les lois uniforme, exponentielle, de Cauchy et normale, puis le calcul de la loi d'une fonction d'une variable à densité, par la fonction de répartition ou par une transformation affine ou monotone.
