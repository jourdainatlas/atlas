  - id: l3-gt-01
    niveau: l3
    ue: l3-s6-gt
    chapitre: 1
    titre: 'Espaces topologiques'
    resume: |
      Une topologie est une famille de parties, les ouverts, qui contient l'ensemble vide et l'espace entier et qui est stable par réunion quelconque et par intersection finie ; on la décrit souvent par une base, et les boules d'une distance en donnent l'exemple principal. Le chapitre définit les topologies produit et induite, les fermés, l'intérieur, l'adhérence et les voisinages, qui se déduisent des ouverts seuls. Il montre qu'un espace métrisable est séparé et que la limite d'une suite y est unique ; il démontre le critère séquentiel de l'adhérence pour les espaces métrisables et le sens direct de celui de la continuité, dont la réciproque, vraie entre espaces métriques, est seulement affirmée, ces critères étant faux en général. Les applications continues sont celles qui ramènent les ouverts à des ouverts ; les homéomorphismes sont les bijections continues de réciproque continue, et les plongements les homéomorphismes sur leur image. Reconnaître si deux espaces sont homéomorphes est le problème que l'UE se donne.
    sommaire:
      - 'Introduction historique'
      - 'Espaces topologiques'
      - 'Bases d''une topologie'
      - 'Topologie produit, topologie induite'
      - 'Fermés, intérieur, adhérence'
      - 'Suites et séparation'
      - 'Applications continues'
      - 'Homéomorphismes et plongements'
      - 'Bilan'
