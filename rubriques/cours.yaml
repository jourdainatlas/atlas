    niveau: terminale
    chapitre: 4
    titre: Géométrie dans l'espace
    resume: |
      Bases et repères de l'espace, vecteurs coplanaires et produit scalaire ; vecteur normal et équation cartésienne d'un plan, représentation paramétrique d'une droite ; positions relatives de droites et de plans ; projeté orthogonal sur un plan. L'introduction historique va des solides des Anciens à l'espace mis en coordonnées.
    sommaire:
      - Introduction historique
