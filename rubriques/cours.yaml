  - id: ma-02
    niveau: ma
    chapitre: 2
    titre: Applications et relations binaires
    resume: |
      Le chapitre met les ensembles en relation. Il définit une application par son graphe, puis les familles, les suites, les fonctions indicatrices, la restriction et le prolongement. Il étudie ensuite l'image directe et l'image réciproque d'une partie, et montre que l'image réciproque respecte réunion, intersection et complémentaire, alors que l'image directe ne respecte que la réunion. Après la composition viennent les injections, les surjections et les bijections. Le chapitre montre comment l'injectivité ou la surjectivité de $g \circ f$ se transmet à $f$ ou à $g$, et caractérise les bijections par l'existence d'une réciproque. Une section compare les cardinaux d'ensembles finis reliés par une application, puis démontre le théorème de Cantor par l'argument diagonal : aucun ensemble n'est en bijection avec l'ensemble de ses parties. La seconde partie traite des relations binaires. Les classes d'une relation d'équivalence forment une partition, ce qu'illustrent les congruences dans $\mathbb{Z}$ et dans $\mathbb{R}$. Les relations d'ordre, totales ou partielles, sont représentées par des diagrammes de Hasse, avec le vocabulaire des majorants et du plus grand élément.
