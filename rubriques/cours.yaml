    titre: "Applications différentiables"
    resume: |
      La notion centrale du chapitre est la différentielle : l'application linéaire continue $\mathrm{d}f(a)$ qui approche l'accroissement de $f$ à un $o(h)$ près. Le chapitre l'étudie d'abord dans le cas général, avec les applications bilinéaires continues et l'inversion sur le groupe linéaire, puis pour les fonctions d'une variable réelle à valeurs vectorielles, où l'inégalité des accroissements finis remplace l'égalité, qui devient fausse. Les dérivées selon un vecteur et les dérivées partielles sont les valeurs de la différentielle sur des vecteurs particuliers, la matrice jacobienne en est la matrice et le gradient la représente par le produit scalaire. La règle de la chaîne dit que la différentielle d'une composée est la composée des différentielles. Le théorème des accroissements finis s'étend aux ouverts convexes, et une application de différentielle nulle sur un ouvert connexe par arcs est constante. Le chapitre se termine par les applications de classe $\mathcal{C}^{1}$, caractérisées par la continuité de leurs différentielles partielles.
