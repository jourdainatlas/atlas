  - id: l3-sa-06
    niveau: l3
    ue: l3-s5-sa
    chapitre: 6
    titre: "Polynômes symétriques, résultant, discriminant"
    resume: |
      Un polynôme en plusieurs indéterminées est symétrique s'il est invariant par toute permutation des indéterminées. Le chapitre relie les polynômes symétriques élémentaires aux coefficients d'un polynôme scindé (relations entre coefficients et racines) et démontre, par l'ordre lexicographique sur les monômes, le théorème fondamental : tout polynôme symétrique s'écrit de façon unique comme polynôme en les symétriques élémentaires ; une expression symétrique des racines d'un polynôme unitaire s'exprime donc à l'aide de ses coefficients. Il définit ensuite le résultant de deux polynômes comme déterminant de la matrice de Sylvester, montre qu'il s'annule exactement quand les deux polynômes ont un facteur commun, l'exprime à l'aide des racines et s'en sert pour éliminer une indéterminée. Le discriminant, relié au résultant $R(P, P')$, détecte les racines multiples ; pour un polynôme réel de degré $3$, son signe indique le nombre de racines réelles.
