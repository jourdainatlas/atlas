  - id: ma-06
    niveau: ma
    chapitre: 6
    titre: Primitives et équations différentielles linéaires
    resume: |
      Le chapitre définit les primitives d'une fonction sur un intervalle. Il admet l'existence d'une primitive pour toute fonction continue, la construction de l'intégrale étant reportée au chapitre 18, et en déduit la définition de l'intégrale. Le calcul de primitives et d'intégrales passe par les primitives usuelles, les exponentielles complexes pour les fonctions trigonométriques et les fractions $\frac{1}{ax^{2} + bx + c}$, puis par l'intégration par parties et le changement de variable. Pour les équations linéaires du premier ordre, le chapitre résout l'équation homogène et établit la structure des solutions et le principe de superposition. Il cherche ensuite une solution particulière, notamment par variation de la constante, et démontre l'existence et l'unicité de la solution d'un problème de Cauchy. Les équations du second ordre à coefficients constants sont résolues par l'équation caractéristique : solutions complexes, puis solutions réelles lorsque les coefficients sont réels. Viennent ensuite les seconds membres usuels et le problème de Cauchy.
