  - id: l3-pr-10
    niveau: l3
    ue: l3-s6-pr
    chapitre: 10
    titre: "Vecteurs gaussiens"
    resume: |
      Le chapitre part de la loi normale réelle et de sa fonction caractéristique. Un vecteur aléatoire est gaussien si toutes les combinaisons linéaires de ses composantes suivent des lois normales ; le chapitre introduit la fonction caractéristique d'un vecteur aléatoire, qui caractérise sa loi ; la loi $\mathcal{N}(m, \Gamma)$ d'un vecteur gaussien est déterminée par son espérance et sa matrice de covariance, et c'est l'image d'un vecteur normal standard par une application affine. Pour les composantes d'un vecteur gaussien, non-corrélation et indépendance coïncident, et le vecteur a une densité quand sa matrice de covariance est inversible. Le théorème de Cochran décrit les projections sur des sous-espaces orthogonaux ; il donne les lois du khi-deux et de Student, l'indépendance de la moyenne et de la variance empiriques d'un échantillon gaussien et l'intervalle de confiance de Student. Le chapitre se termine par le théorème central limite vectoriel.
