    pages: 7
    exercices: f-p-01
    statut: depose
  - id: p-02
    niveau: premiere
    chapitre: 2
    titre: Notion de suite
    resume: |
      Les suites numériques, définies de manière explicite ou par récurrence, et leur sens de variation. Le chapitre étudie les suites arithmétiques et géométriques, leurs formules explicites, puis le calcul des sommes de termes consécutifs.
    sommaire:
