  - id: l3-pr-05
    niveau: l3
    ue: l3-s6-pr
    chapitre: 5
    titre: "Vecteurs aléatoires discrets, covariance"
    resume: |
      La loi d'un vecteur aléatoire discret est donnée par les probabilités conjointes de ses composantes ; elle détermine les lois marginales, mais n'est pas déterminée par elles, sauf dans le cas indépendant où elle en est le produit. Le chapitre calcule la loi d'une fonction d'un vecteur, en particulier celle d'une somme, puis définit la covariance, forme bilinéaire symétrique positive, établit l'inégalité de Cauchy-Schwarz et la variance d'une somme. Le coefficient de corrélation mesure la part affine du lien entre deux variables et donne la pente de la droite de régression ; deux variables indépendantes sont non corrélées, mais la réciproque est fausse.
