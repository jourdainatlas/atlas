  - id: l3-gd-01
    niveau: l3
    ue: l3-s6-gd
    chapitre: 1
    titre: 'Courbes de $\mathbb{R}^{n}$'
    resume: |
      Une courbe est un arc géométrique, classe de paramétrages modulo les changements de paramètre $C^{k}$ ; l'orientation est conservée quand le changement est croissant. Le chapitre définit les arcs réguliers et biréguliers, la tangente et le plan osculateur, et montre qu'un arc est plan si et seulement si son plan osculateur est constant. La longueur, intégrale de la norme de la vitesse, est la borne supérieure des longueurs des lignes polygonales inscrites ; le paramétrage par longueur d'arc, unique à un signe et une constante près, rend la vitesse unitaire et l'accélération orthogonale à la vitesse. La courbure, son cercle osculateur et sa formule pour un paramétrage quelconque sont invariants par isométrie. Dans le plan, la courbure algébrique détermine la courbe à un déplacement près ; dans l'espace, le repère de Frenet introduit la torsion, nulle exactement pour les arcs plans, et le couple courbure-torsion détermine la courbe à un déplacement près.
    sommaire:
      - 'Introduction historique'
