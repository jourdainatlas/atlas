    chapitre: 8
    titre: "Convergence de variables aléatoires"
    resume: |
      Le chapitre établit les inégalités de Markov et de Bienaymé-Tchebychev, qui majorent la probabilité d'un écart par un moment, et l'inégalité de Jensen pour une fonction convexe. Il définit les limites supérieure et inférieure d'une suite d'évènements et démontre le lemme de Borel-Cantelli, qui décide si une suite d'évènements se réalise infiniment souvent. Il introduit quatre modes de convergence d'une suite de variables aléatoires (presque sûre, dans $L^{p}$, en probabilité, en loi), caractérise la convergence en loi par les fonctions continues bornées et par les fonctions caractéristiques (théorème de Lévy), établit les implications entre ces modes et les illustre sur $[0, 1]$ par des contre-exemples.
