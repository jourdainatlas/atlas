  - id: l3-hf-06
    niveau: l3
    ue: l3-s6-hf
    chapitre: 6
    titre: 'Convergence ponctuelle des séries de Fourier'
    resume: |
      Les sommes partielles de Fourier sont les convolées de la fonction par le noyau de Dirichlet, qui n'est pas positif et dont la norme $L^{1}$ tend vers l'infini. Le chapitre en déduit, par condensation des singularités, une fonction continue dont la série de Fourier diverge en un point. Les moyennes de Fejér, convolées par un noyau positif, convergent uniformément vers toute fonction continue. Le lemme de Riemann-Lebesgue montre que les coefficients d'une fonction intégrable tendent vers $0$, et ils déterminent la fonction presque partout ; si leur série converge absolument, en particulier pour une fonction de classe $\mathcal{C}^{1}$, la série de Fourier converge vers la fonction. Le théorème de Dirichlet donne la convergence en un point où la fonction est assez régulière. Le chapitre étend enfin ces résultats aux fonctions de plusieurs variables.
