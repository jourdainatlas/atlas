  - id: me-01
    niveau: expertes
    chapitre: 1
    titre: Divisibilité et primalité
    resume: |
      La divisibilité dans ℤ et ses règles de calcul, puis la division euclidienne, démontrée en existence et en unicité à partir de la partie entière. Le chapitre établit ensuite que tout entier au moins égal à 2 admet un diviseur premier, l'infinitude des nombres premiers, le lemme d'Euclide et le théorème fondamental de l'arithmétique, avec le nombre de diviseurs qui s'en déduit. L'introduction historique va des *Éléments* d'Euclide au petit et au grand théorème de Fermat.
    sommaire:
      - Introduction historique
