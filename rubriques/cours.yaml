  - id: l3-in-08
    niveau: l3
    ue: l3-s5-int
    chapitre: 8
    titre: "Les espaces $L^{p}$"
    resume: |
      Les espaces $L^{p}$ sont les espaces de classes de fonctions dont la puissance $p$-ième du module est intégrable, complétés par l'espace $L^{\infty}$ des fonctions essentiellement bornées. Les inégalités de Young, de Hölder et de Minkowski en font des espaces normés, et le théorème de Riesz-Fischer des espaces de Banach, avec une sous-suite qui converge presque partout. Le chapitre étudie les inclusions entre ces espaces, selon que la mesure est finie ou que l'on travaille sur des suites, la densité des fonctions étagées et l'inégalité de Minkowski intégrale. Pour $p = 2$, le produit scalaire et la projection orthogonale représentent les formes linéaires continues ; ils conduisent au théorème de Radon-Nikodym, puis à l'identification du dual de $L^{p}$ à $L^{q}$ pour $1 \leqslant p < \infty$ et une mesure $\sigma$-finie, qui tombe en défaut pour $p = \infty$.
