    chapitre: 1
    titre: "Espaces normés : rappels et compléments"
    resume: |
      Le chapitre fixe le cadre de toute l'UE : un espace vectoriel normé, le plus souvent complet. Il reprend la topologie des espaces normés (ouverts, fermés, intérieur, adhérence, frontière, normes équivalentes), la continuité, y compris uniforme et lipschitzienne, et la compacité séquentielle : théorème de Bolzano-Weierstrass, compacts de $\mathbb{K}^{p}$, bornes atteintes et théorème de Heine. En dimension finie, toutes les normes sont équivalentes et l'espace est complet ; le théorème de Riesz montre qu'en dimension infinie la boule unité fermée n'est jamais compacte. Les espaces de Banach sont étudiés à travers leurs exemples, fonctions bornées, fonctions continues sur un compact pour la norme uniforme, applications linéaires continues, et la convergence des séries absolument convergentes. Le chapitre caractérise les applications linéaires continues, définit la norme subordonnée et calcule les normes matricielles usuelles, puis établit la série de Neumann et l'ouverture du groupe linéaire. Il se termine par le théorème du point fixe de Banach, qui servira aux chapitres 3 et 6.
