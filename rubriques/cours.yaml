  - id: mp-01
    niveau: mp
    chapitre: 1
    titre: Structures algébriques usuelles
    resume: |
      Le chapitre complète l'étude des groupes et des anneaux de première année autour d'une seule idée : la partie engendrée par un élément. Il définit le sous-groupe engendré par une partie, construit le groupe $\mathbb{Z}/n\mathbb{Z}$ et ses générateurs, les classes $\bar{k}$ avec $k \wedge n = 1$, puis montre que tout groupe monogène est isomorphe à $\mathbb{Z}$ ou à un $\mathbb{Z}/n\mathbb{Z}$. L'ordre d'un élément est défini et caractérisé, et le théorème de Lagrange, démontré par les classes à gauche, donne que l'ordre d'un élément d'un groupe fini divise le cardinal du groupe. Du côté des anneaux, le chapitre traite le produit fini d'anneaux, les idéaux d'un anneau commutatif et l'idéal engendré par un élément, qui traduit la divisibilité dans un anneau intègre, puis détermine les idéaux de $\mathbb{Z}$, tous de la forme $n\mathbb{Z}$, ce qui redonne le PGCD et la relation de Bézout d'une famille finie d'entiers. L'anneau $\mathbb{Z}/n\mathbb{Z}$ est ensuite étudié en détail : ses inversibles, le fait qu'il soit un corps exactement lorsque $n$ est premier, le calcul d'un inverse par l'algorithme d'Euclide étendu, le théorème chinois avec la résolution d'un système de congruences, l'indicatrice d'Euler, son calcul à partir de la décomposition en facteurs premiers, et le théorème d'Euler, qui généralise le petit théorème de Fermat. Le même schéma s'applique à l'anneau $\mathbb{K}[X]$, dont les idéaux sont principaux : PGCD d'une famille de polynômes, polynômes irréductibles et décomposition en facteurs irréductibles. Le chapitre se termine par la notion d'algèbre, qui réunit les structures d'espace vectoriel et d'anneau de $\mathbb{K}[X]$, $\mathcal{L}(E)$ et $\mathcal{M}_{n}(\mathbb{K})$, avec les sous-algèbres et les morphismes d'algèbres.
    sommaire:
