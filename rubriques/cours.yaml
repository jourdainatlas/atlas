  - id: ma-11
    niveau: ma
    chapitre: 11
    titre: Structures algébriques usuelles
    resume: |
      Le chapitre définit les lois de composition interne, l'élément neutre, les éléments inversibles, la distributivité et les parties stables. Il étudie ensuite les groupes : définition, règles de calcul dans un groupe, groupe des permutations d'un ensemble, groupe produit, sous-groupes et leur caractérisation. Viennent ensuite les morphismes de groupes, leur noyau et leur image, la caractérisation de l'injectivité par le noyau, et les isomorphismes. La dernière partie traite des anneaux, du groupe de leurs inversibles, des anneaux intègres et des corps. Elle établit la factorisation de $a^{n} - b^{n}$ et la formule du binôme dans un anneau, puis étudie les sous-anneaux et les morphismes d'anneaux. Le bilan range les structures de la plus pauvre à la plus riche.
