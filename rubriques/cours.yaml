  - id: mp-05
    niveau: mp
    chapitre: 5
    titre: Continuité, compacité, connexité par arcs
    resume: |
      Le chapitre étend aux espaces vectoriels normés les théorèmes de continuité de première année, en dégageant les trois notions qui les font fonctionner. Il définit la limite et la continuité d'une application entre espaces vectoriels normés, avec la caractérisation séquentielle, les opérations, l'image réciproque d'un ouvert ou d'un fermé par une application continue, la continuité uniforme et les applications lipschitziennes, dont la distance à une partie. Pour les applications linéaires, la continuité équivaut à une majoration $\|u(x)\| \leqslant C\|x\|$ ; elle définit la norme subordonnée, sa sous-multiplicativité et son adaptation aux matrices, puis la continuité des applications multilinéaires. Les parties compactes sont définies par la propriété de Bolzano-Weierstrass : un compact est fermé et borné, un fermé d'un compact est compact, et un produit de compacts est compact. Sur un compact, une fonction continue à valeurs réelles est bornée et atteint ses bornes, et une fonction continue est uniformément continue (théorème de Heine). En dimension finie, toutes les normes sont équivalentes, ce qui entraîne que les compacts sont les fermés bornés, que toute application linéaire est continue et que les fonctions polynomiales en les coordonnées sont continues ; le chapitre en tire une démonstration du théorème de d'Alembert-Gauss. Le chapitre se termine par la connexité par arcs : chemins, composantes connexes par arcs, parties convexes et étoilées, description des parties connexes par arcs de $\mathbb{R}$ comme ses intervalles, et image continue d'une partie connexe par arcs, qui généralise le théorème des valeurs intermédiaires.
    sommaire:
