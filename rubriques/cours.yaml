  - id: l3-cd-03
    niveau: l3
    ue: l3-s5-cd
    chapitre: 3
    titre: "Inversion locale, fonctions implicites"
    resume: |
      Le fil du chapitre est la résolution d'équations par linéarisation. La méthode de Newton remplace l'équation $f(x) = 0$ par l'équation affine tangente et converge de façon quadratique quand la différentielle est inversible en la solution ; la méthode de Héron pour $\sqrt{a}$ en est le premier exemple. En figeant la différentielle, on obtient une contraction, et le théorème du point fixe du chapitre 1 démontre le théorème d'inversion locale : une application de classe $\mathcal{C}^{1}$ dont la différentielle en $a$ est un isomorphisme est un $\mathcal{C}^{1}$-difféomorphisme d'un voisinage de $a$ sur un voisinage de $f(a)$, et une version globale s'en déduit sous une hypothèse d'injectivité. Le théorème des fonctions implicites en est une reformulation : l'équation $F(x, y) = 0$ définit localement $y$ comme fonction de $x$ quand $\partial_{y}F$ est inversible. Le chapitre se termine par les hypersurfaces $\{g = 0\}$, qui, près d'un point régulier, sont des graphes ayant un hyperplan tangent orthogonal au gradient.
    sommaire:
      - "Introduction historique"
      - "La méthode de Newton"
