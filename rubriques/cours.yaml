  - id: m-galois
    niveau: master
    titre: Théorie de Galois
    resume: |
      Le cours mène des groupes de permutations à l'impossibilité d'une formule par radicaux pour l'équation générale du cinquième degré. Il ne suppose que l'arithmétique élémentaire et le maniement des polynômes. Les deux premiers chapitres construisent l'outillage des groupes finis : sous-groupes, morphismes, groupe symétrique et théorème de Lagrange, puis sous-groupes distingués, quotients, théorèmes d'isomorphisme, actions de groupes, groupes résolubles et simplicité de $\mathfrak{A}_{n}$ pour $n \geqslant 5$. Les chapitres 3 à 5 construisent celui des corps : anneaux et idéaux, caractéristique, anneau $K[X]$ et critères d'irréductibilité, corps de rupture, degré d'une extension, polynôme minimal, corps de décomposition, constructions à la règle et au compas, séparabilité, extensions normales, corps finis et théorème de l'élément primitif. Le chapitre 6 établit la correspondance de Galois, par le théorème d'Artin, et la traite sur trois exemples complets. Le chapitre 7 en tire le critère de résolubilité par radicaux, le théorème d'Abel-Ruffini, la classification de Gauss-Wantzel des polygones réguliers constructibles et une démonstration algébrique du théorème fondamental de l'algèbre. Deux résultats seulement sont admis : l'existence de la clôture algébrique et la transcendance de $\pi$. Les épigraphes sont tirées des écrits de Galois.
    sommaire:
      - Groupes
      - Quotients, actions et groupes résolubles
      - Anneaux, corps et polynômes
      - Extensions de corps
      - Séparabilité, normalité et corps finis
      - La correspondance de Galois
      - Résolubilité par radicaux et applications
    sommaire_pages: [2, 13, 27, 36, 44, 50, 57]
    theories: [a-groupe, a-distingue, a-quotient, a-ideal, pol-irreductibles, pol-derivee, z-polynomes, gs-extensions, gs-algebriques, gs-decomposition, gs-separabilite, gs-corps-finis, gs-artin, gs-galoisiennes, gs-correspondance, gs-radicaux, gs-abel-ruffini, galois-cyclotomie, galois]
    notions: [groupe-symetrique, sous-groupe-distingue, groupe-quotient, action-groupe, groupe-resoluble, polynome-irreductible, extension-corps, polynome-minimal, corps-decomposition, polynome-separable, corps-fini, element-primitif, extension-galoisienne, groupe-galois, polynome-cyclotomique, point-constructible]
