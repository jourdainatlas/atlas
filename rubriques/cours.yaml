    notions: [suite]
    liens: [t-01]
    pdf: documents/cours/premiere/chap02_suites.pdf
    pages: 7
    exercices: f-p-02
    statut: depose
  - id: p-03
    niveau: premiere
    chapitre: 3
    titre: Géométrie cartésienne
    resume: |
      Le calcul vectoriel dans un repère du plan, puis la colinéarité de deux vecteurs et son critère par le déterminant. Le chapitre en tire les équations cartésiennes de droites, le vecteur directeur, l'équation réduite et les positions relatives de deux droites. L'introduction historique montre comment la physique et le mouvement ont rapproché l'algèbre et la géométrie depuis Descartes.
    sommaire:
      - Introduction historique
      - Vecteurs
      - Équations de droite
    theories: [v-espace, v-libre, v-determinant, alglin]
    notions: [espace-vectoriel, famille-libre]
    liens: [p-07, t-04]
    pdf: documents/cours/premiere/chap03_geometrie_cartesienne.pdf
    pages: 6
    exercices: f-p-03
    statut: depose
  - id: p-04
    niveau: premiere
    chapitre: 4
    titre: Dérivation
    resume: |
      Le taux de variation, le nombre dérivé et la fonction dérivée, les dérivées des fonctions usuelles (puissances, inverse, racine carrée) et les opérations sur les dérivées : somme, produit, quotient et composition. Le chapitre établit l'équation de la tangente, puis le lien entre le signe de la dérivée, le sens de variation et les extrema. L'introduction historique va des indivisibles au calcul infinitésimal de Newton et de Leibniz.
    sommaire:
