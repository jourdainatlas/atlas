  - id: ma-21
    niveau: ma
    chapitre: 21
    titre: Dénombrement et probabilités
    resume: |
      Le chapitre commence par le dénombrement : ensembles finis et cardinal, cardinal d'une réunion et formule du crible, d'un produit, de l'ensemble des applications et des parties, listes d'éléments distincts, arrangements et permutations, parties à $p$ éléments et démonstration combinatoire de la formule du binôme. Il définit ensuite les espaces probabilisés finis : univers, événements, probabilité, qui est déterminée par les probabilités des événements élémentaires, et probabilité uniforme. Il étudie les probabilités conditionnelles, avec la formule des probabilités composées, celle des probabilités totales et la formule de Bayes, puis l'indépendance de deux ou de plusieurs événements. Viennent les variables aléatoires sur un univers fini et leurs lois, dont les lois uniforme, de Bernoulli et binomiale, les couples, lois conjointes et marginales, l'indépendance des variables et le lemme des coalitions, avec la loi binomiale comme somme de variables de Bernoulli indépendantes. La suite traite l'espérance, sa linéarité et la formule de transfert, puis la variance, l'écart type, la covariance, l'inégalité de Cauchy-Schwarz et la variance d'une somme. La dernière partie démontre les inégalités de Markov et de Bienaymé-Tchebychev, puis la loi faible des grands nombres.
