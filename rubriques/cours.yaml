  - id: t-05
    niveau: terminale
    chapitre: 5
    titre: Fonctions exponentielle et logarithme
    resume: |
      Limites et croissances comparées de l'exponentielle ; le logarithme népérien, ses propriétés algébriques et son étude ; exponentielles de base $a$ et logarithme décimal. L'introduction historique part des logarithmes, outil de calcul, et arrive au nombre $\mathrm e$ d'Euler.
    sommaire:
