# Vocabulaire de thèmes du moteur de recherche des annales.
# Chaque thème : id, titre (affiché), domaine, synonymes (formes que l'utilisateur peut taper),
# parent (thèmes fins) : thème large qui les regroupe ; chercher le thème large renvoie aussi ses thèmes fins.
# noeuds : théories ou nœuds de l'édifice sur lesquels le thème repose (vérifiés à la construction).
# Les sujets sont étiquetés partie par partie avec ces id (rubriques/annales/AAAA.yaml).

domaines:
  - {id: algebre, titre: "Algèbre"}
  - {id: alglin, titre: "Algèbre linéaire et bilinéaire"}
  - {id: arith, titre: "Arithmétique"}
  - {id: analyse, titre: "Analyse réelle"}
  - {id: series, titre: "Séries de fonctions et analyse complexe"}
  - {id: differentiel, titre: "Calcul différentiel et équations différentielles"}
  - {id: fonctionnelle, titre: "Analyse fonctionnelle et mesure"}
  - {id: proba, titre: "Probabilités"}
  - {id: geometrie, titre: "Géométrie et topologie"}
  - {id: numerique, titre: "Analyse numérique et combinatoire"}

