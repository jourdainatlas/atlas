# Vocabulaire de thèmes du moteur de recherche des annales.
# Chaque thème : id, titre (affiché), domaine, synonymes (formes que l'utilisateur peut taper),
# parent (thèmes fins) : thème large qui les regroupe ; chercher le thème large renvoie aussi ses thèmes fins.
# noeuds : théories ou nœuds de l'édifice sur lesquels le thème repose (vérifiés à la construction).
# Les sujets sont étiquetés partie par partie avec ces id (rubriques/annales/AAAA.yaml).

domaines:
  - {id: algebre, titre: "Algèbre", famille: alg}
  - {id: alglin, titre: "Algèbre linéaire et bilinéaire", famille: alg}
  - {id: arith, titre: "Arithmétique", famille: nb}
  - {id: analyse, titre: "Analyse réelle", famille: ana}
  - {id: series, titre: "Séries de fonctions et analyse complexe", famille: ana}
  - {id: differentiel, titre: "Calcul différentiel et équations différentielles", famille: ana}
  - {id: fonctionnelle, titre: "Analyse fonctionnelle et mesure", famille: ana}
  - {id: proba, titre: "Probabilités", famille: ana}
  - {id: geometrie, titre: "Géométrie et topologie", famille: geo}
  - {id: numerique, titre: "Analyse numérique et combinatoire", famille: nb}
  - {id: ly-suites-limites, titre: "Suites et limites", famille: ana, vocabulaire: lycee}
  - {id: ly-fonctions, titre: "Fonctions", famille: ana, vocabulaire: lycee}
  - {id: ly-probas, titre: "Probabilités et statistiques", famille: ana, vocabulaire: lycee}
  - {id: ly-geometrie, titre: "Géométrie et nombres complexes", famille: geo, vocabulaire: lycee}
  - {id: ly-arith-algo, titre: "Arithmétique, matrices, algorithmique", famille: nb, vocabulaire: lycee}

