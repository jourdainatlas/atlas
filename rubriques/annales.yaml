# Rubrique « Annales » — PROTOTYPE.
# Organisation : familles de concours → concours → épreuves écrites ; chaque sujet est rangé par
# année (et par filière pour les écoles d'ingénieurs). Aucun sujet n'est encore déposé.
# Un sujet déposé prendra la forme :
#   - concours: mines-ponts, filiere: MP, annee: 2026, epreuve: Maths 1,
#     sujet: annales/…pdf, corrige: …, rapport: … (ou lien externe), theories: [...], exercices: [...]

intro: |
  Les sujets d'écrit des concours d'écoles d'ingénieurs et des concours de recrutement de l'enseignement, rangés par concours, par année et par épreuve. Chaque sujet, une fois déposé, sera accompagné quand c'est possible de son corrigé et du rapport du jury, et indexé par les théories de l'atlas qu'il met en jeu.

familles:
  - id: ingenieurs
    titre: Écoles d'ingénieurs
    filieres: [MP, MPI, PC, PSI]
    annees: [2026, 2025, 2024, 2023, 2022, 2021]
    concours:
      - id: x-ens
        titre: X-ENS
        epreuves: [Maths A, Maths B]
      - id: mines-ponts
        titre: Mines-Ponts
        epreuves: [Maths 1, Maths 2]
      - id: centrale
        titre: Centrale-Supélec
        epreuves: [Maths 1, Maths 2]
      - id: ccinp
        titre: CCINP
        epreuves: [Mathématiques]
      - id: e3a
        titre: e3a-Polytech
        epreuves: [Mathématiques]
  - id: enseignement
    titre: Enseignement
    annees: [2026, 2025, 2024, 2023, 2022, 2021]
    concours:
      - id: capes
        titre: CAPES externe
        epreuves: [Écrit disciplinaire, Écrit disciplinaire appliqué]
      - id: agreg-ext
        titre: Agrégation externe
        epreuves: [Mathématiques générales, Analyse et probabilités]
      - id: agreg-int
        titre: Agrégation interne
        epreuves: [Épreuve 1, Épreuve 2]

sujets: []
