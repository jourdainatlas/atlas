# Rubrique « Annales ».
# Organisation : familles de concours → concours → épreuves écrites (par filière si elles diffèrent).
# Chaque sujet renvoie au PDF tel qu'il est hébergé sur le site officiel du concours.
# Exceptions décidées au cas par cas, signalées par un champ  source: {nom, url}  affiché sous la case :
#   - Mines-Ponts 2021 à 2025 : PDF extraits de l'archive officielle de l'année et hébergés sur ATLAS (documents/annales/) ;
#   - Agrégation interne 2011-2019 : site du jury interne.agreg.org.
#   - X-ENS : sujets C, D et PSI pris sur ens.psl.eu ou ens-paris-saclay.fr ; seuls Maths C et D 2025 (publiés officiellement
#     sur banques-ecoles.fr, injoignable depuis l'outil de vérification) restent pris sur vmaths.fr.
#   - concours: <id>, filiere: <MP|MPI|PC|PSI> (écoles d'ingénieurs), annee: 2025, epreuve: <libellé exact>,
#     sujet: <URL officielle du PDF>, rapport: <URL officielle du rapport du jury>,
#     ou bien  attente: <raison>  quand aucun PDF officiel individuel n'est disponible.

accroche: Les sujets d'écrit de mathématiques du baccalauréat, des concours d'ingénieurs et de l'enseignement depuis 2011, et un moteur de recherche par thème.
intro: |
  Les sujets d'écrit de mathématiques des concours d'écoles d'ingénieurs (X-ENS, Mines-Ponts, Centrale, CCINP, e3a) et des concours de recrutement de l'enseignement (CAPES, agrégations), de 2011 à aujourd'hui, avec les rapports du jury ; et ceux du baccalauréat général, avec leurs corrigés : la Terminale (série S jusqu'en 2020, spécialité mathématiques depuis 2021), et l'épreuve anticipée de Première pour les élèves de spécialité, créée en 2026.

  La page offre deux entrées. La grille range les sujets par concours, par filière et par année : chaque case ouvre le PDF tel qu'il est publié sur le site officiel, ou indique sa provenance quand il n'y est pas accessible individuellement. Sous la grille, un moteur de recherche part d'une notion, « séries entières », « théorème spectral », « loi de Poisson », et renvoie les parties de sujets qui la travaillent, avec un lien qui ouvre le sujet à la bonne page. Chaque sujet y a été lu en entier et découpé en parties, étiquetées par des thèmes rattachés aux théories de l'édifice ; un thème large se précise en thèmes fins, et la recherche se restreint par concours, filière ou période.

familles:
  - id: ingenieurs
    titre: Écoles d'ingénieurs
    filieres: [MP, MPI, PC, PSI]
    debut: {MPI: 2023}   # la filière MPI recrute à partir de la session 2023
    annees: [2026, 2025, 2024, 2023, 2022, 2021, 2020, 2019, 2018, 2017, 2016, 2015, 2014, 2013, 2012, 2011]
    concours:
      - id: x-ens
        titre: X-ENS
        epreuves:
          MP: [Maths A, Maths B, Maths C, Maths D]
          MPI: [Maths A, Maths B, Maths C]
          PC: [Maths]
          PSI: [Maths]
      - id: mines-ponts
        titre: Mines-Ponts
        epreuves: [Maths 1, Maths 2]
      - id: centrale
        titre: Centrale-Supélec
        epreuves: [Maths 1, Maths 2]
      - id: ccinp
        titre: CCINP
        epreuves:
          MP: [Maths 1, Maths 2]
          MPI: [Maths 1, Maths 2]
          PC: [Mathématiques, {nom: Maths 2, annees: [2011, 2012, 2013, 2014]}]    # CCP 2011-2014 : deux épreuves, « Mathématiques » = Maths 1
          PSI: [Mathématiques, {nom: Maths 2, annees: [2011, 2012, 2013, 2014]}]
      - id: e3a
        titre: e3a-Polytech
        epreuves: [Mathématiques, {nom: Maths 2, annees: [2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019]}]   # jusqu'en 2019 : deux épreuves, « Mathématiques » = Maths 1 (ou A)
  - id: enseignement
    titre: Enseignement
    annees: [2026, 2025, 2024, 2023, 2022, 2021, 2020, 2019, 2018, 2017, 2016, 2015, 2014, 2013, 2012, 2011]
    concours:
      - id: capes
        titre: CAPES externe
        epreuves: [Écrit disciplinaire, Écrit disciplinaire appliqué]
      - id: capes-bac3
        titre: CAPES externe bac+3
        debut: 2026
        epreuves: [Épreuve 1, Épreuve 2]
      - id: agreg-ext
        titre: Agrégation externe
        epreuves: [Mathématiques générales, Analyse et probabilités]
      - id: agreg-int
        titre: Agrégation interne
        epreuves: [Épreuve 1, Épreuve 2]

  - id: bac
    titre: Baccalauréat
    filieres: [Terminale, Première]
    nom_filiere: niveau          # libellés du moteur : « Tous niveaux », « Tous les centres »
    vocabulaire: lycee           # thèmes du moteur : vocabulaire du lycée (annales-themes.yaml, domaines « vocabulaire: lycee »)
    nom_concours: Centre
    prefixe: Bac                 # titre des pages de lecture : « Bac Métropole Terminale 2024 — Jour 1 »
    tous_concours: Tous les centres
    # Première : épreuve anticipée de mathématiques, créée à la session 2026 (seuls les sujets de spécialité sont repris).
    annees_filiere: {Première: [2026]}
    annees: [2026, 2025, 2024, 2023, 2022, 2021, 2020, 2019, 2018, 2017, 2016, 2015, 2014, 2013, 2012, 2011]
    # Les cases d'une année sont les sujets publiés (pas une case par épreuve déclarée) ; le sigle vient de « court ».
    cases_sujets: true
    lignes_repliables: true      # chaque centre se déplie par le bouton « + » de sa ligne (fermé par défaut)
    corriges: true
    # Tous les sujets et corrigés viennent des annales de l'APMEP ; la source est donc indiquée une fois, par filière.
    sources:
      Terminale: {nom: APMEP, url: "https://www.apmep.fr/Annales-Terminale-Generale"}
      Première: {nom: APMEP, url: "https://www.apmep.fr/Annales-Premiere-Generale-Technologique"}
    concours:
      - id: bac-metropole
        titre: Métropole
        epreuves: &ep_bac {Terminale: [{nom: Session normale, court: N}, {nom: Remplacement, court: R}, {nom: Sujet unique, court: U}, {nom: Jour 1, court: "1"}, {nom: Jour 2, court: "2"}, {nom: Jour 1 (secours), court: S1}, {nom: Jour 2 (secours), court: S2}, {nom: Jour 1 (remplacement), court: R1}, {nom: Jour 2 (remplacement), court: R2}], Première: [{nom: Session normale, court: N}, {nom: Secours, court: S}, {nom: Remplacement, court: R}]}
      - id: bac-antilles-guyane
        titre: Antilles-Guyane
        epreuves: *ep_bac
      - id: bac-la-reunion
        titre: La Réunion
        epreuves: *ep_bac
      - id: bac-amerique-nord
        titre: Amérique du Nord
        epreuves: *ep_bac
      - id: bac-amerique-sud
        titre: Amérique du Sud
        epreuves: *ep_bac
      - id: bac-asie
        titre: Asie
        epreuves: *ep_bac
      - id: bac-centres-etrangers
        titre: Centres étrangers
        epreuves: *ep_bac
      - id: bac-centres-etrangers-2
        titre: Centres étrangers, autre groupe
        epreuves: *ep_bac
      - id: bac-liban
        titre: Liban
        epreuves: *ep_bac
      - id: bac-pondichery
        titre: Pondichéry
        epreuves: *ep_bac
      - id: bac-polynesie
        titre: Polynésie
        epreuves: *ep_bac
      - id: bac-nouvelle-caledonie
        titre: Nouvelle-Calédonie
        epreuves: *ep_bac
      - id: bac-entrainement
        titre: Sujets zéro et inédits
        # sujets zéro officiels, et les deux sujets prévus le 15 mars 2021 (épreuves annulées en janvier 2021, sujets publiés)
        epreuves: {Terminale: [{nom: Sujet zéro, court: "0"}, {nom: Exercices zéro, court: "0"}, {nom: Sujet 1 du 15 mars, court: M1}, {nom: Sujet 2 du 15 mars, court: M2}], Première: [{nom: Sujet zéro 1, court: Z1}, {nom: Sujet zéro 2, court: Z2}]}

