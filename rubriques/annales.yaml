# Rubrique « Annales ».
# Organisation : familles de concours → concours → épreuves écrites (par filière si elles diffèrent).
# Chaque sujet renvoie au PDF tel qu'il est hébergé sur le site officiel du concours.
# Exceptions décidées au cas par cas, signalées par un champ  source: {nom, url}  affiché sous la case :
#   - Mines-Ponts 2025 : PDF extraits de l'archive officielle SUJETS-2025.zip et hébergés sur ATLAS (documents/annales/) ;
#   - X-ENS 2025 (Maths C, Maths D, PSI) : PDF hébergés sur vmaths.fr (site de M. Le Gruiec).
#   - concours: <id>, filiere: <MP|MPI|PC|PSI> (écoles d'ingénieurs), annee: 2025, epreuve: <libellé exact>,
#     sujet: <URL officielle du PDF>, rapport: <URL officielle du rapport du jury>,
#     ou bien  attente: <raison>  quand aucun PDF officiel individuel n'est disponible.

intro: |
  Les sujets d'écrit de mathématiques des concours d'écoles d'ingénieurs et des concours de recrutement de l'enseignement, rangés par concours, par année et par épreuve. Chaque case ouvre le sujet tel qu'il est publié sur le site officiel du concours ; lorsqu'il n'y est pas accessible individuellement, la provenance du PDF est indiquée sous la case. Le rapport du jury est donné en lien quand il existe.

familles:
  - id: ingenieurs
    titre: Écoles d'ingénieurs
    filieres: [MP, MPI, PC, PSI]
    annees: [2026, 2025, 2024, 2023, 2022, 2021]
    concours:
      - id: x-ens
        titre: X-ENS
        epreuves:
          MP: [Maths A, Maths B, Maths C, Maths D]
          MPI: [Maths A, Maths B, Maths C]
          PC: [Maths]
          PSI: [Maths]
      - id: mines-ponts
        titre: Mines-Ponts
        epreuves: [Maths 1, Maths 2]
      - id: centrale
        titre: Centrale-Supélec
        epreuves: [Maths 1, Maths 2]
      - id: ccinp
        titre: CCINP
        epreuves:
          MP: [Maths 1, Maths 2]
          MPI: [Maths 1, Maths 2]
          PC: [Mathématiques]
          PSI: [Mathématiques]
      - id: e3a
        titre: e3a-Polytech
        epreuves: [Mathématiques]
  - id: enseignement
    titre: Enseignement
    annees: [2026, 2025, 2024, 2023, 2022, 2021]
    concours:
      - id: capes
        titre: CAPES externe
        epreuves: [Écrit disciplinaire, Écrit disciplinaire appliqué]
      - id: capes-bac3
        titre: CAPES externe bac+3
        epreuves: [Épreuve 1, Épreuve 2]
      - id: agreg-ext
        titre: Agrégation externe
        epreuves: [Mathématiques générales, Analyse et probabilités]
      - id: agreg-int
        titre: Agrégation interne
        epreuves: [Épreuve 1, Épreuve 2]

