- id: "ap-07-01"
  feuille: "f-ap-07"
  numero: 1
  partie: "Applications linéaires"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [applications linéaires]
  noeuds: [v-applications]
  notions: [application-lineaire]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Les applications suivantes sont-elles linéaires ? Justifier, en exhibant un contre-exemple le cas échéant.

    **1.** $\begin{array}{r|ccl} f : & \mathbb{R}^{2} & \longrightarrow & \mathbb{R}^{2} \\ & (x\,;y) & \longmapsto & (2x-y \,;\, x+3y) \end{array}$

    **2.** $\begin{array}{r|ccl} f : & \mathbb{R}^{2} & \longrightarrow & \mathbb{R}^{2} \\ & (x\,;y) & \longmapsto & (x+1 \,;\, y) \end{array}$

    **3.** $\begin{array}{r|ccl} f : & \mathbb{R}^{2} & \longrightarrow & \mathbb{R} \\ & (x\,;y) & \longmapsto & xy \end{array}$

    **4.** $\begin{array}{r|ccl} f : & \mathbb{R}^{3} & \longrightarrow & \mathbb{R}^{2} \\ & (x\,;y\,;z) & \longmapsto & (x-y \,;\, y-z) \end{array}$

    **5.** $\begin{array}{r|ccl} f : & \mathbb{R}^{2} & \longrightarrow & \mathbb{R}^{2} \\ & (x\,;y) & \longmapsto & \big(x^{2} \,;\, y\big) \end{array}$

    **6.** $\begin{array}{r|ccl} f : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & |x| \end{array}$

    **7.** $\begin{array}{r|ccl} f : & \mathcal{F}(\mathbb{R}\,;\mathbb{R}) & \longrightarrow & \mathbb{R} \\ & g & \longmapsto & g(0) \end{array}$

    **8.** $\begin{array}{r|ccl} f : & \mathcal{D}(\mathbb{R}\,;\mathbb{R}) & \longrightarrow & \mathcal{F}(\mathbb{R}\,;\mathbb{R}) \\ & g & \longmapsto & g' \end{array}$

    **9.** $\begin{array}{r|ccl} f : & \mathcal{S}(\mathbb{R}) & \longrightarrow & \mathcal{S}(\mathbb{R}) \\ & (u_{n}) & \longmapsto & (u_{n+1}) \end{array}$

    **10.** $\begin{array}{r|ccl} f : & \mathcal{S}(\mathbb{R}) & \longrightarrow & \mathcal{S}(\mathbb{R}) \\ & (u_{n}) & \longmapsto & \big(u_{n}^{2}\big) \end{array}$
  corrige: |
    Le premier réflexe est de tester $f(0_{E})=0_{F}$ ; lorsque ce test passe, on applique la caractérisation de la proposition 1.

    **1.** Pour $\lambda \in \mathbb{R}$ et deux vecteurs $u=(x\,;y)$, $u'=(x'\,;y')$ : 
    $$f(\lambda u+u')=\big(2(\lambda x+x')-(\lambda y+y') \,;\, (\lambda x+x')+3(\lambda y+y')\big)=\lambda f(u)+f(u')$$
     $\boxed{\text{Linéaire.}}$

    **2.** On a $f(0\,;0)=(1\,;0) \neq (0\,;0)$. $\boxed{\text{Non linéaire.}}$

    **3.** On a $f\big(2 \cdot (1\,;1)\big)=f(2\,;2)=4$, alors que $2\,f(1\,;1)=2$. $\boxed{\text{Non linéaire.}}$

    **4.** C'est l'exemple traité dans le cours. $\boxed{\text{Linéaire.}}$

    **5.** On a $f\big(2 \cdot (1\,;0)\big)=(4\,;0)$, alors que $2\,f(1\,;0)=(2\,;0)$. $\boxed{\text{Non linéaire.}}$

    **6.** On a $f(-1)=1$, alors que $-f(1)=-1$. $\boxed{\text{Non linéaire.}}$

    **7.** Pour $\lambda \in \mathbb{R}$ et deux fonctions $g$, $h$ : $(\lambda g+h)(0)=\lambda g(0)+h(0)$. $\boxed{\text{Linéaire.}}$

    **8.** La dérivation vérifie $(\lambda g+h)'=\lambda g'+h'$. $\boxed{\text{Linéaire.}}$

    **9.** Le décalage se lit terme à terme : $(\lambda u+v)_{n+1}=\lambda u_{n+1}+v_{n+1}$. $\boxed{\text{Linéaire.}}$

    **10.** On a $f(2u)=\big(4u_{n}^{2}\big)$, alors que $2f(u)=\big(2u_{n}^{2}\big)$. $\boxed{\text{Non linéaire.}}$

    *Piège :* le test du vecteur nul *élimine* mais ne *valide* pas. Les questions 3, 5, 6 et 10 vérifient toutes $f(0_{E})=0_{F}$ sans être linéaires pour autant.
- id: "ap-07-02"
  feuille: "f-ap-07"
  numero: 2
  partie: "Applications linéaires"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [applications linéaires, endomorphismes, formes linéaires, automorphismes]
  noeuds: [v-applications, a-groupe]
  notions: [application-lineaire, isomorphisme, groupe-lineaire]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Reprendre les applications de l'exercice 1 qui sont linéaires, et préciser pour chacune s'il s'agit d'un endomorphisme, d'une forme linéaire, ou d'aucun des deux. Pour la première, démontrer de plus qu'il s'agit d'un automorphisme.
  corrige: |
    ```tableau
     ¦ **Nature** ¦ **Justification**
    **1.** ¦ endomorphisme de $\mathbb{R}^{2}$ ¦ Même espace au départ et à l'arrivée.
    **4.** ¦ aucun des deux ¦ Départ $\mathbb{R}^{3}$, arrivée $\mathbb{R}^{2}$ : espaces différents, et l'arrivée n'est pas le corps.
    **7.** ¦ forme linéaire sur $\mathcal{F}(\mathbb{R}\,;\mathbb{R})$ ¦ L'espace d'arrivée est $\mathbb{R}$, le corps des scalaires.
    **8.** ¦ aucun des deux ¦ Départ $\mathcal{D}(\mathbb{R}\,;\mathbb{R})$, arrivée $\mathcal{F}(\mathbb{R}\,;\mathbb{R})$.
    **9.** ¦ endomorphisme de $\mathcal{S}(\mathbb{R})$ ¦ Même espace au départ et à l'arrivée.
    ```

    **Cas de la première application.** Déterminons son noyau : 
    $$\left\{\begin{array}{l} 2x-y=0 \\ x+3y=0 \end{array}\right. \iff \left\{\begin{array}{l} y=2x \\ x+6x=0 \end{array}\right. \iff x=y=0$$
     Donc $\mathrm{Ker}\, f=\{(0\,;0)\}$ et $f$ est injective d'après le théorème 1. Pour la surjectivité, soit $(a\,;b) \in \mathbb{R}^{2}$ ; on résout : 
    $$\left\{\begin{array}{l} 2x-y=a \\ x+3y=b \end{array}\right. \iff \left\{\begin{array}{l} x=\dfrac{3a+b}{7} \\[2mm] y=\dfrac{2b-a}{7} \end{array}\right.$$

    $$\boxed{f \text{ est un automorphisme de } \mathbb{R}^{2}.}$$
- id: "ap-07-03"
  feuille: "f-ap-07"
  numero: 3
  partie: "Applications linéaires"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [applications linéaires, formes linéaires, automorphismes]
  noeuds: [v-applications, a-groupe]
  notions: [application-lineaire, isomorphisme, groupe-lineaire]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Soit $f \in \mathcal{L}(\mathbb{R})$, où $\mathbb{R}$ est vu comme $\mathbb{R}$-espace vectoriel. Démontrer qu'il existe un réel $a$ tel que $f(x)=ax$ pour tout $x$.

    **2.** À quelle condition sur $a$ l'application $f$ est-elle un automorphisme de $\mathbb{R}$ ?

    **3.** Soit $\varphi$ une forme linéaire sur $\mathbb{R}^{2}$. Démontrer qu'il existe $(a\,;b) \in \mathbb{R}^{2}$ tel que $\varphi(x\,;y)=ax+by$ pour tout $(x\,;y)$.

    **4.** Énoncer et démontrer le résultat analogue pour une forme linéaire sur $\mathbb{R}^{n}$.
  corrige: |
    **1.** Posons $a=f(1)$. Pour tout réel $x$, l'homogénéité donne : 
    $$f(x)=f(x \cdot 1)=x\,f(1)=ax$$

    $$\boxed{\forall x \in \mathbb{R}, \quad f(x)=ax \quad\text{avec}\quad a=f(1)}$$

    **2.** Si $a=0$, alors $f=0$, dont le noyau est $\mathbb{R}$ tout entier : $f$ n'est pas injective. Si $a \neq 0$, l'application $y \mapsto \dfrac{y}{a}$ est une réciproque. 
    $$\boxed{f \text{ est un automorphisme de } \mathbb{R} \text{ si et seulement si } a \neq 0.}$$

    **3.** Notons $(e_{1}\,;e_{2})$ la base canonique de $\mathbb{R}^{2}$ et posons $a=\varphi(e_{1})$, $b=\varphi(e_{2})$. Tout vecteur s'écrit $(x\,;y)=x\,e_{1}+y\,e_{2}$, d'où par linéarité : 
    $$\varphi(x\,;y)=x\,\varphi(e_{1})+y\,\varphi(e_{2})=ax+by$$

    $$\boxed{\varphi(x\,;y)=ax+by}$$

    **4.** Le même raisonnement, avec la base canonique $(e_{1}\,;\dots\,;e_{n})$ de $\mathbb{R}^{n}$ et $a_{k}=\varphi(e_{k})$, donne : 
    $$\boxed{\varphi(x_{1}\,;\dots\,;x_{n})=\sum_{k=1}^{n} a_{k}x_{k}}$$
     Les formes linéaires sur $\mathbb{R}^{n}$ sont donc exactement les expressions linéaires homogènes en les coordonnées.
- id: "ap-07-04"
  feuille: "f-ap-07"
  numero: 4
  partie: "Applications linéaires"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [applications linéaires, endomorphismes]
  noeuds: [v-applications]
  notions: [application-lineaire]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Soient $E$ un $K$-espace vectoriel muni d'une base $(e_{1}\,;e_{2})$, et $F$ un $K$-espace vectoriel.

    **1.** Soient $f$ et $g$ dans $\mathcal{L}(E\,;F)$ telles que $f(e_{1})=g(e_{1})$ et $f(e_{2})=g(e_{2})$. Démontrer que $f=g$.

    **2.** Soient $y_{1}$ et $y_{2}$ deux vecteurs de $F$. Démontrer qu'il existe une unique application linéaire $f \in \mathcal{L}(E\,;F)$ telle que $f(e_{1})=y_{1}$ et $f(e_{2})=y_{2}$.

    **3.** Application : déterminer l'unique endomorphisme $f$ de $\mathbb{R}^{2}$ vérifiant : 
    $$f(1\,;1)=(2\,;0) \qquad\text{et}\qquad f(1\,;-1)=(0\,;2)$$
     On vérifiera d'abord que $\big((1\,;1)\,;(1\,;-1)\big)$ est bien une base de $\mathbb{R}^{2}$.
  corrige: |
    **1.** Soit $x \in E$. Comme $(e_{1}\,;e_{2})$ est une base, il existe $(\lambda\,;\mu)$ tel que $x=\lambda e_{1}+\mu e_{2}$. Par linéarité de $f$ puis de $g$ : 
    $$f(x)=\lambda f(e_{1})+\mu f(e_{2})=\lambda g(e_{1})+\mu g(e_{2})=g(x)$$

    $$\boxed{f=g}$$
     Une application linéaire est donc entièrement déterminée par les images des vecteurs d'une base.

    **2.** *Existence.* Pour $x \in E$, la décomposition $x=\lambda e_{1}+\mu e_{2}$ est *unique*, puisque $(e_{1}\,;e_{2})$ est une base. On peut donc poser sans ambiguïté : 
    $$f(x)=\lambda y_{1}+\mu y_{2}$$
     Cette application est linéaire : si $x=\lambda e_{1}+\mu e_{2}$ et $x'=\lambda' e_{1}+\mu' e_{2}$, alors $\alpha x+x'=(\alpha\lambda+\lambda')e_{1}+(\alpha\mu+\mu')e_{2}$, d'où : 
    $$f(\alpha x+x')=(\alpha\lambda+\lambda')y_{1}+(\alpha\mu+\mu')y_{2}=\alpha f(x)+f(x')$$
     Enfin $f(e_{1})=y_{1}$ et $f(e_{2})=y_{2}$, en prenant respectivement $(\lambda\,;\mu)=(1\,;0)$ et $(0\,;1)$.

    *Unicité.* C'est la question 1. 
    $$\boxed{\text{Il existe une unique } f \in \mathcal{L}(E\,;F) \text{ telle que } f(e_{1})=y_{1} \text{ et } f(e_{2})=y_{2}.}$$

    **3.** *C'est une base.* La famille est libre : $\lambda(1\,;1)+\mu(1\,;-1)=(0\,;0)$ donne $\lambda+\mu=0$ et $\lambda-\mu=0$, donc $\lambda=\mu=0$. Elle est génératrice : pour $(x\,;y) \in \mathbb{R}^{2}$, on résout $\lambda+\mu=x$ et $\lambda-\mu=y$, ce qui donne : 
    $$\lambda=\frac{x+y}{2} \qquad\text{et}\qquad \mu=\frac{x-y}{2}$$

    *L'endomorphisme.* D'après la question 2 : 
    $$f(x\,;y)=\lambda\,(2\,;0)+\mu\,(0\,;2)=(2\lambda \,;\, 2\mu)$$

    $$\boxed{f(x\,;y)=(x+y \,;\, x-y)}$$
     *Vérification :* $f(1\,;1)=(2\,;0)$ et $f(1\,;-1)=(0\,;2)$ ✓
- id: "ap-07-05"
  feuille: "f-ap-07"
  numero: 5
  partie: "Applications linéaires"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [endomorphismes, automorphismes, composition, symétries, rotations et homothéties]
  noeuds: [v-applications, a-groupe, a-anneau, v-somme-directe]
  notions: [isomorphisme, groupe-lineaire]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Pour $\theta \in \mathbb{R}$, on définit la *rotation* d'angle $\theta$ par : 
    $$\begin{array}{r|ccl} r_{\theta} : & \mathbb{R}^{2} & \longrightarrow & \mathbb{R}^{2} \\ & (x\,;y) & \longmapsto & \big(x\cos\theta-y\sin\theta \,;\, x\sin\theta+y\cos\theta\big) \end{array}$$

    **1.** Démontrer que $r_{\theta}$ est un endomorphisme de $\mathbb{R}^{2}$.

    **2.** Démontrer que $r_{\theta} \circ r_{\theta'}=r_{\theta+\theta'}$ pour tous réels $\theta$ et $\theta'$.

    **3.** En déduire que $r_{\theta}$ est un automorphisme de $\mathbb{R}^{2}$, et préciser sa réciproque.

    **4.** Déterminer $\mathrm{Ker}\, r_{\theta}$ et $\mathrm{Im}\, r_{\theta}$.

    **5.** Pour quelles valeurs de $\theta$ l'application $r_{\theta}$ est-elle une symétrie, c'est-à-dire vérifie-t-elle $r_{\theta} \circ r_{\theta}=\mathrm{Id}_{\mathbb{R}^{2}}$ ?
  corrige: |
    **1.** Chaque coordonnée de $r_{\theta}(x\,;y)$ est une expression linéaire homogène en $x$ et $y$ : la linéarité se vérifie coordonnée par coordonnée, comme à l'exercice 1. 
    $$\boxed{r_{\theta} \in \mathcal{L}(\mathbb{R}^{2})}$$

    **2.** Posons $(X\,;Y)=r_{\theta'}(x\,;y)$. La première coordonnée de $r_{\theta}(X\,;Y)$ vaut : 
    $$\begin{aligned} X\cos\theta-Y\sin\theta &= \big(x\cos\theta'-y\sin\theta'\big)\cos\theta-\big(x\sin\theta'+y\cos\theta'\big)\sin\theta\\ &= x\big(\cos\theta\cos\theta'-\sin\theta\sin\theta'\big)-y\big(\sin\theta'\cos\theta+\cos\theta'\sin\theta\big)\\ &= x\cos(\theta+\theta')-y\sin(\theta+\theta') \end{aligned}$$
     Le calcul de la seconde coordonnée est identique et donne $x\sin(\theta+\theta')+y\cos(\theta+\theta')$. 
    $$\boxed{r_{\theta} \circ r_{\theta'}=r_{\theta+\theta'}}$$

    **3.** En prenant $\theta'=-\theta$, il vient $r_{\theta} \circ r_{-\theta}=r_{0}=\mathrm{Id}_{\mathbb{R}^{2}}$, et de même dans l'autre ordre. 
    $$\boxed{r_{\theta} \text{ est un automorphisme de } \mathbb{R}^{2}, \text{ de réciproque } r_{-\theta}.}$$

    **4.** Une application bijective a un noyau réduit au vecteur nul et une image égale à l'espace d'arrivée. 
    $$\boxed{\mathrm{Ker}\, r_{\theta}=\big\{(0\,;0)\big\} \qquad\text{et}\qquad \mathrm{Im}\, r_{\theta}=\mathbb{R}^{2}}$$

    **5.** D'après la question 2, $r_{\theta} \circ r_{\theta}=r_{2\theta}$, et cette application vaut $\mathrm{Id}$ si et seulement si $\cos(2\theta)=1$ et $\sin(2\theta)=0$, c'est-à-dire $2\theta \equiv 0 \; [2\pi]$. 
    $$\boxed{r_{\theta} \text{ est une symétrie si et seulement si } \theta \equiv 0 \; [\pi].}$$
     On obtient alors $r_{\theta}=\mathrm{Id}$ si $\theta \equiv 0 \; [2\pi]$, et $r_{\theta}=-\mathrm{Id}$ si $\theta \equiv \pi \; [2\pi]$ : la symétrie centrale.
- id: "ap-07-06"
  feuille: "f-ap-07"
  numero: 6
  partie: "Noyau et image"
  etoiles: 1
  types: [Calcul]
  mots_cles: [applications linéaires]
  noeuds: [v-applications]
  notions: [application-lineaire]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Pour chacune des applications linéaires suivantes, déterminer $\mathrm{Ker}\, f$ et $\mathrm{Im}\, f$, en donnant à chaque fois une famille génératrice ou une équation cartésienne.

    **1.** $\begin{array}{r|ccl} f : & \mathbb{R}^{3} & \longrightarrow & \mathbb{R}^{2} \\ & (x\,;y\,;z) & \longmapsto & (x+y+z \,;\, x-y) \end{array}$

    **2.** $\begin{array}{r|ccl} f : & \mathbb{R}^{2} & \longrightarrow & \mathbb{R}^{3} \\ & (x\,;y) & \longmapsto & (x-y \,;\, x+y \,;\, 2x) \end{array}$

    **3.** $\begin{array}{r|ccl} f : & \mathbb{R}^{3} & \longrightarrow & \mathbb{R}^{3} \\ & (x\,;y\,;z) & \longmapsto & (x+y \,;\, y+z \,;\, z+x) \end{array}$

    **4.** $\begin{array}{r|ccl} f : & \mathbb{R}^{3} & \longrightarrow & \mathbb{R}^{3} \\ & (x\,;y\,;z) & \longmapsto & (x-y \,;\, y-z \,;\, z-x) \end{array}$
  corrige: |
    **1.** *Noyau.* On résout $x+y+z=0$ et $x-y=0$, soit $x=y$ puis $z=-2x$ : 
    $$\mathrm{Ker}\, f=\big\{(t\,;t\,;-2t) \;\big|\; t \in \mathbb{R}\big\}=\mathrm{Vect}\big((1\,;1\,;-2)\big)$$
     *Image.* On a $f(1\,;0\,;0)=(1\,;1)$ et $f(0\,;1\,;0)=(1\,;-1)$. Ces deux vecteurs sont non colinéaires, donc engendrent $\mathbb{R}^{2}$. 
    $$\boxed{\mathrm{Ker}\, f=\mathrm{Vect}\big((1\,;1\,;-2)\big) \qquad\text{et}\qquad \mathrm{Im}\, f=\mathbb{R}^{2}}$$

    **2.** *Noyau.* Les équations $x-y=0$ et $x+y=0$ donnent $x=y=0$.

    *Image.* Elle est engendrée par $f(1\,;0)=(1\,;1\,;2)$ et $f(0\,;1)=(-1\,;1\,;0)$. Ces deux vecteurs vérifient tous deux $a+b-c=0$, et ils ne sont pas colinéaires : ils engendrent donc le plan d'équation $a+b-c=0$. 
    $$\boxed{\mathrm{Ker}\, f=\big\{(0\,;0)\big\} \qquad\text{et}\qquad \mathrm{Im}\, f=\big\{(a\,;b\,;c) \in \mathbb{R}^{3} \;\big|\; a+b-c=0\big\}}$$

    **3.** *Noyau.* Le système $x+y=0$, $y+z=0$, $z+x=0$ donne $y=-x$, $z=-y=x$, puis $z+x=2x=0$, d'où $x=y=z=0$.

    *Image.* L'application est injective ; pour la surjectivité, on résout $x+y=a$, $y+z=b$, $z+x=c$. En additionnant, $2(x+y+z)=a+b+c$, puis en retranchant chaque ligne on obtient une solution pour tout $(a\,;b\,;c)$. 
    $$\boxed{\mathrm{Ker}\, f=\big\{(0\,;0\,;0)\big\} \qquad\text{et}\qquad \mathrm{Im}\, f=\mathbb{R}^{3}}$$

    **4.** *Noyau.* Les équations $x=y$, $y=z$ et $z=x$ donnent $x=y=z$.

    *Image.* La somme des trois coordonnées de $f(x\,;y\,;z)$ vaut $(x-y)+(y-z)+(z-x)=0$ : l'image est donc contenue dans le plan $\mathcal{P}$ d'équation $a+b+c=0$. Or $f(1\,;0\,;0)=(1\,;0\,;-1)$ et $f(0\,;1\,;0)=(-1\,;1\,;0)$ appartiennent à $\mathcal{P}$ et ne sont pas colinéaires. 
    $$\boxed{\mathrm{Ker}\, f=\mathrm{Vect}\big((1\,;1\,;1)\big) \qquad\text{et}\qquad \mathrm{Im}\, f=\big\{(a\,;b\,;c) \in \mathbb{R}^{3} \;\big|\; a+b+c=0\big\}}$$
- id: "ap-07-07"
  feuille: "f-ap-07"
  numero: 7
  partie: "Noyau et image"
  etoiles: 1
  types: [Calcul]
  mots_cles: [noyau, injectivité et surjectivité]
  noeuds: [v-applications]
  notions: [noyau]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Pour chacune des quatre applications de l'exercice 6, dire si elle est injective, surjective, bijective, en appliquant le théorème 1. Vérifier ensuite, sur chacune, la remarque du cours concernant les dimensions du noyau et de l'image.
  corrige: |
    Le théorème 1 ramène l'injectivité à la seule condition $\mathrm{Ker}\, f=\{0_{E}\}$, et la surjectivité à $\mathrm{Im}\, f = F$.

    $$\begin{array}{|c|c|c|c|c|c|} \hline  & \text{Injective} & \text{Surjective} & \dim \mathrm{Ker}\, f & \dim \mathrm{Im}\, f & \text{Somme} \\ \hline \text{1. }\mathbb{R}^{3} \to \mathbb{R}^{2} & \text{non} & \text{oui} & 1 & 2 & 3 \\ \hline \text{2. }\mathbb{R}^{2} \to \mathbb{R}^{3} & \text{oui} & \text{non} & 0 & 2 & 2 \\ \hline \text{3. }\mathbb{R}^{3} \to \mathbb{R}^{3} & \text{oui} & \text{oui} & 0 & 3 & 3 \\ \hline \text{4. }\mathbb{R}^{3} \to \mathbb{R}^{3} & \text{non} & \text{non} & 1 & 2 & 3 \\ \hline \end{array}$$

    $$\boxed{\text{Dans chaque cas, } \dim \mathrm{Ker}\, f+\dim \mathrm{Im}\, f \text{ vaut la dimension de l'espace de \emph{départ}.}}$$
     C'est la remarque du cours : ce n'est pas une coïncidence, mais le théorème du rang, qui sera démontré au chapitre suivant. On notera que la troisième application est bijective : c'est le seul cas où l'espace de départ et l'espace d'arrivée ont la même dimension *et* le noyau est trivial.
- id: "ap-07-08"
  feuille: "f-ap-07"
  numero: 8
  partie: "Noyau et image"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [endomorphismes, injectivité et surjectivité, composition, exemples en dimension infinie]
  noeuds: [v-applications, a-anneau]
  notions: []
  page_enonce: 2
  page_corrige: 5
  enonce: |
    On définit sur $\mathcal{S}(\mathbb{R})$ le *décalage à gauche* et le *décalage à droite* : 
    $$\delta\big((u_{0}\,;u_{1}\,;u_{2}\,;\dots)\big)=(u_{1}\,;u_{2}\,;u_{3}\,;\dots) \qquad \tau\big((u_{0}\,;u_{1}\,;u_{2}\,;\dots)\big)=(0\,;u_{0}\,;u_{1}\,;\dots)$$

    **1.** Démontrer que $\delta$ et $\tau$ sont des endomorphismes de $\mathcal{S}(\mathbb{R})$.

    **2.** Déterminer $\mathrm{Ker}\, \delta$ et $\mathrm{Im}\, \delta$, puis $\mathrm{Ker}\, \tau$ et $\mathrm{Im}\, \tau$.

    **3.** En déduire, pour chacun, s'il est injectif et s'il est surjectif.

    **4.** Calculer $\delta \circ \tau$ et $\tau \circ \delta$. Que constate-t-on ?

    **5.** Commenter : que devient, en dimension infinie, le lien entre injectivité et surjectivité observé au chapitre 4 pour les ensembles finis ?
  corrige: |
    **1.** Les deux applications se lisent terme à terme. Pour $\lambda \in \mathbb{R}$ et deux suites $u$, $v$ : 
    $$\delta(\lambda u+v)_{n}=(\lambda u+v)_{n+1}=\lambda u_{n+1}+v_{n+1}=\big(\lambda\,\delta(u)+\delta(v)\big)_{n}$$
     et le calcul est analogue pour $\tau$, dont le terme d'indice $0$ vaut $0$ dans les deux membres. 
    $$\boxed{\delta \text{ et } \tau \text{ sont des endomorphismes de } \mathcal{S}(\mathbb{R}).}$$

    **2.** *Pour $\delta$ :* on a $\delta(u)=0$ si et seulement si $u_{n+1}=0$ pour tout $n \geqslant 0$, c'est-à-dire $u_{n}=0$ pour tout $n \geqslant 1$, le terme $u_{0}$ restant libre. Pour l'image, soit $v \in \mathcal{S}(\mathbb{R})$ ; la suite $u=(0\,;v_{0}\,;v_{1}\,;\dots)$ vérifie $\delta(u)=v$.

    *Pour $\tau$ :* on a $\tau(u)=0$ si et seulement si $u_{n}=0$ pour tout $n$. Et toute suite de la forme $\tau(u)$ a son premier terme nul ; réciproquement, si $v_{0}=0$, la suite $u=(v_{1}\,;v_{2}\,;\dots)$ vérifie $\tau(u)=v$. 
    $$\boxed{\mathrm{Ker}\, \delta=\mathrm{Vect}\big((1\,;0\,;0\,;\dots)\big) \qquad \mathrm{Im}\, \delta=\mathcal{S}(\mathbb{R})}$$

    $$\boxed{\mathrm{Ker}\, \tau=\{0\} \qquad \mathrm{Im}\, \tau=\big\{v \in \mathcal{S}(\mathbb{R}) \;\big|\; v_{0}=0\big\}}$$

    **3.** La question précédente se relit ainsi, à l'aide du théorème 1 : 
    $$\boxed{\delta \text{ est surjectif et non injectif ; } \tau \text{ est injectif et non surjectif.}}$$

    **4.** Pour toute suite $u$ : 
    $$(\delta \circ \tau)(u)=\delta(0\,;u_{0}\,;u_{1}\,;\dots)=(u_{0}\,;u_{1}\,;\dots)=u$$

    $$(\tau \circ \delta)(u)=\tau(u_{1}\,;u_{2}\,;\dots)=(0\,;u_{1}\,;u_{2}\,;\dots)$$

    $$\boxed{\delta \circ \tau=\mathrm{Id} \qquad\text{tandis que}\qquad \tau \circ \delta \neq \mathrm{Id}}$$
     L'application $\tau$ admet donc un inverse à gauche sans être inversible, ce qui confirme une fois de plus que $\mathcal{L}\big(\mathcal{S}(\mathbb{R})\big)$ n'est pas commutatif.

    **5.** On en tire la conclusion générale : 
    $$\boxed{\begin{array}{l} \text{En dimension infinie, un endomorphisme peut être injectif sans être surjectif,} \\[1mm] \text{ou surjectif sans être injectif.} \end{array}}$$
     Au chapitre 4, on avait démontré qu'un endomorphisme injectif d'un groupe *fini* est automatiquement surjectif. C'est la finitude qui portait tout l'argument, et elle fait ici défaut.
- id: "ap-07-09"
  feuille: "f-ap-07"
  numero: 9
  partie: "Noyau et image"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [applications linéaires, formes linéaires, noyau, injectivité et surjectivité, exemples en dimension infinie]
  noeuds: [v-applications]
  notions: [application-lineaire, noyau]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** On pose $\varphi(x\,;y\,;z)=x+2y-z$. Démontrer que $\varphi$ est une forme linéaire sur $\mathbb{R}^{3}$, puis déterminer $\mathrm{Ker}\, \varphi$ et $\mathrm{Im}\, \varphi$.

    **2.** Démontrer que les seuls sous-espaces vectoriels du $K$-espace vectoriel $K$ sont $\{0_{K}\}$ et $K$.

    **3.** En déduire que toute forme linéaire non nulle est surjective.

    **4.** Déterminer le noyau de la dérivation $D : g \mapsto g'$, de $\mathcal{D}(\mathbb{R}\,;\mathbb{R})$ dans $\mathcal{F}(\mathbb{R}\,;\mathbb{R})$. L'application $D$ est-elle injective ?
  corrige: |
    **1.** L'application $\varphi$ est linéaire d'après l'exercice 3, et son ensemble d'arrivée est $\mathbb{R}$ : c'est bien une forme linéaire. Son noyau est l'ensemble des $(x\,;y\,;z)$ tels que $x+2y-z=0$, un plan vectoriel, engendré par exemple par $(1\,;0\,;1)$ et $(0\,;1\,;2)$. Enfin $\varphi(1\,;0\,;0)=1$. 
    $$\boxed{\mathrm{Ker}\, \varphi=\mathrm{Vect}\big((1\,;0\,;1)\,;(0\,;1\,;2)\big) \qquad\text{et}\qquad \mathrm{Im}\, \varphi=\mathbb{R}}$$

    **2.** Soit $F$ un sous-espace vectoriel de $K$ non réduit à $\{0_{K}\}$, et soit $a \in F$ non nul. Pour tout $\lambda \in K$, le corps $K$ fournit $a^{-1}$, et : 
    $$\lambda=\big(\lambda a^{-1}\big) \cdot a \in F$$
     puisque $F$ est stable par multiplication externe. 
    $$\boxed{\text{Les seuls sous-espaces vectoriels de } K \text{ sont } \{0_{K}\} \text{ et } K.}$$

    **3.** D'après la proposition 2, $\mathrm{Im}\, \varphi$ est un sous-espace vectoriel de $K$. Si $\varphi \neq 0$, alors $\mathrm{Im}\, \varphi \neq \{0_{K}\}$, donc $\mathrm{Im}\, \varphi = K$ d'après la question 2. 
    $$\boxed{\text{Toute forme linéaire non nulle est surjective.}}$$

    **4.** Une fonction dérivable sur $\mathbb{R}$ de dérivée nulle est constante. 
    $$\boxed{\mathrm{Ker}\, D=\big\{\text{fonctions constantes}\big\}}$$
     Ce noyau n'est pas réduit à la fonction nulle, donc $\boxed{D \text{ n'est pas injective.}}$
- id: "ap-07-10"
  feuille: "f-ap-07"
  numero: 10
  partie: "Noyau et image"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [endomorphismes, injectivité et surjectivité, composition]
  noeuds: [v-applications, a-anneau]
  notions: []
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soient $E$, $F$, $G$ trois $K$-espaces vectoriels, $f \in \mathcal{L}(E\,;F)$ et $g \in \mathcal{L}(F\,;G)$.

    **1.** Démontrer que $\mathrm{Ker}\, f \subset \mathrm{Ker}\,(g \circ f)$ et que $\mathrm{Im}\,(g \circ f) \subset \mathrm{Im}\, g$.

    **2.** Démontrer que $g \circ f = 0$ si et seulement si $\mathrm{Im}\, f \subset \mathrm{Ker}\, g$.

    **3.** Démontrer que si $g \circ f$ est injective, alors $f$ l'est ; et que si $g \circ f$ est surjective, alors $g$ l'est.

    **4.** Soit $f \in \mathcal{L}(E)$ vérifiant $f \circ f = 0$. Que peut-on dire de $\mathrm{Im}\, f$ et $\mathrm{Ker}\, f$ ? Donner un exemple d'un tel endomorphisme non nul de $\mathbb{R}^{2}$.
  corrige: |
    **1.** Soit $x \in \mathrm{Ker}\, f$. Alors $f(x)=0_{F}$, donc $(g \circ f)(x)=g(0_{F})=0_{G}$, la dernière égalité venant de la linéarité de $g$.

    Soit $z \in \mathrm{Im}\,(g \circ f)$. Il existe $x \in E$ tel que $z=g\big(f(x)\big)$, donc $z$ est l'image par $g$ du vecteur $f(x) \in F$. 
    $$\boxed{\mathrm{Ker}\, f \subset \mathrm{Ker}\,(g \circ f) \qquad\text{et}\qquad \mathrm{Im}\,(g \circ f) \subset \mathrm{Im}\, g}$$

    **2.** On enchaîne les équivalences : 
    $$g \circ f = 0 \iff \forall x \in E, \; g\big(f(x)\big)=0_{G} \iff \forall x \in E, \; f(x) \in \mathrm{Ker}\, g \iff \mathrm{Im}\, f \subset \mathrm{Ker}\, g$$

    $$\boxed{g \circ f = 0 \iff \mathrm{Im}\, f \subset \mathrm{Ker}\, g}$$

    **3.** *Injectivité.* Soient $x$, $y \in E$ tels que $f(x)=f(y)$. En appliquant $g$, il vient $(g \circ f)(x)=(g \circ f)(y)$, donc $x=y$.

    *Surjectivité.* Soit $z \in G$. Comme $g \circ f$ est surjective, il existe $x \in E$ tel que $g\big(f(x)\big)=z$. Le vecteur $y=f(x)$ de $F$ vérifie $g(y)=z$. 
    $$\boxed{g \circ f \text{ injective} \Rightarrow f \text{ injective} \qquad\text{et}\qquad g \circ f \text{ surjective} \Rightarrow g \text{ surjective}}$$
     C'est exactement l'exercice 12 du chapitre 4 : une application linéaire est en particulier un morphisme de groupes.

    **4.** La question 2, appliquée avec $g=f$, donne : 
    $$\boxed{f \circ f = 0 \iff \mathrm{Im}\, f \subset \mathrm{Ker}\, f}$$
     *Exemple.* Posons $f(x\,;y)=(y\,;0)$ sur $\mathbb{R}^{2}$. Alors $f$ est linéaire, non nulle, et : 
    $$(f \circ f)(x\,;y)=f(y\,;0)=(0\,;0)$$
     On a ici $\mathrm{Im}\, f=\mathrm{Vect}\big((1\,;0)\big)=\mathrm{Ker}\, f$ : l'inclusion est même une égalité.
- id: "ap-07-11"
  feuille: "f-ap-07"
  numero: 11
  partie: "Structure de l'ensemble des endomorphismes"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [applications linéaires, composition]
  noeuds: [v-applications, a-anneau]
  notions: [application-lineaire]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **1.** Soient $f$, $g \in \mathcal{L}(E\,;F)$ et $\lambda \in K$. Démontrer que $\lambda f+g$ est encore une application linéaire.

    **2.** En déduire que $\mathcal{L}(E\,;F)$ est un sous-espace vectoriel de $\mathcal{F}(E\,;F)$.

    **3.** On pose, sur $\mathbb{R}^{2}$, $f(x\,;y)=(x\,;0)$ et $g(x\,;y)=(0\,;y)$. Calculer $f+g$, puis $2f-3g$.

    **4.** Calculer $f \circ g$ et $g \circ f$. Qu'en déduit-on sur l'anneau $\mathcal{L}(\mathbb{R}^{2})$ ?
  corrige: |
    **1.** Soient $\alpha \in K$ et $(x\,;y) \in E^{2}$. En utilisant successivement la définition des opérations point par point, puis la linéarité de $f$ et de $g$ : 
    $$\begin{aligned} (\lambda f+g)(\alpha x+y) &= \lambda\,f(\alpha x+y)+g(\alpha x+y)\\ &= \lambda\big(\alpha f(x)+f(y)\big)+\alpha g(x)+g(y)\\ &= \alpha\big(\lambda f(x)+g(x)\big)+\big(\lambda f(y)+g(y)\big)\\ &= \alpha\,(\lambda f+g)(x)+(\lambda f+g)(y) \end{aligned}$$

    $$\boxed{\lambda f+g \in \mathcal{L}(E\,;F)}$$

    **2.** On a $\mathcal{L}(E\,;F) \subset \mathcal{F}(E\,;F)$, l'application nulle est linéaire, et la question 1 donne la stabilité par $\lambda f+g$ : c'est la caractérisation du chapitre 6. 
    $$\boxed{\mathcal{L}(E\,;F) \text{ est un sous-espace vectoriel de } \mathcal{F}(E\,;F).}$$

    **3.** On additionne coordonnée par coordonnée : 
    $$(f+g)(x\,;y)=(x\,;0)+(0\,;y)=(x\,;y) \qquad\text{donc}\qquad \boxed{f+g=\mathrm{Id}_{\mathbb{R}^{2}}}$$

    $$(2f-3g)(x\,;y)=2\,(x\,;0)-3\,(0\,;y)=\boxed{(2x \,;\, -3y)}$$

    **4.** On compose dans les deux sens : 
    $$(f \circ g)(x\,;y)=f(0\,;y)=(0\,;0) \qquad\text{et}\qquad (g \circ f)(x\,;y)=g(x\,;0)=(0\,;0)$$

    $$\boxed{f \circ g = g \circ f = 0, \text{ alors que } f \neq 0 \text{ et } g \neq 0.}$$

    $$\boxed{\text{L'anneau } \mathcal{L}(\mathbb{R}^{2}) \text{ possède des diviseurs de zéro : il n'est pas intègre.}}$$
- id: "ap-07-12"
  feuille: "f-ap-07"
  numero: 12
  partie: "Structure de l'ensemble des endomorphismes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [endomorphismes, composition]
  noeuds: [v-applications, a-anneau]
  notions: []
  page_enonce: 3
  page_corrige: 7
  enonce: |
    **1.** On note $\mathbb{R}[X]$ l'espace des fonctions polynomiales réelles, et l'on pose : 
    $$D : P \longmapsto P' \qquad\text{et}\qquad M : P \longmapsto \big(x \mapsto x\,P(x)\big)$$
     Démontrer que $D$ et $M$ sont des endomorphismes de $\mathbb{R}[X]$, puis calculer $D \circ M-M \circ D$.

    **2.** Dans $\mathbb{R}^{2}$, on pose $f(x\,;y)=(y\,;0)$ et $g(x\,;y)=(x\,;0)$. Calculer $f \circ g$ et $g \circ f$.

    **3.** Soient $f$ et $g$ deux endomorphismes de $E$. Développer $(f+g) \circ (f+g)$. À quelle condition retrouve-t-on l'identité remarquable habituelle ?
  corrige: |
    **1.** La dérivation est linéaire, et pour $M$ : $M(\lambda P+Q)(x)=x\big(\lambda P(x)+Q(x)\big)=\lambda\,M(P)(x)+M(Q)(x)$. De plus, le produit d'un polynôme par $x$ reste un polynôme.

    On calcule alors, pour toute fonction polynomiale $P$ : 
    $$(D \circ M)(P)=\big(x \mapsto xP(x)\big)'=P+\big(x \mapsto xP'(x)\big) \qquad\text{et}\qquad (M \circ D)(P)=\big(x \mapsto xP'(x)\big)$$

    $$\boxed{D \circ M-M \circ D=\mathrm{Id}}$$

    **2.** On compose dans les deux sens : 
    $$(f \circ g)(x\,;y)=f(x\,;0)=(0\,;0) \qquad\text{et}\qquad (g \circ f)(x\,;y)=g(y\,;0)=(y\,;0)$$

    $$\boxed{f \circ g = 0 \neq g \circ f}$$
     Ces deux exemples montrent que l'anneau $\mathcal{L}(E)$ n'est pas commutatif, conformément à la proposition 3.

    **3.** En développant dans l'anneau $\mathcal{L}(E)$ : 
    $$\boxed{(f+g) \circ (f+g)=f \circ f+f \circ g+g \circ f+g \circ g}$$

    $$\boxed{\text{On retrouve } f^{2}+2\,f \circ g+g^{2} \text{ si et seulement si } f \circ g = g \circ f.}$$
     C'est exactement la situation rencontrée au chapitre 5 : les identités remarquables ne valent que pour des éléments qui commutent.
- id: "ap-07-13"
  feuille: "f-ap-07"
  numero: 13
  partie: "Structure de l'ensemble des endomorphismes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [applications linéaires, injectivité et surjectivité, automorphismes, composition]
  noeuds: [v-applications, a-groupe, a-anneau]
  notions: [application-lineaire, isomorphisme, groupe-lineaire]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    **1.** Soit $f \in \mathcal{L}(E)$ bijective. Démontrer que $f^{-1}$ est linéaire.

    **2.** En déduire que $\mathrm{GL}(E)$ est un sous-groupe du groupe $\mathcal{S}(E)$ des bijections de $E$.

    **3.** Soient $f$ et $g$ deux automorphismes de $E$. Démontrer que $(g \circ f)^{-1}=f^{-1} \circ g^{-1}$.

    **4.** Application : l'application $f(x\,;y)=(2x-y \,;\, x+3y)$ appartient-elle à $\mathrm{GL}(\mathbb{R}^{2})$ ? Le cas échéant, expliciter $f^{-1}$.
  corrige: |
    **1.** Soient $\lambda \in K$ et $(y\,;y') \in E^{2}$. Posons $x=f^{-1}(y)$ et $x'=f^{-1}(y')$. Par linéarité de $f$ : 
    $$f(\lambda x+x')=\lambda f(x)+f(x')=\lambda y+y'$$
     En appliquant $f^{-1}$ aux deux membres : 
    $$f^{-1}(\lambda y+y')=\lambda x+x'=\lambda f^{-1}(y)+f^{-1}(y')$$

    $$\boxed{f^{-1} \text{ est linéaire.}}$$

    **2.** On a $\mathrm{GL}(E) \subset \mathcal{S}(E)$, et $\mathrm{Id}_{E}$ est un automorphisme. Soient $f$, $g \in \mathrm{GL}(E)$. D'après la question 1, $g^{-1}$ est linéaire, et elle est bijective ; la proposition 3 donne alors que $f \circ g^{-1}$ est linéaire, et c'est une bijection. 
    $$\boxed{\mathrm{GL}(E) \text{ est un sous-groupe de } \mathcal{S}(E).}$$

    **3.** Il suffit de vérifier que $f^{-1} \circ g^{-1}$ se comporte comme la réciproque de $g \circ f$ : 
    $$(g \circ f) \circ \big(f^{-1} \circ g^{-1}\big)=g \circ \big(f \circ f^{-1}\big) \circ g^{-1}=g \circ g^{-1}=\mathrm{Id}_{E}$$
     et le calcul dans l'autre ordre est analogue. 
    $$\boxed{(g \circ f)^{-1}=f^{-1} \circ g^{-1}}$$

    **4.** L'exercice 2 a établi que cette application est un automorphisme, avec : 
    $$\boxed{f \in \mathrm{GL}(\mathbb{R}^{2}) \qquad\text{et}\qquad f^{-1}(a\,;b)=\left(\frac{3a+b}{7} \,;\, \frac{2b-a}{7}\right)}$$
     *Vérification :* $f^{-1}\big(f(1\,;0)\big)=f^{-1}(2\,;1)=\left(\frac{7}{7} \,;\, \frac{0}{7}\right)=(1\,;0)$ ✓
- id: "ap-07-14"
  feuille: "f-ap-07"
  numero: 14
  partie: "Structure de l'ensemble des endomorphismes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [composition, projecteurs, symétries, rotations et homothéties]
  noeuds: [a-anneau, v-somme-directe, v-applications]
  notions: [supplementaire]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Pour $\lambda \in K$, on appelle *homothétie de rapport $\lambda$* l'application $h_{\lambda} : x \mapsto \lambda \cdot x$ de $E$ dans $E$.

    **1.** Démontrer que $h_{\lambda} \in \mathcal{L}(E)$, et que $h_{\lambda} \circ h_{\mu}=h_{\lambda\mu}$.

    **2.** Démontrer que $h_{\lambda} \circ f = f \circ h_{\lambda}$ pour tout $f \in \mathcal{L}(E)$.

    **3.** Déterminer $\mathrm{Ker}\, h_{\lambda}$ et $\mathrm{Im}\, h_{\lambda}$ selon la valeur de $\lambda$, puis à quelle condition $h_{\lambda} \in \mathrm{GL}(E)$.

    **4.** Pour quelles valeurs de $\lambda$ l'homothétie $h_{\lambda}$ est-elle un projecteur ? une symétrie ?
  corrige: |
    **1.** Pour $\alpha \in K$ et $(x\,;y) \in E^{2}$ : 
    $$h_{\lambda}(\alpha x+y)=\lambda \cdot (\alpha x+y)=\alpha\,(\lambda \cdot x)+\lambda \cdot y=\alpha\,h_{\lambda}(x)+h_{\lambda}(y)$$
     et l'axiome **A** de la loi externe donne : 
    $$\big(h_{\lambda} \circ h_{\mu}\big)(x)=\lambda \cdot (\mu \cdot x)=(\lambda\mu) \cdot x=h_{\lambda\mu}(x)$$

    $$\boxed{h_{\lambda} \in \mathcal{L}(E) \qquad\text{et}\qquad h_{\lambda} \circ h_{\mu}=h_{\lambda\mu}}$$

    **2.** Soit $f \in \mathcal{L}(E)$. Pour tout $x \in E$, l'homogénéité de $f$ donne : 
    $$\big(h_{\lambda} \circ f\big)(x)=\lambda \cdot f(x)=f(\lambda \cdot x)=\big(f \circ h_{\lambda}\big)(x)$$

    $$\boxed{h_{\lambda} \text{ commute avec tout endomorphisme de } E.}$$

    **3.** Si $\lambda=0$, alors $h_{0}=0$. Sinon, la question 1 donne $h_{\lambda} \circ h_{1/\lambda}=h_{1}=\mathrm{Id}_{E}$. 
    $$\boxed{\begin{array}{l} \text{Si } \lambda=0 \;:\; \mathrm{Ker}\, h_{0}=E \text{ et } \mathrm{Im}\, h_{0}=\{0_{E}\}. \\[1mm] \text{Si } \lambda \neq 0 \;:\; \mathrm{Ker}\, h_{\lambda}=\{0_{E}\}, \; \mathrm{Im}\, h_{\lambda}=E, \text{ et } h_{\lambda} \in \mathrm{GL}(E) \text{ avec } h_{\lambda}^{-1}=h_{1/\lambda}. \end{array}}$$

    **4.** On suppose $E \neq \{0_{E}\}$. L'égalité $h_{\lambda} \circ h_{\lambda}=h_{\lambda^{2}}$ donne : 
    $$h_{\lambda} \text{ projecteur} \iff \lambda^{2}=\lambda \iff \lambda \in \{0 \,;1\}$$

    $$h_{\lambda} \text{ symétrie} \iff \lambda^{2}=1 \iff \lambda \in \{-1 \,;1\}$$

    $$\boxed{\begin{array}{l} \text{Les seules homothéties qui sont des projecteurs sont } 0 \text{ et } \mathrm{Id}_{E}. \\[1mm] \text{Les seules qui sont des symétries sont } \mathrm{Id}_{E} \text{ et } -\mathrm{Id}_{E}. \end{array}}$$
- id: "ap-07-15"
  feuille: "f-ap-07"
  numero: 15
  partie: "Projecteurs et symétries"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [projecteurs, symétries]
  noeuds: [v-somme-directe]
  notions: [supplementaire]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Le plan ci-dessous est muni de deux droites vectorielles $D$ et $\Delta$. Un vecteur $x$ y est représenté, ainsi que deux vecteurs $u$ et $v$ obtenus à partir de $x$ : l'un par le projecteur $p$ sur $D$ parallèlement à $\Delta$, l'autre par la symétrie $s$ associée.

    ![Figure](documents/figures/ad0eef746873be75.svg)

    **1.** Lire les coordonnées de $x$, $u$ et $v$.

    **2.** Identifier lequel de $u$ et $v$ est $p(x)$, et lequel est $s(x)$. Justifier.

    **3.** Vérifier numériquement la relation $s(x)=2p(x)-x$ de la proposition 4.

    **4.** Déterminer $\mathrm{Ker}\, p$ et $\mathrm{Im}\, p$, ainsi que $\mathrm{Ker}\,(s-\mathrm{Id})$ et $\mathrm{Ker}\,(s+\mathrm{Id})$.
  corrige: |
    **1.** On lit directement sur le quadrillage : 
    $$\boxed{x=(3\,;4) \qquad u=(4\,;2) \qquad v=(5\,;0)}$$

    **2.** L'image d'un projecteur sur $D$ est contenue dans $D$. Or $u=(4\,;2)=2 \times (2\,;1)$ appartient à $D$, tandis que $v=(5\,;0)$ n'y appartient pas.

    On vérifie de plus que $x-u=(-1\,;2)$ dirige $\Delta$ : le vecteur $u$ est bien obtenu à partir de $x$ en se déplaçant parallèlement à $\Delta$ jusqu'à rencontrer $D$. 
    $$\boxed{u=p(x) \qquad\text{et}\qquad v=s(x)}$$

    **3.** On applique la relation aux coordonnées lues : 
    $$2\,p(x)-x=2\,(4\,;2)-(3\,;4)=(8-3 \,;\, 4-4)=(5\,;0)=s(x)$$

    $$\boxed{\text{La relation } s=2p-\mathrm{Id} \text{ est bien vérifiée.}}$$

    **4.** Le noyau d'un projecteur est la direction parallèlement à laquelle il projette, et son image est le sous-espace sur lequel il projette. La proposition 4 identifie ensuite les deux sous-espaces caractéristiques de $s$. 
    $$\boxed{\mathrm{Ker}\, p=\Delta=\mathrm{Vect}\big((-1\,;2)\big) \qquad \mathrm{Im}\, p=D=\mathrm{Vect}\big((2\,;1)\big)}$$

    $$\boxed{\mathrm{Ker}\,(s-\mathrm{Id})=\mathrm{Im}\, p=D \qquad \mathrm{Ker}\,(s+\mathrm{Id})=\mathrm{Ker}\, p=\Delta}$$
- id: "ap-07-16"
  feuille: "f-ap-07"
  numero: 16
  partie: "Projecteurs et symétries"
  etoiles: 1
  types: [Calcul]
  mots_cles: [projecteurs, symétries]
  noeuds: [v-somme-directe]
  notions: [supplementaire]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    **A.** Pour chacune des applications suivantes, vérifier qu'il s'agit d'un projecteur, puis déterminer $\mathrm{Ker}\, p$ et $\mathrm{Im}\, p$ et vérifier le théorème 2.

    **1.** $p(x\,;y\,;z)=(x \,;\, y \,;\, 0)$

    **2.** $p(x\,;y)=\left(\dfrac{x+y}{2} \,;\, \dfrac{x+y}{2}\right)$

    **3.** $p(x\,;y\,;z)=(x+z \,;\, y+z \,;\, 0)$

    **4.** $f(x\,;y)=(x \,;\, 2y)$

    **B.** Pour chacune des applications suivantes, vérifier qu'il s'agit d'une symétrie, puis déterminer les vecteurs invariants et les vecteurs changés en leur opposé.

    **1.** $s(x\,;y)=(y \,;\, x)$

    **2.** $s(x\,;y\,;z)=(x \,;\, y \,;\, -z)$

    **3.** $s(x\,;y)=(x+2y \,;\, -y)$

    **4.** $g(x\,;y)=(2x \,;\, -y)$
  corrige: |
    **A. Projecteurs.**

    **1.** $p\big(p(x\,;y\,;z)\big)=p(x\,;y\,;0)=(x\,;y\,;0)=p(x\,;y\,;z)$ : c'est un projecteur. Son noyau est l'ensemble des $(0\,;0\,;z)$, son image le plan $z=0$. 
    $$\boxed{\mathrm{Ker}\, p=\mathrm{Vect}\big((0\,;0\,;1)\big) \qquad \mathrm{Im}\, p=\mathrm{Vect}\big((1\,;0\,;0)\,;(0\,;1\,;0)\big)}$$
     Ces deux sous-espaces sont bien supplémentaires : $(x\,;y\,;z)=(x\,;y\,;0)+(0\,;0\,;z)$, de façon unique.

    **2.** $p\big(p(x\,;y)\big)=p\left(\dfrac{x+y}{2} \,;\, \dfrac{x+y}{2}\right)=\left(\dfrac{x+y}{2} \,;\, \dfrac{x+y}{2}\right)=p(x\,;y)$ : c'est un projecteur. 
    $$\boxed{\mathrm{Ker}\, p=\mathrm{Vect}\big((1\,;-1)\big) \qquad \mathrm{Im}\, p=\mathrm{Vect}\big((1\,;1)\big)}$$
     Deux droites distinctes du plan sont supplémentaires ✓

    **3.** $p\big(p(x\,;y\,;z)\big)=p(x+z \,;\, y+z \,;\, 0)=(x+z \,;\, y+z \,;\, 0)=p(x\,;y\,;z)$ : c'est un projecteur.

    Son noyau est donné par $x+z=0$ et $y+z=0$, soit $(x\,;y\,;z)=t\,(-1\,;-1\,;1)$. 
    $$\boxed{\mathrm{Ker}\, p=\mathrm{Vect}\big((1\,;1\,;-1)\big) \qquad \mathrm{Im}\, p=\big\{(a\,;b\,;c) \;\big|\; c=0\big\}}$$
     *Vérification du théorème 2 :* $(x\,;y\,;z)=(x+z \,;\, y+z \,;\, 0)+z\,(-1\,;-1\,;1)$, le second terme appartenant à $\mathrm{Ker}\, p$ ✓

    **4.** $f\big(f(x\,;y)\big)=f(x\,;2y)=(x\,;4y)$, qui diffère de $f(x\,;y)=(x\,;2y)$ dès que $y \neq 0$. 
    $$\boxed{f \text{ n'est pas un projecteur.}}$$

    **B. Symétries.**

    **1.** $s\big(s(x\,;y)\big)=s(y\,;x)=(x\,;y)$ : c'est une symétrie. Les invariants vérifient $y=x$, les vecteurs opposés à leur image vérifient $y=-x$. 
    $$\boxed{\mathrm{Ker}\,(s-\mathrm{Id})=\mathrm{Vect}\big((1\,;1)\big) \qquad \mathrm{Ker}\,(s+\mathrm{Id})=\mathrm{Vect}\big((1\,;-1)\big)}$$

    **2.** $s\big(s(x\,;y\,;z)\big)=s(x\,;y\,;-z)=(x\,;y\,;z)$ : c'est une symétrie. Les invariants vérifient $-z=z$, donc $z=0$ ; les autres vérifient $x=-x$ et $y=-y$. 
    $$\boxed{\mathrm{Ker}\,(s-\mathrm{Id})=\big\{(x\,;y\,;0)\big\} \qquad \mathrm{Ker}\,(s+\mathrm{Id})=\mathrm{Vect}\big((0\,;0\,;1)\big)}$$

    **3.** $s\big(s(x\,;y)\big)=s(x+2y \,;\, -y)=\big(x+2y-2y \,;\, y\big)=(x\,;y)$ : c'est une symétrie. Les invariants vérifient $-y=y$, donc $y=0$ ; les autres vérifient $x+2y=-x$, soit $y=-x$. 
    $$\boxed{\mathrm{Ker}\,(s-\mathrm{Id})=\mathrm{Vect}\big((1\,;0)\big) \qquad \mathrm{Ker}\,(s+\mathrm{Id})=\mathrm{Vect}\big((1\,;-1)\big)}$$

    **4.** $g\big(g(x\,;y)\big)=g(2x\,;-y)=(4x\,;y)$, qui diffère de $(x\,;y)$ dès que $x \neq 0$. 
    $$\boxed{g \text{ n'est pas une symétrie.}}$$
- id: "ap-07-17"
  feuille: "f-ap-07"
  numero: 17
  partie: "Projecteurs et symétries"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [composition, projecteurs]
  noeuds: [a-anneau, v-somme-directe]
  notions: [supplementaire]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Soit $p$ un projecteur d'un $K$-espace vectoriel $E$, et l'on pose $q=\mathrm{Id}_{E}-p$.

    **1.** Démontrer que $q$ est un projecteur.

    **2.** Démontrer que $\mathrm{Ker}\, q = \mathrm{Im}\, p$ et que $\mathrm{Im}\, q = \mathrm{Ker}\, p$.

    **3.** Démontrer que $p \circ q = q \circ p = 0$.

    **4.** Interpréter géométriquement : que fait $q$ lorsque $p$ est la projection sur $D$ parallèlement à $\Delta$ ?
  corrige: |
    **1.** On développe dans l'anneau $\mathcal{L}(E)$, en utilisant $p \circ p = p$ : 
    $$q \circ q=(\mathrm{Id}-p) \circ (\mathrm{Id}-p)=\mathrm{Id}-p-p+p \circ p=\mathrm{Id}-2p+p=\mathrm{Id}-p=q$$

    $$\boxed{q \text{ est un projecteur.}}$$

    **2.** *Noyau de $q$.* On a $q(x)=0_{E}$ si et seulement si $x=p(x)$, c'est-à-dire si $x$ est invariant par $p$. Or le théorème 2 identifie l'ensemble des vecteurs invariants par $p$ à $\mathrm{Im}\, p$.

    *Image de $q$.* Pour tout $x$, $p\big(q(x)\big)=p(x)-p\big(p(x)\big)=0_{E}$, donc $\mathrm{Im}\, q \subset \mathrm{Ker}\, p$. Réciproquement, si $x \in \mathrm{Ker}\, p$, alors $q(x)=x-0_{E}=x$, donc $x \in \mathrm{Im}\, q$. 
    $$\boxed{\mathrm{Ker}\, q=\mathrm{Im}\, p \qquad\text{et}\qquad \mathrm{Im}\, q=\mathrm{Ker}\, p}$$

    **3.** On développe, en utilisant à nouveau $p \circ p = p$ : 
    $$p \circ q=p \circ (\mathrm{Id}-p)=p-p \circ p=p-p=0$$
     et le calcul dans l'autre ordre donne le même résultat. 
    $$\boxed{p \circ q=q \circ p=0}$$

    **4.** L'interprétation est immédiate : 
    $$\boxed{\text{Si } p \text{ projette sur } D \text{ parallèlement à } \Delta, \text{ alors } q \text{ projette sur } \Delta \text{ parallèlement à } D.}$$
     L'égalité $p(x)+q(x)=x$ n'est autre que la décomposition de $x$ sur les deux sous-espaces supplémentaires : $p$ en fournit une composante, $q$ l'autre.
- id: "ap-07-18"
  feuille: "f-ap-07"
  numero: 18
  partie: "Projecteurs et symétries"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [projecteurs, symétries]
  noeuds: [v-somme-directe]
  notions: [supplementaire]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Soit $s$ une symétrie d'un $\mathbb{R}$-espace vectoriel $E$, et l'on pose $p=\dfrac{1}{2}\big(s+\mathrm{Id}_{E}\big)$.

    **1.** Vérifier que $p$ est un projecteur, conformément à la proposition 4.

    **2.** Démontrer que $\mathrm{Im}\, p = \mathrm{Ker}\,(s-\mathrm{Id}_{E})$ et que $\mathrm{Ker}\, p = \mathrm{Ker}\,(s+\mathrm{Id}_{E})$.

    **3.** En déduire que $E=\mathrm{Ker}\,(s-\mathrm{Id}_{E}) \oplus \mathrm{Ker}\,(s+\mathrm{Id}_{E})$.

    **4.** Application : on pose $s(x\,;y\,;z)=(z \,;\, y \,;\, x)$. Vérifier que $s$ est une symétrie, puis déterminer les deux sous-espaces précédents et vérifier qu'ils sont supplémentaires dans $\mathbb{R}^{3}$.
  corrige: |
    **1.** On développe, en utilisant $s \circ s = \mathrm{Id}$ : 
    $$p \circ p=\frac{1}{4}(s+\mathrm{Id}) \circ (s+\mathrm{Id})=\frac{1}{4}\big(s \circ s+2s+\mathrm{Id}\big)=\frac{1}{4}\big(2s+2\,\mathrm{Id}\big)=\frac{1}{2}\big(s+\mathrm{Id}\big)=p$$

    $$\boxed{p \text{ est un projecteur.}}$$

    **2.** D'après le théorème 2, $\mathrm{Im}\, p$ est l'ensemble des vecteurs invariants par $p$. Or : 
    $$p(x)=x \iff \frac{1}{2}\big(s(x)+x\big)=x \iff s(x)=x \iff x \in \mathrm{Ker}\,(s-\mathrm{Id})$$
     Et pour le noyau : 
    $$p(x)=0_{E} \iff s(x)+x=0_{E} \iff s(x)=-x \iff x \in \mathrm{Ker}\,(s+\mathrm{Id})$$

    $$\boxed{\mathrm{Im}\, p=\mathrm{Ker}\,(s-\mathrm{Id}) \qquad\text{et}\qquad \mathrm{Ker}\, p=\mathrm{Ker}\,(s+\mathrm{Id})}$$

    **3.** Le théorème 2 donne $E=\mathrm{Ker}\, p \oplus \mathrm{Im}\, p$, et la question 2 identifie ces deux sous-espaces. 
    $$\boxed{E=\mathrm{Ker}\,(s-\mathrm{Id}) \oplus \mathrm{Ker}\,(s+\mathrm{Id})}$$
     Autrement dit, tout vecteur se décompose de façon unique en une partie invariante et une partie changée en son opposé. La décomposition paires/impaires du chapitre 6 en est le cas particulier $s : f \mapsto \big(x \mapsto f(-x)\big)$.

    **4.** On vérifie d'abord : $s\big(s(x\,;y\,;z)\big)=s(z\,;y\,;x)=(x\,;y\,;z)$, donc $s$ est bien une symétrie.

    *Vecteurs invariants.* L'égalité $(z\,;y\,;x)=(x\,;y\,;z)$ équivaut à $z=x$, la coordonnée $y$ restant libre : 
    $$\mathrm{Ker}\,(s-\mathrm{Id})=\big\{(a\,;b\,;a)\big\}=\mathrm{Vect}\big((1\,;0\,;1)\,;(0\,;1\,;0)\big)$$

    *Vecteurs opposés à leur image.* L'égalité $(z\,;y\,;x)=(-x\,;-y\,;-z)$ équivaut à $z=-x$ et $y=0$ : 
    $$\mathrm{Ker}\,(s+\mathrm{Id})=\mathrm{Vect}\big((1\,;0\,;-1)\big)$$

    *Supplémentarité.* Le vecteur $(1\,;0\,;-1)$ ne vérifie pas $z=x$, donc l'intersection des deux sous-espaces est réduite au vecteur nul. Et pour tout $(x\,;y\,;z)$ : 
    $$(x\,;y\,;z)=\underbrace{\left(\frac{x+z}{2} \,;\, y \,;\, \frac{x+z}{2}\right)}_{\in \, \mathrm{Ker}\,(s-\mathrm{Id})}+\underbrace{\left(\frac{x-z}{2} \,;\, 0 \,;\, -\frac{x-z}{2}\right)}_{\in \, \mathrm{Ker}\,(s+\mathrm{Id})}$$

    $$\boxed{\mathbb{R}^{3}=\mathrm{Ker}\,(s-\mathrm{Id}) \oplus \mathrm{Ker}\,(s+\mathrm{Id}) \text{ : un plan et une droite.}}$$
- id: "ap-07-19"
  feuille: "f-ap-07"
  numero: 19
  partie: "Projecteurs et symétries"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [applications linéaires, composition, projecteurs]
  noeuds: [v-applications, a-anneau, v-somme-directe]
  notions: [application-lineaire, supplementaire]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Le théorème 2 associe à tout projecteur un couple de sous-espaces supplémentaires. Cet exercice établit la réciproque.

    Soient $F$ et $G$ deux sous-espaces vectoriels supplémentaires de $E$. Pour $x \in E$, on note $x=x_{F}+x_{G}$ son unique décomposition, et l'on pose $p(x)=x_{F}$.

    **1.** Justifier que $p$ est bien définie.

    **2.** Démontrer que $p$ est linéaire.

    **3.** Démontrer que $p \circ p = p$.

    **4.** Déterminer $\mathrm{Ker}\, p$ et $\mathrm{Im}\, p$.

    **5.** Conclure : décrire la correspondance entre projecteurs de $E$ et couples de sous-espaces supplémentaires.

    **6.** Application : dans $\mathbb{R}^{3}$, on pose $F=\big\{(x\,;y\,;z) \;\big|\; x+y+z=0\big\}$ et $G=\mathrm{Vect}\big((1\,;1\,;1)\big)$, dont on a montré au chapitre 6 qu'ils sont supplémentaires. Expliciter le projecteur sur $F$ parallèlement à $G$.
  corrige: |
    **1.** Les sous-espaces $F$ et $G$ étant supplémentaires, tout vecteur $x$ de $E$ s'écrit $x=x_{F}+x_{G}$ avec $x_{F} \in F$ et $x_{G} \in G$, et cette écriture est *unique*. Le vecteur $x_{F}$ est donc déterminé sans ambiguïté par $x$. 
    $$\boxed{p \text{ est bien définie.}}$$

    **2.** Soient $\lambda \in K$ et $x$, $y \in E$, de décompositions $x=x_{F}+x_{G}$ et $y=y_{F}+y_{G}$. Alors : 
    $$\lambda x+y=\underbrace{\big(\lambda x_{F}+y_{F}\big)}_{\in \, F}+\underbrace{\big(\lambda x_{G}+y_{G}\big)}_{\in \, G}$$
     puisque $F$ et $G$ sont des sous-espaces vectoriels. Par unicité de la décomposition, c'est *la* décomposition de $\lambda x+y$, d'où : 
    $$p(\lambda x+y)=\lambda x_{F}+y_{F}=\lambda\,p(x)+p(y)$$

    $$\boxed{p \text{ est linéaire.}}$$

    **3.** Soit $x \in E$. Le vecteur $p(x)=x_{F}$ appartient à $F$, donc sa décomposition est $x_{F}+0_{E}$, avec $0_{E} \in G$. Par conséquent : 
    $$p\big(p(x)\big)=x_{F}=p(x) \qquad\text{d'où}\qquad \boxed{p \circ p = p}$$

    **4.** Par construction $\mathrm{Im}\, p \subset F$ ; et tout $x \in F$ vérifie $p(x)=x$, donc $F \subset \mathrm{Im}\, p$. Par ailleurs $p(x)=0_{E}$ équivaut à $x_{F}=0_{E}$, c'est-à-dire $x=x_{G} \in G$. 
    $$\boxed{\mathrm{Im}\, p=F \qquad\text{et}\qquad \mathrm{Ker}\, p=G}$$

    **5.** On peut donc énoncer la correspondance : 
    $$\boxed{\begin{array}{l} \text{À tout projecteur } p \text{ correspond le couple de supplémentaires } (\mathrm{Im}\, p \,;\, \mathrm{Ker}\, p), \\[1mm] \text{et à tout couple de supplémentaires } (F\,;G) \text{ correspond la projection sur } F \\[1mm] \text{parallèlement à } G. \text{ Ces deux constructions sont réciproques l'une de l'autre.} \end{array}}$$

    **6.** Le chapitre 6 a établi la décomposition, avec $s=\dfrac{x+y+z}{3}$ : 
    $$(x\,;y\,;z)=\underbrace{(x-s \,;\, y-s \,;\, z-s)}_{\in \, F}+\underbrace{(s\,;s\,;s)}_{\in \, G}$$
     Le projecteur cherché est donc $p(x\,;y\,;z)=(x-s \,;\, y-s \,;\, z-s)$, soit : 
    $$\boxed{p(x\,;y\,;z)=\left(\frac{2x-y-z}{3} \,;\, \frac{-x+2y-z}{3} \,;\, \frac{-x-y+2z}{3}\right)}$$
     On retrouvera exactement cette application à l'exercice 21, obtenue cette fois par un tout autre chemin.
- id: "ap-07-20"
  feuille: "f-ap-07"
  numero: 20
  titre: "Vrai ou faux"
  partie: "Exercices de synthèse"
  etoiles: 0
  types: [Vrai ou faux]
  mots_cles: [applications linéaires, noyau, injectivité et surjectivité, projecteurs, symétries]
  noeuds: [v-applications, v-somme-directe]
  notions: [application-lineaire, noyau, supplementaire]
  page_enonce: 5
  page_corrige: 12
  enonce: |
    Pour chaque affirmation, dire si elle est vraie ou fausse en justifiant la réponse. Dans tout l'exercice, $f$ désigne une application linéaire de $E$ dans $F$.

    **1.** Une application linéaire envoie le vecteur nul sur le vecteur nul.

    **2.** Toute application vérifiant $f(0_{E})=0_{F}$ est linéaire.

    **3.** Le noyau de $f$ est un sous-espace vectoriel de $E$.

    **4.** L'image de $f$ est un sous-espace vectoriel de $E$.

    **5.** L'application $f$ est injective si et seulement si son noyau est réduit au vecteur nul.

    **6.** L'anneau $\mathcal{L}(E)$ est commutatif.

    **7.** La composée de deux applications linéaires est linéaire.

    **8.** Si $p$ est un projecteur, alors $\mathrm{Im}\, p$ est l'ensemble des vecteurs invariants par $p$.

    **9.** Tout projecteur est bijectif.

    **10.** Toute symétrie $s$ est bijective, et $s^{-1}=s$.
  corrige: |
    **1.** $\boxed{\textbf{Vraie}}$ C'est la remarque qui suit la proposition 1, obtenue en prenant $\lambda=-1_{K}$ et $y=x$ dans la caractérisation.

    **2.** $\boxed{\textbf{Fausse}}$ L'application $x \mapsto x^{2}$ de $\mathbb{R}$ dans $\mathbb{R}$ envoie $0$ sur $0$ sans être linéaire (exercice 1). Le test du vecteur nul élimine, il ne valide pas.

    **3.** $\boxed{\textbf{Vraie}}$ C'est la proposition 2.

    **4.** $\boxed{\textbf{Fausse}}$ L'image est un sous-espace vectoriel de $F$, l'espace d'*arrivée*. L'exercice 6 en donne plusieurs illustrations, où $E$ et $F$ ne sont même pas de même nature.

    **5.** $\boxed{\textbf{Vraie}}$ C'est le théorème 1, et c'est lui que l'on utilise en pratique.

    **6.** $\boxed{\textbf{Fausse}}$ L'exercice 12 fournit deux contre-exemples, dont le couple $(D\,;M)$ pour lequel $D \circ M-M \circ D=\mathrm{Id}$.

    **7.** $\boxed{\textbf{Vraie}}$ C'est le deuxième point de la proposition 3.

    **8.** $\boxed{\textbf{Vraie}}$ C'est la seconde affirmation du théorème 2, dont la démonstration du cours établit les deux inclusions.

    **9.** $\boxed{\textbf{Fausse}}$ Un projecteur bijectif aurait un noyau réduit au vecteur nul, donc $E=\mathrm{Im}\, p$ et $p=\mathrm{Id}_{E}$. Tous les autres projecteurs, comme ceux de l'exercice 16, ne sont pas injectifs.

    **10.** $\boxed{\textbf{Vraie}}$ L'égalité $s \circ s=\mathrm{Id}_{E}$ montre que $s$ est bijective et qu'elle est sa propre réciproque, exactement comme les involutions du chapitre 3.
- id: "ap-07-21"
  feuille: "f-ap-07"
  numero: 21
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [endomorphismes, injectivité et surjectivité, composition, projecteurs]
  noeuds: [v-applications, a-anneau, v-somme-directe]
  notions: [supplementaire]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    On considère l'application définie sur $\mathbb{R}^{3}$ par : 
    $$f(x\,;y\,;z)=\big(2x-y-z \,;\, -x+2y-z \,;\, -x-y+2z\big)$$

    **1.** Démontrer que $f$ est un endomorphisme de $\mathbb{R}^{3}$.

    **2.** Déterminer $\mathrm{Ker}\, f$. L'application $f$ est-elle injective ?

    **3.** Démontrer que $\mathrm{Im}\, f$ est contenue dans le plan d'équation $a+b+c=0$, puis qu'elle lui est égale.

    **4.** Vérifier que $\mathrm{Ker}\, f$ et $\mathrm{Im}\, f$ sont supplémentaires dans $\mathbb{R}^{3}$. On pourra invoquer un résultat du chapitre 6.

    **5.** Calculer $f \circ f$ et démontrer que $f \circ f = 3f$. En déduire que $p=\dfrac{1}{3}f$ est un projecteur.

    **6.** Identifier géométriquement $p$ : sur quel sous-espace projette-t-il, et parallèlement à quoi ?
  corrige: |
    **1.** Chaque coordonnée de $f(x\,;y\,;z)$ est une expression linéaire homogène en $x$, $y$ et $z$ : la linéarité se vérifie coordonnée par coordonnée. 
    $$\boxed{f \in \mathcal{L}\big(\mathbb{R}^{3}\big)}$$

    **2.** On résout le système $f(x\,;y\,;z)=(0\,;0\,;0)$ : 
    $$\left\{\begin{array}{l} 2x-y-z=0 \\ -x+2y-z=0 \\ -x-y+2z=0 \end{array}\right.$$
     En soustrayant la deuxième ligne à la première : $3x-3y=0$, donc $x=y$. La première devient alors $2x-x-z=0$, soit $z=x$. La troisième est alors automatiquement vérifiée : $-x-x+2x=0$. 
    $$\boxed{\mathrm{Ker}\, f=\mathrm{Vect}\big((1\,;1\,;1)\big)}$$
     Ce noyau n'est pas réduit au vecteur nul : $\boxed{f \text{ n'est pas injective.}}$

    **3.** La somme des trois coordonnées de $f(x\,;y\,;z)$ vaut : 
    $$(2x-y-z)+(-x+2y-z)+(-x-y+2z)=0$$
     donc $\mathrm{Im}\, f \subset \mathcal{P}$, où $\mathcal{P}$ est le plan d'équation $a+b+c=0$. Réciproquement, $f(1\,;0\,;0)=(2\,;-1\,;-1)$ et $f(0\,;1\,;0)=(-1\,;2\,;-1)$ appartiennent à $\mathcal{P}$ et ne sont pas colinéaires : ils engendrent donc le plan tout entier. 
    $$\boxed{\mathrm{Im}\, f=\big\{(a\,;b\,;c) \in \mathbb{R}^{3} \;\big|\; a+b+c=0\big\}}$$

    **4.** On reconnaît exactement les deux sous-espaces $G=\mathrm{Vect}\big((1\,;1\,;1)\big)$ et $F=\{x+y+z=0\}$ du chapitre 6, dont l'exercice 11 a établi qu'ils sont supplémentaires dans $\mathbb{R}^{3}$. 
    $$\boxed{\mathbb{R}^{3}=\mathrm{Ker}\, f \oplus \mathrm{Im}\, f}$$

    **5.** On remarque d'abord que, pour tout $(x\,;y\,;z)$ : 
    $$f(x\,;y\,;z)=3\,(x\,;y\,;z)-(x+y+z)\,(1\,;1\,;1)$$
     En appliquant $f$ et en utilisant que $(1\,;1\,;1)$ appartient au noyau : 
    $$f\big(f(x\,;y\,;z)\big)=3\,f(x\,;y\,;z)-\big(\text{somme des coordonnées de } f(x\,;y\,;z)\big)\,(1\,;1\,;1)=3\,f(x\,;y\,;z)$$
     la somme en question étant nulle d'après la question 3. 
    $$\boxed{f \circ f = 3f}$$
     En posant $p=\dfrac{1}{3}f$, il vient alors : 
    $$p \circ p=\frac{1}{9}\,(f \circ f)=\frac{1}{9} \times 3f=\frac{1}{3}f=p \qquad\text{d'où}\qquad \boxed{p \text{ est un projecteur.}}$$

    **6.** Comme $p=\frac{1}{3}f$, on a $\mathrm{Ker}\, p=\mathrm{Ker}\, f$ et $\mathrm{Im}\, p=\mathrm{Im}\, f$. 
    $$\boxed{\begin{array}{l} p \text{ est la projection sur le plan d'équation } x+y+z=0, \\[1mm] \text{parallèlement à la droite } \mathrm{Vect}\big((1\,;1\,;1)\big). \end{array}}$$
     C'est exactement l'application obtenue à la question 6 de l'exercice 19, où elle avait été construite à partir de la décomposition. Les deux chemins — l'un par le théorème 2, l'autre par sa réciproque — mènent au même endomorphisme.
- id: "ap-07-22"
  feuille: "f-ap-07"
  numero: 22
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [composition, projecteurs]
  noeuds: [a-anneau, v-somme-directe]
  notions: [supplementaire]
  page_enonce: 6
  page_corrige: 14
  enonce: |
    Soient $p$ et $q$ deux projecteurs d'un $\mathbb{R}$-espace vectoriel $E$.

    **1.** Démontrer que si $p \circ q = q \circ p = 0$, alors $p+q$ est un projecteur.

    **2.** On suppose désormais que $p+q$ est un projecteur. En développant $(p+q) \circ (p+q)$, démontrer que : 
    $$p \circ q+q \circ p = 0$$

    **3.** En composant cette égalité à gauche par $p$, puis à droite par $p$, démontrer successivement que $p \circ q = q \circ p$, puis que $p \circ q = q \circ p = 0$.

    **4.** Conclure par une équivalence.

    **5.** Application : vérifier ce résultat sur les projecteurs $p(x\,;y)=(x\,;0)$ et $q(x\,;y)=(0\,;y)$ de $\mathbb{R}^{2}$.
  corrige: |
    **1.** On développe dans l'anneau $\mathcal{L}(E)$, en utilisant $p \circ p=p$ et $q \circ q=q$ : 
    $$(p+q) \circ (p+q)=p \circ p+p \circ q+q \circ p+q \circ q=p+0+0+q=p+q$$

    $$\boxed{p+q \text{ est un projecteur.}}$$

    **2.** Le même développement, sans hypothèse cette fois, donne : 
    $$(p+q) \circ (p+q)=p+p \circ q+q \circ p+q$$
     Si $p+q$ est un projecteur, ce membre vaut $p+q$, et il reste : 
    $$\boxed{p \circ q+q \circ p=0}$$

    **3.** Composons cette égalité à gauche par $p$, en utilisant $p \circ p=p$ : 
    $$p \circ p \circ q+p \circ q \circ p=0 \qquad\text{c'est-à-dire}\qquad p \circ q+p \circ q \circ p=0 \tag{i}$$
     Composons-la maintenant à droite par $p$ : 
    $$p \circ q \circ p+q \circ p \circ p=0 \qquad\text{c'est-à-dire}\qquad p \circ q \circ p+q \circ p=0 \tag{ii}$$
     En soustrayant $(ii)$ à $(i)$, le terme $p \circ q \circ p$ disparaît : 
    $$\boxed{p \circ q=q \circ p}$$
     En reportant dans la question 2, il vient $2\,p \circ q=0$, et le corps étant $\mathbb{R}$ : 
    $$\boxed{p \circ q=q \circ p=0}$$

    **4.** Les deux questions précédentes se rassemblent : 
    $$\boxed{p+q \text{ est un projecteur} \iff p \circ q = q \circ p = 0}$$

    **5.** L'exercice 11 a établi $p \circ q=q \circ p=0$ pour ces deux applications, et l'on a $p+q=\mathrm{Id}_{\mathbb{R}^{2}}$, qui est bien un projecteur puisque $\mathrm{Id} \circ \mathrm{Id}=\mathrm{Id}$. 
    $$\boxed{\text{L'équivalence est vérifiée.}}$$
     Géométriquement, $p$ projette sur l'axe des abscisses parallèlement à l'axe des ordonnées, et $q$ fait l'inverse : leurs images sont supplémentaires, et leur somme reconstitue tout vecteur.

