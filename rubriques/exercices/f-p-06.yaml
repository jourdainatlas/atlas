  enonce: |
    On considère un triangle $ABC$ quelconque non plat. On note $a$, $b$ et $c$ les longueurs de ses trois côtés, et $\alpha$, $\beta$ et $\gamma$ les mesures de ses trois angles, comme indiqué sur le schéma ci-dessous. On suppose de plus que les angles $\beta$ et $\gamma$ sont aigus.

    ![Figure](documents/figures/084907f35b356d3d.svg)

    **1.** Tracer la hauteur issue de $A$ dans le triangle $ABC$. On notera $H$ le pied de cette hauteur.

    **2.** **(a)** Exprimer $AH$ en fonction de $c$ et de $\sin(\beta)$.

    **(b)** En déduire la formule $\mathcal{A}=\dfrac{1}{2}ac\sin(\beta)$, où $\mathcal{A}$ désigne l'aire du triangle $ABC$.

    **(c)** En exprimant cette aire à l'aide des deux autres angles, en déduire la loi des sinus : 
    $$\frac{\sin(\alpha)}{a}=\frac{\sin(\beta)}{b}=\frac{\sin(\gamma)}{c}$$

    **3.** **(a)** Exprimer $BH$ en fonction de $c$ et de $\cos(\beta)$, puis $CH$ en fonction de $a$, $c$ et $\cos(\beta)$.

    **(b)** Écrire l'égalité de Pythagore dans le triangle $AHC$.

    **(c)** En déduire la formule d'Al-Kashi, aussi appelée théorème de Pythagore généralisé : 
    $$b^{2}=a^{2}+c^{2}-2ac\cos(\beta)$$

    **4.** *Application :* on considère un triangle $ABC$ tel que $a=BC=8$, $c=AB=3$ et $\widehat{BAC}=83^{\circ}$.

    Calculer la longueur $AC$, arrondie au centième, puis les mesures en degrés, arrondies au dixième, des angles $\widehat{ACB}$ et $\widehat{ABC}$.

    **5.** Que devient la formule d'Al-Kashi lorsque $\beta=\dfrac{\pi}{2}$ ? Quel théorème retrouve-t-on ainsi, et pourquoi parle-t-on de « théorème de Pythagore généralisé » ?
  corrige: |
    **1.** La hauteur issue de $A$ coupe perpendiculairement $(BC)$ en $H$. Les angles $\beta$ et $\gamma$ étant aigus, le point $H$ appartient bien au *segment* $[BC]$.

    ![Figure](documents/figures/274961b1f792e58e.svg)

    **2.** **(a)** Le triangle $ABH$ est rectangle en $H$. Dans ce triangle, l'angle en $B$ vaut $\beta$, le côté opposé est $[AH]$ et l'hypoténuse est $[AB]$, de longueur $c$. Donc : 
    $$\sin(\beta)=\frac{AH}{AB}=\frac{AH}{c} \qquad \text{d'où} \qquad \boxed{AH=c\sin(\beta)}$$

    **(b)** L'aire d'un triangle vaut la moitié du produit d'un côté par la hauteur associée. En prenant $[BC]$ comme base, de longueur $a$, et $AH$ comme hauteur : 
    $$\mathcal{A}=\frac{1}{2}\times BC\times AH=\frac{1}{2}\times a\times c\sin(\beta) =\boxed{\frac{1}{2}ac\sin(\beta)}$$

    **(c)** On procède de la même manière avec les hauteurs issues de $B$ puis de $C$, ce qui fait intervenir les deux autres angles : 
    $$\mathcal{A}=\frac{1}{2}ab\sin(\gamma) \qquad \text{et} \qquad \mathcal{A}=\frac{1}{2}bc\sin(\alpha)$$
     Ces trois expressions désignent la même aire, donc : 
    $$\frac{1}{2}ac\sin(\beta)=\frac{1}{2}ab\sin(\gamma)=\frac{1}{2}bc\sin(\alpha)$$
     Il suffit alors de diviser les trois membres par $\dfrac{1}{2}abc$, qui est non nul puisque le triangle n'est pas plat : 
    $$\boxed{\frac{\sin(\alpha)}{a}=\frac{\sin(\beta)}{b}=\frac{\sin(\gamma)}{c}}$$

    **3.** **(a)** Toujours dans le triangle $ABH$ rectangle en $H$, le côté adjacent à $\beta$ est $[BH]$ : 
    $$\cos(\beta)=\frac{BH}{AB}=\frac{BH}{c} \qquad \text{d'où} \qquad \boxed{BH=c\cos(\beta)}$$
     Comme $H$ appartient au segment $[BC]$, on a $CH=BC-BH$, soit : 
    $$\boxed{CH=a-c\cos(\beta)}$$

    **(b)** Le triangle $AHC$ est rectangle en $H$, d'hypoténuse $[AC]$ de longueur $b$ : 
    $$\boxed{AC^{2}=AH^{2}+CH^{2}} \qquad \text{c'est-à-dire} \qquad b^{2}=AH^{2}+CH^{2}$$

    **(c)** On remplace $AH$ et $CH$ par les expressions obtenues : 
    $$\begin{aligned} b^{2} &= \left(c\sin(\beta)\right)^{2}+\left(a-c\cos(\beta)\right)^{2} \\ &= c^{2}\sin^{2}(\beta)+a^{2}-2ac\cos(\beta)+c^{2}\cos^{2}(\beta) \\ &= c^{2}\underbrace{\left(\sin^{2}(\beta)+\cos^{2}(\beta)\right)}_{=\,1} +a^{2}-2ac\cos(\beta) \end{aligned}$$

    $$\boxed{b^{2}=a^{2}+c^{2}-2ac\cos(\beta)}$$
     C'est la relation fondamentale du chapitre qui fait disparaître d'un coup les deux termes en $c^{2}$.

    **4.** On connaît $a=8$, $c=3$ et l'angle $\alpha=\widehat{BAC}=83^{\circ}$. La formule d'Al-Kashi, écrite cette fois *relativement au sommet $A$*, s'écrit : 
    $$a^{2}=b^{2}+c^{2}-2bc\cos(\alpha)$$
     soit, en remplaçant : 
    $$64=b^{2}+9-6b\cos(83^{\circ}) \iff b^{2}-6\cos(83^{\circ})\,b-55=0$$
     C'est une équation du second degré en $b$, avec $6\cos(83^{\circ})\approx 0{,}7312$ : 
    $$\Delta\approx 0{,}7312^{2}+4\times 55\approx 220{,}53 \qquad \text{d'où} \qquad \sqrt{\Delta}\approx 14{,}850$$

    $$b\approx \frac{0{,}7312+14{,}850}{2}\approx 7{,}79 \qquad \text{(la seconde racine est négative, donc rejetée)}$$

    $$\boxed{AC\approx 7{,}79}$$
     On détermine ensuite les angles par la loi des sinus : 
    $$\frac{\sin(\gamma)}{c}=\frac{\sin(\alpha)}{a} \quad \Longrightarrow \quad \sin(\gamma)=\frac{3\sin(83^{\circ})}{8}\approx 0{,}3722$$
     Le côté $a=8$ étant le plus grand, l'angle $\alpha$ est le plus grand du triangle : $\gamma$ est donc aigu, et la calculatrice donne directement : 
    $$\boxed{\widehat{ACB}\approx 21{,}9^{\circ}}$$
     Enfin, la somme des angles d'un triangle vaut $180^{\circ}$ : 
    $$\widehat{ABC}\approx 180-83-21{,}9 \qquad \text{soit} \qquad \boxed{\widehat{ABC}\approx 75{,}1^{\circ}}$$

    **5.** Si $\beta=\dfrac{\pi}{2}$, alors $\cos(\beta)=0$ et le dernier terme disparaît : 
    $$b^{2}=a^{2}+c^{2}$$
     On retrouve exactement le **théorème de Pythagore** dans le triangle $ABC$ rectangle en $B$, l'hypoténuse étant alors $[AC]$. C'est ce qui justifie le nom de « théorème de Pythagore généralisé » : le terme $-2ac\cos(\beta)$ mesure précisément *l'écart à l'angle droit*. Il est négatif si $\beta$ est aigu (et alors $b^{2}<a^{2}+c^{2}$), positif si $\beta$ est obtus.
- id: "p-06-30"
  feuille: "f-p-06"
  numero: 30
  titre: "Approximation de $\\pi$ par la méthode d'Archimède"
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Algorithmique, Lecture graphique, Problème, Calcul]
  mots_cles: [cosinus, sinus, tangente, relation cos² + sin² = 1, histoire, Python]
  noeuds: [cx-exponentielle]
  notions: []
  page_enonce: 10
  page_corrige: 28
  enonce: |
    Dans un texte intitulé « De la mesure du cercle », Archimède imagine la première méthode jamais proposée permettant, en théorie, le calcul de $\pi$ avec une précision aussi grande qu'on le souhaite.

    Soit $\mathcal{C}$ un cercle de rayon $1$. Pour tout entier $n\geqslant 1$, on construit deux polygones réguliers $P_{n}$ et $Q_{n}$ ayant chacun $3\times 2^{n}$ côtés, $P_{n}$ étant inscrit dans $\mathcal{C}$ et $Q_{n}$ exinscrit à $\mathcal{C}$ (voir la figure ci-contre, tracée pour $n=1$).

    Le périmètre du cercle, égal à $2\pi$, est encadré par ceux des deux polygones. On note $p_{n}$ et $q_{n}$ les demi-périmètres respectifs de $P_{n}$ et $Q_{n}$, de sorte que : 
    $$p_{n}<\pi<q_{n}$$

    ![Figure](documents/figures/eb81a8de1b8a7f41.svg)

    **1.** **Le cas $n=1$.**

    Montrer que $p_{1}=3$ et $q_{1}=2\sqrt{3}$. En déduire un premier encadrement de $\pi$.

    **2.** **Expression de $p_{n}$ et $q_{n}$.**

    **(a)** Déterminer, en fonction de $n$, la mesure $\alpha_{n}$ de l'angle au centre qui intercepte l'un des côtés de $P_{n}$.

    **(b)** En considérant un seul côté et le triangle isocèle qu'il forme avec le centre $O$, démontrer les relations : 
    $$p_{n}=3\times 2^{n}\sin\left(\frac{\pi}{3\times 2^{n}}\right) \qquad \text{et} \qquad q_{n}=3\times 2^{n}\tan\left(\frac{\pi}{3\times 2^{n}}\right)$$

    **(c)** Vérifier que ces formules redonnent bien les valeurs de la question 1.

    **3.** **Relations de récurrence.**

    **(a)** On pose $\beta_{n}=\dfrac{\pi}{3\times 2^{n+1}}$. Exprimer $p_{n}$, $q_{n}$, $p_{n+1}$ et $q_{n+1}$ en fonction de $n$ et de $\beta_{n}$.

    **(b)** On admet que pour tout réel $a$, $\sin(2a)=2\sin(a)\cos(a)$ et $1+\cos(2a)=2\cos^{2}(a)$. En déduire que pour tout entier $n\geqslant 1$ : 
    $$\frac{1}{q_{n+1}}=\frac{1}{2}\left(\frac{1}{p_{n}}+\frac{1}{q_{n}}\right) \qquad \text{et} \qquad p_{n+1}=\sqrt{p_{n}\,q_{n+1}}$$

    **(c)** Calculer $q_{2}$ puis $p_{2}$ à l'aide de ces relations. Quelle est alors la précision obtenue sur $\pi$ ?

    **(d)** À l'aide de l'exercice 28, retrouver les valeurs exactes $p_{2}=3\left(\sqrt{6}-\sqrt{2}\right)$ et $q_{2}=24-12\sqrt{3}$.

    **4.** **Algorithme.**

    **(a)** Recopier et compléter l'algorithme ci-dessous, qui calcule les valeurs successives de $p_{n}$ et $q_{n}$ jusqu'à obtenir un encadrement de $\pi$ d'amplitude inférieure à un réel $e>0$ donné.

    **Entrée :** un réel $e>0$

    $p \leftarrow 3$

    $q \leftarrow 2\sqrt{3}$

    $n \leftarrow 1$

    **Tant que** $\dots\dots\dots$ **faire**

    $q \leftarrow \dots\dots\dots$

    $p \leftarrow \dots\dots\dots$

    $n \leftarrow n+1$

    **Fin Tant que**

    **Sortie :** $n$, $p$, $q$

    *Attention à l'ordre des deux affectations : le calcul de $p$ utilise la nouvelle valeur de $q$.*

    **(b)** À l'aide de la calculatrice ou d'un tableur, déterminer le nombre d'itérations nécessaires pour obtenir un encadrement de $\pi$ d'amplitude inférieure à $10^{-6}$, puis donner cet encadrement.

    **(c)** Combien d'itérations supplémentaires faut-il pour gagner trois décimales, c'est-à-dire pour atteindre une amplitude inférieure à $10^{-9}$ ? Cet algorithme vous paraît-il efficace pour obtenir un grand nombre de décimales de $\pi$ ?

    **5.** **Retour au texte d'Archimède.**

    Archimède s'est arrêté aux polygones à $96$ côtés et en a tiré l'encadrement célèbre : 
    $$3+\frac{10}{71}<\pi<3+\frac{1}{7}$$

    **(a)** À quelle valeur de $n$ correspondent les polygones à $96$ côtés ?

    **(b)** Calculer $p_{n}$ et $q_{n}$ pour cette valeur de $n$, arrondis à $10^{-6}$, et les comparer à l'encadrement d'Archimède. Lequel des deux encadrements est le meilleur ?

    **(c)** Archimède ne disposait ni de la notation décimale, ni de la trigonométrie : il devait encadrer à la main chaque racine carrée apparaissant dans les calculs. Cela explique-t-il l'écart constaté ?
  corrige: |
    **1.** Pour $n=1$, les deux polygones ont $3\times 2^{1}=6$ côtés : ce sont des hexagones réguliers.

    Pour $P_{1}$, chacun des six triangles formés par le centre et un côté est isocèle avec un angle au sommet de $\dfrac{2\pi}{6}=\dfrac{\pi}{3}$ : il est donc **équilatéral**, et chaque côté mesure $1$, comme le rayon. Le périmètre vaut $6$, donc : 
    $$\boxed{p_{1}=\frac{6}{2}=3}$$
     Pour $Q_{1}$, chaque côté est tangent au cercle en son milieu, à la distance $1$ du centre. La demi-longueur d'un côté vaut $\tan\left(\dfrac{\pi}{6}\right)=\dfrac{\sqrt{3}}{3}$, donc un côté mesure $\dfrac{2\sqrt{3}}{3}$ et le périmètre $6\times\dfrac{2\sqrt{3}}{3}=4\sqrt{3}$ : 
    $$\boxed{q_{1}=\frac{4\sqrt{3}}{2}=2\sqrt{3}}$$
     On en déduit le premier encadrement : 
    $$\boxed{3<\pi<2\sqrt{3}\approx 3{,}464}$$

    **2.** **(a)** Les $3\times 2^{n}$ côtés de $P_{n}$ interceptent des angles au centre égaux, dont la somme est un tour complet. Donc : 
    $$\boxed{\alpha_{n}=\frac{2\pi}{3\times 2^{n}}}$$

    **(b)** Notons $[MN]$ un côté de $P_{n}$ et $K$ le milieu de $[MN]$. Le triangle $OMN$ est isocèle en $O$ (avec $OM=ON=1$), donc $(OK)$ en est à la fois la hauteur et la bissectrice :

    ![Figure](documents/figures/440ca5f5846d5467.svg)

    Dans le triangle $OKM$, rectangle en $K$ : 
    $$\sin\left(\frac{\alpha_{n}}{2}\right)=\frac{MK}{OM}=MK \qquad \text{donc} \qquad MN=2MK=2\sin\left(\frac{\alpha_{n}}{2}\right)$$
     Or $\dfrac{\alpha_{n}}{2}=\dfrac{\pi}{3\times 2^{n}}$. Le périmètre de $P_{n}$ est la somme de ses $3\times 2^{n}$ côtés, et $p_{n}$ en est la moitié : 
    $$p_{n}=\frac{1}{2}\times 3\times 2^{n}\times 2\sin\left(\frac{\pi}{3\times 2^{n}}\right) =\boxed{3\times 2^{n}\sin\left(\frac{\pi}{3\times 2^{n}}\right)}$$
     Le côté correspondant de $Q_{n}$ est porté par la tangente au cercle en $K'$, point du cercle situé sur $(OK)$, et il est vu du centre sous le même angle $\alpha_{n}$. La demi-longueur de ce côté est le côté opposé à l'angle $\dfrac{\alpha_{n}}{2}$ dans un triangle rectangle dont le côté adjacent vaut $OK'=1$ : 
    $$\tan\left(\frac{\alpha_{n}}{2}\right)=\frac{\text{demi-côté}}{1}$$
     d'où, par le même décompte : 
    $$q_{n}=\frac{1}{2}\times 3\times 2^{n}\times 2\tan\left(\frac{\pi}{3\times 2^{n}}\right) =\boxed{3\times 2^{n}\tan\left(\frac{\pi}{3\times 2^{n}}\right)}$$

    **(c)** Pour $n=1$, $3\times 2^{1}=6$ et $\dfrac{\pi}{6}$ : 
    $$p_{1}=6\sin\left(\frac{\pi}{6}\right)=6\times\frac{1}{2}=3 \qquad ; \qquad q_{1}=6\tan\left(\frac{\pi}{6}\right)=6\times\frac{\sqrt{3}}{3}=2\sqrt{3}$$
     On retrouve bien les valeurs de la question 1.

    **3.** **(a)** Posons $N=3\times 2^{n}$, de sorte que $\beta_{n}=\dfrac{\pi}{2N}$ et $\dfrac{\pi}{N}=2\beta_{n}$. Alors : 
    $$\boxed{p_{n}=N\sin(2\beta_{n}) \quad ; \quad q_{n}=N\tan(2\beta_{n})}$$
     Au rang suivant, le nombre de côtés double : $3\times 2^{n+1}=2N$, et l'angle correspondant est $\dfrac{\pi}{2N}=\beta_{n}$, d'où : 
    $$\boxed{p_{n+1}=2N\sin(\beta_{n}) \quad ; \quad q_{n+1}=2N\tan(\beta_{n})}$$

    **(b)** Écrivons $\beta$ au lieu de $\beta_{n}$ pour alléger. D'une part : 
    $$\frac{1}{q_{n+1}}=\frac{1}{2N\tan(\beta)}=\frac{\cos(\beta)}{2N\sin(\beta)}$$
     D'autre part, en utilisant $\sin(2\beta)=2\sin(\beta)\cos(\beta)$ puis $1+\cos(2\beta)=2\cos^{2}(\beta)$ : 
    $$\begin{aligned} \frac{1}{2}\left(\frac{1}{p_{n}}+\frac{1}{q_{n}}\right) &= \frac{1}{2}\left(\frac{1}{N\sin(2\beta)}+\frac{\cos(2\beta)}{N\sin(2\beta)}\right) = \frac{1+\cos(2\beta)}{2N\sin(2\beta)} \\ &= \frac{2\cos^{2}(\beta)}{2N\times 2\sin(\beta)\cos(\beta)} = \frac{\cos(\beta)}{2N\sin(\beta)} \end{aligned}$$
     Les deux quantités sont égales, ce qui démontre la première relation : 
    $$\boxed{\frac{1}{q_{n+1}}=\frac{1}{2}\left(\frac{1}{p_{n}}+\frac{1}{q_{n}}\right)}$$
     Pour la seconde, on calcule le produit $p_{n}\,q_{n+1}$ : 
    $$p_{n}\,q_{n+1}=N\sin(2\beta)\times 2N\tan(\beta) =N\times 2\sin(\beta)\cos(\beta)\times 2N\times\frac{\sin(\beta)}{\cos(\beta)} =4N^{2}\sin^{2}(\beta)$$
     Or $p_{n+1}^{2}=\left(2N\sin(\beta)\right)^{2}=4N^{2}\sin^{2}(\beta)$. Ces deux nombres ont donc le même carré, et $p_{n+1}$ étant positif : 
    $$\boxed{p_{n+1}=\sqrt{p_{n}\,q_{n+1}}}$$
     On remarque au passage la structure du procédé : $q_{n+1}$ est la *moyenne harmonique* de $p_{n}$ et $q_{n}$, et $p_{n+1}$ la *moyenne géométrique* de $p_{n}$ et $q_{n+1}$.

    **(c)** Avec $p_{1}=3$ et $q_{1}=2\sqrt{3}$ : 
    $$\frac{1}{q_{2}}=\frac{1}{2}\left(\frac{1}{3}+\frac{1}{2\sqrt{3}}\right) =\frac{1}{2}\left(\frac{1}{3}+\frac{\sqrt{3}}{6}\right)=\frac{2+\sqrt{3}}{12}$$

    $$q_{2}=\frac{12}{2+\sqrt{3}}\approx \boxed{3{,}215390}$$
     puis : 
    $$p_{2}=\sqrt{p_{1}q_{2}}=\sqrt{3\times 3{,}215390}\approx \boxed{3{,}105829}$$
     L'encadrement obtenu est donc $3{,}105829<\pi<3{,}215390$, d'amplitude : 
    $$q_{2}-p_{2}\approx \boxed{0{,}110}$$
     Autrement dit, après deux étapes, on ne connaît encore $\pi$ qu'à un dixième près : on peut seulement affirmer que $\pi\approx 3{,}1$.

    **(d)** L'exercice 28 a donné $\sin\left(\dfrac{\pi}{12}\right)=\dfrac{\sqrt{6}-\sqrt{2}}{4}$ et $\tan\left(\dfrac{\pi}{12}\right)=2-\sqrt{3}$. Or pour $n=2$, $3\times 2^{2}=12$ et $\dfrac{\pi}{3\times 2^{2}}=\dfrac{\pi}{12}$, donc : 
    $$p_{2}=12\sin\left(\frac{\pi}{12}\right)=12\times\frac{\sqrt{6}-\sqrt{2}}{4} =\boxed{3\left(\sqrt{6}-\sqrt{2}\right)}$$

    $$q_{2}=12\tan\left(\frac{\pi}{12}\right)=12\left(2-\sqrt{3}\right)=\boxed{24-12\sqrt{3}}$$
     On vérifie que $12\left(2-\sqrt{3}\right)=\dfrac{12}{2+\sqrt{3}}$, puisque $\left(2-\sqrt{3}\right)\left(2+\sqrt{3}\right)=4-3=1$.

    **4.** **(a)** La boucle doit se poursuivre tant que l'amplitude $q-p$ reste supérieure à $e$. Quant aux deux affectations, la première relation donne $\dfrac{1}{q_{n+1}}=\dfrac{p+q}{2pq}$, donc $q_{n+1}=\dfrac{2pq}{p+q}$ :

    **Entrée :** un réel $e>0$

    $p \leftarrow 3$

    $q \leftarrow 2\sqrt{3}$

    $n \leftarrow 1$

    **Tant que** $\boxed{q-p>e}$ **faire**

    $q \leftarrow \boxed{\dfrac{2pq}{p+q}}$

    $p \leftarrow \boxed{\sqrt{p\,q}}$

    $n \leftarrow n+1$

    **Fin Tant que**

    **Sortie :** $n$, $p$, $q$

    L'ordre des deux affectations est essentiel : lorsqu'on calcule $p \leftarrow \sqrt{pq}$, la variable $q$ contient déjà la *nouvelle* valeur $q_{n+1}$, conformément à la relation $p_{n+1}=\sqrt{p_{n}\,q_{n+1}}$. En les intervertissant, on calculerait $\sqrt{p_{n}q_{n}}$, qui n'est pas $p_{n+1}$.

    **(b)** En itérant à la calculatrice ou au tableur, on obtient :

    $$\begin{array}{|c||c|c|c|} \hline n & p_{n} & q_{n} & q_{n}-p_{n} \\ \hline 1 & 3{,}000000 & 3{,}464102 & 4{,}6\times 10^{-1} \\ \hline 2 & 3{,}105829 & 3{,}215390 & 1{,}1\times 10^{-1} \\ \hline 5 & 3{,}141032 & 3{,}142715 & 1{,}7\times 10^{-3} \\ \hline 10 & 3{,}141592 & 3{,}141594 & 1{,}6\times 10^{-6} \\ \hline 11 & 3{,}1415925 & 3{,}1415929 & 4{,}1\times 10^{-7} \\ \hline \end{array}$$

    L'amplitude passe sous $10^{-6}$ au rang $\boxed{n=11}$, et l'encadrement obtenu est : 
    $$\boxed{3{,}1415925<\pi<3{,}1415930}$$
     On y lit six décimales exactes : $\pi\approx 3{,}141592$.

    **(c)** En poursuivant, l'amplitude passe sous $10^{-9}$ au rang $n=16$. Il faut donc, pour gagner trois décimales : 
    $$\boxed{5 \text{ itérations supplémentaires}}$$

    On observe en effet que l'amplitude est divisée par $4$ environ à chaque étape, ce qui fait gagner $\log_{10}(4)\approx 0{,}6$ décimale par itération. Cet algorithme est donc **peu efficace** pour obtenir un grand nombre de décimales : atteindre les $100$ premières décimales de $\pi$ demanderait plus de $160$ itérations, et donc des polygones à $3\times 2^{160}$ côtés. Les méthodes modernes, fondées sur des séries, convergent infiniment plus vite.

    **5.** **(a)** On résout $3\times 2^{n}=96$, soit $2^{n}=32=2^{5}$ : 
    $$\boxed{n=5}$$

    **(b)** Le tableau de la question 4b donne : 
    $$\boxed{p_{5}\approx 3{,}141032 \qquad ; \qquad q_{5}\approx 3{,}142715}$$
     tandis que l'encadrement d'Archimède vaut : 
    $$3+\frac{10}{71}\approx 3{,}140845 \qquad ; \qquad 3+\frac{1}{7}\approx 3{,}142857$$
     On constate que $3+\dfrac{10}{71}<p_{5}$ et $q_{5}<3+\dfrac{1}{7}$ : l'encadrement d'Archimède **contient** celui que fournissent ses propres polygones. Son amplitude vaut $2{,}0\times 10^{-3}$ contre $1{,}7\times 10^{-3}$ pour $[p_{5}\,;q_{5}]$ : 
    $$\boxed{\text{l'encadrement } p_{5}<\pi<q_{5} \text{ est le meilleur des deux}}$$

    **(c)** Oui. À chaque étape, Archimède devait remplacer une racine carrée par une fraction, en arrondissant *par défaut* pour la borne inférieure et *par excès* pour la borne supérieure, afin de ne pas risquer de perdre l'encadrement. Chacun de ces arrondis élargit très légèrement l'intervalle, et ces pertes s'accumulent au fil des cinq étapes. L'écart constaté, de l'ordre de $2\times 10^{-4}$ sur chaque borne, est donc exactement le prix de cette prudence : la méthode d'Archimède est exacte, seuls ses calculs numériques sont approchés.

