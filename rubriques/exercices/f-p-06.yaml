  titre: "Calcul de $\\cos\\left(\\dfrac{\\pi}{12}\\right)$ et $\\sin\\left(\\dfrac{\\pi}{12}\\right)$"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [cercle trigonométrique, cosinus, sinus, tangente, angles orientés]
  noeuds: [cx-pi, cx-exponentielle]
