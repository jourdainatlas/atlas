  page_corrige: 24
  enonce: |
    Soit $(O;I,J)$ un repère orthonormé et $M$ un point du cercle trigonométrique de ce repère tel que $\left(\overrightarrow{OI},\overrightarrow{OM}\right)=\dfrac{\pi}{6}$.

    **1.** Faire une figure.

    **2.** Quelles sont les coordonnées du point $M$ dans le repère $(O;I,J)$ ?

    **3.** Calculer la distance $IM$. On donnera le résultat sous la forme $\sqrt{2-\sqrt{3}}$.

    **4.** **(a)** En considérant $H$, projeté orthogonal de $O$ sur $(IM)$, démontrer que : 
    $$IM=2\sin\left(\frac{\pi}{12}\right)$$

    **(b)** En déduire que : $\sin\left(\dfrac{\pi}{12}\right)=\dfrac{\sqrt{6}-\sqrt{2}}{4}$.

    *On pourra vérifier que $\left(\dfrac{\sqrt{6}-\sqrt{2}}{4}\right)^{2}=\dfrac{2-\sqrt{3}}{4}$.*

    **(c)** En utilisant la question précédente, montrer que : $\cos\left(\dfrac{\pi}{12}\right)=\dfrac{\sqrt{6}+\sqrt{2}}{4}$.

    **5.** En déduire le cosinus et le sinus des réels $\dfrac{11\pi}{12}$, $\dfrac{13\pi}{12}$, $\dfrac{5\pi}{12}$ et $\dfrac{7\pi}{12}$.

    **6.** Démontrer enfin que $\tan\left(\dfrac{\pi}{12}\right)=2-\sqrt{3}$.
  corrige: |
    **1.** Voici la figure, complétée du point $H$ utilisé à la question 4.

    ![Figure](documents/figures/6178f50d81f77691.svg)

    **2.** Par définition, le point image d'un réel $x$ a pour coordonnées $\left(\cos(x)\,;\sin(x)\right)$. Ici $x=\dfrac{\pi}{6}$, d'où : 
    $$\boxed{M\left(\frac{\sqrt{3}}{2}\,;\frac{1}{2}\right)}$$

    **3.** Le repère étant orthonormé, on peut appliquer la formule de la distance avec $I(1\,;0)$ : 
    $$\begin{aligned} IM &= \sqrt{\left(\frac{\sqrt{3}}{2}-1\right)^{2}+\left(\frac{1}{2}-0\right)^{2}} \\ &= \sqrt{\frac{3}{4}-2\times\frac{\sqrt{3}}{2}+1+\frac{1}{4}} \\ &= \sqrt{\frac{3}{4}+\frac{1}{4}+1-\sqrt{3}} \end{aligned}$$

    $$\boxed{IM=\sqrt{2-\sqrt{3}}}$$
     On vérifie au passage que $2-\sqrt{3}\approx 0{,}27$ est bien positif.

    **4.** **(a)** Le triangle $OIM$ est **isocèle en $O$**, car $OI=OM=1$ (rayons du cercle). Le projeté orthogonal $H$ de $O$ sur $(IM)$ est donc le pied de la hauteur issue du sommet principal : c'est aussi le **milieu** de $[IM]$, et $(OH)$ est la bissectrice de l'angle $\widehat{IOM}$. On en déduit : 
    $$\widehat{IOH}=\frac{1}{2}\times\frac{\pi}{6}=\frac{\pi}{12}$$
     Le triangle $OHI$ étant rectangle en $H$, la trigonométrie du triangle rectangle donne : 
    $$\sin\left(\widehat{IOH}\right)=\frac{IH}{OI}=\frac{IH}{1}=IH \qquad \text{d'où} \qquad IH=\sin\left(\frac{\pi}{12}\right)$$
     Comme $H$ est le milieu de $[IM]$, on obtient enfin : 
    $$\boxed{IM=2\,IH=2\sin\left(\frac{\pi}{12}\right)}$$

    **(b)** En rapprochant les questions 3 et 4a : 
    $$2\sin\left(\frac{\pi}{12}\right)=\sqrt{2-\sqrt{3}} \qquad \text{d'où} \qquad \sin\left(\frac{\pi}{12}\right)=\frac{\sqrt{2-\sqrt{3}}}{2}$$
     Vérifions à présent l'égalité proposée : 
    $$\left(\frac{\sqrt{6}-\sqrt{2}}{4}\right)^{2}=\frac{6-2\sqrt{6}\sqrt{2}+2}{16} =\frac{8-2\sqrt{12}}{16}=\frac{8-4\sqrt{3}}{16}=\frac{2-\sqrt{3}}{4}$$
     Les deux nombres $\sin\left(\dfrac{\pi}{12}\right)$ et $\dfrac{\sqrt{6}-\sqrt{2}}{4}$ sont positifs et ont le même carré $\dfrac{2-\sqrt{3}}{4}$ : ils sont donc égaux. 
    $$\boxed{\sin\left(\frac{\pi}{12}\right)=\frac{\sqrt{6}-\sqrt{2}}{4}}$$

    **(c)** La relation fondamentale donne : 
    $$\cos^{2}\left(\frac{\pi}{12}\right)=1-\sin^{2}\left(\frac{\pi}{12}\right) =1-\frac{2-\sqrt{3}}{4}=\frac{4-2+\sqrt{3}}{4}=\frac{2+\sqrt{3}}{4}$$
     Or, par le même calcul qu'en 4b : 
    $$\left(\frac{\sqrt{6}+\sqrt{2}}{4}\right)^{2}=\frac{6+2\sqrt{12}+2}{16} =\frac{8+4\sqrt{3}}{16}=\frac{2+\sqrt{3}}{4}$$
     Comme $\dfrac{\pi}{12}$ appartient à $\left]0\,;\dfrac{\pi}{2}\right[$, son cosinus est positif : 
    $$\boxed{\cos\left(\frac{\pi}{12}\right)=\frac{\sqrt{6}+\sqrt{2}}{4}}$$

    **5.** Chacun de ces quatre réels s'écrit à l'aide de $\dfrac{\pi}{12}$ : 
    $$\frac{11\pi}{12}=\pi-\frac{\pi}{12} \quad ; \quad \frac{13\pi}{12}=\pi+\frac{\pi}{12} \quad ; \quad \frac{5\pi}{12}=\frac{\pi}{2}-\frac{\pi}{12} \quad ; \quad \frac{7\pi}{12}=\pi-\frac{5\pi}{12}$$
     Le tableau des angles associés donne alors :

    $$\begin{array}{|c||c|c|} \hline  & \cos & \sin \\ \hline \dfrac{11\pi}{12} & -\dfrac{\sqrt{6}+\sqrt{2}}{4} & \dfrac{\sqrt{6}-\sqrt{2}}{4} \\ \hline \dfrac{13\pi}{12} & -\dfrac{\sqrt{6}+\sqrt{2}}{4} & -\dfrac{\sqrt{6}-\sqrt{2}}{4} \\ \hline \dfrac{5\pi}{12} & \dfrac{\sqrt{6}-\sqrt{2}}{4} & \dfrac{\sqrt{6}+\sqrt{2}}{4} \\ \hline \dfrac{7\pi}{12} & -\dfrac{\sqrt{6}-\sqrt{2}}{4} & \dfrac{\sqrt{6}+\sqrt{2}}{4} \\ \hline \end{array}$$

    Pour $\dfrac{5\pi}{12}$, la colonne « $\dfrac{\pi}{2}-x$ » échange le cosinus et le sinus : c'est ce qui explique que les deux valeurs soient permutées par rapport à celles de $\dfrac{\pi}{12}$.

    **6.** Par définition de la tangente : 
    $$\tan\left(\frac{\pi}{12}\right)=\frac{\sin\left(\frac{\pi}{12}\right)}{\cos\left(\frac{\pi}{12}\right)} =\frac{\frac{\sqrt{6}-\sqrt{2}}{4}}{\frac{\sqrt{6}+\sqrt{2}}{4}} =\frac{\sqrt{6}-\sqrt{2}}{\sqrt{6}+\sqrt{2}}$$
     On rend le dénominateur rationnel en multipliant haut et bas par $\sqrt{6}-\sqrt{2}$ : 
    $$\tan\left(\frac{\pi}{12}\right)=\frac{\left(\sqrt{6}-\sqrt{2}\right)^{2}} {\left(\sqrt{6}+\sqrt{2}\right)\left(\sqrt{6}-\sqrt{2}\right)} =\frac{8-4\sqrt{3}}{6-2}=\frac{8-4\sqrt{3}}{4}=\boxed{2-\sqrt{3}}$$
- id: "p-06-29"
