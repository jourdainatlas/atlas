  enonce: |
    **1.** Soit $f : [0, +\infty[ \to \mathbb{R}$ continue et bornée, et $\mathcal{L}f(x) = \mathop{\displaystyle \int_{0}^{+\infty}}\mathrm{e}^{-xt}f(t)\,\mathrm{d} t$ pour $x > 0$ (transformée de Laplace). Montrer que $\mathcal{L}f$ est de classe $C^{\infty}$ sur $]0, +\infty[$ et calculer ses dérivées. Pour $f = 1$, en déduire $\mathop{\displaystyle \int_{0}^{+\infty}}t\mathrm{e}^{-t}\,\mathrm{d} t$, puis $\mathop{\displaystyle \int_{0}^{+\infty}}(t^{2} + t + 1)\mathrm{e}^{-t}\,\mathrm{d} t$.

    **2.** Soit $P$ une probabilité sur $[0, +\infty[$, et $F(x) = \mathop{\displaystyle \int}\mathrm{e}^{-xt}\,\mathrm{d} P(t)$ pour $x \geqslant 0$. Montrer que $F$ est décroissante, déterminer $\mathop{\displaystyle \lim_{n}}F(n)$, puis $\mathop{\displaystyle \lim_{x \to +\infty}}F(x)$.

    **3.** Soit $P$ une probabilité sur $\mathbb{R}$ telle que $t \mapsto \mathrm{e}^{a|t|}$ soit $P$-intégrable pour tout $a \in \mathbb{R}$. Donner deux exemples de telles probabilités, « de nature différente ». Montrer que $t \mapsto t^{n}$ est $P$-intégrable pour tout $n \in \mathbb{N}$, puis que, pour $z \in \mathbb{C}$, $t \mapsto \mathrm{e}^{zt}$ l'est. Montrer que $G(z) = \mathop{\displaystyle \int_{\mathbb{R}}}\mathrm{e}^{zt}\,\mathrm{d} P(t)$ est développable en série entière sur $\mathbb{C}$, $G(z) = \mathop{\displaystyle \sum_{n \geqslant 0}}a_{n}z^{n}$, et expliciter les $a_{n}$.
  corrige: |
    **1.** Soit $M = \mathop{\displaystyle \sup}|f|$. Pour $x \geqslant a > 0$, $\big|(-t)^{k}\mathrm{e}^{-xt}f(t)\big| \leqslant Mt^{k}\mathrm{e}^{-at}$, intégrable : $\mathcal{L}f$ est de classe $C^{\infty}$ et $(\mathcal{L}f)^{(k)}(x) = \mathop{\displaystyle \int_{0}^{+\infty}}(-t)^{k}\mathrm{e}^{-xt}f(t)\,\mathrm{d} t$. Pour $f = 1$, $\mathcal{L}f(x) = \dfrac{1}{x}$, d'où $\mathop{\displaystyle \int_{0}^{+\infty}}t^{k}\mathrm{e}^{-xt}\,\mathrm{d} t = \dfrac{k!}{x^{k+1}}$, et, en $x = 1$, $\mathop{\displaystyle \int} t\mathrm{e}^{-t} = \boxed{1}$ et $\mathop{\displaystyle \int}(t^{2} + t + 1)\mathrm{e}^{-t} = 2 + 1 + 1 = \boxed{4}$.

    **2.** Pour $t \geqslant 0$, $x \mapsto \mathrm{e}^{-xt}$ décroît : $F$ aussi. Quand $n \to +\infty$, $\mathrm{e}^{-nt} \to \chi_{\{0\}}(t)$, avec domination par $1$ : $F(n) \to \boxed{P(\{0\})}$, et, $F$ étant monotone, c'est aussi la limite de $F(x)$ en $+\infty$. La transformée de Laplace « voit » à l'infini la masse en $0$.

    **3.** Conviennent par exemple $\delta_{0}$, ou la loi de Poisson $\mathop{\displaystyle \sum_{k}}\dfrac{\mathrm{e}^{-1}}{k!}\delta_{k}$, mesures discrètes, et la loi de densité $\dfrac{1}{\sqrt{2\pi}}\mathrm{e}^{-t^{2}/2}$, à densité. Comme $\dfrac{|t|^{n}}{n!} \leqslant \mathrm{e}^{|t|}$, chaque $t^{n}$ est intégrable, et $|\mathrm{e}^{zt}| \leqslant \mathrm{e}^{|z||t|}$ l'est aussi. Enfin $\mathop{\displaystyle \sum_{n}}\dfrac{|zt|^{n}}{n!} = \mathrm{e}^{|z||t|}$ est intégrable, et la proposition 7 du chapitre 4 permet d'intégrer la série terme à terme : 
    $$G(z) = \sum_{n \geqslant 0}a_{n}z^{n}, \qquad \boxed{a_{n} = \frac{1}{n!}\int_{\mathbb{R}}t^{n}\,\mathrm{d} P(t)}\text{,}$$
     pour tout $z \in \mathbb{C}$. Les coefficients sont les moments de $P$, divisés par $n!$ : c'est pourquoi $G$ s'appelle la *fonction génératrice des moments*.
