  enonce: |
    Soit $\mu$ une mesure finie sur $\mathbb{R}$. Sa transformée de Fourier est $\widehat{\mu}(\xi) = \mathop{\displaystyle \int_{\mathbb{R}}}\mathrm{e}^{-\mathrm{i}\xi t}\,\mathrm{d}\mu(t)$.

    **1.** Calculer $\widehat{\delta_{1}}$, et la transformée de $\mu = \mathop{\displaystyle \sum_{k \geqslant 0}}2^{-k}\delta_{k}$. La transformée de Fourier d'une mesure finie tend-elle toujours vers $0$ à l'infini ?

    **2.** Montrer que $\widehat{\mu}$ est continue et bornée sur $\mathbb{R}$.

    **3.** Si $t \mapsto t$ est $\mu$-intégrable, montrer que $\widehat{\mu}$ est de classe $C^{1}$ et que $\widehat{\mu}\,'(\xi) = -\mathrm{i}\mathop{\displaystyle \int} t\mathrm{e}^{-\mathrm{i}\xi t}\,\mathrm{d}\mu(t)$. Si $t \mapsto t^{2}$ est $\mu$-intégrable, montrer que $\widehat{\mu}$ est de classe $C^{2}$ et calculer $\widehat{\mu}\,''$.

    **4.** Si $\mu$ a une densité $f \in \mathcal{L}^{1}(\mathbb{R})$ par rapport à $\lambda$, comparer $\widehat{\mu}$ et $\widehat{f}$.
  corrige: |
    **1.** $\widehat{\delta_{1}}(\xi) = \mathrm{e}^{-\mathrm{i}\xi}$, et $\widehat{\mu}(\xi) = \mathop{\displaystyle \sum_{k \geqslant 0}}2^{-k}\mathrm{e}^{-\mathrm{i} k\xi} = \dfrac{1}{1 - \mathrm{e}^{-\mathrm{i}\xi}/2}$, de période $2\pi$. Aucune des deux ne tend vers $0$ à l'infini : le lemme de Riemann-Lebesgue (cours, prop. 5) est propre aux mesures à densité intégrable.

    **2.** $|\mathrm{e}^{-\mathrm{i}\xi t}| = 1$ est intégrable puisque $\mu$ est finie : $\widehat{\mu}$ est continue (th. 1) et $|\widehat{\mu}| \leqslant \mu(\mathbb{R})$.

    **3.** La dérivée en $\xi$, $-\mathrm{i} t\mathrm{e}^{-\mathrm{i}\xi t}$, est dominée par $|t|$, intégrable : $\widehat{\mu}$ est de classe $C^{1}$, avec la formule annoncée. Si $t^{2}$ est intégrable, $|t| \leqslant \dfrac{1 + t^{2}}{2}$ l'est aussi, et la dérivée seconde $-t^{2}\mathrm{e}^{-\mathrm{i}\xi t}$ est dominée par $t^{2}$ : $\boxed{\widehat{\mu}\,''(\xi) = -\mathop{\displaystyle \int} t^{2}\mathrm{e}^{-\mathrm{i}\xi t}\,\mathrm{d}\mu(t)}$. Ce sont les analogues, pour les mesures, de la proposition 4 (iii).

    **4.** La feuille 4, exercice 7, appliquée aux parties réelle et imaginaire de l'intégrande, donne $\widehat{\mu}(\xi) = \mathop{\displaystyle \int}\mathrm{e}^{-\mathrm{i}\xi t}f(t)\,\mathrm{d} t = \widehat{f}(\xi)$ : la transformée d'une mesure prolonge celle des fonctions intégrables.
