  enonce: |
    Soit $\Gamma(x) = \mathop{\displaystyle \int_{0}^{+\infty}}t^{x-1}\mathrm{e}^{-t}\,\mathrm{d} t$ pour $x > 0$.

    **1.** Rappeler pourquoi $\Gamma$ est définie, de classe $C^{\infty}$ et strictement convexe sur $]0, +\infty[$ (cours, prop. 2).

    **2.** Montrer que $\Gamma(x) \sim \dfrac{1}{x}$ quand $x \to 0^{+}$, et que $\Gamma(x) \to +\infty$ quand $x \to +\infty$.

    **3.** Montrer que $\Gamma$ atteint son minimum sur $]0, +\infty[$ en un unique point, situé dans $]1, 2[$.

    **4.** À l'aide de l'exercice 10, montrer que $\Gamma(\dfrac{1}{2}) = \sqrt{\pi}$.
  corrige: |
    **1.** Pour $0 < a \leqslant x \leqslant b$, les dérivées $(\ln t)^{m}t^{x-1}\mathrm{e}^{-t}$ sont dominées par $|\ln t|^{m}(t^{a-1} + t^{b-1})\mathrm{e}^{-t}$, intégrable ; le théorème 2 donne la classe $C^{\infty}$, et $\Gamma''(x) = \mathop{\displaystyle \int}(\ln t)^{2}t^{x-1}\mathrm{e}^{-t}\,\mathrm{d} t > 0$ la stricte convexité (cours, prop. 2).

    **2.** Par $\Gamma(x + 1) = x\Gamma(x)$ et la continuité de $\Gamma$ en $1$, $\Gamma(x) = \dfrac{\Gamma(x + 1)}{x} \sim \dfrac{\Gamma(1)}{x} = \dfrac{1}{x}$ quand $x \to 0^{+}$. Pour $x \geqslant 1$, $\Gamma(x) \geqslant \mathop{\displaystyle \int_{2}^{+\infty}}2^{x-1}\mathrm{e}^{-t}\,\mathrm{d} t = 2^{x-1}\mathrm{e}^{-2} \to +\infty$.

    **3.** $\Gamma(1) = \Gamma(2) = 1$ : par le théorème de Rolle, $\Gamma'$ s'annule en un point $c \in ]1, 2[$. Par stricte convexité, $\Gamma'$ est strictement croissante, donc ne s'annule qu'en $c$ ; $\Gamma$ décroît sur $]0, c]$ et croît sur $[c, +\infty[$ : le minimum est atteint en $c$ seulement. Numériquement, 
    $$\boxed{c \approx 1{,}4616 \text{ et } \Gamma(c) \approx 0{,}8856}.$$

    ![Figure](documents/figures/12859a7758902534.svg)

    La fonction $\Gamma$ (ardoise) passe par les factorielles $\Gamma(n + 1) = n!$ (points ocre) ; strictement convexe, avec $\Gamma(1) = \Gamma(2)$, elle atteint son minimum en un unique point $c$ de $]1, 2[$ (carmin).

    **4.** Le changement de variable $t = u^{2}$ donne $\Gamma(\dfrac{1}{2}) = \mathop{\displaystyle \int_{0}^{+\infty}}t^{-1/2}\mathrm{e}^{-t}\,\mathrm{d} t = 2\mathop{\displaystyle \int_{0}^{+\infty}}\mathrm{e}^{-u^{2}}\,\mathrm{d} u = \boxed{\sqrt{\pi}}$, par l'exercice 10.
- id: "l3-in-05-05"
  feuille: "f-l3-in-05"
  numero: 5
  partie: "Continuité, dérivabilité"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["continuité, dérivabilité"]
  noeuds: [m-convergence-dominee]
  notions: [integrable-lebesgue]
  source: "Lyon 1 (TD04 2020), exercices 4, 5 et 7"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Calculer $\mathop{\displaystyle \sum_{n \geqslant 0}}(-1)^{n}x^{n}$ et $\mathop{\displaystyle \sum_{n \geqslant 1}}(-1)^{n}nx^{n-1}$ pour $|x| < 1$.

    **2.** Soit $f(x) = \mathop{\displaystyle \int_{0}^{1}}\dfrac{t^{x-1}}{1 + t}\,\mathrm{d} t$. Montrer que $f(x)$ est finie si et seulement si $x > 0$, que $f$ est continue sur $]0, +\infty[$, et calculer $f(x) + f(x + 1)$. En déduire $\mathop{\displaystyle \lim_{x \to 0^{+}}}xf(x)$.

    **3.** Montrer que la série $\mathop{\displaystyle \sum_{n \geqslant 1}}\dfrac{(-1)^{n}}{n}$ converge, et notons $K$ sa somme. Soit $g(x) = \mathop{\displaystyle \sum_{n \geqslant 1}}\dfrac{x^{n}}{n}$. Montrer que $g$ est de classe $C^{1}$ sur $]-1, 1[$, calculer $g'(x)$, puis $g(x)$ et $\mathop{\displaystyle \lim_{x \to -1^{+}}}g(x)$. En déduire la valeur de $K$.
  corrige: |
    **1.** Série géométrique : $\mathop{\displaystyle \sum_{n \geqslant 0}}(-1)^{n}x^{n} = \dfrac{1}{1 + x}$, et par dérivation terme à terme d'une série entière, $\mathop{\displaystyle \sum_{n \geqslant 1}}(-1)^{n}nx^{n-1} = -\dfrac{1}{(1 + x)^{2}}$.

    **2.** $\dfrac{t^{x-1}}{1 + t}$ est positive et équivalente à $t^{x-1}$ en $0$ : elle est intégrable sur $]0, 1]$ si et seulement si $x > 0$ (chapitre 4, prop. 2). Sur $[a, b] \subset ]0, +\infty[$, elle est dominée par $t^{a-1}$, d'où la continuité (th. 1). Ensuite 
    $$f(x) + f(x + 1) = \int_{0}^{1}t^{x-1}\frac{1 + t}{1 + t}\,\mathrm{d} t = \boxed{\frac{1}{x}},$$
     donc $xf(x) = 1 - xf(x + 1) \to \boxed{1}$ quand $x \to 0^{+}$, par continuité de $f$ en $1$.

    **3.** La série alternée converge par le critère des séries alternées. La série entière $g$ a pour rayon $1$ ; elle est de classe $C^{1}$ sur $]-1, 1[$, avec $g'(x) = \mathop{\displaystyle \sum} x^{n-1} = \dfrac{1}{1 - x}$ ; comme $g(0) = 0$, $\boxed{g(x) = -\ln(1 - x)}$, qui tend vers $-\ln 2$ quand $x \to -1^{+}$. Il reste à justifier que $K$ est cette limite, ce que la seule continuité de $g$ sur $]-1, 1[$ ne donne pas. Pour $N \geqslant 1$, 
    $$\sum_{n = 1}^{N}\frac{(-1)^{n}}{n} = \int_{0}^{-1}\frac{1 - t^{N}}{1 - t}\,\mathrm{d} t = -\int_{0}^{1}\frac{1 - (-u)^{N}}{1 + u}\,\mathrm{d} u,$$
     et l'intégrande, majoré par $2$, tend vers $\dfrac{1}{1 + u}$ sur $[0, 1[$ : par convergence dominée, $\boxed{K = -\ln 2}$.
- id: "l3-in-05-06"
  feuille: "f-l3-in-05"
  numero: 6
  partie: "Continuité, dérivabilité"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["continuité, dérivabilité"]
  noeuds: [m-convergence-dominee, tg-arctan]
  notions: [integrable-lebesgue, arc-tangente, cosinus-sinus]
  source: "Lyon 1 (TD04 2020), exercice 11 ; Montpellier (TD 3), exercices 7 et 12"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Soit $P$ une probabilité sur $[0, +\infty[$, et $F(x) = \mathop{\displaystyle \int}\cos(xt)\,\mathrm{d} P(t)$ pour $x \geqslant 0$. Montrer que $F$ est définie et continue. On suppose que $t \mapsto t^{2}$ est $P$-intégrable : déterminer $\mathop{\displaystyle \lim_{x \to 0}}\dfrac{1 - F(x)}{x^{2}}$, en utilisant $1 - \cos u \leqslant \dfrac{u^{2}}{2}$. Réciproquement, si $\mathop{\displaystyle \liminf_{x \to 0}}\dfrac{1 - F(x)}{x^{2}} < +\infty$, montrer à l'aide du lemme de Fatou que $t \mapsto t^{2}$ est $P$-intégrable.

    **2.** Soit $\mu$ une mesure finie sur $\mathbb{R}$. Pour $t \geqslant 0$, on pose 
    $$F(t) = \int_{\mathbb{R}}\arctan(x^{2}t)\,\mathrm{d}\mu(x), \qquad G(t) = \int_{\mathbb{R}}\frac{\mathrm{d}\mu(x)}{1 + x^{2}t}.$$
     Montrer que $F$ et $G$ sont définies et continues sur $[0, +\infty[$, et déterminer leurs limites en $+\infty$. Montrer qu'elles sont dérivables sur $]0, +\infty[$, en établissant la dérivabilité sur chaque intervalle $]a, +\infty[$ avec $a > 0$, et exprimer leurs dérivées. Donner une condition suffisante pour qu'elles soient dérivables en $0$, et calculer alors $F'(0)$ et $G'(0)$.
  corrige: |
    **1.** $|\cos(xt)| \leqslant 1$, intégrable pour la probabilité $P$ : $F$ est définie et continue (th. 1). On a $\dfrac{1 - F(x)}{x^{2}} = \mathop{\displaystyle \int}\dfrac{1 - \cos(xt)}{x^{2}}\,\mathrm{d} P(t)$ ; l'intégrande tend vers $\dfrac{t^{2}}{2}$ et est dominé par $\dfrac{t^{2}}{2}$, d'où 
    $$\lim_{x \to 0}\frac{1 - F(x)}{x^{2}} = \boxed{\frac{1}{2}\int t^{2}\,\mathrm{d} P(t)}\text{.}$$
     Réciproquement, soit $x_{k} \to 0$ réalisant la limite inférieure. Le lemme de Fatou donne 
    $$\int\frac{t^{2}}{2}\,\mathrm{d} P = \int\lim_{k}\frac{1 - \cos(x_{k}t)}{x_{k}^{2}}\,\mathrm{d} P \leqslant \liminf_{k}\frac{1 - F(x_{k})}{x_{k}^{2}} < +\infty.$$
     En probabilités, c'est le lien entre la régularité de la fonction caractéristique en $0$ et l'existence d'un moment d'ordre $2$.

    **2.** $|\arctan(x^{2}t)| \leqslant \dfrac{\pi}{2}$ et $\dfrac{1}{1 + x^{2}t} \leqslant 1$, intégrables puisque $\mu$ est finie : $F$ et $G$ sont continues sur $[0, +\infty[$. Quand $t \to +\infty$, $\arctan(x^{2}t) \to \dfrac{\pi}{2}\chi_{\{x \neq 0\}}$ et $\dfrac{1}{1 + x^{2}t} \to \chi_{\{0\}}(x)$, d'où 
    $$\lim_{+\infty}F = \frac{\pi}{2}\mu(\mathbb{R} \setminus \{0\}), \qquad \lim_{+\infty}G = \mu(\{0\}).$$
     Pour $t \geqslant a > 0$, puisque $1 + u^{2} \geqslant 2u$ et $(1 + u)^{2} \geqslant 4u$, 
    $$\frac{\partial}{\partial t}\arctan(x^{2}t) = \frac{x^{2}}{1 + x^{4}t^{2}} \leqslant \frac{1}{2a}, \qquad \Big|\frac{\partial}{\partial t}\frac{1}{1 + x^{2}t}\Big| = \frac{x^{2}}{(1 + x^{2}t)^{2}} \leqslant \frac{1}{4a} \text{ ;}$$
     ces constantes sont intégrables, et 
    $$F'(t) = \int\frac{x^{2}\,\mathrm{d}\mu(x)}{1 + x^{4}t^{2}}, \qquad G'(t) = -\int\frac{x^{2}\,\mathrm{d}\mu(x)}{(1 + x^{2}t)^{2}} \qquad (t > 0).$$
     Si $x \mapsto x^{2}$ est $\mu$-intégrable, les deux dérivées sont dominées par $x^{2}$ sur $[0, +\infty[$, et 
    $$\boxed{F'(0) = -G'(0) = \int x^{2}\,\mathrm{d}\mu}\text{.}$$
