  enonce: |
    Pour $t > 0$ et $x > 0$, soit $f(t, x) = \dfrac{\mathrm{e}^{-x} - \mathrm{e}^{-tx}}{x}$. Montrer que $f(t, \cdot)$ est intégrable sur $]0, +\infty[$, puis que $F(t) = \mathop{\displaystyle \int_{0}^{+\infty}}f(t, x)\,\mathrm{d} x$ est continue et dérivable sur $]0, +\infty[$. Calculer $F'(t)$, puis $F(t)$.
  corrige: |
    En $0$, $f(t, x) \to t - 1$, et $|f(t, x)| \leqslant \dfrac{\mathrm{e}^{-x} + \mathrm{e}^{-tx}}{x}$ pour $x \geqslant 1$ : $f(t, \cdot)$ est intégrable. Pour $t \geqslant a > 0$, $\dfrac{\partial f}{\partial t}(t, x) = \mathrm{e}^{-tx}$ est dominé par $\mathrm{e}^{-ax}$ : $F$ est dérivable, donc continue, avec $F'(t) = \mathop{\displaystyle \int_{0}^{+\infty}}\mathrm{e}^{-tx}\,\mathrm{d} x = \dfrac{1}{t}$. Comme $F(1) = 0$, $\boxed{F(t) = \ln t}$. C'est un cas de la formule de Frullani.
