  enonce: |
    *L'intégrale de Dirichlet.*

    **1.** Montrer que $u_{n} = \mathop{\displaystyle \int_{n\pi}^{(n+1)\pi}}\dfrac{|\sin t|}{t}\,\mathrm{d} t \geqslant \dfrac{2}{(n + 1)\pi}$, et en déduire que $t \mapsto \dfrac{\sin t}{t}$ n'est pas intégrable sur $]0, +\infty[$. Le calcul de la proposition 7 du cours permet-il d'affirmer le contraire ?

    **2.** *Seconde formule de la moyenne.* Soit $F$ de classe $C^{1}$, positive et décroissante sur $[a, b]$, et $g$ continue. Montrer qu'il existe $y \in [a, b]$ tel que $\mathop{\displaystyle \int_{a}^{b}}F(x)g(x)\,\mathrm{d} x = F(a)\mathop{\displaystyle \int_{a}^{y}}g(x)\,\mathrm{d} x$. En déduire que, pour $0 < A < B$ et $t \geqslant 0$, $\Big|\mathop{\displaystyle \int_{A}^{B}}\dfrac{\mathrm{e}^{-tx}\sin x}{x}\,\mathrm{d} x\Big| \leqslant \dfrac{2}{A}$.

    **3.** *Une autre démonstration.* Pour $x \geqslant 0$, soit 
    $$f(x) = \int_{0}^{+\infty}\frac{\mathrm{e}^{-xt}}{1 + t^{2}}\,\mathrm{d} t, \qquad g(x) = \int_{0}^{+\infty}\frac{\sin t}{x + t}\,\mathrm{d} t,$$
     la seconde au sens des intégrales généralisées.

    (a) Montrer que $f$ est continue sur $[0, +\infty[$, de classe $C^{2}$ sur $]0, +\infty[$, et que $f + f'' = \dfrac{1}{x}$.

    (b) Montrer, par une intégration par parties, que $g(x)$ existe pour $x \geqslant 0$, puis que 
    $$g(x) = \cos x\int_{x}^{+\infty}\frac{\sin u}{u}\,\mathrm{d} u - \sin x\int_{x}^{+\infty}\frac{\cos u}{u}\,\mathrm{d} u.$$
     En déduire que $g$ est de classe $C^{2}$ sur $]0, +\infty[$ et que $g + g'' = \dfrac{1}{x}$.

    (c) Montrer que $f$ et $g$ tendent vers $0$ en $+\infty$, et en déduire que $f = g$ sur $]0, +\infty[$.

    (d) Montrer que $g$ est continue en $0$, et retrouver $\mathop{\displaystyle \int_{0}^{+\infty}}\dfrac{\sin t}{t}\,\mathrm{d} t = \dfrac{\pi}{2}$.
  corrige: |
    **1.** Sur $[n\pi, (n + 1)\pi]$, $\dfrac{1}{t} \geqslant \dfrac{1}{(n + 1)\pi}$ et $\mathop{\displaystyle \int}|\sin t| = 2$, d'où l'inégalité. La série $\mathop{\displaystyle \sum} u_{n}$ diverge comme la série harmonique, et la convergence monotone donne $\mathop{\displaystyle \int_{0}^{+\infty}}\dfrac{|\sin t|}{t}\,\mathrm{d} t = +\infty$. La proposition 7 du cours donne seulement la limite de $\mathop{\displaystyle \int_{0}^{A}}\dfrac{\sin t}{t}\,\mathrm{d} t$ : l'intégrale généralisée converge, sans que la fonction soit intégrable au sens de Lebesgue.

    **2.** Soit $G(y) = \mathop{\displaystyle \int_{a}^{y}}g$, de bornes $m \leqslant G \leqslant M$ sur $[a, b]$. Par parties, 
    $$\int_{a}^{b}Fg = F(b)G(b) + \int_{a}^{b}(-F')G,$$
     et comme $-F' \geqslant 0$ et $F(b) \geqslant 0$, cette quantité est comprise entre $mF(b) + m(F(a) - F(b)) = mF(a)$ et $MF(a)$. Si $F(a) > 0$, le quotient par $F(a)$ est dans $[m, M] = G([a, b])$, et le théorème des valeurs intermédiaires fournit $y$ ; si $F(a) = 0$, $F$ est nulle. Avec $F(x) = \dfrac{\mathrm{e}^{-tx}}{x}$ sur $[A, B]$ et $g = \sin$, on obtient $\big|\mathop{\displaystyle \int_{A}^{B}}\dfrac{\mathrm{e}^{-tx}\sin x}{x}\,\mathrm{d} x\big| = \dfrac{\mathrm{e}^{-tA}}{A}|\cos A - \cos y| \leqslant \dfrac{2}{A}$. Cette majoration, uniforme en $t \geqslant 0$, est celle qui permet de faire tendre $t$ vers $0$ dans la démonstration de la proposition 7.

    **3.** (a) $\dfrac{\mathrm{e}^{-xt}}{1 + t^{2}} \leqslant \dfrac{1}{1 + t^{2}}$ donne la continuité sur $[0, +\infty[$. Pour $x \geqslant a > 0$, les dérivées $\dfrac{(-t)^{k}\mathrm{e}^{-xt}}{1 + t^{2}}$ sont dominées par $t^{k}\mathrm{e}^{-at}$ : $f$ est de classe $C^{2}$ sur $]0, +\infty[$, et 
    $$f(x) + f''(x) = \int_{0}^{+\infty}\frac{(1 + t^{2})\mathrm{e}^{-xt}}{1 + t^{2}}\,\mathrm{d} t = \frac{1}{x}.$$

    (b) Par parties, $\mathop{\displaystyle \int_{0}^{A}}\dfrac{\sin t}{x + t}\,\mathrm{d} t = \dfrac{1}{x} - \dfrac{\cos A}{x + A} - \mathop{\displaystyle \int_{0}^{A}}\dfrac{\cos t}{(x + t)^{2}}\,\mathrm{d} t$, et la dernière intégrale converge absolument quand $A \to +\infty$ si $x > 0$ ; pour $x = 0$, c'est l'intégrale de Dirichlet. Avec $u = x + t$ et $\sin(u - x) = \sin u\cos x - \cos u\sin x$, on obtient la formule annoncée, $g = S\cos - C\sin$, où $S(x) = \mathop{\displaystyle \int_{x}^{+\infty}}\dfrac{\sin u}{u}\,\mathrm{d} u$ et $C(x) = \mathop{\displaystyle \int_{x}^{+\infty}}\dfrac{\cos u}{u}\,\mathrm{d} u$ sont de classe $C^{1}$ sur $]0, +\infty[$, de dérivées $-\dfrac{\sin x}{x}$ et $-\dfrac{\cos x}{x}$. On calcule 
    $$g' = -S\sin - C\cos, \qquad g'' = -S\cos + C\sin + \frac{\sin^{2}x + \cos^{2}x}{x} = -g + \frac{1}{x}.$$

    (c) $f(x) \to 0$ par convergence dominée, et $g(x) \to 0$ car $S(x)$ et $C(x)$, restes d'intégrales convergentes, tendent vers $0$. La différence $f - g$ vérifie $y'' + y = 0$, donc s'écrit $\alpha\cos x + \beta\sin x$, et tend vers $0$ : $\alpha = \beta = 0$, et $f = g$.

    (d) $S$ est continue en $0$, et $|C(x)| \leqslant |C(1)| + \ln\dfrac{1}{x}$ pour $0 < x < 1$, de sorte que $\sin x\,C(x) \to 0$. Donc $g(x) \to S(0) = g(0)$, et, $f$ étant continue en $0$, 
    $$\int_{0}^{+\infty}\frac{\sin t}{t}\,\mathrm{d} t = g(0) = f(0) = \int_{0}^{+\infty}\frac{\mathrm{d} t}{1 + t^{2}} = \boxed{\frac{\pi}{2}}\text{.}$$
