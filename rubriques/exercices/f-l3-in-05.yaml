  enonce: |
    Soit $a > 0$, $g_{a}(x) = \mathrm{e}^{-ax^{2}}$ et $h_{a} = \widehat{g_{a}}$. On admet que $\mathop{\displaystyle \int_{\mathbb{R}}}\mathrm{e}^{-x^{2}}\,\mathrm{d} x = \sqrt{\pi}$ (exercice 10).

    **1.** Montrer que $g_{a}$ est intégrable et calculer $h_{a}(0)$.

    **2.** Montrer que $h_{a}$ est de classe $C^{1}$, donner $h_{a}'$, et montrer, par une intégration par parties, que $h_{a}'(t) = -\dfrac{t}{2a}h_{a}(t)$.

    **3.** En déduire que $h_{a}(t) = \sqrt{\dfrac{\pi}{a}}\,\mathrm{e}^{-t^{2}/(4a)}$. Retrouver ce résultat à partir du cas $a = \dfrac{1}{2}$ et de la proposition 4 (ii) du cours.
  corrige: |
    **1.** $g_{a}$ est positive, et $x = \dfrac{u}{\sqrt{a}}$ donne $h_{a}(0) = \mathop{\displaystyle \int}\mathrm{e}^{-ax^{2}}\,\mathrm{d} x = \sqrt{\dfrac{\pi}{a}}$.

    **2.** $xg_{a}$ est intégrable : par la proposition 4 (iii), $h_{a}$ est de classe $C^{1}$ et $h_{a}'(t) = -\mathrm{i}\mathop{\displaystyle \int} x\mathrm{e}^{-ax^{2}}\mathrm{e}^{-\mathrm{i} tx}\,\mathrm{d} x$. Comme $x\mathrm{e}^{-ax^{2}} = -\dfrac{1}{2a}(\mathrm{e}^{-ax^{2}})'$, une intégration par parties, sans terme de bord, donne 
    $$h_{a}'(t) = -\frac{\mathrm{i}}{2a}\int\mathrm{e}^{-ax^{2}}(-\mathrm{i} t)\mathrm{e}^{-\mathrm{i} tx}\,\mathrm{d} x = -\frac{t}{2a}h_{a}(t).$$

    **3.** Donc $\big(h_{a}(t)\mathrm{e}^{t^{2}/(4a)}\big)' = 0$, et $\boxed{h_{a}(t) = \sqrt{\dfrac{\pi}{a}}\,\mathrm{e}^{-t^{2}/(4a)}}$. Autrement : $g_{a}(x) = \gamma(rx)$ avec $\gamma(x) = \mathrm{e}^{-x^{2}/2}$ et $r = \sqrt{2a}$ ; la proposition 4 (ii), avec $\widehat{\gamma}(\xi) = \sqrt{2\pi}\mathrm{e}^{-\xi^{2}/2}$ (cours et exercice 10), donne $h_{a}(t) = \dfrac{1}{r}\sqrt{2\pi}\mathrm{e}^{-t^{2}/(2r^{2})}$, la même formule. Plus la gaussienne est étroite, plus sa transformée est large.
