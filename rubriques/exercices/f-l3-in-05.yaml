  enonce: |
    *Extension harmonique.* Soit $U = \mathbb{R} \times ]0, +\infty[$ et, pour $y > 0$, $P_{y}(x) = \dfrac{1}{\pi}\dfrac{y}{x^{2} + y^{2}}$ (*noyau de Poisson*). Pour $f$ intégrable sur $\mathbb{R}$, on pose 
    $$u(x, y) = \int_{\mathbb{R}}P_{y}(x - t)f(t)\,\mathrm{d} t, \qquad (x, y) \in U.$$

    **1.** Montrer que $u$ est finie en tout point de $U$, et que $\mathop{\displaystyle \int_{\mathbb{R}}}P_{y}(x)\,\mathrm{d} x = 1$.

    **2.** Montrer que $u$ est de classe $C^{2}$ sur $U$ et que $\Delta u = \dfrac{\partial^{2}u}{\partial x^{2}} + \dfrac{\partial^{2}u}{\partial y^{2}} = 0$.

    **3.** Si $f$ est de plus continue et bornée, montrer que $\mathop{\displaystyle \lim_{y \to 0^{+}}}u(x, y) = f(x)$ pour tout $x \in \mathbb{R}$.

    Ainsi $u$ est une solution du *problème de Dirichlet* : $\Delta u = 0$ dans $U$ et $u(\cdot, y) \to f$ quand $y \to 0^{+}$.
  corrige: |
    **1.** $|P_{y}(x - t)f(t)| \leqslant \dfrac{|f(t)|}{\pi y}$, intégrable, et $\mathop{\displaystyle \int_{\mathbb{R}}}P_{y} = \dfrac{1}{\pi}\big[\arctan\dfrac{x}{y}\big]_{-\infty}^{+\infty} = 1$.

    **2.** Avec $z = x + \mathrm{i} y$, $P_{y}(x) = -\dfrac{1}{\pi}\operatorname{Im}\dfrac{1}{z}$, partie imaginaire d'une fonction holomorphe sur $U$ : $(x, y) \mapsto P_{y}(x)$ est de classe $C^{\infty}$ sur $U$ et harmonique. Ses dérivées partielles d'ordre $k \leqslant 2$ sont majorées par $\dfrac{c_{k}}{|z|^{k+1}} \leqslant \dfrac{c_{k}}{y^{k+1}}$. Sur $\{y > b\}$, avec $b > 0$, les dérivées de $(x, y) \mapsto P_{y}(x - t)f(t)$ jusqu'à l'ordre $2$ sont donc dominées par $C_{b}|f(t)|$, où $C_{b} = \mathop{\displaystyle \max_{k \leqslant 2}}\dfrac{c_{k}}{b^{k+1}}$, fonction intégrable : les théorèmes 1 et 2, appliqués variable par variable, donnent la classe $C^{2}$ de $u$, et 
    $$\Delta u(x, y) = \int_{\mathbb{R}}(\Delta P)(x - t, y)f(t)\,\mathrm{d} t = 0.$$

    **3.** Avec $t = x - yv$, $u(x, y) = \dfrac{1}{\pi}\mathop{\displaystyle \int_{\mathbb{R}}}\dfrac{f(x - yv)}{1 + v^{2}}\,\mathrm{d} v$. L'intégrande est dominé par $\dfrac{\sup|f|}{\pi(1 + v^{2})}$ et tend vers $\dfrac{f(x)}{\pi(1 + v^{2})}$ par continuité de $f$ : $\boxed{u(x, y) \to f(x)}$.

    ![Figure](documents/figures/eeffb902583ae581.svg)

    Les noyaux de Poisson $P_{y}$ pour $y = 1$, $0{,}5$ et $0{,}2$ (ocre, de plus en plus épais) ont tous une aire $1$, et se concentrent en $0$ quand $y \to 0$ : la moyenne de $f$ qu'ils calculent se rapproche de la valeur $f(x)$. Leur décroissance en $\dfrac{1}{x^{2}}$, lente, explique qu'il faille supposer $f$ bornée.

