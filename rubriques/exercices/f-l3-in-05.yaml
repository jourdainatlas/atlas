  enonce: |
    Pour $t \in ]0, 1[$ et $x \in \mathbb{R}$, soit $f(x, t) = \dfrac{t - 1}{\ln t}t^{x}$, et $F(x) = \mathop{\displaystyle \int_{0}^{1}}f(x, t)\,\mathrm{d} t$.

    **1.** Montrer que $F(x)$ est finie si et seulement si $x > -1$.

    **2.** Montrer que $F$ est dérivable sur $]-1, +\infty[$ et calculer $F'(x)$.

    **3.** Calculer $\mathop{\displaystyle \lim_{x \to +\infty}}F(x)$, et en déduire $F(x)$.
  corrige: |
    **1.** $\varphi(t) = \dfrac{t - 1}{\ln t}$ est continue et à valeurs dans $]0, 1[$ sur $]0, 1[$, tend vers $1$ en $1$ et se comporte comme $\dfrac{1}{|\ln t|}$ en $0$. Si $x > -1$, $0 \leqslant f(x, t) \leqslant t^{x}$, intégrable. Si $x \leqslant -1$, $f(x, t) \geqslant \dfrac{c}{t|\ln t|}$ près de $0$, qui n'est pas intégrable, une primitive étant $-\ln|\ln t|$.

    **2.** $\dfrac{\partial f}{\partial x}(x, t) = \varphi(t)\ln t\,t^{x} = (t - 1)t^{x}$, dominé par $t^{a}$ pour $x \geqslant a > -1$ : 
    $$F'(x) = \int_{0}^{1}(t^{x+1} - t^{x})\,\mathrm{d} t = \frac{1}{x + 2} - \frac{1}{x + 1}.$$

    **3.** Pour $x \geqslant 0$, $0 \leqslant f(x, t) \leqslant 1$, et $f(x, t) \to 0$ : $F(x) \to 0$. Comme $\ln\dfrac{x + 2}{x + 1}$ a la même dérivée et tend aussi vers $0$, $\boxed{F(x) = \ln\dfrac{x + 2}{x + 1}}$ ; en particulier $\mathop{\displaystyle \int_{0}^{1}}\dfrac{t - 1}{\ln t}\,\mathrm{d} t = \ln 2$.
- id: "l3-in-05-08"
  feuille: "f-l3-in-05"
