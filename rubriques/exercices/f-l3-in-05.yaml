  enonce: |
    **1.** Montrer que $0 \leqslant 1 - \mathrm{e}^{-z} \leqslant z$ pour $z \geqslant 0$, et en déduire que, pour $y > 0$, la fonction $x \mapsto \dfrac{1 - \mathrm{e}^{-x^{2}y}}{x^{2}}$ est intégrable sur $[0, +\infty[$.

    **2.** Pour $y > 0$, soit $F(y) = \mathop{\displaystyle \int_{0}^{+\infty}}\dfrac{1 - \mathrm{e}^{-x^{2}y}}{x^{2}}\,\mathrm{d} x$. Montrer que $F$ est dérivable sur $]0, +\infty[$ et calculer $F'(y)$, en admettant que $\mathop{\displaystyle \int_{0}^{+\infty}}\mathrm{e}^{-x^{2}}\,\mathrm{d} x = \dfrac{\sqrt{\pi}}{2}$.

    **3.** En déduire $F(y)$ à une constante près, puis déterminer cette constante en étudiant $\mathop{\displaystyle \lim_{n}}F(\dfrac{1}{n})$.
  corrige: |
    **1.** Par convexité, $\mathrm{e}^{-z} \geqslant 1 - z$, et $\mathrm{e}^{-z} \leqslant 1$. L'intégrande est donc majoré par $y$ et par $\dfrac{1}{x^{2}}$, donc par $\mathop{\displaystyle \min}(y, \dfrac{1}{x^{2}})$, intégrable.

    **2.** La dérivée en $y$ de l'intégrande est $\mathrm{e}^{-x^{2}y}$, dominée par $\mathrm{e}^{-ax^{2}}$ pour $y \geqslant a > 0$. Avec $x = \dfrac{u}{\sqrt{y}}$, $F'(y) = \mathop{\displaystyle \int_{0}^{+\infty}}\mathrm{e}^{-x^{2}y}\,\mathrm{d} x = \dfrac{1}{\sqrt{y}}\dfrac{\sqrt{\pi}}{2}$.

    **3.** Donc $F(y) = \sqrt{\pi y} + c$. Pour $n \geqslant 1$, l'intégrande de $F(\dfrac{1}{n})$ est dominé par $\mathop{\displaystyle \min}(1, \dfrac{1}{x^{2}})$ et tend vers $0$ : $F(\dfrac{1}{n}) \to 0$, d'où $c = 0$ et $\boxed{F(y) = \sqrt{\pi y}}$.
- id: "l3-in-05-10"
  feuille: "f-l3-in-05"
  numero: 10
  partie: "Calculs d'intégrales"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["calculs d'intégrales"]
  noeuds: [m-convergence-dominee]
  notions: [integrable-lebesgue]
  source: "Lyon 1 (TD04 2020), exercice 8"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Pour $x \geqslant 0$, soit 
    $$F(x) = \Big(\int_{0}^{x}\mathrm{e}^{-t^{2}}\,\mathrm{d} t\Big)^{2}, \qquad G(x) = \int_{0}^{1}\frac{\mathrm{e}^{-x^{2}(1 + t^{2})}}{1 + t^{2}}\,\mathrm{d} t.$$

    **1.** Montrer que $F$ et $G$ sont de classe $C^{1}$ sur $[0, +\infty[$, et calculer $F'(x) + G'(x)$.

    **2.** En déduire la valeur de $I = \mathop{\displaystyle \int_{0}^{+\infty}}\mathrm{e}^{-t^{2}}\,\mathrm{d} t$, puis celle de $J = \mathop{\displaystyle \int_{\mathbb{R}}}\mathrm{e}^{-t^{2}/2}\,\mathrm{d} t$.
  corrige: |
    **1.** $F'(x) = 2\mathrm{e}^{-x^{2}}\mathop{\displaystyle \int_{0}^{x}}\mathrm{e}^{-t^{2}}\,\mathrm{d} t$. Pour $G$, l'intégrande est continu sur $[0, +\infty[ \times [0, 1]$, et sa dérivée $-2x\mathrm{e}^{-x^{2}(1 + t^{2})}$ est bornée par $2A$ pour $x \leqslant A$, sur $[0, 1]$ de mesure finie : $G$ est de classe $C^{1}$ et, avec $u = xt$, 
    $$G'(x) = -2x\mathrm{e}^{-x^{2}}\int_{0}^{1}\mathrm{e}^{-x^{2}t^{2}}\,\mathrm{d} t = -2\mathrm{e}^{-x^{2}}\int_{0}^{x}\mathrm{e}^{-u^{2}}\,\mathrm{d} u = -F'(x).$$

    **2.** $F + G$ est donc constante, égale à $F(0) + G(0) = \mathop{\displaystyle \int_{0}^{1}}\dfrac{\mathrm{d} t}{1 + t^{2}} = \dfrac{\pi}{4}$. Comme $0 \leqslant G(x) \leqslant \dfrac{\pi}{4}\mathrm{e}^{-x^{2}} \to 0$, $F(x) \to I^{2} = \dfrac{\pi}{4}$, d'où 
    $$\boxed{I = \int_{0}^{+\infty}\mathrm{e}^{-t^{2}}\,\mathrm{d} t = \frac{\sqrt{\pi}}{2}}, \qquad \boxed{J = \int_{\mathbb{R}}\mathrm{e}^{-t^{2}/2}\,\mathrm{d} t = \sqrt{2}\cdot 2I = \sqrt{2\pi}}\text{.}$$
     On obtient ainsi, sans intégrale double, la constante que le chapitre 7 retrouvera par le théorème de Fubini et les coordonnées polaires.
- id: "l3-in-05-11"
  feuille: "f-l3-in-05"
  numero: 11
  partie: "Calculs d'intégrales"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["calculs d'intégrales"]
  noeuds: [m-convergence-dominee]
  notions: [integrable-lebesgue]
  source: "Lyon 1 (TD04 2020), exercice 15"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Pour $x \in \mathbb{R}$, soit $F(x) = \mathop{\displaystyle \int_{0}^{+\infty}}\exp\Big(-\dfrac{1}{2}\Big(\dfrac{x^{2}}{t^{2}} + t^{2}\Big)\Big)\,\mathrm{d} t$. Montrer que $F$ est continue sur $\mathbb{R}$, dérivable sur $\mathbb{R}^{*}$, et que $F'(x) = -F(x)$ pour $x > 0$ (on pourra poser $u = \dfrac{x}{t}$). En déduire $F(x)$ pour tout réel $x$.
  corrige: |
    L'intégrande est majoré par $\mathrm{e}^{-t^{2}/2}$, intégrable, et continu en $x$ : $F$ est continue sur $\mathbb{R}$. Pour $0 < a \leqslant |x| \leqslant b$, la dérivée $-\dfrac{x}{t^{2}}\exp\big(-\dfrac{1}{2}(\dfrac{x^{2}}{t^{2}} + t^{2})\big)$ est dominée par $\dfrac{b}{t^{2}}\mathrm{e}^{-a^{2}/(2t^{2})}\mathrm{e}^{-t^{2}/2}$, bornée près de $0$ et intégrable : $F$ est dérivable sur $\mathbb{R}^{*}$. Pour $x > 0$, le changement de variable $u = \dfrac{x}{t}$ donne 
    $$F'(x) = -\int_{0}^{+\infty}\frac{x}{t^{2}}\mathrm{e}^{-\frac{1}{2}(\frac{x^{2}}{t^{2}} + t^{2})}\,\mathrm{d} t = -\int_{0}^{+\infty}\mathrm{e}^{-\frac{1}{2}(u^{2} + \frac{x^{2}}{u^{2}})}\,\mathrm{d} u = -F(x).$$
     Donc $F(x) = F(0)\mathrm{e}^{-x}$ pour $x \geqslant 0$, par continuité en $0$, et $F$ est paire. Avec l'exercice 10, $F(0) = \dfrac{1}{2}\sqrt{2\pi}$, et $\boxed{F(x) = \sqrt{\dfrac{\pi}{2}}\,\mathrm{e}^{-|x|}}$. L'intégrande est symétrique en $t$ et $\dfrac{x}{t}$ : c'est cette symétrie que le changement de variable exploite.
- id: "l3-in-05-12"
  feuille: "f-l3-in-05"
  numero: 12
  partie: "Calculs d'intégrales"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["calculs d'intégrales"]
  noeuds: [m-convergence-dominee]
  notions: [integrable-lebesgue]
  source: "Lyon 1 (TD04 2020), exercices 9, 17 et 22"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** Soit $I(\alpha) = \mathop{\displaystyle \int_{0}^{+\infty}}\dfrac{\ln(1 + \alpha x^{2})}{1 + x^{2}}\,\mathrm{d} x$ pour $\alpha \geqslant 0$. Montrer que $I$ est continue sur $[0, +\infty[$ et de classe $C^{1}$ sur $]0, +\infty[$. Pour $\alpha \in ]0, +\infty[ \setminus \{1\}$, décomposer $\dfrac{x^{2}}{(1 + x^{2})(1 + \alpha x^{2})}$ en éléments simples, en déduire $I'(\alpha)$, puis $I(\alpha)$.

    **2.** Soit $F(y) = \mathop{\displaystyle \int_{0}^{+\infty}}\dfrac{\mathrm{e}^{-x^{2}y}}{1 + x^{2}}\,\mathrm{d} x$ pour $y \geqslant 0$. Montrer que $F$ est continue sur $[0, +\infty[$, calculer $F(0)$ et $\mathop{\displaystyle \lim_{y \to +\infty}}F(y)$. Montrer que $F$ est dérivable sur $]0, +\infty[$ et solution d'une équation différentielle du premier ordre faisant intervenir $I = \mathop{\displaystyle \int_{0}^{+\infty}}\mathrm{e}^{-x^{2}}\,\mathrm{d} x$. En déduire une expression intégrale de $F(y)$ pour $y \geqslant 0$, et retrouver la valeur de $I$.

    **3.** Soit $F(x) = \mathop{\displaystyle \int_{0}^{+\infty}}\dfrac{\mathrm{d} t}{1 + t^{x}}$. Déterminer l'ensemble $D$ des $x$ pour lesquels $F(x)$ est finie, et montrer que $F$ est continue sur $D$. Montrer que $F$ est de classe $C^{1}$ sur $D$, avec 
    $$F'(x) = \int_{1}^{+\infty}\frac{t^{x}\ln t}{(1 + t^{x})^{2}}\Big(\frac{1}{t^{2}} - 1\Big)\,\mathrm{d} t,$$
     en déduire le sens de variation de $F$, et calculer ses limites aux bornes de $D$.
  corrige: |
    **1.** Pour $0 \leqslant \alpha \leqslant A$, l'intégrande est dominé par $\dfrac{\ln(1 + Ax^{2})}{1 + x^{2}}$, intégrable puisque le logarithme croît moins vite que toute puissance : $I$ est continue. Pour $\alpha \geqslant a > 0$, $\dfrac{\partial}{\partial\alpha} = \dfrac{x^{2}}{(1 + x^{2})(1 + \alpha x^{2})} \leqslant \dfrac{1}{a(1 + x^{2})}$ : $I$ est de classe $C^{1}$ sur $]0, +\infty[$. Pour $\alpha \neq 1$, 
    $$\frac{x^{2}}{(1 + x^{2})(1 + \alpha x^{2})} = \frac{1}{1 - \alpha}\Big(\frac{1}{1 + \alpha x^{2}} - \frac{1}{1 + x^{2}}\Big), \qquad I'(\alpha) = \frac{1}{1 - \alpha}\Big(\frac{\pi}{2\sqrt{\alpha}} - \frac{\pi}{2}\Big) = \frac{\pi}{2\sqrt{\alpha}(1 + \sqrt{\alpha})},$$
     formule qui s'étend à $\alpha = 1$ par continuité de $I'$. C'est la dérivée de $\pi\ln(1 + \sqrt{\alpha})$, et $I(0) = 0$ : $\boxed{I(\alpha) = \pi\ln(1 + \sqrt{\alpha})}$.

    **2.** L'intégrande est dominé par $\dfrac{1}{1 + x^{2}}$ : $F$ est continue, $F(0) = \dfrac{\pi}{2}$, et $F(y) \to 0$ quand $y \to +\infty$. Pour $y \geqslant a > 0$, la dérivée $-\dfrac{x^{2}\mathrm{e}^{-x^{2}y}}{1 + x^{2}}$ est dominée par $\mathrm{e}^{-ax^{2}}$, et, en écrivant $\dfrac{x^{2}}{1 + x^{2}} = 1 - \dfrac{1}{1 + x^{2}}$, 
    $$F'(y) = -\int_{0}^{+\infty}\mathrm{e}^{-x^{2}y}\,\mathrm{d} x + F(y) = F(y) - \frac{I}{\sqrt{y}}.$$
     Donc $(\mathrm{e}^{-y}F)' = -I\dfrac{\mathrm{e}^{-y}}{\sqrt{y}}$, et par continuité en $0$, 
    $$F(y) = \mathrm{e}^{y}\Big(\frac{\pi}{2} - I\int_{0}^{y}\frac{\mathrm{e}^{-s}}{\sqrt{s}}\,\mathrm{d} s\Big).$$
     Comme $F$ tend vers $0$, la parenthèse tend vers $0$ : $\dfrac{\pi}{2} = I\,\Gamma(\dfrac{1}{2}) = 2I^{2}$, et l'on retrouve $\boxed{I = \dfrac{\sqrt{\pi}}{2}}$.

    **3.** Pour $x \leqslant 0$, l'intégrande est minoré par $\dfrac{1}{2}$ sur $[1, +\infty[$ ; pour $x > 0$, il est borné près de $0$ et équivalent à $t^{-x}$ en $+\infty$. Donc $\boxed{D = ]1, +\infty[}$. Le changement de variable $t \mapsto \dfrac{1}{t}$ sur $]0, 1]$ donne 
    $$F(x) = \int_{1}^{+\infty}\frac{1 + t^{x-2}}{1 + t^{x}}\,\mathrm{d} t,$$
     dont la dérivée en $x$ est l'intégrande de l'énoncé. Pour $x \in [a, b] \subset D$, cette dérivée est dominée par $t^{-a}\ln t$, intégrable sur $[1, +\infty[$, et la fonction par $2t^{-a}$ : $F$ est continue et de classe $C^{1}$. Comme $\dfrac{1}{t^{2}} - 1 \leqslant 0$ pour $t \geqslant 1$, $F' < 0$ : $F$ est strictement décroissante. Quand $x \to +\infty$, l'intégrande initial tend vers $\chi_{]0, 1[}$, avec domination par $\chi_{]0, 1]} + t^{-2}\chi_{]1, +\infty[}$ pour $x \geqslant 2$ : $F(x) \to \boxed{1}$. Quand $x \to 1^{+}$, $\dfrac{1}{1 + t^{x}}$ croît vers $\dfrac{1}{1 + t}$ sur $[1, +\infty[$, et la convergence monotone donne $F(x) \to \boxed{+\infty}$.

    ![Figure](documents/figures/152521980372795f.svg)

    La fonction $F$ (ardoise) décroît de $+\infty$ à $1$ (pointillés carmin) sur $]1, +\infty[$. Elle vaut $\dfrac{\pi/x}{\sin(\pi/x)}$, formule que l'on vérifie ici en $x = 2$ (point ocre) et que l'analyse complexe permet d'établir.
- id: "l3-in-05-13"
  feuille: "f-l3-in-05"
  numero: 13
  partie: "Calculs d'intégrales"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["calculs d'intégrales"]
  noeuds: [m-convergence-dominee, tg-arctan]
  notions: [integrable-lebesgue, arc-tangente, cosinus-sinus]
  source: "Lyon 1 (TD04 2020), exercice 19"
  page_enonce: 4
  page_corrige: 6
  enonce: |
    Soit $F(t) = \mathop{\displaystyle \int_{\mathbb{R}}}\dfrac{\arctan(tx)}{x(1 + x^{2})}\,\mathrm{d} x$.

    **1.** Montrer que $F$ est de classe $C^{1}$ sur $\mathbb{R}$, calculer $F'(t)$, puis $F(t)$.

    **2.** En déduire la valeur de $\mathop{\displaystyle \int_{\mathbb{R}}}\Big(\dfrac{\arctan x}{x}\Big)^{2}\,\mathrm{d} x$.
  corrige: |
    **1.** $|\arctan(tx)| \leqslant |tx|$, donc l'intégrande est dominé par $\dfrac{|t|}{1 + x^{2}}$ ; sa dérivée en $t$, $\dfrac{1}{(1 + t^{2}x^{2})(1 + x^{2})}$, est dominée par $\dfrac{1}{1 + x^{2}}$ : $F$ est de classe $C^{1}$ sur $\mathbb{R}$. Pour $t^{2} \neq 1$, une décomposition en éléments simples donne 
    $$F'(t) = \frac{1}{1 - t^{2}}\int_{\mathbb{R}}\Big(\frac{1}{1 + x^{2}} - \frac{t^{2}}{1 + t^{2}x^{2}}\Big)\mathrm{d} x = \frac{\pi(1 - |t|)}{1 - t^{2}} = \frac{\pi}{1 + |t|},$$
     formule qui s'étend par continuité au cas $|t| = 1$. Comme $F(0) = 0$ et $F$ est impaire, 
    $$\boxed{F(t) = \pi\operatorname{sgn}(t)\ln(1 + |t|)}\text{.}$$

    **2.** Par parité, puis par une intégration par parties où les termes de bord tendent vers $0$, puisque $\dfrac{(\arctan x)^{2}}{x} \sim x$ en $0$, 
    $$\int_{\mathbb{R}}\Big(\frac{\arctan x}{x}\Big)^{2}\mathrm{d} x = 2\int_{0}^{+\infty}\frac{2\arctan x}{x(1 + x^{2})}\,\mathrm{d} x = 2F(1) = \boxed{2\pi\ln 2 \approx 4{,}355}\text{.}$$
- id: "l3-in-05-14"
  feuille: "f-l3-in-05"
  numero: 14
  partie: "Calculs d'intégrales"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["calculs d'intégrales"]
  noeuds: [m-convergence-dominee]
  notions: [integrable-lebesgue, derivee-successive]
  source: "Lyon 1 (TD04 2020), exercice 10"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Soit $f(t) = \mathop{\displaystyle \int_{0}^{+\infty}}\Big(\dfrac{\sin x}{x}\Big)^{2}\mathrm{e}^{-tx}\,\mathrm{d} x$ pour $t \geqslant 0$.

    **1.** Montrer que $f$ est continue sur $[0, +\infty[$ et deux fois dérivable sur $]0, +\infty[$.

    **2.** Calculer $f''$, et les limites en $+\infty$ de $f$ et de $f'$.

    **3.** En déduire une expression simple de $f$, et la valeur de $\mathop{\displaystyle \int_{0}^{+\infty}}\Big(\dfrac{\sin x}{x}\Big)^{2}\mathrm{d} x$.
  corrige: |
    **1.** $\big(\dfrac{\sin x}{x}\big)^{2} \leqslant \mathop{\displaystyle \min}(1, \dfrac{1}{x^{2}})$, intégrable : $f$ est continue sur $[0, +\infty[$. Pour $t \geqslant a > 0$, les dérivées $-\dfrac{\sin^{2}x}{x}\mathrm{e}^{-tx}$ et $\sin^{2}x\,\mathrm{e}^{-tx}$ sont dominées par $\mathrm{e}^{-ax}$.

    **2.** Avec $\sin^{2}x = \dfrac{1 - \cos 2x}{2}$, 
    $$f''(t) = \int_{0}^{+\infty}\sin^{2}x\,\mathrm{e}^{-tx}\,\mathrm{d} x = \frac{1}{2}\Big(\frac{1}{t} - \frac{t}{t^{2} + 4}\Big) = \frac{2}{t(t^{2} + 4)}.$$
     Par convergence dominée, $f$ et $f'$ tendent vers $0$ en $+\infty$.

    **3.** En intégrant deux fois depuis $+\infty$, 
    $$f'(t) = \frac{1}{4}\ln\frac{t^{2}}{t^{2} + 4}, \qquad \boxed{f(t) = \frac{\pi}{2} - \arctan\frac{t}{2} + \frac{t}{4}\ln\frac{t^{2}}{t^{2} + 4}}\text{,}$$
     où la seconde primitive se calcule par parties, $\mathop{\displaystyle \int}\ln\dfrac{s^{2}}{s^{2} + 4}\,\mathrm{d} s = s\ln\dfrac{s^{2}}{s^{2} + 4} - 4\arctan\dfrac{s}{2}$. Par continuité en $0$, et puisque $t\ln t \to 0$, $\boxed{\mathop{\displaystyle \int_{0}^{+\infty}}\big(\dfrac{\sin x}{x}\big)^{2}\mathrm{d} x = f(0) = \dfrac{\pi}{2}}$. Pour $t = 1{,}3$, la formule et une intégration numérique donnent toutes deux $0{,}59988$.
- id: "l3-in-05-15"
  feuille: "f-l3-in-05"
  numero: 15
  partie: "Calculs d'intégrales"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: ["calculs d'intégrales"]
  noeuds: [m-convergence-dominee]
  notions: [integrable-lebesgue]
  source: "Lyon 1 (TD04 2020), exercice 12 ; Féjoz (exosIntegration), exercice 6.1 (c)"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Pour $x \in \mathbb{R}$, soit 
    $$F(x) = \int_{0}^{+\infty}\frac{\cos(xt)}{1 + t^{2}}\,\mathrm{d} t, \qquad G(x) = \int_{0}^{+\infty}\frac{1 - \cos(xt)}{t^{2}(1 + t^{2})}\,\mathrm{d} t.$$

    **1.** Montrer que $F$ et $G$ sont définies, continues, et que $F$ est bornée. Calculer $F(0)$ et $G(0)$.

    **2.** Montrer que $F(0) - F(x) + G(x) = C|x|$ pour tout $x \in \mathbb{R}$, où $C = \mathop{\displaystyle \int_{0}^{+\infty}}\dfrac{\sin^{2}t}{t^{2}}\,\mathrm{d} t$.

    **3.** Montrer que $G$ est de classe $C^{2}$ sur $\mathbb{R}$, avec $G'' = F$. En déduire que $F$ est de classe $C^{2}$ sur $]0, +\infty[$ et solution de $y'' = y$ sur cet intervalle. Déterminer $F(x)$ pour $x > 0$, puis pour $x \in \mathbb{R}$, et en déduire la valeur de $C$.

    **4.** Calculer la transformée de Fourier de $x \mapsto \dfrac{1}{1 + x^{2}}$ et celle de $x \mapsto \mathrm{e}^{-|x|}$.
  corrige: |
    **1.** $\big|\dfrac{\cos(xt)}{1 + t^{2}}\big| \leqslant \dfrac{1}{1 + t^{2}}$ : $F$ est continue et $|F| \leqslant F(0) = \dfrac{\pi}{2}$. Comme $1 - \cos u \leqslant \dfrac{u^{2}}{2}$, l'intégrande de $G$ est dominé, pour $|x| \leqslant A$, par $\dfrac{A^{2}}{2(1 + t^{2})}$ : $G$ est continue, et $G(0) = 0$.

    **2.** Par linéarité, puisque $\dfrac{1}{1 + t^{2}} + \dfrac{1}{t^{2}(1 + t^{2})} = \dfrac{1}{t^{2}}$, puis avec $u = \dfrac{|x|t}{2}$ et $1 - \cos v = 2\sin^{2}\dfrac{v}{2}$, 
    $$F(0) - F(x) + G(x) = \int_{0}^{+\infty}\frac{1 - \cos(xt)}{t^{2}}\,\mathrm{d} t = \int_{0}^{+\infty}\frac{2\sin^{2}(xt/2)}{t^{2}}\,\mathrm{d} t = |x|\int_{0}^{+\infty}\frac{\sin^{2}u}{u^{2}}\,\mathrm{d} u = C|x|.$$

    **3.** Pour $|x| \leqslant A$, $\big|\dfrac{\sin(xt)}{t(1 + t^{2})}\big| \leqslant \dfrac{A}{1 + t^{2}}$ et $\big|\dfrac{\cos(xt)}{1 + t^{2}}\big| \leqslant \dfrac{1}{1 + t^{2}}$ : $G$ est de classe $C^{2}$ sur $\mathbb{R}$, avec $G'' = F$. Par la question 2, $F = F(0) + G - C|x|$ est de classe $C^{2}$ sur $]0, +\infty[$, et $F'' = G'' = F$. Ainsi $F(x) = a\mathrm{e}^{x} + b\mathrm{e}^{-x}$ pour $x > 0$ ; $F$ étant bornée, $a = 0$, et par continuité en $0$, $b = \dfrac{\pi}{2}$. Par parité, 
    $$\boxed{F(x) = \frac{\pi}{2}\mathrm{e}^{-|x|}}\text{.}$$
     Pour déterminer $C$ : $G$ est paire et dérivable, donc $G'(0) = 0$ ; or, pour $x > 0$, 
    $$G'(x) = C + F'(x) = C - \frac{\pi}{2}\mathrm{e}^{-x} \longrightarrow C - \frac{\pi}{2} \quad (x \to 0^{+}).$$
     Par continuité de $G'$, $\boxed{C = \dfrac{\pi}{2}}$, comme à l'exercice 14, et $G(x) = \dfrac{\pi}{2}\big(|x| - 1 + \mathrm{e}^{-|x|}\big)$.

    ![Figure](documents/figures/890d9da7b450304d.svg)

    La fonction $F$ (ardoise) a un point anguleux en $0$, bien que l'intégrande soit $C^{\infty}$ en $x$ : la dérivée $-\dfrac{t\sin(xt)}{1 + t^{2}}$ n'est pas dominée par une fonction intégrable. $G$ (ocre), de classe $C^{2}$, a pour asymptotes les droites $\dfrac{\pi}{2}(|x| - 1)$, parallèles à $\dfrac{\pi}{2}|x|$ (pointillés carmin) ; la relation $F = F(0) + G - \dfrac{\pi}{2}|x|$ transfère à $F$ le coin de $|x|$.

    **4.** $\mathop{\displaystyle \int_{\mathbb{R}}}\dfrac{\mathrm{e}^{-\mathrm{i}\xi x}}{1 + x^{2}}\,\mathrm{d} x = 2F(\xi)$, par parité : la transformée de $\dfrac{1}{1 + x^{2}}$ est $\boxed{\pi\mathrm{e}^{-|\xi|}}$. Celle de $\mathrm{e}^{-|x|}$ est $\dfrac{2}{1 + \xi^{2}}$ (cours, exemples de la section sur la transformation de Fourier). Chacune des deux fonctions est, à une constante près, la transformée de l'autre : c'est un cas particulier de la formule d'inversion de Fourier.
