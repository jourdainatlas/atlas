- id: "l3-in-05-01"
  feuille: "f-l3-in-05"
  numero: 1
  partie: "Continuité, dérivabilité"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["continuité, dérivabilité"]
  noeuds: [m-convergence-dominee]
  notions: [integrable-lebesgue]
  source: "Exo7 (fic00145), exercice 14 ; Lyon 1 (TD04 2020), exercice 24 (b)"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $I$ un intervalle ouvert de $\mathbb{R}$ et $f : I \times \Omega \to \mathbb{C}$ telle que $f(s, \cdot)$ soit intégrable pour tout $s \in I$. On suppose qu'il existe un ensemble négligeable $N$ et une fonction intégrable $g$ tels que, pour $x \notin N$, $s \mapsto f(s, x)$ soit dérivable sur $I$, avec $\big|\dfrac{\partial f}{\partial s}(s, x)\big| \leqslant g(x)$ pour tout $s \in I$.

    **1.** Pour $x \notin N$ et $s$, $s' \in I$, montrer que $|f(s, x) - f(s', x)| \leqslant g(x)|s - s'|$.

    **2.** En déduire, en appliquant le théorème de convergence dominée aux taux d'accroissement, que $F(s) = \mathop{\displaystyle \int} f(s, x)\,\mathrm{d}\mu(x)$ est dérivable sur $I$, de dérivée $\mathop{\displaystyle \int}\dfrac{\partial f}{\partial s}(s, x)\,\mathrm{d}\mu(x)$. Montrer que $F'$ est continue si $s \mapsto \dfrac{\partial f}{\partial s}(s, x)$ l'est pour $x \notin N$.

    **3.** Soit $f : \mathbb{R} \to \mathbb{R}$ intégrable, et $F(x) = \mathop{\displaystyle \int_{[0, x]}}f(t)\,\mathrm{d} t$ pour $x \geqslant 0$. Montrer que, si $f$ est continue en $1$, $F$ est dérivable en $1$ et $F'(1) = f(1)$. Pourquoi le théorème 2 du cours ne s'applique-t-il pas directement ?
  corrige: |
    **1.** Pour $x \notin N$, $s \mapsto f(s, x)$ est dérivable sur l'intervalle $I$, de dérivée bornée par $g(x)$ ; l'inégalité des accroissements finis, valable aussi pour les fonctions à valeurs complexes, donne l'inégalité demandée.

    **2.** Soit $s \in I$ et $s_{k} \to s$, $s_{k} \neq s$. Les taux d'accroissement $\tau_{k}(x) = \dfrac{f(s_{k}, x) - f(s, x)}{s_{k} - s}$ tendent vers $\dfrac{\partial f}{\partial s}(s, x)$ pour $x \notin N$, qui est donc mesurable, et vérifient $|\tau_{k}| \leqslant g$ par la question 1. Le théorème de convergence dominée donne 
    $$\frac{F(s_{k}) - F(s)}{s_{k} - s} = \int\tau_{k}\,\mathrm{d}\mu \to \int\frac{\partial f}{\partial s}(s, x)\,\mathrm{d}\mu(x).$$
     Si $\dfrac{\partial f}{\partial s}(\cdot, x)$ est continue, le théorème 1 du cours, avec la domination par $g$, donne la continuité de $F'$. C'est la démonstration du théorème 2 du cours ; *le point essentiel* est que l'ensemble négligeable $N$ ne dépend pas de $s$, faute de quoi l'inégalité de la question 1 ne serait pas disponible.

    **3.** Pour $h \neq 0$ petit, $\dfrac{F(1 + h) - F(1)}{h} - f(1)$ est la moyenne de $f(t) - f(1)$ sur l'intervalle d'extrémités $1$ et $1 + h$, donc majorée en module par $\mathop{\displaystyle \sup_{|t - 1| \leqslant |h|}}|f(t) - f(1)|$, qui tend vers $0$ : $\boxed{F'(1) = f(1)}$. Le théorème 2 ne s'applique pas à $F(x) = \mathop{\displaystyle \int} f(t)\chi_{[0, x]}(t)\,\mathrm{d} t$ : pour chaque $t$, $x \mapsto \chi_{[0, x]}(t)$ saute en $x = t$, et sa dérivée, nulle ailleurs, ne rend pas compte de la variation de $F$. Le paramètre est dans le domaine d'intégration, non dans l'intégrande.
- id: "l3-in-05-02"
  feuille: "f-l3-in-05"
  numero: 2
  partie: "Continuité, dérivabilité"
  etoiles: 1
  types: [Démonstration, Calcul]
