  source: "Féjoz (exosIntegration), exercice 3.9"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    *Un cas pathologique.* Soit $h(t) = \mathop{\displaystyle \int_{[0, 1]}}|t - x|\,\mathrm{d} x$ pour $t \in [0, 1]$.

    **1.** Calculer $h(t)$.

    **2.** Pouvait-on prévoir, par le théorème 2 du cours et sans calculer $h$, que $h$ est dérivable ?

    **3.** Démontrer directement que $h$ est dérivable, en reprenant la démonstration du théorème 2 : convergence dominée et accroissements finis, en dehors du point $x = t$.
  corrige: |
    **1.** $h(t) = \mathop{\displaystyle \int_{0}^{t}}(t - x)\,\mathrm{d} x + \mathop{\displaystyle \int_{t}^{1}}(x - t)\,\mathrm{d} x = \dfrac{t^{2}}{2} + \dfrac{(1 - t)^{2}}{2} = \boxed{t^{2} - t + \dfrac{1}{2}}$.

    **2.** Non : pour chaque $x \in ]0, 1[$, $t \mapsto |t - x|$ n'est pas dérivable en $t = x$. L'hypothèse « dérivable sur $I$ pour presque tout $x$ » n'est satisfaite pour aucun $x$ de $]0, 1[$.

    **3.** Fixons $t$, et $t_{k} \to t$. Pour $x \neq t$, $\dfrac{|t_{k} - x| - |t - x|}{t_{k} - t} \to \operatorname{sgn}(t - x)$, et ces taux sont bornés par $1$, puisque la valeur absolue est $1$-lipschitzienne. Le point $x = t$ est négligeable, et la convergence dominée donne $h'(t) = \mathop{\displaystyle \int_{[0, 1]}}\operatorname{sgn}(t - x)\,\mathrm{d} x = t - (1 - t) = 2t - 1$, ce que confirme la question 1. Il suffit donc que l'intégrande soit dérivable *au point* $t$ pour presque tout $x$, l'ensemble exceptionnel pouvant dépendre de $t$, pourvu que les taux d'accroissement soient dominés.
