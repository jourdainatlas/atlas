  enonce: |
    Avec les notations de l'exercice 18, soit $f(t) = \mathop{\displaystyle \int_{0}^{+\infty}}\mathrm{e}^{-at}h_{a}(t)\,\mathrm{d} a$ pour $t > 0$. Montrer que $f$ est bien définie et de classe $C^{1}$ sur $]0, +\infty[$.
  corrige: |
    Pour $t > 0$, $a \mapsto \mathrm{e}^{-at}\sqrt{\dfrac{\pi}{a}}\mathrm{e}^{-t^{2}/(4a)}$ est majorée par $\sqrt{\pi}a^{-1/2}\mathrm{e}^{-at}$, intégrable sur $]0, +\infty[$ : $f$ est définie. Sa dérivée en $t$ vaut $-\sqrt{\dfrac{\pi}{a}}\big(a + \dfrac{t}{2a}\big)\mathrm{e}^{-at - t^{2}/(4a)}$. Pour $t \in [c, d] \subset ]0, +\infty[$, elle est dominée par 
    $$\sqrt{\pi}\Big(a^{1/2} + \frac{d}{2}a^{-3/2}\Big)\mathrm{e}^{-ca}\mathrm{e}^{-c^{2}/(4a)},$$
     qui est bornée près de $0$, le facteur $\mathrm{e}^{-c^{2}/(4a)}$ l'emportant sur $a^{-3/2}$, et intégrable à l'infini grâce à $\mathrm{e}^{-ca}$. Les théorèmes 1 et 2 donnent la classe $C^{1}$ sur $]c, d[$, donc sur $]0, +\infty[$. La domination n'est pas uniforme près de $t = 0$, où le facteur $\mathrm{e}^{-t^{2}/(4a)}$ ne protège plus la singularité en $a = 0$.
