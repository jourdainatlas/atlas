  source: "Lyon 1 (TD04 2020), exercice 1 ; Exo7 (fic00145), exercice 15 ; Féjoz (exosIntegration), exercice 6.1 (b)"
  page_enonce: 5
  page_corrige: 9
  enonce: |
    **1.** Pour $a > 0$, calculer la transformée de Fourier de $\chi_{[-a, a]}$. Vérifier sur cet exemple que $\widehat{f}$ est continue, bornée par $\mathop{\displaystyle \int}|f|$, et tend vers $0$ à l'infini. Est-elle intégrable ?

    **2.** Calculer la transformée de Fourier du *train d'onde* $f_{a}(x) = \sin x\,\chi_{[-a, a]}(x)$. Décrire, à l'aide d'un graphe, ce qui se passe quand $a \to +\infty$.

    **3.** Vérifier sur l'exemple de la question 1 la formule $\widehat{f}\,' = \widehat{g}$, où $g(x) = -\mathrm{i} xf(x)$.
  corrige: |
    **1.** Pour $\xi \neq 0$, $\widehat{\chi_{[-a, a]}}(\xi) = \mathop{\displaystyle \int_{-a}^{a}}\mathrm{e}^{-\mathrm{i}\xi x}\,\mathrm{d} x = \boxed{\dfrac{2\sin(a\xi)}{\xi}}$, et la valeur en $0$ est $2a$. Cette fonction est continue (la limite en $0$ est $2a$), bornée par $2a = \mathop{\displaystyle \int}|f|$, et majorée par $\dfrac{2}{|\xi|}$, donc tend vers $0$ à l'infini. Elle n'est pas intégrable : avec $u = a\xi$, c'est la fonction $\dfrac{\sin u}{u}$ de l'exercice 16, à une constante près. La transformée d'une fonction intégrable n'est pas forcément intégrable.

    **2.** Comme $\sin x = \dfrac{\mathrm{e}^{\mathrm{i} x} - \mathrm{e}^{-\mathrm{i} x}}{2\mathrm{i}}$, la proposition 4 (ii) du cours donne 
    $$\widehat{f_{a}}(\xi) = \frac{1}{2\mathrm{i}}\Big(\widehat{\chi_{[-a, a]}}(\xi - 1) - \widehat{\chi_{[-a, a]}}(\xi + 1)\Big),$$
     soit 
    $$\mathrm{i}\,\widehat{f_{a}}(\xi) = \varphi_{a}(\xi) = \frac{\sin(a(\xi - 1))}{\xi - 1} - \frac{\sin(a(\xi + 1))}{\xi + 1}.$$

    ![Figure](documents/figures/5f5b32e47a58a03d.svg)

    La fonction réelle $\varphi_{a} = \mathrm{i}\widehat{f_{a}}$, pour $a = 5$ (ocre) et $a = 15$ (ardoise) : deux pics, de hauteur voisine de $a$ et de largeur de l'ordre de $\dfrac{\pi}{a}$, se forment aux fréquences $\pm 1$ (pointillés carmin) du sinus. Plus l'onde est longue, mieux sa transformée localise sa fréquence.

    Quand $a \to +\infty$, $\varphi_{a}$ se concentre en deux pics de plus en plus hauts et étroits en $\xi = \pm 1$, et tend vers $0$ ailleurs : la transformée de Fourier détecte les deux fréquences $\pm 1$ présentes dans $\sin x = \dfrac{\mathrm{e}^{\mathrm{i} x} - \mathrm{e}^{-\mathrm{i} x}}{2\mathrm{i}}$.

    **3.** On calcule, par parité puis par parties, 
    $$\widehat{g}(\xi) = -\mathrm{i}\int_{-a}^{a}x\mathrm{e}^{-\mathrm{i}\xi x}\,\mathrm{d} x = -2\int_{0}^{a}x\sin(\xi x)\,\mathrm{d} x = \frac{2(a\xi\cos(a\xi) - \sin(a\xi))}{\xi^{2}},$$
     qui est bien la dérivée de $\dfrac{2\sin(a\xi)}{\xi}$.
