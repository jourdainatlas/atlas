  enonce: |
    Soit $\zeta(x) = \mathop{\displaystyle \sum_{n \geqslant 1}}n^{-x}$ pour $x > 1$.

    **1.** Retrouver, en écrivant $\zeta$ comme une intégrale par rapport à la mesure de comptage sur $\mathbb{N}^{*}$, que $\zeta$ est de classe $C^{\infty}$ sur $]1, +\infty[$.

    **2.** Montrer que $\zeta$ est décroissante et convexe, et que $\mathop{\displaystyle \lim_{x \to +\infty}}\zeta(x) = 1$.

    **3.** En comparant la série à une intégrale, montrer que $\dfrac{1}{x - 1} \leqslant \zeta(x) \leqslant 1 + \dfrac{1}{x - 1}$, et en déduire un équivalent de $\zeta(x)$ quand $x \to 1^{+}$.
  corrige: |
    **1.** $\zeta(x) = \mathop{\displaystyle \int_{\mathbb{N}^{*}}}n^{-x}\,\mathrm{d} c(n)$, où $c$ est la mesure de comptage. Les dérivées de $x \mapsto n^{-x} = \mathrm{e}^{-x\ln n}$ sont $(-\ln n)^{m}n^{-x}$, majorées sur $[a, +\infty[$, avec $a > 1$, par $(\ln n)^{m}n^{-a}$, terme général d'une série convergente. Le théorème 2, appliqué $m$ fois, donne la classe $C^{\infty}$ sur $]a, +\infty[$, et $a > 1$ est quelconque.

    **2.** $\zeta'(x) = -\mathop{\displaystyle \sum}\ln n\,n^{-x} < 0$ et $\zeta''(x) = \mathop{\displaystyle \sum}(\ln n)^{2}n^{-x} > 0$. Quand $x \to +\infty$, $n^{-x}$ tend vers $1$ si $n = 1$ et vers $0$ sinon, avec domination par $n^{-2}$ pour $x \geqslant 2$ : $\zeta(x) \to 1$.

    **3.** $t \mapsto t^{-x}$ décroît, donc $\mathop{\displaystyle \int_{n}^{n+1}}t^{-x}\,\mathrm{d} t \leqslant n^{-x} \leqslant \mathop{\displaystyle \int_{n-1}^{n}}t^{-x}\,\mathrm{d} t$ pour $n \geqslant 2$. En sommant, et en gardant le terme $n = 1$ à part pour la majoration, 
    $$\frac{1}{x - 1} = \int_{1}^{+\infty}t^{-x}\,\mathrm{d} t \leqslant \zeta(x) \leqslant 1 + \frac{1}{x - 1}, \qquad\text{d'où}\qquad \boxed{\zeta(x) \sim \frac{1}{x - 1}} \ \text{ quand } x \to 1^{+}.$$

    ![Figure](documents/figures/9f11a05121d09178.svg)

    La fonction $\zeta$ (ardoise) reste dans la bande de largeur $1$ comprise entre $\dfrac{1}{x - 1}$ et $1 + \dfrac{1}{x - 1}$ (ocre). Elle explose comme $\dfrac{1}{x - 1}$ en $1$, et tend vers $1$ (pointillés carmin) à l'infini, où seul le premier terme de la série subsiste.
