  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 202"
  page_enonce: 13
  page_corrige: 22
  enonce: |
    *Équation différentielle des fonctions puissances.* Soient $\alpha$ un réel strictement positif et $f$ une fonction définie sur $]0\,;+\infty[$. En imitant la démonstration du théorème 1 du cours (ou la partie B de l'exercice 29), montrer que les deux conditions suivantes sont équivalentes :

    • la fonction $f$ est dérivable sur $]0\,;+\infty[$ et vérifie, pour tout $x>0$, $f'(x)=\dfrac{\alpha}{x}\,f(x)$ ;

    • il existe un réel $C$ tel que, pour tout $x>0$, $f(x)=C\,x^{\alpha}$.

    On utilisera les fonctions puissances de l'exercice 31 du chapitre 5.
  corrige: |
    D'après l'exercice 31 du chapitre 5, la fonction $x\mapsto x^{-\alpha}$ est dérivable sur $]0\,;+\infty[$, de dérivée $x\mapsto-\alpha\,x^{-\alpha-1}$, et $x^{\alpha}\times x^{-\alpha}=1$.

    Soit $f$ une fonction définie sur $]0\,;+\infty[$. Posons, pour $x>0$, $g(x)=f(x)\,x^{-\alpha}$, de sorte que $f(x)=g(x)\,x^{\alpha}$ ; les fonctions $f$ et $g$ sont dérivables en même temps.

    *Première condition $\Rightarrow$ seconde.* Si $f$ est dérivable et vérifie $f'(x)=\frac{\alpha}{x}f(x)$, alors 
    $$g'(x)=f'(x)\,x^{-\alpha}-\alpha\,x^{-\alpha-1}f(x)=x^{-\alpha}\left(f'(x)-\frac{\alpha}{x}f(x) \right)=0$$
     La fonction $g$, de dérivée nulle sur l'intervalle $]0\,;+\infty[$, est constante, égale à un réel $C$, et $f(x)=C\,x^{\alpha}$.

    *Seconde condition $\Rightarrow$ première.* Si $f(x)=Cx^{\alpha}$, alors $f$ est dérivable et $f'(x)=C\alpha x^{\alpha-1}=\frac{\alpha}{x}\,Cx^{\alpha}=\frac{\alpha}{x}f(x)$. 
    $$\boxed{f'(x)=\frac{\alpha}{x}f(x)\ \text{sur } ]0\,;+\infty[ \iff f(x)=Cx^{\alpha},\ C\in\mathbb{R}}$$
     *Remarque.* Le coefficient $\frac{\alpha}{x}$ n'est plus constant, et les solutions ne sont plus des exponentielles mais des puissances. On peut aussi le comprendre ainsi : en posant $x=\mathrm{e}^{t}$ et $F(t)=f\left(\mathrm{e}^{t}\right)$, on obtient $F'(t)=\mathrm{e}^{t}f'\left(\mathrm{e}^{t}\right) =\alpha F(t)$, une équation du cours, dont les solutions $C\mathrm{e}^{\alpha t}=C\left(\mathrm{e}^{t}\right)^{\alpha} =Cx^{\alpha}$ redonnent le résultat. L'erreur la plus répandue serait de « résoudre » en écrivant $f(x)=C\mathrm{e}^{\frac{\alpha}{x}x}$, comme si $\frac{\alpha}{x}$ était une constante.

