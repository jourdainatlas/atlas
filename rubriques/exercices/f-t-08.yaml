  page_corrige: 11
  enonce: |
    Une culture de bactéries compte initialement $500$ individus. Tant que les ressources sont abondantes, le nombre $N(t)$ de bactéries au bout de $t$ heures vérifie $N'=0{,}3\,N$.

    **1.** Déterminer l'expression de $N(t)$.

    **2.** Calculer $N(5)$ et en donner une valeur approchée à l'unité.

    **3.** Déterminer le temps de doublement de la population, arrondi au centième d'heure.

    **4.** Au bout de combien de temps la culture atteint-elle $10\,000$ bactéries ?

    **5.** Que vaut $\displaystyle\lim_{t\to+\infty}N(t)$ ? Ce modèle peut-il rester valable indéfiniment ? Discuter.
  corrige: |
    **1.** Les solutions de $N'=0{,}3\,N$ sont $t\mapsto C\mathrm{e}^{0,3t}$, et $N(0)=500$ donne $C=500$ : 
    $$\boxed{N(t)=500\,\mathrm{e}^{0,3\,t}}$$

    **2.** 
    $$N(5)=500\,\mathrm{e}^{1,5}\approx\boxed{2\,241 \text{ bactéries}}$$

    **3.** Le temps de doublement $T$ vérifie $\mathrm{e}^{0,3T}=2$, soit : 
    $$\boxed{T=\frac{\ln 2}{0{,}3}\approx 2{,}31 \text{ heures}}$$

    **4.** 
    $$500\,\mathrm{e}^{0,3t}=10\,000 \iff \mathrm{e}^{0,3t}=20 \iff t=\frac{\ln 20}{0{,}3} \approx\boxed{9{,}99 \text{ heures}}$$

    **5.** Comme $0{,}3>0$ : 
    $$\boxed{\lim_{t\to+\infty}N(t)=+\infty}$$

    $$\boxed{\text{Le modèle ne peut pas rester valable indéfiniment}}$$
     Une croissance exponentielle sans limite est physiquement impossible : le milieu de culture est de taille finie, les nutriments s'épuisent et les déchets s'accumulent. Au-delà d'un certain seuil, il faut recourir à un modèle tenant compte de ces contraintes — comme l'équation logistique rencontrée à l'exercice 4.
- id: "t-08-21"
  feuille: "f-t-08"
  numero: 21
  partie: "Modélisation"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équation différentielle, condition initiale, "valeur d'équilibre", chute avec frottements, limite, tableau de variations]
  noeuds: [ed-cauchy-lipschitz]
  notions: [equation-differentielle]
  page_enonce: 7
  page_corrige: 11
  enonce: |
    Un parachutiste saute d'un avion sans vitesse initiale. Sa vitesse $v(t)$, en m$\cdot$s$^{-1}$ au bout de $t$ secondes, vérifie l'équation différentielle : 
    $$v'=-0{,}2\,v+9{,}8$$
     la constante $9{,}8$ étant l'accélération de la pesanteur et le terme $-0{,}2\,v$ traduisant les frottements de l'air.

    **1.** Déterminer la valeur d'équilibre de cette équation. On l'appelle *vitesse limite*.

    **2.** Résoudre l'équation avec la condition initiale $v(0)=0$, et vérifier que $v(t)=49\left(1-\mathrm{e}^{-0,2\,t}\right)$.

    **3.** Calculer $v(5)$ et en donner une valeur approchée au dixième.

    **4.** Étudier le sens de variation de $v$ sur $[0\,;+\infty[$, puis déterminer $\displaystyle\lim_{t\to+\infty}v(t)$.

    **5.** Au bout de combien de temps le parachutiste atteint-il $40$ m$\cdot$s$^{-1}$ ?

    **6.** Le parachutiste atteint-il un jour exactement la vitesse limite ? Justifier mathématiquement, puis commenter physiquement.
  corrige: |
    **1.** Ici $a=-0{,}2$ et $b=9{,}8$ : 
    $$-\frac{b}{a}=-\frac{9{,}8}{-0{,}2}=\boxed{49 \text{ m}\cdot\text{s}^{-1}}$$

    **2.** Les solutions sont $t\mapsto C\mathrm{e}^{-0,2t}+49$. La condition $v(0)=0$ donne $C+49=0$, soit $C=-49$ : 
    $$v(t)=-49\,\mathrm{e}^{-0,2t}+49 \qquad \text{d'où} \qquad \boxed{v(t)=49\left(1-\mathrm{e}^{-0,2\,t}\right)}$$

    **3.** 
    $$v(5)=49\left(1-\mathrm{e}^{-1}\right)\approx\boxed{31{,}0 \text{ m}\cdot\text{s}^{-1}}$$

    **4.** 
    $$v'(t)=49\times 0{,}2\,\mathrm{e}^{-0,2t}=9{,}8\,\mathrm{e}^{-0,2t}>0$$

    $$\boxed{v \text{ est strictement croissante sur } [0\,;+\infty[}$$

    $$\boxed{\lim_{t\to+\infty}v(t)=49}$$

    **5.** On résout $v(t)=40$ : 
    $$49\left(1-\mathrm{e}^{-0,2t}\right)=40 \iff \mathrm{e}^{-0,2t}=1-\frac{40}{49}=\frac{9}{49}$$

    $$-0{,}2\,t=-\ln\left(\frac{49}{9}\right) \qquad \text{d'où} \qquad \boxed{t=\frac{\ln\left(\frac{49}{9}\right)}{0{,}2}\approx 8{,}5 \text{ secondes}}$$

    **6.** Il faudrait $\mathrm{e}^{-0,2t}=0$, ce qui est impossible : 
    $$\boxed{\text{La vitesse limite n'est jamais atteinte exactement}}$$
     Physiquement, l'écart devient toutefois négligeable très vite : au bout de $30$ secondes, $v(30)=49\left(1-\mathrm{e}^{-6}\right)\approx 48{,}88$ m$\cdot$s$^{-1}$, soit moins de $0{,}3\ \%$ d'écart. C'est ce qui justifie l'expression courante de « vitesse limite atteinte ».
- id: "t-08-22"
  feuille: "f-t-08"
  numero: 22
  titre: "QCM"
  partie: "Exercices de synthèse"
  etoiles: 1
  types: [QCM, Démonstration]
  mots_cles: [équation différentielle, "équation y' = ay", "équation y' = ay + b", vérifier une solution, condition initiale, "valeur d'équilibre", radioactivité]
  noeuds: [ed-cauchy-lipschitz, cx-exponentielle]
  notions: [equation-differentielle, exponentielle]
  page_enonce: 8
  page_corrige: 12
  enonce: |
    Pour chaque question, une seule réponse est exacte. La justifier.

    ```tableau
    **Question** ¦ **Réponse A** ¦ **Réponse B** ¦ **Réponse C**
    1. Les solutions de $y'=5y$ sont les fonctions : ¦ $x\mapsto C\mathrm{e}^{5x}$ ¦ $x\mapsto 5\mathrm{e}^{Cx}$ ¦ $x\mapsto C\mathrm{e}^{-5x}$
    2. Les solutions de $y'=-2y+8$ sont les fonctions : ¦ $x\mapsto C\mathrm{e}^{-2x}-4$ ¦ $x\mapsto C\mathrm{e}^{-2x}+4$ ¦ $x\mapsto C\mathrm{e}^{2x}+4$
    3. La valeur d'équilibre de $y'=3y-9$ est : ¦ $3$ ¦ $-3$ ¦ $9$
    4. La solution de $y'=y$ vérifiant $y(0)=2$ est : ¦ $x\mapsto\mathrm{e}^{2x}$ ¦ $x\mapsto 2\mathrm{e}^{x}$ ¦ $x\mapsto\mathrm{e}^{x}+1$
    5. La fonction $x\mapsto 4\mathrm{e}^{-3x}$ est solution de : ¦ $y'=-3y$ ¦ $y'=4y$ ¦ $y'=3y$
    6. Si $a<0$, les solutions non nulles de $y'=ay$ ont pour limite en $+\infty$ : ¦ $0$ ¦ $+\infty$ ¦ $-\infty$
    7. L'équation $y'=2y$ admet comme solution constante : ¦ aucune ¦ la fonction nulle ¦ toutes les constantes
    8. Une équation $y'=ay+b$ avec une condition initiale admet : ¦ aucune solution ¦ une unique solution ¦ une infinité de solutions
    9. La demi-vie d'un noyau de constante $\lambda$ vaut : ¦ $\dfrac{\lambda}{\ln 2}$ ¦ $\dfrac{\ln 2}{\lambda}$ ¦ $\lambda\ln 2$
    10. L'équation $2y'+6y=0$ s'écrit aussi : ¦ $y'=3y$ ¦ $y'=-3y$ ¦ $y'=-6y$
    ```
  corrige: |
    ```tableau
    **Question** ¦ **Réponse** ¦ **Justification**
    1 ¦ **A** ¦ Théorème 1 avec $a=5$. La réponse B place la constante au mauvais endroit, la réponse C se trompe de signe.
    2 ¦ **B** ¦ Ici $a=-2$ et $b=8$, donc $-\dfrac{b}{a}=4$.
    3 ¦ **A** ¦ $a=3$ et $b=-9$, donc $-\dfrac{b}{a}=3$.
    4 ¦ **B** ¦ Les solutions sont $x\mapsto C\mathrm{e}^{x}$, et $C=2$. La réponse A confond la constante multiplicative avec le coefficient de $x$.
    5 ¦ **A** ¦ La dérivée vaut $-12\mathrm{e}^{-3x}$, soit $-3$ fois la fonction.
    6 ¦ **A** ¦ Si $a<0$, alors $\mathrm{e}^{ax}$ tend vers $0$ en $+\infty$, et $C\mathrm{e}^{ax}$ aussi.
    7 ¦ **B** ¦ La fonction nulle correspond à $C=0$. Une constante non nulle aurait une dérivée nulle sans que $2y$ le soit.
    8 ¦ **B** ¦ C'est le théorème 2, étendu au cas $y'=ay+b$ par le théorème 3.
    9 ¦ **B** ¦ C'est la proposition 1 : $T=\dfrac{\ln 2}{\lambda}$.
    10 ¦ **B** ¦ En divisant par $2$ : $y'+3y=0$, soit $y'=-3y$.
    ```
- id: "t-08-23"
  feuille: "f-t-08"
  numero: 23
  titre: "Vrai ou faux"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [équation différentielle, "équation y' = ay", "équation y' = ay + b", vérifier une solution, condition initiale, courbes intégrales, radioactivité, lecture graphique]
  noeuds: [ed-cauchy-lipschitz, cx-exponentielle]
  notions: [equation-differentielle, exponentielle]
  page_enonce: 8
  page_corrige: 12
  enonce: |
    Chacune des affirmations suivantes est-elle vraie ou fausse ? Justifier la réponse : par une démonstration si l'affirmation est vraie, par un contre-exemple sinon.

    **1.** L'équation différentielle $y'=3y$ admet une infinité de solutions.

    **2.** La fonction nulle est solution de toute équation différentielle de la forme $y'=ay$.

    **3.** La fonction nulle est solution de $y'=2y+1$.

    **4.** Si $f$ et $g$ sont solutions de $y'=ay$, alors $f+g$ l'est aussi.

    **5.** Si $f$ et $g$ sont solutions de $y'=ay+b$ avec $b\neq 0$, alors $f+g$ l'est aussi.

    **6.** Deux courbes intégrales distinctes de $y'=ay$ peuvent se couper.

    **7.** Les solutions de $y'=-y+3$ ont toutes pour limite $3$ en $+\infty$.

    **8.** La solution de $y'=2y$ vérifiant $y(0)=0$ est la fonction nulle.

    **9.** La demi-vie d'un noyau radioactif dépend de la quantité initiale.

    **10.** Toute solution non nulle de $y'=ay$ garde un signe constant sur $\mathbb{R}$.
  corrige: |
    **1.** **Vraie**. Les solutions sont les fonctions $x\mapsto C\mathrm{e}^{3x}$, et chaque valeur du réel $C$ en fournit une : il y en a donc une infinité.

    **2.** **Vraie**. Si $f=0$, alors $f'=0$ et $af=0$ : l'égalité est vérifiée quel que soit $a$. C'est le cas $C=0$ du théorème 1.

    **3.** **Fausse**. Si $f=0$, alors $f'=0$ tandis que $2f+1=1\neq 0$. La fonction nulle n'est solution de $y'=ay+b$ que si $b=0$.

    **4.** **Vraie**. Si $f'=af$ et $g'=ag$, alors : 
    $$(f+g)'=f'+g'=af+ag=a(f+g)$$
     La somme est donc bien solution.

    **5.** **Fausse**. Si $f'=af+b$ et $g'=ag+b$, alors : 
    $$(f+g)'=af+b+ag+b=a(f+g)+2b$$
     On obtient $2b$ et non $b$ : la somme est solution de $y'=ay+2b$. Contre-exemple avec $y'=y+1$ : la fonction constante $-1$ est solution, mais la fonction constante $-2$ ne l'est pas.

    **6.** **Fausse**. C'est exactement ce qu'interdit le théorème 2 : par chaque point du plan passe une unique courbe intégrale. Si deux courbes se coupaient en un point, il y aurait deux solutions pour une même condition initiale.

    **7.** **Vraie**. Les solutions sont $x\mapsto C\mathrm{e}^{-x}+3$. Comme $-1<0$, le terme $C\mathrm{e}^{-x}$ tend vers $0$ en $+\infty$, et ce quelle que soit la valeur de $C$.

    **8.** **Vraie**. Les solutions sont $x\mapsto C\mathrm{e}^{2x}$, et la condition donne $C=0$ : c'est bien la fonction nulle. L'unicité du théorème 2 garantit qu'il n'y en a pas d'autre.

    **9.** **Fausse**. C'est précisément le point remarquable de la proposition 1 : $T=\dfrac{\ln 2}{\lambda}$ ne dépend que de $\lambda$, donc de la nature du noyau, et nullement de $N_{0}$.

    **10.** **Vraie**. Une solution non nulle s'écrit $C\mathrm{e}^{ax}$ avec $C\neq 0$. Comme l'exponentielle est strictement positive, le signe de $f(x)$ est celui de $C$ : il est constant, et $f$ ne s'annule jamais.
- id: "t-08-24"
  feuille: "f-t-08"
  numero: 24
  titre: "Type Bac"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Type Bac, Lecture graphique, Calcul]
  mots_cles: [équation différentielle, "équation y' = ay + b", condition initiale, "valeur d'équilibre", limite, tableau de variations, lecture graphique]
  noeuds: [ed-cauchy-lipschitz]
  notions: [equation-differentielle]
  page_enonce: 9
  page_corrige: 13
  enonce: |
    On considère l'équation différentielle $(E) : y'=-2y+6$, et l'on note $f$ sa solution vérifiant $f(0)=1$.

    **1.** Déterminer la valeur d'équilibre de $(E)$, puis la forme générale de ses solutions.

    **2.** Démontrer que $f(x)=-2\mathrm{e}^{-2x}+3$.

    **3.** Calculer $f'(x)$ et en déduire le sens de variation de $f$ sur $\mathbb{R}$.

    **4.** Déterminer $\displaystyle\lim_{x\to+\infty}f(x)$ et $\displaystyle\lim_{x\to-\infty}f(x)$. Interpréter graphiquement la première.

    **5.** Résoudre l'équation $f(x)=0$. On donnera la valeur exacte, puis une valeur approchée au millième.

    **6.** En déduire le signe de $f(x)$ selon les valeurs de $x$.

    **7.** Déterminer une équation de la tangente à la courbe de $f$ au point d'abscisse $0$.

    **8.** Dresser le tableau de variations complet de $f$.
  corrige: |
    **1.** Ici $a=-2$ et $b=6$, donc : 
    $$-\frac{b}{a}=-\frac{6}{-2}=\boxed{3}$$

    $$\boxed{\text{Les solutions sont les fonctions } x\mapsto C\mathrm{e}^{-2x}+3}$$

    **2.** La condition $f(0)=1$ donne $C+3=1$, soit $C=-2$ : 
    $$\boxed{f(x)=-2\mathrm{e}^{-2x}+3}$$

    **3.** 
    $$f'(x)=-2\times(-2)\mathrm{e}^{-2x}=4\mathrm{e}^{-2x}$$
     L'exponentielle étant strictement positive, $f'(x)>0$ : 
    $$\boxed{f \text{ est strictement croissante sur } \mathbb{R}}$$

    **4.** Comme $-2<0$ : 
    $$\boxed{\lim_{x\to+\infty}f(x)=3 \qquad ; \qquad \lim_{x\to-\infty}f(x)=-\infty}$$

    $$\boxed{\text{La droite d'équation } y=3 \text{ est asymptote horizontale en } +\infty}$$

    **5.** 
    $$-2\mathrm{e}^{-2x}+3=0 \iff \mathrm{e}^{-2x}=\frac{3}{2} \iff -2x=\ln\left(\frac{3}{2}\right)$$

    $$\boxed{x=-\frac{\ln\left(\frac{3}{2}\right)}{2}\approx -0{,}203}$$

    **6.** La fonction $f$ étant strictement croissante et s'annulant en ce point unique : 
    $$\boxed{f(x)<0 \text{ pour } x<-\frac{\ln\left(\frac{3}{2}\right)}{2} \quad \text{et} \quad f(x)>0 \text{ au-delà}}$$

    **7.** On a $f(0)=1$ et $f'(0)=4\mathrm{e}^{0}=4$, d'où $y=f'(0)(x-0)+f(0)$ : 
    $$\boxed{T : y=4x+1}$$

    **8.**

    ![Figure](documents/figures/f720d51b8eb76bf6.svg)

    La valeur $3$ n'est pas atteinte : elle n'est qu'une limite, matérialisée par l'asymptote.
- id: "t-08-25"
  feuille: "f-t-08"
  numero: 25
  titre: "Type Bac"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Type Bac, Lecture graphique, Calcul]
  mots_cles: [équation différentielle, vérifier une solution, condition initiale, "valeur d'équilibre", loi de refroidissement, tableau de variations, lecture graphique]
  noeuds: [ed-cauchy-lipschitz]
  notions: [equation-differentielle]
  page_enonce: 9
  page_corrige: 14
  enonce: |
    Un plat sorti du four à $180$ °C est posé dans une cuisine dont la température est de $20$ °C. On note $\theta(t)$ sa température au bout de $t$ minutes. On admet que $\theta$ est solution de l'équation différentielle $\theta'=-0{,}03\,\theta+0{,}6$.

    ![Figure](documents/figures/a9eb347f463721d4.svg)

    **1.** Lire graphiquement la température initiale du plat, ainsi qu'une valeur approchée de sa température au bout de $60$ minutes.

    **2.** Déterminer la valeur d'équilibre de l'équation. Que représente la droite tracée en pointillés ?

    **3.** Résoudre l'équation différentielle avec la condition initiale $\theta(0)=180$.

    **4.** Calculer $\theta(30)$ et en donner une valeur approchée au dixième. Comparer à la lecture graphique.

    **5.** Le plat peut être servi lorsque sa température descend à $60$ °C. Déterminer au bout de combien de temps, à la minute près.

    **6.** Étudier le sens de variation de $\theta$ et déterminer sa limite en $+\infty$. Interpréter.
  corrige: |
    **1.** On lit l'ordonnée à l'origine de la courbe, puis celle du point d'abscisse $60$ : 
    $$\boxed{\theta(0)=180 \text{ °C} \qquad ; \qquad \theta(60)\approx 46 \text{ °C}}$$

    **2.** Ici $a=-0{,}03$ et $b=0{,}6$ : 
    $$-\frac{b}{a}=-\frac{0{,}6}{-0{,}03}=\boxed{20}$$

    $$\boxed{\text{La droite en pointillés est l'asymptote horizontale : c'est la température de la cuisine}}$$

    **3.** Les solutions sont $t\mapsto C\mathrm{e}^{-0,03t}+20$, et $\theta(0)=180$ donne $C+20=180$, soit $C=160$ : 
    $$\boxed{\theta(t)=160\,\mathrm{e}^{-0,03\,t}+20}$$

    **4.** 
    $$\theta(30)=160\,\mathrm{e}^{-0,9}+20\approx\boxed{85{,}1 \text{ °C}}$$
     La lecture graphique au point d'abscisse $30$ donnait bien une valeur voisine de $85$ °C.

    **5.** On résout $\theta(t)=60$ : 
    $$160\,\mathrm{e}^{-0,03t}=40 \iff \mathrm{e}^{-0,03t}=\frac{1}{4} \iff -0{,}03\,t=-\ln 4$$

    $$t=\frac{\ln 4}{0{,}03}\approx 46{,}2 \qquad \text{d'où} \qquad \boxed{\text{le plat peut être servi au bout d'environ } 46 \text{ minutes}}$$

    **6.** 
    $$\theta'(t)=160\times(-0{,}03)\mathrm{e}^{-0,03t}=-4{,}8\,\mathrm{e}^{-0,03t}<0$$

    $$\boxed{\theta \text{ est strictement décroissante} \qquad ; \qquad \lim_{t\to+\infty}\theta(t)=20}$$

    $$\boxed{\text{Le plat refroidit sans jamais descendre exactement à } 20 \text{ °C}}$$
     On observe sur la courbe que le refroidissement est rapide au début, puis de plus en plus lent : c'est logique, puisque la vitesse $-0{,}03(\theta-20)$ est proportionnelle à l'écart avec la température ambiante, écart qui diminue.
- id: "t-08-26"
  feuille: "f-t-08"
  numero: 26
  titre: "Type Bac"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Type Bac, Calcul]
  mots_cles: [équation différentielle, "valeur d'équilibre", pharmacocinétique, tableau de variations]
  noeuds: [ed-cauchy-lipschitz]
  notions: [equation-differentielle]
  page_enonce: 10
  page_corrige: 14
  enonce: |
    Un patient reçoit un médicament par perfusion à débit constant. On note $c(t)$ la concentration du médicament dans le sang, en mg$\cdot$L$^{-1}$, au bout de $t$ heures. Elle vérifie : 
    $$c'=-0{,}25\,c+2 \qquad \text{avec} \qquad c(0)=0$$
     Le terme $-0{,}25\,c$ traduit l'élimination par l'organisme, et le terme constant $2$ l'apport de la perfusion.

    **1.** Déterminer la valeur d'équilibre de cette équation, et l'interpréter.

    **2.** Résoudre l'équation différentielle et vérifier que $c(t)=8\left(1-\mathrm{e}^{-0,25\,t}\right)$.

    **3.** Calculer $c(4)$ et en donner une valeur approchée au centième.

    **4.** Étudier le sens de variation de $c$ sur $[0\,;+\infty[$.

    **5.** Le médicament n'est efficace qu'à partir d'une concentration de $6$ mg$\cdot$L$^{-1}$. Déterminer au bout de combien de temps le traitement devient efficace.

    **6.** Le seuil de toxicité est fixé à $10$ mg$\cdot$L$^{-1}$. Démontrer que ce seuil ne sera jamais atteint, quelle que soit la durée de la perfusion.
  corrige: |
    **1.** Ici $a=-0{,}25$ et $b=2$ : 
    $$-\frac{b}{a}=-\frac{2}{-0{,}25}=\boxed{8 \text{ mg}\cdot\text{L}^{-1}}$$

    $$\boxed{\text{C'est la concentration vers laquelle le sang tend à la longue}}$$
     Elle correspond à l'équilibre entre l'apport de la perfusion et l'élimination par l'organisme.

    **2.** Les solutions sont $t\mapsto C\mathrm{e}^{-0,25t}+8$, et $c(0)=0$ donne $C+8=0$, soit $C=-8$ : 
    $$c(t)=-8\,\mathrm{e}^{-0,25t}+8 \qquad \text{d'où} \qquad \boxed{c(t)=8\left(1-\mathrm{e}^{-0,25\,t}\right)}$$

    **3.** 
    $$c(4)=8\left(1-\mathrm{e}^{-1}\right)\approx\boxed{5{,}06 \text{ mg}\cdot\text{L}^{-1}}$$

    **4.** 
    $$c'(t)=8\times 0{,}25\,\mathrm{e}^{-0,25t}=2\,\mathrm{e}^{-0,25t}>0$$

    $$\boxed{c \text{ est strictement croissante sur } [0\,;+\infty[}$$
     La concentration augmente donc continûment, de plus en plus lentement.

    **5.** On résout $c(t)=6$ : 
    $$8\left(1-\mathrm{e}^{-0,25t}\right)=6 \iff \mathrm{e}^{-0,25t}=1-\frac{6}{8}=\frac{1}{4} \iff -0{,}25\,t=-\ln 4$$

    $$\boxed{t=\frac{\ln 4}{0{,}25}\approx 5{,}5 \text{ heures}}$$

    **6.** Pour tout $t\geqslant 0$, on a $\mathrm{e}^{-0,25t}>0$, donc $1-\mathrm{e}^{-0,25t}<1$ et : 
    $$c(t)=8\left(1-\mathrm{e}^{-0,25t}\right)<8$$

    $$\boxed{\text{La concentration reste toujours strictement inférieure à } 8 \text{ mg}\cdot\text{L}^{-1}}$$
     Comme $8<10$, le seuil de toxicité ne peut jamais être atteint : 
    $$\boxed{\text{La perfusion est sans danger, quelle que soit sa durée}}$$
     C'est tout l'intérêt de ce mode d'administration : le débit constant fixe une concentration plafond, indépendante du temps de traitement.
- id: "t-08-27"
  feuille: "f-t-08"
  numero: 27
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [radioactivité]
  noeuds: [ed-cauchy-lipschitz]
  notions: [equation-differentielle]
  page_enonce: 10
  page_corrige: 15
  enonce: |
    On compare deux isotopes radioactifs : l'iode $131$, de demi-vie $8$ jours, et le césium $137$, de demi-vie $30$ ans.

    **1.** Déterminer la constante radioactive $\lambda_{\text{I}}$ de l'iode $131$, puis $\lambda_{\text{Cs}}$ pour le césium $137$. On précisera les unités.

    **2.** Un échantillon d'iode $131$ est mesuré pendant $24$ jours. Sans aucun calcul d'exponentielle, déterminer la proportion d'atomes restants. Justifier.

    **3.** Même question pour un échantillon de césium $137$ observé pendant $60$ ans.

    **4.** Au bout de combien de jours ne reste-t-il plus que $1\ \%$ de l'iode $131$ initial ?

    **5.** Un accident nucléaire libère les deux isotopes. Lequel pose un problème sanitaire à court terme, lequel à long terme ? Justifier à l'aide des résultats précédents.
  corrige: |
    **1.** La proposition 1 donne $\lambda=\dfrac{\ln 2}{T}$ : 
    $$\boxed{\lambda_{\text{I}}=\frac{\ln 2}{8}\approx 0{,}0866 \text{ jour}^{-1}} \qquad ; \qquad \boxed{\lambda_{\text{Cs}}=\frac{\ln 2}{30}\approx 0{,}0231 \text{ an}^{-1}}$$

    **2.** La durée $24$ jours vaut exactement trois demi-vies, puisque $24=3\times 8$. À chaque demi-vie, la quantité est divisée par $2$ : 
    $$\frac{1}{2}\times\frac{1}{2}\times\frac{1}{2}=\frac{1}{8}$$

    $$\boxed{\text{Il reste } \frac{1}{8}, \text{ soit } 12{,}5\ \% \text{ de l'iode initial}}$$

    **3.** De même, $60=2\times 30$ correspond à deux demi-vies : 
    $$\boxed{\text{Il reste } \frac{1}{4}, \text{ soit } 25\ \% \text{ du césium initial}}$$

    **4.** 
    $$\mathrm{e}^{-\lambda_{\text{I}}\,t}=0{,}01 \iff t=\frac{\ln 100}{\lambda_{\text{I}}} =\frac{8\ln 100}{\ln 2}\approx\boxed{53 \text{ jours}}$$

    **5.** L'iode $131$ disparaît presque entièrement en moins de deux mois : il est très actif immédiatement après l'accident, mais son effet s'éteint vite. 
    $$\boxed{\text{L'iode } 131 \text{ pose un problème sanitaire à court terme}}$$
     Le césium $137$, avec une demi-vie de $30$ ans, contamine durablement les sols : après $60$ ans il en reste encore un quart. 
    $$\boxed{\text{Le césium } 137 \text{ pose un problème à long terme}}$$
     C'est ce que l'on observe autour des sites d'accidents nucléaires : l'évacuation d'urgence vise l'iode, tandis que l'interdiction durable des terrains vise le césium.
- id: "t-08-28"
  feuille: "f-t-08"
  numero: 28
  titre: "Type Bac"
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Type Bac, Démonstration, Calcul]
  mots_cles: [équation différentielle, "équation y' = ay", "équation y' = ay + b", vérifier une solution, limite, tableau de variations, solution particulière, lecture graphique]
  noeuds: [ed-cauchy-lipschitz, cx-exponentielle]
  notions: [equation-differentielle, exponentielle]
  page_enonce: 11
  page_corrige: 16
  enonce: |
    On considère l'équation différentielle : 
    $$(E) : \quad y'=-2y+4x$$
     Le second membre n'étant plus constant, le théorème 3 ne s'applique pas directement. On va donc reprendre la méthode de sa démonstration.

    **Partie A : recherche d'une solution particulière.**

    **1.** Déterminer les réels $a$ et $b$ pour que la fonction $\varphi:x\mapsto ax+b$ soit solution de $(E)$.

    **Partie B : résolution complète.**

    **2.** Soit $f$ une fonction dérivable sur $\mathbb{R}$. Démontrer que $f$ est solution de $(E)$ si et seulement si $f-\varphi$ est solution de l'équation $y'=-2y$.

    **3.** En déduire l'ensemble des solutions de $(E)$.

    **4.** Déterminer la solution $g$ de $(E)$ vérifiant $g(0)=3$.

    **Partie C : étude de la solution obtenue.**

    **5.** Calculer $g'(x)$, puis résoudre l'équation $g'(x)=0$.

    **6.** Dresser le tableau de variations de $g$ sur $\mathbb{R}$, en donnant la valeur exacte du minimum.

    **7.** Démontrer que $\displaystyle\lim_{x\to+\infty}\left[g(x)-(2x-1)\right]=0$. Qu'en déduit-on pour la courbe de $g$ ?
  corrige: |
    **Partie A : recherche d'une solution particulière.**

    **1.** Si $\varphi(x)=ax+b$, alors $\varphi'(x)=a$. L'équation $(E)$ s'écrit : 
    $$a=-2(ax+b)+4x=(-2a+4)x-2b$$
     Cette égalité doit être vraie pour tout réel $x$. En identifiant les coefficients : 
    $$\left\{\begin{array}{l} -2a+4=0 \\ a=-2b \end{array}\right. \qquad \Longrightarrow \qquad \left\{\begin{array}{l} a=2 \\ b=-1 \end{array}\right.$$

    $$\boxed{\varphi(x)=2x-1}$$
     Vérification : $\varphi'(x)=2$ et $-2(2x-1)+4x=-4x+2+4x=2$.

    **Partie B : résolution complète.**

    **2.** Posons $g=f-\varphi$, fonction dérivable sur $\mathbb{R}$. Alors : En dérivant, $g'(x)=f'(x)-\varphi'(x)=f'(x)-2$.

    Sens direct. Si $f$ est solution de $(E)$, alors $f'(x)=-2f(x)+4x$, donc : 
    $$g'(x)=-2f(x)+4x-2=-2\big(g(x)+\varphi(x)\big)+4x-2$$

    $$=-2g(x)-2(2x-1)+4x-2=-2g(x)-4x+2+4x-2=-2g(x)$$
     La fonction $g$ est donc solution de $y'=-2y$.

    Réciproque. Si $g'=-2g$, alors $f=g+\varphi$ vérifie : 
    $$f'(x)=g'(x)+2=-2g(x)+2=-2\big(f(x)-\varphi(x)\big)+2$$

    $$=-2f(x)+2(2x-1)+2=-2f(x)+4x-2+2=-2f(x)+4x$$
     donc $f$ est solution de $(E)$. 
    $$\boxed{f \text{ est solution de } (E) \iff f-\varphi \text{ est solution de } y'=-2y}$$

    **3.** Les solutions de $y'=-2y$ sont les fonctions $x\mapsto C\mathrm{e}^{-2x}$. Comme $f=g+\varphi$ : 
    $$\boxed{\text{Les solutions de } (E) \text{ sont les fonctions } x\mapsto C\mathrm{e}^{-2x}+2x-1, \text{ avec } C\in\mathbb{R}}$$

    **4.** La condition $g(0)=3$ donne $C-1=3$, soit $C=4$ : 
    $$\boxed{g(x)=4\mathrm{e}^{-2x}+2x-1}$$

    **Partie C : étude de la solution obtenue.**

    **5.** 
    $$g'(x)=4\times(-2)\mathrm{e}^{-2x}+2=-8\mathrm{e}^{-2x}+2$$

    $$g'(x)=0 \iff \mathrm{e}^{-2x}=\frac{1}{4} \iff -2x=-\ln 4 \iff x=\frac{\ln 4}{2}=\boxed{\ln 2}$$

    **6.** La fonction $x\mapsto -8\mathrm{e}^{-2x}$ est croissante, donc $g'$ l'est aussi : $g'$ est négative avant $\ln 2$ et positive après.

    ![Figure](documents/figures/476bafd0f6f63b53.svg)

    En effet : 
    $$g(\ln 2)=4\mathrm{e}^{-2\ln 2}+2\ln 2-1=4\times\frac{1}{4}+2\ln 2-1=\boxed{2\ln 2\approx 1{,}386}$$

    **7.** 
    $$g(x)-(2x-1)=4\mathrm{e}^{-2x}$$
     Comme $-2<0$, ce terme tend vers $0$ en $+\infty$ : 
    $$\boxed{\lim_{x\to+\infty}\left[g(x)-(2x-1)\right]=0}$$

    $$\boxed{\text{La droite d'équation } y=2x-1 \text{ est asymptote oblique à la courbe de } g \text{ en } +\infty}$$
     De plus $4\mathrm{e}^{-2x}>0$ : la courbe reste toujours au-dessus de cette asymptote.
- id: "t-08-29"
  feuille: "f-t-08"
  numero: 29
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [équation différentielle, "équation y' = ay", "équation y' = ay + b", vérifier une solution, solution particulière]
  noeuds: [ed-cauchy-lipschitz, cx-exponentielle]
  notions: [equation-differentielle, exponentielle]
  page_enonce: 11
  page_corrige: 17
  enonce: |
    Dans tout l'exercice, $a$ et $b$ désignent deux réels avec $a\neq 0$.

    **Partie A : structure des solutions.**

    **1.** Soient $f$ et $g$ deux solutions de $y'=ay$. Démontrer que $f+g$ et $f-g$ sont également solutions.

    **2.** Soit $f$ une solution de $y'=ay$ et $k$ un réel. Démontrer que $kf$ est solution.

    **3.** Soient $f_{1}$ et $f_{2}$ deux solutions de $y'=ay+b$. Démontrer que $f_{1}-f_{2}$ est solution de $y'=ay$.

    **4.** En déduire que si l'on connaît *une* solution particulière de $y'=ay+b$, alors on les connaît toutes.

    **Partie B : redémonstration du théorème 1.**

    Soit $f$ une solution quelconque de $y'=ay$ sur $\mathbb{R}$. On pose, pour tout réel $x$ : 
    $$g(x)=f(x)\,\mathrm{e}^{-ax}$$

    **5.** Justifier que $g$ est dérivable sur $\mathbb{R}$, puis calculer $g'(x)$.

    **6.** En utilisant le fait que $f$ est solution de $y'=ay$, démontrer que $g'(x)=0$ pour tout réel $x$.

    **7.** Qu'en déduit-on pour la fonction $g$ ? Conclure quant à l'expression de $f$.
  corrige: |
    **Partie A : structure des solutions.**

    **1.** Par hypothèse $f'=af$ et $g'=ag$. La somme et la différence sont dérivables, et : 
    $$(f+g)'=f'+g'=af+ag=a(f+g)$$

    $$(f-g)'=f'-g'=af-ag=a(f-g)$$

    $$\boxed{f+g \text{ et } f-g \text{ sont solutions de } y'=ay}$$

    **2.** 
    $$(kf)'=k\,f'=k\,(af)=a\,(kf)$$

    $$\boxed{kf \text{ est solution de } y'=ay}$$

    **3.** Par hypothèse $f_{1}'=af_{1}+b$ et $f_{2}'=af_{2}+b$. En soustrayant : 
    $$(f_{1}-f_{2})'=f_{1}'-f_{2}'=\big(af_{1}+b\big)-\big(af_{2}+b\big) =a\big(f_{1}-f_{2}\big)$$
     Les deux termes constants $b$ se sont éliminés : 
    $$\boxed{f_{1}-f_{2} \text{ est solution de } y'=ay}$$

    **4.** Soit $\varphi$ une solution particulière connue de $y'=ay+b$, et $f$ une solution quelconque. D'après la question 3, $f-\varphi$ est solution de $y'=ay$, donc il existe un réel $C$ tel que $f(x)-\varphi(x)=C\mathrm{e}^{ax}$, c'est-à-dire : 
    $$f(x)=\varphi(x)+C\mathrm{e}^{ax}$$

    $$\boxed{\text{Connaître une seule solution particulière suffit à les connaître toutes}}$$
     C'est exactement la méthode employée dans la démonstration du théorème 3, et reprise à l'exercice 28.

    **Partie B : redémonstration du théorème 1.**

    **5.** La fonction $g$ est le produit de $f$, dérivable par hypothèse, et de $x\mapsto\mathrm{e}^{-ax}$, dérivable sur $\mathbb{R}$. Elle est donc dérivable, et : 
    $$g'(x)=f'(x)\,\mathrm{e}^{-ax}+f(x)\times(-a)\mathrm{e}^{-ax}=\big(f'(x)-a\,f(x)\big)\mathrm{e}^{-ax}$$

    **6.** Comme $f$ est solution de $y'=ay$, on a $f'(x)=a\,f(x)$, donc $f'(x)-a\,f(x)=0$ : 
    $$\boxed{g'(x)=0\times\mathrm{e}^{-ax}=0 \text{ pour tout réel } x}$$

    **7.** Une fonction de dérivée nulle sur un *intervalle* y est constante. Comme $\mathbb{R}$ est un intervalle, il existe un réel $C$ tel que $g(x)=C$ pour tout $x$, c'est-à-dire $f(x)\mathrm{e}^{-ax}=C$. En multipliant les deux membres par $\mathrm{e}^{ax}$, qui n'est jamais nul : 
    $$\boxed{f(x)=C\mathrm{e}^{ax}}$$
     On a bien démontré qu'il n'existe pas d'autres solutions que celles annoncées par le théorème 1.
- id: "t-08-30"
  feuille: "f-t-08"
  numero: 30
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Calcul]
  mots_cles: [équation différentielle, "équation y' = ay + b", vérifier une solution, "valeur d'équilibre", limite, tableau de variations, lecture graphique]
  noeuds: [ed-cauchy-lipschitz]
  notions: [equation-differentielle]
  page_enonce: 11
  page_corrige: 18
  enonce: |
    Pour tout réel $C$, on note $f_{C}$ la fonction définie sur $\mathbb{R}$ par : 
    $$f_{C}(x)=C\,\mathrm{e}^{-x}+2$$

    **1.** Vérifier que $f_{C}$ est solution de l'équation différentielle $y'=-y+2$.

    **2.** Déterminer $C$ pour que la courbe de $f_{C}$ passe par le point de coordonnées $(0\,;5)$.

    **3.** Déterminer $C$ pour que $f_{C}(1)=0$. On donnera la valeur exacte.

    **4.** Calculer $f_{C}'(x)$ et étudier le sens de variation de $f_{C}$ selon le signe de $C$.

    **5.** Existe-t-il une valeur de $C$ pour laquelle $f_{C}$ est constante ? Quel lien avec la valeur d'équilibre ?

    **6.** Déterminer $\displaystyle\lim_{x\to+\infty}f_{C}(x)$. Ce résultat dépend-il de $C$ ?

    **7.** Soient $C$ et $C'$ deux réels distincts. Démontrer que les courbes de $f_{C}$ et $f_{C'}$ n'ont aucun point commun. Quel théorème du cours retrouve-t-on ainsi ?
  corrige: |
    **1.** 
    $$f_{C}'(x)=C\times(-1)\mathrm{e}^{-x}=-C\mathrm{e}^{-x}$$

    $$-f_{C}(x)+2=-\left(C\mathrm{e}^{-x}+2\right)+2=-C\mathrm{e}^{-x}$$
     Les deux expressions coïncident : $\boxed{f_{C} \text{ est solution de } y'=-y+2}$

    **2.** 
    $$f_{C}(0)=C+2=5 \qquad \text{d'où} \qquad \boxed{C=3}$$

    **3.** 
    $$f_{C}(1)=C\mathrm{e}^{-1}+2=0 \iff C\mathrm{e}^{-1}=-2 \qquad \text{d'où} \qquad \boxed{C=-2\mathrm{e}}$$

    **4.** Comme $\mathrm{e}^{-x}>0$, le signe de $f_{C}'(x)=-C\mathrm{e}^{-x}$ est l'opposé de celui de $C$ : 
    $$\boxed{\begin{array}{ll} \text{si } C>0 & : \; f_{C} \text{ est strictement décroissante} \\[1mm] \text{si } C<0 & : \; f_{C} \text{ est strictement croissante} \\[1mm] \text{si } C=0 & : \; f_{C} \text{ est constante} \end{array}}$$

    **5.** Oui : pour $C=0$, la fonction $f_{0}$ est constante égale à $2$. 
    $$\boxed{C=0 \text{ donne la solution constante } x\mapsto 2}$$
     Cette valeur $2$ est exactement la valeur d'équilibre $-\dfrac{b}{a}=-\dfrac{2}{-1}=2$ : partir de l'équilibre, c'est y rester.

    **6.** Comme $-1<0$, le terme $C\mathrm{e}^{-x}$ tend vers $0$ en $+\infty$ : 
    $$\boxed{\lim_{x\to+\infty}f_{C}(x)=2}$$

    $$\boxed{\text{Ce résultat ne dépend pas de } C}$$
     Toutes les courbes intégrales admettent donc la même asymptote horizontale $y=2$.

    **7.** Supposons que les deux courbes aient un point commun d'abscisse $x_{0}$. Alors : 
    $$C\mathrm{e}^{-x_{0}}+2=C'\mathrm{e}^{-x_{0}}+2 \iff (C-C')\,\mathrm{e}^{-x_{0}}=0$$
     L'exponentielle ne s'annulant jamais, il vient $C-C'=0$, c'est-à-dire $C=C'$, ce qui contredit l'hypothèse. 
    $$\boxed{\text{Deux courbes distinctes de cette famille n'ont aucun point commun}}$$

    $$\boxed{\text{On retrouve le théorème 2 : par chaque point du plan passe une unique courbe intégrale}}$$
- id: "t-08-31"
  feuille: "f-t-08"
  numero: 31
  partie: "Pour aller plus loin"
  etoiles: 2
  types: [Calcul]
  mots_cles: [solution particulière]
  noeuds: []
  notions: []
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 196"
  page_enonce: 12
  page_corrige: 19
  enonce: |
    Soit $\lambda\in\mathbb{R}$. On cherche les fonctions $f$ dérivables sur $\mathbb{R}$ telles que : 
    $$\text{pour tout réel } x, \qquad f'(x)-\lambda f(x)=\mathrm{e}^{x}$$

    **1.** Traiter le cas $\lambda\neq 1$. On cherchera une solution particulière de la forme $x\mapsto C\mathrm{e}^{x}$.

    **2.** Traiter le cas $\lambda=1$. On cherchera une solution particulière de la forme $x\mapsto Cx\mathrm{e}^{x}$.
  corrige: |
    L'équation s'écrit $y'=\lambda y+\mathrm{e}^{x}$. Comme à l'exercice 28, dès que l'on connaît une solution particulière $\varphi$, une fonction $f$ est solution si et seulement si $f-\varphi$ est solution de $y'=\lambda y$, c'est-à-dire si et seulement si $f=\varphi+K\mathrm{e}^{\lambda x}$ avec $K\in\mathbb{R}$.

    **1.** Cherchons $\varphi(x)=C\mathrm{e}^{x}$. Alors $\varphi'(x)-\lambda\varphi(x)=(1-\lambda)C\mathrm{e}^{x}$, et cette quantité vaut $\mathrm{e}^{x}$ pour tout $x$ si et seulement si $(1-\lambda)C=1$, soit $C=\frac{1}{1-\lambda}$, ce qui est possible car $\lambda\neq 1$. 
    $$\boxed{\text{Si } \lambda\neq 1, \text{ les solutions sont les fonctions } x\mapsto\frac{\mathrm{e}^{x}}{1-\lambda}+K\mathrm{e}^{\lambda x},\ K\in\mathbb{R}.}$$

    **2.** Pour $\lambda=1$, la fonction $x\mapsto C\mathrm{e}^{x}$ ne convient plus, puisque $(1-\lambda)C=0\neq 1$ : c'est une solution de l'équation sans second membre. Cherchons $\varphi(x)=Cx\mathrm{e}^{x}$. Alors $\varphi'(x)=C(x+1)\mathrm{e}^{x}$ et $\varphi'(x)-\varphi(x)=C\mathrm{e}^{x}$, qui vaut $\mathrm{e}^{x}$ pour $C=1$. 
    $$\boxed{\text{Si } \lambda=1, \text{ les solutions sont les fonctions } x\mapsto(x+K)\mathrm{e}^{x},\ K\in\mathbb{R}.}$$

    *Remarque.* On retrouve le résultat de la question 4 de l'exercice 3 : toutes les fonctions $x\mapsto(x+m)\mathrm{e}^{x}$ sont solutions de $y'=y+\mathrm{e}^{x}$. Lorsque le second membre est lui-même solution de l'équation sans second membre, il faut multiplier la forme cherchée par $x$. Ce phénomène, appelé *résonance*, se retrouve en physique : une excitation à la fréquence propre d'un système produit une réponse qui croît plus vite que l'excitation.
- id: "t-08-32"
  feuille: "f-t-08"
  numero: 32
  partie: "Pour aller plus loin"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [équation différentielle, "équation y' = ay", "équation y' = ay + b", solution particulière, suites]
  noeuds: [ed-cauchy-lipschitz, cx-exponentielle, ar-suites]
  notions: [equation-differentielle, exponentielle, suite]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 3 et n° 48"
  page_enonce: 12
  page_corrige: 19
  enonce: |
    *L'analogue discret de l'équation $y'=ay+b$.*

    **Partie A : suites arithmético-géométriques.** Soient $a$ et $b$ deux réels, et $(u_{n})$ une suite telle que, pour tout entier naturel $n$, $u_{n+1}=au_{n}+b$. On se propose de calculer $u_{n}$ en fonction de $n$ et de $u_{0}$.

    **1.** Traiter le cas $a=1$.

    *On suppose désormais $a\neq 1$.*

    **2.** Résoudre l'équation $x=ax+b$. On note $\ell$ la solution. Dans la question suivante, il est inutile, voire nuisible, de remplacer $\ell$ par sa valeur : seule est utile l'égalité $\ell=a\ell+b$.

    **3.** On pose, pour tout entier naturel $n$, $v_{n}=u_{n}-\ell$. Montrer que $(v_{n})$ est une suite géométrique. Conclure.

    **4.** À quelles conditions portant sur $a$ et $u_{0}$ la suite $(u_{n})$ est-elle convergente ?

    **Partie B : second membre variable.** Soient $(w_{n})$ une suite réelle, $a$ un réel différent de $0$ et de $1$, et $(u_{n})$ une suite telle que, pour tout entier naturel $n$, $u_{n+1}=au_{n}+w_{n}$. On pose, pour tout entier naturel $n$, $z_{n}=\dfrac{u_{n}}{a^{n}}$.

    **5.** Pour $n\in\mathbb{N}$, simplifier $z_{n+1}-z_{n}$.

    **6.** En déduire une expression de $z_{n}$ sous forme de somme, puis de $u_{n}$.
  corrige: |
    **Partie A**

    **1.** Si $a=1$, la relation s'écrit $u_{n+1}=u_{n}+b$ : la suite est arithmétique de raison $b$, et $\boxed{u_{n}=u_{0}+nb}$.

    **2.** Comme $a\neq 1$, $x=ax+b\iff(1-a)x=b\iff x=\dfrac{b}{1-a}$. 
    $$\boxed{\ell=\frac{b}{1-a}}$$

    **3.** Pour tout $n$, en soustrayant membre à membre $u_{n+1}=au_{n}+b$ et $\ell=a\ell+b$ : 
    $$v_{n+1}=u_{n+1}-\ell=a(u_{n}-\ell)=a\,v_{n}$$
     La suite $(v_{n})$ est géométrique de raison $a$, donc $v_{n}=a^{n}v_{0}$ et 
    $$\boxed{u_{n}=\ell+a^{n}\left(u_{0}-\ell\right)}$$
     *Vérification :* avec $u_{n+1}=0{,}8\,u_{n}+60$ et $u_{0}=100$ (exercice 29 du chapitre 5), on trouve $\ell=\frac{60}{0{,}2}=300$ et $u_{n}=300-200\times 0{,}8^{\,n}$, la formule déjà obtenue.

    **4.** Si $u_{0}=\ell$, la suite est constante, égale à $\ell$, donc convergente. Sinon, $u_{n}-\ell=a^{n}(u_{0}-\ell)$ avec $u_{0}-\ell\neq 0$, et $(u_{n})$ converge si et seulement si $(a^{n})$ converge, c'est-à-dire si et seulement si $-1<a\leqslant 1$ ; le cas $a=1$ étant exclu ici, il reste $-1<a<1$, et la limite est alors $\ell$. 
    $$\boxed{(u_{n}) \text{ converge si et seulement si } u_{0}=\ell \text{ ou } |a|<1.}$$

    *Remarque.* Le parallèle avec le cours est complet. Le point fixe $\ell$ joue le rôle de la valeur d'équilibre $-\frac{b}{a}$, la soustraction de $\ell$ celle de la solution constante, et la suite géométrique $(a^{n})$ celle de $x\mapsto\mathrm{e}^{ax}$. La condition $|a|<1$ remplace la condition $a<0$ qui assurait, pour $y'=ay+b$, la convergence vers l'équilibre.

    **Partie B**

    **5.** Pour tout $n$, comme $a^{n+1}\neq 0$ : 
    $$z_{n+1}-z_{n}=\frac{u_{n+1}}{a^{n+1}}-\frac{u_{n}}{a^{n}}=\frac{u_{n+1}-au_{n}}{a^{n+1}} =\boxed{\frac{w_{n}}{a^{n+1}}}$$

    **6.** En sommant ces égalités pour $k$ allant de $0$ à $n-1$, la somme de gauche se télescope : 
    $$z_{n}=z_{0}+\sum_{k=0}^{n-1}\frac{w_{k}}{a^{k+1}} \qquad\text{d'où}\qquad \boxed{u_{n}=a^{n}u_{0}+\sum_{k=0}^{n-1}a^{\,n-1-k}\,w_{k}}$$
     *Vérification :* pour $n=2$, $u_{2}=a(au_{0}+w_{0})+w_{1}=a^{2}u_{0}+aw_{0}+w_{1}$, ce que donne bien la formule.

    *Remarque.* Diviser par $a^{n}$, c'est exactement ce que fait la partie B de l'exercice 29, où l'on multiplie $f(x)$ par $\mathrm{e}^{-ax}$ : dans les deux cas, on neutralise la partie « géométrique » de l'évolution pour ne garder que l'effet du second membre. Pour les équations différentielles, cette technique s'appelle la *variation de la constante* ; elle est étudiée après le baccalauréat.
