- id: "t-08-01"
  feuille: "f-t-08"
  numero: 1
  partie: "Notion d'équation différentielle"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équation différentielle, "équation y' = ay", "équation y' = ay + b", vérifier une solution, solution particulière]
  noeuds: [ed-cauchy-lipschitz, cx-exponentielle]
  notions: [equation-differentielle, exponentielle]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Dans chaque cas, vérifier que la fonction $f$ proposée est solution de l'équation différentielle donnée. On calculera $f'(x)$ d'une part, et le second membre d'autre part, avant de les comparer.

    **1.** $f(x)=3\mathrm{e}^{4x}$ et $y'=4y$

    **2.** $f(x)=-2\mathrm{e}^{-x}$ et $y'=-y$

    **3.** $f(x)=\mathrm{e}^{3x}+1$ et $y'=3y-3$

    **4.** $f(x)=4\mathrm{e}^{-2x}+5$ et $y'=-2y+10$

    **5.** $f(x)=x\mathrm{e}^{2x}$ et $y'=2y+\mathrm{e}^{2x}$
  corrige: |
    La méthode est toujours la même : on calcule $f'(x)$, on calcule le second membre en remplaçant $y$ par $f(x)$, et l'on compare.

    **1.** $f(x)=3\mathrm{e}^{4x}$ est dérivable sur $\mathbb{R}$ et : 
    $$f'(x)=3\times 4\mathrm{e}^{4x}=12\mathrm{e}^{4x} \qquad ; \qquad 4f(x)=4\times 3\mathrm{e}^{4x}=12\mathrm{e}^{4x}$$
     Les deux expressions coïncident pour tout réel $x$ : $\boxed{f \text{ est solution de } y'=4y}$

    **2.** 
    $$f'(x)=-2\times(-1)\mathrm{e}^{-x}=2\mathrm{e}^{-x} \qquad ; \qquad -f(x)=2\mathrm{e}^{-x}$$

    $$\boxed{f \text{ est solution de } y'=-y}$$

    **3.** 
    $$f'(x)=3\mathrm{e}^{3x} \qquad ; \qquad 3f(x)-3=3\left(\mathrm{e}^{3x}+1\right)-3=3\mathrm{e}^{3x}+3-3 =3\mathrm{e}^{3x}$$

    $$\boxed{f \text{ est solution de } y'=3y-3}$$

    **4.** 
    $$f'(x)=4\times(-2)\mathrm{e}^{-2x}=-8\mathrm{e}^{-2x}$$

    $$-2f(x)+10=-2\left(4\mathrm{e}^{-2x}+5\right)+10=-8\mathrm{e}^{-2x}-10+10=-8\mathrm{e}^{-2x}$$

    $$\boxed{f \text{ est solution de } y'=-2y+10}$$

    **5.** On dérive le produit : 
    $$f'(x)=1\times\mathrm{e}^{2x}+x\times 2\mathrm{e}^{2x}=\mathrm{e}^{2x}+2x\mathrm{e}^{2x}$$

    $$2f(x)+\mathrm{e}^{2x}=2x\mathrm{e}^{2x}+\mathrm{e}^{2x}$$

    $$\boxed{f \text{ est solution de } y'=2y+\mathrm{e}^{2x}}$$
- id: "t-08-02"
  feuille: "f-t-08"
  numero: 2
  partie: "Notion d'équation différentielle"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [équation différentielle, "équation y' = ay", vérifier une solution]
  noeuds: [ed-cauchy-lipschitz, cx-exponentielle]
  notions: [equation-differentielle, exponentielle]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Parmi les six fonctions suivantes, déterminer lesquelles sont solutions sur $\mathbb{R}$ de l'équation différentielle $y'=-3y$. Justifier chaque réponse.

    **a)** $f_{1}(x)=\mathrm{e}^{-3x}$

    **b)** $f_{2}(x)=-3\mathrm{e}^{x}$

    **c)** $f_{3}(x)=5\mathrm{e}^{-3x}$

    **d)** $f_{4}(x)=\mathrm{e}^{3x}$

    **e)** $f_{5}(x)=0$

    **f)** $f_{6}(x)=\mathrm{e}^{-3x}+1$
  corrige: |
    ```tableau
    **Fonction** ¦ $f'(x)$ ¦ $-3f(x)$ ¦ **Solution ?**
    $f_{1}(x)=\mathrm{e}^{-3x}$ ¦ $-3\mathrm{e}^{-3x}$ ¦ $-3\mathrm{e}^{-3x}$ ¦ **oui**
    $f_{2}(x)=-3\mathrm{e}^{x}$ ¦ $-3\mathrm{e}^{x}$ ¦ $9\mathrm{e}^{x}$ ¦ non
    $f_{3}(x)=5\mathrm{e}^{-3x}$ ¦ $-15\mathrm{e}^{-3x}$ ¦ $-15\mathrm{e}^{-3x}$ ¦ **oui**
    $f_{4}(x)=\mathrm{e}^{3x}$ ¦ $3\mathrm{e}^{3x}$ ¦ $-3\mathrm{e}^{3x}$ ¦ non
    $f_{5}(x)=0$ ¦ $0$ ¦ $0$ ¦ **oui**
    $f_{6}(x)=\mathrm{e}^{-3x}+1$ ¦ $-3\mathrm{e}^{-3x}$ ¦ $-3\mathrm{e}^{-3x}-3$ ¦ non
    ```

    $$\boxed{\text{Seules } f_{1}, \; f_{3} \text{ et } f_{5} \text{ sont solutions de } y'=-3y}$$

    Ces trois fonctions sont bien de la forme $C\mathrm{e}^{-3x}$, avec respectivement $C=1$, $C=5$ et $C=0$ : elles correspondent exactement à la description du théorème 1. La fonction $f_{6}$ montre qu'ajouter une constante détruit la propriété : c'est le second membre qui distingue $y'=ay$ de $y'=ay+b$.
- id: "t-08-03"
  feuille: "f-t-08"
  numero: 3
  partie: "Notion d'équation différentielle"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équation différentielle, "équation y' = ay", "équation y' = ay + b", vérifier une solution]
  noeuds: [ed-cauchy-lipschitz, cx-exponentielle]
  notions: [equation-differentielle, exponentielle]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Déterminer le réel $k$ pour que la fonction $f:x\mapsto\mathrm{e}^{kx}$ soit solution de $y'=5y$.

    **2.** Déterminer les réels $a$ et $b$ pour que la fonction $f:x\mapsto a\mathrm{e}^{2x}+b$ soit solution de $y'=2y-8$. Combien y a-t-il de possibilités ?

    **3.** Déterminer la constante $C$ pour que la fonction $f:x\mapsto C\mathrm{e}^{-2x}$ vérifie $f(1)=6$.

    **4.** Déterminer les réels $m$ pour lesquels la fonction $f:x\mapsto(x+m)\mathrm{e}^{x}$ est solution de $y'=y+\mathrm{e}^{x}$. Commenter le résultat obtenu.
  corrige: |
    **1.** $f(x)=\mathrm{e}^{kx}$ donne $f'(x)=k\mathrm{e}^{kx}$, tandis que $5f(x)=5\mathrm{e}^{kx}$. L'égalité pour tout $x$ impose $k=5$ : 
    $$\boxed{k=5}$$

    **2.** $f(x)=a\mathrm{e}^{2x}+b$ donne $f'(x)=2a\mathrm{e}^{2x}$, et : 
    $$2f(x)-8=2a\mathrm{e}^{2x}+2b-8$$
     L'égalité pour tout $x$ impose $2b-8=0$, soit $b=4$, sans aucune condition sur $a$ : 
    $$\boxed{b=4 \text{ et } a \text{ quelconque : il y a une infinité de possibilités}}$$
     On retrouve la forme $C\mathrm{e}^{2x}+4$ du théorème 3, avec $-\dfrac{b}{a}=-\dfrac{-8}{2}=4$.

    **3.** 
    $$f(1)=C\mathrm{e}^{-2}=6 \qquad \text{d'où} \qquad \boxed{C=6\mathrm{e}^{2}}$$

    **4.** On dérive le produit : 
    $$f'(x)=1\times\mathrm{e}^{x}+(x+m)\mathrm{e}^{x}=(x+m+1)\mathrm{e}^{x}$$

    $$f(x)+\mathrm{e}^{x}=(x+m)\mathrm{e}^{x}+\mathrm{e}^{x}=(x+m+1)\mathrm{e}^{x}$$
     Les deux expressions sont égales quelle que soit la valeur de $m$ : 
    $$\boxed{\text{Toute valeur de } m \text{ convient}}$$
     Ce n'est pas surprenant : les fonctions $x\mapsto(x+m)\mathrm{e}^{x}$ s'écrivent $x\mathrm{e}^{x}+m\mathrm{e}^{x}$, c'est-à-dire une solution particulière à laquelle on ajoute $m\mathrm{e}^{x}$, solution de $y'=y$. C'est exactement la structure décrite dans le cours.
- id: "t-08-04"
  feuille: "f-t-08"
  numero: 4
  partie: "Notion d'équation différentielle"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équation différentielle, "équation y' = ay + b", vérifier une solution, équation logistique]
  noeuds: [ed-cauchy-lipschitz]
  notions: [equation-differentielle]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Vérifier que chacune des fonctions suivantes est solution de l'équation différentielle indiquée.

    **1.** $f(x)=x^{2}\mathrm{e}^{-x}$ et $y'=-y+2x\mathrm{e}^{-x}$

    **2.** $f(x)=(2x+1)\mathrm{e}^{3x}$ et $y'=3y+2\mathrm{e}^{3x}$

    **3.** $f(x)=\dfrac{1}{1+\mathrm{e}^{-x}}$ et $y'=y(1-y)$

    La troisième équation, dite *logistique*, modélise une croissance limitée par les ressources du milieu. Elle n'est pas au programme, mais on peut vérifier qu'une fonction en est solution.
  corrige: |
    **1.** $f(x)=x^{2}\mathrm{e}^{-x}$ : 
    $$f'(x)=2x\mathrm{e}^{-x}+x^{2}\times\left(-\mathrm{e}^{-x}\right)=2x\mathrm{e}^{-x}-x^{2}\mathrm{e}^{-x}$$

    $$-f(x)+2x\mathrm{e}^{-x}=-x^{2}\mathrm{e}^{-x}+2x\mathrm{e}^{-x}$$

    $$\boxed{f \text{ est solution de } y'=-y+2x\mathrm{e}^{-x}}$$

    **2.** $f(x)=(2x+1)\mathrm{e}^{3x}$ : 
    $$f'(x)=2\mathrm{e}^{3x}+3(2x+1)\mathrm{e}^{3x}$$

    $$3f(x)+2\mathrm{e}^{3x}=3(2x+1)\mathrm{e}^{3x}+2\mathrm{e}^{3x}$$

    $$\boxed{f \text{ est solution de } y'=3y+2\mathrm{e}^{3x}}$$

    **3.** $f(x)=\dfrac{1}{1+\mathrm{e}^{-x}}$. Le dénominateur est strictement positif, donc $f$ est dérivable sur $\mathbb{R}$. En posant $u(x)=1+\mathrm{e}^{-x}$, on a $u'(x)=-\mathrm{e}^{-x}$ et $f=\dfrac{1}{u}$, dont la dérivée est $-\dfrac{u'}{u^{2}}$ : 
    $$f'(x)=\frac{\mathrm{e}^{-x}}{\left(1+\mathrm{e}^{-x}\right)^{2}}$$
     Par ailleurs : 
    $$1-f(x)=\frac{1+\mathrm{e}^{-x}}{1+\mathrm{e}^{-x}}-\frac{1}{1+\mathrm{e}^{-x}}=\frac{\mathrm{e}^{-x}}{1+\mathrm{e}^{-x}}$$
     d'où : 
    $$f(x)\big(1-f(x)\big)=\frac{1}{1+\mathrm{e}^{-x}}\times\frac{\mathrm{e}^{-x}}{1+\mathrm{e}^{-x}} =\frac{\mathrm{e}^{-x}}{\left(1+\mathrm{e}^{-x}\right)^{2}}$$

    $$\boxed{f \text{ est solution de } y'=y(1-y)}$$
- id: "t-08-05"
  feuille: "f-t-08"
  numero: 5
  partie: "L'équation $y'=ay$"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équation différentielle, "équation y' = ay"]
  noeuds: [ed-cauchy-lipschitz, cx-exponentielle]
  notions: [equation-differentielle, exponentielle]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Résoudre sur $\mathbb{R}$ les équations différentielles suivantes. On identifiera à chaque fois la valeur de $a$.

    **a)** $y'=3y$

    **b)** $y'=-2y$

    **c)** $y'=0{,}5\,y$

    **d)** $y'+4y=0$

    **e)** $2y'=6y$

    **f)** $3y'+y=0$
  corrige: |
    D'après le théorème 1, les solutions de $y'=ay$ sont les fonctions $x\mapsto C\mathrm{e}^{ax}$, où $C$ est une constante réelle quelconque.

    $$\begin{array}{|c||c|c|c|} \hline  & \text{Équation} & \text{Forme }y'=ay & \text{Solutions} \\ \hline \text{a)} & y'=3y & a=3 & x\mapsto C\mathrm{e}^{3x} \\ \hline \text{b)} & y'=-2y & a=-2 & x\mapsto C\mathrm{e}^{-2x} \\ \hline \text{c)} & y'=0{,}5\,y & a=0{,}5 & x\mapsto C\mathrm{e}^{0,5x} \\ \hline \text{d)} & y'+4y=0 & y'=-4y\text{, }a=-4 & x\mapsto C\mathrm{e}^{-4x} \\ \hline \text{e)} & 2y'=6y & y'=3y\text{, }a=3 & x\mapsto C\mathrm{e}^{3x} \\ \hline \text{f)} & 3y'+y=0 & y'=-\frac{1}{3}y\text{, }a=-\frac{1}{3} & x\mapsto C\mathrm{e}^{-\frac{x}{3}} \\ \hline \end{array}$$

    On notera que a) et e) sont la même équation : diviser les deux membres par $2$ ne change ni l'équation ni ses solutions.
- id: "t-08-06"
  feuille: "f-t-08"
  numero: 6
  partie: "L'équation $y'=ay$"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équation différentielle, "équation y' = ay", condition initiale]
  noeuds: [ed-cauchy-lipschitz, cx-exponentielle]
  notions: [equation-differentielle, exponentielle]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Déterminer dans chaque cas l'unique solution vérifiant la condition initiale donnée.

    **a)** $y'=2y$ et $y(0)=5$

    **b)** $y'=-y$ et $y(0)=-3$

    **c)** $y'=3y$ et $y(1)=\mathrm{e}^{3}$

    **d)** $y'=-0{,}5\,y$ et $y(2)=4$

    **e)** $y'+5y=0$ et $y(0)=2$

    **f)** $y'=4y$ et $y(-1)=1$
  corrige: |
    **a)** Les solutions sont $x\mapsto C\mathrm{e}^{2x}$. La condition donne $C\mathrm{e}^{0}=C=5$ : 
    $$\boxed{f(x)=5\mathrm{e}^{2x}}$$

    **b)** Les solutions sont $x\mapsto C\mathrm{e}^{-x}$, et $C=-3$ : $\boxed{f(x)=-3\mathrm{e}^{-x}}$

    **c)** Les solutions sont $x\mapsto C\mathrm{e}^{3x}$. La condition s'écrit $C\mathrm{e}^{3}=\mathrm{e}^{3}$, donc $C=1$ : $\boxed{f(x)=\mathrm{e}^{3x}}$

    **d)** Les solutions sont $x\mapsto C\mathrm{e}^{-0,5x}$. La condition donne $C\mathrm{e}^{-1}=4$, donc $C=4\mathrm{e}$ : 
    $$f(x)=4\mathrm{e}\times\mathrm{e}^{-0,5x} \qquad \text{d'où} \qquad \boxed{f(x)=4\mathrm{e}^{1-0,5x}}$$

    **e)** L'équation s'écrit $y'=-5y$, de solutions $x\mapsto C\mathrm{e}^{-5x}$, et $C=2$ : $\boxed{f(x)=2\mathrm{e}^{-5x}}$

    **f)** Les solutions sont $x\mapsto C\mathrm{e}^{4x}$. La condition donne $C\mathrm{e}^{-4}=1$, donc $C=\mathrm{e}^{4}$ : 
    $$\boxed{f(x)=\mathrm{e}^{4x+4}}$$
- id: "t-08-07"
  feuille: "f-t-08"
  numero: 7
  partie: "L'équation $y'=ay$"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équation différentielle, "équation y' = ay", condition initiale, suites]
  noeuds: [ed-cauchy-lipschitz, cx-exponentielle, ar-suites]
  notions: [equation-differentielle, exponentielle, suite]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Chacune des équations suivantes doit d'abord être ramenée à la forme $y'=ay$. La résoudre ensuite.

    **a)** $4y'-8y=0$

    **b)** $5y'+2y=0$

    **c)** $\dfrac{y'}{2}=-3y$

    **d)** $2y'-y=0$ avec $y(0)=7$
  corrige: |
    **a)** $4y'-8y=0 \iff 4y'=8y \iff y'=2y$ : $\boxed{x\mapsto C\mathrm{e}^{2x}}$

    **b)** $5y'+2y=0 \iff y'=-\dfrac{2}{5}y=-0{,}4\,y$ : $\boxed{x\mapsto C\mathrm{e}^{-0,4x}}$

    **c)** $\dfrac{y'}{2}=-3y \iff y'=-6y$ : $\boxed{x\mapsto C\mathrm{e}^{-6x}}$

    **d)** $2y'-y=0 \iff y'=0{,}5\,y$, de solutions $x\mapsto C\mathrm{e}^{0,5x}$. La condition $y(0)=7$ donne $C=7$ : 
    $$\boxed{f(x)=7\mathrm{e}^{0,5x}}$$

    Le réflexe est toujours le même : **isoler $y'$ seul dans le membre de gauche**, en divisant par son coefficient. C'est seulement alors que l'on peut lire $a$.
- id: "t-08-08"
  feuille: "f-t-08"
  numero: 8
  partie: "L'équation $y'=ay$"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équation différentielle, "équation y' = ay", vérifier une solution, croissance de population]
  noeuds: [ed-cauchy-lipschitz, cx-exponentielle]
  notions: [equation-differentielle, exponentielle]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **1.** Une fonction $f$ est solution de $y'=ay$ et vérifie $f(0)=2$ et $f(1)=2\mathrm{e}^{3}$. Déterminer $a$, puis l'expression de $f$.

    **2.** Une fonction $g$ est solution de $y'=ay$ et vérifie $g(0)=1$ et $g(2)=\mathrm{e}^{-6}$. Déterminer $a$.

    **3.** Une population évolue selon l'équation $y'=ay$ et double tous les $10$ ans. Déterminer la valeur exacte de $a$, puis une valeur approchée à $10^{-4}$ près.
  corrige: |
    **1.** $f$ est de la forme $x\mapsto C\mathrm{e}^{ax}$. La condition $f(0)=2$ donne $C=2$, puis : 
    $$f(1)=2\mathrm{e}^{a}=2\mathrm{e}^{3} \iff \mathrm{e}^{a}=\mathrm{e}^{3} \iff \boxed{a=3}$$

    $$\boxed{f(x)=2\mathrm{e}^{3x}}$$

    **2.** De même $g(0)=1$ donne $C=1$, puis : 
    $$g(2)=\mathrm{e}^{2a}=\mathrm{e}^{-6} \iff 2a=-6 \iff \boxed{a=-3}$$

    **3.** En notant $N(t)=C\mathrm{e}^{at}$ la population, l'hypothèse de doublement s'écrit $N(t+10)=2N(t)$ pour tout $t$, soit : 
    $$C\mathrm{e}^{a(t+10)}=2\,C\mathrm{e}^{at} \iff \mathrm{e}^{at}\times\mathrm{e}^{10a}=2\,\mathrm{e}^{at} \iff \mathrm{e}^{10a}=2$$
     En appliquant le logarithme népérien : 
    $$10a=\ln 2 \qquad \text{d'où} \qquad \boxed{a=\frac{\ln 2}{10}\approx 0{,}0693}$$
- id: "t-08-09"
  feuille: "f-t-08"
  numero: 9
  partie: "L'équation $y'=ay$"
  etoiles: 2
  types: [Lecture graphique, Démonstration, Calcul]
  mots_cles: [équation différentielle, "équation y' = ay", "valeur d'équilibre", courbes intégrales, lecture graphique]
  noeuds: [ed-cauchy-lipschitz, cx-exponentielle]
  notions: [equation-differentielle, exponentielle]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Le graphique ci-dessous représente quatre courbes intégrales de l'équation différentielle $y'=0{,}5\,y$.

    ![Figure](documents/figures/c2869365967db470.svg)

    **1.** Donner la forme générale des solutions de cette équation différentielle.

    **2.** Déterminer, par lecture graphique de l'ordonnée en $x=0$, la valeur de la constante $C$ associée à chacune des quatre courbes.

    **3.** Une cinquième courbe intégrale passe par le point de coordonnées $(0\,;4)$. Déterminer l'expression de la solution correspondante.

    **4.** Deux courbes intégrales distinctes peuvent-elles se couper ? Justifier à l'aide du théorème 2 du cours.

    **5.** L'équation admet-elle une solution constante ? Si oui, laquelle, et pourquoi ne figure-t-elle pas parmi les quatre courbes tracées ?
  corrige: |
    **1.** Ici $a=0{,}5$, donc d'après le théorème 1 : 
    $$\boxed{\text{Les solutions sont les fonctions } x\mapsto C\mathrm{e}^{0,5x}, \text{ avec } C\in\mathbb{R}}$$

    **2.** Comme $f(0)=C\mathrm{e}^{0}=C$, la constante $C$ se lit directement comme l'ordonnée du point d'abscisse $0$. 
    $$\boxed{\mathcal{C}_{1} : C=2 \quad ; \quad \mathcal{C}_{2} : C=1 \quad ; \quad \mathcal{C}_{3} : C=-1 \quad ; \quad \mathcal{C}_{4} : C=-3}$$

    **3.** La condition $f(0)=4$ donne $C=4$ : $\boxed{f(x)=4\mathrm{e}^{0,5x}}$

    **4.** Non. D'après le théorème 2, par tout point $(x_{0}\,;y_{0})$ du plan passe une *unique* solution. Si deux courbes intégrales se coupaient en un point, il y aurait deux solutions distinctes vérifiant la même condition initiale, ce qui contredirait ce théorème. 
    $$\boxed{\text{Deux courbes intégrales distinctes ne se coupent jamais}}$$

    **5.** Oui : la valeur $C=0$ donne la fonction nulle, dont la dérivée est nulle et qui vérifie bien $y'=0{,}5\times 0$. 
    $$\boxed{\text{La fonction nulle est l'unique solution constante}}$$
     Sa courbe est l'axe des abscisses lui-même : elle n'a pas été tracée en couleur puisqu'elle se confond avec cet axe.
- id: "t-08-10"
  feuille: "f-t-08"
  numero: 10
  partie: "L'équation $y'=ay$"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équation différentielle, "équation y' = ay", limite, tableau de variations]
  noeuds: [ed-cauchy-lipschitz, cx-exponentielle]
  notions: [equation-differentielle, exponentielle]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Soit $f$ la solution de l'équation $y'=-4y$ vérifiant $f(0)=5$.

    **1.** Déterminer l'expression de $f(x)$.

    **2.** Calculer $f'(x)$ et en déduire le sens de variation de $f$ sur $\mathbb{R}$.

    **3.** Déterminer $\displaystyle\lim_{x\to+\infty}f(x)$ et $\displaystyle\lim_{x\to-\infty}f(x)$.

    **4.** La fonction $f$ s'annule-t-elle ? Justifier.

    **5.** Résoudre l'équation $f(x)=1$. On donnera la valeur exacte puis une valeur approchée au millième.

    **6.** Reprendre les questions 2 et 3 pour la solution de $y'=3y$ vérifiant $g(0)=-2$. Quel rôle joue le signe de $a$ ?
  corrige: |
    **1.** Les solutions de $y'=-4y$ sont $x\mapsto C\mathrm{e}^{-4x}$, et $f(0)=C=5$ : 
    $$\boxed{f(x)=5\mathrm{e}^{-4x}}$$

    **2.** 
    $$f'(x)=5\times(-4)\mathrm{e}^{-4x}=-20\mathrm{e}^{-4x}$$
     Comme l'exponentielle est strictement positive, $f'(x)<0$ pour tout $x$ : 
    $$\boxed{f \text{ est strictement décroissante sur } \mathbb{R}}$$

    **3.** Comme $-4<0$, on a $\displaystyle\lim_{x\to+\infty}\mathrm{e}^{-4x}=0$ et $\displaystyle\lim_{x\to-\infty}\mathrm{e}^{-4x}=+\infty$ : 
    $$\boxed{\lim_{x\to+\infty}f(x)=0 \qquad ; \qquad \lim_{x\to-\infty}f(x)=+\infty}$$

    **4.** Non : $f(x)=5\mathrm{e}^{-4x}$ est un produit d'un réel non nul par une exponentielle, qui ne s'annule jamais. 
    $$\boxed{f \text{ ne s'annule pas sur } \mathbb{R}}$$
     C'est un phénomène général : une solution non nulle de $y'=ay$ garde un signe constant.

    **5.** 
    $$5\mathrm{e}^{-4x}=1 \iff \mathrm{e}^{-4x}=\frac{1}{5} \iff -4x=\ln\left(\frac{1}{5}\right)=-\ln 5$$

    $$\boxed{x=\frac{\ln 5}{4}\approx 0{,}402}$$

    **6.** Les solutions de $y'=3y$ sont $x\mapsto C\mathrm{e}^{3x}$, et $g(0)=-2$ donne $g(x)=-2\mathrm{e}^{3x}$. Alors $g'(x)=-6\mathrm{e}^{3x}<0$ : $\boxed{g \text{ est strictement décroissante}}$ 
    $$\boxed{\lim_{x\to+\infty}g(x)=-\infty \qquad ; \qquad \lim_{x\to-\infty}g(x)=0}$$

    $$\boxed{\text{Le signe de } a \text{ décide du côté où la solution tend vers } 0 : \text{ en } +\infty \text{ si } a<0, \text{ en } -\infty \text{ si } a>0}$$
     Le signe de $C$, lui, ne fait que décider si la courbe est au-dessus ou en dessous de l'axe.
- id: "t-08-11"
  feuille: "f-t-08"
  numero: 11
  partie: "L'équation $y'=ay+b$"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équation différentielle, "équation y' = ay + b", "valeur d'équilibre"]
  noeuds: [ed-cauchy-lipschitz]
  notions: [equation-differentielle]
  page_enonce: 4
  page_corrige: 6
  enonce: |
    Résoudre sur $\mathbb{R}$ les équations différentielles suivantes. On identifiera $a$ et $b$, puis on calculera la valeur d'équilibre $-\dfrac{b}{a}$.

    **a)** $y'=2y+6$

    **b)** $y'=-y+4$

    **c)** $y'=3y-12$

    **d)** $y'=-0{,}5\,y+2$

    **e)** $y'=5y+1$

    **f)** $y'=-2y-6$
  corrige: |
    D'après le théorème 3, les solutions de $y'=ay+b$ sont les fonctions $x\mapsto C\mathrm{e}^{ax}-\dfrac{b}{a}$.

    $$\begin{array}{|c||c|c|c|c|} \hline  & \text{Équation} & a & -\dfrac{b}{a} & \text{Solutions} \\ \hline \text{a)} & y'=2y+6 & 2 & -3 & x\mapsto C\mathrm{e}^{2x}-3 \\ \hline \text{b)} & y'=-y+4 & -1 & 4 & x\mapsto C\mathrm{e}^{-x}+4 \\ \hline \text{c)} & y'=3y-12 & 3 & 4 & x\mapsto C\mathrm{e}^{3x}+4 \\ \hline \text{d)} & y'=-0{,}5\,y+2 & -0{,}5 & 4 & x\mapsto C\mathrm{e}^{-0,5x}+4 \\ \hline \text{e)} & y'=5y+1 & 5 & -\dfrac{1}{5} & x\mapsto C\mathrm{e}^{5x}-\dfrac{1}{5} \\ \hline \text{f)} & y'=-2y-6 & -2 & -3 & x\mapsto C\mathrm{e}^{-2x}-3 \\ \hline \end{array}$$

    On prendra garde aux signes : en a), $b=6$ et $a=2$, donc $-\dfrac{b}{a}=-\dfrac{6}{2}=-3$, et la constante s'*ajoute* sous la forme $-3$.
- id: "t-08-12"
  feuille: "f-t-08"
  numero: 12
  partie: "L'équation $y'=ay+b$"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équation différentielle, "équation y' = ay + b", condition initiale]
  noeuds: [ed-cauchy-lipschitz]
  notions: [equation-differentielle]
  page_enonce: 4
  page_corrige: 6
  enonce: |
    Déterminer dans chaque cas l'unique solution vérifiant la condition initiale donnée.

    **a)** $y'=3y-6$ et $y(0)=4$

    **b)** $y'=-y+2$ et $y(0)=5$

    **c)** $y'=-0{,}2\,y+1$ et $y(0)=10$

    **d)** $y'=4y+8$ et $y(1)=0$
  corrige: |
    **a)** Ici $a=3$ et $b=-6$, donc $-\dfrac{b}{a}=2$ et les solutions sont $x\mapsto C\mathrm{e}^{3x}+2$. La condition $y(0)=4$ donne : 
    $$C+2=4 \iff C=2 \qquad \text{d'où} \qquad \boxed{f(x)=2\mathrm{e}^{3x}+2}$$

    **b)** $a=-1$, $b=2$, donc $-\dfrac{b}{a}=2$ et les solutions sont $x\mapsto C\mathrm{e}^{-x}+2$. La condition donne $C+2=5$, soit $C=3$ : 
    $$\boxed{f(x)=3\mathrm{e}^{-x}+2}$$

    **c)** $a=-0{,}2$, $b=1$, donc $-\dfrac{b}{a}=5$. La condition donne $C+5=10$, soit $C=5$ : 
    $$\boxed{f(x)=5\mathrm{e}^{-0,2x}+5}$$

    **d)** $a=4$, $b=8$, donc $-\dfrac{b}{a}=-2$ et les solutions sont $x\mapsto C\mathrm{e}^{4x}-2$. La condition $y(1)=0$ donne : 
    $$C\mathrm{e}^{4}-2=0 \iff C=\frac{2}{\mathrm{e}^{4}}=2\mathrm{e}^{-4}$$

    $$f(x)=2\mathrm{e}^{-4}\times\mathrm{e}^{4x}-2 \qquad \text{d'où} \qquad \boxed{f(x)=2\mathrm{e}^{4x-4}-2}$$
- id: "t-08-13"
  feuille: "f-t-08"
  numero: 13
  partie: "L'équation $y'=ay+b$"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équation différentielle, "équation y' = ay", "équation y' = ay + b", condition initiale]
  noeuds: [ed-cauchy-lipschitz, cx-exponentielle]
  notions: [equation-differentielle, exponentielle]
  page_enonce: 4
  page_corrige: 6
  enonce: |
    Ramener chacune des équations suivantes à la forme $y'=ay+b$, puis la résoudre.

    **a)** $3y'=6y+9$

    **b)** $y'+2y-8=0$

    **c)** $5y'-y=10$

    **d)** $2y'=3-y$

    **e)** $y'=4(y-2)$

    **f)** $2y'+y=6$ avec $y(0)=1$
  corrige: |
    **a)** $3y'=6y+9 \iff y'=2y+3$, d'où $-\dfrac{b}{a}=-\dfrac{3}{2}$ : 
    $$\boxed{x\mapsto C\mathrm{e}^{2x}-\frac{3}{2}}$$

    **b)** $y'+2y-8=0 \iff y'=-2y+8$, d'où $-\dfrac{b}{a}=4$ : $\boxed{x\mapsto C\mathrm{e}^{-2x}+4}$

    **c)** $5y'-y=10 \iff y'=0{,}2\,y+2$, d'où $-\dfrac{b}{a}=-\dfrac{2}{0{,}2}=-10$ : 
    $$\boxed{x\mapsto C\mathrm{e}^{0,2x}-10}$$

    **d)** $2y'=3-y \iff y'=-0{,}5\,y+1{,}5$, d'où $-\dfrac{b}{a}=3$ : $\boxed{x\mapsto C\mathrm{e}^{-0,5x}+3}$

    **e)** $y'=4(y-2)=4y-8$, d'où $-\dfrac{b}{a}=2$ : $\boxed{x\mapsto C\mathrm{e}^{4x}+2}$

    **f)** $2y'+y=6 \iff y'=-0{,}5\,y+3$, d'où $-\dfrac{b}{a}=6$ et les solutions sont $x\mapsto C\mathrm{e}^{-0,5x}+6$. La condition $y(0)=1$ donne $C+6=1$, soit $C=-5$ : 
    $$\boxed{f(x)=-5\mathrm{e}^{-0,5x}+6}$$
- id: "t-08-14"
  feuille: "f-t-08"
  numero: 14
  partie: "L'équation $y'=ay+b$"
  etoiles: 2
  types: [Lecture graphique, Calcul]
  mots_cles: [équation différentielle, "équation y' = ay + b", "valeur d'équilibre", limite, tableau de variations, lecture graphique]
  noeuds: [ed-cauchy-lipschitz]
  notions: [equation-differentielle]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Soit $f$ la solution de l'équation différentielle $y'=-0{,}4\,y+6$ vérifiant $f(0)=2$.

    **1.** Déterminer la valeur d'équilibre de cette équation.

    **2.** Donner la forme générale des solutions, puis déterminer $f$.

    **3.** Déterminer $\displaystyle\lim_{x\to+\infty}f(x)$ et interpréter graphiquement.

    **4.** Calculer $f'(x)$ et en déduire le sens de variation de $f$.

    **5.** La fonction $f$ atteint-elle la valeur d'équilibre ? Justifier.

    **6.** Résoudre l'équation $f(x)=10$. On donnera la valeur exacte puis une valeur approchée au millième.
  corrige: |
    **1.** Ici $a=-0{,}4$ et $b=6$ : 
    $$-\frac{b}{a}=-\frac{6}{-0{,}4}=\boxed{15}$$

    **2.** Les solutions sont les fonctions $x\mapsto C\mathrm{e}^{-0,4x}+15$. La condition $f(0)=2$ donne $C+15=2$, soit $C=-13$ : 
    $$\boxed{f(x)=-13\mathrm{e}^{-0,4x}+15}$$

    **3.** Comme $-0{,}4<0$, on a $\displaystyle\lim_{x\to+\infty}\mathrm{e}^{-0,4x}=0$, donc : 
    $$\boxed{\lim_{x\to+\infty}f(x)=15}$$

    $$\boxed{\text{La droite d'équation } y=15 \text{ est asymptote horizontale à la courbe de } f \text{ en } +\infty}$$

    **4.** 
    $$f'(x)=-13\times(-0{,}4)\mathrm{e}^{-0,4x}=5{,}2\,\mathrm{e}^{-0,4x}$$
     L'exponentielle étant strictement positive, $f'(x)>0$ pour tout $x$ : 
    $$\boxed{f \text{ est strictement croissante sur } \mathbb{R}}$$

    **5.** Non. Il faudrait $-13\mathrm{e}^{-0,4x}+15=15$, c'est-à-dire $\mathrm{e}^{-0,4x}=0$, ce qui est impossible. 
    $$\boxed{f \text{ n'atteint jamais la valeur d'équilibre : elle s'en approche seulement}}$$

    **6.** 
    $$-13\mathrm{e}^{-0,4x}+15=10 \iff -13\mathrm{e}^{-0,4x}=-5 \iff \mathrm{e}^{-0,4x}=\frac{5}{13}$$
     En appliquant le logarithme népérien : 
    $$-0{,}4\,x=\ln\left(\frac{5}{13}\right)=-\ln\left(\frac{13}{5}\right)$$

    $$\boxed{x=\frac{\ln\left(\frac{13}{5}\right)}{0{,}4}\approx 2{,}389}$$
- id: "t-08-15"
  feuille: "f-t-08"
  numero: 15
  partie: "L'équation $y'=ay+b$"
  etoiles: 2
  types: [Lecture graphique, Démonstration, Calcul]
  mots_cles: [équation différentielle, "équation y' = ay", "équation y' = ay + b", "valeur d'équilibre", courbes intégrales, lecture graphique]
  noeuds: [ed-cauchy-lipschitz, cx-exponentielle]
  notions: [equation-differentielle, exponentielle]
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Le graphique ci-dessous représente trois courbes intégrales d'une équation différentielle de la forme $y'=ay+b$, ainsi que la droite d'équation $y=4$ tracée en pointillés.

    ![Figure](documents/figures/81c020278ef315fc.svg)

    **1.** Que représente la droite d'équation $y=4$ pour cette équation différentielle ? Quelle relation lie alors $a$ et $b$ ?

    **2.** Le signe de $a$ est-il positif ou négatif ? Justifier à partir de l'allure des courbes.

    **3.** On admet que $a=-0{,}5$. En déduire la valeur de $b$, puis la forme générale des solutions.

    **4.** Déterminer la constante $C$ associée à chacune des trois courbes, par lecture de l'ordonnée en $x=0$.

    **5.** L'équation admet-elle une solution constante ? Laquelle ?

    **6.** Une courbe intégrale peut-elle traverser la droite d'équation $y=4$ ? Justifier.
  corrige: |
    **1.** Les trois courbes se rapprochent toutes de la droite $y=4$ sans jamais la traverser : c'est la **valeur d'équilibre** de l'équation, c'est-à-dire $-\dfrac{b}{a}$. 
    $$\boxed{-\frac{b}{a}=4, \text{ c'est-à-dire } b=-4a}$$
     La droite est asymptote horizontale à toutes les courbes intégrales.

    **2.** Les courbes convergent vers l'équilibre lorsque $x$ augmente, c'est-à-dire que le terme $C\mathrm{e}^{ax}$ tend vers $0$ en $+\infty$. Cela n'est possible que si $a<0$. 
    $$\boxed{a \text{ est strictement négatif}}$$

    **3.** Avec $a=-0{,}5$, la relation $b=-4a$ donne $b=2$ : 
    $$\boxed{b=2, \text{ l'équation est } y'=-0{,}5\,y+2}$$

    $$\boxed{\text{Les solutions sont les fonctions } x\mapsto C\mathrm{e}^{-0,5x}+4}$$

    **4.** Comme $f(0)=C+4$, la constante se lit en retranchant $4$ à l'ordonnée en $x=0$ : 
    $$\boxed{\mathcal{C}_{1} : C=8-4=4 \quad ; \quad \mathcal{C}_{2} : C=5-4=1 \quad ; \quad \mathcal{C}_{3} : C=1-4=-3}$$

    **5.** Oui : pour $C=0$, on obtient la fonction constante égale à $4$. 
    $$\boxed{\text{La fonction constante } x\mapsto 4 \text{ est solution}}$$
     On le vérifie : sa dérivée est nulle, et $-0{,}5\times 4+2=0$.

    **6.** Non. Traverser la droite signifierait couper la courbe intégrale correspondant à $C=0$, ce qui est interdit par le théorème d'unicité. 
    $$\boxed{\text{Une courbe intégrale reste toujours du même côté de la droite } y=4}$$
     On le voit aussi sur l'expression : le signe de $f(x)-4=C\mathrm{e}^{-0,5x}$ est celui de $C$, donc constant.
- id: "t-08-16"
  feuille: "f-t-08"
  numero: 16
  partie: "L'équation $y'=ay+b$"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équation différentielle, "équation y' = ay", "équation y' = ay + b", vérifier une solution, "valeur d'équilibre"]
  noeuds: [ed-cauchy-lipschitz, cx-exponentielle]
  notions: [equation-differentielle, exponentielle]
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Une fonction $f$ est solution d'une équation différentielle de la forme $y'=ay+b$. On sait que $f(0)=1$, que la valeur d'équilibre vaut $5$, et que $f'(0)=4$.

    **1.** Justifier que $f$ s'écrit sous la forme $f(x)=C\mathrm{e}^{ax}+5$, puis déterminer $C$.

    **2.** En calculant $f'(0)$, déterminer la valeur de $a$.

    **3.** En déduire la valeur de $b$, puis l'équation différentielle vérifiée par $f$.

    **4.** Donner l'expression de $f(x)$ et vérifier les trois conditions de l'énoncé.
  corrige: |
    **1.** D'après le théorème 3, les solutions s'écrivent $C\mathrm{e}^{ax}-\dfrac{b}{a}$. La valeur d'équilibre valant $5$ : 
    $$\boxed{f(x)=C\mathrm{e}^{ax}+5}$$
     La condition $f(0)=1$ donne $C+5=1$ : $\boxed{C=-4}$

    **2.** On dérive : $f'(x)=aC\mathrm{e}^{ax}=-4a\,\mathrm{e}^{ax}$, donc $f'(0)=-4a$. La condition $f'(0)=4$ donne : 
    $$-4a=4 \iff \boxed{a=-1}$$

    **3.** De $-\dfrac{b}{a}=5$ avec $a=-1$, on tire $b=-5a=5$ : 
    $$\boxed{b=5, \text{ l'équation est } y'=-y+5}$$

    **4.** 
    $$\boxed{f(x)=-4\mathrm{e}^{-x}+5}$$
     Vérifications : $f(0)=-4+5=1$ ; la valeur d'équilibre vaut $-\dfrac{5}{-1}=5$ ; enfin $f'(x)=4\mathrm{e}^{-x}$ donc $f'(0)=4$. Les trois conditions sont bien satisfaites.
- id: "t-08-17"
  feuille: "f-t-08"
  numero: 17
  partie: "Modélisation"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [équation différentielle, vérifier une solution, radioactivité]
  noeuds: [ed-cauchy-lipschitz]
  notions: [equation-differentielle]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Un échantillon radioactif contient initialement $N_{0}=10^{12}$ atomes. Sa constante radioactive vaut $\lambda=0{,}02$ an$^{-1}$. On note $N(t)$ le nombre d'atomes restants au bout de $t$ années.

    **1.** Justifier que $N$ est solution de l'équation différentielle $N'=-0{,}02\,N$.

    **2.** En déduire l'expression de $N(t)$.

    **3.** Calculer $N(50)$ et en donner une valeur approchée. Quelle proportion de l'échantillon subsiste alors ?

    **4.** Déterminer la demi-vie $T$ de cet isotope. On donnera la valeur exacte puis une valeur approchée au centième.

    **5.** Au bout de combien d'années ne reste-t-il plus que $10\ \%$ des atomes initiaux ?

    **6.** Démontrer que pour tout $t\geqslant 0$, $N(t+T)=\dfrac{N(t)}{2}$. Interpréter.
  corrige: |
    **1.** La vitesse de désintégration est proportionnelle au nombre d'atomes présents, avec un coefficient de proportionnalité négatif puisque leur nombre diminue : 
    $$\boxed{N'(t)=-\lambda\,N(t)=-0{,}02\,N(t)}$$

    **2.** C'est l'équation $y'=ay$ avec $a=-0{,}02$, donc $N(t)=C\mathrm{e}^{-0,02t}$. La condition $N(0)=10^{12}$ donne $C=10^{12}$ : 
    $$\boxed{N(t)=10^{12}\,\mathrm{e}^{-0,02\,t}}$$

    **3.** 
    $$N(50)=10^{12}\,\mathrm{e}^{-1}\approx\boxed{3{,}68\times 10^{11} \text{ atomes}}$$

    $$\boxed{\text{Il subsiste environ } 36{,}8\ \% \text{ de l'échantillon}}$$

    **4.** La demi-vie vérifie $N(T)=\dfrac{N_{0}}{2}$ : 
    $$10^{12}\mathrm{e}^{-0,02T}=\frac{10^{12}}{2} \iff \mathrm{e}^{-0,02T}=\frac{1}{2} \iff -0{,}02\,T=-\ln 2$$

    $$\boxed{T=\frac{\ln 2}{0{,}02}\approx 34{,}66 \text{ ans}}$$

    **5.** On résout $N(t)=0{,}1\times 10^{12}$ : 
    $$\mathrm{e}^{-0,02t}=0{,}1 \iff -0{,}02\,t=-\ln 10 \qquad \text{d'où} \qquad \boxed{t=\frac{\ln 10}{0{,}02}\approx 115{,}1 \text{ ans}}$$

    **6.** Pour tout $t\geqslant 0$ : 
    $$\begin{aligned} N(t+T) &= 10^{12}\,\mathrm{e}^{-0,02(t+T)}=10^{12}\,\mathrm{e}^{-0,02t}\times\mathrm{e}^{-0,02T} \\ &= N(t)\times\mathrm{e}^{-\ln 2}=N(t)\times\frac{1}{2} \end{aligned}$$

    $$\boxed{N(t+T)=\frac{N(t)}{2}}$$

    $$\boxed{\text{La moitié des atomes disparaît sur toute période de durée } T, \text{ quel que soit l'instant de départ}}$$
- id: "t-08-18"
  feuille: "f-t-08"
  numero: 18
  partie: "Modélisation"
  etoiles: 2
  types: [Calcul]
  mots_cles: [radioactivité]
  noeuds: [ed-cauchy-lipschitz]
  notions: [equation-differentielle]
  page_enonce: 6
  page_corrige: 9
  enonce: |
    La datation au carbone $14$ repose sur la désintégration de cet isotope, dont la demi-vie vaut $T=5730$ ans. On note $N(t)=N_{0}\mathrm{e}^{-\lambda t}$ le nombre d'atomes restants après $t$ années.

    **1.** Déterminer la valeur exacte de $\lambda$, puis une valeur approchée à $10^{-6}$ près.

    **2.** Un fragment d'os prélevé sur un site archéologique contient $30\ \%$ du carbone $14$ qu'il possédait de son vivant. Déterminer son âge, arrondi à l'année.

    **3.** Quelle proportion de carbone $14$ subsiste au bout de $10\,000$ ans ? On donnera le résultat en pourcentage, arrondi au dixième.

    **4.** Au bout de combien d'années ne reste-t-il plus que $1\ \%$ du carbone $14$ initial ?

    **5.** Les appareils de mesure ne détectent pas de façon fiable une proportion inférieure à $1\ \%$. En déduire une limite d'utilisation de cette méthode de datation, et commenter.
  corrige: |
    **1.** La proposition 1 du cours donne $T=\dfrac{\ln 2}{\lambda}$, donc : 
    $$\boxed{\lambda=\frac{\ln 2}{5730}\approx 1{,}21\times 10^{-4} \text{ an}^{-1}}$$

    **2.** On résout $\mathrm{e}^{-\lambda t}=0{,}3$ : 
    $$-\lambda t=\ln(0{,}3) \iff t=\frac{\ln\left(\frac{10}{3}\right)}{\lambda}$$

    $$\boxed{t\approx 9\,953 \text{ ans}}$$

    **3.** 
    $$\frac{N(10\,000)}{N_{0}}=\mathrm{e}^{-1,21\times 10^{-4}\times 10\,000} =\mathrm{e}^{-1,2097}\approx 0{,}298$$

    $$\boxed{\text{Il subsiste environ } 29{,}8\ \% \text{ du carbone } 14}$$

    **4.** 
    $$\mathrm{e}^{-\lambda t}=0{,}01 \iff t=\frac{\ln 100}{\lambda}\approx \boxed{38\,069 \text{ ans}}$$

    **5.** D'après la question précédente, la proportion tombe sous le seuil de détection au bout d'environ $38\,000$ ans. 
    $$\boxed{\text{La datation au carbone } 14 \text{ n'est pas fiable au-delà de } 40\,000 \text{ à } 50\,000 \text{ ans}}$$
     Pour dater des échantillons plus anciens, on utilise d'autres couples d'isotopes, de demi-vie bien plus longue — par exemple le potassium-argon, dont la demi-vie dépasse le milliard d'années.
- id: "t-08-19"
  feuille: "f-t-08"
  numero: 19
  partie: "Modélisation"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équation différentielle, vérifier une solution, condition initiale, "valeur d'équilibre", loi de refroidissement, limite]
  noeuds: [ed-cauchy-lipschitz]
  notions: [equation-differentielle]
  page_enonce: 6
  page_corrige: 10
  enonce: |
    Un objet métallique porté à $100$ °C est placé dans une pièce maintenue à $22$ °C. On note $\theta(t)$ sa température, en degrés Celsius, au bout de $t$ minutes. La loi de Newton donne $\theta'=-k\left(\theta-\theta_{\text{ext}}\right)$ avec $k=0{,}04$ min$^{-1}$.

    **1.** Montrer que $\theta$ est solution de l'équation différentielle $\theta'=-0{,}04\,\theta+0{,}88$.

    **2.** Déterminer la valeur d'équilibre de cette équation. Interpréter physiquement.

    **3.** Résoudre l'équation avec la condition initiale $\theta(0)=100$.

    **4.** Calculer $\theta(15)$ et en donner une valeur approchée au dixième.

    **5.** Au bout de combien de temps la température atteint-elle $50$ °C ? On donnera une valeur approchée au dixième de minute.

    **6.** Déterminer $\displaystyle\lim_{t\to+\infty}\theta(t)$. L'objet atteint-il un jour exactement la température de la pièce ?
  corrige: |
    **1.** En développant la loi de Newton avec $\theta_{\text{ext}}=22$ et $k=0{,}04$ : 
    $$\theta'=-0{,}04\left(\theta-22\right)=-0{,}04\,\theta+0{,}04\times 22$$

    $$\boxed{\theta'=-0{,}04\,\theta+0{,}88}$$

    **2.** Ici $a=-0{,}04$ et $b=0{,}88$ : 
    $$-\frac{b}{a}=-\frac{0{,}88}{-0{,}04}=\boxed{22}$$

    $$\boxed{\text{C'est la température de la pièce : c'est vers elle que l'objet évolue}}$$

    **3.** Les solutions sont $t\mapsto C\mathrm{e}^{-0,04t}+22$. La condition $\theta(0)=100$ donne $C+22=100$, soit $C=78$ : 
    $$\boxed{\theta(t)=78\,\mathrm{e}^{-0,04\,t}+22}$$

    **4.** 
    $$\theta(15)=78\,\mathrm{e}^{-0,6}+22\approx\boxed{64{,}8 \text{ °C}}$$

    **5.** On résout $\theta(t)=50$ : 
    $$78\,\mathrm{e}^{-0,04t}=28 \iff \mathrm{e}^{-0,04t}=\frac{28}{78}=\frac{14}{39} \iff -0{,}04\,t=-\ln\left(\frac{39}{14}\right)$$

    $$\boxed{t=\frac{\ln\left(\frac{39}{14}\right)}{0{,}04}\approx 25{,}6 \text{ minutes}}$$

    **6.** Comme $-0{,}04<0$, le terme $78\mathrm{e}^{-0,04t}$ tend vers $0$ : 
    $$\boxed{\lim_{t\to+\infty}\theta(t)=22}$$
     Cette limite n'est jamais atteinte, puisque $78\mathrm{e}^{-0,04t}>0$ pour tout $t$ : 
    $$\boxed{\text{L'objet ne descend jamais exactement à } 22 \text{ °C}}$$
     En pratique, l'écart devient indétectable au bout de quelques heures.
