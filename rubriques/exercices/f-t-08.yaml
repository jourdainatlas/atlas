  enonce: |
    On se propose de déterminer les fonctions $f$ deux fois dérivables sur $\mathbb{R}$ et telles que : 
    $$\text{pour tous réels } x \text{ et } y, \qquad f(x+y)+f(x-y)=2\left(f(x)+f(y)\right)$$
     Dans les questions 1 et 2, $f$ est une fonction solution.

    **1.** Calculer $f(0)$. Montrer que $f$ est paire.

    **2.** Montrer que $f''$ est constante.

    **3.** Conclure.
  corrige: |
    **1.** Avec $x=y=0$, on obtient $2f(0)=4f(0)$, donc $\boxed{f(0)=0}$. Avec $x=0$ et $y$ quelconque, on obtient $f(y)+f(-y)=2f(0)+2f(y)=2f(y)$, donc $f(-y)=f(y)$ : 
    $$\boxed{f \text{ est paire.}}$$

    **2.** Fixons $y$ et dérivons deux fois par rapport à $x$ les deux membres de l'égalité ; la dérivée seconde de $x\mapsto f(x+y)$ est $x\mapsto f''(x+y)$, celle de $x\mapsto f(x-y)$ est $x\mapsto f''(x-y)$, et $2f(y)$ ne dépend pas de $x$ : 
    $$f''(x+y)+f''(x-y)=2f''(x)$$
     Fixons maintenant $x$ et dérivons deux fois par rapport à $y$ ; la dérivée de $y\mapsto x-y$ vaut $-1$, et deux dérivations font apparaître $(-1)^{2}=1$ : 
    $$f''(x+y)+f''(x-y)=2f''(y)$$
     En comparant, $f''(x)=f''(y)$ pour tous réels $x$ et $y$ : 
    $$\boxed{f'' \text{ est constante.}}$$

    **3.** Notons $2a$ cette constante. La fonction $x\mapsto f'(x)-2ax$ a une dérivée nulle sur $\mathbb{R}$, donc est constante : $f'(x)=2ax+b$. De même, $f(x)=ax^{2}+bx+c$. Comme $f(0)=0$, $c=0$, et comme $f$ est paire, $f(-x)-f(x)=-2bx=0$ pour tout $x$, donc $b=0$. Réciproquement, si $f(x)=ax^{2}$ : 
    $$a(x+y)^{2}+a(x-y)^{2}=2ax^{2}+2ay^{2}=2\left(f(x)+f(y)\right)$$

    $$\boxed{\text{Les solutions sont les fonctions } x\mapsto ax^{2},\ a\in\mathbb{R}.}$$

    *Remarque.* L'équation fonctionnelle a été transformée en l'équation différentielle la plus simple qui soit, $y''=\text{constante}$. C'est une méthode générale : dériver une équation fonctionnelle fait apparaître une équation différentielle, que l'on sait résoudre. Avec $f(x)=x^{2}$, l'équation s'écrit $(x+y)^{2}+(x-y)^{2}=2x^{2}+2y^{2}$ : c'est l'identité du parallélogramme du chapitre 4, écrite pour des nombres au lieu de vecteurs.
- id: "t-08-34"
  feuille: "f-t-08"
  numero: 34
  partie: "Pour aller plus loin"
  etoiles: 3
  types: [Calcul]
  mots_cles: [équation différentielle, lecture graphique]
  noeuds: [ed-cauchy-lipschitz]
  notions: [equation-differentielle]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 192"
  page_enonce: 13
  page_corrige: 21
  enonce: |
    *Courbes de sous-tangente constante.* Déterminer les fonctions $f$ dérivables sur $\mathbb{R}$ vérifiant la condition suivante : pour tout réel $x$, la tangente à la courbe de $f$ au point d'abscisse $x$ n'est pas parallèle à l'axe des abscisses et, si $N(x)$ désigne le point d'intersection de cette tangente avec l'axe des abscisses, la distance de $N(x)$ au projeté orthogonal sur l'axe des abscisses du point de la courbe d'abscisse $x$ est constante.

    Il est recommandé de faire un dessin.
  corrige: |
    *Mise en équation.* Soit $f$ une solution et $x$ un réel. La tangente au point $M\left(x\,;f(x)\right)$ a pour équation $Y=f(x)+f'(x)(X-x)$, avec $f'(x)\neq 0$ puisqu'elle n'est pas parallèle à l'axe des abscisses. Elle coupe cet axe lorsque $Y=0$, c'est-à-dire au point $N(x)$ d'abscisse $x-\frac{f(x)}{f'(x)}$. Le projeté de $M$ sur l'axe est $P(x\,;0)$, et la condition s'écrit : 
    $$PN=\left|\frac{f(x)}{f'(x)}\right|=c\qquad\text{pour tout réel } x$$
     où $c\geqslant 0$ est une constante, appelée *sous-tangente*.

    *Analyse.* Si $c=0$, alors $f$ est la fonction nulle, et $f'=0$, ce qui est exclu. Donc $c>0$, et $f$ ne s'annule jamais ; étant continue, elle garde un signe constant d'après le théorème des valeurs intermédiaires. La dérivée $f'$ ne s'annule pas non plus, et l'on admet qu'elle garde, elle aussi, un signe constant. *(Admis : c'est vrai pour toute fonction dérivée qui ne s'annule pas sur un intervalle, d'après un théorème de Darboux démontré après le baccalauréat ; la difficulté est que $f'$ n'est pas supposée continue.)* Le quotient $\frac{f'}{f}$ a donc un signe constant, et sa valeur absolue vaut $\frac{1}{c}$ : il existe $\lambda\in\left\{\frac{1}{c}\,;-\frac{1}{c}\right\}$ tel que $f'=\lambda f$. D'après le théorème 1, $f(x)=C\mathrm{e}^{\lambda x}$, avec $C\neq 0$ puisque $f$ ne s'annule pas.

    *Synthèse.* Réciproquement, si $f(x)=C\mathrm{e}^{\lambda x}$ avec $C\neq 0$ et $\lambda\neq 0$, alors $f'(x)=\lambda f(x)\neq 0$ et $\left|\frac{f(x)}{f'(x)}\right|=\frac{1}{|\lambda|}$ est constant. 
    $$\boxed{\text{Les solutions sont les fonctions } x\mapsto C\mathrm{e}^{\lambda x},\ C\neq 0,\ \lambda\neq 0 \text{ ; la sous-tangente vaut } \frac{1}{|\lambda|}.}$$

    ![Figure](documents/figures/e86e97bbbe6e4ca1.svg)

    Sur cette figure, tracée pour $\lambda=\frac{1}{2}$, on lit qu'en deux points différents de la courbe, la tangente (en ocre) coupe l'axe des abscisses à la même distance $2=\frac{1}{\lambda}$ du pied de la verticale (segments violets).

    *Remarque.* Ce problème, posé par Florimond de Beaune à Descartes au XVIIᵉ siècle, est l'un des premiers « problèmes inverses des tangentes », où l'on cherche une courbe connaissant une propriété de ses tangentes. C'est l'une des origines historiques de l'exponentielle, avant même que celle-ci ait reçu son nom.
- id: "t-08-35"
  feuille: "f-t-08"
  numero: 35
  partie: "Pour aller plus loin"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [équation différentielle, "équation y' = ay", condition initiale, "méthode d'Euler"]
  noeuds: [ed-cauchy-lipschitz, cx-exponentielle]
  notions: [equation-differentielle, exponentielle]
  source: "d'après le poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), § 5.2, note 21 (méthode d'Euler)"
  page_enonce: 13
  page_corrige: 22
  enonce: |
    *La méthode d'Euler.* On considère l'équation $y'=y$ avec la condition $y(0)=1$, dont la solution est la fonction exponentielle. On cherche à en calculer une valeur approchée en un réel $x>0$ sans utiliser l'exponentielle. Pour cela, on fixe un entier $n\geqslant 1$, on pose $h=\dfrac{x}{n}$, et l'on construit les nombres $y_{0}$, $y_{1}$, …, $y_{n}$ par 
    $$y_{0}=1 \qquad\text{et}\qquad y_{k+1}=y_{k}+h\,y_{k} \quad\text{pour } 0\leqslant k\leqslant n-1$$

    **1.** Expliquer pourquoi $y_{k}$ est une valeur approchée de $\mathrm{e}^{kh}$. On pourra utiliser l'approximation d'une fonction par sa tangente, $f(t+h)\approx f(t)+h\,f'(t)$.

    **2.** Montrer que $y_{n}=\left(1+\dfrac{x}{n}\right)^{n}$.

    **3.** En déduire, à l'aide de l'exercice 32 du chapitre 5, que $y_{n}$ tend vers $\mathrm{e}^{x}$ quand $n$ tend vers $+\infty$.

    **4.** Pour $x=1$, calculer $y_{n}$ pour $n=10$ et $n=1\,000$, et comparer à $\mathrm{e}$. Que peut-on dire de l'erreur commise ?

    **5.** Reprendre la question 2 pour l'équation $y'=ay$, $y(0)=1$, où $a$ est un réel donné.
  corrige: |
    **1.** Pour $h$ petit, la courbe d'une fonction dérivable est proche de sa tangente : $f(t+h)\approx f(t)+h\,f'(t)$. Si $f$ est solution de $y'=y$, cela devient $f(t+h)\approx f(t)+h\,f(t)$. Partant de $f(0)=1=y_{0}$, la relation $y_{k+1}=y_{k}+hy_{k}$ reproduit cette approximation de proche en proche : $y_{1}\approx f(h)$, $y_{2}\approx f(2h)$, et ainsi de suite, $y_{k}$ étant une valeur approchée de $f(kh)=\mathrm{e}^{kh}$.

    **2.** La relation s'écrit $y_{k+1}=(1+h)\,y_{k}$ : la suite $(y_{k})$ est géométrique de raison $1+h$ et de premier terme $1$. Donc $y_{n}=(1+h)^{n}$, et comme $h=\frac{x}{n}$ : 
    $$\boxed{y_{n}=\left(1+\frac{x}{n}\right)^{n}}$$

    **3.** D'après l'exercice 32 du chapitre 5, $\left(1+\frac{x}{n}\right)^{n}$ tend vers $\mathrm{e}^{x}$. 
    $$\boxed{\lim_{n\to+\infty}y_{n}=\mathrm{e}^{x}}$$
     La méthode d'Euler converge donc vers la vraie solution lorsque le pas $h$ tend vers $0$.

    **4.** Pour $x=1$ :

    $$\begin{array}{|c|c|c|} \hline n & y_{n} & \text{erreur }\mathrm{e}-y_{n} \\ \hline 10 & 2{,}593\,74 & 0{,}124\,5 \\ \hline 1\,000 & 2{,}716\,92 & 0{,}001\,36 \\ \hline \end{array}$$

    L'approximation est toujours inférieure à $\mathrm{e}$ : la courbe de l'exponentielle, convexe, est au-dessus de ses tangentes (chapitre 3), si bien que chaque pas sous-estime la croissance. Quand $n$ est multiplié par $100$, l'erreur est divisée par environ $100$ : elle est à peu près proportionnelle au pas $h=\frac{1}{n}$, et vaut environ $\frac{\mathrm{e}}{2n}$. Pour gagner une décimale, il faut donc dix fois plus de calculs, ce qui rappelle la lenteur observée à l'exercice 32 du chapitre 5.

    **5.** Pour $y'=ay$, la relation devient $y_{k+1}=y_{k}+h\,a\,y_{k}=(1+ah)\,y_{k}$, d'où 
    $$\boxed{y_{n}=\left(1+\frac{ax}{n}\right)^{n}}$$
     qui tend vers $\mathrm{e}^{ax}$, toujours d'après l'exercice 32 du chapitre 5.

    *Remarque.* La méthode d'Euler s'applique à des équations que l'on ne sait pas résoudre explicitement, comme l'équation logistique de l'exercice 4 : c'est ainsi que travaillent les logiciels de simulation, avec des variantes plus précises.
