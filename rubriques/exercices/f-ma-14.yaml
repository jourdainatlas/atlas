    Soit $f \in \mathcal{L}(E)$.

    **1.** Montrer que $\operatorname{Im} f \cap \mathrm{Ker}\, f = \{0\}$ si et seulement si $\mathrm{Ker}\, f^{2} = \mathrm{Ker}\, f$.

    **2.** Montrer que $\operatorname{Im} f + \mathrm{Ker}\, f = E$ si et seulement si $\operatorname{Im} f^{2} = \operatorname{Im} f$.

    **3.** On suppose que $f^{7} = f$. Montrer que $E = \mathrm{Ker}\, f \oplus \operatorname{Im} f$.
  corrige: |
    **1.** On a toujours $\mathrm{Ker}\, f \subset \mathrm{Ker}\, f^{2}$. Si $\operatorname{Im} f \cap \mathrm{Ker}\, f = \{0\}$ et $f^{2}(x) = 0$, alors $f(x) \in \operatorname{Im} f \cap \mathrm{Ker}\, f$, donc $f(x) = 0$. Réciproquement, si $y = f(x) \in \mathrm{Ker}\, f$, alors $x \in \mathrm{Ker}\, f^{2} = \mathrm{Ker}\, f$ et $y = 0$.

    **2.** On a toujours $\operatorname{Im} f^{2} \subset \operatorname{Im} f$. Si $E = \operatorname{Im} f + \mathrm{Ker}\, f$, tout $x$ s'écrit $f(z) + k$, et $f(x) = f^{2}(z)$. Réciproquement, si $\operatorname{Im} f = \operatorname{Im} f^{2}$ et $x \in E$, il existe $z$ tel que $f(x) = f^{2}(z)$, et $x = f(z) + \big(x - f(z)\big)$ avec $x - f(z) \in \mathrm{Ker}\, f$.

    **3.** Si $f^{2}(x) = 0$, alors $f(x) = f^{7}(x) = f^{5}(f^{2}(x)) = 0$ ; et $f(x) = f^{2}(f^{5}(x)) \in \operatorname{Im} f^{2}$. Les questions 1 et 2 concluent. 
    $$\boxed{E = \mathrm{Ker}\, f \oplus \operatorname{Im} f}$$
- id: "ma-14-50"
