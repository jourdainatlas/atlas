  enonce: |
    *Pseudo-inverse.* Soit $f \in \mathcal{L}(E)$. On dit que $g \in \mathcal{L}(E)$ est un pseudo-inverse de $f$ si $f \circ g = g \circ f$, $f \circ g \circ f = f$ et $g \circ f \circ g = g$. Montrer que $f$ admet au plus un pseudo-inverse, et qu'il en admet un si et seulement si $E = \mathrm{Ker}\, f \oplus \operatorname{Im} f$, ou encore si et seulement si $\mathrm{Ker}\, f = \mathrm{Ker}\, f^{2}$ et $\operatorname{Im} f = \operatorname{Im} f^{2}$. Déterminer le pseudo-inverse d'un automorphisme, puis celui d'un projecteur.
  corrige: |
    *Idée.* Si $g$ est un pseudo-inverse, $e = f \circ g$ est un projecteur, d'image $\operatorname{Im} f$ et de noyau $\mathrm{Ker}\, f$ ; inversement, une décomposition $E = \mathrm{Ker}\, f \oplus \operatorname{Im} f$ permet d'inverser $f$ sur $\operatorname{Im} f$.

    $\triangleright$ *Unicité.* Soit $g$ et $g'$ deux pseudo-inverses, et $e = fg$, $e' = fg'$. En utilisant $fgf = f$ et les commutations, $e'e = (fg'f)g = fg = e$, et aussi $e'e = g'(fgf) = g'f = e'$. Donc $e = e'$, puis 
    $$g = gfg = ge = ge' = gfg' = eg' = e'g' = g'fg' = g'.$$

    $\triangleright$ *Cas d'un automorphisme et d'un projecteur.* Si $f \in \mathrm{GL}(E)$, $g = f^{-1}$ convient. Si $f$ est un projecteur, $g = f$ convient, puisque $f^{3} = f$.

    $\triangleright$ *Condition nécessaire.* Si $g$ est un pseudo-inverse, $e = fg = gf$ vérifie $e^{2} = (fgf)g = e$. On a $\operatorname{Im} e \subset \operatorname{Im} f$ et $f = fgf = ef$, donc $\operatorname{Im} f \subset \operatorname{Im} e$ ; de même $\mathrm{Ker}\, f \subset \mathrm{Ker}\,(gf) = \mathrm{Ker}\, e$ et, si $e(x) = 0$, $f(x) = fgf(x) = f(e(x)) = 0$. Ainsi $\operatorname{Im} e = \operatorname{Im} f$ et $\mathrm{Ker}\, e = \mathrm{Ker}\, f$, et le théorème 5 donne $E = \mathrm{Ker}\, f \oplus \operatorname{Im} f$.

    $\triangleright$ *Condition suffisante.* Supposons $E = K \oplus I$, avec $K = \mathrm{Ker}\, f$ et $I = \operatorname{Im} f$. L'image $f(I)$ est contenue dans $I$ ; la restriction $f_{I} : I \to I$ est injective, puisque $K \cap I = \{0\}$, et surjective, puisque $f(k + i) = f(i)$. Soit $g$ l'endomorphisme nul sur $K$ et égal à $f_{I}^{-1}$ sur $I$ (proposition 19). On vérifie les trois relations séparément sur $K$, où tout est nul, et sur $I$, où $fg = gf = \mathrm{id}_{I}$.

    $\triangleright$ *Seconde caractérisation.* Par l'exercice 49, $E = \mathrm{Ker}\, f \oplus \operatorname{Im} f$ équivaut à $\mathrm{Ker}\, f = \mathrm{Ker}\, f^{2}$ et $\operatorname{Im} f = \operatorname{Im} f^{2}$. 
    $$\boxed{f \text{ pseudo-inversible} \iff E = \mathrm{Ker}\, f \oplus \operatorname{Im} f \iff \big(\mathrm{Ker}\, f = \mathrm{Ker}\, f^{2} \text{ et } \operatorname{Im} f = \operatorname{Im} f^{2}\big)}$$
     Le pseudo-inverse d'un automorphisme est son inverse, celui d'un projecteur est le projecteur lui-même.

