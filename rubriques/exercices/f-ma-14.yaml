  enonce: |
    On pose $F = \{(x, y, z) \in \mathbb{R}^{3} \mid x - y + 3z = 0\}$ et $G = \{(x, y, z) \in \mathbb{R}^{3} \mid x + y - z = 0 \text{ et } 2x + z = 0\}$.

    **1.** Montrer que $F$ et $G$ sont supplémentaires dans $\mathbb{R}^{3}$, et donner une base de chacun d'eux.

    **2.** Soit $p$ le projecteur sur $F$ parallèlement à $G$, et $q$ le projecteur sur $G$ parallèlement à $F$. Expliciter $p(x, y, z)$ et $q(x, y, z)$.
  corrige: |
    **1.** Le plan $F$ a pour base $\big((1, 1, 0), (-3, 0, 1)\big)$, obtenue en écrivant $x = y - 3z$. Le système qui définit $G$ donne $z = -2x$ et $y = z - x = -3x$, d'où $G = \mathbb{R} w$ avec $w = (-1, 3, 2)$, obtenu pour $x = -1$. Avec $\varphi(x, y, z) = x - y + 3z$, on a $F = \mathrm{Ker}\,\varphi$ et $\varphi(w) = -1 - 3 + 6 = 2 \neq 0$. Le théorème 7 donne $\mathbb{R}^{3} = F \oplus G$.

    **2.** Comme à l'exercice précédent, $v - \lambda w \in F$ si et seulement si $\lambda = \frac{\varphi(v)}{\varphi(w)} = \frac{x - y + 3z}{2}$. 
    $$\boxed{q(x, y, z) = \frac{x - y + 3z}{2}(-1, 3, 2), \qquad p(x, y, z) = (x, y, z) - \frac{x - y + 3z}{2}(-1, 3, 2)}$$
