  enonce: |
    Soit $f \in \mathcal{L}(E, F)$ et $h \in \mathcal{L}(E, G)$ tels que $\mathrm{Ker}\, f \subset \mathrm{Ker}\, h$.

    **1.** Montrer qu'il existe une unique application $g : \operatorname{Im} f \to G$ telle que $g \circ f = h$.

    **2.** Montrer que $g$ est linéaire.
  corrige: |
    **1.** Une telle application doit vérifier $g(f(x)) = h(x)$ pour tout $x$, ce qui la détermine sur $\operatorname{Im} f$ : d'où l'unicité. Pour l'existence, il faut que $h(x)$ ne dépende que de $f(x)$ : si $f(x) = f(x')$, alors $x - x' \in \mathrm{Ker}\, f \subset \mathrm{Ker}\, h$, donc $h(x) = h(x')$. On peut donc poser $g(f(x)) = h(x)$.

    **2.** Pour $y = f(x)$, $y' = f(x')$ et $\lambda \in \mathbb{K}$, on a $\lambda y + y' = f(\lambda x + x')$, donc 
    $$g(\lambda y + y') = h(\lambda x + x') = \lambda h(x) + h(x') = \lambda g(y) + g(y').$$

    $$\boxed{\text{Il existe une unique } g \in \mathcal{L}(\operatorname{Im} f, G) \text{ telle que } g \circ f = h.}$$
     *À retenir.* C'est l'analogue linéaire de la factorisation d'une application par la relation d'équivalence « avoir la même image », vue au chapitre 2.
