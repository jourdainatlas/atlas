  enonce: |
    Soit $G$ et $H$ deux sous-espaces supplémentaires de $E$, et $A = \{u \in \mathcal{L}(E, F) \mid G \subset \mathrm{Ker}\, u\}$. Montrer que $A$ est un sous-espace vectoriel de $\mathcal{L}(E, F)$, isomorphe à $\mathcal{L}(H, F)$.
  corrige: |
    L'ensemble $A$ contient $0$, et si $u$, $v$ s'annulent sur $G$, $\lambda u + v$ aussi : c'est un sous-espace. L'application de restriction $\Phi : u \mapsto u_{|H}$, de $A$ dans $\mathcal{L}(H, F)$, est linéaire. Elle est injective : si $u \in A$ et $u_{|H} = 0$, alors $u$ est nulle sur $G$ et sur $H$, donc sur $E = G \oplus H$. Elle est surjective : pour $w \in \mathcal{L}(H, F)$, la proposition 19 fournit $u \in \mathcal{L}(E, F)$, nulle sur $G$ et égale à $w$ sur $H$. 
    $$\boxed{u \mapsto u_{|H} \text{ est un isomorphisme de } A \text{ sur } \mathcal{L}(H, F).}$$
