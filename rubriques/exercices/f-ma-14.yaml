  enonce: |
    Soit $F$, $G$, $H$ trois sous-espaces vectoriels de $E$ tels que $F + H = G + H$, $F \cap H = G \cap H$ et $F \subset G$. Montrer que $F = G$. Montrer que la conclusion ne tient plus si l'on omet la troisième hypothèse.
  corrige: |
    *Idée.* On décompose un vecteur de $G$ selon $F + H$, et l'on montre que sa composante dans $H$ est en fait dans $F$.

    Soit $g \in G \subset G + H = F + H$ : $g = f + h$ avec $f \in F$ et $h \in H$. Alors $h = g - f \in G$, puisque $F \subset G$, donc $h \in G \cap H = F \cap H \subset F$, et $g = f + h \in F$. Ainsi $G \subset F$, et $F = G$. 
    $$\boxed{F = G}$$
     Sans l'hypothèse $F \subset G$, c'est faux : dans $\mathbb{R}^{2}$, avec $H = \mathbb{R}(1, 0)$, $F = \mathbb{R}(0, 1)$ et $G = \mathbb{R}(1, 1)$, on a $F + H = G + H = \mathbb{R}^{2}$ et $F \cap H = G \cap H = \{0\}$, mais $F \neq G$. C'est l'exemple des supplémentaires non uniques.
