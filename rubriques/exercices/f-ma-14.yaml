  enonce: |
    Soit $S_{1}$ et $S_{2}$ deux sous-espaces supplémentaires de $E$. On note $p_{1}$ (resp. $p_{2}$) le projecteur sur $S_{1}$ parallèlement à $S_{2}$ (resp. sur $S_{2}$ parallèlement à $S_{1}$), et $s_{1}$ (resp. $s_{2}$) la symétrie par rapport à $S_{1}$ parallèlement à $S_{2}$ (resp. par rapport à $S_{2}$ parallèlement à $S_{1}$). Montrer les égalités 
    $$p_{1} + p_{2} = \mathrm{id}_{E}, \qquad p_{1} \circ p_{2} = p_{2} \circ p_{1} = 0, \qquad s_{1} + s_{2} = 0, \qquad s_{1} \circ s_{2} = s_{2} \circ s_{1} = -\mathrm{id}_{E}.$$
  corrige: |
    Écrivons $x = y + z$ avec $y \in S_{1}$ et $z \in S_{2}$. Alors $p_{1}(x) = y$, $p_{2}(x) = z$, $s_{1}(x) = y - z$ et $s_{2}(x) = z - y$. On lit directement $p_{1} + p_{2} = \mathrm{id}$, $p_{1}(p_{2}(x)) = p_{1}(z) = 0$, $p_{2}(p_{1}(x)) = 0$, $s_{1} + s_{2} = 0$, et 
    $$s_{1}(s_{2}(x)) = s_{1}(z - y) = -z - y = -x, \qquad s_{2}(s_{1}(x)) = s_{2}(y - z) = -y - z = -x.$$

    $$\boxed{p_{1} + p_{2} = \mathrm{id}_{E}, \quad p_{1}p_{2} = p_{2}p_{1} = 0, \quad s_{1} = -s_{2}, \quad s_{1}s_{2} = s_{2}s_{1} = -\mathrm{id}_{E}}$$
