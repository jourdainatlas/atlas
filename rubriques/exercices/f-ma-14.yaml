  page_corrige: 8
  enonce: |
    **1.** Montrer que la famille $(x \mapsto \mathrm{e}^{\alpha x})_{\alpha \in \mathbb{R}}$ est libre dans $\mathcal{F}(\mathbb{R}, \mathbb{R})$.

    **2.** Montrer que la famille $(x \mapsto |x - \alpha|)_{\alpha \in \mathbb{R}}$ est libre dans $\mathcal{F}(\mathbb{R}, \mathbb{R})$.
  corrige: |
    **1.** Une famille infinie est libre si toutes ses sous-familles finies le sont. Pour $\alpha_{1} < \cdots < \alpha_{n}$, la liberté de $(x \mapsto \mathrm{e}^{\alpha_{k}x})$ est l'exemple du cours, démontré en divisant par $\mathrm{e}^{\alpha_{n}x}$ et en faisant tendre $x$ vers $+\infty$.

    **2.** Soit $\alpha_{1}, \dots, \alpha_{n}$ distincts et $\sum \lambda_{k}|x - \alpha_{k}| = 0$ pour tout $x$. Si $\lambda_{j} \neq 0$, on aurait 
    $$|x - \alpha_{j}| = -\frac{1}{\lambda_{j}}\sum_{k \neq j} \lambda_{k}|x - \alpha_{k}|,$$
     et le membre de droite est dérivable en $\alpha_{j}$, puisque chaque $x \mapsto |x - \alpha_{k}|$ l'est hors de $\alpha_{k}$, alors que le membre de gauche ne l'est pas. Donc tous les $\lambda_{j}$ sont nuls. 
    $$\boxed{\text{Les deux familles sont libres.}}$$
     *À retenir.* Pour une famille de fonctions, on cherche une propriété qui distingue chaque fonction des autres : une croissance plus rapide, ou un point de non-dérivabilité qui lui est propre.
- id: "ma-14-23"
  feuille: "f-ma-14"
  numero: 23
  partie: "Familles de vecteurs"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [familles de vecteurs, familles libres]
  noeuds: [v-libre]
  notions: [famille-libre]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    **1.** Montrer que la famille $(\cos^{n})_{n \in \mathbb{N}}$ est libre dans $\mathcal{F}(\mathbb{R}, \mathbb{R})$.

    **2.** Montrer que $\mathrm{Vect}(\cos^{n})_{n \in \mathbb{N}} = \mathrm{Vect}\big(x \mapsto \cos(nx)\big)_{n \in \mathbb{N}}$.

    **3.** Montrer que la famille $\big(x \mapsto \cos(nx)\big)_{n \in \mathbb{N}}$ est libre.
  corrige: |
    **1.** Si $\sum_{k = 0}^{d} \lambda_{k}\cos^{k} = 0$, le polynôme $\sum \lambda_{k}T^{k}$ s'annule sur $[-1, 1]$, donc il est nul : la famille est libre, comme à l'exercice 18.

    **2.** Pour tout $n$, il existe un polynôme $T_{n}$ de degré $n$ tel que $\cos(nx) = T_{n}(\cos x)$ : c'est le polynôme de Tchebychev de l'exercice 53 du chapitre 13, ou une conséquence de la formule de Moivre (chapitre 4). Donc $x \mapsto \cos(nx)$ appartient à $\mathrm{Vect}(\cos^{k})_{k \leqslant n}$. Réciproquement, la linéarisation (chapitre 4) écrit $\cos^{n}$ comme combinaison des $x \mapsto \cos(kx)$, $k \leqslant n$. Les deux sous-espaces engendrés sont égaux, par le théorème 1. 
    $$\boxed{\mathrm{Vect}(\cos^{n})_{n \in \mathbb{N}} = \mathrm{Vect}\big(\cos(n\,\cdot)\big)_{n \in \mathbb{N}}}$$

    **3.** Si $\sum \lambda_{k}\cos(k\,\cdot) = 0$, alors $\big(\sum \lambda_{k}T_{k}\big)(\cos x) = 0$ pour tout $x$, donc le polynôme $\sum \lambda_{k}T_{k}$ est nul ; comme les $T_{k}$ sont de degrés distincts, la proposition 9 donne $\lambda_{k} = 0$ pour tout $k$. 
    $$\boxed{\big(\cos(n\,\cdot)\big)_{n \in \mathbb{N}} \text{ est libre.}}$$
- id: "ma-14-24"
  feuille: "f-ma-14"
  numero: 24
  partie: "Familles de vecteurs"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [familles de vecteurs, bases]
  noeuds: [v-libre]
  notions: [famille-libre, base-vectorielle]
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Soit $a \neq b$ deux nombres complexes et $n \in \mathbb{N}$. Montrer que $\big((X - a)^{k}(X - b)^{n - k}\big)_{0 \leqslant k \leqslant n}$ est une base de $\mathbb{C}_{n}[X]$.
  corrige: |
    Notons $Q_{k} = (X - a)^{k}(X - b)^{n - k}$.

    $\triangleright$ *Liberté.* Supposons $\sum_{k = 0}^{n} c_{k}Q_{k} = 0$. En évaluant en $b$, seul le terme $k = n$ subsiste : $c_{n}(b - a)^{n} = 0$, donc $c_{n} = 0$. Les termes restants sont divisibles par $X - b$ ; après division, on obtient la même relation au rang $n - 1$, et une récurrence sur $n$ conclut.

    $\triangleright$ *Caractère générateur.* Posons $U = X - a$, $V = X - b$ et $d = b - a \neq 0$, de sorte que $U - V = d$. Par la formule de Taylor en $a$, tout $P \in \mathbb{C}_{n}[X]$ s'écrit $\sum_{j = 0}^{n} p_{j}U^{j}$. Or 
    $$U^{j} = U^{j}\Big(\frac{U - V}{d}\Big)^{n - j} = \frac{1}{d^{n - j}}\sum_{i = 0}^{n - j} \binom{n - j}{i}(-1)^{n - j - i}U^{j + i}V^{n - j - i},$$
     combinaison des $U^{k}V^{n - k} = Q_{k}$. 
    $$\boxed{(Q_{0}, \dots, Q_{n}) \text{ est une base de } \mathbb{C}_{n}[X].}$$
     Le chapitre 15 permettra d'abréger : une famille libre de $n + 1$ vecteurs dans un espace de dimension $n + 1$ est une base.
- id: "ma-14-25"
  feuille: "f-ma-14"
  numero: 25
  partie: "Familles de vecteurs"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [familles de vecteurs, sous-espaces vectoriels, sous-espace engendré, familles génératrices, bases]
  noeuds: [v-libre, v-espace, v-combinaisons]
  notions: [famille-libre, sous-espace-vectoriel, combinaison-lineaire, famille-generatrice, base-vectorielle]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    **1.** Soit $(x_{1}, \dots, x_{p})$ une famille génératrice de $E$, et $J = \{j \in [\![1\,;p]\!] \mid x_{j} \notin \mathrm{Vect}(x_{1}, \dots, x_{j - 1})\}$. Montrer que $(x_{j})_{j \in J}$ est une base de $E$.

    **2.** En déduire une base du sous-espace de $\mathbb{R}^{3}$ engendré par $(1, 1, 1)$, $(-2, -1, 0)$, $(0, 1, 2)$ et $(-1, 1, 3)$.
  corrige: |
    **1.** *Génératrice.* Montrons par récurrence sur $j$ que $x_{j} \in \mathrm{Vect}(x_{i})_{i \in J,\, i \leqslant j}$. Si $j \in J$, c'est clair. Sinon, $x_{j} \in \mathrm{Vect}(x_{1}, \dots, x_{j - 1})$, et chacun de ces vecteurs appartient, par hypothèse de récurrence, à $\mathrm{Vect}(x_{i})_{i \in J,\, i < j}$. Donc $\mathrm{Vect}(x_{j})_{j \in J}$ contient tous les $x_{i}$, et vaut $E$.

    *Libre.* Si $\sum_{j \in J} \lambda_{j}x_{j} = 0$ avec des coefficients non tous nuls, soit $m$ le plus grand indice tel que $\lambda_{m} \neq 0$. Alors $x_{m}$ est combinaison de vecteurs d'indices inférieurs, donc appartient à $\mathrm{Vect}(x_{1}, \dots, x_{m - 1})$, ce qui contredit $m \in J$. 
    $$\boxed{(x_{j})_{j \in J} \text{ est une base de } E.}$$

    **2.** Les deux premiers vecteurs ne sont pas colinéaires. Ensuite, $(0, 1, 2) = 2(1, 1, 1) + (-2, -1, 0)$ et $(-1, 1, 3) = 3(1, 1, 1) + 2(-2, -1, 0)$, donc $J = \{1, 2\}$. 
    $$\boxed{\text{Base : } \big((1, 1, 1), (-2, -1, 0)\big)}$$
- id: "ma-14-26"
  feuille: "f-ma-14"
  numero: 26
  partie: "Somme de sous-espaces"
  etoiles: 1
  types: [Calcul]
  mots_cles: [somme de sous-espaces]
  noeuds: [v-somme-directe]
  notions: [somme-directe]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    On pose $F = \mathrm{Vect}\big((1, 1, 0), (0, 1, 1)\big)$ et $G = \mathrm{Vect}\big((1, 1, 1)\big)$ dans $\mathbb{R}^{3}$. Déterminer $F \cap G$ et $F + G$.
  corrige: |
    Si $t(1, 1, 1) = a(1, 1, 0) + b(0, 1, 1)$, les coordonnées donnent $a = t$, $b = t$ et $a + b = t$, donc $t = 0$ : $F \cap G = \{0\}$. Pour la somme, l'équation $a(1, 1, 0) + b(0, 1, 1) + c(1, 1, 1) = (x, y, z)$ s'écrit $a + c = x$, $a + b + c = y$, $b + c = z$, et elle a pour solution $b = y - x$, $a = y - z$, $c = x + z - y$, quel que soit $(x, y, z)$. 
    $$\boxed{F \cap G = \{0\}, \qquad F + G = \mathbb{R}^{3}, \qquad \mathbb{R}^{3} = F \oplus G}$$
- id: "ma-14-27"
  feuille: "f-ma-14"
  numero: 27
  partie: "Somme de sous-espaces"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [somme de sous-espaces, sommes directes]
  noeuds: [v-somme-directe]
  notions: [somme-directe, supplementaire]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Dans $\mathbb{R}^{4}$, on pose 
    $$E = \{(x, y, z, t) \mid x - y + z - t = 0\}, \qquad F = \mathrm{Vect}\big((1, 1, 1, 1)\big), \qquad G = \{(x, y, z, t) \mid x + z = y + t = 0\}.$$
     Montrer que $E = F \oplus G$.
  corrige: |
    Les sous-espaces $F$ et $G$ sont contenus dans $E$ : $1 - 1 + 1 - 1 = 0$, et si $x + z = y + t = 0$, alors $x - y + z - t = 0$. Raisonnons par analyse-synthèse. Si $v = (x, y, z, t) \in E$ s'écrit $a(1, 1, 1, 1) + w$ avec $w \in G$, les conditions $(x - a) + (z - a) = 0$ et $(y - a) + (t - a) = 0$ imposent 
    $$a = \frac{x + z}{2} = \frac{y + t}{2},$$
     ces deux valeurs étant égales puisque $v \in E$. Réciproquement, avec cette valeur de $a$, le vecteur $w = v - a(1, 1, 1, 1)$ appartient à $G$. 
    $$\boxed{E = F \oplus G, \quad v = \frac{x + z}{2}(1, 1, 1, 1) + \Big(v - \frac{x + z}{2}(1, 1, 1, 1)\Big)}$$
- id: "ma-14-28"
  feuille: "f-ma-14"
  numero: 28
