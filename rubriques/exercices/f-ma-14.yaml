  enonce: |
    **1.** Soit $u \in \mathcal{L}(E, F)$ et $S_{1}$, $S_{2}$ deux sous-espaces de $E$. Montrer que $u(S_{1} + S_{2}) = u(S_{1}) + u(S_{2})$. On suppose de plus $u$ injective et la somme $S_{1} + S_{2}$ directe : montrer que la somme $u(S_{1}) + u(S_{2})$ est directe. Peut-on se passer de l'injectivité ?

    **2.** Soit $f$, $g \in \mathcal{L}(E)$ tels que $\operatorname{Im}(f + g) = \operatorname{Im} f \oplus \operatorname{Im} g$. Montrer que $E = \mathrm{Ker}\, f + \mathrm{Ker}\, g$.
  corrige: |
    **1.** Les vecteurs de $u(S_{1} + S_{2})$ sont les $u(s_{1} + s_{2}) = u(s_{1}) + u(s_{2})$ : c'est $u(S_{1}) + u(S_{2})$. Si $u$ est injective et si $y = u(s_{1}) = u(s_{2})$ appartient à $u(S_{1}) \cap u(S_{2})$, alors $s_{1} = s_{2} \in S_{1} \cap S_{2} = \{0\}$, donc $y = 0$. Sans injectivité, c'est faux : avec $u(x, y) = (x + y, 0)$, $S_{1} = \mathbb{R}(1, 0)$ et $S_{2} = \mathbb{R}(0, 1)$, on obtient $u(S_{1}) = u(S_{2}) = \mathbb{R}(1, 0)$.

    **2.** Soit $x \in E$. Comme $f(x) \in \operatorname{Im} f \subset \operatorname{Im}(f + g)$, il existe $y$ tel que $f(x) = f(y) + g(y)$, soit $f(x - y) = g(y)$. Ce vecteur appartient à $\operatorname{Im} f \cap \operatorname{Im} g = \{0\}$, donc $x - y \in \mathrm{Ker}\, f$ et $y \in \mathrm{Ker}\, g$. 
    $$\boxed{x = (x - y) + y \in \mathrm{Ker}\, f + \mathrm{Ker}\, g}$$
