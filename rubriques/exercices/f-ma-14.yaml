  enonce: |
    Soit $f \in \mathcal{C}(\mathbb{R}, \mathbb{R})$. À quelle condition la famille $(f^{n})_{n \in \mathbb{N}}$ est-elle liée ?
  corrige: |
    *Idée.* Une relation de dépendance $\sum \lambda_{k}f^{k} = 0$ dit que $f$ prend ses valeurs parmi les racines d'un polynôme non nul ; une fonction continue qui ne prend qu'un nombre fini de valeurs est constante.

    Si $f$ est constante égale à $c$, alors $f^{1} - cf^{0} = 0$ est une relation de dépendance, $f^{0}$ étant la fonction constante $1$. Réciproquement, si $\sum_{k = 0}^{d} \lambda_{k}f^{k} = 0$ avec des $\lambda_{k}$ non tous nuls, le polynôme non nul $P = \sum \lambda_{k}X^{k}$ vérifie $P(f(x)) = 0$ pour tout $x$ : l'image $f(\mathbb{R})$ est contenue dans l'ensemble fini des racines de $P$. Or $f(\mathbb{R})$ est un intervalle, par le théorème des valeurs intermédiaires (chapitre 8) ; un intervalle fini est réduit à un point. 
    $$\boxed{(f^{n})_{n \in \mathbb{N}} \text{ est liée si et seulement si } f \text{ est constante.}}$$
