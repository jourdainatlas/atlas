  enonce: |
    Soit $E$ un sous-espace vectoriel de $\mathbb{K}^{n}$ tel que tout vecteur non nul de $E$ ait toutes ses coordonnées non nulles. Montrer qu'il existe $v \in E$ tel que $E = \mathrm{Vect}(v)$.
  corrige: |
    *Idée.* Deux vecteurs de $E$ dont les premières coordonnées coïncident sont égaux, puisque leur différence a une coordonnée nulle.

    Si $E = \{0\}$, on prend $v = 0$. Sinon, soit $v \in E$ non nul ; sa première coordonnée $v_{1}$ est non nulle. Pour $x \in E$, le vecteur $x - \frac{x_{1}}{v_{1}}v$ appartient à $E$ et a une première coordonnée nulle, donc il est nul. 
    $$\boxed{E = \mathrm{Vect}(v)}$$
