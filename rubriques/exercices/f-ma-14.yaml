  enonce: |
    Soit $D : P \mapsto P'$, endomorphisme de $\mathbb{R}[X]$. Existe-t-il $f \in \mathcal{L}(\mathbb{R}[X])$ tel que $f \circ f = D$ ?
  corrige: |
    *Idée.* Une racine carrée de $D$ commute avec $D$, donc stabilise son noyau, et l'on suit l'effet de $f$ sur $1$ et sur $X$.

    Supposons $f \circ f = D$. Alors $f \circ D = f^{3} = D \circ f$, donc $f$ stabilise $\mathrm{Ker}\, D = \mathbb{R}_{0}[X]$ (exercice 45) : $f(1) = c$ est une constante. Comme $D(1) = 0$, on a $0 = f(f(1)) = c\,f(1) = c^{2}$, donc $f(1) = 0$. Ensuite, $D(f(X)) = f^{3}(X) = f(D(X)) = f(1) = 0$, donc $f(X)$ est une constante $c'$. Mais alors $1 = D(X) = f(f(X)) = c'f(1) = 0$, ce qui est absurde. 
    $$\boxed{\text{Aucun endomorphisme } f \text{ de } \mathbb{R}[X] \text{ ne vérifie } f \circ f = D.}$$
