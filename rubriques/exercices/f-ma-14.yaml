  enonce: |
    Dans $\mathbb{R}^{3}$, on pose $F = \{(x, y, z) \mid x + y - z = 0\}$ et $G = \mathrm{Vect}\big((1, 1, 3)\big)$.

    **1.** Montrer que $F$ et $G$ sont supplémentaires.

    **2.** Déterminer le projeté de $(2, 2, 3)$ sur $F$ parallèlement à $G$, puis celui de $(1, -2, 0)$ sur $G$ parallèlement à $F$.

    **3.** Donner l'expression de la symétrie par rapport à $F$ parallèlement à $G$.
  corrige: |
    **1.** Le plan $F$ est un hyperplan, noyau de $\varphi : (x, y, z) \mapsto x + y - z$, et $\varphi(1, 1, 3) = -1 \neq 0$ : par le théorème 7, $\mathbb{R}^{3} = F \oplus G$.

    **2.** Pour $v = (x, y, z)$, on cherche $\lambda$ tel que $v - \lambda(1, 1, 3) \in F$, c'est-à-dire $\varphi(v) - \lambda\varphi(1, 1, 3) = 0$, soit $\lambda = -\varphi(v) = -(x + y - z)$. Les projecteurs sur $F$ et sur $G$ sont donc 
    $$p(v) = v + (x + y - z)(1, 1, 3), \qquad q(v) = -(x + y - z)(1, 1, 3).$$

    $$\boxed{p(2, 2, 3) = (3, 3, 6), \qquad q(1, -2, 0) = (1, 1, 3)}$$

    **3.** La symétrie est $s = 2p - \mathrm{id}$. 
    $$\boxed{s(x, y, z) = (x, y, z) + 2(x + y - z)(1, 1, 3)}$$
