  page_corrige: 9
  enonce: |
    Dans $\mathbb{R}^{4}$, montrer que $F = \{(x, y, z, t) \mid x + y + z + t = 0\}$ et $G = \{(2a, -a, 0, a) \mid a \in \mathbb{R}\}$ sont supplémentaires.
  corrige: |
    Le sous-espace $F$ est le noyau de la forme linéaire non nulle $(x, y, z, t) \mapsto x + y + z + t$, donc un hyperplan, et $G$ est la droite dirigée par $(2, -1, 0, 1)$, dont la somme des coordonnées vaut $2 \neq 0$ : $G$ n'est pas contenue dans $F$. Le théorème 7 conclut. 
    $$\boxed{\mathbb{R}^{4} = F \oplus G}$$
     *À retenir.* Le théorème 7 évite tout calcul : un hyperplan et une droite qui n'y est pas contenue sont toujours supplémentaires.
- id: "ma-14-29"
  feuille: "f-ma-14"
  numero: 29
  partie: "Somme de sous-espaces"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [somme de sous-espaces, sous-espaces vectoriels, sommes directes]
  noeuds: [v-somme-directe, v-espace]
  notions: [somme-directe, sous-espace-vectoriel, supplementaire]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Montrer que $\{P \in \mathbb{R}_{3}[X] \mid P(X^{2}) = X^{2}P(X)\}$ et $\{P \in \mathbb{R}_{3}[X] \mid P(1) = P(2)\}$ sont deux sous-espaces supplémentaires de $\mathbb{R}_{3}[X]$.
  corrige: |
    Soit $F_{1}$ le premier ensemble, noyau d'une application linéaire. Si $P = aX^{3} + bX^{2} + cX + d$ en fait partie, l'égalité 
    $$aX^{6} + bX^{4} + cX^{2} + d = aX^{5} + bX^{4} + cX^{3} + dX^{2}$$
     impose $a = 0$, $c = 0$ et $d = 0$ ; réciproquement, $X^{2}$ convient. Donc $F_{1} = \mathrm{Vect}(X^{2})$. Le second ensemble est le noyau de la forme linéaire non nulle $P \mapsto P(2) - P(1)$, qui vaut $1$ en $X$ : c'est un hyperplan $H$, et $X^{2} \notin H$, puisque $4 \neq 1$. Le théorème 7 conclut. 
    $$\boxed{\mathbb{R}_{3}[X] = \mathrm{Vect}(X^{2}) \oplus \{P \mid P(1) = P(2)\}}$$
- id: "ma-14-30"
  feuille: "f-ma-14"
  numero: 30
  partie: "Somme de sous-espaces"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [somme de sous-espaces, sous-espaces vectoriels, sommes directes, sous-espaces affines, espaces de fonctions et de suites]
  noeuds: [v-somme-directe, v-espace]
  notions: [somme-directe, sous-espace-vectoriel, supplementaire]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    **1.** Soit $E$ l'espace des suites réelles convergentes. Montrer que l'ensemble des suites constantes et l'ensemble des suites de limite nulle sont deux sous-espaces supplémentaires dans $E$.

    **2.** Soit $E$ l'ensemble des fonctions de $\mathbb{R}$ dans $\mathbb{R}$ dérivables en $0$. Montrer que l'ensemble $F$ des fonctions $f \in E$ telles que $f(0) = f'(0) = 0$ et l'ensemble des fonctions affines sont deux sous-espaces supplémentaires de $E$. Généraliser.
  corrige: |
    **1.** Si $u$ converge vers $\ell$, alors $u = (\ell)_{n} + (u_{n} - \ell)_{n}$, somme d'une suite constante et d'une suite de limite nulle. Une suite constante de limite nulle est nulle : l'intersection est réduite à $0$. 
    $$\boxed{E = \{\text{suites constantes}\} \oplus \{\text{suites de limite nulle}\}}$$

    **2.** Les deux ensembles sont des sous-espaces de $E$, et leur intersection est nulle, puisqu'une fonction affine $x \mapsto a + bx$ vérifiant $f(0) = f'(0) = 0$ a $a = b = 0$. Pour $f \in E$, la fonction $g : x \mapsto f(x) - f(0) - f'(0)x$ appartient à $F$, et $f = g + \big(x \mapsto f(0) + f'(0)x\big)$. 
    $$\boxed{E = F \oplus \{x \mapsto a + bx\}}$$
     En généralisant : dans l'espace des fonctions $n$ fois dérivables en $0$, l'ensemble des $f$ telles que $f(0) = f'(0) = \cdots = f^{(n)}(0) = 0$ est un supplémentaire des fonctions polynomiales de degré au plus $n$, la décomposition étant donnée par le polynôme de Taylor $\sum_{k \leqslant n} \frac{f^{(k)}(0)}{k!}x^{k}$.
- id: "ma-14-31"
  feuille: "f-ma-14"
  numero: 31
  partie: "Somme de sous-espaces"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [somme de sous-espaces, sous-espaces vectoriels, sommes directes]
  noeuds: [v-somme-directe, v-espace]
  notions: [somme-directe, sous-espace-vectoriel, supplementaire]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Soit $n \in \mathbb{N}$. Montrer que $F = \{f \in \mathcal{C}^{\infty}(\mathbb{R}, \mathbb{R}) \mid f(x) \underset{x \to 0}{=} o(x^{n})\}$ est un sous-espace vectoriel de $\mathcal{C}^{\infty}(\mathbb{R}, \mathbb{R})$, et en trouver un supplémentaire.
  corrige: |
    Une combinaison linéaire de deux fonctions négligeables devant $x^{n}$ en $0$ l'est encore (chapitre 10), et $0 = o(x^{n})$ : $F$ est un sous-espace. Soit $G$ l'ensemble des fonctions polynomiales de degré au plus $n$. Si $f \in \mathcal{C}^{\infty}(\mathbb{R}, \mathbb{R})$, la formule de Taylor-Young donne 
    $$f = T + (f - T), \qquad T(x) = \sum_{k = 0}^{n} \frac{f^{(k)}(0)}{k!}x^{k}, \qquad f(x) - T(x) \underset{x \to 0}{=} o(x^{n}).$$
     Si une fonction polynomiale de degré au plus $n$ est négligeable devant $x^{n}$, l'unicité du développement limité (chapitre 10) montre que tous ses coefficients sont nuls : $F \cap G = \{0\}$. 
    $$\boxed{\mathcal{C}^{\infty}(\mathbb{R}, \mathbb{R}) = F \oplus \{x \mapsto P(x) \mid P \in \mathbb{R}_{n}[X]\}}$$
- id: "ma-14-32"
  feuille: "f-ma-14"
  numero: 32
  partie: "Somme de sous-espaces"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [somme de sous-espaces, sous-espaces vectoriels, sommes directes, espaces de fonctions et de suites]
  noeuds: [v-somme-directe, v-espace]
  notions: [somme-directe, sous-espace-vectoriel, supplementaire]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    **1.** Soit $F$ l'ensemble des fonctions de $\mathbb{R}$ dans $\mathbb{R}$ de période $1$, et $G$ l'ensemble des fonctions de $\mathbb{R}$ dans $\mathbb{R}$ de limite nulle en $+\infty$. Montrer que la somme $F + G$ est directe. Les sous-espaces $F$ et $G$ sont-ils supplémentaires dans $\mathcal{F}(\mathbb{R}, \mathbb{R})$ ?

    **2.** Dans $\mathbb{R}^{\mathbb{N}}$, montrer que l'ensemble des suites nulles aux indices pairs et l'ensemble des suites telles que $u_{2n} = u_{2n + 1}$ pour tout $n$ sont supplémentaires.
  corrige: |
    **1.** Si $f$ est $1$-périodique et de limite nulle en $+\infty$, alors pour tout $x$, $f(x) = f(x + k) \xrightarrow[k \to +\infty]{} 0$, donc $f(x) = 0 : F \cap G = \{0\}$. Les sous-espaces ne sont pas supplémentaires : si l'on avait $x = p(x) + g(x)$ avec $p \in F$ et $g \in G$, alors 
    $$0 = p(x + 1) - p(x) = 1 - \big(g(x + 1) - g(x)\big) \xrightarrow[x \to +\infty]{} 1,$$
     ce qui est absurde. 
    $$\boxed{F \cap G = \{0\}, \text{ mais } F + G \neq \mathcal{F}(\mathbb{R}, \mathbb{R}) : \ x \mapsto x \notin F + G}$$

    **2.** Notons $A$ et $B$ les deux ensembles, qui sont des sous-espaces. Une suite de $A \cap B$ vérifie $u_{2n} = 0$ et $u_{2n + 1} = u_{2n} = 0$ : elle est nulle. Pour $u \in \mathbb{R}^{\mathbb{N}}$, la suite $b$ définie par $b_{2n} = b_{2n + 1} = u_{2n}$ appartient à $B$, et $a = u - b$ a ses termes pairs nuls. 
    $$\boxed{\mathbb{R}^{\mathbb{N}} = A \oplus B}$$
- id: "ma-14-33"
  feuille: "f-ma-14"
  numero: 33
  partie: "Somme de sous-espaces"
  etoiles: 2
