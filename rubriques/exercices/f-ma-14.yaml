  enonce: |
    *Caractérisation des homothéties.* Soit $u \in \mathcal{L}(E)$ tel que, pour tout $x \in E$, les vecteurs $x$ et $u(x)$ soient colinéaires. Montrer que $u$ est une homothétie.
  corrige: |
    Pour $x \neq 0$, il existe un unique scalaire $\lambda_{x}$ tel que $u(x) = \lambda_{x}x$. Soit $x$, $y$ non nuls. Si $(x, y)$ est libre, alors 
    $$\lambda_{x + y}(x + y) = u(x + y) = \lambda_{x}x + \lambda_{y}y,$$
     et la liberté donne $\lambda_{x} = \lambda_{x + y} = \lambda_{y}$. Si $y = \mu x$, avec $\mu \neq 0$, alors $u(y) = \mu\lambda_{x}x = \lambda_{x}y$, donc $\lambda_{y} = \lambda_{x}$. Le scalaire $\lambda = \lambda_{x}$ ne dépend donc pas de $x$, et $u(x) = \lambda x$ pour tout $x$, y compris $x = 0$. 
    $$\boxed{u = \lambda\,\mathrm{id}_{E}}$$
     *Piège.* L'erreur la plus répandue est de conclure dès que $u(x) = \lambda_{x}x$ pour tout $x$ : tout le travail consiste à montrer que $\lambda_{x}$ est constant, en distinguant les couples libres et les couples liés.
