  notions: [somme-directe, sous-espace-vectoriel, supplementaire]
  page_enonce: 6
  page_corrige: 11
  enonce: |
    Soit $F$, $G$, $H$ trois sous-espaces vectoriels de $E$ tels que $(F \cap G) \oplus H = G$. Montrer que la somme $F + H$ est directe et que $F + G = F \oplus H$.
  corrige: |
    Comme $H \subset G$, on a $F \cap H \subset (F \cap G) \cap H = \{0\}$ : la somme $F + H$ est directe. Ensuite, $F + H \subset F + G$ puisque $H \subset G$, et $G = (F \cap G) + H \subset F + H$, donc $F + G \subset F + H$. 
    $$\boxed{F + G = F \oplus H}$$
- id: "ma-14-36"
  feuille: "f-ma-14"
  numero: 36
  partie: "Applications linéaires"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [applications linéaires, espaces de polynômes]
  noeuds: [v-applications, pol-anneau]
  notions: [application-lineaire, derivee-successive]
  page_enonce: 6
  page_corrige: 11
  enonce: |
    Les applications suivantes sont-elles linéaires ? On ne demande pas de justifier les réponses positives évidentes, mais de démontrer les réponses négatives.

    **1.** $(x, y) \mapsto xy$, de $\mathbb{K}^{2}$ dans $\mathbb{K}$ ;

    **2.** $(x, y) \mapsto (1 + x, 2x, y)$, de $\mathbb{K}^{2}$ dans $\mathbb{K}^{3}$ ;

    **3.** $(x, y, z) \mapsto (x - 3z, 2x + y)$, de $\mathbb{K}^{3}$ dans $\mathbb{K}^{2}$ ;

    **4.** $x \mapsto |x|$, de $\mathbb{R}$ dans $\mathbb{R}$ ;

    **5.** $(x, y) \mapsto x^{2} - y^{2}$, de $\mathbb{C}^{2}$ dans $\mathbb{C}$ ;

    **6.** $(x, y) \mapsto \min(x, y)$, de $\mathbb{R}^{2}$ dans $\mathbb{R}$ ;

    **7.** $P \mapsto P(X^{2})$, sur $\mathbb{K}[X]$ ;

    **8.** $P \mapsto P^{2}$, sur $\mathbb{K}[X]$ ;

    **9.** $P \mapsto (2X + 1)P' - 4P$, sur $\mathbb{R}[X]$ ;

    **10.** $f \mapsto f'' - 2f' + f$, de $\mathcal{C}^{2}(\mathbb{R}, \mathbb{R})$ dans $\mathcal{C}(\mathbb{R}, \mathbb{R})$ ;

    **11.** $f \mapsto f^{2} + 2f$, sur $\mathcal{C}(\mathbb{R}, \mathbb{R})$ ;

    **12.** $f \mapsto \int_{0}^{1} f(t)^{2}\,\mathrm{d} t$, de $\mathcal{C}(\mathbb{R}, \mathbb{R})$ dans $\mathbb{R}$.

    Même question pour $(u_{n}) \mapsto (u_{n + 2} + u_{n + 1} + u_{n})$ sur $\mathbb{R}^{\mathbb{N}}$, et pour $g \mapsto g \circ g$ sur $\mathcal{L}(\mathbb{R}^{2})$.
  corrige: |
    Les applications (iii), (vii), (ix) et (x) sont linéaires, ainsi que $(u_{n}) \mapsto (u_{n + 2} + u_{n + 1} + u_{n})$ : chacune transforme une combinaison linéaire en la combinaison des images. Pour les autres, un contre-exemple suffit.

    • (i) : l'image de $2(1, 1)$ vaut $4$, et non $2 \times 1$. (ii) : l'image de $(0, 0)$ est $(1, 0, 0) \neq 0$.

    • (iv) : $|-1| \neq -|1|$. (v) : l'image de $2(1, 0)$ vaut $4 \neq 2$.

    • (vi) : $\min(1, 0) + \min(0, 1) = 0$, alors que $\min(1, 1) = 1$.

    • (viii) : $(2P)^{2} = 4P^{2} \neq 2P^{2}$ pour $P = 1$. (xi) : pour $f = 1$, l'image de $2f$ vaut $8$, et non $2 \times 3$.

    • (xii) : l'image de $2f$ est $4$ fois celle de $f$, et non $2$ fois, pour $f = 1$. Pour $g \mapsto g \circ g$ : l'image de $2\,\mathrm{id}$ est $4\,\mathrm{id} \neq 2\,\mathrm{id}$.

    $$\boxed{\text{Linéaires : (iii), (vii), (ix), (x), et } (u_{n}) \mapsto (u_{n + 2} + u_{n + 1} + u_{n}).}$$
     *Piège.* Le test $u(0) = 0$ ne suffit pas : (i), (iv), (v), (vi), (viii), (xi), (xii) envoient $0$ sur $0$ sans être linéaires.
- id: "ma-14-37"
  feuille: "f-ma-14"
  numero: 37
  partie: "Applications linéaires"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [applications linéaires, noyau et image]
  noeuds: [v-applications]
  notions: [application-lineaire, noyau]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Montrer que les applications suivantes sont linéaires, et déterminer leurs noyaux et leurs images.

    **1.** $(x, y) \mapsto (x + 2y, -2x - 4y)$, sur $\mathbb{R}^{2}$ ;

    **2.** $(x, y, z) \mapsto (x, 2x - z, x - y + z)$, sur $\mathbb{R}^{3}$ ;

    **3.** $(x, y, z) \mapsto (x - 2y, x + 2z)$, de $\mathbb{R}^{3}$ dans $\mathbb{R}^{2}$ ;

    **4.** $(x, y) \mapsto (x - 2y, x + 2y)$, sur $\mathbb{R}^{2}$.
  corrige: |
    Les quatre applications ont des composantes de la forme $a_{1}x_{1} + \cdots + a_{p}x_{p}$ : elles sont linéaires. On résout $u(x) = 0$ pour le noyau, et l'on utilise la proposition 18 pour l'image.

    **(i)** $x + 2y = 0$ : $\mathrm{Ker}\, = \mathbb{R}(-2, 1)$ ; les deux coordonnées de l'image sont liées par $y' = -2x'$ : $\operatorname{Im} = \mathbb{R}(1, -2)$.

    **(ii)** Le système $x = 0$, $2x - z = 0$, $x - y + z = 0$ n'a que la solution nulle ; pour tout $(a, b, c)$, l'équation $u(x, y, z) = (a, b, c)$ a la solution $x = a$, $z = 2a - b$, $y = 3a - b - c$ : l'application est bijective.

    **(iii)** $x = 2y$ et $x = -2z$ : $\mathrm{Ker}\, = \mathbb{R}(2, 1, -1)$ ; les images $(1, 1)$ et $(-2, 0)$ de $e_{1}$ et $e_{2}$ engendrent $\mathbb{R}^{2}$, donc $\operatorname{Im} = \mathbb{R}^{2}$.

    **(iv)** $x - 2y = x + 2y = 0$ impose $x = y = 0$ ; l'équation $u(x, y) = (a, b)$ a la solution $x = \frac{a + b}{2}$, $y = \frac{b - a}{4}$ : bijective. 
    $$\boxed{\text{(i) } \mathrm{Ker}\, = \mathbb{R}(-2, 1),\ \operatorname{Im} = \mathbb{R}(1, -2) ; \ \text{(ii), (iv) bijectives} ; \ \text{(iii) } \mathrm{Ker}\, = \mathbb{R}(2, 1, -1),\ \operatorname{Im} = \mathbb{R}^{2}}$$
- id: "ma-14-38"
  feuille: "f-ma-14"
  numero: 38
  partie: "Applications linéaires"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [applications linéaires, familles génératrices, bases, noyau et image, isomorphismes]
  noeuds: [v-applications, v-libre]
  notions: [application-lineaire, famille-generatrice, base-vectorielle, noyau, groupe-lineaire]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    **1.** Soit $f : (x, y, z) \mapsto (x - y + z, 2x + y + 2z)$. Montrer que $f \in \mathcal{L}(\mathbb{R}^{3}, \mathbb{R}^{2})$, déterminer une base de $\mathrm{Ker}\, f$ et l'image de $f$. L'application $f$ est-elle injective ? surjective ?

    **2.** Soit $a \in \mathbb{R}$ et $g : (x, y, z) \mapsto (2y + z, x + z, -x + y + az)$. Montrer que $g \in \mathcal{L}(\mathbb{R}^{3})$, et déterminer les valeurs de $a$ pour lesquelles $g$ est un automorphisme. Pour $a = 1$, calculer $g^{-1}$. Lorsque $g$ n'est pas bijective, donner une base de son noyau et une famille génératrice de son image.
  corrige: |
    **1.** Le système $x - y + z = 2x + y + 2z = 0$ donne, par somme, $3x + 3z = 0$, puis $y = 0$ : $\mathrm{Ker}\, f = \mathbb{R}(-1, 0, 1)$. Les images $(1, 2)$ et $(-1, 1)$ de $e_{1}$ et $e_{2}$ ne sont pas colinéaires : on résout $a(1, 2) + b(-1, 1) = (p, q)$ par $a = \frac{p + q}{3}$, $b = \frac{q - 2p}{3}$, donc elles engendrent $\mathbb{R}^{2}$. 
    $$\boxed{\mathrm{Ker}\, f = \mathbb{R}(-1, 0, 1), \ \operatorname{Im} f = \mathbb{R}^{2} : \ f \text{ est surjective, non injective.}}$$

    **2.** La linéarité est immédiate. Résolvons $g(x, y, z) = (p, q, r)$. La deuxième équation donne $x = q - z$, la première $y = \frac{p - z}{2}$, et la troisième devient 
    $$-(q - z) + \frac{p - z}{2} + az = r, \qquad\text{soit}\qquad \Big(a + \frac{1}{2}\Big)z = r + q - \frac{p}{2}.$$
     Si $a \neq -\frac{1}{2}$, la solution est unique : $g$ est bijective. Pour $a = 1$, on obtient $z = \frac{-p + 2q + 2r}{3}$, puis $x$ et $y$. 
    $$\boxed{g \in \mathrm{GL}(\mathbb{R}^{3}) \iff a \neq -\frac{1}{2}, \qquad a = 1 : \ g^{-1}(p, q, r) = \frac{1}{3}\big(p + q - 2r,\ 2p - q - r,\ -p + 2q + 2r\big)}$$
     Pour $a = -\frac{1}{2}$, le noyau s'obtient avec $p = q = r = 0$ et $z$ libre : $x = -z$, $y = -\frac{z}{2}$. L'image est engendrée par $g(e_{1}) = (0, 1, -1)$ et $g(e_{2}) = (2, 0, 1)$, puisque $g(e_{3}) = (1, 1, -\frac{1}{2})$ est égal à $g(e_{1}) + \frac{1}{2}g(e_{2})$ ; c'est le plan d'équation $p - 2q - 2r = 0$, d'après la condition de compatibilité. 
    $$\boxed{a = -\tfrac{1}{2} : \ \mathrm{Ker}\, g = \mathbb{R}(2, 1, -2), \quad \operatorname{Im} g = \mathrm{Vect}\big((0, 1, -1), (2, 0, 1)\big) = \{p - 2q - 2r = 0\}}$$
- id: "ma-14-39"
  feuille: "f-ma-14"
  numero: 39
  partie: "Applications linéaires"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [applications linéaires, sous-espaces vectoriels, isomorphismes, espaces de polynômes]
  noeuds: [v-applications, v-espace, pol-anneau]
  notions: [application-lineaire, sous-espace-vectoriel, groupe-lineaire]
  page_enonce: 7
  page_corrige: 13
  enonce: |
    **1.** Soit $E = \{(u_{n}) \in \mathbb{R}^{\mathbb{N}} \mid u_{0} = 0\}$ et $\Delta : (u_{n}) \mapsto (u_{n + 1} - u_{n})$. Montrer que $E$ est un sous-espace vectoriel de $\mathbb{R}^{\mathbb{N}}$ et que $\Delta$ est un isomorphisme de $E$ sur $\mathbb{R}^{\mathbb{N}}$.

    **2.** Soit $a \in \mathbb{K}$. Montrer que $E_{a} = \{P \in \mathbb{K}[X] \mid P(a) = 0\}$ est un sous-espace vectoriel de $\mathbb{K}[X]$, isomorphe à $\mathbb{K}[X]$.
  corrige: |
    **1.** L'ensemble $E$ est le noyau de la forme linéaire $u \mapsto u_{0}$, et $\Delta$ est linéaire. Si $\Delta(u) = 0$, la suite $u$ est constante, égale à $u_{0} = 0$ : $\Delta$ est injective. Si $v \in \mathbb{R}^{\mathbb{N}}$, la suite définie par $u_{n} = \sum_{k = 0}^{n - 1} v_{k}$ appartient à $E$ et vérifie $\Delta(u) = v$, par télescopage (chapitre 3). 
    $$\boxed{\Delta : E \to \mathbb{R}^{\mathbb{N}} \text{ est un isomorphisme, de réciproque } v \mapsto \Big(\sum_{k < n} v_{k}\Big)_{n}}$$

    **2.** L'ensemble $E_{a}$ est le noyau de l'évaluation en $a$. L'application $Q \mapsto (X - a)Q$, de $\mathbb{K}[X]$ dans $E_{a}$, est linéaire, injective puisque $\mathbb{K}[X]$ est intègre, et surjective par la proposition 7 du chapitre 13. 
    $$\boxed{Q \mapsto (X - a)Q \text{ est un isomorphisme de } \mathbb{K}[X] \text{ sur } E_{a}.}$$
     *Piège.* En dimension infinie, un espace peut être isomorphe à l'un de ses sous-espaces stricts ; le chapitre 15 montrera que c'est impossible en dimension finie.
- id: "ma-14-40"
  feuille: "f-ma-14"
  numero: 40
  partie: "Applications linéaires"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [applications linéaires, isomorphismes, équations linéaires]
  noeuds: [v-applications, ed-lineaires]
  notions: [application-lineaire, groupe-lineaire]
  page_enonce: 7
  page_corrige: 13
  enonce: |
    Soit $n \geqslant 1$ et $\omega > 0$.

    **1.** Montrer que $T_{n} : P \mapsto P'' + \omega^{2}P$ est un endomorphisme de $\mathbb{R}_{n}[X]$.

    **2.** En calculant $T_{n}(1), T_{n}(X), \dots, T_{n}(X^{n})$, montrer que $T_{n}$ est un automorphisme de $\mathbb{R}_{n}[X]$.

    **3.** Montrer que l'équation différentielle $y'' + \omega^{2}y = x^{n}$ possède une unique solution polynomiale, dont on donnera le degré.
  corrige: |
    **1.** L'application $T_{n}$ est linéaire, et $\deg(P'' + \omega^{2}P) \leqslant \deg P$ : elle envoie $\mathbb{R}_{n}[X]$ dans lui-même.

    **2.** On a $T_{n}(X^{k}) = \omega^{2}X^{k} + k(k - 1)X^{k - 2}$, polynôme de degré exactement $k$, puisque $\omega \neq 0$. La famille $\big(T_{n}(X^{k})\big)_{0 \leqslant k \leqslant n}$ est donc à degrés échelonnés, c'est une base de $\mathbb{R}_{n}[X]$ (proposition 10), et $T_{n}$ est un automorphisme par le théorème 4 (iii).

    **3.** Le polynôme $P = T_{n}^{-1}(X^{n})$ est une solution, de degré $n$, puisque $T_{n}$ conserve le degré. Si $Q$ est une solution polynomiale quelconque, de degré $m$, alors $\deg(Q'' + \omega^{2}Q) = m$, donc $m = n$, et $Q = P$ par injectivité de $T_{n}$. 
    $$\boxed{\text{Il existe une unique solution polynomiale, de degré } n.}$$
     Par exemple, pour $n = 2$ : $P = \frac{X^{2}}{\omega^{2}} - \frac{2}{\omega^{4}}$.
- id: "ma-14-41"
  feuille: "f-ma-14"
  numero: 41
  partie: "Applications linéaires"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [applications linéaires, sous-espaces vectoriels, isomorphismes, espaces de polynômes]
  noeuds: [v-applications, v-espace, pol-anneau]
  notions: [application-lineaire, sous-espace-vectoriel, groupe-lineaire]
  page_enonce: 7
  page_corrige: 13
  enonce: |
    On note $\Delta : P \mapsto P(X + 1) - P(X)$, et $\Delta_{n}$ sa restriction à $\mathbb{R}_{n}[X]$ pour $n \in \mathbb{N}$.

    **1.** Montrer que $\Delta$ est un endomorphisme de $\mathbb{R}[X]$, et que $\Delta_{n}$ est un endomorphisme de $\mathbb{R}_{n}[X]$.

    **2.** Déterminer $\mathrm{Ker}\, \Delta_{n}$ et $\operatorname{Im} \Delta_{n}$, puis $\mathrm{Ker}\, \Delta$ et $\operatorname{Im} \Delta$.

    **3.** Montrer que $\Delta_{n}^{n + 1} = 0$.

    **4.** Trouver un sous-espace $E$ de $\mathbb{R}[X]$ tel que $\Delta$ induise un isomorphisme de $E$ sur $\mathbb{R}[X]$.

    **5.** En déduire que, pour tout $d \in \mathbb{N}$, il existe un polynôme $S_{d}$ tel que $\displaystyle \sum_{k = 0}^{n} k^{d} = S_{d}(n)$ pour tout $n \in \mathbb{N}$.
  corrige: |
    **1.** La linéarité vient de celle de $P \mapsto P(X + 1)$. Par la formule du binôme, $\Delta(X^{k}) = \sum_{j < k} \binom{k}{j}X^{j}$ est de degré $k - 1$ si $k \geqslant 1$, de coefficient dominant $k$, et $\Delta(1) = 0$. Donc $\deg\Delta(P) = \deg P - 1$ si $\deg P \geqslant 1$ : $\Delta$ envoie $\mathbb{R}_{n}[X]$ dans $\mathbb{R}_{n - 1}[X] \subset \mathbb{R}_{n}[X]$.

    **2.** Un polynôme de degré au moins $1$ a une image non nulle, donc $\mathrm{Ker}\,\Delta_{n} = \mathrm{Ker}\,\Delta = \mathbb{R}_{0}[X]$. Par la proposition 18, $\operatorname{Im}\Delta_{n}$ est engendrée par $\Delta(X), \dots, \Delta(X^{n})$, de degrés $0, \dots, n - 1$ : c'est $\mathbb{R}_{n - 1}[X]$ (proposition 10). De même, $\operatorname{Im}\Delta = \mathbb{R}[X]$. 
    $$\boxed{\mathrm{Ker}\,\Delta_{n} = \mathrm{Ker}\,\Delta = \mathbb{R}_{0}[X], \qquad \operatorname{Im}\Delta_{n} = \mathbb{R}_{n - 1}[X], \qquad \operatorname{Im}\Delta = \mathbb{R}[X]}$$

    **3.** Chaque application de $\Delta$ fait baisser le degré d'au moins $1$, et envoie les constantes sur $0$ : $\Delta_{n}^{n + 1}(P) = 0$ pour $\deg P \leqslant n$.

    **4.** Soit $E = X\mathbb{R}[X]$, ensemble des polynômes sans terme constant. La restriction de $\Delta$ à $E$ est injective, puisque $E \cap \mathbb{R}_{0}[X] = \{0\}$, et surjective, puisque $\Delta(X^{k + 1})$ est de degré $k$ pour tout $k$, de sorte que les $\Delta(X^{k + 1})$ forment une base de $\mathbb{R}[X]$. 
    $$\boxed{\Delta \text{ induit un isomorphisme de } X\mathbb{R}[X] \text{ sur } \mathbb{R}[X].}$$

    **5.** Soit $Q \in X\mathbb{R}[X]$ tel que $\Delta(Q) = X^{d}$. Alors $Q(k + 1) - Q(k) = k^{d}$, et la somme télescopique donne 
    $$\sum_{k = 0}^{n} k^{d} = Q(n + 1) - Q(0) = Q(n + 1).$$

    $$\boxed{S_{d} = Q(X + 1), \text{ où } Q \in X\mathbb{R}[X] \text{ vérifie } Q(X + 1) - Q(X) = X^{d}}$$
     Pour $d = 1$, $Q = \frac{X(X - 1)}{2}$ et l'on retrouve $\sum_{k = 0}^{n} k = \frac{n(n + 1)}{2}$.
- id: "ma-14-42"
  feuille: "f-ma-14"
  numero: 42
  partie: "Applications linéaires"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [applications linéaires, noyau et image]
  noeuds: [v-applications]
  notions: [application-lineaire, noyau]
  page_enonce: 7
  page_corrige: 14
  enonce: |
    Montrer que $f : P \mapsto P(2X) - P(X)$ est un endomorphisme de $\mathbb{R}[X]$, et déterminer son noyau et son image.
  corrige: |
    L'application $f$ est linéaire, et $f(X^{k}) = (2^{k} - 1)X^{k}$. Pour $P = \sum a_{k}X^{k}$, on a donc 
    $$f(P) = \sum_{k} (2^{k} - 1)a_{k}X^{k},$$
     qui est nul si et seulement si $a_{k} = 0$ pour tout $k \geqslant 1$. L'image est engendrée par les $f(X^{k})$, multiples non nuls de $X^{k}$ pour $k \geqslant 1$. 
    $$\boxed{\mathrm{Ker}\, f = \mathbb{R}_{0}[X], \qquad \operatorname{Im} f = X\mathbb{R}[X]}$$
- id: "ma-14-43"
  feuille: "f-ma-14"
  numero: 43
  partie: "Applications linéaires"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [applications linéaires, bases, sommes directes, isomorphismes]
  noeuds: [v-applications, v-libre, v-somme-directe]
  notions: [application-lineaire, base-vectorielle, supplementaire, somme-directe, groupe-lineaire]
  page_enonce: 7
  page_corrige: 14
  enonce: |
    Soit $u$ l'endomorphisme de $\mathbb{R}^{3}$ défini par $u(x, y, z) = (-\sqrt{2}\,x + z,\ \sqrt{2}\,y + z,\ x + y)$.

    **1.** Donner une base de $\mathrm{Ker}\, u$, de $\mathrm{Ker}\,(u - 2\,\mathrm{id})$ et de $\mathrm{Ker}\,(u + 2\,\mathrm{id})$.

    **2.** En déduire que $\mathbb{R}^{3} = \mathrm{Ker}\, u \oplus \mathrm{Ker}\,(u - 2\,\mathrm{id}) \oplus \mathrm{Ker}\,(u + 2\,\mathrm{id})$.

    **3.** Montrer que $F = \mathrm{Ker}\,(u - 2\,\mathrm{id}) \oplus \mathrm{Ker}\,(u + 2\,\mathrm{id})$ est stable par $u$, et que $u$ induit un automorphisme de $F$.
  corrige: |
    **1.** On résout $u(v) = \lambda v$ pour $\lambda = 0$, $2$, $-2$. Les calculs, que l'on vérifie en appliquant $u$, donnent 
    $$\boxed{\begin{array}{l} \mathrm{Ker}\, u = \mathbb{R}\big(1, -1, \sqrt{2}\big), \qquad \mathrm{Ker}\,(u - 2\,\mathrm{id}) = \mathbb{R}\big(2 - \sqrt{2}, 2 + \sqrt{2}, 2\big), \\[1mm] \mathrm{Ker}\,(u + 2\,\mathrm{id}) = \mathbb{R}\big(2 + \sqrt{2}, 2 - \sqrt{2}, -2\big) \end{array}}$$
     Par exemple, $u(2 - \sqrt{2}, 2 + \sqrt{2}, 2) = (4 - 2\sqrt{2}, 4 + 2\sqrt{2}, 4)$, qui est bien le double du vecteur.

    **2.** Notons $v_{0}$, $v_{2}$, $v_{-2}$ ces trois vecteurs. La résolution de $av_{0} + bv_{2} + cv_{-2} = w$ par la méthode du pivot donne une solution unique pour tout $w$ : $(v_{0}, v_{2}, v_{-2})$ est une base de $\mathbb{R}^{3}$, et la deuxième remarque suivant la proposition 14 du cours donne la somme directe. 
    $$\boxed{\mathbb{R}^{3} = \mathrm{Ker}\, u \oplus \mathrm{Ker}\,(u - 2\,\mathrm{id}) \oplus \mathrm{Ker}\,(u + 2\,\mathrm{id})}$$

    **3.** Si $y + z \in F$ avec $u(y) = 2y$ et $u(z) = -2z$, alors $u(y + z) = 2y - 2z \in F$. L'application $y + z \mapsto \frac{1}{2}y - \frac{1}{2}z$ est la réciproque de la restriction de $u$ à $F$. 
    $$\boxed{u_{|F} \in \mathrm{GL}(F), \qquad (u_{|F})^{-1}(y + z) = \frac{y - z}{2}}$$
- id: "ma-14-44"
  feuille: "f-ma-14"
  numero: 44
  partie: "Applications linéaires"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [applications linéaires, endomorphismes nilpotents, isomorphismes]
  noeuds: [v-applications]
  notions: [application-lineaire, groupe-lineaire]
  page_enonce: 7
  page_corrige: 14
  enonce: |
    **1.** Soit $f$, $g \in \mathcal{L}(E)$ tels que $f \circ g - g \circ f = f$. Montrer que $f^{n} \circ g - g \circ f^{n} = nf^{n}$ pour tout $n \in \mathbb{N}$.

    **2.** Soit $f \in \mathcal{L}(E)$ nilpotent, c'est-à-dire tel que $f^{n} = 0$ pour un $n \in \mathbb{N}^{*}$. Montrer que $\mathrm{id}_{E} - f$ est un automorphisme de $E$, et donner une expression de son inverse.
  corrige: |
    **1.** Par récurrence sur $n$, le cas $n = 0$ étant clair. Si l'égalité est vraie au rang $n$, 
    $$f^{n + 1}g - gf^{n + 1} = f(f^{n}g - gf^{n}) + (fg - gf)f^{n} = nf^{n + 1} + f^{n + 1}.$$

    $$\boxed{f^{n} \circ g - g \circ f^{n} = nf^{n}}$$

    **2.** Comme $\mathrm{id}_{E}$ et $f$ commutent, la factorisation de $a^{n} - b^{n}$ (chapitre 11) donne 
    $$(\mathrm{id}_{E} - f) \circ \sum_{k = 0}^{n - 1} f^{k} = \mathrm{id}_{E} - f^{n} = \mathrm{id}_{E},$$
     et de même dans l'autre ordre. 
    $$\boxed{(\mathrm{id}_{E} - f)^{-1} = \sum_{k = 0}^{n - 1} f^{k}}$$
