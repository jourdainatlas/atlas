  page_enonce: 14
  page_corrige: 27
  enonce: |
    *Moyennes glissantes.* Soit $F$ l'ensemble des suites réelles $u$ telles que 
    $$\forall n \in \mathbb{N}, \qquad u_{n + 3} = \frac{u_{n} + u_{n + 1} + u_{n + 2}}{3}.$$

    **1.** Montrer que $F$ est un sous-espace vectoriel de $\mathbb{R}^{\mathbb{N}}$ qui contient les suites constantes, et que l'application $u \mapsto (u_{0}, u_{1}, u_{2})$ est un isomorphisme de $F$ sur $\mathbb{R}^{3}$.

    **2.** Soit $u \in F$. Montrer que la suite $(u_{n} + 2u_{n + 1} + 3u_{n + 2})_{n \in \mathbb{N}}$ est constante. On note $\varphi(u)$ sa valeur : montrer que $\varphi$ est une forme linéaire non nulle sur $F$.

    **3.** Soit $C$ la droite des suites constantes et $H = \mathrm{Ker}\,\varphi$. Montrer que $F = H \oplus C$, et expliciter le projeté d'une suite $u \in F$ sur $C$ parallèlement à $H$.

    **4.** Montrer que toute suite de $H$ converge vers $0$.

    **5.** En déduire que toute suite $u \in F$ converge, et exprimer sa limite en fonction de $u_{0}$, $u_{1}$ et $u_{2}$. Quelle est la limite lorsque $(u_{0}, u_{1}, u_{2}) = (0, 0, 1)$ ?
  corrige: |
    **1.** L'ensemble $F$ est le noyau de l'application linéaire $u \mapsto (3u_{n + 3} - u_{n} - u_{n + 1} - u_{n + 2})_{n \in \mathbb{N}}$, donc un sous-espace de $\mathbb{R}^{\mathbb{N}}$ ; une suite constante égale à $k$ vérifie la relation, puisque $3k = k + k + k$. L'application $\Phi : u \mapsto (u_{0}, u_{1}, u_{2})$ est linéaire. Elle est injective : si $u_{0} = u_{1} = u_{2} = 0$, une récurrence forte donne $u_{n} = 0$ pour tout $n$. Elle est surjective : pour $(x, y, z) \in \mathbb{R}^{3}$, la suite définie par $u_{0} = x$, $u_{1} = y$, $u_{2} = z$ et la relation de récurrence appartient à $F$. 
    $$\boxed{F \text{ est un sous-espace de } \mathbb{R}^{\mathbb{N}}, \text{ et } \Phi \text{ est un isomorphisme de } F \text{ sur } \mathbb{R}^{3}.}$$

    **2.** Posons $w_{n} = u_{n} + 2u_{n + 1} + 3u_{n + 2}$. En remplaçant $3u_{n + 3}$ par $u_{n} + u_{n + 1} + u_{n + 2}$, on obtient 
    $$w_{n + 1} = u_{n + 1} + 2u_{n + 2} + (u_{n} + u_{n + 1} + u_{n + 2}) = u_{n} + 2u_{n + 1} + 3u_{n + 2} = w_{n}.$$
     La suite $(w_{n})$ est constante, et $\varphi(u) = w_{0} = u_{0} + 2u_{1} + 3u_{2}$, qui dépend linéairement de $u$. Pour la suite constante $\mathbf{1}$ égale à $1$, on trouve $\varphi(\mathbf{1}) = 6$. 
    $$\boxed{\varphi(u) = u_{0} + 2u_{1} + 3u_{2} \text{ est une forme linéaire non nulle sur } F.}$$

    **3.** L'hyperplan $H = \mathrm{Ker}\,\varphi$ ne contient pas $\mathbf{1}$, puisque $\varphi(\mathbf{1}) = 6 \neq 0$ ; le théorème 7 donne $F = H \oplus \mathbb{R}\mathbf{1}$, et sa démonstration fournit la décomposition 
    $$u = \Big(u - \frac{\varphi(u)}{6}\,\mathbf{1}\Big) + \frac{\varphi(u)}{6}\,\mathbf{1}.$$

    $$\boxed{F = H \oplus C, \text{ et le projeté de } u \text{ sur } C \text{ est la suite constante égale à } \frac{u_{0} + 2u_{1} + 3u_{2}}{6}.}$$

    **4.** Une suite $u \in H$ vérifie $u_{n} + 2u_{n + 1} + 3u_{n + 2} = \varphi(u) = 0$ pour tout $n$, c'est-à-dire 
    $$u_{n + 2} = -\frac{2}{3}\,u_{n + 1} - \frac{1}{3}\,u_{n}.$$
     C'est une récurrence linéaire d'ordre $2$, d'équation caractéristique $3r^{2} + 2r + 1 = 0$. Son discriminant vaut $-8$, et ses racines $\frac{-1 \pm \mathrm{i}\sqrt{2}}{3}$ sont conjuguées, de module $\rho = \frac{\sqrt{1 + 2}}{3} = \frac{1}{\sqrt{3}}$. Par le théorème 11 du chapitre 7, il existe $\theta$ et des réels $\lambda$, $\mu$ tels que $u_{n} = \rho^{n}\big(\lambda\cos(n\theta) + \mu\sin(n\theta)\big)$, d'où 
    $$|u_{n}| \leqslant \Big(\frac{1}{\sqrt{3}}\Big)^{n}\big(|\lambda| + |\mu|\big) \xrightarrow[n \to +\infty]{} 0.$$

    $$\boxed{\text{Toute suite de } H \text{ tend vers } 0.}$$

    **5.** Par la question 3, toute suite $u \in F$ s'écrit $u = \ell\,\mathbf{1} + h$, avec $\ell = \frac{\varphi(u)}{6}$ et $h \in H$ ; la question 4 donne $u_{n} = \ell + h_{n} \to \ell$. 
    $$\boxed{\lim_{n \to +\infty} u_{n} = \frac{u_{0} + 2u_{1} + 3u_{2}}{6}}$$
     Pour $(u_{0}, u_{1}, u_{2}) = (0, 0, 1)$, la limite vaut $\frac{3}{6} = \frac{1}{2}$, ce que confirme le calcul des termes.

    *Piège.* L'erreur la plus répandue est de penser que la limite est la moyenne $\frac{u_{0} + u_{1} + u_{2}}{3}$ des trois premiers termes, qui vaudrait ici $\frac{1}{3}$. Les termes récents pèsent davantage, avec les poids $1$, $2$, $3$.

    *À retenir.* Une quantité conservée par la récurrence est une forme linéaire $\varphi$ ; la limite, elle aussi linéaire en $u$, s'annule exactement sur $\mathrm{Ker}\,\varphi$, et la proposition 23 confirme qu'elle est proportionnelle à $\varphi$. Calculer la limite revient à projeter sur la droite des suites constantes parallèlement à $H$, comme l'exercice 65 projetait sur une droite parallèlement à un hyperplan. Pour $u_{n + 2} = \frac{u_{n} + u_{n + 1}}{2}$, le même raisonnement, avec la quantité conservée $u_{n} + 2u_{n + 1}$, donne la limite $\frac{u_{0} + 2u_{1}}{3}$.
