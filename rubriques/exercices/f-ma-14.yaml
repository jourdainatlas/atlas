- id: "ma-14-01"
  feuille: "f-ma-14"
  numero: 1
  partie: "Espaces vectoriels"
  etoiles: 1
  types: [Calcul]
  mots_cles: [espaces vectoriels, équations linéaires]
  noeuds: [v-espace, ed-lineaires]
  notions: [espace-vectoriel]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Les lois suivantes munissent-elles l'ensemble considéré d'une structure de $\mathbb{R}$-espace vectoriel ?

    **1.** Sur $\mathbb{R}^{2}$ : $(x, y) + (x', y') = (x + x', y + y')$ et $\lambda \cdot (x, y) = (\lambda x, 0)$.

    **2.** Sur $\mathbb{R}_{+}^{*} \times \mathbb{R}$ : $(x, y) + (x', y') = (xx', y + y')$ et $\lambda \cdot (x, y) = (x^{\lambda}, \lambda y)$.
  corrige: |
    **(i)** L'axiome $1 \cdot x = x$ est en défaut : $1 \cdot (0, 1) = (0, 0) \neq (0, 1)$. 
    $$\boxed{\text{Non : ce n'est pas un espace vectoriel.}}$$

    **(ii)** L'addition est une loi de groupe abélien sur $\mathbb{R}_{+}^{*} \times \mathbb{R}$, produit des groupes $(\mathbb{R}_{+}^{*}, \times)$ et $(\mathbb{R}, +)$ ; le neutre est $(1, 0)$ et l'opposé de $(x, y)$ est $(\frac{1}{x}, -y)$. Les quatre axiomes se vérifient grâce aux règles de calcul sur les puissances réelles (chapitre 5) : 
    $$(\lambda + \mu) \cdot (x, y) = (x^{\lambda}x^{\mu}, \lambda y + \mu y), \qquad \lambda \cdot \big((x, y) + (x', y')\big) = \big(x^{\lambda}x'^{\lambda}, \lambda y + \lambda y'\big),$$

    $$\lambda \cdot (\mu \cdot (x, y)) = \big((x^{\mu})^{\lambda}, \lambda\mu y\big) = (\lambda\mu) \cdot (x, y), \qquad 1 \cdot (x, y) = (x, y).$$

    $$\boxed{\text{Oui : c'est un } \mathbb{R}\text{-espace vectoriel.}}$$
     *À retenir.* L'application $(x, y) \mapsto (\ln x, y)$ transforme ces lois en les lois usuelles de $\mathbb{R}^{2}$ : c'est un isomorphisme, et l'on aurait pu tout transporter, comme dans l'exercice suivant.
- id: "ma-14-02"
  feuille: "f-ma-14"
  numero: 2
  partie: "Espaces vectoriels"
  etoiles: 2
  types: [Calcul]
  mots_cles: [espaces vectoriels]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $n \in \mathbb{N}^{*}$. Munir l'ensemble $]-1, 1[^{n}$ d'une structure de $\mathbb{R}$-espace vectoriel. On pourra transporter la structure de $\mathbb{R}^{n}$ à l'aide d'une bijection de $\mathbb{R}$ sur $]-1, 1[$.
  corrige: |
    Soit $\varphi : \mathbb{R} \to ]-1, 1[$ une bijection, par exemple $\varphi = \operatorname{th}$ (chapitre 5), ou $\varphi(x) = \frac{x}{1 + |x|}$. On note $\Phi(x_{1}, \dots, x_{n}) = \big(\varphi(x_{1}), \dots, \varphi(x_{n})\big)$, bijection de $\mathbb{R}^{n}$ sur $]-1, 1[^{n}$, et l'on pose, pour $a$, $b \in \,]-1, 1[^{n}$ et $\lambda \in \mathbb{R}$, 
    $$a \oplus b = \Phi\big(\Phi^{-1}(a) + \Phi^{-1}(b)\big), \qquad \lambda \odot a = \Phi\big(\lambda\,\Phi^{-1}(a)\big).$$
     Chaque axiome de $(]-1, 1[^{n}, \oplus, \odot)$ se déduit de l'axiome correspondant dans $\mathbb{R}^{n}$ en appliquant $\Phi$ ; par exemple 
    $$\lambda \odot (a \oplus b) = \Phi\big(\lambda\Phi^{-1}(a) + \lambda\Phi^{-1}(b)\big) = (\lambda \odot a) \oplus (\lambda \odot b).$$

    $$\boxed{\text{On transporte la structure de } \mathbb{R}^{n} \text{ par la bijection } \Phi ; \text{ le vecteur nul est } \Phi(0) = 0.}$$
     *À retenir.* Une structure d'espace vectoriel ne dépend pas de la nature des objets : toute bijection avec un espace vectoriel permet d'en construire une, et l'application $\Phi$ est alors un isomorphisme.
- id: "ma-14-03"
  feuille: "f-ma-14"
  numero: 3
  partie: "Espaces vectoriels"
  etoiles: 1
  types: [Calcul]
  mots_cles: [espaces vectoriels, sous-espace engendré, applications linéaires, espaces de polynômes, espaces de fonctions et de suites]
  noeuds: [v-espace, v-combinaisons, v-applications, pol-anneau]
  notions: [espace-vectoriel, combinaison-lineaire, application-lineaire]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Le vecteur $(3, 3, 1)$ de $\mathbb{R}^{3}$ est-il combinaison linéaire des vecteurs $(1, 2, 0)$ et $(2, 1, 0)$ ? des vecteurs $(1, 2, 0)$ et $(1, 1, 1)$ ?

    **2.** Pour quelles valeurs du réel $m$ le vecteur $(3, 1, m)$ est-il combinaison linéaire de $(1, 3, 2)$ et $(1, -1, 4)$ ?

    **3.** Le polynôme $16X^{3} - 7X^{2} + 21X - 4$ est-il combinaison linéaire de $8X^{3} - 5X^{2} + 1$ et de $X^{2} + 7X - 2$ ?

    **4.** La fonction $x \mapsto \cos(2x)$ est-elle combinaison linéaire des fonctions $\cos$ et $\sin$ ? et la fonction $x \mapsto \sin(2x)$ ?

    **5.** Quelles suites réelles sont combinaisons linéaires des suites $(1)_{n \in \mathbb{N}}$ et $\big((-1)^{n}\big)_{n \in \mathbb{N}}$ ?
  corrige: |
    **1.** Toute combinaison de $(1, 2, 0)$ et $(2, 1, 0)$ a une troisième coordonnée nulle : $(3, 3, 1)$ n'en est pas une. Avec $(1, 2, 0)$ et $(1, 1, 1)$, l'égalité $a(1, 2, 0) + b(1, 1, 1) = (3, 3, 1)$ impose $b = 1$ (troisième coordonnée), puis $a = 2$ (première), et la deuxième donne $5 \neq 3$. 
    $$\boxed{\text{Non dans les deux cas.}}$$

    **2.** Les deux premières coordonnées de $a(1, 3, 2) + b(1, -1, 4) = (3, 1, m)$ donnent $a + b = 3$ et $3a - b = 1$, d'où $a = 1$ et $b = 2$ ; la troisième impose alors $m = 2a + 4b$. 
    $$\boxed{m = 10, \text{ avec } (3, 1, 10) = (1, 3, 2) + 2(1, -1, 4)}$$

    **3.** Le coefficient de $X^{3}$ impose $a = 2$ dans $a(8X^{3} - 5X^{2} + 1) + b(X^{2} + 7X - 2)$, puis celui de $X$ impose $b = 3$, et l'on vérifie les deux autres coefficients. 
    $$\boxed{16X^{3} - 7X^{2} + 21X - 4 = 2(8X^{3} - 5X^{2} + 1) + 3(X^{2} + 7X - 2)}$$

    **4.** Si $\cos(2x) = a\cos x + b\sin x$ pour tout $x$, l'évaluation en $0$ et en $\pi$ donne $1 = a$ et $1 = -a$ : c'est impossible. Si $\sin(2x) = a\cos x + b\sin x$, l'évaluation en $0$ et en $\frac{\pi}{2}$ donne $a = b = 0$, et $\sin(2x)$ serait nulle. 
    $$\boxed{\text{Non dans les deux cas.}}$$

    **5.** Les combinaisons $\lambda + \mu(-1)^{n}$ sont $2$-périodiques ; réciproquement, une suite $2$-périodique $(u_{n})$ s'écrit ainsi avec $\lambda = \frac{u_{0} + u_{1}}{2}$ et $\mu = \frac{u_{0} - u_{1}}{2}$. 
    $$\boxed{\text{Ce sont exactement les suites } 2\text{-périodiques.}}$$
- id: "ma-14-04"
  feuille: "f-ma-14"
  numero: 4
  partie: "Espaces vectoriels"
  etoiles: 2
  types: [Calcul]
  mots_cles: [espaces vectoriels, sous-espace engendré, applications linéaires, espaces de fonctions et de suites]
  noeuds: [v-espace, v-combinaisons, v-applications, tg-arctan]
  notions: [espace-vectoriel, combinaison-lineaire, application-lineaire, arc-tangente, cosinus-sinus]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    La fonction $\operatorname{Arctan}$ est-elle, dans $\mathcal{F}(\mathbb{R}, \mathbb{R})$, combinaison linéaire des fonctions $x \mapsto \mathrm{e}^{x^{2}}$, $x \mapsto \mathrm{e}^{-x}$ et $\sin$ ?
  corrige: |
    Supposons $\operatorname{Arctan} x = a\,\mathrm{e}^{x^{2}} + b\,\mathrm{e}^{-x} + c\sin x$ pour tout réel $x$. En divisant par $\mathrm{e}^{x^{2}}$ et en faisant tendre $x$ vers $+\infty$, tous les termes tendent vers $0$ sauf $a$ : donc $a = 0$. En divisant ensuite par $\mathrm{e}^{-x}$ et en faisant tendre $x$ vers $-\infty$, on obtient $b = 0$, puisque $\operatorname{Arctan}$ et $\sin$ sont bornées. Il resterait $\operatorname{Arctan} = c\sin$, ce que dément l'évaluation en $\pi$ : $\operatorname{Arctan} \pi \neq 0 = c\sin\pi$. 
    $$\boxed{\text{Non.}}$$
     *À retenir.* Pour prouver qu'une fonction n'est pas combinaison de fonctions données, on compare les comportements à l'infini, du plus rapide au plus lent, comme pour la liberté des exponentielles dans le cours.
- id: "ma-14-05"
  feuille: "f-ma-14"
  numero: 5
  partie: "Sous-espaces vectoriels"
  etoiles: 1
  types: [Calcul]
  mots_cles: [sous-espaces vectoriels]
  noeuds: [v-espace]
  notions: [sous-espace-vectoriel]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Les parties suivantes de $\mathbb{R}^{2}$ ou de $\mathbb{R}^{3}$ en sont-elles des sous-espaces vectoriels ?

    **1.** $\{(x, y) \in \mathbb{R}^{2} \mid x = y\}$ ;

    **2.** $\{(x, y) \in \mathbb{R}_{+}^{2} \mid x = y\}$ ;

    **3.** $\{(x, y) \in \mathbb{R}^{2} \mid |x| = |y|\}$ ;

    **4.** $\{(x, y) \in \mathbb{R}^{2} \mid x \geqslant y\}$ ;

    **5.** $\{(x, y) \in \mathbb{R}^{2} \mid x^{2} + y^{2} = 1\}$ ;

    **6.** $\{(x, y) \in \mathbb{R}^{2} \mid x^{2} + y^{2} = 0\}$ ;

    **7.** $\{(x, y, z) \in \mathbb{R}^{3} \mid x + 2y - z + 1 = 0\}$ ;

    **8.** $\{(x, y, z) \in \mathbb{R}^{3} \mid x = 2y = 4z\}$ ;

    **9.** $\{(x, 2x, 3x) \mid x \in \mathbb{R}\}$ ;

    **10.** $\{(x, y, z) \in \mathbb{R}^{3} \mid xyz = 0\}$.
  corrige: |
    **(i)** Oui : c'est la droite $\mathbb{R}(1, 1)$. **(ii)** Non : $(1, 1)$ y est, mais pas $-(1, 1)$. **(iii)** Non : $(1, 1)$ et $(1, -1)$ y sont, mais pas leur somme $(2, 0)$. **(iv)** Non : $(1, 0)$ y est, mais pas $-(1, 0)$. **(v)** Non : il ne contient pas $(0, 0)$. **(vi)** Oui : c'est $\{(0, 0)\}$. **(vii)** Non : il ne contient pas $0$. **(viii)** Oui : c'est la droite $\mathbb{R}(4, 2, 1)$. **(ix)** Oui : c'est la droite $\mathbb{R}(1, 2, 3)$. **(x)** Non : $(1, 1, 0)$ et $(0, 0, 1)$ y sont, mais pas leur somme. 
    $$\boxed{\text{Sous-espaces : (i), (vi), (viii), (ix).}}$$
- id: "ma-14-06"
  feuille: "f-ma-14"
  numero: 6
  partie: "Sous-espaces vectoriels"
  etoiles: 1
  types: [Calcul]
  mots_cles: [sous-espaces vectoriels]
  noeuds: [v-espace]
  notions: [sous-espace-vectoriel]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $n \geqslant 2$. Les parties suivantes de $\mathbb{R}^{n}$ en sont-elles des sous-espaces vectoriels ?

    **1.** $\displaystyle \Big\{(x_{1}, \dots, x_{n}) \in \mathbb{R}^{n} \ \Big|\ \sum_{i = 1}^{n} x_{i} = 0\Big\}$ ;

    **2.** $\displaystyle \Big\{(x_{1}, \dots, x_{n}) \in \mathbb{R}^{n} \ \Big|\ \sum_{i = 1}^{n} x_{i} = 1\Big\}$ ;

    **3.** $\displaystyle \Big\{(x_{1}, \dots, x_{n}) \in \mathbb{R}^{n} \ \Big|\ \sum_{i = 1}^{n} 2^{i}x_{i} = 0\Big\}$ ;

    **4.** l'ensemble des $n$-uplets ayant au plus une coordonnée non nulle ;

    **5.** $\mathbb{Z}^{n}$.
  corrige: |
    Les parties (i) et (iii) sont les noyaux des formes linéaires $x \mapsto \sum x_{i}$ et $x \mapsto \sum 2^{i}x_{i}$ : ce sont des sous-espaces (des hyperplans). La partie (ii) ne contient pas $0$. La partie (iv) contient $e_{1}$ et $e_{2}$, mais pas $e_{1} + e_{2}$, puisque $n \geqslant 2$. La partie (v) contient $e_{1}$ mais pas $\frac{1}{2}e_{1}$. 
    $$\boxed{\text{Sous-espaces : (i) et (iii).}}$$
- id: "ma-14-07"
  feuille: "f-ma-14"
  numero: 7
  partie: "Sous-espaces vectoriels"
  etoiles: 2
  types: [Calcul]
  mots_cles: [sous-espaces vectoriels, espaces de fonctions et de suites]
  noeuds: [v-espace]
  notions: [sous-espace-vectoriel]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Les parties suivantes de $\mathbb{R}^{\mathbb{N}}$ en sont-elles des sous-espaces vectoriels ?

    $$\begin{array}{ll}  \text{(i) les suites croissantes ;} & \text{(vii) les suites stationnaires ;} \\  \text{(ii) les suites monotones ;} & \text{(viii) les suites }12\text{-périodiques ;} \\  \text{(iii) les suites bornées ;} & \text{(ix) les suites périodiques ;} \\  \text{(iv) les suites divergentes ;} & \text{(x) les suites arithmétiques ;} \\  \text{(v) les suites convergeant vers }0\text{ ;} & \text{(xi) les suites géométriques de raison }3\text{.} \\  \text{(vi) les suites convergeant vers }1\text{ ;} &  \end{array}$$
  corrige: |
    **(i)** Non : $(n)$ est croissante, $(-n)$ ne l'est pas. **(ii)** Non : $(n^{2})$ et $(-2n)$ sont monotones, leur somme $(n^{2} - 2n)$, qui vaut $0, -1, 0, 3, \dots$, ne l'est pas. **(iii)** Oui, par l'inégalité triangulaire. **(iv)** Non : la suite nulle converge. **(v)** Oui, par les opérations sur les limites (chapitre 7). **(vi)** Non : la suite nulle n'y est pas. **(vii)** Oui : si $u$ est constante à partir du rang $n_{1}$ et $v$ à partir du rang $n_{2}$, $\lambda u + v$ l'est à partir de $\max(n_{1}, n_{2})$. **(viii)** Oui. **(ix)** Oui : si $u$ est $p$-périodique et $v$ est $q$-périodique, $\lambda u + v$ est $pq$-périodique. **(x)** Oui : c'est $\mathrm{Vect}\big((1)_{n}, (n)_{n}\big)$. **(xi)** Oui : c'est la droite $\mathrm{Vect}\big((3^{n})_{n}\big)$, puisque $u_{n} = u_{0}3^{n}$. 
    $$\boxed{\text{Sous-espaces : (iii), (v), (vii), (viii), (ix), (x), (xi).}}$$
     *Piège.* Pour (ix), la période de $\lambda u + v$ n'est pas celle de $u$ : c'est un multiple commun des deux périodes.
- id: "ma-14-08"
  feuille: "f-ma-14"
  numero: 8
  partie: "Sous-espaces vectoriels"
  etoiles: 2
  types: [Calcul]
  mots_cles: [sous-espaces vectoriels, espaces de polynômes, espaces de fonctions et de suites]
  noeuds: [v-espace, pol-anneau]
  notions: [sous-espace-vectoriel]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Les parties suivantes de $\mathbb{R}[X]$ ou de $\mathcal{F}(\mathbb{R}, \mathbb{R})$ en sont-elles des sous-espaces vectoriels ? Le polynôme $P \in \mathbb{R}[X]$, l'entier $n$ et les réels $x_{0}$, $y_{0}$ sont fixés.

    **1.** L'ensemble des polynômes de degré $n$ ; l'ensemble des polynômes admettant $0$ et $1$ pour racines ; l'ensemble des polynômes admettant au moins deux racines.

    **2.** L'ensemble $\{PQ \mid Q \in \mathbb{R}[X]\}$ ; l'ensemble des diviseurs de $P$.

    **3.** L'ensemble des polynômes $P$ tels que $P(X + 2) = XP'(X - 4)$.

    **4.** L'ensemble des fonctions croissantes ; des fonctions monotones ; des fonctions qui s'écrivent comme la différence de deux fonctions croissantes.

    **5.** L'ensemble des fonctions dérivables $f$ telles que $f(0) + f(1) = f'(0)$ ; des fonctions $f$ telles que $f(x_{0}) = y_{0}$.

    **6.** L'ensemble $\{x \mapsto A\cos(x + \varphi) \mid A, \varphi \in \mathbb{R}\}$ ; l'ensemble des fonctions ne prenant qu'un nombre fini de valeurs.
  corrige: |
    **(i)** Les polynômes de degré $n$ ne forment pas un sous-espace, puisque $0$ n'en fait pas partie. Les polynômes qui s'annulent en $0$ et en $1$ forment le sous-espace $X(X - 1)\mathbb{R}[X]$, intersection des noyaux de deux évaluations. Les polynômes ayant au moins deux racines ne forment pas un sous-espace : $X^{2} - 1$ et $2 - X^{2}$ en ont deux, mais leur somme $1$ n'en a aucune.

    **(ii)** Les multiples de $P$ forment un sous-espace, image de $Q \mapsto PQ$. Les diviseurs de $P$ n'en forment pas si $P \neq 0$, car $0$ ne divise pas $P$ ; si $P = 0$, tout polynôme divise $P$, et l'on obtient $\mathbb{R}[X]$.

    **(iii)** C'est le noyau de l'application linéaire $P \mapsto P(X + 2) - XP'(X - 4)$, donc un sous-espace. Si $P$ est non nul de degré $d$ et de coefficient dominant $a$, les termes de degré $d$ donnent $a = da$, donc $d = 1$ ; avec $P = aX + b$, l'égalité $aX + 2a + b = aX$ donne $b = -2a$. 
    $$\boxed{\text{C'est la droite } \mathrm{Vect}(X - 2).}$$

    **(iv)** Les fonctions croissantes ne forment pas un sous-espace, ni les fonctions monotones : $x \mapsto x^{3}$ est croissante, $x \mapsto -x$ est décroissante, et leur somme ne l'est pas. Les différences de deux fonctions croissantes forment un sous-espace. Écrivons $f = f_{1} - f_{2}$ et $g = g_{1} - g_{2}$ avec $f_{1}$, $f_{2}$, $g_{1}$, $g_{2}$ croissantes. Pour $\lambda \geqslant 0$, 
    $$\lambda f + g = (\lambda f_{1} + g_{1}) - (\lambda f_{2} + g_{2}),$$
     et pour $\lambda < 0$, on échange les rôles de $f_{1}$ et $f_{2}$.

    **(v)** La condition $f(0) + f(1) = f'(0)$ définit le noyau d'une forme linéaire sur $\mathcal{D}(\mathbb{R}, \mathbb{R})$ : c'est un sous-espace. La condition $f(x_{0}) = y_{0}$ en définit un si et seulement si $y_{0} = 0$.

    **(vi)** Comme $A\cos(x + \varphi) = A\cos\varphi\cos x - A\sin\varphi\sin x$, et comme tout couple $(a, b)$ s'écrit $(A\cos\varphi, -A\sin\varphi)$ par passage en coordonnées polaires (chapitre 4), cet ensemble est $\mathrm{Vect}(\cos, \sin)$. Les fonctions ne prenant qu'un nombre fini de valeurs forment aussi un sous-espace : si $f$ prend $p$ valeurs et $g$ en prend $q$, $\lambda f + g$ en prend au plus $pq$. 
    $$\boxed{\begin{array}{l} \text{Sous-espaces : } X(X - 1)\mathbb{R}[X],\ P\,\mathbb{R}[X],\ \mathrm{Vect}(X - 2), \text{ les différences de fonctions croissantes,} \\ \text{la condition } f(0) + f(1) = f'(0),\ \text{la condition } f(x_{0}) = y_{0} \text{ si } y_{0} = 0, \text{ et les deux ensembles de (vi).} \end{array}}$$
- id: "ma-14-09"
  feuille: "f-ma-14"
  numero: 9
  partie: "Sous-espaces vectoriels"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [sous-espaces vectoriels]
  noeuds: [v-espace]
  notions: [sous-espace-vectoriel]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    On pose $a = (-1, 2, 1)$, $b = (0, 1, -1)$, $u = (1, 0, -3)$ et $v = (-2, 5, 1)$, quatre vecteurs de $\mathbb{R}^{3}$.

    **1.** Déterminer un vecteur $w \in \mathbb{R}^{3}$ n'appartenant pas à $\mathrm{Vect}(a, b)$.

    **2.** Montrer que $\mathrm{Vect}(a, b) = \mathrm{Vect}(u, v)$.

    **3.** Trouver trois réels $\alpha$, $\beta$, $\gamma$ non tous nuls tels que $\alpha x + \beta y + \gamma z = 0$ pour tout $(x, y, z) \in \mathrm{Vect}(a, b)$.

    **4.** Montrer que $\mathrm{Vect}(a, b) = \{(x, y, z) \in \mathbb{R}^{3} \mid \alpha x + \beta y + \gamma z = 0\}$.
  corrige: |
    **1.** Le vecteur $w = (1, 0, 0)$ convient : $\alpha a + \beta b = (-\alpha, 2\alpha + \beta, \alpha - \beta)$ est égal à $w$ seulement si $\alpha = -1$, $\beta = 2$ et $\alpha - \beta = 0$, ce qui est contradictoire.

    **2.** On résout : $u = -a + 2b$ et $v = 2a + b$, donc $\mathrm{Vect}(u, v) \subset \mathrm{Vect}(a, b)$ par le théorème 1. Réciproquement, ce système s'inverse en 
    $$a = \frac{-u + 2v}{5}, \qquad b = \frac{2u + v}{5},$$
     donc $\mathrm{Vect}(a, b) \subset \mathrm{Vect}(u, v)$. 
    $$\boxed{\mathrm{Vect}(a, b) = \mathrm{Vect}(u, v)}$$

    **3.** On cherche $(\alpha, \beta, \gamma)$ orthogonal à $a$ et à $b$ : $-\alpha + 2\beta + \gamma = 0$ et $\beta - \gamma = 0$, d'où $\beta = \gamma$ et $\alpha = 3\gamma$. 
    $$\boxed{(\alpha, \beta, \gamma) = (3, 1, 1) : \ 3x + y + z = 0 \text{ sur } \mathrm{Vect}(a, b)}$$

    **4.** On a $\mathrm{Vect}(a, b) \subset P$, où $P$ est le plan d'équation $3x + y + z = 0$. Réciproquement, si $(x, y, z) \in P$, alors $z = -3x - y$, et l'on cherche $\lambda a + \mu b = (-\lambda, 2\lambda + \mu, \lambda - \mu)$ égal à $(x, y, z)$ : $\lambda = -x$ et $\mu = y + 2x$ conviennent, la troisième coordonnée valant bien $-x - y - 2x = z$. 
    $$\boxed{\mathrm{Vect}(a, b) = \{(x, y, z) \in \mathbb{R}^{3} \mid 3x + y + z = 0\}}$$
- id: "ma-14-10"
  feuille: "f-ma-14"
  numero: 10
  partie: "Sous-espaces vectoriels"
  etoiles: 2
  types: [Algorithmique]
  mots_cles: [sous-espaces vectoriels, sous-espace engendré]
  noeuds: [v-espace, v-combinaisons]
  notions: [sous-espace-vectoriel, combinaison-lineaire]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Voici des sous-espaces vectoriels de $\mathbb{R}^{3}$, donnés soit comme sous-espaces engendrés, soit par une ou deux équations. Pour chacun, donner une description de l'autre type.

    $$\begin{array}{ll}  \text{(i) }\{(x, y, z) \mid x + 2y - z = 0\} & \text{(iv) }\mathrm{Vect}\big((1, 1, 1), (1, -1, 0)\big) \\  \text{(ii) }\{(x, y, z) \mid x + y + z = 2x + y - z = 0\} & \text{(v) }\mathrm{Vect}\big((1, 2, -1)\big) \\  \text{(iii) }\mathrm{Vect}\big((1, 2, -1), (2, 3, -3)\big) & \text{(vi) }\{(x, y, z) \mid x - 2z = x + 3y - 2z = 0\} \end{array}$$
  corrige: |
    Pour passer d'équations à une famille génératrice, on résout le système en fonction de paramètres ; pour passer d'une famille génératrice à des équations, on cherche les formes linéaires qui s'annulent sur les vecteurs donnés.

    **(i)** $z = x + 2y$, donc $(x, y, z) = x(1, 0, 1) + y(0, 1, 2)$ : $\boxed{\mathrm{Vect}\big((1, 0, 1), (0, 1, 2)\big)}$.

    **(ii)** En retranchant les équations, $x = 2z$, puis $y = -3z$ : $\boxed{\mathrm{Vect}\big((2, -3, 1)\big)}$.

    **(iii)** Une équation $\alpha x + \beta y + \gamma z = 0$ s'annule sur les deux vecteurs si $\alpha + 2\beta - \gamma = 0$ et $2\alpha + 3\beta - 3\gamma = 0$, d'où $(\alpha, \beta, \gamma)$ proportionnel à $(3, -1, 1)$ : $\boxed{3x - y + z = 0}$.

    **(iv)** De même, $(\alpha, \beta, \gamma)$ est proportionnel à $(1, 1, -2)$ : $\boxed{x + y - 2z = 0}$.

    **(v)** Pour une droite, il faut deux équations : $(x, y, z) = t(1, 2, -1)$ équivaut à $y = 2x$ et $z = -x$ : $\boxed{2x - y = 0 \text{ et } x + z = 0}$.

    **(vi)** La première équation donne $x = 2z$, la seconde $y = 0$ : $\boxed{\mathrm{Vect}\big((2, 0, 1)\big)}$.

    Dans chaque cas, on vérifie les deux inclusions comme dans l'exercice 9 : la famille trouvée vérifie les équations, et toute solution des équations est combinaison de la famille.
- id: "ma-14-11"
  feuille: "f-ma-14"
  numero: 11
  partie: "Sous-espaces vectoriels"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [sous-espaces vectoriels, espaces de fonctions et de suites]
  noeuds: [v-espace]
  notions: [sous-espace-vectoriel]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    **1.** Dans $\mathcal{F}([-1, 1], \mathbb{R})$, montrer que le sous-espace 
    $$\mathrm{Vect}\big(x \mapsto \cos(2x),\ \cos^{2},\ \sin^{2}\big)$$
     peut s'écrire $\mathrm{Vect}(f, g)$ pour deux fonctions $f$ et $g$ bien choisies.

    **2.** Soit $A$, $B$, $C$ trois parties de $E$. Comparer $\mathrm{Vect}(B \cup C)$ et $\mathrm{Vect}(B) + \mathrm{Vect}(C)$, puis $\mathrm{Vect}(A)$ et $\mathrm{Vect}(A \cup B) \cap \mathrm{Vect}(A \cup C)$.
  corrige: |
    **1.** Comme $\cos(2x) = \cos^{2}x - \sin^{2}x$, la proposition 6 permet de supprimer le premier vecteur. Avec $1 = \cos^{2} + \sin^{2}$, on peut aussi remplacer $(\cos^{2}, \sin^{2})$ par $(1, \cos(2\,\cdot))$, puisque $\cos^{2} = \frac{1 + \cos(2\,\cdot)}{2}$ et $\sin^{2} = \frac{1 - \cos(2\,\cdot)}{2}$. 
    $$\boxed{\mathrm{Vect}\big(\cos(2\,\cdot), \cos^{2}, \sin^{2}\big) = \mathrm{Vect}(\cos^{2}, \sin^{2}) = \mathrm{Vect}\big(1, \cos(2\,\cdot)\big)}$$

    **2.** Par la proposition 11 du cours, $\mathrm{Vect}(B) + \mathrm{Vect}(C)$ est le plus petit sous-espace contenant $\mathrm{Vect}(B)$ et $\mathrm{Vect}(C)$, donc contenant $B \cup C$. 
    $$\boxed{\mathrm{Vect}(B \cup C) = \mathrm{Vect}(B) + \mathrm{Vect}(C)}$$
     Ensuite, $\mathrm{Vect}(A)$ est contenu dans $\mathrm{Vect}(A \cup B)$ et dans $\mathrm{Vect}(A \cup C)$, donc dans leur intersection. L'inclusion peut être stricte : dans $\mathbb{R}^{2}$, avec $A = \varnothing$, $B = \{e_{1}\}$ et $C = \{2e_{1}\}$, l'intersection vaut $\mathbb{R} e_{1}$, alors que $\mathrm{Vect}(A) = \{0\}$. 
    $$\boxed{\mathrm{Vect}(A) \subset \mathrm{Vect}(A \cup B) \cap \mathrm{Vect}(A \cup C), \text{ inclusion stricte en général}}$$
- id: "ma-14-12"
  feuille: "f-ma-14"
  numero: 12
  partie: "Sous-espaces vectoriels"
  etoiles: 2
  types: [Calcul]
  mots_cles: [sous-espaces vectoriels, sous-espace engendré, espaces de polynômes, espaces de fonctions et de suites]
  noeuds: [v-espace, v-combinaisons, pol-anneau]
  notions: [sous-espace-vectoriel, combinaison-lineaire]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** Déterminer le sous-espace de $\mathcal{C}(\mathbb{R}, \mathbb{R})$ engendré par les fonctions positives.

    **2.** Déterminer le sous-espace de $\mathbb{R}[X]$ engendré par les polynômes $P$ tels que $P(x) \geqslant 0$ pour tout réel $x$.
  corrige: |
    **1.** Toute fonction continue $f$ s'écrit $f = f^{+} - f^{-}$, avec $f^{+} = \max(f, 0)$ et $f^{-} = \max(-f, 0)$, continues et positives. 
    $$\boxed{\mathrm{Vect}\{f \geqslant 0\} = \mathcal{C}(\mathbb{R}, \mathbb{R})}$$

    **2.** Tout polynôme $P$ s'écrit $P = \Big(\frac{P + 1}{2}\Big)^{2} - \Big(\frac{P - 1}{2}\Big)^{2}$, différence de deux polynômes positifs sur $\mathbb{R}$. 
    $$\boxed{\mathrm{Vect}\{P \geqslant 0 \text{ sur } \mathbb{R}\} = \mathbb{R}[X]}$$
- id: "ma-14-13"
  feuille: "f-ma-14"
  numero: 13
  partie: "Sous-espaces vectoriels"
  etoiles: 3
  types: [Calcul]
  mots_cles: [sous-espaces vectoriels]
  noeuds: [v-espace]
  notions: [sous-espace-vectoriel]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Soit $F$ un sous-espace vectoriel de $E$. Déterminer $\mathrm{Vect}(E \setminus F)$.
  corrige: |
    Si $F = E$, alors $E \setminus F = \varnothing$ et $\mathrm{Vect}(\varnothing) = \{0\}$. Supposons $F \neq E$ et choisissons $a \in E \setminus F$. Le sous-espace $\mathrm{Vect}(E \setminus F)$ contient $E \setminus F$. Il contient aussi $F$ : si $x \in F$, alors $x + a \notin F$, sinon $a = (x + a) - x$ appartiendrait à $F$, de sorte que $x = (x + a) - a$ est différence de deux éléments de $E \setminus F$. 
    $$\boxed{\mathrm{Vect}(E \setminus F) = E \text{ si } F \neq E, \qquad \mathrm{Vect}(E \setminus F) = \{0\} \text{ si } F = E}$$
     *À retenir.* Le complémentaire d'un sous-espace strict est « gros » : il engendre tout l'espace, ce qui confirme qu'on ne le confond pas avec un supplémentaire.
- id: "ma-14-14"
  feuille: "f-ma-14"
  numero: 14
  partie: "Familles de vecteurs"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [familles de vecteurs, sous-espaces vectoriels, bases]
  noeuds: [v-libre, v-espace]
  notions: [famille-libre, sous-espace-vectoriel, base-vectorielle]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** Montrer que $\big((-1, 1, 1), (1, -1, 1), (1, 1, -1)\big)$ est une base de $\mathbb{R}^{3}$ et déterminer les coordonnées de $(3, 7, -2)$ dans cette base.

    **2.** On pose $F = \mathrm{Vect}\big((1, -1, 1), (0, -1, 2), (1, -2, 3)\big)$. En donner une base, puis montrer que 
    $$F = \{(x, y, z) \in \mathbb{K}^{3} \mid x + 2y + z = 0\}.$$

    **3.** Donner une base de chacun des sous-espaces 
    $$\{(x, y, z) \in \mathbb{C}^{3} \mid x - y + 2z = 0\} \qquad\text{et}\qquad \{(x, y, z, t) \in \mathbb{R}^{4} \mid 3x - 2y + z - 2t = 0 \text{ et } 2x + y = 0\}.$$
  corrige: |
    **1.** Notons $e_{1}' = (-1, 1, 1)$, $e_{2}' = (1, -1, 1)$, $e_{3}' = (1, 1, -1)$. L'équation $ae_{1}' + be_{2}' + ce_{3}' = (x, y, z)$ s'écrit $-a + b + c = x$, $a - b + c = y$, $a + b - c = z$. En ajoutant deux à deux, $2c = x + y$, $2a = y + z$, $2b = x + z$ : la solution existe et est unique pour tout $(x, y, z)$, donc la famille est une base par le théorème 2. Pour $(3, 7, -2)$ : 
    $$\boxed{(3, 7, -2) = \frac{5}{2}e_{1}' + \frac{1}{2}e_{2}' + 5e_{3}'}$$

    **2.** Le troisième vecteur est la somme des deux premiers ; ceux-ci ne sont pas colinéaires, donc forment une famille libre, qui engendre $F$ par la proposition 6. Les trois vecteurs vérifient $x + 2y + z = 0$, donc $F$ est contenu dans le plan $P$ de cette équation. Réciproquement, si $(x, y, z) \in P$, on a 
    $$(x, y, z) = a(1, -1, 1) + b(0, -1, 2) \qquad\text{avec } a = x \text{ et } b = -x - y,$$
     la troisième coordonnée valant $a + 2b = -x - 2y = z$. 
    $$\boxed{\text{Base de } F : \big((1, -1, 1), (0, -1, 2)\big), \qquad F = \{x + 2y + z = 0\}}$$

    **3.** Dans le premier cas, $x = y - 2z$, donc $(x, y, z) = y(1, 1, 0) + z(-2, 0, 1)$. Dans le second, $y = -2x$ et $z = 2t - 7x$, donc $(x, y, z, t) = x(1, -2, -7, 0) + t(0, 0, 2, 1)$. Les familles obtenues sont génératrices, et libres, puisque les paramètres se lisent sur des coordonnées. 
    $$\boxed{\big((1, 1, 0), (-2, 0, 1)\big) \qquad\text{et}\qquad \big((1, -2, -7, 0), (0, 0, 2, 1)\big)}$$
- id: "ma-14-15"
  feuille: "f-ma-14"
  numero: 15
  partie: "Familles de vecteurs"
  etoiles: 1
  types: [Calcul]
  mots_cles: [familles de vecteurs, familles libres]
  noeuds: [v-libre]
  notions: [famille-libre]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **1.** Les familles $\big((1, 2, 3), (-1, 4, 6)\big)$ et $\big((1, 2, -1), (1, 0, 1), (-1, 2, -3)\big)$ de $\mathbb{R}^{3}$ sont-elles libres ?

    **2.** Soit $v_{1} = (1, 1, 0)$, $v_{2} = (4, 1, 4)$ et $v_{3} = (2, -1, 4)$. Vérifier que les familles $(v_{1}, v_{2})$, $(v_{1}, v_{3})$ et $(v_{2}, v_{3})$ sont libres, mais que $(v_{1}, v_{2}, v_{3})$ est liée.

    **3.** Soit $(e_{1}, e_{2}, e_{3}, e_{4})$ une famille libre de $E$. Les familles $(e_{1}, 2e_{2}, e_{3})$, $(e_{1}, 2e_{1} + e_{4}, e_{3} + e_{4})$ et $(2e_{1} + e_{2}, e_{1} - 2e_{2}, e_{4}, 7e_{1} - 4e_{2})$ sont-elles libres ?
  corrige: |
    **1.** Les vecteurs $(1, 2, 3)$ et $(-1, 4, 6)$ ne sont pas colinéaires : la première famille est libre. La seconde est liée, puisque $-(1, 2, -1) + 2(1, 0, 1) + (-1, 2, -3) = 0$.

    **2.** Deux vecteurs non colinéaires forment une famille libre, ce que l'on vérifie sur les coordonnées. Mais $v_{3} = v_{2} - 2v_{1}$ : la famille des trois est liée. 
    $$\boxed{v_{3} = v_{2} - 2v_{1}}$$

    **3.** La famille $(e_{1}, 2e_{2}, e_{3})$ est libre, comme sous-famille d'une famille libre, à un facteur non nul près. Pour la deuxième, $ae_{1} + b(2e_{1} + e_{4}) + c(e_{3} + e_{4}) = (a + 2b)e_{1} + ce_{3} + (b + c)e_{4}$, et la liberté de $(e_{1}, e_{3}, e_{4})$ donne $c = 0$, $b = 0$, $a = 0$ : elle est libre. La troisième est liée, car $7e_{1} - 4e_{2} = 2(2e_{1} + e_{2}) + 3(e_{1} - 2e_{2})$. 
    $$\boxed{\text{libre, libre, liée}}$$
     *Piège.* La question 2 montre que la liberté de toutes les sous-familles de deux vecteurs n'entraîne pas celle de la famille entière.
- id: "ma-14-16"
  feuille: "f-ma-14"
  numero: 16
  partie: "Familles de vecteurs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [familles de vecteurs, familles libres]
  noeuds: [v-libre]
  notions: [famille-libre]
  page_enonce: 4
  page_corrige: 6
  enonce: |
    Soit $n \geqslant 2$ et $(e_{1}, \dots, e_{n})$ une famille libre de $E$.

    **1.** Montrer que la famille $(e_{1} + e_{2}, e_{2} + e_{3}, \dots, e_{n - 1} + e_{n})$ est libre.

    **2.** Pour $k \in [\![1\,;n]\!]$, on pose $v_{k} = e_{1} + \cdots + e_{k}$. Montrer que la famille $(v_{1}, \dots, v_{n})$ est libre, et que 
    $$\mathrm{Vect}(v_{1}, \dots, v_{n}) = \mathrm{Vect}(e_{1}, \dots, e_{n}).$$
  corrige: |
    **1.** Si $\sum_{k = 1}^{n - 1} a_{k}(e_{k} + e_{k + 1}) = 0$, on regroupe selon les $e_{k}$ : 
    $$a_{1}e_{1} + \sum_{k = 2}^{n - 1} (a_{k - 1} + a_{k})e_{k} + a_{n - 1}e_{n} = 0.$$
     La liberté donne $a_{1} = 0$, puis $a_{k} = -a_{k - 1} = 0$ de proche en proche. 
    $$\boxed{(e_{1} + e_{2}, \dots, e_{n - 1} + e_{n}) \text{ est libre.}}$$

    **2.** On a $e_{1} = v_{1}$ et $e_{k} = v_{k} - v_{k - 1}$ pour $k \geqslant 2$ : chaque famille est formée de combinaisons de l'autre, d'où l'égalité des sous-espaces engendrés. Si $\sum \mu_{k}v_{k} = 0$, alors $\sum_{j} \big(\sum_{k \geqslant j} \mu_{k}\big)e_{j} = 0$, donc toutes les sommes $\mu_{j} + \cdots + \mu_{n}$ sont nulles ; leurs différences successives donnent $\mu_{n} = \mu_{n - 1} = \cdots = \mu_{1} = 0$. 
    $$\boxed{(v_{1}, \dots, v_{n}) \text{ est libre et } \mathrm{Vect}(v_{k}) = \mathrm{Vect}(e_{k})}$$
- id: "ma-14-17"
  feuille: "f-ma-14"
  numero: 17
  partie: "Familles de vecteurs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [familles de vecteurs, familles libres]
  noeuds: [v-libre]
  notions: [famille-libre]
  page_enonce: 4
  page_corrige: 6
  enonce: |
    Soit $(e_{1}, \dots, e_{n})$ une famille libre de $E$ et $(\lambda_{1}, \dots, \lambda_{n}) \in \mathbb{K}^{n}$. On pose $\displaystyle u = \sum_{k = 1}^{n} \lambda_{k}e_{k}$ et, pour $i \in [\![1\,;n]\!]$, $v_{i} = u + e_{i}$. Montrer que la famille $(v_{1}, \dots, v_{n})$ est liée si et seulement si $\displaystyle \sum_{k = 1}^{n} \lambda_{k} = -1$.
  corrige: |
    Soit $\mu_{1}, \dots, \mu_{n}$ des scalaires et $S = \sum \mu_{i}$. Alors 
    $$\sum_{i = 1}^{n} \mu_{i}v_{i} = Su + \sum_{i = 1}^{n} \mu_{i}e_{i} = \sum_{k = 1}^{n} (S\lambda_{k} + \mu_{k})e_{k},$$
     qui est nul si et seulement si $\mu_{k} = -S\lambda_{k}$ pour tout $k$. En sommant ces égalités, $S = -S\sum\lambda_{k}$, soit $S\big(1 + \sum\lambda_{k}\big) = 0$.

    Si $\sum\lambda_{k} \neq -1$, cela impose $S = 0$, puis $\mu_{k} = 0$ pour tout $k$ : la famille est libre. Si $\sum\lambda_{k} = -1$, les scalaires $\mu_{k} = -\lambda_{k}$, non tous nuls, vérifient $S = 1$ et $\mu_{k} = -S\lambda_{k}$ : ils fournissent une relation de dépendance. 
    $$\boxed{(v_{1}, \dots, v_{n}) \text{ liée} \iff \sum_{k = 1}^{n} \lambda_{k} = -1}$$
- id: "ma-14-18"
  feuille: "f-ma-14"
  numero: 18
  partie: "Familles de vecteurs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [familles de vecteurs, familles libres, applications linéaires, espaces de fonctions et de suites]
  noeuds: [v-libre, v-applications, v-espace]
  notions: [famille-libre, application-lineaire]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    **1.** Montrer que les suites $(1)_{n \in \mathbb{N}}$, $(n^{2})_{n \in \mathbb{N}}$ et $(2^{n})_{n \in \mathbb{N}}$ sont linéairement indépendantes dans $\mathbb{R}^{\mathbb{N}}$.

    **2.** Montrer que les fonctions $\cos$, $\sin$ et $\exp$ sont linéairement indépendantes dans $\mathcal{F}(\mathbb{R}, \mathbb{R})$.

    **3.** Montrer que la famille $(\sin^{n})_{n \geqslant 1}$ est libre dans $\mathcal{F}(\mathbb{R}, \mathbb{R})$.
  corrige: |
    **1.** Si $\lambda + \mu n^{2} + \nu 2^{n} = 0$ pour tout $n$, on divise par $2^{n}$ et l'on fait tendre $n$ vers $+\infty$ : $\nu = 0$, par croissance comparée. Il reste $\lambda + \mu n^{2} = 0$, et les valeurs $n = 0$ et $n = 1$ donnent $\lambda = \mu = 0$.

    **2.** Si $a\cos + b\sin + c\exp = 0$, on divise par $\mathrm{e}^{x}$ et l'on fait tendre $x$ vers $+\infty$ : $c = 0$, puisque $\cos$ et $\sin$ sont bornées. La famille $(\cos, \sin)$ étant libre (exemple du cours), $a = b = 0$.

    **3.** Si $\sum_{k = 1}^{n} \lambda_{k}\sin^{k} = 0$, le polynôme $\sum \lambda_{k}T^{k}$ s'annule en tout point de $[-1, 1] = \sin(\mathbb{R})$ ; il a une infinité de racines, donc il est nul (chapitre 13, théorème 3), et tous les $\lambda_{k}$ sont nuls. 
    $$\boxed{\text{Les trois familles sont libres.}}$$
- id: "ma-14-19"
  feuille: "f-ma-14"
  numero: 19
  partie: "Familles de vecteurs"
  etoiles: 2
  types: [Calcul]
  mots_cles: [familles de vecteurs, bases]
  noeuds: [v-libre]
  notions: [famille-libre, base-vectorielle]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Déterminer si les familles suivantes sont des bases de $\mathbb{K}_{2}[X]$ et, le cas échéant, donner les coordonnées de $X^{2} + X + 1$ dans cette base.

    (i) $\big(1, X - 1, (X - 1)^{2}\big)$ ; (ii) $(X^{2} + X, X^{2} + 1, X + 1)$ ; (iii) $\big((X - 1)^{2}, X^{2}, (X + 1)^{2}\big)$.
  corrige: |
    **(i)** C'est une base, à degrés échelonnés (proposition 10). La formule de Taylor en $1$ donne les coordonnées : $P(1) = 3$, $P'(1) = 3$, $\frac{P''(1)}{2} = 1$. 
    $$\boxed{X^{2} + X + 1 = 3 + 3(X - 1) + (X - 1)^{2}}$$

    **(ii)** L'équation $a(X^{2} + X) + b(X^{2} + 1) + c(X + 1) = \alpha X^{2} + \beta X + \gamma$ s'écrit $a + b = \alpha$, $a + c = \beta$, $b + c = \gamma$. Ce système a une unique solution pour tout second membre, avec $a = \frac{\alpha + \beta - \gamma}{2}$, $b = \frac{\alpha - \beta + \gamma}{2}$, $c = \frac{-\alpha + \beta + \gamma}{2}$ : c'est une base par le théorème 2. 
    $$\boxed{X^{2} + X + 1 = \frac{1}{2}(X^{2} + X) + \frac{1}{2}(X^{2} + 1) + \frac{1}{2}(X + 1)}$$

    **(iii)** L'équation $a(X - 1)^{2} + bX^{2} + c(X + 1)^{2} = \alpha X^{2} + \beta X + \gamma$ s'écrit $a + b + c = \alpha$, $2(c - a) = \beta$, $a + c = \gamma$, d'où $b = \alpha - \gamma$, $a = \frac{2\gamma - \beta}{4}$, $c = \frac{2\gamma + \beta}{4}$ : solution unique, c'est une base. 
    $$\boxed{X^{2} + X + 1 = \frac{1}{4}(X - 1)^{2} + \frac{3}{4}(X + 1)^{2}}$$
- id: "ma-14-20"
  feuille: "f-ma-14"
  numero: 20
  partie: "Familles de vecteurs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [familles de vecteurs, bases]
  noeuds: [v-libre]
  notions: [famille-libre, base-vectorielle]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Soit $n \in \mathbb{N}$. Pour $k \in [\![0\,;n]\!]$, on pose $P_{k} = (X + 1)^{k + 1} - X^{k + 1}$. Montrer que $(P_{0}, \dots, P_{n})$ est une base de $\mathbb{K}_{n}[X]$.
  corrige: |
    Par la formule du binôme, $P_{k} = \sum_{j = 0}^{k} \binom{k + 1}{j}X^{j}$ : le terme $X^{k + 1}$ disparaît, et le coefficient de $X^{k}$ vaut $k + 1 \neq 0$. Donc $\deg P_{k} = k$ pour tout $k \in [\![0\,;n]\!]$. 
    $$\boxed{(P_{0}, \dots, P_{n}) \text{ est une base de } \mathbb{K}_{n}[X] \text{ (proposition 10).}}$$
- id: "ma-14-21"
  feuille: "f-ma-14"
  numero: 21
  partie: "Familles de vecteurs"
  etoiles: 2
  types: [Calcul]
  mots_cles: [familles de vecteurs, familles libres, espaces de fonctions et de suites]
  noeuds: [v-libre, v-espace]
  notions: [famille-libre]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Construire une famille libre infinie de $\mathbb{R}^{\mathbb{N}}$ dont aucun élément n'est une suite nulle à partir d'un certain rang.
  corrige: |
    La famille des suites $u^{(k)} = (n^{k})_{n \in \mathbb{N}}$, $k \in \mathbb{N}$, convient : aucune n'est nulle à partir d'un certain rang. Si une sous-famille finie vérifie $\sum_{k = 0}^{d} \lambda_{k}n^{k} = 0$ pour tout $n$, le polynôme $\sum \lambda_{k}X^{k}$ a une infinité de racines, donc il est nul. 
    $$\boxed{\big((n^{k})_{n \in \mathbb{N}}\big)_{k \in \mathbb{N}} \text{ est libre.}}$$
     Les suites géométriques $(a^{n})_{n}$, $a > 0$, conviennent aussi, par le même argument que les exponentielles du cours.
