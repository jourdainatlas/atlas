  page_corrige: 18
  enonce: |
    Soit $f$, $g \in \mathcal{L}(E)$.

    **1.** On suppose que $g$ est un projecteur et que $\mathrm{Ker}\, g$ et $\operatorname{Im} g$ sont stables par $f$. Montrer que $f$ et $g$ commutent.

    **2.** Donner un contre-exemple lorsque $g$ n'est pas un projecteur.
  corrige: |
    **1.** Par le théorème 5, tout $x$ s'écrit $x = y + z$ avec $y \in \operatorname{Im} g$, $g(y) = y$, et $z \in \mathrm{Ker}\, g$. Par stabilité, $f(y) \in \operatorname{Im} g$ et $f(z) \in \mathrm{Ker}\, g$, donc 
    $$g(f(x)) = g(f(y)) + g(f(z)) = f(y) + 0 = f(g(x)).$$

    $$\boxed{f \circ g = g \circ f}$$

    **2.** Si $g$ est un automorphisme, $\mathrm{Ker}\, g = \{0\}$ et $\operatorname{Im} g = E$ sont stables par tout endomorphisme. Avec $g(x, y) = (y, x)$ et $f(x, y) = (x, 0)$, l'exemple du cours montre que $f$ et $g$ ne commutent pas.
- id: "ma-14-60"
  feuille: "f-ma-14"
  numero: 60
  partie: "Endomorphismes, projecteurs et symétries"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [projecteurs et symétries, sous-espaces vectoriels, sommes directes, projecteurs, isomorphismes]
  noeuds: [v-somme-directe, v-applications, v-espace]
  notions: [projecteur, sous-espace-vectoriel, supplementaire, somme-directe, groupe-lineaire]
  page_enonce: 10
  page_corrige: 18
  enonce: |
    Soit $E$ un $\mathbb{C}$-espace vectoriel et $f \in \mathcal{L}(E)$ tel que $f^{2} = -\mathrm{id}_{E}$.

    **1.** Montrer que $f$ est un automorphisme de $E$.

    **2.** On pose $F = \{x \in E \mid f(x) = \mathrm{i} x\}$ et $G = \{x \in E \mid f(x) = -\mathrm{i} x\}$. Montrer que $F$ et $G$ sont des sous-espaces supplémentaires de $E$.

    **3.** Soit $p$ le projecteur sur $F$ parallèlement à $G$, et $q = \mathrm{id}_{E} - p$. Montrer que $f = \mathrm{i}(p - q)$.
  corrige: |
    **1.** On a $f \circ (-f) = (-f) \circ f = \mathrm{id}_{E}$. 
    $$\boxed{f \in \mathrm{GL}(E), \qquad f^{-1} = -f}$$

    **2.** Les ensembles $F = \mathrm{Ker}\,(f - \mathrm{i}\,\mathrm{id})$ et $G = \mathrm{Ker}\,(f + \mathrm{i}\,\mathrm{id})$ sont des sous-espaces. Si $x \in F \cap G$, alors $\mathrm{i} x = -\mathrm{i} x$, donc $x = 0$. Pour $x \in E$, on pose 
    $$y = \frac{x - \mathrm{i} f(x)}{2}, \qquad z = \frac{x + \mathrm{i} f(x)}{2} ;$$
     alors $y + z = x$, $f(y) = \frac{f(x) + \mathrm{i} x}{2} = \mathrm{i} y$ et $f(z) = \frac{f(x) - \mathrm{i} x}{2} = -\mathrm{i} z$. 
    $$\boxed{E = F \oplus G}$$

    **3.** Le calcul précédent donne $p = \frac{1}{2}(\mathrm{id} - \mathrm{i} f)$ et $q = \frac{1}{2}(\mathrm{id} + \mathrm{i} f)$, donc $p - q = -\mathrm{i} f$. 
    $$\boxed{f = \mathrm{i}(p - q)}$$
     C'est le cas $(\alpha, \beta) = (\mathrm{i}, -\mathrm{i})$ de l'exercice 62. L'hypothèse que $E$ est un $\mathbb{C}$-espace vectoriel est essentielle : la rotation $(x, y) \mapsto (-y, x)$ de $\mathbb{R}^{2}$ vérifie aussi $f^{2} = -\mathrm{id}$, mais $\mathrm{i} x$ n'a pas de sens dans $\mathbb{R}^{2}$.
- id: "ma-14-61"
  feuille: "f-ma-14"
  numero: 61
  partie: "Endomorphismes, projecteurs et symétries"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [projecteurs et symétries, bases, projecteurs]
  noeuds: [v-somme-directe, v-applications, v-libre]
  notions: [projecteur, base-vectorielle]
  page_enonce: 10
  page_corrige: 18
  enonce: |
    Soit $(e_{1}, \dots, e_{n})$ une base de $E$. Pour $i \in [\![1\,;n]\!]$, on note $p_{i}$ le projecteur sur $\mathrm{Vect}(e_{i})$ parallèlement à $\mathrm{Vect}(e_{j})_{j \neq i}$. Montrer que $p_{i} \circ p_{j} = 0$ si $i \neq j$, que $p_{i} \circ p_{i} = p_{i}$, et que $p_{1} + \cdots + p_{n} = \mathrm{id}_{E}$. Relier $p_{i}$ à la $i$-ième forme coordonnée.
  corrige: |
    Pour $x = \sum_{k} e_{k}^{*}(x)e_{k}$, la décomposition de $x$ selon $\mathrm{Vect}(e_{i}) \oplus \mathrm{Vect}(e_{j})_{j \neq i}$ est $e_{i}^{*}(x)e_{i} + \sum_{j \neq i} e_{j}^{*}(x)e_{j}$, donc $p_{i}(x) = e_{i}^{*}(x)e_{i}$. Par conséquent 
    $$p_{i}(p_{j}(x)) = e_{j}^{*}(x)\,e_{i}^{*}(e_{j})\,e_{i} = \begin{cases} p_{i}(x) & \text{si } i = j, \\ 0 & \text{si } i \neq j, \end{cases} \qquad \sum_{i = 1}^{n} p_{i}(x) = \sum_{i = 1}^{n} e_{i}^{*}(x)e_{i} = x.$$

    $$\boxed{p_{i} = e_{i}^{*}(\cdot)\,e_{i}, \qquad p_{i}p_{j} = 0 \ (i \neq j), \qquad p_{i}^{2} = p_{i}, \qquad p_{1} + \cdots + p_{n} = \mathrm{id}_{E}}$$
- id: "ma-14-62"
  feuille: "f-ma-14"
  numero: 62
  partie: "Endomorphismes, projecteurs et symétries"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [projecteurs et symétries, sommes directes, noyau et image]
  noeuds: [v-somme-directe, v-applications]
  notions: [projecteur, supplementaire, somme-directe, noyau]
  page_enonce: 10
  page_corrige: 19
  enonce: |
    *Lemme des noyaux, cas quadratique.* Soit $\alpha \neq \beta$ deux scalaires et $f \in \mathcal{L}(E)$ tel que 
    $$(f - \alpha\,\mathrm{id}_{E}) \circ (f - \beta\,\mathrm{id}_{E}) = 0.$$

    **1.** Déterminer deux scalaires $a$ et $b$ tels que $a(f - \alpha\,\mathrm{id}_{E}) + b(f - \beta\,\mathrm{id}_{E}) = \mathrm{id}_{E}$.

    **2.** En déduire que $E = \operatorname{Im}(f - \alpha\,\mathrm{id}_{E}) + \operatorname{Im}(f - \beta\,\mathrm{id}_{E})$.

    **3.** Montrer que $\operatorname{Im}(f - \beta\,\mathrm{id}_{E}) \subset \mathrm{Ker}\,(f - \alpha\,\mathrm{id}_{E})$ et que $\operatorname{Im}(f - \alpha\,\mathrm{id}_{E}) \subset \mathrm{Ker}\,(f - \beta\,\mathrm{id}_{E})$.

    **4.** En déduire que $E = \mathrm{Ker}\,(f - \alpha\,\mathrm{id}_{E}) \oplus \mathrm{Ker}\,(f - \beta\,\mathrm{id}_{E})$. Que retrouve-t-on pour $(\alpha, \beta) = (0, 1)$ et pour $(\alpha, \beta) = (1, -1)$ ?
  corrige: |
    **1.** On veut $(a + b)f - (a\alpha + b\beta)\mathrm{id} = \mathrm{id}$, soit $a + b = 0$ et $a\alpha + b\beta = -1$ : $a = \frac{1}{\beta - \alpha}$, $b = \frac{1}{\alpha - \beta}$. 
    $$\boxed{\frac{1}{\beta - \alpha}(f - \alpha\,\mathrm{id}) - \frac{1}{\beta - \alpha}(f - \beta\,\mathrm{id}) = \mathrm{id}_{E}}$$

    **2.** Tout $x$ s'écrit $x = (f - \alpha\,\mathrm{id})(ax) + (f - \beta\,\mathrm{id})(bx)$.

    **3.** Les endomorphismes $f - \alpha\,\mathrm{id}$ et $f - \beta\,\mathrm{id}$ commutent, et leur composée est nulle dans les deux ordres : pour tout $x$, 
    $$(f - \alpha\,\mathrm{id})\big((f - \beta\,\mathrm{id})(x)\big) = 0 \qquad\text{et}\qquad (f - \beta\,\mathrm{id})\big((f - \alpha\,\mathrm{id})(x)\big) = 0,$$
     ce qui donne les deux inclusions (exercice 45).

    **4.** Les questions 2 et 3 donnent $E = \mathrm{Ker}\,(f - \alpha\,\mathrm{id}) + \mathrm{Ker}\,(f - \beta\,\mathrm{id})$. Si $x$ est dans l'intersection, $\alpha x = f(x) = \beta x$, donc $x = 0$. 
    $$\boxed{E = \mathrm{Ker}\,(f - \alpha\,\mathrm{id}) \oplus \mathrm{Ker}\,(f - \beta\,\mathrm{id})}$$
     Pour $(\alpha, \beta) = (0, 1)$, l'hypothèse est $f^{2} = f$ et l'on retrouve le théorème 5 : $E = \mathrm{Ker}\, f \oplus \mathrm{Ker}\,(f - \mathrm{id})$. Pour $(\alpha, \beta) = (1, -1)$, c'est $f^{2} = \mathrm{id}$ et le théorème 6. Le chapitre consacré à la réduction, en seconde année, généralisera ce lemme à tout polynôme scindé à racines simples.
- id: "ma-14-63"
  feuille: "f-ma-14"
  numero: 63
  partie: "Endomorphismes, projecteurs et symétries"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [projecteurs et symétries, sommes directes, projecteurs]
  noeuds: [v-somme-directe, v-applications]
  notions: [projecteur, supplementaire, somme-directe]
  page_enonce: 10
  page_corrige: 19
  enonce: |
    Soit $p$ et $q$ deux projecteurs de $E$.

    **1.** Montrer que, si $p \circ q + q \circ p = 0$, alors $p \circ q = q \circ p = 0$.

    **2.** En déduire que $p - q$ est un projecteur si et seulement si $p \circ q = q \circ p = q$.

    **3.** On suppose maintenant $p \circ q = 0$, et l'on pose $r = p + q - q \circ p$. Montrer que $r$ est un projecteur, que $\operatorname{Im} r = \operatorname{Im} p \oplus \operatorname{Im} q$ et que $\mathrm{Ker}\, r = \mathrm{Ker}\, p \cap \mathrm{Ker}\, q$.
  corrige: |
    **1.** C'est le calcul de l'exercice 57 : en composant $pq + qp = 0$ par $p$ à gauche puis à droite, on obtient $pq = -pqp = qp$, donc $2pq = 0$.

    **2.** On a $(p - q)^{2} = p - pq - qp + q$, qui vaut $p - q$ si et seulement si $pq + qp = 2q$. Si $pq = qp = q$, c'est vrai. Réciproquement, on compose l'égalité $pq + qp = 2q$ par $q$ : à gauche, $qpq + qp = 2q$, et à droite, $pq + qpq = 2q$, d'où $qp = pq$, puis $2pq = 2q$. 
    $$\boxed{p - q \text{ projecteur} \iff pq = qp = q}$$

    **3.** En développant, avec $p^{2} = p$, $q^{2} = q$ et $pq = 0$, 
    $$r^{2} = (p + q - qp)(p + q - qp) = p + qp + q - qp - qp = p + q - qp = r.$$
     On a $\operatorname{Im} r \subset \operatorname{Im} p + \operatorname{Im} q$, puisque $r = p + q(\mathrm{id} - p)$. Réciproquement, $rp = p + qp - qp = p$ et $rq = pq + q - qpq = q$, donc $\operatorname{Im} p$ et $\operatorname{Im} q$ sont contenus dans $\operatorname{Im} r$. La somme est directe : si $y = p(a) = q(b)$, alors $y = p(y) = pq(b) = 0$. Enfin, $\mathrm{Ker}\, p \cap \mathrm{Ker}\, q \subset \mathrm{Ker}\, r$, et si $r(x) = 0$, alors $p(x) = pr(x) = 0$, car $pr = p$, puis $q(x) = r(x) - p(x) + qp(x) = 0$. 
    $$\boxed{r \text{ est le projecteur sur } \operatorname{Im} p \oplus \operatorname{Im} q \text{ parallèlement à } \mathrm{Ker}\, p \cap \mathrm{Ker}\, q.}$$
- id: "ma-14-64"
  feuille: "f-ma-14"
  numero: 64
  partie: "Formes linéaires et hyperplans"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [formes linéaires et hyperplans, sous-espace engendré, sommes directes, formes linéaires]
  noeuds: [v-dual, v-combinaisons, v-somme-directe]
  notions: [forme-lineaire, combinaison-lineaire, supplementaire, somme-directe]
  page_enonce: 10
  page_corrige: 20
  enonce: |
    **1.** Soit $n \geqslant 1$. Montrer que $H = \{P \in \mathbb{R}_{n}[X] \mid P(0) + P'(1) = 0\}$ est un hyperplan de $\mathbb{R}_{n}[X]$, et donner une droite supplémentaire de $H$.

    **2.** Montrer que $H' = \{f \in \mathcal{C}([0, 1], \mathbb{R}) \mid f(0) = f(1)\}$ est un hyperplan de $\mathcal{C}([0, 1], \mathbb{R})$, et que la droite engendrée par $x \mapsto x$ en est un supplémentaire.

    **3.** Dans $\mathbb{R}^{3}$, les équations $x + 2y - 3z = 0$ et $-2x - 4y + 6z = 0$ définissent-elles le même plan ? Et $x + 2y - 3z = 0$ et $x - y = 0$ ?
  corrige: |
    **1.** L'application $\varphi : P \mapsto P(0) + P'(1)$ est une forme linéaire, non nulle puisque $\varphi(1) = 1$. Son noyau $H$ est un hyperplan, et la droite $\mathbb{R}_{0}[X]$ des constantes n'est pas contenue dans $H$ : par le théorème 7, c'est un supplémentaire. 
    $$\boxed{\mathbb{R}_{n}[X] = H \oplus \mathbb{R}_{0}[X], \qquad P = \big(P - \varphi(P)\big) + \varphi(P)}$$

    **2.** La forme linéaire $f \mapsto f(1) - f(0)$ est non nulle, et vaut $1$ en $x \mapsto x$ : même conclusion.

    **3.** La seconde équation est $-2$ fois la première : c'est le même plan (proposition 23). En revanche, $(1, -1, 0)$ n'est pas proportionnel à $(1, 2, -3)$ : les plans sont distincts. 
    $$\boxed{\text{Même plan dans le premier cas, plans distincts dans le second.}}$$
- id: "ma-14-65"
  feuille: "f-ma-14"
  numero: 65
  partie: "Formes linéaires et hyperplans"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [formes linéaires et hyperplans, sommes directes, applications linéaires, projecteurs, formes linéaires, espaces de fonctions et de suites]
  noeuds: [v-dual, v-somme-directe, v-applications, v-espace]
  notions: [forme-lineaire, supplementaire, somme-directe, application-lineaire, projecteur]
  page_enonce: 11
  page_corrige: 20
  enonce: |
    Soit $E = \mathcal{C}([0, 1], \mathbb{R})$ et $\varphi : f \mapsto \int_{0}^{1} f(t)\,\mathrm{d} t$.

    **1.** Montrer que $H = \mathrm{Ker}\, \varphi$ est un hyperplan de $E$, et que $E = H \oplus \mathbb{R}\,\mathbf{1}$, où $\mathbf{1}$ est la fonction constante égale à $1$.

    **2.** Expliciter le projecteur sur $H$ parallèlement à $\mathbb{R}\,\mathbf{1}$.

    **3.** Montrer que $\psi : f \mapsto f(0)$ est une forme linéaire non nulle, et que $\mathrm{Ker}\, \varphi \neq \mathrm{Ker}\, \psi$.
  corrige: |
    **1.** La forme $\varphi$ est linéaire par linéarité de l'intégrale, et non nulle puisque $\varphi(\mathbf{1}) = 1$ : $H$ est un hyperplan, et $\mathbf{1} \notin H$. Le théorème 7 conclut.

    **2.** La décomposition est $f = \big(f - \varphi(f)\mathbf{1}\big) + \varphi(f)\mathbf{1}$. 
    $$\boxed{p(f) = f - \Big(\int_{0}^{1} f(t)\,\mathrm{d} t\Big)\mathbf{1}}$$
     On retranche à $f$ sa valeur moyenne : le projeté est la fonction « centrée ».

    **3.** La forme $\psi$ est non nulle, puisque $\psi(\mathbf{1}) = 1$. La fonction $g : t \mapsto 1 - 2t$ vérifie $\varphi(g) = 0$ et $\psi(g) = 1$ : elle est dans $\mathrm{Ker}\,\varphi$, mais pas dans $\mathrm{Ker}\,\psi$. 
    $$\boxed{\mathrm{Ker}\,\varphi \neq \mathrm{Ker}\,\psi}$$
- id: "ma-14-66"
  feuille: "f-ma-14"
  numero: 66
  partie: "Formes linéaires et hyperplans"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [formes linéaires et hyperplans, applications linéaires]
  noeuds: [v-dual, v-applications]
  notions: [forme-lineaire, application-lineaire]
  page_enonce: 11
  page_corrige: 20
  enonce: |
    Soit $\varphi$ et $\psi$ deux formes linéaires sur $E$ telles que $\mathrm{Ker}\, \varphi \subset \mathrm{Ker}\, \psi$. Montrer qu'il existe $\lambda \in \mathbb{K}$ tel que $\psi = \lambda\varphi$. On distinguera le cas où $\varphi$ est nulle.
  corrige: |
    Si $\varphi = 0$, alors $\mathrm{Ker}\,\varphi = E \subset \mathrm{Ker}\,\psi$, donc $\psi = 0 = 0 \cdot \varphi$. Sinon, choisissons $a$ tel que $\varphi(a) \neq 0$ et posons $\lambda = \frac{\psi(a)}{\varphi(a)}$. La forme $\psi - \lambda\varphi$ s'annule sur $\mathrm{Ker}\,\varphi$, par hypothèse, et en $a$, donc sur $\mathrm{Ker}\,\varphi \oplus \mathbb{K} a = E$ (théorème 7). 
    $$\boxed{\psi = \lambda\varphi}$$
     La proposition 23 du cours est le cas où les deux noyaux sont égaux ; ici, $\psi$ peut être nulle, et $\lambda$ aussi.
- id: "ma-14-67"
  feuille: "f-ma-14"
  numero: 67
  partie: "Sous-espaces affines"
  etoiles: 1
  types: [Calcul]
  mots_cles: [sous-espaces affines]
  noeuds: [v-espace, v-applications]
  notions: []
  page_enonce: 11
  page_corrige: 20
  enonce: |
    Dans $\mathbb{R}^{3}$, on considère le plan affine $\mathcal{P}$ d'équation $x + 2y - z = 3$ et les droites affines 
    $$\mathcal{D}_{1} = (1, 1, 0) + \mathbb{R}(1, 0, 1), \qquad \mathcal{D}_{2} = \mathbb{R}(1, 0, 1), \qquad \mathcal{D}_{3} = (0, 1, 0) + \mathbb{R}(1, 1, 1).$$
     Déterminer l'intersection de $\mathcal{P}$ avec chacune de ces droites, et interpréter les résultats en termes de directions.
  corrige: |
    La direction de $\mathcal{P}$ est le plan vectoriel $P$ d'équation $x + 2y - z = 0$, qui contient $(1, 0, 1)$ mais pas $(1, 1, 1)$. On substitue la représentation paramétrique de chaque droite dans l'équation de $\mathcal{P}$.

    • $\mathcal{D}_{1}$ : $(1 + t) + 2 - t = 3$ pour tout $t$ ; la droite est contenue dans le plan.

    • $\mathcal{D}_{2}$ : $t - t = 0 \neq 3$ ; l'intersection est vide.

    • $\mathcal{D}_{3}$ : $t + 2(1 + t) - t = 3$, soit $t = \frac{1}{2}$ ; l'intersection est le point $\big(\frac{1}{2}, \frac{3}{2}, \frac{1}{2}\big)$.

    $$\boxed{\mathcal{D}_{1} \subset \mathcal{P}, \qquad \mathcal{D}_{2} \cap \mathcal{P} = \varnothing, \qquad \mathcal{D}_{3} \cap \mathcal{P} = \Big\{\Big(\frac{1}{2}, \frac{3}{2}, \frac{1}{2}\Big)\Big\}}$$
     Les droites $\mathcal{D}_{1}$ et $\mathcal{D}_{2}$ ont une direction contenue dans $P$ : elles sont parallèles au plan, et la proposition 25 dit que leur intersection avec $\mathcal{P}$ est vide ou égale à la droite entière. La direction de $\mathcal{D}_{3}$ rencontre $P$ en $0$ seulement, d'où une intersection réduite à un point.
- id: "ma-14-68"
  feuille: "f-ma-14"
  numero: 68
  partie: "Sous-espaces affines"
