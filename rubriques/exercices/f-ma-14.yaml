  page_enonce: 11
  page_corrige: 21
  enonce: |
    Résoudre les équations suivantes, en les écrivant sous la forme $u(x) = b$ avec $u$ linéaire.

    **1.** $P(X + 1) - P(X) = X^{2}$, d'inconnue $P \in \mathbb{R}[X]$.

    **2.** $u_{n + 2} - 3u_{n + 1} + 2u_{n} = 1$ pour tout $n \in \mathbb{N}$, d'inconnue $(u_{n}) \in \mathbb{R}^{\mathbb{N}}$.

    **3.** $y'' + y = x$, d'inconnue $y \in \mathcal{C}^{2}(\mathbb{R}, \mathbb{R})$.

    **4.** $P(0) = 1$, $P(1) = 0$ et $P(2) = 1$, d'inconnue $P \in \mathbb{R}[X]$.
  corrige: |
    **(i)** L'application $\Delta : P \mapsto P(X + 1) - P(X)$ est linéaire, de noyau $\mathbb{R}_{0}[X]$ (exercice 41). Une solution particulière s'obtient en cherchant $P$ de degré $3$ : $P_{0} = \frac{X^{3}}{3} - \frac{X^{2}}{2} + \frac{X}{6}$, ce que l'on vérifie en développant. 
    $$\boxed{P = \frac{X^{3}}{3} - \frac{X^{2}}{2} + \frac{X}{6} + c, \quad c \in \mathbb{R}}$$

    **(ii)** L'application $u \mapsto (u_{n + 2} - 3u_{n + 1} + 2u_{n})_{n}$ est linéaire ; son noyau est formé des suites $\lambda + \mu 2^{n}$ (chapitre 7, l'équation caractéristique $r^{2} - 3r + 2 = 0$ ayant pour racines $1$ et $2$). Comme $1$ est racine, on cherche une solution particulière de la forme $(\alpha n)$ : $\alpha(n + 2) - 3\alpha(n + 1) + 2\alpha n = -\alpha = 1$. 
    $$\boxed{u_{n} = -n + \lambda + \mu 2^{n}, \quad (\lambda, \mu) \in \mathbb{R}^{2}}$$

    **(iii)** L'application $y \mapsto y'' + y$ est linéaire, de noyau $\mathrm{Vect}(\cos, \sin)$, et $x \mapsto x$ est une solution particulière. 
    $$\boxed{y(x) = x + \lambda\cos x + \mu\sin x}$$

    **(iv)** L'application $P \mapsto (P(0), P(1), P(2))$ est linéaire, de noyau $X(X - 1)(X - 2)\mathbb{R}[X]$. Le polynôme $(X - 1)^{2}$ est une solution particulière, de degré au plus $2$, comme le prévoit le théorème de Lagrange. 
    $$\boxed{P = (X - 1)^{2} + X(X - 1)(X - 2)A, \quad A \in \mathbb{R}[X]}$$
     *À retenir.* Quatre problèmes de natures différentes ont la même structure de solutions : une solution particulière plus le noyau. C'est l'objet du théorème 8.
- id: "ma-14-69"
  feuille: "f-ma-14"
  numero: 69
  partie: "Sous-espaces affines"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [sous-espaces affines, sous-espaces vectoriels, sommes directes]
  noeuds: [v-espace, v-applications, v-somme-directe]
  notions: [sous-espace-vectoriel, supplementaire, somme-directe]
  page_enonce: 11
  page_corrige: 21
  enonce: |
    Soit $\mathcal{A}$ et $\mathcal{B}$ deux sous-espaces affines de $E$, de directions $F$ et $G$.

    **1.** On suppose que $F \oplus G = E$. Montrer que $\mathcal{A} \cap \mathcal{B}$ est un singleton.

    **2.** On suppose seulement $F + G = E$. Montrer que $\mathcal{A} \cap \mathcal{B}$ n'est pas vide. Que dire de cette intersection ?
  corrige: |
    **1.** Écrivons $\mathcal{A} = a + F$ et $\mathcal{B} = b + G$. On décompose $b - a = f + g$ avec $f \in F$ et $g \in G$ ; alors $a + f = b - g$ appartient aux deux sous-espaces, qui se rencontrent donc. Par la proposition 25, l'intersection est un sous-espace affine de direction $F \cap G = \{0\}$, c'est-à-dire un point. 
    $$\boxed{\mathcal{A} \cap \mathcal{B} \text{ est un singleton.}}$$

    **2.** L'existence de la décomposition $b - a = f + g$ n'utilise que $F + G = E$ : l'intersection n'est pas vide, et c'est un sous-espace affine de direction $F \cap G$. 
    $$\boxed{\mathcal{A} \cap \mathcal{B} = c + (F \cap G) \text{ pour tout } c \in \mathcal{A} \cap \mathcal{B}}$$
     Par exemple, dans $\mathbb{R}^{3}$, deux plans affines de directions distinctes ont pour directions deux plans dont la somme est $\mathbb{R}^{3}$ : ils se coupent selon une droite.
- id: "ma-14-70"
  feuille: "f-ma-14"
  numero: 70
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [sous-espaces vectoriels, familles génératrices, familles libres, applications linéaires, projecteurs]
  noeuds: [v-espace, v-libre, v-applications, v-somme-directe]
  notions: [sous-espace-vectoriel, famille-generatrice, famille-libre, application-lineaire, projecteur]
  page_enonce: 12
  page_corrige: 22
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par une démonstration ou un contre-exemple. Les lettres $F$, $G$, $H$ désignent des sous-espaces de $E$, et $u$, $p$ des endomorphismes de $E$.

    **1.** La réunion de deux sous-espaces vectoriels de $E$ est un sous-espace vectoriel de $E$.

    **2.** Si les familles $(x, y)$, $(y, z)$ et $(x, z)$ sont libres, alors la famille $(x, y, z)$ est libre.

    **3.** Une famille qui contient une famille génératrice de $E$ est génératrice de $E$.

    **4.** Si $F \cap G = F \cap H = G \cap H = \{0\}$, alors la somme $F + G + H$ est directe.

    **5.** Une application linéaire injective transforme toute famille libre en une famille libre.

    **6.** Si $u \circ u = 0$, alors $\operatorname{Im} u \subset \mathrm{Ker}\, u$.

    **7.** Si $p$ est un projecteur, alors $\mathrm{id}_{E} - p$ est un projecteur.

    **8.** Si $u \circ u = u$ et si $u$ est injectif, alors $u = \mathrm{id}_{E}$.

    **9.** L'ensemble des solutions d'une équation linéaire $u(x) = b$ est un sous-espace vectoriel de $E$.

    **10.** Si $u$ commute avec un projecteur $p$, alors $\mathrm{Ker}\, p$ et $\operatorname{Im} p$ sont stables par $u$.
  corrige: |
    **1. Faux.** Dans $\mathbb{R}^{2}$, la réunion des deux axes contient $(1, 0)$ et $(0, 1)$, mais pas $(1, 1)$ ; la proposition 5 dit que la réunion n'est un sous-espace que si l'un des deux contient l'autre.

    **2. Faux.** L'exercice 15 en donne un contre-exemple : $v_{3} = v_{2} - 2v_{1}$, alors que les trois couples sont libres.

    **3. Vrai.** Si $(x_{i})_{i \in I}$ contient une famille génératrice, son sous-espace engendré contient celui de la sous-famille, qui est $E$.

    **4. Faux.** Les droites $\mathbb{R}(1, 0)$, $\mathbb{R}(0, 1)$ et $\mathbb{R}(1, 1)$ de $\mathbb{R}^{2}$ se coupent deux à deux en $0$, mais 
    $$(1, 0) + (0, 1) - (1, 1) = 0$$
     est une décomposition non triviale du vecteur nul (remarque suivant la proposition 14).

    **5. Vrai.** Si $\sum \lambda_{k}u(x_{k}) = 0$, alors $u\big(\sum \lambda_{k}x_{k}\big) = 0$, donc $\sum \lambda_{k}x_{k} = 0$ par injectivité, et les $\lambda_{k}$ sont nuls par liberté.

    **6. Vrai.** C'est l'exercice 45 avec $f = g = u$.

    **7. Vrai.** On a $(\mathrm{id} - p)^{2} = \mathrm{id} - 2p + p^{2} = \mathrm{id} - p$ ; c'est le projecteur associé à la même décomposition, avec les rôles échangés (proposition 21).

    **8. Vrai.** Pour tout $x$, $u\big(u(x) - x\big) = u^{2}(x) - u(x) = 0$, donc $u(x) - x \in \mathrm{Ker}\, u = \{0\}$.

    **9. Faux.** Si $b \neq 0$, le vecteur nul n'est pas solution : l'ensemble des solutions est vide ou affine (théorème 8), et c'est un sous-espace vectoriel seulement si $b = 0$. Par exemple, $x = 1$ est la seule solution de $\mathrm{id}_{\mathbb{R}}(x) = 1$.

    **10. Vrai.** Si $p(x) = 0$, alors $p(u(x)) = u(p(x)) = 0$ ; si $y = p(x)$, alors $u(y) = p(u(x)) \in \operatorname{Im} p$. C'est l'exercice 45. 
    $$\boxed{\text{Vrai : 3, 5, 6, 7, 8, 10} \qquad \text{Faux : 1, 2, 4, 9}}$$
- id: "ma-14-71"
  feuille: "f-ma-14"
  numero: 71
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [bases, espaces de polynômes]
  noeuds: [v-libre, pol-anneau]
  notions: [base-vectorielle]
  page_enonce: 12
  page_corrige: 22
  enonce: |
    Soit $n \in \mathbb{N}$.

    **1.** Montrer qu'il existe un unique polynôme $P_{n} \in \mathbb{R}[X]$ tel que $P_{n}(X) + P_{n}(X + 1) = 2X^{n}$.

    **2.** Trouver une relation entre $P_{n + 1}'$ et $P_{n}$.

    **3.** **(a)** Montrer que la famille $(P_{k})_{k \in \mathbb{N}}$ est une base de $\mathbb{R}[X]$.

    **(b)** Montrer que, pour tout $Q \in \mathbb{R}[X]$, on a $\displaystyle Q(X + 1) = \sum_{k = 0}^{+\infty} \frac{Q^{(k)}(X)}{k!}$, la somme étant finie.

    **(c)** Donner la décomposition de $P_{n}(X + 1)$ dans la base $(P_{k})_{k \in \mathbb{N}}$.

    **4.** Montrer que $P_{n}(1 - X) = (-1)^{n}P_{n}(X)$.
  corrige: |
    **1.** Soit $\varphi : P \mapsto P(X) + P(X + 1)$, endomorphisme de $\mathbb{R}[X]$. Si $P$ est de degré $d$ et de coefficient dominant $a$, alors $\varphi(P)$ est de degré $d$ et de coefficient dominant $2a$ : $\varphi$ conserve le degré. La famille $\big(\varphi(X^{k})\big)_{0 \leqslant k \leqslant n}$ est donc à degrés échelonnés, c'est une base de $\mathbb{R}_{n}[X]$, et la restriction de $\varphi$ à $\mathbb{R}_{n}[X]$ est un automorphisme (proposition 10 et théorème 4). Il existe donc un unique $P_{n} \in \mathbb{R}_{n}[X]$ tel que $\varphi(P_{n}) = 2X^{n}$ ; toute solution est de degré $n$, puisque $\varphi$ conserve le degré, donc c'est la seule dans $\mathbb{R}[X]$. 
    $$\boxed{P_{n} \text{ existe et est unique ; il est unitaire de degré } n.}$$

    **2.** En dérivant l'égalité qui définit $P_{n + 1}$, on obtient $P_{n + 1}'(X) + P_{n + 1}'(X + 1) = 2(n + 1)X^{n}$. Le polynôme $\frac{1}{n + 1}P_{n + 1}'$ vérifie donc la même équation que $P_{n}$, et l'unicité donne : 
    $$\boxed{P_{n + 1}' = (n + 1)P_{n}}$$

    **3.** **(a)** Chaque $P_{k}$ est de degré $k$ : la famille est à degrés échelonnés, c'est une base de $\mathbb{R}[X]$ (proposition 10).

    **(b)** Les deux membres sont linéaires en $Q$, la somme étant finie ; il suffit de vérifier l'égalité pour $Q = X^{m}$. Par la formule du binôme, 
    $$(X + 1)^{m} = \sum_{k = 0}^{m} \binom{m}{k}X^{m - k} = \sum_{k = 0}^{m} \frac{1}{k!}\frac{m!}{(m - k)!}X^{m - k} = \sum_{k = 0}^{m} \frac{(X^{m})^{(k)}}{k!}.$$

    **(c)** En itérant la question 2, $P_{n}^{(k)} = \frac{n!}{(n - k)!}P_{n - k}$ pour $k \leqslant n$, et $P_{n}^{(k)} = 0$ pour $k > n$. La question (b) donne alors 
    $$\boxed{P_{n}(X + 1) = \sum_{k = 0}^{n} \binom{n}{k}P_{n - k} = \sum_{j = 0}^{n} \binom{n}{j}P_{j}}$$

    **4.** Soit $Q = (-1)^{n}P_{n}(1 - X)$. L'égalité qui définit $P_{n}$, écrite au point $-X$, donne 
    $$P_{n}(-X) + P_{n}(1 - X) = 2(-X)^{n},$$
     donc 
    $$Q(X) + Q(X + 1) = (-1)^{n}\big(P_{n}(1 - X) + P_{n}(-X)\big) = (-1)^{n} \cdot 2(-1)^{n}X^{n} = 2X^{n}.$$
     Par unicité, $Q = P_{n}$. 
    $$\boxed{P_{n}(1 - X) = (-1)^{n}P_{n}(X)}$$
     Ce sont, à une normalisation près, les polynômes d'Euler. Par exemple, $P_{0} = 1$, $P_{1} = X - \frac{1}{2}$, $P_{2} = X^{2} - X$.
- id: "ma-14-72"
  feuille: "f-ma-14"
  numero: 72
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [sous-espaces vectoriels, sommes directes]
  noeuds: [v-espace, v-somme-directe]
  notions: [sous-espace-vectoriel, supplementaire, somme-directe]
  page_enonce: 12
  page_corrige: 23
  enonce: |
    Soit $F$ et $G$ deux sous-espaces supplémentaires de $E$. Pour $f \in \mathcal{L}(F, G)$, on pose 
    $$V_{f} = \{x + f(x) \mid x \in F\}.$$

    **1.** Soit $S$ un supplémentaire de $G$. Montrer que, pour tout $x \in F$, il existe un unique $y \in G$ tel que $x + y \in S$.

    **2.** Montrer que les supplémentaires de $G$ sont exactement les $V_{f}$, et que $f$ est alors unique.

    **3.** En déduire que tous les supplémentaires de $G$ sont isomorphes.
  corrige: |
    **1.** Soit $S$ un supplémentaire de $G$ et $x \in F$. On décompose $x$ selon $E = S \oplus G$ : $x = s + g$. Le vecteur $y = -g$ convient. Si $y$ et $y'$ conviennent, $(x + y) - (x + y') = y - y'$ appartient à $S \cap G = \{0\}$.

    **2.** Notons $f(x)$ ce vecteur $y$. L'unicité montre que $f$ est linéaire : $\lambda x + x' + \lambda f(x) + f(x')$ appartient à $S$, donc $f(\lambda x + x') = \lambda f(x) + f(x')$. Par construction, $V_{f} \subset S$. Réciproquement, tout $s \in S$ s'écrit $s = x + y$ avec $x \in F$ et $y \in G$, puisque $E = F \oplus G$ ; comme $x + y \in S$, on a $y = f(x)$, donc $s \in V_{f}$. Ainsi $S = V_{f}$.

    Inversement, $V_{f}$ est un supplémentaire de $G$ pour tout $f \in \mathcal{L}(F, G)$. C'est l'image de l'application linéaire $x \mapsto x + f(x)$, donc un sous-espace ; si $x + f(x) \in G$, alors $x \in G \cap F = \{0\}$ ; enfin, $V_{f} + G$ contient $F$, puisque $x = \big(x + f(x)\big) - f(x)$, et $G$, donc $E$. L'unicité de $f$ vient de ce que, si $V_{f} = V_{g}$, alors $x + f(x) = x' + g(x')$ impose $x = x'$ et $f(x) = g(x)$, par unicité de la décomposition selon $F \oplus G$. 
    $$\boxed{\text{Les supplémentaires de } G \text{ sont les } V_{f}, \ f \in \mathcal{L}(F, G), \text{ chacun pour un unique } f.}$$

    **3.** L'application $x \mapsto x + f(x)$ est un isomorphisme de $F$ sur $V_{f}$, injectif car $x + f(x) = 0$ impose $x = 0$. Tous les supplémentaires de $G$ sont donc isomorphes à $F$, donc entre eux.

    *Correction de l'énoncé source.* Le TD d'origine parlait des supplémentaires de $F$ ; c'est faux, puisque $V_{f} \cap F = \mathrm{Ker}\, f$ n'est pas nul en général.
- id: "ma-14-73"
  feuille: "f-ma-14"
  numero: 73
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [noyaux itérés, endomorphismes qui commutent]
  noeuds: [v-applications]
  notions: [noyau]
  page_enonce: 12
  page_corrige: 23
  enonce: |
    Soit $u$, $v \in \mathcal{L}(E)$ tels que $u \circ v = v \circ u$ et $\mathrm{Ker}\, u \cap \mathrm{Ker}\, v = \{0\}$. Montrer que $\mathrm{Ker}\,(u^{i}) \cap \mathrm{Ker}\,(v^{j}) = \{0\}$ pour tous $i$, $j \in \mathbb{N}$.
  corrige: |
    $\triangleright$ *Le cas $j = 1$.* Montrons par récurrence sur $i$ que $\mathrm{Ker}\, u^{i} \cap \mathrm{Ker}\, v = \{0\}$. C'est vrai pour $i = 0$ et $i = 1$. Si c'est vrai au rang $i$ et si $x \in \mathrm{Ker}\, u^{i + 1} \cap \mathrm{Ker}\, v$, alors $u(x) \in \mathrm{Ker}\, u^{i}$, et $v(u(x)) = u(v(x)) = 0$, donc $u(x) \in \mathrm{Ker}\, u^{i} \cap \mathrm{Ker}\, v = \{0\}$ ; ainsi $x \in \mathrm{Ker}\, u \cap \mathrm{Ker}\, v = \{0\}$.

    $\triangleright$ *Le cas général.* Les endomorphismes $v$ et $u^{i}$ commutent, et $\mathrm{Ker}\, v \cap \mathrm{Ker}\, u^{i} = \{0\}$ d'après l'étape précédente. On applique cette étape au couple $(v, u^{i})$, dans lequel $v$ joue le rôle de $u$ : 
    $$\boxed{\mathrm{Ker}\,(u^{i}) \cap \mathrm{Ker}\,(v^{j}) = \{0\} \quad \text{pour tous } i, j \in \mathbb{N}}$$
- id: "ma-14-74"
  feuille: "f-ma-14"
  numero: 74
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [sommes directes, symétries]
  noeuds: [v-somme-directe]
  notions: [supplementaire, somme-directe]
  page_enonce: 13
  page_corrige: 24
  enonce: |
    Soit $u$ et $v$ deux symétries d'un $\mathbb{R}$-espace vectoriel $E$.

    **1.** Montrer que $\mathrm{Ker}\,(u \circ v - v \circ u) = \mathrm{Ker}\,(u + v) \oplus \mathrm{Ker}\,(u - v)$.

    **2.** Montrer que $\operatorname{Im}(u \circ v - v \circ u) = \operatorname{Im}(u + v) \cap \operatorname{Im}(u - v)$.
  corrige: |
    Posons $a = u + v$, $b = u - v$ et $c = uv - vu$. Comme $u^{2} = v^{2} = \mathrm{id}$, on calcule 
    $$ab = vu - uv = -c, \qquad ba = uv - vu = c, \qquad a^{2} + b^{2} = 2u^{2} + 2v^{2} = 4\,\mathrm{id}.$$
     On vérifie aussi, en développant, que $ca = -ac$ et $cb = -bc$ : par exemple $ca = uvu - vuv + u - v$ et $ac = -uvu + vuv - u + v$.

    **1.** Comme $c = ba = -ab$, on a $\mathrm{Ker}\, a \subset \mathrm{Ker}\, c$ et $\mathrm{Ker}\, b \subset \mathrm{Ker}\, c$. La somme est directe : si $a(x) = b(x) = 0$, alors $u(x) = 0$, puis $x = u^{2}(x) = 0$. Soit $x \in \mathrm{Ker}\, c$ ; on écrit 
    $$x = \frac{1}{4}a^{2}(x) + \frac{1}{4}b^{2}(x).$$
     Or $b\big(a^{2}(x)\big) = c\,a(x) = -a\,c(x) = 0$ et $a\big(b^{2}(x)\big) = -c\,b(x) = b\,c(x) = 0$ : le premier terme est dans $\mathrm{Ker}\, b$, le second dans $\mathrm{Ker}\, a$. 
    $$\boxed{\mathrm{Ker}\,(uv - vu) = \mathrm{Ker}\,(u + v) \oplus \mathrm{Ker}\,(u - v)}$$

    **2.** Comme $c = ba = -ab$, on a $\operatorname{Im} c \subset \operatorname{Im} b \cap \operatorname{Im} a$. Réciproquement, soit $y = a(s) = b(t)$. Alors 
    $$4y = a^{2}(y) + b^{2}(y) = a^{2}b(t) + b^{2}a(s) = -a\,c(t) + b\,c(s) = c\,a(t) - c\,b(s) \in \operatorname{Im} c.$$

    $$\boxed{\operatorname{Im}(uv - vu) = \operatorname{Im}(u + v) \cap \operatorname{Im}(u - v)}$$
- id: "ma-14-75"
  feuille: "f-ma-14"
  numero: 75
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [sous-espaces vectoriels, sommes directes, noyau et image, projecteurs]
  noeuds: [v-espace, v-somme-directe, v-applications]
  notions: [sous-espace-vectoriel, supplementaire, somme-directe, noyau, projecteur]
  page_enonce: 13
  page_corrige: 24
  enonce: |
    *Théorème de Maschke.* Soit $G$ un sous-groupe fini du groupe $\mathrm{GL}(E)$, $F$ un sous-espace de $E$ stable par tous les éléments de $G$, et $p$ un projecteur de $E$ d'image $F$. On pose 
    $$\pi = \frac{1}{|G|}\sum_{g \in G} g^{-1} \circ p \circ g.$$

    **1.** Montrer que $\pi$ est un projecteur d'image $F$, et que $\pi \circ h = h \circ \pi$ pour tout $h \in G$.

    **2.** En déduire que $F$ admet un supplémentaire stable par tous les éléments de $G$.
  corrige: |
    **1.** L'application $\pi$ est linéaire, comme combinaison de composées d'applications linéaires. Si $x \in E$ et $g \in G$, alors $p(g(x)) \in F$, puis $g^{-1}\big(p(g(x))\big) \in F$ puisque $g^{-1} \in G$ stabilise $F$ : $\operatorname{Im}\pi \subset F$. Si $y \in F$, alors $g(y) \in F = \operatorname{Im} p$, donc $p(g(y)) = g(y)$, et chaque terme de la somme vaut $y$ : $\pi(y) = y$. Par conséquent $\pi \circ \pi = \pi$ et $\operatorname{Im}\pi = F$. Enfin, pour $h \in G$, l'application $g \mapsto gh$ est une bijection de $G$ (chapitre 11), et 
    $$\pi \circ h = \frac{1}{|G|}\sum_{g \in G} h\,(gh)^{-1}\,p\,(gh) = h \circ \frac{1}{|G|}\sum_{g' \in G} g'^{-1}pg' = h \circ \pi.$$

    **2.** Par le théorème 5, $S = \mathrm{Ker}\,\pi$ est un supplémentaire de $\operatorname{Im}\pi = F$. Il est stable par tout $h \in G$ : si $\pi(x) = 0$, alors $\pi(h(x)) = h(\pi(x)) = 0$ (exercice 45). 
    $$\boxed{E = F \oplus \mathrm{Ker}\,\pi, \text{ avec } \mathrm{Ker}\,\pi \text{ stable par } G.}$$
     *Remarque.* L'énoncé source supposait le corps de caractéristique nulle, pour pouvoir diviser par $|G|$ ; c'est automatique ici, puisque $\mathbb{K} = \mathbb{R}$ ou $\mathbb{C}$.
- id: "ma-14-76"
  feuille: "f-ma-14"
  numero: 76
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [applications linéaires, espaces de polynômes]
  noeuds: [v-applications, pol-anneau]
  notions: [application-lineaire]
  page_enonce: 13
  page_corrige: 24
  enonce: |
    Soit $f$ et $g$ les endomorphismes de $\mathbb{R}[X]$ définis par $f(P) = P'$ et $g(P) = P(0)$, la constante $P(0)$ étant vue comme un polynôme.

    **1.** Déterminer $\mathrm{Ker}\, f$, $\mathrm{Ker}\, g$, $\operatorname{Im} f$ et $\operatorname{Im} g$.

    **2.** Vérifier que $\mathbb{R}[X] = \mathrm{Ker}\, f + \mathrm{Ker}\, g = \operatorname{Im} f + \operatorname{Im} g$. Les deux sommes sont-elles directes ?

    Le chapitre 15 montrera que, dans un espace de dimension finie, ces deux égalités entraînent que les deux sommes sont directes.
  corrige: |
    **1.** Le noyau de $f$ est formé des constantes, et $f$ est surjective (exercice 41, ou primitive d'un polynôme). Le noyau de $g$ est $X\mathbb{R}[X]$, et son image est formée des constantes. 
    $$\boxed{\mathrm{Ker}\, f = \mathbb{R}_{0}[X], \quad \mathrm{Ker}\, g = X\mathbb{R}[X], \quad \operatorname{Im} f = \mathbb{R}[X], \quad \operatorname{Im} g = \mathbb{R}_{0}[X]}$$

    **2.** Tout polynôme s'écrit $P(0) + \big(P - P(0)\big)$ : $\mathbb{R}[X] = \mathrm{Ker}\, f \oplus \mathrm{Ker}\, g$, et cette somme est directe. La somme $\operatorname{Im} f + \operatorname{Im} g$ vaut $\mathbb{R}[X]$, mais elle n'est pas directe, puisque $\operatorname{Im} g \subset \operatorname{Im} f$. 
    $$\boxed{\mathbb{R}[X] = \mathrm{Ker}\, f \oplus \mathrm{Ker}\, g = \operatorname{Im} f + \operatorname{Im} g, \text{ la seconde somme n'étant pas directe}}$$
- id: "ma-14-77"
  feuille: "f-ma-14"
  numero: 77
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [sous-espaces vectoriels, bases, sommes directes, applications linéaires, noyau et image, espaces de polynômes, espaces de fonctions et de suites, équations linéaires]
  noeuds: [v-espace, v-libre, v-somme-directe, v-applications, pol-anneau, ed-lineaires]
  notions: [sous-espace-vectoriel, base-vectorielle, supplementaire, somme-directe, application-lineaire, noyau]
  page_enonce: 13
  page_corrige: 25
  enonce: |
    *Lemme des noyaux à trois facteurs ; une récurrence et une équation différentielle d'ordre $3$.* Soit $E$ un $\mathbb{C}$-espace vectoriel, $a$, $b$, $c$ trois nombres complexes distincts et $f \in \mathcal{L}(E)$ tel que 
    $$(f - a\,\mathrm{id}_{E}) \circ (f - b\,\mathrm{id}_{E}) \circ (f - c\,\mathrm{id}_{E}) = 0.$$
     Pour $\lambda \in \mathbb{C}$, on note $E_{\lambda} = \mathrm{Ker}\,(f - \lambda\,\mathrm{id}_{E})$.

    **1.** Montrer que les endomorphismes $f - a\,\mathrm{id}_{E}$, $f - b\,\mathrm{id}_{E}$ et $f - c\,\mathrm{id}_{E}$ commutent deux à deux, et que $(f - b\,\mathrm{id}_{E}) \circ (f - c\,\mathrm{id}_{E}) = f^{2} - (b + c)f + bc\,\mathrm{id}_{E}$.

    **2.** On pose 
    $$p_{a} = \frac{(f - b\,\mathrm{id}_{E}) \circ (f - c\,\mathrm{id}_{E})}{(a - b)(a - c)},$$
     et l'on définit de même $p_{b}$ et $p_{c}$ en permutant les rôles de $a$, $b$, $c$. À l'aide des polynômes de Lagrange associés aux points $a$, $b$, $c$ (chapitre 13), montrer que $p_{a} + p_{b} + p_{c} = \mathrm{id}_{E}$.

    **3.** Montrer que $\operatorname{Im} p_{a} \subset E_{a}$, que $p_{a}(x) = x$ pour tout $x \in E_{a}$, et que $p_{a}(x) = 0$ pour tout $x \in E_{b} \cup E_{c}$.

    **4.** En déduire que $E = E_{a} \oplus E_{b} \oplus E_{c}$, et identifier $p_{a}$.

    **5.** *Application aux suites.* Soit $F$ l'ensemble des suites complexes $u$ telles que $u_{n + 3} = u_{n + 1} + 6u_{n}$ pour tout $n \in \mathbb{N}$, et $T : u \mapsto (u_{n + 1})_{n \in \mathbb{N}}$.

    **(a)** Montrer que $F$ est un sous-espace de $\mathbb{C}^{\mathbb{N}}$, que $T$ induit un endomorphisme de $F$, et factoriser le polynôme $X^{3} - X - 6$.

    **(b)** En déduire une base de $F$ formée de suites géométriques.

    **(c)** Expliciter la suite de $F$ telle que $u_{0} = 3$, $u_{1} = 0$ et $u_{2} = 2$.

    **6.** *Application à une équation différentielle d'ordre $3$.* Soit $S$ l'ensemble des fonctions $y \in \mathcal{C}^{3}(\mathbb{R}, \mathbb{C})$ telles que $y''' - y'' + 2y = 0$.

    **(a)** Montrer que la dérivation $D : y \mapsto y'$ induit un endomorphisme de $S$.

    **(b)** En déduire une base de $S$ formée de fonctions $x \mapsto \mathrm{e}^{\lambda x}$.

    **(c)** Déterminer les solutions à valeurs réelles.
  corrige: |
    **1.** Pour $\lambda$, $\mu \in \mathbb{C}$, la distributivité de la composition dans l'anneau $\mathcal{L}(E)$ (proposition 20), et le fait que $f$ commute avec $\mathrm{id}_{E}$, donnent 
    $$(f - \lambda\,\mathrm{id}_{E}) \circ (f - \mu\,\mathrm{id}_{E}) = f^{2} - (\lambda + \mu)f + \lambda\mu\,\mathrm{id}_{E}.$$
     Cette expression est symétrique en $\lambda$ et $\mu$ : les deux facteurs commutent. Le cas $(\lambda, \mu) = (b, c)$ est la formule demandée.

    **2.** Soit $L_{a} = \frac{(X - b)(X - c)}{(a - b)(a - c)}$, et $L_{b}$, $L_{c}$ les deux autres polynômes de Lagrange. Le polynôme $L_{a} + L_{b} + L_{c}$ est de degré au plus $2$ et vaut $1$ en $a$, $b$ et $c$ ; le polynôme constant $1$ aussi, donc ils sont égaux par l'unicité du théorème 13 du chapitre 13. Écrivons $L_{a} = \alpha_{a}X^{2} + \beta_{a}X + \gamma_{a}$, et de même pour $L_{b}$ et $L_{c}$. La question 1 donne $p_{a} = \alpha_{a}f^{2} + \beta_{a}f + \gamma_{a}\,\mathrm{id}_{E}$, et de même pour $p_{b}$ et $p_{c}$ ; en sommant, et en identifiant les coefficients de $L_{a} + L_{b} + L_{c} = 1$, on obtient 
    $$p_{a} + p_{b} + p_{c} = 0 \cdot f^{2} + 0 \cdot f + 1 \cdot \mathrm{id}_{E} = \mathrm{id}_{E}.$$

    $$\boxed{p_{a} + p_{b} + p_{c} = \mathrm{id}_{E}}$$

    **3.** Grâce à la commutation des facteurs, l'hypothèse s'écrit 
    $$(f - a\,\mathrm{id}_{E}) \circ p_{a} = \frac{(f - a\,\mathrm{id}_{E}) \circ (f - b\,\mathrm{id}_{E}) \circ (f - c\,\mathrm{id}_{E})}{(a - b)(a - c)} = 0,$$
     donc $\operatorname{Im} p_{a} \subset \mathrm{Ker}\,(f - a\,\mathrm{id}_{E}) = E_{a}$. Si $x \in E_{a}$, alors $f(x) = ax$, donc $(f - c\,\mathrm{id}_{E})(x) = (a - c)x$, puis $(f - b\,\mathrm{id}_{E})\big((a - c)x\big) = (a - b)(a - c)x$ : ainsi $p_{a}(x) = x$. Si $x \in E_{c}$, le facteur $f - c\,\mathrm{id}_{E}$, appliqué en premier, annule $x$ ; si $x \in E_{b}$, on écrit $p_{a}$ avec le facteur $f - b\,\mathrm{id}_{E}$ en premier, ce que permet la question 1. Dans les deux cas, $p_{a}(x) = 0$.

    **4.** Les résultats de la question 3 valent pour $p_{b}$ et $p_{c}$, en permutant les rôles. Tout $x \in E$ s'écrit 
    $$x = p_{a}(x) + p_{b}(x) + p_{c}(x) \in E_{a} + E_{b} + E_{c}.$$
     La somme est directe : si $x_{a} + x_{b} + x_{c} = 0$ avec $x_{\lambda} \in E_{\lambda}$, l'application de $p_{a}$ donne $x_{a} + 0 + 0 = 0$, et de même $x_{b} = x_{c} = 0$ (proposition 14). Enfin, pour $x = x_{a} + x_{b} + x_{c}$, le même calcul donne $p_{a}(x) = x_{a}$. 
    $$\boxed{E = E_{a} \oplus E_{b} \oplus E_{c}, \text{ et } p_{a} \text{ est le projecteur sur } E_{a} \text{ parallèlement à } E_{b} \oplus E_{c}.}$$
     *Piège.* L'hypothèse ne dit pas que l'un des trois facteurs est nul : l'anneau $\mathcal{L}(E)$ n'est pas intègre (exemples suivant la proposition 20). Ce sont les noyaux, et non les facteurs, qui portent l'information.

    *À retenir.* Les projecteurs associés à la décomposition sont des polynômes en $f$, obtenus en remplaçant $X$ par $f$ dans les polynômes de Lagrange. L'exercice 62 est le cas de deux facteurs, où $p_{\alpha} = \frac{f - \beta\,\mathrm{id}_{E}}{\alpha - \beta}$.

    **5.** **(a)** L'ensemble $F$ est le noyau de l'application linéaire $u \mapsto (u_{n + 3} - u_{n + 1} - 6u_{n})_{n \in \mathbb{N}}$ de $\mathbb{C}^{\mathbb{N}}$ dans lui-même, donc un sous-espace. L'application $T$ est linéaire, et si $u \in F$, la suite $v = T(u)$ vérifie 
    $$v_{n + 3} = u_{n + 4} = u_{n + 2} + 6u_{n + 1} = v_{n + 1} + 6v_{n},$$
     donc $T(F) \subset F$. Le polynôme $X^{3} - X - 6$ s'annule en $2$, et la division euclidienne donne 
    $$X^{3} - X - 6 = (X - 2)(X^{2} + 2X + 3) = (X - 2)(X - r)(X - \bar{r}), \qquad r = -1 + \mathrm{i}\sqrt{2},$$
     le discriminant de $X^{2} + 2X + 3$ valant $-8$. Les trois racines $2$, $r$, $\bar{r}$ sont distinctes.

    **(b)** Pour $u \in F$, on a $T^{3}(u) - T(u) - 6u = (u_{n + 3} - u_{n + 1} - 6u_{n})_{n \in \mathbb{N}} = 0$. En développant comme à la question 1, l'endomorphisme $(T - 2\,\mathrm{id}) \circ (T - r\,\mathrm{id}) \circ (T - \bar{r}\,\mathrm{id})$ a les coefficients du polynôme 
    $$(X - 2)(X - r)(X - \bar{r}) = X^{3} - X - 6 :$$
     c'est l'endomorphisme nul de $F$. La question 4 s'applique, avec $(a, b, c) = (2, r, \bar{r})$. Pour $\lambda \in \{2, r, \bar{r}\}$, une suite $u \in F$ appartient à $\mathrm{Ker}\,(T - \lambda\,\mathrm{id})$ si et seulement si $u_{n + 1} = \lambda u_{n}$ pour tout $n$, c'est-à-dire si $u = u_{0}(\lambda^{n})_{n \in \mathbb{N}}$ ; réciproquement, la suite $(\lambda^{n})$ appartient à $F$, puisque 
    $$\lambda^{n + 3} - \lambda^{n + 1} - 6\lambda^{n} = \lambda^{n}(\lambda^{3} - \lambda - 6) = 0.$$
     Ainsi 
    $$F = \mathrm{Vect}\big((2^{n})\big) \oplus \mathrm{Vect}\big((r^{n})\big) \oplus \mathrm{Vect}\big((\bar{r}^{n})\big),$$
     et une somme directe de droites engendrées par des vecteurs non nuls correspond à une famille libre (remarques suivant la proposition 14). 
    $$\boxed{\big((2^{n})_{n \in \mathbb{N}},\ (r^{n})_{n \in \mathbb{N}},\ (\bar{r}^{n})_{n \in \mathbb{N}}\big) \text{ est une base de } F, \quad r = -1 + \mathrm{i}\sqrt{2}.}$$

    **(c)** Une suite de $F$ est déterminée par ses trois premiers termes, par récurrence. La suite $v$ de terme général $v_{n} = 2^{n} + r^{n} + \bar{r}^{n}$ appartient à $F$, et, comme $r + \bar{r} = -2$ et $r\bar{r} = 3$, 
    $$v_{0} = 3, \qquad v_{1} = 2 + (r + \bar{r}) = 0, \qquad v_{2} = 4 + (r + \bar{r})^{2} - 2r\bar{r} = 4 + 4 - 6 = 2.$$

    $$\boxed{u_{n} = 2^{n} + (-1 + \mathrm{i}\sqrt{2})^{n} + (-1 - \mathrm{i}\sqrt{2})^{n} = 2^{n} + 2\operatorname{Re}\big((-1 + \mathrm{i}\sqrt{2})^{n}\big)}$$
     Ces nombres sont des entiers, comme le montre la récurrence : $3, 0, 2, 18, 2, 30, 110, 42, \dots$ On a deviné les coordonnées $(1, 1, 1)$ en remarquant que $3$, $0$ et $2$ sont le nombre de racines de $X^{3} - X - 6$, leur somme et la somme de leurs carrés ; l'unicité des coordonnées dans une base garantit qu'il n'y a pas d'autre réponse.

    **6.** **(a)** L'ensemble $S$ est le noyau de l'application linéaire $y \mapsto y''' - y'' + 2y$, de $\mathcal{C}^{3}(\mathbb{R}, \mathbb{C})$ dans $\mathcal{C}(\mathbb{R}, \mathbb{C})$, donc un sous-espace. Si $y \in S$, alors $y''' = y'' - 2y$ est de classe $\mathcal{C}^{1}$, donc $y$ est de classe $\mathcal{C}^{4}$, et $y'$ est de classe $\mathcal{C}^{3}$, avec 
    $$(y')''' - (y')'' + 2y' = (y''' - y'' + 2y)' = 0.$$
     Donc $D(S) \subset S$, et $D$ est linéaire.

    **(b)** Le polynôme $X^{3} - X^{2} + 2$ s'annule en $-1$, et 
    $$X^{3} - X^{2} + 2 = (X + 1)(X^{2} - 2X + 2) = (X + 1)\big(X - (1 + \mathrm{i})\big)\big(X - (1 - \mathrm{i})\big).$$
     Sur $S$, on a $D^{3} - D^{2} + 2\,\mathrm{id} = 0$, et le développement de la question 1 montre que 
    $$(D + \mathrm{id}) \circ \big(D - (1 + \mathrm{i})\mathrm{id}\big) \circ \big(D - (1 - \mathrm{i})\mathrm{id}\big) = 0.$$
     Pour $\lambda \in \{-1, 1 + \mathrm{i}, 1 - \mathrm{i}\}$, une fonction $y \in S$ vérifie $D(y) = \lambda y$ si et seulement si $y' - \lambda y = 0$, c'est-à-dire si $y$ est de la forme $x \mapsto K\mathrm{e}^{\lambda x}$ (théorème 2 du chapitre 6) ; réciproquement, $e_{\lambda} : x \mapsto \mathrm{e}^{\lambda x}$ appartient à $S$, puisque $e_{\lambda}''' - e_{\lambda}'' + 2e_{\lambda} = (\lambda^{3} - \lambda^{2} + 2)e_{\lambda} = 0$. La question 4 donne $S = \mathbb{C} e_{-1} \oplus \mathbb{C} e_{1 + \mathrm{i}} \oplus \mathbb{C} e_{1 - \mathrm{i}}$, et, comme en 5(b) : 
    $$\boxed{\big(x \mapsto \mathrm{e}^{-x},\ x \mapsto \mathrm{e}^{(1 + \mathrm{i})x},\ x \mapsto \mathrm{e}^{(1 - \mathrm{i})x}\big) \text{ est une base de } S.}$$

    **(c)** Soit $y = Ae_{-1} + Be_{1 + \mathrm{i}} + Ce_{1 - \mathrm{i}}$ une solution à valeurs réelles. Sa conjuguée 
    $$\bar{y} = \bar{A}e_{-1} + \bar{C}e_{1 + \mathrm{i}} + \bar{B}e_{1 - \mathrm{i}}$$
     est égale à $y$ ; l'unicité des coordonnées donne $A \in \mathbb{R}$ et $C = \bar{B}$. En écrivant $B = \frac{\beta - \mathrm{i}\gamma}{2}$, avec $\beta$, $\gamma$ réels, 
    $$Be_{1 + \mathrm{i}}(x) + \bar{B}e_{1 - \mathrm{i}}(x) = 2\operatorname{Re}\big(B\,\mathrm{e}^{x}\mathrm{e}^{\mathrm{i} x}\big) = \mathrm{e}^{x}(\beta\cos x + \gamma\sin x).$$
     Réciproquement, ces fonctions sont des solutions réelles. 
    $$\boxed{y(x) = \alpha\,\mathrm{e}^{-x} + \mathrm{e}^{x}(\beta\cos x + \gamma\sin x), \qquad (\alpha, \beta, \gamma) \in \mathbb{R}^{3}}$$
     *À retenir.* Le chapitre 6 ne traitait que les équations d'ordre $1$ et $2$ : la décomposition en noyaux ramène ici une équation d'ordre $3$ à trois équations d'ordre $1$. C'est le même calcul que pour les suites, la dérivation jouant le rôle du décalage $T$, et les exponentielles celui des suites géométriques. Le chapitre 15 dira que $F$ et $S$ sont de dimension $3$.
- id: "ma-14-78"
