  enonce: |
    Soit $p$ et $q$ deux projecteurs de $E$.

    **1.** Montrer que, si $p$ et $q$ commutent, $p \circ q$ est un projecteur.

    **2.** Montrer que $p + q$ est un projecteur si et seulement si $p \circ q = q \circ p = 0$.

    **3.** Montrer que dans ce cas $\operatorname{Im}(p + q) = \operatorname{Im} p \oplus \operatorname{Im} q$ et $\mathrm{Ker}\,(p + q) = \mathrm{Ker}\, p \cap \mathrm{Ker}\, q$.
  corrige: |
    **1.** Si $pq = qp$, alors $(pq)^{2} = pqpq = ppqq = pq$.

    **2.** On a $(p + q)^{2} = p + q + pq + qp$, donc $p + q$ est un projecteur si et seulement si $pq + qp = 0$. Si $pq = qp = 0$, c'est le cas. Réciproquement, si $pq + qp = 0$, en composant par $p$ à gauche puis à droite, on obtient $pq + pqp = 0$ et $pqp + qp = 0$, d'où $pq = qp$, puis $2pq = 0$. 
    $$\boxed{p + q \text{ projecteur} \iff pq = qp = 0}$$

    **3.** On a $\operatorname{Im}(p + q) \subset \operatorname{Im} p + \operatorname{Im} q$. Réciproquement, 
    $$(p + q)(p(x)) = p(x) + qp(x) = p(x),$$
     donc $\operatorname{Im} p \subset \operatorname{Im}(p + q)$, et de même pour $q$. La somme est directe : si $y = p(a) = q(b)$, alors $y = p(y) = pq(b) = 0$. Pour les noyaux, $\mathrm{Ker}\, p \cap \mathrm{Ker}\, q \subset \mathrm{Ker}\,(p + q)$ ; si $p(x) = -q(x)$, en appliquant $p$, $p(x) = -pq(x) = 0$, puis $q(x) = 0$. 
    $$\boxed{\operatorname{Im}(p + q) = \operatorname{Im} p \oplus \operatorname{Im} q, \qquad \mathrm{Ker}\,(p + q) = \mathrm{Ker}\, p \cap \mathrm{Ker}\, q}$$
     *Piège.* La division par $2$ est permise parce que $\mathbb{K} = \mathbb{R}$ ou $\mathbb{C}$ ; sans elle, la question 2 serait fausse.
- id: "ma-14-58"
  feuille: "f-ma-14"
  numero: 58
  partie: "Endomorphismes, projecteurs et symétries"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [projecteurs et symétries, projecteurs]
  noeuds: [v-somme-directe, v-applications]
  notions: [projecteur]
  page_enonce: 9
  page_corrige: 18
  enonce: |
    Soit $p$, $q \in \mathcal{L}(E)$ tels que $p + q = \mathrm{id}_{E}$ et $p \circ q = 0$.

    **1.** Montrer que $p$ et $q$ sont des projecteurs et que $q \circ p = 0$.

    **2.** Montrer que $\operatorname{Im} p = \mathrm{Ker}\, q$ et $\operatorname{Im} q = \mathrm{Ker}\, p$.
  corrige: |
    **1.** On a $p = \mathrm{id} - q$, donc $0 = pq = q - q^{2}$ : $q^{2} = q$. Ensuite, $p^{2} = p(\mathrm{id} - q) = p - pq = p$, et $qp = q(\mathrm{id} - q) = q - q^{2} = 0$.

    **2.** Comme $qp = 0$, on a $\operatorname{Im} p \subset \mathrm{Ker}\, q$ ; si $q(x) = 0$, alors $x = p(x) + q(x) = p(x) \in \operatorname{Im} p$. De même, $pq = 0$ et $x = p(x) + q(x)$ donnent $\operatorname{Im} q = \mathrm{Ker}\, p$. 
    $$\boxed{p, q \text{ projecteurs}, \quad qp = 0, \quad \operatorname{Im} p = \mathrm{Ker}\, q, \quad \operatorname{Im} q = \mathrm{Ker}\, p}$$
- id: "ma-14-59"
  feuille: "f-ma-14"
  numero: 59
  partie: "Endomorphismes, projecteurs et symétries"
