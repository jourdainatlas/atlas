  enonce: |
    Soit $f \in \mathcal{L}(E, F)$ et $g \in \mathcal{L}(F, G)$.

    **1.** Montrer que $\mathrm{Ker}\, f \subset \mathrm{Ker}\,(g \circ f)$, et que $\mathrm{Ker}\, f = \mathrm{Ker}\,(g \circ f)$ si et seulement si $\operatorname{Im} f \cap \mathrm{Ker}\, g = \{0\}$.

    **2.** Montrer que $\operatorname{Im}(g \circ f) \subset \operatorname{Im} g$, et que $\operatorname{Im}(g \circ f) = \operatorname{Im} g$ si et seulement si $\operatorname{Im} f + \mathrm{Ker}\, g = F$.

    **3.** Exprimer $\mathrm{Ker}\,(g \circ f)$ à l'aide de $f$ et de $\mathrm{Ker}\, g$, et $\operatorname{Im}(g \circ f)$ à l'aide de $g$ et de $\operatorname{Im} f$.
  corrige: |
    **1.** Si $f(x) = 0$, alors $g(f(x)) = 0$. Supposons $\operatorname{Im} f \cap \mathrm{Ker}\, g = \{0\}$ : si $g(f(x)) = 0$, alors $f(x) \in \operatorname{Im} f \cap \mathrm{Ker}\, g$, donc $f(x) = 0$. Réciproquement, si $\mathrm{Ker}\, f = \mathrm{Ker}\,(g \circ f)$ et $y = f(x) \in \mathrm{Ker}\, g$, alors $x \in \mathrm{Ker}\,(g \circ f) = \mathrm{Ker}\, f$, donc $y = 0$.

    **2.** On a $g(f(x)) \in \operatorname{Im} g$. Supposons $\operatorname{Im} f + \mathrm{Ker}\, g = F$ : tout $y \in F$ s'écrit $f(x) + k$ avec $g(k) = 0$, donc $g(y) = g(f(x))$. Réciproquement, si $\operatorname{Im}(g \circ f) = \operatorname{Im} g$ et $y \in F$, il existe $x$ tel que $g(y) = g(f(x))$, et $y = f(x) + \big(y - f(x)\big)$ avec $y - f(x) \in \mathrm{Ker}\, g$.

    **3.** On a $x \in \mathrm{Ker}\,(g \circ f) \iff f(x) \in \mathrm{Ker}\, g$, et $\operatorname{Im}(g \circ f) = g(f(E))$. 
    $$\boxed{\mathrm{Ker}\,(g \circ f) = f^{-1}(\mathrm{Ker}\, g), \qquad \operatorname{Im}(g \circ f) = g(\operatorname{Im} f)}$$
- id: "ma-14-47"
