  enonce: |
    Soit $\varphi : \mathbb{R}^{\mathbb{N}} \to \mathbb{R}$ une forme linéaire telle que, pour toute suite $u$, le réel $\varphi(u)$ soit l'un des termes de $u$. Montrer qu'il existe $n \in \mathbb{N}$ tel que $\varphi(u) = u_{n}$ pour toute suite $u$.
  corrige: |
    *Idée.* On détermine l'indice $N$ grâce à la suite $w = (n)_{n \in \mathbb{N}}$, puis l'on perturbe une suite $u$ quelconque en $u + tw$ : pour presque toute valeur de $t$, le seul terme possible est celui d'indice $N$.

    $\triangleright$ *Un lemme.* Aucune suite réelle $(t_{k})_{k \in \mathbb{N}}$ ne prend toutes les valeurs réelles. On construit des segments emboîtés $I_{0} \supset I_{1} \supset \cdots$, de longueurs tendant vers $0$, tels que $t_{k} \notin I_{k}$ : on part de $I_{-1} = [0, 1]$, et l'on choisit pour $I_{k}$ l'un des tiers extrêmes de $I_{k - 1}$ qui ne contient pas $t_{k}$. Les suites des extrémités sont adjacentes (chapitre 7) ; leur limite commune appartient à tous les $I_{k}$, donc n'est égale à aucun $t_{k}$.

    $\triangleright$ *L'indice $N$.* Le réel $\varphi(w)$ est un terme de $w$, donc un entier $N$.

    $\triangleright$ *Conclusion.* Soit $u \in \mathbb{R}^{\mathbb{N}}$. Pour tout réel $t$, il existe un indice $k$ tel que 
    $$\varphi(u) + tN = \varphi(u + tw) = u_{k} + tk.$$
     Pour $k \neq N$, cette égalité n'a lieu que pour $t = t_{k} = \frac{\varphi(u) - u_{k}}{k - N}$. Par le lemme, il existe un réel $t$ différent de tous les $t_{k}$ ; pour ce $t$, l'indice $k$ vaut nécessairement $N$, et l'égalité devient $\varphi(u) = u_{N}$. 
    $$\boxed{\varphi(u) = u_{N} \text{ pour toute suite } u, \text{ avec } N = \varphi\big((n)_{n \in \mathbb{N}}\big)}$$
