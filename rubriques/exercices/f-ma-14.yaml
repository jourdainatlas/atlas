  enonce: |
    **1.** Soit $p : (x, y, z) \mapsto \frac{1}{3}(2x + y + z, x + 2y - z, x - y + 2z)$. Montrer que $p$ est un projecteur de $\mathbb{R}^{3}$, et déterminer ses éléments caractéristiques.

    **2.** Soit $f : (x, y, z) \mapsto (x + 2y, 4x - y, -2x + 2y + 3z)$. Calculer $f \circ f$, en déduire que $\frac{1}{3}f$ est une symétrie, dont on déterminera les éléments caractéristiques. Montrer que $f$ est un automorphisme de $\mathbb{R}^{3}$, et exprimer $f^{-1}$ en fonction de $f$.
  corrige: |
    **1.** On calcule $p \circ p = p$, par exemple sur les vecteurs de la base canonique, ce qui suffit par le théorème 4 : $p(e_{1}) = \frac{1}{3}(2, 1, 1)$ et $p\big(\frac{1}{3}(2, 1, 1)\big) = \frac{1}{9}(6, 3, 3) = p(e_{1})$, et de même pour $e_{2}$ et $e_{3}$. L'équation $p(v) = 0$ équivaut à $2x + y + z = 0$ et $x + 2y - z = 0$, d'où $\mathrm{Ker}\, p = \mathbb{R}(-1, 1, 1)$ ; l'équation $p(v) = v$ équivaut à $x - y - z = 0$. 
    $$\boxed{p \text{ est le projecteur sur le plan } x - y - z = 0 \text{ parallèlement à } \mathbb{R}(-1, 1, 1).}$$

    **2.** Le calcul donne $f \circ f(x, y, z) = (9x, 9y, 9z)$, donc $\big(\frac{1}{3}f\big)^{2} = \mathrm{id}$ : $s = \frac{1}{3}f$ est une symétrie (théorème 6). On a $s(v) = v$ si et seulement si $f(v) = 3v$, ce qui équivaut à $x = y$ ; et $s(v) = -v$ si et seulement si $f(v) = -3v$, ce qui donne $y = -2x$ et $z = x$. 
    $$\boxed{\tfrac{1}{3}f \text{ est la symétrie par rapport au plan } x = y \text{ parallèlement à } \mathbb{R}(1, -2, 1), \qquad f^{-1} = \tfrac{1}{9}f}$$
