  enonce: |
    Soit $a_{0}, \dots, a_{n}$ des éléments distincts de $\mathbb{K}$ et, pour $j \in [\![0\,;n]\!]$, 
    $$F_{j} = \{P \in \mathbb{K}_{n}[X] \mid P(a_{i}) = 0 \text{ pour tout } i \neq j\}.$$
     Montrer que $\mathbb{K}_{n}[X] = F_{0} \oplus \cdots \oplus F_{n}$.
  corrige: |
    Soit $L_{0}, \dots, L_{n}$ les polynômes de Lagrange associés aux points $a_{0}, \dots, a_{n}$. Un polynôme $P \in F_{j}$ s'annule aux $n$ points $a_{i}$, $i \neq j$, et il est de degré au plus $n$ : il est multiple de $\prod_{i \neq j}(X - a_{i})$, donc de $L_{j}$, et $P = P(a_{j})L_{j}$. Réciproquement, $L_{j} \in F_{j}$. Ainsi $F_{j} = \mathbb{K} L_{j}$. Comme $(L_{0}, \dots, L_{n})$ est une base de $\mathbb{K}_{n}[X]$ (exemple du cours), la deuxième remarque suivant la proposition 14 du cours donne la somme directe. 
    $$\boxed{F_{j} = \mathbb{K} L_{j}, \qquad \mathbb{K}_{n}[X] = F_{0} \oplus \cdots \oplus F_{n}, \qquad P = \sum_{j = 0}^{n} P(a_{j})L_{j}}$$
- id: "ma-14-34"
  feuille: "f-ma-14"
  numero: 34
  partie: "Somme de sous-espaces"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [somme de sous-espaces, sous-espaces vectoriels]
  noeuds: [v-somme-directe, v-espace]
  notions: [somme-directe, sous-espace-vectoriel]
  page_enonce: 6
  page_corrige: 11
  enonce: |
    Soit $A$, $B$, $C$ trois sous-espaces vectoriels de $E$.

    **1.** Montrer que $A \cap B = A + B$ si et seulement si $A = B$.

    **2.** Montrer que $(A \cap B) + (A \cap C) \subset A \cap (B + C)$, et que l'inclusion peut être stricte.

    **3.** Montrer que, si $B \subset A$, alors $(A \cap B) + (A \cap C) = A \cap (B + C)$.
  corrige: |
    **1.** Si $A \cap B = A + B$, alors $A \subset A + B = A \cap B \subset B$, et de même $B \subset A$. La réciproque est claire.

    **2.** Les sous-espaces $A \cap B$ et $A \cap C$ sont contenus dans $A$ et dans $B + C$, donc leur somme aussi. L'inclusion peut être stricte : dans $\mathbb{R}^{2}$, avec $A = \mathbb{R}(1, 1)$, $B = \mathbb{R}(1, 0)$, $C = \mathbb{R}(0, 1)$, le membre de gauche vaut $\{0\}$, et le membre de droite vaut $A \cap \mathbb{R}^{2} = A$.

    **3.** Supposons $B \subset A$ et soit $x \in A \cap (B + C)$, $x = b + c$. Alors $c = x - b \in A$, donc $c \in A \cap C$, et $b \in B = A \cap B$. 
    $$\boxed{B \subset A \implies (A \cap B) + (A \cap C) = A \cap (B + C)}$$
     *À retenir.* L'intersection ne se distribue pas sur la somme ; c'est la différence la plus visible entre le calcul sur les sous-espaces et le calcul ensembliste du chapitre 1.
- id: "ma-14-35"
  feuille: "f-ma-14"
  numero: 35
  partie: "Somme de sous-espaces"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [somme de sous-espaces, sous-espaces vectoriels, sommes directes]
