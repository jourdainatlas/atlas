  page_corrige: 28
  enonce: |
    *La fonction identité est la somme de deux fonctions périodiques.* Dans cet exercice, $\mathbb{R}$ est vu comme un $\mathbb{Q}$-espace vectoriel, pour l'addition des réels et la multiplication d'un réel par un rationnel. On admet que les définitions et les résultats du chapitre restent valables, avec les mêmes démonstrations, lorsque le corps des scalaires est $\mathbb{Q}$. On admet aussi, ce qui repose sur l'axiome du choix, qu'il existe une base $(e_{i})_{i \in I}$ du $\mathbb{Q}$-espace vectoriel $\mathbb{R}$ dont $1$ et $\sqrt{2}$ font partie : tout réel $x$ s'écrit de façon unique comme combinaison linéaire, à coefficients rationnels, d'un nombre fini des $e_{i}$. On note $\lambda(x) \in \mathbb{Q}$ le coefficient de $\sqrt{2}$ dans cette écriture.

    **1.** Vérifier que la famille $(1, \sqrt{2})$ est libre dans le $\mathbb{Q}$-espace vectoriel $\mathbb{R}$, et liée dans le $\mathbb{R}$-espace vectoriel $\mathbb{R}$.

    **2.** Montrer que l'application $\lambda : \mathbb{R} \to \mathbb{Q}$ est $\mathbb{Q}$-linéaire, et calculer $\lambda(1)$ et $\lambda(\sqrt{2})$.

    **3.** On pose $g(x) = \sqrt{2}\,\lambda(x)$ et $h(x) = x - g(x)$ pour tout réel $x$. Montrer que $g$ est $1$-périodique et que $h$ est $\sqrt{2}$-périodique. Conclure.

    **4.** Montrer que $g$ n'est continue en aucun point de $\mathbb{R}$.

    **5.** Montrer que la fonction $x \mapsto x$ n'est pas la somme de deux fonctions périodiques continues.

    Les six derniers exercices sont des problèmes à traiter en autonomie : l'énoncé fixe le but, et c'est à vous de trouver le chemin.
  corrige: |
    **1.** Soit $p$, $q$ rationnels tels que $p + q\sqrt{2} = 0$. Si $q$ était non nul, $\sqrt{2} = -\frac{p}{q}$ serait rationnel, ce qui est faux ; donc $q = 0$, puis $p = 0$. En revanche, $\sqrt{2} \cdot 1 - 1 \cdot \sqrt{2} = 0$ est une relation de dépendance à coefficients réels non nuls. 
    $$\boxed{(1, \sqrt{2}) \text{ est libre sur } \mathbb{Q} \text{ et liée sur } \mathbb{R}.}$$
     Comme pour la famille $(1, \mathrm{i})$ dans le cours, la liberté dépend du corps des scalaires.

    **2.** Soit $x$, $y$ réels et $r$ rationnel. En complétant par des coefficients nuls, on écrit $x$ et $y$ sur une même sous-famille finie $(e_{i})_{i \in J}$ de la base, contenant $\sqrt{2}$ : $x = \sum_{i \in J} x_{i}e_{i}$ et $y = \sum_{i \in J} y_{i}e_{i}$. Alors $rx + y = \sum_{i \in J} (rx_{i} + y_{i})e_{i}$, et l'unicité de l'écriture donne $\lambda(rx + y) = r\lambda(x) + \lambda(y)$. C'est l'argument qui montre, dans le cours, que les formes coordonnées sont linéaires. L'écriture $1 = 1 \cdot 1$ donne $\lambda(1) = 0$, et $\sqrt{2} = 1 \cdot \sqrt{2}$ donne $\lambda(\sqrt{2}) = 1$. 
    $$\boxed{\lambda \text{ est } \mathbb{Q}\text{-linéaire}, \quad \lambda(1) = 0, \quad \lambda(\sqrt{2}) = 1}$$

    **3.** Pour tout réel $x$, l'additivité de $\lambda$ donne 
    $$g(x + 1) = \sqrt{2}\big(\lambda(x) + \lambda(1)\big) = g(x) \qquad\text{et}\qquad h(x + \sqrt{2}) = x + \sqrt{2} - \sqrt{2}\big(\lambda(x) + 1\big) = h(x).$$
     Comme $x = g(x) + h(x)$ par définition : 
    $$\boxed{\text{la fonction } x \mapsto x \text{ est la somme de } g, \ 1\text{-périodique, et de } h, \ \sqrt{2}\text{-périodique.}}$$

    **4.** La fonction $g = \sqrt{2}\,\lambda$ est $\mathbb{Q}$-linéaire. Supposons-la continue en un point $x_{0}$. Pour tout réel $y_{0}$ et tout réel $y$, l'additivité donne 
    $$g(y) = g(y - y_{0} + x_{0}) + g(y_{0}) - g(x_{0}) ;$$
     lorsque $y$ tend vers $y_{0}$, le réel $y - y_{0} + x_{0}$ tend vers $x_{0}$, donc $g(y)$ tend vers $g(y_{0})$ : $g$ est continue en tout point. Soit alors $t$ réel, et $(r_{n})$ une suite de rationnels de limite $t$ (proposition 12 du chapitre 7). Comme $g(r_{n}) = r_{n}g(1) = 0$, la caractérisation séquentielle de la continuité (théorème 7 du chapitre 8) donne $g(t) = 0$. C'est faux pour $t = \sqrt{2}$, puisque $g(\sqrt{2}) = \sqrt{2}$. 
    $$\boxed{g \text{ n'est continue en aucun point de } \mathbb{R}.}$$
     La fonction $h = \mathrm{id}_{\mathbb{R}} - g$ n'est donc continue en aucun point non plus.

    **5.** Soit $\varphi$ une fonction continue et $T$-périodique, avec $T > 0$. Elle est bornée sur le segment $[0, T]$ (théorème 10 du chapitre 8), par un réel $M$. Pour tout réel $x$, le réel $x' = x - \lfloor \frac{x}{T} \rfloor T$ appartient à $[0, T[$, et $\varphi(x) = \varphi(x')$ par périodicité, puisque $x - x'$ est un multiple entier de $T$, donc $|\varphi(x)| \leqslant M$ : $\varphi$ est bornée sur $\mathbb{R}$. Si $x \mapsto x$ était la somme de deux fonctions périodiques continues, elle serait bornée, ce qui est faux. 
    $$\boxed{x \mapsto x \text{ n'est pas la somme de deux fonctions périodiques continues.}}$$
     *Piège.* Il est tentant de croire qu'une somme de fonctions périodiques reste bornée, ou du moins « oscille » : c'est vrai pour des fonctions continues, et la question 5 montre que la décomposition de la question 3 ne peut pas l'être. La continuité n'est pas un détail, c'est elle qui interdit les monstres.

    *À retenir.* Le même ensemble $\mathbb{R}$ porte deux structures d'espace vectoriel très différentes. Les applications $\mathbb{R}$-linéaires de $\mathbb{R}$ dans $\mathbb{R}$ sont les $x \mapsto kx$ ; il existe bien d'autres applications $\mathbb{Q}$-linéaires, comme $\lambda$, mais le raisonnement de la question 4 montre que les seules qui soient continues sont encore les $x \mapsto kx$.

    Les six derniers exercices sont des problèmes en autonomie ; le corrigé commence par l'idée directrice.
