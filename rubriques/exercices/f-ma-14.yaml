  enonce: |
    Soit $f \in \mathcal{L}(E, F)$.

    **1.** Soit $E_{1}$ et $E_{2}$ deux sous-espaces de $E$. Montrer l'équivalence 
    $$f(E_{1}) \subset f(E_{2}) \iff E_{1} + \mathrm{Ker}\, f \subset E_{2} + \mathrm{Ker}\, f.$$

    **2.** Soit $E'$ un sous-espace de $E$ et $F'$ un sous-espace de $F$. Exprimer $f^{-1}\big(f(E')\big)$ à l'aide de $E'$ et de $\mathrm{Ker}\, f$, puis $f\big(f^{-1}(F')\big)$ à l'aide de $F'$ et de $\operatorname{Im} f$.
  corrige: |
    **1.** Supposons $f(E_{1}) \subset f(E_{2})$ et soit $x \in E_{1}$ : il existe $x' \in E_{2}$ tel que $f(x) = f(x')$, et 
    $$x = x' + (x - x') \in E_{2} + \mathrm{Ker}\, f.$$
     Donc $E_{1} + \mathrm{Ker}\, f \subset E_{2} + \mathrm{Ker}\, f$. Réciproquement, $f(E_{1}) = f(E_{1} + \mathrm{Ker}\, f) \subset f(E_{2} + \mathrm{Ker}\, f) = f(E_{2})$.

    **2.** Un vecteur $x$ vérifie $f(x) \in f(E')$ si et seulement s'il existe $x' \in E'$ tel que $x - x' \in \mathrm{Ker}\, f$. Et $y \in f(f^{-1}(F'))$ si et seulement si $y = f(x)$ avec $f(x) \in F'$, c'est-à-dire $y \in F' \cap \operatorname{Im} f$. 
    $$\boxed{f^{-1}\big(f(E')\big) = E' + \mathrm{Ker}\, f, \qquad f\big(f^{-1}(F')\big) = F' \cap \operatorname{Im} f}$$
