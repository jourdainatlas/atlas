    **1.** Soit $f$, $g \in \mathcal{L}(E)$ tels que $f \circ g = g \circ f$. Montrer que $\mathrm{Ker}\, f$ et $\operatorname{Im} f$ sont stables par $g$.

    **2.** Soit $f \in \mathcal{L}(E, F)$ et $g \in \mathcal{L}(F, G)$. Montrer que $g \circ f = 0$ si et seulement si $\operatorname{Im} f \subset \mathrm{Ker}\, g$.
  corrige: |
    **1.** Si $f(x) = 0$, alors $f(g(x)) = g(f(x)) = 0$ : $g(x) \in \mathrm{Ker}\, f$. Si $y = f(x)$, alors $g(y) = f(g(x)) \in \operatorname{Im} f$.

    **2.** Si $g \circ f = 0$, alors $g(f(x)) = 0$ pour tout $x$, donc $\operatorname{Im} f \subset \mathrm{Ker}\, g$ ; la réciproque se lit de même. 
    $$\boxed{g \circ f = 0 \iff \operatorname{Im} f \subset \mathrm{Ker}\, g}$$
- id: "ma-14-46"
  feuille: "f-ma-14"
  numero: 46
  partie: "Applications linéaires"
