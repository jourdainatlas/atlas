- id: "ma-05-01"
  feuille: "f-ma-05"
  numero: 1
  partie: "Généralités sur les fonctions"
  etoiles: 1
  types: [Calcul]
  mots_cles: [généralités sur les fonctions, logarithme]
  noeuds: [de-monotonie, ex-logarithme]
  notions: [logarithme]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Déterminer l'ensemble de définition de chacune des fonctions suivantes, en l'écrivant comme une réunion d'intervalles.

    **(a)** $x \mapsto \sqrt{2x^{2} - 12x + 18}$

    **(b)** $x \mapsto \ln(x^{2} + 4x + 4)$

    **(c)** $x \mapsto \sqrt{\dfrac{8 - 16x}{(7 + x)^{2}}}$

    **(d)** $x \mapsto \ln(3 - x) + \dfrac{\sqrt{x - 1}}{x - 2}$

    **(e)** $x \mapsto \ln(\ln x)$

    **(f)** $x \mapsto \ln\big(\ln(\ln x)\big)$

    Simplifier l'expression (a), puis tracer sans calcul la courbe de la fonction qu'elle définit.
  corrige: |
    **(a)** Le trinôme se factorise : $2x^{2} - 12x + 18 = 2(x - 3)^{2} \geqslant 0$ pour tout réel $x$. 
    $$\boxed{D = \mathbb{R}}$$
     **(b)** On a $x^{2} + 4x + 4 = (x + 2)^{2}$, qui est strictement positif sauf en $-2$. 
    $$\boxed{D = \,]-\infty\,,-2[\, \cup \,]-2\,,+\infty[}$$
     **(c)** Il faut $x \neq -7$ et $8 - 16x \geqslant 0$, puisque le dénominateur est un carré strictement positif. 
    $$\boxed{D = \,]-\infty\,,-7[\, \cup \,\Big]-7\,,\frac{1}{2}\Big]}$$
     **(d)** Il faut à la fois $x < 3$, $x \geqslant 1$ et $x \neq 2$. 
    $$\boxed{D = [1\,,2[\, \cup \,]2\,,3[}$$
     **(e)** Il faut $x > 0$ pour définir $\ln x$, puis $\ln x > 0$, c'est-à-dire $x > 1$. 
    $$\boxed{D = \,]1\,,+\infty[}$$
     **(f)** Il faut de plus $\ln(\ln x) > 0$, soit $\ln x > 1$, c'est-à-dire $x > \mathrm{e}$. 
    $$\boxed{D = \,]\mathrm{e}\,,+\infty[}$$

    La fonction (a) s'écrit, puisque $\sqrt{a^{2}} = |a|$ pour tout réel $a$, 
    $$\boxed{\sqrt{2x^{2} - 12x + 18} = \sqrt{2}\,|x - 3|}.$$
     Sa courbe est formée de deux demi-droites issues du point $(3, 0)$, de pentes $-\sqrt{2}$ et $\sqrt{2}$ : c'est la courbe de $x \mapsto \sqrt{2}\,|x|$ translatée de $3\vec{\imath}$.

    ![Figure](documents/figures/8481d4c5b18b9bcc.svg)

    La figure montre un « V » de sommet $(3, 0)$, qui coupe l'axe des ordonnées en $3\sqrt{2}$ ; la racine carrée d'un carré produit une valeur absolue, et donc un point anguleux.

    *Piège :* en (b), on écrit souvent $\ln\big((x + 2)^{2}\big) = 2\ln(x + 2)$, ce qui réduirait l'ensemble de définition à $]-2\,,+\infty[$ ; la formule correcte est $2\ln|x + 2|$.
- id: "ma-05-02"
  feuille: "f-ma-05"
  numero: 2
  partie: "Généralités sur les fonctions"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [généralités sur les fonctions, parité et périodicité, "dérivée d'une composée"]
  noeuds: [de-monotonie, de-composee]
  notions: []
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Dans chacun des cas suivants, dire si la parité de la fonction obtenue est déterminée par les hypothèses ; si oui, la démontrer, et sinon, donner deux exemples qui aboutissent à des conclusions différentes.

    **1.** La somme $f + g$, puis le produit $fg$, de deux fonctions $f$ et $g$ définies sur $\mathbb{R}$, lorsque $f$ et $g$ sont toutes deux paires, toutes deux impaires, ou l'une paire et l'autre impaire.

    **2.** La composée $g \circ f$ de deux fonctions de $\mathbb{R}$ dans $\mathbb{R}$, dans les quatre cas de parité possibles.

    **3.** La composée $h \circ f$, puis la composée $f \circ h$, lorsque $f$ est paire et que $h$ est une fonction quelconque de $\mathbb{R}$ dans $\mathbb{R}$.
  corrige: |
    **1.** Si $f$ et $g$ sont paires, $(f + g)(-x) = f(x) + g(x)$ et $(fg)(-x) = f(x)g(x)$ : $f + g$ et $fg$ sont paires. Si elles sont impaires, $(f + g)(-x) = -(f + g)(x)$ et $(fg)(-x) = (-f(x))(-g(x)) = (fg)(x)$. Si $f$ est paire et $g$ impaire, $(fg)(-x) = -f(x)g(x)$. 
    $$\boxed{\begin{array}{c|c|c} & f + g & fg \\ \hline \text{paire, paire} & \text{paire} & \text{paire} \\ \text{impaire, impaire} & \text{impaire} & \text{paire} \\ \text{paire, impaire} & \text{non déterminée} & \text{impaire} \end{array}}$$
     Pour la somme d'une fonction paire et d'une fonction impaire, $x \mapsto x^{2} + x$ n'est ni paire ni impaire, puisqu'elle vaut $2$ en $1$ et $0$ en $-1$, alors que $x^{2} + 0$ est paire, la fonction nulle étant impaire.

    **2.** Si $f$ est paire, $g(f(-x)) = g(f(x))$ pour toute fonction $g$. Si $f$ est impaire, $g(f(-x)) = g(-f(x))$, qui vaut $g(f(x))$ si $g$ est paire et $-g(f(x))$ si $g$ est impaire. 
    $$\boxed{g \circ f \text{ est paire dès que } f \text{ est paire ou } g \text{ paire} ; \ \text{impaire si } f \text{ et } g \text{ sont impaires}}$$
     Les quatre cas sont donc déterminés.

    **3.** Le calcul précédent montre que $h \circ f$ est paire pour toute fonction $h$. En revanche, la parité de $f \circ h$ n'est pas déterminée : avec $f(x) = x^{2}$, la fonction $h = \mathrm{id}_{\mathbb{R}}$ donne $f \circ h = f$, paire, alors que $h : x \mapsto x + 1$ donne $x \mapsto (x + 1)^{2}$, qui n'est ni paire ni impaire. 
    $$\boxed{h \circ f \text{ est paire} \qquad f \circ h \text{ : rien en général}}$$

    *À retenir :* c'est la fonction appliquée *en premier* qui transmet sa parité.
- id: "ma-05-03"
  feuille: "f-ma-05"
  numero: 3
  partie: "Généralités sur les fonctions"
  etoiles: 1
  types: [Calcul]
  mots_cles: [généralités sur les fonctions, exponentielle]
  noeuds: [de-monotonie, ex-exponentielle]
  notions: [exponentielle]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Étudier la parité des fonctions suivantes, définies sur $\mathbb{R}$.

    **(a)** $x \mapsto \mathrm{e}^{x} - \mathrm{e}^{-x}$

    **(b)** $x \mapsto \dfrac{\mathrm{e}^{2x} - 1}{\mathrm{e}^{2x} + 1}$

    **(c)** $x \mapsto \dfrac{\mathrm{e}^{x}}{(\mathrm{e}^{x} + 1)^{2}}$

    **(d)** $x \mapsto \dfrac{1}{\mathrm{e}^{x} + 1} - \dfrac{1}{2}$

    Que dire de la courbe de $x \mapsto \dfrac{1}{\mathrm{e}^{x} + 1}$ ?
  corrige: |
    Les quatre fonctions sont définies sur $\mathbb{R}$, qui est symétrique. Pour (b) et (c), on multiplie numérateur et dénominateur par une puissance de $\mathrm{e}^{x}$.

    • **(a)** $\mathrm{e}^{-x} - \mathrm{e}^{x} = -(\mathrm{e}^{x} - \mathrm{e}^{-x})$ : $\boxed{\text{impaire}}$

    • **(b)** $\dfrac{\mathrm{e}^{-2x} - 1}{\mathrm{e}^{-2x} + 1} = \dfrac{1 - \mathrm{e}^{2x}}{1 + \mathrm{e}^{2x}}$ en multipliant par $\mathrm{e}^{2x}$ : $\boxed{\text{impaire}}$

    • **(c)** $\dfrac{\mathrm{e}^{-x}}{(\mathrm{e}^{-x} + 1)^{2}} = \dfrac{\mathrm{e}^{-x}\,\mathrm{e}^{2x}}{(1 + \mathrm{e}^{x})^{2}} = \dfrac{\mathrm{e}^{x}}{(\mathrm{e}^{x} + 1)^{2}}$ : $\boxed{\text{paire}}$

    • **(d)** $\dfrac{1}{\mathrm{e}^{-x} + 1} = \dfrac{\mathrm{e}^{x}}{1 + \mathrm{e}^{x}} = 1 - \dfrac{1}{\mathrm{e}^{x} + 1}$, d'où $\dfrac{1}{\mathrm{e}^{-x} + 1} - \dfrac{1}{2} = -\Big(\dfrac{1}{\mathrm{e}^{x} + 1} - \dfrac{1}{2}\Big)$ : $\boxed{\text{impaire}}$

    La fonction $u : x \mapsto \frac{1}{\mathrm{e}^{x} + 1}$ s'écrit $u = \frac{1}{2} + v$, avec $v$ impaire. D'après la proposition 1 du cours, sa courbe est la translatée de $\frac{1}{2}\vec{\jmath}$ d'une courbe symétrique par rapport à l'origine. 
    $$\boxed{\text{la courbe de } u \text{ admet le point } \Big(0, \frac{1}{2}\Big) \text{ pour centre de symétrie}}$$
     Les fonctions (a) et (b) sont $2\operatorname{sh}$ et $\operatorname{th}$, que le cours étudie en section 5.7.
- id: "ma-05-04"
  feuille: "f-ma-05"
  numero: 4
  partie: "Généralités sur les fonctions"
  etoiles: 2
  types: [Calcul]
  mots_cles: [généralités sur les fonctions, logarithme]
  noeuds: [de-monotonie, ex-logarithme]
  notions: [logarithme]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Pour chacune des fonctions suivantes, donner l'ensemble de définition, puis expliquer comment sa courbe se déduit, par des translations, des affinités ou des symétries, de celle d'une fonction de référence. Tracer enfin rapidement la courbe.

    **(a)** $x \mapsto 2\ln\dfrac{1}{2 - x}$

    **(b)** $x \mapsto \sqrt{3x - 2} - 1$

    **(c)** $x \mapsto \dfrac{4}{2x + 1} + 3$
  corrige: |
    **(a)** L'expression a un sens pour $x < 2$, et vaut $-2\ln(2 - x)$. On part de $\ln$, on prend le symétrique par rapport à $(Oy)$, ce qui donne $x \mapsto \ln(-x)$, puis on translate de $2\vec{\imath}$, ce qui donne la fonction $x \mapsto \ln\big(-(x - 2)\big) = \ln(2 - x)$, et l'on applique enfin l'affinité d'axe $(Ox)$ et de rapport $-2$. 
    $$\boxed{D = \,]-\infty\,,2[ \qquad \text{asymptote verticale } x = 2, \ \text{courbe passant par } (1, 0)}$$
     **(b)** L'expression a un sens pour $x \geqslant \frac{2}{3}$, et $\sqrt{3x - 2} - 1 = \sqrt{3\big(x - \frac{2}{3}\big)} - 1$. On part de $\sqrt{\cdot}$, on applique l'affinité d'axe $(Oy)$ de rapport $\frac{1}{3}$ (proposition 1, (iii)), on translate de $\frac{2}{3}\vec{\imath}$, puis de $-\vec{\jmath}$. 
    $$\boxed{D = \Big[\frac{2}{3}\,,+\infty\Big[ \qquad \text{origine de la courbe en } \Big(\frac{2}{3}, -1\Big), \ \text{passage par } (1, 0)}$$
     **(c)** L'expression a un sens pour $x \neq -\frac{1}{2}$, et $\frac{4}{2x + 1} + 3 = \dfrac{2}{x + \frac{1}{2}} + 3$. On part de l'hyperbole $y = \frac{1}{x}$, on applique l'affinité d'axe $(Ox)$ de rapport $2$, puis la translation de vecteur $-\frac{1}{2}\vec{\imath} + 3\vec{\jmath}$. 
    $$\boxed{D = \mathbb{R} \setminus \Big\{-\frac{1}{2}\Big\} \qquad \text{asymptotes } x = -\frac{1}{2} \text{ et } y = 3, \ \text{centre de symétrie } \Big(-\frac{1}{2}, 3\Big)}$$

    ![Figure](documents/figures/0217da726d9a8053.svg)

    Les asymptotes sont en pointillés ocre : chaque courbe garde la forme de sa courbe de référence, seuls son emplacement et ses proportions changent.
- id: "ma-05-05"
  feuille: "f-ma-05"
  numero: 5
  partie: "Généralités sur les fonctions"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [généralités sur les fonctions, parité et périodicité, variations]
  noeuds: [de-monotonie]
  notions: []
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $D$ une partie de $\mathbb{R}$ et $T > 0$. On dit que $D$ est *$T$-périodique* si, pour tout $x \in D$, les réels $x + T$ et $x - T$ appartiennent encore à $D$. On note $\mathbb{1}_{D}$ la fonction indicatrice de $D$, définie sur $\mathbb{R}$ comme au chapitre 2.

    **1.** Montrer que $D$ est $T$-périodique si et seulement si la fonction $\mathbb{1}_{D}$ est $T$-périodique. Donner un exemple de partie $D$ qui soit $1$-périodique, sans être $T$-périodique pour aucun $T \in \,]0\,,1[$.

    **2.** À quelle condition portant sur $D$ la fonction $\mathbb{1}_{D}$ est-elle paire ? impaire ?

    **3.** À quelle condition portant sur $D$ la fonction $\mathbb{1}_{D}$ est-elle croissante ?
  corrige: |
    **1.** Supposons $D$ $T$-périodique, et soit $x \in \mathbb{R}$. Si $x \in D$, alors $x + T \in D$. Si $x \notin D$, alors $x + T \notin D$, sinon $x = (x + T) - T$ serait dans $D$. Dans les deux cas $\mathbb{1}_{D}(x + T) = \mathbb{1}_{D}(x)$. Réciproquement, si $\mathbb{1}_{D}$ est $T$-périodique et $x \in D$, alors $\mathbb{1}_{D}(x \pm T) = \mathbb{1}_{D}(x) = 1$, donc $x \pm T \in D$. 
    $$\boxed{D \text{ est } T\text{-périodique} \iff \mathbb{1}_{D} \text{ est } T\text{-périodique}}$$
     La partie $\mathbb{Z}$ est $1$-périodique ; pour $T \in \,]0\,,1[$, on a $0 \in \mathbb{Z}$ mais $T \notin \mathbb{Z}$, donc $\mathbb{Z}$ n'est pas $T$-périodique.

    **2.** La fonction $\mathbb{1}_{D}$ est paire si et seulement si, pour tout $x$, $x \in D \iff -x \in D$. Elle est impaire si et seulement si $\mathbb{1}_{D}(-x) = -\mathbb{1}_{D}(x)$ pour tout $x$ ; les deux membres étant l'un positif, l'autre négatif, ils sont nuls, ce qui impose $D = \varnothing$. 
    $$\boxed{\mathbb{1}_{D} \text{ paire} \iff D \text{ symétrique par rapport à } 0 \qquad \mathbb{1}_{D} \text{ impaire} \iff D = \varnothing}$$

    **3.** Si $\mathbb{1}_{D}$ est croissante, $x \in D$ et $y \geqslant x$, alors $\mathbb{1}_{D}(y) \geqslant 1$, donc $y \in D$ : avec chaque point, $D$ contient toute la demi-droite à sa droite. Une telle partie, si elle n'est pas vide, est un intervalle, puisque tout réel compris entre deux de ses points est supérieur au premier, et cet intervalle n'est pas majoré. La réciproque est immédiate. 
    $$\boxed{\mathbb{1}_{D} \text{ croissante} \iff D = \varnothing \text{ ou } D \text{ est un intervalle non majoré}}$$
     Ce sont $\varnothing$, $\mathbb{R}$, et les intervalles $[a\,,+\infty[$ et $]a\,,+\infty[$.
- id: "ma-05-06"
  feuille: "f-ma-05"
  numero: 6
  partie: "Généralités sur les fonctions"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [généralités sur les fonctions, parité et périodicité]
  noeuds: [de-monotonie]
  notions: [fonction-periodique]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $\alpha$ un réel non nul. Montrer que la fonction $f : x \mapsto \cos x + \cos(\alpha x)$ est périodique si et seulement si $\alpha$ est rationnel.

    *Indication : si $T > 0$ est une période, comparer $f(T)$ et $f(0)$.*
  corrige: |
    Supposons $f$ périodique, de période $T > 0$. Alors $f(T) = f(0) = 2$. Comme un cosinus vaut au plus $1$, cela impose $\cos T = 1$ et $\cos(\alpha T) = 1$, donc il existe des entiers $k$ et $m$ tels que $T = 2k\pi$ et $\alpha T = 2m\pi$, avec $k \neq 0$ puisque $T > 0$. On en déduit $\alpha = \frac{m}{k}$.

    Réciproquement, si $\alpha = \frac{p}{q}$ avec $p \in \mathbb{Z}^{*}$ et $q \in \mathbb{N}^{*}$, posons $T = 2\pi q$. Alors $\cos(x + T) = \cos x$ et $\cos\big(\alpha x + \alpha T\big) = \cos(\alpha x + 2\pi p) = \cos(\alpha x)$. 
    $$\boxed{f \text{ est périodique} \iff \alpha \in \mathbb{Q}}$$
     Par exemple, $x \mapsto \cos x + \cos(\sqrt{2}\,x)$ n'est pas périodique, bien que ce soit la somme de deux fonctions périodiques.

    *À retenir :* l'argument décisif est que la valeur maximale $2$ n'est atteinte que si les deux cosinus valent $1$ simultanément ; une fonction périodique reprend nécessairement sa valeur en $0$.
- id: "ma-05-07"
  feuille: "f-ma-05"
  numero: 7
  partie: "Généralités sur les fonctions"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [généralités sur les fonctions, variations, "dérivée d'une composée"]
  noeuds: [de-monotonie, de-composee]
  notions: []
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $f : \mathbb{R} \to \mathbb{R}$ une fonction telle que $f \circ f$ soit croissante et que $f \circ f \circ f$ soit strictement décroissante. Montrer que $f$ est strictement décroissante.
  corrige: |
    La fonction $f \circ f \circ f$, strictement monotone, est injective (proposition 2 du cours) ; il en est donc de même de $f$, car $f(x) = f(y)$ entraînerait $f(f(f(x))) = f(f(f(y)))$.

    Soit $x < y$. Supposons par l'absurde $f(x) \leqslant f(y)$ ; par injectivité, $f(x) < f(y)$. La croissance de $f \circ f$, appliquée aux réels $f(x) < f(y)$, donne l'inégalité $(f \circ f)\big(f(x)\big) \leqslant (f \circ f)\big(f(y)\big)$, autrement dit $(f \circ f \circ f)(x) \leqslant (f \circ f \circ f)(y)$, ce qui contredit la décroissance stricte de $f \circ f \circ f$. 
    $$\boxed{f \text{ est strictement décroissante}}$$
     L'astuce est d'appliquer l'hypothèse sur $f \circ f$ non pas à $x$ et $y$, mais à leurs images par $f$.
- id: "ma-05-08"
  feuille: "f-ma-05"
  numero: 8
  partie: "Généralités sur les fonctions"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [généralités sur les fonctions, parité et périodicité]
  noeuds: [de-monotonie]
  notions: []
  page_enonce: 2
  page_corrige: 4
  enonce: |
    On rappelle que la courbe d'une fonction $f$ définie sur $D$ admet le point $\Omega(a, b)$ pour centre de symétrie si, pour tout $x \in D$, le réel $2a - x$ appartient à $D$ et $f(2a - x) = 2b - f(x)$.

    **1.** Montrer que le point $\Omega(a, b)$ est centre de symétrie de la courbe de $f$ si et seulement si la fonction $h \mapsto f(a + h) - b$ est impaire. Interpréter cette condition à l'aide de la proposition 1 du cours.

    **2.** Montrer que la courbe d'équation $y = \dfrac{x + 3}{x + 5}$ admet un centre de symétrie, que l'on précisera.

    **3.** Soit $p$, $q$, $r$, $s$ des réels avec $p \neq 0$. Montrer que la courbe d'équation $y = px^{3} + qx^{2} + rx + s$ admet un centre de symétrie, d'abscisse $-\dfrac{q}{3p}$.

    **4.** Montrer de même que toute parabole d'équation $y = px^{2} + qx + r$, avec $p \neq 0$, admet un axe de symétrie vertical.
  corrige: |
    **1.** Posons $x = a + h$, de sorte que $2a - x = a - h$. La condition $f(2a - x) = 2b - f(x)$ s'écrit $f(a - h) - b = -\big(f(a + h) - b\big)$, et la condition sur l'ensemble de définition dit que $h \mapsto f(a + h) - b$ est définie sur un ensemble symétrique. 
    $$\boxed{\Omega(a, b) \text{ centre de symétrie} \iff h \mapsto f(a + h) - b \text{ impaire}}$$
     D'après la proposition 1, la courbe de $h \mapsto f(a + h) - b$ est l'image de celle de $f$ par la translation de vecteur $-a\vec{\imath} - b\vec{\jmath}$, qui envoie $\Omega$ sur $O$ : on ramène le centre à l'origine.

    **2.** On écrit $\frac{x + 3}{x + 5} = 1 - \frac{2}{x + 5}$. Avec $a = -5$ et $b = 1$, la fonction $h \mapsto -\frac{2}{h}$ est impaire. 
    $$\boxed{\Omega(-5, 1)}$$
     **3.** Soit $a = -\frac{q}{3p}$, de sorte que $3pa + q = 0$. Le développement de $f(a + h)$ donne 
    $$f(a + h) - f(a) = p h^{3} + (3pa + q)h^{2} + (3pa^{2} + 2qa + r)h = p h^{3} + \Big(r - \frac{q^{2}}{3p}\Big)h,$$
     qui est une fonction impaire de $h$. 
    $$\boxed{\text{centre de symétrie } \Big(-\frac{q}{3p}, f\Big(-\frac{q}{3p}\Big)\Big)}$$
     **4.** Avec $a = -\frac{q}{2p}$, on obtient de même $f(a + h) - f(a) = p h^{2}$, fonction paire de $h$ : $f(a - h) = f(a + h)$. 
    $$\boxed{\text{axe de symétrie } x = -\frac{q}{2p}}$$
- id: "ma-05-09"
  feuille: "f-ma-05"
  numero: 9
  partie: "Généralités sur les fonctions"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [généralités sur les fonctions, parité et périodicité, bijection réciproque]
  noeuds: [de-monotonie, c-bijection, de-reciproque]
  notions: [fonction-periodique]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Soit $f : \mathbb{R} \to \mathbb{R}$ une fonction dont la courbe admet deux centres de symétrie distincts $\Omega_{1}(a_{1}, b_{1})$ et $\Omega_{2}(a_{2}, b_{2})$.

    **1.** Montrer que $a_{1} \neq a_{2}$.

    **2.** En composant les deux symétries, montrer que l'on a, pour tout réel $x$, 
    $$f\big(x + 2(a_{2} - a_{1})\big) = f(x) + 2(b_{2} - b_{1}).$$

    **3.** En déduire que $f$ est la somme d'une fonction affine et d'une fonction périodique.

    **4.** Réciproquement, donner l'exemple d'une fonction non affine dont la courbe admet une infinité de centres de symétrie.
  corrige: |
    **1.** Si $a_{1} = a_{2} = a$, alors $f(2a - x) = 2b_{1} - f(x) = 2b_{2} - f(x)$, donc $b_{1} = b_{2}$, et les deux centres seraient confondus. 
    $$\boxed{a_{1} \neq a_{2}}$$
     **2.** On applique la relation du second centre au réel $2a_{1} - x$, puis celle du premier centre : 
    $$f\big(2a_{2} - (2a_{1} - x)\big) = 2b_{2} - f(2a_{1} - x) = 2b_{2} - \big(2b_{1} - f(x)\big).$$

    $$\boxed{f\big(x + 2(a_{2} - a_{1})\big) = f(x) + 2(b_{2} - b_{1})}$$
     **3.** Posons $T = 2(a_{2} - a_{1}) \neq 0$, $\lambda = \frac{b_{2} - b_{1}}{a_{2} - a_{1}}$ et $g(x) = f(x) - \lambda x$. Alors 
    $$g(x + T) = f(x) + 2(b_{2} - b_{1}) - \lambda x - 2\lambda(a_{2} - a_{1}) = g(x).$$

    $$\boxed{f = g + (x \mapsto \lambda x), \ \text{ avec } g \text{ périodique de période } |T|}$$
     **4.** La fonction $x \mapsto x + \sin x$ convient : pour tout $k \in \mathbb{Z}$, puisque $\sin(2k\pi - x) = -\sin x$, on a $f(2k\pi - x) = 2k\pi - x - \sin x = 2k\pi - f(x)$, donc chaque point $(k\pi, k\pi)$ est centre de symétrie. 
    $$\boxed{f(x) = x + \sin x, \ \text{ centres } (k\pi, k\pi), \ k \in \mathbb{Z}}$$
     Géométriquement, composer deux symétries centrales donne une translation : c'est la clef de la question 2, et la raison pour laquelle deux centres en engendrent une infinité.
- id: "ma-05-10"
  feuille: "f-ma-05"
  numero: 10
  partie: "Dérivation"
  etoiles: 1
  types: [Calcul]
  mots_cles: [dérivation, exponentielle, logarithme]
  noeuds: [de-operations, ex-logarithme, ex-exponentielle]
  notions: [derivable, exponentielle, logarithme]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Pour chacune des fonctions suivantes, déterminer l'ensemble de définition, préciser un ensemble sur lequel la fonction est dérivable d'après les théorèmes du cours, et calculer sa dérivée.

    **(a)** $x \mapsto \ln(1 + 2\cos x)$

    **(b)** $x \mapsto \sqrt{\sqrt{x - 2} - 1}$

    **(c)** $x \mapsto \exp\Big(-\dfrac{1}{x^{2}}\Big)$

    **(d)** $x \mapsto \sqrt{x + \sqrt{x}}$

    **(e)** $x \mapsto \dfrac{\cos(2x)}{x^{2} - 2}$

    **(f)** $x \mapsto \sin x \, \sin\dfrac{1}{x}$
  corrige: |
    On applique chaque fois les règles de la proposition 3, en particulier la dérivation d'une composée. Une racine carrée n'est dérivable, d'après le cours, que là où son argument est strictement positif.

    **(a)** Il faut $1 + 2\cos x > 0$, soit $\cos x > -\frac{1}{2}$. La fonction est dérivable sur son ensemble de définition, et 
    $$\boxed{D = \bigcup_{k \in \mathbb{Z}}\,\Big]-\frac{2\pi}{3} + 2k\pi\,,\frac{2\pi}{3} + 2k\pi\Big[ \qquad f'(x) = \frac{-2\sin x}{1 + 2\cos x}}$$
     **(b)** Il faut $x \geqslant 2$ et $\sqrt{x - 2} \geqslant 1$, soit $x \geqslant 3$ ; les deux racines ont un argument strictement positif pour $x > 3$. 
    $$\boxed{D = [3\,,+\infty[ \qquad f'(x) = \frac{1}{4\sqrt{x - 2}\,\sqrt{\sqrt{x - 2} - 1}} \ \text{ sur } ]3\,,+\infty[}$$
     **(c)** La fonction est définie et dérivable sur $\mathbb{R}^{*}$, et la dérivée de $-\frac{1}{x^{2}}$ est $\frac{2}{x^{3}}$. 
    $$\boxed{D = \mathbb{R}^{*} \qquad f'(x) = \frac{2}{x^{3}}\,\exp\Big(-\frac{1}{x^{2}}\Big)}$$
     **(d)** Il faut $x \geqslant 0$, et alors $x + \sqrt{x} \geqslant 0$ ; pour $x > 0$, les deux arguments sont strictement positifs. 
    $$\boxed{D = [0\,,+\infty[ \qquad f'(x) = \frac{1 + \frac{1}{2\sqrt{x}}}{2\sqrt{x + \sqrt{x}}} = \frac{2\sqrt{x} + 1}{4\sqrt{x}\,\sqrt{x + \sqrt{x}}} \ \text{ sur } ]0\,,+\infty[}$$
     **(e)** Il faut $x^{2} \neq 2$, et la formule du quotient donne 
    $$\boxed{D = \mathbb{R} \setminus \{-\sqrt{2}, \sqrt{2}\} \qquad f'(x) = \frac{-2(x^{2} - 2)\sin(2x) - 2x\cos(2x)}{(x^{2} - 2)^{2}}}$$
     **(f)** La fonction est définie et dérivable sur $\mathbb{R}^{*}$, et la dérivée de $\sin\frac{1}{x}$ est $-\frac{1}{x^{2}}\cos\frac{1}{x}$. 
    $$\boxed{D = \mathbb{R}^{*} \qquad f'(x) = \cos x\,\sin\frac{1}{x} - \frac{\sin x}{x^{2}}\cos\frac{1}{x}}$$

    *Attention :* en (b) et en (d), le cours ne permet pas de conclure à la dérivabilité aux points $3$ et $0$ ; on verra au chapitre 9 que ces fonctions n'y sont effectivement pas dérivables, leur courbe ayant une tangente verticale.
- id: "ma-05-11"
  feuille: "f-ma-05"
  numero: 11
  partie: "Dérivation"
  etoiles: 1
  types: [Calcul]
  mots_cles: [dérivation, parité et périodicité, logarithme]
  noeuds: [de-operations, ex-logarithme]
  notions: [derivable, logarithme]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Pour chacune des fonctions suivantes, déterminer l'ensemble de définition, rechercher une périodicité, une parité, ou une symétrie de la courbe par rapport à une droite verticale $x = a$ ou à un point $\Omega(a, b)$, en utilisant les critères $f(a - x) = f(a + x)$ et $f(a - x) + f(a + x) = 2b$ du cours. En déduire un intervalle d'étude aussi petit que possible, et expliquer comment on reconstitue la courbe entière à partir de la courbe tracée sur cet intervalle.

    **(a)** $x \mapsto \cos x + \cos(2x)$

    **(b)** $x \mapsto \sin^{3} x$

    **(c)** $x \mapsto \dfrac{1}{2 + \sin x}$

    **(d)** $x \mapsto |\sin x|$

    **(e)** $x \mapsto \dfrac{x}{x - 1}$

    **(f)** $x \mapsto \ln\big(x(2 - x)\big)$
  corrige: |
    On applique la méthode du cours : une période $T$ ramène l'étude à un intervalle de longueur $T$ ; une parité, ou une symétrie d'axe $x = a$, ou de centre $\Omega(a, b)$, la ramène ensuite à la moitié de cet intervalle, située d'un côté de $0$ ou de $a$.

    **(a)** La fonction est définie sur $\mathbb{R}$, $2\pi$-périodique, et paire puisque le cosinus l'est. On l'étudie sur une demi-période à droite de $0$. 
    $$\boxed{\text{étude sur } [0\,,\pi] ; \text{ symétrie d'axe } (Oy), \text{ puis translations de } 2k\pi\,\vec{\imath}}$$
     **(b)** La fonction est définie sur $\mathbb{R}$, $2\pi$-périodique et impaire. De plus, $\sin(\frac{\pi}{2} - x) = \cos x = \sin(\frac{\pi}{2} + x)$, donc $\sin^{3}(\frac{\pi}{2} - x) = \sin^{3}(\frac{\pi}{2} + x)$ : la courbe est symétrique par rapport à la droite $x = \frac{\pi}{2}$, comme celle du sinus. 
    $$\boxed{\text{étude sur } \Big[0\,,\frac{\pi}{2}\Big] ; \text{ symétrie d'axe } x = \tfrac{\pi}{2}, \text{ puis de centre } O, \text{ puis translations}}$$
     **(c)** Comme $2 + \sin x \geqslant 1$, la fonction est définie sur $\mathbb{R}$ ; elle est $2\pi$-périodique, mais ni paire ni impaire, puisqu'elle vaut $\frac{1}{3}$ en $\frac{\pi}{2}$ et $1$ en $-\frac{\pi}{2}$. Comme en (b), $\sin(\frac{\pi}{2} - x) = \sin(\frac{\pi}{2} + x)$, donc la courbe est symétrique par rapport à la droite $x = \frac{\pi}{2}$. On étudie la fonction sur une demi-période à droite de $\frac{\pi}{2}$. 
    $$\boxed{\text{étude sur } \Big[\frac{\pi}{2}\,,\frac{3\pi}{2}\Big] ; \text{ symétrie d'axe } x = \tfrac{\pi}{2}, \text{ puis translations}}$$
     La périodicité donne alors aussi l'axe $x = \frac{3\pi}{2}$, image du premier par la translation de $\pi$ dans un sens et de $-\pi$ dans l'autre : on pouvait choisir indifféremment $[-\frac{\pi}{2}\,,\frac{\pi}{2}]$.

    **(d)** La fonction est définie sur $\mathbb{R}$, paire, et $\pi$-périodique, puisque $|\sin(x + \pi)| = |-\sin x| = |\sin x|$. La plus petite période n'est donc pas celle du sinus. 
    $$\boxed{\text{étude sur } \Big[0\,,\frac{\pi}{2}\Big] ; \text{ symétrie d'axe } (Oy), \text{ puis translations de } k\pi\,\vec{\imath}}$$
     L'erreur la plus répandue est de prendre $2\pi$ pour période parce que le sinus l'est : on étudierait alors deux fois la même arche.

    **(e)** La fonction est définie sur $D = \mathbb{R} \setminus \{1\}$, qui est symétrique par rapport à $1$. Pour $x \neq 0$, 
    $$f(1 + x) = \frac{1 + x}{x} = 1 + \frac{1}{x} \qquad\text{et}\qquad f(1 - x) = \frac{1 - x}{-x} = 1 - \frac{1}{x},$$
     donc $f(1 - x) + f(1 + x) = 2 = 2 \times 1$ : la courbe, qui est une hyperbole, est symétrique par rapport au point $\Omega(1, 1)$. 
    $$\boxed{\text{étude sur } ]1\,,+\infty[ ; \text{ symétrie de centre } \Omega(1, 1)}$$
     **(f)** Il faut $x(2 - x) > 0$, c'est-à-dire $x \in \,]0\,,2[$, intervalle symétrique par rapport à $1$. Pour $x \in \,]-1\,,1[$, on a $(1 + x)(1 - x) = (1 - x)(1 + x)$, donc $f(1 - x) = f(1 + x)$ : la courbe est symétrique par rapport à la droite $x = 1$. 
    $$\boxed{\text{étude sur } [1\,,2[ ; \text{ symétrie d'axe } x = 1}$$
     Dans les deux derniers cas, aucune périodicité n'intervient : la symétrie par rapport à une droite verticale ou à un point n'est pas réservée aux fonctions trigonométriques.
- id: "ma-05-12"
  feuille: "f-ma-05"
  numero: 12
  partie: "Dérivation"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [dérivation]
  noeuds: [de-operations]
  notions: [derivable]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Pour tout réel $m$, on note $C_{m}$ la courbe de la fonction $f_{m} : x \mapsto \dfrac{x + m}{x^{2} + 1}$.

    **1.** Montrer que les tangentes aux courbes $C_{m}$ en leur point d'abscisse $0$ sont parallèles.

    **2.** Montrer que les tangentes aux courbes $C_{m}$ en leur point d'abscisse $1$ sont concourantes, en un point que l'on déterminera.
  corrige: |
    La formule du quotient donne, pour tout réel $x$, 
    $$f_{m}'(x) = \frac{(x^{2} + 1) - 2x(x + m)}{(x^{2} + 1)^{2}} = \frac{1 - 2mx - x^{2}}{(x^{2} + 1)^{2}}.$$
     **1.** On a $f_{m}'(0) = 1$ pour tout $m$ : toutes les tangentes en $0$ ont la même pente. 
    $$\boxed{T_{0} : y = x + m, \ \text{ de pente } 1 \text{ pour tout } m}$$
     **2.** On a $f_{m}(1) = \frac{1 + m}{2}$ et $f_{m}'(1) = -\frac{m}{2}$, d'où la tangente 
    $$y = \frac{1 + m}{2} - \frac{m}{2}(x - 1) = \frac{1}{2} + \frac{m}{2}(2 - x).$$
     En $x = 2$, on obtient $y = \frac{1}{2}$ quel que soit $m$. 
    $$\boxed{\text{toutes les tangentes en } 1 \text{ passent par le point } \Big(2, \frac{1}{2}\Big)}$$
     La méthode consiste à écrire l'équation de la tangente comme une expression *affine en $m$*, puis à annuler le coefficient de $m$.
- id: "ma-05-13"
  feuille: "f-ma-05"
  numero: 13
  partie: "Dérivation"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [dérivation, exponentielle, logarithme]
  noeuds: [de-operations, ex-logarithme, ex-exponentielle]
  notions: [derivable, exponentielle, logarithme]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    **1.** Existe-t-il un point de la courbe du logarithme népérien en lequel la tangente passe par l'origine ?

    **2.** On cherche le point de la courbe d'équation $y = \mathrm{e}^{x}$ le plus proche de l'origine $O$. Montrer que la fonction $g : x \mapsto x + \mathrm{e}^{2x}$ s'annule en un unique réel $x_{0}$, et que $x_{0} \in \,]-1\,,0[$. En déduire que le point $M_{0}(x_{0}, \mathrm{e}^{x_{0}})$ répond à la question.

    **3.** Montrer que la tangente à la courbe en $M_{0}$ est perpendiculaire à la droite $(OM_{0})$. Interpréter géométriquement.
  corrige: |
    **1.** La tangente à la courbe de $\ln$ au point d'abscisse $a > 0$ a pour équation $y = \ln a + \frac{1}{a}(x - a)$. Elle passe par l'origine si et seulement si $\ln a - 1 = 0$. 
    $$\boxed{a = \mathrm{e}, \ \text{ tangente } y = \frac{x}{\mathrm{e}}}$$
     **2.** La fonction $g$ est dérivable sur $\mathbb{R}$, et $g'(x) = 1 + 2\mathrm{e}^{2x} > 0$ : elle est strictement croissante. Comme $g(-1) = -1 + \mathrm{e}^{-2} < 0$ et $g(0) = 1 > 0$, et que $g([-1\,,0])$ est un intervalle d'après le théorème 2, la valeur $0$ est atteinte en un point $x_{0}$ de $]-1\,,0[$, et en un seul par stricte monotonie.

    Le carré de la distance de $O$ au point $(x, \mathrm{e}^{x})$ est $d(x) = x^{2} + \mathrm{e}^{2x}$, et $d'(x) = 2x + 2\mathrm{e}^{2x} = 2g(x)$. Ainsi $d$ décroît sur $]-\infty\,,x_{0}]$ et croît sur $[x_{0}\,,+\infty[$ : elle atteint son minimum en $x_{0}$. 
    $$\boxed{M_{0}(x_{0}, \mathrm{e}^{x_{0}}) \text{ avec } x_{0} + \mathrm{e}^{2x_{0}} = 0, \quad x_{0} \approx -0{,}426}$$
     **3.** Un vecteur directeur de la tangente en $M_{0}$ est $\vec{u}(1, \mathrm{e}^{x_{0}})$, et $\overrightarrow{OM_{0}}$ a pour coordonnées $(x_{0}, \mathrm{e}^{x_{0}})$. Leur produit scalaire vaut $x_{0} + \mathrm{e}^{2x_{0}} = g(x_{0}) = 0$. 
    $$\boxed{\text{la tangente en } M_{0} \text{ est perpendiculaire à } (OM_{0})}$$
     Le cercle de centre $O$ passant par $M_{0}$ est donc tangent à la courbe en $M_{0}$ : la courbe reste à l'extérieur de ce cercle, ce qui est une autre façon de dire que $M_{0}$ est le point le plus proche.
- id: "ma-05-14"
  feuille: "f-ma-05"
  numero: 14
  partie: "Dérivation"
  etoiles: 2
  types: [Calcul]
  mots_cles: [dérivation, asymptotes, exponentielle]
  noeuds: [de-operations, ex-exponentielle]
  notions: [derivable, exponentielle]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Étudier les branches infinies des fonctions suivantes : asymptotes éventuelles, et position de la courbe par rapport à ses asymptotes obliques lorsque c'est possible.

    **(a)** $x \mapsto \dfrac{2x^{2} - 3x + 1}{x + 2}$

    **(b)** $x \mapsto \sqrt{x^{2} + x + 1}$

    **(c)** $x \mapsto x\,\mathrm{e}^{1/x}$, en $\pm\infty$

    **(d)** $x \mapsto x + \sqrt{x}$, en $+\infty$

    Pour (b), l'erreur la plus répandue est d'annoncer la même asymptote en $+\infty$ et en $-\infty$ : expliquer pourquoi elle est fausse.
  corrige: |
    **(a)** La division euclidienne donne $\frac{2x^{2} - 3x + 1}{x + 2} = 2x - 7 + \frac{15}{x + 2}$. Le dernier terme tend vers $0$ en $\pm\infty$ et vers $\pm\infty$ en $-2$, et il est du signe de $x + 2$. 
    $$\boxed{\text{asymptotes } y = 2x - 7 \text{ en } \pm\infty \text{ et } x = -2}$$
     La courbe est au-dessus de l'asymptote oblique pour $x > -2$, au-dessous pour $x < -2$.

    **(b)** La fonction est définie sur $\mathbb{R}$, puisque $x^{2} + x + 1 = \big(x + \frac{1}{2}\big)^{2} + \frac{3}{4} > 0$. On multiplie par la quantité conjuguée : 
    $$\sqrt{x^{2} + x + 1} - \Big(x + \frac{1}{2}\Big) = \frac{3/4}{\sqrt{x^{2} + x + 1} + x + \frac{1}{2}} \qquad \sqrt{x^{2} + x + 1} + \Big(x + \frac{1}{2}\Big) = \frac{3/4}{\sqrt{x^{2} + x + 1} - x - \frac{1}{2}}.$$
     La première quantité tend vers $0$ en $+\infty$, la seconde en $-\infty$, et toutes deux sont positives là où on les utilise. 
    $$\boxed{y = x + \frac{1}{2} \text{ en } +\infty, \qquad y = -x - \frac{1}{2} \text{ en } -\infty, \qquad \text{courbe au-dessus de chacune}}$$
     L'erreur annoncée vient de ce que $\sqrt{x^{2}} = |x|$ et non $x$ : la courbe est symétrique par rapport à la droite $x = -\frac{1}{2}$, et ses deux asymptotes le sont aussi.

    **(c)** On pose $h = \frac{1}{x}$, qui tend vers $0$ en $\pm\infty$. Alors $x\,\mathrm{e}^{1/x} - (x + 1) = \frac{\mathrm{e}^{h} - 1 - h}{h}$, et $\frac{\mathrm{e}^{h} - 1}{h}$ tend vers $\exp'(0) = 1$ : la différence tend vers $0$. L'inégalité $\mathrm{e}^{h} \geqslant 1 + h$ de la proposition 5 donne son signe, celui de $h$. 
    $$\boxed{\text{asymptote } y = x + 1 \text{ en } \pm\infty ; \ \text{courbe au-dessus en } +\infty, \text{ au-dessous en } -\infty}$$
     **(d)** On a $\frac{f(x)}{x} = 1 + \frac{1}{\sqrt{x}} \to 1$, mais $f(x) - x = \sqrt{x} \to +\infty$. 
    $$\boxed{\text{branche parabolique de direction } y = x, \ \text{pas d'asymptote}}$$
- id: "ma-05-15"
  feuille: "f-ma-05"
  numero: 15
  partie: "Dérivation"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [dérivation, parité et périodicité, variations]
  noeuds: [de-operations, de-monotonie]
  notions: [derivable, fonction-periodique]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    On considère la fonction $f : x \mapsto 2\sin x + \sin(2x)$, définie sur $\mathbb{R}$.

    **1.** Montrer que $f$ est $2\pi$-périodique et impaire, et en déduire qu'il suffit de l'étudier sur $[0\,,\pi]$.

    **2.** Montrer que, pour tout réel $x$, $f'(x) = 2\,(2\cos x - 1)(\cos x + 1)$.

    **3.** Dresser le tableau de variations de $f$ sur $[0\,,\pi]$. Quelle est la plus grande valeur prise par $f$ sur $\mathbb{R}$ ?

    **4.** Déterminer les tangentes à la courbe aux points d'abscisses $0$ et $\pi$. Montrer que la courbe est symétrique par rapport au point $(\pi, 0)$ ; que se passe-t-il en ce point ?

    **5.** Tracer la courbe de $f$ sur $[-2\pi\,,2\pi]$.
  corrige: |
    **1.** Le sinus est $2\pi$-périodique, et $\sin\big(2(x + 2\pi)\big) = \sin(2x + 4\pi) = \sin(2x)$ : la fonction $f$ est $2\pi$-périodique. Le sinus est impair, donc $f(-x) = -2\sin x - \sin(2x) = -f(x)$ : la fonction $f$ est impaire. La périodicité ramène l'étude à $[-\pi\,,\pi]$, et l'imparité à 
    $$\boxed{[0\,,\pi]} ;$$
     on complète la courbe par la symétrie de centre $O$, puis par les translations de vecteurs $2k\pi\,\vec{\imath}$.

    **2.** La fonction $f$ est dérivable sur $\mathbb{R}$, et, avec $\cos(2x) = 2\cos^{2} x - 1$, 
    $$f'(x) = 2\cos x + 2\cos(2x) = 2\,(2\cos^{2} x + \cos x - 1).$$
     Le trinôme $2c^{2} + c - 1$ a pour racines $-1$ et $\frac{1}{2}$, donc $2c^{2} + c - 1 = (2c - 1)(c + 1)$, et 
    $$\boxed{f'(x) = 2\,(2\cos x - 1)(\cos x + 1)}.$$
     **3.** Le facteur $\cos x + 1$ est positif, et ne s'annule sur $[0\,,\pi]$ qu'en $\pi$. Le facteur $2\cos x - 1$ est positif sur $[0\,,\frac{\pi}{3}]$ et négatif sur $[\frac{\pi}{3}\,,\pi]$, puisque le cosinus décroît sur $[0\,,\pi]$ et vaut $\frac{1}{2}$ en $\frac{\pi}{3}$. On calcule 
    $$f\Big(\frac{\pi}{3}\Big) = 2 \cdot \frac{\sqrt{3}}{2} + \frac{\sqrt{3}}{2} = \frac{3\sqrt{3}}{2} \approx 2{,}60.$$

    ![Figure](documents/figures/263dd70cf13291ee.svg)

    Sur $[0\,,\pi]$, la fonction prend ses valeurs dans $[0\,,\frac{3\sqrt{3}}{2}]$ ; par imparité, elle les prend dans $[-\frac{3\sqrt{3}}{2}\,,\frac{3\sqrt{3}}{2}]$ sur $[-\pi\,,\pi]$, puis sur $\mathbb{R}$ par périodicité. 
    $$\boxed{\max_{\mathbb{R}} f = \frac{3\sqrt{3}}{2}, \text{ atteint en } \frac{\pi}{3} + 2k\pi, \ k \in \mathbb{Z}}$$
     **4.** On a $f(0) = 0$ et $f'(0) = 2 \times 1 \times 2 = 4$, puis $f(\pi) = 0$ et $f'(\pi) = 0$. 
    $$\boxed{\text{tangente } y = 4x \text{ en } 0 ; \quad \text{tangente horizontale } y = 0 \text{ en } \pi}$$
     Pour la symétrie, la périodicité puis l'imparité donnent $f(\pi + x) = f(x - \pi) = -f(\pi - x)$, c'est-à-dire $f(\pi - x) + f(\pi + x) = 0 = 2 \times 0$ : la courbe est symétrique par rapport au point $(\pi, 0)$. Ce résultat vaut pour toute fonction impaire et $2\pi$-périodique. En ce point, la tangente est l'axe des abscisses, et la courbe la traverse : elle est au-dessus de l'axe juste avant $\pi$, puisque $f > 0$ sur $]0\,,\pi[$, et au-dessous juste après, par symétrie. Une tangente horizontale ne signale donc pas toujours un extremum, comme pour $x \mapsto x^{3}$ en $0$.

    **5.** On trace l'arc sur $[0\,,\pi]$, on le complète par la symétrie de centre $O$, puis par translation de $\pm 2\pi$.

    ![Figure](documents/figures/a77979e2b5c4ead5.svg)

    La figure montre l'arche dissymétrique sur $[0\,,\pi]$ : la courbe monte vite depuis l'origine, avec la pente $4$, jusqu'au maximum atteint dès $\frac{\pi}{3}$, puis redescend lentement pour arriver en $\pi$ avec une tangente horizontale, où elle traverse l'axe ; chaque point d'abscisse $k\pi$ est un centre de symétrie de la courbe.
- id: "ma-05-16"
  feuille: "f-ma-05"
  numero: 16
  partie: "Dérivation"
  etoiles: 2
  types: [Calcul]
  mots_cles: [dérivation, variations, asymptotes]
  noeuds: [de-operations, de-monotonie]
  notions: [derivable]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    On considère la fonction $f : x \mapsto \dfrac{x^{2} - 3x + 3}{x - 1}$.

    **1.** Déterminer l'ensemble de définition $D$ de $f$, et montrer que $f(1 - x) + f(1 + x) = -2$ pour tout réel $x$ non nul. Interpréter géométriquement, et en déduire un intervalle d'étude.

    **2.** Déterminer des réels $a$, $b$, $c$ tels que $f(x) = ax + b + \dfrac{c}{x - 1}$ pour tout $x \in D$. En déduire les asymptotes de la courbe et sa position par rapport à son asymptote oblique.

    **3.** Étudier les variations de $f$ sur $]1\,,+\infty[$.

    **4.** Tracer la courbe de $f$, avec ses asymptotes et son centre de symétrie.
  corrige: |
    **1.** La fonction est définie sur $D = \mathbb{R} \setminus \{1\}$, symétrique par rapport à $1$. Pour $x \neq 0$, 
    $$f(1 + x) = \frac{(1 + x)^{2} - 3(1 + x) + 3}{x} = \frac{x^{2} - x + 1}{x} \qquad\text{et}\qquad f(1 - x) = -\frac{x^{2} + x + 1}{x},$$
     donc 
    $$f(1 - x) + f(1 + x) = \frac{(x^{2} - x + 1) - (x^{2} + x + 1)}{x} = \boxed{-2}.$$
     D'après le cours, cela signifie que la courbe est symétrique par rapport au point $\boxed{\Omega(1, -1)}$, puisque $-2 = 2 \times (-1)$ : les points d'abscisses $1 - x$ et $1 + x$ ont des ordonnées de moyenne $-1$. Il suffit d'étudier $f$ sur $]1\,,+\infty[$.

    **2.** La division euclidienne de $x^{2} - 3x + 3$ par $x - 1$ donne $x^{2} - 3x + 3 = (x - 1)(x - 2) + 1$, donc 
    $$\boxed{f(x) = x - 2 + \frac{1}{x - 1}}, \qquad a = 1, \ b = -2, \ c = 1.$$
     Quand $x$ tend vers $1$ par valeurs supérieures, $\frac{1}{x - 1}$ tend vers $+\infty$, donc $f(x)$ aussi ; par valeurs inférieures, $f(x)$ tend vers $-\infty$. En $\pm\infty$, $f(x) - (x - 2) = \frac{1}{x - 1}$ tend vers $0$. 
    $$\boxed{\text{asymptote verticale } x = 1 ; \quad \text{asymptote oblique } \Delta : y = x - 2 \text{ en } \pm\infty}$$
     La différence $f(x) - (x - 2) = \frac{1}{x - 1}$ est du signe de $x - 1$ : la courbe est au-dessus de $\Delta$ sur $]1\,,+\infty[$, au-dessous sur $]-\infty\,,1[$, ce qui est cohérent avec la symétrie de centre $\Omega$, qui est sur $\Delta$.

    **3.** La fonction est dérivable sur $D$, et 
    $$f'(x) = 1 - \frac{1}{(x - 1)^{2}} = \frac{(x - 1)^{2} - 1}{(x - 1)^{2}} = \frac{x(x - 2)}{(x - 1)^{2}}.$$
     Sur $]1\,,+\infty[$, le signe de $f'$ est celui de $x - 2$, et $f(2) = 0 + 1 = 1$.

    ![Figure](documents/figures/40f15f1b43a66182.svg)

    Par la symétrie de centre $\Omega$, le point $(2, 1)$ a pour symétrique $(0, -3)$ : la fonction admet sur $]-\infty\,,1[$ un maximum local $f(0) = -3$, que l'on vérifie directement.

    **4.** On trace les deux asymptotes, qui se coupent en $\Omega$, la branche de droite, puis sa symétrique de centre $\Omega$.

    ![Figure](documents/figures/a5eedbc3803cb8d5.svg)

    La courbe est une hyperbole dont les asymptotes se coupent au centre de symétrie $\Omega$ ; la branche de droite descend de l'asymptote verticale jusqu'au minimum local $(2, 1)$, puis longe $\Delta$ par-dessus, et la branche de gauche en est l'image par la symétrie de centre $\Omega$.
- id: "ma-05-17"
  feuille: "f-ma-05"
  numero: 17
  partie: "Dérivation"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [dérivation, parité et périodicité, variations]
  noeuds: [de-operations, de-monotonie]
  notions: [derivable]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    On considère la fonction $f : x \mapsto x + 2\cos x$, définie sur $\mathbb{R}$.

    **1.** La fonction $f$ est-elle périodique ? Montrer que $f(x + 2\pi) = f(x) + 2\pi$ pour tout réel $x$, et interpréter géométriquement cette relation. En déduire qu'il suffit d'étudier $f$ sur $[0\,,2\pi]$.

    **2.** Montrer que la courbe de $f$ est comprise entre les droites $D_{1}$ et $D_{2}$ d'équations $y = x - 2$ et $y = x + 2$. Déterminer ses points communs avec chacune de ces droites, et la tangente à la courbe en ces points.

    **3.** Dresser le tableau de variations de $f$ sur $[0\,,2\pi]$.

    **4.** Tracer la courbe de $f$ sur $[-\pi\,,3\pi]$, avec les droites $D_{1}$ et $D_{2}$.
  corrige: |
    **1.** La fonction $f$ n'est pas périodique. Si elle l'était, de période $T > 0$, on aurait $f(nT) = f(0) = 2$ pour tout entier $n$ ; or $f(nT) \geqslant nT - 2$, qui dépasse $2$ dès que $nT > 4$. Mais le cosinus est $2\pi$-périodique, donc 
    $$\boxed{f(x + 2\pi) = x + 2\pi + 2\cos x = f(x) + 2\pi}.$$
     Si le point $M\big(x, f(x)\big)$ est sur la courbe, le point $\big(x + 2\pi, f(x) + 2\pi\big)$ y est aussi : la courbe est invariante par la translation de vecteur $2\pi\,\vec{\imath} + 2\pi\,\vec{\jmath}$, parallèle à la première bissectrice. Il suffit d'étudier $f$ sur un intervalle de longueur $2\pi$, par exemple $[0\,,2\pi]$, et de compléter la courbe par les translations de vecteurs $2k\pi(\vec{\imath} + \vec{\jmath})$, $k \in \mathbb{Z}$.

    **2.** Comme $-1 \leqslant \cos x \leqslant 1$, on a $x - 2 \leqslant f(x) \leqslant x + 2$ : la courbe est comprise entre $D_{1}$ et $D_{2}$. Elle touche $D_{2}$ quand $\cos x = 1$, c'est-à-dire en $x = 2k\pi$, et $D_{1}$ quand $\cos x = -1$, c'est-à-dire en $x = \pi + 2k\pi$. En ces points, $\sin x = 0$, donc $f'(x) = 1 - 2\sin x = 1$ : la tangente a la pente $1$ et passe par un point de la droite de contact. 
    $$\boxed{\big(2k\pi, 2k\pi + 2\big) \in D_{2} \quad\text{et}\quad \big((2k + 1)\pi, (2k + 1)\pi - 2\big) \in D_{1}, \ k \in \mathbb{Z}}$$
     En chacun de ces points, la tangente à la courbe est la droite $D_{1}$ ou $D_{2}$ elle-même : la courbe la touche sans la traverser.

    **3.** La dérivée $f'(x) = 1 - 2\sin x$ s'annule sur $[0\,,2\pi]$ quand $\sin x = \frac{1}{2}$, c'est-à-dire en $\frac{\pi}{6}$ et $\frac{5\pi}{6}$, et elle est négative entre ces deux valeurs. On calcule 
    $$f\Big(\frac{\pi}{6}\Big) = \frac{\pi}{6} + \sqrt{3} \approx 2{,}26, \qquad f\Big(\frac{5\pi}{6}\Big) = \frac{5\pi}{6} - \sqrt{3} \approx 0{,}89, \qquad f(0) = 2, \qquad f(2\pi) = 2\pi + 2 \approx 8{,}28.$$

    ![Figure](documents/figures/0556995adf9ad456.svg)

    **4.** On trace la courbe sur $[0\,,2\pi]$, puis on la translate de $\pm 2\pi(\vec{\imath} + \vec{\jmath})$.

    ![Figure](documents/figures/00b86222b4bfa4c0.svg)

    La courbe oscille entre les deux droites parallèles $D_{1}$ et $D_{2}$, qu'elle touche alternativement en les longeant (points pleins), et ses extremums locaux (cercles) se déduisent de ceux de $[0\,,2\pi]$ par la translation de vecteur $2\pi(\vec{\imath} + \vec{\jmath})$ : c'est une courbe « périodique le long de la première bissectrice ».
- id: "ma-05-18"
  feuille: "f-ma-05"
  numero: 18
  partie: "Dérivation"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [dérivation, parité et périodicité, variations, asymptotes]
  noeuds: [de-operations, de-monotonie]
  notions: [derivable, extremum-local]
  page_enonce: 5
  page_corrige: 12
  enonce: |
    On considère la fonction $f : x \mapsto x\sqrt{\dfrac{x - 1}{x + 1}}$, et l'on suit le plan d'étude du cours.

    **1.** Déterminer l'ensemble de définition $D$ de $f$. La fonction $f$ est-elle paire ou impaire ?

    **2.** Étudier les limites de $f$ aux bornes de $D$. Montrer que la droite $\Delta$ d'équation $y = x - 1$ est asymptote à la courbe en $+\infty$ et en $-\infty$.

    **3.** Montrer que $f(x)^{2} - (x - 1)^{2} = \dfrac{x - 1}{x + 1}$ pour tout $x \in D$, et en déduire la position de la courbe par rapport à $\Delta$.

    **4.** Montrer que $f$ est dérivable sur $D \setminus \{1\}$, et que $f'(x) = \dfrac{x^{2} + x - 1}{(x + 1)^{2}}\sqrt{\dfrac{x + 1}{x - 1}}$.

    **5.** Dresser le tableau de variations de $f$. On exprimera la valeur de l'extremum à l'aide du nombre d'or $\varphi = \frac{1 + \sqrt{5}}{2}$, qui vérifie $\varphi^{2} = \varphi + 1$.

    **6.** Étudier le taux d'accroissement de $f$ en $1$, puis tracer la courbe en utilisant tous les résultats obtenus.
  corrige: |
    **1.** Il faut $x \neq -1$ et $\frac{x - 1}{x + 1} \geqslant 0$ ; un tableau de signes donne $x < -1$ ou $x \geqslant 1$. 
    $$\boxed{D = \,]-\infty\,,-1[\, \cup \,[1\,,+\infty[}$$
     L'ensemble $D$ n'est pas symétrique par rapport à $0$, puisque $1 \in D$ et $-1 \notin D$ : la fonction n'est ni paire ni impaire, et il n'y a pas de réduction du domaine d'étude.

    **2.** Notons $r(x) = \frac{x - 1}{x + 1}$. En $\pm\infty$, $r(x) \to 1$ et $f(x) \sim x$, donc $f$ tend vers $\pm\infty$. En $-1^{-}$, $r(x) \to +\infty$ et $x \to -1$, donc $f(x) \to -\infty$ : la droite $x = -1$ est asymptote verticale. Pour l'asymptote oblique, on utilise la quantité conjuguée : 
    $$f(x) - x = x\big(\sqrt{r(x)} - 1\big) = \frac{x\,\big(r(x) - 1\big)}{\sqrt{r(x)} + 1} = \frac{-\frac{2x}{x + 1}}{\sqrt{r(x)} + 1} \xrightarrow[x \to \pm\infty]{} \frac{-2}{2} = -1.$$

    $$\boxed{\lim_{\pm\infty} f = \pm\infty, \quad \lim_{-1^{-}} f = -\infty, \quad \Delta : y = x - 1 \text{ asymptote en } \pm\infty}$$
     **3.** Pour $x \in D$, 
    $$f(x)^{2} - (x - 1)^{2} = \frac{x^{2}(x - 1)}{x + 1} - (x - 1)^{2} = \frac{(x - 1)\big(x^{2} - (x - 1)(x + 1)\big)}{x + 1} = \boxed{\frac{x - 1}{x + 1}}.$$
     Pour $x \geqslant 1$, les nombres $f(x)$ et $x - 1$ sont positifs, et $f(x)^{2} \geqslant (x - 1)^{2}$ : donc $f(x) \geqslant x - 1$, avec égalité seulement en $1$. Pour $x < -1$, ils sont négatifs, et $f(x)^{2} > (x - 1)^{2}$ donne $|f(x)| > |x - 1|$, c'est-à-dire $f(x) < x - 1$. 
    $$\boxed{\text{courbe au-dessus de } \Delta \text{ sur } [1\,,+\infty[ \text{ (contact en } (1, 0)), \text{ au-dessous sur } ]-\infty\,,-1[}$$
     **4.** La fonction $r$ est dérivable sur $D$, de dérivée $r'(x) = \frac{2}{(x + 1)^{2}}$, et strictement positive sur $D \setminus \{1\}$, où $\sqrt{r}$ est donc dérivable. Alors 
    $$f'(x) = \sqrt{r(x)} + \frac{x\,r'(x)}{2\sqrt{r(x)}} = \frac{r(x)(x + 1)^{2} + x}{(x + 1)^{2}\sqrt{r(x)}} = \frac{(x - 1)(x + 1) + x}{(x + 1)^{2}\sqrt{r(x)}},$$

    $$\boxed{f'(x) = \frac{x^{2} + x - 1}{(x + 1)^{2}}\sqrt{\frac{x + 1}{x - 1}}}.$$
     **5.** Le signe de $f'$ est celui de $x^{2} + x - 1$, dont les racines sont $\frac{-1 \pm \sqrt{5}}{2}$, c'est-à-dire $-\varphi$ et $\frac{1}{\varphi} = \varphi - 1$. Seule la racine $-\varphi \approx -1{,}618$ appartient à $D$ ; sur $[1\,,+\infty[$, le trinôme est positif. Pour l'extremum, $\varphi^{2} = \varphi + 1$ et $\varphi(\varphi - 1) = 1$ donnent 
    $$r(-\varphi) = \frac{\varphi + 1}{\varphi - 1} = \varphi^{2}\cdot\varphi = \varphi^{3}, \qquad \boxed{f(-\varphi) = -\varphi\cdot\varphi^{3/2} = -\varphi^{5/2} \approx -3{,}330}.$$

    ![Figure](documents/figures/56fb4d58975e3459.svg)

    **6.** Pour $x > 1$, le taux d'accroissement en $1$ vaut 
    $$\frac{f(x) - f(1)}{x - 1} = \frac{x}{x - 1}\sqrt{\frac{x - 1}{x + 1}} = \frac{x}{\sqrt{(x - 1)(x + 1)}} \xrightarrow[x \to 1^{+}]{} +\infty.$$

    $$\boxed{f \text{ n'est pas dérivable en } 1 : \text{ la courbe y a une tangente verticale}}$$

    ![Figure](documents/figures/7d26adcf4fe28a44.svg)

    La figure rassemble tous les résultats : les deux branches longent la même asymptote $\Delta$, la branche de gauche par-dessous et celle de droite par-dessus, après avoir touché $\Delta$ en $(1, 0)$ avec une tangente verticale ; le maximum local se lit à gauche de l'asymptote verticale.
- id: "ma-05-19"
  feuille: "f-ma-05"
  numero: 19
  partie: "Dérivation"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [dérivation, parité et périodicité, variations]
  noeuds: [de-operations, de-monotonie]
  notions: [derivable, fonction-periodique]
  page_enonce: 5
  page_corrige: 13
  enonce: |
    On considère la fonction $f : x \mapsto \cos^{3} x + \sin^{3} x$, définie sur $\mathbb{R}$.

    **1.** Montrer que $f$ est $2\pi$-périodique, et que $f(x + \pi) = -f(x)$ pour tout réel $x$. La fonction $f$ est-elle paire ? impaire ?

    **2.** Montrer que la courbe de $f$ est symétrique par rapport à la droite d'équation $x = \frac{\pi}{4}$.

    **3.** À l'aide des deux questions précédentes, montrer que la courbe est symétrique par rapport au point $\Omega\big(\frac{3\pi}{4}, 0\big)$. En déduire qu'il suffit d'étudier $f$ sur $\big[\frac{\pi}{4}\,,\frac{3\pi}{4}\big]$, intervalle de longueur un quart de période, et expliquer comment on reconstitue la courbe sur une période.

    **4.** Montrer que $f'(x) = 3\sin x\cos x\,(\sin x - \cos x)$, et dresser le tableau de variations de $f$ sur $\big[\frac{\pi}{4}\,,\frac{3\pi}{4}\big]$. Préciser les tangentes aux points d'abscisses $\frac{\pi}{4}$, $\frac{\pi}{2}$ et $\frac{3\pi}{4}$.

    **5.** Tracer la courbe de $f$ sur $\big[-\frac{3\pi}{4}\,,\frac{9\pi}{4}\big]$, en faisant apparaître l'axe et le centre de symétrie.
  corrige: |
    **1.** Le sinus et le cosinus sont $2\pi$-périodiques, donc $f$ aussi. Comme $\cos(x + \pi) = -\cos x$ et $\sin(x + \pi) = -\sin x$, les cubes changent de signe, et 
    $$\boxed{f(x + \pi) = -\cos^{3} x - \sin^{3} x = -f(x)}.$$
     La fonction n'est ni paire ni impaire : $f(\frac{\pi}{2}) = 1$ et $f(-\frac{\pi}{2}) = -1$ ne sont pas égaux, et $f(0) = 1 \neq 0$, alors qu'une fonction impaire s'annule en $0$.

    **2.** D'après le chapitre 4, $\cos(\frac{\pi}{4} - x) = \sin(\frac{\pi}{4} + x)$ et $\sin(\frac{\pi}{4} - x) = \cos(\frac{\pi}{4} + x)$, puisque $\frac{\pi}{4} - x$ et $\frac{\pi}{4} + x$ ont pour somme $\frac{\pi}{2}$. Donc 
    $$f\Big(\frac{\pi}{4} - x\Big) = \sin^{3}\Big(\frac{\pi}{4} + x\Big) + \cos^{3}\Big(\frac{\pi}{4} + x\Big) = f\Big(\frac{\pi}{4} + x\Big),$$
     et la courbe est symétrique par rapport à la droite $\boxed{x = \frac{\pi}{4}}$ : la fonction ne change pas quand on échange les rôles du sinus et du cosinus.

    **3.** Soit $x$ réel. La question 2, appliquée à $\frac{\pi}{2} - x$, donne 
    $$f\Big(\frac{3\pi}{4} - x\Big) = f\Big(\frac{\pi}{4} + \Big(\frac{\pi}{2} - x\Big)\Big) = f\Big(\frac{\pi}{4} - \Big(\frac{\pi}{2} - x\Big)\Big) = f\Big(x - \frac{\pi}{4}\Big),$$
     et la question 1 donne 
    $$f\Big(\frac{3\pi}{4} + x\Big) = f\Big(\Big(x - \frac{\pi}{4}\Big) + \pi\Big) = -f\Big(x - \frac{\pi}{4}\Big).$$
     En ajoutant, $f(\frac{3\pi}{4} - x) + f(\frac{3\pi}{4} + x) = 0 = 2 \times 0$ : la courbe est symétrique par rapport au point $\boxed{\Omega\big(\frac{3\pi}{4}, 0\big)}$. L'axe $x = \frac{\pi}{4}$ ramène l'étude d'une période à un intervalle de longueur $\pi$ commençant en $\frac{\pi}{4}$, et le centre $\Omega$, milieu de cet intervalle, la ramène à 
    $$\boxed{\Big[\frac{\pi}{4}\,,\frac{3\pi}{4}\Big]}.$$
     On complète la courbe sur $[\frac{3\pi}{4}\,,\frac{5\pi}{4}]$ par la symétrie de centre $\Omega$, puis sur $[-\frac{3\pi}{4}\,,\frac{\pi}{4}]$ par la symétrie d'axe $x = \frac{\pi}{4}$ ; on a ainsi la courbe sur $[-\frac{3\pi}{4}\,,\frac{5\pi}{4}]$, qui est une période, et l'on termine par les translations de vecteurs $2k\pi\,\vec{\imath}$.

    **4.** La fonction est dérivable sur $\mathbb{R}$, et la dérivée de $\cos^{3}$ est $-3\cos^{2} x \sin x$, celle de $\sin^{3}$ est $3\sin^{2} x \cos x$ : 
    $$f'(x) = -3\cos^{2} x \sin x + 3\sin^{2} x\cos x = \boxed{3\sin x\cos x\,(\sin x - \cos x)}.$$
     Sur $]\frac{\pi}{4}\,,\frac{3\pi}{4}[$, le sinus est strictement positif, et $\sin x > \cos x$, puisque le sinus est supérieur à $\frac{\sqrt{2}}{2}$ et le cosinus inférieur à $\frac{\sqrt{2}}{2}$ : le signe de $f'(x)$ est celui de $\cos x$, positif avant $\frac{\pi}{2}$, négatif après. On calcule 
    $$f\Big(\frac{\pi}{4}\Big) = 2\Big(\frac{\sqrt{2}}{2}\Big)^{3} = \frac{\sqrt{2}}{2}, \qquad f\Big(\frac{\pi}{2}\Big) = 1, \qquad f\Big(\frac{3\pi}{4}\Big) = \Big(-\frac{\sqrt{2}}{2}\Big)^{3} + \Big(\frac{\sqrt{2}}{2}\Big)^{3} = 0.$$

    ![Figure](documents/figures/1c0987757971b5da.svg)

    Les tangentes en $\frac{\pi}{4}$ et en $\frac{\pi}{2}$ sont horizontales, puisque $f'$ s'y annule ; en $\frac{\pi}{4}$, c'est ce qu'impose l'axe de symétrie, comme le montre le cours. En $\frac{3\pi}{4}$, on a $\sin x = \frac{\sqrt{2}}{2}$, $\cos x = -\frac{\sqrt{2}}{2}$, et 
    $$f'\Big(\frac{3\pi}{4}\Big) = 3 \cdot \frac{\sqrt{2}}{2} \cdot \Big(-\frac{\sqrt{2}}{2}\Big) \cdot \sqrt{2} = -\frac{3\sqrt{2}}{2} \approx -2{,}12.$$

    $$\boxed{\text{tangentes horizontales en } \tfrac{\pi}{4} \text{ et } \tfrac{\pi}{2} ; \quad y = -\frac{3\sqrt{2}}{2}\Big(x - \frac{3\pi}{4}\Big) \text{ en } \tfrac{3\pi}{4}}$$
     Au centre de symétrie $\Omega$, la courbe traverse sa tangente. Par les symétries, $f$ prend sur $\mathbb{R}$ toutes ses valeurs dans $[-1\,,1]$, avec le maximum $1$ atteint en $0$ et en $\frac{\pi}{2}$ modulo $2\pi$, et un minimum local $\frac{\sqrt{2}}{2}$ en $\frac{\pi}{4}$ : sur une période, la courbe a deux bosses séparées par un creux.

    **5.** On trace l'arc sur $[\frac{\pi}{4}\,,\frac{3\pi}{4}]$, puis on applique les symétries de la question 3, et une translation de $2\pi$ pour atteindre $\frac{9\pi}{4}$.

    ![Figure](documents/figures/faeec1ef8ebef925.svg)

    Seul l'arc en trait épais, sur la bande $[\frac{\pi}{4}\,,\frac{3\pi}{4}]$, a été étudié. Le reste de la courbe s'en déduit : la symétrie de centre $\Omega$ donne la descente jusqu'au minimum $-1$ en $\pi$ et le creux suivant ; la symétrie d'axe $x = \frac{\pi}{4}$ donne la bosse symétrique, de sommet $(0, 1)$ ; enfin la translation de $2\pi$ prolonge le motif. On lit aussi que la tangente en $\Omega$ coupe la courbe : le point $\Omega$ est un centre de symétrie, non un extremum.
- id: "ma-05-20"
  feuille: "f-ma-05"
  numero: 20
  partie: "Dérivation"
  etoiles: 2
  types: [Lecture graphique, Démonstration, Calcul]
  mots_cles: [dérivation, inégalités]
  noeuds: [de-operations, de-monotonie]
  notions: [derivable]
  page_enonce: 6
  page_corrige: 15
  enonce: |
    Démontrer les inégalités suivantes, en étudiant chaque fois une fonction bien choisie.

    **(a)** Pour tout $x \geqslant 0$, $\sin x \leqslant x$ ; en déduire que $|\sin x| \leqslant |x|$ pour tout réel $x$.

    **(b)** Pour tout réel $x$, $1 - \dfrac{x^{2}}{2} \leqslant \cos x \leqslant 1$.

    **(c)** Pour tout $x \in \big[0\,,\frac{\pi}{2}\big[$, $\tan x \geqslant x$.

    **(d)** Pour tout $x \in \big[0\,,\frac{\pi}{2}\big]$, $\sin x \geqslant \dfrac{2}{\pi}\,x$. On étudiera la fonction $x \mapsto \dfrac{\sin x}{x}$ sur $\big]0\,,\frac{\pi}{2}\big]$. Interpréter graphiquement.
  corrige: |
    **(a)** La fonction $u : x \mapsto x - \sin x$ a pour dérivée $1 - \cos x \geqslant 0$ : elle est croissante, et $u(0) = 0$, donc $\sin x \leqslant x$ pour $x \geqslant 0$. Pour majorer $|\sin x|$, il faut aussi $-\sin x \leqslant x$ : c'est clair si $x \geqslant 1$, puisque $|\sin x| \leqslant 1$, et si $0 \leqslant x \leqslant 1$, alors $x \in [0\,,\pi]$ et $\sin x \geqslant 0$. La parité conclut pour $x < 0$. 
    $$\boxed{|\sin x| \leqslant |x| \ \text{ pour tout réel } x}$$
     **(b)** La fonction $v : x \mapsto \cos x - 1 + \frac{x^{2}}{2}$ a pour dérivée $x - \sin x$, positive sur $[0\,,+\infty[$ d'après (a) : $v$ y est croissante, et $v(0) = 0$. Comme $v$ est paire, $v \geqslant 0$ sur $\mathbb{R}$. 
    $$\boxed{1 - \frac{x^{2}}{2} \leqslant \cos x \leqslant 1}$$
     **(c)** La fonction $w : x \mapsto \tan x - x$ a pour dérivée $\tan^{2} x \geqslant 0$ sur $[0\,,\frac{\pi}{2}[$, et $w(0) = 0$. 
    $$\boxed{\tan x \geqslant x \ \text{ sur } \Big[0\,,\frac{\pi}{2}\Big[}$$
     **(d)** Posons $g(x) = \frac{\sin x}{x}$ sur $]0\,,\frac{\pi}{2}]$ ; alors $g'(x) = \frac{h(x)}{x^{2}}$ avec $h(x) = x\cos x - \sin x$. Or $h'(x) = -x\sin x \leqslant 0$ et $h(0) = 0$, donc $h \leqslant 0$ : $g$ est décroissante, et $g(x) \geqslant g(\frac{\pi}{2}) = \frac{2}{\pi}$. L'inégalité est aussi vraie en $0$. 
    $$\boxed{\sin x \geqslant \frac{2}{\pi}\,x \ \text{ sur } \Big[0\,,\frac{\pi}{2}\Big]}$$
     Graphiquement, sur $[0\,,\frac{\pi}{2}]$, la courbe du sinus est au-dessus de sa corde joignant $(0, 0)$ à $(\frac{\pi}{2}, 1)$ ; le chapitre 9 y reconnaîtra la concavité du sinus.
- id: "ma-05-21"
  feuille: "f-ma-05"
  numero: 21
  partie: "Dérivation"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [dérivation, inégalités]
  noeuds: [de-operations, de-monotonie]
  notions: [derivable]
  page_enonce: 6
  page_corrige: 15
  enonce: |
    *Inégalité de Huygens.* Montrer que, pour tout $x \in \big[0\,,\frac{\pi}{2}\big[$, on a $\dfrac{2}{3}\sin x + \dfrac{1}{3}\tan x \geqslant x$.

    *Indication : on factorisera le polynôme $2c^{3} - 3c^{2} + 1$, après avoir remarqué qu'il s'annule en $1$.*
  corrige: |
    Posons $g(x) = 2\sin x + \tan x - 3x$ sur $[0\,,\frac{\pi}{2}[$ ; l'inégalité demandée s'écrit $g \geqslant 0$. En notant $c = \cos x$, qui appartient à $]0\,,1]$, on obtient 
    $$g'(x) = 2c + \frac{1}{c^{2}} - 3 = \frac{2c^{3} - 3c^{2} + 1}{c^{2}} = \frac{(c - 1)^{2}(2c + 1)}{c^{2}} \geqslant 0,$$
     la factorisation s'obtenant en divisant par $c - 1$, puis en remarquant que $2c^{2} - c - 1$ s'annule encore en $1$. Donc $g$ est croissante, et $g(0) = 0$. 
    $$\boxed{\frac{2}{3}\sin x + \frac{1}{3}\tan x \geqslant x \ \text{ sur } \Big[0\,,\frac{\pi}{2}\Big[}$$
     Christiaan Huygens s'en servait pour approcher $\pi$ : appliquée à $x = \frac{\pi}{n}$, l'inégalité encadre l'arc par une moyenne pondérée des côtés des polygones inscrit et circonscrit.
- id: "ma-05-22"
  feuille: "f-ma-05"
  numero: 22
  partie: "Dérivation"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [dérivation, variations, bijection réciproque]
  noeuds: [de-operations, de-monotonie, c-bijection, de-reciproque]
  notions: [derivable]
  page_enonce: 6
  page_corrige: 15
  enonce: |
    On considère la fonction $f : x \mapsto x^{3} + x$, définie sur $\mathbb{R}$.

    **1.** Montrer que $f$ réalise une bijection de $\mathbb{R}$ sur $\mathbb{R}$, et que sa réciproque $f^{-1}$ est dérivable sur $\mathbb{R}$.

    **2.** Calculer $f^{-1}(0)$, $f^{-1}(2)$ et $f^{-1}(10)$, puis $(f^{-1})'(0)$, $(f^{-1})'(2)$ et $(f^{-1})'(10)$.

    **3.** Tracer sur une même figure les courbes de $f$ et de $f^{-1}$, avec leurs tangentes à l'origine.

    **4.** Un élève affirme : « la fonction $g : x \mapsto x^{3}$ est strictement croissante et dérivable sur $\mathbb{R}$, donc sa réciproque est dérivable sur $\mathbb{R}$ ». Corriger cette affirmation.
  corrige: |
    **1.** La fonction $f$ est dérivable sur $\mathbb{R}$, avec $f'(x) = 3x^{2} + 1 > 0$ : elle est strictement croissante, et tend vers $\pm\infty$ en $\pm\infty$. D'après le théorème 2, $f(\mathbb{R})$ est un intervalle, non majoré et non minoré, donc égal à $\mathbb{R}$, et $f^{-1}$ est dérivable puisque $f'$ ne s'annule pas. 
    $$\boxed{f : \mathbb{R} \to \mathbb{R} \text{ bijective}, \quad (f^{-1})'(y) = \frac{1}{3f^{-1}(y)^{2} + 1}}$$
     **2.** On a $f(0) = 0$, $f(1) = 2$ et $f(2) = 10$, d'où, avec la formule du théorème 2 : 
    $$\boxed{f^{-1}(0) = 0, \ f^{-1}(2) = 1, \ f^{-1}(10) = 2 \qquad (f^{-1})'(0) = 1, \ (f^{-1})'(2) = \frac{1}{4}, \ (f^{-1})'(10) = \frac{1}{13}}$$
     **3.** Les deux courbes sont symétriques par rapport à la première bissectrice (proposition 4), et toutes deux sont tangentes à l'origine à la droite $y = x$, puisque $f'(0) = (f^{-1})'(0) = 1$.

    ![Figure](documents/figures/319f34311371d4fc.svg)

    La courbe de $f$, en ardoise, se replie sur celle de $f^{-1}$, en bleu pétrole, par pliage le long de la bissectrice ; les deux courbes se croisent à l'origine, où elles ont la même tangente.

    **4.** Le théorème 2 exige aussi que $f'$ ne s'annule pas. Or $g'(0) = 0$ : la tangente à la courbe de $g$ en $0$ est horizontale, sa symétrique est verticale, et le taux d'accroissement de $g^{-1}$ en $0$, égal à $\frac{g^{-1}(y)}{y} = \frac{1}{g^{-1}(y)^{2}}$, tend vers $+\infty$. 
    $$\boxed{g^{-1} \text{ est dérivable sur } \mathbb{R}^{*} \text{ mais pas en } 0}$$
- id: "ma-05-23"
  feuille: "f-ma-05"
  numero: 23
  partie: "Dérivation"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [dérivation, "dérivée d'une composée", bijection réciproque]
  noeuds: [de-operations, de-composee, c-bijection, de-reciproque]
  notions: [derivable]
  page_enonce: 6
  page_corrige: 16
  enonce: |
    Le plan est muni d'un repère orthonormé, et l'on note $s : (x, y) \mapsto (y, x)$ la symétrie par rapport à la première bissectrice $\Delta$, comme dans le cours.

    **1.** Soit $f : I \to I$ une bijection, où $I$ est une partie de $\mathbb{R}$. Montrer que la courbe de $f$ est symétrique par rapport à $\Delta$, c'est-à-dire que $s(\Gamma_{f}) = \Gamma_{f}$, si et seulement si $f \circ f = \mathrm{id}_{I}$.

    **2.** Soit $I = \mathbb{R} \setminus \{1\}$ et $f : x \mapsto \dfrac{x + 2}{x - 1}$. Montrer que $f$ est une bijection de $I$ sur $I$ égale à sa propre réciproque.

    **3.** Déterminer les points d'intersection de la courbe de $f$ avec $\Delta$, puis tracer la courbe en faisant apparaître sa symétrie.

    **4.** Plus généralement, soit $a$, $b$, $c$ des réels avec $c \neq 0$ et $a^{2} + bc \neq 0$. Montrer que la fonction $x \mapsto \dfrac{ax + b}{cx - a}$ est sa propre réciproque.
  corrige: |
    **1.** D'après la proposition 4, $s(\Gamma_{f}) = \Gamma_{f^{-1}}$. Donc $s(\Gamma_{f}) = \Gamma_{f}$ équivaut à $\Gamma_{f^{-1}} = \Gamma_{f}$, c'est-à-dire à $f^{-1} = f$, puisqu'une fonction est déterminée par sa courbe ; et $f^{-1} = f$ équivaut à $f \circ f = \mathrm{id}_{I}$. 
    $$\boxed{s(\Gamma_{f}) = \Gamma_{f} \iff f \circ f = \mathrm{id}_{I}}$$
     **2.** On écrit $f(x) = 1 + \frac{3}{x - 1}$, qui ne vaut jamais $1$ : $f$ envoie $I$ dans $I$. Pour $x \in I$, 
    $$f(f(x)) = \frac{\frac{x + 2}{x - 1} + 2}{\frac{x + 2}{x - 1} - 1} = \frac{x + 2 + 2x - 2}{x + 2 - x + 1} = \frac{3x}{3} = x.$$
     D'après le théorème 1 du chapitre 2, avec $g = f$, l'application $f$ est bijective et $f^{-1} = f$. 
    $$\boxed{f \circ f = \mathrm{id}_{I}, \quad f^{-1} = f}$$
     **3.** L'équation $f(x) = x$ s'écrit $x + 2 = x^{2} - x$, soit $x^{2} - 2x - 2 = 0$. 
    $$\boxed{\Gamma_{f} \cap \Delta = \big\{(1 - \sqrt{3}, 1 - \sqrt{3}),\ (1 + \sqrt{3}, 1 + \sqrt{3})\big\}}$$

    ![Figure](documents/figures/62050f395633db2f.svg)

    La courbe est une hyperbole d'asymptotes $x = 1$ et $y = 1$, deux droites échangées par la symétrie $s$ ; ses deux branches sont chacune symétriques par rapport à $\Delta$, qu'elles coupent aux deux points calculés.

    **4.** Le cas $a^{2} + bc = 0$ est exclu parce que la fonction serait alors constante. On calcule $f(f(x))$ en multipliant numérateur et dénominateur par $cx - a$ : 
    $$f(f(x)) = \frac{a(ax + b) + b(cx - a)}{c(ax + b) - a(cx - a)} = \frac{(a^{2} + bc)\,x}{a^{2} + bc} = x.$$

    $$\boxed{x \mapsto \frac{ax + b}{cx - a} \text{ est sa propre réciproque sur } \mathbb{R} \setminus \Big\{\frac{a}{c}\Big\}}$$
     L'exemple de la question 2 correspond à $a = 1$, $b = 2$, $c = 1$.
- id: "ma-05-24"
  feuille: "f-ma-05"
  numero: 24
  partie: "Dérivation"
  etoiles: 2
  types: [Conjecture, Démonstration, Calcul]
  mots_cles: [dérivation, dérivées successives]
  noeuds: [de-operations, de-taylor]
  notions: [derivable, derivee-successive]
  page_enonce: 7
  page_corrige: 17
  enonce: |
    Calculer, pour tout entier $n \geqslant 1$, la dérivée $n$-ième de chacune des fonctions suivantes. On commencera par conjecturer la formule à l'aide des premières dérivées, puis on la démontrera par récurrence.

    **(a)** $x \mapsto \cos(3x)$

    **(b)** $x \mapsto \dfrac{1}{x^{2} - 1}$

    **(c)** $x \mapsto \dfrac{1}{2 + 5x - 3x^{2}}$

    **(d)** $x \mapsto \sin(5x - 2)\cos(2x + 1)$

    *Indication : pour (b) et (c), écrire la fraction comme une somme de deux fractions plus simples ; pour (d), linéariser comme au chapitre 4.*
  corrige: |
    On utilise deux formules, qui se démontrent par une récurrence immédiate : pour $a \neq 0$ et $b$ réels, $\big(\cos(ax + b)\big)^{(n)} = a^{n}\cos\big(ax + b + n\frac{\pi}{2}\big)$, de même avec le sinus, puisque dériver revient à ajouter $\frac{\pi}{2}$ à l'argument ; et $\Big(\dfrac{1}{ax + b}\Big)^{(n)} = \dfrac{(-1)^{n}\,n!\,a^{n}}{(ax + b)^{n+1}}$.

    **(a)** $\boxed{\big(\cos(3x)\big)^{(n)} = 3^{n}\cos\Big(3x + \frac{n\pi}{2}\Big)}$

    **(b)** On décompose $\frac{1}{x^{2} - 1} = \frac{1}{2}\Big(\frac{1}{x - 1} - \frac{1}{x + 1}\Big)$. 
    $$\boxed{\Big(\frac{1}{x^{2} - 1}\Big)^{(n)} = \frac{(-1)^{n}\,n!}{2}\Big(\frac{1}{(x - 1)^{n+1}} - \frac{1}{(x + 1)^{n+1}}\Big)}$$
     **(c)** On factorise $2 + 5x - 3x^{2} = (3x + 1)(2 - x)$, puis on cherche $\frac{1}{(3x + 1)(2 - x)} = \frac{\alpha}{3x + 1} + \frac{\beta}{2 - x}$ ; en multipliant par $2 - x$ puis en faisant $x = 2$, on trouve $\beta = \frac{1}{7}$, et de même $\alpha = \frac{3}{7}$. 
    $$\boxed{\Big(\frac{1}{2 + 5x - 3x^{2}}\Big)^{(n)} = \frac{(-1)^{n}\,n!}{7}\Big(\frac{3^{n+1}}{(3x + 1)^{n+1}} - \frac{1}{(x - 2)^{n+1}}\Big)}$$
     **(d)** La formule $\sin p\cos q = \frac{1}{2}\big(\sin(p + q) + \sin(p - q)\big)$ du chapitre 4 donne 
    $$\sin(5x - 2)\cos(2x + 1) = \frac{1}{2}\big(\sin(7x - 1) + \sin(3x - 3)\big).$$

    $$\boxed{\big(\sin(5x - 2)\cos(2x + 1)\big)^{(n)} = \frac{1}{2}\Big(7^{n}\sin\Big(7x - 1 + \frac{n\pi}{2}\Big) + 3^{n}\sin\Big(3x - 3 + \frac{n\pi}{2}\Big)\Big)}$$
     *À retenir :* on ne dérive pas un produit $n$ fois ; on le transforme d'abord en somme, par décomposition ou par linéarisation.
- id: "ma-05-25"
  feuille: "f-ma-05"
  numero: 25
  partie: "Dérivation"
  etoiles: 3
  types: [Conjecture, Démonstration, Calcul]
  mots_cles: [dérivation, exponentielle]
  noeuds: [de-operations, ex-exponentielle]
  notions: [derivable, exponentielle]
  page_enonce: 7
  page_corrige: 18
  enonce: |
    Pour tout entier $n \geqslant 1$, on pose $f_{n}(x) = x^{n-1}\mathrm{e}^{1/x}$ pour $x \neq 0$.

    **1.** Calculer $f_{1}'$, $f_{2}''$ et $f_{3}^{(3)}$. Conjecturer une expression simple de $f_{n}^{(n)}$.

    **2.** Soit $g$ une fonction $n + 1$ fois dérivable sur un intervalle. Montrer par récurrence sur $n$ que la fonction $x \mapsto x\,g(x)$ est $n + 1$ fois dérivable, et que 
    $$\big(x\,g(x)\big)^{(n+1)} = x\,g^{(n+1)}(x) + (n + 1)\,g^{(n)}(x).$$

    **3.** En remarquant que $f_{n+1}(x) = x f_{n}(x)$, démontrer la conjecture par récurrence sur $n$.
  corrige: |
    **1.** On trouve $f_{1}'(x) = -\frac{1}{x^{2}}\mathrm{e}^{1/x}$, puis $f_{2}'(x) = \mathrm{e}^{1/x} - \frac{1}{x}\mathrm{e}^{1/x}$, et 
    $$f_{2}''(x) = -\frac{1}{x^{2}}\mathrm{e}^{1/x} + \frac{1}{x^{2}}\mathrm{e}^{1/x} + \frac{1}{x^{3}}\mathrm{e}^{1/x} = \frac{1}{x^{3}}\mathrm{e}^{1/x} ;$$
     un calcul analogue donne $f_{3}^{(3)}(x) = -\frac{1}{x^{4}}\mathrm{e}^{1/x}$. 
    $$\boxed{\text{conjecture : } f_{n}^{(n)}(x) = \frac{(-1)^{n}}{x^{n+1}}\,\mathrm{e}^{1/x}}$$
     **2.** Pour $n = 0$, c'est la formule du produit : $(xg)' = g + xg'$. Si la formule est vraie au rang $n$ pour toute fonction $n + 2$ fois dérivable $g$, on dérive une fois de plus : 
    $$\big(xg\big)^{(n+2)} = \big(x\,g^{(n+1)} + (n + 1)g^{(n)}\big)' = g^{(n+1)} + x\,g^{(n+2)} + (n + 1)g^{(n+1)} = x\,g^{(n+2)} + (n + 2)g^{(n+1)},$$
     ce qui est la formule au rang $n + 1$. 
    $$\boxed{\big(x\,g(x)\big)^{(n+1)} = x\,g^{(n+1)}(x) + (n + 1)\,g^{(n)}(x)}$$
     **3.** La formule est vraie pour $n = 1$. Supposons-la vraie au rang $n$, et notons $E = \mathrm{e}^{1/x}$. En dérivant l'hypothèse, $f_{n}^{(n+1)}(x) = (-1)^{n}\big(-\frac{n + 1}{x^{n+2}} - \frac{1}{x^{n+3}}\big)E$. La question 2, appliquée à $g = f_{n}$, donne alors 
    $$f_{n+1}^{(n+1)}(x) = x f_{n}^{(n+1)}(x) + (n + 1) f_{n}^{(n)}(x) = (-1)^{n}\Big(-\frac{n + 1}{x^{n+1}} - \frac{1}{x^{n+2}} + \frac{n + 1}{x^{n+1}}\Big)E = \frac{(-1)^{n+1}}{x^{n+2}}\,E.$$

    $$\boxed{f_{n}^{(n)}(x) = \frac{(-1)^{n}}{x^{n+1}}\,\mathrm{e}^{1/x} \ \text{ pour tout } n \geqslant 1}$$
     La question 2 est un cas particulier de la formule de Leibniz, qui donne la dérivée $n$-ième d'un produit et que le chapitre 9 démontrera en toute généralité.
- id: "ma-05-26"
  feuille: "f-ma-05"
  numero: 26
  partie: "Exponentielle et logarithme"
  etoiles: 1
  types: [Calcul]
  mots_cles: [exponentielle et logarithme, exponentielle, logarithme]
  noeuds: [ex-logarithme, ex-exponentielle]
  notions: [exponentielle, logarithme]
  page_enonce: 7
  page_corrige: 18
  enonce: |
    Résoudre dans $\mathbb{R}$ les équations suivantes, en commençant chaque fois par déterminer l'ensemble des réels pour lesquels elles ont un sens.

    **(a)** $\mathrm{e}^{2x} - \mathrm{e}^{x} - 6 = 0$

    **(b)** $3\mathrm{e}^{x} - 7\mathrm{e}^{-x} - 20 = 0$

    **(c)** $\ln(x^{2} - 1) + \ln 4 = \ln(4x - 1)$

    **(d)** $\ln(x + 2) - \ln(x + 1) = \ln(x - 1)$

    **(e)** $\ln|x - 1| + \ln|x + 2| = \ln|4x^{2} + 3x - 7|$

    **(f)** $\ln(x^{2}) = 2$

    Pour (f), un élève écrit : « $\ln(x^{2}) = 2\ln x$, donc $\ln x = 1$, et l'unique solution est $\mathrm{e}$ ». Où est l'erreur ?
  corrige: |
    **(a)** Avec $t = \mathrm{e}^{x} > 0$, l'équation devient $t^{2} - t - 6 = (t - 3)(t + 2) = 0$, et seule la racine $t = 3$ est positive. 
    $$\boxed{x = \ln 3}$$
     **(b)** En multipliant par $\mathrm{e}^{x} \neq 0$, on obtient $3t^{2} - 20t - 7 = 0$, de discriminant $484 = 22^{2}$, de racines $7$ et $-\frac{1}{3}$. 
    $$\boxed{x = \ln 7}$$
     **(c)** L'équation a un sens pour $x^{2} > 1$ et $x > \frac{1}{4}$, c'est-à-dire $x > 1$. Elle équivaut alors, par injectivité de $\ln$, à $4(x^{2} - 1) = 4x - 1$, soit $4x^{2} - 4x - 3 = 0$, de racines $\frac{3}{2}$ et $-\frac{1}{2}$. 
    $$\boxed{x = \frac{3}{2}}$$
     **(d)** L'équation a un sens pour $x > 1$, et s'écrit $\ln\frac{x + 2}{x + 1} = \ln(x - 1)$, soit $x + 2 = (x - 1)(x + 1)$, c'est-à-dire $x^{2} - x - 3 = 0$. Des deux racines $\frac{1 \pm \sqrt{13}}{2}$, seule la plus grande est supérieure à $1$. 
    $$\boxed{x = \frac{1 + \sqrt{13}}{2}}$$
     **(e)** On remarque que $4x^{2} + 3x - 7 = (x - 1)(4x + 7)$. L'équation a un sens pour $x \notin \{1, -2, -\frac{7}{4}\}$, et s'écrit alors $\ln\big(|x - 1|\,|x + 2|\big) = \ln\big(|x - 1|\,|4x + 7|\big)$, soit $|x + 2| = |4x + 7|$. Les cas $x + 2 = 4x + 7$ et $x + 2 = -(4x + 7)$ donnent $x = -\frac{5}{3}$ et $x = -\frac{9}{5}$, qui ne sont pas exclus. 
    $$\boxed{x \in \Big\{-\frac{9}{5}, -\frac{5}{3}\Big\}}$$
     **(f)** L'équation a un sens pour $x \neq 0$, et $\ln(x^{2}) = 2$ équivaut à $x^{2} = \mathrm{e}^{2}$. 
    $$\boxed{x = \mathrm{e} \ \text{ ou } \ x = -\mathrm{e}}$$
     L'élève a utilisé la formule $\ln(x^{n}) = n\ln x$, qui n'est valable que pour $x > 0$ (proposition 6), et a ainsi perdu la solution $-\mathrm{e}$. La formule valable pour tout $x \neq 0$ est $\ln(x^{2}) = 2\ln|x|$.
- id: "ma-05-27"
  feuille: "f-ma-05"
  numero: 27
  partie: "Exponentielle et logarithme"
  etoiles: 1
  types: [Calcul]
  mots_cles: [exponentielle et logarithme, exponentielle, logarithme, inégalités]
  noeuds: [ex-logarithme, ex-exponentielle, de-monotonie]
  notions: [exponentielle, logarithme]
  page_enonce: 7
  page_corrige: 19
  enonce: |
    Résoudre les inéquations suivantes.

    **(a)** $\mathrm{e}^{2x} + 2\mathrm{e}^{x} - 3 \leqslant 2$, d'inconnue $x \in \mathbb{R}$.

    **(b)** $\ln(x - 1) + \ln(x + 1) < 2\ln x - 1$, d'inconnue $x \in \,]1\,,+\infty[$.

    **(c)** $\ln(2x + 1) \geqslant \ln(x^{2} - 2)$.
  corrige: |
    **(a)** Avec $t = \mathrm{e}^{x} > 0$, l'inéquation s'écrit $t^{2} + 2t - 5 \leqslant 0$ ; les racines du trinôme sont $-1 \pm \sqrt{6}$, et le trinôme est négatif entre elles. Pour $t > 0$, cela donne $t \leqslant \sqrt{6} - 1$. 
    $$\boxed{x \in \big]-\infty\,,\ln(\sqrt{6} - 1)\big]}$$
     **(b)** Pour $x > 1$, l'inéquation s'écrit $\ln\frac{x^{2} - 1}{x^{2}} < -1$, soit $1 - \frac{1}{x^{2}} < \frac{1}{\mathrm{e}}$, c'est-à-dire $x^{2} < \frac{\mathrm{e}}{\mathrm{e} - 1}$. 
    $$\boxed{x \in \Big]1\,,\sqrt{\frac{\mathrm{e}}{\mathrm{e} - 1}}\,\Big[ \approx \,]1\,;1{,}258[}$$
     **(c)** L'inéquation a un sens pour $x > -\frac{1}{2}$ et $x^{2} > 2$, soit $x > \sqrt{2}$. Par croissance stricte de $\ln$, elle équivaut à $2x + 1 \geqslant x^{2} - 2$, soit $x^{2} - 2x - 3 = (x - 3)(x + 1) \leqslant 0$, c'est-à-dire $-1 \leqslant x \leqslant 3$. 
    $$\boxed{x \in \,]\sqrt{2}\,,3]}$$
- id: "ma-05-28"
  feuille: "f-ma-05"
  numero: 28
  partie: "Exponentielle et logarithme"
  etoiles: 2
  types: [Calcul]
  mots_cles: [exponentielle et logarithme, exponentielle, logarithme]
  noeuds: [ex-logarithme, ex-exponentielle]
  notions: [exponentielle, logarithme]
  page_enonce: 8
  page_corrige: 19
  enonce: |
    Résoudre les systèmes suivants, d'inconnues réelles $x$ et $y$.

    **(a)** $\begin{cases} \mathrm{e}^{x}\,\mathrm{e}^{2y} = 5 \\ \mathrm{e}^{2x}\,\mathrm{e}^{-y} = \dfrac{1}{25} \end{cases}$

    **(b)** $\begin{cases} 2\ln x - 3\ln y = \ln 2 \\ x - y = 2 \end{cases}$
  corrige: |
    **(a)** En prenant le logarithme, le système devient linéaire : $x + 2y = \ln 5$ et $2x - y = -2\ln 5$. La seconde équation donne $y = 2x + 2\ln 5$, puis la première $5x + 4\ln 5 = \ln 5$. 
    $$\boxed{x = -\frac{3}{5}\ln 5, \qquad y = \frac{4}{5}\ln 5}$$
     **(b)** Il faut $x > 0$ et $y > 0$. La première équation s'écrit $\ln(x^{2}) = \ln(2y^{3})$, soit $x^{2} = 2y^{3}$, et l'on remplace $x$ par $y + 2$ : $2y^{3} - (y + 2)^{2} = 2y^{3} - y^{2} - 4y - 4 = 0$. Cette équation admet la racine $y = 2$, et $2y^{3} - y^{2} - 4y - 4 = (y - 2)(2y^{2} + 3y + 2)$, où le second facteur a un discriminant $9 - 16 < 0$. 
    $$\boxed{(x, y) = (4, 2)}$$
     On vérifie : $2\ln 4 - 3\ln 2 = 4\ln 2 - 3\ln 2 = \ln 2$ ✓.
- id: "ma-05-29"
  feuille: "f-ma-05"
  numero: 29
  partie: "Exponentielle et logarithme"
  etoiles: 1
  types: [Calcul]
  mots_cles: [exponentielle et logarithme, "dérivée d'une composée", exponentielle]
  noeuds: [ex-exponentielle, ex-logarithme, de-composee]
  notions: [exponentielle, logarithme]
  page_enonce: 8
  page_corrige: 20
  enonce: |
    *Le médecin légiste.* D'après la loi de refroidissement de Newton, la température d'un corps placé dans une pièce à $20\,^{\circ}$C vérifie $T(t) = A\,\mathrm{e}^{-ct} + 20$, où $t$ est le temps en heures, et $A$ et $c$ deux constantes positives. Un corps est découvert à $23$ h, à la température de $31\,^{\circ}$C ; une heure plus tard, il n'est plus qu'à $29\,^{\circ}$C. On prend l'origine des temps à l'heure de la découverte.

    **1.** Déterminer les constantes $A$ et $c$.

    **2.** Sachant que la température du corps vivant était de $37\,^{\circ}$C, déterminer l'heure du décès, à la minute près.
  corrige: |
    **1.** On a $T(0) = A + 20 = 31$, donc $A = 11$, puis $T(1) = 11\,\mathrm{e}^{-c} + 20 = 29$, donc $\mathrm{e}^{-c} = \frac{9}{11}$. 
    $$\boxed{A = 11, \qquad c = \ln\frac{11}{9} \approx 0{,}201\ \text{h}^{-1}}$$
     **2.** On cherche $t$ tel que $11\,\mathrm{e}^{-ct} + 20 = 37$, soit $\mathrm{e}^{-ct} = \frac{17}{11}$, c'est-à-dire 
    $$t = -\frac{\ln(17/11)}{\ln(11/9)} \approx -2{,}169\ \text{h} \approx -2\ \text{h}\ 10\ \text{min}.$$

    $$\boxed{\text{décès vers } 20\ \text{h}\ 50}$$
     Le temps est négatif, ce qui est attendu : le décès précède la découverte. Le modèle suppose la pièce à température constante depuis le décès ; c'est en pratique la principale source d'incertitude.
