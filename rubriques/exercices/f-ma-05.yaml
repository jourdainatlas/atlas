  mots_cles: [exponentielle et logarithme, logarithme, puissances réelles, inégalités]
  noeuds: [ex-logarithme, de-monotonie]
  notions: [exponentielle, logarithme, puissance-reelle]
  page_enonce: 8
  page_corrige: 20
  enonce: |
    **1.** Soit $N$ un entier naturel non nul et $k \geqslant 1$ un entier. Montrer que $N$ s'écrit avec exactement $k$ chiffres en base $10$ si et seulement si $k - 1 \leqslant \log_{10} N < k$.

    **2.** Le plus grand nombre premier connu en 2018 était $2^{82\,589\,933} - 1$. Combien a-t-il de chiffres ? On justifiera que ce nombre et la puissance de $2$ qui le suit ont le même nombre de chiffres. On donne $\log_{10} 2 \approx 0{,}301\,029\,995\,66$.

    **3.** Le nombre $304^{1777}$ a $4\,413$ chiffres. Existe-t-il des entiers $n$ tels que $2^{n}$ ait autant de chiffres que lui ? Les déterminer.
  corrige: |
    **1.** Un entier $N \geqslant 1$ s'écrit avec $k$ chiffres si et seulement si $10^{k-1} \leqslant N < 10^{k}$, et l'on applique la fonction $\log_{10}$, strictement croissante, avec $\log_{10}(10^{m}) = m$. 
    $$\boxed{N \text{ a } k \text{ chiffres} \iff k - 1 \leqslant \log_{10} N < k}$$
     **2.** Notons $n = 82\,589\,933$. On a $n\log_{10} 2 \approx 24\,862\,047{,}17$ ; l'erreur commise sur $\log_{10} 2$ est inférieure à $10^{-11}$, et multipliée par $n$ elle reste inférieure à $10^{-3}$, ce qui ne change pas la partie avant la virgule. Donc $2^{n}$ a $24\,862\,048$ chiffres. Ensuite, $2^{n}$ n'est pas une puissance de $10$, puisque $5$ divise toute puissance $10^{m}$ avec $m \geqslant 1$ ; ainsi $10^{k-1} < 2^{n}$, et $10^{k-1} \leqslant 2^{n} - 1 < 10^{k}$. 
    $$\boxed{2^{82\,589\,933} - 1 \text{ a } 24\,862\,048 \text{ chiffres}}$$
     **3.** D'après la question 1, l'entier $2^{n}$ a $4\,413$ chiffres si et seulement si $4\,412 \leqslant n\log_{10} 2 < 4\,413$, c'est-à-dire, en arrondissant les quotients, 
    $$14\,656{,}35 \leqslant n < 14\,659{,}67.$$

    $$\boxed{n \in \{14\,657,\ 14\,658,\ 14\,659\}}$$
     Il y en a trois, ce qui est cohérent : une puissance de $10$ est franchie toutes les trois ou quatre puissances de $2$, puisque $\frac{1}{\log_{10} 2} \approx 3{,}32$.
- id: "ma-05-31"
  feuille: "f-ma-05"
  numero: 31
  partie: "Exponentielle et logarithme"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [exponentielle et logarithme, logarithme]
  noeuds: [ex-logarithme]
  notions: [exponentielle, logarithme]
  page_enonce: 8
  page_corrige: 20
  enonce: |
    **1.** Montrer que le réel $\log_{10} 2$ n'est pas rationnel.

    **2.** Montrer de même que $\dfrac{\ln 3}{\ln 2}$ n'est pas rationnel.

    **3.** Montrer que $\log_{10} 5$ n'est pas rationnel. Un élève affirme que la somme de deux réels non rationnels n'est jamais rationnelle : que lui répondre ?
  corrige: |
    **1.** Supposons $\log_{10} 2 = \frac{p}{q}$ avec $p$, $q$ entiers, $q \geqslant 1$. Comme $1 < 2 < 10$, on a $0 < \frac{p}{q} < 1$, donc $1 \leqslant p < q$. L'égalité $2 = 10^{p/q}$ donne $2^{q} = 10^{p} = 2^{p}5^{p}$, puis $2^{q-p} = 5^{p}$, où le membre de gauche est pair et celui de droite impair. 
    $$\boxed{\log_{10} 2 \notin \mathbb{Q}}$$
     **2.** Si $\frac{\ln 3}{\ln 2} = \frac{p}{q}$, avec $p$, $q \geqslant 1$ puisque ce quotient est positif, alors $q\ln 3 = p\ln 2$, soit $3^{q} = 2^{p}$ : un nombre impair égal à un nombre pair. 
    $$\boxed{\frac{\ln 3}{\ln 2} = \log_{2} 3 \notin \mathbb{Q}}$$
     **3.** On a $\log_{10} 5 = \log_{10} 10 - \log_{10} 2 = 1 - \log_{10} 2$ ; s'il était rationnel, $\log_{10} 2 = 1 - \log_{10} 5$ le serait aussi. 
    $$\boxed{\log_{10} 5 \notin \mathbb{Q}}$$
     L'affirmation de l'élève est fausse : $\log_{10} 2$ et $\log_{10} 5$ ne sont pas rationnels, et leur somme vaut $\log_{10} 10 = 1$.
- id: "ma-05-32"
  feuille: "f-ma-05"
  numero: 32
  partie: "Exponentielle et logarithme"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [exponentielle et logarithme, exponentielle, logarithme, inégalités]
  noeuds: [ex-logarithme, ex-exponentielle, de-monotonie]
  notions: [exponentielle, logarithme]
  page_enonce: 8
  page_corrige: 21
  enonce: |
    **1.** Montrer que, pour tout $x \geqslant 0$, $x - \dfrac{x^{2}}{2} \leqslant \ln(1 + x) \leqslant x$.

    **2.** Montrer que, pour tout $x \geqslant 0$, $(x - 2)\mathrm{e}^{x} + x + 2 \geqslant 0$.

    **3.** À l'aide de l'inégalité $\ln(1 + x) \leqslant x$ du cours, montrer que, pour tout entier $n \geqslant 2$, 
    $$\Big(1 + \frac{1}{n}\Big)^{n} \leqslant \mathrm{e} \leqslant \Big(1 - \frac{1}{n}\Big)^{-n}.$$
     En prenant $n = 100$, en déduire un encadrement de $\mathrm{e}$ d'amplitude inférieure à $0{,}03$.
  corrige: |
    **1.** La majoration est la proposition 6. Pour la minoration, posons $\varphi(x) = \ln(1 + x) - x + \frac{x^{2}}{2}$ sur $[0\,,+\infty[$. Alors $\varphi'(x) = \frac{1}{1 + x} - 1 + x = \frac{x^{2}}{1 + x} \geqslant 0$, et $\varphi(0) = 0$. 
    $$\boxed{x - \frac{x^{2}}{2} \leqslant \ln(1 + x) \leqslant x \ \text{ pour } x \geqslant 0}$$
     **2.** Posons $g(x) = (x - 2)\mathrm{e}^{x} + x + 2$. Alors $g'(x) = (x - 1)\mathrm{e}^{x} + 1$ et $g''(x) = x\,\mathrm{e}^{x} \geqslant 0$ sur $[0\,,+\infty[$. Donc $g'$ y est croissante, et $g'(x) \geqslant g'(0) = 0$ ; puis $g$ est croissante, et $g(x) \geqslant g(0) = 0$. 
    $$\boxed{(x - 2)\mathrm{e}^{x} + x + 2 \geqslant 0 \ \text{ pour } x \geqslant 0}$$
     On a dû dériver deux fois, car le signe de $g'$ n'était pas lisible directement.

    **3.** L'inégalité $\ln\big(1 + \frac{1}{n}\big) \leqslant \frac{1}{n}$ donne $n\ln\big(1 + \frac{1}{n}\big) \leqslant 1$, puis, par croissance de l'exponentielle, $\big(1 + \frac{1}{n}\big)^{n} \leqslant \mathrm{e}$. De même, $\ln\big(1 - \frac{1}{n}\big) \leqslant -\frac{1}{n}$, puisque $-\frac{1}{n} > -1$, donc $-n\ln\big(1 - \frac{1}{n}\big) \geqslant 1$, et $\mathrm{e} \leqslant \big(1 - \frac{1}{n}\big)^{-n}$. 
    $$\boxed{\Big(1 + \frac{1}{n}\Big)^{n} \leqslant \mathrm{e} \leqslant \Big(1 - \frac{1}{n}\Big)^{-n}}$$
     Pour $n = 100$, on obtient $1{,}01^{100} \approx 2{,}7048$ et $0{,}99^{-100} \approx 2{,}7320$. 
    $$\boxed{2{,}704 \leqslant \mathrm{e} \leqslant 2{,}733}$$
     L'amplitude, environ $0{,}027$, convient. Elle diminue lentement, comme $\frac{\mathrm{e}}{n}$ : les développements limités du chapitre 10 l'expliqueront.
- id: "ma-05-33"
  feuille: "f-ma-05"
  numero: 33
  partie: "Exponentielle et logarithme"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [exponentielle et logarithme, exponentielle, logarithme]
  noeuds: [ex-logarithme, ex-exponentielle, ex-croissances]
  notions: [exponentielle, logarithme]
  page_enonce: 9
  page_corrige: 21
  enonce: |
    **1.** Montrer que l'équation $x\ln x = 1$ admet une unique solution sur $]0\,,+\infty[$, et que celle-ci appartient à $]1\,,\mathrm{e}[$.

    **2.** Montrer que l'équation $\mathrm{e}^{-x^{2}} = \mathrm{e}^{x} - 1$ admet une unique solution réelle. On commencera par montrer qu'elle n'en a aucune sur $]-\infty\,,0]$.
  corrige: |
    **1.** Sur $]0\,,1]$, $x\ln x \leqslant 0 < 1$ : il n'y a pas de solution. Sur $[1\,,+\infty[$, la fonction $\varphi : x \mapsto x\ln x$ est dérivable, de dérivée $\ln x + 1 > 0$ : elle est strictement croissante. Comme $\varphi(1) = 0 < 1 < \mathrm{e} = \varphi(\mathrm{e})$, et que $\varphi([1\,,\mathrm{e}])$ est un intervalle d'après le théorème 2, la valeur $1$ est atteinte sur $]1\,,\mathrm{e}[$, une seule fois. 
    $$\boxed{x\ln x = 1 \text{ a une unique solution } \alpha \in \,]1\,,\mathrm{e}[, \quad \alpha \approx 1{,}763}$$
     **2.** Pour $x \leqslant 0$, $\mathrm{e}^{x} - 1 \leqslant 0 < \mathrm{e}^{-x^{2}}$ : pas de solution. Sur $[0\,,+\infty[$, la fonction $h : x \mapsto \mathrm{e}^{x} - 1 - \mathrm{e}^{-x^{2}}$ a pour dérivée $\mathrm{e}^{x} + 2x\,\mathrm{e}^{-x^{2}} > 0$. Comme $h(0) = -1 < 0$ et $h(1) = \mathrm{e} - 1 - \frac{1}{\mathrm{e}} > 0$, la même méthode conclut. 
    $$\boxed{\text{unique solution, dans } ]0\,,1[, \ \approx 0{,}552}$$
     *À retenir :* l'existence vient du théorème 2, l'unicité de la stricte monotonie. Le chapitre 8 donnera la même conclusion par le théorème des valeurs intermédiaires, sans hypothèse de dérivabilité.
- id: "ma-05-34"
  feuille: "f-ma-05"
  numero: 34
  partie: "Fonctions puissances et croissances comparées"
  etoiles: 1
  types: [Calcul]
  mots_cles: [puissances et croissances comparées]
  noeuds: [ex-logarithme, ex-puissances]
  notions: [puissance-reelle, logarithme]
  page_enonce: 9
  page_corrige: 22
  enonce: |
    Résoudre les équations et le système suivants, d'inconnues réelles.

    **(a)** $2^{x+4} + 3^{x} = 2^{x+2} + 3^{x+2}$

    **(b)** $2^{x+1} + 4^{x} = 15$

    **(c)** $x^{\sqrt{x}} = \big(\sqrt{x}\big)^{x}$

    **(d)** $\begin{cases} 8^{x} = 10^{y} \\ 2^{x} = 5^{y} \end{cases}$
  corrige: |
    **(a)** L'équation s'écrit $16 \cdot 2^{x} - 4 \cdot 2^{x} = 9 \cdot 3^{x} - 3^{x}$, soit $12 \cdot 2^{x} = 8 \cdot 3^{x}$, ou encore $\big(\frac{3}{2}\big)^{x} = \frac{3}{2}$. 
    $$\boxed{x = 1}$$
     **(b)** Avec $t = 2^{x} > 0$, on obtient $t^{2} + 2t - 15 = (t - 3)(t + 5) = 0$, donc $t = 3$. 
    $$\boxed{x = \frac{\ln 3}{\ln 2}}$$
     **(c)** Il faut $x > 0$. Les deux membres s'écrivent alors $\mathrm{e}^{\sqrt{x}\ln x}$ et $\exp\big(\frac{x}{2}\ln x\big)$, et l'équation équivaut à $\big(\sqrt{x} - \frac{x}{2}\big)\ln x = 0$, soit $\ln x = 0$ ou $\sqrt{x} = \frac{x}{2}$, c'est-à-dire $x = 1$ ou $\sqrt{x} = 2$. 
    $$\boxed{x \in \{1, 4\}}$$
     **(d)** En prenant le logarithme, $3x\ln 2 = y\ln 10$ et $x\ln 2 = y\ln 5$. En retranchant le triple de la seconde de la première, $0 = y(\ln 10 - 3\ln 5) = y\ln\frac{10}{125}$, donc $y = 0$, puis $x = 0$. 
    $$\boxed{(x, y) = (0, 0)}$$
- id: "ma-05-35"
  feuille: "f-ma-05"
  numero: 35
  partie: "Fonctions puissances et croissances comparées"
  etoiles: 2
  types: [Calcul]
  mots_cles: [puissances et croissances comparées, exponentielle, logarithme, limites]
  noeuds: [ex-logarithme, ex-exponentielle, ex-croissances, de-limite]
  notions: [puissance-reelle, exponentielle, logarithme, limite-fonction]
  page_enonce: 9
  page_corrige: 22
  enonce: |
    Déterminer les limites suivantes, en se ramenant chaque fois aux croissances comparées du cours.

    **(a)** $\dfrac{(\ln x)^{2}}{\sqrt{x}}$ en $+\infty$

    **(b)** $x^{1/x}$ en $+\infty$

    **(c)** $\dfrac{\mathrm{e}^{\sqrt{x}}}{x^{10}}$ en $+\infty$

    **(d)** $x\,(\ln x)^{3}$ en $0^{+}$

    **(e)** $\dfrac{(x^{x})^{x}}{x^{(x^{x})}}$ en $+\infty$

    **(f)** $x^{1/\ln x}$ en $+\infty$

    La limite (e) cache un piège d'écriture : les nombres $(x^{x})^{x}$ et $x^{(x^{x})}$ sont-ils égaux ?
  corrige: |
    **(a)** $\dfrac{(\ln x)^{2}}{\sqrt{x}} = \Big(\dfrac{\ln x}{x^{1/4}}\Big)^{2}$, qui tend vers $0$ par croissances comparées. $\boxed{0}$

    **(b)** $x^{1/x} = \mathrm{e}^{\frac{\ln x}{x}}$, et $\frac{\ln x}{x} \to 0$. $\boxed{1}$

    **(c)** Avec $u = \sqrt{x}$, $\dfrac{\mathrm{e}^{\sqrt{x}}}{x^{10}} = \dfrac{\mathrm{e}^{u}}{u^{20}}$, qui tend vers $+\infty$. $\boxed{+\infty}$

    **(d)** $x(\ln x)^{3} = \big(x^{1/3}\ln x\big)^{3}$, qui tend vers $0$ en $0^{+}$. $\boxed{0}$

    **(e)** On a $(x^{x})^{x} = x^{x^{2}}$ d'après la proposition 7, de sorte que le quotient vaut $\exp\big((x^{2} - x^{x})\ln x\big)$. Or $\frac{x^{x}}{x^{2}} = \mathrm{e}^{(x - 2)\ln x} \to +\infty$, donc $x^{2} - x^{x} = x^{2}\big(1 - \frac{x^{x}}{x^{2}}\big) \to -\infty$, et l'exposant tend vers $-\infty$. $\boxed{0}$

    **(f)** Pour $x > 1$, $x^{1/\ln x} = \mathrm{e}^{\frac{1}{\ln x}\ln x} = \mathrm{e}$ : la fonction est constante. $\boxed{\mathrm{e}}$

    Les nombres $(x^{x})^{x} = x^{x^{2}}$ et $x^{(x^{x})}$ ne sont pas égaux en général : pour $x = 3$, le premier vaut $3^{9}$ et le second $3^{27}$. L'écriture $x^{x^{x}}$ sans parenthèses se lit toujours $x^{(x^{x})}$.
- id: "ma-05-36"
  feuille: "f-ma-05"
  numero: 36
  partie: "Fonctions puissances et croissances comparées"
  etoiles: 2
  types: [Calcul]
  mots_cles: [puissances et croissances comparées, variations]
  noeuds: [ex-logarithme, de-monotonie]
  notions: [puissance-reelle, logarithme]
  page_enonce: 9
  page_corrige: 22
  enonce: |
    On considère la fonction $f : x \mapsto x^{x}$.

    **1.** Préciser l'ensemble de définition de $f$, et écrire $f(x)$ à l'aide de l'exponentielle.

    **2.** Étudier les variations de $f$, et ses limites en $0$ et en $+\infty$. On donnera la valeur exacte du minimum.

    **3.** Étudier le taux d'accroissement $\dfrac{f(x) - 1}{x}$ en $0^{+}$ : que peut-on en dire de la courbe au voisinage de $0$ ?

    **4.** Discuter, selon la valeur du réel $y$, le nombre de solutions de l'équation $x^{x} = y$.
  corrige: |
    **1.** Par définition des puissances réelles, $\boxed{D = \,]0\,,+\infty[ \quad\text{et}\quad f(x) = \mathrm{e}^{x\ln x}}$

    **2.** La fonction est dérivable, et $f'(x) = (\ln x + 1)\,x^{x}$, du signe de $\ln x + 1$ : $f$ décroît sur $]0\,,\frac{1}{\mathrm{e}}]$ et croît sur $[\frac{1}{\mathrm{e}}\,,+\infty[$. Par croissances comparées, $x\ln x \to 0$ en $0^{+}$, donc $f(x) \to 1$ ; en $+\infty$, $x\ln x \to +\infty$. 
    $$\boxed{\min f = f\Big(\frac{1}{\mathrm{e}}\Big) = \mathrm{e}^{-1/\mathrm{e}} \approx 0{,}692, \qquad \lim_{0^{+}} f = 1, \qquad \lim_{+\infty} f = +\infty}$$
     **3.** Posons $u = x\ln x$, qui tend vers $0$ en $0^{+}$. Alors $\dfrac{f(x) - 1}{x} = \dfrac{\mathrm{e}^{u} - 1}{u}\cdot\ln x$ ; le premier facteur tend vers $\exp'(0) = 1$, et le second vers $-\infty$. 
    $$\boxed{\frac{f(x) - 1}{x} \xrightarrow[x \to 0^{+}]{} -\infty}$$
     Si l'on prolonge $f$ en posant $f(0) = 1$, la courbe part du point $(0, 1)$ avec une tangente verticale.

    **4.** On lit le nombre de solutions sur le tableau de variations, en tenant compte de ce que la valeur $1$ n'est pas atteinte en $0$. 
    $$\boxed{\begin{array}{c|c|c|c|c} y & y < \mathrm{e}^{-1/\mathrm{e}} & y = \mathrm{e}^{-1/\mathrm{e}} & \mathrm{e}^{-1/\mathrm{e}} < y < 1 & y \geqslant 1 \\ \hline \text{nombre de solutions} & 0 & 1 & 2 & 1 \end{array}}$$
- id: "ma-05-37"
  feuille: "f-ma-05"
  numero: 37
  partie: "Fonctions puissances et croissances comparées"
  etoiles: 3
  types: [Lecture graphique, Démonstration]
  mots_cles: [puissances et croissances comparées, logarithme, inégalités]
  noeuds: [ex-logarithme, ex-puissances, de-monotonie]
  notions: [puissance-reelle, logarithme]
  page_enonce: 10
  page_corrige: 23
  enonce: |
    On cherche tous les réels $a > 0$ tels que $a^{x} \geqslant x + 1$ pour tout réel $x$.

    **1.** Montrer que $a = \mathrm{e}$ convient.

    **2.** Soit $a > 0$. Montrer que $\dfrac{a^{x} - 1}{x}$ tend vers $\ln a$ lorsque $x$ tend vers $0$.

    **3.** On suppose que $a$ convient. En distinguant les cas $x > 0$ et $x < 0$, montrer que $\ln a \geqslant 1$ et $\ln a \leqslant 1$. Conclure.

    **4.** Interpréter graphiquement le résultat à l'aide des tangentes en $0$ aux courbes $y = a^{x}$.
  corrige: |
    **1.** C'est l'inégalité $\mathrm{e}^{x} \geqslant 1 + x$ de la proposition 5. $\boxed{a = \mathrm{e} \text{ convient}}$

    **2.** La fonction $x \mapsto a^{x} = \mathrm{e}^{x\ln a}$ est dérivable, de dérivée $x \mapsto \ln(a)\,a^{x}$, qui vaut $\ln a$ en $0$. Le quotient est son taux d'accroissement en $0$. 
    $$\boxed{\frac{a^{x} - 1}{x} \xrightarrow[x \to 0]{} \ln a}$$
     **3.** Pour $x > 0$, l'inégalité $a^{x} - 1 \geqslant x$ donne $\frac{a^{x} - 1}{x} \geqslant 1$, et, en passant à la limite en $0^{+}$, $\ln a \geqslant 1$. Pour $x < 0$, la division par $x$ renverse l'inégalité : $\frac{a^{x} - 1}{x} \leqslant 1$, et la limite en $0^{-}$ donne $\ln a \leqslant 1$. 
    $$\boxed{\ln a = 1, \ \text{ donc } a = \mathrm{e} \text{ est l'unique solution}}$$
     **4.** La tangente en $0$ à la courbe $y = a^{x}$ est la droite $y = 1 + x\ln a$. La droite $y = 1 + x$ passe par le point $(0, 1)$ de toutes ces courbes ; si elle n'en est pas la tangente, elle la traverse, et l'inégalité est fausse d'un côté de $0$. La base $\mathrm{e}$ est la seule dont la courbe exponentielle a une pente égale à $1$ en $0$.
- id: "ma-05-38"
  feuille: "f-ma-05"
  numero: 38
  partie: "Fonctions puissances et croissances comparées"
  etoiles: 3
  types: [Calcul]
  mots_cles: [puissances et croissances comparées, variations, exponentielle, logarithme]
  noeuds: [de-monotonie, ex-logarithme, ex-exponentielle]
  notions: [puissance-reelle, exponentielle, logarithme]
  page_enonce: 10
  page_corrige: 23
  enonce: |
    On considère la fonction $g : x \mapsto \dfrac{\ln x}{x}$ sur $]0\,,+\infty[$, dont la courbe est représentée ci-dessous.

    ![Figure](documents/figures/8644fc9c10fb1706.svg)

    **1.** Étudier les variations et les limites de $g$, puis justifier que $g(2) = g(4)$, comme le suggère la figure.

    **2.** Déterminer les entiers naturels $n$ tels que $2^{n} \geqslant n^{2}$.

    **3.** Sans calculatrice, comparer les réels $\mathrm{e}^{\pi}$ et $\pi^{\mathrm{e}}$.

    **4.** Déterminer tous les couples $(p, q)$ d'entiers naturels non nuls tels que $p < q$ et $p^{q} = q^{p}$.
  corrige: |
    **1.** La fonction $g$ est dérivable, et $g'(x) = \frac{1 - \ln x}{x^{2}}$ : $g$ croît sur $]0\,,\mathrm{e}]$ et décroît sur $[\mathrm{e}\,,+\infty[$. En $0^{+}$, $\ln x \to -\infty$ et $\frac{1}{x} \to +\infty$, donc $g \to -\infty$ ; en $+\infty$, $g \to 0$ par croissances comparées. Enfin $g(4) = \frac{2\ln 2}{4} = g(2)$. 
    $$\boxed{\max g = g(\mathrm{e}) = \frac{1}{\mathrm{e}}, \qquad \lim_{0^{+}} g = -\infty, \qquad \lim_{+\infty} g = 0, \qquad g(2) = g(4) = \frac{\ln 2}{2}}$$
     **2.** Pour $n \geqslant 1$, $2^{n} \geqslant n^{2}$ équivaut à $n\ln 2 \geqslant 2\ln n$, soit $g(n) \leqslant g(2)$. Pour $n \geqslant 4$, la décroissance de $g$ sur $[\mathrm{e}\,,+\infty[$ donne $g(n) \leqslant g(4) = g(2)$. Pour $n = 3$, $g(3) > g(4)$, et en effet $8 < 9$. Les cas $n = 0$, $1$, $2$ se vérifient directement : $1 \geqslant 0$, $2 \geqslant 1$, $4 \geqslant 4$. 
    $$\boxed{2^{n} \geqslant n^{2} \iff n \neq 3}$$
     **3.** Comme $\mathrm{e} < \pi$ et que $g$ décroît sur $[\mathrm{e}\,,+\infty[$, $g(\pi) < g(\mathrm{e})$, soit $\frac{\ln \pi}{\pi} < \frac{1}{\mathrm{e}}$, c'est-à-dire $\mathrm{e}\ln\pi < \pi = \pi\ln\mathrm{e}$. 
    $$\boxed{\pi^{\mathrm{e}} < \mathrm{e}^{\pi}}$$
     Numériquement, $\pi^{\mathrm{e}} \approx 22{,}46$ et $\mathrm{e}^{\pi} \approx 23{,}14$.

    **4.** L'égalité $p^{q} = q^{p}$ équivaut à $g(p) = g(q)$. Comme $g$ est strictement monotone sur $]0\,,\mathrm{e}]$ et sur $[\mathrm{e}\,,+\infty[$, les entiers $p < q$ ne peuvent être tous deux $\leqslant 2$, ni tous deux $\geqslant 3$ : donc $p \in \{1, 2\}$ et $q \geqslant 3$. Pour $p = 1$, $g(1) = 0 < g(q)$. Pour $p = 2$, il faut $g(q) = g(2) = g(4)$, avec $q$ et $4$ dans $[\mathrm{e}\,,+\infty[$, d'où $q = 4$. 
    $$\boxed{(p, q) = (2, 4)}$$
     C'est la figure de l'énoncé qui guide le raisonnement : une droite horizontale coupe la courbe en au plus deux points, l'un avant le sommet, l'autre après.
- id: "ma-05-39"
  feuille: "f-ma-05"
  numero: 39
  partie: "Fonctions circulaires réciproques"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fonctions circulaires réciproques]
  noeuds: [de-reciproque, c-bijection, tg-arctan]
  notions: [arc-tangente, cosinus-sinus]
  page_enonce: 10
  page_corrige: 24
  enonce: |
    Calculer les nombres suivants.

    **(a)** $\operatorname{Arcsin}\Big(-\dfrac{1}{2}\Big)$

    **(b)** $\operatorname{Arccos}\Big(-\dfrac{\sqrt{2}}{2}\Big)$

    **(c)** $\operatorname{Arctan}\sqrt{3}$

    **(d)** $\operatorname{Arccos}\Big(\cos\dfrac{4\pi}{3}\Big)$

    **(e)** $\operatorname{Arcsin}(\sin 3)$

    **(f)** $\operatorname{Arctan}\Big(\tan\dfrac{87\pi}{5}\Big)$

    **(g)** $\operatorname{Arccos}\Big(\sin\dfrac{7\pi}{15}\Big)$

    **(h)** $\operatorname{Arccos}\Big(\sin\dfrac{17\pi}{5}\Big)$

    **(i)** $\operatorname{Arccos}\Big(\cos\Big(-\dfrac{2\pi}{3}\Big)\Big)$
  corrige: |
    Pour calculer $\operatorname{Arcsin} y$, on cherche l'unique angle de $[-\frac{\pi}{2}\,,\frac{\pi}{2}]$ dont le sinus vaut $y$ ; de même avec $[0\,,\pi]$ pour l'arc cosinus et $]-\frac{\pi}{2}\,,\frac{\pi}{2}[$ pour l'arc tangente. Lorsque l'argument est déjà un cosinus ou un sinus, on ramène l'angle dans le bon intervalle.

    • **(a), (b), (c)** $\boxed{\operatorname{Arcsin}\Big(-\frac{1}{2}\Big) = -\frac{\pi}{6} \qquad \operatorname{Arccos}\Big(-\frac{\sqrt{2}}{2}\Big) = \frac{3\pi}{4} \qquad \operatorname{Arctan}\sqrt{3} = \frac{\pi}{3}}$

    • **(d)** $\cos\frac{4\pi}{3} = \cos\big(2\pi - \frac{4\pi}{3}\big) = \cos\frac{2\pi}{3}$, et $\frac{2\pi}{3} \in [0\,,\pi]$ : $\boxed{\frac{2\pi}{3}}$

    • **(e)** $\sin 3 = \sin(\pi - 3)$, et $\pi - 3 \approx 0{,}14 \in [-\frac{\pi}{2}\,,\frac{\pi}{2}]$ : $\boxed{\pi - 3}$

    • **(f)** La tangente est $\pi$-périodique, et $\frac{87\pi}{5} - 17\pi = \frac{2\pi}{5} \in \,]-\frac{\pi}{2}\,,\frac{\pi}{2}[$ : $\boxed{\frac{2\pi}{5}}$

    • **(g)** $\sin\frac{7\pi}{15} = \cos\big(\frac{\pi}{2} - \frac{7\pi}{15}\big) = \cos\frac{\pi}{30}$ : $\boxed{\frac{\pi}{30}}$

    • **(h)** $\sin\frac{17\pi}{5} = \sin\big(-\frac{3\pi}{5}\big) = -\cos\frac{\pi}{10} = \cos\frac{9\pi}{10}$ : $\boxed{\frac{9\pi}{10}}$

    • **(i)** $\cos\big(-\frac{2\pi}{3}\big) = \cos\frac{2\pi}{3}$ : $\boxed{\frac{2\pi}{3}}$

    *Piège :* on n'a pas $\operatorname{Arccos}(\cos x) = x$ en général ; c'est vrai seulement pour $x \in [0\,,\pi]$, et (d), (i) en donnent deux contre-exemples. L'exercice 41 étudie ces fonctions en détail.
- id: "ma-05-40"
  feuille: "f-ma-05"
  numero: 40
  partie: "Fonctions circulaires réciproques"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fonctions circulaires réciproques]
  noeuds: [de-reciproque, c-bijection, tg-arctan]
  notions: [arc-tangente, cosinus-sinus]
  page_enonce: 11
  page_corrige: 24
  enonce: |
    Simplifier les expressions suivantes, après avoir précisé pour quels réels $x$ elles ont un sens.

    **(a)** $\cos(\operatorname{Arctan} x)$

    **(b)** $\sin(\operatorname{Arctan} x)$

    **(c)** $\tan(\operatorname{Arcsin} x)$

    **(d)** $\cos(2\operatorname{Arccos} x)$

    **(e)** $\sin(2\operatorname{Arccos} x)$

    **(f)** $\cos(2\operatorname{Arctan} x)$
  corrige: |
    On pose chaque fois $\theta$ égal à l'arc, et l'on exprime la ligne trigonométrique cherchée à l'aide de celle que l'on connaît, en contrôlant le signe grâce à l'intervalle où se trouve $\theta$.

    • **(a)** Sur $\mathbb{R}$, avec $\theta = \operatorname{Arctan} x$, on a $\cos\theta > 0$ et $\frac{1}{\cos^{2}\theta} = 1 + \tan^{2}\theta$ : $\boxed{\cos(\operatorname{Arctan} x) = \frac{1}{\sqrt{1 + x^{2}}}}$

    • **(b)** Sur $\mathbb{R}$, $\sin\theta = \tan\theta\cos\theta$ : $\boxed{\sin(\operatorname{Arctan} x) = \frac{x}{\sqrt{1 + x^{2}}}}$

    • **(c)** Sur $]-1\,,1[$, puisque $\cos(\operatorname{Arcsin} x) = \sqrt{1 - x^{2}}$ ne s'annule pas : $\boxed{\tan(\operatorname{Arcsin} x) = \frac{x}{\sqrt{1 - x^{2}}}}$

    • **(d)** Sur $[-1\,,1]$, avec $\cos(2\theta) = 2\cos^{2}\theta - 1$ : $\boxed{\cos(2\operatorname{Arccos} x) = 2x^{2} - 1}$

    • **(e)** Sur $[-1\,,1]$, avec $\sin(2\theta) = 2\sin\theta\cos\theta$ : $\boxed{\sin(2\operatorname{Arccos} x) = 2x\sqrt{1 - x^{2}}}$

    • **(f)** Sur $\mathbb{R}$, avec $\cos(2\theta) = \frac{1 - \tan^{2}\theta}{1 + \tan^{2}\theta}$ : $\boxed{\cos(2\operatorname{Arctan} x) = \frac{1 - x^{2}}{1 + x^{2}}}$
- id: "ma-05-41"
  feuille: "f-ma-05"
  numero: 41
  partie: "Fonctions circulaires réciproques"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonctions circulaires réciproques, parité et périodicité]
  noeuds: [de-reciproque, c-bijection, tg-arctan]
  notions: [arc-tangente, cosinus-sinus]
  page_enonce: 11
  page_corrige: 25
  enonce: |
    **1.** Tracer la courbe de la fonction $x \mapsto \operatorname{Arcsin}(\sin x)$. On étudiera sa parité et sa périodicité, puis on en donnera une expression simple sur $\big[-\frac{\pi}{2}\,,\frac{\pi}{2}\big]$ et sur $\big[\frac{\pi}{2}\,,\frac{3\pi}{2}\big]$.

    **2.** Tracer de même les courbes de $x \mapsto \operatorname{Arccos}(\cos x)$ et de $x \mapsto \operatorname{Arctan}(\tan x)$.

    **3.** Montrer que la courbe de la fonction $\operatorname{Arccos}$ admet un centre de symétrie, que l'on précisera.
  corrige: |
    **1.** La fonction $u : x \mapsto \operatorname{Arcsin}(\sin x)$ est définie sur $\mathbb{R}$, impaire et $2\pi$-périodique, comme le sinus. Sur $[-\frac{\pi}{2}\,,\frac{\pi}{2}]$, $u(x) = x$. Sur $[\frac{\pi}{2}\,,\frac{3\pi}{2}]$, le réel $\pi - x$ est dans $[-\frac{\pi}{2}\,,\frac{\pi}{2}]$ et $\sin(\pi - x) = \sin x$, donc $u(x) = \pi - x$. 
    $$\boxed{u(x) = x \text{ sur } \Big[-\frac{\pi}{2}\,,\frac{\pi}{2}\Big], \qquad u(x) = \pi - x \text{ sur } \Big[\frac{\pi}{2}\,,\frac{3\pi}{2}\Big]}$$
     **2.** De même, $v : x \mapsto \operatorname{Arccos}(\cos x)$ est paire et $2\pi$-périodique, avec $v(x) = |x|$ sur $[-\pi\,,\pi]$. La fonction $w : x \mapsto \operatorname{Arctan}(\tan x)$ est définie hors des points $\frac{\pi}{2} + k\pi$, $\pi$-périodique, et $w(x) = x - k\pi$ sur $]-\frac{\pi}{2} + k\pi\,,\frac{\pi}{2} + k\pi[$.

    ![Figure](documents/figures/2c86ab7b917c65a2.svg)

    Les deux premières courbes sont des lignes brisées en dents de scie triangulaires, qui ne coïncident avec la droite $y = x$ que sur l'intervalle où l'arc inverse vraiment la fonction ; la troisième est une suite de segments de pente $1$, interrompus aux points où la tangente n'est pas définie (cercles vides).

    **3.** D'après la proposition 8, $\operatorname{Arccos}(-x) = \pi - \operatorname{Arccos} x$, soit $\operatorname{Arccos}(-x) - \frac{\pi}{2} = -\big(\operatorname{Arccos} x - \frac{\pi}{2}\big)$ : la fonction $h \mapsto \operatorname{Arccos}(h) - \frac{\pi}{2}$ est impaire, et l'exercice 8 conclut. 
    $$\boxed{\text{centre de symétrie } \Big(0, \frac{\pi}{2}\Big)}$$
- id: "ma-05-42"
  feuille: "f-ma-05"
  numero: 42
  partie: "Fonctions circulaires réciproques"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [fonctions circulaires réciproques, fonctions hyperboliques]
  noeuds: [de-reciproque, c-bijection, tg-arctan]
  notions: [arc-tangente, cosinus-sinus]
  page_enonce: 11
  page_corrige: 25
  enonce: |
    Démontrer de deux façons différentes que, pour tout $x \geqslant 0$, 
    $$\operatorname{Arccos}\frac{1 - x}{1 + x} = 2\operatorname{Arctan}\sqrt{x} :$$
     d'abord en étudiant la différence des deux membres, puis en posant $\theta = \operatorname{Arctan}\sqrt{x}$ et en calculant $\cos(2\theta)$. Quelle méthode préférer ?
  corrige: |
    **Première méthode.** Posons $\delta(x) = \operatorname{Arccos}\frac{1 - x}{1 + x} - 2\operatorname{Arctan}\sqrt{x}$. Pour $x > 0$, $u(x) = \frac{1 - x}{1 + x}$ appartient à $]-1\,,1[$, et $u'(x) = -\frac{2}{(1 + x)^{2}}$ ; comme $1 - u(x)^{2} = \frac{4x}{(1 + x)^{2}}$, 
    $$\Big(\operatorname{Arccos} u\Big)'(x) = \frac{-u'(x)}{\sqrt{1 - u(x)^{2}}} = \frac{2}{(1 + x)^{2}}\cdot\frac{1 + x}{2\sqrt{x}} = \frac{1}{(1 + x)\sqrt{x}} = \big(2\operatorname{Arctan}\sqrt{x}\big)'.$$
     Ainsi $\delta' = 0$ sur l'intervalle $]0\,,+\infty[$ : $\delta$ y est constante, égale à $\delta(1) = \operatorname{Arccos} 0 - 2\operatorname{Arctan} 1 = \frac{\pi}{2} - \frac{\pi}{2} = 0$. Le point $0$, où les fonctions ne sont pas dérivables, se traite à part : $\delta(0) = \operatorname{Arccos} 1 - 0 = 0$.

    **Seconde méthode.** Soit $\theta = \operatorname{Arctan}\sqrt{x} \in [0\,,\frac{\pi}{2}[$, de sorte que $\tan^{2}\theta = x$. La formule de l'exercice 40 (f) donne $\cos(2\theta) = \frac{1 - x}{1 + x}$, et $2\theta \in [0\,,\pi[$ ; donc $2\theta$ est l'arc cosinus de $\frac{1 - x}{1 + x}$. 
    $$\boxed{\operatorname{Arccos}\frac{1 - x}{1 + x} = 2\operatorname{Arctan}\sqrt{x} \ \text{ pour tout } x \geqslant 0}$$
     La seconde méthode est préférable : elle est plus courte, traite $x = 0$ sans cas particulier, et ne demande que de vérifier que l'angle est dans $[0\,,\pi]$. La première reste la méthode de secours quand on ne devine pas l'identité trigonométrique.
- id: "ma-05-43"
  feuille: "f-ma-05"
  numero: 43
  partie: "Fonctions circulaires réciproques"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonctions circulaires réciproques]
  noeuds: [de-reciproque, c-bijection, tg-arctan]
  notions: [arc-tangente, cosinus-sinus]
  page_enonce: 11
  page_corrige: 26
  enonce: |
    **1.** Soit $a$ et $b$ deux réels tels que $ab \neq 1$. Montrer qu'il existe un entier $k \in \{-1, 0, 1\}$ tel que 
    $$\operatorname{Arctan} a + \operatorname{Arctan} b = \operatorname{Arctan}\frac{a + b}{1 - ab} + k\pi,$$
     et montrer que $k = 0$ lorsque $ab < 1$.

    **2.** En déduire que $2\operatorname{Arctan}\dfrac{1}{3} + \operatorname{Arctan}\dfrac{1}{7} = \dfrac{\pi}{4}$.

    **3.** Calculer $\operatorname{Arctan} 2 + \operatorname{Arctan} 5 + \operatorname{Arctan} 8$.

    **4.** Résoudre l'équation $\operatorname{Arctan}(x - 3) + \operatorname{Arctan} x + \operatorname{Arctan}(x + 3) = \dfrac{5\pi}{4}$.
  corrige: |
    **1.** Posons $\alpha = \operatorname{Arctan} a$, $\beta = \operatorname{Arctan} b$, et $s = \alpha + \beta \in \,]-\pi\,,\pi[$. Alors 
    $$\cos s = \cos\alpha\cos\beta - \sin\alpha\sin\beta = \cos\alpha\cos\beta\,(1 - ab),$$
     qui est non nul, du signe de $1 - ab$, puisque $\cos\alpha$ et $\cos\beta$ sont strictement positifs. On peut donc calculer $\tan s = \frac{a + b}{1 - ab}$, et $s$ diffère de $\operatorname{Arctan}\frac{a + b}{1 - ab}$ d'un multiple de $\pi$. Cette différence est dans $]-\frac{3\pi}{2}\,,\frac{3\pi}{2}[$, donc vaut $k\pi$ avec $k \in \{-1, 0, 1\}$. Si $ab < 1$, $\cos s > 0$, donc $s \in \,]-\frac{\pi}{2}\,,\frac{\pi}{2}[$, et $k = 0$. 
    $$\boxed{\operatorname{Arctan} a + \operatorname{Arctan} b = \operatorname{Arctan}\frac{a + b}{1 - ab} + k\pi, \quad k = 0 \text{ si } ab < 1}$$
     On montre de même que $k = 1$ si $ab > 1$ et $a > 0$, et $k = -1$ si $ab > 1$ et $a < 0$.

    **2.** Avec $a = b = \frac{1}{3}$, $ab < 1$ : $2\operatorname{Arctan}\frac{1}{3} = \operatorname{Arctan}\frac{2/3}{8/9} = \operatorname{Arctan}\frac{3}{4}$. Puis, avec $\frac{3}{4}\cdot\frac{1}{7} < 1$ : 
    $$\operatorname{Arctan}\frac{3}{4} + \operatorname{Arctan}\frac{1}{7} = \operatorname{Arctan}\frac{\frac{3}{4} + \frac{1}{7}}{1 - \frac{3}{28}} = \operatorname{Arctan}\frac{25/28}{25/28} = \operatorname{Arctan} 1.$$

    $$\boxed{2\operatorname{Arctan}\frac{1}{3} + \operatorname{Arctan}\frac{1}{7} = \frac{\pi}{4}}$$
     **3.** Pour $a = 2$, $b = 5$, on a $ab > 1$ et $a > 0$, donc $\operatorname{Arctan} 2 + \operatorname{Arctan} 5 = \pi + \operatorname{Arctan}\frac{7}{-9} = \pi - \operatorname{Arctan}\frac{7}{9}$. Ensuite, $\operatorname{Arctan} 8 - \operatorname{Arctan}\frac{7}{9}$ relève du cas $ab = -\frac{56}{9} < 1$ : 
    $$\operatorname{Arctan} 8 + \operatorname{Arctan}\Big(-\frac{7}{9}\Big) = \operatorname{Arctan}\frac{8 - \frac{7}{9}}{1 + \frac{56}{9}} = \operatorname{Arctan}\frac{65/9}{65/9} = \frac{\pi}{4}.$$

    $$\boxed{\operatorname{Arctan} 2 + \operatorname{Arctan} 5 + \operatorname{Arctan} 8 = \frac{5\pi}{4}}$$
     **4.** La question 3 montre que $x = 5$ est solution. Le membre de gauche est une somme de trois fonctions strictement croissantes, donc il est strictement croissant, et injectif. 
    $$\boxed{x = 5}$$
     *Attention :* l'oubli du terme $k\pi$ est l'erreur la plus répandue ; en question 3, il aurait donné $\frac{\pi}{4}$ au lieu de $\frac{5\pi}{4}$, résultat absurde puisque chacun des trois arcs dépasse $\frac{\pi}{4}$.
- id: "ma-05-44"
  feuille: "f-ma-05"
  numero: 44
  partie: "Fonctions circulaires réciproques"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fonctions circulaires réciproques]
  noeuds: [de-reciproque, c-bijection, tg-arctan]
  notions: [arc-tangente, cosinus-sinus]
  page_enonce: 11
  page_corrige: 26
  enonce: |
    Résoudre les équations suivantes. Chaque fois que l'on applique une fonction aux deux membres, on vérifiera que l'on ne crée pas de fausses solutions.

    **(a)** $\operatorname{Arcsin}(2x) = \operatorname{Arccos} x$

    **(b)** $\operatorname{Arctan} x + \operatorname{Arctan}(2x) = \dfrac{\pi}{4}$

    **(c)** $\operatorname{Arcsin}\dfrac{2x}{1 + x^{2}} = \dfrac{\pi}{3}$

    **(d)** $\operatorname{Arcsin} x = \operatorname{Arctan} 2 + \operatorname{Arctan} 3$
  corrige: |
    **(a)** L'équation a un sens pour $|x| \leqslant \frac{1}{2}$. Une solution est une valeur commune à $[-\frac{\pi}{2}\,,\frac{\pi}{2}]$ et $[0\,,\pi]$, donc dans $[0\,,\frac{\pi}{2}]$, ce qui impose $x \geqslant 0$. Sur cet intervalle, le sinus est injectif, et l'équation équivaut à $2x = \sin(\operatorname{Arccos} x) = \sqrt{1 - x^{2}}$, soit $5x^{2} = 1$ avec $x \geqslant 0$. 
    $$\boxed{x = \frac{1}{\sqrt{5}}}$$
     **(b)** Le membre de gauche est strictement croissant et nul en $0$ : une solution est strictement positive. Pour $0 < x < \frac{1}{\sqrt{2}}$, l'exercice 43 donne $\operatorname{Arctan} x + \operatorname{Arctan}(2x) = \operatorname{Arctan}\frac{3x}{1 - 2x^{2}}$, et l'équation équivaut à $3x = 1 - 2x^{2}$. La racine positive, $\frac{\sqrt{17} - 3}{4} \approx 0{,}28$, convient ; elle est unique par stricte croissance. 
    $$\boxed{x = \frac{\sqrt{17} - 3}{4}}$$
     **(c)** Pour tout réel $x$, $\frac{2x}{1 + x^{2}} \in [-1\,,1]$, car $1 + x^{2} - 2|x| = (1 - |x|)^{2} \geqslant 0$. Comme $\frac{\pi}{3} \in [-\frac{\pi}{2}\,,\frac{\pi}{2}]$, l'équation équivaut à $\frac{2x}{1 + x^{2}} = \frac{\sqrt{3}}{2}$, soit $\sqrt{3}\,x^{2} - 4x + \sqrt{3} = 0$, de discriminant $4$. 
    $$\boxed{x \in \Big\{\frac{1}{\sqrt{3}}, \sqrt{3}\Big\}}$$
     **(d)** D'après l'exercice 43, $\operatorname{Arctan} 2 + \operatorname{Arctan} 3 = \pi + \operatorname{Arctan}\frac{5}{-5} = \frac{3\pi}{4}$, qui n'appartient pas à $[-\frac{\pi}{2}\,,\frac{\pi}{2}]$. 
    $$\boxed{\text{aucune solution}}$$
     Prendre le sinus des deux membres aurait conduit à $x = \frac{\sqrt{2}}{2}$, qui n'est pas solution : c'est le piège que signale l'énoncé.
- id: "ma-05-45"
  feuille: "f-ma-05"
  numero: 45
  partie: "Fonctions circulaires réciproques"
  etoiles: 3
  types: [Calcul]
  mots_cles: [fonctions circulaires réciproques, dérivation, fonctions hyperboliques]
  noeuds: [de-reciproque, c-bijection, de-operations]
  notions: [derivable]
  page_enonce: 12
  page_corrige: 27
  enonce: |
    On considère la fonction $f : x \mapsto \operatorname{Arccos}(4x^{3} - 3x)$.

    **1.** Déterminer l'ensemble de définition de $f$.

    **2.** Rappeler l'expression de $\cos(3\theta)$ en fonction de $\cos\theta$, obtenue au chapitre 4.

    **3.** En posant $\theta = \operatorname{Arccos} x$, exprimer $f(x)$ sous la forme $a + b\operatorname{Arccos} x$, où les constantes $a$ et $b$ dépendent de l'intervalle auquel appartient $x$.

    **4.** Tracer la courbe de $f$. En quels points la fonction $f$ semble-t-elle ne pas être dérivable ?
  corrige: |
    **1.** Pour $x \in [-1\,,1]$, on verra en question 3 que $4x^{3} - 3x = \cos(3\operatorname{Arccos} x) \in [-1\,,1]$. Pour $x > 1$, $4x^{3} - 3x - 1 = (x - 1)(2x + 1)^{2} > 0$, et le cas $x < -1$ s'en déduit par imparité. 
    $$\boxed{D = [-1\,,1]}$$
     **2.** C'est la formule obtenue au chapitre 4 par la formule de Moivre : $\boxed{\cos(3\theta) = 4\cos^{3}\theta - 3\cos\theta}$

    **3.** Soit $\theta = \operatorname{Arccos} x \in [0\,,\pi]$ ; alors $f(x) = \operatorname{Arccos}(\cos 3\theta)$, avec $3\theta \in [0\,,3\pi]$. Il faut ramener $3\theta$ dans $[0\,,\pi]$ par un angle de même cosinus.

    • Si $\theta \in [0\,,\frac{\pi}{3}]$, c'est-à-dire $x \in [\frac{1}{2}\,,1]$, alors $3\theta \in [0\,,\pi]$ et $f(x) = 3\theta$.

    • Si $\theta \in [\frac{\pi}{3}\,,\frac{2\pi}{3}]$, c'est-à-dire $x \in [-\frac{1}{2}\,,\frac{1}{2}]$, alors $2\pi - 3\theta \in [0\,,\pi]$ a le même cosinus, et $f(x) = 2\pi - 3\theta$.

    • Si $\theta \in [\frac{2\pi}{3}\,,\pi]$, c'est-à-dire $x \in [-1\,,-\frac{1}{2}]$, alors $3\theta - 2\pi \in [0\,,\pi]$, et $f(x) = 3\theta - 2\pi$.

    $$\boxed{f(x) = \begin{cases} 3\operatorname{Arccos} x - 2\pi & \text{si } -1 \leqslant x \leqslant -\frac{1}{2} \\ 2\pi - 3\operatorname{Arccos} x & \text{si } -\frac{1}{2} \leqslant x \leqslant \frac{1}{2} \\ 3\operatorname{Arccos} x & \text{si } \frac{1}{2} \leqslant x \leqslant 1 \end{cases}}$$
     Les expressions coïncident aux points de raccord : $f(-\frac{1}{2}) = 0$ et $f(\frac{1}{2}) = \pi$.

    **4.** On trace les trois arcs obtenus à la question 3, chacun étant l'image d'un morceau de la courbe de l'arc cosinus par une affinité et une translation.

    ![Figure](documents/figures/d588e97cb57f0415.svg)

    La courbe présente des points anguleux en $\pm\frac{1}{2}$, où les pentes à gauche et à droite valent $\pm 2\sqrt{3}$ ; aux bords $\pm 1$, la tangente est verticale, comme pour l'arc cosinus. Ce sont les points où $f$ n'est pas dérivable, ce que le chapitre 9 confirmera.
- id: "ma-05-46"
  feuille: "f-ma-05"
  numero: 46
