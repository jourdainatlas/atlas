  noeuds: [c-bijection, de-reciproque]
  notions: [exponentielle]
  page_enonce: 12
  page_corrige: 28
  enonce: |
    **1.** Montrer que, pour tous réels $x$ et $y$, 
    $$\operatorname{ch}(x + y) = \operatorname{ch} x\operatorname{ch} y + \operatorname{sh} x\operatorname{sh} y \qquad\text{et}\qquad \operatorname{sh}(x + y) = \operatorname{sh} x\operatorname{ch} y + \operatorname{ch} x\operatorname{sh} y.$$

    **2.** En déduire une expression de $\operatorname{th}(x + y)$ en fonction de $\operatorname{th} x$ et $\operatorname{th} y$.

    **3.** Montrer que $\operatorname{th}$ réalise une bijection de $\mathbb{R}$ sur $]-1\,,1[$, puis en déduire que $\dfrac{a + b}{1 + ab} \in \,]-1\,,1[$ pour tous $a$, $b$ de $]-1\,,1[$.

    **4.** Comparer ces formules avec celles de la trigonométrie circulaire.
  corrige: |
    **1.** On développe le second membre : 
    $$\operatorname{ch} x\operatorname{ch} y + \operatorname{sh} x\operatorname{sh} y = \frac{(\mathrm{e}^{x} + \mathrm{e}^{-x})(\mathrm{e}^{y} + \mathrm{e}^{-y}) + (\mathrm{e}^{x} - \mathrm{e}^{-x})(\mathrm{e}^{y} - \mathrm{e}^{-y})}{4} = \frac{2\mathrm{e}^{x+y} + 2\mathrm{e}^{-x-y}}{4} = \boxed{\operatorname{ch}(x + y)},$$
     et le calcul est le même pour $\operatorname{sh}(x + y)$, les termes croisés se compensant.

    **2.** On divise numérateur et dénominateur de $\frac{\operatorname{sh}(x + y)}{\operatorname{ch}(x + y)}$ par $\operatorname{ch} x\operatorname{ch} y > 0$. 
    $$\boxed{\operatorname{th}(x + y) = \frac{\operatorname{th} x + \operatorname{th} y}{1 + \operatorname{th} x\operatorname{th} y}}$$
     **3.** La fonction $\operatorname{th}$ est dérivable et strictement croissante (proposition 10), donc $\operatorname{th}(\mathbb{R})$ est un intervalle d'après le théorème 2 ; il est contenu dans $]-1\,,1[$, puisque $|\operatorname{sh} x| < \operatorname{ch} x$, et contient des réels aussi proches qu'on veut de $1$ et de $-1$, d'après les limites. Donc $\operatorname{th}(\mathbb{R}) = \,]-1\,,1[$. Si $a$, $b \in \,]-1\,,1[$, on écrit $a = \operatorname{th}\alpha$ et $b = \operatorname{th}\beta$, et la question 2 donne $\frac{a + b}{1 + ab} = \operatorname{th}(\alpha + \beta)$. 
    $$\boxed{\frac{a + b}{1 + ab} \in \,]-1\,,1[}$$
     En physique, c'est la loi de composition des vitesses en relativité restreinte, avec des vitesses mesurées en fractions de la vitesse de la lumière : la composée de deux vitesses inférieures à celle de la lumière lui reste inférieure.

    **4.** Les formules sont celles de la trigonométrie circulaire, à un signe près devant chaque produit de deux sinus : $\cos(x + y) = \cos x\cos y - \sin x\sin y$, alors que $\operatorname{ch}(x + y)$ fait apparaître $+\operatorname{sh} x\operatorname{sh} y$. De même, $\tan(x + y)$ a $1 - \tan x\tan y$ au dénominateur, et $\operatorname{th}(x + y)$ a $1 + \operatorname{th} x\operatorname{th} y$. Ce parallèle n'est pas un hasard : si l'on remplace formellement $x$ par $\mathrm{i} x$ dans les formules d'Euler du chapitre 4, on obtient $\frac{\mathrm{e}^{-x} + \mathrm{e}^{x}}{2} = \operatorname{ch} x$ pour « $\cos(\mathrm{i} x)$ », ce que la seconde année justifiera en prolongeant le cosinus à $\mathbb{C}$.
- id: "ma-05-49"
  feuille: "f-ma-05"
  numero: 49
  partie: "Fonctions hyperboliques"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonctions hyperboliques, formule de Moivre hyperbolique]
  noeuds: [de-derivee, de-operations]
  notions: [exponentielle]
  page_enonce: 12
  page_corrige: 29
  enonce: |
    Soit $n \in \mathbb{N}^{*}$ et $x$ un réel non nul.

    **1.** Montrer que $(\operatorname{ch} x + \operatorname{sh} x)^{n} = \operatorname{ch}(nx) + \operatorname{sh}(nx)$.

    **2.** Calculer les sommes $C_{n} = \displaystyle\sum_{k=0}^{n} \operatorname{ch}(kx)$ et $S_{n} = \displaystyle\sum_{k=0}^{n} \operatorname{sh}(kx)$. On montrera que $C_{n} = \dfrac{\operatorname{ch}\frac{nx}{2}\,\operatorname{sh}\frac{(n+1)x}{2}}{\operatorname{sh}\frac{x}{2}}$.

    **3.** Simplifier le produit $P_{n} = 2^{n}\displaystyle\prod_{k=1}^{n} \operatorname{ch}\frac{x}{2^{k}}$, en remarquant que $\operatorname{sh}(2a) = 2\operatorname{sh} a\operatorname{ch} a$.
  corrige: |
    **1.** D'après la proposition 10, $\operatorname{ch} x + \operatorname{sh} x = \mathrm{e}^{x}$, donc $(\operatorname{ch} x + \operatorname{sh} x)^{n} = \mathrm{e}^{nx} = \operatorname{ch}(nx) + \operatorname{sh}(nx)$.

    **2.** On calcule les deux sommes géométriques de raisons $\mathrm{e}^{x}$ et $\mathrm{e}^{-x}$, différentes de $1$ puisque $x \neq 0$, en factorisant par l'angle moitié comme au chapitre 4 : 
    $$\sum_{k=0}^{n} \mathrm{e}^{kx} = \frac{\mathrm{e}^{(n+1)x} - 1}{\mathrm{e}^{x} - 1} = \frac{\mathrm{e}^{(n+1)x/2}}{\mathrm{e}^{x/2}}\cdot\frac{\operatorname{sh}\frac{(n+1)x}{2}}{\operatorname{sh}\frac{x}{2}} = \mathrm{e}^{nx/2}\,\frac{\operatorname{sh}\frac{(n+1)x}{2}}{\operatorname{sh}\frac{x}{2}},$$
     et de même $\sum_{k=0}^{n} \mathrm{e}^{-kx} = \mathrm{e}^{-nx/2}\,\frac{\operatorname{sh}\frac{(n+1)x}{2}}{\operatorname{sh}\frac{x}{2}}$ en changeant $x$ en $-x$. La demi-somme et la demi-différence donnent 
    $$\boxed{C_{n} = \frac{\operatorname{ch}\frac{nx}{2}\,\operatorname{sh}\frac{(n+1)x}{2}}{\operatorname{sh}\frac{x}{2}} \qquad S_{n} = \frac{\operatorname{sh}\frac{nx}{2}\,\operatorname{sh}\frac{(n+1)x}{2}}{\operatorname{sh}\frac{x}{2}}}.$$
     **3.** La relation $2\operatorname{ch} a\,\operatorname{sh} a = \operatorname{sh}(2a)$, appliquée à $a = \frac{x}{2^{k}}$, donne $2\operatorname{ch}\frac{x}{2^{k}}\,\operatorname{sh}\frac{x}{2^{k}} = \operatorname{sh}\frac{x}{2^{k-1}}$. En multipliant $P_{n}$ par $\operatorname{sh}\frac{x}{2^{n}}$, les facteurs se simplifient de proche en proche, du dernier au premier : 
    $$P_{n}\,\operatorname{sh}\frac{x}{2^{n}} = 2^{n-1}\prod_{k=1}^{n-1}\operatorname{ch}\frac{x}{2^{k}}\cdot\operatorname{sh}\frac{x}{2^{n-1}} = \cdots = \operatorname{sh} x.$$

    $$\boxed{P_{n} = \frac{\operatorname{sh} x}{\operatorname{sh}\frac{x}{2^{n}}}}$$
- id: "ma-05-50"
  feuille: "f-ma-05"
  numero: 50
  partie: "Fonctions hyperboliques"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonctions hyperboliques, fonctions circulaires réciproques]
  noeuds: [de-reciproque, tg-arctan]
  notions: [exponentielle, arc-tangente, cosinus-sinus]
  page_enonce: 13
  page_corrige: 29
  enonce: |
    **1.** Montrer que, pour tout réel $x$, $\operatorname{Arctan}(\operatorname{sh} x) + \operatorname{Arccos}(\operatorname{th} x) = \dfrac{\pi}{2}$.

    **2.** Résoudre l'équation $\operatorname{th} x = \dfrac{5}{13}$, puis en déduire que $\operatorname{Arctan}\dfrac{5}{12} + \operatorname{Arccos}\dfrac{5}{13} = \dfrac{\pi}{2}$. Retrouver ce résultat géométriquement, à l'aide d'un triangle rectangle de côtés $5$, $12$ et $13$.

    **3.** Démontrer de deux façons différentes que, pour tout réel $x$, $2\operatorname{Arctan}(\operatorname{th} x) = \operatorname{Arctan}\big(\operatorname{sh}(2x)\big)$.
  corrige: |
    **1.** La fonction $\varphi : x \mapsto \operatorname{Arctan}(\operatorname{sh} x) + \operatorname{Arccos}(\operatorname{th} x)$ est dérivable sur $\mathbb{R}$, car $\operatorname{th} x \in \,]-1\,,1[$. Avec $1 + \operatorname{sh}^{2} = \operatorname{ch}^{2}$ et $\sqrt{1 - \operatorname{th}^{2} x} = \frac{1}{\operatorname{ch} x}$, 
    $$\varphi'(x) = \frac{\operatorname{ch} x}{1 + \operatorname{sh}^{2} x} - \frac{1/\operatorname{ch}^{2} x}{\sqrt{1 - \operatorname{th}^{2} x}} = \frac{1}{\operatorname{ch} x} - \frac{1}{\operatorname{ch} x} = 0.$$
     Donc $\varphi$ est constante, égale à $\varphi(0) = 0 + \operatorname{Arccos} 0$. 
    $$\boxed{\operatorname{Arctan}(\operatorname{sh} x) + \operatorname{Arccos}(\operatorname{th} x) = \frac{\pi}{2}}$$
     **2.** L'équation $\operatorname{th} x = \frac{5}{13}$ s'écrit $\frac{\mathrm{e}^{2x} - 1}{\mathrm{e}^{2x} + 1} = \frac{5}{13}$, soit $\mathrm{e}^{2x} = \frac{18}{8} = \frac{9}{4}$. 
    $$\boxed{x = \ln\frac{3}{2}, \qquad \operatorname{sh} x = \frac{1}{2}\Big(\frac{3}{2} - \frac{2}{3}\Big) = \frac{5}{12}}$$
     La question 1, en ce point, donne $\operatorname{Arctan}\frac{5}{12} + \operatorname{Arccos}\frac{5}{13} = \frac{\pi}{2}$. Géométriquement, dans le triangle rectangle de côtés $5$, $12$ et $13$, l'angle opposé au côté $5$ a pour tangente $\frac{5}{12}$, et l'autre angle aigu a pour cosinus $\frac{5}{13}$ ; ces deux angles sont complémentaires.

    **3.** *Par la dérivation.* Avec $\operatorname{ch}^{2} x + \operatorname{sh}^{2} x = \operatorname{ch}(2x)$, conséquence de l'exercice 48, 
    $$\big(2\operatorname{Arctan}(\operatorname{th} x)\big)' = \frac{2/\operatorname{ch}^{2} x}{1 + \operatorname{th}^{2} x} = \frac{2}{\operatorname{ch}^{2} x + \operatorname{sh}^{2} x} = \frac{2}{\operatorname{ch}(2x)},$$

    $$\big(\operatorname{Arctan}(\operatorname{sh} 2x)\big)' = \frac{2\operatorname{ch}(2x)}{1 + \operatorname{sh}^{2}(2x)} = \frac{2}{\operatorname{ch}(2x)}.$$
     Les deux fonctions ont la même dérivée sur $\mathbb{R}$ et sont nulles en $0$ : elles sont égales.

    *Par la trigonométrie.* Soit $\theta = \operatorname{Arctan}(\operatorname{th} x)$ ; comme $\operatorname{th} x \in \,]-1\,,1[$, $\theta \in \,]-\frac{\pi}{4}\,,\frac{\pi}{4}[$, donc $2\theta \in \,]-\frac{\pi}{2}\,,\frac{\pi}{2}[$. Alors 
    $$\tan(2\theta) = \frac{2\operatorname{th} x}{1 - \operatorname{th}^{2} x} = \frac{2\operatorname{sh} x\operatorname{ch} x}{\operatorname{ch}^{2} x - \operatorname{sh}^{2} x} = \operatorname{sh}(2x),$$
     et $2\theta$ est l'arc tangente de $\operatorname{sh}(2x)$. 
    $$\boxed{2\operatorname{Arctan}(\operatorname{th} x) = \operatorname{Arctan}\big(\operatorname{sh}(2x)\big)}$$
     La fonction $x \mapsto \operatorname{Arctan}(\operatorname{sh} x)$ de la question 1 s'appelle la fonction de Gudermann ; elle relie, sans passer par les complexes, les fonctions circulaires et hyperboliques.
- id: "ma-05-51"
  feuille: "f-ma-05"
  numero: 51
  partie: "Fonctions hyperboliques"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [fonctions hyperboliques, dérivation, bijection réciproque, logarithme]
  noeuds: [ex-logarithme, de-operations, c-bijection, de-reciproque]
  notions: [exponentielle, derivable, logarithme]
  page_enonce: 13
  page_corrige: 30
  enonce: |
    Les réciproques des fonctions hyperboliques ne sont pas au programme, mais elles s'expriment à l'aide du logarithme.

    **1.** Montrer que $\operatorname{sh}$ réalise une bijection de $\mathbb{R}$ sur $\mathbb{R}$. En résolvant l'équation $\operatorname{sh} x = y$, d'inconnue $x$, montrer que sa réciproque est $y \mapsto \ln\big(y + \sqrt{y^{2} + 1}\big)$. Calculer la dérivée de cette réciproque de deux façons : à l'aide du théorème 2 du cours, puis directement.

    **2.** Mêmes questions pour la restriction de $\operatorname{ch}$ à $[0\,,+\infty[$, qui réalise une bijection sur un intervalle que l'on précisera.

    **3.** Mêmes questions pour $\operatorname{th}$, qui réalise une bijection de $\mathbb{R}$ sur $]-1\,,1[$.
  corrige: |
    **1.** La fonction $\operatorname{sh}$ est dérivable, strictement croissante, de limites $\pm\infty$ : c'est une bijection de $\mathbb{R}$ sur $\mathbb{R}$ (théorème 2). Pour $y$ réel, $\operatorname{sh} x = y$ s'écrit $t^{2} - 2yt - 1 = 0$ avec $t = \mathrm{e}^{x} > 0$ ; le produit des racines vaut $-1$, donc une seule est positive, $y + \sqrt{y^{2} + 1}$. 
    $$\boxed{\operatorname{sh}^{-1}(y) = \ln\big(y + \sqrt{y^{2} + 1}\big)}$$
     Comme $\operatorname{sh}' = \operatorname{ch}$ ne s'annule pas, le théorème 2 donne $(\operatorname{sh}^{-1})'(y) = \frac{1}{\operatorname{ch}(\operatorname{sh}^{-1} y)} = \frac{1}{\sqrt{1 + y^{2}}}$, puisque $\operatorname{ch} = \sqrt{1 + \operatorname{sh}^{2}}$. Directement : 
    $$\Big(\ln\big(y + \sqrt{y^{2} + 1}\big)\Big)' = \frac{1 + \frac{y}{\sqrt{y^{2} + 1}}}{y + \sqrt{y^{2} + 1}} = \boxed{\frac{1}{\sqrt{y^{2} + 1}}}.$$
     **2.** La restriction de $\operatorname{ch}$ à $[0\,,+\infty[$ est strictement croissante, de $\operatorname{ch} 0 = 1$ à $+\infty$ : c'est une bijection sur $[1\,,+\infty[$. Pour $y \geqslant 1$, l'équation $t^{2} - 2yt + 1 = 0$ a deux racines positives de produit $1$, et $x \geqslant 0$ impose $t \geqslant 1$, donc la plus grande. 
    $$\boxed{\big(\operatorname{ch}_{|[0,+\infty[}\big)^{-1}(y) = \ln\big(y + \sqrt{y^{2} - 1}\big), \qquad \text{de dérivée } \frac{1}{\sqrt{y^{2} - 1}} \text{ sur } ]1\,,+\infty[}$$
     La dérivée vaut $\frac{1}{\operatorname{sh} x}$, avec $\operatorname{sh} = \sqrt{\operatorname{ch}^{2} - 1}$ sur $[0\,,+\infty[$ ; elle n'existe pas en $1$, où $\operatorname{ch}'(0) = 0$, et la courbe de la réciproque y a une tangente verticale.

    **3.** Pour $y \in \,]-1\,,1[$, l'équation $\operatorname{th} x = y$ s'écrit $\frac{\mathrm{e}^{2x} - 1}{\mathrm{e}^{2x} + 1} = y$, soit $\mathrm{e}^{2x} = \frac{1 + y}{1 - y}$. 
    $$\boxed{\operatorname{th}^{-1}(y) = \frac{1}{2}\ln\frac{1 + y}{1 - y}, \qquad \text{de dérivée } \frac{1}{1 - y^{2}}}$$
     Le théorème 2 donne la dérivée $\frac{1}{1 - \operatorname{th}^{2}(\operatorname{th}^{-1} y)} = \frac{1}{1 - y^{2}}$, et le calcul direct donne $\frac{1}{2}\big(\frac{1}{1 + y} + \frac{1}{1 - y}\big)$, qui vaut la même chose.
- id: "ma-05-52"
  feuille: "f-ma-05"
  numero: 52
  partie: "Fonctions hyperboliques"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [fonctions hyperboliques, variations]
  noeuds: [de-monotonie]
  notions: [exponentielle]
  page_enonce: 13
  page_corrige: 31
  enonce: |
    On étudie la fonction $f : x \mapsto x\operatorname{sh}\dfrac{1}{x}$, définie sur $\mathbb{R}^{*}$.

    **1.** Étudier la parité de $f$.

    **2.** Déterminer les limites de $f$ en $0^{+}$ et en $+\infty$. Pour la seconde, on reconnaîtra un taux d'accroissement.

    **3.** Montrer que, pour tout $u > 0$, $\operatorname{th} u < u$, et en déduire les variations de $f$.

    **4.** Tracer la courbe de $f$.
  corrige: |
    **1.** Pour $x \neq 0$, $f(-x) = -x\operatorname{sh}\big(-\frac{1}{x}\big) = x\operatorname{sh}\frac{1}{x}$ : $\boxed{f \text{ est paire}}$, et l'on étudie $f$ sur $]0\,,+\infty[$.

    **2.** Avec $u = \frac{1}{x}$, $f(x) = \frac{\operatorname{sh} u}{u}$. En $0^{+}$, $u \to +\infty$, et $\frac{\operatorname{sh} u}{u} = \frac{\mathrm{e}^{u}}{2u} - \frac{\mathrm{e}^{-u}}{2u} \to +\infty$ par croissances comparées. En $+\infty$, $u \to 0^{+}$, et $\frac{\operatorname{sh} u - \operatorname{sh} 0}{u}$ est le taux d'accroissement de $\operatorname{sh}$ en $0$, qui tend vers $\operatorname{sh}'(0) = \operatorname{ch} 0 = 1$. 
    $$\boxed{\lim_{0^{+}} f = +\infty, \qquad \lim_{+\infty} f = 1}$$
     **3.** La fonction $u \mapsto u - \operatorname{th} u$ a pour dérivée $1 - (1 - \operatorname{th}^{2} u) = \operatorname{th}^{2} u > 0$ sur $]0\,,+\infty[$, et s'annule en $0$ : donc $\operatorname{th} u < u$ pour $u > 0$. Ensuite, avec $u = \frac{1}{x}$, 
    $$f'(x) = \operatorname{sh}\frac{1}{x} - \frac{1}{x}\operatorname{ch}\frac{1}{x} = \operatorname{ch} u\,(\operatorname{th} u - u) < 0.$$

    $$\boxed{f \text{ est strictement décroissante sur } ]0\,,+\infty[, \text{ de } +\infty \text{ à } 1}$$
     **4.** La courbe est symétrique par rapport à $(Oy)$, a pour asymptotes $x = 0$ et $y = 1$, et reste au-dessus de cette dernière ; quelques valeurs : $f(1) = \operatorname{sh} 1 \approx 1{,}18$, $f(\frac{1}{2}) \approx 1{,}81$, $f(\frac{1}{4}) \approx 6{,}82$.

    ![Figure](documents/figures/25bae4d62032ab3c.svg)

    La courbe descend de part et d'autre de l'axe des ordonnées vers son asymptote horizontale $y = 1$, sans jamais l'atteindre, ce qui traduit l'inégalité $\operatorname{sh} u > u$ pour $u > 0$.
- id: "ma-05-53"
  feuille: "f-ma-05"
  numero: 53
  partie: "Fonctions à valeurs complexes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonctions à valeurs complexes, dérivation, dérivées successives, exponentielle]
  noeuds: [de-operations, cx-exponentielle, de-taylor]
  notions: [derivable, derivee-successive, exponentielle]
  page_enonce: 13
  page_corrige: 31
  enonce: |
    Le cours a calculé les dérivées successives de $x \mapsto \mathrm{e}^{x}\cos x$ en la voyant comme la partie réelle de $x \mapsto \mathrm{e}^{(1+\mathrm{i})x}$. On applique ici la même méthode à d'autres fonctions.

    **1.** Écrire $-1 + \mathrm{i}$ et $\sqrt{3} + \mathrm{i}$ sous forme exponentielle.

    **2.** Calculer la dérivée $n$-ième de $x \mapsto \mathrm{e}^{-x}\sin x$, puis celle de $x \mapsto \mathrm{e}^{\sqrt{3}\,x}\cos x$, pour tout $n \geqslant 1$.

    **3.** Pour quels entiers $n$ la dérivée $n$-ième de $f : x \mapsto \mathrm{e}^{-x}\sin x$ est-elle de la forme $c_{n} f$, avec $c_{n}$ réel ?

    **4.** Montrer que $f$ vérifie $f'' + 2f' + 2f = 0$. Quel lien avec le complexe $-1 + \mathrm{i}$ ?
  corrige: |
    **1.** Le module de $-1 + \mathrm{i}$ est $\sqrt{2}$, et $\frac{-1 + \mathrm{i}}{\sqrt{2}} = \cos\frac{3\pi}{4} + \mathrm{i}\sin\frac{3\pi}{4}$ ; de même, $|\sqrt{3} + \mathrm{i}| = 2$. 
    $$\boxed{-1 + \mathrm{i} = \sqrt{2}\,\mathrm{e}^{3\mathrm{i}\pi/4} \qquad \sqrt{3} + \mathrm{i} = 2\,\mathrm{e}^{\mathrm{i}\pi/6}}$$
     **2.** Pour $\lambda \in \mathbb{C}$, la proposition 11 donne, par récurrence, $\big(\mathrm{e}^{\lambda x}\big)^{(n)} = \lambda^{n}\mathrm{e}^{\lambda x}$. Or $\mathrm{e}^{-x}\sin x = \operatorname{Im}\big(\mathrm{e}^{(-1+\mathrm{i})x}\big)$, et la dérivée $n$-ième de la partie imaginaire est la partie imaginaire de la dérivée $n$-ième, par définition de la dérivée d'une fonction complexe. Avec $(-1 + \mathrm{i})^{n} = 2^{n/2}\mathrm{e}^{3\mathrm{i} n\pi/4}$ : 
    $$\big(\mathrm{e}^{-x}\sin x\big)^{(n)} = \operatorname{Im}\Big(2^{n/2}\,\mathrm{e}^{3\mathrm{i} n\pi/4}\,\mathrm{e}^{-x}\,\mathrm{e}^{\mathrm{i} x}\Big), \qquad \boxed{\big(\mathrm{e}^{-x}\sin x\big)^{(n)} = 2^{n/2}\,\mathrm{e}^{-x}\sin\Big(x + \frac{3n\pi}{4}\Big)}.$$
     De même, $\mathrm{e}^{\sqrt{3}x}\cos x = \operatorname{Re}\big(\mathrm{e}^{(\sqrt{3}+\mathrm{i})x}\big)$ et $(\sqrt{3} + \mathrm{i})^{n} = 2^{n}\mathrm{e}^{\mathrm{i} n\pi/6}$. 
    $$\boxed{\big(\mathrm{e}^{\sqrt{3}\,x}\cos x\big)^{(n)} = 2^{n}\,\mathrm{e}^{\sqrt{3}\,x}\cos\Big(x + \frac{n\pi}{6}\Big)}$$
     **3.** Si $f^{(n)} = c_{n}f$, alors en $x = 0$, $2^{n/2}\sin\frac{3n\pi}{4} = 0$, donc $\frac{3n\pi}{4} \equiv 0\ [\pi]$, ce qui équivaut à $4 \mid 3n$, soit $4 \mid n$. Réciproquement, si $n = 4m$, alors $(-1 + \mathrm{i})^{4} = 4\,\mathrm{e}^{3\mathrm{i}\pi} = -4$, et $f^{(4m)} = (-4)^{m}f$. 
    $$\boxed{f^{(n)} = c_{n}f \iff 4 \mid n, \quad \text{et alors } c_{4m} = (-4)^{m}}$$
     **4.** Pour $\varphi(x) = \mathrm{e}^{\lambda x}$ avec $\lambda = -1 + \mathrm{i}$, on a $\varphi'' + 2\varphi' + 2\varphi = (\lambda^{2} + 2\lambda + 2)\,\varphi$. Or $\lambda^{2} = -2\mathrm{i}$, donc $\lambda^{2} + 2\lambda + 2 = -2\mathrm{i} - 2 + 2\mathrm{i} + 2 = 0$. En prenant la partie imaginaire, $f'' + 2f' + 2f = 0$. 
    $$\boxed{f'' + 2f' + 2f = 0, \ \text{ car } -1 + \mathrm{i} \text{ est racine de } r^{2} + 2r + 2}$$
     Le chapitre 6 fera de cette observation la méthode de résolution des équations différentielles linéaires du second ordre à coefficients constants, et $r^{2} + 2r + 2 = 0$ y sera appelée l'équation caractéristique.
- id: "ma-05-54"
  feuille: "f-ma-05"
  numero: 54
  partie: "Fonctions à valeurs complexes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonctions à valeurs complexes, dérivation, exponentielle, puissances réelles]
  noeuds: [de-operations, cx-exponentielle, ex-logarithme]
  notions: [derivable, exponentielle, puissance-reelle, logarithme]
  page_enonce: 14
  page_corrige: 32
  enonce: |
    Soit $I$ un intervalle contenant $0$.

    **1.** Soit $\lambda \in \mathbb{C}$, et $f : I \to \mathbb{C}$ une fonction dérivable telle que $f' = \lambda f$ et $f(0) = 1$. En dérivant $t \mapsto f(t)\,\mathrm{e}^{-\lambda t}$, montrer que $f(t) = \mathrm{e}^{\lambda t}$ pour tout $t \in I$.

    **2.** Plus généralement, soit $\varphi : I \to \mathbb{C}$ dérivable, avec $\varphi(0) = 0$. Montrer que l'unique fonction $f : I \to \mathbb{C}$ dérivable telle que $f' = \varphi' f$ et $f(0) = 1$ est $\mathrm{e}^{\varphi}$. Déterminer ainsi la fonction $f : \mathbb{R} \to \mathbb{C}$ dérivable telle que $f'(t) = (1 + 2\mathrm{i} t)f(t)$ pour tout $t$ et $f(0) = 1$, et calculer son module.

    **3.** Un élève dérive $t \mapsto \mathrm{e}^{\mathrm{i} t}$ en écrivant $\big(\mathrm{e}^{\mathrm{i} t}\big)' = \mathrm{i} t\,\mathrm{e}^{\mathrm{i} t - 1}$, « comme pour une puissance ». Expliquer l'erreur.
  corrige: |
    **1.** La fonction $g : t \mapsto f(t)\,\mathrm{e}^{-\lambda t}$ est dérivable d'après la proposition 11, et 
    $$g'(t) = f'(t)\,\mathrm{e}^{-\lambda t} - \lambda f(t)\,\mathrm{e}^{-\lambda t} = \big(f'(t) - \lambda f(t)\big)\mathrm{e}^{-\lambda t} = 0.$$
     Sur l'intervalle $I$, $g$ est donc constante (proposition 11, (iii)), égale à $g(0) = 1$. Comme $\mathrm{e}^{\lambda t}\mathrm{e}^{-\lambda t} = \mathrm{e}^{0} = 1$, on en déduit $f(t) = \mathrm{e}^{\lambda t}$. 
    $$\boxed{f(t) = \mathrm{e}^{\lambda t} \ \text{ pour tout } t \in I}$$
     **2.** La fonction $\mathrm{e}^{\varphi}$ convient, puisque $(\mathrm{e}^{\varphi})' = \varphi'\mathrm{e}^{\varphi}$ et $\mathrm{e}^{\varphi(0)} = 1$. Si $f$ convient aussi, la fonction $f\,\mathrm{e}^{-\varphi}$ a pour dérivée $(f' - \varphi' f)\,\mathrm{e}^{-\varphi} = 0$ ; elle est donc constante, égale à $1$, et $f = \mathrm{e}^{\varphi}$. Avec $\varphi(t) = t + \mathrm{i} t^{2}$, on a bien $\varphi'(t) = 1 + 2\mathrm{i} t$ et $\varphi(0) = 0$. 
    $$\boxed{f(t) = \mathrm{e}^{t + \mathrm{i} t^{2}} = \mathrm{e}^{t}\big(\cos(t^{2}) + \mathrm{i}\sin(t^{2})\big), \qquad |f(t)| = \mathrm{e}^{t}}$$
     Le module ne dépend que de la partie réelle de $\varphi$, et l'argument que de sa partie imaginaire.

    **3.** La formule $(x^{\alpha})' = \alpha x^{\alpha - 1}$ concerne une puissance dont l'exposant est fixe et la base variable. Ici, c'est l'exposant qui varie : il faut dériver la composée $t \mapsto \exp(\mathrm{i} t)$, ce qui donne $\big(\mathrm{e}^{\mathrm{i} t}\big)' = \mathrm{i}\,\mathrm{e}^{\mathrm{i} t}$. C'est la même confusion qu'entre $x \mapsto x^{2}$ et $x \mapsto 2^{x}$, que le cours signale en section 5.5.
- id: "ma-05-55"
  feuille: "f-ma-05"
  numero: 55
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [parité et périodicité, variations, dérivation, "dérivée d'une composée", bijection réciproque, logarithme, fonctions circulaires réciproques]
  noeuds: [de-monotonie, de-operations, de-composee, c-bijection, de-reciproque, ex-logarithme, tg-arctan]
  notions: [derivable, logarithme, arc-tangente, cosinus-sinus]
  page_enonce: 14
  page_corrige: 32
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par une démonstration ou un contre-exemple.

    **1.** Si $f$ et $g$ sont deux fonctions impaires de $\mathbb{R}$ dans $\mathbb{R}$, alors $g \circ f$ est impaire.

    **2.** Toute fonction de $\mathbb{R}$ dans $\mathbb{R}$ est la somme d'une fonction paire et d'une fonction impaire.

    **3.** Pour tout réel $x$, $\operatorname{Arcsin}(\sin x) = x$.

    **4.** Pour tout $x \in [-1\,,1]$, $\sin(\operatorname{Arcsin} x) = x$.

    **5.** Si $f$ est dérivable et strictement croissante sur un intervalle $I$, alors $f' > 0$ sur $I$.

    **6.** Pour tout réel $x$ non nul, $\ln(x^{2}) = 2\ln|x|$.

    **7.** Pour tout $x > 0$, $(x^{x})^{x} = x^{(x^{x})}$.

    **8.** Si $f$ est une fonction paire et dérivable sur $\mathbb{R}$, alors sa dérivée $f'$ est impaire.

    **9.** La fonction $\operatorname{th}$ réalise une bijection de $\mathbb{R}$ sur $]-1\,,1[$.

    **10.** Pour tout réel $x$ non nul, $\operatorname{Arctan} x + \operatorname{Arctan}\dfrac{1}{x} = \dfrac{\pi}{2}$.
  corrige: |
    **1.** **Vraie**. Pour tout $x$, $g(f(-x)) = g(-f(x)) = -g(f(x))$ ; c'est l'exercice 2.

    **2.** **Vraie**. On écrit $f = p + i$ avec $p(x) = \frac{f(x) + f(-x)}{2}$, paire, et $i(x) = \frac{f(x) - f(-x)}{2}$, impaire ; c'est la décomposition vue en section 5.2 du cours.

    **3.** **Fausse**. Pour $x = \pi$, $\operatorname{Arcsin}(\sin\pi) = \operatorname{Arcsin} 0 = 0 \neq \pi$ ; l'égalité n'est vraie que sur $[-\frac{\pi}{2}\,,\frac{\pi}{2}]$ (exercice 41).

    **4.** **Vraie**. C'est la définition de l'arc sinus, réciproque de la restriction du sinus.

    **5.** **Fausse**. La fonction $x \mapsto x^{3}$ est strictement croissante sur $\mathbb{R}$, et sa dérivée s'annule en $0$ ; le théorème 1 ne donne qu'une condition suffisante.

    **6.** **Vraie**. Pour $x \neq 0$, $x^{2} = |x|^{2}$ avec $|x| > 0$, et la proposition 6 donne $\ln(|x|^{2}) = 2\ln|x|$ (exercice 26).

    **7.** **Fausse**. Pour $x = 3$, $(3^{3})^{3} = 3^{9}$ alors que $3^{(3^{3})} = 3^{27}$ (exercice 35). L'égalité a pourtant lieu pour $x = 1$ et $x = 2$, d'où le piège.

    **8.** **Vraie**. En dérivant l'égalité $f(-x) = f(x)$, on obtient $-f'(-x) = f'(x)$.

    **9.** **Vraie**. C'est l'exercice 48, question 3.

    **10.** **Fausse**. Pour $x = -1$, la somme vaut $-\frac{\pi}{4} - \frac{\pi}{4} = -\frac{\pi}{2}$ ; d'après la proposition 9, la somme vaut $-\frac{\pi}{2}$ pour tout $x < 0$.

    *À retenir :* les quatre affirmations fausses viennent toutes de formules vraies sur un domaine plus petit que celui qu'on leur prête.
- id: "ma-05-56"
  feuille: "f-ma-05"
  numero: 56
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [parité et périodicité, exponentielle]
  noeuds: [ex-exponentielle]
  notions: [exponentielle]
  page_enonce: 14
  page_corrige: 33
  enonce: |
    *L'exponentielle n'est pas une somme de fonctions périodiques.* Pour toute fonction $f : \mathbb{R} \to \mathbb{R}$ et tout réel $T > 0$, on note $\Delta_{T} f$ la fonction $x \mapsto f(x + T) - f(x)$. On ne fait aucune hypothèse de régularité sur les fonctions considérées.

    **1.** Vérifier que $\Delta_{T}(\lambda f + g) = \lambda\,\Delta_{T} f + \Delta_{T} g$ pour tout réel $\lambda$ et toutes fonctions $f$ et $g$, et que $\Delta_{S}(\Delta_{T} f) = \Delta_{T}(\Delta_{S} f)$ pour tous réels $S$, $T > 0$. À quelle condition a-t-on $\Delta_{T} f = 0$ ?

    **2.** Calculer $\Delta_{T}\exp$. En déduire que la fonction exponentielle n'est pas la somme d'un nombre fini de fonctions périodiques.

    **3.** Montrer de même que la fonction $x \mapsto x^{2}$ n'est pas la somme de deux fonctions périodiques. Pourquoi le raisonnement ne permet-il pas de conclure pour la fonction $x \mapsto x$ ?

    *Indication : pour la question 2, on supposera que $\exp = f_{1} + \dots + f_{n}$, où chaque $f_{i}$ est $T_{i}$-périodique, et l'on appliquera successivement $\Delta_{T_{1}}$, …, $\Delta_{T_{n}}$ aux deux membres.*
  corrige: |
    **1.** Pour tout réel $x$, on a 
    $$\Delta_{T}(\lambda f + g)(x) = \lambda f(x + T) + g(x + T) - \lambda f(x) - g(x) = \lambda\,\Delta_{T} f(x) + \Delta_{T} g(x).$$
     Les fonctions $\Delta_{S}(\Delta_{T} f)$ et $\Delta_{T}(\Delta_{S} f)$ prennent toutes deux en $x$ la valeur suivante, qui est symétrique en $S$ et $T$ : 
    $$f(x + S + T) - f(x + S) - f(x + T) + f(x).$$
     Enfin, $\Delta_{T} f = 0$ signifie que $f(x + T) = f(x)$ pour tout réel $x$. 
    $$\boxed{\Delta_{T} \text{ est linéaire}, \quad \Delta_{S}\Delta_{T} = \Delta_{T}\Delta_{S}, \quad \Delta_{T} f = 0 \iff f \text{ est } T\text{-périodique}}$$

    **2.** D'après la proposition 5 du cours, $\mathrm{e}^{x + T} - \mathrm{e}^{x} = (\mathrm{e}^{T} - 1)\mathrm{e}^{x}$ pour tout réel $x$. 
    $$\boxed{\Delta_{T}\exp = (\mathrm{e}^{T} - 1)\exp}$$
     Supposons que $\exp = f_{1} + \dots + f_{n}$, où chaque $f_{i}$ est $T_{i}$-périodique, avec $T_{i} > 0$, et notons $\Delta$ l'opération qui consiste à appliquer successivement $\Delta_{T_{1}}$, …, $\Delta_{T_{n}}$. D'une part, la formule précédente, appliquée $n$ fois, donne 
    $$\Delta\exp = (\mathrm{e}^{T_{1}} - 1)(\mathrm{e}^{T_{2}} - 1)\cdots(\mathrm{e}^{T_{n}} - 1)\exp,$$
     qui n'est pas la fonction nulle, puisque chaque facteur $\mathrm{e}^{T_{i}} - 1$ est strictement positif. D'autre part, la linéarité donne $\Delta\exp = \Delta f_{1} + \dots + \Delta f_{n}$. Comme les opérations $\Delta_{T_{j}}$ commutent, on peut, pour calculer $\Delta f_{i}$, appliquer $\Delta_{T_{i}}$ en premier : on obtient la fonction nulle, que les opérations suivantes laissent nulle, par linéarité. Ainsi $\Delta\exp = 0$, ce qui est absurde. 
    $$\boxed{\exp \text{ n'est pas la somme d'un nombre fini de fonctions périodiques}}$$

    **3.** Notons $c : x \mapsto x^{2}$. On calcule $\Delta_{T} c(x) = (x + T)^{2} - x^{2} = 2Tx + T^{2}$, puis 
    $$\Delta_{S}(\Delta_{T} c)(x) = 2T(x + S) + T^{2} - 2Tx - T^{2} = 2ST.$$
     Si l'on avait $c = f_{1} + f_{2}$, avec $f_{i}$ de période $T_{i} > 0$, l'opération $\Delta_{T_{1}}\Delta_{T_{2}}$ donnerait, comme à la question 2, la fonction nulle au second membre, et la constante $2T_{1}T_{2} \neq 0$ au premier : c'est impossible. 
    $$\boxed{x \mapsto x^{2} \text{ n'est pas la somme de deux fonctions périodiques}}$$
     Pour la fonction $x \mapsto x$, on trouve $\Delta_{T}(x \mapsto x) = T$, puis $\Delta_{S}\Delta_{T}(x \mapsto x) = 0$ : le même raisonnement ne fournit que l'égalité $0 = 0$, et ne conclut pas. Il montre seulement que $x \mapsto x$ n'est pas périodique. Ce n'est pas une faiblesse de la méthode : l'exercice 79 de la feuille du chapitre 14 montrera que $x \mapsto x$ *est* la somme de deux fonctions périodiques, nécessairement très irrégulières, puisque leur construction repose sur l'axiome du choix.

    *À retenir :* la méthode consiste à traduire l'hypothèse « $f$ est $T$-périodique » par l'équation $\Delta_{T} f = 0$, où $\Delta_{T}$ est une opération linéaire, puis à exhiber une fonction que $\Delta_{T}$ multiplie simplement par une constante non nulle. L'exponentielle joue ce rôle pour $\Delta_{T}$ comme pour la dérivation, et c'est ce qui la rend si commode. Sans aucune hypothèse de continuité, l'argument est purement algébrique ; l'exercice 21 de la feuille du chapitre 11 montrera de son côté que la somme de deux fonctions périodiques n'est pas toujours périodique.
- id: "ma-05-57"
  feuille: "f-ma-05"
  numero: 57
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["dérivée d'une composée", asymptotes, exponentielle]
  noeuds: [de-composee, cx-exponentielle]
  notions: [exponentielle]
  page_enonce: 15
  page_corrige: 34
  enonce: |
    *L'hyperbole sous deux angles.* On identifie le plan au plan complexe, le point $(x, y)$ ayant pour affixe $x + \mathrm{i} y$, comme au chapitre 4. On note 
    $$\mathcal{C} = \big\{(\operatorname{ch} t, \operatorname{sh} t) \mid t \in \mathbb{R}\big\} \qquad\text{et}\qquad \mathcal{H} = \Big\{(x, y) \in \mathbb{R}^{2} \;\Big|\; x > 0 \text{ et } y = \frac{1}{x}\Big\},$$
     et l'on désigne par $f$ la similitude directe de centre $O$, de rapport $\sqrt{2}$ et d'angle $\frac{\pi}{4}$.

    **1.** Montrer que $\mathcal{C}$ est la branche de l'hyperbole d'équation $x^{2} - y^{2} = 1$ formée de ses points d'abscisse strictement positive, et que chaque point de $\mathcal{C}$ est atteint pour une seule valeur de $t$.

    **2.** Donner l'écriture complexe de $f$, puis exprimer $f(x, y)$ et $f^{-1}(x, y)$ à l'aide des coordonnées $x$ et $y$.

    **3.** Montrer que $f(\mathcal{C}) = \mathcal{H}$. Que deviennent par $f$ les asymptotes $y = x$ et $y = -x$ de l'hyperbole ?

    **4.** Pour tout réel $s$, on note $\rho_{s}$ l'application $(x, y) \mapsto (x\operatorname{ch} s + y\operatorname{sh} s,\ x\operatorname{sh} s + y\operatorname{ch} s)$. Montrer que $\rho_{s}$ envoie le point de $\mathcal{C}$ de paramètre $t$ sur celui de paramètre $t + s$, puis que $f \circ \rho_{s} \circ f^{-1}$ est l'application $(X, Y) \mapsto (\mathrm{e}^{-s}X, \mathrm{e}^{s}Y)$. Quelle quantité, calculée en $(x, y)$, l'application $\rho_{s}$ conserve-t-elle ?
  corrige: |
    **1.** Pour tout réel $t$, la proposition 10 du cours donne $\operatorname{ch}^{2} t - \operatorname{sh}^{2} t = 1$ et $\operatorname{ch} t \geqslant 1 > 0$ : le point $(\operatorname{ch} t, \operatorname{sh} t)$ appartient à la branche annoncée. Réciproquement, soit $(x, y)$ tel que $x^{2} - y^{2} = 1$ et $x > 0$. La fonction $\operatorname{sh}$ réalise une bijection de $\mathbb{R}$ sur $\mathbb{R}$ (exercice 51, question 1) : il existe un unique réel $t$ tel que $\operatorname{sh} t = y$. Alors $x^{2} = 1 + \operatorname{sh}^{2} t = \operatorname{ch}^{2} t$, et comme $x$ et $\operatorname{ch} t$ sont strictement positifs, $x = \operatorname{ch} t$. L'unicité de $t$ vient de l'injectivité de $\operatorname{sh}$ : deux paramètres qui donnent le même point donnent la même ordonnée. 
    $$\boxed{\mathcal{C} = \big\{(x, y) \in \mathbb{R}^{2} \mid x^{2} - y^{2} = 1 \text{ et } x > 0\big\}, \text{ chaque point ayant un unique paramètre}}$$
     *Attention :* $\mathcal{C}$ n'est pas l'hyperbole entière. Les points de la branche gauche, d'abscisse négative, ne sont jamais atteints, puisque $\operatorname{ch} t \geqslant 1$ ; on les obtient avec $(-\operatorname{ch} t, \operatorname{sh} t)$.

    **2.** D'après le théorème 5 du chapitre 4, la similitude de centre $O$, de rapport $\sqrt{2}$ et d'angle $\frac{\pi}{4}$ est $z \mapsto \sqrt{2}\,\mathrm{e}^{\mathrm{i}\pi/4}z$, et $\sqrt{2}\,\mathrm{e}^{\mathrm{i}\pi/4} = 1 + \mathrm{i}$. Pour $z = x + \mathrm{i} y$, on a $(1 + \mathrm{i})(x + \mathrm{i} y) = (x - y) + \mathrm{i}(x + y)$. La réciproque est $w \mapsto \frac{w}{1 + \mathrm{i}} = \frac{1 - \mathrm{i}}{2}\,w$, et $\frac{1 - \mathrm{i}}{2}(x + \mathrm{i} y) = \frac{x + y}{2} + \mathrm{i}\,\frac{y - x}{2}$. 
    $$\boxed{f(z) = (1 + \mathrm{i})z, \qquad f(x, y) = (x - y,\ x + y), \qquad f^{-1}(x, y) = \Big(\frac{x + y}{2},\ \frac{y - x}{2}\Big)}$$

    **3.** Pour tout réel $t$, la proposition 10 (i), appliquée en $t$ et en $-t$, donne 
    $$f(\operatorname{ch} t, \operatorname{sh} t) = (\operatorname{ch} t - \operatorname{sh} t,\ \operatorname{ch} t + \operatorname{sh} t) = (\mathrm{e}^{-t},\ \mathrm{e}^{t}).$$
     Ce point a une abscisse strictement positive et une ordonnée égale à l'inverse de son abscisse : il appartient à $\mathcal{H}$. Réciproquement, un point $(x, \frac{1}{x})$ de $\mathcal{H}$, avec $x > 0$, est l'image du point de $\mathcal{C}$ de paramètre $t = -\ln x$. 
    $$\boxed{f(\mathcal{C}) = \mathcal{H}}$$
     Les asymptotes ont pour images $f(x, x) = (0, 2x)$ et $f(x, -x) = (2x, 0)$ : la droite $y = x$ est envoyée sur l'axe des ordonnées, et la droite $y = -x$ sur l'axe des abscisses, qui sont bien les asymptotes de la courbe de la fonction inverse.

    ![Figure](documents/figures/18017354ddbf54e1.svg)

    La branche d'hyperbole $\mathcal{C}$, en ardoise, et la courbe $\mathcal{H}$ de la fonction inverse, en ocre, se correspondent par la similitude $f$ : le point $M$ de paramètre $t = 0{,}6$ a pour image le point $f(M) = (\mathrm{e}^{-0{,}6}, \mathrm{e}^{0{,}6})$, obtenu en tournant le segment $[OM]$, en pointillés, d'un angle $\frac{\pi}{4}$ et en multipliant sa longueur par $\sqrt{2}$.

    **4.** Les formules d'addition de l'exercice 48, question 1, donnent 
    $$\rho_{s}(\operatorname{ch} t, \operatorname{sh} t) = (\operatorname{ch} t\operatorname{ch} s + \operatorname{sh} t\operatorname{sh} s,\ \operatorname{ch} t\operatorname{sh} s + \operatorname{sh} t\operatorname{ch} s) = \big(\operatorname{ch}(t + s),\ \operatorname{sh}(t + s)\big).$$

    $$\boxed{\rho_{s} \text{ envoie le point de paramètre } t \text{ sur le point de paramètre } t + s}$$
     Soit $(X, Y)$ un point du plan et $(x, y) = f^{-1}(X, Y)$, de sorte que $X = x - y$ et $Y = x + y$. Notons $(x', y') = \rho_{s}(x, y)$. En regroupant les termes, 
    $$x' - y' = (x - y)(\operatorname{ch} s - \operatorname{sh} s) = \mathrm{e}^{-s}X \qquad\text{et}\qquad x' + y' = (x + y)(\operatorname{ch} s + \operatorname{sh} s) = \mathrm{e}^{s}Y,$$
     et le point $f(x', y')$ a pour coordonnées $(x' - y', x' + y')$. 
    $$\boxed{f \circ \rho_{s} \circ f^{-1} : (X, Y) \longmapsto (\mathrm{e}^{-s}X,\ \mathrm{e}^{s}Y)}$$
     Cette dernière application conserve le produit $XY$. Or $XY = (x - y)(x + y) = x^{2} - y^{2}$, et l'on a de même $(x' - y')(x' + y') = \mathrm{e}^{-s}X\,\mathrm{e}^{s}Y = XY$. 
    $$\boxed{\rho_{s} \text{ conserve } x^{2} - y^{2}}$$
     L'application $\rho_{s}$ joue pour l'hyperbole le rôle que joue la rotation d'angle $s$ pour le cercle : celle-ci conserve $x^{2} + y^{2}$ et ajoute $s$ au paramètre du point $(\cos t, \sin t)$. On l'appelle *rotation hyperbolique*. En relativité restreinte, les changements de référentiel inertiel, ou transformations de Lorentz, agissent sur les coordonnées $(ct, x)$ d'un événement par des applications de cette forme, qui conservent $c^{2}t^{2} - x^{2}$ ; le paramètre $s$ y est appelé *rapidité*, la vitesse correspondante vaut $c\operatorname{th} s$, et la formule de $\operatorname{th}(x + y)$ de l'exercice 48 devient la loi de composition des vitesses, qui ne permet jamais de dépasser $c$.
- id: "ma-05-58"
  feuille: "f-ma-05"
  numero: 58
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [variations, dérivation, bijection réciproque, exponentielle]
  noeuds: [de-monotonie, de-operations, c-bijection, de-reciproque, ex-exponentielle]
  notions: [derivable, exponentielle]
  page_enonce: 15
  page_corrige: 35
  enonce: |
    On note $g : w \mapsto w\,\mathrm{e}^{w}$, définie sur $[0\,,+\infty[$, et l'on considère une fonction $W : [0\,,+\infty[ \to [0\,,+\infty[$ telle que 
    $$W(x)\,\mathrm{e}^{W(x)} = x \qquad\text{pour tout } x \geqslant 0.$$
     On ne suppose pas *a priori* que $W$ est dérivable.

    **1.** Montrer que $g$ réalise une bijection de $[0\,,+\infty[$ sur lui-même, et en déduire que $W$ est la réciproque de $g$.

    **2.** En déduire les variations de $W$, puis montrer que $W$ est dérivable sur $[0\,,+\infty[$, et que l'on a 
    $$W'(x) = \frac{W(x)}{x\,\big(1 + W(x)\big)} \qquad\text{pour tout } x > 0.$$

    **3.** Calculer $W(0)$, $W(\mathrm{e})$ et $W'(\mathrm{e})$, puis $W'(0)$.
  corrige: |
    **1.** La fonction $g$ est dérivable sur $[0\,,+\infty[$, de dérivée $g'(w) = (1 + w)\,\mathrm{e}^{w} > 0$ : elle est strictement croissante, avec $g(0) = 0$ et $g(w) \to +\infty$. D'après le théorème 2, $g([0\,,+\infty[)$ est un intervalle qui contient $0$ et n'est pas majoré, donc c'est $[0\,,+\infty[$. Pour $x \geqslant 0$, l'hypothèse s'écrit $g(W(x)) = x = g\big(g^{-1}(x)\big)$, et l'injectivité de $g$ donne $W(x) = g^{-1}(x)$. 
    $$\boxed{g : [0\,,+\infty[ \to [0\,,+\infty[ \text{ bijective, et } W = g^{-1}}$$
     **2.** D'après le théorème 2, $W$ est strictement croissante, comme $g$, et dérivable sur $[0\,,+\infty[$, puisque $g'$ ne s'annule pas, avec 
    $$W'(x) = \frac{1}{g'(W(x))} = \frac{1}{\big(1 + W(x)\big)\mathrm{e}^{W(x)}}.$$
     Pour $x > 0$, on a $W(x) > 0$ et $\mathrm{e}^{W(x)} = \frac{x}{W(x)}$. 
    $$\boxed{W'(x) = \frac{W(x)}{x\,\big(1 + W(x)\big)} \quad \text{pour } x > 0}$$
     **3.** On a $g(0) = 0$ et $g(1) = \mathrm{e}$, donc $W(0) = 0$ et $W(\mathrm{e}) = 1$. La formule précédente donne $W'(\mathrm{e}) = \frac{1}{2\mathrm{e}}$, et la première expression de $W'$ donne $W'(0) = \frac{1}{g'(0)} = 1$. 
    $$\boxed{W(0) = 0, \quad W(\mathrm{e}) = 1, \quad W'(\mathrm{e}) = \frac{1}{2\mathrm{e}}, \quad W'(0) = 1}$$
     La fonction $W$, appelée fonction de Lambert, n'a pas d'expression à l'aide des fonctions usuelles ; tout ce qu'on en sait vient de sa définition comme réciproque, ce qui illustre la force du théorème 2.
