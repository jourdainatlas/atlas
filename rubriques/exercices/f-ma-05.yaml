  enonce: |
    **1.** Montrer que, pour tout réel $x$, $\operatorname{Arctan}(x + 1) - \operatorname{Arctan} x = \operatorname{Arctan}\dfrac{1}{x^{2} + x + 1}$.

    **2.** En déduire une expression simple de $S_{n} = \displaystyle\sum_{k=0}^{n} \operatorname{Arctan}\frac{1}{k^{2} + k + 1}$ pour tout $n \in \mathbb{N}$, puis la limite de $S_{n}$ lorsque $n$ tend vers $+\infty$.
  corrige: |
    **1.** On applique l'exercice 43 avec $a = x + 1$ et $b = -x$ : $1 - ab = 1 + x + x^{2} > 0$, donc $ab < 1$ et $k = 0$. 
    $$\operatorname{Arctan}(x + 1) + \operatorname{Arctan}(-x) = \operatorname{Arctan}\frac{(x + 1) - x}{1 + x(x + 1)},$$

    $$\boxed{\operatorname{Arctan}(x + 1) - \operatorname{Arctan} x = \operatorname{Arctan}\frac{1}{x^{2} + x + 1}}$$
     **2.** La somme est télescopique, comme au chapitre 3 : 
    $$S_{n} = \sum_{k=0}^{n}\big(\operatorname{Arctan}(k + 1) - \operatorname{Arctan} k\big) = \operatorname{Arctan}(n + 1) - \operatorname{Arctan} 0, \qquad \boxed{S_{n} = \operatorname{Arctan}(n + 1) \xrightarrow[n \to +\infty]{} \frac{\pi}{2}}$$
- id: "ma-05-47"
  feuille: "f-ma-05"
  numero: 47
  partie: "Fonctions hyperboliques"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fonctions hyperboliques, équations hyperboliques]
  noeuds: [de-derivee, de-operations]
  notions: [exponentielle]
  page_enonce: 12
  page_corrige: 28
  enonce: |
    Résoudre dans $\mathbb{R}$ les équations suivantes.

    **(a)** $\operatorname{ch} x = 2$

    **(b)** $5\operatorname{ch} x - 3\operatorname{sh} x = 4$

    **(c)** $3\operatorname{sh} x - \operatorname{ch} x = 1$

    Soit ensuite $a$ et $b$ deux réels. Discuter, selon leurs valeurs, l'existence et le nombre de solutions de l'équation $a\operatorname{ch} x + b\operatorname{sh} x = 0$.
  corrige: |
    On revient chaque fois à $t = \mathrm{e}^{x} > 0$, ce qui donne une équation du second degré.

    **(a)** $\mathrm{e}^{x} + \mathrm{e}^{-x} = 4$ donne $t^{2} - 4t + 1 = 0$, de racines $2 \pm \sqrt{3}$, toutes deux positives ; comme $2 - \sqrt{3} = \frac{1}{2 + \sqrt{3}}$, on obtient deux solutions opposées, ce qu'imposait la parité de $\operatorname{ch}$. 
    $$\boxed{x = \pm\ln(2 + \sqrt{3})}$$
     **(b)** $5\operatorname{ch} x - 3\operatorname{sh} x = \mathrm{e}^{x} + 4\mathrm{e}^{-x}$, et l'équation devient $t^{2} - 4t + 4 = (t - 2)^{2} = 0$. $\boxed{x = \ln 2}$

    **(c)** $3\operatorname{sh} x - \operatorname{ch} x = \mathrm{e}^{x} - 2\mathrm{e}^{-x}$, et l'équation devient $t^{2} - t - 2 = (t - 2)(t + 1) = 0$. $\boxed{x = \ln 2}$

    Pour l'équation générale, on écrit $a\operatorname{ch} x + b\operatorname{sh} x = \frac{1}{2}\big((a + b)\mathrm{e}^{x} + (a - b)\mathrm{e}^{-x}\big)$ ; l'équation équivaut donc à $(a + b)\mathrm{e}^{2x} = b - a$.

    • Si $a = b = 0$, tout réel est solution.

    • Si $a + b = 0$ et $a \neq 0$, alors $b - a = -2a \neq 0$ : aucune solution.

    • Si $a + b \neq 0$, il faut $\frac{b - a}{a + b} > 0$, c'est-à-dire $(b - a)(b + a) > 0$, soit $|b| > |a|$.

    $$\boxed{\text{si } |b| > |a| : \text{ unique solution } x = \frac{1}{2}\ln\frac{b - a}{b + a} \ ; \ \text{ si } |b| \leqslant |a| \text{ et } (a, b) \neq (0, 0) : \text{ aucune}}$$
     Ce résultat se lit sur le cours : l'équation s'écrit $\operatorname{th} x = -\frac{a}{b}$, qui a une solution si et seulement si $-\frac{a}{b} \in \,]-1\,,1[$.
- id: "ma-05-48"
  feuille: "f-ma-05"
  numero: 48
  partie: "Fonctions hyperboliques"
  etoiles: 2
  types: [Démonstration]
