  mots_cles: [logarithme]
  noeuds: [ex-logarithme]
  notions: [logarithme]
  page_enonce: 15
  page_corrige: 36
  enonce: |
    On cherche les droites tangentes à la fois à la parabole $\mathcal{P}$ d'équation $y = x^{2}$ et à la courbe $\mathcal{L}$ d'équation $y = \ln x$.

    **1.** Écrire l'équation de la tangente à $\mathcal{P}$ au point d'abscisse $a$, puis celle de la tangente à $\mathcal{L}$ au point d'abscisse $b > 0$.

    **2.** Montrer que ces deux tangentes sont confondues si et seulement si $a = \dfrac{1}{2b}$ et $h(b) = 0$, où $h : b \mapsto \ln b - 1 + \dfrac{1}{4b^{2}}$.

    **3.** Étudier la fonction $h$ sur $]0\,,+\infty[$ et en déduire que $\mathcal{P}$ et $\mathcal{L}$ admettent exactement deux tangentes communes.

    **4.** Localiser les abscisses $b_{1} < b_{2}$ des points de contact avec $\mathcal{L}$ entre deux dixièmes consécutifs, puis tracer la figure.
  corrige: |
    **1.** Les tangentes ont pour équations 
    $$\boxed{\mathcal{P} : y = 2ax - a^{2} \qquad \mathcal{L} : y = \frac{x}{b} + \ln b - 1}.$$
     **2.** Deux droites non verticales sont confondues si et seulement si elles ont même pente et même ordonnée à l'origine : $2a = \frac{1}{b}$ et $-a^{2} = \ln b - 1$. En reportant $a = \frac{1}{2b}$ dans la seconde équation, on obtient $\ln b - 1 + \frac{1}{4b^{2}} = 0$. 
    $$\boxed{\text{tangentes confondues} \iff a = \frac{1}{2b} \ \text{ et } \ h(b) = 0}$$
     **3.** On a $h'(b) = \frac{1}{b} - \frac{1}{2b^{3}} = \frac{2b^{2} - 1}{2b^{3}}$ : $h$ décroît sur $]0\,,\frac{1}{\sqrt{2}}]$ et croît sur $[\frac{1}{\sqrt{2}}\,,+\infty[$, avec un minimum 
    $$h\Big(\frac{1}{\sqrt{2}}\Big) = -\frac{\ln 2}{2} - 1 + \frac{1}{2} = -\frac{1 + \ln 2}{2} < 0.$$
     En $0^{+}$, $h(b) = \frac{1}{4b^{2}}\big(1 + 4b^{2}\ln b - 4b^{2}\big) \to +\infty$, puisque $b^{2}\ln b \to 0$ par croissances comparées ; en $+\infty$, $h(b) \to +\infty$. Sur chacun des deux intervalles, $h$ est strictement monotone et prend des valeurs de signes opposés : d'après le théorème 2, elle s'y annule exactement une fois. 
    $$\boxed{\mathcal{P} \text{ et } \mathcal{L} \text{ ont exactement deux tangentes communes}}$$
     **4.** On calcule $h(0{,}3) \approx 0{,}57$, $h(0{,}4) \approx -0{,}35$, $h(2{,}6) \approx -0{,}0075$ et $h(2{,}7) \approx 0{,}028$. 
    $$\boxed{b_{1} \in \,]0{,}3\,;0{,}4[ \qquad b_{2} \in \,]2{,}6\,;2{,}7[}$$
     Plus précisément, $b_{1} \approx 0{,}349$ et $b_{2} \approx 2{,}621$, ce qui donne les tangentes $y \approx 2{,}865x - 2{,}053$ et $y \approx 0{,}382x - 0{,}036$.

    ![Figure](documents/figures/3f3d3eda1affd69b.svg)

    Les deux tangentes communes, en ocre, touchent chacune la parabole et la courbe du logarithme ; les points de contact, en carmin, sont ceux qui ont été calculés. L'une est presque horizontale, l'autre très pentue : elles correspondent aux deux racines de $h$, de part et d'autre de son minimum.
- id: "ma-05-60"
  feuille: "f-ma-05"
  numero: 60
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [variations, dérivation, logarithme, inégalités]
  noeuds: [de-monotonie, de-operations, ex-logarithme]
  notions: [derivable, logarithme]
  page_enonce: 16
  page_corrige: 37
  enonce: |
    Soit $a$ et $b$ deux réels tels que $0 < a < b$. On pose, pour $x > 0$, $f(x) = \dfrac{\ln(1 + ax)}{\ln(1 + bx)}$.

    **1.** On note $\psi : u \mapsto \dfrac{(1 + u)\ln(1 + u)}{u}$, définie sur $]0\,,+\infty[$. Montrer que $\psi$ est strictement croissante.

    **2.** Montrer que $f'(x)$ est du signe de $\psi(bx) - \psi(ax)$, et en déduire les variations de $f$. Quelles sont ses limites en $0^{+}$ et en $+\infty$ ?

    **3.** En comparant $f\big(\frac{1}{b}\big)$ et $f\big(\frac{1}{a}\big)$, montrer que 
    $$\ln\Big(1 + \frac{a}{b}\Big)\,\ln\Big(1 + \frac{b}{a}\Big) \leqslant (\ln 2)^{2}.$$
     L'inégalité reste-t-elle vraie lorsque $a = b$ ?
  corrige: |
    **1.** La fonction $\psi$ est dérivable sur $]0\,,+\infty[$, et 
    $$\psi'(u) = \frac{\big(\ln(1 + u) + 1\big)u - (1 + u)\ln(1 + u)}{u^{2}} = \frac{u - \ln(1 + u)}{u^{2}} > 0,$$
     d'après l'inégalité stricte $\ln(1 + u) < u$ pour $u \neq 0$ (proposition 6). 
    $$\boxed{\psi \text{ est strictement croissante}}$$
     **2.** La formule du quotient donne 
    $$f'(x) = \frac{\frac{a}{1 + ax}\ln(1 + bx) - \frac{b}{1 + bx}\ln(1 + ax)}{\ln^{2}(1 + bx)}.$$
     En multipliant le numérateur par $(1 + ax)(1 + bx) > 0$, on obtient 
    $$a(1 + bx)\ln(1 + bx) - b(1 + ax)\ln(1 + ax) = abx\,\big(\psi(bx) - \psi(ax)\big).$$
     Comme $bx > ax$, ce nombre est strictement positif : $f$ est strictement croissante. En $0^{+}$, on écrit 
    $$f(x) = \frac{a}{b}\cdot\frac{\ln(1 + ax)}{ax}\cdot\frac{bx}{\ln(1 + bx)},$$
     et chaque quotient tend vers $\ln'(1) = 1$. En $+\infty$, $\ln(1 + ax) = \ln x + \ln\big(a + \frac{1}{x}\big)$, et de même au dénominateur. 
    $$\boxed{f \text{ strictement croissante}, \qquad \lim_{0^{+}} f = \frac{a}{b}, \qquad \lim_{+\infty} f = 1}$$
     **3.** Comme $\frac{1}{b} < \frac{1}{a}$, on a $f\big(\frac{1}{b}\big) < f\big(\frac{1}{a}\big)$, c'est-à-dire $\dfrac{\ln(1 + \frac{a}{b})}{\ln 2} < \dfrac{\ln 2}{\ln(1 + \frac{b}{a})}$. Les dénominateurs étant positifs, on obtient 
    $$\boxed{\ln\Big(1 + \frac{a}{b}\Big)\ln\Big(1 + \frac{b}{a}\Big) < (\ln 2)^{2}}.$$
     Lorsque $a = b$, le membre de gauche vaut $(\ln 2)^{2}$ : l'inégalité large reste vraie, avec égalité. Ainsi, parmi les couples $(t, \frac{1}{t})$, le produit $\ln(1 + t)\ln(1 + \frac{1}{t})$ est maximal pour $t = 1$.
- id: "ma-05-61"
  feuille: "f-ma-05"
  numero: 61
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration, Calcul]
  mots_cles: [dérivation, dérivées successives, logarithme, inégalités]
  noeuds: [de-operations, de-taylor, ex-logarithme, de-monotonie, pol-binome]
  notions: [derivable, derivee-successive, logarithme, coefficient-binomial]
  page_enonce: 16
  page_corrige: 37
  enonce: |
    *Une identité binomiale obtenue par dérivation.* Pour tout entier $n \geqslant 1$, on note $H_{n} = \displaystyle\sum_{k=1}^{n} \frac{1}{k}$, et l'on pose $H_{0} = 0$.

    **1.** *Formule de Leibniz.* Soit $I$ un intervalle. Montrer par récurrence sur $n \in \mathbb{N}$ que, si $f$ et $g$ sont deux fonctions $n$ fois dérivables sur $I$, leur produit $fg$ est $n$ fois dérivable sur $I$, et 
    $$(fg)^{(n)} = \sum_{k=0}^{n} \binom{n}{k} f^{(n-k)}\,g^{(k)}.$$
     On s'inspirera de la démonstration de la formule du binôme, au chapitre 3.

    **2.** Pour tout $n \in \mathbb{N}$, on pose $u_{n}(x) = x^{n}\ln x$ pour $x > 0$. Montrer que $u_{n}'(x) = n\,u_{n-1}(x) + x^{n-1}$ pour $n \geqslant 1$, puis que $u_{n}^{(n)}(x) = n!\,(\ln x + H_{n})$ pour tout $n \in \mathbb{N}$ et tout $x > 0$.

    **3.** Calculer les dérivées successives de la fonction $\ln$, puis calculer $u_{n}^{(n)}$ à l'aide de la formule de Leibniz. En déduire que, pour tout entier $n \geqslant 1$, 
    $$\sum_{k=1}^{n} \frac{(-1)^{k-1}}{k}\binom{n}{k} = H_{n}.$$

    **4.** Vérifier cette formule pour $n = 3$. La retrouver ensuite par récurrence, sans dérivation, à l'aide de la formule de Pascal et de l'égalité $\dfrac{1}{k}\dbinom{n-1}{k-1} = \dfrac{1}{n}\dbinom{n}{k}$, valable pour $1 \leqslant k \leqslant n$. Quelle méthode préférer ?
  corrige: |
    **1.** Notons $\mathcal{P}(n)$ la propriété : « pour toutes fonctions $f$ et $g$ $n$ fois dérivables sur $I$, $fg$ est $n$ fois dérivable sur $I$ et vérifie la formule ». Pour $n = 0$, la formule se réduit à $fg = fg$. Supposons $\mathcal{P}(n)$ vraie, et soit $f$ et $g$ deux fonctions $n + 1$ fois dérivables sur $I$. Elles sont en particulier $n$ fois dérivables, et l'hypothèse de récurrence donne 
    $$(fg)^{(n)} = \sum_{k=0}^{n} \binom{n}{k} f^{(n-k)}\,g^{(k)}.$$
     Pour $0 \leqslant k \leqslant n$, les fonctions $f^{(n-k)}$ et $g^{(k)}$ sont dérivables, puisque $n - k + 1$ et $k + 1$ sont au plus égaux à $n + 1$. D'après la proposition 3 du cours, $(fg)^{(n)}$ est donc dérivable, et 
    $$(fg)^{(n+1)} = \sum_{k=0}^{n} \binom{n}{k} f^{(n+1-k)}\,g^{(k)} + \sum_{k=0}^{n} \binom{n}{k} f^{(n-k)}\,g^{(k+1)}.$$
     Dans la seconde somme, on pose $j = k + 1$ ; elle devient $\displaystyle\sum_{j=1}^{n+1} \binom{n}{j-1} f^{(n+1-j)}\,g^{(j)}$. Avec la convention $\binom{n}{-1} = \binom{n}{n+1} = 0$, les deux sommes peuvent être prises de $0$ à $n + 1$, et la formule de Pascal (proposition 9 du chapitre 3) donne $\binom{n}{k} + \binom{n}{k-1} = \binom{n+1}{k}$, d'où $\mathcal{P}(n + 1)$. 
    $$\boxed{(fg)^{(n)} = \sum_{k=0}^{n} \binom{n}{k} f^{(n-k)}\,g^{(k)}}$$
     Le calcul est exactement celui de la formule du binôme (théorème 2 du chapitre 3), la dérivation d'un facteur jouant le rôle de la multiplication par $a$ ou par $b$. La question 2 de l'exercice 25 en était le cas particulier où $f$ est la fonction $x \mapsto x$, dont les dérivées d'ordre au moins $2$ sont nulles ; le chapitre 9 fera de cette formule son théorème 9.

    **2.** La formule de dérivation d'un produit donne, pour $n \geqslant 1$ et $x > 0$, 
    $$u_{n}'(x) = n x^{n-1}\ln x + x^{n}\cdot\frac{1}{x} = n\,u_{n-1}(x) + x^{n-1}.$$
     Montrons par récurrence que $u_{n}$ est $n$ fois dérivable, avec $u_{n}^{(n)}(x) = n!\,(\ln x + H_{n})$. Pour $n = 0$, $u_{0} = \ln$ et $H_{0} = 0$. Supposons le résultat vrai au rang $n - 1$, avec $n \geqslant 1$. La fonction $u_{n}' = n\,u_{n-1} + (x \mapsto x^{n-1})$ est $n - 1$ fois dérivable, et, comme la dérivée $(n-1)$-ième de $x \mapsto x^{n-1}$ est la constante $(n - 1)!$, 
    $$u_{n}^{(n)}(x) = n\,u_{n-1}^{(n-1)}(x) + (n - 1)! = n\,(n - 1)!\,(\ln x + H_{n-1}) + (n - 1)! = n!\,\Big(\ln x + H_{n-1} + \frac{1}{n}\Big).$$

    $$\boxed{u_{n}^{(n)}(x) = n!\,(\ln x + H_{n}) \quad \text{pour tout } n \in \mathbb{N} \text{ et tout } x > 0}$$

    **3.** On a $\ln'(x) = \frac{1}{x}$. Si l'on suppose que $\ln^{(k)}(x) = (-1)^{k-1}(k - 1)!\,x^{-k}$ pour un entier $k \geqslant 1$, on obtient en dérivant 
    $$\ln^{(k+1)}(x) = (-1)^{k-1}(k - 1)!\,(-k)\,x^{-k-1} = (-1)^{k}\,k!\,x^{-(k+1)},$$
     de sorte que la formule suivante se démontre par récurrence sur $k$. 
    $$\boxed{\ln^{(k)}(x) = \frac{(-1)^{k-1}(k - 1)!}{x^{k}} \quad \text{pour tout } k \geqslant 1 \text{ et tout } x > 0}$$
     D'autre part, pour $0 \leqslant k \leqslant n$, dériver $n - k$ fois la fonction $x \mapsto x^{n}$ fait apparaître le facteur $n(n - 1)\cdots(k + 1) = \frac{n!}{k!}$ et l'exposant $k$. La formule de Leibniz, appliquée à $x \mapsto x^{n}$ et à $\ln$, isole le terme $k = 0$, qui vaut $n!\,\ln x$, et donne 
    $$u_{n}^{(n)}(x) = n!\,\ln x + \sum_{k=1}^{n} \binom{n}{k}\,\frac{n!}{k!}\,x^{k}\cdot\frac{(-1)^{k-1}(k - 1)!}{x^{k}} = n!\,\ln x + n!\sum_{k=1}^{n} \frac{(-1)^{k-1}}{k}\binom{n}{k}.$$
     En comparant avec la question 2 et en simplifiant par $n!$, on obtient l'identité annoncée. 
    $$\boxed{\sum_{k=1}^{n} \frac{(-1)^{k-1}}{k}\binom{n}{k} = H_{n} \quad \text{pour tout } n \geqslant 1}$$

    **4.** Pour $n = 3$, le membre de gauche vaut $3 - \frac{3}{2} + \frac{1}{3} = \frac{11}{6}$, et $H_{3} = 1 + \frac{1}{2} + \frac{1}{3} = \frac{11}{6}$ ✓. Notons $S_{n}$ le membre de gauche, avec $S_{0} = 0$. Pour $n \geqslant 1$ et $1 \leqslant k \leqslant n$, la formule de Pascal s'écrit $\binom{n}{k} - \binom{n-1}{k} = \binom{n-1}{k-1}$, avec $\binom{n-1}{n} = 0$. Par différence, puis par la formule du pion (proposition 9 du chapitre 3), qui est l'égalité de l'énoncé, 
    $$S_{n} - S_{n-1} = \sum_{k=1}^{n} \frac{(-1)^{k-1}}{k}\binom{n-1}{k-1} = \frac{1}{n}\sum_{k=1}^{n} (-1)^{k-1}\binom{n}{k}.$$
     La formule du binôme donne $\sum_{k=0}^{n} (-1)^{k}\binom{n}{k} = (1 - 1)^{n} = 0$ pour $n \geqslant 1$ ; la dernière somme vaut donc $1$, et $S_{n} - S_{n-1} = \frac{1}{n}$. En sommant ces égalités de $1$ à $n$, la somme télescopique donne $S_{n} = H_{n}$. 
    $$\boxed{S_{n} - S_{n-1} = \frac{1}{n}, \quad \text{d'où à nouveau } S_{n} = H_{n}}$$
     La seconde méthode est plus courte, mais elle suppose que l'on connaisse déjà le résultat. La première le fait *découvrir* : on calcule un même objet, la dérivée $n$-ième de $x \mapsto x^{n}\ln x$, de deux façons, comme on dénombrait un même ensemble de deux façons au chapitre 3. Elle s'adapte à d'autres fonctions ; avec $x \mapsto x^{2n} = x^{n}\cdot x^{n}$, elle redonne par exemple l'identité $\sum_{k=0}^{n} \binom{n}{k}^{2} = \binom{2n}{n}$, obtenue dans la feuille du chapitre 3 à l'aide de la formule de Vandermonde.

    *Attention :* le membre de gauche est une somme alternée de termes qui peuvent être très grands, alors que $H_{n}$ croît très lentement ; pour $n = 30$, certains termes dépassent $10^{7}$ en valeur absolue, alors que $H_{30} \approx 4{,}0$. Ces termes se compensent presque exactement, et un calcul approché de la somme, en virgule flottante, perd ainsi plusieurs chiffres significatifs : la formule exacte n'en est que plus précieuse.
- id: "ma-05-62"
  feuille: "f-ma-05"
  numero: 62
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [fonctions circulaires réciproques, inégalités]
  noeuds: [de-reciproque, de-monotonie, tg-arctan]
  notions: [arc-tangente, cosinus-sinus]
  page_enonce: 17
  page_corrige: 39
  enonce: |
    *Des tiroirs pour les arcs tangents.* Soit $A$ une partie finie de $\mathbb{R}$. On cherche à partir de quel cardinal de $A$ on peut affirmer qu'il existe deux éléments $a$ et $b$ de $A$ tels que $1 + ab \neq 0$ et 
    $$0 < \frac{a - b}{1 + ab} \leqslant 2 - \sqrt{3}.$$

    **1.** Montrer que $\tan\dfrac{\pi}{12} = 2 - \sqrt{3}$.

    **2.** Soit $a$ et $b$ deux réels, $\alpha = \operatorname{Arctan} a$ et $\beta = \operatorname{Arctan} b$. Montrer que $\cos(\alpha - \beta) = (1 + ab)\cos\alpha\cos\beta$, et que l'on a $\dfrac{a - b}{1 + ab} = \tan(\alpha - \beta)$ lorsque $1 + ab \neq 0$.

    **3.** On suppose que $A$ a $13$ éléments. En découpant l'intervalle $\big]-\frac{\pi}{2}\,,\frac{\pi}{2}\big[$ en douze intervalles de même longueur, et à l'aide du principe des tiroirs du chapitre 2, montrer que $A$ contient deux éléments $a$ et $b$ qui conviennent.

    **4.** Montrer que la conclusion subsiste lorsque $A$ n'a que $12$ éléments. On rangera les arcs tangents des éléments de $A$ dans l'ordre croissant, $\alpha_{1} < \alpha_{2} < \dots < \alpha_{12}$, et l'on considérera les douze écarts $\alpha_{2} - \alpha_{1}$, …, $\alpha_{12} - \alpha_{11}$ et $\alpha_{1} + \pi - \alpha_{12}$.

    **5.** Montrer qu'elle tombe en défaut pour la partie à $11$ éléments formée des réels 
    $$\tan\Big(-\frac{\pi}{2} + \frac{(2k - 1)\pi}{22}\Big), \qquad k \in [\![1\,;11]\!].$$
     Quel est donc le plus petit cardinal de $A$ qui garantisse l'existence de $a$ et $b$ ?
  corrige: |
    **1.** On a $\frac{\pi}{12} = \frac{\pi}{3} - \frac{\pi}{4}$, et la formule de $\tan(a - b)$, qui suit la proposition 8 du chapitre 4, donne 
    $$\tan\frac{\pi}{12} = \frac{\sqrt{3} - 1}{1 + \sqrt{3}} = \frac{(\sqrt{3} - 1)^{2}}{(\sqrt{3} + 1)(\sqrt{3} - 1)} = \frac{4 - 2\sqrt{3}}{2}.$$

    $$\boxed{\tan\frac{\pi}{12} = 2 - \sqrt{3}}$$

    **2.** Les réels $\alpha$ et $\beta$ appartiennent à $\big]-\frac{\pi}{2}\,,\frac{\pi}{2}\big[$, donc $\cos\alpha > 0$, $\cos\beta > 0$, et $\sin\alpha = a\cos\alpha$, $\sin\beta = b\cos\beta$. Les formules d'addition (théorème 1 du chapitre 4) donnent 
    $$\cos(\alpha - \beta) = \cos\alpha\cos\beta + \sin\alpha\sin\beta = (1 + ab)\cos\alpha\cos\beta,$$

    $$\sin(\alpha - \beta) = \sin\alpha\cos\beta - \cos\alpha\sin\beta = (a - b)\cos\alpha\cos\beta.$$
     Si $1 + ab \neq 0$, alors $\cos(\alpha - \beta) \neq 0$, et le quotient de ces deux égalités donne le résultat. 
    $$\boxed{\cos(\alpha - \beta) = (1 + ab)\cos\alpha\cos\beta \quad\text{et}\quad \frac{a - b}{1 + ab} = \tan(\alpha - \beta) \ \text{ si } 1 + ab \neq 0}$$
     En particulier, $1 + ab$ est du signe de $\cos(\alpha - \beta)$.

    **3.** Pour $j \in [\![1\,;12]\!]$, notons $I_{j} = \big]-\frac{\pi}{2} + \frac{(j - 1)\pi}{12}\,,-\frac{\pi}{2} + \frac{j\pi}{12}\big]$ : ces douze intervalles de longueur $\frac{\pi}{12}$ sont deux à deux disjoints, et leur réunion $\big]-\frac{\pi}{2}\,,\frac{\pi}{2}\big]$ contient l'arc tangent de chaque élément de $A$. L'application qui associe à $a \in A$ l'indice $j$ tel que $\operatorname{Arctan} a \in I_{j}$ va d'un ensemble à $13$ éléments dans un ensemble à $12$ éléments : d'après le principe des tiroirs (théorème 2 du chapitre 2), elle n'est pas injective. Il existe donc deux éléments distincts $a$ et $b$ de $A$ dont les arcs tangents $\alpha$ et $\beta$ sont dans le même intervalle $I_{j}$ ; quitte à les échanger, $\alpha > \beta$, puisque $\operatorname{Arctan}$ est injective, et $0 < \alpha - \beta < \frac{\pi}{12}$. Alors $\cos(\alpha - \beta) > 0$, donc $1 + ab > 0$ d'après la question 2, et 
    $$\frac{a - b}{1 + ab} = \tan(\alpha - \beta) \in \Big]0\,,\tan\frac{\pi}{12}\Big[,$$
     puisque la tangente est strictement croissante sur $\big[0\,,\frac{\pi}{2}\big[$. 
    $$\boxed{\text{si } \mathrm{card}\,A = 13, \text{ il existe } a, b \in A \text{ tels que } 0 < \frac{a - b}{1 + ab} \leqslant 2 - \sqrt{3}}$$

    **4.** Notons $a_{1}$, …, $a_{12}$ les éléments de $A$, rangés de sorte que l'on ait $\alpha_{1} < \dots < \alpha_{12}$ pour leurs arcs tangents, et posons $d_{i} = \alpha_{i+1} - \alpha_{i}$ pour $1 \leqslant i \leqslant 11$, et $d_{12} = \alpha_{1} + \pi - \alpha_{12}$. Ces douze écarts sont strictement positifs, le dernier parce que $\alpha_{12} - \alpha_{1} < \pi$, et leur somme télescopique vaut $\pi$. Ils ne peuvent donc pas tous dépasser strictement $\frac{\pi}{12}$ : l'un d'eux, $d_{i}$, vérifie $0 < d_{i} \leqslant \frac{\pi}{12}$.

    Si $i \leqslant 11$, on prend $a = a_{i+1}$ et $b = a_{i}$ : alors $\alpha - \beta = d_{i} \in \big]0\,,\frac{\pi}{12}\big]$, et l'on conclut comme à la question 3.

    Si $i = 12$, on prend $a = a_{1}$ et $b = a_{12}$ : alors $\alpha - \beta = d_{12} - \pi \in \big]-\pi\,,-\frac{11\pi}{12}\big]$. Dans ce cas, $\cos(\alpha - \beta) = -\cos d_{12} < 0$, donc $1 + ab < 0$, et la $\pi$-périodicité de la tangente donne 
    $$\frac{a - b}{1 + ab} = \tan(d_{12} - \pi) = \tan d_{12} \in \big]0\,,2 - \sqrt{3}\big].$$

    $$\boxed{\text{la conclusion reste vraie lorsque } \mathrm{card}\,A = 12}$$
     L'idée est que la tangente, étant $\pi$-périodique, « recolle » les deux extrémités de l'intervalle $\big]-\frac{\pi}{2}\,,\frac{\pi}{2}\big[$ : un très grand réel positif $b$ et un réel négatif $a$ de grande valeur absolue ont des arcs tangents éloignés, mais un quotient $\frac{a - b}{1 + ab}$ petit et positif. On range donc les douze arcs sur un cercle de longueur $\pi$, et non sur un segment, ce qui économise un tiroir.

    **5.** Posons $\alpha_{k} = -\frac{\pi}{2} + \frac{(2k - 1)\pi}{22}$ pour $k \in [\![1\,;11]\!]$. Ces réels sont compris entre $-\frac{\pi}{2} + \frac{\pi}{22}$ et $\frac{\pi}{2} - \frac{\pi}{22}$, donc $\alpha_{k}$ est l'arc tangent de $a_{k} = \tan\alpha_{k}$. Pour $k \neq l$, on a $\alpha_{k} - \alpha_{l} = \frac{(k - l)\pi}{11}$, avec $1 \leqslant |k - l| \leqslant 10$ ; ce n'est jamais $\pm\frac{\pi}{2}$, car $11$ ne peut valoir $\pm 2(k - l)$, donc $1 + a_{k}a_{l} \neq 0$. Notons $m \in [\![1\,;10]\!]$ le reste de la division de $k - l$ par $11$ ; par $\pi$-périodicité, 
    $$\frac{a_{k} - a_{l}}{1 + a_{k}a_{l}} = \tan\frac{(k - l)\pi}{11} = \tan\frac{m\pi}{11}.$$
     Si $1 \leqslant m \leqslant 5$, l'angle $\frac{m\pi}{11}$ est dans $\big[\frac{\pi}{11}\,,\frac{\pi}{2}\big[$, et sa tangente est strictement supérieure à $\tan\frac{\pi}{12} = 2 - \sqrt{3}$, puisque $\frac{\pi}{11} > \frac{\pi}{12}$. Si $6 \leqslant m \leqslant 10$, l'angle est dans $\big]\frac{\pi}{2}\,,\pi\big[$, et sa tangente est strictement négative. Aucun couple ne convient. 
    $$\boxed{\text{le plus petit cardinal qui garantit l'existence de } a \text{ et } b \text{ est } 12}$$
     Numériquement, la plus petite valeur positive du quotient pour cette partie est $\tan\frac{\pi}{11} \approx 0{,}2936$, à comparer à $2 - \sqrt{3} \approx 0{,}2679$. La constante $2 - \sqrt{3}$ est elle aussi optimale pour $12$ éléments : avec les arcs $-\frac{\pi}{2} + \frac{(2k - 1)\pi}{24}$, pour $k \in [\![1\,;12]\!]$, tous les écarts valent exactement $\frac{\pi}{12}$, et le plus petit quotient positif est égal à $2 - \sqrt{3}$.

    *À retenir :* le découpage naïf de la question 3 demande $13$ éléments, alors que $12$ suffisent. Dans un argument de tiroirs, la difficulté est toujours de choisir les tiroirs, comme le soulignait déjà le corrigé de la feuille du chapitre 1 ; ici, le bon choix vient de la périodicité de la tangente.
- id: "ma-05-63"
  feuille: "f-ma-05"
  numero: 63
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration, Calcul]
