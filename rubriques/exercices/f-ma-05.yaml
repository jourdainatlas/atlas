  noeuds: [de-monotonie]
  notions: []
  page_enonce: 17
  page_corrige: 40
  enonce: |
    *Inégalités de Young et de Hölder.* Soit $p$ et $q$ deux réels de $]1\,,+\infty[$ tels que $\dfrac{1}{p} + \dfrac{1}{q} = 1$.

    **1.** Montrer que, pour tous réels $u \geqslant 0$ et $v \geqslant 0$, $uv \leqslant \dfrac{u^{p}}{p} + \dfrac{v^{q}}{q}$. On pourra fixer $v > 0$ et étudier une fonction de la variable $u$. Que retrouve-t-on lorsque $p = q = 2$ ?

    **2.** Soit $u_{1}, \dots, u_{n}$ et $v_{1}, \dots, v_{n}$ des nombres complexes. Démontrer l'inégalité de Hölder : 
    $$\sum_{k=1}^{n} |u_{k}v_{k}| \leqslant \Big(\sum_{k=1}^{n} |u_{k}|^{p}\Big)^{1/p}\Big(\sum_{k=1}^{n} |v_{k}|^{q}\Big)^{1/q}.$$
     On commencera par le cas où $\sum |u_{k}|^{p} = \sum |v_{k}|^{q} = 1$, puis on s'y ramènera.
  corrige: |
    **1.** Si $u = 0$ ou $v = 0$, l'inégalité est claire, en convenant que $0^{p} = 0$. Fixons $v > 0$, et posons $\varphi(u) = \frac{u^{p}}{p} + \frac{v^{q}}{q} - uv$ pour $u > 0$. Alors $\varphi'(u) = u^{p-1} - v$, qui s'annule en $u_{0} = v^{1/(p-1)}$ : $\varphi$ décroît sur $]0\,,u_{0}]$ et croît ensuite. Comme $\frac{1}{p} + \frac{1}{q} = 1$ équivaut à $q = \frac{p}{p - 1}$, on a $u_{0}^{p} = v^{p/(p-1)} = v^{q}$ et $u_{0}v = v^{\frac{1}{p-1} + 1} = v^{q}$, donc 
    $$\varphi(u_{0}) = \frac{v^{q}}{p} + \frac{v^{q}}{q} - v^{q} = 0.$$

    $$\boxed{uv \leqslant \frac{u^{p}}{p} + \frac{v^{q}}{q}}$$
     Pour $p = q = 2$, on retrouve $uv \leqslant \frac{u^{2} + v^{2}}{2}$, c'est-à-dire $(u - v)^{2} \geqslant 0$.

    **2.** Notons $A = \big(\sum |u_{k}|^{p}\big)^{1/p}$ et $B = \big(\sum |v_{k}|^{q}\big)^{1/q}$. Dans le cas $A = B = 1$, la question 1 appliquée à $|u_{k}|$ et $|v_{k}|$, puis sommée, donne 
    $$\sum_{k=1}^{n} |u_{k}v_{k}| \leqslant \frac{1}{p}\sum_{k=1}^{n} |u_{k}|^{p} + \frac{1}{q}\sum_{k=1}^{n} |v_{k}|^{q} = \frac{1}{p} + \frac{1}{q} = 1.$$
     Dans le cas général, si $A = 0$, tous les $u_{k}$ sont nuls et l'inégalité est une égalité $0 = 0$ ; de même si $B = 0$. Sinon, les nombres $u_{k}' = \frac{u_{k}}{A}$ et $v_{k}' = \frac{v_{k}}{B}$ vérifient $\sum |u_{k}'|^{p} = \frac{1}{A^{p}}\sum |u_{k}|^{p} = 1$, et de même pour les $v_{k}'$. Le premier cas donne $\sum |u_{k}'v_{k}'| \leqslant 1$, soit, en multipliant par $AB$ : 
    $$\boxed{\sum_{k=1}^{n} |u_{k}v_{k}| \leqslant \Big(\sum_{k=1}^{n} |u_{k}|^{p}\Big)^{1/p}\Big(\sum_{k=1}^{n} |v_{k}|^{q}\Big)^{1/q}}$$
     Pour $p = q = 2$, c'est l'inégalité de Cauchy-Schwarz, que le chapitre 19 retrouvera dans le cadre des espaces préhilbertiens. La méthode, se ramener au cas où les deux quantités valent $1$ par homogénéité, est à retenir.
- id: "ma-05-64"
  feuille: "f-ma-05"
  numero: 64
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Calcul]
  mots_cles: [dérivation, équations fonctionnelles]
  noeuds: [de-operations]
  notions: [derivable]
  page_enonce: 17
  page_corrige: 41
  enonce: |
    **1.** Déterminer toutes les fonctions $f : \mathbb{R} \to \mathbb{R}$ dérivables telles que $f(x + y) = f(x) + f(y)$ pour tous réels $x$ et $y$. On pourra dériver la relation par rapport à $y$, à $x$ fixé.

    **2.** Déterminer toutes les fonctions $f : \,]0\,,+\infty[ \to \mathbb{R}$ dérivables telles que $f(xy) = f(x) + f(y)$ pour tous $x$, $y > 0$. Quel lien avec l'introduction historique du cours ?

    **3.** Déterminer de même les fonctions $f : \mathbb{R} \to \,]0\,,+\infty[$ dérivables telles que $f(x + y) = f(x)f(y)$ pour tous réels $x$ et $y$.
  corrige: |
    **1.** Fixons $x$, et dérivons l'égalité $f(x + y) = f(x) + f(y)$ par rapport à $y$ : $f'(x + y) = f'(y)$. En $y = 0$, $f'(x) = f'(0)$ : la dérivée est constante, égale à un réel $c$. La fonction $x \mapsto f(x) - cx$ a une dérivée nulle sur $\mathbb{R}$, donc elle est constante (théorème 1), égale à $f(0)$ ; or $f(0) = f(0 + 0) = 2f(0)$ impose $f(0) = 0$. 
    $$\boxed{f(x) = cx, \ c \in \mathbb{R}}$$
     Réciproquement, ces fonctions conviennent.

    **2.** Dérivons de même par rapport à $y$ : $x f'(xy) = f'(y)$, puis faisons $y = 1$ : $f'(x) = \frac{c}{x}$, avec $c = f'(1)$. Alors $f - c\ln$ est constante sur $]0\,,+\infty[$, et $f(1) = 2f(1)$ donne $f(1) = 0$. 
    $$\boxed{f = c\ln, \ c \in \mathbb{R}}$$
     Ce sont exactement les logarithmes de toutes les bases, au facteur près : la seule façon dérivable de transformer les produits en sommes est celle de Napier, comme le racontait l'introduction historique du cours.

    **3.** La fonction $g = \ln \circ f$ est dérivable, et $g(x + y) = \ln\big(f(x)f(y)\big) = g(x) + g(y)$. D'après la question 1, $g(x) = cx$. 
    $$\boxed{f(x) = \mathrm{e}^{cx}, \ c \in \mathbb{R}}$$
     L'hypothèse $f > 0$ permet de prendre le logarithme ; sans elle, il faudrait ajouter la fonction nulle. On peut affaiblir l'hypothèse de dérivabilité en une hypothèse de continuité, avec les mêmes conclusions, mais la démonstration utilise la densité de $\mathbb{Q}$ dans $\mathbb{R}$, qui relève des chapitres 7 et 8.

