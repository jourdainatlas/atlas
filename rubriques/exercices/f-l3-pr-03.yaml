  source: "Durand, exercice 1.5 (6)"
  page_enonce: 5
  page_corrige: 9
  enonce: |
    On place $m \geqslant 1$ boules au hasard, indépendamment, dans $n \geqslant 2$ boîtes, et l'on note $V$ le nombre de boîtes vides. En écrivant $V$ comme une somme d'indicatrices, calculer $\mathbb{E}[V]$ et $\operatorname{Var}(V)$. Que deviennent-ils quand $m = n \to +\infty$ ?
  corrige: |
    Soit $V_{i}$ l'indicatrice de l'évènement « la boîte $i$ est vide », de probabilité $\big(1 - \dfrac{1}{n}\big)^{m}$ ; pour $i \neq j$, $\mathbb{P}(V_{i}V_{j} = 1) = \big(1 - \dfrac{2}{n}\big)^{m}$. Donc, par linéarité, 
    $$\boxed{\mathbb{E}[V] = n\Big(1 - \frac{1}{n}\Big)^{m}},$$

    $$\operatorname{Var}(V) = \mathbb{E}[V^{2}] - \mathbb{E}[V]^{2} = \boxed{n\Big(1 - \frac{1}{n}\Big)^{m} + n(n - 1)\Big(1 - \frac{2}{n}\Big)^{m} - n^{2}\Big(1 - \frac{1}{n}\Big)^{2m}},$$
     en développant $V^{2} = \mathop{\displaystyle \sum_{i}}V_{i} + \mathop{\displaystyle \sum_{i \neq j}}V_{i}V_{j}$. Pour $m = n$, $\dfrac{\mathbb{E}[V]}{n} \to \mathrm{e}^{-1} \approx 0{,}368$ : avec autant de boules que de boîtes, environ $37\,\%$ des boîtes restent vides. Un développement limité donne $\dfrac{\operatorname{Var}(V)}{n} \to \mathrm{e}^{-1} - 2\mathrm{e}^{-2} \approx 0{,}097$ (vérifié numériquement : $0{,}0972$ pour $n = 1\,000$) : l'écart type, d'ordre $\sqrt{n}$, est petit devant l'espérance.
