  source: "Durand, exercice 2.15"
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Le nombre $X$ d'enfants d'une famille suit la loi $\mathcal{G}(p)$, et, sachant $X$, les sexes des enfants sont indépendants et équiprobables. Déterminer la loi du nombre $Y$ de filles. *On pourra utiliser $(1 - x)^{-r - 1} = \mathop{\displaystyle \sum_{n \geqslant 0}}\dbinom{n + r}{n}x^{n}$ pour $|x| < 1$ et $r \in \mathbb{N}$.* Calculer $\mathbb{P}(Y = 0)$ et $\mathbb{E}[Y]$.
  corrige: |
    Sachant $X = n$, $Y \sim \mathcal{B}(n, \dfrac{1}{2})$. Par la formule des probabilités totales, avec $q = 1 - p$ et $x = \dfrac{q}{2}$, pour $r \geqslant 1$, 
    $$\mathbb{P}(Y = r) = \sum_{n \geqslant r}pq^{n - 1}\binom{n}{r}2^{-n} = \frac{p}{q}\sum_{n \geqslant r}\binom{n}{r}x^{n} = \frac{p}{q}\cdot\frac{x^{r}}{(1 - x)^{r + 1}} = \boxed{\frac{2p}{q(1 + p)}\Big(\frac{q}{1 + p}\Big)^{r}},$$
     car $1 - x = \dfrac{1 + p}{2}$. Pour $r = 0$, $\mathbb{P}(Y = 0) = \mathop{\displaystyle \sum_{n \geqslant 1}}pq^{n - 1}2^{-n} = \dfrac{p/2}{1 - q/2} = \boxed{\dfrac{p}{1 + p}}$. On vérifie que la somme vaut $1$. Sachant $Y \geqslant 1$, $Y$ suit une loi géométrique de paramètre $\dfrac{2p}{1 + p}$. Enfin, par la formule des probabilités totales, $\mathbb{E}[Y] = \mathop{\displaystyle \sum_{n}}\mathbb{P}(X = n)\dfrac{n}{2} = \boxed{\dfrac{1}{2p}}$ : en moyenne, la moitié des enfants sont des filles.

