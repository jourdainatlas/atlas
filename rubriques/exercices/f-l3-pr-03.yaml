- id: "l3-pr-03-01"
  feuille: "f-l3-pr-03"
  numero: 1
  partie: "Lois, espérance, variance"
  etoiles: 1
  types: [Calcul]
  mots_cles: [espérance et variance]
  noeuds: [p-variables, p-esperance]
  notions: [variable-aleatoire, esperance, variance]
  source: "Bordeaux, L3 Probabilités 2015-2016, TD 2, exercice 2 ; Durand (Orsay), exercices 2.22 et 1.37"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Soit $A$ et $B$ deux évènements indépendants, de probabilités $p_{A}$ et $p_{B}$, et $X = \mathbf{1}_{A}$, $Y = \mathbf{1}_{B}$. Déterminer les lois de $X$, $Y$, $XY$ et $X + Y$, et leurs espérances. Les variables $X$ et $Y$ sont-elles indépendantes ?

    **2.** Soit $A$, $B$ deux évènements quelconques et $a$, $b$ deux réels non nuls. Déterminer la loi de $a\mathbf{1}_{A} + b\mathbf{1}_{B}$. Examiner les cas où $A$ et $B$ sont incompatibles, et où ils sont indépendants.

    **3.** Soit $U$ une variable de loi uniforme sur $[0, 1]$ (c'est-à-dire telle que $\mathbb{P}(U \leqslant t) = t$ pour $t \in [0, 1]$) et $c \in \, ]0, 1[$. Quelle est la loi de $\mathbf{1}_{\{U \leqslant c\}}$ ?

    **4.** Une variable aléatoire réelle peut-elle être indépendante d'elle-même ?
  corrige: |
    **1.** $X \sim \mathcal{B}(p_{A})$ et $Y \sim \mathcal{B}(p_{B})$, d'espérances $p_{A}$ et $p_{B}$. Comme $XY = \mathbf{1}_{A \cap B}$, $XY \sim \mathcal{B}(p_{A}p_{B})$, d'espérance $p_{A}p_{B}$. La variable $X + Y$ prend les valeurs $0$, $1$, $2$ avec les probabilités 
    $$(1 - p_{A})(1 - p_{B}), \qquad p_{A} + p_{B} - 2p_{A}p_{B}, \qquad p_{A}p_{B},$$
     et $\mathbb{E}[X + Y] = p_{A} + p_{B}$. Les variables sont indépendantes : les évènements $\{X = i\}$ et $\{Y = j\}$ sont $A$ ou $\overline{A}$ et $B$ ou $\overline{B}$, indépendants (chapitre 2, prop. 5), et l'on applique le critère discret (cours, prop. 7).

    **2.** La variable $a\mathbf{1}_{A} + b\mathbf{1}_{B}$ prend les valeurs $0$, $a$, $b$, $a + b$ sur les quatre atomes $\overline{A} \cap \overline{B}$, $A \cap \overline{B}$, $\overline{A} \cap B$, $A \cap B$, avec leurs probabilités (en regroupant si $a = b$). Si $A$ et $B$ sont incompatibles, la valeur $a + b$ disparaît : la loi est $\mathbb{P}(A)\delta_{a} + \mathbb{P}(B)\delta_{b} + (1 - \mathbb{P}(A) - \mathbb{P}(B))\delta_{0}$. S'ils sont indépendants, chaque atome a la probabilité produit.

    **3.** $\mathbb{P}(\mathbf{1}_{\{U \leqslant c\}} = 1) = \mathbb{P}(U \leqslant c) = c$ : c'est la loi $\boxed{\mathcal{B}(c)}$. C'est ainsi que l'on simule une variable de Bernoulli à partir d'un générateur uniforme.

    **4.** Si $X$ est indépendante d'elle-même, pour tout réel $t$, $\mathbb{P}(X \leqslant t) = \mathbb{P}(X \leqslant t)^{2}$, donc $F_{X}(t) \in \{0, 1\}$. La fonction $F_{X}$, croissante, de limites $0$ et $1$, saute donc de $0$ à $1$ en un point $c$ : $\boxed{X = c \text{ presque sûrement}}$. Réciproquement, une constante est indépendante de toute variable. C'est la version « variable » de l'exercice 14 de la feuille 2.
- id: "l3-pr-03-02"
  feuille: "f-l3-pr-03"
