  page_enonce: 3
  page_corrige: 6
  enonce: |
    **1.** Soit $G_{1}$, …, $G_{d}$ des variables indépendantes, avec $\mathbb{P}(G_{i} = k) = (1 - r_{i})r_{i}^{k - 1}$ pour $k \geqslant 1$, où $0 \leqslant r_{i} < 1$. Déterminer la loi de $\mathop{\displaystyle \min}(G_{1}, \dots, G_{d})$. Reprendre la question pour les variables censurées $\mathop{\displaystyle \min}(G_{i} - 1, N)$, à valeurs dans $\{0, \dots, N\}$.

    **2.** Soit $(X_{n})_{n \geqslant 1}$ des variables indépendantes, $X_{n}$ de loi $\mathcal{G}(p_{n})$, et $Z_{n} = \mathop{\displaystyle \min}(X_{1}, \dots, X_{n})$. Calculer $\mathbb{P}(Z_{n} \geqslant k)$ et la loi de $Z_{n}$. On suppose $p_{n} = \dfrac{1}{(n + 1)^{2}}$ ; calculer $\mathop{\displaystyle \lim_{n}}\mathbb{P}(Z_{n} = k)$ pour $k \in \mathbb{N}^{*}$. *On pourra utiliser $\mathop{\displaystyle \prod_{j = 2}^{n + 1}}\big(1 - \dfrac{1}{j^{2}}\big) = \dfrac{n + 2}{2(n + 1)}$, à démontrer.*
  corrige: |
    **1.** $\mathbb{P}(G_{i} \geqslant k) = r_{i}^{k - 1}$, et par indépendance $\mathbb{P}(\mathop{\displaystyle \min} G_{i} \geqslant k) = (r_{1}\cdots r_{d})^{k - 1}$ : le minimum suit la loi géométrique de paramètre $\boxed{1 - r_{1}\cdots r_{d}}$. Pour les variables censurées, $\mathbb{P}(\mathop{\displaystyle \min}(G_{i} - 1, N) \geqslant k) = r_{i}^{k}$ pour $0 \leqslant k \leqslant N$, et le minimum vérifie $\mathbb{P}(\mathop{\displaystyle \min} \geqslant k) = (r_{1}\cdots r_{d})^{k}$ pour $k \leqslant N$ : c'est la loi géométrique sur $\mathbb{N}$ de paramètre $1 - r_{1}\cdots r_{d}$, censurée en $N$.

    **2.** $\mathbb{P}(Z_{n} \geqslant k) = \mathop{\displaystyle \prod_{j = 1}^{n}}(1 - p_{j})^{k - 1} = \rho_{n}^{k - 1}$ avec $\rho_{n} = \mathop{\displaystyle \prod_{j}}(1 - p_{j})$ : $Z_{n} \sim \mathcal{G}(1 - \rho_{n})$. Pour $p_{j} = \dfrac{1}{(j + 1)^{2}}$, $1 - \dfrac{1}{i^{2}} = \dfrac{(i - 1)(i + 1)}{i^{2}}$, et le produit télescope : 
    $$\rho_{n} = \prod_{i = 2}^{n + 1}\frac{i - 1}{i} \cdot \prod_{i = 2}^{n + 1}\frac{i + 1}{i} = \frac{1}{n + 1} \cdot \frac{n + 2}{2} \xrightarrow[n \to +\infty]{} \frac{1}{2},$$
     donc $\boxed{\mathbb{P}(Z_{n} = k) \to \dfrac{1}{2^{k}}}$ : la loi limite est $\mathcal{G}(\dfrac{1}{2})$. Bien que chaque $X_{n}$ ait une espérance $(n + 1)^{2}$ de plus en plus grande, le minimum reste petit, à cause des premiers termes.
- id: "l3-pr-03-10"
  feuille: "f-l3-pr-03"
  numero: 10
  partie: "Temps d'attente, loi géométrique"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [loi géométrique]
  noeuds: [p-variables, p-independance]
  notions: [variable-aleatoire, loi-variable]
  source: "Durand, exercice 3.12 (1)"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    *(Paradoxe de Saint-Pétersbourg.)* Un croupier lance une pièce jusqu'à obtenir face ; si face apparaît pour la première fois au $j$-ième lancer, il donne $2^{j}$ euros au joueur.

    **1.** Déterminer la loi du gain $X$ et montrer que $\mathbb{E}[X] = +\infty$. Quel droit d'entrée est-il « équitable » de demander au joueur ?

    **2.** Le casino ne peut pas payer plus de $2^{M}$ euros : le gain devient $\mathop{\displaystyle \min}(X, 2^{M})$. Calculer son espérance, et sa valeur pour une banque de $2^{30}$ euros, soit environ un milliard. Commenter.
  corrige: |
    **1.** $\mathbb{P}(X = 2^{j}) = 2^{-j}$, $j \in \mathbb{N}^{*}$, et $\mathbb{E}[X] = \mathop{\displaystyle \sum_{j}}2^{j}2^{-j} = \mathop{\displaystyle \sum_{j}}1 = +\infty$. Aucun droit d'entrée fini n'est « équitable » au sens de l'espérance : le joueur devrait accepter de payer n'importe quelle somme. Pourtant, personne ne paierait cent euros : c'est le paradoxe que Daniel Bernoulli résolvait par l'utilité.

    **2.** $\mathbb{E}[\mathop{\displaystyle \min}(X, 2^{M})] = \mathop{\displaystyle \sum_{j = 1}^{M}}2^{j}2^{-j} + 2^{M}\mathbb{P}(X > 2^{M}) = M + 2^{M}2^{-M} = \boxed{M + 1}$. Pour une banque de $2^{30}$ euros, l'espérance n'est que de $31$ euros : l'espérance infinie vient de gains astronomiques et très improbables, qu'aucun casino ne peut payer. La feuille 9 montrera que le gain moyen de $n$ parties croît comme $\log_{2}n$.
- id: "l3-pr-03-11"
  feuille: "f-l3-pr-03"
  numero: 11
  partie: "Plusieurs variables, indépendance"
  etoiles: 1
  types: [Calcul]
  mots_cles: [variables indépendantes]
  noeuds: [p-independance, p-variables]
  notions: [independance, variable-aleatoire]
  source: "Bordeaux, TD 2, exercice 6"
  page_enonce: 4
  page_corrige: 6
  enonce: |
    Une urne contient $n \geqslant 2$ boules numérotées de $1$ à $n$. On tire successivement deux boules avec remise ; on note $X$ et $Y$ leurs numéros, et $Z = \mathop{\displaystyle \min}(X, Y)$.

    **1.** Déterminer la loi de $T = (-1)^{X}$.

    **2.** Calculer $\mathbb{P}(Z \geqslant k)$ pour $k \in \llbracket 1, n \rrbracket$, et en déduire la loi de $Z$ et son espérance.

    **3.** Calculer $\mathbb{P}(X - Y = -2)$, puis la loi de $X - Y$.
  corrige: |
    On prend $\Omega = \llbracket 1, n \rrbracket^{2}$, uniforme : $X$ et $Y$ sont indépendantes, de loi $\mathcal{U}(\llbracket 1, n \rrbracket)$.

    **1.** $T$ vaut $1$ si $X$ est pair : $\mathbb{P}(T = 1) = \dfrac{\lfloor n/2 \rfloor}{n}$ et $\mathbb{P}(T = -1) = \dfrac{\lceil n/2 \rceil}{n}$. Pour $n$ pair, $T$ suit la loi uniforme sur $\{-1, 1\}$ (loi de Rademacher).

    **2.** $\mathbb{P}(Z \geqslant k) = \mathbb{P}(X \geqslant k)\mathbb{P}(Y \geqslant k) = \Big(\dfrac{n - k + 1}{n}\Big)^{2}$, d'où 
    $$\mathbb{P}(Z = k) = \frac{(n - k + 1)^{2} - (n - k)^{2}}{n^{2}} = \boxed{\frac{2(n - k) + 1}{n^{2}}},$$

    $$\mathbb{E}[Z] = \sum_{k = 1}^{n}\mathbb{P}(Z \geqslant k) = \frac{1}{n^{2}}\sum_{j = 1}^{n}j^{2} = \frac{(n + 1)(2n + 1)}{6n},$$
     par l'exercice 5. Pour un dé ($n = 6$), le plus petit de deux résultats vaut en moyenne $\dfrac{91}{36} \approx 2{,}53$.

    **3.** $X - Y = -2$ pour les couples $(i, i + 2)$, $1 \leqslant i \leqslant n - 2$ : $\boxed{\mathbb{P}(X - Y = -2) = \dfrac{n - 2}{n^{2}}}$. De même, $\mathbb{P}(X - Y = d) = \dfrac{n - |d|}{n^{2}}$ pour $|d| \leqslant n - 1$ : loi « triangulaire ».
- id: "l3-pr-03-12"
  feuille: "f-l3-pr-03"
  numero: 12
  partie: "Plusieurs variables, indépendance"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [variables indépendantes]
  noeuds: [p-independance, p-variables, pol-binome]
  notions: [independance, variable-aleatoire, coefficient-binomial]
  source: "Bordeaux, DS du 16/03/2016, exercice 2 ; Annales ESCP-HEC (TD « Vecteurs aléatoires discrets »), exercice 6 ; Durand, exercice 2.23"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    **1.** En séparant $\llbracket 1, 2n \rrbracket$ en deux parties, justifier en une phrase l'identité $\dbinom{2n}{n} = \mathop{\displaystyle \sum_{k = 0}^{n}}\dbinom{n}{k}\dbinom{n}{n - k}$.

    **2.** Deux joueurs lancent chacun $n$ fois une pièce équilibrée ; $X$ et $Y$ sont leurs nombres de piles. Quelle est la loi de $X$ ? Calculer $\mathbb{P}(X = Y)$, puis la loi de $X - Y$. Donner un équivalent de $\mathbb{P}(X = Y)$ quand $n \to +\infty$ (on admettra la formule de Stirling).

    **3.** Soit $X \sim \mathcal{B}(n, \dfrac{1}{2})$ et $Y \sim \mathcal{B}(m, \dfrac{1}{2})$ indépendantes. Rappeler la loi de $X + Y$, puis calculer $\mathbb{P}(X = Y)$ et $\mathbb{P}(X \neq Y)$. *On pourra remarquer que $m - Y$ a la même loi que $Y$.*
  corrige: |
    **1.** Choisir $n$ éléments parmi $2n$, c'est en choisir $k$ dans la première moitié et $n - k$ dans la seconde, pour un certain $k$.

    **2.** $X$ et $Y$ suivent la loi $\mathcal{B}(n, \dfrac{1}{2})$ et sont indépendantes. Par la question 1, 
    $$\mathbb{P}(X = Y) = \sum_{k = 0}^{n}\binom{n}{k}^{2}4^{-n} = \boxed{\binom{2n}{n}4^{-n}}.$$
     La variable $n - Y$ a la même loi que $Y$ et est indépendante de $X$, donc $X + (n - Y) \sim \mathcal{B}(2n, \dfrac{1}{2})$ (somme de $2n$ lancers), et $\mathbb{P}(X - Y = d) = \mathbb{P}(X + n - Y = n + d) = \dbinom{2n}{n + d}4^{-n}$. Par la formule de Stirling, $\dbinom{2n}{n} \sim \dfrac{4^{n}}{\sqrt{\pi n}}$, d'où $\boxed{\mathbb{P}(X = Y) \sim \dfrac{1}{\sqrt{\pi n}}}$ : $0{,}246$ pour $n = 5$ (équivalent $0{,}252$), $0{,}080$ pour $n = 50$.

    **3.** $X + Y \sim \mathcal{B}(n + m, \dfrac{1}{2})$, et $m - Y$ a la loi de $Y$, indépendante de $X$ : $X + (m - Y) \sim \mathcal{B}(n + m, \dfrac{1}{2})$, et 
    $$\boxed{\mathbb{P}(X = Y) = \mathbb{P}(X + m - Y = m) = \binom{n + m}{m}2^{-(n + m)}}, \qquad \mathbb{P}(X \neq Y) = 1 - \binom{n + m}{m}2^{-(n + m)}.$$
- id: "l3-pr-03-13"
  feuille: "f-l3-pr-03"
  numero: 13
  partie: "Plusieurs variables, indépendance"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [variables indépendantes]
  noeuds: [p-independance, p-variables, pol-binome]
  notions: [independance, variable-aleatoire, coefficient-binomial]
  source: "Durand, exercice 2.36 ; Annales ESCP-HEC (TD « Vecteurs aléatoires discrets »), exercice 24"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    **1.** On tire $n \geqslant 1$ fois, avec remise, un jeton parmi $N$ jetons numérotés de $1$ à $N$. Décrire le modèle, calculer la probabilité que tous les numéros tirés soient au plus égaux à $k$, et en déduire la fonction de répartition et la loi du maximum $M$. Quels sont ses modes ? Quel nombre minimal de tirages assure $\mathbb{P}(M > N/2) > p$, pour $p \in \, ]0, 1[$ donné ?

    **2.** On lance deux dés. Donner la loi du maximum. Le minimum et le maximum sont-ils indépendants ?

    **3.** On tire maintenant $n$ boules simultanément dans une urne de $m \geqslant n \geqslant 2$ boules numérotées de $1$ à $m$ ; $I_{n}$ et $S_{n}$ sont le plus petit et le plus grand numéro obtenus. Montrer que $\mathop{\displaystyle \sum_{k = p}^{q}}\dbinom{k}{p} = \dbinom{q + 1}{p + 1}$ pour $p \leqslant q$. Calculer $\mathbb{P}(S_{n} \leqslant k)$, la loi de $S_{n}$ et son espérance, puis celles de $I_{n}$.
  corrige: |
    **1.** On prend $\Omega = \llbracket 1, N \rrbracket^{n}$, uniforme. Tous les numéros sont au plus égaux à $k$ dans $k^{n}$ issues : 
    $$\mathbb{P}(M \leqslant k) = \Big(\frac{k}{N}\Big)^{n}, \qquad \boxed{\mathbb{P}(M = k) = \frac{k^{n} - (k - 1)^{n}}{N^{n}}}, \quad 1 \leqslant k \leqslant N.$$
     Pour $n \geqslant 2$, $k^{n} - (k - 1)^{n}$ croît avec $k$ : le mode est $N$. Pour $n = 1$, la loi est uniforme. Si $N$ est pair, $\mathbb{P}(M > N/2) = 1 - 2^{-n} > p$ si et seulement si $n > \log_{2}\dfrac{1}{1 - p}$ ; si $N$ est impair, on remplace $\dfrac{1}{2}$ par $\dfrac{\lfloor N/2 \rfloor}{N}$.

    1.5em

    ![Figure](documents/figures/b5d2a336dc1d4e96.svg)

    La loi du plus grand numéro tiré parmi $N = 30$ jetons. Avec un seul tirage, elle est uniforme ; avec cinq tirages, elle se concentre sur les grandes valeurs, et le mode $30$ a la probabilité $\dfrac{30^{5} - 29^{5}}{30^{5}} \approx 0{,}156$.

    **2.** Pour deux dés, $\mathbb{P}(M = k) = \dfrac{2k - 1}{36}$. Le minimum et le maximum ne sont pas indépendants : $\mathbb{P}(\mathop{\displaystyle \min} = 6, \mathop{\displaystyle \max} = 1) = 0$, alors que $\mathbb{P}(\mathop{\displaystyle \min} = 6)\mathbb{P}(\mathop{\displaystyle \max} = 1) = \dfrac{1}{36} \cdot \dfrac{1}{36}$. Plus simplement, $\mathop{\displaystyle \min} \leqslant \mathop{\displaystyle \max}$.

    **3.** L'identité compte les parties à $p + 1$ éléments de $\llbracket 0, q \rrbracket$ selon leur plus grand élément $k$ : il faut choisir les $p$ autres dans $\llbracket 0, k - 1 \rrbracket$. Le tirage est une partie uniforme à $n$ éléments de $\llbracket 1, m \rrbracket$. $S_{n} \leqslant k$ si les $n$ boules sont dans $\llbracket 1, k \rrbracket$ : 
    $$\mathbb{P}(S_{n} \leqslant k) = \frac{\binom{k}{n}}{\binom{m}{n}}, \qquad \mathbb{P}(S_{n} = k) = \frac{\binom{k - 1}{n - 1}}{\binom{m}{n}}, \quad n \leqslant k \leqslant m,$$
     puisque $\dbinom{k}{n} - \dbinom{k - 1}{n} = \dbinom{k - 1}{n - 1}$. Avec $k\dbinom{k - 1}{n - 1} = n\dbinom{k}{n}$ et l'identité, 
    $$\mathbb{E}[S_{n}] = \frac{n}{\binom{m}{n}}\sum_{k = n}^{m}\binom{k}{n} = \frac{n\binom{m + 1}{n + 1}}{\binom{m}{n}} = \boxed{\frac{n(m + 1)}{n + 1}}.$$
     Par symétrie, $m + 1 - I_{n}$ a la loi de $S_{n}$ : $\mathbb{P}(I_{n} = k) = \dbinom{m - k}{n - 1}\big/\dbinom{m}{n}$ et $\boxed{\mathbb{E}[I_{n}] = \dfrac{m + 1}{n + 1}}$. Les $n$ boules découpent $\llbracket 1, m \rrbracket$ en $n + 1$ intervalles de longueur moyenne $\dfrac{m + 1}{n + 1}$ environ.
- id: "l3-pr-03-14"
  feuille: "f-l3-pr-03"
  numero: 14
  partie: "Plusieurs variables, indépendance"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [variables indépendantes, loi binomiale]
  noeuds: [p-independance, p-variables]
  notions: [independance, variable-aleatoire, loi-variable]
  source: "Durand, exercice 2.1"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Une population de $N \geqslant 2$ personnes a voté pour $A$ ou pour $B$ ; $m$ personnes ont voté pour $A$. On interroge $k$ personnes distinctes, choisies au hasard ($1 \leqslant k \leqslant N$). On note $a_{1}$, …, $a_{m}$ les électeurs de $A$ et $X_{i}$ l'indicatrice de l'évènement « $a_{i}$ est interrogée ».

    **1.** Quelle est la loi de $X_{i}$ ? Pour $i \neq j$, $X_{i}$ et $X_{j}$ sont-elles indépendantes ?

    **2.** Soit $S = X_{1} + \cdots + X_{m}$. Quelle est la loi de $S$ (*loi hypergéométrique*) ? Calculer $\mathbb{E}[S]$, puis $\operatorname{Var}(S)$ à l'aide des $X_{i}$.

    **3.** Montrer que, si $N$ et $m$ tendent vers $+\infty$ avec $\dfrac{m}{N} \to a \in [0, 1]$, $k$ restant fixe, la loi de $S$ tend vers une loi binomiale. Commenter.
  corrige: |
    **1.** Les $k$ personnes interrogées forment une partie uniforme à $k$ éléments ; $a_{i}$ y figure dans $\dbinom{N - 1}{k - 1}$ parties sur $\dbinom{N}{k}$ : $X_{i} \sim \mathcal{B}(\dfrac{k}{N})$. De même, $\mathbb{P}(X_{i}X_{j} = 1) = \dfrac{k(k - 1)}{N(N - 1)}$, et 
    $$\operatorname{Cov}(X_{i}, X_{j}) = \frac{k(k - 1)}{N(N - 1)} - \frac{k^{2}}{N^{2}} = -\frac{k(N - k)}{N^{2}(N - 1)} < 0 \quad \text{si } 1 \leqslant k < N :$$
     $X_{i}$ et $X_{j}$ ne sont pas indépendantes. Si $a_{i}$ est interrogée, il reste moins de places pour $a_{j}$.

    **2.** $S$ est le nombre d'électeurs de $A$ parmi les personnes interrogées : 
    $$\boxed{\mathbb{P}(S = j) = \frac{\binom{m}{j}\binom{N - m}{k - j}}{\binom{N}{k}}}, \qquad \mathbb{E}[S] = m\,\frac{k}{N} = k\,\frac{m}{N}.$$
     En développant $\operatorname{Var}(S) = \mathop{\displaystyle \sum_{i}}\operatorname{Var}(X_{i}) + \mathop{\displaystyle \sum_{i \neq j}}\operatorname{Cov}(X_{i}, X_{j})$ (chapitre 5, prop. 5), 
    $$\operatorname{Var}(S) = m\frac{k}{N}\Big(1 - \frac{k}{N}\Big) - m(m - 1)\frac{k(N - k)}{N^{2}(N - 1)} = \boxed{k\,\frac{m}{N}\Big(1 - \frac{m}{N}\Big)\frac{N - k}{N - 1}}.$$

    **3.** Pour $j$ fixé, on a $\dbinom{m}{j} \sim \dfrac{m^{j}}{j!}$ et $\dbinom{N}{k} \sim \dfrac{N^{k}}{k!}$, et de même pour $\dbinom{N - m}{k - j}$ si $N - m \to +\infty$, d'où $\mathbb{P}(S = j) \to \dbinom{k}{j}a^{j}(1 - a)^{k - j}$ (avec les conventions évidentes si $a \in \{0, 1\}$) : la loi de $S$ tend vers $\boxed{\mathcal{B}(k, a)}$. Quand la population est grande devant l'échantillon, interroger sans remise ou avec remise revient au même ; le facteur $\dfrac{N - k}{N - 1}$ de la variance mesure le gain de précision dû au tirage sans remise.
- id: "l3-pr-03-15"
  feuille: "f-l3-pr-03"
