  source: "Durand, exercice 2.31"
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Deux lettres occupent deux positions distinctes, choisies au hasard, dans une pile de $n \geqslant 2$ feuilles. On note $X_{1}$ le nombre de feuilles ordinaires avant la première lettre, et $X_{2}$ le nombre de feuilles entre les deux lettres. Déterminer la loi du couple $(X_{1}, X_{2})$, ses lois marginales, $\mathbb{P}(X_{1} = X_{2})$, la loi de $Z = X_{1} + X_{2} + 2$ et son interprétation, et les modes de ces lois.
  corrige: |
    Les positions $U < V$ des deux lettres forment une paire uniforme parmi les $\dbinom{n}{2}$ paires de $\llbracket 1, n \rrbracket$, et $X_{1} = U - 1$, $X_{2} = V - U - 1$. Le couple $(X_{1}, X_{2})$ est uniforme sur le triangle $\{(i, j) \in \mathbb{N}^{2} \,;\, i + j \leqslant n - 2\}$ : 
    $$\mathbb{P}(X_{1} = i, X_{2} = j) = \frac{2}{n(n - 1)}, \qquad \mathbb{P}(X_{1} = i) = \mathbb{P}(X_{2} = i) = \frac{2(n - 1 - i)}{n(n - 1)}, \quad 0 \leqslant i \leqslant n - 2.$$
     Les deux marginales sont égales, de mode $0$ : le plus probable est qu'une lettre soit en haut de la pile, et que les deux lettres soient voisines. On a $\mathbb{P}(X_{1} = X_{2}) = \dfrac{2\lfloor n/2 \rfloor}{n(n - 1)}$, en comptant les $i$ tels que $2i \leqslant n - 2$. Enfin $Z = V$ est la position de la seconde lettre : $\mathbb{P}(Z = z) = \dfrac{2(z - 1)}{n(n - 1)}$, $2 \leqslant z \leqslant n$, de mode $n$. C'est le nombre de feuilles à parcourir pour trouver les deux lettres.
- id: "l3-pr-03-18"
