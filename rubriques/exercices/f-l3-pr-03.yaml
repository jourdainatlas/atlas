  notions: [variable-aleatoire, esperance, variance]
  source: "Durand, exercices 2.28 et 2.46 ; Rubenthaler (Nice, 2021), chapitre 6, exercice 3"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Soit $\Omega$ un ensemble dénombrable muni d'une probabilité $\mathbb{P}$, et $f : \Omega \to E$ une application. Montrer que $Q(x) = \mathbb{P}(f^{-1}(\{x\}))$, $x \in f(\Omega)$, définit une probabilité sur $f(\Omega)$, et calculer $Q(A)$ pour $A \subset f(\Omega)$. Que représente $Q$ quand $\Omega$ est une population munie de la probabilité uniforme, et $f$ la nationalité d'une personne ?

    **2.** On lance deux dés. Déterminer la loi de leur somme $S$, puis calculer $\mathbb{E}[S]$ à partir de cette loi. Retrouver ce résultat sans calcul.

    **3.** Soit $X \sim \mathcal{P}(\theta)$. Pour $u \geqslant 0$, calculer $\mathbb{E}[\mathrm{e}^{-uX}]$, puis $\mathbb{E}\big[\dfrac{1}{1 + X}\big]$.
  corrige: |
    **1.** Les fibres $f^{-1}(\{x\})$, $x \in f(\Omega)$, forment une partition dénombrable de $\Omega$ ; les $Q(x)$ sont positifs, et leur somme vaut $\mathbb{P}(\Omega) = 1$ par $\sigma$-additivité. Pour $A \subset f(\Omega)$, $Q(A) = \mathop{\displaystyle \sum_{x \in A}}Q(x) = \mathbb{P}(f^{-1}(A))$ : $Q$ est la loi image (cours, prop. 1). Si $\Omega$ est une population munie de la loi uniforme et $f$ la nationalité, $Q(x)$ est la proportion de personnes de nationalité $x$ : la loi image est la répartition de la population selon ce caractère.

    **2.** La loi de $S$ est $\mathbb{P}(S = s) = \dfrac{6 - |s - 7|}{36}$ pour $2 \leqslant s \leqslant 12$, et 
    $$\mathbb{E}[S] = \frac{2 \cdot 1 + 3 \cdot 2 + 4 \cdot 3 + 5 \cdot 4 + 6 \cdot 5 + 7 \cdot 6 + 8 \cdot 5 + 9 \cdot 4 + 10 \cdot 3 + 11 \cdot 2 + 12 \cdot 1}{36} = \frac{252}{36} = \boxed{7}.$$
     Sans calcul : par linéarité, $\mathbb{E}[S] = 3{,}5 + 3{,}5 = 7$ ; ou par symétrie, $S$ et $14 - S$ ont la même loi.

    **3.** Par la formule de transfert (cours, th. 2), 
    $$\mathbb{E}[\mathrm{e}^{-uX}] = \sum_{k \geqslant 0}\mathrm{e}^{-uk}\,\mathrm{e}^{-\theta}\frac{\theta^{k}}{k!} = \mathrm{e}^{-\theta}\mathrm{e}^{\theta\mathrm{e}^{-u}} = \boxed{\exp\big(\theta(\mathrm{e}^{-u} - 1)\big)},$$

    $$\mathbb{E}\Big[\frac{1}{1 + X}\Big] = \sum_{k \geqslant 0}\frac{\mathrm{e}^{-\theta}\theta^{k}}{(k + 1)!} = \frac{\mathrm{e}^{-\theta}}{\theta}\sum_{j \geqslant 1}\frac{\theta^{j}}{j!} = \boxed{\frac{1 - \mathrm{e}^{-\theta}}{\theta}}.$$
     La première, vue comme fonction de $u$, est la transformée de Laplace de la loi de Poisson ; le chapitre 6 l'étudiera sous la forme de la série génératrice $\mathbb{E}[s^{X}] = \mathrm{e}^{\theta(s - 1)}$.
- id: "l3-pr-03-03"
  feuille: "f-l3-pr-03"
  numero: 3
  partie: "Lois, espérance, variance"
  etoiles: 2
  types: [Calcul]
  mots_cles: [espérance et variance, loi binomiale]
  noeuds: [p-variables, p-esperance, pol-binome]
  notions: [variable-aleatoire, esperance, variance, loi-variable, coefficient-binomial]
  source: "Durand, exercices 2.32, 2.33 et 2.34"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Sous quelles hypothèses le nombre de garçons d'une famille de $n$ enfants suit-il une loi binomiale ? Vérifier directement que $\mathop{\displaystyle \sum_{k = 0}^{n}}(k - np)^{2}\dbinom{n}{k}p^{k}(1 - p)^{n - k} = np(1 - p)$.

    **2.** Soit $B \sim \mathcal{B}(n, p)$. Comparer les lois de $B$ et de $n - B$. En étudiant le rapport $\dfrac{\mathbb{P}(B = k + 1)}{\mathbb{P}(B = k)}$, déterminer les *modes* de $B$, c'est-à-dire les valeurs de probabilité maximale.

    **3.** Déterminer de même les modes de la loi $\mathcal{P}(\lambda)$.

    **4.** Chacun des $100$ individus d'une population est porteur d'un caractère avec la probabilité $0{,}02$, indépendamment des autres. Calculer la probabilité d'avoir $0$, $1$, $2$, $3$, $4$ porteurs, et au moins $5$, et comparer à l'approximation de Poisson du cours.

    **5.** On suppose que le nombre de raisins d'une galette suit une loi de Poisson. Quel nombre moyen de raisins par galette faut-il prévoir pour qu'au moins $98\,\%$ des galettes contiennent au moins un raisin ? Donner une autre situation qui conduit au même calcul.
  corrige: |
    **1.** Il faut que les sexes des $n$ enfants soient indépendants et que chacun soit un garçon avec la même probabilité $p$ (chapitre 2, prop. 7). L'identité est $\mathbb{E}[(B - np)^{2}] = \operatorname{Var}(B)$ ; directement, avec $k\dbinom{n}{k} = n\dbinom{n - 1}{k - 1}$ et $k(k - 1)\dbinom{n}{k} = n(n - 1)\dbinom{n - 2}{k - 2}$, on obtient $\mathbb{E}[B] = np$ et $\mathbb{E}[B(B - 1)] = n(n - 1)p^{2}$, d'où 
    $$\sum_{k = 0}^{n}(k - np)^{2}\binom{n}{k}p^{k}q^{n - k} = n(n - 1)p^{2} + np - n^{2}p^{2} = np(1 - p).$$

    **2.** $n - B$ compte les échecs : $n - B \sim \mathcal{B}(n, q)$. La loi $\mathcal{B}(n, \dfrac{1}{2})$ est donc symétrique par rapport à $\dfrac{n}{2}$. De plus 
    $$\frac{\mathbb{P}(B = k + 1)}{\mathbb{P}(B = k)} = \frac{n - k}{k + 1} \cdot \frac{p}{q} \geqslant 1 \iff k \leqslant (n + 1)p - 1.$$
     Les probabilités croissent puis décroissent ; le mode est $\boxed{\lfloor (n + 1)p \rfloor}$, et il y a deux modes, $(n + 1)p - 1$ et $(n + 1)p$, lorsque $(n + 1)p$ est entier.

    **3.** Pour $\mathcal{P}(\lambda)$, le rapport vaut $\dfrac{\lambda}{k + 1}$ : le mode est $\boxed{\lfloor\lambda\rfloor}$, avec deux modes $\lambda - 1$ et $\lambda$ si $\lambda$ est entier.

    **4.** Le nombre de porteurs suit la loi $\mathcal{B}(100\,;\, 0{,}02)$, que l'on approche par $\mathcal{P}(2)$ (cours, prop. 6) :

    $$\begin{array}{|c|c|c|c|c|c|c|} \hline \text{porteurs} & 0 & 1 & 2 & 3 & 4 & \geqslant 5 \\ \hline \mathcal{B}(100\,;\, 0{,}02) & 0{,}1326 & 0{,}2707 & 0{,}2734 & 0{,}1823 & 0{,}0902 & 0{,}0508 \\ \hline \mathcal{P}(2) & 0{,}1353 & 0{,}2707 & 0{,}2707 & 0{,}1804 & 0{,}0902 & 0{,}0527 \\ \hline \end{array}$$

    1.5em

    ![Figure](documents/figures/7a74f72a945914ea.svg)

    Les deux lois diffèrent de moins de $0{,}003$ en chaque point : avec $n = 100$ et $p = 0{,}02$, l'approximation de Poisson est excellente. Les deux modes $1$ et $2$ de la loi de Poisson ($\lambda = 2$ entier) se retrouvent presque à l'identique dans la binomiale, dont le mode est $\lfloor 101 \times 0{,}02 \rfloor = 2$.

    **5.** Si $N \sim \mathcal{P}(\lambda)$, $\mathbb{P}(N \geqslant 1) = 1 - \mathrm{e}^{-\lambda} \geqslant 0{,}98$ si et seulement si $\lambda \geqslant \ln 50 \approx \boxed{3{,}9}$ raisins par galette. Le même calcul donne, par exemple, le nombre moyen de fautes de frappe par page à partir duquel $98\,\%$ des pages en contiennent au moins une, ou le nombre moyen de clients par minute pour qu'une minute soit presque toujours occupée.
- id: "l3-pr-03-04"
  feuille: "f-l3-pr-03"
  numero: 4
  partie: "Lois, espérance, variance"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [espérance et variance]
  noeuds: [p-variables, p-esperance]
  notions: [variable-aleatoire, esperance, variance]
  source: "Durand, exercice 2.5"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $X$ une variable aléatoire réelle. On dit que $m$ est une *médiane* de $X$ si 
    $$\mathbb{P}(X < m) \leqslant \frac{1}{2} \leqslant \mathbb{P}(X \leqslant m).$$

    **1.** Soit $x_{1} < \cdots < x_{n}$ des réels. Déterminer les médianes de la loi uniforme sur $\{x_{1}, \dots, x_{n}\}$.

    **2.** On suppose $\mathbb{E}[|X|] < +\infty$. Montrer que, si $m$ est une médiane, $\mathbb{E}[|X - a|] \geqslant \mathbb{E}[|X - m|]$ pour tout réel $a$, et que $\mathbb{E}[|X - m|]$ est la même pour toutes les médianes. *On pourra commencer par le cas d'une loi discrète finie.*

    **3.** On suppose $\mathbb{E}[X^{2}] < +\infty$. Montrer que $\mathbb{E}[(X - a)^{2}] \geqslant \operatorname{Var}(X)$ pour tout réel $a$, puis que $\mathbb{E}[|X - m|] \leqslant \sigma(X)$ et $|\mathbb{E}[X] - m| \leqslant \sigma(X)$ pour toute médiane $m$, où $\sigma(X) = \sqrt{\operatorname{Var}(X)}$.
  corrige: |
    **1.** Si $n = 2r + 1$ est impair, $\mathbb{P}(X < m) \leqslant \dfrac{1}{2} \leqslant \mathbb{P}(X \leqslant m)$ impose $m = x_{r + 1}$ : la médiane est unique. Si $n = 2r$ est pair, tout $m \in [x_{r}, x_{r + 1}]$ convient : $\mathbb{P}(X < m) \leqslant \dfrac{r}{n} = \dfrac{1}{2} \leqslant \mathbb{P}(X \leqslant m)$. Les médianes forment le segment $[x_{r}, x_{r + 1}]$.

    **2.** Soit $a > m$. Pour tout réel $x$, on vérifie, selon que $x \leqslant m$, $m < x < a$ ou $x \geqslant a$, que 
    $$|x - a| - |x - m| \geqslant (a - m)\big(\mathbf{1}_{\{x \leqslant m\}} - \mathbf{1}_{\{x > m\}}\big).$$
     En prenant l'espérance (cours, th. 1), $\mathbb{E}|X - a| - \mathbb{E}|X - m| \geqslant (a - m)(2\mathbb{P}(X \leqslant m) - 1) \geqslant 0$. Le cas $a < m$ est symétrique, avec $\mathbb{P}(X \geqslant m) \geqslant \dfrac{1}{2}$. Si $m_{1}$ et $m_{2}$ sont deux médianes, l'inégalité appliquée dans les deux sens donne $\mathbb{E}|X - m_{1}| = \mathbb{E}|X - m_{2}|$ : 
    $$\boxed{\text{la médiane minimise l'écart absolu moyen}}.$$

    **3.** On a $\mathbb{E}[(X - a)^{2}] = \operatorname{Var}(X) + (\mathbb{E}[X] - a)^{2} \geqslant \operatorname{Var}(X)$ : l'espérance minimise l'écart quadratique moyen. Par l'inégalité $\mathbb{E}[Y]^{2} \leqslant \mathbb{E}[Y^{2}]$ (variance positive) appliquée à $Y = |X - \mathbb{E}[X]|$, puis la question 2 avec $a = \mathbb{E}[X]$, 
    $$\mathbb{E}|X - m| \leqslant \mathbb{E}|X - \mathbb{E}[X]| \leqslant \sqrt{\mathbb{E}[(X - \mathbb{E}[X])^{2}]} = \sigma(X), \quad |\mathbb{E}[X] - m| = |\mathbb{E}[X - m]| \leqslant \mathbb{E}|X - m| \leqslant \sigma(X).$$
     Ainsi, 
    $$\boxed{\text{la médiane est à moins d'un écart type de l'espérance}}.$$
- id: "l3-pr-03-05"
  feuille: "f-l3-pr-03"
  numero: 5
  partie: "Temps d'attente, loi géométrique"
  etoiles: 2
  types: [Calcul]
  mots_cles: [loi géométrique]
  noeuds: [p-variables, p-independance]
  notions: [variable-aleatoire, loi-variable]
  source: "Bordeaux, TD 2, exercice 3 ; Durand, exercices 2.4 (1), 2.21 et 2.25"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Soit $X$ une variable à valeurs dans $\mathbb{N}$. Montrer que $\mathbb{E}[X] = \mathop{\displaystyle \sum_{j \geqslant 0}}\mathbb{P}(X > j)$, dans $[0, +\infty]$.

    **2.** Soit $X$ une variable à valeurs dans $\mathbb{N}^{*}$ qui vérifie l'absence de mémoire : 
    $$\mathbb{P}(X > k + n \,|\, X > n) = \mathbb{P}(X > k) \quad \text{pour tous } k, n \in \mathbb{N}^{*} \text{ tels que } \mathbb{P}(X > n) > 0.$$
     On pose $p = \mathbb{P}(X = 1)$. Calculer $\mathbb{P}(X > k)$, puis $\mathbb{P}(X = k)$, et conclure. Que se passe-t-il si $p = 1$ ?

    **3.** Soit $T$ une variable à valeurs dans $\mathbb{N}^{*}$, et, lorsque $\mathbb{P}(T \geqslant n) > 0$, $h(n) = \mathbb{P}(T = n \,|\, T \geqslant n)$ son *taux de défaillance*. Exprimer $\mathbb{P}(T \geqslant n)$ à l'aide de $h(1)$, …, $h(n - 1)$. Déterminer la loi et l'espérance de $T$ si $h$ est constant, égal à $\alpha \in \, ]0, 1[$. Interpréter.
  corrige: |
    **1.** $X = \mathop{\displaystyle \sum_{j \geqslant 0}}\mathbf{1}_{\{X > j\}}$, somme de variables positives ; par convergence monotone (ou en intervertissant les sommes de termes positifs, feuille 1, exercice 9), 
    $$\mathbb{E}[X] = \sum_{k \geqslant 0}k\,\mathbb{P}(X = k) = \sum_{k \geqslant 0}\sum_{j = 0}^{k - 1}\mathbb{P}(X = k) = \sum_{j \geqslant 0}\sum_{k > j}\mathbb{P}(X = k) = \sum_{j \geqslant 0}\mathbb{P}(X > j).$$

    **2.** Avec $n = 1$, $\mathbb{P}(X > k + 1) = \mathbb{P}(X > 1)\mathbb{P}(X > k) = q\,\mathbb{P}(X > k)$ tant que $\mathbb{P}(X > k) > 0$, où $q = 1 - p$ ; par récurrence, $\mathbb{P}(X > k) = q^{k}$, et $\mathbb{P}(X = k) = q^{k - 1} - q^{k} = pq^{k - 1}$ : $\boxed{X \sim \mathcal{G}(p)}$, si $0 < p < 1$. Le cas $p = 0$ est exclu, puisque $\mathbb{P}(X > k) = 1$ pour tout $k$ contredirait $X$ fini. Si $p = 1$, $X = 1$ presque sûrement, et la condition ne porte sur rien ($\mathbb{P}(X > n) = 0$) : c'est la loi géométrique dégénérée.

    **3.** $\mathbb{P}(T \geqslant n + 1) = \mathbb{P}(T \geqslant n)(1 - h(n))$, d'où $\mathbb{P}(T \geqslant n) = \mathop{\displaystyle \prod_{j = 1}^{n - 1}}(1 - h(j))$. Si $h = \alpha$, $\mathbb{P}(T \geqslant n) = (1 - \alpha)^{n - 1}$, et $\boxed{T \sim \mathcal{G}(\alpha)}$, d'espérance $\dfrac{1}{\alpha}$ (par la question 1 : $\mathop{\displaystyle \sum_{n \geqslant 1}}(1 - \alpha)^{n - 1}$). Un taux de défaillance constant signifie que l'appareil ne s'use pas : sa probabilité de tomber en panne le jour suivant ne dépend pas de son âge. C'est l'absence de mémoire.
- id: "l3-pr-03-06"
  feuille: "f-l3-pr-03"
  numero: 6
  partie: "Temps d'attente, loi géométrique"
  etoiles: 2
  types: [Calcul]
  mots_cles: [loi géométrique]
  noeuds: [p-variables, p-independance]
  notions: [variable-aleatoire, loi-variable]
  source: "Durand, exercices 2.25 et 2.40"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    On lance indéfiniment une pièce qui tombe sur pile avec la probabilité $p \in \, ]0, 1[$, les lancers étant indépendants. On note $T_{n}$ le rang du $n$-ième pile.

    **1.** Donner la loi de $T_{1}$, sa fonction de répartition, et celle de $\mathop{\displaystyle \min}(T_{1}, N + 1)$, pour $N \in \mathbb{N}$.

    **2.** Calculer $\mathbb{P}(T_{n} > N)$ et la loi de $T_{n}$. Déterminer $\mathbb{E}[T_{n}]$, en écrivant $T_{n}$ comme une somme de temps d'attente.

    **3.** Déterminer la loi de $X_{N} = \mathop{\displaystyle \min}(T_{n}, N + 1)$ et sa limite quand $N \to +\infty$, à $n$ fixé.

    **4.** Pour la pièce équilibrée, calculer $\mathbb{P}(T_{n} \leqslant 2n)$, et sa valeur pour $n = 1$, $5$, $20$.
  corrige: |
    **1.** $T_{1} \sim \mathcal{G}(p)$, $\mathbb{P}(T_{1} \leqslant k) = 1 - q^{k}$ pour $k \in \mathbb{N}$. La variable $\mathop{\displaystyle \min}(T_{1}, N + 1)$ a la même loi que $T_{1}$ sur $\llbracket 1, N \rrbracket$, et la masse $q^{N}$ en $N + 1$ ; sa fonction de répartition coïncide avec celle de $T_{1}$ jusqu'à $N$ et vaut $1$ à partir de $N + 1$.

    **2.** $T_{n} > N$ si et seulement si les $N$ premiers lancers contiennent moins de $n$ piles : 
    $$\mathbb{P}(T_{n} > N) = \sum_{j = 0}^{n - 1}\binom{N}{j}p^{j}q^{N - j}, \qquad \boxed{\mathbb{P}(T_{n} = k) = \binom{k - 1}{n - 1}p^{n}q^{k - n}}, \quad k \geqslant n,$$
     car le $k$-ième lancer est un pile et les $k - 1$ précédents en contiennent $n - 1$. En écrivant $T_{n} = T_{1} + (T_{2} - T_{1}) + \cdots + (T_{n} - T_{n - 1})$, chaque terme est un temps d'attente de loi $\mathcal{G}(p)$, et $\boxed{\mathbb{E}[T_{n}] = \dfrac{n}{p}}$ par linéarité.

    **3.** $X_{N}$ a la loi de $T_{n}$ sur $\llbracket n, N \rrbracket$, et la masse $\mathbb{P}(T_{n} > N)$ en $N + 1$. Quand $N \to +\infty$, $\mathbb{P}(T_{n} > N) \to 0$ (somme finie de termes $\dbinom{N}{j}q^{N} \to 0$) : la loi de $X_{N}$ tend vers celle de $T_{n}$, et la masse en $N + 1$ s'en va à l'infini.

    **4.** Pour $p = \dfrac{1}{2}$, $\mathbb{P}(T_{n} \leqslant 2n) = \mathop{\displaystyle \sum_{k = n}^{2n}}\dbinom{k - 1}{n - 1}2^{-k}$, qui vaut $0{,}75$ pour $n = 1$, $0{,}623$ pour $n = 5$ et $0{,}563$ pour $n = 20$. C'est aussi la probabilité d'avoir au moins $n$ piles en $2n$ lancers, qui tend vers $\dfrac{1}{2}$ (chapitre 9).
- id: "l3-pr-03-07"
  feuille: "f-l3-pr-03"
  numero: 7
  partie: "Temps d'attente, loi géométrique"
  etoiles: 2
  types: [Calcul]
  mots_cles: [loi géométrique, variance]
  noeuds: [p-variables, p-independance, p-esperance]
  notions: [variable-aleatoire, loi-variable, variance]
  source: "Bordeaux, TD 2, exercice 4"
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Un gardien de nuit doit ouvrir une porte avec l'une des $10$ clés de son trousseau, d'allures semblables ; une seule convient, et il les essaie au hasard. Il a deux méthodes : la méthode $A$ consiste à essayer les clés l'une après l'autre, sans réutiliser une clé déjà essayée ; la méthode $B$ consiste à agiter le trousseau avant chaque essai, si bien que la clé essayée a pu l'être déjà.

    **1.** Soit $X_{A}$ le nombre de clés essayées, y compris celle qui convient, par la méthode $A$. Déterminer sa loi.

    **2.** Même question pour le nombre $X_{B}$ de clés essayées par la méthode $B$.

    **3.** Calculer les espérances et les variances de $X_{A}$ et $X_{B}$.

    **4.** Quelle est la probabilité d'essayer plus de $8$ clés par la méthode $A$ ? par la méthode $B$ ?

    **5.** Le gardien utilise la méthode $A$ lorsqu'il est à jeun, et la méthode $B$ lorsqu'il est ivre, ce qui arrive un jour sur trois. Sachant que les $8$ premiers essais ont échoué, quelle est la probabilité qu'il soit ivre ?
  corrige: |
    **1.** Par la méthode $A$, l'ordre d'essai des clés est une permutation uniforme, et la bonne clé y occupe une place uniforme : $\boxed{X_{A} \sim \mathcal{U}(\llbracket 1, 10 \rrbracket)}$. On le vérifie par les probabilités composées : $\mathbb{P}(X_{A} = k) = \dfrac{9}{10} \cdot \dfrac{8}{9}\cdots\dfrac{10 - k + 1}{10 - k + 2} \cdot \dfrac{1}{10 - k + 1} = \dfrac{1}{10}$.

    **2.** Par la méthode $B$, les essais sont indépendants et réussissent avec la probabilité $\dfrac{1}{10}$ : $\boxed{X_{B} \sim \mathcal{G}(\dfrac{1}{10})}$.

    **3.** $\mathbb{E}[X_{A}] = \dfrac{11}{2}$, $\operatorname{Var}(X_{A}) = \dfrac{10^{2} - 1}{12} = \dfrac{33}{4}$ ; $\mathbb{E}[X_{B}] = 10$, $\operatorname{Var}(X_{B}) = \dfrac{0{,}9}{0{,}01} = 90$ (cours, section 3.6).

    **4.** $\mathbb{P}(X_{A} > 8) = \dfrac{2}{10} = \boxed{0{,}2}$ et $\mathbb{P}(X_{B} > 8) = 0{,}9^{8} \approx \boxed{0{,}430}$.

    **5.** Par la formule de Bayes, avec $\mathbb{P}(\text{ivre}) = \dfrac{1}{3}$, 
    $$\mathbb{P}(\text{ivre} \,|\, X > 8) = \frac{\frac{1}{3} \times 0{,}9^{8}}{\frac{1}{3} \times 0{,}9^{8} + \frac{2}{3} \times 0{,}2} \approx \boxed{0{,}518}.$$
     Huit échecs font passer la probabilité d'ivresse de $\dfrac{1}{3}$ à un peu plus de $\dfrac{1}{2}$.

    1.5em

    ![Figure](documents/figures/5f52959d59f5feb2.svg)

    Les lois du nombre d'essais par les deux méthodes, la seconde tronquée à $20$. La méthode $A$ ne dépasse jamais $10$ essais ; la méthode $B$ commence avec la même probabilité $\dfrac{1}{10}$ de réussir au premier essai, mais sa loi décroît lentement, d'où une espérance double.
- id: "l3-pr-03-08"
  feuille: "f-l3-pr-03"
  numero: 8
  partie: "Temps d'attente, loi géométrique"
  etoiles: 2
  types: [Calcul]
  mots_cles: [loi géométrique, variance]
  noeuds: [p-variables, p-independance, p-esperance]
  notions: [variable-aleatoire, loi-variable, variance]
  source: "Durand, exercices 2.2 et 2.20"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** Jean et Luc lancent chacun une pièce qui tombe sur face avec la probabilité $p \in \, ]0, 1[$, jusqu'à obtenir face. Soit $X$ et $Y$ les nombres de piles obtenus par Jean et par Luc avant leur premier face. Déterminer les lois de $X$ et $Y$, la probabilité qu'ils obtiennent face après le même nombre de lancers, puis les lois de $X + Y$ et de $\mathop{\displaystyle \min}(X, Y)$.

    **2.** Soit $X \sim \mathcal{G}(p)$ et $Y = \dfrac{1}{X}$. Déterminer la loi de $Y$ et calculer $\mathbb{E}[Y]$.

    **3.** Soit $X_{1}$, …, $X_{n}$ indépendantes de loi $\mathcal{G}(p)$ et $S_{n} = X_{1} + \cdots + X_{n}$. Calculer l'espérance, la variance et la loi de $S_{n}$. Pour $n \geqslant 2$ et $1 \leqslant m \leqslant k - n + 1$, calculer $\mathbb{P}(X_{1} = m \,|\, S_{n} = k)$. Que remarque-t-on pour $n = 2$ ?
  corrige: |
    **1.** $\mathbb{P}(X = k) = q^{k}p$ pour $k \in \mathbb{N}$ : $X + 1 \sim \mathcal{G}(p)$, et de même pour $Y$. Ils obtiennent face au même lancer si $X = Y$ : 
    $$\mathbb{P}(X = Y) = \sum_{k \geqslant 0}p^{2}q^{2k} = \frac{p^{2}}{1 - q^{2}} = \boxed{\frac{p}{2 - p}}.$$
     Par indépendance, 
    $$\mathbb{P}(X + Y = s) = \sum_{k = 0}^{s}pq^{k}\,pq^{s - k} = \boxed{(s + 1)p^{2}q^{s}}, \qquad \mathbb{P}(\min(X, Y) \geqslant k) = \mathbb{P}(X \geqslant k)\mathbb{P}(Y \geqslant k) = q^{2k},$$
     et $\mathop{\displaystyle \min}(X, Y) + 1 \sim \boxed{\mathcal{G}(1 - q^{2})}$. Le minimum est le nombre de doubles lancers ratés avant qu'au moins l'un des deux obtienne face.

    **2.** $Y$ prend les valeurs $\dfrac{1}{k}$, $k \in \mathbb{N}^{*}$, avec les probabilités $pq^{k - 1}$, et 
    $$\mathbb{E}[Y] = \sum_{k \geqslant 1}\frac{pq^{k - 1}}{k} = \frac{p}{q}\sum_{k \geqslant 1}\frac{q^{k}}{k} = \boxed{\frac{-p\ln p}{1 - p}}.$$
     Par exemple, $\mathbb{E}[Y] = \ln 2 \approx 0{,}69$ pour $p = \dfrac{1}{2}$, alors que $\dfrac{1}{\mathbb{E}[X]} = \dfrac{1}{2}$ : l'espérance de l'inverse n'est pas l'inverse de l'espérance.

    **3.** Par linéarité et par le th. 4 du cours, $\mathbb{E}[S_{n}] = \dfrac{n}{p}$ et $\operatorname{Var}(S_{n}) = \dfrac{nq}{p^{2}}$ ; de plus, $S_{n}$ a la loi de $T_{n}$ (exercice 6) : $\mathbb{P}(S_{n} = k) = \dbinom{k - 1}{n - 1}p^{n}q^{k - n}$, $k \geqslant n$. Par indépendance de $X_{1}$ et de $X_{2} + \cdots + X_{n}$, qui a la même loi que $S_{n - 1}$, 
    $$\mathbb{P}(X_{1} = m \,|\, S_{n} = k) = \frac{pq^{m - 1}\binom{k - m - 1}{n - 2}p^{n - 1}q^{k - m - n + 1}}{\binom{k - 1}{n - 1}p^{n}q^{k - n}} = \boxed{\frac{\binom{k - m - 1}{n - 2}}{\binom{k - 1}{n - 1}}}.$$
     Le résultat ne dépend pas de $p$. Pour $n = 2$, il vaut $\dfrac{1}{k - 1}$ : sachant que le deuxième succès a lieu au rang $k$, le premier est uniforme sur $\llbracket 1, k - 1 \rrbracket$. Pour $n = 1$, $X_{1} = S_{1}$ et la question est sans objet.
