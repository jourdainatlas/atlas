  source: "Durand, exercice 3.5 (1)"
  page_enonce: 5
  page_corrige: 9
  enonce: |
    *(Collectionneur de coupons.)* Chaque paquet de céréales contient l'un de $n$ coupons, choisi au hasard et indépendamment des autres paquets. Soit $\tau_{k}$ le nombre de paquets achetés pour obtenir $k$ coupons différents ($\tau_{0} = 0$), et $T_{n} = \tau_{n}$.

    **1.** Pour $k \in \llbracket 1, n \rrbracket$, déterminer la loi de $\tau_{k} - \tau_{k - 1}$. *On admettra que ces variables sont indépendantes.*

    **2.** En déduire $\mathbb{E}[T_{n}]$ et $\operatorname{Var}(T_{n})$, puis montrer que $\mathbb{E}[T_{n}] \sim n\ln n$ et $\operatorname{Var}(T_{n}) = O(n^{2})$. Combien faut-il acheter de paquets, en moyenne, pour réunir les $50$ coupons d'une collection ?
  corrige: |
    **1.** Une fois $k - 1$ coupons différents obtenus, chaque nouveau paquet en apporte un nouveau avec la probabilité $\dfrac{n - k + 1}{n}$, indépendamment des précédents : $\boxed{\tau_{k} - \tau_{k - 1} \sim \mathcal{G}\Big(\dfrac{n - k + 1}{n}\Big)}$.

    **2.** Par linéarité et indépendance (cours, th. 4), 
    $$\mathbb{E}[T_{n}] = \sum_{k = 1}^{n}\frac{n}{n - k + 1} = n\sum_{j = 1}^{n}\frac{1}{j}, \qquad \operatorname{Var}(T_{n}) = \sum_{j = 1}^{n}\frac{1 - j/n}{(j/n)^{2}} \leqslant n^{2}\sum_{j \geqslant 1}\frac{1}{j^{2}} = \frac{\pi^{2}}{6}n^{2}.$$
     Comme $\mathop{\displaystyle \sum_{j \leqslant n}}\dfrac{1}{j} \sim \ln n$, on obtient 
    $$\boxed{\mathbb{E}[T_{n}] \sim n\ln n} \qquad \text{et} \qquad \operatorname{Var}(T_{n}) = O(n^{2}).$$
     Pour $n = 50$, $\mathbb{E}[T_{50}] = 50 \times \big(1 + \dfrac{1}{2} + \cdots + \dfrac{1}{50}\big) \approx \boxed{225}$ paquets, dont près de $50$ pour le dernier coupon à lui seul. La feuille 8 montrera que $\dfrac{T_{n}}{n\ln n} \to 1$ en probabilité.
