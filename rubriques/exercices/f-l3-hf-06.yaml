  source: "Dauphine, Analyse 3, TD 5 (2017-2018), exercice 9 = TD 6 (2008-2009), exercice 9"
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Soit $0 < \alpha < \pi$ et $f$ la fonction $2\pi$-périodique égale à $1$ si $|x| \leq \alpha$ et à $0$ si $\alpha < |x| \leq \pi$.

    **1.** Déterminer les coefficients de Fourier de $f$.

    **2.** Calculer la somme de la série de Fourier de $f$ en tout point, et en déduire $\mathop{\displaystyle \sum_{n \geq 1}} \dfrac{\sin(2n\alpha)}{n}$.

    **3.** Calculer $\mathop{\displaystyle \sum_{n \geq 1}} \dfrac{\sin^{2}(n\alpha)}{n^{2}}$ et $\mathop{\displaystyle \sum_{n \geq 1}} \dfrac{\cos^{2}(n\alpha)}{n^{2}}$.
  corrige: |
    $\triangleright$ *1.* La fonction est paire : $b_{n} = 0$, $a_{0} = \dfrac{2\alpha}{\pi}$ et $a_{n} = \dfrac{2}{\pi} \mathop{\displaystyle \int_{0}^{\alpha}} \cos(nx) \, \mathrm{d} x = \boxed{\dfrac{2\sin(n\alpha)}{\pi n} .}$

    $\triangleright$ *2.* La fonction est constante par morceaux, donc lipschitzienne par morceaux. Sa série de Fourier converge vers $f(x)$ en dehors des points $\pm\alpha + 2\pi\mathbb{Z}$, et vers $\dfrac{1}{2}$ en ces points (prop. 12). En $x = \alpha$, 
    $$\frac{1}{2} = \frac{\alpha}{\pi} + \sum_{n \geq 1} \frac{2\sin(n\alpha)\cos(n\alpha)}{\pi n} = \frac{\alpha}{\pi} + \frac{1}{\pi} \sum_{n \geq 1} \frac{\sin(2n\alpha)}{n} , \qquad \text{d'où} \qquad \boxed{\sum_{n \geq 1} \frac{\sin(2n\alpha)}{n} = \frac{\pi - 2\alpha}{2} .}$$
     C'est la série de la dent de scie de l'exercice 5, $\mathop{\displaystyle \sum} \dfrac{\sin n\theta}{n} = \dfrac{\pi - \theta}{2}$ pour $\theta = 2\alpha \in ]0, 2\pi[$.

    $\triangleright$ *3.* Par Parseval, sous forme réelle, $\dfrac{1}{2\pi}\mathop{\displaystyle \int} |f|^{2} = \dfrac{a_{0}^{2}}{4} + \dfrac{1}{2}\mathop{\displaystyle \sum} a_{n}^{2}$, soit $\dfrac{\alpha}{\pi} = \dfrac{\alpha^{2}}{\pi^{2}} + \dfrac{2}{\pi^{2}} \mathop{\displaystyle \sum_{n \geq 1}} \dfrac{\sin^{2}(n\alpha)}{n^{2}}$. Avec $\cos^{2} = 1 - \sin^{2}$ et $\zeta(2) = \dfrac{\pi^{2}}{6}$ : 
    $$\boxed{\sum_{n \geq 1} \frac{\sin^{2}(n\alpha)}{n^{2}} = \frac{\alpha(\pi - \alpha)}{2} , \qquad \sum_{n \geq 1} \frac{\cos^{2}(n\alpha)}{n^{2}} = \frac{\pi^{2}}{6} - \frac{\alpha(\pi - \alpha)}{2} .}$$
     Pour $\alpha = 1$, on retrouve $\mathop{\displaystyle \sum} \dfrac{\sin^{2} n}{n^{2}} = \dfrac{\pi - 1}{2}$, comme à l'exercice 5.
- id: "l3-hf-06-09"
  feuille: "f-l3-hf-06"
  numero: 9
  partie: "Régularité et vitesse de convergence"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [régularité]
  noeuds: [fo-dirichlet, fo-parseval]
  notions: [fonction-periodique]
  source: "Bordeaux 2012-2013, feuille 3, exercice 7"
  page_enonce: 2
  page_corrige: 5
  enonce: |
    **Fonctions lipschitziennes.** Soit $f : \mathbb{R} \to \mathbb{C}$ une fonction $2\pi$-périodique et $K$-lipschitzienne. Pour $h \in \mathbb{R}$, on pose $f_{h}(x) = f(x + h)$.

    **1.** Calculer les coefficients de Fourier de $f_{h}$ en fonction de ceux de $f$.

    **2.** Montrer que la série $\mathop{\displaystyle \sum_{n \in \mathbb{Z}}} n^{2} |c_{n}(f)|^{2}$ converge. On pourra appliquer la formule de Parseval à $f_{h} - f$, avec $h = 1/N$, et utiliser l'inégalité $|\sin u| \geq \dfrac{2}{\pi}|u|$ pour $|u| \leq \dfrac{\pi}{2}$.

    **3.** En déduire que la série de Fourier de $f$ converge normalement vers $f$, puis que, quand $n \to +\infty$, 
    $$\sqrt{n} \, \lVert f - S_{f, n} \rVert_{\infty} \to 0 .$$

    **4.** On note $H$ l'espace des $g \in L^{1}(\mathbb{T})$ telles que $c_{0}(g) = 0$ et $\mathop{\displaystyle \sum_{n}} n^{2} |c_{n}(g)|^{2} < +\infty$, muni de $[g] = \big( \mathop{\displaystyle \sum_{n}} n^{2} |c_{n}(g)|^{2} \big)^{1/2}$. L'espace $(H, [\cdot])$ est-il un espace de Hilbert ?
  corrige: |
    $\triangleright$ *1.* Comme à l'exercice 12 de la feuille 5, $c_{n}(f_{h}) = \mathrm{e}^{\mathrm{i} n h} c_{n}(f)$.

    $\triangleright$ *2.* La fonction $f_{h} - f$ est continue, majorée en module par $K|h|$ ; sa norme $L^{2}$ normalisée l'est donc aussi. Par Parseval, 
    $$\sum_{n \in \mathbb{Z}} |\mathrm{e}^{\mathrm{i} n h} - 1|^{2} |c_{n}(f)|^{2} = \lVert f_{h} - f \rVert_{2}^{2} \leq K^{2} h^{2} , \qquad |\mathrm{e}^{\mathrm{i} n h} - 1|^{2} = 4\sin^{2}\frac{nh}{2} .$$
     Soit $N \geq 1$ et $h = 1/N$. Pour $|n| \leq N$, $|nh/2| \leq \dfrac{1}{2} \leq \dfrac{\pi}{2}$, donc $4\sin^{2}\dfrac{nh}{2} \geq \dfrac{4n^{2}h^{2}}{\pi^{2}}$. En ne gardant que ces termes, 
    $$\frac{4h^{2}}{\pi^{2}} \sum_{|n| \leq N} n^{2} |c_{n}(f)|^{2} \leq K^{2} h^{2} , \qquad \text{soit} \qquad \sum_{|n| \leq N} n^{2} |c_{n}(f)|^{2} \leq \frac{\pi^{2}K^{2}}{4} .$$
     La borne ne dépend pas de $N$ : la série $\mathop{\displaystyle \sum} n^{2} |c_{n}(f)|^{2}$ converge.

    $\triangleright$ *3.* Notons $r_{N} = \big( \mathop{\displaystyle \sum_{|n| > N}} n^{2} |c_{n}(f)|^{2} \big)^{1/2}$, qui tend vers $0$. Par Cauchy-Schwarz, 
    $$\sum_{|n| > N} |c_{n}(f)| \leq r_{N} \Big( \sum_{|n| > N} \frac{1}{n^{2}} \Big)^{1/2} \leq r_{N} \sqrt{\frac{2}{N}} ,$$
     car $\mathop{\displaystyle \sum_{n > N}} \dfrac{1}{n^{2}} \leq \mathop{\displaystyle \int_{N}^{+\infty}} \dfrac{\mathrm{d} t}{t^{2}} = \dfrac{1}{N}$. En particulier $\mathop{\displaystyle \sum} |c_{n}(f)| < +\infty$ : la série de Fourier converge normalement, et sa somme est $f$ (cours, th. 5). Enfin 
    $$\lVert f - S_{f, N} \rVert_{\infty} \leq \sum_{|n| > N} |c_{n}(f)| \leq \sqrt{2} \, \frac{r_{N}}{\sqrt{N}} , \qquad \text{donc} \qquad \boxed{\sqrt{N} \, \lVert f - S_{f, N} \rVert_{\infty} \to 0 .}$$

    $\triangleright$ *4.* L'application $U : g \mapsto (n \, c_{n}(g))_{n \neq 0}$ envoie $H$ dans $\ell^{2}(\mathbb{Z}^{*})$, est linéaire et vérifie $\lVert Ug \rVert_{2} = [g]$. Elle est injective : si $Ug = 0$, tous les coefficients de $g$ sont nuls, et $g = 0$ par l'unicité dans $L^{1}$ (cours, th. 4). Elle est surjective : si $(u_{n}) \in \ell^{2}(\mathbb{Z}^{*})$, la suite $(u_{n}/n)$ est sommable par Cauchy-Schwarz, et $g = \mathop{\displaystyle \sum_{n \neq 0}} \dfrac{u_{n}}{n} e_{n}$ est une fonction continue de coefficients $c_{n}(g) = u_{n}/n$ ; elle est dans $H$, et $Ug = u$. Ainsi $[\cdot]$ est une norme qui provient du produit scalaire $\mathop{\displaystyle \sum} n^{2} c_{n}(g)\overline{c_{n}(g')}$, et $U$ est une isométrie bijective sur un espace complet : $(H, [\cdot])$ est un espace de Hilbert. C'est un espace de Sobolev périodique, qui contient les fonctions lipschitziennes de moyenne nulle (question 2), comme l'espace à poids de l'exercice 1 de la feuille 2.
- id: "l3-hf-06-10"
  feuille: "f-l3-hf-06"
  numero: 10
  partie: "Régularité et vitesse de convergence"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [régularité]
  noeuds: [fo-dirichlet, fo-parseval]
  notions: []
  source: "Dauphine, Analyse 3, TD 6 (2008-2009), exercice 10 ; TD 5 (2017-2018), exercice 10"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **Inégalité de Sobolev.** Soit $T > 0$ et $f : \mathbb{R} \to \mathbb{C}$ une fonction $T$-périodique, continue et de classe $\mathcal{C}^{1}$ par morceaux, telle que $\mathop{\displaystyle \int_{0}^{T}} f(x) \, \mathrm{d} x = 0$.

    **1.** On note $c_{n}(f) = \dfrac{1}{T} \mathop{\displaystyle \int_{0}^{T}} f(x) \mathrm{e}^{-2\mathrm{i}\pi n x/T} \, \mathrm{d} x$. Exprimer $c_{n}(f')$ en fonction de $c_{n}(f)$, et montrer que $f(x) = \mathop{\displaystyle \sum_{n \neq 0}} c_{n}(f) \mathrm{e}^{2\mathrm{i}\pi n x/T}$ pour tout $x$.

    **2.** En déduire que 
    $$\lVert f \rVert_{\infty} = \sup_{x \in \mathbb{R}} |f(x)| \leq \sqrt{\frac{T}{12}} \Big( \int_{0}^{T} |f'(x)|^{2} \, \mathrm{d} x \Big)^{1/2} .$$

    **3.** Montrer que la constante $\sqrt{T/12}$ ne peut pas être améliorée, en considérant (pour $T = 2\pi$) la fonction de l'exercice 6 de la feuille 5.
  corrige: |
    $\triangleright$ *1.* Le changement de variable $x = Ts/(2\pi)$ ramène au cas $2\pi$-périodique. Une intégration par parties (valable pour $f$ continue et $\mathcal{C}^{1}$ par morceaux, les termes de bord se compensant par périodicité) donne $c_{n}(f') = \dfrac{2\mathrm{i}\pi n}{T} c_{n}(f)$. Comme $f'$ est de carré intégrable, $\mathop{\displaystyle \sum} |c_{n}(f')|^{2} < +\infty$, et 
    $$\sum_{n \neq 0} |c_{n}(f)| = \sum_{n \neq 0} \frac{T}{2\pi|n|} |c_{n}(f')| < +\infty$$
     par Cauchy-Schwarz. La série de Fourier converge normalement, vers $f$ (cours, th. 5) ; et $c_{0}(f) = 0$ par hypothèse.

    $\triangleright$ *2.* Pour tout $x$, par Cauchy-Schwarz puis Parseval pour $f'$ (avec la mesure $\dfrac{\mathrm{d} x}{T}$), 
    $$|f(x)| \leq \sum_{n \neq 0} \frac{T}{2\pi|n|} |c_{n}(f')| \leq \Big( \frac{T^{2}}{4\pi^{2}} \sum_{n \neq 0} \frac{1}{n^{2}} \Big)^{1/2} \Big( \frac{1}{T} \int_{0}^{T} |f'|^{2} \Big)^{1/2} = \Big( \frac{T^{2}}{12} \Big)^{1/2} \frac{1}{\sqrt{T}} \Big( \int_{0}^{T} |f'|^{2} \Big)^{1/2} ,$$
     puisque $\mathop{\displaystyle \sum_{n \neq 0}} \dfrac{1}{n^{2}} = \dfrac{\pi^{2}}{3}$. D'où $\lVert f \rVert_{\infty} \leq \sqrt{T/12} \, \lVert f' \rVert_{L^{2}(0, T)}$.

    $\triangleright$ *3.* Pour $T = 2\pi$, la fonction $g(t) = (t - \pi)^{2} - \dfrac{\pi^{2}}{3}$ sur $[0, 2\pi]$ est de moyenne nulle, et ses coefficients sont $c_{n}(g) = \dfrac{2}{n^{2}}$ (feuille 5, exercice 6). Il y a égalité dans les deux inégalités en $x = 0$ : tous les termes $c_{n}(g)\mathrm{e}^{0}$ sont positifs, et $|c_{n}(g')| = \dfrac{2}{|n|}$ est proportionnel à $\dfrac{1}{|n|}$. Vérification directe : $g(0) = \dfrac{2\pi^{2}}{3}$, $\mathop{\displaystyle \int_{0}^{2\pi}} g'^{2} = \mathop{\displaystyle \int_{0}^{2\pi}} 4(t - \pi)^{2} = \dfrac{8\pi^{3}}{3}$, et $\sqrt{\dfrac{2\pi}{12} \cdot \dfrac{8\pi^{3}}{3}} = \dfrac{2\pi^{2}}{3}$. La constante est optimale.
- id: "l3-hf-06-11"
  feuille: "f-l3-hf-06"
  numero: 11
  partie: "Sommes de Fejér, phénomène de Gibbs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [sommes de Fejér]
  noeuds: [fo-fejer]
  notions: [produit-convolution]
  source: "Bordeaux 2013-2014, feuille 4, exercice 9 ; Mathovore, exercices L3, exercice 15"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    **Sommes de Fejér en un point.** On rappelle (cours, prop. 6) que $F_{p}(t) = \dfrac{1}{p}\Big(\dfrac{\sin(pt/2)}{\sin(t/2)}\Big)^{2}$, que $F_{p} \geq 0$ et que $\dfrac{1}{2\pi} \mathop{\displaystyle \int_{-\pi}^{\pi}} F_{p} = 1$.

    **1.** Montrer que $F_{p}(t) = \mathop{\displaystyle \sum_{|k| < p}} \big(1 - \dfrac{|k|}{p}\big) \mathrm{e}^{\mathrm{i} k t}$, et en déduire $\sigma_{f, p} = \mathop{\displaystyle \sum_{|k| < p}} \big(1 - \dfrac{|k|}{p}\big) c_{k}(f) e_{k}$ pour $f \in L^{1}(\mathbb{T})$.

    **2.** Soit $\delta \in ]0, \pi[$. Montrer que $\mathop{\displaystyle \sup_{\delta \leq |t| \leq \pi}} F_{p}(t) \to 0$ quand $p \to +\infty$.

    **3.** Soit $f \in L^{1}(\mathbb{T})$ et $x \in \mathbb{R}$ tels que $\dfrac{1}{2}\big(f(x + t) + f(x - t)\big)$ ait une limite $\ell$ quand $t \to 0^{+}$. Montrer que $\sigma_{f, p}(x) \to \ell$. En particulier, $\sigma_{f, p}(x) \to f(x)$ si $f$ est continue en $x$.

    **4.** Comparer avec le théorème de Dirichlet : quelle hypothèse a disparu, et à quel prix ?
  corrige: |
    $\triangleright$ *1.* Pour $|k| < p$, le terme $\mathrm{e}^{\mathrm{i} k t}$ apparaît dans $D_{n}$ pour $n = |k|, \dots, p - 1$, soit $p - |k|$ fois. Donc 
    $$F_{p} = \frac{1}{p} \sum_{n=0}^{p-1} D_{n} = \sum_{|k| < p} \Big( 1 - \frac{|k|}{p} \Big) e_{k} , \qquad \sigma_{f, p} = f * F_{p} = \sum_{|k| < p} \Big( 1 - \frac{|k|}{p} \Big) c_{k}(f) e_{k} ,$$
     puisque $f * e_{k} = c_{k}(f) e_{k}$. Les sommes de Fejér pondèrent les coefficients par des poids triangulaires, au lieu de les tronquer brutalement.

    $\triangleright$ *2.* Pour $\delta \leq |t| \leq \pi$, $\sin^{2}(t/2) \geq \sin^{2}(\delta/2)$, donc $0 \leq F_{p}(t) \leq \dfrac{1}{p\sin^{2}(\delta/2)} \to 0$.

    $\triangleright$ *3.* Comme $F_{p}$ est paire, $\sigma_{f, p}(x) = \dfrac{1}{2\pi} \mathop{\displaystyle \int_{-\pi}^{\pi}} f(x - t) F_{p}(t) \, \mathrm{d} t = \dfrac{1}{2\pi} \mathop{\displaystyle \int_{-\pi}^{\pi}} \psi(t) F_{p}(t) \, \mathrm{d} t + \ell$, avec $\psi(t) = \dfrac{1}{2}(f(x + t) + f(x - t)) - \ell$ (on symétrise et l'on utilise $\dfrac{1}{2\pi}\mathop{\displaystyle \int} F_{p} = 1$). Soit $\varepsilon > 0$ et $\delta$ tel que $|\psi(t)| \leq \varepsilon$ pour $0 < |t| < \delta$. Alors 
    $$|\sigma_{f, p}(x) - \ell| \leq \varepsilon \cdot \frac{1}{2\pi}\int_{|t| < \delta} F_{p} + \sup_{\delta \leq |t| \leq \pi} F_{p}(t) \cdot \frac{1}{2\pi}\int_{-\pi}^{\pi} |\psi| \leq \varepsilon + \sup_{\delta \leq |t| \leq \pi} F_{p}(t) \, \big( \lVert f \rVert_{1} + |\ell| \big) .$$
     Par la question 2, la limite supérieure est au plus $\varepsilon$, pour tout $\varepsilon$ : $\sigma_{f, p}(x) \to \ell$.

    $\triangleright$ *4.* Le théorème de Dirichlet exige l'intégrabilité de $\dfrac{f(x + t) + f(x - t) - 2\ell}{t}$ près de $0$, une condition de régularité de $f$ en $x$ ; celui de Fejér n'exige que l'existence de la limite symétrique, par exemple la continuité. Le prix à payer est qu'on obtient la convergence des moyennes de Cesàro, et non des sommes partielles : pour une fonction continue, $S_{f, n}(x)$ peut diverger (cours, th. 1), alors que $\sigma_{f, p}(x)$ converge toujours. Quand $S_{f, n}(x)$ converge, sa limite est nécessairement celle des moyennes.

    1.5em

    ![Figure](documents/figures/ef712f4535231567.svg)

    Pour le créneau, la somme partielle $S_{f, 20}$ (orange) oscille et dépasse $1$ d'environ $18\,\%$ près du saut, alors que la somme de Fejér $\sigma_{f, 20}$ (vert) reste entre $-1$ et $1$ (cours, prop. 7) : la moyenne de Cesàro supprime le phénomène de Gibbs, au prix d'une transition plus lente au saut.
