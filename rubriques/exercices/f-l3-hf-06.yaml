  page_corrige: 8
  enonce: |
    **Deux applications du théorème de Fejér.**

    **1.** Soit $f$ une fonction continue et $2\pi$-périodique telle que $\lVert S_{f, n} \rVert_{\infty} \leq 1$ pour tout $n \in \mathbb{N}$. Montrer que $\lVert f \rVert_{\infty} \leq 1$.

    **2.** En admettant la densité de $\mathcal{C}(\mathbb{T})$ dans $L^{2}(\mathbb{T})$ (chapitre 5, prop. 6), déduire du théorème de Fejér que $(e_{n})_{n \in \mathbb{Z}}$ est une base hilbertienne de $L^{2}(\mathbb{T})$.
  corrige: |
    $\triangleright$ *1.* Pour tout $x$ et tout $p \geq 1$, $|\sigma_{f, p}(x)| \leq \dfrac{1}{p}\mathop{\displaystyle \sum_{n=0}^{p-1}} |S_{f, n}(x)| \leq 1$. Par le théorème de Fejér (cours, th. 2), $\sigma_{f, p}(x) \to f(x)$, d'où $|f(x)| \leq 1$ : $\lVert f \rVert_{\infty} \leq 1$. Les sommes partielles d'une fonction continue peuvent ne pas converger, mais elles « contrôlent » la fonction.

    $\triangleright$ *2.* Soit $g \in L^{2}(\mathbb{T})$ et $\varepsilon > 0$. Par densité, il existe $h$ continue avec $\lVert g - h \rVert_{2} \leq \varepsilon$. Par le théorème de Fejér, il existe $p$ tel que $\lVert h - \sigma_{h, p} \rVert_{\infty} \leq \varepsilon$, donc $\lVert h - \sigma_{h, p} \rVert_{2} \leq \varepsilon$. Le polynôme trigonométrique $\sigma_{h, p}$ vérifie $\lVert g - \sigma_{h, p} \rVert_{2} \leq 2\varepsilon$ : les polynômes trigonométriques sont denses dans $L^{2}(\mathbb{T})$. Comme $(e_{n})$ est orthonormée (chapitre 5, prop. 5), c'est une base hilbertienne. Le théorème de Fejér remplace ici le théorème de Weierstrass trigonométrique du chapitre 5, dont il est d'ailleurs une démonstration.
- id: "l3-hf-06-13"
  feuille: "f-l3-hf-06"
  numero: 13
  partie: "Sommes de Fejér, phénomène de Gibbs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [sommes de Fejér]
  noeuds: [fo-fejer]
  notions: [produit-convolution, fonction-periodique]
  source: "Bordeaux 2013-2014, feuille 4, exercice 8"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    **Phénomène de Gibbs pour le créneau.** Soit $f$ la fonction impaire et $2\pi$-périodique définie par $f(t) = 1$ pour $t \in ]0, \pi[$ et $f(0) = f(\pi) = 0$.

    **1.** Justifier que, pour tout $t \in \mathbb{R}$, $f(t) = \dfrac{4}{\pi} \mathop{\displaystyle \sum_{n \geq 0}} \dfrac{\sin((2n + 1)t)}{2n + 1}$.

    **2.** Pour $n \geq 1$, on pose $f_{n}(t) = \dfrac{4}{\pi} \mathop{\displaystyle \sum_{k=0}^{n}} \dfrac{\sin((2k + 1)t)}{2k + 1}$.

    **(a)** Calculer $f_{n}'$. Soit $t_{n} > 0$ la plus petite valeur telle que $f_{n}'(t_{n}) = 0$. Montrer que $t_{n} = \dfrac{\pi}{2n + 2}$.

    **(b)** Montrer que $\mathop{\displaystyle \lim_{n \to +\infty}} f_{n}(t_{n}) = \dfrac{2}{\pi} \mathop{\displaystyle \int_{0}^{\pi}} \dfrac{\sin t}{t} \, \mathrm{d} t$, et en donner une valeur approchée.

    **(c)** Que peut-on dire de la convergence de $(f_{n})$ vers $f$ sur $\mathbb{R}$ ?
  corrige: |
    $\triangleright$ *1.* On a $b_{n} = \dfrac{2}{\pi} \mathop{\displaystyle \int_{0}^{\pi}} \sin(nt) \, \mathrm{d} t = \dfrac{2(1 - (-1)^{n})}{\pi n}$, soit $\dfrac{4}{\pi n}$ pour $n$ impair et $0$ sinon. La fonction est constante par morceaux ; par la proposition 12, la série converge vers $f(t)$ aux points de continuité, et vers la demi-somme $0$ aux points $k\pi$, où $f$ vaut justement $0$. D'où la formule en tout $t$.

    $\triangleright$ *2.* (a) En dérivant terme à terme, puis en utilisant $\mathop{\displaystyle \sum_{k=0}^{n}} \cos((2k + 1)t) = \dfrac{\sin(2(n + 1)t)}{2\sin t}$ (partie réelle d'une somme géométrique), 
    $$f_{n}'(t) = \frac{4}{\pi} \sum_{k=0}^{n} \cos((2k + 1)t) = \frac{2}{\pi} \, \frac{\sin(2(n + 1)t)}{\sin t} \qquad (t \notin \pi\mathbb{Z}) .$$
     Sur $]0, \dfrac{\pi}{2n + 2}[$, $\sin(2(n + 1)t) > 0$, donc $f_{n}' > 0$ ; la première annulation a lieu en $t_{n} = \dfrac{\pi}{2n + 2}$, où $f_{n}$ atteint son premier maximum local.

    (b) Posons $h = 2t_{n} = \dfrac{\pi}{n + 1}$ et $u_{k} = (2k + 1)t_{n} = (k + \dfrac{1}{2})h$, milieux des $n + 1$ intervalles $[kh, (k + 1)h]$ qui découpent $[0, \pi]$. Alors 
    $$f_{n}(t_{n}) = \frac{4}{\pi} \sum_{k=0}^{n} \frac{\sin u_{k}}{2k + 1} = \frac{2}{\pi} \sum_{k=0}^{n} h \, \frac{\sin u_{k}}{u_{k}} ,$$
     somme de Riemann (méthode du point milieu) de la fonction continue $u \mapsto \dfrac{\sin u}{u}$ sur $[0, \pi]$. Donc 
    $$\boxed{f_{n}(t_{n}) \longrightarrow \frac{2}{\pi} \int_{0}^{\pi} \frac{\sin u}{u} \, \mathrm{d} u \approx 1{,}1790 .}$$

    (c) Comme $t_{n} \to 0^{+}$ et $f(t_{n}) = 1$, on a 
    $$\sup_{\mathbb{R}} |f_{n} - f| \geq f_{n}(t_{n}) - 1 \longrightarrow 0{,}179 :$$
     la convergence n'est pas uniforme sur $]0, \pi[$, ni sur $\mathbb{R}$. Le dépassement vaut environ $9\,\%$ de la hauteur du saut (qui est $2$), et il se déplace vers le saut sans diminuer : c'est le phénomène de Gibbs décrit dans le cours. On peut montrer que la convergence est uniforme sur tout segment $[\delta, \pi - \delta]$.

    1.5em

    ![Figure](documents/figures/e960930af9afc1f2.svg)

    La somme partielle $f_{10}$ (orange) atteint son premier maximum en $t_{10} = \dfrac{\pi}{22}$, à la hauteur $1{,}1797$, déjà très proche de la limite $1{,}1790$ (pointillés bleus) : le dépassement ne s'atténue pas, il se rapproche du saut.
- id: "l3-hf-06-14"
  feuille: "f-l3-hf-06"
  numero: 14
  partie: "Coefficients de Fourier dans $L^{1}$"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [coefficients des fonctions intégrables]
  noeuds: [fo-coefficients]
  notions: [fonction-periodique]
  source: "Bordeaux 2013-2014, feuille 4, exercice 7"
  page_enonce: 4
  page_corrige: 9
  enonce: |
    **Non-surjectivité.** D'après le lemme de Riemann-Lebesgue, $f \mapsto (c_{k}(f))_{k \in \mathbb{Z}}$ envoie $L^{1}(\mathbb{T})$ dans l'espace des suites qui tendent vers $0$ à l'infini. On veut montrer que cette application n'est pas surjective. On pose 
    $$u_{k} = \frac{1}{\mathrm{i} \log k} \ \text{si } k \geq 2 , \qquad u_{k} = -\frac{1}{\mathrm{i} \log |k|} \ \text{si } k \leq -2 , \qquad u_{k} = 0 \ \text{sinon} .$$
     On suppose qu'il existe $f \in L^{1}(\mathbb{T})$ telle que $c_{k}(f) = u_{k}$ pour tout $k$, et l'on pose $F(t) = \mathop{\displaystyle \int_{0}^{t}} f(x) \, \mathrm{d} x$.

    **1.** Montrer que $F$ est continue et $2\pi$-périodique.

    **2.** Montrer que $c_{k}(F) = -\dfrac{1}{|k| \log |k|}$ pour $|k| \geq 2$, et $c_{\pm 1}(F) = 0$.

    **3.** Montrer que $\mathop{\displaystyle \lim_{N \to +\infty}} \dfrac{1}{N} \mathop{\displaystyle \sum_{n=2}^{N-1}} \Big( -\mathop{\displaystyle \sum_{2 \leq |k| \leq n}} \dfrac{1}{|k| \log |k|} \Big) = -c_{0}(F)$.

    **4.** Vérifier que $\mathop{\displaystyle \sum_{2 \leq |k| \leq n}} \dfrac{1}{|k| \log |k|} \sim 2 \log(\log n)$ quand $n \to +\infty$.

    **5.** Conclure.
  corrige: |
    $\triangleright$ *1.* La fonction $f$ est intégrable sur $[0, 2\pi]$, donc $F$ est continue ; et 
    $$F(t + 2\pi) - F(t) = \int_{t}^{t + 2\pi} f = 2\pi c_{0}(f) = 2\pi u_{0} = 0 .$$

    $\triangleright$ *2.* Comme à l'exercice 13 de la feuille 5 (question 4), une intégration par parties donne $c_{k}(F) = \dfrac{c_{k}(f)}{\mathrm{i} k}$ pour $k \neq 0$. Pour $k \geq 2$, $c_{k}(F) = \dfrac{1}{\mathrm{i} k \cdot \mathrm{i}\log k} = -\dfrac{1}{k\log k}$ ; pour $k \leq -2$, $c_{k}(F) = -\dfrac{1}{\mathrm{i} k \cdot \mathrm{i}\log|k|} = \dfrac{1}{k\log|k|} = -\dfrac{1}{|k|\log|k|}$ ; et $c_{\pm 1}(F) = 0$.

    $\triangleright$ *3.* La fonction $F$ est continue : par le théorème de Fejér, $\sigma_{F, N}(0) \to F(0) = 0$. Notons $s_{n} = \mathop{\displaystyle \sum_{2 \leq |k| \leq n}} \dfrac{1}{|k|\log|k|}$ pour $n \geq 2$. On a $S_{F, n}(0) = \mathop{\displaystyle \sum_{|k| \leq n}} c_{k}(F) = c_{0}(F) - s_{n}$ pour $n \geq 2$, et $S_{F, n}(0) = c_{0}(F)$ pour $n \leq 1$. D'où 
    $$\sigma_{F, N}(0) = c_{0}(F) + \frac{1}{N} \sum_{n=2}^{N-1} (-s_{n}) \longrightarrow 0 , \qquad \text{c'est-à-dire} \qquad \frac{1}{N} \sum_{n=2}^{N-1} (-s_{n}) \longrightarrow -c_{0}(F) .$$

    $\triangleright$ *4.* La fonction $x \mapsto \dfrac{1}{x\log x}$ est décroissante sur $[2, +\infty[$, de primitive $\log(\log x)$. La comparaison série-intégrale donne $\mathop{\displaystyle \sum_{k=2}^{n}} \dfrac{1}{k\log k} = \log(\log n) + O(1)$, donc $s_{n} = 2\mathop{\displaystyle \sum_{k=2}^{n}} \dfrac{1}{k\log k} \sim 2\log(\log n)$.

    $\triangleright$ *5.* Ainsi $s_{n} \to +\infty$, et les moyennes de Cesàro $\dfrac{1}{N}\mathop{\displaystyle \sum_{n=2}^{N-1}} s_{n}$ tendent aussi vers $+\infty$, ce qui contredit la question 3. Il n'existe donc pas de $f \in L^{1}(\mathbb{T})$ de coefficients $(u_{k})$, bien que $u_{k} \to 0$ : l'application $f \mapsto (c_{k}(f))_{k}$ n'est pas surjective sur les suites de limite nulle. Le chapitre 7 établira le même fait pour la transformation de Fourier sur $\mathbb{R}$.

    1.5em

    ![Figure](documents/figures/0da2cc9544ff8d57.svg)

    La somme $s_{n}$ (bleu) tend vers l'infini, mais avec une lenteur extrême : elle suit $2\log\log n$ (orange) à une constante près (environ $1{,}6$), et ne vaut encore que $6{,}03$ pour $n = 10^{4}$. Une divergence aussi lente est invisible numériquement : seul le calcul asymptotique de la question 4 la met en évidence.
