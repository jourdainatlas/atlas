  enonce: |
    Soit $\alpha \in \mathbb{R}^{*}$ et $f$ la fonction $2\pi$-périodique définie par $f(x) = \operatorname{ch}(\alpha x)$ pour $x \in [-\pi, \pi[$.

    **1.** Déterminer les coefficients de Fourier de $f$.

    **2.** Calculer la somme de la série de Fourier de $f$ en tout point.

    **3.** En déduire la valeur des séries $\mathop{\displaystyle \sum_{n \geq 1}} \dfrac{1}{\alpha^{2} + n^{2}}$ et $\mathop{\displaystyle \sum_{n \geq 1}} \dfrac{(-1)^{n}}{\alpha^{2} + n^{2}}$.
  corrige: |
    $\triangleright$ *1.* La fonction est paire, donc $b_{n} = 0$, et par deux intégrations par parties, 
    $$\int_{0}^{\pi} \operatorname{ch}(\alpha x)\cos(nx) \, \mathrm{d} x = \frac{\alpha (-1)^{n} \operatorname{sh}(\alpha\pi)}{\alpha^{2} + n^{2}} , \qquad \text{d'où} \qquad \boxed{a_{n} = \frac{2\alpha(-1)^{n}\operatorname{sh}(\alpha\pi)}{\pi(\alpha^{2} + n^{2})} .}$$

    $\triangleright$ *2.* La fonction $f$ est continue ($f(\pi^{-}) = \operatorname{ch}(\alpha\pi) = f(-\pi)$) et lipschitzienne par morceaux : sa série de Fourier converge vers $f(x)$ en tout point (prop. 12), et même normalement, puisque $a_{n} = O(1/n^{2})$.

    $\triangleright$ *3.* En $x = \pi$ et en $x = 0$ : 
    $$\operatorname{ch}(\alpha\pi) = \frac{\operatorname{sh}(\alpha\pi)}{\alpha\pi} + \frac{2\alpha\operatorname{sh}(\alpha\pi)}{\pi} \sum_{n \geq 1} \frac{1}{\alpha^{2} + n^{2}} , \qquad 1 = \frac{\operatorname{sh}(\alpha\pi)}{\alpha\pi} + \frac{2\alpha\operatorname{sh}(\alpha\pi)}{\pi} \sum_{n \geq 1} \frac{(-1)^{n}}{\alpha^{2} + n^{2}} ,$$
     d'où 
    $$\boxed{\sum_{n \geq 1} \frac{1}{\alpha^{2} + n^{2}} = \frac{\pi\alpha\coth(\pi\alpha) - 1}{2\alpha^{2}} , \qquad \sum_{n \geq 1} \frac{(-1)^{n}}{\alpha^{2} + n^{2}} = \frac{\pi\alpha / \operatorname{sh}(\pi\alpha) - 1}{2\alpha^{2}} .}$$
     La première formule est celle de l'exercice 8 de la feuille 5, obtenue là par Parseval. Quand $\alpha \to 0$, elle redonne $\zeta(2) = \dfrac{\pi^{2}}{6}$, par le développement $\pi\alpha\coth(\pi\alpha) = 1 + \dfrac{\pi^{2}\alpha^{2}}{3} + O(\alpha^{4})$.
