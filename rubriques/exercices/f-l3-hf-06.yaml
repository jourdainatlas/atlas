  enonce: |
    **Une série lacunaire.** Soit $(a_{n})_{n \geq 0}$ une suite réelle telle que la série $\mathop{\displaystyle \sum} |a_{n}|$ converge, et soit $f(x) = \mathop{\displaystyle \sum_{n \geq 0}} a_{n} \cos(3^{n} x)$. Pour $n \geq 0$, on pose $b_{n} = 0$ si $a_{n} \geq 0$ et $b_{n} = 1$ si $a_{n} < 0$, et l'on considère le réel $x_{0} = 2\pi \mathop{\displaystyle \sum_{n \geq 0}} \dfrac{b_{n}}{3^{n+1}}$.

    **1.** Vérifier que $f$ est continue sur $\mathbb{R}$.

    **2.** Soit $n \geq 0$. Prouver qu'il existe $N \in \mathbb{N}$ et $\theta \in [0, \pi/3]$ tels que $3^{n} x_{0} = 2\pi N + \dfrac{2\pi}{3} b_{n} + \theta$. En déduire que $a_{n} \cos(3^{n} x_{0}) \geq \dfrac{|a_{n}|}{2}$.

    **3.** Établir les inégalités $\dfrac{1}{2} \mathop{\displaystyle \sum_{n \geq 0}} |a_{n}| \leq \lVert f \rVert_{\infty} \leq \mathop{\displaystyle \sum_{n \geq 0}} |a_{n}|$.
  corrige: |
    $\triangleright$ *1.* La série $\mathop{\displaystyle \sum} a_{n}\cos(3^{n}x)$ converge normalement, puisque $|a_{n}\cos(3^{n}x)| \leq |a_{n}|$ : $f$ est continue.

    $\triangleright$ *2.* On écrit 
    $$3^{n}x_{0} = 2\pi \sum_{m < n} b_{m} 3^{n - m - 1} + \frac{2\pi}{3} b_{n} + 2\pi \sum_{m > n} \frac{b_{m}}{3^{m - n + 1}} .$$
     Le premier terme est $2\pi N$ avec $N$ entier, puisque $n - m - 1 \geq 0$. Le dernier, $\theta$, vérifie 
    $$0 \leq \theta \leq 2\pi\sum_{j \geq 2} 3^{-j} = 2\pi \cdot \frac{1}{6} = \frac{\pi}{3} .$$

    Si $a_{n} \geq 0$, alors $b_{n} = 0$ et, modulo $2\pi$, $3^{n}x_{0} \equiv \theta \in [0, \pi/3]$. Donc $\cos(3^{n}x_{0}) \geq \dfrac{1}{2}$, et $a_{n}\cos(3^{n}x_{0}) \geq \dfrac{|a_{n}|}{2}$.

    Si $a_{n} < 0$, alors $b_{n} = 1$ et, modulo $2\pi$, $3^{n}x_{0} \equiv \dfrac{2\pi}{3} + \theta \in [2\pi/3, \pi]$. Donc $\cos(3^{n}x_{0}) \leq -\dfrac{1}{2}$, et $a_{n}\cos(3^{n}x_{0}) \geq \dfrac{|a_{n}|}{2}$.

    $\triangleright$ *3.* En sommant, $\lVert f \rVert_{\infty} \geq f(x_{0}) \geq \dfrac{1}{2}\mathop{\displaystyle \sum} |a_{n}|$ ; la majoration $\lVert f \rVert_{\infty} \leq \mathop{\displaystyle \sum} |a_{n}|$ est immédiate. D'où 
    $$\boxed{\frac{1}{2} \sum_{n \geq 0} |a_{n}| \leq \lVert f \rVert_{\infty} \leq \sum_{n \geq 0} |a_{n}| .}$$
     Pour une série trigonométrique quelconque, $\lVert f \rVert_{\infty}$ peut être beaucoup plus petite que $\mathop{\displaystyle \sum} |c_{n}|$ (et $\mathop{\displaystyle \sum} |c_{n}|$ infinie pour une fonction continue) ; pour une série lacunaire, dont les fréquences $3^{n}$ s'espacent géométriquement, les termes ne peuvent pas se compenser, et la norme uniforme équivaut à la norme $\ell^{1}$ des coefficients.

    1.5em

    ![Figure](documents/figures/11f900483543e461.svg)

    Pour $a_{n} = (-1/2)^{n}$ ($n \leq 7$), le point orange est $(x_{0}, f(x_{0}))$, avec $f(x_{0}) \approx 1{,}408$, au-dessus de la borne $\dfrac{1}{2}\mathop{\displaystyle \sum} |a_{n}| \approx 0{,}996$ (rouge) ; la valeur maximale de $f$ est d'ailleurs presque atteinte en $x_{0}$.

