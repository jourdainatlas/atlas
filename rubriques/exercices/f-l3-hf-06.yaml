- id: "l3-hf-06-01"
  feuille: "f-l3-hf-06"
  numero: 1
  partie: "Théorème de Dirichlet, calculs de sommes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [théorème de Dirichlet]
  noeuds: [fo-dirichlet]
  notions: []
  source: "Bordeaux 2015-2016, TD 5, exercice 1"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **L'intégrale de Dirichlet.**

    **1.** Soit $n \in \mathbb{N}$. Montrer que 
    $$\int_{-(n + 1/2)\pi}^{(n + 1/2)\pi} \frac{\sin t}{t} \, \mathrm{d} t = \pi - \int_{-\pi}^{\pi} \Big( \frac{1}{2\sin(t/2)} - \frac{1}{t} \Big) \sin\big((n + \tfrac{1}{2})t\big) \, \mathrm{d} t .$$

    **2.** En déduire la valeur de $\mathop{\displaystyle \int_{0}^{+\infty}} \dfrac{\sin t}{t} \, \mathrm{d} t$, dont on admettra la convergence. On pourra écrire $\sin\big((n + \dfrac{1}{2})t\big) = \sin(nt)\cos\dfrac{t}{2} + \cos(nt)\sin\dfrac{t}{2}$ et utiliser le lemme de Riemann-Lebesgue (cours, th. 3).
  corrige: |
    $\triangleright$ *1.* D'après la proposition 2 du cours, $D_{n}(t) = \dfrac{\sin((n + 1/2)t)}{\sin(t/2)}$, et $\mathop{\displaystyle \int_{-\pi}^{\pi}} D_{n} = 2\pi$ (seul le terme $k = 0$ contribue). Donc 
    $$\int_{-\pi}^{\pi} \frac{\sin((n + \frac{1}{2})t)}{2\sin(t/2)} \, \mathrm{d} t = \pi .$$
     Par le changement de variable $u = (n + \dfrac{1}{2})t$, $\mathop{\displaystyle \int_{-\pi}^{\pi}} \dfrac{\sin((n + 1/2)t)}{t} \, \mathrm{d} t = \mathop{\displaystyle \int_{-(n + 1/2)\pi}^{(n + 1/2)\pi}} \dfrac{\sin u}{u} \, \mathrm{d} u$. La différence des deux égalités donne la formule annoncée.

    $\triangleright$ *2.* La fonction $\varphi(t) = \dfrac{1}{2\sin(t/2)} - \dfrac{1}{t} = \dfrac{t - 2\sin(t/2)}{2t\sin(t/2)}$ se prolonge par continuité en $0$, avec $\varphi(0) = 0$, car le numérateur est équivalent à $t^{3}/24$ et le dénominateur à $t^{2}$. Elle est donc continue sur $[-\pi, \pi]$, et intégrable. En écrivant $\sin((n + \dfrac{1}{2})t) = \sin(nt)\cos\dfrac{t}{2} + \cos(nt)\sin\dfrac{t}{2}$, l'intégrale de droite s'exprime à l'aide des coefficients de Fourier de $\varphi\cos\dfrac{t}{2}$ et de $\varphi\sin\dfrac{t}{2}$ (prolongées par périodicité), qui tendent vers $0$ par le lemme de Riemann-Lebesgue (cours, th. 3). Ainsi 
    $$\int_{-(n + 1/2)\pi}^{(n + 1/2)\pi} \frac{\sin t}{t} \, \mathrm{d} t \longrightarrow \pi .$$
     L'intégrande étant paire et l'intégrale impropre convergente, $\mathop{\displaystyle \int_{0}^{+\infty}} \dfrac{\sin t}{t} \, \mathrm{d} t = \dfrac{\pi}{2}$.

    1.5em

    ![Figure](documents/figures/842174cec91bc6ef.svg)

    L'intégrale $\mathop{\displaystyle \int_{0}^{x}} \dfrac{\sin t}{t} \, \mathrm{d} t$ (bleu) oscille autour de $\dfrac{\pi}{2}$ (rouge) avec une amplitude décroissante ; les points orange sont les valeurs en $x = (n + \dfrac{1}{2})\pi$, celles qu'utilise l'exercice.
- id: "l3-hf-06-02"
  feuille: "f-l3-hf-06"
  numero: 2
  partie: "Théorème de Dirichlet, calculs de sommes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [théorème de Dirichlet]
  noeuds: [fo-dirichlet]
  notions: [fonction-periodique]
  source: "Bordeaux 2013-2014, feuille 4, exercice 1 ; Licence MPC, Analyse de Fourier 2, exercice 1"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Soit $f$ la fonction $2\pi$-périodique définie par $f(x) = x^{2}$ pour $0 \leq x < 2\pi$.

    **1.** Tracer le graphe de $f$ sur $[-2\pi, 4\pi]$ et calculer ses coefficients de Fourier.

    **2.** En quels points $x$ la série de Fourier de $f$ converge-t-elle vers $f(x)$ ? Quelle est sa somme aux autres points ?

    **3.** En déduire les valeurs de $\mathop{\displaystyle \sum_{n \geq 1}} \dfrac{1}{n^{2}}$ et de $\mathop{\displaystyle \sum_{n \geq 1}} \dfrac{(-1)^{n}}{n^{2}}$.

    **4.** À l'aide de la formule de Parseval, calculer $\mathop{\displaystyle \sum_{n \geq 1}} \dfrac{1}{n^{4}}$, puis $\mathop{\displaystyle \sum_{n \geq 0}} \dfrac{1}{(2n + 1)^{4}}$.
  corrige: |
    $\triangleright$ *1.* La fonction est une suite d'arcs de parabole, qui sautent de $4\pi^{2}$ à $0$ aux points de $2\pi\mathbb{Z}$. On a $c_{0}(f) = \dfrac{1}{2\pi} \mathop{\displaystyle \int_{0}^{2\pi}} x^{2} \, \mathrm{d} x = \dfrac{4\pi^{2}}{3}$, et pour $n \neq 0$, deux intégrations par parties donnent 
    $$\int_{0}^{2\pi} x^{2} \mathrm{e}^{-\mathrm{i} n x} \, \mathrm{d} x = \frac{4\pi^{2}}{-\mathrm{i} n} + \frac{2}{\mathrm{i} n} \cdot \frac{2\pi}{-\mathrm{i} n} = \frac{4\mathrm{i}\pi^{2}}{n} + \frac{4\pi}{n^{2}} , \qquad \text{d'où} \qquad \boxed{c_{n}(f) = \frac{2}{n^{2}} + \frac{2\mathrm{i}\pi}{n} .}$$
     Sous forme réelle, $a_{n} = \dfrac{4}{n^{2}}$ et $b_{n} = -\dfrac{4\pi}{n}$ : la série de Fourier est $\dfrac{4\pi^{2}}{3} + \mathop{\displaystyle \sum_{n \geq 1}} \big( \dfrac{4}{n^{2}}\cos nx - \dfrac{4\pi}{n}\sin nx \big)$.

    $\triangleright$ *2.* La fonction $f$ est lipschitzienne par morceaux. Par la proposition 12 du cours, la série converge vers $f(x)$ en tout $x \notin 2\pi\mathbb{Z}$, et vers $\dfrac{1}{2}(4\pi^{2} + 0) = 2\pi^{2}$ en tout point de $2\pi\mathbb{Z}$.

    $\triangleright$ *3.* En $x = 0$ et en $x = \pi$ : 
    $$2\pi^{2} = \frac{4\pi^{2}}{3} + 4\sum_{n \geq 1} \frac{1}{n^{2}} , \qquad \pi^{2} = \frac{4\pi^{2}}{3} + 4\sum_{n \geq 1} \frac{(-1)^{n}}{n^{2}} , \qquad \text{d'où} \qquad \boxed{\sum_{n \geq 1} \frac{1}{n^{2}} = \frac{\pi^{2}}{6} , \quad \sum_{n \geq 1} \frac{(-1)^{n}}{n^{2}} = -\frac{\pi^{2}}{12} .}$$

    $\triangleright$ *4.* On a $\lVert f \rVert_{2}^{2} = \dfrac{1}{2\pi} \mathop{\displaystyle \int_{0}^{2\pi}} x^{4} \, \mathrm{d} x = \dfrac{16\pi^{4}}{5}$ et $|c_{n}|^{2} = \dfrac{4}{n^{4}} + \dfrac{4\pi^{2}}{n^{2}}$. Parseval donne 
    $$\frac{16\pi^{4}}{5} = \frac{16\pi^{4}}{9} + 2\sum_{n \geq 1} \Big( \frac{4}{n^{4}} + \frac{4\pi^{2}}{n^{2}} \Big) = \frac{16\pi^{4}}{9} + 8\zeta(4) + \frac{4\pi^{4}}{3} ,$$
     d'où $8\zeta(4) = \pi^{4}\big( \dfrac{16}{5} - \dfrac{16}{9} - \dfrac{4}{3} \big) = \dfrac{4\pi^{4}}{45}$. En retirant les termes pairs, qui forment $\dfrac{1}{16}\zeta(4)$ : 
    $$\boxed{\sum_{n \geq 1} \frac{1}{n^{4}} = \frac{\pi^{4}}{90} , \qquad \sum_{n \geq 0} \frac{1}{(2n + 1)^{4}} = \frac{15}{16} \cdot \frac{\pi^{4}}{90} = \frac{\pi^{4}}{96} .}$$

    1.5em

    ![Figure](documents/figures/0d2f74bbeb5e02d4.svg)

    La somme partielle $S_{f, 10}$ (orange) suit les arcs de parabole (rouge) et passe, à chaque saut, par la valeur moyenne $2\pi^{2}$ (points bleus), comme l'annonce la proposition 12.
- id: "l3-hf-06-03"
  feuille: "f-l3-hf-06"
  numero: 3
  partie: "Théorème de Dirichlet, calculs de sommes"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [théorème de Dirichlet]
  noeuds: [fo-dirichlet]
  notions: [fonction-periodique]
  source: "Licence MPC, Analyse de Fourier 2, exercice 2"
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Montrer que, pour $0 < x < \pi$, 
    $$\cos x = \frac{8}{\pi} \sum_{n \geq 1} \frac{n}{4n^{2} - 1} \sin(2nx) .$$
     On considérera le prolongement impair et $2\pi$-périodique de $\cos$ restreint à $]0, \pi[$. Que vaut la somme de la série en $x = 0$ ?
  corrige: |
    Soit $g$ la fonction impaire et $2\pi$-périodique égale à $\cos x$ sur $]0, \pi[$, avec $g(0) = g(\pi) = 0$. Elle est impaire : $a_{n} = 0$, et pour $n \geq 2$, 
    $$b_{n} = \frac{2}{\pi} \int_{0}^{\pi} \cos x \sin(nx) \, \mathrm{d} x = \frac{1}{\pi} \int_{0}^{\pi} \big( \sin(n + 1)x + \sin(n - 1)x \big) \mathrm{d} x = \frac{1}{\pi} \Big( \frac{1 - (-1)^{n+1}}{n + 1} + \frac{1 - (-1)^{n-1}}{n - 1} \Big) ,$$
     qui vaut $0$ si $n$ est impair et $\dfrac{4n}{\pi(n^{2} - 1)}$ si $n$ est pair ; de plus $b_{1} = \dfrac{1}{\pi} \mathop{\displaystyle \int_{0}^{\pi}} \sin 2x \, \mathrm{d} x = 0$. Pour $n = 2m$, $b_{2m} = \dfrac{8m}{\pi(4m^{2} - 1)}$.

    La fonction $g$ est lipschitzienne par morceaux et continue sur $]0, \pi[$ : par la proposition 12, sa série de Fourier converge vers $g(x) = \cos x$ pour $0 < x < \pi$, ce qui est la formule annoncée. En $x = 0$, tous les termes sont nuls : la somme vaut $0 = \dfrac{1}{2}(g(0^{+}) + g(0^{-})) = \dfrac{1}{2}(1 - 1)$, et non $\cos 0 = 1$.
