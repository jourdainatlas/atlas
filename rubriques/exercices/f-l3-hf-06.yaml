  enonce: |
    Soit $f$ la fonction $2\pi$-périodique et paire définie sur $[0, \pi]$ par $f(x) = x^{2}$ si $x \leq \dfrac{\pi}{2}$ et $f(x) = \dfrac{\pi^{2}}{4}$ si $\dfrac{\pi}{2} \leq x \leq \pi$.

    **1.** Calculer les coefficients de Fourier de $f$.

    **2.** En évaluant la série de Fourier de $f$ en $0$ et en $\pi$, calculer $\mathop{\displaystyle \sum_{n \geq 1}} \dfrac{(-1)^{n+1}}{n^{2}}$ et $\mathop{\displaystyle \sum_{n \geq 0}} \dfrac{(-1)^{n}}{(2n + 1)^{3}}$.
  corrige: |
    $\triangleright$ *1.* La fonction est paire : $b_{n} = 0$. On calcule $a_{0} = \dfrac{2}{\pi}\big( \dfrac{\pi^{3}}{24} + \dfrac{\pi}{2} \cdot \dfrac{\pi^{2}}{4} \big) = \dfrac{\pi^{2}}{3}$, et pour $n \geq 1$, par intégrations par parties, 
    $$\boxed{a_{n} = \frac{2}{\pi} \Big( \int_{0}^{\pi/2} x^{2}\cos nx \, \mathrm{d} x + \frac{\pi^{2}}{4}\int_{\pi/2}^{\pi} \cos nx \, \mathrm{d} x \Big) = \frac{2\big(\pi n \cos\frac{n\pi}{2} - 2\sin\frac{n\pi}{2}\big)}{\pi n^{3}} .}$$
     Pour $n = 2m$, $a_{2m} = \dfrac{(-1)^{m}}{2m^{2}}$ ; pour $n = 2m + 1$, $a_{2m+1} = -\dfrac{4(-1)^{m}}{\pi(2m + 1)^{3}}$.

    $\triangleright$ *2.* La fonction est continue et lipschitzienne par morceaux : la série converge vers $f$ partout. Notons $A = \mathop{\displaystyle \sum_{m \geq 1}} \dfrac{(-1)^{m}}{2m^{2}}$ et $B = \mathop{\displaystyle \sum_{m \geq 0}} \dfrac{(-1)^{m}}{(2m + 1)^{3}}$. En $x = 0$ et en $x = \pi$ (où $\cos(n\pi) = (-1)^{n}$), 
    $$0 = \frac{\pi^{2}}{6} + A - \frac{4}{\pi} B , \qquad \frac{\pi^{2}}{4} = \frac{\pi^{2}}{6} + A + \frac{4}{\pi} B .$$
     La somme et la différence de ces deux égalités donnent $A = -\dfrac{\pi^{2}}{24}$ et $B = \dfrac{\pi^{3}}{32}$, c'est-à-dire 
    $$\boxed{\sum_{n \geq 1} \frac{(-1)^{n+1}}{n^{2}} = \frac{\pi^{2}}{12} , \qquad \sum_{n \geq 0} \frac{(-1)^{n}}{(2n + 1)^{3}} = \frac{\pi^{3}}{32} .}$$
     La seconde valeur, vérifiée numériquement ($\approx 0{,}96895$), est un cas particulier des formules d'Euler pour les séries alternées d'exposant impair.
- id: "l3-hf-06-08"
  feuille: "f-l3-hf-06"
