  page_corrige: 3
  enonce: |
    Soit $f$ la fonction $2\pi$-périodique définie par $f(t) = \sqrt{t}$ pour $t \in [0, 2\pi[$. La fonction $f$ est-elle de classe $\mathcal{C}^{1}$ par morceaux ? En quels points $t$ la série de Fourier $S_{f, n}(t)$ converge-t-elle vers $f(t)$ ? Que se passe-t-il aux points de $2\pi\mathbb{Z}$ ?
  corrige: |
    La dérivée $\dfrac{1}{2\sqrt{t}}$ n'est pas bornée au voisinage de $0^{+}$ : $f$ n'est pas de classe $\mathcal{C}^{1}$ par morceaux (la restriction à $[0, 2\pi]$ n'a pas de dérivée continue en $0$). Le théorème de Dirichlet du cours, plus général, s'applique pourtant partout.

    $\triangleright$ *En $x \notin 2\pi\mathbb{Z}$.* La fonction $f$ est de classe $\mathcal{C}^{1}$, donc lipschitzienne, au voisinage de $x$ : $S_{f, n}(x) \to f(x)$ (prop. 12 (i)).

    $\triangleright$ *En $x = 0$ (et en tout point de $2\pi\mathbb{Z}$).* On a $f(0^{+}) = 0$ et $f(0^{-}) = \sqrt{2\pi}$ ; on prend $\ell = \dfrac{\sqrt{2\pi}}{2}$. Pour $t \in ]0, \pi]$, $f(t) = \sqrt{t}$ et $f(-t) = f(2\pi - t) = \sqrt{2\pi - t}$, donc 
    $$\frac{f(t) + f(-t) - 2\ell}{t} = \frac{\sqrt{t}}{t} + \frac{\sqrt{2\pi - t} - \sqrt{2\pi}}{t} = \frac{1}{\sqrt{t}} + O(1) ,$$
     qui est intégrable sur $]0, \pi]$. Le théorème 6 donne $S_{f, n}(0) \to \dfrac{\sqrt{2\pi}}{2}$, la demi-somme des limites à droite et à gauche. La série converge donc en tout point.
