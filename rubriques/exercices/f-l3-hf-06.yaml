  page_corrige: 3
  enonce: |
    Soit $f$ la fonction $2\pi$-périodique définie par $f(x) = \dfrac{\pi - x}{2}$ si $x \in [0, 2\pi[$, et $g(x) = f(x + 1) - f(x - 1)$.

    **1.** Déterminer les séries de Fourier de $f$ et de $g$. Expliciter $g$.

    **2.** En déduire que $\mathop{\displaystyle \sum_{n \geq 1}} \dfrac{\sin n}{n} = \mathop{\displaystyle \sum_{n \geq 1}} \dfrac{\sin^{2} n}{n^{2}}$, en calculant chacune des deux sommes (la seconde par la formule de Parseval).
  corrige: |
    $\triangleright$ *1.* On a $c_{0}(f) = 0$ et, pour $n \neq 0$, $\mathop{\displaystyle \int_{0}^{2\pi}} x \mathrm{e}^{-\mathrm{i} n x} \, \mathrm{d} x = \dfrac{2\pi}{-\mathrm{i} n}$, d'où $c_{n}(f) = \dfrac{1}{4\pi} \cdot \dfrac{2\pi}{\mathrm{i} n} = \dfrac{1}{2\mathrm{i} n}$. En regroupant $n$ et $-n$, la série de Fourier de $f$ est $\mathop{\displaystyle \sum_{n \geq 1}} \dfrac{\sin nx}{n}$.

    Par l'exercice 12 de la feuille 5, $c_{n}(f(\cdot + h)) = \mathrm{e}^{\mathrm{i} n h} c_{n}(f)$, d'où 
    $$c_{n}(g) = (\mathrm{e}^{\mathrm{i} n} - \mathrm{e}^{-\mathrm{i} n}) \, c_{n}(f) = \frac{2\mathrm{i}\sin n}{2\mathrm{i} n} = \frac{\sin n}{n} \quad (n \neq 0) , \qquad c_{0}(g) = 0 .$$
     La série de Fourier de $g$ est donc $2\mathop{\displaystyle \sum_{n \geq 1}} \dfrac{\sin n}{n} \cos nx$. Explicitement, pour $x \in ]1, 2\pi - 1[$, $x \pm 1 \in ]0, 2\pi[$ et $g(x) = \dfrac{\pi - x - 1}{2} - \dfrac{\pi - x + 1}{2} = -1$ ; pour $x \in ]-1, 1[$, $f(x - 1) = \dfrac{\pi - (x - 1 + 2\pi)}{2}$ et $g(x) = \pi - 1$. La fonction $g$ est un créneau : $g = \pi - 1$ sur $]-1, 1[$, et $g = -1$ sur $]1, 2\pi - 1[$, de moyenne nulle.

    $\triangleright$ *2.* La fonction $g$ est lipschitzienne par morceaux et continue en $0$ : la série converge vers $g(0) = \pi - 1$, c'est-à-dire $2\mathop{\displaystyle \sum_{n \geq 1}} \dfrac{\sin n}{n} = \pi - 1$.

    Par Parseval, $\lVert g \rVert_{2}^{2} = \dfrac{1}{2\pi}\big( 2(\pi - 1)^{2} + (2\pi - 2) \big) = \pi - 1$, et $\mathop{\displaystyle \sum_{n \neq 0}} |c_{n}(g)|^{2} = 2\mathop{\displaystyle \sum_{n \geq 1}} \dfrac{\sin^{2} n}{n^{2}}$. Ainsi 
    $$\boxed{\sum_{n \geq 1} \frac{\sin n}{n} = \sum_{n \geq 1} \frac{\sin^{2} n}{n^{2}} = \frac{\pi - 1}{2} \approx 1{,}0708 .}$$
     Cette coïncidence, qui peut surprendre, vient de ce que $g$ ne prend que deux valeurs, dont l'une est $\pm 1$ près : $g^{2} = (\pi - 2) g + (\pi - 1)$.
