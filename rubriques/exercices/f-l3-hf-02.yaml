  enonce: |
    On se place dans $H = L^{2}([0, 1], \mathbb{R})$ et l'on note $G = \{ f \in H ; \ \mathop{\displaystyle \int_{0}^{1}} f = 0 \}$.

    **1.** Montrer que $G$ est un sous-espace fermé de $H$ et déterminer $G^{\perp}$.

    **2.** Donner une expression de $p_{G}(f)$ pour $f \in H$.

    **3.** Calculer $p_{G}(u)$ et $d(u, G)$ pour $u : x \mapsto \mathrm{e}^{x}$.
  corrige: |
    $\triangleright$ *1.* Notons $\mathbf{1}$ la fonction constante égale à $1$. Alors $\mathop{\displaystyle \int_{0}^{1}} f = \langle f, \mathbf{1} \rangle$, et $G = \{\mathbf{1}\}^{\perp}$ est fermé (cours, prop. 6). D'après la proposition 7, $G^{\perp} = \{\mathbf{1}\}^{\perp\perp} = \overline{\mathrm{Vect}(\mathbf{1})}$, d'où 
    $$\boxed{G^{\perp} = \mathrm{Vect}(\mathbf{1}) \text{ est la droite des fonctions constantes.}}$$

    $\triangleright$ *2.* Par le théorème 5, $p_{G} = \mathrm{id} - p_{G^{\perp}}$, et la projection sur la droite engendrée par le vecteur unitaire $\mathbf{1}$ est $f \mapsto \langle f, \mathbf{1} \rangle\mathbf{1}$. Donc 
    $$\boxed{p_{G}(f) = f - \int_{0}^{1} f .}$$
     On retranche à $f$ sa valeur moyenne.

    $\triangleright$ *3.* Comme $\mathop{\displaystyle \int_{0}^{1}} \mathrm{e}^{x} \, \mathrm{d} x = \mathrm{e} - 1$, on obtient $p_{G}(u) = \mathrm{e}^{x} - (\mathrm{e} - 1)$, et 
    $$\boxed{d(u, G) = \lVert u - p_{G}(u) \rVert = \lVert (\mathrm{e} - 1)\mathbf{1} \rVert = \mathrm{e} - 1 \approx 1{,}718 .}$$

    1.5em

    ![Figure](documents/figures/d44b3f4a3ddbdece.svg)

    La courbe orange est la courbe bleue abaissée de sa moyenne $\mathrm{e} - 1$ (pointillés rouges) : les aires de part et d'autre de l'axe des abscisses se compensent.
