  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [projection sur un convexe fermé]
  noeuds: [me-produit-scalaire]
  notions: [espace-hilbert, projection-orthogonale, fonction-convexe, produit-scalaire]
  source: "Mathovore, Contrôle L3 « espaces de Hilbert, projection et Parseval », exercice 1 (a), (b)"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **Projection sur des fonctions encadrées.** Soit $a < b$ deux réels et 
    $$C = \{ f \in L^{2}([0, 1], \mathbb{R}) ; \ a \leq f \leq b \ \text{presque partout} \} .$$

    **1.** Montrer que $C$ est un convexe fermé non vide de $L^{2}([0, 1], \mathbb{R})$.

    **2.** Pour $f \in L^{2}([0, 1], \mathbb{R})$, on pose $\tilde{f} = \mathop{\displaystyle \min}(\mathop{\displaystyle \max}(f, a), b)$. Montrer, à l'aide de la caractérisation du théorème 3, que $p_{C}(f) = \tilde{f}$.

    **3.** On prend $a = 0$, $b = 1$ et $f(x) = 3x - 1$. Calculer $p_{C}(f)$ et $d(f, C)$.
  corrige: |
    $\triangleright$ *1.* La fonction constante $a$ appartient à $C$, qui n'est donc pas vide. Si $f, g \in C$ et $t \in [0, 1]$, on a presque partout $a = ta + (1 - t)a \leq tf + (1 - t)g \leq tb + (1 - t)b = b$ : $C$ est convexe.

    Soit $(f_{k})$ une suite de $C$ qui converge vers $f$ dans $L^{2}$. On peut en extraire une sous-suite qui converge presque partout vers $f$ (cours d'Intégration, chapitre 8) ; les inégalités $a \leq f_{k} \leq b$ passent à la limite presque partout, donc $f \in C$ : $C$ est fermé.

    $\triangleright$ *2.* La fonction $\tilde{f}$ est mesurable, à valeurs dans $[a, b]$ ; elle est bornée, donc dans $L^{2}([0, 1])$, et $\tilde{f} \in C$. Soit $g \in C$. On montre que $(f - \tilde{f})(g - \tilde{f}) \leq 0$ presque partout, en distinguant trois cas :

    • là où $a \leq f \leq b$, on a $\tilde{f} = f$ et le produit est nul ;

    • là où $f > b$, on a $\tilde{f} = b$, $f - \tilde{f} > 0$ et $g - b \leq 0$ ;

    • là où $f < a$, on a $\tilde{f} = a$, $f - \tilde{f} < 0$ et $g - a \geq 0$.

    En intégrant, $\langle f - \tilde{f}, g - \tilde{f} \rangle \leq 0$, et le théorème 3 donne $p_{C}(f) = \mathop{\displaystyle \min}(\mathop{\displaystyle \max}(f, a), b)$. On « écrête » $f$ entre $a$ et $b$, ce qui généralise le cas $f^{+}$ de la proposition 4 du cours ($a = 0$, $b = +\infty$).

    $\triangleright$ *3.* Pour $f(x) = 3x - 1$, on a $f < 0$ sur $[0, 1/3[$ et $f > 1$ sur $]2/3, 1]$ ; donc $p_{C}(f) = 0$ sur $[0, 1/3]$, $3x - 1$ sur $[1/3, 2/3]$, et $1$ sur $[2/3, 1]$. Par symétrie des deux morceaux, 
    $$\boxed{d(f, C)^{2} = \int_{0}^{1/3} (1 - 3x)^{2} \, \mathrm{d} x + \int_{2/3}^{1} (3x - 2)^{2} \, \mathrm{d} x = \frac{1}{9} + \frac{1}{9} = \frac{2}{9} , \qquad d(f, C) = \frac{\sqrt{2}}{3} .}$$

    1.5em

    ![Figure](documents/figures/a7eba13262178dcb.svg)

    La bande violette représente les valeurs permises, entre $0$ et $1$ ; la projection (orange) suit $f$ (bleu) dans la bande et la remplace par la borne la plus proche en dehors.
