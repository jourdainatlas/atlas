- id: "l3-hf-02-01"
  feuille: "f-l3-hf-02"
  numero: 1
  partie: "Espaces de Hilbert, convergence"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [espaces de Hilbert]
  noeuds: [me-produit-scalaire]
  notions: [espace-hilbert, espace-l2-suites, produit-scalaire]
  source: "Mathovore, exercices L3, exercice 2 ; Bibmath, Espaces de Hilbert, exercice 9"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **Un espace de suites à poids.** On note $h$ l'ensemble des suites complexes $x = (x_{n})_{n \in \mathbb{N}}$ telles que $\mathop{\displaystyle \sum_{n \geq 0}} (1 + n^{2}) |x_{n}|^{2} < +\infty$, et l'on pose, pour $x, y \in h$, 
    $$\langle x, y \rangle_{h} = \sum_{n=0}^{+\infty} (1 + n^{2}) \, x_{n} \overline{y_{n}} .$$

    **1.** Montrer que l'application $U : x \mapsto \big(\sqrt{1 + n^{2}} \, x_{n}\big)_{n}$ est une bijection linéaire de $h$ sur $\ell^{2}$ qui vérifie $\langle Ux, Uy \rangle = \langle x, y \rangle_{h}$. En déduire, à l'aide du théorème 1 du cours, que $(h, \langle \cdot, \cdot \rangle_{h})$ est un espace de Hilbert.

    **2.** Montrer que $h \subset \ell^{2}$ et que $\lVert x \rVert_{2} \leq \lVert x \rVert_{h}$ pour tout $x \in h$.

    **3.** Montrer que $h$ est dense dans $\ell^{2}$, mais n'est pas fermé dans $\ell^{2}$. On pourra considérer la suite $a = (1/(n+1))_{n}$ et ses tronquées.
  corrige: |
    $\triangleright$ *1.* Si $x \in h$, alors $\mathop{\displaystyle \sum_{n}} |\sqrt{1 + n^{2}}\, x_{n}|^{2} = \mathop{\displaystyle \sum_{n}} (1 + n^{2})|x_{n}|^{2} < +\infty$, donc $Ux \in \ell^{2}$. L'application $U$ est linéaire ; elle est bijective, d'inverse $V : y \mapsto (y_{n} / \sqrt{1 + n^{2}})_{n}$, qui envoie $\ell^{2}$ dans $h$ pour la même raison. Enfin 
    $$\langle Ux, Uy \rangle = \sum_{n} \sqrt{1 + n^{2}}\, x_{n} \, \overline{\sqrt{1 + n^{2}}\, y_{n}} = \sum_{n} (1 + n^{2}) x_{n} \overline{y_{n}} = \langle x, y \rangle_{h} ,$$
     la série convergeant absolument par Cauchy-Schwarz dans $\ell^{2}$. On en déduit que $\langle \cdot, \cdot \rangle_{h}$ est un produit scalaire : il est sesquilinéaire, et $\langle x, x \rangle_{h} = \lVert Ux \rVert_{2}^{2} = 0$ entraîne $Ux = 0$, donc $x = 0$.

    Pour la complétude, soit $(x^{(k)})$ une suite de Cauchy de $h$. Comme $\lVert Ux - Uy \rVert_{2} = \lVert x - y \rVert_{h}$, la suite $(Ux^{(k)})$ est de Cauchy dans $\ell^{2}$, donc converge vers un $y \in \ell^{2}$ (cours, th. 1). Alors $x^{(k)} \to Vy$ dans $h$, puisque $\lVert x^{(k)} - Vy \rVert_{h} = \lVert Ux^{(k)} - y \rVert_{2}$. $h$ est un espace de Hilbert, isomorphe à $\ell^{2}$ par l'isométrie $U$.

    $\triangleright$ *2.* Pour $x \in h$, $|x_{n}|^{2} \leq (1 + n^{2})|x_{n}|^{2}$, donc $x \in \ell^{2}$ et $\lVert x \rVert_{2}^{2} \leq \lVert x \rVert_{h}^{2}$.

    $\triangleright$ *3.* L'espace $h$ contient $c_{00}$, qui est dense dans $\ell^{2}$ (cours, chapitre 2) : $h$ est dense dans $\ell^{2}$.

    La suite $a = (1/(n + 1))_{n}$ est dans $\ell^{2}$, car $\mathop{\displaystyle \sum} 1/(n + 1)^{2} < +\infty$, mais pas dans $h$, car le terme général $(1 + n^{2})/(n + 1)^{2}$ tend vers $1$ et la série de terme général $1$ diverge. Ses tronquées $a^{(N)} = (1, 1/2, \dots, 1/(N+1), 0, \dots)$ sont dans $h$ et tendent vers $a$ dans $\ell^{2}$, puisque $\lVert a - a^{(N)} \rVert_{2}^{2} = \mathop{\displaystyle \sum_{n > N}} \dfrac{1}{(n + 1)^{2}} \to 0$. Ainsi $a \in \overline{h} \setminus h$ : $h$ n'est pas fermé dans $\ell^{2}$.

    *Remarque.* On a donc deux structures hilbertiennes sur l'espace vectoriel $h$ : sa propre norme, pour laquelle il est complet, et la norme de $\ell^{2}$, pour laquelle il ne l'est pas (un sous-espace d'un Hilbert est complet si et seulement s'il est fermé, cours, prop. 1). L'espace $h$ est la version « en coefficients » d'un espace de Sobolev : on verra au chapitre 5 que, pour une fonction $2\pi$-périodique, la condition $\mathop{\displaystyle \sum} n^{2} |c_{n}(f)|^{2} < +\infty$ exprime que $f$ a une dérivée dans $L^{2}$.
- id: "l3-hf-02-02"
  feuille: "f-l3-hf-02"
  numero: 2
  partie: "Espaces de Hilbert, convergence"
  etoiles: 1
  types: [Calcul]
  mots_cles: [espaces de Hilbert]
  noeuds: [me-produit-scalaire]
  notions: [espace-hilbert, espace-l2-suites, produit-scalaire]
  source: "Bibmath, Espaces de Hilbert, exercice 7"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **Suites de suites.** Pour chacune des suites $(x(n))_{n \geq 1}$ d'éléments de $\mathbb{C}^{\mathbb{N}^{*}}$ ci-dessous, dire si $x(n)$ appartient à $\ell^{2}(\mathbb{N}^{*})$, si la suite $(x(n))_{n}$ converge dans $\ell^{2}$ et, le cas échéant, préciser sa limite. On note $x(n)_{m}$ le terme d'indice $m \geq 1$ de $x(n)$.

    **1.** $x(n) = (1/n, 0, 0, \dots)$ ;

    **2.** $x(n) = (1, 1/2, \dots, 1/n, 0, 0, \dots)$ ;

    **3.** $x(n) = (1, 1/\sqrt{2}, \dots, 1/\sqrt{n}, 0, \dots)$ ;

    **4.** $x(n)_{m} = 1$ si $m = n$, $0$ sinon ;

    **5.** $x(n)_{m} = 1/m + 1/(n m^{3})$ ;

    **6.** $x(n)_{m} = 1/m + 1/(n m^{1/3})$.

    On pourra remarquer que $|x_{m}| \leq \lVert x \rVert_{2}$ pour tout $x \in \ell^{2}$ et tout $m$ : la convergence dans $\ell^{2}$ entraîne la convergence de chaque coordonnée.
  corrige: |
    La remarque de l'énoncé vient de $|x_{m}|^{2} \leq \mathop{\displaystyle \sum_{k}} |x_{k}|^{2}$. Ainsi, si $x(n) \to a$ dans $\ell^{2}$, alors $x(n)_{m} \to a_{m}$ pour tout $m$ : la seule limite possible est la limite coordonnée par coordonnée.

    $\triangleright$ *1.* $\lVert x(n) \rVert_{2} = 1/n \to 0$ : $x(n) \to 0$ dans $\ell^{2}$.

    $\triangleright$ *2.* La limite coordonnée par coordonnée est $a = (1/m)_{m \geq 1}$, qui est dans $\ell^{2}$. On a 
    $$\lVert x(n) - a \rVert_{2}^{2} = \sum_{m > n} \frac{1}{m^{2}} ,$$
     reste d'une série convergente, donc $x(n) \to a = (1/m)_{m}$.

    $\triangleright$ *3.* La seule limite possible serait $a = (1/\sqrt{m})_{m}$, qui n'est pas dans $\ell^{2}$, car $\mathop{\displaystyle \sum} 1/m$ diverge : la suite ne converge pas. Elle n'est d'ailleurs pas de Cauchy, puisque 
    $$\lVert x(2n) - x(n) \rVert_{2}^{2} = \sum_{m = n+1}^{2n} \frac{1}{m} \geq n \cdot \frac{1}{2n} = \frac{1}{2} .$$

    $\triangleright$ *4.* Ici $x(n) = e_{n}$. Chaque coordonnée tend vers $0$, donc la seule limite possible est $0$ ; mais $\lVert e_{n} \rVert_{2} = 1$ : pas de convergence. En fait $\lVert e_{n} - e_{p} \rVert_{2} = \sqrt{2}$ pour $n \neq p$ : aucune sous-suite n'est de Cauchy. La suite converge pourtant vers $0$ « coordonnée par coordonnée », et même $\langle e_{n}, y \rangle = y_{n} \to 0$ pour tout $y \in \ell^{2}$ : c'est un premier exemple de convergence faible sans convergence en norme.

    $\triangleright$ *5.* Avec $a = (1/m)_{m}$, $x(n) - a = \dfrac{1}{n}(m^{-3})_{m}$, d'où $\lVert x(n) - a \rVert_{2} = \dfrac{1}{n}\big(\mathop{\displaystyle \sum_{m}} m^{-6}\big)^{1/2} \to 0$ : $x(n) \to a = (1/m)_{m}$.

    $\triangleright$ *6.* Si $x(n)$ était dans $\ell^{2}$, la différence $x(n) - a$, avec $a = (1/m)_{m} \in \ell^{2}$, le serait aussi. Or $x(n) - a = \dfrac{1}{n} (m^{-1/3})_{m}$, et $\mathop{\displaystyle \sum_{m}} m^{-2/3}$ diverge. Donc $x(n) \notin \ell^{2}$ pour tout $n$ : la question de la convergence dans $\ell^{2}$ ne se pose pas. Coordonnée par coordonnée, $x(n)$ tend pourtant vers $a \in \ell^{2}$ : une limite simple peut être dans $\ell^{2}$ sans que les termes de la suite y soient.
- id: "l3-hf-02-03"
  feuille: "f-l3-hf-02"
  numero: 3
  partie: "Projection sur un convexe fermé"
  etoiles: 1
  types: [Calcul]
  mots_cles: [projection sur un convexe fermé]
  noeuds: [me-produit-scalaire]
  notions: [espace-hilbert, projection-orthogonale, fonction-convexe, produit-scalaire]
  source: "Bordeaux 2015-2016, feuille 1, exercice 7 ; Mathovore, exercices L3, exercice 4 ; Mathovore, Contrôle L3 « espaces de Hilbert, projection et Parseval », exercice 2 ; Bibmath, exercices 2 et 3"
  page_enonce: 2
  page_corrige: 2
  enonce: |
    **Cônes positifs.**

    **1.** Dans $H = \ell^{2}(\mathbb{N}, \mathbb{R})$, on pose $C = \{x \in H ; \ \forall n, \ x_{n} \geq 0\}$. Montrer que $C$ est un convexe fermé non vide, et que $p_{C}(x) = x^{+} = (\mathop{\displaystyle \max}(x_{n}, 0))_{n}$. Exprimer $d(x, C)$.

    **2.** Dans $H = \ell^{2}(\mathbb{N}, \mathbb{C})$, on pose $C = \{x \in H ; \ \forall n, \ x_{n} \in \mathbb{R}_{+}\}$. Déterminer $p_{C}(x)$ et $d(x, C)$.

    **3.** Dans $L^{2}([0, 1], \mathbb{R})$, calculer la distance au cône des fonctions positives de $f : x \mapsto 2x - 1$, puis de $g : x \mapsto x - \dfrac{1}{2}$, à l'aide de la proposition 4 du cours.
  corrige: |
    $\triangleright$ *1.* La suite nulle est dans $C$. Pour chaque $n$, la forme $x \mapsto x_{n} = \langle x, e_{n} \rangle$ est continue, donc $\{x ; \ x_{n} \geq 0\}$ est un demi-espace fermé et convexe ; $C$ est leur intersection, donc un convexe fermé.

    On a $x^{+} \in \ell^{2}$, car $|x_{n}^{+}| \leq |x_{n}|$, et $x^{+} \in C$. Notons $x^{-} = (\mathop{\displaystyle \max}(-x_{n}, 0))_{n}$, de sorte que $x = x^{+} - x^{-}$ et $x_{n}^{+} x_{n}^{-} = 0$. Pour $c \in C$, 
    $$\langle x - x^{+}, c - x^{+} \rangle = \sum_{n} (-x_{n}^{-})(c_{n} - x_{n}^{+}) = -\sum_{n} x_{n}^{-} c_{n} \leq 0 .$$
     Par la caractérisation du théorème 3, $p_{C}(x) = x^{+}$ et 
    $$\boxed{d(x, C) = \lVert x - x^{+} \rVert_{2} = \lVert x^{-} \rVert_{2} = \Big( \sum_{x_{n} < 0} x_{n}^{2} \Big)^{1/2} .}$$

    $\triangleright$ *2.* Le même argument montre que $C$ est un convexe fermé non vide. Posons $p = \big((\operatorname{Re} x_{n})^{+}\big)_{n} \in C$. Pour $c \in C$, les $c_{n}$ et les $p_{n}$ étant réels, 
    $$\operatorname{Re}\langle x - p, c - p \rangle = \sum_{n} \big(\operatorname{Re} x_{n} - (\operatorname{Re} x_{n})^{+}\big)(c_{n} - p_{n}) = -\sum_{n} (\operatorname{Re} x_{n})^{-} c_{n} \leq 0 ,$$
     en utilisant à nouveau $(\operatorname{Re} x_{n})^{-} (\operatorname{Re} x_{n})^{+} = 0$. Donc 
    $$\boxed{p_{C}(x) = \big((\operatorname{Re} x_{n})^{+}\big)_{n} , \qquad d(x, C)^{2} = \sum_{n} \Big( (\operatorname{Im} x_{n})^{2} + \big((\operatorname{Re} x_{n})^{-}\big)^{2} \Big) .}$$
     On oublie la partie imaginaire, puis on remplace les parties réelles négatives par $0$.

    $\triangleright$ *3.* D'après la proposition 4 du cours, $d(f, C_{+}) = \lVert f - f^{+} \rVert_{2} = \lVert f^{-} \rVert_{2}$. Pour $f(x) = 2x - 1$, $f^{-} = 1 - 2x$ sur $[0, 1/2]$ et $0$ ailleurs : 
    $$\boxed{d(f, C_{+})^{2} = \int_{0}^{1/2} (1 - 2x)^{2} \, \mathrm{d} x = \frac{1}{6} , \qquad d(f, C_{+}) = \frac{\sqrt{6}}{6} .}$$
     Comme $g = f / 2$ et $g^{-} = f^{-}/2$, on a $d(g, C_{+}) = \dfrac{\sqrt{6}}{12}$.

    1.5em

    ![Figure](documents/figures/40df7db095df84d0.svg)

    En dimension $2$, la projection sur le quadrant $C$ remplace par $0$ chaque coordonnée négative ; le segment rouge, de longueur $\lVert x^{-} \rVert$, est orthogonal au bord de $C$ quand le projeté est sur un côté, et le projeté est le sommet $0$ quand les deux coordonnées sont négatives.
- id: "l3-hf-02-04"
  feuille: "f-l3-hf-02"
  numero: 4
