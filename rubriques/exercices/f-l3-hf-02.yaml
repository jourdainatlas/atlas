  enonce: |
    **Orthogonaux.** Soit $E$ un espace préhilbertien réel.

    **1.** Soit $A$ et $B$ deux parties de $E$. Montrer que $(A \cup B)^{\perp} = A^{\perp} \cap B^{\perp}$. Donner un exemple où $A \subsetneq A^{\perp\perp}$. Montrer que, si $A$ est un sous-espace, $A \cap A^{\perp} = \{0\}$.

    **2.** Soit $F$ un sous-espace de $E$. Montrer que $F^{\perp} = F^{\perp\perp\perp}$.

    **3.** Soit $x \in E$. Montrer que $\lVert x \rVert^{2} + \lVert x - y - z \rVert^{2} = \lVert x - y \rVert^{2} + \lVert x - z \rVert^{2}$ pour tout $(y, z) \in F \times F^{\perp}$, et en déduire 
    $$\lVert x \rVert^{2} + d(x, F + F^{\perp})^{2} = d(x, F)^{2} + d(x, F^{\perp})^{2} .$$

    **4.** Montrer que $x \in F^{\perp}$ si et seulement si $\lVert x \rVert = d(x, F)$.

    **5.** Dans $\ell^{2}(\mathbb{N}, \mathbb{R})$, déterminer $c_{00}^{\perp}$. Le sous-espace $c_{00}$ est-il fermé ? A-t-on $\ell^{2} = c_{00} \oplus c_{00}^{\perp}$ ? Quelle hypothèse du théorème 5 du cours est en défaut ?
  corrige: |
    $\triangleright$ *1.* Un vecteur $x$ est orthogonal à $A \cup B$ si et seulement s'il est orthogonal à tout élément de $A$ et à tout élément de $B$ : $(A \cup B)^{\perp} = A^{\perp} \cap B^{\perp}$.

    L'inclusion $A \subset A^{\perp\perp}$ est dans la proposition 6 du cours ; elle est stricte dès que $A$ n'est pas un sous-espace fermé. Par exemple, dans $\mathbb{R}^{2}$ et pour $A = \{(1, 0)\}$, $A^{\perp\perp}$ est la droite $\mathbb{R} \times \{0\}$.

    Si $A$ est un sous-espace, $0 \in A \cap A^{\perp}$ ; et si $x \in A \cap A^{\perp}$, $x$ est orthogonal à lui-même, donc $\lVert x \rVert^{2} = 0$ et $x = 0$.

    $\triangleright$ *2.* La proposition 6 appliquée à $S = F^{\perp}$ donne $F^{\perp} \subset (F^{\perp})^{\perp\perp} = F^{\perp\perp\perp}$. Appliquée à $F \subset F^{\perp\perp}$, l'inclusion renversée donne $F^{\perp\perp\perp} = (F^{\perp\perp})^{\perp} \subset F^{\perp}$. Donc $F^{\perp} = F^{\perp\perp\perp}$, sans hypothèse de complétude.

    $\triangleright$ *3.* On développe les carrés, en utilisant $\langle y, z \rangle = 0$ : 
    $$\lVert x - y - z \rVert^{2} = \lVert x \rVert^{2} + \lVert y \rVert^{2} + \lVert z \rVert^{2} - 2\langle x, y \rangle - 2\langle x, z \rangle ,$$

    $$\lVert x - y \rVert^{2} + \lVert x - z \rVert^{2} = 2\lVert x \rVert^{2} + \lVert y \rVert^{2} + \lVert z \rVert^{2} - 2\langle x, y \rangle - 2\langle x, z \rangle .$$
     En ajoutant $\lVert x \rVert^{2}$ à la première ligne, on obtient la seconde : c'est l'égalité annoncée.

    Tout élément de $F + F^{\perp}$ s'écrit $y + z$ avec $(y, z) \in F \times F^{\perp}$. On prend la borne inférieure sur $(y, z)$ : à gauche on obtient $\lVert x \rVert^{2} + d(x, F + F^{\perp})^{2}$ ; à droite, les variables $y$ et $z$ sont séparées, et l'on obtient $d(x, F)^{2} + d(x, F^{\perp})^{2}$.

    $\triangleright$ *4.* Si $x \in F^{\perp}$, alors $\lVert x - y \rVert^{2} = \lVert x \rVert^{2} + \lVert y \rVert^{2} \geq \lVert x \rVert^{2}$ pour $y \in F$, avec égalité en $y = 0$ : $d(x, F) = \lVert x \rVert$.

    Réciproquement, supposons $\lVert x \rVert = d(x, F)$, et soit $y \in F$. Pour tout réel $t$, $ty \in F$, donc 
    $$\lVert x - ty \rVert^{2} - \lVert x \rVert^{2} = -2t\langle x, y \rangle + t^{2}\lVert y \rVert^{2} \geq 0 .$$
     Un trinôme en $t$ qui s'annule en $0$ et reste positif a une dérivée nulle en $0$ : $\langle x, y \rangle = 0$. Donc $x \in F^{\perp}$.

    $\triangleright$ *5.* Les vecteurs $e_{n}$ appartiennent à $c_{00}$. Si $x \in c_{00}^{\perp}$, alors $x_{n} = \langle x, e_{n} \rangle = 0$ pour tout $n$ : $c_{00}^{\perp} = \{0\}$.

    Par le critère de densité (cours, prop. 7), $c_{00}$ est dense dans $\ell^{2}$ ; comme $c_{00} \neq \ell^{2}$ (la suite $(2^{-n})$ n'est pas dans $c_{00}$), il n'est pas fermé. Enfin $c_{00} \oplus c_{00}^{\perp} = c_{00} \neq \ell^{2}$ : le théorème 5 du cours suppose le sous-espace *fermé*, et cette hypothèse ne peut pas être omise.
- id: "l3-hf-02-11"
  feuille: "f-l3-hf-02"
  numero: 11
  partie: "Projection orthogonale, orthogonal"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [projection orthogonale, suites à support fini]
  noeuds: [me-produit-scalaire]
  notions: [projection-orthogonale, orthogonal-partie, produit-scalaire]
  source: "Bordeaux 2015-2016, TD 2, exercice 2 ; ENS, Topologie, analyse et calcul différentiel, feuille 7 (13/11/2014), exercice 3"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    **Sous-espaces d'orthogonal nul.**

    **1.** Soit $E = \mathcal{C}([0, 1], \mathbb{R})$ muni de $\langle f, g \rangle = \mathop{\displaystyle \int_{0}^{1}} fg$, et $F = \{ f \in E ; \ f(0) = 0 \}$. Déterminer $F^{\perp}$. Le sous-espace $F$ admet-il un supplémentaire orthogonal ?

    **2.** On munit $c_{00}$ (suites réelles) du produit scalaire $\langle u, v \rangle = \mathop{\displaystyle \sum_{n \geq 0}} u_{n} v_{n}$.

    **(a)** L'espace $c_{00}$ est-il un espace de Hilbert ?

    **(b)** Soit $f : c_{00} \to \mathbb{R}$, $f(u) = \mathop{\displaystyle \sum_{n \geq 0}} u_{n} / 2^{n}$. Montrer que $\ker f$ est un sous-espace fermé de $c_{00}$, distinct de $c_{00}$, tel que $(\ker f)^{\perp} = \{0\}$.

    **3.** Soit $E$ un espace préhilbertien non complet. On admet que $E$ est un sous-espace dense d'un espace de Hilbert $\widehat{E}$, dont le produit scalaire prolonge celui de $E$. Soit $a \in \widehat{E} \setminus E$ et $F = \{ x \in E ; \ \langle x, a \rangle = 0 \}$.

    **(a)** Montrer que $F$ est un sous-espace fermé de $E$, distinct de $E$.

    **(b)** Montrer que $F$ est dense dans l'hyperplan $a^{\perp}$ de $\widehat{E}$. On pourra fixer $e \in E$ tel que $\langle e, a \rangle \neq 0$.

    **(c)** En déduire que l'orthogonal de $F$ dans $E$ est réduit à $\{0\}$.
  corrige: |
    $\triangleright$ *1.* Soit $g \in F^{\perp}$. La fonction $f(x) = x g(x)$ est continue et nulle en $0$, donc $f \in F$, et 
    $$0 = \langle f, g \rangle = \int_{0}^{1} x g(x)^{2} \, \mathrm{d} x .$$
     La fonction $x g(x)^{2}$ est continue et positive, d'intégrale nulle : elle est nulle, donc $g = 0$ sur $]0, 1]$, puis en $0$ par continuité. Ainsi $F^{\perp} = \{0\}$, et $F \oplus F^{\perp} = F \neq E$ (la fonction constante $1$ n'est pas dans $F$) : $F$ n'a pas de supplémentaire orthogonal.

    Ici $F$ n'est pas fermé pour la norme $L^{2}$ : il est même dense, car toute $f \in E$ est limite en norme $L^{2}$ des fonctions $f_{n} \in F$ égales à $f$ sur $[1/n, 1]$ et affines sur $[0, 1/n]$.

    $\triangleright$ *2.* (a) Non : $c_{00}$ est un sous-espace dense et distinct de $\ell^{2}$, donc non fermé, donc non complet (exercice 10 et cours, prop. 1).

    (b) Par Cauchy-Schwarz, $|f(u)| \leq \lVert u \rVert \big(\mathop{\displaystyle \sum_{n}} 4^{-n}\big)^{1/2} = \dfrac{2}{\sqrt{3}} \lVert u \rVert$ : $f$ est une forme linéaire continue, donc $\ker f$ est fermé. Il est distinct de $c_{00}$, puisque $f(e_{0}) = 1$.

    Soit $v \in c_{00}$ orthogonal à $\ker f$. Pour $n \neq m$, le vecteur $2^{n} e_{n} - 2^{m} e_{m}$ appartient à $\ker f$, d'où $2^{n} v_{n} = 2^{m} v_{m}$ : la suite $(2^{n} v_{n})_{n}$ est constante. Comme $v$ est nulle à partir d'un certain rang, cette constante est nulle, et $v = 0$. $(\ker f)^{\perp} = \{0\}$, bien que $\ker f$ soit fermé et distinct de $c_{00}$.

    *Remarque.* Dans un espace de Hilbert, ce serait impossible : un sous-espace fermé $F \neq H$ a un orthogonal non nul, puisque $H = F \oplus F^{\perp}$. La question 3 montre que tout espace préhilbertien non complet présente ce défaut. Ici, la forme $f$ est « représentée » par la suite $a = (2^{-n})_{n}$, qui est dans $\ell^{2}$ mais pas dans $c_{00}$ : c'est le phénomène de la question 3 avec $\widehat{E} = \ell^{2}$.

    $\triangleright$ *3.* (a) La forme $x \mapsto \langle x, a \rangle$ est continue sur $E$ (Cauchy-Schwarz dans $\widehat{E}$), donc $F$, son noyau, est fermé dans $E$. Si l'on avait $F = E$, $a$ serait orthogonal à $E$, donc à $\overline{E} = \widehat{E}$, et $a$ serait nul, ce qui contredit $a \notin E$. Donc $F \neq E$.

    (b) Il existe donc $e \in E$ tel que $\langle e, a \rangle \neq 0$. Soit $w \in a^{\perp}$. Par densité de $E$, il existe une suite $(x_{n})$ de $E$ qui converge vers $w$ dans $\widehat{E}$. Posons 
    $$y_{n} = x_{n} - \frac{\langle x_{n}, a \rangle}{\langle e, a \rangle} \, e \in E .$$
     On a $\langle y_{n}, a \rangle = 0$, donc $y_{n} \in F$, et $\langle x_{n}, a \rangle \to \langle w, a \rangle = 0$, d'où $y_{n} \to w$. Ainsi $F$ est dense dans $a^{\perp}$.

    (c) Soit $v \in E$ orthogonal à $F$. Par continuité du produit scalaire, $v$ est orthogonal à $\overline{F} \supset a^{\perp}$ dans $\widehat{E}$, donc $v \in (a^{\perp})^{\perp} = \mathrm{Vect}(a)$ (cours, prop. 7, dans le Hilbert $\widehat{E}$). Si $v = \lambda a$ avec $\lambda \neq 0$, alors $a = v / \lambda \in E$, ce qui est exclu : donc $\lambda = 0$ et $v = 0$. Le sous-espace fermé $F \neq E$ a un orthogonal nul dans $E$.

