  enonce: |
    **Fonctions d'une seule variable.** On se place dans $H = L^{2}([0, 1]^{2})$, pour la mesure de Lebesgue, et l'on note $F$ l'ensemble des $g \in H$ pour lesquelles il existe $G \in L^{2}([0, 1])$ telle que $g(x, y) = G(x)$ pour presque tout $(x, y)$.

    **1.** Montrer que l'application $J : L^{2}([0, 1]) \to H$, $JG(x, y) = G(x)$, est linéaire et isométrique. En déduire que $F = J(L^{2}([0, 1]))$ est un sous-espace fermé de $H$.

    **2.** Montrer que la projection orthogonale sur $F$ est donnée, pour tout $f \in H$, par 
    $$(p_{F} f)(x, y) = \int_{0}^{1} f(x, z) \, \mathrm{d} z .$$

    **3.** Calculer $p_{F}(f)$ et $d(f, F)$ pour $f(x, y) = x + y$.
  corrige: |
    $\triangleright$ *1.* Si $G$ est mesurable sur $[0, 1]$, la fonction $(x, y) \mapsto G(x)$ est mesurable sur $[0, 1]^{2}$, et le théorème de Fubini-Tonelli donne 
    $$\int_{[0, 1]^{2}} |G(x)|^{2} \, \mathrm{d} x \, \mathrm{d} y = \int_{0}^{1} \Big( \int_{0}^{1} |G(x)|^{2} \, \mathrm{d} y \Big) \mathrm{d} x = \int_{0}^{1} |G(x)|^{2} \, \mathrm{d} x .$$
     Donc $JG \in H$ et $\lVert JG \rVert = \lVert G \rVert$ ; si $G = G'$ presque partout, $JG = JG'$ presque partout, et $J$ est bien défini sur les classes. Il est linéaire et isométrique.

    Son image $F$ est un sous-espace. Elle est complète : si $(JG_{k})$ est de Cauchy dans $H$, $(G_{k})$ est de Cauchy dans $L^{2}([0, 1])$, qui est complet (cours, th. 2), donc $G_{k} \to G$ et $JG_{k} \to JG \in F$. Un sous-espace complet d'un espace de Hilbert est fermé (cours, prop. 1) : $F$ est fermé.

    $\triangleright$ *2.* Soit $f \in H$. Par Fubini, pour presque tout $x$, la fonction $z \mapsto f(x, z)$ est de carré intégrable sur $[0, 1]$, donc intégrable ; posons $P(x) = \mathop{\displaystyle \int_{0}^{1}} f(x, z) \, \mathrm{d} z$. Par Cauchy-Schwarz, $|P(x)|^{2} \leq \mathop{\displaystyle \int_{0}^{1}} |f(x, z)|^{2} \, \mathrm{d} z$, d'où $\mathop{\displaystyle \int_{0}^{1}} |P|^{2} \leq \lVert f \rVert^{2}$ : $P \in L^{2}([0, 1])$ et $JP \in F$.

    Il reste à voir que $f - JP$ est orthogonal à $F$ (cours, th. 4). Pour $G \in L^{2}([0, 1])$, Fubini donne 
    $$\langle f - JP, JG \rangle = \int_{0}^{1} \overline{G(x)} \Big( \int_{0}^{1} f(x, y) \, \mathrm{d} y - P(x) \Big) \mathrm{d} x = 0 .$$
     Donc $(p_{F} f)(x, y) = \mathop{\displaystyle \int_{0}^{1}} f(x, z) \, \mathrm{d} z$ : on remplace $f$ par sa moyenne en la seconde variable.

    $\triangleright$ *3.* Pour $f(x, y) = x + y$, on obtient $p_{F}(f)(x, y) = x + \dfrac{1}{2}$, et 
    $$\boxed{d(f, F)^{2} = \int_{[0, 1]^{2}} \Big( y - \frac{1}{2} \Big)^{2} \mathrm{d} x \, \mathrm{d} y = \frac{1}{12} , \qquad d(f, F) = \frac{\sqrt{3}}{6} .}$$

    *Remarque.* C'est la version continue de l'exercice 10 de la feuille 1 : projeter sur les fonctions qui ne dépendent que de $x$, c'est moyenner sur l'information qu'on oublie, ici la variable $y$. En probabilités, si $(X, Y)$ est uniforme sur $[0, 1]^{2}$, $p_{F}(f)$ est l'espérance conditionnelle de $f(X, Y)$ sachant $X$.
