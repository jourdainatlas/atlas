  enonce: |
    Pour tout entier $N \in \mathbb{N}$, on note $M_{N}$ l'ensemble des suites $x \in \ell^{2}(\mathbb{N}, \mathbb{C})$ telles que $\mathop{\displaystyle \sum_{k=0}^{N}} x_{k} = 0$.

    **1.** Montrer que l'application $\varphi : x \mapsto \mathop{\displaystyle \sum_{k=0}^{N}} x_{k}$ est une forme linéaire continue sur $\ell^{2}(\mathbb{N}, \mathbb{C})$. En déduire que $M_{N}$ est fermé et que $\ell^{2}(\mathbb{N}, \mathbb{C}) = M_{N} \oplus M_{N}^{\perp}$.

    **2.** Montrer que $M_{N}^{\perp}$ est l'ensemble des suites $x$ telles que $x_{i} = x_{0}$ si $i \leq N$ et $x_{i} = 0$ sinon.

    **3.** Donner l'expression de $p_{M_{N}}(x)$, et calculer la distance de $e_{0} = (1, 0, 0, \dots)$ à $M_{N}$.
  corrige: |
    $\triangleright$ *1.* Soit $u = (1, \dots, 1, 0, 0, \dots)$, avec $N + 1$ termes égaux à $1$. Alors $\varphi(x) = \langle x, u \rangle$, forme linéaire continue de norme $\lVert u \rVert = \sqrt{N + 1}$ par Cauchy-Schwarz. Donc $M_{N} = \ker \varphi = \{u\}^{\perp}$ est fermé, et le théorème 5 du cours donne $\ell^{2}(\mathbb{N}, \mathbb{C}) = M_{N} \oplus M_{N}^{\perp}$.

    $\triangleright$ *2.* D'après la proposition 7, $M_{N}^{\perp} = \{u\}^{\perp\perp} = \mathrm{Vect}(u)$ : 
    $$\boxed{M_{N}^{\perp} \text{ est formé des suites constantes jusqu'au rang } N \text{ et nulles ensuite.}}$$

    $\triangleright$ *3.* La projection sur $\mathrm{Vect}(u)$ est $x \mapsto \dfrac{\langle x, u \rangle}{\lVert u \rVert^{2}} u$, d'où 
    $$\boxed{p_{M_{N}}(x) = x - \frac{x_{0} + \cdots + x_{N}}{N + 1} \, u .}$$
     On retire à chacun des $N + 1$ premiers termes leur moyenne. Enfin $d(e_{0}, M_{N}) = \lVert p_{M_{N}^{\perp}}(e_{0}) \rVert = \dfrac{|\langle e_{0}, u \rangle|}{\lVert u \rVert}$, soit 
    $$\boxed{d(e_{0}, M_{N}) = \frac{1}{\sqrt{N + 1}} ,}$$
     qui tend vers $0$ quand $N \to +\infty$ : plus il y a de termes pour « compenser » le premier, plus $e_{0}$ est proche de $M_{N}$.
