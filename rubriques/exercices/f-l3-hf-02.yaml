  notions: [espace-hilbert, projection-orthogonale, fonction-convexe, produit-scalaire]
  source: "Bordeaux 2015-2016, devoir surveillé, exercice 2"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **Projections successives.**

    **1.** Soit $H$ un espace de Hilbert réel, $F$ un sous-espace fermé et $C$ un convexe fermé non vide contenu dans $F$. Montrer que $p_{C} \circ p_{F} = p_{C}$. On pourra écrire, pour $x \in H$ et $a \in C$, $x - a = (x - p_{F}(x)) + (p_{F}(x) - a)$.

    **2.** Construire deux convexes fermés non vides $C \subset D$ de $\mathbb{R}^{2}$ tels que $p_{C} \circ p_{D} \neq p_{C}$.
  corrige: |
    $\triangleright$ *1.* Soit $x \in H$ et $a \in C$. Le vecteur $x - p_{F}(x)$ est orthogonal à $F$ (cours, th. 4), et $p_{F}(x) - a$ appartient à $F$, puisque $a \in C \subset F$. Par Pythagore, 
    $$\lVert x - a \rVert^{2} = \lVert x - p_{F}(x) \rVert^{2} + \lVert p_{F}(x) - a \rVert^{2} .$$
     Le premier terme ne dépend pas de $a$. Minimiser $\lVert x - a \rVert$ pour $a \in C$ revient donc à minimiser $\lVert p_{F}(x) - a \rVert$ : les deux problèmes ont le même minimiseur unique (th. 3), c'est-à-dire $p_{C}(x) = p_{C}(p_{F}(x))$.

    $\triangleright$ *2.* L'argument repose sur l'orthogonalité de $x - p_{F}(x)$ à toutes les directions de $F$ ; pour un convexe $D$ quelconque, $x - p_{D}(x)$ n'est orthogonal qu'au « bord » de $D$ près du projeté. Prenons dans $\mathbb{R}^{2}$ 
    $$D = \{ (u, v) ; \ v \leq u \} , \qquad C = \{ (u, 0) ; \ u \geq 0 \} \subset D , \qquad x = (0, 1) .$$
     Le demi-plan $D$ est limité par la droite d'équation $v = u$ ; la projection de $x$ sur cette droite, qui est aussi sa projection sur $D$, est $p_{D}(x) = (1/2, 1/2)$. Sa projection sur la demi-droite $C$ est $(1/2, 0)$. En revanche $p_{C}(x) = (0, 0)$, puisque $\lVert x - (u, 0) \rVert^{2} = u^{2} + 1$ est minimal pour $u = 0$. Ainsi $p_{C}(p_{D}(x)) = (1/2, 0) \neq (0, 0) = p_{C}(x)$.

    1.5em

    ![Figure](documents/figures/aae6aeda7b29bbb7.svg)

    En deux étapes (pointillés rouges), on aboutit au point $(1/2, 0)$ ; en une seule étape (pointillés bleus), on obtient l'origine. Le défaut vient de ce que le segment $[x, p_{D}(x)]$ n'est pas orthogonal à $C$.
- id: "l3-hf-02-06"
  feuille: "f-l3-hf-02"
  numero: 6
  partie: "Projection sur un convexe fermé"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [projection sur un convexe fermé]
  noeuds: [me-produit-scalaire]
  notions: [espace-hilbert, projection-orthogonale, fonction-convexe, produit-scalaire]
  source: "Bordeaux 2015-2016, feuille 1, exercice 8 (ensemble polaire)"
  page_enonce: 2
  page_corrige: 5
  enonce: |
    **Ensemble polaire.** Soit $H$ un espace de Hilbert réel. Pour tout convexe fermé $C$ contenant $0$, on pose 
    $$C^{\circ} = \{ x \in H ; \ \forall y \in C, \ \langle x, y \rangle \leq 1 \} .$$
     Soit $C$ un convexe fermé de $H$ contenant $0$.

    **1.** Vérifier que $C^{\circ}$ est un convexe fermé contenant $0$, et que $C \subset C^{\circ\circ}$.

    Soit $x \in H$, $\varepsilon > 0$, et $p = p_{C}(x)$.

    **2.** Montrer que $\langle x - p, p \rangle \geq 0$, puis que $\dfrac{x - p}{\langle x - p, p \rangle + \varepsilon} \in C^{\circ}$.

    **3.** En déduire que $\lVert x - p \rVert^{2} \leq \varepsilon$ si $x \in C^{\circ\circ}$.

    **4.** Conclure que $C^{\circ\circ} = C$.

    **5.** Dans $\mathbb{R}^{2}$ euclidien, déterminer $C^{\circ}$ lorsque $C = [-1, 1]^{2}$.

    **6.** Soit $F$ un sous-espace fermé de $H$. Montrer que $F^{\circ} = F^{\perp}$, et en déduire que $F^{\perp\perp} = F$.
  corrige: |
    $\triangleright$ *1.* Pour chaque $y \in C$, l'ensemble $\{x ; \ \langle x, y \rangle \leq 1\}$ est un demi-espace fermé (image réciproque de $]-\infty, 1]$ par une forme continue), convexe, contenant $0$. L'ensemble $C^{\circ}$ est leur intersection : c'est un convexe fermé contenant $0$.

    Si $x \in C$ et $z \in C^{\circ}$, alors $\langle x, z \rangle = \langle z, x \rangle \leq 1$ par définition de $C^{\circ}$ : donc $x \in (C^{\circ})^{\circ}$, et $C \subset C^{\circ\circ}$.

    $\triangleright$ *2.* La caractérisation du théorème 3 (cas réel) s'écrit $\langle x - p, y - p \rangle \leq 0$ pour tout $y \in C$. Avec $y = 0 \in C$, on obtient $\langle x - p, -p \rangle \leq 0$, c'est-à-dire $\langle x - p, p \rangle \geq 0$.

    Posons $z = \dfrac{x - p}{\langle x - p, p \rangle + \varepsilon}$, dont le dénominateur est $\geq \varepsilon > 0$. Pour $y \in C$, la caractérisation donne $\langle x - p, y \rangle \leq \langle x - p, p \rangle$, d'où 
    $$\langle z, y \rangle \leq \frac{\langle x - p, p \rangle}{\langle x - p, p \rangle + \varepsilon} \leq 1 .$$
     Donc $z \in C^{\circ}$.

    $\triangleright$ *3.* Si $x \in C^{\circ\circ}$, alors $\langle x, z \rangle \leq 1$, c'est-à-dire $\langle x, x - p \rangle \leq \langle x - p, p \rangle + \varepsilon$. Il vient 
    $$\lVert x - p \rVert^{2} = \langle x, x - p \rangle - \langle p, x - p \rangle \leq \varepsilon .$$

    $\triangleright$ *4.* Pour $x \in C^{\circ\circ}$, l'inégalité précédente vaut pour tout $\varepsilon > 0$, et $p = p_{C}(x)$ ne dépend pas de $\varepsilon$ : donc $x = p \in C$. Avec la question 1, $C^{\circ\circ} = C$ (théorème du bipolaire).

    $\triangleright$ *5.* Pour $C = [-1, 1]^{2}$, on a $\mathop{\displaystyle \sup_{y \in C}} \langle x, y \rangle = |x_{1}| + |x_{2}|$, atteint en $y = (\operatorname{sgn} x_{1}, \operatorname{sgn} x_{2})$. Donc $C^{\circ} = \{ x ; \ |x_{1}| + |x_{2}| \leq 1 \}$, la boule unité de $\lVert \cdot \rVert_{1}$. La question 4 donne réciproquement que le polaire de cette boule est le carré.

    1.5em

    ![Figure](documents/figures/92048d13d3631006.svg)

    Le polaire du carré (bleu) est le losange (orange) : la boule de $\lVert \cdot \rVert_{\infty}$ et celle de $\lVert \cdot \rVert_{1}$ sont polaires l'une de l'autre. Plus $C$ est gros, plus $C^{\circ}$ est petit.

    $\triangleright$ *6.* Si $x \in F^{\perp}$, alors $\langle x, y \rangle = 0 \leq 1$ pour tout $y \in F$, donc $x \in F^{\circ}$. Réciproquement, si $x \in F^{\circ}$ et $y \in F$, alors $ty \in F$ pour tout réel $t$, d'où $t\langle x, y \rangle \leq 1$ pour tout $t \in \mathbb{R}$, ce qui impose $\langle x, y \rangle = 0$. Donc $F^{\circ} = F^{\perp}$.

    Le sous-espace $F^{\perp}$ est fermé et contient $0$, donc la même égalité s'applique à lui : 
    $$F^{\perp\perp} = (F^{\perp})^{\circ} = (F^{\circ})^{\circ} = F ,$$
     la dernière égalité par la question 4, $F$ étant un convexe fermé contenant $0$. On retrouve la proposition 7 du cours par un autre chemin.
