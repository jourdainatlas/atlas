  page_corrige: 7
  enonce: |
    Soit $E$ un espace vectoriel de dimension finie muni de deux normes $\lVert \cdot \rVert$ et $\lVert \cdot \rVert'$. Montrer que l'application $f$ définie par $f(0) = 0$ et $f(x) = \dfrac{\lVert x \rVert}{\lVert x \rVert'}\,x$ pour $x \neq 0$ est un homéomorphisme (une bijection continue de réciproque continue) de la boule unité fermée de $\lVert \cdot \rVert$ sur la boule unité fermée de $\lVert \cdot \rVert'$.
  corrige: |
    L'application $f$ conserve la direction de $x$ et ajuste sa longueur pour que la seconde norme de l'image soit égale à la première norme de $x$.

    $\triangleright$ *Bijection.* Pour tout $x$, $\lVert f(x) \rVert' = \dfrac{\lVert x \rVert}{\lVert x \rVert'}\lVert x \rVert' = \lVert x \rVert$ : $f$ envoie la boule unité fermée $B$ de $\lVert \cdot \rVert$ dans celle, $B'$, de $\lVert \cdot \rVert'$. L'application $g(y) = \dfrac{\lVert y \rVert'}{\lVert y \rVert}y$, $g(0) = 0$, envoie de même $B'$ dans $B$, et l'on vérifie $g \circ f = \mathrm{Id}_{B}$ et $f \circ g = \mathrm{Id}_{B'}$ : pour $x \neq 0$, $f(x)$ est un multiple positif de $x$, donc $g(f(x)) = \dfrac{\lVert f(x) \rVert'}{\lVert f(x) \rVert}f(x) = \dfrac{\lVert x \rVert}{\lVert f(x) \rVert}f(x)$, et $\lVert f(x) \rVert = \dfrac{\lVert x \rVert}{\lVert x \rVert'}\lVert x \rVert$, d'où $g(f(x)) = x$.

    $\triangleright$ *Continuité.* En dimension finie, les deux normes sont équivalentes (cours, th. 5) : elles définissent les mêmes suites convergentes et sont continues l'une pour l'autre. En $x \neq 0$, $f$ est continue comme produit et quotient de fonctions continues, le dénominateur ne s'annulant pas. En $0$, $\lVert f(x) \rVert' = \lVert x \rVert \to 0$. De même pour $g$. 
    $$\boxed{f \text{ est un homéomorphisme de } B \text{ sur } B'.}$$

    *Remarque.* Les boules unités de deux normes sur un même espace de dimension finie ont donc la même topologie : un carré et un disque sont homéomorphes, ce que le dessin de l'exercice 4 rend plausible.
