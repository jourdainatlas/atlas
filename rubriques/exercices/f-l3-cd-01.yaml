  page_enonce: 3
  page_corrige: 5
  enonce: |
    Soit $E$ un espace normé. Montrer que tout sous-espace vectoriel de $E$ distinct de $E$ est d'intérieur vide.
  corrige: |
    On montre qu'un sous-espace qui contient une boule est l'espace entier.

    Soit $F$ un sous-espace d'intérieur non vide : $B(a, r) \subset F$ pour un $a \in F$ et un $r > 0$. Comme $F$ est stable par translation de vecteur $-a \in F$, il contient $B(0, r)$. Pour $x \in E$ non nul, le vecteur $\dfrac{r}{2\lVert x \rVert}x$ est dans $B(0, r)$, donc dans $F$, et $x$ aussi, puisque $F$ est stable par multiplication. Ainsi $F = E$ : par contraposée, 
    $$\boxed{\text{tout sous-espace } F \neq E \text{ est d'intérieur vide}}.$$

    *Remarque.* Un sous-espace peut cependant être dense : c'est le cas de l'hyperplan des fonctions nulles en $c$ dans $(\mathcal{C}([0, 1]), \lVert \cdot \rVert_{1})$ (exercice 25). Être d'intérieur vide n'interdit pas d'être « partout ».
- id: "l3-cd-01-11"
  feuille: "f-l3-cd-01"
  numero: 11
  partie: "Normes, boules, topologie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [normes et topologie, normes équivalentes]
  noeuds: [gd-normes, me-topologie, gd-equivalence]
  notions: [norme, boule-ouverte, normes-equivalentes]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Soit $E$ un $\mathbb{K}$-espace vectoriel muni de deux normes $\lVert \cdot \rVert$ et $\lVert \cdot \rVert'$. Montrer que les propriétés suivantes sont équivalentes :

    **1.** il existe $C > 0$ tel que $\lVert x \rVert \leqslant C\lVert x \rVert'$ pour tout $x \in E$ ;

    **2.** toute boule de $\lVert \cdot \rVert$ contient une boule de $\lVert \cdot \rVert'$ de même centre ;

    **3.** tout ouvert pour $\lVert \cdot \rVert$ est un ouvert pour $\lVert \cdot \rVert'$ ;

    **4.** il existe une boule de $\lVert \cdot \rVert$ qui contient une boule de $\lVert \cdot \rVert'$.
  corrige: |
    On montre (i) $\Rightarrow$ (ii) $\Rightarrow$ (iii) $\Rightarrow$ (iv) $\Rightarrow$ (i). On note $B$ et $B'$ les boules ouvertes des deux normes.

    $\triangleright$ *(i) $\Rightarrow$ (ii).* Si $\lVert x - a \rVert' < \dfrac{r}{C}$, alors $\lVert x - a \rVert \leqslant C\lVert x - a \rVert' < r$ : $B'\Big(a, \dfrac{r}{C}\Big) \subset B(a, r)$.

    $\triangleright$ *(ii) $\Rightarrow$ (iii).* Si $O$ est ouvert pour $\lVert \cdot \rVert$ et $a \in O$, $O$ contient une boule $B(a, r)$, qui contient une boule $B'(a, \rho)$ : $O$ est ouvert pour $\lVert \cdot \rVert'$.

    $\triangleright$ *(iii) $\Rightarrow$ (iv).* La boule $B(0, 1)$ est ouverte pour $\lVert \cdot \rVert$, donc pour $\lVert \cdot \rVert'$ : elle contient une boule $B'(0, \rho)$.

    $\triangleright$ *(iv) $\Rightarrow$ (i).* Supposons $B'(b, \rho) \subset B(a, r)$. Si $\lVert x \rVert' < \rho$, les points $b + x$ et $b - x$ sont dans $B(a, r)$, donc 
    $$2\lVert x \rVert = \lVert (b + x - a) - (b - x - a) \rVert < 2r.$$
     Ainsi $\lVert x \rVert' < \rho$ entraîne $\lVert x \rVert < r$ ; par homogénéité, 
    $$\boxed{\lVert x \rVert \leqslant \frac{r}{\rho}\,\lVert x \rVert' \text{ pour tout } x}.$$

    *À retenir.* Deux normes sont équivalentes si et seulement si elles définissent les mêmes ouverts : l'équivalence des normes est une propriété topologique.
- id: "l3-cd-01-12"
