  mots_cles: [applications continues]
  noeuds: [me-sequentielle, t-continue]
  notions: []
  page_enonce: 4
  page_corrige: 6
  enonce: |
    Étudier la continuité sur $\mathbb{R}^{2}$ des fonctions suivantes, définies pour $(x, y) \neq (0, 0)$ par la formule indiquée et prolongées par $f(0, 0) = 0$ : 
    $$\text{(a) } \frac{xy^{2}}{x^{2} + y^{2}}, \qquad \text{(b) } \frac{xy}{x^{2} + y^{2}}, \qquad \text{(c) } \frac{x + y}{x^{2} + y^{2}}, \qquad \text{(d) } \frac{x^{3}y^{2}}{x^{2} + y^{2}}, \qquad \text{(e) } \frac{\exp\Big(-\dfrac{1}{x^{2} + y^{2}}\Big)}{|x| + |y|}.$$
  corrige: |
    En dehors de l'origine, chaque fonction est continue comme quotient de fonctions continues dont le dénominateur ne s'annule pas ; seule la continuité en $(0, 0)$ est en jeu. On note $r = \sqrt{x^{2} + y^{2}}$, et l'on utilise $|x| \leqslant r$, $|y| \leqslant r$.

    **(a)** $\Big|\dfrac{xy^{2}}{x^{2} + y^{2}}\Big| \leqslant |x| \leqslant r \to 0$ : $\boxed{\text{continue}}$.

    **(b)** Sur la droite $y = x$, on a $f(x, x) = \dfrac{1}{2}$ pour tout $x \neq 0$, qui ne tend pas vers $f(0, 0) = 0$ : $\boxed{\text{discontinue en } (0, 0)}$. Sur la droite $y = mx$, la fonction vaut $\dfrac{m}{1 + m^{2}}$ : elle a une limite le long de chaque droite, mais ces limites diffèrent.

    **(c)** Sur la droite $y = x$, $f(x, x) = \dfrac{1}{x}$, qui n'est même pas bornée : $\boxed{\text{discontinue en } (0, 0)}$.

    **(d)** $\Big|\dfrac{x^{3}y^{2}}{x^{2} + y^{2}}\Big| \leqslant |x|^{3} \to 0$ : $\boxed{\text{continue}}$.

    **(e)** Comme $|x| + |y| \geqslant r$, on a $0 < f(x, y) \leqslant \dfrac{\mathrm{e}^{-1/r^{2}}}{r}$, qui tend vers $0$ quand $r \to 0$ (en posant $u = \dfrac{1}{r}$, $u\mathrm{e}^{-u^{2}} \to 0$ quand $u \to +\infty$) : $\boxed{\text{continue}}$.

    *Méthode.* Pour prouver la continuité en $0$, on majore $|f|$ par une fonction de $r$ seule qui tend vers $0$ ; pour la réfuter, on exhibe un chemin, souvent une droite, le long duquel la limite est fausse.
- id: "l3-cd-01-15"
  feuille: "f-l3-cd-01"
  numero: 15
  partie: "Compacité"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [compacité]
  noeuds: [me-compacite-sequentielle]
  notions: [compact]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    **1.** Soit $E$ un espace normé de dimension finie et $f : E \to \mathbb{R}$ continue, telle que $f(x) \to +\infty$ quand $\lVert x \rVert \to +\infty$ (pour tout $M > 0$, il existe $A > 0$ tel que $\lVert x \rVert \geqslant A$ entraîne $f(x) \geqslant M$). Montrer que $f$ est minorée sur $E$ et atteint son minimum. On pourra raisonner sur une boule fermée assez grande.

    **2.** Application. Soit $F$ un sous-espace vectoriel de $\mathbb{R}^{n}$ muni d'une norme quelconque, et $a \in \mathbb{R}^{n}$. Montrer que $\displaystyle\inf_{x \in F}\lVert x - a \rVert$ est atteint : $a$ admet une *meilleure approximation* dans $F$.

    **3.** Y a-t-il unicité de la meilleure approximation ? On étudiera, dans $\mathbb{R}^{2}$, la droite $F = \mathbb{R}(1, 0)$ et le point $a = (0, 1)$, pour les normes $\lVert \cdot \rVert_{2}$ et $\lVert \cdot \rVert_{\infty}$.
  corrige: |
    On se ramène à une fonction continue sur un compact : la boule fermée d'un espace de dimension finie (cours, th. 2 et 5).

    **1.** Soit $M = f(0) + 1$ et $A$ associé. La boule fermée $K = B_{f}(0, A)$ est fermée et bornée dans un espace de dimension finie, donc compacte ; $f$ y atteint son minimum en un point $x_{0}$ (cours, th. 3). Pour $\lVert x \rVert \geqslant A$, $f(x) \geqslant M > f(0) \geqslant f(x_{0})$, puisque $0 \in K$. Donc $\boxed{f(x_{0}) = \min_{E}f}$, et en particulier $f$ est minorée.

    **2.** Le sous-espace $F$ est un espace normé de dimension finie, et $g(x) = \lVert x - a \rVert$ y est continue, avec $g(x) \geqslant \lVert x \rVert - \lVert a \rVert \to +\infty$. Par la question 1, 
    $$\boxed{\inf_{x \in F}\lVert x - a \rVert \text{ est atteint}}.$$

    **3.** Les points de $F$ sont les $(t, 0)$. Pour $\lVert \cdot \rVert_{2}$, $\lVert (t, -1) \rVert_{2} = \sqrt{1 + t^{2}}$ est minimal pour $t = 0$ seulement : $\boxed{\text{unicité}}$, le point $(0, 0)$ étant le projeté orthogonal. Pour $\lVert \cdot \rVert_{\infty}$, $\lVert (t, -1) \rVert_{\infty} = \max(|t|, 1) = 1$ pour tout $t \in [-1, 1]$ : 
    $$\boxed{\text{tous les points } (t, 0), \ |t| \leqslant 1, \text{ sont des meilleures approximations}}.$$

    *Remarque.* La non-unicité tient aux côtés plats de la boule de $\lVert \cdot \rVert_{\infty}$ : la plus grande boule centrée en $a$ qui ne traverse pas $F$ touche $F$ le long d'un segment. Pour la norme euclidienne, dont la sphère ne contient aucun segment, la meilleure approximation est toujours unique.
- id: "l3-cd-01-16"
  feuille: "f-l3-cd-01"
  numero: 16
