  enonce: |
    Pour $x = (x_{1}, x_{2}) \in \mathbb{R}^{2}$, on pose $N(x) = \displaystyle\sup_{t \in \mathbb{R}}\left|\dfrac{x_{1} + tx_{2}}{1 + t^{2}}\right|$.

    **1.** Montrer que $N$ est bien définie et que c'est une norme sur $\mathbb{R}^{2}$.

    **2.** Montrer que $N(x) = \dfrac{1}{2}\Big(\sqrt{x_{1}^{2} + x_{2}^{2}} + |x_{1}|\Big)$.

    **3.** Dessiner la boule unité de $N$.

    **4.** Comparer $N$ à la norme euclidienne de $\mathbb{R}^{2}$, avec les meilleures constantes.
  corrige: |
    Le changement de variable $t = \tan\varphi$ transforme la borne supérieure en celle d'un cosinus.

    **1.** Pour $x$ fixé, $\dfrac{|x_{1} + tx_{2}|}{1 + t^{2}} \leqslant |x_{1}| + |x_{2}|$ (car $|t| \leqslant 1 + t^{2}$) : la borne supérieure est finie. Pour chaque $t$, $x \mapsto \dfrac{|x_{1} + tx_{2}|}{1 + t^{2}}$ est homogène et vérifie l'inégalité triangulaire ; ces deux propriétés passent à la borne supérieure. Séparation : si $N(x) = 0$, $t = 0$ donne $x_{1} = 0$, puis $t = 1$ donne $x_{2} = 0$. $\boxed{N \text{ est une norme.}}$

    **2.** Écrivons $x = (\rho\cos\theta, \rho\sin\theta)$ et $t = \tan\varphi$, $\varphi \in \Big]-\dfrac{\pi}{2}, \dfrac{\pi}{2}\Big[$. Comme $\dfrac{1}{1 + t^{2}} = \cos^{2}\varphi$, 
    $$\frac{x_{1} + tx_{2}}{1 + t^{2}} = \rho\cos\varphi\cos(\varphi - \theta) = \frac{\rho}{2}\big(\cos(2\varphi - \theta) + \cos\theta\big).$$
     Quand $\varphi$ décrit $\Big]-\dfrac{\pi}{2}, \dfrac{\pi}{2}\Big[$, $2\varphi - \theta$ décrit un intervalle ouvert de longueur $2\pi$, sur lequel $\cos$ prend toutes ses valeurs sauf au plus une ; la borne supérieure de la valeur absolue est donc $\dfrac{\rho}{2}(1 + |\cos\theta|)$, soit 
    $$\boxed{N(x) = \frac{1}{2}\Big(\sqrt{x_{1}^{2} + x_{2}^{2}} + |x_{1}|\Big)}.$$

    **3.** Pour $x_{1} \geqslant 0$, $N(x) \leqslant 1$ équivaut à $\sqrt{x_{1}^{2} + x_{2}^{2}} \leqslant 2 - x_{1}$, soit $x_{1} \leqslant 1 - \dfrac{x_{2}^{2}}{4}$ ; de même $x_{1} \geqslant -1 + \dfrac{x_{2}^{2}}{4}$ pour $x_{1} \leqslant 0$. La boule unité est la région comprise entre deux arcs de paraboles, qui se coupent en $(0, \pm 2)$.

    ![Figure](documents/figures/2c2b1b2d933543ec.svg)

    La boule unité de $N$, en carmin, est coincée entre les disques euclidiens de rayons $1$ et $2$, en pointillés, et les touche en $(\pm 1, 0)$ et en $(0, \pm 2)$.

    **4.** Comme $0 \leqslant |x_{1}| \leqslant \lVert x \rVert_{2}$, on obtient 
    $$\boxed{\frac{1}{2}\lVert x \rVert_{2} \leqslant N(x) \leqslant \lVert x \rVert_{2}},$$
     avec égalité à gauche en $x = (0, 1)$ et à droite en $x = (1, 0)$ : les constantes sont optimales.
- id: "l3-cd-01-13"
