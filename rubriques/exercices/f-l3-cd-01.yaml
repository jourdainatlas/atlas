  page_corrige: 6
  enonce: |
    Soit $(E, \lVert \cdot \rVert)$ et $(E', \lVert \cdot \rVert')$ deux espaces normés. On munit $E \times E'$ de la norme produit $\lVert (x, y) \rVert = \max\big(\lVert x \rVert, \lVert y \rVert'\big)$.

    **1.** Montrer qu'une suite $(x_{n}, y_{n})$ de $E \times E'$ converge vers $(\ell, \ell')$ si et seulement si $x_{n} \to \ell$ dans $E$ et $y_{n} \to \ell'$ dans $E'$. En déduire que les projections $(x, y) \mapsto x$ et $(x, y) \mapsto y$ sont continues.

    **2.** Montrer que les applications suivantes sont continues : 
    $$(x, y) \in E \times E \mapsto x + y, \qquad (x, \lambda) \in E \times \mathbb{K} \mapsto \lambda x, \qquad x \in E \mapsto \lambda x + a \ \ (a \in E,\ \lambda \in \mathbb{K} \text{ fixés}).$$

    **3.** Montrer que la norme $x \mapsto \lVert x \rVert$ est continue. En déduire que, si $x_{n} \to \ell$, alors $\lVert x_{n} \rVert \to \lVert \ell \rVert$.
  corrige: |
    Avec la norme produit, converger dans $E \times E'$, c'est converger composante par composante.

    **1.** On a $\lVert x_{n} - \ell \rVert \leqslant \lVert (x_{n}, y_{n}) - (\ell, \ell') \rVert = \max\big(\lVert x_{n} - \ell \rVert, \lVert y_{n} - \ell' \rVert'\big)$, et de même pour $y_{n}$ : la convergence dans $E \times E'$ entraîne celle des composantes, et la réciproque vient de ce que le maximum de deux suites qui tendent vers $0$ tend vers $0$. 
    $$\boxed{(x_{n}, y_{n}) \to (\ell, \ell') \iff x_{n} \to \ell \text{ et } y_{n} \to \ell'}.$$
     Les projections sont $1$-lipschitziennes, donc continues.

    **2.** On utilise la caractérisation séquentielle (cours, prop. 5). Si $(x_{n}, y_{n}) \to (x, y)$, alors $\lVert (x_{n} + y_{n}) - (x + y) \rVert \leqslant \lVert x_{n} - x \rVert + \lVert y_{n} - y \rVert \to 0$. Si $(x_{n}, \lambda_{n}) \to (x, \lambda)$, la suite $(x_{n})$ est bornée et 
    $$\lVert \lambda_{n}x_{n} - \lambda x \rVert \leqslant |\lambda_{n} - \lambda|\,\lVert x_{n} \rVert + |\lambda|\,\lVert x_{n} - x \rVert \to 0.$$
     Enfin $x \mapsto \lambda x + a$ est $|\lambda|$-lipschitzienne. 
    $$\boxed{\text{Les trois applications sont continues.}}$$

    **3.** La seconde inégalité triangulaire $\big|\lVert x \rVert - \lVert y \rVert\big| \leqslant \lVert x - y \rVert$ montre que la norme est $1$-lipschitzienne, donc continue ; en particulier 
    $$\boxed{x_{n} \to \ell \Rightarrow \lVert x_{n} \rVert \to \lVert \ell \rVert}.$$

    *Piège.* La réciproque est fausse : dans $\mathbb{R}$, $x_{n} = (-1)^{n}$ ne converge pas, alors que $|x_{n}| = 1$ converge.
- id: "l3-cd-01-14"
  feuille: "f-l3-cd-01"
  numero: 14
  partie: "Applications continues"
  etoiles: 2
