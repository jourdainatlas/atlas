  enonce: |
    Pour $p$, $q \in [1, +\infty]$, on note $C_{p, q}$ la plus petite constante telle que $\lVert x \rVert_{q} \leqslant C_{p, q}\lVert x \rVert_{p}$ pour tout $x \in \mathbb{R}^{n}$.

    **1.** Dessiner, dans $\mathbb{R}^{2}$, la boule unité fermée pour $\lVert \cdot \rVert_{\infty}$ et, sur la même figure, la plus petite et la plus grande boule fermée pour $\lVert \cdot \rVert_{p}$ centrées en $0$ qui la contiennent, respectivement qui y sont contenues.

    **2.** Montrer que $C_{p, \infty} = 1$ et $C_{\infty, p} = n^{1/p}$ pour $1 \leqslant p < \infty$.

    **3.** Montrer que $C_{p, q} = 1$ pour $p \leqslant q$.

    **4.** Montrer que $C_{p, q} = n^{\frac{1}{q} - \frac{1}{p}}$ pour $p \geqslant q$.
  corrige: |
    On majore à l'aide des exercices 6 et 7, puis l'on exhibe un vecteur qui réalise l'égalité : $e_{1} = (1, 0, \dots, 0)$ ou $\mathbf{1} = (1, \dots, 1)$.

    **1.** La boule unité fermée de $\lVert \cdot \rVert_{\infty}$ est le carré $[-1, 1]^{2}$. La plus grande boule de $\lVert \cdot \rVert_{p}$ centrée en $0$ qu'il contient est $B^{p}$ (de rayon $1$), qui touche le carré aux points $(\pm 1, 0)$, $(0, \pm 1)$ ; la plus petite qui le contient a pour rayon $\lVert (1, 1) \rVert_{p} = 2^{1/p}$, et passe par les sommets du carré.

    **2.** On a $\lVert x \rVert_{\infty} \leqslant \lVert x \rVert_{p}$, avec égalité pour $e_{1}$ : $\boxed{C_{p, \infty} = 1}$. Et $\lVert x \rVert_{p} \leqslant n^{1/p}\lVert x \rVert_{\infty}$ (exercice 6, question 4), avec égalité pour $\mathbf{1}$ : $\boxed{C_{\infty, p} = n^{1/p}}$.

    **3.** Pour $p \leqslant q$, $B^{p} \subset B^{q}$ (exercice 6), ce qui s'écrit, par homogénéité, $\lVert x \rVert_{q} \leqslant \lVert x \rVert_{p}$ ; égalité pour $e_{1}$ : $\boxed{C_{p, q} = 1}$.

    **4.** Pour $q < p < \infty$, l'inégalité de Hölder (exercice 7) avec les exposants conjugués $\dfrac{p}{q}$ et $\dfrac{p}{p - q}$, appliquée à $|x_{i}|^{q}$ et à $1$, donne 
    $$\sum_{i}|x_{i}|^{q} \leqslant \Big(\sum_{i}|x_{i}|^{p}\Big)^{q/p}n^{1 - q/p}, \qquad\text{soit}\qquad \lVert x \rVert_{q} \leqslant n^{\frac{1}{q} - \frac{1}{p}}\lVert x \rVert_{p},$$
     avec égalité pour $\mathbf{1}$ : 
    $$\boxed{C_{p, q} = n^{\frac{1}{q} - \frac{1}{p}}}.$$
     Le cas $p = \infty$ est la question 2.

    *À retenir.* Le théorème d'équivalence des normes ne donne pas les constantes ; elles dépendent de la dimension, et tendent vers l'infini avec $n$ dès que $p \neq q$ : c'est l'annonce de ce qui se passe en dimension infinie (exercice 20).
- id: "l3-cd-01-18"
  feuille: "f-l3-cd-01"
  numero: 18
  partie: "Dimension finie"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [dimension finie]
  noeuds: [gd-equivalence]
  notions: [normes-equivalentes]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Soit $u : E \to F$ une application linéaire entre deux espaces normés. On suppose $E$ de dimension finie et $u$ injective. Montrer qu'il existe des réels $m > 0$ et $M > 0$ tels que, pour tout $x \in E$, 
    $$m\lVert x \rVert_{E} \leqslant \lVert u(x) \rVert_{F} \leqslant M\lVert x \rVert_{E}.$$
  corrige: |
    L'injectivité permet de fabriquer une seconde norme sur $E$.

    Posons $N(x) = \lVert u(x) \rVert_{F}$. C'est une norme sur $E$ : homogénéité et inégalité triangulaire viennent de la linéarité de $u$, et la séparation de son injectivité ($N(x) = 0 \Rightarrow u(x) = 0 \Rightarrow x = 0$). En dimension finie, $N$ et $\lVert \cdot \rVert_{E}$ sont équivalentes (cours, th. 5) : il existe $m$, $M > 0$ tels que 
    $$\boxed{m\lVert x \rVert_{E} \leqslant \lVert u(x) \rVert_{F} \leqslant M\lVert x \rVert_{E}}.$$

    *Remarque.* La minoration dit que $u$ est un isomorphisme sur son image, de réciproque continue. Sans l'injectivité, $N$ n'est plus qu'une semi-norme et la minoration est fausse pour les $x$ du noyau.
- id: "l3-cd-01-19"
  feuille: "f-l3-cd-01"
  numero: 19
  partie: "Dimension finie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [dimension finie]
  noeuds: [gd-equivalence]
  notions: [normes-equivalentes]
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Soit $n \in \mathbb{N}$ et $\mathbb{C}_{n}[X]$ l'espace des polynômes de degré au plus $n$. Montrer qu'il existe des constantes $C_{n} > 0$ et $C'_{n} > 0$ telles que :

    **1.** pour tout $P \in \mathbb{C}_{n}[X]$, $C_{n}|P(0)| \leqslant \displaystyle\int_{1}^{2}|P(t)|\,\mathrm{d} t$ ;

    **2.** pour tous $P$, $Q \in \mathbb{C}_{n}[X]$, $C'_{n}|P(0)|\,|Q(0)| \leqslant \displaystyle\int_{1}^{2}|P(t)|\,\mathrm{d} t \times \max_{[-2, -1]}|Q|$.
  corrige: |
    On fabrique des normes sur l'espace de dimension finie $\mathbb{C}_{n}[X]$, et l'on applique l'équivalence des normes.

    **1.** $N_{1}(P) = \int_{1}^{2}|P(t)|\,\mathrm{d} t$ est une norme sur $\mathbb{C}_{n}[X]$ : la seule difficulté est la séparation, et si $N_{1}(P) = 0$, le polynôme $P$ est nul sur $[1, 2]$ (exercice 1, question 2), donc a une infinité de racines et est nul. De même, $N_{0}(P) = \max_{0 \leqslant i \leqslant n}|a_{i}|$ est une norme, et $|P(0)| = |a_{0}| \leqslant N_{0}(P)$. Par équivalence de $N_{0}$ et $N_{1}$, il existe $c$ tel que $N_{0} \leqslant cN_{1}$, d'où 
    $$\boxed{C_{n}|P(0)| \leqslant N_{1}(P) \text{ avec } C_{n} = \frac{1}{c}}.$$

    **2.** De même, $N_{2}(Q) = \max_{[-2, -1]}|Q|$ est une norme sur $\mathbb{C}_{n}[X]$ (un polynôme nul sur $[-2, -1]$ est nul), et il existe $c' > 0$ tel que $|Q(0)| \leqslant c'N_{2}(Q)$. En multipliant les deux inégalités : 
    $$\boxed{C'_{n}|P(0)|\,|Q(0)| \leqslant N_{1}(P)N_{2}(Q) \text{ avec } C'_{n} = \frac{C_{n}}{c'}}.$$

    *Piège.* Les constantes dépendent de $n$ et ne peuvent pas être choisies indépendamment : pour $P = (1 - X/2)^{k}$, de degré $k$, $|P(0)| = 1$ alors que $\int_{1}^{2}|P| \leqslant \dfrac{1}{2^{k}}$ tend vers $0$. La dimension finie est indispensable.
- id: "l3-cd-01-20"
  feuille: "f-l3-cd-01"
  numero: 20
  partie: "Complétude, dimension infinie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [complétude, compacité, normes équivalentes]
  noeuds: [me-cauchy, f-evn, me-compacite-sequentielle, gd-equivalence]
  notions: [espace-complet, banach, suite-cauchy, compact, normes-equivalentes]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Soit $E = \mathcal{C}([0, 1], \mathbb{R})$, muni des normes $\lVert f \rVert_{\infty} = \displaystyle\sup_{[0, 1]}|f|$ et $\lVert f \rVert_{1} = \displaystyle\int_{0}^{1}|f(t)|\,\mathrm{d} t$.

    **1.** Montrer que $\lVert f \rVert_{1} \leqslant \lVert f \rVert_{\infty}$ pour tout $f \in E$.

    **2.** On pose $f_{n}(x) = x^{n}$. La suite $(f_{n})$ converge-t-elle dans $(E, \lVert \cdot \rVert_{1})$ ? dans $(E, \lVert \cdot \rVert_{\infty})$ ? En déduire que les deux normes ne sont pas équivalentes.

    **3.** Les parties $A = \Big\{f \in E \;\Big|\; f\Big(\dfrac{1}{2}\Big) = 1\Big\}$ et $A' = \{f \in E \mid f(1) = 1\}$ sont-elles fermées dans $(E, \lVert \cdot \rVert_{\infty})$ ? dans $(E, \lVert \cdot \rVert_{1})$ ? Sont-elles ouvertes ?

    **4.** Montrer que $(E, \lVert \cdot \rVert_{1})$ n'est pas complet. On pourra considérer une suite de fonctions continues affines par morceaux qui converge, pour $\lVert \cdot \rVert_{1}$, vers la fonction indicatrice de $\Big[0, \dfrac{1}{2}\Big[$.

    **5.** Montrer que la boule unité fermée de $(E, \lVert \cdot \rVert_{\infty})$ n'est pas compacte. On pourra construire une suite de fonctions de cette boule deux à deux à distance $1$.
  corrige: |
    Cet exercice rassemble les phénomènes propres à la dimension infinie, sur l'exemple le plus simple.

    **1.** $\int_{0}^{1}|f| \leqslant \int_{0}^{1}\lVert f \rVert_{\infty} = \lVert f \rVert_{\infty}$ : 
    $$\boxed{\lVert f \rVert_{1} \leqslant \lVert f \rVert_{\infty}}.$$

    **2.** On a $\lVert f_{n} \rVert_{1} = \dfrac{1}{n + 1} \to 0$ : 
    $$\boxed{f_{n} \to 0 \text{ dans } (E, \lVert \cdot \rVert_{1})}.$$
     En revanche, $\lVert f_{n} \rVert_{\infty} = 1$. Si $(f_{n})$ convergeait vers $g$ pour $\lVert \cdot \rVert_{\infty}$, elle convergerait vers $g$ pour $\lVert \cdot \rVert_{1}$ par la question 1, donc $g = 0$ par unicité de la limite, ce qui contredit $\lVert f_{n} \rVert_{\infty} = 1$ : 
    $$\boxed{(f_{n}) \text{ ne converge pas pour } \lVert \cdot \rVert_{\infty}}.$$
     Le rapport $\dfrac{\lVert f_{n} \rVert_{\infty}}{\lVert f_{n} \rVert_{1}} = n + 1$ n'est pas borné : 
    $$\boxed{\text{les normes ne sont pas équivalentes}}.$$

    **3.** Pour $\lVert \cdot \rVert_{\infty}$, l'évaluation $f \mapsto f\big(\tfrac{1}{2}\big)$ est $1$-lipschitzienne, donc continue, et $A$, image réciproque du fermé $\{1\}$, est $\boxed{\text{fermée}}$ ; de même pour $A'$. Pour $\lVert \cdot \rVert_{1}$, soit $h_{n}$ la fonction « triangle » nulle hors de $\Big[\dfrac{1}{2} - \dfrac{1}{n}, \dfrac{1}{2} + \dfrac{1}{n}\Big]$, affine sur chaque moitié, et égale à $1$ en $\dfrac{1}{2}$. Elle est dans $A$, et $\lVert h_{n} \rVert_{1} = \dfrac{1}{n} \to 0$ : la fonction nulle est adhérente à $A$ sans lui appartenir. 
    $$\boxed{A \text{ n'est pas fermée pour } \lVert \cdot \rVert_{1}};$$
     de même pour $A'$, avec un demi-triangle en $1$. Aucune n'est ouverte : si $f \in A$, la fonction $f + \varepsilon$ (constante $\varepsilon > 0$ ajoutée) n'est pas dans $A$, et $\lVert \varepsilon \rVert_{1} = \lVert \varepsilon \rVert_{\infty} = \varepsilon$.

    **4.** Soit $f_{n}$ égale à $1$ sur $\Big[0, \dfrac{1}{2}\Big]$, à $0$ sur $\Big[\dfrac{1}{2} + \dfrac{1}{n}, 1\Big]$, affine entre les deux, et $f_{\star}$ l'indicatrice de $\Big[0, \dfrac{1}{2}\Big[$. On a $\int_{0}^{1}|f_{n} - f_{\star}| = \dfrac{1}{2n}$, donc $\lVert f_{n} - f_{m} \rVert_{1} \leqslant \dfrac{1}{2n} + \dfrac{1}{2m}$ : $\boxed{(f_{n}) \text{ est de Cauchy}}$. Si elle convergeait vers $g \in E$, on aurait $\int_{0}^{1}|g - f_{\star}| \leqslant \lVert g - f_{n} \rVert_{1} + \dfrac{1}{2n} \to 0$, donc $\int_{0}^{1}|g - f_{\star}| = 0$. La fonction $|g - f_{\star}|$ est continue sur $\Big[0, \dfrac{1}{2}\Big[$ et sur $\Big]\dfrac{1}{2}, 1\Big]$, positive, d'intégrale nulle : $g = 1$ sur le premier intervalle et $g = 0$ sur le second, ce qui est incompatible avec la continuité de $g$ en $\dfrac{1}{2}$. 
    $$\boxed{(E, \lVert \cdot \rVert_{1}) \text{ n'est pas complet.}}$$

    **5.** Soit $g_{n}$ la fonction triangle de hauteur $1$ portée par $\Big[\dfrac{1}{n + 1}, \dfrac{1}{n}\Big]$, nulle ailleurs. Les supports sont d'intérieurs disjoints, donc $\lVert g_{n} - g_{m} \rVert_{\infty} = 1$ pour $n \neq m$ : aucune suite extraite n'est de Cauchy, ni a fortiori convergente. 
    $$\boxed{\text{La boule unité fermée de } (E, \lVert \cdot \rVert_{\infty}) \text{ n'est pas compacte}},$$
     ce que le théorème de Riesz (cours, th. 10) annonçait en dimension infinie.

    *À retenir.* En dimension infinie, le choix de la norme change tout : convergence des suites, parties fermées, complétude. $(E, \lVert \cdot \rVert_{\infty})$ est complet (cours, th. 8), $(E, \lVert \cdot \rVert_{1})$ ne l'est pas.
- id: "l3-cd-01-21"
  feuille: "f-l3-cd-01"
  numero: 21
  partie: "Complétude, dimension infinie"
  etoiles: 2
  types: [Calcul]
  mots_cles: [complétude]
  noeuds: [me-cauchy, f-evn]
  notions: [espace-complet, banach]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    On munit $E = \mathcal{C}([0, 1], \mathbb{R})$ de la norme $\lVert \cdot \rVert_{\infty}$. Pour chacune des parties suivantes, dire si elle est ouverte, si elle est fermée, et déterminer son adhérence : 
    $$A = \{f \in E \mid f(0) = 0\}, \qquad B = \{f \in E \mid f(0) > 0\}, \qquad C = \Big\{f \in E \;\Big|\; \int_{0}^{1}f(x)\,\mathrm{d} x = 0\Big\}.$$
  corrige: |
    Les trois parties sont définies par une condition sur une forme linéaire continue pour $\lVert \cdot \rVert_{\infty}$ : $f \mapsto f(0)$ ou $f \mapsto \int_{0}^{1}f$, toutes deux $1$-lipschitziennes.

    $\triangleright$ *La partie $A$.* Image réciproque du fermé $\{0\}$ : 
    $$\boxed{A \text{ est fermée et } \overline{A} = A}.$$
     Elle n'est pas ouverte : $f + \varepsilon \notin A$ pour $f \in A$ et $\varepsilon > 0$, avec $\lVert \varepsilon \rVert_{\infty} = \varepsilon$ (c'est aussi l'exercice 10 : $A$ est un sous-espace distinct de $E$).

    $\triangleright$ *La partie $B$.* Image réciproque de l'ouvert $]0, +\infty[$ : $\boxed{B \text{ est ouverte}}$. Elle n'est pas fermée : les constantes $\dfrac{1}{n}$ sont dans $B$ et tendent vers $0 \notin B$. Son adhérence est 
    $$\boxed{\overline{B} = \{f \mid f(0) \geqslant 0\}}:$$
     cette partie est fermée et contient $B$, donc $\overline{B}$ ; réciproquement, si $f(0) \geqslant 0$, $f + \dfrac{1}{n} \in B$ tend vers $f$.

    $\triangleright$ *La partie $C$.* Image réciproque de $\{0\}$ par $f \mapsto \int_{0}^{1}f$ : 
    $$\boxed{C \text{ est fermée et } \overline{C} = C},$$
     non ouverte pour la même raison que $A$.
- id: "l3-cd-01-22"
  feuille: "f-l3-cd-01"
  numero: 22
  partie: "Complétude, dimension infinie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [complétude]
  noeuds: [me-cauchy, f-evn]
  notions: [espace-complet, banach]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Soit $p \geqslant 1$. On note $\ell^{p}$ l'ensemble des suites réelles $x = (x_{n})_{n \in \mathbb{N}}$ telles que la série $\sum|x_{n}|^{p}$ converge, et $\ell^{\infty}$ l'ensemble des suites réelles bornées. Pour $x \in \ell^{p}$, on pose $\lVert x \rVert_{p} = \Big(\displaystyle\sum_{n = 0}^{+\infty}|x_{n}|^{p}\Big)^{1/p}$, et pour $x \in \ell^{\infty}$, $\lVert x \rVert_{\infty} = \displaystyle\sup_{n \in \mathbb{N}}|x_{n}|$.

    **1.** Montrer que $\ell^{p}$ est un espace vectoriel et que $\lVert \cdot \rVert_{p}$ est une norme sur $\ell^{p}$. Faire de même pour $\ell^{\infty}$.

    **2.** La suite $u = \Big(\dfrac{1}{n + 1}\Big)_{n \in \mathbb{N}}$ appartient-elle à $\ell^{1}$ ? à $\ell^{2}$ ? à $\ell^{\infty}$ ?

    **3.** L'ensemble $\{x \mid x_{1} = 3\}$ est-il ouvert dans $\ell^{1}$, dans $\ell^{2}$, dans $\ell^{\infty}$ ? Est-il fermé ?
  corrige: |
    On transpose aux séries les inégalités de dimension finie, en passant à la limite sur les sommes partielles.

    **1.** Par convexité de $t \mapsto t^{p}$, $|x_{n} + y_{n}|^{p} \leqslant 2^{p - 1}\big(|x_{n}|^{p} + |y_{n}|^{p}\big)$ : $\ell^{p}$ est stable par somme, et évidemment par multiplication par un réel ; c'est un sous-espace de l'espace des suites. Pour l'inégalité triangulaire, l'inégalité de Minkowski (exercice 7) donne, pour tout $N$, 
    $$\Big(\sum_{n = 0}^{N}|x_{n} + y_{n}|^{p}\Big)^{1/p} \leqslant \Big(\sum_{n = 0}^{N}|x_{n}|^{p}\Big)^{1/p} + \Big(\sum_{n = 0}^{N}|y_{n}|^{p}\Big)^{1/p} \leqslant \lVert x \rVert_{p} + \lVert y \rVert_{p},$$
     et l'on fait tendre $N$ vers l'infini. Séparation et homogénéité étant immédiates, $\lVert \cdot \rVert_{p}$ est une norme sur $\ell^{p}$. Pour $\ell^{\infty}$, c'est la même démonstration qu'en dimension finie. 
    $$\boxed{\ell^{p} \text{ et } \ell^{\infty} \text{ sont des espaces normés.}}$$

    **2.** La série $\sum\dfrac{1}{n + 1}$ diverge (série harmonique), $\sum\dfrac{1}{(n + 1)^{2}}$ converge, et $u$ est bornée par $1$ : 
    $$\boxed{u \notin \ell^{1}, \ u \in \ell^{2}, \ u \in \ell^{\infty}}.$$

    **3.** Pour chacune des trois normes, $|x_{1} - y_{1}| \leqslant \lVert x - y \rVert$ : l'application $x \mapsto x_{1}$ est continue, et $H = \{x \mid x_{1} = 3\}$ est $\boxed{\text{fermé}}$, image réciproque de $\{3\}$. Il n'est $\boxed{\text{pas ouvert}}$ : si $x \in H$, la suite $x + \varepsilon e_{1}$, où $e_{1}$ est la suite dont seul le terme d'indice $1$ vaut $1$, est hors de $H$ et à distance $\varepsilon$ de $x$, pour les trois normes.
- id: "l3-cd-01-23"
  feuille: "f-l3-cd-01"
  numero: 23
  partie: "Complétude, dimension infinie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [complétude]
  noeuds: [me-cauchy, f-evn]
  notions: [espace-complet, banach, suite-cauchy]
  page_enonce: 6
  page_corrige: 10
  enonce: |
    Soit $E$ l'espace vectoriel des suites réelles $(x_{n})_{n \in \mathbb{N}}$ nulles à partir d'un certain rang. Pour $x \in E$, on pose $\lVert x \rVert_{1} = \displaystyle\sum_{n = 0}^{+\infty}|x_{n}|$.

    **1.** Montrer que $\lVert \cdot \rVert_{1}$ est une norme sur $E$.

    **2.** Montrer que $(E, \lVert \cdot \rVert_{1})$ n'est pas complet.
  corrige: |
    On exhibe une suite de Cauchy dont la « limite » naturelle n'est pas nulle à partir d'un certain rang.

    **1.** Les sommes sont finies ; les axiomes se vérifient comme pour $\lVert \cdot \rVert_{1}$ sur $\mathbb{R}^{n}$. 
    $$\boxed{\lVert \cdot \rVert_{1} \text{ est une norme.}}$$

    **2.** Soit $x^{(k)} = \big(1, \tfrac{1}{2}, \dots, \tfrac{1}{2^{k}}, 0, 0, \dots\big) \in E$. Pour $k < m$, $\lVert x^{(m)} - x^{(k)} \rVert_{1} = \sum_{n = k + 1}^{m}\dfrac{1}{2^{n}} \leqslant \dfrac{1}{2^{k}}$ : la suite est de Cauchy. Si elle convergeait vers $y \in E$, chaque coordonnée convergerait, puisque $|x^{(k)}_{n} - y_{n}| \leqslant \lVert x^{(k)} - y \rVert_{1}$, d'où $y_{n} = \dfrac{1}{2^{n}}$ pour tout $n$ : $y$ ne serait pas nulle à partir d'un certain rang. 
    $$\boxed{(E, \lVert \cdot \rVert_{1}) \text{ n'est pas complet.}}$$

    *Remarque.* $E$ est dense dans $\ell^{1}$, qui est complet : $\ell^{1}$ est le « complété » de $E$, comme $\mathbb{R}$ est celui de $\mathbb{Q}$.
- id: "l3-cd-01-24"
  feuille: "f-l3-cd-01"
  numero: 24
  partie: "Applications linéaires continues"
  etoiles: 1
  types: [Calcul]
  mots_cles: [applications linéaires continues]
  noeuds: [f-operateurs]
  notions: [norme-subordonnee]
  page_enonce: 6
  page_corrige: 10
  enonce: |
    Soit $a = (a_{1}, \dots, a_{n}) \in \mathbb{K}^{n}$ et $T : \mathbb{K}^{n} \to \mathbb{K}$ définie par $T(x) = \displaystyle\sum_{k = 1}^{n}a_{k}x_{k}$.

    **1.** Montrer que $T$ est linéaire et continue, et calculer sa norme lorsque $\mathbb{K}^{n}$ est muni de $\lVert \cdot \rVert_{\infty}$, puis de $\lVert \cdot \rVert_{2}$.

    **2.** Pour $\mathbb{K} = \mathbb{R}$ et $1 \leqslant p \leqslant \infty$, calculer la norme de $T$ lorsque $\mathbb{R}^{n}$ est muni de $\lVert \cdot \rVert_{p}$. On pourra utiliser l'exercice 7.

    **3.** Soit $a \in \mathbb{R}^{3}$. Calculer la norme de $x \mapsto a \wedge x$, de $(\mathbb{R}^{3}, \lVert \cdot \rVert_{2})$ dans $(\mathbb{R}^{3}, \lVert \cdot \rVert_{2})$.
  corrige: |
    Pour calculer une norme d'opérateur, on majore $|T(x)|$ par $C\lVert x \rVert$, puis l'on cherche un $x \neq 0$ qui réalise l'égalité : alors $|\mkern-1.5mu|\mkern-1.5mu|T|\mkern-1.5mu|\mkern-1.5mu| = C$.

    **1.** $T$ est linéaire, et continue puisque $\mathbb{K}^{n}$ est de dimension finie. Pour $\lVert \cdot \rVert_{\infty}$ : $|T(x)| \leqslant \sum|a_{k}|\,|x_{k}| \leqslant \Big(\sum|a_{k}|\Big)\lVert x \rVert_{\infty}$, avec égalité pour $x_{k} = \dfrac{\overline{a_{k}}}{|a_{k}|}$ (et $x_{k} = 1$ si $a_{k} = 0$), qui est de norme $1$ et donne $T(x) = \sum|a_{k}|$. 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|T|\mkern-1.5mu|\mkern-1.5mu| = \lVert a \rVert_{1}}.$$
     Pour $\lVert \cdot \rVert_{2}$ : Cauchy-Schwarz donne $|T(x)| \leqslant \lVert a \rVert_{2}\lVert x \rVert_{2}$, avec égalité pour $x = \overline{a}$. 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|T|\mkern-1.5mu|\mkern-1.5mu| = \lVert a \rVert_{2}}.$$

    **2.** Soit $q$ l'exposant conjugué de $p$ ($q = \infty$ si $p = 1$, $q = 1$ si $p = \infty$). L'inégalité de Hölder (exercice 7) donne $|T(x)| \leqslant \lVert a \rVert_{q}\lVert x \rVert_{p}$. Pour $1 < p < \infty$, le vecteur $x_{k} = \mathrm{sgn}(a_{k})|a_{k}|^{q - 1}$ réalise l'égalité : $T(x) = \sum|a_{k}|^{q}$ et, comme $(q - 1)p = q$, $\lVert x \rVert_{p} = \Big(\sum|a_{k}|^{q}\Big)^{1/p}$, d'où $\dfrac{T(x)}{\lVert x \rVert_{p}} = \Big(\sum|a_{k}|^{q}\Big)^{1 - 1/p} = \lVert a \rVert_{q}$. Pour $p = 1$, on prend $x = e_{k}$ avec $|a_{k}|$ maximal. 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|T|\mkern-1.5mu|\mkern-1.5mu| = \lVert a \rVert_{q}, \quad \frac{1}{p} + \frac{1}{q} = 1}.$$

    **3.** $\lVert a \wedge x \rVert_{2} = \lVert a \rVert_{2}\lVert x \rVert_{2}|\sin\theta| \leqslant \lVert a \rVert_{2}\lVert x \rVert_{2}$, où $\theta$ est l'angle de $a$ et $x$, avec égalité pour $x$ orthogonal à $a$ : 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|x \mapsto a \wedge x|\mkern-1.5mu|\mkern-1.5mu| = \lVert a \rVert_{2}}.$$

    *À retenir.* La norme d'une forme linéaire pour $\lVert \cdot \rVert_{p}$ est la norme $\lVert \cdot \rVert_{q}$ de ses coefficients : $\lVert \cdot \rVert_{1}$ et $\lVert \cdot \rVert_{\infty}$ sont « duales » l'une de l'autre, $\lVert \cdot \rVert_{2}$ l'est d'elle-même.
