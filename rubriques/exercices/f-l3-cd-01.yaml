  enonce: |
    Soit $E$ un espace normé non réduit à $\{0\}$, $a$, $b \in E$ et $r$, $r' > 0$.

    **1.** Montrer que $B(a, r) \cap B(b, r') = \varnothing$ si et seulement si $r + r' \leqslant \lVert a - b \rVert$.

    **2.** Montrer que $B(a, r) \subset B(b, r')$ si et seulement si $\lVert a - b \rVert + r \leqslant r'$.

    **3.** Qu'en est-il pour les boules fermées ?

    **4.** Montrer que deux boules de $E$ sont égales si et seulement si elles ont même centre, même rayon et même type (ouvert ou fermé).
  corrige: |
    L'inégalité triangulaire donne un sens de chaque équivalence ; pour l'autre, on se déplace le long de la droite qui joint les centres.

    **1.** Si $r + r' \leqslant \lVert a - b \rVert$ et si $z$ était dans les deux boules, on aurait $\lVert a - b \rVert \leqslant \lVert a - z \rVert + \lVert z - b \rVert < r + r'$ : impossible. Réciproquement, supposons $\lVert a - b \rVert < r + r'$. Si $a = b$, $a$ est dans les deux boules. Sinon, soit $u = \dfrac{b - a}{\lVert b - a \rVert}$ et $t$ tel que $\max(0, \lVert a - b \rVert - r') < t < r$, possible puisque $\lVert a - b \rVert - r' < r$. Le point $z = a + tu$ vérifie $\lVert z - a \rVert = t < r$ et $\lVert z - b \rVert = \lVert a - b \rVert - t < r'$ : il est dans l'intersection. 
    $$\boxed{B(a, r) \cap B(b, r') = \varnothing \iff r + r' \leqslant \lVert a - b \rVert}.$$

    **2.** Si $\lVert a - b \rVert + r \leqslant r'$ et $\lVert z - a \rVert < r$, alors $\lVert z - b \rVert < r + \lVert a - b \rVert \leqslant r'$. Réciproquement, supposons $B(a, r) \subset B(b, r')$. Choisissons un vecteur $u$ de norme $1$ (c'est ici que sert $E \neq \{0\}$), égal à $\dfrac{a - b}{\lVert a - b \rVert}$ si $a \neq b$. Pour $0 \leqslant t < r$, le point $a + tu$ est dans $B(a, r)$, donc dans $B(b, r')$ : $\lVert a - b \rVert + t = \lVert a + tu - b \rVert < r'$. En faisant tendre $t$ vers $r$ : 
    $$\boxed{\lVert a - b \rVert + r \leqslant r'}.$$

    **3.** Les mêmes arguments, avec $t \leqslant r$, donnent 
    $$B_{f}(a, r) \cap B_{f}(b, r') = \varnothing \iff \boxed{r + r' < \lVert a - b \rVert}, \qquad B_{f}(a, r) \subset B_{f}(b, r') \iff \boxed{\lVert a - b \rVert + r \leqslant r'}.$$
     L'inégalité est stricte dans la première équivalence : deux boules fermées tangentes se touchent.

    **4.** Si $B(a, r) = B(b, r')$, les deux inclusions donnent $\lVert a - b \rVert + r \leqslant r'$ et $\lVert a - b \rVert + r' \leqslant r$ ; en sommant, $\lVert a - b \rVert = 0$, puis $r = r'$. De même pour deux boules fermées. Enfin, une boule ouverte n'est jamais égale à une boule fermée : si $B(a, r) = B_{f}(b, r')$, le point $b + r'u$, avec $u$ unitaire choisi comme en 2, est dans $B_{f}(b, r')$ ; l'argument de la question 2 donne $\lVert a - b \rVert + r \leqslant r'$, et celui des boules fermées, appliqué à $B_{f}(b, r') \subset B(a, r)$, donne $\lVert a - b \rVert + r' < r$. C'est contradictoire. 
    $$\boxed{\text{Deux boules égales ont même centre, même rayon et même type.}}$$

    *Piège.* Dans $E = \{0\}$, toutes les boules sont égales à $\{0\}$, quels que soient leur rayon et leur type : l'hypothèse $E \neq \{0\}$ est indispensable. Et dans un espace métrique quelconque, l'énoncé est faux : dans $\mathbb{Z}$ muni de $|x - y|$, $B(0, 2) = B_{f}(0, 1)$.
- id: "l3-cd-01-10"
  feuille: "f-l3-cd-01"
  numero: 10
  partie: "Normes, boules, topologie"
