- id: "l3-cd-01-01"
  feuille: "f-l3-cd-01"
  numero: 1
  partie: "Normes, boules, topologie"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [normes et topologie]
  noeuds: [gd-normes, me-topologie]
  notions: [norme, boule-ouverte, produit-scalaire]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Montrer que $\lVert \cdot \rVert_{1}$, $\lVert \cdot \rVert_{2}$ et $\lVert \cdot \rVert_{\infty}$ sont des normes sur $\mathbb{K}^{n}$, et que, pour tout $x \in \mathbb{K}^{n}$, 
    $$\lVert x \rVert_{\infty} \leqslant \lVert x \rVert_{1} \leqslant \sqrt{n}\,\lVert x \rVert_{2} \leqslant n\lVert x \rVert_{\infty}.$$
     En déduire que $d(x, y) = |x - y|$ est une distance sur $\mathbb{R}$, et que $d_{\infty}(X, Y) = \displaystyle\max_{i}|x_{i} - y_{i}|$ et $d_{1}(X, Y) = \displaystyle\sum_{i}|x_{i} - y_{i}|$ sont des distances sur $\mathbb{R}^{n}$.

    **2.** Montrer que $\lVert f \rVert_{1} = \displaystyle\int_{a}^{b}|f(t)|\,\mathrm{d} t$, $\lVert f \rVert_{2} = \Big(\displaystyle\int_{a}^{b}|f(t)|^{2}\,\mathrm{d} t\Big)^{1/2}$ et $\lVert f \rVert_{\infty} = \displaystyle\sup_{t \in [a, b]}|f(t)|$ sont trois normes sur $\mathcal{C}([a, b], \mathbb{K})$.

    **3.** Soit $E$ un $\mathbb{R}$-espace vectoriel muni d'un produit scalaire $\langle \cdot, \cdot \rangle$. Montrer que $x \mapsto \sqrt{\langle x, x \rangle}$ est une norme sur $E$.
  corrige: |
    On vérifie les trois axiomes, l'inégalité triangulaire étant le seul point délicat.

    **1.** Séparation et homogénéité sont immédiates pour les trois expressions. Pour $\lVert \cdot \rVert_{1}$ et $\lVert \cdot \rVert_{\infty}$, l'inégalité triangulaire découle de $|x_{i} + y_{i}| \leqslant |x_{i}| + |y_{i}|$, en sommant ou en passant au maximum. Pour $\lVert \cdot \rVert_{2}$, l'inégalité de Cauchy-Schwarz (*Rappel.*) $\Big|\sum x_{i}\overline{y_{i}}\Big| \leqslant \lVert x \rVert_{2}\lVert y \rVert_{2}$ donne 
    $$\lVert x + y \rVert_{2}^{2} = \lVert x \rVert_{2}^{2} + 2\,\mathrm{Re}\sum_{i}x_{i}\overline{y_{i}} + \lVert y \rVert_{2}^{2} \leqslant \big(\lVert x \rVert_{2} + \lVert y \rVert_{2}\big)^{2}.$$
     Pour la chaîne d'inégalités, on écrit successivement : $\max|x_{i}| \leqslant \sum|x_{i}|$ ; Cauchy-Schwarz appliqué à $(|x_{i}|)$ et à $(1, \dots, 1)$ donne $\sum|x_{i}| \leqslant \sqrt{n}\Big(\sum|x_{i}|^{2}\Big)^{1/2}$ ; enfin $\sum|x_{i}|^{2} \leqslant n\max|x_{i}|^{2}$. D'où 
    $$\boxed{\lVert x \rVert_{\infty} \leqslant \lVert x \rVert_{1} \leqslant \sqrt{n}\,\lVert x \rVert_{2} \leqslant n\lVert x \rVert_{\infty}}.$$
     Les trois distances demandées sont $d(x, y) = N(x - y)$ pour $N = |\cdot|$ sur $\mathbb{R}$, $\lVert \cdot \rVert_{\infty}$ et $\lVert \cdot \rVert_{1}$ sur $\mathbb{R}^{n}$ : ce sont des distances par l'exercice 2.

    **2.** L'homogénéité et l'inégalité triangulaire se démontrent comme en dimension finie, avec des intégrales ou une borne supérieure ; pour $\lVert \cdot \rVert_{2}$, on utilise l'inégalité de Cauchy-Schwarz pour les intégrales. La séparation est le point nouveau : si $\int_{a}^{b}|f| = 0$ avec $|f|$ *continue* et positive, alors $f = 0$ (*Rappel.*) ; de même pour $|f|^{2}$. $\boxed{\text{Ce sont trois normes.}}$

    **3.** Séparation et homogénéité découlent de la définition du produit scalaire. Pour l'inégalité triangulaire, $\lVert x + y \rVert^{2} = \lVert x \rVert^{2} + 2\langle x, y \rangle + \lVert y \rVert^{2} \leqslant (\lVert x \rVert + \lVert y \rVert)^{2}$ par Cauchy-Schwarz.

    *Piège.* Sur $\mathcal{C}([a, b])$, la séparation de $\lVert \cdot \rVert_{1}$ repose sur la continuité : sur l'espace des fonctions continues par morceaux, $\lVert \cdot \rVert_{1}$ n'est qu'une semi-norme, puisqu'une fonction nulle sauf en un point a une intégrale nulle.
- id: "l3-cd-01-02"
  feuille: "f-l3-cd-01"
  numero: 2
  partie: "Normes, boules, topologie"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [normes et topologie]
  noeuds: [gd-normes, me-topologie]
  notions: [norme, boule-ouverte]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $E$ un $\mathbb{K}$-espace vectoriel.

    **1.** Montrer que, si $\lVert \cdot \rVert$ est une norme sur $E$, alors $d(x, y) = \lVert x - y \rVert$ est une distance sur $E$, *invariante par translation* ($d(x + z, y + z) = d(x, y)$ pour tous $x$, $y$, $z$) et *homogène* ($d(\lambda x, \lambda y) = |\lambda|\,d(x, y)$ pour tous $x$, $y$ et tout $\lambda \in \mathbb{K}$).

    **2.** Réciproquement, montrer que si $d$ est une distance sur $E$ invariante par translation et homogène, alors $x \mapsto d(0, x)$ est une norme sur $E$.
  corrige: |
    On traduit chaque axiome d'un objet dans le langage de l'autre.

    **1.** Symétrie : $d(y, x) = \lVert -(x - y) \rVert = \lVert x - y \rVert$. Séparation : celle de la norme. Inégalité triangulaire : $\lVert x - z \rVert \leqslant \lVert x - y \rVert + \lVert y - z \rVert$. Enfin $d(x + z, y + z) = \lVert x - y \rVert$ et $d(\lambda x, \lambda y) = \lVert \lambda(x - y) \rVert = |\lambda|d(x, y)$.

    **2.** Posons $N(x) = d(0, x)$. Séparation : $N(x) = 0 \Leftrightarrow x = 0$. Homogénéité : $N(\lambda x) = d(\lambda 0, \lambda x) = |\lambda|N(x)$. Inégalité triangulaire, en translatant par $-x$ : 
    $$N(x + y) = d(0, x + y) \leqslant d(0, x) + d(x, x + y) = N(x) + d(0, y) = N(x) + N(y).$$
     $\boxed{N \text{ est une norme}}$, et $d(x, y) = d(0, y - x) = N(y - x)$ : $d$ est la distance associée.

    *À retenir.* Une distance provient d'une norme exactement quand elle est invariante par translation et homogène. Une distance bornée, comme $\min(1, |x - y|)$ sur $\mathbb{R}$, n'est jamais homogène : elle ne provient d'aucune norme.
- id: "l3-cd-01-03"
  feuille: "f-l3-cd-01"
  numero: 3
  partie: "Normes, boules, topologie"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [normes et topologie]
  noeuds: [gd-normes, me-topologie]
  notions: [norme, boule-ouverte]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Une ville est quadrillée par une famille de rues rectilignes parallèles et une famille orthogonale d'avenues rectilignes parallèles. Dans un repère orthonormé dont les axes sont parallèles à ces deux directions, on veut aller à pied du point $(a, b)$ au point $(a', b')$ en ne circulant que dans les rues et les avenues.

    **1.** Montrer que la plus courte distance à parcourir est $|a - a'| + |b - b'|$.

    **2.** Montrer que $\lVert (x, y) \rVert_{1} = |x| + |y|$ est une norme sur $\mathbb{R}^{2}$ et dessiner sa boule unité.
  corrige: |
    Un trajet dans la ville est une ligne brisée formée de segments horizontaux et verticaux.

    **1.** Le long d'un tel trajet, l'abscisse ne varie que sur les segments horizontaux : leur longueur totale est au moins $|a - a'|$. De même, les segments verticaux ont une longueur totale au moins égale à $|b - b'|$. Le trajet en équerre $(a, b) \to (a', b) \to (a', b')$ réalise l'égalité : la distance est $\boxed{|a - a'| + |b - b'|}$.

    **2.** C'est la norme $\lVert \cdot \rVert_{1}$ de l'exercice 1, et la distance précédente est $\lVert (a, b) - (a', b') \rVert_{1}$. Sa boule unité fermée est le carré de sommets $(\pm 1, 0)$ et $(0, \pm 1)$, dont les côtés sont inclinés à $45^{\circ}$ : $\boxed{\text{un losange}}$.

    *Remarque.* Dans cette ville, il y a en général une infinité de plus courts chemins entre deux carrefours : la boule unité n'est pas strictement convexe, et cela se voit sur ses côtés plats.
- id: "l3-cd-01-04"
  feuille: "f-l3-cd-01"
  numero: 4
  partie: "Normes, boules, topologie"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [normes et topologie, normes équivalentes]
  noeuds: [gd-normes, me-topologie, gd-equivalence]
  notions: [norme, boule-ouverte, normes-equivalentes]
  page_enonce: 2
  page_corrige: 2
  enonce: |
    **1.** Décrire la boule de centre $0$ et de rayon $1$ de $\mathbb{R}$ muni de $d(x, y) = |x - y|$.

    **2.** Dessiner dans $\mathbb{R}^{2}$ les boules unités ouvertes pour $\lVert \cdot \rVert_{1}$, $\lVert \cdot \rVert_{2}$ et $\lVert \cdot \rVert_{\infty}$, puis les boules et les sphères de centre $(1, 2)$ et de rayon $2$ pour ces trois normes.

    **3.** Montrer directement, sans utiliser le théorème d'équivalence des normes, que ces trois normes sont équivalentes sur $\mathbb{R}^{2}$, avec les meilleures constantes possibles. Interpréter les constantes sur le dessin.
  corrige: |
    Les dessins se déduisent de la boule unité par translation et homothétie (exercice 8).

    **1.** $\{x \in \mathbb{R} \mid |x| < 1\} = \boxed{]-1, 1[}$ : la boule ouverte est un intervalle ouvert.

    **2.** La boule unité ouverte est l'intérieur d'un losange pour $\lVert \cdot \rVert_{1}$, d'un disque pour $\lVert \cdot \rVert_{2}$, d'un carré pour $\lVert \cdot \rVert_{\infty}$. Les boules de centre $(1, 2)$ et de rayon $2$ s'en déduisent : losange de sommets $(3, 2)$, $(1, 4)$, $(-1, 2)$, $(1, 0)$ ; disque de rayon $2$ ; carré $[-1, 3] \times [0, 4]$. Les sphères sont leurs bords.

    ![Figure](documents/figures/c6b51ca5a2d06673.svg)

    Les trois boules unités sont emboîtées : le losange dans le disque, le disque dans le carré ; le carré est contenu dans le disque de rayon $\sqrt{2}$, qui est contenu dans le losange de « rayon » $2$.

    **3.** Pour $x = (x_{1}, x_{2}) \in \mathbb{R}^{2}$, l'exercice 1 avec $n = 2$ et l'inégalité $\lVert x \rVert_{2} \leqslant \lVert x \rVert_{1}$ (développer $(|x_{1}| + |x_{2}|)^{2}$) donnent 
    $$\boxed{\lVert x \rVert_{\infty} \leqslant \lVert x \rVert_{2} \leqslant \lVert x \rVert_{1} \leqslant \sqrt{2}\,\lVert x \rVert_{2} \leqslant 2\lVert x \rVert_{\infty}}, \qquad \lVert x \rVert_{2} \leqslant \sqrt{2}\,\lVert x \rVert_{\infty}.$$
     Les constantes sont optimales : $x = (1, 0)$ réalise les égalités $\lVert x \rVert_{\infty} = \lVert x \rVert_{2} = \lVert x \rVert_{1}$, et $x = (1, 1)$ les égalités $\lVert x \rVert_{1} = \sqrt{2}\lVert x \rVert_{2} = 2\lVert x \rVert_{\infty}$. Sur le dessin, une inégalité $N \leqslant CN'$ signifie que la boule unité de $N'$ est contenue dans la boule de rayon $C$ de $N$, et l'optimalité qu'elles se touchent : aux points $(\pm 1, 0)$, $(0, \pm 1)$ pour la première série, aux sommets $(\pm 1, \pm 1)$ du carré pour la seconde.
- id: "l3-cd-01-05"
  feuille: "f-l3-cd-01"
  numero: 5
  partie: "Normes, boules, topologie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [normes et topologie, convexité]
  noeuds: [gd-normes, me-topologie]
  notions: [norme, boule-ouverte, partie-convexe, fonction-convexe]
  page_enonce: 2
  page_corrige: 2
  enonce: |
    Soit $E$ un $\mathbb{R}$-espace vectoriel et $N : E \to [0, +\infty[$ une application telle que $N(x) = 0 \Leftrightarrow x = 0$ et $N(\lambda x) = |\lambda|N(x)$ pour tous $x \in E$ et $\lambda \in \mathbb{R}$. Montrer que $N$ vérifie l'inégalité triangulaire si et seulement si la partie $\{x \in E \mid N(x) \leqslant 1\}$ est convexe.
  corrige: |
    On utilise la convexité dans un sens, l'homogénéité dans l'autre. Notons $B = \{x \mid N(x) \leqslant 1\}$.

    $\triangleright$ *L'inégalité triangulaire entraîne la convexité.* Si $N(x) \leqslant 1$, $N(y) \leqslant 1$ et $t \in [0, 1]$, alors $N(tx + (1 - t)y) \leqslant tN(x) + (1 - t)N(y) \leqslant 1$.

    $\triangleright$ *La convexité entraîne l'inégalité triangulaire.* Soit $x$, $y$ non nuls (sinon il n'y a rien à démontrer). Par homogénéité, $\dfrac{x}{N(x)}$ et $\dfrac{y}{N(y)}$ sont dans $B$, donc aussi la combinaison convexe 
    $$\frac{N(x)}{N(x) + N(y)}\,\frac{x}{N(x)} + \frac{N(y)}{N(x) + N(y)}\,\frac{y}{N(y)} = \frac{x + y}{N(x) + N(y)},$$
     c'est-à-dire, par homogénéité encore, 
    $$\boxed{N(x + y) \leqslant N(x) + N(y)}.$$

    *À retenir.* Une norme est déterminée par sa boule unité, et l'inégalité triangulaire est exactement la convexité de cette boule. C'est le fil des exercices 6 et 35.
- id: "l3-cd-01-06"
  feuille: "f-l3-cd-01"
  numero: 6
  partie: "Normes, boules, topologie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [normes et topologie, convexité]
  noeuds: [gd-normes, me-topologie]
  notions: [norme, boule-ouverte, partie-convexe, fonction-convexe]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    On étend la définition de $\lVert x \rVert_{p}$ à tout réel $p > 0$, pour $x \in \mathbb{R}^{n}$.

    **1.** Pour $n = 2$, dessiner $B^{p} = \{x \in \mathbb{R}^{2} \mid \lVert x \rVert_{p} \leqslant 1\}$ pour $p = \dfrac{1}{2}$, $1$, $\dfrac{3}{2}$, $2$, $3$ et $\infty$.

    **2.** Montrer que, si $p \leqslant q$, alors $B^{p} \subset B^{q}$.

    **3.** La partie $B^{1/2}$ de $\mathbb{R}^{2}$ est-elle convexe ? Montrer que $\lVert \cdot \rVert_{p}$ n'est pas une norme sur $\mathbb{R}^{n}$ lorsque $0 < p < 1$ et $n \geqslant 2$.

    **4.** On fixe $x \in \mathbb{R}^{n}$. Montrer que $\lVert x \rVert_{p}$ tend vers $\lVert x \rVert_{\infty}$ quand $p$ tend vers $+\infty$, ce qui justifie la notation.

    **5.** On suppose $p \geqslant 1$. Montrer que $t \mapsto t^{p}$ est convexe sur $[0, +\infty[$, puis que $x \mapsto \lVert x \rVert_{p}^{p}$ est convexe sur $\mathbb{R}^{n}$. En déduire que la boule $B^{p}$ est convexe, puis que $\lVert \cdot \rVert_{p}$ est une norme sur $\mathbb{R}^{n}$ (on pourra utiliser l'exercice 5).
  corrige: |
    La convexité de la boule, par l'exercice 5, est ici la clé.

    **1.** Pour $p \geqslant 1$, $B^{p}$ est convexe : losange ($p = 1$), disque ($p = 2$), carré ($p = \infty$), formes intermédiaires arrondies. Pour $p = \dfrac{1}{2}$, c'est une étoile à quatre branches, bordée par des arcs concaves.

    ![Figure](documents/figures/69d2d0b1677c749f.svg)

    Les ensembles $B^{p}$ grossissent avec $p$ : c'est la question 2. Celui de $p = \dfrac{1}{2}$, en bleu pétrole, n'est pas convexe.

    **2.** Si $\lVert x \rVert_{p} \leqslant 1$, chaque $|x_{i}|$ est au plus $1$, donc $|x_{i}|^{q} \leqslant |x_{i}|^{p}$ pour $q \geqslant p$, et $\sum|x_{i}|^{q} \leqslant \sum|x_{i}|^{p} \leqslant 1$ : $\boxed{B^{p} \subset B^{q}}$.

    **3.** Les points $(1, 0)$ et $(0, 1)$ sont dans $B^{1/2}$, mais pas leur milieu : $\Big\|\Big(\frac{1}{2}, \frac{1}{2}\Big)\Big\|_{1/2} = \Big(2\sqrt{\tfrac{1}{2}}\Big)^{2} = 2 > 1$. 
    $$\boxed{B^{1/2} \text{ n'est pas convexe.}}$$
     Plus généralement, pour $0 < p < 1$, $\lVert e_{1} + e_{2} \rVert_{p} = 2^{1/p} > 2 = \lVert e_{1} \rVert_{p} + \lVert e_{2} \rVert_{p}$ : l'inégalité triangulaire est fausse.

    **4.** On a $\lVert x \rVert_{\infty}^{p} \leqslant \sum|x_{i}|^{p} \leqslant n\lVert x \rVert_{\infty}^{p}$, donc $\lVert x \rVert_{\infty} \leqslant \lVert x \rVert_{p} \leqslant n^{1/p}\lVert x \rVert_{\infty}$. Comme $n^{1/p} \to 1$, 
    $$\boxed{\lVert x \rVert_{p} \xrightarrow[p \to +\infty]{} \lVert x \rVert_{\infty}}.$$

    **5.** La fonction $t \mapsto t^{p}$ est convexe sur $[0, +\infty[$, de dérivée seconde $p(p - 1)t^{p - 2} \geqslant 0$ sur $]0, +\infty[$ et continue en $0$. Elle est aussi croissante ; composée avec la fonction convexe $u \mapsto |u|$, elle donne une fonction convexe $u \mapsto |u|^{p}$, et la somme $g(x) = \sum|x_{i}|^{p}$ est convexe. Alors $B^{p} = \{g \leqslant 1\}$ est convexe, et l'exercice 5 conclut : 
    $$\boxed{\lVert \cdot \rVert_{p} \text{ est une norme pour } p \geqslant 1}.$$
- id: "l3-cd-01-07"
  feuille: "f-l3-cd-01"
  numero: 7
  partie: "Normes, boules, topologie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [normes et topologie]
  noeuds: [gd-normes, me-topologie]
  notions: [norme, boule-ouverte]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $p > 1$ et $q$ le réel tel que $\dfrac{1}{p} + \dfrac{1}{q} = 1$.

    **1.** Montrer que, pour tous réels $a$ et $b$, $|ab| \leqslant \dfrac{|a|^{p}}{p} + \dfrac{|b|^{q}}{q}$ (inégalité de Young).

    **2.** En déduire que, pour tous réels $a_{1}, \dots, a_{n}$, $b_{1}, \dots, b_{n}$, 
    $$\Big|\sum_{i = 1}^{n}a_{i}b_{i}\Big| \leqslant \Big(\sum_{i = 1}^{n}|a_{i}|^{p}\Big)^{1/p}\Big(\sum_{i = 1}^{n}|b_{i}|^{q}\Big)^{1/q}$$
     (inégalité de Hölder). Quel cas particulier obtient-on pour $p = 2$ ?

    **3.** Démontrer à nouveau, à l'aide de l'inégalité de Hölder, que $\lVert \cdot \rVert_{p}$ vérifie l'inégalité triangulaire.
  corrige: |
    L'inégalité de Young vient de la concavité du logarithme ; Hölder s'en déduit par normalisation.

    **1.** Si $a$ ou $b$ est nul, c'est clair. Sinon, la concavité du logarithme, avec les poids $\dfrac{1}{p}$ et $\dfrac{1}{q}$ de somme $1$, donne 
    $$\ln\Big(\frac{|a|^{p}}{p} + \frac{|b|^{q}}{q}\Big) \geqslant \frac{1}{p}\ln|a|^{p} + \frac{1}{q}\ln|b|^{q} = \ln|ab|,$$
     d'où 
    $$\boxed{|ab| \leqslant \frac{|a|^{p}}{p} + \frac{|b|^{q}}{q}}.$$

    **2.** Notons $A = \Big(\sum|a_{i}|^{p}\Big)^{1/p}$ et $B = \Big(\sum|b_{i}|^{q}\Big)^{1/q}$, supposés non nuls. Young appliqué à $\dfrac{a_{i}}{A}$ et $\dfrac{b_{i}}{B}$, puis sommé, donne 
    $$\frac{1}{AB}\sum|a_{i}b_{i}| \leqslant \frac{1}{p}\sum\frac{|a_{i}|^{p}}{A^{p}} + \frac{1}{q}\sum\frac{|b_{i}|^{q}}{B^{q}} = \frac{1}{p} + \frac{1}{q} = 1,$$
     d'où 
    $$\boxed{\Big|\sum a_{i}b_{i}\Big| \leqslant AB}.$$
     Pour $p = q = 2$, c'est l'inégalité de Cauchy-Schwarz.

    **3.** Pour $a$, $b \in \mathbb{R}^{n}$, on écrit $|a_{i} + b_{i}|^{p} \leqslant |a_{i}|\,|a_{i} + b_{i}|^{p - 1} + |b_{i}|\,|a_{i} + b_{i}|^{p - 1}$, et l'on applique Hölder à chaque somme, avec $(p - 1)q = p$ : 
    $$\lVert a + b \rVert_{p}^{p} \leqslant \big(\lVert a \rVert_{p} + \lVert b \rVert_{p}\big)\Big(\sum|a_{i} + b_{i}|^{p}\Big)^{1/q} = \big(\lVert a \rVert_{p} + \lVert b \rVert_{p}\big)\lVert a + b \rVert_{p}^{p/q}.$$
     En divisant par $\lVert a + b \rVert_{p}^{p/q}$ (s'il est non nul), avec $p - \dfrac{p}{q} = 1$ : 
    $$\boxed{\lVert a + b \rVert_{p} \leqslant \lVert a \rVert_{p} + \lVert b \rVert_{p}}$$
     (inégalité de Minkowski).
- id: "l3-cd-01-08"
  feuille: "f-l3-cd-01"
  numero: 8
  partie: "Normes, boules, topologie"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [normes et topologie, convexité]
  noeuds: [gd-normes, me-topologie]
  notions: [norme, boule-ouverte, partie-convexe, fonction-convexe]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $(E, \lVert \cdot \rVert)$ un espace normé, $a$, $b \in E$, $\lambda \in \mathbb{K}$ et $r > 0$.

    **1.** Montrer que $B(a, r)$ et $B_{f}(a, r)$ sont convexes. La sphère $S(a, r)$ est-elle convexe ?

    **2.** On pose $L_{b, \lambda}(x) = b + \lambda x$, avec $\lambda \neq 0$. Montrer que 
    $$L_{b, \lambda}\big(B(a, r)\big) = B\big(L_{b, \lambda}(a), |\lambda|r\big) \qquad\text{et}\qquad L_{b, \lambda}\big(B_{f}(a, r)\big) = B_{f}\big(L_{b, \lambda}(a), |\lambda|r\big).$$
  corrige: |
    Tout se ramène à l'inégalité triangulaire et à l'homogénéité.

    **1.** Si $x$, $y \in B(a, r)$ et $t \in [0, 1]$, alors 
    $$\lVert tx + (1 - t)y - a \rVert = \lVert t(x - a) + (1 - t)(y - a) \rVert \leqslant t\lVert x - a \rVert + (1 - t)\lVert y - a \rVert < r,$$
     et de même avec des inégalités larges pour $B_{f}(a, r)$ : 
    $$\boxed{\text{les boules sont convexes}}.$$
     La sphère ne l'est pas dès que $E \neq \{0\}$ : pour $u$ de norme $r$, les points $a \pm u$ sont sur $S(a, r)$, et leur milieu $a$ n'y est pas.

    **2.** Pour tout $x$, $\lVert L_{b, \lambda}(x) - L_{b, \lambda}(a) \rVert = |\lambda|\,\lVert x - a \rVert$. Ainsi $x \in B(a, r)$ si et seulement si $L_{b, \lambda}(x) \in B(L_{b, \lambda}(a), |\lambda|r)$ ; comme $L_{b, \lambda}$ est une bijection de $E$ (de réciproque $y \mapsto \lambda^{-1}(y - b)$), 
    $$\boxed{L_{b, \lambda}(B(a, r)) = B(L_{b, \lambda}(a), |\lambda|r)}.$$
     Même raisonnement pour les boules fermées.

    *Piège.* Pour $\lambda = 0$, l'image d'une boule est le point $\{b\}$, qui n'est pas une boule de rayon $0$ au sens de la définition, où le rayon est strictement positif.
