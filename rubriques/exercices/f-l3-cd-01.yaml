  page_corrige: 11
  enonce: |
    Soit $E = \mathcal{C}([0, 1], \mathbb{R})$ muni de la norme $\lVert \cdot \rVert_{1}$, et $c \in [0, 1]$. On considère $T : E \to \mathbb{R}$, $T(f) = f(c)$.

    **1.** Montrer que $T$ est linéaire mais n'est pas continue.

    **2.** Que peut-on en déduire pour le sous-espace des fonctions de $E$ nulles en $c$ ?

    **3.** $T$ devient-elle continue si $E$ est muni de la norme $\lVert \cdot \rVert_{\infty}$ ?
  corrige: |
    Une forme linéaire est continue si et seulement si elle est bornée sur la boule unité (cours, prop. 14) : on cherche des fonctions de petite norme et de grande valeur en $c$.

    **1.** La linéarité est claire. Soit $h_{n}$ la fonction « triangle » égale à $1$ en $c$, nulle hors de $\Big[c - \dfrac{1}{n}, c + \dfrac{1}{n}\Big]$, affine entre ; on a $\lVert h_{n} \rVert_{1} \leqslant \dfrac{1}{n}$ et $T(h_{n}) = 1$. Alors $\dfrac{|T(h_{n})|}{\lVert h_{n} \rVert_{1}} \geqslant n$ n'est pas borné : $\boxed{T \text{ n'est pas continue}}$ (en particulier pas en $0$, puisque $h_{n} \to 0$ et $T(h_{n}) \not\to 0$).

    **2.** Soit $H = \{f \mid f(c) = 0\}$ et $g \in E$. Les fonctions $g - g(c)h_{n}$ sont dans $H$ et tendent vers $g$ pour $\lVert \cdot \rVert_{1}$ : $\boxed{H \text{ est dense dans } E}$, et en particulier n'est pas fermé.

    **3.** Pour $\lVert \cdot \rVert_{\infty}$, $|f(c)| \leqslant \lVert f \rVert_{\infty}$, avec égalité pour $f = 1$ : 
    $$\boxed{T \text{ est continue, de norme } 1}.$$

    *À retenir.* La continuité d'une application linéaire dépend des normes choisies. On montre en général qu'une forme linéaire est continue si et seulement si son noyau est fermé, et qu'un hyperplan non fermé est dense : c'est ce qu'on observe ici.
- id: "l3-cd-01-26"
  feuille: "f-l3-cd-01"
  numero: 26
  partie: "Applications linéaires continues"
  etoiles: 2
  types: [Calcul]
  mots_cles: [applications linéaires continues]
  noeuds: [f-operateurs]
  notions: [norme-subordonnee]
  page_enonce: 6
  page_corrige: 11
  enonce: |
    Soit $E = \mathcal{C}([0, \pi], \mathbb{R})$ muni de la norme $\lVert \cdot \rVert_{\infty}$.

    **1.** Montrer que $T(f) = \displaystyle\int_{0}^{\pi}f(x)\,\mathrm{d} x$ définit une forme linéaire continue sur $E$ et calculer sa norme.

    **2.** Soit $g \in E$. Calculer la norme de l'opérateur $f \mapsto fg$ de $E$ dans $E$.

    **3.** Soit $g \in E$ qui ne s'annule qu'en $\dfrac{\pi}{2}$. Calculer la norme de la forme linéaire $u(f) = \displaystyle\int_{0}^{\pi}f(x)g(x)\,\mathrm{d} x$.
  corrige: |
    On majore, puis l'on cherche des fonctions qui réalisent l'égalité, au besoin à la limite.

    **1.** $|T(f)| \leqslant \int_{0}^{\pi}|f| \leqslant \pi\lVert f \rVert_{\infty}$, et $T(1) = \pi$ : 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|T|\mkern-1.5mu|\mkern-1.5mu| = \pi}.$$

    **2.** $\lVert fg \rVert_{\infty} \leqslant \lVert g \rVert_{\infty}\lVert f \rVert_{\infty}$, et $f = 1$ donne l'égalité : 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|f \mapsto fg|\mkern-1.5mu|\mkern-1.5mu| = \lVert g \rVert_{\infty}}.$$

    **3.** On a $|u(f)| \leqslant \Big(\int_{0}^{\pi}|g|\Big)\lVert f \rVert_{\infty}$. La fonction $g$, continue et ne s'annulant qu'en $\dfrac{\pi}{2}$, garde un signe constant $\sigma_{1}$ sur $\Big[0, \dfrac{\pi}{2}\Big[$ et un signe constant $\sigma_{2}$ sur $\Big]\dfrac{\pi}{2}, \pi\Big]$ (théorème des valeurs intermédiaires). Soit $f_{n}$ égale à $\sigma_{1}$ sur $\Big[0, \dfrac{\pi}{2} - \dfrac{1}{n}\Big]$, à $\sigma_{2}$ sur $\Big[\dfrac{\pi}{2} + \dfrac{1}{n}, \pi\Big]$, affine entre : $\lVert f_{n} \rVert_{\infty} = 1$, et $f_{n}g = |g|$ hors d'un intervalle de longueur $\dfrac{2}{n}$, où $|f_{n}g - |g|| \leqslant 2\lVert g \rVert_{\infty}$. Donc $u(f_{n}) \geqslant \int_{0}^{\pi}|g| - \dfrac{4}{n}\lVert g \rVert_{\infty}$, et 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|u|\mkern-1.5mu|\mkern-1.5mu| = \int_{0}^{\pi}|g(x)|\,\mathrm{d} x}.$$

    *Piège.* On serait tenté d'écrire $|u(f)| \leqslant \lVert g \rVert_{\infty}\int|f| \leqslant \pi\lVert g \rVert_{\infty}\lVert f \rVert_{\infty}$ : c'est vrai mais pas optimal, et la norme n'est pas $\lVert g \rVert_{\infty}$, erreur fréquente. Lorsque $g$ change de signe en $\dfrac{\pi}{2}$, la norme n'est pas atteinte : il faudrait $f = \mathrm{sgn}(g)$, qui n'est pas continue.
- id: "l3-cd-01-27"
  feuille: "f-l3-cd-01"
  numero: 27
  partie: "Applications linéaires continues"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [applications linéaires continues]
  noeuds: [f-operateurs]
  notions: [norme-subordonnee]
  page_enonce: 6
  page_corrige: 11
  enonce: |
    Calculer la norme des opérateurs suivants.

    **1.** Le décalage $S : \ell^{\infty} \to \ell^{\infty}$ défini par $S(x)_{0} = 0$ et $S(x)_{n + 1} = x_{n}$.

    **2.** La forme linéaire $u : \ell^{2} \to \mathbb{R}$, $u(x) = \displaystyle\sum_{n = 0}^{+\infty}a_{n}x_{n}$, où $a = (a_{n})$ est un élément fixé de $\ell^{2}$ (on justifiera la convergence de la série).

    **3.** La forme linéaire $u(x) = \displaystyle\lim_{j \to +\infty}x_{j}$ sur l'espace des suites réelles convergentes, muni de $\lVert \cdot \rVert_{\infty}$.
  corrige: |
    Même démarche : majoration, puis vecteur extrémal.

    **1.** $\lVert S(x) \rVert_{\infty} = \max\big(0, \sup_{n}|x_{n}|\big) = \lVert x \rVert_{\infty}$ : $S$ est une isométrie, 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|S|\mkern-1.5mu|\mkern-1.5mu| = 1}.$$

    **2.** Par Cauchy-Schwarz sur les sommes partielles, $\sum_{n = 0}^{N}|a_{n}x_{n}| \leqslant \lVert a \rVert_{2}\lVert x \rVert_{2}$ : la série converge absolument, et $|u(x)| \leqslant \lVert a \rVert_{2}\lVert x \rVert_{2}$, avec égalité pour $x = a$ : 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|u|\mkern-1.5mu|\mkern-1.5mu| = \lVert a \rVert_{2}}.$$

    **3.** $|x_{j}| \leqslant \lVert x \rVert_{\infty}$ pour tout $j$, donc $|\lim x_{j}| \leqslant \lVert x \rVert_{\infty}$, avec égalité pour la suite constante égale à $1$ : 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|u|\mkern-1.5mu|\mkern-1.5mu| = 1}.$$
- id: "l3-cd-01-28"
  feuille: "f-l3-cd-01"
  numero: 28
  partie: "Applications linéaires continues"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [applications linéaires continues]
  noeuds: [f-operateurs]
  notions: [norme-subordonnee]
  page_enonce: 7
  page_corrige: 12
  enonce: |
    On note $E = \mathcal{C}([0, 1], \mathbb{R})$.

    **1.** On munit $E$ de la norme $\lVert \cdot \rVert_{1}$. Soit $P : E \to E$ qui, à $f$, associe sa primitive nulle en $0$. Montrer que $P$ est un endomorphisme continu de $E$ et calculer sa norme.

    **2.** On munit $E$ de la norme $\lVert \cdot \rVert_{\infty}$. Soit $K : [0, 1]^{2} \to \mathbb{R}$ continue. Montrer que $\varphi_{K}(f)(t) = \displaystyle\int_{0}^{1}K(t, x)f(x)\,\mathrm{d} x$ définit une application linéaire continue $\varphi_{K} : E \to E$.
  corrige: |
    Pour $P$, on intervertit l'ordre d'intégration ; pour $\varphi_{K}$, l'uniforme continuité de $K$ (théorème de Heine) donne la continuité de $\varphi_{K}(f)$.

    **1.** $P(f)$ est de classe $\mathcal{C}^{1}$, donc dans $E$, et $P$ est linéaire. Pour $f \in E$, 
    $$\lVert P(f) \rVert_{1} = \int_{0}^{1}\Big|\int_{0}^{x}f(t)\,\mathrm{d} t\Big|\,\mathrm{d} x \leqslant \int_{0}^{1}\int_{0}^{x}|f(t)|\,\mathrm{d} t\,\mathrm{d} x = \int_{0}^{1}(1 - t)|f(t)|\,\mathrm{d} t \leqslant \lVert f \rVert_{1}.$$
     Pour $f_{n} \geqslant 0$ d'intégrale $1$ et nulle hors de $\Big[0, \dfrac{1}{n}\Big]$ (un triangle de hauteur $2n$), $\lVert P(f_{n}) \rVert_{1} = \int_{0}^{1}(1 - t)f_{n}(t)\,\mathrm{d} t \geqslant 1 - \dfrac{1}{n}$. 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|P|\mkern-1.5mu|\mkern-1.5mu| = 1},$$
     et la norme n'est pas atteinte : l'égalité $\int(1 - t)|f| = \int|f|$ imposerait $t|f(t)| = 0$, donc $f = 0$.

    **2.** La linéarité est claire. $K$ est continue sur le compact $[0, 1]^{2}$, donc uniformément continue (cours, th. 4) : pour $\varepsilon > 0$, il existe $\delta$ tel que $|t - s| < \delta$ entraîne $|K(t, x) - K(s, x)| < \varepsilon$ pour tout $x$, d'où $|\varphi_{K}(f)(t) - \varphi_{K}(f)(s)| \leqslant \varepsilon\lVert f \rVert_{\infty}$ : $\varphi_{K}(f) \in E$. Enfin $\lVert \varphi_{K}(f) \rVert_{\infty} \leqslant \lVert K \rVert_{\infty}\lVert f \rVert_{\infty}$ : 
    $$\boxed{\varphi_{K} \text{ est linéaire continue, de norme au plus } \sup|K|}.$$
- id: "l3-cd-01-29"
  feuille: "f-l3-cd-01"
  numero: 29
  partie: "Applications linéaires continues"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [applications linéaires continues]
  noeuds: [f-operateurs]
  notions: [norme-subordonnee]
  page_enonce: 7
  page_corrige: 12
  enonce: |
    On munit $\mathbb{C}[X]$ de la norme $\Big\|\displaystyle\sum_{i = 0}^{d}a_{i}X^{i}\Big\|_{\infty} = \max_{0 \leqslant i \leqslant d}|a_{i}|$.

    **1.** Soit $\alpha \in \mathbb{C}$ tel que $|\alpha| < 1$. Montrer que $L_{\alpha} : P \mapsto P(\alpha)$ est une forme linéaire continue sur $\mathbb{C}[X]$, de norme $\dfrac{1}{1 - |\alpha|}$.

    **2.** Que se passe-t-il si $|\alpha| \geqslant 1$ ?

    **3.** Montrer que la dérivation $P \mapsto P'$ est continue de $\mathbb{C}_{n}[X]$ dans lui-même et calculer sa norme. La dérivation est-elle continue sur $\mathbb{C}[X]$ ?
  corrige: |
    On majore $|P(\alpha)|$ à l'aide d'une série géométrique, puis l'on choisit des coefficients de module $1$ alignés sur les puissances de $\alpha$.

    **1.** Pour $P = \sum a_{i}X^{i}$, $|P(\alpha)| \leqslant \lVert P \rVert_{\infty}\sum_{i \geqslant 0}|\alpha|^{i} = \dfrac{\lVert P \rVert_{\infty}}{1 - |\alpha|}$. Si $\alpha \neq 0$, soit $\omega = \dfrac{\overline{\alpha}}{|\alpha|}$ et $P_{d} = \sum_{i = 0}^{d}\omega^{i}X^{i}$ : $\lVert P_{d} \rVert_{\infty} = 1$ et $P_{d}(\alpha) = \sum_{i = 0}^{d}|\alpha|^{i} \to \dfrac{1}{1 - |\alpha|}$. Si $\alpha = 0$, $P = 1$ convient. 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|L_{\alpha}|\mkern-1.5mu|\mkern-1.5mu| = \frac{1}{1 - |\alpha|}};$$
     pour $\alpha \neq 0$, elle n'est pas atteinte, car un polynôme n'a qu'un nombre fini de coefficients.

    **2.** Pour $|\alpha| \geqslant 1$, les mêmes $P_{d}$ donnent $|P_{d}(\alpha)| = \sum_{i = 0}^{d}|\alpha|^{i} \geqslant d + 1$ : $L_{\alpha}$ n'est pas bornée sur la boule unité, 
    $$\boxed{L_{\alpha} \text{ n'est pas continue}}.$$

    **3.** $P' = \sum_{i \geqslant 1}ia_{i}X^{i - 1}$, donc $\lVert P' \rVert_{\infty} = \max_{i}i|a_{i}| \leqslant n\lVert P \rVert_{\infty}$ sur $\mathbb{C}_{n}[X]$, avec égalité pour $X^{n}$ : 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|\mathrm{Der}_{n}|\mkern-1.5mu|\mkern-1.5mu| = n}$$
     (pour $n \geqslant 1$). Sur $\mathbb{C}[X]$, on a $\lVert X^{n} \rVert_{\infty} = 1$ et $\lVert (X^{n})' \rVert_{\infty} = n$ pour tout $n$ : 
    $$\boxed{\text{la dérivation n'est pas continue sur } \mathbb{C}[X]}.$$

    *À retenir.* En dimension finie, toute application linéaire est continue (cours, th. 5) ; la dérivation, continue sur chaque $\mathbb{C}_{n}[X]$, cesse de l'être sur leur réunion, faute de borne uniforme en $n$.
- id: "l3-cd-01-30"
  feuille: "f-l3-cd-01"
  numero: 30
  partie: "Applications linéaires continues"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [applications linéaires continues]
  noeuds: [f-operateurs]
  notions: [norme-subordonnee]
  page_enonce: 7
  page_corrige: 12
  enonce: |
    Soit $E$ et $F$ deux espaces normés réels et $f : E \to F$ une application bornée sur la boule unité de $E$ et telle que $f(x + y) = f(x) + f(y)$ pour tous $x$, $y \in E$.

    **1.** Montrer que $f(rx) = rf(x)$ pour tout $x \in E$ et tout rationnel $r$.

    **2.** Montrer que $f$ est continue en $0$, puis sur $E$.

    **3.** En déduire que $f$ est linéaire et continue.
  corrige: |
    On obtient la $\mathbb{Q}$-linéarité par l'algèbre, la continuité par la borne, puis la $\mathbb{R}$-linéarité par densité de $\mathbb{Q}$ dans $\mathbb{R}$.

    **1.** $f(0) = f(0 + 0) = 2f(0)$ donne $f(0) = 0$, puis $f(-x) = -f(x)$. Par récurrence, $f(kx) = kf(x)$ pour $k \in \mathbb{N}$, donc pour $k \in \mathbb{Z}$. Pour $r = \dfrac{k}{m}$, $m \geqslant 1$ : $mf(rx) = f(mrx) = f(kx) = kf(x)$, d'où 
    $$\boxed{f(rx) = rf(x) \text{ pour } r \in \mathbb{Q}}.$$

    **2.** Soit $M$ un majorant de $\lVert f \rVert$ sur la boule unité, et $m \in \mathbb{N}^{*}$. Si $\lVert x \rVert < \dfrac{1}{m}$, alors $\lVert mx \rVert < 1$ et $\lVert f(x) \rVert = \dfrac{1}{m}\lVert f(mx) \rVert \leqslant \dfrac{M}{m}$ : $\boxed{f \text{ est continue en } 0}$. Comme $f(x + h) - f(x) = f(h)$, elle est continue en tout point.

    **3.** Soit $\lambda \in \mathbb{R}$ et $(r_{n})$ une suite de rationnels de limite $\lambda$. Alors $f(r_{n}x) = r_{n}f(x) \to \lambda f(x)$, et $f(r_{n}x) \to f(\lambda x)$ par continuité. Ainsi $f(\lambda x) = \lambda f(x)$ : 
    $$\boxed{f \text{ est linéaire et continue}}.$$

    *Remarque.* Sans l'hypothèse de borne, on construit, à l'aide d'une base de $\mathbb{R}$ comme $\mathbb{Q}$-espace vectoriel (et de l'axiome du choix), des applications additives de $\mathbb{R}$ dans $\mathbb{R}$ qui ne sont pas linéaires.
- id: "l3-cd-01-31"
  feuille: "f-l3-cd-01"
  numero: 31
  partie: "Normes matricielles"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [normes matricielles]
  noeuds: [f-operateurs]
  notions: [norme-subordonnee]
  page_enonce: 7
  page_corrige: 13
  enonce: |
    Soit $u$ un endomorphisme de $\mathbb{R}^{n}$, de matrice $A = (a_{ij})$ dans la base canonique.

    **1.** On munit $\mathbb{R}^{n}$ de $\lVert \cdot \rVert_{\infty}$. L'application $u$ est-elle continue ? Montrer que $|\mkern-1.5mu|\mkern-1.5mu|u|\mkern-1.5mu|\mkern-1.5mu|_{\infty} = \displaystyle\max_{1 \leqslant i \leqslant n}\sum_{j = 1}^{n}|a_{ij}|$.

    **2.** Même question lorsque $\mathbb{R}^{n}$ est muni de $\lVert \cdot \rVert_{1}$ au départ et à l'arrivée.

    **3.** Montrer directement que $A \mapsto |\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|_{\infty} = \displaystyle\sup_{\lVert x \rVert_{\infty} \leqslant 1}\lVert Ax \rVert_{\infty}$ est une norme sur $\mathcal{M}_{n}(\mathbb{R})$.
  corrige: |
    Majoration ligne par ligne ou colonne par colonne, puis choix d'un vecteur extrémal.

    **1.** $u$ est continue, comme toute application linéaire en dimension finie. Pour $\lVert x \rVert_{\infty} \leqslant 1$, $|(Ax)_{i}| \leqslant \sum_{j}|a_{ij}|$, d'où $\lVert Ax \rVert_{\infty} \leqslant \max_{i}\sum_{j}|a_{ij}|$. Si le maximum est atteint pour la ligne $i_{0}$, le vecteur $x_{j} = \mathrm{sgn}(a_{i_{0}j})$, de norme $1$, donne $(Ax)_{i_{0}} = \sum_{j}|a_{i_{0}j}|$. 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|u|\mkern-1.5mu|\mkern-1.5mu|_{\infty} = \max_{i}\sum_{j}|a_{ij}|}$$
     (somme maximale des lignes).

    **2.** $\lVert Ax \rVert_{1} \leqslant \sum_{i}\sum_{j}|a_{ij}|\,|x_{j}| = \sum_{j}|x_{j}|\sum_{i}|a_{ij}| \leqslant \Big(\max_{j}\sum_{i}|a_{ij}|\Big)\lVert x \rVert_{1}$, avec égalité pour $x = e_{j_{0}}$, où la colonne $j_{0}$ réalise le maximum. 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|u|\mkern-1.5mu|\mkern-1.5mu|_{1} = \max_{j}\sum_{i}|a_{ij}|}$$
     (somme maximale des colonnes).

    **3.** La borne supérieure est finie par la question 1. Homogénéité et inégalité triangulaire passent à la borne supérieure ; si $|\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|_{\infty} = 0$, alors $Ax = 0$ pour tout $x$ de la boule unité, donc pour tout $x$, et $A = 0$. 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|\cdot|\mkern-1.5mu|\mkern-1.5mu|_{\infty} \text{ est une norme sur } \mathcal{M}_{n}(\mathbb{R}).}$$

    *Moyen mnémotechnique.* L'indice $\infty$ « regarde » les lignes, l'indice $1$ les colonnes : $|\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|_{1} = |\mkern-1.5mu|\mkern-1.5mu|{}^{t}A|\mkern-1.5mu|\mkern-1.5mu|_{\infty}$.
- id: "l3-cd-01-32"
  feuille: "f-l3-cd-01"
  numero: 32
  partie: "Normes matricielles"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [normes matricielles]
  noeuds: [f-operateurs]
  notions: [norme-subordonnee, valeur-propre]
  page_enonce: 7
  page_corrige: 13
  enonce: |
    On munit $\mathbb{R}^{n}$ de la norme $\lVert \cdot \rVert_{2}$ au départ et à l'arrivée.

    **1.** Montrer que, pour $u \in \mathcal{L}(\mathbb{R}^{n})$, $|\mkern-1.5mu|\mkern-1.5mu|u|\mkern-1.5mu|\mkern-1.5mu|_{2}^{2}$ est la plus grande valeur propre de ${}^{t}u \circ u$.

    **2.** Pour $n = 2$, calculer la norme des matrices 
    $$A = \begin{pmatrix} 5 & 0 \\ 0 & 0 \end{pmatrix}, \qquad B = \begin{pmatrix} 1 & 0 \\ 0 & -2 \end{pmatrix}, \qquad C = \begin{pmatrix} 1 & 1 \\ 1 & 1 \end{pmatrix}.$$
  corrige: |
    On diagonalise la matrice symétrique positive ${}^{t}AA$ en base orthonormée.

    **1.** Soit $A$ la matrice de $u$ et $S = {}^{t}AA$, symétrique réelle, de valeurs propres $\lambda_{1} \geqslant \dots \geqslant \lambda_{n} \geqslant 0$ dans une base orthonormée $(v_{k})$ (*Rappel.*). Pour $x = \sum c_{k}v_{k}$, 
    $$\lVert Ax \rVert_{2}^{2} = {}^{t}xSx = \sum_{k}\lambda_{k}c_{k}^{2} \leqslant \lambda_{1}\lVert x \rVert_{2}^{2},$$
     avec égalité pour $x = v_{1}$. 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|u|\mkern-1.5mu|\mkern-1.5mu|_{2}^{2} = \lambda_{1} = \rho({}^{t}AA)},$$
     ce qui est la proposition 17 du cours.

    **2.** On calcule ${}^{t}AA = \mathrm{diag}(25, 0)$ et ${}^{t}BB = \mathrm{diag}(1, 4)$, puis 
    $${}^{t}CC = \begin{pmatrix} 2 & 2 \\ 2 & 2 \end{pmatrix}, \text{ de valeurs propres } 4 \text{ et } 0.$$
     D'où 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|_{2} = 5, \quad |\mkern-1.5mu|\mkern-1.5mu|B|\mkern-1.5mu|\mkern-1.5mu|_{2} = 2, \quad |\mkern-1.5mu|\mkern-1.5mu|C|\mkern-1.5mu|\mkern-1.5mu|_{2} = 2},$$
     ce que confirme le calcul numérique.

    *Piège.* La norme n'est pas la plus grande valeur propre de $A$ en général : pour $C$, symétrique, elle l'est ($2$) ; mais pour $\begin{pmatrix} 1 & 2 \\ -1 & 1 \end{pmatrix}$, dont les valeurs propres sont $1 \pm \mathrm{i}\sqrt{2}$, de module $\sqrt{3} \approx 1{,}73$, la norme vaut $\approx 2{,}30$.
- id: "l3-cd-01-33"
  feuille: "f-l3-cd-01"
  numero: 33
  partie: "Normes matricielles"
  etoiles: 2
  types: [Calcul]
  mots_cles: [normes matricielles]
  noeuds: [f-operateurs]
  notions: [norme-subordonnee]
  page_enonce: 8
  page_corrige: 13
  enonce: |
    Soit $\lVert \cdot \rVert_{\alpha}$ et $\lVert \cdot \rVert_{\beta}$ deux normes sur $\mathbb{R}^{2}$, et $M = \begin{pmatrix} a & b \\ c & d \end{pmatrix} \in \mathcal{M}_{2}(\mathbb{R})$. On note $\lVert M \rVert = \displaystyle\sup_{\lVert X \rVert_{\alpha} = 1}\lVert MX \rVert_{\beta}$.

    **1.** Calculer $\lVert M \rVert$ lorsque $\lVert \cdot \rVert_{\alpha} = \lVert \cdot \rVert_{\beta} = \lVert \cdot \rVert_{\infty}$, puis lorsque $\lVert \cdot \rVert_{\alpha} = \lVert \cdot \rVert_{\beta} = \lVert \cdot \rVert_{2}$.

    **2.** Calculer $\lVert M \rVert$ lorsque $\lVert \cdot \rVert_{\alpha} = \lVert \cdot \rVert_{2}$ et $\lVert \cdot \rVert_{\beta} = \lVert \cdot \rVert_{\infty}$.

    **3.** Dans le cas $\lVert \cdot \rVert_{\alpha} = \lVert \cdot \rVert_{\infty}$, $\lVert \cdot \rVert_{\beta} = \lVert \cdot \rVert_{2}$ et $M = \begin{pmatrix} 1 & 2 \\ -1 & 1 \end{pmatrix}$, déterminer l'image par $M$ de la boule unité fermée de $\lVert \cdot \rVert_{\infty}$, et en déduire $\lVert M \rVert$.
  corrige: |
    On combine les exercices 31 et 32, puis l'on traite le cas mixte par Cauchy-Schwarz ligne par ligne.

    **1.** Par l'exercice 31, 
    $$\boxed{\lVert M \rVert = \max\big(|a| + |b|, |c| + |d|\big)}$$
     pour $\lVert \cdot \rVert_{\infty}$ au départ et à l'arrivée. Par l'exercice 32, pour $\lVert \cdot \rVert_{2}$, $\lVert M \rVert^{2}$ est la plus grande valeur propre de ${}^{t}MM$ ; avec $s = a^{2} + b^{2} + c^{2} + d^{2}$ (sa trace) et $\Delta = ad - bc$ ($\det{}^{t}MM = \Delta^{2}$) : 
    $$\boxed{\lVert M \rVert = \sqrt{\frac{s + \sqrt{s^{2} - 4\Delta^{2}}}{2}}}.$$

    **2.** Par Cauchy-Schwarz, $|ax + by| \leqslant \sqrt{a^{2} + b^{2}}\,\lVert X \rVert_{2}$, et de même pour la seconde ligne, avec égalité pour $X$ colinéaire à la ligne de plus grande norme. 
    $$\boxed{\lVert M \rVert = \max\Big(\sqrt{a^{2} + b^{2}}, \sqrt{c^{2} + d^{2}}\Big)}.$$

    **3.** La boule unité fermée de $\lVert \cdot \rVert_{\infty}$ est le carré de sommets $(\pm 1, \pm 1)$ ; son image par l'application linéaire $M$ est le parallélogramme de sommets 
    $$M(1, 1) = (3, 0), \quad M(-1, 1) = (1, 2), \quad M(-1, -1) = (-3, 0), \quad M(1, -1) = (-1, -2).$$
     La norme euclidienne, convexe, atteint son maximum sur ce parallélogramme en un sommet, d'où $\max(3, \sqrt{5}) = 3$ et $\boxed{\lVert M \rVert = 3}$.

    ![Figure](documents/figures/b5fdd9d047d2489b.svg)

    Le carré unité, en bleu ardoise, et son image, en ocre : le parallélogramme est contenu dans le disque euclidien de rayon $3$, en tirets, qu'il touche en $(\pm 3, 0)$.
- id: "l3-cd-01-34"
  feuille: "f-l3-cd-01"
  numero: 34
  partie: "Normes matricielles"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [normes matricielles]
  noeuds: [f-operateurs]
  notions: [norme-subordonnee]
  page_enonce: 8
  page_corrige: 14
  enonce: |
    Montrer que $\lVert A \rVert = \displaystyle\max_{i, j}|a_{ij}|$ est une norme sur $\mathcal{M}_{n}(\mathbb{R})$, mais que, pour $n \geqslant 2$, ce n'est pas une norme subordonnée.
  corrige: |
    C'est la norme $\lVert \cdot \rVert_{\infty}$ des $n^{2}$ coefficients ; pour montrer qu'elle n'est pas subordonnée, on met en défaut une propriété de toutes les normes subordonnées.

    $A \mapsto \max|a_{ij}|$ est la norme $\lVert \cdot \rVert_{\infty}$ de $\mathbb{R}^{n^{2}}$, transportée à $\mathcal{M}_{n}(\mathbb{R})$ : $\boxed{\text{c'est une norme}}$. Toute norme subordonnée vérifie $|\mkern-1.5mu|\mkern-1.5mu|AB|\mkern-1.5mu|\mkern-1.5mu| \leqslant |\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|\,|\mkern-1.5mu|\mkern-1.5mu|B|\mkern-1.5mu|\mkern-1.5mu|$ (cours, prop. 15). Or, pour la matrice $J$ dont tous les coefficients valent $1$, $J^{2} = nJ$, donc $\lVert J^{2} \rVert = n > 1 = \lVert J \rVert^{2}$ dès que $n \geqslant 2$. 
    $$\boxed{\text{Ce n'est pas une norme subordonnée.}}$$

    *Remarque.* Elle vérifie pourtant $\lVert I_{n} \rVert = 1$, l'autre propriété classique des normes subordonnées : c'est la sous-multiplicativité qui fait défaut.
- id: "l3-cd-01-35"
  feuille: "f-l3-cd-01"
  numero: 35
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [synthèse, convexité]
  noeuds: [gd-normes]
  notions: [partie-convexe, fonction-convexe]
  page_enonce: 8
  page_corrige: 14
  enonce: |
    **1.** Soit $(E, \lVert \cdot \rVert)$ un espace normé. Montrer que la boule $B(0, 1)$ est un ouvert convexe, borné, contenant $0$ et *symétrique* : si $x \in B(0, 1)$, alors $\lambda x \in B(0, 1)$ pour tout $\lambda \in \mathbb{K}$ tel que $|\lambda| = 1$.

    **2.** Réciproquement, soit $E$ un $\mathbb{K}$-espace vectoriel de dimension finie et $\Omega \subset E$ un ouvert convexe, symétrique, borné et contenant $0$ (pour une norme quelconque de $E$). Montrer que 
    $$\lVert x \rVert_{\Omega} = \inf\Big\{r > 0 \;\Big|\; \frac{x}{r} \in \Omega\Big\}$$
     définit une norme sur $E$, dont la boule unité ouverte est $\Omega$.

    **3.** Soit $\mathcal{P}$ un parallélogramme non aplati de $\mathbb{R}^{2}$ centré à l'origine. Montrer qu'il existe une norme sur $\mathbb{R}^{2}$ dont $\mathcal{P}$ est la boule unité fermée.
  corrige: |
    C'est la réciproque de l'exercice 5 : un convexe ouvert, symétrique et borné est la boule unité d'une norme, sa *jauge*.

    **1.** $B(0, 1)$ est ouverte (cours, prop. 1), convexe (exercice 8), bornée, contient $0$, et $\lVert \lambda x \rVert = \lVert x \rVert$ si $|\lambda| = 1$ : $\boxed{\text{elle est symétrique}}$.

    **2.** Soit $N$ une norme de référence sur $E$, et $\rho$, $R > 0$ tels que $B_{N}(0, \rho) \subset \Omega \subset B_{N}(0, R)$ ($\Omega$ est un ouvert contenant $0$, et il est borné). Pour $x \in E$, notons $I_{x} = \Big\{r > 0 \;\Big|\; \dfrac{x}{r} \in \Omega\Big\}$.

    $\triangleright$ *$I_{x}$ est un intervalle non borné.* Si $r \in I_{x}$ et $r' > r$, alors $\dfrac{x}{r'} = \dfrac{r}{r'}\,\dfrac{x}{r} + \Big(1 - \dfrac{r}{r'}\Big)0 \in \Omega$ par convexité. De plus, $r > \dfrac{N(x)}{\rho}$ entraîne $r \in I_{x}$ : $I_{x}$ est non vide, et $\lVert x \rVert_{\Omega} = \inf I_{x}$ est un réel positif ; $I_{x}$ contient tout $r > \lVert x \rVert_{\Omega}$.

    $\triangleright$ *Séparation.* Si $r \in I_{x}$, $N\Big(\dfrac{x}{r}\Big) < R$, donc $r > \dfrac{N(x)}{R}$ : $\lVert x \rVert_{\Omega} \geqslant \dfrac{N(x)}{R}$, et $\lVert x \rVert_{\Omega} = 0$ entraîne $x = 0$.

    $\triangleright$ *Homogénéité.* Pour $t > 0$, $I_{tx} = tI_{x}$, d'où $\lVert tx \rVert_{\Omega} = t\lVert x \rVert_{\Omega}$. Pour $|\omega| = 1$, $\dfrac{\omega x}{r} \in \Omega \iff \dfrac{x}{r} \in \Omega$ par symétrie, d'où $\lVert \omega x \rVert_{\Omega} = \lVert x \rVert_{\Omega}$. Tout $\lambda \neq 0$ s'écrit $|\lambda|\omega$.

    $\triangleright$ *Inégalité triangulaire.* Soit $\varepsilon > 0$, $a = \lVert x \rVert_{\Omega} + \varepsilon \in I_{x}$ et $b = \lVert y \rVert_{\Omega} + \varepsilon \in I_{y}$. Par convexité, 
    $$\frac{x + y}{a + b} = \frac{a}{a + b}\,\frac{x}{a} + \frac{b}{a + b}\,\frac{y}{b} \in \Omega,$$
     donc $\lVert x + y \rVert_{\Omega} \leqslant a + b = \lVert x \rVert_{\Omega} + \lVert y \rVert_{\Omega} + 2\varepsilon$, pour tout $\varepsilon > 0$.

    $\triangleright$ *Boule unité.* Si $x \in \Omega$, comme $\Omega$ est ouvert, $(1 + \eta)x \in \Omega$ pour un $\eta > 0$, soit $\dfrac{1}{1 + \eta} \in I_{x}$ et $\lVert x \rVert_{\Omega} < 1$. Réciproquement, si $\lVert x \rVert_{\Omega} < 1$, il existe $r \in I_{x}$ avec $r < 1$, et $x = r\dfrac{x}{r} + (1 - r)0 \in \Omega$. 
    $$\boxed{\lVert \cdot \rVert_{\Omega} \text{ est une norme de boule unité ouverte } \Omega.}$$

    **3.** L'intérieur $\Omega$ du parallélogramme $\mathcal{P}$ est un ouvert convexe, borné, contenant $0$, et symétrique par rapport à $0$ (sur $\mathbb{R}$, $|\lambda| = 1$ signifie $\lambda = \pm 1$) : par la question 2, c'est la boule unité ouverte d'une norme. Sa boule unité fermée est l'adhérence de la boule ouverte, c'est-à-dire $\overline{\Omega} = \mathcal{P}$ : 
    $$\boxed{\mathcal{P} \text{ est la boule unité fermée de } \lVert \cdot \rVert_{\Omega}}.$$
     Si $\mathcal{P}$ a pour sommets $\pm u$ et $\pm v$, avec $(u, v)$ libre, c'est explicitement $\lVert \alpha u' + \beta v' \rVert_{\Omega} = \max(|\alpha|, |\beta|)$, où $u' = \dfrac{u + v}{2}$ et $v' = \dfrac{u - v}{2}$ sont les milieux de deux côtés.

    *À retenir.* Les normes de $\mathbb{R}^{n}$ sont exactement les jauges des convexes ouverts, bornés, symétriques et contenant $0$. Les losanges de $\lVert \cdot \rVert_{1}$, les carrés de $\lVert \cdot \rVert_{\infty}$, les disques de $\lVert \cdot \rVert_{2}$ et les formes de l'exercice 12 en sont des cas particuliers.

