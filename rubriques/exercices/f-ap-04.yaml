- id: "ap-04-01"
  feuille: "f-ap-04"
  numero: 1
  partie: "Morphismes de groupes"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [morphismes de groupes, exponentielle et logarithme]
  noeuds: [a-morphisme]
  notions: [morphisme-groupes]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Les applications suivantes sont-elles des morphismes de groupes ? Justifier, en exhibant un contre-exemple le cas échéant.

    **1.** $\begin{array}{r|ccl} f : & (\mathbb{R}\,;+) & \longrightarrow & (\mathbb{R}\,;+) \\ & x & \longmapsto & 3x \end{array}$

    **2.** $\begin{array}{r|ccl} f : & (\mathbb{R}\,;+) & \longrightarrow & (\mathbb{R}\,;+) \\ & x & \longmapsto & x+1 \end{array}$

    **3.** $\begin{array}{r|ccl} f : & (\mathbb{R}\,;+) & \longrightarrow & (\mathbb{R}\,;+) \\ & x & \longmapsto & x^{2} \end{array}$

    **4.** $\begin{array}{r|ccl} f : & (\mathbb{R}^{*}\,;\times) & \longrightarrow & (\mathbb{R}^{*}\,;\times) \\ & x & \longmapsto & x^{2} \end{array}$

    **5.** $\begin{array}{r|ccl} f : & (\mathbb{C}\,;+) & \longrightarrow & (\mathbb{C}\,;+) \\ & z & \longmapsto & \overline{z} \end{array}$

    **6.** $\begin{array}{r|ccl} f : & (\mathbb{C}^{*}\,;\times) & \longrightarrow & (\mathbb{R}_{+}^{*}\,;\times) \\ & z & \longmapsto & |z| \end{array}$

    **7.** $\begin{array}{r|ccl} f : & (\mathbb{R}_{+}^{*}\,;\times) & \longrightarrow & (\mathbb{R}\,;+) \\ & x & \longmapsto & \ln(x) \end{array}$

    **8.** $\begin{array}{r|ccl} f : & (\mathbb{Z}\,;+) & \longrightarrow & (\mathbb{Z}\,;+) \\ & k & \longmapsto & 5k \end{array}$

    **9.** $\begin{array}{r|ccl} f : & (\mathbb{Z}\,;+) & \longrightarrow & (\mathbb{Z}\,;+) \\ & k & \longmapsto & k+5 \end{array}$

    **10.** $\begin{array}{r|ccl} f : & (\mathbb{R}\,;+) & \longrightarrow & (\mathbb{R}_{+}^{*}\,;\times) \\ & x & \longmapsto & \mathrm{e}^{x} \end{array}$

    **11.** $\begin{array}{r|ccl} f : & (\mathbb{R}^{*}\,;\times) & \longrightarrow & (\mathbb{R}^{*}\,;\times) \\ & x & \longmapsto & \dfrac{1}{x} \end{array}$

    **12.** $\begin{array}{r|ccl} f : & (\mathbb{R}^{*}\,;\times) & \longrightarrow & (\mathbb{R}\,;+) \\ & x & \longmapsto & \ln|x| \end{array}$
  corrige: |
    Il s'agit à chaque fois de comparer $f(x \cdot y)$ et $f(x) \ast f(y)$, en prenant garde aux deux lois, qui ne sont pas toujours les mêmes au départ et à l'arrivée.

    **1.** Pour tous réels $x$ et $y$ : $3(x+y)=3x+3y$. $\boxed{\text{Morphisme.}}$

    **2.** On a $f(x+y)=x+y+1$ alors que $f(x)+f(y)=x+y+2$. $\boxed{\text{Non : prendre } x=y=0.}$

    **3.** On a $f(1+1)=4$ alors que $f(1)+f(1)=2$. $\boxed{\text{Non.}}$

    **4.** Pour tous réels non nuls : $(xy)^{2}=x^{2}y^{2}$. $\boxed{\text{Morphisme.}}$

    **5.** La conjugaison vérifie $\overline{z+z'}=\overline{z}+\overline{z'}$. $\boxed{\text{Morphisme.}}$

    **6.** Le module vérifie $|zz'|=|z|\,|z'|$, et $|z|>0$ pour $z \neq 0$. $\boxed{\text{Morphisme.}}$

    **7.** Le logarithme vérifie $\ln(xy)=\ln(x)+\ln(y)$ sur $\mathbb{R}_{+}^{*}$. $\boxed{\text{Morphisme.}}$

    **8.** Pour tous entiers : $5(k+k')=5k+5k'$. $\boxed{\text{Morphisme.}}$

    **9.** On a $f(0+0)=5$ alors que $f(0)+f(0)=10$. $\boxed{\text{Non.}}$

    **10.** L'exponentielle vérifie $\mathrm{e}^{x+y}=\mathrm{e}^{x}\,\mathrm{e}^{y}$. $\boxed{\text{Morphisme.}}$

    **11.** Pour tous réels non nuls : $\dfrac{1}{xy}=\dfrac{1}{x} \times \dfrac{1}{y}$. $\boxed{\text{Morphisme.}}$

    **12.** Pour tous réels non nuls : $\ln|xy|=\ln\big(|x|\,|y|\big)=\ln|x|+\ln|y|$. $\boxed{\text{Morphisme.}}$

    *Piège des questions 3 et 4 :* c'est la même formule $x \mapsto x^{2}$, mais pas les mêmes lois. Elle respecte la multiplication, pas l'addition : la propriété dépend des *trois* composantes de l'application, comme au chapitre 2.
- id: "ap-04-02"
  feuille: "f-ap-04"
  numero: 2
  partie: "Morphismes de groupes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [morphismes de groupes, isomorphismes, endomorphismes et automorphismes]
  noeuds: [a-morphisme]
  notions: [morphisme-groupes, isomorphisme]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Reprendre les applications de l'exercice 1 qui sont des morphismes, et préciser pour chacune s'il s'agit d'un endomorphisme, d'un isomorphisme, d'un automorphisme, ou d'aucun des trois.
  corrige: |
    Un *endomorphisme* va d'un groupe dans lui-même, un *isomorphisme* est un morphisme bijectif, un *automorphisme* est les deux à la fois.

    ```tableau
     ¦ **Nature** ¦ **Justification**
    **1.** $x \mapsto 3x$ ¦ automorphisme ¦ Même groupe au départ et à l'arrivée, bijectif de réciproque $y \mapsto \frac{y}{3}$.
    **4.** $x \mapsto x^{2}$ sur $\mathbb{R}^{*}$ ¦ endomorphisme seul ¦ $f(-1)=f(1)=1$ : non injectif.
    **5.** $z \mapsto \overline{z}$ ¦ automorphisme ¦ Bijectif, de réciproque lui-même.
    **6.** $z \mapsto |z|$ ¦ aucun des trois ¦ Groupes différents, et non injectif.
    **7.** $x \mapsto \ln(x)$ ¦ isomorphisme ¦ Bijectif, de réciproque $\exp$ ; groupes différents.
    **8.** $k \mapsto 5k$ ¦ endomorphisme seul ¦ Injectif, mais $1$ n'a pas d'antécédent.
    **10.** $x \mapsto \mathrm{e}^{x}$ ¦ isomorphisme ¦ Bijectif, de réciproque $\ln$ ; groupes différents.
    **11.** $x \mapsto \frac{1}{x}$ ¦ automorphisme ¦ Bijectif, de réciproque lui-même.
    **12.** $x \mapsto \ln|x|$ ¦ aucun des trois ¦ Groupes différents, et $f(-1)=f(1)=0$.
    ```

    *Piège :* les questions 7 et 10 fournissent des isomorphismes, mais *pas* des automorphismes : les groupes de départ et d'arrivée sont différents, même s'ils sont isomorphes.
- id: "ap-04-03"
  feuille: "f-ap-04"
  numero: 3
  partie: "Morphismes de groupes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [morphismes de groupes, groupes abéliens]
  noeuds: [a-morphisme, a-groupe]
  notions: [morphisme-groupes]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Soit $(G \,;\cdot)$ un groupe.

    **1.** Démontrer que l'application $\iota : x \mapsto x^{-1}$ est un morphisme de $G$ dans $G$ si et seulement si $G$ est abélien.

    **2.** Démontrer de même que $c : x \mapsto x^{2}$ est un morphisme de $G$ dans $G$ si et seulement si $G$ est abélien.

    **3.** En déduire que dans le groupe $\mathcal{S}\big(\{1\,;2\,;3\}\big)$ des permutations, rencontré au chapitre 3, aucune de ces deux applications n'est un morphisme.
  corrige: |
    **1.** D'après la propriété 3 du chapitre 3, on a toujours $\iota(xy)=(xy)^{-1}=y^{-1}x^{-1}$, tandis que $\iota(x)\,\iota(y)=x^{-1}y^{-1}$. Ainsi : 
    $$\iota \text{ est un morphisme} \iff \forall (x\,;y) \in G^{2}, \; y^{-1}x^{-1}=x^{-1}y^{-1}$$
     Or, lorsque $x$ et $y$ parcourent $G$, les éléments $a=x^{-1}$ et $b=y^{-1}$ parcourent également $G$ tout entier. La condition s'écrit donc $ba=ab$ pour tous $a$ et $b$ de $G$. 
    $$\boxed{\iota \text{ est un morphisme si et seulement si } G \text{ est abélien.}}$$

    **2.** On compare de même : 
    $$c(xy)=(xy)^{2}=xyxy \qquad\text{et}\qquad c(x)\,c(y)=x^{2}y^{2}=xxyy$$
     L'égalité $xyxy=xxyy$ équivaut, par régularité à gauche par $x$ puis à droite par $y$, à $yx=xy$. 
    $$\boxed{c \text{ est un morphisme si et seulement si } G \text{ est abélien.}}$$

    **3.** Le groupe $\mathcal{S}\big(\{1\,;2\,;3\}\big)$ n'est pas abélien : l'exercice 11 du chapitre 3 exhibe deux permutations $\sigma$ et $\tau$ telles que $\sigma \circ \tau \neq \tau \circ \sigma$. 
    $$\boxed{\text{Ni } \sigma \mapsto \sigma^{-1}, \text{ ni } \sigma \mapsto \sigma \circ \sigma \text{ n'est un morphisme de ce groupe.}}$$
- id: "ap-04-04"
  feuille: "f-ap-04"
  numero: 4
  partie: "Propriétés élémentaires et isomorphismes"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [morphismes de groupes]
  noeuds: [a-morphisme]
  notions: [morphisme-groupes]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Soit $f : (G \,;\cdot) \longrightarrow (H \,;\ast)$ un morphisme de groupes.

    **1.** Démontrer par récurrence que $f\big(x^{n}\big)=f(x)^{n}$ pour tout $x \in G$ et tout $n \in \mathbb{N}$, puis étendre le résultat à $n \in \mathbb{Z}$.

    **2.** Utiliser la propriété 1 du cours pour écarter rapidement les candidats suivants, sans aucun calcul de composition.

    **(a)** $x \mapsto x+1$ de $(\mathbb{R}\,;+)$ dans $(\mathbb{R}\,;+)$

    **(b)** $x \mapsto 2x$ de $(\mathbb{R}^{*}\,;\times)$ dans $(\mathbb{R}^{*}\,;\times)$

    **(c)** $z \mapsto z+\mathrm{i}$ de $(\mathbb{C}\,;+)$ dans $(\mathbb{C}\,;+)$

    **(d)** $x \mapsto x-3$ de $(\mathbb{Z}\,;+)$ dans $(\mathbb{Z}\,;+)$

    **3.** Soit $g : (\mathbb{R}\,;+) \to (\mathbb{R}\,;+)$ un morphisme. Démontrer que $g(n)=n\,g(1)$ pour tout $n \in \mathbb{Z}$, puis que $g(r)=r\,g(1)$ pour tout $r \in \mathbb{Q}$.
  corrige: |
    **1.** Montrons par récurrence que $f\big(x^{n}\big)=f(x)^{n}$ pour tout $n \in \mathbb{N}$.

    *Initialisation.* Pour $n=0$, on a $x^{0}=e_{G}$ et $f(e_{G})=e_{H}=f(x)^{0}$ d'après la propriété 1.

    *Hérédité.* Supposons la formule vraie au rang $n$. Alors : 
    $$f\big(x^{n+1}\big)=f\big(x^{n} \cdot x\big)=f\big(x^{n}\big) \ast f(x)=f(x)^{n} \ast f(x)=f(x)^{n+1}$$

    *Extension à $\mathbb{Z}$.* Soit $n<0$, et posons $m=-n>0$. La propriété 1 donne : 
    $$f\big(x^{n}\big)=f\Big(\big(x^{m}\big)^{-1}\Big)=f\big(x^{m}\big)^{-1}=\Big(f(x)^{m}\Big)^{-1}=f(x)^{-m}=f(x)^{n}$$

    $$\boxed{\forall n \in \mathbb{Z}, \quad f\big(x^{n}\big)=f(x)^{n}}$$

    **2.** Un morphisme envoie le neutre sur le neutre : il suffit donc de calculer l'image du neutre de départ. 
    $$\boxed{\begin{array}{ll} \textbf{(a)} \; f(0)=1 \neq 0 & \textbf{(b)} \; f(1)=2 \neq 1 \\[1mm] \textbf{(c)} \; f(0)=\mathrm{i} \neq 0 & \textbf{(d)} \; f(0)=-3 \neq 0 \end{array}}$$

    $$\boxed{\text{Aucune de ces quatre applications n'est un morphisme.}}$$
     *Remarque :* ce test est instantané et doit devenir un réflexe. Il ne prouve rien lorsqu'il est concluant — une application peut envoyer le neutre sur le neutre sans être un morphisme, comme $x \mapsto x^{2}$ sur $(\mathbb{R}\,;+)$ — mais il élimine immédiatement un mauvais candidat.

    **3.** La loi étant notée additivement des deux côtés, la question 1 s'écrit ici $g(nx)=n\,g(x)$. Appliquée à $x=1$ : 
    $$\boxed{\forall n \in \mathbb{Z}, \quad g(n)=n\,g(1)}$$
     Soit maintenant $q \in \mathbb{N}^{*}$. En appliquant ce qui précède à $x=\dfrac{1}{q}$ et $n=q$ : 
    $$g(1)=g\left(q \times \frac{1}{q}\right)=q\,g\!\left(\frac{1}{q}\right) \qquad\text{donc}\qquad g\!\left(\frac{1}{q}\right)=\frac{g(1)}{q}$$
     Enfin, pour $r=\dfrac{p}{q}$ avec $p \in \mathbb{Z}$ et $q \in \mathbb{N}^{*}$ : 
    $$g(r)=g\!\left(p \times \frac{1}{q}\right)=p\,g\!\left(\frac{1}{q}\right)=\frac{p}{q}\,g(1)$$

    $$\boxed{\forall r \in \mathbb{Q}, \quad g(r)=r\,g(1)}$$
     Un morphisme de $(\mathbb{R}\,;+)$ dans lui-même est donc entièrement déterminé sur $\mathbb{Q}$ par la seule valeur $g(1)$.
- id: "ap-04-05"
  feuille: "f-ap-04"
  numero: 5
  partie: "Propriétés élémentaires et isomorphismes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [morphismes de groupes, isomorphismes, endomorphismes et automorphismes, sous-groupes, exponentielle et logarithme]
  noeuds: [a-morphisme, a-sous-groupe]
  notions: [morphisme-groupes, isomorphisme, sous-groupe]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Soient $f : (\mathbb{R}\,;+) \to (\mathbb{R}_{+}^{*}\,;\times)$, $x \mapsto \mathrm{e}^{x}$ et $g : (\mathbb{R}_{+}^{*}\,;\times) \to (\mathbb{R}\,;+)$, $x \mapsto \ln(x)$. Identifier $g \circ f$ et $f \circ g$.

    **2.** Soient $f : G \to H$ et $g : H \to K$ deux isomorphismes de groupes. Démontrer que $g \circ f$ en est un.

    **3.** On note $\mathrm{Aut}(G)$ l'ensemble des automorphismes d'un groupe $G$. Démontrer que $\mathrm{Aut}(G)$ est un sous-groupe du groupe $\mathcal{S}(G)$ des bijections de $G$ dans $G$.
  corrige: |
    **1.** Pour tout réel $x$, $\ln\big(\mathrm{e}^{x}\big)=x$, et pour tout réel $x>0$, $\mathrm{e}^{\ln(x)}=x$. 
    $$\boxed{g \circ f = \mathrm{Id}_{\mathbb{R}} \qquad\text{et}\qquad f \circ g = \mathrm{Id}_{\mathbb{R}_{+}^{*}}}$$
     Les applications $f$ et $g$ sont donc réciproques l'une de l'autre : ce sont deux isomorphismes.

    **2.** La composée $g \circ f$ est un morphisme d'après la propriété 2 du cours, et elle est bijective comme composée de deux bijections (chapitre 2). 
    $$\boxed{g \circ f \text{ est un isomorphisme de } G \text{ sur } K.}$$

    **3.** Un automorphisme de $G$ étant en particulier une bijection de $G$ dans $G$, on a $\mathrm{Aut}(G) \subset \mathcal{S}(G)$.

    L'application $\mathrm{Id}_{G}$ est bijective, et c'est un morphisme puisque $\mathrm{Id}_{G}(xy)=xy=\mathrm{Id}_{G}(x)\,\mathrm{Id}_{G}(y)$ : elle appartient à $\mathrm{Aut}(G)$, qui n'est donc pas vide.

    Soient enfin $f$ et $h$ dans $\mathrm{Aut}(G)$. D'après la propriété 2, $h^{-1}$ est un morphisme, et c'est une bijection : $h^{-1} \in \mathrm{Aut}(G)$. La question 2 donne alors que $f \circ h^{-1}$ est un automorphisme. 
    $$\boxed{\mathrm{Aut}(G) \text{ est un sous-groupe de } \mathcal{S}(G).}$$
- id: "ap-04-06"
  feuille: "f-ap-04"
  numero: 6
  partie: "Propriétés élémentaires et isomorphismes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [morphismes de groupes, endomorphismes et automorphismes]
  noeuds: [a-morphisme]
  notions: [morphisme-groupes]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $(G \,;\cdot)$ un groupe. Pour tout $g \in G$, on définit l'application : 
    $$\begin{array}{r|ccl} \varphi_{g} : & G & \longrightarrow & G \\ & h & \longmapsto & ghg^{-1} \end{array}$$

    **1.** Démontrer que $\varphi_{g}$ est un morphisme de groupes.

    **2.** Démontrer que $\varphi_{g}$ est bijective, et déterminer $\varphi_{g}^{-1}$.

    **3.** Conclure : les $\varphi_{g}$ sont appelés les *automorphismes intérieurs* de $G$.

    **4.** Démontrer que $\varphi_{g}=\mathrm{Id}_{G}$ si et seulement si $g$ appartient au centre $C(G)$, défini au chapitre 3.

    **5.** Démontrer que $\varphi_{g} \circ \varphi_{g'} = \varphi_{gg'}$, et en déduire que $g \mapsto \varphi_{g}$ est un morphisme de $G$ dans $\mathrm{Aut}(G)$.
  corrige: |
    **1.** Soient $h$ et $h'$ dans $G$. En intercalant $g^{-1}g=e$ : 
    $$\varphi_{g}(hh')=g\,hh'\,g^{-1}=g\,h\,\underbrace{g^{-1}g}_{=\,e}\,h'\,g^{-1}=\big(ghg^{-1}\big)\big(gh'g^{-1}\big)=\varphi_{g}(h)\,\varphi_{g}(h')$$

    $$\boxed{\varphi_{g} \text{ est un morphisme de } G \text{ dans } G.}$$

    **2.** Pour tout $h \in G$ : 
    $$\big(\varphi_{g} \circ \varphi_{g^{-1}}\big)(h)=g\big(g^{-1}hg\big)g^{-1}=h \qquad \big(\varphi_{g^{-1}} \circ \varphi_{g}\big)(h)=g^{-1}\big(ghg^{-1}\big)g=h$$
     Les deux composées valent $\mathrm{Id}_{G}$ : 
    $$\boxed{\varphi_{g} \text{ est bijective, et } \varphi_{g}^{-1}=\varphi_{g^{-1}}.}$$

    **3.** Les deux questions précédentes se combinent : 
    $$\boxed{\varphi_{g} \text{ est un endomorphisme bijectif de } G \text{ : c'est un automorphisme.}}$$

    **4.** On enchaîne les équivalences : 
    $$\varphi_{g}=\mathrm{Id}_{G} \iff \forall h \in G, \; ghg^{-1}=h \iff \forall h \in G, \; gh=hg$$
     la dernière équivalence s'obtenant en multipliant à droite par $g$. 
    $$\boxed{\varphi_{g}=\mathrm{Id}_{G} \iff g \in C(G)}$$

    **5.** Pour tous $g$, $g'$ et $h$ de $G$ : 
    $$\big(\varphi_{g} \circ \varphi_{g'}\big)(h)=g\big(g'hg'^{-1}\big)g^{-1}=(gg')\,h\,\big(g'^{-1}g^{-1}\big)=(gg')\,h\,(gg')^{-1}=\varphi_{gg'}(h)$$
     en utilisant la propriété 3 du chapitre 3 pour l'inverse d'un produit. 
    $$\boxed{\varphi_{g} \circ \varphi_{g'}=\varphi_{gg'}, \text{ donc } \Phi : g \mapsto \varphi_{g} \text{ est un morphisme de } (G\,;\cdot) \text{ dans } \big(\mathrm{Aut}(G)\,;\circ\big).}$$
     D'après la question 4, le noyau de $\Phi$ est exactement le centre $C(G)$. On retrouve ainsi, par la proposition 3, que $C(G)$ est un sous-groupe de $G$ — résultat établi à la main au chapitre 3.
- id: "ap-04-07"
  feuille: "f-ap-04"
  numero: 7
  partie: "Propriétés élémentaires et isomorphismes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [morphismes de groupes, isomorphismes]
  noeuds: [a-morphisme]
  notions: [morphisme-groupes, isomorphisme]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Dans chacun des cas suivants, démontrer que les deux groupes sont isomorphes en exhibant un isomorphisme explicite.

    **1.** $(\mathbb{R}\,;+)$ et $(\mathbb{R}_{+}^{*}\,;\times)$.

    **2.** $(\mathbb{Z}\,;+)$ et $(n\mathbb{Z}\,;+)$, où $n \in \mathbb{N}^{*}$.

    **3.** $\big(\mathbb{R} \setminus \{-1\} \,;\ast\big)$, où $x \ast y = x+y+xy$, et $(\mathbb{R}^{*}\,;\times)$.

    **4.** $(\mathbb{Z} \,;\perp)$, où $x \perp y = x+y-3$, et $(\mathbb{Z}\,;+)$.

    Les deux dernières lois ont été étudiées au chapitre 3, aux exercices 10 et 3.
  corrige: |
    **1.** L'exponentielle vérifie $\mathrm{e}^{x+y}=\mathrm{e}^{x}\mathrm{e}^{y}$ et réalise une bijection de $\mathbb{R}$ sur $\mathbb{R}_{+}^{*}$, de réciproque $\ln$. 
    $$\boxed{x \mapsto \mathrm{e}^{x} \text{ est un isomorphisme de } (\mathbb{R}\,;+) \text{ sur } (\mathbb{R}_{+}^{*}\,;\times).}$$

    **2.** Posons $f : k \mapsto nk$, de $\mathbb{Z}$ dans $n\mathbb{Z}$. C'est un morphisme, car $n(k+k')=nk+nk'$. Son noyau est $\{k \in \mathbb{Z} \mid nk=0\}=\{0\}$ puisque $n \neq 0$, donc $f$ est injectif ; et tout élément de $n\mathbb{Z}$ s'écrit $nk$ par définition, donc $f$ est surjectif. 
    $$\boxed{k \mapsto nk \text{ est un isomorphisme de } (\mathbb{Z}\,;+) \text{ sur } (n\mathbb{Z}\,;+).}$$

    **3.** Posons $\varphi : x \mapsto 1+x$. L'identité établie au chapitre 3 donne, pour tous $x$ et $y$ de $\mathbb{R} \setminus \{-1\}$ : 
    $$\varphi(x \ast y)=1+x+y+xy=(1+x)(1+y)=\varphi(x) \times \varphi(y)$$
     De plus $\varphi$ est une bijection de $\mathbb{R} \setminus \{-1\}$ sur $\mathbb{R}^{*}$, de réciproque $t \mapsto t-1$. 
    $$\boxed{\varphi \text{ est un isomorphisme de } \big(\mathbb{R} \setminus \{-1\}\,;\ast\big) \text{ sur } (\mathbb{R}^{*}\,;\times).}$$

    **4.** Posons $\psi : x \mapsto x-3$. Pour tous entiers $x$ et $y$ : 
    $$\psi(x \perp y)=(x+y-3)-3=(x-3)+(y-3)=\psi(x)+\psi(y)$$
     et $\psi$ est bijective de $\mathbb{Z}$ sur $\mathbb{Z}$, de réciproque $t \mapsto t+3$. 
    $$\boxed{\psi \text{ est un isomorphisme de } (\mathbb{Z}\,;\perp) \text{ sur } (\mathbb{Z}\,;+).}$$
     Les questions 3 et 4 confirment ce que le chapitre 3 laissait pressentir : ces lois inhabituelles ne sont que des lois connues, transportées par un changement de nom des éléments.
- id: "ap-04-08"
  feuille: "f-ap-04"
  numero: 8
  partie: "Propriétés élémentaires et isomorphismes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [morphismes de groupes, isomorphismes]
  noeuds: [a-morphisme]
  notions: [morphisme-groupes, isomorphisme]
  page_enonce: 2
  page_corrige: 5
  enonce: |
    **1.** Démontrer que le seul réel $x$ vérifiant $x+x=0$ est $x=0$.

    **2.** Donner un réel $y$ différent de $1$ vérifiant $y \times y = 1$.

    **3.** On suppose qu'il existe un isomorphisme $f$ de $(\mathbb{R}^{*}\,;\times)$ sur $(\mathbb{R}\,;+)$. Calculer $f(-1)+f(-1)$, et en déduire une contradiction.

    **4.** Conclure. Le même argument permettrait-il de montrer que $(\mathbb{R}_{+}^{*}\,;\times)$ et $(\mathbb{R}\,;+)$ ne sont pas isomorphes ? Commenter.
  corrige: |
    **1.** Si $x+x=0$, alors $2x=0$, et comme $2 \neq 0$ dans $\mathbb{R}$, il vient $x=0$. 
    $$\boxed{\text{Le seul réel vérifiant } x+x=0 \text{ est } 0.}$$

    **2.** Un tel réel existe : 
    $$\boxed{y=-1 \text{ convient, car } (-1) \times (-1)=1 \text{ et } -1 \neq 1.}$$

    **3.** Supposons qu'un tel isomorphisme $f$ existe. Comme $f$ est un morphisme : 
    $$f(-1)+f(-1)=f\big((-1) \times (-1)\big)=f(1)=0$$
     la dernière égalité venant de la propriété 1, le neutre de $(\mathbb{R}^{*}\,;\times)$ étant $1$ et celui de $(\mathbb{R}\,;+)$ étant $0$. D'après la question 1, on en déduit $f(-1)=0=f(1)$. Or $f$ est injectif, donc $-1=1$ : c'est absurde. 
    $$\boxed{(\mathbb{R}^{*}\,;\times) \text{ et } (\mathbb{R}\,;+) \text{ ne sont pas isomorphes.}}$$

    **4.** L'argument repose entièrement sur l'existence, dans $\mathbb{R}^{*}$, d'un élément différent du neutre et égal à son propre inverse. Or dans $\mathbb{R}_{+}^{*}$, l'équation $y^{2}=1$ avec $y>0$ n'a que la solution $y=1$ : l'argument tombe. 
    $$\boxed{\text{Non : et de fait, } (\mathbb{R}_{+}^{*}\,;\times) \text{ et } (\mathbb{R}\,;+) \text{ sont isomorphes par l'exponentielle.}}$$
     *Méthode à retenir :* pour montrer que deux groupes ne sont *pas* isomorphes, on cherche une propriété préservée par tout isomorphisme — ici le nombre d'éléments égaux à leur propre symétrique — et vraie dans l'un, fausse dans l'autre.
- id: "ap-04-09"
  feuille: "f-ap-04"
  numero: 9
  partie: "Noyau et image"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [morphismes de groupes, noyau, image, injectivité et surjectivité, sous-groupes]
  noeuds: [a-morphisme, r-injections, a-sous-groupe]
  notions: [morphisme-groupes, noyau, sous-groupe]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    On pose $G=\{1 \,;\mathrm{i} \,;-1 \,;-\mathrm{i}\}$ et $H=\{1 \,;-1\}$, tous deux munis de la multiplication des complexes. On admet que $G$ est un groupe. On considère l'application $f : z \mapsto z^{2}$.

    ![Figure](documents/figures/edc06139d151139a.svg)

    **1.** Vérifier que $H$ est un sous-groupe de $G$, et que $f$ est bien à valeurs dans $H$.

    **2.** Démontrer que $f$ est un morphisme de groupes de $G$ dans $H$.

    **3.** Lire sur le diagramme, puis retrouver par le calcul, le noyau et l'image de $f$.

    **4.** L'application $f$ est-elle injective ? surjective ?
  corrige: |
    **1.** On a $H \subset G$, et $1 \in H$. De plus, pour $z$ et $z'$ dans $H=\{1\,;-1\}$, le produit $zz'^{-1}$ vaut $1$ ou $-1$ : $H$ est bien un sous-groupe de $G$. Enfin : 
    $$1^{2}=1 \qquad \mathrm{i}^{2}=-1 \qquad (-1)^{2}=1 \qquad (-\mathrm{i})^{2}=-1$$

    $$\boxed{H \text{ est un sous-groupe de } G, \text{ et } f \text{ est bien à valeurs dans } H.}$$

    **2.** La multiplication des complexes étant commutative, pour tous $z$ et $z'$ de $G$ : 
    $$f(zz')=(zz')^{2}=z^{2}z'^{2}=f(z)\,f(z')$$

    $$\boxed{f \text{ est un morphisme de } G \text{ dans } H.}$$

    **3.** Sur le diagramme, deux flèches arrivent sur $1$ et deux sur $-1$. Le noyau est l'ensemble des éléments envoyés sur le neutre $1$ de $H$, et l'image l'ensemble des éléments atteints. 
    $$\boxed{\mathrm{Ker}\, f = \{1 \,;-1\} \qquad\text{et}\qquad \mathrm{Im}\, f = \{1 \,;-1\} = H}$$
     On le retrouve par le calcul : $z^{2}=1$ équivaut à $z \in \{1\,;-1\}$, et le tableau des quatre carrés montre que les deux valeurs $1$ et $-1$ sont atteintes.

    **4.** Le noyau contient deux éléments, donc n'est pas réduit au neutre ; l'image est l'ensemble d'arrivée tout entier. 
    $$\boxed{f \text{ n'est pas injectif, mais il est surjectif.}}$$
- id: "ap-04-10"
  feuille: "f-ap-04"
  numero: 10
  partie: "Noyau et image"
  etoiles: 1
  types: [Calcul]
  mots_cles: [morphismes de groupes, noyau, image, exponentielle et logarithme]
  noeuds: [a-morphisme]
  notions: [morphisme-groupes, noyau]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Pour chacune des applications suivantes, déterminer s'il s'agit d'un morphisme de groupes. Le cas échéant, préciser son image et son noyau.

    **1.** $\begin{array}{r|ccl} f_{1} : & (\mathbb{C}^{*}\,;\times) & \longrightarrow & (\mathbb{R}^{*}\,;\times) \\ & z & \longmapsto & |z| \end{array}$

    **2.** $\begin{array}{r|ccl} f_{2} : & (\mathbb{Z}^{2}\,;+) & \longrightarrow & (\mathbb{Z}\,;+) \\ & (a\,;b) & \longmapsto & a-b \end{array}$

    **3.** $\begin{array}{r|ccl} f_{3} : & (\mathbb{R}_{+}^{*}\,;\times) & \longrightarrow & (\mathbb{R}\,;+) \\ & x & \longmapsto & \ln(x) \end{array}$
  corrige: |
    **1.** Pour tous complexes non nuls, $|zz'|=|z|\,|z'|$ : $f_{1}$ est un morphisme. Son image est l'ensemble des modules de complexes non nuls, c'est-à-dire les réels strictement positifs ; son noyau est l'ensemble des complexes de module $1$. 
    $$\boxed{f_{1} \text{ est un morphisme, } \mathrm{Im}\, f_{1}=\mathbb{R}_{+}^{*} \text{ et } \mathrm{Ker}\, f_{1}=\mathbb{U}.}$$
     L'ensemble d'arrivée étant $\mathbb{R}^{*}$, ce morphisme n'est pas surjectif ; il n'est pas injectif non plus.

    **2.** Pour tous $(a\,;b)$ et $(a'\,;b')$ de $\mathbb{Z}^{2}$ : 
    $$f_{2}\big((a\,;b)+(a'\,;b')\big)=(a+a')-(b+b')=(a-b)+(a'-b')=f_{2}(a\,;b)+f_{2}(a'\,;b')$$
     Tout entier $a$ est atteint, par exemple par $(a\,;0)$, et $a-b=0$ équivaut à $a=b$. 
    $$\boxed{f_{2} \text{ est un morphisme, } \mathrm{Im}\, f_{2}=\mathbb{Z} \text{ et } \mathrm{Ker}\, f_{2}=\big\{(a\,;a) \;|\; a \in \mathbb{Z}\big\}.}$$

    **3.** Le logarithme vérifie $\ln(xy)=\ln(x)+\ln(y)$, atteint tout réel, et ne s'annule qu'en $1$. 
    $$\boxed{f_{3} \text{ est un morphisme, } \mathrm{Im}\, f_{3}=\mathbb{R} \text{ et } \mathrm{Ker}\, f_{3}=\{1\} \text{ : c'est un isomorphisme.}}$$
- id: "ap-04-11"
  feuille: "f-ap-04"
  numero: 11
  partie: "Noyau et image"
  etoiles: 1
  types: [Calcul]
  mots_cles: [morphismes de groupes, noyau, image, exponentielle et logarithme]
  noeuds: [a-morphisme]
  notions: [morphisme-groupes, noyau]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Déterminer le noyau et l'image de chacun des morphismes suivants, rencontrés à l'exercice 1.

    **1.** $x \mapsto 3x$ de $(\mathbb{R}\,;+)$ dans $(\mathbb{R}\,;+)$

    **2.** $x \mapsto x^{2}$ de $(\mathbb{R}^{*}\,;\times)$ dans $(\mathbb{R}^{*}\,;\times)$

    **3.** $z \mapsto \overline{z}$ de $(\mathbb{C}\,;+)$ dans $(\mathbb{C}\,;+)$

    **4.** $k \mapsto 5k$ de $(\mathbb{Z}\,;+)$ dans $(\mathbb{Z}\,;+)$

    **5.** $x \mapsto \dfrac{1}{x}$ de $(\mathbb{R}^{*}\,;\times)$ dans $(\mathbb{R}^{*}\,;\times)$

    **6.** $x \mapsto \ln|x|$ de $(\mathbb{R}^{*}\,;\times)$ dans $(\mathbb{R}\,;+)$
  corrige: |
    On cherche à chaque fois les antécédents du neutre d'arrivée, puis l'ensemble des valeurs atteintes.

    $$\textbf{1.} \; \boxed{\mathrm{Ker}\, = \{0\} \quad;\quad \mathrm{Im}\, = \mathbb{R}} \qquad\qquad \textbf{2.} \; \boxed{\mathrm{Ker}\, = \{-1 \,;1\} \quad;\quad \mathrm{Im}\, = \mathbb{R}_{+}^{*}}$$

    $$\textbf{3.} \; \boxed{\mathrm{Ker}\, = \{0\} \quad;\quad \mathrm{Im}\, = \mathbb{C}} \qquad\qquad \textbf{4.} \; \boxed{\mathrm{Ker}\, = \{0\} \quad;\quad \mathrm{Im}\, = 5\mathbb{Z}}$$

    $$\textbf{5.} \; \boxed{\mathrm{Ker}\, = \{1\} \quad;\quad \mathrm{Im}\, = \mathbb{R}^{*}} \qquad\qquad \textbf{6.} \; \boxed{\mathrm{Ker}\, = \{-1 \,;1\} \quad;\quad \mathrm{Im}\, = \mathbb{R}}$$

    *Piège :* le noyau est l'ensemble des antécédents du neutre *d'arrivée*, qui vaut $0$ pour une loi additive et $1$ pour une loi multiplicative. Aux questions 2 et 5, chercher les $x$ tels que $x^{2}=0$ ou $\frac{1}{x}=0$ n'aurait aucun sens.
- id: "ap-04-12"
  feuille: "f-ap-04"
  numero: 12
  partie: "Noyau et image"
  etoiles: 2
  types: [Calcul]
  mots_cles: [morphismes de groupes, noyau, image, sous-groupes]
  noeuds: [a-morphisme, a-sous-groupe]
  notions: [morphisme-groupes, noyau, sous-groupe]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    La proposition 3 du cours affirme que le noyau et l'image d'un morphisme sont des sous-groupes. L'exploiter pour retrouver, sans aucune vérification directe, les résultats suivants.

    **1.** L'ensemble $\mathbb{U}$ des complexes de module $1$ est un sous-groupe de $(\mathbb{C}^{*}\,;\times)$.

    **2.** L'ensemble $n\mathbb{Z}$ est un sous-groupe de $(\mathbb{Z}\,;+)$.

    **3.** L'ensemble $\big\{(a\,;a) \;|\; a \in \mathbb{Z}\big\}$ est un sous-groupe de $(\mathbb{Z}^{2}\,;+)$.

    **4.** L'ensemble $\mathbb{R}_{+}^{*}$ est un sous-groupe de $(\mathbb{R}^{*}\,;\times)$.

    On précisera à chaque fois le morphisme utilisé, et s'il s'agit d'un noyau ou d'une image.
  corrige: |
    Dans chaque cas, il suffit d'exhiber le bon morphisme : la proposition 3 fait le reste.

    **1.** L'application $z \mapsto |z|$ est un morphisme de $(\mathbb{C}^{*}\,;\times)$ dans $(\mathbb{R}_{+}^{*}\,;\times)$, dont le noyau est $\mathbb{U}$. 
    $$\boxed{\mathbb{U} \text{ est un sous-groupe de } (\mathbb{C}^{*}\,;\times).}$$

    **2.** L'application $k \mapsto nk$ est un endomorphisme de $(\mathbb{Z}\,;+)$, d'image $n\mathbb{Z}$. 
    $$\boxed{n\mathbb{Z} \text{ est un sous-groupe de } (\mathbb{Z}\,;+).}$$

    **3.** L'application $f_{2} : (a\,;b) \mapsto a-b$ de l'exercice 10 est un morphisme de $(\mathbb{Z}^{2}\,;+)$ dans $(\mathbb{Z}\,;+)$, de noyau $\big\{(a\,;a) \;|\; a \in \mathbb{Z}\big\}$. 
    $$\boxed{\big\{(a\,;a) \;|\; a \in \mathbb{Z}\big\} \text{ est un sous-groupe de } (\mathbb{Z}^{2}\,;+).}$$

    **4.** L'application $x \mapsto x^{2}$ est un endomorphisme de $(\mathbb{R}^{*}\,;\times)$, d'image $\mathbb{R}_{+}^{*}$. 
    $$\boxed{\mathbb{R}_{+}^{*} \text{ est un sous-groupe de } (\mathbb{R}^{*}\,;\times).}$$

    Ces quatre résultats avaient demandé, au chapitre 3, autant de vérifications séparées. Un seul théorème les remplace toutes : c'est exactement le gain annoncé par le cours.
- id: "ap-04-13"
  feuille: "f-ap-04"
  numero: 13
  partie: "Noyau et image"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [morphismes de groupes, isomorphismes, noyau, image, injectivité et surjectivité]
  noeuds: [a-morphisme, r-injections]
  notions: [morphisme-groupes, isomorphisme, noyau]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    **1.** Démontrer qu'une application $f : \mathbb{Z} \to \mathbb{Z}$ est un morphisme de $(\mathbb{Z}\,;+)$ dans lui-même si et seulement s'il existe $a \in \mathbb{Z}$ tel que $f(x)=ax$ pour tout $x \in \mathbb{Z}$.

    **(a)** Déterminer alors le noyau et l'image d'un tel morphisme.

    **(b)** À quelle condition sur $a$ ce morphisme est-il un isomorphisme ?

    **(c)** En déduire tous les éléments de $\mathrm{Aut}(\mathbb{Z}\,;+)$.

    **2.** Démontrer qu'une application $f : \mathbb{Z}^{2} \to \mathbb{Z}^{2}$ est un morphisme de $(\mathbb{Z}^{2}\,;+)$ dans lui-même si et seulement s'il existe $(a\,;b\,;c\,;d) \in \mathbb{Z}^{4}$ tel que : 
    $$\forall (x\,;y) \in \mathbb{Z}^{2}, \qquad f(x\,;y)=(ax+cy \,;\, bx+dy)$$

    **(a)** Déterminer le noyau d'un tel morphisme.

    **(b)** Démontrer que $f$ est injectif si et seulement si $ad-bc \neq 0$.
  corrige: |
    **1.** *Sens réciproque.* Si $f(x)=ax$, alors $f(x+y)=a(x+y)=ax+ay=f(x)+f(y)$.

    *Sens direct.* Supposons $f$ morphisme et posons $a=f(1)$. La question 1 de l'exercice 4, écrite additivement, donne $f(n \times 1)=n\,f(1)$ pour tout $n \in \mathbb{Z}$, c'est-à-dire $f(n)=an$. 
    $$\boxed{f \text{ est un morphisme de } (\mathbb{Z}\,;+) \iff \exists a \in \mathbb{Z}, \; \forall x \in \mathbb{Z}, \; f(x)=ax}$$

    **(a)** Le noyau est $\{x \in \mathbb{Z} \mid ax=0\}$ et l'image l'ensemble des multiples de $a$. 
    $$\boxed{\text{Si } a \neq 0 \;:\; \mathrm{Ker}\, f=\{0\} \text{ et } \mathrm{Im}\, f=a\mathbb{Z} \qquad \text{si } a=0 \;:\; \mathrm{Ker}\, f=\mathbb{Z} \text{ et } \mathrm{Im}\, f=\{0\}}$$

    **(b)** Le morphisme est injectif si et seulement si $a \neq 0$, et surjectif si et seulement si $a\mathbb{Z}=\mathbb{Z}$, c'est-à-dire si $a$ divise $1$. 
    $$\boxed{f \text{ est un isomorphisme si et seulement si } a=1 \text{ ou } a=-1.}$$

    **(c)** 
    $$\boxed{\mathrm{Aut}(\mathbb{Z}\,;+)=\big\{\mathrm{Id}_{\mathbb{Z}} \;;\; x \mapsto -x\big\}}$$
     C'est donc un groupe à deux éléments, dans lequel chaque élément est son propre symétrique.

    **2.** *Sens réciproque.* Si $f(x\,;y)=(ax+cy \,;\, bx+dy)$, un calcul direct sur chaque composante montre que $f$ est un morphisme.

    *Sens direct.* Supposons $f$ morphisme, et posons $f(1\,;0)=(a\,;b)$ et $f(0\,;1)=(c\,;d)$. Comme $(x\,;y)=x\,(1\,;0)+y\,(0\,;1)$, la question 1 de l'exercice 4 donne : 
    $$f(x\,;y)=x\,f(1\,;0)+y\,f(0\,;1)=(ax \,;\, bx)+(cy \,;\, dy)=(ax+cy \,;\, bx+dy)$$

    **(a)** 
    $$\boxed{\mathrm{Ker}\, f=\big\{(x\,;y) \in \mathbb{Z}^{2} \;\big|\; ax+cy=0 \text{ et } bx+dy=0\big\}}$$

    **(b)** *Supposons $ad-bc \neq 0$*, et soit $(x\,;y) \in \mathrm{Ker}\, f$. En combinant les deux équations : 
    $$d(ax+cy)-c(bx+dy)=(ad-bc)\,x=0 \qquad\text{et}\qquad a(bx+dy)-b(ax+cy)=(ad-bc)\,y=0$$
     Comme $ad-bc \neq 0$, il vient $x=y=0$, donc $\mathrm{Ker}\, f=\{(0\,;0)\}$ et $f$ est injectif.

    *Supposons $ad-bc=0$.* Si $(c\,;a) \neq (0\,;0)$, le couple non nul $(-c \,;\, a)$ vérifie : 
    $$a(-c)+ca=0 \qquad\text{et}\qquad b(-c)+da=ad-bc=0$$
     donc appartient au noyau. Si $(c\,;a)=(0\,;0)$, on vérifie de même que $(-d \,;\, b)$ convient ; et si de plus $(d\,;b)=(0\,;0)$, alors $f$ est l'application nulle et $\mathrm{Ker}\, f=\mathbb{Z}^{2}$. Dans tous les cas, le noyau n'est pas réduit à $\{(0\,;0)\}$. 
    $$\boxed{f \text{ est injectif si et seulement si } ad-bc \neq 0.}$$
- id: "ap-04-14"
  feuille: "f-ap-04"
  numero: 14
  partie: "Noyau et image"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [morphismes de groupes, isomorphismes, sous-groupes]
  noeuds: [a-morphisme, a-sous-groupe]
  notions: [morphisme-groupes, isomorphisme, sous-groupe]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    On considère l'ensemble : 
    $$H=\big\{(a\,;b) \in \mathbb{Z}^{2} \;\big|\; a-b \text{ est pair}\big\}$$

    **1.** Démontrer que $H$ est un sous-groupe de $(\mathbb{Z}^{2}\,;+)$.

    **2.** On considère l'application : 
    $$\begin{array}{r|ccl} f : & \mathbb{Z}^{2} & \longrightarrow & H \\ & (u\,;v) & \longmapsto & (2u+v \,;\, v) \end{array}$$
     Vérifier que $f$ est bien à valeurs dans $H$, puis démontrer que c'est un isomorphisme de groupes.

    **3.** Que peut-on en conclure sur $H$ et $\mathbb{Z}^{2}$ ?
  corrige: |
    **1.** On a $H \subset \mathbb{Z}^{2}$, et $(0\,;0) \in H$ puisque $0-0=0$ est pair. Soient $(a\,;b)$ et $(a'\,;b')$ dans $H$. Alors : 
    $$(a\,;b)-(a'\,;b')=(a-a' \,;\, b-b') \qquad\text{et}\qquad (a-a')-(b-b')=(a-b)-(a'-b')$$
     qui est une différence de deux entiers pairs, donc un entier pair. 
    $$\boxed{H \text{ est un sous-groupe de } (\mathbb{Z}^{2}\,;+).}$$

    **2.** *$f$ est bien à valeurs dans $H$.* Pour tout $(u\,;v) \in \mathbb{Z}^{2}$ : $(2u+v)-v=2u$, qui est pair.

    *Morphisme.* Pour tous $(u\,;v)$ et $(u'\,;v')$ : 
    $$f\big((u\,;v)+(u'\,;v')\big)=\big(2(u+u')+(v+v') \,;\, v+v'\big)=(2u+v \,;\, v)+(2u'+v' \,;\, v')$$

    *Injectivité.* Soit $(u\,;v) \in \mathrm{Ker}\, f$, c'est-à-dire $2u+v=0$ et $v=0$. La seconde équation donne $v=0$, puis la première $u=0$. Donc $\mathrm{Ker}\, f=\{(0\,;0)\}$.

    *Surjectivité.* Soit $(a\,;b) \in H$. Comme $a-b$ est pair, l'entier $u=\dfrac{a-b}{2}$ est bien dans $\mathbb{Z}$. En posant $v=b$ : 
    $$f(u\,;v)=\big(2u+v \,;\, v\big)=\big((a-b)+b \,;\, b\big)=(a\,;b)$$

    $$\boxed{f \text{ est un isomorphisme de } (\mathbb{Z}^{2}\,;+) \text{ sur } (H\,;+).}$$

    **3.** L'isomorphisme construit à la question précédente donne : 
    $$\boxed{H \text{ et } \mathbb{Z}^{2} \text{ sont isomorphes, bien que } H \text{ soit une partie \emph{stricte} de } \mathbb{Z}^{2}.}$$
     En effet $(1\,;0) \notin H$. On retrouve le phénomène signalé par le cours à propos de $\mathbb{Z}$ et $n\mathbb{Z}$, et repris à l'exercice 17.
- id: "ap-04-15"
  feuille: "f-ap-04"
  numero: 15
  partie: "Injectivité et surjectivité"
  etoiles: 1
  types: [Calcul]
  mots_cles: [morphismes de groupes, noyau, image, injectivité et surjectivité]
  noeuds: [a-morphisme, r-injections]
  notions: [morphisme-groupes, noyau]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Pour chacun des morphismes suivants, déterminer le noyau puis l'image, et conclure quant à l'injectivité et à la surjectivité en appliquant le théorème 1.

    **1.** $\begin{array}{r|ccl} f : & (\mathbb{R}\,;+) & \longrightarrow & (\mathbb{R}_{+}^{*}\,;\times) \\ & x & \longmapsto & \mathrm{e}^{x} \end{array}$

    **2.** $\begin{array}{r|ccl} g : & (\mathbb{C}^{*}\,;\times) & \longrightarrow & (\mathbb{R}_{+}^{*}\,;\times) \\ & z & \longmapsto & |z| \end{array}$

    **3.** $\begin{array}{r|ccl} h : & (\mathbb{Z}\,;+) & \longrightarrow & (\mathbb{Z}\,;+) \\ & k & \longmapsto & 3k \end{array}$

    **4.** $\begin{array}{r|ccl} u : & (\mathbb{R}^{2}\,;+) & \longrightarrow & (\mathbb{R}\,;+) \\ & (x\,;y) & \longmapsto & x+y \end{array}$

    **5.** $\begin{array}{r|ccl} v : & (\mathbb{R}\,;+) & \longrightarrow & (\mathbb{R}^{2}\,;+) \\ & x & \longmapsto & (x \,;\, 2x) \end{array}$
  corrige: |
    **1.** Le neutre d'arrivée est $1$, et $\mathrm{e}^{x}=1$ équivaut à $x=0$. Par ailleurs tout réel strictement positif $y$ s'écrit $\mathrm{e}^{\ln(y)}$. 
    $$\boxed{\mathrm{Ker}\, f=\{0\} \text{ et } \mathrm{Im}\, f=\mathbb{R}_{+}^{*} \text{ : } f \text{ est un isomorphisme.}}$$

    **2.** Le neutre d'arrivée est $1$, et $|z|=1$ définit $\mathbb{U}$. Tout réel $r>0$ est le module du complexe $r$. 
    $$\boxed{\mathrm{Ker}\, g=\mathbb{U} \text{ et } \mathrm{Im}\, g=\mathbb{R}_{+}^{*} \text{ : } g \text{ est surjectif, non injectif.}}$$

    **3.** Le neutre d'arrivée est $0$, et $3k=0$ équivaut à $k=0$. L'image est l'ensemble des multiples de $3$. 
    $$\boxed{\mathrm{Ker}\, h=\{0\} \text{ et } \mathrm{Im}\, h=3\mathbb{Z} \neq \mathbb{Z} \text{ : } h \text{ est injectif, non surjectif.}}$$

    **4.** On a $x+y=0$ si et seulement si $y=-x$. Et tout réel $z$ s'écrit $z+0$. 
    $$\boxed{\mathrm{Ker}\, u=\big\{(x\,;-x) \;|\; x \in \mathbb{R}\big\} \text{ et } \mathrm{Im}\, u=\mathbb{R} \text{ : } u \text{ est surjectif, non injectif.}}$$

    **5.** On a $(x\,;2x)=(0\,;0)$ si et seulement si $x=0$. L'image est la droite d'équation $y=2x$. 
    $$\boxed{\mathrm{Ker}\, v=\{0\} \text{ et } \mathrm{Im}\, v=\big\{(x\,;2x) \;|\; x \in \mathbb{R}\big\} \neq \mathbb{R}^{2} \text{ : } v \text{ est injectif, non surjectif.}}$$
     Le point $(1\,;0)$, par exemple, n'a pas d'antécédent.
- id: "ap-04-16"
  feuille: "f-ap-04"
  numero: 16
  partie: "Injectivité et surjectivité"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [morphismes de groupes, sous-groupes]
  noeuds: [a-morphisme, a-sous-groupe]
  notions: [morphisme-groupes, sous-groupe]
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Soit $f : (G \,;\cdot) \longrightarrow (H \,;\ast)$ un morphisme de groupes.

    **1.** Soit $G'$ un sous-groupe de $G$. Démontrer que $f(G')$ est un sous-groupe de $H$.

    **2.** Soit $H'$ un sous-groupe de $H$. Démontrer que $f^{-1}(H')$ est un sous-groupe de $G$.

    **3.** Démontrer que $\mathrm{Ker}\, f \subset f^{-1}(H')$ pour tout sous-groupe $H'$ de $H$.

    **4.** Retrouver la proposition 3 du cours comme cas particulier des questions 1 et 2.
  corrige: |
    **1.** On a $f(G') \subset H$. De plus $e_{G} \in G'$ et $f(e_{G})=e_{H}$, donc $e_{H} \in f(G')$, qui n'est pas vide.

    Soient $y$ et $y'$ dans $f(G')$ : il existe $x$ et $x'$ dans $G'$ tels que $y=f(x)$ et $y'=f(x')$. Alors, en utilisant la propriété 1 puis la définition d'un morphisme : 
    $$y \ast y'^{-1}=f(x) \ast f(x')^{-1}=f(x) \ast f\big(x'^{-1}\big)=f\big(x \cdot x'^{-1}\big)$$
     et $x \cdot x'^{-1}$ appartient à $G'$, qui est un sous-groupe. 
    $$\boxed{f(G') \text{ est un sous-groupe de } H.}$$

    **2.** On a $f^{-1}(H') \subset G$. De plus $f(e_{G})=e_{H} \in H'$, donc $e_{G} \in f^{-1}(H')$.

    Soient $x$ et $x'$ dans $f^{-1}(H')$, c'est-à-dire $f(x) \in H'$ et $f(x') \in H'$. Alors : 
    $$f\big(x \cdot x'^{-1}\big)=f(x) \ast f(x')^{-1} \in H'$$
     puisque $H'$ est un sous-groupe. Donc $x \cdot x'^{-1} \in f^{-1}(H')$. 
    $$\boxed{f^{-1}(H') \text{ est un sous-groupe de } G.}$$

    **3.** Soit $x \in \mathrm{Ker}\, f$. Alors $f(x)=e_{H}$, et $e_{H} \in H'$ puisque $H'$ est un sous-groupe de $H$. Donc $x \in f^{-1}(H')$. 
    $$\boxed{\mathrm{Ker}\, f \subset f^{-1}(H')}$$

    **4.** Il suffit de particulariser : 
    $$\boxed{\mathrm{Im}\, f=f(G) \text{ (question 1 avec } G'=G) \qquad \mathrm{Ker}\, f=f^{-1}\big(\{e_{H}\}\big) \text{ (question 2 avec } H'=\{e_{H}\})}$$
     L'ensemble $\{e_{H}\}$ est bien un sous-groupe de $H$, et $G$ est un sous-groupe de lui-même : la proposition 3 est donc un cas particulier des deux premières questions.
- id: "ap-04-17"
  feuille: "f-ap-04"
  numero: 17
  partie: "Injectivité et surjectivité"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [morphismes de groupes, isomorphismes, endomorphismes et automorphismes, injectivité et surjectivité]
  noeuds: [a-morphisme, r-injections]
  notions: [morphisme-groupes, isomorphisme]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    **1.** Démontrer que $k \mapsto 2k$ est un endomorphisme de $(\mathbb{Z}\,;+)$, injectif mais non surjectif.

    **2.** En déduire que $(\mathbb{Z}\,;+)$ et $(2\mathbb{Z}\,;+)$ sont isomorphes, bien que $2\mathbb{Z}$ soit une partie *stricte* de $\mathbb{Z}$.

    **3.** Rapprocher ce résultat de l'exercice 10 du chapitre 2, où l'on construisait une bijection de $\mathbb{N}$ sur l'ensemble des entiers naturels pairs. Commenter.

    **4.** Un endomorphisme injectif d'un groupe *fini* peut-il ne pas être surjectif ? Justifier.
  corrige: |
    **1.** L'application $k \mapsto 2k$ vérifie $2(k+k')=2k+2k'$ : c'est un endomorphisme de $(\mathbb{Z}\,;+)$. Son noyau est $\{k \in \mathbb{Z} \mid 2k=0\}=\{0\}$, donc elle est injective ; son image est $2\mathbb{Z}$, et l'entier $1$ n'a pas d'antécédent. 
    $$\boxed{\text{C'est un endomorphisme injectif et non surjectif de } (\mathbb{Z}\,;+).}$$

    **2.** En restreignant l'ensemble d'arrivée à $2\mathbb{Z}$, l'application devient surjective sans cesser d'être injective ni d'être un morphisme. 
    $$\boxed{(\mathbb{Z}\,;+) \text{ et } (2\mathbb{Z}\,;+) \text{ sont isomorphes.}}$$
     Pourtant $2\mathbb{Z}$ est une partie stricte de $\mathbb{Z}$, puisque $1 \notin 2\mathbb{Z}$.

    **3.** Au chapitre 2, on avait construit une *bijection* de $\mathbb{N}$ sur l'ensemble des entiers naturels pairs : les deux ensembles avaient donc « autant » d'éléments. Ici on obtient davantage : un *isomorphisme*, qui respecte en outre la loi de groupe. 
    $$\boxed{\begin{array}{l} \text{Un ensemble infini peut être en bijection avec une de ses parties strictes ;} \\[1mm] \text{un groupe infini peut être isomorphe à l'un de ses sous-groupes stricts.} \end{array}}$$

    **4.** Si $G$ est fini et $f$ injectif, alors $f$ réalise une bijection de $G$ sur $\mathrm{Im}\, f$, qui possède donc autant d'éléments que $G$. Comme $\mathrm{Im}\, f \subset G$ et que $G$ est fini, il vient $\mathrm{Im}\, f=G$. 
    $$\boxed{\text{Non : pour un groupe fini, tout endomorphisme injectif est surjectif.}}$$
     C'est précisément la finitude qui interdit à un ensemble d'être en bijection avec une partie stricte.
- id: "ap-04-18"
  feuille: "f-ap-04"
  numero: 18
  titre: "Vrai ou faux"
  partie: "Exercices de synthèse"
  etoiles: 0
  types: [Vrai ou faux]
  mots_cles: [morphismes de groupes, isomorphismes, noyau, image, injectivité et surjectivité, sous-groupes]
  noeuds: [a-morphisme, r-injections, a-sous-groupe]
  notions: [morphisme-groupes, isomorphisme, noyau, sous-groupe]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Pour chaque affirmation, dire si elle est vraie ou fausse en justifiant la réponse. Dans tout l'exercice, $f$ désigne un morphisme du groupe $(G \,;\cdot)$ dans le groupe $(H \,;\ast)$.

    **1.** Un morphisme envoie toujours le neutre de $G$ sur le neutre de $H$.

    **2.** Toute application de $G$ dans $H$ envoyant le neutre sur le neutre est un morphisme.

    **3.** Le noyau de $f$ est un sous-groupe de $G$.

    **4.** L'image de $f$ est un sous-groupe de $G$.

    **5.** Le morphisme $f$ est injectif si et seulement si son noyau est réduit au neutre de $G$.

    **6.** La composée de deux morphismes de groupes est un morphisme de groupes.

    **7.** Si $f$ est un isomorphisme, alors $f^{-1}$ en est un également.

    **8.** Il existe un isomorphisme de $(\mathbb{R}\,;+)$ sur $(\mathbb{R}_{+}^{*}\,;\times)$.

    **9.** L'application $x \mapsto x^{-1}$ est un morphisme de tout groupe dans lui-même.

    **10.** Un groupe infini ne peut pas être isomorphe à l'un de ses sous-groupes stricts.
  corrige: |
    **1.** $\boxed{\textbf{Vraie}}$ C'est la propriété 1 du cours, démontrée en appliquant $f$ à l'égalité $e_{G} \cdot e_{G}=e_{G}$.

    **2.** $\boxed{\textbf{Fausse}}$ L'application $x \mapsto x^{2}$ de $(\mathbb{R}\,;+)$ dans $(\mathbb{R}\,;+)$ envoie $0$ sur $0$, sans être un morphisme (exercice 1). Le test du neutre élimine, il ne valide pas.

    **3.** $\boxed{\textbf{Vraie}}$ C'est la proposition 3.

    **4.** $\boxed{\textbf{Fausse}}$ L'image est un sous-groupe de $H$, l'ensemble d'*arrivée*. Elle n'est en général même pas incluse dans $G$.

    **5.** $\boxed{\textbf{Vraie}}$ C'est le théorème 1, et c'est lui que l'on utilise en pratique.

    **6.** $\boxed{\textbf{Vraie}}$ C'est le premier point de la propriété 2.

    **7.** $\boxed{\textbf{Vraie}}$ C'est le second point de la propriété 2.

    **8.** $\boxed{\textbf{Vraie}}$ L'exponentielle en est un, de réciproque le logarithme (exercice 7).

    **9.** $\boxed{\textbf{Fausse}}$ Ce n'est vrai que si $G$ est abélien, comme l'établit l'exercice 3. Dans $\mathcal{S}\big(\{1\,;2\,;3\}\big)$, c'est faux.

    **10.** $\boxed{\textbf{Fausse}}$ Les groupes $(\mathbb{Z}\,;+)$ et $(2\mathbb{Z}\,;+)$ sont isomorphes (exercice 17), et $2\mathbb{Z}$ est une partie stricte de $\mathbb{Z}$.
- id: "ap-04-19"
  feuille: "f-ap-04"
  numero: 19
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [morphismes de groupes, isomorphismes, noyau, injectivité et surjectivité, sous-groupes, groupes abéliens]
  noeuds: [a-morphisme, r-injections, a-sous-groupe, a-groupe]
  notions: [morphisme-groupes, isomorphisme, noyau, sous-groupe]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    On munit $\mathbb{R}^{2}$ de la loi $\ast$ définie par : 
    $$\forall \big((x\,;y)\,;(x'\,;y')\big) \in \big(\mathbb{R}^{2}\big)^{2}, \qquad (x\,;y) \ast (x'\,;y') = \big(xx'-yy' \,;\, xy'+x'y\big)$$
     On note enfin $\mathcal{C}=\big\{(x\,;y) \in \mathbb{R}^{2} \;\big|\; x^{2}+y^{2}=1\big\}$ le cercle unité.

    **1.** Vérifier l'identité suivante, valable pour tous réels $x$, $y$, $x'$ et $y'$ : 
    $$\big(xx'-yy'\big)^{2}+\big(xy'+x'y\big)^{2} = \big(x^{2}+y^{2}\big)\big(x'^{2}+y'^{2}\big)$$

    **2.** En déduire que $\ast$ est une loi interne sur $\mathbb{R}^{2} \setminus \{(0\,;0)\}$, puis démontrer que $\big(\mathbb{R}^{2} \setminus \{(0\,;0)\} \,;\ast\big)$ est un groupe abélien.

    **3.** Démontrer que $\mathcal{C}$ en est un sous-groupe.

    **4.** Démontrer que l'application suivante est un isomorphisme de groupes : 
    $$\begin{array}{r|ccl} f : & \big(\mathbb{R}^{2} \setminus \{(0\,;0)\} \,;\ast\big) & \longrightarrow & (\mathbb{C}^{*}\,;\times) \\ & (x\,;y) & \longmapsto & x+\mathrm{i}y \end{array}$$

    **5.** En déduire que la restriction de $f$ à $\mathcal{C}$ induit un isomorphisme de $\mathcal{C}$ sur $\mathbb{U}$.

    **6.** On admet les formules d'addition, valables pour tous réels $a$ et $b$ : 
    $$\cos(a+b)=\cos(a)\cos(b)-\sin(a)\sin(b) \qquad \sin(a+b)=\sin(a)\cos(b)+\sin(b)\cos(a)$$
     Démontrer que l'application ci-dessous est un morphisme de groupes surjectif, puis déterminer son noyau. 
    $$\begin{array}{r|ccl} \varphi : & (\mathbb{R}\,;+) & \longrightarrow & (\mathcal{C}\,;\ast) \\ & \theta & \longmapsto & \big(\cos(\theta) \,;\, \sin(\theta)\big) \end{array}$$
  corrige: |
    **1.** On développe les deux carrés : 
    $$\begin{aligned} \big(xx'-yy'\big)^{2}+\big(xy'+x'y\big)^{2} &= x^{2}x'^{2}-2xx'yy'+y^{2}y'^{2}+x^{2}y'^{2}+2xy'x'y+x'^{2}y^{2}\\ &= x^{2}x'^{2}+x^{2}y'^{2}+y^{2}x'^{2}+y^{2}y'^{2}\\ &= x^{2}\big(x'^{2}+y'^{2}\big)+y^{2}\big(x'^{2}+y'^{2}\big) = \big(x^{2}+y^{2}\big)\big(x'^{2}+y'^{2}\big) \end{aligned}$$
     les deux doubles produits se compensant.

    **2.** *Internité.* Si $(x\,;y)$ et $(x'\,;y')$ sont non nuls, alors $x^{2}+y^{2}>0$ et $x'^{2}+y'^{2}>0$, donc leur produit est strictement positif. D'après la question 1, il en va de même de la somme des carrés des deux coordonnées du résultat, qui n'est donc pas le couple nul.

    *Commutativité.* Les deux expressions $xx'-yy'$ et $xy'+x'y$ sont inchangées lorsqu'on échange $(x\,;y)$ et $(x'\,;y')$.

    *Associativité.* Un calcul direct montre que les deux parenthésages donnent tous deux : 
    $$\big(xx'x''-xy'y''-yx'y''-yy'x'' \;;\; xx'y''+xy'x''+yx'x''-yy'y''\big)$$

    *Neutre.* $(x\,;y) \ast (1\,;0)=(x \times 1 - y \times 0 \,;\, x \times 0 + 1 \times y)=(x\,;y)$, et de même à gauche.

    *Symétrique.* En posant $N=x^{2}+y^{2}>0$, on vérifie que $\left(\dfrac{x}{N} \,;\, \dfrac{-y}{N}\right)$ convient : 
    $$(x\,;y) \ast \left(\frac{x}{N} \,;\, \frac{-y}{N}\right)=\left(\frac{x^{2}+y^{2}}{N} \,;\, \frac{-xy+xy}{N}\right)=(1\,;0)$$

    $$\boxed{\big(\mathbb{R}^{2} \setminus \{(0\,;0)\} \,;\ast\big) \text{ est un groupe abélien.}}$$

    **3.** On a $\mathcal{C} \subset \mathbb{R}^{2} \setminus \{(0\,;0)\}$, et $(1\,;0) \in \mathcal{C}$. Soient $(x\,;y)$ et $(x'\,;y')$ dans $\mathcal{C}$. Le symétrique de $(x'\,;y')$ est $(x'\,;-y')$, puisque $N=1$, et il appartient à $\mathcal{C}$. Enfin, d'après la question 1, la somme des carrés des coordonnées du produit vaut $1 \times 1=1$. 
    $$\boxed{\mathcal{C} \text{ est un sous-groupe de } \big(\mathbb{R}^{2} \setminus \{(0\,;0)\} \,;\ast\big).}$$

    **4.** Pour tous $(x\,;y)$ et $(x'\,;y')$ non nuls : 
    $$f\big((x\,;y) \ast (x'\,;y')\big)=\big(xx'-yy'\big)+\mathrm{i}\big(xy'+x'y\big)=(x+\mathrm{i}y)(x'+\mathrm{i}y')=f(x\,;y) \times f(x'\,;y')$$
     De plus $f$ est bijective, de réciproque $z \mapsto \big(\mathcal{R}e(z) \,;\, \mathcal{I}m(z)\big)$. 
    $$\boxed{f \text{ est un isomorphisme de } \big(\mathbb{R}^{2} \setminus \{(0\,;0)\} \,;\ast\big) \text{ sur } (\mathbb{C}^{*}\,;\times).}$$

    **5.** La restriction de $f$ à $\mathcal{C}$ reste un morphisme et reste injective. Son image est : 
    $$f(\mathcal{C})=\big\{x+\mathrm{i}y \;\big|\; x^{2}+y^{2}=1\big\}=\big\{z \in \mathbb{C} \;\big|\; |z|=1\big\}=\mathbb{U}$$

    $$\boxed{f \text{ induit un isomorphisme de } (\mathcal{C}\,;\ast) \text{ sur } (\mathbb{U}\,;\times).}$$

    **6.** *Morphisme.* Pour tous réels $a$ et $b$, les formules d'addition donnent : 
    $$\varphi(a+b)=\big(\cos(a+b) \,;\, \sin(a+b)\big)=\big(\cos a \cos b-\sin a \sin b \,;\, \cos a \sin b + \cos b \sin a\big)$$
     ce qui est exactement $\big(\cos a \,;\, \sin a\big) \ast \big(\cos b \,;\, \sin b\big)=\varphi(a) \ast \varphi(b)$.

    *Surjectivité.* Soit $(x\,;y) \in \mathcal{C}$, c'est-à-dire $x^{2}+y^{2}=1$. Il existe alors un réel $\theta$ tel que $x=\cos\theta$ et $y=\sin\theta$ : le point appartient au cercle trigonométrique.

    *Noyau.* Le neutre de $(\mathcal{C}\,;\ast)$ est $(1\,;0)$, et : 
    $$\begin{aligned} \varphi(\theta)=(1\,;0) &\iff \cos\theta=1 \;\text{ et }\; \sin\theta=0\\ &\iff \theta \in 2\pi\mathbb{Z} \end{aligned}$$

    $$\boxed{\varphi \text{ est un morphisme surjectif, de noyau } \mathrm{Ker}\, \varphi = 2\pi\mathbb{Z}.}$$
     Le noyau n'est pas réduit au neutre : d'après le théorème 1, l'application $\varphi$ n'est donc pas injective. On lit ainsi la périodicité du sinus et du cosinus.
- id: "ap-04-20"
  feuille: "f-ap-04"
  numero: 20
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [morphismes de groupes, noyau, image, sous-groupes, "ordre d'un élément"]
  noeuds: [a-morphisme, a-sous-groupe, z-ideaux]
  notions: [morphisme-groupes, noyau, sous-groupe]
  page_enonce: 6
  page_corrige: 11
  enonce: |
    Soit $(G \,;\cdot)$ un groupe de neutre $e$, et $a$ un élément de $G$. On admet que $a^{m+n}=a^{m} \cdot a^{n}$ pour tous entiers relatifs $m$ et $n$, et l'on considère : 
    $$\begin{array}{r|ccl} \varphi_{a} : & (\mathbb{Z}\,;+) & \longrightarrow & (G\,;\cdot) \\ & n & \longmapsto & a^{n} \end{array}$$

    **1.** Démontrer que $\varphi_{a}$ est un morphisme de groupes.

    **2.** En déduire que $\big\{a^{n} \;|\; n \in \mathbb{Z}\big\}$ est un sous-groupe de $G$. On l'appelle le *sous-groupe engendré* par $a$.

    **3.** Démontrer que $\mathrm{Ker}\, \varphi_{a}$ est un sous-groupe de $(\mathbb{Z}\,;+)$. En admettant le résultat annoncé au chapitre 3, selon lequel tout sous-groupe de $(\mathbb{Z}\,;+)$ s'écrit $d\mathbb{Z}$ pour un unique $d \in \mathbb{N}$, en déduire l'existence de cet entier $d$.

    **4.** Interpréter les deux cas $d=0$ et $d>0$. Dans le second, l'entier $d$ est appelé l'*ordre* de $a$.

    **5.** Application : dans le groupe $\mathbb{U}_{4}=\{1 \,;\mathrm{i} \,;-1 \,;-\mathrm{i}\}$, déterminer le noyau et l'image de $\varphi_{\mathrm{i}}$, puis l'ordre de $\mathrm{i}$.

    **6.** Application : dans $(\mathbb{R}^{*}\,;\times)$, déterminer l'ordre de $-1$, puis celui de $2$.
  corrige: |
    **1.** Pour tous entiers relatifs $m$ et $n$, la relation admise donne : 
    $$\varphi_{a}(m+n)=a^{m+n}=a^{m} \cdot a^{n}=\varphi_{a}(m) \cdot \varphi_{a}(n)$$

    $$\boxed{\varphi_{a} \text{ est un morphisme de } (\mathbb{Z}\,;+) \text{ dans } (G\,;\cdot).}$$

    **2.** L'ensemble $\big\{a^{n} \;|\; n \in \mathbb{Z}\big\}$ n'est autre que $\mathrm{Im}\, \varphi_{a}$, et la proposition 3 s'applique. 
    $$\boxed{\big\{a^{n} \;|\; n \in \mathbb{Z}\big\} \text{ est un sous-groupe de } G.}$$

    **3.** D'après la proposition 3, $\mathrm{Ker}\, \varphi_{a}$ est un sous-groupe de $(\mathbb{Z}\,;+)$. Le résultat admis au chapitre 3 donne alors : 
    $$\boxed{\text{Il existe un unique } d \in \mathbb{N} \text{ tel que } \mathrm{Ker}\, \varphi_{a}=d\mathbb{Z}.}$$

    **4.** On distingue les deux cas.

    • Si $d=0$, alors $\mathrm{Ker}\, \varphi_{a}=\{0\}$ : d'après le théorème 1, $\varphi_{a}$ est injectif. Les puissances $a^{n}$ sont donc deux à deux distinctes, et le sous-groupe engendré par $a$ est infini.

    • Si $d>0$, alors $a^{d}=e$, et les entiers $n$ vérifiant $a^{n}=e$ sont exactement les multiples de $d$. En particulier $d$ est le plus petit entier strictement positif tel que $a^{d}=e$.

    $$\boxed{\text{Dans le second cas, } d \text{ est appelé l'\emph{ordre} de } a.}$$

    **5.** On a $\mathrm{i}^{1}=\mathrm{i}$, $\mathrm{i}^{2}=-1$, $\mathrm{i}^{3}=-\mathrm{i}$ et $\mathrm{i}^{4}=1$. Ainsi $\mathrm{i}^{n}=1$ si et seulement si $n$ est un multiple de $4$. 
    $$\boxed{\mathrm{Ker}\, \varphi_{\mathrm{i}}=4\mathbb{Z} \quad;\quad \mathrm{Im}\, \varphi_{\mathrm{i}}=\mathbb{U}_{4} \quad;\quad \mathrm{i} \text{ est d'ordre } 4.}$$

    **6.** Dans $(\mathbb{R}^{*}\,;\times)$, le neutre est $1$. On a $(-1)^{n}=1$ si et seulement si $n$ est pair, tandis que $2^{n}=1$ si et seulement si $n=0$. 
    $$\boxed{\mathrm{Ker}\, \varphi_{-1}=2\mathbb{Z} \text{ : l'élément } -1 \text{ est d'ordre } 2.}$$

    $$\boxed{\mathrm{Ker}\, \varphi_{2}=\{0\}=0\mathbb{Z} \text{ : l'élément } 2 \text{ n'est pas d'ordre fini.}}$$
     Ce dernier cas fournit d'ailleurs un isomorphisme de $(\mathbb{Z}\,;+)$ sur le sous-groupe $\big\{2^{n} \;|\; n \in \mathbb{Z}\big\}$ de $(\mathbb{R}^{*}\,;\times)$, et l'on retrouve une fois de plus qu'un groupe infini peut être isomorphe à un sous-groupe strict.

