  enonce: |
    On considère un triangle $ABC$. Le point $R$ appartient à la droite $(AB)$, le point $S$ au segment $[AC]$ et le point $T$ au segment $[BC]$. Les points marqués en gris sur la figure partagent chaque segment en parts égales.

    ![Figure](documents/figures/1dc781b57d812049.svg)

    **Question préliminaire.** À l'aide de la figure, déterminer les réels $\alpha$, $\beta$ et $\gamma$ tels que : 
    $$\overrightarrow{AR}=\alpha\,\overrightarrow{AB} \qquad ; \qquad \overrightarrow{AS}=\beta\,\overrightarrow{AC} \qquad ; \qquad \overrightarrow{BT}=\gamma\,\overrightarrow{BC}$$

    On se propose de démontrer que les points $R$, $S$ et $T$ sont alignés, par deux méthodes différentes.

    **Partie A : méthode vectorielle.**

    **1.** Démontrer que $\overrightarrow{RS}=\dfrac{1}{2}\overrightarrow{AB}+\dfrac{1}{3}\overrightarrow{AC}$.

    **2.** Démontrer que $\overrightarrow{AT}=\dfrac{2}{5}\overrightarrow{AB}+\dfrac{3}{5}\overrightarrow{AC}$.

    *On pourra écrire $\overrightarrow{AT}=\overrightarrow{AB}+\overrightarrow{BT}$, puis exprimer $\overrightarrow{BC}$ en fonction de $\overrightarrow{AB}$ et $\overrightarrow{AC}$.*

    **3.** En déduire l'expression de $\overrightarrow{RT}$ en fonction de $\overrightarrow{AB}$ et $\overrightarrow{AC}$.

    **4.** Vérifier que $\overrightarrow{RS}=\dfrac{5}{9}\overrightarrow{RT}$, puis conclure.

    **Partie B : méthode analytique.**

    On se place désormais dans le repère $\left(A\,;B,C\right)$.

    **5.** Donner les coordonnées des points $A$, $B$, $C$, $R$ et $S$.

    **6.** Déterminer les coordonnées du point $T$.

    **7.** Démontrer que $\overrightarrow{ST}$ a pour coordonnées $\begin{pmatrix} \frac{2}{5} \\[1mm] \frac{4}{15} \end{pmatrix}$.

    **8.** Calculer les coordonnées de $\overrightarrow{SR}$, puis démontrer que $\overrightarrow{ST}$ et $\overrightarrow{SR}$ sont colinéaires.

    **9.** Conclure. Laquelle des deux méthodes vous paraît la plus rapide ? La plus générale ?
  corrige: |
    **Question préliminaire.**

    On lit sur la figure, en s'appuyant sur les points de subdivision.

    • Le point marqué sur $[AB]$ en est le milieu. Le point $R$ se trouve de l'autre côté de $A$, à la même distance : $\overrightarrow{AR}$ est donc de sens contraire à $\overrightarrow{AB}$ et de longueur moitié.

    • Les deux points marqués sur $[AC]$ le partagent en trois parts égales, et $S$ est le premier en partant de $A$.

    • Les quatre points marqués sur $[BC]$ le partagent en cinq parts égales, et $T$ est le troisième en partant de $B$.

    $$\boxed{\alpha=-\frac{1}{2} \qquad ; \qquad \beta=\frac{1}{3} \qquad ; \qquad \gamma=\frac{3}{5}}$$

    **Partie A : méthode vectorielle.**

    **1.** On introduit le point $A$ par la relation de Chasles : 
    $$\begin{aligned} \overrightarrow{RS} &= \overrightarrow{RA}+\overrightarrow{AS}=-\overrightarrow{AR}+\overrightarrow{AS} \\ &= -\left(-\frac{1}{2}\overrightarrow{AB}\right)+\frac{1}{3}\overrightarrow{AC} \end{aligned}$$

    $$\boxed{\overrightarrow{RS}=\frac{1}{2}\overrightarrow{AB}+\frac{1}{3}\overrightarrow{AC}}$$

    **2.** On part de $\overrightarrow{AT}=\overrightarrow{AB}+\overrightarrow{BT}$, puis on exprime $\overrightarrow{BC}$ en fonction de $\overrightarrow{AB}$ et $\overrightarrow{AC}$ : 
    $$\overrightarrow{BC}=\overrightarrow{BA}+\overrightarrow{AC}=\overrightarrow{AC}-\overrightarrow{AB}$$
     d'où : 
    $$\begin{aligned} \overrightarrow{AT} &= \overrightarrow{AB}+\frac{3}{5}\overrightarrow{BC} = \overrightarrow{AB}+\frac{3}{5}\left(\overrightarrow{AC}-\overrightarrow{AB}\right) \\ &= \left(1-\frac{3}{5}\right)\overrightarrow{AB}+\frac{3}{5}\overrightarrow{AC} \end{aligned}$$

    $$\boxed{\overrightarrow{AT}=\frac{2}{5}\overrightarrow{AB}+\frac{3}{5}\overrightarrow{AC}}$$

    **3.** De même que pour $\overrightarrow{RS}$ : 
    $$\begin{aligned} \overrightarrow{RT} &= \overrightarrow{RA}+\overrightarrow{AT}=\frac{1}{2}\overrightarrow{AB} +\frac{2}{5}\overrightarrow{AB}+\frac{3}{5}\overrightarrow{AC} \\ &= \left(\frac{5}{10}+\frac{4}{10}\right)\overrightarrow{AB}+\frac{3}{5}\overrightarrow{AC} \end{aligned}$$

    $$\boxed{\overrightarrow{RT}=\frac{9}{10}\overrightarrow{AB}+\frac{3}{5}\overrightarrow{AC}}$$

    **4.** On multiplie l'expression précédente par $\dfrac{5}{9}$ : 
    $$\frac{5}{9}\,\overrightarrow{RT}=\frac{5}{9}\times\frac{9}{10}\overrightarrow{AB} +\frac{5}{9}\times\frac{3}{5}\overrightarrow{AC} =\frac{1}{2}\overrightarrow{AB}+\frac{1}{3}\overrightarrow{AC}$$
     On reconnaît exactement l'expression de $\overrightarrow{RS}$ obtenue à la question 1 : 
    $$\boxed{\overrightarrow{RS}=\frac{5}{9}\,\overrightarrow{RT}}$$
     Les vecteurs $\overrightarrow{RS}$ et $\overrightarrow{RT}$ sont donc colinéaires : 
    $$\boxed{\text{Les points } R, \; S \text{ et } T \text{ sont alignés}}$$

    **Partie B : méthode analytique.**

    **5.** Dans le repère $\left(A\,;B,C\right)$, le point $A$ est l'origine et les vecteurs de base sont $\overrightarrow{AB}$ et $\overrightarrow{AC}$. Les coordonnées d'un point $M$ sont donc les coefficients de $\overrightarrow{AM}$ dans cette base. 
    $$\boxed{A(0\,;0) \quad ; \quad B(1\,;0) \quad ; \quad C(0\,;1)}$$
     Comme $\overrightarrow{AR}=-\dfrac{1}{2}\overrightarrow{AB}$ et $\overrightarrow{AS}=\dfrac{1}{3}\overrightarrow{AC}$ : 
    $$\boxed{R\left(-\frac{1}{2}\,;0\right) \qquad ; \qquad S\left(0\,;\frac{1}{3}\right)}$$

    **6.** La question 2 de la partie A a établi que $\overrightarrow{AT}=\dfrac{2}{5}\overrightarrow{AB}+\dfrac{3}{5}\overrightarrow{AC}$ : 
    $$\boxed{T\left(\frac{2}{5}\,;\frac{3}{5}\right)}$$

    **7.** 
    $$\overrightarrow{ST}\begin{pmatrix} \frac{2}{5}-0 \\[1mm] \frac{3}{5}-\frac{1}{3} \end{pmatrix}$$
     La seconde coordonnée vaut $\dfrac{3}{5}-\dfrac{1}{3}=\dfrac{9}{15}-\dfrac{5}{15}=\dfrac{4}{15}$. 
    $$\boxed{\overrightarrow{ST}\begin{pmatrix} \frac{2}{5} \\[1mm] \frac{4}{15} \end{pmatrix}}$$

    **8.** 
    $$\overrightarrow{SR}\begin{pmatrix} -\frac{1}{2}-0 \\[1mm] 0-\frac{1}{3} \end{pmatrix} =\boxed{\begin{pmatrix} -\frac{1}{2} \\[1mm] -\frac{1}{3} \end{pmatrix}}$$
     On calcule le déterminant : 
    $$\det\left(\overrightarrow{ST},\overrightarrow{SR}\right) =\frac{2}{5}\times\left(-\frac{1}{3}\right) -\left(-\frac{1}{2}\right)\times\frac{4}{15} =-\frac{2}{15}+\frac{4}{30}=-\frac{2}{15}+\frac{2}{15}=0$$

    $$\boxed{\overrightarrow{ST} \text{ et } \overrightarrow{SR} \text{ sont colinéaires}}$$

    **9.** Les vecteurs $\overrightarrow{ST}$ et $\overrightarrow{SR}$ ayant la même origine $S$ et étant colinéaires : 
    $$\boxed{\text{Les points } R, \; S \text{ et } T \text{ sont alignés}}$$

    Comparaison des deux méthodes. La méthode analytique est plus rapide et plus mécanique : une fois le repère choisi, tout se ramène à des calculs de coordonnées, sans qu'il faille deviner quelle relation de Chasles introduire. La méthode vectorielle est en revanche plus générale, car elle n'exige aucun repère et fournit directement le coefficient $\dfrac{5}{9}$ liant les deux vecteurs, ce qui renseigne sur la position relative des trois points.
