  enonce: |
    Pour chaque question, une seule réponse est exacte. La justifier.

    ```tableau
    **Question** ¦ **Réponse A** ¦ **Réponse B** ¦ **Réponse C**
    1. $\overrightarrow{AB}+\overrightarrow{BC}$ est égal à : ¦ $\overrightarrow{AC}$ ¦ $\overrightarrow{CA}$ ¦ $\overrightarrow{BA}$
    2. L'opposé de $\overrightarrow{MN}$ est : ¦ $\overrightarrow{MN}$ ¦ $\overrightarrow{NM}$ ¦ $\vec{0}$
    3. Si $A(1\,;3)$ et $B(4\,;-1)$, alors $\overrightarrow{AB}$ a pour coordonnées : ¦ $\begin{pmatrix}3\\-4\end{pmatrix}$ ¦ $\begin{pmatrix}-3\\4\end{pmatrix}$ ¦ $\begin{pmatrix}5\\2\end{pmatrix}$
    4. Si $\vec{u}\begin{pmatrix}2\\-1\end{pmatrix}$, alors $-3\vec{u}$ a pour coordonnées : ¦ $\begin{pmatrix}-6\\3\end{pmatrix}$ ¦ $\begin{pmatrix}-6\\-3\end{pmatrix}$ ¦ $\begin{pmatrix}6\\3\end{pmatrix}$
    5. Le déterminant de $\begin{pmatrix}2\\5\end{pmatrix}$ et $\begin{pmatrix}3\\1\end{pmatrix}$ vaut : ¦ $17$ ¦ $-13$ ¦ $13$
    6. Deux vecteurs sont colinéaires si et seulement si : ¦ leur somme est nulle ¦ leur déterminant est nul ¦ ils ont même longueur
    7. $\overrightarrow{AB}=\overrightarrow{CD}$ signifie que : ¦ $ABCD$ est un parallélogramme ¦ $ABDC$ est un parallélogramme ¦ $ACBD$ est un parallélogramme
    8. Dans un repère orthonormé, la norme de $\begin{pmatrix}-3\\4\end{pmatrix}$ vaut : ¦ $1$ ¦ $5$ ¦ $7$
    9. $\overrightarrow{AB}-\overrightarrow{AC}$ est égal à : ¦ $\overrightarrow{BC}$ ¦ $\overrightarrow{CB}$ ¦ $\overrightarrow{BA}$
    10. Si $I$ est le milieu de $[AB]$, alors : ¦ $\overrightarrow{IA}+\overrightarrow{IB}=\vec{0}$ ¦ $\overrightarrow{IA}=\overrightarrow{IB}$ ¦ $\overrightarrow{AI}=\overrightarrow{BI}$
    ```
  corrige: |
    ```tableau
    **Question** ¦ **Réponse** ¦ **Justification**
    1 ¦ **A** ¦ C'est la relation de Chasles : le point intermédiaire $B$ disparaît.
    2 ¦ **B** ¦ L'opposé de $\overrightarrow{MN}$ s'obtient en inversant le sens, donc en échangeant les deux lettres.
    3 ¦ **A** ¦ $\overrightarrow{AB}\begin{pmatrix} 4-1 \\ -1-3 \end{pmatrix}$. La réponse B correspond à $\overrightarrow{BA}$.
    4 ¦ **A** ¦ On multiplie chaque coordonnée par $-3$ : $-3\times 2=-6$ et $-3\times(-1)=3$.
    5 ¦ **B** ¦ $2\times 1-3\times 5=2-15=-13$. La réponse A oublie le signe moins entre les deux produits.
    6 ¦ **B** ¦ C'est le théorème 2 du cours.
    7 ¦ **B** ¦ On parcourt $A\to B$, puis on rejoint $D$, extrémité du second vecteur, avant de revenir par $C$.
    8 ¦ **B** ¦ $\sqrt{(-3)^{2}+4^{2}}=\sqrt{25}=5$.
    9 ¦ **B** ¦ $\overrightarrow{AB}-\overrightarrow{AC}=\overrightarrow{AB}+\overrightarrow{CA}=\overrightarrow{CA}+\overrightarrow{AB}=\overrightarrow{CB}$.
    10 ¦ **A** ¦ Les vecteurs $\overrightarrow{IA}$ et $\overrightarrow{IB}$ sont opposés, donc de somme nulle. La réponse B est fausse : ils ont des sens contraires.
    ```
- id: "s-10-25"
  feuille: "f-s-10"
  numero: 25
  titre: "Vrai ou faux"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [égalité de vecteurs, norme, colinéarité, alignement, vecteurs]
  noeuds: [v-espace, gd-normes, v-libre, v-determinant]
  notions: [norme, determinant, espace-vectoriel]
  page_enonce: 8
  page_corrige: 14
  enonce: |
    Chacune des affirmations suivantes est-elle vraie ou fausse ? Justifier la réponse : par une démonstration si l'affirmation est vraie, par un contre-exemple sinon.

    **1.** Deux vecteurs de même longueur sont égaux.

    **2.** Deux vecteurs égaux ont la même longueur.

    **3.** Le vecteur nul est colinéaire à tout vecteur.

    **4.** Si $\overrightarrow{AB}=\overrightarrow{CD}$, alors $AB=CD$.

    **5.** Si $AB=CD$, alors $\overrightarrow{AB}=\overrightarrow{CD}$.

    **6.** Pour tous points $A$ et $B$, $\overrightarrow{AB}+\overrightarrow{BA}=\vec{0}$.

    **7.** Si deux vecteurs ont un déterminant nul, alors ils ont la même direction.

    **8.** Trois points $A$, $B$ et $C$ sont alignés si et seulement si $\det\left(\overrightarrow{AB},\overrightarrow{AC}\right)=0$.

    **9.** Le vecteur $2\vec{u}$ a une longueur double de celle de $\vec{u}$.

    **10.** Le vecteur $-\vec{u}$ a une longueur négative.
  corrige: |
    **1.** **Fausse**. Il faut aussi la même direction et le même sens. Contre-exemple : $\overrightarrow{AB}$ et $\overrightarrow{BA}$ ont la même longueur mais ne sont pas égaux, ils sont opposés.

    **2.** **Vraie**. C'est l'une des trois conditions de l'égalité de deux vecteurs : direction, sens *et* longueur.

    **3.** **Vraie**. La définition du cours prévoit précisément ce cas : deux vecteurs sont colinéaires dès que l'un des deux est nul. On le vérifie aussi par le déterminant : $0\times y'-x'\times 0=0$.

    **4.** **Vraie**. Si les deux vecteurs sont égaux, ils ont en particulier la même longueur, et $\left\|\overrightarrow{AB}\right\|=AB$.

    **5.** **Fausse**. C'est la réciproque de la précédente, et elle est fausse : l'égalité des longueurs ne dit rien de la direction ni du sens. Contre-exemple : avec $A(0\,;0)$, $B(1\,;0)$, $C(0\,;0)$ et $D(0\,;1)$, on a $AB=CD=1$, mais $\overrightarrow{AB}\begin{pmatrix} 1 \\ 0 \end{pmatrix}\neq \overrightarrow{CD}\begin{pmatrix} 0 \\ 1 \end{pmatrix}$.

    **6.** **Vraie**. D'après la relation de Chasles, $\overrightarrow{AB}+\overrightarrow{BA}=\overrightarrow{AA}=\vec{0}$.

    **7.** **Fausse**. L'affirmation tombe en défaut si l'un des deux vecteurs est nul : le vecteur $\vec{0}$ a un déterminant nul avec n'importe quel vecteur, alors qu'il n'a *aucune* direction. L'énoncé correct est : deux vecteurs *non nuls* de déterminant nul ont la même direction.

    **8.** **Vraie**. C'est la méthode du cours : les points sont alignés si et seulement si $\overrightarrow{AB}$ et $\overrightarrow{AC}$ sont colinéaires, ce que traduit exactement la nullité du déterminant.

    **9.** **Vraie**. D'après la définition du produit par un réel, la longueur de $k\vec{u}$ vaut $|k|\times\|\vec{u}\|$, soit ici $2\|\vec{u}\|$.

    **10.** **Fausse**. Une longueur n'est jamais négative. Le vecteur $-\vec{u}$ a la *même* longueur que $\vec{u}$ ; c'est son sens qui change.
