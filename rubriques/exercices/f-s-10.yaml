    Soit $ABC$ un triangle. On note $I$ le point tel que $\overrightarrow{AI}=\dfrac{1}{3}\overrightarrow{AB}$ et $J$ le point tel que $\overrightarrow{AJ}=\dfrac{1}{3}\overrightarrow{AC}$.

    **Partie A : démonstration générale.**

    **1.** Faire une figure.

    **2.** Démontrer que $\overrightarrow{IJ}=\dfrac{1}{3}\overrightarrow{BC}$.

    **3.** En déduire que les droites $(IJ)$ et $(BC)$ sont parallèles.

    **4.** Généraliser : soit $k$ un réel non nul, $I$ le point tel que $\overrightarrow{AI}=k\,\overrightarrow{AB}$ et $J$ celui tel que $\overrightarrow{AJ}=k\,\overrightarrow{AC}$. Démontrer que $(IJ)$ et $(BC)$ sont parallèles.

    **Partie B : vérification dans un repère.**

    On se place maintenant dans un repère, avec $A(1\,;2)$, $B(10\,;5)$ et $C(4\,;11)$.

    **5.** Calculer les coordonnées de $\overrightarrow{AB}$ et de $\overrightarrow{AC}$.

    **6.** En déduire les coordonnées des points $I$ et $J$ définis au début de l'exercice.

    **7.** Calculer les coordonnées de $\overrightarrow{IJ}$ et de $\overrightarrow{BC}$, puis vérifier l'égalité de la question 2.

    **8.** Retrouver le parallélisme des droites $(IJ)$ et $(BC)$ à l'aide du déterminant.
  corrige: |
    **Partie A : démonstration générale.**

    **1.**

    ![Figure](documents/figures/5a3965391469ca26.svg)

    **2.** Le raisonnement est identique à celui de l'exercice précédent, avec $\dfrac{1}{3}$ au lieu de $\dfrac{1}{2}$ : 
    $$\begin{aligned} \overrightarrow{IJ} &= \overrightarrow{IA}+\overrightarrow{AJ}=-\overrightarrow{AI}+\overrightarrow{AJ} \\ &= -\frac{1}{3}\overrightarrow{AB}+\frac{1}{3}\overrightarrow{AC} = \frac{1}{3}\left(\overrightarrow{AC}-\overrightarrow{AB}\right) \end{aligned}$$

    $$\boxed{\overrightarrow{IJ}=\frac{1}{3}\overrightarrow{BC}}$$

    **3.** Les vecteurs $\overrightarrow{IJ}$ et $\overrightarrow{BC}$ sont colinéaires : 
    $$\boxed{\text{Les droites } (IJ) \text{ et } (BC) \text{ sont parallèles}}$$

    **4.** Le calcul ne dépend pas de la valeur particulière du coefficient. Avec $\overrightarrow{AI}=k\,\overrightarrow{AB}$ et $\overrightarrow{AJ}=k\,\overrightarrow{AC}$ : 
    $$\begin{aligned} \overrightarrow{IJ} &= \overrightarrow{IA}+\overrightarrow{AJ}=-k\,\overrightarrow{AB}+k\,\overrightarrow{AC} \\ &= k\left(\overrightarrow{AC}-\overrightarrow{AB}\right)=k\,\overrightarrow{BC} \end{aligned}$$

    $$\boxed{\overrightarrow{IJ}=k\,\overrightarrow{BC}, \text{ donc } (IJ) \text{ et } (BC) \text{ sont parallèles}}$$
     *C'est le théorème de Thalès, ici démontré vectoriellement et d'un seul coup pour toutes les valeurs de $k$.*

    **Partie B : vérification dans un repère.**

    **5.** 
    $$\overrightarrow{AB}\begin{pmatrix} 10-1 \\ 5-2 \end{pmatrix} =\boxed{\begin{pmatrix} 9 \\ 3 \end{pmatrix}} \qquad ; \qquad \overrightarrow{AC}\begin{pmatrix} 4-1 \\ 11-2 \end{pmatrix} =\boxed{\begin{pmatrix} 3 \\ 9 \end{pmatrix}}$$

    **6.** 
    $$\overrightarrow{AI}=\frac{1}{3}\overrightarrow{AB}\begin{pmatrix} 3 \\ 1 \end{pmatrix} \qquad \Longrightarrow \qquad \boxed{I(1+3\,;2+1)=I(4\,;3)}$$

    $$\overrightarrow{AJ}=\frac{1}{3}\overrightarrow{AC}\begin{pmatrix} 1 \\ 3 \end{pmatrix} \qquad \Longrightarrow \qquad \boxed{J(1+1\,;2+3)=J(2\,;5)}$$

    **7.** 
    $$\overrightarrow{IJ}\begin{pmatrix} 2-4 \\ 5-3 \end{pmatrix} =\boxed{\begin{pmatrix} -2 \\ 2 \end{pmatrix}} \qquad ; \qquad \overrightarrow{BC}\begin{pmatrix} 4-10 \\ 11-5 \end{pmatrix} =\boxed{\begin{pmatrix} -6 \\ 6 \end{pmatrix}}$$
     On vérifie bien que $\dfrac{1}{3}\overrightarrow{BC} \begin{pmatrix} -2 \\ 2 \end{pmatrix}=\overrightarrow{IJ}$.

    **8.** 
    $$\det\left(\overrightarrow{IJ},\overrightarrow{BC}\right)=(-2)\times 6-(-6)\times 2=-12+12=0$$

    $$\boxed{\text{Le déterminant est nul : les droites } (IJ) \text{ et } (BC) \text{ sont parallèles}}$$
