  enonce: |
    On considère un triangle $ABC$ et un réel $a$. Les points $M$, $S$ et $T$ sont définis par : 
    $$\overrightarrow{AM}=a\,\overrightarrow{AB} \qquad ; \qquad \overrightarrow{AS}=\dfrac{2}{5}\overrightarrow{AC} \qquad ; \qquad \overrightarrow{BT}=\dfrac{3}{7}\overrightarrow{BC}$$

    ![Figure](documents/figures/923f746fb5d28b98.svg)

    **1.** Démontrer que $\overrightarrow{AT}=\dfrac{4}{7}\overrightarrow{AB}+\dfrac{3}{7}\overrightarrow{AC}$.

    **2.** On se place dans le repère $\left(A\,;B,C\right)$. Donner les coordonnées des points $M$, $S$ et $T$ en fonction de $a$ lorsque c'est nécessaire.

    **3.** Calculer les coordonnées des vecteurs $\overrightarrow{SM}$ et $\overrightarrow{ST}$.

    **4.** Déterminer la valeur de $a$ pour laquelle les points $S$, $T$ et $M$ sont alignés.

    **5.** Où se situe alors le point $M$ par rapport aux points $A$ et $B$ ? Le point $M$ appartient-il au segment $[AB]$ ?
  corrige: |
    **1.** On procède comme à l'exercice précédent, en écrivant $\overrightarrow{BC}=\overrightarrow{AC}-\overrightarrow{AB}$ : 
    $$\begin{aligned} \overrightarrow{AT} &= \overrightarrow{AB}+\overrightarrow{BT}=\overrightarrow{AB}+\frac{3}{7}\overrightarrow{BC} \\ &= \overrightarrow{AB}+\frac{3}{7}\left(\overrightarrow{AC}-\overrightarrow{AB}\right) \\ &= \left(1-\frac{3}{7}\right)\overrightarrow{AB}+\frac{3}{7}\overrightarrow{AC} \end{aligned}$$

    $$\boxed{\overrightarrow{AT}=\frac{4}{7}\overrightarrow{AB}+\frac{3}{7}\overrightarrow{AC}}$$

    **2.** Dans le repère $\left(A\,;B,C\right)$, les coordonnées d'un point sont les coefficients du vecteur qui le joint à $A$. 
    $$\boxed{M(a\,;0) \qquad ; \qquad S\left(0\,;\frac{2}{5}\right) \qquad ; \qquad T\left(\frac{4}{7}\,;\frac{3}{7}\right)}$$

    **3.** 
    $$\overrightarrow{SM}\begin{pmatrix} a-0 \\[1mm] 0-\frac{2}{5} \end{pmatrix} =\boxed{\begin{pmatrix} a \\[1mm] -\frac{2}{5} \end{pmatrix}}$$

    $$\overrightarrow{ST}\begin{pmatrix} \frac{4}{7}-0 \\[1mm] \frac{3}{7}-\frac{2}{5} \end{pmatrix}$$
     La seconde coordonnée vaut $\dfrac{3}{7}-\dfrac{2}{5}=\dfrac{15}{35}-\dfrac{14}{35}=\dfrac{1}{35}$. 
    $$\boxed{\overrightarrow{ST}\begin{pmatrix} \frac{4}{7} \\[1mm] \frac{1}{35} \end{pmatrix}}$$

    **4.** Les points $S$, $T$ et $M$ sont alignés si et seulement si $\overrightarrow{SM}$ et $\overrightarrow{ST}$ sont colinéaires, c'est-à-dire si leur déterminant est nul : 
    $$\begin{aligned} \det\left(\overrightarrow{SM},\overrightarrow{ST}\right) &= a\times\frac{1}{35}-\frac{4}{7}\times\left(-\frac{2}{5}\right) \\ &= \frac{a}{35}+\frac{8}{35}=\frac{a+8}{35} \end{aligned}$$
     Ce déterminant s'annule si et seulement si $a+8=0$ : 
    $$\boxed{a=-8}$$

    **5.** Comme $\overrightarrow{AM}=-8\,\overrightarrow{AB}$, le coefficient est négatif : le point $M$ se situe sur la droite $(AB)$, du côté opposé à $B$ par rapport à $A$. Sa distance à $A$ vaut de plus $8\times AB$. 
    $$\boxed{M \text{ n'appartient pas au segment } [AB] : \text{ il est très à l'extérieur}}$$

    ![Figure](documents/figures/48084fab91a2578b.svg)

    *La figure est tracée à l'échelle, avec la même unité sur les deux axes : c'est la raison pour laquelle le triangle apparaît minuscule. La droite $(ST)$ est en effet presque parallèle à $(AB)$ — sa pente ne vaut que $0{,}044$ — de sorte qu'il faut reculer de huit longueurs $AB$ avant qu'elles ne se croisent en $M$.*

