  page_enonce: 7
  page_corrige: 13
  enonce: |
    Déterminer, dans chaque cas, la valeur du réel $m$ demandée.

    **1.** $\vec{u}\begin{pmatrix} 3 \\ m \end{pmatrix}$ et $\vec{v}\begin{pmatrix} 6 \\ 4 \end{pmatrix}$ sont colinéaires.

    **2.** $\vec{u}\begin{pmatrix} m \\ 5 \end{pmatrix}$ et $\vec{v}\begin{pmatrix} 2 \\ -3 \end{pmatrix}$ sont colinéaires.

    **3.** Les points $A(1\,;2)$, $B(4\,;m)$ et $C(7\,;8)$ sont alignés.

    **4.** $\vec{u}\begin{pmatrix} m \\ m+1 \end{pmatrix}$ et $\vec{v}\begin{pmatrix} 3 \\ 2 \end{pmatrix}$ sont colinéaires.
  corrige: |
    On écrit à chaque fois que le déterminant est nul, puis on résout l'équation obtenue.

    **1.** 
    $$3\times 4-6\times m=0 \iff 12-6m=0 \iff \boxed{m=2}$$

    **2.** 
    $$m\times(-3)-2\times 5=0 \iff -3m-10=0 \iff \boxed{m=-\frac{10}{3}}$$

    **3.** On calcule $\overrightarrow{AB}\begin{pmatrix} 3 \\ m-2 \end{pmatrix}$ et $\overrightarrow{AC}\begin{pmatrix} 6 \\ 6 \end{pmatrix}$, puis : 
    $$3\times 6-6\times(m-2)=0 \iff 18-6m+12=0 \iff 30=6m \iff \boxed{m=5}$$
     Vérification : pour $m=5$, on a $B(4\,;5)$, et $\overrightarrow{AB}\begin{pmatrix} 3 \\ 3 \end{pmatrix}$ est bien colinéaire à $\overrightarrow{AC}\begin{pmatrix} 6 \\ 6 \end{pmatrix}$.

    **4.** 
    $$m\times 2-3\times(m+1)=0 \iff 2m-3m-3=0 \iff -m=3 \iff \boxed{m=-3}$$
     Vérification : pour $m=-3$, $\vec{u}\begin{pmatrix} -3 \\ -2 \end{pmatrix}=-\vec{v}$.
- id: "s-10-24"
