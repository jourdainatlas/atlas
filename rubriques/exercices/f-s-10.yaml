  enonce: |
    Dans un repère, on considère les points $A(-1\,;-1)$, $B(2\,;1)$, $C(8\,;5)$ et $D(5\,;6)$.

    **1.** Démontrer que les points $A$, $B$ et $C$ sont alignés.

    **2.** Le point $D$ appartient-il à la droite $(AB)$ ? Justifier.

    **3.** Déterminer les coordonnées du point $E$ tel que $\overrightarrow{AE}=2\,\overrightarrow{AB}$. Le point $E$ est-il aligné avec $A$ et $B$ ? Justifier de deux façons différentes.

    **4.** Déterminer les coordonnées du point $F$ tel que $\overrightarrow{DF}=\overrightarrow{AB}$, puis démontrer que les droites $(AB)$ et $(DF)$ sont parallèles.
  corrige: |
    **1.** 
    $$\overrightarrow{AB}\begin{pmatrix} 3 \\ 2 \end{pmatrix} \qquad ; \qquad \overrightarrow{AC}\begin{pmatrix} 9 \\ 6 \end{pmatrix}$$

    $$\det\left(\overrightarrow{AB},\overrightarrow{AC}\right)=3\times 6-9\times 2=18-18=0$$

    $$\boxed{\text{Les points } A, \; B \text{ et } C \text{ sont alignés}}$$

    **2.** On calcule $\overrightarrow{AD}\begin{pmatrix} 6 \\ 7 \end{pmatrix}$, puis : 
    $$\det\left(\overrightarrow{AB},\overrightarrow{AD}\right)=3\times 7-6\times 2=21-12=9\neq 0$$

    $$\boxed{D \text{ n'appartient pas à la droite } (AB)}$$

    **3.** En notant $E(x\,;y)$, l'égalité $\overrightarrow{AE}=2\,\overrightarrow{AB}$ donne : 
    $$\left\{\begin{array}{l} x+1=6 \\ y+1=4 \end{array}\right. \qquad \Longrightarrow \qquad \boxed{E(5\,;3)}$$
     Première justification. Par construction, $\overrightarrow{AE}=2\,\overrightarrow{AB}$ : les deux vecteurs sont colinéaires, donc $E$ appartient à $(AB)$.

    Seconde justification. Par le calcul : $\det\left(\overrightarrow{AB},\overrightarrow{AE}\right)=3\times 4-6\times 2=0$. 
    $$\boxed{A, \; B \text{ et } E \text{ sont alignés}}$$

    **4.** En notant $F(x\,;y)$, l'égalité $\overrightarrow{DF}=\overrightarrow{AB}$ donne : 
    $$\left\{\begin{array}{l} x-5=3 \\ y-6=2 \end{array}\right. \qquad \Longrightarrow \qquad \boxed{F(8\,;8)}$$
     Comme $\overrightarrow{DF}=\overrightarrow{AB}$, ces deux vecteurs sont en particulier colinéaires : 
    $$\boxed{(AB) \text{ et } (DF) \text{ sont parallèles}}$$
     Elles sont d'ailleurs distinctes, puisque $D$ n'appartient pas à $(AB)$ d'après la question 2.
- id: "s-10-29"
  feuille: "f-s-10"
  numero: 29
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Calcul, Modélisation]
  mots_cles: [coordonnées d.un vecteur, vecteurs]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 10
  page_corrige: 17
  enonce: |
    Un randonneur part d'un point $A$. Il marche d'abord $4$ km vers l'est, ce que l'on modélise par le vecteur $\vec{u}\begin{pmatrix} 4 \\ 0 \end{pmatrix}$, puis $3$ km vers le nord, modélisé par $\vec{v}\begin{pmatrix} 0 \\ 3 \end{pmatrix}$. L'unité est le kilomètre, et le repère est orthonormé.

    **1.** Déterminer les coordonnées du vecteur $\vec{u}+\vec{v}$. Interpréter.

    **2.** Calculer $\left\|\vec{u}+\vec{v}\right\|$. Que représente ce nombre ?

    **3.** Le randonneur effectue ensuite un troisième déplacement, modélisé par $\vec{w}\begin{pmatrix} -1 \\ 2 \end{pmatrix}$. Déterminer le vecteur du déplacement total, puis la distance à vol d'oiseau entre le départ et l'arrivée.

    **4.** En prenant $A$ pour origine du repère, donner les coordonnées du point d'arrivée.

    **5.** Quel vecteur devrait-il suivre pour rentrer directement au point de départ ?
  corrige: |
    **1.** Le déplacement total est la somme des deux déplacements : 
    $$\vec{u}+\vec{v}\begin{pmatrix} 4+0 \\ 0+3 \end{pmatrix} =\boxed{\begin{pmatrix} 4 \\ 3 \end{pmatrix}}$$

    $$\boxed{\text{Le randonneur s'est déplacé de } 4 \text{ km vers l'est et } 3 \text{ km vers le nord}}$$

    **2.** 
    $$\left\|\vec{u}+\vec{v}\right\|=\sqrt{4^{2}+3^{2}}=\sqrt{25}=\boxed{5}$$

    $$\boxed{\text{C'est la distance à vol d'oiseau entre le départ et l'étape, soit } 5 \text{ km}}$$
     Il a marché $4+3=7$ km, mais ne se trouve qu'à $5$ km de son point de départ.

    **3.** 
    $$\vec{u}+\vec{v}+\vec{w}\begin{pmatrix} 4-1 \\ 3+2 \end{pmatrix} =\boxed{\begin{pmatrix} 3 \\ 5 \end{pmatrix}}$$

    $$\left\|\vec{u}+\vec{v}+\vec{w}\right\|=\sqrt{9+25}=\sqrt{34} \approx\boxed{5{,}83 \text{ km}}$$

    **4.** Le point d'arrivée est l'image de $A$ par la translation de vecteur $\vec{u}+\vec{v}+\vec{w}$. Comme $A$ est l'origine : 
    $$\boxed{\text{Le point d'arrivée a pour coordonnées } (3\,;5)}$$

    **5.** Pour revenir en $A$, il faut effectuer le déplacement opposé : 
    $$\boxed{-\left(\vec{u}+\vec{v}+\vec{w}\right) \begin{pmatrix} -3 \\ -5 \end{pmatrix}}$$
     soit $3$ km vers l'ouest et $5$ km vers le sud, pour une distance totale de $\sqrt{34}\approx 5{,}83$ km.
- id: "s-10-30"
  feuille: "f-s-10"
  numero: 30
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [somme et relation de Chasles, norme, parallélisme, vecteurs]
