  page_corrige: 18
  enonce: |
    Soit $ABC$ un triangle. On note $I$ le milieu de $[AB]$ et $J$ le milieu de $[AC]$.

    **1.** Faire une figure.

    **2.** Justifier que $\overrightarrow{AI}=\dfrac{1}{2}\overrightarrow{AB}$ et $\overrightarrow{AJ}=\dfrac{1}{2}\overrightarrow{AC}$.

    **3.** En utilisant la relation de Chasles, démontrer que $\overrightarrow{IJ}=\dfrac{1}{2}\overrightarrow{BC}$.

    *On écrira $\overrightarrow{IJ}=\overrightarrow{IA}+\overrightarrow{AJ}$.*

    **4.** En déduire que les droites $(IJ)$ et $(BC)$ sont parallèles.

    **5.** Que peut-on dire de la longueur $IJ$ par rapport à $BC$ ?

    **6.** Comment s'appelle le théorème que l'on vient de démontrer ?
  corrige: |
    **1.**

    ![Figure](documents/figures/406f370fa3250b62.svg)

    **2.** Le point $I$ est le milieu de $[AB]$, donc $\overrightarrow{AB}=2\,\overrightarrow{AI}$ d'après la question 3 de l'exercice 9. En divisant par $2$ : 
    $$\boxed{\overrightarrow{AI}=\frac{1}{2}\overrightarrow{AB}}$$
     Le même raisonnement dans le triangle donne : 
    $$\boxed{\overrightarrow{AJ}=\frac{1}{2}\overrightarrow{AC}}$$

    **3.** On introduit le point $A$ à l'aide de la relation de Chasles : 
    $$\begin{aligned} \overrightarrow{IJ} &= \overrightarrow{IA}+\overrightarrow{AJ} \\ &= -\overrightarrow{AI}+\overrightarrow{AJ} \\ &= -\frac{1}{2}\overrightarrow{AB}+\frac{1}{2}\overrightarrow{AC} \\ &= \frac{1}{2}\left(\overrightarrow{AC}-\overrightarrow{AB}\right) \end{aligned}$$
     Or $\overrightarrow{AC}-\overrightarrow{AB}=\overrightarrow{AC}+\overrightarrow{BA}=\overrightarrow{BA}+\overrightarrow{AC}=\overrightarrow{BC}$. 
    $$\boxed{\overrightarrow{IJ}=\frac{1}{2}\overrightarrow{BC}}$$

    **4.** L'égalité précédente montre que $\overrightarrow{IJ}$ et $\overrightarrow{BC}$ sont colinéaires, le coefficient valant $\dfrac{1}{2}$. 
    $$\boxed{\text{Les droites } (IJ) \text{ et } (BC) \text{ sont parallèles}}$$

    **5.** La longueur d'un vecteur multiplié par $\dfrac{1}{2}$ est la moitié de la longueur du vecteur initial : 
    $$\boxed{IJ=\frac{BC}{2}}$$

    **6.** 
    $$\boxed{\text{C'est le théorème de la droite des milieux}}$$
     Il est ici démontré en trois lignes de calcul vectoriel, alors que la démonstration géométrique classique demande de passer par un parallélogramme auxiliaire.
