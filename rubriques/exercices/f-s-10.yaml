- id: "s-10-01"
  feuille: "f-s-10"
  numero: 1
  partie: "Vecteurs et translations"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [égalité de vecteurs, norme, vecteurs]
  noeuds: [v-espace, gd-normes]
  notions: [norme, espace-vectoriel]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Sur le quadrillage ci-dessous sont représentés cinq vecteurs.

    ![Figure](documents/figures/b51075cd73509e4f.svg)

    **1.** En comptant les carreaux, indiquer pour chaque vecteur de combien de carreaux il faut se déplacer horizontalement, puis verticalement.

    **2.** Quels sont les vecteurs qui ont la même direction ? Justifier.

    **3.** Parmi ceux-là, lesquels ont le même sens ?

    **4.** Quels sont les deux vecteurs égaux ? Justifier en comparant direction, sens et longueur.

    **5.** Quels sont les deux vecteurs opposés l'un de l'autre ?

    **6.** Le vecteur $\vec{u_{5}}$ est-il égal à $\vec{u_{1}}$ ? Sinon, quelle relation les lie ?
  corrige: |
    **1.** On compte les carreaux parcourus horizontalement puis verticalement.

    ```tableau
    **Vecteur** ¦ **Horizontal** ¦ **Vertical** ¦ **Description**
    $\vec{u_{1}}$ ¦ $3$ vers la droite ¦ $1$ vers le haut ¦ 
    $\vec{u_{2}}$ ¦ $3$ vers la droite ¦ $1$ vers le haut ¦ identique à $\vec{u_{1}}$
    $\vec{u_{3}}$ ¦ $3$ vers la gauche ¦ $1$ vers le bas ¦ inverse de $\vec{u_{1}}$
    $\vec{u_{4}}$ ¦ $2$ vers la droite ¦ $1$ vers le haut ¦ 
    $\vec{u_{5}}$ ¦ $6$ vers la droite ¦ $2$ vers le haut ¦ le double de $\vec{u_{1}}$
    ```

    **2.** Deux vecteurs ont la même direction lorsque leurs représentants sont portés par des droites parallèles. En comparant les déplacements : 
    $$\boxed{\vec{u_{1}}, \; \vec{u_{2}}, \; \vec{u_{3}} \text{ et } \vec{u_{5}} \text{ ont la même direction}}$$
     En effet, tous correspondent à un déplacement de $3$ carreaux horizontalement pour $1$ verticalement, ou à un multiple de ce déplacement. Le vecteur $\vec{u_{4}}$ fait exception : $2$ pour $1$.

    **3.** Parmi ces quatre-là, $\vec{u_{3}}$ va vers la gauche et vers le bas, les autres vers la droite et vers le haut : 
    $$\boxed{\vec{u_{1}}, \; \vec{u_{2}} \text{ et } \vec{u_{5}} \text{ ont le même sens}}$$

    **4.** 
    $$\boxed{\vec{u_{1}}=\vec{u_{2}}}$$
     Ils ont la même direction, le même sens et la même longueur : ce sont deux représentants d'un même vecteur. Le quadrilatère formé par leurs origines et leurs extrémités est d'ailleurs un parallélogramme.

    **5.** 
    $$\boxed{\vec{u_{3}}=-\vec{u_{1}}=-\vec{u_{2}}}$$
     Même direction, même longueur, mais sens contraire.

    **6.** Non : $\vec{u_{5}}$ a la même direction et le même sens que $\vec{u_{1}}$, mais sa longueur est deux fois plus grande. 
    $$\boxed{\vec{u_{5}}=2\,\vec{u_{1}}}$$
- id: "s-10-02"
  feuille: "f-s-10"
  numero: 2
  partie: "Vecteurs et translations"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [translation, égalité de vecteurs, norme, vecteurs]
  noeuds: [v-espace, gd-normes]
  notions: [espace-vectoriel, norme]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    ![Figure](documents/figures/f8996095f270c377.svg)

    **1.** Reproduire la figure sur papier quadrillé.

    **2.** Construire les points $A'$, $B'$ et $C'$, images respectives de $A$, $B$ et $C$ par la translation de vecteur $\vec{u}$.

    **3.** Quelle est la nature du quadrilatère $ABB'A'$ ? Justifier.

    **4.** Comparer les longueurs $AB$ et $A'B'$. Que peut-on dire du triangle $A'B'C'$ ?

    **5.** Citer trois vecteurs égaux à $\vec{u}$ sur la figure complétée.
  corrige: |
    **1.** et 2. Chaque point est déplacé de $3$ carreaux vers la droite et $2$ vers le haut.

    ![Figure](documents/figures/688ae3cdf51ac349.svg)

    **2.** Par construction $\overrightarrow{AA'}=\overrightarrow{BB'}=\vec{u}$. D'après la proposition 1 du cours, l'égalité $\overrightarrow{AA'}=\overrightarrow{BB'}$ signifie que : 
    $$\boxed{ABB'A' \text{ est un parallélogramme}}$$
     *Attention à l'ordre des lettres : $\overrightarrow{AA'}=\overrightarrow{BB'}$ donne le parallélogramme $AA'B'B$, ou de façon équivalente $ABB'A'$ en le parcourant dans l'autre sens.*

    **3.** Une translation conserve les longueurs : 
    $$\boxed{AB=A'B'}$$

    $$\boxed{\text{Les triangles } ABC \text{ et } A'B'C' \text{ sont superposables}}$$

    **4.** 
    $$\boxed{\overrightarrow{AA'}=\overrightarrow{BB'}=\overrightarrow{CC'}=\vec{u}}$$
- id: "s-10-03"
  feuille: "f-s-10"
  numero: 3
  partie: "Vecteurs et translations"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [égalité de vecteurs, parallélogramme, vecteurs]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 2
  page_corrige: 2
  enonce: |
    **1.** Soit $ABCD$ un parallélogramme. Recopier et compléter par le vecteur qui convient.

    **a)** $\overrightarrow{AB}=\dots$

    **b)** $\overrightarrow{AD}=\dots$

    **c)** $\overrightarrow{BA}=\dots$

    **d)** $\overrightarrow{CB}=\dots$

    **2.** Soient $A$, $B$, $C$ et $D$ quatre points tels que $\overrightarrow{AB}=\overrightarrow{CD}$. Quel quadrilatère est un parallélogramme : $ABCD$ ou $ABDC$ ? Justifier en faisant une figure.

    **3.** Soient $E$, $F$, $G$ et $H$ quatre points tels que $EFGH$ soit un parallélogramme. Écrire deux égalités vectorielles traduisant cette propriété.
  corrige: |
    **1.** Dans le parallélogramme $ABCD$, les côtés opposés sont parallèles et de même longueur, et le parcours $A\to B\to C\to D$ se fait dans l'ordre.

    **a)** $\boxed{\overrightarrow{AB}=\overrightarrow{DC}}$

    **b)** $\boxed{\overrightarrow{AD}=\overrightarrow{BC}}$

    **c)** $\boxed{\overrightarrow{BA}=\overrightarrow{CD}}$

    **d)** $\boxed{\overrightarrow{CB}=\overrightarrow{DA}}$

    **2.** C'est le piège de ce chapitre. L'égalité $\overrightarrow{AB}=\overrightarrow{CD}$ signifie que l'on va de $A$ à $B$ exactement comme on va de $C$ à $D$ : les deux flèches sont parallèles et de même sens. En parcourant le quadrilatère, on part de $A$, on rejoint $B$, puis on doit rejoindre l'extrémité du second vecteur, c'est-à-dire $D$, avant de revenir par $C$. 
    $$\boxed{\text{C'est } ABDC \text{ qui est un parallélogramme}}$$

    ![Figure](documents/figures/e51806e068c0e5a4.svg)

    *Le quadrilatère $ABCD$, lui, serait un quadrilatère croisé.*

    **3.** 
    $$\boxed{\overrightarrow{EF}=\overrightarrow{HG} \qquad \text{et} \qquad \overrightarrow{EH}=\overrightarrow{FG}}$$
- id: "s-10-04"
  feuille: "f-s-10"
  numero: 4
  partie: "Vecteurs et translations"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [égalité de vecteurs, parallélogramme, vecteurs]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Sur la figure ci-dessous, $ABCD$ est un parallélogramme et $I$ est le milieu de $[AB]$.

    ![Figure](documents/figures/63380480c2ebc1fc.svg)

    **1.** Citer tous les vecteurs égaux à $\overrightarrow{AI}$ que l'on peut lire sur la figure.

    **2.** Citer tous les vecteurs égaux à $\overrightarrow{AD}$.

    **3.** Le vecteur $\overrightarrow{IB}$ est-il égal à $\overrightarrow{JC}$ ? Justifier.

    **4.** Quelle est la nature du quadrilatère $AIJD$ ? Justifier à l'aide d'une égalité vectorielle.

    **5.** Donner l'opposé de $\overrightarrow{DC}$, puis celui de $\overrightarrow{IJ}$.
  corrige: |
    **1.** Le point $I$ étant le milieu de $[AB]$ et $J$ celui de $[DC]$, les segments $[AI]$, $[IB]$, $[DJ]$ et $[JC]$ ont tous la même longueur, et sont tous parallèles et de même sens. 
    $$\boxed{\overrightarrow{AI}=\overrightarrow{IB}=\overrightarrow{DJ}=\overrightarrow{JC}}$$

    **2.** 
    $$\boxed{\overrightarrow{AD}=\overrightarrow{BC}=\overrightarrow{IJ}}$$
     Le vecteur $\overrightarrow{IJ}$ convient car $AIJD$ est un parallélogramme, comme le montre la question 4.

    **3.** Oui : d'après la question 1, ces deux vecteurs sont tous deux égaux à $\overrightarrow{AI}$. 
    $$\boxed{\overrightarrow{IB}=\overrightarrow{JC}}$$

    **4.** On a $\overrightarrow{AI}=\overrightarrow{DJ}$ d'après la question 1. D'après la proposition 1, cette égalité signifie que : 
    $$\boxed{AIJD \text{ est un parallélogramme}}$$
     *On vérifie l'ordre des lettres : on part de $A$, on va en $I$, puis on rejoint $J$, extrémité du second vecteur, avant de revenir par $D$.*

    **5.** 
    $$\boxed{-\overrightarrow{DC}=\overrightarrow{CD} \qquad \text{et} \qquad -\overrightarrow{IJ}=\overrightarrow{JI}}$$
- id: "s-10-05"
  feuille: "f-s-10"
  numero: 5
  partie: "Somme de vecteurs et relation de Chasles"
  etoiles: 1
  types: [Calcul]
  mots_cles: [somme et relation de Chasles, vecteurs]
  noeuds: [v-combinaisons, v-espace]
  notions: [espace-vectoriel]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Simplifier chacune des écritures suivantes à l'aide de la relation de Chasles.

    **a)** $\overrightarrow{AB}+\overrightarrow{BC}$

    **b)** $\overrightarrow{MN}+\overrightarrow{NP}$

    **c)** $\overrightarrow{AB}+\overrightarrow{BC}+\overrightarrow{CD}$

    **d)** $\overrightarrow{BA}+\overrightarrow{AC}$

    **e)** $\overrightarrow{EF}+\overrightarrow{FG}+\overrightarrow{GH}+\overrightarrow{HE}$

    **f)** $\overrightarrow{RS}+\overrightarrow{ST}+\overrightarrow{TR}$
  corrige: |
    On applique la relation de Chasles : le point intermédiaire disparaît.

    **a)** $\boxed{\overrightarrow{AB}+\overrightarrow{BC}=\overrightarrow{AC}}$

    **b)** $\boxed{\overrightarrow{MN}+\overrightarrow{NP}=\overrightarrow{MP}}$

    **c)** $\overrightarrow{AB}+\overrightarrow{BC}+\overrightarrow{CD}=\overrightarrow{AC}+\overrightarrow{CD}=\boxed{\overrightarrow{AD}}$

    **d)** $\boxed{\overrightarrow{BA}+\overrightarrow{AC}=\overrightarrow{BC}}$

    **e)** $\overrightarrow{EF}+\overrightarrow{FG}+\overrightarrow{GH}+\overrightarrow{HE}=\overrightarrow{EE}=\boxed{\vec{0}}$

    **f)** $\overrightarrow{RS}+\overrightarrow{ST}+\overrightarrow{TR}=\overrightarrow{RR}=\boxed{\vec{0}}$

    Dans les cas e) et f), on revient au point de départ : le déplacement total est nul.
- id: "s-10-06"
  feuille: "f-s-10"
  numero: 6
  partie: "Somme de vecteurs et relation de Chasles"
  etoiles: 1
  types: [Calcul]
  mots_cles: [coordonnées d.un vecteur, vecteurs]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Sur la figure ci-dessous sont représentés trois vecteurs $\vec{u}$, $\vec{v}$ et $\vec{w}$.

    ![Figure](documents/figures/d774f1c5d5b8ab2d.svg)

    **1.** Reproduire la figure, puis construire un représentant du vecteur $\vec{u}+\vec{v}$ d'origine le point de coordonnées $(1\,;1)$.

    **2.** Construire de même un représentant de $\vec{v}+\vec{w}$.

    **3.** Construire un représentant de $\vec{u}+\vec{v}+\vec{w}$.

    **4.** Construire un représentant de $\vec{u}-\vec{v}$.

    *On rappelle que $\vec{u}-\vec{v}=\vec{u}+\left(-\vec{v}\right)$.*

    **5.** Vérifier sur la figure que $\vec{u}+\vec{v}$ et $\vec{v}+\vec{u}$ donnent bien le même vecteur.
  corrige: |
    **1.** à 4. Pour construire $\vec{u}+\vec{v}$, on place l'origine de $\vec{v}$ à l'extrémité de $\vec{u}$ : la somme est la flèche qui joint le début du premier à la fin du second.

    ![Figure](documents/figures/1ef39f62746e2cc7.svg)

    Le vecteur $\vec{u}+\vec{v}+\vec{w}$ s'obtient en enchaînant les trois déplacements : on trouve un vecteur de coordonnées $\begin{pmatrix} 4 \\ 4 \end{pmatrix} +\begin{pmatrix} 2 \\ -3 \end{pmatrix}=\begin{pmatrix} 6 \\ 1 \end{pmatrix}$.

    **5.** En plaçant $\vec{u}$ après $\vec{v}$ plutôt que l'inverse, on aboutit au même point : les deux constructions donnent le même vecteur. 
    $$\boxed{\vec{u}+\vec{v}=\vec{v}+\vec{u}}$$
     Les deux chemins forment d'ailleurs les deux côtés opposés d'un parallélogramme.
- id: "s-10-07"
  feuille: "f-s-10"
  numero: 7
  partie: "Somme de vecteurs et relation de Chasles"
  etoiles: 2
  types: [Calcul]
  mots_cles: [égalité de vecteurs, vecteurs]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Simplifier les écritures suivantes. On fera apparaître les étapes du calcul.

    **a)** $\overrightarrow{AB}+\overrightarrow{BC}+\overrightarrow{CA}$

    **b)** $\overrightarrow{AB}-\overrightarrow{CB}$

    **c)** $\overrightarrow{AB}+\overrightarrow{CD}+\overrightarrow{BC}$

    **d)** $\overrightarrow{MA}+\overrightarrow{AN}-\overrightarrow{MN}$

    **e)** $\overrightarrow{AB}-\overrightarrow{AD}$

    **f)** $\overrightarrow{AC}+\overrightarrow{CB}-\overrightarrow{AB}$

    Pour b) et e), on commencera par remplacer la soustraction par l'addition du vecteur opposé.
  corrige: |
    **a)** 
    $$\overrightarrow{AB}+\overrightarrow{BC}+\overrightarrow{CA}=\overrightarrow{AC}+\overrightarrow{CA}=\overrightarrow{AA}=\boxed{\vec{0}}$$

    **b)** On remplace la soustraction par l'addition de l'opposé : 
    $$\overrightarrow{AB}-\overrightarrow{CB}=\overrightarrow{AB}+\overrightarrow{BC}=\boxed{\overrightarrow{AC}}$$

    **c)** On réorganise les termes, ce qui est permis car l'addition est commutative : 
    $$\overrightarrow{AB}+\overrightarrow{CD}+\overrightarrow{BC}=\overrightarrow{AB}+\overrightarrow{BC}+\overrightarrow{CD}=\overrightarrow{AC}+\overrightarrow{CD} =\boxed{\overrightarrow{AD}}$$

    **d)** 
    $$\overrightarrow{MA}+\overrightarrow{AN}-\overrightarrow{MN}=\overrightarrow{MN}-\overrightarrow{MN}=\boxed{\vec{0}}$$

    **e)** 
    $$\overrightarrow{AB}-\overrightarrow{AD}=\overrightarrow{AB}+\overrightarrow{DA}=\overrightarrow{DA}+\overrightarrow{AB}=\boxed{\overrightarrow{DB}}$$

    **f)** 
    $$\overrightarrow{AC}+\overrightarrow{CB}-\overrightarrow{AB}=\overrightarrow{AB}-\overrightarrow{AB}=\boxed{\vec{0}}$$

    On retiendra la règle générale : $\overrightarrow{XA}-\overrightarrow{XB}=\overrightarrow{BA}$, quel que soit le point $X$.
- id: "s-10-08"
  feuille: "f-s-10"
  numero: 8
  partie: "Somme de vecteurs et relation de Chasles"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [égalité de vecteurs, parallélogramme, vecteurs]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** Soit $ABCD$ un parallélogramme. Démontrer que $\overrightarrow{AB}+\overrightarrow{AD}=\overrightarrow{AC}$.

    *Cette égalité s'appelle la règle du parallélogramme.*

    **2.** Soit $ABCD$ un parallélogramme de centre $O$, c'est-à-dire le point d'intersection de ses diagonales.

    **(a)** Que peut-on dire des vecteurs $\overrightarrow{OA}$ et $\overrightarrow{OC}$ ? Et de $\overrightarrow{OB}$ et $\overrightarrow{OD}$ ?

    **(b)** En déduire que $\overrightarrow{OA}+\overrightarrow{OB}+\overrightarrow{OC}+\overrightarrow{OD}=\vec{0}$.

    **3.** Soient $A$, $B$, $C$ trois points quelconques. Démontrer que $\overrightarrow{AB}+\overrightarrow{BC}+\overrightarrow{CA}=\vec{0}$, et interpréter ce résultat.
  corrige: |
    **1.** Dans le parallélogramme $ABCD$, on a $\overrightarrow{AD}=\overrightarrow{BC}$. Donc : 
    $$\overrightarrow{AB}+\overrightarrow{AD}=\overrightarrow{AB}+\overrightarrow{BC}=\overrightarrow{AC}$$

    $$\boxed{\overrightarrow{AB}+\overrightarrow{AD}=\overrightarrow{AC}}$$
     La diagonale issue de $A$ porte donc la somme des deux côtés issus de $A$ : c'est la *règle du parallélogramme* énoncée par Newton en tête du chapitre.

    **2.** **(a)** Le point $O$ est le milieu de $[AC]$ et de $[BD]$, puisque les diagonales d'un parallélogramme se coupent en leur milieu. Les vecteurs $\overrightarrow{OA}$ et $\overrightarrow{OC}$ ont donc même direction, même longueur et sens contraires : 
    $$\boxed{\overrightarrow{OC}=-\overrightarrow{OA} \qquad \text{et} \qquad \overrightarrow{OD}=-\overrightarrow{OB}}$$

    **(b)** On regroupe les termes deux à deux : 
    $$\overrightarrow{OA}+\overrightarrow{OB}+\overrightarrow{OC}+\overrightarrow{OD} =\underbrace{\left(\overrightarrow{OA}+\overrightarrow{OC}\right)}_{=\,\vec{0}} +\underbrace{\left(\overrightarrow{OB}+\overrightarrow{OD}\right)}_{=\,\vec{0}}$$

    $$\boxed{\overrightarrow{OA}+\overrightarrow{OB}+\overrightarrow{OC}+\overrightarrow{OD}=\vec{0}}$$

    **3.** C'est la question a) de l'exercice 7 : 
    $$\overrightarrow{AB}+\overrightarrow{BC}+\overrightarrow{CA}=\overrightarrow{AA}=\vec{0}$$

    $$\boxed{\text{Parcourir un triangle en entier, c'est revenir à son point de départ}}$$
     Le déplacement total est donc nul, quelle que soit la forme du triangle.
- id: "s-10-09"
  feuille: "f-s-10"
  numero: 9
  partie: "Somme de vecteurs et relation de Chasles"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [somme et relation de Chasles, vecteurs]
  noeuds: [v-combinaisons, v-espace]
  notions: [espace-vectoriel]
  page_enonce: 4
  page_corrige: 5
  enonce: |
    Soient $A$ et $B$ deux points distincts, et $I$ le milieu du segment $[AB]$.

    **1.** Justifier que $\overrightarrow{AI}=\overrightarrow{IB}$.

    **2.** En déduire, à l'aide de la relation de Chasles, que $\overrightarrow{IA}+\overrightarrow{IB}=\vec{0}$.

    **3.** Démontrer que $\overrightarrow{AB}=2\,\overrightarrow{AI}$.

    **4.** Réciproquement, soit $J$ un point tel que $\overrightarrow{JA}+\overrightarrow{JB}=\vec{0}$. Que peut-on dire de $J$ ?

    **5.** Soit $ABC$ un triangle et $M$ le milieu de $[BC]$. Démontrer que $\overrightarrow{AB}+\overrightarrow{AC}=2\,\overrightarrow{AM}$.

    *On introduira le point $M$ dans chacun des deux vecteurs à l'aide de la relation de Chasles.*
  corrige: |
    **1.** Le point $I$ étant le milieu de $[AB]$, les segments $[AI]$ et $[IB]$ ont la même longueur, et les vecteurs $\overrightarrow{AI}$ et $\overrightarrow{IB}$ ont la même direction — celle de la droite $(AB)$ — et le même sens, puisque l'on parcourt le segment de $A$ vers $B$. 
    $$\boxed{\overrightarrow{AI}=\overrightarrow{IB}}$$

    **2.** En remplaçant $\overrightarrow{IB}$ par $\overrightarrow{AI}$ dans la relation de Chasles : 
    $$\overrightarrow{IA}+\overrightarrow{IB}=\overrightarrow{IA}+\overrightarrow{AI}=\overrightarrow{II}=\boxed{\vec{0}}$$

    **3.** 
    $$\overrightarrow{AB}=\overrightarrow{AI}+\overrightarrow{IB}=\overrightarrow{AI}+\overrightarrow{AI}=\boxed{2\,\overrightarrow{AI}}$$

    **4.** L'égalité $\overrightarrow{JA}+\overrightarrow{JB}=\vec{0}$ signifie $\overrightarrow{JB}=-\overrightarrow{JA}=\overrightarrow{AJ}$, c'est-à-dire que $J$ est situé sur $[AB]$ à égale distance de $A$ et de $B$. 
    $$\boxed{J \text{ est le milieu de } [AB]}$$
     La propriété de la question 2 est donc *caractéristique* du milieu.

    **5.** On introduit $M$ dans chacun des deux vecteurs : 
    $$\begin{aligned} \overrightarrow{AB}+\overrightarrow{AC} &= \left(\overrightarrow{AM}+\overrightarrow{MB}\right)+\left(\overrightarrow{AM}+\overrightarrow{MC}\right) \\ &= 2\,\overrightarrow{AM}+\underbrace{\left(\overrightarrow{MB}+\overrightarrow{MC}\right)}_{=\,\vec{0}} \end{aligned}$$
     la dernière parenthèse étant nulle d'après la question 2, puisque $M$ est le milieu de $[BC]$. 
    $$\boxed{\overrightarrow{AB}+\overrightarrow{AC}=2\,\overrightarrow{AM}}$$
- id: "s-10-10"
  feuille: "f-s-10"
  numero: 10
  partie: "Coordonnées d'un vecteur"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [égalité de vecteurs, coordonnées d.un vecteur, vecteurs]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 4
  page_corrige: 6
  enonce: |
    Lire les coordonnées de chacun des vecteurs représentés ci-dessous.

    ![Figure](documents/figures/5e3af665c8050451.svg)

    **1.** Donner les coordonnées de $\vec{a}$, $\vec{b}$, $\vec{c}$, $\vec{d}$ et $\vec{e}$.

    **2.** Quel vecteur a une première coordonnée nulle ? Que peut-on dire de sa direction ?

    **3.** Quel vecteur a une seconde coordonnée nulle ? Même question.

    **4.** Deux de ces vecteurs sont-ils égaux ? Justifier.
  corrige: |
    **1.** On lit le déplacement horizontal, puis le déplacement vertical.

    ```tableau
     ¦ $\vec{a}$ ¦ $\vec{b}$ ¦ $\vec{c}$ ¦ $\vec{d}$ ¦ $\vec{e}$
    **Coordonnées** ¦ $\begin{pmatrix} 3 \\ 2 \end{pmatrix}$ ¦ $\begin{pmatrix} 3 \\ -2 \end{pmatrix}$ ¦ $\begin{pmatrix} 3 \\ 0 \end{pmatrix}$ ¦ $\begin{pmatrix} 0 \\ -5 \end{pmatrix}$ ¦ $\begin{pmatrix} 4 \\ -2 \end{pmatrix}$
    ```

    **2.** 
    $$\boxed{\vec{d} \text{ a une première coordonnée nulle}}$$
     Aucun déplacement horizontal : le vecteur est **vertical**, donc parallèle à l'axe des ordonnées.

    **3.** 
    $$\boxed{\vec{c} \text{ a une seconde coordonnée nulle}}$$
     Aucun déplacement vertical : le vecteur est **horizontal**.

    **4.** Non. Les vecteurs $\vec{a}$ et $\vec{b}$ ont la même première coordonnée $3$, mais des secondes coordonnées opposées. 
    $$\boxed{\text{Aucun de ces cinq vecteurs n'est égal à un autre}}$$
     En revanche $\vec{b}$ et $\vec{e}$ sont colinéaires, puisque $\vec{e}=\dfrac{4}{3}\,\vec{b}$ — on le vérifiera au moyen du déterminant en partie 5.
- id: "s-10-11"
  feuille: "f-s-10"
  numero: 11
  partie: "Coordonnées d'un vecteur"
  etoiles: 1
  types: [Calcul]
  mots_cles: [coordonnées d.un vecteur, vecteurs]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 4
  page_corrige: 6
  enonce: |
    Déterminer les coordonnées du vecteur $\overrightarrow{AB}$ dans chacun des cas suivants.

    **a)** $A(2\,;3)$ et $B(5\,;7)$

    **b)** $A(-1\,;4)$ et $B(3\,;-2)$

    **c)** $A(0\,;-5)$ et $B(-3\,;1)$

    **d)** $A(4\,;4)$ et $B(4\,;-1)$

    **e)** $A(-6\,;2)$ et $B(-6\,;2)$

    **f)** $A\left(\dfrac{1}{2}\,;-3\right)$ et $B\left(\dfrac{5}{2}\,;1\right)$

    Que remarque-t-on en e) ? Comment s'appelle le vecteur obtenu ?
  corrige: |
    On applique la proposition 2 : $\overrightarrow{AB}\begin{pmatrix} x_{B}-x_{A} \\ y_{B}-y_{A} \end{pmatrix}$.

    **a)** $\overrightarrow{AB}\begin{pmatrix} 5-2 \\ 7-3 \end{pmatrix} =\boxed{\begin{pmatrix} 3 \\ 4 \end{pmatrix}}$

    **b)** $\overrightarrow{AB}\begin{pmatrix} 3-(-1) \\ -2-4 \end{pmatrix} =\boxed{\begin{pmatrix} 4 \\ -6 \end{pmatrix}}$

    **c)** $\overrightarrow{AB}\begin{pmatrix} -3-0 \\ 1-(-5) \end{pmatrix} =\boxed{\begin{pmatrix} -3 \\ 6 \end{pmatrix}}$

    **d)** $\overrightarrow{AB}\begin{pmatrix} 4-4 \\ -1-4 \end{pmatrix} =\boxed{\begin{pmatrix} 0 \\ -5 \end{pmatrix}}$

    **e)** $\overrightarrow{AB}\begin{pmatrix} -6-(-6) \\ 2-2 \end{pmatrix} =\boxed{\begin{pmatrix} 0 \\ 0 \end{pmatrix}}$

    **f)** $\overrightarrow{AB}\begin{pmatrix} \frac{5}{2}-\frac{1}{2} \\[1mm] 1-(-3) \end{pmatrix} =\boxed{\begin{pmatrix} 2 \\ 4 \end{pmatrix}}$

    En e), les deux points sont confondus : le vecteur obtenu est le **vecteur nul** $\vec{0}$. C'est le seul vecteur dont toutes les coordonnées sont nulles, et le seul qui n'ait ni direction ni sens.
- id: "s-10-12"
  feuille: "f-s-10"
  numero: 12
  partie: "Coordonnées d'un vecteur"
  etoiles: 1
  types: [Lecture graphique, Calcul]
  mots_cles: [parallélogramme, coordonnées d.un vecteur, vecteurs]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 5
  page_corrige: 7
  enonce: |
    On considère les points $A(1\,;2)$, $B(4\,;3)$ et $C(-2\,;5)$.

    **1.** Calculer les coordonnées de $\overrightarrow{AB}$ et de $\overrightarrow{BC}$.

    **2.** Déterminer les coordonnées du point $D$ tel que $\overrightarrow{AB}=\overrightarrow{CD}$.

    **3.** Déterminer les coordonnées du point $E$ tel que $\overrightarrow{AE}=\overrightarrow{BC}$.

    **4.** Déterminer les coordonnées du point $F$ tel que $ABCF$ soit un parallélogramme.

    **5.** Placer les cinq points dans un repère et vérifier graphiquement les résultats.
  corrige: |
    **1.** 
    $$\overrightarrow{AB}\begin{pmatrix} 4-1 \\ 3-2 \end{pmatrix} =\boxed{\begin{pmatrix} 3 \\ 1 \end{pmatrix}} \qquad ; \qquad \overrightarrow{BC}\begin{pmatrix} -2-4 \\ 5-3 \end{pmatrix} =\boxed{\begin{pmatrix} -6 \\ 2 \end{pmatrix}}$$

    **2.** En notant $D(x\,;y)$, le vecteur $\overrightarrow{CD}$ a pour coordonnées $\begin{pmatrix} x+2 \\ y-5 \end{pmatrix}$. L'égalité $\overrightarrow{AB}=\overrightarrow{CD}$ impose l'égalité des coordonnées : 
    $$\left\{\begin{array}{l} x+2=3 \\ y-5=1 \end{array}\right. \qquad \Longrightarrow \qquad \left\{\begin{array}{l} x=1 \\ y=6 \end{array}\right.$$

    $$\boxed{D(1\,;6)}$$

    **3.** De même, $\overrightarrow{AE}=\overrightarrow{BC}$ donne : 
    $$\left\{\begin{array}{l} x-1=-6 \\ y-2=2 \end{array}\right. \qquad \Longrightarrow \qquad \boxed{E(-5\,;4)}$$

    **4.** Le quadrilatère $ABCF$ est un parallélogramme si et seulement si $\overrightarrow{AB}=\overrightarrow{FC}$. En notant $F(x\,;y)$ : 
    $$\left\{\begin{array}{l} -2-x=3 \\ 5-y=1 \end{array}\right. \qquad \Longrightarrow \qquad \boxed{F(-5\,;4)}$$
     *On constate que $E$ et $F$ sont confondus, ce qui n'a rien d'étonnant : $\overrightarrow{AE}=\overrightarrow{BC}$ signifie que $ABCE$ est un parallélogramme.*

    **5.**

    ![Figure](documents/figures/cd288aca4b7246b9.svg)

    Les vecteurs $\overrightarrow{AB}$ et $\overrightarrow{CD}$ sont bien deux flèches identiques, décalées l'une de l'autre.
- id: "s-10-13"
  feuille: "f-s-10"
  numero: 13
  partie: "Coordonnées d'un vecteur"
  etoiles: 2
  types: [Calcul]
  mots_cles: [norme, vecteurs]
  noeuds: [gd-normes, v-espace]
  notions: [norme, espace-vectoriel]
  page_enonce: 5
  page_corrige: 7
  enonce: |
    Le plan est muni d'un repère orthonormé.

    **1.** Calculer la norme de chacun des vecteurs suivants. On donnera la valeur exacte, puis une valeur approchée au centième si nécessaire.

    **(a)** $\vec{u}\begin{pmatrix} 3 \\ 4 \end{pmatrix}$

    **(b)** $\vec{v}\begin{pmatrix} -5 \\ 12 \end{pmatrix}$

    **(c)** $\vec{w}\begin{pmatrix} 1 \\ 1 \end{pmatrix}$

    **(d)** $\vec{s}\begin{pmatrix} 0 \\ -7 \end{pmatrix}$

    **(e)** $\vec{t}\begin{pmatrix} -2 \\ 3 \end{pmatrix}$

    **(f)** $\vec{r}\begin{pmatrix} -6 \\ -8 \end{pmatrix}$

    **2.** Soient $A(1\,;2)$, $B(4\,;6)$ et $C(-3\,;5)$. Calculer $AB$, $AC$ et $BC$.

    **3.** En déduire la nature du triangle $ABC$.
  corrige: |
    **1.** On applique $\|\vec{u}\|=\sqrt{x^{2}+y^{2}}$.

    **(a)** $\sqrt{9+16}=\sqrt{25}=\boxed{5}$

    **(b)** $\sqrt{25+144}=\sqrt{169}=\boxed{13}$

    **(c)** $\sqrt{1+1}=\boxed{\sqrt{2}\approx 1{,}41}$

    **(d)** $\sqrt{0+49}=\boxed{7}$

    **(e)** $\sqrt{4+9}=\boxed{\sqrt{13}\approx 3{,}61}$

    **(f)** $\sqrt{36+64}=\sqrt{100}=\boxed{10}$

    On remarquera en f) que $\vec{r}=-2\,\vec{u}$ : sa norme est bien le double de celle de $\vec{u}$.

    **2.** 
    $$\overrightarrow{AB}\begin{pmatrix} 3 \\ 4 \end{pmatrix} \; \Longrightarrow \; AB=\sqrt{9+16}=\boxed{5}$$

    $$\overrightarrow{AC}\begin{pmatrix} -4 \\ 3 \end{pmatrix} \; \Longrightarrow \; AC=\sqrt{16+9}=\boxed{5}$$

    $$\overrightarrow{BC}\begin{pmatrix} -7 \\ -1 \end{pmatrix} \; \Longrightarrow \; BC=\sqrt{49+1}=\boxed{\sqrt{50}=5\sqrt{2}\approx 7{,}07}$$

    **3.** Comme $AB=AC=5$ : 
    $$\boxed{\text{Le triangle } ABC \text{ est isocèle en } A}$$
     On peut même préciser : $AB^{2}+AC^{2}=25+25=50=BC^{2}$, donc d'après la réciproque du théorème de Pythagore, il est aussi rectangle en $A$. 
    $$\boxed{\text{Le triangle } ABC \text{ est rectangle et isocèle en } A}$$
- id: "s-10-14"
  feuille: "f-s-10"
  numero: 14
  partie: "Coordonnées d'un vecteur"
  etoiles: 2
  types: [Calcul]
  mots_cles: [égalité de vecteurs, parallélogramme, coordonnées d.un vecteur]
  noeuds: [v-espace]
  notions: []
  page_enonce: 5
  page_corrige: 8
  enonce: |
    On considère les points $A(-1\,;2)$, $B(3\,;4)$ et $C(5\,;1)$.

    **1.** Déterminer les coordonnées du point $D$ tel que $ABCD$ soit un parallélogramme.

    *On commencera par traduire cette propriété par une égalité vectorielle.*

    **2.** Calculer les coordonnées du milieu de $[AC]$, puis celles du milieu de $[BD]$.

    **3.** Que constate-t-on ? Quelle propriété du parallélogramme retrouve-t-on ainsi ?

    **4.** Faire une figure pour illustrer les résultats.
  corrige: |
    **1.** Le quadrilatère $ABCD$ est un parallélogramme si et seulement si $\overrightarrow{AB}=\overrightarrow{DC}$. On calcule d'abord $\overrightarrow{AB}\begin{pmatrix} 4 \\ 2 \end{pmatrix}$, puis on note $D(x\,;y)$ : 
    $$\overrightarrow{DC}\begin{pmatrix} 5-x \\ 1-y \end{pmatrix} \qquad \Longrightarrow \qquad \left\{\begin{array}{l} 5-x=4 \\ 1-y=2 \end{array}\right.$$

    $$\boxed{D(1\,;-1)}$$

    **2.** Le milieu d'un segment a pour coordonnées la moyenne de celles de ses extrémités. 
    $$\text{milieu de } [AC] : \left(\frac{-1+5}{2}\,;\frac{2+1}{2}\right) =\boxed{\left(2\,;\frac{3}{2}\right)}$$

    $$\text{milieu de } [BD] : \left(\frac{3+1}{2}\,;\frac{4-1}{2}\right) =\boxed{\left(2\,;\frac{3}{2}\right)}$$

    **3.** 
    $$\boxed{\text{Les deux milieux sont confondus}}$$

    $$\boxed{\text{Les diagonales d'un parallélogramme se coupent en leur milieu}}$$

    **4.**

    ![Figure](documents/figures/30ba5bc8488e4f1e.svg)

    Le point rouge, intersection des deux diagonales, a bien pour coordonnées $\left(2\,;\dfrac{3}{2}\right)$.
- id: "s-10-15"
  feuille: "f-s-10"
  numero: 15
  partie: "Opérations sur les vecteurs"
  etoiles: 1
  types: [Calcul]
  mots_cles: [coordonnées d.un vecteur, vecteurs]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    On donne $\vec{u}\begin{pmatrix} 2 \\ -3 \end{pmatrix}$, $\vec{v}\begin{pmatrix} -1 \\ 5 \end{pmatrix}$ et $\vec{w}\begin{pmatrix} 4 \\ 0 \end{pmatrix}$. Calculer les coordonnées des vecteurs suivants.

    **a)** $\vec{u}+\vec{v}$

    **b)** $3\vec{u}$

    **c)** $2\vec{u}-\vec{v}$

    **d)** $\vec{u}+\vec{v}+\vec{w}$

    **e)** $-2\vec{v}+\vec{w}$

    **f)** $\dfrac{1}{2}\vec{u}+2\vec{v}$
  corrige: |
    On additionne les coordonnées une à une, et l'on multiplie chaque coordonnée par le coefficient.

    **a)** $\vec{u}+\vec{v}\begin{pmatrix} 2-1 \\ -3+5 \end{pmatrix} =\boxed{\begin{pmatrix} 1 \\ 2 \end{pmatrix}}$

    **b)** $3\vec{u}\begin{pmatrix} 6 \\ -9 \end{pmatrix}$ soit $\boxed{\begin{pmatrix} 6 \\ -9 \end{pmatrix}}$

    **c)** $2\vec{u}-\vec{v}\begin{pmatrix} 4+1 \\ -6-5 \end{pmatrix} =\boxed{\begin{pmatrix} 5 \\ -11 \end{pmatrix}}$

    **d)** $\vec{u}+\vec{v}+\vec{w}\begin{pmatrix} 1+4 \\ 2+0 \end{pmatrix} =\boxed{\begin{pmatrix} 5 \\ 2 \end{pmatrix}}$

    **e)** $-2\vec{v}+\vec{w}\begin{pmatrix} 2+4 \\ -10+0 \end{pmatrix} =\boxed{\begin{pmatrix} 6 \\ -10 \end{pmatrix}}$

    **f)** $\dfrac{1}{2}\vec{u}+2\vec{v}\begin{pmatrix} 1-2 \\ -\frac{3}{2}+10 \end{pmatrix} =\boxed{\begin{pmatrix} -1 \\ \frac{17}{2} \end{pmatrix}}$
- id: "s-10-16"
  feuille: "f-s-10"
  numero: 16
  partie: "Opérations sur les vecteurs"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [norme, colinéarité, vecteurs]
  noeuds: [gd-normes, v-libre, v-determinant, v-espace]
  notions: [norme, determinant, espace-vectoriel]
  page_enonce: 6
  page_corrige: 9
  enonce: |
    Sur la figure ci-dessous est représenté un vecteur $\vec{u}$.

    ![Figure](documents/figures/988fdd9b162b08f5.svg)

    **1.** Reproduire la figure, puis construire les représentants d'origine $O$ des vecteurs suivants : $2\vec{u}$, $\dfrac{1}{2}\vec{u}$, $-\vec{u}$ et $-\dfrac{3}{2}\vec{u}$.

    **2.** Pour chacun, préciser sa longueur en fonction de celle de $\vec{u}$, ainsi que son sens par rapport à celui de $\vec{u}$.

    **3.** Existe-t-il un réel $k$ tel que $k\vec{u}$ soit le vecteur nul ? Lequel ?

    **4.** Les vecteurs $3\vec{u}$ et $-5\vec{u}$ sont-ils colinéaires ? Justifier sans calcul.
  corrige: |
    **1.** Le vecteur $\vec{u}$ correspond à un déplacement de $2$ carreaux vers la droite et $1$ vers le haut. On multiplie donc ce déplacement par le coefficient.

    ![Figure](documents/figures/6c75e5d823b6bcfc.svg)

    **2.**

    ```tableau
    **Vecteur** ¦ **Longueur** ¦ **Sens**
    $2\vec{u}$ ¦ $2\times\|\vec{u}\|$ ¦ même sens que $\vec{u}$
    $\frac{1}{2}\vec{u}$ ¦ $\frac{1}{2}\times\|\vec{u}\|$ ¦ même sens que $\vec{u}$
    $-\vec{u}$ ¦ $\|\vec{u}\|$ ¦ sens contraire
    $-\frac{3}{2}\vec{u}$ ¦ $\frac{3}{2}\times\|\vec{u}\|$ ¦ sens contraire
    ```

    La longueur est toujours $|k|\times\|\vec{u}\|$ : c'est la *valeur absolue* du coefficient qui intervient, jamais son signe.

    **3.** Oui, une seule : 
    $$\boxed{k=0 \text{ donne } 0\,\vec{u}=\vec{0}}$$

    **4.** Oui. Les vecteurs $3\vec{u}$ et $-5\vec{u}$ sont tous deux des multiples de $\vec{u}$ : ils ont donc la même direction que $\vec{u}$, donc la même direction entre eux. 
    $$\boxed{3\vec{u} \text{ et } -5\vec{u} \text{ sont colinéaires}}$$
     On peut d'ailleurs écrire $-5\vec{u}=-\dfrac{5}{3}\times 3\vec{u}$.
- id: "s-10-17"
  feuille: "f-s-10"
  numero: 17
  partie: "Opérations sur les vecteurs"
  etoiles: 2
  types: [Calcul]
  mots_cles: [vecteurs]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 6
  page_corrige: 10
  enonce: |
    Soit $ABC$ un triangle. On pose $\vec{u}=\overrightarrow{AB}$ et $\vec{v}=\overrightarrow{AC}$.

    **1.** Exprimer $\overrightarrow{BC}$ en fonction de $\vec{u}$ et $\vec{v}$.

    **2.** Soit $I$ le milieu de $[BC]$. Exprimer $\overrightarrow{AI}$ en fonction de $\vec{u}$ et $\vec{v}$.

    **3.** Soit $D$ le point tel que $\overrightarrow{AD}=\vec{u}+\vec{v}$. Quelle est la nature du quadrilatère $ABDC$ ? Justifier.

    **4.** Soit $G$ le point tel que $\overrightarrow{AG}=\dfrac{1}{3}\left(\vec{u}+\vec{v}\right)$. Exprimer $\overrightarrow{AG}$ en fonction de $\overrightarrow{AI}$, puis placer $G$ sur une figure.
  corrige: |
    **1.** La relation de Chasles donne $\overrightarrow{BC}=\overrightarrow{BA}+\overrightarrow{AC}$, et $\overrightarrow{BA}=-\overrightarrow{AB}=-\vec{u}$ : 
    $$\boxed{\overrightarrow{BC}=\vec{v}-\vec{u}}$$

    **2.** D'après la question 5 de l'exercice 9, $\overrightarrow{AB}+\overrightarrow{AC}=2\,\overrightarrow{AI}$ puisque $I$ est le milieu de $[BC]$ : 
    $$\boxed{\overrightarrow{AI}=\frac{1}{2}\left(\vec{u}+\vec{v}\right)}$$

    **3.** L'égalité $\overrightarrow{AD}=\vec{u}+\vec{v}=\overrightarrow{AB}+\overrightarrow{AC}$ est exactement la règle du parallélogramme démontrée à l'exercice 8 : 
    $$\boxed{ABDC \text{ est un parallélogramme}}$$
     *On retrouve l'ordre des lettres : $\overrightarrow{AB}=\overrightarrow{CD}$, donc $ABDC$.*

    **4.** D'après la question 2, $\vec{u}+\vec{v}=2\,\overrightarrow{AI}$, donc : 
    $$\overrightarrow{AG}=\frac{1}{3}\times 2\,\overrightarrow{AI}=\boxed{\frac{2}{3}\,\overrightarrow{AI}}$$
     Le point $G$ se trouve donc sur le segment $[AI]$, aux deux tiers en partant de $A$ : c'est le **centre de gravité** du triangle $ABC$.

    ![Figure](documents/figures/43064e48eacf63fe.svg)
- id: "s-10-18"
  feuille: "f-s-10"
  numero: 18
  partie: "Opérations sur les vecteurs"
  etoiles: 2
  types: [Calcul]
  mots_cles: [vecteurs]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 6
  page_corrige: 10
  enonce: |
    **1.** On donne $\vec{u}\begin{pmatrix} 1 \\ 2 \end{pmatrix}$, $\vec{v}\begin{pmatrix} 2 \\ -1 \end{pmatrix}$ et $\vec{w}\begin{pmatrix} 5 \\ 0 \end{pmatrix}$. Déterminer le réel $x$ tel que $\vec{u}+x\,\vec{v}=\vec{w}$.

    **2.** On donne $\vec{u}\begin{pmatrix} 3 \\ -1 \end{pmatrix}$, $\vec{v}\begin{pmatrix} -2 \\ 4 \end{pmatrix}$ et $\vec{w}\begin{pmatrix} -1 \\ 7 \end{pmatrix}$. Déterminer les réels $a$ et $b$ tels que $a\,\vec{u}+b\,\vec{v}=\vec{w}$.

    *On obtiendra un système de deux équations à deux inconnues.*

    **3.** Reprendre la question 2 avec $\vec{w}\begin{pmatrix} 1 \\ 1 \end{pmatrix}$.
  corrige: |
    **1.** Le vecteur $\vec{u}+x\,\vec{v}$ a pour coordonnées $\begin{pmatrix} 1+2x \\ 2-x \end{pmatrix}$. L'égalité avec $\vec{w}$ donne : 
    $$\left\{\begin{array}{l} 1+2x=5 \\ 2-x=0 \end{array}\right. \qquad \Longrightarrow \qquad \left\{\begin{array}{l} x=2 \\ x=2 \end{array}\right.$$
     Les deux équations donnent la même valeur : le système est compatible. 
    $$\boxed{x=2}$$

    **2.** Le vecteur $a\,\vec{u}+b\,\vec{v}$ a pour coordonnées $\begin{pmatrix} 3a-2b \\ -a+4b \end{pmatrix}$, d'où le système : 
    $$\left\{\begin{array}{l} 3a-2b=-1 \\ -a+4b=7 \end{array}\right.$$
     La seconde équation donne $a=4b-7$. En reportant dans la première : 
    $$3(4b-7)-2b=-1 \iff 12b-21-2b=-1 \iff 10b=20 \iff b=2$$
     puis $a=8-7=1$. 
    $$\boxed{a=1 \text{ et } b=2}$$
     Vérification : $1\times\begin{pmatrix} 3 \\ -1 \end{pmatrix} +2\times\begin{pmatrix} -2 \\ 4 \end{pmatrix} =\begin{pmatrix} -1 \\ 7 \end{pmatrix}$.

    **3.** Le système devient : 
    $$\left\{\begin{array}{l} 3a-2b=1 \\ -a+4b=1 \end{array}\right.$$
     La seconde donne $a=4b-1$, d'où $3(4b-1)-2b=1$, soit $10b=4$ et $b=\dfrac{2}{5}$, puis $a=\dfrac{8}{5}-1=\dfrac{3}{5}$. 
    $$\boxed{a=\frac{3}{5} \text{ et } b=\frac{2}{5}}$$

    On observe que dans les trois cas le système admet une unique solution : c'est parce que $\vec{u}$ et $\vec{v}$ ne sont pas colinéaires. Tout vecteur du plan peut alors s'écrire, d'une seule façon, comme combinaison de ces deux-là.
- id: "s-10-19"
  feuille: "f-s-10"
  numero: 19
  partie: "Colinéarité"
  etoiles: 1
  types: [Calcul]
  mots_cles: [colinéarité, vecteurs]
  noeuds: [v-libre, v-determinant, v-espace]
  notions: [determinant, espace-vectoriel]
  page_enonce: 7
  page_corrige: 11
  enonce: |
    Calculer le déterminant des couples de vecteurs suivants.

    **a)** $\vec{u}\begin{pmatrix} 3 \\ 2 \end{pmatrix}$ et $\vec{v}\begin{pmatrix} 6 \\ 4 \end{pmatrix}$

    **b)** $\vec{u}\begin{pmatrix} 1 \\ -2 \end{pmatrix}$ et $\vec{v}\begin{pmatrix} 3 \\ 5 \end{pmatrix}$

    **c)** $\vec{u}\begin{pmatrix} -4 \\ 6 \end{pmatrix}$ et $\vec{v}\begin{pmatrix} 2 \\ -3 \end{pmatrix}$

    **d)** $\vec{u}\begin{pmatrix} 0 \\ 5 \end{pmatrix}$ et $\vec{v}\begin{pmatrix} 2 \\ 0 \end{pmatrix}$

    **e)** $\vec{u}\begin{pmatrix} 7 \\ -1 \end{pmatrix}$ et $\vec{v}\begin{pmatrix} -14 \\ 2 \end{pmatrix}$

    **f)** $\vec{u}\begin{pmatrix} 2 \\ 3 \end{pmatrix}$ et $\vec{v}\begin{pmatrix} 3 \\ 2 \end{pmatrix}$

    Pour chacun des six couples, conclure quant à la colinéarité des deux vecteurs.
  corrige: |
    On applique $\det\left(\vec{u},\vec{v}\right)=xy'-x'y$.

    $$\begin{array}{|c||c|c|} \hline  & \text{Calcul du déterminant} & \text{Conclusion} \\ \hline \text{a)} & 3\times 4-6\times 2=12-12=0 & \text{colinéaires} \\ \hline \text{b)} & 1\times 5-3\times(-2)=5+6=11 & \text{non colinéaires} \\ \hline \text{c)} & (-4)\times(-3)-2\times 6=12-12=0 & \text{colinéaires} \\ \hline \text{d)} & 0\times 0-2\times 5=-10 & \text{non colinéaires} \\ \hline \text{e)} & 7\times 2-(-14)\times(-1)=14-14=0 & \text{colinéaires} \\ \hline \text{f)} & 2\times 2-3\times 3=4-9=-5 & \text{non colinéaires} \\ \hline \end{array}$$
- id: "s-10-20"
  feuille: "f-s-10"
  numero: 20
  partie: "Colinéarité"
  etoiles: 1
  types: [Calcul]
  mots_cles: [colinéarité, vecteurs]
  noeuds: [v-libre, v-determinant, v-espace]
  notions: [determinant, espace-vectoriel]
  page_enonce: 7
  page_corrige: 11
  enonce: |
    Pour les couples colinéaires de l'exercice précédent, déterminer le réel $k$ tel que $\vec{v}=k\,\vec{u}$.

    Les vecteurs $\vec{u}\begin{pmatrix} 0 \\ 3 \end{pmatrix}$ et $\vec{v}\begin{pmatrix} 0 \\ -8 \end{pmatrix}$ sont-ils colinéaires ? Répondre d'abord sans calcul, puis vérifier avec le déterminant.
  corrige: |
    Pour les trois couples colinéaires, on cherche $k$ tel que $\vec{v}=k\,\vec{u}$ : il suffit de diviser une coordonnée de $\vec{v}$ par celle de $\vec{u}$, puis de vérifier sur l'autre.

    **a)** $\dfrac{6}{3}=2$ et $\dfrac{4}{2}=2$ : $\boxed{k=2}$

    **c)** $\dfrac{2}{-4}=-\dfrac{1}{2}$ et $\dfrac{-3}{6}=-\dfrac{1}{2}$ : $\boxed{k=-\dfrac{1}{2}}$

    **e)** $\dfrac{-14}{7}=-2$ et $\dfrac{2}{-1}=-2$ : $\boxed{k=-2}$

    Second cas. Les deux vecteurs $\begin{pmatrix} 0 \\ 3 \end{pmatrix}$ et $\begin{pmatrix} 0 \\ -8 \end{pmatrix}$ ont une première coordonnée nulle : ils sont tous deux verticaux, donc de même direction. 
    $$\boxed{\text{Ils sont colinéaires, sans aucun calcul}}$$
     Le déterminant le confirme : 
    $$0\times(-8)-0\times 3=0$$
     On a d'ailleurs $\vec{v}=-\dfrac{8}{3}\,\vec{u}$.
- id: "s-10-21"
  feuille: "f-s-10"
  numero: 21
  partie: "Colinéarité"
  etoiles: 2
  types: [Lecture graphique, Calcul]
  mots_cles: [alignement]
  noeuds: [v-libre]
  notions: []
  page_enonce: 7
  page_corrige: 12
  enonce: |
    Dans chaque cas, déterminer si les trois points sont alignés.

    **1.** $A(-2\,;1)$, $B(1\,;3)$ et $C(7\,;7)$

    **2.** $D(0\,;0)$, $E(2\,;5)$ et $F(5\,;12)$

    **3.** $G(-3\,;4)$, $H(1\,;-2)$ et $I(5\,;-8)$

    Faire une figure pour le cas 2 : le résultat était-il facile à deviner graphiquement ?
  corrige: |
    Pour tester l'alignement de trois points, on calcule le déterminant de deux vecteurs formés à partir d'un même point.

    **1.** $\overrightarrow{AB}\begin{pmatrix} 3 \\ 2 \end{pmatrix}$ et $\overrightarrow{AC}\begin{pmatrix} 9 \\ 6 \end{pmatrix}$ : 
    $$\det\left(\overrightarrow{AB},\overrightarrow{AC}\right)=3\times 6-9\times 2=18-18=0$$

    $$\boxed{A, \; B \text{ et } C \text{ sont alignés}}$$

    **2.** $\overrightarrow{DE}\begin{pmatrix} 2 \\ 5 \end{pmatrix}$ et $\overrightarrow{DF}\begin{pmatrix} 5 \\ 12 \end{pmatrix}$ : 
    $$\det\left(\overrightarrow{DE},\overrightarrow{DF}\right)=2\times 12-5\times 5=24-25=-1$$

    $$\boxed{D, \; E \text{ et } F \text{ ne sont pas alignés}}$$

    **3.** $\overrightarrow{GH}\begin{pmatrix} 4 \\ -6 \end{pmatrix}$ et $\overrightarrow{GI}\begin{pmatrix} 8 \\ -12 \end{pmatrix}$ : 
    $$\det\left(\overrightarrow{GH},\overrightarrow{GI}\right)=4\times(-12)-8\times(-6)=-48+48=0$$

    $$\boxed{G, \; H \text{ et } I \text{ sont alignés}}$$

    Figure du cas 2.

    ![Figure](documents/figures/1bd870601624d9a6.svg)

    En bleu la droite $(DF)$, en pointillés verts la droite $(DE)$ prolongée : les trois points paraissent alignés à l'œil nu, et pourtant ils ne le sont pas. Le point $E$ est très légèrement au-dessus de la droite $(DF)$. 
    $$\boxed{\text{Seul le calcul du déterminant permet de conclure avec certitude}}$$
- id: "s-10-22"
  feuille: "f-s-10"
  numero: 22
  partie: "Colinéarité"
  etoiles: 2
  types: [Calcul]
  mots_cles: [alignement, parallélisme]
  noeuds: [v-libre]
  notions: []
  page_enonce: 7
  page_corrige: 13
  enonce: |
    **1.** On donne $A(1\,;1)$, $B(4\,;3)$, $C(0\,;5)$ et $D(6\,;9)$. Les droites $(AB)$ et $(CD)$ sont-elles parallèles ?

    **2.** On donne $E(2\,;-1)$, $F(5\,;1)$, $G(-1\,;3)$ et $H(2\,;6)$. Les droites $(EF)$ et $(GH)$ sont-elles parallèles ?

    **3.** Reprendre la question 1 en vérifiant que les quatre points ne sont pas alignés. Que peut-on alors dire du quadrilatère $ABDC$ ?
  corrige: |
    **1.** $\overrightarrow{AB}\begin{pmatrix} 3 \\ 2 \end{pmatrix}$ et $\overrightarrow{CD}\begin{pmatrix} 6 \\ 4 \end{pmatrix}$ : 
    $$\det\left(\overrightarrow{AB},\overrightarrow{CD}\right)=3\times 4-6\times 2=0$$

    $$\boxed{(AB) \text{ et } (CD) \text{ sont parallèles}}$$

    **2.** $\overrightarrow{EF}\begin{pmatrix} 3 \\ 2 \end{pmatrix}$ et $\overrightarrow{GH}\begin{pmatrix} 3 \\ 3 \end{pmatrix}$ : 
    $$\det\left(\overrightarrow{EF},\overrightarrow{GH}\right)=3\times 3-3\times 2=9-6=3\neq 0$$

    $$\boxed{(EF) \text{ et } (GH) \text{ ne sont pas parallèles}}$$

    **3.** Vérifions que $C$ n'appartient pas à la droite $(AB)$. On calcule $\overrightarrow{AC}\begin{pmatrix} -1 \\ 4 \end{pmatrix}$ : 
    $$\det\left(\overrightarrow{AB},\overrightarrow{AC}\right)=3\times 4-(-1)\times 2=12+2=14\neq 0$$
     Les points $A$, $B$ et $C$ ne sont donc pas alignés, et les quatre points ne le sont pas non plus. Comme de plus $\overrightarrow{CD}=2\,\overrightarrow{AB}$, les deux droites sont parallèles mais les segments n'ont pas la même longueur. 
    $$\boxed{ABDC \text{ est un trapèze, mais ce n'est pas un parallélogramme}}$$
     En effet $\overrightarrow{AB}\neq\overrightarrow{CD}$ : les côtés $[AB]$ et $[CD]$ sont parallèles, mais $[CD]$ est deux fois plus long.
