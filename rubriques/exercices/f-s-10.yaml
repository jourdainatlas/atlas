  enonce: |
    Dans un repère orthonormé, on considère les points $A(-2\,;1)$, $B(2\,;-1)$, $C(4\,;3)$ et $D(0\,;5)$.

    **1.** Placer ces quatre points dans un repère.

    **2.** Calculer les coordonnées de $\overrightarrow{AB}$ et de $\overrightarrow{DC}$. Qu'en déduit-on pour le quadrilatère $ABCD$ ?

    **3.** Calculer les longueurs $AB$ et $AD$. Que peut-on en déduire ?

    **4.** Calculer les longueurs des diagonales $AC$ et $BD$.

    **5.** En déduire la nature exacte du quadrilatère $ABCD$.
  corrige: |
    **1.**

    ![Figure](documents/figures/f8108dc079dced87.svg)

    **2.** 
    $$\overrightarrow{AB}\begin{pmatrix} 2-(-2) \\ -1-1 \end{pmatrix} =\begin{pmatrix} 4 \\ -2 \end{pmatrix} \qquad ; \qquad \overrightarrow{DC}\begin{pmatrix} 4-0 \\ 3-5 \end{pmatrix} =\begin{pmatrix} 4 \\ -2 \end{pmatrix}$$
     Ces deux vecteurs ont les mêmes coordonnées, donc ils sont égaux : 
    $$\boxed{ABCD \text{ est un parallélogramme}}$$

    **3.** 
    $$AB=\sqrt{4^{2}+(-2)^{2}}=\sqrt{20}=2\sqrt{5}$$

    $$\overrightarrow{AD}\begin{pmatrix} 2 \\ 4 \end{pmatrix} \; \Longrightarrow \; AD=\sqrt{2^{2}+4^{2}}=\sqrt{20}=2\sqrt{5}$$
     Deux côtés consécutifs du parallélogramme ont la même longueur : 
    $$\boxed{ABCD \text{ est un losange}}$$

    **4.** 
    $$\overrightarrow{AC}\begin{pmatrix} 6 \\ 2 \end{pmatrix} \; \Longrightarrow \; AC=\sqrt{36+4}=\sqrt{40}=2\sqrt{10}$$

    $$\overrightarrow{BD}\begin{pmatrix} -2 \\ 6 \end{pmatrix} \; \Longrightarrow \; BD=\sqrt{4+36}=\sqrt{40}=2\sqrt{10}$$

    $$\boxed{\text{Les deux diagonales ont la même longueur}}$$

    **5.** Un parallélogramme dont les diagonales ont la même longueur est un rectangle. Or c'est aussi un losange d'après la question 3. 
    $$\boxed{ABCD \text{ est un carré}}$$
     *On aurait pu s'en douter à la lecture de la figure, mais seuls les calculs de longueurs permettent de l'affirmer.*
- id: "s-10-27"
  feuille: "f-s-10"
  numero: 27
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [coordonnées d.un vecteur, alignement, vecteurs]
  noeuds: [v-espace, v-libre]
  notions: [espace-vectoriel]
  page_enonce: 9
  page_corrige: 15
  enonce: |
    Sur la figure ci-dessous, $ABCD$ est un carré, et les triangles $ABI$ et $BCV$ sont équilatéraux.

    ![Figure](documents/figures/9721ac41e4988e05.svg)

    Dans tout l'exercice, on se place dans le repère $\left(A\,;B,D\right)$, c'est-à-dire le repère d'origine $A$ dont les vecteurs de base sont $\overrightarrow{AB}$ et $\overrightarrow{AD}$.

    **1.** Reproduire la figure sur une feuille quadrillée.

    **2.** Donner les coordonnées des points $A$, $B$, $C$ et $D$ dans ce repère.

    **3.** Justifier que la hauteur d'un triangle équilatéral de côté $1$ vaut $\dfrac{\sqrt{3}}{2}$.

    *On appliquera le théorème de Pythagore dans la moitié du triangle.*

    **4.** En déduire les coordonnées exactes des points $I$ et $V$.

    **5.** Calculer les coordonnées des vecteurs $\overrightarrow{DI}$ et $\overrightarrow{DV}$.

    **6.** Démontrer que les points $D$, $I$ et $V$ sont alignés.
  corrige: |
    **1.** Voir la figure de l'énoncé.

    **2.** Dans le repère $\left(A\,;B,D\right)$, le point $A$ est l'origine, le point $B$ est l'extrémité du premier vecteur de base et $D$ celle du second. 
    $$\boxed{A(0\,;0) \quad ; \quad B(1\,;0) \quad ; \quad C(1\,;1) \quad ; \quad D(0\,;1)}$$
     Le point $C$ s'obtient par la règle du parallélogramme : $\overrightarrow{AC}=\overrightarrow{AB}+\overrightarrow{AD}$.

    **3.** Soit un triangle équilatéral de côté $1$, et $H$ le pied de la hauteur issue du sommet opposé à la base. Cette hauteur coupe la base en son milieu, donc la moitié de la base mesure $\dfrac{1}{2}$. Le théorème de Pythagore dans le triangle rectangle ainsi formé donne : 
    $$h^{2}+\left(\frac{1}{2}\right)^{2}=1^{2} \iff h^{2}=1-\frac{1}{4}=\frac{3}{4}$$

    $$\boxed{h=\sqrt{\frac{3}{4}}=\frac{\sqrt{3}}{2}}$$

    **4.** Point $I$. Le triangle $ABI$ est équilatéral de côté $1$, construit au-dessus de $[AB]$. Son sommet $I$ se trouve à l'aplomb du milieu de $[AB]$, à la hauteur $\dfrac{\sqrt{3}}{2}$ : 
    $$\boxed{I\left(\frac{1}{2}\,;\frac{\sqrt{3}}{2}\right)}$$

    Point $V$. Le triangle $BCV$ est équilatéral de côté $1$, construit à droite du segment vertical $[BC]$. Son sommet $V$ se trouve donc à la hauteur du milieu de $[BC]$, c'est-à-dire à l'ordonnée $\dfrac{1}{2}$, et décalé de $\dfrac{\sqrt{3}}{2}$ vers la droite par rapport à l'abscisse $1$ : 
    $$\boxed{V\left(1+\frac{\sqrt{3}}{2}\,;\frac{1}{2}\right)}$$

    **5.** 
    $$\overrightarrow{DI}\begin{pmatrix} \frac{1}{2}-0 \\[1mm] \frac{\sqrt{3}}{2}-1 \end{pmatrix} =\boxed{\begin{pmatrix} \frac{1}{2} \\[1mm] \frac{\sqrt{3}}{2}-1 \end{pmatrix}}$$

    $$\overrightarrow{DV}\begin{pmatrix} 1+\frac{\sqrt{3}}{2}-0 \\[1mm] \frac{1}{2}-1 \end{pmatrix} =\boxed{\begin{pmatrix} 1+\frac{\sqrt{3}}{2} \\[1mm] -\frac{1}{2} \end{pmatrix}}$$

    **6.** On calcule le déterminant. Il faut développer le second produit avec soin : 
    $$\begin{aligned} \det\left(\overrightarrow{DI},\overrightarrow{DV}\right) &= \frac{1}{2}\times\left(-\frac{1}{2}\right) -\left(1+\frac{\sqrt{3}}{2}\right)\times\left(\frac{\sqrt{3}}{2}-1\right) \\[1mm] &= -\frac{1}{4}-\left(\frac{\sqrt{3}}{2}-1+\frac{3}{4}-\frac{\sqrt{3}}{2}\right) \\[1mm] &= -\frac{1}{4}-\left(-\frac{1}{4}\right)=0 \end{aligned}$$
     Le déterminant est nul, donc $\overrightarrow{DI}$ et $\overrightarrow{DV}$ sont colinéaires. 
    $$\boxed{\text{Les points } D, \; I \text{ et } V \text{ sont alignés}}$$
     *On peut préciser le rapport : $\overrightarrow{DV}=\left(2+\sqrt{3}\right)\overrightarrow{DI}$, soit environ $3{,}73$ fois plus long.*
- id: "s-10-28"
  feuille: "f-s-10"
  numero: 28
  partie: "Exercices de synthèse"
