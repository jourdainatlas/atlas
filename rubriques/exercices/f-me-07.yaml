  enonce: |
    Soient $a$ et $b$ deux entiers relatifs premiers entre eux, $(k,\ell)\in\mathbb{N}^{*2}$.

    **a)** Montrer que $a^{k}$ et $b$ sont premiers entre eux. On déduira d'une relation de Bézout entre $a$ et $b$ une relation de Bézout entre $a^{k}$ et $b$.

    **b)** Montrer que $a^{k}$ et $b^{\ell}$ sont premiers entre eux.
  corrige: |
    **a)** Soit $(u\,;v)$ un couple de Bézout : $au+bv=1$. Montrons par récurrence sur $k\geqslant 1$ qu'il existe des entiers $u_{k}$ et $v_{k}$ tels que $a^{k}u_{k}+bv_{k}=1$.

    **Initialisation :** Pour $k=1$, on prend $u_{1}=u$ et $v_{1}=v$.

    **Hérédité :** Si $a^{k}u_{k}+bv_{k}=1$, on multiplie membre à membre par $au+bv=1$ : 
    $$1=(a^{k}u_{k}+bv_{k})(au+bv)=a^{k+1}(u_{k}u)+b\left(a^{k}u_{k}v+auv_{k}+bv_{k}v\right)$$
     ce qui fournit $u_{k+1}=u_{k}u$ et $v_{k+1}=a^{k}u_{k}v+auv_{k}+bv_{k}v$, entiers.

    **Conclusion :** D'après le théorème de Bézout, $a^{k}$ et $b$ sont premiers entre eux pour tout $k\in\mathbb{N}^{*}$.

    **b)** D'après a), $a^{k}$ et $b$ sont premiers entre eux. On applique à nouveau a) au couple $(b\,;a^{k})$ et à l'exposant $\ell$ : $b^{\ell}$ et $a^{k}$ sont premiers entre eux. 
    $$\boxed{\mathrm{PGCD}\left(a^{k},b^{\ell}\right)=1}$$
