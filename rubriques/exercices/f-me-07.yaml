  enonce: |
    **1.** Déterminer les couples d’entiers relatifs $(x, y)$ tels que : $7(x - 3) = 5(y - 2)$.

    **2.** En déduire les couples d’entiers relatifs $(x, y)$ tels que : $7x \equiv 1 \; [5]$.
  corrige: |
    **1.** L'équation $7(x-3)=5(y-2)$ montre que $5$ divise $7(x-3)$. Or $\mathrm{PGCD}(5,7)=1$, donc d'après le théorème de Gauss, $5$ divise $x-3$ : il existe $k\in\mathbb{Z}$ tel que : 
    $$x-3=5k \qquad \text{c'est-à-dire} \qquad x=5k+3$$
     En reportant dans l'équation : $7\times 5k=5(y-2)$, d'où $y-2=7k$ et $y=7k+2$. 
    $$\boxed{S=\left\{(5k+3\,;7k+2) \; ; \; k\in\mathbb{Z}\right\}}$$

    **2.** $7x\equiv 1\;[5]$ signifie que $5$ divise $7x-1$, c'est-à-dire qu'il existe un entier $y$ tel que $7x-1=5y$, soit $7x-5y=1$. On fait apparaître l'équation précédente en écrivant : 
    $$7x-5y=1 \iff 7x-21=5y-20 \iff 7(x-3)=5(y-4)$$
     Le raisonnement de la question 1 s'applique à l'identique : $x-3=5k$, donc : 
    $$\boxed{x\equiv 3\;[5], \text{ c'est-à-dire } x=5k+3 \text{ où } k\in\mathbb{Z}}$$
     Vérification : $7\times 3=21=4\times 5+1$, donc $7\times 3\equiv 1\;[5]$.
- id: "me-07-16"
  feuille: "f-me-07"
  numero: 16
  partie: "Équations diophantiennes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équations diophantiennes]
  noeuds: [z-bezout]
  notions: []
  page_enonce: 3
  page_corrige: 12
  enonce: |
    Soit l’équation $4x - 3y = 2$.

    **1.** Sans calcul, dire pourquoi cette équation admet des solutions entières.

    **2.** Déterminer un couple d’entiers solution de cette équation.

    **3.** Déterminer l’ensemble des couples d’entiers solutions de cette équation.
  corrige: |
    **1.** D'après le corollaire de Bézout, l'équation $ax+by=c$ admet des solutions entières si et seulement si $\mathrm{PGCD}(a,b)$ divise $c$. Ici : 
    $$\mathrm{PGCD}(4,3)=1$$
     et $1$ divise $2$. 
    $$\boxed{\text{L'équation admet des solutions entières}}$$

    **2.** On cherche une solution évidente : $4\times 2-3\times 2=8-6=2$. 
    $$\boxed{(x_{0}\,;y_{0})=(2\,;2)}$$

    **3.** Soit $(x\,;y)$ une solution. On soustrait terme à terme : 
    $$\left\{\begin{array}{l} 4x-3y=2 \\ 4\times 2-3\times 2=2 \end{array}\right. \qquad \Longrightarrow \qquad 4(x-2)-3(y-2)=0$$
     soit $4(x-2)=3(y-2)$. Comme $3$ divise $4(x-2)$ et que $\mathrm{PGCD}(3,4)=1$, le théorème de Gauss donne $3\mid(x-2)$ : il existe $k\in\mathbb{Z}$ tel que $x-2=3k$, soit $x=3k+2$. En reportant, $4\times 3k=3(y-2)$, d'où $y=4k+2$. 
    $$\boxed{S=\left\{(3k+2\,;4k+2) \; ; \; k\in\mathbb{Z}\right\}}$$
     Vérification : $4(3k+2)-3(4k+2)=12k+8-12k-6=2$.

    *Cette vérification est indispensable : le raisonnement précédent procède par implication.*
- id: "me-07-17"
  feuille: "f-me-07"
  numero: 17
  partie: "Équations diophantiennes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équations diophantiennes]
  noeuds: [z-bezout]
  notions: []
  page_enonce: 3
  page_corrige: 13
  enonce: |
    Soit l'équation $3x - 4y = 6$.

    **1.** Déterminer un couple d’entiers solution de cette équation.

    **2.** Déterminer l’ensemble des couples d’entiers solutions de cette équation.
  corrige: |
    **1.** $\mathrm{PGCD}(3,4)=1$ divise $6$ : l'équation admet des solutions. On en trouve une immédiatement en prenant $y=0$ : 
    $$3\times 2-4\times 0=6 \qquad \text{d'où} \qquad \boxed{(x_{0}\,;y_{0})=(2\,;0)}$$

    **2.** Soit $(x\,;y)$ une solution. En soustrayant terme à terme : 
    $$3(x-2)-4(y-0)=0 \qquad \text{soit} \qquad 3(x-2)=4y$$
     Comme $4$ divise $3(x-2)$ et que $\mathrm{PGCD}(3,4)=1$, le théorème de Gauss donne $4\mid(x-2)$ : il existe $k\in\mathbb{Z}$ tel que $x=4k+2$. En reportant, $3\times 4k=4y$, d'où $y=3k$. 
    $$\boxed{S=\left\{(4k+2\,;3k) \; ; \; k\in\mathbb{Z}\right\}}$$
     Vérification : $3(4k+2)-4\times 3k=12k+6-12k=6$.
