  enonce: |
    **1.** Déterminer les couples d’entiers relatifs $(x, y)$ tels que : $33x - 45y = 0$.

    **2.** En déduire les couples d’entiers relatifs $(x, y)$ tels que : $33x + 45y = 12$.
  corrige: |
    **1.** L'équation $33x-45y=0$ s'écrit $33x=45y$. Comme $\mathrm{PGCD}(33,45)=3$, on simplifie par $3$ : 
    $$11x=15y$$
     Ainsi $11$ divise $15y$. Or $\mathrm{PGCD}(11,15)=1$, donc d'après le **théorème de Gauss**, $11$ divise $y$ : il existe $k\in\mathbb{Z}$ tel que $y=11k$. En reportant : 
    $$11x=15\times 11k \qquad \text{d'où} \qquad x=15k$$

    $$\boxed{S=\left\{(15k\,;11k) \; ; \; k\in\mathbb{Z}\right\}}$$
     Vérification : $33\times 15k-45\times 11k=495k-495k=0$.

    **2.** L'équation $33x+45y=12$ admet des solutions car $\mathrm{PGCD}(33,45)=3$ divise $12$. On simplifie d'abord par $3$ : 
    $$11x+15y=4$$
     Solution particulière : on remarque que $11\times(-1)+15\times 1=4$, donc le couple $(-1\,;1)$ convient.

    Solutions générales : soit $(x\,;y)$ une solution. On soustrait terme à terme : 
    $$\left\{\begin{array}{l} 11x+15y=4 \\ 11\times(-1)+15\times 1=4 \end{array}\right. \qquad \Longrightarrow \qquad 11(x+1)+15(y-1)=0$$
     soit $11(x+1)=15(1-y)$. Comme $11$ et $15$ sont premiers entre eux et que $11$ divise $15(1-y)$, le théorème de Gauss donne $11\mid(1-y)$ : il existe $k\in\mathbb{Z}$ tel que $1-y=11k$, c'est-à-dire $y=1-11k$. En reportant, $11(x+1)=15\times 11k$, d'où $x=15k-1$. 
    $$\boxed{S=\left\{(15k-1\,;1-11k) \; ; \; k\in\mathbb{Z}\right\}}$$
     Vérification : $33(15k-1)+45(1-11k)=495k-33+45-495k=12$.
- id: "me-07-15"
  feuille: "f-me-07"
  numero: 15
  partie: "Théorème de Bézout et algorithme d'Euclide étendu"
  etoiles: 1
