  enonce: |
    Soient $u$ et $v$ deux entiers supérieurs ou égaux à $2$ et premiers entre eux. Montrer que le nombre $\dfrac{\ln(v)}{\ln(u)}$ est irrationnel.
  corrige: |
    Comme $u\geqslant 2$ et $v\geqslant 2$, on a $\ln(u)>0$ et $\ln(v)>0$ : le quotient est bien défini et strictement positif. Supposons par l'absurde qu'il soit rationnel : $\dfrac{\ln(v)}{\ln(u)}=\dfrac{p}{q}$ avec $p$ et $q$ dans $\mathbb{N}^{*}$. Alors : 
    $$q\ln(v)=p\ln(u) \iff \ln\left(v^{q}\right)=\ln\left(u^{p}\right) \iff v^{q}=u^{p}$$
     car la fonction $\ln$ est strictement croissante. Comme $u\geqslant 2$, $u$ admet un diviseur premier $r$. Alors $r$ divise $u^{p}=v^{q}$, donc, d'après le lemme d'Euclide (chapitre 1), $r$ divise $v$. Ainsi $r$ est un diviseur commun de $u$ et $v$ supérieur à $1$, ce qui contredit $\mathrm{PGCD}(u,v)=1$. 
    $$\boxed{\frac{\ln(v)}{\ln(u)} \text{ est irrationnel}}$$
     Par exemple, $\dfrac{\ln(3)}{\ln(2)}$ est irrationnel. C'est pourquoi aucune puissance de $3$ n'est une puissance de $2$, ce qui revient à dire, en musique, qu'aucune succession de quintes justes ne retombe exactement sur une octave.
- id: "me-07-38"
  feuille: "f-me-07"
  numero: 38
  titre: "Racines rationnelles d'un polynôme"
  partie: "Pour aller plus loin"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [entiers premiers entre eux, irrationalité]
  noeuds: [z-bezout, q-irrationnel]
  notions: []
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), § 12.5 (théorème 34) et n° 513"
  page_enonce: 7
  page_corrige: 27
  enonce: |
    Soient $n\in\mathbb{N}^{*}$, $a_{0},\dots,a_{n}$ des entiers relatifs avec $a_{0}a_{n}\neq 0$, et $P$ la fonction polynomiale définie par $P(x)=\displaystyle\sum_{k=0}^{n}a_{k}x^{k}$.

    **a)** Soit $r$ une racine rationnelle de $P$. On écrit $r=\dfrac{p}{q}$ où $p\in\mathbb{Z}$ et $q\in\mathbb{N}^{*}$ sont premiers entre eux. Montrer que $q$ divise $a_{n}$ et que $p$ divise $a_{0}$. On pourra utiliser l'exercice 36.

    **b)** En déduire que $\sqrt{2}$ est irrationnel.

    **c)** Montrer que l'équation $x^{5}-5x+7=0$ admet une unique solution réelle, puis que cette solution est un nombre irrationnel.
  corrige: |
    **a)** $P\left(\frac{p}{q}\right)=0$ s'écrit, après multiplication par $q^{n}$ : 
    $$\sum_{k=0}^{n}a_{k}p^{k}q^{n-k}=0$$
     On isole le terme $k=n$ : 
    $$a_{n}p^{n}=-\sum_{k=0}^{n-1}a_{k}p^{k}q^{n-k}=-q\sum_{k=0}^{n-1}a_{k}p^{k}q^{n-k-1}$$
     car $n-k\geqslant 1$ pour $k\leqslant n-1$. Donc $q$ divise $a_{n}p^{n}$. Comme $p$ et $q$ sont premiers entre eux, $q$ et $p^{n}$ le sont aussi (exercice 36), et le théorème de Gauss donne $\boxed{q\mid a_{n}}$.

    De même, en isolant le terme $k=0$ : $a_{0}q^{n}=-p\displaystyle\sum_{k=1}^{n}a_{k}p^{k-1}q^{n-k}$, donc $p$ divise $a_{0}q^{n}$. Comme $p$ et $q^{n}$ sont premiers entre eux, $\boxed{p\mid a_{0}}$.

    **b)** $\sqrt{2}$ est racine de $P(x)=x^{2}-2$, avec $a_{2}=1$ et $a_{0}=-2$. Si $P$ avait une racine rationnelle $\frac{p}{q}$ sous forme irréductible, on aurait $q\mid 1$, donc $q=1$, et $p\mid 2$ : la racine serait un entier parmi $\pm 1$ et $\pm 2$. Or leurs carrés valent $1$ ou $4$, et non $2$. Ainsi $P$ n'a pas de racine rationnelle, et $\boxed{\sqrt{2} \text{ est irrationnel}}$.

    **c)** Soit $P(x)=x^{5}-5x+7$. On a $P'(x)=5x^{4}-5=5(x^{2}-1)(x^{2}+1)$, du signe de $x^{2}-1$.

    ![Figure](documents/figures/4a1062f751f3947e.svg)

    Sur $[-1\,;+\infty[$, le minimum de $P$ est $P(1)=3>0$ : il n'y a pas de racine. Sur $]-\infty\,;-1]$, $P$ est continue et strictement croissante, avec $\displaystyle\lim_{x\to-\infty}P(x)=-\infty$ et $P(-1)=11>0$. D'après le théorème des valeurs intermédiaires, appliqué à une fonction strictement monotone, l'équation $P(x)=0$ y a une unique solution $\alpha$, et $\alpha<-1$.

    Si $\alpha$ était rationnel, d'après a), ce serait un entier ($q\mid 1$) divisant $7$, donc $\alpha\in\{-7\,;-1\,;1\,;7\}$. Or $P(-7)=-16\,765$, $P(-1)=11$, $P(1)=3$ et $P(7)=16\,779$ : aucun n'est nul. 
    $$\boxed{\text{l'unique solution réelle de } x^{5}-5x+7=0 \text{ est irrationnelle}}$$
- id: "me-07-39"
  feuille: "f-me-07"
  numero: 39
  titre: "L'équation diophantienne $ax+by=c$"
  partie: "Pour aller plus loin"
  etoiles: 4
  types: [Démonstration, Calcul]
  mots_cles: [PGCD, entiers premiers entre eux, théorème de Bézout, équations diophantiennes, suites]
  noeuds: [z-bezout, z-ideaux]
  notions: [pgcd]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 505"
  page_enonce: 7
  page_corrige: 28
  enonce: |
    Soient $a$ et $b$ deux éléments de $\mathbb{N}^{*}$ et $c\in\mathbb{Z}$. On note $\delta$ le PGCD de $a$ et $b$. On se propose de déterminer l'ensemble $E$ des couples $(x,y)\in\mathbb{Z}^{2}$ tels que $ax+by=c$. On écrit $a=\delta a'$, $b=\delta b'$ où $a'$ et $b'$ sont deux entiers premiers entre eux.

    **a)** Montrer que $E$ est non vide si et seulement si $\delta\mid c$.

    On suppose dans la suite que $\delta\mid c$. On fixe un élément $(x_{0},y_{0})$ de $E$.

    **b)** Pour $(x,y)\in\mathbb{Z}^{2}$, vérifier que $(x,y)\in E \iff a'(x-x_{0})=b'(y_{0}-y)$.

    **c)** Montrer que $E=\{(x_{0}+tb',\,y_{0}-ta')\;;\;t\in\mathbb{Z}\}$.
  corrige: |
    **a)** Si $(x\,;y)\in E$, $\delta$ divise $a$ et $b$, donc $ax+by=c$. Réciproquement, si $\delta\mid c$, écrivons $c=\delta c'$. L'identité de Bézout fournit $u$, $v$ tels que $au+bv=\delta$, d'où $a(uc')+b(vc')=c$ : le couple $(uc'\,;vc')$ est dans $E$. 
    $$\boxed{E\neq\varnothing \iff \delta\mid c}$$

    **b)** Comme $ax_{0}+by_{0}=c$ : 
    $$(x,y)\in E \iff ax+by=ax_{0}+by_{0} \iff a(x-x_{0})=b(y_{0}-y) \iff \delta a'(x-x_{0})=\delta b'(y_{0}-y)$$
     et l'on simplifie par $\delta\neq 0$ : $(x,y)\in E\iff a'(x-x_{0})=b'(y_{0}-y)$.

    **c)** Si $(x\,;y)\in E$, $b'$ divise $a'(x-x_{0})$ et $\mathrm{PGCD}(a',b')=1$ (exercice 29, question 1), donc $b'\mid x-x_{0}$ d'après le théorème de Gauss : $x=x_{0}+tb'$ avec $t\in\mathbb{Z}$. En reportant, $a'tb'=b'(y_{0}-y)$, donc $y=y_{0}-ta'$ puisque $b'\neq 0$. Réciproquement, pour $t\in\mathbb{Z}$, $a'(tb')=b'(ta')$, donc $(x_{0}+tb'\,;y_{0}-ta')\in E$ d'après b). 
    $$\boxed{E=\left\{(x_{0}+tb'\,,\,y_{0}-ta') \; ; \; t\in\mathbb{Z}\right\}}$$
     **Le piège** est d'utiliser $b$ et $a$ au lieu de $b'=\frac{b}{\delta}$ et $a'=\frac{a}{\delta}$ : on ne trouverait qu'une partie des solutions. On le voit à l'exercice 14, avec $33x+45y=12$ et $\delta=3$ : les solutions avancent de $15$ et $11$, et non de $45$ et $33$. L'exercice 19 en donne un autre exemple.
- id: "me-07-40"
  feuille: "f-me-07"
  numero: 40
  partie: "Pour aller plus loin"
  etoiles: 4
  types: [Calcul]
  mots_cles: [PGCD]
  noeuds: [z-bezout]
  notions: [pgcd]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 502"
  page_enonce: 7
  page_corrige: 29
  enonce: |
    Selon la valeur de $n\in\mathbb{Z}$, déterminer le PGCD de $n^{3}+n$ et $2n+1$.
  corrige: |
    Notons $D=\mathrm{PGCD}(n^{3}+n,2n+1)$, bien défini car $2n+1\neq 0$.

    • $D$ est premier avec $n$. Un diviseur commun de $D$ et $n$ divise $2n+1$ et $n$, donc $(2n+1)-2n=1$.

    • $D$ divise $n^{2}+1$. $D$ divise $n^{3}+n=n(n^{2}+1)$ et est premier avec $n$ : d'après le théorème de Gauss, $D\mid n^{2}+1$.

    • $D$ divise $5$. $D$ divise $4(n^{2}+1)$ et $(2n-1)(2n+1)=4n^{2}-1$, donc leur différence : $4n^{2}+4-4n^{2}+1=5$. Ainsi $D\in\{1\,;5\}$.

    • Quand vaut-il $5$ ? Si $D=5$, alors $5\mid 2n+1$, soit $2n\equiv 4\;[5]$, d'où $n\equiv 2\;[5]$ en multipliant par $3$, inverse de $2$ modulo $5$. Réciproquement, si $n\equiv 2\;[5]$, alors $2n+1\equiv 5\equiv 0$ et $n^{3}+n=n(n^{2}+1)\equiv 2\times 5\equiv 0\;[5]$, donc $5\mid D$.

    $$\boxed{\mathrm{PGCD}(n^{3}+n,2n+1)=\left\{\begin{array}{ll} 5 & \text{si } n\equiv 2\;[5] \\ 1 & \text{sinon} \end{array}\right.}$$
     Contrôle : $n=2$ donne $\mathrm{PGCD}(10,5)=5$ ; $n=7$ donne $\mathrm{PGCD}(350,15)=5$ ; $n=3$ donne $\mathrm{PGCD}(30,7)=1$. On reconnaît la méthode de l'exercice 11 : écarter le facteur $n$, premier avec $2n+1$, puis éliminer $n$ par une combinaison linéaire.
- id: "me-07-41"
  feuille: "f-me-07"
  numero: 41
  partie: "Pour aller plus loin"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [PGCD]
  noeuds: [z-bezout]
  notions: [pgcd]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 501"
  page_enonce: 7
  page_corrige: 29
  enonce: |
    En utilisant l'exercice 31 du chapitre 1, montrer que, si $a\geqslant 2$ est un entier, $m$ et $n$ deux éléments de $\mathbb{N}^{*}$, alors $a^{m}-1$ et $a^{n}-1$ ont pour PGCD $a^{\mathrm{PGCD}(m,n)}-1$.
  corrige: |
    Pour $k\in\mathbb{N}$, posons $N_{k}=a^{k}-1$. On a $N_{0}=0$, et la suite $(N_{k})$ est strictement croissante car $a\geqslant 2$. L'exercice 31 du chapitre 1 établit que, si $n=mq+r$ avec $0\leqslant r<m$, alors : 
    $$N_{n}=N_{m}\times Q+N_{r} \qquad \text{avec} \qquad 0\leqslant N_{r}<N_{m}$$
     pour un certain entier $Q$. Autrement dit, **le reste de la division de $N_{n}$ par $N_{m}$ est $N_{r}$, où $r$ est le reste de la division de $n$ par $m$**.

    Supposons $n>m$, le cas $n=m$ étant immédiat et le cas $n<m$ s'y ramenant par symétrie. D'après la Proposition 2, $\mathrm{PGCD}(N_{n},N_{m})=\mathrm{PGCD}(N_{m},N_{r})$. Appliquons l'algorithme d'Euclide aux exposants : $n$, $m$, $r_{0}=r$, $r_{1}$, …, jusqu'au dernier reste non nul $g=\mathrm{PGCD}(m,n)$, suivi de $0$. À chaque étape, les nombres $N$ correspondants suivent exactement le même schéma : 
    $$\mathrm{PGCD}(N_{n},N_{m})=\mathrm{PGCD}(N_{m},N_{r_{0}})=\mathrm{PGCD}(N_{r_{0}},N_{r_{1}})=\cdots$$

    $$\cdots=\mathrm{PGCD}(N_{g},N_{0})=\mathrm{PGCD}(N_{g},0)=N_{g}$$
     d'après la Proposition 1 pour la dernière égalité. 
    $$\boxed{\mathrm{PGCD}\left(a^{m}-1,a^{n}-1\right)=a^{\mathrm{PGCD}(m,n)}-1}$$
     On retrouve la question 3 de l'exercice 28 : $\mathrm{PGCD}(4^{n+1}-1,4^{n}-1)=4^{\mathrm{PGCD}(n+1,n)}-1=4^{1}-1=3$. Autre exemple : $\mathrm{PGCD}(2^{12}-1,2^{18}-1)=2^{6}-1=63$, ce que l'on vérifie avec $4095=63\times 65$ et $262\,143=63\times 4161$.
- id: "me-07-42"
  feuille: "f-me-07"
  numero: 42
  titre: "Relation de Bézout à coefficients dans $\\mathbb{N}$"
  partie: "Pour aller plus loin"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [entiers premiers entre eux, théorème de Bézout]
  noeuds: [z-bezout, z-ideaux]
  notions: []
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 506 (et n° 507 c pour la question c)"
  page_enonce: 8
  page_corrige: 29
  enonce: |
    Soient $a$ et $b$ deux éléments de $\mathbb{N}^{*}$ premiers entre eux.

    **a)** Montrer que $ab-a-b$ n'est pas de la forme $au+bv$ avec $u$ et $v$ dans $\mathbb{N}$.

    **b)** Montrer que si $n$ est un entier $\geqslant ab-a-b+1$ alors $n$ s'écrit $au+bv$ où $(u,v)\in\mathbb{N}^{2}$. On pourra remarquer que les $n-au$ pour $u\in\{0,\dots,b-1\}$ sont supérieurs ou égaux à $1-b$ et ont des restes distincts dans la division euclidienne par $b$.

    **c)** Application : avec des pièces de $5$ et de $8$ centimes, quel est le plus grand montant que l'on ne peut pas payer exactement ? Lister les montants impossibles, et comparer leur nombre à $\dfrac{(a-1)(b-1)}{2}$.
  corrige: |
    **a)** Supposons par l'absurde que $ab-a-b=au+bv$ avec $u$ et $v$ dans $\mathbb{N}$. Alors : 
    $$ab=a(u+1)+b(v+1)$$
     Ainsi $a$ divise $ab-a(u+1)=b(v+1)$. Comme $\mathrm{PGCD}(a,b)=1$, le théorème de Gauss donne $a\mid v+1$ ; or $v+1\geqslant 1$, donc $v+1\geqslant a$. De même, $b\mid u+1$, donc $u+1\geqslant b$. Mais alors : 
    $$ab=a(u+1)+b(v+1)\geqslant ab+ab=2ab$$
     ce qui est absurde puisque $ab>0$. $\boxed{ab-a-b \text{ n'est pas de la forme } au+bv,\ (u,v)\in\mathbb{N}^{2}}$

    **b)** Soit $n\geqslant ab-a-b+1$. Pour $u\in\{0,\dots,b-1\}$ : 
    $$n-au\geqslant n-a(b-1)\geqslant ab-a-b+1-ab+a=1-b$$
     Ces $b$ entiers ont des restes distincts modulo $b$. En effet, si $n-au\equiv n-au'\;[b]$, alors $b\mid a(u'-u)$, donc $b\mid u'-u$ par le théorème de Gauss ; comme $|u'-u|<b$, on a $u=u'$. Les $b$ restes possibles $0$, $1$, …, $b-1$ sont donc tous atteints, en particulier $0$ : il existe $u_{0}\in\{0,\dots,b-1\}$ tel que $n-au_{0}=bv_{0}$ avec $v_{0}\in\mathbb{Z}$. Comme $bv_{0}\geqslant 1-b>-b$, on a $v_{0}>-1$, donc $v_{0}\in\mathbb{N}$. 
    $$\boxed{n=au_{0}+bv_{0} \text{ avec } (u_{0},v_{0})\in\mathbb{N}^{2}}$$

    **c)** Avec $a=5$ et $b=8$, premiers entre eux, le plus grand montant impossible est : 
    $$\boxed{5\times 8-5-8=27 \text{ centimes}}$$
     et tout montant à partir de $28$ centimes est payable. En testant les montants de $1$ à $27$, on trouve que les montants payables sont $5$, $8$, $10$, $13$, $15$, $16$, $18$, $20$, $21$, $23$, $24$, $25$ et $26$. Les montants impossibles sont donc : 
    $$1,\ 2,\ 3,\ 4,\ 6,\ 7,\ 9,\ 11,\ 12,\ 14,\ 17,\ 19,\ 22,\ 27$$
     Il y en a $14=\dfrac{4\times 7}{2}=\dfrac{(a-1)(b-1)}{2}$. Cette formule est générale : c'est la question c de l'exercice 507 du poly. On peut la contrôler sur $a=3$, $b=5$ : les montants impossibles sont $1$, $2$, $4$, $7$, soit $4=\frac{2\times 4}{2}$, le plus grand valant $15-3-5=7$.

