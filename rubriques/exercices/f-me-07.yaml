  enonce: |
    Pour $n\in\mathbb{N}$, montrer que les nombres entiers $14n+3$ et $21n+4$ sont premiers entre eux. On explicitera une relation de Bézout.
  corrige: |
    On élimine $n$ en combinant les deux nombres avec les coefficients $3$ et $-2$, car $3\times 14=2\times 21=42$ : 
    $$3(14n+3)-2(21n+4)=42n+9-42n-8=1$$

    $$\boxed{3\times(14n+3)+(-2)\times(21n+4)=1}$$
     C'est une relation de Bézout. D'après le théorème de Bézout, $14n+3$ et $21n+4$ sont premiers entre eux pour tout $n\in\mathbb{N}$.
