  enonce: |
    Soient $a$ et $b$ deux éléments de $\mathbb{N}^{*}$. Montrer que $a$ et $b$ sont premiers entre eux si et seulement si $a+b$ et $ab$ sont premiers entre eux.
  corrige: |
    • Sens direct. Supposons $\mathrm{PGCD}(a,b)=1$, et supposons par l'absurde que $\mathrm{PGCD}(a+b,ab)>1$. Ce PGCD admet alors un diviseur premier $p$, qui divise $ab$ et $a+b$. D'après le lemme d'Euclide (chapitre 1), $p$ divise $a$ ou $b$. Si $p\mid a$, alors $p\mid(a+b)-a=b$ ; si $p\mid b$, alors $p\mid a$ de même. Dans les deux cas, $p$ est un diviseur commun de $a$ et $b$ supérieur à $1$ : c'est absurde.

    • Réciproque. Soit $d=\mathrm{PGCD}(a,b)$. Il divise $a+b$ et $ab$, donc il divise $\mathrm{PGCD}(a+b,ab)=1$ d'après la Proposition 4. D'où $d=1$.

    $$\boxed{\mathrm{PGCD}(a,b)=1 \iff \mathrm{PGCD}(a+b,ab)=1}$$
     Le passage par un diviseur premier est commode : être premiers entre eux, c'est n'avoir aucun facteur premier en commun.
