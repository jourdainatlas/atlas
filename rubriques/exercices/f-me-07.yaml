  page_enonce: 3
  page_corrige: 13
  enonce: |
    Soit l’équation $5x + 8y = 2$.

    **1.** Déterminer un couple d’entiers solution de cette équation.

    **2.** Déterminer l’ensemble des couples d’entiers solutions de cette équation.
  corrige: |
    **1.** $\mathrm{PGCD}(5,8)=1$ divise $2$ : l'équation admet des solutions. On cherche d'abord une solution de $5x+8y=1$ : comme $5\times(-3)+8\times 2=-15+16=1$, le couple $(-3\,;2)$ convient. En multipliant par $2$ : 
    $$5\times(-6)+8\times 4=2 \qquad \text{d'où} \qquad (x_{0}\,;y_{0})=(-6\,;4)$$
     On peut aussi remarquer directement que $5\times 2+8\times(-1)=2$ : 
    $$\boxed{(x_{0}\,;y_{0})=(2\,;-1)}$$

    **2.** Soit $(x\,;y)$ une solution. En soustrayant terme à terme : 
    $$5(x-2)+8(y+1)=0 \qquad \text{soit} \qquad 5(x-2)=-8(y+1)$$
     Comme $8$ divise $5(x-2)$ et que $\mathrm{PGCD}(5,8)=1$, le théorème de Gauss donne $8\mid(x-2)$ : il existe $k\in\mathbb{Z}$ tel que $x=8k+2$. En reportant, $5\times 8k=-8(y+1)$, d'où $y+1=-5k$ et $y=-5k-1$. 
    $$\boxed{S=\left\{(8k+2\,;-5k-1) \; ; \; k\in\mathbb{Z}\right\}}$$
     Vérification : $5(8k+2)+8(-5k-1)=40k+10-40k-8=2$.
- id: "me-07-19"
  feuille: "f-me-07"
  numero: 19
  partie: "Équations diophantiennes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [théorème de Bézout, équations diophantiennes]
  noeuds: [z-bezout, z-ideaux]
  notions: []
  page_enonce: 3
  page_corrige: 13
  enonce: |
    **1.** L'équation $6x+9y=20$ admet-elle des solutions entières ? Et l'équation $6x+9y=21$ ?

    **2.** Résoudre dans $\mathbb{Z}^{2}$ l'équation $6x+9y=21$. On commencera par simplifier l'équation.
  corrige: |
    **1.** $\mathrm{PGCD}(6,9)=3$. D'après le corollaire de Bézout, $6x+9y=c$ a des solutions entières si et seulement si $3$ divise $c$. 
    $$\boxed{6x+9y=20 \text{ n'a pas de solution entière, } 6x+9y=21 \text{ en a}}$$
     On peut aussi le voir directement : $6x+9y$ est toujours un multiple de $3$, ce que $20$ n'est pas.

    **2.** On divise par $3$ : l'équation équivaut à $2x+3y=7$. Le couple $(2\,;1)$ est solution évidente, car $4+3=7$. Si $(x\,;y)$ est solution, en soustrayant : 
    $$2(x-2)+3(y-1)=0 \qquad \text{soit} \qquad 2(x-2)=3(1-y)$$
     Comme $3$ divise $2(x-2)$ et que $\mathrm{PGCD}(2,3)=1$, le théorème de Gauss donne $x-2=3k$ avec $k\in\mathbb{Z}$, puis $y=1-2k$. 
    $$\boxed{S=\left\{(2+3k\,;1-2k) \; ; \; k\in\mathbb{Z}\right\}}$$
     Vérification : $6(2+3k)+9(1-2k)=12+18k+9-18k=21$. **L'erreur la plus répandue** est d'oublier de simplifier par $3$ : on obtiendrait alors $x=2+9k$, $y=1-6k$, et l'on perdrait les deux tiers des solutions.
- id: "me-07-20"
  feuille: "f-me-07"
  numero: 20
  partie: "Équations diophantiennes"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["algorithme d'Euclide", équations diophantiennes]
  noeuds: [z-bezout, z-division]
  notions: [division-euclidienne]
  page_enonce: 3
  page_corrige: 14
  enonce: |
    Soit l’équation $13x - 23y = 1$.

    **1.** Déterminer un couple d’entiers solution de cette équation par l’algorithme d’Euclide.

    **2.** Déterminer l’ensemble des couples d’entiers solutions de cette équation.
  corrige: |
    **1.** Algorithme d'Euclide appliqué à $23$ et $13$ : 
    $$\begin{aligned} 23 &= 13\times 1+10 \qquad (L_{1}) \\ 13 &= 10\times 1+3 \qquad (L_{2}) \\ 10 &= 3\times 3+1 \qquad (L_{3}) \\ 3 &= 1\times 3+0 \end{aligned}$$
     Le dernier reste non nul vaut $1$, donc $\mathrm{PGCD}(13,23)=1$ et l'équation admet des solutions.

    Remontée : 
    $$\begin{aligned} 1 &= 10-\textcolor{crouge}{3}\times 3 &&\text{or d'après } (L_{2}), \; 3=13-10 \\ &= 10-\textcolor{crouge}{(13-10)}\times 3 && \\ &= 4\times\textcolor{crouge}{10}-13\times 3 &&\text{or d'après } (L_{1}), \; 10=23-13 \\ &= 4\times\textcolor{crouge}{(23-13)}-13\times 3 && \\ &= 4\times 23-13\times 4-13\times 3 && \\ &= 4\times 23-7\times 13 && \end{aligned}$$
     On obtient $-7\times 13+4\times 23=1$, que l'on réécrit sous la forme demandée $13x-23y=1$ : 
    $$13\times(-7)-23\times(-4)=-91+92=1$$

    $$\boxed{(x_{0}\,;y_{0})=(-7\,;-4)}$$

    **2.** Soit $(x\,;y)$ une solution. En soustrayant terme à terme : 
    $$13(x+7)-23(y+4)=0 \qquad \text{soit} \qquad 13(x+7)=23(y+4)$$
     Comme $23$ divise $13(x+7)$ et que $\mathrm{PGCD}(13,23)=1$, le théorème de Gauss donne $23\mid(x+7)$ : il existe $k\in\mathbb{Z}$ tel que $x=23k-7$. En reportant, $13\times 23k=23(y+4)$, d'où $y=13k-4$. 
    $$\boxed{S=\left\{(23k-7\,;13k-4) \; ; \; k\in\mathbb{Z}\right\}}$$
     Vérification : $13(23k-7)-23(13k-4)=299k-91-299k+92=1$.
- id: "me-07-21"
  feuille: "f-me-07"
  numero: 21
  titre: "Points entiers d'une droite"
  partie: "Équations diophantiennes"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équations diophantiennes]
  noeuds: [z-bezout]
  notions: []
  page_enonce: 3
  page_corrige: 15
  enonce: |
    Dans un repère orthonormé, on considère la droite $\mathcal{D}$ d'équation $7x-4y=3$.

    **1.** Le point $A(1;1)$ appartient-il à $\mathcal{D}$ ?

    **2.** Déterminer tous les points de $\mathcal{D}$ dont les deux coordonnées sont des entiers relatifs.

    **3.** Quels sont ceux dont l'abscisse est comprise entre $0$ et $20$ et dont l'ordonnée est positive ? Représenter $\mathcal{D}$ et ces points pour $0\leqslant x\leqslant 10$.

    **4.** Que constate-t-on sur l'écart entre deux points consécutifs à coordonnées entières ?
  corrige: |
    **1.** $7\times 1-4\times 1=3$ : $\boxed{A\in\mathcal{D}}$

    **2.** On cherche les couples d'entiers $(x\,;y)$ tels que $7x-4y=3$. En soustrayant $7\times 1-4\times 1=3$ : 
    $$7(x-1)=4(y-1)$$
     $4$ divise $7(x-1)$ et $\mathrm{PGCD}(4,7)=1$, donc d'après le théorème de Gauss, $x-1=4k$ avec $k\in\mathbb{Z}$, puis $7\times 4k=4(y-1)$, d'où $y=1+7k$. La réciproque se vérifie : $7(1+4k)-4(1+7k)=7-4=3$. 
    $$\boxed{\text{Les points entiers de } \mathcal{D} \text{ sont les } M_{k}(1+4k\,;1+7k), \ k\in\mathbb{Z}}$$

    **3.** $0\leqslant 1+4k\leqslant 20$ donne $-\frac{1}{4}\leqslant k\leqslant\frac{19}{4}$, soit $k\in\{0\,;1\,;2\,;3\,;4\}$, et alors $y=1+7k\geqslant 0$ : 
    $$\boxed{(1\,;1),\ (5\,;8),\ (9\,;15),\ (13\,;22),\ (17\,;29)}$$

    ![Figure](documents/figures/3ed678a5458436dc.svg)

    La droite bleue traverse le quadrillage, mais ne passe exactement par un nœud, c'est-à-dire par un point à coordonnées entières, qu'aux points rouges. On passe de l'un au suivant en avançant de $4$ et en montant de $7$, comme le montrent les flèches orange.

    **4.** Deux points entiers consécutifs $M_{k}$ et $M_{k+1}$ sont séparés par le vecteur $\overrightarrow{M_{k}M_{k+1}}\begin{pmatrix} 4 \\ 7 \end{pmatrix}$, qui ne dépend pas de $k$ : ces points sont **régulièrement espacés**, à la distance $\sqrt{16+49}=\sqrt{65}$ les uns des autres. Le vecteur $\begin{pmatrix} 4 \\ 7 \end{pmatrix}$ est un vecteur directeur de $\mathcal{D}$, à coordonnées entières et premières entre elles : il est le plus petit possible.
- id: "me-07-22"
  feuille: "f-me-07"
  numero: 22
  partie: "Équations diophantiennes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [PGCD, entiers premiers entre eux, théorème de Bézout, équations diophantiennes]
  noeuds: [z-bezout, z-ideaux]
  notions: [pgcd]
  page_enonce: 4
  page_corrige: 15
  enonce: |
    **1.** Démontrer que : $\forall n \in\mathbb{Z}$, $\mathrm{PGCD}(14n + 3 , 5n + 1) = 1$.

    **2.** On considère l’équation diophantienne suivante : $(E)\; 87x + 31y = 2$.

    **(a)** Vérifier, à l’aide de la question 1, que $87$ et $31$ sont premiers entre eux.

    **(b)** En déduire un couple $(u , v)$ d’entiers relatifs tels que $87u + 31v = 1$ puis un couple $(x_{0} , y_{0})$ solution de $(E)$.

    **(c)** Déterminer l’ensemble des solutions de $(E)$.

    **3.** **Application :** Trouver les points de la droite $87x - 31y - 2 = 0$ dont les coordonnées sont des entiers naturels et dont l’abscisse est comprise entre $0$ et $10$.
  corrige: |
    **1.** C'est la question c) de l'exercice 10, valable ici pour tout entier relatif $n$ : 
    $$5\times(14n+3)-14\times(5n+1)=70n+15-70n-14=1$$
     D'après le théorème de Bézout : $\boxed{\forall n\in\mathbb{Z}, \; \mathrm{PGCD}(14n+3\,,\,5n+1)=1}$

    **2.** **(a)** Il suffit de choisir $n$ tel que $14n+3=87$, c'est-à-dire $14n=84$ et $n=6$. On vérifie alors que $5\times 6+1=31$. 
    $$\boxed{87 \text{ et } 31 \text{ sont premiers entre eux, d'après la question 1 avec } n=6}$$

    **(b)** La relation de la question 1, écrite pour $n=6$, fournit directement le couple de Bézout : 
    $$5\times 87-14\times 31=435-434=1 \qquad \text{d'où} \qquad \boxed{(u\,;v)=(5\,;-14)}$$
     *On retrouve le couple déjà obtenu par la remontée de l'algorithme d'Euclide, à l'exercice 12 : la question 1 fournit ici le résultat sans aucun calcul.*

    En multipliant cette égalité par $2$ : 
    $$87\times 10+31\times(-28)=2 \qquad \text{d'où} \qquad \boxed{(x_{0}\,;y_{0})=(10\,;-28)}$$

    **(c)** Soit $(x\,;y)$ une solution de $(E)$. En soustrayant terme à terme : 
    $$87(x-10)+31(y+28)=0 \qquad \text{soit} \qquad 87(x-10)=-31(y+28)$$
     Comme $31$ divise $87(x-10)$ et que $\mathrm{PGCD}(87,31)=1$, le théorème de Gauss donne $31\mid(x-10)$ : il existe $k\in\mathbb{Z}$ tel que $x=31k+10$. En reportant, $87\times 31k=-31(y+28)$, d'où $y=-87k-28$. 
    $$\boxed{S=\left\{(31k+10\,;-87k-28) \; ; \; k\in\mathbb{Z}\right\}}$$
     Vérification : $87(31k+10)+31(-87k-28)=2697k+870-2697k-868=2$.

    **3.** L'équation de la droite s'écrit $87x-31y=2$. Attention : le signe a changé, il ne s'agit plus de $(E)$. On repart du couple de Bézout $87\times 5-31\times 14=1$, que l'on multiplie par $2$ : 
    $$87\times 10-31\times 28=2 \qquad \text{d'où la solution particulière } (10\,;28)$$
     Soit $(x\,;y)$ une solution. En soustrayant terme à terme : 
    $$87(x-10)=31(y-28)$$
     Le théorème de Gauss donne $31\mid(x-10)$, donc $x=31k+10$ et $y=87k+28$.

    On cherche maintenant les points à coordonnées entières *naturelles* avec $0\leqslant x\leqslant 10$. Comme $x=31k+10$ : 
    $$0\leqslant 31k+10\leqslant 10 \iff -10\leqslant 31k\leqslant 0 \iff k=0$$
     et alors $y=28\geqslant 0$. 
    $$\boxed{\text{Le seul point convenable est } (10\,;28)}$$
     Vérification : $87\times 10-31\times 28-2=870-868-2=0$.
- id: "me-07-23"
  feuille: "f-me-07"
  numero: 23
  partie: "Équations diophantiennes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [théorème de Bézout]
  noeuds: [z-bezout, z-ideaux]
  notions: []
  page_enonce: 4
  page_corrige: 16
  enonce: |
    **1.** On considère l’équation $(E)\; :\; 8x + 5y = 1$, où $(x, y)$ est un couple d'entiers.

    **(a)** Donner une solution particulière de l’équation $(E)$.

    **(b)** Résoudre l’équation $(E)$.

    **2.** Soit $n \in\mathbb{N}$ tel qu’il existe un couple $(a, b)$ d’entiers vérifiant : $\left\{ \begin{array}{ll} n = 8a + 1 \\ n = 5b + 2 \end{array} \right.$

    **(a)** Montrer que le couple $(a , -b)$ est solution de $(E)$.

    **(b)** Quel est le reste, dans la division de $n$ par $40$ ?

    **3.** **(a)** Résoudre l’équation $8x + 5y = 100$, où $(x, y)$ est un couple d'entiers.

    **(b)** Au VIIIe siècle, un groupe d’hommes et de femmes a dépensé 100 pièces de monnaie dans une auberge. Les hommes ont dépensé $8$ pièces chacun et les femmes $5$ pièces chacune. Combien pouvait-il y avoir d’hommes et de femmes dans le groupe ?
  corrige: |
    **1.** **(a)** $\mathrm{PGCD}(8,5)=1$ divise $1$ : l'équation admet des solutions. On en cherche une évidente : 
    $$8\times 2+5\times(-3)=16-15=1 \qquad \text{d'où} \qquad \boxed{(x_{0}\,;y_{0})=(2\,;-3)}$$

    **(b)** Soit $(x\,;y)$ une solution. En soustrayant terme à terme : 
    $$8(x-2)+5(y+3)=0 \qquad \text{soit} \qquad 8(x-2)=-5(y+3)$$
     Comme $5$ divise $8(x-2)$ et que $\mathrm{PGCD}(5,8)=1$, le théorème de Gauss donne $5\mid(x-2)$ : il existe $k\in\mathbb{Z}$ tel que $x=5k+2$. En reportant, $8\times 5k=-5(y+3)$, d'où $y=-8k-3$. 
    $$\boxed{S=\left\{(5k+2\,;-8k-3) \; ; \; k\in\mathbb{Z}\right\}}$$
     Vérification : $8(5k+2)+5(-8k-3)=40k+16-40k-15=1$.

    **2.** **(a)** Les deux écritures de $n$ donnent $8a+1=5b+2$, c'est-à-dire : 
    $$8a-5b=1 \qquad \text{soit} \qquad 8a+5\times(-b)=1$$

    $$\boxed{\text{Le couple } (a\,;-b) \text{ est bien solution de } (E)}$$

    **(b)** D'après la question 1b, il existe $k\in\mathbb{Z}$ tel que : 
    $$a=5k+2 \qquad \text{et} \qquad -b=-8k-3, \text{ soit } b=8k+3$$
     On en déduit : 
    $$n=8a+1=8(5k+2)+1=40k+17$$
     Comme $0\leqslant 17<40$ : 
    $$\boxed{\text{Le reste de la division euclidienne de } n \text{ par } 40 \text{ est } 17}$$
     Vérification avec $k=0$ : $n=17$, et l'on a bien $17=8\times 2+1=5\times 3+2$.

    **3.** **(a)** $\mathrm{PGCD}(8,5)=1$ divise $100$ : l'équation admet des solutions. Une solution évidente saute aux yeux : 
    $$8\times 0+5\times 20=100 \qquad \text{d'où} \qquad (x_{0}\,;y_{0})=(0\,;20)$$
     Soit $(x\,;y)$ une solution. En soustrayant terme à terme : 
    $$8x+5(y-20)=0 \qquad \text{soit} \qquad 8x=5(20-y)$$
     Comme $5$ divise $8x$ et que $\mathrm{PGCD}(5,8)=1$, le théorème de Gauss donne $5\mid x$ : il existe $k\in\mathbb{Z}$ tel que $x=5k$. En reportant, $8\times 5k=5(20-y)$, d'où $y=20-8k$. 
    $$\boxed{S=\left\{(5k\,;20-8k) \; ; \; k\in\mathbb{Z}\right\}}$$
     Vérification : $8\times 5k+5(20-8k)=40k+100-40k=100$.

    **(b)** Notons $x$ le nombre d'hommes et $y$ celui de femmes. La dépense totale s'écrit $8x+5y=100$, et ces deux nombres doivent être des entiers **naturels**. On impose donc : 
    $$\left\{\begin{array}{l} 5k\geqslant 0 \\ 20-8k\geqslant 0 \end{array}\right. \qquad \text{soit} \qquad 0\leqslant k\leqslant\frac{20}{8}=2{,}5$$
     Les valeurs possibles sont $k\in\{0\,;1\,;2\}$ :

    ```tableau
    $k$ ¦ $0$ ¦ $1$ ¦ $2$
    Nombre d'hommes ¦ $0$ ¦ $5$ ¦ $10$
    Nombre de femmes ¦ $20$ ¦ $12$ ¦ $4$
    ```

    L'énoncé parle d'un groupe *d'hommes et de femmes* : les deux nombres doivent être non nuls, ce qui écarte $k=0$. 
    $$\boxed{\text{Soit } 5 \text{ hommes et } 12 \text{ femmes, soit } 10 \text{ hommes et } 4 \text{ femmes}}$$
     Vérification : $5\times 8+12\times 5=40+60=100$ et $10\times 8+4\times 5=80+20=100$.
- id: "me-07-24"
  feuille: "f-me-07"
  numero: 24
  titre: "À la ferme"
  partie: "Équations diophantiennes"
  etoiles: 2
  types: [Calcul]
  mots_cles: [théorème de Bézout, équations diophantiennes]
  noeuds: [z-bezout, z-ideaux]
  notions: []
  page_enonce: 4
  page_corrige: 18
  enonce: |
    Un éleveur dépense exactement $200$ € pour acheter des poules à $7$ € pièce et des lapins à $11$ € pièce. Il achète au moins un animal de chaque sorte.

    **1.** Traduire la situation par une équation diophantienne d'inconnues $x$ (nombre de poules) et $y$ (nombre de lapins).

    **2.** Déterminer un couple de Bézout pour $7$ et $11$, puis une solution particulière de l'équation.

    **3.** Résoudre l'équation dans $\mathbb{Z}^{2}$, puis déterminer les achats possibles.
  corrige: |
    **1.** La dépense s'écrit $\boxed{7x+11y=200}$, avec $x$ et $y$ entiers naturels non nuls.

    **2.** Algorithme d'Euclide : $11=7\times 1+4$, $7=4\times 1+3$, $4=3\times 1+1$. Remontée : 
    $$1=4-3=4-(7-4)=2\times 4-7=2\times(11-7)-7=2\times 11-3\times 7$$
     Ainsi $7\times(-3)+11\times 2=1$, et en multipliant par $200$ : 
    $$7\times(-600)+11\times 400=200 \qquad \text{d'où la solution particulière} \qquad (-600\,;400)$$

    **3.** Si $(x\,;y)$ est solution, en soustrayant : $7(x+600)=11(400-y)$. Comme $11$ divise $7(x+600)$ et que $\mathrm{PGCD}(7,11)=1$, le théorème de Gauss donne $x+600=11k$, puis $y=400-7k$, avec $k\in\mathbb{Z}$. La réciproque se vérifie : $7(11k-600)+11(400-7k)=-4200+4400=200$. 
    $$\boxed{S=\left\{(11k-600\,;400-7k) \; ; \; k\in\mathbb{Z}\right\}}$$
     On impose $x\geqslant 1$ et $y\geqslant 1$ : 
    $$11k\geqslant 601 \iff k\geqslant 54{,}6\ldots \qquad ; \qquad 7k\leqslant 399 \iff k\leqslant 57$$
     donc $k\in\{55\,;56\,;57\}$ :

    $$\begin{array}{|c||c|c|c|} \hline k & 55 & 56 & 57 \\ \hline \text{Poules} & 5 & 16 & 27 \\ \hline \text{Lapins} & 15 & 8 & 1 \\ \hline \end{array}$$

    $$\boxed{\text{3 achats possibles : } 5 \text{ poules et } 15 \text{ lapins, } 16 \text{ et } 8, \text{ ou } 27 \text{ et } 1}$$
     Vérification : $35+165=112+88=189+11=200$. La solution particulière obtenue par la remontée est très éloignée des solutions utiles : il ne faut pas s'en inquiéter, la solution générale permet de revenir dans le bon domaine.
- id: "me-07-25"
  feuille: "f-me-07"
  numero: 25
  partie: "Équations diophantiennes"
  etoiles: 3
  types: [Calcul]
  mots_cles: [équations diophantiennes]
  noeuds: [z-bezout]
  notions: []
  page_enonce: 4
  page_corrige: 18
  enonce: |
    $28$ personnes participent à un repas gastronomique. Le prix normal est de $26$€ sauf pour les étudiants et les enfants qui paient respectivement $17$ et $13$ euros. La somme totale recueillie est de $613$€. Calculer le nombre d’étudiants et d’enfants ayant participé au repas.
  corrige: |
    Notons $a$ le nombre d'adultes payant plein tarif, $e$ celui des étudiants et $f$ celui des enfants. L'énoncé se traduit par le système : 
    $$\left\{\begin{array}{l} a+e+f=28 \\ 26a+17e+13f=613 \end{array}\right.$$
     On élimine $a$ en remplaçant $a=28-e-f$ dans la seconde équation : 
    $$\begin{aligned} 26(28-e-f)+17e+13f &= 613 \\ 728-26e-26f+17e+13f &= 613 \\ -9e-13f &= -115 \end{aligned}$$

    $$\boxed{9e+13f=115}$$
     Il reste à résoudre cette équation diophantienne. Comme $\mathrm{PGCD}(9,13)=1$ divise $115$, elle admet des solutions.

    Solution particulière. On cherche d'abord un couple de Bézout pour $9$ et $13$ : 
    $$9\times 3-13\times 2=27-26=1$$
     En multipliant par $115$ : 
    $$9\times 345+13\times(-230)=115 \qquad \text{d'où} \qquad (e_{0}\,;f_{0})=(345\,;-230)$$

    Solutions générales. Soit $(e\,;f)$ une solution. En soustrayant terme à terme : 
    $$9(e-345)+13(f+230)=0 \qquad \text{soit} \qquad 9(e-345)=-13(f+230)$$
     Comme $13$ divise $9(e-345)$ et que $\mathrm{PGCD}(9,13)=1$, le théorème de Gauss donne $13\mid(e-345)$ : il existe $k\in\mathbb{Z}$ tel que $e=13k+345$. En reportant, $9\times 13k=-13(f+230)$, d'où $f=-9k-230$.

    Contraintes du problème. Les trois effectifs sont des entiers naturels : 
    $$\left\{\begin{array}{l} e=13k+345\geqslant 0 \\ f=-9k-230\geqslant 0 \\ a=28-e-f\geqslant 0 \end{array}\right. \qquad \text{soit} \qquad \left\{\begin{array}{l} k\geqslant -\frac{345}{13}\approx -26{,}5 \\[1mm] k\leqslant -\frac{230}{9}\approx -25{,}6 \\[1mm] 28-(13k+345)-(-9k-230)\geqslant 0 \end{array}\right.$$
     Les deux premières conditions imposent $-26{,}5\leqslant k\leqslant -25{,}6$, donc $k=-26$. On obtient alors : 
    $$e=13\times(-26)+345=-338+345=7 \qquad ; \qquad f=-9\times(-26)-230=234-230=4$$
     puis $a=28-7-4=17$. La troisième condition est bien vérifiée. 
    $$\boxed{17 \text{ adultes, } 7 \text{ étudiants et } 4 \text{ enfants}}$$
     Vérification : $17+7+4=28$ et $26\times 17+17\times 7+13\times 4=442+119+52=613$.
- id: "me-07-26"
  feuille: "f-me-07"
  numero: 26
  titre: "Théorème des restes chinois"
  partie: "Approfondissements"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [congruences, restes chinois]
  noeuds: [z-zn]
  notions: [anneau-zn]
  page_enonce: 4
  page_corrige: 19
  enonce: |
    On veut déterminer l’ensemble $S$ des entiers $n\in\mathbb{Z}$ vérifiant : $\left\{ \begin{array}{ll} n \equiv 9 \; [17] \\ n \equiv 3 \; [5] \end{array} \right.$

    **1.** Recherche d’un élément de S.

    On désigne par $(u, v)$ un couple d’entiers relatifs tel que : $17u + 5v = 1$.

    **(a)** Justifier l’existence d’un tel couple $(u, v)$.

    **(b)** On pose $n_{0} = 3 \times 17u + 9 \times 5v$. Démontrer que $n_{0}$ appartient à $S$.

    **(c)** Donner un exemple d’entier $n_{0}$ appartenant à $S$.

    **2.** Caractérisation des éléments de S.

    **(a)** Soit $n$ un entier relatif appartenant à $S$. Démontrer que $n - n_{0} \equiv 0 \; [85]$.

    **(b)** En déduire qu’un entier relatif $n$ appartient à $S$ si et seulement si $n$ peut s’écrire sous la forme $n = 43 + 85k$ où $k$ est un entier relatif.

    **3.** **Application :** Zoé sait qu’elle a entre $300$ et $400$ jetons. Si elle fait des tas de $17$ jetons, il lui en reste $9$. Si elle fait des tas de $5$ jetons, il lui en reste $3$. Combien a-t-elle de jetons ?
  corrige: |
    **1.** **(a)** Les nombres $17$ et $5$ sont deux nombres premiers distincts, donc $\mathrm{PGCD}(17,5)=1$. D'après le théorème de Bézout : 
    $$\boxed{\text{Il existe un couple } (u\,;v) \text{ d'entiers relatifs tel que } 17u+5v=1}$$

    **(b)** Montrons que $n_{0}=3\times 17u+9\times 5v$ vérifie les deux congruences.

    Modulo 17 : le terme $3\times 17u$ est un multiple de $17$, donc $n_{0}\equiv 9\times 5v\;[17]$. Or l'égalité $17u+5v=1$ donne $5v\equiv 1\;[17]$, d'où : 
    $$n_{0}\equiv 9\times 1\equiv 9\;[17]$$

    Modulo 5 : le terme $9\times 5v$ est un multiple de $5$, donc $n_{0}\equiv 3\times 17u\;[5]$. Or $17u\equiv 1\;[5]$, d'où : 
    $$n_{0}\equiv 3\times 1\equiv 3\;[5]$$

    $$\boxed{n_{0} \text{ appartient à } S}$$

    **(c)** Cherchons un couple de Bézout. Comme $17=5\times 3+2$ et $5=2\times 2+1$, la remontée donne : 
    $$\begin{aligned} 1 &= 5-\textcolor{crouge}{2}\times 2 &&\text{or } 2=17-5\times 3 \\ &= 5-\textcolor{crouge}{(17-5\times 3)}\times 2 && \\ &= 5-17\times 2+5\times 6 && \\ &= 17\times(-2)+5\times 7 && \end{aligned}$$
     On peut donc prendre $(u\,;v)=(-2\,;7)$. Alors : 
    $$n_{0}=3\times 17\times(-2)+9\times 5\times 7=-102+315=213$$
     On vérifie : $213=17\times 12+9$ et $213=5\times 42+3$. 
    $$\boxed{n_{0}=213 \text{ convient}}$$

    **2.** **(a)** Soit $n\in S$. Alors $n\equiv 9\;[17]$ et $n_{0}\equiv 9\;[17]$, donc par différence $n-n_{0}\equiv 0\;[17]$ : le nombre $17$ divise $n-n_{0}$. De même, $n\equiv 3\;[5]$ et $n_{0}\equiv 3\;[5]$ donnent que $5$ divise $n-n_{0}$.

    Ainsi $17$ et $5$ divisent tous deux $n-n_{0}$, et ils sont premiers entre eux. D'après le **corollaire du théorème de Gauss**, leur produit divise également $n-n_{0}$ : 
    $$\boxed{n-n_{0}\equiv 0\;[85]}$$

    **(b)** D'après ce qui précède, il existe $k\in\mathbb{Z}$ tel que $n=n_{0}+85k=213+85k$. Or $213=85\times 2+43$, donc en posant $k'=k+2$ : 
    $$n=43+85k'$$
     Réciproquement, tout entier de cette forme vérifie $n\equiv 43\equiv 9\;[17]$ (car $43=17\times 2+9$) et $n\equiv 43\equiv 3\;[5]$ (car $43=5\times 8+3$), donc appartient bien à $S$. 
    $$\boxed{S=\left\{43+85k \; ; \; k\in\mathbb{Z}\right\}}$$

    **3.** Le nombre $N$ de jetons vérifie $N\equiv 9\;[17]$ et $N\equiv 3\;[5]$ : il appartient donc à $S$, et s'écrit $N=43+85k$. La condition $300\leqslant N\leqslant 400$ donne : 
    $$300\leqslant 43+85k\leqslant 400 \iff 257\leqslant 85k\leqslant 357 \iff 3{,}02\leqslant k\leqslant 4{,}2$$
     Le seul entier convenable est $k=4$ : 
    $$N=43+85\times 4=43+340=\boxed{383 \text{ jetons}}$$
     Vérification : $383=17\times 22+9$ et $383=5\times 76+3$.
- id: "me-07-27"
  feuille: "f-me-07"
  numero: 27
  titre: "Restes chinois avec des modules non premiers entre eux"
  partie: "Approfondissements"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [entiers premiers entre eux, équations diophantiennes, congruences, restes chinois]
  noeuds: [z-bezout, z-zn]
  notions: [anneau-zn]
  page_enonce: 5
  page_corrige: 20
  enonce: |
    **1.** Montrer qu'aucun entier $n$ ne vérifie à la fois $n\equiv 1\;[6]$ et $n\equiv 4\;[8]$.

    **2.** On cherche les entiers $n$ tels que $n\equiv 3\;[6]$ et $n\equiv 5\;[8]$.

    **(a)** Montrer que $n$ convient si et seulement s'il existe deux entiers $a$ et $b$ tels que $n=6a+3=8b+5$, et en déduire que $3a-4b=1$.

    **(b)** Résoudre l'équation $3a-4b=1$ dans $\mathbb{Z}^{2}$, et en déduire que les entiers cherchés sont ceux qui vérifient $n\equiv 21\;[24]$.

    **3.** Comparer avec l'exercice 26 : pourquoi l'ensemble des solutions n'est-il pas formé des entiers congrus à un même nombre modulo $6\times 8=48$ ?
  corrige: |
    **1.** Si $n\equiv 1\;[6]$, alors $n=6q+1$ est impair. Si $n\equiv 4\;[8]$, alors $n=8q'+4$ est pair. Un entier ne peut pas être à la fois pair et impair : 
    $$\boxed{\text{le système } n\equiv 1\;[6],\ n\equiv 4\;[8] \text{ n'a aucune solution}}$$

    **2.** **(a)** $n\equiv 3\;[6]$ signifie qu'il existe $a\in\mathbb{Z}$ tel que $n=6a+3$, et $n\equiv 5\;[8]$ qu'il existe $b\in\mathbb{Z}$ tel que $n=8b+5$. Alors $6a+3=8b+5$, soit $6a-8b=2$, et en divisant par $2$ : $\boxed{3a-4b=1}$.

    **(b)** Le couple $(3\,;2)$ est solution, car $9-8=1$. En soustrayant : $3(a-3)=4(b-2)$. Par le théorème de Gauss, $a-3=4k$ avec $k\in\mathbb{Z}$, puis $b=2+3k$. Alors : 
    $$n=6(3+4k)+3=21+24k$$
     Réciproquement, si $n=21+24k$, alors $n=6(3+4k)+3\equiv 3\;[6]$ et $n=8(2+3k)+5\equiv 5\;[8]$. 
    $$\boxed{n\equiv 3\;[6] \text{ et } n\equiv 5\;[8] \iff n\equiv 21\;[24]}$$

    **3.** Dans l'exercice 26, les modules $17$ et $5$ sont premiers entre eux. Le corollaire de Gauss (Proposition 6) permettait alors de passer de « $17$ et $5$ divisent $n-n_{0}$ » à « $85$ divise $n-n_{0}$ ». Ici, $6$ et $8$ ne sont pas premiers entre eux, et la Proposition 6 ne s'applique pas : $6$ et $8$ divisent $45-21=24$, mais $48$ ne divise pas $24$. Le bon module est $24$, le plus petit multiple commun de $6$ et $8$ (voir l'exercice 29). Selon les restes imposés, le système peut alors n'avoir aucune solution (question 1), ou des solutions qui se répètent modulo $24$ (question 2).
- id: "me-07-28"
  feuille: "f-me-07"
  numero: 28
  partie: "Approfondissements"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [PGCD, entiers premiers entre eux, suites]
  noeuds: [z-bezout]
  notions: [pgcd]
  page_enonce: 5
  page_corrige: 20
  enonce: |
    Soit $(u_{n})$ la suite définie sur $\mathbb{N}$ par : $\left\{ \begin{array}{ll} u_{0} = 0 \\ u_{n+1} = 4u_{n} + 1 \end{array} \right.$

    **1.** **(a)** Calculer $u_{1}$, $u_{2}$ et $u_{3}$.

    **(b)** Montrer que pour $n\in\mathbb{N}$, $u_{n+1}$ et $u_{n}$ sont premiers entre eux.

    **2.** On pose pour $n\in\mathbb{N}$ : $v_{n} = u_{n} +\dfrac{1}{3}$

    **(a)** Montrer que $(v_{n})$ est une suite géométrique.

    **(b)** En déduire l’expression de $v_{n}$ puis celle de $u_{n}$ en fonction de $n$.

    **3.** Calculer $\mathrm{PGCD}(4^{n+1}- 1 , 4^{n} - 1)$.
  corrige: |
    **1.** **(a)** 
    $$u_{1}=4\times 0+1=\boxed{1} \quad ; \quad u_{2}=4\times 1+1=\boxed{5} \quad ; \quad u_{3}=4\times 5+1=\boxed{21}$$

    **(b)** Soit $n\in\mathbb{N}$. La relation de récurrence s'écrit : 
    $$u_{n+1}-4u_{n}=1 \qquad \text{c'est-à-dire} \qquad 1\times u_{n+1}+(-4)\times u_{n}=1$$
     C'est une combinaison linéaire de $u_{n+1}$ et $u_{n}$ à coefficients entiers, égale à $1$. D'après le théorème de Bézout : 
    $$\boxed{u_{n+1} \text{ et } u_{n} \text{ sont premiers entre eux}}$$

    **2.** **(a)** Pour tout $n\in\mathbb{N}$ : 
    $$\begin{aligned} v_{n+1} &= u_{n+1}+\frac{1}{3}=4u_{n}+1+\frac{1}{3}=4u_{n}+\frac{4}{3} \\ &= 4\left(u_{n}+\frac{1}{3}\right)=4v_{n} \end{aligned}$$

    $$\boxed{(v_{n}) \text{ est géométrique de raison } 4 \text{ et de premier terme } v_{0}=\frac{1}{3}}$$

    **(b)** On en déduit $v_{n}=\dfrac{1}{3}\times 4^{n}$, puis : 
    $$u_{n}=v_{n}-\frac{1}{3}=\frac{4^{n}}{3}-\frac{1}{3}$$

    $$\boxed{u_{n}=\frac{4^{n}-1}{3}}$$
     Vérification : $u_{3}=\dfrac{64-1}{3}=21$.

    **3.** L'expression précédente donne $4^{n}-1=3u_{n}$ et $4^{n+1}-1=3u_{n+1}$. Or le PGCD est compatible avec la multiplication par un entier positif : 
    $$\mathrm{PGCD}\left(4^{n+1}-1\,,\,4^{n}-1\right) =\mathrm{PGCD}\left(3u_{n+1}\,,\,3u_{n}\right) =3\times\mathrm{PGCD}(u_{n+1},u_{n})$$
     Or la question 1b a établi que $\mathrm{PGCD}(u_{n+1},u_{n})=1$ : 
    $$\boxed{\mathrm{PGCD}\left(4^{n+1}-1\,,\,4^{n}-1\right)=3}$$
     Vérification pour $n=2$ : $\mathrm{PGCD}(63,15)=3$.
- id: "me-07-29"
  feuille: "f-me-07"
  numero: 29
  titre: "PGCD et PPCM"
  partie: "Approfondissements"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [PGCD, entiers premiers entre eux, théorème de Gauss, PPCM]
  noeuds: [z-bezout]
  notions: [pgcd]
  page_enonce: 5
  page_corrige: 22
  enonce: |
    Soient $a$ et $b$ deux entiers naturels non nuls. On appelle *plus petit commun multiple* de $a$ et $b$, noté $\mathrm{PPCM}(a,b)$, le plus petit entier naturel non nul qui soit à la fois multiple de $a$ et de $b$. On note $d=\mathrm{PGCD}(a,b)$, et on écrit $a=da'$ et $b=db'$.

    **1.** Justifier que $a'$ et $b'$ sont premiers entre eux.

    **2.** On pose $m=da'b'$. Vérifier que $m$ est un multiple commun de $a$ et $b$.

    **3.** Soit $M$ un multiple commun de $a$ et $b$ non nul. En écrivant $M=ak$, montrer à l'aide du théorème de Gauss que $b'$ divise $k$, puis que $m$ divise $M$.

    **4.** En déduire que $\mathrm{PPCM}(a,b)=m$, puis que $\mathrm{PGCD}(a,b)\times\mathrm{PPCM}(a,b)=ab$.

    **5.** **Application :** deux roues dentées engrènent l'une sur l'autre. La première a $36$ dents, la seconde $60$. On marque d'un point rouge les deux dents en contact au départ. Combien de tours doit faire chaque roue pour que les deux points rouges se retrouvent en contact pour la première fois ?
  corrige: |
    **1.** Soit $\delta$ un diviseur commun positif de $a'$ et $b'$. Alors $d\delta$ divise $da'=a$ et $db'=b$ : c'est un diviseur commun de $a$ et $b$, donc $d\delta\leqslant d$, d'où $\delta\leqslant 1$. Ainsi $\boxed{\mathrm{PGCD}(a',b')=1}$. C'est aussi une conséquence de la Proposition 3 : $d=\mathrm{PGCD}(da',db')=d\times\mathrm{PGCD}(a',b')$.

    **2.** $m=da'b'=a\times b'=b\times a'$ : $m$ est bien un multiple de $a$ et de $b$.

    **3.** $M=ak=da'k$ est un multiple de $b=db'$ : il existe $j$ tel que $da'k=db'j$, soit $a'k=b'j$. Ainsi $b'$ divise $a'k$ ; comme $\mathrm{PGCD}(a',b')=1$, le théorème de Gauss donne $b'\mid k$. En écrivant $k=b'k'$ : 
    $$M=ab'k'=m\,k' \qquad \text{donc} \qquad m\mid M$$

    **4.** $m$ est un multiple commun non nul de $a$ et $b$. Si $M$ est un autre multiple commun positif, $m$ divise $M$ d'après la question 3, donc $m\leqslant M$. Ainsi $m$ est le plus petit : 
    $$\boxed{\mathrm{PPCM}(a,b)=da'b'}$$
     puis $d\times da'b'=(da')(db')=ab$, soit : 
    $$\boxed{\mathrm{PGCD}(a,b)\times\mathrm{PPCM}(a,b)=ab}$$

    **5.** À chaque dent qui passe, chaque roue avance d'une dent. Les deux points rouges se retrouvent face à face lorsque le nombre $N$ de dents passées est à la fois un multiple de $36$, pour que la première roue ait fait un nombre entier de tours, et de $60$, pour la seconde. Le premier tel $N$ est : 
    $$N=\mathrm{PPCM}(36,60)=\frac{36\times 60}{\mathrm{PGCD}(36,60)}=\frac{2160}{12}=180$$

    $$\boxed{\text{la première roue fait } \tfrac{180}{36}=5 \text{ tours, la seconde } \tfrac{180}{60}=3 \text{ tours}}$$
- id: "me-07-30"
  feuille: "f-me-07"
  numero: 30
  titre: "Nombres de Fermat"
  partie: "Approfondissements"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [PGCD, nombres premiers]
  noeuds: [z-bezout, z-premiers]
  notions: [pgcd, nombre-premier]
  page_enonce: 5
  page_corrige: 22
  enonce: |
    **1.** **(a)** Montrer que pour tout $x\in\mathbb{N}$ et $k\in\mathbb{N}^{*}$ : 
    $$x^{2k+1} + 1 = (x + 1)(x^{2k} - x^{2k-1} + \cdots + x^{2} - x + 1)$$

    **(b)** Montrer que si $m$ est impair alors, $2^{m} + 1$ n’est pas premier.

    **(c)** Montrer que si $m$ est un entier possédant un diviseur strict impair alors, $2^{m} + 1$ n'est pas premier.

    **(d)** En déduire que les seuls nombres premiers de la forme $(2^{m} + 1)$ sont de la forme $2^{2^{n}}+ 1$.

    **2.** On appelle **nombre de Fermat** tout nombre noté $F_{n}$ tel que : $F_{n} = 2^{2^{n}}+ 1$.

    **(a)** Calculer $F_{0}$, $F_{1}$, $F_{2}$, $F_{3}$, $F_{4}$ et vérifier qu’ils sont tous premiers.

    **(b)** Fermat pensait que $F_{5}$ était également premier. Qu’en pensez-vous ? On pourra utiliser un algorithme donnant la primalité d’un nombre.

    **(c)** Vérifier que pour tout $n \in \mathbb{N}$ : $F_{n+1} = (F_{n} -1)^{2} +1$. En déduire $\mathrm{PGCD}(F_{n} , F_{n+1})$.

    **3.** Montrer par récurrence que tout nombre de Fermat $F_{n}$ pour $n \geqslant 2$ a une écriture décimale se terminant par $7$.
  corrige: |
    **1.** **(a)** On développe le produit du membre de droite. En notant $S=x^{2k}-x^{2k-1}+\cdots+x^{2}-x+1$, la somme alternée des puissances de $x$ de $0$ à $2k$ : 
    $$(x+1)S=\underbrace{\left(x^{2k+1}-x^{2k}+\cdots+x^{3}-x^{2}+x\right)}_{x\times S} +\underbrace{\left(x^{2k}-x^{2k-1}+\cdots+x^{2}-x+1\right)}_{S}$$
     Tous les termes intermédiaires s'éliminent deux à deux, car ils apparaissent une fois avec chaque signe. Il ne reste que le premier terme de la première somme et le dernier de la seconde : 
    $$\boxed{x^{2k+1}+1=(x+1)\left(x^{2k}-x^{2k-1}+\cdots+x^{2}-x+1\right)}$$
     C'est le télescopage classique de la somme géométrique de raison $-x$.

    **(b)** Soit $m$ un entier impair, $m\geqslant 3$. On écrit $m=2k+1$ avec $k\geqslant 1$, et l'on applique l'égalité précédente à $x=2$ : 
    $$2^{m}+1=(2+1)\times S=3S$$
     Le nombre $2^{m}+1$ est donc divisible par $3$. Comme $m\geqslant 3$, on a $2^{m}+1\geqslant 9>3$ : 
    $$\boxed{2^{m}+1 \text{ n'est pas premier}}$$
     *Le cas $m=1$ est à écarter : $2^{1}+1=3$ est bien premier.*

    **(c)** Supposons que $m$ possède un diviseur strict impair $d>1$, et écrivons $m=dq$ avec $q\geqslant 1$. En posant $x=2^{q}$ et $d=2k+1$, l'égalité de la question a) donne : 
    $$2^{m}+1=\left(2^{q}\right)^{d}+1=x^{d}+1=(x+1)\times S=\left(2^{q}+1\right)\times S$$
     Le nombre $2^{q}+1$ est donc un diviseur de $2^{m}+1$. Il est strictement supérieur à $1$ puisque $q\geqslant 1$, et strictement inférieur à $2^{m}+1$ puisque $q<m$ (car $d>1$). 
    $$\boxed{2^{m}+1 \text{ n'est pas premier}}$$

    **(d)** Soit $m\geqslant 1$ tel que $2^{m}+1$ soit premier. D'après la question c), $m$ ne possède aucun diviseur impair strictement supérieur à $1$. Or tout entier s'écrit comme un produit de nombres premiers : si l'un d'eux était impair, il fournirait un tel diviseur. Tous les facteurs premiers de $m$ valent donc $2$ : 
    $$\boxed{m \text{ est une puissance de } 2, \text{ donc } 2^{m}+1=2^{2^{n}}+1}$$

    **2.** **(a)** 
    $$F_{0}=2^{1}+1=\boxed{3} \quad ; \quad F_{1}=2^{2}+1=\boxed{5} \quad ; \quad F_{2}=2^{4}+1=\boxed{17}$$

    $$F_{3}=2^{8}+1=\boxed{257} \quad ; \quad F_{4}=2^{16}+1=\boxed{65\,537}$$
     Les nombres $3$, $5$, $17$ et $257$ se testent rapidement. Pour $65\,537$, il suffit de tester les diviseurs premiers jusqu'à $\sqrt{65\,537}\approx 256$ : 
    $$\boxed{F_{0},\;F_{1},\;F_{2},\;F_{3} \text{ et } F_{4} \text{ sont tous premiers}}$$

    **(b)** 
    $$F_{5}=2^{32}+1=4\,294\,967\,297$$
     Un test de primalité montre que ce nombre **n'est pas premier** : 
    $$\boxed{F_{5}=641\times 6\,700\,417}$$
     La conjecture de Fermat est donc fausse. C'est Euler qui trouva cette factorisation en $1732$, près d'un siècle après Fermat. On ne connaît d'ailleurs aujourd'hui aucun nombre de Fermat premier au-delà de $F_{4}$.

    **(c)** Par définition, $F_{n}-1=2^{2^{n}}$, donc : 
    $$(F_{n}-1)^{2}+1=\left(2^{2^{n}}\right)^{2}+1=2^{2\times 2^{n}}+1=2^{2^{n+1}}+1=F_{n+1}$$

    $$\boxed{F_{n+1}=(F_{n}-1)^{2}+1}$$
     En développant, $F_{n+1}=F_{n}^{2}-2F_{n}+2$, donc : 
    $$F_{n+1}\equiv 2\;[F_{n}]$$
     Ainsi $\mathrm{PGCD}(F_{n},F_{n+1})=\mathrm{PGCD}(F_{n},2)$. Or $F_{n}=2^{2^{n}}+1$ est impair : 
    $$\boxed{\mathrm{PGCD}(F_{n},F_{n+1})=1}$$
     *Deux nombres de Fermat consécutifs sont donc toujours premiers entre eux.*

    **3.** Démontrons par récurrence la propriété $\mathcal{P}(n)$ : « $F_{n}$ se termine par le chiffre $7$ », pour $n\geqslant 2$.

    **Initialisation :** $F_{2}=17$ se termine bien par $7$, donc $\mathcal{P}(2)$ est vraie.

    **Hérédité :** Supposons $\mathcal{P}(n)$ vraie pour un entier $n\geqslant 2$, c'est-à-dire $F_{n}\equiv 7\;[10]$. Alors $F_{n}-1\equiv 6\;[10]$, et d'après la question 2c : 
    $$F_{n+1}=(F_{n}-1)^{2}+1\equiv 6^{2}+1=37\equiv 7\;[10]$$
     Donc $\mathcal{P}(n+1)$ est vraie.

    **Conclusion :** La propriété est vraie au rang $2$ et héréditaire : 
    $$\boxed{\text{Pour tout } n\geqslant 2, \; F_{n} \text{ se termine par le chiffre } 7}$$
     On le vérifie : $F_{2}=17$, $F_{3}=257$, $F_{4}=65\,537$, $F_{5}=4\,294\,967\,297$.
- id: "me-07-31"
  feuille: "f-me-07"
  numero: 31
  titre: "Cryptage RSA, tiré du BAC 2018"
  partie: "Approfondissements"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [équations diophantiennes, congruences, nombres premiers, cryptographie, suites]
  noeuds: [z-bezout, z-zn, z-premiers]
  notions: [anneau-zn, nombre-premier]
  page_enonce: 6
  page_corrige: 24
  enonce: |
    Le but de cet exercice est d’envisager une méthode de cryptage à clé publique d’une information numérique, appelée système RSA, en l’honneur des mathématiciens **Ronald Rivest**, **Adi Shamir** et **Leonard Adleman**, qui ont inventé cette méthode de cryptage en $1977$ et l’ont publiée en $1978$.

    Les questions $1$ et $2$ sont des questions préparatoires, la question $3$ aborde le cryptage, la question $4$ le décryptage.

    **1.** Cette question envisage de calculer le reste dans la division euclidienne par $55$ de certaines puissances de l’entier $8$.

    **(a)** Vérifier que $8^{7}\equiv 2 \; [55]$. En déduire le reste de la division euclidienne par $55$ du nombre $8^{21}$.

    **(b)** Vérifier que $8^{2}\equiv 9 \; [55]$ puis en déduire à l'aide de la question $a)$ le reste de la division euclidienne par $55$ de $8^{23}$.

    **2.** Dans cette question, on considère l’équation $(E) \; : \; 23x-40y=1$, dont les solutions sont des couples $(x,y)$ d’entiers relatifs.

    **(a)** Justifier le fait que l’équation $(E)$ admet au moins un couple solution.

    **(b)** Donner un couple, solution particulière de l’équation $(E)$.

    **(c)** Déterminer tous les couples d’entiers relatifs solutions de l’équation $(E)$.

    **(d)** En déduire qu’il existe un unique entier $d$ vérifiant les conditions $0\leqslant d<40$ et $23d\equiv 1 \; [40]$.

    **3.** **Cryptage dans le système RSA.**

    Une personne $A$ choisit deux nombres premiers $p$ et $q$ , puis calcule les produits $N=p\times q$ et $n=(p-1)\times(q-1)$. Elle choisit également un entier naturel $c$ premier avec $n$. La personne publie le couple $(N;c)$ qui est une clé publique permettant à quiconque de lui envoyer un nombre crypté. Les messages sont numérotés et transformés en une suite d’entiers compris entre $0$ et $N-1$. Pour crypter un entier $a$ de cette suite, on procède ainsi : on calcule le reste $b$ dans la division euclidienne par $N$ du nombre $a^{c}$ et le nombre crypté est l’entier $b$. Dans la pratique, cette méthode est sûre si la personne $A$ choisit des nombres premiers $p$ et $q$ très grands, s’écrivant avec plusieurs dizaines de chiffres. On va l’envisager ici avec des nombres plus simples : $p=5$ et $q=11$. La personne $A$ choisit également $c=23$.

    **(a)** Calculer les nombres $N$ et $n$, puis justifier que $c$ vérifie la condition voulue.

    **(b)** Un émetteur souhaite envoyer à la personne $A$ le nombre $a=8$. Déterminer la valeur du nombre crypté $b$.

    **4.** **Décryptage dans le système RSA.**

    La personne $A$ calcule dans un premier temps l’unique entier naturel $d$ vérifiant les conditions : $0\leqslant d<n$ et $cd\equiv 1 \; [n]$. Elle garde secret le nombre $d$ qui lui permet, et à elle seule, de décrypter les nombres qui lui ont été envoyés cryptés avec la clé publique. Pour décrypter un nombre crypté $b$, la personne $A$ calcule le reste de la division euclidienne par $N$ du nombre $b^{d}$ , et le nombre en clair (c’est-à-dire le nombre avant le cryptage) est le nombre $a$. On admet l’existence et l’unicité de l’entier $d$, et le fait que le décryptage fonctionne. Les nombres choisis par $A$ sont encore $p=5$, $q=11$ et $c=23$.

    **(a)** Quelle est la valeur de $d$ ?

    **(b)** En appliquant la règle de décryptage, retrouver le nombre en clair lorsque le nombre crypté est $b=17$.
  corrige: |
    **1.** **(a)** On calcule les puissances de $8$ modulo $55$ de proche en proche : 
    $$8^{2}=64\equiv 9\;[55] \quad ; \quad 8^{4}\equiv 9^{2}=81\equiv 26\;[55]$$

    $$8^{6}\equiv 26\times 9=234=4\times 55+14\equiv 14\;[55]$$

    $$8^{7}\equiv 14\times 8=112=2\times 55+2\equiv 2\;[55]$$

    $$\boxed{8^{7}\equiv 2\;[55]}$$
     On en déduit, en élevant au cube : 
    $$8^{21}=\left(8^{7}\right)^{3}\equiv 2^{3}=8\;[55]$$

    $$\boxed{\text{Le reste de la division euclidienne de } 8^{21} \text{ par } 55 \text{ est } 8}$$

    **(b)** Le premier calcul ci-dessus donne $\boxed{8^{2}\equiv 9\;[55]}$. On décompose alors : 
    $$8^{23}=8^{21}\times 8^{2}\equiv 8\times 9=72=55+17\equiv 17\;[55]$$

    $$\boxed{\text{Le reste de la division euclidienne de } 8^{23} \text{ par } 55 \text{ est } 17}$$

    **2.** **(a)** $\mathrm{PGCD}(23,40)=1$ car $23$ est premier et ne divise pas $40$. Comme $1$ divise $1$, le corollaire de Bézout garantit : 
    $$\boxed{\text{L'équation } (E) \text{ admet au moins un couple solution}}$$

    **(b)** On cherche un couple par l'algorithme d'Euclide : 
    $$\begin{aligned} 40 &= 23\times 1+17 \qquad (L_{1}) \\ 23 &= 17\times 1+6 \qquad (L_{2}) \\ 17 &= 6\times 2+5 \qquad (L_{3}) \\ 6 &= 5\times 1+1 \qquad (L_{4}) \end{aligned}$$
     Remontée : 
    $$\begin{aligned} 1 &= 6-\textcolor{crouge}{5}\times 1 &&\text{or } (L_{3}) : \; 5=17-6\times 2 \\ &= 6-\textcolor{crouge}{(17-6\times 2)}=3\times\textcolor{crouge}{6}-17 &&\text{or } (L_{2}) : \; 6=23-17 \\ &= 3\times\textcolor{crouge}{(23-17)}-17=3\times 23-4\times\textcolor{crouge}{17} &&\text{or } (L_{1}) : \; 17=40-23 \\ &= 3\times 23-4\times\textcolor{crouge}{(40-23)}=7\times 23-4\times 40 && \end{aligned}$$

    $$\boxed{(x_{0}\,;y_{0})=(7\,;4) \quad \text{car} \quad 23\times 7-40\times 4=161-160=1}$$

    **(c)** Soit $(x\,;y)$ une solution. En soustrayant terme à terme : 
    $$23(x-7)-40(y-4)=0 \qquad \text{soit} \qquad 23(x-7)=40(y-4)$$
     Comme $40$ divise $23(x-7)$ et que $\mathrm{PGCD}(23,40)=1$, le théorème de Gauss donne $40\mid(x-7)$ : il existe $k\in\mathbb{Z}$ tel que $x=40k+7$. En reportant, $23\times 40k=40(y-4)$, d'où $y=23k+4$. 
    $$\boxed{S=\left\{(40k+7\,;23k+4) \; ; \; k\in\mathbb{Z}\right\}}$$
     Vérification : $23(40k+7)-40(23k+4)=920k+161-920k-160=1$.

    **(d)** Dire que $23d\equiv 1\;[40]$ signifie que $40$ divise $23d-1$, c'est-à-dire qu'il existe un entier $y$ tel que $23d-40y=1$ : le couple $(d\,;y)$ est solution de $(E)$. D'après la question c), $d$ s'écrit $d=40k+7$. La condition $0\leqslant d<40$ impose alors $k=0$. 
    $$\boxed{d=7 \text{ est l'unique entier vérifiant les deux conditions}}$$

    **3.** **(a)** 
    $$N=p\times q=5\times 11=\boxed{55} \qquad ; \qquad n=(p-1)(q-1)=4\times 10=\boxed{40}$$
     Il reste à vérifier que $c=23$ est premier avec $n=40$, ce qui a été établi à la question 2a : 
    $$\boxed{\mathrm{PGCD}(23,40)=1 : \text{la condition est bien remplie}}$$

    **(b)** Le nombre crypté $b$ est le reste de la division euclidienne de $a^{c}=8^{23}$ par $N=55$. C'est exactement le calcul de la question 1b : 
    $$\boxed{b=17}$$

    **4.** **(a)** L'entier $d$ doit vérifier $0\leqslant d<n=40$ et $cd=23d\equiv 1\;[40]$ : c'est précisément la caractérisation de la question 2d. 
    $$\boxed{d=7}$$

    **(b)** On calcule le reste de $b^{d}=17^{7}$ modulo $55$, de proche en proche : 
    $$17^{2}=289=5\times 55+14\equiv 14\;[55]$$

    $$17^{4}\equiv 14^{2}=196=3\times 55+31\equiv 31\;[55]$$

    $$17^{6}\equiv 31\times 14=434=7\times 55+49\equiv 49\;[55]$$

    $$17^{7}\equiv 49\times 17=833=15\times 55+8\equiv 8\;[55]$$

    $$\boxed{a=8}$$
     On retrouve bien le nombre initial de la question 3b : le décryptage fonctionne.

    *Toute la sécurité du procédé repose sur le fait que $d$ se calcule à partir de $n=(p-1)(q-1)$, donc de la factorisation $N=p\times q$. Avec $N=55$, cette factorisation est immédiate ; avec un $N$ de plusieurs centaines de chiffres, elle est hors de portée des ordinateurs actuels.*
