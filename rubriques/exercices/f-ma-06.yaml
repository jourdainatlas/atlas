  page_enonce: 5
  page_corrige: 12
  enonce: |
    Déterminer une primitive des fonctions suivantes à l'aide d'une intégration par parties.

    **(a)** $x \mapsto \operatorname{Arctan} x$

    **(b)** $x \mapsto \operatorname{Arcsin} x$

    **(c)** $x \mapsto \ln(1 + x^{2})$

    **(d)** $x \mapsto (x\ln x)^{2}$

    **(e)** $x \mapsto \dfrac{x}{\cos^{2} x}$

    **(f)** $x \mapsto x\operatorname{ch} x$

    **(g)** $x \mapsto x\sin^{2} x$

    **(h)** $x \mapsto x\operatorname{Arctan} x$

    **(i)** $x \mapsto \sin(\ln x)$
  corrige: |
    On intègre par parties sur $[x_{0}\,,x]$ ; dans les cinq premiers cas, on primitive $1$ en $t$ et l'on dérive la fonction donnée, dont la dérivée est plus simple.

    • **(a)** $\int^{x} \operatorname{Arctan} t\,\mathrm{d} t = x\operatorname{Arctan} x - \int^{x} \frac{t}{1 + t^{2}}\,\mathrm{d} t$. Sur $\mathbb{R}$ : $\boxed{x \mapsto x\operatorname{Arctan} x - \frac{1}{2}\ln(1 + x^{2})}$

    • **(b)** $\int^{x} \operatorname{Arcsin} t\,\mathrm{d} t = x\operatorname{Arcsin} x - \int^{x} \frac{t}{\sqrt{1 - t^{2}}}\,\mathrm{d} t$. Sur $]-1\,,1[$ : $\boxed{x \mapsto x\operatorname{Arcsin} x + \sqrt{1 - x^{2}}}$

    • **(c)** On dérive $\ln(1 + t^{2})$, ce qui laisse à primitiver $\frac{2t^{2}}{1 + t^{2}} = 2 - \frac{2}{1 + t^{2}}$. Sur $\mathbb{R}$ : 
    $$\boxed{x \mapsto x\ln(1 + x^{2}) - 2x + 2\operatorname{Arctan} x}$$

    • **(d)** On primitive $t^{2}$ et l'on dérive $(\ln t)^{2}$, puis on recommence avec $t^{2}\ln t$ (exercice 15 (b)). Sur $]0\,,+\infty[$ : 
    $$\boxed{x \mapsto \frac{x^{3}}{3}(\ln x)^{2} - \frac{2x^{3}}{9}\ln x + \frac{2x^{3}}{27}}$$

    • **(e)** On primitive $\frac{1}{\cos^{2} t}$ en $\tan t$ et l'on dérive $t$. Sur $\big]-\frac{\pi}{2}\,,\frac{\pi}{2}\big[$ : $\boxed{x \mapsto x\tan x + \ln(\cos x)}$

    • **(f)** On primitive $\operatorname{ch}$ et l'on dérive $t$. Sur $\mathbb{R}$ : $\boxed{x \mapsto x\operatorname{sh} x - \operatorname{ch} x}$

    • **(g)** On linéarise $x\sin^{2} x = \frac{x}{2} - \frac{x\cos(2x)}{2}$, puis on intègre le second terme par parties. Sur $\mathbb{R}$ : 
    $$\boxed{x \mapsto \frac{x^{2}}{4} - \frac{x\sin(2x)}{4} - \frac{\cos(2x)}{8}}$$

    • **(h)** On primitive $t$ en $\frac{1 + t^{2}}{2}$, comme à l'exercice 15 (i) : l'intégrale restante est $\int \frac{1}{2}\,\mathrm{d} t$. Sur $\mathbb{R}$ : $\boxed{x \mapsto \frac{1 + x^{2}}{2}\operatorname{Arctan} x - \frac{x}{2}}$

    • **(i)** Deux intégrations par parties, en primitivant $1$ chaque fois, donnent 
    $$\int^{x} \sin(\ln t)\,\mathrm{d} t = x\sin(\ln x) - x\cos(\ln x) - \int^{x} \sin(\ln t)\,\mathrm{d} t.$$
     Sur $]0\,,+\infty[$, on obtient donc : 
    $$\boxed{x \mapsto \frac{x}{2}\big(\sin(\ln x) - \cos(\ln x)\big)}$$
