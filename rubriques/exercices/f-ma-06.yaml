  enonce: |
    Pour tous entiers naturels $p$ et $q$, on pose $I_{p,q} = \displaystyle\int_{0}^{1} t^{p}(1 - t)^{q}\,\mathrm{d} t$.

    **1.** Montrer que $I_{p,q} = I_{q,p}$.

    **2.** Montrer que $I_{p,q} = \dfrac{q}{p + 1}\,I_{p+1,q-1}$ pour $q \geqslant 1$, puis que $I_{p,q} = \dfrac{p!\,q!}{(p + q + 1)!}$.

    **3.** En développant $(1 - t)^{q}$ par la formule du binôme, en déduire que 
    $$\sum_{k=0}^{q} \binom{q}{k}\frac{(-1)^{k}}{p + k + 1} = \frac{p!\,q!}{(p + q + 1)!}.$$

    **4.** Vérifier ce résultat pour $p = 0$ et $q = 2$, puis retrouver la valeur de $\displaystyle\int_{0}^{1} x^{4}(1 - x)^{4}\,\mathrm{d} x$ de l'exercice 9.
  corrige: |
    **1.** Le changement de variable $t = 1 - u$ échange les bornes $0$ et $1$, et $\mathrm{d} t = -\mathrm{d} u$ : 
    $$I_{p,q} = \int_{1}^{0} (1 - u)^{p}u^{q}\,(-\mathrm{d} u) = \int_{0}^{1} u^{q}(1 - u)^{p}\,\mathrm{d} u = \boxed{I_{q,p}}.$$
     **2.** Pour $q \geqslant 1$, on primitive $t^{p}$ en $\frac{t^{p+1}}{p + 1}$ et l'on dérive $(1 - t)^{q}$ ; le crochet est nul aux deux bornes : 
    $$I_{p,q} = \Big[\frac{t^{p+1}}{p + 1}(1 - t)^{q}\Big]_{0}^{1} + \frac{q}{p + 1}\int_{0}^{1} t^{p+1}(1 - t)^{q-1}\,\mathrm{d} t = \boxed{\frac{q}{p + 1}\,I_{p+1,q-1}}.$$
     En appliquant cette relation $q$ fois, l'exposant de $1 - t$ descend jusqu'à $0$ : 
    $$I_{p,q} = \frac{q}{p + 1}\cdot\frac{q - 1}{p + 2}\cdots\frac{1}{p + q}\,I_{p+q,0} = \frac{q!\,p!}{(p + q)!}\cdot\frac{1}{p + q + 1},$$
     puisque $I_{p+q,0} = \frac{1}{p + q + 1}$. 
    $$\boxed{I_{p,q} = \frac{p!\,q!}{(p + q + 1)!}}$$
     **3.** La formule du binôme donne $(1 - t)^{q} = \sum_{k=0}^{q} \binom{q}{k}(-1)^{k}t^{k}$, d'où, par linéarité, 
    $$I_{p,q} = \sum_{k=0}^{q} \binom{q}{k}(-1)^{k}\int_{0}^{1} t^{p+k}\,\mathrm{d} t, \qquad\text{soit}\qquad \boxed{\sum_{k=0}^{q} \binom{q}{k}\frac{(-1)^{k}}{p + k + 1} = \frac{p!\,q!}{(p + q + 1)!}}.$$
     **4.** Pour $p = 0$ et $q = 2$, le membre de gauche vaut $1 - \frac{2}{2} + \frac{1}{3} = \frac{1}{3}$, et celui de droite $\frac{0!\,2!}{3!} = \frac{1}{3}$. ✓ Pour $p = q = 4$ : 
    $$\boxed{\int_{0}^{1} x^{4}(1 - x)^{4}\,\mathrm{d} x = \frac{4!\,4!}{9!} = \frac{576}{362\,880} = \frac{1}{630}}$$
     C'est bien la valeur trouvée à l'exercice 9 en développant.
- id: "ma-06-25"
  feuille: "f-ma-06"
  numero: 25
  partie: "Calcul de primitives et d'intégrales"
  etoiles: 3
