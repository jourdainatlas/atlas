  notions: [riemann-integrable]
  page_enonce: 14
  page_corrige: 38
  enonce: |
    *Équations fonctionnelles de Cauchy.*

    **1.** Soit $f : \mathbb{R} \to \mathbb{R}$ dérivable telle que $f(x + y) = f(x) + f(y)$ pour tous réels $x$, $y$. Calculer $f(0)$, puis, en dérivant cette relation par rapport à $x$, montrer qu'il existe un réel $a$ tel que $f(x) = ax$ pour tout réel $x$.

    **2.** On suppose seulement que $f : \mathbb{R} \to \mathbb{R}$ est continue et vérifie la même relation. Soit $F$ une primitive de $f$.

    **(a)** En intégrant la relation par rapport à $y$ entre $0$ et $1$, montrer que, pour tout réel $x$, 
    $$f(x) = F(x + 1) - F(x) - \int_{0}^{1} f(t)\,\mathrm{d} t.$$

    **(b)** En déduire que $f$ est dérivable, puis qu'elle est de la forme $x \mapsto ax$.

    **3.** Soit $g : \mathbb{R} \to \mathbb{R}$ continue, non identiquement nulle, telle que $g(x + y) = g(x)\,g(y)$ pour tous réels $x$, $y$. Montrer que $g$ ne s'annule pas, puis qu'elle est strictement positive, et en déduire qu'il existe un réel $a$ tel que $g(x) = \mathrm{e}^{ax}$ pour tout réel $x$.

    **4.** Déterminer les fonctions $h : ]0\,,+\infty[ \to \mathbb{R}$ continues telles que $h(xy) = h(x) + h(y)$ pour tous réels $x$, $y$ strictement positifs.
  corrige: |
    **1.** Avec $x = y = 0$, la relation donne $f(0) = 2f(0)$, donc $\boxed{f(0) = 0}$. Fixons $y$ et dérivons les deux membres par rapport à $x$ ; la fonction $x \mapsto f(x + y)$ a pour dérivée $x \mapsto f'(x + y)$, et le terme $f(y)$ est constant : 
    $$f'(x + y) = f'(x) \quad\text{pour tous réels } x, y, \qquad\text{donc}\qquad f'(y) = f'(0) \text{ en prenant } x = 0.$$
     Avec $a = f'(0)$, la fonction $x \mapsto f(x) - ax$ a une dérivée nulle sur l'intervalle $\mathbb{R}$ : elle est constante (théorème 1 du chapitre 5), égale à sa valeur $f(0) = 0$ en $0$. 
    $$\boxed{f(x) = ax, \quad a = f'(0)}$$
     Réciproquement, $a(x + y) = ax + ay$ : ces fonctions conviennent.

    **2.(a)** Fixons $x$. Les deux membres de $f(x + y) = f(x) + f(y)$ sont des fonctions continues de $y$, que l'on intègre entre $0$ et $1$. À gauche, le changement de variable $t = x + y$ (proposition 5) donne 
    $$\int_{0}^{1} f(x + y)\,\mathrm{d} y = \int_{x}^{x+1} f(t)\,\mathrm{d} t = F(x + 1) - F(x),$$
     et à droite, $f(x)$ ne dépend pas de $y$, d'où $f(x) + \int_{0}^{1} f$. 
    $$\boxed{f(x) = F(x + 1) - F(x) - \int_{0}^{1} f(t)\,\mathrm{d} t}$$
     **(b)** La primitive $F$ est dérivable, donc le second membre l'est : $f$ est dérivable, et la relation, appliquée avec $y = 1$, donne 
    $$f'(x) = f(x + 1) - f(x) = f(1).$$
     La question 1 s'applique alors. 
    $$\boxed{f(x) = f(1)\,x \text{ pour tout réel } x}$$
     L'intégration a *régularisé* la fonction : partant d'une fonction seulement continue, on l'a écrite à l'aide de sa primitive, qui est dérivable. Cauchy avait résolu ce problème pour les fonctions continues dans son *Cours d'analyse* de 1821, par une autre méthode, qui passe par les valeurs rationnelles et que le chapitre 7 permettra de reprendre ; sans hypothèse de continuité, Hamel a montré en 1905 qu'il existe d'autres solutions, dont la construction utilise l'axiome du choix.

    **3.** Si $g$ s'annulait en un réel $x_{0}$, on aurait, pour tout réel $x$, 
    $$g(x) = g\big(x_{0} + (x - x_{0})\big) = g(x_{0})\,g(x - x_{0}) = 0,$$
     ce qui est exclu. Pour tout réel $x$, on a ensuite $g(x) = g\big(\frac{x}{2}\big)^{2}$, en appliquant la relation à $\frac{x}{2}$ et $\frac{x}{2}$ : c'est le carré d'un réel non nul. 
    $$\boxed{g(x) > 0 \text{ pour tout réel } x}$$
     La fonction $k = \ln \circ\, g$ est donc définie et continue sur $\mathbb{R}$, et elle vérifie, pour tous réels $x$, $y$, 
    $$k(x + y) = \ln\big(g(x)\,g(y)\big) = k(x) + k(y).$$
     D'après la question 2, $k(x) = ax$ avec $a = k(1)$, et l'on compose par $\exp$. 
    $$\boxed{g(x) = \mathrm{e}^{ax}, \quad a = \ln g(1)}$$
     Réciproquement, $\mathrm{e}^{a(x + y)} = \mathrm{e}^{ax}\mathrm{e}^{ay}$. La fonction nulle, exclue par l'énoncé, est la seule autre solution continue.

    **4.** La fonction $k : t \mapsto h(\mathrm{e}^{t})$ est continue sur $\mathbb{R}$, et $k(s + t) = h(\mathrm{e}^{s}\mathrm{e}^{t}) = k(s) + k(t)$. D'après la question 2, $k(t) = at$ avec $a = k(1) = h(\mathrm{e})$, et, pour tout $x > 0$, $h(x) = k(\ln x) = a\ln x$. Réciproquement, $a\ln(xy) = a\ln x + a\ln y$. 
    $$\boxed{h = a\ln, \quad a \in \mathbb{R}}$$

    *Piège :* à la question 2, on ne peut pas dériver la relation comme à la question 1, puisque $f$ n'est pas supposée dérivable ; c'est tout l'intérêt de l'intégration, qui prouve d'abord la dérivabilité.

    *À retenir :* les fonctions $x \mapsto ax$, $\exp$ et $\ln$ sont caractérisées, parmi les fonctions continues, par la manière dont elles transforment sommes et produits ; le chapitre 11 dira que ce sont des morphismes de groupes, de $(\mathbb{R}, +)$ dans lui-même, de $(\mathbb{R}, +)$ dans $(]0\,,+\infty[, \times)$ et de $(]0\,,+\infty[, \times)$ dans $(\mathbb{R}, +)$.
- id: "ma-06-52"
  feuille: "f-ma-06"
  numero: 52
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [intégrales]
  noeuds: [ri-proprietes, pol-binome]
  notions: [riemann-integrable, coefficient-binomial]
  page_enonce: 15
  page_corrige: 40
  enonce: |
    *Coefficients d'un polynôme et moyennes sur un cercle.* Soit $n \in \mathbb{N}$, $a_{0}$, …, $a_{n}$ des nombres complexes, et $P$ la fonction définie sur $\mathbb{C}$ par $P(z) = \displaystyle\sum_{k=0}^{n} a_{k}z^{k}$.

    **1.** Pour tout $m \in \mathbb{Z}$, calculer $\displaystyle\int_{0}^{2\pi} \mathrm{e}^{\mathrm{i} m\theta}\,\mathrm{d}\theta$.

    **2.** Soit $r \geqslant 0$. Montrer que, pour tout $k \in [\![0\,;n]\!]$, 
    $$\frac{1}{2\pi}\int_{0}^{2\pi} P(r\mathrm{e}^{\mathrm{i}\theta})\,\mathrm{e}^{-\mathrm{i} k\theta}\,\mathrm{d}\theta = a_{k}r^{k},$$
     et interpréter le cas $k = 0$.

    **3.** Montrer que $\displaystyle\frac{1}{2\pi}\int_{0}^{2\pi} \big|P(\mathrm{e}^{\mathrm{i}\theta})\big|^{2}\,\mathrm{d}\theta = \sum_{k=0}^{n} |a_{k}|^{2}$.

    **4.** On suppose qu'il existe un réel $M$ tel que $|P(z)| \leqslant M$ pour tout complexe $z$ de module $1$. Montrer que $|a_{k}| \leqslant M$ pour tout $k \in [\![0\,;n]\!]$. Lorsque $n \geqslant 1$ et $a_{n} = 1$, montrer qu'il existe un réel $\theta$ tel que $\big|P(\mathrm{e}^{\mathrm{i}\theta})\big|^{2} \geqslant 1 + |a_{0}|^{2}$.

    **5.** En appliquant la question 3 à $P(z) = (1 + z)^{n}$, et à l'aide des intégrales de Wallis de l'exercice 23, montrer que 
    $$\sum_{k=0}^{n} \binom{n}{k}^{2} = \binom{2n}{n}.$$
  corrige: |
    **1.** Pour $m \neq 0$, la fonction $\theta \mapsto \frac{\mathrm{e}^{\mathrm{i} m\theta}}{\mathrm{i} m}$ est une primitive de $\theta \mapsto \mathrm{e}^{\mathrm{i} m\theta}$ (tableau des primitives usuelles, avec $\lambda = \mathrm{i} m \in \mathbb{C}^{*}$), et elle prend la même valeur en $0$ et en $2\pi$, puisque $\mathrm{e}^{2\mathrm{i} m\pi} = 1$. Pour $m = 0$, on intègre la constante $1$. 
    $$\boxed{\int_{0}^{2\pi} \mathrm{e}^{\mathrm{i} m\theta}\,\mathrm{d}\theta = 2\pi \text{ si } m = 0, \qquad \int_{0}^{2\pi} \mathrm{e}^{\mathrm{i} m\theta}\,\mathrm{d}\theta = 0 \text{ si } m \neq 0}$$
     **2.** On développe, pour tout réel $\theta$ : 
    $$P(r\mathrm{e}^{\mathrm{i}\theta})\,\mathrm{e}^{-\mathrm{i} k\theta} = \sum_{j=0}^{n} a_{j}r^{j}\,\mathrm{e}^{\mathrm{i}(j - k)\theta}.$$
     Par linéarité (proposition 2 (ii)) et d'après la question 1, seul le terme d'indice $j = k$ a une intégrale non nulle, égale à $2\pi\,a_{k}r^{k}$. 
    $$\boxed{\frac{1}{2\pi}\int_{0}^{2\pi} P(r\mathrm{e}^{\mathrm{i}\theta})\,\mathrm{e}^{-\mathrm{i} k\theta}\,\mathrm{d}\theta = a_{k}r^{k}}$$
     Pour $k = 0$, l'égalité s'écrit $\frac{1}{2\pi}\int_{0}^{2\pi} P(r\mathrm{e}^{\mathrm{i}\theta})\,\mathrm{d}\theta = a_{0} = P(0)$ : la valeur de $P$ au centre d'un cercle est la moyenne de ses valeurs sur ce cercle, quel que soit le rayon. Par exemple, pour $P(z) = z^{2}$, les valeurs $r^{2}\mathrm{e}^{2\mathrm{i}\theta}$ décrivent deux fois un cercle centré en $0$, et leur moyenne est bien $0 = P(0)$.

    **3.** Pour $\theta$ réel, le conjugué de $P(\mathrm{e}^{\mathrm{i}\theta})$ est $\sum_{l=0}^{n} \overline{a_{l}}\,\mathrm{e}^{-\mathrm{i} l\theta}$, puisque $\overline{\mathrm{e}^{\mathrm{i}\theta}} = \mathrm{e}^{-\mathrm{i}\theta}$. Le module au carré est donc une somme double : 
    $$\big|P(\mathrm{e}^{\mathrm{i}\theta})\big|^{2} = P(\mathrm{e}^{\mathrm{i}\theta})\,\overline{P(\mathrm{e}^{\mathrm{i}\theta})} = \sum_{k=0}^{n}\sum_{l=0}^{n} a_{k}\overline{a_{l}}\,\mathrm{e}^{\mathrm{i}(k - l)\theta}.$$
     D'après la question 1, seuls les termes tels que $k = l$ ont une intégrale non nulle, et celle du terme d'indice $(k, k)$ vaut $2\pi\,|a_{k}|^{2}$. 
    $$\boxed{\frac{1}{2\pi}\int_{0}^{2\pi} \big|P(\mathrm{e}^{\mathrm{i}\theta})\big|^{2}\,\mathrm{d}\theta = \sum_{k=0}^{n} |a_{k}|^{2}}$$
     **4.** La fonction $\theta \mapsto |P(\mathrm{e}^{\mathrm{i}\theta})|^{2}$ est réelle, continue, et majorée par $M^{2}$ ; par croissance de l'intégrale, la question 3 donne $\sum_{k=0}^{n} |a_{k}|^{2} \leqslant M^{2}$, et chaque terme de cette somme de réels positifs est inférieur à la somme. 
    $$\boxed{|a_{k}| \leqslant M \text{ pour tout } k \in [\![0\,;n]\!]}$$
     Supposons maintenant $n \geqslant 1$ et $a_{n} = 1$, et raisonnons par l'absurde : si $|P(\mathrm{e}^{\mathrm{i}\theta})|^{2} < 1 + |a_{0}|^{2}$ pour tout réel $\theta$, la fonction $\theta \mapsto 1 + |a_{0}|^{2} - |P(\mathrm{e}^{\mathrm{i}\theta})|^{2}$ est continue, positive et non nulle sur $[0\,,2\pi]$, et son intégrale est strictement positive (exercice 5). La question 3 donnerait alors 
    $$\sum_{k=0}^{n} |a_{k}|^{2} < 1 + |a_{0}|^{2},$$
     alors que cette somme contient les deux termes distincts $|a_{0}|^{2}$ et $|a_{n}|^{2} = 1$. 
    $$\boxed{\text{il existe } \theta \in \mathbb{R} \text{ tel que } \big|P(\mathrm{e}^{\mathrm{i}\theta})\big|^{2} \geqslant 1 + |a_{0}|^{2}}$$
     Ainsi, une fonction polynomiale de coefficient dominant $1$ ne peut pas être uniformément petite sur le cercle unité : son module y atteint au moins $1$. L'exemple $P(z) = z^{n}$, de module constant égal à $1$ sur le cercle, montre que cette borne est la meilleure possible. Sur le segment $[-1\,,1]$, la situation est différente : $x \mapsto x^{2} - \frac{1}{2}$ y est majorée par $\frac{1}{2}$ en valeur absolue.

    **5.** La formule du binôme du chapitre 3 donne $(1 + z)^{n} = \sum_{k=0}^{n} \binom{n}{k}z^{k}$, donc $a_{k} = \binom{n}{k}$. Par la technique de l'angle moitié du chapitre 4, 
    $$1 + \mathrm{e}^{\mathrm{i}\theta} = \mathrm{e}^{\mathrm{i}\theta/2}\big(\mathrm{e}^{-\mathrm{i}\theta/2} + \mathrm{e}^{\mathrm{i}\theta/2}\big) = 2\cos\frac{\theta}{2}\;\mathrm{e}^{\mathrm{i}\theta/2}, \qquad\text{donc}\qquad \big|P(\mathrm{e}^{\mathrm{i}\theta})\big|^{2} = 4^{n}\cos^{2n}\frac{\theta}{2}.$$
     La question 3, puis le changement de variable $\theta = 2u$, donnent 
    $$\sum_{k=0}^{n} \binom{n}{k}^{2} = \frac{4^{n}}{2\pi}\int_{0}^{2\pi} \cos^{2n}\frac{\theta}{2}\,\mathrm{d}\theta = \frac{4^{n}}{\pi}\int_{0}^{\pi} \cos^{2n}u\,\mathrm{d} u.$$
     Sur $\big[\frac{\pi}{2}\,,\pi\big]$, le changement de variable $u = \pi - v$ et l'égalité $\cos^{2n}(\pi - v) = \cos^{2n} v$ montrent que la seconde moitié de l'intégrale est égale à la première ; d'après l'exercice 23, question 1, on a donc $\int_{0}^{\pi} \cos^{2n}u\,\mathrm{d} u = 2W_{2n}$. La formule de $W_{2n}$ (exercice 23, question 4) donne enfin 
    $$\sum_{k=0}^{n} \binom{n}{k}^{2} = \frac{2 \cdot 4^{n}}{\pi}\,W_{2n} = \frac{2 \cdot 4^{n}}{\pi}\cdot\frac{(2n)!}{4^{n}(n!)^{2}}\cdot\frac{\pi}{2} = \frac{(2n)!}{(n!)^{2}}.$$

    $$\boxed{\sum_{k=0}^{n} \binom{n}{k}^{2} = \binom{2n}{n}}$$
     Pour $n = 2$, on vérifie que $1 + 4 + 1 = 6 = \binom{4}{2}$. ✓ Cette identité de dénombrement, que la formule de Vandermonde de la feuille du chapitre 3 établit en comptant des parties, sort ici d'un calcul d'intégrales où le nombre $\pi$ apparaît puis disparaît.

    *À retenir :* la question 1 dit que les fonctions $\theta \mapsto \mathrm{e}^{\mathrm{i} k\theta}$ se comportent, pour l'intégrale sur une période, comme une famille de vecteurs deux à deux orthogonaux ; les questions 2 et 3 en sont les conséquences, comme le calcul des coordonnées et du carré de la norme d'un vecteur dans une base orthonormée. Le chapitre 19, consacré aux espaces préhilbertiens, donnera un sens précis à cette analogie.
- id: "ma-06-53"
  feuille: "f-ma-06"
  numero: 53
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [primitives trigonométriques, équations différentielles, second ordre]
  noeuds: [ed-lineaires]
  notions: [equation-differentielle]
  page_enonce: 15
  page_corrige: 41
  enonce: |
    *Théorème de comparaison de Sturm.* Soit $q_{1}$, $q_{2} : \mathbb{R} \to \mathbb{R}$ continues telles que $q_{1}(x) < q_{2}(x)$ pour tout réel $x$, et $y_{1}$, $y_{2} : \mathbb{R} \to \mathbb{R}$ deux fois dérivables telles que 
    $$y_{1}'' + q_{1}(x)\,y_{1} = 0 \qquad\text{et}\qquad y_{2}'' + q_{2}(x)\,y_{2} = 0.$$
     On suppose qu'il existe deux réels $a < b$ tels que $y_{1}(a) = y_{1}(b) = 0$, la fonction $y_{1}$ n'étant pas identiquement nulle sur $[a\,,b]$. On veut montrer que $y_{2}$ s'annule en au moins un point de $[a\,,b]$ ; on suppose par l'absurde qu'elle ne s'y annule pas.

    **1.** Montrer que la fonction $\varphi = \dfrac{y_{1}}{y_{2}}\,\big(y_{1}'y_{2} - y_{1}y_{2}'\big)$ est dérivable sur $[a\,,b]$, et que 
    $$\varphi' = (q_{2} - q_{1})\,y_{1}^{2} + \Big(y_{1}' - \frac{y_{1}y_{2}'}{y_{2}}\Big)^{2}.$$

    **2.** En déduire que $\varphi$ est nulle sur $[a\,,b]$, puis aboutir à une contradiction.

    **3.** Soit $\omega > 0$, $q : \mathbb{R} \to \mathbb{R}$ continue et $y$ une solution sur $\mathbb{R}$ de $y'' + q(x)\,y = 0$.

    **(a)** On suppose $q(x) > \omega^{2}$ pour tout réel $x$. En appliquant ce qui précède avec une fonction $y_{1}$ bien choisie, montrer que $y$ s'annule sur tout segment de longueur $\frac{\pi}{\omega}$.

    **(b)** On suppose $q(x) < \omega^{2}$ pour tout réel $x$, et l'on considère deux réels $a < b$ tels que $y(a) = y(b) = 0$, la fonction $y$ n'étant pas identiquement nulle sur $[a\,,b]$. En choisissant $y_{2}(x) = \cos\big(\omega\big(x - \frac{a + b}{2}\big)\big)$, montrer que $b - a \geqslant \frac{\pi}{\omega}$.

    **4.** On ne sait pas résoudre explicitement l'équation $y'' + (2 + \cos x)\,y = 0$. Soit $y$ une de ses solutions sur $\mathbb{R}$. Montrer que $y$ s'annule sur tout segment de longueur strictement supérieure à $\pi$, et que, si $y(a) = y(b) = 0$ avec $a < b$, sans que $y$ soit identiquement nulle sur $[a\,,b]$, alors $b - a \geqslant \frac{\pi}{\sqrt{3}}$.
  corrige: |
    **1.** Les fonctions $y_{1}$, $y_{2}$, $y_{1}'$ et $y_{2}'$ sont dérivables, et $y_{2}$ ne s'annule pas sur $[a\,,b]$ ; par les règles de dérivation des sommes, produits et quotients du chapitre 5, la fonction 
    $$\varphi = y_{1}y_{1}' - \frac{y_{1}^{2}\,y_{2}'}{y_{2}}$$
     est dérivable sur $[a\,,b]$. On dérive chaque terme : 
    $$\varphi' = y_{1}'^{2} + y_{1}y_{1}'' - \frac{2y_{1}y_{1}'y_{2}'}{y_{2}} - \frac{y_{1}^{2}\,y_{2}''}{y_{2}} + \frac{y_{1}^{2}\,y_{2}'^{2}}{y_{2}^{2}}.$$
     On remplace $y_{1}''$ par $-q_{1}y_{1}$ et $y_{2}''$ par $-q_{2}y_{2}$ ; les termes restants forment le carré $\big(y_{1}' - \frac{y_{1}y_{2}'}{y_{2}}\big)^{2}$. 
    $$\boxed{\varphi' = (q_{2} - q_{1})\,y_{1}^{2} + \Big(y_{1}' - \frac{y_{1}y_{2}'}{y_{2}}\Big)^{2}}$$
     **2.** Les deux termes de $\varphi'$ sont positifs, puisque $q_{2} - q_{1} > 0$ : la fonction $\varphi$ est croissante sur le segment $[a\,,b]$ (théorème 1 du chapitre 5). Elle contient le facteur $y_{1}$, donc $\varphi(a) = \varphi(b) = 0$, et pour tout $x \in [a\,,b]$, $0 = \varphi(a) \leqslant \varphi(x) \leqslant \varphi(b) = 0$. Ainsi $\varphi$ est nulle sur $[a\,,b]$, et sa dérivée aussi. Une somme de deux réels positifs n'est nulle que si chacun l'est : $(q_{2} - q_{1})\,y_{1}^{2} = 0$ sur $[a\,,b]$, et comme $q_{2} - q_{1}$ ne s'annule pas, $y_{1}$ est nulle sur $[a\,,b]$, contrairement à l'hypothèse. 
    $$\boxed{y_{2} \text{ s'annule en au moins un point de } [a\,,b]}$$
     Le raisonnement est celui de l'exercice 5 : une fonction croissante qui prend la même valeur aux deux extrémités d'un segment y est constante.

    **3.(a)** Soit $[c\,,c + \frac{\pi}{\omega}]$ un segment de longueur $\frac{\pi}{\omega}$. La fonction $y_{1} : x \mapsto \sin\big(\omega(x - c)\big)$ est solution de $y'' + \omega^{2}y = 0$, et l'on a $q_{1} = \omega^{2} < q$ ; elle s'annule en $c$ et en $c + \frac{\pi}{\omega}$, et vaut $1$ au milieu de ce segment. La question 2, avec $q_{2} = q$ et $y_{2} = y$, donne : 
    $$\boxed{y \text{ s'annule sur tout segment de longueur } \frac{\pi}{\omega}}$$
     **(b)** La fonction $y_{2}$ proposée est solution de $y'' + \omega^{2}y = 0$, et $q < \omega^{2}$ ; on applique la question 2 avec $y_{1} = y$, $q_{1} = q$ et $q_{2} = \omega^{2}$. Si l'on avait $b - a < \frac{\pi}{\omega}$, on aurait, pour tout $x \in [a\,,b]$, 
    $$\Big|\omega\Big(x - \frac{a + b}{2}\Big)\Big| \leqslant \frac{\omega(b - a)}{2} < \frac{\pi}{2},$$
     donc $y_{2}(x) > 0$ : la fonction $y_{2}$ ne s'annulerait pas sur $[a\,,b]$, ce que la question 2 interdit. 
    $$\boxed{b - a \geqslant \frac{\pi}{\omega}}$$
     **4.** Ici $q(x) = 2 + \cos x$ vérifie $1 \leqslant q(x) \leqslant 3$ pour tout réel $x$. Soit un segment de longueur $L > \pi$ ; avec $\omega = \frac{\pi}{L} < 1$, on a $q(x) \geqslant 1 > \omega^{2}$, et la question 3 (a) montre que $y$ s'annule sur ce segment. 
    $$\boxed{y \text{ s'annule sur tout segment de longueur strictement supérieure à } \pi}$$
     Soit ensuite $a < b$ comme dans l'énoncé, et supposons $b - a < \frac{\pi}{\sqrt{3}}$, c'est-à-dire $\frac{\pi}{b - a} > \sqrt{3}$. On choisit un réel $\omega$ tel que $\sqrt{3} < \omega < \frac{\pi}{b - a}$ ; alors $q(x) \leqslant 3 < \omega^{2}$, et la question 3 (b) donne $b - a \geqslant \frac{\pi}{\omega} > b - a$, ce qui est absurde. 
    $$\boxed{b - a \geqslant \frac{\pi}{\sqrt{3}}}$$

    ![Figure](documents/figures/48a7d7b70855d1d5.svg)

    La figure représente, d'après des valeurs approchées obtenues numériquement, la solution telle que $y(0) = 0$ et $y'(0) = 1$, et ses zéros en carmin. Les écarts entre zéros consécutifs valent environ $1{,}98$ ; $2{,}90$ ; $1{,}86$ ; $2{,}20$ et $2{,}63$ : ils restent bien compris entre $\frac{\pi}{\sqrt{3}} \approx 1{,}81$ et $\pi$, sans que l'on ait jamais écrit la solution.

    *À retenir :* plus le coefficient $q$ est grand, plus les solutions de $y'' + q(x)\,y = 0$ oscillent vite ; en comparant à l'oscillateur harmonique $y'' + \omega^{2}y = 0$, dont les zéros sont espacés de $\frac{\pi}{\omega}$, on encadre l'écart entre les zéros d'équations que l'on ne sait pas résoudre. Ce théorème de comparaison est dû à Sturm, qui l'a publié en 1836 dans le premier volume du *Journal de mathématiques pures et appliquées* ; la fonction $\varphi$ de la question 1 est connue sous le nom d'identité de Picone.

    *Piège :* l'hypothèse que $y_{1}$ n'est pas identiquement nulle sur $[a\,,b]$ ne peut pas être omise, puisque la fonction nulle est solution de toute équation $y'' + q_{1}(x)\,y = 0$. Pour une équation à coefficients constants, le théorème 6 montrerait qu'une solution nulle sur un segment est nulle partout, puisqu'elle y vérifie $y(x_{0}) = y'(x_{0}) = 0$ ; pour des coefficients variables, ce résultat d'unicité n'est pas encore disponible, et c'est pourquoi l'hypothèse figure dans l'énoncé.
- id: "ma-06-54"
  feuille: "f-ma-06"
  numero: 54
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration, Calcul]
  mots_cles: [primitives trigonométriques, équations différentielles, second ordre]
  noeuds: [cx-exponentielle, ed-lineaires]
  notions: [equation-differentielle]
  page_enonce: 16
  page_corrige: 43
  enonce: |
    *Oscillateur forcé et résonance.* Soit $\xi > 0$ et $\omega > 0$. On étudie l'équation 
    $$(E_{\omega}) : \quad y'' + 2\xi\,y' + y = \cos(\omega t).$$

    **1.** Montrer que toutes les solutions de l'équation homogène tendent vers $0$ en $+\infty$.

    **2.** Déterminer une solution particulière de $(E_{\omega})$ de la forme $t \mapsto \operatorname{Re}\big(c\,\mathrm{e}^{\mathrm{i}\omega t}\big)$, avec $c \in \mathbb{C}$, et l'écrire sous la forme $A(\omega)\cos(\omega t - \varphi)$, avec $A(\omega) = \dfrac{1}{\sqrt{(1 - \omega^{2})^{2} + 4\xi^{2}\omega^{2}}}$.

    **3.** En déduire que toute solution de $(E_{\omega})$ est, pour $t$ grand, très proche d'une oscillation d'amplitude $A(\omega)$ : c'est le régime permanent.

    **4.** Étudier la fonction $\omega \mapsto A(\omega)$ sur $]0\,,+\infty[$. Montrer qu'elle admet un maximum strictement supérieur à $1$ si et seulement si $\xi < \frac{1}{\sqrt{2}}$, atteint en $\omega_{r} = \sqrt{1 - 2\xi^{2}}$, et calculer ce maximum.

    **5.** Que se passe-t-il lorsque $\xi$ tend vers $0$ ? Comparer avec la résonance de l'équation $y'' + y = \cos t$ étudiée dans le cours.
  corrige: |
    **1.** L'équation caractéristique $r^{2} + 2\xi r + 1 = 0$ a pour discriminant $4(\xi^{2} - 1)$. C'est le cas $a = 2\xi > 0$ et $b = 1 > 0$ de l'exercice 42, question 3. 
    $$\boxed{\text{toute solution de l'équation homogène tend vers } 0 \text{ en } +\infty}$$
     **2.** Le nombre $\mathrm{i}\omega$ n'est pas racine, puisque $P(\mathrm{i}\omega) = 1 - \omega^{2} + 2\mathrm{i}\xi\omega$ a une partie imaginaire non nulle. La proposition 10 donne la solution $\frac{\mathrm{e}^{\mathrm{i}\omega t}}{P(\mathrm{i}\omega)}$ de l'équation de second membre $\mathrm{e}^{\mathrm{i}\omega t}$, dont la partie réelle est solution de $(E_{\omega})$. On écrit $P(\mathrm{i}\omega) = \rho\,\mathrm{e}^{\mathrm{i}\varphi}$ sous forme exponentielle, avec $\rho = |P(\mathrm{i}\omega)| > 0$ : 
    $$\rho = \sqrt{(1 - \omega^{2})^{2} + 4\xi^{2}\omega^{2}}, \qquad c = \frac{1}{P(\mathrm{i}\omega)} = \frac{\mathrm{e}^{-\mathrm{i}\varphi}}{\rho}, \qquad \operatorname{Re}\big(c\,\mathrm{e}^{\mathrm{i}\omega t}\big) = \frac{\cos(\omega t - \varphi)}{\rho}.$$

    $$\boxed{y_{p}(t) = A(\omega)\cos(\omega t - \varphi), \qquad A(\omega) = \frac{1}{\sqrt{(1 - \omega^{2})^{2} + 4\xi^{2}\omega^{2}}}}$$
     Le déphasage $\varphi$ est un argument de $P(\mathrm{i}\omega)$, que l'on peut choisir dans $]0\,,\pi[$ puisque $\operatorname{Im} P(\mathrm{i}\omega) > 0$ : la réponse est en retard sur l'excitation.

    **3.** D'après la proposition 9, toute solution s'écrit $y = y_{p} + y_{h}$, où $y_{h}$ est solution de l'équation homogène. D'après la question 1, $y(t) - A(\omega)\cos(\omega t - \varphi) = y_{h}(t)$ tend vers $0$. 
    $$\boxed{\text{l'écart entre toute solution et le régime permanent tend vers } 0}$$
     Les conditions initiales n'influencent que le régime transitoire $y_{h}$, qui s'efface.

    **4.** La fonction $\omega \mapsto \omega^{2}$ est strictement croissante sur $]0\,,+\infty[$ ; on étudie donc, pour $u > 0$, 
    $$h(u) = (1 - u)^{2} + 4\xi^{2}u = u^{2} + (4\xi^{2} - 2)\,u + 1, \qquad h'(u) = 2\big(u - (1 - 2\xi^{2})\big),$$
     et $A$ varie en sens contraire de $h$.

    • Si $\xi \geqslant \frac{1}{\sqrt{2}}$, alors $1 - 2\xi^{2} \leqslant 0$, $h$ est strictement croissante sur $]0\,,+\infty[$, et $A$ est strictement décroissante ; elle tend vers $1$ en $0$, donc $A(\omega) < 1$ pour tout $\omega > 0$ : pas de maximum.

    • Si $\xi < \frac{1}{\sqrt{2}}$, la fonction $h$ est minimale en $u_{0} = 1 - 2\xi^{2} > 0$, avec 
    $$h(u_{0}) = 4\xi^{4} + 4\xi^{2}(1 - 2\xi^{2}) = 4\xi^{2}(1 - \xi^{2}).$$
     Le maximum de $A$ est atteint en $\omega_{r} = \sqrt{u_{0}}$, et il est strictement supérieur à $1$, car $1 - 4\xi^{2}(1 - \xi^{2})$ vaut $(1 - 2\xi^{2})^{2} > 0$.

    $$\boxed{\xi < \frac{1}{\sqrt{2}} : \quad \omega_{r} = \sqrt{1 - 2\xi^{2}}, \qquad A(\omega_{r}) = \frac{1}{2\xi\sqrt{1 - \xi^{2}}} > 1}$$

    ![Figure](documents/figures/a1e6cbb9dd4cf4c6.svg)

    Pour un faible amortissement, la courbe de réponse présente un pic très marqué près de la pulsation propre $\omega = 1$ ; il s'aplatit quand $\xi$ augmente et disparaît à partir de $\xi = \frac{1}{\sqrt{2}}$, la courbe devenant alors décroissante.

    **5.** Quand $\xi$ tend vers $0$, la pulsation de résonance $\omega_{r}$ tend vers $1$, et $A(\omega_{r}) \sim \frac{1}{2\xi}$ tend vers $+\infty$. À la limite $\xi = 0$, on retrouve l'équation $y'' + y = \cos t$ du cours, dont la solution particulière $\frac{t\sin t}{2}$ n'est pas bornée : l'amortissement, si petit soit-il, limite l'amplitude du régime permanent, mais la rend d'autant plus grande qu'il est faible.
