  enonce: |
    *Lemme de Gronwall.*

    **1.** Soit $C$ un réel, et $u$, $v : [0\,,+\infty[ \to \mathbb{R}$ continues, avec $v \geqslant 0$, telles que, pour tout $x \geqslant 0$, 
    $$u(x) \leqslant C + \int_{0}^{x} u(t)\,v(t)\,\mathrm{d} t.$$
     Montrer que, pour tout $x \geqslant 0$, 
    $$u(x) \leqslant C\exp\Big(\int_{0}^{x} v(t)\,\mathrm{d} t\Big).$$
     On pourra introduire $W(x) = C + \displaystyle\int_{0}^{x} u\,v$ et s'inspirer de l'exercice 35.

    **2.** En déduire qu'une fonction continue $f \geqslant 0$ sur $[0\,,+\infty[$ telle que $f(x) \leqslant K\displaystyle\int_{0}^{x} f(t)\,\mathrm{d} t$ pour un réel $K \geqslant 0$ et tout $x \geqslant 0$ est nulle.

    **3.** Soit $k \geqslant 0$ et $H : \mathbb{R} \to \mathbb{R}$ telle que $|H(s) - H(s')| \leqslant k\,|s - s'|$ pour tous réels $s$, $s'$. Soit $f$, $g$ deux fonctions de classe $\mathcal{C}^{1}$ sur $[0\,,+\infty[$ telles que $f' = H \circ f$ et $g' = H \circ g$. Montrer que $|f(x) - g(x)| \leqslant |f(0) - g(0)|\,\mathrm{e}^{kx}$ pour tout $x \geqslant 0$. Que peut-on en conclure lorsque $f(0) = g(0)$ ?
  corrige: |
    **1.** La fonction $W$ est dérivable, de dérivée $u\,v$ (proposition 2), et l'hypothèse s'écrit $u \leqslant W$. Comme $v \geqslant 0$, on obtient $W' = u\,v \leqslant W\,v$. Notons $V(x) = \int_{0}^{x} v$ ; comme à l'exercice 35, on étudie 
    $$\big(W\,\mathrm{e}^{-V}\big)' = (W' - v\,W)\,\mathrm{e}^{-V} \leqslant 0.$$
     La fonction $W\,\mathrm{e}^{-V}$ est décroissante sur $[0\,,+\infty[$, et vaut $C$ en $0$ : pour $x \geqslant 0$, $W(x) \leqslant C\,\mathrm{e}^{V(x)}$, et donc : 
    $$\boxed{u(x) \leqslant W(x) \leqslant C\exp\Big(\int_{0}^{x} v(t)\,\mathrm{d} t\Big)}$$
     **2.** On applique la question 1 avec $u = f$, $C = 0$ et $v = K$ : pour tout $x \geqslant 0$, $f(x) \leqslant 0$. Comme $f \geqslant 0$ : 
    $$\boxed{f = 0}$$
     **3.** La fonction $f - g$ est de classe $\mathcal{C}^{1}$, donc $f(x) - g(x) = f(0) - g(0) + \int_{0}^{x} \big(H(f(t)) - H(g(t))\big)\,\mathrm{d} t$. Par l'inégalité triangulaire (proposition 2 (iv)) et l'hypothèse sur $H$ : 
    $$|f(x) - g(x)| \leqslant |f(0) - g(0)| + \int_{0}^{x} k\,|f(t) - g(t)|\,\mathrm{d} t.$$
     La question 1, avec $u = |f - g|$, qui est continue, $C = |f(0) - g(0)|$ et $v = k$, donne : 
    $$\boxed{|f(x) - g(x)| \leqslant |f(0) - g(0)|\,\mathrm{e}^{kx}}$$
     Si $f(0) = g(0)$, on obtient $f = g$ sur $[0\,,+\infty[$ : le problème de Cauchy $y' = H(y)$, $y(0) = y_{0}$, a au plus une solution. Ce résultat d'unicité s'applique à des équations non linéaires, comme celles de l'exercice 36 ; la condition imposée à $H$ exprime que $H$ est « lipschitzienne », notion que l'inégalité des accroissements finis du chapitre 9 rendra naturelle.

    *À retenir :* l'inégalité obtenue dit aussi que deux solutions partant de valeurs proches restent proches, avec un écart qui croît au plus exponentiellement : c'est la stabilité par rapport aux conditions initiales.

