  page_enonce: 5
  page_corrige: 13
  enonce: |
    Calculer les intégrales suivantes à l'aide du changement de variable indiqué, ou d'un changement de variable bien choisi.

    **(a)** $\displaystyle\int_{1}^{4} \frac{1 - \sqrt{t}}{\sqrt{t}}\,\mathrm{d} t$, $x = \sqrt{t}$

    **(b)** $\displaystyle\int_{0}^{\pi} \frac{\sin t}{1 + \cos^{2} t}\,\mathrm{d} t$, $x = \cos t$

    **(c)** $\displaystyle\int_{1}^{\mathrm{e}} \frac{\mathrm{d} t}{2t\ln t + t}$, $x = \ln t$

    **(d)** $\displaystyle\int_{0}^{1} \frac{\mathrm{d} t}{1 + \mathrm{e}^{t}}$, $x = \mathrm{e}^{t}$

    **(e)** $\displaystyle\int_{1}^{3} \frac{\sqrt{t}}{t + 1}\,\mathrm{d} t$, $x = \sqrt{t}$

    **(f)** $\displaystyle\int_{1/3}^{1} \frac{\mathrm{d} x}{(x + 1)\sqrt{x}}$

    **(g)** $\displaystyle\int_{0}^{1} \frac{t}{\sqrt{t + 1}}\,\mathrm{d} t$

    **(h)** $\displaystyle\int_{0}^{1} x\,\mathrm{e}^{\sqrt{x}}\,\mathrm{d} x$

    **(i)** $\displaystyle\int_{0}^{\ln 2} \sqrt{\mathrm{e}^{x} - 1}\,\mathrm{d} x$

    **(j)** $\displaystyle\int_{-1}^{1} x^{2}\sqrt{1 - x^{2}}\,\mathrm{d} x$

    **(k)** $\displaystyle\int_{0}^{1} \frac{x^{2}}{x^{6} + 1}\,\mathrm{d} x$

    **(l)** $\displaystyle\int_{1}^{\mathrm{e}^{\pi}} \sin(\ln t)\,\mathrm{d} t$
  corrige: |
    Dans chaque cas, on écrit l'ancienne variable en fonction de la nouvelle, on transforme l'élément différentiel, puis les bornes (proposition 5).

    **(a)** $t = x^{2}$, $\mathrm{d} t = 2x\,\mathrm{d} x$, et $x$ va de $1$ à $2$. 
    $$\int_{1}^{4} \frac{1 - \sqrt{t}}{\sqrt{t}}\,\mathrm{d} t = \int_{1}^{2} \frac{1 - x}{x}\,2x\,\mathrm{d} x = \big[2x - x^{2}\big]_{1}^{2} = \boxed{-1}$$
     **(b)** $x = \cos t$, $\mathrm{d} x = -\sin t\,\mathrm{d} t$, et $x$ va de $1$ à $-1$. 
    $$\int_{0}^{\pi} \frac{\sin t}{1 + \cos^{2} t}\,\mathrm{d} t = \int_{1}^{-1} \frac{-\mathrm{d} x}{1 + x^{2}} = \big[\operatorname{Arctan} x\big]_{-1}^{1} = \boxed{\frac{\pi}{2}}$$
     **(c)** $x = \ln t$, $\mathrm{d} x = \frac{\mathrm{d} t}{t}$, et $x$ va de $0$ à $1$. 
    $$\int_{1}^{\mathrm{e}} \frac{\mathrm{d} t}{t(2\ln t + 1)} = \int_{0}^{1} \frac{\mathrm{d} x}{2x + 1} = \boxed{\frac{\ln 3}{2}}$$
     **(d)** $t = \ln x$, $\mathrm{d} t = \frac{\mathrm{d} x}{x}$, et $x$ va de $1$ à $\mathrm{e}$ ; puis $\frac{1}{x(1 + x)} = \frac{1}{x} - \frac{1}{1 + x}$. 
    $$\int_{0}^{1} \frac{\mathrm{d} t}{1 + \mathrm{e}^{t}} = \int_{1}^{\mathrm{e}} \frac{\mathrm{d} x}{x(1 + x)} = \Big[\ln\frac{x}{1 + x}\Big]_{1}^{\mathrm{e}} = \boxed{1 + \ln 2 - \ln(1 + \mathrm{e})}$$
     **(e)** $t = x^{2}$, $\mathrm{d} t = 2x\,\mathrm{d} x$, et $x$ va de $1$ à $\sqrt{3}$ ; puis $\frac{x^{2}}{1 + x^{2}} = 1 - \frac{1}{1 + x^{2}}$. 
    $$\int_{1}^{3} \frac{\sqrt{t}}{t + 1}\,\mathrm{d} t = 2\int_{1}^{\sqrt{3}} \frac{x^{2}}{x^{2} + 1}\,\mathrm{d} x = 2\Big(\sqrt{3} - 1 - \frac{\pi}{3} + \frac{\pi}{4}\Big) = \boxed{2\sqrt{3} - 2 - \frac{\pi}{6}}$$
     **(f)** On pose $x = u^{2}$, $\mathrm{d} x = 2u\,\mathrm{d} u$, et $u$ va de $\frac{1}{\sqrt{3}}$ à $1$. 
    $$\int_{1/3}^{1} \frac{\mathrm{d} x}{(x + 1)\sqrt{x}} = \int_{1/\sqrt{3}}^{1} \frac{2\,\mathrm{d} u}{u^{2} + 1} = 2\Big(\frac{\pi}{4} - \frac{\pi}{6}\Big) = \boxed{\frac{\pi}{6}}$$
     **(g)** On pose $u = \sqrt{t + 1}$, soit $t = u^{2} - 1$ et $\mathrm{d} t = 2u\,\mathrm{d} u$, et $u$ va de $1$ à $\sqrt{2}$. 
    $$\int_{0}^{1} \frac{t}{\sqrt{t + 1}}\,\mathrm{d} t = \int_{1}^{\sqrt{2}} 2(u^{2} - 1)\,\mathrm{d} u = 2\Big[\frac{u^{3}}{3} - u\Big]_{1}^{\sqrt{2}} = \boxed{\frac{4 - 2\sqrt{2}}{3}}$$
     **(h)** On pose $x = u^{2}$, puis trois intégrations par parties donnent la primitive $\mathrm{e}^{u}(u^{3} - 3u^{2} + 6u - 6)$ de $u^{3}\mathrm{e}^{u}$. 
    $$\int_{0}^{1} x\,\mathrm{e}^{\sqrt{x}}\,\mathrm{d} x = \int_{0}^{1} 2u^{3}\mathrm{e}^{u}\,\mathrm{d} u = 2\big(-2\mathrm{e} + 6\big) = \boxed{12 - 4\mathrm{e}}$$
     **(i)** On pose $u = \sqrt{\mathrm{e}^{x} - 1}$, soit $x = \ln(1 + u^{2})$ et $\mathrm{d} x = \frac{2u}{1 + u^{2}}\,\mathrm{d} u$, et $u$ va de $0$ à $1$. 
    $$\int_{0}^{\ln 2} \sqrt{\mathrm{e}^{x} - 1}\,\mathrm{d} x = \int_{0}^{1} \frac{2u^{2}}{1 + u^{2}}\,\mathrm{d} u = 2\Big(1 - \frac{\pi}{4}\Big) = \boxed{2 - \frac{\pi}{2}}$$
     **(j)** On pose $x = \sin t$, avec $t \in \big[-\frac{\pi}{2}\,,\frac{\pi}{2}\big]$, où $\cos t \geqslant 0$ ; puis $\sin^{2} t\cos^{2} t = \frac{\sin^{2}(2t)}{4} = \frac{1 - \cos(4t)}{8}$. 
    $$\int_{-1}^{1} x^{2}\sqrt{1 - x^{2}}\,\mathrm{d} x = \int_{-\pi/2}^{\pi/2} \sin^{2} t\cos^{2} t\,\mathrm{d} t = \frac{\pi}{8} - 0 = \boxed{\frac{\pi}{8}}$$
     **(k)** On pose $u = x^{3}$, $\mathrm{d} u = 3x^{2}\,\mathrm{d} x$. 
    $$\int_{0}^{1} \frac{x^{2}}{x^{6} + 1}\,\mathrm{d} x = \frac{1}{3}\int_{0}^{1} \frac{\mathrm{d} u}{u^{2} + 1} = \boxed{\frac{\pi}{12}}$$
     **(l)** On pose $u = \ln t$, soit $t = \mathrm{e}^{u}$ et $\mathrm{d} t = \mathrm{e}^{u}\,\mathrm{d} u$, puis on passe à l'exponentielle complexe. 
    $$\int_{1}^{\mathrm{e}^{\pi}} \sin(\ln t)\,\mathrm{d} t = \int_{0}^{\pi} \mathrm{e}^{u}\sin u\,\mathrm{d} u = \operatorname{Im}\frac{\mathrm{e}^{(1 + \mathrm{i})\pi} - 1}{1 + \mathrm{i}} = \operatorname{Im}\frac{-(\mathrm{e}^{\pi} + 1)(1 - \mathrm{i})}{2} = \boxed{\frac{\mathrm{e}^{\pi} + 1}{2}}$$

    *Piège :* l'erreur la plus répandue est d'oublier de changer les bornes, ou de les changer dans le mauvais sens ; en (b), les bornes se retrouvent dans l'ordre décroissant, et c'est le signe moins de $\mathrm{d} x = -\sin t\,\mathrm{d} t$ qui rétablit l'ordre.
- id: "ma-06-19"
  feuille: "f-ma-06"
  numero: 19
  partie: "Calcul de primitives et d'intégrales"
  etoiles: 2
