  page_enonce: 5
  page_corrige: 13
  enonce: |
    **1.** Calculer $I = \displaystyle\int_{0}^{\pi} x\cos^{2} x\,\mathrm{d} x$, puis en déduire habilement $J = \displaystyle\int_{0}^{\pi} x\sin^{2} x\,\mathrm{d} x$.

    **2.** Calculer $\displaystyle\int_{0}^{\pi} x^{2}\mathrm{e}^{x}\cos x\,\mathrm{d} x$.

    **3.** Pour tout entier $n \geqslant 1$, déterminer une primitive de $x \mapsto (\ln x)^{n}$ sur $]0\,,+\infty[$, sous la forme $x\,P_{n}(\ln x)$, où l'on exprimera la suite de fonctions polynomiales $(P_{n})$ par une relation de récurrence, puis par une formule explicite.
  corrige: |
    **1.** On linéarise, puis on intègre $x\cos(2x)$ par parties : 
    $$I = \int_{0}^{\pi} \frac{x}{2}\,\mathrm{d} x + \frac{1}{2}\int_{0}^{\pi} x\cos(2x)\,\mathrm{d} x = \frac{\pi^{2}}{4} + \frac{1}{2}\Big(\Big[\frac{x\sin(2x)}{2}\Big]_{0}^{\pi} - \int_{0}^{\pi} \frac{\sin(2x)}{2}\,\mathrm{d} x\Big) = \boxed{\frac{\pi^{2}}{4}}.$$
     Habilement : $I + J = \int_{0}^{\pi} x\,\mathrm{d} x = \frac{\pi^{2}}{2}$, puisque $\cos^{2} + \sin^{2} = 1$. 
    $$\boxed{J = \frac{\pi^{2}}{2} - I = \frac{\pi^{2}}{4}}$$
     On peut aussi obtenir ces valeurs par l'exercice 21 : $\cos^{2}$ et $\sin^{2}$ sont inchangées quand on remplace $x$ par $\pi - x$, donc $I = \frac{\pi}{2}\int_{0}^{\pi} \cos^{2} x\,\mathrm{d} x = \frac{\pi}{2}\cdot\frac{\pi}{2}$, et de même pour $J$.

    **2.** On écrit $x^{2}\mathrm{e}^{x}\cos x = \operatorname{Re}\big(x^{2}\mathrm{e}^{(1 + \mathrm{i})x}\big)$. Deux intégrations par parties, avec $a = 1 + \mathrm{i}$, donnent une primitive $\mathrm{e}^{ax}\big(\frac{x^{2}}{a} - \frac{2x}{a^{2}} + \frac{2}{a^{3}}\big)$, avec $\frac{1}{a} = \frac{1 - \mathrm{i}}{2}$, $\frac{1}{a^{2}} = -\frac{\mathrm{i}}{2}$ et $\frac{1}{a^{3}} = -\frac{1 + \mathrm{i}}{4}$. En $\pi$, $\mathrm{e}^{a\pi} = -\mathrm{e}^{\pi}$, et la partie réelle vaut $-\mathrm{e}^{\pi}\big(\frac{\pi^{2}}{2} - \frac{1}{2}\big)$ ; en $0$, elle vaut $-\frac{1}{2}$. 
    $$\boxed{\int_{0}^{\pi} x^{2}\mathrm{e}^{x}\cos x\,\mathrm{d} x = \frac{1 + \mathrm{e}^{\pi}}{2} - \frac{\pi^{2}\mathrm{e}^{\pi}}{2}}$$
     Cette valeur, proche de $-102$, est négative : le facteur $\mathrm{e}^{x}$ donne le plus grand poids à la fin de l'intervalle, où $\cos x < 0$.

    **3.** Notons $F_{n}$ une primitive de $(\ln x)^{n}$. En primitivant $1$ et en dérivant $(\ln x)^{n}$, on obtient 
    $$F_{n}(x) = x(\ln x)^{n} - nF_{n-1}(x).$$
     Avec $F_{0}(x) = x$, on obtient par récurrence $F_{n}(x) = x\,P_{n}(\ln x)$, où : 
    $$\boxed{P_{0} = 1, \qquad P_{n}(X) = X^{n} - n\,P_{n-1}(X) \quad (n \geqslant 1)}$$
     Les premiers termes sont $P_{1} = X - 1$, $P_{2} = X^{2} - 2X + 2$, $P_{3} = X^{3} - 3X^{2} + 6X - 6$, ce qui suggère la formule suivante. 
    $$\boxed{P_{n}(X) = \sum_{k=0}^{n} (-1)^{n-k}\,\frac{n!}{k!}\,X^{k}}$$
     Elle se démontre par récurrence : si elle est vraie au rang $n - 1$, alors $-nP_{n-1}(X) = \sum_{k=0}^{n-1} (-1)^{n-k}\frac{n!}{k!}X^{k}$, et l'ajout de $X^{n}$ donne le terme $k = n$.
