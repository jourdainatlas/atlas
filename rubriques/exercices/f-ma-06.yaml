  enonce: |
    Pour tous entiers naturels $n$ et $m$, on pose $C_{n,m} = \displaystyle\int_{0}^{\pi} \cos^{n}x\,\cos(mx)\,\mathrm{d} x$.

    **1.** Montrer que $2\cos x\cos(mx) = \cos\big((m + 1)x\big) + \cos\big((m - 1)x\big)$, et en déduire que, pour $m \geqslant 1$, 
    $$2C_{n+1,m} = C_{n,m+1} + C_{n,m-1}.$$

    **2.** Montrer par récurrence sur $n$ que $C_{n,m} = 0$ pour tous $m > n$.

    **3.** En déduire que $C_{n,n} = \dfrac{\pi}{2^{n}}$ pour tout $n \in \mathbb{N}$.

    **4.** Retrouver ces résultats en linéarisant $\cos^{n} x$ par la formule du binôme appliquée à $\big(\frac{\mathrm{e}^{\mathrm{i} x} + \mathrm{e}^{-\mathrm{i} x}}{2}\big)^{n}$, comme au chapitre 4.
  corrige: |
    **1.** On ajoute $\cos(a + b) = \cos a\cos b - \sin a\sin b$ et $\cos(a - b) = \cos a\cos b + \sin a\sin b$, avec $a = mx$ et $b = x$ : 
    $$\boxed{2\cos x\cos(mx) = \cos\big((m + 1)x\big) + \cos\big((m - 1)x\big)}$$
     En multipliant par $\cos^{n} x$ et en intégrant sur $[0\,,\pi]$, on obtient, pour $m \geqslant 1$ : 
    $$\boxed{2C_{n+1,m} = C_{n,m+1} + C_{n,m-1}}$$
     **2.** Pour $n \in \mathbb{N}$, notons $\mathcal{P}(n)$ : « $C_{n,m} = 0$ pour tout entier $m > n$ ».

    **Initialisation :** Pour $m \geqslant 1$, $C_{0,m} = \big[\frac{\sin(mx)}{m}\big]_{0}^{\pi} = 0$.

    **Hérédité :** Supposons $\mathcal{P}(n)$, et soit $m > n + 1$. Alors $m \geqslant 1$, et les entiers $m + 1$ et $m - 1$ sont strictement supérieurs à $n$ : la question 1 donne $2C_{n+1,m} = 0 + 0$.

    **Conclusion :** $\boxed{C_{n,m} = 0 \text{ pour tous entiers } m > n}$.

    **3.** La question 1, avec $m = n + 1$, puis la question 2 donnent $2C_{n+1,n+1} = C_{n,n+2} + C_{n,n} = C_{n,n}$. La suite $(C_{n,n})$ est donc géométrique de raison $\frac{1}{2}$, et $C_{0,0} = \int_{0}^{\pi} \mathrm{d} x = \pi$. 
    $$\boxed{C_{n,n} = \frac{\pi}{2^{n}}}$$
     **4.** La formule du binôme donne, comme au chapitre 4, 
    $$\cos^{n} x = \frac{1}{2^{n}}\sum_{k=0}^{n} \binom{n}{k}\mathrm{e}^{\mathrm{i}(2k - n)x} = \frac{1}{2^{n}}\sum_{k=0}^{n} \binom{n}{k}\cos\big((2k - n)x\big),$$
     la seconde égalité s'obtenant en prenant la partie réelle. Pour des entiers $p$ et $m$, on a 
    $$\int_{0}^{\pi} \cos(px)\cos(mx)\,\mathrm{d} x = \frac{1}{2}\int_{0}^{\pi} \big(\cos((p + m)x) + \cos((p - m)x)\big)\,\mathrm{d} x,$$
     qui vaut $0$ si $p + m \neq 0$ et $p - m \neq 0$, et $\frac{\pi}{2}$ si une seule de ces deux quantités est nulle. Si $m > n$, tous les entiers $2k - n$ sont de valeur absolue au plus $n < m$, donc toutes les intégrales sont nulles. Si $m = n \geqslant 1$, seuls les termes $k = 0$ et $k = n$ contribuent, chacun pour $\frac{\pi}{2}$, ce qui donne 
    $$C_{n,n} = \frac{1}{2^{n}}\Big(\frac{\pi}{2} + \frac{\pi}{2}\Big) = \frac{\pi}{2^{n}}. \quad \checkmark$$
- id: "ma-06-27"
  feuille: "f-ma-06"
  numero: 27
  partie: "Équations différentielles linéaires du premier ordre"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équations du premier ordre, primitives trigonométriques, fractions rationnelles, équations différentielles]
  noeuds: [ed-lineaires, ex-exponentielle]
  notions: [equation-differentielle, exponentielle]
  page_enonce: 8
  page_corrige: 22
  enonce: |
    Résoudre les équations suivantes, à coefficients constants, sur $\mathbb{R}$ ; pour les deux premières, on déterminera la solution qui vérifie la condition indiquée.

    **(a)** $y' + 2y = -4$, $y(1) = -3$

    **(b)** $2y' - 3y = 9$, $y(-1) = 1$

    **(c)** $y' + 2y = x^{2} - 2x + 3$

    **(d)** $7y' + 2y = 2x^{3} - 5x^{2} + 4x - 1$

    **(e)** $y' + y = x\,\mathrm{e}^{-x}$

    **(f)** $y' - 2y = \cos x + 2\sin x$

    **(g)** $y' + y = (x^{2} - 2x + 2)\,\mathrm{e}^{2x}$

    **(h)** $y' - 2y = \operatorname{sh} x - 2x\operatorname{ch} x$

    *Indication : pour (c), (d) et (g), on cherchera une solution particulière de la forme d'un polynôme, éventuellement multiplié par l'exponentielle du second membre, en justifiant le degré choisi.*
  corrige: |
    Pour une équation $y' + ay = b(x)$ à coefficient $a$ constant, les solutions de l'équation homogène sont les $\lambda\,\mathrm{e}^{-ax}$ (théorème 2), et l'on cherche une solution particulière de la forme du second membre (remarque du cours), puis l'on applique la proposition 7.

    **(a)** La constante $-2$ est solution, d'où $y = -2 + \lambda\,\mathrm{e}^{-2x}$. La condition $y(1) = -3$ donne $\lambda\,\mathrm{e}^{-2} = -1$. 
    $$\boxed{y(x) = -2 - \mathrm{e}^{2 - 2x}}$$
     **(b)** Sous forme normalisée, $y' - \frac{3}{2}y = \frac{9}{2}$ ; la constante $-3$ est solution, d'où $y = -3 + \lambda\,\mathrm{e}^{3x/2}$, et $y(-1) = 1$ donne $\lambda\,\mathrm{e}^{-3/2} = 4$. 
    $$\boxed{y(x) = -3 + 4\,\mathrm{e}^{3(x + 1)/2}}$$
     **(c)** Comme le coefficient de $y$ n'est pas nul, un polynôme de degré $2$ convient : avec $y = \alpha x^{2} + \beta x + \gamma$, on identifie $2\alpha = 1$, $2\alpha + 2\beta = -2$ et $\beta + 2\gamma = 3$. 
    $$\boxed{y(x) = \frac{x^{2}}{2} - \frac{3x}{2} + \frac{9}{4} + \lambda\,\mathrm{e}^{-2x}, \quad \lambda \in \mathbb{R}}$$
     **(d)** On cherche un polynôme de degré $3$ ; l'identification, en partant du terme de plus haut degré, donne successivement les coefficients $1$, $-13$, $93$ et $-326$. 
    $$\boxed{y(x) = x^{3} - 13x^{2} + 93x - 326 + \lambda\,\mathrm{e}^{-2x/7}, \quad \lambda \in \mathbb{R}}$$
     **(e)** Ici $\mathrm{e}^{-x}$ est solution de l'équation homogène : on fait varier la constante, $y = \lambda(x)\,\mathrm{e}^{-x}$ avec $\lambda'(x) = x$. 
    $$\boxed{y(x) = \Big(\frac{x^{2}}{2} + \lambda\Big)\mathrm{e}^{-x}, \quad \lambda \in \mathbb{R}}$$
     **(f)** On cherche $y = \alpha\cos x + \beta\sin x$ : l'identification donne $\beta - 2\alpha = 1$ et $-\alpha - 2\beta = 2$, d'où $\alpha = -\frac{4}{5}$ et $\beta = -\frac{3}{5}$. 
    $$\boxed{y(x) = -\frac{4\cos x + 3\sin x}{5} + \lambda\,\mathrm{e}^{2x}, \quad \lambda \in \mathbb{R}}$$
     **(g)** On cherche $y = Q(x)\,\mathrm{e}^{2x}$ : l'équation devient $Q' + 3Q = x^{2} - 2x + 2$, et $Q$ est de degré $2$, avec $Q = \frac{1}{27}(9x^{2} - 24x + 26)$. 
    $$\boxed{y(x) = \frac{9x^{2} - 24x + 26}{27}\,\mathrm{e}^{2x} + \lambda\,\mathrm{e}^{-x}, \quad \lambda \in \mathbb{R}}$$
     **(h)** On écrit le second membre avec des exponentielles : 
    $$\operatorname{sh} x - 2x\operatorname{ch} x = \Big(\frac{1}{2} - x\Big)\mathrm{e}^{x} - \Big(\frac{1}{2} + x\Big)\mathrm{e}^{-x},$$
     et l'on traite les deux termes séparément (principe de superposition). Pour le premier, $y = Q\,\mathrm{e}^{x}$ donne $Q' - Q = \frac{1}{2} - x$, d'où $Q = x + \frac{1}{2}$ ; pour le second, $y = R\,\mathrm{e}^{-x}$ donne $R' - 3R = -\frac{1}{2} - x$, d'où $R = \frac{x}{3} + \frac{5}{18}$. 
    $$\boxed{y(x) = \Big(x + \frac{1}{2}\Big)\mathrm{e}^{x} + \Big(\frac{x}{3} + \frac{5}{18}\Big)\mathrm{e}^{-x} + \lambda\,\mathrm{e}^{2x}, \quad \lambda \in \mathbb{R}}$$

    *Piège :* en (e), chercher une solution de la forme $(\alpha x + \beta)\,\mathrm{e}^{-x}$ échoue, car le terme $\beta\,\mathrm{e}^{-x}$ est absorbé par l'équation homogène : il faut monter d'un degré, ce que la variation de la constante fait automatiquement.
- id: "ma-06-28"
  feuille: "f-ma-06"
  numero: 28
  partie: "Équations différentielles linéaires du premier ordre"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équations du premier ordre, primitives trigonométriques, équations différentielles]
  noeuds: [ed-lineaires, ex-exponentielle]
  notions: [equation-differentielle, exponentielle]
  page_enonce: 9
  page_corrige: 23
  enonce: |
    Résoudre les équations suivantes sur l'intervalle indiqué.

    **(a)** $y' + x^{2}y = -x^{2}$, sur $\mathbb{R}$

    **(b)** $y' + 2xy = \mathrm{e}^{x - x^{2}}$, sur $\mathbb{R}$

    **(c)** $y' - \dfrac{x}{1 + x^{2}}\,y = \dfrac{1}{1 + x^{2}}$, sur $\mathbb{R}$

    **(d)** $y' + y = \dfrac{1}{1 + \mathrm{e}^{x}}$, sur $\mathbb{R}$

    **(e)** $y' - 2xy = -(2x - 1)\,\mathrm{e}^{x}$, sur $\mathbb{R}$

    **(f)** $y' - \dfrac{2}{t}\,y = t^{2}$, sur $]0\,,+\infty[$

    **(g)** $y' + \dfrac{y}{t} = \dfrac{1}{t(1 + t^{2})}$, sur $]0\,,+\infty[$

    **(h)** $y' - y\tan x = \dfrac{1}{\cos x}$, sur $\big]-\frac{\pi}{2}\,,\frac{\pi}{2}\big[$
  corrige: |
    On applique le théorème 2 pour l'équation homogène, puis la variation de la constante, sauf lorsqu'une solution particulière est évidente.

    **(a)** Une primitive de $x^{2}$ est $\frac{x^{3}}{3}$, et la constante $-1$ est solution. 
    $$\boxed{y(x) = -1 + \lambda\,\mathrm{e}^{-x^{3}/3}, \quad \lambda \in \mathbb{R}}$$
     **(b)** L'équation homogène a pour solutions les $\lambda\,\mathrm{e}^{-x^{2}}$, et $\lambda'(x) = \mathrm{e}^{x - x^{2}}\mathrm{e}^{x^{2}} = \mathrm{e}^{x}$. 
    $$\boxed{y(x) = (\mathrm{e}^{x} + \lambda)\,\mathrm{e}^{-x^{2}}, \quad \lambda \in \mathbb{R}}$$
     **(c)** Le coefficient de $y$ admet la primitive $A(x) = -\frac{1}{2}\ln(1 + x^{2})$ ; les solutions homogènes sont donc les $\lambda\sqrt{1 + x^{2}}$. On obtient $\lambda'(x) = (1 + x^{2})^{-3/2}$, que l'on primitive par le changement de variable $x = \tan\theta$ : 
    $$\int \frac{\mathrm{d} x}{(1 + x^{2})^{3/2}} = \int \cos\theta\,\mathrm{d}\theta = \sin\theta = \frac{x}{\sqrt{1 + x^{2}}}.$$

    $$\boxed{y(x) = x + \lambda\sqrt{1 + x^{2}}, \quad \lambda \in \mathbb{R}}$$
     On aurait pu remarquer directement que $y = x$ est solution, puisque $1 - \frac{x^{2}}{1 + x^{2}} = \frac{1}{1 + x^{2}}$.

    **(d)** Avec $y = \lambda(x)\,\mathrm{e}^{-x}$, on obtient $\lambda'(x) = \frac{\mathrm{e}^{x}}{1 + \mathrm{e}^{x}}$, de la forme $\frac{u'}{u}$. 
    $$\boxed{y(x) = \big(\ln(1 + \mathrm{e}^{x}) + \lambda\big)\,\mathrm{e}^{-x}, \quad \lambda \in \mathbb{R}}$$
     **(e)** L'équation homogène a pour solutions les $\lambda\,\mathrm{e}^{x^{2}}$, et $\lambda'(x) = (1 - 2x)\,\mathrm{e}^{x - x^{2}}$, qui est la dérivée de $\mathrm{e}^{x - x^{2}}$. 
    $$\boxed{y(x) = \mathrm{e}^{x} + \lambda\,\mathrm{e}^{x^{2}}, \quad \lambda \in \mathbb{R}}$$
     **(f)** Sur $]0\,,+\infty[$, $A(t) = -2\ln t$, les solutions homogènes sont les $\lambda t^{2}$, et $\lambda'(t) = t^{2}\cdot t^{-2} = 1$. 
    $$\boxed{y(t) = t^{3} + \lambda t^{2}, \quad \lambda \in \mathbb{R}}$$
     **(g)** Ici $A(t) = \ln t$, les solutions homogènes sont les $\frac{\lambda}{t}$, et $\lambda'(t) = \frac{1}{t(1 + t^{2})}\cdot t = \frac{1}{1 + t^{2}}$. 
    $$\boxed{y(t) = \frac{\operatorname{Arctan} t + \lambda}{t}, \quad \lambda \in \mathbb{R}}$$
     **(h)** Une primitive de $-\tan$ est $\ln(\cos x)$ sur $\big]-\frac{\pi}{2}\,,\frac{\pi}{2}\big[$, donc les solutions homogènes sont les $\frac{\lambda}{\cos x}$, et $\lambda'(x) = \frac{1}{\cos x}\cdot\cos x = 1$. 
    $$\boxed{y(x) = \frac{x + \lambda}{\cos x}, \quad \lambda \in \mathbb{R}}$$
- id: "ma-06-29"
  feuille: "f-ma-06"
  numero: 29
  partie: "Équations différentielles linéaires du premier ordre"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équations du premier ordre, primitives trigonométriques, équations différentielles]
  noeuds: [ed-lineaires, ex-logarithme, ex-croissances]
  notions: [equation-differentielle, logarithme]
  page_enonce: 9
  page_corrige: 24
  enonce: |
    Résoudre les équations suivantes sur l'intervalle indiqué, après les avoir mises sous forme normalisée.

    **(a)** $2xy' - y = x$, sur $]0\,,+\infty[$

    **(b)** $(1 + x)y' + y = 1 + \ln(1 + x)$, sur $]-1\,,+\infty[$

    **(c)** $\sqrt{1 - x^{2}}\,y' - y = 1$, sur $]-1\,,1[$

    **(d)** $y'\operatorname{ch} x - y\operatorname{sh} x = 1 + \operatorname{ch}^{2} x$, sur $\mathbb{R}$

    **(e)** $x\ln(x)\,y' - y = 3x^{2}(\ln x)^{2}$, sur $]0\,,1[$

    **(f)** $xy' - 2y = x^{3}\sin x$, sur $]0\,,+\infty[$
  corrige: |
    Sur chaque intervalle indiqué, le coefficient de $y'$ ne s'annule pas : on divise par lui.

    **(a)** $y' - \frac{1}{2x}\,y = \frac{1}{2}$. Les solutions homogènes sont les $\lambda\sqrt{x}$, et $y = x$ est solution évidente. 
    $$\boxed{y(x) = x + \lambda\sqrt{x}, \quad \lambda \in \mathbb{R}}$$
     **(b)** Le premier membre est la dérivée de $(1 + x)\,y$. En primitivant, avec la primitive $(1 + x)\ln(1 + x) - x$ de $\ln(1 + x)$, on obtient $(1 + x)\,y = (1 + x)\ln(1 + x) + \lambda$. 
    $$\boxed{y(x) = \ln(1 + x) + \frac{\lambda}{1 + x}, \quad \lambda \in \mathbb{R}}$$
     **(c)** $y' - \frac{1}{\sqrt{1 - x^{2}}}\,y = \frac{1}{\sqrt{1 - x^{2}}}$. Une primitive du coefficient est $-\operatorname{Arcsin} x$, et la constante $-1$ est solution. 
    $$\boxed{y(x) = -1 + \lambda\,\mathrm{e}^{\operatorname{Arcsin} x}, \quad \lambda \in \mathbb{R}}$$
     **(d)** $y' - \operatorname{th}(x)\,y = \frac{1 + \operatorname{ch}^{2} x}{\operatorname{ch} x}$. Une primitive de $-\operatorname{th}$ est $-\ln(\operatorname{ch} x)$, les solutions homogènes sont les $\lambda\operatorname{ch} x$, et $\lambda'(x) = \frac{1 + \operatorname{ch}^{2} x}{\operatorname{ch}^{2} x} = \frac{1}{\operatorname{ch}^{2} x} + 1$, de primitive $\operatorname{th} x + x$. 
    $$\boxed{y(x) = \operatorname{sh} x + (x + \lambda)\operatorname{ch} x, \quad \lambda \in \mathbb{R}}$$
     **(e)** Sur $]0\,,1[$, $x\ln x \neq 0$, et $y' - \frac{1}{x\ln x}\,y = 3x\ln x$. Une primitive de $\frac{1}{x\ln x}$ est $\ln|\ln x|$, donc les solutions homogènes sont les $\lambda\ln x$ ; avec $y = \lambda(x)\ln x$, l'équation devient $\lambda'\ln x = 3x\ln x$, soit $\lambda' = 3x$. 
    $$\boxed{y(x) = \Big(\frac{3x^{2}}{2} + \lambda\Big)\ln x, \quad \lambda \in \mathbb{R}}$$
     **(f)** $y' - \frac{2}{x}\,y = x^{2}\sin x$. Les solutions homogènes sont les $\lambda x^{2}$, et $\lambda'(x) = \sin x$. 
    $$\boxed{y(x) = (\lambda - \cos x)\,x^{2}, \quad \lambda \in \mathbb{R}}$$
- id: "ma-06-30"
  feuille: "f-ma-06"
  numero: 30
  partie: "Équations différentielles linéaires du premier ordre"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [équations du premier ordre, équations différentielles, second ordre]
  noeuds: [ed-lineaires]
  notions: [equation-differentielle]
  page_enonce: 9
  page_corrige: 25
  enonce: |
    **1.** Soit $a$, $b : I \to \mathbb{R}$ continues et $x_{0} \in I$. Montrer que les tangentes en leur point d'abscisse $x_{0}$ aux courbes des solutions de $y' + a(x)y = b(x)$ sont toutes parallèles, ou toutes concourantes.

    **2.** Déterminer une équation différentielle linéaire du premier ordre dont les solutions sont exactement les fonctions $x \mapsto \dfrac{C + x}{1 + x^{2}}$, $C \in \mathbb{R}$.

    **3.** Déterminer une équation de la forme $y'' + ay' + by = 0$ dont les solutions sont les fonctions $x \mapsto C_{1}\mathrm{e}^{2x} + C_{2}\mathrm{e}^{-x}$.
  corrige: |
    **1.** Notons $a_{0} = a(x_{0})$ et $b_{0} = b(x_{0})$. D'après le théorème 3, pour tout réel $y_{0}$, une solution prend la valeur $y_{0}$ en $x_{0}$ ; sa dérivée en $x_{0}$ vaut $b_{0} - a_{0}y_{0}$, et sa tangente a pour équation 
    $$Y = y_{0} + (b_{0} - a_{0}y_{0})(X - x_{0}) = y_{0}\big(1 - a_{0}(X - x_{0})\big) + b_{0}(X - x_{0}).$$
     Si $a_{0} = 0$, toutes les tangentes ont la pente $b_{0}$ : elles sont parallèles. Si $a_{0} \neq 0$, pour $X = x_{0} + \frac{1}{a_{0}}$, le terme en $y_{0}$ disparaît et $Y = \frac{b_{0}}{a_{0}}$, quel que soit $y_{0}$. 
    $$\boxed{\text{si } a(x_{0}) \neq 0, \text{ toutes les tangentes passent par } \Big(x_{0} + \frac{1}{a(x_{0})}, \frac{b(x_{0})}{a(x_{0})}\Big)}$$
     **2.** Si $y = \frac{C + x}{1 + x^{2}}$, alors $(1 + x^{2})\,y = C + x$, et en dérivant, $2x\,y + (1 + x^{2})\,y' = 1$. Réciproquement, cette équation, mise sous forme normalisée, a pour solutions homogènes les $\frac{C}{1 + x^{2}}$ et pour solution particulière $\frac{x}{1 + x^{2}}$ : ses solutions sont exactement les fonctions données. 
    $$\boxed{y' + \frac{2x}{1 + x^{2}}\,y = \frac{1}{1 + x^{2}}}$$
     **3.** D'après le théorème 5, il suffit que $2$ et $-1$ soient les racines de l'équation caractéristique, qui est donc $(r - 2)(r + 1) = r^{2} - r - 2 = 0$. 
    $$\boxed{y'' - y' - 2y = 0}$$
- id: "ma-06-31"
  feuille: "f-ma-06"
  numero: 31
  partie: "Équations différentielles linéaires du premier ordre"
  etoiles: 2
  types: [Démonstration, Calcul, Modélisation]
  mots_cles: [équations du premier ordre]
  noeuds: [ed-lineaires]
  notions: [equation-differentielle]
  page_enonce: 9
  page_corrige: 25
  enonce: |
    *Alcoolémie.* On modélise le taux d'alcool dans le sang, en grammes par litre, $t$ heures après l'absorption d'une boisson, par une fonction $f$ telle que $f(0) = 0$ et $f'(t) + f(t) = a\,\mathrm{e}^{-t}$ pour $t \geqslant 0$, où $a > 0$ dépend de la quantité absorbée.

    **1.** Déterminer $f$.

    **2.** On prend $a = 5$. Étudier les variations de $f$ et préciser le taux maximal et l'instant où il est atteint.

    **3.** Montrer qu'il existe un unique instant $t_{1} > 1$ à partir duquel le taux est inférieur à $0{,}5$ g/L, et en donner une valeur approchée à la minute près.
  corrige: |
    **1.** La fonction $t \mapsto \mathrm{e}^{-t}$ est solution de l'équation homogène : on fait varier la constante en posant $f(t) = \lambda(t)\,\mathrm{e}^{-t}$, ce qui donne $\lambda'(t) = a$. Les solutions sont les $(at + c)\,\mathrm{e}^{-t}$, et $f(0) = 0$ impose $c = 0$. 
    $$\boxed{f(t) = a\,t\,\mathrm{e}^{-t}}$$
     **2.** Pour $a = 5$, on a $f'(t) = 5(1 - t)\,\mathrm{e}^{-t}$, du signe de $1 - t$ : $f$ est croissante sur $[0\,,1]$ et décroissante sur $[1\,,+\infty[$. 
    $$\boxed{\text{taux maximal } f(1) = \frac{5}{\mathrm{e}} \approx 1{,}84 \text{ g/L, atteint au bout d'une heure}}$$
     **3.** Sur $]1\,,+\infty[$, la fonction $f$ est dérivable et strictement décroissante ; elle tend vers $\frac{5}{\mathrm{e}}$ en $1$ et vers $0$ en $+\infty$, par croissances comparées (chapitre 5). D'après le théorème 2 du chapitre 5, elle réalise une bijection de $]1\,,+\infty[$ sur $\big]0\,,\frac{5}{\mathrm{e}}\big[$, qui contient $0{,}5$. Il existe donc un unique $t_{1} > 1$ tel que $f(t_{1}) = 0{,}5$, et $f(t) < 0{,}5$ pour $t > t_{1}$ par décroissance. La résolution numérique de $t\,\mathrm{e}^{-t} = 0{,}1$ donne $t_{1} \approx 3{,}577$ h, soit, puisque $0{,}577 \times 60 \approx 34{,}6$ : 
    $$\boxed{t_{1} \approx 3 \text{ h } 35 \text{ min}}$$

    ![Figure](documents/figures/9e68e249c023fb72.svg)

    Le taux monte vite pendant la première heure, puis décroît lentement : il faut plus de deux heures et demie après le pic pour repasser sous le seuil de $0{,}5$ g/L.
- id: "ma-06-32"
  feuille: "f-ma-06"
  numero: 32
  partie: "Équations différentielles linéaires du premier ordre"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [équations du premier ordre, équations différentielles, raccordement, problème de Cauchy]
  noeuds: [ed-lineaires, ed-cauchy-lipschitz]
  notions: [equation-differentielle]
  page_enonce: 10
  page_corrige: 26
  enonce: |
    *Raccordements.* On considère l'équation $(E) : xy' = 2y + x$, sur $\mathbb{R}$.

    **1.** Résoudre $(E)$ sur $]-\infty\,,0[$ et sur $]0\,,+\infty[$.

    **2.** Soit $y$ une solution de $(E)$ sur $\mathbb{R}$. Que valent $y(0)$ et $y'(0)$ ? Montrer que $y$ s'écrit $x \mapsto -x + C_{1}x^{2}$ sur $]-\infty\,,0]$ et $x \mapsto -x + C_{2}x^{2}$ sur $[0\,,+\infty[$. Réciproquement, ces fonctions sont-elles toutes solutions sur $\mathbb{R}$ ?

    **3.** Combien $(E)$ a-t-elle de solutions sur $\mathbb{R}$ telles que $y(0) = 0$ ? telles que $y(0) = 1$ ? Pourquoi cela ne contredit-il pas le théorème de Cauchy du cours ?

    **4.** Résoudre de même $x^{2}y' - y = 0$ sur $]-\infty\,,0[$, sur $]0\,,+\infty[$, puis sur $\mathbb{R}$. On admettra que $\dfrac{\mathrm{e}^{-1/x}}{x^{2}}$ tend vers $0$ quand $x$ tend vers $0^{+}$, ce que les croissances comparées du chapitre 5 permettent d'établir.
  corrige: |
    **1.** Sur chacun des intervalles $]-\infty\,,0[$ et $]0\,,+\infty[$, l'équation s'écrit $y' - \frac{2}{x}\,y = 1$. Les solutions homogènes sont les $\lambda x^{2}$, puisque $\mathrm{e}^{2\ln|x|} = x^{2}$, et $y = -x$ est solution évidente. 
    $$\boxed{y(x) = -x + \lambda x^{2}, \quad \lambda \in \mathbb{R}, \text{ sur chacun des deux intervalles}}$$
     **2.** En $x = 0$, l'équation donne $0 = 2y(0) + 0$, donc $\boxed{y(0) = 0}$. D'après la question 1, il existe des constantes $C_{1}$ et $C_{2}$ telles que $y(x) = -x + C_{1}x^{2}$ pour $x < 0$ et $y(x) = -x + C_{2}x^{2}$ pour $x > 0$ ; ces formules restent vraies en $0$, puisque $y(0) = 0$. Le taux d'accroissement $\frac{y(x) - y(0)}{x}$ vaut $-1 + C_{i}x$, qui tend vers $-1$ : $\boxed{y'(0) = -1}$.

    Réciproquement, une telle fonction est dérivable sur $]-\infty\,,0[$ et sur $]0\,,+\infty[$, où elle vérifie $(E)$ ; le calcul précédent montre qu'elle est dérivable en $0$, avec $y'(0) = -1$, et $(E)$ est vérifiée en $0$ puisque $0 \times (-1) = 2 \times 0 + 0$. 
    $$\boxed{\text{les solutions sur } \mathbb{R} \text{ sont les } x \mapsto \begin{cases} -x + C_{1}x^{2} & (x \leqslant 0) \\ -x + C_{2}x^{2} & (x \geqslant 0) \end{cases}, \quad (C_{1}, C_{2}) \in \mathbb{R}^{2}}$$
     **3.** Toutes les solutions vérifient $y(0) = 0$ : il y en a une infinité, dépendant de deux constantes, et aucune ne vérifie $y(0) = 1$. 
    $$\boxed{y(0) = 0 : \text{ une infinité} \qquad y(0) = 1 : \text{ aucune}}$$
     Le théorème de Cauchy du cours porte sur une équation $y' + a(x)\,y = b(x)$ à coefficients continus sur un intervalle. Pour mettre $(E)$ sous cette forme, il faut diviser par $x$, ce qui est impossible sur un intervalle contenant $0$ : le théorème ne s'applique pas.

    **4.** Sur $]0\,,+\infty[$ ou $]-\infty\,,0[$, l'équation s'écrit $y' - \frac{1}{x^{2}}\,y = 0$ ; une primitive de $-\frac{1}{x^{2}}$ est $\frac{1}{x}$, d'où les solutions $\lambda\,\mathrm{e}^{-1/x}$ sur chacun des deux intervalles. Soit maintenant $y$ une solution sur $\mathbb{R}$. En $0$, l'équation donne $y(0) = 0$. Pour $x < 0$, on a $y(x) = C_{1}\mathrm{e}^{-1/x}$, et $\mathrm{e}^{-1/x}$ tend vers $+\infty$ quand $x$ tend vers $0^{-}$ : la continuité en $0$ impose $C_{1} = 0$. Pour $x > 0$, $y(x) = C_{2}\mathrm{e}^{-1/x}$ tend vers $0$, et le taux d'accroissement vérifie 
    $$\frac{C_{2}\mathrm{e}^{-1/x}}{x} = C_{2}\,x\cdot\frac{\mathrm{e}^{-1/x}}{x^{2}} \xrightarrow[x \to 0^{+}]{} 0.$$
     La fonction est donc dérivable en $0$, de dérivée nulle, et l'équation est vérifiée en $0$. Réciproquement, ces fonctions conviennent. 
    $$\boxed{\text{les solutions sur } \mathbb{R} \text{ sont les } x \mapsto \begin{cases} 0 & (x \leqslant 0) \\ C\,\mathrm{e}^{-1/x} & (x > 0) \end{cases}, \quad C \in \mathbb{R}}$$
     Toutes s'annulent en $0$ et sont nulles à gauche, mais elles diffèrent à droite : là encore, la condition $y(0) = 0$ ne détermine pas la solution.

    ![Figure](documents/figures/118d24cb142b79b0.svg)

    Les solutions sur $\mathbb{R}$ de $x^{2}y' = y$ partent toutes de la demi-droite nulle à gauche de $0$, puis se séparent en $0$ en quittant l'axe avec une tangente horizontale : la fonction $x \mapsto \mathrm{e}^{-1/x}$ est si plate en $0^{+}$ que le raccordement se fait sans angle.
- id: "ma-06-33"
  feuille: "f-ma-06"
  numero: 33
  partie: "Équations différentielles linéaires du premier ordre"
  etoiles: 3
  types: [Calcul]
  mots_cles: [équations du premier ordre, équations différentielles, raccordement]
  noeuds: [ed-lineaires]
  notions: [equation-differentielle]
  page_enonce: 10
  page_corrige: 27
  enonce: |
    Résoudre sur $\mathbb{R}$ les équations suivantes, en étudiant les raccordements.

    **(a)** $xy' - y = x^{2}$

    **(b)** $xy' + y = x^{2}$

    **(c)** $\operatorname{sh}(x)\,y' - \operatorname{ch}(x)\,y = 1$

    **(d)** $(x^{2} - 1)\,y' = xy$
  corrige: |
    La méthode est celle de l'exercice 32 : on résout sur les intervalles où le coefficient de $y'$ ne s'annule pas, puis on cherche à quelles conditions les morceaux se recollent en une fonction dérivable vérifiant l'équation aux points singuliers.

    **(a)** Sur $]-\infty\,,0[$ et $]0\,,+\infty[$, $y' - \frac{1}{x}\,y = x$ : les solutions homogènes sont les $\lambda x$, et $\lambda' = 1$, d'où $y = x^{2} + C_{i}x$. Une solution sur $\mathbb{R}$ vérifie $y(0) = 0$, et ses dérivées à gauche et à droite en $0$ valent $C_{1}$ et $C_{2}$ : elle n'est dérivable que si $C_{1} = C_{2}$. Réciproquement, $x^{2} + Cx$ est solution sur $\mathbb{R}$. 
    $$\boxed{y(x) = x^{2} + Cx, \quad C \in \mathbb{R}}$$
     **(b)** Le premier membre est $(xy)'$ : sur chaque demi-droite, $xy = \frac{x^{3}}{3} + C_{i}$, soit $y = \frac{x^{2}}{3} + \frac{C_{i}}{x}$. Une solution sur $\mathbb{R}$ est continue en $0$, donc bornée au voisinage de $0$, ce qui impose $C_{1} = C_{2} = 0$. 
    $$\boxed{y(x) = \frac{x^{2}}{3} \text{ : solution unique}}$$
     **(c)** Sur chaque demi-droite, $\operatorname{sh} x \neq 0$ et $y' - \frac{\operatorname{ch} x}{\operatorname{sh} x}\,y = \frac{1}{\operatorname{sh} x}$. Les solutions homogènes sont les $\lambda\operatorname{sh} x$, et $\lambda'(x) = \frac{1}{\operatorname{sh}^{2} x}$, dont une primitive est $-\frac{\operatorname{ch} x}{\operatorname{sh} x}$, comme on le vérifie en dérivant ; d'où $y = -\operatorname{ch} x + C_{i}\operatorname{sh} x$. En $0$, l'équation donne $-y(0) = 1$ : les deux morceaux tendent bien vers $-1$. Les dérivées à gauche et à droite en $0$ sont celles de $-\operatorname{ch} + C_{i}\operatorname{sh}$, soit $C_{1}$ et $C_{2}$ : il faut $C_{1} = C_{2}$. 
    $$\boxed{y(x) = -\operatorname{ch} x + C\operatorname{sh} x, \quad C \in \mathbb{R}}$$
     **(d)** Les points singuliers sont $-1$ et $1$. Sur chacun des trois intervalles, $y' = \frac{x}{x^{2} - 1}\,y$, et une primitive du coefficient est $\frac{1}{2}\ln|x^{2} - 1|$ : $y = C_{i}\sqrt{|x^{2} - 1|}$. Une solution sur $\mathbb{R}$ vérifie $y(\pm 1) = 0$. En $1$, le taux d'accroissement à droite vaut 
    $$\frac{C\sqrt{x^{2} - 1}}{x - 1} = C\sqrt{\frac{x + 1}{x - 1}},$$
     qui tend vers l'infini si $C \neq 0$ ; il en est de même à gauche de $1$ et des deux côtés de $-1$. Toutes les constantes sont nulles. 
    $$\boxed{y = 0 \text{ : solution unique}}$$

    *À retenir :* selon l'équation, le raccordement peut ajouter des solutions (exercice 32), en conserver le nombre (a) et (c), ou en éliminer (b) et (d) ; il faut chaque fois mener l'étude, sans présumer du résultat.
- id: "ma-06-34"
  feuille: "f-ma-06"
  numero: 34
  partie: "Équations différentielles linéaires du premier ordre"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [équations du premier ordre, intégrales]
  noeuds: [ed-lineaires, ri-proprietes]
  notions: [equation-differentielle, riemann-integrable]
  page_enonce: 10
  page_corrige: 27
  enonce: |
    Déterminer les fonctions $f : \mathbb{R} \to \mathbb{R}$ dérivables vérifiant les conditions suivantes.

    **(a)** $f'(x) + f(x) = f(0) + f(1)$ pour tout réel $x$.

    **(b)** $f'(x) + f(x) = \displaystyle\int_{0}^{1} f(t)\,\mathrm{d} t$ pour tout réel $x$.

    **(c)** $f'(x) + f(-x) = \mathrm{e}^{x}$ pour tout réel $x$. *On montrera que $f$ est deux fois dérivable et vérifie une équation du second ordre.*
  corrige: |
    **(a)** Le second membre $k = f(0) + f(1)$ est une constante : $f$ est solution de $y' + y = k$, donc $f(x) = k + C\,\mathrm{e}^{-x}$. Il reste à écrire que $k = f(0) + f(1) = 2k + C(1 + \mathrm{e}^{-1})$, soit $C = -\frac{k\,\mathrm{e}}{\mathrm{e} + 1}$. Réciproquement, ces fonctions conviennent. 
    $$\boxed{f(x) = k\Big(1 - \frac{\mathrm{e}^{1 - x}}{\mathrm{e} + 1}\Big), \quad k \in \mathbb{R}}$$
     **(b)** De même, avec $m = \int_{0}^{1} f$, on a $f(x) = m + C\,\mathrm{e}^{-x}$, et la condition s'écrit $m = m + C(1 - \mathrm{e}^{-1})$, d'où $C = 0$. Réciproquement, toute fonction constante $f = m$ vérifie $f' + f = m = \int_{0}^{1} f$. 
    $$\boxed{\text{les fonctions constantes}}$$
     **(c)** La relation donne $f'(x) = \mathrm{e}^{x} - f(-x)$ : le second membre est dérivable, donc $f$ est deux fois dérivable, et $f''(x) = \mathrm{e}^{x} + f'(-x)$. En appliquant la relation en $-x$, $f'(-x) = \mathrm{e}^{-x} - f(x)$, d'où 
    $$f'' + f = \mathrm{e}^{x} + \mathrm{e}^{-x} = 2\operatorname{ch} x.$$
     La fonction $\operatorname{ch}$ est solution particulière, puisque $\operatorname{ch}'' = \operatorname{ch}$, et le théorème 5 donne 
    $$f(x) = \lambda\cos x + \mu\sin x + \operatorname{ch} x.$$
     On réinjecte dans la relation de départ : 
    $$f'(x) + f(-x) = (-\lambda\sin x + \mu\cos x + \operatorname{sh} x) + (\lambda\cos x - \mu\sin x + \operatorname{ch} x),$$
     c'est-à-dire $f'(x) + f(-x) = (\lambda + \mu)(\cos x - \sin x) + \mathrm{e}^{x}$, ce qui impose $\mu = -\lambda$. 
    $$\boxed{f(x) = \lambda(\cos x - \sin x) + \operatorname{ch} x, \quad \lambda \in \mathbb{R}}$$

    *Piège :* en (c), l'équation du second ordre n'est qu'une conséquence de la relation donnée ; toutes ses solutions ne conviennent pas, et l'étape de réinjection, qui élimine une constante, est indispensable.
- id: "ma-06-35"
  feuille: "f-ma-06"
  numero: 35
  partie: "Équations différentielles linéaires du premier ordre"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [équations du premier ordre, primitives, équations différentielles, problème de Cauchy]
  noeuds: [ed-lineaires, ar-tfa, ed-cauchy-lipschitz]
  notions: [equation-differentielle]
  page_enonce: 10
  page_corrige: 28
  enonce: |
    *Comparaison de solutions.* Soit $a$, $b : \mathbb{R} \to \mathbb{R}$ continues, $A$ une primitive de $a$, et $y$, $z$ deux fonctions dérivables telles que $y(0) = z(0)$ et, pour tout réel $x$, 
    $$y'(x) = a(x)\,y(x) + b(x) \qquad\text{et}\qquad z'(x) \leqslant a(x)\,z(x) + b(x).$$

    **1.** En étudiant $x \mapsto \big(z(x) - y(x)\big)\,\mathrm{e}^{-A(x)}$, montrer que $z(x) \leqslant y(x)$ pour tout $x \geqslant 0$.

    **2.** Application : soit $g : [0\,,+\infty[ \to \mathbb{R}$ dérivable telle que $g' \leqslant k\,g$, avec $k$ réel. Montrer que $g(x) \leqslant g(0)\,\mathrm{e}^{kx}$ pour tout $x \geqslant 0$.

    **3.** Que devient le résultat de la question 1 pour $x \leqslant 0$ ?
  corrige: |
    **1.** Posons $\varphi(x) = \big(z(x) - y(x)\big)\,\mathrm{e}^{-A(x)}$. Elle est dérivable, et 
    $$\varphi'(x) = \big(z' - y' - a(z - y)\big)\,\mathrm{e}^{-A} = \big(z' - az - b\big)\,\mathrm{e}^{-A} - \big(y' - ay - b\big)\,\mathrm{e}^{-A} = \big(z' - az - b\big)\,\mathrm{e}^{-A} \leqslant 0.$$
     La fonction $\varphi$ est donc décroissante, et $\varphi(0) = 0$ : pour $x \geqslant 0$, $\varphi(x) \leqslant 0$, et comme $\mathrm{e}^{-A(x)} > 0$ : 
    $$\boxed{z(x) \leqslant y(x) \text{ pour tout } x \geqslant 0}$$
     **2.** La fonction $y : x \mapsto g(0)\,\mathrm{e}^{kx}$ vérifie $y' = ky$ et $y(0) = g(0)$. Le raisonnement de la question 1, mené sur $[0\,,+\infty[$ avec $a = k$, $b = 0$ et $z = g$, donne : 
    $$\boxed{g(x) \leqslant g(0)\,\mathrm{e}^{kx} \text{ pour tout } x \geqslant 0}$$
     **3.** Pour $x \leqslant 0$, la décroissance de $\varphi$ donne $\varphi(x) \geqslant \varphi(0) = 0$ : l'inégalité s'inverse. 
    $$\boxed{z(x) \geqslant y(x) \text{ pour tout } x \leqslant 0}$$
     Une sous-solution reste sous la solution dans le futur, et au-dessus dans le passé ; cette comparaison servira à l'exercice 55.
- id: "ma-06-36"
  feuille: "f-ma-06"
  numero: 36
  partie: "Équations différentielles linéaires du premier ordre"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [équations du premier ordre, fractions rationnelles, équations différentielles]
  noeuds: [ed-lineaires, tg-arctan]
  notions: [equation-differentielle, arc-tangente, cosinus-sinus]
  page_enonce: 11
  page_corrige: 28
  enonce: |
    *Deux équations non linéaires.*

    **1.** Soit $y$ une solution de $y' = 1 + y^{2}$ sur un intervalle $I$. En dérivant $\operatorname{Arctan} \circ\, y$, montrer qu'il existe une constante $c$ telle que $y(x) = \tan(x + c)$ sur $I$. En déduire que cette équation n'a aucune solution sur $\mathbb{R}$, et préciser la plus grande longueur possible de $I$.

    **2.** On cherche les fonctions $y$ dérivables et strictement positives sur $]0\,,+\infty[$ telles que 
    $$x^{2} + y^{2} - 2xy\,y' = 0.$$
     En posant $z = y^{2}$, se ramener à une équation linéaire, puis conclure.
  corrige: |
    **1.** La fonction $\operatorname{Arctan} \circ\, y$ est dérivable sur $I$, de dérivée $\frac{y'}{1 + y^{2}} = 1$ : il existe une constante $c$ telle que $\operatorname{Arctan}(y(x)) = x + c$ pour tout $x \in I$. Comme $\operatorname{Arctan}$ prend ses valeurs dans $\big]-\frac{\pi}{2}\,,\frac{\pi}{2}\big[$, on a $x + c$ dans cet intervalle, et en composant par $\tan$ : 
    $$\boxed{y(x) = \tan(x + c), \qquad I \subset \Big]-\frac{\pi}{2} - c\,,\frac{\pi}{2} - c\Big[}$$
     L'intervalle $I$ est donc de longueur au plus $\pi$ : il n'existe aucune solution sur $\mathbb{R}$. La longueur $\pi$ est atteinte, par exemple par $\tan$ sur $\big]-\frac{\pi}{2}\,,\frac{\pi}{2}\big[$. 
    $$\boxed{\text{aucune solution sur } \mathbb{R} \text{ ; longueur maximale de } I : \pi}$$
     Ce phénomène d'« explosion en temps fini » est impossible pour une équation linéaire, dont les solutions sont définies sur tout l'intervalle où les coefficients sont continus (théorème 3).

    **2.** Si $y$ est dérivable et strictement positive, $z = y^{2}$ l'est aussi, avec $z' = 2y\,y'$ ; réciproquement, si $z$ est dérivable et strictement positive, $y = \sqrt{z}$ est dérivable. L'équation devient 
    $$x^{2} + z - x\,z' = 0, \qquad\text{soit}\qquad z' - \frac{1}{x}\,z = x \quad\text{sur } ]0\,,+\infty[,$$
     dont les solutions sont les $z(x) = x^{2} + Cx$, comme à l'exercice 33 (a). Il faut enfin $z(x) = x(x + C) > 0$ pour tout $x > 0$, c'est-à-dire $C \geqslant 0$ : si $C < 0$, $z$ est négative sur $]0\,,-C]$. 
    $$\boxed{y(x) = \sqrt{x^{2} + Cx}, \quad C \geqslant 0}$$
- id: "ma-06-37"
  feuille: "f-ma-06"
  numero: 37
  partie: "Équations du second ordre à coefficients constants"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équations du second ordre, équations différentielles, second ordre]
  noeuds: [ed-lineaires]
  notions: [equation-differentielle]
  page_enonce: 11
  page_corrige: 29
  enonce: |
    Déterminer les solutions réelles des équations homogènes suivantes, puis leurs solutions complexes.

    **(a)** $y'' - 2y' - 3y = 0$

    **(b)** $y'' - 2y' + y = 0$

    **(c)** $y'' - 2y' + 5y = 0$

    **(d)** $4y'' + 9y = 0$

    **(e)** $y'' + y' + y = 0$

    **(f)** $y'' - 4y = 0$
  corrige: |
    On résout l'équation caractéristique, puis on applique le théorème 5 pour les solutions réelles et le théorème 4 pour les solutions complexes ; les constantes $\lambda$, $\mu$ sont réelles dans le premier cas, complexes dans le second.

    **(a)** $r^{2} - 2r - 3 = (r - 3)(r + 1)$ : les deux écritures coïncident. 
    $$\boxed{y(x) = \lambda\,\mathrm{e}^{3x} + \mu\,\mathrm{e}^{-x}}$$
     **(b)** $r^{2} - 2r + 1 = (r - 1)^{2}$, racine double $1$. 
    $$\boxed{y(x) = (\lambda + \mu x)\,\mathrm{e}^{x}}$$
     **(c)** $\Delta = -16$, racines $1 \pm 2\mathrm{i}$. 
    $$\boxed{\text{réelles : } \mathrm{e}^{x}\big(\lambda\cos(2x) + \mu\sin(2x)\big) \qquad \text{complexes : } \lambda\,\mathrm{e}^{(1 + 2\mathrm{i})x} + \mu\,\mathrm{e}^{(1 - 2\mathrm{i})x}}$$
     **(d)** $4r^{2} + 9 = 0$ a pour racines $\pm\frac{3}{2}\mathrm{i}$. 
    $$\boxed{\text{réelles : } \lambda\cos\frac{3x}{2} + \mu\sin\frac{3x}{2} \qquad \text{complexes : } \lambda\,\mathrm{e}^{3\mathrm{i} x/2} + \mu\,\mathrm{e}^{-3\mathrm{i} x/2}}$$
     **(e)** $\Delta = -3$, racines $-\frac{1}{2} \pm \mathrm{i}\frac{\sqrt{3}}{2}$, c'est-à-dire $j$ et $j^{2}$ (chapitre 4). 
    $$\boxed{\text{réelles : } \mathrm{e}^{-x/2}\Big(\lambda\cos\frac{\sqrt{3}\,x}{2} + \mu\sin\frac{\sqrt{3}\,x}{2}\Big) \qquad \text{complexes : } \lambda\,\mathrm{e}^{jx} + \mu\,\mathrm{e}^{j^{2}x}}$$
     **(f)** $r^{2} - 4 = (r - 2)(r + 2)$. 
    $$\boxed{y(x) = \lambda\,\mathrm{e}^{2x} + \mu\,\mathrm{e}^{-2x}, \text{ que l'on peut aussi écrire } \alpha\operatorname{ch}(2x) + \beta\operatorname{sh}(2x)}$$
- id: "ma-06-38"
  feuille: "f-ma-06"
  numero: 38
  partie: "Équations du second ordre à coefficients constants"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équations du second ordre, primitives trigonométriques, équations différentielles, second ordre]
  noeuds: [ed-lineaires, ex-exponentielle]
  notions: [equation-differentielle, exponentielle]
  page_enonce: 11
  page_corrige: 29
  enonce: |
    Résoudre sur $\mathbb{R}$ les équations suivantes, en cherchant les solutions réelles.

    **(a)** $y'' - 3y' + 2y = 1$

    **(b)** $y'' + 4y' + 4y = \mathrm{e}^{x}$

    **(c)** $y'' - y = \mathrm{e}^{2x} - \mathrm{e}^{x}$

    **(d)** $y'' - 4y' + 3y = 3\mathrm{e}^{3x}$

    **(e)** $y'' + y' + y = \cos x$

    **(f)** $y'' + y' - 2y = \cos x$

    **(g)** $y'' + 4y' + 4y = \mathrm{e}^{-2x} + 1$

    **(h)** $y'' - y = \operatorname{ch} x$

    **(i)** $y'' + 2y' + y = \operatorname{sh} x$

    **(j)** $y'' + y' = x$
  corrige: |
    Dans chaque cas, on donne les racines caractéristiques, une solution particulière obtenue par la proposition 10 ou par la méthode qui la suit, puis la solution générale, avec $(\lambda, \mu) \in \mathbb{R}^{2}$.

    **(a)** Racines $1$ et $2$ ; la constante $\frac{1}{2}$ est solution. 
    $$\boxed{y(x) = \lambda\,\mathrm{e}^{x} + \mu\,\mathrm{e}^{2x} + \frac{1}{2}}$$
     **(b)** Racine double $-2$ ; $1$ n'est pas racine et $P(1) = 9$. 
    $$\boxed{y(x) = (\lambda + \mu x)\,\mathrm{e}^{-2x} + \frac{\mathrm{e}^{x}}{9}}$$
     **(c)** Racines $1$ et $-1$. Pour $\mathrm{e}^{2x}$, $P(2) = 3$ ; pour $-\mathrm{e}^{x}$, $1$ est racine simple et $P'(1) = 2$ ; on superpose. 
    $$\boxed{y(x) = \lambda\,\mathrm{e}^{x} + \mu\,\mathrm{e}^{-x} + \frac{\mathrm{e}^{2x}}{3} - \frac{x\,\mathrm{e}^{x}}{2}}$$
     **(d)** Racines $1$ et $3$ ; $3$ est racine simple, $P'(3) = 2$. 
    $$\boxed{y(x) = \lambda\,\mathrm{e}^{x} + \mu\,\mathrm{e}^{3x} + \frac{3}{2}\,x\,\mathrm{e}^{3x}}$$
     **(e)** Racines $-\frac{1}{2} \pm \mathrm{i}\frac{\sqrt{3}}{2}$. Pour $\mathrm{e}^{\mathrm{i} x}$, $P(\mathrm{i}) = -1 + \mathrm{i} + 1 = \mathrm{i}$, et $\operatorname{Re}\frac{\mathrm{e}^{\mathrm{i} x}}{\mathrm{i}} = \sin x$. 
    $$\boxed{y(x) = \mathrm{e}^{-x/2}\Big(\lambda\cos\frac{\sqrt{3}\,x}{2} + \mu\sin\frac{\sqrt{3}\,x}{2}\Big) + \sin x}$$
     **(f)** Racines $1$ et $-2$. On a $P(\mathrm{i}) = -3 + \mathrm{i}$, et $\operatorname{Re}\frac{\mathrm{e}^{\mathrm{i} x}}{-3 + \mathrm{i}} = \operatorname{Re}\frac{(-3 - \mathrm{i})\,\mathrm{e}^{\mathrm{i} x}}{10}$. 
    $$\boxed{y(x) = \lambda\,\mathrm{e}^{x} + \mu\,\mathrm{e}^{-2x} + \frac{\sin x - 3\cos x}{10}}$$
     **(g)** Racine double $-2$ : pour $\mathrm{e}^{-2x}$, la proposition 10 donne $\frac{x^{2}}{2}\,\mathrm{e}^{-2x}$ ; pour la constante $1$, on trouve $\frac{1}{4}$. 
    $$\boxed{y(x) = \Big(\lambda + \mu x + \frac{x^{2}}{2}\Big)\mathrm{e}^{-2x} + \frac{1}{4}}$$
     **(h)** Racines $\pm 1$, toutes deux simples, et $\operatorname{ch} x = \frac{\mathrm{e}^{x} + \mathrm{e}^{-x}}{2}$. Les solutions particulières de $y'' - y = \frac{\mathrm{e}^{x}}{2}$ et $y'' - y = \frac{\mathrm{e}^{-x}}{2}$ sont $\frac{x\,\mathrm{e}^{x}}{4}$ et $-\frac{x\,\mathrm{e}^{-x}}{4}$, puisque $P'(\pm 1) = \pm 2$ ; leur somme est $\frac{x}{2}\operatorname{sh} x$. 
    $$\boxed{y(x) = \lambda\,\mathrm{e}^{x} + \mu\,\mathrm{e}^{-x} + \frac{x}{2}\operatorname{sh} x}$$
     **(i)** Racine double $-1$. Pour $\frac{\mathrm{e}^{x}}{2}$, $P(1) = 4$ ; pour $-\frac{\mathrm{e}^{-x}}{2}$, la racine est double, d'où $-\frac{x^{2}}{4}\,\mathrm{e}^{-x}$. 
    $$\boxed{y(x) = \Big(\lambda + \mu x - \frac{x^{2}}{4}\Big)\mathrm{e}^{-x} + \frac{\mathrm{e}^{x}}{8}}$$
     **(j)** Racines $0$ et $-1$ ; comme $b = 0$ et $a \neq 0$, on cherche un polynôme de degré $2$, et l'identification donne $\frac{x^{2}}{2} - x$. 
    $$\boxed{y(x) = \lambda + \mu\,\mathrm{e}^{-x} + \frac{x^{2}}{2} - x}$$

    *Piège :* en (h) et en (i), on écrit souvent la solution particulière en remplaçant $\operatorname{ch}$ ou $\operatorname{sh}$ par lui-même, ce qui ne marche pas puisque $\mathrm{e}^{x}$ ou $\mathrm{e}^{-x}$ est solution de l'équation homogène ; il faut revenir aux exponentielles et traiter chaque terme selon sa propre position par rapport aux racines.
- id: "ma-06-39"
  feuille: "f-ma-06"
  numero: 39
  partie: "Équations du second ordre à coefficients constants"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équations du second ordre, primitives trigonométriques, fractions rationnelles, équations différentielles, second ordre]
  noeuds: [ed-lineaires, ex-exponentielle]
  notions: [equation-differentielle, exponentielle]
  page_enonce: 11
  page_corrige: 30
  enonce: |
    Résoudre sur $\mathbb{R}$ les équations suivantes, en cherchant les solutions réelles. Pour les seconds membres produits d'une exponentielle et d'un polynôme, on cherchera une solution de la forme $Q(x)\,\mathrm{e}^{\lambda x}$, avec $Q$ polynomial, en utilisant la proposition 8 du cours.

    **(a)** $y'' - 2y' + y = \sin^{2} x$

    **(b)** $y'' + y' + y = \mathrm{e}^{x}\cos x$

    **(c)** $y'' - 3y' + 2y = \mathrm{e}^{2x}\sin(3x)$

    **(d)** $y'' - 2y' + 5y = 4\mathrm{e}^{x}\cos(2x)$

    **(e)** $y'' + y = \cos^{3} x$

    **(f)** $y'' - 4y' + 3y = (2x + 1)\,\mathrm{e}^{-x}$

    **(g)** $y'' - 4y' + 3y = (2x + 1)\,\mathrm{e}^{x}$

    **(h)** $y'' - 2y' + y = (x^{2} + 1)\,\mathrm{e}^{x}$

    **(i)** $y'' - y = x + 2\mathrm{e}^{x} + \cos x$

    **(j)** $y'' + 4y = \cos(2x) + \sin x + \mathrm{e}^{2x}$
  corrige: |
    Pour les seconds membres trigonométriques, on passe par l'exponentielle complexe ; pour les produits $Q\,\mathrm{e}^{\lambda x}$, la proposition 8 transforme l'équation en $Q'' + P'(\lambda)\,Q' + P(\lambda)\,Q =$ (polynôme). Les constantes $\lambda$ et $\mu$ décrivent $\mathbb{R}$.

    **(a)** Racine double $1$. On écrit $\sin^{2} x = \frac{1}{2} - \frac{1}{2}\cos(2x)$. La constante $\frac{1}{2}$ convient pour le premier terme. Pour le second, $P(2\mathrm{i}) = (2\mathrm{i} - 1)^{2} = -3 - 4\mathrm{i}$, et 
    $$\operatorname{Re}\Big(-\frac{1}{2}\cdot\frac{\mathrm{e}^{2\mathrm{i} x}}{-3 - 4\mathrm{i}}\Big) = \operatorname{Re}\frac{(3 - 4\mathrm{i})\,\mathrm{e}^{2\mathrm{i} x}}{50} = \frac{3\cos(2x) + 4\sin(2x)}{50}.$$

    $$\boxed{y(x) = (\lambda + \mu x)\,\mathrm{e}^{x} + \frac{1}{2} + \frac{3\cos(2x) + 4\sin(2x)}{50}}$$
     **(b)** On a $P(1 + \mathrm{i}) = 2\mathrm{i} + 1 + \mathrm{i} + 1 = 2 + 3\mathrm{i}$, et $\operatorname{Re}\frac{\mathrm{e}^{(1 + \mathrm{i})x}}{2 + 3\mathrm{i}} = \frac{\mathrm{e}^{x}}{13}(2\cos x + 3\sin x)$. 
    $$\boxed{y(x) = \mathrm{e}^{-x/2}\Big(\lambda\cos\frac{\sqrt{3}\,x}{2} + \mu\sin\frac{\sqrt{3}\,x}{2}\Big) + \frac{\mathrm{e}^{x}}{13}(2\cos x + 3\sin x)}$$
     **(c)** Racines $1$ et $2$. On a $P(2 + 3\mathrm{i}) = -9 + 3\mathrm{i}$, et $\operatorname{Im}\frac{\mathrm{e}^{(2 + 3\mathrm{i})x}}{-9 + 3\mathrm{i}} = \operatorname{Im}\frac{(-9 - 3\mathrm{i})\,\mathrm{e}^{(2 + 3\mathrm{i})x}}{90}$. 
    $$\boxed{y(x) = \lambda\,\mathrm{e}^{x} + \mu\,\mathrm{e}^{2x} - \frac{\mathrm{e}^{2x}}{30}\big(3\sin(3x) + \cos(3x)\big)}$$
     **(d)** Racines $1 \pm 2\mathrm{i}$ : le nombre $1 + 2\mathrm{i}$ est racine simple, avec $P'(1 + 2\mathrm{i}) = 4\mathrm{i}$. La proposition 10 donne la solution $\frac{4}{4\mathrm{i}}\,x\,\mathrm{e}^{(1 + 2\mathrm{i})x} = -\mathrm{i} x\,\mathrm{e}^{x}\big(\cos(2x) + \mathrm{i}\sin(2x)\big)$, de partie réelle $x\,\mathrm{e}^{x}\sin(2x)$. 
    $$\boxed{y(x) = \mathrm{e}^{x}\big(\lambda\cos(2x) + \mu\sin(2x)\big) + x\,\mathrm{e}^{x}\sin(2x)}$$
     **(e)** On linéarise : $\cos^{3} x = \frac{3}{4}\cos x + \frac{1}{4}\cos(3x)$. Le nombre $\mathrm{i}$ est racine simple, avec $P'(\mathrm{i}) = 2\mathrm{i}$ : la partie réelle de $\frac{3}{4}\cdot\frac{x\,\mathrm{e}^{\mathrm{i} x}}{2\mathrm{i}}$ est $\frac{3}{8}\,x\sin x$. Pour le second terme, $P(3\mathrm{i}) = -8$. 
    $$\boxed{y(x) = \lambda\cos x + \mu\sin x + \frac{3}{8}\,x\sin x - \frac{\cos(3x)}{32}}$$
     **(f)** Les racines sont $1$ et $3$, donc $-1$ n'est pas racine ; on a $P(-1) = 8$ et $P'(-1) = -6$. L'équation en $Q$ est $Q'' - 6Q' + 8Q = 2x + 1$, et $Q$ est de degré $1$ : 
    $$Q(x) = \frac{x}{4} + \frac{5}{16}.$$

    $$\boxed{y(x) = \lambda\,\mathrm{e}^{x} + \mu\,\mathrm{e}^{3x} + \Big(\frac{x}{4} + \frac{5}{16}\Big)\mathrm{e}^{-x}}$$
     **(g)** Ici $1$ est racine simple : $P(1) = 0$ et $P'(1) = -2$. L'équation en $Q$ est $Q'' - 2Q' = 2x + 1$ ; $Q'$ doit être de degré $1$, donc $Q$ de degré $2$, et l'on trouve $Q = -\frac{x^{2}}{2} - x$. 
    $$\boxed{y(x) = \lambda\,\mathrm{e}^{x} + \mu\,\mathrm{e}^{3x} - \Big(\frac{x^{2}}{2} + x\Big)\mathrm{e}^{x}}$$
     **(h)** Ici $1$ est racine double : $P(1) = P'(1) = 0$, et l'équation en $Q$ se réduit à $Q'' = x^{2} + 1$. On primitive deux fois. 
    $$\boxed{y(x) = (\lambda + \mu x)\,\mathrm{e}^{x} + \Big(\frac{x^{4}}{12} + \frac{x^{2}}{2}\Big)\mathrm{e}^{x}}$$
     **(i)** Racines $\pm 1$. On traite séparément les trois termes, par le principe de superposition (proposition 9) : $-x$ est solution pour le second membre $x$ ; pour $2\mathrm{e}^{x}$, $1$ est racine simple et $P'(1) = 2$, d'où $x\,\mathrm{e}^{x}$ ; pour $\cos x$, $P(\mathrm{i}) = -2$, d'où $-\frac{\cos x}{2}$. 
    $$\boxed{y(x) = \lambda\,\mathrm{e}^{x} + \mu\,\mathrm{e}^{-x} - x + x\,\mathrm{e}^{x} - \frac{\cos x}{2}}$$
     **(j)** Racines $\pm 2\mathrm{i}$. Pour $\cos(2x)$, $2\mathrm{i}$ est racine simple, $P'(2\mathrm{i}) = 4\mathrm{i}$, et $\operatorname{Re}\frac{x\,\mathrm{e}^{2\mathrm{i} x}}{4\mathrm{i}} = \frac{x\sin(2x)}{4}$ ; pour $\sin x$, $P(\mathrm{i}) = 3$ ; pour $\mathrm{e}^{2x}$, $P(2) = 8$. 
    $$\boxed{y(x) = \lambda\cos(2x) + \mu\sin(2x) + \frac{x\sin(2x)}{4} + \frac{\sin x}{3} + \frac{\mathrm{e}^{2x}}{8}}$$

    *À retenir :* dans (i) et (j), chaque terme du second membre se traite avec sa propre méthode, et un seul d'entre eux est en résonance. L'erreur la plus répandue est de chercher une solution particulière unique de la forme « $\alpha x + \beta\,\mathrm{e}^{x} + \gamma\cos x$ », qui échoue à cause du terme résonant.
- id: "ma-06-40"
  feuille: "f-ma-06"
  numero: 40
  partie: "Équations du second ordre à coefficients constants"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équations du second ordre, équations différentielles, second ordre, problème de Cauchy]
  noeuds: [ed-lineaires, ed-cauchy-lipschitz]
  notions: [equation-differentielle]
  page_enonce: 12
  page_corrige: 32
  enonce: |
    Résoudre les problèmes de Cauchy suivants.

    **(a)** $\begin{cases} y'' + 9y = x + 1 \\ y(0) = 0,\ y'(0) = 0 \end{cases}$

    **(b)** $\begin{cases} y'' - 2y' + y = x \\ y(0) = 0,\ y'(0) = 0 \end{cases}$

    **(c)** $\begin{cases} y'' + y = 3x^{2} \\ y(0) = 1,\ y'(0) = 2 \end{cases}$
  corrige: |
    D'après le théorème 6, chaque problème a une unique solution ; on la cherche parmi les solutions générales.

    **(a)** La fonction $\frac{x + 1}{9}$ est solution particulière, d'où $y = \frac{x + 1}{9} + \lambda\cos(3x) + \mu\sin(3x)$. Les conditions donnent $\frac{1}{9} + \lambda = 0$ et $\frac{1}{9} + 3\mu = 0$. 
    $$\boxed{y(x) = \frac{x + 1 - \cos(3x)}{9} - \frac{\sin(3x)}{27}}$$
     **(b)** La fonction $x + 2$ est solution particulière, d'où $y = x + 2 + (\lambda + \mu x)\,\mathrm{e}^{x}$. Les conditions donnent $2 + \lambda = 0$ et $1 + \lambda + \mu = 0$. 
    $$\boxed{y(x) = x + 2 + (x - 2)\,\mathrm{e}^{x}}$$
     **(c)** La fonction $3x^{2} - 6$ est solution particulière, d'où $y = 3x^{2} - 6 + \lambda\cos x + \mu\sin x$. Les conditions donnent $\lambda - 6 = 1$ et $\mu = 2$. 
    $$\boxed{y(x) = 3x^{2} - 6 + 7\cos x + 2\sin x}$$
- id: "ma-06-41"
  feuille: "f-ma-06"
  numero: 41
  partie: "Équations du second ordre à coefficients constants"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équations du second ordre, primitives trigonométriques, équations différentielles, second ordre]
  noeuds: [ed-lineaires, ex-exponentielle]
  notions: [equation-differentielle, exponentielle]
  page_enonce: 12
  page_corrige: 32
  enonce: |
    **1.** Soit $\alpha$ un réel. Résoudre sur $\mathbb{R}$ l'équation $y'' - (1 + \alpha)\,y' + \alpha y = \mathrm{e}^{(1+\alpha)x}$, en discutant selon $\alpha$.

    **2.** Soit $\omega > 0$ et $\theta \geqslant 0$. Résoudre $y'' + \omega^{2}y = \cos(\theta x)$, en distinguant les cas $\theta \neq \omega$ et $\theta = \omega$. Dans quel cas toutes les solutions sont-elles bornées ?
  corrige: |
    **1.** Le polynôme caractéristique se factorise : $P(r) = (r - 1)(r - \alpha)$. Le nombre $1 + \alpha$ n'est jamais égal à $\alpha$, et il est égal à $1$ si et seulement si $\alpha = 0$. D'où trois cas, les constantes $\lambda$, $\mu$ décrivant $\mathbb{R}$.

    • Si $\alpha \notin \{0, 1\}$, les racines $1$ et $\alpha$ sont distinctes, et $P(1 + \alpha) = \alpha \neq 0$ : 
    $$\boxed{y(x) = \lambda\,\mathrm{e}^{x} + \mu\,\mathrm{e}^{\alpha x} + \frac{\mathrm{e}^{(1 + \alpha)x}}{\alpha}}$$

    • Si $\alpha = 1$, la racine $1$ est double, et $P(2) = 1$ : 
    $$\boxed{y(x) = (\lambda + \mu x)\,\mathrm{e}^{x} + \mathrm{e}^{2x}}$$

    • Si $\alpha = 0$, le second membre est $\mathrm{e}^{x}$, avec $1$ racine simple et $P'(1) = 1$ : 
    $$\boxed{y(x) = \lambda + \mu\,\mathrm{e}^{x} + x\,\mathrm{e}^{x}}$$

    **2.** Les racines sont $\pm\mathrm{i}\omega$, et les solutions homogènes sont les $\lambda\cos(\omega x) + \mu\sin(\omega x)$, toutes bornées. Si $\theta \neq \omega$, alors $\mathrm{i}\theta$ n'est pas racine et $P(\mathrm{i}\theta) = \omega^{2} - \theta^{2}$ : 
    $$\boxed{\theta \neq \omega : \quad y(x) = \lambda\cos(\omega x) + \mu\sin(\omega x) + \frac{\cos(\theta x)}{\omega^{2} - \theta^{2}}}$$
     Si $\theta = \omega$, alors $\mathrm{i}\omega$ est racine simple, $P'(\mathrm{i}\omega) = 2\mathrm{i}\omega$, et $\operatorname{Re}\frac{x\,\mathrm{e}^{\mathrm{i}\omega x}}{2\mathrm{i}\omega} = \frac{x\sin(\omega x)}{2\omega}$ : 
    $$\boxed{\theta = \omega : \quad y(x) = \lambda\cos(\omega x) + \mu\sin(\omega x) + \frac{x\sin(\omega x)}{2\omega}}$$
     Dans ce second cas, aucune solution n'est bornée : aux points $x_{k} = \frac{(4k + 1)\pi}{2\omega}$, la solution vaut $\mu + \frac{x_{k}}{2\omega}$, qui tend vers $+\infty$ avec $k$. 
    $$\boxed{\text{toutes les solutions sont bornées si et seulement si } \theta \neq \omega}$$
     C'est la résonance du cours : une excitation à la pulsation propre de l'oscillateur produit des oscillations d'amplitude non bornée.
- id: "ma-06-42"
  feuille: "f-ma-06"
  numero: 42
  partie: "Équations du second ordre à coefficients constants"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [équations du second ordre, équations différentielles, second ordre]
  noeuds: [ed-lineaires]
  notions: [equation-differentielle]
  page_enonce: 12
  page_corrige: 33
  enonce: |
    Soit $a$, $b$ deux réels.

    **1.** Déterminer à quelle condition sur $(a, b)$ toutes les solutions réelles de $y'' + ay' + by = 0$ sont bornées sur $[0\,,+\infty[$. On discutera selon le signe du discriminant.

    **2.** Même question pour des solutions bornées sur $\mathbb{R}$.

    **3.** Lorsque $a > 0$ et $b > 0$, montrer que toutes les solutions tendent vers $0$ en $+\infty$. Interpréter physiquement pour l'oscillateur amorti du cours.
  corrige: |
    On utilise trois faits, tirés des croissances comparées du chapitre 5 : pour $r$ réel, $x \mapsto \mathrm{e}^{rx}$ est bornée sur $[0\,,+\infty[$ si et seulement si $r \leqslant 0$ ; $x \mapsto x\,\mathrm{e}^{rx}$ l'est si et seulement si $r < 0$ ; et $x \mapsto \mathrm{e}^{\alpha x}\cos(\beta x)$, avec $\beta \neq 0$, l'est si et seulement si $\alpha \leqslant 0$, comme on le voit aux points $x = \frac{2k\pi}{\beta}$.

    **1.** On note $\Delta = a^{2} - 4b$, et l'on prend successivement chaque fonction de base, en annulant l'autre constante.

    • Si $\Delta > 0$, les racines réelles $r_{1}$ et $r_{2}$ doivent être négatives ; comme $r_{1} + r_{2} = -a$ et $r_{1}r_{2} = b$, cela équivaut à $a \geqslant 0$ et $b \geqslant 0$.

    • Si $\Delta = 0$, la racine double $-\frac{a}{2}$ doit être strictement négative, à cause du terme $x\,\mathrm{e}^{r_{0}x}$ : $a > 0$.

    • Si $\Delta < 0$, la partie réelle $-\frac{a}{2}$ des racines doit être négative : $a \geqslant 0$, et alors $b > \frac{a^{2}}{4} \geqslant 0$.

    Les trois cas se résument en une seule condition, le point $(0, 0)$ étant exclu par le deuxième cas, puisque $y'' = 0$ a pour solution $x \mapsto x$. 
    $$\boxed{a \geqslant 0, \quad b \geqslant 0, \quad (a, b) \neq (0, 0)}$$
     **2.** Une fonction $x \mapsto \mathrm{e}^{rx}$, avec $r$ réel, n'est bornée sur $\mathbb{R}$ que si $r = 0$. Si $\Delta > 0$, les deux racines distinctes ne peuvent être nulles toutes les deux ; si $\Delta = 0$, la fonction $x \mapsto x\,\mathrm{e}^{r_{0}x}$ n'est jamais bornée sur $\mathbb{R}$ ; si $\Delta < 0$, il faut et il suffit que la partie réelle $-\frac{a}{2}$ soit nulle. 
    $$\boxed{a = 0 \text{ et } b > 0}$$
     Les solutions sont alors les oscillations $\lambda\cos(\sqrt{b}\,x) + \mu\sin(\sqrt{b}\,x)$.

    **3.** Si $a > 0$ et $b > 0$ : lorsque $\Delta > 0$, les racines ont un produit positif et une somme négative, donc sont strictement négatives ; lorsque $\Delta = 0$, la racine double $-\frac{a}{2}$ est strictement négative, et $x\,\mathrm{e}^{r_{0}x}$ tend vers $0$ par croissances comparées ; lorsque $\Delta < 0$, on a $|y(x)| \leqslant (|\lambda| + |\mu|)\,\mathrm{e}^{-ax/2}$. 
    $$\boxed{\text{toute solution tend vers } 0 \text{ en } +\infty}$$
     Pour l'oscillateur amorti $y'' + 2\xi y' + y = 0$ du cours, on a $a = 2\xi > 0$ et $b = 1 > 0$ : quel que soit le régime, pseudo-périodique, critique ou apériodique, le système revient à sa position d'équilibre.

    ![Figure](documents/figures/06737c5dadc158b9.svg)

    Le quart de plan bleuté, bords compris mais origine exclue, rassemble les couples $(a, b)$ pour lesquels toutes les solutions sont bornées sur $[0\,,+\infty[$ ; seule la demi-droite $a = 0$, $b > 0$, en carmin, donne des solutions bornées sur $\mathbb{R}$. La parabole $b = \frac{a^{2}}{4}$ sépare les régimes oscillant, au-dessus, et non oscillant, au-dessous.
- id: "ma-06-43"
  feuille: "f-ma-06"
  numero: 43
  partie: "Équations du second ordre à coefficients constants"
  etoiles: 3
  types: [Calcul]
  mots_cles: [équations du second ordre, primitives trigonométriques, équations différentielles, second ordre]
  noeuds: [ed-lineaires, cx-exponentielle]
  notions: [equation-differentielle]
  page_enonce: 12
  page_corrige: 34
  enonce: |
    *Changements de variable.* On résout des équations à coefficients non constants en se ramenant au cas constant.

    **1.** Sur $]0\,,+\infty[$, on considère $(E_{1}) : x^{2}y'' - 3xy' + 4y = 0$. Pour $y$ deux fois dérivable sur $]0\,,+\infty[$, on pose $z(t) = y(\mathrm{e}^{t})$ pour $t \in \mathbb{R}$. Montrer que $y$ est solution de $(E_{1})$ si et seulement si $z'' - 4z' + 4z = 0$, puis résoudre $(E_{1})$.

    **2.** Résoudre de même $x^{2}y'' + 3xy' + y = (x + 1)^{2}$ sur $]0\,,+\infty[$.

    **3.** Sur $]-1\,,1[$, résoudre $(1 - x^{2})\,y'' - xy' + y = 0$ en posant $x = \sin t$, avec $t \in \big]-\frac{\pi}{2}\,,\frac{\pi}{2}\big[$.
  corrige: |
    **1.** La fonction $t \mapsto \mathrm{e}^{t}$ est une bijection de $\mathbb{R}$ sur $]0\,,+\infty[$, de réciproque $\ln$ ; ainsi $y$ est deux fois dérivable sur $]0\,,+\infty[$ si et seulement si $z = y \circ \exp$ l'est sur $\mathbb{R}$. En dérivant la composée : 
    $$z'(t) = \mathrm{e}^{t}\,y'(\mathrm{e}^{t}), \qquad z''(t) = \mathrm{e}^{t}\,y'(\mathrm{e}^{t}) + \mathrm{e}^{2t}\,y''(\mathrm{e}^{t}).$$
     Avec $x = \mathrm{e}^{t}$, on obtient $x\,y'(x) = z'(t)$ et $x^{2}y''(x) = z''(t) - z'(t)$, d'où 
    $$x^{2}y''(x) - 3x\,y'(x) + 4y(x) = z''(t) - 4z'(t) + 4z(t).$$
     Comme $x$ décrit $]0\,,+\infty[$ quand $t$ décrit $\mathbb{R}$, $y$ est solution de $(E_{1})$ si et seulement si $z'' - 4z' + 4z = 0$. Cette équation a la racine double $2$ : $z(t) = (\lambda + \mu t)\,\mathrm{e}^{2t}$, et l'on revient à $y(x) = z(\ln x)$. 
    $$\boxed{y(x) = (\lambda + \mu\ln x)\,x^{2}, \quad (\lambda, \mu) \in \mathbb{R}^{2}}$$
     **2.** Le même calcul transforme l'équation en $z'' - z' + 3z' + z = (\mathrm{e}^{t} + 1)^{2}$, soit 
    $$z'' + 2z' + z = \mathrm{e}^{2t} + 2\mathrm{e}^{t} + 1.$$
     La racine caractéristique est $-1$, double ; on superpose les solutions particulières $\frac{\mathrm{e}^{2t}}{9}$, $\frac{2\mathrm{e}^{t}}{4}$ et $1$, puis l'on revient à $x$. 
    $$\boxed{y(x) = \frac{\lambda + \mu\ln x}{x} + \frac{x^{2}}{9} + \frac{x}{2} + 1, \quad (\lambda, \mu) \in \mathbb{R}^{2}}$$
     **3.** La fonction $\sin$ est une bijection de $\big]-\frac{\pi}{2}\,,\frac{\pi}{2}\big[$ sur $]-1\,,1[$, de réciproque $\operatorname{Arcsin}$, dérivable (chapitre 5). Avec $z(t) = y(\sin t)$, on a 
    $$z'(t) = \cos t\;y'(\sin t), \qquad z''(t) = -\sin t\;y'(\sin t) + \cos^{2} t\;y''(\sin t),$$
     et, avec $x = \sin t$, $(1 - x^{2})\,y'' - x\,y' + y = z'' + z$. Donc $y$ est solution si et seulement si $z = \lambda\cos t + \mu\sin t$, et $\cos t = \sqrt{1 - x^{2}}$ puisque $\cos t > 0$. 
    $$\boxed{y(x) = \lambda\sqrt{1 - x^{2}} + \mu x, \quad (\lambda, \mu) \in \mathbb{R}^{2}}$$
- id: "ma-06-44"
  feuille: "f-ma-06"
  numero: 44
  partie: "Équations du second ordre à coefficients constants"
  etoiles: 3
  types: [Calcul]
  mots_cles: [équations du second ordre, équations différentielles, second ordre]
  noeuds: [ed-lineaires]
  notions: [equation-differentielle]
  page_enonce: 12
  page_corrige: 34
  enonce: |
    *Changements de fonction inconnue.* Résoudre les équations suivantes sur l'intervalle indiqué, à l'aide de la fonction auxiliaire proposée.

    **(a)** $(1 + x^{2})\,y'' + 2xy' = 0$ sur $\mathbb{R}$, avec $u = (1 + x^{2})\,y'$.

    **(b)** $(1 + \mathrm{e}^{x})\,y'' + y' - \mathrm{e}^{x}y = 0$ sur $\mathbb{R}$, avec $z = y' + y$.

    **(c)** $y'' + 4xy' + (3 + 4x^{2})\,y = 0$ sur $\mathbb{R}$, avec $z = \mathrm{e}^{x^{2}}y$.

    **(d)** $xy'' + 2(x + 1)\,y' + (x + 2)\,y = 0$ sur $]0\,,+\infty[$, avec $z = xy$.
  corrige: |
    **(a)** On a $u' = 2x\,y' + (1 + x^{2})\,y''$ : l'équation s'écrit $u' = 0$, donc $u$ est une constante $C$, et $y' = \frac{C}{1 + x^{2}}$. 
    $$\boxed{y(x) = C\operatorname{Arctan} x + D, \quad (C, D) \in \mathbb{R}^{2}}$$
     **(b)** On a $z' = y'' + y'$, et l'on regroupe les termes de l'équation : 
    $$(1 + \mathrm{e}^{x})\,y'' + y' - \mathrm{e}^{x}y = (1 + \mathrm{e}^{x})(y'' + y') - \mathrm{e}^{x}(y' + y) = (1 + \mathrm{e}^{x})\,z' - \mathrm{e}^{x}z.$$
     L'équation équivaut donc à $z' = \frac{\mathrm{e}^{x}}{1 + \mathrm{e}^{x}}\,z$, d'où $z = C(1 + \mathrm{e}^{x})$. Il reste à résoudre $y' + y = C + C\,\mathrm{e}^{x}$, dont une solution particulière est $C + \frac{C}{2}\mathrm{e}^{x}$. 
    $$\boxed{y(x) = C\Big(1 + \frac{\mathrm{e}^{x}}{2}\Big) + D\,\mathrm{e}^{-x}, \quad (C, D) \in \mathbb{R}^{2}}$$
     **(c)** On écrit $y = z\,\mathrm{e}^{-x^{2}}$ ; alors $y' = (z' - 2xz)\,\mathrm{e}^{-x^{2}}$ et $y'' = \big(z'' - 4xz' + (4x^{2} - 2)\,z\big)\,\mathrm{e}^{-x^{2}}$. En reportant, les termes en $z'$ et en $x^{2}z$ se compensent : 
    $$y'' + 4x\,y' + (3 + 4x^{2})\,y = (z'' + z)\,\mathrm{e}^{-x^{2}}.$$

    $$\boxed{y(x) = \mathrm{e}^{-x^{2}}(\lambda\cos x + \mu\sin x), \quad (\lambda, \mu) \in \mathbb{R}^{2}}$$
     **(d)** On a $z' = y + x\,y'$ et $z'' = 2y' + x\,y''$ ; l'équation s'écrit $(x\,y'' + 2y') + 2(x\,y' + y) + x\,y = z'' + 2z' + z = 0$. La racine $-1$ est double, donc $z = (\lambda + \mu x)\,\mathrm{e}^{-x}$. 
    $$\boxed{y(x) = \Big(\frac{\lambda}{x} + \mu\Big)\mathrm{e}^{-x}, \quad (\lambda, \mu) \in \mathbb{R}^{2}}$$
- id: "ma-06-45"
  feuille: "f-ma-06"
  numero: 45
  partie: "Équations du second ordre à coefficients constants"
  etoiles: 3
  types: [Calcul]
  mots_cles: [équations du second ordre, primitives trigonométriques, équations différentielles, second ordre]
  noeuds: [ed-lineaires]
  notions: [equation-differentielle]
  page_enonce: 13
  page_corrige: 35
  enonce: |
    *Variation des constantes au second ordre.* On veut résoudre $(E) : y'' + y = \dfrac{1}{\cos x}$ sur $I = \big]-\frac{\pi}{2}\,,\frac{\pi}{2}\big[$.

    **1.** Soit $\lambda$, $\mu : I \to \mathbb{R}$ dérivables telles que $\lambda'\cos x + \mu'\sin x = 0$ sur $I$, et $y = \lambda\cos x + \mu\sin x$. Montrer que $y' = -\lambda\sin x + \mu\cos x$, puis que $y$ est solution de $(E)$ si et seulement si 
    $$-\lambda'\sin x + \mu'\cos x = \frac{1}{\cos x}.$$

    **2.** Résoudre le système formé par ces deux conditions, d'inconnues $\lambda'$ et $\mu'$, et en déduire une solution particulière de $(E)$.

    **3.** Résoudre $(E)$, puis, par la même méthode, $y'' + y = \tan x$ sur $I$.
  corrige: |
    **1.** En dérivant $y = \lambda\cos x + \mu\sin x$ et en utilisant l'hypothèse $\lambda'\cos x + \mu'\sin x = 0$ : 
    $$y' = \underbrace{\lambda'\cos x + \mu'\sin x}_{= 0} - \lambda\sin x + \mu\cos x = -\lambda\sin x + \mu\cos x.$$
     On dérive encore, ce qui suppose $\lambda$ et $\mu$ dérivables : $y'' = -\lambda'\sin x + \mu'\cos x - \lambda\cos x - \mu\sin x$, d'où $y'' + y = -\lambda'\sin x + \mu'\cos x$. 
    $$\boxed{y \text{ est solution de } (E) \iff -\lambda'\sin x + \mu'\cos x = \frac{1}{\cos x}}$$
     **2.** On multiplie la première équation par $\cos x$ et la seconde par $-\sin x$, puis on ajoute ; et de même avec $\sin x$ et $\cos x$. Comme $\cos^{2} + \sin^{2} = 1$, on obtient 
    $$\lambda' = -\frac{\sin x}{\cos x}, \qquad \mu' = 1, \qquad\text{d'où}\qquad \lambda = \ln(\cos x), \quad \mu = x.$$

    $$\boxed{y_{p}(x) = \cos x\,\ln(\cos x) + x\sin x}$$
     **3.** D'après la proposition 9, les solutions de $(E)$ sur $I$ sont : 
    $$\boxed{y(x) = \cos x\,\ln(\cos x) + x\sin x + A\cos x + B\sin x, \quad (A, B) \in \mathbb{R}^{2}}$$
     Pour le second membre $\tan x$, le même système donne $\lambda' = -\sin x\tan x = \cos x - \frac{1}{\cos x}$ et $\mu' = \sin x$. Une primitive de $\frac{1}{\cos x}$ sur $I$ s'obtient par la règle de Bioche de l'exercice 22, avec $u = \sin x$ : c'est $\frac{1}{2}\ln\frac{1 + \sin x}{1 - \sin x}$. Ainsi $\lambda = \sin x - \frac{1}{2}\ln\frac{1 + \sin x}{1 - \sin x}$ et $\mu = -\cos x$, et les termes $\sin x\cos x$ se compensent dans $\lambda\cos x + \mu\sin x$. 
    $$\boxed{y(x) = -\frac{\cos x}{2}\ln\frac{1 + \sin x}{1 - \sin x} + A\cos x + B\sin x, \quad (A, B) \in \mathbb{R}^{2}}$$

    *À retenir :* la condition $\lambda'\cos x + \mu'\sin x = 0$ est un choix, qui rend $y'$ aussi simple que si $\lambda$ et $\mu$ étaient constantes ; elle transforme une équation en deux inconnues en un système, et la méthode s'applique à tout second membre continu, là où la proposition 10 ne traite que les exponentielles.
- id: "ma-06-46"
  feuille: "f-ma-06"
  numero: 46
  partie: "Équations du second ordre à coefficients constants"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [équations du second ordre, équations différentielles, second ordre]
  noeuds: [ed-lineaires]
  notions: [equation-differentielle]
  page_enonce: 13
  page_corrige: 35
  enonce: |
    *Systèmes différentiels.*

    **1.** Déterminer les couples $(y, z)$ de fonctions dérivables sur $\mathbb{R}$ telles que $y' - y = z$ et $z' + z = 3y$. On commencera par montrer que $y$ est deux fois dérivable et vérifie une équation du second ordre.

    **2.** Une particule chargée se déplace dans un champ magnétique uniforme ; ses coordonnées vérifient $x'' = \omega\,y'$, $y'' = -\omega\,x'$ et $z'' = 0$, avec $\omega > 0$. En posant $u = x' + \mathrm{i} y'$, montrer que $u' = -\mathrm{i}\omega u$, puis déterminer $x$, $y$ et $z$ en fonction des conditions initiales. Montrer que la trajectoire est une hélice, ou un cercle si $z'(0) = 0$.
  corrige: |
    **1.** La première relation donne $y' = y + z$, qui est dérivable : $y$ est deux fois dérivable, et 
    $$y'' = y' + z' = y' + 3y - z = y' + 3y - (y' - y) = 4y.$$
     D'où $y = \lambda\,\mathrm{e}^{2x} + \mu\,\mathrm{e}^{-2x}$, puis $z = y' - y = \lambda\,\mathrm{e}^{2x} - 3\mu\,\mathrm{e}^{-2x}$. Réciproquement, on vérifie que 
    $$z' + z = 3\lambda\,\mathrm{e}^{2x} + 3\mu\,\mathrm{e}^{-2x} = 3y.$$

    $$\boxed{(y, z) = \big(\lambda\,\mathrm{e}^{2x} + \mu\,\mathrm{e}^{-2x},\ \lambda\,\mathrm{e}^{2x} - 3\mu\,\mathrm{e}^{-2x}\big), \quad (\lambda, \mu) \in \mathbb{R}^{2}}$$
     **2.** En dérivant $u = x' + \mathrm{i} y'$ : 
    $$u' = x'' + \mathrm{i} y'' = \omega y' - \mathrm{i}\omega x' = -\mathrm{i}\omega(x' + \mathrm{i} y') = -\mathrm{i}\omega u.$$
     D'après le théorème 2, $u(t) = u_{0}\,\mathrm{e}^{-\mathrm{i}\omega t}$, avec $u_{0} = x'(0) + \mathrm{i} y'(0)$. En primitivant, avec $w = x + \mathrm{i} y$ et $w_{0} = w(0)$ : 
    $$w(t) = w_{0} + \frac{u_{0}}{-\mathrm{i}\omega}\big(\mathrm{e}^{-\mathrm{i}\omega t} - 1\big) = c + \frac{\mathrm{i} u_{0}}{\omega}\,\mathrm{e}^{-\mathrm{i}\omega t}, \qquad c = w_{0} - \frac{\mathrm{i} u_{0}}{\omega}.$$
     Enfin $z'' = 0$ donne $z(t) = z(0) + z'(0)\,t$. 
    $$\boxed{x(t) + \mathrm{i} y(t) = c + \frac{\mathrm{i} u_{0}}{\omega}\,\mathrm{e}^{-\mathrm{i}\omega t}, \qquad z(t) = z(0) + z'(0)\,t}$$
     Si $u_{0} \neq 0$, le point $(x, y)$ parcourt à vitesse angulaire constante $\omega$ le cercle de centre $c$ et de rayon $\frac{|u_{0}|}{\omega}$, pendant que $z$ varie linéairement : la trajectoire est une hélice d'axe vertical, de pas $\frac{2\pi z'(0)}{\omega}$, et un cercle si $z'(0) = 0$. Si $u_{0} = 0$, la particule se déplace en ligne droite le long du champ.
- id: "ma-06-47"
  feuille: "f-ma-06"
  numero: 47
  partie: "Équations du second ordre à coefficients constants"
  etoiles: 3
  types: [Calcul]
  mots_cles: [équations du second ordre, primitives trigonométriques, équations différentielles, second ordre]
  noeuds: [ed-lineaires, cx-exponentielle]
  notions: [equation-differentielle, derivee-successive]
  page_enonce: 13
  page_corrige: 36
  enonce: |
    **1.** Déterminer les fonctions à valeurs complexes solutions sur $\mathbb{R}$ de $y''' = y$. On pourra, pour une solution $f$, étudier $g = f + f' + f''$.

    **2.** Soit $f : \mathbb{R} \to \mathbb{R}$ deux fois dérivable telle que $f'' + f \geqslant 0$. Pour $x$ fixé, dériver la fonction 
    $$t \longmapsto f'(t)\sin(t - x) - f(t)\cos(t - x),$$
     et en déduire que $f(x) + f(x + \pi) \geqslant 0$ pour tout réel $x$.
  corrige: |
    **1.** Soit $f$ une solution, trois fois dérivable. La fonction $g = f + f' + f''$ vérifie 
    $$g' = f' + f'' + f''' = f' + f'' + f = g,$$
     donc $g = C\,\mathrm{e}^{x}$, avec $C \in \mathbb{C}$. Ainsi $f$ est solution de $f'' + f' + f = C\,\mathrm{e}^{x}$, dont les racines caractéristiques sont $j$ et $j^{2} = \overline{j}$, et une solution particulière est $\frac{C}{3}\,\mathrm{e}^{x}$, puisque $P(1) = 3$. Réciproquement, $x \mapsto \mathrm{e}^{rx}$ est solution dès que $r^{3} = 1$, et c'est le cas pour $1$, $j$ et $j^{2}$. 
    $$\boxed{f(x) = \alpha\,\mathrm{e}^{x} + \beta\,\mathrm{e}^{jx} + \gamma\,\mathrm{e}^{j^{2}x}, \quad (\alpha, \beta, \gamma) \in \mathbb{C}^{3}}$$
     On retrouve les trois racines cubiques de l'unité : l'équation caractéristique d'une équation d'ordre $3$ est de degré $3$.

    **2.** Posons $\varphi(t) = f'(t)\sin(t - x) - f(t)\cos(t - x)$. En dérivant, les termes en $f'(t)\cos(t - x)$ se compensent : 
    $$\varphi'(t) = f''(t)\sin(t - x) + f(t)\sin(t - x) = \big(f''(t) + f(t)\big)\sin(t - x).$$
     Sur $[x\,,x + \pi]$, on a $\sin(t - x) \geqslant 0$, donc $\varphi' \geqslant 0$ et $\varphi(x + \pi) \geqslant \varphi(x)$. Or $\varphi(x) = -f(x)$ et $\varphi(x + \pi) = -f(x + \pi)\cos\pi = f(x + \pi)$. 
    $$\boxed{f(x) + f(x + \pi) \geqslant 0 \text{ pour tout réel } x}$$
     Par exemple, pour $f = \sin$, on a $f'' + f = 0$ et $\sin x + \sin(x + \pi) = 0$ : l'inégalité est une égalité.
- id: "ma-06-48"
  feuille: "f-ma-06"
  numero: 48
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [primitives, intégrales, primitives trigonométriques, équations différentielles, second ordre, problème de Cauchy]
  noeuds: [ar-tfa, ri-proprietes, ex-exponentielle, ed-lineaires, ed-cauchy-lipschitz]
  notions: [riemann-integrable, equation-differentielle, exponentielle]
  page_enonce: 13
  page_corrige: 36
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par une démonstration ou un contre-exemple.

    **1.** Toute fonction continue sur $\mathbb{R}$ admet une primitive sur $\mathbb{R}$.

    **2.** Si $F$ et $G$ sont deux primitives d'une même fonction sur $\mathbb{R}^{*}$, alors $F - G$ est constante.

    **3.** Si $f$ est continue et positive sur $[a\,,b]$, avec $a < b$, et si $\displaystyle\int_{a}^{b} f = 0$, alors $f$ est nulle.

    **4.** $\displaystyle\int_{-1}^{1} \frac{\mathrm{d} x}{x^{2}} = -2$.

    **5.** $\displaystyle\int_{0}^{2\pi} |\sin t|\,\mathrm{d} t = 4$.

    **6.** La fonction $x \mapsto \displaystyle\int_{0}^{x^{2}} \mathrm{e}^{-t^{2}}\,\mathrm{d} t$ a pour dérivée $x \mapsto \mathrm{e}^{-x^{4}}$.

    **7.** Une solution de $y' + y = 0$ sur $\mathbb{R}$ qui s'annule en un point est la fonction nulle.

    **8.** L'équation $y'' + y = 0$ admet une solution non nulle telle que $y(0) = y(\pi) = 0$.

    **9.** Toutes les solutions de $y'' + y = \cos x$ sont bornées sur $\mathbb{R}$.

    **10.** Si $y_{1}$ est solution de $y' + a(x)y = b_{1}(x)$ et $y_{2}$ de $y' + a(x)y = b_{2}(x)$, alors $y_{1} + y_{2}$ est solution de $y' + a(x)y = b_{1}(x) + b_{2}(x)$.
  corrige: |
    **1.** **Vraie**. C'est le théorème 1 du cours, appliqué à l'intervalle $\mathbb{R}$.

    **2.** **Fausse**. L'ensemble $\mathbb{R}^{*}$ n'est pas un intervalle : la fonction égale à $\ln|x|$ sur $]-\infty\,,0[$ et à $\ln x + 1$ sur $]0\,,+\infty[$ est une primitive de $x \mapsto \frac{1}{x}$, et sa différence avec $\ln|\cdot|$ n'est pas constante (exercice 3).

    **3.** **Vraie**. C'est l'exercice 5, question 1 : la primitive nulle en $a$ est croissante, nulle en $a$ et en $b$, donc nulle, et sa dérivée $f$ aussi.

    **4.** **Fausse**. La fonction $x \mapsto \frac{1}{x^{2}}$ n'est pas continue sur $[-1\,,1]$ : l'intégrale n'est pas définie, et le calcul formel donne un nombre négatif pour une fonction positive (exercice 3).

    **5.** **Vraie**. La fonction $|\sin|$ est $\pi$-périodique, d'où $\int_{0}^{2\pi} |\sin t|\,\mathrm{d} t = 2\int_{0}^{\pi} \sin t\,\mathrm{d} t = 2 \times 2 = 4$.

    **6.** **Fausse**. Si $G$ est une primitive de $t \mapsto \mathrm{e}^{-t^{2}}$, la fonction vaut $G(x^{2}) - G(0)$, de dérivée $2x\,\mathrm{e}^{-x^{4}}$ (exercice 4).

    **7.** **Vraie**. Les solutions sont les $\lambda\,\mathrm{e}^{-x}$, et $\lambda\,\mathrm{e}^{-x_{0}} = 0$ impose $\lambda = 0$ (remarque du cours après le théorème 2).

    **8.** **Vraie**. La fonction $\sin$ est solution, non nulle, et s'annule en $0$ et en $\pi$ : un problème avec deux conditions en deux points distincts n'est pas un problème de Cauchy, et l'unicité n'a pas à s'appliquer.

    **9.** **Fausse**. La solution particulière $x \mapsto \frac{x\sin x}{2}$ n'est pas bornée, et les solutions homogènes le sont : aucune solution n'est bornée (exercice 41).

    **10.** **Vraie**. C'est le principe de superposition (proposition 7).
- id: "ma-06-49"
  feuille: "f-ma-06"
  numero: 49
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [intégrales]
  noeuds: [ri-proprietes]
  notions: [riemann-integrable]
  page_enonce: 14
  page_corrige: 37
  enonce: |
    *Une inégalité optimale.* Soit $f : [0\,,1] \to \mathbb{R}$ continue telle que $\displaystyle\int_{0}^{1} f = 0$, et $\alpha$, $\beta$ deux réels tels que $\alpha \leqslant f(x) \leqslant \beta$ pour tout $x \in [0\,,1]$.

    **1.** Montrer que $\alpha \leqslant 0 \leqslant \beta$. En étudiant le signe de $\big(\beta - f(x)\big)\big(f(x) - \alpha\big)$, montrer que 
    $$\int_{0}^{1} f^{2} \leqslant -\alpha\beta.$$

    **2.** On prend $\alpha = -1$ et $\beta = 1$. Pour $h \in \big]0\,,\frac{1}{2}\big]$, on note $f_{h}$ la fonction qui vaut $1$ sur $\big[0\,,\frac{1}{2} - h\big]$, $\frac{1}{h}\big(\frac{1}{2} - x\big)$ sur $\big[\frac{1}{2} - h\,,\frac{1}{2} + h\big]$ et $-1$ sur $\big[\frac{1}{2} + h\,,1\big]$. Vérifier que $f_{h}$ satisfait les hypothèses de l'énoncé, et calculer $\displaystyle\int_{0}^{1} f_{h}^{2}$. Dans ce cas, la constante $-\alpha\beta$ de la question 1 peut-elle être remplacée par une constante plus petite ?

    **3.** Soit $g : [0\,,1] \to [0\,,1]$ continue, et $m = \displaystyle\int_{0}^{1} g$. Montrer que 
    $$\int_{0}^{1} (g - m)^{2} \leqslant m(1 - m) \leqslant \frac{1}{4}.$$
  corrige: |
    **1.** On intègre l'encadrement $\alpha \leqslant f \leqslant \beta$ sur $[0\,,1]$, segment de longueur $1$ : la croissance de l'intégrale (proposition 2 (iii)) donne $\alpha \leqslant \int_{0}^{1} f \leqslant \beta$, c'est-à-dire 
    $$\boxed{\alpha \leqslant 0 \leqslant \beta}.$$
     Pour tout $x \in [0\,,1]$, les deux facteurs $\beta - f(x)$ et $f(x) - \alpha$ sont positifs, donc leur produit aussi. En développant, on obtient une fonction continue et positive : 
    $$\big(\beta - f\big)\big(f - \alpha\big) = (\alpha + \beta)\,f - f^{2} - \alpha\beta \geqslant 0.$$
     Son intégrale est donc positive ; comme $\int_{0}^{1} f = 0$, elle vaut $-\int_{0}^{1} f^{2} - \alpha\beta$, d'où 
    $$\boxed{\int_{0}^{1} f^{2} \leqslant -\alpha\beta}.$$
     L'hypothèse $\int_{0}^{1} f = 0$ sert exactement à faire disparaître le terme $(\alpha + \beta)\,f$, sur lequel on n'aurait aucun contrôle.

    **2.** Les trois expressions se raccordent : en $\frac{1}{2} - h$, la formule du milieu vaut $\frac{1}{h}\cdot h = 1$, et en $\frac{1}{2} + h$, elle vaut $-1$ ; la fonction $f_{h}$ est donc continue. Sur le segment du milieu, $\big|\frac{1}{2} - x\big| \leqslant h$, donc $f_{h}$ est à valeurs dans $[-1\,,1]$. Les deux paliers, de même longueur $\frac{1}{2} - h$, ont des intégrales opposées, et il reste 
    $$\int_{0}^{1} f_{h} = \frac{1}{h}\Big[-\frac{1}{2}\Big(\frac{1}{2} - x\Big)^{2}\Big]_{1/2-h}^{1/2+h} = \frac{1}{h}\Big(-\frac{h^{2}}{2} + \frac{h^{2}}{2}\Big) = 0.$$
     Pour le carré, les deux paliers donnent chacun $\frac{1}{2} - h$, et le segment du milieu 
    $$\frac{1}{h^{2}}\Big[-\frac{1}{3}\Big(\frac{1}{2} - x\Big)^{3}\Big]_{1/2-h}^{1/2+h} = \frac{1}{h^{2}}\Big(\frac{h^{3}}{3} + \frac{h^{3}}{3}\Big) = \frac{2h}{3}.$$

    $$\boxed{\int_{0}^{1} f_{h}^{2} = 1 - 2h + \frac{2h}{3} = 1 - \frac{4h}{3}}$$
     Supposons qu'un réel $c < 1$ vérifie $\int_{0}^{1} f^{2} \leqslant c$ pour toute fonction $f$ satisfaisant les hypothèses avec $\alpha = -1$ et $\beta = 1$. Le choix $h = \min\big(\frac{1}{2}, \frac{3(1 - c)}{8}\big)$ donne $\frac{4h}{3} \leqslant \frac{1 - c}{2}$, donc 
    $$\int_{0}^{1} f_{h}^{2} \geqslant 1 - \frac{1 - c}{2} = \frac{1 + c}{2} > c,$$
     ce qui est contradictoire. 
    $$\boxed{\text{non : la constante } -\alpha\beta = 1 \text{ ne peut pas être diminuée}}$$
     La borne n'est pourtant jamais atteinte : l'égalité imposerait, d'après l'exercice 5, que $(1 - f)(f + 1)$ soit nulle, donc que $f$ ne prenne que les valeurs $1$ et $-1$ ; le théorème des valeurs intermédiaires du chapitre 8 montrera qu'une fonction continue sur un segment ne peut pas sauter ainsi d'une valeur à l'autre, et $f$ serait constante, ce qui est incompatible avec $\int_{0}^{1} f = 0$. Les fonctions $f_{h}$ approchent cette situation idéale en passant de $1$ à $-1$ de plus en plus vite.

    **3.** La fonction $f = g - m$ est continue, d'intégrale $m - m = 0$, et vérifie $-m \leqslant f \leqslant 1 - m$, puisque $0 \leqslant g \leqslant 1$. La question 1, avec $\alpha = -m$ et $\beta = 1 - m$, donne $\int_{0}^{1} (g - m)^{2} \leqslant m(1 - m)$, et la forme canonique $m(1 - m) = \frac{1}{4} - \big(m - \frac{1}{2}\big)^{2}$ donne la seconde inégalité. 
    $$\boxed{\int_{0}^{1} (g - m)^{2} \leqslant m(1 - m) \leqslant \frac{1}{4}}$$
     L'intégrale $\int_{0}^{1} (g - m)^{2}$ mesure la dispersion des valeurs de $g$ autour de leur moyenne $m$ : pour une fonction à valeurs dans $[0\,,1]$, elle ne dépasse jamais $\frac{1}{4}$, et elle n'approche cette valeur que si $m$ est proche de $\frac{1}{2}$ et si $g$ passe presque tout son temps près de $0$ et de $1$, comme à la question 2. Le chapitre 21 retrouvera la même borne pour la variance d'une variable aléatoire à valeurs dans $[0\,,1]$.

    *À retenir :* pour exploiter un encadrement $\alpha \leqslant f \leqslant \beta$, on intègre le produit $(\beta - f)(f - \alpha)$, positif, qui fait apparaître $f^{2}$ ; c'est l'inégalité ponctuelle, et non une majoration grossière de $f^{2}$ par $\max(\alpha^{2}, \beta^{2})$, qui donne la constante optimale.
