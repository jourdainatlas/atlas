  page_enonce: 14
  page_corrige: 38
  enonce: |
    *Équations intégrales.* Déterminer les fonctions $f : \mathbb{R} \to \mathbb{R}$ continues vérifiant, pour tout réel $x$ :

    **(a)** $f(x) = 1 + \displaystyle\int_{0}^{x} t\,f(t)\,\mathrm{d} t$ ;

    **(b)** $f(x) = \sin x + \displaystyle\int_{0}^{x} f(t)\,\mathrm{d} t$ ;

    **(c)** $f(x) + 1 = \displaystyle\int_{0}^{\pi - x} f(t)\,\mathrm{d} t$.

    *Indication : on justifiera d'abord que $f$ est dérivable ; pour (c), on montrera que $f$ est deux fois dérivable et que $f'' + f = 0$, puis l'on réinjectera les solutions trouvées dans l'équation.*
  corrige: |
    Dans les trois cas, le second membre est une intégrale dont la borne dépend de $x$ : comme $f$ est continue, il est dérivable (proposition 2), donc $f$ l'est aussi. On en tire une équation différentielle et une condition initiale, puis l'on vérifie la réciproque.

    **(a)** En dérivant, $f'(x) = x\,f(x)$, et $f(0) = 1$. Le théorème 2 donne $f(x) = \lambda\,\mathrm{e}^{x^{2}/2}$, et $\lambda = 1$. Réciproquement, $1 + \int_{0}^{x} t\,\mathrm{e}^{t^{2}/2}\,\mathrm{d} t = 1 + \mathrm{e}^{x^{2}/2} - 1 = \mathrm{e}^{x^{2}/2}$. 
    $$\boxed{f(x) = \mathrm{e}^{x^{2}/2}}$$
     **(b)** En dérivant, $f' = \cos x + f$, et $f(0) = 0$. Réciproquement, une fonction vérifiant ces deux conditions satisfait $f(x) = f(0) + \int_{0}^{x} f' = \sin x + \int_{0}^{x} f$ : l'équation intégrale équivaut au problème de Cauchy. On cherche une solution particulière $\alpha\cos x + \beta\sin x$ de $y' - y = \cos x$, ce qui donne $\beta - \alpha = 1$ et $\alpha + \beta = 0$, puis on ajuste la constante. 
    $$\boxed{f(x) = \frac{\mathrm{e}^{x} + \sin x - \cos x}{2}}$$
     **(c)** Le second membre est dérivable, de dérivée $-f(\pi - x)$ : ainsi $f'(x) = -f(\pi - x)$, ce qui montre que $f'$ est dérivable, et 
    $$f''(x) = f'(\pi - x) = -f\big(\pi - (\pi - x)\big) = -f(x).$$
     D'après le théorème 5, $f = \lambda\cos + \mu\sin$. On réinjecte dans $f'(x) = -f(\pi - x)$ : le premier membre vaut $-\lambda\sin x + \mu\cos x$, le second $\lambda\cos x - \mu\sin x$, d'où $\mu = \lambda$. Enfin, l'équation en $x = \pi$ donne $f(\pi) + 1 = 0$, soit $-\lambda + 1 = 0$. Réciproquement, les deux membres de l'équation ont alors la même dérivée et la même valeur en $\pi$, donc sont égaux. 
    $$\boxed{f(x) = \cos x + \sin x}$$
     On le vérifie : $\int_{0}^{\pi - x} (\cos t + \sin t)\,\mathrm{d} t = \big[\sin t - \cos t\big]_{0}^{\pi - x} = \sin x + \cos x + 1$. ✓

    *Piège :* en (c), l'équation $f'' + f = 0$ n'est qu'une conséquence ; sans les deux réinjections, on trouverait une famille à deux paramètres, alors qu'une seule fonction convient.
- id: "ma-06-51"
  feuille: "f-ma-06"
  numero: 51
