  page_enonce: 6
  page_corrige: 15
  enonce: |
    Déterminer une primitive des fonctions suivantes à l'aide d'un changement de variable.

    **(a)** $x \mapsto \dfrac{1}{\operatorname{ch} x}$, en posant $u = \mathrm{e}^{x}$

    **(b)** $x \mapsto \dfrac{1}{\mathrm{e}^{x} + 1}$

    **(c)** $x \mapsto \dfrac{1}{x + x(\ln x)^{2}}$

    **(d)** $x \mapsto \cos\sqrt{x}$

    **(e)** $x \mapsto \sqrt{1 - x^{2}}$, en posant $x = \sin t$

    **(f)** $x \mapsto \dfrac{1}{\sqrt{x^{2} + 1}}$, en posant $x = \operatorname{sh} t$

    **(g)** $x \mapsto \cos(2\ln x)$

    **(h)** $x \mapsto \dfrac{\mathrm{e}^{x}}{(3 + \mathrm{e}^{x})\sqrt{\mathrm{e}^{x} - 1}}$
  corrige: |
    Pour obtenir une primitive, on effectue le changement de variable dans $\int_{x_{0}}^{x} f$, puis l'on revient à la variable $x$. On donne chaque fois l'intervalle de travail.

    **(a)** $\frac{1}{\operatorname{ch} x} = \frac{2\mathrm{e}^{x}}{\mathrm{e}^{2x} + 1}$ ; avec $u = \mathrm{e}^{x}$, $\mathrm{d} u = \mathrm{e}^{x}\,\mathrm{d} x$, on obtient $\int \frac{2\,\mathrm{d} u}{1 + u^{2}}$. Sur $\mathbb{R}$ : 
    $$\boxed{x \mapsto 2\operatorname{Arctan}(\mathrm{e}^{x})}$$
     **(b)** Avec $u = \mathrm{e}^{x}$, $\mathrm{d} x = \frac{\mathrm{d} u}{u}$, on obtient $\int \frac{\mathrm{d} u}{u(u + 1)} = \ln\frac{u}{u + 1}$. Sur $\mathbb{R}$ : 
    $$\boxed{x \mapsto x - \ln(1 + \mathrm{e}^{x})}$$
     **(c)** Avec $u = \ln x$, $\mathrm{d} u = \frac{\mathrm{d} x}{x}$, on obtient $\int \frac{\mathrm{d} u}{1 + u^{2}}$. Sur $]0\,,+\infty[$ : 
    $$\boxed{x \mapsto \operatorname{Arctan}(\ln x)}$$
     **(d)** Avec $x = u^{2}$, $u \geqslant 0$, on obtient $\int 2u\cos u\,\mathrm{d} u = 2(u\sin u + \cos u)$ par parties. Sur $[0\,,+\infty[$ : 
    $$\boxed{x \mapsto 2\sqrt{x}\sin\sqrt{x} + 2\cos\sqrt{x}}$$
     **(e)** Avec $x = \sin t$, $t \in \big[-\frac{\pi}{2}\,,\frac{\pi}{2}\big]$, on a $\sqrt{1 - x^{2}} = \cos t$ et $\int \cos^{2} t\,\mathrm{d} t = \frac{t}{2} + \frac{\sin(2t)}{4} = \frac{t + \sin t\cos t}{2}$. Sur $[-1\,,1]$ : 
    $$\boxed{x \mapsto \frac{1}{2}\big(\operatorname{Arcsin} x + x\sqrt{1 - x^{2}}\big)}$$
     **(f)** Avec $x = \operatorname{sh} t$, on a $\sqrt{x^{2} + 1} = \operatorname{ch} t$ et $\mathrm{d} x = \operatorname{ch} t\,\mathrm{d} t$, d'où $\int \mathrm{d} t = t$. Il reste à exprimer $t$ en fonction de $x$ : $\mathrm{e}^{t} - \mathrm{e}^{-t} = 2x$ donne $\mathrm{e}^{2t} - 2x\,\mathrm{e}^{t} - 1 = 0$, et la racine positive de ce trinôme en $\mathrm{e}^{t}$ est $x + \sqrt{x^{2} + 1}$. Sur $\mathbb{R}$ : 
    $$\boxed{x \mapsto \ln\big(x + \sqrt{x^{2} + 1}\big)}$$
     **(g)** Avec $x = \mathrm{e}^{u}$, on obtient $\int \mathrm{e}^{u}\cos(2u)\,\mathrm{d} u = \operatorname{Re}\frac{\mathrm{e}^{(1 + 2\mathrm{i})u}}{1 + 2\mathrm{i}} = \frac{\mathrm{e}^{u}}{5}\big(\cos(2u) + 2\sin(2u)\big)$. Sur $]0\,,+\infty[$ : 
    $$\boxed{x \mapsto \frac{x}{5}\big(\cos(2\ln x) + 2\sin(2\ln x)\big)}$$
     **(h)** On pose $u = \sqrt{\mathrm{e}^{x} - 1}$, de sorte que $\mathrm{e}^{x} = 1 + u^{2}$ et $\mathrm{e}^{x}\,\mathrm{d} x = 2u\,\mathrm{d} u$ : 
    $$\int \frac{2u\,\mathrm{d} u}{(4 + u^{2})\,u} = \int \frac{2\,\mathrm{d} u}{4 + u^{2}} = \operatorname{Arctan}\frac{u}{2}.$$
     Sur $]0\,,+\infty[$, on obtient donc : 
    $$\boxed{x \mapsto \operatorname{Arctan}\frac{\sqrt{\mathrm{e}^{x} - 1}}{2}}$$

    *À retenir :* en (e), on reconnaît dans la primitive l'aire d'un secteur et d'un triangle ; c'est le calcul de l'aire du quart de disque du cours, mené avec une borne variable.
- id: "ma-06-20"
  feuille: "f-ma-06"
  numero: 20
  partie: "Calcul de primitives et d'intégrales"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["calcul de primitives et d'intégrales", intégrales, primitives trigonométriques, fractions rationnelles]
  noeuds: [ar-tfa, ri-proprietes, ex-logarithme, ex-exponentielle, ex-croissances, tg-arctan]
  notions: [riemann-integrable, arc-tangente, logarithme, exponentielle, cosinus-sinus]
  page_enonce: 6
  page_corrige: 16
  enonce: |
    Calculer les intégrales suivantes.

    **(a)** $\displaystyle\int_{0}^{1} x\,\mathrm{e}^{x^{2}}\,\mathrm{d} x$

    **(b)** $\displaystyle\int_{0}^{1} x\,\mathrm{e}^{x}\,\mathrm{d} x$

    **(c)** $\displaystyle\int_{1}^{\mathrm{e}} \frac{\ln x}{x}\,\mathrm{d} x$

    **(d)** $\displaystyle\int_{1}^{\mathrm{e}} x\ln x\,\mathrm{d} x$

    **(e)** $\displaystyle\int_{0}^{1} \frac{x}{1 + x^{2}}\,\mathrm{d} x$

    **(f)** $\displaystyle\int_{0}^{1} \frac{x^{2}}{1 + x^{2}}\,\mathrm{d} x$

    **(g)** $\displaystyle\int_{0}^{1} x\operatorname{Arctan} x\,\mathrm{d} x$

    **(h)** $\displaystyle\int_{0}^{1} \ln(1 + x)\,\mathrm{d} x$

    **(i)** $\displaystyle\int_{1}^{\mathrm{e}} (\ln x)^{2}\,\mathrm{d} x$

    **(j)** $\displaystyle\int_{0}^{1} \operatorname{Arcsin} x\,\mathrm{d} x$

    **(k)** $\displaystyle\int_{0}^{\pi/2} \sin^{3} x\,\mathrm{d} x$

    **(l)** $\displaystyle\int_{0}^{\pi} x\cos x\,\mathrm{d} x$

    **(m)** $\displaystyle\int_{0}^{\pi^{2}/4} \sin\sqrt{x}\,\mathrm{d} x$

    **(n)** $\displaystyle\int_{0}^{1} \frac{\sqrt{x}}{1 + x}\,\mathrm{d} x$

    **(o)** $\displaystyle\int_{1}^{4} \frac{\mathrm{d} x}{x + \sqrt{x}}$

    **(p)** $\displaystyle\int_{1}^{2} \frac{\mathrm{d} x}{x(1 + x)}$

    **(q)** $\displaystyle\int_{0}^{\ln 2} \frac{\mathrm{e}^{x}}{(1 + \mathrm{e}^{x})^{2}}\,\mathrm{d} x$

    **(r)** $\displaystyle\int_{0}^{\pi/4} \tan^{2} x\,\mathrm{d} x$

    **(s)** $\displaystyle\int_{0}^{\pi/2} \mathrm{e}^{x}\sin x\,\mathrm{d} x$

    **(t)** $\displaystyle\int_{0}^{1} x^{3}\sqrt{1 - x^{2}}\,\mathrm{d} x$

    **(u)** $\displaystyle\int_{-1}^{1} \frac{x^{5}\cos x}{1 + x^{2}}\,\mathrm{d} x$
  corrige: |
    Pour chaque intégrale, on indique la méthode et l'indice qui y conduit, puis le calcul.

    **(a)** *Dérivée composée* : le facteur $x$ est, à $\frac{1}{2}$ près, la dérivée de l'exposant $x^{2}$. 
    $$\int_{0}^{1} x\,\mathrm{e}^{x^{2}}\,\mathrm{d} x = \Big[\frac{\mathrm{e}^{x^{2}}}{2}\Big]_{0}^{1} = \boxed{\frac{\mathrm{e} - 1}{2}}$$
     **(b)** *Intégration par parties* : l'exposant est $x$, dont la dérivée $1$ n'apporte pas le facteur $x$ ; on dérive le polynôme. 
    $$\int_{0}^{1} x\,\mathrm{e}^{x}\,\mathrm{d} x = \big[x\,\mathrm{e}^{x}\big]_{0}^{1} - \int_{0}^{1} \mathrm{e}^{x}\,\mathrm{d} x = \mathrm{e} - (\mathrm{e} - 1) = \boxed{1}$$
     **(c)** *Dérivée composée* : $\frac{1}{x}$ est la dérivée de $\ln x$. 
    $$\int_{1}^{\mathrm{e}} \frac{\ln x}{x}\,\mathrm{d} x = \Big[\frac{(\ln x)^{2}}{2}\Big]_{1}^{\mathrm{e}} = \boxed{\frac{1}{2}}$$
     **(d)** *Intégration par parties* : $x$ n'est pas la dérivée de $\ln x$ ; on dérive $\ln$, on primitive $x$. 
    $$\int_{1}^{\mathrm{e}} x\ln x\,\mathrm{d} x = \Big[\frac{x^{2}}{2}\ln x\Big]_{1}^{\mathrm{e}} - \int_{1}^{\mathrm{e}} \frac{x}{2}\,\mathrm{d} x = \frac{\mathrm{e}^{2}}{2} - \frac{\mathrm{e}^{2} - 1}{4} = \boxed{\frac{\mathrm{e}^{2} + 1}{4}}$$
     **(e)** *Dérivée composée* : le numérateur est la moitié de la dérivée du dénominateur. 
    $$\int_{0}^{1} \frac{x}{1 + x^{2}}\,\mathrm{d} x = \Big[\frac{1}{2}\ln(1 + x^{2})\Big]_{0}^{1} = \boxed{\frac{\ln 2}{2}}$$
     **(f)** *Décomposition* : numérateur et dénominateur ont le même degré, on divise d'abord. 
    $$\int_{0}^{1} \frac{x^{2}}{1 + x^{2}}\,\mathrm{d} x = \int_{0}^{1} \Big(1 - \frac{1}{1 + x^{2}}\Big)\mathrm{d} x = \boxed{1 - \frac{\pi}{4}}$$
     **(g)** *Intégration par parties* : on dérive $\operatorname{Arctan}$, qui devient rationnelle, et l'on primitive $x$ en $\frac{1 + x^{2}}{2}$. 
    $$\int_{0}^{1} x\operatorname{Arctan} x\,\mathrm{d} x = \Big[\frac{1 + x^{2}}{2}\operatorname{Arctan} x\Big]_{0}^{1} - \int_{0}^{1} \frac{\mathrm{d} x}{2} = \boxed{\frac{\pi}{4} - \frac{1}{2}}$$
     **(h)** *Intégration par parties* en primitivant $1$ : une fonction seule, dont la dérivée est rationnelle. On choisit la primitive $1 + x$ de $1$. 
    $$\int_{0}^{1} \ln(1 + x)\,\mathrm{d} x = \big[(1 + x)\ln(1 + x)\big]_{0}^{1} - \int_{0}^{1} \mathrm{d} x = \boxed{2\ln 2 - 1}$$
     **(i)** *Intégration par parties* en primitivant $1$, puis l'exemple du cours pour $\int \ln$. 
    $$\int_{1}^{\mathrm{e}} (\ln x)^{2}\,\mathrm{d} x = \big[x(\ln x)^{2}\big]_{1}^{\mathrm{e}} - 2\int_{1}^{\mathrm{e}} \ln x\,\mathrm{d} x = \mathrm{e} - 2\big[x\ln x - x\big]_{1}^{\mathrm{e}} = \boxed{\mathrm{e} - 2}$$
     **(j)** *Changement de variable* $x = \sin\theta$, plutôt qu'une intégration par parties directe, puisque $\operatorname{Arcsin}$ n'est pas dérivable en $1$ (voir l'exercice 15 (f)). 
    $$\int_{0}^{1} \operatorname{Arcsin} x\,\mathrm{d} x = \int_{0}^{\pi/2} \theta\cos\theta\,\mathrm{d}\theta = \big[\theta\sin\theta + \cos\theta\big]_{0}^{\pi/2} = \boxed{\frac{\pi}{2} - 1}$$
     **(k)** *Dérivée composée* : une puissance impaire de $\sin$ ; on isole un $\sin x$ et l'on écrit $\sin^{2} x = 1 - \cos^{2} x$. 
    $$\int_{0}^{\pi/2} \sin^{3} x\,\mathrm{d} x = \Big[-\cos x + \frac{\cos^{3} x}{3}\Big]_{0}^{\pi/2} = 1 - \frac{1}{3} = \boxed{\frac{2}{3}}$$
     **(l)** *Intégration par parties* : un polynôme multiplié par un cosinus. 
    $$\int_{0}^{\pi} x\cos x\,\mathrm{d} x = \big[x\sin x\big]_{0}^{\pi} - \int_{0}^{\pi} \sin x\,\mathrm{d} x = \boxed{-2}$$
     **(m)** *Changement de variable* $x = u^{2}$, pour faire disparaître la racine, puis intégration par parties. 
    $$\int_{0}^{\pi^{2}/4} \sin\sqrt{x}\,\mathrm{d} x = \int_{0}^{\pi/2} 2u\sin u\,\mathrm{d} u = 2\big[\sin u - u\cos u\big]_{0}^{\pi/2} = \boxed{2}$$
     **(n)** *Changement de variable* $x = u^{2}$, puis décomposition, comme à l'exercice 18 (e). 
    $$\int_{0}^{1} \frac{\sqrt{x}}{1 + x}\,\mathrm{d} x = \int_{0}^{1} \frac{2u^{2}}{1 + u^{2}}\,\mathrm{d} u = \boxed{2 - \frac{\pi}{2}}$$
     **(o)** *Changement de variable* $x = u^{2}$ : $x + \sqrt{x} = u(u + 1)$ et $\mathrm{d} x = 2u\,\mathrm{d} u$. 
    $$\int_{1}^{4} \frac{\mathrm{d} x}{x + \sqrt{x}} = \int_{1}^{2} \frac{2\,\mathrm{d} u}{u + 1} = 2\ln\frac{3}{2} = \boxed{\ln\frac{9}{4}}$$
     **(p)** *Décomposition* : $\frac{1}{x(1 + x)} = \frac{1}{x} - \frac{1}{1 + x}$. 
    $$\int_{1}^{2} \frac{\mathrm{d} x}{x(1 + x)} = \Big[\ln\frac{x}{1 + x}\Big]_{1}^{2} = \ln\frac{2}{3} - \ln\frac{1}{2} = \boxed{\ln\frac{4}{3}}$$
     **(q)** *Dérivée composée* : la forme $u'u^{-2}$ avec $u = 1 + \mathrm{e}^{x}$. 
    $$\int_{0}^{\ln 2} \frac{\mathrm{e}^{x}}{(1 + \mathrm{e}^{x})^{2}}\,\mathrm{d} x = \Big[-\frac{1}{1 + \mathrm{e}^{x}}\Big]_{0}^{\ln 2} = -\frac{1}{3} + \frac{1}{2} = \boxed{\frac{1}{6}}$$
     **(r)** *Dérivée usuelle*, après avoir écrit $\tan^{2} x = (1 + \tan^{2} x) - 1$. 
    $$\int_{0}^{\pi/4} \tan^{2} x\,\mathrm{d} x = \big[\tan x - x\big]_{0}^{\pi/4} = \boxed{1 - \frac{\pi}{4}}$$
     **(s)** *Exponentielle complexe* : le produit d'une exponentielle et d'un sinus. 
    $$\int_{0}^{\pi/2} \mathrm{e}^{x}\sin x\,\mathrm{d} x = \Big[\frac{\mathrm{e}^{x}}{2}(\sin x - \cos x)\Big]_{0}^{\pi/2} = \boxed{\frac{\mathrm{e}^{\pi/2} + 1}{2}}$$
     **(t)** *Changement de variable* $u = 1 - x^{2}$ : on écrit $x^{3} = x^{2}\cdot x$, où $x\,\mathrm{d} x = -\frac{\mathrm{d} u}{2}$ et $x^{2} = 1 - u$. 
    $$\int_{0}^{1} x^{3}\sqrt{1 - x^{2}}\,\mathrm{d} x = \frac{1}{2}\int_{0}^{1} (1 - u)\sqrt{u}\,\mathrm{d} u = \frac{1}{2}\Big(\frac{2}{3} - \frac{2}{5}\Big) = \boxed{\frac{2}{15}}$$
     **(u)** *Parité* : l'intervalle est symétrique et l'intégrande est impaire, comme produit de la fonction impaire $x^{5}$ et des fonctions paires $\cos$ et $\frac{1}{1 + x^{2}}$ ; aucun calcul de primitive n'est nécessaire (proposition 6). 
    $$\boxed{\int_{-1}^{1} \frac{x^{5}\cos x}{1 + x^{2}}\,\mathrm{d} x = 0}$$

    En résumé, les intégrales se regroupent ainsi :

    • dérivées composées (a), (c), (e), (k), (q), et dérivée usuelle (r) : l'intégrande contient un facteur qui est la dérivée d'une fonction apparaissant ailleurs ;

    • intégrations par parties (b), (d), (g), (h), (i), (l) : un produit dont un facteur se simplifie en le dérivant ($x$, $\ln$, $\operatorname{Arctan}$), ou une fonction seule dont la dérivée est plus simple ;

    • changements de variable (j), (m), (n), (o), (t) : une racine, ou une fonction réciproque non dérivable au bord ;

    • décompositions (f), (p) ; exponentielle complexe (s) ; parité (u).

    Les couples (a)--(b), (c)--(d) et (e)--(f) montrent qu'un changement minime de l'intégrande, ici la place d'un $x$ ou d'un carré, fait disparaître le facteur « dérivée de » et oblige à changer de méthode.
- id: "ma-06-21"
  feuille: "f-ma-06"
  numero: 21
  partie: "Calcul de primitives et d'intégrales"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["calcul de primitives et d'intégrales", intégrales, primitives trigonométriques]
  noeuds: [ar-tfa, ri-proprietes]
  notions: [riemann-integrable]
  page_enonce: 6
  page_corrige: 18
  enonce: |
    *Symétries.*

    **1.** Soit $f : [a\,,b] \to \mathbb{R}$ continue telle que $f(a + b - x) = f(x)$ pour tout $x$. Montrer que 
    $$\int_{a}^{b} x\,f(x)\,\mathrm{d} x = \frac{a + b}{2}\int_{a}^{b} f(x)\,\mathrm{d} x,$$
     et interpréter.

    **2.** En déduire $\displaystyle\int_{0}^{\pi} \frac{x\sin x}{1 + \cos^{2} x}\,\mathrm{d} x$ et $\displaystyle\int_{0}^{\pi} \frac{x}{1 + \sin x}\,\mathrm{d} x$.

    **3.** Montrer que $\displaystyle\int_{0}^{\pi/2} \frac{\cos t}{\cos t + \sin t}\,\mathrm{d} t = \int_{0}^{\pi/2} \frac{\sin t}{\cos t + \sin t}\,\mathrm{d} t$, puis que ces intégrales valent $\dfrac{\pi}{4}$. En déduire $\displaystyle\int_{0}^{1} \frac{\mathrm{d} t}{\sqrt{1 - t^{2}} + t}$.
  corrige: |
    **1.** Le changement de variable $x = a + b - u$ échange $a$ et $b$, et $\mathrm{d} x = -\mathrm{d} u$ : 
    $$J = \int_{a}^{b} x\,f(x)\,\mathrm{d} x = \int_{b}^{a} (a + b - u)\,f(a + b - u)\,(-\mathrm{d} u) = \int_{a}^{b} (a + b - u)\,f(u)\,\mathrm{d} u = (a + b)\int_{a}^{b} f - J.$$

    $$\boxed{\int_{a}^{b} x\,f(x)\,\mathrm{d} x = \frac{a + b}{2}\int_{a}^{b} f(x)\,\mathrm{d} x}$$
     La courbe de $f$ est symétrique par rapport à la droite $x = \frac{a + b}{2}$ ; si $f \geqslant 0$, le domaine sous la courbe a son centre de gravité sur cette droite, et c'est ce qu'exprime l'égalité, le quotient $\int x f / \int f$ étant l'abscisse de ce centre de gravité.

    **2.** Sur $[0\,,\pi]$, les fonctions $x \mapsto \frac{\sin x}{1 + \cos^{2} x}$ et $x \mapsto \frac{1}{1 + \sin x}$ sont inchangées quand on remplace $x$ par $\pi - x$, puisque $\sin(\pi - x) = \sin x$ et $\cos^{2}(\pi - x) = \cos^{2} x$. La première intégrale se ramène à l'exercice 18 (b) : 
    $$\int_{0}^{\pi} \frac{x\sin x}{1 + \cos^{2} x}\,\mathrm{d} x = \frac{\pi}{2}\int_{0}^{\pi} \frac{\sin x}{1 + \cos^{2} x}\,\mathrm{d} x = \frac{\pi}{2}\cdot\frac{\pi}{2} = \boxed{\frac{\pi^{2}}{4}}.$$
     Pour la seconde, la symétrie par rapport à $\frac{\pi}{2}$ donne $\int_{0}^{\pi} \frac{\mathrm{d} x}{1 + \sin x} = 2\int_{0}^{\pi/2} \frac{\mathrm{d} x}{1 + \sin x}$, puis $x = \frac{\pi}{2} - u$ et $1 + \cos u = 2\cos^{2}\frac{u}{2}$ donnent 
    $$\int_{0}^{\pi/2} \frac{\mathrm{d} u}{1 + \cos u} = \int_{0}^{\pi/2} \frac{\mathrm{d} u}{2\cos^{2}(u/2)} = \Big[\tan\frac{u}{2}\Big]_{0}^{\pi/2} = 1, \qquad\text{d'où}\qquad \int_{0}^{\pi} \frac{x}{1 + \sin x}\,\mathrm{d} x = \frac{\pi}{2}\cdot 2 = \boxed{\pi}.$$
     **3.** Le changement de variable $t = \frac{\pi}{2} - u$ échange $\cos$ et $\sin$ et laisse le dénominateur inchangé : les deux intégrales $A$ et $B$ sont égales. Leur somme vaut $\int_{0}^{\pi/2} \mathrm{d} t = \frac{\pi}{2}$. 
    $$\boxed{A = B = \frac{\pi}{4}}$$
     Enfin, le changement de variable $t = \sin\theta$, $\theta \in \big[0\,,\frac{\pi}{2}\big]$, donne $\sqrt{1 - t^{2}} = \cos\theta$ et $\mathrm{d} t = \cos\theta\,\mathrm{d}\theta$ : 
    $$\int_{0}^{1} \frac{\mathrm{d} t}{\sqrt{1 - t^{2}} + t} = \int_{0}^{\pi/2} \frac{\cos\theta}{\cos\theta + \sin\theta}\,\mathrm{d}\theta = \boxed{\frac{\pi}{4}}.$$

    *À retenir :* une symétrie de l'intervalle permet de calculer des intégrales dont on ne connaît aucune primitive explicite, comme $\int \frac{x\sin x}{1 + \cos^{2} x}$ ; on retrouvera cette idée dans l'exercice suivant.
- id: "ma-06-22"
  feuille: "f-ma-06"
  numero: 22
  partie: "Calcul de primitives et d'intégrales"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: ["calcul de primitives et d'intégrales", primitives, intégrales, changement de variable, primitives trigonométriques, fractions rationnelles]
  noeuds: [ar-tfa, ri-proprietes]
  notions: [riemann-integrable]
  page_enonce: 7
  page_corrige: 18
  enonce: |
    *Règles de Bioche.* Pour primitiver une fraction en $\cos x$ et $\sin x$, on cherche une symétrie de l'expression $f(x)\,\mathrm{d} x$ : on pose $u = \cos x$ si elle est inchangée quand on remplace $x$ par $-x$, $u = \sin x$ si elle l'est quand on remplace $x$ par $\pi - x$, $u = \tan x$ si elle l'est quand on remplace $x$ par $\pi + x$, et $t = \tan\frac{x}{2}$ en dernier recours.

    **1.** Justifier, lorsque $t = \tan\frac{x}{2}$ avec $x \in \,]-\pi\,,\pi[$, les formules $\cos x = \dfrac{1 - t^{2}}{1 + t^{2}}$, $\sin x = \dfrac{2t}{1 + t^{2}}$ et $\mathrm{d} x = \dfrac{2\,\mathrm{d} t}{1 + t^{2}}$.

    **2.** Calculer, en choisissant chaque fois le changement de variable : 
    $$\int_{\pi/3}^{\pi/2} \frac{\mathrm{d} x}{\sin x}, \qquad \int_{0}^{\pi} \frac{\sin x}{4 - \cos^{2} x}\,\mathrm{d} x, \qquad \int_{0}^{\pi/2} \frac{\mathrm{d} x}{2 + \cos x}, \qquad \int_{\pi/3}^{\pi/2} \frac{\mathrm{d} x}{\sin x + \tan x}.$$
  corrige: |
    **1.** Pour $x \in \,]-\pi\,,\pi[$, on a $\frac{x}{2} \in \big]-\frac{\pi}{2}\,,\frac{\pi}{2}\big[$, donc $\cos\frac{x}{2} > 0$ et $\cos^{2}\frac{x}{2} = \frac{1}{1 + t^{2}}$. Les formules de duplication du chapitre 4 donnent alors 
    $$\cos x = \cos^{2}\frac{x}{2}\Big(1 - \tan^{2}\frac{x}{2}\Big) = \frac{1 - t^{2}}{1 + t^{2}}, \qquad \sin x = 2\tan\frac{x}{2}\cos^{2}\frac{x}{2} = \frac{2t}{1 + t^{2}}.$$
     Enfin $x = 2\operatorname{Arctan} t$, donc $\mathrm{d} x = \dfrac{2\,\mathrm{d} t}{1 + t^{2}}$.

    **2.** *Première intégrale.* L'expression $\frac{\mathrm{d} x}{\sin x}$ est inchangée quand on remplace $x$ par $-x$ : on pose $u = \cos x$, en écrivant $\frac{\mathrm{d} x}{\sin x} = \frac{\sin x\,\mathrm{d} x}{1 - \cos^{2} x}$. Quand $x$ va de $\frac{\pi}{3}$ à $\frac{\pi}{2}$, $u$ va de $\frac{1}{2}$ à $0$ : 
    $$\int_{\pi/3}^{\pi/2} \frac{\mathrm{d} x}{\sin x} = \int_{0}^{1/2} \frac{\mathrm{d} u}{1 - u^{2}} = \Big[\frac{1}{2}\ln\frac{1 + u}{1 - u}\Big]_{0}^{1/2} = \boxed{\frac{\ln 3}{2}}.$$
     *Deuxième intégrale.* Même invariance, et $u = \cos x$ va de $1$ à $-1$ : 
    $$\int_{0}^{\pi} \frac{\sin x}{4 - \cos^{2} x}\,\mathrm{d} x = \int_{-1}^{1} \frac{\mathrm{d} u}{4 - u^{2}} = \Big[\frac{1}{4}\ln\frac{2 + u}{2 - u}\Big]_{-1}^{1} = \frac{1}{4}\Big(\ln 3 - \ln\frac{1}{3}\Big) = \boxed{\frac{\ln 3}{2}}.$$
     *Troisième intégrale.* Aucune des trois symétries ne laisse $\frac{\mathrm{d} x}{2 + \cos x}$ invariante : on pose $t = \tan\frac{x}{2}$, qui va de $0$ à $1$. 
    $$\int_{0}^{\pi/2} \frac{\mathrm{d} x}{2 + \cos x} = \int_{0}^{1} \frac{2\,\mathrm{d} t}{2(1 + t^{2}) + 1 - t^{2}} = \int_{0}^{1} \frac{2\,\mathrm{d} t}{3 + t^{2}} = \frac{2}{\sqrt{3}}\operatorname{Arctan}\frac{1}{\sqrt{3}} = \boxed{\frac{\pi}{3\sqrt{3}}}$$
     *Quatrième intégrale.* En remplaçant $x$ par $-x$, $\sin x + \tan x$ et $\mathrm{d} x$ changent tous deux de signe : on pose $u = \cos x$. On écrit $\sin x + \tan x = \frac{\sin x\,(1 + \cos x)}{\cos x}$, d'où 
    $$\frac{\mathrm{d} x}{\sin x + \tan x} = \frac{\cos x\,\sin x\,\mathrm{d} x}{(1 - \cos^{2} x)(1 + \cos x)} = \frac{-u\,\mathrm{d} u}{(1 - u)(1 + u)^{2}}.$$
     On décompose, comme à l'exercice 12 : $\frac{u}{(1 - u)(1 + u)^{2}} = \frac{1}{4(1 - u)} + \frac{1}{4(1 + u)} - \frac{1}{2(1 + u)^{2}}$. 
    $$\int_{\pi/3}^{\pi/2} \frac{\mathrm{d} x}{\sin x + \tan x} = \Big[\frac{1}{4}\ln\frac{1 + u}{1 - u} + \frac{1}{2(1 + u)}\Big]_{0}^{1/2} = \frac{\ln 3}{4} + \frac{1}{3} - \frac{1}{2} = \boxed{\frac{\ln 3}{4} - \frac{1}{6}}$$
     Le résultat vaut environ $0{,}108$ : il est bien positif, comme l'intégrande.
- id: "ma-06-23"
  feuille: "f-ma-06"
  numero: 23
  partie: "Calcul de primitives et d'intégrales"
  etoiles: 3
  types: [Démonstration]
  mots_cles: ["calcul de primitives et d'intégrales", intégrales, intégration par parties, changement de variable, primitives trigonométriques, limites]
  noeuds: [ar-tfa, ri-proprietes, su-monotone]
  notions: [riemann-integrable]
  page_enonce: 7
  page_corrige: 19
  enonce: |
    *Intégrales de Wallis.* Pour tout $n \in \mathbb{N}$, on pose $W_{n} = \displaystyle\int_{0}^{\pi/2} \sin^{n} t\,\mathrm{d} t$.

    **1.** Calculer $W_{0}$, $W_{1}$ et $W_{2}$, puis montrer à l'aide du changement de variable $t = \frac{\pi}{2} - u$ que 
    $$W_{n} = \int_{0}^{\pi/2} \cos^{n} t\,\mathrm{d} t.$$

    **2.** Montrer que $(W_{n})$ est décroissante et à termes strictement positifs.

    **3.** Par une intégration par parties, montrer que $(n + 2)\,W_{n+2} = (n + 1)\,W_{n}$ pour tout $n \in \mathbb{N}$.

    **4.** En déduire, pour tout $p \in \mathbb{N}$, $W_{2p} = \dfrac{(2p)!}{2^{2p}(p!)^{2}}\cdot\dfrac{\pi}{2}$ et $W_{2p+1} = \dfrac{2^{2p}(p!)^{2}}{(2p + 1)!}$.

    **5.** Montrer que la suite $\big((n + 1)\,W_{n+1}W_{n}\big)$ est constante, et préciser sa valeur.

    **6.** En utilisant la décroissance, montrer que $\dfrac{n + 1}{n + 2} \leqslant \dfrac{W_{n+1}}{W_{n}} \leqslant 1$. Que suggère ce résultat lorsque $n$ devient grand ?
  corrige: |
    **1.** Les premières valeurs se calculent directement, avec $\sin^{2} = \frac{1 - \cos(2t)}{2}$ : 
    $$\boxed{W_{0} = \frac{\pi}{2}, \qquad W_{1} = \big[-\cos t\big]_{0}^{\pi/2} = 1, \qquad W_{2} = \frac{\pi}{4}}$$
     Le changement de variable $t = \frac{\pi}{2} - u$ échange les bornes, et $\sin\big(\frac{\pi}{2} - u\big) = \cos u$ : 
    $$W_{n} = \int_{\pi/2}^{0} \cos^{n} u\,(-\mathrm{d} u) = \boxed{\int_{0}^{\pi/2} \cos^{n} u\,\mathrm{d} u}.$$
     **2.** Sur $\big[0\,,\frac{\pi}{2}\big]$, on a $0 \leqslant \sin t \leqslant 1$, donc $\sin^{n+1} t \leqslant \sin^{n} t$, et $W_{n+1} \leqslant W_{n}$ par croissance de l'intégrale. De plus, $\sin^{n}$ est continue, positive et non nulle : l'exercice 5 donne $W_{n} > 0$. 
    $$\boxed{(W_{n}) \text{ est décroissante, et } W_{n} > 0}$$
     **3.** On écrit $\sin^{n+2} t = \sin t \cdot \sin^{n+1} t$, on primitive $\sin t$ en $-\cos t$ et l'on dérive $\sin^{n+1} t$ : 
    $$W_{n+2} = \big[-\cos t\sin^{n+1} t\big]_{0}^{\pi/2} + (n + 1)\int_{0}^{\pi/2} \cos^{2} t\,\sin^{n} t\,\mathrm{d} t = (n + 1)\big(W_{n} - W_{n+2}\big),$$
     en remplaçant $\cos^{2} t$ par $1 - \sin^{2} t$. 
    $$\boxed{(n + 2)\,W_{n+2} = (n + 1)\,W_{n}}$$
     **4.** Par récurrence sur $p$. Les formules sont vraies pour $p = 0$. Si elles le sont au rang $p$, la relation de la question 3 avec $n = 2p$ donne 
    $$W_{2p+2} = \frac{2p + 1}{2p + 2}\,W_{2p} = \frac{(2p + 1)(2p + 2)}{(2p + 2)^{2}}\cdot\frac{(2p)!}{2^{2p}(p!)^{2}}\cdot\frac{\pi}{2} = \frac{(2p + 2)!}{2^{2p+2}\big((p + 1)!\big)^{2}}\cdot\frac{\pi}{2},$$
     puisque $(2p + 2)^{2} = 4(p + 1)^{2}$ ; de même, avec $n = 2p + 1$, 
    $$W_{2p+3} = \frac{2p + 2}{2p + 3}\,W_{2p+1} = \frac{(2p + 2)^{2}}{(2p + 2)(2p + 3)}\cdot\frac{2^{2p}(p!)^{2}}{(2p + 1)!} = \frac{2^{2p+2}\big((p + 1)!\big)^{2}}{(2p + 3)!}.$$

    $$\boxed{W_{2p} = \frac{(2p)!}{2^{2p}(p!)^{2}}\cdot\frac{\pi}{2} \qquad W_{2p+1} = \frac{2^{2p}(p!)^{2}}{(2p + 1)!}}$$
     **5.** En multipliant la relation de la question 3 par $W_{n+1}$, on obtient 
    $$(n + 2)\,W_{n+2}W_{n+1} = (n + 1)\,W_{n+1}W_{n} :$$
     la suite est constante, égale à son premier terme $1 \cdot W_{1}W_{0}$. 
    $$\boxed{(n + 1)\,W_{n+1}W_{n} = \frac{\pi}{2}}$$
     **6.** La suite étant décroissante et strictement positive, $W_{n+2} \leqslant W_{n+1} \leqslant W_{n}$ ; en divisant par $W_{n} > 0$ et en utilisant la question 3 : 
    $$\boxed{\frac{n + 1}{n + 2} = \frac{W_{n+2}}{W_{n}} \leqslant \frac{W_{n+1}}{W_{n}} \leqslant 1}$$
     Lorsque $n$ est grand, le quotient $\frac{W_{n+1}}{W_{n}}$ est donc très proche de $1$ : $W_{n+1}$ et $W_{n}$ sont presque égaux, et la question 5 suggère alors $(n + 1)\,W_{n}^{2} \approx \frac{\pi}{2}$, soit $W_{n} \approx \sqrt{\frac{\pi}{2n}}$. On pourra rendre ce raisonnement rigoureux lorsque les limites de suites auront été étudiées ; il conduit à la formule de Wallis et à celle de Stirling.
- id: "ma-06-24"
  feuille: "f-ma-06"
