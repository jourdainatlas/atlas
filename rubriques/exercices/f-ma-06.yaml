  page_enonce: 8
  page_corrige: 21
  enonce: |
    Pour tout $n \in \mathbb{N}$, on pose $I_{n} = \displaystyle\int_{0}^{1} \frac{x^{n}}{1 + x}\,\mathrm{d} x$.

    **1.** Calculer $I_{0}$, puis montrer que $0 \leqslant I_{n} \leqslant \dfrac{1}{n + 1}$ pour tout $n$.

    **2.** Calculer $I_{n} + I_{n+1}$.

    **3.** En déduire que, pour tout $N \in \mathbb{N}$, $\displaystyle\sum_{k=0}^{N} \frac{(-1)^{k}}{k + 1} = \ln 2 + (-1)^{N} I_{N+1}$, puis que ces sommes s'approchent de $\ln 2$ quand $N$ grandit, avec une erreur au plus $\frac{1}{N + 2}$.

    **4.** En adaptant la méthode à $J_{n} = \displaystyle\int_{0}^{1} \frac{x^{2n}}{1 + x^{2}}\,\mathrm{d} x$, montrer que $1 - \dfrac{1}{3} + \dfrac{1}{5} - \cdots + \dfrac{(-1)^{N}}{2N + 1}$ s'approche de $\dfrac{\pi}{4}$.
  corrige: |
    **1.** On a $I_{0} = \big[\ln(1 + x)\big]_{0}^{1}$, donc $\boxed{I_{0} = \ln 2}$. Pour $x \in [0\,,1]$, on a $0 \leqslant \frac{x^{n}}{1 + x} \leqslant x^{n}$, et l'on intègre : 
    $$\boxed{0 \leqslant I_{n} \leqslant \frac{1}{n + 1}}$$
     **2.** Les deux intégrandes s'ajoutent en $\frac{x^{n}(1 + x)}{1 + x} = x^{n}$ : 
    $$\boxed{I_{n} + I_{n+1} = \frac{1}{n + 1}}$$
     **3.** On remplace chaque $\frac{1}{k + 1}$ par $I_{k} + I_{k+1}$ ; la somme est télescopique, au signe près : 
    $$\sum_{k=0}^{N} \frac{(-1)^{k}}{k + 1} = \sum_{k=0}^{N} (-1)^{k}I_{k} - \sum_{k=1}^{N+1} (-1)^{k}I_{k} = I_{0} - (-1)^{N+1}I_{N+1}.$$

    $$\boxed{\sum_{k=0}^{N} \frac{(-1)^{k}}{k + 1} = \ln 2 + (-1)^{N}I_{N+1}}$$
     D'après la question 1, l'écart entre cette somme et $\ln 2$ vaut $I_{N+1}$, compris entre $0$ et $\frac{1}{N + 2}$ : il est aussi petit que l'on veut pourvu que $N$ soit assez grand.

    **4.** On pose de même $J_{0} = \operatorname{Arctan} 1 = \frac{\pi}{4}$ ; l'encadrement $0 \leqslant \frac{x^{2n}}{1 + x^{2}} \leqslant x^{2n}$ donne $0 \leqslant J_{n} \leqslant \frac{1}{2n + 1}$, et $J_{n} + J_{n+1} = \int_{0}^{1} x^{2n}\,\mathrm{d} x = \frac{1}{2n + 1}$. Le même télescopage donne 
    $$\boxed{\sum_{k=0}^{N} \frac{(-1)^{k}}{2k + 1} = \frac{\pi}{4} + (-1)^{N}J_{N+1}, \qquad 0 \leqslant J_{N+1} \leqslant \frac{1}{2N + 3}}$$
     La somme $1 - \frac{1}{3} + \frac{1}{5} - \cdots$ s'approche donc de $\frac{\pi}{4}$, avec une erreur au plus $\frac{1}{2N + 3}$.

    *À retenir :* ces deux résultats sont dus à Mercator et à Leibniz (ou, en Inde, à Madhava) ; l'erreur, de l'ordre de $\frac{1}{N}$, montre qu'il faut des milliers de termes pour obtenir trois décimales de $\pi$, ce qui contraste avec la méthode de l'exercice 9.
- id: "ma-06-26"
  feuille: "f-ma-06"
