- id: "ma-06-01"
  feuille: "f-ma-06"
  numero: 1
  partie: "Primitives et intégrales"
  etoiles: 1
  types: [Calcul]
  mots_cles: [primitives, primitives trigonométriques, fractions rationnelles]
  noeuds: [ar-tfa, ex-exponentielle]
  notions: [riemann-integrable, exponentielle]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Déterminer une primitive de chacune des fonctions suivantes, en précisant un intervalle sur lequel on travaille.

    **(a)** $x \mapsto 5x^{3} - 3x + 7$

    **(b)** $x \mapsto 2\cos x - 3\sin x$

    **(c)** $x \mapsto \dfrac{5}{\sqrt{x}} + \dfrac{4}{x} + \dfrac{2}{x^{3}}$

    **(d)** $x \mapsto \dfrac{x + 5}{x^{2}}$

    **(e)** $x \mapsto \mathrm{e}^{4x + 3}$

    **(f)** $x \mapsto \cos\Big(3x + \dfrac{\pi}{3}\Big)$

    **(g)** $x \mapsto (2x + 1)^{5}$

    **(h)** $x \mapsto \dfrac{3}{\sqrt{5x + 1}}$

    **(i)** $x \mapsto \dfrac{1}{x^{2} + 9}$

    **(j)** $x \mapsto \dfrac{1}{\sqrt{4 - x^{2}}}$

    **(k)** $x \mapsto \operatorname{ch}(2x) + \operatorname{sh}\dfrac{x}{3}$

    **(l)** $x \mapsto \tan^{2} x$
  corrige: |
    On lit le tableau des primitives usuelles du cours de droite à gauche ; pour une fonction de la forme $x \mapsto g(ax + b)$, avec $a \neq 0$, une primitive est $x \mapsto \frac{1}{a}G(ax + b)$, où $G$ est une primitive de $g$. Chaque résultat se vérifie en dérivant.

    • **(a)** Sur $\mathbb{R}$ : $\boxed{x \mapsto \frac{5}{4}x^{4} - \frac{3}{2}x^{2} + 7x}$

    • **(b)** Sur $\mathbb{R}$ : $\boxed{x \mapsto 2\sin x + 3\cos x}$

    • **(c)** On écrit $\frac{5}{\sqrt{x}} = 5x^{-1/2}$ et $\frac{2}{x^{3}} = 2x^{-3}$. Sur $]0\,,+\infty[$ : $\boxed{x \mapsto 10\sqrt{x} + 4\ln x - \frac{1}{x^{2}}}$

    • **(d)** On sépare la fraction : $\frac{x + 5}{x^{2}} = \frac{1}{x} + \frac{5}{x^{2}}$. Sur $]0\,,+\infty[$ : $\boxed{x \mapsto \ln x - \frac{5}{x}}$

    • **(e)** Sur $\mathbb{R}$ : $\boxed{x \mapsto \frac{1}{4}\mathrm{e}^{4x + 3}}$

    • **(f)** Sur $\mathbb{R}$ : $\boxed{x \mapsto \frac{1}{3}\sin\Big(3x + \frac{\pi}{3}\Big)}$

    • **(g)** Sur $\mathbb{R}$ : $\boxed{x \mapsto \frac{(2x + 1)^{6}}{12}}$

    • **(h)** On écrit $3(5x + 1)^{-1/2}$, de primitive $\frac{3}{5}\cdot 2(5x + 1)^{1/2}$. Sur $\big]-\frac{1}{5}\,,+\infty\big[$ : $\boxed{x \mapsto \frac{6}{5}\sqrt{5x + 1}}$

    • **(i)** On factorise $9$ : $\frac{1}{x^{2} + 9} = \frac{1}{9}\cdot\frac{1}{1 + (x/3)^{2}}$. Sur $\mathbb{R}$ : $\boxed{x \mapsto \frac{1}{3}\operatorname{Arctan}\frac{x}{3}}$

    • **(j)** De même $\frac{1}{\sqrt{4 - x^{2}}} = \frac{1}{2}\cdot\frac{1}{\sqrt{1 - (x/2)^{2}}}$. Sur $]-2\,,2[$ : $\boxed{x \mapsto \operatorname{Arcsin}\frac{x}{2}}$

    • **(k)** Sur $\mathbb{R}$ : $\boxed{x \mapsto \frac{1}{2}\operatorname{sh}(2x) + 3\operatorname{ch}\frac{x}{3}}$

    • **(l)** On écrit $\tan^{2} x = (1 + \tan^{2} x) - 1$. Sur $\big]-\frac{\pi}{2}\,,\frac{\pi}{2}\big[$ : $\boxed{x \mapsto \tan x - x}$

    *Piège :* en (i) et (j), on oublie souvent le facteur issu de la factorisation. Dériver le résultat le fait apparaître aussitôt : la dérivée de $\operatorname{Arctan}\frac{x}{3}$ est $\frac{1}{3}\cdot\frac{1}{1 + x^{2}/9} = \frac{3}{x^{2} + 9}$, d'où le coefficient $\frac{1}{3}$.
- id: "ma-06-02"
  feuille: "f-ma-06"
  numero: 2
  partie: "Primitives et intégrales"
  etoiles: 1
  types: [Calcul]
  mots_cles: [primitives, primitives trigonométriques]
  noeuds: [ar-tfa, ex-logarithme, ex-exponentielle, ex-croissances]
  notions: [riemann-integrable, logarithme, exponentielle]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Reconnaître une dérivée de fonction composée, et en déduire une primitive de chacune des fonctions suivantes sur un intervalle convenable.

    **(a)** $x \mapsto \dfrac{x}{1 + x^{2}}$

    **(b)** $x \mapsto \dfrac{\mathrm{e}^{3x}}{1 + \mathrm{e}^{3x}}$

    **(c)** $x \mapsto \dfrac{\ln x}{x}$

    **(d)** $x \mapsto \cos x\,\sin^{2} x$

    **(e)** $x \mapsto \dfrac{1}{x\ln x}$

    **(f)** $x \mapsto 3x\sqrt{1 + x^{2}}$

    **(g)** $x \mapsto \dfrac{\sin x}{1 + \cos^{2} x}$

    **(h)** $x \mapsto \dfrac{\cos(\ln x)}{x}$

    **(i)** $x \mapsto \dfrac{\sin x}{\cos^{3} x}$

    **(j)** $x \mapsto x\sqrt{1 - x^{2}}$

    **(k)** $x \mapsto \dfrac{1}{x(\ln x)^{4}}$

    **(l)** $x \mapsto \dfrac{x^{2}}{1 + x^{3}}$

    **(m)** $x \mapsto \dfrac{\sin(2x)}{1 + \cos^{2} x}$

    **(n)** $x \mapsto \dfrac{1}{\sqrt{x} + x}$

    **(o)** $x \mapsto \mathrm{e}^{\mathrm{e}^{x} + x}$

    **(p)** $x \mapsto \dfrac{1}{x\sqrt{1 + \ln x}}$

    **(q)** $x \mapsto (3x - 1)(3x^{2} - 2x + 3)^{3}$

    **(r)** $x \mapsto \dfrac{\mathrm{e}^{x}}{\sqrt{1 - \mathrm{e}^{2x}}}$
  corrige: |
    Dans chaque cas, on repère une fonction $u$ dont la dérivée apparaît en facteur, et l'on applique la proposition 3 du cours.

    • **(a)** $\frac{1}{2}\cdot\frac{u'}{u}$ avec $u = 1 + x^{2}$. Sur $\mathbb{R}$ : $\boxed{x \mapsto \frac{1}{2}\ln(1 + x^{2})}$

    • **(b)** $\frac{1}{3}\cdot\frac{u'}{u}$ avec $u = 1 + \mathrm{e}^{3x} > 0$. Sur $\mathbb{R}$ : $\boxed{x \mapsto \frac{1}{3}\ln(1 + \mathrm{e}^{3x})}$

    • **(c)** $u'u$ avec $u = \ln$. Sur $]0\,,+\infty[$ : $\boxed{x \mapsto \frac{(\ln x)^{2}}{2}}$

    • **(d)** $u'u^{2}$ avec $u = \sin$. Sur $\mathbb{R}$ : $\boxed{x \mapsto \frac{\sin^{3} x}{3}}$

    • **(e)** $\frac{u'}{u}$ avec $u = \ln$, qui ne s'annule pas sur $]1\,,+\infty[$. Sur cet intervalle : $\boxed{x \mapsto \ln(\ln x)}$

    • **(f)** $\frac{3}{2}u'u^{1/2}$ avec $u = 1 + x^{2}$. Sur $\mathbb{R}$ : $\boxed{x \mapsto (1 + x^{2})^{3/2}}$

    • **(g)** $-\frac{u'}{1 + u^{2}}$ avec $u = \cos$. Sur $\mathbb{R}$ : $\boxed{x \mapsto -\operatorname{Arctan}(\cos x)}$

    • **(h)** $u'\cos u$ avec $u = \ln$. Sur $]0\,,+\infty[$ : $\boxed{x \mapsto \sin(\ln x)}$

    • **(i)** $-u'u^{-3}$ avec $u = \cos$. Sur $\big]-\frac{\pi}{2}\,,\frac{\pi}{2}\big[$ : $\boxed{x \mapsto \frac{1}{2\cos^{2} x}}$

    • **(j)** $-\frac{1}{2}u'u^{1/2}$ avec $u = 1 - x^{2}$. Sur $]-1\,,1[$ : $\boxed{x \mapsto -\frac{1}{3}(1 - x^{2})^{3/2}}$

    • **(k)** $u'u^{-4}$ avec $u = \ln$. Sur $]1\,,+\infty[$ : $\boxed{x \mapsto -\frac{1}{3(\ln x)^{3}}}$

    • **(l)** $\frac{1}{3}\cdot\frac{u'}{u}$ avec $u = 1 + x^{3}$. Sur $]-1\,,+\infty[$ : $\boxed{x \mapsto \frac{1}{3}\ln(1 + x^{3})}$

    • **(m)** $-\frac{u'}{u}$ avec $u = 1 + \cos^{2} x$, car $u'(x) = -\sin(2x)$. Sur $\mathbb{R}$ : $\boxed{x \mapsto -\ln(1 + \cos^{2} x)}$

    • **(n)** On factorise $\sqrt{x}$ : $\frac{1}{\sqrt{x} + x} = 2\cdot\frac{u'}{u}$ avec $u = 1 + \sqrt{x}$, $u' = \frac{1}{2\sqrt{x}}$. Sur $]0\,,+\infty[$ : $\boxed{x \mapsto 2\ln(1 + \sqrt{x})}$

    • **(o)** $\mathrm{e}^{\mathrm{e}^{x} + x} = \mathrm{e}^{x}\,\mathrm{e}^{\mathrm{e}^{x}}$ est de la forme $u'\mathrm{e}^{u}$ avec $u = \exp$. Sur $\mathbb{R}$ : $\boxed{x \mapsto \mathrm{e}^{\mathrm{e}^{x}}}$

    • **(p)** $2\cdot\frac{u'}{2\sqrt{u}}$ avec $u = 1 + \ln x > 0$. Sur $\big]\frac{1}{\mathrm{e}}\,,+\infty\big[$ : $\boxed{x \mapsto 2\sqrt{1 + \ln x}}$

    • **(q)** $\frac{1}{2}u'u^{3}$ avec $u = 3x^{2} - 2x + 3$, puisque $u' = 2(3x - 1)$. Sur $\mathbb{R}$ : $\boxed{x \mapsto \frac{1}{8}(3x^{2} - 2x + 3)^{4}}$

    • **(r)** $\frac{u'}{\sqrt{1 - u^{2}}}$ avec $u = \exp$, qui vérifie $|u| < 1$ sur $]-\infty\,,0[$. Sur cet intervalle : $\boxed{x \mapsto \operatorname{Arcsin}(\mathrm{e}^{x})}$

    *À retenir :* les expressions (b), (g), (n) et (r) se traiteront aussi par changement de variable (exercices 18 et 19) ; reconnaître la forme $u'\,g(u)$ est le même calcul, mené sans changer de lettre.
- id: "ma-06-03"
  feuille: "f-ma-06"
  numero: 3
  partie: "Primitives et intégrales"
  etoiles: 2
  types: [Calcul]
  mots_cles: [primitives, intégrales]
  noeuds: [ar-tfa, ri-proprietes]
  notions: [riemann-integrable]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Un élève écrit : « une primitive de $x \mapsto \frac{1}{x^{2}}$ est $x \mapsto -\frac{1}{x}$, donc $\displaystyle\int_{-1}^{1} \frac{\mathrm{d} x}{x^{2}} = \Big[-\frac{1}{x}\Big]_{-1}^{1} = -2$ ». Pourquoi ce résultat est-il absurde ? Où est l'erreur ?

    **2.** Déterminer toutes les primitives de $x \mapsto \frac{1}{x}$ sur $\mathbb{R}^{*}$. Combien de constantes faut-il ?

    **3.** Déterminer la primitive de $x \mapsto \frac{1}{x^{2} - 1}$ sur $]-1\,,1[$ qui s'annule en $0$, puis les primitives de cette fonction sur $\mathbb{R} \setminus \{-1, 1\}$.
  corrige: |
    **1.** La fonction $x \mapsto \frac{1}{x^{2}}$ est strictement positive : si son intégrale sur $[-1\,,1]$ avait un sens, elle serait positive d'après la proposition 2 (iii), et non égale à $-2$. L'erreur est d'appliquer la définition de l'intégrale à une fonction qui n'est pas continue sur $[-1\,,1]$ : elle n'est même pas définie en $0$, et $x \mapsto -\frac{1}{x}$ n'est une primitive que sur $]-\infty\,,0[$ et sur $]0\,,+\infty[$, pas sur un intervalle contenant $-1$ et $1$. 
    $$\boxed{\int_{-1}^{1} \frac{\mathrm{d} x}{x^{2}} \text{ n'est pas définie : } [-1\,,1] \text{ contient } 0}$$

    **2.** Soit $F$ une primitive de $x \mapsto \frac{1}{x}$ sur $\mathbb{R}^{*}$. Sur l'intervalle $]0\,,+\infty[$, $F$ et $\ln|\cdot|$ ont la même dérivée : elles diffèrent d'une constante $c_{1}$ (proposition 1). Il en est de même sur $]-\infty\,,0[$, avec une constante $c_{2}$ qui n'a aucune raison d'être égale à $c_{1}$. Réciproquement, toute fonction de cette forme convient. 
    $$\boxed{F(x) = \begin{cases} \ln|x| + c_{2} & \text{si } x < 0 \\ \ln x + c_{1} & \text{si } x > 0 \end{cases}, \qquad (c_{1}, c_{2}) \in \mathbb{R}^{2}}$$
     Il faut donc deux constantes, une par intervalle : c'est la remarque du cours sur l'hypothèse « $I$ est un intervalle ».

    **3.** On décompose, comme dans la méthode du cours avec $x_{1} = 1$ et $x_{2} = -1$ : 
    $$\frac{1}{x^{2} - 1} = \frac{1}{2}\Big(\frac{1}{x - 1} - \frac{1}{x + 1}\Big), \qquad\text{de primitive}\qquad \frac{1}{2}\ln\Big|\frac{x - 1}{x + 1}\Big|.$$
     Sur $]-1\,,1[$, on a $\big|\frac{x - 1}{x + 1}\big| = \frac{1 - x}{1 + x}$, et cette primitive vaut $\frac{1}{2}\ln 1 = 0$ en $0$. 
    $$\boxed{x \mapsto \frac{1}{2}\ln\frac{1 - x}{1 + x}}$$
     L'ensemble $\mathbb{R} \setminus \{-1, 1\}$ est la réunion des trois intervalles $]-\infty\,,-1[$, $]-1\,,1[$ et $]1\,,+\infty[$ ; le raisonnement de la question 2 donne une constante par intervalle. 
    $$\boxed{F(x) = \frac{1}{2}\ln\Big|\frac{x - 1}{x + 1}\Big| + c_{k} \ \text{ sur le } k\text{-ième intervalle}, \qquad (c_{1}, c_{2}, c_{3}) \in \mathbb{R}^{3}}$$
- id: "ma-06-04"
  feuille: "f-ma-06"
  numero: 4
  partie: "Primitives et intégrales"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [primitives, intégrales, changement de variable]
  noeuds: [ar-tfa, ri-proprietes]
  notions: [riemann-integrable]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $f : \mathbb{R} \to \mathbb{R}$ continue. Justifier que les fonctions suivantes sont dérivables, et calculer leur dérivée.

    **(a)** $G_{1} : x \mapsto \displaystyle\int_{0}^{x^{2}} f(t)\,\mathrm{d} t$

    **(b)** $G_{2} : x \mapsto \displaystyle\int_{x}^{2x} f(t)\,\mathrm{d} t$

    **(c)** $G_{3} : x \mapsto \displaystyle\int_{0}^{x} f(t + x)\,\mathrm{d} t$

    **(d)** $G_{4} : x \mapsto \displaystyle\int_{0}^{x} (x - t)\,f(t)\,\mathrm{d} t$

    *Indication : pour $G_{3}$, effectuer d'abord un changement de variable ; pour $G_{4}$, développer.*
  corrige: |
    Soit $F$ une primitive de $f$ sur $\mathbb{R}$, qui existe d'après le théorème 1 ; elle est dérivable, de dérivée $f$. Toutes les intégrales s'expriment à l'aide de $F$, et l'on dérive des composées.

    **(a)** On a $G_{1}(x) = F(x^{2}) - F(0)$, composée de fonctions dérivables, d'où : 
    $$\boxed{G_{1}'(x) = 2x\,f(x^{2})}$$
     **(b)** On a $G_{2}(x) = F(2x) - F(x)$, d'où : 
    $$\boxed{G_{2}'(x) = 2f(2x) - f(x)}$$
     **(c)** À $x$ fixé, le changement de variable $u = t + x$ donne $G_{3}(x) = \displaystyle\int_{x}^{2x} f(u)\,\mathrm{d} u = G_{2}(x)$, d'où : 
    $$\boxed{G_{3}'(x) = 2f(2x) - f(x)}$$
     **(d)** La variable d'intégration est $t$ : le facteur $x$ sort de l'intégrale, ce qui donne 
    $$G_{4}(x) = x\int_{0}^{x} f(t)\,\mathrm{d} t - \int_{0}^{x} t\,f(t)\,\mathrm{d} t.$$
     Les deux intégrales sont des primitives de $f$ et de $t \mapsto t\,f(t)$, qui s'annulent en $0$ (proposition 2 (i)). Par la dérivée d'un produit : 
    $$G_{4}'(x) = \int_{0}^{x} f(t)\,\mathrm{d} t + x\,f(x) - x\,f(x), \qquad\text{soit}\qquad \boxed{G_{4}'(x) = \int_{0}^{x} f(t)\,\mathrm{d} t}.$$
     Ainsi $G_{4}$ est la primitive nulle en $0$ de la primitive nulle en $0$ de $f$ : c'est une « primitive seconde » de $f$.

    *Piège :* on ne peut pas dériver directement $\int_{0}^{x} (x - t)\,f(t)\,\mathrm{d} t$ en remplaçant $t$ par $x$ dans l'intégrande, ce qui donnerait $0$ : la variable $x$ figure aussi dans l'intégrande, et il faut d'abord l'en faire sortir.
- id: "ma-06-05"
  feuille: "f-ma-06"
  numero: 5
  partie: "Primitives et intégrales"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [primitives, intégrales]
  noeuds: [ar-tfa, ri-proprietes]
  notions: [riemann-integrable]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $a < b$ deux réels et $f : [a\,,b] \to \mathbb{R}$ continue.

    **1.** On suppose $f \geqslant 0$ et $\displaystyle\int_{a}^{b} f = 0$. En étudiant une primitive de $f$, montrer que $f$ est nulle.

    **2.** Déterminer les fonctions $f$ continues sur $[a\,,b]$ telles que $\displaystyle\int_{a}^{b} f = \int_{a}^{b} |f|$.

    **3.** On suppose que $\displaystyle\int_{\alpha}^{\beta} f = 0$ pour tous $\alpha$, $\beta$ de $[a\,,b]$. Montrer que $f$ est nulle.

    **4.** Montrer que si $\displaystyle\int_{a}^{b} f^{2} = 0$, alors $f = 0$. Cette conclusion subsiste-t-elle si l'on suppose seulement $\displaystyle\int_{a}^{b} f = 0$ ?
  corrige: |
    **1.** Soit $F(x) = \int_{a}^{x} f$, la primitive de $f$ nulle en $a$. Comme $F' = f \geqslant 0$, la fonction $F$ est croissante sur $[a\,,b]$ (chapitre 5). Or $F(a) = 0$ et $F(b) = \int_{a}^{b} f = 0$ : pour tout $x \in [a\,,b]$, $0 = F(a) \leqslant F(x) \leqslant F(b) = 0$. Ainsi $F$ est nulle, et $f = F'$ aussi. 
    $$\boxed{f \geqslant 0 \text{ continue et } \int_{a}^{b} f = 0 \implies f = 0}$$
     **2.** L'égalité s'écrit $\int_{a}^{b} \big(|f| - f\big) = 0$, où $|f| - f$ est continue et positive. D'après la question 1, $|f| = f$, c'est-à-dire $f \geqslant 0$ ; réciproquement, toute fonction positive convient. 
    $$\boxed{\text{les fonctions continues positives sur } [a\,,b]}$$
     **3.** La fonction $F : x \mapsto \int_{a}^{x} f$ est nulle par hypothèse, donc sa dérivée $f$ aussi. 
    $$\boxed{f = 0}$$
     **4.** La fonction $f^{2}$ est continue et positive, d'intégrale nulle : la question 1 donne $f^{2} = 0$, donc $\boxed{f = 0}$. La conclusion tombe sans le carré : sur $[a\,,b]$, la fonction $x \mapsto x - \frac{a + b}{2}$ a une intégrale nulle, comme on le vérifie avec la primitive $\frac{1}{2}\big(x - \frac{a + b}{2}\big)^{2}$, qui prend la même valeur en $a$ et en $b$, sans être nulle. 
    $$\boxed{\text{non : } \int_{a}^{b} \Big(x - \frac{a + b}{2}\Big)\,\mathrm{d} x = 0}$$

    *À retenir :* la question 1 est l'outil qui rend strictes les inégalités entre intégrales ; on l'utilise à l'exercice 8 et à l'exercice 9.
- id: "ma-06-06"
  feuille: "f-ma-06"
  numero: 6
  partie: "Primitives et intégrales"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [primitives, intégrales, primitives trigonométriques]
  noeuds: [ar-tfa, ri-proprietes]
  notions: [riemann-integrable]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $f : \mathbb{R} \to \mathbb{R}$ continue et $T > 0$.

    **1.** On suppose $f$ $T$-périodique. Montrer que $f$ admet une primitive $T$-périodique si et seulement si $\displaystyle\int_{0}^{T} f = 0$. Une primitive de $x \mapsto \cos^{2} x$ peut-elle être périodique ?

    **2.** On suppose que la fonction $x \mapsto \displaystyle\int_{x}^{x+T} f(t)\,\mathrm{d} t$ est constante. Montrer que $f$ est $T$-périodique.
  corrige: |
    **1.** Soit $F(x) = \int_{0}^{x} f$ ; les primitives de $f$ sont les $F + c$, et chacune est $T$-périodique si et seulement si $F$ l'est. Or, d'après la proposition 6 (ii), pour tout réel $x$ : 
    $$F(x + T) - F(x) = \int_{x}^{x + T} f = \int_{0}^{T} f.$$

    $$\boxed{f \text{ admet une primitive } T\text{-périodique} \iff \int_{0}^{T} f = 0}$$
     La fonction $x \mapsto \cos^{2} x$ est $\pi$-périodique et $\int_{0}^{\pi} \cos^{2} x\,\mathrm{d} x = \frac{\pi}{2} \neq 0$ ; ses primitives ne sont pas $\pi$-périodiques. Elles ne sont pas davantage $T$-périodiques pour un autre $T > 0$ : ce sont les fonctions $x \mapsto \frac{x}{2} + \frac{\sin(2x)}{4} + c$, qui tendent vers $+\infty$ en $+\infty$, alors qu'une fonction périodique continue est bornée, puisqu'elle reprend sur $\mathbb{R}$ les valeurs qu'elle prend sur une période. 
    $$\boxed{\text{non : les primitives de } \cos^{2} \text{ sont } x \mapsto \frac{x}{2} + \frac{\sin(2x)}{4} + c}$$
     **2.** Avec la même primitive $F$, la fonction $G : x \mapsto F(x + T) - F(x)$ est constante, donc sa dérivée est nulle : 
    $$G'(x) = f(x + T) - f(x) = 0, \qquad\text{d'où}\qquad \boxed{f \text{ est } T\text{-périodique}}.$$
- id: "ma-06-07"
  feuille: "f-ma-06"
  numero: 7
  partie: "Primitives et intégrales"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [primitives, intégrales, limites]
  noeuds: [ar-tfa, ri-proprietes, ar-suites]
  notions: [riemann-integrable]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    On pose, pour $x \neq 0$, $\varphi(x) = \dfrac{\operatorname{sh} x}{x}$, et $\varphi(0) = 1$, de sorte que $\varphi$ est continue sur $\mathbb{R}$ ; on pose ensuite, pour tout réel $x$, $F(x) = \displaystyle\int_{x}^{2x} \varphi(t)\,\mathrm{d} t$.

    **1.** Étudier la parité de $F$.

    **2.** Justifier que $F$ est dérivable sur $\mathbb{R}$, et montrer que $F'(x) = \dfrac{\operatorname{sh}(2x) - \operatorname{sh} x}{x}$ pour $x \neq 0$.

    **3.** En déduire les variations de $F$.
  corrige: |
    **1.** La fonction $\varphi$ est paire, car $\operatorname{sh}$ et $x \mapsto x$ sont impaires. Pour tout réel $x$, le changement de variable $t = -u$ donne 
    $$F(-x) = \int_{-x}^{-2x} \varphi(t)\,\mathrm{d} t = \int_{x}^{2x} \varphi(-u)\,(-\mathrm{d} u) = -\int_{x}^{2x} \varphi(u)\,\mathrm{d} u = -F(x).$$

    $$\boxed{F \text{ est impaire}}$$
     **2.** La fonction $\varphi$ est continue sur $\mathbb{R}$ ; soit $\Phi$ une primitive (théorème 1). Alors $F(x) = \Phi(2x) - \Phi(x)$ est dérivable, et $F'(x) = 2\varphi(2x) - \varphi(x)$. Pour $x \neq 0$ : 
    $$F'(x) = 2\,\frac{\operatorname{sh}(2x)}{2x} - \frac{\operatorname{sh} x}{x}, \qquad\text{soit}\qquad \boxed{F'(x) = \frac{\operatorname{sh}(2x) - \operatorname{sh} x}{x}},$$
     et $F'(0) = 2\varphi(0) - \varphi(0) = 1$.

    **3.** La fonction $\operatorname{sh}$ est strictement croissante. Pour $x > 0$, on a $2x > x$, donc $\operatorname{sh}(2x) > \operatorname{sh} x$ et $F'(x) > 0$ ; pour $x < 0$, on a $2x < x$, donc $\operatorname{sh}(2x) - \operatorname{sh} x < 0$, et le quotient par $x < 0$ est encore strictement positif. Avec $F'(0) = 1$, on obtient $F' > 0$ sur $\mathbb{R}$. 
    $$\boxed{F \text{ est strictement croissante sur } \mathbb{R}, \text{ avec } F(0) = 0}$$

    ![Figure](documents/figures/0bdcd44322335e52.svg)

    La courbe de $F$, tracée à partir de valeurs approchées des intégrales, est symétrique par rapport à l'origine et tangente en $0$ à la droite $y = x$, puisque $F'(0) = 1$ ; sa croissance devient très rapide, comme celle de $\operatorname{sh}$.
- id: "ma-06-08"
  feuille: "f-ma-06"
  numero: 8
  partie: "Primitives et intégrales"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [primitives, intégrales]
  noeuds: [ar-tfa, ri-proprietes]
  notions: [riemann-integrable]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    *Encadrements d'intégrales.*

    **1.** Montrer que, pour tout entier $n \geqslant 1$, $\displaystyle 1 - \frac{1}{n + 1} \leqslant \int_{0}^{1} \frac{\mathrm{d} t}{1 + t^{n}} \leqslant 1$.

    **2.** Montrer que, pour tout entier $n \geqslant 0$, $\displaystyle \frac{1}{n + 1} \leqslant \int_{0}^{1} \Big(\frac{1 + t^{2}}{2}\Big)^{n}\mathrm{d} t \leqslant \frac{2}{n + 1}$.

    **3.** En comparant $\dfrac{1}{x}$ et $\dfrac{1}{\mathrm{e}}$ sur $[\mathrm{e}\,,\pi]$, montrer que $\displaystyle\int_{\mathrm{e}}^{\pi} \frac{\mathrm{d} x}{x} < \frac{\pi - \mathrm{e}}{\mathrm{e}}$, puis que $\pi^{\mathrm{e}} < \mathrm{e}^{\pi}$.
  corrige: |
    **1.** Pour $t \in [0\,,1]$, on a $0 \leqslant t^{n} \leqslant 1$, donc $\frac{1}{1 + t^{n}} \leqslant 1$. D'autre part $(1 - t^{n})(1 + t^{n}) = 1 - t^{2n} \leqslant 1$, d'où $1 - t^{n} \leqslant \frac{1}{1 + t^{n}}$. Par croissance de l'intégrale (proposition 2 (iii)) : 
    $$\int_{0}^{1} (1 - t^{n})\,\mathrm{d} t = 1 - \frac{1}{n + 1}, \qquad\text{donc}\qquad \boxed{1 - \frac{1}{n + 1} \leqslant \int_{0}^{1} \frac{\mathrm{d} t}{1 + t^{n}} \leqslant 1}.$$
     Par encadrement, l'intégrale tend vers $1$ quand $n$ tend vers $+\infty$ : la fonction $t \mapsto \frac{1}{1 + t^{n}}$ vaut presque $1$ sur $[0\,,1[$ dès que $n$ est grand.

    **2.** Pour la minoration, on compare à $t$ : $\frac{1 + t^{2}}{2} - t = \frac{(1 - t)^{2}}{2} \geqslant 0$, donc $\big(\frac{1 + t^{2}}{2}\big)^{n} \geqslant t^{n}$, d'intégrale $\frac{1}{n + 1}$. Pour la majoration, $t^{2} \leqslant t$ sur $[0\,,1]$, donc $\frac{1 + t^{2}}{2} \leqslant \frac{1 + t}{2}$, et l'on calcule avec la primitive $\frac{2}{n + 1}\big(\frac{1 + t}{2}\big)^{n + 1}$ : 
    $$\int_{0}^{1} \Big(\frac{1 + t}{2}\Big)^{n}\mathrm{d} t = \frac{2}{n + 1}\Big(1 - \frac{1}{2^{n + 1}}\Big) \leqslant \frac{2}{n + 1}.$$

    $$\boxed{\frac{1}{n + 1} \leqslant \int_{0}^{1} \Big(\frac{1 + t^{2}}{2}\Big)^{n}\mathrm{d} t \leqslant \frac{2}{n + 1}}$$
     **3.** Pour $x \in [\mathrm{e}\,,\pi]$, on a $\frac{1}{x} \leqslant \frac{1}{\mathrm{e}}$, avec égalité seulement en $\mathrm{e}$. La fonction $x \mapsto \frac{1}{\mathrm{e}} - \frac{1}{x}$ est continue, positive et non nulle sur $[\mathrm{e}\,,\pi]$ : son intégrale est strictement positive d'après l'exercice 5, question 1. 
    $$\int_{\mathrm{e}}^{\pi} \frac{\mathrm{d} x}{x} = \ln\pi - 1 < \frac{\pi - \mathrm{e}}{\mathrm{e}} = \frac{\pi}{\mathrm{e}} - 1.$$
     On obtient $\ln\pi < \frac{\pi}{\mathrm{e}}$, soit $\mathrm{e}\ln\pi < \pi$, et l'on compose par la fonction $\exp$, strictement croissante. 
    $$\boxed{\pi^{\mathrm{e}} < \mathrm{e}^{\pi}}$$
     Numériquement, $\pi^{\mathrm{e}} \approx 22{,}46$ et $\mathrm{e}^{\pi} \approx 23{,}14$ : l'écart est faible, ce qui rend cette comparaison difficile à obtenir autrement.
- id: "ma-06-09"
  feuille: "f-ma-06"
  numero: 9
  partie: "Primitives et intégrales"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [primitives, intégrales, fractions rationnelles]
  noeuds: [ar-tfa, ri-proprietes]
  notions: [riemann-integrable]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    *$\pi$ est plus petit que $\frac{22}{7}$.*

    **1.** Vérifier que $x^{4}(1 - x)^{4} = (1 + x^{2})(x^{6} - 4x^{5} + 5x^{4} - 4x^{2} + 4) - 4$.

    **2.** En déduire que $\displaystyle\int_{0}^{1} \frac{x^{4}(1 - x)^{4}}{1 + x^{2}}\,\mathrm{d} x = \frac{22}{7} - \pi$, puis que $\pi < \dfrac{22}{7}$.

    **3.** Calculer $\displaystyle\int_{0}^{1} x^{4}(1 - x)^{4}\,\mathrm{d} x$, et en encadrant $\frac{1}{1 + x^{2}}$ sur $[0\,,1]$, montrer que $\dfrac{1979}{630} \leqslant \pi \leqslant \dfrac{3959}{1260}$. Quelle précision obtient-on ainsi ?
  corrige: |
    **1.** On développe les deux membres : 
    $$x^{4}(1 - x)^{4} = x^{8} - 4x^{7} + 6x^{6} - 4x^{5} + x^{4},$$

    $$(1 + x^{2})(x^{6} - 4x^{5} + 5x^{4} - 4x^{2} + 4) - 4 = x^{8} - 4x^{7} + 6x^{6} - 4x^{5} + x^{4}. \quad \checkmark$$
     **2.** En divisant par $1 + x^{2}$, on obtient la somme d'un polynôme et d'une fraction, que l'on intègre terme à terme : 
    $$\int_{0}^{1} \frac{x^{4}(1 - x)^{4}}{1 + x^{2}}\,\mathrm{d} x = \int_{0}^{1} (x^{6} - 4x^{5} + 5x^{4} - 4x^{2} + 4)\,\mathrm{d} x - 4\int_{0}^{1} \frac{\mathrm{d} x}{1 + x^{2}} = \frac{1}{7} - \frac{2}{3} + 1 - \frac{4}{3} + 4 - \pi.$$

    $$\boxed{\int_{0}^{1} \frac{x^{4}(1 - x)^{4}}{1 + x^{2}}\,\mathrm{d} x = \frac{22}{7} - \pi}$$
     L'intégrande est continue, positive et non nulle sur $[0\,,1]$ : d'après l'exercice 5, l'intégrale est strictement positive. 
    $$\boxed{\pi < \frac{22}{7}}$$
     **3.** On développe : $\int_{0}^{1} (x^{8} - 4x^{7} + 6x^{6} - 4x^{5} + x^{4})\,\mathrm{d} x = \frac{1}{9} - \frac{1}{2} + \frac{6}{7} - \frac{2}{3} + \frac{1}{5}$. 
    $$\boxed{\int_{0}^{1} x^{4}(1 - x)^{4}\,\mathrm{d} x = \frac{1}{630}}$$
     Pour $x \in [0\,,1]$, on a $\frac{1}{2} \leqslant \frac{1}{1 + x^{2}} \leqslant 1$ ; en multipliant par $x^{4}(1 - x)^{4} \geqslant 0$ et en intégrant, on obtient 
    $$\frac{1}{1260} \leqslant \frac{22}{7} - \pi \leqslant \frac{1}{630}.$$
     Comme $\frac{22}{7} = \frac{1980}{630} = \frac{3960}{1260}$, on en déduit : 
    $$\boxed{\frac{1979}{630} \leqslant \pi \leqslant \frac{3959}{1260}}$$
     L'encadrement est de longueur $\frac{1}{1260} \approx 8 \cdot 10^{-4}$ : il donne $3{,}1412 \leqslant \pi \leqslant 3{,}1421$, donc les trois premières décimales de $\pi$.

    *À retenir :* cette intégrale, publiée par D. P. Dalzell en 1944, montre que l'approximation d'Archimède $\frac{22}{7}$ est un majorant de $\pi$, et l'écart est l'aire d'un domaine que l'on sait calculer exactement.
- id: "ma-06-10"
  feuille: "f-ma-06"
  numero: 10
  partie: "Calcul de primitives et d'intégrales"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["calcul de primitives et d'intégrales", intégrales, primitives trigonométriques]
  noeuds: [ar-tfa, ri-proprietes, ex-logarithme, ex-exponentielle, ex-croissances]
  notions: [riemann-integrable, logarithme, exponentielle]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Calculer les intégrales suivantes.

    **(a)** $\displaystyle\int_{0}^{\pi/3} (1 - \cos 3x)\,\mathrm{d} x$

    **(b)** $\displaystyle\int_{0}^{\sqrt{\pi}} x\sin(x^{2})\,\mathrm{d} x$

    **(c)** $\displaystyle\int_{1}^{2} \frac{\sqrt{\ln x}}{x}\,\mathrm{d} x$

    **(d)** $\displaystyle\int_{0}^{\pi/4} \tan x\,\mathrm{d} x$

    **(e)** $\displaystyle\int_{0}^{1} \frac{x}{1 + x^{4}}\,\mathrm{d} x$

    **(f)** $\displaystyle\int_{0}^{\ln 3} \frac{\mathrm{e}^{x}}{1 + \mathrm{e}^{x}}\,\mathrm{d} x$

    **(g)** $\displaystyle\int_{\mathrm{e}}^{\mathrm{e}^{2}} \frac{\mathrm{d} x}{x\ln x}$

    **(h)** $\displaystyle\int_{0}^{\pi/2} \sin^{2} x\,\cos x\,\mathrm{d} x$
  corrige: |
    Chaque intégrande est une dérivée usuelle ou une dérivée composée (proposition 3).

    **(a)** Une primitive est $x \mapsto x - \frac{1}{3}\sin(3x)$, et $\sin\pi = 0$. 
    $$\int_{0}^{\pi/3} (1 - \cos 3x)\,\mathrm{d} x = \Big[x - \frac{\sin 3x}{3}\Big]_{0}^{\pi/3} = \boxed{\frac{\pi}{3}}$$
     **(b)** C'est $\frac{1}{2}u'\sin u$ avec $u = x^{2}$. 
    $$\int_{0}^{\sqrt{\pi}} x\sin(x^{2})\,\mathrm{d} x = \Big[-\frac{1}{2}\cos(x^{2})\Big]_{0}^{\sqrt{\pi}} = \frac{1}{2} + \frac{1}{2} = \boxed{1}$$
     **(c)** C'est $u'u^{1/2}$ avec $u = \ln$. 
    $$\int_{1}^{2} \frac{\sqrt{\ln x}}{x}\,\mathrm{d} x = \Big[\frac{2}{3}(\ln x)^{3/2}\Big]_{1}^{2} = \boxed{\frac{2}{3}(\ln 2)^{3/2}}$$
     **(d)** C'est $-\frac{u'}{u}$ avec $u = \cos > 0$ sur $\big[0\,,\frac{\pi}{4}\big]$. 
    $$\int_{0}^{\pi/4} \tan x\,\mathrm{d} x = \big[-\ln\cos x\big]_{0}^{\pi/4} = -\ln\frac{\sqrt{2}}{2} = \boxed{\frac{\ln 2}{2}}$$
     **(e)** C'est $\frac{1}{2}\cdot\frac{u'}{1 + u^{2}}$ avec $u = x^{2}$. 
    $$\int_{0}^{1} \frac{x}{1 + x^{4}}\,\mathrm{d} x = \Big[\frac{1}{2}\operatorname{Arctan}(x^{2})\Big]_{0}^{1} = \boxed{\frac{\pi}{8}}$$
     **(f)** C'est $\frac{u'}{u}$ avec $u = 1 + \mathrm{e}^{x}$. 
    $$\int_{0}^{\ln 3} \frac{\mathrm{e}^{x}}{1 + \mathrm{e}^{x}}\,\mathrm{d} x = \big[\ln(1 + \mathrm{e}^{x})\big]_{0}^{\ln 3} = \ln 4 - \ln 2 = \boxed{\ln 2}$$
     **(g)** C'est $\frac{u'}{u}$ avec $u = \ln > 0$ sur $[\mathrm{e}\,,\mathrm{e}^{2}]$. 
    $$\int_{\mathrm{e}}^{\mathrm{e}^{2}} \frac{\mathrm{d} x}{x\ln x} = \big[\ln(\ln x)\big]_{\mathrm{e}}^{\mathrm{e}^{2}} = \ln 2 - \ln 1 = \boxed{\ln 2}$$
     **(h)** C'est $u'u^{2}$ avec $u = \sin$. 
    $$\int_{0}^{\pi/2} \sin^{2} x\cos x\,\mathrm{d} x = \Big[\frac{\sin^{3} x}{3}\Big]_{0}^{\pi/2} = \boxed{\frac{1}{3}}$$
- id: "ma-06-11"
  feuille: "f-ma-06"
  numero: 11
  partie: "Calcul de primitives et d'intégrales"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["calcul de primitives et d'intégrales", primitives, fractions rationnelles]
  noeuds: [ar-tfa]
  notions: []
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Déterminer une primitive des fonctions rationnelles suivantes, sur un intervalle ne contenant aucune racine du dénominateur.

    **(a)** $\dfrac{1}{x^{2} - 7x + 10}$

    **(b)** $\dfrac{x + 1}{x^{2} - 7x + 10}$

    **(c)** $\dfrac{1}{x^{2} - 6x + 9}$

    **(d)** $\dfrac{1}{x^{2} - x + 1}$

    **(e)** $\dfrac{1}{2x^{2} + x + 1}$

    **(f)** $\dfrac{1}{x^{2} + 4x + 5}$

    **(g)** $\dfrac{x + 4}{x^{2} + 1}$

    **(h)** $\dfrac{3x + 2}{x^{2} + x + 1}$

    **(i)** $\dfrac{2x + 1}{x^{2} + x - 3}$
  corrige: |
    On applique la méthode du cours pour les fractions $\frac{1}{ax^{2} + bx + c}$, après avoir fait apparaître, s'il y a lieu, la dérivée du dénominateur au numérateur.

    **(a)** $\Delta = 9 > 0$ et $x^{2} - 7x + 10 = (x - 2)(x - 5)$, d'où $\frac{1}{(x - 2)(x - 5)} = \frac{1}{3}\Big(\frac{1}{x - 5} - \frac{1}{x - 2}\Big)$. 
    $$\boxed{x \mapsto \frac{1}{3}\ln\Big|\frac{x - 5}{x - 2}\Big|}$$
     **(b)** On cherche $\frac{x + 1}{(x - 2)(x - 5)} = \frac{\alpha}{x - 2} + \frac{\beta}{x - 5}$ : en multipliant par $x - 2$ puis en faisant $x = 2$, $\alpha = \frac{3}{-3} = -1$ ; de même $\beta = \frac{6}{3} = 2$. 
    $$\boxed{x \mapsto 2\ln|x - 5| - \ln|x - 2|}$$
     **(c)** $\Delta = 0$ et $x^{2} - 6x + 9 = (x - 3)^{2}$. 
    $$\boxed{x \mapsto -\frac{1}{x - 3}}$$
     **(d)** $\Delta = -3$ et $x^{2} - x + 1 = \big(x - \frac{1}{2}\big)^{2} + \big(\frac{\sqrt{3}}{2}\big)^{2}$. 
    $$\boxed{x \mapsto \frac{2}{\sqrt{3}}\operatorname{Arctan}\frac{2x - 1}{\sqrt{3}}}$$
     **(e)** $\Delta = -7$ et $2x^{2} + x + 1 = 2\Big(\big(x + \frac{1}{4}\big)^{2} + \big(\frac{\sqrt{7}}{4}\big)^{2}\Big)$, d'où une primitive $\frac{1}{2}\cdot\frac{4}{\sqrt{7}}\operatorname{Arctan}\frac{4x + 1}{\sqrt{7}}$. 
    $$\boxed{x \mapsto \frac{2}{\sqrt{7}}\operatorname{Arctan}\frac{4x + 1}{\sqrt{7}}}$$
     **(f)** $x^{2} + 4x + 5 = (x + 2)^{2} + 1$. 
    $$\boxed{x \mapsto \operatorname{Arctan}(x + 2)}$$
     **(g)** On sépare : $\frac{x + 4}{x^{2} + 1} = \frac{1}{2}\cdot\frac{2x}{x^{2} + 1} + \frac{4}{x^{2} + 1}$. 
    $$\boxed{x \mapsto \frac{1}{2}\ln(x^{2} + 1) + 4\operatorname{Arctan} x}$$
     **(h)** On fait apparaître $2x + 1$ : $3x + 2 = \frac{3}{2}(2x + 1) + \frac{1}{2}$, et l'on traite le reste comme en (d). 
    $$\boxed{x \mapsto \frac{3}{2}\ln(x^{2} + x + 1) + \frac{1}{\sqrt{3}}\operatorname{Arctan}\frac{2x + 1}{\sqrt{3}}}$$
     **(i)** Le numérateur est exactement la dérivée du dénominateur : inutile de décomposer. 
    $$\boxed{x \mapsto \ln|x^{2} + x - 3|}$$

    *Piège :* en (i), le discriminant $13$ est positif et l'on serait tenté de factoriser, ce qui mène à des racines $\frac{-1 \pm \sqrt{13}}{2}$ et à un calcul pénible ; il faut toujours regarder d'abord si le numérateur est la dérivée du dénominateur.
- id: "ma-06-12"
  feuille: "f-ma-06"
  numero: 12
  partie: "Calcul de primitives et d'intégrales"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["calcul de primitives et d'intégrales", primitives, fractions rationnelles]
  noeuds: [ar-tfa]
  notions: []
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Pour chacune des fonctions suivantes, déterminer des réels $a$, $b$, $c$, $d$ tels que l'égalité indiquée soit vraie, puis en déduire une primitive sur l'intervalle indiqué.

    **(a)** $\dfrac{5x^{2} + 21x + 22}{(x - 1)(x + 3)^{2}} = \dfrac{a}{x - 1} + \dfrac{b}{x + 3} + \dfrac{c}{(x + 3)^{2}}$ sur $]1\,,+\infty[$ ; on donnera la primitive qui s'annule en $2$.

    **(b)** $\dfrac{2x^{2} - 3x + 4}{(x - 1)^{2}} = a + \dfrac{b}{x - 1} + \dfrac{c}{(x - 1)^{2}}$ sur $]1\,,+\infty[$.

    **(c)** $\dfrac{x}{(x^{2} - 4)^{2}} = \dfrac{a}{(x - 2)^{2}} + \dfrac{b}{(x + 2)^{2}}$ sur $]2\,,+\infty[$ ; retrouver le résultat en reconnaissant une dérivée composée.

    **(d)** $\dfrac{1}{1 - x^{4}} = \dfrac{a}{1 - x} + \dfrac{b}{1 + x} + \dfrac{c}{1 + x^{2}}$ sur $]-1\,,1[$.
  corrige: |
    **(a)** En multipliant par $x - 1$ et en faisant $x = 1$, on obtient $a = \frac{48}{16} = 3$ ; en multipliant par $(x + 3)^{2}$ et en faisant $x = -3$, $c = \frac{45 - 63 + 22}{-4} = -1$ ; enfin, en multipliant par $x$ et en faisant tendre $x$ vers $+\infty$, $5 = a + b$, soit $b = 2$. 
    $$\boxed{\frac{5x^{2} + 21x + 22}{(x - 1)(x + 3)^{2}} = \frac{3}{x - 1} + \frac{2}{x + 3} - \frac{1}{(x + 3)^{2}}}$$
     Une primitive sur $]1\,,+\infty[$ est $x \mapsto 3\ln(x - 1) + 2\ln(x + 3) + \frac{1}{x + 3}$, qui vaut $2\ln 5 + \frac{1}{5}$ en $2$. 
    $$\boxed{x \mapsto 3\ln(x - 1) + 2\ln\frac{x + 3}{5} + \frac{1}{x + 3} - \frac{1}{5}}$$
     **(b)** On pose $u = x - 1$ : $2x^{2} - 3x + 4 = 2(u + 1)^{2} - 3(u + 1) + 4 = 2u^{2} + u + 3$, d'où, en divisant par $u^{2}$, $a = 2$, $b = 1$, $c = 3$. 
    $$\boxed{\frac{2x^{2} - 3x + 4}{(x - 1)^{2}} = 2 + \frac{1}{x - 1} + \frac{3}{(x - 1)^{2}}} \qquad \boxed{x \mapsto 2x + \ln(x - 1) - \frac{3}{x - 1}}$$
     **(c)** On a $(x^{2} - 4)^{2} = (x - 2)^{2}(x + 2)^{2}$. En multipliant par $(x - 2)^{2}$ et en faisant $x = 2$, $a = \frac{2}{16} = \frac{1}{8}$ ; de même $b = \frac{-2}{16} = -\frac{1}{8}$. On vérifie : $\frac{1}{8}\cdot\frac{(x + 2)^{2} - (x - 2)^{2}}{(x^{2} - 4)^{2}} = \frac{1}{8}\cdot\frac{8x}{(x^{2} - 4)^{2}}$. ✓ 
    $$\boxed{\frac{x}{(x^{2} - 4)^{2}} = \frac{1}{8(x - 2)^{2}} - \frac{1}{8(x + 2)^{2}}} \qquad \boxed{x \mapsto -\frac{1}{8(x - 2)} + \frac{1}{8(x + 2)} = -\frac{1}{2(x^{2} - 4)}}$$
     On retrouve ce résultat directement, puisque $\frac{x}{(x^{2} - 4)^{2}} = \frac{1}{2}\,u'u^{-2}$ avec $u = x^{2} - 4$, de primitive $-\frac{1}{2u}$.

    **(d)** En multipliant par $1 - x$ et en faisant $x = 1$, $a = \frac{1}{(1 + 1)(1 + 1)} = \frac{1}{4}$ ; de même $b = \frac{1}{4}$ ; et $x = 0$ donne $1 = a + b + c$, soit $c = \frac{1}{2}$. 
    $$\boxed{\frac{1}{1 - x^{4}} = \frac{1}{4(1 - x)} + \frac{1}{4(1 + x)} + \frac{1}{2(1 + x^{2})}} \qquad \boxed{x \mapsto \frac{1}{4}\ln\frac{1 + x}{1 - x} + \frac{1}{2}\operatorname{Arctan} x}$$

    *À retenir :* la technique « multiplier par le facteur, puis évaluer en sa racine » donne directement le coefficient des termes de plus haut degré ; les autres s'obtiennent par une valeur particulière ou par un comportement en $+\infty$. Le chapitre 13 en fera une méthode générale.
- id: "ma-06-13"
  feuille: "f-ma-06"
  numero: 13
  partie: "Calcul de primitives et d'intégrales"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["calcul de primitives et d'intégrales", intégrales, fractions rationnelles]
  noeuds: [ar-tfa, ri-proprietes]
  notions: [riemann-integrable]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Calculer les intégrales suivantes, en décomposant ou en mettant sous forme canonique.

    **(a)** $\displaystyle\int_{2}^{3} \frac{t + 1}{t(t^{2} - 1)}\,\mathrm{d} t$

    **(b)** $\displaystyle\int_{3}^{4} \frac{\mathrm{d} x}{x^{2} - 3x + 2}$

    **(c)** $\displaystyle\int_{-1}^{1} \frac{\mathrm{d} x}{x^{2} + 2x + 5}$
  corrige: |
    **(a)** On simplifie d'abord : $t^{2} - 1 = (t - 1)(t + 1)$, donc $\frac{t + 1}{t(t^{2} - 1)} = \frac{1}{t(t - 1)} = \frac{1}{t - 1} - \frac{1}{t}$. 
    $$\int_{2}^{3} \frac{t + 1}{t(t^{2} - 1)}\,\mathrm{d} t = \Big[\ln\frac{t - 1}{t}\Big]_{2}^{3} = \ln\frac{2}{3} - \ln\frac{1}{2} = \boxed{\ln\frac{4}{3}}$$
     **(b)** C'est le premier exemple du cours : $\frac{1}{x^{2} - 3x + 2} = \frac{1}{x - 2} - \frac{1}{x - 1}$. 
    $$\int_{3}^{4} \frac{\mathrm{d} x}{x^{2} - 3x + 2} = \Big[\ln\frac{x - 2}{x - 1}\Big]_{3}^{4} = \boxed{\ln\frac{4}{3}}$$
     **(c)** C'est le second exemple du cours : $x^{2} + 2x + 5 = (x + 1)^{2} + 4$. 
    $$\int_{-1}^{1} \frac{\mathrm{d} x}{x^{2} + 2x + 5} = \Big[\frac{1}{2}\operatorname{Arctan}\frac{x + 1}{2}\Big]_{-1}^{1} = \boxed{\frac{\pi}{8}}$$
     Les intégrales (a) et (b) sont égales sans que ce soit un hasard : le changement de variable $x = t + 1$ transforme l'une en l'autre.
- id: "ma-06-14"
  feuille: "f-ma-06"
  numero: 14
  partie: "Calcul de primitives et d'intégrales"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["calcul de primitives et d'intégrales", primitives, intégrales, intégration par parties, primitives trigonométriques]
  noeuds: [ar-tfa, ri-moyenne, ri-proprietes, cx-exponentielle]
  notions: [riemann-integrable]
  page_enonce: 4
  page_corrige: 10
  enonce: |
    **1.** Déterminer une primitive de $x \mapsto \mathrm{e}^{2x}\sin(3x)$ et de $x \mapsto \operatorname{ch} x\cos x$ de deux façons : à l'aide de l'exponentielle complexe, puis par deux intégrations par parties successives.

    **2.** Calculer $\displaystyle\int_{0}^{\pi} \mathrm{e}^{x}\sin(2x)\,\mathrm{d} x$ et $\displaystyle\int_{0}^{2\pi} \mathrm{e}^{-x}\sin^{2} x\,\mathrm{d} x$.

    **3.** Déterminer une primitive de $x \mapsto \sin^{5} x$, de $x \mapsto \cos^{4} x\sin^{2} x$ et de $x \mapsto \cos(3x)\cos^{3} x$.

    **4.** Calculer la valeur moyenne $\displaystyle\frac{1}{2\pi}\int_{0}^{2\pi} \cos t\,\cos(2t)\,\cos(3t)\,\mathrm{d} t$.
  corrige: |
    **1.** *Par l'exponentielle complexe.* On a $\mathrm{e}^{2x}\sin(3x) = \operatorname{Im}\big(\mathrm{e}^{(2 + 3\mathrm{i})x}\big)$, et une primitive de $\mathrm{e}^{(2 + 3\mathrm{i})x}$ est 
    $$\frac{\mathrm{e}^{(2 + 3\mathrm{i})x}}{2 + 3\mathrm{i}} = \frac{2 - 3\mathrm{i}}{13}\,\mathrm{e}^{2x}\big(\cos(3x) + \mathrm{i}\sin(3x)\big),$$
     dont la partie imaginaire est $\frac{\mathrm{e}^{2x}}{13}\big(2\sin(3x) - 3\cos(3x)\big)$. 
    $$\boxed{\int^{x} \mathrm{e}^{2t}\sin(3t)\,\mathrm{d} t = \frac{\mathrm{e}^{2x}}{13}\big(2\sin(3x) - 3\cos(3x)\big)}$$
     *Par parties.* Notons $S = \int^{x} \mathrm{e}^{2t}\sin(3t)\,\mathrm{d} t$ et $C = \int^{x} \mathrm{e}^{2t}\cos(3t)\,\mathrm{d} t$. En primitivant l'exponentielle, deux intégrations par parties donnent 
    $$S = \frac{\mathrm{e}^{2x}}{2}\sin(3x) - \frac{3}{2}\,C \qquad\text{et}\qquad C = \frac{\mathrm{e}^{2x}}{2}\cos(3x) + \frac{3}{2}\,S,$$
     d'où $S = \frac{\mathrm{e}^{2x}}{2}\sin(3x) - \frac{3\mathrm{e}^{2x}}{4}\cos(3x) - \frac{9}{4}S$, soit $\frac{13}{4}S = \frac{\mathrm{e}^{2x}}{4}\big(2\sin(3x) - 3\cos(3x)\big)$ : on retrouve le résultat.

    Pour la seconde fonction, $\operatorname{ch} x\cos x = \frac{1}{2}\operatorname{Re}\big(\mathrm{e}^{(1 + \mathrm{i})x} + \mathrm{e}^{(-1 + \mathrm{i})x}\big)$. Les primitives $\frac{\mathrm{e}^{(1 + \mathrm{i})x}}{1 + \mathrm{i}} = \frac{1 - \mathrm{i}}{2}\mathrm{e}^{(1 + \mathrm{i})x}$ et $\frac{\mathrm{e}^{(-1 + \mathrm{i})x}}{-1 + \mathrm{i}} = -\frac{1 + \mathrm{i}}{2}\mathrm{e}^{(-1 + \mathrm{i})x}$ ont pour parties réelles $\frac{\mathrm{e}^{x}}{2}(\cos x + \sin x)$ et $\frac{\mathrm{e}^{-x}}{2}(\sin x - \cos x)$. En regroupant les termes en $\cos x$ et en $\sin x$ : 
    $$\boxed{\int^{x} \operatorname{ch} t\cos t\,\mathrm{d} t = \frac{1}{2}\big(\operatorname{sh} x\cos x + \operatorname{ch} x\sin x\big)}$$
     Deux intégrations par parties, en primitivant $\operatorname{ch}$ puis $\operatorname{sh}$, donnent 
    $$\int^{x} \operatorname{ch} t\cos t\,\mathrm{d} t = \operatorname{sh} x\cos x + \operatorname{ch} x\sin x - \int^{x} \operatorname{ch} t\cos t\,\mathrm{d} t,$$
     d'où le même résultat. La méthode complexe évite de résoudre une équation en l'intégrale cherchée.

    **2.** Une primitive de $\mathrm{e}^{(1 + 2\mathrm{i})x}$ est $\frac{\mathrm{e}^{(1 + 2\mathrm{i})x}}{1 + 2\mathrm{i}}$, et $\mathrm{e}^{(1 + 2\mathrm{i})\pi} = \mathrm{e}^{\pi}$ : 
    $$\int_{0}^{\pi} \mathrm{e}^{x}\sin(2x)\,\mathrm{d} x = \operatorname{Im}\frac{\mathrm{e}^{\pi} - 1}{1 + 2\mathrm{i}} = \operatorname{Im}\frac{(\mathrm{e}^{\pi} - 1)(1 - 2\mathrm{i})}{5} = \boxed{\frac{2}{5}\,(1 - \mathrm{e}^{\pi})}.$$
     Pour la seconde, on linéarise $\sin^{2} x = \frac{1 - \cos(2x)}{2}$, et l'on calcule de même 
    $$\int_{0}^{2\pi} \mathrm{e}^{-x}\cos(2x)\,\mathrm{d} x = \operatorname{Re}\frac{\mathrm{e}^{-2\pi} - 1}{-1 + 2\mathrm{i}} = \frac{1 - \mathrm{e}^{-2\pi}}{5},$$
     d'où 
    $$\int_{0}^{2\pi} \mathrm{e}^{-x}\sin^{2} x\,\mathrm{d} x = \frac{1 - \mathrm{e}^{-2\pi}}{2} - \frac{1 - \mathrm{e}^{-2\pi}}{10} = \boxed{\frac{2}{5}\,(1 - \mathrm{e}^{-2\pi})}.$$
     La première intégrale est négative, ce qu'il est bon de vérifier : sur $\big[\frac{\pi}{2}\,,\pi\big]$, où $\sin(2x) \leqslant 0$, le facteur $\mathrm{e}^{x}$ est le plus grand.

    **3.** Pour $\sin^{5} x$, on isole un facteur $\sin x$ et l'on écrit $\sin^{4} x = (1 - \cos^{2} x)^{2}$ : l'intégrande devient $\sin x\,(1 - 2\cos^{2} x + \cos^{4} x)$, de la forme $-u'(1 - 2u^{2} + u^{4})$ avec $u = \cos$. 
    $$\boxed{\int^{x} \sin^{5} t\,\mathrm{d} t = -\cos x + \frac{2}{3}\cos^{3} x - \frac{1}{5}\cos^{5} x}$$
     Pour $\cos^{4} x\sin^{2} x = (\sin x\cos x)^{2}\cos^{2} x = \frac{\sin^{2}(2x)}{4}\cdot\frac{1 + \cos(2x)}{2}$, on obtient $\frac{1 - \cos(4x)}{16} + \frac{1}{8}\sin^{2}(2x)\cos(2x)$, le dernier terme étant de la forme $\frac{1}{16}u'u^{2}$ avec $u = \sin(2x)$. 
    $$\boxed{\int^{x} \cos^{4} t\sin^{2} t\,\mathrm{d} t = \frac{x}{16} - \frac{\sin(4x)}{64} + \frac{\sin^{3}(2x)}{48}}$$
     Pour la troisième, $\cos^{3} x = \frac{3\cos x + \cos(3x)}{4}$ (chapitre 4), d'où 
    $$\cos(3x)\cos^{3} x = \frac{3}{4}\cos(3x)\cos x + \frac{1}{4}\cos^{2}(3x) = \frac{3}{8}\big(\cos(4x) + \cos(2x)\big) + \frac{1 + \cos(6x)}{8}.$$

    $$\boxed{\int^{x} \cos(3t)\cos^{3} t\,\mathrm{d} t = \frac{x}{8} + \frac{3\sin(2x)}{16} + \frac{3\sin(4x)}{32} + \frac{\sin(6x)}{48}}$$
     **4.** On linéarise : $\cos t\cos(3t) = \frac{1}{2}\big(\cos(4t) + \cos(2t)\big)$, puis, en multipliant par $\cos(2t)$, 
    $$\cos t\cos(2t)\cos(3t) = \frac{1}{4}\big(1 + \cos(2t) + \cos(4t) + \cos(6t)\big).$$
     Chaque cosinus a une intégrale nulle sur $[0\,,2\pi]$, et il ne reste que la constante. 
    $$\boxed{\frac{1}{2\pi}\int_{0}^{2\pi} \cos t\cos(2t)\cos(3t)\,\mathrm{d} t = \frac{1}{4}}$$
- id: "ma-06-15"
  feuille: "f-ma-06"
  numero: 15
  partie: "Calcul de primitives et d'intégrales"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["calcul de primitives et d'intégrales", intégrales, intégration par parties, primitives trigonométriques, fractions rationnelles]
  noeuds: [ar-tfa, ri-proprietes, ex-logarithme, ex-exponentielle, ex-croissances, tg-arctan]
  notions: [riemann-integrable, arc-tangente, logarithme, exponentielle, cosinus-sinus]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Calculer les intégrales suivantes à l'aide d'une ou de plusieurs intégrations par parties.

    **(a)** $\displaystyle\int_{0}^{1} t^{2}\mathrm{e}^{t}\,\mathrm{d} t$

    **(b)** $\displaystyle\int_{1}^{\mathrm{e}} t^{2}\ln t\,\mathrm{d} t$

    **(c)** $\displaystyle\int_{0}^{\pi} t\sin(3t)\,\mathrm{d} t$

    **(d)** $\displaystyle\int_{1}^{2} \frac{\ln t}{(1 + t)^{2}}\,\mathrm{d} t$

    **(e)** $\displaystyle\int_{0}^{1} t^{3}\mathrm{e}^{t^{2}}\,\mathrm{d} t$

    **(f)** $\displaystyle\int_{0}^{1} (\operatorname{Arcsin} x)^{2}\,\mathrm{d} x$

    **(g)** $\displaystyle\int_{0}^{\sqrt{3}} x^{2}\operatorname{Arctan} x\,\mathrm{d} x$

    **(h)** $\displaystyle\int_{1}^{2} \frac{\ln(1 + t)}{t^{2}}\,\mathrm{d} t$

    **(i)** $\displaystyle\int_{0}^{1} x(\operatorname{Arctan} x)^{2}\,\mathrm{d} x$
  corrige: |
    On note $u'$ le facteur que l'on primitive et $v$ celui que l'on dérive (proposition 4).

    **(a)** Deux intégrations par parties, en dérivant le polynôme : 
    $$\int_{0}^{1} t^{2}\mathrm{e}^{t}\,\mathrm{d} t = \big[t^{2}\mathrm{e}^{t}\big]_{0}^{1} - 2\int_{0}^{1} t\,\mathrm{e}^{t}\,\mathrm{d} t = \mathrm{e} - 2\Big(\big[t\,\mathrm{e}^{t}\big]_{0}^{1} - \int_{0}^{1} \mathrm{e}^{t}\,\mathrm{d} t\Big) = \mathrm{e} - 2 \cdot 1 = \boxed{\mathrm{e} - 2}.$$
     **(b)** On dérive $\ln$ et l'on primitive $t^{2}$ : 
    $$\int_{1}^{\mathrm{e}} t^{2}\ln t\,\mathrm{d} t = \Big[\frac{t^{3}}{3}\ln t\Big]_{1}^{\mathrm{e}} - \int_{1}^{\mathrm{e}} \frac{t^{2}}{3}\,\mathrm{d} t = \frac{\mathrm{e}^{3}}{3} - \frac{\mathrm{e}^{3} - 1}{9} = \boxed{\frac{2\mathrm{e}^{3} + 1}{9}}.$$
     **(c)** On dérive $t$, et $\cos(3\pi) = -1$ : 
    $$\int_{0}^{\pi} t\sin(3t)\,\mathrm{d} t = \Big[-\frac{t\cos(3t)}{3}\Big]_{0}^{\pi} + \frac{1}{3}\int_{0}^{\pi} \cos(3t)\,\mathrm{d} t = \frac{\pi}{3} + 0 = \boxed{\frac{\pi}{3}}.$$
     **(d)** On primitive $\frac{1}{(1 + t)^{2}}$ en choisissant la primitive $1 - \frac{1}{1 + t} = \frac{t}{1 + t}$, qui simplifie le calcul : 
    $$\int_{1}^{2} \frac{\ln t}{(1 + t)^{2}}\,\mathrm{d} t = \Big[\frac{t\ln t}{1 + t}\Big]_{1}^{2} - \int_{1}^{2} \frac{\mathrm{d} t}{1 + t} = \frac{2}{3}\ln 2 - \ln\frac{3}{2} = \boxed{\frac{5}{3}\ln 2 - \ln 3}.$$
     **(e)** On écrit $t^{3}\mathrm{e}^{t^{2}} = t^{2}\cdot t\,\mathrm{e}^{t^{2}}$ et l'on primitive $t\,\mathrm{e}^{t^{2}}$ en $\frac{1}{2}\mathrm{e}^{t^{2}}$ : 
    $$\int_{0}^{1} t^{3}\mathrm{e}^{t^{2}}\,\mathrm{d} t = \Big[\frac{t^{2}\mathrm{e}^{t^{2}}}{2}\Big]_{0}^{1} - \int_{0}^{1} t\,\mathrm{e}^{t^{2}}\,\mathrm{d} t = \frac{\mathrm{e}}{2} - \frac{\mathrm{e} - 1}{2} = \boxed{\frac{1}{2}}.$$
     **(f)** La fonction $\operatorname{Arcsin}$ n'est pas dérivable en $1$ : on ne peut pas intégrer par parties directement sur $[0\,,1]$ dans le cadre du cours. On pose d'abord $x = \sin\theta$, avec $\theta \in \big[0\,,\frac{\pi}{2}\big]$, ce qui donne $\int_{0}^{\pi/2} \theta^{2}\cos\theta\,\mathrm{d}\theta$, puis deux intégrations par parties : 
    $$\int_{0}^{\pi/2} \theta^{2}\cos\theta\,\mathrm{d}\theta = \big[\theta^{2}\sin\theta\big]_{0}^{\pi/2} - 2\int_{0}^{\pi/2} \theta\sin\theta\,\mathrm{d}\theta = \frac{\pi^{2}}{4} - 2\big[\sin\theta - \theta\cos\theta\big]_{0}^{\pi/2} = \boxed{\frac{\pi^{2}}{4} - 2}.$$
     **(g)** On dérive $\operatorname{Arctan}$ et l'on primitive $x^{2}$, puis on divise : $\frac{x^{3}}{1 + x^{2}} = x - \frac{x}{1 + x^{2}}$. 
    $$\int_{0}^{\sqrt{3}} x^{2}\operatorname{Arctan} x\,\mathrm{d} x = \Big[\frac{x^{3}}{3}\operatorname{Arctan} x\Big]_{0}^{\sqrt{3}} - \frac{1}{3}\Big[\frac{x^{2}}{2} - \frac{1}{2}\ln(1 + x^{2})\Big]_{0}^{\sqrt{3}} = \boxed{\frac{\pi\sqrt{3}}{3} - \frac{1}{2} + \frac{\ln 2}{3}}.$$
     **(h)** On primitive $\frac{1}{t^{2}}$ en $-\frac{1}{t}$, puis $\frac{1}{t(1 + t)} = \frac{1}{t} - \frac{1}{1 + t}$ : 
    $$\int_{1}^{2} \frac{\ln(1 + t)}{t^{2}}\,\mathrm{d} t = \Big[-\frac{\ln(1 + t)}{t}\Big]_{1}^{2} + \Big[\ln\frac{t}{1 + t}\Big]_{1}^{2} = -\frac{\ln 3}{2} + \ln 2 + \ln\frac{4}{3} = \boxed{3\ln 2 - \frac{3}{2}\ln 3}.$$
     **(i)** On primitive $x$ en $\frac{1 + x^{2}}{2}$ plutôt qu'en $\frac{x^{2}}{2}$, ce qui simplifie le dénominateur de la dérivée de $\operatorname{Arctan}^{2}$ : 
    $$\int_{0}^{1} x(\operatorname{Arctan} x)^{2}\,\mathrm{d} x = \Big[\frac{1 + x^{2}}{2}(\operatorname{Arctan} x)^{2}\Big]_{0}^{1} - \int_{0}^{1} \operatorname{Arctan} x\,\mathrm{d} x = \frac{\pi^{2}}{16} - \Big(\frac{\pi}{4} - \frac{\ln 2}{2}\Big),$$
     la dernière intégrale ayant été calculée dans le cours. 
    $$\boxed{\int_{0}^{1} x(\operatorname{Arctan} x)^{2}\,\mathrm{d} x = \frac{\pi^{2}}{16} - \frac{\pi}{4} + \frac{\ln 2}{2}}$$

    *À retenir :* en (d) et en (i), on a choisi une primitive autre que la plus simple ; la constante ajoutée ne change rien à la formule, mais elle peut rendre l'intégrale restante beaucoup plus facile.
