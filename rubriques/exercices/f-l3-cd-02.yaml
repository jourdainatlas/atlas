  enonce: |
    Soit $M \in \mathcal{M}_{n}(\mathbb{R})$ et $k : \mathbb{R}^{n} \to \mathbb{R}^{n}$ différentiable. Calculer, en fonction de $\mathrm{d} k$, la différentielle de $V : \mathbb{R}^{n} \to \mathbb{R}$ définie par 
    $$V(x) = \langle Mx, x \rangle + \lVert x - k(x) \rVert_{2}^{2}.$$
  corrige: |
    On dérive chaque terme, le second par la règle de la chaîne appliquée au carré de la norme (exercice 1). 
    $$\boxed{\mathrm{d} V(x)\cdot h = \langle (M + {}^{t}M)x, h \rangle + 2\langle x - k(x), h - \mathrm{d} k(x)\cdot h \rangle},$$
     soit, en notant ${}^{t}\mathrm{d} k(x)$ la transposée de la jacobienne, $\nabla V(x) = (M + {}^{t}M)x + 2\big(I_{n} - {}^{t}\mathrm{d} k(x)\big)\big(x - k(x)\big)$.
