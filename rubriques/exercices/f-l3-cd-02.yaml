  enonce: |
    *(Applications homogènes, identité d'Euler.)* Soit $E$ et $F$ de dimension finie, $\alpha \in \mathbb{R}$ et $U$ un ouvert de $E$ tel que $x \in U$ et $t > 0$ entraînent $tx \in U$. On dit que $f : U \to F$ différentiable est *homogène de degré $\alpha$* si $f(tx) = t^{\alpha}f(x)$ pour tous $x \in U$ et $t > 0$, et qu'elle vérifie l'*identité d'Euler* si $\mathrm{d} f(x)\cdot x = \alpha f(x)$ pour tout $x \in U$.

    **1.** On suppose $f$ homogène de degré $\alpha$. Soit $x \in U$ et $\varphi(t) = f(tx)$ pour $t > 0$. Montrer que $\varphi$ est dérivable, calculer $\varphi'(t)$ et en déduire que $f$ vérifie l'identité d'Euler.

    **2.** Réciproquement, on suppose que $f$ vérifie l'identité d'Euler. Soit $x \in U$ et $\psi(t) = t^{-\alpha}f(tx)$ pour $t > 0$. Calculer $\psi'(t)$ et en déduire que $f$ est homogène de degré $\alpha$.
  corrige: |
    Dans les deux sens, on étudie $f$ le long de la demi-droite $\{tx \,;\, t > 0\}$.

    **1.** Par la règle de la chaîne, $\varphi$ est dérivable et 
    $$\boxed{\varphi'(t) = \mathrm{d} f(tx)\cdot x}.$$
     Par homogénéité, $\varphi(t) = t^{\alpha}f(x)$, donc $\varphi'(1) = \alpha f(x)$. En comparant, 
    $$\boxed{\mathrm{d} f(x)\cdot x = \alpha f(x)}.$$

    **2.** Par la formule de Leibniz, $\psi'(t) = -\alpha t^{-\alpha - 1}f(tx) + t^{-\alpha}\,\mathrm{d} f(tx)\cdot x = t^{-\alpha - 1}\big(\mathrm{d} f(tx)\cdot(tx) - \alpha f(tx)\big)$, et l'identité d'Euler au point $tx \in U$ donne $\boxed{\psi'(t) = 0}$. Donc $\psi$ est constante sur l'intervalle $]0, +\infty[$, égale à $\psi(1) = f(x)$ : $\boxed{f(tx) = t^{\alpha}f(x)}$.

    *Remarque.* Le sens direct n'utilise que la différentiabilité au point $x$ : c'est l'énoncé de f3, ex. 21. La réciproque demande l'identité d'Euler en tout point de la demi-droite. Exemples : $r^{\alpha}$ (exercice 27) est homogène de degré $\alpha$, et $\nabla(r^{\alpha})(x)\cdot x = \alpha r^{\alpha - 2}\lVert x \rVert^{2} = \alpha r^{\alpha}$.
