  enonce: |
    *(Nombres de Liouville.)* Un réel $x$ est dit *algébrique de degré au plus $n$* s'il est racine d'un polynôme $a_{n}X^{n} + \cdots + a_{0}$ non nul à coefficients entiers, avec $n \geqslant 1$, et *transcendant* s'il n'est algébrique pour aucun degré.

    **1.** Montrer que $\sqrt{2}$ est algébrique de degré au plus $2$.

    **2.** On suppose $x$ algébrique de degré au plus $n$. En appliquant l'inégalité des accroissements finis à un polynôme dont $x$ est racine, montrer qu'il existe une constante $C > 0$ telle que 
    $$\Big|x - \dfrac{p}{q}\Big| \geqslant \dfrac{C}{q^{n}} \qquad \text{pour tous } p \in \mathbb{Z},\ q \geqslant 1 \text{ tels que } \dfrac{p}{q} \neq x.$$

    **3.** On considère le réel $\alpha = \displaystyle\sum_{k = 1}^{+\infty}\dfrac{1}{10^{k!}} = 0{,}110001000000000000000001\ldots$, dont les décimales valent $1$ aux rangs $k!$ et $0$ ailleurs. Montrer que $\alpha$ est transcendant.
  corrige: |
    Les rationnels approchent mal les nombres algébriques ; un nombre trop bien approché est donc transcendant.

    **1.** $\sqrt{2}$ est racine de $X^{2} - 2$, à coefficients entiers : 
    $$\boxed{\sqrt{2} \text{ est algébrique de degré au plus } 2}\text{.}$$

    **2.** Soit $P \in \mathbb{Z}[X]$ non nul de degré minimal $d \leqslant n$ tel que $P(x) = 0$.

    $\triangleright$ *$P$ n'a pas de racine rationnelle autre que $x$.* Si $d = 1$, $x$ est la seule racine. Si $d \geqslant 2$ et $P(r) = 0$ avec $r \in \mathbb{Q}$, alors $P = (X - r)Q$ avec $Q \in \mathbb{Q}[X]$ de degré $d - 1$ ; si $r \neq x$, $Q(x) = 0$, et un multiple entier de $Q$ contredit la minimalité de $d$ ; et $r = x$ est exclu, car $x$ serait rationnel, donc racine d'un polynôme de degré $1$.

    $\triangleright$ *Minoration.* Pour $\dfrac{p}{q} \neq x$, on a $P\big(\frac{p}{q}\big) \neq 0$, et $q^{d}P\big(\frac{p}{q}\big)$ est un entier non nul, donc $\big|P\big(\frac{p}{q}\big)\big| \geqslant \dfrac{1}{q^{d}} \geqslant \dfrac{1}{q^{n}}$. Si $\big|x - \frac{p}{q}\big| \leqslant 1$, l'inégalité des accroissements finis sur $[x - 1, x + 1]$, avec $M = \sup_{[x - 1, x + 1]}|P'| > 0$, donne 
    $$\frac{1}{q^{n}} \leqslant \Big|P\Big(\frac{p}{q}\Big) - P(x)\Big| \leqslant M\Big|\frac{p}{q} - x\Big|.$$
     Si $\big|x - \frac{p}{q}\big| > 1$, alors $\big|x - \frac{p}{q}\big| \geqslant \frac{1}{q^{n}}$. Dans les deux cas, 
    $$\boxed{\Big|x - \frac{p}{q}\Big| \geqslant \frac{C}{q^{n}} \text{ avec } C = \min\Big(1, \frac{1}{M}\Big)}\text{.}$$

    **3.** Posons $q_{N} = 10^{N!}$ et $p_{N} = q_{N}\sum_{k = 1}^{N}10^{-k!} \in \mathbb{Z}$. Alors 
    $$0 < \alpha - \frac{p_{N}}{q_{N}} = \sum_{k > N}10^{-k!} \leqslant 10^{-(N + 1)!}\sum_{j \geqslant 0}10^{-j} = \frac{10}{9}\,q_{N}^{-(N + 1)}.$$
     Si $\alpha$ était algébrique de degré au plus $n$, la question 2 donnerait $\dfrac{C}{q_{N}^{n}} \leqslant \dfrac{10}{9}q_{N}^{-(N + 1)}$, soit $C \leqslant \dfrac{10}{9}q_{N}^{\,n - N - 1}$, qui tend vers $0$ quand $N \to +\infty$ : contradiction. 
    $$\boxed{\alpha \text{ est transcendant}}.$$

    *Remarque.* Le nombre de Liouville (1844) fut le premier exemple explicite de nombre transcendant ; la transcendance de $e$ (Hermite, 1873) et de $\pi$ (Lindemann, 1882) est bien plus difficile.
- id: "l3-cd-02-52"
