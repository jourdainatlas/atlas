  enonce: |
    Soit $U$ un ouvert convexe de $E$ et $(f_{n})$ une suite d'applications différentiables de $U$ dans $F$ telles que :

    • pour tout $x \in U$, $f_{n}(x) \to f(x)$ ;

    • la suite $(\mathrm{d} f_{n})$ converge uniformément sur $U$ vers une application $g : U \to \mathcal{L}(E, F)$.

    On va montrer que $f$ est différentiable et que $\mathrm{d} f = g$.

    **1.** Soit $a \in U$ et $R > 0$. En appliquant l'inégalité des accroissements finis à $f_{p} - f_{q}$ entre $a$ et $x \in B(a, R) \cap U$, montrer que $(f_{n})$ converge uniformément sur $B(a, R) \cap U$.

    **2.** Soit $a \in U$ et $\eta > 0$ tels que $B(a, \eta) \subset U$. Montrer que, pour tout $h \in B(0, \eta)$ et tout $n$, 
    $$\begin{aligned} \lVert f(a + h) - f(a) - g(a)\cdot h \rVert \leqslant{} & \lVert f(a + h) - f(a) - f_{n}(a + h) + f_{n}(a) \rVert \\ & + \lVert f_{n}(a + h) - f_{n}(a) - \mathrm{d} f_{n}(a)\cdot h \rVert + \lVert \mathrm{d} f_{n}(a)\cdot h - g(a)\cdot h \rVert. \end{aligned}$$
     En déduire que $f$ est différentiable en $a$, de différentielle $g(a)$.

    **3.** En déduire que $M \mapsto e^{M} = \displaystyle\sum_{k = 0}^{+\infty}\dfrac{M^{k}}{k!}$ est de classe $\mathcal{C}^{1}$ sur $\mathcal{M}_{n}(\mathbb{R})$.
  corrige: |
    C'est le théorème de dérivation des suites de fonctions, démontré sans intégrale, par l'inégalité des accroissements finis.

    **1.** Notons $V = B(a, R) \cap U$, convexe. Pour $x \in V$, l'inégalité des accroissements finis appliquée à $f_{p} - f_{q}$ sur $[a, x]$ donne 
    $$\lVert (f_{p} - f_{q})(x) \rVert \leqslant \lVert (f_{p} - f_{q})(a) \rVert + R\sup_{U}|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} f_{p} - \mathrm{d} f_{q}|\mkern-1.5mu|\mkern-1.5mu|.$$
     Le premier terme tend vers $0$ (convergence simple en $a$), le second aussi (convergence uniforme de $(\mathrm{d} f_{n})$, donc critère de Cauchy uniforme), indépendamment de $x$. La suite $(f_{n})$ est uniformément de Cauchy sur $V$ ; comme elle converge simplement vers $f$, 
    $$\boxed{f_{n} \to f \text{ uniformément sur } V}\text{.}$$

    **2.** L'inégalité est l'inégalité triangulaire après insertion de $\pm\big(f_{n}(a + h) - f_{n}(a)\big)$ et $\pm\mathrm{d} f_{n}(a)\cdot h$. Soit $\varepsilon > 0$.

    • Premier terme : par les accroissements finis appliqués à $f_{p} - f_{n}$ sur $[a, a + h]$, puis $p \to +\infty$, il est majoré par $\lVert h \rVert\sup_{U}|\mkern-1.5mu|\mkern-1.5mu|g - \mathrm{d} f_{n}|\mkern-1.5mu|\mkern-1.5mu| \leqslant \varepsilon\lVert h \rVert$ pour $n \geqslant N$.

    • Troisième terme : $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} f_{n}(a) - g(a)|\mkern-1.5mu|\mkern-1.5mu|\,\lVert h \rVert \leqslant \varepsilon\lVert h \rVert$ pour $n \geqslant N$.

    • Deuxième terme : $n = N$ étant fixé, la différentiabilité de $f_{N}$ en $a$ le rend inférieur à $\varepsilon\lVert h \rVert$ pour $\lVert h \rVert \leqslant \eta'$.

    Donc $\lVert f(a + h) - f(a) - g(a)\cdot h \rVert \leqslant 3\varepsilon\lVert h \rVert$ pour $\lVert h \rVert \leqslant \eta'$ : 
    $$\boxed{f \text{ est différentiable en } a, \text{ et } \mathrm{d} f(a) = g(a)}\text{.}$$

    **3.** Soit $f_{N}(M) = \sum_{k = 0}^{N}\dfrac{M^{k}}{k!}$, différentiable avec $\mathrm{d} f_{N}(M)\cdot H = \sum_{k = 1}^{N}\dfrac{1}{k!}\sum_{j = 0}^{k - 1}M^{j}HM^{k - 1 - j}$ (exercice 3). Sur $U = B(0, R)$, convexe, 
    $$|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} f_{N}(M) - \mathrm{d} f_{N'}(M)|\mkern-1.5mu|\mkern-1.5mu| \leqslant \sum_{k = N + 1}^{N'}\frac{kR^{k - 1}}{k!} = \sum_{k = N + 1}^{N'}\frac{R^{k - 1}}{(k - 1)!},$$
     reste d'une série convergente : $(\mathrm{d} f_{N})$ est uniformément de Cauchy sur $U$, donc converge uniformément ($\mathcal{L}(\mathcal{M}_{n}(\mathbb{R}))$ est complet) vers une application $g$, continue comme limite uniforme d'applications continues. Par la question 2, $M \mapsto e^{M}$ est différentiable sur $B(0, R)$ de différentielle $g$ continue ; $R$ étant arbitraire, 
    $$\boxed{M \mapsto e^{M} \text{ est de classe } \mathcal{C}^{1} \text{ sur } \mathcal{M}_{n}(\mathbb{R})}\text{.}$$
- id: "l3-cd-02-53"
  feuille: "f-l3-cd-02"
  numero: 53
  partie: "Applications de classe $\\mathcal{C}^{1}$"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [classe C1]
  noeuds: [gd-classe-ck]
  notions: [classe-ck]
  page_enonce: 11
  page_corrige: 28
  enonce: |
    On rappelle les implications, pour $f$ définie au voisinage de $x_{0}$ : « $f$ de classe $\mathcal{C}^{1}$ au voisinage de $x_{0}$ » $\Rightarrow$ « $f$ différentiable en $x_{0}$ » $\Rightarrow$ « $f$ continue en $x_{0}$ », et « $f$ différentiable en $x_{0}$ » $\Rightarrow$ « $f$ admet des dérivées partielles en $x_{0}$ ». À l'aide de l'exercice 19 et de la fonction 
    $$f(x, y) = \left\{ \begin{array}{ll} x^{2}\sin\frac{1}{x} + y^{2}\sin\frac{1}{y} & \text{si } xy \neq 0, \\[1mm] x^{2}\sin\frac{1}{x} & \text{si } y = 0,\ x \neq 0, \\[1mm] y^{2}\sin\frac{1}{y} & \text{si } x = 0,\ y \neq 0, \\[1mm] 0 & \text{en } (0, 0), \end{array} \right.$$
     montrer que les réciproques de ces implications sont fausses en général.
  corrige: |
    On reconnaît une somme de deux fonctions d'une variable : avec $\phi(t) = t^{2}\sin\frac{1}{t}$ pour $t \neq 0$ et $\phi(0) = 0$, les quatre cas de la définition se résument en $\boxed{f(x, y) = \phi(x) + \phi(y)}$.

    $\triangleright$ *$\phi$ est dérivable, de dérivée discontinue.* Pour $t \neq 0$, $\phi'(t) = 2t\sin\frac{1}{t} - \cos\frac{1}{t}$ ; en $0$, $\big|\frac{\phi(t)}{t}\big| \leqslant |t|$, donc $\phi'(0) = 0$. Mais $\phi'\big(\frac{1}{2k\pi}\big) = -1$ ne tend pas vers $0$.

    $\triangleright$ *Conséquences pour $f$.* $f$ est différentiable en tout point, de différentielle $(h, k) \mapsto \phi'(x)h + \phi'(y)k$ : en effet, $f(x + h, y + k) - f(x, y) = \phi'(x)h + \phi'(y)k + o(|h|) + o(|k|)$. Mais $\dfrac{\partial f}{\partial x}(x, y) = \phi'(x)$ n'est pas continue en $(0, 0)$ : 
    $$\boxed{f \text{ est différentiable sans être de classe } \mathcal{C}^{1}}\text{.}$$

    $\triangleright$ *Bilan des réciproques.* « différentiable $\Rightarrow$ $\mathcal{C}^{1}$ » est faux (cette fonction). « continue $\Rightarrow$ différentiable » et « dérivées partielles $\Rightarrow$ différentiable » sont faux : la fonction de l'exercice 19 est continue, admet des dérivées selon tout vecteur en $0$, et n'y est pas différentiable.

    ![Figure](documents/figures/15d7a7d4d49d465c.svg)

    Le graphe de $\phi$ est coincé entre les paraboles $\pm t^{2}$, donc tangent à l'axe en $0$ : $\phi'(0) = 0$. Mais il oscille de plus en plus vite, avec des pentes qui restent de l'ordre de $\pm 1$ : la dérivée existe partout sans être continue en $0$.
- id: "l3-cd-02-54"
  feuille: "f-l3-cd-02"
  numero: 54
  partie: "Applications de classe $\\mathcal{C}^{1}$"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [classe C1]
  noeuds: [gd-classe-ck]
  notions: [classe-ck]
  page_enonce: 11
  page_corrige: 28
  enonce: |
    Soit $g : \mathbb{R} \to \mathbb{R}$ de classe $\mathcal{C}^{2}$ et $F : \mathbb{R}^{2} \to \mathbb{R}$ définie par 
    $$F(x, y) = \dfrac{g(x) - g(y)}{x - y} \quad \text{si } x \neq y, \qquad F(x, x) = g'(x).$$
     Montrer que $F$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$ et calculer sa différentielle.
  corrige: |
    On écrit le taux d'accroissement comme une intégrale, ce qui fait disparaître la distinction entre la diagonale et le reste du plan.

    $\triangleright$ *Représentation intégrale.* Pour tous $x$, $y$, 
    $$\boxed{F(x, y) = \int_{0}^{1}g'\big(y + t(x - y)\big)\,\mathrm{d} t}\text{ :}$$
     si $x \neq y$, c'est le théorème fondamental de l'analyse ; si $x = y$, l'intégrale vaut $g'(x)$.

    $\triangleright$ *Classe $\mathcal{C}^{1}$.* L'intégrande $(x, y, t) \mapsto g'\big(y + t(x - y)\big)$ admet des dérivées partielles en $x$ et $y$, $tg''(\cdots)$ et $(1 - t)g''(\cdots)$, continues sur $\mathbb{R}^{2} \times [0, 1]$ puisque $g$ est de classe $\mathcal{C}^{2}$. Par dérivation sous le signe intégrale sur le segment $[0, 1]$, 
    $$\dfrac{\partial F}{\partial x}(x, y) = \int_{0}^{1}t\,g''\big(y + t(x - y)\big)\,\mathrm{d} t, \qquad \dfrac{\partial F}{\partial y}(x, y) = \int_{0}^{1}(1 - t)\,g''\big(y + t(x - y)\big)\,\mathrm{d} t,$$
     fonctions continues de $(x, y)$. Donc 
    $$\boxed{F \text{ est de classe } \mathcal{C}^{1} \text{ sur } \mathbb{R}^{2}}\quad\text{(cours, th. 5).}$$
     Sur la diagonale, 
    $$\boxed{\mathrm{d} F(a, a)\cdot(h, k) = \frac{g''(a)}{2}(h + k)}\text{ ;}$$
     hors de la diagonale, 
    $$\dfrac{\partial F}{\partial x}(x, y) = \frac{g'(x)(x - y) - \big(g(x) - g(y)\big)}{(x - y)^{2}}, \qquad \dfrac{\partial F}{\partial y}(x, y) = \frac{g(x) - g(y) - g'(y)(x - y)}{(x - y)^{2}}.$$
- id: "l3-cd-02-55"
  feuille: "f-l3-cd-02"
  numero: 55
  partie: "Applications de classe $\\mathcal{C}^{1}$"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [classe C1]
