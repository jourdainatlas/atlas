  noeuds: [gd-differentielle]
  notions: [matrice-jacobienne]
  page_enonce: 7
  page_corrige: 18
  enonce: |
    On considère $f : \mathbb{R}^{2} \to \mathbb{R}^{3}$, $f(x, y) = (x^{2}y, xy, xy^{3})$ et $g : \mathbb{R}^{3} \to \mathbb{R}^{2}$, $g(x, y, z) = (x + y + z, xyz)$. En un point $a = (x, y)$ de $\mathbb{R}^{2}$, calculer la matrice jacobienne de $f$ en $a$, celle de $g$ en $f(a)$, puis celle de $g \circ f$ en $a$, de deux façons.
  corrige: |
    On calcule les deux jacobiennes, puis leur produit, et on compare avec le calcul direct. 
    $$J_{f}(x, y) = \begin{pmatrix} 2xy & x^{2} \\ y & x \\ y^{3} & 3xy^{2} \end{pmatrix}, \qquad J_{g}(u, v, w) = \begin{pmatrix} 1 & 1 & 1 \\ vw & uw & uv \end{pmatrix},$$
     d'où, en $f(a) = (x^{2}y, xy, xy^{3})$, $J_{g}\big(f(a)\big) = \begin{pmatrix} 1 & 1 & 1 \\ x^{2}y^{4} & x^{3}y^{4} & x^{3}y^{2} \end{pmatrix}$ et 
    $$\boxed{J_{g \circ f}(a) = J_{g}\big(f(a)\big)\,J_{f}(a) = \begin{pmatrix} 2xy + y + y^{3} & x^{2} + x + 3xy^{2} \\ 4x^{3}y^{5} & 5x^{4}y^{4} \end{pmatrix}}.$$
     Directement, $g \circ f(x, y) = (x^{2}y + xy + xy^{3},\ x^{4}y^{5})$, dont la jacobienne est bien la matrice ci-dessus (calcul vérifié avec sympy).
- id: "l3-cd-02-33"
  feuille: "f-l3-cd-02"
