  types: [Démonstration, Calcul]
  mots_cles: [composition]
  noeuds: [gd-differentielle]
  notions: [matrice-jacobienne]
  page_enonce: 9
  page_corrige: 22
  enonce: |
    Soit $f : \mathbb{R}^{2} \to \mathbb{R}^{2}$ différentiable, *propre* (c'est-à-dire $\lVert f(x) \rVert \to +\infty$ quand $\lVert x \rVert \to +\infty$), telle que $\mathrm{d} f(x)$ soit injective pour tout $x \in \mathbb{R}^{2}$. On va montrer que $f$ est surjective. Soit $a \in \mathbb{R}^{2}$ et $g(x) = \lVert f(x) - a \rVert_{2}^{2}$.

    **1.** Calculer $\mathrm{d} g(x)$.

    **2.** Montrer que $g$ atteint sa borne inférieure en un point $x_{0}$ de $\mathbb{R}^{2}$ et que $\mathrm{d} g(x_{0}) = 0$ (on pourra dériver $t \mapsto g(x_{0} + tv)$ en $0$). En déduire le résultat.
  corrige: |
    Pour atteindre $a$, on minimise la distance de $f(x)$ à $a$, et on montre qu'au minimum cette distance est nulle.

    **1.** Par l'exercice 41 et la règle de la chaîne, 
    $$\boxed{\mathrm{d} g(x)\cdot h = 2\langle f(x) - a, \mathrm{d} f(x)\cdot h \rangle}\text{.}$$

    **2.** $\triangleright$ *Le minimum est atteint.* Comme $f$ est propre, il existe $R$ tel que $\lVert x \rVert > R$ entraîne $\lVert f(x) \rVert > \lVert a \rVert + \lVert f(0) - a \rVert$, donc $g(x) > g(0)$. La fonction continue $g$ atteint son minimum sur la boule fermée $B_{f}(0, R)$, compacte (cours ch. 1, th. 3), en un point $x_{0}$ ; c'est un minimum sur tout $\mathbb{R}^{2}$, puisque $g > g(0) \geqslant g(x_{0})$ hors de la boule.

    $\triangleright$ *La différentielle s'y annule.* Pour tout $v$, $t \mapsto g(x_{0} + tv)$ a un minimum en $t = 0$, donc sa dérivée $\mathrm{d} g(x_{0})\cdot v$ y est nulle : $\mathrm{d} g(x_{0}) = 0$.

    $\triangleright$ *Conclusion.* $\langle f(x_{0}) - a, \mathrm{d} f(x_{0})\cdot h \rangle = 0$ pour tout $h$. Comme $\mathrm{d} f(x_{0})$ est un endomorphisme injectif de $\mathbb{R}^{2}$, il est surjectif, et $f(x_{0}) - a$ est orthogonal à tout $\mathbb{R}^{2}$ : $\boxed{f(x_{0}) = a}$. Ainsi $f$ est surjective.

    *Piège.* L'injectivité de $\mathrm{d} f(x_{0})$ n'entraîne la surjectivité que parce que les dimensions de départ et d'arrivée sont égales ; pour $f : \mathbb{R} \to \mathbb{R}^{2}$, le résultat serait faux.
- id: "l3-cd-02-43"
  feuille: "f-l3-cd-02"
  numero: 43
  partie: "Accroissements finis"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [accroissements finis]
  noeuds: [gd-accroissements]
  notions: [fonction-convexe]
  page_enonce: 9
  page_corrige: 22
  enonce: |
    **1.** Soit $U$ un ouvert convexe de $\mathbb{R}^{n}$ et $f : U \to \mathbb{R}$ différentiable. Montrer que, pour $a$, $b \in U$, il existe $c \in \,]a, b[$ tel que $f(b) - f(a) = \mathrm{d} f(c)\cdot(b - a)$. On pourra utiliser $g(t) = f\big(a + t(b - a)\big)$.

    **2.** Montrer, en considérant $f(x) = e^{\mathrm{i} x}$ sur $[0, 2\pi]$, que cette égalité est fausse pour les fonctions à valeurs dans $\mathbb{R}^{2} = \mathbb{C}$. Que reste-t-il de vrai pour $f : U \to \mathbb{R}^{p}$, $p > 1$ ?
  corrige: |
    On ramène la question à une variable réelle, où l'égalité des accroissements finis est disponible pour les fonctions à valeurs réelles, et seulement pour elles.

    **1.** Le segment $[a, b]$ est dans $U$ (convexe). La fonction $g(t) = f\big(a + t(b - a)\big)$ est dérivable sur $[0, 1]$, de dérivée $g'(t) = \mathrm{d} f\big(a + t(b - a)\big)\cdot(b - a)$ (cours, prop. 11). L'égalité des accroissements finis donne $\tau \in \,]0, 1[$ tel que $g(1) - g(0) = g'(\tau)$, soit, avec $c = a + \tau(b - a)$, 
    $$\boxed{f(b) - f(a) = \mathrm{d} f(c)\cdot(b - a)}.$$

    **2.** Pour $f(x) = e^{\mathrm{i} x}$, on a $f(2\pi) - f(0) = 0$, alors que $f'(c) = \mathrm{i} e^{\mathrm{i} c}$ est de module $1$ : aucun $c$ ne vérifie $0 = 2\pi f'(c)$. 
    $$\boxed{\text{L'égalité des accroissements finis est fausse pour } p > 1}\text{.}$$
     Il reste l'inégalité (cours, th. 4) : $\lVert f(b) - f(a) \rVert \leqslant \sup_{c \in [a, b]}|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} f(c)|\mkern-1.5mu|\mkern-1.5mu|\,\lVert b - a \rVert$, et l'égalité pour chaque coordonnée, mais avec un point $c$ qui dépend de la coordonnée.

    ![Figure](documents/figures/bb5e040c8921becc.svg)

    Le point $e^{\mathrm{i} x}$ fait un tour complet et revient à son départ : le vecteur $f(2\pi) - f(0)$ est nul, alors qu'aucune vitesse instantanée ne l'est.
- id: "l3-cd-02-44"
  feuille: "f-l3-cd-02"
  numero: 44
  partie: "Accroissements finis"
  etoiles: 1
  types: [Calcul]
  mots_cles: [accroissements finis]
  noeuds: [gd-accroissements]
  notions: []
  page_enonce: 9
  page_corrige: 23
  enonce: |
    Soit $E$ et $F$ de dimension finie, $U$ un ouvert connexe de $E$, $L : E \to F$ linéaire et $f : U \to F$ différentiable telle que $\mathrm{d} f(x) = L$ pour tout $x \in U$. Que peut-on dire de $f$ ?
  corrige: |
    On se ramène à une différentielle nulle. L'application $g = f - L$ vérifie $\mathrm{d} g(x) = L - L = 0$ sur $U$. Un ouvert connexe d'un espace normé est connexe par arcs, et la proposition 14 (ii) du cours donne $g$ constante : 
    $$\boxed{f = L + c \text{ sur } U, \text{ avec } c \in F}\text{,}$$
     c'est-à-dire que $f$ est la restriction à $U$ d'une application affine.

    *Piège.* Sans la connexité, $f$ est seulement affine sur chaque composante connexe de $U$, avec des constantes qui peuvent différer.
- id: "l3-cd-02-45"
  feuille: "f-l3-cd-02"
  numero: 45
  partie: "Accroissements finis"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [accroissements finis, gradient, applications lipschitziennes]
  noeuds: [gd-accroissements, gd-differentielle]
  notions: [gradient, fonction-convexe]
  page_enonce: 9
  page_corrige: 23
  enonce: |
    Soit $E$ et $F$ de dimension finie.

    **1.** Soit $U$ un ouvert convexe de $E$ et $f : U \to F$ différentiable. Montrer que $f$ est lipschitzienne sur $U$ si et seulement si $x \mapsto \mathrm{d} f(x)$ est bornée sur $U$.

    **2.** En déduire qu'une application $f : \mathbb{R}^{n} \to \mathbb{R}^{p}$ de classe $\mathcal{C}^{1}$ est lipschitzienne sur la boule unité fermée, et qu'une fonction $f : \mathbb{R}^{n} \to \mathbb{R}$ différentiable dont le gradient est unitaire en tout point est lipschitzienne.

    **3.** Que se passe-t-il si l'on suppose seulement $U$ connexe ? On pourra considérer l'angle polaire $\theta \in \,]-\pi, \pi[$ sur $U = \{(r\cos\theta, r\sin\theta) \,;\, 1 < r < 2,\ -\pi < \theta < \pi\}$.
  corrige: |
    Le sens « lipschitzienne implique différentielle bornée » est local et vaut toujours ; la réciproque repose sur l'inégalité des accroissements finis le long de segments, d'où la convexité.

    **1.** Si $f$ est $K$-lipschitzienne, $\lVert \mathrm{d} f(x)\cdot h \rVert = \lim_{t \to 0}\dfrac{\lVert f(x + th) - f(x) \rVert}{|t|} \leqslant K\lVert h \rVert$, donc 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} f(x)|\mkern-1.5mu|\mkern-1.5mu| \leqslant K}.$$
     Réciproquement, si $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} f(x)|\mkern-1.5mu|\mkern-1.5mu| \leqslant M$ sur $U$ convexe, $f$ est $M$-lipschitzienne (cours, prop. 14 (i)).

    **2.** Si $f$ est de classe $\mathcal{C}^{1}$, $x \mapsto |\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} f(x)|\mkern-1.5mu|\mkern-1.5mu|$ est continue, donc bornée sur le compact $B_{f}(0, 2)$, en particulier sur l'ouvert convexe $B(0, 2)$, qui contient la boule unité fermée : 
    $$\boxed{f \text{ est lipschitzienne sur } B_{f}(0, 1)}\text{.}$$
     Si $\lVert \nabla f(x) \rVert_{2} = 1$, alors, pour la norme euclidienne, $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} f(x)|\mkern-1.5mu|\mkern-1.5mu| = \sup_{\lVert h \rVert_{2} = 1}\langle \nabla f(x), h \rangle = 1$, et $f$ est $\boxed{1\text{-lipschitzienne}}$ sur $\mathbb{R}^{n}$, qui est convexe.

    **3.** Sur l'anneau fendu $U$, l'angle polaire $\theta$ est de classe $\mathcal{C}^{1}$, de gradient $\dfrac{1}{r^{2}}(-y, x)$, de norme $\dfrac{1}{r} < 1$ : la différentielle est bornée. Pourtant, les points $p_{\varepsilon} = (-\frac{3}{2}, \varepsilon)$ et $q_{\varepsilon} = (-\frac{3}{2}, -\varepsilon)$ de $U$ vérifient $\lVert p_{\varepsilon} - q_{\varepsilon} \rVert = 2\varepsilon$ et $\theta(p_{\varepsilon}) - \theta(q_{\varepsilon}) \to 2\pi$ quand $\varepsilon \to 0$. 
    $$\boxed{\theta \text{ n'est pas lipschitzienne : la connexité ne suffit pas}}\text{.}$$
     L'énoncé d'Audin, qui ne supposait que $U$ connexe, est donc faux sans hypothèse supplémentaire.

    ![Figure](documents/figures/7d80da5a129ad879.svg)

    Les points $p_{\varepsilon}$ et $q_{\varepsilon}$ sont très proches dans le plan, mais tout chemin qui les joint dans $U$ fait le tour de l'anneau. L'inégalité des accroissements finis contrôle $\theta(p_{\varepsilon}) - \theta(q_{\varepsilon})$ par la longueur de ce chemin, pas par la distance $2\varepsilon$.
- id: "l3-cd-02-46"
  feuille: "f-l3-cd-02"
  numero: 46
  partie: "Accroissements finis"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [accroissements finis]
  noeuds: [gd-accroissements]
  notions: []
  page_enonce: 9
  page_corrige: 24
  enonce: |
    Soit $E$ un espace de Banach, $U$ un ouvert de $E$ et $f : U \to \mathbb{R}$ différentiable telle que $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} f(x)|\mkern-1.5mu|\mkern-1.5mu| \leqslant k|f(x)|$ pour tout $x \in U$. Montrer que, pour tout $a \in U$ et tout $x$ assez voisin de $a$, 
    $$|f(x)| \leqslant e^{k\lVert x - a \rVert}|f(a)|.$$
     On pourra considérer l'application $t \in [0, 1] \mapsto f\big(a + t(x - a)\big)$.
  corrige: |
    On se ramène à une variable sur le segment $[a, x]$, puis on applique un argument de Gronwall à une quantité positive et dérivable.

    Soit $r > 0$ tel que $B(a, r) \subset U$ et $x \in B(a, r)$, de sorte que le segment $[a, x]$ est dans $U$. Posons $\delta = \lVert x - a \rVert$ et $\varphi(t) = f\big(a + t(x - a)\big)$ pour $t \in [0, 1]$ : $\varphi$ est dérivable, avec 
    $$|\varphi'(t)| = \big|\mathrm{d} f\big(a + t(x - a)\big)\cdot(x - a)\big| \leqslant k\delta\,|\varphi(t)|.$$
     La fonction $\psi(t) = e^{-2k\delta t}\varphi(t)^{2}$ est dérivable et 
    $$\psi'(t) = 2e^{-2k\delta t}\varphi(t)\big(\varphi'(t) - k\delta\varphi(t)\big) \leqslant 2e^{-2k\delta t}\big(|\varphi(t)|\,|\varphi'(t)| - k\delta\varphi(t)^{2}\big) \leqslant 0.$$
     Donc $\psi(1) \leqslant \psi(0)$, soit $\varphi(1)^{2} \leqslant e^{2k\delta}\varphi(0)^{2}$, et 
    $$\boxed{|f(x)| \leqslant e^{k\lVert x - a \rVert}|f(a)|}\text{.}$$

    *Remarque.* En particulier, si $f(a) = 0$, $f$ est nulle au voisinage de $a$ : c'est la version à plusieurs variables de l'exercice 15.
- id: "l3-cd-02-47"
  feuille: "f-l3-cd-02"
  numero: 47
  partie: "Accroissements finis"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [accroissements finis]
  noeuds: [gd-accroissements]
  notions: [fonction-convexe]
  page_enonce: 9
  page_corrige: 24
  enonce: |
    Soit $\Omega$ un ouvert convexe de $\mathbb{R}^{n}$ et $f : \Omega \to \mathbb{R}^{n}$ de classe $\mathcal{C}^{1}$. Montrer que, pour tous $a$, $b \in \Omega$, 
    $$\lVert f(b) - f(a) - \mathrm{d} f(a)\cdot(b - a) \rVert \leqslant \lVert b - a \rVert\sup_{c \in [a, b]}|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} f(c) - \mathrm{d} f(a)|\mkern-1.5mu|\mkern-1.5mu|.$$
  corrige: |
    C'est la forme raffinée de l'inégalité des accroissements finis (cours, prop. 13). On applique l'inégalité des accroissements finis (cours, th. 4) à $g(z) = f(z) - \mathrm{d} f(a)\cdot z$ sur le segment $[a, b] \subset \Omega$. Sa différentielle est $\mathrm{d} g(c) = \mathrm{d} f(c) - \mathrm{d} f(a)$, et $M = \sup_{c \in [a, b]}|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} f(c) - \mathrm{d} f(a)|\mkern-1.5mu|\mkern-1.5mu|$ est fini, car $\mathrm{d} f$ est continue sur le compact $[a, b]$. D'où 
    $$\boxed{\lVert f(b) - f(a) - \mathrm{d} f(a)\cdot(b - a) \rVert = \lVert g(b) - g(a) \rVert \leqslant \lVert b - a \rVert\sup_{c \in [a, b]}|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} f(c) - \mathrm{d} f(a)|\mkern-1.5mu|\mkern-1.5mu|}.$$
     Les hypothèses d'injectivité de la source ne servent pas.

    *À retenir.* Le reste $f(b) - f(a) - \mathrm{d} f(a)\cdot(b - a)$ est contrôlé par l'oscillation de la différentielle sur le segment. C'est l'outil principal de la démonstration du théorème d'inversion locale au chapitre 3.
- id: "l3-cd-02-48"
  feuille: "f-l3-cd-02"
  numero: 48
  partie: "Accroissements finis"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [accroissements finis]
  noeuds: [gd-accroissements]
  notions: []
  page_enonce: 10
  page_corrige: 24
  enonce: |
    Montrer que le système d'équations 
    $$\left\{ \begin{array}{l} x = \dfrac{1}{2}\sin(x + y) \\[2mm] y = \dfrac{1}{2}\cos(x - y) \end{array} \right.$$
     admet au plus une solution, puis qu'il en admet exactement une.
  corrige: |
    Le système s'écrit $(x, y) = \Phi(x, y)$ avec $\Phi(x, y) = \Big(\dfrac{1}{2}\sin(x + y), \dfrac{1}{2}\cos(x - y)\Big)$ : on montre que $\Phi$ est contractante.

    $\triangleright$ *Norme de la différentielle.* Avec $c = \cos(x + y)$ et $s = \sin(x - y)$, 
    $$J_{\Phi}(x, y) = \frac{1}{2}\begin{pmatrix} c & c \\ -s & s \end{pmatrix}, \qquad {}^{t}J_{\Phi}J_{\Phi} = \frac{1}{4}\begin{pmatrix} c^{2} + s^{2} & c^{2} - s^{2} \\ c^{2} - s^{2} & c^{2} + s^{2} \end{pmatrix},$$
     de valeurs propres $\frac{c^{2}}{2}$ et $\frac{s^{2}}{2}$. Pour la norme euclidienne, $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d}\Phi(x, y)|\mkern-1.5mu|\mkern-1.5mu| = \dfrac{\max(|c|, |s|)}{\sqrt{2}} \leqslant \dfrac{1}{\sqrt{2}}$.

    $\triangleright$ *Unicité et existence.* Par l'inégalité des accroissements finis sur le convexe $\mathbb{R}^{2}$, l'application $\Phi$ est lipschitzienne de rapport $\frac{1}{\sqrt{2}}$. Deux solutions $p$, $q$ vérifieraient 
    $$\lVert p - q \rVert = \lVert \Phi(p) - \Phi(q) \rVert \leqslant \frac{1}{\sqrt{2}}\lVert p - q \rVert,$$
     donc $p = q$ : $\boxed{\text{au plus une solution}}$. Comme $\mathbb{R}^{2}$ est complet, le théorème du point fixe de Banach (cours ch. 1, th. 13) donne 
    $$\boxed{\text{exactement une solution}},$$
     limite des itérés de $\Phi$ à partir de n'importe quel point. Numériquement (Python), $(x, y) \approx (0{,}38645 \,;\, 0{,}49695)$.

    ![Figure](documents/figures/4c661743756e7b60.svg)

    Chaque équation définit une courbe du plan, et la solution du système est leur unique point d'intersection. Comme $|\sin| \leqslant 1$ et $|\cos| \leqslant 1$, la première courbe reste dans la bande $|x| \leqslant \frac{1}{2}$ et la seconde dans la bande $|y| \leqslant \frac{1}{2}$ : la solution est dans le carré $\big[-\frac{1}{2}, \frac{1}{2}\big]^{2}$.
- id: "l3-cd-02-49"
  feuille: "f-l3-cd-02"
  numero: 49
  partie: "Accroissements finis"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [accroissements finis]
  noeuds: [gd-accroissements]
  notions: []
  page_enonce: 10
  page_corrige: 25
  enonce: |
    Soit $F : \mathbb{R}^{2} \to \mathbb{R}^{2}$, $F(x, y) = (\cos x - \sin y, \sin x - \cos y)$, et $\mathbb{R}^{2}$ muni de la norme euclidienne.

    **1.** Montrer que $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} F(x, y)|\mkern-1.5mu|\mkern-1.5mu| \leqslant \sqrt{2}$ pour tout $(x, y)$.

    **2.** En déduire que la suite définie par $(x_{0}, y_{0})$ et, pour $n \geqslant 0$, 
    $$x_{n + 1} = \dfrac{1}{2}(\cos x_{n} - \sin y_{n}), \qquad y_{n + 1} = \dfrac{1}{2}(\sin x_{n} - \cos y_{n})$$
     converge pour tout $(x_{0}, y_{0})$. Quelle équation vérifie sa limite ?
  corrige: |
    La suite est la suite des itérés de $G = \frac{1}{2}F$ ; on montre que $G$ est contractante.

    **1.** $J_{F}(x, y) = \begin{pmatrix} -\sin x & -\cos y \\ \cos x & \sin y \end{pmatrix}$. La norme d'opérateur euclidienne est majorée par la norme de Frobenius : 
    $$|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} F(x, y)|\mkern-1.5mu|\mkern-1.5mu| \leqslant \sqrt{\sin^{2}x + \cos^{2}y + \cos^{2}x + \sin^{2}y} = \boxed{\sqrt{2}}.$$

    **2.** $G = \frac{1}{2}F$ vérifie $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} G|\mkern-1.5mu|\mkern-1.5mu| \leqslant \frac{\sqrt{2}}{2} < 1$, donc, par l'inégalité des accroissements finis sur $\mathbb{R}^{2}$, $G$ est $\frac{\sqrt{2}}{2}$-contractante. Par le théorème du point fixe de Banach, 
    $$\boxed{\text{la suite converge pour tout } (x_{0}, y_{0})}$$
     vers l'unique point fixe $(\ell_{1}, \ell_{2})$ de $G$, solution de 
    $$\boxed{2\ell_{1} = \cos\ell_{1} - \sin\ell_{2}, \qquad 2\ell_{2} = \sin\ell_{1} - \cos\ell_{2}}.$$
     Numériquement, $(\ell_{1}, \ell_{2}) \approx (0{,}54190 \,;\, -0{,}22906)$, et l'erreur est au moins divisée par $\sqrt{2}$ à chaque pas.

    ![Figure](documents/figures/2e347229ecf0ca2a.svg)

    Partant de $(2, 1)$, les itérés tournent autour du point fixe en s'en rapprochant ; dès le cinquième pas, ils sont à moins de $0{,}1$ de la limite.
- id: "l3-cd-02-50"
  feuille: "f-l3-cd-02"
  numero: 50
  partie: "Accroissements finis"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [accroissements finis, matrice jacobienne]
  noeuds: [gd-accroissements, gd-differentielle]
  notions: [matrice-jacobienne]
  page_enonce: 10
  page_corrige: 26
  enonce: |
    Soit $f : \mathbb{R}^{2} \to \mathbb{R}^{2}$, $f(x, y) = (x^{2} - y, x^{2} + y^{2})$, et $g = f \circ f$.

    **1.** Montrer que $f$ et $g$ sont de classe $\mathcal{C}^{1}$.

    **2.** Calculer la matrice jacobienne de $f$ en tout point $(x, y)$, puis celle de $g$ en $(0, 0)$.

    **3.** Montrer qu'il existe $\rho > 0$ tel que $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} g(x, y)|\mkern-1.5mu|\mkern-1.5mu| \leqslant \dfrac{1}{2}$ pour tout $(x, y)$ de la boule fermée $B_{f}\big((0, 0), \rho\big)$.

    **4.** Montrer que $g$ admet un unique point fixe dans $B_{f}\big((0, 0), \rho\big)$.
  corrige: |
    On combine la règle de la chaîne, la continuité de $\mathrm{d} g$ et le point fixe de Banach sur une boule fermée.

    **1.** Les coordonnées de $f$ sont polynomiales : 
    $$\boxed{f \text{ est de classe } \mathcal{C}^{\infty}}\text{,}$$
     et $g = f \circ f$ aussi (cours, prop. 15).

    **2.** 
    $$\boxed{J_{f}(x, y) = \begin{pmatrix} 2x & -1 \\ 2x & 2y \end{pmatrix}}\text{.}$$
     Comme $f(0, 0) = (0, 0)$, $J_{g}(0, 0) = J_{f}(0, 0)^{2} = \begin{pmatrix} 0 & -1 \\ 0 & 0 \end{pmatrix}^{2} = \boxed{\begin{pmatrix} 0 & 0 \\ 0 & 0 \end{pmatrix}}$.

    **3.** $\mathrm{d} g$ est continue et nulle en $0$, donc il existe $\rho > 0$ tel que $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} g|\mkern-1.5mu|\mkern-1.5mu| \leqslant \frac{1}{2}$ sur $B_{f}(0, \rho)$. On peut l'expliciter : le calcul donne 
    $$J_{g}(x, y) = \begin{pmatrix} 4x^{3} - 4xy - 2x & -2x^{2} \\ 8x^{3} + 4xy^{2} - 4xy & 4x^{2}y - 2x^{2} + 4y^{3} + 2y \end{pmatrix}.$$
     Pour $r = \lVert (x, y) \rVert_{2} \leqslant \rho \leqslant 1$, les coefficients sont majorés par $10\rho$, $2\rho$, $16\rho$ et $12\rho$, donc la norme de Frobenius par $\rho\sqrt{504} < 23\rho$ : $\boxed{\rho = \frac{1}{46}}$ convient. Le calcul numérique montre que $\rho = 0{,}2$ convient déjà ($|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} g|\mkern-1.5mu|\mkern-1.5mu| \leqslant 0{,}44$ sur $B_{f}(0; 0{,}2)$).

    **4.** Sur le convexe $B_{f}(0, \rho)$, $g$ est $\frac{1}{2}$-lipschitzienne, et $g(0) = f(f(0)) = 0$, donc $\lVert g(p) \rVert \leqslant \frac{1}{2}\lVert p \rVert \leqslant \rho$ : $g$ envoie la boule fermée, complète, dans elle-même. Par le théorème du point fixe de Banach, $g$ y a un unique point fixe, qui est évidemment $\boxed{(0, 0)}$.
- id: "l3-cd-02-51"
