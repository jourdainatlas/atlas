  notions: [matrice-jacobienne, coordonnees-polaires]
  page_enonce: 7
  page_corrige: 19
  enonce: |
    *(Coordonnées polaires.)* Montrer que l'application 
    $$\Phi : \,]0, +\infty[ \times ]-\pi, \pi[ \,\to \mathbb{R}^{2} \setminus \{(x, 0) \,;\, x \leqslant 0\}, \qquad (r, \theta) \mapsto (r\cos\theta, r\sin\theta)$$
     est de classe $\mathcal{C}^{1}$. À toute fonction $f$ différentiable en coordonnées cartésiennes, on associe $g = f \circ \Phi$. Exprimer $\dfrac{\partial g}{\partial r}$ et $\dfrac{\partial g}{\partial \theta}$ en fonction de $\dfrac{\partial f}{\partial x}$ et $\dfrac{\partial f}{\partial y}$.
  corrige: |
    Les coordonnées de $\Phi$ sont de classe $\mathcal{C}^{\infty}$, donc 
    $$\boxed{\Phi \text{ est de classe } \mathcal{C}^{1}}\text{,}$$
     de jacobienne $J_{\Phi}(r, \theta) = \begin{pmatrix} \cos\theta & -r\sin\theta \\ \sin\theta & r\cos\theta \end{pmatrix}$. Comme $J_{g} = J_{f}\big(\Phi(r, \theta)\big)J_{\Phi}(r, \theta)$, 
    $$\boxed{\dfrac{\partial g}{\partial r} = \cos\theta\,\dfrac{\partial f}{\partial x} + \sin\theta\,\dfrac{\partial f}{\partial y}, \qquad \dfrac{\partial g}{\partial \theta} = -r\sin\theta\,\dfrac{\partial f}{\partial x} + r\cos\theta\,\dfrac{\partial f}{\partial y}},$$
     les dérivées de $f$ étant prises en $(r\cos\theta, r\sin\theta)$.

    ![Figure](documents/figures/78080f104859958d.svg)

    Les deux colonnes de $J_{\Phi}$ sont orthogonales : le vecteur unitaire radial et le vecteur orthoradial, de longueur $r$. Le demi-axe négatif est exclu pour que l'angle $\theta \in \,]-\pi, \pi[$ soit défini de façon continue.
