  enonce: |
    Soit $f : U \to F$ et $x_{0} \in U$, $h \in E$. On pose $g(t) = f(x_{0} + th)$, pour $t$ réel assez petit.

    **1.** On suppose $f$ différentiable en $x_{0}$. Calculer $g'(0)$.

    **2.** On suppose $f$ de classe $\mathcal{C}^{1}$ sur $U$. Montrer que $g$ est de classe $\mathcal{C}^{1}$ au voisinage de $0$.
  corrige: |
    $g$ est la composée de $f$ et de la courbe affine $t \mapsto x_{0} + th$, de vecteur dérivé $h$.

    **1.** Par la règle de la chaîne (cours, prop. 11), 
    $$\boxed{g'(0) = \mathrm{d} f(x_{0})\cdot h = D_{h} f(x_{0})}\text{.}$$

    **2.** Pour $t$ petit, $g'(t) = \mathrm{d} f(x_{0} + th)\cdot h$. L'application $t \mapsto \mathrm{d} f(x_{0} + th)$ est continue (composée de fonctions continues), et l'évaluation $L \mapsto L\cdot h$ est linéaire continue de $\mathcal{L}(E, F)$ dans $F$. Donc $g'$ est continue : 
    $$\boxed{g \text{ est de classe } \mathcal{C}^{1}}\text{.}$$
- id: "l3-cd-02-34"
  feuille: "f-l3-cd-02"
  numero: 34
  partie: "Composition"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [composition]
  noeuds: [gd-differentielle]
  notions: [matrice-jacobienne]
  page_enonce: 7
  page_corrige: 18
  enonce: |
    **1.** Soit $f : U \to V$, $g : V \to W$ et $h : W \to Z$ (ouverts d'espaces normés), différentiables en $x$, $f(x)$ et $g\big(f(x)\big)$ respectivement. Montrer que $h \circ g \circ f$ est différentiable en $x$ et calculer $\mathrm{d}(h \circ g \circ f)(x)$.

    **2.** Soit $\Phi : E \to F$ différentiable et $G$ un sous-espace vectoriel de $E$. Montrer que la restriction $\varphi = \Phi_{|G}$ est différentiable et exprimer sa différentielle à l'aide de celle de $\Phi$.
  corrige: |
    **1.** On applique deux fois la règle de la chaîne : $g \circ f$ est différentiable en $x$, de différentielle $\mathrm{d} g\big(f(x)\big) \circ \mathrm{d} f(x)$, puis 
    $$\boxed{\mathrm{d}(h \circ g \circ f)(x) = \mathrm{d} h\big(g(f(x))\big) \circ \mathrm{d} g\big(f(x)\big) \circ \mathrm{d} f(x)}.$$
     Chaque différentielle est prise au point « vu » par l'application correspondante.

    **2.** $\varphi = \Phi \circ i$, où $i : G \to E$ est l'inclusion, linéaire et continue ($\lVert i(x) \rVert = \lVert x \rVert$). Donc 
    $$\boxed{\mathrm{d}\varphi(x) = \mathrm{d}\Phi(x) \circ i = \mathrm{d}\Phi(x)_{|G}}\text{.}$$
- id: "l3-cd-02-35"
  feuille: "f-l3-cd-02"
  numero: 35
  partie: "Composition"
  etoiles: 2
  types: [Démonstration, Calcul]
