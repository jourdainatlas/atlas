  page_enonce: 7
  page_corrige: 18
  enonce: |
    Soit $a$, $b : \mathbb{R} \to \mathbb{R}$ de classe $\mathcal{C}^{1}$ et $f : \mathbb{R}^{2} \to \mathbb{R}$ continue, admettant une dérivée partielle $\dfrac{\partial f}{\partial x}$ continue sur $\mathbb{R}^{2}$. Montrer que $\varphi(x) = \displaystyle\int_{a(x)}^{b(x)}f(x, t)\,\mathrm{d} t$ est dérivable et calculer sa dérivée en fonction de celles de $a$, $b$ et $f$. On pourra considérer $\Psi(x, u, v) = \displaystyle\int_{u}^{v}f(x, t)\,\mathrm{d} t$.
  corrige: |
    On suit l'indication : on étudie $\Psi$, puis on compose avec $x \mapsto \big(x, a(x), b(x)\big)$.

    $\triangleright$ *Dérivées partielles de $\Psi$.* Par le théorème fondamental de l'analyse (cours, th. 2), $\dfrac{\partial \Psi}{\partial v}(x, u, v) = f(x, v)$ et $\dfrac{\partial \Psi}{\partial u}(x, u, v) = -f(x, u)$, continues. Par dérivation sous le signe intégrale sur le segment $[u, v]$ (*Rappel.* : $\dfrac{\partial f}{\partial x}$ est continue), $\dfrac{\partial \Psi}{\partial x}(x, u, v) = \int_{u}^{v}\dfrac{\partial f}{\partial x}(x, t)\,\mathrm{d} t$, qui est continue en $(x, u, v)$ par continuité uniforme de $\dfrac{\partial f}{\partial x}$ sur les compacts. Donc $\Psi$ est de classe $\mathcal{C}^{1}$ (cours, th. 5).

    $\triangleright$ *Composition.* $\varphi(x) = \Psi\big(x, a(x), b(x)\big)$, et la règle de la chaîne donne 
    $$\boxed{\varphi'(x) = \int_{a(x)}^{b(x)}\dfrac{\partial f}{\partial x}(x, t)\,\mathrm{d} t + f\big(x, b(x)\big)\,b'(x) - f\big(x, a(x)\big)\,a'(x)}.$$
     Chacun des trois termes correspond à une manière dont $x$ intervient : dans la fonction intégrée, à la borne supérieure, à la borne inférieure.
- id: "l3-cd-02-36"
  feuille: "f-l3-cd-02"
  numero: 36
  partie: "Composition"
  etoiles: 1
