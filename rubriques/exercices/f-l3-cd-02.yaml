  page_corrige: 20
  enonce: |
    *(Inversion.)* Soit $f : \mathbb{R}^{2} \setminus \{0\} \to \mathbb{R}^{2}$, $f(x, y) = \Big(\dfrac{x}{x^{2} + y^{2}}, \dfrac{y}{x^{2} + y^{2}}\Big)$. On munit $\mathbb{R}^{2}$ de la norme euclidienne et $\mathcal{M}_{2}(\mathbb{R})$ de la norme d'opérateur associée.

    **1.** Déterminer $f \circ f$ et montrer que $f$ est un difféomorphisme de classe $\mathcal{C}^{1}$ de $\mathbb{R}^{2} \setminus \{0\}$ sur lui-même.

    **2.** Pour $a$, $b \in \mathbb{R}$, on pose $A = \begin{pmatrix} a & b \\ b & -a \end{pmatrix}$. Montrer que $|\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu| = \sqrt{a^{2} + b^{2}}$.

    **3.** Calculer la matrice jacobienne de $f$ et montrer que $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} f(x, y)|\mkern-1.5mu|\mkern-1.5mu| = \dfrac{1}{x^{2} + y^{2}}$ pour tout $(x, y) \neq (0, 0)$.

    **4.** Montrer que l'application linéaire $\mathrm{d} f(x, y)$ conserve les angles non orientés.
  corrige: |
    L'inversion échange l'intérieur et l'extérieur du cercle unité ; sa différentielle est une similitude indirecte.

    **1.** $\lVert f(p) \rVert = \dfrac{1}{\lVert p \rVert}$ et $f(p) = \dfrac{p}{\lVert p \rVert^{2}}$, donc $f\big(f(p)\big) = \dfrac{p/\lVert p \rVert^{2}}{1/\lVert p \rVert^{2}} = p$ : $\boxed{f \circ f = \mathrm{Id}}$. Ainsi $f$ est une bijection de $\mathbb{R}^{2} \setminus \{0\}$ sur lui-même, égale à sa réciproque ; ses coordonnées sont rationnelles, de classe $\mathcal{C}^{1}$. 
    $$\boxed{f \text{ est un } \mathcal{C}^{1}\text{-difféomorphisme}}\text{.}$$

    **2.** ${}^{t}AA = (a^{2} + b^{2})I_{2}$, donc $\lVert Ax \rVert_{2}^{2} = {}^{t}x{}^{t}AAx = (a^{2} + b^{2})\lVert x \rVert_{2}^{2}$ et 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu| = \sqrt{a^{2} + b^{2}}}.$$

    **3.** Avec $r^{2} = x^{2} + y^{2}$, 
    $$J_{f}(x, y) = \frac{1}{r^{4}}\begin{pmatrix} y^{2} - x^{2} & -2xy \\ -2xy & x^{2} - y^{2} \end{pmatrix} = \frac{1}{r^{2}}\begin{pmatrix} a & b \\ b & -a \end{pmatrix}, \qquad a = \frac{y^{2} - x^{2}}{r^{2}},\ b = \frac{-2xy}{r^{2}}.$$
     Or $a^{2} + b^{2} = \dfrac{(y^{2} - x^{2})^{2} + 4x^{2}y^{2}}{r^{4}} = 1$, donc, par la question 2, 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} f(x, y)|\mkern-1.5mu|\mkern-1.5mu| = \frac{1}{x^{2} + y^{2}}}\text{.}$$

    **4.** $\mathrm{d} f(x, y) = \dfrac{1}{r^{2}}S$ avec $S = \begin{pmatrix} a & b \\ b & -a \end{pmatrix}$, $a^{2} + b^{2} = 1$ : $S$ est orthogonale (une symétrie orthogonale). Elle conserve le produit scalaire, et la multiplication par $\frac{1}{r^{2}}$ ne change pas les angles : $\dfrac{\langle \mathrm{d} f\cdot u, \mathrm{d} f\cdot v \rangle}{\lVert \mathrm{d} f\cdot u \rVert\,\lVert \mathrm{d} f\cdot v \rVert} = \dfrac{\langle u, v \rangle}{\lVert u \rVert\,\lVert v \rVert}$. 
    $$\boxed{\mathrm{d} f(x, y) \text{ conserve les angles non orientés}}\text{,}$$
     et renverse l'orientation ($\det S = -1$).

    ![Figure](documents/figures/ac3910e57b2f9f8d.svg)

    Les droites orthogonales $x = 1$ et $y = 1$ ont pour images des cercles passant par l'origine, qui se coupent encore à angle droit en $f(1, 1) = (\frac{1}{2}, \frac{1}{2})$ : c'est la conservation des angles de la question 4.
- id: "l3-cd-02-40"
  feuille: "f-l3-cd-02"
  numero: 40
  partie: "Composition"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [composition, applications lipschitziennes]
  noeuds: [gd-differentielle, gd-accroissements]
  notions: [matrice-jacobienne]
  page_enonce: 8
  page_corrige: 21
  enonce: |
    Soit $F$ un fermé non vide de $\mathbb{R}^{n}$ euclidien et $f : \mathbb{R}^{n} \to \mathbb{R}$, $f(x) = d(x, F)$. On rappelle que $f$ est $1$-lipschitzienne et que, pour tout $x$, il existe $y \in F$ tel que $f(x) = \lVert x - y \rVert$.

    **1.** On suppose $f$ différentiable en un point $x \notin F$. Montrer que $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} f(x)|\mkern-1.5mu|\mkern-1.5mu| \leqslant 1$.

    **2.** Soit $y \in F$ tel que $f(x) = \lVert x - y \rVert$ et $\varphi(t) = f\big((1 - t)x + ty\big)$ pour $t \in [0, 1]$. En calculant $\varphi'(0)$ de deux façons, montrer que $\mathrm{d} f(x)\cdot\dfrac{x - y}{\lVert x - y \rVert} = 1$ et $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} f(x)|\mkern-1.5mu|\mkern-1.5mu| = 1$.

    **3.** En déduire que le point $y$ est unique.
  corrige: |
    On évalue la dérivée de $f$ le long du segment qui joint $x$ à son projeté $y$ de deux manières : par la géométrie, et par la règle de la chaîne.

    **1.** $|f(x + th) - f(x)| \leqslant |t|\,\lVert h \rVert$, d'où $|\mathrm{d} f(x)\cdot h| \leqslant \lVert h \rVert$ et 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} f(x)|\mkern-1.5mu|\mkern-1.5mu| \leqslant 1}.$$

    **2.** Pour $t \in [0, 1]$, $z_{t} = (1 - t)x + ty$ vérifie $f(z_{t}) \leqslant \lVert z_{t} - y \rVert = (1 - t)\lVert x - y \rVert$, et $f(z_{t}) \geqslant f(x) - \lVert z_{t} - x \rVert = (1 - t)\lVert x - y \rVert$ (la fonction $f$ est $1$-lipschitzienne). Donc $\varphi(t) = (1 - t)\lVert x - y \rVert$ et $\varphi'(0) = -\lVert x - y \rVert$. Par la règle de la chaîne, $\varphi'(0) = \mathrm{d} f(x)\cdot(y - x)$. D'où 
    $$\boxed{\mathrm{d} f(x)\cdot\frac{x - y}{\lVert x - y \rVert} = 1},$$
     et, avec la question 1, 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} f(x)|\mkern-1.5mu|\mkern-1.5mu| = 1}.$$

    **3.** La forme linéaire $\mathrm{d} f(x)$ s'écrit $h \mapsto \langle w, h \rangle$ avec $\lVert w \rVert = 1$. Le vecteur unitaire $u = \frac{x - y}{\lVert x - y \rVert}$ vérifie $\langle w, u \rangle = 1 = \lVert w \rVert\,\lVert u \rVert$ : c'est le cas d'égalité de Cauchy-Schwarz, donc $u = w = \nabla f(x)$. Ainsi $y = x - f(x)\nabla f(x)$ est déterminé par $f$ : 
    $$\boxed{\text{le point } y \text{ est unique}}\text{.}$$

    ![Figure](documents/figures/148823d2fdf654aa.svg)

    Le disque centré en $x$ de rayon $d(x, F)$ touche $F$ en $y$ ; le gradient de la distance, s'il existe, pointe à l'opposé de $y$. Lorsque $x$ a deux projetés (par exemple le centre d'un cercle $F$), aucune direction n'est privilégiée, et $f$ n'est pas différentiable en $x$.
