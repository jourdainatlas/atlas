  enonce: |
    *(Quotient de Rayleigh.)* Soit $E$ un espace préhilbertien réel et $u$ un endomorphisme continu de $E$, symétrique : $\langle u(x), y \rangle = \langle x, u(y) \rangle$ pour tous $x$, $y \in E$.

    **1.** Montrer que $x \mapsto \langle u(x), x \rangle$ est différentiable sur $E$ et calculer sa différentielle. En déduire que $x \mapsto \lVert x \rVert^{2}$ est différentiable.

    **2.** On pose $\varphi(x) = \dfrac{\langle u(x), x \rangle}{\langle x, x \rangle}$ pour $x \in E \setminus \{0\}$. Montrer que $\varphi$ est différentiable et calculer $\mathrm{d}\varphi$. Montrer que, pour $a \neq 0$, $\mathrm{d}\varphi(a) = 0$ si et seulement si $a$ est un vecteur propre de $u$.
  corrige: |
    On applique l'exercice 1 et la différentielle d'un quotient.

    **1.** $q(x + h) - q(x) = \langle u(x), h \rangle + \langle u(h), x \rangle + \langle u(h), h \rangle = 2\langle u(x), h \rangle + \langle u(h), h \rangle$ par symétrie, et $|\langle u(h), h \rangle| \leqslant |\mkern-1.5mu|\mkern-1.5mu|u|\mkern-1.5mu|\mkern-1.5mu|\,\lVert h \rVert^{2}$. Donc 
    $$\boxed{\mathrm{d} q(x)\cdot h = 2\langle u(x), h \rangle}.$$
     Avec $u = \mathrm{Id}$, $x \mapsto \lVert x \rVert^{2}$ est différentiable, de différentielle $h \mapsto 2\langle x, h \rangle$.

    **2.** $\varphi = \dfrac{q}{\lVert \cdot \rVert^{2}}$ est un quotient de fonctions différentiables dont le dénominateur ne s'annule pas sur $E \setminus \{0\}$ : 
    $$\mathrm{d}\varphi(x)\cdot h = \frac{2\langle u(x), h \rangle\lVert x \rVert^{2} - 2\langle u(x), x \rangle\langle x, h \rangle}{\lVert x \rVert^{4}} = \boxed{\frac{2}{\lVert x \rVert^{2}}\langle u(x) - \varphi(x)x, h \rangle}.$$
     Donc $\mathrm{d}\varphi(a) = 0$ si et seulement si $u(a) = \varphi(a)a$, c'est-à-dire 
    $$\boxed{a \text{ est vecteur propre de } u}\text{,}$$
     la valeur propre étant $\varphi(a)$.

    *Remarque.* Le chapitre 5 du cours en tire que $\max_{a \neq 0}\varphi(a)$, atteint en dimension finie par compacité de la sphère, est la plus grande valeur propre de $u$.
