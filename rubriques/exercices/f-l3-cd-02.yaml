- id: "l3-cd-02-01"
  feuille: "f-l3-cd-02"
  numero: 1
  partie: "Différentiabilité : premiers exemples"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [différentiabilité]
  noeuds: [gd-differentielle]
  notions: [differentiable]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Écrire la différentielle en tout point d'une application constante, d'une application linéaire, puis d'une application quadratique $q(x) = \langle Ax, x \rangle$ sur $\mathbb{R}^{n}$, où $A \in \mathcal{M}_{n}(\mathbb{R})$.

    **2.** Soit $\phi : E \times F \to G$ une application bilinéaire continue (ce qui est automatique si $E$ et $F$ sont de dimension finie). Montrer que $\phi$ est différentiable en tout point $(e, f)$ de $E \times F$ et calculer $\mathrm{d}\phi(e, f)$.
  corrige: |
    Dans chaque cas, on écrit $f(x + h) - f(x)$, on y reconnaît une partie linéaire continue en $h$, et on vérifie que le reste est un $o(\lVert h \rVert)$.

    **1.** Si $f$ est constante, $f(x + h) - f(x) = 0$, donc $\boxed{\mathrm{d} f(x) = 0}$. Si $f = L$ est linéaire continue, $L(x + h) - L(x) = L(h)$ exactement, donc $\boxed{\mathrm{d} L(x) = L}$ en tout point : une application linéaire est sa propre différentielle. Pour $q(x) = \langle Ax, x \rangle$, 
    $$q(x + h) - q(x) = \langle Ax, h \rangle + \langle Ah, x \rangle + \langle Ah, h \rangle, \qquad |\langle Ah, h \rangle| \leqslant |\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|\,\lVert h \rVert_{2}^{2} = o(\lVert h \rVert_{2}),$$
     et $\langle Ah, x \rangle = \langle h, {}^{t}Ax \rangle$, d'où 
    $$\boxed{\mathrm{d} q(x)\cdot h = \langle (A + {}^{t}A)x, h \rangle}\text{,}$$
     soit $\nabla q(x) = (A + {}^{t}A)x$, qui vaut $2Ax$ si $A$ est symétrique.

    **2.** Par bilinéarité, 
    $$\phi(e + h, f + k) - \phi(e, f) = \phi(h, f) + \phi(e, k) + \phi(h, k).$$
     L'application $(h, k) \mapsto \phi(h, f) + \phi(e, k)$ est linéaire, et continue car $\phi$ l'est : il existe $C$ tel que $\lVert \phi(u, v) \rVert \leqslant C\lVert u \rVert\,\lVert v \rVert$ (cours, prop. 2). Avec la norme $\lVert (h, k) \rVert = \max(\lVert h \rVert, \lVert k \rVert)$, le reste vérifie $\lVert \phi(h, k) \rVert \leqslant C\lVert (h, k) \rVert^{2} = o\big(\lVert (h, k) \rVert\big)$. Donc 
    $$\boxed{\mathrm{d}\phi(e, f)\cdot(h, k) = \phi(h, f) + \phi(e, k)}.$$

    *À retenir.* On « dérive un produit » : on fait varier un facteur à la fois, comme dans $(uv)' = u'v + uv'$. Le terme $\phi(h, k)$, quadratique, disparaît.
- id: "l3-cd-02-02"
  feuille: "f-l3-cd-02"
  numero: 2
  partie: "Différentiabilité : premiers exemples"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [différentiabilité]
  noeuds: [gd-differentielle]
  notions: [differentiable]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Montrer que les applications suivantes sont différentiables en tout point et calculer leur différentielle.

    **1.** $\theta : \mathcal{M}_{n}(\mathbb{R}) \times \mathcal{M}_{n}(\mathbb{R}) \to \mathcal{M}_{n}(\mathbb{R})$, $\theta(A, B) = AB$, et, pour $E = \mathcal{L}(\mathbb{R}^{n})$, l'application $(u, v) \mapsto u \circ v$ de $E \times E$ dans $E$ au point $(u_{0}, v_{0})$.

    **2.** $(u, v) \mapsto \operatorname{Tr}(u \circ v)$, de $E \times E$ dans $\mathbb{R}$, au point $(u_{0}, v_{0})$.

    **3.** Pour $x \in \mathbb{R}^{n}$ fixé, $f_{2} : \mathcal{M}_{n}(\mathbb{R}) \to \mathbb{R}^{n}$, $f_{2}(A) = Ax$ ; puis $f_{3} : \mathcal{M}_{n}(\mathbb{R}) \times \mathbb{R}^{n} \to \mathbb{R}^{n}$, $f_{3}(A, x) = Ax$, où $\mathbb{R}^{n}$ est muni de $\lVert \cdot \rVert_{2}$. Étudier aussi la continuité de $f_{2}$ et de $f_{3}$.

    **4.** Pour $M \in \mathcal{M}_{n}(\mathbb{R})$ fixée, $f : \mathcal{M}_{n}(\mathbb{R}) \to \mathcal{M}_{n}(\mathbb{R})$, $f(A) = AMA$.
  corrige: |
    Toutes ces applications sont linéaires ou bilinéaires continues (on est en dimension finie), donc l'exercice 1 donne leur différentielle sans calcul.

    **1.** $\theta$ est bilinéaire, d'où 
    $$\boxed{\mathrm{d}\theta(A, B)\cdot(H, K) = HB + AK}\text{.}$$
     De même, 
    $$\boxed{\mathrm{d}(u, v \mapsto u \circ v)(u_{0}, v_{0})\cdot(h, k) = h \circ v_{0} + u_{0} \circ k}\text{.}$$
     L'ordre des facteurs doit être respecté, puisque le produit matriciel n'est pas commutatif.

    **2.** $(u, v) \mapsto \operatorname{Tr}(u \circ v)$ est la composée de l'application bilinéaire précédente et de la forme linéaire $\operatorname{Tr}$, donc 
    $$\boxed{\mathrm{d}(\operatorname{Tr}(u \circ v))(u_{0}, v_{0})\cdot(h, k) = \operatorname{Tr}(h \circ v_{0}) + \operatorname{Tr}(u_{0} \circ k)}\text{.}$$

    **3.** $f_{2}$ est linéaire et $\lVert f_{2}(A) \rVert_{2} = \lVert Ax \rVert_{2} \leqslant |\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|\,\lVert x \rVert_{2}$ (norme d'opérateur associée à $\lVert \cdot \rVert_{2}$) : elle est continue, et 
    $$\boxed{\mathrm{d} f_{2}(A)\cdot H = Hx}.$$
     L'application $f_{3}$ est bilinéaire et vérifie $\lVert f_{3}(A, x) \rVert_{2} \leqslant |\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|\,\lVert x \rVert_{2}$ ; elle est donc continue, et 
    $$\boxed{\mathrm{d} f_{3}(A, x)\cdot(H, k) = Hx + Ak}\text{.}$$

    **4.** $f(A) = AMA = \psi(A, A)$ avec $\psi(A, B) = AMB$ bilinéaire. Par la règle de la chaîne appliquée à $A \mapsto (A, A)$, ou en développant directement $(A + H)M(A + H) - AMA = HMA + AMH + HMH$ avec $|\mkern-1.5mu|\mkern-1.5mu|HMH|\mkern-1.5mu|\mkern-1.5mu| \leqslant |\mkern-1.5mu|\mkern-1.5mu|M|\mkern-1.5mu|\mkern-1.5mu|\,|\mkern-1.5mu|\mkern-1.5mu|H|\mkern-1.5mu|\mkern-1.5mu|^{2}$, 
    $$\boxed{\mathrm{d} f(A)\cdot H = HMA + AMH}.$$
- id: "l3-cd-02-03"
  feuille: "f-l3-cd-02"
  numero: 3
  partie: "Différentiabilité : premiers exemples"
  etoiles: 2
  types: [Calcul]
  mots_cles: [différentiabilité]
  noeuds: [gd-differentielle]
  notions: [differentiable]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Soit $f : \mathcal{M}_{n}(\mathbb{R}) \to \mathcal{M}_{n}(\mathbb{R})$, $f(A) = A^{2}$. Étudier la continuité et la différentiabilité de $f$. Pour 
    $$C_{1} = \begin{pmatrix} 1 & 1 \\ 2 & 3 \end{pmatrix}, \qquad C_{2} = \begin{pmatrix} 1 & 0 \\ 0 & 0 \end{pmatrix},$$
     calculer $\mathrm{d} f(C_{1})$ et $\mathrm{d} f(C_{1})\cdot C_{2}$.

    **2.** Soit $E$ un espace vectoriel normé de dimension finie et $k \geqslant 1$ un entier. L'espace $\mathcal{L}(E)$ est muni de la norme d'opérateur. Montrer que $L \mapsto L^{k}$ est différentiable sur $\mathcal{L}(E)$ et calculer sa différentielle. En déduire la différentielle de $A \mapsto A^{k}$ sur $\mathcal{M}_{n}(\mathbb{R})$.
  corrige: |
    Comme à l'exercice 2, on développe, et on contrôle le reste grâce à $|\mkern-1.5mu|\mkern-1.5mu|AB|\mkern-1.5mu|\mkern-1.5mu| \leqslant |\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|\,|\mkern-1.5mu|\mkern-1.5mu|B|\mkern-1.5mu|\mkern-1.5mu|$.

    **1.** $(A + H)^{2} - A^{2} = AH + HA + H^{2}$ et $|\mkern-1.5mu|\mkern-1.5mu|H^{2}|\mkern-1.5mu|\mkern-1.5mu| \leqslant |\mkern-1.5mu|\mkern-1.5mu|H|\mkern-1.5mu|\mkern-1.5mu|^{2}$. Donc $f$ est différentiable, donc continue, et 
    $$\boxed{\mathrm{d} f(A)\cdot H = AH + HA}.$$
     *Piège.* On n'écrit pas $2AH$ : $A$ et $H$ ne commutent pas en général.

    Pour $A = C_{1}$ et $H = C_{2}$ : 
    $$\mathrm{d} f(C_{1})\cdot C_{2} = C_{1}C_{2} + C_{2}C_{1} = \begin{pmatrix} 1 & 0 \\ 2 & 0 \end{pmatrix} + \begin{pmatrix} 1 & 1 \\ 0 & 0 \end{pmatrix} = \boxed{\begin{pmatrix} 2 & 1 \\ 2 & 0 \end{pmatrix}}.$$
     Quant à $\mathrm{d} f(C_{1})$, c'est l'endomorphisme $H \mapsto C_{1}H + HC_{1}$ de $\mathcal{M}_{2}(\mathbb{R})$. Sa matrice dans la base $(E_{11}, E_{12}, E_{21}, E_{22})$ s'obtient en calculant l'image de chaque $E_{ij}$ : 
    $$\boxed{\begin{pmatrix} 2 & 2 & 1 & 0 \\ 1 & 4 & 0 & 1 \\ 2 & 0 & 4 & 2 \\ 0 & 2 & 1 & 6 \end{pmatrix}}.$$
     Par exemple, $C_{1}E_{11} + E_{11}C_{1} = \begin{pmatrix} 1 & 0 \\ 2 & 0 \end{pmatrix} + \begin{pmatrix} 1 & 1 \\ 0 & 0 \end{pmatrix} = \begin{pmatrix} 2 & 1 \\ 2 & 0 \end{pmatrix}$ donne la première colonne.

    **2.** On raisonne par récurrence sur $k$. Pour $k = 1$, $L \mapsto L$ est linéaire, de différentielle $\mathrm{Id}$. Si $\varphi_{k - 1} : L \mapsto L^{k - 1}$ est différentiable, alors $\varphi_{k}(L) = L \circ \varphi_{k - 1}(L)$ est l'image de $\big(L, \varphi_{k - 1}(L)\big)$ par la composition, bilinéaire continue, et la formule de Leibniz (cours, prop. 12) donne $\mathrm{d}\varphi_{k}(L)\cdot H = H \circ L^{k - 1} + L \circ \mathrm{d}\varphi_{k - 1}(L)\cdot H$. On obtient ainsi 
    $$\boxed{\mathrm{d}\varphi_{k}(L)\cdot H = \sum_{j = 0}^{k - 1}L^{j} \circ H \circ L^{k - 1 - j}}.$$
     Pour les matrices, $\mathcal{M}_{n}(\mathbb{R})$ s'identifie à $\mathcal{L}(\mathbb{R}^{n})$ et la même formule vaut pour $A \mapsto A^{k}$ : $\mathrm{d}(A^{k})\cdot H = \sum_{j = 0}^{k - 1}A^{j}HA^{k - 1 - j}$, qui se réduit à $kA^{k - 1}H$ seulement si $A$ et $H$ commutent.
- id: "l3-cd-02-04"
  feuille: "f-l3-cd-02"
  numero: 4
  partie: "Différentiabilité : premiers exemples"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [différentiabilité, déterminant]
  noeuds: [gd-differentielle]
  notions: [differentiable]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    *(Différentielle du déterminant.)* Soit $f : \mathcal{M}_{n}(\mathbb{R}) \to \mathbb{R}$, $f(A) = \det A$. On note $E_{ij}$ la matrice dont tous les coefficients sont nuls, sauf celui de la ligne $i$ et de la colonne $j$, qui vaut $1$.

    **1.** Sans calculer la différentielle, montrer que $f$ est continue et de classe $\mathcal{C}^{1}$, donc différentiable.

    **2.** Calculer $\mathrm{d} f(I_{n})\cdot E_{ij}$ pour tous $i$, $j$, puis montrer que $\mathrm{d} f(I_{n})\cdot H = \operatorname{Tr} H$ pour tout $H \in \mathcal{M}_{n}(\mathbb{R})$.

    **3.** Par la même méthode, déterminer la différentielle du déterminant en tout point : montrer que $\mathrm{d} f(A)\cdot H = \operatorname{Tr}\big({}^{t}(\operatorname{com} A)\,H\big)$, d'abord pour $A$ inversible, puis pour toute $A$.
  corrige: |
    On exploite le fait que le déterminant est un polynôme en les coefficients, affine par rapport à chaque coefficient.

    **1.** $\det A = \sum_{\sigma \in \mathfrak{S}_{n}}\varepsilon(\sigma)\prod_{i}a_{\sigma(i)i}$ est un polynôme en les $n^{2}$ coefficients. Ses dérivées partielles sont des polynômes, donc continues : 
    $$\boxed{f \text{ est de classe } \mathcal{C}^{1}}\quad\text{(cours, th. 5),}$$
     donc différentiable et continue.

    **2.** $\mathrm{d} f(I_{n})\cdot E_{ij}$ est la dérivée en $t = 0$ de $t \mapsto \det(I_{n} + tE_{ij})$. Si $i \neq j$, la matrice $I_{n} + tE_{ij}$ est triangulaire à diagonale unité, de déterminant $1$ ; si $i = j$, elle est diagonale, de déterminant $1 + t$. Donc 
    $$\boxed{\mathrm{d} f(I_{n})\cdot E_{ij} = \delta_{ij}}\text{,}$$
     et, par linéarité, pour $H = \sum h_{ij}E_{ij}$ : 
    $$\mathrm{d} f(I_{n})\cdot H = \sum_{i}h_{ii} = \boxed{\operatorname{Tr} H}.$$

    **3.** Développons $\det A$ selon la ligne $i$ : $\det A = \sum_{k}a_{ik}C_{ik}$, où le cofacteur $C_{ik}$ ne dépend pas des coefficients de la ligne $i$. Donc $\dfrac{\partial \det}{\partial a_{ij}}(A) = C_{ij}$, c'est-à-dire $\mathrm{d} f(A)\cdot E_{ij} = C_{ij}$, et 
    $$\mathrm{d} f(A)\cdot H = \sum_{i, j}C_{ij}h_{ij} = \boxed{\operatorname{Tr}\big({}^{t}(\operatorname{com} A)\,H\big)}.$$
     Ce calcul vaut pour toute $A$, inversible ou non. Pour $A$ inversible, on peut aussi écrire $\det(A + H) = \det A\,\det(I_{n} + A^{-1}H)$, ce qui donne, par la question 2 et la règle de la chaîne, $\mathrm{d} f(A)\cdot H = \det A\,\operatorname{Tr}(A^{-1}H)$ ; c'est la même formule, puisque $A^{-1} = \dfrac{1}{\det A}{}^{t}(\operatorname{com} A)$.

    *Remarque.* Le terme du premier ordre du déterminant d'une perturbation de l'identité est la trace : $\det(I_{n} + tH) = 1 + t\operatorname{Tr} H + O(t^{2})$. Le chapitre 6 du cours en tire la formule de Liouville $\det e^{tA} = e^{t\operatorname{Tr} A}$.
- id: "l3-cd-02-05"
  feuille: "f-l3-cd-02"
  numero: 5
  partie: "Différentiabilité : premiers exemples"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [différentiabilité, inversion dans GL]
  noeuds: [gd-differentielle, gd-gl]
  notions: [differentiable]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    *(Différentielle de l'inverse.)*

    **1.** Montrer que, si $|\mkern-1.5mu|\mkern-1.5mu|H|\mkern-1.5mu|\mkern-1.5mu| < 1$, la matrice $I_{n} - H$ est inversible et $(I_{n} - H)^{-1} = \displaystyle\sum_{k = 0}^{+\infty}H^{k}$.

    **2.** Montrer que, pour toute $A \in \mathrm{GL}_{n}(\mathbb{R})$, le groupe $\mathrm{GL}_{n}(\mathbb{R})$ contient une boule ouverte centrée en $A$. En déduire que $\mathrm{GL}_{n}(\mathbb{R})$ est un ouvert de $\mathcal{M}_{n}(\mathbb{R})$.

    **3.** Montrer que $f : \mathrm{GL}_{n}(\mathbb{R}) \to \mathrm{GL}_{n}(\mathbb{R})$, $f(A) = A^{-1}$, est différentiable en $I_{n}$ et calculer sa différentielle, puis qu'elle est différentiable en tout $A$ et calculer $\mathrm{d} f(A)$.

    **4.** Retrouver $\mathrm{d} f(A)$ en différentiant l'égalité $A\,f(A) = I_{n}$.

    **5.** Exprimer les coefficients de $A^{-1}$ en fonction de ceux de $A$ et en déduire que $f$ est de classe $\mathcal{C}^{1}$.
  corrige: |
    C'est la proposition 3 du cours, en dimension finie ; on suit le chemin de la série de Neumann (cours ch. 1, th. 12).

    **1.** La série $\sum H^{k}$ converge absolument, car $|\mkern-1.5mu|\mkern-1.5mu|H^{k}|\mkern-1.5mu|\mkern-1.5mu| \leqslant |\mkern-1.5mu|\mkern-1.5mu|H|\mkern-1.5mu|\mkern-1.5mu|^{k}$ et $|\mkern-1.5mu|\mkern-1.5mu|H|\mkern-1.5mu|\mkern-1.5mu| < 1$, donc elle converge ($\mathcal{M}_{n}(\mathbb{R})$ est complet). Notons $S$ sa somme. Les sommes partielles vérifient $(I_{n} - H)\sum_{k = 0}^{m}H^{k} = I_{n} - H^{m + 1} \to I_{n}$, et de même à droite ; à la limite, $(I_{n} - H)S = S(I_{n} - H) = I_{n}$, d'où 
    $$\boxed{(I_{n} - H)^{-1} = \sum_{k \geqslant 0}H^{k}}\text{.}$$

    **2.** Soit $A$ inversible et $|\mkern-1.5mu|\mkern-1.5mu|H|\mkern-1.5mu|\mkern-1.5mu| < \dfrac{1}{|\mkern-1.5mu|\mkern-1.5mu|A^{-1}|\mkern-1.5mu|\mkern-1.5mu|}$. Alors $A + H = A(I_{n} + A^{-1}H)$ avec $|\mkern-1.5mu|\mkern-1.5mu|A^{-1}H|\mkern-1.5mu|\mkern-1.5mu| < 1$, donc $A + H$ est inversible par la question 1. Ainsi 
    $$\boxed{B\Big(A, \frac{1}{|\mkern-1.5mu|\mkern-1.5mu|A^{-1}|\mkern-1.5mu|\mkern-1.5mu|}\Big) \subset \mathrm{GL}_{n}(\mathbb{R})}\text{,}$$
     et $\mathrm{GL}_{n}(\mathbb{R})$ est ouvert.

    **3.** Pour $|\mkern-1.5mu|\mkern-1.5mu|H|\mkern-1.5mu|\mkern-1.5mu| < 1$, $(I_{n} + H)^{-1} = I_{n} - H + \sum_{k \geqslant 2}(-H)^{k}$, et le reste est majoré par $\sum_{k \geqslant 2}|\mkern-1.5mu|\mkern-1.5mu|H|\mkern-1.5mu|\mkern-1.5mu|^{k} = \dfrac{|\mkern-1.5mu|\mkern-1.5mu|H|\mkern-1.5mu|\mkern-1.5mu|^{2}}{1 - |\mkern-1.5mu|\mkern-1.5mu|H|\mkern-1.5mu|\mkern-1.5mu|} = o(|\mkern-1.5mu|\mkern-1.5mu|H|\mkern-1.5mu|\mkern-1.5mu|)$. Donc $\mathrm{d} f(I_{n})\cdot H = -H$. En $A$ quelconque, 
    $$(A + H)^{-1} = (I_{n} + A^{-1}H)^{-1}A^{-1} = A^{-1} - A^{-1}HA^{-1} + R, \qquad |\mkern-1.5mu|\mkern-1.5mu|R|\mkern-1.5mu|\mkern-1.5mu| \leqslant \frac{|\mkern-1.5mu|\mkern-1.5mu|A^{-1}|\mkern-1.5mu|\mkern-1.5mu|^{3}|\mkern-1.5mu|\mkern-1.5mu|H|\mkern-1.5mu|\mkern-1.5mu|^{2}}{1 - |\mkern-1.5mu|\mkern-1.5mu|A^{-1}|\mkern-1.5mu|\mkern-1.5mu|\,|\mkern-1.5mu|\mkern-1.5mu|H|\mkern-1.5mu|\mkern-1.5mu|},$$
     d'où 
    $$\boxed{\mathrm{d} f(A)\cdot H = -A^{-1}HA^{-1}}.$$

    **4.** L'application $A \mapsto A\,f(A)$ est constante égale à $I_{n}$. Par la formule de Leibniz, sa différentielle $H \mapsto H\,f(A) + A\,\mathrm{d} f(A)\cdot H$ est nulle, d'où $\mathrm{d} f(A)\cdot H = -A^{-1}HA^{-1}$. Ce calcul suppose $f$ différentiable : il retrouve la formule, il ne démontre pas la différentiabilité.

    **5.** D'après la comatrice, $(A^{-1})_{ij} = \dfrac{C_{ji}(A)}{\det A}$ : chaque coefficient de $A^{-1}$ est une fraction rationnelle en les coefficients de $A$, dont le dénominateur ne s'annule pas sur $\mathrm{GL}_{n}(\mathbb{R})$. Ses dérivées partielles sont donc continues, et 
    $$\boxed{f \text{ est de classe } \mathcal{C}^{1}}\quad\text{(cours, th. 5).}$$

    *Remarque.* Pour $n = 1$, la formule redonne $(1/a)' = -1/a^{2}$ ; la place de $H$ « entre » les deux $A^{-1}$ est la seule trace de la non-commutativité.
- id: "l3-cd-02-06"
  feuille: "f-l3-cd-02"
  numero: 6
  partie: "Différentiabilité : premiers exemples"
  etoiles: 1
  types: [Calcul]
  mots_cles: [différentiabilité]
  noeuds: [gd-differentielle]
  notions: [differentiable]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    On note $E_{n}$ l'espace des polynômes réels de degré inférieur ou égal à $n$, muni d'une norme. Étudier la différentiabilité des applications suivantes et calculer leur différentielle : 
    $$\begin{array}{r|ccl} \alpha : & E_{n} & \longrightarrow & \mathbb{R} \\ & P & \longmapsto & \sin\big(P(0)\big) \end{array} \quad \begin{array}{r|ccl} \beta : & E_{n} & \longrightarrow & \mathbb{R} \\ & P & \longmapsto & \displaystyle\int_{0}^{1}\big(P(t)^{3} - P(t)^{2}\big)\,\mathrm{d} t \end{array} \quad \begin{array}{r|ccl} \gamma : & E_{2} & \longrightarrow & E_{4} \\ & P & \longmapsto & P' - P^{2} \end{array}$$
  corrige: |
    L'espace $E_{n}$ est de dimension finie : toutes les normes y sont équivalentes et toutes les applications linéaires y sont continues (cours ch. 1, th. 5), ce qui dispense de vérifier la continuité des différentielles.

    $\triangleright$ *$\alpha$.* C'est la composée de la forme linéaire $P \mapsto P(0)$ et de $\sin$, d'où 
    $$\boxed{\mathrm{d}\alpha(P)\cdot H = \cos\big(P(0)\big)H(0)}\text{.}$$

    $\triangleright$ *$\beta$.* $(P + H)^{3} - (P + H)^{2} - P^{3} + P^{2} = (3P^{2} - 2P)H + (3P - 1)H^{2} + H^{3}$. Les deux derniers termes, intégrés, sont des $O(\lVert H \rVert_{\infty}^{2})$ (avec $\lVert H \rVert_{\infty} = \sup_{[0, 1]}|H|$), d'où 
    $$\boxed{\mathrm{d}\beta(P)\cdot H = \int_{0}^{1}\big(3P(t)^{2} - 2P(t)\big)H(t)\,\mathrm{d} t}.$$

    $\triangleright$ *$\gamma$.* $\gamma(P + H) - \gamma(P) = H' - 2PH - H^{2}$, et $\lVert H^{2} \rVert = O(\lVert H \rVert^{2})$ pour toute norme sur $E_{4}$. Donc 
    $$\boxed{\mathrm{d}\gamma(P)\cdot H = H' - 2PH}.$$

    *Piège.* Il faut $\gamma$ à valeurs dans $E_{4}$ : $P^{2}$ est de degré $4$ lorsque $P \in E_{2}$, donc $\gamma$ ne serait pas définie avec $E_{2}$ comme espace d'arrivée.
- id: "l3-cd-02-07"
  feuille: "f-l3-cd-02"
  numero: 7
  partie: "Différentiabilité : premiers exemples"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [différentiabilité]
  noeuds: [gd-differentielle]
  notions: [differentiable]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $E = \mathcal{C}([0, \pi], \mathbb{R})$ muni de $\lVert \cdot \rVert_{\infty}$. On définit $T_{1}$, $T_{2} : E \to \mathbb{R}$ par 
    $$T_{1}(f) = \int_{0}^{\pi}f(x)\,\mathrm{d} x \qquad \text{et} \qquad T_{2}(f) = \int_{0}^{\pi}f(x)^{2}\,\mathrm{d} x.$$
     Montrer que $T_{1}$ et $T_{2}$ sont différentiables et calculer leurs différentielles au point $f_{0} : x \mapsto x^{2}$.
  corrige: |
    $T_{1}$ est linéaire et $|T_{1}(f)| \leqslant \pi\lVert f \rVert_{\infty}$ : elle est continue, donc égale à sa différentielle en tout point, 
    $$\boxed{\mathrm{d} T_{1}(f_{0})\cdot h = \int_{0}^{\pi}h(x)\,\mathrm{d} x}\text{.}$$
     Pour $T_{2}$, 
    $$T_{2}(f + h) - T_{2}(f) = 2\int_{0}^{\pi}fh + \int_{0}^{\pi}h^{2}, \qquad 0 \leqslant \int_{0}^{\pi}h^{2} \leqslant \pi\lVert h \rVert_{\infty}^{2},$$
     et $h \mapsto 2\int fh$ est linéaire continue (de norme au plus $2\pi\lVert f \rVert_{\infty}$). Au point $f_{0}$, 
    $$\boxed{\mathrm{d} T_{2}(f_{0})\cdot h = 2\int_{0}^{\pi}x^{2}h(x)\,\mathrm{d} x}.$$
- id: "l3-cd-02-08"
  feuille: "f-l3-cd-02"
  numero: 8
  partie: "Différentiabilité : premiers exemples"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [différentiabilité]
  noeuds: [gd-differentielle]
  notions: [differentiable]
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Soit $F = \mathcal{C}([0, 1], \mathbb{R})$ muni de $\lVert f \rVert = \sup_{[0, 1]}|f|$ et $E = \mathcal{C}^{1}([0, 1], \mathbb{R})$ muni de $\lVert f \rVert = \sup_{[0, 1]}|f| + \sup_{[0, 1]}|f'|$. Montrer que l'application $\Phi : E \to F$, $\Phi(f) = f' + f^{2}$, est différentiable en tout point de $E$ et calculer sa différentielle.
  corrige: |
    On procède comme pour $\gamma$ à l'exercice 6, mais en dimension infinie la continuité de la partie linéaire est à vérifier.

    $\Phi(f + h) - \Phi(f) = h' + 2fh + h^{2}$. L'application $L : h \mapsto h' + 2fh$ est linéaire de $E$ dans $F$, et 
    $$\lVert L(h) \rVert_{\infty} \leqslant \lVert h' \rVert_{\infty} + 2\lVert f \rVert_{\infty}\lVert h \rVert_{\infty} \leqslant \max\big(1, 2\lVert f \rVert_{\infty}\big)\lVert h \rVert_{E},$$
     donc $L$ est continue. Le reste vérifie $\lVert h^{2} \rVert_{\infty} \leqslant \lVert h \rVert_{\infty}^{2} \leqslant \lVert h \rVert_{E}^{2} = o(\lVert h \rVert_{E})$. Donc 
    $$\boxed{\mathrm{d}\Phi(f)\cdot h = h' + 2fh}.$$

    *Piège.* Le choix de la norme sur $E$ est essentiel : avec $\lVert \cdot \rVert_{\infty}$ sur $E$, la dérivation $h \mapsto h'$ ne serait pas continue (penser à $h_{n}(t) = \frac{1}{n}\sin(n^{2}t)$, qui tend vers $0$ alors que $\lVert h_{n}' \rVert_{\infty} = n$), et $\Phi$ ne serait même pas continue.
- id: "l3-cd-02-09"
  feuille: "f-l3-cd-02"
  numero: 9
  partie: "Différentiabilité : premiers exemples"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [différentiabilité]
  noeuds: [gd-differentielle]
  notions: [differentiable]
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Soit $X = \mathcal{C}([0, 1], \mathbb{R})$ muni de la norme uniforme et $f \in \mathcal{C}^{1}(\mathbb{R}, \mathbb{R})$. On note $F : X \to X$ l'application $\varphi \mapsto f \circ \varphi$. Montrer que, pour tout $\varphi \in X$, $F$ est différentiable en $\varphi$ et que $\mathrm{d} F(\varphi)$ est l'opérateur de multiplication par $f' \circ \varphi$ : 
    $$\mathrm{d} F(\varphi)\cdot h = (f' \circ \varphi)\,h,$$
     puis que $\mathrm{d} F : X \to \mathcal{L}(X)$ est continue.
  corrige: |
    On applique, en chaque point $t$, l'égalité des accroissements finis sous forme intégrale à $f$, puis on rend l'estimation uniforme grâce à la continuité uniforme de $f'$ sur un segment.

    $\triangleright$ *Différentiabilité.* Soit $\varphi \in X$, $R = \lVert \varphi \rVert_{\infty} + 1$ et $h \in X$ avec $\lVert h \rVert_{\infty} \leqslant 1$. Pour tout $t \in [0, 1]$, 
    $$f\big(\varphi(t) + h(t)\big) - f\big(\varphi(t)\big) - f'\big(\varphi(t)\big)h(t) = h(t)\int_{0}^{1}\Big(f'\big(\varphi(t) + sh(t)\big) - f'\big(\varphi(t)\big)\Big)\mathrm{d} s.$$
     La fonction $f'$ est uniformément continue sur $[-R, R]$ (théorème de Heine, cours ch. 1, th. 4) : pour $\varepsilon > 0$, il existe $\delta \in \,]0, 1]$ tel que $|u - v| \leqslant \delta$ entraîne $|f'(u) - f'(v)| \leqslant \varepsilon$ sur $[-R, R]$. Si $\lVert h \rVert_{\infty} \leqslant \delta$, l'intégrale est majorée par $\varepsilon$ pour tout $t$, et le reste par $\varepsilon\lVert h \rVert_{\infty}$. L'application $h \mapsto (f' \circ \varphi)h$ est linéaire, de norme $\lVert f' \circ \varphi \rVert_{\infty}$ ; donc 
    $$\boxed{\mathrm{d} F(\varphi)\cdot h = (f' \circ \varphi)\,h}\text{.}$$

    $\triangleright$ *Continuité de $\mathrm{d} F$.* La norme de l'opérateur de multiplication par $g$ est $\lVert g \rVert_{\infty}$, donc $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} F(\psi) - \mathrm{d} F(\varphi)|\mkern-1.5mu|\mkern-1.5mu| = \lVert f' \circ \psi - f' \circ \varphi \rVert_{\infty}$, qui est majoré par $\varepsilon$ dès que $\lVert \psi - \varphi \rVert_{\infty} \leqslant \delta$, par la même continuité uniforme. 
    $$\boxed{F \text{ est de classe } \mathcal{C}^{1}}\text{.}$$
- id: "l3-cd-02-10"
  feuille: "f-l3-cd-02"
  numero: 10
  partie: "Différentiabilité : premiers exemples"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [différentiabilité]
  noeuds: [gd-differentielle]
  notions: [differentiable, produit-scalaire]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    *(Différentiabilité d'une norme.)* Soit $N$ une norme quelconque sur un espace vectoriel réel $E$.

    **1.** Rappeler que, si $N$ est différentiable en $x$, alors $\mathrm{d} N(x)\cdot h = \displaystyle\lim_{t \to 0}\dfrac{1}{t}\big(N(x + th) - N(x)\big)$. En déduire que $N$ n'est pas différentiable en $0$.

    **2.** Montrer que, si $N$ est associée à un produit scalaire, alors $N$ est différentiable en tout point autre que $0$.

    **3.** On suppose $N$ différentiable en $a$. Montrer que, pour tout réel $\lambda \neq 0$, $N$ est différentiable en $\lambda a$ et 
    $$\mathrm{d} N(\lambda a) = \dfrac{\lambda}{|\lambda|}\,\mathrm{d} N(a).$$

    **4.** En dérivant $\lambda \mapsto N(\lambda a)$ en $\lambda = 1$, montrer que $\mathrm{d} N(a)\cdot a = N(a)$, puis que $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} N(a)|\mkern-1.5mu|\mkern-1.5mu| = 1$.
  corrige: |
    Le fil conducteur est l'homogénéité $N(\lambda x) = |\lambda|N(x)$, qu'on dérive de plusieurs façons.

    **1.** Si $N$ est différentiable en $x$, elle y est dérivable selon tout vecteur $h$, et (cours, prop. 4) 
    $$\mathrm{d} N(x)\cdot h = \lim_{t \to 0}\dfrac{N(x + th) - N(x)}{t}.$$
     En $x = 0$, ce quotient vaut $\dfrac{|t|}{t}N(h)$, qui n'a pas de limite quand $t \to 0$ si $h \neq 0$ : 
    $$\boxed{N \text{ n'est pas différentiable en } 0}\text{.}$$
     Le graphe d'une norme est un cône de sommet l'origine, qui n'a pas de plan tangent en ce sommet.

    **2.** $N(x) = \sqrt{\langle x, x \rangle}$ est la composée de $x \mapsto \langle x, x \rangle$, différentiable de différentielle $h \mapsto 2\langle x, h \rangle$ (exercice 1), et de la racine carrée, dérivable sur $]0, +\infty[$. Donc $N$ est différentiable sur $E \setminus \{0\}$, et 
    $$\boxed{\mathrm{d} N(x)\cdot h = \frac{\langle x, h \rangle}{N(x)}}\text{.}$$

    **3.** Pour $\lambda \neq 0$, $N(\lambda a + h) = |\lambda|\,N\big(a + \frac{h}{\lambda}\big)$. La différentiabilité de $N$ en $a$ donne 
    $$N(\lambda a + h) = |\lambda|N(a) + \frac{|\lambda|}{\lambda}\mathrm{d} N(a)\cdot h + o(\lVert h \rVert),$$
     donc $N$ est différentiable en $\lambda a$ et 
    $$\boxed{\mathrm{d} N(\lambda a) = \frac{\lambda}{|\lambda|}\,\mathrm{d} N(a)}\text{,}$$
     puisque $\dfrac{|\lambda|}{\lambda} = \dfrac{\lambda}{|\lambda|}$ vaut $\pm 1$.

    **4.** Pour $\lambda > 0$, $N(\lambda a) = \lambda N(a)$, dont la dérivée en $\lambda = 1$ vaut $N(a)$ ; par la règle de la chaîne, c'est aussi $\mathrm{d} N(a)\cdot a$. D'où $\boxed{\mathrm{d} N(a)\cdot a = N(a)}$. D'autre part, l'inégalité triangulaire donne $|N(a + th) - N(a)| \leqslant |t|N(h)$, donc $|\mathrm{d} N(a)\cdot h| \leqslant N(h)$ et $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} N(a)|\mkern-1.5mu|\mkern-1.5mu| \leqslant 1$. Comme $a \neq 0$ (question 1) et $\mathrm{d} N(a)\cdot\dfrac{a}{N(a)} = 1$, on a 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} N(a)|\mkern-1.5mu|\mkern-1.5mu| = 1}.$$
- id: "l3-cd-02-11"
  feuille: "f-l3-cd-02"
  numero: 11
  partie: "Différentiabilité : premiers exemples"
  etoiles: 2
  types: [Calcul]
  mots_cles: [différentiabilité]
  noeuds: [gd-differentielle]
  notions: [differentiable]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **1.** Déterminer les points où les applications suivantes, de $\mathbb{R}^{n}$ dans $\mathbb{R}$, sont différentiables : 
    $$N_{1}(x) = \lVert x \rVert_{1}, \qquad N_{2}(x) = \lVert x \rVert_{2}, \qquad N_{\infty}(x) = \lVert x \rVert_{\infty}.$$
     On commencera par le cas $n = 2$. Vérifier sur ces trois normes les résultats de l'exercice 10.

    **2.** Généraliser l'étude de $N_{\infty}$ à l'espace $c_{0}$ des suites réelles de limite nulle, muni de $\lVert x \rVert_{\infty} = \sup_{j}|x_{j}|$.
  corrige: |
    Le critère est le même pour les trois normes : on cherche une direction dans laquelle la fonction se comporte comme $t \mapsto |t|$.

    **1.** $\triangleright$ *$N_{2}$.* D'après l'exercice 10, $N_{2}$ est différentiable exactement sur $\mathbb{R}^{n} \setminus \{0\}$, avec 
    $$\boxed{\nabla N_{2}(x) = \frac{x}{\lVert x \rVert_{2}}}\text{.}$$

    $\triangleright$ *$N_{1}$.* Si $x_{i} = 0$ pour un indice $i$, alors $N_{1}(x + te_{i}) = N_{1}(x) + |t|$ n'est pas dérivable en $t = 0$, et $N_{1}$ n'est pas différentiable en $x$. Si tous les $x_{i}$ sont non nuls, alors, au voisinage de $x$, $N_{1}(y) = \sum_{i}\operatorname{sgn}(x_{i})y_{i}$ est linéaire. Donc 
    $$\boxed{N_{1} \text{ est différentiable ssi tous les } x_{i} \text{ sont non nuls}}\text{,}$$
     avec $\nabla N_{1}(x) = \big(\operatorname{sgn}(x_{1}), \dots, \operatorname{sgn}(x_{n})\big)$.

    $\triangleright$ *$N_{\infty}$.* Soit $x \neq 0$ et $m = \lVert x \rVert_{\infty}$. Si le maximum $m$ est atteint en un seul indice $i$, les autres $|x_{j}|$ sont inférieurs à un $m' < m$ et, pour $\lVert h \rVert_{\infty} < \frac{m - m'}{2}$, $N_{\infty}(x + h) = |x_{i} + h_{i}| = m + \operatorname{sgn}(x_{i})h_{i}$, expression affine en $h$. Si le maximum est atteint en deux indices $i \neq j$, alors $N_{\infty}\big(x + t\operatorname{sgn}(x_{i})e_{i}\big) = \max(m + t, m)$ pour $|t|$ petit, qui n'est pas dérivable en $0$. Donc 
    $$\boxed{N_{\infty} \text{ est différentiable en } x \text{ ssi } \max_{j}|x_{j}| \text{ est atteint en un seul indice } i}\text{,}$$
     avec $\nabla N_{\infty}(x) = \operatorname{sgn}(x_{i})e_{i}$.

    $\triangleright$ *Vérification de l'exercice 10.* Dans les trois cas, $\mathrm{d} N(x)\cdot x$ vaut $\sum\operatorname{sgn}(x_{i})x_{i} = N_{1}(x)$, $\operatorname{sgn}(x_{i})x_{i} = N_{\infty}(x)$ et $\dfrac{\langle x, x \rangle}{\lVert x \rVert_{2}} = N_{2}(x)$. La norme d'opérateur de la forme $h \mapsto \langle g, h \rangle$ pour $N_{1}$ est $\lVert g \rVert_{\infty}$, et pour $N_{\infty}$ elle est $\lVert g \rVert_{1}$ ; elle vaut $1$ dans les trois cas. Enfin, $\nabla N(\lambda x) = \operatorname{sgn}(\lambda)\nabla N(x)$ sur chacune des formules.

    ![Figure](documents/figures/7155cf554c56bdf4.svg)

    Pour $n = 2$, $N_{1}$ n'est pas différentiable sur les axes, où passent les sommets de sa boule, et $N_{\infty}$ sur les diagonales, où passent les coins de la sienne. Ailleurs, le gradient est constant dans chaque secteur et orthogonal au côté de la boule unité qu'il traverse.

    **2.** Sur $c_{0}$, soit $x \neq 0$ et $m = \lVert x \rVert_{\infty}$. Comme $x_{j} \to 0$, il n'y a qu'un nombre fini d'indices tels que $|x_{j}| \geqslant \frac{m}{2}$ : le maximum est atteint, et $m' = \sup\{|x_{j}| \,;\, |x_{j}| < m\} < m$. Le raisonnement de la question 1 s'applique mot pour mot : 
    $$\boxed{\lVert \cdot \rVert_{\infty} \text{ est différentiable en } x \neq 0 \text{ ssi } |x_{j}| = \lVert x \rVert_{\infty} \text{ pour un seul } j}\text{,}$$
     et alors $\mathrm{d} N(x)\cdot h = \operatorname{sgn}(x_{j})h_{j}$.
- id: "l3-cd-02-12"
  feuille: "f-l3-cd-02"
  numero: 12
  partie: "Différentiabilité : premiers exemples"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [différentiabilité]
  noeuds: [gd-differentielle]
  notions: [differentiable]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    On note $\ell^{1}$ l'espace des suites réelles $x = (x_{j})_{j \geqslant 1}$ telles que $\lVert x \rVert_{1} = \sum_{j = 1}^{+\infty}|x_{j}| < +\infty$.

    **1.** Montrer que, pour toute forme linéaire continue $L$ sur $\ell^{1}$, il existe une suite bornée $\alpha = (\alpha_{j})_{j \geqslant 1}$ telle que $L(x) = \sum_{j = 1}^{+\infty}\alpha_{j}x_{j}$ pour tout $x \in \ell^{1}$.

    **2.** Montrer, en raisonnant par l'absurde à l'aide de la première question, que la norme $\lVert \cdot \rVert_{1}$ n'est différentiable en aucun point de $\ell^{1}$.
  corrige: |
    On montre qu'une différentielle de $\lVert \cdot \rVert_{1}$ devrait être la suite des signes, puis qu'aucune forme linéaire ne convient, faute de coordonnées « loin de $0$ ».

    **1.** Soit $e_{j}$ la suite dont seul le terme d'indice $j$ vaut $1$, et $\alpha_{j} = L(e_{j})$. Alors $|\alpha_{j}| \leqslant |\mkern-1.5mu|\mkern-1.5mu|L|\mkern-1.5mu|\mkern-1.5mu|\,\lVert e_{j} \rVert_{1} = |\mkern-1.5mu|\mkern-1.5mu|L|\mkern-1.5mu|\mkern-1.5mu|$ : la suite $\alpha$ est bornée. Pour $x \in \ell^{1}$, $x^{(N)} = \sum_{j \leqslant N}x_{j}e_{j}$ vérifie $\lVert x - x^{(N)} \rVert_{1} = \sum_{j > N}|x_{j}| \to 0$, donc, par continuité et linéarité, 
    $$\boxed{L(x) = \lim_{N}\sum_{j \leqslant N}\alpha_{j}x_{j} = \sum_{j = 1}^{+\infty}\alpha_{j}x_{j}}.$$

    **2.** L'origine est exclue par l'exercice 10. Supposons $N = \lVert \cdot \rVert_{1}$ différentiable en $x \neq 0$, et notons $\alpha$ la suite associée à $L = \mathrm{d} N(x)$. La dérivée selon $e_{j}$ est la limite de $\dfrac{|x_{j} + t| - |x_{j}|}{t}$ quand $t \to 0$ ; elle n'existe pas si $x_{j} = 0$. Donc tous les $x_{j}$ sont non nuls, et $\alpha_{j} = \operatorname{sgn}(x_{j})$. Prenons alors $h^{(j)} = -2x_{j}e_{j}$, de norme $2|x_{j}| \to 0$. On a 
    $$N(x + h^{(j)}) - N(x) = |-x_{j}| - |x_{j}| = 0, \qquad L(h^{(j)}) = -2|x_{j}| = -\lVert h^{(j)} \rVert_{1},$$
     donc $\dfrac{|N(x + h^{(j)}) - N(x) - L(h^{(j)})|}{\lVert h^{(j)} \rVert_{1}} = 1$ ne tend pas vers $0$ : contradiction. 
    $$\boxed{\lVert \cdot \rVert_{1} \text{ n'est différentiable en aucun point de } \ell^{1}}\text{.}$$

    *Remarque.* En dimension finie, $N_{1}$ est différentiable « presque partout » (exercice 11). En dimension infinie, chaque point a des coordonnées arbitrairement petites, et le passage par $0$ d'une coordonnée, qui coûte peu en norme, détruit la différentiabilité partout.
- id: "l3-cd-02-13"
  feuille: "f-l3-cd-02"
  numero: 13
  partie: "Fonctions d'une variable réelle à valeurs vectorielles"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [variable réelle à valeurs vectorielles]
  noeuds: [gd-accroissements]
  notions: []
  page_enonce: 3
  page_corrige: 8
  enonce: |
    **1.** Soit $g : \mathbb{R} \to \mathbb{R}$, $g(x) = |x^{3}|$. Montrer que $g$ est différentiable sur $\mathbb{R}$ et calculer, pour $a \in \mathbb{R}$, sa différentielle $\mathrm{d} g(a)$ et sa dérivée $g'(a)$.

    **2.** Même question pour $g_{2} : \mathbb{R} \to \mathbb{R}^{3}$, $g_{2}(x) = \big(x^{3}, \sin(x^{2}), 3\big)$.

    **3.** On munit l'espace $\mathcal{M}_{2}(\mathbb{R})$ d'une norme d'opérateur et on définit $f : \mathbb{R} \to \mathcal{M}_{2}(\mathbb{R})$ par 
    $$f(x) = \begin{pmatrix} x & x^{2} \\ 2 & x^{3} \end{pmatrix}.$$
     Montrer que $f$ est différentiable et calculer sa différentielle.
  corrige: |
    Pour une variable réelle, différentiable équivaut à dérivable, avec $\mathrm{d} g(a)\cdot s = s\,g'(a)$ (cours, prop. 5), et une fonction à valeurs dans un espace de dimension finie se dérive coordonnée par coordonnée.

    **1.** $g(x) = x^{2}|x|$. Pour $x \neq 0$, $g$ est dérivable de dérivée $3x^{2}\operatorname{sgn}(x) = 3x|x|$ ; en $0$, $\dfrac{g(x)}{x} = x|x| \to 0$. Donc 
    $$\boxed{g'(a) = 3a|a|, \quad \mathrm{d} g(a)\cdot s = 3a|a|\,s}\text{.}$$

    **2.** Chaque coordonnée est dérivable : 
    $$\boxed{g_{2}'(a) = \big(3a^{2}, 2a\cos(a^{2}), 0\big)}\text{,}$$
     et $\mathrm{d} g_{2}(a)\cdot s = s\,g_{2}'(a)$.

    **3.** Les quatre coefficients sont dérivables, et les normes sur $\mathcal{M}_{2}(\mathbb{R})$ sont équivalentes : $f$ est dérivable et 
    $$\boxed{f'(x) = \begin{pmatrix} 1 & 2x \\ 0 & 3x^{2} \end{pmatrix}, \qquad \mathrm{d} f(x)\cdot s = s\,f'(x)}.$$
     *Piège.* Le choix de la norme d'opérateur ne joue aucun rôle ici, seule compte la dimension finie.
- id: "l3-cd-02-14"
  feuille: "f-l3-cd-02"
  numero: 14
  partie: "Fonctions d'une variable réelle à valeurs vectorielles"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [variable réelle à valeurs vectorielles]
  noeuds: [gd-accroissements]
  notions: [fonction-convexe]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    **1.** Soit $f : \,]a, b[ \to \mathbb{R}$ dérivable, telle que $f'(x)$ admette une limite $\ell$ quand $x \to b^{-}$. Montrer que $f$ se prolonge en une fonction continue sur $]a, b]$, dérivable à gauche en $b$, de dérivée à gauche $\ell$.

    **2.** Soit $f$ dérivable sur un intervalle $I$, de dérivée croissante. Montrer que $f$ est convexe sur $I$, c'est-à-dire que $f\big((1 - t)x + ty\big) \leqslant (1 - t)f(x) + tf(y)$ pour tous $x < y$ de $I$ et $t \in [0, 1]$. On pourra poser $z = (1 - t)x + ty$ et appliquer les accroissements finis sur $[x, z]$ puis sur $[z, y]$.
  corrige: |
    Les deux questions reposent sur l'égalité des accroissements finis, valable ici car $f$ est à valeurs réelles.

    **1.** Comme $f'$ a une limite en $b^{-}$, elle est bornée par un $M$ sur un intervalle $[c, b[$. Pour $x$, $y \in [c, b[$, $|f(x) - f(y)| \leqslant M|x - y|$ : le critère de Cauchy en $b$ est satisfait, et $f(x)$ a une limite $L$ quand $x \to b^{-}$. On pose $f(b) = L$. Pour $x \in [c, b[$, l'égalité des accroissements finis sur $[x, b]$, légitime puisque $f$ prolongée est continue sur $[x, b]$, donne $c_{x} \in \,]x, b[$ tel que 
    $$\frac{f(b) - f(x)}{b - x} = f'(c_{x}) \xrightarrow[x \to b^{-}]{} \ell,$$
     puisque $c_{x} \to b$. Donc 
    $$\boxed{f \text{ est dérivable à gauche en } b, \text{ de dérivée } \ell}\text{.}$$

    **2.** Soit $x < y$, $t \in \,]0, 1[$ et $z = (1 - t)x + ty$, de sorte que $z - x = t(y - x)$ et $y - z = (1 - t)(y - x)$. Il existe $c_{1} \in \,]x, z[$ et $c_{2} \in \,]z, y[$ tels que 
    $$\frac{f(z) - f(x)}{z - x} = f'(c_{1}) \leqslant f'(c_{2}) = \frac{f(y) - f(z)}{y - z},$$
     car $c_{1} < c_{2}$ et $f'$ est croissante. En multipliant par $t(1 - t)(y - x) > 0$, il vient $(1 - t)\big(f(z) - f(x)\big) \leqslant t\big(f(y) - f(z)\big)$, c'est-à-dire 
    $$\boxed{f(z) \leqslant (1 - t)f(x) + tf(y)}\text{.}$$

    ![Figure](documents/figures/48c31ecc0ae9b297.svg)

    La pente de la corde sur $[x, z]$ est inférieure à celle sur $[z, y]$ ; c'est exactement dire que le point du graphe d'abscisse $z$ est sous la corde reliant les points d'abscisses $x$ et $y$.
- id: "l3-cd-02-15"
  feuille: "f-l3-cd-02"
  numero: 15
  partie: "Fonctions d'une variable réelle à valeurs vectorielles"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [variable réelle à valeurs vectorielles]
  noeuds: [gd-accroissements]
  notions: []
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Soit $f : \,]a, b[ \to \mathbb{R}^{n}$ dérivable. On suppose qu'il existe $k > 0$ tel que $\lVert f'(x) \rVert \leqslant k\lVert f(x) \rVert$ pour tout $x \in \,]a, b[$. Montrer que, si $f$ s'annule en un point $x_{0}$ de $]a, b[$, alors $f$ est identiquement nulle. On pourra montrer que $\{x \in \,]a, b[ \,;\, f(x) = 0\}$ est ouvert.
  corrige: |
    On applique l'indication : l'ensemble $Z = \{x \in \,]a, b[ \,;\, f(x) = 0\}$ est fermé dans $]a, b[$ par continuité de $f$, et non vide. On montre qu'il est ouvert ; la connexité de $]a, b[$ donnera $Z = \,]a, b[$.

    Soit $x_{1} \in Z$ et $\delta > 0$ tel que $J = [x_{1} - \delta, x_{1} + \delta] \subset \,]a, b[$ et $k\delta < 1$. La fonction continue $\lVert f \rVert$ atteint sur le segment $J$ son maximum $M$ en un point $s$. Par l'inégalité des accroissements finis (cours, th. 1) entre $x_{1}$ et $s$, 
    $$M = \lVert f(s) - f(x_{1}) \rVert \leqslant |s - x_{1}|\sup_{J}\lVert f' \rVert \leqslant \delta\,k\,M.$$
     Comme $k\delta < 1$, $M = 0$ : $f$ est nulle sur $J$, et $Z$ est ouvert. Donc 
    $$\boxed{f \equiv 0 \text{ sur } ]a, b[}.$$

    *Remarque.* C'est l'unicité pour l'équation différentielle linéaire $y' = A(t)y$ avec $y(x_{0}) = 0$ : l'hypothèse $\lVert f' \rVert \leqslant k\lVert f \rVert$ est ce qu'on obtient lorsque $|\mkern-1.5mu|\mkern-1.5mu|A(t)|\mkern-1.5mu|\mkern-1.5mu| \leqslant k$. Le chapitre 6 du cours démontre l'unicité en général par le lemme de Gronwall.
- id: "l3-cd-02-16"
  feuille: "f-l3-cd-02"
  numero: 16
  partie: "Fonctions d'une variable réelle à valeurs vectorielles"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [variable réelle à valeurs vectorielles]
  noeuds: [gd-accroissements]
  notions: [produit-scalaire]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Soit $E$ un espace de Banach et $\mathcal{L}(E)$ l'espace des endomorphismes continus de $E$, muni de la norme d'opérateur. Pour $A \in \mathcal{L}(E)$ et $t \in \mathbb{R}$, on pose $e^{tA} = \displaystyle\sum_{k = 0}^{+\infty}\dfrac{t^{k}}{k!}A^{k}$ (série absolument convergente dans $\mathcal{L}(E)$).

    **1.** Montrer que $\varphi : t \mapsto e^{tA}$ est dérivable sur $\mathbb{R}$ et calculer sa dérivée.

    **2.** On suppose la norme de $E$ associée à un produit scalaire $\langle \cdot, \cdot \rangle$. Soit $x \in E$. Montrer que $\Phi : t \mapsto \langle e^{tA}x, e^{tA}x \rangle$ est dérivable et calculer sa dérivée.

    **3.** On suppose $A$ antisymétrique : $\langle Ax, y \rangle = -\langle x, Ay \rangle$ pour tous $x$, $y$. Montrer que, pour tout $t$, $e^{tA}$ conserve la norme.
  corrige: |
    On dérive la série terme à terme, en contrôlant le reste à la main.

    **1.** Les séries $\sum\frac{t^{k}}{k!}A^{k}$ et $\sum\frac{s^{k}}{k!}A^{k}$ convergent absolument, et $tA$, $sA$ commutent : le produit de Cauchy donne $e^{(t + s)A} = e^{tA}e^{sA}$. Alors 
    $$\frac{\varphi(t + s) - \varphi(t)}{s} - Ae^{tA} = e^{tA}\Big(\frac{e^{sA} - \mathrm{Id}}{s} - A\Big), \qquad \Bigg\| \frac{e^{sA} - \mathrm{Id}}{s} - A \Bigg\| \leqslant \sum_{k \geqslant 2}\frac{|s|^{k - 1}|\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|^{k}}{k!} \xrightarrow[s \to 0]{} 0.$$
     Donc 
    $$\boxed{\varphi'(t) = Ae^{tA} = e^{tA}A}.$$

    **2.** $\Phi(t) = \langle \varphi(t)x, \varphi(t)x \rangle$, image de $\big(\varphi(t)x, \varphi(t)x\big)$ par le produit scalaire, bilinéaire continu. La formule de Leibniz (cours, prop. 12) donne 
    $$\boxed{\Phi'(t) = 2\langle Ae^{tA}x, e^{tA}x \rangle}.$$

    **3.** Si $A$ est antisymétrique, $\langle Ay, y \rangle = -\langle y, Ay \rangle$, donc $\langle Ay, y \rangle = 0$ pour tout $y$. Avec $y = e^{tA}x$, $\Phi' = 0$ : $\Phi$ est constante, et $\lVert e^{tA}x \rVert = \lVert x \rVert$. 
    $$\boxed{e^{tA} \text{ conserve la norme}}\text{ ;}$$
     en dimension finie, c'est une matrice orthogonale.

    *Remarque.* Pour $A = \begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}$, $e^{tA}$ est la rotation d'angle $t$ : la trajectoire de $x$ reste sur un cercle, et $\Phi' = 0$ traduit que la vitesse $Ae^{tA}x$ est orthogonale au rayon.
- id: "l3-cd-02-17"
  feuille: "f-l3-cd-02"
  numero: 17
  partie: "Dérivées partielles, matrice jacobienne, gradient"
  etoiles: 1
  types: [Calcul]
  mots_cles: [dérivées partielles et jacobienne]
  noeuds: [gd-differentielle]
  notions: [derivee-partielle, matrice-jacobienne]
  page_enonce: 4
  page_corrige: 10
  enonce: |
    On munit $\mathbb{R}^{3}$ de la norme euclidienne et on définit $f : \mathbb{R}^{3} \to \mathbb{R}^{2}$ par $f(x_{1}, x_{2}, x_{3}) = \big(x_{1}^{3} + \cos(x_{1}x_{2}), x_{2} - x_{3}\big)$. Calculer la dérivée de $f$ en $(1, \pi, 3)$ selon le vecteur $(0, 1, 1)$. Déterminer ensuite la différentielle de $f$ en tout point $(x, y, z)$ et retrouver le résultat précédent.
  corrige: |
    On calcule d'abord la dérivée directionnelle par la définition, puis la jacobienne.

    $\triangleright$ *Par la définition.* Avec $a = (1, \pi, 3)$ et $v = (0, 1, 1)$, $f(a + tv) = \big(1 + \cos(\pi + t), \pi - 3\big) = \big(1 - \cos t, \pi - 3\big)$, d'où 
    $$D_{v} f(a) = \lim_{t \to 0}\frac{1}{t}\big(1 - \cos t, 0\big) = \boxed{(0, 0)}.$$

    $\triangleright$ *Par la différentielle.* Les coordonnées de $f$ sont de classe $\mathcal{C}^{1}$, donc $f$ est différentiable (cours, th. 5), de matrice jacobienne 
    $$J_{f}(x, y, z) = \begin{pmatrix} 3x^{2} - y\sin(xy) & -x\sin(xy) & 0 \\ 0 & 1 & -1 \end{pmatrix}, \qquad J_{f}(1, \pi, 3) = \begin{pmatrix} 3 & 0 & 0 \\ 0 & 1 & -1 \end{pmatrix},$$
     et $J_{f}(1, \pi, 3)\begin{pmatrix} 0 \\ 1 \\ 1 \end{pmatrix} = \begin{pmatrix} 0 \\ 0 \end{pmatrix}$ : on retrouve $D_{v} f(a) = \mathrm{d} f(a)\cdot v = (0, 0)$ (cours, prop. 4). La première coordonnée est nulle parce que $\sin(\pi) = 0$, la seconde parce que $v$ est dans le noyau de $(y, z) \mapsto y - z$.
- id: "l3-cd-02-18"
  feuille: "f-l3-cd-02"
  numero: 18
  partie: "Dérivées partielles, matrice jacobienne, gradient"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [dérivées partielles et jacobienne]
  noeuds: [gd-differentielle]
  notions: [derivee-partielle, matrice-jacobienne]
  page_enonce: 4
  page_corrige: 10
  enonce: |
    Soit $f : \mathbb{R}^{2} \to \mathbb{R}$ définie par $f(x, y) = \dfrac{xy}{x^{2} + y^{2}}$ si $(x, y) \neq (0, 0)$ et $f(0, 0) = 0$.

    **1.** Soit $(a_{1}, a_{2}) \neq (0, 0)$ et $(b_{1}, b_{2}) \in \mathbb{R}^{2}$. Montrer que $f$ est dérivable en $(a_{1}, a_{2})$ selon le vecteur $(b_{1}, b_{2})$ et calculer cette dérivée.

    **2.** Montrer que les dérivées partielles de $f$ existent en tout point. Calculer, si elles existent, les dérivées de $f$ en $(0, 0)$ selon les vecteurs $(1, 0)$, $(0, 1)$ et $(1, 1)$. En quels points $f$ est-elle différentiable ?
  corrige: |
    En coordonnées polaires, $f(r\cos\theta, r\sin\theta) = \dfrac{1}{2}\sin 2\theta$ : $f$ est constante sur chaque demi-droite issue de l'origine, ce qui explique tout.

    **1.** Sur l'ouvert $\mathbb{R}^{2} \setminus \{0\}$, $f$ est une fraction rationnelle dont le dénominateur ne s'annule pas : elle y est de classe $\mathcal{C}^{1}$, donc différentiable, et 
    $$\dfrac{\partial f}{\partial x} = \frac{y(y^{2} - x^{2})}{(x^{2} + y^{2})^{2}}, \qquad \dfrac{\partial f}{\partial y} = \frac{x(x^{2} - y^{2})}{(x^{2} + y^{2})^{2}}, \qquad \boxed{D_{(b_{1}, b_{2})} f(a_{1}, a_{2}) = \frac{(a_{2}^{2} - a_{1}^{2})(a_{2}b_{1} - a_{1}b_{2})}{(a_{1}^{2} + a_{2}^{2})^{2}}}.$$

    **2.** En $0$, $f(t, 0) = f(0, t) = 0$, donc 
    $$\boxed{D_{(1, 0)} f(0) = D_{(0, 1)} f(0) = 0}\text{.}$$
     En revanche $\dfrac{f(t, t) - f(0)}{t} = \dfrac{1}{2t}$ n'a pas de limite : 
    $$\boxed{D_{(1, 1)} f(0) \text{ n'existe pas}}\text{.}$$
     La fonction n'est même pas continue en $0$, puisqu'elle vaut $\frac{1}{2}$ sur la diagonale. Donc 
    $$\boxed{f \text{ est différentiable exactement sur } \mathbb{R}^{2} \setminus \{0\}}\text{.}$$

    ![Figure](documents/figures/07b004d4ee9ecb06.svg)

    Les lignes de niveau de $f$ sont des demi-droites issues de l'origine. Toutes les valeurs de $[-\frac{1}{2}, \frac{1}{2}]$ sont prises dans tout voisinage de $0$, d'où la discontinuité, bien que $f$ soit nulle sur les deux axes.
- id: "l3-cd-02-19"
  feuille: "f-l3-cd-02"
  numero: 19
  partie: "Dérivées partielles, matrice jacobienne, gradient"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [dérivées partielles et jacobienne]
  noeuds: [gd-differentielle]
  notions: [derivee-partielle, matrice-jacobienne]
  page_enonce: 4
  page_corrige: 11
  enonce: |
    Soit $f : \mathbb{R}^{2} \to \mathbb{R}$ définie par $f(x, y) = \dfrac{xy^{2}}{x^{2} + y^{2}}$ si $(x, y) \neq (0, 0)$ et $f(0, 0) = 0$.

    **1.** Montrer que $f$ est continue sur $\mathbb{R}^{2}$.

    **2.** Montrer que $f$ admet en tout point une dérivée selon tout vecteur, et la calculer. Les dérivées partielles de $f$ sont-elles continues ?

    **3.** La fonction $f$ est-elle différentiable en $(0, 0)$ ? Quelles implications du cours (continuité, dérivées selon tout vecteur, différentiabilité) cet exemple montre-t-il irréversibles ?
  corrige: |
    Ici, $f$ est homogène de degré $1$ : $f(tu) = tf(u)$. Cela rend la continuité facile et la différentiabilité impossible.

    **1.** Hors de $0$, $f$ est rationnelle, donc continue. En $0$, $|f(x, y)| \leqslant \dfrac{|x|(x^{2} + y^{2})}{x^{2} + y^{2}} = |x|$, donc $f(x, y) \to 0$ : 
    $$\boxed{f \text{ est continue sur } \mathbb{R}^{2}}\text{.}$$

    **2.** Hors de $0$, $f$ est de classe $\mathcal{C}^{1}$, de dérivées partielles 
    $$\dfrac{\partial f}{\partial x} = \frac{y^{2}(y^{2} - x^{2})}{(x^{2} + y^{2})^{2}}, \qquad \dfrac{\partial f}{\partial y} = \frac{2x^{3}y}{(x^{2} + y^{2})^{2}},$$
     et $D_{b} f(a) = b_{1}\dfrac{\partial f}{\partial x}(a) + b_{2}\dfrac{\partial f}{\partial y}(a)$. En $0$, pour $u = (u_{1}, u_{2})$, $\dfrac{f(tu)}{t} = f(u)$, donc 
    $$\boxed{D_{u} f(0) = f(u) = \frac{u_{1}u_{2}^{2}}{u_{1}^{2} + u_{2}^{2}}}\text{ ;}$$
     en particulier $\dfrac{\partial f}{\partial x}(0) = \dfrac{\partial f}{\partial y}(0) = 0$. Les dérivées partielles ne sont pas continues en $0$ : $\dfrac{\partial f}{\partial x}(0, y) = 1$ pour $y \neq 0$.

    **3.** Si $f$ était différentiable en $0$, on aurait $D_{u} f(0) = \mathrm{d} f(0)\cdot u = 0$ pour tout $u$, puisque les dérivées partielles sont nulles. Or $D_{(1, 1)} f(0) = \frac{1}{2}$. Donc 
    $$\boxed{f \text{ n'est pas différentiable en } 0}\text{.}$$
     L'exemple montre que *la continuité, même jointe à l'existence des dérivées selon tous les vecteurs, n'entraîne pas la différentiabilité*.

    ![Figure](documents/figures/f0bef63a3076f2dc.svg)

    En traçant $D_{u} f(0)$ pour $u = (\cos\theta, \sin\theta)$, on voit que la courbe n'est pas de la forme $a\cos\theta + b\sin\theta$ : seule une telle sinusoïde pourrait provenir d'une différentielle, et elle serait ici identiquement nulle.
- id: "l3-cd-02-20"
  feuille: "f-l3-cd-02"
  numero: 20
  partie: "Dérivées partielles, matrice jacobienne, gradient"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [dérivées partielles et jacobienne]
  noeuds: [gd-differentielle]
  notions: [derivee-partielle, matrice-jacobienne]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    **1.** Soit $f : E \to F$ différentiable en $a$. Montrer que, pour tout vecteur $u \neq 0$ de $E$, la dérivée $D_{u} f(a) = \displaystyle\lim_{h \to 0}\dfrac{1}{h}\big(f(a + hu) - f(a)\big)$ existe, et l'exprimer à l'aide de $\mathrm{d} f(a)$.

    **2.** Soit $f : \mathbb{R}^{2} \to \mathbb{R}$ définie par $f(0, 0) = 0$ et $f(x, y) = \dfrac{x^{3}y}{x^{4} + y^{2}}$ si $(x, y) \neq (0, 0)$. Montrer que $f$ est dérivable en $(0, 0)$ selon tout vecteur, mais n'y est pas différentiable.
  corrige: |
    Le cas précédent était homogène ; ici, le défaut de différentiabilité se cache le long d'une parabole.

    **1.** C'est la proposition 4 du cours : 
    $$\dfrac{f(a + hu) - f(a)}{h} = \mathrm{d} f(a)\cdot u + \dfrac{o(|h|\,\lVert u \rVert)}{h},$$
     donc 
    $$\boxed{D_{u} f(a) = \mathrm{d} f(a)\cdot u}.$$

    **2.** Pour $u = (u_{1}, u_{2})$ et $t \neq 0$, $\dfrac{f(tu)}{t} = \dfrac{t\,u_{1}^{3}u_{2}}{t^{2}u_{1}^{4} + u_{2}^{2}}$, qui tend vers $0$ (si $u_{2} \neq 0$, le dénominateur tend vers $u_{2}^{2}$ ; sinon l'expression est nulle). Donc 
    $$\boxed{D_{u} f(0) = 0 \text{ pour tout } u}\text{.}$$
     Si $f$ était différentiable en $0$, sa différentielle serait nulle et $f(x, y) = o\big(\lVert (x, y) \rVert\big)$. Or, sur la parabole $y = x^{2}$, 
    $$f(x, x^{2}) = \frac{x^{5}}{2x^{4}} = \frac{x}{2}, \qquad \lVert (x, x^{2}) \rVert_{2} \sim |x|,$$
     donc $\dfrac{f(x, x^{2})}{\lVert (x, x^{2}) \rVert}$ tend vers $\pm\frac{1}{2}$ : 
    $$\boxed{f \text{ n'est pas différentiable en } 0}\text{.}$$

    *Piège.* Les dérivées directionnelles n'explorent l'origine que le long des droites. Une parabole tangente à l'axe des abscisses traverse toutes les droites et peut révéler un comportement que chacune d'elles ignore.
- id: "l3-cd-02-21"
  feuille: "f-l3-cd-02"
  numero: 21
  partie: "Dérivées partielles, matrice jacobienne, gradient"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [dérivées partielles et jacobienne]
  noeuds: [gd-differentielle]
  notions: [derivee-partielle, matrice-jacobienne]
  page_enonce: 5
  page_corrige: 12
  enonce: |
    Soit $p$, $q$ des entiers naturels non nuls et $f : \mathbb{R}^{2} \to \mathbb{R}$ définie par $f(x, y) = \dfrac{x^{p}y^{q}}{x^{2} + y^{2}}$ si $(x, y) \neq (0, 0)$ et $f(0, 0) = 0$.

    **1.** Montrer que $f$ est continue sur $\mathbb{R}^{2}$ si et seulement si $p + q > 2$.

    **2.** Montrer que $f$ est différentiable sur $\mathbb{R}^{2}$ si et seulement si $p + q > 3$, et donner sa différentielle.

    **3.** Dans le cas $p = q = 2$, calculer les dérivées partielles de $f$ et étudier leur continuité.
  corrige: |
    En coordonnées polaires, $f = r^{p + q - 2}\cos^{p}\theta\sin^{q}\theta$ : l'exposant $p + q - 2$ décide de tout.

    **1.** Si $p + q > 2$, $|x^{p}y^{q}| \leqslant r^{p + q}$ donne $|f| \leqslant r^{p + q - 2} \to 0$ : $f$ est continue en $0$, et ailleurs car rationnelle. Si $p + q = 2$, c'est-à-dire $p = q = 1$, $f(t, t) = \frac{1}{2}$ ne tend pas vers $f(0) = 0$. 
    $$\boxed{f \text{ continue} \iff p + q > 2}\text{.}$$

    **2.** Hors de $0$, $f$ est de classe $\mathcal{C}^{1}$. En $0$, $f$ est nulle sur les axes, donc ses dérivées partielles y sont nulles, et $f$ est différentiable en $0$ si et seulement si $f = o(r)$.

    • Si $p + q > 3$, $|f| \leqslant r^{p + q - 2} = o(r)$ : $f$ est différentiable en $0$, avec $\mathrm{d} f(0) = 0$.

    • Si $p + q = 3$, $\dfrac{f(t, t)}{t} = \dfrac{t^{3}}{2t^{3}} = \frac{1}{2}$, alors que $\mathrm{d} f(0)\cdot(1, 1)$ devrait être nul : $f$ n'est pas différentiable en $0$.

    • Si $p + q \leqslant 2$, $f$ n'est pas continue en $0$.

    D'où 
    $$\boxed{f \text{ différentiable sur } \mathbb{R}^{2} \iff p + q > 3}\text{,}$$
     avec, hors de l'origine, 
    $$\dfrac{\partial f}{\partial x} = \frac{x^{p - 1}y^{q}\big((p - 2)x^{2} + py^{2}\big)}{(x^{2} + y^{2})^{2}}, \qquad \dfrac{\partial f}{\partial y} = \frac{x^{p}y^{q - 1}\big(qx^{2} + (q - 2)y^{2}\big)}{(x^{2} + y^{2})^{2}}.$$

    **3.** Pour $p = q = 2$, $\dfrac{\partial f}{\partial x} = \dfrac{2xy^{4}}{(x^{2} + y^{2})^{2}}$ et $\dfrac{\partial f}{\partial y} = \dfrac{2x^{4}y}{(x^{2} + y^{2})^{2}}$, nulles en $0$. Comme $|2xy^{4}| \leqslant 2r^{5}$, on a $\Big|\dfrac{\partial f}{\partial x}\Big| \leqslant 2r \to 0$, et de même pour $\dfrac{\partial f}{\partial y}$ : 
    $$\boxed{\text{les dérivées partielles sont continues, } f \text{ est de classe } \mathcal{C}^{1}}\text{.}$$

    ![Figure](documents/figures/84dc443f1ac4b5b2.svg)

    Les couples $(p, q)$ se répartissent selon la valeur de $p + q$ : un seul couple donne une fonction discontinue, deux donnent une fonction continue non différentiable, et tous les autres une fonction différentiable.
- id: "l3-cd-02-22"
  feuille: "f-l3-cd-02"
  numero: 22
  partie: "Dérivées partielles, matrice jacobienne, gradient"
  etoiles: 2
  types: [Calcul]
  mots_cles: [dérivées partielles et jacobienne]
  noeuds: [gd-differentielle]
  notions: [derivee-partielle, matrice-jacobienne]
  page_enonce: 5
  page_corrige: 13
  enonce: |
    Soit $\alpha > 0$. Étudier la différentiabilité à l'origine de l'application $f : \mathbb{R}^{2} \to \mathbb{R}$ définie par $f(0, 0) = 0$ et 
    $$f(x, y) = \dfrac{|xy|^{\alpha}}{\sqrt{x^{2} + 3y^{2}}} \qquad \text{si } (x, y) \neq (0, 0).$$
  corrige: |
    On se ramène, comme à l'exercice 21, à un exposant d'homogénéité : $f(tx, ty) = |t|^{2\alpha - 1}f(x, y)$.

    Sur les axes, $f = 0$, donc les dérivées partielles en $0$ sont nulles, et $f$ est différentiable en $0$ si et seulement si $f(x, y) = o(r)$, avec $r = \lVert (x, y) \rVert_{2}$.

    • Si $\alpha > 1$ : $|xy| \leqslant \frac{r^{2}}{2}$ et $\sqrt{x^{2} + 3y^{2}} \geqslant r$, donc $|f| \leqslant \dfrac{r^{2\alpha - 1}}{2^{\alpha}} = o(r)$ : $f$ est différentiable en $0$, de différentielle nulle.

    • Si $\alpha \leqslant 1$ : $\dfrac{f(t, t)}{|t|} = \dfrac{|t|^{2\alpha - 2}}{2}$ ne tend pas vers $0$ : $f$ n'est pas différentiable en $0$.

    $$\boxed{f \text{ est différentiable en } 0 \iff \alpha > 1}\text{.}$$
     On montre de même que $f$ est continue en $0$ si et seulement si $\alpha > \frac{1}{2}$.

    ![Figure](documents/figures/9f60596416792ccb.svg)

    Le seuil $\alpha = \frac{1}{2}$ correspond au degré d'homogénéité $0$, et le seuil $\alpha = 1$ au degré $1$ : pour être différentiable avec une différentielle nulle, il faut que $f$ décroisse plus vite que $r$.
- id: "l3-cd-02-23"
  feuille: "f-l3-cd-02"
  numero: 23
  partie: "Dérivées partielles, matrice jacobienne, gradient"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [dérivées partielles et jacobienne]
  noeuds: [gd-differentielle]
  notions: [derivee-partielle, matrice-jacobienne]
  page_enonce: 5
  page_corrige: 13
  enonce: |
    Soit $f : \mathbb{R}^{2} \to \mathbb{R}$ définie par $f(x, y) = x^{2}\sin\dfrac{y}{x}$ si $x \neq 0$ et $f(0, y) = 0$. Montrer que $f$ est différentiable sur $\mathbb{R}^{2}$. Déterminer les points où les dérivées partielles $\dfrac{\partial f}{\partial x}$ et $\dfrac{\partial f}{\partial y}$ sont continues.
  corrige: |
    Le point délicat est l'axe $x = 0$ : $f$ y est différentiable, mais $\dfrac{\partial f}{\partial x}$ y oscille.

    $\triangleright$ *Différentiabilité.* Sur $\{x \neq 0\}$, $f$ est de classe $\mathcal{C}^{1}$. En un point $(0, y_{0})$, $|f(x, y)| \leqslant x^{2} \leqslant \lVert (x, y - y_{0}) \rVert^{2} = o\big(\lVert (x, y - y_{0}) \rVert\big)$, et $f(0, y_{0}) = 0$ : 
    $$\boxed{f \text{ est différentiable sur } \mathbb{R}^{2}}\text{,}$$
     avec $\mathrm{d} f(0, y_{0}) = 0$.

    $\triangleright$ *Dérivées partielles.* Pour $x \neq 0$, 
    $$\dfrac{\partial f}{\partial x}(x, y) = 2x\sin\frac{y}{x} - y\cos\frac{y}{x}, \qquad \dfrac{\partial f}{\partial y}(x, y) = x\cos\frac{y}{x},$$
     et les deux sont nulles sur l'axe $x = 0$. On a $\Big|\dfrac{\partial f}{\partial y}\Big| \leqslant |x|$, donc 
    $$\boxed{\dfrac{\partial f}{\partial y} \text{ est continue sur } \mathbb{R}^{2}}\text{.}$$
     En $(0, 0)$, $\Big|\dfrac{\partial f}{\partial x}\Big| \leqslant 2|x| + |y| \to 0$ : $\dfrac{\partial f}{\partial x}$ y est continue. En $(0, y_{0})$ avec $y_{0} \neq 0$, le long de $y = y_{0}$, le terme $-y_{0}\cos\frac{y_{0}}{x}$ prend les valeurs $\pm y_{0}$ pour des $x$ arbitrairement petits : $\dfrac{\partial f}{\partial x}$ n'y est pas continue. 
    $$\boxed{\dfrac{\partial f}{\partial x} \text{ est continue exactement sur } \mathbb{R}^{2} \setminus \{(0, y) \,;\, y \neq 0\}}\text{.}$$

    *Remarque.* La fonction est différentiable partout sans être de classe $\mathcal{C}^{1}$ : la continuité des dérivées partielles est une condition suffisante de différentiabilité (cours, th. 5), pas nécessaire.
- id: "l3-cd-02-24"
  feuille: "f-l3-cd-02"
  numero: 24
  partie: "Dérivées partielles, matrice jacobienne, gradient"
  etoiles: 2
  types: [Calcul]
  mots_cles: [dérivées partielles et jacobienne]
  noeuds: [gd-differentielle]
  notions: [derivee-partielle, matrice-jacobienne]
  page_enonce: 5
  page_corrige: 14
  enonce: |
    Trouver les points de $\mathbb{R}^{2}$ où est différentiable la fonction $f : \mathbb{R}^{2} \to \mathbb{R}$ définie par $f(0, 0) = 0$ et 
    $$f(x, y) = \dfrac{x^{2}(x^{2} + y^{2})^{5/2}}{x^{4} + (x^{2} + y^{2})^{4}} \qquad \text{si } (x, y) \neq (0, 0).$$
  corrige: |
    Hors de l'origine, $f$ est une fraction rationnelle en $x$, $y$ et $r = \sqrt{x^{2} + y^{2}}$, de dénominateur non nul : elle y est de classe $\mathcal{C}^{1}$. Tout se joue en $0$.

    $\triangleright$ *Continuité en $0$.* L'inégalité $x^{4} + r^{8} \geqslant 2x^{2}r^{4}$ donne $0 \leqslant f \leqslant \dfrac{x^{2}r^{5}}{2x^{2}r^{4}} = \dfrac{r}{2}$.

    $\triangleright$ *Dérivées selon les droites.* Pour $u = (\cos\theta, \sin\theta)$ et $\cos\theta \neq 0$, $\dfrac{f(tu)}{t} = \dfrac{t^{2}\cos^{2}\theta}{\cos^{4}\theta + t^{4}}\cdot\operatorname{sgn}(t) \to 0$ ; si $\cos\theta = 0$, $f(tu) = 0$. Toutes les dérivées directionnelles en $0$ sont nulles.

    $\triangleright$ *Non-différentiabilité.* Si $f$ était différentiable en $0$, on aurait $f = o(r)$. Or, pour $y = s$ et $x = s^{2}$, on a $r^{2} = s^{2}(1 + s^{2})$ et 
    $$\frac{f(s^{2}, s)}{r} = \frac{s^{4}r^{4}}{s^{8} + r^{8}} = \frac{(1 + s^{2})^{2}}{1 + (1 + s^{2})^{4}} \xrightarrow[s \to 0]{} \frac{1}{2}.$$

    $$\boxed{f \text{ est différentiable exactement sur } \mathbb{R}^{2} \setminus \{0\}}\text{.}$$

    ![Figure](documents/figures/9be0255c1e28a45b.svg)

    La figure trace $\theta \mapsto \dfrac{f(\rho\cos\theta, \rho\sin\theta)}{\rho} = \dfrac{\rho^{2}\cos^{2}\theta}{\cos^{4}\theta + \rho^{4}}$ sur $[0, \pi]$. Quand $\rho \to 0$, cette fonction tend vers $0$ pour chaque $\theta$, ce qui traduit la nullité des dérivées directionnelles ; mais elle garde deux pics de hauteur $\frac{1}{2}$, de plus en plus étroits, en $\cos\theta = \pm\rho$. La convergence vers $0$ n'est pas uniforme en $\theta$, et c'est exactement ce qui empêche $f$ d'être un $o(r)$.
- id: "l3-cd-02-25"
  feuille: "f-l3-cd-02"
  numero: 25
  partie: "Dérivées partielles, matrice jacobienne, gradient"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [dérivées partielles et jacobienne]
  noeuds: [gd-differentielle]
  notions: [derivee-partielle, matrice-jacobienne]
  page_enonce: 5
  page_corrige: 14
  enonce: |
    **1.** Soit $f : U \subset E_{1} \times E_{2} \to F$ différentiable en $(x_{0}, y_{0}) \in U$. Montrer que $f_{1} : x \mapsto f(x, y_{0})$ et $f_{2} : y \mapsto f(x_{0}, y)$ sont différentiables en $x_{0}$ et $y_{0}$ respectivement, calculer leurs différentielles, et montrer que 
    $$\mathrm{d} f(x_{0}, y_{0})\cdot(h_{1}, h_{2}) = \mathrm{d} f_{1}(x_{0})\cdot h_{1} + \mathrm{d} f_{2}(y_{0})\cdot h_{2}.$$

    **2.** Soit $f : \Omega \subset \mathbb{R}^{n} \to \mathbb{R}^{p}$ différentiable en $x$. Exprimer la matrice de $\mathrm{d} f(x)$ dans les bases canoniques de $\mathbb{R}^{n}$ et $\mathbb{R}^{p}$ à l'aide des dérivées partielles de $f$.
  corrige: |
    On écrit chaque application partielle comme la composée de $f$ et d'une application affine.

    **1.** $f_{1} = f \circ i_{1}$ avec $i_{1}(x) = (x, y_{0})$, affine de partie linéaire $h_{1} \mapsto (h_{1}, 0)$. Par la règle de la chaîne, 
    $$\boxed{\mathrm{d} f_{1}(x_{0})\cdot h_{1} = \mathrm{d} f(x_{0}, y_{0})\cdot(h_{1}, 0)}\text{,}$$
     et de même $\mathrm{d} f_{2}(y_{0})\cdot h_{2} = \mathrm{d} f(x_{0}, y_{0})\cdot(0, h_{2})$. Comme $(h_{1}, h_{2}) = (h_{1}, 0) + (0, h_{2})$ et $\mathrm{d} f(x_{0}, y_{0})$ est linéaire, 
    $$\boxed{\mathrm{d} f(x_{0}, y_{0})\cdot(h_{1}, h_{2}) = \mathrm{d} f_{1}(x_{0})\cdot h_{1} + \mathrm{d} f_{2}(y_{0})\cdot h_{2}}.$$
     C'est la proposition 8 (ii) du cours.

    **2.** La $j$-ième colonne de la matrice de $\mathrm{d} f(x)$ est $\mathrm{d} f(x)\cdot e_{j} = D_{e_{j}} f(x) = \dfrac{\partial f}{\partial x_{j}}(x)$, donc 
    $$\boxed{\mathrm{Mat}\big(\mathrm{d} f(x)\big) = \Big(\dfrac{\partial f_{i}}{\partial x_{j}}(x)\Big)_{1 \leqslant i \leqslant p,\ 1 \leqslant j \leqslant n} = J_{f}(x)}.$$
- id: "l3-cd-02-26"
  feuille: "f-l3-cd-02"
  numero: 26
  partie: "Dérivées partielles, matrice jacobienne, gradient"
  etoiles: 1
  types: [Calcul]
  mots_cles: [dérivées partielles et jacobienne]
  noeuds: [gd-differentielle]
  notions: [derivee-partielle, matrice-jacobienne]
  page_enonce: 5
  page_corrige: 15
  enonce: |
    Soit $f : \mathbb{R}^{2} \to \mathbb{R}^{2}$, $f(x, y) = \big(\sin(x^{2} + y^{2}), xy\big)$. Calculer le rang de $\mathrm{d} f(x, y)$ en fonction de $(x, y) \in \mathbb{R}^{2}$.
  corrige: |
    On calcule le déterminant jacobien, puis on regarde où la matrice s'annule entièrement.

    $$J_{f}(x, y) = \begin{pmatrix} 2x\cos(x^{2} + y^{2}) & 2y\cos(x^{2} + y^{2}) \\ y & x \end{pmatrix}, \qquad \det J_{f}(x, y) = 2(x^{2} - y^{2})\cos(x^{2} + y^{2}).$$
     La seconde ligne $(y, x)$ n'est nulle qu'en $(0, 0)$, où la première l'est aussi. D'où

    • 
    $$\boxed{\mathrm{rg}\,\mathrm{d} f(x, y) = 0}$$
     en $(0, 0)$ ;

    • 
    $$\boxed{\mathrm{rg}\,\mathrm{d} f(x, y) = 1}$$
     sur les diagonales $|x| = |y|$ et sur les cercles $x^{2} + y^{2} = \frac{\pi}{2} + k\pi$ ($k \in \mathbb{N}$), privés de l'origine ;

    • 
    $$\boxed{\mathrm{rg}\,\mathrm{d} f(x, y) = 2}$$
     partout ailleurs.

    ![Figure](documents/figures/7bec447190f48531.svg)

    Les points de rang $1$ forment deux droites et une famille de cercles concentriques de rayons $\sqrt{\frac{\pi}{2} + k\pi}$ ; ils séparent des régions où $\mathrm{d} f$ est inversible. Le chapitre 3 montrera qu'en ces points de rang $2$, $f$ est un difféomorphisme local.
- id: "l3-cd-02-27"
  feuille: "f-l3-cd-02"
  numero: 27
  partie: "Dérivées partielles, matrice jacobienne, gradient"
  etoiles: 1
  types: [Calcul]
  mots_cles: [dérivées partielles et jacobienne, gradient, matrice jacobienne, déterminant]
  noeuds: [gd-differentielle]
  notions: [derivee-partielle, matrice-jacobienne, gradient]
  page_enonce: 6
  page_corrige: 15
  enonce: |
    On munit $\mathbb{R}^{n}$ de la norme euclidienne et on note $r(x) = \lVert x \rVert_{2}$.

    **1.** Soit $\alpha \in \mathbb{R}$. Calculer le gradient de $r^{\alpha}$ sur $\mathbb{R}^{n} \setminus \{0\}$.

    **2.** Soit $f : \mathbb{R}^{n} \setminus \{0\} \to \mathbb{R}^{n}$, $f(x) = \dfrac{x}{\lVert x \rVert_{2}}$. Calculer la matrice jacobienne de $f$.

    **3.** Montrer que $\mathrm{d} f(x)\cdot x = 0$. Peut-on trouver ce résultat sans calcul ?

    **4.** Calculer le déterminant jacobien de $f$.
  corrige: |
    On dérive $r$ une fois pour toutes : $\dfrac{\partial r}{\partial x_{i}} = \dfrac{x_{i}}{r}$, soit $\nabla r(x) = \dfrac{x}{r}$ (exercice 10).

    **1.** Par la règle de la chaîne, sur $\mathbb{R}^{n} \setminus \{0\}$, 
    $$\boxed{\nabla(r^{\alpha})(x) = \alpha r^{\alpha - 1}\nabla r(x) = \alpha r^{\alpha - 2}x}\text{.}$$

    **2.** $f_{i} = \dfrac{x_{i}}{r}$, donc $\dfrac{\partial f_{i}}{\partial x_{j}} = \dfrac{\delta_{ij}}{r} - \dfrac{x_{i}x_{j}}{r^{3}}$, c'est-à-dire 
    $$\boxed{J_{f}(x) = \frac{1}{\lVert x \rVert_{2}}\Big(I_{n} - \frac{x\,{}^{t}x}{\lVert x \rVert_{2}^{2}}\Big)}.$$
     C'est $\dfrac{1}{r}$ fois la matrice de la projection orthogonale sur l'hyperplan $x^{\perp}$.

    **3.** $J_{f}(x)x = \dfrac{1}{r}\big(x - x\big) = 0$. Sans calcul : $f$ est constante sur la demi-droite $\{tx \,;\, t > 0\}$, donc sa dérivée selon $x$, qui est $\mathrm{d} f(x)\cdot x$, est nulle. $\boxed{\mathrm{d} f(x)\cdot x = 0}$.

    **4.** Le noyau de $\mathrm{d} f(x)$ contient $x \neq 0$, donc $\boxed{\det J_{f}(x) = 0}$. C'était prévisible : $f$ prend ses valeurs dans la sphère unité, de dimension $n - 1$, et ne peut être un difféomorphisme local.
- id: "l3-cd-02-28"
  feuille: "f-l3-cd-02"
  numero: 28
  partie: "Dérivées partielles, matrice jacobienne, gradient"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [dérivées partielles et jacobienne, gradient]
  noeuds: [gd-differentielle]
  notions: [derivee-partielle, matrice-jacobienne, gradient, produit-scalaire]
  page_enonce: 6
  page_corrige: 16
  enonce: |
    Soit $f : U \subset \mathbb{R}^{n} \to \mathbb{R}$ différentiable en $x_{0}$. On note $\langle \cdot, \cdot \rangle$ le produit scalaire canonique de $\mathbb{R}^{n}$.

    **1.** Montrer qu'il existe un unique vecteur $\nabla f(x_{0}) \in \mathbb{R}^{n}$ tel que $\mathrm{d} f(x_{0})\cdot u = \langle \nabla f(x_{0}), u \rangle$ pour tout $u \in \mathbb{R}^{n}$, et calculer ses coordonnées dans la base canonique.

    **2.** On pose $\gamma(t) = x_{0} + tu$. Calculer la dérivée de $f \circ \gamma$ en $0$ en fonction de $u$ et de $\nabla f(x_{0})$. Quelle propriété particulière a la direction de $\nabla f(x_{0})$ ?

    **3.** On suppose que $\gamma : \,]-1, 1[ \to U$ est dérivable, avec $\gamma(0) = x_{0}$ et $f\big(\gamma(t)\big) = f(x_{0})$ pour tout $t$. Quelle relation lie $\nabla f(x_{0})$ et $\gamma'(0)$ ?

    **4.** On cherche les fonctions $f : U \subset \mathbb{R}^{2} \to \mathbb{R}$ différentiables qui vérifient 
    $$(\mathrm{E}) \qquad y\dfrac{\partial f}{\partial x} - x\dfrac{\partial f}{\partial y} = 0 \quad \text{sur } U.$$
     Trouver les courbes $\gamma : \mathbb{R} \to \mathbb{R}^{2}$ telles que $\gamma(0) = (x_{0}, y_{0})$ et $\gamma'(t) = X\big(\gamma(t)\big)$, où $X(x, y) = (-y, x)$. Montrer que toute solution de $(\mathrm{E})$ est constante le long de ces courbes. En déduire qu'il existe une unique fonction $f$ vérifiant $(\mathrm{E})$ sur $\mathbb{R}^{2} \setminus \{(0, 0)\}$ et $f(x, 0) = e^{x}$ pour tout $x > 0$.
  corrige: |
    Le gradient est orthogonal aux lignes de niveau ; c'est ce qu'on exploite pour résoudre l'équation $(\mathrm{E})$.

    **1.** La forme linéaire $\mathrm{d} f(x_{0})$ s'écrit de façon unique $u \mapsto \langle g, u \rangle$ (représentation des formes linéaires en dimension finie), et $g_{i} = \mathrm{d} f(x_{0})\cdot e_{i}$, d'où 
    $$\boxed{\nabla f(x_{0}) = \Big(\dfrac{\partial f}{\partial x_{1}}(x_{0}), \dots, \dfrac{\partial f}{\partial x_{n}}(x_{0})\Big)}\text{.}$$

    **2.** 
    $$\boxed{(f \circ \gamma)'(0) = \langle \nabla f(x_{0}), u \rangle}\text{.}$$
     Par Cauchy-Schwarz, parmi les $u$ de norme $1$, cette dérivée est maximale pour $u = \dfrac{\nabla f(x_{0})}{\lVert \nabla f(x_{0}) \rVert}$ : le gradient indique la direction de plus forte pente (cours, prop. 10).

    **3.** $f \circ \gamma$ est constante, donc $0 = (f \circ \gamma)'(0) = \langle \nabla f(x_{0}), \gamma'(0) \rangle$ : 
    $$\boxed{\nabla f(x_{0}) \perp \gamma'(0)}.$$
     Le gradient est orthogonal aux courbes tracées sur les lignes de niveau.

    **4.** Les courbes cherchées vérifient $x' = -y$, $y' = x$. Ce sont les rotations 
    $$\boxed{\gamma(t) = (x_{0}\cos t - y_{0}\sin t,\ x_{0}\sin t + y_{0}\cos t)},$$
     qui conviennent ; elles parcourent les cercles centrés en $0$. Si $f$ vérifie $(\mathrm{E})$, 
    $$(f \circ \gamma)'(t) = -y(t)\dfrac{\partial f}{\partial x}\big(\gamma(t)\big) + x(t)\dfrac{\partial f}{\partial y}\big(\gamma(t)\big) = -\Big(y\dfrac{\partial f}{\partial x} - x\dfrac{\partial f}{\partial y}\Big)\big(\gamma(t)\big) = 0,$$
     donc $f$ est constante sur chaque cercle centré en $0$. Le cercle de rayon $\rho > 0$ coupe le demi-axe $\{x > 0\}$ en $(\rho, 0)$, où $f$ vaut $e^{\rho}$ : nécessairement 
    $$\boxed{f(x, y) = e^{\sqrt{x^{2} + y^{2}}}}\text{.}$$
     Réciproquement, cette fonction, de la forme $F(r)$, vérifie $\dfrac{\partial f}{\partial x} = F'(r)\dfrac{x}{r}$ et $\dfrac{\partial f}{\partial y} = F'(r)\dfrac{y}{r}$, donc $(\mathrm{E})$, et $f(x, 0) = e^{x}$ pour $x > 0$ : existence et unicité sont établies.

    ![Figure](documents/figures/63c5a060138f9ea0.svg)

    L'équation $(\mathrm{E})$ s'écrit $\langle \nabla f, X \rangle = 0$, en notant que $-\Big(y\dfrac{\partial f}{\partial x} - x\dfrac{\partial f}{\partial y}\Big) = \langle \nabla f, X \rangle$ : le gradient doit être orthogonal au champ des rotations, donc radial. Les lignes de niveau sont alors des cercles, et la donnée sur le demi-axe fixe la valeur sur chacun.
- id: "l3-cd-02-29"
  feuille: "f-l3-cd-02"
  numero: 29
  partie: "Dérivées partielles, matrice jacobienne, gradient"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [dérivées partielles et jacobienne]
  noeuds: [gd-differentielle]
  notions: [derivee-partielle, matrice-jacobienne]
  page_enonce: 6
  page_corrige: 17
  enonce: |
    Soit $f : \Omega \subset \mathbb{R}^{n} \to \mathbb{R}^{p}$ différentiable en $x$, et $G = \{(x, y) \in \Omega \times \mathbb{R}^{p} \,;\, y = f(x)\}$ le graphe de $f$. On appelle *espace tangent* au graphe de $f$ en $\big(x, f(x)\big)$ l'ensemble 
    $$T_{(x, f(x))}G = \big(x, f(x)\big) + \big\{\gamma'(0) \,;\, \gamma : \,]-\varepsilon, \varepsilon[ \to G \text{ de classe } \mathcal{C}^{1},\ \gamma(0) = \big(x, f(x)\big)\big\}.$$

    **1.** Montrer que $T_{(x, f(x))}G = \big(x, f(x)\big) + \Big\{\Big(v, \displaystyle\sum_{i = 1}^{n}v_{i}\dfrac{\partial f}{\partial x_{i}}(x)\Big) \,;\, v \in \mathbb{R}^{n}\Big\}$. En déduire une base de la direction du plan tangent au graphe de $f(x, y) = xy + x^{3}$ au point $(1, -1, 0)$.

    **2.** Montrer que $(v_{1}, \ldots, v_{n}, w_{1}, \ldots, w_{p}) \in T_{(x, f(x))}G$ si et seulement si $w - f(x) = \mathrm{d} f(x)\cdot(v - x)$. En déduire une équation cartésienne du plan tangent au graphe de $f(x, y) = xy + x^{3}$ au point $(1, -1, 0)$.
  corrige: |
    On suppose $f$ de classe $\mathcal{C}^{1}$ au voisinage de $x$, pour que les courbes $t \mapsto \big(x + tv, f(x + tv)\big)$ soient de classe $\mathcal{C}^{1}$, ce que demande la définition.

    **1.** Une courbe $\gamma$ tracée sur $G$ s'écrit $\gamma(t) = \big(\alpha(t), f(\alpha(t))\big)$, avec $\alpha$ de classe $\mathcal{C}^{1}$ et $\alpha(0) = x$. Par la règle de la chaîne, $\gamma'(0) = \big(v, \mathrm{d} f(x)\cdot v\big)$ avec $v = \alpha'(0)$, et $\mathrm{d} f(x)\cdot v = \sum_{i}v_{i}\dfrac{\partial f}{\partial x_{i}}(x)$. Réciproquement, $\alpha(t) = x + tv$ réalise tout $v \in \mathbb{R}^{n}$. D'où l'égalité demandée. Pour $f(x, y) = xy + x^{3}$ en $(1, -1)$, $\dfrac{\partial f}{\partial x} = y + 3x^{2} = 2$ et $\dfrac{\partial f}{\partial y} = x = 1$ ; une base de la direction du plan tangent est 
    $$\boxed{(1, 0, 2), \quad (0, 1, 1)}.$$

    **2.** $(v, w) \in T_{(x, f(x))}G$ si et seulement si $(v - x, w - f(x)) = \big(h, \mathrm{d} f(x)\cdot h\big)$ pour un $h$, c'est-à-dire, avec $h = v - x$, si et seulement si $w - f(x) = \mathrm{d} f(x)\cdot(v - x)$. Ici, $z - 0 = 2(x - 1) + (y + 1)$, soit 
    $$\boxed{2x + y - z - 1 = 0}.$$
     On vérifie que $(1, -1, 0)$ satisfait l'équation, et que $(2, 1, -1)$, normal au plan, est orthogonal aux deux vecteurs de base.
- id: "l3-cd-02-30"
  feuille: "f-l3-cd-02"
  numero: 30
  partie: "Composition"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [composition]
