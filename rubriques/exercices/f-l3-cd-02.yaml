  page_enonce: 6
  page_corrige: 17
  enonce: |
    Soit $f : \mathbb{R}^{2} \to \mathbb{R}$ différentiable. Montrer que les fonctions $q_{1} : x \mapsto f(x, x)$ et $q_{2} : x \mapsto f(x, -x)$ sont dérivables sur $\mathbb{R}$ et calculer leurs dérivées. Calculer la différentielle de $g : (x, y) \mapsto f(y, x)$.
  corrige: |
    Ce sont trois règles de la chaîne, avec les applications linéaires $x \mapsto (x, x)$, $x \mapsto (x, -x)$ et $(x, y) \mapsto (y, x)$. On note $\partial_{1}f$, $\partial_{2}f$ les dérivées partielles de $f$. 
    $$\boxed{q_{1}'(x) = \partial_{1}f(x, x) + \partial_{2}f(x, x)}, \qquad \boxed{q_{2}'(x) = \partial_{1}f(x, -x) - \partial_{2}f(x, -x)},$$

    $$\boxed{\mathrm{d} g(x, y)\cdot(h, k) = \partial_{1}f(y, x)\,k + \partial_{2}f(y, x)\,h}.$$
     *Piège.* Dans $\mathrm{d} g$, les dérivées partielles de $f$ sont évaluées au point échangé $(y, x)$, et les accroissements sont échangés aussi : $\dfrac{\partial g}{\partial x}(x, y) = \partial_{2}f(y, x)$.
- id: "l3-cd-02-31"
  feuille: "f-l3-cd-02"
  numero: 31
  partie: "Composition"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [composition]
  noeuds: [gd-differentielle]
  notions: [matrice-jacobienne]
  page_enonce: 7
  page_corrige: 17
  enonce: |
    Soit $f : \mathbb{R} \to \mathbb{R}$ et $g : \mathbb{R}^{2} \to \mathbb{R}$ différentiables. Montrer que les applications suivantes sont différentiables et calculer leur différentielle en chaque point.

    **1.** $h : \mathbb{R}^{2} \to \mathbb{R}$, $h(x, y) = f\big(x + g(x, y)\big)$.

    **2.** $h : \mathbb{R}^{2} \to \mathbb{R}$, $h(x, y) = f\big(xy^{2}g(x, y)\big)$.

    **3.** $h : \mathbb{R}^{3} \to \mathbb{R}^{2}$, $h(x, y, z) = \Big(f\big(g_{1}(x, y, z)\,g_{2}(x, y, z)\big),\ g_{1}(x, y, z) + f\big(g_{2}(x, y, z)\big)\Big)$, où $g = (g_{1}, g_{2}) : \mathbb{R}^{3} \to \mathbb{R}^{2}$ est différentiable.
  corrige: |
    Chaque $h$ est une composée d'applications différentiables, donc différentiable (cours, th. 3) ; on applique la règle de la chaîne à l'application intérieure, puis à la fonction extérieure.

    **1.** Avec $u(x, y) = x + g(x, y)$, $\mathrm{d} u = (1 + \partial_{1}g)\,\mathrm{d} x + \partial_{2}g\,\mathrm{d} y$, d'où 
    $$\boxed{\mathrm{d} h(x, y)\cdot(k_{1}, k_{2}) = f'\big(x + g(x, y)\big)\Big(\big(1 + \partial_{1}g(x, y)\big)k_{1} + \partial_{2}g(x, y)\,k_{2}\Big)}.$$

    **2.** Avec $u = xy^{2}g$, la formule de Leibniz donne $\dfrac{\partial u}{\partial x} = y^{2}g + xy^{2}\partial_{1}g$ et $\dfrac{\partial u}{\partial y} = 2xyg + xy^{2}\partial_{2}g$, d'où 
    $$\boxed{\mathrm{d} h(x, y)\cdot(k_{1}, k_{2}) = f'\big(xy^{2}g(x, y)\big)\Big(\big(y^{2}g + xy^{2}\partial_{1}g\big)k_{1} + \big(2xyg + xy^{2}\partial_{2}g\big)k_{2}\Big)},$$
     les fonctions $g$, $\partial_{1}g$, $\partial_{2}g$ étant évaluées en $(x, y)$.

    **3.** Pour $k \in \mathbb{R}^{3}$, en notant $\mathrm{d} g_{i} = \mathrm{d} g_{i}(x, y, z)$ et $g_{i} = g_{i}(x, y, z)$, 
    $$\boxed{\mathrm{d} h(x, y, z)\cdot k = \Big(f'(g_{1}g_{2})\big(g_{2}\,\mathrm{d} g_{1}\cdot k + g_{1}\,\mathrm{d} g_{2}\cdot k\big),\ \mathrm{d} g_{1}\cdot k + f'(g_{2})\,\mathrm{d} g_{2}\cdot k\Big)}.$$
