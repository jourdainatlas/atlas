  enonce: |
    Soit $f$ une application de classe $\mathcal{C}^{1}$ au voisinage de $x_{0}$ et $g$ une application de classe $\mathcal{C}^{1}$ au voisinage de $f(x_{0})$. Montrer que $g \circ f$ est de classe $\mathcal{C}^{1}$ au voisinage de $x_{0}$.
  corrige: |
    Par la règle de la chaîne, au voisinage de $x_{0}$, 
    $$\mathrm{d}(g \circ f)(x) = \mathrm{d} g\big(f(x)\big) \circ \mathrm{d} f(x) = \mathrm{c}\Big(\mathrm{d} g\big(f(x)\big), \mathrm{d} f(x)\Big),$$
     où $\mathrm{c}(A, B) = A \circ B$ est bilinéaire continue ($|\mkern-1.5mu|\mkern-1.5mu|A \circ B|\mkern-1.5mu|\mkern-1.5mu| \leqslant |\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|\,|\mkern-1.5mu|\mkern-1.5mu|B|\mkern-1.5mu|\mkern-1.5mu|$). Les applications $x \mapsto \mathrm{d} g\big(f(x)\big)$, composée de fonctions continues, et $x \mapsto \mathrm{d} f(x)$ sont continues, donc $x \mapsto \mathrm{d}(g \circ f)(x)$ l'est : 
    $$\boxed{g \circ f \text{ est de classe } \mathcal{C}^{1} \text{ au voisinage de } x_{0}}\text{.}$$
- id: "l3-cd-02-56"
  feuille: "f-l3-cd-02"
  numero: 56
  partie: "Applications de classe $\\mathcal{C}^{1}$"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [classe C1, inversion dans GL]
  noeuds: [gd-classe-ck, gd-gl]
  notions: [classe-ck]
  page_enonce: 12
  page_corrige: 29
  enonce: |
    *(Différentielle de l'inverse en dimension infinie.)* Soit $E$ et $F$ des espaces de Banach. On note $\mathrm{Isom}(E, F)$ l'ensemble des $f \in \mathcal{L}(E, F)$ bijectives telles que $f^{-1} \in \mathcal{L}(F, E)$.

    **1.** Soit $h_{1} \in \mathcal{L}(E, F)$ et $h_{2} \in \mathcal{L}(F, E)$. Montrer que $|\mkern-1.5mu|\mkern-1.5mu|h_{2} \circ h_{1}|\mkern-1.5mu|\mkern-1.5mu| \leqslant |\mkern-1.5mu|\mkern-1.5mu|h_{1}|\mkern-1.5mu|\mkern-1.5mu|\,|\mkern-1.5mu|\mkern-1.5mu|h_{2}|\mkern-1.5mu|\mkern-1.5mu|$.

    **2.** Soit $g \in \mathcal{L}(E)$ tel que $|\mkern-1.5mu|\mkern-1.5mu|g|\mkern-1.5mu|\mkern-1.5mu| < 1$, avec $g^{0} = \mathrm{Id}$ et $g^{n} = g \circ g^{n - 1}$.

    **(a)** Montrer que la série de terme général $g^{n}$ converge absolument.

    **(b)** Calculer $(\mathrm{Id} - g)\displaystyle\sum_{n = 0}^{m}g^{n}$ et $\Big(\displaystyle\sum_{n = 0}^{m}g^{n}\Big)(\mathrm{Id} - g)$.

    **(c)** Montrer que $\mathrm{Id} - g \in \mathrm{Isom}(E, E)$.

    **3.** Soit $f \in \mathrm{Isom}(E, F)$ et $h \in \mathcal{L}(E, F)$. Montrer que $|\mkern-1.5mu|\mkern-1.5mu|h|\mkern-1.5mu|\mkern-1.5mu| < \dfrac{1}{|\mkern-1.5mu|\mkern-1.5mu|f^{-1}|\mkern-1.5mu|\mkern-1.5mu|}$ entraîne $f + h \in \mathrm{Isom}(E, F)$. En déduire que $\mathrm{Isom}(E, F)$ est un ouvert de $\mathcal{L}(E, F)$.

    **4.** On considère $\varphi : \mathrm{Isom}(E, F) \to \mathrm{Isom}(F, E)$, $f \mapsto f^{-1}$. Montrer que $\varphi$ est différentiable, calculer $\mathrm{d}\varphi(f)$ et montrer que $\varphi$ est de classe $\mathcal{C}^{1}$.
  corrige: |
    C'est la proposition 3 du cours, entre deux espaces différents. On suit le même plan qu'à l'exercice 5, en remplaçant les matrices par des opérateurs.

    **1.** Pour $x \in E$, $\lVert h_{2}(h_{1}(x)) \rVert \leqslant |\mkern-1.5mu|\mkern-1.5mu|h_{2}|\mkern-1.5mu|\mkern-1.5mu|\,\lVert h_{1}(x) \rVert \leqslant |\mkern-1.5mu|\mkern-1.5mu|h_{2}|\mkern-1.5mu|\mkern-1.5mu|\,|\mkern-1.5mu|\mkern-1.5mu|h_{1}|\mkern-1.5mu|\mkern-1.5mu|\,\lVert x \rVert$, d'où 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|h_{2} \circ h_{1}|\mkern-1.5mu|\mkern-1.5mu| \leqslant |\mkern-1.5mu|\mkern-1.5mu|h_{1}|\mkern-1.5mu|\mkern-1.5mu|\,|\mkern-1.5mu|\mkern-1.5mu|h_{2}|\mkern-1.5mu|\mkern-1.5mu|}\text{.}$$

    **2.** (a) $|\mkern-1.5mu|\mkern-1.5mu|g^{n}|\mkern-1.5mu|\mkern-1.5mu| \leqslant |\mkern-1.5mu|\mkern-1.5mu|g|\mkern-1.5mu|\mkern-1.5mu|^{n}$, terme d'une série géométrique convergente : $\boxed{\text{convergence absolue}}$, donc convergence dans l'espace de Banach $\mathcal{L}(E)$ (cours ch. 1, th. 9 et 11).

    (b) Par télescopage, 
    $$\boxed{(\mathrm{Id} - g)\sum_{n = 0}^{m}g^{n} = \Big(\sum_{n = 0}^{m}g^{n}\Big)(\mathrm{Id} - g) = \mathrm{Id} - g^{m + 1}}\text{.}$$

    (c) Comme $g^{m + 1} \to 0$, on passe à la limite par continuité de la composition : $S = \sum g^{n}$ vérifie $(\mathrm{Id} - g)S = S(\mathrm{Id} - g) = \mathrm{Id}$, avec $S \in \mathcal{L}(E)$. 
    $$\boxed{\mathrm{Id} - g \in \mathrm{Isom}(E, E)}.$$

    **3.** $f + h = f \circ (\mathrm{Id}_{E} + f^{-1} \circ h)$ et $|\mkern-1.5mu|\mkern-1.5mu|f^{-1} \circ h|\mkern-1.5mu|\mkern-1.5mu| \leqslant |\mkern-1.5mu|\mkern-1.5mu|f^{-1}|\mkern-1.5mu|\mkern-1.5mu|\,|\mkern-1.5mu|\mkern-1.5mu|h|\mkern-1.5mu|\mkern-1.5mu| < 1$. Par la question 2 appliquée à $g = -f^{-1} \circ h$, $\mathrm{Id}_{E} + f^{-1} \circ h$ est un isomorphisme, donc $f + h$ aussi, d'inverse $(\mathrm{Id}_{E} + f^{-1} \circ h)^{-1} \circ f^{-1}$. La boule de centre $f$ et de rayon $\dfrac{1}{|\mkern-1.5mu|\mkern-1.5mu|f^{-1}|\mkern-1.5mu|\mkern-1.5mu|}$ est donc dans $\mathrm{Isom}(E, F)$ : 
    $$\boxed{\mathrm{Isom}(E, F) \text{ est ouvert}}\text{.}$$

    **4.** (a) Avec $g = -f^{-1} \circ h$, 
    $$(f + h)^{-1} = \sum_{n \geqslant 0}g^{n} \circ f^{-1} = f^{-1} - f^{-1} \circ h \circ f^{-1} + R, \qquad |\mkern-1.5mu|\mkern-1.5mu|R|\mkern-1.5mu|\mkern-1.5mu| \leqslant \sum_{n \geqslant 2}|\mkern-1.5mu|\mkern-1.5mu|f^{-1}|\mkern-1.5mu|\mkern-1.5mu|^{n + 1}|\mkern-1.5mu|\mkern-1.5mu|h|\mkern-1.5mu|\mkern-1.5mu|^{n} = \frac{|\mkern-1.5mu|\mkern-1.5mu|f^{-1}|\mkern-1.5mu|\mkern-1.5mu|^{3}|\mkern-1.5mu|\mkern-1.5mu|h|\mkern-1.5mu|\mkern-1.5mu|^{2}}{1 - |\mkern-1.5mu|\mkern-1.5mu|f^{-1}|\mkern-1.5mu|\mkern-1.5mu|\,|\mkern-1.5mu|\mkern-1.5mu|h|\mkern-1.5mu|\mkern-1.5mu|}.$$
     Le reste est un $o(|\mkern-1.5mu|\mkern-1.5mu|h|\mkern-1.5mu|\mkern-1.5mu|)$, et $h \mapsto -f^{-1} \circ h \circ f^{-1}$ est linéaire continue, de norme au plus $|\mkern-1.5mu|\mkern-1.5mu|f^{-1}|\mkern-1.5mu|\mkern-1.5mu|^{2}$. Donc 
    $$\boxed{\mathrm{d}\varphi(f)\cdot h = -f^{-1} \circ h \circ f^{-1}}.$$
     (b) $\mathrm{d}\varphi(f) = \Theta\big(\varphi(f)\big)$, où $\Theta : u \mapsto (h \mapsto -u \circ h \circ u)$ va de $\mathcal{L}(F, E)$ dans $\mathcal{L}\big(\mathcal{L}(E, F), \mathcal{L}(F, E)\big)$. Or $|\mkern-1.5mu|\mkern-1.5mu|\Theta(u) - \Theta(v)|\mkern-1.5mu|\mkern-1.5mu| \leqslant |\mkern-1.5mu|\mkern-1.5mu|u - v|\mkern-1.5mu|\mkern-1.5mu|\big(|\mkern-1.5mu|\mkern-1.5mu|u|\mkern-1.5mu|\mkern-1.5mu| + |\mkern-1.5mu|\mkern-1.5mu|v|\mkern-1.5mu|\mkern-1.5mu|\big)$, en écrivant $u h u - v h v = (u - v)hu + vh(u - v)$ : $\Theta$ est continue. Comme $\varphi$ est continue (car différentiable), 
    $$\boxed{\varphi \text{ est de classe } \mathcal{C}^{1}}\text{.}$$
- id: "l3-cd-02-57"
  feuille: "f-l3-cd-02"
  numero: 57
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [synthèse]
  noeuds: [gd-differentielle]
  notions: []
  page_enonce: 12
  page_corrige: 30
  enonce: |
    Soit $F : \mathbb{R}^{2} \to \mathbb{R}^{2}$, $F(x, y) = (x^{2} + y^{2}, y^{2})$, et $F^{(k)}$ la composée de $F$ avec elle-même $k$ fois. On pose 
    $$\Omega = \big\{p \in \mathbb{R}^{2} \,;\, F^{(k)}(p) \xrightarrow[k \to +\infty]{} (0, 0)\big\}.$$

    **1.** Vérifier que $p \in \Omega$ si et seulement si $F(p) \in \Omega$.

    **2.** Montrer qu'il existe $\delta > 0$ tel que $\lVert p \rVert < \delta$ entraîne $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} F(p)|\mkern-1.5mu|\mkern-1.5mu| \leqslant \dfrac{1}{2}$. En déduire que $(0, 0)$ est intérieur à $\Omega$, puis que $\Omega$ est ouvert.

    **3.** Utiliser l'homogénéité de $F$ pour montrer que $\Omega$ est connexe.
  corrige: |
    L'ensemble $\Omega$ est le bassin d'attraction du point fixe $(0, 0)$ ; on montre qu'il contient une boule, puis qu'il est réunion d'images réciproques de cette boule.

    **1.** La suite des itérés de $F(p)$ est celle de $p$ décalée d'un cran, $F^{(k)}\big(F(p)\big) = F^{(k + 1)}(p)$ : les deux convergent ou non ensemble vers $(0, 0)$. 
    $$\boxed{p \in \Omega \iff F(p) \in \Omega}\text{.}$$

    **2.** $\triangleright$ *Une boule dans $\Omega$.* $J_{F}(x, y) = \begin{pmatrix} 2x & 2y \\ 0 & 2y \end{pmatrix}$, de norme de Frobenius $\sqrt{4x^{2} + 8y^{2}} \leqslant 2\sqrt{2}\,\lVert p \rVert_{2}$. Pour $\delta = \dfrac{1}{6}$, $\lVert p \rVert < \delta$ donne 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} F(p)|\mkern-1.5mu|\mkern-1.5mu| \leqslant \frac{\sqrt{2}}{3} < \frac{1}{2}}\text{.}$$
     Sur la boule convexe $B(0, \delta)$, $F$ est donc $\frac{1}{2}$-lipschitzienne et $F(0) = 0$, d'où $\lVert F(p) \rVert \leqslant \frac{1}{2}\lVert p \rVert$ : la boule est stable et, par récurrence, $\lVert F^{(k)}(p) \rVert \leqslant 2^{-k}\lVert p \rVert \to 0$. Ainsi $B(0, \delta) \subset \Omega$, et $(0, 0)$ est intérieur à $\Omega$.

    $\triangleright$ *$\Omega$ est ouvert.* Montrons que $\Omega = \bigcup_{k \geqslant 0}\big(F^{(k)}\big)^{-1}\big(B(0, \delta)\big)$. Si $p \in \Omega$, $F^{(k)}(p)$ entre dans $B(0, \delta)$ pour $k$ assez grand. Réciproquement, si $F^{(k)}(p) \in B(0, \delta) \subset \Omega$, la question 1, appliquée $k$ fois, donne $p \in \Omega$. Chaque $\big(F^{(k)}\big)^{-1}\big(B(0, \delta)\big)$ est ouvert, comme image réciproque d'un ouvert par une application continue : $\boxed{\Omega \text{ est ouvert}}$.

    **3.** $F$ est homogène de degré $2$ : $F(tp) = t^{2}F(p)$, et, par récurrence, $F^{(k)}(tp) = t^{2^{k}}F^{(k)}(p)$. Pour $t \in [0, 1]$ et $p \in \Omega$, $\lVert F^{(k)}(tp) \rVert \leqslant \lVert F^{(k)}(p) \rVert \to 0$ : le segment $[0, p]$ est contenu dans $\Omega$. Ainsi $\Omega$ est étoilé par rapport à l'origine, donc connexe par arcs : $\boxed{\Omega \text{ est connexe}}$.

    ![Figure](documents/figures/f541bf4e356bdac0.svg)

    Le bassin, calculé numériquement, est une région symétrique par rapport aux deux axes, qui coupe l'axe des abscisses en $]-1, 1[$ (sur cet axe, $F(x, 0) = (x^{2}, 0)$). Il est bien plus grand que la boule $B(0, \delta)$ fournie par l'argument, qui n'est qu'un germe : les images réciproques successives de cette boule le remplissent.
- id: "l3-cd-02-58"
  feuille: "f-l3-cd-02"
  numero: 58
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [synthèse]
  noeuds: [gd-differentielle]
  notions: []
  page_enonce: 12
  page_corrige: 31
  enonce: |
    *(Lois de groupe sur $\mathbb{R}$.)* Soit $\star$ une loi de groupe sur $\mathbb{R}$, d'élément neutre $e$, telle que $f : (x, y) \mapsto x \star y$ soit de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$. On note $\partial_{1}f$, $\partial_{2}f$ ses dérivées partielles.

    **1.** Montrer que, pour tous $x$, $y \in \mathbb{R}$, $\partial_{2}f(x \star y, e) = \partial_{2}f(x, y)\,\partial_{2}f(y, e)$. En déduire que $\partial_{2}f(y, e) > 0$.

    **2.** On cherche $\varphi : \mathbb{R} \to \mathbb{R}$ de classe $\mathcal{C}^{1}$ telle que $\varphi(x \star y) = \varphi(x) + \varphi(y)$ pour tous $x$, $y$. En dérivant cette relation par rapport à $y$, montrer que nécessairement 
    $$\varphi(x) = a\int_{e}^{x}\dfrac{\mathrm{d} t}{\partial_{2}f(t, e)}$$
     pour une constante $a$.

    **3.** Réciproquement, montrer que, pour toute constante $a \neq 0$, cette formule définit un difféomorphisme de classe $\mathcal{C}^{1}$ de $\mathbb{R}$ sur $\mathbb{R}$ qui transforme la loi $\star$ en l'addition.

    **4.** En particulier, la loi $\star$ est nécessairement commutative. Montrer que ce n'est pas le cas sur $\mathbb{R}^{2}$, en considérant la loi $(x_{1}, x_{2}) \star (y_{1}, y_{2}) = (x_{1} + y_{1}, x_{2} + e^{x_{1}}y_{2})$.
  corrige: |
    On dérive l'associativité, puis on cherche un isomorphisme vers $(\mathbb{R}, +)$ en résolvant une équation différentielle très simple.

    **1.** Dérivons $x \star (y \star z) = (x \star y) \star z$ par rapport à $z$, en $z = e$. À gauche, la règle de la chaîne donne $\partial_{2}f(x, y \star e)\,\partial_{2}f(y, e)$ ; à droite, $\partial_{2}f(x \star y, e)$. Comme $y \star e = y$, 
    $$\boxed{\partial_{2}f(x \star y, e) = \partial_{2}f(x, y)\,\partial_{2}f(y, e)}.$$
     Prenons $x = y^{-1}$, l'inverse de $y$ pour la loi $\star$ : $\partial_{2}f(e, e) = \partial_{2}f(y^{-1}, y)\,\partial_{2}f(y, e)$. Or $f(e, z) = z$, donc $\partial_{2}f(e, e) = 1$, et $\partial_{2}f(y, e)$ ne s'annule jamais. La fonction $y \mapsto \partial_{2}f(y, e)$ est continue sur l'intervalle $\mathbb{R}$, ne s'annule pas et vaut $1$ en $e$ : $\boxed{\partial_{2}f(y, e) > 0}$.

    **2.** En $y = e$, $\varphi(x \star e) = \varphi(x) + \varphi(e)$ donne $\varphi(e) = 0$. En dérivant $\varphi(x \star y) = \varphi(x) + \varphi(y)$ par rapport à $y$, $\varphi'(x \star y)\,\partial_{2}f(x, y) = \varphi'(y)$, puis, en $y = e$, $\varphi'(x)\,\partial_{2}f(x, e) = \varphi'(e) =: a$. D'où 
    $$\boxed{\varphi(x) = a\int_{e}^{x}\frac{\mathrm{d} t}{\partial_{2}f(t, e)}}.$$

    **3.** Soit $a \neq 0$ et $\varphi$ ainsi définie. Sa dérivée $\dfrac{a}{\partial_{2}f(x, e)}$ est continue et de signe constant : $\varphi$ est strictement monotone, de classe $\mathcal{C}^{1}$, de dérivée jamais nulle, donc un $\mathcal{C}^{1}$-difféomorphisme de $\mathbb{R}$ sur l'intervalle $\varphi(\mathbb{R})$.

    $\triangleright$ *Morphisme.* Fixons $x$ et posons $\Psi(y) = \varphi(x \star y) - \varphi(x) - \varphi(y)$. Par la question 1, 
    $$\Psi'(y) = \frac{a\,\partial_{2}f(x, y)}{\partial_{2}f(x \star y, e)} - \frac{a}{\partial_{2}f(y, e)} = \frac{a}{\partial_{2}f(y, e)} - \frac{a}{\partial_{2}f(y, e)} = 0,$$
     et $\Psi(e) = 0$ : $\Psi = 0$, donc 
    $$\boxed{\varphi(x \star y) = \varphi(x) + \varphi(y)}\text{.}$$

    $\triangleright$ *Surjectivité.* $\varphi(\mathbb{R})$ est un sous-groupe de $(\mathbb{R}, +)$ (image d'un groupe par un morphisme) et un intervalle non réduit à un point. Il contient un $[-\varepsilon, \varepsilon]$, donc tous les $n\varepsilon$ et, étant un intervalle, tout $\mathbb{R}$. Ainsi 
    $$\boxed{\varphi \text{ est un difféomorphisme de } \mathbb{R} \text{ sur } \mathbb{R} \text{ qui transforme } \star \text{ en } +}\text{.}$$

    **4.** Par $\varphi$, $(\mathbb{R}, \star)$ est isomorphe à $(\mathbb{R}, +)$, qui est commutatif ; donc $\star$ l'est. Sur $\mathbb{R}^{2}$, la loi proposée est de classe $\mathcal{C}^{\infty}$ ; c'est une loi de groupe (élément neutre $(0, 0)$, inverse de $(x_{1}, x_{2})$ égal à $(-x_{1}, -e^{-x_{1}}x_{2})$). Elle n'est pas commutative : 
    $$(1, 0) \star (0, 1) = (1, e) \neq (1, 1) = (0, 1) \star (1, 0).$$

    $$\boxed{\text{Le résultat de commutativité est propre à la dimension } 1}\text{.}$$

