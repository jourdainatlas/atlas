  page_enonce: 6
  page_corrige: 22
  enonce: |
    Résoudre les inéquations suivantes.

    **1.** $\dfrac{x^{2}-4}{x-1}\geqslant 0$

    **2.** $\dfrac{x-3}{(x+1)(x-5)}\leqslant 0$
  corrige: |
    **1.** Le numérateur se factorise : $x^{2}-4=(x-2)(x+2)$. Valeur interdite : $1$. Racines du numérateur : $2$ et $-2$. Le tableau comporte donc trois valeurs remarquables, rangées dans l'ordre $-2<1<2$.

    ![Figure](documents/figures/c6a77ae23d0d6ba5.svg)

    $$\boxed{S=\left[-2\,;1\right[\cup\left[2\,;+\infty\right[}$$

    **2.** Deux valeurs interdites cette fois : $-1$ et $5$. Racine du numérateur : $3$.

    ![Figure](documents/figures/30a8bfde24a6dd0f.svg)

    $$\boxed{S=\left]-\infty\,;-1\right[\cup\left[3\,;5\right[}$$
     Les deux bornes $-1$ et $5$ sont exclues comme valeurs interdites, tandis que $3$ est incluse.
- id: "s-09-24"
  feuille: "f-s-09"
  numero: 24
  partie: "Position relative de deux courbes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [inéquations, inéquation produit, position relative de courbes, intervalles]
  noeuds: [q-ordre, ar-corps]
  notions: [corps-ordonne, intervalle]
  page_enonce: 6
  page_corrige: 23
  enonce: |
    Sur le graphique ci-dessous sont tracées la parabole $\mathcal{P}$ d'équation $y=x^{2}$ et la droite $d$ d'équation $y=x+2$.

    ![Figure](documents/figures/fc0733a2beca11de.svg)

    **1.** Lire les coordonnées des deux points d'intersection, marqués en rouge.

    **2.** Sur quel intervalle la parabole est-elle en dessous de la droite ?

    **3.** En déduire l'ensemble des solutions de l'inéquation $x^{2}\leqslant x+2$.

    **4.** Vérifier ce résultat par le calcul, en utilisant la factorisation $x^{2}-x-2=(x-2)(x+1)$.
  corrige: |
    **1.** On lit les coordonnées des deux points marqués : 
    $$\boxed{(-1\,;1) \qquad \text{et} \qquad (2\,;4)}$$

    **2.** Entre ces deux abscisses, la parabole passe sous la droite : 
    $$\boxed{\mathcal{P} \text{ est en dessous de } d \text{ sur } \left]-1\,;2\right[}$$

    **3.** Dire que $x^{2}\leqslant x+2$, c'est dire que la parabole est en dessous de la droite, ou la touche : 
    $$\boxed{S=\left[-1\,;2\right]}$$

    **4.** On étudie le signe de la différence : 
    $$x^{2}-(x+2)=x^{2}-x-2=(x-2)(x+1)$$

    ![Figure](documents/figures/7a021c80e0e9e572.svg)

    La différence est négative ou nulle exactement sur $[-1\,;2]$. 
    $$\boxed{\text{Le calcul confirme la lecture graphique}}$$
- id: "s-09-25"
  feuille: "f-s-09"
  numero: 25
  partie: "Position relative de deux courbes"
  etoiles: 2
  types: [Lecture graphique, Calcul]
  mots_cles: [signe des fonctions affines, position relative de courbes]
  noeuds: [ar-corps]
  notions: []
  page_enonce: 6
  page_corrige: 24
  enonce: |
    On considère les fonctions $f$ et $g$ définies sur $\mathbb{R}$ par $f(x)=3x-2$ et $g(x)=-x+6$.

    **1.** Tracer les deux droites dans un même repère.

    **2.** Calculer $f(x)-g(x)$ et réduire.

    **3.** Étudier le signe de cette différence.

    **4.** En déduire la position relative des deux droites, puis vérifier graphiquement.

    **5.** Déterminer les coordonnées de leur point d'intersection.
  corrige: |
    **1.** Les deux droites passent respectivement par $(0\,;-2)$ et $(0\,;6)$.

    ![Figure](documents/figures/9117cdcb351c7f73.svg)

    **2.** 
    $$f(x)-g(x)=(3x-2)-(-x+6)=3x-2+x-6=\boxed{4x-8}$$

    **3.** C'est une fonction affine de racine $2$, de coefficient $4>0$.

    ![Figure](documents/figures/47a8d526e256de83.svg)

    **4.** 
    $$\boxed{\mathcal{C}_{f} \text{ est en dessous de } \mathcal{C}_{g} \text{ sur } \left]-\infty\,;2\right[ \text{ et au-dessus sur } \left]2\,;+\infty\right[}$$
     La figure le confirme : les deux droites se croisent au point d'abscisse $2$.

    **5.** Les courbes se coupent là où la différence s'annule, c'est-à-dire en $x=2$. On calcule alors $f(2)=3\times 2-2=4$ : 
    $$\boxed{\text{Le point d'intersection a pour coordonnées } (2\,;4)}$$
- id: "s-09-26"
  feuille: "f-s-09"
  numero: 26
  partie: "Position relative de deux courbes"
  etoiles: 2
  types: [Calcul]
  mots_cles: [signe des fonctions affines, inéquation produit, position relative de courbes]
  noeuds: [ar-corps]
  notions: []
  page_enonce: 6
  page_corrige: 24
  enonce: |
    On considère les fonctions $f$ et $g$ définies sur $\mathbb{R}$ par $f(x)=x^{2}$ et $g(x)=4x-3$.

    **1.** Vérifier que $f(x)-g(x)=(x-1)(x-3)$, en développant le membre de droite.

    **2.** Étudier le signe de $f(x)-g(x)$ à l'aide d'un tableau de signes.

    **3.** En déduire la position relative de la parabole et de la droite.

    **4.** Donner les coordonnées des points d'intersection des deux courbes.
  corrige: |
    **1.** On développe le membre de droite : 
    $$(x-1)(x-3)=x^{2}-3x-x+3=x^{2}-4x+3$$
     Or $f(x)-g(x)=x^{2}-(4x-3)=x^{2}-4x+3$ : $\boxed{f(x)-g(x)=(x-1)(x-3)}$

    **2.** Les deux facteurs sont de coefficient positif, de racines $1$ et $3$.

    ![Figure](documents/figures/60be9b5f7280924c.svg)

    **3.** 
    $$\boxed{\begin{array}{l} \text{La parabole est au-dessus de la droite sur } \left]-\infty\,;1\right[ \text{ et sur } \left]3\,;+\infty\right[ \\[1mm] \text{Elle est en dessous sur } \left]1\,;3\right[ \end{array}}$$

    **4.** Les deux courbes se coupent aux abscisses où la différence s'annule, soit $1$ et $3$. On calcule les ordonnées avec $f(x)=x^{2}$ : 
    $$\boxed{\text{Les points d'intersection sont } (1\,;1) \text{ et } (3\,;9)}$$
- id: "s-09-27"
  feuille: "f-s-09"
  numero: 27
  partie: "Position relative de deux courbes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [signe des fonctions affines, inéquation produit, inéquation quotient, position relative de courbes]
  noeuds: [ar-corps]
  notions: []
  page_enonce: 7
  page_corrige: 25
  enonce: |
    On considère les fonctions $f$ et $g$ définies sur $]0\,;+\infty[$ par $f(x)=\dfrac{1}{x}$ et $g(x)=x$.

    **1.** Démontrer que, pour tout $x>0$ : 
    $$f(x)-g(x)=\dfrac{(1-x)(1+x)}{x}$$

    **2.** Justifier que sur $]0\,;+\infty[$, les facteurs $x$ et $1+x$ sont strictement positifs.

    **3.** En déduire que le signe de $f(x)-g(x)$ est celui de $1-x$, puis déterminer la position relative de l'hyperbole et de la droite sur $]0\,;+\infty[$.

    **4.** Reprendre l'étude sur $]-\infty\,;0[$. Le résultat est-il le même ?
  corrige: |
    **1.** Pour $x>0$, on réduit au même dénominateur : 
    $$f(x)-g(x)=\frac{1}{x}-x=\frac{1}{x}-\frac{x^{2}}{x}=\frac{1-x^{2}}{x}$$
     Or $1-x^{2}=(1-x)(1+x)$ par identité remarquable : $\boxed{f(x)-g(x)=\dfrac{(1-x)(1+x)}{x}}$

    **2.** Sur $]0\,;+\infty[$, on a $x>0$ par hypothèse, et donc $1+x>1>0$ : 
    $$\boxed{\text{Les facteurs } x \text{ et } 1+x \text{ sont strictement positifs}}$$

    **3.** Le quotient d'un produit de deux nombres positifs est positif : le signe de $f(x)-g(x)$ ne dépend donc que du facteur $1-x$, qui s'annule en $1$ et dont le coefficient est négatif.

    ![Figure](documents/figures/33ac8ec6d360b4d6.svg)

    $$\boxed{\begin{array}{l} \text{L'hyperbole est au-dessus de la droite sur } \left]0\,;1\right[ \\[1mm] \text{Elle est en dessous sur } \left]1\,;+\infty\right[ \end{array}}$$
     Les deux courbes se coupent au point $(1\,;1)$.

    **4.** Sur $]-\infty\,;0[$, le facteur $x$ est négatif, et $1+x$ change de signe en $-1$. Le facteur $1-x$, lui, reste positif puisque $x<0$.

    ![Figure](documents/figures/c55f76bfaa93cf45.svg)

    $$\boxed{\begin{array}{l} \text{Sur } \left]-\infty\,;-1\right[, \text{ l'hyperbole est au-dessus de la droite} \\[1mm] \text{Sur } \left]-1\,;0\right[, \text{ elle est en dessous} \end{array}}$$

    $$\boxed{\text{Le résultat n'est donc pas le même : les deux courbes se recoupent en } (-1\,;-1)}$$
- id: "s-09-28"
  feuille: "f-s-09"
  numero: 28
  titre: "QCM"
  partie: "Exercices de synthèse"
  etoiles: 1
  types: [QCM, Démonstration]
  mots_cles: [inéquations, signe des fonctions affines, inéquation produit, inéquation quotient, position relative de courbes]
  noeuds: [q-ordre, ar-corps]
  notions: [corps-ordonne]
  page_enonce: 8
  page_corrige: 27
  enonce: |
    Pour chaque question, une seule réponse est exacte. La justifier.

    ```tableau
    **Question** ¦ **Réponse A** ¦ **Réponse B** ¦ **Réponse C**
    1. L'inéquation $-3x>9$ a pour solutions : ¦ $]-\infty\,;-3[$ ¦ $]-3\,;+\infty[$ ¦ $]3\,;+\infty[$
    2. Si $x\leqslant 2$, alors : ¦ $-x\leqslant -2$ ¦ $-x\geqslant -2$ ¦ $-x\leqslant 2$
    3. La racine de la fonction affine $f(x)=4x-12$ est : ¦ $12$ ¦ $3$ ¦ $-3$
    4. La fonction $f(x)=-2x+8$ est positive sur : ¦ $]-\infty\,;4]$ ¦ $[4\,;+\infty[$ ¦ $\mathbb{R}$
    5. L'inéquation $(x-1)(x+5)\leqslant 0$ a pour solutions : ¦ $[-5\,;1]$ ¦ $[1\,;5]$ ¦ $]-\infty\,;-5]\cup[1\,;+\infty[$
    6. La valeur interdite de $\dfrac{x+2}{3x-6}$ est : ¦ $-2$ ¦ $6$ ¦ $2$
    7. L'inéquation $x^{2}\leqslant 25$ a pour solutions : ¦ $[-5\,;5]$ ¦ $]-\infty\,;5]$ ¦ $[5\,;+\infty[$
    8. Si $\dfrac{A}{B}>0$, alors : ¦ $A$ et $B$ sont de même signe ¦ $A$ et $B$ sont positifs ¦ $A>B$
    9. $\mathcal{C}_{f}$ est au-dessus de $\mathcal{C}_{g}$ si et seulement si : ¦ $f(x)-g(x)<0$ ¦ $f(x)-g(x)>0$ ¦ $f(x)>0$
    10. Dans un tableau de signes, une valeur interdite se signale par : ¦ un zéro ¦ une double barre ¦ rien de particulier
    ```
  corrige: |
    ```tableau
    **Question** ¦ **Réponse** ¦ **Justification**
    1 ¦ **A** ¦ On divise par $-3$, donc le sens change : $x<-3$.
    2 ¦ **B** ¦ On multiplie par $-1$, donc le sens change : $-x\geqslant -2$.
    3 ¦ **B** ¦ $4x-12=0$ donne $x=3$.
    4 ¦ **A** ¦ Le coefficient $-2$ est négatif : la fonction est positive *avant* sa racine $4$.
    5 ¦ **A** ¦ Les racines sont $1$ et $-5$, et le produit de deux facteurs croissants est négatif *entre* elles.
    6 ¦ **C** ¦ Le dénominateur $3x-6$ s'annule pour $x=2$. La réponse A est la racine du numérateur, qui n'est pas interdite.
    7 ¦ **A** ¦ $x^{2}-25=(x-5)(x+5)$, négatif entre les racines.
    8 ¦ **A** ¦ Un quotient est positif si et seulement si numérateur et dénominateur ont le même signe : tous deux positifs, ou tous deux négatifs.
    9 ¦ **B** ¦ C'est la propriété 5 du cours : être au-dessus signifie avoir une ordonnée plus grande, donc une différence positive.
    10 ¦ **B** ¦ Le zéro signale une racine ; la double barre signale que l'expression n'existe pas.
    ```
- id: "s-09-29"
  feuille: "f-s-09"
  numero: 29
  titre: "Vrai ou faux"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration, Calcul]
  mots_cles: [inéquations, signe des fonctions affines, inéquation produit, inéquation quotient]
  noeuds: [q-ordre, ar-corps]
  notions: [corps-ordonne]
  page_enonce: 8
  page_corrige: 27
  enonce: |
    Chacune des affirmations suivantes est-elle vraie ou fausse ? Justifier la réponse : par une démonstration si l'affirmation est vraie, par un contre-exemple sinon.

    **1.** Une inéquation admet toujours une infinité de solutions.

    **2.** Si $a<b$, alors $-a<-b$.

    **3.** Si $a<b$, alors $a+7<b+7$.

    **4.** Si $a<b$, alors $3a<3b$.

    **5.** Toute fonction affine change de signe une fois exactement.

    **6.** Le produit de deux nombres négatifs est positif.

    **7.** Si $\dfrac{A}{B}=0$, alors $A=0$.

    **8.** Les solutions de $\dfrac{x-3}{x+1}\geqslant 0$ comprennent la valeur $-1$.

    **9.** L'inéquation $x^{2}\geqslant 0$ a pour ensemble de solutions $\mathbb{R}$.

    **10.** Pour résoudre $\dfrac{1}{x}<3$, il suffit de multiplier les deux membres par $x$.
  corrige: |
    **1.** **Fausse**. Contre-exemple : $x^{2}<0$ n'admet aucune solution, et $(x-1)^{2}\leqslant 0$ n'en admet qu'une seule, $x=1$.

    **2.** **Fausse**. Multiplier par $-1$ change le sens : si $a<b$, alors $-a>-b$. Contre-exemple avec $a=2$ et $b=5$ : on a bien $2<5$, mais $-2>-5$.

    **3.** **Vraie**. C'est la première règle de la propriété 1 : ajouter un même nombre aux deux membres ne change pas le sens.

    **4.** **Vraie**. C'est la deuxième règle : $3$ étant strictement positif, le sens est conservé.

    **5.** **Fausse**. Une fonction affine constante, comme $f(x)=3$, ne change jamais de signe. Ce n'est que lorsque $m\neq 0$ que la fonction change de signe une fois exactement.

    **6.** **Vraie**. C'est la règle des signes : $(-a)\times(-b)=ab$, qui est positif si $a$ et $b$ le sont.

    **7.** **Fausse**. Il faut aussi que le quotient existe, donc que $B\neq 0$. L'implication est correcte lorsque le quotient est défini, mais l'énoncé ne le précise pas : pour $A=B=0$, le quotient n'a aucun sens.

    **8.** **Fausse**. La valeur $-1$ annule le dénominateur : c'est une valeur interdite, elle ne peut donc jamais appartenir à l'ensemble des solutions.

    **9.** **Vraie**. Un carré est toujours positif ou nul, donc tout réel convient : $S=\mathbb{R}$.

    **10.** **Fausse**. C'est exactement l'erreur analysée à l'exercice 22 : le signe de $x$ étant inconnu, on ne sait pas si le sens de l'inégalité doit changer.
- id: "s-09-30"
  feuille: "f-s-09"
  numero: 30
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Lecture graphique, Calcul]
  mots_cles: [inéquations, mise en inéquation]
  noeuds: [q-ordre]
  notions: [corps-ordonne]
  page_enonce: 9
  page_corrige: 28
  enonce: |
    Une salle de sport propose deux formules. Avec la formule $A$, chaque séance coûte $8$ euros. Avec la formule $B$, on paie un abonnement annuel de $60$ euros, puis $3$ euros par séance.

    **1.** On note $n$ le nombre de séances effectuées dans l'année. Exprimer en fonction de $n$ le prix payé avec chacune des deux formules.

    **2.** Résoudre l'inéquation traduisant « la formule $B$ coûte moins cher que la formule $A$ ».

    **3.** À partir de combien de séances la formule $B$ est-elle plus avantageuse ?

    **4.** Tracer dans un même repère les deux droites correspondantes, pour $n$ compris entre $0$ et $25$, et vérifier graphiquement le résultat précédent.

    **5.** Que se passe-t-il exactement pour $n=12$ ?
  corrige: |
    **1.** En notant $n$ le nombre de séances : 
    $$\boxed{\text{Formule } A : \; 8n} \qquad ; \qquad \boxed{\text{Formule } B : \; 60+3n}$$

    **2.** 
    $$60+3n<8n \iff 60<5n \iff n>12$$

    **3.** Le nombre de séances étant un entier : 
    $$\boxed{\text{La formule } B \text{ est plus avantageuse à partir de } 13 \text{ séances}}$$

    **4.**

    ![Figure](documents/figures/a8c9aacfd6b8fb5a.svg)

    La droite verte passe en dessous de la droite bleue à partir de $n=12$ : le graphique confirme le calcul.

    **5.** Pour $n=12$, les deux formules coûtent exactement le même prix : 
    $$8\times 12=96 \qquad \text{et} \qquad 60+3\times 12=96$$

    $$\boxed{\text{Pour } 12 \text{ séances, les deux formules coûtent } 96 \text{ euros}}$$
     C'est le point d'intersection des deux droites : l'inégalité y est une égalité, ce qui explique pourquoi l'avantage ne commence qu'à la séance suivante.
- id: "s-09-31"
  feuille: "f-s-09"
  numero: 31
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [mise en inéquation]
  noeuds: [q-ordre]
  notions: []
  page_enonce: 9
  page_corrige: 29
  enonce: |
    **1.** Un triangle a pour base $x$ et pour hauteur $6$. Un rectangle a pour dimensions $2$ et $x+4$. Ces longueurs sont exprimées en centimètres, avec $x>0$.

    **(a)** Exprimer l'aire de chaque figure en fonction de $x$.

    **(b)** Pour quelles valeurs de $x$ l'aire du triangle est-elle strictement supérieure à celle du rectangle ?

    **2.** Un carré a pour côté $x$, et un rectangle a pour dimensions $x-2$ et $x+3$, avec $x>2$.

    **(a)** Exprimer l'aire de chacune des deux figures, puis développer celle du rectangle.

    **(b)** Démontrer que la différence des deux aires vaut $-x+6$.

    **(c)** En déduire pour quelles valeurs de $x$ le carré a la plus grande aire. On n'oubliera pas la contrainte $x>2$.
  corrige: |
    **1.** **(a)** 
    $$\boxed{\mathcal{A}_{\text{triangle}}=\frac{x\times 6}{2}=3x} \qquad ; \qquad \boxed{\mathcal{A}_{\text{rectangle}}=2(x+4)=2x+8}$$

    **(b)** 
    $$3x>2x+8 \iff x>8$$

    $$\boxed{\text{L'aire du triangle dépasse celle du rectangle dès que } x>8}$$

    **2.** **(a)** 
    $$\boxed{\mathcal{A}_{\text{carré}}=x^{2}}$$

    $$\mathcal{A}_{\text{rectangle}}=(x-2)(x+3)=x^{2}+3x-2x-6=\boxed{x^{2}+x-6}$$

    **(b)** 
    $$x^{2}-\left(x^{2}+x-6\right)=x^{2}-x^{2}-x+6=\boxed{-x+6}$$
     Les termes en $x^{2}$ se sont éliminés : la différence est une simple fonction affine.

    **(c)** Le carré a la plus grande aire lorsque la différence est strictement positive : 
    $$-x+6>0 \iff x<6$$
     Il faut de plus respecter la contrainte $x>2$, sans laquelle le rectangle n'existe pas — sa largeur $x-2$ doit être strictement positive. 
    $$\boxed{S=\left]2\,;6\right[}$$
- id: "s-09-32"
  feuille: "f-s-09"
  numero: 32
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Calcul]
  mots_cles: [inéquations, inéquation produit, position relative de courbes]
  noeuds: [q-ordre, ar-corps]
  notions: [corps-ordonne]
  page_enonce: 9
  page_corrige: 29
  enonce: |
    On considère les fonctions $f$ et $g$ définies sur $\mathbb{R}$ par : 
    $$f(x)=(2x-1)(x+3) \qquad \text{et} \qquad g(x)=(2x-1)(4-x)$$

    **1.** Résoudre l'inéquation $f(x)\geqslant 0$.

    **2.** Résoudre l'inéquation $g(x)<0$.

    **3.** Démontrer que $f(x)-g(x)=(2x-1)^{2}$.

    **4.** En déduire la position relative des courbes de $f$ et de $g$. Ont-elles un point commun ? Si oui, lequel ?

    **5.** Résoudre l'inéquation $f(x)\times g(x)\leqslant 0$.
  corrige: |
    **1.** Racines $\dfrac{1}{2}$ et $-3$.

    ![Figure](documents/figures/fcd2a998c3d671a4.svg)

    $$\boxed{S=\left]-\infty\,;-3\right]\cup\left[\frac{1}{2}\,;+\infty\right[}$$

    **2.** Racines $\dfrac{1}{2}$ et $4$. Le facteur $4-x$ a un coefficient négatif.

    ![Figure](documents/figures/ae16f1c9acce47f3.svg)

    $$\boxed{S=\left]-\infty\,;\frac{1}{2}\right[\cup\left]4\,;+\infty\right[}$$

    **3.** On factorise par $2x-1$ : 
    $$\begin{aligned} f(x)-g(x) &= (2x-1)(x+3)-(2x-1)(4-x) \\ &= (2x-1)\big[(x+3)-(4-x)\big] \\ &= (2x-1)(2x-1)=\boxed{(2x-1)^{2}} \end{aligned}$$

    **4.** Un carré est toujours positif ou nul, donc $f(x)-g(x)\geqslant 0$ pour tout réel $x$. 
    $$\boxed{\mathcal{C}_{f} \text{ est au-dessus de } \mathcal{C}_{g} \text{ sur } \mathbb{R} \text{ tout entier}}$$
     La différence s'annule uniquement lorsque $2x-1=0$, soit $x=\dfrac{1}{2}$. On calcule alors $f\!\left(\dfrac{1}{2}\right)=0$ : 
    $$\boxed{\text{Les deux courbes ont un unique point commun : l'origine } \left(\frac{1}{2}\,;0\right)}$$

    **5.** En factorisant par $2x-1$ dans les deux expressions : 
    $$f(x)\times g(x)=(2x-1)(x+3)\times(2x-1)(4-x)=(2x-1)^{2}(x+3)(4-x)$$
     Le facteur $(2x-1)^{2}$ est **positif ou nul** : il ne change donc jamais le signe du produit, mais il l'annule en $x=\dfrac{1}{2}$. On étudie alors le signe de $(x+3)(4-x)$.

    ![Figure](documents/figures/3d1d450d00e9ac5f.svg)

    Le produit est négatif sur $\left]-\infty\,;-3\right]$ et sur $\left[4\,;+\infty\right[$, mais il s'annule aussi en $x=\dfrac{1}{2}$, où le carré devient nul. 
    $$\boxed{S=\left]-\infty\,;-3\right]\cup\left\{\frac{1}{2}\right\} \cup\left[4\,;+\infty\right[}$$

    $$\boxed{\text{L'ensemble des solutions comporte un \emph{point isolé}}}$$
     C'est la subtilité de cet exercice : un facteur au carré n'influence pas le signe du produit, mais il fournit une solution supplémentaire lorsque l'inégalité est large.
