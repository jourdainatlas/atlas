  mots_cles: [signe des fonctions affines]
  noeuds: [ar-corps]
  notions: []
  page_enonce: 3
  page_corrige: 8
  enonce: |
    **1.** Une fonction affine $f$ s'annule en $3$ et est positive pour $x>3$. Que peut-on dire du signe de son coefficient directeur ? Donner un exemple d'une telle fonction.

    **2.** Une fonction affine $g$ s'annule en $-2$ et vérifie $g(0)=4$. Déterminer son expression.

    **3.** Une fonction affine $h$ est négative avant $5$, positive après, et vérifie $h(0)=-10$. Déterminer son expression.

    **4.** Existe-t-il une fonction affine positive sur $\mathbb{R}$ tout entier ? Si oui, donner un exemple ; si non, expliquer pourquoi.
  corrige: |
    **1.** Une fonction affine est du signe de son coefficient directeur *après* sa racine. Comme $f$ est positive après $3$ : 
    $$\boxed{\text{Le coefficient directeur } m \text{ est strictement positif}}$$
     Par exemple $f(x)=x-3$, ou encore $f(x)=2x-6$.

    **2.** On cherche $g(x)=mx+p$. La condition $g(0)=4$ donne $p=4$, puis $g(-2)=0$ donne : 
    $$-2m+4=0 \iff m=2 \qquad \text{d'où} \qquad \boxed{g(x)=2x+4}$$

    **3.** De même $h(x)=mx+p$ avec $h(0)=-10$, donc $p=-10$. La racine étant $5$ : 
    $$5m-10=0 \iff m=2 \qquad \text{d'où} \qquad \boxed{h(x)=2x-10}$$
     On vérifie que $m=2>0$, ce qui est bien cohérent avec « négative avant, positive après ».

    **4.** Oui, mais uniquement si le coefficient directeur est nul : 
    $$\boxed{\text{Les fonctions constantes positives, par exemple } f(x)=3}$$
     Si $m\neq 0$, la fonction admet une racine et change de signe en ce point : elle prend donc nécessairement des valeurs négatives.
- id: "s-09-13"
  feuille: "f-s-09"
  numero: 13
  partie: "Inéquations produit"
  etoiles: 1
  types: [Calcul]
  mots_cles: [inéquations, signe des fonctions affines, inéquation produit]
  noeuds: [q-ordre, ar-corps]
  notions: [corps-ordonne]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Résoudre les inéquations suivantes à l'aide d'un tableau de signes.

    **a)** $(x-1)(x+3)\geqslant 0$

    **b)** $(2x-4)(x+1)<0$

    **c)** $(-x+3)(x+2)\leqslant 0$

    **d)** $(3x+6)(-2x+1)>0$

    **e)** $x(x-5)\geqslant 0$

    **f)** $(2x-1)(3x+9)\leqslant 0$
  corrige: |
    **a)** Les facteurs s'annulent en $1$ et $-3$, tous deux de coefficient positif.

    ![Figure](documents/figures/60cfcfe71c633a58.svg)

    $$\boxed{S=\left]-\infty\,;-3\right]\cup\left[1\,;+\infty\right[}$$

    **b)** Racines $2$ et $-1$, coefficients $2>0$ et $1>0$.

    ![Figure](documents/figures/dfc9c04b697fd4a6.svg)

    $$\boxed{S=\left]-1\,;2\right[}$$

    **c)** Racines $3$ et $-2$. Attention : le facteur $-x+3$ a un coefficient *négatif*, il est donc positif avant sa racine.

    ![Figure](documents/figures/5ee94209be5ef11a.svg)

    $$\boxed{S=\left]-\infty\,;-2\right]\cup\left[3\,;+\infty\right[}$$

    **d)** Racines $-2$ et $\dfrac{1}{2}$, avec $3>0$ et $-2<0$.

    ![Figure](documents/figures/ceedcea44d084c94.svg)

    $$\boxed{S=\left]-2\,;\frac{1}{2}\right[}$$

    **e)** Racines $0$ et $5$.

    ![Figure](documents/figures/665466dfeb6121f7.svg)

    $$\boxed{S=\left]-\infty\,;0\right]\cup\left[5\,;+\infty\right[}$$

    **f)** Racines $\dfrac{1}{2}$ et $-3$.

    ![Figure](documents/figures/15be80f2993d3ce4.svg)

    $$\boxed{S=\left[-3\,;\frac{1}{2}\right]}$$
- id: "s-09-14"
  feuille: "f-s-09"
  numero: 14
  partie: "Inéquations produit"
  etoiles: 2
  types: [Calcul]
  mots_cles: [inéquations, inéquation produit]
  noeuds: [q-ordre, ar-corps]
  notions: [corps-ordonne]
  page_enonce: 4
  page_corrige: 10
  enonce: |
    Résoudre les inéquations suivantes.

    **a)** $(3x-2)(2x+5)\geqslant 0$

    **b)** $(4x+3)(5x-1)<0$

    **c)** $(2x-7)(-3x-1)\leqslant 0$

    **d)** $x(6x+5)>0$

    **e)** $(2x+1)(x-3)\geqslant(2x+1)(2x-1)$

    **f)** $9x^{2}<4$
  corrige: |
    **a)** Racines $\dfrac{2}{3}$ et $-\dfrac{5}{2}$, coefficients $3>0$ et $2>0$.

    ![Figure](documents/figures/78c9d1f862d4e11b.svg)

    $$\boxed{S=\left]-\infty\,;-\frac{5}{2}\right]\cup\left[\frac{2}{3}\,;+\infty\right[}$$

    **b)** Racines $-\dfrac{3}{4}$ et $\dfrac{1}{5}$.

    ![Figure](documents/figures/282af518ca40b6f6.svg)

    $$\boxed{S=\left]-\frac{3}{4}\,;\frac{1}{5}\right[}$$

    **c)** Racines $\dfrac{7}{2}$ et $-\dfrac{1}{3}$, avec $2>0$ et $-3<0$.

    ![Figure](documents/figures/dd85d0b073f619c4.svg)

    $$\boxed{S=\left]-\infty\,;-\frac{1}{3}\right]\cup\left[\frac{7}{2}\,;+\infty\right[}$$

    **d)** Racines $0$ et $-\dfrac{5}{6}$.

    ![Figure](documents/figures/7b5b6a1f72174e8d.svg)

    $$\boxed{S=\left]-\infty\,;-\frac{5}{6}\right[\cup\left]0\,;+\infty\right[}$$

    **e)** On ramène tout à gauche, puis on factorise par $2x+1$ : 
    $$\begin{aligned} (2x+1)(x-3)-(2x+1)(2x-1) &\geqslant 0 \\ (2x+1)\big[(x-3)-(2x-1)\big] &\geqslant 0 \\ (2x+1)(-x-2) &\geqslant 0 \end{aligned}$$
     Racines $-\dfrac{1}{2}$ et $-2$, avec $2>0$ et $-1<0$.

    ![Figure](documents/figures/6ef9d5d182c6298b.svg)

    $$\boxed{S=\left[-2\,;-\frac{1}{2}\right]}$$

    **f)** On ramène à $0$ et l'on reconnaît une différence de deux carrés : 
    $$9x^{2}<4 \iff 9x^{2}-4<0 \iff (3x-2)(3x+2)<0$$

    ![Figure](documents/figures/e708cf43e1dd0002.svg)

    $$\boxed{S=\left]-\frac{2}{3}\,;\frac{2}{3}\right[}$$
- id: "s-09-15"
  feuille: "f-s-09"
  numero: 15
  partie: "Inéquations produit"
  etoiles: 2
  types: [Calcul]
  mots_cles: [inéquations, inéquation produit]
  noeuds: [q-ordre, ar-corps]
  notions: [corps-ordonne]
  page_enonce: 4
  page_corrige: 12
  enonce: |
    Factoriser par un facteur commun, puis résoudre.

    **1.** $x^{2}-3x\geqslant 0$

    **2.** $2x^{2}+6x<0$

    **3.** $(x-2)(x+1)-(x-2)(2x+5)\leqslant 0$

    **4.** $(3x-1)(x+2)+(3x-1)>0$

    Pour d), on remarquera que $3x-1=(3x-1)\times 1$.
  corrige: |
    **1.** $x^{2}-3x=x(x-3)$, de racines $0$ et $3$.

    ![Figure](documents/figures/9d52876ead9b6e4e.svg)

    $$\boxed{S=\left]-\infty\,;0\right]\cup\left[3\,;+\infty\right[}$$

    **2.** $2x^{2}+6x=2x(x+3)$, de racines $0$ et $-3$.

    ![Figure](documents/figures/722d7bd423917668.svg)

    $$\boxed{S=\left]-3\,;0\right[}$$

    **3.** On factorise par $x-2$ : 
    $$(x-2)\big[(x+1)-(2x+5)\big]=(x-2)(-x-4)$$
     Racines $2$ et $-4$, avec $1>0$ et $-1<0$.

    ![Figure](documents/figures/b168d5a3a0474609.svg)

    $$\boxed{S=\left]-\infty\,;-4\right]\cup\left[2\,;+\infty\right[}$$

    **4.** Le second terme est $(3x-1)\times 1$, ce qui fait apparaître le facteur commun : 
    $$(3x-1)(x+2)+(3x-1)=(3x-1)\big[(x+2)+1\big]=(3x-1)(x+3)$$
     Racines $\dfrac{1}{3}$ et $-3$.

    ![Figure](documents/figures/52214bd9e415828f.svg)

    $$\boxed{S=\left]-\infty\,;-3\right[\cup\left]\frac{1}{3}\,;+\infty\right[}$$
- id: "s-09-16"
  feuille: "f-s-09"
  numero: 16
  partie: "Inéquations produit"
  etoiles: 2
  types: [Calcul]
  mots_cles: [inéquations]
  noeuds: [q-ordre]
  notions: [corps-ordonne]
  page_enonce: 4
  page_corrige: 13
  enonce: |
    Factoriser à l'aide d'une identité remarquable, puis résoudre.

    **a)** $x^{2}-9\leqslant 0$

    **b)** $x^{2}-16>0$

    **c)** $4x^{2}-25\geqslant 0$

    **d)** $x^{2}-5<0$

    **e)** $(x+1)^{2}-4\leqslant 0$

    **f)** $9-x^{2}\geqslant 0$

    Pour d), on écrira $5=\left(\sqrt{5}\right)^{2}$.
  corrige: |
    Dans chaque cas on utilise l'identité $A^{2}-B^{2}=(A-B)(A+B)$, puis un tableau de signes dont la structure est toujours la même : les deux facteurs sont de coefficients positifs, donc le produit est positif à l'extérieur des racines et négatif entre elles.

    **a)** $x^{2}-9=(x-3)(x+3)$, de racines $3$ et $-3$.

    ![Figure](documents/figures/7cfd0994000d75c5.svg)

    $$\boxed{S=\left[-3\,;3\right]}$$

    **b)** $x^{2}-16=(x-4)(x+4)$, de racines $4$ et $-4$ : $\boxed{S=\left]-\infty\,;-4\right[\cup\left]4\,;+\infty\right[}$

    **c)** $4x^{2}-25=(2x-5)(2x+5)$, de racines $\dfrac{5}{2}$ et $-\dfrac{5}{2}$ : 
    $$\boxed{S=\left]-\infty\,;-\frac{5}{2}\right]\cup\left[\frac{5}{2}\,;+\infty\right[}$$

    **d)** En écrivant $5=\left(\sqrt{5}\right)^{2}$, on obtient $x^{2}-5=\left(x-\sqrt{5}\right)\left(x+\sqrt{5}\right)$ : 
    $$\boxed{S=\left]-\sqrt{5}\,;\sqrt{5}\right[}$$

    **e)** $(x+1)^{2}-4=(x+1-2)(x+1+2)=(x-1)(x+3)$, de racines $1$ et $-3$ : $\boxed{S=\left[-3\,;1\right]}$

    **f)** $9-x^{2}=(3-x)(3+x)$, de racines $3$ et $-3$. Attention, le facteur $3-x$ a un coefficient négatif.

    ![Figure](documents/figures/94d5dd2ea2e923e7.svg)

    $$\boxed{S=\left[-3\,;3\right]}$$
     On retrouve le même ensemble qu'en a), ce qui est logique : $9-x^{2}\geqslant 0$ équivaut à $x^{2}-9\leqslant 0$.
- id: "s-09-17"
  feuille: "f-s-09"
  numero: 17
  partie: "Inéquations produit"
  etoiles: 2
  types: [Calcul]
  mots_cles: [inéquations, inéquation produit]
  noeuds: [q-ordre, ar-corps]
  notions: [corps-ordonne]
  page_enonce: 4
  page_corrige: 14
  enonce: |
    Ramener d'abord tous les termes du même côté, factoriser, puis résoudre.

    **1.** $x^{2}\geqslant 4x$

    **2.** $(x+2)^{2}<9$

    **3.** $x(x+1)>2(x+1)$

    **4.** $(2x-3)(x+1)\geqslant(2x-3)(3-x)$

    Pour a) et c), on prendra bien garde à ne pas diviser par une expression contenant $x$ : elle pourrait être nulle, ou négative.
  corrige: |
    **1.** On ramène tout à gauche puis on factorise : 
    $$x^{2}\geqslant 4x \iff x^{2}-4x\geqslant 0 \iff x(x-4)\geqslant 0$$

    ![Figure](documents/figures/931933e52de2c9a3.svg)

    $$\boxed{S=\left]-\infty\,;0\right]\cup\left[4\,;+\infty\right[}$$
     **Il ne fallait surtout pas diviser par $x$** : ce nombre peut être nul, et surtout son signe est inconnu, ce qui rendrait le sens de l'inégalité imprévisible.

    **2.** 
    $$(x+2)^{2}<9 \iff (x+2)^{2}-9<0 \iff (x+2-3)(x+2+3)<0 \iff (x-1)(x+5)<0$$

    ![Figure](documents/figures/f4e4b9a89a0aa015.svg)

    $$\boxed{S=\left]-5\,;1\right[}$$

    **3.** On ramène à $0$ et l'on factorise par $x+1$ : 
    $$x(x+1)>2(x+1) \iff x(x+1)-2(x+1)>0 \iff (x+1)(x-2)>0$$

    ![Figure](documents/figures/d9e0376f06715460.svg)

    $$\boxed{S=\left]-\infty\,;-1\right[\cup\left]2\,;+\infty\right[}$$
     Ici encore, diviser les deux membres par $x+1$ aurait été une faute : cette expression change de signe en $-1$.

    **4.** On factorise par $2x-3$ : 
    $$(2x-3)\big[(x+1)-(3-x)\big]\geqslant 0 \iff (2x-3)(2x-2)\geqslant 0$$
     Racines $\dfrac{3}{2}$ et $1$.

    ![Figure](documents/figures/43b5d272b4528610.svg)

    $$\boxed{S=\left]-\infty\,;1\right]\cup\left[\frac{3}{2}\,;+\infty\right[}$$
- id: "s-09-18"
  feuille: "f-s-09"
  numero: 18
  partie: "Inéquations produit"
  etoiles: 2
  types: [Calcul]
  mots_cles: [inéquations, inéquation produit]
  noeuds: [q-ordre, ar-corps]
  notions: [corps-ordonne]
  page_enonce: 5
  page_corrige: 16
  enonce: |
    Résoudre les inéquations suivantes, dont le produit comporte trois facteurs.

    **1.** $(x-1)(x+2)(x-4)\geqslant 0$

    **2.** $x(x-3)(-x+1)<0$
  corrige: |
    **1.** Trois facteurs, de racines $1$, $-2$ et $4$, tous de coefficient positif. Le tableau comporte donc quatre colonnes de signes.

    ![Figure](documents/figures/58959604c38e5760.svg)

    $$\boxed{S=\left[-2\,;1\right]\cup\left[4\,;+\infty\right[}$$

    **2.** Racines $0$, $3$ et $1$, que l'on range dans l'ordre croissant : $0<1<3$. Le facteur $-x+1$ a un coefficient négatif.

    ![Figure](documents/figures/b09daf26fa8c7dce.svg)

    $$\boxed{S=\left]0\,;1\right[\cup\left]3\,;+\infty\right[}$$
- id: "s-09-19"
  feuille: "f-s-09"
  numero: 19
  partie: "Inéquations quotient"
  etoiles: 1
  types: [Calcul]
  mots_cles: [inéquations, inéquation quotient]
  noeuds: [q-ordre, ar-corps]
  notions: [corps-ordonne]
  page_enonce: 5
  page_corrige: 16
  enonce: |
    Résoudre les inéquations suivantes.

    **a)** $\dfrac{x-2}{x+3}\geqslant 0$

    **b)** $\dfrac{x+1}{x-4}<0$

    **c)** $\dfrac{2x-6}{x+1}\leqslant 0$

    **d)** $\dfrac{-x+5}{x-2}>0$

    **e)** $\dfrac{3x+9}{-2x+4}\geqslant 0$

    **f)** $\dfrac{x}{x-1}\leqslant 0$
  corrige: |
    Un quotient est du signe du produit de son numérateur par son dénominateur. On place une **double barre** sous la valeur interdite, où le quotient n'existe pas.

    **a)** Valeur interdite : $-3$. Racine du numérateur : $2$.

    ![Figure](documents/figures/0a9da76b32507332.svg)

    $$\boxed{S=\left]-\infty\,;-3\right[\cup\left[2\,;+\infty\right[}$$
     La borne $-3$ est *exclue* car c'est la valeur interdite, alors que $2$ est incluse puisque le quotient y vaut $0$.

    **b)** Valeur interdite : $4$. Racine : $-1$.

    ![Figure](documents/figures/cbbecbad9d1fd589.svg)

    $$\boxed{S=\left]-1\,;4\right[}$$

    **c)** Valeur interdite : $-1$. Racine : $3$.

    ![Figure](documents/figures/9562e7ef433719d0.svg)

    $$\boxed{S=\left]-1\,;3\right]}$$

    **d)** Valeur interdite : $2$. Racine : $5$. Le numérateur a un coefficient négatif.

    ![Figure](documents/figures/62b87c4599be79aa.svg)

    $$\boxed{S=\left]2\,;5\right[}$$

    **e)** Valeur interdite : $2$. Racine : $-3$. Le dénominateur a un coefficient négatif.

    ![Figure](documents/figures/3e4548dd6b5fa1fa.svg)

    $$\boxed{S=\left[-3\,;2\right[}$$

    **f)** Valeur interdite : $1$. Racine : $0$.

    ![Figure](documents/figures/e71bca0c9fcccf38.svg)

    $$\boxed{S=\left[0\,;1\right[}$$
- id: "s-09-20"
  feuille: "f-s-09"
  numero: 20
  partie: "Inéquations quotient"
  etoiles: 2
  types: [Calcul]
  mots_cles: [inéquations, inéquation quotient]
  noeuds: [q-ordre, ar-corps]
  notions: [corps-ordonne]
  page_enonce: 5
  page_corrige: 18
  enonce: |
    Résoudre les inéquations suivantes.

    **a)** $\dfrac{3x-1}{2x+5}\leqslant 0$

    **b)** $\dfrac{4x+2}{3-x}>0$

    **c)** $\dfrac{2x-1}{x+4}\geqslant 2$

    **d)** $\dfrac{x+3}{2x-1}<1$

    **e)** $\dfrac{3}{x}\geqslant\dfrac{1}{2}$

    **f)** $\dfrac{5x+2}{x-1}\leqslant 3$
  corrige: |
    **a)** Valeur interdite : $-\dfrac{5}{2}$. Racine : $\dfrac{1}{3}$.

    ![Figure](documents/figures/512672270c222ee8.svg)

    $$\boxed{S=\left]-\frac{5}{2}\,;\frac{1}{3}\right]}$$

    **b)** Valeur interdite : $3$. Racine : $-\dfrac{1}{2}$.

    ![Figure](documents/figures/058bb9326e4362de.svg)

    $$\boxed{S=\left]-\frac{1}{2}\,;3\right[}$$

    **c)** On ramène à $0$ en réduisant au même dénominateur : 
    $$\frac{2x-1}{x+4}-2=\frac{2x-1-2(x+4)}{x+4}=\frac{2x-1-2x-8}{x+4}=\frac{-9}{x+4}$$
     Le numérateur $-9$ est une constante strictement négative : le quotient est donc du signe opposé à celui de $x+4$.

    ![Figure](documents/figures/8a998c2d032b31be.svg)

    $$\boxed{S=\left]-\infty\,;-4\right[}$$

    **d)** 
    $$\frac{x+3}{2x-1}-1=\frac{x+3-(2x-1)}{2x-1}=\frac{-x+4}{2x-1}$$
     Valeur interdite : $\dfrac{1}{2}$. Racine : $4$.

    ![Figure](documents/figures/c6f3737472efd401.svg)

    $$\boxed{S=\left]-\infty\,;\frac{1}{2}\right[\cup\left]4\,;+\infty\right[}$$

    **e)** 
    $$\frac{3}{x}-\frac{1}{2}=\frac{6-x}{2x}$$
     Valeur interdite : $0$. Racine : $6$.

    ![Figure](documents/figures/66ff87a5b5fb8402.svg)

    $$\boxed{S=\left]0\,;6\right]}$$

    **f)** 
    $$\frac{5x+2}{x-1}-3=\frac{5x+2-3(x-1)}{x-1}=\frac{2x+5}{x-1}$$
     Valeur interdite : $1$. Racine : $-\dfrac{5}{2}$.

    ![Figure](documents/figures/ee92b8aece174ea5.svg)

    $$\boxed{S=\left[-\frac{5}{2}\,;1\right[}$$
- id: "s-09-21"
  feuille: "f-s-09"
  numero: 21
  partie: "Inéquations quotient"
  etoiles: 2
  types: [Calcul]
  mots_cles: [inéquations, inéquation quotient]
  noeuds: [q-ordre, ar-corps]
  notions: [corps-ordonne]
  page_enonce: 5
  page_corrige: 20
  enonce: |
    Résoudre les inéquations suivantes.

    **1.** $\dfrac{x+1}{x-2}\geqslant 1$

    **2.** $\dfrac{2x}{x+3}<1$

    **3.** $\dfrac{1}{x}\leqslant 2$

    **4.** $\dfrac{x-1}{x+2}\leqslant 2$
  corrige: |
    **1.** 
    $$\frac{x+1}{x-2}-1=\frac{x+1-(x-2)}{x-2}=\frac{3}{x-2}$$
     Le numérateur $3$ étant strictement positif, le quotient est du signe de $x-2$.

    ![Figure](documents/figures/a39347537fe8d23b.svg)

    $$\boxed{S=\left]2\,;+\infty\right[}$$

    **2.** 
    $$\frac{2x}{x+3}-1=\frac{2x-(x+3)}{x+3}=\frac{x-3}{x+3}$$

    ![Figure](documents/figures/62c3b5a7cff66d4b.svg)

    $$\boxed{S=\left]-3\,;3\right[}$$

    **3.** 
    $$\frac{1}{x}-2=\frac{1-2x}{x}$$
     Valeur interdite : $0$. Racine : $\dfrac{1}{2}$.

    ![Figure](documents/figures/88d4eeac5ebc1db7.svg)

    $$\boxed{S=\left]-\infty\,;0\right[\cup\left[\frac{1}{2}\,;+\infty\right[}$$

    **4.** 
    $$\frac{x-1}{x+2}-2=\frac{x-1-2(x+2)}{x+2}=\frac{-x-5}{x+2}$$
     Valeur interdite : $-2$. Racine : $-5$.

    ![Figure](documents/figures/d324ffe8e97582da.svg)

    $$\boxed{S=\left]-\infty\,;-5\right]\cup\left]-2\,;+\infty\right[}$$
- id: "s-09-22"
  feuille: "f-s-09"
  numero: 22
  partie: "Inéquations quotient"
  etoiles: 2
  types: [Calcul]
  mots_cles: [inéquations, inéquation quotient]
  noeuds: [q-ordre, ar-corps]
  notions: [corps-ordonne]
  page_enonce: 5
  page_corrige: 22
  enonce: |
    Julie résout l'inéquation $\dfrac{1}{x}\leqslant 2$ de la façon suivante : « je multiplie les deux membres par $x$, ce qui donne $1\leqslant 2x$, donc $x\geqslant\dfrac{1}{2}$ ».

    **1.** Vérifier que $x=-1$ est solution de l'inéquation de départ.

    **2.** Ce nombre appartient-il à l'ensemble trouvé par Julie ?

    **3.** Expliquer précisément l'erreur commise. Quelle règle du cours a été oubliée ?

    **4.** Comparer avec le résultat obtenu à la question 3 de l'exercice 21.

    **5.** Rédiger un court conseil, à destination d'un camarade, expliquant pourquoi il ne faut jamais multiplier une inéquation par une expression contenant l'inconnue.
  corrige: |
    **1.** 
    $$\frac{1}{-1}=-1 \qquad \text{et} \qquad -1\leqslant 2$$

    $$\boxed{x=-1 \text{ est bien solution de l'inéquation de départ}}$$

    **2.** L'ensemble trouvé par Julie est $\left[\dfrac{1}{2}\,;+\infty\right[$, or $-1<\dfrac{1}{2}$ : 
    $$\boxed{-1 \text{ n'appartient pas à l'ensemble trouvé par Julie}}$$
     Sa méthode a donc *perdu* des solutions : elle est nécessairement fausse.

    **3.** Julie a multiplié les deux membres par $x$, sans connaître le signe de ce nombre. Or la propriété 1 du cours distingue deux cas :

    • si $x>0$, le sens de l'inégalité est conservé et l'on obtient bien $1\leqslant 2x$ ;

    • si $x<0$, **le sens change** et l'on obtient $1\geqslant 2x$.

    $$\boxed{\text{La règle oubliée est le changement de sens lors d'une multiplication par un nombre négatif}}$$
     Comme $x$ est l'inconnue, son signe n'est pas connu : on ne peut pas trancher entre les deux cas.

    **4.** La résolution correcte, menée à la question 3 de l'exercice 21, donne : 
    $$S=\left]-\infty\,;0\right[\cup\left[\frac{1}{2}\,;+\infty\right[$$
     Julie n'a trouvé que la seconde partie, celle qui correspond au cas $x>0$. Il lui manque tout l'intervalle $\left]-\infty\,;0\right[$, qui correspond au cas $x<0$.

    **5.** 
    $$\boxed{\begin{array}{l} \text{« Ne multiplie jamais une inéquation par une expression contenant } x. \text{ Son signe} \\[1mm] \text{dépend de } x \text{, donc tu ne sais pas si le sens de l'inégalité doit changer. Ramène} \\[1mm] \text{plutôt tout d'un même côté, réduis au même dénominateur, puis fais un tableau} \\[1mm] \text{de signes : c'est la seule méthode qui traite tous les cas d'un coup. »} \end{array}}$$
- id: "s-09-23"
  feuille: "f-s-09"
  numero: 23
  partie: "Inéquations quotient"
  etoiles: 2
  types: [Calcul]
