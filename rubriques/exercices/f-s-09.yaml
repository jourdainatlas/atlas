- id: "s-09-01"
  feuille: "f-s-09"
  numero: 1
  partie: "Règles de base et premier degré"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [inéquations, inéquation produit, intervalles]
  noeuds: [q-ordre, ar-corps]
  notions: [corps-ordonne, intervalle]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Parmi les nombres $-3$, $0$, $2$ et $5$, lesquels sont solutions de l'inéquation $3x-7\leqslant 2$ ? Justifier par un calcul pour chacun.

    **2.** Même question pour l'inéquation $(x-1)(x+3)>0$, avec les nombres $-5$, $-2$, $0$ et $3$.

    **3.** Une inéquation admet-elle en général un nombre fini de solutions ? Pourquoi écrit-on l'ensemble des solutions sous forme d'intervalle plutôt que sous forme de liste ?
  corrige: |
    **1.** On remplace $x$ par chacune des valeurs proposées. 
    $$\begin{aligned} x=-3 &: \quad 3\times(-3)-7=-16\leqslant 2 && \Longrightarrow \; \boxed{-3 \text{ est solution}} \\ x=0 &: \quad -7\leqslant 2 && \Longrightarrow \; \boxed{0 \text{ est solution}} \\ x=2 &: \quad 6-7=-1\leqslant 2 && \Longrightarrow \; \boxed{2 \text{ est solution}} \\ x=5 &: \quad 15-7=8>2 && \Longrightarrow \; \boxed{5 \text{ n'est pas solution}} \end{aligned}$$

    **2.** On calcule le produit à chaque fois, en appliquant la règle des signes. 
    $$\begin{aligned} x=-5 &: \quad (-6)\times(-2)=12>0 && \Longrightarrow \; \boxed{-5 \text{ est solution}} \\ x=-2 &: \quad (-3)\times 1=-3<0 && \Longrightarrow \; \boxed{-2 \text{ n'est pas solution}} \\ x=0 &: \quad (-1)\times 3=-3<0 && \Longrightarrow \; \boxed{0 \text{ n'est pas solution}} \\ x=3 &: \quad 2\times 6=12>0 && \Longrightarrow \; \boxed{3 \text{ est solution}} \end{aligned}$$

    **3.** 
    $$\boxed{\text{Une inéquation admet en général une \emph{infinité} de solutions}}$$
     On ne peut donc pas les énumérer une à une : il faut les *décrire*. L'intervalle est précisément l'outil qui permet de désigner d'un seul coup une infinité de nombres, en n'en citant que les deux bornes.
- id: "s-09-02"
  feuille: "f-s-09"
  numero: 2
  partie: "Règles de base et premier degré"
  etoiles: 1
  types: [Calcul]
  mots_cles: [inéquations, encadrement, inéquation quotient]
  noeuds: [q-ordre, ar-corps]
  notions: [corps-ordonne, intervalle]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** On sait que $x\leqslant 4$. Recopier et compléter par le symbole qui convient.

    **a)** $x+3 \; \dots \; 7$

    **b)** $x-5 \; \dots \; -1$

    **c)** $2x \; \dots \; 8$

    **d)** $-3x \; \dots \; -12$

    **e)** $\dfrac{x}{2} \; \dots \; 2$

    **f)** $-x \; \dots \; -4$

    **2.** On sait maintenant que $-2\leqslant x\leqslant 5$. Encadrer chacune des expressions suivantes.

    **a)** $3x$

    **b)** $-x$

    **c)** $x+1$

    **d)** $2x-3$
  corrige: |
    **1.** On part de $x\leqslant 4$ et l'on applique les règles de la propriété 1.

    ```tableau
     ¦ **Réponse** ¦ **Opération effectuée**
    a) ¦ $x+3\leqslant 7$ ¦ on ajoute $3$ : le sens ne change pas
    b) ¦ $x-5\leqslant -1$ ¦ on retranche $5$ : le sens ne change pas
    c) ¦ $2x\leqslant 8$ ¦ on multiplie par $2>0$ : le sens ne change pas
    d) ¦ $-3x\geqslant -12$ ¦ on multiplie par $-3<0$ : **le sens change**
    e) ¦ $\dfrac{x}{2}\leqslant 2$ ¦ on divise par $2>0$ : le sens ne change pas
    f) ¦ $-x\geqslant -4$ ¦ on multiplie par $-1<0$ : **le sens change**
    ```

    **2.** On part de $-2\leqslant x\leqslant 5$.

    **a)** On multiplie par $3$, qui est positif : $\boxed{-6\leqslant 3x\leqslant 15}$

    **b)** On multiplie par $-1$ : les deux inégalités changent de sens, et il faut donc *échanger* les bornes pour réécrire l'encadrement dans l'ordre croissant. 
    $$2\geqslant -x\geqslant -5 \qquad \text{c'est-à-dire} \qquad \boxed{-5\leqslant -x\leqslant 2}$$

    **c)** On ajoute $1$ : $\boxed{-1\leqslant x+1\leqslant 6}$

    **d)** On multiplie par $2$ puis on retranche $3$ : 
    $$-4\leqslant 2x\leqslant 10 \qquad \text{puis} \qquad \boxed{-7\leqslant 2x-3\leqslant 7}$$
- id: "s-09-03"
  feuille: "f-s-09"
  numero: 3
  partie: "Règles de base et premier degré"
  etoiles: 1
  types: [Calcul]
  mots_cles: [inéquations, intervalles]
  noeuds: [q-ordre]
  notions: [corps-ordonne, intervalle]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Résoudre les inéquations suivantes et donner l'ensemble des solutions sous forme d'intervalle.

    **a)** $2x+5<11$

    **b)** $3x-4\geqslant 8$

    **c)** $-2x+7\leqslant 1$

    **d)** $5-x>12$

    **e)** $4x+1\leqslant 7x-8$

    **f)** $-5x+2>3x-14$
  corrige: |
    **a)** 
    $$2x+5<11 \iff 2x<6 \iff x<3 \qquad \boxed{S=\left]-\infty\,;3\right[}$$

    **b)** 
    $$3x-4\geqslant 8 \iff 3x\geqslant 12 \iff x\geqslant 4 \qquad \boxed{S=\left[4\,;+\infty\right[}$$

    **c)** 
    $$-2x+7\leqslant 1 \iff -2x\leqslant -6 \iff x\geqslant 3$$
     la division par $-2$ changeant le sens. $\boxed{S=\left[3\,;+\infty\right[}$

    **d)** 
    $$5-x>12 \iff -x>7 \iff x<-7 \qquad \boxed{S=\left]-\infty\,;-7\right[}$$

    **e)** 
    $$4x+1\leqslant 7x-8 \iff -3x\leqslant -9 \iff x\geqslant 3 \qquad \boxed{S=\left[3\,;+\infty\right[}$$

    **f)** 
    $$-5x+2>3x-14 \iff -8x>-16 \iff x<2 \qquad \boxed{S=\left]-\infty\,;2\right[}$$

    Les questions c), d), e) et f) exigent une division par un nombre négatif : c'est là que le sens de l'inégalité s'inverse.
- id: "s-09-04"
  feuille: "f-s-09"
  numero: 4
  partie: "Règles de base et premier degré"
  etoiles: 1
  types: [Calcul]
  mots_cles: [inéquations, signe des fonctions affines, inéquation quotient]
  noeuds: [q-ordre, ar-corps]
  notions: [corps-ordonne]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Même consigne.

    **a)** $3(x-2)\leqslant 2x+1$

    **b)** $2(3-x)>4(x+1)$

    **c)** $\dfrac{x}{2}+1\leqslant 3$

    **d)** $\dfrac{2x-1}{3}>1$

    **e)** $\dfrac{x}{3}-\dfrac{x}{4}\leqslant 1$

    **f)** $-(x+3)\geqslant 2(1-x)$
  corrige: |
    **a)** 
    $$3(x-2)\leqslant 2x+1 \iff 3x-6\leqslant 2x+1 \iff x\leqslant 7 \qquad \boxed{S=\left]-\infty\,;7\right]}$$

    **b)** 
    $$2(3-x)>4(x+1) \iff 6-2x>4x+4 \iff -6x>-2 \iff x<\frac{1}{3}$$

    $$\boxed{S=\left]-\infty\,;\frac{1}{3}\right[}$$

    **c)** 
    $$\frac{x}{2}+1\leqslant 3 \iff \frac{x}{2}\leqslant 2 \iff x\leqslant 4 \qquad \boxed{S=\left]-\infty\,;4\right]}$$

    **d)** On multiplie les deux membres par $3$, qui est positif : 
    $$\frac{2x-1}{3}>1 \iff 2x-1>3 \iff 2x>4 \iff x>2 \qquad \boxed{S=\left]2\,;+\infty\right[}$$

    **e)** On réduit au même dénominateur $12$ : 
    $$\frac{4x}{12}-\frac{3x}{12}\leqslant 1 \iff \frac{x}{12}\leqslant 1 \iff x\leqslant 12$$

    $$\boxed{S=\left]-\infty\,;12\right]}$$

    **f)** 
    $$-(x+3)\geqslant 2(1-x) \iff -x-3\geqslant 2-2x \iff x\geqslant 5 \qquad \boxed{S=\left[5\,;+\infty\right[}$$
- id: "s-09-05"
  feuille: "f-s-09"
  numero: 5
  partie: "Règles de base et premier degré"
  etoiles: 1
  types: [Calcul]
  mots_cles: [inéquations, inéquation quotient, mise en inéquation, intervalles]
  noeuds: [q-ordre, ar-corps]
  notions: [corps-ordonne, intervalle]
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Résoudre les inéquations suivantes. On donnera l'ensemble des solutions sous la forme d'un intervalle, dont les bornes seront écrites sous forme de fractions irréductibles lorsque c'est nécessaire.

    **a)** $5x-3<2x+4$

    **b)** $4x+1\geqslant 6x-4$

    **c)** $-3x+2\leqslant 4x-3$

    **d)** $7-2x>5x+1$

    **e)** $3(x-1)<5x+2$

    **f)** $\dfrac{3x+1}{4}>\dfrac{x-2}{3}$
  corrige: |
    **a)** 
    $$5x-3<2x+4 \iff 3x<7 \iff x<\frac{7}{3} \qquad \boxed{S=\left]-\infty\,;\frac{7}{3}\right[}$$

    **b)** 
    $$4x+1\geqslant 6x-4 \iff -2x\geqslant -5 \iff x\leqslant\frac{5}{2}$$
     la division par $-2$ changeant le sens. $\boxed{S=\left]-\infty\,;\frac{5}{2}\right]}$

    **c)** 
    $$-3x+2\leqslant 4x-3 \iff -7x\leqslant -5 \iff x\geqslant\frac{5}{7} \qquad \boxed{S=\left[\frac{5}{7}\,;+\infty\right[}$$

    **d)** 
    $$7-2x>5x+1 \iff -7x>-6 \iff x<\frac{6}{7} \qquad \boxed{S=\left]-\infty\,;\frac{6}{7}\right[}$$

    **e)** 
    $$3(x-1)<5x+2 \iff 3x-3<5x+2 \iff -2x<5 \iff x>-\frac{5}{2}$$

    $$\boxed{S=\left]-\frac{5}{2}\,;+\infty\right[}$$

    **f)** On multiplie les deux membres par $12$, qui est positif : 
    $$\begin{aligned} \frac{3x+1}{4}>\frac{x-2}{3} &\iff 3(3x+1)>4(x-2) \\ &\iff 9x+3>4x-8 \\ &\iff 5x>-11 \iff x>-\frac{11}{5} \end{aligned}$$

    $$\boxed{S=\left]-\frac{11}{5}\,;+\infty\right[}$$

    Une borne fractionnaire n'a rien d'inquiétant : on la laisse sous forme de fraction irréductible, ce qui est toujours plus précis qu'une valeur décimale approchée.
- id: "s-09-06"
  feuille: "f-s-09"
  numero: 6
  partie: "Règles de base et premier degré"
  etoiles: 2
  types: [Calcul]
  mots_cles: [inéquations, inéquation quotient]
  noeuds: [q-ordre, ar-corps]
  notions: [corps-ordonne]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Pour chacune des inéquations suivantes, indiquer d'abord **si le sens de l'inégalité va changer** au cours de la résolution, en justifiant, puis résoudre.

    **a)** $-2x<8$

    **b)** $x-5<-8$

    **c)** $3x>-9$

    **d)** $-\dfrac{x}{4}\geqslant 2$

    **e)** $-5<2x$

    **f)** $7-3x\leqslant 1$
  corrige: |
    Le sens change si et seulement si l'on multiplie ou divise par un nombre **strictement négatif**. Peu importe qu'un nombre négatif figure ailleurs dans l'inéquation.

    $$\begin{array}{|c||c|c|c|} \hline  & \text{Inéquation} & \text{Le sens change ?} & \text{Solutions} \\ \hline \text{a)} & -2x<8 & \text{oui, on divise par }-2 & \left]-4\,;+\infty\right[ \\ \hline \text{b)} & x-5<-8 & \text{non, on ajoute seulement }5 & \left]-\infty\,;-3\right[ \\ \hline \text{c)} & 3x>-9 & \text{non, on divise par }3>0 & \left]-3\,;+\infty\right[ \\ \hline \text{d)} & -\frac{x}{4}\geqslant 2 & \text{oui, on multiplie par }-4 & \left]-\infty\,;-8\right] \\ \hline \text{e)} & -5<2x & \text{non, on divise par }2>0 & \left]-\frac{5}{2}\,;+\infty\right[ \\ \hline \text{f)} & 7-3x\leqslant 1 & \text{oui, on divise par }-3 & \left[2\,;+\infty\right[ \\ \hline \end{array}$$

    Les cas b), c) et e) contiennent pourtant tous un nombre négatif : celui-ci se trouve simplement du mauvais côté pour avoir la moindre influence.
- id: "s-09-07"
  feuille: "f-s-09"
  numero: 7
  partie: "Règles de base et premier degré"
  etoiles: 2
  types: [Calcul]
  mots_cles: [inéquations, intervalles]
  noeuds: [q-ordre]
  notions: [corps-ordonne, intervalle]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **1.** Résoudre chacune des inéquations suivantes, donner l'ensemble des solutions sous la forme d'un intervalle, puis le représenter sur une droite graduée.

    **a)** $2x-6\geqslant 0$

    **b)** $-x+2>0$

    **c)** $3x+9\leqslant 0$

    **d)** $-4x-8<0$

    **2.** Résoudre le système suivant, c'est-à-dire déterminer les réels qui vérifient les deux inéquations *en même temps* : 
    $$\left\{\begin{array}{l} 2x+1>-3 \\ x-4\leqslant 1 \end{array}\right.$$
     On donnera l'ensemble des solutions sous forme d'intervalle et on le représentera.
  corrige: |
    **1.** **a)** $2x-6\geqslant 0 \iff x\geqslant 3$ : $\boxed{S=\left[3\,;+\infty\right[}$

    ![Figure](documents/figures/9641eef2e53a6475.svg)

    **b)** $-x+2>0 \iff -x>-2 \iff x<2$ : $\boxed{S=\left]-\infty\,;2\right[}$

    ![Figure](documents/figures/0916894e17900612.svg)

    **c)** $3x+9\leqslant 0 \iff x\leqslant -3$ : $\boxed{S=\left]-\infty\,;-3\right]}$

    ![Figure](documents/figures/ca3c8819ba73ce93.svg)

    **d)** $-4x-8<0 \iff -4x<8 \iff x>-2$ : $\boxed{S=\left]-2\,;+\infty\right[}$

    ![Figure](documents/figures/7036e280593fe1ab.svg)

    On remarquera le codage des bornes : le crochet est tourné *vers* l'intervalle lorsque la borne est incluse, et il lui *tourne le dos* lorsqu'elle est exclue. C'est exactement la convention d'écriture des intervalles.

    **2.** On résout séparément les deux inéquations : 
    $$2x+1>-3 \iff 2x>-4 \iff x>-2$$

    $$x-4\leqslant 1 \iff x\leqslant 5$$
     Les deux conditions doivent être vérifiées *simultanément* : on prend donc l'intersection des deux ensembles. 
    $$\boxed{S=\left]-2\,;5\right]}$$

    ![Figure](documents/figures/9abf435cbf1843d5.svg)
- id: "s-09-08"
  feuille: "f-s-09"
  numero: 8
  partie: "Règles de base et premier degré"
  etoiles: 2
  types: [Calcul]
  mots_cles: [mise en inéquation]
  noeuds: [q-ordre]
  notions: []
  page_enonce: 2
  page_corrige: 5
  enonce: |
    **1.** Une salle d'escalade propose deux formules. La formule $A$ coûte $15$ euros par mois, plus $0{,}50$ euro par séance. La formule $B$ coûte $30$ euros par mois, avec un nombre de séances illimité.

    **(a)** Exprimer, en fonction du nombre $n$ de séances mensuelles, le prix payé avec chacune des deux formules.

    **(b)** À partir de combien de séances par mois la formule $B$ devient-elle strictement plus avantageuse ?

    **2.** Marius a obtenu $12$ et $9$ à ses deux premiers devoirs. Quelle note minimale doit-il obtenir au troisième pour que sa moyenne atteigne au moins $12$ ?
  corrige: |
    **1.** **(a)** 
    $$\boxed{\text{Formule } A : \; 15+0{,}5\,n} \qquad ; \qquad \boxed{\text{Formule } B : \; 30}$$

    **(b)** On résout $30<15+0{,}5\,n$ : 
    $$30<15+0{,}5\,n \iff 15<0{,}5\,n \iff n>30$$
     Le nombre de séances étant un entier : 
    $$\boxed{\text{La formule } B \text{ devient plus avantageuse à partir de } 31 \text{ séances}}$$
     Pour exactement $30$ séances, les deux formules coûtent $30$ euros : elles sont équivalentes.

    **2.** En notant $n$ la note du troisième devoir : 
    $$\frac{12+9+n}{3}\geqslant 12 \iff 21+n\geqslant 36 \iff n\geqslant 15$$

    $$\boxed{\text{Marius doit obtenir au moins } 15}$$
- id: "s-09-09"
  feuille: "f-s-09"
  numero: 9
  partie: "Signe des fonctions affines"
  etoiles: 1
  types: [Calcul]
  mots_cles: [signe des fonctions affines]
  noeuds: [ar-corps]
  notions: []
  page_enonce: 2
  page_corrige: 6
  enonce: |
    Pour chacune des fonctions affines suivantes, déterminer la racine, préciser le signe du coefficient directeur, puis décrire le signe de la fonction.

    **a)** $f(x)=2x-6$

    **b)** $f(x)=-3x+12$

    **c)** $f(x)=x+5$

    **d)** $f(x)=-x-2$

    **e)** $f(x)=4x$

    **f)** $f(x)=-5x+1$
  corrige: |
    La racine s'obtient en résolvant $mx+p=0$, soit $x_{0}=-\dfrac{p}{m}$. On retient que **$f$ est du signe de $m$ après la racine**.

    ```tableau
     ¦ $f(x)$ ¦ **Racine** ¦ **Signe**
    a) ¦ $2x-6$ ¦ $3$ ¦ $m=2>0$ : négatif avant $3$, positif après
    b) ¦ $-3x+12$ ¦ $4$ ¦ $m=-3<0$ : positif avant $4$, négatif après
    c) ¦ $x+5$ ¦ $-5$ ¦ $m=1>0$ : négatif avant $-5$, positif après
    d) ¦ $-x-2$ ¦ $-2$ ¦ $m=-1<0$ : positif avant $-2$, négatif après
    e) ¦ $4x$ ¦ $0$ ¦ $m=4>0$ : négatif avant $0$, positif après
    f) ¦ $-5x+1$ ¦ $\frac{1}{5}$ ¦ $m=-5<0$ : positif avant $\frac{1}{5}$, négatif après
    ```
- id: "s-09-10"
  feuille: "f-s-09"
  numero: 10
  partie: "Signe des fonctions affines"
  etoiles: 1
  types: [Calcul]
  mots_cles: [inéquations, signe des fonctions affines, inéquation produit]
  noeuds: [q-ordre, ar-corps]
  notions: [corps-ordonne]
  page_enonce: 2
  page_corrige: 6
  enonce: |
    Dresser le tableau de signes de chacune des fonctions suivantes, puis en déduire l'ensemble des solutions de l'inéquation indiquée.

    **1.** $f(x)=3x-9$ ; résoudre $f(x)\geqslant 0$

    **2.** $g(x)=-2x+5$ ; résoudre $g(x)<0$

    **3.** $h(x)=5x+15$ ; résoudre $h(x)\leqslant 0$

    **4.** $k(x)=-x+7$ ; résoudre $k(x)>0$
  corrige: |
    **1.** $3x-9$ s'annule en $3$, avec $m=3>0$.

    ![Figure](documents/figures/13b985deeae136a1.svg)

    $$\boxed{f(x)\geqslant 0 \iff S=\left[3\,;+\infty\right[}$$

    **2.** $-2x+5$ s'annule en $\dfrac{5}{2}$, avec $m=-2<0$.

    ![Figure](documents/figures/6d972ea5796e6495.svg)

    $$\boxed{g(x)<0 \iff S=\left]\frac{5}{2}\,;+\infty\right[}$$

    **3.** $5x+15$ s'annule en $-3$, avec $m=5>0$.

    ![Figure](documents/figures/4896280a1c2b5b72.svg)

    $$\boxed{h(x)\leqslant 0 \iff S=\left]-\infty\,;-3\right]}$$

    **4.** $-x+7$ s'annule en $7$, avec $m=-1<0$.

    ![Figure](documents/figures/b02543112d5b7b6d.svg)

    $$\boxed{k(x)>0 \iff S=\left]-\infty\,;7\right[}$$
- id: "s-09-11"
  feuille: "f-s-09"
  numero: 11
  partie: "Signe des fonctions affines"
  etoiles: 2
  types: [Lecture graphique, Calcul]
  mots_cles: [inéquations, signe des fonctions affines, inéquation produit]
  noeuds: [q-ordre, ar-corps]
  notions: [corps-ordonne]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Sur le graphique ci-dessous sont tracées les droites représentatives de deux fonctions affines $f$ et $g$.

    ![Figure](documents/figures/fac17f1c2e4c8431.svg)

    **1.** Lire graphiquement la racine de $f$, puis celle de $g$.

    **2.** En déduire le tableau de signes de $f$, puis celui de $g$.

    **3.** Résoudre graphiquement l'inéquation $f(x)\geqslant 0$, puis $g(x)<0$.

    **4.** Lire les coordonnées du point marqué en rouge. Que représente-t-il ?

    **5.** Résoudre graphiquement l'inéquation $f(x)\geqslant g(x)$.

    **6.** Déterminer les expressions de $f(x)$ et de $g(x)$, puis retrouver le résultat de la question 5 par le calcul.
  corrige: |
    **1.** On lit l'abscisse du point où chaque droite coupe l'axe des abscisses : 
    $$\boxed{\text{racine de } f : 2} \qquad ; \qquad \boxed{\text{racine de } g : -1}$$

    **2.** La droite $\mathcal{C}_{f}$ monte, donc $f$ est négative avant sa racine et positive après. La droite $\mathcal{C}_{g}$ descend, donc $g$ est positive avant, négative après.

    ![Figure](documents/figures/76055bea840cb0b0.svg)

    ![Figure](documents/figures/23ce7fb6a7da2e6c.svg)

    **3.** 
    $$\boxed{f(x)\geqslant 0 \iff S=\left[2\,;+\infty\right[} \qquad ; \qquad \boxed{g(x)<0 \iff S=\left]-1\,;+\infty\right[}$$

    **4.** Le point marqué a pour coordonnées $(0\,;-2)$ : 
    $$\boxed{\text{C'est le point d'intersection des deux droites}}$$
     Son abscisse est la valeur de $x$ pour laquelle $f(x)=g(x)$.

    **5.** $\mathcal{C}_{f}$ est au-dessus de $\mathcal{C}_{g}$ à droite du point d'intersection : 
    $$\boxed{f(x)\geqslant g(x) \iff S=\left[0\,;+\infty\right[}$$

    **6.** La droite $\mathcal{C}_{f}$ passe par $(2\,;0)$ et $(0\,;-2)$ : son ordonnée à l'origine vaut $-2$ et son coefficient directeur $1$. La droite $\mathcal{C}_{g}$ passe par $(-1\,;0)$ et $(0\,;-2)$ : son ordonnée à l'origine vaut $-2$ et son coefficient directeur $-2$. 
    $$\boxed{f(x)=x-2} \qquad ; \qquad \boxed{g(x)=-2x-2}$$
     On résout alors : 
    $$f(x)-g(x)=(x-2)-(-2x-2)=x-2+2x+2=3x$$

    $$f(x)\geqslant g(x) \iff 3x\geqslant 0 \iff x\geqslant 0$$
     Le calcul confirme la lecture graphique.
