  enonce: |
    Soit $m$ un nombre réel. On considère la fonction $f_{m}$ définie sur $\mathbb{R}$ par : 
    $$f_{m}(x)=(x-m)(x+2)$$

    **1.** Déterminer les racines de $f_{m}$ en fonction de $m$.

    **2.** Résoudre l'inéquation $f_{m}(x)\leqslant 0$ dans le cas où $m=3$, puis dans le cas où $m=-5$.

    **3.** Que se passe-t-il lorsque $m=-2$ ? Résoudre alors l'inéquation.

    **4.** Résoudre l'inéquation $f_{m}(x)\leqslant 0$ dans le cas général, en distinguant les trois situations possibles selon la position de $m$ par rapport à $-2$.

    **5.** Pour quelle valeur de $m$ l'inéquation $f_{m}(x)\leqslant 0$ admet-elle exactement une solution ?
  corrige: |
    **1.** Un produit est nul si et seulement si l'un de ses facteurs l'est : 
    $$\boxed{\text{Les racines de } f_{m} \text{ sont } m \text{ et } -2}$$

    **2.** Cas $m=3$. Les racines sont $3$ et $-2$, avec $-2<3$.

    ![Figure](documents/figures/3b42b3f2bb09832d.svg)

    $$\boxed{S=\left[-2\,;3\right]}$$

    Cas $m=-5$. Les racines sont $-5$ et $-2$, avec cette fois $-5<-2$.

    ![Figure](documents/figures/6254f334c935f96a.svg)

    $$\boxed{S=\left[-5\,;-2\right]}$$

    **3.** Lorsque $m=-2$, les deux racines se confondent et l'expression devient un carré : 
    $$f_{-2}(x)=(x+2)(x+2)=(x+2)^{2}$$
     Un carré étant toujours positif ou nul, l'inéquation $(x+2)^{2}\leqslant 0$ n'est vérifiée que lorsque le carré est nul : 
    $$\boxed{S=\{-2\}}$$

    **4.** On distingue trois situations selon la position de $m$ par rapport à $-2$. Dans tous les cas, les deux facteurs ont un coefficient directeur positif, donc le produit est négatif *entre* les racines. 
    $$\boxed{\begin{array}{ll} \text{si } m>-2 & : \; S=\left[-2\,;m\right] \\[1mm] \text{si } m=-2 & : \; S=\{-2\} \\[1mm] \text{si } m<-2 & : \; S=\left[m\,;-2\right] \end{array}}$$
     On peut résumer les trois cas d'une seule phrase : $S$ est l'intervalle fermé dont les bornes sont $m$ et $-2$, rangées dans l'ordre croissant.

    **5.** L'ensemble des solutions se réduit à un unique élément lorsque les deux bornes se confondent : 
    $$\boxed{m=-2}$$

