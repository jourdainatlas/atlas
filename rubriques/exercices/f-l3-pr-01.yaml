    Les trois lois limites du nombre de particules d'un niveau, pour $\lambda = 0{,}8$ particule par niveau en moyenne. L'indiscernabilité (ii) favorise les niveaux vides et les niveaux très peuplés par rapport au cas classique (i) ; l'exclusion (iii) interdit plus d'une particule.

    **5.** (i) Par la question 4 de l'exercice 17 (avec $m = r$ boules et $n$ boîtes), les états ayant au moins un niveau vide sont au nombre de $\sum_{k = 1}^{n}(-1)^{k - 1}\binom{n}{k}(n - k)^{r}$. (ii) Les états sans niveau vide correspondent, par $r_{i} \mapsto r_{i} - 1$, aux $n$-uplets positifs de somme $r - n$ : il y en a $\binom{r - 1}{n - 1}$ (exercice 6, question 5 (d)), d'où $\binom{n + r - 1}{n - 1} - \binom{r - 1}{n - 1}$ états avec un niveau vide.

    **6.** Dans le modèle (i), avec $n = 5$ secrétaires et $r$ messages, 
    $$\mathbb{P}(\text{chacune reçoit un message}) = \sum_{k = 0}^{5}(-1)^{k}\binom{5}{k}\Big(1 - \frac{k}{5}\Big)^{r},$$
     qui vaut $0{,}038$ pour $r = 5$, $0{,}115$ pour $r = 6$, et $0{,}52$ pour $r = 10$. Pour les anniversaires, les $r$ personnes sont les particules et les $365$ dates les niveaux : les dates sont toutes distinctes dans $\frac{365!}{(365 - r)!}$ états sur $365^{r}$, et 
    $$\mathbb{P}(\text{au moins deux anniversaires communs}) = 1 - \prod_{j = 0}^{r - 1}\Big(1 - \frac{j}{365}\Big),$$
     qui dépasse $\frac{1}{2}$ dès $\boxed{r = 23}$ ($0{,}507$), comme dans le cours.

