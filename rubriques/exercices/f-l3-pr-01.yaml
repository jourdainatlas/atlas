  source: "Bordeaux, DM 1, exercice 1 B ; Durand, exercices 1.36 et 1.25 (1)"
  page_enonce: 4
  page_corrige: 9
  enonce: |
    On lance cinq dés. Après avoir décrit le modèle choisi, calculer la probabilité d'obtenir :

    **1.** au moins deux faces identiques ; exactement deux faces identiques, les trois autres étant différentes entre elles et des deux premières ; exactement deux fois deux faces identiques ;

    **2.** deux six, deux trois et un quatre.

    **3.** Avec quatre dés seulement, quelle est la probabilité d'obtenir deux six et deux trois ?
  corrige: |
    On prend $\Omega = \llbracket 1, 6 \rrbracket^{5}$, de cardinal $6^{5} = 7\,776$, muni de la probabilité uniforme.

    **1.** Les résultats tous différents sont les arrangements de $5$ valeurs parmi $6$, au nombre de $720$ : $\mathbb{P}(\text{au moins deux faces identiques}) = 1 - \frac{720}{7\,776} = \boxed{\frac{49}{54}}$.

    Exactement une paire : on choisit la valeur de la paire ($6$), ses deux places ($\binom{5}{2} = 10$), puis les trois autres valeurs, distinctes, dans l'ordre ($5 \times 4 \times 3$) : $3\,600$ issues, d'où $\boxed{\frac{25}{54}}$.

    Exactement deux paires : on choisit les deux valeurs des paires ($\binom{6}{2} = 15$), la valeur restante ($4$), puis la disposition des cinq dés ($\frac{5!}{2!\,2!\,1!} = 30$) : $1\,800$ issues, d'où $\boxed{\frac{25}{108}}$.

    **2.** Les issues favorables sont les dispositions de $6, 6, 3, 3, 4$ : $\frac{5!}{2!\,2!\,1!} = 30$, d'où $\boxed{\frac{30}{7\,776} = \frac{5}{1\,296}}$.

    **3.** Avec quatre dés, les dispositions de $6, 6, 3, 3$ sont au nombre de $\frac{4!}{2!\,2!} = 6$ : $\boxed{\frac{6}{1\,296} = \frac{1}{216}}$.
