  enonce: |
    **1.** Un sac contient $n \geqslant 3$ jetons numérotés de $1$ à $n$. Jean en prend un au hasard, puis passe le sac à Luc, qui en prend un à son tour, puis à Marc, qui en prend un.

    **(a)** Munir $\Omega = \llbracket 1, n \rrbracket^{3}$ d'une probabilité qui rende compte de cette expérience.

    **(b)** Soit $k \in \llbracket 1, n \rrbracket$. Quelle est la probabilité que Marc tire le numéro $k$ ? Commenter.

    **(c)** Quelle est la probabilité que Marc obtienne un numéro supérieur à ceux de Jean et de Luc ?

    **2.** On range au hasard $n \geqslant 2$ livres côte à côte sur une étagère ; $k \in \llbracket 2, n \rrbracket$ d'entre eux sont d'un même auteur.

    **(a)** Proposer un codage, par des $0$ et des $1$, de la place des livres de cet auteur.

    **(b)** Quelle est la probabilité que ses livres soient tous côte à côte ? tous parmi les $r$ premiers ($r \geqslant k$) ?

    **(c)** Soit $\ell \in \llbracket k - 2, n - 2 \rrbracket$. Quelle est la probabilité qu'il y ait $\ell$ livres entre le plus à gauche et le plus à droite des livres de l'auteur ? Pour $k = 2$, quel est le nombre de livres le plus probable entre eux ?

    **3.** Une urne contient deux boules de chacune de trois couleurs. On les tire toutes, une à une, sans remise. Quelle est la probabilité que les deux boules de chaque couleur soient tirées consécutivement ?

    **4.** Cinq incidents sont attribués au hasard, indépendamment, à trois coursiers. Quelle est la probabilité qu'exactement trois incidents concernent un même coursier ?
  corrige: |
    **1. (a)** On donne la probabilité $\frac{1}{n(n - 1)(n - 2)}$ à chaque triplet de numéros distincts, et $0$ aux autres : chaque joueur prend au hasard l'un des jetons restants, ce qui rend les arrangements équiprobables (cours, prop. 7).

    **(b)** Les triplets avec Marc égal à $k$ sont obtenus en choisissant les numéros de Jean et Luc parmi les $n - 1$ autres, dans l'ordre : $(n - 1)(n - 2)$ triplets, d'où $\boxed{\mathbb{P}(\text{Marc tire } k) = \frac{1}{n}}$. Être le troisième à tirer ne change rien : la loi du jeton de Marc est uniforme, comme celle de Jean.

    **(c)** Les trois numéros sont distincts ; parmi les $6$ ordres possibles d'un ensemble de trois numéros, qui sont équiprobables, $2$ placent le plus grand chez Marc : $\boxed{\frac{1}{3}}$.

    **2. (a)** On code l'étagère par le mot $(\varepsilon_{1}, \dots, \varepsilon_{n})$, où $\varepsilon_{i} = 1$ si le $i$-ième livre est de l'auteur. Tous les ordres des $n$ livres étant équiprobables, l'ensemble des places de ses livres est une partie à $k$ éléments uniforme de $\llbracket 1, n \rrbracket$ : chaque mot à $k$ chiffres $1$ a la probabilité $\binom{n}{k}^{-1}$.

    **(b)** Les livres sont côte à côte si les $1$ forment un bloc, qui commence à l'une des places $1$, …, $n - k + 1$ : $\boxed{\frac{n - k + 1}{\binom{n}{k}}}$. Ils sont tous parmi les $r$ premiers si les $1$ sont dans $\llbracket 1, r \rrbracket$ : $\boxed{\frac{\binom{r}{k}}{\binom{n}{k}}}$.

    **(c)** Il y a $\ell$ livres entre le premier et le dernier de l'auteur si les places extrêmes sont $a$ et $a + \ell + 1$, avec $1 \leqslant a \leqslant n - \ell - 1$, et si les $k - 2$ autres sont parmi les $\ell$ places intermédiaires : $\boxed{\frac{(n - \ell - 1)\binom{\ell}{k - 2}}{\binom{n}{k}}}$. Pour $k = 2$, cette probabilité vaut $\frac{n - \ell - 1}{\binom{n}{2}}$ ; elle décroît avec $\ell$, et la valeur la plus probable est $\ell = 0$ : les deux livres côte à côte, avec la probabilité $\frac{2}{n}$.

    **3.** Seules comptent les couleurs : les $\frac{6!}{2!\,2!\,2!} = 90$ suites de couleurs sont équiprobables, et celles où chaque couleur forme un bloc correspondent aux $3! = 6$ ordres des couleurs : $\boxed{\frac{1}{15}}$.

    **4.** On prend $\Omega = \llbracket 1, 3 \rrbracket^{5}$, uniforme, $243$ issues. On choisit le coursier qui reçoit trois incidents ($3$), ces incidents ($\binom{5}{3} = 10$), puis l'attribution des deux autres aux deux autres coursiers ($2^{2}$) : $\boxed{\frac{120}{243} = \frac{40}{81}}$.
- id: "l3-pr-01-17"
  feuille: "f-l3-pr-01"
  numero: 17
  partie: "Formule de Poincaré, occupation"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [formule de Poincaré]
  noeuds: [p-espace, m-mesures, pol-binome]
  notions: [probabilite, coefficient-binomial]
  source: "Bordeaux, TD 1, exercice 7 ; Durand, exercice 1.5"
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Soit $A_{1}$, …, $A_{n}$ des évènements.

    **1.** Développer $\prod_{i = 1}^{n}(1 - \mathbf{1}_{A_{i}})$ en regroupant les termes par nombre de facteurs, et en déduire une nouvelle démonstration de la formule de Poincaré du cours. Si $\mathbb{P}(A_{i_{1}} \cap \cdots \cap A_{i_{k}})$ ne dépend que de $k$, montrer que 
    $$\mathbb{P}(A_{1} \cup \cdots \cup A_{n}) = \sum_{k = 1}^{n}(-1)^{k - 1}\binom{n}{k}\mathbb{P}(A_{1} \cap \cdots \cap A_{k}).$$

    **2.** *(Marins ivres.)* Les $n$ marins d'un bateau regagnent de nuit leurs $n$ hamacs, chacun choisissant au hasard, ce qui revient à tirer une permutation uniforme. Le cours calcule la probabilité qu'aucun ne dorme dans son hamac. Pour $k \in \llbracket 0, n \rrbracket$, calculer la probabilité qu'exactement $k$ marins dorment dans leur hamac, et sa limite quand $n \to +\infty$. Reconnaître une loi usuelle.

    **3.** On redistribue maintenant au hasard les cannes et les chapeaux de $n$ personnes, par deux permutations uniformes indépendantes. Quelle est la probabilité qu'aucune ne retrouve à la fois sa canne et son chapeau ? sa limite ?

    **4.** On place $m \geqslant 1$ boules au hasard, indépendamment, dans $n \geqslant 1$ boîtes. Quelle est la probabilité qu'une boîte donnée soit vide ? qu'au moins une boîte soit vide ? que toutes soient occupées ?

    **5.** Combien de mots de longueur $p \geqslant 4$ sur l'alphabet $\{A, C, G, T\}$ contiennent les quatre lettres ?

    **6.** $n$ voyageurs choisissent indépendamment un wagon parmi $n$, le wagon $i$ avec la probabilité $p_{i}$. Calculer la probabilité qu'ils soient tous dans des wagons différents, et montrer qu'elle est maximale lorsque $p_{i} = \frac{1}{n}$ pour tout $i$.
  corrige: |
    **1.** Par la question 5 de l'exercice 2, $\prod_{i}(1 - \mathbf{1}_{A_{i}}) = \mathbf{1}_{\overline{A_{1}} \cap \cdots \cap \overline{A_{n}}} = 1 - \mathbf{1}_{A_{1} \cup \cdots \cup A_{n}}$. En développant le produit, 
    $$\prod_{i = 1}^{n}(1 - \mathbf{1}_{A_{i}}) = \sum_{k = 0}^{n}(-1)^{k}\sum_{i_{1} < \cdots < i_{k}}\mathbf{1}_{A_{i_{1}}}\cdots\mathbf{1}_{A_{i_{k}}} = 1 + \sum_{k = 1}^{n}(-1)^{k}\sum_{i_{1} < \cdots < i_{k}}\mathbf{1}_{A_{i_{1}} \cap \cdots \cap A_{i_{k}}},$$
     d'où $\mathbf{1}_{\bigcup A_{i}} = \sum_{k = 1}^{n}(-1)^{k - 1}\sum_{i_{1} < \cdots < i_{k}}\mathbf{1}_{A_{i_{1}} \cap \cdots \cap A_{i_{k}}}$.

    Pour passer aux probabilités sans la notion d'espérance (chapitre 3), on utilise les $2^{n}$ atomes $C_{\varepsilon} = A_{1}^{\varepsilon_{1}} \cap \cdots \cap A_{n}^{\varepsilon_{n}}$ ($A^{1} = A$, $A^{0} = \overline{A}$), qui partitionnent $\Omega$. Chaque évènement $E$ qui apparaît est une réunion d'atomes, et $\mathbf{1}_{E}$ est constante sur chaque atome ; donc $\mathbb{P}(E) = \sum_{\varepsilon}\mathbf{1}_{E}(C_{\varepsilon})\mathbb{P}(C_{\varepsilon})$, par additivité. En multipliant l'identité par $\mathbb{P}(C_{\varepsilon})$ et en sommant sur les atomes, on obtient la formule de Poincaré.

    Si $\mathbb{P}(A_{i_{1}} \cap \cdots \cap A_{i_{k}})$ ne dépend que de $k$, chaque somme intérieure compte $\binom{n}{k}$ termes égaux à $\mathbb{P}(A_{1} \cap \cdots \cap A_{k})$ : c'est la formule simplifiée.

    **2.** Soit $D_{m}$ le nombre de permutations de $m$ éléments sans point fixe ; le cours établit 
    $$\frac{D_{m}}{m!} = \sum_{j = 0}^{m}\frac{(-1)^{j}}{j!}.$$
     Une permutation à exactement $k$ points fixes est déterminée par l'ensemble de ses points fixes ($\binom{n}{k}$ choix) et par une permutation sans point fixe des $n - k$ autres. Donc 
    $$\mathbb{P}(X_{n} = k) = \frac{\binom{n}{k}D_{n - k}}{n!} = \frac{1}{k!}\sum_{j = 0}^{n - k}\frac{(-1)^{j}}{j!} \xrightarrow[n \to +\infty]{} \boxed{\frac{\mathrm{e}^{-1}}{k!}}.$$
     La limite est la loi de Poisson de paramètre $1$ (cours, section 1.5).

    1.5em

    ![Figure](documents/figures/e39bf9850e57afa9.svg)

    La loi du nombre de marins qui dorment dans leur hamac, pour $n = 5$ ($\frac{11}{30}$, $\frac{3}{8}$, $\frac{1}{6}$, $\frac{1}{12}$, $0$, $\frac{1}{120}$), et la loi de Poisson de paramètre $1$. Dès $n = 5$, les deux lois sont très proches ; la valeur $k = n - 1$ est impossible, car $n - 1$ points fixes forcent le dernier.

    **3.** Soit $A_{i}$ l'évènement « la personne $i$ retrouve sa canne et son chapeau ». Pour $k$ personnes données, la probabilité que les deux permutations les fixent toutes est $\big(\frac{(n - k)!}{n!}\big)^{2}$, par indépendance. La formule simplifiée donne 
    $$\mathbb{P}(\text{personne ne retrouve les deux}) = \sum_{k = 0}^{n}(-1)^{k}\binom{n}{k}\Big(\frac{(n - k)!}{n!}\Big)^{2} = \boxed{\sum_{k = 0}^{n}\frac{(-1)^{k}}{k!}\,\frac{(n - k)!}{n!}}.$$
     Pour $k \geqslant 1$, $\frac{(n - k)!}{n!} \leqslant \frac{1}{n}$, et la somme des termes $k \geqslant 1$ est majorée en valeur absolue par $\frac{\mathrm{e} - 1}{n}$ : la probabilité tend vers $\boxed{1}$ (elle vaut $0{,}75$ pour $n = 2$ et $0{,}905$ pour $n = 10$). Retrouver à la fois sa canne et son chapeau est bien plus rare que retrouver l'un des deux.

    **4.** On prend $\Omega = \llbracket 1, n \rrbracket^{m}$, uniforme. Une boîte donnée est vide si les $m$ boules sont dans les $n - 1$ autres : $\big(1 - \frac{1}{n}\big)^{m}$. Pour $k$ boîtes données, $\big(1 - \frac{k}{n}\big)^{m}$, et la formule simplifiée donne 
    $$\mathbb{P}(\text{au moins une boîte vide}) = \sum_{k = 1}^{n}(-1)^{k - 1}\binom{n}{k}\Big(1 - \frac{k}{n}\Big)^{m},$$

    $$\mathbb{P}(\text{toutes occupées}) = \sum_{k = 0}^{n}(-1)^{k}\binom{n}{k}\Big(1 - \frac{k}{n}\Big)^{m}.$$
     La seconde est nulle si $m < n$, et vaut $\frac{n!}{n^{n}}$ si $m = n$ : c'est une identité non évidente sur les coefficients binomiaux. On calculera l'espérance et la variance du nombre de boîtes vides à la feuille 3.

    **5.** D'après la question 4 avec $n = 4$ boîtes (les lettres) et $m = p$ boules (les places), le nombre de mots surjectifs est $\boxed{4^{p} - 4 \cdot 3^{p} + 6 \cdot 2^{p} - 4}$, soit $24$, $240$ et $1\,560$ pour $p = 4$, $5$ et $6$.

    **6.** Les voyageurs sont dans des wagons distincts si leurs choix forment une permutation $\sigma$ des wagons ; chacune a la probabilité $p_{\sigma(1)}\cdots p_{\sigma(n)} = p_{1}\cdots p_{n}$, d'où $\boxed{n!\,p_{1}\cdots p_{n}}$. Par l'inégalité arithmético-géométrique, $(p_{1}\cdots p_{n})^{1/n} \leqslant \frac{p_{1} + \cdots + p_{n}}{n} = \frac{1}{n}$, avec égalité si et seulement si les $p_{i}$ sont égaux : le maximum $\frac{n!}{n^{n}}$ est atteint pour le choix uniforme.
