  enonce: |
    Dans un jeu de tarot, on isole les $21$ atouts, numérotés de $1$ à $21$, puis on en choisit trois au hasard.

    **1.** Calculer la probabilité d'obtenir parmi ces trois atouts :

    **(a)** le $1$ ou le $21$ ;

    **(b)** au moins un multiple de cinq ;

    **(c)** au plus deux multiples de cinq ;

    **(d)** exactement un multiple de cinq et un multiple de quatre.

    **2.** Reprendre l'exercice lorsque les trois atouts sont tirés successivement avec remise.
  corrige: |
    **1.** On prend pour $\Omega$ les parties à trois éléments de $\llbracket 1, 21 \rrbracket$, $\operatorname{card}\Omega = \binom{21}{3} = 1\,330$, avec la probabilité uniforme. Les multiples de $5$ sont $5, 10, 15, 20$ ; ceux de $4$ sont $4, 8, 12, 16, 20$ ; et $13$ atouts ne sont multiples ni de $4$ ni de $5$.

    (a) Les tirages sans le $1$ ni le $21$ sont $\binom{19}{3} = 969$ : $1 - \frac{969}{1\,330} = \boxed{\frac{19}{70}}$.

    (b) Sans multiple de $5$ : $\binom{17}{3} = 680$ tirages, d'où $\boxed{\frac{65}{133}}$.

    (c) Le contraire est « trois multiples de $5$ », $\binom{4}{3} = 4$ tirages : $\boxed{\frac{663}{665}}$.

    (d) On compte les mains contenant exactement un multiple de $5$ et exactement un multiple de $4$. Si le $20$ en fait partie, il est l'un et l'autre, et les deux autres atouts sont pris parmi les $13$ qui ne sont multiples ni de $4$ ni de $5$ : $\binom{13}{2} = 78$ mains. Sinon, on prend un atout parmi $5, 10, 15$, un parmi $4, 8, 12, 16$, et un parmi les $13$ autres : $3 \times 4 \times 13 = 156$ mains. Au total $\boxed{\frac{234}{1\,330} = \frac{117}{665}}$.

    **2.** Avec remise, $\Omega = \llbracket 1, 21 \rrbracket^{3}$, de cardinal $9\,261$, uniforme. On trouve de même 
    $$1 - \Big(\frac{19}{21}\Big)^{3} = \frac{2\,402}{9\,261}, \qquad 1 - \Big(\frac{17}{21}\Big)^{3} = \frac{4\,348}{9\,261}, \qquad 1 - \Big(\frac{4}{21}\Big)^{3} = \frac{9\,197}{9\,261},$$
     et pour (d), $3 \times 13^{2} = 507$ triplets contenant une seule fois le $20$ et deux atouts ni multiples de $4$ ni de $5$, plus $3! \times 3 \times 4 \times 13 = 936$ triplets sans $20$, soit $\frac{1\,443}{9\,261} = \frac{481}{3\,087}$. Les probabilités changent peu ; le tirage avec remise rend les répétitions possibles et augmente légèrement la probabilité de (c).
