  enonce: |
    **1.** Un tournoi à élimination directe réunit $n \geqslant 1$ joueurs, un joueur pouvant être exempté à chaque tour. Combien de matchs sont joués ? *On pourra compter les perdants.*

    **2.** Durant un mois de trente jours, $a_{i}$ jours ont vu passer $i$ voitures à un péage entre 7 h et 8 h. Exprimer le nombre moyen de voitures par jour en fonction des $a_{i}$.

    **3.** Soit $E \subset \Omega$, avec $\Omega$ fini. Calculer $\sum_{x \in \Omega}\mathbf{1}_{E}(x)$. Si $f$ est une fonction réelle sur $\Omega$, d'image $F$, montrer que $f = \sum_{a \in F}a\,\mathbf{1}_{f^{-1}(\{a\})}$.

    **4.** Justifier que l'on peut intervertir les sommations d'une famille finie $(x_{ij})_{(i, j) \in I \times J}$. Intervertir les sommations dans 
    $$S_{1} = \sum_{i = 0}^{n}\sum_{j = i}^{n}x_{ij}, \qquad S_{2} = \sum_{i = 0}^{n}\sum_{j = 0}^{n - i}x_{ij}, \qquad S_{3} = \sum_{i = 0}^{m}\sum_{j = i}^{n}x_{ij} \quad (0 \leqslant m \leqslant n).$$
  corrige: |
    **1.** Chaque match élimine exactement un joueur, et le tournoi s'arrête quand il ne reste qu'un joueur : $\boxed{n - 1 \text{ matchs}}$, quelles que soient les exemptions.

    **2.** Le nombre total de voitures est $\sum_{i}i\,a_{i}$ et $\sum_{i}a_{i} = 30$ : la moyenne quotidienne est $\frac{1}{30}\sum_{i}i\,a_{i}$. C'est l'espérance de la loi qui donne la masse $\frac{a_{i}}{30}$ à la valeur $i$ (chapitre 3).

    **3.** $\sum_{x \in \Omega}\mathbf{1}_{E}(x) = \operatorname{card} E$. Si $x \in \Omega$, le seul terme non nul de $\sum_{a \in F}a\,\mathbf{1}_{f^{-1}(\{a\})}(x)$ est celui de $a = f(x)$, qui vaut $f(x)$ : c'est l'écriture d'une fonction *étagée*, qui servira pour l'espérance.

    **4.** Les deux sommes itérées sont des réarrangements de la somme finie des $x_{ij}$, qui ne dépend pas de l'ordre des termes (commutativité et associativité de l'addition). On décrit le domaine de sommation par l'autre variable : 
    $$S_{1} = \sum_{j = 0}^{n}\sum_{i = 0}^{j}x_{ij}, \qquad S_{2} = \sum_{j = 0}^{n}\sum_{i = 0}^{n - j}x_{ij}, \qquad S_{3} = \sum_{j = 0}^{n}\sum_{i = 0}^{\min(j, m)}x_{ij}.$$
     Les domaines de sommation sont respectivement $\{0 \leqslant i \leqslant j \leqslant n\}$, le triangle $\{i + j \leqslant n\}$, et $\{0 \leqslant i \leqslant m, \ i \leqslant j \leqslant n\}$.
- id: "l3-pr-01-09"
  feuille: "f-l3-pr-01"
