- id: "l3-pr-01-01"
  feuille: "f-l3-pr-01"
  numero: 1
  partie: "Évènements, tribus"
  etoiles: 1
  types: [Calcul]
  mots_cles: [évènements et tribus]
  noeuds: [p-espace, m-tribus]
  notions: [tribu, tribu-engendree, espace-probabilise]
  source: "Bordeaux, L3 Probabilités 2015-2016, TD 1, exercice 1 ; Durand (Orsay), exercice 1.27"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $A$, $B$, $C$ trois évènements. Exprimer chacun des évènements suivants à l'aide de réunions, d'intersections et de passages au contraire, puis écrire l'évènement contraire de chacun d'eux sous une forme aussi simple que possible :

    **1.** seul $A$ s'est produit ;

    **2.** $A$ et $B$ se sont produits, mais pas $C$ ;

    **3.** les trois évènements se sont produits ;

    **4.** aucun des trois ne s'est produit ;

    **5.** au moins un des trois s'est produit ;

    **6.** au moins deux se sont produits ;

    **7.** au plus un s'est produit ;

    **8.** exactement deux se sont produits ;

    **9.** au plus deux se sont produits.
  corrige: |
    On note $\overline{A}$ le contraire de $A$ et l'on omet le signe $\cap$ quand c'est commode. Les huit « atomes » $ABC$, $AB\overline{C}$, …, $\overline{A}\overline{B}\overline{C}$ forment une partition de $\Omega$, et chaque évènement de la liste est une réunion d'atomes.

    **1.** Seul $A$ : $A \cap \overline{B} \cap \overline{C}$ ; contraire : $\overline{A} \cup B \cup C$.

    **2.** $A$ et $B$ mais pas $C$ : $A \cap B \cap \overline{C}$ ; contraire : $\overline{A} \cup \overline{B} \cup C$.

    **3.** Les trois : $A \cap B \cap C$ ; contraire : $\overline{A} \cup \overline{B} \cup \overline{C}$ (au moins un ne s'est pas produit).

    **4.** Aucun : $\overline{A} \cap \overline{B} \cap \overline{C} = \overline{A \cup B \cup C}$ ; contraire : $A \cup B \cup C$.

    **5.** Au moins un : $A \cup B \cup C$ ; contraire : aucun.

    **6.** Au moins deux : $D_{2} = (A \cap B) \cup (A \cap C) \cup (B \cap C)$ ; contraire : au plus un, c'est-à-dire $(\overline{A} \cap \overline{B}) \cup (\overline{A} \cap \overline{C}) \cup (\overline{B} \cap \overline{C})$, par De Morgan.

    **7.** Au plus un : $(\overline{A} \cap \overline{B}) \cup (\overline{A} \cap \overline{C}) \cup (\overline{B} \cap \overline{C})$ ; contraire : au moins deux, $D_{2}$.

    **8.** Exactement deux : $(A \cap B \cap \overline{C}) \cup (A \cap \overline{B} \cap C) \cup (\overline{A} \cap B \cap C)$, c'est-à-dire $D_{2} \cap \overline{A \cap B \cap C}$ ; contraire : $\overline{D_{2}} \cup (A \cap B \cap C)$, « au plus un, ou les trois ».

    **9.** Au plus deux : $\overline{A \cap B \cap C} = \overline{A} \cup \overline{B} \cup \overline{C}$ ; contraire : les trois.

    1.5em

    ![Figure](documents/figures/5d41553dd6179224.svg)

    Les sept régions intérieures et la région extérieure sont les huit atomes. Les trois lentilles, sans le centre, forment « exactement deux » ; avec le centre, « au moins deux ». Le contraire de « au moins deux » est la réunion des trois croissants extérieurs et de la région hors des disques : « au plus un ».
- id: "l3-pr-01-02"
  feuille: "f-l3-pr-01"
  numero: 2
  partie: "Évènements, tribus"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [évènements et tribus]
  noeuds: [p-espace, m-tribus]
  notions: [tribu, tribu-engendree, espace-probabilise]
  source: "Durand, exercices 1.42, 1.43, 1.28"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Soit $E$, $F$, $G$ des parties de $\Omega$ et $(A_{i})_{i \in I}$ une famille de parties de $\Omega$. Établir les identités 
    $$\Big(\bigcup_{i \in I}A_{i}\Big) \cap B = \bigcup_{i \in I}(A_{i} \cap B), \qquad \overline{\bigcup_{i \in I}A_{i}} = \bigcap_{i \in I}\overline{A_{i}}, \qquad F = (F \cap E) \cup (F \cap \overline{E}), \qquad E \cup F = E \cup (F \cap \overline{E}),$$
     et les traduire en langage d'évènements.

    **2.** Montrer que les parties $E_{r} = \{(p, q) \in \mathbb{N}^{2} \,;\, p + q = r\}$, $r \in \mathbb{N}$, forment une partition de $\mathbb{N}^{2}$, et que les fibres non vides $f^{-1}(\{y\})$ d'une application $f : E \to F$ forment une partition de $E$.

    **3.** Soit $A_{1}$, …, $A_{n}$ des parties de $\Omega$. Construire des parties $B_{1}$, …, $B_{n}$ deux à deux disjointes telles que $B_{1} \cup \cdots \cup B_{m} = A_{1} \cup \cdots \cup A_{m}$ pour tout $m \leqslant n$.

    **4.** Soit $f : E \to F$. Montrer que $f(A \cup B) = f(A) \cup f(B)$, $f(A \cap B) \subset f(A) \cap f(B)$, $A \subset f^{-1}(f(A))$ et $f(f^{-1}(C)) \subset C$, et donner des exemples où les inclusions sont strictes. Montrer que l'image réciproque préserve les réunions, les intersections et les complémentaires.

    **5.** Exprimer $\mathbf{1}_{\overline{A}}$, $\mathbf{1}_{A \cap B}$, $\mathbf{1}_{A \cup B}$, $\mathbf{1}_{A \times B}$ et $\mathbf{1}_{C} \circ f$ à l'aide de $\mathbf{1}_{A}$, $\mathbf{1}_{B}$ et $\mathbf{1}_{f^{-1}(C)}$, et caractériser l'inclusion $A \subset B$ par les indicatrices.
  corrige: |
    **1.** Un élément $x$ appartient à $(\bigcup_{i}A_{i}) \cap B$ si et seulement s'il est dans $B$ et dans l'un des $A_{i}$, c'est-à-dire dans l'un des $A_{i} \cap B$. De même, $x \notin \bigcup_{i}A_{i}$ si et seulement si, pour tout $i$, $x \notin A_{i}$, ce qui donne la loi de De Morgan. Les deux dernières identités découlent de $\Omega = E \cup \overline{E}$ et de la distributivité : $F = F \cap (E \cup \overline{E}) = (F \cap E) \cup (F \cap \overline{E})$, puis $E \cup F = E \cup (F \cap E) \cup (F \cap \overline{E}) = E \cup (F \cap \overline{E})$, car $F \cap E \subset E$.

    En langage d'évènements : « l'un des $A_{i}$ et $B$ » est « l'un des ($A_{i}$ et $B$) » ; « aucun des $A_{i}$ » est « tous les $\overline{A_{i}}$ » ; « $F$ » se produit avec $E$ ou sans $E$ ; « $E$ ou $F$ » est « $E$, ou bien $F$ sans $E$ », réunion *disjointe*, ce qui sert à calculer $\mathbb{P}(E \cup F)$ (cours, prop. 4).

    **2.** Tout $(p, q) \in \mathbb{N}^{2}$ appartient à $E_{p + q}$ et à lui seul, et chaque $E_{r}$ est non vide, puisqu'il contient $(r, 0)$ : les $E_{r}$ forment une partition. De même, tout $x \in E$ appartient à la fibre $f^{-1}(\{f(x)\})$ et à elle seule, puisque deux fibres de points distincts sont disjointes.

    **3.** On pose $B_{1} = A_{1}$ et, pour $m \geqslant 2$, $B_{m} = A_{m} \cap \overline{A_{1}} \cap \cdots \cap \overline{A_{m - 1}}$. Les $B_{m}$ sont deux à deux disjoints : si $i < m$, $B_{m} \subset \overline{A_{i}}$ et $B_{i} \subset A_{i}$. Par récurrence sur $m$, $B_{1} \cup \cdots \cup B_{m} = A_{1} \cup \cdots \cup A_{m}$, d'après la question 1 avec $E = A_{1} \cup \cdots \cup A_{m - 1}$ et $F = A_{m}$. C'est le procédé de « désunion » du cours (prop. 4).

    **4.** Si $y \in f(A \cup B)$, $y = f(x)$ avec $x \in A$ ou $x \in B$, donc $y \in f(A) \cup f(B)$, et réciproquement. Si $y = f(x)$ avec $x \in A \cap B$, alors $y \in f(A) \cap f(B)$. Si $x \in A$, alors $f(x) \in f(A)$, donc $x \in f^{-1}(f(A))$. Enfin, si $y = f(x)$ avec $f(x) \in C$, alors $y \in C$.

    Les inclusions sont strictes pour $f : \mathbb{R} \to \mathbb{R}$, $x \mapsto x^{2}$ : avec $A = \{-1\}$ et $B = \{1\}$, $f(A \cap B) = \emptyset$ et $f(A) \cap f(B) = \{1\}$ ; $f^{-1}(f(A)) = \{-1, 1\} \neq A$ ; et $f(f^{-1}([-1, 1])) = [0, 1] \neq [-1, 1]$.

    L'image réciproque se comporte bien : $x \in f^{-1}(\bigcup C_{i})$ si et seulement si $f(x)$ est dans l'un des $C_{i}$, et de même pour les intersections ; $x \in f^{-1}(\overline{C})$ si et seulement si $f(x) \notin C$, c'est-à-dire $x \notin f^{-1}(C)$. C'est pourquoi les tribus sont définies par des images réciproques (cours, section 1.3, et chapitre 3 pour les variables aléatoires).

    **5.** On a $A \subset B$ si et seulement si $\mathbf{1}_{A} \leqslant \mathbf{1}_{B}$, et 
    $$\mathbf{1}_{\overline{A}} = 1 - \mathbf{1}_{A}, \qquad \mathbf{1}_{A \cap B} = \mathbf{1}_{A}\mathbf{1}_{B} = \min(\mathbf{1}_{A}, \mathbf{1}_{B}), \qquad \mathbf{1}_{A \cup B} = \mathbf{1}_{A} + \mathbf{1}_{B} - \mathbf{1}_{A}\mathbf{1}_{B} = \max(\mathbf{1}_{A}, \mathbf{1}_{B}),$$
     $\mathbf{1}_{A \times B}(x, y) = \mathbf{1}_{A}(x)\mathbf{1}_{B}(y)$ et $\mathbf{1}_{C} \circ f = \mathbf{1}_{f^{-1}(C)}$, puisque $f(x) \in C$ si et seulement si $x \in f^{-1}(C)$.
- id: "l3-pr-01-03"
  feuille: "f-l3-pr-01"
  numero: 3
  partie: "Évènements, tribus"
  etoiles: 1
  types: [Calcul]
  mots_cles: [évènements et tribus]
  noeuds: [p-espace, m-tribus]
  notions: [tribu, tribu-engendree, espace-probabilise]
  source: "Bordeaux, TD 1, exercice 2"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Soit $\Omega = \{a, b, c, d\}$. Parmi les familles suivantes, lesquelles sont des tribus sur $\Omega$ ? 
    $$\mathcal{F}_{1} = \{\emptyset, \Omega, \{a\}, \{b, c, d\}\}, \quad \mathcal{F}_{2} = \{\emptyset, \Omega, \{a\}, \{c, d\}\}, \quad \mathcal{F}_{3} = \{\{a\}\}, \quad \mathcal{F}_{4} = \{\emptyset, \Omega, \{a, b\}, \{c, d\}\}.$$
     Pour celles qui n'en sont pas, décrire complètement la tribu qu'elles engendrent.
  corrige: |
    Une tribu contient $\emptyset$ et $\Omega$, et elle est stable par complémentaire et par réunion (finie, ici, puisque $\Omega$ est fini).

    $\mathcal{F}_{1}$ est une tribu : elle contient $\emptyset$ et $\Omega$, les complémentaires de $\{a\}$ et $\{b, c, d\}$ sont l'un l'autre, et toutes les réunions sont dans $\mathcal{F}_{1}$. C'est la tribu engendrée par la partition $\{\{a\}, \{b, c, d\}\}$. De même, $\boxed{\mathcal{F}_{4} \text{ est une tribu}}$, engendrée par la partition $\{\{a, b\}, \{c, d\}\}$.

    $\mathcal{F}_{2}$ n'est pas une tribu : le complémentaire $\{b, c, d\}$ de $\{a\}$ n'y figure pas. La tribu qu'elle engendre contient $\{a\}$, $\{c, d\}$ et $\{b\} = \overline{\{a\} \cup \{c, d\}}$ ; ces trois parties forment une partition de $\Omega$, et la tribu engendrée est formée des $2^{3} = 8$ réunions de ses éléments : 
    $$\boxed{\sigma(\mathcal{F}_{2}) = \{\emptyset, \{a\}, \{b\}, \{c, d\}, \{a, b\}, \{a, c, d\}, \{b, c, d\}, \Omega\}}.$$

    $\mathcal{F}_{3}$ n'est pas une tribu, puisqu'elle ne contient pas $\emptyset$. La tribu engendrée par $\{a\}$ est 
    $$\boxed{\sigma(\mathcal{F}_{3}) = \{\emptyset, \{a\}, \{b, c, d\}, \Omega\} = \mathcal{F}_{1}}.$$
