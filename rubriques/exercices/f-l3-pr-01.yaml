  enonce: |
    Un système de $r$ particules peut occuper $n$ niveaux d'énergie $e_{1}$, …, $e_{n}$. On appelle *état* du système une configuration distinguable, et l'on suppose tous les états équiprobables. On considère trois modèles :

    **(i)** *Maxwell-Boltzmann* : les particules sont distinguables ;

    **(ii)** *Bose-Einstein* : les particules sont indiscernables ;

    **(iii)** *Fermi-Dirac* : les particules sont indiscernables, et un niveau contient au plus une particule ($n \geqslant r$).

    **1.** Construire l'espace probabilisé associé à chacun des trois modèles.

    **2.** L'état macroscopique du système est le vecteur $(r_{1}, \dots, r_{n})$ des nombres de particules à chaque niveau. Munir l'ensemble $\Omega_{ma} = \{(r_{1}, \dots, r_{n}) \in \mathbb{N}^{n} \,;\, r_{1} + \cdots + r_{n} = r\}$ de la probabilité induite par chacun des modèles. Que remarque-t-on pour (ii) et (iii) ?

    **3.** Calculer, dans chacun des modèles, la probabilité $p_{r, n}(k)$ qu'un niveau donné contienne exactement $k$ particules.

    **4.** On fait tendre $r$ et $n$ vers $+\infty$, avec $r/n \to \lambda > 0$ ($\lambda \leqslant 1$ pour (iii)). Déterminer la limite $p_{k}$ de $p_{r, n}(k)$ dans chacun des modèles, vérifier que $\sum_{k \geqslant 0}p_{k} = 1$, et reconnaître les lois obtenues.

    **5.** Dans les modèles (i) et (ii), dénombrer les états dans lesquels au moins un niveau est vide.

    **6.** *(Applications du modèle (i).)* $r \geqslant 1$ messages sont répartis au hasard entre cinq secrétaires : quelle est la probabilité que chacune en reçoive au moins un ? Retrouver la probabilité qu'au moins deux personnes parmi $r$ aient leur anniversaire le même jour (on suppose $365$ dates équiprobables), et la plus petite valeur de $r$ pour laquelle elle dépasse $\frac{1}{2}$.
  corrige: |
    **1.** (i) Les particules étant numérotées, un état est l'application qui donne le niveau de chaque particule : $\Omega_{1} = \llbracket 1, n \rrbracket^{r}$, $\operatorname{card}\Omega_{1} = n^{r}$. (ii) Un état est déterminé par les nombres de particules à chaque niveau : $\Omega_{2} = \Omega_{ma}$, de cardinal $\binom{n + r - 1}{n - 1}$ (exercice 6). (iii) Un état est la partie des niveaux occupés : $\Omega_{3}$, ensemble des parties à $r$ éléments de $\llbracket 1, n \rrbracket$, $\operatorname{card}\Omega_{3} = \binom{n}{r}$. Chacun est muni de la probabilité uniforme.

    **2.** Dans (i), l'état macroscopique $(r_{1}, \dots, r_{n})$ est réalisé par les $\frac{r!}{r_{1}! \cdots r_{n}!}$ applications ayant ces effectifs (exercice 5) : sa probabilité est $\frac{r!}{r_{1}! \cdots r_{n}!}\,n^{-r}$ (loi *multinomiale*). Dans (ii), c'est la probabilité uniforme sur $\Omega_{ma}$ ; dans (iii), la probabilité uniforme sur les $(r_{1}, \dots, r_{n}) \in \{0, 1\}^{n}$ de somme $r$. Dans ces deux cas, l'état macroscopique décrit complètement l'état : les particules n'ont pas d'identité.

    **3.** (i) Le niveau $e_{1}$ contient $k$ particules si l'on choisit ces $k$ particules et le niveau de chacune des autres parmi $n - 1$ : $p_{r, n}(k) = \binom{r}{k}\frac{1}{n^{k}}\big(1 - \frac{1}{n}\big)^{r - k}$, loi binomiale $\mathcal{B}(r, \frac{1}{n})$. (ii) Il reste à répartir $r - k$ particules entre $n - 1$ niveaux : $p_{r, n}(k) = \binom{n + r - k - 2}{n - 2}\Big/\binom{n + r - 1}{n - 1}$. (iii) $k \in \{0, 1\}$, et $p_{r, n}(1) = \binom{n - 1}{r - 1}\big/\binom{n}{r} = \frac{r}{n}$.

    **4.** (i) Pour $k$ fixé, 
    $$\binom{r}{k}\frac{1}{n^{k}} = \frac{r(r - 1)\cdots(r - k + 1)}{k!\,n^{k}} \to \frac{\lambda^{k}}{k!}, \qquad \Big(1 - \frac{1}{n}\Big)^{r - k} = \exp\Big((r - k)\ln\Big(1 - \frac{1}{n}\Big)\Big) \to \mathrm{e}^{-\lambda},$$
     donc $p_{k} = \mathrm{e}^{-\lambda}\frac{\lambda^{k}}{k!}$ : c'est la *loi de Poisson*. (ii) En simplifiant les factorielles, 
    $$p_{r, n}(k) = \frac{n - 1}{n + r - 1}\prod_{j = 0}^{k - 1}\frac{r - j}{n + r - 2 - j} \xrightarrow[n \to +\infty]{} \frac{1}{1 + \lambda}\Big(\frac{\lambda}{1 + \lambda}\Big)^{k},$$
     loi *géométrique* sur $\mathbb{N}$. (iii) $p_{1} = \lambda$, $p_{0} = 1 - \lambda$ : loi de *Bernoulli*. Dans les trois cas, $\sum_{k}p_{k} = 1$ (série exponentielle, série géométrique de raison $\frac{\lambda}{1 + \lambda}$, somme de deux termes).

