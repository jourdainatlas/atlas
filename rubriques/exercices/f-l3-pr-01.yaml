  enonce: |
    Soit $E$ un ensemble infini dénombrable. Montrer que l'ensemble $\mathcal{P}(E)$ de ses parties n'est pas dénombrable. *On pourra raisonner par l'absurde, à partir d'une énumération $(A_{n})_{n \in \mathbb{N}}$ des parties de $\mathbb{N}$, et considérer $\{n \in \mathbb{N} \,;\, n \notin A_{n}\}$.* Expliquer pourquoi on ne peut pas toujours prendre $\mathcal{A} = \mathcal{P}(\Omega)$ quand $\Omega$ n'est pas dénombrable, en s'appuyant sur le cours.
  corrige: |
    Il suffit de traiter $E = \mathbb{N}$, puisque $E$ est en bijection avec $\mathbb{N}$, et qu'une bijection $E \to \mathbb{N}$ induit une bijection $\mathcal{P}(E) \to \mathcal{P}(\mathbb{N})$. Supposons $\mathcal{P}(\mathbb{N})$ dénombrable : il est infini, on peut l'énumérer en $(A_{n})_{n \in \mathbb{N}}$. La partie $D = \{n \in \mathbb{N} \,;\, n \notin A_{n}\}$ est l'un des $A_{n}$, disons $A_{n_{0}}$. Mais alors $n_{0} \in D$ si et seulement si $n_{0} \notin A_{n_{0}} = D$ : c'est absurde. Donc $\boxed{\mathcal{P}(E) \text{ n'est pas dénombrable}}$.

    Le même argument diagonal montre que $\{0, 1\}^{\mathbb{N}}$, en bijection avec $\mathcal{P}(\mathbb{N})$, et donc $[0, 1]$ (par les développements dyadiques), ne sont pas dénombrables. Sur un ensemble $\Omega$ non dénombrable, on ne peut pas définir une probabilité par ses valeurs sur les singletons, comme dans le théorème 1 du cours, et l'on ne peut pas toujours la définir sur toutes les parties : il n'existe pas de probabilité définie sur toutes les parties de $[0, 1]$, invariante par translation modulo $1$, qui prolonge la longueur des intervalles (ensemble de Vitali, remarque de la section 1.3 du cours). C'est pourquoi on se restreint à une tribu, comme celle des boréliens.
- id: "l3-pr-01-11"
