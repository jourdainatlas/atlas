  page_corrige: 5
  enonce: |
    Pour $n \in \mathbb{N}^{*}$, on note $E_{n} = \llbracket 1, n \rrbracket$. Soit $m$, $n \in \mathbb{N}^{*}$.

    **1.** Combien y a-t-il d'applications de $E_{m}$ dans $E_{n}$ ? de parties de $E_{m}$ ? *On pourra associer à chaque partie de $E_{m}$ une application de $E_{m}$ dans $\{0, 1\}$.*

    **2.** Combien y a-t-il d'applications injectives de $E_{m}$ dans $E_{n}$ ? de $m$-uplets d'éléments de $E_{n}$ sans répétition ? Que trouve-t-on lorsque $m = n$ ?

    **3.** Combien y a-t-il d'applications strictement croissantes de $E_{m}$ dans $E_{n}$ ? de parties de $E_{n}$ à $m$ éléments ?

    **4.** On veut dénombrer les applications croissantes, au sens large, de $E_{m}$ dans $E_{n}$.

    **(a)** Soit $f$ une telle application. Montrer que $g : k \mapsto f(k) + k - 1$ est une application strictement croissante de $E_{m}$ dans un ensemble que l'on précisera.

    **(b)** En déduire le nombre d'applications croissantes de $E_{m}$ dans $E_{n}$.

    **5.** Pour $n \in \mathbb{N}$, on note $C(n, m)$ le nombre de $m$-uplets $(x_{1}, \dots, x_{m}) \in \mathbb{N}^{m}$ tels que $x_{1} + \cdots + x_{m} = n$.

    **(a)** Calculer $C(0, m)$, $C(1, m)$, $C(n, 1)$ et $C(n, 2)$.

    **(b)** À un tel $m$-uplet, on associe l'application $f : k \mapsto x_{1} + \cdots + x_{k}$, définie sur $E_{m - 1}$. Que peut-on dire de $f$ ? En déduire, à l'aide de la question 4, que $C(n, m) = \binom{n + m - 1}{m - 1}$.

    **(c)** Retrouver ce résultat en représentant un $m$-uplet par une suite de $n$ étoiles et de $m - 1$ séparateurs.

    **(d)** Combien y a-t-il de solutions si l'on impose de plus qu'aucun $x_{i}$ ne soit nul ?

    **6.** De combien de façons peut-on répartir $n$ boules indiscernables dans $m$ cases numérotées, des cases pouvant rester vides ? de distribuer $p$ prospectus identiques dans $b$ boîtes aux lettres ?

    **7.** Combien de monômes distincts le développement de $(x_{1} + \cdots + x_{r})^{n}$ comporte-t-il ?
  corrige: |
    **1.** Une application de $E_{m}$ dans $E_{n}$ est le choix de $f(1)$, …, $f(m)$ : il y en a $\boxed{n^{m}}$. Une partie $A$ de $E_{m}$ correspond bijectivement à son indicatrice $\mathbf{1}_{A} : E_{m} \to \{0, 1\}$ : il y a $\boxed{2^{m}}$ parties.

    **2.** Une application injective est un arrangement $(f(1), \dots, f(m))$ : il y en a $\boxed{\frac{n!}{(n - m)!}}$ si $m \leqslant n$, et aucune si $m > n$ ; c'est aussi le nombre de $m$-uplets sans répétition. Pour $m = n$, on trouve les $n!$ permutations de $E_{n}$.

    **3.** Une application strictement croissante est déterminée par son image, partie à $m$ éléments de $E_{n}$, et toute partie est l'image d'une unique telle application (ses éléments rangés dans l'ordre croissant) : il y en a $\boxed{\binom{n}{m}}$, nombre de parties de $E_{n}$ à $m$ éléments.

    **4. (a)** Si $k < \ell$, $g(\ell) - g(k) = f(\ell) - f(k) + \ell - k \geqslant \ell - k > 0$ : $g$ est strictement croissante. De plus $1 \leqslant g(k) \leqslant n + m - 1$ : $g$ va de $E_{m}$ dans $E_{n + m - 1}$.

    **(b)** Réciproquement, si $g : E_{m} \to E_{n + m - 1}$ est strictement croissante, $f : k \mapsto g(k) - k + 1$ est croissante, car $g(k + 1) \geqslant g(k) + 1$, et à valeurs dans $E_{n}$, car $g(1) \geqslant 1$ et $g(m) \leqslant n + m - 1$. Les deux correspondances sont réciproques : il y a $\boxed{\binom{n + m - 1}{m}}$ applications croissantes de $E_{m}$ dans $E_{n}$.

    **5. (a)** $C(0, m) = 1$ (le seul $m$-uplet nul) ; $C(1, m) = m$ (un $1$ à l'une des $m$ places) ; $C(n, 1) = 1$ ; $C(n, 2) = n + 1$ ($x_{1}$ décrit $\{0, \dots, n\}$ et $x_{2} = n - x_{1}$).

    **(b)** L'application $f$ est croissante, de $E_{m - 1}$ dans $\{0, \dots, n\}$, et elle détermine le $m$-uplet : $x_{1} = f(1)$, $x_{k} = f(k) - f(k - 1)$, et $x_{m} = n - f(m - 1)$. Réciproquement, toute application croissante de $E_{m - 1}$ dans $\{0, \dots, n\}$ provient d'un unique $m$-uplet. Un ensemble à $n + 1$ éléments étant en bijection croissante avec $E_{n + 1}$, la question 4 donne 
    $$\boxed{C(n, m) = \binom{(n + 1) + (m - 1) - 1}{m - 1} = \binom{n + m - 1}{m - 1}},$$
     pour $m \geqslant 2$ ; la formule vaut aussi pour $m = 1$.

    **(c)** Un $m$-uplet de somme $n$ s'écrit comme une suite de $n$ étoiles et de $m - 1$ séparateurs : $x_{1}$ étoiles, un séparateur, $x_{2}$ étoiles, etc. C'est une bijection entre les $m$-uplets et les mots de longueur $n + m - 1$ contenant $m - 1$ séparateurs, d'où $\binom{n + m - 1}{m - 1}$.

    1.5em

    ![Figure](documents/figures/d8b9ffea73491b4e.svg)

    Le mot de huit symboles qui code le quadruplet $(2, 1, 0, 2)$, de somme $n = 5$ : cinq étoiles et $m - 1 = 3$ séparateurs. Deux séparateurs consécutifs signalent un $x_{i}$ nul. Choisir le $m$-uplet revient à choisir les places des séparateurs.

    **(d)** Si les $x_{i}$ sont tous $\geqslant 1$, les $y_{i} = x_{i} - 1$ sont des entiers positifs de somme $n - m$ : il y a $\boxed{C(n - m, m) = \binom{n - 1}{m - 1}}$ solutions si $n \geqslant m$, et aucune sinon.

    **6.** Une répartition de $n$ boules indiscernables dans $m$ cases est le $m$-uplet des effectifs, de somme $n$ : il y en a $\binom{n + m - 1}{m - 1}$. De même, il y a $\binom{p + b - 1}{b - 1}$ façons de distribuer $p$ prospectus identiques dans $b$ boîtes.

    **7.** Les monômes du développement sont les $x_{1}^{k_{1}} \cdots x_{r}^{k_{r}}$ avec $k_{1} + \cdots + k_{r} = n$ : il y en a $\boxed{\binom{n + r - 1}{r - 1}}$.
