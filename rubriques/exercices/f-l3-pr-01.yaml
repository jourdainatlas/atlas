  enonce: |
    **1.** Établir la formule du binôme de Newton par un dénombrement, et en déduire le nombre de parties d'un ensemble à $n$ éléments, puis l'identité de Vandermonde $\binom{a + b}{n} = \sum_{k = 0}^{n}\binom{a}{k}\binom{b}{n - k}$.

    **2.** Si $\operatorname{card}\Omega = n$, calculer $\sum_{A \subset \Omega}\operatorname{card} A$.

    **3.** Soit $0 \leqslant p \leqslant n$. En dénombrant de deux façons les mots binaires de longueur $n + 1$ qui contiennent au moins $p + 1$ fois le chiffre $1$, montrer que 
    $$\sum_{i = p}^{n}\binom{n + 1}{i + 1} = \sum_{i = p}^{n}\binom{i}{p}\,2^{n - i}.$$
  corrige: |
    **1.** Dans le développement de $(a + b)^{n} = (a + b)\cdots(a + b)$, on choisit $a$ ou $b$ dans chaque facteur ; le monôme $a^{k}b^{n - k}$ apparaît autant de fois qu'il y a de façons de choisir les $k$ facteurs qui donnent $a$, soit $\binom{n}{k}$. Avec $a = b = 1$, le nombre de parties d'un ensemble à $n$ éléments est $\sum_{k}\binom{n}{k} = 2^{n}$, ce que l'on retrouve en classant les parties par cardinal.

    Pour l'identité de Vandermonde, on choisit $n$ personnes dans un groupe de $a$ femmes et $b$ hommes, et l'on classe les choix selon le nombre $k$ de femmes : $\binom{a}{k}$ choix de femmes et $\binom{b}{n - k}$ choix d'hommes.

    **2.** On compte les couples $(x, A)$ avec $x \in A \subset \Omega$ de deux façons. Pour chaque $x$, les parties qui le contiennent sont les $2^{n - 1}$ parties de $\Omega \setminus \{x\}$, augmentées de $x$. Donc $\boxed{\sum_{A \subset \Omega}\operatorname{card} A = n\,2^{n - 1}}$.

    **3.** Le membre de gauche compte les mots de longueur $n + 1$ contenant $i + 1$ chiffres $1$, pour $i$ de $p$ à $n$, donc au moins $p + 1$ chiffres $1$. Classons ces mots selon la position du $(p + 1)$-ième chiffre $1$ en partant de la gauche : s'il est en position $i + 1$, les $i$ positions précédentes contiennent exactement $p$ chiffres $1$ ($\binom{i}{p}$ choix), et les $n - i$ suivantes sont quelconques ($2^{n - i}$ choix). On obtient le membre de droite (vérifié numériquement pour $n \leqslant 8$).
