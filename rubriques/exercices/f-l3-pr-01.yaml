  enonce: |
    On rappelle qu'une famille $(x_{i})_{i \in I}$ de réels, indexée par un ensemble dénombrable, est *sommable* si $\sum_{i \in I}|x_{i}| < +\infty$, et que la somme d'une famille de réels positifs peut se calculer par paquets, dans n'importe quel ordre.

    **1.** Soit $(x_{ij})_{(i, j) \in \mathbb{N}^{2}}$ telle que $\sum_{i}\sum_{j}|x_{ij}| < +\infty$. Montrer que la famille est sommable, et que ses deux sommes itérées et sa somme par diagonales $i + j = k$ sont égales.

    **2.** Pour $|u|, |v| < 1$, montrer que $(u^{k}v^{\ell})_{k, \ell \geqslant 0}$ est sommable et calculer sa somme.

    **3.** Pour quels réels $x$ la famille $\big(\binom{p + q}{p}x^{p + q}\big)_{p, q \geqslant 0}$ est-elle sommable ? Calculer alors sa somme.

    **4.** Étudier la sommabilité de $\big((-1/p)^{q}\big)_{p \geqslant 2, q \geqslant 2}$, puis de la même famille indexée par $p \geqslant 1$, $q \geqslant 2$.

    **5.** Montrer que la famille $(x^{n}/n!)_{n \geqslant 0}$ est sommable pour tout réel $x$, et que sa somme $f$ vérifie, pour tous réels $x$ et $y$, 
    $$f(x + y) = f(x)f(y).$$

    **6.** Soit $(a_{k})_{k \geqslant 0}$ une suite réelle telle que $\sum_{k}|k\,a_{k}| < +\infty$. Montrer que $\sum_{k \geqslant 0}k\,a_{k} = \sum_{i \geqslant 0}\sum_{j \geqslant i + 1}a_{j}$. Cette identité servira au chapitre 3 pour calculer des espérances.
  corrige: |
    **1.** Par la sommation par paquets des réels positifs (Intégration, chapitre 1, prop. 13), 
    $$\sum_{(i, j) \in \mathbb{N}^{2}}|x_{ij}| = \sum_{i}\sum_{j}|x_{ij}| < +\infty :$$
     la famille est sommable. Écrivons $x_{ij} = x_{ij}^{+} - x_{ij}^{-}$, avec $x^{+} = \max(x, 0)$ et $x^{-} = \max(-x, 0)$. Les familles $(x_{ij}^{\pm})$ sont positives et de somme finie ; leurs sommes par lignes, par colonnes ou par diagonales sont égales. En retranchant, ce qui est licite puisque tout est fini, on obtient l'égalité des sommes itérées et de la somme par diagonales pour $(x_{ij})$.

    **2.** $\sum_{k, \ell}|u|^{k}|v|^{\ell} = \frac{1}{(1 - |u|)(1 - |v|)} < +\infty$, et par la question 1, $\boxed{\sum_{k, \ell \geqslant 0}u^{k}v^{\ell} = \frac{1}{(1 - u)(1 - v)}}$.

    **3.** En sommant par diagonales $p + q = n$ et avec $\sum_{p}\binom{n}{p} = 2^{n}$, $\sum_{p, q}\binom{p + q}{p}|x|^{p + q} = \sum_{n}(2|x|)^{n}$, fini si et seulement si $|x| < \frac{1}{2}$. Dans ce cas, $\boxed{\sum_{p, q}\binom{p + q}{p}x^{p + q} = \frac{1}{1 - 2x}}$.

    **4.** Pour $p \geqslant 2$ fixé, $\sum_{q \geqslant 2}p^{-q} = \frac{p^{-2}}{1 - 1/p} = \frac{1}{p(p - 1)}$, et $\sum_{p \geqslant 2}\frac{1}{p(p - 1)} = 1$ : la famille est sommable. Sa somme est 
    $$\sum_{p \geqslant 2}\sum_{q \geqslant 2}\Big(-\frac{1}{p}\Big)^{q} = \sum_{p \geqslant 2}\frac{p^{-2}}{1 + 1/p} = \sum_{p \geqslant 2}\frac{1}{p(p + 1)} = \boxed{\frac{1}{2}}.$$
     Avec $p = 1$, on ajoute les termes $(-1)^{q}$, $q \geqslant 2$, de module $1$ : la famille n'est plus sommable, et ses sommes partielles selon $q$ oscillent.

    **5.** $\sum_{n}\frac{|x|^{n}}{n!} = \mathrm{e}^{|x|} < +\infty$. Par le binôme et la sommation par diagonales $k + \ell = n$ de la famille sommable $\big(\frac{x^{k}y^{\ell}}{k!\,\ell!}\big)$, 
    $$f(x)f(y) = \sum_{k, \ell}\frac{x^{k}y^{\ell}}{k!\,\ell!} = \sum_{n}\frac{1}{n!}\sum_{k = 0}^{n}\binom{n}{k}x^{k}y^{n - k} = \sum_{n}\frac{(x + y)^{n}}{n!} = f(x + y).$$

    **6.** La famille $(a_{j}\mathbf{1}_{i < j})_{i, j \geqslant 0}$ est sommable : $\sum_{j}\sum_{i < j}|a_{j}| = \sum_{j}j|a_{j}| < +\infty$. En sommant d'abord en $i$, puis en $j$, puis dans l'autre ordre, 
    $$\sum_{j \geqslant 0}j\,a_{j} = \sum_{j \geqslant 0}\sum_{i = 0}^{j - 1}a_{j} = \sum_{i \geqslant 0}\sum_{j \geqslant i + 1}a_{j}.$$
     Avec $a_{j} = \mathbb{P}(X = j)$ pour une variable $X$ à valeurs dans $\mathbb{N}$, on obtiendra au chapitre 3 la formule $\mathbb{E}[X] = \sum_{i \geqslant 0}\mathbb{P}(X > i)$.
