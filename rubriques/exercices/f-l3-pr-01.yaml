  enonce: |
    Un domino est un rectangle portant deux chiffres, éventuellement égaux, pris dans $\{0, 1, \dots, 6\}$ ; un jeu complet comporte un exemplaire de chaque domino.

    **1.** Combien un jeu complet compte-t-il de dominos ? de dominos doubles ?

    **2.** On tire successivement et sans remise deux dominos. Quelle est la probabilité qu'ils aient un chiffre en commun ?

    **3.** On tire successivement et sans remise quatre dominos. Quelle est la probabilité d'obtenir au moins un domino double ?

    **4.** Reprendre les questions 2 et 3 lorsque les tirages se font avec remise.
  corrige: |
    **1.** Un domino est une partie $\{a, b\}$ de $\{0, \dots, 6\}$ à un ou deux éléments : $\boxed{\binom{7}{2} + 7 = 28}$ dominos, dont $\boxed{7}$ doubles.

    **2.** On prend pour $\Omega$ les couples $(x, y)$ de dominos distincts, $28 \times 27 = 756$ couples équiprobables. Si $x$ est un double $\{a, a\}$, les dominos qui ont un chiffre en commun avec lui sont les $6$ autres dominos contenant $a$. Si $x = \{a, b\}$ avec $a \neq b$, ce sont les $6$ autres dominos contenant $a$ et les $6$ autres contenant $b$, soit $12$. D'où 
    $$\mathbb{P} = \frac{7 \times 6 + 21 \times 12}{756} = \frac{294}{756} = \boxed{\frac{7}{18}}.$$

    **3.** Sans double : $21 \times 20 \times 19 \times 18$ tirages ordonnés sur $28 \times 27 \times 26 \times 25$, c'est-à-dire $\frac{\binom{21}{4}}{\binom{28}{4}}$, d'où $\mathbb{P}(\text{au moins un double}) = 1 - \frac{5\,985}{20\,475} = \boxed{\frac{46}{65} \approx 0{,}71}$.

    **4.** Avec remise, $y$ peut être égal à $x$ : un double a $7$ dominos en commun avec lui (lui-même compris), un domino simple en a $13$. D'où $\mathbb{P} = \frac{7 \times 7 + 21 \times 13}{28^{2}} = \frac{322}{784} = \boxed{\frac{23}{56}}$. Pour quatre tirages, $1 - \big(\frac{21}{28}\big)^{4} = 1 - \big(\frac{3}{4}\big)^{4} = \boxed{\frac{175}{256} \approx 0{,}68}$ : remettre les dominos rend un peu moins probable l'apparition d'un double.
