  source: "Bordeaux, TD 1, exercice 4 ; Durand, exercices 1.1 (1)-(2) et 1.13"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Jean, Luc et Marc lancent chacun un dé.

    **1.** Décrire un espace probabilisé $(\Omega, \mathcal{A}, \mathbb{P})$ associé à cette expérience.

    **2.** Calculer la probabilité d'obtenir au moins un six ; exactement un six ; trois chiffres différents ; au moins deux faces identiques ; au moins deux faces identiques et une somme des points paire ; une somme égale à $9$.

    **3.** Soit $i \neq j$ deux numéros. Calculer la probabilité d'obtenir deux fois le numéro $i$ et une fois le numéro $j$.

    **4.** Une personne lance trois dés indiscernables. L'espace de la question 1 convient-il encore pour décrire l'expérience ? Que penser de l'espace formé des multi-ensembles de trois numéros, muni de la probabilité uniforme ?
  corrige: |
    **1.** On prend $\Omega = \llbracket 1, 6 \rrbracket^{3}$, l'élément $(a, b, c)$ donnant les résultats de Jean, Luc et Marc, $\mathcal{A} = \mathcal{P}(\Omega)$, et la probabilité uniforme : les dés sont équilibrés et indépendants, et les $216$ résultats sont équiprobables.

    **2.** Aucun six : $5^{3}$ issues, d'où $\mathbb{P}(\text{au moins un six}) = 1 - \frac{125}{216} = \boxed{\frac{91}{216}}$. Exactement un six : on choisit le dé qui donne six et les deux autres résultats, $3 \times 5^{2}$ issues, d'où $\boxed{\frac{75}{216} = \frac{25}{72}}$.

    Trois chiffres différents : $6 \times 5 \times 4 = 120$ issues, d'où $\boxed{\frac{5}{9}}$, et par passage au contraire, au moins deux faces identiques : $\boxed{\frac{4}{9}}$.

    Au moins deux faces identiques et somme paire : les $6$ triplets $(a, a, a)$ ont une somme de la parité de $a$, et $3$ sont pairs. Les triplets formés d'une paire $a$ et d'une valeur $b \neq a$ ont une somme $2a + b$ paire si et seulement si $b$ est pair ; il y a $3 \times 2 + 3 \times 3 = 15$ couples $(a, b)$ convenables (selon que $a$ est pair ou impair), et $3$ places pour $b$, soit $45$ triplets. Au total $48$ issues : $\boxed{\frac{48}{216} = \frac{2}{9}}$.

    Somme $9$ : les décompositions $9 = 6 + 2 + 1 = 5 + 3 + 1 = 4 + 4 + 1 = 5 + 2 + 2 = 4 + 3 + 2 = 3 + 3 + 3$ donnent $6 + 6 + 3 + 3 + 6 + 1 = 25$ triplets ordonnés, d'où $\boxed{\frac{25}{216}}$.

    1.5em

    ![Figure](documents/figures/782fa066705b8b5c.svg)

    La loi de la somme des trois dés, symétrique autour de $10{,}5$ : les sommes $10$ et $11$ sont les plus probables ($\frac{27}{216}$), et la somme $9$, en rouge, a la probabilité $\frac{25}{216}$. C'est la question que Galilée traita à la demande de joueurs : $9$ et $10$ ont autant de décompositions en trois entiers (six chacun), mais pas autant de triplets ordonnés, $25$ contre $27$.

    **3.** Les issues favorables sont $(i, i, j)$, $(i, j, i)$ et $(j, i, i)$ : $\boxed{\frac{3}{216} = \frac{1}{72}}$.

    **4.** Oui : des dés « identiques » restent des objets distincts, et l'on peut toujours raisonner comme s'ils étaient numérotés ; l'espace de la question 1 et la probabilité uniforme décrivent encore l'expérience. En revanche, l'ensemble des $\binom{8}{3} = 56$ multi-ensembles de trois numéros, muni de la probabilité uniforme, ne convient pas : il donnerait la probabilité $\frac{1}{56}$ au résultat $\{1, 1, 1\}$, qui n'est obtenu que par un triplet sur $216$, et la même probabilité à $\{1, 2, 3\}$, obtenu par $6$ triplets. C'est le piège des pièces indiscernables signalé dans le cours (section 1.5).
