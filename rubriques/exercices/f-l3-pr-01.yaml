  enonce: |
    On dit qu'une partie $A$ de $\mathbb{N}$ admet une *densité* si $\frac{1}{n}\operatorname{card}(A \cap \{0, \dots, n\})$ admet une limite quand $n \to +\infty$.

    **1.** Quelle est la densité de l'ensemble des nombres pairs ? d'une partie finie ? de l'ensemble des carrés ?

    **2.** Montrer que la famille des parties de $\mathbb{N}$ qui admettent une densité est stable par passage au complémentaire et par réunion disjointe finie.

    **3.** Montrer qu'elle n'est pas une tribu. *On pourra chercher deux parties admettant une densité dont l'intersection n'en admet pas.*

    **4.** Le cours montre qu'il n'existe pas de probabilité uniforme sur $\mathbb{N}$. En quoi la densité ressemble-t-elle à une telle probabilité, et quelle propriété lui manque ?
  corrige: |
    On note $d(A) = \lim_{n}\frac{1}{n}\operatorname{card}(A \cap \{0, \dots, n\})$ lorsque cette limite existe.

    **1.** Il y a $\lfloor n/2 \rfloor + 1$ entiers pairs dans $\{0, \dots, n\}$, donc $d(2\mathbb{N}) = \frac{1}{2}$. Une partie finie a une densité nulle. Il y a $\lfloor\sqrt{n}\rfloor + 1$ carrés dans $\{0, \dots, n\}$, et $\frac{\sqrt{n} + 1}{n} \to 0$ : les carrés ont une densité nulle.

    **2.** Comme $\operatorname{card}(\overline{A} \cap \{0, \dots, n\}) = n + 1 - \operatorname{card}(A \cap \{0, \dots, n\})$, $\overline{A}$ admet la densité $1 - d(A)$. Si $A$ et $B$ sont disjointes, les cardinaux s'ajoutent, et $d(A \cup B) = d(A) + d(B)$.

    **3.** Soit $A = 2\mathbb{N}$, de densité $\frac{1}{2}$, et $B$ la partie formée des entiers pairs des intervalles $[4^{k}, 2 \cdot 4^{k}[$ et des entiers impairs des intervalles $[2 \cdot 4^{k}, 4^{k + 1}[$, pour $k \in \mathbb{N}$. Sur chaque intervalle, $B$ contient un entier sur deux, et $B$ admet la densité $\frac{1}{2}$. Mais $A \cap B$ est formé des entiers pairs des seuls intervalles $[4^{k}, 2 \cdot 4^{k}[$, et un calcul de sommes géométriques donne 
    $$\frac{\operatorname{card}(A \cap B \cap [0, 2 \cdot 4^{k}])}{2 \cdot 4^{k}} \xrightarrow[k \to +\infty]{} \frac{1}{3}, \qquad \frac{\operatorname{card}(A \cap B \cap [0, 4^{k + 1}])}{4^{k + 1}} \xrightarrow[k \to +\infty]{} \frac{1}{6}.$$
     La partie $A \cap B$ n'a pas de densité. Comme une tribu est stable par intersection ($A \cap B = \overline{\overline{A} \cup \overline{B}}$), 
    $$\boxed{\text{la famille des parties qui admettent une densité n'est pas une tribu}}.$$

    1.5em

    ![Figure](documents/figures/d9123dc5c23726ab.svg)

    La proportion $\frac{1}{n}\operatorname{card}(E \cap [0, n])$, pour $E = B$ et pour $E = A \cap B$, jusqu'à $n = 4^{8}$. La première se stabilise ; la seconde monte pendant les blocs $[4^{k}, 2 \cdot 4^{k}[$, où $A \cap B$ contient un entier sur deux, et redescend pendant les blocs suivants, où il n'en contient aucun.

    **4.** La densité est positive, vaut $1$ sur $\mathbb{N}$ et $0$ sur les parties finies, et elle est additive sur les réunions disjointes finies ; elle donne la même « probabilité » $\frac{1}{m}$ à toutes les classes modulo $m$, comme le ferait une loi uniforme sur $\mathbb{N}$. Mais elle n'est pas $\sigma$-additive : $\mathbb{N}$ est la réunion dénombrable des singletons, de densité nulle. C'est exactement l'obstacle du cours à l'existence d'une probabilité uniforme sur $\mathbb{N}$, auquel s'ajoute ici l'absence de tribu.
- id: "l3-pr-01-05"
  feuille: "f-l3-pr-01"
  numero: 5
  partie: "Dénombrement, sommes"
  etoiles: 1
  types: [Démonstration, Modélisation]
  mots_cles: [dénombrement]
  noeuds: [p-espace]
  notions: [probabilite, coefficient-binomial]
  source: "Bordeaux, TD 1, exercice 3 ; Durand, exercice 1.46"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **1.** Une application $f : E \to F$, avec $\operatorname{card} F = q$, est surjective et toutes ses fibres ont $p$ éléments. Quel est le cardinal de $E$ ?

    **2.** Dénombrer les arrangements de $k$ éléments parmi $n$, puis les nombres à quatre chiffres tous distincts ; les parties à $k$ éléments d'un ensemble à $n$ éléments, puis les mots binaires de longueur $n$ contenant $k$ fois le chiffre $1$.

    **3.** De combien de façons peut-on répartir $n$ objets distincts en $r$ groupes étiquetés de tailles fixées $n_{1}$, …, $n_{r}$, avec $n_{1} + \cdots + n_{r} = n$ ?

    **4.** Une urne contient $n$ boules numérotées de $1$ à $n$. On en tire $k$ successivement, avec remise. Décrire l'ensemble des tirages possibles et le dénombrer. On les tire maintenant sans remise ($k \leqslant n$) : montrer que l'on peut modéliser l'expérience de deux façons, décrire les deux ensembles de tirages possibles et les dénombrer.

    **5.** Combien y a-t-il de façons de désigner deux délégués parmi les trente élèves d'une classe ?

    **6.** Un questionnaire comporte dix questions, à chacune desquelles on répond « oui », « non » ou « ne sait pas ». Combien y a-t-il de résultats possibles ? de résultats qui comportent la réponse « ne sait pas » aux quatre premières questions seulement ? de résultats qui comportent exactement quatre réponses « ne sait pas » ?

    **7.** Une course de chevaux compte quinze partants. Combien y a-t-il de tiercés possibles, sans ex æquo, dans l'ordre ? dans le désordre ?
  corrige: |
    **1.** Les fibres partitionnent $E$ (exercice 2) ; il y en a $q$, de cardinal $p$ : $\boxed{\operatorname{card} E = pq}$. C'est le « principe des bergers ».

    **2.** Un arrangement est une suite de $k$ éléments distincts : $n$ choix pour le premier, $n - 1$ pour le second, etc., d'où $\frac{n!}{(n - k)!}$ arrangements. Un nombre à quatre chiffres distincts a un premier chiffre non nul ($9$ choix), puis $9$, $8$ et $7$ choix : $\boxed{9 \times 9 \times 8 \times 7 = 4\,536}$.

    Chaque partie à $k$ éléments correspond à $k!$ arrangements, ses $k!$ ordres : il y en a $\binom{n}{k} = \frac{n!}{k!(n - k)!}$. Un mot binaire de longueur $n$ à $k$ chiffres $1$ est déterminé par la partie de $\llbracket 1, n \rrbracket$ formée des positions des $1$ : il y en a $\binom{n}{k}$.

    **3.** On range les $n$ objets dans un ordre quelconque ($n!$ façons) et l'on attribue les $n_{1}$ premiers au groupe $1$, etc. ; chaque répartition est obtenue $n_{1}! \cdots n_{r}!$ fois, d'où le coefficient multinomial $\boxed{\frac{n!}{n_{1}! \cdots n_{r}!}}$.

    **4.** Avec remise, les tirages sont les $k$-uplets de $\llbracket 1, n \rrbracket^{k}$ : il y en a $n^{k}$. Sans remise, on peut garder l'ordre des tirages : les tirages sont les arrangements, au nombre de $\frac{n!}{(n - k)!}$. On peut aussi oublier l'ordre : les tirages sont les parties à $k$ éléments, au nombre de $\binom{n}{k}$. Les deux modèles sont équiprobables et donnent les mêmes probabilités aux évènements qui ne dépendent pas de l'ordre, car chaque partie correspond au même nombre $k!$ d'arrangements.

    **5.** Si les deux délégués ont le même rôle, on choisit une partie à deux éléments : $\boxed{\binom{30}{2} = 435}$ ; s'ils ont des rôles distincts (titulaire et suppléant), $30 \times 29 = 870$.

    **6.** Il y a $\boxed{3^{10} = 59\,049}$ résultats. Avec « ne sait pas » aux quatre premières questions seulement, les six autres réponses sont « oui » ou « non » : $\boxed{2^{6} = 64}$. Avec exactement quatre « ne sait pas », on choisit leurs places, puis les six autres réponses : $\boxed{\binom{10}{4}2^{6} = 13\,440}$.

    **7.** Dans l'ordre : $\boxed{15 \times 14 \times 13 = 2\,730}$ tiercés ; dans le désordre : $\boxed{\binom{15}{3} = 455}$.
- id: "l3-pr-01-06"
  feuille: "f-l3-pr-01"
