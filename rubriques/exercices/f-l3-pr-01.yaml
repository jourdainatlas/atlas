  enonce: |
    On tire cinq cartes au hasard dans un jeu de $52$ cartes, qui comporte treize valeurs (as, $2$, …, $10$, valet, dame, roi) dans chacune des quatre couleurs ; une *main* est l'ensemble des cinq cartes tirées. On appelle *paire* deux cartes de même valeur.

    **1.** Décrire le modèle choisi, puis calculer la probabilité d'obtenir au moins deux cartes de même valeur ; exactement une paire ; exactement deux paires.

    **2.** Calculer la probabilité d'obtenir les quatre as ; exactement deux rois.

    **3.** Une main peut « contenir une paire », « contenir un brelan » (trois cartes de même valeur), « former une suite » (cinq valeurs consécutives, l'as pouvant être placé avant le $2$ ou après le roi), ou « être de même couleur ». Préciser les conventions adoptées, décrire les inclusions et les incompatibilités entre ces évènements, et calculer leurs probabilités.
  corrige: |
    **1.** On prend pour $\Omega$ l'ensemble des parties à cinq éléments du jeu, $\operatorname{card}\Omega = \binom{52}{5} = 2\,598\,960$, avec la probabilité uniforme : les cartes sont battues, et toutes les mains sont équiprobables.

    Les mains à cinq valeurs distinctes s'obtiennent en choisissant les valeurs ($\binom{13}{5} = 1\,287$) puis la couleur de chaque carte ($4^{5}$) : $1\,317\,888$ mains. D'où 
    $$\mathbb{P}(\text{au moins deux cartes de même valeur}) = 1 - \frac{1\,317\,888}{2\,598\,960} = \boxed{\frac{2\,053}{4\,165} \approx 0{,}493}.$$

    Exactement une paire : la valeur de la paire ($13$), ses deux couleurs ($\binom{4}{2} = 6$), les trois autres valeurs ($\binom{12}{3} = 220$), et leurs couleurs ($4^{3}$) : $1\,098\,240$ mains, $\boxed{\frac{352}{833} \approx 0{,}423}$.

    Exactement deux paires : les deux valeurs ($\binom{13}{2} = 78$), les couleurs de chaque paire ($6^{2}$), la cinquième carte, d'une autre valeur ($44$) : $123\,552$ mains, $\boxed{\frac{198}{4\,165} \approx 0{,}048}$.

    **2.** Les mains contenant les quatre as sont déterminées par la cinquième carte : $\boxed{\frac{48}{2\,598\,960} = \frac{1}{54\,145}}$. Exactement deux rois : $\binom{4}{2}\binom{48}{3} = 103\,776$ mains, $\boxed{\frac{2\,162}{54\,145} \approx 0{,}040}$.

    **3.** Conventions : « contenir une paire » signifie contenir au moins deux cartes de même valeur (la main peut contenir un brelan, une double paire, un full ou un carré) ; « contenir un brelan » signifie contenir au moins trois cartes de même valeur ; l'as peut commencer ou terminer une suite. Alors :

    • brelan $\subset$ paire ;

    • suite et paire sont incompatibles, ainsi que couleur et paire : une suite a cinq valeurs distinctes, et une main de même couleur aussi ;

    • suite et couleur ne sont pas incompatibles : leur intersection est formée des $4 \times 10 = 40$ quintes flush.

    On dénombre : brelan, $13\big[\binom{4}{3}\binom{48}{2} + 48\big] = 59\,280$ mains (trois cartes d'une valeur et deux cartes d'autres valeurs, ou quatre cartes d'une valeur), soit $\frac{19}{833} \approx 0{,}023$ ; suite, $10$ suites de valeurs et $4^{5}$ choix de couleurs, $10\,240$ mains, $\approx 0{,}0039$ ; couleur, $4\binom{13}{5} = 5\,148$ mains, $\approx 0{,}0020$. Ces dénombrements ont été vérifiés par une énumération exhaustive des $2\,598\,960$ mains.

    1.5em

    ![Figure](documents/figures/f1ef5dea33e58c59.svg)

    Les évènements de la question 3, sans respect des aires : « paire » ($0{,}493$) contient « brelan » ($0{,}023$) ; « suite » ($0{,}0039$) et « couleur » ($0{,}0020$) sont disjoints de « paire » et se rencontrent dans les quintes flush. La moitié des mains environ n'a aucune combinaison.
