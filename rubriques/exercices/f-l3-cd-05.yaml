- id: "l3-cd-05-01"
  feuille: "f-l3-cd-05"
  numero: 1
  partie: "Points critiques et leur nature"
  etoiles: 1
  types: [Calcul]
  mots_cles: [points critiques]
  noeuds: [fq-points-critiques, fq-extremums]
  notions: [point-critique, extremum-local-rn]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Étudier les extrema locaux de la fonction $f : \mathbb{R}^{2} \to \mathbb{R}$ définie par $f(x, y) = x^{3} + 3xy^{2} - 15x - 12y$.
  corrige: |
    $\triangleright$ *Points critiques.* $\dfrac{\partial f}{\partial x} = 3x^{2} + 3y^{2} - 15$ et $\dfrac{\partial f}{\partial y} = 6xy - 12$ s'annulent si $x^{2} + y^{2} = 5$ et $xy = 2$, c'est-à-dire $(x + y)^{2} = 9$ et $(x - y)^{2} = 1$ : quatre points, $(2, 1)$, $(1, 2)$, $(-1, -2)$, $(-2, -1)$.

    $\triangleright$ *Nature.* $r = 6x$, $s = 6y$, $t = 6x$, donc $rt - s^{2} = 36(x^{2} - y^{2})$. Par la proposition 4 du cours :

    • en $(2, 1)$, $rt - s^{2} = 108 > 0$ et $r = 12 > 0$ : 
    $$\boxed{\text{minimum local}, \ f = -28};$$

    • en $(-2, -1)$, $rt - s^{2} = 108 > 0$ et $r = -12 < 0$ : 
    $$\boxed{\text{maximum local}, \ f = 28};$$

    • en $(1, 2)$ et $(-1, -2)$, $rt - s^{2} = -108 < 0$ : $\boxed{\text{points cols}}$.

    Ces extrema ne sont pas globaux : $f(x, 0) = x^{3} - 15x$ tend vers $\pm\infty$ en $\pm\infty$.

    ![Figure](documents/figures/2c00d864ece1ea74.svg)

    Autour du minimum et du maximum, les lignes de niveau sont des courbes fermées emboîtées ; aux cols, deux branches d'une même ligne de niveau se croisent. Les niveaux $\pm 27$, proches de $\pm 26$, passent près des cols.
- id: "l3-cd-05-02"
  feuille: "f-l3-cd-05"
  numero: 2
  partie: "Points critiques et leur nature"
  etoiles: 1
  types: [Calcul]
  mots_cles: [points critiques]
  noeuds: [fq-points-critiques, fq-extremums]
  notions: [point-critique, extremum-local-rn]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Déterminer les points critiques de $f : \mathbb{R}^{2} \to \mathbb{R}$, $f(x, y) = x^{3} - 3x + xy^{2}$, et préciser leur nature.
  corrige: |
    $\dfrac{\partial f}{\partial x} = 3x^{2} - 3 + y^{2}$ et $\dfrac{\partial f}{\partial y} = 2xy$. La seconde équation donne $x = 0$ ou $y = 0$. Si $x = 0$, $y^{2} = 3$ ; si $y = 0$, $x = \pm 1$. Avec $r = 6x$, $s = 2y$, $t = 2x$, $rt - s^{2} = 12x^{2} - 4y^{2}$ :

    • en $(1, 0)$ : $rt - s^{2} = 12$, $r = 6$ : 
    $$\boxed{\text{minimum local}, \ f = -2};$$

    • en $(-1, 0)$ : $rt - s^{2} = 12$, $r = -6$ : $\boxed{\text{maximum local}, \ f = 2}$ ;

    • en $(0, \pm\sqrt{3})$ : $rt - s^{2} = -12$ : $\boxed{\text{points cols}}$.

    Aucun n'est global, puisque $f(x, 0) = x^{3} - 3x$ n'est pas bornée.
- id: "l3-cd-05-03"
  feuille: "f-l3-cd-05"
  numero: 3
  partie: "Points critiques et leur nature"
  etoiles: 2
  types: [Calcul]
  mots_cles: [points critiques]
  noeuds: [fq-points-critiques, fq-extremums]
  notions: [point-critique, extremum-local-rn]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Déterminer les extrema de $f : \mathbb{R}^{2} \to \mathbb{R}$, $f(x, y) = (x^{2} + y^{2})\,e^{x^{2} - y^{2}}$, et préciser leur nature.
  corrige: |
    $\triangleright$ *Points critiques.* $\dfrac{\partial f}{\partial x} = 2x(1 + x^{2} + y^{2})e^{x^{2} - y^{2}}$ et $\dfrac{\partial f}{\partial y} = 2y(1 - x^{2} - y^{2})e^{x^{2} - y^{2}}$. La première s'annule si et seulement si $x = 0$ ; alors la seconde donne $y(1 - y^{2}) = 0$. Points critiques : $(0, 0)$, $(0, 1)$, $(0, -1)$.

    $\triangleright$ *Nature.* $f \geqslant 0 = f(0, 0)$ : 
    $$\boxed{(0, 0) \text{ est un minimum global}}.$$
     En $(0, \pm 1)$, le calcul donne $r = \frac{4}{e}$, $s = 0$, $t = -\frac{4}{e}$, donc $rt - s^{2} < 0$ : 
    $$\boxed{(0, \pm 1) \text{ sont des cols}}.$$
     On le voit directement : $f(x, \pm 1) = (x^{2} + 1)e^{x^{2} - 1}$ a un minimum en $x = 0$, alors que $f(0, y) = y^{2}e^{-y^{2}}$ a un maximum en $y = \pm 1$. Il n'y a pas de maximum, puisque $f(x, 0) = x^{2}e^{x^{2}} \to +\infty$.
- id: "l3-cd-05-04"
  feuille: "f-l3-cd-05"
  numero: 4
  partie: "Points critiques et leur nature"
  etoiles: 2
  types: [Calcul]
  mots_cles: [points critiques]
  noeuds: [fq-points-critiques, fq-extremums]
  notions: [point-critique, extremum-local-rn]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Étudier les extrema locaux et globaux des fonctions suivantes, définies sur $\mathbb{R}^{2}$ : 
    $$f_{1}(x, y) = x^{2} + xy + y^{2} + \frac{1}{4}x^{3} ; \qquad f_{2}(x, y) = x^{2}y - \frac{x^{2}}{2} - y^{2} ; \qquad f_{3}(x, y) = \sin^{2}x - \operatorname{sh}^{2}y ;$$

    $$f_{4}(x, y) = x^{3} + y^{3} ; \qquad f_{5}(x, y) = y^{2} - 3x^{2}y + 2x^{4}.$$
  corrige: |
    Les cinq fonctions illustrent les cas possibles : critère concluant (pour $f_{1}$, $f_{2}$, $f_{3}$), critère muet (pour $f_{4}$, $f_{5}$).

    $\triangleright$ *$f_{1} = x^{2} + xy + y^{2} + \frac{1}{4}x^{3}$.* $\dfrac{\partial f_{1}}{\partial x} = 2x + y + \frac{3}{4}x^{2}$, $\dfrac{\partial f_{1}}{\partial y} = x + 2y$, d'où $y = -\frac{x}{2}$ et $\frac{3}{2}x + \frac{3}{4}x^{2} = 0$ : points $(0, 0)$ et $(-2, 1)$. En $(0, 0)$, $r = 2$, $s = 1$, $t = 2$ : $rt - s^{2} = 3 > 0$, 
    $$\boxed{\text{minimum local}, \ f_{1} = 0}.$$
     En $(-2, 1)$, $r = 2 + \frac{3}{2}x = -1$, $rt - s^{2} = -3$ : $\boxed{\text{col}}$. Pas d'extremum global : $f_{1}(x, 0) \to \pm\infty$.

    $\triangleright$ *$f_{2} = x^{2}y - \frac{x^{2}}{2} - y^{2}$.* $\dfrac{\partial f_{2}}{\partial x} = x(2y - 1)$, $\dfrac{\partial f_{2}}{\partial y} = x^{2} - 2y$ : points $(0, 0)$ et $\big(\pm 1, \frac{1}{2}\big)$. En $(0, 0)$, $r = -1$, $s = 0$, $t = -2$ : 
    $$\boxed{\text{maximum local}, \ f_{2} = 0}.$$
     En $\big(\pm 1, \frac{1}{2}\big)$, $r = 0$, $s = \pm 2$, $t = -2$, $rt - s^{2} = -4$ : $\boxed{\text{cols}}$. Pas d'extremum global : $f_{2}(x, 1) = \frac{x^{2}}{2} - 1 \to +\infty$ et $f_{2}(0, y) = -y^{2} \to -\infty$.

    $\triangleright$ *$f_{3} = \sin^{2}x - \operatorname{sh}^{2}y$.* $\dfrac{\partial f_{3}}{\partial x} = \sin 2x$, $\dfrac{\partial f_{3}}{\partial y} = -\operatorname{sh} 2y$ : points $\big(\frac{k\pi}{2}, 0\big)$, $k \in \mathbb{Z}$. Comme $f_{3} \leqslant 1$ avec égalité si et seulement si $\sin^{2}x = 1$ et $y = 0$, les points $\big(\frac{\pi}{2} + k\pi, 0\big)$ sont des 
    $$\boxed{\text{maxima globaux}, \ f_{3} = 1}.$$
     En $(k\pi, 0)$, $f_{3} = 0$, et $f_{3}(x, 0) = \sin^{2}x \geqslant 0$ alors que $f_{3}(k\pi, y) = -\operatorname{sh}^{2}y \leqslant 0$ : $\boxed{\text{cols}}$. Pas de minimum : $f_{3}(0, y) \to -\infty$.

    $\triangleright$ *$f_{4} = x^{3} + y^{3}$.* Seul point critique $(0, 0)$, où $\mathrm{d}^{2}f_{4} = 0$ : le critère est muet. Mais $f_{4}(t, 0) = t^{3}$ change de signe : $\boxed{\text{pas d'extremum}}$.

    $\triangleright$ *$f_{5} = y^{2} - 3x^{2}y + 2x^{4} = (y - x^{2})(y - 2x^{2})$.* $\dfrac{\partial f_{5}}{\partial x} = -6xy + 8x^{3}$, $\dfrac{\partial f_{5}}{\partial y} = 2y - 3x^{2}$ : la seconde donne $y = \frac{3}{2}x^{2}$, puis $-x^{3} = 0$ ; seul point critique $(0, 0)$, avec $rt - s^{2} = 0$. C'est l'exemple de Peano du cours : $f_{5} < 0$ entre les paraboles $y = x^{2}$ et $y = 2x^{2}$, et $f_{5} > 0$ ailleurs hors de ces paraboles ; tout voisinage de $0$ contient des points des deux signes, donc $\boxed{\text{pas d'extremum en } 0}$, bien que la restriction de $f_{5}$ à toute droite passant par $0$ y ait un minimum strict. Pas d'extremum global : $f_{5}(0, y) = y^{2}$ n'est pas bornée et $f_{5}\big(x, \frac{3}{2}x^{2}\big) = -\frac{x^{4}}{4} \to -\infty$.

    ![Figure](documents/figures/a0362ccba09eafe1.svg)

    Toute droite issue de l'origine finit par sortir de la région ocre en s'approchant de $0$ : sur la droite, $f_{5}$ a un minimum strict en $0$. Mais la parabole $y = \frac{3}{2}x^{2}$, qui reste dans la région ocre, atteint l'origine avec des valeurs négatives.
- id: "l3-cd-05-05"
  feuille: "f-l3-cd-05"
  numero: 5
  partie: "Points critiques et leur nature"
  etoiles: 2
  types: [Calcul]
  mots_cles: [points critiques]
  noeuds: [fq-points-critiques, fq-extremums]
  notions: [point-critique, extremum-local-rn]
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Déterminer les extrema locaux de la fonction $g : U \to \mathbb{R}$ définie par 
    $$g(x, y) = \frac{1}{1 - x} + \frac{1}{1 - y} + \frac{1}{x + y}, \qquad U = \{(x, y) \in \mathbb{R}^{2} \,;\, x \neq 1,\ y \neq 1,\ x \neq -y\}.$$
  corrige: |
    $\triangleright$ *Points critiques.* $\dfrac{\partial g}{\partial x} = \frac{1}{(1 - x)^{2}} - \frac{1}{(x + y)^{2}}$ et $\dfrac{\partial g}{\partial y} = \frac{1}{(1 - y)^{2}} - \frac{1}{(x + y)^{2}}$. Les points critiques vérifient $(1 - x)^{2} = (1 - y)^{2} = (x + y)^{2}$. Si $1 - x = 1 - y$, alors $x = y$ et $(1 - x)^{2} = 4x^{2}$, d'où $x = \frac{1}{3}$ ou $x = -1$ ; si $1 - x = -(1 - y)$, alors $x + y = 2$ et $(1 - x)^{2} = 4$, d'où $(x, y) = (-1, 3)$ ou $(3, -1)$. Points critiques : $\big(\frac{1}{3}, \frac{1}{3}\big)$, $(-1, -1)$, $(-1, 3)$, $(3, -1)$.

    $\triangleright$ *Nature.* Le calcul (vérifié avec sympy) donne :

    • en $\big(\frac{1}{3}, \frac{1}{3}\big)$ : $r = t = \frac{27}{2}$, $s = \frac{27}{4}$, $rt - s^{2} = \frac{2187}{16} > 0$ : 
    $$\boxed{\text{minimum local}, \ g = \frac{9}{2}};$$

    • en $(-1, -1)$, $(-1, 3)$ et $(3, -1)$ : $rt - s^{2} = -\frac{1}{16} < 0$ : $\boxed{\text{cols}}$, où $g = \frac{1}{2}$.

    Le minimum local n'est pas global : $g$ tend vers $-\infty$ quand $x \to 1^{+}$.
- id: "l3-cd-05-06"
  feuille: "f-l3-cd-05"
  numero: 6
  partie: "Points critiques et leur nature"
  etoiles: 2
  types: [Calcul]
  mots_cles: [points critiques]
  noeuds: [fq-points-critiques, fq-extremums]
  notions: [point-critique, extremum-local-rn]
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Déterminer les points critiques de $f : \mathbb{R}^{3} \to \mathbb{R}$, 
    $$f(x, y, z) = 2x^{2} + 4xy - 6xz + y^{4} - 2y^{3} + 3y^{2} - 6yz + 5z^{2},$$
     et préciser leur nature.
  corrige: |
    On complète les carrés en regroupant les termes en $x$ et en $z$ : 
    $$f(x, y, z) = 2\Big(x + y - \frac{3}{2}z\Big)^{2} + \frac{z^{2}}{2} + y^{2}(y - 1)^{2},$$
     ce qui se vérifie en développant. Donc $f \geqslant 0$, avec égalité si et seulement si $z = 0$, $y \in \{0, 1\}$ et $x = -y$ : 
    $$\boxed{(0, 0, 0) \text{ et } (-1, 1, 0) \text{ sont des minima globaux}, \ f = 0}\text{.}$$

    $\triangleright$ *Autres points critiques.* Les équations $\dfrac{\partial f}{\partial x} = 4x + 4y - 6z = 0$ et $\dfrac{\partial f}{\partial z} = -6x - 6y + 10z = 0$ donnent $z = 0$ et $x = -y$, puis $\dfrac{\partial f}{\partial y} = 4x + 4y^{3} - 6y^{2} + 6y - 6z = 4y^{3} - 6y^{2} + 2y = 2y(2y - 1)(y - 1) = 0$. Le troisième point critique est $\big(-\frac{1}{2}, \frac{1}{2}, 0\big)$, où $f = \frac{1}{16}$. Sa hessienne $\begin{pmatrix} 4 & 4 & -6 \\ 4 & 3 & -6 \\ -6 & -6 & 10 \end{pmatrix}$ a un mineur principal d'ordre $2$ égal à $12 - 16 = -4 < 0$ : elle n'est pas positive, et le point n'est pas un minimum ; il n'est pas non plus un maximum, puisque $\frac{\partial^{2}f}{\partial x^{2}} = 4 > 0$. 
    $$\boxed{\big(-\tfrac{1}{2}, \tfrac{1}{2}, 0\big) \text{ est un col}}\text{.}$$
     Le long de $\big(-y, y, 0\big)$, $f = y^{2}(y - 1)^{2}$ a un maximum en $y = \frac{1}{2}$ : c'est le col qui sépare les deux minima.
- id: "l3-cd-05-07"
  feuille: "f-l3-cd-05"
  numero: 7
  partie: "Extrema sur un compact"
  etoiles: 1
  types: [Calcul]
  mots_cles: [extrema sur un compact]
  noeuds: [fq-points-critiques, me-compacite-sequentielle]
  notions: [extremum-local-rn]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Déterminer la plus grande et la plus petite valeur de la fonction $f(x, y) = x^{2} + y^{2} - xy + x + y$ sur le domaine $D = \{(x, y) \,;\, x \geqslant 0,\ y \geqslant 0,\ x + y \leqslant 3\}$.
  corrige: |
    $D$ est un triangle fermé borné, donc compact, et $f$ y atteint ses bornes (chapitre 1, th. 3). Ou bien l'extremum est intérieur, et c'est un point critique ; ou bien il est sur le bord.

    $\triangleright$ *Intérieur.* $\dfrac{\partial f}{\partial x} = 2x - y + 1$ et $\dfrac{\partial f}{\partial y} = 2y - x + 1$ s'annulent seulement en $(-1, -1)$, hors de $D$.

    $\triangleright$ *Bord.* Sur $y = 0$, $f = x^{2} + x$, croissante sur $[0, 3]$, de $0$ à $12$ ; de même sur $x = 0$. Sur $x + y = 3$, $f = 3x^{2} - 9x + 12$, minimale en $x = \frac{3}{2}$ (valeur $\frac{21}{4}$) et égale à $12$ aux extrémités.

    $\triangleright$ *Conclusion.* 
    $$\boxed{\min_{D}f = 0 \text{ en } (0, 0), \quad \max_{D}f = 12 \text{ en } (3, 0) \text{ et } (0, 3)}\text{.}$$

    ![Figure](documents/figures/9be1b648a05fffcd.svg)

    Les lignes de niveau sont des arcs d'ellipses centrées en $(-1, -1)$, point critique hors du triangle. La fonction croît en s'éloignant de ce centre : elle est minimale au sommet le plus proche et maximale aux deux sommets les plus éloignés.
- id: "l3-cd-05-08"
  feuille: "f-l3-cd-05"
  numero: 8
  partie: "Extrema sur un compact"
  etoiles: 2
  types: [Calcul]
  mots_cles: [extrema sur un compact]
  noeuds: [fq-points-critiques, me-compacite-sequentielle]
  notions: [extremum-local-rn]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **1.** Soit $g(x, y) = x^{4} + y^{4} - 2(x - y)^{2}$. Étudier les extrema locaux et globaux de $g$ sur $\mathbb{R}^{2}$, puis déterminer ses extrema sur le disque $\{x^{2} + y^{2} \leqslant 2\}$, à l'intérieur et sur le bord.

    **2.** Soit $h(x, y) = x^{2} + y^{3} - 3y$. Déterminer les extrema locaux de $h$ sur $\mathbb{R}^{2}$, puis ses extrema sur le disque $\{x^{2} + y^{2} \leqslant 4\}$, à l'intérieur et sur le bord.
  corrige: |
    **1.** $\triangleright$ *Sur $\mathbb{R}^{2}$.* $\dfrac{\partial g}{\partial x} = 4x^{3} - 4(x - y)$ et $\dfrac{\partial g}{\partial y} = 4y^{3} + 4(x - y)$. En sommant, $x^{3} + y^{3} = 0$, donc $y = -x$, puis $x^{3} - 2x = 0$ : points $(0, 0)$, $(\sqrt{2}, -\sqrt{2})$, $(-\sqrt{2}, \sqrt{2})$. Aux deux derniers, $r = t = 20$, $s = 4$ : minima locaux, de valeur $-8$. Ce sont des 
    $$\boxed{\text{minima globaux}, \ g = -8}:$$
     $g$ est coercive (car $x^{4} + y^{4} \geqslant \frac{1}{2}(x^{2} + y^{2})^{2}$ l'emporte sur $2(x - y)^{2} \leqslant 4(x^{2} + y^{2})$), donc atteint son minimum (cours, prop. 1), en un point critique ; on compare les valeurs $0$ et $-8$. En $(0, 0)$, $rt - s^{2} = 0$ ; mais $g(x, x) = 2x^{4} > 0$ et $g(x, 0) = x^{4} - 2x^{2} < 0$ pour $x$ petit : $\boxed{(0, 0) \text{ est un col}}$. Pas de maximum : $g$ est coercive.

    $\triangleright$ *Sur le disque $\{x^{2} + y^{2} \leqslant 2\}$.* Les minima globaux sont hors du disque ($\lVert (\sqrt{2}, -\sqrt{2}) \rVert = 2$) ; à l'intérieur, le seul point critique, $(0, 0)$, n'est pas un extremum. Les extrema sont donc sur le bord. Avec $x = \sqrt{2}\cos\theta$, $y = \sqrt{2}\sin\theta$ et $\sigma = \sin 2\theta$, $x^{4} + y^{4} = 4 - 2\sigma^{2}$ et $(x - y)^{2} = 2 - 2\sigma$, d'où $g = -2\sigma^{2} + 4\sigma$, croissante sur $[-1, 1]$. Donc 
    $$\boxed{\min = -6 \text{ en } (1, -1), (-1, 1), \quad \max = 2 \text{ en } (1, 1), (-1, -1)}\text{.}$$

    **2.** $\triangleright$ *Sur $\mathbb{R}^{2}$.* $\dfrac{\partial h}{\partial x} = 2x$, $\dfrac{\partial h}{\partial y} = 3y^{2} - 3$ : points $(0, 1)$ et $(0, -1)$. En $(0, 1)$, $r = 2$, $t = 6$, $s = 0$ : 
    $$\boxed{\text{minimum local}, \ h = -2}.$$
     En $(0, -1)$, $r = 2$, $t = -6$ : $\boxed{\text{col}}$. Pas d'extremum global : $h(0, y) = y^{3} - 3y$ n'est pas bornée.

    $\triangleright$ *Sur le disque $\{x^{2} + y^{2} \leqslant 4\}$.* Sur le bord, $x^{2} = 4 - y^{2}$ et $h = \phi(y) = y^{3} - y^{2} - 3y + 4$, $y \in [-2, 2]$. $\phi'(y) = 3y^{2} - 2y - 3$ s'annule en $y_{\pm} = \frac{1 \pm \sqrt{10}}{3}$, et $\phi(-2) = -2$, $\phi(2) = 2$, $\phi(y_{-}) = \frac{79 + 20\sqrt{10}}{27} \approx 5{,}27$, $\phi(y_{+}) \approx 0{,}58$. En comparant avec la valeur intérieure $h(0, 1) = -2$ : 
    $$\boxed{\min = -2 \text{ en } (0, 1) \text{ et } (0, -2), \qquad \max = \frac{79 + 20\sqrt{10}}{27} \approx 5{,}27 \text{ en } \big(\pm\sqrt{4 - y_{-}^{2}}, y_{-}\big)}.$$

    ![Figure](documents/figures/3877821d0bf7a2a0.svg)

    Dans le disque, $g$ descend vers les points $(1, -1)$ et $(-1, 1)$ du bord, au-delà desquels se trouvent, hors du disque, les minima globaux $(\pm\sqrt{2}, \mp\sqrt{2})$. L'origine est un col dégénéré : $g$ y est positive le long de la diagonale et négative le long des axes.
- id: "l3-cd-05-09"
  feuille: "f-l3-cd-05"
  numero: 9
  partie: "Extrema sur un compact"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [extrema sur un compact]
  noeuds: [fq-points-critiques, me-compacite-sequentielle]
  notions: [extremum-local-rn]
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Soit $a$, $b$, $c$ des réels, avec $c > 0$, et $f : \mathbb{R}^{2} \to \mathbb{R}$ définie par 
    $$f(x, y) = \frac{ax + by + c}{\sqrt{x^{2} + y^{2} + 1}}.$$
     Montrer que $f$ admet un maximum et le calculer.
  corrige: |
    On interprète $f$ comme un produit scalaire dans $\mathbb{R}^{3}$ : avec $v = (a, b, c)$ et $w = (x, y, 1)$, 
    $$f(x, y) = \frac{\langle v, w \rangle}{\lVert w \rVert} \leqslant \lVert v \rVert = \sqrt{a^{2} + b^{2} + c^{2}},$$
     par Cauchy-Schwarz, avec égalité si et seulement si $w$ est un multiple positif de $v$, c'est-à-dire $(x, y, 1) = \frac{1}{c}(a, b, c)$, possible car $c > 0$. 
    $$\boxed{\max f = \sqrt{a^{2} + b^{2} + c^{2}}, \text{ atteint en } \Big(\frac{a}{c}, \frac{b}{c}\Big)}\text{.}$$

    *Piège.* Pour $c < 0$, le vecteur $w/\lVert w \rVert$ décrit l'hémisphère ouvert supérieur, et $v$ pointe vers l'hémisphère inférieur : la borne supérieure de $f$ vaut $\sqrt{a^{2} + b^{2}}$, approchée quand $(x, y) = t(a, b)$ avec $t \to +\infty$, mais n'est pas atteinte. C'est pourquoi l'énoncé suppose $c > 0$.
- id: "l3-cd-05-10"
  feuille: "f-l3-cd-05"
  numero: 10
  partie: "Formes quadratiques et matrices symétriques"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [formes quadratiques, multiplicateurs de Lagrange, matrices symétriques]
  noeuds: [fq-extremums, f-spectral-fini, cdiff-lagrange]
  notions: [matrice-hessienne, extremum-lie, produit-scalaire, point-critique]
  page_enonce: 2
  page_corrige: 6
  enonce: |
    *(Diagonalisation des matrices symétriques réelles.)* On munit $\mathbb{R}^{n}$ du produit scalaire usuel, noté $\langle \cdot, \cdot \rangle$, et de la norme associée ; on note $S$ la sphère unité. Soit $A$ une matrice symétrique réelle.

    **1.** Montrer que $f : \mathbb{R}^{n} \setminus \{0\} \to \mathbb{R}$, $f(x) = \dfrac{\langle Ax, x \rangle}{\lVert x \rVert^{2}}$, est continue, et que sa restriction à $S$ admet un maximum, atteint en un vecteur unitaire $e_{1}$. Montrer que $e_{1}$ est un maximum de $f$ sur $\mathbb{R}^{n} \setminus \{0\}$.

    **2.** Calculer la différentielle de $f$ et montrer que $\mathrm{d} f(e_{1})\cdot x = 2\langle Ae_{1}, x \rangle - 2\langle Ae_{1}, e_{1} \rangle\langle e_{1}, x \rangle$ pour tout $x \in \mathbb{R}^{n}$. En déduire que $\langle e_{1}, x \rangle = 0$ entraîne $\langle Ae_{1}, x \rangle = 0$, puis que $e_{1}$ est un vecteur propre de $A$.

    **3.** Retrouver ce résultat par la méthode des multiplicateurs de Lagrange, appliquée à $u \mapsto \langle Au, u \rangle$ sur $S$ : montrer que $u$ est un point critique de cette restriction si et seulement si $u$ est un vecteur propre de $A$, et préciser le multiplicateur de Lagrange.

    **4.** Montrer qu'il existe une base orthonormée de $\mathbb{R}^{n}$ dans laquelle la matrice $A$ est diagonale.
  corrige: |
    C'est la démonstration du théorème spectral par l'optimisation : un vecteur propre est un point où le quotient de Rayleigh est extrémal (cours, prop. 9).

    **1.** $f$ est un quotient de fonctions continues, de dénominateur non nul. La sphère $S$ est fermée et bornée, donc compacte, et $f_{|S}$ y atteint son maximum en un $e_{1}$ (chapitre 1, th. 3). Comme $f(\lambda x) = f(x)$ pour $\lambda \neq 0$, $f(x) = f\big(\frac{x}{\lVert x \rVert}\big) \leqslant f(e_{1})$ : 
    $$\boxed{e_{1} \text{ est un maximum de } f \text{ sur } \mathbb{R}^{n} \setminus \{0\}}\text{.}$$

    **2.** Comme au chapitre 2 (exercice 41), $\mathrm{d} f(x)\cdot h = \frac{2}{\lVert x \rVert^{2}}\langle Ax - f(x)x, h \rangle$ ; en $e_{1}$, avec $\lVert e_{1} \rVert = 1$ et $f(e_{1}) = \langle Ae_{1}, e_{1} \rangle$, 
    $$\boxed{\mathrm{d} f(e_{1})\cdot x = 2\langle Ae_{1}, x \rangle - 2\langle Ae_{1}, e_{1} \rangle\langle e_{1}, x \rangle}.$$
     $e_{1}$ est un maximum sur l'ouvert $\mathbb{R}^{n} \setminus \{0\}$, donc $\mathrm{d} f(e_{1}) = 0$ (cours, prop. 2). Si $\langle e_{1}, x \rangle = 0$, il reste $\langle Ae_{1}, x \rangle = 0$ : $Ae_{1}$ est orthogonal à $e_{1}^{\perp}$, donc colinéaire à $e_{1}$, et 
    $$\boxed{e_{1} \text{ est un vecteur propre de } A},$$
     de valeur propre $\lambda_{1} = \langle Ae_{1}, e_{1} \rangle = \max_{S}\langle Au, u \rangle$.

    **3.** Avec $g(u) = \langle Au, u \rangle$ et la contrainte $c(u) = \lVert u \rVert^{2} - 1$, de gradient $2u \neq 0$ sur $S$, le théorème de Lagrange (cours, th. 2) dit que $u$ est un point critique de $g_{|S}$ si et seulement si $\nabla g(u) = 2Au$ est colinéaire à $\nabla c(u) = 2u$, c'est-à-dire $\boxed{Au = \lambda u}$ : $u$ est un vecteur propre unitaire. Le multiplicateur de Lagrange est la valeur propre, $\boxed{\lambda = \langle Au, u \rangle}$.

    **4.** On raisonne par récurrence sur $n$. L'hyperplan $H = e_{1}^{\perp}$ est stable par $A$ : si $\langle x, e_{1} \rangle = 0$, alors $\langle Ax, e_{1} \rangle = \langle x, Ae_{1} \rangle = \lambda_{1}\langle x, e_{1} \rangle = 0$. La restriction de $A$ à $H$ est un endomorphisme symétrique de $H$, de dimension $n - 1$, qui admet par hypothèse de récurrence une base orthonormée de vecteurs propres ; avec $e_{1}$, on obtient 
    $$\boxed{\text{une base orthonormée de } \mathbb{R}^{n} \text{ formée de vecteurs propres de } A}\text{.}$$
- id: "l3-cd-05-11"
  feuille: "f-l3-cd-05"
  numero: 11
  partie: "Formes quadratiques et matrices symétriques"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [formes quadratiques, matrices symétriques]
  noeuds: [fq-extremums, f-spectral-fini]
  notions: [matrice-hessienne, valeur-propre, extremum-local, point-critique]
  page_enonce: 2
  page_corrige: 6
  enonce: |
    Soit $A = \begin{pmatrix} a & b \\ b & c \end{pmatrix}$ une matrice symétrique réelle, $u$ l'endomorphisme de $\mathbb{R}^{2}$ de matrice $A$ dans la base canonique, $q(x, y) = ax^{2} + 2bxy + cy^{2}$ la forme quadratique associée, et $f : \mathbb{R}^{2} \to \mathbb{R}$, $f(x, y) = q(x, y)\,e^{-(x^{2} + y^{2})}$.

    **1.** Montrer que $(x, y)$ est un point critique de $f$ si et seulement si $u(x, y) = q(x, y)\,(x, y)$.

    **2.** Soit $(x, y) \neq (0, 0)$. Montrer que $(x, y)$ est un point critique de $f$ si et seulement si $(x, y)$ est un vecteur propre de $u$ et $(1 - x^{2} - y^{2})\,q(x, y) = 0$.

    **3.** Montrer que les éléments du noyau de $u$ sont des points critiques de $f$.

    **4.** Soit $(x, y)$ n'appartenant pas au noyau de $u$. Montrer que $(x, y)$ est un point critique de $f$ si et seulement si $(x, y)$ est un vecteur propre de $u$, de norme euclidienne $1$, pour une valeur propre non nulle.

    **5.** À quelle condition $f$ a-t-elle un nombre fini de points critiques ? Combien y en a-t-il alors ? La fonction $f$ a-t-elle un extremum local en ces points ?
  corrige: |
    Notons $X = (x, y)$, de sorte que $q(X) = \langle AX, X \rangle$ et $\nabla q(X) = 2AX$.

    **1.** $\nabla f(X) = e^{-\lVert X \rVert^{2}}\big(2AX - 2q(X)X\big)$, qui s'annule si et seulement si $\boxed{u(X) = q(X)\,X}$.

    **2.** Si $X \neq 0$ est critique, $AX = q(X)X$ : $X$ est un vecteur propre, de valeur propre $\lambda = q(X)$. Or $q(X) = \langle AX, X \rangle = \lambda\lVert X \rVert^{2}$, d'où $q(X) = q(X)\lVert X \rVert^{2}$, soit $(1 - x^{2} - y^{2})q(X) = 0$. Réciproquement, si $AX = \lambda X$ et $(1 - \lVert X \rVert^{2})q(X) = 0$ : ou bien $q(X) = \lambda\lVert X \rVert^{2} = 0$, donc $\lambda = 0$ et $AX = 0 = q(X)X$ ; ou bien $\lVert X \rVert = 1$, donc $q(X) = \lambda$ et $AX = q(X)X$. 
    $$\boxed{\text{Les deux conditions caractérisent les points critiques non nuls}}\text{.}$$

    **3.** Si $AX = 0$, alors $q(X) = 0$ et $AX = 0 = q(X)X$ : 
    $$\boxed{\mathrm{Ker}\, u \text{ est formé de points critiques}}.$$

    **4.** Si $X \notin \mathrm{Ker}\, u$ est critique, c'est un vecteur propre pour une valeur propre $\lambda \neq 0$ ; alors $q(X) = \lambda\lVert X \rVert^{2} \neq 0$, et la question 2 impose $\lVert X \rVert = 1$. La réciproque résulte de la question 2. 
    $$\boxed{X \text{ est un vecteur propre unitaire, pour une valeur propre non nulle}}\text{.}$$

    **5.** Soit $\lambda_{1}$, $\lambda_{2}$ les valeurs propres de $A$. Si l'une est nulle, $\mathrm{Ker}\, u$ est une droite de points critiques ; si $\lambda_{1} = \lambda_{2} \neq 0$, tout vecteur est propre et le cercle unité est formé de points critiques. Donc 
    $$\boxed{f \text{ a un nombre fini de points critiques si et seulement si } \lambda_{1} \neq \lambda_{2} \text{ et } \lambda_{1}\lambda_{2} \neq 0}\text{,}$$
     et il y en a alors $\boxed{5}$ : l'origine et les quatre vecteurs propres unitaires $\pm e_{1}$, $\pm e_{2}$. Supposons $\lambda_{1} > \lambda_{2}$. Dans la base $(e_{1}, e_{2})$, $f = (\lambda_{1}x^{2} + \lambda_{2}y^{2})e^{-x^{2} - y^{2}}$, et le calcul donne, en $\pm e_{1}$, $\frac{\partial^{2}f}{\partial x^{2}} = -\frac{4\lambda_{1}}{e}$, $\frac{\partial^{2}f}{\partial y^{2}} = \frac{2(\lambda_{2} - \lambda_{1})}{e} < 0$, la dérivée croisée étant nulle ; de même en $\pm e_{2}$ en échangeant les rôles.

    • En $0$, la hessienne est $2A$ : minimum si $\lambda_{1}, \lambda_{2} > 0$, maximum si $\lambda_{1}, \lambda_{2} < 0$, col si $\lambda_{1} > 0 > \lambda_{2}$.

    • En $\pm e_{1}$ ($f = \frac{\lambda_{1}}{e}$) : maximum si $\lambda_{1} > 0$, col si $\lambda_{1} < 0$.

    • En $\pm e_{2}$ ($f = \frac{\lambda_{2}}{e}$) : minimum si $\lambda_{2} < 0$, col si $\lambda_{2} > 0$.

    ![Figure](documents/figures/d76002721f19babb.svg)

    Pour $A = \mathrm{diag}(1, -1)$, soit $f = (x^{2} - y^{2})e^{-x^{2} - y^{2}}$, les cinq points critiques sont l'origine, col, les maxima $(\pm 1, 0)$ et les minima $(0, \pm 1)$, tous sur le cercle unité ou en son centre, comme l'annonce la question 4.
- id: "l3-cd-05-12"
  feuille: "f-l3-cd-05"
  numero: 12
  partie: "Extrema liés"
  etoiles: 2
  types: [Calcul]
  mots_cles: [extrema liés, multiplicateurs de Lagrange]
  noeuds: [cdiff-lagrange]
  notions: [extremum-lie]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Trouver les points critiques et les extrema globaux de la fonction $f(x, y, z) = y^{2}(x^{2} - z^{2} - 1)$ sur la sphère $\Sigma = \{(x, y, z) \,;\, x^{2} + y^{2} + z^{2} = 1\}$.
  corrige: |
    On élimine la contrainte : sur $\Sigma$, $y^{2} = 1 - x^{2} - z^{2}$, et, en posant $u = x^{2}$, $v = z^{2}$, 
    $$f = (1 - u - v)(u - v - 1) = -(1 - u - v)(1 - u + v), \qquad u, v \geqslant 0, \ u + v \leqslant 1.$$
     $\triangleright$ *Maximum.* Les deux facteurs $1 - u - v$ et $1 - u + v$ sont positifs, donc $f \leqslant 0$, avec égalité si et seulement si $u + v = 1$ (c'est-à-dire $y = 0$) : 
    $$\boxed{\max_{\Sigma}f = 0, \text{ atteint sur tout le grand cercle } y = 0}\text{.}$$

    $\triangleright$ *Minimum.* $(1 - u - v)(1 - u + v) = (1 - u)^{2} - v^{2} \leqslant 1$, avec égalité si et seulement si $u = v = 0$ : 
    $$\boxed{\min_{\Sigma}f = -1, \text{ atteint en } (0, \pm 1, 0)}\text{.}$$

    $\triangleright$ *Points critiques.* Par la méthode de Lagrange (cours, th. 2), $\nabla f = \lambda\nabla c$ avec $c = x^{2} + y^{2} + z^{2} - 1$ s'écrit $xy^{2} = \lambda x$, $y(x^{2} - z^{2} - 1) = \lambda y$, $-zy^{2} = \lambda z$. Si $y = 0$, $\lambda = 0$ et tous les points du cercle $y = 0$ conviennent. Si $y \neq 0$, alors $\lambda = x^{2} - z^{2} - 1$, et les deux autres équations donnent $x = z = 0$ (le calcul complet est vérifié avec sympy). 
    $$\boxed{\text{Points critiques : le cercle } y = 0 \text{ et les deux points } (0, \pm 1, 0)}\text{.}$$
- id: "l3-cd-05-13"
  feuille: "f-l3-cd-05"
  numero: 13
  partie: "Extrema liés"
  etoiles: 2
  types: [Calcul]
  mots_cles: [extrema liés, multiplicateurs de Lagrange]
  noeuds: [cdiff-lagrange]
  notions: [extremum-lie]
  page_enonce: 3
  page_corrige: 8
  enonce: |
    Trouver les points critiques et les extrema globaux de la fonction $f(x, y, z) = y(x^{2} - z^{2} + 1)$ sur la sphère $\Sigma = \{(x, y, z) \,;\, x^{2} + y^{2} + z^{2} = 1\}$.
  corrige: |
    $\triangleright$ *Points critiques.* Les équations de Lagrange $2xy = 2\lambda x$, $x^{2} - z^{2} + 1 = 2\lambda y$, $-2yz = 2\lambda z$ et la contrainte donnent, après discussion (vérifiée avec sympy) :

    • $x = z = 0$ : $(0, \pm 1, 0)$, où $f = \pm 1$ ;

    • $y = 0$ : alors $x = 0$, $z = \pm 1$, où $f = 0$ ;

    • $\lambda = y$, $z = 0$ : $x^{2} + 1 = 2y^{2}$ et $x^{2} + y^{2} = 1$, d'où $y^{2} = \frac{2}{3}$, $x^{2} = \frac{1}{3}$ : les quatre points $\Big(\pm\frac{1}{\sqrt{3}}, \pm\sqrt{\frac{2}{3}}, 0\Big)$, où $f = \pm\frac{4\sqrt{6}}{9}$.

    $\triangleright$ *Extrema globaux.* Sur $\Sigma$, $x^{2} = 1 - y^{2} - z^{2}$, donc $f = y(2 - y^{2} - 2z^{2})$ et $|f| \leqslant |y|(2 - y^{2})$. La fonction $s \mapsto s(2 - s^{2})$ est maximale sur $[0, 1]$ en $s = \sqrt{\frac{2}{3}}$, de valeur $\frac{4\sqrt{6}}{9}$. D'où 
    $$\boxed{\max_{\Sigma}f = \frac{4\sqrt{6}}{9} \approx 1{,}089 \text{ en } \Big(\pm\tfrac{1}{\sqrt{3}}, \sqrt{\tfrac{2}{3}}, 0\Big), \qquad \min_{\Sigma}f = -\frac{4\sqrt{6}}{9} \text{ en } \Big(\pm\tfrac{1}{\sqrt{3}}, -\sqrt{\tfrac{2}{3}}, 0\Big)}.$$
     Les points $(0, \pm 1, 0)$, où $f = \pm 1$, ne sont pas des extrema globaux.
- id: "l3-cd-05-14"
  feuille: "f-l3-cd-05"
  numero: 14
  partie: "Extrema liés"
  etoiles: 2
  types: [Calcul]
  mots_cles: [extrema liés, multiplicateurs de Lagrange]
  noeuds: [cdiff-lagrange]
  notions: [extremum-lie]
  page_enonce: 3
  page_corrige: 8
  enonce: |
    Trouver le volume maximal d'une boîte parallélépipédique rectangle inscrite dans la sphère d'équation $x^{2} + y^{2} + z^{2} = R^{2}$, c'est-à-dire dont les sommets appartiennent à cette sphère.
  corrige: |
    Une boîte inscrite, centrée en $0$ par symétrie, a pour sommets $(\pm x, \pm y, \pm z)$ avec $x$, $y$, $z > 0$ et $x^{2} + y^{2} + z^{2} = R^{2}$ ; son volume est $8xyz$.

    $\triangleright$ *Existence.* $(x, y, z) \mapsto xyz$ est continue sur la partie compacte de la sphère où $x$, $y$, $z \geqslant 0$, nulle au bord de cette partie et strictement positive ailleurs : son maximum est atteint en un point où $x$, $y$, $z > 0$.

    $\triangleright$ *Lagrange.* En ce point, $(yz, xz, xy) = \lambda(2x, 2y, 2z)$. En multipliant respectivement par $x$, $y$, $z$ : $xyz = 2\lambda x^{2} = 2\lambda y^{2} = 2\lambda z^{2}$, donc $x = y = z = \frac{R}{\sqrt{3}}$. 
    $$\boxed{\text{La boîte optimale est le cube}, \ V_{\max} = \frac{8R^{3}}{3\sqrt{3}}}\text{.}$$

    *Remarque.* On le retrouve par l'inégalité arithmético-géométrique (cours, prop. 8) : $(x^{2}y^{2}z^{2})^{1/3} \leqslant \frac{x^{2} + y^{2} + z^{2}}{3} = \frac{R^{2}}{3}$.
- id: "l3-cd-05-15"
  feuille: "f-l3-cd-05"
  numero: 15
  partie: "Extrema liés"
  etoiles: 2
  types: [Calcul]
  mots_cles: [extrema liés]
  noeuds: [cdiff-lagrange]
  notions: [extremum-lie]
  page_enonce: 3
  page_corrige: 8
  enonce: |
    Déterminer le parallélépipède rectangle de volume $V$ donné dont la surface totale est minimale.
  corrige: |
    Soit $a$, $b$, $c > 0$ les côtés, avec $abc = V$ ; la surface totale est $S = 2(ab + bc + ca)$.

    $\triangleright$ *Existence.* On élimine $c = \frac{V}{ab}$ : $S = 2\Big(ab + \frac{V}{a} + \frac{V}{b}\Big)$ sur $]0, +\infty[^{2}$. Cette fonction tend vers $+\infty$ quand $a$ ou $b$ tend vers $0$ ou vers $+\infty$ (si $a \to 0$, $\frac{V}{a} \to +\infty$ ; si $a \to +\infty$ avec $b$ borné inférieurement, $ab \to +\infty$, et sinon $\frac{V}{b} \to +\infty$). Elle atteint donc son minimum, en un point critique.

    $\triangleright$ *Point critique.* $\dfrac{\partial S}{\partial a} = 2\Big(b - \frac{V}{a^{2}}\Big) = 0$ et $\dfrac{\partial S}{\partial b} = 2\Big(a - \frac{V}{b^{2}}\Big) = 0$ donnent $a^{2}b = ab^{2} = V$, donc $a = b = V^{1/3}$, puis $c = V^{1/3}$. 
    $$\boxed{\text{Le cube de côté } V^{1/3} \text{ minimise la surface}, \ S_{\min} = 6V^{2/3}}\text{.}$$

    *Remarque.* Les exercices 14 et 15 sont duaux : à volume fixé, le cube minimise la surface ; à diagonale fixée, il maximise le volume. Les deux reflètent l'inégalité arithmético-géométrique.
- id: "l3-cd-05-16"
  feuille: "f-l3-cd-05"
  numero: 16
  partie: "Extrema liés"
  etoiles: 2
  types: [Calcul]
  mots_cles: [extrema liés]
  noeuds: [cdiff-lagrange]
  notions: [extremum-lie]
  page_enonce: 3
  page_corrige: 9
  enonce: |
    Soit $a > 0$. Déterminer les extrema de la fonction $f(x) = \displaystyle\sum_{i = 1}^{n}x_{i}\ln x_{i}$ sur l'ensemble 
    $$\Big\{x \in \mathbb{R}^{n} \,;\, x_{i} > 0 \text{ pour tout } i,\ \sum_{i = 1}^{n}x_{i} = a\Big\}.$$
  corrige: |
    On peut supposer $n \geqslant 2$ (pour $n = 1$, l'ensemble est réduit au point $a$).

    $\triangleright$ *Point critique lié.* Les équations de Lagrange $\ln x_{i} + 1 = \lambda$ imposent que tous les $x_{i}$ soient égaux, donc $x_{i} = \frac{a}{n}$, où $f = a\ln\frac{a}{n}$.

    $\triangleright$ *C'est un minimum global.* La fonction $t \mapsto t\ln t$ est strictement convexe sur $]0, +\infty[$ (sa dérivée seconde est $\frac{1}{t}$), donc $f$ est convexe sur l'ensemble convexe considéré. Par l'inégalité de Jensen, $\frac{1}{n}\sum x_{i}\ln x_{i} \geqslant \bar{x}\ln\bar{x}$ avec $\bar{x} = \frac{a}{n}$ : 
    $$\boxed{\min f = a\ln\frac{a}{n}, \text{ atteint en } x_{i} = \frac{a}{n}}\text{.}$$

    $\triangleright$ *Pas de maximum.* $f(x) = \sum x_{i}\ln x_{i} \leqslant \sum x_{i}\ln a = a\ln a$, car $x_{i} < a$ ; quand $x$ tend vers le sommet $(a, 0, \dots, 0)$, $f(x) \to a\ln a$. 
    $$\boxed{\text{La borne supérieure } a\ln a \text{ n'est pas atteinte}}\text{,}$$
     puisque les $x_{i}$ sont strictement positifs.

    *Remarque.* Pour $a = 1$, $-f$ est l'entropie d'une loi de probabilité sur $n$ points : elle est maximale pour la loi uniforme, où elle vaut $\ln n$.
- id: "l3-cd-05-17"
  feuille: "f-l3-cd-05"
  numero: 17
  partie: "Extrema liés"
  etoiles: 3
  types: [Calcul]
  mots_cles: [extrema liés]
  noeuds: [cdiff-lagrange]
  notions: [extremum-lie]
  page_enonce: 3
  page_corrige: 9
  enonce: |
    *(Inégalité arithmético-géométrique pondérée.)* Soit $\alpha_{1}$, …, $\alpha_{n}$ des réels strictement positifs tels que $\alpha_{1} + \cdots + \alpha_{n} = 1$. Déterminer le maximum de la fonction $f(x) = \displaystyle\prod_{i = 1}^{n}x_{i}^{\alpha_{i}}$ sur 
    $$K = \Big\{x \in \mathbb{R}^{n} \,;\, x_{i} \geqslant 0 \text{ pour tout } i,\ \sum_{i = 1}^{n}\alpha_{i}x_{i} = 1\Big\}.$$
     En déduire que, pour tous $x_{1}$, …, $x_{n} \geqslant 0$, 
    $$\prod_{i = 1}^{n}x_{i}^{\alpha_{i}} \leqslant \sum_{i = 1}^{n}\alpha_{i}x_{i}.$$
  corrige: |
    C'est la forme pondérée de la proposition 8 du cours, obtenue par la même méthode.

    $\triangleright$ *Existence.* $K$ est fermé, et borné car $0 \leqslant x_{i} \leqslant \frac{1}{\alpha_{i}}$ : il est compact, et $f$, continue, y atteint son maximum (chapitre 1, th. 3). Ce maximum est strictement positif, puisque $f(1, \dots, 1) = 1$ et que le point $(1, \dots, 1)$ est dans $K$ ; il est donc atteint en un point où tous les $x_{i}$ sont strictement positifs, puisque $f$ s'annule dès qu'un $x_{i}$ est nul.

    $\triangleright$ *Lagrange.* Sur l'ouvert $\{x_{i} > 0\}$, on maximise $\ln f = \sum\alpha_{i}\ln x_{i}$ sous la contrainte $\sum\alpha_{i}x_{i} = 1$ : $\frac{\alpha_{i}}{x_{i}} = \lambda\alpha_{i}$, donc tous les $x_{i}$ valent $\frac{1}{\lambda}$, et la contrainte donne $\frac{1}{\lambda}\sum\alpha_{i} = 1$, soit $x_{i} = 1$. 
    $$\boxed{\max_{K}f = 1, \text{ atteint en } (1, \dots, 1)}\text{.}$$

    $\triangleright$ *Inégalité.* Soit $x_{1}$, …, $x_{n} \geqslant 0$ et $m = \sum\alpha_{i}x_{i}$. Si $m = 0$, tous les $x_{i}$ sont nuls et l'inégalité est une égalité. Sinon, $\frac{x}{m} \in K$, donc $\prod\big(\frac{x_{i}}{m}\big)^{\alpha_{i}} \leqslant 1$, c'est-à-dire, puisque $\sum\alpha_{i} = 1$, 
    $$\boxed{\prod_{i = 1}^{n}x_{i}^{\alpha_{i}} \leqslant m = \sum_{i = 1}^{n}\alpha_{i}x_{i}}.$$

    *Piège.* L'énoncé d'origine supposait $\alpha_{1}\cdots\alpha_{n} = 1$. L'homogénéité est alors perdue : avec $\alpha = (2, \frac{1}{2})$ et $x_{1} = x_{2} = t$, l'inégalité deviendrait $t^{5/2} \leqslant \frac{5}{2}t$, fausse pour $t$ grand. C'est la condition $\sum\alpha_{i} = 1$ qui rend les deux membres homogènes de degré $1$.

