- id: "ma-02-01"
  feuille: "f-ma-02"
  numero: 1
  partie: "Applications"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [applications, ensembles finis]
  noeuds: [r-produit, n-fini]
  notions: [application, ensemble-fini]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    ![Figure](documents/figures/ce692fcc419719d1.svg)

    Les quatre courbes ci-dessus sont, de gauche à droite, la courbe d'équation $y = x^{3} - x$, le cercle de centre $O$ et de rayon $1$, sa moitié supérieure, et la courbe d'équation $x = y^{2} - 1$.

    **1.** Pour chacune d'elles, dire s'il existe une partie $E$ de $\mathbb{R}$ telle qu'elle soit le graphe d'une application de $E$ dans $\mathbb{R}$, et préciser $E$ le cas échéant. Lorsque ce n'est pas le cas, dire laquelle des deux exigences de la condition $(\ast)$ du cours est en défaut.

    **2.** On note $\Gamma$ la courbe (d). Montrer que la partie $\{(y,x) \mid (x,y) \in \Gamma\}$, obtenue en échangeant les rôles des deux axes, est le graphe d'une application de $\mathbb{R}$ dans $\mathbb{R}$, que l'on précisera.

    **3.** Soit $E = \{1,2,3\}$ et $F = \{a,b\}$. Combien la partie $E \times F$ possède-t-elle de sous-ensembles ? Combien d'entre eux sont des graphes d'applications de $E$ dans $F$ ? Généraliser à deux ensembles finis à $p$ et $n$ éléments.
  corrige: |
    **1.** D'après la condition $(\ast)$ du cours, une partie $\Gamma$ du plan est le graphe d'une application de $E$ dans $\mathbb{R}$ lorsque chaque droite verticale d'abscisse $x \in E$ la rencontre en exactement un point, et que les droites d'abscisse $x \notin E$ ne la rencontrent pas.

    • **(a)** Pour tout réel $x$, la courbe contient le seul point $(x, x^{3} - x)$ d'abscisse $x$. 
    $$\boxed{\text{C'est le graphe de } x \mapsto x^{3} - x, \text{ avec } E = \mathbb{R}.}$$

    • **(b)** Le seul candidat est $E = [-1\,,1]$, ensemble des abscisses des points du cercle. Mais la droite d'abscisse $0$ coupe le cercle en $(0,1)$ et $(0,-1)$. 
    $$\boxed{\text{Ce n'est le graphe d'aucune application : l'unicité est en défaut.}}$$

    • **(c)** Pour $x \in [-1\,,1]$, la droite d'abscisse $x$ rencontre le demi-cercle supérieur au seul point $\big(x, \sqrt{1 - x^{2}}\big)$, et pour $|x| > 1$ elle ne le rencontre pas. 
    $$\boxed{\text{C'est le graphe de } x \mapsto \sqrt{1 - x^{2}}, \text{ avec } E = [-1\,,1].}$$

    • **(d)** Pour $x > -1$, les deux points $\big(x, \pm\sqrt{x + 1}\big)$ appartiennent à la courbe. 
    $$\boxed{\text{Ce n'est le graphe d'aucune application : l'unicité est en défaut.}}$$

    *Piège :* changer l'ensemble $E$ ne permet pas de « réparer » le cercle. L'ensemble $E$ est imposé par la courbe : c'est l'ensemble des premières composantes de ses points. On ne peut donc pas retirer de points à la courbe en restreignant $E$ ; seule une partie plus petite du plan, comme le demi-cercle (c), peut être un graphe.

    **2.** Un couple $(y,x)$ appartient à la partie échangée $\Gamma'$ si et seulement si $(x,y) \in \Gamma$, c'est-à-dire $x = y^{2} - 1$. En renommant les variables, $\Gamma' = \{(s,t) \in \mathbb{R}^{2} \mid t = s^{2} - 1\}$, et chaque réel $s$ fournit exactement un point de $\Gamma'$. 
    $$\boxed{\Gamma' \text{ est le graphe de l'application } \mathbb{R} \to \mathbb{R},\ s \mapsto s^{2} - 1.}$$
     Géométriquement, l'échange des coordonnées est la symétrie par rapport à la droite $y = x$, celle qui relie les graphes d'une bijection et de sa réciproque à la section 2.5.3 du cours.

    **3.** D'après le lemme 6 du cours, l'ensemble $E \times F$ a $3 \times 2 = 6$ éléments, donc $2^{6} = 64$ parties. Une partie est un graphe si chacun des trois éléments de $E$ y figure dans exactement un couple : il suffit de choisir l'image de $1$, de $2$ et de $3$, avec deux choix à chaque fois. 
    $$\boxed{64 \text{ parties, dont } 2^{3} = 8 \text{ graphes}}$$
     En général, $E \times F$ a $pn$ éléments, donc $2^{pn}$ parties, parmi lesquelles $n^{p}$ graphes, comme le démontrera l'exercice 25. Cette formule justifie la notation $F^{E}$ pour l'ensemble des applications de $E$ dans $F$ : il a $(\mathrm{card}\,F)^{\mathrm{card}\,E}$ éléments.
- id: "ma-02-02"
  feuille: "f-ma-02"
  numero: 2
  partie: "Applications"
  etoiles: 1
  types: [Calcul]
  mots_cles: [applications]
  noeuds: [r-produit]
  notions: [application]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Dans chacun des cas suivants, dire si les applications $f$ et $g$ sont égales, en justifiant à partir de la caractérisation de l'égalité de deux applications.

    $$\begin{array}{rll} \text{1.} & \begin{array}{r|ccl} f : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & \sqrt{x^{2}} \end{array} & \begin{array}{r|ccl} g : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & |x| \end{array} \\[5mm] \text{2.} & \begin{array}{r|ccl} f : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & x^{2} \end{array} & \begin{array}{r|ccl} g : & \mathbb{R} & \longrightarrow & \mathbb{R}_{+} \\ & x & \longmapsto & x^{2} \end{array} \\[5mm] \text{3.} & \begin{array}{r|ccl} f : & \mathbb{R}^{*} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & \ln(x^{2}) \end{array} & \begin{array}{r|ccl} g : & \mathbb{R}^{*} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & 2\ln|x| \end{array} \\[5mm] \text{4.} & \begin{array}{r|ccl} f : & \mathbb{R}_{+} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & \big(\sqrt{x}\big)^{2} \end{array} & \begin{array}{r|ccl} g : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & x \end{array} \\[5mm] \text{5.} & \begin{array}{r|ccl} f : & \mathbb{Z} & \longrightarrow & \mathbb{Z} \\ & n & \longmapsto & (-1)^{n} \end{array} & \begin{array}{r|ccl} g : & \mathbb{Z} & \longrightarrow & \mathbb{Z} \\ & n & \longmapsto & \cos(n\pi) \end{array} \end{array}$$
  corrige: |
    Deux applications sont égales si et seulement si elles ont le même ensemble de départ, le même ensemble d'arrivée et la même image en chaque point.

    **1.** Mêmes ensembles, et $\sqrt{x^{2}} = |x|$ pour tout réel $x$, car $|x|$ est l'unique réel positif dont le carré vaut $x^{2}$. 
    $$\boxed{f = g}$$
     **2.** Les ensembles d'arrivée diffèrent : $\mathbb{R}$ et $\mathbb{R}_{+}$. 
    $$\boxed{f \neq g}$$
     Ce n'est pas une subtilité : la seconde est surjective, la première ne l'est pas, puisque $-1$ n'a pas d'antécédent.

    **3.** Mêmes ensembles, et pour $x \neq 0$ : $\ln(x^{2}) = \ln\big(|x|^{2}\big) = 2\ln|x|$. 
    $$\boxed{f = g}$$
     On notera que $x \mapsto 2\ln x$ ne serait même pas une application de $\mathbb{R}^{*}$ dans $\mathbb{R}$ : c'est la valeur absolue qui rend l'égalité possible.

    **4.** Pour $x \geqslant 0$, on a bien $\big(\sqrt{x}\big)^{2} = x$, mais les ensembles de départ diffèrent : $\mathbb{R}_{+}$ et $\mathbb{R}$. 
    $$\boxed{f \neq g}$$
     **5.** Mêmes ensembles, et pour tout entier $n$, $\cos(n\pi) = (-1)^{n}$. 
    $$\boxed{f = g}$$
- id: "ma-02-03"
  feuille: "f-ma-02"
  numero: 3
  partie: "Applications"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [applications, fonctions indicatrices]
  noeuds: [r-produit, zf-parties]
  notions: [application]
  page_enonce: 2
  page_corrige: 2
  enonce: |
    Soit $A$ et $B$ deux parties d'un ensemble $E$.

    **1.** Montrer que $\min(\mathbf{1}_{A}, \mathbf{1}_{B})$, $\max(\mathbf{1}_{A}, \mathbf{1}_{B})$ et $(\mathbf{1}_{A} - \mathbf{1}_{B})^{2}$ sont les fonctions indicatrices de parties de $E$ que l'on précisera.

    **2.** À quelle condition sur $A$ et $B$ la fonction $\mathbf{1}_{A} + \mathbf{1}_{B}$ est-elle une fonction indicatrice ?

    **3.** En utilisant les indicatrices, démontrer que pour toutes parties $A$, $B$, $C$ de $E$ : 
    $$(A \,\Delta\, B) \,\Delta\, C = A \,\Delta\, (B \,\Delta\, C) \qquad\text{et}\qquad A \cap (B \,\Delta\, C) = (A \cap B) \,\Delta\, (A \cap C).$$
     On pourra remarquer que $\mathbf{1}_{A \Delta B}$ est le reste de la division euclidienne de $\mathbf{1}_{A} + \mathbf{1}_{B}$ par $2$.

    **4.** Décrire la partie $A \,\Delta\, B \,\Delta\, C$ par une phrase.
  corrige: |
    **1.** Pour $x \in E$, chacun des deux nombres $\mathbf{1}_{A}(x)$ et $\mathbf{1}_{B}(x)$ vaut $0$ ou $1$. On examine les quatre cas :

    • $\min\big(\mathbf{1}_{A}(x), \mathbf{1}_{B}(x)\big) = 1$ exactement lorsque les deux valent $1$, c'est-à-dire lorsque $x \in A \cap B$ ;

    • $\max\big(\mathbf{1}_{A}(x), \mathbf{1}_{B}(x)\big) = 1$ exactement lorsque l'un au moins vaut $1$, c'est-à-dire lorsque $x \in A \cup B$ ;

    • $\big(\mathbf{1}_{A}(x) - \mathbf{1}_{B}(x)\big)^{2}$ vaut $1$ lorsque les deux valeurs diffèrent, $0$ sinon : c'est le cas où $x$ appartient à exactement une des deux parties.

    $$\boxed{\min(\mathbf{1}_{A},\mathbf{1}_{B}) = \mathbf{1}_{A \cap B} \qquad \max(\mathbf{1}_{A},\mathbf{1}_{B}) = \mathbf{1}_{A \cup B} \qquad (\mathbf{1}_{A} - \mathbf{1}_{B})^{2} = \mathbf{1}_{A \Delta B}}$$

    **2.** La fonction $\mathbf{1}_{A} + \mathbf{1}_{B}$ vaut $2$ en tout point de $A \cap B$, et $0$ ou $1$ ailleurs. 
    $$\boxed{\mathbf{1}_{A} + \mathbf{1}_{B} \text{ est une indicatrice} \iff A \cap B = \varnothing, \text{ et c'est alors } \mathbf{1}_{A \cup B}.}$$

    **3.** D'après la question 1, $\mathbf{1}_{A \Delta B}(x)$ vaut $1$ si et seulement si $\mathbf{1}_{A}(x) + \mathbf{1}_{B}(x) = 1$ : c'est le reste de la division de $\mathbf{1}_{A}(x) + \mathbf{1}_{B}(x) \in \{0,1,2\}$ par $2$. On écrit donc $\mathbf{1}_{A \Delta B} \equiv \mathbf{1}_{A} + \mathbf{1}_{B} \ [2]$, la congruence ayant lieu en chaque point. Deux fonctions à valeurs dans $\{0,1\}$ congrues modulo $2$ en chaque point sont égales. Or 
    $$\begin{aligned} \mathbf{1}_{(A \Delta B) \Delta C} &\equiv \mathbf{1}_{A \Delta B} + \mathbf{1}_{C} \equiv \mathbf{1}_{A} + \mathbf{1}_{B} + \mathbf{1}_{C} \ [2], \\ \mathbf{1}_{A \Delta (B \Delta C)} &\equiv \mathbf{1}_{A} + \mathbf{1}_{B \Delta C} \equiv \mathbf{1}_{A} + \mathbf{1}_{B} + \mathbf{1}_{C} \ [2]. \end{aligned}$$

    $$\boxed{(A \,\Delta\, B) \,\Delta\, C = A \,\Delta\, (B \,\Delta\, C)}$$
     De même, grâce à la compatibilité des congruences avec le produit (proposition 10 du cours), 
    $$\mathbf{1}_{A \cap (B \Delta C)} = \mathbf{1}_{A}\,\mathbf{1}_{B \Delta C} \equiv \mathbf{1}_{A}(\mathbf{1}_{B} + \mathbf{1}_{C}) = \mathbf{1}_{A \cap B} + \mathbf{1}_{A \cap C} \equiv \mathbf{1}_{(A \cap B) \Delta (A \cap C)} \ [2].$$

    $$\boxed{A \cap (B \,\Delta\, C) = (A \cap B) \,\Delta\, (A \cap C)}$$

    **4.** D'après le calcul précédent, $x \in A \,\Delta\, B \,\Delta\, C$ si et seulement si $\mathbf{1}_{A}(x) + \mathbf{1}_{B}(x) + \mathbf{1}_{C}(x)$ est impair. 
    $$\boxed{A \,\Delta\, B \,\Delta\, C \text{ est l'ensemble des éléments qui appartiennent à exactement une ou aux trois parties.}}$$
     *À retenir :* les indicatrices transforment le calcul sur les parties en calcul sur des nombres. Pour la différence symétrique, ce sont des calculs modulo $2$ : la différence symétrique est une « addition sans retenue », ce qui explique son associativité, si pénible à établir par des diagrammes de Venn.
- id: "ma-02-04"
  feuille: "f-ma-02"
  numero: 4
  partie: "Applications"
