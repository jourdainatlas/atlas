  enonce: |
    Soit $E$ un ensemble et $f : E \to E$. On appelle *racine carrée* de $f$ toute application $g : E \to E$ telle que $g \circ g = f$.

    **1.** Montrer qu'une racine carrée d'une bijection est une bijection, et qu'elle commute avec $f$.

    **2.** Montrer que l'application $\mathbb{Z} \to \mathbb{Z}$, $n \mapsto n + 1$, n'a pas de racine carrée, alors que $n \mapsto n + 2$ en a. Qu'en est-il de $\mathbb{N} \to \mathbb{N}$, $n \mapsto n + 1$ ?

    **3.** Montrer que l'application $x \mapsto -x$ de $\mathbb{R}$ dans $\mathbb{R}$ n'a pas de racine carrée parmi les fonctions affines, mais qu'elle en a une parmi les applications de $\mathbb{R}$ dans $\mathbb{R}$. On pourra chercher une application qui permute les intervalles $]0\,,1]$, $]1\,,2]$, $[-1\,,0[$ et $[-2\,,-1[$ et s'inspirer de la rotation d'un quart de tour.
  corrige: |
    **1.** Soit $g$ telle que $g \circ g = f$, avec $f$ bijective. Comme $g \circ g$ est injective, $g$ l'est (proposition 6 du cours, appliquée à la composée $g \circ g$) ; comme $g \circ g$ est surjective, $g$ l'est aussi. Enfin, 
    $$g \circ f = g \circ g \circ g = f \circ g.$$

    $$\boxed{g \text{ est bijective et commute avec } f.}$$
     La commutation ne demande d'ailleurs pas que $f$ soit bijective : toute racine carrée de $f$ commute avec $f$.

    **2.** Soit $f : n \mapsto n + 1$ sur $\mathbb{Z}$, et supposons $g \circ g = f$. D'après la question 1, $g(n + 1) = g(n) + 1$ pour tout $n$, d'où, par récurrence dans les deux sens, $g(n) = n + c$ avec $c = g(0)$. Alors $g(g(n)) = n + 2c$, et l'on devrait avoir $2c = 1$, ce qui est impossible dans $\mathbb{Z}$. 
    $$\boxed{n \mapsto n + 1 \text{ n'a pas de racine carrée sur } \mathbb{Z} \ ; \ n \mapsto n + 1 \text{ est une racine carrée de } n \mapsto n + 2.}$$
     Sur $\mathbb{N}$, le même raisonnement s'applique : la commutation donne $g(n) = n + g(0)$ pour tout $n \in \mathbb{N}$, puis $2g(0) = 1$. 
    $$\boxed{n \mapsto n + 1 \text{ n'a pas de racine carrée sur } \mathbb{N} \text{ non plus.}}$$

    **3.** Si $g(x) = ax + b$, alors $g(g(x)) = a^{2}x + (a + 1)b$, et l'égalité avec $-x$ imposerait $a^{2} = -1$ : il n'y a pas de racine carrée affine. Pour en construire une, on s'inspire de la rotation d'un quart de tour, qui envoie un vecteur $u$ sur $v$, puis $v$ sur $-u$. On fait « tourner » quatre blocs, pour chaque entier $k \in \mathbb{N}$ : 
    $$\boxed{g(x) = \begin{cases} x + 1 & \text{si } x \in \,]2k\,,2k+1] \\ 1 - x & \text{si } x \in \,]2k+1\,,2k+2] \\ x - 1 & \text{si } x \in [-2k-1\,,-2k[ \\ -x - 1 & \text{si } x \in [-2k-2\,,-2k-1[ \end{cases} \qquad g(0) = 0}$$
     Ces blocs recouvrent $\mathbb{R}$, et $g$ envoie chaque bloc sur le suivant dans le cycle 
    $$]2k\,,2k+1] \ \longrightarrow \ ]2k+1\,,2k+2] \ \longrightarrow \ [-2k-1\,,-2k[ \ \longrightarrow \ [-2k-2\,,-2k-1[ \ \longrightarrow \ ]2k\,,2k+1].$$
     On vérifie $g(g(x)) = -x$ sur chaque bloc :

    • sur $]2k\,,2k+1]$ : $x \mapsto x + 1 \mapsto 1 - (x + 1) = -x$ ;

    • sur $]2k+1\,,2k+2]$ : $x \mapsto 1 - x \mapsto (1 - x) - 1 = -x$ ;

    • sur $[-2k-1\,,-2k[$ : $x \mapsto x - 1 \mapsto -(x - 1) - 1 = -x$ ;

    • sur $[-2k-2\,,-2k-1[$ : $x \mapsto -x - 1 \mapsto (-x - 1) + 1 = -x$.

    Quatre applications de $g$ ramènent chaque réel à lui-même, comme quatre quarts de tour. Une telle racine carrée ne peut pas être continue, mais ce n'était pas demandé.
- id: "ma-02-43"
  feuille: "f-ma-02"
  numero: 43
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [applications multiplicatives, récurrence]
  noeuds: [r-injections, n-recurrence]
  notions: [application]
  page_enonce: 11
  page_corrige: 26
  enonce: |
    Soit $f : \mathbb{N} \to \mathbb{N}$ une application strictement croissante telle que 
    $$\forall (m,n) \in \mathbb{N}^{2},\ f(mn) = f(m)\,f(n),$$
     et telle qu'il existe un entier $k \geqslant 2$ vérifiant $f(k) = k$.

    **1.** Calculer $f(0)$ et $f(1)$, puis montrer que $f(k^{j}) = k^{j}$ pour tout $j \in \mathbb{N}$.

    **2.** Montrer que $f(n) \geqslant n$ pour tout $n \in \mathbb{N}$, puis que $f$ coïncide avec l'identité sur chaque intervalle $[\![k^{j}\,;k^{j+1}]\!]$.

    **3.** Conclure que $f = \mathrm{id}_{\mathbb{N}}$. L'hypothèse $f(k) = k$ est-elle indispensable ?
  corrige: |
    **1.** On a $f(0) = f(0 \cdot 0) = f(0)^{2}$ et $f(1) = f(1)^{2}$, donc $f(0)$ et $f(1)$ appartiennent à $\{0,1\}$. Comme $f(0) < f(1)$, on obtient $f(0) = 0$ et $f(1) = 1$. Par récurrence sur $j$, $f(k^{j+1}) = f(k^{j})\,f(k) = k^{j} \cdot k$. 
    $$\boxed{f(0) = 0, \quad f(1) = 1, \quad f(k^{j}) = k^{j} \text{ pour tout } j \in \mathbb{N}}$$

    **2.** L'inégalité $f(n) \geqslant n$ est l'affirmation 2 de l'exercice 41. Plus précisément, une application strictement croissante à valeurs entières augmente d'au moins $1$ à chaque pas, donc, pour $m \leqslant n$, 
    $$f(n) - f(m) \geqslant n - m.$$
     Soit $n \in [\![k^{j}\,;k^{j+1}]\!]$. On applique cette inégalité entre $k^{j}$ et $n$, puis entre $n$ et $k^{j+1}$ : 
    $$f(n) \geqslant f(k^{j}) + (n - k^{j}) = n \qquad\text{et}\qquad f(n) \leqslant f(k^{j+1}) - (k^{j+1} - n) = n.$$

    $$\boxed{f(n) = n \text{ pour tout } n \in [\![k^{j}\,;k^{j+1}]\!]}$$
     L'image de l'intervalle d'entiers $[\![k^{j}\,;k^{j+1}]\!]$ est « coincée » : ses extrémités sont fixes, et une application strictement croissante n'a pas la place de s'en écarter.

    **3.** Les intervalles $[\![k^{j}\,;k^{j+1}]\!]$, pour $j \in \mathbb{N}$, recouvrent $\mathbb{N}^{*}$, car $k^{0} = 1$ et $k^{j}$ tend vers $+\infty$. Avec $f(0) = 0$, on conclut. 
    $$\boxed{f = \mathrm{id}_{\mathbb{N}}}$$
     L'hypothèse $f(k) = k$ est indispensable : l'application $n \mapsto n^{2}$ est strictement croissante et multiplicative, mais ses seuls points fixes sont $0$ et $1$.
- id: "ma-02-44"
  feuille: "f-ma-02"
  numero: 44
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [injectivité, surjectivité, bijections, ensembles finis]
  noeuds: [r-injections, n-fini]
  notions: [injection, surjection, bijection, ensemble-fini]
  page_enonce: 12
  page_corrige: 26
  enonce: |
    Soit $f$ et $g$ deux bijections de $\mathbb{Z}$ dans $\mathbb{Z}$, et 
    $$\begin{array}{r|ccl} h : & \mathbb{Z} & \longrightarrow & \mathbb{Z} \\ & k & \longmapsto & f(k)\,g(k) \end{array}$$

    **1.** Montrer que l'ensemble des entiers $k$ tels que $h(k)$ soit un nombre premier ou l'opposé d'un nombre premier est fini.

    **2.** En déduire que $h$ n'est pas surjective.

    **3.** L'application $h$ peut-elle être injective ?
  corrige: |
    **1.** Si $h(k) = f(k)\,g(k)$ vaut $\pm p$ avec $p$ premier, l'un des deux facteurs vaut $\pm 1$, puisque les seuls diviseurs de $p$ sont $\pm 1$ et $\pm p$. Or $f$ est injective, donc $f(k) \in \{-1,1\}$ pour au plus deux entiers $k$ ; de même pour $g$. 
    $$\boxed{\text{Au plus quatre entiers } k \text{ vérifient } h(k) = \pm p \text{ avec } p \text{ premier.}}$$

    **2.** D'après la question 1, l'application $h$ atteint au plus quatre valeurs de la forme $\pm p$. Or il existe une infinité de nombres premiers : l'un d'eux au moins n'est pas atteint. 
    $$\boxed{h \text{ n'est pas surjective.}}$$

    **3.** Oui. On prend $f = \mathrm{id}_{\mathbb{Z}}$, et $g$ égale à l'identité sur $\mathbb{N}$, qui permute circulairement les entiers négatifs par blocs de trois : pour tout $j \in \mathbb{N}$, 
    $$g : \quad -(3j+1) \longmapsto -(3j+2) \longmapsto -(3j+3) \longmapsto -(3j+1).$$
     L'application $g$ est une bijection de $\mathbb{Z}$, puisqu'elle permute chaque bloc. Les valeurs de $h$ sont alors :

    • pour $k \in \mathbb{N}$, $h(k) = k^{2}$ : ce sont les carrés, deux à deux distincts ;

    • pour le bloc d'indice $j$, les valeurs $(3j+1)(3j+2)$, $(3j+1)(3j+3)$ et $(3j+2)(3j+3)$.

    Ces trois produits sont rangés par ordre strictement croissant, le dernier est strictement inférieur au premier produit du bloc suivant, $(3j+4)(3j+5)$, et aucun n'est un carré : les deux premiers sont strictement compris entre $(3j+1)^{2}$ et $(3j+2)^{2}$, le troisième entre $(3j+2)^{2}$ et $(3j+3)^{2}$. 
    $$\boxed{h \text{ est injective pour ce choix de } f \text{ et } g.}$$
     *Piège :* la tentative naturelle d'échanger $-1$ et $-2$, puis $-3$ et $-4$, etc., échoue, car $h(-1) = (-1)(-2) = (-2)(-1) = h(-2)$. Une transposition donne deux fois le même produit ; c'est pourquoi l'on utilise des cycles de longueur $3$.
- id: "ma-02-45"
  feuille: "f-ma-02"
  numero: 45
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [ensembles finis, équipotence]
  noeuds: [n-fini, r-equipotence]
  notions: [ensemble-fini]
  page_enonce: 12
  page_corrige: 27
  enonce: |
    Soit $X$ un ensemble. Montrer que $X$ est infini si et seulement si toute application $f : X \to X$ possède une partie stable, au sens de l'exercice 9, différente de $\varnothing$ et de $X$.

    *Pour un ensemble infini, on pourra considérer les itérés $f^{n}(x)$ d'un élément $x$ ; pour un ensemble fini, on cherchera une application qui « fait tourner » les éléments.*
  corrige: |
    *Sens direct.* Supposons $X$ infini, et soit $f : X \to X$. On fixe $x \in X$ et l'on considère 
    $$S = \{f^{n}(x) \mid n \in \mathbb{N}\} \qquad\text{et}\qquad S' = \{f^{n}(x) \mid n \geqslant 1\}.$$
     Ces deux parties sont non vides et stables, puisque $f$ envoie $f^{n}(x)$ sur $f^{n+1}(x)$. Si l'une d'elles diffère de $X$, on a trouvé la partie voulue. Sinon $S' = X$ contient $x$, qui s'écrit $x = f^{m}(x)$ avec $m \geqslant 1$. Les itérés de $x$ se répètent alors de $m$ en $m$, et $S = \{x, f(x), \dots, f^{m-1}(x)\}$. Associer à chaque élément de $S$ le plus petit $k \in [\![0\,;m-1]\!]$ tel qu'il s'écrive $f^{k}(x)$ définit une injection de $S$ dans $[\![0\,;m-1]\!]$ : $S$ est en bijection avec une partie d'un ensemble fini, donc finie d'après les lemmes 2 et 3 du cours, alors que $S = X$ est infini. C'est absurde.

    *Réciproque.* Montrons la contraposée : si $X$ est fini, il existe une application sans partie stable autre que $\varnothing$ et $X$. Si $X$ est vide, c'est évident, car $\varnothing = X$. Sinon, écrivons $X = \{x_{1}, \dots, x_{n}\}$, et posons $f(x_{i}) = x_{i+1}$ pour $i < n$ et $f(x_{n}) = x_{1}$. Une partie stable non vide contient un $x_{i}$, donc $x_{i+1}$, et de proche en proche tous les éléments : c'est $X$. 
    $$\boxed{X \text{ est infini} \iff \text{toute application } X \to X \text{ a une partie stable différente de } \varnothing \text{ et de } X.}$$
     On obtient ainsi une caractérisation de l'infini qui ne fait intervenir aucun nombre, dans l'esprit de la définition de Dedekind : un ensemble est infini s'il est en bijection avec une partie stricte de lui-même.
- id: "ma-02-46"
  feuille: "f-ma-02"
  numero: 46
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [images directes et réciproques, injectivité, bijections, ensembles finis, équipotence, théorème de Cantor-Bernstein, point fixe]
  noeuds: [r-images, r-injections, n-fini, r-equipotence, r-bernstein, od-tarski]
  notions: [image-directe, image-reciproque, injection, bijection, ensemble-fini]
  page_enonce: 12
  page_corrige: 27
  enonce: |
    Soit $E$ et $F$ deux ensembles, $f : E \to F$ et $g : F \to E$ deux injections. Le but de l'exercice est de construire une bijection de $E$ sur $F$ : c'est le *théorème de Cantor-Bernstein*.

    **1.** On pose $G = E \setminus g(F)$ et, pour toute partie $X$ de $E$, $\Phi(X) = G \cup g\big(f(X)\big)$. Montrer que $\Phi$ est croissante pour l'inclusion, et en déduire, grâce à l'exercice 39, l'existence d'une partie $A$ de $E$ telle que $A = G \cup g\big(f(A)\big)$.

    **2.** On pose $B = E \setminus A$. Montrer que tout élément $x$ de $B$ possède un unique antécédent par $g$, que l'on note $\xi(x)$.

    **3.** On définit $\varphi : E \to F$ par $\varphi(x) = f(x)$ si $x \in A$ et $\varphi(x) = \xi(x)$ si $x \in B$. Montrer que les parties $f(A)$ et $\xi(B) = g^{-1}(B)$ forment un recouvrement disjoint de $F$, puis que $\varphi$ est bijective.

    **4.** Application : montrer que $\mathbb{N}$ et $\mathbb{N} \times \mathbb{N}$ sont équipotents à l'aide des injections $n \mapsto (n, 0)$ et $(a,b) \mapsto 2^{a}3^{b}$, sans utiliser l'exercice 26. Montrer de même que $[0\,,1]$ et $[0\,,1[$ sont équipotents.
  corrige: |
    **1.** Si $X \subset Y$, alors $f(X) \subset f(Y)$, puis $g\big(f(X)\big) \subset g\big(f(Y)\big)$, d'après l'exercice 8 ; donc $\Phi(X) \subset \Phi(Y)$. L'exercice 39 fournit alors un point fixe de $\Phi$. 
    $$\boxed{\text{Il existe } A \subset E \text{ telle que } A = G \cup g\big(f(A)\big).}$$

    **2.** Soit $x \in B$. Comme $x \notin A$ et $G \subset A$, on a $x \notin G = E \setminus g(F)$, donc $x \in g(F)$ : il possède un antécédent par $g$, unique puisque $g$ est injective.

    **3.** *L'égalité $\xi(B) = g^{-1}(B)$.* Si $x \in B$, alors $g(\xi(x)) = x \in B$, donc $\xi(x) \in g^{-1}(B)$. Si $y \in g^{-1}(B)$, alors $x = g(y)$ appartient à $B$, et $y = \xi(x)$.

    *Disjonction.* Si $y = f(a)$ avec $a \in A$, alors $g(y) = g(f(a)) \in g(f(A)) \subset A$, donc $g(y) \notin B$ : on a $f(A) \cap g^{-1}(B) = \varnothing$.

    *Recouvrement.* Soit $y \in F$. Si $g(y) \in B$, alors $y \in g^{-1}(B)$. Sinon, $g(y) \in A = G \cup g(f(A))$ ; comme $g(y) \notin G$, il s'écrit $g(y) = g(f(a))$ avec $a \in A$, et l'injectivité de $g$ donne $y = f(a) \in f(A)$. 
    $$\boxed{F = f(A) \cup g^{-1}(B), \text{ réunion disjointe}}$$

    *Bijectivité de $\varphi$.* La restriction de $\varphi$ à $A$ est $f_{|A}$, injective, à valeurs dans $f(A)$. Sa restriction à $B$ est $\xi$, injective puisque $g \circ \xi = \mathrm{id}_{B}$, à valeurs dans $g^{-1}(B)$. Ces deux images sont disjointes, donc $\varphi$ est injective ; elles recouvrent $F$, donc $\varphi$ est surjective. 
    $$\boxed{\varphi \text{ est une bijection de } E \text{ sur } F.}$$

    ![Figure](documents/figures/26021a7c47f40495.svg)

    La bijection $\varphi$ se lit sur ce schéma : elle suit $f$ sur la partie $A$ et remonte $g$ sur la partie $B$, et les deux morceaux d'arrivée s'emboîtent exactement pour former $F$.

    **4.** L'application $n \mapsto (n,0)$ est une injection de $\mathbb{N}$ dans $\mathbb{N}^{2}$. L'application $(a,b) \mapsto 2^{a}3^{b}$ est une injection de $\mathbb{N}^{2}$ dans $\mathbb{N}$ : si $2^{a}3^{b} = 2^{a'}3^{b'}$ avec $a \leqslant a'$, on divise par $2^{a}$ ; l'entier impair $3^{b}$ est égal à $2^{a'-a}3^{b'}$, donc $a = a'$, puis $3^{b} = 3^{b'}$ et $b = b'$. Le théorème de Cantor-Bernstein conclut.

    De même, l'inclusion $[0\,,1[ \ \to [0\,,1]$ et l'application $[0\,,1] \to [0\,,1[$, $x \mapsto \frac{x}{2}$, sont injectives. 
    $$\boxed{\mathbb{N} \text{ et } \mathbb{N}^{2} \text{ sont équipotents, ainsi que } [0\,,1] \text{ et } [0\,,1[.}$$
     *À retenir :* pour montrer que deux ensembles sont équipotents, il suffit de trouver une injection dans chaque sens, ce qui est souvent bien plus facile que d'exhiber une bijection, comme le montre la comparaison avec l'exercice 26.

