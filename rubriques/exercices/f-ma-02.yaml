  page_enonce: 7
  page_corrige: 15
  enonce: |
    **1.** Montrer que l'application $\mathbb{N}^{2} \to \mathbb{N}$, $(a,b) \mapsto 2^{a}(2b + 1) - 1$, est bijective.

    **2.** En déduire, par récurrence, que $\mathbb{N}^{r}$ est équipotent à $\mathbb{N}$ pour tout $r \geqslant 1$.

    **3.** Construire une bijection de $[0\,,1]$ sur $[0\,,1[$. On pourra faire subir à la suite $\big(\frac{1}{n}\big)_{n \geqslant 1}$ le décalage de l'« hôtel de Hilbert » et laisser fixes les autres réels.

    **4.** Montrer que l'ensemble $\mathbb{N}^{\mathbb{N}}$ des suites d'entiers naturels n'est pas équipotent à $\mathbb{N}$.
  corrige: |
    **1.** Il suffit de montrer que $\beta : (a,b) \mapsto 2^{a}(2b + 1)$ est une bijection de $\mathbb{N}^{2}$ sur $\mathbb{N}^{*}$, puis de retrancher $1$.

    • *Surjectivité.* Soit $m \in \mathbb{N}^{*}$. L'ensemble des entiers $a$ tels que $2^{a}$ divise $m$ contient $0$ et est majoré par $m$, car $2^{a} \geqslant a$ ; il a un plus grand élément $a$. Le quotient $m / 2^{a}$ est alors impair, de la forme $2b + 1$.

    • *Injectivité.* Si $2^{a}(2b + 1) = 2^{a'}(2b' + 1)$ avec $a < a'$, on divise par $2^{a}$ : un entier impair serait égal à un entier pair. Donc $a = a'$, puis $b = b'$.

    $$\boxed{(a,b) \mapsto 2^{a}(2b + 1) - 1 \text{ est une bijection de } \mathbb{N}^{2} \text{ sur } \mathbb{N}.}$$

    **2.** C'est vrai pour $r = 1$. Si $\sigma_{r} : \mathbb{N}^{r} \to \mathbb{N}$ est bijective, l'application $\mathbb{N}^{r+1} = \mathbb{N}^{r} \times \mathbb{N} \to \mathbb{N}$, $(x,n) \mapsto \beta'\big(\sigma_{r}(x), n\big)$, où $\beta'$ est la bijection de la question 1, est une composée de bijections. 
    $$\boxed{\mathbb{N}^{r} \text{ est équipotent à } \mathbb{N} \text{ pour tout } r \geqslant 1.}$$

    **3.** On décale la suite $\big(\frac{1}{n}\big)_{n \geqslant 1}$ d'un cran, comme les clients de l'hôtel de Hilbert : 
    $$\boxed{h(x) = \begin{cases} \dfrac{1}{n + 1} & \text{si } x = \dfrac{1}{n},\ n \in \mathbb{N}^{*} \\[2mm] x & \text{sinon} \end{cases}}$$
     Le réel $1 = \frac{1}{1}$ n'est pas atteint, et chaque $\frac{1}{m}$ avec $m \geqslant 2$ a l'unique antécédent $\frac{1}{m - 1}$ ; les autres réels sont fixes. L'application $h$ est donc une bijection de $[0\,,1]$ sur $[0\,,1[$.

    **4.** Raisonnons par l'absurde, et soit $\sigma : \mathbb{N} \to \mathbb{N}^{\mathbb{N}}$ une bijection ; on note $u^{(n)} = \sigma(n)$. On définit la suite $v$ par $v_{n} = u^{(n)}_{n} + 1$. Pour tout $n$, $v$ diffère de $u^{(n)}$ en son terme d'indice $n$ : la suite $v$ n'est pas atteinte par $\sigma$. 
    $$\boxed{\mathbb{N}^{\mathbb{N}} \text{ n'est pas équipotent à } \mathbb{N}.}$$
     C'est l'argument diagonal du théorème de Cantor, démontré dans le cours pour $\mathcal{P}(E)$ : on modifie la $n$-ième suite à la $n$-ième place.
- id: "ma-02-27"
  feuille: "f-ma-02"
  numero: 27
  partie: "Relations binaires"
  etoiles: 1
  types: [Calcul]
  mots_cles: [relations binaires, "relations d'équivalence", "relations d'ordre"]
  noeuds: [r-equivalence, od-ordre]
  notions: [relation, relation-equivalence, relation-ordre]
  page_enonce: 7
  page_corrige: 16
  enonce: |
    ![Figure](documents/figures/901bb59cb2a6ffd2.svg)

    Chaque diagramme représente une relation sur $E = \{1,2,3\}$ : une flèche de $x$ vers $y$ signifie $x \,\mathcal{R}\, y$, et une boucle en $x$ signifie $x \,\mathcal{R}\, x$.

    **1.** Pour chacune des quatre relations, écrire son graphe, puis dire si elle est réflexive, symétrique, antisymétrique, transitive.

    **2.** Lesquelles sont des relations d'équivalence ? des relations d'ordre ? Pour les premières, donner les classes ; pour les secondes, dire si l'ordre est total.

    **3.** Compléter le graphe de $\mathcal{R}_{3}$ par le plus petit nombre possible de couples pour obtenir une relation d'ordre.
  corrige: |
    **1.** On lit les graphes sur les diagrammes, puis on teste chaque propriété.

    • $\mathcal{R}_{1} = \{(1,1), (2,2), (3,3), (1,2), (2,1)\}$ est réflexive, symétrique et transitive ; elle n'est pas antisymétrique, puisque $1 \,\mathcal{R}_{1}\, 2$ et $2 \,\mathcal{R}_{1}\, 1$.

    • $\mathcal{R}_{2} = \{(1,1), (2,2), (3,3), (1,2), (2,3), (1,3)\}$ est réflexive, antisymétrique et transitive ; elle n'est pas symétrique.

    • $\mathcal{R}_{3} = \{(1,2), (2,3)\}$ est antisymétrique, mais ni réflexive, ni symétrique, ni transitive : on a $1 \,\mathcal{R}_{3}\, 2$ et $2 \,\mathcal{R}_{3}\, 3$, mais pas $1 \,\mathcal{R}_{3}\, 3$.

    • $\mathcal{R}_{4} = \{(1,1), (2,2), (1,2), (2,1)\}$ est symétrique et transitive, mais pas réflexive, puisque $3$ n'est pas en relation avec lui-même, ni antisymétrique.

    **2.** On rassemble les résultats. 
    $$\boxed{\mathcal{R}_{1} \text{ est une équivalence, de classes } \{1,2\} \text{ et } \{3\} \ ; \ \mathcal{R}_{2} \text{ est l'ordre total } 1 \preccurlyeq 2 \preccurlyeq 3.}$$
     Les relations $\mathcal{R}_{3}$ et $\mathcal{R}_{4}$ ne sont ni l'un ni l'autre. La relation $\mathcal{R}_{4}$ est le contre-exemple type de l'exercice 29 : symétrique et transitive sans être réflexive.

    **3.** Une relation d'ordre contenant $\mathcal{R}_{3}$ doit contenir les trois boucles, par réflexivité, et le couple $(1,3)$, par transitivité. Ces quatre couples suffisent, puisqu'on obtient $\mathcal{R}_{2}$. 
    $$\boxed{\text{On ajoute } (1,1), (2,2), (3,3) \text{ et } (1,3) \text{, et l'on obtient } \mathcal{R}_{2}.}$$
- id: "ma-02-28"
  feuille: "f-ma-02"
  numero: 28
  partie: "Relations binaires"
  etoiles: 2
  types: [Calcul]
  mots_cles: [relations binaires, ensembles finis, "relations d'équivalence", "relations d'ordre"]
  noeuds: [r-equivalence, n-fini, od-ordre]
  notions: [relation, ensemble-fini, relation-equivalence, relation-ordre]
  page_enonce: 7
  page_corrige: 16
  enonce: |
    Soit $E$ un ensemble fini à $n \geqslant 1$ éléments.

    **1.** Combien existe-t-il de relations binaires sur $E$ ? de relations réflexives ? de relations symétriques ? de relations à la fois réflexives et symétriques ?

    **2.** Dresser la liste des partitions de $\{1,2,3\}$, puis dénombrer celles de $\{1,2,3,4\}$. Combien existe-t-il de relations d'équivalence sur un ensemble à $3$ éléments ? à $4$ éléments ?

    **3.** Combien existe-t-il de relations d'ordre total sur un ensemble à $n$ éléments ?
  corrige: |
    **1.** Une relation sur $E$ est une partie de $E \times E$, qui a $n^{2}$ éléments d'après le lemme 6 du cours. Une relation réflexive contient obligatoirement les $n$ couples $(x,x)$ et choisit librement les $n^{2} - n$ autres. Une relation symétrique est déterminée par les couples $(x,y)$ avec $x \leqslant y$, pour une numérotation fixée de $E$ : il y en a $n + \frac{n(n-1)}{2} = \frac{n(n+1)}{2}$. Si elle est de plus réflexive, il ne reste à choisir que les $\frac{n(n-1)}{2}$ paires $\{x,y\}$ avec $x \neq y$. 
    $$\boxed{2^{n^{2}} \text{ relations,} \quad 2^{n^{2} - n} \text{ réflexives,} \quad 2^{n(n+1)/2} \text{ symétriques,} \quad 2^{n(n-1)/2} \text{ réflexives et symétriques}}$$

    **2.** Les partitions de $\{1,2,3\}$ sont 
    $$\big\{\{1,2,3\}\big\},\quad \big\{\{1\},\{2,3\}\big\},\quad \big\{\{2\},\{1,3\}\big\},\quad \big\{\{3\},\{1,2\}\big\},\quad \big\{\{1\},\{2\},\{3\}\big\}.$$
     Pour $\{1,2,3,4\}$, on classe les partitions selon la taille de leurs parties :

    • une seule partie à $4$ éléments : $1$ partition ;

    • une partie à $3$ éléments et un singleton : $4$ partitions, selon le singleton ;

    • deux paires : $3$ partitions, selon le partenaire de $1$ ;

    • une paire et deux singletons : $6$ partitions, selon la paire ;

    • quatre singletons : $1$ partition.

    D'après le cours, les relations d'équivalence sur un ensemble correspondent exactement à ses partitions : à une relation on associe l'ensemble de ses classes, et à une partition la relation « appartenir à la même partie » (proposition 8). 
    $$\boxed{\text{Relations d'équivalence : } 5 \text{ sur un ensemble à } 3 \text{ éléments, } 15 \text{ sur un ensemble à } 4 \text{ éléments}}$$
     Ces nombres, $1, 2, 5, 15, 52, \dots$, sont les *nombres de Bell*.

    **3.** Un ordre total sur $E$ revient à ranger les éléments de $E$ du plus petit au plus grand : on choisit le plus petit élément ($n$ choix), puis le plus petit des restants ($n - 1$ choix), et ainsi de suite. 
    $$\boxed{n! \text{ ordres totaux}}$$
- id: "ma-02-29"
  feuille: "f-ma-02"
  numero: 29
  partie: "Relations binaires"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [relations binaires, "relations d'équivalence", "relations d'ordre"]
  noeuds: [r-equivalence, od-ordre]
  notions: [relation, relation-equivalence, relation-ordre]
  page_enonce: 7
  page_corrige: 17
  enonce: |
    **1.** Un élève propose la démonstration suivante : *« Soit $\mathcal{R}$ une relation symétrique et transitive sur $E$, et soit $x \in E$. Si $x \,\mathcal{R}\, y$, alors $y \,\mathcal{R}\, x$ par symétrie, donc $x \,\mathcal{R}\, x$ par transitivité. La relation $\mathcal{R}$ est donc réflexive. »* Localiser l'erreur et donner un contre-exemple. Quelle hypothèse supplémentaire rend le raisonnement correct ?

    **2.** Montrer qu'une relation sur $E$ qui est à la fois une relation d'équivalence et une relation d'ordre est la relation d'égalité.

    **3.** Soit $\mathcal{R}$ une relation réflexive et transitive sur $E$, que l'on appelle un *préordre*. On pose $x \sim y \iff (x \,\mathcal{R}\, y \ \mathrm{et}\ y \,\mathcal{R}\, x)$. Montrer que $\sim$ est une relation d'équivalence. Que donne cette construction pour la divisibilité sur $\mathbb{Z}$ ?
  corrige: |
    **1.** L'erreur est dans le « Si $x \,\mathcal{R}\, y$ » : rien n'assure l'existence d'un tel $y$. Le raisonnement montre seulement que tout élément en relation avec *au moins un* élément est en relation avec lui-même. La relation $\mathcal{R}_{4}$ de l'exercice 27 est un contre-exemple, de même que la relation vide sur un ensemble non vide. 
    $$\boxed{\text{Le raisonnement devient correct si l'on suppose } \forall x \in E,\ \exists y \in E,\ x \,\mathcal{R}\, y.}$$

    **2.** Soit $\mathcal{R}$ une telle relation. Si $x \,\mathcal{R}\, y$, alors $y \,\mathcal{R}\, x$ par symétrie, donc $x = y$ par antisymétrie. Réciproquement, $x \,\mathcal{R}\, x$ pour tout $x$, par réflexivité. 
    $$\boxed{x \,\mathcal{R}\, y \iff x = y}$$

    **3.** La relation $\sim$ est réflexive, car $\mathcal{R}$ l'est ; elle est symétrique par construction. Si $x \sim y$ et $y \sim z$, alors $x \,\mathcal{R}\, y$ et $y \,\mathcal{R}\, z$, donc $x \,\mathcal{R}\, z$, et de même $z \,\mathcal{R}\, x$ : elle est transitive. 
    $$\boxed{\sim \text{ est une relation d'équivalence.}}$$
     Pour la divisibilité sur $\mathbb{Z}$, $a \mid b$ et $b \mid a$ équivaut à $|a| = |b|$. 
    $$\boxed{a \sim b \iff b = \pm a, \text{ et les classes sont les } \{a, -a\}.}$$
     La divisibilité n'est pas un ordre sur $\mathbb{Z}$, faute d'antisymétrie, mais elle le devient sur l'ensemble des classes, que l'on peut identifier à $\mathbb{N}$ : c'est pourquoi on la restreint à $\mathbb{N}$ dans le cours.
- id: "ma-02-30"
  feuille: "f-ma-02"
  numero: 30
  partie: "Relations d'équivalence"
  etoiles: 1
  types: [Démonstration]
  mots_cles: ["relations d'équivalence", ensembles finis]
  noeuds: [r-equivalence, n-fini]
  notions: [relation-equivalence, ensemble-fini]
  page_enonce: 8
  page_corrige: 17
  enonce: |
    Montrer que chacune des relations suivantes est une relation d'équivalence, et décrire ses classes, en les dessinant lorsqu'il s'agit de parties du plan.

    **1.** Sur $\mathbb{R}^{2}$ : $(x,y) \,\mathcal{R}\, (x',y') \iff x = x'$.

    **2.** Sur $\mathbb{R}^{2}$ : $(x,y) \,\mathcal{R}\, (x',y') \iff x^{2} + y^{2} = x'^{2} + y'^{2}$.

    **3.** Sur $\mathbb{R}$ : $x \,\mathcal{R}\, y \iff x^{2} - y^{2} = x - y$. Combien chaque classe a-t-elle d'éléments ?

    **4.** Sur $\mathbb{R}^{*}$ : $x \,\mathcal{R}\, y \iff xy > 0$.
  corrige: |
    Les quatre relations sont de la même forme : $x \,\mathcal{R}\, y \iff \phi(x) = \phi(y)$, pour une application $\phi$ bien choisie. Une telle relation est toujours une relation d'équivalence, car l'égalité est réflexive, symétrique et transitive. Sa classe de $x$ est l'image réciproque $\phi^{-1}\big(\{\phi(x)\}\big)$, ensemble des éléments qui ont la même image que $x$.

    **1.** Avec $\phi(x,y) = x$, la classe de $(x_{0},y_{0})$ est la droite verticale d'équation $x = x_{0}$.

    **2.** Avec $\phi(x,y) = x^{2} + y^{2}$, la classe de $(x_{0},y_{0})$ est le cercle de centre $O$ passant par ce point, réduit à $\{O\}$ si $(x_{0},y_{0}) = (0,0)$.

    ![Figure](documents/figures/1829e7713e67c2b1.svg)

    Dans les deux cas, les classes découpent le plan en morceaux disjoints qui le recouvrent : des droites parallèles à gauche, des cercles concentriques et l'origine à droite. La classe du point marqué est tracée en ocre.

    **3.** On a $x^{2} - y^{2} = x - y \iff x^{2} - x = y^{2} - y$ : c'est la forme précédente avec $\phi(x) = x^{2} - x$. De plus, 
    $$x^{2} - y^{2} - (x - y) = (x - y)(x + y - 1),$$
     donc $y \,\mathcal{R}\, x$ si et seulement si $y = x$ ou $y = 1 - x$. 
    $$\boxed{\text{La classe de } x \text{ est } \{x, 1 - x\} : \text{ deux éléments, sauf pour } x = \tfrac{1}{2}, \text{ dont la classe est } \{\tfrac{1}{2}\}.}$$

    **4.** Pour $x$ et $y$ non nuls, $xy > 0$ si et seulement si $x$ et $y$ ont le même signe : c'est la forme précédente, où $\phi(x)$ est le signe de $x$. 
    $$\boxed{\text{Il y a deux classes : } \mathbb{R}_{+}^{*} \text{ et } \mathbb{R}_{-}^{*}.}$$
     *À retenir :* « avoir la même image par $\phi$ » est la manière la plus rapide de démontrer qu'une relation est une équivalence. Toute relation d'équivalence est d'ailleurs de cette forme, avec pour $\phi$ l'application qui associe à chaque élément sa classe.
- id: "ma-02-31"
  feuille: "f-ma-02"
  numero: 31
  partie: "Relations d'équivalence"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["relations d'équivalence", congruences]
  noeuds: [r-equivalence, z-zn]
  notions: [relation-equivalence]
  page_enonce: 8
  page_corrige: 18
  enonce: |
    **1.** Résoudre dans $\mathbb{R}$ les équations suivantes, puis donner leurs solutions dans $[0\,,2\pi[$ : 
    $$\text{(a)}\ \ 5x \equiv x + \frac{\pi}{2}\ [2\pi] \qquad\qquad \text{(b)}\ \ \cos(3x) = \cos(x).$$

    **2.** Soit $x$ et $y$ deux réels tels que $2x \equiv 2y \ [2\pi]$. A-t-on $x \equiv y \ [2\pi]$ ? Que peut-on affirmer ?

    **3.** Déterminer les deux derniers chiffres de l'écriture décimale de $3^{2026}$.

    **4.** Montrer que, pour tout $n \in \mathbb{N}$, l'entier $3^{2n+1} + 2^{n+2}$ est divisible par $7$.
  corrige: |
    **1.** **(a)** On retranche $x$, ce qui est licite, puis l'on divise l'égalité $4x = \frac{\pi}{2} + 2k\pi$ par $4$, en divisant aussi le module : 
    $$5x \equiv x + \frac{\pi}{2} \ [2\pi] \iff 4x \equiv \frac{\pi}{2} \ [2\pi] \iff x \equiv \frac{\pi}{8} \ \Big[\frac{\pi}{2}\Big].$$

    $$\boxed{\text{Solutions dans } [0\,,2\pi[ : \ \frac{\pi}{8},\ \frac{5\pi}{8},\ \frac{9\pi}{8},\ \frac{13\pi}{8}}$$
     **(b)** D'après le cours, $\cos a = \cos b$ si et seulement si $a \equiv b$ ou $a \equiv -b$ modulo $2\pi$. Donc 
    $$\cos(3x) = \cos(x) \iff \big(2x \equiv 0 \ [2\pi] \ \mathrm{ou}\ 4x \equiv 0 \ [2\pi]\big) \iff \Big(x \equiv 0 \ [\pi] \ \mathrm{ou}\ x \equiv 0 \ \Big[\frac{\pi}{2}\Big]\Big).$$
     Un multiple de $\pi$ est un multiple de $\frac{\pi}{2}$, donc la première condition est contenue dans la seconde. 
    $$\boxed{\cos(3x) = \cos(x) \iff x \equiv 0 \ \Big[\frac{\pi}{2}\Big] \qquad \text{Solutions dans } [0\,,2\pi[ : \ 0,\ \frac{\pi}{2},\ \pi,\ \frac{3\pi}{2}}$$

    **2.** On a $2x \equiv 2y \ [2\pi]$ si et seulement si $2(y - x) = 2k\pi$, soit $y - x = k\pi$, pour un entier $k$. 
    $$\boxed{2x \equiv 2y \ [2\pi] \iff x \equiv y \ [\pi]}$$
     On n'a pas $x \equiv y \ [2\pi]$ en général : $x = 0$ et $y = \pi$ en fournissent un contre-exemple. C'est le piège signalé dans le cours : diviser une congruence réelle oblige à diviser le module.

    **3.** On cherche le reste de $3^{2026}$ modulo $100$. On calcule 
    $$3^{10} = 59\,049 \equiv 49 \ [100] \qquad\text{puis}\qquad 3^{20} \equiv 49^{2} = 2401 \equiv 1 \ [100].$$
     Comme $2026 = 20 \times 101 + 6$, la compatibilité avec le produit (proposition 10) donne 
    $$3^{2026} = \big(3^{20}\big)^{101} \times 3^{6} \equiv 1 \times 729 \equiv 29 \ [100].$$

    $$\boxed{\text{Les deux derniers chiffres de } 3^{2026} \text{ sont } 29.}$$

    **4.** On a $3^{2n+1} = 3 \times 9^{n}$ et $2^{n+2} = 4 \times 2^{n}$. Comme $9 \equiv 2 \ [7]$, 
    $$3^{2n+1} + 2^{n+2} \equiv 3 \times 2^{n} + 4 \times 2^{n} = 7 \times 2^{n} \equiv 0 \ [7].$$

    $$\boxed{7 \text{ divise } 3^{2n+1} + 2^{n+2} \text{ pour tout } n \in \mathbb{N}.}$$
     Le calcul évite une récurrence : c'est tout l'intérêt de remplacer un nombre par un représentant plus simple de sa classe.
- id: "ma-02-32"
  feuille: "f-ma-02"
  numero: 32
  partie: "Relations d'équivalence"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["relations d'équivalence"]
  noeuds: [r-equivalence]
  notions: [relation-equivalence]
  page_enonce: 8
  page_corrige: 19
  enonce: |
    On munit $E = \mathbb{Z} \times \mathbb{N}^{*}$ de la relation $(p,q) \,\mathcal{R}\, (p',q') \iff pq' = p'q$.

    **1.** Montrer que $\mathcal{R}$ est une relation d'équivalence, et déterminer la classe de $(1,5)$.

    **2.** Montrer que chaque classe contient un unique couple $(p,q)$ tel que $p$ et $q$ soient premiers entre eux.

    **3.** Expliquer en quoi cette relation « fabrique » les nombres rationnels à partir des entiers.
  corrige: |
    **1.** La réflexivité et la symétrie sont immédiates. Pour la transitivité, supposons $pq' = p'q$ et $p'q'' = p''q'$. On multiplie la première égalité par $q''$ : 
    $$q'\,(pq'') = (p'q'')\,q = p''q'q = q'\,(p''q).$$
     Comme $q' \neq 0$, on simplifie : $pq'' = p''q$. Enfin, $(p,q) \,\mathcal{R}\, (1,5)$ équivaut à $5p = q$. 
    $$\boxed{\overline{(1,5)} = \{(k, 5k) \mid k \in \mathbb{N}^{*}\}}$$
     *Piège :* c'est ici que sert la condition $q \neq 0$. Avec $q' = 0$, on aurait $(1,1) \,\mathcal{R}\, (0,0)$ et $(0,0) \,\mathcal{R}\, (2,1)$, sans avoir $(1,1) \,\mathcal{R}\, (2,1)$.

    **2.** *Existence.* Soit $(p,q)$ et $d = \mathrm{pgcd}(p,q)$, non nul puisque $q \geqslant 1$. Le couple $\big(\frac{p}{d}, \frac{q}{d}\big)$ appartient à $E$, est formé d'entiers premiers entre eux, et vérifie $p \cdot \frac{q}{d} = \frac{p}{d} \cdot q$.

    *Unicité.* Soit $(p,q)$ et $(p',q')$ équivalents, chacun formé d'entiers premiers entre eux. L'entier $q$ divise $p'q = pq'$ et est premier avec $p$ : d'après le lemme de Gauss, il divise $q'$. De même $q'$ divise $q$, et comme ils sont positifs, $q = q'$, puis $p = p'$. 
    $$\boxed{\text{Chaque classe contient un unique représentant irréductible.}}$$

    **3.** La classe de $(p,q)$ rassemble toutes les écritures $\frac{kp}{kq}$ d'une même fraction : $(p,q) \,\mathcal{R}\, (p',q')$ traduit exactement l'égalité $\frac{p}{q} = \frac{p'}{q'}$, mais sans utiliser la division. On peut alors *définir* $\mathbb{Q}$ comme l'ensemble des classes, et $\frac{p}{q}$ comme la classe de $(p,q)$ ; la question 2 justifie l'écriture irréductible. C'est la construction de $\mathbb{Q}$ à partir de $\mathbb{Z}$, sur le modèle de la congruence de Gauss qui fabrique les classes modulo $n$.
- id: "ma-02-33"
  feuille: "f-ma-02"
  numero: 33
  partie: "Relations d'équivalence"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["relations d'équivalence", ensembles finis, équipotence]
  noeuds: [r-equivalence, n-fini, r-equipotence]
  notions: [relation-equivalence, ensemble-fini]
  page_enonce: 8
  page_corrige: 19
  enonce: |
    Soit $E$ un ensemble non vide et $A$ une partie de $E$.

    **1.** On définit sur $\mathcal{P}(E)$ la relation $X \,\mathcal{R}\, Y \iff X \cap A = Y \cap A$. Montrer que c'est une relation d'équivalence, et que chaque classe contient une unique partie incluse dans $A$. Lorsque $E$ a $n$ éléments et $A$ en a $k$, combien y a-t-il de classes, et combien chacune a-t-elle d'éléments ?

    **2.** On définit sur $\mathcal{P}(E)$ la relation $X \sim Y \iff (X = Y \ \mathrm{ou}\ X = \overline{Y})$. Montrer que c'est une relation d'équivalence, décrire ses classes et, lorsque $E$ a $n$ éléments, les dénombrer.
  corrige: |
    **1.** La relation est de la forme $\phi(X) = \phi(Y)$, avec $\phi(X) = X \cap A$ : c'est une équivalence, comme à l'exercice 30. La classe de $X$ contient $X \cap A$, qui est incluse dans $A$, puisque $(X \cap A) \cap A = X \cap A$. Si deux parties $B$ et $B'$ incluses dans $A$ sont équivalentes, alors $B = B \cap A = B' \cap A = B'$.

    Les classes sont donc en bijection avec les parties de $A$. La classe d'une partie $B \subset A$ est formée des parties $B \cup C$, où $C$ décrit les parties de $E \setminus A$. 
    $$\boxed{2^{k} \text{ classes, de } 2^{n-k} \text{ éléments chacune}}$$
     On vérifie que $2^{k} \times 2^{n-k} = 2^{n}$ : c'est le lemme des bergers, appliqué à l'application $X \mapsto X \cap A$ de $\mathcal{P}(E)$ dans $\mathcal{P}(A)$, dont les fibres sont les classes. On retrouve aussi la bijection $\theta$ de l'exercice 23, avec $X = A$ et $Y = E \setminus A$.

    **2.** On note ici $E \setminus Y$ le complémentaire, pour éviter toute confusion avec la notation des classes. La relation est réflexive. Elle est symétrique, car $X = E \setminus Y$ équivaut à $Y = E \setminus X$. Pour la transitivité, supposons $X \sim Y$ et $Y \sim Z$ : chacune des deux relations est une égalité ou un passage au complémentaire, et deux passages au complémentaire se compensent, donc $X = Z$ ou $X = E \setminus Z$. 
    $$\boxed{\text{La classe de } X \text{ est } \{X, E \setminus X\}.}$$
     Comme $E$ n'est pas vide, $X \neq E \setminus X$ : chaque classe a exactement deux éléments. L'application qui associe à chaque partie sa classe a pour fibres les classes elles-mêmes ; son ensemble d'arrivée, l'ensemble des classes, est une partie de l'ensemble fini $\mathcal{P}\big(\mathcal{P}(E)\big)$, donc il est fini. Le lemme des bergers donne $2^{n} = 2 \times (\text{nombre de classes})$. 
    $$\boxed{2^{n} / 2 = 2^{n-1} \text{ classes}}$$
- id: "ma-02-34"
  feuille: "f-ma-02"
  numero: 34
  partie: "Relations d'équivalence"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: ["relations d'équivalence", ensembles finis]
  noeuds: [r-equivalence, n-fini]
  notions: [relation-equivalence, ensemble-fini]
  page_enonce: 8
  page_corrige: 20
  enonce: |
    Soit $\mathcal{R}$ une relation quelconque sur un ensemble $E$. On définit sur $E$ la relation $\sim$ par : $x \sim y$ si $x = y$, ou s'il existe des éléments $x_{0} = x$, $x_{1}$, …, $x_{k} = y$ de $E$, avec $k \geqslant 1$, tels que pour tout $i \in [\![1\,;k]\!]$, on ait $x_{i-1} \,\mathcal{R}\, x_{i}$ ou $x_{i} \,\mathcal{R}\, x_{i-1}$.

    **1.** Montrer que $\sim$ est une relation d'équivalence, et que c'est la plus petite relation d'équivalence qui contient $\mathcal{R}$ : toute relation d'équivalence $\approx$ telle que $x \,\mathcal{R}\, y \Rightarrow x \approx y$ vérifie aussi $x \sim y \Rightarrow x \approx y$.

    **2.** Sur $\mathbb{Z}$, on pose $x \,\mathcal{R}\, y \iff y - x \in \{3, 5\}$. Montrer que $\mathcal{R}$ n'est pas transitive, et déterminer les classes de $\sim$.

    **3.** Même question avec $y - x \in \{4, 6\}$, puis avec $y - x \in \{a, b\}$, où $a$ et $b$ sont deux entiers naturels non nuls.
  corrige: |
    **1.** On appelle *chaîne* de $x$ à $y$ une suite comme dans l'énoncé.

    • *Réflexivité :* $x \sim x$ par définition.

    • *Symétrie :* une chaîne de $x$ à $y$, parcourue à l'envers, est une chaîne de $y$ à $x$, car la condition sur deux termes consécutifs est symétrique.

    • *Transitivité :* si $x \sim y$ et $y \sim z$, on met bout à bout une chaîne de $x$ à $y$ et une chaîne de $y$ à $z$ ; les cas $x = y$ ou $y = z$ sont immédiats.

    Si $x \,\mathcal{R}\, y$, la suite $(x,y)$ est une chaîne : $\sim$ contient $\mathcal{R}$. Soit enfin $\approx$ une équivalence contenant $\mathcal{R}$, et $(x_{0}, \dots, x_{k})$ une chaîne de $x$ à $y$. Pour chaque $i$, on a $x_{i-1} \approx x_{i}$, directement ou grâce à la symétrie de $\approx$. Par transitivité de $\approx$, on obtient $x \approx y$. 
    $$\boxed{\sim \text{ est la plus petite relation d'équivalence contenant } \mathcal{R}.}$$

    **2.** On a $0 \,\mathcal{R}\, 3$ et $3 \,\mathcal{R}\, 6$, mais $6 - 0 = 6 \notin \{3,5\}$ : la relation n'est pas transitive. Pour les classes, on remarque que la chaîne $x,\ x + 3,\ x + 6,\ x + 1$ relie $x$ à $x + 1$, puisque $(x + 6) - (x + 1) = 5$. Donc $x \sim x + 1$ pour tout $x$, et de proche en proche, tous les entiers sont équivalents. 
    $$\boxed{\text{Il n'y a qu'une classe : } \mathbb{Z} \text{ tout entier.}}$$

    **3.** Avec $\{4,6\}$, chaque pas d'une chaîne change $x$ en $x \pm 4$ ou $x \pm 6$, ce qui conserve la parité ; inversement, la chaîne $x,\ x + 6,\ x + 2$ relie $x$ à $x + 2$. 
    $$\boxed{\text{Pour } \{4,6\} : \text{ deux classes, les entiers pairs et les entiers impairs.}}$$
     Dans le cas général, notons $d = \mathrm{pgcd}(a,b)$. Chaque pas d'une chaîne modifie l'entier d'un multiple de $d$, donc $x \sim y$ entraîne $d \mid y - x$. Réciproquement, le théorème de Bézout fournit des entiers $u$ et $v$ tels que $d = au + bv$ ; en faisant $|u|$ pas de $\pm a$ puis $|v|$ pas de $\pm b$, on relie $x$ à $x + d$, et de proche en proche $x$ à $x + md$ pour tout $m \in \mathbb{Z}$. 
    $$\boxed{x \sim y \iff y \equiv x \ [\mathrm{pgcd}(a,b)] : \text{ les classes sont les } \mathrm{pgcd}(a,b) \text{ classes de congruence.}}$$
     On retrouve la question 2, avec $\mathrm{pgcd}(3,5) = 1$, et le début de la question 3, avec $\mathrm{pgcd}(4,6) = 2$.
- id: "ma-02-35"
  feuille: "f-ma-02"
  numero: 35
  partie: "Relations d'ordre"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["relations d'ordre", "relations d'équivalence"]
  noeuds: [od-ordre, r-equivalence]
  notions: [relation-ordre, relation-equivalence]
  page_enonce: 9
  page_corrige: 20
  enonce: |
    Les relations suivantes sont-elles des relations d'ordre ? des relations d'équivalence ? Lorsqu'il s'agit d'un ordre, est-il total ?

    **1.** Sur $\mathbb{Z}$ : $x \,\mathcal{R}\, y \iff x = -y$.

    **2.** Sur $\mathbb{R}$ : $x \,\mathcal{R}\, y \iff \cos^{2} x + \sin^{2} y = 1$.

    **3.** Sur $\mathbb{N}$ : $x \,\mathcal{R}\, y \iff \exists (p,q) \in (\mathbb{N}^{*})^{2},\ y = p\,x^{q}$.

    **4.** Sur $\mathbb{C}$ : $z \,\mathcal{R}\, z' \iff \big(\mathcal{R}e(z) \leqslant \mathcal{R}e(z') \ \mathrm{et}\ \mathcal{I}m(z) \leqslant \mathcal{I}m(z')\big)$.

    **5.** Sur $\mathbb{R}^{\mathbb{R}}$ : $f \,\mathcal{R}\, g \iff \forall x \in [0\,,1],\ f(x) \leqslant g(x)$.

    **6.** Sur $\mathbb{R}^{\mathbb{R}}$ : $f \,\mathcal{R}\, g \iff f(\mathbb{R}) \subset g(\mathbb{R})$.
  corrige: |
    **1.** La relation n'est pas réflexive, puisque $1 \neq -1$. Elle n'est donc ni un ordre ni une équivalence ; elle n'est d'ailleurs pas transitive, puisque $1 \,\mathcal{R}\, (-1)$ et $(-1) \,\mathcal{R}\, 1$, sans avoir $1 \,\mathcal{R}\, 1$. 
    $$\boxed{\text{Ni ordre ni équivalence}}$$

    **2.** Comme $\cos^{2} x = 1 - \sin^{2} x$, on a $x \,\mathcal{R}\, y \iff \sin^{2} x = \sin^{2} y$ : c'est une équivalence, d'après l'exercice 30. Ce n'est pas un ordre, puisque $0 \,\mathcal{R}\, \pi$ et $\pi \,\mathcal{R}\, 0$. 
    $$\boxed{\text{Équivalence, dont la classe de } x \text{ est } \{y \mid y \equiv x \ [\pi] \ \mathrm{ou}\ y \equiv -x \ [\pi]\}}$$

    **3.** La relation est réflexive, avec $p = q = 1$. Elle est transitive : si $y = p\,x^{q}$ et $z = p'\,y^{q'}$, alors $z = p'p^{q'}\,x^{qq'}$. Pour l'antisymétrie, supposons $y = p\,x^{q}$ et $x = p'\,y^{q'}$. Si $x = 0$, alors $y = 0$. Sinon $x \geqslant 1$, donc $y = p\,x^{q} \geqslant x$, et de même $y \geqslant 1$ donne $x \geqslant y$. Enfin, $2$ et $3$ ne sont pas comparables, car aucun des deux n'est de la forme $p$ fois une puissance de l'autre. 
    $$\boxed{\text{Ordre partiel}}$$

    **4.** Les trois propriétés se vérifient composante par composante, à partir de celles de l'ordre sur $\mathbb{R}$. Les complexes $1$ et $\mathrm{i}$ ne sont pas comparables. 
    $$\boxed{\text{Ordre partiel}}$$

    **5.** La relation est réflexive et transitive, mais pas antisymétrique : la fonction nulle et l'indicatrice de $]1\,,+\infty[$ sont en relation dans les deux sens, sans être égales. Elle n'est pas symétrique non plus. 
    $$\boxed{\text{Ni ordre ni équivalence : c'est un préordre}}$$

    **6.** La relation est réflexive et transitive. Elle n'est pas antisymétrique, car $x \mapsto x$ et $x \mapsto x + 1$ ont la même image $\mathbb{R}$, ni symétrique, car $\{0\} \subset \mathbb{R}$ mais $\mathbb{R} \not\subset \{0\}$. 
    $$\boxed{\text{Ni ordre ni équivalence : c'est un préordre}}$$
     *Attention :* l'erreur la plus répandue est de conclure trop vite qu'une relation « qui ressemble à $\leqslant$ » est un ordre. Les relations 5 et 6 ne comparent qu'une partie de l'information sur les fonctions, d'où le défaut d'antisymétrie ; l'exercice 29 montre comment en tirer une équivalence.
- id: "ma-02-36"
  feuille: "f-ma-02"
  numero: 36
  partie: "Relations d'ordre"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["relations d'ordre", ensembles finis, équipotence, majorants et borne supérieure]
  noeuds: [od-ordre, n-fini, r-equipotence, od-majorants]
  notions: [relation-ordre, ensemble-fini, majorant, borne-superieure]
  page_enonce: 9
  page_corrige: 21
  enonce: |
    Soit $(E, \preccurlyeq)$ un ensemble ordonné et $A$ une partie de $E$. On appelle *borne supérieure* de $A$ le plus petit élément, s'il existe, de l'ensemble des majorants de $A$ ; on le note $\sup A$. On définit de même la borne inférieure $\inf A$.

    **1.** Montrer que $A$ possède un plus grand élément si et seulement si $A$ possède une borne supérieure qui appartient à $A$.

    **2.** Dans $(\mathbb{N}, \mid)$, dessiner le diagramme de Hasse de l'ensemble des diviseurs de $60$. Déterminer, pour deux entiers $a$ et $b$, la borne supérieure et la borne inférieure de $\{a, b\}$.

    **3.** Dans $(\mathbb{N} \setminus \{0,1\}, \mid)$, quels sont les éléments qui ne majorent aucun autre élément que lui-même ? Cet ensemble ordonné possède-t-il un plus petit élément ?

    **4.** Dans $(\mathcal{P}(E), \subset)$, montrer que toute famille $(A_{i})_{i \in I}$ de parties possède une borne supérieure et une borne inférieure, que l'on déterminera.
  corrige: |
    **1.** Supposons que $A$ ait un plus grand élément $M$. C'est un majorant de $A$, et tout majorant $m$ de $A$ vérifie $M \preccurlyeq m$, puisque $M \in A$. Donc $M$ est le plus petit des majorants : $M = \sup A$, qui appartient à $A$. Réciproquement, si $\sup A$ existe et appartient à $A$, c'est un élément de $A$ qui majore $A$, donc son plus grand élément. 
    $$\boxed{\max A \text{ existe} \iff \big(\sup A \text{ existe et } \sup A \in A\big), \text{ et alors } \max A = \sup A.}$$

    **2.** Les diviseurs de $60 = 2^{2} \cdot 3 \cdot 5$ sont les $2^{a}3^{b}5^{c}$ avec $a \in \{0,1,2\}$ et $b$, $c \in \{0,1\}$. Dans le diagramme de Hasse, on relie $d$ à $d'$ lorsque $d'/d$ est un nombre premier.

    ![Figure](documents/figures/dbc5ca4afe91ca24.svg)

    Le diagramme a la forme d'un prisme : trois niveaux pour la puissance de $2$, et un carré pour les facteurs $3$ et $5$. On y lit par exemple que les majorants communs de $4$ et $6$ sont $12$ et $60$, et que le plus petit est $12$.

    Pour deux entiers $a$ et $b$, les majorants de $\{a,b\}$ sont leurs multiples communs ; d'après le cours de mathématiques expertes, ce sont exactement les multiples de $\mathrm{ppcm}(a,b)$, qui est donc le plus petit d'entre eux pour la divisibilité. De même, les minorants sont les diviseurs communs, qui sont exactement les diviseurs de $\mathrm{pgcd}(a,b)$. 
    $$\boxed{\sup\{a,b\} = \mathrm{ppcm}(a,b) \qquad \inf\{a,b\} = \mathrm{pgcd}(a,b)}$$

    **3.** Un entier $n \geqslant 2$ ne majore que lui-même si aucun entier $d \geqslant 2$ autre que $n$ ne divise $n$ : ce sont les éléments *minimaux*. 
    $$\boxed{\text{Ce sont les nombres premiers.}}$$
     Il n'y a pas de plus petit élément : il diviserait $2$ et $3$, donc leur $\mathrm{pgcd}$, qui vaut $1$. On a donc une infinité d'éléments minimaux, mais aucun plus petit élément : dans un ordre partiel, « minimal » et « plus petit » sont deux notions bien différentes.

    **4.** Une partie $M$ majore tous les $A_{i}$ si et seulement si elle contient leur réunion, et une partie $m$ les minore si et seulement si elle est contenue dans leur intersection. 
    $$\boxed{\sup_{i \in I} A_{i} = \bigcup_{i \in I} A_{i} \qquad \inf_{i \in I} A_{i} = \bigcap_{i \in I} A_{i}}$$
     Pour la famille vide, la borne supérieure est $\varnothing$ et la borne inférieure est $E$ : tout élément de $\mathcal{P}(E)$ majore et minore la famille vide.
- id: "ma-02-37"
  feuille: "f-ma-02"
  numero: 37
  partie: "Relations d'ordre"
  etoiles: 3
  types: [Démonstration]
  mots_cles: ["relations d'ordre", ensembles finis, majorants et borne supérieure]
  noeuds: [od-ordre, n-fini, od-majorants]
  notions: [relation-ordre, ensemble-fini, majorant, borne-superieure]
  page_enonce: 9
  page_corrige: 22
  enonce: |
    On définit sur $\mathbb{N}^{2}$ l'ordre lexicographique : $(a,b) \preccurlyeq (c,d) \iff \big(a < c \ \mathrm{ou}\ (a = c \ \mathrm{et}\ b \leqslant d)\big)$.

    **1.** Montrer que $\preccurlyeq$ est une relation d'ordre total. L'ensemble $\mathbb{N}^{2}$ possède-t-il un plus grand élément ?

    **2.** Les parties $A = \{(p,p) \mid p \in \mathbb{N}\}$ et $B = \{(2, 10p) \mid p \in \mathbb{N}\}$ sont-elles majorées ? Ont-elles un plus grand élément ? une borne supérieure, au sens de l'exercice 36 ?

    **3.** Montrer que toute partie non vide de $\mathbb{N}^{2}$ possède un plus petit élément.

    **4.** Existe-t-il une suite strictement décroissante d'éléments de $(\mathbb{N}^{2}, \preccurlyeq)$ ? Comparer avec l'exercice 35 de la feuille du chapitre 1.
  corrige: |
    **1.** *Réflexivité :* $a = a$ et $b \leqslant b$. *Antisymétrie :* si $(a,b) \preccurlyeq (c,d)$ et $(c,d) \preccurlyeq (a,b)$, alors $a \leqslant c$ et $c \leqslant a$, donc $a = c$, puis $b \leqslant d$ et $d \leqslant b$. *Transitivité :* si $(a,b) \preccurlyeq (c,d) \preccurlyeq (e,f)$ et si l'une des deux inégalités entre premières composantes est stricte, alors $a < e$ ; sinon $a = c = e$ et $b \leqslant d \leqslant f$. *Totalité :* si $a \neq c$, l'un des deux est plus petit ; si $a = c$, on compare $b$ et $d$. 
    $$\boxed{\preccurlyeq \text{ est un ordre total, sans plus grand élément, car } (a,b) \prec (a + 1, 0).}$$

    **2.** Un majorant $(c,d)$ de $A$ vérifierait $c \geqslant p$ pour tout $p$ : la partie $A$ n'est pas majorée. La partie $B$ est majorée par $(3,0)$. Elle n'a pas de plus grand élément, car $(2,10p) \prec (2, 10(p+1))$. Ses majorants sont les couples $(c,d)$ avec $c \geqslant 3$ : un couple $(2,d)$ est dépassé par $(2, 10p)$ dès que $10p > d$. 
    $$\boxed{A \text{ n'est pas majorée ; } B \text{ n'a pas de plus grand élément, mais } \sup B = (3,0) \notin B.}$$
     Le couple $(3,0)$ vient « juste après » tous les $(2,b)$ : entre les deux, il n'y a rien, bien qu'il y ait une infinité d'éléments au-dessous de $(3,0)$.

    **3.** Soit $P$ une partie non vide de $\mathbb{N}^{2}$. L'ensemble des premières composantes de ses éléments est une partie non vide de $\mathbb{N}$, qui a un plus petit élément $a_{0}$. Parmi les éléments de $P$ de première composante $a_{0}$, on choisit celui dont la seconde composante $b_{0}$ est la plus petite. Pour tout $(a,b) \in P$, on a $a > a_{0}$, ou $a = a_{0}$ et $b \geqslant b_{0}$. 
    $$\boxed{(a_{0}, b_{0}) \text{ est le plus petit élément de } P.}$$

    **4.** S'il existait une suite strictement décroissante $(u_{n})$, l'ensemble de ses termes aurait un plus petit élément $u_{n_{0}}$, d'après la question 3. Or $u_{n_{0}+1} \prec u_{n_{0}}$ : c'est absurde. 
    $$\boxed{\text{Il n'existe pas de suite strictement décroissante dans } (\mathbb{N}^{2}, \preccurlyeq).}$$
     C'est le même argument qu'à l'exercice 35 de la feuille du chapitre 1 pour $\mathbb{N}$. Il est ici plus surprenant : au-dessous de $(1,0)$, il y a une infinité d'éléments, les $(0,b)$. Une suite peut descendre aussi longtemps qu'elle veut, mais toute descente finit par s'arrêter.
- id: "ma-02-38"
  feuille: "f-ma-02"
  numero: 38
  partie: "Relations d'ordre"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: ["relations d'ordre", ensembles finis]
  noeuds: [od-ordre, n-fini]
  notions: [relation-ordre, ensemble-fini]
  page_enonce: 10
  page_corrige: 22
  enonce: |
    On munit $E = \mathbb{R}^{\mathbb{R}}$ de la relation $f \preccurlyeq g \iff \forall x \in \mathbb{R},\ f(x) \leqslant g(x)$.

    **1.** Montrer que $\preccurlyeq$ est une relation d'ordre. Est-elle totale ?

    **2.** Pour $m > 0$, on pose $\varphi_{m} : x \mapsto \mathrm{e}^{mx}$, et $U = \{\varphi_{m} \mid m > 0\}$. Deux éléments distincts de $U$ sont-ils comparables ? La partie $U$ est-elle minorée ? majorée ?

    **3.** Déterminer l'ensemble des minorants de $U$, puis montrer que $U$ admet une borne inférieure, au sens de l'exercice 36, que l'on précisera. Appartient-elle à $U$ ?
  corrige: |
    **1.** Les trois propriétés se vérifient point par point, à partir de celles de l'ordre sur $\mathbb{R}$. L'ordre n'est pas total : les fonctions $x \mapsto x$ et $x \mapsto -x$ ne sont pas comparables, la première étant plus grande en $1$ et plus petite en $-1$. 
    $$\boxed{\preccurlyeq \text{ est un ordre partiel.}}$$

    **2.** Soit $0 < m < m'$. Pour $x > 0$, $\mathrm{e}^{mx} < \mathrm{e}^{m'x}$, et pour $x < 0$, $\mathrm{e}^{mx} > \mathrm{e}^{m'x}$ : les deux fonctions ne sont pas comparables. La fonction nulle minore $U$. Un majorant $g$ vérifierait $g(1) \geqslant \mathrm{e}^{m}$ pour tout $m > 0$, ce qui est impossible. 
    $$\boxed{\text{Deux éléments distincts de } U \text{ ne sont pas comparables ; } U \text{ est minorée, non majorée.}}$$

    **3.** Une fonction $g$ minore $U$ si et seulement si, pour tout $x$, $g(x)$ minore l'ensemble $\{\mathrm{e}^{mx} \mid m > 0\}$.

    • Pour $x \geqslant 0$, cet ensemble est contenu dans $[1\,,+\infty[$, et il contient des valeurs aussi proches de $1$ que l'on veut, en prenant $m$ petit. Donc $g(x) \leqslant 1$.

    • Pour $x < 0$, il est contenu dans $]0\,,+\infty[$, et contient des valeurs aussi proches de $0$ que l'on veut, en prenant $m$ grand. Donc $g(x) \leqslant 0$.

    Notons $\varphi$ la fonction qui vaut $1$ sur $\mathbb{R}_{+}$ et $0$ sur $\mathbb{R}_{-}^{*}$. Les minorants de $U$ sont exactement les fonctions $g \preccurlyeq \varphi$, et $\varphi$ elle-même est un minorant. 
    $$\boxed{\inf U = \varphi = \mathbf{1}_{\mathbb{R}_{+}}, \text{ qui n'appartient pas à } U.}$$

    ![Figure](documents/figures/0231d63c2ce0a0ee.svg)

    Les courbes de $U$, en bleu pétrole, se resserrent vers la droite $y = 1$ à droite de l'axe et vers l'axe des abscisses à gauche quand $m$ varie. Leur borne inférieure, en ocre, est discontinue en $0$, alors que toutes les fonctions de $U$ sont continues.
- id: "ma-02-39"
  feuille: "f-ma-02"
  numero: 39
  partie: "Relations d'ordre"
  etoiles: 3
  types: [Démonstration]
  mots_cles: ["relations d'ordre", équipotence, point fixe]
  noeuds: [od-ordre, r-equipotence, od-tarski]
  notions: [relation-ordre]
  page_enonce: 10
  page_corrige: 23
  enonce: |
    Soit $E$ un ensemble et $\Phi : \mathcal{P}(E) \to \mathcal{P}(E)$ une application *croissante* pour l'inclusion : $X \subset Y \Rightarrow \Phi(X) \subset \Phi(Y)$. On note $\mathcal{F} = \{X \in \mathcal{P}(E) \mid \Phi(X) \subset X\}$ et $A = \bigcap_{X \in \mathcal{F}} X$.

    **1.** Montrer que $\mathcal{F}$ est non vide, puis que $\Phi(A) \subset A$.

    **2.** Montrer que $\Phi(A) \in \mathcal{F}$, et en déduire que $\Phi(A) = A$.

    **3.** Montrer que $A$ est le plus petit point fixe de $\Phi$ : si $\Phi(X) = X$, alors $A \subset X$.

    **4.** Déterminer $A$ lorsque $E = \mathbb{N}$ et $\Phi(X) = \{0\} \cup \{n + 2 \mid n \in X\}$.
  corrige: |
    **1.** On a $\Phi(E) \subset E$, donc $E \in \mathcal{F}$. Soit $X \in \mathcal{F}$. Comme $A \subset X$, la croissance donne $\Phi(A) \subset \Phi(X) \subset X$. La partie $\Phi(A)$ est donc contenue dans tous les éléments de $\mathcal{F}$, donc dans leur intersection. 
    $$\boxed{\Phi(A) \subset A}$$

    **2.** En appliquant $\Phi$ à l'inclusion $\Phi(A) \subset A$, on obtient $\Phi\big(\Phi(A)\big) \subset \Phi(A)$, ce qui signifie $\Phi(A) \in \mathcal{F}$. Donc $A \subset \Phi(A)$, puisque $A$ est l'intersection des éléments de $\mathcal{F}$. 
    $$\boxed{\Phi(A) = A}$$

    **3.** Si $\Phi(X) = X$, alors en particulier $\Phi(X) \subset X$, c'est-à-dire $X \in \mathcal{F}$, et donc $A \subset X$. 
    $$\boxed{A \text{ est le plus petit point fixe de } \Phi.}$$
     C'est le *théorème de Knaster-Tarski* pour l'ensemble ordonné $(\mathcal{P}(E), \subset)$. Il servira à l'exercice 46.

    **4.** Ici $\Phi$ est bien croissante, et une partie $X$ vérifie $\Phi(X) \subset X$ si et seulement si $0 \in X$ et $X$ est stable par $n \mapsto n + 2$. La partie $2\mathbb{N}$ vérifie ces deux conditions. Réciproquement, toute partie $X$ qui les vérifie contient $0$, puis $2$, puis $4$, et par récurrence tous les entiers pairs. 
    $$\boxed{A = 2\mathbb{N}}$$
     On reconnaît une définition « par induction » : $A$ est la plus petite partie qui contient $0$ et qui est stable par $n \mapsto n + 2$.
- id: "ma-02-40"
  feuille: "f-ma-02"
  numero: 40
  partie: "Relations d'ordre"
  etoiles: 3
  types: [Démonstration]
  mots_cles: ["relations d'ordre", ensembles finis]
  noeuds: [od-ordre, n-fini]
  notions: [relation-ordre, ensemble-fini]
  page_enonce: 10
  page_corrige: 23
  enonce: |
    Soit $B$ une partie de $\mathbb{N}^{2}$. On dit qu'un point $(a,b)$ de $B$ est *au sud-ouest* de $B$ si aucun autre point $(a',b')$ de $B$ ne vérifie à la fois $a' \leqslant a$ et $b' \leqslant b$.

    ![Figure](documents/figures/61971e84ec85b4fa.svg)

    La figure représente une partie $B$ de $\mathbb{N}^{2}$ à neuf éléments, placés sur le quadrillage des points à coordonnées entières.

    **1.** Déterminer les points au sud-ouest de la partie $B$ de la figure.

    **2.** Montrer que la relation $(a,b) \leqslant (a',b') \iff (a \leqslant a' \ \mathrm{et}\ b \leqslant b')$ est un ordre partiel sur $\mathbb{N}^{2}$, et traduire « être au sud-ouest » à l'aide de cet ordre.

    **3.** Montrer que toute partie non vide de $\mathbb{N}^{2}$ possède au moins un point au sud-ouest.

    **4.** Montrer que toute partie non vide de $\mathbb{N}^{2}$ ne possède qu'un nombre fini de points au sud-ouest.
  corrige: |
    **1.** On examine les neuf points. Un point n'est pas au sud-ouest dès qu'un autre point de $B$ est à la fois à sa gauche, au sens large, et au-dessous, au sens large.

    • $(2,6)$ est dominé par $(1,5)$, $(3,3)$ par $(2,3)$, $(5,4)$ par $(4,1)$, $(7,2)$ et $(7,6)$ par $(6,0)$ ;

    • aucun point n'est à la fois au sud et à l'ouest de $(1,5)$, $(2,3)$, $(4,1)$ et $(6,0)$.

    $$\boxed{\text{Les points au sud-ouest sont } (1,5),\ (2,3),\ (4,1) \text{ et } (6,0).}$$

    ![Figure](documents/figures/ee86d2b61f80a64d.svg)

    Les quatre points au sud-ouest, en ocre, dessinent un escalier descendant. Chaque autre point de $B$ se trouve dans la zone teintée, réunion des quarts de plan situés au nord-est des points de l'escalier.

    **2.** Les trois propriétés se vérifient composante par composante. L'ordre est partiel, car $(0,1)$ et $(1,0)$ ne sont pas comparables. Un point de $B$ est au sud-ouest si aucun autre point de $B$ ne lui est inférieur. 
    $$\boxed{\text{Les points au sud-ouest de } B \text{ sont les éléments minimaux de } (B, \leqslant).}$$

    **3.** Soit $B$ une partie non vide. On choisit la plus petite première composante $a_{0}$ des points de $B$, puis la plus petite seconde composante $b_{0}$ des points de $B$ d'abscisse $a_{0}$. Si $(a',b') \in B$ vérifie $a' \leqslant a_{0}$ et $b' \leqslant b_{0}$, alors $a' = a_{0}$ par minimalité de $a_{0}$, puis $b' = b_{0}$ par minimalité de $b_{0}$. 
    $$\boxed{(a_{0}, b_{0}) \text{ est au sud-ouest de } B.}$$
     On a pris le plus petit élément de $B$ pour l'ordre lexicographique de l'exercice 37.

    **4.** Deux points distincts au sud-ouest ne sont pas comparables. Ils n'ont donc pas la même abscisse, et si $(a,b)$ et $(a',b')$ sont au sud-ouest avec $a < a'$, alors $b > b'$, sinon on aurait $(a,b) \leqslant (a',b')$. Rangeons les points au sud-ouest par abscisses croissantes : leurs ordonnées forment une suite strictement décroissante d'entiers naturels. Elle a au plus $b_{0} + 1$ termes, où $b_{0}$ est l'ordonnée du premier point. 
    $$\boxed{\text{Toute partie non vide de } \mathbb{N}^{2} \text{ a un nombre fini, non nul, de points au sud-ouest.}}$$
     C'est le *lemme de Dickson* en dimension $2$ : un ensemble ordonné peut être partiel et pourtant n'avoir, dans chaque partie, qu'un nombre fini d'éléments minimaux.
- id: "ma-02-41"
  feuille: "f-ma-02"
  numero: 41
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [images directes et réciproques, composition, injectivité, surjectivité, bijections, ensembles finis, équipotence, "relations d'équivalence"]
  noeuds: [r-images, r-composition, r-injections, n-fini, r-equipotence, r-equivalence, od-ordre, od-majorants]
  notions: [image-directe, image-reciproque, injection, surjection, bijection, ensemble-fini, relation-equivalence, relation-ordre, majorant, borne-superieure]
  page_enonce: 11
  page_corrige: 24
  enonce: |
    **Vrai ou faux.** Pour chacune des affirmations suivantes, dire si elle est vraie ou fausse et justifier la réponse par une démonstration ou un contre-exemple.

    **1.** Si $f : E \to F$ et $g : F \to G$ sont telles que $g \circ f$ est injective, alors $g$ est injective.

    **2.** Toute application strictement croissante de $\mathbb{N}$ dans $\mathbb{N}$ vérifie $f(n) \geqslant n$ pour tout $n \in \mathbb{N}$.

    **3.** Pour toute application $f : E \to F$ et toutes parties $A$, $B$ de $F$ : $f^{-1}(B \setminus A) = f^{-1}(B) \setminus f^{-1}(A)$.

    **4.** Si $f : E \to E$ est injective et vérifie $f \circ f = f$, alors $f = \mathrm{id}_{E}$.

    **5.** L'application $\mathcal{P}(E) \to \mathcal{P}(E)$, $A \mapsto E \setminus A$, est bijective.

    **6.** Si deux applications $f$, $g : \mathbb{R} \to \mathbb{R}$ vérifient $f \circ g = \mathrm{id}_{\mathbb{R}}$, alors $f$ et $g$ sont bijectives.

    **7.** Sur $\mathbb{R}$, la relation $x \,\mathcal{R}\, y \iff |x - y| \leqslant 1$ est une relation d'équivalence.

    **8.** Toute partie finie non vide d'un ensemble totalement ordonné possède un plus grand élément.

    **9.** Dans $(\mathbb{N}, \mid)$, toute partie non vide possède un plus petit élément.

    **10.** Si $f : E \to F$ est surjective, alors l'application $\mathcal{P}(F) \to \mathcal{P}(E)$, $B \mapsto f^{-1}(B)$, est injective.
  corrige: |
    **1.** **Fausse** D'après la proposition 6 du cours, c'est $f$ qui est alors injective, pas nécessairement $g$. Avec $f : \{0\} \to \{0,1\}$, $0 \mapsto 0$, et $g : \{0,1\} \to \{0\}$, l'application $g \circ f$ est injective, puisque son ensemble de départ est un singleton, mais $g$ ne l'est pas.

    **2.** **Vraie** Par récurrence : $f(0) \geqslant 0$, et si $f(n) \geqslant n$, alors $f(n+1) > f(n) \geqslant n$, donc $f(n+1) \geqslant n + 1$, puisque ce sont des entiers.

    **3.** **Vraie** C'est la question 2 de l'exercice 8 : $x \in f^{-1}(B \setminus A)$ si et seulement si $f(x) \in B$ et $f(x) \notin A$.

    **4.** **Vraie** C'est la question 2 de l'exercice 18 : l'égalité $f(f(x)) = f(x)$ et l'injectivité donnent $f(x) = x$.

    **5.** **Vraie** Cette application $c$ vérifie $c \circ c = \mathrm{id}_{\mathcal{P}(E)}$, puisque $E \setminus (E \setminus A) = A$ : c'est une involution, donc une bijection.

    **6.** **Fausse** L'égalité $f \circ g = \mathrm{id}_{\mathbb{R}}$ entraîne seulement que $g$ est injective et $f$ surjective. Prenons $g = \exp$, et $f(x) = \ln x$ pour $x > 0$, $f(x) = 0$ sinon : on a bien $f \circ g = \mathrm{id}_{\mathbb{R}}$, mais $g$ n'est pas surjective et $f$ n'est pas injective.

    **7.** **Fausse** La relation est réflexive et symétrique, mais pas transitive : $0 \,\mathcal{R}\, 1$ et $1 \,\mathcal{R}\, 2$, alors que $|0 - 2| = 2 > 1$.

    **8.** **Vraie** Par récurrence sur le nombre $n$ d'éléments. Un singleton a un plus grand élément. Si toute partie à $n$ éléments en a un, soit $A$ à $n + 1$ éléments, $a \in A$, et $M$ le plus grand élément de $A \setminus \{a\}$. Comme l'ordre est total, $a$ et $M$ sont comparables, et le plus grand des deux est le plus grand élément de $A$.

    **9.** **Fausse** La partie $\{2,3\}$ n'a pas de plus petit élément, puisque ni $2$ ne divise $3$, ni $3$ ne divise $2$.

    **10.** **Vraie** C'est la question 2 de l'exercice 22.

    $$\boxed{\text{Vraies : 2, 3, 4, 5, 8, 10. \quad Fausses : 1, 6, 7, 9.}}$$
     *Piège :* pour l'affirmation 8, la totalité de l'ordre est indispensable. Dans $(\mathbb{N}^{*}, \mid)$, la partie finie $\{2,3\}$ n'a pas non plus de plus grand élément.
