  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $E$ et $F$ deux ensembles et $f$, $g$ deux applications de $E$ dans $F$. On suppose que 
    $$\forall (x,y) \in E^{2},\quad f(x) = f(y) \ \mathrm{ou}\ g(x) = g(y).$$
     Montrer que l'une au moins des deux applications $f$ et $g$ est constante.
  corrige: |
    Supposons que $f$ ne soit pas constante, et montrons que $g$ l'est. Il existe $a$, $b$ dans $E$ tels que $f(a) \neq f(b)$ ; l'hypothèse appliquée au couple $(a,b)$ donne $g(a) = g(b)$. Soit maintenant $x \in E$ ; on distingue deux cas.

    • Si $f(x) \neq f(a)$, l'hypothèse appliquée à $(x,a)$ donne $g(x) = g(a)$.

    • Si $f(x) = f(a)$, alors $f(x) \neq f(b)$, et l'hypothèse appliquée à $(x,b)$ donne $g(x) = g(b) = g(a)$.

    Dans les deux cas $g(x) = g(a)$. 
    $$\boxed{\text{Si } f \text{ n'est pas constante, alors } g \text{ est constante.}}$$
     *Piège :* l'hypothèse ne dit pas que, pour chaque couple, c'est toujours la même des deux égalités qui est vraie. On ne peut donc pas conclure en une ligne : il faut un point d'appui, le couple $(a,b)$, et une disjonction des cas. La conclusion « $f$ ou $g$ est constante » se démontre en établissant « si $f$ ne l'est pas, alors $g$ l'est », comme au chapitre 1.
- id: "ma-02-05"
  feuille: "f-ma-02"
  numero: 5
  partie: "Image directe et image réciproque"
  etoiles: 1
  types: [Calcul]
  mots_cles: [image directe et image réciproque, images directes et réciproques, bijection réciproque]
  noeuds: [r-images, r-inverses]
  notions: [image-directe, image-reciproque]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    On considère la fonction sinus, de $\mathbb{R}$ dans $\mathbb{R}$.

    **1.** Déterminer les images directes $\sin(\mathbb{R})$, $\sin(\mathbb{R}_{+})$, $\sin([0\,,2\pi])$, $\sin\big([0\,,\frac{\pi}{2}]\big)$ et $\sin\big([-\pi\,,\frac{\pi}{2}]\big)$.

    **2.** Déterminer les images réciproques, par la fonction sinus, des parties $[-1\,,1]$, $[0\,,1]$, $[3\,,4]$, $\{1\}$ et $\{-1\,,1\}$.

    **3.** Pourquoi l'écriture $\sin^{-1}(1)$ est-elle incorrecte, alors que $\sin^{-1}(\{1\})$ a un sens ?
  corrige: |
    **1.** La fonction sinus prend toutes les valeurs de $[-1\,,1]$ sur tout intervalle de longueur $2\pi$, et n'en prend pas d'autre. Sur $[0\,,\frac{\pi}{2}]$, elle croît de $0$ à $1$ ; sur $[-\pi\,,\frac{\pi}{2}]$, elle atteint $-1$ en $-\frac{\pi}{2}$ et $1$ en $\frac{\pi}{2}$. 
    $$\boxed{\sin(\mathbb{R}) = \sin(\mathbb{R}_{+}) = \sin([0\,,2\pi]) = \sin\Big(\Big[-\pi\,,\frac{\pi}{2}\Big]\Big) = [-1\,,1] \qquad \sin\Big(\Big[0\,,\frac{\pi}{2}\Big]\Big) = [0\,,1]}$$
     *Piège :* sur $[-\pi\,,\frac{\pi}{2}]$, les images des bornes sont $0$ et $1$ ; s'en contenter donnerait $[0\,,1]$, ce qui est faux, car la fonction n'est pas monotone sur cet intervalle.

    **2.** On résout les inéquations correspondantes, en se servant du cercle trigonométrique : 
    $$\boxed{\sin^{-1}([-1\,,1]) = \mathbb{R} \qquad \sin^{-1}([0\,,1]) = \bigcup_{k \in \mathbb{Z}} [2k\pi\,,(2k+1)\pi] \qquad \sin^{-1}([3\,,4]) = \varnothing}$$

    $$\boxed{\sin^{-1}(\{1\}) = \Big\{\frac{\pi}{2} + 2k\pi \mid k \in \mathbb{Z}\Big\} \qquad \sin^{-1}(\{-1\,,1\}) = \Big\{\frac{\pi}{2} + k\pi \mid k \in \mathbb{Z}\Big\}}$$

    **3.** L'écriture $\sin^{-1}(1)$ désignerait l'image de $1$ par une application réciproque de la fonction sinus, qui n'existe pas : la fonction sinus n'est pas bijective de $\mathbb{R}$ dans $\mathbb{R}$. En revanche, l'image réciproque d'une partie est définie pour toute application. 
    $$\boxed{\sin^{-1}(\{1\}) \text{ est une partie de } \mathbb{R} \text{, infinie ; } \sin^{-1}(1) \text{ n'a pas de sens.}}$$
- id: "ma-02-06"
  feuille: "f-ma-02"
  numero: 6
  partie: "Image directe et image réciproque"
  etoiles: 1
  types: [Calcul]
  mots_cles: [image directe et image réciproque, images directes et réciproques, injectivité, surjectivité]
  noeuds: [r-images, r-injections]
  notions: [image-directe, image-reciproque, injection, surjection]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    On considère l'application 
    $$\begin{array}{r|ccl} f : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & 2x^{2} - 4x + 1 \end{array}$$

    **1.** Déterminer $f([0\,,1])$, $f(\mathbb{R}_{-})$, $f(\mathbb{R}_{+})$ et $f([-2\,,2])$.

    **2.** Déterminer $f^{-1}(\{1\})$, $f^{-1}(\{-1\})$, $f^{-1}([0\,,1])$ et $f^{-1}([-2\,,1])$.

    **3.** On note $\Phi : \mathcal{P}(\mathbb{R}) \to \mathcal{P}(\mathbb{R})$ l'application $A \mapsto f(A)$. Est-elle injective ? surjective ? On en déterminera l'image.
  corrige: |
    On met d'abord $f$ sous forme canonique : $f(x) = 2(x - 1)^{2} - 1$. La fonction $f$ est décroissante sur $]-\infty\,,1]$, croissante sur $[1\,,+\infty[$, et son minimum vaut $f(1) = -1$.

    **1.** On calcule les images en tenant compte des variations :

    • sur $[0\,,1]$, $f$ décroît de $f(0) = 1$ à $f(1) = -1$ ;

    • sur $\mathbb{R}_{-}$, $f$ décroît de $+\infty$ à $f(0) = 1$, qu'elle atteint ;

    • sur $\mathbb{R}_{+}$, elle atteint son minimum $-1$ en $1$ et tend vers $+\infty$ ;

    • sur $[-2\,,2]$, le minimum est $-1$ et le maximum $f(-2) = 17$, car $f(2) = 1$.

    $$\boxed{f([0\,,1]) = [-1\,,1] \qquad f(\mathbb{R}_{-}) = [1\,,+\infty[ \qquad f(\mathbb{R}_{+}) = [-1\,,+\infty[ \qquad f([-2\,,2]) = [-1\,,17]}$$

    **2.** On résout :

    • $f(x) = 1 \iff (x - 1)^{2} = 1 \iff x \in \{0\,,2\}$ ;

    • $f(x) = -1 \iff x = 1$ ;

    • $0 \leqslant f(x) \leqslant 1 \iff \frac{1}{2} \leqslant (x - 1)^{2} \leqslant 1 \iff \frac{\sqrt{2}}{2} \leqslant |x - 1| \leqslant 1$ ;

    • $-2 \leqslant f(x) \leqslant 1 \iff (x - 1)^{2} \leqslant 1$, la première inégalité étant toujours vraie.

    $$\boxed{f^{-1}(\{1\}) = \{0\,,2\} \qquad f^{-1}(\{-1\}) = \{1\} \qquad f^{-1}([-2\,,1]) = [0\,,2]}$$

    $$\boxed{f^{-1}([0\,,1]) = \Big[0\,,1 - \frac{\sqrt{2}}{2}\Big] \cup \Big[1 + \frac{\sqrt{2}}{2}\,,2\Big]}$$

    **3.** L'application $\Phi$ n'est pas injective, puisque $\Phi(\{0\}) = \Phi(\{2\}) = \{1\}$. Elle n'est pas surjective, puisque toute image $f(A)$ est contenue dans $f(\mathbb{R}) = [-1\,,+\infty[$ : la partie $\{-5\}$ n'est pas atteinte. Inversement, toute partie $B$ de $[-1\,,+\infty[$ est atteinte : comme $f$ prend toutes les valeurs de $[-1\,,+\infty[$, on a $f\big(f^{-1}(B)\big) = B$. 
    $$\boxed{\Phi \text{ n'est ni injective ni surjective, et son image est } \mathcal{P}\big([-1\,,+\infty[\big).}$$
     On retrouve, au niveau des parties, les défauts de $f$ elle-même : l'exercice 22 montrera que c'est un fait général.
- id: "ma-02-07"
  feuille: "f-ma-02"
  numero: 7
  partie: "Image directe et image réciproque"
  etoiles: 2
  types: [Calcul]
  mots_cles: [image directe et image réciproque, images directes et réciproques, injectivité, surjectivité]
  noeuds: [r-images, r-injections]
  notions: [image-directe, image-reciproque, injection, surjection]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    On note $\mathbb{U}$ l'ensemble des nombres complexes de module $1$, et l'on considère l'application 
    $$\begin{array}{r|ccl} f : & \mathbb{C}^{*} & \longrightarrow & \mathbb{C} \\ & z & \longmapsto & z + \dfrac{1}{z} \end{array}$$

    **1.** L'application $f$ est-elle injective ? surjective ?

    **2.** Déterminer $f(\mathbb{R}^{*})$ et $f(\mathbb{U})$.

    **3.** Déterminer $f^{-1}(\mathbb{R})$, et représenter cette partie du plan.
  corrige: |
    **1.** On a $f(2) = f\big(\frac{1}{2}\big) = \frac{5}{2}$ : l'application $f$ n'est pas injective. Pour la surjectivité, soit $w \in \mathbb{C}$. Pour $z \neq 0$, 
    $$f(z) = w \iff z^{2} - wz + 1 = 0.$$
     Cette équation du second degré possède au moins une solution dans $\mathbb{C}$, à condition de savoir que tout nombre complexe possède une racine carrée, ce que l'on admet ici et que le chapitre consacré aux nombres complexes établira. Ses solutions sont non nulles, car leur produit vaut $1$. 
    $$\boxed{f \text{ n'est pas injective ; elle est surjective.}}$$

    **2.** Pour $x > 0$, l'inégalité $x + \frac{1}{x} \geqslant 2$ équivaut à $(x - 1)^{2} \geqslant 0$. Réciproquement, pour $y \geqslant 2$, l'équation $x^{2} - yx + 1 = 0$ a un discriminant $y^{2} - 4 \geqslant 0$ et des racines réelles positives. Par imparité, on obtient les valeurs $\leqslant -2$ sur $\mathbb{R}_{-}^{*}$. Pour $z = \mathrm{e}^{\mathrm{i}\theta} \in \mathbb{U}$, on a $\frac{1}{z} = \mathrm{e}^{-\mathrm{i}\theta}$ et $f(z) = 2\cos\theta$, qui décrit $[-2\,,2]$. 
    $$\boxed{f(\mathbb{R}^{*}) = \,]-\infty\,,-2] \cup [2\,,+\infty[ \qquad f(\mathbb{U}) = [-2\,,2]}$$

    **3.** Écrivons $z = r\mathrm{e}^{\mathrm{i}\theta}$ avec $r > 0$. Alors $\frac{1}{z} = \frac{1}{r}\mathrm{e}^{-\mathrm{i}\theta}$ et 
    $$f(z) = \Big(r + \frac{1}{r}\Big)\cos\theta + \mathrm{i}\Big(r - \frac{1}{r}\Big)\sin\theta.$$
     Ainsi $f(z)$ est réel si et seulement si $r = 1$ ou $\sin\theta = 0$, c'est-à-dire si $z \in \mathbb{U}$ ou $z \in \mathbb{R}^{*}$. 
    $$\boxed{f^{-1}(\mathbb{R}) = \mathbb{R}^{*} \cup \mathbb{U}}$$

    ![Figure](documents/figures/2b23e9d7a9ba65ac.svg)

    La partie $f^{-1}(\mathbb{R})$ est la réunion de l'axe réel privé de l'origine, en bleu ardoise, et du cercle unité, en bleu pétrole : ce sont les seuls points où la partie imaginaire de $z + \frac{1}{z}$ s'annule.
- id: "ma-02-08"
  feuille: "f-ma-02"
  numero: 8
  partie: "Image directe et image réciproque"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [image directe et image réciproque, images directes et réciproques, bijection réciproque]
  noeuds: [r-images, r-inverses]
  notions: [image-directe, image-reciproque]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Soit $f : E \to F$ une application, $A$, $A'$ deux parties de $E$ et $B$, $B'$ deux parties de $F$.

    **1.** Montrer que $A \subset A' \Rightarrow f(A) \subset f(A')$ et que $B \subset B' \Rightarrow f^{-1}(B) \subset f^{-1}(B')$. Les réciproques sont-elles vraies ?

    **2.** Montrer que $f(A) \setminus f(A') \subset f(A \setminus A')$, et que l'inclusion peut être stricte. Comparer avec $f^{-1}(B \setminus B')$ et $f^{-1}(B) \setminus f^{-1}(B')$.

    **3.** Montrer la *formule de projection* : $f\big(A \cap f^{-1}(B)\big) = f(A) \cap B$.
  corrige: |
    **1.** Si $A \subset A'$ et $y \in f(A)$, alors $y = f(x)$ avec $x \in A \subset A'$, donc $y \in f(A')$. Si $B \subset B'$ et $x \in f^{-1}(B)$, alors $f(x) \in B \subset B'$, donc $x \in f^{-1}(B')$. 
    $$\boxed{A \subset A' \Rightarrow f(A) \subset f(A') \qquad B \subset B' \Rightarrow f^{-1}(B) \subset f^{-1}(B')}$$
     Les réciproques sont fausses. Pour la première, prenons $f : \{0,1\} \to \{0\}$, $A = \{0\}$ et $A' = \{1\}$ : $f(A) = f(A') = \{0\}$, mais $A \not\subset A'$. Pour la seconde, prenons $f : \{0\} \to \{0,1\}$, $0 \mapsto 0$, $B = \{1\}$ et $B' = \varnothing$ : $f^{-1}(B) = \varnothing = f^{-1}(B')$, mais $B \not\subset B'$. 
    $$\boxed{\text{Les deux réciproques sont fausses.}}$$
     Elles deviennent vraies si $f$ est injective pour la première, surjective pour la seconde, d'après la proposition 5 du cours.

    **2.** Soit $y \in f(A) \setminus f(A')$ : $y = f(x)$ avec $x \in A$, et $x \notin A'$, sinon $y$ appartiendrait à $f(A')$. Donc $y \in f(A \setminus A')$. Avec $f : x \mapsto x^{2}$ sur $\mathbb{R}$, $A = \mathbb{R}$ et $A' = \{-1\}$, on trouve $f(A) \setminus f(A') = \mathbb{R}_{+} \setminus \{1\}$, alors que $f(A \setminus A') = \mathbb{R}_{+}$, puisque $1 = f(1)$. 
    $$\boxed{f(A) \setminus f(A') \subset f(A \setminus A'), \text{ inclusion stricte en général}}$$
     Pour l'image réciproque, $x \in f^{-1}(B \setminus B') \iff \big(f(x) \in B \ \mathrm{et}\ f(x) \notin B'\big) \iff x \in f^{-1}(B) \setminus f^{-1}(B')$. 
    $$\boxed{f^{-1}(B \setminus B') = f^{-1}(B) \setminus f^{-1}(B')}$$

    **3.** On procède par double inclusion.

    • Si $y = f(x)$ avec $x \in A \cap f^{-1}(B)$, alors $y \in f(A)$ et $y = f(x) \in B$.

    • Si $y \in f(A) \cap B$, il s'écrit $y = f(a)$ avec $a \in A$ ; comme $f(a) = y \in B$, on a $a \in f^{-1}(B)$, donc $y \in f\big(A \cap f^{-1}(B)\big)$.

    $$\boxed{f\big(A \cap f^{-1}(B)\big) = f(A) \cap B}$$
     Pour $A = E$, on retrouve $f\big(f^{-1}(B)\big) = f(E) \cap B$, qui précise la proposition 2 (iii) du cours : l'inclusion $f(f^{-1}(B)) \subset B$ est une égalité exactement lorsque $B \subset f(E)$.
- id: "ma-02-09"
  feuille: "f-ma-02"
  numero: 9
  partie: "Image directe et image réciproque"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [image directe et image réciproque, images directes et réciproques, bijection réciproque]
  noeuds: [r-images, r-inverses]
  notions: [image-directe, image-reciproque]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Soit $f : X \to X$ une application. On dit qu'une partie $A$ de $X$ est *stable* par $f$ si $f(A) \subset A$.

    **1.** Traduire la stabilité à l'aide de l'image réciproque, puis avec des quantificateurs.

    **2.** Déterminer les parties de $\mathbb{N}$ stables par $n \mapsto n + 1$, puis celles qui sont stables par $n \mapsto n + 2$.

    **3.** Montrer qu'une réunion et une intersection quelconques de parties stables sont stables.

    **4.** Le complémentaire d'une partie stable est-il stable ?
  corrige: |
    **1.** La partie $A$ est stable si et seulement si $f(A) \subset A$, ce qui équivaut à $A \subset f^{-1}(A)$ : 
    $$\boxed{A \text{ stable} \iff A \subset f^{-1}(A) \iff \forall x \in A,\ f(x) \in A}$$

    **2.** Pour $f : n \mapsto n + 1$, la partie vide est stable. Soit $A$ une partie stable non vide et $m$ son plus petit élément. Par récurrence, $m + k \in A$ pour tout $k \in \mathbb{N}$, donc $A$ contient $\{n \in \mathbb{N} \mid n \geqslant m\}$, et elle ne contient aucun entier plus petit que $m$. Réciproquement, ces parties sont stables. 
    $$\boxed{\text{Parties stables par } n \mapsto n + 1 : \ \varnothing \text{ et les } \{n \in \mathbb{N} \mid n \geqslant m\}, \ m \in \mathbb{N}.}$$
     Pour $n \mapsto n + 2$, une partie $A$ est stable si et seulement si ses traces sur les entiers pairs et sur les entiers impairs le sont, car $n$ et $n + 2$ ont même parité. Le même raisonnement s'applique à chacune. 
    $$\boxed{A = A_{0} \cup A_{1}, \text{ où } A_{0} \text{ est vide ou formé des pairs } \geqslant a, \text{ et } A_{1} \text{ vide ou formé des impairs } \geqslant b.}$$

    **3.** Soit $(A_{i})_{i \in I}$ une famille de parties stables. D'après la proposition 2 du cours, étendue aux familles, 
    $$f\Big(\bigcup_{i} A_{i}\Big) = \bigcup_{i} f(A_{i}) \subset \bigcup_{i} A_{i} \qquad\text{et}\qquad f\Big(\bigcap_{i} A_{i}\Big) \subset \bigcap_{i} f(A_{i}) \subset \bigcap_{i} A_{i}.$$

    $$\boxed{\text{Réunions et intersections de parties stables sont stables.}}$$

    **4.** Non : la partie $\{n \mid n \geqslant 1\}$ est stable par $n \mapsto n + 1$, mais son complémentaire $\{0\}$ ne l'est pas, puisque $0 \mapsto 1$. 
    $$\boxed{\text{Le complémentaire d'une partie stable n'est pas stable en général.}}$$
     Il l'est cependant lorsque $f$ est bijective et que $A$ est stable par $f$ et par $f^{-1}$.
- id: "ma-02-10"
  feuille: "f-ma-02"
  numero: 10
  partie: "Composition"
  etoiles: 1
  types: [Conjecture, Calcul]
  mots_cles: [composition, ensembles finis]
  noeuds: [r-composition, n-fini]
  notions: [ensemble-fini]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **1.** Pour $f(x) = 3x + 1$ et $g(x) = x^{2} - 1$, définies sur $\mathbb{R}$, calculer $f \circ g$ et $g \circ f$.

    **2.** Écrire chacune des fonctions suivantes comme composée de deux fonctions plus simples, en précisant les ensembles de départ et d'arrivée : 
    $$h_{1} : x \mapsto \sqrt{3x - 1} \qquad h_{2} : x \mapsto \sin\Big(x + \frac{\pi}{2}\Big) \qquad h_{3} : x \mapsto \frac{1}{x + 7} \qquad h_{4} : x \mapsto \mathrm{e}^{-x^{2}}.$$

    **3.** Soit $\begin{array}{r|ccl} u : & \mathbb{R}_{+} & \longrightarrow & \mathbb{R}_{+} \\ & x & \longmapsto & \dfrac{x}{x + 1} \end{array}$. Calculer $u \circ u$ et $u \circ u \circ u$, conjecturer une expression de l'itérée $u^{n}$, puis la démontrer.

    **4.** Soit $\begin{array}{r|ccl} v : & \mathbb{R} \setminus \{1\} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & \dfrac{x + 1}{x - 1} \end{array}$. Vérifier que $v$ est à valeurs dans $\mathbb{R} \setminus \{1\}$, puis calculer $v \circ v$.
  corrige: |
    **1.** On compose dans les deux ordres : 
    $$\boxed{(f \circ g)(x) = 3(x^{2} - 1) + 1 = 3x^{2} - 2 \qquad (g \circ f)(x) = (3x + 1)^{2} - 1 = 9x^{2} + 6x}$$

    **2.** On repère l'opération faite en dernier :

    • $h_{1} = r \circ a$, avec $a : [\frac{1}{3}\,,+\infty[ \ \to \mathbb{R}_{+}$, $x \mapsto 3x - 1$ et $r : \mathbb{R}_{+} \to \mathbb{R}$, $t \mapsto \sqrt{t}$ ;

    • $h_{2} = \sin \circ \tau$, avec $\tau : \mathbb{R} \to \mathbb{R}$, $x \mapsto x + \frac{\pi}{2}$ ; on reconnaît d'ailleurs $h_{2} = \cos$ ;

    • $h_{3} = i \circ \tau'$, avec $\tau' : \mathbb{R} \setminus \{-7\} \to \mathbb{R}^{*}$, $x \mapsto x + 7$ et $i : \mathbb{R}^{*} \to \mathbb{R}$, $t \mapsto \frac{1}{t}$ ;

    • $h_{4} = \exp \circ\, q$, avec $q : \mathbb{R} \to \mathbb{R}$, $x \mapsto -x^{2}$.

    Pour $h_{1}$ et $h_{3}$, le choix des ensembles n'est pas libre : il faut que l'image de la première application tombe dans l'ensemble de départ de la seconde.

    **3.** Pour $x \geqslant 0$ : 
    $$(u \circ u)(x) = \frac{\frac{x}{x+1}}{\frac{x}{x+1} + 1} = \frac{x}{2x + 1}, \qquad (u \circ u \circ u)(x) = \frac{x}{3x + 1}.$$
     Montrons par récurrence que $u^{n}(x) = \frac{x}{nx + 1}$ pour tout $n \geqslant 1$. C'est vrai pour $n = 1$, et si c'est vrai au rang $n$, alors 
    $$u^{n+1}(x) = u\big(u^{n}(x)\big) = \frac{\frac{x}{nx+1}}{\frac{x}{nx+1} + 1} = \frac{x}{x + nx + 1} = \frac{x}{(n+1)x + 1}.$$

    $$\boxed{u^{n}(x) = \frac{x}{nx + 1}}$$
     La formule reste vraie pour $n = 0$, avec $u^{0} = \mathrm{id}$.

    **4.** Si l'on avait $v(x) = 1$, alors $x + 1 = x - 1$, ce qui est absurde. Donc $v$ est à valeurs dans $\mathbb{R} \setminus \{1\}$ et $v \circ v$ a un sens. Pour $x \neq 1$, 
    $$(v \circ v)(x) = \frac{\frac{x+1}{x-1} + 1}{\frac{x+1}{x-1} - 1} = \frac{(x + 1) + (x - 1)}{(x + 1) - (x - 1)} = \frac{2x}{2} = x.$$

    $$\boxed{v \circ v = \mathrm{id}_{\mathbb{R} \setminus \{1\}}}$$
     L'application $v$, vue de $\mathbb{R} \setminus \{1\}$ dans lui-même, est donc une involution : elle est bijective et égale à sa réciproque, comme le montrera l'exercice 17.
- id: "ma-02-11"
  feuille: "f-ma-02"
  numero: 11
  partie: "Composition"
  etoiles: 2
  types: [Calcul]
  mots_cles: [composition]
  noeuds: [r-composition]
  notions: []
  page_enonce: 3
  page_corrige: 7
  enonce: |
    On travaille avec des applications de $\mathbb{R}$ dans $\mathbb{R}$.

    **1.** Déterminer les fonctions affines $f$ telles que $f \circ g = g \circ f$, où $g(x) = 2x + 1$.

    **2.** Déterminer les fonctions $f$ qui commutent avec toutes les translations, c'est-à-dire telles que $f \circ \tau_{a} = \tau_{a} \circ f$ pour tout $a \in \mathbb{R}$, où $\tau_{a}(x) = x + a$.

    **3.** Déterminer les fonctions $f$ qui commutent avec *toutes* les applications de $\mathbb{R}$ dans $\mathbb{R}$.
  corrige: |
    **1.** Soit $f(x) = ax + b$. Pour tout réel $x$, 
    $$(f \circ g)(x) = 2ax + a + b \qquad\text{et}\qquad (g \circ f)(x) = 2ax + 2b + 1.$$
     Ces deux fonctions affines sont égales si et seulement si $a + b = 2b + 1$, c'est-à-dire $b = a - 1$. 
    $$\boxed{f(x) = ax + a - 1 = a(x + 1) - 1, \ a \in \mathbb{R}}$$
     Ce sont exactement les fonctions affines qui fixent $-1$, l'unique point fixe de $g$ ; ce n'est pas un hasard, puisque si $f$ commute avec $g$, alors $g\big(f(-1)\big) = f\big(g(-1)\big) = f(-1)$, et $f(-1)$ est un point fixe de $g$.

    **2.** Si $f(x + a) = f(x) + a$ pour tous réels $x$ et $a$, alors, avec $x = 0$, on obtient $f(a) = f(0) + a$ pour tout $a$. Réciproquement, les fonctions $x \mapsto x + c$ conviennent. 
    $$\boxed{f(x) = x + c, \ c \in \mathbb{R}}$$

    **3.** Si $f$ commute avec toutes les applications, elle commute en particulier avec chaque application constante $\gamma_{c} : x \mapsto c$. Or $(f \circ \gamma_{c})(x) = f(c)$ et $(\gamma_{c} \circ f)(x) = c$ : donc $f(c) = c$ pour tout réel $c$. Réciproquement, l'identité commute avec toute application. 
    $$\boxed{f = \mathrm{id}_{\mathbb{R}}}$$
     *À retenir :* pour exploiter une hypothèse universelle portant sur des applications, on la teste sur des applications très simples, ici les constantes. De même, pour comparer deux parties, on les teste souvent sur des singletons.
- id: "ma-02-12"
  feuille: "f-ma-02"
  numero: 12
  partie: "Injections, surjections, bijections"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["injections, surjections, bijections", composition, injectivité, surjectivité, bijections]
  noeuds: [r-injections, r-composition]
  notions: [injection, surjection, bijection]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Les applications suivantes sont-elles injectives ? surjectives ? bijectives ?

    $$\begin{array}{ll} \begin{array}{r|ccl} f_{1} : & \mathbb{N} & \longrightarrow & \mathbb{N} \\ & n & \longmapsto & n + 1 \end{array} & \begin{array}{r|ccl} f_{2} : & \mathbb{Z} & \longrightarrow & \mathbb{Z} \\ & n & \longmapsto & n + 1 \end{array} \\[5mm] \begin{array}{r|ccl} f_{3} : & \mathbb{Z} & \longrightarrow & \mathbb{Z} \\ & n & \longmapsto & n + (-1)^{n} \end{array} & \begin{array}{r|ccl} f_{4} : & \mathbb{R}^{2} & \longrightarrow & \mathbb{R}^{2} \\ & (x,y) & \longmapsto & (x + y,\ x - y) \end{array} \\[5mm] \begin{array}{r|ccl} f_{5} : & \mathbb{R}^{\mathbb{R}} & \longrightarrow & \mathbb{R} \\ & f & \longmapsto & f(0) \end{array} & \begin{array}{r|ccl} f_{6} : & \mathcal{P}(\mathbb{R}) & \longrightarrow & \mathcal{P}(\mathbb{R}_{+}) \\ & X & \longmapsto & X \cap \mathbb{R}_{+} \end{array} \\[5mm] \begin{array}{r|ccl} f_{7} : & \mathbb{N} & \longrightarrow & \mathbb{N} \\ & n & \longmapsto & \lfloor n/2 \rfloor \end{array} & \begin{array}{r|ccl} f_{8} : & \mathbb{N} & \longrightarrow & \mathbb{N} \\ & n & \longmapsto & 2n \end{array} \end{array}$$
     Calculer de plus $f_{7} \circ f_{8}$ et $f_{8} \circ f_{7}$.
  corrige: |
    On traite les huit applications l'une après l'autre.

    • **(a)** Si $n + 1 = m + 1$, alors $n = m$ : l'application est injective. L'entier $0$ n'a pas d'antécédent dans $\mathbb{N}$. 
    $$\boxed{\text{(a) est injective, non surjective.}}$$

    • **(b)** Tout entier $m$ possède l'unique antécédent $m - 1$ dans $\mathbb{Z}$. 
    $$\boxed{\text{(b) est bijective, de réciproque } m \mapsto m - 1.}$$

    • **(c)** L'application, notée $c$, envoie un entier pair $n$ sur l'entier impair $n + 1$, et un entier impair $n$ sur l'entier pair $n - 1$. On a donc $c\big(c(n)\big) = n$ pour tout $n$ : $c \circ c = \mathrm{id}_{\mathbb{Z}}$. 
    $$\boxed{\text{(c) est bijective, et égale à sa réciproque.}}$$

    • **(d)** Pour $(u,v) \in \mathbb{R}^{2}$, on résout le système $x + y = u$, $x - y = v$, qui a l'unique solution $x = \frac{u+v}{2}$, $y = \frac{u-v}{2}$. 
    $$\boxed{\text{(d) est bijective, de réciproque } (u,v) \mapsto \Big(\frac{u+v}{2}, \frac{u-v}{2}\Big).}$$

    • **(e)** Tout réel $c$ est l'image de la fonction constante égale à $c$. Les fonctions $x \mapsto 0$ et $x \mapsto x$ ont la même image $0$. 
    $$\boxed{\text{(e) est surjective, non injective.}}$$

    • **(f)** Toute partie $Y$ de $\mathbb{R}_{+}$ vérifie $Y \cap \mathbb{R}_{+} = Y$ : c'est sa propre antécédente. Les parties $\varnothing$ et $\{-1\}$ ont la même image $\varnothing$. 
    $$\boxed{\text{(f) est surjective, non injective.}}$$

    • **(g)** Tout entier $m$ est l'image de $2m$, et l'on a $g(0) = g(1) = 0$. 
    $$\boxed{\text{(g) est surjective, non injective.}}$$

    • **(h)** Si $2n = 2m$, alors $n = m$, et l'entier $1$ n'a pas d'antécédent. 
    $$\boxed{\text{(h) est injective, non surjective.}}$$

    Pour les composées, $(g \circ h)(n) = \lfloor 2n/2 \rfloor = n$, tandis que $(h \circ g)(n) = 2\lfloor n/2 \rfloor$ vaut $n$ si $n$ est pair et $n - 1$ s'il est impair. 
    $$\boxed{g \circ h = \mathrm{id}_{\mathbb{N}} \qquad (h \circ g)(n) = \begin{cases} n & \text{si } n \text{ est pair} \\ n - 1 & \text{si } n \text{ est impair} \end{cases}}$$
     *Piège :* l'égalité $g \circ h = \mathrm{id}_{\mathbb{N}}$ ne fait pas de $g$ et $h$ deux bijections réciproques. Il faut aussi $h \circ g = \mathrm{id}_{\mathbb{N}}$, ce qui est faux ici. L'exercice 19 montrera que cette situation caractérise exactement les injections ($h$) et les surjections ($g$).
- id: "ma-02-13"
  feuille: "f-ma-02"
  numero: 13
  partie: "Injections, surjections, bijections"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["injections, surjections, bijections"]
  noeuds: [r-injections]
  notions: [injection, surjection, bijection]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Même question pour les applications suivantes.

    $$\begin{array}{ll} \begin{array}{r|ccl} g_{1} : & \mathbb{R}^{2} & \longrightarrow & \mathbb{R}^{2} \\ & (x,y) & \longmapsto & (x + y,\ xy) \end{array} & \begin{array}{r|ccl} g_{2} : & \mathbb{C}^{2} & \longrightarrow & \mathbb{C}^{2} \\ & (x,y) & \longmapsto & (x + y,\ xy) \end{array} \\[5mm] \begin{array}{r|ccl} g_{3} : & \mathbb{Z} \times \mathbb{N}^{*} & \longrightarrow & \mathbb{Q} \\ & (p,q) & \longmapsto & p + \dfrac{1}{q} \end{array} & \begin{array}{r|ccl} g_{4} : & \mathbb{Q} & \longrightarrow & [-1\,,1] \\ & x & \longmapsto & \sin x \end{array} \end{array}$$

    $$\begin{array}{r|ccl} \pi : & \mathbb{N}^{*} & \longrightarrow & \mathbb{N} \\ & n & \longmapsto & \text{nombre de nombres premiers de } [\![1\,;n]\!] \end{array}$$
     Pour $g_{1}$, on déterminera l'image ; pour $g_{4}$, on admettra que le réel $\pi$ est irrationnel.
  corrige: |
    **(a)** Les couples $(1,2)$ et $(2,1)$ ont la même image $(3,2)$ : l'application n'est pas injective. Pour déterminer l'image, on se souvient que $x$ et $y$ ont pour somme $s$ et pour produit $p$ si et seulement s'ils sont les racines du trinôme $t^{2} - st + p$. Ainsi $(s,p)$ est atteint par un couple de réels si et seulement si ce trinôme a des racines réelles, c'est-à-dire si $s^{2} - 4p \geqslant 0$. 
    $$\boxed{\text{(a) n'est ni injective ni surjective ; son image est } \{(s,p) \in \mathbb{R}^{2} \mid s^{2} \geqslant 4p\}.}$$
     Le couple $(0,1)$, par exemple, n'est pas atteint : deux réels de somme nulle ont un produit $-x^{2} \leqslant 0$.

    **(b)** L'application n'est pas injective, pour la même raison. Elle est surjective, car le trinôme $t^{2} - st + p$ a toujours des racines dans $\mathbb{C}$, ce que l'on admet ici comme à l'exercice 7. 
    $$\boxed{\text{(b) est surjective, non injective.}}$$
     Agrandir l'ensemble de départ a fait disparaître le défaut de surjectivité : c'est tout l'intérêt des nombres complexes.

    **(c)** Pour $q \geqslant 2$, le réel $\frac{1}{q}$ appartient à $]0\,,\frac{1}{2}]$, donc $p + \frac{1}{q}$ n'est pas entier et sa partie entière vaut $p$. Pour $q = 1$, le nombre $p + 1$ est entier. Supposons $p + \frac{1}{q} = p' + \frac{1}{q'} = r$.

    • Si $r$ est entier, alors $q = q' = 1$ et $p = p' = r - 1$.

    • Sinon, $q$ et $q'$ sont au moins égaux à $2$, et $p = p' = \lfloor r \rfloor$, puis $\frac{1}{q} = \frac{1}{q'}$, donc $q = q'$.

    En revanche, le rationnel $\frac{2}{3}$ aurait pour partie entière $p = 0$, donc $\frac{1}{q} = \frac{2}{3}$, ce qui est impossible pour un entier $q$. 
    $$\boxed{\text{(c) est injective, non surjective : } \tfrac{2}{3} \text{ n'est pas atteint.}}$$

    **(d)** Les premières valeurs sont $\pi(1) = 0$, $\pi(2) = 1$, $\pi(3) = 2$, $\pi(4) = 2$, $\pi(5) = 3$, $\pi(6) = 3$. L'égalité $\pi(3) = \pi(4)$ montre que $\pi$ n'est pas injective. Pour la surjectivité, on observe que $\pi(n + 1) - \pi(n)$ vaut $0$ ou $1$, selon que $n + 1$ est premier ou non, et que $\pi$ n'est pas majorée, puisqu'il y a une infinité de nombres premiers. Soit $m \in \mathbb{N}^{*}$ ; l'ensemble des $n$ tels que $\pi(n) \geqslant m$ est une partie non vide de $\mathbb{N}^{*}$, qui a un plus petit élément $n_{0} \geqslant 2$. Alors $\pi(n_{0} - 1) < m \leqslant \pi(n_{0}) \leqslant \pi(n_{0} - 1) + 1$, d'où $\pi(n_{0}) = m$. Enfin $0 = \pi(1)$. 
    $$\boxed{\pi \text{ est surjective, non injective.}}$$
     C'est un raisonnement de type « valeurs intermédiaires » discret : une suite d'entiers qui avance par pas de $0$ ou $1$ et tend vers $+\infty$ prend toutes les valeurs à partir de la première.

    **(e)** Soit $x$ et $y$ deux rationnels tels que $\sin x = \sin y$. Il existe alors un entier $k$ tel que $y = x + 2k\pi$ ou $y = \pi - x + 2k\pi$.

    • Dans le premier cas, $2k\pi = y - x$ est rationnel ; comme $\pi$ est irrationnel, $k = 0$ et $y = x$.

    • Dans le second cas, $(2k + 1)\pi = x + y$ serait rationnel, alors que $2k + 1 \neq 0$ : c'est impossible.

    Le réel $1$ n'est pas atteint, car ses antécédents par sinus dans $\mathbb{R}$ sont les réels $\frac{\pi}{2} + 2k\pi = \frac{(4k+1)\pi}{2}$, tous irrationnels. 
    $$\boxed{\text{(e) est injective, non surjective.}}$$
