  mots_cles: ["injections, surjections, bijections", bijections, bijection réciproque]
  noeuds: [r-injections, r-inverses]
  notions: [injection, surjection, bijection]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Montrer que les applications suivantes sont bijectives et déterminer leur application réciproque.

    **1.** $\begin{array}{r|ccl} f_{1} : & \mathbb{R} & \longrightarrow & \mathbb{R}_{+}^{*} \\ & x & \longmapsto & \dfrac{\mathrm{e}^{x} + 2}{\mathrm{e}^{-x}} \end{array}$

    **2.** $\begin{array}{r|ccl} f_{2} : & [1\,,+\infty[ & \longrightarrow & [0\,,+\infty[ \\ & x & \longmapsto & x - \dfrac{1}{x} \end{array}$

    **3.** $\begin{array}{r|ccl} f_{3} : & [2\,,+\infty[ & \longrightarrow & [\ln 7\,,+\infty[ \\ & x & \longmapsto & \ln(x^{2} + x + 1) \end{array}$

    **4.** $\begin{array}{r|ccl} f_{4} : & \mathbb{C} \setminus \{-3\} & \longrightarrow & \mathbb{C} \setminus \{\mathrm{i}\} \\ & z & \longmapsto & \dfrac{\mathrm{i} z - \mathrm{i}}{z + 3} \end{array}$
  corrige: |
    Dans chaque cas, on fixe un élément $y$ de l'ensemble d'arrivée et l'on montre que l'équation $f(x) = y$ a une unique solution dans l'ensemble de départ : c'est la méthode la plus sûre, car elle donne à la fois la bijectivité et la réciproque.

    **1.** On a $f_{1}(x) = \mathrm{e}^{2x} + 2\mathrm{e}^{x}$. Posons $t = \mathrm{e}^{x}$, qui décrit $\mathbb{R}_{+}^{*}$ quand $x$ décrit $\mathbb{R}$. Pour $y > 0$, 
    $$t^{2} + 2t = y \iff (t + 1)^{2} = 1 + y \iff t = -1 + \sqrt{1 + y},$$
     la racine $-1 - \sqrt{1 + y}$ étant négative. Comme $y > 0$, le réel $-1 + \sqrt{1 + y}$ est strictement positif et possède un unique logarithme. 
    $$\boxed{f_{1}^{-1}(y) = \ln\big(\sqrt{1 + y} - 1\big)}$$

    **2.** Pour $y \geqslant 0$ et $x \geqslant 1$, l'équation $x - \frac{1}{x} = y$ équivaut à $x^{2} - yx - 1 = 0$. Ses deux racines ont pour produit $-1$ : une seule est positive, à savoir $\frac{y + \sqrt{y^{2} + 4}}{2}$, et elle est au moins égale à $\frac{0 + 2}{2} = 1$. 
    $$\boxed{f_{2}^{-1}(y) = \frac{y + \sqrt{y^{2} + 4}}{2}}$$

    **3.** Pour $y \geqslant \ln 7$ et $x \geqslant 2$, l'équation équivaut à $x^{2} + x + 1 - \mathrm{e}^{y} = 0$, de discriminant $4\mathrm{e}^{y} - 3 \geqslant 25$. Une seule racine est positive, et elle vérifie $x \geqslant \frac{-1 + 5}{2} = 2$. 
    $$\boxed{f_{3}^{-1}(y) = \frac{-1 + \sqrt{4\mathrm{e}^{y} - 3}}{2}}$$

    **4.** Pour $w \neq \mathrm{i}$ et $z \neq -3$, 
    $$\frac{\mathrm{i}z - \mathrm{i}}{z + 3} = w \iff \mathrm{i}z - \mathrm{i} = wz + 3w \iff z(\mathrm{i} - w) = 3w + \mathrm{i} \iff z = \frac{3w + \mathrm{i}}{\mathrm{i} - w}.$$
     Il reste deux vérifications. Le complexe obtenu est différent de $-3$, car $3w + \mathrm{i} = -3\mathrm{i} + 3w$ est impossible. Et $f_{4}$ est bien à valeurs dans $\mathbb{C} \setminus \{\mathrm{i}\}$, car $\mathrm{i}z - \mathrm{i} = \mathrm{i}z + 3\mathrm{i}$ est impossible. 
    $$\boxed{f_{4}^{-1}(w) = \frac{3w + \mathrm{i}}{\mathrm{i} - w}}$$
     *Attention :* l'erreur la plus répandue est d'oublier ces deux vérifications. Sans elles, on a seulement montré que $f_{4}$ est injective, pas qu'elle est bien définie ni que la formule obtenue tombe dans le bon ensemble.
- id: "ma-02-15"
  feuille: "f-ma-02"
  numero: 15
  partie: "Injections, surjections, bijections"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["injections, surjections, bijections", injectivité, surjectivité, bijections]
  noeuds: [r-injections]
  notions: [injection, surjection, bijection]
  page_enonce: 4
  page_corrige: 10
  enonce: |
    On considère l'application 
    $$\begin{array}{r|ccl} f : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & \dfrac{2x}{1 + x^{2}} \end{array}$$

    **1.** L'application $f$ est-elle injective ? surjective ?

    **2.** Montrer que $f(\mathbb{R}) = [-1\,,1]$.

    **3.** Montrer que l'application $\begin{array}{r|ccl} g : & [-1\,,1] & \longrightarrow & [-1\,,1] \\ & x & \longmapsto & f(x) \end{array}$ est bijective, et déterminer $g^{-1}$.
  corrige: |
    **1.** On a $f(2) = f\big(\frac{1}{2}\big) = \frac{4}{5}$, donc $f$ n'est pas injective. On verra à la question 2 que $f$ ne prend aucune valeur hors de $[-1\,,1]$. 
    $$\boxed{f \text{ n'est ni injective ni surjective.}}$$

    **2.** Pour tout réel $x$, $(1 - |x|)^{2} \geqslant 0$ donne $2|x| \leqslant 1 + x^{2}$, donc $|f(x)| \leqslant 1$. Réciproquement, soit $y \in [-1\,,1]$. Si $y = 0$, il est atteint en $0$. Sinon, l'équation $f(x) = y$ équivaut à $yx^{2} - 2x + y = 0$, de discriminant $4(1 - y^{2}) \geqslant 0$ : elle a au moins une solution réelle. 
    $$\boxed{f(\mathbb{R}) = [-1\,,1]}$$

    **3.** Soit $y \in [-1\,,1] \setminus \{0\}$. Les racines de $yx^{2} - 2x + y$ ont pour produit $1$. Si $|y| < 1$, elles sont distinctes, et une seule est dans $[-1\,,1]$ ; si $y = \pm 1$, il y a la racine double $\pm 1$. Dans tous les cas, l'équation $g(x) = y$ a une unique solution dans $[-1\,,1]$, la racine de plus petit module : 
    $$x = \frac{1 - \sqrt{1 - y^{2}}}{y} = \frac{y}{1 + \sqrt{1 - y^{2}}}.$$
     La seconde écriture, obtenue en multipliant par la quantité conjuguée, convient aussi pour $y = 0$, dont l'unique antécédent dans $[-1\,,1]$ est $0$. 
    $$\boxed{g^{-1}(y) = \frac{y}{1 + \sqrt{1 - y^{2}}}}$$
     *À retenir :* restreindre à la fois l'ensemble de départ et l'ensemble d'arrivée permet de rendre bijective une application qui ne l'est pas. On reverra cette fonction dans le chapitre de trigonométrie, puisque $f(\tan\frac{\theta}{2}) = \sin\theta$.
- id: "ma-02-16"
  feuille: "f-ma-02"
  numero: 16
  partie: "Injections, surjections, bijections"
  etoiles: 1
  types: [Vrai ou faux, Démonstration]
  mots_cles: ["injections, surjections, bijections", injectivité, surjectivité, bijections]
  noeuds: [r-injections]
  notions: [injection, surjection, bijection]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    **1.** Soit $f : E \to F$ une application et $A$ une partie de $E$. Dire si chacune des affirmations suivantes est vraie ou fausse, en justifiant par une démonstration ou un contre-exemple.

    **(a)** Si $f$ est injective, alors $f_{|A}$ est injective.

    **(b)** Si $f_{|A}$ est injective, alors $f$ est injective.

    **(c)** Si $f$ est surjective, alors $f_{|A}$ est surjective.

    **(d)** Si $f_{|A}$ est surjective, alors $f$ est surjective.

    **2.** Soit $f : \mathbb{R} \to \mathbb{R}$ une bijection. Montrer que $f$ est impaire si et seulement si $f^{-1}$ l'est. Que dire des bijections paires ?
  corrige: |
    **1.** On examine les quatre affirmations.

    • **(a)** Si $x$, $x' \in A$ et $f_{|A}(x) = f_{|A}(x')$, alors $f(x) = f(x')$, donc $x = x'$. L'affirmation est vraie.

    • **(b)** La fonction carré, de $\mathbb{R}$ dans $\mathbb{R}$, n'est pas injective, alors que sa restriction à $\mathbb{R}_{+}$ l'est. L'affirmation est fausse.

    • **(c)** La fonction carré, de $\mathbb{R}$ dans $\mathbb{R}_{+}$, est surjective, mais sa restriction à $\{1\}$ ne prend que la valeur $1$. L'affirmation est fausse.

    • **(d)** On a $F = f_{|A}(A) = f(A) \subset f(E)$, donc $f$ est surjective. L'affirmation est vraie.

    $$\boxed{\text{(a) et (d) sont vraies ; (b) et (c) sont fausses.}}$$
     Restreindre conserve l'injectivité et peut la créer ; agrandir conserve la surjectivité et peut la créer.

    **2.** Supposons $f$ impaire, et soit $y \in \mathbb{R}$. Posons $x = f^{-1}(y)$. Alors $f(-x) = -f(x) = -y$, donc $f^{-1}(-y) = -x = -f^{-1}(y)$ : la réciproque est impaire. Comme $f$ est la réciproque de $f^{-1}$, la réciproque est vraie. 
    $$\boxed{f \text{ impaire} \iff f^{-1} \text{ impaire}}$$
     Une fonction paire vérifie $f(-1) = f(1)$, avec $-1 \neq 1$ : elle n'est pas injective. 
    $$\boxed{\text{Il n'existe aucune bijection paire de } \mathbb{R} \text{ dans } \mathbb{R}.}$$
- id: "ma-02-17"
  feuille: "f-ma-02"
  numero: 17
  partie: "Injections, surjections, bijections"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["injections, surjections, bijections", composition, injectivité, surjectivité, bijections]
  noeuds: [r-injections, r-composition]
  notions: [injection, surjection, bijection]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    **1.** Soit $f : E \to F$, $g : F \to G$ et $h : G \to H$ trois applications. Montrer que si $g \circ f$ et $h \circ g$ sont bijectives, alors $f$, $g$ et $h$ le sont aussi.

    **2.** Soit $f : E \to E$ et $n \geqslant 1$ un entier tels que $f^{n} = \mathrm{id}_{E}$. Montrer que $f$ est bijective, et exprimer $f^{-1}$ comme une itérée de $f$.

    **3.** Soit $f : E \to F$ et $g : F \to E$ telles que $g \circ f \circ g = g$ et $f \circ g \circ f = f$. Montrer que si $f$ est injective ou si $g$ est surjective, alors $g \circ f = \mathrm{id}_{E}$. Donner un exemple où $f$ et $g$ ne sont pas bijectives.
  corrige: |
    **1.** D'après la proposition 6 du cours, l'injectivité de $g \circ f$ donne celle de $f$, et la surjectivité de $g \circ f$ donne celle de $g$. De même, $h \circ g$ bijective donne $g$ injective et $h$ surjective. Ainsi $g$ est bijective, et l'on peut écrire 
    $$f = g^{-1} \circ (g \circ f) \qquad\text{et}\qquad h = (h \circ g) \circ g^{-1},$$
     qui sont des composées de bijections. 
    $$\boxed{f,\ g \text{ et } h \text{ sont bijectives.}}$$

    **2.** On a $f \circ f^{n-1} = f^{n-1} \circ f = f^{n} = \mathrm{id}_{E}$, avec la convention $f^{0} = \mathrm{id}_{E}$. 
    $$\boxed{f \text{ est bijective et } f^{-1} = f^{n-1}}$$

    **3.** Supposons $f$ injective. Pour $x \in E$, l'égalité $f\big((g \circ f)(x)\big) = f(x)$ donne $(g \circ f)(x) = x$. Supposons $g$ surjective, et soit $x \in E$ ; il s'écrit $x = g(y)$, et l'égalité $g \circ f \circ g = g$ appliquée à $y$ donne $(g \circ f)(x) = x$. 
    $$\boxed{g \circ f = \mathrm{id}_{E}}$$
     Pour un exemple, prenons $E = \{0\}$, $F = \{0,1\}$, $f(0) = 0$ et $g(0) = g(1) = 0$. Les deux identités se vérifient directement, puisque toutes les composées à valeurs dans $E$ sont constantes égales à $0$, et $f(g(f(0))) = f(0)$. 
    $$\boxed{f \text{ est injective non surjective, } g \text{ surjective non injective.}}$$
- id: "ma-02-18"
  feuille: "f-ma-02"
  numero: 18
  partie: "Injections, surjections, bijections"
  etoiles: 3
  types: [Démonstration]
  mots_cles: ["injections, surjections, bijections", composition, injectivité, surjectivité, bijections]
  noeuds: [r-injections, r-composition]
  notions: [injection, surjection, bijection]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Soit $E$ un ensemble, $n \geqslant 2$ un entier et $f : E \to E$ une application telle que $f^{n} = f$.

    **1.** Montrer que $f$ est injective si et seulement si elle est surjective.

    **2.** On suppose $n = 2$, c'est-à-dire $f \circ f = f$. Montrer que $f(x) = x$ pour tout $x \in f(E)$, puis que $f$ est injective si et seulement si $f = \mathrm{id}_{E}$.

    **3.** Pour $n = 3$, donner un exemple de bijection $f$ différente de l'identité telle que $f^{3} = f$.
  corrige: |
    **1.** Supposons $f$ injective. Pour $x \in E$, l'égalité $f\big(f^{n-1}(x)\big) = f(x)$ donne $f^{n-1}(x) = x$, d'où $f^{n-1} = \mathrm{id}_{E}$. D'après l'exercice 17, $f$ est bijective, donc surjective.

    Supposons $f$ surjective, et soit $y \in E$, qui s'écrit $y = f(x)$. Alors $f^{n-1}(y) = f^{n}(x) = f(x) = y$, donc $f^{n-1} = \mathrm{id}_{E}$, et $f$ est bijective, donc injective. 
    $$\boxed{f \text{ injective} \iff f \text{ surjective} \iff f^{n-1} = \mathrm{id}_{E}}$$
     Ce résultat rappelle le théorème du cours sur les applications d'un ensemble fini dans lui-même ; ici, c'est l'hypothèse $f^{n} = f$ qui remplace la finitude.

    **2.** Si $y = f(x)$, alors $f(y) = f(f(x)) = f(x) = y$. Si de plus $f$ est injective, l'égalité $f(f(x)) = f(x)$ donne $f(x) = x$ pour tout $x$. La réciproque est évidente. 
    $$\boxed{f \text{ fixe chaque point de } f(E), \text{ et } f \text{ injective} \iff f = \mathrm{id}_{E}}$$
     Une application telle que $f \circ f = f$ s'appelle un *projecteur* : on la retrouvera en algèbre linéaire, avec la projection orthogonale sur une droite du plan.

    **3.** Il suffit que $f^{2} = \mathrm{id}$, puisqu'alors $f^{3} = f$. 
    $$\boxed{f : \mathbb{R} \to \mathbb{R},\ x \mapsto -x \text{ vérifie } f^{3} = f \text{ et } f \neq \mathrm{id}_{\mathbb{R}}.}$$
- id: "ma-02-19"
  feuille: "f-ma-02"
  numero: 19
  partie: "Injections, surjections, bijections"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["injections, surjections, bijections", composition, injectivité, surjectivité]
  noeuds: [r-injections, r-composition]
  notions: [injection, surjection, bijection]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Soit $X$ et $Y$ deux ensembles non vides et $f : X \to Y$.

    **1.** Montrer que $f$ est injective si et seulement s'il existe $g : Y \to X$ telle que $g \circ f = \mathrm{id}_{X}$. Une telle application $g$ est-elle unique ?

    **2.** Montrer que $f$ est surjective si et seulement s'il existe $h : Y \to X$ telle que $f \circ h = \mathrm{id}_{Y}$. On admettra que l'on peut choisir simultanément un antécédent pour chaque élément de $Y$.

    **3.** On considère $f : \mathbb{N} \to \mathbb{N}$, $n \mapsto n^{2}$. Existe-t-il $g : \mathbb{N} \to \mathbb{N}$ telle que $g \circ f = \mathrm{id}_{\mathbb{N}}$ ? telle que $f \circ g = \mathrm{id}_{\mathbb{N}}$ ?
  corrige: |
    **1.** Supposons $f$ injective, et fixons $a \in X$. Tout élément $y$ de $f(X)$ a un unique antécédent ; on le note $g(y)$, et l'on pose $g(y) = a$ si $y \notin f(X)$. Pour $x \in X$, l'élément $g(f(x))$ est l'unique antécédent de $f(x)$, c'est-à-dire $x$. Réciproquement, si $g \circ f = \mathrm{id}_{X}$, qui est injective, alors $f$ est injective d'après la proposition 6 du cours. 
    $$\boxed{f \text{ injective} \iff \exists g : Y \to X,\ g \circ f = \mathrm{id}_{X}}$$
     L'application $g$ n'est pas unique en général : sa valeur hors de $f(X)$ est arbitraire. Elle est unique lorsque $f$ est surjective, ou lorsque $X$ n'a qu'un élément.

    **2.** Supposons $f$ surjective. Pour chaque $y \in Y$, la partie $f^{-1}(\{y\})$ est non vide ; on y choisit un élément $h(y)$, ce qui est licite d'après l'énoncé. Alors $f(h(y)) = y$. Réciproquement, si $f \circ h = \mathrm{id}_{Y}$, qui est surjective, alors $f$ est surjective. 
    $$\boxed{f \text{ surjective} \iff \exists h : Y \to X,\ f \circ h = \mathrm{id}_{Y}}$$
     Le choix simultané d'un antécédent pour chaque $y$ est l'*axiome du choix*. Il n'est pas nécessaire lorsque $X = \mathbb{N}$, car on peut prendre le plus petit antécédent.

    **3.** L'application $f$ est injective sur $\mathbb{N}$ et non surjective, car $2$ n'est pas un carré. D'après les questions 1 et 2 : 
    $$\boxed{g(m) = \begin{cases} \sqrt{m} & \text{si } m \text{ est un carré} \\ 0 & \text{sinon} \end{cases} \text{ vérifie } g \circ f = \mathrm{id}_{\mathbb{N}} ; \text{ aucune } g \text{ ne vérifie } f \circ g = \mathrm{id}_{\mathbb{N}}.}$$
- id: "ma-02-20"
  feuille: "f-ma-02"
  numero: 20
  partie: "Injections, surjections, bijections"
  etoiles: 3
  types: [Démonstration]
  mots_cles: ["injections, surjections, bijections", composition, injectivité, surjectivité, ensembles finis]
  noeuds: [r-injections, r-composition, n-fini]
  notions: [injection, surjection, bijection, ensemble-fini]
  page_enonce: 5
  page_corrige: 12
  enonce: |
    Soit $f : E \to F$ une application entre deux ensembles non vides.

    **1.** Montrer que $f$ est injective si et seulement si, pour tout ensemble $Z$ et toutes applications $g$, $h : Z \to E$, l'égalité $f \circ g = f \circ h$ entraîne $g = h$.

    **2.** Montrer que $f$ est surjective si et seulement si, pour tout ensemble $Z$ et toutes applications $g$, $h : F \to Z$, l'égalité $g \circ f = h \circ f$ entraîne $g = h$.

    **3.** Soit $G$ un ensemble ayant au moins deux éléments, et $\varphi : G^{F} \to G^{E}$, $g \mapsto g \circ f$. Montrer que $\varphi$ est injective si et seulement si $f$ est surjective, puis que $\varphi$ est surjective si et seulement si $f$ est injective.
  corrige: |
    **1.** Si $f$ est injective et $f \circ g = f \circ h$, alors pour tout $z \in Z$, $f(g(z)) = f(h(z))$, donc $g(z) = h(z)$. Réciproquement, supposons la propriété de simplification vraie, et soit $x$, $x'$ tels que $f(x) = f(x')$. Prenons $Z = \{0\}$, $g : 0 \mapsto x$ et $h : 0 \mapsto x'$. Alors $f \circ g = f \circ h$, donc $g = h$, c'est-à-dire $x = x'$. 
    $$\boxed{f \text{ injective} \iff f \text{ est simplifiable à gauche}}$$

    **2.** Si $f$ est surjective et $g \circ f = h \circ f$, tout $y \in F$ s'écrit $f(x)$, et $g(y) = h(y)$. Réciproquement, supposons que $f$ ne soit pas surjective, et soit $y_{0} \in F \setminus f(E)$. Prenons $Z = \{0,1\}$, $g = \mathbf{1}_{\{y_{0}\}}$ et $h$ la fonction nulle. Pour tout $x$, $f(x) \neq y_{0}$, donc $g(f(x)) = 0 = h(f(x))$ : on a $g \circ f = h \circ f$, mais $g \neq h$. 
    $$\boxed{f \text{ surjective} \iff f \text{ est simplifiable à droite}}$$

    **3.** Fixons deux éléments distincts $a$ et $b$ de $G$.

    • *Injectivité de $\varphi$.* Si $f$ est surjective, $\varphi$ est injective d'après la question 2. Si $f$ ne l'est pas, soit $y_{0} \notin f(E)$ ; la fonction constante égale à $a$ et la fonction qui vaut $a$ partout sauf en $y_{0}$, où elle vaut $b$, sont distinctes et ont la même image par $\varphi$.

    • *Surjectivité de $\varphi$.* Supposons $f$ injective et soit $u \in G^{E}$. On pose $g(y) = u(x)$ si $y = f(x)$, l'élément $x$ étant unique, et $g(y) = a$ si $y \notin f(E)$. Alors $g \circ f = u$. Si $f$ n'est pas injective, soit $x \neq x'$ tels que $f(x) = f(x')$ ; toute fonction $g \circ f$ prend la même valeur en $x$ et en $x'$, donc la fonction $u$ qui vaut $a$ en $x$ et $b$ ailleurs n'est pas atteinte.

    $$\boxed{\varphi \text{ injective} \iff f \text{ surjective} \qquad \varphi \text{ surjective} \iff f \text{ injective}}$$
     *À retenir :* l'opération $g \mapsto g \circ f$ « renverse » injectivité et surjectivité. On retrouvera ce phénomène avec l'image réciproque à l'exercice 22, et plus tard avec la dualité en algèbre linéaire.
- id: "ma-02-21"
  feuille: "f-ma-02"
  numero: 21
  partie: "Injections, surjections, bijections"
  etoiles: 3
  types: [Démonstration]
  mots_cles: ["injections, surjections, bijections", images directes et réciproques, injectivité, surjectivité, bijections, "relations d'équivalence"]
  noeuds: [r-injections, r-images, r-equivalence]
  notions: [injection, surjection, bijection, image-directe, image-reciproque, relation-equivalence]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Soit $f : E \to F$ une application. Montrer les équivalences suivantes.

    **1.** $f$ est injective $\iff$ pour toutes parties $A$, $B$ de $E$, $f(A \cap B) = f(A) \cap f(B)$.

    **2.** $f$ est injective $\iff$ pour toute partie $A$ de $E$, $f^{-1}\big(f(A)\big) = A$.

    **3.** $f$ est surjective $\iff$ pour toute partie $B$ de $F$, $f\big(f^{-1}(B)\big) = B$.

    **4.** $f$ est bijective $\iff$ pour toute partie $A$ de $E$, $f(E \setminus A) = F \setminus f(A)$.
  corrige: |
    On rappelle que les inclusions $f(A \cap B) \subset f(A) \cap f(B)$, $A \subset f^{-1}(f(A))$ et $f(f^{-1}(B)) \subset B$ sont toujours vraies (proposition 2 du cours).

    **1.** Si $f$ est injective et $y \in f(A) \cap f(B)$, alors $y = f(a) = f(b)$ avec $a \in A$ et $b \in B$, donc $a = b \in A \cap B$, et $y \in f(A \cap B)$. Réciproquement, si $f(x) = f(x')$, on applique l'égalité avec $A = \{x\}$ et $B = \{x'\}$ : $f(A \cap B) = \{f(x)\}$ n'est pas vide, donc $\{x\} \cap \{x'\} \neq \varnothing$ et $x = x'$.

    **2.** Le sens direct est la proposition 5 du cours. Réciproquement, si $f(x) = f(x')$, alors $x' \in f^{-1}\big(f(\{x\})\big) = \{x\}$, donc $x' = x$.

    **3.** Le sens direct est la proposition 5 du cours. Réciproquement, avec $B = F$, on obtient $f(E) = f\big(f^{-1}(F)\big) = F$.

    **4.** Supposons $f$ bijective. D'après la question 1, $f(E \setminus A) \cap f(A) = f(\varnothing) = \varnothing$, et $f(E \setminus A) \cup f(A) = f(E) = F$ : on a bien $f(E \setminus A) = F \setminus f(A)$. Réciproquement, supposons la propriété vraie pour toute partie $A$.

    • Avec $A = \varnothing$, on obtient $f(E) = F$ : $f$ est surjective.

    • Si $f(x) = f(x')$ avec $x \neq x'$, alors avec $A = \{x\}$, l'élément $f(x) = f(x')$ appartient à $f(E \setminus A)$, mais pas à $F \setminus f(A)$ : contradiction.

    $$\boxed{\text{Les quatre équivalences sont établies.}}$$
     *Piège :* il faut deux cas particuliers distincts pour la réciproque de la question 4 ; la partie vide seule ne dit rien sur l'injectivité.
- id: "ma-02-22"
  feuille: "f-ma-02"
  numero: 22
  partie: "Injections, surjections, bijections"
  etoiles: 3
  types: [Démonstration]
  mots_cles: ["injections, surjections, bijections", images directes et réciproques, injectivité, surjectivité, bijections, bijection réciproque, ensembles finis, équipotence]
  noeuds: [r-injections, r-images, r-inverses, n-fini, r-equipotence, r-equivalence]
  notions: [injection, surjection, bijection, image-directe, image-reciproque, ensemble-fini, relation-equivalence]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    Soit $f : E \to F$ une application. On définit 
    $$\begin{array}{r|ccl} \varphi : & \mathcal{P}(E) & \longrightarrow & \mathcal{P}(F) \\ & X & \longmapsto & f(X) \end{array} \qquad\text{et}\qquad \begin{array}{r|ccl} \psi : & \mathcal{P}(F) & \longrightarrow & \mathcal{P}(E) \\ & Y & \longmapsto & f^{-1}(Y) \end{array}$$

    **1.** Montrer les équivalences : $f$ injective $\iff$ $\varphi$ injective $\iff$ $\psi$ surjective.

    **2.** Montrer les équivalences : $f$ surjective $\iff$ $\varphi$ surjective $\iff$ $\psi$ injective.

    **3.** Lorsque $f$ est bijective, montrer que $\varphi$ et $\psi$ sont bijectives et réciproques l'une de l'autre.
  corrige: |
    **1.** Si $f$ est injective, l'exercice 21 donne $\psi \circ \varphi = \mathrm{id}_{\mathcal{P}(E)}$, donc $\varphi$ est injective et $\psi$ surjective (proposition 6 du cours). Réciproquement :

    • si $\varphi$ est injective et $f(x) = f(x')$, alors $\varphi(\{x\}) = \varphi(\{x'\})$, donc $x = x'$ ;

    • si $\psi$ est surjective, soit $x$, $x'$ tels que $f(x) = f(x')$ ; il existe $Y$ tel que $\{x\} = f^{-1}(Y)$, donc $f(x) \in Y$, puis $f(x') \in Y$, et $x' \in \{x\}$.

    $$\boxed{f \text{ injective} \iff \varphi \text{ injective} \iff \psi \text{ surjective}}$$

    **2.** Si $f$ est surjective, l'exercice 21 donne $\varphi \circ \psi = \mathrm{id}_{\mathcal{P}(F)}$, donc $\varphi$ est surjective et $\psi$ injective. Réciproquement :

    • si $\varphi$ est surjective, il existe $X$ tel que $f(X) = F$, donc $f(E) \supset f(X) = F$ ;

    • si $\psi$ est injective et $y_{0} \notin f(E)$, alors $\psi(\{y_{0}\}) = \varnothing = \psi(\varnothing)$, ce qui est absurde.

    $$\boxed{f \text{ surjective} \iff \varphi \text{ surjective} \iff \psi \text{ injective}}$$

    **3.** Si $f$ est bijective, les deux égalités $\psi \circ \varphi = \mathrm{id}_{\mathcal{P}(E)}$ et $\varphi \circ \psi = \mathrm{id}_{\mathcal{P}(F)}$ sont vraies. 
    $$\boxed{\varphi \text{ et } \psi \text{ sont bijectives, et } \psi = \varphi^{-1}.}$$
     On retrouve ainsi que, pour une bijection, l'image réciproque $f^{-1}(Y)$ est aussi l'image directe de $Y$ par la bijection réciproque $f^{-1}$ : la notation est cohérente.
- id: "ma-02-23"
  feuille: "f-ma-02"
  numero: 23
  partie: "Injections, surjections, bijections"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["injections, surjections, bijections", injectivité, surjectivité, bijections, ensembles finis]
  noeuds: [r-injections, n-fini]
  notions: [injection, surjection, bijection, ensemble-fini]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    Soit $\Omega$ un ensemble et $X$, $Y$ deux parties de $\Omega$. On considère 
    $$\begin{array}{r|ccl} \theta : & \mathcal{P}(\Omega) & \longrightarrow & \mathcal{P}(X) \times \mathcal{P}(Y) \\ & A & \longmapsto & (A \cap X,\ A \cap Y) \end{array}$$

    **1.** Montrer que $\theta$ est injective si et seulement si $X \cup Y = \Omega$.

    **2.** Montrer que $\theta$ est surjective si et seulement si $X \cap Y = \varnothing$.

    **3.** Lorsque $\theta$ est bijective, déterminer $\theta^{-1}$. Quelle formule de dénombrement retrouve-t-on lorsque $\Omega$ est fini ?
  corrige: |
    **1.** Si $X \cup Y = \Omega$, toute partie $A$ s'écrit $A = A \cap \Omega = (A \cap X) \cup (A \cap Y)$ : elle est déterminée par $\theta(A)$, et $\theta$ est injective. Si au contraire $\omega \in \Omega \setminus (X \cup Y)$, alors $\theta(\{\omega\}) = (\varnothing, \varnothing) = \theta(\varnothing)$. 
    $$\boxed{\theta \text{ injective} \iff X \cup Y = \Omega}$$

    **2.** Supposons $X \cap Y = \varnothing$, et soit $(B,C) \in \mathcal{P}(X) \times \mathcal{P}(Y)$. Posons $A = B \cup C$. Comme $C \subset Y$ est disjointe de $X$, on a $A \cap X = B$, et de même $A \cap Y = C$. Si au contraire $\omega \in X \cap Y$, le couple $(\{\omega\}, \varnothing)$ n'est pas atteint, car $\omega \in A \cap X$ entraîne $\omega \in A \cap Y$. 
    $$\boxed{\theta \text{ surjective} \iff X \cap Y = \varnothing}$$

    **3.** Lorsque $X$ et $Y$ forment une partition de $\Omega$, le calcul précédent donne la réciproque. 
    $$\boxed{\theta^{-1}(B,C) = B \cup C}$$
     Si $\Omega$ a $n$ éléments, dont $k$ dans $X$ et $n - k$ dans $Y$, la bijection $\theta$ et le lemme 6 du cours donnent $2^{n} = \mathrm{card}\big(\mathcal{P}(X) \times \mathcal{P}(Y)\big) = 2^{k} \times 2^{n-k}$. Plus profondément : choisir une partie de $\Omega$, c'est choisir indépendamment sa trace sur $X$ et sa trace sur $Y$, ce qui est l'idée même du principe multiplicatif.
- id: "ma-02-24"
  feuille: "f-ma-02"
  numero: 24
  partie: "Injections, surjections, bijections"
  etoiles: 3
  types: [Démonstration]
  mots_cles: ["injections, surjections, bijections", images directes et réciproques, injectivité, surjectivité, ensembles finis, "relations d'ordre"]
