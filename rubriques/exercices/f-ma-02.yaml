  page_enonce: 6
  page_corrige: 13
  enonce: |
    Soit $f$, $g : \mathbb{N} \to \mathbb{N}$ deux applications telles que $f$ soit injective, $g$ surjective, et $f(n) \leqslant g(n)$ pour tout $n \in \mathbb{N}$. Montrer que $f = g$.

    *On pourra comparer, pour tout $k \in \mathbb{N}$, les parties $f^{-1}([\![0\,;k]\!])$ et $g^{-1}([\![0\,;k]\!])$, et utiliser les lemmes du cours sur les parties d'un ensemble fini.*
  corrige: |
    Fixons $k \in \mathbb{N}$ et notons $I_{k} = [\![0\,;k]\!]$, qui a $k + 1$ éléments.

    • Si $g(n) \leqslant k$, alors $f(n) \leqslant g(n) \leqslant k$ : on a $g^{-1}(I_{k}) \subset f^{-1}(I_{k})$.

    • L'application $f$ étant injective, elle induit une bijection de $f^{-1}(I_{k})$ sur son image, qui est une partie de $I_{k}$. D'après les lemmes 3 et 2 du cours, cette image est finie avec au plus $k + 1$ éléments, donc $f^{-1}(I_{k})$ aussi.

    • La partie $g^{-1}(I_{k})$ de $f^{-1}(I_{k})$ est donc finie. Chacun des entiers $0$, …, $k$ a un antécédent par $g$, par exemple le plus petit, et ces antécédents sont distincts : ils forment une partie de $g^{-1}(I_{k})$ à $k + 1$ éléments, et le lemme 3 donne $\mathrm{card}\big(g^{-1}(I_{k})\big) \geqslant k + 1$.

    Ainsi $g^{-1}(I_{k})$ est une partie de $f^{-1}(I_{k})$ qui a au moins autant d'éléments que lui. D'après le cas d'égalité du lemme 3 : 
    $$f^{-1}(I_{k}) = g^{-1}(I_{k}).$$
     Soit enfin $n \in \mathbb{N}$ et $k = f(n)$. Alors $n \in f^{-1}(I_{k}) = g^{-1}(I_{k})$, donc $g(n) \leqslant k = f(n)$. Avec l'hypothèse $f(n) \leqslant g(n)$, on conclut. 
    $$\boxed{f = g}$$
     *Attention :* sans l'injectivité de $f$, le résultat tombe. Avec $f$ nulle et $g = \mathrm{id}_{\mathbb{N}}$, on a bien $f \leqslant g$, $g$ surjective, et $f \neq g$.
- id: "ma-02-25"
  feuille: "f-ma-02"
  numero: 25
  partie: "Injections, surjections, bijections"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["injections, surjections, bijections", fonctions indicatrices, injectivité, surjectivité, bijections, ensembles finis, équipotence]
  noeuds: [r-injections, zf-parties, n-fini, r-equipotence]
  notions: [injection, surjection, bijection, ensemble-fini]
  page_enonce: 6
  page_corrige: 14
  enonce: |
    Soit $E$ un ensemble fini à $p$ éléments et $F$ un ensemble fini à $n$ éléments.

    **1.** Montrer que l'application $\mathcal{P}(E) \to \{0,1\}^{E}$, $A \mapsto \mathbf{1}_{A}$, est bijective. En déduire, à l'aide de la question 2, une nouvelle démonstration du fait que $\mathcal{P}(E)$ possède $2^{p}$ éléments.

    **2.** Montrer, par récurrence sur $p$ et à l'aide du lemme des bergers, qu'il y a $n^{p}$ applications de $E$ dans $F$. On fixera un élément $a$ de $E$ et l'on regroupera les applications selon leur valeur en $a$. Dénombrer de même les applications injectives de $E$ dans $F$, puis les bijections de $E$ sur lui-même.

    **3.** Pour $p = 4$ et $n = 2$, dénombrer les surjections de $E$ sur $F$ en dénombrant les applications qui ne le sont pas.

    **4.** Soit $A$ et $B$ deux parties finies d'un ensemble. À l'aide des lemmes du cours, montrer que $A \cup B$ est fini et que 
    $$\mathrm{card}(A \cup B) = \mathrm{card}(A) + \mathrm{card}(B) - \mathrm{card}(A \cap B).$$
     On pourra écrire $A \cup B$ comme la réunion disjointe de $A$ et de $B \setminus A$.
  corrige: |
    **1.** L'application $\mathcal{P}(E) \to \{0,1\}^{E}$, $A \mapsto \mathbf{1}_{A}$, admet pour réciproque l'application $\chi \mapsto \chi^{-1}(\{1\})$ : en effet, l'ensemble des points où $\mathbf{1}_{A}$ vaut $1$ est $A$, et une fonction $\chi$ à valeurs dans $\{0,1\}$ est l'indicatrice de $\chi^{-1}(\{1\})$. D'après la question 2, il y a $2^{p}$ applications de $E$ dans $\{0,1\}$, et deux ensembles en bijection ont le même cardinal, d'après le lemme 2 du cours. 
    $$\boxed{\mathrm{card}\,\mathcal{P}(E) = \mathrm{card}\,\{0,1\}^{E} = 2^{p}}$$

    **2.** *Applications.* On raisonne par récurrence sur $p$, pour tout ensemble $F$ à $n$ éléments. Si $p = 0$, l'ensemble $E$ est vide, et il existe une seule application de $E$ dans $F$, celle de graphe vide : on a bien $n^{0} = 1$. Supposons le résultat vrai au rang $p$, et soit $E$ à $p + 1$ éléments, $a \in E$ et $E' = E \setminus \{a\}$, qui a $p$ éléments. On considère 
    $$\begin{array}{r|ccl} \Phi : & F^{E} & \longrightarrow & F \\ & \varphi & \longmapsto & \varphi(a) \end{array}$$
     Pour $y \in F$, la fibre $\Phi^{-1}(\{y\})$ est formée des applications qui envoient $a$ sur $y$. La restriction $\varphi \mapsto \varphi_{|E'}$ est une bijection de cette fibre sur $F^{E'}$, dont la réciproque prolonge une application de $E'$ en envoyant $a$ sur $y$. Chaque fibre a donc $n^{p}$ éléments, et le lemme des bergers donne $\mathrm{card}(F^{E}) = n \times n^{p} = n^{p+1}$.

    *Injections.* Notons $A(p,n)$ le nombre d'injections d'un ensemble à $p$ éléments dans un ensemble à $n$ éléments, qui ne dépend que de $p$ et $n$ d'après le lemme 2 du cours. On montre par récurrence sur $p$ que $A(p,n) = n(n-1)\cdots(n-p+1)$, produit de $p$ facteurs, pour tout $n$. Le cas $p = 0$ est le même que ci-dessus. Pour l'hérédité, on reprend $a$, $E'$ et l'application $\varphi \mapsto \varphi(a)$, restreinte aux injections. Si $n = 0$, il n'y a aucune application de $E \neq \varnothing$ dans $F = \varnothing$, et le produit, qui contient le facteur $n = 0$, est nul. Si $n \geqslant 1$, une injection qui envoie $a$ sur $y$ envoie $E'$ dans $F \setminus \{y\}$, et la restriction est une bijection de la fibre au-dessus de $y$ sur l'ensemble des injections de $E'$ dans $F \setminus \{y\}$, qui a $n - 1$ éléments d'après le lemme 3. Le lemme des bergers donne 
    $$A(p+1, n) = n \times A(p, n-1) = n \times (n-1)(n-2)\cdots(n-p).$$
     *Bijections.* D'après le théorème 2 du cours, une application de $E$ dans lui-même est bijective si et seulement si elle est injective : il y en a $A(p,p) = p!$. 
    $$\boxed{n^{p} \text{ applications} \qquad n(n-1)\cdots(n-p+1) \text{ injections} \qquad p! \text{ bijections de } E \text{ sur } E}$$
     Le nombre d'injections est nul lorsque $p > n$, puisque le produit contient alors le facteur $n - n = 0$ : c'est le principe des tiroirs.

    **3.** Les applications de $E$ dans $F$ qui ne sont pas surjectives sont, pour $n = 2$, celles qui ne prennent qu'une valeur : ce sont les deux applications constantes. 
    $$\boxed{2^{4} - 2 = 14 \text{ surjections}}$$
     *À retenir :* pour dénombrer, on passe souvent au complémentaire. Pour $n = 3$, il faudrait retirer les applications qui évitent une valeur, en prenant garde de ne pas compter deux fois les constantes : c'est le principe d'inclusion-exclusion du chapitre de dénombrement.

    **4.** Les parties $A \cap B$ et $B \setminus A$ de $B$ sont finies, d'après le lemme 3 du cours. Elles sont disjointes et ont pour réunion $B$, donc, d'après le lemme 4, 
    $$\mathrm{card}(B) = \mathrm{card}(A \cap B) + \mathrm{card}(B \setminus A).$$
     De même, $A$ et $B \setminus A$ sont finies, disjointes, et ont pour réunion $A \cup B$. Le lemme 4 montre que $A \cup B$ est fini, et donne 
    $$\mathrm{card}(A \cup B) = \mathrm{card}(A) + \mathrm{card}(B \setminus A) = \mathrm{card}(A) + \mathrm{card}(B) - \mathrm{card}(A \cap B).$$

    $$\boxed{\mathrm{card}(A \cup B) = \mathrm{card}(A) + \mathrm{card}(B) - \mathrm{card}(A \cap B)}$$
     Pour $A = \{1,2\}$ et $B = \{2,3\}$, on trouve bien $2 + 2 - 1 = 3$. Les éléments de $A \cap B$ sont comptés deux fois dans $\mathrm{card}(A) + \mathrm{card}(B)$, et la soustraction corrige ce double comptage : c'est le premier cas de la formule du crible, que le chapitre 21 généralisera à $n$ parties.
