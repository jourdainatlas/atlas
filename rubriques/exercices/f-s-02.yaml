  page_corrige: 11
  enonce: |
    Le rectangle ci-dessous est partagé en quatre rectangles plus petits.

    ![Figure](documents/figures/67fab938d12242a2.svg)

    **1.** Donner les dimensions du grand rectangle, puis exprimer son aire sous la forme d'un produit.

    **2.** Calculer l'aire de chacun des quatre rectangles colorés, puis exprimer l'aire totale sous la forme d'une somme réduite.

    **3.** Quelle propriété du cours vient-on d'illustrer ?

    **4.** Reprendre les questions 1. et 2. en remplaçant à la fois la longueur $2$ et la longueur $5$ par un même nombre $a$. Quelle identité remarquable retrouve-t-on alors ?
  corrige: |
    **1.** Le grand rectangle a pour largeur $x+2$ et pour hauteur $x+5$ : 
    $$\boxed{\mathcal{A}=(x+2)(x+5)}$$

    **2.** On calcule l'aire de chacun des quatre morceaux :

    ![Figure](documents/figures/9717eea6844d4ce2.svg)

    En sommant les quatre aires : 
    $$\boxed{\mathcal{A}=x^2+2x+5x+10=x^2+7x+10}$$

    **3.** Les deux questions précédentes donnent deux écritures d'une même aire : 
    $$(x+2)(x+5)=x^2+7x+10$$

    $$\boxed{\text{on vient d'illustrer la double distributivité}}$$

    **4.** En remplaçant $2$ et $5$ par un même nombre $a$, le grand rectangle devient un carré de côté $x+a$, et les quatre morceaux ont pour aires $x^2$, $ax$, $ax$ et $a^2$ : 
    $$\boxed{(x+a)^2=x^2+2ax+a^2}$$
     On retrouve le carré d'une somme, et l'on voit géométriquement d'où vient le facteur $2$ du double produit : les deux rectangles $ax$ sont superposables.
- id: "s-02-30"
  feuille: "f-s-02"
  numero: 30
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Conjecture, Démonstration, Calcul]
  mots_cles: [programme de calcul, développement, factorisation, interprétation géométrique]
  noeuds: [z-anneau, z-polynomes]
  notions: [anneau, anneau-polynomes]
  page_enonce: 7
  page_corrige: 12
  enonce: |
    On considère le programme de calcul suivant :

    • Choisir un nombre.

    • Lui ajouter $4$.

    • Multiplier le résultat par le nombre choisi.

    • Ajouter $4$.

    **1.** Appliquer ce programme aux nombres $1$, $3$ et $-5$.

    **2.** Quelle conjecture peut-on faire sur la nature des résultats obtenus ?

    **3.** On note $x$ le nombre choisi. Exprimer le résultat du programme en fonction de $x$, puis développer et réduire cette expression.

    **4.** Factoriser l'expression obtenue, et démontrer la conjecture.

    **5.** Le programme peut-il renvoyer un nombre strictement négatif ? Justifier à l'aide de la question 4.
  corrige: |
    **1.** On applique les quatre étapes : 
    $$\begin{aligned} 1 &\longmapsto 5\longmapsto 5\times 1=5\longmapsto 9\\ 3 &\longmapsto 7\longmapsto 7\times 3=21\longmapsto 25\\ -5 &\longmapsto -1\longmapsto (-1)\times(-5)=5\longmapsto 9 \end{aligned}$$

    $$\boxed{\text{on obtient }9,\;25\text{ et }9}$$

    **2.** Ces trois nombres sont des carrés : $9=3^2$ et $25=5^2$. 
    $$\boxed{\text{On conjecture que le résultat est toujours un carré}}$$

    **3.** En notant $x$ le nombre choisi, le programme calcule $x+4$, puis $x(x+4)$, puis : 
    $$x(x+4)+4=x^2+4x+4$$

    $$\boxed{\text{le résultat vaut }x^2+4x+4}$$

    **4.** On reconnaît une identité remarquable, avec $a=x$ et $b=2$ : 
    $$x^2+2\times x\times 2+2^2=(x+2)^2$$

    $$\boxed{\text{le résultat est toujours le carré de }x+2}$$
     ce qui démontre la conjecture. On retrouve bien $(1+2)^2=9$, $(3+2)^2=25$ et $(-5+2)^2=9$.

    **5.** Un carré est toujours positif ou nul, donc : 
    $$\boxed{\text{le programme ne peut jamais renvoyer un nombre strictement négatif}}$$
     Il renvoie d'ailleurs $0$ lorsque l'on choisit $x=-2$.
- id: "s-02-31"
  feuille: "f-s-02"
  numero: 31
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Calcul]
  mots_cles: [développement, factorisation, "carré d'une expression"]
  noeuds: [z-anneau, z-polynomes]
  notions: [anneau, anneau-polynomes]
  page_enonce: 7
  page_corrige: 13
  enonce: |
    On considère l'expression $f(x)=(2x-3)^2-4$.

    **1.** Développer et réduire $f(x)$.

    **2.** Factoriser $f(x)$.

    **3.** Calculer $f(0)$ et $f\left(\dfrac{3}{2}\right)$ en choisissant à chaque fois l'écriture la plus commode.

    **4.** Calculer $f\left(\dfrac{1}{2}\right)$ et $f\left(\dfrac{5}{2}\right)$ à l'aide de la forme factorisée. Que remarque-t-on ?

    **5.** Vérifier le résultat de la question précédente à l'aide de la forme développée.
  corrige: |
    **1.** On développe le carré, puis on réduit : 
    $$f(x)=(2x)^2-2\times 2x\times 3+3^2-4=4x^2-12x+9-4$$

    $$\boxed{f(x)=4x^2-12x+5}$$

    **2.** On reconnaît une différence de deux carrés, avec $a=2x-3$ et $b=2$ : 
    $$f(x)=(2x-3)^2-2^2=\big[(2x-3)+2\big]\big[(2x-3)-2\big]$$

    $$\boxed{f(x)=(2x-1)(2x-5)}$$

    **3.** Pour $x=0$, la forme développée est immédiate ; pour $x=\dfrac{3}{2}$, c'est l'écriture de départ qui l'est, puisque la parenthèse s'annule : 
    $$f(0)=5 \qquad ; \qquad f\left(\frac{3}{2}\right)=(3-3)^2-4=0-4$$

    $$\boxed{f(0)=5 \qquad\text{et}\qquad f\left(\frac{3}{2}\right)=-4}$$

    **4.** Avec la forme factorisée : 
    $$f\left(\frac{1}{2}\right)=(1-1)(1-5)=0\times(-4) \qquad ; \qquad f\left(\frac{5}{2}\right)=(5-1)(5-5)=4\times 0$$

    $$\boxed{f\left(\frac{1}{2}\right)=f\left(\frac{5}{2}\right)=0}$$
     Pour chacune de ces deux valeurs, l'un des deux facteurs s'annule, donc le produit est nul.

    **5.** Avec la forme développée : 
    $$f\left(\frac{1}{2}\right)=4\times\frac{1}{4}-12\times\frac{1}{2}+5=1-6+5=0$$

    $$f\left(\frac{5}{2}\right)=4\times\frac{25}{4}-12\times\frac{5}{2}+5=25-30+5=0$$
     ce qui confirme les résultats précédents, au prix de calculs nettement plus longs.
- id: "s-02-32"
  feuille: "f-s-02"
  numero: 32
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [développement, arithmétique, somme et produit, "carré d'une expression"]
  noeuds: [z-anneau]
  notions: [anneau]
  page_enonce: 8
  page_corrige: 13
  enonce: |
    Soit $n$ un entier naturel.

    **1.** Exprimer en fonction de $n$ les deux entiers qui suivent immédiatement $n$.

    **2.** Développer et réduire $(n+1)^2-n^2$. Que peut-on dire du résultat ?

    **3.** Démontrer que la différence des carrés de deux entiers consécutifs est toujours égale à la somme de ces deux entiers.

    **4.** Démontrer que la somme de trois entiers consécutifs est toujours un multiple de $3$.

    **5.** Développer $(n+1)^2-(n-1)^2$ pour $n\geqslant 1$. Que peut-on en déduire ?
  corrige: |
    **1.** Les deux entiers suivants sont $\boxed{n+1\text{ et }n+2}$

    **2.** On développe : 
    $$(n+1)^2-n^2=n^2+2n+1-n^2=2n+1$$

    $$\boxed{(n+1)^2-n^2=2n+1\text{, qui est un nombre impair}}$$
     En effet $2n$ est pair, donc $2n+1$ est impair.

    **3.** La somme des deux entiers consécutifs $n$ et $n+1$ vaut : 
    $$n+(n+1)=2n+1$$
     On reconnaît le résultat de la question précédente, d'où : 
    $$\boxed{(n+1)^2-n^2=n+(n+1)}$$
     La différence des carrés de deux entiers consécutifs est donc toujours égale à leur somme.

    **4.** La somme de trois entiers consécutifs s'écrit : 
    $$n+(n+1)+(n+2)=3n+3=3(n+1)$$
     Comme $n+1$ est un entier, ce nombre est bien un multiple de $3$ : 
    $$\boxed{n+(n+1)+(n+2)=3(n+1)}$$

    **5.** On développe les deux carrés : 
    $$(n+1)^2-(n-1)^2=\left(n^2+2n+1\right)-\left(n^2-2n+1\right)=4n$$

    $$\boxed{(n+1)^2-(n-1)^2=4n}$$
     La différence des carrés de deux entiers séparés par un troisième est donc toujours un multiple de $4$, égal au quadruple de l'entier du milieu.
- id: "s-02-33"
  feuille: "f-s-02"
  numero: 33
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [QCM, Démonstration, Calcul]
  mots_cles: [factorisation, expressions rationnelles, "carré d'une expression"]
  noeuds: [z-polynomes, q-construction, z-anneau]
  notions: [anneau-polynomes]
  page_enonce: 8
  page_corrige: 14
  enonce: |
    Pour chaque question, une seule réponse est exacte. Déterminer laquelle et justifier.

    ```tableau
     ¦ **Réponse A** ¦ **Réponse B** ¦ **Réponse C**
    1. $-2(3x-4)$ vaut ¦ $-6x-8$ ¦ $-6x+8$ ¦ $6x+8$
    2. $(x-3)^2$ vaut ¦ $x^2-9$ ¦ $x^2-6x+9$ ¦ $x^2+9$
    3. $x^2-25$ se factorise en ¦ $(x-5)^2$ ¦ $(x+5)(x-5)$ ¦ $x(x-25)$
    4. $x^2+8x+16$ se factorise en ¦ $(x+4)^2$ ¦ $(x+8)^2$ ¦ $(x+4)(x-4)$
    5. $\dfrac{6x+3}{3}$ vaut ¦ $2x+3$ ¦ $2x+1$ ¦ $6x+1$
    6. La valeur interdite de $\dfrac{x+1}{2x-6}$ est ¦ $-1$ ¦ $6$ ¦ $3$
    ```
  corrige: |
    **1.** $-2(3x-4)=-6x+8$ : le signe $-$ se distribue aussi au second terme. $\boxed{\text{réponse B}}$

    **2.** $(x-3)^2=x^2-2\times x\times 3+3^2=x^2-6x+9$. $\boxed{\text{réponse B}}$

    **3.** $x^2-25=x^2-5^2=(x+5)(x-5)$. $\boxed{\text{réponse B}}$

    **4.** $x^2+8x+16=x^2+2\times x\times 4+4^2=(x+4)^2$. $\boxed{\text{réponse A}}$

    **5.** $\dfrac{6x+3}{3}=\dfrac{3(2x+1)}{3}=2x+1$ : on simplifie un *facteur*, pas un terme. $\boxed{\text{réponse B}}$

    **6.** $2x-6$ s'annule lorsque $2x=6$, c'est-à-dire pour $x=3$. $\boxed{\text{réponse C}}$
- id: "s-02-34"
  feuille: "f-s-02"
  numero: 34
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [développement, identités remarquables, "carré d'une expression"]
  noeuds: [z-anneau]
  notions: [anneau]
  page_enonce: 8
  page_corrige: 14
  enonce: |
    Soient $a$ et $b$ deux nombres réels.

    **1.** Développer et réduire $(a+b)^2-(a-b)^2$.

    **2.** En déduire une méthode pour calculer mentalement $17^2-13^2$. *(On pourra poser $a=15$ et $b=2$.)*

    **3.** Démontrer de même que $(a+b)^2+(a-b)^2=2\left(a^2+b^2\right)$.

    **4.** On suppose que $a+b=7$ et que $ab=10$. Sans chercher les valeurs de $a$ et $b$, calculer $(a-b)^2$ à l'aide de la question 1., puis $a^2+b^2$ à l'aide de la question 3.
  corrige: |
    **1.** On développe les deux carrés, puis on soustrait : 
    $$\begin{aligned} (a+b)^2-(a-b)^2 &= \left(a^2+2ab+b^2\right)-\left(a^2-2ab+b^2\right)\\ &= a^2+2ab+b^2-a^2+2ab-b^2 \end{aligned}$$

    $$\boxed{(a+b)^2-(a-b)^2=4ab}$$

    **2.** En posant $a=15$ et $b=2$, on a $a+b=17$ et $a-b=13$, donc : 
    $$17^2-13^2=(a+b)^2-(a-b)^2=4ab=4\times 15\times 2$$

    $$\boxed{17^2-13^2=120}$$
     Le calcul est immédiat, alors que $289-169$ demande deux carrés et une soustraction.

    **3.** On additionne cette fois les deux développements : 
    $$\begin{aligned} (a+b)^2+(a-b)^2 &= \left(a^2+2ab+b^2\right)+\left(a^2-2ab+b^2\right)\\ &= 2a^2+2b^2 \end{aligned}$$

    $$\boxed{(a+b)^2+(a-b)^2=2\left(a^2+b^2\right)}$$

    **4.** D'après la question 1., $(a-b)^2=(a+b)^2-4ab$, donc : 
    $$(a-b)^2=7^2-4\times 10=49-40 \qquad\text{d'où}\qquad \boxed{(a-b)^2=9}$$
     D'après la question 3., $2\left(a^2+b^2\right)=(a+b)^2+(a-b)^2=49+9=58$, d'où : 
    $$\boxed{a^2+b^2=29}$$
- id: "s-02-35"
  feuille: "f-s-02"
  numero: 35
  partie: "Exercices de synthèse"
  etoiles: 3
