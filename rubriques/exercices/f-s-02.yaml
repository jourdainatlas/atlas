  noeuds: [z-anneau]
  notions: [anneau]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Développer de même les expressions suivantes, en prenant garde aux coefficients :

    **a)** $(x+2y)^2$

    **b)** $(3a-b)^2$

    **c)** $(2x+5)(2x-5)$

    **d)** $\left(x+\dfrac{1}{2}\right)^2$

    **e)** $(-x+3)^2$

    **f)** $(7x-4)(7x+4)$

    **g)** $(5x-3)^2$

    **h)** $(a+4b)(a-4b)$

    **i)** $(3x+2y)^2$

    **j)** $(2-9x)(2+9x)$

    **k)** $(6x+1)^2$

    **l)** $(-2x-5)^2$

    **m)** $(4x+7)^2$

    **n)** $(x-3y)^2$

    **o)** $(8x-1)(8x+1)$

    **p)** $(2a+3b)(2a-3b)$

    **q)** $(9-2x)^2$

    **r)** $\left(3x-\dfrac{1}{2}\right)^2$

    **s)** $(-3x+4)^2$

    **t)** $(5a-2b)^2$

    **u)** $(x+10)(x-10)$

    **v)** $(-x-7)^2$

    **w)** $(6-y)(6+y)$

    **x)** $\left(x^2+1\right)\left(x^2-1\right)$
  corrige: |
    **a)** $(x+2y)^2=\boxed{x^2+4xy+4y^2}$

    **b)** $(3a-b)^2=\boxed{9a^2-6ab+b^2}$

    **c)** $(2x+5)(2x-5)=\boxed{4x^2-25}$

    **d)** $\left(x+\dfrac{1}{2}\right)^2=\boxed{x^2+x+\dfrac{1}{4}}$

    **e)** $(-x+3)^2=\boxed{x^2-6x+9}$

    **f)** $(7x-4)(7x+4)=\boxed{49x^2-16}$

    **g)** $(5x-3)^2=\boxed{25x^2-30x+9}$

    **h)** $(a+4b)(a-4b)=\boxed{a^2-16b^2}$

    **i)** $(3x+2y)^2=\boxed{9x^2+12xy+4y^2}$

    **j)** $(2-9x)(2+9x)=\boxed{4-81x^2}$

    **k)** $(6x+1)^2=\boxed{36x^2+12x+1}$

    **l)** $(-2x-5)^2=\boxed{4x^2+20x+25}$

    **m)** $(4x+7)^2=\boxed{16x^2+56x+49}$

    **n)** $(x-3y)^2=\boxed{x^2-6xy+9y^2}$

    **o)** $(8x-1)(8x+1)=\boxed{64x^2-1}$

    **p)** $(2a+3b)(2a-3b)=\boxed{4a^2-9b^2}$

    **q)** $(9-2x)^2=\boxed{81-36x+4x^2}$

    **r)** $\left(3x-\dfrac{1}{2}\right)^2=\boxed{9x^2-3x+\dfrac{1}{4}}$

    **s)** $(-3x+4)^2=\boxed{9x^2-24x+16}$

    **t)** $(5a-2b)^2=\boxed{25a^2-20ab+4b^2}$

    **u)** $(x+10)(x-10)=\boxed{x^2-100}$

    **v)** $(-x-7)^2=\boxed{x^2+14x+49}$

    **w)** $(6-y)(6+y)=\boxed{36-y^2}$

    **x)** $\left(x^2+1\right)\left(x^2-1\right)=\boxed{x^4-1}$

    Quelques points de vigilance :

    • en e), l), s) et v), les deux termes sont précédés d'un signe $-$ ou commencent par un $-$ : $(-x+3)^2=(3-x)^2$ et $(-2x-5)^2=(2x+5)^2$, car un carré ne dépend pas du signe global ;

    • en x), le rôle de $a$ est tenu par $x^2$, et $\left(x^2\right)^2=x^4$.
- id: "s-02-14"
  feuille: "f-s-02"
  numero: 14
  partie: "Identités remarquables"
  etoiles: 1
  types: [Calcul]
  mots_cles: [identités remarquables, interprétation géométrique]
  noeuds: [z-anneau]
  notions: [anneau]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Calculer mentalement, en écrivant chaque nombre à l'aide d'une identité remarquable bien choisie (on détaillera l'étape intermédiaire) :

    **a)** $101^2$

    **b)** $99^2$

    **c)** $97\times 103$

    **d)** $102\times 98$

    **e)** $45\times 55$

    **f)** $1\,001^2$
  corrige: |
    On écrit chaque nombre à l'aide de $100$, $50$ ou $1\,000$, de façon à faire apparaître une identité remarquable : 
    $$\begin{aligned} 101^2 &= (100+1)^2=10\,000+200+1 & &\text{d'où}\quad \boxed{101^2=10\,201}\\ 99^2 &= (100-1)^2=10\,000-200+1 & &\text{d'où}\quad \boxed{99^2=9\,801}\\ 97\times 103 &= (100-3)(100+3)=10\,000-9 & &\text{d'où}\quad \boxed{97\times 103=9\,991}\\ 102\times 98 &= (100+2)(100-2)=10\,000-4 & &\text{d'où}\quad \boxed{102\times 98=9\,996}\\ 45\times 55 &= (50-5)(50+5)=2\,500-25 & &\text{d'où}\quad \boxed{45\times 55=2\,475}\\ 1\,001^2 &= (1\,000+1)^2=1\,000\,000+2\,000+1 & &\text{d'où}\quad \boxed{1\,001^2=1\,002\,001} \end{aligned}$$
- id: "s-02-15"
  feuille: "f-s-02"
  numero: 15
  partie: "Identités remarquables"
  etoiles: 2
  types: [Calcul]
  mots_cles: [développement, "carré d'une expression"]
  noeuds: [z-anneau]
  notions: [anneau]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Développer et réduire les expressions suivantes : 
    $$\begin{aligned} &L=(x+3)^2-(x-2)(x+5) &&M=2(x-1)^2-3(x+2)(x-2)\\ &N=(2x+1)^2-(x-3)^2 &&P=(x+4)^2+(x-4)^2 \end{aligned}$$
  corrige: |
    On développe chaque morceau séparément, puis on réduit en surveillant les signes : 
    $$\begin{aligned} L &= (x+3)^2-(x-2)(x+5)\\ &= \left(x^2+6x+9\right)-\left(x^2+3x-10\right)\\ &=x^2+6x+9-x^2-3x+10 & &\text{d'où}\quad \boxed{L=3x+19}\\[0.3em] M &= 2(x-1)^2-3(x+2)(x-2)\\ &= 2\left(x^2-2x+1\right)-3\left(x^2-4\right) \\ &=2x^2-4x+2-3x^2+12 & &\text{d'où}\quad \boxed{M=-x^2-4x+14}\\[0.3em] N &= (2x+1)^2-(x-3)^2\\ &= \left(4x^2+4x+1\right)-\left(x^2-6x+9\right)\\ &=4x^2+4x+1-x^2+6x-9 & &\text{d'où}\quad \boxed{N=3x^2+10x-8}\\[0.3em] P &= (x+4)^2+(x-4)^2\\ &= \left(x^2+8x+16\right)+\left(x^2-8x+16\right) & &\text{d'où}\quad \boxed{P=2x^2+32} \end{aligned}$$
     Dans le calcul de $P$, les doubles produits se compensent : le résultat ne contient plus de terme en $x$.
- id: "s-02-16"
  feuille: "f-s-02"
  numero: 16
  partie: "Identités remarquables"
  etoiles: 1
  types: [Vrai ou faux]
  mots_cles: ["carré d'une expression"]
  noeuds: [z-anneau]
  notions: []
  page_enonce: 4
  page_corrige: 6
  enonce: |
    Pour chacune des affirmations suivantes, dire si elle est vraie ou fausse. Si elle est fausse, donner l'écriture correcte.

    **1.** $(2x)^2=2x^2$

    **2.** $(x+3)^2=x^2+9$

    **3.** $(x-5)^2=x^2-10x+25$

    **4.** $-(x-4)=-x+4$

    **5.** $(3x-1)^2=9x^2-6x+1$

    **6.** $x^2+16=(x+4)(x-4)$
  corrige: |
    **1.** **Fausse** : le carré porte sur le facteur tout entier, donc $\boxed{(2x)^2=4x^2}$.

    **2.** **Fausse** : c'est l'erreur la plus fréquente ; il manque le double produit : $\boxed{(x+3)^2=x^2+6x+9}$.

    **3.** **Vraie** : avec $a=x$ et $b=5$, on a bien $x^2-2\times x\times 5+5^2=x^2-10x+25$.

    **4.** **Vraie** : le signe $-$ se distribue à tous les termes de la parenthèse.

    **5.** **Vraie** : avec $a=3x$ et $b=1$, on obtient $(3x)^2-2\times 3x\times 1+1^2=9x^2-6x+1$.

    **6.** **Fausse** : une *somme* de deux carrés ne se factorise pas.

    Seule la différence se factorise : $\boxed{x^2-16=(x+4)(x-4)}$.
- id: "s-02-17"
  feuille: "f-s-02"
  numero: 17
  partie: "Factorisation"
  etoiles: 1
  types: [Calcul]
  mots_cles: [factorisation]
  noeuds: [z-polynomes]
  notions: [anneau-polynomes]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Factoriser les expressions suivantes en mettant en évidence un facteur commun :

    **a)** $6x+15$

    **b)** $4x^2-7x$

    **c)** $12x^2+18x$

    **d)** $-5x+10$

    **e)** $x^2+x$

    **f)** $14x^3-21x^2$

    **g)** $9x-3x^2$

    **h)** $8x^2+4x-12$
  corrige: |
    On repère le facteur commun à tous les termes, puis on le met en évidence :

    **a)** $6x+15=3\times 2x+3\times 5=\boxed{3(2x+5)}$

    **b)** $4x^2-7x=x\times 4x-x\times 7=\boxed{x(4x-7)}$

    **c)** $12x^2+18x=6x\times 2x+6x\times 3=\boxed{6x(2x+3)}$

    **d)** $-5x+10=-5\times x-5\times(-2)=\boxed{-5(x-2)}$

    **e)** $x^2+x=x\times x+x\times 1=\boxed{x(x+1)}$

    **f)** $14x^3-21x^2=7x^2\times 2x-7x^2\times 3=\boxed{7x^2(2x-3)}$

    **g)** $9x-3x^2=3x\times 3-3x\times x=\boxed{3x(3-x)}$

    **h)** $8x^2+4x-12=4\times 2x^2+4\times x-4\times 3=\boxed{4\left(2x^2+x-3\right)}$
- id: "s-02-18"
  feuille: "f-s-02"
  numero: 18
  partie: "Factorisation"
  etoiles: 1
  types: [Calcul]
  mots_cles: [factorisation]
  noeuds: [z-polynomes]
  notions: [anneau-polynomes]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Factoriser de même les expressions suivantes :

    **a)** $10x+25$

    **b)** $x^2-6x$

    **c)** $15x^2-10x$

    **d)** $-4x-12$

    **e)** $7x^3+7x^2$

    **f)** $3x^2+9x-6$

    **g)** $2x-x^2$

    **h)** $6x^4-4x^3+2x^2$
  corrige: |
    On procède de la même manière :

    **a)** $10x+25=\boxed{5(2x+5)}$

    **b)** $x^2-6x=\boxed{x(x-6)}$

    **c)** $15x^2-10x=\boxed{5x(3x-2)}$

    **d)** $-4x-12=\boxed{-4(x+3)}$

    **e)** $7x^3+7x^2=\boxed{7x^2(x+1)}$

    **f)** $3x^2+9x-6=\boxed{3\left(x^2+3x-2\right)}$

    **g)** $2x-x^2=\boxed{x(2-x)}$

    **h)** $6x^4-4x^3+2x^2=\boxed{2x^2\left(3x^2-2x+1\right)}$

    On cherchera toujours le plus grand facteur commun possible : en h), $2x^2$ convient, alors que $x$ ou $2x$ ne factoriseraient l'expression qu'à moitié.
- id: "s-02-19"
  feuille: "f-s-02"
  numero: 19
  partie: "Factorisation"
  etoiles: 1
  types: [Calcul]
  mots_cles: [factorisation, "carré d'une expression"]
  noeuds: [z-polynomes, z-anneau]
  notions: [anneau-polynomes]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Factoriser les expressions suivantes : le facteur commun est ici une expression entre parenthèses.

    **1.** $(x+2)(3x-1)+(x+2)(x+8)$

    **2.** $(2x-1)(x+4)+(2x-1)$

    **3.** $(x-3)(2x+1)-(x-3)(x-5)$

    **4.** $(5x+2)^2-(5x+2)(x-1)$

    **5.** $4(x+1)-x(x+1)$

    **6.** $(x+6)(x-2)-(x+6)$
  corrige: |
    Le facteur commun est ici l'expression entre parenthèses ; on l'extrait, puis on réduit le second facteur.

    **1.** $(x+2)(3x-1)+(x+2)(x+8)=(x+2)\big[(3x-1)+(x+8)\big]=\boxed{(x+2)(4x+7)}$

    **2.** Dans $(2x-1)(x+4)+(2x-1)$, le second terme s'écrit $(2x-1)\times 1$ : il ne faut pas oublier ce facteur $1$. 
    $$(2x-1)(x+4)+(2x-1)=(2x-1)\big[(x+4)+1\big]=\boxed{(2x-1)(x+5)}$$

    **3.** $(x-3)(2x+1)-(x-3)(x-5)=(x-3)\big[(2x+1)-(x-5)\big]=(x-3)(2x+1-x+5)$, d'où $\boxed{(x-3)(x+6)}$

    **4.** Dans $(5x+2)^2-(5x+2)(x-1)$, on écrit $(5x+2)^2=(5x+2)(5x+2)$ : 
    $$(5x+2)\big[(5x+2)-(x-1)\big]=(5x+2)(5x+2-x+1)=\boxed{(5x+2)(4x+3)}$$

    **5.** $4(x+1)-x(x+1)=(x+1)\big[4-x\big]=\boxed{(x+1)(4-x)}$

    **6.** $(x+6)(x-2)-(x+6)=(x+6)\big[(x-2)-1\big]=\boxed{(x+6)(x-3)}$
- id: "s-02-20"
  feuille: "f-s-02"
  numero: 20
  partie: "Factorisation"
  etoiles: 1
  types: [Calcul]
  mots_cles: [identités remarquables, factorisation]
  noeuds: [z-anneau, z-polynomes]
  notions: [anneau, anneau-polynomes]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Factoriser les expressions suivantes à l'aide d'une identité remarquable :

    **a)** $x^2-16$

    **b)** $x^2+6x+9$

    **c)** $25x^2-20x+4$

    **d)** $9x^2-49$

    **e)** $x^2-2x+1$

    **f)** $4x^2+12x+9$

    **g)** $x^2-\dfrac{1}{4}$

    **h)** $16x^2-1$

    **i)** $49-14x+x^2$
  corrige: |
    On reconnaît la forme développée d'une identité remarquable, puis on la lit de droite à gauche :

    **a)** $x^2-16=x^2-4^2=\boxed{(x+4)(x-4)}$

    **b)** $x^2+6x+9=x^2+2\times x\times 3+3^2=\boxed{(x+3)^2}$

    **c)** $25x^2-20x+4=(5x)^2-2\times 5x\times 2+2^2=\boxed{(5x-2)^2}$

    **d)** $9x^2-49=(3x)^2-7^2=\boxed{(3x+7)(3x-7)}$

    **e)** $x^2-2x+1=x^2-2\times x\times 1+1^2=\boxed{(x-1)^2}$

    **f)** $4x^2+12x+9=(2x)^2+2\times 2x\times 3+3^2=\boxed{(2x+3)^2}$

    **g)** $x^2-\dfrac{1}{4}=x^2-\left(\dfrac{1}{2}\right)^2=\boxed{\left(x+\dfrac{1}{2}\right)\left(x-\dfrac{1}{2}\right)}$

    **h)** $16x^2-1=(4x)^2-1^2=\boxed{(4x+1)(4x-1)}$

    **i)** $49-14x+x^2=7^2-2\times 7\times x+x^2=\boxed{(7-x)^2}$

    Dans les cas b), c), e), f) et i), c'est le terme central qui permet de confirmer l'identité : il doit être égal au double produit.
- id: "s-02-21"
  feuille: "f-s-02"
  numero: 21
  partie: "Factorisation"
  etoiles: 1
  types: [Calcul]
