- id: "s-02-01"
  feuille: "f-s-02"
  numero: 1
  partie: "Expressions littérales"
  etoiles: 1
  types: [Calcul]
  mots_cles: [valeur numérique]
  noeuds: [z-anneau]
  notions: []
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Calculer la valeur numérique de chacune des expressions suivantes pour les valeurs indiquées. On prendra garde aux parenthèses lors de la substitution d'un nombre négatif.

    **1.** $A(x)=3x^2-5x+2$ pour $x=0$, $x=2$, $x=-1$ et $x=\dfrac{1}{2}$.

    **2.** $B(x)=(2x-1)(x+3)$ pour $x=0$, $x=4$, $x=-3$ et $x=-\dfrac{1}{2}$.

    **3.** $C(x)=-x^2+4x-1$ pour $x=1$, $x=-2$ et $x=0{,}5$.
  corrige: |
    On remplace $x$ par la valeur indiquée, en encadrant systématiquement les nombres négatifs par des parenthèses.

    **1.** Pour $A(x)=3x^2-5x+2$ : 
    $$\begin{aligned} A(0) &= 3\times 0^2-5\times 0+2 & &\text{d'où}\quad \boxed{A(0)=2}\\ A(2) &= 3\times 4-10+2=12-10+2 & &\text{d'où}\quad \boxed{A(2)=4}\\ A(-1) &= 3\times(-1)^2-5\times(-1)+2=3+5+2 & &\text{d'où}\quad \boxed{A(-1)=10}\\ A\left(\tfrac{1}{2}\right) &= 3\times\frac{1}{4}-\frac{5}{2}+2=\frac{3}{4}-\frac{10}{4}+\frac{8}{4} & &\text{d'où}\quad \boxed{A\left(\tfrac{1}{2}\right)=\frac{1}{4}} \end{aligned}$$

    **2.** Pour $B(x)=(2x-1)(x+3)$ : 
    $$\begin{aligned} B(0) &= (-1)\times 3 & &\text{d'où}\quad \boxed{B(0)=-3}\\ B(4) &= 7\times 7 & &\text{d'où}\quad \boxed{B(4)=49}\\ B(-3) &= \big(2\times(-3)-1\big)\times(-3+3)=(-7)\times 0 & &\text{d'où}\quad \boxed{B(-3)=0}\\ B\left(-\tfrac{1}{2}\right) &= (-1-1)\times\left(-\frac{1}{2}+3\right)=(-2)\times\frac{5}{2} & &\text{d'où}\quad \boxed{B\left(-\tfrac{1}{2}\right)=-5} \end{aligned}$$

    **3.** Pour $C(x)=-x^2+4x-1$ : 
    $$\begin{aligned} C(1) &= -1+4-1 & &\text{d'où}\quad \boxed{C(1)=2}\\ C(-2) &= -(-2)^2+4\times(-2)-1=-4-8-1 & &\text{d'où}\quad \boxed{C(-2)=-13}\\ C(0{,}5) &= -0{,}25+2-1 & &\text{d'où}\quad \boxed{C(0{,}5)=0{,}75} \end{aligned}$$
- id: "s-02-02"
  feuille: "f-s-02"
  numero: 2
  partie: "Expressions littérales"
  etoiles: 1
  types: [Calcul]
  mots_cles: [somme et produit, "carré d'une expression"]
  noeuds: [z-anneau]
  notions: [anneau]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Pour chacune des expressions suivantes, dire s'il s'agit d'une somme ou d'un produit. On pourra s'aider de la dernière opération que l'on effectuerait pour la calculer.

    **a)** $3(x+1)+5$

    **b)** $3(x+1+5)$

    **c)** $(2x-1)(x+4)$

    **d)** $2x-1+x\times 4$

    **e)** $5x^2$

    **f)** $(x+2)^2-3$

    **g)** $x(x+1)(x+2)$

    **h)** $-(x-7)$
  corrige: |
    On repère la *dernière* opération que l'on effectuerait pour calculer l'expression : si c'est une addition ou une soustraction, il s'agit d'une somme ; si c'est une multiplication, d'un produit.

    **a)** $\boxed{\text{somme}}$ : le $+5$ vient en dernier.

    **b)** $\boxed{\text{produit}}$ : $3$ multiplie la parenthèse.

    **c)** $\boxed{\text{produit}}$ : deux facteurs.

    **d)** $\boxed{\text{somme}}$ : trois termes.

    **e)** $\boxed{\text{produit}}$ : $5\times x\times x$.

    **f)** $\boxed{\text{somme}}$ : le $-3$ vient en dernier.

    **g)** $\boxed{\text{produit}}$ : trois facteurs.

    **h)** $\boxed{\text{produit}}$ : c'est $-1\times(x-7)$.
- id: "s-02-03"
  feuille: "f-s-02"
  numero: 3
  partie: "Expressions littérales"
  etoiles: 1
  types: [Calcul]
  mots_cles: [valeur numérique, somme et produit]
  noeuds: [z-anneau]
  notions: [anneau]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Traduire chacune des phrases suivantes par une expression littérale, où $x$ désigne le nombre choisi. Calculer ensuite la valeur de chaque expression pour $x=3$.

    **1.** Le double de la somme de $x$ et de $5$.

    **2.** La somme du double de $x$ et de $5$.

    **3.** Le carré de la différence entre $x$ et $3$.

    **4.** La différence entre le carré de $x$ et $3$.

    **5.** Le produit de $x$ par la somme de $x$ et $4$.

    **6.** L'inverse de la somme de $x$ et $1$.
  corrige: |
    On traduit chaque phrase en respectant l'ordre des opérations, puis on remplace $x$ par $3$ :

    **1.** $\boxed{2(x+5)}$ et pour $x=3$ : $2\times 8=\boxed{16}$

    **2.** $\boxed{2x+5}$ et pour $x=3$ : $6+5=\boxed{11}$

    **3.** $\boxed{(x-3)^2}$ et pour $x=3$ : $0^2=\boxed{0}$

    **4.** $\boxed{x^2-3}$ et pour $x=3$ : $9-3=\boxed{6}$

    **5.** $\boxed{x(x+4)}$ et pour $x=3$ : $3\times 7=\boxed{21}$

    **6.** $\boxed{\dfrac{1}{x+1}}$ et pour $x=3$ : $\boxed{\dfrac{1}{4}}$

    Les deux premières expressions, comme les deux suivantes, montrent l'importance des parenthèses : $2(x+5)$ et $2x+5$ ne désignent pas le même nombre.
- id: "s-02-04"
  feuille: "f-s-02"
  numero: 4
  partie: "Expressions littérales"
  etoiles: 2
  types: [Calcul]
  mots_cles: [programme de calcul, développement, interprétation géométrique]
  noeuds: [z-anneau]
  notions: [anneau]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    On considère le programme de calcul suivant :

    • Choisir un nombre.

    • Lui ajouter $3$.

    • Multiplier le résultat par $2$.

    • Soustraire le double du nombre choisi.

    **1.** Appliquer ce programme aux nombres $5$, $0$ et $-4$. Que remarque-t-on ?

    **2.** On note $x$ le nombre choisi au départ. Exprimer le résultat du programme en fonction de $x$.

    **3.** Développer et réduire cette expression, puis conclure.
  corrige: |
    **1.** On applique les quatre étapes : 
    $$\begin{aligned} 5 &\longmapsto 8\longmapsto 16\longmapsto 16-10=6\\ 0 &\longmapsto 3\longmapsto 6\longmapsto 6-0=6\\ -4 &\longmapsto -1\longmapsto -2\longmapsto -2-(-8)=6 \end{aligned}$$

    $$\boxed{\text{On obtient toujours }6}$$

    **2.** En notant $x$ le nombre choisi, le programme calcule successivement $x+3$, puis $2(x+3)$, et enfin : 
    $$\boxed{2(x+3)-2x}$$

    **3.** On développe puis on réduit : 
    $$2(x+3)-2x=2x+6-2x=6$$

    $$\boxed{\text{le résultat vaut }6\text{ quel que soit le nombre choisi}}$$
- id: "s-02-05"
  feuille: "f-s-02"
  numero: 5
  partie: "Développement et réduction"
  etoiles: 1
  types: [Calcul]
  mots_cles: [développement]
  noeuds: [z-anneau]
  notions: [anneau]
  page_enonce: 2
  page_corrige: 2
  enonce: |
    Développer les expressions suivantes à l'aide de la simple distributivité :

    **a)** $5(2x-3)$

    **b)** $-3(x+4)$

    **c)** $2x(x-1)$

    **d)** $-(x-3)$

    **e)** $x(3-2x)$

    **f)** $-4(2-3x)$

    **g)** $\dfrac{1}{2}(4x+6)$

    **h)** $-2x(5-x)$
  corrige: |
    On applique la simple distributivité $k(a+b)=ka+kb$, en distribuant le facteur à *chaque* terme de la parenthèse :

    **a)** $5(2x-3)=5\times 2x-5\times 3=\boxed{10x-15}$

    **b)** $-3(x+4)=-3\times x-3\times 4=\boxed{-3x-12}$

    **c)** $2x(x-1)=2x\times x-2x\times 1=\boxed{2x^2-2x}$

    **d)** $-(x-3)=-1\times x-1\times(-3)=\boxed{-x+3}$

    **e)** $x(3-2x)=x\times 3-x\times 2x=\boxed{3x-2x^2}$

    **f)** $-4(2-3x)=-4\times 2-4\times(-3x)=\boxed{-8+12x}$

    **g)** $\dfrac{1}{2}(4x+6)=\dfrac{1}{2}\times 4x+\dfrac{1}{2}\times 6=\boxed{2x+3}$

    **h)** $-2x(5-x)=-2x\times 5-2x\times(-x)=\boxed{-10x+2x^2}$
- id: "s-02-06"
  feuille: "f-s-02"
  numero: 6
  partie: "Développement et réduction"
  etoiles: 1
  types: [Calcul]
  mots_cles: [développement]
  noeuds: [z-anneau]
  notions: [anneau]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Réduire les expressions suivantes en regroupant les termes semblables :

    **a)** $3x^2+5x-2x^2+7x-1$

    **b)** $4x-7+2x^2-3x+9$

    **c)** $-x^2+6x-4x^2-x$

    **d)** $2x^2-3x+5-x^2+3x-5$

    **e)** $7x^2-2x+1-7x^2+2x$

    **f)** $x^2+x+x^2+x$

    **g)** $-3x+4x^2-2+x-4x^2$

    **h)** $5x^3-2x^2+x^3+3x^2$
  corrige: |
    On regroupe les termes semblables, c'est-à-dire ceux qui contiennent la même puissance de $x$ :

    **a)** $3x^2+5x-2x^2+7x-1=(3-2)x^2+(5+7)x-1=\boxed{x^2+12x-1}$

    **b)** $4x-7+2x^2-3x+9=2x^2+(4-3)x+(-7+9)=\boxed{2x^2+x+2}$

    **c)** $-x^2+6x-4x^2-x=(-1-4)x^2+(6-1)x=\boxed{-5x^2+5x}$

    **d)** $2x^2-3x+5-x^2+3x-5=(2-1)x^2+(-3+3)x+(5-5)=\boxed{x^2}$

    **e)** $7x^2-2x+1-7x^2+2x=(7-7)x^2+(-2+2)x+1=\boxed{1}$

    **f)** $x^2+x+x^2+x=(1+1)x^2+(1+1)x=\boxed{2x^2+2x}$

    **g)** $-3x+4x^2-2+x-4x^2=(4-4)x^2+(-3+1)x-2=\boxed{-2x-2}$

    **h)** $5x^3-2x^2+x^3+3x^2=(5+1)x^3+(-2+3)x^2=\boxed{6x^3+x^2}$
- id: "s-02-07"
  feuille: "f-s-02"
  numero: 7
  partie: "Développement et réduction"
  etoiles: 1
  types: [Calcul]
  mots_cles: [développement]
  noeuds: [z-anneau]
  notions: [anneau]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Développer puis réduire les expressions suivantes :

    **a)** $3(x+2)+4(x-1)$

    **b)** $5(2x-1)-2(3x+4)$

    **c)** $-2(x-5)-3(2x+1)$

    **d)** $x(x+3)+2(x+3)$

    **e)** $4(3-x)+x(x-1)$

    **f)** $2x(x+1)-x(3x-4)$

    **g)** $7-3(2x-5)$

    **h)** $-x(2x-3)-4(x-2)$
  corrige: |
    On développe chaque parenthèse, puis on réduit :

    **a)** $3(x+2)+4(x-1)=3x+6+4x-4=\boxed{7x+2}$

    **b)** $5(2x-1)-2(3x+4)=10x-5-6x-8=\boxed{4x-13}$

    **c)** $-2(x-5)-3(2x+1)=-2x+10-6x-3=\boxed{-8x+7}$

    **d)** $x(x+3)+2(x+3)=x^2+3x+2x+6=\boxed{x^2+5x+6}$

    **e)** $4(3-x)+x(x-1)=12-4x+x^2-x=\boxed{x^2-5x+12}$

    **f)** $2x(x+1)-x(3x-4)=2x^2+2x-3x^2+4x=\boxed{-x^2+6x}$

    **g)** $7-3(2x-5)=7-6x+15=\boxed{-6x+22}$

    **h)** $-x(2x-3)-4(x-2)=-2x^2+3x-4x+8=\boxed{-2x^2-x+8}$
- id: "s-02-08"
  feuille: "f-s-02"
  numero: 8
  partie: "Développement et réduction"
  etoiles: 1
  types: [Calcul]
  mots_cles: [développement]
  noeuds: [z-anneau]
  notions: [anneau]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Développer et réduire les expressions suivantes à l'aide de la double distributivité :

    **a)** $(x+4)(3x-2)$

    **b)** $(2x-1)(x+5)$

    **c)** $(3-x)(2x+7)$

    **d)** $(5x+2)(x-3)$

    **e)** $(-x+4)(2x-1)$

    **f)** $(3x-1)(3x+4)$
  corrige: |
    On applique la double distributivité $(a+b)(c+d)=ac+ad+bc+bd$, puis on réduit :

    **a)** $(x+4)(3x-2)=3x^2-2x+12x-8=\boxed{3x^2+10x-8}$

    **b)** $(2x-1)(x+5)=2x^2+10x-x-5=\boxed{2x^2+9x-5}$

    **c)** $(3-x)(2x+7)=6x+21-2x^2-7x=\boxed{-2x^2-x+21}$

    **d)** $(5x+2)(x-3)=5x^2-15x+2x-6=\boxed{5x^2-13x-6}$

    **e)** $(-x+4)(2x-1)=-2x^2+x+8x-4=\boxed{-2x^2+9x-4}$

    **f)** $(3x-1)(3x+4)=9x^2+12x-3x-4=\boxed{9x^2+9x-4}$
- id: "s-02-09"
  feuille: "f-s-02"
  numero: 9
  partie: "Développement et réduction"
  etoiles: 1
  types: [Calcul]
  mots_cles: [développement]
  noeuds: [z-anneau]
  notions: [anneau]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Développer puis réduire les expressions suivantes. On prendra garde aux signes $-$ placés devant les parenthèses. 
    $$\begin{aligned} &A=2x(x-1)-3(x+5) &&B=3(2x+1)-2(x-4) &&C=5-2(3x-1)+x\\ &D=(x+2)(x+3)-(x+1)(x-4) &&E=4x(x-2)-(2x-3)(x+1) &&F=-(x-1)(x+6)+2x^2 \end{aligned}$$
  corrige: |
    On développe, en n'oubliant pas qu'un signe $-$ devant une parenthèse revient à multiplier *tous* ses termes par $-1$ : 
    $$\begin{aligned} A &= 2x(x-1)-3(x+5)=2x^2-2x-3x-15 & &\text{d'où}\quad \boxed{A=2x^2-5x-15}\\[0.3em] B &= 3(2x+1)-2(x-4)=6x+3-2x+8 & &\text{d'où}\quad \boxed{B=4x+11}\\[0.3em] C &= 5-2(3x-1)+x=5-6x+2+x & &\text{d'où}\quad \boxed{C=-5x+7}\\[0.3em] D &= (x+2)(x+3)-(x+1)(x-4)\\ &= \left(x^2+5x+6\right)-\left(x^2-3x-4\right)=x^2+5x+6-x^2+3x+4 & &\text{d'où}\quad \boxed{D=8x+10}\\[0.3em] E &= 4x(x-2)-(2x-3)(x+1)\\ &= 4x^2-8x-\left(2x^2-x-3\right)=4x^2-8x-2x^2+x+3 & &\text{d'où}\quad \boxed{E=2x^2-7x+3}\\[0.3em] F &= -(x-1)(x+6)+2x^2\\ &= -\left(x^2+5x-6\right)+2x^2=-x^2-5x+6+2x^2 & &\text{d'où}\quad \boxed{F=x^2-5x+6} \end{aligned}$$
- id: "s-02-10"
  feuille: "f-s-02"
  numero: 10
  partie: "Développement et réduction"
  etoiles: 2
  types: [Calcul]
  mots_cles: [développement]
  noeuds: [z-anneau]
  notions: [anneau]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Développer et réduire les expressions suivantes :

    **1.** $G=(x+1)(x+2)(x+3)$

    **2.** $H=(2x-1)(x+3)(x-2)$

    **3.** $I=x\big(3-2(x+4)\big)$

    **4.** $J=(x+2)\big(x-(3x-1)\big)$
  corrige: |
    Pour un produit de trois facteurs, on développe les deux premiers, puis on multiplie le résultat par le troisième.

    **1.** Pour $G=(x+1)(x+2)(x+3)$, on développe d'abord $(x+1)(x+2)=x^2+3x+2$, puis : 
    $$G=\left(x^2+3x+2\right)(x+3)=x^3+3x^2+3x^2+9x+2x+6 \qquad\text{d'où}\qquad \boxed{G=x^3+6x^2+11x+6}$$

    **2.** Pour $H=(2x-1)(x+3)(x-2)$, on développe d'abord $(2x-1)(x+3)=2x^2+5x-3$, puis : 
    $$H=\left(2x^2+5x-3\right)(x-2)=2x^3-4x^2+5x^2-10x-3x+6 \qquad\text{d'où}\qquad \boxed{H=2x^3+x^2-13x+6}$$

    **3.** Pour $I=x\big(3-2(x+4)\big)$, on commence par la parenthèse intérieure : 
    $$I=x\big(3-2x-8\big)=x(-2x-5) \qquad\text{d'où}\qquad \boxed{I=-2x^2-5x}$$

    **4.** De même pour $J=(x+2)\big(x-(3x-1)\big)$ : 
    $$J=(x+2)(x-3x+1)=(x+2)(-2x+1)=-2x^2+x-4x+2 \qquad\text{d'où}\qquad \boxed{J=-2x^2-3x+2}$$
- id: "s-02-11"
  feuille: "f-s-02"
  numero: 11
  partie: "Développement et réduction"
  etoiles: 2
  types: [Calcul]
  mots_cles: [développement]
  noeuds: [z-anneau]
  notions: [anneau]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    On considère l'expression $K(x)=(2x-3)(x+1)-(x-4)(x+2)$.

    **1.** Calculer $K(0)$ et $K(2)$ en utilisant directement cette écriture.

    **2.** Développer et réduire $K(x)$.

    **3.** Retrouver les valeurs de $K(0)$ et $K(2)$ à l'aide de l'expression développée. Quelle écriture vous a paru la plus commode ?
  corrige: |
    **1.** On remplace directement $x$ dans l'écriture $K(x)=(2x-3)(x+1)-(x-4)(x+2)$ : 
    $$\begin{aligned} K(0) &= (-3)\times 1-(-4)\times 2=-3+8 & &\text{d'où}\quad \boxed{K(0)=5}\\ K(2) &= 1\times 3-(-2)\times 4=3+8 & &\text{d'où}\quad \boxed{K(2)=11} \end{aligned}$$

    **2.** On développe les deux produits, puis on soustrait : 
    $$\begin{aligned} K(x) &= (2x-3)(x+1)-(x-4)(x+2)\\ &= \left(2x^2+2x-3x-3\right)-\left(x^2+2x-4x-8\right)\\ &= \left(2x^2-x-3\right)-\left(x^2-2x-8\right)\\ &= 2x^2-x-3-x^2+2x+8 \end{aligned}$$

    $$\boxed{K(x)=x^2+x+5}$$

    **3.** Avec cette écriture : $K(0)=5$ et $K(2)=4+2+5=11$, ce qui confirme les résultats de la question 1.

    Pour $x=0$, l'écriture développée est la plus rapide (tous les termes en $x$ disparaissent) ; pour $x=2$, les deux écritures demandent un travail comparable. C'est donc la *valeur choisie* qui rend une écriture plus commode que l'autre, et non l'écriture elle-même.
- id: "s-02-12"
  feuille: "f-s-02"
  numero: 12
  partie: "Identités remarquables"
  etoiles: 1
  types: [Calcul]
  mots_cles: [développement, identités remarquables, "carré d'une expression"]
  noeuds: [z-anneau]
  notions: [anneau]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Développer les expressions suivantes en identifiant à chaque fois les nombres $a$ et $b$ de l'identité remarquable utilisée :

    **a)** $(x+5)^2$

    **b)** $(3x-2)^2$

    **c)** $(x+7)(x-7)$

    **d)** $(2x+3)^2$

    **e)** $(5-x)^2$

    **f)** $(4x+1)(4x-1)$
  corrige: |
    On identifie à chaque fois les nombres $a$ et $b$ avant d'appliquer la formule :

    **a)** $(x+5)^2=x^2+2\times x\times 5+5^2=\boxed{x^2+10x+25}$ ($a=x$ et $b=5$)

    **b)** $(3x-2)^2=(3x)^2-2\times 3x\times 2+2^2=\boxed{9x^2-12x+4}$ ($a=3x$ et $b=2$)

    **c)** $(x+7)(x-7)=x^2-7^2=\boxed{x^2-49}$ ($a=x$ et $b=7$)

    **d)** $(2x+3)^2=(2x)^2+2\times 2x\times 3+3^2=\boxed{4x^2+12x+9}$ ($a=2x$ et $b=3$)

    **e)** $(5-x)^2=5^2-2\times 5\times x+x^2=\boxed{25-10x+x^2}$ ($a=5$ et $b=x$)

    **f)** $(4x+1)(4x-1)=(4x)^2-1^2=\boxed{16x^2-1}$ ($a=4x$ et $b=1$)

    On prendra garde au fait que le carré porte sur le facteur tout entier : $(3x)^2=9x^2$ et non $3x^2$.
