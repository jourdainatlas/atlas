  notions: []
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Recopier et compléter les égalités suivantes, où les pointillés désignent un nombre ou une expression à trouver :

    **a)** $x^2+10x+\ldots=(x+\ldots)^2$

    **b)** $x^2-\ldots+49=(x-7)^2$

    **c)** $4x^2-\ldots=(2x+9)(2x-9)$

    **d)** $\ldots+12x+9=(\ldots+3)^2$

    **e)** $x^2-8x+\ldots=(x-\ldots)^2$

    **f)** $9x^2-25=(\ldots)(\ldots)$
  corrige: |
    **a)** $\boxed{x^2+10x+25=(x+5)^2}$

    **b)** $\boxed{x^2-14x+49=(x-7)^2}$

    **c)** $\boxed{4x^2-81=(2x+9)(2x-9)}$

    **d)** $\boxed{4x^2+12x+9=(2x+3)^2}$

    **e)** $\boxed{x^2-8x+16=(x-4)^2}$

    **f)** $\boxed{9x^2-25=(3x+5)(3x-5)}$

    On vérifie à chaque fois en développant le membre de droite.
- id: "s-02-22"
  feuille: "f-s-02"
  numero: 22
  partie: "Factorisation"
  etoiles: 2
  types: [Calcul]
  mots_cles: [identités remarquables, factorisation]
  noeuds: [z-anneau, z-polynomes]
  notions: [anneau, anneau-polynomes]
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Factoriser les expressions suivantes. On cherchera d'abord un facteur commun, puis on regardera si une identité remarquable apparaît.

    **a)** $2x^2-18$

    **b)** $3x^2+12x+12$

    **c)** $5x^2-45$

    **d)** $x^3-4x$

    **e)** $-2x^2+8$

    **f)** $4x^3+4x^2+x$
  corrige: |
    On extrait d'abord le facteur commun, ce qui fait apparaître une identité remarquable : 
    $$\begin{aligned} 2x^2-18 &= 2\left(x^2-9\right) & &\text{d'où}\quad \boxed{2(x+3)(x-3)}\\ 3x^2+12x+12 &= 3\left(x^2+4x+4\right) & &\text{d'où}\quad \boxed{3(x+2)^2}\\ 5x^2-45 &= 5\left(x^2-9\right) & &\text{d'où}\quad \boxed{5(x+3)(x-3)}\\ x^3-4x &= x\left(x^2-4\right) & &\text{d'où}\quad \boxed{x(x+2)(x-2)}\\ -2x^2+8 &= -2\left(x^2-4\right) & &\text{d'où}\quad \boxed{-2(x+2)(x-2)}\\ 4x^3+4x^2+x &= x\left(4x^2+4x+1\right) & &\text{d'où}\quad \boxed{x(2x+1)^2} \end{aligned}$$
- id: "s-02-23"
  feuille: "f-s-02"
  numero: 23
  partie: "Factorisation"
  etoiles: 2
  types: [Calcul]
  mots_cles: [identités remarquables, factorisation, "carré d'une expression"]
  noeuds: [z-anneau, z-polynomes]
  notions: [anneau, anneau-polynomes]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Factoriser les expressions suivantes : une identité remarquable y fait apparaître un facteur commun.

    **1.** $(x-1)^2-9$

    **2.** $(2x+1)^2-(x+3)^2$

    **3.** $16-(x+2)^2$

    **4.** $(3x-2)^2-(x-5)^2$

    **5.** $(x+4)^2-x^2$
  corrige: |
    On reconnaît une différence de deux carrés, dont les rôles de $a$ et $b$ sont tenus par des expressions :

    **1.** Dans $(x-1)^2-9$ : $a=x-1$ et $b=3$. 
    $$(x-1)^2-9=(x-1)^2-3^2=\big[(x-1)+3\big]\big[(x-1)-3\big] \qquad\text{d'où}\qquad \boxed{(x+2)(x-4)}$$

    **2.** Dans $(2x+1)^2-(x+3)^2$ : $a=2x+1$ et $b=x+3$. 
    $$(2x+1)^2-(x+3)^2=\big[(2x+1)+(x+3)\big]\big[(2x+1)-(x+3)\big] \qquad\text{d'où}\qquad \boxed{(3x+4)(x-2)}$$

    **3.** Dans $16-(x+2)^2$ : $a=4$ et $b=x+2$. 
    $$16-(x+2)^2=4^2-(x+2)^2=\big[4+(x+2)\big]\big[4-(x+2)\big] \qquad\text{d'où}\qquad \boxed{(x+6)(2-x)}$$

    **4.** Dans $(3x-2)^2-(x-5)^2$ : $a=3x-2$ et $b=x-5$. 
    $$(3x-2)^2-(x-5)^2=\big[(3x-2)+(x-5)\big]\big[(3x-2)-(x-5)\big] \qquad\text{d'où}\qquad \boxed{(4x-7)(2x+3)}$$

    **5.** Dans $(x+4)^2-x^2$ : $a=x+4$ et $b=x$. 
    $$(x+4)^2-x^2=\big[(x+4)+x\big]\big[(x+4)-x\big]=(2x+4)\times 4 \qquad\text{d'où}\qquad \boxed{8(x+2)}$$
- id: "s-02-24"
  feuille: "f-s-02"
  numero: 24
  partie: "Expressions rationnelles"
  etoiles: 1
  types: [Calcul]
  mots_cles: [expressions rationnelles]
  noeuds: [q-construction]
  notions: []
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Déterminer les valeurs interdites de chacune des expressions suivantes :

    **a)** $\dfrac{3x+1}{x-2}$

    **b)** $\dfrac{x+5}{x^2-9}$

    **c)** $\dfrac{2x}{3x+6}$

    **d)** $\dfrac{4}{(x-1)(x+7)}$

    **e)** $\dfrac{x-1}{x^2+1}$

    **f)** $\dfrac{x^2+2}{x^2-5x}$
  corrige: |
    Une valeur est interdite lorsqu'elle annule le dénominateur ; on factorise donc celui-ci lorsque c'est nécessaire.

    **a)** $x-2$ s'annule pour $\boxed{x=2}$

    **b)** $x^2-9=(x+3)(x-3)$ s'annule pour $\boxed{x=-3\text{ et }x=3}$

    **c)** $3x+6=3(x+2)$ s'annule pour $\boxed{x=-2}$

    **d)** Le produit s'annule pour $\boxed{x=1\text{ et }x=-7}$

    **e)** $x^2+1$ est toujours strictement positif : $\boxed{\text{aucune valeur interdite}}$

    **f)** $x^2-5x=x(x-5)$ s'annule pour $\boxed{x=0\text{ et }x=5}$
- id: "s-02-25"
  feuille: "f-s-02"
  numero: 25
  partie: "Expressions rationnelles"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [expressions rationnelles]
  noeuds: [q-construction]
  notions: []
  page_enonce: 5
  page_corrige: 9
  enonce: |
    On considère l'expression $R(x)=\dfrac{2x-1}{x^2-4}$.

    **1.** Déterminer les valeurs interdites de $R$.

    **2.** Calculer $R(0)$, $R(3)$ et $R\left(\dfrac{1}{2}\right)$.

    **3.** Le nombre $-2$ possède-t-il une image par $R$ ? Justifier.
  corrige: |
    **1.** Le dénominateur se factorise : $x^2-4=(x+2)(x-2)$, et ce produit s'annule lorsque l'un de ses facteurs est nul : 
    $$\boxed{\text{les valeurs interdites sont }-2\text{ et }2}$$

    **2.** Ces trois valeurs sont autorisées, on peut donc calculer : 
    $$R(0)=\frac{-1}{-4}=\boxed{\frac{1}{4}} \qquad R(3)=\frac{6-1}{9-4}=\frac{5}{5}=\boxed{1} \qquad R\left(\frac{1}{2}\right)=\frac{1-1}{\frac{1}{4}-4}=\boxed{0}$$

    **3.** Le nombre $-2$ est une valeur interdite : il annule le dénominateur, et la division par zéro est impossible. 
    $$\boxed{-2\text{ n'a pas d'image par }R}$$
- id: "s-02-26"
  feuille: "f-s-02"
  numero: 26
  partie: "Expressions rationnelles"
  etoiles: 2
  types: [Calcul]
  mots_cles: [factorisation, expressions rationnelles]
  noeuds: [z-polynomes, q-construction]
  notions: [anneau-polynomes]
  page_enonce: 6
  page_corrige: 10
  enonce: |
    Simplifier les expressions rationnelles suivantes, après avoir précisé les valeurs interdites. On factorisera le numérateur et le dénominateur.

    **a)** $\dfrac{x^2-4}{x^2+4x+4}$

    **b)** $\dfrac{3x+6}{x^2-4}$

    **c)** $\dfrac{x^2-9}{2x-6}$

    **d)** $\dfrac{4x^2-1}{2x+1}$

    **e)** $\dfrac{x^2+2x}{x^2-4}$

    **f)** $\dfrac{x^2-6x+9}{x^2-9}$
  corrige: |
    On factorise le numérateur et le dénominateur, puis on supprime le facteur commun. On rappelle qu'on ne simplifie que des *facteurs*, jamais des termes.

    **a)** Valeur interdite : $-2$. $\dfrac{x^2-4}{x^2+4x+4}=\dfrac{(x+2)(x-2)}{(x+2)^2}=\boxed{\dfrac{x-2}{x+2}}$

    **b)** Valeurs interdites : $-2$ et $2$. $\dfrac{3x+6}{x^2-4}=\dfrac{3(x+2)}{(x+2)(x-2)}=\boxed{\dfrac{3}{x-2}}$

    **c)** Valeur interdite : $3$. $\dfrac{x^2-9}{2x-6}=\dfrac{(x+3)(x-3)}{2(x-3)}=\boxed{\dfrac{x+3}{2}}$

    **d)** Valeur interdite : $-\dfrac{1}{2}$. $\dfrac{4x^2-1}{2x+1}=\dfrac{(2x+1)(2x-1)}{2x+1}=\boxed{2x-1}$

    **e)** Valeurs interdites : $-2$ et $2$. $\dfrac{x^2+2x}{x^2-4}=\dfrac{x(x+2)}{(x+2)(x-2)}=\boxed{\dfrac{x}{x-2}}$

    **f)** Valeurs interdites : $-3$ et $3$. $\dfrac{x^2-6x+9}{x^2-9}=\dfrac{(x-3)^2}{(x+3)(x-3)}=\boxed{\dfrac{x-3}{x+3}}$
- id: "s-02-27"
  feuille: "f-s-02"
  numero: 27
  partie: "Expressions rationnelles"
  etoiles: 2
  types: [Calcul]
  mots_cles: [expressions rationnelles]
  noeuds: [q-construction]
  notions: []
  page_enonce: 6
  page_corrige: 10
  enonce: |
    Écrire chacune des expressions suivantes sous la forme d'un quotient unique, après avoir précisé les valeurs interdites :

    **a)** $\dfrac{2}{x}+\dfrac{3}{x+1}$

    **b)** $x+\dfrac{1}{x-3}$

    **c)** $\dfrac{1}{x-1}-\dfrac{1}{x+1}$

    **d)** $\dfrac{x}{x+2}+2$

    **e)** $\dfrac{3}{x}\times\dfrac{x+1}{x-2}$

    **f)** $\dfrac{x+1}{x}\div\dfrac{x+1}{x-4}$
  corrige: |
    On réduit au même dénominateur avant d'additionner, et on multiplie numérateurs entre eux et dénominateurs entre eux pour un produit.

    **a)** Valeurs interdites : $0$ et $-1$. 
    $$\frac{2}{x}+\frac{3}{x+1}=\frac{2(x+1)}{x(x+1)}+\frac{3x}{x(x+1)}=\frac{2x+2+3x}{x(x+1)} \qquad\text{d'où}\qquad \boxed{\frac{5x+2}{x(x+1)}}$$

    **b)** Valeur interdite : $3$. 
    $$x+\frac{1}{x-3}=\frac{x(x-3)}{x-3}+\frac{1}{x-3} \qquad\text{d'où}\qquad \boxed{\frac{x^2-3x+1}{x-3}}$$

    **c)** Valeurs interdites : $1$ et $-1$. 
    $$\frac{1}{x-1}-\frac{1}{x+1}=\frac{x+1}{(x-1)(x+1)}-\frac{x-1}{(x-1)(x+1)} =\frac{x+1-x+1}{(x-1)(x+1)} \qquad\text{d'où}\qquad \boxed{\frac{2}{(x-1)(x+1)}}$$

    **d)** Valeur interdite : $-2$. 
    $$\frac{x}{x+2}+2=\frac{x}{x+2}+\frac{2(x+2)}{x+2}=\frac{x+2x+4}{x+2} \qquad\text{d'où}\qquad \boxed{\frac{3x+4}{x+2}}$$

    **e)** Valeurs interdites : $0$ et $2$. 
    $$\frac{3}{x}\times\frac{x+1}{x-2}=\frac{3\times(x+1)}{x\times(x-2)} \qquad\text{d'où}\qquad \boxed{\frac{3(x+1)}{x(x-2)}}$$

    **f)** Valeurs interdites : $0$, $4$ et $-1$ (cette dernière annulerait le diviseur). 
    $$\frac{x+1}{x}\div\frac{x+1}{x-4}=\frac{x+1}{x}\times\frac{x-4}{x+1} \qquad\text{d'où}\qquad \boxed{\frac{x-4}{x}}$$
- id: "s-02-28"
  feuille: "f-s-02"
  numero: 28
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Calcul]
  mots_cles: [factorisation, interprétation géométrique, somme et produit]
  noeuds: [z-polynomes, z-anneau]
  notions: [anneau-polynomes, anneau]
  page_enonce: 6
  page_corrige: 11
  enonce: |
    On considère un carré de côté $x$ (avec $x>3$) auquel on retire, dans un coin, un carré de côté $3$. La figure obtenue est coloriée ci-dessous *(la figure n'est pas à l'échelle)* :

    ![Figure](documents/figures/83b28c62bdd414d0.svg)

    **1.** Exprimer l'aire de la surface coloriée en fonction de $x$, comme une différence de deux carrés.

    **2.** Le trait rouge partage la surface coloriée en deux rectangles. Donner les dimensions de chacun d'eux en fonction de $x$, puis exprimer l'aire de la surface coloriée sous la forme d'une somme de deux produits.

    **3.** Factoriser l'expression obtenue à la question 2., et en déduire une égalité entre l'écriture de la question 1. et un produit.

    **4.** Vérifier cette égalité en développant.
  corrige: |
    **1.** La surface coloriée est le grand carré, d'aire $x^2$, privé du petit carré, d'aire $3^2$ : 
    $$\boxed{\mathcal{A}=x^2-9}$$

    **2.** Le trait rouge est tracé à la hauteur du côté du petit carré. Il partage la surface en :

    • un rectangle du bas, de largeur $x$ et de hauteur $x-3$ ;

    • un rectangle du haut, de largeur $x-3$ et de hauteur $3$.

    $$\boxed{\mathcal{A}=x(x-3)+3(x-3)}$$

    **3.** Le facteur commun est $(x-3)$ : 
    $$x(x-3)+3(x-3)=(x-3)(x+3)$$
     Les deux écritures désignant la même aire, on en déduit que : 
    $$\boxed{x^2-9=(x+3)(x-3)}$$

    **4.** On développe le membre de droite : 
    $$(x+3)(x-3)=x^2-3x+3x-9=x^2-9$$
     ce qui confirme l'égalité : on retrouve géométriquement l'identité de la différence de deux carrés.

    ![Figure](documents/figures/fb85817c45932d20.svg)
- id: "s-02-29"
  feuille: "f-s-02"
  numero: 29
  partie: "Exercices de synthèse"
  etoiles: 1
  types: [Calcul]
  mots_cles: [identités remarquables, interprétation géométrique, somme et produit]
  noeuds: [z-anneau]
