  page_enonce: 8
  page_corrige: 15
  enonce: |
    On considère l'expression $F(x)=\dfrac{x^2-1}{x^2+2x+1}$.

    **1.** Déterminer les valeurs interdites de $F$.

    **2.** Factoriser le numérateur et le dénominateur, puis simplifier $F(x)$.

    **3.** Calculer $F(0)$, $F(2)$ et $F(-3)$ à l'aide de la forme simplifiée.

    **4.** Écrire $F(x)-1$ sous la forme d'un quotient unique.

    **5.** En déduire que, pour toute valeur de $x$ autorisée, $F(x)=1-\dfrac{2}{x+1}$.
  corrige: |
    **1.** Le dénominateur se factorise : $x^2+2x+1=(x+1)^2$, et ce carré s'annule uniquement lorsque $x+1=0$ : 
    $$\boxed{\text{la seule valeur interdite est }-1}$$

    **2.** On factorise le numérateur à l'aide de la différence de deux carrés : 
    $$F(x)=\frac{(x-1)(x+1)}{(x+1)(x+1)}$$
     On simplifie alors par le facteur commun $(x+1)$, non nul : 
    $$\boxed{F(x)=\frac{x-1}{x+1}}$$

    **3.** Avec cette écriture simplifiée : 
    $$F(0)=\frac{-1}{1}=\boxed{-1} \qquad F(2)=\frac{1}{3}=\boxed{\frac{1}{3}} \qquad F(-3)=\frac{-4}{-2}=\boxed{2}$$

    **4.** On écrit $1=\dfrac{x+1}{x+1}$ afin d'obtenir le même dénominateur : 
    $$\begin{aligned} F(x)-1 &= \frac{x-1}{x+1}-\frac{x+1}{x+1}\\ &= \frac{x-1-(x+1)}{x+1}=\frac{x-1-x-1}{x+1} \end{aligned}$$

    $$\boxed{F(x)-1=\frac{-2}{x+1}}$$

    **5.** En ajoutant $1$ à chaque membre de l'égalité précédente, on obtient immédiatement, pour toute valeur de $x$ différente de $-1$ : 
    $$\boxed{F(x)=1-\frac{2}{x+1}}$$
     Cette écriture montre au passage que $F(x)$ ne vaut jamais exactement $1$, puisque le quotient $\dfrac{2}{x+1}$ ne s'annule pour aucune valeur de $x$.

