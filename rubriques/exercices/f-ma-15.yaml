- id: "ma-15-01"
  feuille: "f-ma-15"
  numero: 1
  partie: "Espaces de dimension finie"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [espaces de dimension finie, bases]
  noeuds: [v-dimension, v-bases-existence]
  notions: [espace-dimension-finie, dimension, base-vectorielle, theoreme-base-incomplete]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Pour quelles valeurs du réel $t$ la famille $\big((1, t), (t, 3)\big)$ est-elle une base de $\mathbb{R}^{2}$ ? Même question pour la famille $\big((1, 0, t), (1, 1, t), (t, 0, 1)\big)$ de $\mathbb{R}^{3}$.

    **2.** Montrer que $u_{1} = (0, 1, 1)$, $u_{2} = (1, 0, 1)$ et $u_{3} = (1, 1, 0)$ forment une base de $\mathbb{R}^{3}$, et déterminer les coordonnées de $(1, 1, 1)$ dans cette base.
  corrige: |
    **1.** Dans $\mathbb{R}^{2}$, de dimension $2$, deux vecteurs forment une base si et seulement s'ils ne sont pas colinéaires, c'est-à-dire si $1 \times 3 - t \times t \neq 0$. Dans $\mathbb{R}^{3}$, on résout $a(1, 0, t) + b(1, 1, t) + c(t, 0, 1) = 0$ : la deuxième coordonnée donne $b = 0$, puis $a + ct = 0$ et $at + c = 0$, d'où $c(1 - t^{2}) = 0$. La famille est libre, donc une base (théorème 4), si et seulement si $t^{2} \neq 1$. 
    $$\boxed{\text{base de } \mathbb{R}^{2} \iff t \neq \pm\sqrt{3}, \qquad \text{base de } \mathbb{R}^{3} \iff t \neq \pm 1}$$

    **2.** Si $au_{1} + bu_{2} + cu_{3} = 0$, alors $b + c = a + c = a + b = 0$, donc $a = b = c = 0$ : trois vecteurs libres de $\mathbb{R}^{3}$ forment une base. On cherche $(1, 1, 1) = au_{1} + bu_{2} + cu_{3}$ : $b + c = a + c = a + b = 1$, d'où $a + b + c = \frac{3}{2}$, puis $a = b = c = \frac{1}{2}$. 
    $$\boxed{(1, 1, 1) = \frac{1}{2}(u_{1} + u_{2} + u_{3})}$$
- id: "ma-15-02"
  feuille: "f-ma-15"
  numero: 2
  partie: "Espaces de dimension finie"
  etoiles: 1
  types: [Calcul]
  mots_cles: [espaces de dimension finie, bases]
  noeuds: [v-dimension, v-bases-existence]
  notions: [espace-dimension-finie, dimension, base-vectorielle, theoreme-base-incomplete]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Dans $\mathbb{R}^{4}$, compléter chacune des familles suivantes en une base, à l'aide de vecteurs de la base canonique $(e_{1}, e_{2}, e_{3}, e_{4})$.

    **1.** $u = (1, 0, 2, 3)$, $v = (0, 1, 2, 3)$, $w = (1, 2, 0, 3)$.

    **2.** $u = (1, -1, 1, -1)$, $v = (1, 1, 1, 1)$.
  corrige: |
    **(i)** Les vecteurs $u$, $v$, $w$ sont libres : si $au + bv + cw = 0$, les deux premières coordonnées donnent $a + c = 0$ et $b + 2c = 0$, puis la troisième $2a + 2b = 0$, soit $-2c - 4c = 0$, donc $c = 0$ et $a = b = 0$. On essaie d'ajouter $e_{2}$ : si $au + bv + cw + de_{2} = 0$, les première, troisième et quatrième coordonnées donnent $a + c = 0$, $2a + 2b = 0$, $3a + 3b + 3c = 0$, d'où $c = 0$, $a = 0$, $b = 0$, puis $d = 0$. 
    $$\boxed{(u, v, w, e_{2}) \text{ est une base de } \mathbb{R}^{4}}$$

    **(ii)** Les vecteurs $u$ et $v$ ne sont pas colinéaires. On vérifie de même que $(u, v, e_{1}, e_{2})$ est libre : les troisième et quatrième coordonnées de $au + bv + ce_{1} + de_{2}$ sont $a + b$ et $-a + b$, d'où $a = b = 0$, puis $c = d = 0$. 
    $$\boxed{(u, v, e_{1}, e_{2}) \text{ est une base de } \mathbb{R}^{4}}$$
     *À retenir.* Quatre vecteurs libres dans un espace de dimension $4$ forment une base : on n'a pas à vérifier qu'ils engendrent $\mathbb{R}^{4}$.
- id: "ma-15-03"
  feuille: "f-ma-15"
  numero: 3
  partie: "Espaces de dimension finie"
  etoiles: 1
  types: [Calcul]
  mots_cles: [espaces de dimension finie, dimension, bases]
  noeuds: [v-dimension, v-bases-existence]
  notions: [espace-dimension-finie, dimension, base-vectorielle, theoreme-base-incomplete]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Donner une base et la dimension des sous-espaces suivants de $\mathbb{R}^{4}$ : 
    $$E = \mathrm{Vect}\big((1, 2, 1, 0), (4, -2, 1, 1), (7, 2, 4, 2), (11, 4, 1, 3)\big),$$

    $$F = \{(x, y, z, t) \in \mathbb{R}^{4} \mid 3x - 2y - z + 2t = 0 \text{ et } 3y - 2z + t = 0\}.$$
  corrige: |
    Pour $E$, la méthode du pivot montre que les quatre vecteurs sont libres, une relation $\sum \lambda_{k}x_{k} = 0$ n'ayant que la solution nulle. Quatre vecteurs libres de $\mathbb{R}^{4}$ forment une base, donc $E = \mathbb{R}^{4}$. Pour $F$, la seconde équation donne $z = \frac{3y + t}{2}$, puis la première $x = \frac{2y + z - 2t}{3} = \frac{7y - 3t}{6}$ ; avec $y = 6$, $t = 0$ puis $y = 0$, $t = 6$, on obtient deux vecteurs non colinéaires, et $\dim F = 4 - 2 = 2$ par la proposition 9, les deux équations n'étant pas proportionnelles. 
    $$\boxed{E = \mathbb{R}^{4}, \ \dim E = 4 \qquad F = \mathrm{Vect}\big((7, 6, 9, 0), (-3, 0, 3, 6)\big), \ \dim F = 2}$$
- id: "ma-15-04"
  feuille: "f-ma-15"
  numero: 4
  partie: "Espaces de dimension finie"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [espaces de dimension finie, bases, espaces de polynômes]
  noeuds: [v-dimension, v-bases-existence, pol-anneau]
  notions: [espace-dimension-finie, dimension, base-vectorielle, theoreme-base-incomplete, multiplicite-racine]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Soit $P = X^{4} + 2X^{3} - 2X^{2} - 6X + 5$.

    **1.** Déterminer la multiplicité de la racine $1$ de $P$, puis factoriser $P$ dans $\mathbb{R}[X]$.

    **2.** Montrer que $\big((X - 1)^{4}, (X - 1)^{3}, (X - 1)^{2}, X - 1, 1\big)$ est une base de $\mathbb{R}_{4}[X]$, et donner les coordonnées de $P$ dans cette base.
  corrige: |
    **1.** On a $P(1) = 0$, $P'(1) = 4 + 6 - 4 - 6 = 0$ et $P''(1) = 12 + 12 - 4 = 20 \neq 0$ : $1$ est racine double. La division par $(X - 1)^{2}$ donne le quotient $X^{2} + 4X + 5$, de discriminant $-4 < 0$. 
    $$\boxed{P = (X - 1)^{2}(X^{2} + 4X + 5)}$$

    **2.** La famille est à degrés échelonnés, donc une base (proposition 10 du chapitre 14). La formule de Taylor en $1$ donne les coordonnées $\frac{P^{(k)}(1)}{k!}$, soit $0$, $0$, $10$, $\frac{P'''(1)}{6} = \frac{24 + 12}{6} = 6$ et $1$. 
    $$\boxed{P = (X - 1)^{4} + 6(X - 1)^{3} + 10(X - 1)^{2}}$$
- id: "ma-15-05"
  feuille: "f-ma-15"
  numero: 5
  partie: "Espaces de dimension finie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [espaces de dimension finie, familles libres, bases]
  noeuds: [v-dimension, v-echange, v-bases-existence]
  notions: [espace-dimension-finie, dimension, base-vectorielle, theoreme-base-incomplete]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Soit $(e_{1}, \dots, e_{n})$ une famille génératrice de $\mathbb{K}^{n}$. Montrer que $(e_{2}, \dots, e_{n})$ est libre.

    **2.** Pour $k \in [\![1\,;n]\!]$, on pose $u_{k} = (k, k - 1, \dots, 2, 1, 0, \dots, 0) \in \mathbb{K}^{n}$, dont les $n - k$ dernières coordonnées sont nulles. Montrer que $(u_{1}, \dots, u_{n})$ est une base de $\mathbb{K}^{n}$.
  corrige: |
    **1.** Une famille génératrice de $n$ vecteurs de $\mathbb{K}^{n}$ est une base (théorème 4), donc libre, et sa sous-famille $(e_{2}, \dots, e_{n})$ aussi.

    **2.** Si $\sum_{k} \lambda_{k}u_{k} = 0$, la $n$-ième coordonnée vaut $\lambda_{n}$, car seul $u_{n}$ a une $n$-ième coordonnée non nulle, égale à $1$ ; donc $\lambda_{n} = 0$. La $(n - 1)$-ième coordonnée vaut alors $\lambda_{n - 1}$, et ainsi de suite : la famille est libre, donc une base, puisqu'elle a $n$ éléments. 
    $$\boxed{(u_{1}, \dots, u_{n}) \text{ est une base de } \mathbb{K}^{n}}$$
- id: "ma-15-06"
  feuille: "f-ma-15"
  numero: 6
  partie: "Espaces de dimension finie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [espaces de dimension finie, bases, espaces de polynômes]
  noeuds: [v-dimension, v-bases-existence, pol-anneau]
  notions: [espace-dimension-finie, dimension, base-vectorielle, theoreme-base-incomplete]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    *Polynômes de Bernstein.* Soit $n \in \mathbb{N}$. Pour $k \in [\![0\,;n]\!]$, on pose $B_{k} = X^{k}(1 - X)^{n - k}$. Montrer que $(B_{0}, \dots, B_{n})$ est une base de $\mathbb{R}_{n}[X]$.
  corrige: |
    La famille a $n + 1$ éléments, dans un espace de dimension $n + 1$ : il suffit de montrer qu'elle est libre. Si $\sum \lambda_{k}B_{k} = 0$, l'évaluation en $0$ donne $\lambda_{0} = 0$, car $B_{k}(0) = 0$ pour $k \geqslant 1$. On divise alors par $X$ ; le polynôme $\sum_{k \geqslant 1} \lambda_{k}X^{k - 1}(1 - X)^{n - k}$ est nul, et son évaluation en $0$ donne $\lambda_{1} = 0$. Une récurrence conclut. 
    $$\boxed{(B_{0}, \dots, B_{n}) \text{ est une base de } \mathbb{R}_{n}[X]}$$
- id: "ma-15-07"
  feuille: "f-ma-15"
  numero: 7
  partie: "Espaces de dimension finie"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [espaces de dimension finie, bases, espaces de polynômes]
  noeuds: [v-dimension, v-bases-existence, pol-anneau]
  notions: [espace-dimension-finie, dimension, base-vectorielle, theoreme-base-incomplete]
  page_enonce: 2
  page_corrige: 2
  enonce: |
    **1.** Soit $n \geqslant 1$ et $\alpha \in \mathbb{R}$. Montrer que $F = \{P \in \mathbb{R}_{n}[X] \mid P(\alpha) = 0\}$ est un sous-espace de $\mathbb{R}_{n}[X]$, dont $\big((X - \alpha)X^{k}\big)_{0 \leqslant k \leqslant n - 1}$ est une base. Donner les coordonnées de $(X - \alpha)^{n}$ dans cette base.

    **2.** Soit $a \neq b$ deux réels. Déterminer une base de $\{P \in \mathbb{R}_{4}[X] \mid P(a) = P(b) = 0\}$.
  corrige: |
    **1.** L'ensemble $F$ est le noyau de la forme linéaire non nulle $P \mapsto P(\alpha)$ : c'est un hyperplan, de dimension $n$ (théorème 12). Les $n$ polynômes $(X - \alpha)X^{k}$ appartiennent à $F$ et sont de degrés distincts, donc libres : c'est une base. En écrivant $(X - \alpha)^{n} = (X - \alpha)\big(X - \alpha\big)^{n - 1}$ et en développant le second facteur par la formule du binôme : 
    $$\boxed{(X - \alpha)^{n} = \sum_{k = 0}^{n - 1} \binom{n - 1}{k}(-\alpha)^{n - 1 - k}\,(X - \alpha)X^{k}}$$

    **2.** Un polynôme de $\mathbb{R}_{4}[X]$ s'annulant en $a$ et en $b$ s'écrit $(X - a)(X - b)Q$ avec $\deg Q \leqslant 2$, et réciproquement : l'application $Q \mapsto (X - a)(X - b)Q$ est un isomorphisme de $\mathbb{R}_{2}[X]$ sur ce sous-espace. 
    $$\boxed{\big((X - a)(X - b),\ X(X - a)(X - b),\ X^{2}(X - a)(X - b)\big)}$$
- id: "ma-15-08"
  feuille: "f-ma-15"
  numero: 8
  partie: "Espaces de dimension finie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [espaces de dimension finie, dimension, bases, espaces de polynômes, suites récurrentes linéaires]
  noeuds: [v-dimension, v-bases-existence, pol-anneau, v-espace]
  notions: [espace-dimension-finie, dimension, base-vectorielle, theoreme-base-incomplete]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Montrer que l'ensemble des suites arithmétiques complexes est un sous-espace de dimension $2$ de $\mathbb{C}^{\mathbb{N}}$, et en donner une base.

    **2.** Soit $P = X^{2} + \alpha X + \beta \in \mathbb{K}[X]$ ayant deux racines distinctes $\rho$ et $\sigma$ dans $\mathbb{K}$, et 
    $$R = \{(u_{n}) \in \mathbb{K}^{\mathbb{N}} \mid u_{n + 2} + \alpha u_{n + 1} + \beta u_{n} = 0 \text{ pour tout } n\}.$$
     Montrer que $R$ est un plan vectoriel, puis en déduire, sans refaire le calcul du chapitre 7, que $\big((\rho^{n}), (\sigma^{n})\big)$ est une base de $R$.
  corrige: |
    **1.** L'application $(u_{n}) \mapsto (u_{0}, u_{1} - u_{0})$ est un isomorphisme de l'espace des suites arithmétiques sur $\mathbb{C}^{2}$, puisqu'une suite arithmétique est déterminée par son premier terme et sa raison. Il est de dimension $2$, de base $\big((1)_{n}, (n)_{n}\big)$, images réciproques de la base canonique.

    **2.** Par la proposition 1 (iii) du cours, $R$ est de dimension $2$. Les suites $(\rho^{n})$ et $(\sigma^{n})$ appartiennent à $R$, puisque $\rho^{2} + \alpha\rho + \beta = 0$, et elles ne sont pas colinéaires, puisque leurs deux premiers termes $(1, \rho)$ et $(1, \sigma)$ ne le sont pas. Deux vecteurs libres d'un plan en forment une base. 
    $$\boxed{R = \mathrm{Vect}\big((\rho^{n}), (\sigma^{n})\big)}$$
     La dimension remplace le calcul : on n'a pas eu à montrer que toute solution est combinaison des deux suites.
- id: "ma-15-09"
  feuille: "f-ma-15"
  numero: 9
  partie: "Espaces de dimension finie"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [espaces de dimension finie, dimension, bases, hyperplans, suites récurrentes linéaires]
  noeuds: [v-dimension, v-bases-existence, v-dual, v-espace]
  notions: [espace-dimension-finie, dimension, base-vectorielle, theoreme-base-incomplete, forme-lineaire]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $T \in \mathbb{N}^{*}$ et $P_{T} = \{(u_{n}) \in \mathbb{C}^{\mathbb{N}} \mid u_{n + T} = u_{n} \text{ pour tout } n\}$ l'espace des suites $T$-périodiques.

    **1.** Montrer que $P_{T}$ est un sous-espace de dimension finie de $\mathbb{C}^{\mathbb{N}}$, et déterminer sa dimension.

    **2.** Montrer que la famille $\big((\omega^{n})_{n \in \mathbb{N}}\big)_{\omega \in \mathbb{U}_{T}}$ est une base de $P_{T}$.

    **3.** Montrer que la réunion $P = \bigcup_{T \geqslant 1} P_{T}$ est un sous-espace de $\mathbb{C}^{\mathbb{N}}$, et en déterminer une base.
  corrige: |
    **1.** L'application $u \mapsto (u_{0}, \dots, u_{T - 1})$ est un isomorphisme de $P_{T}$ sur $\mathbb{C}^{T}$ : une suite $T$-périodique est déterminée par ses $T$ premiers termes, qui sont quelconques. 
    $$\boxed{\dim P_{T} = T}$$

    **2.** Pour $\omega \in \mathbb{U}_{T}$, la suite $(\omega^{n})$ est $T$-périodique. Montrons que des suites géométriques de raisons distinctes $\omega_{1}, \dots, \omega_{m}$ sont libres, par récurrence sur $m$. Si $\sum \lambda_{k}\omega_{k}^{n} = 0$ pour tout $n$, on écrit cette égalité au rang $n + 1$ et l'on retranche $\omega_{m}$ fois l'égalité au rang $n$ : $\sum_{k < m} \lambda_{k}(\omega_{k} - \omega_{m})\omega_{k}^{n} = 0$. L'hypothèse de récurrence donne $\lambda_{k}(\omega_{k} - \omega_{m}) = 0$, donc $\lambda_{k} = 0$ pour $k < m$, puis $\lambda_{m} = 0$. On obtient ainsi $T$ suites libres dans $P_{T}$, de dimension $T$. 
    $$\boxed{\big((\omega^{n})_{n}\big)_{\omega \in \mathbb{U}_{T}} \text{ est une base de } P_{T}}$$

    **3.** La suite nulle est périodique ; si $u$ est $T$-périodique et $v$ est $S$-périodique, $\lambda u + v$ est $TS$-périodique : $P$ est un sous-espace. La famille des $(\omega^{n})$, $\omega$ parcourant l'ensemble des racines de l'unité, est libre par la question 2, et elle engendre $P$, puisque toute suite périodique appartient à un $P_{T}$. 
    $$\boxed{\text{Base de } P : \big((\omega^{n})_{n}\big)_{\omega \in \bigcup_{T} \mathbb{U}_{T}}}$$
- id: "ma-15-10"
  feuille: "f-ma-15"
  numero: 10
  partie: "Espaces de dimension finie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [espaces de dimension finie, dimension, bases]
  noeuds: [v-dimension, v-bases-existence]
  notions: [espace-dimension-finie, dimension, base-vectorielle, theoreme-base-incomplete]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $E$ l'ensemble des fonctions continues sur $[-1, 1]$, affines sur $[-1, 0]$ et sur $[0, 1]$. Montrer que $E$ est un sous-espace vectoriel de $\mathcal{C}([-1, 1], \mathbb{R})$ de dimension $3$, et en donner une base.
  corrige: |
    Une fonction de $E$ est déterminée par ses valeurs en $-1$, $0$ et $1$, qui sont quelconques : l'application $f \mapsto \big(f(-1), f(0), f(1)\big)$ est un isomorphisme de $E$ sur $\mathbb{R}^{3}$, et $E$, qui est stable par combinaison linéaire, est un sous-espace de dimension $3$. Les fonctions $f_{1} : x \mapsto \max(-x, 0)$, $f_{2} : x \mapsto \max(x, 0)$ et la constante $1$ ont pour images $(1, 0, 0)$, $(0, 0, 1)$ et $(1, 1, 1)$, qui forment une base de $\mathbb{R}^{3}$. 
    $$\boxed{\dim E = 3, \qquad \text{base } (f_{1}, f_{2}, 1)}$$
- id: "ma-15-11"
  feuille: "f-ma-15"
  numero: 11
  partie: "Espaces de dimension finie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [espaces de dimension finie, dimension, isomorphismes, espaces de polynômes]
  noeuds: [v-dimension, v-rang, pol-anneau]
  notions: [espace-dimension-finie, dimension, isomorphisme]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Construire un isomorphisme de $\mathbb{K}[X]$ sur $\mathbb{K} \times \mathbb{K}[X]$, et en déduire une nouvelle preuve du fait que $\mathbb{K}[X]$ n'est pas de dimension finie.

    **2.** Montrer que $\mathcal{C}(\mathbb{R}, \mathbb{R})$ est de dimension infinie.
  corrige: |
    **1.** L'application $P \mapsto \Big(P(0), \frac{P - P(0)}{X}\Big)$ est linéaire, de réciproque $(a, Q) \mapsto a + XQ$. Si $\mathbb{K}[X]$ était de dimension finie $d$, de base $(b_{1}, \dots, b_{d})$, la famille $\big((1, 0), (0, b_{1}), \dots, (0, b_{d})\big)$ serait une base de $\mathbb{K} \times \mathbb{K}[X]$, de dimension $d + 1$ ; or deux espaces isomorphes ont la même dimension (proposition 6), d'où $d = d + 1$, ce qui est absurde. 
    $$\boxed{\mathbb{K}[X] \simeq \mathbb{K} \times \mathbb{K}[X], \text{ donc } \mathbb{K}[X] \text{ est de dimension infinie.}}$$

    **2.** L'espace $\mathcal{C}(\mathbb{R}, \mathbb{R})$ contient la famille libre infinie des fonctions $x \mapsto x^{k}$, $k \in \mathbb{N}$ : il est de dimension infinie, puisqu'un espace de dimension $n$ ne contient aucune famille libre de $n + 1$ vecteurs (théorème 1).
- id: "ma-15-12"
  feuille: "f-ma-15"
  numero: 12
  partie: "Espaces de dimension finie"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [espaces de dimension finie, dimension, bases, espaces de polynômes]
  noeuds: [v-dimension, v-bases-existence, pol-anneau]
  notions: [espace-dimension-finie, dimension, base-vectorielle, theoreme-base-incomplete]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $k \geqslant 1$ et $Q = X^{k} + \alpha_{k - 1}X^{k - 1} + \cdots + \alpha_{1}X + \alpha_{0} \in \mathbb{C}[X]$ un polynôme ayant $k$ racines distinctes $\rho_{1}, \dots, \rho_{k}$. Montrer que l'ensemble 
    $$R = \{(u_{n}) \in \mathbb{C}^{\mathbb{N}} \mid u_{n + k} + \alpha_{k - 1}u_{n + k - 1} + \cdots + \alpha_{1}u_{n + 1} + \alpha_{0}u_{n} = 0 \text{ pour tout } n\}$$
     est un sous-espace de $\mathbb{C}^{\mathbb{N}}$ de dimension $k$, et en donner une base.
  corrige: |
    L'application $u \mapsto (u_{0}, \dots, u_{k - 1})$ est un isomorphisme de $R$ sur $\mathbb{C}^{k}$ : une suite de $R$ est déterminée par ses $k$ premiers termes, choisis arbitrairement, la relation calculant les suivants. Donc $\dim R = k$. Pour chaque racine $\rho_{i}$, la suite $(\rho_{i}^{n})$ appartient à $R$, puisque $\rho_{i}^{n}Q(\rho_{i}) = 0$. Ces $k$ suites géométriques de raisons distinctes sont libres (exercice 9), donc forment une base. 
    $$\boxed{\dim R = k, \qquad R = \mathrm{Vect}\big((\rho_{1}^{n}), \dots, (\rho_{k}^{n})\big)}$$
- id: "ma-15-13"
  feuille: "f-ma-15"
  numero: 13
  partie: "Espaces de dimension finie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [espaces de dimension finie, familles libres]
  noeuds: [v-dimension, v-echange]
  notions: [espace-dimension-finie, dimension]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **1.** Soit $x_{1}, \dots, x_{n}, y_{1}, \dots, y_{n} \in E$ tels que la famille $(x_{1} + y_{1}, \dots, x_{n} + y_{n})$ soit libre. Montrer que $\mathrm{rg}(x_{1}, \dots, x_{n}, y_{1}, \dots, y_{n}) \geqslant n$.

    **2.** Soit $(u_{1}, \dots, u_{n})$ une famille de vecteurs de $E$ et $p \leqslant q$ deux éléments de $[\![1\,;n]\!]$. Montrer que 
    $$0 \leqslant \mathrm{rg}(u_{1}, \dots, u_{q}) - \mathrm{rg}(u_{1}, \dots, u_{p}) \leqslant q - p.$$
  corrige: |
    **1.** Les vecteurs $x_{i} + y_{i}$ appartiennent à $V = \mathrm{Vect}(x_{1}, \dots, x_{n}, y_{1}, \dots, y_{n})$, qui contient donc une famille libre de $n$ vecteurs : $\dim V \geqslant n$ (théorème 1), c'est-à-dire $\mathrm{rg}(x_{1}, \dots, y_{n}) \geqslant n$ (proposition 2).

    **2.** Notons $V_{p} = \mathrm{Vect}(u_{1}, \dots, u_{p})$. On a $V_{p} \subset V_{q}$, d'où la première inégalité. Par ailleurs, $V_{q}$ est la somme de $V_{p}$ et de $\mathrm{Vect}(u_{p + 1}, \dots, u_{q})$, et la proposition 5 donne 
    $$\dim V_{q} \leqslant \dim V_{p} + (q - p).$$

    $$\boxed{0 \leqslant \mathrm{rg}(u_{1}, \dots, u_{q}) - \mathrm{rg}(u_{1}, \dots, u_{p}) \leqslant q - p}$$
- id: "ma-15-14"
  feuille: "f-ma-15"
  numero: 14
  partie: "Espaces de dimension finie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [espaces de dimension finie, familles libres, rang]
  noeuds: [v-dimension, v-echange, v-rang]
  notions: [espace-dimension-finie, dimension, rang]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Soit $(f_{1}, \dots, f_{n})$ une famille libre de fonctions dérivables de $\mathbb{R}$ dans $\mathbb{R}$. Montrer que le rang de la famille $(f_{1}', \dots, f_{n}')$ est au moins $n - 1$.
  corrige: |
    Soit $V = \mathrm{Vect}(f_{1}, \dots, f_{n})$, de dimension $n$. La dérivation $f \mapsto f'$ est linéaire et surjective de $V$ sur l'espace $\mathrm{Vect}(f_{1}', \dots, f_{n}')$. Son noyau est formé des fonctions constantes de $V$, donc de dimension au plus $1$. Le théorème du rang donne 
    $$\boxed{\mathrm{rg}(f_{1}', \dots, f_{n}') = n - \dim\mathrm{Ker}\, \geqslant n - 1}$$
     L'égalité a lieu lorsque $V$ contient les constantes, par exemple pour $(1, x, x^{2})$, dont les dérivées $(0, 1, 2x)$ sont de rang $2$.
- id: "ma-15-15"
  feuille: "f-ma-15"
  numero: 15
  partie: "Sous-espaces et dimension"
  etoiles: 1
  types: [Calcul]
  mots_cles: [sous-espaces et dimension, bases]
  noeuds: [v-dimension, v-bases-existence]
  notions: [dimension, base-vectorielle, theoreme-base-incomplete]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    **1.** Dans $\mathbb{R}^{3}$, donner une base de $F = \{(x, y, z) \mid x - 2y + z = 0\}$ et de $G = \{(a, a + b, b) \mid a, b \in \mathbb{R}\}$.

    **2.** Dans $\mathbb{R}^{4}$, donner une base de $F = \{(x, y, z, t) \mid x + y + z = 0 \text{ et } 2x + y + z - t = 0\}$, puis de $F + G$, où $G = \mathrm{Vect}\big((1, 1, 1, 1)\big)$.
  corrige: |
    **1.** Pour $F$, on écrit $x = 2y - z$, ce qui donne $F = \mathrm{Vect}\big((2, 1, 0), (-1, 0, 1)\big)$. Pour $G$, on écrit $(a, a + b, b) = a(1, 1, 0) + b(0, 1, 1)$. Dans les deux cas, les deux vecteurs ne sont pas colinéaires. 
    $$\boxed{F : \big((2, 1, 0), (-1, 0, 1)\big), \qquad G : \big((1, 1, 0), (0, 1, 1)\big)}$$

    **2.** En retranchant les équations de $F$, on obtient $t = x$, puis $z = -x - y$, d'où 
    $$F = \mathrm{Vect}\big((1, 0, -1, 1), (0, 1, -1, 0)\big),$$
     de dimension $2$. Le vecteur $(1, 1, 1, 1)$ n'appartient pas à $F$, puisque $1 + 1 + 1 \neq 0$ : $F \cap G = \{0\}$, et $F + G = F \oplus G$ est de dimension $3$. 
    $$\boxed{F + G = \mathrm{Vect}\big((1, 0, -1, 1), (0, 1, -1, 0), (1, 1, 1, 1)\big)}$$
- id: "ma-15-16"
  feuille: "f-ma-15"
  numero: 16
  partie: "Sous-espaces et dimension"
  etoiles: 1
  types: [Calcul]
  mots_cles: [sous-espaces et dimension, bases, supplémentaires, formule de Grassmann]
  noeuds: [v-dimension, v-bases-existence, v-somme-directe]
  notions: [dimension, base-vectorielle, theoreme-base-incomplete, supplementaire]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Dans $\mathbb{R}^{3}$, on considère les couples de sous-espaces suivants. Dans chaque cas, donner une base de $F$, de $G$ et de $F \cap G$, déterminer $F + G$, et dire si $F$ et $G$ sont supplémentaires.

    **1.** $F = \{x - 2y + z = 0\}$ et $G = \{2x - y + 2z = 0\}$.

    **2.** $F = \{x - y - 2z = 0\}$ et $G = \{(x, y, z) \mid x = 2y = x + z\}$.

    **3.** $F = \{(a, a, a) \mid a \in \mathbb{R}\}$ et $G = \{(b + c, b, c) \mid b, c \in \mathbb{R}\}$.
  corrige: |
    **(i)** On trouve $F = \mathrm{Vect}\big((2, 1, 0), (-1, 0, 1)\big)$ et $G = \mathrm{Vect}\big((1, 2, 0), (-1, 0, 1)\big)$. Le vecteur $(2, 1, 0)$ n'appartient pas à $G$, donc $F \neq G$ et $\dim(F \cap G) \leqslant 1$ (théorème 5) ; comme $(-1, 0, 1)$ vérifie les deux équations, $F \cap G$ est la droite qu'il engendre. Par Grassmann, $\dim(F + G) = 2 + 2 - 1 = 3$. 
    $$\boxed{F \cap G = \mathbb{R}(-1, 0, 1), \quad F + G = \mathbb{R}^{3}, \quad \text{non supplémentaires}}$$

    **(ii)** On a $F = \mathrm{Vect}\big((1, 1, 0), (2, 0, 1)\big)$. Les conditions $x = 2y$ et $2y = x + z$ donnent $z = 0$ et $x = 2y$ : $G = \mathbb{R}(2, 1, 0)$. Ce vecteur n'est pas dans $F$, puisque $2 - 1 - 0 \neq 0$, donc $F \cap G = \{0\}$, et les dimensions ont pour somme $3$ (proposition 4). 
    $$\boxed{F \cap G = \{0\}, \quad \mathbb{R}^{3} = F \oplus G}$$

    **(iii)** On a $F = \mathbb{R}(1, 1, 1)$ et $G = \mathrm{Vect}\big((1, 1, 0), (1, 0, 1)\big)$. Si $(a, a, a) = (b + c, b, c)$, alors $b = c = a$ et $a = 2a$, donc $a = 0$ : même conclusion. 
    $$\boxed{\mathbb{R}^{3} = F \oplus G}$$
- id: "ma-15-17"
  feuille: "f-ma-15"
  numero: 17
  partie: "Sous-espaces et dimension"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [sous-espaces et dimension, bases, supplémentaires, formule de Grassmann]
  noeuds: [v-dimension, v-bases-existence, v-somme-directe]
  notions: [dimension, base-vectorielle, theoreme-base-incomplete, supplementaire]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** Dans $\mathbb{R}^{4}$, on pose $F = \{(a, b, c, d) \mid b - 2c + d = 0\}$ et $G = \{(a, b, c, d) \mid a = d \text{ et } b = 2c\}$. Donner une base de $F$, de $G$ et de $F \cap G$, puis montrer que $F + G = \mathbb{R}^{4}$.

    **2.** Dans $\mathbb{R}^{4}$, on pose $F = \{(x, y, z, t) \mid x + y + z + t = 0\}$ et $G = \{(2a, -a, 0, a) \mid a \in \mathbb{R}\}$. Montrer que $F$ et $G$ sont supplémentaires, et décomposer $(1, 2, 3, 4)$ selon $F \oplus G$.
  corrige: |
    **1.** L'équation de $F$ donne $b = 2c - d$ : $F = \mathrm{Vect}\big((1, 0, 0, 0), (0, 2, 1, 0), (0, -1, 0, 1)\big)$, de dimension $3$. Pour $G$, $(d, 2c, c, d) = c(0, 2, 1, 0) + d(1, 0, 0, 1)$ : $\dim G = 2$. Un vecteur de $G$ appartient à $F$ si et seulement si $2c - 2c + d = 0$, soit $d = 0$. La formule de Grassmann donne $\dim(F + G) = 3 + 2 - 1 = 4$, donc $F + G = \mathbb{R}^{4}$. 
    $$\boxed{F \cap G = \mathbb{R}(0, 2, 1, 0), \qquad F + G = \mathbb{R}^{4}}$$

    **2.** Le sous-espace $F$ est un hyperplan, et $(2, -1, 0, 1) \notin F$, puisque la somme de ses coordonnées vaut $2$ : $\mathbb{R}^{4} = F \oplus G$ (théorème 7 du chapitre 14). Pour décomposer $(1, 2, 3, 4) = f + a(2, -1, 0, 1)$, la somme des coordonnées donne $10 = 0 + 2a$, donc $a = 5$. 
    $$\boxed{(1, 2, 3, 4) = (-9, 7, 3, -1) + 5(2, -1, 0, 1)}$$
- id: "ma-15-18"
  feuille: "f-ma-15"
  numero: 18
  partie: "Sous-espaces et dimension"
  etoiles: 1
  types: [Calcul]
  mots_cles: [sous-espaces et dimension, dimension, bases, supplémentaires]
  noeuds: [v-dimension, v-bases-existence, v-somme-directe]
  notions: [dimension, base-vectorielle, theoreme-base-incomplete, supplementaire]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** Soit $F = \{P \in \mathbb{R}_{3}[X] \mid P(0) = P'(0) = 0\}$. Donner une base de $F$ et un supplémentaire de $F$ dans $\mathbb{R}_{3}[X]$.

    **2.** Soit $t \in \mathbb{R}$, $D_{t} = \mathrm{Vect}\big((t, t, 1)\big)$ et $P_{t} = \mathrm{Vect}\big((1, t, 1), (2, 1, 1)\big)$. Préciser les dimensions de $D_{t}$ et de $P_{t}$, et donner une condition nécessaire et suffisante sur $t$ pour que $D_{t} \oplus P_{t} = \mathbb{R}^{3}$.
  corrige: |
    **1.** Un polynôme $a + bX + cX^{2} + dX^{3}$ vérifie $P(0) = P'(0) = 0$ si et seulement si $a = b = 0$. 
    $$\boxed{F = \mathrm{Vect}(X^{2}, X^{3}), \qquad \mathbb{R}_{3}[X] = F \oplus \mathrm{Vect}(1, X)}$$

    **2.** Le vecteur $(t, t, 1)$ n'est pas nul, donc $\dim D_{t} = 1$ ; les vecteurs $(1, t, 1)$ et $(2, 1, 1)$ ne sont pas colinéaires, puisque leurs dernières coordonnées sont égales et les premières différentes : $\dim P_{t} = 2$. Par la proposition 4, $D_{t} \oplus P_{t} = \mathbb{R}^{3}$ si et seulement si les trois vecteurs sont libres. L'équation $\lambda(t, t, 1) + \mu(1, t, 1) + \nu(2, 1, 1) = 0$ conduit, par la méthode du pivot, à la condition $(t - 1)^{2}\lambda = 0$. 
    $$\boxed{D_{t} \oplus P_{t} = \mathbb{R}^{3} \iff t \neq 1}$$
     Pour $t = 1$, on a $(1, 1, 1) \in P_{1}$, comme vecteur de la famille génératrice.
- id: "ma-15-19"
  feuille: "f-ma-15"
  numero: 19
  partie: "Sous-espaces et dimension"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [sous-espaces et dimension, familles libres, bases, supplémentaires, hyperplans]
  noeuds: [v-dimension, v-echange, v-bases-existence, v-somme-directe, v-dual]
  notions: [dimension, base-vectorielle, theoreme-base-incomplete, supplementaire, forme-lineaire]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $n \in \mathbb{N}^{*}$, $\mathcal{P} = \{P \in \mathbb{K}_{2n}[X] \mid P(-X) = P(X)\}$ et $\mathcal{I} = \{P \in \mathbb{K}_{2n}[X] \mid P(-X) = -P(X)\}$.

    **1.** Montrer que $\mathcal{P}$ et $\mathcal{I}$ sont des sous-espaces de $\mathbb{K}_{2n}[X]$, en somme directe.

    **2.** En exhibant des familles libres explicites, montrer que $\dim\mathcal{P} \geqslant n + 1$ et $\dim\mathcal{I} \geqslant n$.

    **3.** En faisant le moins de calculs possible, montrer que ces inégalités sont des égalités, et en déduire une base de chacun des deux sous-espaces et le fait que $\mathbb{K}_{2n}[X] = \mathcal{P} \oplus \mathcal{I}$.
  corrige: |
    **1.** Ce sont les noyaux de $P \mapsto P(-X) - P(X)$ et de $P \mapsto P(-X) + P(X)$. Si $P$ est dans les deux, $P = -P$, donc $P = 0$.

    **2.** Les familles $(1, X^{2}, \dots, X^{2n})$ et $(X, X^{3}, \dots, X^{2n - 1})$ sont libres, à degrés distincts, et formées de $n + 1$ et $n$ vecteurs de $\mathcal{P}$ et de $\mathcal{I}$.

    **3.** La somme étant directe, $\dim\mathcal{P} + \dim\mathcal{I} = \dim(\mathcal{P} \oplus \mathcal{I}) \leqslant \dim\mathbb{K}_{2n}[X] = 2n + 1$. Avec la question 2, toutes les inégalités sont des égalités : $\dim\mathcal{P} = n + 1$, $\dim\mathcal{I} = n$, les familles de la question 2 sont des bases (théorème 4), et $\mathcal{P} \oplus \mathcal{I}$, de dimension $2n + 1$, est égal à $\mathbb{K}_{2n}[X]$ (théorème 5). 
    $$\boxed{\mathbb{K}_{2n}[X] = \mathcal{P} \oplus \mathcal{I}, \quad \dim\mathcal{P} = n + 1, \quad \dim\mathcal{I} = n}$$
- id: "ma-15-20"
  feuille: "f-ma-15"
  numero: 20
  partie: "Sous-espaces et dimension"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [sous-espaces et dimension, bases, supplémentaires]
  noeuds: [v-dimension, v-bases-existence, v-somme-directe]
  notions: [dimension, base-vectorielle, theoreme-base-incomplete, supplementaire]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **1.** Soit $E$ un sous-espace de $\mathbb{K}^{n}$. Montrer qu'il existe une sous-famille $(e_{i_{1}}, \dots, e_{i_{r}})$ de la base canonique telle que $E$ et $\mathrm{Vect}(e_{i_{1}}, \dots, e_{i_{r}})$ soient supplémentaires.

    **2.** Déterminer un supplémentaire de $\{(x, y, z, t) \in \mathbb{K}^{4} \mid x - y - z + t = 0 \text{ et } y - 2z + t = 0\}$.
  corrige: |
    **1.** On complète une base de $E$ en une base de $\mathbb{K}^{n}$ à l'aide de vecteurs de la base canonique (théorème 2 (iii)) ; les vecteurs ajoutés engendrent un supplémentaire de $E$ (démonstration du théorème 6).

    **2.** La seconde équation donne $y = 2z - t$, la première $x = y + z - t = 3z - 2t$ ; le sous-espace a donc pour base la famille $\big((3, 2, 1, 0), (-2, -1, 0, 1)\big)$. Ajoutons $e_{1}$ et $e_{2}$ : une relation 
    $$a(3, 2, 1, 0) + b(-2, -1, 0, 1) + ce_{1} + de_{2} = 0$$
     donne $a = b = 0$ par les deux dernières coordonnées, puis $c = d = 0$. 
    $$\boxed{\text{un supplémentaire : } \mathrm{Vect}(e_{1}, e_{2})}$$
- id: "ma-15-21"
  feuille: "f-ma-15"
  numero: 21
  partie: "Sous-espaces et dimension"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [sous-espaces et dimension, dimension, formule de Grassmann]
  noeuds: [v-dimension]
  notions: [dimension]
  page_enonce: 4
  page_corrige: 6
  enonce: |
    Soit $E$ un espace de dimension finie.

    **1.** Montrer que si $F$ et $G$ sont deux sous-espaces de $E$ tels que $\dim F + \dim G > \dim E$, alors $F \cap G \neq \{0\}$.

    **2.** Soit $F$, $G$, $H$ trois sous-espaces de $E$. Donner une condition sur $\dim F + \dim G + \dim H$ garantissant que $F \cap G \cap H \neq \{0\}$.
  corrige: |
    **1.** Par la formule de Grassmann, 
    $$\dim(F \cap G) = \dim F + \dim G - \dim(F + G) \geqslant \dim F + \dim G - \dim E > 0.$$

    **2.** En appliquant deux fois la même inégalité, avec $n = \dim E$, 
    $$\dim(F \cap G \cap H) \geqslant \dim(F \cap G) + \dim H - n \geqslant \dim F + \dim G + \dim H - 2n.$$

    $$\boxed{\dim F + \dim G + \dim H > 2\dim E \implies F \cap G \cap H \neq \{0\}}$$
- id: "ma-15-22"
  feuille: "f-ma-15"
  numero: 22
  partie: "Sous-espaces et dimension"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [sous-espaces et dimension, dimension, supplémentaires]
  noeuds: [v-dimension, v-somme-directe]
  notions: [dimension, supplementaire]
  page_enonce: 4
  page_corrige: 6
  enonce: |
    Soit $E$ un espace de dimension finie.

    **1.** Montrer, à l'aide de la dimension, que deux supplémentaires d'un même sous-espace sont isomorphes.

    **2.** Soit $F$ et $G$ deux sous-espaces de $E$ en somme directe. Montrer qu'il existe un sous-espace $\widehat{F}$ contenant $F$ tel que $\widehat{F} \oplus G = E$.
  corrige: |
    **1.** Deux supplémentaires de $F$ ont la même dimension, $\dim E - \dim F$ (théorème 6), donc sont isomorphes (théorème 11).

    **2.** Soit $T$ un supplémentaire de $F \oplus G$ dans $E$, et $\widehat{F} = F + T$. Alors $\widehat{F} + G = (F + G) + T = E$, et la proposition 3 donne $\dim\widehat{F} + \dim G = \dim F + \dim T + \dim G = \dim E$, la somme $F + G + T$ étant directe. Par la proposition 4, $\widehat{F} \oplus G = E$.
- id: "ma-15-23"
  feuille: "f-ma-15"
  numero: 23
  partie: "Sous-espaces et dimension"
  etoiles: 3
  types: [Calcul]
  mots_cles: [sous-espaces et dimension, dimension, formule de Grassmann]
  noeuds: [v-dimension]
  notions: [dimension]
  page_enonce: 4
  page_corrige: 6
  enonce: |
    Soit $E$ un espace de dimension $n$ et $p$, $q \in [\![0\,;n]\!]$. Quelles sont les dimensions possibles de $F \cap G$, lorsque $F$ et $G$ sont des sous-espaces de $E$ de dimensions respectives $p$ et $q$ ?
  corrige: |
    $\triangleright$ *Conditions nécessaires.* On a $\dim(F \cap G) \leqslant \min(p, q)$, et la formule de Grassmann donne 
    $$\dim(F \cap G) = p + q - \dim(F + G) \geqslant p + q - n.$$

    $\triangleright$ *Réalisation.* Soit $d$ un entier tel que $\max(0, p + q - n) \leqslant d \leqslant \min(p, q)$, et $(e_{1}, \dots, e_{n})$ une base de $E$. On pose $F = \mathrm{Vect}(e_{1}, \dots, e_{p})$ et $G = \mathrm{Vect}(e_{p - d + 1}, \dots, e_{p - d + q})$, ce qui a un sens car $p - d + q \leqslant n$. Leur intersection est engendrée par les vecteurs communs, $e_{p - d + 1}, \dots, e_{p}$, au nombre de $d$. 
    $$\boxed{\dim(F \cap G) \in [\![\max(0, p + q - n)\,;\min(p, q)]\!], \text{ et toutes ces valeurs sont atteintes.}}$$
- id: "ma-15-24"
  feuille: "f-ma-15"
  numero: 24
  partie: "Sous-espaces et dimension"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [sous-espaces et dimension, familles libres, suites récurrentes linéaires]
  noeuds: [v-dimension, v-echange, v-espace]
  notions: [dimension]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    *Lemme d'échange de Steinitz.* Soit $(f_{1}, \dots, f_{m})$ une famille génératrice de $E$ et $(e_{1}, \dots, e_{n})$ une famille libre de $E$. Pour $r \in [\![1\,;n]\!]$, on note $\mathcal{P}(r)$ l'assertion : « il existe des indices $i_{1}, \dots, i_{r}$ distincts tels que la famille obtenue à partir de $(f_{1}, \dots, f_{m})$ en remplaçant chaque $f_{i_{k}}$ par $e_{k}$ soit génératrice ».

    **1.** Montrer par récurrence que $\mathcal{P}(r)$ est vraie pour tout $r \in [\![1\,;n]\!]$.

    **2.** En déduire une nouvelle démonstration du lemme fondamental du cours, et expliquer le nom du résultat.
  corrige: |
    **1.** *Initialisation.* Comme $e_{1} \neq 0$, il s'écrit $e_{1} = \sum a_{i}f_{i}$ avec un coefficient $a_{i_{1}} \neq 0$. Alors $f_{i_{1}}$ est combinaison de $e_{1}$ et des autres $f_{i}$, et la famille obtenue en remplaçant $f_{i_{1}}$ par $e_{1}$ engendre un sous-espace contenant tous les $f_{i}$ : elle est génératrice.

    *Hérédité.* Supposons $\mathcal{P}(r)$, $r < n$, et notons $\mathcal{F}_{r}$ la famille génératrice obtenue. On écrit $e_{r + 1}$ comme combinaison des vecteurs de $\mathcal{F}_{r}$. Si les coefficients des $f_{i}$ restants étaient tous nuls, $e_{r + 1}$ serait combinaison de $e_{1}, \dots, e_{r}$, ce que la liberté interdit. Il existe donc un $f_{i_{r + 1}}$ restant de coefficient non nul, et le même raisonnement montre que l'on peut le remplacer par $e_{r + 1}$.

    **2.** La propriété $\mathcal{P}(n)$ exige $n$ indices distincts parmi $m$ : donc $n \leqslant m$, ce qui est le théorème 1. On « échange » un à un les vecteurs de la famille génératrice contre ceux de la famille libre, sans perdre le caractère générateur : c'est la démonstration de Steinitz (1913).
- id: "ma-15-25"
  feuille: "f-ma-15"
  numero: 25
  partie: "Sous-espaces et dimension"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [sous-espaces et dimension, dimension, supplémentaires]
  noeuds: [v-dimension, v-somme-directe]
  notions: [dimension, supplementaire]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Soit $E$ un espace de dimension finie, et $F$, $G$ deux sous-espaces de $E$. Montrer que $F$ et $G$ admettent un supplémentaire commun si et seulement si $\dim F = \dim G$.
  corrige: |
    Si $S$ est un supplémentaire commun, $\dim F = \dim E - \dim S = \dim G$. Réciproquement, on raisonne par récurrence descendante sur $p = \dim F = \dim G$. Si $p = \dim E$, $F = G = E$ et $\{0\}$ convient. Sinon, $F$ et $G$ sont des sous-espaces stricts, et $F \cup G \neq E$ : sinon $F \cup G$ serait un sous-espace, donc égal à $F$ ou à $G$ (proposition 5 du chapitre 14), et l'un des deux serait $E$. Soit $x \notin F \cup G$. Les sous-espaces $F' = F \oplus \mathbb{K} x$ et $G' = G \oplus \mathbb{K} x$ ont la même dimension $p + 1$ ; par hypothèse de récurrence, ils ont un supplémentaire commun $S'$, et $S = S' \oplus \mathbb{K} x$ est un supplémentaire commun de $F$ et de $G$, puisque $F \oplus \mathbb{K} x \oplus S' = E$. 
    $$\boxed{F \text{ et } G \text{ ont un supplémentaire commun} \iff \dim F = \dim G}$$
- id: "ma-15-26"
  feuille: "f-ma-15"
  numero: 26
  partie: "Applications linéaires en dimension finie"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [théorème du rang, dimension, bases, supplémentaires, isomorphismes]
  noeuds: [v-rang, v-dimension, v-bases-existence, v-somme-directe]
  notions: [rang, dimension, base-vectorielle, theoreme-base-incomplete, supplementaire, isomorphisme]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Soit $f : (x, y, z, t) \mapsto (x - z, y - t)$, de $\mathbb{K}^{4}$ dans $\mathbb{K}^{2}$.

    **1.** Montrer que $f$ est linéaire, et donner une base et la dimension de $\mathrm{Ker}\, f$.

    **2.** En déduire que $f$ est surjective.

    **3.** Soit $G = \{(x, y, z, t) \in \mathbb{K}^{4} \mid y = z = 0\}$. Montrer que $G$ est un sous-espace de $\mathbb{K}^{4}$, dont on précisera la dimension, et que $\mathrm{Ker}\, f$ et $G$ sont supplémentaires.
  corrige: |
    **1.** Les deux coordonnées de $f$ sont des combinaisons linéaires de $x$, $y$, $z$, $t$ : $f$ est linéaire. On a $f(x, y, z, t) = 0$ si et seulement si $x = z$ et $y = t$, soit $(x, y, x, y) = x(1, 0, 1, 0) + y(0, 1, 0, 1)$. 
    $$\boxed{\mathrm{Ker}\, f = \mathrm{Vect}\big((1, 0, 1, 0), (0, 1, 0, 1)\big), \qquad \dim\mathrm{Ker}\, f = 2}$$

    **2.** Par le théorème du rang, $\mathrm{rg} f = 4 - 2 = 2 = \dim\mathbb{K}^{2}$, donc $\operatorname{Im} f = \mathbb{K}^{2}$ (théorème 5) : $f$ est surjective, sans qu'on ait eu à résoudre l'équation $f(x) = b$.

    **3.** L'ensemble $G$ est défini par deux équations linéaires, donc est un sous-espace ; $G = \mathrm{Vect}(e_{1}, e_{4})$ est de dimension $2$. Si $(x, 0, 0, t) \in \mathrm{Ker}\, f$, alors $x = z = 0$ et $t = y = 0$ : $G \cap \mathrm{Ker}\, f = \{0\}$, et les dimensions ont pour somme $4$. 
    $$\boxed{\mathbb{K}^{4} = \mathrm{Ker}\, f \oplus G}$$
- id: "ma-15-27"
  feuille: "f-ma-15"
  numero: 27
  partie: "Applications linéaires en dimension finie"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [théorème du rang, espaces de polynômes]
  noeuds: [v-rang, pol-anneau]
  notions: [rang]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    **1.** Soit $n \in \mathbb{N}$. Montrer qu'il existe un unique polynôme $P_{n} \in \mathbb{K}[X]$ tel que $P_{n} - P_{n}' = X^{n}$.

    **2.** Soit $Q \in \mathbb{R}_{n}[X]$. Montrer qu'il existe un unique $P \in \mathbb{R}_{n}[X]$ tel que $P(X + 1) + P(X) = Q$, sans chercher à le calculer.
  corrige: |
    **1.** L'application $\varphi : P \mapsto P - P'$ est un endomorphisme de $\mathbb{K}_{n}[X]$. Si $\varphi(P) = 0$ avec $P \neq 0$, les degrés de $P$ et de $P'$ diffèrent, donc $\deg(P - P') = \deg P$, ce qui est absurde : $\varphi$ est injectif, donc bijectif (théorème 10). Il existe un unique $P_{n} \in \mathbb{K}_{n}[X]$ tel que $P_{n} - P_{n}' = X^{n}$. Un polynôme $P$ de degré $d > n$ ne convient pas, puisque $\deg(P - P') = d$ : l'unicité vaut dans $\mathbb{K}[X]$. On vérifie enfin que 
    $$\boxed{P_{n} = \sum_{j = 0}^{n} \frac{n!}{(n - j)!}X^{n - j} = X^{n} + nX^{n - 1} + n(n - 1)X^{n - 2} + \cdots + n!}$$
     car $P_{n}'$ est la même somme privée de son premier terme.

    **2.** L'application $\psi : P \mapsto P(X + 1) + P(X)$ est un endomorphisme de $\mathbb{R}_{n}[X]$. Si $P \neq 0$ a pour coefficient dominant $a$ et pour degré $d$, alors $\psi(P)$ a pour terme de degré $d$ le monôme $2aX^{d} \neq 0$ : $\psi$ est injectif, donc bijectif, puisque $\mathbb{R}_{n}[X]$ est de dimension finie. 
    $$\boxed{\forall Q \in \mathbb{R}_{n}[X], \ \exists!\, P \in \mathbb{R}_{n}[X], \ P(X + 1) + P(X) = Q}$$
     *À retenir.* En dimension finie, pour résoudre une équation linéaire $\varphi(P) = Q$ de façon unique, il suffit de vérifier l'injectivité, c'est-à-dire l'unicité pour $Q = 0$.
- id: "ma-15-28"
  feuille: "f-ma-15"
  numero: 28
  partie: "Applications linéaires en dimension finie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [théorème du rang, dimension, supplémentaires]
  noeuds: [v-rang, v-dimension, v-somme-directe]
  notions: [rang, dimension, supplementaire]
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Soit $E$ un espace de dimension finie et $f \in \mathcal{L}(E)$ tel que $f^{3} = \mathrm{id}_{E}$.

    **1.** Montrer que $\operatorname{Im}(f - \mathrm{id}_{E}) \subset \mathrm{Ker}\,(f^{2} + f + \mathrm{id}_{E})$.

    **2.** Montrer que $\operatorname{Im}(f - \mathrm{id}_{E})$ et $\mathrm{Ker}\,(f - \mathrm{id}_{E})$ sont supplémentaires.
  corrige: |
    **1.** Les polynômes en $f$ commutent, et $(f^{2} + f + \mathrm{id}) \circ (f - \mathrm{id}) = f^{3} - \mathrm{id} = 0$ : tout vecteur de $\operatorname{Im}(f - \mathrm{id})$ est annulé par $f^{2} + f + \mathrm{id}$.

    **2.** Soit $x \in \operatorname{Im}(f - \mathrm{id}) \cap \mathrm{Ker}\,(f - \mathrm{id})$. Alors $f(x) = x$, donc $f^{2}(x) = x$, et la question 1 donne $x + x + x = 0$, soit $x = 0$. Le théorème du rang appliqué à $f - \mathrm{id}$ donne 
    $$\dim\operatorname{Im}(f - \mathrm{id}) + \dim\mathrm{Ker}\,(f - \mathrm{id}) = \dim E,$$
     et la proposition 4 conclut. 
    $$\boxed{E = \operatorname{Im}(f - \mathrm{id}_{E}) \oplus \mathrm{Ker}\,(f - \mathrm{id}_{E})}$$
- id: "ma-15-29"
  feuille: "f-ma-15"
  numero: 29
  partie: "Applications linéaires en dimension finie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [théorème du rang, dimension, supplémentaires]
  noeuds: [v-rang, v-dimension, v-somme-directe]
  notions: [rang, dimension, supplementaire]
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Soit $u \in \mathcal{L}(E)$.

    **1.** Rappeler pourquoi $E = \mathrm{Ker}\, u \oplus \operatorname{Im} u$ si et seulement si $\operatorname{Im} u^{2} = \operatorname{Im} u$ et $\mathrm{Ker}\, u^{2} = \mathrm{Ker}\, u$ (exercice 49 du chapitre 14).

    **2.** On suppose $E$ de dimension finie. Montrer que 
    $$E = \mathrm{Ker}\, u \oplus \operatorname{Im} u \iff \operatorname{Im} u^{2} = \operatorname{Im} u \iff \mathrm{Ker}\, u^{2} = \mathrm{Ker}\, u.$$

    **3.** L'équivalence $\operatorname{Im} u^{2} = \operatorname{Im} u \iff \mathrm{Ker}\, u^{2} = \mathrm{Ker}\, u$ est-elle valable en dimension infinie ?
  corrige: |
    **1.** Si $E = \mathrm{Ker}\, u \oplus \operatorname{Im} u$, la restriction de $u$ à $\operatorname{Im} u$ est injective, d'où $\mathrm{Ker}\, u^{2} = \mathrm{Ker}\, u$ ; et tout $x = k + u(y)$ a pour image $u(x) = u^{2}(y)$, d'où $\operatorname{Im} u^{2} = \operatorname{Im} u$. Réciproquement, si $x \in \mathrm{Ker}\, u \cap \operatorname{Im} u$, $x = u(y)$ avec $u^{2}(y) = 0$, donc $y \in \mathrm{Ker}\, u$ et $x = 0$ ; et pour $x \in E$, on écrit $u(x) = u^{2}(y)$, puis $x = (x - u(y)) + u(y)$ avec $x - u(y) \in \mathrm{Ker}\, u$.

    **2.** On a toujours $\operatorname{Im} u^{2} \subset \operatorname{Im} u$ et $\mathrm{Ker}\, u \subset \mathrm{Ker}\, u^{2}$. Par le théorème du rang, $\mathrm{rg} u^{2} = \mathrm{rg} u$ équivaut à $\dim\mathrm{Ker}\, u^{2} = \dim\mathrm{Ker}\, u$ ; avec les inclusions et le théorème 5, 
    $$\begin{aligned} \operatorname{Im} u^{2} = \operatorname{Im} u &\iff \mathrm{rg} u^{2} = \mathrm{rg} u \\ &\iff \dim\mathrm{Ker}\, u^{2} = \dim\mathrm{Ker}\, u \iff \mathrm{Ker}\, u^{2} = \mathrm{Ker}\, u. \end{aligned}$$
     Chacune des deux égalités entraîne donc l'autre, et la question 1 donne leur équivalence avec la décomposition $E = \mathrm{Ker}\, u \oplus \operatorname{Im} u$.

    **3.** Non. La dérivation $D$ de $\mathbb{K}[X]$ est surjective, donc $\operatorname{Im} D^{2} = \operatorname{Im} D = \mathbb{K}[X]$ ; mais son noyau est $\mathrm{Ker}\, D = \mathbb{K}_{0}[X]$, alors que $\mathrm{Ker}\, D^{2} = \mathbb{K}_{1}[X]$.

    *Piège.* L'argument de la question 2 repose entièrement sur le théorème du rang ; en dimension infinie, il n'y a plus de lien entre la taille du noyau et celle de l'image.
- id: "ma-15-30"
  feuille: "f-ma-15"
  numero: 30
  partie: "Applications linéaires en dimension finie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [théorème du rang, dimension]
  noeuds: [v-rang, v-dimension]
  notions: [rang, dimension]
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Soit $E$ un espace de dimension finie et $u$, $v \in \mathcal{L}(E)$ tels que $\mathrm{Ker}\, u + \mathrm{Ker}\, v = \operatorname{Im} u + \operatorname{Im} v = E$.

    **1.** Montrer que les deux sommes sont directes.

    **2.** Montrer par un contre-exemple que le résultat cesse d'être vrai si $E$ n'est plus de dimension finie.
  corrige: |
    **1.** Notons $n = \dim E$. Par la formule de Grassmann, les hypothèses donnent 
    $$\dim\mathrm{Ker}\, u + \dim\mathrm{Ker}\, v \geqslant n \qquad\text{et}\qquad \dim\operatorname{Im} u + \dim\operatorname{Im} v \geqslant n.$$
     Or le théorème du rang, appliqué à $u$ et à $v$, montre que la somme de ces quatre dimensions vaut exactement $2n$. Les deux inégalités sont donc des égalités, et la formule de Grassmann donne $\dim(\mathrm{Ker}\, u \cap \mathrm{Ker}\, v) = 0$ et $\dim(\operatorname{Im} u \cap \operatorname{Im} v) = 0$. 
    $$\boxed{E = \mathrm{Ker}\, u \oplus \mathrm{Ker}\, v = \operatorname{Im} u \oplus \operatorname{Im} v}$$

    **2.** Dans $E = \mathbb{K}[X]$, on prend $u = D$, la dérivation, et $v : P \mapsto P(0)$, à valeurs dans les constantes. On a $\mathrm{Ker}\, u = \mathbb{K}_{0}[X]$ et $\mathrm{Ker}\, v = X\mathbb{K}[X]$, de somme $E$ ; $\operatorname{Im} u = \mathbb{K}[X]$, donc $\operatorname{Im} u + \operatorname{Im} v = E$. Mais $\operatorname{Im} u \cap \operatorname{Im} v = \mathbb{K}_{0}[X] \neq \{0\}$ : la seconde somme n'est pas directe.
- id: "ma-15-31"
  feuille: "f-ma-15"
  numero: 31
  partie: "Applications linéaires en dimension finie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [théorème du rang, dimension, formule de Grassmann]
  noeuds: [v-rang, v-dimension]
  notions: [rang, dimension]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Soit $E$ et $F$ deux espaces de dimension finie et $u \in \mathcal{L}(E, F)$.

    **1.** Soit $V$ un sous-espace de $E$. Montrer que $\dim u(V) = \dim V - \dim(V \cap \mathrm{Ker}\, u)$.

    **2.** Soit $W$ un sous-espace de $F$. Montrer que $\dim u^{-1}(W) = \dim(W \cap \operatorname{Im} u) + \dim\mathrm{Ker}\, u$.
  corrige: |
    **1.** On applique le théorème du rang à la restriction $u_{|V} : V \to F$, dont le noyau est $V \cap \mathrm{Ker}\, u$ et l'image $u(V)$. 
    $$\boxed{\dim u(V) = \dim V - \dim(V \cap \mathrm{Ker}\, u)}$$

    **2.** Le sous-espace $V = u^{-1}(W)$ contient $\mathrm{Ker}\, u$, puisque $0 \in W$. La restriction $u_{|V}$ a pour noyau $\mathrm{Ker}\, u$ et pour image $W \cap \operatorname{Im} u$ : un vecteur de $W$ est atteint si et seulement s'il est dans $\operatorname{Im} u$, et alors ses antécédents sont dans $V$. Le théorème du rang donne 
    $$\boxed{\dim u^{-1}(W) = \dim(W \cap \operatorname{Im} u) + \dim\mathrm{Ker}\, u}$$
- id: "ma-15-32"
  feuille: "f-ma-15"
  numero: 32
  partie: "Applications linéaires en dimension finie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [théorème du rang, dimension]
  noeuds: [v-rang, v-dimension]
  notions: [rang, dimension]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Soit $E$ un espace de dimension finie.

    **1.** Soit $F$ un sous-espace de $E$. Montrer qu'il existe un espace $E'$ et $\varphi \in \mathcal{L}(E', E)$ tels que $F = \operatorname{Im}\varphi$.

    **2.** Soit $G$ un sous-espace de $E$. Montrer qu'il existe un espace $E''$ et $\psi \in \mathcal{L}(E, E'')$ tels que $G = \mathrm{Ker}\,\psi$.

    **3.** Soit $F$ et $G$ deux sous-espaces de $E$. À quelle condition existe-t-il $u \in \mathcal{L}(E)$ tel que $F = \operatorname{Im} u$ et $G = \mathrm{Ker}\, u$ ?
  corrige: |
    **1.** On prend $E' = F$ et pour $\varphi$ l'injection canonique $x \mapsto x$ de $F$ dans $E$.

    **2.** Soit $S$ un supplémentaire de $G$ (théorème 6). On prend $E'' = E$ et pour $\psi$ le projecteur sur $S$ parallèlement à $G$, dont le noyau est $G$.

    **3.** Le théorème du rang impose $\dim F + \dim G = \dim E$. Réciproquement, si cette condition est remplie, un supplémentaire $S$ de $G$ a la même dimension que $F$ ; soit $\theta : S \to F$ un isomorphisme (théorème 11) et $p$ le projecteur sur $S$ parallèlement à $G$. Alors $u = \theta \circ p$ a pour noyau $\mathrm{Ker}\, p = G$, puisque $\theta$ est injectif, et pour image $\theta(S) = F$. 
    $$\boxed{\exists\, u \in \mathcal{L}(E), \ \operatorname{Im} u = F \text{ et } \mathrm{Ker}\, u = G \iff \dim F + \dim G = \dim E}$$
- id: "ma-15-33"
  feuille: "f-ma-15"
  numero: 33
  partie: "Applications linéaires en dimension finie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [théorème du rang, dimension, projecteurs et symétries]
  noeuds: [v-rang, v-dimension, v-somme-directe]
  notions: [rang, dimension]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Soit $E$ un espace de dimension finie et $u \in \mathcal{L}(E)$ non nul. Montrer que les assertions suivantes sont équivalentes :

    **1.** $u^{2} = 0$ ;

    **2.** il existe un projecteur $p$ de $E$ tel que $p \circ u = u$ et $u \circ p = 0$ ;

    **3.** il existe un projecteur $p$ de $E$ tel que $p \circ u - u \circ p = u$.
  corrige: |
    $\triangleright$ *(i) $\Rightarrow$ (ii).* Si $u^{2} = 0$, alors $\operatorname{Im} u \subset \mathrm{Ker}\, u$. Soit $p$ un projecteur d'image $\operatorname{Im} u$, par exemple le projecteur sur $\operatorname{Im} u$ parallèlement à un supplémentaire. Comme $p$ fixe les vecteurs de son image, $p \circ u = u$ ; et $u \circ p = 0$, puisque $\operatorname{Im} p = \operatorname{Im} u \subset \mathrm{Ker}\, u$.

    $\triangleright$ *(ii) $\Rightarrow$ (iii).* On a $p \circ u - u \circ p = u - 0 = u$.

    $\triangleright$ *(iii) $\Rightarrow$ (i).* Composons $pu - up = u$ à gauche par $p$ : comme $p^{2} = p$, on obtient $pu - pup = pu$, donc $pup = 0$. Composons-la à droite par $p$ : $pup - up = up$, donc $up = 0$, puis $pu = u$. Enfin 
    $$u^{2} = u \circ (p \circ u) = (u \circ p) \circ u = 0.$$
- id: "ma-15-34"
  feuille: "f-ma-15"
  numero: 34
  partie: "Applications linéaires en dimension finie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [théorème du rang, dimension, formule de Grassmann]
  noeuds: [v-rang, v-dimension]
  notions: [rang, dimension]
  page_enonce: 6
  page_corrige: 9
  enonce: |
    Soit $E$, $F$, $G$ des espaces de dimension finie.

    **1.** Soit $a$, $b \in \mathcal{L}(E)$. Montrer que $\dim\mathrm{Ker}\,(a \circ b) \leqslant \dim\mathrm{Ker}\, a + \dim\mathrm{Ker}\, b$.

    **2.** Soit $f \in \mathcal{L}(E, F)$ et $g \in \mathcal{L}(F, G)$. Montrer que 
    $$\mathrm{rg}(g \circ f) = \mathrm{rg}(f) - \dim(\operatorname{Im} f \cap \mathrm{Ker}\, g) \qquad\text{et}\qquad \mathrm{rg}(f) + \mathrm{rg}(g) - \dim F \leqslant \mathrm{rg}(g \circ f).$$

    **3.** Soit $a \in \mathcal{L}(E, F)$ et $b \in \mathcal{L}(E, G)$ tels que $\mathrm{rg}(a) + \mathrm{rg}(b) < \dim E$. Montrer qu'il existe $x \in E$ non nul tel que $a(x) = b(x) = 0$.
  corrige: |
    **1.** On a $\mathrm{Ker}\,(a \circ b) = b^{-1}(\mathrm{Ker}\, a)$. L'exercice 31, question 2, donne 
    $$\dim\mathrm{Ker}\,(a \circ b) = \dim(\mathrm{Ker}\, a \cap \operatorname{Im} b) + \dim\mathrm{Ker}\, b \leqslant \dim\mathrm{Ker}\, a + \dim\mathrm{Ker}\, b.$$

    **2.** On a $\operatorname{Im}(g \circ f) = g(\operatorname{Im} f)$, et l'exercice 31, question 1, appliqué à $g$ et à $V = \operatorname{Im} f$, donne la première égalité. Comme $\dim(\operatorname{Im} f \cap \mathrm{Ker}\, g) \leqslant \dim\mathrm{Ker}\, g = \dim F - \mathrm{rg} g$, on en déduit 
    $$\boxed{\mathrm{rg}(g \circ f) = \mathrm{rg} f - \dim(\operatorname{Im} f \cap \mathrm{Ker}\, g) \geqslant \mathrm{rg} f + \mathrm{rg} g - \dim F}$$
     C'est l'*inégalité de Sylvester* ; elle complète la majoration $\mathrm{rg}(g \circ f) \leqslant \min(\mathrm{rg} f, \mathrm{rg} g)$ de la proposition 7.

    **3.** Par le théorème du rang, $\dim\mathrm{Ker}\, a + \dim\mathrm{Ker}\, b = 2\dim E - \mathrm{rg} a - \mathrm{rg} b > \dim E$, et l'exercice 21 donne $\mathrm{Ker}\, a \cap \mathrm{Ker}\, b \neq \{0\}$.
- id: "ma-15-35"
  feuille: "f-ma-15"
  numero: 35
  partie: "Applications linéaires en dimension finie"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [théorème du rang, dimension, supplémentaires]
  noeuds: [v-rang, v-dimension, v-somme-directe]
  notions: [rang, dimension, supplementaire]
  page_enonce: 6
  page_corrige: 10
  enonce: |
    Soit $E$ et $F$ deux espaces de dimension finie, et $G$ un sous-espace de $E$. Montrer que l'ensemble 
    $$A = \{f \in \mathcal{L}(E, F) \mid G \subset \mathrm{Ker}\, f\}$$
     est un sous-espace de $\mathcal{L}(E, F)$, et calculer sa dimension. On pourra considérer un supplémentaire $H$ de $G$ et l'exercice 51 du chapitre 14.
  corrige: |
    L'ensemble $A$ contient l'application nulle, et si $f$, $g$ s'annulent sur $G$, il en est de même de $\lambda f + g$ : $A$ est un sous-espace. Soit $H$ un supplémentaire de $G$. L'application $f \mapsto f_{|H}$ est un isomorphisme de $A$ sur $\mathcal{L}(H, F)$ (exercice 51 du chapitre 14) : une application linéaire nulle sur $G$ est déterminée par sa restriction à $H$, qui est quelconque. La proposition 8 donne 
    $$\boxed{\dim A = (\dim E - \dim G)\dim F}$$
- id: "ma-15-36"
  feuille: "f-ma-15"
  numero: 36
  partie: "Applications linéaires en dimension finie"
  etoiles: 3
  types: [Calcul]
  mots_cles: [théorème du rang, dimension]
  noeuds: [v-rang, v-dimension]
  notions: [rang, dimension]
  page_enonce: 6
  page_corrige: 10
  enonce: |
    Soit $E$ un espace de dimension $n$ et $r$, $s \in [\![0\,;n]\!]$. Déterminer l'ensemble des valeurs de $\mathrm{rg}(g \circ f)$ lorsque $(f, g)$ parcourt les couples d'endomorphismes de $E$ tels que $\mathrm{rg} f = r$ et $\mathrm{rg} g = s$.
  corrige: |
    $\triangleright$ *Conditions nécessaires.* La proposition 7 donne $\mathrm{rg}(g \circ f) \leqslant \min(r, s)$, et l'exercice 34 donne $\mathrm{rg}(g \circ f) \geqslant r + s - n$.

    $\triangleright$ *Réalisation.* Soit $k$ un entier tel que $\max(0, r + s - n) \leqslant k \leqslant \min(r, s)$, et $d = r - k$. L'inégalité $k \leqslant \min(r, s)$ s'écrit $d \geqslant \max(0, r - s)$, et l'inégalité $k \geqslant \max(0, r + s - n)$ s'écrit $d \leqslant \min(r, n - s)$ : 
    $$\max\big(0, r + (n - s) - n\big) \leqslant d \leqslant \min(r, n - s).$$
     L'exercice 23 fournit deux sous-espaces $F_{0}$ et $G_{0}$, de dimensions $r$ et $n - s$, tels que $\dim(F_{0} \cap G_{0}) = d$. Par l'exercice 32, il existe $f$ d'image $F_{0}$, donc de rang $r$, et $g$ de noyau $G_{0}$, donc de rang $s$. L'exercice 34 donne alors $\mathrm{rg}(g \circ f) = r - d = k$. 
    $$\boxed{\big\{\mathrm{rg}(g \circ f)\big\} = [\![\max(0, r + s - n)\,;\min(r, s)]\!]}$$
- id: "ma-15-37"
  feuille: "f-ma-15"
  numero: 37
  partie: "Applications linéaires en dimension finie"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [théorème du rang, dimension, supplémentaires]
  noeuds: [v-rang, v-dimension, v-somme-directe]
