  enonce: |
    Soit $(u_{n})$ une suite réelle telle que $u_{n + 3} = \frac{u_{n} + u_{n + 1} + u_{n + 2}}{3}$ pour tout $n \in \mathbb{N}$. Montrer que la suite $(u_{n})$ converge, et exprimer sa limite en fonction de $u_{0}$, $u_{1}$, $u_{2}$.
  corrige: |
    *Idée.* On résout la récurrence linéaire d'ordre $3$ par l'exercice 12 ; la limite se lit sur une quantité conservée.

    $\triangleright$ *Forme générale.* Les suites complexes vérifiant la relation forment l'espace $R$ de l'exercice 12, associé à 
    $$Q = X^{3} - \frac{1}{3}X^{2} - \frac{1}{3}X - \frac{1}{3} = \frac{1}{3}(X - 1)(3X^{2} + 2X + 1).$$
     Les racines de $3X^{2} + 2X + 1$ sont $\rho = \frac{-1 + i\sqrt{2}}{3}$ et $\bar\rho$, de module $\frac{\sqrt{3}}{3} = \frac{1}{\sqrt{3}} < 1$, distinctes de $1$. Il existe donc $\alpha$, $\beta$, $\gamma \in \mathbb{C}$ tels que $u_{n} = \alpha + \beta\rho^{n} + \gamma\bar\rho^{n}$ pour tout $n$. Comme $|\rho^{n}| = 3^{-n/2} \to 0$, la suite $(u_{n})$ converge vers $\alpha$, qui est réel puisque les $u_{n}$ le sont.

    $\triangleright$ *Une quantité conservée.* Posons $I_{n} = u_{n} + 2u_{n + 1} + 3u_{n + 2}$. Alors 
    $$I_{n + 1} = u_{n + 1} + 2u_{n + 2} + (u_{n} + u_{n + 1} + u_{n + 2}) = I_{n}.$$
     La suite $(I_{n})$ est constante, égale à $I_{0}$, et tend vers $(1 + 2 + 3)\alpha = 6\alpha$. 
    $$\boxed{\lim_{n \to +\infty} u_{n} = \frac{u_{0} + 2u_{1} + 3u_{2}}{6}}$$
     Avec $(u_{0}, u_{1}, u_{2}) = (0, 0, 6)$, on trouve $u_{3} = 2$, $u_{4} = \frac{8}{3}$, $u_{5} = \frac{32}{9}$, et les termes se rapprochent de $3$, valeur annoncée par la formule. Les coefficients $1$, $2$, $3$ s'interprètent comme des poids : la limite est une moyenne pondérée des conditions initiales, où le dernier terme compte le plus.

