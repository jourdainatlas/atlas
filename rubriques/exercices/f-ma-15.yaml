  enonce: |
    Soit $E$ un espace de dimension finie et $f \in \mathcal{L}(E)$.

    **1.** On suppose que, pour tout $x \in E$, il existe $p \in \mathbb{N}$ tel que $f^{p}(x) = 0$. Montrer qu'il existe $q \in \mathbb{N}$ tel que $f^{q} = 0$.

    **2.** On suppose que, pour tout $x \in E$, il existe $p \in \mathbb{N}^{*}$ tel que $f^{p}(x) = x$. Montrer qu'il existe $q \in \mathbb{N}^{*}$ tel que $f^{q} = \mathrm{id}_{E}$.
  corrige: |
    Soit $(e_{1}, \dots, e_{m})$ une base de $E$.

    **1.** Pour chaque $i$, il existe $p_{i}$ tel que $f^{p_{i}}(e_{i}) = 0$. Soit $q = \max_{i} p_{i}$ ; alors $f^{q}(e_{i}) = f^{q - p_{i}}\big(f^{p_{i}}(e_{i})\big) = 0$ pour tout $i$, et $f^{q}$, nul sur une base, est nul.

    **2.** Pour chaque $i$, il existe $p_{i} \geqslant 1$ tel que $f^{p_{i}}(e_{i}) = e_{i}$, donc $f^{kp_{i}}(e_{i}) = e_{i}$ pour tout $k \in \mathbb{N}$. Avec $q = p_{1}p_{2}\cdots p_{m}$, multiple de chaque $p_{i}$, on obtient $f^{q}(e_{i}) = e_{i}$ pour tout $i$, donc $f^{q} = \mathrm{id}_{E}$ (théorème 4 du chapitre 14).

    *Piège.* L'entier $p$ dépend de $x$ ; c'est la dimension finie qui permet de se ramener à un nombre fini de vecteurs. Sur $\mathbb{K}[X]$, la dérivation vérifie l'hypothèse 1 sans qu'aucune de ses puissances soit nulle.
- id: "ma-15-42"
  feuille: "f-ma-15"
  numero: 42
  partie: "Applications linéaires en dimension finie"
  etoiles: 3
