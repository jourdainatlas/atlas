  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par une démonstration ou un contre-exemple. L'espace $E$ est de dimension finie $n \geqslant 2$.

    **1.** Toute famille de $n$ vecteurs de $E$ est une base de $E$.

    **2.** Si $F$ et $G$ sont deux sous-espaces de $E$ tels que $\dim F + \dim G = n$, alors $E = F \oplus G$.

    **3.** Tout sous-espace de $E$ admet un supplémentaire.

    **4.** Deux plans vectoriels de $\mathbb{R}^{4}$ se coupent toujours selon une droite au moins.

    **5.** Si $u \in \mathcal{L}(E)$ est injectif, alors $u$ est un automorphisme de $E$.

    **6.** Pour tous $u$, $v \in \mathcal{L}(E)$, $\mathrm{rg}(u + v) \leqslant \mathrm{rg}(u) + \mathrm{rg}(v)$.

    **7.** Si $u \in \mathcal{L}(E, F)$ est surjective, alors $\dim F \leqslant \dim E$.

    **8.** L'intersection de deux hyperplans distincts de $E$ est de dimension $n - 2$.

    **9.** Si $u \circ v = 0$, alors $\mathrm{rg}(u) + \mathrm{rg}(v) \leqslant n$, pour tous $u$, $v \in \mathcal{L}(E)$.

    **10.** Il existe un endomorphisme $u$ de $\mathbb{R}^{3}$ tel que $\mathrm{Ker}\, u = \operatorname{Im} u$.
  corrige: |
    **1.** **Faux.** Les vecteurs doivent de plus être libres : la famille $(x, x, \dots, x)$ n'est pas une base.

    **2.** **Faux.** Dans $\mathbb{R}^{2}$, avec $F = G$ une droite, $\dim F + \dim G = 2$ mais $F \cap G = F \neq \{0\}$. Il faut en plus $F \cap G = \{0\}$ (proposition 4).

    **3.** **Vrai.** C'est le théorème 6, obtenu par le théorème de la base incomplète.

    **4.** **Faux.** Les plans $\mathrm{Vect}(e_{1}, e_{2})$ et $\mathrm{Vect}(e_{3}, e_{4})$ sont supplémentaires dans $\mathbb{R}^{4}$. Deux plans se coupent selon une droite au moins dans $\mathbb{R}^{3}$, car $2 + 2 > 3$ (exercice 21), mais pas dans $\mathbb{R}^{4}$.

    **5.** **Vrai.** En dimension finie, un endomorphisme injectif est bijectif (théorème 10).

    **6.** **Vrai.** On a $\operatorname{Im}(u + v) \subset \operatorname{Im} u + \operatorname{Im} v$, et $\dim(\operatorname{Im} u + \operatorname{Im} v) \leqslant \mathrm{rg} u + \mathrm{rg} v$ (proposition 5).

    **7.** **Vrai.** On a $\dim F = \mathrm{rg} u = \dim E - \dim\mathrm{Ker}\, u \leqslant \dim E$ par le théorème du rang.

    **8.** **Vrai.** C'est l'exercice 44, question 1.

    **9.** **Vrai.** L'égalité $u \circ v = 0$ signifie $\operatorname{Im} v \subset \mathrm{Ker}\, u$, d'où $\mathrm{rg} v \leqslant n - \mathrm{rg} u$.

    **10.** **Faux.** On aurait $3 = \dim\mathrm{Ker}\, u + \mathrm{rg} u = 2\mathrm{rg} u$, qui est pair (exercice 38).

    *Piège.* Les assertions 2 et 4 confondent les conditions sur les dimensions, qui sont nécessaires, avec la condition sur l'intersection, qui reste indispensable.
- id: "ma-15-49"
  feuille: "f-ma-15"
  numero: 49
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [rang, supplémentaires, noyau et image, espaces de polynômes]
  noeuds: [v-rang, v-dimension, v-somme-directe, pol-anneau]
  notions: [rang, supplementaire, noyau]
  page_enonce: 8
  page_corrige: 14
  enonce: |
    Soit $n \geqslant 1$ et $D$ la dérivation de $\mathbb{C}_{n}[X]$.

    **1.** Déterminer le rang, le noyau et l'image de $D$, et ceux de $D^{2}$.

    **2.** On suppose par l'absurde qu'il existe $f \in \mathcal{L}(\mathbb{C}_{n}[X])$ tel que $f \circ f = D$. Déterminer le rang, le noyau et l'image de $f$.

    **3.** Montrer que $\mathrm{Ker}\, f$ et $\operatorname{Im} f$ ne sont pas en somme directe, et aboutir à une contradiction.
  corrige: |
    **1.** Le noyau de $D$ est formé des constantes, et son image est $\mathbb{C}_{n - 1}[X]$, puisque $D\big(\frac{X^{k + 1}}{k + 1}\big) = X^{k}$. De même, $D^{2}$ a pour noyau $\mathbb{C}_{1}[X]$ et pour image $\mathbb{C}_{n - 2}[X]$, réduite à $\{0\}$ si $n = 1$. 
    $$\boxed{\mathrm{Ker}\, D = \mathbb{C}_{0}[X], \ \operatorname{Im} D = \mathbb{C}_{n - 1}[X], \ \mathrm{rg} D = n \qquad \mathrm{Ker}\, D^{2} = \mathbb{C}_{1}[X], \ \mathrm{rg} D^{2} = n - 1}$$

    **2.** Si $f$ était injectif, il serait bijectif (théorème 10), et $D = f^{2}$ le serait aussi, ce qui est faux. Donc $\mathrm{Ker}\, f \neq \{0\}$. Or $\mathrm{Ker}\, f \subset \mathrm{Ker}\, f^{2} = \mathrm{Ker}\, D$, qui est de dimension $1$ : $\mathrm{Ker}\, f = \mathbb{C}_{0}[X]$, et $\mathrm{rg} f = n$. De même, $\operatorname{Im} f \supset \operatorname{Im} f^{2} = \operatorname{Im} D$, et les deux sont de dimension $n$. 
    $$\boxed{\mathrm{Ker}\, f = \mathbb{C}_{0}[X], \qquad \operatorname{Im} f = \mathbb{C}_{n - 1}[X], \qquad \mathrm{rg} f = n}$$

    **3.** Comme $n \geqslant 1$, $\mathrm{Ker}\, f = \mathbb{C}_{0}[X] \subset \mathbb{C}_{n - 1}[X] = \operatorname{Im} f$ : la somme n'est pas directe. Par l'exercice 29, on devrait donc avoir $\mathrm{Ker}\, f^{2} \neq \mathrm{Ker}\, f$. Mais $\mathrm{Ker}\, f^{2} = \mathrm{Ker}\, D = \mathbb{C}_{0}[X] = \mathrm{Ker}\, f$ : c'est une contradiction. 
    $$\boxed{\text{La dérivation de } \mathbb{C}_{n}[X] \text{ n'a pas de racine carrée dans } \mathcal{L}(\mathbb{C}_{n}[X]).}$$
- id: "ma-15-50"
  feuille: "f-ma-15"
  numero: 50
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [espaces de fonctions, fonctions monotones]
  noeuds: [v-dimension, v-libre]
  notions: [dimension]
  page_enonce: 8
  page_corrige: 15
  enonce: |
    **1.** Soit $E$ un sous-espace de $\mathcal{F}([0, 1], \mathbb{R})$ formé de fonctions monotones. Montrer que $\dim E \leqslant 2$.

    **2.** Même question pour un sous-espace de $\mathcal{F}(\mathbb{R}, \mathbb{R})$ formé de fonctions monotones.
  corrige: |
    **1.** L'application $\Phi : f \mapsto \big(f(0), f(1)\big)$ est linéaire de $E$ dans $\mathbb{R}^{2}$. Si $f(0) = f(1) = 0$ et si $f$ est monotone, $f$ est comprise entre $f(0)$ et $f(1)$ sur $[0, 1]$, donc nulle : $\Phi$ est injective. Une famille libre de $E$ a pour image une famille libre de $\mathbb{R}^{2}$, donc a au plus deux éléments. 
    $$\boxed{\dim E \leqslant 2}$$

    **2.** Soit $E$ un sous-espace de $\mathcal{F}(\mathbb{R}, \mathbb{R})$ formé de fonctions monotones, et $f_{1}$, $f_{2}$, $f_{3} \in E$. Pour $N \in \mathbb{N}^{*}$, les restrictions des fonctions de $E$ à $[-N, N]$ forment un sous-espace de fonctions monotones, et la question 1 s'applique sur $[-N, N]$, en remplaçant $0$ et $1$ par $-N$ et $N$. Le sous-espace 
    $$\Lambda_{N} = \Big\{\lambda \in \mathbb{R}^{3} \ \Big|\ \sum_{i} \lambda_{i}f_{i} = 0 \text{ sur } [-N, N]\Big\}$$
     de $\mathbb{R}^{3}$ n'est donc pas réduit à $\{0\}$. La suite $(\Lambda_{N})$ est décroissante pour l'inclusion, donc la suite des dimensions, entières et au moins égales à $1$, est décroissante et stationnaire : $\Lambda_{N} = \Lambda_{N_{0}}$ pour $N \geqslant N_{0}$. Un vecteur non nul de $\Lambda_{N_{0}}$ donne une relation valable sur tout $\mathbb{R}$ : $(f_{1}, f_{2}, f_{3})$ est liée, et $\dim E \leqslant 2$.

    *Piège.* On ne peut pas conclure directement par les valeurs en deux points, puisqu'aucun segment ne contient $\mathbb{R}$ ; et la relation trouvée sur chaque $[-N, N]$ pourrait a priori changer avec $N$. C'est la dimension finie de $\mathbb{R}^{3}$ qui force la stabilisation.
- id: "ma-15-51"
  feuille: "f-ma-15"
  numero: 51
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [combinatoire, lemme fondamental]
  noeuds: [v-echange, v-dimension]
  notions: [dimension]
  page_enonce: 9
  page_corrige: 15
  enonce: |
    Soit $n \geqslant 1$ et $X_{1}, \dots, X_{n + 1}$ des parties non vides de $[\![1\,;n]\!]$. Montrer qu'il existe deux parties $I$ et $J$ de $[\![1\,;n + 1]\!]$, non vides et disjointes, telles que 
    $$\bigcup_{i \in I} X_{i} = \bigcup_{j \in J} X_{j}.$$
     On pourra considérer les vecteurs $v_{i} \in \mathbb{R}^{n}$ dont la $k$-ième coordonnée vaut $1$ si $k \in X_{i}$ et $0$ sinon.
  corrige: |
    Les $n + 1$ vecteurs $v_{1}, \dots, v_{n + 1}$ de $\mathbb{R}^{n}$ sont liés : il existe des réels $\lambda_{i}$ non tous nuls tels que $\sum_{i} \lambda_{i}v_{i} = 0$. Posons $I = \{i \mid \lambda_{i} > 0\}$ et $J = \{j \mid \lambda_{j} < 0\}$, qui sont disjoints. Si $J$ était vide, on choisirait $i$ avec $\lambda_{i} > 0$ et $k \in X_{i}$ ; la $k$-ième coordonnée de $\sum \lambda_{i}v_{i}$, somme de termes positifs, serait au moins $\lambda_{i} > 0$, ce qui est absurde. Donc $J \neq \emptyset$, et de même $I \neq \emptyset$. On a 
    $$\sum_{i \in I} \lambda_{i}v_{i} = \sum_{j \in J} (-\lambda_{j})v_{j},$$
     deux combinaisons à coefficients strictement positifs. La $k$-ième coordonnée du membre de gauche est strictement positive si et seulement si $k$ appartient à l'un des $X_{i}$, $i \in I$ ; de même à droite. 
    $$\boxed{\bigcup_{i \in I} X_{i} = \bigcup_{j \in J} X_{j}}$$
     *À retenir.* Un énoncé purement combinatoire se démontre ici par le lemme fondamental : la dimension compte les vecteurs, et les signes des coefficients font le reste.
- id: "ma-15-52"
  feuille: "f-ma-15"
  numero: 52
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Calcul]
  mots_cles: [dimension]
  noeuds: [v-dimension]
  notions: [dimension]
  page_enonce: 9
  page_corrige: 15
  enonce: |
    Soit $E$ un $\mathbb{R}$-espace vectoriel de dimension finie. Deux $r$-uplets de sous-espaces $(F_{1}, \dots, F_{r})$ et $(F_{1}', \dots, F_{r}')$ sont dits équivalents s'il existe un automorphisme $\varphi$ de $E$ tel que l'on ait $\varphi(F_{i}) = F_{i}'$ pour tout $i$.

    **1.** Classer les sous-espaces de $E$ à équivalence près.

    **2.** Classer les couples de sous-espaces de $E$ à équivalence près.
  corrige: |
    **1.** Un automorphisme conserve la dimension des sous-espaces (proposition 6), donc deux sous-espaces équivalents ont la même dimension. Réciproquement, si $\dim F = \dim F' = p$, on complète une base $(e_{1}, \dots, e_{p})$ de $F$ en une base $(e_{1}, \dots, e_{n})$ de $E$, et de même pour $F'$. L'endomorphisme $\varphi$ défini par $\varphi(e_{i}) = e_{i}'$ envoie une base sur une base, donc est un automorphisme, et $\varphi(F) = F'$. 
    $$\boxed{F \sim F' \iff \dim F = \dim F' : \text{il y a } n + 1 \text{ classes.}}$$

    **2.** Comme $\varphi$ est injectif, $\varphi(F \cap G) = \varphi(F) \cap \varphi(G)$ : deux couples équivalents ont les mêmes dimensions $p = \dim F$, $q = \dim G$ et $k = \dim(F \cap G)$. Réciproquement, on construit une *base adaptée* au couple : une base $(a_{i})$ de $F \cap G$, complétée en une base $(a_{i}, b_{j})$ de $F$ et en une base $(a_{i}, c_{l})$ de $G$. La famille $(a, b, c)$ est libre : si $\sum \alpha_{i}a_{i} + \sum \beta_{j}b_{j} + \sum \gamma_{l}c_{l} = 0$, le vecteur $\sum \gamma_{l}c_{l}$ appartient à $G$ et à $F$, donc à $F \cap G$, ce qui force les $\gamma_{l}$ à être nuls, puis les $\alpha_{i}$ et $\beta_{j}$. On la complète par des vecteurs $d_{m}$ en une base de $E$. Les quatre blocs ont pour tailles $k$, $p - k$, $q - k$ et $n - p - q + k$, qui ne dépendent que de $(p, q, k)$. L'automorphisme envoyant la base adaptée à $(F, G)$ sur celle adaptée à $(F', G')$, bloc par bloc, envoie $F$ sur $F'$ et $G$ sur $G'$. 
    $$\boxed{(F, G) \sim (F', G') \iff (\dim F, \dim G, \dim F \cap G) = (\dim F', \dim G', \dim F' \cap G')}$$
     Les triplets possibles sont, par l'exercice 23, ceux qui vérifient $\max(0, p + q - n) \leqslant k \leqslant \min(p, q)$.
- id: "ma-15-53"
  feuille: "f-ma-15"
  numero: 53
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [dimension, bases, isomorphismes]
  noeuds: [v-dimension, v-bases-existence, v-rang]
  notions: [dimension, base-vectorielle, theoreme-base-incomplete, isomorphisme]
  page_enonce: 9
  page_corrige: 16
  enonce: |
    *Quatre sous-espaces : un invariant continu.* On reprend la relation d'équivalence de l'exercice 52, et l'on suppose $\dim E = 2r$, avec $r \geqslant 1$. On fixe une base $(e_{1}, \dots, e_{r}, f_{1}, \dots, f_{r})$ de $E$ et, pour tout réel $\lambda$, on pose 
    $$F_{1} = \mathrm{Vect}(e_{1}, \dots, e_{r}), \qquad F_{2} = \mathrm{Vect}(f_{1}, \dots, f_{r}), \qquad G_{\lambda} = \mathrm{Vect}(e_{1} + \lambda f_{1}, \dots, e_{r} + \lambda f_{r}).$$

    **1.** Soit $\lambda \in \mathbb{R} \setminus \{0, 1\}$. Montrer que $F_{1}$, $F_{2}$, $G_{1}$ et $G_{\lambda}$ sont de dimension $r$, et que l'intersection de deux quelconques d'entre eux est réduite à $\{0\}$.

    **2.** Soit $\varphi$ un automorphisme de $E$ tel que $\varphi(F_{1}) = F_{1}$, $\varphi(F_{2}) = F_{2}$ et $\varphi(G_{1}) = G_{1}$. Montrer que $\varphi(G_{\lambda}) = G_{\lambda}$ pour tout réel $\lambda$. On pourra introduire l'isomorphisme $s : F_{1} \to F_{2}$ défini par $s(e_{i}) = f_{i}$, et remarquer que $G_{\lambda} = \{x + \lambda s(x) \mid x \in F_{1}\}$.

    **3.** En déduire que, si $\lambda$ et $\mu$ sont deux éléments distincts de $\mathbb{R} \setminus \{0, 1\}$, les quadruplets $(F_{1}, F_{2}, G_{1}, G_{\lambda})$ et $(F_{1}, F_{2}, G_{1}, G_{\mu})$ ne sont pas équivalents. Comparer avec l'exercice 57, qui traite le cas de trois sous-espaces.

    **4.** On se place dans $E = \mathbb{R}^{2}$, avec $r = 1$, $e_{1} = (1, 0)$ et $f_{1} = (0, 1)$. Pour $t \in \mathbb{R}$, on note $D_{t}$ la droite d'équation $y = tx$. Soit $t_{1}$, $t_{2}$, $t_{3}$, $t_{4}$ quatre réels distincts. Montrer qu'il existe un unique $\lambda \in \mathbb{R} \setminus \{0, 1\}$ tel que $(D_{t_{1}}, D_{t_{2}}, D_{t_{3}}, D_{t_{4}})$ soit équivalent à $(F_{1}, F_{2}, G_{1}, G_{\lambda})$, et l'exprimer en fonction de $t_{1}$, $t_{2}$, $t_{3}$, $t_{4}$. Les quadruplets $(D_{0}, D_{1}, D_{2}, D_{3})$ et $(D_{0}, D_{1}, D_{2}, D_{4})$ sont-ils équivalents ?
  corrige: |
    **1.** Soit $\lambda$ et $\mu$ deux réels distincts, et $x \in G_{\lambda} \cap G_{\mu}$. On écrit $x = \sum_{i} a_{i}(e_{i} + \lambda f_{i}) = \sum_{i} b_{i}(e_{i} + \mu f_{i})$ ; les coordonnées sur $e_{i}$ donnent $a_{i} = b_{i}$, et celles sur $f_{i}$ donnent $\lambda a_{i} = \mu b_{i}$, d'où $(\lambda - \mu)a_{i} = 0$, puis $a_{i} = 0$ et $x = 0$. De même, si $x = \sum_{i} a_{i}(e_{i} + \lambda f_{i})$ appartient à $F_{2}$, ses coordonnées sur les $e_{i}$ sont nulles, donc $x = 0$. La famille $(e_{i} + \lambda f_{i})_{i}$ est libre, pour la même raison, donc $\dim G_{\lambda} = r$, et $\dim F_{1} = \dim F_{2} = r$. Comme $F_{1} = G_{0}$, et que $0$, $1$, $\lambda$ sont distincts, on obtient le résultat. 
    $$\boxed{\dim F_{1} = \dim F_{2} = \dim G_{1} = \dim G_{\lambda} = r, \quad \text{intersections deux à deux réduites à } \{0\}}$$

    **2.** Pour $x = \sum_{i} a_{i}e_{i} \in F_{1}$, on a $x + \lambda s(x) = \sum_{i} a_{i}(e_{i} + \lambda f_{i})$, et tout vecteur de $G_{\lambda}$ s'écrit ainsi : $G_{\lambda} = \{x + \lambda s(x) \mid x \in F_{1}\}$. Comme $\varphi(F_{1}) = F_{1}$ et $\varphi(F_{2}) = F_{2}$, la restriction de $\varphi$ définit des applications linéaires $a : F_{1} \to F_{1}$ et $b : F_{2} \to F_{2}$. Soit $x \in F_{1}$. Le vecteur $\varphi(x + s(x)) = a(x) + b(s(x))$ appartient à $G_{1}$ : il existe $y \in F_{1}$ tel que $a(x) + b(s(x)) = y + s(y)$. Comme $E = F_{1} \oplus F_{2}$, l'unicité de la décomposition donne $y = a(x)$ et $b(s(x)) = s(a(x))$. Par conséquent, 
    $$\varphi\big(x + \lambda s(x)\big) = a(x) + \lambda\,b(s(x)) = a(x) + \lambda\,s\big(a(x)\big) \in G_{\lambda}.$$
     Ainsi $\varphi(G_{\lambda}) \subset G_{\lambda}$. La restriction de $\varphi$, injective, est un isomorphisme de $G_{\lambda}$ sur $\varphi(G_{\lambda})$, qui est donc de dimension $r$ (proposition 6) ; le théorème 5 donne l'égalité. 
    $$\boxed{\varphi(G_{\lambda}) = G_{\lambda} \text{ pour tout } \lambda \in \mathbb{R}}$$

    **3.** Supposons qu'un automorphisme $\varphi$ envoie $(F_{1}, F_{2}, G_{1}, G_{\lambda})$ sur $(F_{1}, F_{2}, G_{1}, G_{\mu})$. Il vérifie les hypothèses de la question 2, donc $G_{\mu} = \varphi(G_{\lambda}) = G_{\lambda}$. Or $G_{\lambda} \cap G_{\mu} = \{0\}$ par la question 1, alors que $\dim G_{\lambda} = r \geqslant 1$ : c'est absurde. Chaque $\lambda \in \mathbb{R} \setminus \{0, 1\}$ fournit, par la question 1, un quadruplet de sous-espaces de dimension $r$ deux à deux d'intersection nulle, et ces quadruplets sont deux à deux non équivalents. 
    $$\boxed{\text{Il y a une infinité de classes de tels quadruplets, indexées par } \lambda \in \mathbb{R} \setminus \{0, 1\}.}$$
     Pour trois sous-espaces, l'exercice 57 montre au contraire qu'il n'y a qu'une seule classe.

    **4.** La droite $D_{t_{k}}$ est dirigée par $u_{k} = (1, t_{k})$. Comme $t_{1} \neq t_{2}$, $(u_{1}, u_{2})$ est une base de $\mathbb{R}^{2}$. La résolution de $u_{3} = \alpha u_{1} + \beta u_{2}$, c'est-à-dire de $\alpha + \beta = 1$ et $\alpha t_{1} + \beta t_{2} = t_{3}$, puis de même pour $u_{4} = \gamma u_{1} + \delta u_{2}$, donne 
    $$\alpha = \frac{t_{2} - t_{3}}{t_{2} - t_{1}}, \quad \beta = \frac{t_{3} - t_{1}}{t_{2} - t_{1}}, \quad \gamma = \frac{t_{2} - t_{4}}{t_{2} - t_{1}}, \quad \delta = \frac{t_{4} - t_{1}}{t_{2} - t_{1}},$$
     tous non nuls puisque les $t_{k}$ sont distincts. On pose $e_{1}' = \alpha u_{1}$ et $f_{1}' = \beta u_{2}$, qui forment une base de $\mathbb{R}^{2}$. Alors $u_{3} = e_{1}' + f_{1}'$ et $u_{4} = \frac{\gamma}{\alpha}\big(e_{1}' + \lambda f_{1}'\big)$ avec $\lambda = \frac{\alpha\delta}{\beta\gamma}$. L'automorphisme $\varphi$ défini par $\varphi(e_{1}) = e_{1}'$ et $\varphi(f_{1}) = f_{1}'$, qui envoie une base sur une base, envoie $F_{1}$, $F_{2}$, $G_{1}$, $G_{\lambda}$ sur $D_{t_{1}}$, $D_{t_{2}}$, $D_{t_{3}}$, $D_{t_{4}}$. On a $\lambda \neq 0$, car $\alpha\delta \neq 0$, et $\lambda \neq 1$, sinon $D_{t_{4}} = \varphi(G_{1}) = D_{t_{3}}$. L'unicité vient de la question 3 : deux quadruplets standard équivalents à un même quadruplet sont équivalents entre eux, la relation étant symétrique et transitive. 
    $$\boxed{\lambda = \frac{(t_{2} - t_{3})(t_{4} - t_{1})}{(t_{3} - t_{1})(t_{2} - t_{4})}}$$
     Pour $(t_{1}, t_{2}, t_{3}, t_{4}) = (0, 1, 2, 3)$, on trouve $\lambda = \frac{(-1) \times 3}{2 \times (-2)} = \frac{3}{4}$ ; on vérifie que $e_{1}' = (-1, 0)$, $f_{1}' = (2, 2)$, et que $e_{1}' + \frac{3}{4}f_{1}' = \big(\frac{1}{2}, \frac{3}{2}\big)$ dirige bien $D_{3}$. Pour $(0, 1, 2, 4)$, on trouve $\lambda = \frac{(-1) \times 4}{2 \times (-3)} = \frac{2}{3}$. 
    $$\boxed{(D_{0}, D_{1}, D_{2}, D_{3}) \text{ et } (D_{0}, D_{1}, D_{2}, D_{4}) \text{ ne sont pas équivalents.}}$$

    *À retenir.* Le nombre $\lambda$ est, à la convention près, le *birapport* des quatre pentes. Jusqu'ici, les classes d'équivalence de l'exercice 52 se décrivaient par des dimensions, c'est-à-dire par des entiers ; avec quatre sous-espaces apparaît un invariant réel, qui varie continûment, et la classification n'est plus finie.

    *Piège.* Trois droites distinctes de $\mathbb{R}^{2}$ sont toujours équivalentes à $(F_{1}, F_{2}, G_{1})$ ; il est tentant d'en conclure qu'un automorphisme bien choisi permet aussi de placer une quatrième droite à volonté. Mais, par la question 2, un automorphisme qui conserve $F_{1}$, $F_{2}$ et $G_{1}$ conserve toutes les droites $G_{\lambda}$ : il ne laisse plus aucune liberté pour la quatrième.
- id: "ma-15-54"
  feuille: "f-ma-15"
  numero: 54
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [dimension, familles libres, espaces de polynômes, nombres algébriques, extensions de corps]
  noeuds: [v-dimension, v-echange, pol-anneau]
  notions: [dimension]
  page_enonce: 9
  page_corrige: 17
  enonce: |
    *Nombres algébriques.* Les définitions et résultats des chapitres 14 et 15 n'utilisent que les propriétés de corps de $\mathbb{K}$ ; on admet qu'ils restent valables, avec les mêmes démonstrations, lorsque $\mathbb{K}$ est remplacé par $\mathbb{Q}$. Ainsi $\mathbb{C}$ est un $\mathbb{Q}$-espace vectoriel, et l'on note $\mathrm{Vect}_{\mathbb{Q}}(x_{1}, \dots, x_{n})$ l'ensemble des combinaisons linéaires à coefficients rationnels des complexes $x_{1}, \dots, x_{n}$.

    Un complexe $\alpha$ est dit *algébrique* s'il existe un polynôme non nul $P \in \mathbb{Q}[X]$ tel que $P(\alpha) = 0$. On note $\mathbb{Q}[\alpha] = \{P(\alpha) \mid P \in \mathbb{Q}[X]\}$, qui est le sous-$\mathbb{Q}$-espace vectoriel de $\mathbb{C}$ engendré par les puissances de $\alpha$.

    **1.** Montrer que $\alpha$ est algébrique si et seulement si $\mathbb{Q}[\alpha]$ est un $\mathbb{Q}$-espace vectoriel de dimension finie. Lorsque $\alpha$ annule un polynôme unitaire de $\mathbb{Q}[X]$ de degré $d \geqslant 1$, donner une famille génératrice de $\mathbb{Q}[\alpha]$ à $d$ éléments.

    **2.** Soit $\alpha$ et $\beta$ deux nombres algébriques, annulant des polynômes unitaires de $\mathbb{Q}[X]$ de degrés respectifs $p \geqslant 1$ et $q \geqslant 1$, et 
    $$V = \mathrm{Vect}_{\mathbb{Q}}\big(\alpha^{i}\beta^{j}\big)_{0 \leqslant i < p,\ 0 \leqslant j < q}.$$

    **(a)** Montrer que, pour tout $v \in V$, les complexes $\alpha v$ et $\beta v$ appartiennent à $V$.

    **(b)** En déduire que $\alpha + \beta$ et $\alpha\beta$ sont algébriques, et annulent chacun un polynôme non nul de $\mathbb{Q}[X]$ de degré au plus $pq$.

    **(c)** Montrer que l'ensemble des nombres algébriques est un sous-corps de $\mathbb{C}$.

    **3.** Soit $\gamma = \sqrt{2} + \sqrt{3}$. On rappelle que $\sqrt{2}$, $\sqrt{3}$ et $\sqrt{6}$ sont irrationnels (exercice 31 du chapitre 12).

    **(a)** Montrer que la famille $(1, \sqrt{2}, \sqrt{3}, \sqrt{6})$ est libre sur $\mathbb{Q}$. Dans une relation de la forme $a + b\sqrt{2} + c\sqrt{3} + d\sqrt{6} = 0$, à coefficients rationnels, on pourra supposer $c + d\sqrt{2} \neq 0$ et exprimer $\sqrt{3}$ sous la forme $x + y\sqrt{2}$, avec $x$, $y \in \mathbb{Q}$.

    **(b)** Montrer l'égalité $\mathbb{Q}[\gamma] = \mathrm{Vect}_{\mathbb{Q}}(1, \sqrt{2}, \sqrt{3}, \sqrt{6})$, puis que $\gamma$ n'annule aucun polynôme non nul de $\mathbb{Q}[X]$ de degré au plus $3$, et déterminer un polynôme unitaire de degré $4$ de $\mathbb{Q}[X]$ qui annule $\gamma$.

    **(c)** En déduire qu'il existe des polynômes $A$, $B \in \mathbb{Q}[X]$ tels que $\sqrt{2} = A(\gamma)$ et $\sqrt{3} = B(\gamma)$, et donner de tels polynômes.

    **4.** Sans calcul, montrer que $\sqrt[3]{2} + \sqrt{3}$ annule un polynôme non nul de $\mathbb{Q}[X]$ de degré au plus $6$.
  corrige: |
    **1.** Supposons $\alpha$ algébrique, et soit $P \in \mathbb{Q}[X]$ non nul tel que $P(\alpha) = 0$. Le polynôme $P$ n'est pas constant, et, quitte à le diviser par son coefficient dominant, qui est rationnel, on peut l'écrire $P = X^{d} + \sum_{i = 0}^{d - 1} a_{i}X^{i}$ avec $d \geqslant 1$. Soit $W = \mathrm{Vect}_{\mathbb{Q}}(1, \alpha, \dots, \alpha^{d - 1})$. Montrons par récurrence forte que $\alpha^{n} \in W$ pour tout $n \in \mathbb{N}$. C'est clair si $n < d$ ; si $n \geqslant d$, la relation $P(\alpha) = 0$ donne 
    $$\alpha^{n} = \alpha^{n - d}\alpha^{d} = -\sum_{i = 0}^{d - 1} a_{i}\,\alpha^{n - d + i},$$
     et les exposants $n - d + i$ sont strictement inférieurs à $n$, donc chaque terme appartient à $W$ par hypothèse de récurrence. Ainsi $\mathbb{Q}[\alpha] \subset W$, et l'inclusion réciproque est claire : $\mathbb{Q}[\alpha] = W$ est de dimension finie, au plus $d$.

    Réciproquement, si $\mathbb{Q}[\alpha]$ est de dimension $m$, les $m + 1$ vecteurs $1, \alpha, \dots, \alpha^{m}$ sont liés sur $\mathbb{Q}$ (théorème 1) : il existe des rationnels $\lambda_{0}, \dots, \lambda_{m}$ non tous nuls tels que $\sum_{k} \lambda_{k}\alpha^{k} = 0$, et le polynôme $\sum_{k} \lambda_{k}X^{k}$, non nul, annule $\alpha$. 
    $$\boxed{\alpha \text{ algébrique} \iff \dim_{\mathbb{Q}}\mathbb{Q}[\alpha] < +\infty, \qquad \mathbb{Q}[\alpha] = \mathrm{Vect}_{\mathbb{Q}}(1, \alpha, \dots, \alpha^{d - 1})}$$

    *Piège.* La famille $(1, \alpha, \dots, \alpha^{d - 1})$ engendre $\mathbb{Q}[\alpha]$, mais n'en est une base que si $\alpha$ n'annule aucun polynôme non nul de degré inférieur à $d$ : la dimension de $\mathbb{Q}[\alpha]$ est seulement majorée par $d$. Pour $\alpha = 1$ et $P = X^{2} - 1$, on a $\mathbb{Q}[\alpha] = \mathbb{Q}$, de dimension $1$.

    **2.(a)** On note $P = X^{p} + \sum_{i < p} a_{i}X^{i}$ et $Q = X^{q} + \sum_{j < q} b_{j}X^{j}$ les polynômes annulant $\alpha$ et $\beta$. Par linéarité, il suffit de vérifier que $\alpha\cdot\alpha^{i}\beta^{j}$ et $\beta\cdot\alpha^{i}\beta^{j}$ appartiennent à $V$ pour $i < p$ et $j < q$. Si $i + 1 < p$, le produit $\alpha^{i + 1}\beta^{j}$ est l'un des générateurs de $V$. Si $i + 1 = p$, la relation $P(\alpha) = 0$ donne 
    $$\alpha^{p}\beta^{j} = -\sum_{i' = 0}^{p - 1} a_{i'}\,\alpha^{i'}\beta^{j} \in V.$$
     Le cas de $\beta$ est symétrique. 
    $$\boxed{\alpha V \subset V \quad\text{et}\quad \beta V \subset V}$$

    **2.(b)** Posons $\sigma = \alpha + \beta$. Pour $v \in V$, on a $\sigma v = \alpha v + \beta v \in V$. Comme $1 = \alpha^{0}\beta^{0} \in V$, une récurrence immédiate donne $\sigma^{k} \in V$ pour tout $k \in \mathbb{N}$. L'espace $V$ est engendré par $pq$ vecteurs, donc de dimension au plus $pq$ (théorème 4), et les $pq + 1$ vecteurs $1, \sigma, \dots, \sigma^{pq}$ de $V$ sont liés sur $\mathbb{Q}$ (théorème 1). Une relation de dépendance fournit un polynôme non nul de degré au plus $pq$ qui annule $\sigma$. Le même raisonnement s'applique à $\pi = \alpha\beta$, puisque $\pi v = \alpha(\beta v) \in V$ pour tout $v \in V$. 
    $$\boxed{\alpha + \beta \text{ et } \alpha\beta \text{ sont algébriques, et annulent un polynôme non nul de degré au plus } pq}$$

    **2.(c)** Notons $\mathbb{A}$ l'ensemble des nombres algébriques. Il contient $1$, racine de $X - 1$, et il est stable par somme et par produit d'après la question précédente. Si $P(\alpha) = 0$ avec $P$ non nul, le polynôme non nul $P(-X)$ annule $-\alpha$. Enfin, si $\alpha \neq 0$ et $P = \sum_{k = 0}^{d} a_{k}X^{k}$ avec $a_{d} \neq 0$, le polynôme $\widetilde{P} = \sum_{k = 0}^{d} a_{k}X^{d - k}$ a pour coefficient constant $a_{d} \neq 0$, donc n'est pas nul, et 
    $$\widetilde{P}\Big(\frac{1}{\alpha}\Big) = \sum_{k = 0}^{d} a_{k}\,\alpha^{k - d} = \frac{P(\alpha)}{\alpha^{d}} = 0.$$

    $$\boxed{\mathbb{A} \text{ est un sous-corps de } \mathbb{C}}$$

    **3.(a)** Soit $a$, $b$, $c$, $d$ des rationnels tels que $a + b\sqrt{2} + \sqrt{3}\,(c + d\sqrt{2}) = 0$. Supposons $c + d\sqrt{2} \neq 0$. Alors $c - d\sqrt{2} \neq 0$ aussi : sinon $d \neq 0$, puisque $c = d = 0$ est exclu, et $\sqrt{2} = \frac{c}{d}$ serait rationnel. On multiplie par la quantité conjuguée : 
    $$\sqrt{3} = -\frac{(a + b\sqrt{2})(c - d\sqrt{2})}{c^{2} - 2d^{2}} = x + y\sqrt{2}, \qquad x = \frac{2bd - ac}{c^{2} - 2d^{2}}, \quad y = \frac{ad - bc}{c^{2} - 2d^{2}},$$
     avec $x$, $y \in \mathbb{Q}$. En élevant au carré, $3 = x^{2} + 2y^{2} + 2xy\sqrt{2}$. Si $xy \neq 0$, cela exprime $\sqrt{2}$ comme un rationnel ; donc $xy = 0$. Si $y = 0$, alors $\sqrt{3} = x$ est rationnel ; si $x = 0$, alors $\sqrt{6} = \sqrt{2}\sqrt{3} = 2y$ est rationnel. Les deux cas sont exclus, donc $c + d\sqrt{2} = 0$, ce qui force $c = d = 0$ par irrationalité de $\sqrt{2}$, puis $a + b\sqrt{2} = 0$ et $a = b = 0$. 
    $$\boxed{(1, \sqrt{2}, \sqrt{3}, \sqrt{6}) \text{ est libre sur } \mathbb{Q}}$$

    **3.(b)** Soit $W = \mathrm{Vect}_{\mathbb{Q}}(1, \sqrt{2}, \sqrt{3}, \sqrt{6})$, de dimension $4$ par la question précédente. C'est l'espace $V$ de la question 2 pour $\alpha = \sqrt{2}$ et $\beta = \sqrt{3}$, racines de $X^{2} - 2$ et $X^{2} - 3$, avec $p = q = 2$ : toutes les puissances de $\gamma$ appartiennent à $W$, donc $\mathbb{Q}[\gamma] \subset W$. Le calcul donne 
    $$\gamma^{2} = 5 + 2\sqrt{6}, \qquad \gamma^{3} = 11\sqrt{2} + 9\sqrt{3}, \qquad \gamma^{4} = 49 + 20\sqrt{6}.$$
     Si $\lambda_{0} + \lambda_{1}\gamma + \lambda_{2}\gamma^{2} + \lambda_{3}\gamma^{3} = 0$ avec des $\lambda_{k}$ rationnels, la liberté de $(1, \sqrt{2}, \sqrt{3}, \sqrt{6})$ donne 
    $$\lambda_{0} + 5\lambda_{2} = 0, \qquad \lambda_{1} + 11\lambda_{3} = 0, \qquad \lambda_{1} + 9\lambda_{3} = 0, \qquad 2\lambda_{2} = 0,$$
     d'où $\lambda_{2} = \lambda_{0} = 0$, puis $\lambda_{3} = \lambda_{1} = 0$. La famille $(1, \gamma, \gamma^{2}, \gamma^{3})$ est donc libre : aucun polynôme non nul de degré au plus $3$ n'annule $\gamma$, et $\mathbb{Q}[\gamma]$, qui contient quatre vecteurs libres, est de dimension au moins $4$. Comme $\mathbb{Q}[\gamma] \subset W$ et $\dim W = 4$, le théorème 5 donne l'égalité. Enfin $10\gamma^{2} - 1 = 49 + 20\sqrt{6} = \gamma^{4}$. 
    $$\boxed{\mathbb{Q}[\gamma] = \mathrm{Vect}_{\mathbb{Q}}(1, \sqrt{2}, \sqrt{3}, \sqrt{6}), \qquad \gamma^{4} - 10\gamma^{2} + 1 = 0}$$

    **3.(c)** Comme $\sqrt{2}$ et $\sqrt{3}$ appartiennent à $W = \mathbb{Q}[\gamma]$, de tels polynômes existent. Pour les trouver, on élimine une racine carrée dans $\gamma^{3}$ : on a $\gamma^{3} - 9\gamma = 11\sqrt{2} + 9\sqrt{3} - 9\sqrt{2} - 9\sqrt{3} = 2\sqrt{2}$, et de même $11\gamma - \gamma^{3} = 2\sqrt{3}$. 
    $$\boxed{\sqrt{2} = \frac{\gamma^{3} - 9\gamma}{2}, \qquad \sqrt{3} = \frac{11\gamma - \gamma^{3}}{2}}$$
     Le résultat surprend : le seul nombre $\sqrt{2} + \sqrt{3}$ permet de retrouver séparément $\sqrt{2}$ et $\sqrt{3}$ par des opérations rationnelles. Le plus petit sous-corps de $\mathbb{R}$ contenant $\gamma$ contient donc $\sqrt{2}$ et $\sqrt{3}$.

    **4.** Le réel $\alpha = \sqrt[3]{2}$ annule $X^{3} - 2$, et $\beta = \sqrt{3}$ annule $X^{2} - 3$. La question 2.(b), avec $p = 3$ et $q = 2$, donne directement le résultat. 
    $$\boxed{\sqrt[3]{2} + \sqrt{3} \text{ annule un polynôme non nul de } \mathbb{Q}[X] \text{ de degré au plus } 6}$$
     Le calcul effectif, long à la main, conduit à $X^{6} - 9X^{4} - 4X^{3} + 27X^{2} - 36X - 23$.

    *À retenir.* L'argument de dimension prouve l'existence d'une relation polynomiale sans la construire : $pq + 1$ vecteurs dans un espace de dimension au plus $pq$ sont liés. C'est le même mécanisme qu'à l'exercice 51, transposé sur le corps $\mathbb{Q}$.
- id: "ma-15-55"
  feuille: "f-ma-15"
  numero: 55
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [rang, suites récurrentes linéaires, pavages, dimension sur Q]
  noeuds: [v-rang, v-espace, v-dimension, v-dual]
  notions: [rang, dimension]
  page_enonce: 10
  page_corrige: 19
  enonce: |
    *Paver un rectangle par des carrés.* On admet, comme à l'exercice 54, que les résultats des chapitres 14 et 15 restent valables lorsque $\mathbb{K}$ est remplacé par $\mathbb{Q}$. Soit $a$, $b > 0$ et $R = [0, a] \times [0, b]$. On suppose que $R$ est pavé par des carrés $C_{1}, \dots, C_{s}$, c'est-à-dire que $R = C_{1} \cup \cdots \cup C_{s}$, où 
    $$C_{k} = [\alpha_{k}, \alpha_{k} + c_{k}] \times [\beta_{k}, \beta_{k} + c_{k}], \qquad c_{k} > 0,$$
     les intérieurs $\left]\alpha_{k}, \alpha_{k} + c_{k}\right[ \times \left]\beta_{k}, \beta_{k} + c_{k}\right[$ étant deux à deux disjoints. Le but est de montrer que $\frac{a}{b}$ est rationnel. On note $V$ le sous-$\mathbb{Q}$-espace vectoriel de $\mathbb{R}$ engendré par $a$, $b$ et les réels $\alpha_{k}$, $\beta_{k}$, $c_{k}$ pour $k \in [\![1\,;s]\!]$.

    **1.** Soit $f : V \to \mathbb{R}$ une fonction quelconque. Pour tout rectangle $P = [x, x'] \times [y, y']$ dont les coordonnées $x$, $x'$, $y$, $y'$ appartiennent à $V$, on pose 
    $$\mu_{f}(P) = \big(f(x') - f(x)\big)\big(f(y') - f(y)\big).$$
     Montrer que $\mu_{f}(R) = \sum_{k = 1}^{s} \mu_{f}(C_{k})$. On pourra ranger les éléments de l'ensemble 
    $$\{0, a\} \cup \{\alpha_{k}, \alpha_{k} + c_{k} \mid k \in [\![1\,;s]\!]\}$$
     en une suite strictement croissante $x_{0} < \cdots < x_{m}$, faire de même pour les ordonnées, et montrer que chaque petit rectangle $[x_{i - 1}, x_{i}] \times [y_{j - 1}, y_{j}]$ est contenu dans un et un seul des carrés $C_{k}$.

    **2.** On suppose $\frac{a}{b} \notin \mathbb{Q}$. Montrer qu'il existe une application $\mathbb{Q}$-linéaire $f : V \to \mathbb{Q}$ telle que $f(a) = 1$ et $f(b) = -1$, et aboutir à une contradiction.

    **3.** Montrer de même que $\frac{c_{k}}{a}$ est rationnel pour tout $k$. Réciproquement, montrer que si $\frac{a}{b}$ est rationnel, le rectangle $R$ peut être pavé par des carrés.

    Les cinq derniers exercices sont des problèmes à traiter en autonomie : l'énoncé fixe le but, et c'est à vous de trouver le chemin.
  corrige: |
    **1.** Chaque carré est contenu dans $R$, puisque $R$ en est la réunion ; les réels $\alpha_{k}$ et $\alpha_{k} + c_{k}$ appartiennent donc à $[0, a]$, et l'on a $x_{0} = 0$ et $x_{m} = a$. On note de même $y_{0} = 0 < y_{1} < \cdots < y_{n} = b$ les ordonnées, et $P_{ij} = [x_{i - 1}, x_{i}] \times [y_{j - 1}, y_{j}]$ les petits rectangles, pour $1 \leqslant i \leqslant m$ et $1 \leqslant j \leqslant n$. Tous ces nombres appartiennent à $V$.

    $\triangleright$ *Développement de $\mu_{f}$.* Soit $P = [x_{i_{0}}, x_{i_{1}}] \times [y_{j_{0}}, y_{j_{1}}]$ un rectangle dont les sommets sont des points de la grille. Par télescopage, quelle que soit la fonction $f$, 
    $$f(x_{i_{1}}) - f(x_{i_{0}}) = \sum_{i = i_{0} + 1}^{i_{1}} \big(f(x_{i}) - f(x_{i - 1})\big),$$
     et de même pour les ordonnées. En développant le produit, $\mu_{f}(P)$ est la somme des $\mu_{f}(P_{ij})$ pour $i_{0} < i \leqslant i_{1}$ et $j_{0} < j \leqslant j_{1}$, c'est-à-dire pour les petits rectangles contenus dans $P$. Cela s'applique à $R$ et à chaque carré $C_{k}$, dont les sommets sont des points de la grille.

    $\triangleright$ *Chaque petit rectangle est dans un seul carré.* Soit $(u, v)$ le centre de $P_{ij}$. Il appartient à $R$, donc à un carré $C_{k}$. Les nombres $\alpha_{k}$ et $\alpha_{k} + c_{k}$ appartiennent à la grille, alors que $u$, strictement compris entre $x_{i - 1}$ et $x_{i}$, n'y appartient pas ; donc $\alpha_{k} < u < \alpha_{k} + c_{k}$, et comme aucun point de la grille n'est strictement compris entre $x_{i - 1}$ et $x_{i}$, on obtient $\alpha_{k} \leqslant x_{i - 1}$ et $x_{i} \leqslant \alpha_{k} + c_{k}$. Le même raisonnement sur $v$ montre que $P_{ij} \subset C_{k}$. Si $P_{ij}$ était contenu dans deux carrés $C_{k}$ et $C_{l}$, avec $k \neq l$, son centre appartiendrait aux intérieurs de ces deux carrés, qui sont disjoints.

    $\triangleright$ *Conclusion.* En regroupant les petits rectangles selon le carré qui les contient, 
    $$\sum_{k = 1}^{s} \mu_{f}(C_{k}) = \sum_{k = 1}^{s}\ \sum_{P_{ij} \subset C_{k}} \mu_{f}(P_{ij}) = \sum_{i = 1}^{m}\sum_{j = 1}^{n} \mu_{f}(P_{ij}) = \mu_{f}(R).$$

    $$\boxed{\mu_{f}(R) = \sum_{k = 1}^{s} \mu_{f}(C_{k}) \text{ pour toute fonction } f : V \to \mathbb{R}}$$
     Avec $f = \mathrm{id}$, $\mu_{f}$ est l'aire, et l'on retrouve que l'aire de $R$ est la somme des aires des carrés. Le résultat vaut pour toute fonction $f$, ce que la suite exploite.

    **2.** L'espace $V$ est engendré par $3s + 2$ réels, donc de dimension finie sur $\mathbb{Q}$. La famille $(a, b)$ est libre sur $\mathbb{Q}$ : si $\lambda a + \nu b = 0$ avec $\lambda$, $\nu$ rationnels non tous deux nuls, alors $\lambda \neq 0$, sinon $\nu b = 0$ avec $b \neq 0$, et $\frac{a}{b} = -\frac{\nu}{\lambda}$ serait rationnel. On la complète en une base $(a, b, w_{3}, \dots, w_{d})$ de $V$ (théorème 2), et l'on définit $f$ comme l'unique application $\mathbb{Q}$-linéaire de $V$ dans $\mathbb{Q}$ telle que $f(a) = 1$, $f(b) = -1$ et $f(w_{i}) = 0$ (théorème 4 du chapitre 14).

    Par $\mathbb{Q}$-linéarité, $f(\alpha_{k} + c_{k}) - f(\alpha_{k}) = f(c_{k})$, et de même pour $\beta_{k}$ : on a donc $\mu_{f}(C_{k}) = f(c_{k})^{2} \geqslant 0$. D'autre part, $f(0) = 0$ et $\mu_{f}(R) = f(a)f(b) = -1$. La question 1 donne alors 
    $$-1 = \sum_{k = 1}^{s} f(c_{k})^{2} \geqslant 0,$$
     ce qui est absurde. 
    $$\boxed{\text{Si un rectangle est pavé par des carrés, le rapport de ses côtés est rationnel.}}$$

    *Piège.* Une application $\mathbb{R}$-linéaire de $\mathbb{R}$ dans $\mathbb{R}$ est de la forme $x \mapsto \kappa x$, et donne $\mu_{f} = \kappa^{2} \times \text{aire}$ : on n'obtient aucune contradiction. Toute la force de l'argument vient de ce que $f$ n'est que $\mathbb{Q}$-linéaire, ce qui permet d'imposer $f(a)$ et $f(b)$ de signes contraires ; une telle fonction n'est ni continue ni monotone. Il suffit de la construire sur l'espace $V$ de dimension finie, et non sur $\mathbb{R}$ tout entier, qui est de dimension infinie sur $\mathbb{Q}$.

    **3.** D'après la question 2, $b = ra$ avec $r \in \mathbb{Q}$. Supposons $\frac{c_{k}}{a} \notin \mathbb{Q}$ pour un certain $k$. Comme à la question 2, la famille $(a, c_{k})$ est libre sur $\mathbb{Q}$, et il existe une application $\mathbb{Q}$-linéaire $f : V \to \mathbb{Q}$ telle que $f(a) = 0$ et $f(c_{k}) = 1$. Alors $f(b) = rf(a) = 0$, donc $\mu_{f}(R) = 0$, alors que $\sum_{l} \mu_{f}(C_{l}) \geqslant f(c_{k})^{2} = 1$ : c'est absurde.

    Réciproquement, supposons que $\frac{a}{b} = \frac{p}{q}$, avec $p$, $q \in \mathbb{N}^{*}$, et posons $c = \frac{a}{p} = \frac{b}{q}$. Les $pq$ carrés $[ic, (i + 1)c] \times [jc, (j + 1)c]$, pour $0 \leqslant i < p$ et $0 \leqslant j < q$, recouvrent $R$ et ont des intérieurs deux à deux disjoints. 
    $$\boxed{\frac{c_{k}}{a} \in \mathbb{Q} \text{ pour tout } k, \qquad R \text{ pavable par des carrés} \iff \frac{a}{b} \in \mathbb{Q}}$$

    *À retenir.* Le rectangle $[0, \sqrt{2}] \times [0, 1]$ ne peut pas être pavé par un nombre fini de carrés, si petits soient-ils. Ce théorème de Max Dehn (*Mathematische Annalen*, 1903) se démontre en regardant $\mathbb{R}$ comme un espace vectoriel sur $\mathbb{Q}$ : un problème de géométrie se résout par le théorème de la base incomplète.
