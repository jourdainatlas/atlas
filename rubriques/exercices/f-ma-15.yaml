  enonce: |
    Soit $E$ un espace de dimension finie et $f_{1}, \dots, f_{n}$, $f$ des formes linéaires sur $E$ telles que 
    $$\forall x \in E, \quad \big(f_{1}(x) = \cdots = f_{n}(x) = 0\big) \implies f(x) = 0.$$
     Montrer que $f$ est combinaison linéaire de $f_{1}, \dots, f_{n}$. On pourra appliquer l'exercice 37 à l'application $u : x \mapsto \big(f_{1}(x), \dots, f_{n}(x)\big)$, de $E$ dans $\mathbb{K}^{n}$.
  corrige: |
    L'application $u : x \mapsto \big(f_{1}(x), \dots, f_{n}(x)\big)$ est linéaire de $E$ dans $\mathbb{K}^{n}$, et l'hypothèse dit exactement que $\mathrm{Ker}\, u \subset \mathrm{Ker}\, f$. L'exercice 37 fournit $w \in \mathcal{L}(\mathbb{K}^{n}, \mathbb{K})$ tel que $f = w \circ u$. Une forme linéaire sur $\mathbb{K}^{n}$ s'écrit $w(y) = c_{1}y_{1} + \cdots + c_{n}y_{n}$, avec $c_{i} = w(e_{i})$. 
    $$\boxed{f = c_{1}f_{1} + \cdots + c_{n}f_{n}}$$
     C'est la forme générale du résultat sur les équations proportionnelles (proposition 23 du chapitre 14), qui correspond au cas $n = 1$.
- id: "ma-15-46"
  feuille: "f-ma-15"
  numero: 46
  partie: "Hyperplans et systèmes d'équations"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [hyperplans et systèmes, hyperplans]
