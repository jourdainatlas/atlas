    Soit $E$ un espace de dimension finie et $u \in \mathcal{L}(E)$ tel que $u \circ v = v \circ u$ pour tout $v \in \mathcal{L}(E)$. Montrer que $u$ est une homothétie. On pourra utiliser l'exercice 52 du chapitre 14, avec des projecteurs bien choisis.
  corrige: |
    Soit $x \in E$ non nul, $H$ un supplémentaire de $\mathbb{K} x$ et $p$ le projecteur sur $\mathbb{K} x$ parallèlement à $H$. Comme $u$ commute avec $p$, l'image $\operatorname{Im} p = \mathbb{K} x$ est stable par $u$ (exercice 45 du chapitre 14) : $u(x)$ est colinéaire à $x$. Ceci valant pour tout $x$, l'exercice 52 du chapitre 14 montre que $u$ est une homothétie. 
    $$\boxed{u \text{ commute avec tout } v \in \mathcal{L}(E) \iff u = \lambda\,\mathrm{id}_{E}}$$
     La réciproque est immédiate : une homothétie commute avec tout endomorphisme.
- id: "ma-15-40"
  feuille: "f-ma-15"
  numero: 40
  partie: "Applications linéaires en dimension finie"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [théorème du rang, dimension, rang, suites récurrentes linéaires]
  noeuds: [v-rang, v-dimension, v-espace]
  notions: [rang, dimension]
  page_enonce: 6
  page_corrige: 11
  enonce: |
    Soit $f$ un endomorphisme d'un espace $E$ de dimension finie.

    **1.** Montrer que, pour tout $n \in \mathbb{N}$, $\mathrm{Ker}\, f^{n} \subset \mathrm{Ker}\, f^{n + 1}$ et $\operatorname{Im} f^{n + 1} \subset \operatorname{Im} f^{n}$.

    **2.** Que peut-on dire des suites $(\dim\mathrm{Ker}\, f^{n})_{n \in \mathbb{N}}$ et $(\dim\operatorname{Im} f^{n})_{n \in \mathbb{N}}$ ?

    **3.** Montrer que les suites $(\mathrm{Ker}\, f^{n})_{n \in \mathbb{N}}$ et $(\operatorname{Im} f^{n})_{n \in \mathbb{N}}$ sont constantes à partir d'un même rang.

    **4.** Montrer que la suite $d_{n} = \mathrm{rg}(f^{n})$ vérifie $d_{n + 1} \leqslant \frac{d_{n} + d_{n + 2}}{2}$ pour tout $n \in \mathbb{N}$.
  corrige: |
    **1.** Si $f^{n}(x) = 0$, alors $f^{n + 1}(x) = f(0) = 0$ ; et $f^{n + 1}(x) = f^{n}(f(x)) \in \operatorname{Im} f^{n}$.

    **2.** La suite $(\dim\mathrm{Ker}\, f^{n})$ est croissante, majorée par $\dim E$, et la suite $(\dim\operatorname{Im} f^{n})$ est décroissante et positive ; ce sont des suites d'entiers, donc elles sont constantes à partir d'un certain rang. Leur somme vaut $\dim E$ (théorème du rang).

    **3.** Soit $p$ le plus petit entier tel que $\mathrm{Ker}\, f^{p} = \mathrm{Ker}\, f^{p + 1}$, qui existe par la question 2 et le théorème 5. Montrons que $\mathrm{Ker}\, f^{p + k} = \mathrm{Ker}\, f^{p + k + 1}$ pour tout $k$ : si $f^{p + k + 1}(x) = 0$, alors $f^{k}(x) \in \mathrm{Ker}\, f^{p + 1} = \mathrm{Ker}\, f^{p}$, donc $f^{p + k}(x) = 0$. Par le théorème du rang et l'inclusion de la question 1, $\operatorname{Im} f^{n + 1} = \operatorname{Im} f^{n}$ équivaut à $\mathrm{Ker}\, f^{n + 1} = \mathrm{Ker}\, f^{n}$ : les deux suites se stabilisent exactement au même rang $p$.

    **4.** L'exercice 34, appliqué à $f^{n}$ puis $f$, donne 
    $$d_{n} - d_{n + 1} = \dim(\operatorname{Im} f^{n} \cap \mathrm{Ker}\, f).$$
     Comme $\operatorname{Im} f^{n + 1} \subset \operatorname{Im} f^{n}$, cette quantité décroît avec $n$, ce qui s'écrit $d_{n + 1} - d_{n + 2} \leqslant d_{n} - d_{n + 1}$, soit 
    $$\boxed{d_{n + 1} \leqslant \frac{d_{n} + d_{n + 2}}{2}}$$
     La suite des rangs est donc « convexe » : ses décroissances successives diminuent.
- id: "ma-15-41"
  feuille: "f-ma-15"
  numero: 41
  partie: "Applications linéaires en dimension finie"
  etoiles: 3
