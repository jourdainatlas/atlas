  page_corrige: 12
  enonce: |
    Soit $E$ un espace de dimension $n$.

    **1.** Soit $H$ et $H'$ deux hyperplans de $E$. Montrer que $\dim(H \cap H') \in \{n - 1, n - 2\}$, et donner une condition nécessaire et suffisante pour que $\dim(H \cap H') = n - 2$.

    **2.** Quelle est la dimension du sous-espace de $\mathbb{R}^{9}$ défini par les deux équations 
    $$a - 7b + 3c - 2d + f - g + 2h + \sqrt{42}\,i = 0 \qquad\text{et}\qquad a + 2b + 3c + 4d + 5e + 6f + 7g + 8h + 9i = 0 \ ?$$

    **3.** Soit $v = (2, 1, -1, 0) \in \mathbb{R}^{4}$. Écrire la droite $\mathrm{Vect}(v)$ comme l'intersection de trois hyperplans.
  corrige: |
    **1.** On a $H \cap H' \subset H$, donc $\dim(H \cap H') \leqslant n - 1$, et $\dim(H \cap H') \geqslant n - 2$ par le théorème 13. Si $H = H'$, la dimension vaut $n - 1$. Sinon, $H \cap H'$ est un sous-espace strict de $H$, de dimension au plus $n - 2$ (théorème 5). 
    $$\boxed{\dim(H \cap H') = n - 2 \iff H \neq H' \iff \text{les équations de } H \text{ et } H' \text{ ne sont pas proportionnelles}}$$

    **2.** La première équation ne contient pas $e$, et la seconde le contient avec le coefficient $5$ : si la seconde forme était $\lambda$ fois la première, on aurait $5 = 0$. Les deux hyperplans sont distincts. 
    $$\boxed{\dim = 9 - 2 = 7}$$

    **3.** Les formes $x - 2y$, $y + z$ et $t$ s'annulent en $v = (2, 1, -1, 0)$, et elles sont libres, leurs coefficients $(1, -2, 0, 0)$, $(0, 1, 1, 0)$, $(0, 0, 0, 1)$ étant échelonnés. L'intersection est de dimension $4 - 3 = 1$ (proposition 9) et contient $v$. 
    $$\boxed{\mathrm{Vect}(v) = \{x - 2y = 0\} \cap \{y + z = 0\} \cap \{t = 0\}}$$
- id: "ma-15-45"
