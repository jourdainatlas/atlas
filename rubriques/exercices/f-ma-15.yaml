  enonce: |
    Soit $E$ un espace de dimension finie et $p$, $q$ deux projecteurs de $E$. Montrer que $p$ et $q$ ont le même rang si et seulement s'il existe $u$, $v \in \mathcal{L}(E)$ tels que $p = u \circ v$ et $q = v \circ u$.
  corrige: |
    $\triangleright$ *Sens réciproque.* Si $p = u \circ v$ et $q = v \circ u$, alors 
    $$q = q^{3} = (vu)(vu)(vu) = v\,(uv)(uv)\,u = v \circ p^{2} \circ u = v \circ p \circ u,$$
     donc $\mathrm{rg} q \leqslant \mathrm{rg} p$ (proposition 7). De même $p = p^{3} = u \circ q \circ v$, donc $\mathrm{rg} p \leqslant \mathrm{rg} q$.

    $\triangleright$ *Sens direct.* On a $E = \operatorname{Im} p \oplus \mathrm{Ker}\, p$ et $E = \operatorname{Im} q \oplus \mathrm{Ker}\, q$ (proposition 21 du chapitre 14). Comme $\operatorname{Im} p$ et $\operatorname{Im} q$ ont la même dimension, il existe un isomorphisme $\alpha : \operatorname{Im} q \to \operatorname{Im} p$. On pose $u = \alpha$ sur $\operatorname{Im} q$ et $u = 0$ sur $\mathrm{Ker}\, q$, puis $v = \alpha^{-1}$ sur $\operatorname{Im} p$ et $v = 0$ sur $\mathrm{Ker}\, p$. Pour $y \in \operatorname{Im} p$, $u(v(y)) = \alpha(\alpha^{-1}(y)) = y = p(y)$, et pour $y \in \mathrm{Ker}\, p$, $u(v(y)) = 0 = p(y)$ : $u \circ v = p$. On vérifie de même que $v \circ u = q$ sur $\operatorname{Im} q$ et sur $\mathrm{Ker}\, q$. 
    $$\boxed{\mathrm{rg} p = \mathrm{rg} q \iff \exists\, u, v \in \mathcal{L}(E), \ p = u \circ v, \ q = v \circ u}$$
- id: "ma-15-44"
  feuille: "f-ma-15"
  numero: 44
  partie: "Hyperplans et systèmes d'équations"
  etoiles: 1
  types: [Démonstration]
