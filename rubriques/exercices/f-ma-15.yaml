  page_corrige: 13
  enonce: |
    Soit $n \in \mathbb{N}^{*}$. Montrer qu'il existe un unique $(c_{1}, \dots, c_{n}) \in \mathbb{R}^{n}$ tel que, pour tout $P \in \mathbb{R}_{2n + 1}[X]$, 
    $$\int_{-1}^{1} P(x)\,\mathrm{d} x = 2P(0) + \sum_{k = 1}^{n} c_{k}\big(P(k) + P(-k) - 2P(0)\big).$$
     Déterminer $c_{1}$ et $c_{2}$ lorsque $n = 2$.
  corrige: |
    Les deux membres sont linéaires en $P$ ; il suffit d'écrire l'égalité sur une base de $\mathbb{R}_{2n + 1}[X]$. Pour $P = X^{2j + 1}$, les deux membres sont nuls, par imparité. Pour $P = 1$, les deux membres valent $2$. Pour $P = X^{2j}$, $1 \leqslant j \leqslant n$, la condition s'écrit 
    $$\sum_{k = 1}^{n} c_{k}\,k^{2j} = \frac{1}{2j + 1}.$$
     C'est l'équation $\Phi(c) = b$, où $b = \big(\frac{1}{2j + 1}\big)_{1 \leqslant j \leqslant n}$ et où $\Phi : c \mapsto \Big(\sum_{k} c_{k}k^{2j}\Big)_{1 \leqslant j \leqslant n}$ est un endomorphisme de $\mathbb{R}^{n}$. Montrons que $\Phi$ est injectif. Si $\Phi(c) = 0$, alors $\sum_{k} c_{k}Q(k^{2}) = 0$ pour tout polynôme $Q = \sum_{j = 1}^{n} q_{j}Y^{j}$ sans terme constant et de degré au plus $n$. Pour $m \in [\![1\,;n]\!]$, le polynôme $Q_{m} = Y\prod_{k \neq m}(Y - k^{2})$ est de ce type, et s'annule en $k^{2}$ pour $k \neq m$, mais pas en $m^{2}$ : donc $c_{m} = 0$. L'endomorphisme $\Phi$ est injectif, donc bijectif (théorème 10), d'où l'existence et l'unicité. Pour $n = 2$, on résout $c_{1} + 4c_{2} = \frac{1}{3}$ et $c_{1} + 16c_{2} = \frac{1}{5}$. 
    $$\boxed{c_{1} = \frac{17}{45}, \qquad c_{2} = -\frac{1}{90}}$$
     On a vérifié l'égalité obtenue sur $1, X, \dots, X^{5}$. Cette *formule de quadrature* est exacte sur $\mathbb{R}_{5}[X]$ en n'utilisant que cinq valeurs de $P$.
- id: "ma-15-47"
  feuille: "f-ma-15"
  numero: 47
  partie: "Hyperplans et systèmes d'équations"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [hyperplans et systèmes, bases, rang, supplémentaires, espaces de polynômes, interpolation de Lagrange, suites récurrentes linéaires, équations différentielles linéaires]
  noeuds: [v-dual, v-rang, v-bases-existence, v-dimension, v-somme-directe, pol-anneau, pol-racines, v-espace, ed-lineaires]
  notions: [forme-lineaire, base-vectorielle, theoreme-base-incomplete, rang, supplementaire]
  page_enonce: 8
  page_corrige: 13
  enonce: |
    Soit $a$, $b$, $c$ trois nombres complexes distincts, $E$ un $\mathbb{C}$-espace vectoriel et $f \in \mathcal{L}(E)$ tel que 
    $$(f - a\,\mathrm{id}) \circ (f - b\,\mathrm{id}) \circ (f - c\,\mathrm{id}) = 0.$$
     Pour $\lambda \in \mathbb{C}$, on note $E_{\lambda} = \mathrm{Ker}\,(f - \lambda\,\mathrm{id})$.

    **1.** Montrer que $E = E_{a} \oplus E_{b} \oplus E_{c}$. Pour la somme, on pourra utiliser les polynômes de Lagrange $L_{a}$, $L_{b}$, $L_{c}$ associés aux points $a$, $b$, $c$, et l'égalité $L_{a} + L_{b} + L_{c} = 1$.

    **2.** Soit $F$ l'ensemble des suites $u \in \mathbb{C}^{\mathbb{N}}$ telles que $u_{n + 3} = u_{n + 1} + 6u_{n}$ pour tout $n$. Montrer que $f : (u_{n})_{n} \mapsto (u_{n + 1})_{n}$ est un endomorphisme de $F$, et en déduire une base de $F$.

    **3.** Par la même démarche, déterminer une base de l'espace des solutions de l'équation différentielle $y''' - y'' + 2y = 0$, en considérant $y \mapsto y'$.
  corrige: |
    **1.** Posons $L_{a} = \frac{(X - b)(X - c)}{(a - b)(a - c)}$, et de même $L_{b}$ et $L_{c}$. Le polynôme $L_{a} + L_{b} + L_{c} - 1$, de degré au plus $2$, s'annule en $a$, $b$, $c$, donc est nul : $\mathrm{id} = L_{a}(f) + L_{b}(f) + L_{c}(f)$. De plus, $(f - a\,\mathrm{id}) \circ L_{a}(f)$ est un multiple de $(f - a\,\mathrm{id})(f - b\,\mathrm{id})(f - c\,\mathrm{id}) = 0$, donc $\operatorname{Im} L_{a}(f) \subset E_{a}$. Tout $x = L_{a}(f)(x) + L_{b}(f)(x) + L_{c}(f)(x)$ est ainsi dans $E_{a} + E_{b} + E_{c}$. Si $x_{a} + x_{b} + x_{c} = 0$, avec $x_{\lambda} \in E_{\lambda}$, on applique $(f - b\,\mathrm{id})(f - c\,\mathrm{id})$ : on obtient $(a - b)(a - c)x_{a} = 0$, donc $x_{a} = 0$, et de même $x_{b} = x_{c} = 0$. 
    $$\boxed{E = E_{a} \oplus E_{b} \oplus E_{c}}$$

    **2.** Si $u \in F$, la suite décalée vérifie la même relation : $f$ est un endomorphisme de $F$, et $f^{3} = f + 6\,\mathrm{id}$. Or $X^{3} - X - 6 = (X - 2)(X^{2} + 2X + 3)$, de racines $2$ et $\rho$, $\bar\rho$, avec $\rho = -1 + i\sqrt{2}$. La question 1 s'applique. Le sous-espace $E_{\lambda}$ est formé des suites de $F$ vérifiant $u_{n + 1} = \lambda u_{n}$, c'est-à-dire des multiples de $(\lambda^{n})$, qui appartient à $F$ puisque $\lambda$ est racine. 
    $$\boxed{\text{Base de } F : \big((2^{n}), ((-1 + i\sqrt{2})^{n}), ((-1 - i\sqrt{2})^{n})\big)}$$

    **3.** Soit $S$ l'espace des solutions complexes ; une solution $y$ vérifie $y''' = y'' - 2y$, donc est de classe $\mathcal{C}^{\infty}$, et $y'$ est encore solution : $D : y \mapsto y'$ est un endomorphisme de $S$, et $D^{3} - D^{2} + 2\,\mathrm{id} = 0$. Or $X^{3} - X^{2} + 2 = (X + 1)(X^{2} - 2X + 2)$, de racines $-1$ et $1 \pm i$. Par le chapitre 6, $\mathrm{Ker}\,(D - \lambda\,\mathrm{id})$ est formé des multiples de $x \mapsto e^{\lambda x}$, qui est solution. 
    $$\boxed{\text{Base de } S : \big(x \mapsto e^{-x},\ x \mapsto e^{(1 + i)x},\ x \mapsto e^{(1 - i)x}\big)}$$
     Les fonctions $e^{x}\cos x$ et $e^{x}\sin x$ engendrent le même plan que $e^{(1 \pm i)x}$, ce qui donne une base formée de fonctions réelles. On a ainsi résolu une équation d'ordre $3$ sans disposer d'un théorème de Cauchy à cet ordre.
- id: "ma-15-48"
  feuille: "f-ma-15"
