  page_enonce: 11
  page_corrige: 21
  enonce: |
    On admet qu'il n'existe pas de surjection de $\mathbb{N}$ sur $\mathbb{R}$. Soit $E$ un $\mathbb{R}$-espace vectoriel de dimension finie $n \geqslant 1$. Montrer qu'il n'existe pas de suite $(H_{k})_{k \in \mathbb{N}}$ d'hyperplans de $E$ telle que $E = \bigcup_{k \in \mathbb{N}} H_{k}$.
  corrige: |
    *Idée.* On trouve dans $E$ une courbe qui ne rencontre chaque hyperplan qu'en un nombre fini de points ; il faudrait alors une infinité dénombrable d'ensembles finis pour couvrir $\mathbb{R}$.

    Soit $(e_{1}, \dots, e_{n})$ une base de $E$, et $v(t) = \sum_{i = 1}^{n} t^{i - 1}e_{i}$ pour $t \in \mathbb{R}$. Un hyperplan $H$ est le noyau d'une forme non nulle $x \mapsto \sum a_{i}x_{i}$ (théorème 12), et $v(t) \in H$ si et seulement si $\sum a_{i}t^{i - 1} = 0$. Ce polynôme, non nul et de degré au plus $n - 1$, a au plus $n - 1$ racines : l'ensemble $T_{H} = \{t \mid v(t) \in H\}$ a au plus $n - 1$ éléments.

    Supposons $E = \bigcup_{k} H_{k}$. Tout réel $t$ appartient alors à l'un des $T_{H_{k}}$. Numérotons les éléments de $T_{H_{k}}$ en $t_{k, 1}, \dots, t_{k, m_{k}}$, avec $m_{k} \leqslant n - 1$. L'application qui envoie $(k, j)$ sur $t_{k, j}$ si $j \leqslant m_{k}$, et sur $0$ sinon, est une surjection de $\mathbb{N} \times [\![1\,;n]\!]$ sur $\mathbb{R}$. Composée avec une bijection de $\mathbb{N}$ sur $\mathbb{N} \times [\![1\,;n]\!]$, comme $m \mapsto (\lfloor m/n \rfloor, 1 + m - n\lfloor m/n \rfloor)$, elle donne une surjection de $\mathbb{N}$ sur $\mathbb{R}$, ce qui est exclu. 
    $$\boxed{E \text{ n'est pas réunion d'une suite d'hyperplans.}}$$
     Pour $n = 1$, l'argument reste valable : le seul hyperplan est $\{0\}$, et les ensembles $T_{H}$ sont vides.
