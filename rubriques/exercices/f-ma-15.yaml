  enonce: |
    *Lemme de factorisation.* Soit $E$, $F$, $G$ trois espaces de dimension finie, $u \in \mathcal{L}(E, F)$ et $v \in \mathcal{L}(E, G)$. Montrer que $\mathrm{Ker}\, u \subset \mathrm{Ker}\, v$ si et seulement s'il existe $w \in \mathcal{L}(F, G)$ tel que $v = w \circ u$. Pour le sens direct, on considérera un supplémentaire $S$ de $\mathrm{Ker}\, u$ dans $E$ et un supplémentaire $T$ de $\operatorname{Im} u$ dans $F$.
  corrige: |
    $\triangleright$ *Sens réciproque.* Si $v = w \circ u$, tout vecteur annulé par $u$ l'est par $v$.

    $\triangleright$ *Sens direct.* La restriction de $u$ à $S$ est un isomorphisme de $S$ sur $\operatorname{Im} u$ (théorème 8) ; notons $\sigma$ sa réciproque. On définit $w \in \mathcal{L}(F, G)$ par $w = v \circ \sigma$ sur $\operatorname{Im} u$ et $w = 0$ sur $T$, ce qui est licite puisque $F = \operatorname{Im} u \oplus T$ (proposition 19 du chapitre 14). Pour $x = k + s$, avec $k \in \mathrm{Ker}\, u$ et $s \in S$, on a $v(k) = 0$ par hypothèse, donc 
    $$w(u(x)) = w(u(s)) = v(\sigma(u(s))) = v(s) = v(x).$$

    $$\boxed{\mathrm{Ker}\, u \subset \mathrm{Ker}\, v \iff \exists\, w \in \mathcal{L}(F, G), \ v = w \circ u}$$
     *Idée.* La condition $\mathrm{Ker}\, u \subset \mathrm{Ker}\, v$ dit que $v(x)$ ne dépend que de $u(x)$ : la fonction $w$ « $u(x) \mapsto v(x)$ » est bien définie sur $\operatorname{Im} u$, et il reste à la prolonger.
