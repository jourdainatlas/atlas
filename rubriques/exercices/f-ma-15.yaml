  enonce: |
    Montrer que tout endomorphisme d'un espace $E$ de dimension finie est la différence de deux automorphismes. On pourra introduire un supplémentaire $S$ de $\mathrm{Ker}\, u$, un supplémentaire $T$ de $\operatorname{Im} u$ et un isomorphisme de $\mathrm{Ker}\, u$ sur $T$.
  corrige: |
    Soit $u \in \mathcal{L}(E)$. Les sous-espaces $\mathrm{Ker}\, u$ et $T$ ont la même dimension $\dim E - \mathrm{rg} u$, donc il existe un isomorphisme $\varphi : \mathrm{Ker}\, u \to T$. On définit $a$ et $b$ sur $E = \mathrm{Ker}\, u \oplus S$ par 
    $$a = u \text{ sur } S, \quad a = \varphi \text{ sur } \mathrm{Ker}\, u, \qquad b = u \text{ sur } S, \quad b = 2\varphi \text{ sur } \mathrm{Ker}\, u.$$
     L'image de $a$ contient $u(S) = \operatorname{Im} u$ (théorème 8) et $\varphi(\mathrm{Ker}\, u) = T$, donc $\operatorname{Im} a = \operatorname{Im} u + T = E$ : $a$ est surjectif, donc un automorphisme (théorème 10). Il en est de même de $b$, puisque $2\varphi$ est aussi un isomorphisme de $\mathrm{Ker}\, u$ sur $T$. Enfin $2a - b$ vaut $2u - u = u$ sur $S$ et $2\varphi - 2\varphi = 0$ sur $\mathrm{Ker}\, u$. 
    $$\boxed{u = (2a) - b, \qquad 2a, \ b \in \mathrm{GL}(E)}$$
- id: "ma-15-43"
  feuille: "f-ma-15"
  numero: 43
