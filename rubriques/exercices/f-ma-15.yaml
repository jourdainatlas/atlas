  enonce: |
    Soit $f : \mathbb{R}^{2} \to \mathbb{R}$ une fonction. Pour $a \in \mathbb{R}$, on pose $\varphi_{a} : x \mapsto f(a, x)$ et $\psi_{a} : x \mapsto f(x, a)$, puis $F = \mathrm{Vect}(\varphi_{a})_{a \in \mathbb{R}}$ et $G = \mathrm{Vect}(\psi_{a})_{a \in \mathbb{R}}$, sous-espaces de $\mathcal{F}(\mathbb{R}, \mathbb{R})$. Montrer que, si l'un des deux est de dimension finie, l'autre l'est aussi, et qu'ils ont la même dimension.
  corrige: |
    *Idée.* Si $F$ est de dimension $d$, on écrit chaque $\varphi_{a}$ sur une base formée de $d$ fonctions $\varphi_{a_{i}}$ ; les coefficients dépendent de $a$, et la même égalité, lue « dans l'autre variable », exprime chaque $\psi_{b}$ à l'aide de ces $d$ coefficients.

    Supposons $\dim F = d$. Parmi les familles libres formées de fonctions $\varphi_{a}$, il en existe une de cardinal maximal, au plus $d$, soit $(\varphi_{a_{1}}, \dots, \varphi_{a_{m}})$. Par maximalité, tout $\varphi_{a}$ est combinaison de ces fonctions (proposition 8 du chapitre 14) ; elles engendrent donc $F$, et $m = d$. Pour tout $a$, il existe des réels $c_{1}(a), \dots, c_{d}(a)$ tels que 
    $$\forall x \in \mathbb{R}, \quad f(a, x) = \sum_{i = 1}^{d} c_{i}(a)\,f(a_{i}, x).$$
     On obtient ainsi des fonctions $c_{1}, \dots, c_{d}$ de $\mathbb{R}$ dans $\mathbb{R}$. Pour $b \in \mathbb{R}$ fixé et tout $a$, l'égalité en $x = b$ s'écrit 
    $$\psi_{b}(a) = f(a, b) = \sum_{i = 1}^{d} \varphi_{a_{i}}(b)\,c_{i}(a), \qquad\text{soit}\qquad \psi_{b} = \sum_{i = 1}^{d} \varphi_{a_{i}}(b)\,c_{i}.$$
     Toutes les fonctions $\psi_{b}$ appartiennent à $\mathrm{Vect}(c_{1}, \dots, c_{d})$, donc $G$ est de dimension finie au plus $d$. Le rôle des deux variables étant symétrique, $\dim F \leqslant \dim G$ dès que $G$ est de dimension finie. 
    $$\boxed{\dim F = \dim G}$$
     Pour une fonction $f$ définie sur un produit d'ensembles finis, c'est l'égalité du rang des lignes et du rang des colonnes d'un tableau, que le chapitre 16 retrouvera pour les matrices.
