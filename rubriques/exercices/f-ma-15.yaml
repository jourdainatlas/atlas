  enonce: |
    *Inégalité de Frobenius.* Soit $u$, $v$, $w$ trois endomorphismes d'un espace de dimension finie. Montrer que 
    $$\mathrm{rg}(u \circ v) + \mathrm{rg}(v \circ w) \leqslant \mathrm{rg}(v) + \mathrm{rg}(u \circ v \circ w).$$
  corrige: |
    *Idée.* On réécrit l'inégalité $\mathrm{rg}(vw) - \mathrm{rg}(uvw) \leqslant \mathrm{rg}(v) - \mathrm{rg}(uv)$ : elle compare la perte de rang causée par $u$ sur deux sous-espaces emboîtés, que l'exercice 34 mesure exactement.

    L'exercice 34, question 2, appliqué à $u$ après $v \circ w$, puis à $u$ après $v$, donne 
    $$\mathrm{rg}(vw) - \mathrm{rg}(uvw) = \dim(\operatorname{Im} vw \cap \mathrm{Ker}\, u), \qquad \mathrm{rg}(v) - \mathrm{rg}(uv) = \dim(\operatorname{Im} v \cap \mathrm{Ker}\, u).$$
     Comme $\operatorname{Im}(v \circ w) \subset \operatorname{Im} v$, la première dimension est inférieure à la seconde. 
    $$\boxed{\mathrm{rg}(u \circ v) + \mathrm{rg}(v \circ w) \leqslant \mathrm{rg}(v) + \mathrm{rg}(u \circ v \circ w)}$$
     Avec $v = \mathrm{id}_{E}$, on retrouve l'inégalité de Sylvester $\mathrm{rg} u + \mathrm{rg} w - \dim E \leqslant \mathrm{rg}(u \circ w)$.
- id: "ma-15-57"
  feuille: "f-ma-15"
  numero: 57
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [dimension, formule de Grassmann]
  noeuds: [v-dimension]
  notions: [dimension]
  page_enonce: 11
  page_corrige: 20
  enonce: |
    Avec les notations de l'exercice 52, on suppose $\dim E = 2r$. Montrer que les triplets $(F_{1}, F_{2}, F_{3})$ de sous-espaces de dimension $r$ tels que $F_{i} \cap F_{j} = \{0\}$ pour $i \neq j$ sont tous équivalents entre eux.
  corrige: |
    *Idée.* On ramène tout triplet à une forme standard : $F_{1}$, $F_{2}$ et le graphe d'un isomorphisme de $F_{1}$ sur $F_{2}$.

    Comme $F_{1} \cap F_{2} = \{0\}$ et $\dim F_{1} + \dim F_{2} = 2r$, on a $E = F_{1} \oplus F_{2}$. De même, $F_{3}$ est un supplémentaire de $F_{2}$, donc, par l'exercice 72 du chapitre 14, le graphe $\{x + \theta(x) \mid x \in F_{1}\}$ d'une application linéaire $\theta : F_{1} \to F_{2}$. Si $\theta(x) = 0$, alors $x \in F_{3} \cap F_{1} = \{0\}$ : $\theta$ est injective, donc un isomorphisme, les dimensions étant égales. Soit $(e_{1}, \dots, e_{r})$ une base de $F_{1}$. Alors $(\theta(e_{i}))$ est une base de $F_{2}$ (proposition 6), $(e_{i}, \theta(e_{i}))$ une base de $E$, et $(e_{i} + \theta(e_{i}))$ une base de $F_{3}$.

    Pour un second triplet, on obtient de même $\theta'$ et une base $(e_{i}')$ de $F_{1}'$. L'automorphisme $\varphi$ défini par $\varphi(e_{i}) = e_{i}'$ et $\varphi(\theta(e_{i})) = \theta'(e_{i}')$ envoie une base sur une base ; il envoie $F_{1}$ sur $F_{1}'$, $F_{2}$ sur $F_{2}'$, et $e_{i} + \theta(e_{i})$ sur $e_{i}' + \theta'(e_{i}')$, donc $F_{3}$ sur $F_{3}'$. 
    $$\boxed{\text{Tous ces triplets sont équivalents.}}$$
     Ce n'est plus vrai pour quatre sous-espaces : dans $\mathbb{R}^{2}$, quatre droites distinctes ne sont pas toujours équivalentes, car leur birapport est un invariant.
