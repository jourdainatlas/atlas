  enonce: |
    Soit $E$ un $\mathbb{R}$-espace vectoriel de dimension finie et $f \in \mathcal{L}(E)$.

    **1.** Montrer que, si $\mathrm{Ker}\, f = \operatorname{Im} f$, la dimension de $E$ est paire.

    **2.** Montrer que $\operatorname{Im} f = \mathrm{Ker}\, f$ si et seulement si $f^{2} = 0$ et s'il existe $h \in \mathcal{L}(E)$ tel que 
    $$h \circ f + f \circ h = \mathrm{id}_{E}.$$
  corrige: |
    **1.** Le théorème du rang donne $\dim E = \dim\mathrm{Ker}\, f + \mathrm{rg} f = 2\mathrm{rg} f$.

    **2.** *Sens direct.* L'égalité $\operatorname{Im} f = \mathrm{Ker}\, f$ entraîne $f^{2} = 0$. Soit $S$ un supplémentaire de $\mathrm{Ker}\, f$ ; la restriction $f_{|S}$ est un isomorphisme de $S$ sur $\operatorname{Im} f = \mathrm{Ker}\, f$ (théorème 8), de réciproque $\sigma$. On définit $h$ par $h = \sigma$ sur $\mathrm{Ker}\, f$ et $h = 0$ sur $S$. Pour $x \in S$, $h(f(x)) + f(h(x)) = \sigma(f(x)) + 0 = x$ ; pour $x \in \mathrm{Ker}\, f$, $h(f(x)) + f(h(x)) = 0 + f(\sigma(x)) = x$. Les deux endomorphismes coïncident sur $\mathrm{Ker}\, f$ et sur $S$, donc $h \circ f + f \circ h = \mathrm{id}_{E}$.

    *Sens réciproque.* L'égalité $f^{2} = 0$ donne $\operatorname{Im} f \subset \mathrm{Ker}\, f$. Pour $x \in \mathrm{Ker}\, f$, on a $x = h(f(x)) + f(h(x))$, soit $x = f(h(x))$, et $x \in \operatorname{Im} f$. 
    $$\boxed{\operatorname{Im} f = \mathrm{Ker}\, f \iff f^{2} = 0 \text{ et } \exists\, h, \ h \circ f + f \circ h = \mathrm{id}_{E}}$$
