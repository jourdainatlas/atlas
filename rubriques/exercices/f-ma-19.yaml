  mots_cles: [projection orthogonale, normes, moindres carrés, matrices et produit scalaire]
  noeuds: [fq-orthogonalite, me-produit-scalaire, v-matrices]
  notions: [projection-orthogonale, norme, produit-scalaire]
  page_enonce: 11
  page_corrige: 39
  enonce: |
    *Méthode des moindres carrés.* Soit $p \leqslant n$ deux entiers, $A \in \mathcal{M}_{n,p}(\mathbb{R})$ une matrice de rang $p$ et $B \in \mathcal{M}_{n,1}(\mathbb{R})$.

    **1.** Montrer qu'il existe un unique $X_{0} \in \mathcal{M}_{p,1}(\mathbb{R})$ tel que 
    $$\lVert AX_{0} - B \rVert = \inf\big\{\lVert AX - B \rVert \;\big|\; X \in \mathcal{M}_{p,1}(\mathbb{R})\big\}.$$

    **2.** Montrer que $X_{0}$ est l'unique solution du système ${A}^{T}AX = {A}^{T}B$.

    **3.** Application : calculer $\inf\big\{(x + y - 1)^{2} + (x - y)^{2} + (2x + y + 2)^{2} \;\big|\; (x, y) \in \mathbb{R}^{2}\big\}$.
  corrige: |
    On munit $\mathcal{M}_{n,1}(\mathbb{R})$ du produit scalaire canonique.

    **1.** L'ensemble $F = \mathrm{Im}\, A = \{AX \mid X \in \mathcal{M}_{p,1}(\mathbb{R})\}$ est un sous-espace de $\mathcal{M}_{n,1}(\mathbb{R})$, de dimension finie $\mathrm{rg} A = p$. Par le théorème 7, la borne inférieure des $\lVert Y - B \rVert$, pour $Y \in F$, est atteinte en un unique $Y_{0} = p_{F}(B)$. Par le théorème du rang, $\dim\mathrm{Ker}\, A = p - \mathrm{rg} A = 0$ : l'application $X \mapsto AX$ est injective, et il existe un unique $X_{0}$ tel que $AX_{0} = Y_{0}$. Ce $X_{0}$ convient ; si $X_{1}$ convient aussi, $AX_{1}$ réalise le minimum sur $F$, donc $AX_{1} = Y_{0} = AX_{0}$, et $X_{1} = X_{0}$ par injectivité. 
    $$\boxed{\text{il existe un unique } X_{0} \text{ réalisant } \lVert AX_{0} - B \rVert = d(B, \mathrm{Im}\, A)}$$

    **2.** La démonstration de la question 1 de l'exercice 44 n'utilise pas que $A$ est carrée : pour $A \in \mathcal{M}_{n,p}(\mathbb{R})$, on a encore $(\mathrm{Im}\, A)^{\perp} = \mathrm{Ker}\,({A}^{T})$. Par la proposition 10 (ii), $AX_{0} = p_{F}(B)$ équivaut à $B - AX_{0} \in F^{\perp}$, donc à 
    $${A}^{T}(B - AX_{0}) = 0, \qquad\text{soit}\qquad \boxed{{A}^{T}AX_{0} = {A}^{T}B}$$
     Ce sont les équations normales de la méthode du cours. La matrice ${A}^{T}A \in \mathcal{M}_{p}(\mathbb{R})$ est inversible : la question 2 de l'exercice 44, dont la démonstration vaut aussi pour une matrice rectangulaire, donne $\mathrm{Ker}\,({A}^{T}A) = \mathrm{Ker}\, A = \{0\}$. Le système a donc une unique solution, qui est $X_{0}$.

    **3.** La quantité à minimiser est $\lVert AX - B \rVert^{2}$, avec 
    $$A = \begin{pmatrix} 1 & 1 \\ 1 & -1 \\ 2 & 1 \end{pmatrix}, \qquad B = \begin{pmatrix} 1 \\ 0 \\ -2 \end{pmatrix}, \qquad X = \begin{pmatrix} x \\ y \end{pmatrix}.$$
     Les deux colonnes de $A$ ne sont pas colinéaires, donc $\mathrm{rg} A = 2$. On calcule 
    $${A}^{T}A = \begin{pmatrix} 6 & 2 \\ 2 & 3 \end{pmatrix}, \qquad {A}^{T}B = \begin{pmatrix} -3 \\ -1 \end{pmatrix}, \qquad \left\{ \begin{array}{l} 6x + 2y = -3 \\ 2x + 3y = -1 \end{array} \right.$$
     Le déterminant du système vaut $14$, et l'on trouve $X_{0} = \big(-\frac{1}{2}, 0\big)$. Le résidu $R = B - AX_{0} = \big(\frac{3}{2}, \frac{1}{2}, -1\big)$ est orthogonal aux deux colonnes de $A$, puisque $\frac{3}{2} + \frac{1}{2} - 2 = 0$ et $\frac{3}{2} - \frac{1}{2} - 1 = 0$ ✓. Le minimum vaut $\lVert R \rVert^{2}$ : 
    $$\boxed{\inf_{(x, y) \in \mathbb{R}^{2}} \big((x + y - 1)^{2} + (x - y)^{2} + (2x + y + 2)^{2}\big) = \frac{9}{4} + \frac{1}{4} + 1 = \frac{7}{2}, \quad \text{atteint en } \Big(-\frac{1}{2}, 0\Big)}$$
     On retrouve la même valeur en remplaçant directement : $\big(-\frac{3}{2}\big)^{2} + \big(-\frac{1}{2}\big)^{2} + 1^{2} = \frac{7}{2}$ ✓. Le système $AX = B$ de trois équations à deux inconnues n'a pas de solution ; $X_{0}$ est celle qui « s'en approche le plus » au sens des moindres carrés.

    *À retenir.* La proposition 14 du cours est le cas particulier où $A$ a pour colonnes $(x_{i})$ et $(1, \dots, 1)$, et où $X = (a, b)$. L'hypothèse « abscisses non toutes égales » y est exactement l'hypothèse $\mathrm{rg} A = 2$.
- id: "ma-19-46"
  feuille: "f-ma-19"
  numero: 46
  partie: "Projection orthogonale sur un sous-espace de dimension finie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [projection orthogonale, orthogonalité, matrices et produit scalaire]
  noeuds: [fq-orthogonalite, me-produit-scalaire, v-matrices]
  notions: [projection-orthogonale, vecteurs-orthogonaux, produit-scalaire]
  page_enonce: 11
  page_corrige: 40
  enonce: |
    Soit $A_{1}$, …, $A_{p}$ des matrices de $\mathcal{M}_{n}(\mathbb{R})$ telles que 
    $$\sum_{k = 1}^{p} A_{k} = I_{n} \qquad\text{et}\qquad {A_{i}}^{T}A_{j} = 0 \quad\text{pour tous } i \neq j.$$

    **1.** Montrer que chaque $A_{i}$ est un projecteur orthogonal, au sens de l'exercice 41.

    **2.** Montrer que $\displaystyle\sum_{k = 1}^{p} \mathrm{rg}(A_{k}) = n$.
  corrige: |
    **1.** Soit $i$ fixé. On multiplie à gauche l'égalité $\sum_{j} A_{j} = I_{n}$ par ${A_{i}}^{T}$ ; tous les termes ${A_{i}}^{T}A_{j}$ avec $j \neq i$ sont nuls, et il reste 
    $${A_{i}}^{T} = {A_{i}}^{T}A_{i}.$$
     Le second membre est une matrice symétrique, puisque ${({A_{i}}^{T}A_{i})}^{T} = {A_{i}}^{T}A_{i}$. En transposant, on obtient $A_{i} = {A_{i}}^{T}A_{i} = {A_{i}}^{T}$ : la matrice $A_{i}$ est symétrique, et l'égalité devient $A_{i} = A_{i}^{2}$. Ainsi $A_{i}$ est un projecteur, de matrice symétrique, donc un projecteur orthogonal par la question 1 de l'exercice 42. 
    $$\boxed{A_{i}^{2} = A_{i} = {A_{i}}^{T} : \ A_{i} \text{ est un projecteur orthogonal}}$$

    **2.** La trace d'un projecteur est égale à son rang (chapitre 16, proposition 15), et la trace est linéaire : 
    $$\sum_{k = 1}^{p} \mathrm{rg}(A_{k}) = \sum_{k = 1}^{p} \operatorname{tr}(A_{k}) = \operatorname{tr}\Big(\sum_{k = 1}^{p} A_{k}\Big) = \operatorname{tr}(I_{n}), \qquad\text{d'où}\qquad \boxed{\sum_{k = 1}^{p} \mathrm{rg}(A_{k}) = n}$$
     Pour $n = 3$, $A_{1} = \frac{1}{3}J$, où $J$ est la matrice dont tous les coefficients valent $1$, et $A_{2} = I_{3} - \frac{1}{3}J$, on a $J^{2} = 3J$, donc ${A_{1}}^{T}A_{2} = \frac{1}{3}J - \frac{1}{9}J^{2} = 0$, et les rangs valent $1$ et $2$ ✓ : $A_{1}$ projette sur la droite $\mathrm{Vect}\big((1, 1, 1)\big)$, $A_{2}$ sur le plan orthogonal.

    *Piège.* Les transposées de l'hypothèse sont essentielles. Avec seulement $A_{i}A_{j} = 0$ pour $i \neq j$, on obtient encore des projecteurs, mais pas forcément orthogonaux : pour le projecteur oblique $p$ de l'exercice 41 et $q = I_{2} - p$, on a $pq = qp = 0$, mais 
    $$p = \begin{pmatrix} 1 & -1 \\ 0 & 0 \end{pmatrix}, \qquad q = \begin{pmatrix} 0 & 1 \\ 0 & 1 \end{pmatrix}, \qquad {p}^{T}q = \begin{pmatrix} 0 & 1 \\ 0 & -1 \end{pmatrix} \neq 0.$$

    *À retenir.* L'hypothèse dit que $\langle A_{i}X, A_{j}Y \rangle = {X}^{T}{A_{i}}^{T}A_{j}Y = 0$ : les images des $A_{k}$ sont deux à deux orthogonales, et $X = \sum_{k} A_{k}X$ décompose tout vecteur sur elles. L'espace est ainsi coupé en sous-espaces deux à deux orthogonaux, et la question 2 en est la traduction dimensionnelle, comme le théorème 6 pour deux morceaux.
- id: "ma-19-47"
  feuille: "f-ma-19"
  numero: 47
  partie: "Projection orthogonale sur un sous-espace de dimension finie"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [projection orthogonale, produits scalaires, bases orthonormées, matrices et produit scalaire, matrices de Gram]
  noeuds: [fq-orthogonalite, me-produit-scalaire, fq-bases-orthogonales, v-matrices, v-det-matrice]
  notions: [projection-orthogonale, produit-scalaire, base-orthogonale]
  page_enonce: 11
  page_corrige: 40
  enonce: |
    *Déterminants de Gram.* Soit $E$ un espace préhilbertien réel. Pour une famille $(u_{1}, \dots, u_{p})$ de vecteurs de $E$, on note $G(u_{1}, \dots, u_{p}) = \det\big(\langle u_{i}, u_{j} \rangle\big)_{1 \leqslant i, j \leqslant p}$ son déterminant de Gram.

    **1.** Justifier qu'il existe une famille orthonormée $\mathcal{B} = (e_{1}, \dots, e_{m})$ de $E$ telle que $\mathrm{Vect}(e_{1}, \dots, e_{m})$ contienne $u_{1}$, …, $u_{p}$. On note $M \in \mathcal{M}_{m,p}(\mathbb{R})$ la matrice des coordonnées des $u_{j}$ dans $\mathcal{B}$. Exprimer les coefficients de $M$ à l'aide de produits scalaires, et montrer que ${M}^{T}M = \big(\langle u_{i}, u_{j} \rangle\big)_{i, j}$.

    **2.** Montrer que $G(u_{1}, \dots, u_{p}) \neq 0$ si et seulement si la famille $(u_{1}, \dots, u_{p})$ est libre.

    **3.** Montrer que $G(u_{1}, \dots, u_{p}) \geqslant 0$.

    **4.** On suppose la famille $(u_{1}, \dots, u_{p})$ libre, et l'on note $F = \mathrm{Vect}(u_{1}, \dots, u_{p})$. Montrer que, pour tout $x \in E$, 
    $$d(x, F)^{2} = \frac{G(x, u_{1}, \dots, u_{p})}{G(u_{1}, \dots, u_{p})}.$$

    **5.** Retrouver ainsi la borne inférieure (a) de l'exercice 35.
  corrige: |
    Si tous les $u_{i}$ sont nuls, la matrice de Gram est nulle, la famille est liée, et les questions 1 à 3 sont immédiates ; on écarte ce cas.

    **1.** Le sous-espace $F = \mathrm{Vect}(u_{1}, \dots, u_{p})$ est de dimension finie $m \geqslant 1$. Muni de la restriction du produit scalaire, c'est un espace euclidien ; il possède une base orthonormée $\mathcal{B} = (e_{1}, \dots, e_{m})$ par le théorème 5, et $\mathrm{Vect}(e_{1}, \dots, e_{m}) = F$ contient les $u_{j}$. Par la proposition 8 appliquée dans $F$, la coordonnée d'indice $k$ de $u_{j}$ est $\langle u_{j}, e_{k} \rangle$ : 
    $$\boxed{M = \big(\langle u_{j}, e_{k} \rangle\big)_{1 \leqslant k \leqslant m,\ 1 \leqslant j \leqslant p}}$$
     Le coefficient d'indice $(i, j)$ de ${M}^{T}M$ est le produit de la colonne $i$ de $M$ par sa colonne $j$, c'est-à-dire $\sum_{k} \langle u_{i}, e_{k} \rangle\langle u_{j}, e_{k} \rangle$, qui vaut $\langle u_{i}, u_{j} \rangle$ par la proposition 8 : 
    $$\boxed{{M}^{T}M = \big(\langle u_{i}, u_{j} \rangle\big)_{1 \leqslant i, j \leqslant p}}$$
     C'est la proposition 9 (i), dans le sous-espace $F$ au lieu de l'espace entier.

    **2.** On note $\Gamma = {M}^{T}M$. Pour une colonne $X = (x_{j}) \in \mathcal{M}_{p,1}(\mathbb{R})$, la colonne $MX$ est celle des coordonnées dans $\mathcal{B}$ du vecteur $v = \sum_{j} x_{j}u_{j}$, et la proposition 8 donne 
    $${X}^{T}\Gamma X = {(MX)}^{T}(MX) = \lVert v \rVert^{2}.$$
     Si la famille est libre et si $\Gamma X = 0$, alors $\lVert v \rVert^{2} = 0$, donc $v = 0$, et $X = 0$ : la matrice $\Gamma$ est injective, donc inversible, et $G(u_{1}, \dots, u_{p}) = \det\Gamma \neq 0$ (chapitre 17, théorème 6 (ii)). Si la famille est liée, il existe $X \neq 0$ tel que $v = 0$, donc $MX = 0$ et $\Gamma X = 0$ : la matrice $\Gamma$ n'est pas inversible, et son déterminant est nul. 
    $$\boxed{G(u_{1}, \dots, u_{p}) \neq 0 \iff (u_{1}, \dots, u_{p}) \text{ est libre}}$$

    **3.** Si la famille est liée, $G = 0$. Si elle est libre, c'est une base de $F$, donc $m = p$ : la matrice $M$ est carrée, et le chapitre 17 (théorème 6 (i) et (iv)) donne 
    $$G(u_{1}, \dots, u_{p}) = \det({M}^{T})\det(M) = (\det M)^{2}, \qquad\text{d'où}\qquad \boxed{G(u_{1}, \dots, u_{p}) \geqslant 0}$$
     avec inégalité stricte pour une famille libre. Pour $p = 2$, l'inégalité s'écrit $\lVert u_{1} \rVert^{2}\lVert u_{2} \rVert^{2} - \langle u_{1}, u_{2} \rangle^{2} \geqslant 0$, et la question 2 en donne le cas d'égalité : c'est l'inégalité de Cauchy-Schwarz (théorème 1), dont le déterminant de Gram est une généralisation.

    **4.** On décompose $x = y + h$, avec $y = p_{F}(x) \in F$ et $h = x - p_{F}(x) \in F^{\perp}$, de sorte que $\lVert h \rVert = d(x, F)$ par le théorème 7. Comme $h$ est orthogonal aux $u_{j}$, on a $\langle x, u_{j} \rangle = \langle y, u_{j} \rangle$ pour tout $j$, et, par Pythagore, $\langle x, x \rangle = \lVert y \rVert^{2} + \lVert h \rVert^{2}$. Les matrices de Gram des familles $(x, u_{1}, \dots, u_{p})$ et $(y, u_{1}, \dots, u_{p})$ ne diffèrent donc que par leur coefficient d'indice $(1, 1)$, et 
    $$\big(\langle \cdot, \cdot \rangle\big)_{(x, u_{1}, \dots, u_{p})} = \big(\langle \cdot, \cdot \rangle\big)_{(y, u_{1}, \dots, u_{p})} + \lVert h \rVert^{2}E_{11}.$$
     Le déterminant est linéaire par rapport à la première colonne (chapitre 17, proposition 9 (i)). La matrice obtenue en remplaçant la première colonne par $\lVert h \rVert^{2}E_{1}$ se développe selon cette colonne (chapitre 17, théorème 7) en $\lVert h \rVert^{2}G(u_{1}, \dots, u_{p})$, le mineur restant étant la matrice de Gram des $u_{j}$. D'autre part, $y \in F$, donc la famille $(y, u_{1}, \dots, u_{p})$ est liée et son déterminant de Gram est nul par la question 2. Il reste 
    $$G(x, u_{1}, \dots, u_{p}) = 0 + d(x, F)^{2}\,G(u_{1}, \dots, u_{p}), \qquad\text{d'où}\qquad \boxed{d(x, F)^{2} = \frac{G(x, u_{1}, \dots, u_{p})}{G(u_{1}, \dots, u_{p})}}$$
     puisque $G(u_{1}, \dots, u_{p}) \neq 0$ par la question 2. On a contrôlé la formule sur un exemple aléatoire dans $\mathbb{R}^{4}$, avec $p = 2$ ✓.

    **5.** L'exercice 35 (a) demande la borne inférieure de $\int_{0}^{1}\big(t - a\sqrt{t} - b\big)^{2}\,\mathrm{d} t = \lVert t - a\sqrt{t} - b \rVert^{2}$ dans $\mathcal{C}([0\,,1], \mathbb{R})$, muni de $\langle f, g \rangle = \int_{0}^{1} fg$ : c'est $d(x, F)^{2}$, avec $x = t$ et $F = \mathrm{Vect}(\sqrt{t}, 1)$. Les produits scalaires sont des intégrales de fonctions puissances, que l'on calcule par leurs primitives (chapitre 6) : $\int_{0}^{1} t^{\alpha}\,\mathrm{d} t = \frac{1}{\alpha + 1}$ pour $\alpha \geqslant 0$. On trouve $\lVert \sqrt{t} \rVert^{2} = \frac{1}{2}$, $\langle \sqrt{t}, 1 \rangle = \frac{2}{3}$, $\lVert 1 \rVert^{2} = 1$, $\lVert t \rVert^{2} = \frac{1}{3}$, $\langle t, \sqrt{t} \rangle = \frac{2}{5}$ et $\langle t, 1 \rangle = \frac{1}{2}$, d'où 
    $$G(\sqrt{t}, 1) = \begin{vmatrix} \frac{1}{2} & \frac{2}{3} \\[2pt] \frac{2}{3} & 1 \end{vmatrix} = \frac{1}{18}, \qquad G(t, \sqrt{t}, 1) = \begin{vmatrix} \frac{1}{3} & \frac{2}{5} & \frac{1}{2} \\[2pt] \frac{2}{5} & \frac{1}{2} & \frac{2}{3} \\[2pt] \frac{1}{2} & \frac{2}{3} & 1 \end{vmatrix} = \frac{1}{5400}.$$
     La famille $(\sqrt{t}, 1)$ est libre, puisque $G(\sqrt{t}, 1) \neq 0$, et la question 4 donne 
    $$\boxed{\inf_{(a, b) \in \mathbb{R}^{2}} \int_{0}^{1}\big(t - a\sqrt{t} - b\big)^{2}\,\mathrm{d} t = \frac{1/5400}{1/18} = \frac{1}{300}}$$
     C'est la valeur trouvée à l'exercice 35, sans avoir à résoudre les équations normales ✓. En revanche, la formule ne dit pas en quel point le minimum est atteint ; les équations normales donnent $a = \frac{6}{5}$ et $b = -\frac{3}{10}$.

    *À retenir.* Le chapitre 17 interprétait un déterminant comme un volume, et la remarque qui suit la proposition 9 en déduit que $\sqrt{G(u_{1}, \dots, u_{p})}$ est le volume du parallélotope construit sur les $u_{j}$. La formule de la question 4 s'écrit alors « volume $=$ base $\times$ hauteur » : le volume construit sur $(x, u_{1}, \dots, u_{p})$ est celui de la base construite sur les $u_{j}$, multiplié par la hauteur $d(x, F)$.
- id: "ma-19-48"
  feuille: "f-ma-19"
  numero: 48
  partie: "Projection orthogonale sur un sous-espace de dimension finie"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [projection orthogonale, produits scalaires, orthogonalité, produits scalaires intégraux]
  noeuds: [fq-orthogonalite, me-produit-scalaire, ri-proprietes]
  notions: [projection-orthogonale, produit-scalaire, vecteurs-orthogonaux, derivee-successive]
  page_enonce: 12
  page_corrige: 42
  enonce: |
    On note $E = \mathcal{C}^{1}([0\,,1], \mathbb{R})$.

    **1.** Montrer que la formule $\displaystyle\langle f, g \rangle = \int_{0}^{1} \big(f(t)g(t) + f'(t)g'(t)\big)\,\mathrm{d} t$ définit un produit scalaire sur $E$.

    **2.** On pose $F = \{f \in \mathcal{C}^{2}([0\,,1], \mathbb{R}) \mid f'' = f\}$. Montrer que $F$ est un sous-espace de dimension $2$ de $E$, et que 
    $$F^{\perp} = \{f \in E \mid f(0) = f(1) = 0\}.$$

    **3.** Déterminer une expression explicite de la projection orthogonale $p_{F}(f)$ d'une fonction $f \in E$, à l'aide de $f(0)$, de $f(1)$ et des fonctions $\operatorname{sh}$.

    **4.** Soit $\alpha$, $\beta \in \mathbb{R}$, et $E_{\alpha, \beta} = \{f \in E \mid f(0) = \alpha \text{ et } f(1) = \beta\}$. Montrer que 
    $$\inf_{f \in E_{\alpha, \beta}} \int_{0}^{1} \big(f(t)^{2} + f'(t)^{2}\big)\,\mathrm{d} t = \frac{(\alpha^{2} + \beta^{2})\operatorname{ch} 1 - 2\alpha\beta}{\operatorname{sh} 1},$$
     et que cette borne inférieure est atteinte en une unique fonction, que l'on précisera.
  corrige: |
    **1.** L'application est symétrique, et linéaire par rapport à $f$, par linéarité de la dérivation et de l'intégrale. Pour $f \in E$, la fonction $f^{2} + f'^{2}$ est continue et positive, donc $\langle f, f \rangle \geqslant 0$. Si $\langle f, f \rangle = 0$, le théorème 4 du chapitre 18 montre que $f^{2} + f'^{2}$ est nulle sur $[0\,,1]$, donc $f = 0$. 
    $$\boxed{\langle f, g \rangle = \int_{0}^{1} (fg + f'g') \text{ est un produit scalaire sur } \mathcal{C}^{1}([0\,,1], \mathbb{R})}$$

    **2.** L'équation $y'' - y = 0$ est linéaire, homogène, à coefficients constants, d'équation caractéristique $r^{2} - 1 = 0$, de racines $\pm 1$ (chapitre 6, théorème 5) : ses solutions sont les fonctions $\lambda\mathrm{e}^{t} + \mu\mathrm{e}^{-t}$, c'est-à-dire les combinaisons linéaires de $\operatorname{ch}$ et $\operatorname{sh}$. Ainsi $F = \mathrm{Vect}(\operatorname{ch}, \operatorname{sh})$ est un sous-espace de $E$, et la famille $(\operatorname{ch}, \operatorname{sh})$ est libre : si $a\operatorname{ch} + b\operatorname{sh} = 0$, l'évaluation en $0$ donne $a = 0$, puis celle en $1$ donne $b = 0$. Donc $\boxed{\dim F = 2}$, ce que donnait aussi la proposition 1 (ii) du chapitre 15.

    Soit $f \in E$ et $g \in F$. On intègre par parties $\int_{0}^{1} f'g'$, en primitivant $f'$ et en dérivant $g'$, qui est de classe $\mathcal{C}^{1}$ puisque $g'' = g$ (chapitre 6, proposition 4) : 
    $$\int_{0}^{1} f'g' = \big[fg'\big]_{0}^{1} - \int_{0}^{1} fg'' = f(1)g'(1) - f(0)g'(0) - \int_{0}^{1} fg, \qquad\text{d'où}\qquad \boxed{\langle f, g \rangle = f(1)g'(1) - f(0)g'(0)}$$
     Si $f(0) = f(1) = 0$, ce produit est nul pour tout $g \in F$, et $f \in F^{\perp}$. Réciproquement, si $f \in F^{\perp}$, le choix $g = \operatorname{ch}$, avec $g' = \operatorname{sh}$ et $\operatorname{sh} 0 = 0$, donne $f(1)\operatorname{sh} 1 = 0$, donc $f(1) = 0$ ; le choix $g = \operatorname{sh}$, avec $g' = \operatorname{ch}$, donne alors $-f(0) = 0$. 
    $$\boxed{F^{\perp} = \{f \in E \mid f(0) = f(1) = 0\}}$$

    **3.** Par la proposition 10 (ii), $p_{F}(f)$ est l'unique $g \in F$ tel que $f - g \in F^{\perp}$, c'est-à-dire tel que $g(0) = f(0)$ et $g(1) = f(1)$. La fonction $t \mapsto \operatorname{sh}(1 - t) = \operatorname{sh} 1\,\operatorname{ch} t - \operatorname{ch} 1\,\operatorname{sh} t$ appartient à $F$, s'annule en $1$ et vaut $\operatorname{sh} 1$ en $0$ ; la fonction $\operatorname{sh}$ s'annule en $0$ et vaut $\operatorname{sh} 1$ en $1$. On en déduit 
    $$\boxed{p_{F}(f)(t) = \frac{f(0)\,\operatorname{sh}(1 - t) + f(1)\,\operatorname{sh} t}{\operatorname{sh} 1}}$$
     La projection orthogonale sur $F$ remplace $f$ par l'unique solution de $y'' = y$ qui a les mêmes valeurs aux deux bords.

    **4.** Soit $g_{\alpha, \beta} = \frac{\alpha\,\operatorname{sh}(1 - t) + \beta\,\operatorname{sh} t}{\operatorname{sh} 1}$, qui appartient à $F \cap E_{\alpha, \beta}$. Pour toute $f \in E_{\alpha, \beta}$, la question 3 donne $p_{F}(f) = g_{\alpha, \beta}$, et le théorème de Pythagore, appliqué à $g_{\alpha, \beta} \in F$ et $f - g_{\alpha, \beta} \in F^{\perp}$, donne 
    $$\int_{0}^{1}\big(f^{2} + f'^{2}\big) = \lVert f \rVert^{2} = \lVert g_{\alpha, \beta} \rVert^{2} + \lVert f - g_{\alpha, \beta} \rVert^{2} \geqslant \lVert g_{\alpha, \beta} \rVert^{2},$$
     avec égalité si et seulement si $f = g_{\alpha, \beta}$. La borne inférieure est donc un minimum, atteint en la seule fonction $g_{\alpha, \beta}$. Pour le calculer, on applique la formule de la question 2 avec $f = g = g_{\alpha, \beta}$, après avoir dérivé : 
    $$g_{\alpha, \beta}'(t) = \frac{-\alpha\,\operatorname{ch}(1 - t) + \beta\,\operatorname{ch} t}{\operatorname{sh} 1}, \qquad g_{\alpha, \beta}'(0) = \frac{\beta - \alpha\operatorname{ch} 1}{\operatorname{sh} 1}, \qquad g_{\alpha, \beta}'(1) = \frac{\beta\operatorname{ch} 1 - \alpha}{\operatorname{sh} 1},$$

    $$\lVert g_{\alpha, \beta} \rVert^{2} = \beta\,\frac{\beta\operatorname{ch} 1 - \alpha}{\operatorname{sh} 1} - \alpha\,\frac{\beta - \alpha\operatorname{ch} 1}{\operatorname{sh} 1}, \qquad \boxed{\inf_{f \in E_{\alpha, \beta}} \int_{0}^{1}\big(f^{2} + f'^{2}\big) = \frac{(\alpha^{2} + \beta^{2})\operatorname{ch} 1 - 2\alpha\beta}{\operatorname{sh} 1}}$$
     atteinte seulement en $g_{\alpha, \beta}$. On a contrôlé cette valeur par un calcul direct de l'intégrale pour quatre couples $(\alpha, \beta)$ ✓.

    ![Figure](documents/figures/4f3138d1cd2d540d.svg)

    Pour $\alpha = \beta = 1$, en bleu, la fonction optimale est $g_{1, 1}(t) = \frac{\operatorname{ch}(t - 1/2)}{\operatorname{ch}(1/2)}$ : elle descend jusqu'à $\frac{1}{\operatorname{ch}(1/2)} \approx 0{,}887$ au milieu, et le minimum vaut $\frac{2(\operatorname{ch} 1 - 1)}{\operatorname{sh} 1} = 2\,\mathrm{th}\,\frac{1}{2} \approx 0{,}924$, plus petit que la valeur $1$ obtenue pour la fonction constante, en gris. En descendant un peu au milieu, elle gagne plus sur $\int f^{2}$ qu'elle ne perd sur $\int f'^{2}$, qui n'est plus nul mais reste petit. Pour $\alpha = 1$ et $\beta = 0$, en rouge, la fonction optimale $g_{1, 0}(t) = \frac{\operatorname{sh}(1 - t)}{\operatorname{sh} 1}$ est très proche de la droite grise $1 - t$, et les deux valeurs le sont aussi : $\frac{\operatorname{ch} 1}{\operatorname{sh} 1} \approx 1{,}313$ contre $\frac{4}{3} \approx 1{,}333$.

    *À retenir.* L'ensemble $E_{\alpha, \beta} = g_{\alpha, \beta} + F^{\perp}$ est un sous-espace affine de direction $F^{\perp}$ (chapitre 14) ; son élément de plus petite norme est celui qui est orthogonal à la direction. C'est la même idée que la distance à un sous-espace, appliquée à $0$ et à un sous-espace affine. Le produit scalaire de la question 1 n'est pas celui de la proposition 2 : il mesure aussi la dérivée, et c'est pourquoi la fonction optimale est une solution d'équation différentielle, et non une fonction affine.
- id: "ma-19-49"
  feuille: "f-ma-19"
  numero: 49
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [produits scalaires, normes, orthogonalité, bases orthonormées, produits scalaires intégraux, matrices de Gram, formes linéaires]
  noeuds: [me-produit-scalaire, fq-orthogonalite, fq-bases-orthogonales, ri-proprietes, v-det-matrice, v-dual]
  notions: [produit-scalaire, norme, vecteurs-orthogonaux, base-orthogonale, forme-lineaire]
  page_enonce: 12
  page_corrige: 43
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par une démonstration ou un contre-exemple. Dans tout l'exercice, $E$ désigne un espace préhilbertien réel.

    **1.** Si trois vecteurs $x$, $y$, $z$ de $E$ vérifient $\lVert x + y + z \rVert^{2} = \lVert x \rVert^{2} + \lVert y \rVert^{2} + \lVert z \rVert^{2}$, alors ils sont deux à deux orthogonaux.

    **2.** Si deux vecteurs $x$ et $y$ ont la même norme, alors $x + y$ et $x - y$ sont orthogonaux.

    **3.** La formule $\displaystyle\langle f, g \rangle = \int_{0}^{1} f(t)g(t)\,\mathrm{d} t$ définit un produit scalaire sur l'espace $\mathcal{C}_{m}([0\,,1], \mathbb{R})$ des fonctions continues par morceaux sur $[0\,,1]$.

    **4.** Si $x \neq 0$ et $\langle x, y \rangle = \lVert x \rVert\,\lVert y \rVert$, alors il existe un réel $\lambda \geqslant 0$ tel que $y = \lambda x$.

    **5.** Pour tous $x$, $y \in E$, $\lVert x + y \rVert\,\lVert x - y \rVert \leqslant \lVert x \rVert^{2} + \lVert y \rVert^{2}$.

    **6.** Si $(e_{1}, e_{2})$ est une famille libre de $E$, l'algorithme de Gram-Schmidt appliqué à $(e_{1}, e_{2})$ et à $(e_{2}, e_{1})$ fournit la même famille orthonormée, à l'ordre des vecteurs près.

    **7.** Si $F \subset G$ sont deux sous-espaces de dimension finie de $E$, alors $p_{F} \circ p_{G} = p_{F}$.

    **8.** Pour tout sous-espace $F$ de $E$, $(F^{\perp})^{\perp} = F$.

    **9.** Si $E$ est euclidien, deux vecteurs non nuls orthogonaux à un même hyperplan de $E$ sont colinéaires.

    **10.** Si un vecteur $x$ est orthogonal à tous les vecteurs d'une famille génératrice de $E$, éventuellement infinie, alors $x = 0$.
  corrige: |
    **1. Faux.** Dans $\mathbb{R}^{2}$ muni du produit canonique, les vecteurs $x = (1, 0)$, $y = (0, 1)$ et $z = (1, -1)$ ont pour somme $(2, 0)$, et $\lVert (2, 0) \rVert^{2} = 4 = 1 + 1 + 2$, alors que $\langle x, z \rangle = 1 \neq 0$. C'est l'exemple de la remarque qui suit le théorème 3 : la somme des doubles produits, ici $0 + 2 - 2$, est nulle sans que chacun le soit. La réciproque du théorème de Pythagore ne vaut que pour deux vecteurs.

    **2. Vrai.** Par bilinéarité et symétrie, $\langle x + y, x - y \rangle = \lVert x \rVert^{2} - \lVert y \rVert^{2} = 0$. Géométriquement, les diagonales d'un losange sont perpendiculaires.

    **3. Faux.** La formule est bilinéaire, symétrique et positive, mais pas définie : l'indicatrice $f$ de $\{0\}$ est continue par morceaux, non nulle, et $\int_{0}^{1} f^{2} = 0$ (chapitre 18, proposition 6). C'est la première remarque qui suit la proposition 2.

    **4. Vrai.** L'égalité entraîne $|\langle x, y \rangle| = \lVert x \rVert\,\lVert y \rVert$, cas d'égalité de l'inégalité de Cauchy-Schwarz (théorème 1) : la famille $(x, y)$ est liée, et comme $x \neq 0$, il existe $\lambda \in \mathbb{R}$ tel que $y = \lambda x$. Alors $\lambda\lVert x \rVert^{2} = \langle x, \lambda x \rangle = \lVert x \rVert\,\lVert \lambda x \rVert = |\lambda|\lVert x \rVert^{2}$, d'où $\lambda = |\lambda| \geqslant 0$. C'est l'argument du cas d'égalité de l'inégalité triangulaire (théorème 2).

    **5. Vrai.** Pour deux réels $a$, $b$, on a $ab \leqslant \frac{a^{2} + b^{2}}{2}$, puisque $(a - b)^{2} \geqslant 0$. Avec $a = \lVert x + y \rVert$, $b = \lVert x - y \rVert$ et l'identité du parallélogramme (proposition 3 (iv)), 
    $$\lVert x + y \rVert\,\lVert x - y \rVert \leqslant \frac{\lVert x + y \rVert^{2} + \lVert x - y \rVert^{2}}{2} = \lVert x \rVert^{2} + \lVert y \rVert^{2}.$$
     Il y a égalité si et seulement si $\lVert x + y \rVert = \lVert x - y \rVert$, c'est-à-dire si $x \perp y$ : parmi les parallélogrammes de côtés donnés, le rectangle est celui dont le produit des diagonales est maximal.

    **6. Faux.** Dans $\mathbb{R}^{2}$, soit $e_{1} = (1, 0)$ et $e_{2} = (1, 1)$. L'algorithme appliqué à $(e_{1}, e_{2})$ donne $u_{1} = (1, 0)$, puis $v_{2} = e_{2} - \langle e_{2}, u_{1} \rangle u_{1} = (0, 1)$ et $u_{2} = (0, 1)$. Appliqué à $(e_{2}, e_{1})$, il donne $u'_{1} = \frac{1}{\sqrt{2}}(1, 1)$, puis $v'_{2} = e_{1} - \frac{1}{\sqrt{2}}u'_{1} = \frac{1}{2}(1, -1)$ et $u'_{2} = \frac{1}{\sqrt{2}}(1, -1)$. Les deux bases orthonormées sont différentes, même à l'ordre près : le premier vecteur fourni par l'algorithme est toujours le premier vecteur de départ normalisé, et la famille obtenue dépend de l'ordre.

    **7. Vrai.** Soit $x \in E$. Le vecteur $x - p_{G}(x)$ appartient à $G^{\perp}$, qui est inclus dans $F^{\perp}$ puisque $F \subset G$ (proposition 5 (ii)). Comme $F^{\perp} = \mathrm{Ker}\, p_{F}$, on a 
    $$p_{F}(x) = p_{F}\big(p_{G}(x)\big) + p_{F}\big(x - p_{G}(x)\big) = p_{F}\big(p_{G}(x)\big).$$
     Projeter d'abord sur le grand sous-espace, puis sur le petit, revient à projeter directement sur le petit. On a aussi $p_{G} \circ p_{F} = p_{F}$, puisque $p_{F}(x) \in F \subset G$ est laissé fixe par $p_{G}$.

    **8. Faux.** Dans $\mathbb{R}[X]$ muni du produit scalaire $\sum_{k} a_{k}b_{k}$ sur les coefficients, l'hyperplan $H$ des polynômes $P$ tels que $P(1) = 0$ vérifie $H^{\perp} = \{0\}$. Son double orthogonal est donc $\mathbb{R}[X]$ tout entier, qui n'est pas égal à $H$ : c'est la remarque qui suit la proposition 11. L'exercice 39 en donne un autre exemple dans $\mathcal{C}([0\,,1], \mathbb{R})$. L'égalité est vraie si $F$ est de dimension finie (proposition 10 (iii)), en particulier si $E$ est euclidien.

    **9. Vrai.** Soit $H$ un hyperplan de $E$, de dimension $n$. Par la proposition 11, $\dim H^{\perp} = n - (n - 1) = 1$. Deux vecteurs non nuls orthogonaux à $H$ appartiennent à la droite $H^{\perp}$, donc sont colinéaires : c'est l'unicité du vecteur normal, à un facteur près, de la proposition 12.

    **10. Vrai.** Soit $A$ la famille génératrice. Par la proposition 5 (ii) et (iii), 
    $$x \in A^{\perp} = (\mathrm{Vect} A)^{\perp} = E^{\perp} = \{0\}.$$
     Le caractère éventuellement infini de la famille ne gêne pas, puisque $\mathrm{Vect} A$ est formé de combinaisons linéaires finies. 
    $$\boxed{\text{Vrai : } 2, 4, 5, 7, 9, 10 ; \qquad \text{Faux : } 1, 3, 6, 8}$$
     *Piège.* Les assertions 1 et 8 sont fausses pour la même raison de fond : une propriété vraie dans un cadre restreint, deux vecteurs pour Pythagore, la dimension finie pour le double orthogonal, ne s'étend pas d'elle-même. L'assertion 3 rappelle que le caractère défini dépend de l'espace : la même formule est un produit scalaire sur les fonctions continues, et n'en est pas un sur les fonctions continues par morceaux.
