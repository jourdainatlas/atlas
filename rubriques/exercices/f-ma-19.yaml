  enonce: |
    *Une distance calculée par une fraction rationnelle.* Soit $n \geqslant 1$. Pour tout polynôme $P \in \mathbb{R}_{n - 1}[X]$, on pose 
    $$I(P) = \int_{0}^{1} \big(t^{n} - P(t)\big)^{2}\,\mathrm{d} t.$$

    **1.** Montrer qu'il existe un unique polynôme $P = \sum_{k = 0}^{n - 1} a_{k}X^{k} \in \mathbb{R}_{n - 1}[X]$ en lequel $I$ atteint son minimum.

    **2.** On considère la fraction rationnelle 
    $$F = \frac{1}{X + n + 1} - \sum_{j = 0}^{n - 1} \frac{a_{j}}{X + j + 1}.$$

    **(a)** Calculer $F(i)$ pour tout $i \in [\![0\,;n - 1]\!]$.

    **(b)** En déduire une expression factorisée de $F$.

    **(c)** Calculer $F(n)$, puis en déduire la valeur du minimum de $I$.

    **3.** Vérifier le résultat pour $n = 2$ à l'aide de l'exemple de la section 19.6 du cours.
  corrige: |
    On munit $\mathbb{R}[X]$ du produit scalaire défini par $\langle P, Q \rangle = \int_{0}^{1} PQ$ (proposition 2 (ii)). On a alors $I(P) = \lVert X^{n} - P \rVert^{2}$.

    **1.** Le sous-espace $\mathbb{R}_{n - 1}[X]$ est de dimension finie $n$. Par le théorème 7, la distance de $X^{n}$ à $\mathbb{R}_{n - 1}[X]$ est atteinte en un unique point, le projeté orthogonal : 
    $$\boxed{I \text{ atteint son minimum en un unique } P = p_{\mathbb{R}_{n - 1}[X]}(X^{n})}$$

    **2.(a)** Pour $i \in [\![0\,;n - 1]\!]$, les dénominateurs $i + j + 1$ sont non nuls, et pour tout entier $k \geqslant 0$, 
    $$\frac{1}{i + k + 1} = \int_{0}^{1} t^{i + k}\,\mathrm{d} t = \langle X^{i}, X^{k} \rangle.$$
     Donc 
    $$F(i) = \langle X^{i}, X^{n} \rangle - \sum_{j = 0}^{n - 1} a_{j}\langle X^{i}, X^{j} \rangle = \langle X^{i}, X^{n} - P \rangle = 0,$$
     puisque $X^{n} - P$ est orthogonal à $\mathbb{R}_{n - 1}[X]$ (proposition 10 (ii)) : $\boxed{F(i) = 0 \text{ pour } 0 \leqslant i \leqslant n - 1}$.

    **(b)** Soit $D = (X + 1)(X + 2)\cdots(X + n + 1)$, de degré $n + 1$. En réduisant au même dénominateur, $F = \frac{N}{D}$, où $N$ est un polynôme de degré au plus $n$ : chaque terme $\frac{1}{X + k}$ devient $\frac{D/(X + k)}{D}$, et $\frac{D}{X + k}$ est un produit de $n$ facteurs de degré $1$. Pour $i \in [\![0\,;n - 1]\!]$, on a $D(i) \neq 0$ et $N(i) = D(i)F(i) = 0$. Le polynôme $N$ a donc les $n$ racines distinctes $0$, $1$, …, $n - 1$ ; il est divisible par leur produit (chapitre 13, proposition 8), et, son degré étant au plus $n$, il existe une constante $c$ telle que 
    $$N = c\,X(X - 1)\cdots(X - n + 1).$$
     On détermine $c$ par le pôle $-(n + 1)$ : la fraction $(X + n + 1)F = 1 - \sum_{j} a_{j}\frac{X + n + 1}{X + j + 1}$ prend la valeur $1$ en $-(n + 1)$. D'autre part, $(X + n + 1)F = \frac{N}{(X + 1)\cdots(X + n)}$, dont la valeur en $-(n + 1)$ est 
    $$c\,\frac{\prod_{i = 0}^{n - 1} \big(-(n + 1 + i)\big)}{\prod_{k = 1}^{n} (k - n - 1)} = c\,\frac{(-1)^{n}(n + 1)(n + 2)\cdots(2n)}{(-1)^{n}\,n!} = c\,\frac{(2n)!}{(n!)^{2}} = c\binom{2n}{n}.$$
     Ainsi $c = \binom{2n}{n}^{-1}$, et 
    $$\boxed{F = \frac{X(X - 1)\cdots(X - n + 1)}{\binom{2n}{n}(X + 1)(X + 2)\cdots(X + n + 1)}}$$

    **(c)** En $X = n$, le numérateur vaut $n!$, et le produit $(n + 1)(n + 2)\cdots(2n + 1)$ vaut $\frac{(2n + 1)!}{n!}$, d'où 
    $$F(n) = \frac{(n!)^{2}}{\binom{2n}{n}(2n + 1)!} = \frac{1}{\binom{2n}{n}(2n + 1)\binom{2n}{n}}.$$
     D'autre part, le calcul de la question (a), fait avec $i = n$, donne $F(n) = \langle X^{n}, X^{n} - P \rangle$. Comme $P$ est orthogonal à $X^{n} - P$, on peut retrancher $\langle P, X^{n} - P \rangle = 0$ : 
    $$F(n) = \langle X^{n} - P, X^{n} - P \rangle = I(P), \qquad\text{d'où}\qquad \boxed{\min_{P \in \mathbb{R}_{n - 1}[X]} \int_{0}^{1}\big(t^{n} - P(t)\big)^{2}\,\mathrm{d} t = \frac{1}{(2n + 1)\binom{2n}{n}^{2}}}$$
     Pour $n = 1$, on trouve $\frac{1}{3 \cdot 4} = \frac{1}{12}$, qui est bien $\int_{0}^{1}\big(t - \frac{1}{2}\big)^{2}\,\mathrm{d} t$ ✓ ; pour $n = 3$, $\frac{1}{7 \cdot 400} = \frac{1}{2800}$. Toutes ces valeurs ont été contrôlées par la résolution directe des équations normales, pour $1 \leqslant n \leqslant 6$ ✓.

    **3.** Pour $n = 2$, la formule donne $\frac{1}{5 \cdot 36} = \frac{1}{180}$, qui est bien le carré de la distance de $t^{2}$ aux fonctions affines trouvé à la section 19.6 du cours ✓. Le cours donne aussi le projeté $t - \frac{1}{6}$, c'est-à-dire $a_{0} = -\frac{1}{6}$ et $a_{1} = 1$ ; on vérifie que 
    $$\frac{1}{X + 3} + \frac{1}{6(X + 1)} - \frac{1}{X + 2} = \frac{X(X - 1)}{6(X + 1)(X + 2)(X + 3)},$$
     en réduisant au même dénominateur, puisque le numérateur vaut 
    $$6(X + 1)(X + 2) + (X + 2)(X + 3) - 6(X + 1)(X + 3) = X^{2} - X \quad \checkmark$$

    *À retenir.* Par la formule de Stirling (chapitre 18, théorème 10), $\binom{2n}{n} \sim \frac{4^{n}}{\sqrt{\pi n}}$, et le minimum est équivalent à $\frac{\pi}{2 \cdot 16^{n}}$ : pour $n = 20$, le rapport des deux vaut $0{,}988$ ✓. La distance de $t^{n}$ aux polynômes de degré inférieur décroît comme $4^{-n}$ : sur $[0\,,1]$, la fonction $t^{n}$ est très bien approchée par des polynômes de degré plus petit. Les coefficients $a_{j}$ sont solution d'un système dont la matrice est la matrice de Hilbert de l'exercice 27 ; la fraction rationnelle évite de résoudre ce système, très sensible aux erreurs d'arrondi.
- id: "ma-19-53"
  feuille: "f-ma-19"
  numero: 53
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [produits scalaires, orthogonalité, bases orthonormées, produits scalaires intégraux, polynômes orthogonaux, matrices de Gram]
  noeuds: [me-produit-scalaire, fq-orthogonalite, fq-bases-orthogonales, ri-proprietes, pol-anneau, v-det-matrice]
  notions: [produit-scalaire, vecteurs-orthogonaux, base-orthogonale]
  page_enonce: 14
  page_corrige: 48
  enonce: |
    *Les formules de quadrature de Gauss.* Soit $n \geqslant 1$. On munit $\mathbb{R}[X]$ du produit scalaire défini par $\langle P, Q \rangle = \int_{-1}^{1} PQ$, et l'on note $L_{n}$ le polynôme de degré $n$, orthogonal à $\mathbb{R}_{n - 1}[X]$, que fournit l'algorithme de Gram-Schmidt dans le cours. D'après la proposition 7 du cours, $L_{n}$ possède $n$ racines simples $x_{1} < \cdots < x_{n}$, toutes situées dans $]-1\,,1[$.

    **1.** Montrer qu'il existe un unique $n$-uplet $(\lambda_{1}, \dots, \lambda_{n}) \in \mathbb{R}^{n}$ tel que 
    $$\int_{-1}^{1} f(t)\,\mathrm{d} t = \sum_{k = 1}^{n} \lambda_{k}f(x_{k}) \qquad\text{pour tout } f \in \mathbb{R}_{n - 1}[X]. \tag{$\ast$}$$

    **2.** Montrer que l'égalité $(\ast)$ est encore vraie pour tout $f \in \mathbb{R}_{2n - 1}[X]$. On pourra effectuer la division euclidienne de $f$ par $L_{n}$.

    **3.** Réciproquement, soit $y_{1} < \cdots < y_{n}$ des réels et $\mu_{1}$, …, $\mu_{n}$ des réels tels que $\int_{-1}^{1} f = \sum_{k} \mu_{k}f(y_{k})$ pour tout $f \in \mathbb{R}_{2n - 1}[X]$. Montrer que les $y_{k}$ sont les racines de $L_{n}$.

    **4.** Montrer que $\lambda_{k} > 0$ pour tout $k$, et calculer $\sum_{k = 1}^{n} \lambda_{k}$.

    **5.** Calculer $x_{1}$, $x_{2}$, $\lambda_{1}$ et $\lambda_{2}$ pour $n = 2$.

    **6.** Soit $f : [-1\,,1] \to \mathbb{R}$ continue, et $I_{n}(f) = \sum_{k = 1}^{n} \lambda_{k}f(x_{k})$, où les $x_{k}$ et les $\lambda_{k}$ dépendent de $n$. On admet le théorème de Weierstrass : pour tout $\varepsilon > 0$, il existe un polynôme $Q$ tel que $|f(t) - Q(t)| \leqslant \varepsilon$ pour tout $t \in [-1\,,1]$. Montrer que $I_{n}(f)$ tend vers $\int_{-1}^{1} f$ quand $n$ tend vers $+\infty$.

    Les quatre derniers exercices sont des problèmes à traiter en autonomie : l'énoncé fixe le but, et c'est à vous de trouver le chemin.
  corrige: |
    **1.** Les $x_{k}$ étant distincts, on dispose des polynômes de Lagrange $\ell_{1}$, …, $\ell_{n} \in \mathbb{R}_{n - 1}[X]$, caractérisés par $\ell_{k}(x_{j}) = \delta_{kj}$, et de la formule d'interpolation $f = \sum_{k} f(x_{k})\ell_{k}$ pour $f \in \mathbb{R}_{n - 1}[X]$ (chapitre 13, théorème 13).

    Si $(\lambda_{k})$ convient, l'égalité $(\ast)$ appliquée à $f = \ell_{j}$ donne $\int_{-1}^{1} \ell_{j} = \sum_{k} \lambda_{k}\delta_{jk} = \lambda_{j}$ : il y a au plus une solution. Réciproquement, avec $\lambda_{k} = \int_{-1}^{1} \ell_{k}$, la linéarité de l'intégrale et la formule d'interpolation donnent, pour $f \in \mathbb{R}_{n - 1}[X]$, 
    $$\int_{-1}^{1} f = \sum_{k = 1}^{n} f(x_{k})\int_{-1}^{1} \ell_{k} = \sum_{k = 1}^{n} \lambda_{k}f(x_{k}).$$

    $$\boxed{\text{il existe un unique } (\lambda_{1}, \dots, \lambda_{n}), \text{ donné par } \lambda_{k} = \int_{-1}^{1} \ell_{k}(t)\,\mathrm{d} t}$$

    **2.** Soit $f \in \mathbb{R}_{2n - 1}[X]$, et $f = QL_{n} + R$ sa division euclidienne par $L_{n}$, qui est de degré $n$ (chapitre 13, théorème 2) : $\deg R \leqslant n - 1$, et $\deg Q \leqslant n - 1$, puisque $\deg f \leqslant 2n - 1$. Comme $L_{n}$ est orthogonal à $\mathbb{R}_{n - 1}[X]$ (proposition 7 (i)), on a $\int_{-1}^{1} QL_{n} = \langle Q, L_{n} \rangle = 0$. Comme $L_{n}(x_{k}) = 0$, on a $f(x_{k}) = R(x_{k})$. Par la question 1 appliquée à $R$, 
    $$\int_{-1}^{1} f = 0 + \int_{-1}^{1} R = \sum_{k = 1}^{n} \lambda_{k}R(x_{k}) = \sum_{k = 1}^{n} \lambda_{k}f(x_{k}).$$

    $$\boxed{(\ast) \text{ est vraie pour tout } f \in \mathbb{R}_{2n - 1}[X]}$$
     Avec $n$ points, on intègre exactement les polynômes de degré au plus $2n - 1$ : c'est le double de ce que donne l'interpolation seule. Ce n'est plus vrai au degré $2n$ : pour $f = L_{n}^{2}$, le second membre est nul, et le premier vaut $\lVert L_{n} \rVert^{2} > 0$.

    **3.** Soit $W = (X - y_{1})\cdots(X - y_{n})$, de degré $n$. Pour tout $Q \in \mathbb{R}_{n - 1}[X]$, le polynôme $QW$ est de degré au plus $2n - 1$, et il s'annule en chaque $y_{k}$ : 
    $$\langle Q, W \rangle = \int_{-1}^{1} QW = \sum_{k = 1}^{n} \mu_{k}Q(y_{k})W(y_{k}) = 0.$$
     Ainsi $W$ appartient à l'orthogonal de $\mathbb{R}_{n - 1}[X]$ dans l'espace euclidien $\mathbb{R}_{n}[X]$. Par la proposition 11, cet orthogonal est de dimension $(n + 1) - n = 1$ ; il contient $L_{n} \neq 0$, donc c'est la droite $\mathrm{Vect}(L_{n})$, et $W = cL_{n}$ avec $c \neq 0$. Les deux polynômes ont les mêmes racines : 
    $$\boxed{\{y_{1}, \dots, y_{n}\} = \{x_{1}, \dots, x_{n}\}, \quad \text{donc } y_{k} = x_{k} \text{ pour tout } k}$$
     puisque les deux listes sont rangées dans l'ordre croissant. Par l'unicité de la question 1, on a aussi $\mu_{k} = \lambda_{k}$ : la formule de Gauss est la seule formule à $n$ points exacte au degré $2n - 1$.

    **4.** Le polynôme $\ell_{k}^{2}$ est de degré $2n - 2 \leqslant 2n - 1$ ; la question 2 lui applique $(\ast)$ : 
    $$\int_{-1}^{1} \ell_{k}^{2} = \sum_{j = 1}^{n} \lambda_{j}\ell_{k}(x_{j})^{2} = \lambda_{k},$$
     et cette intégrale est strictement positive, puisque $\ell_{k} \neq 0$ et que $\int_{-1}^{1} PQ$ est un produit scalaire. Avec $f = 1$, on obtient $\int_{-1}^{1} 1 = 2$ : 
    $$\boxed{\lambda_{k} = \int_{-1}^{1} \ell_{k}^{2} > 0, \qquad \sum_{k = 1}^{n} \lambda_{k} = 2}$$

    **5.** La section 19.4 du cours donne $L_{2} = X^{2} - \frac{1}{3}$, de racines $\boxed{x_{1} = -\frac{1}{\sqrt{3}}, \ x_{2} = \frac{1}{\sqrt{3}}}$. On a $\lambda_{1} + \lambda_{2} = 2$, et $(\ast)$ appliquée à $f = X$ donne $0 = \frac{\lambda_{2} - \lambda_{1}}{\sqrt{3}}$, d'où $\boxed{\lambda_{1} = \lambda_{2} = 1}$. La formule 
    $$\int_{-1}^{1} f(t)\,\mathrm{d} t \approx f\Big(-\frac{1}{\sqrt{3}}\Big) + f\Big(\frac{1}{\sqrt{3}}\Big)$$
     est exacte pour les polynômes de degré au plus $3$, mais pas pour $X^{4}$ : elle donne $\frac{2}{9}$ au lieu de $\frac{2}{5}$ ✓. Pour $f = \exp$, elle donne $2\operatorname{ch}\frac{1}{\sqrt{3}} \approx 2{,}3427$ au lieu de $2\operatorname{sh} 1 \approx 2{,}3504$, soit une erreur de $0{,}0077$ avec deux évaluations seulement ; la méthode des trapèzes à trois points, $-1$, $0$, $1$, se trompe de $0{,}19$. Pour $n = 3$, on trouve les nœuds $0$ et $\pm\sqrt{3/5}$, de poids $\frac{8}{9}$ et $\frac{5}{9}$ ✓.

    **6.** Soit $\varepsilon > 0$, et $Q$ un polynôme tel que $|f - Q| \leqslant \varepsilon$ sur $[-1\,,1]$. Pour $n$ assez grand, $2n - 1 \geqslant \deg Q$, et la question 2 donne $I_{n}(Q) = \int_{-1}^{1} Q$. On écrit 
    $$\Big|I_{n}(f) - \int_{-1}^{1} f\Big| \leqslant \big|I_{n}(f) - I_{n}(Q)\big| + \Big|\int_{-1}^{1} Q - \int_{-1}^{1} f\Big|.$$
     Par l'inégalité triangulaire et la positivité des poids (question 4), le premier terme est au plus $\sum_{k} \lambda_{k}|f(x_{k}) - Q(x_{k})| \leqslant \varepsilon\sum_{k} \lambda_{k} = 2\varepsilon$. Par l'inégalité de la moyenne (chapitre 18, proposition 7), le second est au plus $2\varepsilon$. Ainsi $\big|I_{n}(f) - \int_{-1}^{1} f\big| \leqslant 4\varepsilon$ pour $n$ assez grand : 
    $$\boxed{I_{n}(f) \xrightarrow[n \to +\infty]{} \int_{-1}^{1} f(t)\,\mathrm{d} t}$$

    *Piège.* La positivité des poids est le point décisif : c'est elle qui transforme $\sum_{k} \lambda_{k}|f(x_{k}) - Q(x_{k})|$ en au plus $2\varepsilon$. Avec des nœuds équidistants et des poids définis comme à la question 1, certains poids deviennent négatifs dès neuf points (le plus petit vaut alors $-\frac{908}{2835}$), la somme des $|\lambda_{k}|$ dépasse alors $2$, et la majoration par $2\varepsilon$ tombe. Placer les nœuds aux racines d'un polynôme orthogonal n'est donc pas un raffinement : c'est ce qui garantit la convergence.

    Les quatre derniers exercices sont des problèmes en autonomie ; le corrigé commence par l'idée directrice.
