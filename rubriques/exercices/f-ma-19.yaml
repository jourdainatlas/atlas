  enonce: |
    *Une moyenne sur tous les choix de signes.* Soit $E$ un espace préhilbertien réel, $u_{1}$, …, $u_{n}$ des vecteurs de $E$ et $C$ un réel tels que 
    $$\Big\|\sum_{i = 1}^{n} \varepsilon_{i}u_{i}\Big\| \leqslant C \qquad\text{pour tout } (\varepsilon_{1}, \dots, \varepsilon_{n}) \in \{-1, 1\}^{n}.$$

    **1.** Calculer la somme, étendue aux $2^{n}$ éléments $(\varepsilon_{1}, \dots, \varepsilon_{n})$ de $\{-1, 1\}^{n}$, des réels $\big\|\sum_{i = 1}^{n} \varepsilon_{i}u_{i}\big\|^{2}$.

    **2.** En déduire que $\displaystyle\sum_{i = 1}^{n} \lVert u_{i} \rVert^{2} \leqslant C^{2}$.

    **3.** On ne suppose plus rien sur les $u_{i}$. Montrer qu'il existe toujours des signes $\varepsilon_{i}$ tels que 
    $$\Big\|\sum_{i = 1}^{n} \varepsilon_{i}u_{i}\Big\|^{2} \geqslant \sum_{i = 1}^{n} \lVert u_{i} \rVert^{2},$$
     et d'autres pour lesquels l'inégalité contraire est vraie. Que dire des réels $\big\|\sum_{i} \varepsilon_{i}u_{i}\big\|^{2}$ quand les $u_{i}$ sont deux à deux orthogonaux ?
  corrige: |
    On note $\Sigma$ la somme étendue aux $2^{n}$ éléments $\varepsilon = (\varepsilon_{1}, \dots, \varepsilon_{n})$ de $\{-1, 1\}^{n}$.

    **1.** On développe chaque carré par bilinéarité, puis on échange les sommes finies : 
    $$\sum_{\varepsilon} \Big\|\sum_{i = 1}^{n} \varepsilon_{i}u_{i}\Big\|^{2} = \sum_{\varepsilon}\ \sum_{i, j} \varepsilon_{i}\varepsilon_{j}\langle u_{i}, u_{j} \rangle = \sum_{i, j} \langle u_{i}, u_{j} \rangle\sum_{\varepsilon} \varepsilon_{i}\varepsilon_{j}.$$
     Pour $i = j$, on a $\varepsilon_{i}^{2} = 1$, et la somme intérieure vaut $2^{n}$. Pour $i \neq j$, l'application qui change le signe de $\varepsilon_{i}$ sans toucher aux autres coordonnées est une bijection de $\{-1, 1\}^{n}$ sur lui-même, égale à sa propre réciproque, qui change $\varepsilon_{i}\varepsilon_{j}$ en son opposé : la somme $\sum_{\varepsilon} \varepsilon_{i}\varepsilon_{j}$ est égale à son opposée, donc nulle. Les doubles produits disparaissent, et 
    $$\boxed{\sum_{\varepsilon \in \{-1, 1\}^{n}} \Big\|\sum_{i = 1}^{n} \varepsilon_{i}u_{i}\Big\|^{2} = 2^{n}\sum_{i = 1}^{n} \lVert u_{i} \rVert^{2}}$$
     Pour $n = 2$, les termes associés à $\varepsilon$ et $-\varepsilon$ sont égaux, et l'on retrouve deux fois l'identité du parallélogramme (proposition 3 (iv)) : $2\big(\lVert u_{1} + u_{2} \rVert^{2} + \lVert u_{1} - u_{2} \rVert^{2}\big) = 4\big(\lVert u_{1} \rVert^{2} + \lVert u_{2} \rVert^{2}\big)$.

    **2.** Chacun des $2^{n}$ termes est au plus $C^{2}$, puisque $0 \leqslant \big\|\sum_{i} \varepsilon_{i}u_{i}\big\| \leqslant C$. Leur somme est donc au plus $2^{n}C^{2}$, et la question 1 donne, après division par $2^{n}$, 
    $$\boxed{\sum_{i = 1}^{n} \lVert u_{i} \rVert^{2} \leqslant C^{2}}$$
     Pour des vecteurs unitaires, on obtient $n \leqslant C^{2}$ : si toutes les sommes signées de $n$ vecteurs unitaires sont de norme au plus $C$, il y a au plus $C^{2}$ vecteurs. La borne est atteinte pour la base canonique de $\mathbb{R}^{n}$, dont toutes les sommes signées ont pour norme $\sqrt{n}$.

    **3.** Soit $m = \sum_{i} \lVert u_{i} \rVert^{2}$. Par la question 1, $m$ est la moyenne des $2^{n}$ réels $a_{\varepsilon} = \big\|\sum_{i} \varepsilon_{i}u_{i}\big\|^{2}$. Si tous ces réels étaient strictement inférieurs à $m$, leur moyenne le serait aussi ; il existe donc $\varepsilon$ tel que $a_{\varepsilon} \geqslant m$. De même, ils ne peuvent pas être tous strictement supérieurs à $m$. 
    $$\boxed{\exists\, \varepsilon, \ \varepsilon' \in \{-1, 1\}^{n}, \qquad \Big\|\sum_{i = 1}^{n} \varepsilon_{i}u_{i}\Big\|^{2} \geqslant \sum_{i = 1}^{n} \lVert u_{i} \rVert^{2} \geqslant \Big\|\sum_{i = 1}^{n} \varepsilon'_{i}u_{i}\Big\|^{2}}$$
     Si les $u_{i}$ sont deux à deux orthogonaux, les $\varepsilon_{i}u_{i}$ le sont aussi, et le théorème de Pythagore (théorème 3 (ii)) donne $a_{\varepsilon} = \sum_{i} \lVert \varepsilon_{i}u_{i} \rVert^{2} = m$ pour tout $\varepsilon$ : les $2^{n}$ réels sont tous égaux à leur moyenne. Pour $u_{1} = (1, 0)$ et $u_{2} = (1, 1)$, non orthogonaux, on trouve au contraire les valeurs $5$, $1$, $1$, $5$, de moyenne $3 = 1 + 2$ ✓.

    *À retenir.* L'argument « une moyenne est comprise entre le plus petit et le plus grand terme » démontre l'existence d'un choix de signes sans le construire. Le chapitre 21 relira ce calcul en termes de probabilités, en tirant les signes au hasard.
