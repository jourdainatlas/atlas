  noeuds: [fq-bases-orthogonales, me-produit-scalaire, v-matrices, v-det-matrice]
  notions: [base-orthogonale, norme, produit-scalaire]
  page_enonce: 7
  page_corrige: 24
  enonce: |
    *Décomposition QR et inégalité de Hadamard.* Soit $A \in \mathrm{GL}_{n}(\mathbb{R})$, de colonnes $C_{1}$, …, $C_{n}$. On note $\mathcal{B} = (E_{1}, \dots, E_{n})$ la base canonique de $\mathcal{M}_{n,1}(\mathbb{R})$, et $\mathcal{D} = (D_{1}, \dots, D_{n})$ la base orthonormée obtenue en appliquant l'algorithme de Gram-Schmidt à $\mathcal{C} = (C_{1}, \dots, C_{n})$.

    **1.** Justifier que $\mathcal{C}$ est une base de $\mathcal{M}_{n,1}(\mathbb{R})$. Quelle est la matrice de passage de $\mathcal{B}$ à $\mathcal{C}$ ? Montrer que la matrice de passage $T$ de $\mathcal{D}$ à $\mathcal{C}$ est triangulaire supérieure, à coefficients diagonaux strictement positifs.

    **2.** En déduire qu'il existe une matrice $O \in \mathcal{M}_{n}(\mathbb{R})$ telle que ${O}^{T}O = I_{n}$ et une matrice triangulaire supérieure $T$ à coefficients diagonaux strictement positifs telles que $A = OT$.

    **3.** Montrer que ce couple $(O, T)$ est unique.

    **4.** Calculer cette décomposition pour $A = \begin{pmatrix} 1 & 2 \\ -1 & 1 \end{pmatrix}$.

    **5.** Montrer l'inégalité de Hadamard : $|\det A| \leqslant \lVert C_{1} \rVert\,\lVert C_{2} \rVert \cdots \lVert C_{n} \rVert$. Reste-t-elle vraie pour une matrice $A$ non inversible ? Interpréter géométriquement pour $n = 3$.
  corrige: |
    **1.** La matrice $A$ est inversible, donc son rang vaut $n$, et ses colonnes engendrent $\mathcal{M}_{n,1}(\mathbb{R})$ (chapitre 16, théorème 3) : ces $n$ colonnes forment une base. La colonne $j$ de la matrice de passage de $\mathcal{B}$ à $\mathcal{C}$ contient les coordonnées de $C_{j}$ dans la base canonique, c'est-à-dire $C_{j}$ elle-même. 
    $$\boxed{\mathcal{C} \text{ est une base de } \mathcal{M}_{n,1}(\mathbb{R}), \qquad P_{\mathcal{B}}^{\mathcal{C}} = A}$$
     La colonne $j$ de $T = P_{\mathcal{D}}^{\mathcal{C}}$ contient les coordonnées de $C_{j}$ dans la base orthonormée $\mathcal{D}$, qui sont les produits scalaires $\langle C_{j}, D_{i} \rangle$ (proposition 8). Par le théorème 4, $C_{j} \in \mathrm{Vect}(C_{1}, \dots, C_{j}) = \mathrm{Vect}(D_{1}, \dots, D_{j})$, donc $\langle C_{j}, D_{i} \rangle = 0$ pour $i > j$ ; et $t_{jj} = \langle C_{j}, D_{j} \rangle > 0$, toujours par le théorème 4. 
    $$\boxed{T = P_{\mathcal{D}}^{\mathcal{C}} = \big(\langle C_{j}, D_{i} \rangle\big)_{i, j} \text{ est triangulaire supérieure, et } t_{jj} = \langle C_{j}, D_{j} \rangle > 0}$$

    **2.** Par la formule de composition des matrices de passage (chapitre 16, proposition 13), on a $P_{\mathcal{B}}^{\mathcal{C}} = P_{\mathcal{B}}^{\mathcal{D}}P_{\mathcal{D}}^{\mathcal{C}}$, c'est-à-dire $A = OT$ avec $O = P_{\mathcal{B}}^{\mathcal{D}}$, dont les colonnes sont $D_{1}$, …, $D_{n}$. La matrice ${O}^{T}O$ est la matrice de Gram de la famille orthonormée $\mathcal{D}$ (proposition 9 (i)), c'est-à-dire $I_{n}$. 
    $$\boxed{A = OT, \qquad {O}^{T}O = I_{n}, \qquad T \text{ triangulaire supérieure à diagonale } > 0}$$

    **3.** Soit $A = O'T'$ une autre décomposition de ce type, et $D'_{1}$, …, $D'_{n}$ les colonnes de $O'$, qui forment une famille orthonormée puisque ${O'}^{T}O' = I_{n}$. L'égalité $A = O'T'$ s'écrit, colonne par colonne, $C_{j} = \sum_{i \leqslant j} t'_{ij}D'_{i}$, puisque $T'$ est triangulaire supérieure. Ainsi $\mathrm{Vect}(C_{1}, \dots, C_{j}) \subset \mathrm{Vect}(D'_{1}, \dots, D'_{j})$, et les deux sous-espaces sont de dimension $j$, puisque ces familles sont libres : ils sont égaux (chapitre 15, théorème 5). De plus, $\langle D'_{j}, C_{j} \rangle = t'_{jj} > 0$ par orthonormalité. La famille $(D'_{j})$ vérifie donc les deux propriétés qui caractérisent la famille de Gram-Schmidt dans le théorème 4 : par l'unicité affirmée par ce théorème, $D'_{j} = D_{j}$ pour tout $j$, donc $O' = O$. Enfin, $T' = {O}^{T}O'T' = {O}^{T}A = {O}^{T}OT = T$. 
    $$\boxed{\text{le couple } (O, T) \text{ est unique}}$$
     *Piège.* Sans la condition de signe sur la diagonale, l'unicité tombe : on peut changer le signe d'une colonne de $O$ et de la ligne correspondante de $T$. C'est la condition $\langle u_{k}, e_{k} \rangle > 0$ du théorème 4 qui fixe ces signes.

    **4.** On orthonormalise $C_{1} = (1, -1)$ et $C_{2} = (2, 1)$ par la méthode du cours. On a $\lVert C_{1} \rVert = \sqrt{2}$ et $D_{1} = \frac{1}{\sqrt{2}}(1, -1)$ ; puis $\langle C_{2}, D_{1} \rangle = \frac{1}{\sqrt{2}}$, et 
    $$v_{2} = C_{2} - \langle C_{2}, D_{1} \rangle D_{1} = (2, 1) - \frac{1}{2}(1, -1) = \Big(\frac{3}{2}, \frac{3}{2}\Big), \qquad \lVert v_{2} \rVert = \frac{3}{\sqrt{2}}, \qquad D_{2} = \frac{1}{\sqrt{2}}(1, 1).$$
     La matrice $T$ contient les produits scalaires $\langle C_{j}, D_{i} \rangle$ : $t_{11} = \sqrt{2}$, $t_{12} = \frac{1}{\sqrt{2}}$ et $t_{22} = \langle C_{2}, D_{2} \rangle = \frac{3}{\sqrt{2}}$. 
    $$\boxed{O = \frac{1}{\sqrt{2}}\begin{pmatrix} 1 & 1 \\ -1 & 1 \end{pmatrix}, \qquad T = \begin{pmatrix} \sqrt{2} & \frac{\sqrt{2}}{2} \\[1mm] 0 & \frac{3\sqrt{2}}{2} \end{pmatrix}}$$
     On vérifie le produit : $OT = \frac{1}{\sqrt{2}}\begin{pmatrix} \sqrt{2} & \frac{1}{\sqrt{2}} + \frac{3}{\sqrt{2}} \\ -\sqrt{2} & -\frac{1}{\sqrt{2}} + \frac{3}{\sqrt{2}} \end{pmatrix} = \begin{pmatrix} 1 & 2 \\ -1 & 1 \end{pmatrix} = A$. ✓

    **5.** Par le théorème 6 du chapitre 17, $\det({O}^{T}O) = (\det O)^{2} = 1$, donc $|\det O| = 1$, et le déterminant d'une matrice triangulaire est le produit de ses coefficients diagonaux. Ainsi 
    $$|\det A| = |\det O|\det T = t_{11}t_{22} \cdots t_{nn}.$$
     Chaque $t_{jj} = \langle C_{j}, D_{j} \rangle$ est majoré par $\lVert C_{j} \rVert\,\lVert D_{j} \rVert = \lVert C_{j} \rVert$, par l'inégalité de Cauchy-Schwarz. 
    $$\boxed{|\det A| = \prod_{j = 1}^{n} t_{jj} \leqslant \lVert C_{1} \rVert\,\lVert C_{2} \rVert \cdots \lVert C_{n} \rVert}$$
     Pour la matrice de la question 4, $|\det A| = 3 \leqslant \sqrt{2}\cdot\sqrt{5} = \sqrt{10} \approx 3{,}16$. ✓ Si $A$ n'est pas inversible, $\det A = 0$ et l'inégalité est évidente : elle reste vraie. Pour $A$ inversible, la colonne $j$ de $T$ donne $\lVert C_{j} \rVert^{2} = \sum_{i \leqslant j} t_{ij}^{2}$ (proposition 8), donc $t_{jj} = \lVert C_{j} \rVert$ si et seulement si $t_{ij} = 0$ pour $i < j$ : il y a égalité si et seulement si $T$ est diagonale, c'est-à-dire si les colonnes de $A$ sont deux à deux orthogonales.

    Pour $n = 3$, $|\det A|$ est le volume du parallélépipède construit sur $C_{1}$, $C_{2}$, $C_{3}$ (chapitre 17, et remarque qui suit la proposition 9) : il est au plus égal au produit des longueurs des arêtes, avec égalité pour un pavé droit. La décomposition $A = OT$ en donne la raison : $t_{11}$ est la longueur de la première arête, $t_{22}$ la hauteur du parallélogramme de base $(C_{1}, C_{2})$, et $t_{33}$ la hauteur du parallélépipède au-dessus de ce parallélogramme. La figure illustre le cas $n = 2$ de la question 4.

    ![Figure](documents/figures/941e9e6c95a523e8.svg)

    L'aire du parallélogramme vaut la base $\lVert C_{1} \rVert = t_{11} = \sqrt{2}$ multipliée par la hauteur $t_{22} = \frac{3}{\sqrt{2}}$, soit $3 = |\det A|$ ; la hauteur, en pointillés, est plus courte que le côté $\lVert C_{2} \rVert = \sqrt{5} \approx 2{,}24$, et c'est toute l'inégalité de Hadamard.

    *À retenir.* La décomposition $A = OT$ est l'algorithme de Gram-Schmidt écrit en matrices : $O$ contient la base orthonormée obtenue, $T$ les coefficients $\langle C_{j}, D_{i} \rangle$ calculés en chemin. L'inégalité de Hadamard dit qu'un volume est maximal, à longueurs d'arêtes fixées, quand les arêtes sont orthogonales.
