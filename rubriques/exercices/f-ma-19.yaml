  enonce: |
    *Le simplexe régulier et la molécule de méthane.* Soit $n \geqslant 1$ et $e_{1}$, …, $e_{n + 1}$ des vecteurs unitaires de $\mathbb{R}^{n}$ tels que $\langle e_{i}, e_{j} \rangle = \alpha$ pour tous $i \neq j$, où $\alpha$ est un réel. On note $A = \big(\langle e_{i}, e_{j} \rangle\big)_{1 \leqslant i, j \leqslant n + 1} \in \mathcal{M}_{n + 1}(\mathbb{R})$.

    **1.** Montrer que $\det A = 0$. On pourra écrire $A = {M}^{T}M$ pour une matrice $M$ bien choisie.

    **2.** Calculer $\det A$ en fonction de $\alpha$. En déduire les valeurs possibles de $\alpha$ et, pour chacune, la valeur de $e_{1} + \cdots + e_{n + 1}$.

    **3.** Réciproquement, soit $E$ un espace euclidien de dimension $n$. Montrer qu'il existe des vecteurs unitaires $x_{0}$, …, $x_{n}$ de $E$ tels que $\langle x_{i}, x_{j} \rangle = -\frac{1}{n}$ pour tous $i \neq j$. On pourra commencer par le cas où $E$ est l'hyperplan d'équation $y_{0} + \cdots + y_{n} = 0$ de $\mathbb{R}^{n + 1}$, puis utiliser des bases orthonormées.

    **4.** Dans une molécule de méthane $\mathrm{CH}_{4}$, l'atome de carbone est lié à quatre atomes d'hydrogène ; on admet que les quatre liaisons ont la même longueur et font deux à deux le même angle. Calculer cet angle, en degrés, à $10^{-2}$ près.
  corrige: |
    On munit $\mathbb{R}^{n}$ du produit scalaire canonique, et l'on note $N = n + 1$ le nombre de vecteurs.

    **1.** Soit $M \in \mathcal{M}_{n,n + 1}(\mathbb{R})$ la matrice dont les colonnes sont les coordonnées des $e_{j}$ dans la base canonique, qui est orthonormée. La proposition 9 (i) donne $A = {M}^{T}M$. Comme $n + 1$ vecteurs de $\mathbb{R}^{n}$ forment une famille liée (chapitre 15, théorème 4), il existe une colonne $X \neq 0$ telle que $MX = 0$ ; alors $AX = {M}^{T}MX = 0$, et $A$ n'est pas inversible. 
    $$\boxed{\det A = 0}$$
     C'est aussi la question 2 de l'exercice 47 : la famille $(e_{1}, \dots, e_{n + 1})$ est liée, donc son déterminant de Gram est nul.

    **2.** La matrice $A$ a ses coefficients diagonaux égaux à $1$ et les autres égaux à $\alpha$. On remplace la première colonne par la somme de toutes les colonnes, ce qui ne change pas le déterminant (chapitre 17, proposition 10) : tous ses coefficients valent $1 + n\alpha$, que l'on met en facteur. On retranche ensuite la première ligne à chacune des autres : pour $i \geqslant 2$, la ligne $i$ devient $(0, \dots, 0, 1 - \alpha, 0, \dots, 0)$, le coefficient $1 - \alpha$ étant en position $i$, puisque $a_{ij} - a_{1j}$ vaut $1 - \alpha$ si $j = i$ et $0$ sinon. La matrice obtenue est triangulaire supérieure, de diagonale $(1, 1 - \alpha, \dots, 1 - \alpha)$ : 
    $$\boxed{\det A = (1 + n\alpha)(1 - \alpha)^{n}}$$
     Ce résultat a été vérifié pour $1 \leqslant n \leqslant 6$ ✓. Par la question 1, $\boxed{\alpha = 1 \text{ ou } \alpha = -\frac{1}{n}}$.

    • Si $\alpha = 1$, on a $\lVert e_{i} - e_{j} \rVert^{2} = 2 - 2\alpha = 0$ : tous les vecteurs sont égaux, et $e_{1} + \cdots + e_{n + 1} = (n + 1)e_{1}$.

    • Si $\alpha = -\frac{1}{n}$, on développe : 
    $$\Big\|\sum_{i = 1}^{n + 1} e_{i}\Big\|^{2} = \sum_{i} \lVert e_{i} \rVert^{2} + \sum_{i \neq j} \langle e_{i}, e_{j} \rangle = (n + 1) - (n + 1)n\cdot\frac{1}{n} = 0, \qquad\text{d'où}\qquad \boxed{e_{1} + \cdots + e_{n + 1} = 0}$$

    Les $n + 1$ vecteurs sont les sommets d'un simplexe régulier centré en $0$ : un triangle équilatéral pour $n = 2$, avec $\alpha = -\frac{1}{2}$, c'est-à-dire des angles de $120^{\circ}$, et un tétraèdre régulier pour $n = 3$.

    **3.** On commence par l'hyperplan $H$ d'équation $y_{0} + \cdots + y_{n} = 0$ de $\mathbb{R}^{n + 1}$, de dimension $n$, de vecteur normal $w = (1, \dots, 1)$, avec $\lVert w \rVert^{2} = n + 1$. Soit $(f_{0}, \dots, f_{n})$ la base canonique de $\mathbb{R}^{n + 1}$, et $g_{i} = p_{H}(f_{i}) = f_{i} - \frac{1}{n + 1}w$ (proposition 13, avec $\langle f_{i}, w \rangle = 1$). En développant, 
    $$\langle g_{i}, g_{j} \rangle = \delta_{ij} - \frac{2}{n + 1} + \frac{n + 1}{(n + 1)^{2}} = \delta_{ij} - \frac{1}{n + 1}, \qquad\text{donc}\qquad \lVert g_{i} \rVert^{2} = \frac{n}{n + 1}.$$
     Les vecteurs $x_{i} = \sqrt{\frac{n + 1}{n}}\,g_{i}$ de $H$ sont unitaires, et $\langle x_{i}, x_{j} \rangle = \frac{n + 1}{n}\cdot\big(-\frac{1}{n + 1}\big) = -\frac{1}{n}$ pour $i \neq j$.

    Soit maintenant $E$ euclidien de dimension $n$, $(h_{1}, \dots, h_{n})$ une base orthonormée de $H$ et $(\eta_{1}, \dots, \eta_{n})$ une base orthonormée de $E$, qui existent par le théorème 5. Soit $\varphi : H \to E$ l'application linéaire qui envoie $h_{k}$ sur $\eta_{k}$ (chapitre 14, théorème 4). Un vecteur de $H$ et son image ont les mêmes coordonnées, l'un dans $(h_{k})$, l'autre dans $(\eta_{k})$, et la proposition 8 calcule leurs produits scalaires par la même formule $\sum_{k} y_{k}z_{k}$ : $\varphi$ conserve le produit scalaire. Les vecteurs $\varphi(x_{0})$, …, $\varphi(x_{n})$ conviennent. 
    $$\boxed{\text{il existe } x_{0}, \dots, x_{n} \in E \text{ unitaires tels que } \langle x_{i}, x_{j} \rangle = -\frac{1}{n} \ (i \neq j)}$$

    **4.** On place l'atome de carbone à l'origine de l'espace $\mathbb{R}^{3}$, et l'on note $e_{1}$, …, $e_{4}$ les vecteurs unitaires dirigés selon les quatre liaisons ; ce choix d'unité ne change pas les angles. Par hypothèse, $\langle e_{i}, e_{j} \rangle = \cos\theta$ pour $i \neq j$, où $\theta$ est l'angle commun. On est dans la situation de la question 2 avec $n = 3$ : $\cos\theta = 1$ est exclu, puisque les quatre liaisons seraient confondues, et il reste $\cos\theta = -\frac{1}{3}$. 
    $$\boxed{\theta = \arccos\Big(-\frac{1}{3}\Big) \approx 109{,}47^{\circ}}$$
     La question 2 montre de plus que $e_{1} + e_{2} + e_{3} + e_{4} = 0$ : le carbone est au centre de gravité des quatre hydrogènes, qui forment un tétraèdre régulier.

    ![Figure](documents/figures/ad99c7f2023681e5.svg)

    Les quatre hydrogènes occupent un sommet sur deux du cube $[-1\,,1]^{3}$, aux points $(1, 1, 1)$, $(1, -1, -1)$, $(-1, 1, -1)$ et $(-1, -1, 1)$ : ces vecteurs ont pour norme $\sqrt{3}$ et leurs produits scalaires deux à deux valent $-1$, d'où un cosinus égal à $-\frac{1}{3}$, comme le prévoit la question 2.

    *À retenir.* Le résultat n'utilise que la géométrie : quatre directions issues d'un point, faisant deux à deux le même angle, forment nécessairement cet angle de $109{,}47^{\circ}$ environ, appelé angle tétraédrique. L'hypothèse de modélisation est l'égalité des angles ; le déterminant de Gram fait le reste.
