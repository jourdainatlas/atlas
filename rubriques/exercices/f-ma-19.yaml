  enonce: |
    *La matrice de Hilbert.* Pour $n \in \mathbb{N}$, on note 
    $$H_{n} = \Big(\frac{1}{i + j + 1}\Big)_{0 \leqslant i, j \leqslant n} \in \mathcal{M}_{n + 1}(\mathbb{R}).$$

    **1.** Montrer que $H_{n}$ est la matrice de Gram de la famille $(1, X, \dots, X^{n})$ pour le produit scalaire défini sur $\mathbb{R}[X]$ par $\langle P, Q \rangle = \int_{0}^{1} PQ$. En calculant ${X}^{T}H_{n}X$ pour une colonne $X \in \mathcal{M}_{n + 1,1}(\mathbb{R})$, montrer que $H_{n}$ est inversible. On comparera avec l'exercice 48 de la feuille du chapitre 17.

    **2.** Montrer que, pour tout polynôme $Q \in \mathbb{R}[X]$, 
    $$\int_{-1}^{1} Q(t)\,\mathrm{d} t = -\mathrm{i}\int_{0}^{\pi} Q(\mathrm{e}^{\mathrm{i}\theta})\,\mathrm{e}^{\mathrm{i}\theta}\,\mathrm{d}\theta.$$

    **3.** En déduire l'inégalité de Hilbert : pour tous réels $a_{0}$, …, $a_{n}$, 
    $$\sum_{0 \leqslant k, \ell \leqslant n} \frac{a_{k}a_{\ell}}{k + \ell + 1} \leqslant \pi\sum_{k = 0}^{n} a_{k}^{2}.$$
     On pourra utiliser l'égalité suivante, établie à l'exercice 52 de la feuille du chapitre 6, où l'on a noté $P = \sum_{k = 0}^{n} a_{k}X^{k}$ : 
    $$\int_{0}^{2\pi} \big|P(\mathrm{e}^{\mathrm{i}\theta})\big|^{2}\,\mathrm{d}\theta = 2\pi\sum_{k = 0}^{n} a_{k}^{2}.$$
  corrige: |
    **1.** Pour $0 \leqslant i, j \leqslant n$, la primitive usuelle de $t \mapsto t^{i + j}$ donne 
    $$\langle X^{i}, X^{j} \rangle = \int_{0}^{1} t^{i + j}\,\mathrm{d} t = \frac{1}{i + j + 1},$$
     et $H_{n}$ est bien la matrice de Gram $\big(\langle X^{i}, X^{j} \rangle\big)_{i, j}$ de la famille $(1, X, \dots, X^{n})$. Soit $X = (x_{0}, \dots, x_{n})$ une colonne, et $P = \sum_{i} x_{i}X^{i}$. Par bilinéarité, 
    $${X}^{T}H_{n}X = \sum_{i = 0}^{n}\sum_{j = 0}^{n} x_{i}x_{j}\langle X^{i}, X^{j} \rangle = \Big\langle \sum_{i} x_{i}X^{i}, \sum_{j} x_{j}X^{j}\Big\rangle = \int_{0}^{1} P(t)^{2}\,\mathrm{d} t.$$
     Si $H_{n}X = 0$, alors ${X}^{T}H_{n}X = 0$, donc $\lVert P \rVert^{2} = 0$, et $P = 0$, puisque la formule définit un produit scalaire sur $\mathbb{R}[X]$ (proposition 2 (ii)) : tous les $x_{i}$ sont nuls. Le noyau de $H_{n}$ est réduit à $\{0\}$, et $H_{n}$ est inversible (chapitre 16, théorème 3). 
    $$\boxed{H_{n} = \big(\langle X^{i}, X^{j} \rangle\big)_{0 \leqslant i, j \leqslant n}, \qquad {X}^{T}H_{n}X = \int_{0}^{1} P^{2} > 0 \text{ si } X \neq 0, \qquad H_{n} \in \mathrm{GL}_{n + 1}(\mathbb{R})}$$
     L'exercice 48 de la feuille du chapitre 17 obtenait l'inversibilité en calculant le déterminant de Cauchy, après de lourdes manipulations de lignes et de colonnes. Ici, aucun calcul : l'inversibilité vient de ce que $(1, X, \dots, X^{n})$ est libre et que l'intégrale de $P^{2}$ est un produit scalaire. La proposition 9 (ii), appliquée dans une base orthonormée de l'espace euclidien $\mathbb{R}_{n}[X]$, donne même $\det H_{n} > 0$ ; le calcul donne $\det H_{1} = \frac{1}{12}$, $\det H_{2} = \frac{1}{2160}$ et $\det H_{3} = \frac{1}{6\,048\,000}$, valeurs très petites qui expliquent la réputation numérique de cette matrice. ✓

    **2.** Les deux membres dépendent linéairement de $Q$, par linéarité de l'intégrale (chapitre 18, théorème 3, et proposition 8 pour les fonctions complexes) : il suffit de vérifier l'égalité pour $Q = X^{k}$, $k \in \mathbb{N}$. On intègre au moyen des primitives usuelles : celle de $t^{k}$ à gauche, celle de $\theta \mapsto \mathrm{e}^{\mathrm{i}(k + 1)\theta}$, qui est $\theta \mapsto \frac{\mathrm{e}^{\mathrm{i}(k + 1)\theta}}{\mathrm{i}(k + 1)}$, à droite. 
    $$\int_{-1}^{1} t^{k}\,\mathrm{d} t = \frac{1 - (-1)^{k + 1}}{k + 1} = \frac{1 + (-1)^{k}}{k + 1}, \qquad -\mathrm{i}\int_{0}^{\pi} \mathrm{e}^{\mathrm{i}(k + 1)\theta}\,\mathrm{d}\theta = -\mathrm{i} \cdot \frac{(-1)^{k + 1} - 1}{\mathrm{i}(k + 1)} = \frac{1 + (-1)^{k}}{k + 1}.$$

    $$\boxed{\forall\,Q \in \mathbb{R}[X], \quad \int_{-1}^{1} Q(t)\,\mathrm{d} t = -\mathrm{i}\int_{0}^{\pi} Q(\mathrm{e}^{\mathrm{i}\theta})\,\mathrm{e}^{\mathrm{i}\theta}\,\mathrm{d}\theta}$$
     Pour $Q = (1 + X)^{3} + 2X^{4}$, les deux membres valent $\frac{24}{5}$, d'après un calcul symbolique. ✓ On peut lire cette égalité comme le fait qu'on va de $-1$ à $1$ « par le segment » ou « par le demi-cercle supérieur » avec la même intégrale : c'est une première rencontre avec l'intégration le long d'un chemin du plan complexe.

    **3.** Avec $X = (a_{0}, \dots, a_{n})$, la question 1 donne $\sum_{k, \ell} \frac{a_{k}a_{\ell}}{k + \ell + 1} = \int_{0}^{1} P^{2}$. Comme $P^{2} \geqslant 0$ sur $[-1\,,0]$, la relation de Chasles et la positivité de l'intégrale donnent $\int_{0}^{1} P^{2} \leqslant \int_{-1}^{1} P^{2}$. On applique la question 2 au polynôme $Q = P^{2}$ ; le premier membre étant un réel positif, il est égal à son module, et l'inégalité triangulaire complexe (chapitre 18, théorème 5), avec $|\mathrm{e}^{\mathrm{i}\theta}| = 1$, donne 
    $$\int_{-1}^{1} P^{2} = \Big|\int_{0}^{\pi} P(\mathrm{e}^{\mathrm{i}\theta})^{2}\,\mathrm{e}^{\mathrm{i}\theta}\,\mathrm{d}\theta\Big| \leqslant \int_{0}^{\pi} \big|P(\mathrm{e}^{\mathrm{i}\theta})\big|^{2}\,\mathrm{d}\theta.$$
     Les coefficients $a_{k}$ étant réels, $P(\mathrm{e}^{-\mathrm{i}\theta}) = \overline{P(\mathrm{e}^{\mathrm{i}\theta})}$ : la fonction $h : \theta \mapsto |P(\mathrm{e}^{\mathrm{i}\theta})|^{2}$ est paire, et $2\pi$-périodique. La proposition 6 du chapitre 6 donne alors 
    $$\int_{0}^{\pi} h = \frac{1}{2}\int_{-\pi}^{\pi} h = \frac{1}{2}\int_{0}^{2\pi} h = \frac{1}{2} \times 2\pi\sum_{k = 0}^{n} a_{k}^{2},$$
     la dernière égalité étant celle de l'indication. En enchaînant les inégalités : 
    $$\boxed{\sum_{0 \leqslant k, \ell \leqslant n} \frac{a_{k}a_{\ell}}{k + \ell + 1} = \int_{0}^{1} P^{2} \leqslant \int_{-1}^{1} P^{2} \leqslant \int_{0}^{\pi} \big|P(\mathrm{e}^{\mathrm{i}\theta})\big|^{2}\,\mathrm{d}\theta = \pi\sum_{k = 0}^{n} a_{k}^{2}}$$
     Pour $(a_{0}, a_{1}, a_{2}, a_{3}) = (1, -2, 3, 1)$, la chaîne s'écrit $\frac{83}{42} \leqslant \frac{230}{21} \leqslant 15\pi$, ce que confirme un calcul symbolique. ✓

    *À retenir.* La constante $\pi$ ne dépend pas de $n$ : c'est ce qui fait la force de l'inégalité. On peut montrer, ce que l'on admet, qu'elle ne peut pas être remplacée par une constante plus petite valable pour tout $n$ ; la plus grande valeur du quotient $\frac{{X}^{T}H_{n}X}{{X}^{T}X}$, calculée numériquement, vaut environ $1{,}27$ pour $n = 1$, $1{,}92$ pour $n = 20$ et $2{,}27$ pour $n = 200$ : elle s'approche de $\pi$ très lentement.
- id: "ma-19-28"
  feuille: "f-ma-19"
  numero: 28
  partie: "Projection orthogonale sur un sous-espace de dimension finie"
  etoiles: 1
  types: [Calcul]
  mots_cles: [projection orthogonale, produits scalaires, orthogonalité, matrices et produit scalaire]
  noeuds: [fq-orthogonalite, me-produit-scalaire, v-matrices]
  notions: [projection-orthogonale, produit-scalaire, vecteurs-orthogonaux]
  page_enonce: 8
  page_corrige: 27
  enonce: |
    On se place dans $\mathbb{R}^{3}$, muni du produit scalaire canonique.

    **1.** Déterminer la distance du vecteur $u = (3, 4, 3)$ au plan $P$ d'équation $2x + y - z = 0$.

    **2.** Soit $H$ le plan d'équation $x + y + 2z = 0$. Déterminer la matrice, dans la base canonique, de la projection orthogonale $p_{H}$, puis celle de la symétrie $s$ par rapport à $H$ parallèlement à $H^{\perp}$. Vérifier que cette dernière matrice est symétrique et que son carré vaut $I_{3}$.
  corrige: |
    **1.** Par la proposition 12 (iii), le vecteur $n = (2, 1, -1)$ est normal au plan $P$, et $P = \mathrm{Vect}(n)^{\perp}$. On a $\langle u, n \rangle = 6 + 4 - 3 = 7$ et $\lVert n \rVert^{2} = 6$ ; la proposition 13 donne la distance, et le projeté : 
    $$\boxed{d(u, P) = \frac{|\langle u, n \rangle|}{\lVert n \rVert} = \frac{7}{\sqrt{6}} = \frac{7\sqrt{6}}{6}}, \qquad \boxed{p_{P}(u) = u - \frac{7}{6}n = \Big(\frac{2}{3}, \frac{17}{6}, \frac{25}{6}\Big)}$$
     On contrôle que $p_{P}(u)$ appartient à $P$ : $\frac{4}{3} + \frac{17}{6} - \frac{25}{6} = \frac{8 + 17 - 25}{6} = 0$. ✓

    **2.** Le vecteur $n = (1, 1, 2)$ est normal à $H$, avec $\lVert n \rVert^{2} = 6$. Par la proposition 13, $p_{H}(x) = x - \frac{\langle x, n \rangle}{6}n$. En colonnes, $\langle x, n \rangle n = n({n}^{T}X) = (n{n}^{T})X$, de sorte que la matrice de $p_{H}$ est $I_{3} - \frac{1}{6}n{n}^{T}$, avec 
    $$n{n}^{T} = \begin{pmatrix} 1 & 1 & 2 \\ 1 & 1 & 2 \\ 2 & 2 & 4 \end{pmatrix}, \qquad \boxed{\mathrm{Mat}(p_{H}) = \frac{1}{6}\begin{pmatrix} 5 & -1 & -2 \\ -1 & 5 & -2 \\ -2 & -2 & 2 \end{pmatrix}}$$
     On contrôle que $p_{H}(n) = 0$ et que $p_{H}(1, -1, 0) = (1, -1, 0)$, vecteur de $H$. ✓ La symétrie par rapport à $H$ parallèlement à $H^{\perp}$ est $s = 2p_{H} - \mathrm{id}$ (chapitre 14, définition des symétries), de matrice $S = I_{3} - \frac{1}{3}n{n}^{T}$ : 
    $$\boxed{S = \mathrm{Mat}(s) = \frac{1}{3}\begin{pmatrix} 2 & -1 & -2 \\ -1 & 2 & -2 \\ -2 & -2 & -1 \end{pmatrix}}$$
     Elle est symétrique, puisque ${(n{n}^{T})}^{T} = n{n}^{T}$. Comme ${n}^{T}n = \lVert n \rVert^{2} = 6$, on a 
    $$(n{n}^{T})^{2} = n({n}^{T}n){n}^{T} = 6\,n{n}^{T}, \qquad\text{donc}\qquad \boxed{S^{2} = I_{3} - \frac{2}{3}n{n}^{T} + \frac{1}{9}\times 6\,n{n}^{T} = I_{3}}$$
     ce que confirme le produit des matrices. ✓

    *À retenir.* Les deux propriétés vérifiées donnent ${S}^{T}S = S^{2} = I_{3}$ : les colonnes de $S$ forment une base orthonormée (remarque qui suit la proposition 9), et $s$ conserve la norme. Une symétrie par rapport à $H$ parallèlement à une autre droite que $H^{\perp}$ vérifierait encore $S^{2} = I_{3}$, mais sa matrice ne serait pas symétrique.
- id: "ma-19-29"
  feuille: "f-ma-19"
  numero: 29
  partie: "Projection orthogonale sur un sous-espace de dimension finie"
  etoiles: 1
  types: [Calcul]
  mots_cles: [projection orthogonale, orthogonalité]
  noeuds: [fq-orthogonalite, me-produit-scalaire]
  notions: [projection-orthogonale, vecteurs-orthogonaux, produit-scalaire]
  page_enonce: 8
  page_corrige: 28
  enonce: |
    Dans $\mathbb{R}^{4}$, déterminer le projeté orthogonal du vecteur $u = (1, 8, 1, 1)$ sur le sous-espace $F$ d'équations $x + y + t = 0$ et $x + y + 2z - t = 0$, et la distance de $u$ à $F$.
  corrige: |
    Les deux équations de $F$ s'écrivent $\langle x, n_{1} \rangle = 0$ et $\langle x, n_{2} \rangle = 0$, où l'on a posé $n_{1} = (1, 1, 0, 1)$ et $n_{2} = (1, 1, 2, -1)$, vecteurs non colinéaires. Ainsi $F = \mathrm{Vect}(n_{1}, n_{2})^{\perp}$, et, par la proposition 11, $F^{\perp} = \mathrm{Vect}(n_{1}, n_{2})$, de dimension $2$, comme $F$. Il est plus court de projeter $u$ sur $F^{\perp}$, puis d'utiliser $p_{F} = \mathrm{id} - p_{F^{\perp}}$ (proposition 10 (iii)). Comme $\langle n_{1}, n_{2} \rangle = 1 \neq 0$, la base $(n_{1}, n_{2})$ n'est pas orthogonale : on écrit $p_{F^{\perp}}(u) = \alpha n_{1} + \beta n_{2}$, et l'on résout les équations normales (proposition 10 (ii)), avec $\langle u, n_{1} \rangle = 10$, $\langle u, n_{2} \rangle = 10$, $\lVert n_{1} \rVert^{2} = 3$ et $\lVert n_{2} \rVert^{2} = 7$ : 
    $$\left\{ \begin{array}{l} 3\alpha + \beta = 10 \\ \alpha + 7\beta = 10 \end{array} \right. \qquad\text{d'où}\qquad \alpha = 3, \quad \beta = 1, \quad p_{F^{\perp}}(u) = 3n_{1} + n_{2} = (4, 4, 2, 2).$$

    $$\boxed{p_{F}(u) = u - (4, 4, 2, 2) = (-3, 4, -1, -1), \qquad d(u, F) = \lVert (4, 4, 2, 2) \rVert = \sqrt{40} = 2\sqrt{10}}$$
     On contrôle que $p_{F}(u)$ vérifie les deux équations : $-3 + 4 - 1 = 0$ et $-3 + 4 - 2 + 1 = 0$. ✓

    *Piège.* L'erreur la plus répandue est d'additionner les projetés de $u$ sur les deux droites $\mathrm{Vect}(n_{1})$ et $\mathrm{Vect}(n_{2})$, ce qui donnerait $\frac{10}{3}n_{1} + \frac{10}{7}n_{2}$ : la formule de la proposition 10 (i) exige une base orthogonale (première remarque qui suit cette proposition), et $n_{1}$, $n_{2}$ ne sont pas orthogonaux.
- id: "ma-19-30"
  feuille: "f-ma-19"
  numero: 30
  partie: "Projection orthogonale sur un sous-espace de dimension finie"
  etoiles: 1
  types: [Calcul]
  mots_cles: [projection orthogonale, orthogonalité, bases orthonormées, matrices et produit scalaire]
  noeuds: [fq-orthogonalite, me-produit-scalaire, fq-bases-orthogonales, v-matrices]
  notions: [projection-orthogonale, vecteurs-orthogonaux, base-orthogonale, produit-scalaire]
  page_enonce: 8
  page_corrige: 28
  enonce: |
    Dans $\mathbb{R}^{4}$, on considère le sous-espace $G$ d'équations $x_{1} + x_{2} = 0$ et $x_{3} + x_{4} = 0$.

    **1.** Déterminer une base orthonormée de $G$.

    **2.** Déterminer la matrice, dans la base canonique, de la projection orthogonale $p_{G}$.

    **3.** Pour $x = (x_{1}, x_{2}, x_{3}, x_{4}) \in \mathbb{R}^{4}$, calculer la distance de $x$ à $G$.
  corrige: |
    **1.** Les deux équations sont indépendantes, donc $G$ est de dimension $2$ (chapitre 15, théorème 13). Les vecteurs $(1, -1, 0, 0)$ et $(0, 0, 1, -1)$ appartiennent à $G$, et ils sont orthogonaux : il suffit de les normaliser. 
    $$\boxed{\varepsilon_{1} = \frac{1}{\sqrt{2}}(1, -1, 0, 0), \qquad \varepsilon_{2} = \frac{1}{\sqrt{2}}(0, 0, 1, -1)}$$

    **2.** Par la proposition 10 (i), $p_{G}(x) = \langle x, \varepsilon_{1} \rangle\varepsilon_{1} + \langle x, \varepsilon_{2} \rangle\varepsilon_{2}$, avec $\langle x, \varepsilon_{1} \rangle\varepsilon_{1} = \frac{x_{1} - x_{2}}{2}(1, -1, 0, 0)$ et $\langle x, \varepsilon_{2} \rangle\varepsilon_{2} = \frac{x_{3} - x_{4}}{2}(0, 0, 1, -1)$. 
    $$\boxed{\mathrm{Mat}(p_{G}) = \frac{1}{2}\begin{pmatrix} 1 & -1 & 0 & 0 \\ -1 & 1 & 0 & 0 \\ 0 & 0 & 1 & -1 \\ 0 & 0 & -1 & 1 \end{pmatrix}}$$

    **3.** Par le théorème 7, $d(x, G) = \lVert x - p_{G}(x) \rVert$, et 
    $$x - p_{G}(x) = \frac{x_{1} + x_{2}}{2}(1, 1, 0, 0) + \frac{x_{3} + x_{4}}{2}(0, 0, 1, 1),$$
     somme de deux vecteurs orthogonaux de normes au carré $\frac{(x_{1} + x_{2})^{2}}{4} \times 2$ et $\frac{(x_{3} + x_{4})^{2}}{4} \times 2$ : le théorème de Pythagore conclut. 
    $$\boxed{d(x, G) = \sqrt{\frac{(x_{1} + x_{2})^{2} + (x_{3} + x_{4})^{2}}{2}}}$$
     Le résultat se lit directement : $x - p_{G}(x)$ est le projeté de $x$ sur $G^{\perp} = \mathrm{Vect}\big((1, 1, 0, 0), (0, 0, 1, 1)\big)$, et la distance à $G$ ne dépend que des premiers membres des équations de $G$, nuls exactement sur $G$.
- id: "ma-19-31"
  feuille: "f-ma-19"
  numero: 31
  partie: "Projection orthogonale sur un sous-espace de dimension finie"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [projection orthogonale, produits scalaires, orthogonalité, produits scalaires intégraux, polynômes orthogonaux]
  noeuds: [fq-orthogonalite, me-produit-scalaire, ri-proprietes, pol-anneau]
  notions: [projection-orthogonale, produit-scalaire, vecteurs-orthogonaux]
  page_enonce: 8
  page_corrige: 29
  enonce: |
    Soit $n \geqslant 1$ et $\displaystyle H = \Big\{P \in \mathbb{R}_{n}[X] \;\Big|\; \int_{0}^{1} P(t)\,\mathrm{d} t = 0\Big\}$.

    **1.** Montrer que $H$ est un sous-espace de $\mathbb{R}_{n}[X]$, et calculer sa dimension.

    **2.** Justifier que $\mathbb{R}_{n}[X] = \mathbb{R}_{0}[X] \oplus H$, et expliciter le projecteur sur $\mathbb{R}_{0}[X]$ parallèlement à $H$.

    **3.** Donner un produit scalaire sur $\mathbb{R}_{n}[X]$ pour lequel ce projecteur est la projection orthogonale sur $\mathbb{R}_{0}[X]$.
  corrige: |
    **1.** L'application $\varphi : P \mapsto \int_{0}^{1} P(t)\,\mathrm{d} t$ est une forme linéaire sur $\mathbb{R}_{n}[X]$ (chapitre 18, théorème 3), non nulle puisque $\varphi(1) = 1$. Son noyau $H$ est un hyperplan de $\mathbb{R}_{n}[X]$, qui est de dimension $n + 1$ (chapitre 15, théorème 12). 
    $$\boxed{H = \mathrm{Ker}\,\varphi \text{ est un sous-espace de } \mathbb{R}_{n}[X], \qquad \dim H = n}$$

    **2.** La droite $\mathbb{R}_{0}[X]$ des polynômes constants n'est pas contenue dans $H$, puisque $1 \notin H$ : par le théorème 7 du chapitre 14, $\mathbb{R}_{n}[X] = \mathbb{R}_{0}[X] \oplus H$. La décomposition de $P$ s'écrit explicitement : la constante $c = \int_{0}^{1} P$ vérifie $\int_{0}^{1} (P - c) = c - c = 0$, donc $P = c + (P - c)$ avec $c \in \mathbb{R}_{0}[X]$ et $P - c \in H$. 
    $$\boxed{p(P) = \int_{0}^{1} P(t)\,\mathrm{d} t \quad \text{(polynôme constant)}}$$

    **3.** On munit $\mathbb{R}_{n}[X]$ du produit scalaire $\langle P, Q \rangle = \int_{0}^{1} PQ$ (proposition 2 (ii), restreinte à $\mathbb{R}_{n}[X]$). Pour lui, $H = \{P \mid \langle P, 1 \rangle = 0\} = \mathbb{R}_{0}[X]^{\perp}$ : le projecteur sur $\mathbb{R}_{0}[X]$ parallèlement à $H$ est le projecteur sur $\mathbb{R}_{0}[X]$ parallèlement à $\mathbb{R}_{0}[X]^{\perp}$, c'est-à-dire la projection orthogonale sur $\mathbb{R}_{0}[X]$. 
    $$\boxed{\langle P, Q \rangle = \int_{0}^{1} P(t)Q(t)\,\mathrm{d} t}$$
     La proposition 10 (i) le confirme : $\lVert 1 \rVert = 1$, et le projeté de $P$ sur $\mathrm{Vect}(1)$ est $\langle P, 1 \rangle\,1 = \int_{0}^{1} P$. ✓ La réponse n'est pas unique : tout produit scalaire pour lequel $1$ est orthogonal à $H$ convient. Ainsi la projection orthogonale sur une droite calcule une moyenne, et le choix du produit scalaire décide de laquelle.
- id: "ma-19-32"
  feuille: "f-ma-19"
  numero: 32
  partie: "Projection orthogonale sur un sous-espace de dimension finie"
  etoiles: 1
  types: [Calcul]
  mots_cles: [projection orthogonale, produits scalaires, orthogonalité, bases orthonormées]
  noeuds: [fq-orthogonalite, me-produit-scalaire, fq-bases-orthogonales]
  notions: [projection-orthogonale, produit-scalaire, vecteurs-orthogonaux, base-orthogonale]
  page_enonce: 8
  page_corrige: 29
  enonce: |
    On munit $\mathcal{M}_{2}(\mathbb{R})$ du produit scalaire $\langle M, N \rangle = \operatorname{tr}({M}^{T}N)$, et l'on considère 
    $$F = \Big\{\begin{pmatrix} a & b \\ -b & a \end{pmatrix} \;\Big|\; (a, b) \in \mathbb{R}^{2}\Big\} \qquad\text{et}\qquad J = \begin{pmatrix} 1 & 1 \\ 1 & 1 \end{pmatrix}.$$

    **1.** Déterminer une base orthonormée de $F^{\perp}$.

    **2.** Calculer le projeté orthogonal de $J$ sur $F^{\perp}$.

    **3.** En déduire la distance de $J$ à $F$.
  corrige: |
    **1.** On a $F = \mathrm{Vect}(I_{2}, K)$ avec $K = \begin{pmatrix} 0 & 1 \\ -1 & 0 \end{pmatrix}$, famille libre, donc $\dim F = 2$ et $\dim F^{\perp} = 2$ (proposition 11). Pour $M = \begin{pmatrix} p & q \\ r & s \end{pmatrix}$, le produit scalaire se calcule en multipliant les coefficients de même position (proposition 1 (ii)) : $\langle M, I_{2} \rangle = p + s$ et $\langle M, K \rangle = q - r$. Ainsi $M \in F^{\perp}$ si et seulement si $s = -p$ et $r = q$ : 
    $$F^{\perp} = \Big\{\begin{pmatrix} c & d \\ d & -c \end{pmatrix} \;\Big|\; (c, d) \in \mathbb{R}^{2}\Big\}.$$
     Les deux matrices obtenues pour $(c, d) = (1, 0)$ et $(0, 1)$ sont orthogonales, de norme $\sqrt{2}$ : 
    $$\boxed{E_{1} = \frac{1}{\sqrt{2}}\begin{pmatrix} 1 & 0 \\ 0 & -1 \end{pmatrix}, \qquad E_{2} = \frac{1}{\sqrt{2}}\begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}}$$

    **2.** On a $\langle J, E_{1} \rangle = \frac{1 - 1}{\sqrt{2}} = 0$ et $\langle J, E_{2} \rangle = \frac{2}{\sqrt{2}} = \sqrt{2}$ ; la proposition 10 (i) donne 
    $$\boxed{p_{F^{\perp}}(J) = \sqrt{2}\,E_{2} = \begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}}$$

    **3.** Par la proposition 10 (iii), $J - p_{F^{\perp}}(J) = p_{F}(J)$, donc $J - p_{F}(J) = p_{F^{\perp}}(J)$, et le théorème 7 donne : 
    $$\boxed{d(J, F) = \lVert p_{F^{\perp}}(J) \rVert = \sqrt{2}, \qquad p_{F}(J) = J - \begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix} = I_{2}}$$
     Un calcul direct le confirme : $\lVert J - (aI_{2} + bK) \rVert^{2} = 2(1 - a)^{2} + (1 - b)^{2} + (1 + b)^{2}$ est minimal pour $a = 1$, $b = 0$, et vaut alors $2$. ✓ Le sous-espace $F$ est formé des matrices qui représentent les nombres complexes $a + \mathrm{i} b$ agissant sur le plan par multiplication (au signe de $b$ près) ; parmi elles, la plus proche de $J$ est l'identité.
- id: "ma-19-33"
  feuille: "f-ma-19"
  numero: 33
  partie: "Projection orthogonale sur un sous-espace de dimension finie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [projection orthogonale, produits scalaires, orthogonalité]
  noeuds: [fq-orthogonalite, me-produit-scalaire]
  notions: [projection-orthogonale, produit-scalaire, vecteurs-orthogonaux]
  page_enonce: 8
  page_corrige: 30
  enonce: |
    Soit $E$ un espace préhilbertien réel, et $F$, $G$ deux sous-espaces de $E$.

    **1.** Montrer que $(F \cup G)^{\perp} = (F + G)^{\perp} = F^{\perp} \cap G^{\perp}$.

    **2.** Montrer que $F^{\perp} + G^{\perp} \subset (F \cap G)^{\perp}$.

    **3.** On suppose $E$ euclidien. Montrer que $(F \cap G)^{\perp} = F^{\perp} + G^{\perp}$, et que $(A^{\perp})^{\perp} = \mathrm{Vect}(A)$ pour toute partie $A$ de $E$.

    **4.** On munit $\mathbb{R}[X]$ du produit scalaire $\langle P, Q \rangle = \sum_{k} a_{k}b_{k}$, où $(a_{k})$ et $(b_{k})$ sont les suites des coefficients de $P$ et de $Q$, et l'on pose $F = \{P \in \mathbb{R}[X] \mid P(1) = 0\}$ et $G = \mathbb{R}_{0}[X]$. Montrer que $(F \cap G)^{\perp} \neq F^{\perp} + G^{\perp}$. On pourra utiliser la remarque qui suit la proposition 11 du cours.
  corrige: |
    **1.** Un vecteur $y$ est orthogonal à tous les éléments de $F \cup G$ si et seulement s'il est orthogonal à tous ceux de $F$ et à tous ceux de $G$ : $(F \cup G)^{\perp} = F^{\perp} \cap G^{\perp}$. Par ailleurs, $F + G$ est le sous-espace engendré par $F \cup G$ (chapitre 14, proposition 11), et la proposition 5 (ii) donne $A^{\perp} = (\mathrm{Vect} A)^{\perp}$. 
    $$\boxed{(F \cup G)^{\perp} = (F + G)^{\perp} = F^{\perp} \cap G^{\perp}}$$

    **2.** Comme $F \cap G \subset F$, la proposition 5 (ii) donne $F^{\perp} \subset (F \cap G)^{\perp}$, et de même $G^{\perp} \subset (F \cap G)^{\perp}$. Le sous-espace $(F \cap G)^{\perp}$ (proposition 5 (i)) contient donc la somme $F^{\perp} + G^{\perp}$. 
    $$\boxed{F^{\perp} + G^{\perp} \subset (F \cap G)^{\perp}}$$

    **3.** On applique la question 1 aux sous-espaces $F^{\perp}$ et $G^{\perp}$, puis la proposition 11, qui donne $(F^{\perp})^{\perp} = F$ en dimension finie : 
    $$(F^{\perp} + G^{\perp})^{\perp} = (F^{\perp})^{\perp} \cap (G^{\perp})^{\perp} = F \cap G.$$
     On prend l'orthogonal des deux membres, et l'on utilise encore la proposition 11 pour le sous-espace $F^{\perp} + G^{\perp}$. Pour une partie $A$ quelconque, la proposition 5 (ii) et la proposition 11 donnent $(A^{\perp})^{\perp} = ((\mathrm{Vect} A)^{\perp})^{\perp} = \mathrm{Vect} A$. 
    $$\boxed{(F \cap G)^{\perp} = F^{\perp} + G^{\perp}, \qquad (A^{\perp})^{\perp} = \mathrm{Vect}(A) \qquad (E \text{ euclidien})}$$

    **4.** La remarque qui suit la proposition 11 du cours, faite avec ce produit scalaire, établit que $F^{\perp} = \{0\}$ pour l'hyperplan $F = \{P \mid P(1) = 0\}$. Un polynôme constant $c$ appartient à $F$ si et seulement si $c = 0$ : $F \cap G = \{0\}$, d'où $(F \cap G)^{\perp} = \mathbb{R}[X]$. D'autre part, $G^{\perp} = \{1\}^{\perp}$ est l'ensemble des polynômes dont le coefficient constant $b_{0} = \langle Q, 1 \rangle$ est nul. Ainsi 
    $$\boxed{F^{\perp} + G^{\perp} = \{Q \in \mathbb{R}[X] \mid Q(0) = 0\} \neq \mathbb{R}[X] = (F \cap G)^{\perp}}$$
     puisque le polynôme $1$ n'appartient pas au membre de gauche.

    *À retenir.* Les deux formules de la question 3 reposent sur $(F^{\perp})^{\perp} = F$, c'est-à-dire sur la proposition 11, qui suppose la dimension finie. En dimension infinie, seule l'inclusion de la question 2 subsiste, et la question 4 montre qu'elle peut être stricte. L'exercice 39 donne un autre exemple de sous-espace d'orthogonal nul.
- id: "ma-19-34"
  feuille: "f-ma-19"
  numero: 34
  partie: "Projection orthogonale sur un sous-espace de dimension finie"
  etoiles: 2
  types: [Calcul]
  mots_cles: [projection orthogonale, produits scalaires, normes, matrices et produit scalaire]
  noeuds: [fq-orthogonalite, me-produit-scalaire, v-matrices]
  notions: [projection-orthogonale, produit-scalaire, norme]
  page_enonce: 9
  page_corrige: 30
  enonce: |
    On munit $\mathcal{M}_{n}(\mathbb{R})$ du produit scalaire $\langle A, B \rangle = \operatorname{tr}({A}^{T}B)$.

    **1.** Soit $M = (m_{ij}) \in \mathcal{M}_{n}(\mathbb{R})$. En notant $s_{ij}$ le coefficient d'indice $(i, j)$ d'une matrice $S$, déterminer 
    $$\inf_{S \in \mathcal{S}_{n}(\mathbb{R})} \sum_{i = 1}^{n}\sum_{j = 1}^{n} (m_{ij} - s_{ij})^{2}.$$

    **2.** On suppose $n \geqslant 2$, et l'on note $J$ la matrice dont tous les coefficients valent $1$. Soit $M \in \mathcal{M}_{n}(\mathbb{R})$ une matrice de trace nulle, et $s$ la somme de ses coefficients. Calculer 
    $$\inf\big\{\lVert M - \alpha I_{n} - \beta J \rVert \;\big|\; (\alpha, \beta) \in \mathbb{R}^{2}\big\}.$$
  corrige: |
    **1.** Par la proposition 1 (ii), la somme est $\lVert M - S \rVert^{2}$ : il s'agit de calculer $d(M, \mathcal{S}_{n}(\mathbb{R}))^{2}$. Le sous-espace $\mathcal{S}_{n}(\mathbb{R})$ est de dimension finie, et l'exemple qui suit la proposition 11 en donne le projeté : $p_{\mathcal{S}_{n}(\mathbb{R})}(M) = \frac{1}{2}(M + {M}^{T})$, avec $M - p_{\mathcal{S}_{n}(\mathbb{R})}(M) = \frac{1}{2}(M - {M}^{T})$. Par le théorème 7 : 
    $$\boxed{\inf_{S \in \mathcal{S}_{n}(\mathbb{R})} \sum_{i, j} (m_{ij} - s_{ij})^{2} = \frac{1}{4}\sum_{i = 1}^{n}\sum_{j = 1}^{n} (m_{ij} - m_{ji})^{2} = \frac{1}{2}\sum_{i < j} (m_{ij} - m_{ji})^{2}}$$
     La borne inférieure est un minimum, atteint pour la seule matrice $S = \frac{1}{2}(M + {M}^{T})$. Elle est nulle si et seulement si $M$ est symétrique, ce qui est cohérent.

    **2.** On projette $M$ sur $F = \mathrm{Vect}(I_{n}, J)$, qui est un plan puisque $J$ n'est pas proportionnelle à $I_{n}$ pour $n \geqslant 2$. On a $\langle I_{n}, J \rangle = \operatorname{tr} J = n = \lVert I_{n} \rVert^{2}$, de sorte que $J - I_{n}$ est orthogonale à $I_{n}$ : la famille $(I_{n}, J - I_{n})$ est une base orthogonale de $F$, avec $\lVert J - I_{n} \rVert^{2} = n^{2} - 2n + n = n(n - 1)$. Par ailleurs, $\langle M, I_{n} \rangle = \operatorname{tr} M = 0$ et $\langle M, J - I_{n} \rangle = s - 0 = s$. La formule de la proposition 10 (i), adaptée aux bases orthogonales, donne 
    $$p_{F}(M) = \frac{\langle M, I_{n} \rangle}{n}I_{n} + \frac{\langle M, J - I_{n} \rangle}{n(n - 1)}(J - I_{n}) = \frac{s}{n(n - 1)}(J - I_{n}), \qquad \lVert p_{F}(M) \rVert^{2} = \frac{s^{2}}{n(n - 1)}.$$
     Par le théorème 7, $d(M, F)^{2} = \lVert M \rVert^{2} - \lVert p_{F}(M) \rVert^{2}$ : 
    $$\boxed{\inf_{(\alpha, \beta) \in \mathbb{R}^{2}} \lVert M - \alpha I_{n} - \beta J \rVert = \sqrt{\sum_{i, j} m_{ij}^{2} - \frac{s^{2}}{n(n - 1)}}}$$
     atteinte pour $\beta = -\alpha = \frac{s}{n(n - 1)}$ seulement. Une minimisation numérique, sur des matrices de trace nulle tirées au hasard pour $n$ de $2$ à $5$, redonne cette valeur. ✓

    *Piège.* Pour $n = 1$, on a $J = I_{1}$ et la famille $(I_{n}, J)$ est liée ; c'est pourquoi l'énoncé suppose $n \geqslant 2$, et la formule, qui divise par $n(n - 1)$, n'a pas de sens pour $n = 1$. Remplacer $J$ par $J - I_{n}$, orthogonale à $I_{n}$, évite de résoudre le système des équations normales.
- id: "ma-19-35"
  feuille: "f-ma-19"
  numero: 35
  partie: "Projection orthogonale sur un sous-espace de dimension finie"
  etoiles: 2
  types: [Calcul]
  mots_cles: [projection orthogonale, produits scalaires intégraux]
  noeuds: [fq-orthogonalite, me-produit-scalaire, ri-proprietes]
  notions: [projection-orthogonale, produit-scalaire]
  page_enonce: 9
  page_corrige: 31
  enonce: |
    Calculer les bornes inférieures suivantes, en précisant en quels points elles sont atteintes. 
    $$\text{(a)}\ \inf_{(a, b) \in \mathbb{R}^{2}} \int_{0}^{1} \big(t - a\sqrt{t} - b\big)^{2}\,\mathrm{d} t \qquad\qquad \text{(b)}\ \inf_{(a, b) \in \mathbb{R}^{2}} \int_{0}^{2\pi} \big(t - a\cos t - b\sin t\big)^{2}\,\mathrm{d} t$$
  corrige: |
    *(a)* Toutes les intégrales à calculer sont celles de fonctions puissances $t \mapsto t^{\alpha}$, que l'on intègre par la primitive usuelle $\frac{t^{\alpha + 1}}{\alpha + 1}$. Dans $\mathcal{C}([0\,,1], \mathbb{R})$ muni de $\langle f, g \rangle = \int_{0}^{1} fg$, l'intégrale vaut $\lVert t - (a\sqrt{t} + b) \rVert^{2}$ : on cherche la distance de $t \mapsto t$ au plan $F = \mathrm{Vect}(\sqrt{t}, 1)$, la famille étant libre puisque $\sqrt{t}$ n'est pas constante. Par le théorème 7, la borne inférieure est atteinte pour un unique couple $(a, b)$, celui du projeté, caractérisé par les équations normales (proposition 10 (ii)). Avec 
    $$\lVert \sqrt{t} \rVert^{2} = \frac{1}{2}, \quad \langle \sqrt{t}, 1 \rangle = \frac{2}{3}, \quad \lVert 1 \rVert^{2} = 1, \quad \langle t, \sqrt{t} \rangle = \frac{2}{5}, \quad \langle t, 1 \rangle = \frac{1}{2},$$
     elles s'écrivent 
    $$\left\{ \begin{array}{l} \frac{a}{2} + \frac{2b}{3} = \frac{2}{5} \\[2mm] \frac{2a}{3} + b = \frac{1}{2} \end{array} \right. \qquad\text{d'où}\qquad a = \frac{6}{5}, \quad b = -\frac{3}{10}.$$
     Par le théorème 7, le carré de la distance vaut $\lVert t \rVert^{2} - \lVert p_{F}(t) \rVert^{2} = \langle t, t - p_{F}(t) \rangle$, puisque $t - p_{F}(t)$ est orthogonal à $p_{F}(t)$ ; or $\langle t, p_{F}(t) \rangle = a\cdot\frac{2}{5} + b\cdot\frac{1}{2} = \frac{12}{25} - \frac{3}{20} = \frac{33}{100}$. 
    $$\boxed{\inf_{(a, b) \in \mathbb{R}^{2}} \int_{0}^{1} \big(t - a\sqrt{t} - b\big)^{2}\,\mathrm{d} t = \frac{1}{3} - \frac{33}{100} = \frac{1}{300}, \quad \text{atteinte en } (a, b) = \Big(\frac{6}{5}, -\frac{3}{10}\Big) \text{ seulement}}$$
     Le résultat est confirmé en minimisant directement le polynôme du second degré en $(a, b)$ par un calcul symbolique. ✓ L'exercice 47 retrouvera cette valeur comme quotient de deux déterminants de Gram.

    *(b)* On calcule les produits scalaires $\int_{0}^{2\pi} t\cos t\,\mathrm{d} t$ et $\int_{0}^{2\pi} t\sin t\,\mathrm{d} t$ par une intégration par parties (chapitre 6, proposition 4), en dérivant $t$ : elle fait disparaître le facteur $t$. Dans $\mathcal{C}([0\,,2\pi], \mathbb{R})$ muni de $\langle f, g \rangle = \int_{0}^{2\pi} fg$, on cherche la distance de $t \mapsto t$ au plan $F = \mathrm{Vect}(\cos, \sin)$. L'exemple qui suit le théorème 3 donne une base orthogonale : $\langle \cos, \sin \rangle = 0$ et $\lVert \cos \rVert^{2} = \lVert \sin \rVert^{2} = \pi$. Les intégrations par parties donnent 
    $$\langle t, \cos \rangle = \big[t\sin t\big]_{0}^{2\pi} - \int_{0}^{2\pi} \sin t\,\mathrm{d} t = 0, \qquad \langle t, \sin \rangle = \big[-t\cos t\big]_{0}^{2\pi} + \int_{0}^{2\pi} \cos t\,\mathrm{d} t = -2\pi.$$
     Les fonctions $t\sin t + \cos t$ et $\sin t - t\cos t$ ont bien pour dérivées $t\cos t$ et $t\sin t$. ✓ La proposition 10 (i), sous sa forme adaptée aux bases orthogonales, donne $p_{F}(t) = \frac{0}{\pi}\cos + \frac{-2\pi}{\pi}\sin = -2\sin$, d'où $a = 0$ et $b = -2$. Avec $\lVert t \rVert^{2} = \int_{0}^{2\pi} t^{2}\,\mathrm{d} t = \frac{8\pi^{3}}{3}$ et $\lVert p_{F}(t) \rVert^{2} = 4\pi$, le théorème 7 donne 
    $$\boxed{\inf_{(a, b) \in \mathbb{R}^{2}} \int_{0}^{2\pi} \big(t - a\cos t - b\sin t\big)^{2}\,\mathrm{d} t = \frac{8\pi^{3}}{3} - 4\pi \approx 70{,}1, \quad \text{atteinte en } (a, b) = (0, -2) \text{ seulement}}$$
     La distance reste grande, du même ordre que $\lVert t \rVert^{2} \approx 82{,}7$ : une fonction qui croît de $0$ à $2\pi$ est mal approchée par des fonctions $2\pi$-périodiques, qui reprennent en $2\pi$ leur valeur en $0$.

    *Piège.* Dans (a), la famille $(\sqrt{t}, 1)$ n'est pas orthogonale : appliquer la formule de la proposition 10 (i) sans résoudre le système est l'erreur la plus répandue. Dans (b), c'est au contraire l'orthogonalité de $\cos$ et $\sin$ qui dispense de tout système.
- id: "ma-19-36"
  feuille: "f-ma-19"
  numero: 36
  partie: "Projection orthogonale sur un sous-espace de dimension finie"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [projection orthogonale, produits scalaires intégraux]
  noeuds: [fq-orthogonalite, me-produit-scalaire, ri-proprietes]
  notions: [projection-orthogonale, produit-scalaire]
  page_enonce: 9
  page_corrige: 32
  enonce: |
    Soit $f : [0\,,1] \to \mathbb{R}$ une fonction continue telle que 
    $$\int_{0}^{1} f(x)\,\mathrm{d} x = \int_{0}^{1} x f(x)\,\mathrm{d} x = 1.$$
     Montrer que $\int_{0}^{1} f(x)^{2}\,\mathrm{d} x \geqslant 4$, et déterminer les fonctions $f$ pour lesquelles il y a égalité.
  corrige: |
    Les intégrales à calculer sont celles de polynômes, que l'on intègre par les primitives usuelles. On munit $E = \mathcal{C}([0\,,1], \mathbb{R})$ du produit scalaire $\langle f, g \rangle = \int_{0}^{1} fg$ (proposition 2), et l'on note $F = \mathrm{Vect}(1, x)$, de dimension $2$. Les hypothèses s'écrivent $\langle f, 1 \rangle = \langle f, x \rangle = 1$.

    *Le projeté de $f$ sur $F$.* Par la proposition 10 (ii), $g = p_{F}(f)$ est l'unique élément de $F$ tel que $f - g$ soit orthogonal à $1$ et à $x$, c'est-à-dire tel que $\langle g, 1 \rangle = \langle g, x \rangle = 1$ : il est le même pour toutes les fonctions $f$ de l'énoncé. On cherche $g(x) = \alpha + \beta x$ : 
    $$\left\{ \begin{array}{l} \alpha + \frac{\beta}{2} = 1 \\[2mm] \frac{\alpha}{2} + \frac{\beta}{3} = 1 \end{array} \right. \qquad\text{d'où}\qquad \beta = 6, \quad \alpha = -2, \qquad \boxed{g(x) = 6x - 2}$$
     *L'inégalité.* On a $\lVert g \rVert^{2} = \int_{0}^{1} (36x^{2} - 24x + 4)\,\mathrm{d} x = 12 - 12 + 4 = 4$. Le théorème de Pythagore, appliqué à $f = g + (f - g)$, donne $\lVert f \rVert^{2} = 4 + \lVert f - g \rVert^{2}$ : 
    $$\boxed{\int_{0}^{1} f(x)^{2}\,\mathrm{d} x = 4 + \int_{0}^{1} \big(f(x) - 6x + 2\big)^{2}\,\mathrm{d} x \geqslant 4}$$
     *Le cas d'égalité.* Il y a égalité si et seulement si $\lVert f - g \rVert = 0$, c'est-à-dire $f = g$ ; et la fonction $g$ vérifie bien les deux conditions. 
    $$\boxed{\text{égalité} \iff f(x) = 6x - 2 \text{ pour tout } x \in [0\,,1]}$$
     On peut aussi conclure par l'inégalité de Cauchy-Schwarz : $\langle f, g \rangle = 6\langle f, x \rangle - 2\langle f, 1 \rangle = 4$, donc $4 \leqslant \lVert f \rVert\,\lVert g \rVert = 2\lVert f \rVert$, avec égalité seulement si $f$ est proportionnelle à $g$. Par exemple, $f = g + h$ avec $h(x) = x^{2} - x + \frac{1}{6}$, orthogonale à $1$ et à $x$, vérifie les hypothèses et donne $\lVert f \rVert^{2} = 4 + \frac{1}{180}$. ✓

    *À retenir.* Minimiser une norme sous des contraintes linéaires de la forme $\langle f, u_{i} \rangle = c_{i}$, c'est chercher le vecteur de plus petite norme d'un sous-espace affine : il appartient à $\mathrm{Vect}(u_{i})$, et il est orthogonal à la direction du sous-espace affine.
- id: "ma-19-37"
  feuille: "f-ma-19"
  numero: 37
  partie: "Projection orthogonale sur un sous-espace de dimension finie"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [projection orthogonale, produits scalaires, produits scalaires intégraux, polynômes orthogonaux]
  noeuds: [fq-orthogonalite, me-produit-scalaire, ri-proprietes, pol-anneau]
  notions: [projection-orthogonale, produit-scalaire]
  page_enonce: 9
  page_corrige: 33
  enonce: |
    On munit l'espace $E = \mathbb{R}_{3}[X]$ du produit scalaire défini par $\langle A, B \rangle = \int_{0}^{1} AB$, et l'on considère le polynôme $Q = 1 + X + X^{2} + X^{3}$.

    **1.** Montrer que l'ensemble 
    $$F = \Big\{P \in E \;\Big|\; \int_{0}^{1} (t^{3} - t)P'(t)\,\mathrm{d} t = \int_{0}^{1} P(t)\,\mathrm{d} t\Big\}$$
     est un sous-espace de $E$.

    **2.** Calculer $d(Q, F)$.
  corrige: |
    **1.** On intègre par parties (chapitre 6, proposition 4) le premier membre de la condition, en dérivant $t^{3} - t$ et en primitivant $P'$ : c'est le choix naturel, puisque $t^{3} - t$ s'annule en $0$ et en $1$, et que l'on veut faire apparaître $P$ seul. L'application 
    $$\psi : P \longmapsto \int_{0}^{1} (t^{3} - t)P'(t)\,\mathrm{d} t - \int_{0}^{1} P(t)\,\mathrm{d} t$$
     est linéaire, puisque la dérivation et l'intégrale le sont : $F = \mathrm{Ker}\,\psi$ est un sous-espace de $E$. 
    $$\boxed{F = \mathrm{Ker}\,\psi \text{ est un sous-espace de } E}$$

    **2.** L'intégration par parties annoncée donne, le crochet étant nul, 
    $$\int_{0}^{1} (t^{3} - t)P'(t)\,\mathrm{d} t = \Big[(t^{3} - t)P(t)\Big]_{0}^{1} - \int_{0}^{1} (3t^{2} - 1)P(t)\,\mathrm{d} t = -\int_{0}^{1} (3t^{2} - 1)P(t)\,\mathrm{d} t,$$

    $$\text{d'où}\qquad \psi(P) = -\int_{0}^{1} (3t^{2} - 1)P(t)\,\mathrm{d} t - \int_{0}^{1} P(t)\,\mathrm{d} t = -3\int_{0}^{1} t^{2}P(t)\,\mathrm{d} t = -3\langle P, X^{2} \rangle.$$
     Ainsi $F = \mathrm{Vect}(X^{2})^{\perp}$ est un hyperplan de vecteur normal $X^{2}$, et la proposition 13 s'applique, avec $\lVert X^{2} \rVert^{2} = \int_{0}^{1} t^{4}\,\mathrm{d} t = \frac{1}{5}$ et 
    $$\langle Q, X^{2} \rangle = \int_{0}^{1} (t^{2} + t^{3} + t^{4} + t^{5})\,\mathrm{d} t = \frac{1}{3} + \frac{1}{4} + \frac{1}{5} + \frac{1}{6} = \frac{19}{20}.$$

    $$\boxed{d(Q, F) = \frac{|\langle Q, X^{2} \rangle|}{\lVert X^{2} \rVert} = \frac{19}{20}\sqrt{5} = \frac{19\sqrt{5}}{20} \approx 2{,}12}$$
     Un calcul symbolique confirme que $\psi(P) = -3\langle P, X^{2} \rangle$ pour un polynôme $P$ de degré $3$ quelconque. ✓

    *Piège.* Le vecteur normal à $F$ est $X^{2}$, et non $X^{3} - X$ ou $3X^{2} - 1$, qui apparaissent dans les calculs : il faut d'abord écrire la condition sous la forme $\langle P, N \rangle = 0$ pour lire le vecteur normal $N$.
- id: "ma-19-38"
  feuille: "f-ma-19"
  numero: 38
  partie: "Projection orthogonale sur un sous-espace de dimension finie"
  etoiles: 2
  types: [Calcul]
  mots_cles: [projection orthogonale, produits scalaires, orthogonalité, bases orthonormées, polynômes orthogonaux]
  noeuds: [fq-orthogonalite, me-produit-scalaire, fq-bases-orthogonales, pol-anneau]
  notions: [projection-orthogonale, produit-scalaire, vecteurs-orthogonaux, base-orthogonale]
  page_enonce: 9
  page_corrige: 33
  enonce: |
    Soit $n \geqslant 1$ et $a_{0}$, …, $a_{n}$ des réels.

    **1.** À quelle condition sur $a_{0}$, …, $a_{n}$ la formule suivante définit-elle un produit scalaire sur $\mathbb{R}_{n}[X]$ ? 
    $$\langle P, Q \rangle = \sum_{k = 0}^{n} P(a_{k})Q(a_{k})$$
     On suppose désormais cette condition réalisée.

    **2.** Déterminer une base orthonormée de $\mathbb{R}_{n}[X]$.

    **3.** On pose 
    $$F = \Big\{P \in \mathbb{R}_{n}[X] \;\Big|\; \sum_{k = 0}^{n} P(a_{k}) = 0\Big\}.$$
     Déterminer $F^{\perp}$, puis la distance d'un polynôme $Q \in \mathbb{R}_{n}[X]$ à $F$. Expliciter $d(X^{n}, F)$.
  corrige: |
    **1.** Quels que soient les $a_{k}$, la formule est bilinéaire, symétrique, et $\langle P, P \rangle = \sum_{k} P(a_{k})^{2} \geqslant 0$ : seul le caractère défini est en jeu. Si les $a_{k}$ sont deux à deux distincts et si $\langle P, P \rangle = 0$, alors $P(a_{k}) = 0$ pour tout $k$ : le polynôme $P$, de degré au plus $n$, a $n + 1$ racines distinctes, donc il est nul (chapitre 13, théorème 3). Si au contraire $a_{i} = a_{j}$ pour deux indices $i \neq j$, l'ensemble $\{a_{0}, \dots, a_{n}\}$ a au plus $n$ éléments ; le produit $P$ des $X - a$, pour $a$ dans cet ensemble, est un polynôme non nul de degré au plus $n$, et $\langle P, P \rangle = 0$. 
    $$\boxed{\langle \cdot, \cdot \rangle \text{ est un produit scalaire sur } \mathbb{R}_{n}[X] \iff a_{0}, \dots, a_{n} \text{ sont deux à deux distincts}}$$

    **2.** Les polynômes d'interpolation de Lagrange (chapitre 13, théorème 13), 
    $$L_{j} = \prod_{k \neq j} \frac{X - a_{k}}{a_{j} - a_{k}} \qquad (0 \leqslant j \leqslant n),$$
     vérifient $L_{j}(a_{k}) = \delta_{jk}$, donc $\langle L_{i}, L_{j} \rangle = \sum_{k} \delta_{ik}\delta_{jk} = \delta_{ij}$. Cette famille orthonormée de $n + 1$ vecteurs de l'espace $\mathbb{R}_{n}[X]$, de dimension $n + 1$, en est une base orthonormée. 
    $$\boxed{(L_{0}, \dots, L_{n}) \text{ est une base orthonormée de } \mathbb{R}_{n}[X]}$$
     C'est l'exemple de la section 19.5 du cours, pour $n = 2$ ; la proposition 8 y redonne la formule d'interpolation $P = \sum_{j} P(a_{j})L_{j}$.

    **3.** Pour tout $P$, $\sum_{k} P(a_{k}) = \sum_{k} P(a_{k}) \times 1 = \langle P, 1 \rangle$ : $F = \mathrm{Vect}(1)^{\perp}$ est l'hyperplan de vecteur normal le polynôme constant $1$, avec $\lVert 1 \rVert^{2} = n + 1$. La proposition 11 et la proposition 13 donnent : 
    $$\boxed{F^{\perp} = \mathbb{R}_{0}[X], \qquad d(Q, F) = \frac{|\langle Q, 1 \rangle|}{\lVert 1 \rVert} = \frac{\big|\sum_{k = 0}^{n} Q(a_{k})\big|}{\sqrt{n + 1}}, \qquad d(X^{n}, F) = \frac{\big|\sum_{k = 0}^{n} a_{k}^{n}\big|}{\sqrt{n + 1}}}$$
     Par exemple, pour $n = 2$ et $(a_{0}, a_{1}, a_{2}) = (0, 1, 2)$, on trouve $d(X^{2}, F) = \frac{0 + 1 + 4}{\sqrt{3}} = \frac{5}{\sqrt{3}}$. ✓

    *Piège.* Le même produit n'est pas un produit scalaire sur $\mathbb{R}[X]$, ni sur $\mathbb{R}_{m}[X]$ pour $m > n$ : le polynôme $(X - a_{0}) \cdots (X - a_{n})$, non nul, y est de norme nulle. C'est la deuxième remarque qui suit la proposition 2 : l'espace sur lequel on travaille fait partie de la donnée.
- id: "ma-19-39"
  feuille: "f-ma-19"
  numero: 39
  partie: "Projection orthogonale sur un sous-espace de dimension finie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [projection orthogonale, produits scalaires, orthogonalité, produits scalaires intégraux, formes linéaires]
  noeuds: [fq-orthogonalite, me-produit-scalaire, ri-proprietes, v-dual]
  notions: [projection-orthogonale, produit-scalaire, vecteurs-orthogonaux, forme-lineaire]
  page_enonce: 10
  page_corrige: 34
  enonce: |
    On munit $E = \mathcal{C}([0\,,1], \mathbb{R})$ du produit scalaire défini par 
    $$\langle f, g \rangle = \int_{0}^{1} f(t)g(t)\,\mathrm{d} t,$$
     et l'on pose $F = \{f \in E \mid f(0) = 0\}$.

    **1.** Montrer que $F$ est un hyperplan de $E$, et que $F^{\perp} = \{0\}$.

    **2.** En déduire que $F$ n'admet pas de supplémentaire orthogonal. Quelle hypothèse du théorème 6 du cours n'est pas satisfaite ?
  corrige: |
    **1.** L'application $f \mapsto f(0)$ est une forme linéaire sur $E$, non nulle puisqu'elle vaut $1$ en la fonction constante $1$ : son noyau $F$ est un hyperplan de $E$ (chapitre 14). Soit $g \in F^{\perp}$. La fonction $f : t \mapsto tg(t)$ est continue sur $[0\,,1]$ et nulle en $0$ : elle appartient à $F$, donc 
    $$0 = \langle f, g \rangle = \int_{0}^{1} t\,g(t)^{2}\,\mathrm{d} t.$$
     La fonction $t \mapsto tg(t)^{2}$ est continue, positive, d'intégrale nulle : elle est nulle sur $[0\,,1]$ (chapitre 18, théorème 4). Donc $g(t) = 0$ pour tout $t \in \,]0\,,1]$, et $g(0) = 0$ aussi, par continuité de $g$ en $0$. 
    $$\boxed{F \text{ est un hyperplan de } E, \qquad F^{\perp} = \{0\}}$$

    **2.** Un supplémentaire orthogonal de $F$ serait un supplémentaire $G$ de $F$ formé de vecteurs orthogonaux à $F$, c'est-à-dire contenu dans $F^{\perp} = \{0\}$. On aurait alors $E = F \oplus \{0\} = F$, ce qui est faux puisque la fonction constante $1$ n'appartient pas à $F$. 
    $$\boxed{F \text{ n'admet pas de supplémentaire orthogonal : } F \oplus F^{\perp} = F \neq E}$$
     Le théorème 6 suppose $F$ *de dimension finie*, et ce n'est pas le cas : $F$ contient la famille libre $(t, t^{2}, \dots, t^{k})$ pour tout $k$ (chapitre 15). Ce n'est pas la dimension de $E$ qui compte, mais celle du sous-espace sur lequel on projette.

    *À retenir.* C'est le même phénomène que dans la remarque qui suit la proposition 11 et dans l'exercice 33 : en dimension infinie, un hyperplan peut avoir un orthogonal nul, et alors $(F^{\perp})^{\perp} = E \neq F$. L'astuce de la fonction $t \mapsto tg(t)$, qui fabrique un élément de $F$ « à partir » de $g$, resservira à l'exercice 40.
- id: "ma-19-40"
  feuille: "f-ma-19"
  numero: 40
  partie: "Projection orthogonale sur un sous-espace de dimension finie"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [projection orthogonale, produits scalaires, orthogonalité, produits scalaires intégraux, polynômes orthogonaux]
  noeuds: [fq-orthogonalite, me-produit-scalaire, ri-proprietes, pol-anneau]
  notions: [projection-orthogonale, produit-scalaire, vecteurs-orthogonaux]
  page_enonce: 10
  page_corrige: 34
  enonce: |
    Pour tout $n \in \mathbb{N}$, on munit $\mathbb{R}_{n}[X]$ du produit scalaire défini par $\langle P, Q \rangle = \int_{0}^{1} PQ$.

    **1.** On suppose dans cette question $n = 2$.

    **(a)** Donner une base de l'orthogonal de $\mathrm{Vect}(X, X^{2})$ dans $\mathbb{R}_{2}[X]$.

    **(b)** Déterminer un polynôme $A_{2} \in \mathbb{R}_{2}[X]$ tel que $P(0) = \int_{0}^{1} A_{2}(t)P(t)\,\mathrm{d} t$ pour tout $P \in \mathbb{R}_{2}[X]$.

    **2.** Soit $n \in \mathbb{N}$. Montrer qu'il existe un unique polynôme $A_{n} \in \mathbb{R}_{n}[X]$ tel que 
    $$P(0) = \int_{0}^{1} A_{n}(t)P(t)\,\mathrm{d} t \qquad\text{pour tout } P \in \mathbb{R}_{n}[X],$$
     et que $A_{n}$ est de degré $n$.

    **3.** Existe-t-il un polynôme $A \in \mathbb{R}[X]$ tel que $P(0) = \int_{0}^{1} A(t)P(t)\,\mathrm{d} t$ pour tout $P \in \mathbb{R}[X]$ ?
  corrige: |
    Toutes les intégrales sont celles de polynômes sur $[0\,,1]$, calculées par les primitives usuelles, avec $\int_{0}^{1} t^{k}\,\mathrm{d} t = \frac{1}{k + 1}$.

    **1.** *(a)* Le sous-espace $\mathrm{Vect}(X, X^{2})$ est de dimension $2$, donc son orthogonal dans $\mathbb{R}_{2}[X]$ est de dimension $1$ (proposition 11). Le polynôme $P = a + bX + cX^{2}$ lui appartient si et seulement si 
    $$\left\{ \begin{array}{l} \langle P, X \rangle = \frac{a}{2} + \frac{b}{3} + \frac{c}{4} = 0 \\[2mm] \langle P, X^{2} \rangle = \frac{a}{3} + \frac{b}{4} + \frac{c}{5} = 0 \end{array} \right. \iff \left\{ \begin{array}{l} 6a + 4b + 3c = 0 \\ 20a + 15b + 12c = 0 \end{array} \right. \iff b = -4a \text{ et } c = \frac{10a}{3}.$$
     On choisit $a = 3$ pour éviter les fractions. 
    $$\boxed{\mathrm{Vect}(X, X^{2})^{\perp} = \mathrm{Vect}\big(10X^{2} - 12X + 3\big)}$$
     *(b)* Pour $P \in \mathrm{Vect}(X, X^{2})$, on a $P(0) = 0$ : la condition impose $\langle A_{2}, X \rangle = \langle A_{2}, X^{2} \rangle = 0$, donc $A_{2} = \lambda(10X^{2} - 12X + 3)$ par (a). La condition pour $P = 1$ s'écrit 
    $$1 = \lambda\int_{0}^{1} (10t^{2} - 12t + 3)\,\mathrm{d} t = \lambda\Big(\frac{10}{3} - 6 + 3\Big) = \frac{\lambda}{3}, \qquad \text{d'où } \lambda = 3.$$

    $$\boxed{A_{2} = 30X^{2} - 36X + 9}$$
     Réciproquement, ce polynôme convient pour $1$, $X$ et $X^{2}$, donc pour tout $P \in \mathbb{R}_{2}[X]$ par linéarité. On contrôle : $\int_{0}^{1} t(30t^{2} - 36t + 9)\,\mathrm{d} t = \frac{15}{2} - 12 + \frac{9}{2} = 0$. ✓

    **2.** L'espace $\mathbb{R}_{n}[X]$, muni de ce produit scalaire (proposition 2 (ii)), est euclidien, et $P \mapsto P(0)$ est une forme linéaire sur $\mathbb{R}_{n}[X]$. L'exercice 22 (question 2) fournit un unique $A_{n} \in \mathbb{R}_{n}[X]$ tel que $P(0) = \langle A_{n}, P \rangle$ pour tout $P \in \mathbb{R}_{n}[X]$. Pour le degré, on raisonne par l'absurde : si $n \geqslant 1$ et $\deg A_{n} \leqslant n - 1$, le polynôme $P = XA_{n}$ appartient à $\mathbb{R}_{n}[X]$, et 
    $$0 = P(0) = \langle A_{n}, XA_{n} \rangle = \int_{0}^{1} t\,A_{n}(t)^{2}\,\mathrm{d} t.$$
     La fonction $t \mapsto tA_{n}(t)^{2}$ est continue, positive, d'intégrale nulle : elle est nulle sur $[0\,,1]$ (chapitre 18, théorème 4), et $A_{n}$, qui a alors une infinité de racines, est le polynôme nul. Mais alors $1 = \langle A_{n}, 1 \rangle = 0$ pour $P = 1$ : c'est absurde. Pour $n = 0$, $A_{0} = 1$, de degré $0$. 
    $$\boxed{\exists!\,A_{n} \in \mathbb{R}_{n}[X], \ \forall\,P \in \mathbb{R}_{n}[X], \ P(0) = \int_{0}^{1} A_{n}(t)P(t)\,\mathrm{d} t, \qquad \text{et } \deg A_{n} = n}$$
     Un calcul symbolique, qui résout le système des $n + 1$ conditions obtenues pour $P = 1, X, \dots, X^{n}$, donne 
    $$A_{1} = 4 - 6X, \qquad A_{2} = 30X^{2} - 36X + 9, \qquad A_{3} = -140X^{3} + 240X^{2} - 120X + 16. \qquad \checkmark$$

    **3.** Non. Si un tel polynôme $A$ existait, le raisonnement de la question 2, appliqué cette fois sans contrainte de degré à $P = XA \in \mathbb{R}[X]$, donnerait $\int_{0}^{1} tA(t)^{2}\,\mathrm{d} t = 0$, donc $A = 0$, puis $1 = \langle A, 1 \rangle = 0$ pour $P = 1$. 
    $$\boxed{\text{il n'existe aucun polynôme } A \in \mathbb{R}[X] \text{ tel que } P(0) = \int_{0}^{1} A(t)P(t)\,\mathrm{d} t \text{ pour tout } P \in \mathbb{R}[X]}$$

    *À retenir.* Sur l'espace $\mathbb{R}[X]$, de dimension infinie, la forme linéaire $P \mapsto P(0)$ n'est représentée par aucun vecteur : l'application $\Phi$ de l'exercice 22 n'y est pas surjective. Les $A_{n}$ ne peuvent pas s'approcher d'un tel $A$, car leur norme tend vers l'infini. En effet, pour $P = (1 - X)^{n}$, on a $P(0) = 1$ et $\lVert P \rVert^{2} = \int_{0}^{1} (1 - t)^{2n}\,\mathrm{d} t = \frac{1}{2n + 1}$, et l'inégalité de Cauchy-Schwarz donne 
    $$1 = P(0) = \langle A_{n}, P \rangle \leqslant \lVert A_{n} \rVert\,\lVert P \rVert = \frac{\lVert A_{n} \rVert}{\sqrt{2n + 1}}, \qquad\text{donc}\qquad \lVert A_{n} \rVert^{2} \geqslant 2n + 1.$$
     Le calcul donne même $\lVert A_{n} \rVert^{2} = \langle A_{n}, A_{n} \rangle = A_{n}(0) = (n + 1)^{2}$ pour $n \leqslant 5$.
- id: "ma-19-41"
  feuille: "f-ma-19"
  numero: 41
  partie: "Projection orthogonale sur un sous-espace de dimension finie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [projection orthogonale, normes, orthogonalité]
  noeuds: [fq-orthogonalite, me-produit-scalaire]
  notions: [projection-orthogonale, norme, vecteurs-orthogonaux, produit-scalaire]
  page_enonce: 10
  page_corrige: 36
  enonce: |
    Soit $E$ un espace préhilbertien réel et $p$ un projecteur de $E$. On dit que $p$ est un *projecteur orthogonal* si $\mathrm{Ker}\, p$ et $\mathrm{Im}\, p$ sont orthogonaux. Montrer que $p$ est un projecteur orthogonal si et seulement si $\lVert p(x) \rVert \leqslant \lVert x \rVert$ pour tout $x \in E$. Pour la réciproque, on pourra fixer $x \in \mathrm{Im}\, p$ et $y \in \mathrm{Ker}\, p$, et développer $\lVert p(x + \lambda y) \rVert^{2}$ et $\lVert x + \lambda y \rVert^{2}$ pour $\lambda \in \mathbb{R}$.
  corrige: |
    On rappelle que, $p$ étant un projecteur ($p \circ p = p$), les sous-espaces $\mathrm{Ker}\, p$ et $\mathrm{Im}\, p$ sont supplémentaires dans $E$, et que $p$ est le projecteur sur $\mathrm{Im}\, p$ parallèlement à $\mathrm{Ker}\, p$ (chapitre 14, théorème 5). Pour tout $x \in E$, on a donc la décomposition 
    $$x = p(x) + \big(x - p(x)\big), \qquad p(x) \in \mathrm{Im}\, p, \qquad x - p(x) \in \mathrm{Ker}\, p,$$
     la seconde appartenance venant de $p\big(x - p(x)\big) = p(x) - p(p(x)) = 0$.

    **Sens direct.** Supposons $\mathrm{Ker}\, p$ et $\mathrm{Im}\, p$ orthogonaux, et soit $x \in E$. Les deux vecteurs $p(x)$ et $x - p(x)$ sont orthogonaux, et le théorème de Pythagore (théorème 3) donne 
    $$\lVert x \rVert^{2} = \lVert p(x) \rVert^{2} + \lVert x - p(x) \rVert^{2} \geqslant \lVert p(x) \rVert^{2}, \qquad\text{d'où}\qquad \boxed{\lVert p(x) \rVert \leqslant \lVert x \rVert}$$
     par croissance de la racine carrée. Il y a égalité si et seulement si $x - p(x) = 0$, c'est-à-dire si $x \in \mathrm{Im}\, p$.

    **Réciproque.** Supposons $\lVert p(z) \rVert \leqslant \lVert z \rVert$ pour tout $z \in E$, et soit $x \in \mathrm{Im}\, p$, $y \in \mathrm{Ker}\, p$ et $\lambda \in \mathbb{R}$. Comme $p(x) = x$ et $p(y) = 0$, on a $p(x + \lambda y) = x$, et l'hypothèse appliquée à $z = x + \lambda y$ donne, après élévation au carré et développement par la proposition 3 (ii), 
    $$\lVert x \rVert^{2} \leqslant \lVert x + \lambda y \rVert^{2} = \lVert x \rVert^{2} + 2\lambda\langle x, y \rangle + \lambda^{2}\lVert y \rVert^{2}, \qquad\text{soit}\qquad 2\lambda\langle x, y \rangle + \lambda^{2}\lVert y \rVert^{2} \geqslant 0.$$
     Pour $\lambda > 0$, on divise par $\lambda$ : $2\langle x, y \rangle + \lambda\lVert y \rVert^{2} \geqslant 0$, et l'on fait tendre $\lambda$ vers $0$ par valeurs positives, ce qui donne $\langle x, y \rangle \geqslant 0$. Pour $\lambda < 0$, la division renverse l'inégalité, et l'on obtient de même $\langle x, y \rangle \leqslant 0$. Ainsi $\langle x, y \rangle = 0$ : c'est exactement la question 1 de l'exercice 13, puisque l'on a montré que $\lVert x + \lambda y \rVert \geqslant \lVert x \rVert$ pour tout réel $\lambda$. Tout vecteur de $\mathrm{Im}\, p$ est orthogonal à tout vecteur de $\mathrm{Ker}\, p$ : 
    $$\boxed{p \text{ est un projecteur orthogonal} \iff \lVert p(x) \rVert \leqslant \lVert x \rVert \text{ pour tout } x \in E}$$

    *Piège.* L'erreur la plus répandue est de croire qu'un projecteur, puisqu'il « écrase » l'espace sur un sous-espace, diminue toujours les longueurs. Un projecteur oblique peut au contraire les augmenter, comme le montre la figure ci-dessous.

    ![Figure](documents/figures/e24269eccda96c8a.svg)

    Le projecteur $p$ sur $F = \mathrm{Im}\, p = \mathrm{Vect}(e_{1})$ parallèlement à $\mathrm{Ker}\, p = \mathrm{Vect}\big((1, 1)\big)$ s'écrit $p(a, b) = (a - b, 0)$. Pour $x = \big(\frac{1}{2}, -\frac{3}{2}\big)$, on suit la direction de $\mathrm{Ker}\, p$ jusqu'à l'axe et l'on trouve $p(x) = (2, 0)$, de norme $2$, alors que $\lVert x \rVert = \frac{\sqrt{10}}{2} \approx 1{,}58$. Le projeté orthogonal $p_{F}(x) = \big(\frac{1}{2}, 0\big)$, obtenu en descendant à angle droit, est lui plus court que $x$.

    *À retenir.* Lorsque $F = \mathrm{Im}\, p$ est de dimension finie, un projecteur orthogonal sur $F$ est exactement $p_{F}$ : en effet $\mathrm{Ker}\, p \subset F^{\perp}$, et si $z \in F^{\perp}$ s'écrit $z = f + k$ avec $f \in F$ et $k \in \mathrm{Ker}\, p$, alors $\lVert f \rVert^{2} = \langle z - k, f \rangle = 0$. La caractérisation obtenue ici, « ne jamais allonger », permet de parler de projecteur orthogonal sans supposer $F$ de dimension finie ; les exercices 42 et 46 l'utilisent sous forme matricielle.
- id: "ma-19-42"
  feuille: "f-ma-19"
  numero: 42
  partie: "Projection orthogonale sur un sous-espace de dimension finie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [projection orthogonale, orthogonalité, matrices et produit scalaire]
  noeuds: [fq-orthogonalite, me-produit-scalaire, v-matrices]
  notions: [projection-orthogonale, vecteurs-orthogonaux, produit-scalaire]
  page_enonce: 10
  page_corrige: 37
  enonce: |
    Soit $A \in \mathcal{M}_{n}(\mathbb{R})$, identifiée à l'endomorphisme $X \mapsto AX$ de $\mathcal{M}_{n,1}(\mathbb{R})$.

    **1.** On suppose que $A^{2} = A$. Montrer que $A$ est un projecteur orthogonal, au sens de l'exercice 41, si et seulement si la matrice $A$ est symétrique.

    **2.** On suppose que $A^{2} = I_{n}$. On dit que la symétrie $A$ est orthogonale si les sous-espaces $\mathrm{Ker}\,(A - I_{n})$ et $\mathrm{Ker}\,(A + I_{n})$ sont orthogonaux. Montrer que $A$ est une symétrie orthogonale si et seulement si la matrice $A$ est symétrique.
  corrige: |
    On munit $\mathcal{M}_{n,1}(\mathbb{R})$ du produit scalaire canonique $\langle X, Y \rangle = {X}^{T}Y$ (proposition 1).

    **1.** Comme $A^{2} = A$, l'endomorphisme $X \mapsto AX$ est un projecteur, d'image $\mathrm{Im}\, A$ et de noyau $\mathrm{Ker}\, A$.

    Supposons $A$ symétrique. Soit $X \in \mathrm{Ker}\, A$ et $Y = AZ \in \mathrm{Im}\, A$. Par la règle ${(AX)}^{T} = {X}^{T}{A}^{T}$ (chapitre 16, proposition 5), 
    $$\langle X, AZ \rangle = {X}^{T}AZ = {X}^{T}{A}^{T}Z = {(AX)}^{T}Z = 0,$$
     donc $\mathrm{Ker}\, A$ et $\mathrm{Im}\, A$ sont orthogonaux.

    Réciproquement, supposons $\mathrm{Ker}\, A$ et $\mathrm{Im}\, A$ orthogonaux. Pour toute colonne $X$, le vecteur $(I_{n} - A)X$ appartient à $\mathrm{Ker}\, A$, puisque $A(I_{n} - A) = A - A^{2} = 0$. Pour toutes colonnes $X$ et $Y$, on a donc 
    $$0 = \langle (I_{n} - A)X, AY \rangle = {X}^{T}\,{(I_{n} - A)}^{T}A\,Y.$$
     En prenant pour $X$ et $Y$ les colonnes $E_{i}$ et $E_{j}$ de la base canonique, on lit le coefficient d'indice $(i, j)$ de la matrice ${(I_{n} - A)}^{T}A$ : elle est nulle. Ainsi $A = {A}^{T}A$, et cette matrice est symétrique, puisque ${({A}^{T}A)}^{T} = {A}^{T}A$. 
    $$\boxed{\text{si } A^{2} = A : \quad A \text{ est un projecteur orthogonal} \iff {A}^{T} = A}$$

    **2.** Soit $F = \mathrm{Ker}\,(A - I_{n})$ et $G = \mathrm{Ker}\,(A + I_{n})$, supplémentaires par le théorème 6 du chapitre 14. On pose $P = \frac{1}{2}(A + I_{n})$, de sorte que 
    $$P^{2} = \frac{1}{4}\big(A^{2} + 2A + I_{n}\big) = \frac{1}{4}(2A + 2I_{n}) = P.$$
     C'est un projecteur, de noyau $\mathrm{Ker}\,(A + I_{n}) = G$ et d'image $\mathrm{Ker}\,(P - I_{n}) = \mathrm{Ker}\,\big(\frac{1}{2}(A - I_{n})\big) = F$ (chapitre 14, théorème 5). La symétrie $A$ est donc orthogonale si et seulement si le projecteur $P$ l'est, c'est-à-dire, par la question 1, si et seulement si $P$ est symétrique. Comme $A = 2P - I_{n}$ et que $I_{n}$ est symétrique, cela équivaut à la symétrie de $A$. 
    $$\boxed{\text{si } A^{2} = I_{n} : \quad A \text{ est une symétrie orthogonale} \iff {A}^{T} = A}$$

    On contrôle sur deux exemples : 
    $$A_{1} = \begin{pmatrix} 1 & 1 \\ 0 & -1 \end{pmatrix}, \qquad A_{2} = \begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}.$$
     La matrice $A_{1}$ vérifie $A_{1}^{2} = I_{2}$ sans être symétrique, et la symétrie n'est pas orthogonale : $F = \mathrm{Vect}(E_{1})$, $G = \mathrm{Vect}\big((-1, 2)\big)$, et $\langle E_{1}, (-1, 2) \rangle = -1 \neq 0$ ✓. La matrice $A_{2}$, symétrique, est la symétrie orthogonale par rapport à la droite $\mathrm{Vect}\big((1, 1)\big)$, parallèlement à la droite perpendiculaire $\mathrm{Vect}\big((1, -1)\big)$.

    *Piège.* Le mot « symétrique » a ici deux sens, qu'il ne faut pas confondre : une matrice symétrique vérifie ${A}^{T} = A$, une symétrie vérifie $A^{2} = I_{n}$. L'exercice dit que, pour une symétrie, la propriété géométrique « être orthogonale » équivaut à la propriété matricielle « être symétrique ». Une symétrie orthogonale vérifie alors ${A}^{T}A = A^{2} = I_{n}$ : ses colonnes forment une base orthonormée, au sens de la remarque qui suit la proposition 9. Un projecteur orthogonal autre que $I_{n}$ ne la vérifie pas, puisque ${A}^{T}A = A \neq I_{n}$.
- id: "ma-19-43"
  feuille: "f-ma-19"
  numero: 43
  partie: "Projection orthogonale sur un sous-espace de dimension finie"
  etoiles: 2
  types: [Calcul]
  mots_cles: [projection orthogonale, normes, bases orthonormées]
  noeuds: [fq-orthogonalite, me-produit-scalaire, fq-bases-orthogonales]
  notions: [projection-orthogonale, norme, base-orthogonale, produit-scalaire]
  page_enonce: 10
  page_corrige: 38
  enonce: |
    Soit $E$ un espace euclidien de dimension $n \geqslant 1$, $(e_{1}, \dots, e_{n})$ une base orthonormée de $E$ et $F$ un sous-espace de $E$. Calculer en fonction de la dimension de $F$ le réel 
    $$\sum_{j = 1}^{n} \lVert p_{F}(e_{j}) \rVert^{2}.$$
  corrige: |
    Soit $r = \dim F$, que l'on suppose non nul ($F = \{0\}$ donne une somme nulle), et $(f_{1}, \dots, f_{r})$ une base orthonormée de $F$, qui existe par le théorème 5. La proposition 10 (iv) donne, pour chaque $j$, 
    $$\lVert p_{F}(e_{j}) \rVert^{2} = \sum_{k = 1}^{r} \langle e_{j}, f_{k} \rangle^{2}.$$
     On somme sur $j$ et l'on échange les deux sommes finies. Pour $k$ fixé, les réels $\langle f_{k}, e_{j} \rangle$ sont les coordonnées de $f_{k}$ dans la base orthonormée $(e_{1}, \dots, e_{n})$, et la proposition 8 donne $\sum_{j} \langle f_{k}, e_{j} \rangle^{2} = \lVert f_{k} \rVert^{2} = 1$ : 
    $$\sum_{j = 1}^{n} \lVert p_{F}(e_{j}) \rVert^{2} = \sum_{k = 1}^{r}\ \sum_{j = 1}^{n} \langle f_{k}, e_{j} \rangle^{2} = \sum_{k = 1}^{r} 1, \qquad\text{d'où}\qquad \boxed{\sum_{j = 1}^{n} \lVert p_{F}(e_{j}) \rVert^{2} = \dim F}$$
     Le résultat ne dépend ni de la base orthonormée $(e_{j})$ choisie, ni de la position de $F$, mais seulement de sa dimension. Pour la droite $F = \mathrm{Vect}\big((1, 1, 1)\big)$ de $\mathbb{R}^{3}$, chaque $p_{F}(e_{j})$ vaut $\frac{1}{3}(1, 1, 1)$, de norme au carré $\frac{1}{3}$, et la somme vaut bien $1$ ✓.

    *À retenir.* On peut aussi passer par la trace. Comme $e_{j} - p_{F}(e_{j})$ est orthogonal à $p_{F}(e_{j})$, on a $\lVert p_{F}(e_{j}) \rVert^{2} = \langle p_{F}(e_{j}), e_{j} \rangle$, qui est le coefficient diagonal d'indice $j$ de la matrice de $p_{F}$ dans la base orthonormée $(e_{j})$, par la proposition 8. La somme est donc $\operatorname{tr}(p_{F})$, qui vaut le rang du projecteur $p_{F}$, c'est-à-dire $\dim F$ (chapitre 16, proposition 15).
- id: "ma-19-44"
  feuille: "f-ma-19"
  numero: 44
  partie: "Projection orthogonale sur un sous-espace de dimension finie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [projection orthogonale, orthogonalité, matrices et produit scalaire]
  noeuds: [fq-orthogonalite, me-produit-scalaire, v-matrices]
  notions: [projection-orthogonale, vecteurs-orthogonaux, produit-scalaire]
  page_enonce: 11
  page_corrige: 38
  enonce: |
    Soit $A \in \mathcal{M}_{n}(\mathbb{R})$.

    **1.** Montrer que $\mathrm{Ker}\,({A}^{T}) = (\mathrm{Im}\, A)^{\perp}$.

    **2.** Montrer que $\mathrm{Ker}\,({A}^{T}A) = \mathrm{Ker}\, A$ et que $\mathrm{Im}\,(A{A}^{T}) = \mathrm{Im}\, A$.

    **3.** On suppose que $\mathrm{Ker}\, A = \mathrm{Im}\, A$. Montrer que la matrice $A + {A}^{T}$ est inversible.
  corrige: |
    On munit $\mathcal{M}_{n,1}(\mathbb{R})$ du produit scalaire canonique, et l'on identifie $A$ à l'endomorphisme $X \mapsto AX$.

    **1.** Soit $Y \in \mathcal{M}_{n,1}(\mathbb{R})$. Pour toute colonne $X$, on a $\langle AX, Y \rangle = {X}^{T}{A}^{T}Y = \langle X, {A}^{T}Y \rangle$. Si ${A}^{T}Y = 0$, le vecteur $Y$ est donc orthogonal à tous les $AX$, c'est-à-dire à $\mathrm{Im}\, A$. Réciproquement, si $Y \in (\mathrm{Im}\, A)^{\perp}$, on choisit $X = {A}^{T}Y$, ce qui donne $\lVert {A}^{T}Y \rVert^{2} = 0$, donc ${A}^{T}Y = 0$. 
    $$\boxed{\mathrm{Ker}\,({A}^{T}) = (\mathrm{Im}\, A)^{\perp}}$$

    **2.** Si $AX = 0$, alors ${A}^{T}AX = 0$ : on a $\mathrm{Ker}\, A \subset \mathrm{Ker}\,({A}^{T}A)$. Réciproquement, si ${A}^{T}AX = 0$, alors 
    $$0 = {X}^{T}{A}^{T}AX = {(AX)}^{T}(AX) = \lVert AX \rVert^{2},$$
     donc $AX = 0$. Ainsi 
    $$\boxed{\mathrm{Ker}\,({A}^{T}A) = \mathrm{Ker}\, A}$$
     On applique ce résultat à ${A}^{T}$, dont la transposée est $A$, et l'on obtient $\mathrm{Ker}\,(A{A}^{T}) = \mathrm{Ker}\,({A}^{T})$. Par le théorème du rang (chapitre 15, théorème 9) et l'égalité $\mathrm{rg}({A}^{T}) = \mathrm{rg}(A)$ (chapitre 16, théorème 6 (iii)), 
    $$\mathrm{rg}(A{A}^{T}) = n - \dim\mathrm{Ker}\,(A{A}^{T}) = n - \dim\mathrm{Ker}\,({A}^{T}) = \mathrm{rg}({A}^{T}) = \mathrm{rg}(A).$$
     Or $\mathrm{Im}\,(A{A}^{T}) \subset \mathrm{Im}\, A$, puisque $A{A}^{T}Y = A({A}^{T}Y)$. Les deux sous-espaces ont la même dimension, et ils sont égaux (chapitre 15, théorème 5) : $\boxed{\mathrm{Im}\,(A{A}^{T}) = \mathrm{Im}\, A}$.

    **3.** L'hypothèse $\mathrm{Im}\, A \subset \mathrm{Ker}\, A$ donne $A^{2} = 0$. Soit $X$ tel que $(A + {A}^{T})X = 0$, c'est-à-dire $AX = -{A}^{T}X$. Alors 
    $$\lVert AX \rVert^{2} = \langle AX, -{A}^{T}X \rangle = -{X}^{T}{A}^{T}{A}^{T}X = -{X}^{T}\,{(A^{2})}^{T}X = 0.$$
     Donc $AX = 0$, puis ${A}^{T}X = -AX = 0$. Le vecteur $X$ appartient à $\mathrm{Ker}\, A \cap \mathrm{Ker}\,({A}^{T})$, c'est-à-dire, par l'hypothèse et la question 1, à $\mathrm{Im}\, A \cap (\mathrm{Im}\, A)^{\perp}$, qui est réduit à $\{0\}$ (proposition 5 (iv)). La matrice $A + {A}^{T}$ est donc injective, donc inversible (chapitre 16, théorème 3). 
    $$\boxed{\mathrm{Ker}\, A = \mathrm{Im}\, A \implies A + {A}^{T} \in GL_{n}(\mathbb{R})}$$
     Pour la matrice suivante, on a $\mathrm{Ker}\, A = \mathrm{Im}\, A = \mathrm{Vect}(E_{1})$, et $A + {A}^{T}$ est bien inversible ✓ : 
    $$A = \begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}, \qquad A + {A}^{T} = \begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}.$$

    *Piège.* L'hypothèse $A^{2} = 0$ ne suffit pas : pour $n = 3$ et $A = E_{12}$, on a $A^{2} = 0$, mais $A + {A}^{T} = E_{12} + E_{21}$ a une troisième colonne nulle. Ici $\mathrm{Im}\, A = \mathrm{Vect}(E_{1})$ est strictement inclus dans $\mathrm{Ker}\, A = \mathrm{Vect}(E_{1}, E_{3})$, et le vecteur $E_{3}$, qui appartient à $\mathrm{Ker}\, A \cap \mathrm{Ker}\,({A}^{T})$, n'est pas dans $\mathrm{Im}\, A$. Notons aussi que l'hypothèse impose, par le théorème du rang, $n = 2\mathrm{rg}(A)$ : $n$ est pair.
- id: "ma-19-45"
  feuille: "f-ma-19"
  numero: 45
  partie: "Projection orthogonale sur un sous-espace de dimension finie"
  etoiles: 2
