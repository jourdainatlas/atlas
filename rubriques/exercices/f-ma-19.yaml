  enonce: |
    Soit $V$ un sous-espace de $\mathcal{C}([0\,,1], \mathbb{R})$ et $A > 0$ un réel tels que 
    $$\sup_{[0, 1]} |f| \leqslant A\Big(\int_{0}^{1} f^{2}\Big)^{1/2} \qquad\text{pour toute } f \in V.$$
     Montrer que $V$ est de dimension finie, et que $\dim V \leqslant A^{2}$. Montrer que, si l'on remplace les fonctions continues par des fonctions continues par morceaux, cette borne est optimale : pour tout $n \geqslant 1$, il existe un sous-espace $V$ de $\mathcal{C}_{m}([0\,,1], \mathbb{R})$, de dimension $n$, sur lequel l'inégalité précédente est vraie avec $A = \sqrt{n}$.
  corrige: |
    *Idée.* Pour une famille orthonormée $(f_{1}, \dots, f_{m})$ de $V$ et un point $x$ fixé, on applique l'hypothèse à la fonction $\sum_{i} f_{i}(x)f_{i}$, choisie pour que sa valeur en $x$ soit $\sum_{i} f_{i}(x)^{2}$. On obtient $\sum_{i} f_{i}(x)^{2} \leqslant A^{2}$, et l'on intègre en $x$ : le membre de gauche donne $m$.

    On munit $V$ du produit scalaire $\langle f, g \rangle = \int_{0}^{1} fg$ de la proposition 2.

    **Une famille orthonormée a au plus $A^{2}$ éléments.** Soit $(f_{1}, \dots, f_{m})$ une famille orthonormée de $V$, $x \in [0\,,1]$, et $g = \sum_{i = 1}^{m} f_{i}(x)f_{i}$, qui appartient à $V$. Par le théorème de Pythagore, $\lVert g \rVert^{2} = \sum_{i} f_{i}(x)^{2}$, et l'on a $g(x) = \sum_{i} f_{i}(x)^{2}$. En notant $S(x) = \sum_{i} f_{i}(x)^{2}$, l'hypothèse appliquée à $g$ donne 
    $$S(x) = g(x) \leqslant \sup_{[0, 1]} |g| \leqslant A\lVert g \rVert = A\sqrt{S(x)}.$$
     Si $S(x) > 0$, on divise par $\sqrt{S(x)}$ et l'on obtient $S(x) \leqslant A^{2}$ ; c'est encore vrai si $S(x) = 0$. La fonction $S$ est continue et majorée par $A^{2}$ sur $[0\,,1]$, et son intégrale vaut $\sum_{i} \lVert f_{i} \rVert^{2} = m$. Par croissance de l'intégrale, 
    $$\boxed{m = \int_{0}^{1} \sum_{i = 1}^{m} f_{i}(x)^{2}\,\mathrm{d} x \leqslant A^{2}}$$

    **La dimension de $V$.** Si $V$ n'était pas de dimension finie, il contiendrait des familles libres de toute longueur : partant d'une famille libre $(v_{1}, \dots, v_{k})$, qui n'engendre pas $V$, on lui ajoute un vecteur $v_{k + 1} \notin \mathrm{Vect}(v_{1}, \dots, v_{k})$, et la famille reste libre (chapitre 14, proposition 8). L'algorithme de Gram-Schmidt (théorème 4) transformerait une famille libre de $m > A^{2}$ éléments en une famille orthonormée de $m$ éléments, ce qui contredit ce qui précède. Donc $V$ est de dimension finie, et une base orthonormée de $V$ (théorème 5) a $\dim V$ éléments : 
    $$\boxed{\dim V \leqslant A^{2}}$$

    **Optimalité.** Pour $n \geqslant 1$ et $k \in [\![0\,;n - 1]\!]$, soit $\varphi_{k}$ la fonction égale à $1$ sur $\big[\frac{k}{n}\,,\frac{k + 1}{n}\big[$ et à $0$ ailleurs, avec de plus $\varphi_{n - 1}(1) = 1$. Ces fonctions en escalier, à supports disjoints non vides, forment une famille libre, et $V = \mathrm{Vect}(\varphi_{0}, \dots, \varphi_{n - 1})$ est de dimension $n$. Pour $f = \sum_{k} c_{k}\varphi_{k}$, on a 
    $$\sup_{[0, 1]} |f| = \max_{k} |c_{k}|, \qquad \int_{0}^{1} f^{2} = \frac{1}{n}\sum_{k} c_{k}^{2}, \qquad\text{donc}\qquad \Big(\sup_{[0, 1]} |f|\Big)^{2} \leqslant \sum_{k} c_{k}^{2} = n\int_{0}^{1} f^{2}.$$

    $$\boxed{\sup_{[0, 1]} |f| \leqslant \sqrt{n}\,\Big(\int_{0}^{1} f^{2}\Big)^{1/2} \text{ pour toute } f \in V, \qquad \dim V = n = A^{2}}$$
     La majoration $\dim V \leqslant A^{2}$ ne peut donc pas être améliorée pour les fonctions continues par morceaux, puisqu'on y a l'égalité. La démonstration de la première partie s'y applique d'ailleurs telle quelle, à une réserve près : sur $\mathcal{C}_{m}([0\,,1], \mathbb{R})$, la formule $\int_{0}^{1} fg$ n'est pas définie, mais l'hypothèse elle-même la rend définie sur $V$, puisque $\int_{0}^{1} f^{2} = 0$ y entraîne $\sup|f| = 0$.

    *À retenir.* La démonstration dit plus : la meilleure constante $A^{2}$ pour un espace $V$ de dimension $m$ est le maximum de $S = \sum_{i} f_{i}^{2}$, puisqu'on a égalité dans Cauchy-Schwarz pour $g$, et ce maximum est au moins la moyenne $\int_{0}^{1} S = m$. Pour $V = \mathbb{R}_{1}[X]$, de base orthonormée $\big(1, \sqrt{3}(2t - 1)\big)$, on trouve $S(x) = 1 + 3(2x - 1)^{2}$, de moyenne $2$ et de maximum $4$, atteint aux bords : la meilleure constante est $A = 2$, et l'on a $\dim V = 2 < 4 = A^{2}$ ✓.
