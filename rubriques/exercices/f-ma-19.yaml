  enonce: |
    Soit $E$ un espace euclidien et $x_{1}$, …, $x_{p}$ des vecteurs de $E$ tels que $\langle x_{i}, x_{j} \rangle = -1$ pour tous $i \neq j$. Montrer que $\sum_{i = 1}^{p} \big(1 + \lVert x_{i} \rVert^{2}\big)^{-1} \leqslant 1$, et déterminer les cas d'égalité.
  corrige: |
    *Idée.* La condition $\langle x_{i}, x_{j} \rangle = -1$ s'écrit $\langle x_{i}, x_{j} \rangle + 1 \cdot 1 = 0$ : en ajoutant aux $x_{i}$ une coordonnée supplémentaire égale à $1$, on obtient une famille orthogonale. L'inégalité est alors l'inégalité de Bessel pour le vecteur « vertical » $(0, 1)$, et le cas d'égalité est celui de Bessel.

    Soit $n = \dim E$. On munit $E' = E \times \mathbb{R}$ de 
    $$\langle (x, s), (y, u) \rangle' = \langle x, y \rangle + su.$$
     C'est un produit scalaire : l'application est bilinéaire et symétrique, et $\langle (x, s), (x, s) \rangle' = \lVert x \rVert^{2} + s^{2}$ est positif, nul seulement si $x = 0$ et $s = 0$. L'espace $E'$ est euclidien, de dimension $n + 1$. On pose 
    $$y_{i} = (x_{i}, 1) \quad (1 \leqslant i \leqslant p) \qquad\text{et}\qquad z = (0, 1),$$
     de sorte que, pour tous $i \neq j$, 
    $$\langle y_{i}, y_{j} \rangle' = -1 + 1 = 0, \qquad \lVert y_{i} \rVert'^{2} = 1 + \lVert x_{i} \rVert^{2}, \qquad \langle z, y_{i} \rangle' = 1.$$
     La famille $(y_{1}, \dots, y_{p})$ est orthogonale et formée de vecteurs non nuls ; les vecteurs $\frac{y_{i}}{\lVert y_{i} \rVert'}$ forment donc une base orthonormée du sous-espace $F = \mathrm{Vect}(y_{1}, \dots, y_{p})$ (proposition 6). L'inégalité de Bessel (proposition 10 (iv)) appliquée à $z$, unitaire, donne 
    $$\sum_{i = 1}^{p} \frac{\langle z, y_{i} \rangle'^{2}}{\lVert y_{i} \rVert'^{2}} \leqslant \lVert z \rVert'^{2}, \qquad\text{soit}\qquad \boxed{\sum_{i = 1}^{p} \frac{1}{1 + \lVert x_{i} \rVert^{2}} \leqslant 1}$$

    **Cas d'égalité.** On note $\lambda_{i} = \frac{1}{1 + \lVert x_{i} \rVert^{2}}$. Par la proposition 10, sous la forme adaptée aux bases orthogonales, $p_{F}(z) = \sum_{i} \frac{\langle z, y_{i} \rangle'}{\lVert y_{i} \rVert'^{2}}\,y_{i} = \sum_{i} \lambda_{i}y_{i} = \big(\sum_{i} \lambda_{i}x_{i}, \sum_{i} \lambda_{i}\big)$. Il y a égalité dans Bessel si et seulement si $z \in F$, c'est-à-dire $z = p_{F}(z)$. Si c'est le cas, la première composante donne $\sum_{i} \lambda_{i}x_{i} = 0$. Réciproquement, si $\sum_{i} \lambda_{i}x_{i} = 0$, alors $z - p_{F}(z) = (0, 1 - s)$ avec $s = \sum_{i} \lambda_{i}$ ; ce vecteur est orthogonal à $y_{1}$, ce qui s'écrit $1 - s = 0$, donc $z = p_{F}(z)$. 
    $$\boxed{\sum_{i = 1}^{p} \frac{1}{1 + \lVert x_{i} \rVert^{2}} = 1 \iff \sum_{i = 1}^{p} \frac{x_{i}}{1 + \lVert x_{i} \rVert^{2}} = 0}$$
     Voici trois situations qui éclairent ce cas d'égalité.

    • Pour $p = 1$, la condition sur les produits scalaires est vide, et l'égalité équivaut à $x_{1} = 0$.

    • Pour $p = 2$, avec $x_{1} = au$ et $x_{2} = -\frac{1}{a}u$, où $u$ est unitaire et $a > 0$, on trouve $\frac{1}{1 + a^{2}} + \frac{a^{2}}{a^{2} + 1} = 1$ : deux vecteurs colinéaires de sens contraires réalisent l'égalité. Pour $x_{1} = (2, 0)$ et $x_{2} = \big(-\frac{1}{2}, 1\big)$ dans $\mathbb{R}^{2}$, on a bien $\langle x_{1}, x_{2} \rangle = -1$, mais la somme vaut $\frac{1}{5} + \frac{4}{9} = \frac{29}{45} < 1$.

    • Pour $p = n + 1$, la famille orthogonale $(y_{i})$ de vecteurs non nuls est une base de $E'$, donc $z \in F$ : il y a toujours égalité. C'est le cas du simplexe régulier de l'exercice 51, avec $x_{i} = \sqrt{n}\,e_{i}$ : on a $\langle x_{i}, x_{j} \rangle = n \cdot\big(-\frac{1}{n}\big) = -1$, et chaque terme vaut $\frac{1}{n + 1}$.

    Les égalités et inégalités ont été testées sur des familles aléatoires construites de cette façon, pour $n \leqslant 4$ ✓.

    *À retenir.* La construction montre en outre que $p \leqslant n + 1$, puisqu'une famille orthogonale de vecteurs non nuls de $E'$ est libre (proposition 6) : on ne peut pas trouver plus de $n + 1$ vecteurs de $E$ dont les produits scalaires deux à deux valent $-1$. Ajouter une dimension pour rendre une famille orthogonale est une idée qui resservira.
- id: "ma-19-55"
  feuille: "f-ma-19"
  numero: 55
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration, Calcul]
  mots_cles: [produits scalaires, normes, matrices et produit scalaire]
  noeuds: [me-produit-scalaire, v-matrices]
  notions: [produit-scalaire, norme]
  page_enonce: 14
  page_corrige: 51
  enonce: |
    Soit $n \geqslant 1$. On munit $\mathcal{M}_{n}(\mathbb{R})$ du produit scalaire $\langle A, B \rangle = \operatorname{tr}({A}^{T}B)$, et l'on note $\mathcal{R}$ l'ensemble des matrices de rang $1$ de $\mathcal{M}_{n}(\mathbb{R})$. Montrer que la borne inférieure des réels $\lVert M - I_{n} \rVert$, pour $M \in \mathcal{R}$, vaut $\sqrt{n - 1}$, et déterminer les matrices $M \in \mathcal{R}$ en lesquelles cette borne inférieure est atteinte.
  corrige: |
    *Idée.* Une matrice de rang $1$ s'écrit $X{Y}^{T}$, avec deux colonnes non nulles. Sa norme vaut $\lVert X \rVert\,\lVert Y \rVert$ et sa trace $\langle X, Y \rangle$ ; en développant $\lVert M - I_{n} \rVert^{2}$, on fait apparaître l'inégalité de Cauchy-Schwarz, puis un trinôme en $\lVert X \rVert\,\lVert Y \rVert$.

    On note $\langle X, Y \rangle = {X}^{T}Y$ le produit scalaire canonique de $\mathcal{M}_{n,1}(\mathbb{R})$ et $\lVert \cdot \rVert$ les deux normes, sur les colonnes et sur les matrices, ce qui ne crée pas d'ambiguïté.

    **Les matrices de rang 1.** Si $\mathrm{rg} M = 1$, l'image de $M$ est une droite $\mathrm{Vect}(X)$, avec $X \neq 0$, et chaque colonne de $M$ s'écrit $y_{j}X$ : ainsi $M = X{Y}^{T}$, avec $Y = (y_{j}) \neq 0$ puisque $M \neq 0$. Réciproquement, pour $X$ et $Y$ non nuls, la matrice $X{Y}^{T}$, de colonnes $y_{j}X$ non toutes nulles, est de rang $1$.

    **Le calcul.** Les coefficients de $M = X{Y}^{T}$ sont les $x_{i}y_{j}$, donc, par la proposition 1 (ii), 
    $$\lVert M \rVert^{2} = \sum_{i, j} x_{i}^{2}y_{j}^{2} = \lVert X \rVert^{2}\lVert Y \rVert^{2}, \qquad \langle M, I_{n} \rangle = \operatorname{tr}(M) = \sum_{i} x_{i}y_{i} = \langle X, Y \rangle.$$
     On note $s = \lVert X \rVert\,\lVert Y \rVert$, qui est strictement positif. Comme $\lVert I_{n} \rVert^{2} = n$, la proposition 3 (ii) et l'inégalité de Cauchy-Schwarz donnent 
    $$\lVert M - I_{n} \rVert^{2} = s^{2} - 2\langle X, Y \rangle + n \geqslant s^{2} - 2s + n = (s - 1)^{2} + n - 1 \geqslant n - 1.$$

    **Le cas d'égalité.** Il y a égalité si et seulement si $s = 1$ et $\langle X, Y \rangle = \lVert X \rVert\,\lVert Y \rVert$. La seconde condition équivaut, par le cas d'égalité de l'inégalité triangulaire (théorème 2), comme dans l'assertion 4 de l'exercice 49, à $Y = \lambda X$ avec $\lambda \geqslant 0$, et même $\lambda > 0$ puisque $Y \neq 0$. La première s'écrit alors $\lambda\lVert X \rVert^{2} = 1$, et $M = \lambda X{X}^{T} = \frac{X{X}^{T}}{\lVert X \rVert^{2}}$. Réciproquement, pour une telle matrice, $s = 1$ et $\langle X, Y \rangle = 1$, et $\lVert M - I_{n} \rVert^{2} = 1 - 2 + n = n - 1$. 
    $$\boxed{\inf_{M \in \mathcal{R}} \lVert M - I_{n} \rVert = \sqrt{n - 1}, \quad \text{atteinte exactement en } M = \frac{X{X}^{T}}{\lVert X \rVert^{2}}, \ X \in \mathcal{M}_{n,1}(\mathbb{R}) \setminus \{0\}}$$
     Une recherche aléatoire sur $20\,000$ matrices de rang $1$, pour $n = 2$, $3$ et $4$, ne descend jamais sous $\sqrt{n - 1}$ ✓. La matrice $2X{X}^{T}$, avec $X$ unitaire, donne $\lVert M - I_{n} \rVert^{2} = n$ : il ne suffit pas d'avoir la bonne direction, il faut aussi la bonne « taille ».

    *À retenir.* Pour $X = u$ unitaire, la matrice $u{u}^{T}$ est celle de la projection orthogonale sur la droite $\mathrm{Vect}(u)$, puisque $u{u}^{T}Z = \langle Z, u \rangle\,u$ (proposition 10 (i)). Les matrices de rang $1$ les plus proches de l'identité sont donc les projections orthogonales sur une droite, et il y en a une infinité : la borne inférieure est atteinte, mais pas en un point unique. La valeur $n - 1$ s'interprète aussi : $I_{n} - u{u}^{T}$ est la projection orthogonale sur l'hyperplan $u^{\perp}$, et pour une matrice $P$ symétrique telle que $P^{2} = P$, on a $\lVert P \rVert^{2} = \operatorname{tr}({P}^{T}P) = \operatorname{tr}(P) = \mathrm{rg}(P)$.
