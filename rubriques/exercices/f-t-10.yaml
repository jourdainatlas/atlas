  page_enonce: 8
  page_corrige: 14
  enonce: |
    On lance $n$ fois un dé équilibré à six faces. Pour chaque lancer, on pose $X_{i} = 1$ si le résultat est un $6$, et $X_{i} = 0$ sinon. La variable $M_{n}$ est alors la fréquence d'apparition du $6$ au cours des $n$ lancers.

    **1.** Déterminer l'espérance et la variance de $X_{1}$.

    **2.** Écrire l'inégalité de concentration vérifiée par $M_{n}$ pour un réel $\delta > 0$.

    **3.** En déduire la limite de $P\left(\left|M_{n} - \dfrac{1}{6}\right| \geqslant \delta\right)$ lorsque $n$ tend vers $+\infty$, et interpréter ce résultat.

    **4.** Déterminer le nombre minimal de lancers pour que la fréquence du $6$ s'écarte de $\dfrac{1}{6}$ de moins de $0{,}01$, avec une probabilité d'au moins $0{,}95$.
  corrige: |
    **1.** La variable $X_{1}$ suit la loi de Bernoulli de paramètre $p = \dfrac{1}{6}$, puisque le dé est équilibré : 
    $$E(X_{1}) = \boxed{\dfrac{1}{6}} \qquad;\qquad V(X_{1}) = \frac{1}{6} \times \frac{5}{6} = \boxed{\dfrac{5}{36}}$$

    **2.** L'inégalité de concentration s'écrit, pour tout réel $\delta > 0$ : 
    $$\boxed{P\left(\left|M_{n} - \dfrac{1}{6}\right| \geqslant \delta\right) \; \leqslant \; \dfrac{5}{36\,n\,\delta^{2}}}$$

    **3.** À $\delta$ fixé, le majorant est de la forme $\dfrac{C}{n}$ avec $C = \dfrac{5}{36\delta^{2}}$ constante, donc il tend vers $0$. Le théorème des gendarmes donne alors : 
    $$\boxed{\lim_{n\to+\infty} P\left(\left|M_{n} - \dfrac{1}{6}\right| \geqslant \delta\right) = 0}$$

    $$\boxed{\text{La fréquence du } 6 \text{ finit par s'approcher de } \dfrac{1}{6} \text{ au sens des probabilités.}}$$
     C'est la conviction évoquée dès la première ligne du chapitre, désormais démontrée.

    **4.** On applique la méthode du cours avec $\delta = 0{,}01$ et $\alpha = 0{,}05$ : 
    $$\frac{5/36}{n \times 0{,}01^{2}} \leqslant 0{,}05 \quad\Longleftrightarrow\quad n \geqslant \frac{5/36}{0{,}05 \times 0{,}0001} = \frac{5/36}{0{,}000005} = \frac{250\,000}{9} \approx 27\,777{,}8$$

    $$\boxed{\text{Il faut au moins } 27\,778 \text{ lancers.}}$$
- id: "t-10-31"
  feuille: "f-t-10"
  numero: 31
  titre: "QCM"
  partie: "Exercices de synthèse"
  etoiles: 0
  types: [QCM, Démonstration]
  mots_cles: [échantillon, somme de variables aléatoires, moyenne empirique, espérance, variance, inégalité de Markov, inégalité de Bienaymé-Tchebychev, inégalité de concentration]
  noeuds: [p-independance, p-esperance, p-loi-faible, p-variables]
  notions: [independance, esperance, variable-aleatoire]
  page_enonce: 8
  page_corrige: 15
  enonce: |
    Pour chaque question, une seule réponse est exacte. La recopier sur la copie et la justifier.

    ```tableau
    Énoncé ¦ **a** ¦ **b** ¦ **c**
    **1.** $X$ a pour variance $100$. La variance de $M_{25}$ vaut : ¦ $4$ ¦ $2$ ¦ $100$
    **2.** $X$ a pour espérance $40$. Alors $E(S_{10})$ vaut : ¦ $4$ ¦ $40$ ¦ $400$
    **3.** $X$ est positive d'espérance $3$. L'inégalité de Markov majore $P(X \geqslant 15)$ par : ¦ $0{,}2$ ¦ $5$ ¦ $0{,}6$
    **4.** $X$ a pour espérance $10$ et pour variance $4$. L'inégalité de Bienaymé-Tchebychev majore $P\big(|X-10| \geqslant 5\big)$ par : ¦ $0{,}8$ ¦ $0{,}16$ ¦ $0{,}4$
    **5.** Pour diviser par $2$ l'écart-type de $M_{n}$, il faut multiplier $n$ par : ¦ $2$ ¦ $4$ ¦ $8$
    **6.** Avec $\sigma^{2} = 12$, $\delta = 0{,}2$ et $n = 300$, le majorant de l'inégalité de concentration vaut : ¦ $0{,}2$ ¦ $0{,}5$ ¦ $1$
    **7.** L'inégalité de Markov s'applique à toute variable aléatoire : ¦ positive ¦ d'espérance nulle ¦ suivant une loi binomiale
    **8.** Pour $\delta > 0$ fixé, la limite de $P\big(|M_{n}-\mu| \geqslant \delta\big)$ lorsque $n$ tend vers $+\infty$ vaut : ¦ $0$ ¦ $\mu$ ¦ $\delta$
    **9.** Avec $\sigma^{2} = 1$ et $\delta = 0{,}1$, la plus petite taille d'échantillon donnant un majorant inférieur ou égal à $0{,}01$ est : ¦ $1\,000$ ¦ $10\,000$ ¦ $100\,000$
    **10.** $X$ suit la loi de Bernoulli de paramètre $0{,}2$. Alors $V(M_{400})$ vaut : ¦ $0{,}16$ ¦ $0{,}0004$ ¦ $0{,}04$
    ```
  corrige: |
    ```tableau
    **Question** ¦ **Réponse** ¦ **Justification**
    **1.** ¦ **a** ¦ $V(M_{25}) = \dfrac{\sigma^{2}}{25} = \dfrac{100}{25} = 4$.
    **2.** ¦ **c** ¦ $E(S_{10}) = 10\mu = 10 \times 40 = 400$.
    **3.** ¦ **a** ¦ $P(X \geqslant 15) \leqslant \dfrac{E(X)}{15} = \dfrac{3}{15} = 0{,}2$.
    **4.** ¦ **b** ¦ $P\big(|X-10| \geqslant 5\big) \leqslant \dfrac{\sigma^{2}}{5^{2}} = \dfrac{4}{25} = 0{,}16$.
    **5.** ¦ **b** ¦ $\sigma(M_{n}) = \dfrac{\sigma}{\sqrt{n}}$ : multiplier $n$ par $4$ multiplie $\sqrt{n}$ par $2$.
    **6.** ¦ **c** ¦ $\dfrac{\sigma^{2}}{n\delta^{2}} = \dfrac{12}{300 \times 0{,}04} = \dfrac{12}{12} = 1$ : aucune information.
    **7.** ¦ **a** ¦ La positivité est la seule hypothèse du théorème 1 (voir l'exercice 13).
    **8.** ¦ **a** ¦ C'est l'énoncé même de la loi faible des grands nombres.
    **9.** ¦ **b** ¦ $\dfrac{1}{n \times 0{,}01} \leqslant 0{,}01 \Longleftrightarrow n \geqslant 10\,000$.
    **10.** ¦ **b** ¦ $V(X) = 0{,}2 \times 0{,}8 = 0{,}16$, donc $V(M_{400}) = \dfrac{0{,}16}{400} = 0{,}0004$.
    ```

    *Piège de la question 10 :* la réponse **a** est la variance de $X$, pas celle de $M_{400}$ ; il ne faut pas oublier de diviser par $n$.
- id: "t-10-32"
  feuille: "f-t-10"
  numero: 32
  titre: "Vrai ou faux"
  partie: "Exercices de synthèse"
  etoiles: 0
  types: [Vrai ou faux]
  mots_cles: [échantillon, somme de variables aléatoires, moyenne empirique, espérance, variance, inégalité de Markov, inégalité de Bienaymé-Tchebychev, inégalité de concentration]
  noeuds: [p-independance, p-esperance, p-loi-faible]
  notions: [independance, esperance]
  page_enonce: 9
  page_corrige: 15
  enonce: |
    Pour chaque affirmation, dire si elle est vraie ou fausse en justifiant la réponse. Dans tout l'exercice, $(X_{1}\,;\dots\,;X_{n})$ désigne un échantillon de taille $n$ de la loi d'une variable aléatoire $X$ d'espérance $\mu$ et de variance $\sigma^{2}$.

    **1.** L'espérance de $M_{n}$ est égale à $\mu$, quelle que soit la taille de l'échantillon.

    **2.** La variance de $S_{n}$ est égale à $\dfrac{\sigma^{2}}{n}$.

    **3.** Si l'on multiplie $n$ par $4$, l'écart-type de $M_{n}$ est divisé par $2$.

    **4.** L'inégalité de Markov s'applique à toute variable aléatoire d'espérance strictement positive.

    **5.** L'inégalité de Bienaymé-Tchebychev peut fournir un majorant supérieur à $1$.

    **6.** L'inégalité de concentration affirme que $M_{n}$ finit par être égale à $\mu$.

    **7.** Quelle que soit la loi de $X$, on a $P\big(|X - \mu| \geqslant 2\sigma\big) \leqslant 0{,}25$.

    **8.** La loi faible des grands nombres est un énoncé portant sur la limite d'une suite de probabilités.

    **9.** Augmenter $n$ de $10\,\%$ divise par $10$ le majorant de l'inégalité de concentration.

    **10.** Les variables aléatoires d'un échantillon sont indépendantes et suivent toutes la même loi.
  corrige: |
    **1.** $\boxed{\textbf{Vraie}}$ C'est la proposition 1 : $E(M_{n}) = \mu$, quelle que soit la valeur de $n$. La moyenne d'un échantillon « vise juste ».

    **2.** $\boxed{\textbf{Fausse}}$ On a $V(S_{n}) = n\sigma^{2}$, et c'est la variance de $M_{n}$ qui vaut $\dfrac{\sigma^{2}}{n}$. La variance de la somme *augmente* avec $n$ (exercice 7).

    **3.** $\boxed{\textbf{Vraie}}$ $\sigma(M_{n}) = \dfrac{\sigma}{\sqrt{n}}$ ; remplacer $n$ par $4n$ remplace $\sqrt{n}$ par $2\sqrt{n}$.

    **4.** $\boxed{\textbf{Fausse}}$ L'hypothèse est que $X$ ne prend que des valeurs *positives*. Une variable d'espérance strictement positive peut prendre des valeurs négatives, comme à l'exercice 13.

    **5.** $\boxed{\textbf{Vraie}}$ Dès que $\delta \leqslant \sigma$, le majorant $\dfrac{\sigma^{2}}{\delta^{2}}$ est supérieur ou égal à $1$ et n'apporte aucune information (exercice 14, question 4).

    **6.** $\boxed{\textbf{Fausse}}$ Elle majore la *probabilité* d'un écart. Aucun théorème du chapitre n'affirme que $M_{n}$ devient égale à $\mu$ (exercice 29, affirmation d'Alice).

    **7.** $\boxed{\textbf{Vraie}}$ C'est le cas $k = 2$ de l'exercice 17 : $P\big(|X-\mu| \geqslant 2\sigma\big) \leqslant \dfrac{1}{2^{2}} = 0{,}25$.

    **8.** $\boxed{\textbf{Vraie}}$ Le théorème 4 affirme que $\lim_{n\to+\infty} P\big(|M_{n} - \mu| \geqslant \delta\big) = 0$ : il s'agit bien de la limite d'une suite de probabilités.

    **9.** $\boxed{\textbf{Fausse}}$ Le majorant $\dfrac{\sigma^{2}}{n\delta^{2}}$ est *inversement proportionnel* à $n$ : augmenter $n$ de $10\,\%$ divise le majorant par $1{,}1$ seulement.

    **10.** $\boxed{\textbf{Vraie}}$ Ce sont les deux conditions de la définition d'un échantillon.
- id: "t-10-33"
  feuille: "f-t-10"
  numero: 33
  titre: "Type Bac"
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Type Bac, Calcul]
  mots_cles: [somme de variables aléatoires, moyenne empirique, espérance, variance, loi faible des grands nombres, "taille d'échantillon", dés et pièces]
  noeuds: [p-esperance, p-loi-faible]
  notions: [esperance]
  page_enonce: 9
  page_corrige: 16
  enonce: |
    Un jeu se déroule ainsi : le joueur lance un dé équilibré à six faces. S'il obtient un $6$, il gagne $5$ € ; sinon, il perd $1$ €. On note $X$ le gain algébrique, en euros, du joueur à l'issue d'une partie.

    **Partie A**

    **1.** Déterminer la loi de $X$.

    **2.** Calculer $E(X)$. Le jeu est-il équitable ?

    **3.** Calculer $V(X)$.

    **Partie B**

    Un joueur enchaîne $100$ parties indépendantes. On note $S_{100}$ son gain total et $M_{100}$ son gain moyen par partie.

    **1.** Calculer $E(S_{100})$, $V(S_{100})$, $E(M_{100})$ et $V(M_{100})$.

    **2.** Majorer $P\big(|M_{100}| \geqslant 0{,}5\big)$.

    **3.** En déduire une majoration de la probabilité que le gain total du joueur dépasse $50$ € en valeur absolue.

    **Partie C**

    **1.** Déterminer le nombre minimal de parties pour que le gain moyen s'écarte de $0$ de moins de $0{,}1$ €, avec une probabilité d'au moins $0{,}95$.

    **2.** Que dit la loi faible des grands nombres à propos de ce jeu ? Rédiger la conclusion en une phrase à l'attention d'un joueur qui espère s'enrichir.
  corrige: |
    **Partie A**

    **1.** Le joueur gagne $5$ € s'il obtient un $6$, ce qui a une chance sur six de se produire, et perd $1$ € dans les cinq autres cas :

    $$\begin{array}{|c|c|c|} \hline x_{i} & -1 & 5 \\ \hline P(X = x_{i}) & \dfrac{5}{6} & \dfrac{1}{6} \\ \hline \end{array}$$

    **2.** On applique la définition de l'espérance : 
    $$E(X) = (-1) \times \frac{5}{6} + 5 \times \frac{1}{6} = -\frac{5}{6} + \frac{5}{6} = \boxed{0}$$

    $$\boxed{\text{L'espérance de gain est nulle : le jeu est équitable.}}$$

    **3.** On passe par $E(X^{2})$ : 
    $$E(X^{2}) = 1 \times \frac{5}{6} + 25 \times \frac{1}{6} = \frac{5 + 25}{6} = \frac{30}{6} = 5$$

    $$V(X) = E(X^{2}) - \big(E(X)\big)^{2} = 5 - 0 = \boxed{5}$$

    **Partie B**

    **1.** Les $100$ parties étant indépendantes et identiques, elles forment un échantillon de taille $100$ de la loi de $X$ : 
    $$\boxed{\begin{array}{l} E(S_{100}) = 100 \times 0 = 0 \quad;\quad V(S_{100}) = 100 \times 5 = 500 \\[1mm] E(M_{100}) = 0 \quad;\quad V(M_{100}) = \dfrac{5}{100} = 0{,}05 \end{array}}$$

    **2.** Comme $E(M_{100}) = 0$, l'inégalité de concentration s'écrit : 
    $$P\big(|M_{100} - 0| \geqslant 0{,}5\big) \; \leqslant \; \frac{5}{100 \times 0{,}5^{2}} = \frac{5}{25} = \boxed{0{,}2}$$

    **3.** Comme $S_{100} = 100\,M_{100}$, on a pour tout réel : 
    $$|S_{100}| \geqslant 50 \quad\Longleftrightarrow\quad 100\,|M_{100}| \geqslant 50 \quad\Longleftrightarrow\quad |M_{100}| \geqslant 0{,}5$$
     Les deux événements sont identiques, donc : 
    $$\boxed{P\big(|S_{100}| \geqslant 50\big) \; \leqslant \; 0{,}2}$$
     Après $100$ parties, le joueur a donc au plus une chance sur cinq d'avoir gagné ou perdu $50$ € ou plus.

    **Partie C**

    **1.** On cherche $n$ tel que $P\big(|M_{n}| \geqslant 0{,}1\big) \leqslant 0{,}05$ : 
    $$\frac{5}{n \times 0{,}1^{2}} \leqslant 0{,}05 \quad\Longleftrightarrow\quad n \geqslant \frac{5}{0{,}05 \times 0{,}01} = \frac{5}{0{,}0005} = 10\,000$$

    $$\boxed{\text{Il faut au moins } 10\,000 \text{ parties.}}$$

    **2.** La loi faible des grands nombres donne, pour tout $\delta > 0$ : 
    $$\lim_{n\to+\infty} P\big(|M_{n} - 0| \geqslant \delta\big) = 0$$

    $$\boxed{\text{Le gain moyen par partie se concentre autour de } 0 \text{ lorsque le nombre de parties augmente.}}$$
     Conclusion à l'attention du joueur : plus il joue, plus il est probable que son gain *moyen* soit proche de zéro. Le hasard peut lui être favorable sur quelques parties, mais la répétition ne fait que rendre l'enrichissement de plus en plus improbable.
- id: "t-10-34"
  feuille: "f-t-10"
  numero: 34
  titre: "Type Bac"
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Type Bac, Problème, Démonstration, Calcul]
  mots_cles: [somme de variables aléatoires, moyenne empirique, espérance, variance, inégalité de concentration, loi de Bernoulli, "taille d'échantillon", méthode de Monte-Carlo]
  noeuds: [p-esperance, p-loi-faible, p-variables]
  notions: [esperance, variable-aleatoire]
  page_enonce: 9
  page_corrige: 17
  enonce: |
    On souhaite obtenir une valeur approchée du nombre $\pi$ sans jamais le calculer. Pour cela, on choisit au hasard un point dans le carré de sommets $(0\,;0)$, $(1\,;0)$, $(1\,;1)$ et $(0\,;1)$, et on pose $X = 1$ si ce point appartient au quart de disque de centre $(0\,;0)$ et de rayon $1$, et $X = 0$ sinon. On admet que la probabilité que le point appartienne à une partie du carré est égale à l'aire de cette partie.

    On répète l'expérience $n$ fois de façon indépendante et on note $M_{n}$ la fréquence des points tombés dans le quart de disque.

    **1.** Justifier que $E(X) = \dfrac{\pi}{4}$, et exprimer $V(X)$ en fonction de $\pi$.

    **2.** Démontrer que $V(X) \leqslant \dfrac{1}{4}$.

    **3.** En déduire que, pour tout réel $\delta > 0$ : 
    $$P\left(\left|M_{n} - \frac{\pi}{4}\right| \geqslant \delta\right) \; \leqslant \; \frac{1}{4n\delta^{2}}$$

    **4.** On pose $Y_{n} = 4M_{n}$, valeur approchée de $\pi$ fournie par la simulation. Montrer que, pour tout réel $\varepsilon > 0$, les événements $\big(|Y_{n} - \pi| \geqslant \varepsilon\big)$ et $\left(\left|M_{n} - \dfrac{\pi}{4}\right| \geqslant \dfrac{\varepsilon}{4}\right)$ sont identiques, puis établir : 
    $$P\big(|Y_{n} - \pi| \geqslant \varepsilon\big) \; \leqslant \; \frac{4}{n\varepsilon^{2}}$$

    **5.** Déterminer le nombre minimal de tirages pour que $Y_{n}$ donne $\pi$ à $0{,}01$ près, avec une probabilité d'au moins $0{,}99$.

    **6.** Commenter ce résultat du point de vue de l'efficacité de la méthode.
  corrige: |
    **1.** La variable $X$ suit une loi de Bernoulli, dont le paramètre est la probabilité que le point tombe dans le quart de disque. D'après l'énoncé, cette probabilité est l'aire de ce quart de disque, soit $\dfrac{\pi \times 1^{2}}{4}$. Comme le carré est de côté $1$, son aire vaut $1$ et il n'y a pas lieu de diviser : 
    $$E(X) = P(X = 1) = \boxed{\dfrac{\pi}{4}}$$

    $$V(X) = \frac{\pi}{4}\left(1 - \frac{\pi}{4}\right) = \boxed{\dfrac{\pi}{4} - \dfrac{\pi^{2}}{16}}$$

    **2.** On a établi à l'exercice 25 que $p(1-p) \leqslant \dfrac{1}{4}$ pour tout $p \in [0\,;1]$, l'égalité $\dfrac{1}{4} - p(1-p) = \left(p - \dfrac{1}{2}\right)^{2}$ montrant que la différence est un carré. En appliquant ce résultat à $p = \dfrac{\pi}{4}$, qui appartient bien à $[0\,;1]$ : 
    $$\boxed{V(X) \leqslant \dfrac{1}{4}}$$

    **3.** L'inégalité de concentration appliquée à $M_{n}$, d'espérance $\dfrac{\pi}{4}$ et de variance $\dfrac{V(X)}{n}$, donne : 
    $$P\left(\left|M_{n} - \frac{\pi}{4}\right| \geqslant \delta\right) \; \leqslant \; \frac{V(X)}{n\delta^{2}} \; \leqslant \; \boxed{\dfrac{1}{4n\delta^{2}}}$$

    **4.** Comme $Y_{n} = 4M_{n}$, on a $Y_{n} - \pi = 4\left(M_{n} - \dfrac{\pi}{4}\right)$, donc $|Y_{n} - \pi| = 4\left|M_{n} - \dfrac{\pi}{4}\right|$. Pour tout réel $\varepsilon > 0$ : 
    $$|Y_{n} - \pi| \geqslant \varepsilon \quad\Longleftrightarrow\quad 4\left|M_{n} - \frac{\pi}{4}\right| \geqslant \varepsilon \quad\Longleftrightarrow\quad \left|M_{n} - \frac{\pi}{4}\right| \geqslant \frac{\varepsilon}{4}$$
     Les deux événements sont donc identiques et ont la même probabilité. On applique alors la question 3 avec $\delta = \dfrac{\varepsilon}{4}$ : 
    $$P\big(|Y_{n} - \pi| \geqslant \varepsilon\big) \; \leqslant \; \frac{1}{4n\left(\dfrac{\varepsilon}{4}\right)^{2}} = \frac{1}{4n \times \dfrac{\varepsilon^{2}}{16}} = \boxed{\dfrac{4}{n\varepsilon^{2}}}$$

    **5.** On veut $P\big(|Y_{n} - \pi| \geqslant 0{,}01\big) \leqslant 0{,}01$ : 
    $$\frac{4}{n \times 0{,}01^{2}} \leqslant 0{,}01 \quad\Longleftrightarrow\quad n \geqslant \frac{4}{0{,}01 \times 0{,}0001} = \frac{4}{0{,}000001} = 4\,000\,000$$

    $$\boxed{\text{Il faut au moins } 4 \text{ millions de tirages.}}$$

    **6.** Quatre millions de tirages pour deux décimales de $\pi$ : c'est considérable, alors qu'une décimale supplémentaire coûterait cent fois plus, soit $400$ millions de tirages (exercice 24). 
    $$\boxed{\text{La méthode converge très lentement : elle n'est pas compétitive pour calculer } \pi.}$$
     Son intérêt est ailleurs : elle s'applique telle quelle à des aires ou des volumes que l'on ne sait pas calculer, ce qui n'est pas le cas ici. On notera aussi que la majoration obtenue reste une *garantie* : la précision réellement atteinte est en général bien meilleure, comme le laissait prévoir l'exercice 18.
- id: "t-10-35"
  feuille: "f-t-10"
  numero: 35
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [échantillon, moyenne empirique, espérance, variance, loi faible des grands nombres, "taille d'échantillon", modélisation]
  noeuds: [p-independance, p-esperance, p-loi-faible]
  notions: [independance, esperance]
  page_enonce: 10
  page_corrige: 18
  enonce: |
    Une compagnie d'assurance propose un contrat pour lequel le coût annuel $X$ supporté par la compagnie, en euros, vaut $0$ avec la probabilité $0{,}95$ et $4\,000$ avec la probabilité $0{,}05$.

    **1.** Calculer $E(X)$ et $V(X)$.

    **2.** La compagnie détient $10\,000$ contrats, dont les coûts forment un échantillon de la loi de $X$. Calculer l'espérance et la variance du coût moyen $M_{10\,000}$ par contrat.

    **3.** La prime annuelle demandée à chaque client est de $250$ €. Montrer que la compagnie est déficitaire lorsque $M_{10\,000}$ dépasse $250$, puis majorer la probabilité de cet événement.

    **4.** Combien de contrats la compagnie doit-elle détenir pour que cette probabilité soit majorée par $0{,}01$ ?

    **5.** Expliquer, à l'aide de la loi faible des grands nombres, pourquoi une compagnie d'assurance peut prévoir avec précision son coût total sans savoir prévoir le coût d'un contrat particulier.
  corrige: |
    **1.** On applique les définitions : 
    $$E(X) = 0 \times 0{,}95 + 4\,000 \times 0{,}05 = \boxed{200 \text{ €}}$$

    $$E(X^{2}) = 4\,000^{2} \times 0{,}05 = 16\,000\,000 \times 0{,}05 = 800\,000$$

    $$V(X) = 800\,000 - 200^{2} = 800\,000 - 40\,000 = \boxed{760\,000}$$
     L'écart-type vaut $\sqrt{760\,000} \approx 871{,}8$ €, soit bien plus que l'espérance : un contrat isolé est très imprévisible.

    **2.** La proposition 1 donne : 
    $$E(M_{10\,000}) = \boxed{200 \text{ €}} \qquad;\qquad V(M_{10\,000}) = \frac{760\,000}{10\,000} = \boxed{76}$$
     L'écart-type du coût moyen n'est plus que de $\sqrt{76} \approx 8{,}7$ €.

    **3.** La compagnie encaisse $250$ € par contrat et dépense en moyenne $M_{10\,000}$ € par contrat. Elle est donc déficitaire lorsque $M_{10\,000} > 250$. Comme $250 = 200 + 50$ : 
    $$\big(M_{10\,000} > 250\big) \;\text{ est inclus dans }\; \big(|M_{10\,000} - 200| \geqslant 50\big)$$
     L'inégalité de concentration donne alors : 
    $$P\big(|M_{10\,000} - 200| \geqslant 50\big) \; \leqslant \; \frac{760\,000}{10\,000 \times 50^{2}} = \frac{760\,000}{25\,000\,000} = 0{,}0304$$

    $$\boxed{P\big(M_{10\,000} > 250\big) \; \leqslant \; 0{,}0304}$$

    *Piège :* l'inégalité de concentration porte sur un écart en *valeur absolue*, donc des deux côtés de l'espérance. On majore ici la probabilité d'un déficit par celle, plus grande, d'un écart dans un sens ou dans l'autre.

    **4.** On cherche $n$ tel que le majorant soit inférieur ou égal à $0{,}01$ : 
    $$\frac{760\,000}{n \times 50^{2}} \leqslant 0{,}01 \quad\Longleftrightarrow\quad n \geqslant \frac{760\,000}{0{,}01 \times 2\,500} = \frac{760\,000}{25} = 30\,400$$

    $$\boxed{\text{Il faut au moins } 30\,400 \text{ contrats.}}$$

    **5.** Pour un contrat isolé, l'écart-type ($872$ € environ) dépasse largement l'espérance : la compagnie est incapable de prévoir si un client donné coûtera $0$ ou $4\,000$ €. Mais la loi faible des grands nombres affirme que, pour tout $\delta > 0$ : 
    $$\lim_{n\to+\infty} P\big(|M_{n} - 200| \geqslant \delta\big) = 0$$

    $$\boxed{\begin{array}{l} \text{Le coût \emph{moyen} par contrat se concentre autour de } 200 \text{ € lorsque } n \text{ augmente,} \\[1mm] \text{donc le coût \emph{total} } S_{n} = n\,M_{n} \text{ devient prévisible avec une précision relative croissante.} \end{array}}$$
     C'est le principe même de la mutualisation du risque, cité en fin de chapitre : l'assureur ne prévoit pas les sinistres, il prévoit leur moyenne.
