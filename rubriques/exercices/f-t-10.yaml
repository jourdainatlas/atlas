- id: "t-10-01"
  feuille: "f-t-10"
  numero: 1
  partie: "Échantillon d'une variable aléatoire"
  etoiles: 1
  types: [Calcul]
  mots_cles: [échantillon, somme de variables aléatoires, moyenne empirique, espérance, variance]
  noeuds: [p-independance, p-esperance]
  notions: [independance, esperance]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $X$ une variable aléatoire d'espérance $\mu = 12$ et de variance $\sigma^{2} = 9$. Pour chacune des tailles $n$ proposées, on considère un échantillon $(X_{1}\,;\dots\,;X_{n})$ de la loi de $X$.

    Calculer $E(S_{n})$, $V(S_{n})$, $E(M_{n})$ et $V(M_{n})$ pour :

    **1.** $n = 4$

    **2.** $n = 25$

    **3.** $n = 100$

    **4.** $n = 900$
  corrige: |
    On applique la proposition 1 du cours, avec $\mu = 12$ et $\sigma^{2} = 9$ : 
    $$E(S_{n}) = n\mu \quad;\quad V(S_{n}) = n\sigma^{2} \quad;\quad E(M_{n}) = \mu \quad;\quad V(M_{n}) = \frac{\sigma^{2}}{n}$$

    **1.** Pour $n = 4$ : 
    $$E(S_{4}) = 4 \times 12 = 48 \quad;\quad V(S_{4}) = 4 \times 9 = 36 \quad;\quad E(M_{4}) = 12 \quad;\quad V(M_{4}) = \frac{9}{4} = 2{,}25$$

    $$\boxed{\begin{array}{l} E(S_{4}) = 48 \quad;\quad V(S_{4}) = 36 \\[1mm] E(M_{4}) = 12 \quad;\quad V(M_{4}) = 2{,}25 \end{array}}$$

    **2.** On procède de la même manière pour $n = 25$ : 
    $$\boxed{\begin{array}{l} E(S_{25}) = 300 \quad;\quad V(S_{25}) = 225 \\[1mm] E(M_{25}) = 12 \quad;\quad V(M_{25}) = \dfrac{9}{25} = 0{,}36 \end{array}}$$

    **3.** Pour $n = 100$ : 
    $$\boxed{\begin{array}{l} E(S_{100}) = 1\,200 \quad;\quad V(S_{100}) = 900 \\[1mm] E(M_{100}) = 12 \quad;\quad V(M_{100}) = 0{,}09 \end{array}}$$

    **4.** Pour $n = 900$ : 
    $$\boxed{\begin{array}{l} E(S_{900}) = 10\,800 \quad;\quad V(S_{900}) = 8\,100 \\[1mm] E(M_{900}) = 12 \quad;\quad V(M_{900}) = 0{,}01 \end{array}}$$

    On remarque que l'espérance de $M_{n}$ ne dépend pas de $n$, alors que sa variance est divisée par $n$ : c'est exactement ce que dit la remarque du cours, « augmenter la taille de l'échantillon ne déplace pas la cible, cela réduit la dispersion des tirs ».
- id: "t-10-02"
  feuille: "f-t-10"
  numero: 2
  partie: "Échantillon d'une variable aléatoire"
  etoiles: 1
  types: [Calcul]
  mots_cles: [somme de variables aléatoires, moyenne empirique, espérance, variance, dés et pièces]
  noeuds: [p-esperance]
  notions: [esperance]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    On lance un dé équilibré à six faces et on note $X$ le numéro obtenu.

    **1.** Déterminer $E(X)$ puis $V(X)$ sous forme de fraction irréductible.

    **2.** On effectue $12$ lancers. Calculer $E(S_{12})$, $V(S_{12})$, $E(M_{12})$ et $V(M_{12})$.

    **3.** Reprendre la question précédente pour $1000$ lancers, en arrondissant $V(M_{1000})$ à $10^{-4}$.
  corrige: |
    **1.** La variable $X$ prend les valeurs $1$, $2$, …, $6$, chacune avec la probabilité $\dfrac{1}{6}$. Donc : 
    $$E(X) = \frac{1+2+3+4+5+6}{6} = \frac{21}{6} = \boxed{\dfrac{7}{2} = 3{,}5}$$
     Pour la variance, on passe par $E(X^{2})$ : 
    $$E(X^{2}) = \frac{1+4+9+16+25+36}{6} = \frac{91}{6}$$

    $$V(X) = E(X^{2}) - \big(E(X)\big)^{2} = \frac{91}{6} - \frac{49}{4} = \frac{182 - 147}{12} = \boxed{\dfrac{35}{12}}$$

    *Piège :* on n'oublie pas d'élever $E(X)$ au carré. Écrire $V(X) = \frac{91}{6} - \frac{7}{2}$ est l'erreur la plus fréquente.

    **2.** Les $12$ lancers forment un échantillon de taille $12$ de la loi de $X$ : 
    $$E(S_{12}) = 12 \times \frac{7}{2} = 42 \quad;\quad V(S_{12}) = 12 \times \frac{35}{12} = 35$$

    $$E(M_{12}) = \frac{7}{2} \quad;\quad V(M_{12}) = \frac{35/12}{12} = \frac{35}{144}$$

    $$\boxed{\begin{array}{l} E(S_{12}) = 42 \quad;\quad V(S_{12}) = 35 \\[1mm] E(M_{12}) = 3{,}5 \quad;\quad V(M_{12}) = \dfrac{35}{144} \end{array}}$$

    **3.** On procède de la même manière avec $n = 1000$ : 
    $$E(S_{1000}) = 3\,500 \quad;\quad V(S_{1000}) = 1000 \times \frac{35}{12} = \frac{8\,750}{3} \approx 2\,916{,}67$$

    $$V(M_{1000}) = \frac{35}{12 \times 1000} = \frac{7}{2\,400} \approx 0{,}0029$$

    $$\boxed{\begin{array}{l} E(S_{1000}) = 3\,500 \quad;\quad V(S_{1000}) \approx 2\,916{,}67 \\[1mm] E(M_{1000}) = 3{,}5 \quad;\quad V(M_{1000}) \approx 0{,}0029 \end{array}}$$
- id: "t-10-03"
  feuille: "f-t-10"
  numero: 3
  partie: "Échantillon d'une variable aléatoire"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [échantillon, somme de variables aléatoires, moyenne empirique, espérance, variance, loi de Bernoulli]
  noeuds: [p-independance, p-esperance, p-variables]
  notions: [independance, esperance, variable-aleatoire]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Une urne contient des boules dont $30\,\%$ sont rouges. On y effectue $50$ tirages avec remise et, pour chaque tirage, on pose $X_{i} = 1$ si la boule est rouge et $X_{i} = 0$ sinon.

    **1.** Justifier que $(X_{1}\,;\dots\,;X_{50})$ est un échantillon de taille $50$ de la loi de Bernoulli de paramètre $0{,}3$.

    **2.** Calculer $E(X_{1})$ et $V(X_{1})$.

    **3.** En déduire $E(S_{50})$, $V(S_{50})$, $E(M_{50})$ et $V(M_{50})$.

    **4.** Quelle loi suit la variable $S_{50}$ ? Vérifier que les résultats de la question précédente sont cohérents avec les formules du chapitre 2.

    **5.** Que représente concrètement la variable $M_{50}$ ?
  corrige: |
    **1.** Les tirages sont effectués *avec remise* : la composition de l'urne est la même à chaque tirage, donc les variables $X_{1}$, …, $X_{50}$ sont indépendantes et suivent toutes la même loi. Chacune ne prend que les valeurs $0$ et $1$, avec $P(X_{i} = 1) = 0{,}3$. 
    $$\boxed{\text{Il s'agit bien d'un échantillon de taille } 50 \text{ de la loi de Bernoulli de paramètre } 0{,}3.}$$

    **2.** Pour une loi de Bernoulli de paramètre $p$ : 
    $$E(X_{1}) = p = \boxed{0{,}3} \qquad\text{et}\qquad V(X_{1}) = p(1-p) = 0{,}3 \times 0{,}7 = \boxed{0{,}21}$$

    **3.** On applique la proposition 1 : 
    $$E(S_{50}) = 50 \times 0{,}3 = 15 \quad;\quad V(S_{50}) = 50 \times 0{,}21 = 10{,}5$$

    $$E(M_{50}) = 0{,}3 \quad;\quad V(M_{50}) = \frac{0{,}21}{50} = 0{,}0042$$

    $$\boxed{\begin{array}{l} E(S_{50}) = 15 \quad;\quad V(S_{50}) = 10{,}5 \\[1mm] E(M_{50}) = 0{,}3 \quad;\quad V(M_{50}) = 0{,}0042 \end{array}}$$

    **4.** La variable $S_{50}$ compte le nombre de succès lors de $50$ épreuves de Bernoulli identiques et indépendantes : 
    $$\boxed{S_{50} \text{ suit la loi binomiale } \mathcal{B}(50\,;0{,}3).}$$
     Les formules du chapitre 2 donnent $E(S_{50}) = np = 15$ et $V(S_{50}) = np(1-p) = 10{,}5$ : on retrouve bien les valeurs de la question 3.

    **5.** On a $M_{50} = \dfrac{S_{50}}{50}$, quotient du nombre de boules rouges obtenues par le nombre de tirages. 
    $$\boxed{M_{50} \text{ est la fréquence de boules rouges observée sur les } 50 \text{ tirages.}}$$
- id: "t-10-04"
  feuille: "f-t-10"
  numero: 4
  partie: "Échantillon d'une variable aléatoire"
  etoiles: 1
  types: [Calcul]
  mots_cles: [échantillon, somme de variables aléatoires, moyenne empirique, espérance, variance]
  noeuds: [p-independance, p-esperance]
  notions: [independance, esperance]
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Dans chaque cas, $(X_{1}\,;\dots\,;X_{n})$ est un échantillon de taille $n$ de la loi d'une variable aléatoire $X$ d'espérance $\mu$ et de variance $\sigma^{2}$. Déterminer la quantité demandée.

    **1.** $n = 30$ et $E(S_{30}) = 210$ : déterminer $\mu$.

    **2.** $n = 12$ et $V(S_{12}) = 48$ : déterminer $\sigma^{2}$.

    **3.** $\sigma^{2} = 20$ et $V(M_{n}) = 0{,}05$ : déterminer $n$.

    **4.** $\sigma = 4$ et l'écart-type de $M_{n}$ vaut $0{,}2$ : déterminer $n$.
  corrige: |
    **1.** On part de $E(S_{n}) = n\mu$ : 
    $$30\mu = 210 \quad\Longleftrightarrow\quad \mu = \frac{210}{30} = \boxed{7}$$

    **2.** On part de $V(S_{n}) = n\sigma^{2}$ : 
    $$12\sigma^{2} = 48 \quad\Longleftrightarrow\quad \sigma^{2} = \frac{48}{12} = \boxed{4}$$

    **3.** On part de $V(M_{n}) = \dfrac{\sigma^{2}}{n}$ : 
    $$\frac{20}{n} = 0{,}05 \quad\Longleftrightarrow\quad n = \frac{20}{0{,}05} = \boxed{400}$$

    **4.** L'écart-type de $M_{n}$ vaut $0{,}2$, donc sa variance vaut $0{,}2^{2} = 0{,}04$. Comme $\sigma = 4$, on a $\sigma^{2} = 16$ : 
    $$\frac{16}{n} = 0{,}04 \quad\Longleftrightarrow\quad n = \frac{16}{0{,}04} = \boxed{400}$$

    *Piège :* la proposition 1 porte sur la *variance* de $M_{n}$, pas sur son écart-type. Il faut donc élever $0{,}2$ au carré avant d'utiliser la formule.
- id: "t-10-05"
  feuille: "f-t-10"
  numero: 5
  partie: "Échantillon d'une variable aléatoire"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [échantillon, moyenne empirique, variance, "taille d'échantillon"]
  noeuds: [p-independance, p-esperance]
  notions: [independance]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $X$ une variable aléatoire de variance $\sigma^{2} = 36$, et $M_{n}$ la moyenne d'un échantillon de taille $n$ de sa loi.

    **1.** Calculer la variance puis l'écart-type de $M_{n}$ pour $n = 9$, $n = 36$ et $n = 144$.

    **2.** Par quel nombre faut-il multiplier $n$ pour diviser par $3$ l'écart-type de $M_{n}$ ? Justifier.

    **3.** Déterminer la plus petite taille d'échantillon pour laquelle l'écart-type de $M_{n}$ est inférieur ou égal à $0{,}1$.
  corrige: |
    **1.** On a $V(M_{n}) = \dfrac{36}{n}$, et l'écart-type est la racine carrée de la variance : 
    $$\boxed{\begin{array}{l} n = 9 \;:\; V(M_{9}) = 4 \text{ et } \sigma(M_{9}) = 2 \\[1mm] n = 36 \;:\; V(M_{36}) = 1 \text{ et } \sigma(M_{36}) = 1 \\[1mm] n = 144 \;:\; V(M_{144}) = 0{,}25 \text{ et } \sigma(M_{144}) = 0{,}5 \end{array}}$$

    **2.** De façon générale : 
    $$\sigma(M_{n}) = \sqrt{\frac{\sigma^{2}}{n}} = \frac{\sigma}{\sqrt{n}}$$
     Remplacer $n$ par $kn$ divise donc cet écart-type par $\sqrt{k}$. Pour obtenir une division par $3$, il faut $\sqrt{k} = 3$, c'est-à-dire : 
    $$\boxed{\text{Il faut multiplier } n \text{ par } 9.}$$
     On le vérifie sur la question 1 : en passant de $n = 4$ à $n = 36$, l'écart-type passerait de $3$ à $1$.

    **3.** On cherche le plus petit entier $n$ tel que $\sigma(M_{n}) \leqslant 0{,}1$, ce qui revient à $V(M_{n}) \leqslant 0{,}01$ : 
    $$\frac{36}{n} \leqslant 0{,}01 \quad\Longleftrightarrow\quad n \geqslant \frac{36}{0{,}01} = 3\,600$$

    $$\boxed{\text{La plus petite taille convenable est } n = 3\,600.}$$
- id: "t-10-06"
  feuille: "f-t-10"
  numero: 6
  partie: "Échantillon d'une variable aléatoire"
  etoiles: 2
  types: [Calcul]
  mots_cles: [échantillon, moyenne empirique, espérance, variance]
  noeuds: [p-independance, p-esperance]
  notions: [independance, esperance]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    La loi de la variable aléatoire $X$ est donnée par le tableau suivant :

    $$\begin{array}{|c|c|c|c|c|} \hline x_{i} & 1 & 2 & 3 & 4 \\ \hline P(X = x_{i}) & 0{,}1 & 0{,}2 & 0{,}3 & 0{,}4 \\ \hline \end{array}$$

    **1.** Vérifier qu'il s'agit bien d'une loi de probabilité, puis calculer $E(X)$ et $V(X)$.

    **2.** On considère un échantillon de taille $25$ de la loi de $X$. Calculer $E(M_{25})$ et l'écart-type de $M_{25}$.

    **3.** Même question pour un échantillon de taille $100$.
  corrige: |
    **1.** La somme des probabilités vaut $0{,}1 + 0{,}2 + 0{,}3 + 0{,}4 = 1$, et toutes sont positives : 
    $$\boxed{\text{Il s'agit bien d'une loi de probabilité.}}$$

    $$E(X) = 1 \times 0{,}1 + 2 \times 0{,}2 + 3 \times 0{,}3 + 4 \times 0{,}4 = 0{,}1 + 0{,}4 + 0{,}9 + 1{,}6 = \boxed{3}$$

    $$E(X^{2}) = 1 \times 0{,}1 + 4 \times 0{,}2 + 9 \times 0{,}3 + 16 \times 0{,}4 = 0{,}1 + 0{,}8 + 2{,}7 + 6{,}4 = 10$$

    $$V(X) = 10 - 3^{2} = \boxed{1}$$

    **2.** Pour $n = 25$ : 
    $$E(M_{25}) = \mu = \boxed{3} \qquad;\qquad V(M_{25}) = \frac{1}{25} = 0{,}04 \quad\text{donc}\quad \sigma(M_{25}) = \sqrt{0{,}04} = \boxed{0{,}2}$$

    **3.** On procède de la même manière pour $n = 100$ : 
    $$E(M_{100}) = \boxed{3} \qquad;\qquad V(M_{100}) = \frac{1}{100} = 0{,}01 \quad\text{donc}\quad \sigma(M_{100}) = \boxed{0{,}1}$$

    On multiplie $n$ par $4$ et l'écart-type est divisé par $2$ : c'est la règle établie à l'exercice 5.
- id: "t-10-07"
  feuille: "f-t-10"
  numero: 7
  partie: "Échantillon d'une variable aléatoire"
  etoiles: 2
  types: [Calcul]
  mots_cles: [échantillon, somme de variables aléatoires, moyenne empirique, espérance, variance, dés et pièces, modélisation]
  noeuds: [p-independance, p-esperance]
  notions: [independance, esperance]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Une chaîne de production fabrique des pièces dont la masse, en grammes, est une variable aléatoire $X$ d'espérance $250$ et d'écart-type $4$. On prélève au hasard $64$ pièces, dont les masses forment un échantillon de la loi de $X$.

    **1.** Calculer l'espérance et l'écart-type de la masse totale $S_{64}$ des $64$ pièces.

    **2.** Calculer l'espérance et l'écart-type de la masse moyenne $M_{64}$.

    **3.** Comparer les deux écarts-types obtenus et commenter.
  corrige: |
    Ici $\mu = 250$ et $\sigma = 4$, donc $\sigma^{2} = 16$, et $n = 64$.

    **1.** On additionne les masses des $64$ pièces : 
    $$E(S_{64}) = 64 \times 250 = \boxed{16\,000 \text{ g}}$$

    $$V(S_{64}) = 64 \times 16 = 1\,024 \qquad\text{donc}\qquad \sigma(S_{64}) = \sqrt{1\,024} = \boxed{32 \text{ g}}$$

    **2.** La masse moyenne se déduit de la proposition 1 : 
    $$E(M_{64}) = \boxed{250 \text{ g}}$$

    $$V(M_{64}) = \frac{16}{64} = 0{,}25 \qquad\text{donc}\qquad \sigma(M_{64}) = \sqrt{0{,}25} = \boxed{0{,}5 \text{ g}}$$

    **3.** L'écart-type de la masse totale ($32$ g) est bien plus grand que celui d'une seule pièce ($4$ g), alors que celui de la masse moyenne ($0{,}5$ g) est bien plus petit. 
    $$\boxed{\begin{array}{l} \text{En additionnant, les fluctuations s'accumulent : } \sigma(S_{n}) = \sigma\sqrt{n} \text{ augmente.} \\[1mm] \text{En moyennant, elles se compensent : } \sigma(M_{n}) = \dfrac{\sigma}{\sqrt{n}} \text{ diminue.} \end{array}}$$
- id: "t-10-08"
  feuille: "f-t-10"
  numero: 8
  partie: "Inégalité de Markov"
  etoiles: 1
  types: [Calcul]
  mots_cles: [espérance, inégalité de Markov]
  noeuds: [p-esperance]
  notions: [esperance]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $X$ une variable aléatoire ne prenant que des valeurs positives, d'espérance $E(X) = 6$. Majorer, à l'aide de l'inégalité de Markov, les probabilités suivantes :

    **1.** $P(X \geqslant 8)$

    **2.** $P(X \geqslant 12)$

    **3.** $P(X \geqslant 30)$

    **4.** $P(X \geqslant 60)$

    **5.** $P(X \geqslant 100)$
  corrige: |
    La variable $X$ est positive et $E(X) = 6$ : l'inégalité de Markov s'applique et donne $P(X \geqslant a) \leqslant \dfrac{6}{a}$.

    $$\textbf{1.}\quad P(X \geqslant 8) \leqslant \frac{6}{8} = \boxed{0{,}75} \qquad\qquad \textbf{2.}\quad P(X \geqslant 12) \leqslant \frac{6}{12} = \boxed{0{,}5}$$

    $$\textbf{3.}\quad P(X \geqslant 30) \leqslant \frac{6}{30} = \boxed{0{,}2} \qquad\qquad \textbf{4.}\quad P(X \geqslant 60) \leqslant \frac{6}{60} = \boxed{0{,}1}$$

    $$\textbf{5.}\quad P(X \geqslant 100) \leqslant \frac{6}{100} = \boxed{0{,}06}$$

    On constate que la majoration est d'autant meilleure que le seuil est éloigné de l'espérance.
- id: "t-10-09"
  feuille: "f-t-10"
  numero: 9
  partie: "Inégalité de Markov"
  etoiles: 1
  types: [Calcul]
  mots_cles: [espérance]
  noeuds: [p-esperance]
  notions: [esperance]
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Le temps de trajet $T$, en minutes, d'un automobiliste pour se rendre à son travail est une variable aléatoire positive d'espérance $25$ minutes.

    **1.** Majorer la probabilité que le trajet dure au moins $50$ minutes, puis au moins $75$ minutes, puis au moins $100$ minutes.

    **2.** L'automobiliste affirme : « je mets au moins une heure et quart dans plus d'un jour sur trois ». Ce propos est-il compatible avec la majoration obtenue ?
  corrige: |
    **1.** La variable $T$ est positive et $E(T) = 25$ : 
    $$P(T \geqslant 50) \leqslant \frac{25}{50} = \boxed{0{,}5} \qquad P(T \geqslant 75) \leqslant \frac{25}{75} = \boxed{\dfrac{1}{3} \approx 0{,}333} \qquad P(T \geqslant 100) \leqslant \frac{25}{100} = \boxed{0{,}25}$$

    **2.** Une heure et quart représente $75$ minutes, et « plus d'un jour sur trois » signifie $P(T \geqslant 75) > \dfrac{1}{3}$. Or l'inégalité de Markov garantit $P(T \geqslant 75) \leqslant \dfrac{1}{3}$. 
    $$\boxed{\text{Le propos est incompatible avec la majoration : l'automobiliste exagère.}}$$
- id: "t-10-10"
  feuille: "f-t-10"
  numero: 10
  partie: "Inégalité de Markov"
  etoiles: 1
  types: [Calcul]
  mots_cles: [espérance, inégalité de Markov]
  noeuds: [p-esperance]
  notions: [esperance]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Soit $X$ une variable aléatoire positive d'espérance $8$.

    **1.** Déterminer le plus petit réel $a$ pour lequel l'inégalité de Markov garantit $P(X \geqslant a) \leqslant 0{,}05$.

    **2.** Même question avec $P(X \geqslant a) \leqslant 0{,}01$.

    **3.** Exprimer, en fonction de $E(X)$ et d'un réel $\alpha$ de $]0\,;1]$, le plus petit seuil $a$ pour lequel l'inégalité de Markov garantit $P(X \geqslant a) \leqslant \alpha$.
  corrige: |
    **1.** L'inégalité de Markov donne $P(X \geqslant a) \leqslant \dfrac{8}{a}$. Pour que cette majoration garantisse $0{,}05$, il suffit que : 
    $$\frac{8}{a} \leqslant 0{,}05 \quad\Longleftrightarrow\quad a \geqslant \frac{8}{0{,}05} = 160$$

    $$\boxed{\text{Le plus petit seuil convenable est } a = 160.}$$

    **2.** On procède de la même manière : 
    $$\frac{8}{a} \leqslant 0{,}01 \quad\Longleftrightarrow\quad a \geqslant \frac{8}{0{,}01} = 800 \qquad\text{donc}\qquad \boxed{a = 800}$$

    **3.** Dans le cas général, avec $\alpha \in\; ]0\,;1]$ : 
    $$\frac{E(X)}{a} \leqslant \alpha \quad\Longleftrightarrow\quad a \geqslant \frac{E(X)}{\alpha} \qquad\text{donc}\qquad \boxed{a = \dfrac{E(X)}{\alpha}}$$
     Diviser $\alpha$ par $10$ multiplie donc le seuil par $10$ : on retrouve le passage de $160$ à $800$ entre les questions 1 et 2 lorsque $\alpha$ passe de $0{,}05$ à $0{,}01$.
- id: "t-10-11"
  feuille: "f-t-10"
  numero: 11
  partie: "Inégalité de Markov"
  etoiles: 2
  types: [Calcul]
  mots_cles: [espérance, inégalité de Markov]
  noeuds: [p-esperance]
  notions: [esperance]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    La variable aléatoire $X$, à valeurs positives, a pour loi :

    $$\begin{array}{|c|c|c|c|c|c|} \hline x_{i} & 0 & 1 & 2 & 5 & 10 \\ \hline P(X = x_{i}) & 0{,}15 & 0{,}4 & 0{,}3 & 0{,}1 & 0{,}05 \\ \hline \end{array}$$

    ![Figure](documents/figures/9bfcf556070c11ce.svg)

    **1.** Vérifier que $E(X) = 2$.

    **2.** Calculer les valeurs exactes de $P(X \geqslant 5)$, $P(X \geqslant 10)$ et $P(X \geqslant 2)$.

    **3.** Majorer ces trois probabilités par l'inégalité de Markov.

    **4.** Comparer les résultats des deux questions précédentes, et préciser le cas où la majoration n'apporte aucune information.
  corrige: |
    **1.** On applique la définition de l'espérance : 
    $$E(X) = 0 \times 0{,}15 + 1 \times 0{,}4 + 2 \times 0{,}3 + 5 \times 0{,}1 + 10 \times 0{,}05 = 0 + 0{,}4 + 0{,}6 + 0{,}5 + 0{,}5 = \boxed{2}$$

    **2.** On additionne les probabilités des valeurs concernées : 
    $$P(X \geqslant 5) = 0{,}1 + 0{,}05 = \boxed{0{,}15} \qquad P(X \geqslant 10) = \boxed{0{,}05}$$

    $$P(X \geqslant 2) = 0{,}3 + 0{,}1 + 0{,}05 = \boxed{0{,}45}$$

    **3.** L'inégalité de Markov donne $P(X \geqslant a) \leqslant \dfrac{2}{a}$ : 
    $$P(X \geqslant 5) \leqslant \frac{2}{5} = \boxed{0{,}4} \qquad P(X \geqslant 10) \leqslant \frac{2}{10} = \boxed{0{,}2} \qquad P(X \geqslant 2) \leqslant \frac{2}{2} = \boxed{1}$$

    **4.** On rassemble les résultats :

    $$\begin{array}{|c|c|c|c|} \hline  & P(X \geqslant 5) & P(X \geqslant 10) & P(X \geqslant 2) \\ \hline \text{valeur exacte} & 0{,}15 & 0{,}05 & 0{,}45 \\ \hline \text{majorant de Markov} & 0{,}4 & 0{,}2 & 1 \\ \hline \end{array}$$

    Le majorant est à chaque fois nettement supérieur à la valeur exacte : c'est le prix de la généralité de l'inégalité, qui ne suppose rien sur la loi de $X$ hormis sa positivité. 
    $$\boxed{\text{Pour } a = 2, \text{ le majorant vaut } 1 \text{ : il n'apporte aucune information, car toute probabilité est} \leqslant 1.}$$
     Ce cas est étudié en toute généralité à l'exercice 12.
- id: "t-10-12"
  feuille: "f-t-10"
  numero: 12
  partie: "Inégalité de Markov"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [espérance, inégalité de Markov]
  noeuds: [p-esperance]
  notions: [esperance]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **1.** Soit $X$ une variable aléatoire positive d'espérance $5$. Que donne l'inégalité de Markov pour le seuil $a = 4$ ? Cette information est-elle utile ?

    **2.** Soit $X$ une variable aléatoire positive d'espérance $\mu > 0$ et $a$ un réel tel que $0 < a \leqslant \mu$. Démontrer que l'inégalité de Markov n'apporte alors jamais d'information.

    **3.** La note $X$ obtenue à un examen est une variable aléatoire à valeurs dans $[0\,;20]$, d'espérance $11$. Un candidat affirme : « d'après l'inégalité de Markov, au plus la moitié des candidats ont obtenu au moins $12$ ». Que penser de cette affirmation ?
  corrige: |
    **1.** L'inégalité de Markov donne : 
    $$P(X \geqslant 4) \leqslant \frac{5}{4} = 1{,}25$$

    $$\boxed{\text{Le majorant dépasse } 1 \text{ : l'information est vraie, mais inutile.}}$$
     En effet, toute probabilité est déjà inférieure ou égale à $1$.

    **2.** Soit $a$ un réel tel que $0 < a \leqslant \mu$. En divisant les deux membres de $a \leqslant \mu$ par $a$, qui est strictement positif, on obtient : 
    $$1 \leqslant \frac{\mu}{a}$$
     Le majorant fourni par l'inégalité de Markov est donc supérieur ou égal à $1$. 
    $$\boxed{\text{Si } a \leqslant \mu, \text{ l'inégalité de Markov n'apporte jamais d'information.}}$$
     Autrement dit, cette inégalité n'est utile que pour des seuils *strictement supérieurs* à l'espérance.

    **3.** La variable $X$ est positive (elle prend ses valeurs dans $[0\,;20]$) et $E(X) = 11$, donc : 
    $$P(X \geqslant 12) \leqslant \frac{11}{12} \approx 0{,}917$$

    $$\boxed{\text{L'affirmation est fausse : Markov ne garantit que } 91{,}7\,\%, \text{ pas } 50\,\%.}$$
     Le candidat a sans doute confondu « espérance » et « médiane ». Rien, dans les données, ne permet d'affirmer qu'au plus la moitié des candidats ont obtenu au moins $12$.
- id: "t-10-13"
  feuille: "f-t-10"
  numero: 13
  partie: "Inégalité de Markov"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [espérance]
  noeuds: [p-esperance]
  notions: [esperance]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    La température $X$, en degrés Celsius, relevée un jour donné dans une ville, est une variable aléatoire d'espérance $6$. On sait de plus que cette température est toujours supérieure à $-20\,^{\circ}$C.

    **1.** Un élève écrit directement $P(X \geqslant 12) \leqslant \dfrac{6}{12} = 0{,}5$. Expliquer pourquoi ce raisonnement n'est pas valable.

    **2.** On pose $Y = X + 20$. Justifier que $Y$ est une variable aléatoire positive et calculer $E(Y)$.

    **3.** Montrer que les événements $(X \geqslant 12)$ et $(Y \geqslant 32)$ sont identiques, puis majorer $P(X \geqslant 12)$.

    **4.** Comparer cette majoration à celle qu'avait écrite l'élève.
  corrige: |
    **1.** L'inégalité de Markov exige que la variable ne prenne que des valeurs *positives*. Or une température peut être négative, et l'énoncé indique seulement $X > -20$. 
    $$\boxed{\text{L'hypothèse de positivité n'est pas vérifiée : l'inégalité ne s'applique pas à } X.}$$

    **2.** Comme $X > -20$, on a $X + 20 > 0$, donc $Y = X + 20$ est bien une variable aléatoire positive. Par linéarité de l'espérance : 
    $$E(Y) = E(X) + 20 = 6 + 20 = \boxed{26}$$

    **3.** Pour tout réel $x$ : 
    $$x \geqslant 12 \quad\Longleftrightarrow\quad x + 20 \geqslant 32$$
     Les événements $(X \geqslant 12)$ et $(Y \geqslant 32)$ sont donc réalisés exactement dans les mêmes cas : ils sont identiques, et ont la même probabilité. L'inégalité de Markov s'applique à $Y$ : 
    $$P(X \geqslant 12) = P(Y \geqslant 32) \leqslant \frac{E(Y)}{32} = \frac{26}{32} = \boxed{0{,}8125}$$

    **4.** L'élève annonçait $0{,}5$, alors que la seule majoration légitime est $0{,}8125$. 
    $$\boxed{\text{La majoration de l'élève est bien plus forte que ce que l'on peut garantir : elle est infondée.}}$$
     On retient la méthode : lorsqu'une variable est minorée par un réel $m$, on applique l'inégalité de Markov à $X - m$, qui est positive.
- id: "t-10-14"
  feuille: "f-t-10"
  numero: 14
  partie: "Inégalité de Bienaymé-Tchebychev"
  etoiles: 1
  types: [Calcul]
  mots_cles: [espérance, variance, inégalité de Bienaymé-Tchebychev]
  noeuds: [p-esperance]
  notions: [esperance]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Soit $X$ une variable aléatoire d'espérance $\mu = 50$ et de variance $\sigma^{2} = 16$. Majorer, à l'aide de l'inégalité de Bienaymé-Tchebychev, les probabilités suivantes :

    **1.** $P\big(|X - 50| \geqslant 8\big)$

    **2.** $P\big(|X - 50| \geqslant 10\big)$

    **3.** $P\big(|X - 50| \geqslant 20\big)$

    **4.** $P\big(|X - 50| \geqslant 4\big)$

    Préciser celle de ces quatre majorations qui n'apporte aucune information.
  corrige: |
    Ici $\mu = 50$ et $\sigma^{2} = 16$, donc l'inégalité de Bienaymé-Tchebychev s'écrit $P\big(|X - 50| \geqslant \delta\big) \leqslant \dfrac{16}{\delta^{2}}$.

    $$\textbf{1.}\quad P\big(|X-50| \geqslant 8\big) \leqslant \frac{16}{8^{2}} = \frac{16}{64} = \boxed{0{,}25} \qquad \textbf{2.}\quad P\big(|X-50| \geqslant 10\big) \leqslant \frac{16}{100} = \boxed{0{,}16}$$

    $$\textbf{3.}\quad P\big(|X-50| \geqslant 20\big) \leqslant \frac{16}{400} = \boxed{0{,}04} \qquad \textbf{4.}\quad P\big(|X-50| \geqslant 4\big) \leqslant \frac{16}{16} = \boxed{1}$$

    $$\boxed{\text{La quatrième majoration n'apporte aucune information, puisque toute probabilité est} \leqslant 1.}$$
     C'est le cas $\delta \leqslant \sigma$, analogue pour Bienaymé-Tchebychev du cas $a \leqslant \mu$ rencontré à l'exercice 12 pour Markov.
- id: "t-10-15"
  feuille: "f-t-10"
  numero: 15
  partie: "Inégalité de Bienaymé-Tchebychev"
  etoiles: 1
  types: [Calcul]
  mots_cles: [espérance, variance, inégalité de Bienaymé-Tchebychev]
  noeuds: [p-esperance]
  notions: [esperance]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Soit $X$ une variable aléatoire d'espérance $20$ et d'écart-type $1{,}5$.

    ![Figure](documents/figures/2e0a00e562d6f5c8.svg)

    **1.** Majorer $P\big(|X - 20| \geqslant 3\big)$.

    **2.** En déduire une minoration de la probabilité que $X$ appartienne à l'intervalle $]17\,;23[$.

    **3.** Reprendre les deux questions précédentes avec l'intervalle $]15\,;25[$.
  corrige: |
    L'écart-type vaut $1{,}5$, donc $\sigma^{2} = 1{,}5^{2} = 2{,}25$.

    **1.** On applique l'inégalité avec $\delta = 3$ : 
    $$P\big(|X - 20| \geqslant 3\big) \leqslant \frac{2{,}25}{3^{2}} = \frac{2{,}25}{9} = \boxed{0{,}25}$$

    **2.** Les événements $\big(|X - 20| \geqslant 3\big)$ et $\big(|X - 20| < 3\big)$ sont contraires l'un de l'autre, et : 
    $$|X - 20| < 3 \quad\Longleftrightarrow\quad -3 < X - 20 < 3 \quad\Longleftrightarrow\quad 17 < X < 23$$
     Donc : 
    $$P(17 < X < 23) = 1 - P\big(|X-20| \geqslant 3\big) \geqslant 1 - 0{,}25 = \boxed{0{,}75}$$

    *Piège :* en passant à l'événement contraire, l'inégalité change de sens. On *minore* désormais, alors qu'on *majorait* à la question 1.

    **3.** On procède de la même manière avec $\delta = 5$ : 
    $$P\big(|X - 20| \geqslant 5\big) \leqslant \frac{2{,}25}{25} = \boxed{0{,}09} \qquad\text{puis}\qquad P(15 < X < 25) \geqslant 1 - 0{,}09 = \boxed{0{,}91}$$
- id: "t-10-16"
  feuille: "f-t-10"
  numero: 16
  partie: "Inégalité de Bienaymé-Tchebychev"
  etoiles: 2
  types: [Calcul]
  mots_cles: [espérance, variance, inégalité de Bienaymé-Tchebychev]
  noeuds: [p-esperance]
  notions: [esperance]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Soit $X$ une variable aléatoire d'espérance $60$ et de variance $9$.

    **1.** Déterminer le plus petit réel $\delta > 0$ pour lequel l'inégalité de Bienaymé-Tchebychev garantit $P\big(|X - 60| \geqslant \delta\big) \leqslant 0{,}04$.

    **2.** Même question avec la majoration $0{,}01$, puis donner l'intervalle correspondant.

    **3.** Que devient ce seuil $\delta$ si l'on divise par $4$ la variance de $X$, l'exigence $0{,}01$ étant maintenue ?
  corrige: |
    **1.** L'inégalité donne $P\big(|X - 60| \geqslant \delta\big) \leqslant \dfrac{9}{\delta^{2}}$. On cherche $\delta > 0$ tel que : 
    $$\frac{9}{\delta^{2}} \leqslant 0{,}04 \quad\Longleftrightarrow\quad \delta^{2} \geqslant \frac{9}{0{,}04} = 225 \quad\Longleftrightarrow\quad \delta \geqslant 15$$

    $$\boxed{\text{Le plus petit seuil convenable est } \delta = 15.}$$

    **2.** On procède de la même manière : 
    $$\frac{9}{\delta^{2}} \leqslant 0{,}01 \quad\Longleftrightarrow\quad \delta^{2} \geqslant 900 \quad\Longleftrightarrow\quad \delta \geqslant 30$$

    $$\boxed{\delta = 30, \text{ ce qui correspond à l'intervalle } ]30\,;90[.}$$

    **3.** Si la variance est divisée par $4$, elle vaut $\dfrac{9}{4} = 2{,}25$ et l'exigence devient : 
    $$\frac{2{,}25}{\delta^{2}} \leqslant 0{,}01 \quad\Longleftrightarrow\quad \delta^{2} \geqslant 225 \quad\Longleftrightarrow\quad \delta \geqslant 15$$

    $$\boxed{\text{Le seuil passe de } 30 \text{ à } 15 \text{ : il est divisé par } 2.}$$
     Diviser la variance par $4$ divise l'écart-type par $2$, et le seuil suit l'écart-type : c'est ce que confirme l'exercice 17.
- id: "t-10-17"
  feuille: "f-t-10"
  numero: 17
  partie: "Inégalité de Bienaymé-Tchebychev"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [espérance, variance, inégalité de Bienaymé-Tchebychev]
  noeuds: [p-esperance]
  notions: [esperance]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Soit $X$ une variable aléatoire d'espérance $\mu$ et d'écart-type $\sigma > 0$, et soit $k$ un entier naturel non nul.

    **1.** Démontrer que $P\big(|X - \mu| \geqslant k\sigma\big) \leqslant \dfrac{1}{k^{2}}$.

    **2.** Recopier et compléter le tableau suivant, en donnant les valeurs approchées à $10^{-3}$ près.

    ```tableau
    $k$ ¦ $2$ ¦ $3$ ¦ $4$ ¦ $5$
    majorant de $P\big(|X - \mu| \geqslant k\sigma\big)$ ¦  ¦  ¦  ¦ 
    minorant de $P\big(|X - \mu| < k\sigma\big)$ ¦  ¦  ¦  ¦ 
    ```

    **3.** Compléter la phrase : « quelle que soit la loi de $X$, au moins $\dots$ des valeurs se situent à moins de deux écarts-types de l'espérance ».

    **4.** Que vaut le majorant pour $k = 1$ ? Commenter.
  corrige: |
    **1.** On applique l'inégalité de Bienaymé-Tchebychev avec $\delta = k\sigma$, qui est bien un réel strictement positif puisque $k \geqslant 1$ et $\sigma > 0$ : 
    $$P\big(|X - \mu| \geqslant k\sigma\big) \; \leqslant \; \frac{\sigma^{2}}{(k\sigma)^{2}} = \frac{\sigma^{2}}{k^{2}\sigma^{2}} = \boxed{\dfrac{1}{k^{2}}}$$
     On remarque que le résultat ne dépend ni de $\sigma$, ni de la loi de $X$.

    **2.** Le minorant de $P\big(|X-\mu| < k\sigma\big)$ s'obtient en passant à l'événement contraire, donc vaut $1 - \dfrac{1}{k^{2}}$ :

    ```tableau
    $k$ ¦ $2$ ¦ $3$ ¦ $4$ ¦ $5$
    majorant de $P\big(|X - \mu| \geqslant k\sigma\big)$ ¦ $0{,}25$ ¦ $\approx 0{,}111$ ¦ $0{,}0625$ ¦ $0{,}04$
    minorant de $P\big(|X - \mu| < k\sigma\big)$ ¦ $0{,}75$ ¦ $\approx 0{,}889$ ¦ $0{,}9375$ ¦ $0{,}96$
    ```

    **3.** La colonne $k = 2$ donne directement la réponse : 
    $$\boxed{\text{Au moins } 75\,\% \text{ des valeurs se situent à moins de deux écarts-types de l'espérance.}}$$

    **4.** Pour $k = 1$, le majorant vaut $\dfrac{1}{1^{2}} = 1$. 
    $$\boxed{\text{Le majorant vaut } 1 \text{ : aucune information, comme à la question 4 de l'exercice 14.}}$$
- id: "t-10-18"
  feuille: "f-t-10"
  numero: 18
  partie: "Inégalité de Bienaymé-Tchebychev"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [espérance, variance, inégalité de Bienaymé-Tchebychev, dés et pièces]
  noeuds: [p-esperance]
  notions: [esperance]
  page_enonce: 5
  page_corrige: 8
  enonce: |
    On lance $10$ fois une pièce équilibrée et on note $X$ le nombre de « pile » obtenus.

    **1.** Donner la loi de $X$, puis son espérance et sa variance.

    **2.** Majorer $P\big(|X - 5| \geqslant 3\big)$ par l'inégalité de Bienaymé-Tchebychev.

    **3.** Montrer que l'événement $\big(|X - 5| \geqslant 3\big)$ est la réunion des événements $(X \leqslant 2)$ et $(X \geqslant 8)$, puis calculer sa probabilité exacte.

    **4.** Comparer les deux résultats et commenter.
  corrige: |
    **1.** On répète $10$ fois, de façon indépendante, une épreuve de Bernoulli dont le succès « obtenir pile » a pour probabilité $0{,}5$ : 
    $$\boxed{X \text{ suit la loi binomiale } \mathcal{B}(10\,;0{,}5).}$$

    $$E(X) = 10 \times 0{,}5 = \boxed{5} \qquad;\qquad V(X) = 10 \times 0{,}5 \times 0{,}5 = \boxed{2{,}5}$$

    **2.** On applique l'inégalité avec $\delta = 3$ : 
    $$P\big(|X - 5| \geqslant 3\big) \; \leqslant \; \frac{2{,}5}{3^{2}} = \frac{2{,}5}{9} = \frac{5}{18} \approx \boxed{0{,}278}$$

    **3.** Comme $X$ prend des valeurs entières : 
    $$|X - 5| \geqslant 3 \quad\Longleftrightarrow\quad X - 5 \leqslant -3 \;\text{ ou }\; X - 5 \geqslant 3 \quad\Longleftrightarrow\quad X \leqslant 2 \;\text{ ou }\; X \geqslant 8$$
     Ces deux événements sont incompatibles, donc leurs probabilités s'ajoutent. Par symétrie de la loi $\mathcal{B}(10\,;0{,}5)$, ils ont de plus la même probabilité : 
    $$P(X \leqslant 2) = \frac{\binom{10}{0} + \binom{10}{1} + \binom{10}{2}}{2^{10}} = \frac{1 + 10 + 45}{1\,024} = \frac{56}{1\,024} = \frac{7}{128}$$

    $$P\big(|X - 5| \geqslant 3\big) = 2 \times \frac{7}{128} = \frac{7}{64} = \boxed{0{,}109\,375}$$

    **4.** La valeur exacte vaut environ $0{,}109$, le majorant environ $0{,}278$ : le majorant est plus de deux fois trop grand. 
    $$\boxed{\text{La majoration est correcte mais grossière : elle n'utilise que } \mu \text{ et } \sigma^{2}, \text{ pas la loi de } X.}$$
- id: "t-10-19"
  feuille: "f-t-10"
  numero: 19
  partie: "Inégalité de Bienaymé-Tchebychev"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [espérance, variance, inégalité de Bienaymé-Tchebychev]
  noeuds: [p-esperance]
  notions: [esperance]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    La variable aléatoire $X$ prend les valeurs $-1$, $0$ et $1$ avec les probabilités respectives $0{,}1$, $0{,}8$ et $0{,}1$.

    **1.** Calculer $E(X)$ et $V(X)$.

    **2.** Calculer la valeur exacte de $P\big(|X| \geqslant 1\big)$.

    **3.** Majorer cette probabilité par l'inégalité de Bienaymé-Tchebychev appliquée avec $\delta = 1$. Que constate-t-on ?

    **4.** Cet exemple permet-il d'améliorer l'inégalité du cours en remplaçant $\dfrac{\sigma^{2}}{\delta^{2}}$ par une quantité plus petite ? Justifier.
  corrige: |
    **1.** On applique les définitions : 
    $$E(X) = (-1) \times 0{,}1 + 0 \times 0{,}8 + 1 \times 0{,}1 = \boxed{0}$$

    $$E(X^{2}) = 1 \times 0{,}1 + 0 \times 0{,}8 + 1 \times 0{,}1 = 0{,}2 \qquad\text{donc}\qquad V(X) = 0{,}2 - 0^{2} = \boxed{0{,}2}$$

    **2.** L'événement $\big(|X| \geqslant 1\big)$ est réalisé pour $X = -1$ et pour $X = 1$ : 
    $$P\big(|X| \geqslant 1\big) = 0{,}1 + 0{,}1 = \boxed{0{,}2}$$

    **3.** Comme $\mu = 0$, l'inégalité avec $\delta = 1$ s'écrit : 
    $$P\big(|X - 0| \geqslant 1\big) \; \leqslant \; \frac{0{,}2}{1^{2}} = \boxed{0{,}2}$$

    $$\boxed{\text{Le majorant est exactement égal à la valeur exacte : l'inégalité est une égalité.}}$$

    **4.** Supposons qu'il existe une quantité $c < \dfrac{\sigma^{2}}{\delta^{2}}$ majorant toujours $P\big(|X-\mu| \geqslant \delta\big)$. Appliquée à la variable de cet exercice avec $\delta = 1$, elle donnerait $0{,}2 \leqslant c < 0{,}2$, ce qui est impossible. 
    $$\boxed{\text{Non : le majorant } \dfrac{\sigma^{2}}{\delta^{2}} \text{ ne peut pas être amélioré dans le cas général.}}$$
     Cela n'empêche pas la majoration d'être très grossière pour une loi *particulière*, comme on l'a vu à l'exercice 18 avec la loi binomiale.
- id: "t-10-20"
  feuille: "f-t-10"
  numero: 20
  partie: "Inégalité de Bienaymé-Tchebychev"
  etoiles: 2
  types: [Calcul]
  mots_cles: [espérance, variance, inégalité de Bienaymé-Tchebychev, modélisation]
  noeuds: [p-esperance]
  notions: [esperance]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Une machine remplit des sachets dont la masse $X$, en grammes, a pour espérance $500$ et pour variance $4$. Un sachet est déclaré conforme lorsque sa masse appartient à l'intervalle $]494\,;506[$.

    **1.** Minorer la probabilité qu'un sachet prélevé au hasard soit conforme.

    **2.** Le fabricant souhaite un intervalle $]500 - \delta\,;500 + \delta[$ contenant la masse d'un sachet avec une probabilité d'au moins $0{,}99$. Déterminer la plus petite valeur de $\delta$ que l'inégalité de Bienaymé-Tchebychev permet de garantir.

    **3.** Commenter la largeur de l'intervalle obtenu.
  corrige: |
    **1.** Un sachet est conforme lorsque $|X - 500| < 6$. On majore d'abord l'événement contraire : 
    $$P\big(|X - 500| \geqslant 6\big) \; \leqslant \; \frac{4}{6^{2}} = \frac{4}{36} = \frac{1}{9}$$

    $$P(494 < X < 506) = 1 - P\big(|X-500| \geqslant 6\big) \geqslant 1 - \frac{1}{9} = \boxed{\dfrac{8}{9} \approx 0{,}889}$$

    $$\boxed{\text{Au moins } 88{,}9\,\% \text{ des sachets sont conformes.}}$$

    **2.** On veut $P\big(|X - 500| \geqslant \delta\big) \leqslant 0{,}01$ : 
    $$\frac{4}{\delta^{2}} \leqslant 0{,}01 \quad\Longleftrightarrow\quad \delta^{2} \geqslant 400 \quad\Longleftrightarrow\quad \delta \geqslant 20$$

    $$\boxed{\delta = 20, \text{ soit l'intervalle } ]480\,;520[.}$$

    **3.** L'intervalle obtenu a une demi-largeur de $20$ grammes, soit dix écarts-types, alors que l'écart-type de $X$ ne vaut que $\sqrt{4} = 2$ grammes. 
    $$\boxed{\text{L'intervalle est très large : c'est le prix d'une garantie valable pour \emph{toute} loi.}}$$
     Si l'on connaissait la loi de $X$, on pourrait obtenir un intervalle bien plus resserré pour la même exigence.
