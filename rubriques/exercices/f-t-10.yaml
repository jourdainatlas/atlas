  enonce: |
    *Marches aléatoires.* Soient $p\in\left]0\,;1\right[$, $q=1-p$, et $X_{1}$, $X_{2}$, …, des variables aléatoires indépendantes telles que, pour tout $k$, $P(X_{k}=1)=p$ et $P(X_{k}=-1)=q$. Pour $n\in\mathbb{N}^{*}$, on pose $S_{n}=X_{1}+\dots+X_{n}$ : c'est la position, après $n$ pas, d'une particule qui part de $0$ et fait à chaque instant un pas en avant ou en arrière.

    **1.** Montrer que $S_{n}$ est à valeurs dans l'ensemble des entiers relatifs de valeur absolue inférieure ou égale à $n$ et de même parité que $n$.

    **2.** On suppose $n$ pair : $n=2\ell$, avec $\ell\in\mathbb{N}^{*}$. Montrer que la loi de $S_{2\ell}$ est donnée par 
    $$P(S_{2\ell}=2j)=\binom{2\ell}{\ell+j}p^{\ell+j}q^{\ell-j}\qquad\text{pour } j\in\{-\ell\,;\dots\,;\ell\}$$

    **3.** Pour quelle valeur de $p$ la probabilité $P(S_{2\ell}=0)$ est-elle maximale ?

    **4.** Montrer que $P(S_{2\ell}=0)\leqslant(4pq)^{\ell}$.

    **5.** On suppose $p\neq\dfrac{1}{2}$. Montrer que $4pq<1$, puis que $P(S_{2\ell}=0)$ tend vers $0$ lorsque $\ell$ tend vers $+\infty$.

    **6.** On suppose $p=\dfrac{1}{2}$. En utilisant l'exercice 42 du chapitre 9, montrer que $P(S_{2\ell}=0)$ tend encore vers $0$.
  corrige: |
    **1.** Notons $U$ le nombre de pas en avant parmi les $n$ premiers. Alors $S_{n}=U-(n-U)=2U-n$, avec $0\leqslant U\leqslant n$. Donc $-n\leqslant S_{n}\leqslant n$, et $S_{n}-n=2(U-n)$ est pair : $\boxed{S_{n}\text{ a la parité de } n \text{ et } |S_{n}|\leqslant n.}$

    **2.** Le nombre $U$ de pas en avant compte les succès de $2\ell$ épreuves de Bernoulli indépendantes de paramètre $p$ : il suit la loi binomiale $\mathcal{B}(2\ell\,;p)$. Or $S_{2\ell}=2j\iff 2U-2\ell=2j\iff U=\ell+j$, d'où : 
    $$\boxed{P(S_{2\ell}=2j)=\binom{2\ell}{\ell+j}p^{\ell+j}q^{\ell-j}}$$

    **3.** Pour $j=0$, $P(S_{2\ell}=0)=\binom{2\ell}{\ell}(pq)^{\ell}$, qui est maximal lorsque $pq=p(1-p)$ l'est. Ce trinôme atteint son maximum $\frac{1}{4}$ en $\boxed{p=\frac{1}{2}}$.

    **4.** D'après l'exercice 34 du chapitre 7, $\binom{2\ell}{\ell}\leqslant 2^{2\ell}=4^{\ell}$. Donc : 
    $$\boxed{P(S_{2\ell}=0)\leqslant 4^{\ell}(pq)^{\ell}=(4pq)^{\ell}}$$

    **5.** On a $1-4pq=(p+q)^{2}-4pq=(p-q)^{2}>0$ si $p\neq q$, c'est-à-dire si $p\neq\frac{1}{2}$. Donc $0<4pq<1$, et $(4pq)^{\ell}\to 0$ comme suite géométrique. Le théorème des gendarmes donne $\boxed{P(S_{2\ell}=0)\to 0}$.

    **6.** Pour $p=\frac{1}{2}$, la majoration précédente ne donne plus que $1$. Mais $P(S_{2\ell}=0)=\binom{2\ell}{\ell}\frac{1}{4^{\ell}}=\frac{1\times 3\times\cdots\times(2\ell-1)} {2\times 4\times\cdots\times(2\ell)}$ (exercice 42 du chapitre 9, question 3). Notons $A_{\ell}=\frac{2\times 4\times\cdots\times(2\ell)}{3\times 5\times\cdots\times(2\ell-1)}$, de sorte que $P(S_{2\ell}=0)=\frac{1}{A_{\ell}}$. La question 7 de cet exercice donne $\frac{A_{\ell}^{2}}{2\ell+1}\to\frac{\pi}{2}$, donc $A_{\ell}^{2}\to+\infty$, puis $A_{\ell}\to+\infty$ et $\boxed{P(S_{2\ell}=0)\to 0}$. Plus précisément, $P(S_{2\ell}=0)$ est proche de $\frac{1}{\sqrt{\pi\ell}}$ : pour $\ell=50$, on trouve $0{,}0796$ contre $\frac{1}{\sqrt{50\pi}}\approx 0{,}0798$.

    ![Figure](documents/figures/57bbed303e0935c7.svg)

    Cette figure montre trois marches de $60$ pas, obtenues par simulation : deux avec $p=\frac{1}{2}$ (en bleu ardoise et en ocre), qui oscillent autour de $0$ et y reviennent, et une avec $p=0{,}6$ (en violet), qui dérive vers le haut, autour de la droite d'équation $y=0{,}2\,n$ représentant $E(S_{n})=n(p-q)$.

    *Interprétation :* lorsque $p\neq\frac{1}{2}$, la marche dérive et la probabilité d'être en $0$ décroît géométriquement. Lorsque $p=\frac{1}{2}$, elle décroît beaucoup plus lentement, comme $\frac{1}{\sqrt{\ell}}$ : la marche reste près de $0$ à l'échelle $\sqrt{n}$, comme l'annonçait l'exercice 37, sans être exactement en $0$ à un instant donné.

