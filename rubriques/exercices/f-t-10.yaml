  notions: [independance, esperance]
  page_enonce: 6
  page_corrige: 10
  enonce: |
    Soit $X$ une variable aléatoire d'espérance $\mu$ et de variance $9$, et $M_{n}$ la moyenne d'un échantillon de taille $n$ de sa loi. On souhaite que $M_{n}$ s'écarte de $\mu$ de moins de $0{,}3$ avec une probabilité d'au moins $0{,}95$.

    **1.** Traduire cette exigence par une inégalité portant sur $n$.

    **2.** Déterminer la plus petite taille d'échantillon convenable.

    **3.** Vérifier le résultat en calculant le majorant obtenu pour cette valeur de $n$.
  corrige: |
    **1.** « S'écarter de moins de $0{,}3$ avec une probabilité d'au moins $0{,}95$ » revient à demander que l'événement contraire ait une probabilité d'au plus $\alpha = 0{,}05$. Il suffit donc que le majorant de l'inégalité de concentration soit inférieur ou égal à $0{,}05$ : 
    $$\boxed{\dfrac{9}{n \times 0{,}3^{2}} \; \leqslant \; 0{,}05}$$

    **2.** On isole $n$ : 
    $$\frac{9}{0{,}09\,n} \leqslant 0{,}05 \quad\Longleftrightarrow\quad n \geqslant \frac{9}{0{,}05 \times 0{,}09} = \frac{9}{0{,}0045} = 2\,000$$

    $$\boxed{\text{La plus petite taille convenable est } n = 2\,000.}$$

    **3.** Vérification : 
    $$\frac{9}{2\,000 \times 0{,}09} = \frac{9}{180} = \boxed{0{,}05}$$
     L'exigence est donc satisfaite, et de justesse : c'est bien le plus petit entier convenable.
- id: "t-10-23"
  feuille: "f-t-10"
  numero: 23
  partie: "Inégalité de concentration"
  etoiles: 2
  types: [Calcul]
  mots_cles: [moyenne empirique, variance, "taille d'échantillon", dés et pièces]
  noeuds: [p-esperance]
  notions: []
  page_enonce: 6
  page_corrige: 10
  enonce: |
    On lance $n$ fois un dé équilibré à six faces et on note $M_{n}$ la moyenne des numéros obtenus. On rappelle que $\mu = 3{,}5$ et $\sigma^{2} = \dfrac{35}{12}$.

    **1.** Déterminer le nombre minimal de lancers pour que $M_{n}$ s'écarte de $3{,}5$ de moins de $0{,}05$, avec une probabilité d'au moins $0{,}98$.

    **2.** Le cours établit qu'il suffit de $5834$ lancers pour un écart inférieur à $0{,}1$ avec une probabilité d'au moins $0{,}95$. Expliquer, sans nouveau calcul, pourquoi le nombre trouvé à la question précédente est bien plus grand.
  corrige: |
    **1.** On a $\sigma^{2} = \dfrac{35}{12}$, $\delta = 0{,}05$ et $\alpha = 1 - 0{,}98 = 0{,}02$. On applique la méthode du cours : 
    $$\frac{35/12}{n \times 0{,}05^{2}} \leqslant 0{,}02 \quad\Longleftrightarrow\quad n \geqslant \frac{35/12}{0{,}02 \times 0{,}0025} = \frac{35/12}{0{,}00005} = \frac{175\,000}{3} \approx 58\,333{,}3$$

    $$\boxed{\text{Il faut au moins } 58\,334 \text{ lancers.}}$$

    *Piège :* il faut prendre l'entier immédiatement *supérieur*. Avec $58\,333$ lancers, le majorant dépasserait encore $0{,}02$.

    **2.** Deux exigences ont été renforcées par rapport au cours :

    • le seuil $\delta$ est passé de $0{,}1$ à $0{,}05$, donc a été divisé par $2$ ; comme $\delta$ intervient au carré au dénominateur, cela multiplie $n$ par $4$ ;

    • le risque $\alpha$ est passé de $0{,}05$ à $0{,}02$, donc a été divisé par $2{,}5$, ce qui multiplie $n$ par $2{,}5$.

    $$\boxed{\text{Au total } n \text{ est multiplié par } 4 \times 2{,}5 = 10 \text{ : on retrouve bien } 5\,834 \times 10 \approx 58\,334.}$$
- id: "t-10-24"
  feuille: "f-t-10"
  numero: 24
  partie: "Inégalité de concentration"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [échantillon, moyenne empirique, espérance, variance, inégalité de concentration, "taille d'échantillon"]
  noeuds: [p-independance, p-esperance, p-loi-faible]
  notions: [independance, esperance]
  page_enonce: 6
  page_corrige: 11
  enonce: |
    Soit $X$ une variable aléatoire d'espérance $\mu$ et de variance $1$. On veut garantir $P\big(|M_{n} - \mu| \geqslant \delta\big) \leqslant 0{,}05$.

    **1.** Exprimer la plus petite taille d'échantillon convenable en fonction de $\delta$.

    **2.** Calculer cette taille pour $\delta = 1$, puis $\delta = 0{,}1$, puis $\delta = 0{,}01$.

    **3.** Par quel nombre la taille de l'échantillon est-elle multipliée lorsqu'on divise $\delta$ par $10$ ? Démontrer ce résultat dans le cas général.
  corrige: |
    **1.** L'exigence s'écrit : 
    $$\frac{1}{n\delta^{2}} \leqslant 0{,}05 \quad\Longleftrightarrow\quad n \geqslant \frac{1}{0{,}05 \times \delta^{2}} \qquad\text{donc}\qquad \boxed{n = \dfrac{20}{\delta^{2}}}$$
     (le plus petit entier supérieur ou égal à cette quantité).

    **2.** On applique la formule précédente : 
    $$\delta = 1 \;:\; n = \frac{20}{1} = \boxed{20} \qquad \delta = 0{,}1 \;:\; n = \frac{20}{0{,}01} = \boxed{2\,000} \qquad \delta = 0{,}01 \;:\; n = \frac{20}{0{,}0001} = \boxed{200\,000}$$

    **3.** On constate que la taille est multipliée par $100$ à chaque fois. Démontrons-le : en remplaçant $\delta$ par $\dfrac{\delta}{10}$, la taille devient 
    $$\frac{20}{\left(\dfrac{\delta}{10}\right)^{2}} = \frac{20}{\dfrac{\delta^{2}}{100}} = 100 \times \frac{20}{\delta^{2}}$$

    $$\boxed{\text{Diviser } \delta \text{ par } 10 \text{ multiplie la taille de l'échantillon par } 100. }$$
     C'est le prix de la précision, déjà signalé dans le cours. On en verra une conséquence spectaculaire à l'exercice 34.
- id: "t-10-25"
  feuille: "f-t-10"
  numero: 25
  titre: "Type Bac"
  partie: "Inégalité de concentration"
  etoiles: 2
  types: [Type Bac, Démonstration, Calcul]
  mots_cles: [échantillon, moyenne empirique, espérance, variance, inégalité de concentration, loi de Bernoulli, "taille d'échantillon", sondage]
  noeuds: [p-independance, p-esperance, p-loi-faible, p-variables]
  notions: [independance, esperance, variable-aleatoire]
  page_enonce: 6
  page_corrige: 11
  enonce: |
    Dans une population, une proportion inconnue $p$ d'individus possède un certain caractère. On interroge $n$ personnes au hasard et, pour la $i$-ième d'entre elles, on pose $X_{i} = 1$ si elle possède ce caractère et $X_{i} = 0$ sinon. On admet que $(X_{1}\,;\dots\,;X_{n})$ est un échantillon de taille $n$ de la loi de Bernoulli de paramètre $p$, et on note $M_{n}$ la fréquence observée du caractère.

    **1.** Donner l'espérance et la variance de $X_{1}$.

    **2.** Démontrer que, pour tout réel $p$ de $[0\,;1]$, on a $p(1-p) \leqslant \dfrac{1}{4}$.

    **3.** En déduire que, pour tout réel $\delta > 0$ : 
    $$P\big(|M_{n} - p| \geqslant \delta\big) \; \leqslant \; \frac{1}{4n\delta^{2}}$$

    **4.** Déterminer le nombre minimal de personnes à interroger pour que la fréquence observée s'écarte de $p$ de moins de $3$ points de pourcentage, avec une probabilité d'au moins $0{,}95$.

    **5.** Cette réponse dépend-elle de $p$ ? Commenter l'intérêt de la majoration de la question 2.
  corrige: |
    **1.** La variable $X_{1}$ suit la loi de Bernoulli de paramètre $p$ : 
    $$E(X_{1}) = \boxed{p} \qquad\text{et}\qquad V(X_{1}) = \boxed{p(1-p)}$$

    **2.** On étudie le signe de la différence : 
    $$\frac{1}{4} - p(1-p) = \frac{1}{4} - p + p^{2} = \left(p - \frac{1}{2}\right)^{2}$$
     Un carré étant toujours positif, on obtient $\dfrac{1}{4} - p(1-p) \geqslant 0$, c'est-à-dire : 
    $$\boxed{p(1-p) \leqslant \dfrac{1}{4} \quad\text{pour tout } p \in [0\,;1]}$$

    **3.** L'inégalité de concentration appliquée à $M_{n}$, dont l'espérance vaut $p$ et la variance $\dfrac{p(1-p)}{n}$, donne : 
    $$P\big(|M_{n} - p| \geqslant \delta\big) \; \leqslant \; \frac{p(1-p)}{n\delta^{2}}$$
     Or $p(1-p) \leqslant \dfrac{1}{4}$ d'après la question 2, et $n\delta^{2} > 0$ : 
    $$\boxed{P\big(|M_{n} - p| \geqslant \delta\big) \; \leqslant \; \dfrac{1}{4n\delta^{2}}}$$

    **4.** « Moins de $3$ points de pourcentage » signifie $\delta = 0{,}03$, et « avec une probabilité d'au moins $0{,}95$ » signifie $\alpha = 0{,}05$ : 
    $$\frac{1}{4n \times 0{,}03^{2}} \leqslant 0{,}05 \quad\Longleftrightarrow\quad n \geqslant \frac{1}{4 \times 0{,}05 \times 0{,}0009} = \frac{1}{0{,}00018} \approx 5\,555{,}6$$

    $$\boxed{\text{Il faut interroger au moins } 5\,556 \text{ personnes.}}$$

    **5.** Le majorant $\dfrac{1}{4n\delta^{2}}$ ne contient plus $p$. 
    $$\boxed{\text{La réponse ne dépend pas de } p, \text{ qui est pourtant la quantité inconnue que l'on cherche.}}$$
     C'est tout l'intérêt de la majoration de la question 2 : sans elle, il faudrait connaître $p$ pour calculer la taille de l'échantillon permettant d'estimer $p$.
- id: "t-10-26"
  feuille: "f-t-10"
  numero: 26
  titre: "Type Bac"
