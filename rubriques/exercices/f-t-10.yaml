  etoiles: 2
  types: [Type Bac, Calcul]
  mots_cles: [échantillon, moyenne empirique, espérance, variance, "taille d'échantillon", modélisation]
  noeuds: [p-independance, p-esperance]
  notions: [independance, esperance]
  page_enonce: 7
  page_corrige: 12
  enonce: |
    Une usine produit des tiges métalliques dont la longueur $X$, en centimètres, est une variable aléatoire d'espérance $20$ et d'écart-type $0{,}5$. On prélève au hasard $100$ tiges, dont les longueurs forment un échantillon de la loi de $X$, et on note $M_{100}$ la longueur moyenne de ces $100$ tiges.

    **1.** Calculer $E(M_{100})$ et $V(M_{100})$.

    **2.** Majorer $P\big(|M_{100} - 20| \geqslant 0{,}1\big)$.

    **3.** En déduire une minoration de la probabilité que la longueur moyenne de l'échantillon appartienne à l'intervalle $]19{,}9\,;20{,}1[$.

    **4.** Le service qualité veut ramener à $0{,}01$ le risque que la longueur moyenne s'écarte d'au moins $0{,}1$ de $20$. Combien de tiges doit-il prélever ?

    **5.** Un technicien propose plutôt de régler la machine de façon à diviser par $5$ l'écart-type de $X$, en conservant $100$ tiges. Cette solution répond-elle à l'exigence du service qualité ?
  corrige: |
    Ici $\mu = 20$ et $\sigma = 0{,}5$, donc $\sigma^{2} = 0{,}25$.

    **1.** La proposition 1 donne : 
    $$E(M_{100}) = \mu = \boxed{20} \qquad;\qquad V(M_{100}) = \frac{0{,}25}{100} = \boxed{0{,}0025}$$

    **2.** On applique l'inégalité de concentration : 
    $$P\big(|M_{100} - 20| \geqslant 0{,}1\big) \; \leqslant \; \frac{0{,}25}{100 \times 0{,}1^{2}} = \frac{0{,}25}{1} = \boxed{0{,}25}$$

    **3.** En passant à l'événement contraire : 
    $$P(19{,}9 < M_{100} < 20{,}1) = 1 - P\big(|M_{100}-20| \geqslant 0{,}1\big) \geqslant 1 - 0{,}25 = \boxed{0{,}75}$$

    **4.** On cherche $n$ tel que le majorant soit inférieur ou égal à $0{,}01$ : 
    $$\frac{0{,}25}{n \times 0{,}01} \leqslant 0{,}01 \quad\Longleftrightarrow\quad n \geqslant \frac{0{,}25}{0{,}01 \times 0{,}01} = \frac{0{,}25}{0{,}0001} = 2\,500$$

    $$\boxed{\text{Le service qualité doit prélever au moins } 2\,500 \text{ tiges.}}$$

    **5.** Si l'écart-type de $X$ est divisé par $5$, il vaut $0{,}1$ et la variance devient $0{,}01$. Avec $n = 100$ : 
    $$P\big(|M_{100} - 20| \geqslant 0{,}1\big) \; \leqslant \; \frac{0{,}01}{100 \times 0{,}01} = \boxed{0{,}01}$$

    $$\boxed{\text{Oui : cette solution atteint exactement l'exigence, sans prélever davantage de tiges.}}$$
     Les deux leviers sont donc équivalents ici : augmenter $n$ ou réduire $\sigma^{2}$ agissent de la même façon sur le majorant $\dfrac{\sigma^{2}}{n\delta^{2}}$.
- id: "t-10-27"
  feuille: "f-t-10"
  numero: 27
  partie: "Loi faible des grands nombres"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [échantillon, moyenne empirique, espérance, variance, inégalité de concentration, loi faible des grands nombres]
  noeuds: [p-independance, p-esperance, p-loi-faible]
  notions: [independance, esperance]
  page_enonce: 7
  page_corrige: 12
  enonce: |
    Soit $X$ une variable aléatoire d'espérance $\mu$ et de variance $5$, et $M_{n}$ la moyenne d'un échantillon de taille $n$ de sa loi. On fixe $\delta = 0{,}2$.

    **1.** Montrer que, pour tout entier $n \geqslant 1$, on a $P\big(|M_{n} - \mu| \geqslant 0{,}2\big) \leqslant \dfrac{125}{n}$.

    **2.** Calculer ce majorant pour $n = 125$, $n = 1250$ et $n = 12\,500$.

    **3.** Déterminer la limite de la suite de terme général $\dfrac{125}{n}$, puis conclure.
  corrige: |
    **1.** L'inégalité de concentration appliquée avec $\sigma^{2} = 5$ et $\delta = 0{,}2$ donne, pour tout entier $n \geqslant 1$ : 
    $$P\big(|M_{n} - \mu| \geqslant 0{,}2\big) \; \leqslant \; \frac{5}{n \times 0{,}2^{2}} = \frac{5}{0{,}04\,n} = \boxed{\dfrac{125}{n}}$$

    **2.** On remplace $n$ par chacune des trois valeurs : 
    $$n = 125 \;:\; \frac{125}{125} = \boxed{1} \qquad n = 1\,250 \;:\; \frac{125}{1\,250} = \boxed{0{,}1} \qquad n = 12\,500 \;:\; \frac{125}{12\,500} = \boxed{0{,}01}$$
     Pour $n = 125$, le majorant vaut $1$ : il n'apporte encore aucune information.

    **3.** La suite de terme général $\dfrac{125}{n}$ est de la forme $\dfrac{C}{n}$ avec $C = 125$ constante, donc : 
    $$\lim_{n\to+\infty} \frac{125}{n} = \boxed{0}$$
     Comme une probabilité est toujours positive, on dispose de l'encadrement $0 \leqslant P\big(|M_{n} - \mu| \geqslant 0{,}2\big) \leqslant \dfrac{125}{n}$, dont les deux membres extrêmes tendent vers $0$. 
    $$\boxed{\lim_{n\to+\infty} P\big(|M_{n} - \mu| \geqslant 0{,}2\big) = 0}$$
- id: "t-10-28"
  feuille: "f-t-10"
  numero: 28
  partie: "Loi faible des grands nombres"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [échantillon, moyenne empirique, espérance, variance, inégalité de concentration, loi faible des grands nombres]
  noeuds: [p-independance, p-esperance, p-loi-faible]
  notions: [independance, esperance]
  page_enonce: 7
  page_corrige: 13
  enonce: |
    Soit $X$ une variable aléatoire d'espérance $\mu$ et de variance $2$, et $M_{n}$ la moyenne d'un échantillon de taille $n$ de sa loi.

    **1.** Justifier l'encadrement suivant, valable pour tout entier $n \geqslant 1$ : 
    $$0 \; \leqslant \; P\big(|M_{n} - \mu| \geqslant 0{,}01\big) \; \leqslant \; \frac{20\,000}{n}$$

    **2.** En déduire, en rédigeant soigneusement, la limite de $P\big(|M_{n} - \mu| \geqslant 0{,}01\big)$ lorsque $n$ tend vers $+\infty$.

    **3.** Reprendre les deux questions précédentes en remplaçant $0{,}01$ par un réel $\delta > 0$ quelconque.
  corrige: |
    **1.** L'inégalité de gauche vient de ce qu'une probabilité est toujours positive. Celle de droite est l'inégalité de concentration avec $\sigma^{2} = 2$ et $\delta = 0{,}01$ : 
    $$\frac{\sigma^{2}}{n\delta^{2}} = \frac{2}{n \times 0{,}01^{2}} = \frac{2}{0{,}0001\,n} = \frac{20\,000}{n}$$

    $$\boxed{0 \; \leqslant \; P\big(|M_{n} - \mu| \geqslant 0{,}01\big) \; \leqslant \; \dfrac{20\,000}{n} \quad\text{pour tout entier } n \geqslant 1}$$

    **2.** On rédige la conclusion :

    • la suite constante nulle converge vers $0$ ;

    • $\lim_{n\to+\infty} \dfrac{20\,000}{n} = 0$, comme quotient d'une constante par une suite tendant vers $+\infty$.

    D'après le théorème des gendarmes, établi au chapitre 3 : 
    $$\boxed{\lim_{n\to+\infty} P\big(|M_{n} - \mu| \geqslant 0{,}01\big) = 0}$$

    **3.** Pour un réel $\delta > 0$ quelconque, le même raisonnement donne : 
    $$0 \; \leqslant \; P\big(|M_{n} - \mu| \geqslant \delta\big) \; \leqslant \; \frac{2}{n\delta^{2}}$$
     Comme $\delta$ est *fixé*, la quantité $\dfrac{2}{\delta^{2}}$ est une constante, et le majorant tend encore vers $0$. 
    $$\boxed{\lim_{n\to+\infty} P\big(|M_{n} - \mu| \geqslant \delta\big) = 0 \quad\text{pour tout réel } \delta > 0}$$
     C'est exactement l'énoncé de la loi faible des grands nombres. On remarque que $\delta$ doit être choisi *avant* de faire tendre $n$ vers $+\infty$.
- id: "t-10-29"
  feuille: "f-t-10"
  numero: 29
  partie: "Loi faible des grands nombres"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [moyenne empirique, variance, inégalité de concentration, loi faible des grands nombres]
  noeuds: [p-esperance, p-loi-faible]
  notions: []
  page_enonce: 7
  page_corrige: 13
  enonce: |
    Quatre élèves commentent la loi faible des grands nombres. Pour chacun, dire si son affirmation est correcte et justifier.

    • **Alice :** « à partir d'un certain rang, la moyenne $M_{n}$ est égale à $\mu$ ».

    • **Bruno :** « la probabilité que $M_{n}$ s'écarte de $\mu$ d'au moins $0{,}01$ peut être rendue aussi petite que l'on veut, à condition de prendre $n$ assez grand ».

    • **Chloé :** « le théorème ne s'applique plus si l'on choisit $\delta = 0{,}0001$ ».

    • **Dorian :** « puisque le majorant $\dfrac{\sigma^{2}}{n\delta^{2}}$ décroît, la probabilité $P\big(|M_{n} - \mu| \geqslant \delta\big)$ décroît elle aussi ».
  corrige: |
    **Alice.** 
    $$\boxed{\text{Affirmation fausse.}}$$
     Le théorème porte sur une *probabilité*, pas sur la variable $M_{n}$ elle-même. Rien n'interdit à un échantillon, même très grand, de donner une moyenne éloignée de $\mu$ : cet événement devient seulement de moins en moins probable. Sur la simulation du cours, la courbe finit par ne plus quitter la bande, mais aucun théorème ne garantit qu'elle n'en sortira plus jamais.

    **Bruno.** 
    $$\boxed{\text{Affirmation vraie.}}$$
     C'est la traduction correcte de $\lim_{n\to+\infty} P\big(|M_{n} - \mu| \geqslant 0{,}01\big) = 0$ : la probabilité peut être rendue aussi petite que l'on veut pourvu que $n$ soit assez grand. C'est le contenu de la question 2 de l'exercice 28.

    **Chloé.** 
    $$\boxed{\text{Affirmation fausse.}}$$
     Le théorème est valable *pour tout* réel $\delta > 0$, aussi petit soit-il. Simplement, plus $\delta$ est petit, plus il faut prendre $n$ grand pour que le majorant $\dfrac{\sigma^{2}}{n\delta^{2}}$ devienne petit : c'est le prix de la précision chiffré à l'exercice 24.

    **Dorian.** 
    $$\boxed{\text{Affirmation fausse.}}$$
     Le raisonnement confond une quantité et son majorant. Savoir que $u_{n} \leqslant v_{n}$ pour tout $n$, avec $(v_{n})$ décroissante, ne dit rien sur le sens de variation de $(u_{n})$. On sait seulement que $P\big(|M_{n} - \mu| \geqslant \delta\big)$ tend vers $0$, pas qu'elle décroît.
