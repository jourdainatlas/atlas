  enonce: |
    Soient $X$ une variable aléatoire, $n\in\mathbb{N}^{*}$, et $(X_{1}\,;\dots\,;X_{n})$ un échantillon de taille $n$ de la loi de $X$. On note $S_{n}=X_{1}+\dots+X_{n}$.

    **1.** Exprimer $E(S_{n})$ en fonction de $n$ et de $E(X)$.

    **2.** Exprimer $E\big(S_{n}^{2}\big)$ en fonction de $n$, $E(X)$ et $E\big(X^{2}\big)$.

    **3.** On suppose $E(X)=0$. Montrer, en appliquant l'inégalité de Markov à $S_{n}^{2}$, que pour tout réel $a>0$ : 
    $$P\big(|S_{n}|\geqslant a\sqrt{n}\big)\leqslant\frac{E\big(X^{2}\big)}{a^{2}}$$

    **4.** On revient au cas général. En considérant $Y=X-E(X)$, montrer que pour tout réel $a>0$ : 
    $$P\big(|S_{n}-nE(X)|\geqslant a\sqrt{n}\big)\leqslant\frac{V(X)}{a^{2}}$$
  corrige: |
    **1.** Par linéarité de l'espérance : $\boxed{E(S_{n})=n\,E(X)}$.

    **2.** Les $X_{i}$ étant indépendantes et de même loi, $V(S_{n})=n\,V(X)$. La formule $V(S_{n})=E\big(S_{n}^{2}\big)-E(S_{n})^{2}$ donne alors 
    $$E\big(S_{n}^{2}\big)=n\,V(X)+n^{2}E(X)^{2}=n\Big(E\big(X^{2}\big)-E(X)^{2}\Big)+n^{2}E(X)^{2}$$

    $$\boxed{E\big(S_{n}^{2}\big)=n\,E\big(X^{2}\big)+n(n-1)\,E(X)^{2}}$$

    **3.** Si $E(X)=0$, alors $E\big(S_{n}^{2}\big)=n\,E\big(X^{2}\big)$. La variable $S_{n}^{2}$ est positive, et, comme $a\sqrt{n}>0$, les événements $\big(|S_{n}|\geqslant a\sqrt{n}\big)$ et $\big(S_{n}^{2}\geqslant a^{2}n\big)$ sont identiques. L'inégalité de Markov donne : 
    $$P\big(|S_{n}|\geqslant a\sqrt{n}\big)=P\big(S_{n}^{2}\geqslant a^{2}n\big)\leqslant \frac{E\big(S_{n}^{2}\big)}{a^{2}n}=\boxed{\frac{E\big(X^{2}\big)}{a^{2}}}$$

    **4.** La variable $Y=X-E(X)$ est d'espérance nulle et vérifie $E\big(Y^{2}\big)=V(X)$. Les variables $Y_{i}=X_{i}-E(X)$ forment un échantillon de la loi de $Y$, dont la somme vaut $S_{n}-nE(X)$. La question 3, appliquée à $Y$, donne : 
    $$\boxed{P\big(|S_{n}-nE(X)|\geqslant a\sqrt{n}\big)\leqslant\frac{V(X)}{a^{2}}}$$

    *Interprétation :* c'est l'inégalité de Bienaymé-Tchebychev appliquée à $S_{n}$, mais lue autrement. L'écart typique de $S_{n}$ à $nE(X)$ est de l'ordre de $\sqrt{n}$, et non de $n$ : après $10\,000$ lancers d'une pièce, le nombre de « pile » s'écarte de $5\,000$ d'environ $\sqrt{10\,000}=100$, à un facteur près. Divisé par $n$, cet écart devient $\frac{1}{\sqrt{n}}$, qui tend vers $0$ : on retrouve la loi faible des grands nombres.
