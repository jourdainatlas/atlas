  enonce: |
    *Nombre de points fixes d'une permutation.* On se donne $n$ boules numérotées de $1$ à $n$, et $n$ urnes également numérotées de $1$ à $n$. On place une boule dans chaque urne, toutes les répartitions étant équiprobables. Quelle est l'espérance du nombre de boules placées dans l'urne portant leur numéro ? Pour $1\leqslant i\leqslant n$, on introduira la variable aléatoire $X_{i}$ égale à $1$ si la boule $i$ est placée dans l'urne $i$, et à $0$ sinon.
  corrige: |
    L'expérience revient à choisir une permutation de $\{1\,;\dots\,;n\}$ : la boule $i$ va dans l'urne $\sigma(i)$. Il y a $n!$ répartitions équiprobables (chapitre 7).

    Soit $i$ fixé. Les répartitions dans lesquelles la boule $i$ est dans l'urne $i$ correspondent aux façons de placer les $n-1$ autres boules dans les $n-1$ autres urnes : il y en a $(n-1)!$. Donc 
    $$P(X_{i}=1)=\frac{(n-1)!}{n!}=\frac{1}{n} \qquad\text{et}\qquad E(X_{i})=\frac{1}{n}$$
     Le nombre $N$ de boules placées dans l'urne portant leur numéro vaut $X_{1}+\dots+X_{n}$. Par linéarité de l'espérance : 
    $$E(N)=\sum_{i=1}^{n}E(X_{i})=n\times\frac{1}{n}=\boxed{1}$$

    *Interprétation :* quel que soit le nombre de boules, il y a en moyenne exactement une boule bien placée. Pour $n=3$, les six permutations ont respectivement $3$, $1$, $1$, $1$, $0$ et $0$ points fixes, de moyenne $\frac{6}{6}=1$.

    *Piège :* les variables $X_{i}$ ne sont pas indépendantes ; par exemple, si $n-1$ boules sont bien placées, la dernière l'est forcément. La linéarité de l'espérance, elle, ne demande aucune indépendance : c'est ce qui rend le calcul si court, alors que la loi de $N$ est difficile à obtenir.
