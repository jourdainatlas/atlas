  enonce: |
    Soit $X$ une variable aléatoire à valeurs dans $\mathbb{N}$, et $n$ la plus grande valeur que prend $X$.

    **1.** Pour $k\in\mathbb{N}$, justifier la relation $P(X=k)=P(X\geqslant k)-P(X\geqslant k+1)$.

    **2.** Montrer que 
    $$E(X)=\sum_{k=1}^{n}P(X\geqslant k)$$
  corrige: |
    **1.** Comme $X$ est à valeurs entières, l'événement $(X\geqslant k)$ est la réunion des deux événements incompatibles $(X=k)$ et $(X\geqslant k+1)$. Donc $P(X\geqslant k)=P(X=k)+P(X\geqslant k+1)$, c'est-à-dire : 
    $$\boxed{P(X=k)=P(X\geqslant k)-P(X\geqslant k+1)}$$

    **2.** Notons $r_{k}=P(X\geqslant k)$ ; on a $r_{n+1}=0$, puisque $X\leqslant n$. Par définition et d'après la question 1 : 
    $$E(X)=\sum_{k=0}^{n}k\,P(X=k)=\sum_{k=1}^{n}k\,\big(r_{k}-r_{k+1}\big) =\sum_{k=1}^{n}k\,r_{k}-\sum_{k=2}^{n+1}(k-1)\,r_{k}$$
     en posant $k+1\to k$ dans la seconde somme. Le terme $r_{1}$ n'apparaît que dans la première somme, le terme $r_{n+1}$ est nul, et pour $2\leqslant k\leqslant n$, il reste $k\,r_{k}-(k-1)\,r_{k}=r_{k}$ : 
    $$\boxed{E(X)=\sum_{k=1}^{n}P(X\geqslant k)}$$

    *Vérification :* pour un dé équilibré, $P(X\geqslant k)=\frac{7-k}{6}$, et $\sum_{k=1}^{6}\frac{7-k}{6}=\frac{6+5+4+3+2+1}{6}=\frac{21}{6} =3{,}5$, l'espérance déjà calculée à l'exercice 2.

    *Interprétation :* chaque valeur $k$ est comptée $k$ fois dans $E(X)$, une fois pour chacun des événements $(X\geqslant 1)$, …, $(X\geqslant k)$. Cette formule est souvent plus commode que la définition lorsque les probabilités $P(X\geqslant k)$ sont faciles à calculer, par exemple pour le maximum de plusieurs dés.
