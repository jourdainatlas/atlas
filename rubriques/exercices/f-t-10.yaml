  enonce: |
    *Urne d'Ehrenfest.* On fixe un entier $a\geqslant 2$, et l'on se donne $a$ boules numérotées de $1$ à $a$, réparties dans deux boîtes. À chaque seconde à partir de l'instant $0$, on choisit au hasard un entier de $\{1\,;\dots\,;a\}$, tous étant équiprobables, et l'on déplace la boule portant ce numéro d'une boîte dans l'autre. Les tirages effectués à des instants distincts sont supposés indépendants. Pour $n\in\mathbb{N}$, on note $X_{n}$ le nombre de boules dans la première boîte à l'instant $n$, et $Y_{n}=X_{n+1}-X_{n}$.

    **1.** Montrer que, pour tout $n\in\mathbb{N}$ : 
    $$E(Y_{n})=1-\frac{2}{a}\,E(X_{n})\qquad\text{et}\qquad E(X_{n+1})=\left(1-\frac{2}{a}\right)E(X_{n})+1$$

    **2.** En utilisant la méthode d'étude des suites arithmético-géométriques, exprimer $E(X_{n})$ en fonction de $E(X_{0})$, $a$ et $n$. Déterminer la limite de la suite $\big(E(X_{n})\big)$. Comment expliquer ce résultat ?
  corrige: |
    **1.** À l'instant $n$, si la première boîte contient $k$ boules, la boule tirée s'y trouve avec la probabilité $\frac{k}{a}$, et elle en sort : $Y_{n}=-1$ ; sinon, avec la probabilité $\frac{a-k}{a}$, une boule y entre : $Y_{n}=1$. La formule des probabilités totales (chapitre 2), appliquée avec les événements $(X_{n}=k)$, donne : 
    $$P(Y_{n}=-1)=\sum_{k=0}^{a}P(X_{n}=k)\times\frac{k}{a}=\frac{E(X_{n})}{a} \qquad\text{et}\qquad P(Y_{n}=1)=1-\frac{E(X_{n})}{a}$$

    $$\boxed{E(Y_{n})=1\times\left(1-\frac{E(X_{n})}{a}\right)-1\times\frac{E(X_{n})}{a} =1-\frac{2}{a}\,E(X_{n})}$$
     Comme $X_{n+1}=X_{n}+Y_{n}$, la linéarité de l'espérance donne : 
    $$\boxed{E(X_{n+1})=E(X_{n})+1-\frac{2}{a}\,E(X_{n})=\left(1-\frac{2}{a}\right)E(X_{n})+1}$$

    **2.** La suite $u_{n}=E(X_{n})$ est arithmético-géométrique, comme à l'exercice 32 du chapitre 8. Son point fixe vérifie $\ell=\left(1-\frac{2}{a}\right)\ell+1$, soit $\ell=\frac{a}{2}$, et $u_{n}-\frac{a}{2}$ est géométrique de raison $1-\frac{2}{a}$ : 
    $$\boxed{E(X_{n})=\frac{a}{2}+\left(1-\frac{2}{a}\right)^{n}\left(E(X_{0})-\frac{a}{2}\right)}$$
     Comme $a\geqslant 2$, on a $0\leqslant 1-\frac{2}{a}<1$, et : 
    $$\boxed{\lim_{n\to+\infty}E(X_{n})=\frac{a}{2}}$$

    ![Figure](documents/figures/efadb6e8362f8929.svg)

    Pour $a=10$, cette figure montre la suite $E(X_{n})$ partant de $X_{0}=0$ (en bleu ardoise) et de $X_{0}=10$ (en ocre) : dans les deux cas, elle se rapproche géométriquement de $5$.

    *Interprétation :* quelle que soit la répartition initiale, les boules finissent en moyenne par se répartir également entre les deux boîtes. Les époux Ehrenfest ont imaginé ce modèle au début du XXᵉ siècle pour comprendre comment un gaz, enfermé d'abord dans une moitié d'un récipient, finit par l'occuper uniformément, bien que chaque molécule se déplace au hasard.
