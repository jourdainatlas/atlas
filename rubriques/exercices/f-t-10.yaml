  page_enonce: 5
  page_corrige: 10
  enonce: |
    Soit $M_{n}$ la moyenne d'un échantillon de taille $n$ d'une variable aléatoire d'espérance $\mu$ et de variance $\sigma^{2} = 4$. Majorer $P\big(|M_{n} - \mu| \geqslant 0{,}5\big)$ pour :

    **1.** $n = 100$

    **2.** $n = 400$

    **3.** $n = 1600$

    Quelle taille d'échantillon faudrait-il pour que ce majorant soit divisé encore par $4$ ?
  corrige: |
    L'inégalité de concentration s'écrit ici $P\big(|M_{n} - \mu| \geqslant 0{,}5\big) \leqslant \dfrac{4}{n \times 0{,}5^{2}} = \dfrac{4}{0{,}25\,n} = \dfrac{16}{n}$.

    $$\textbf{1.}\quad n = 100 \;:\; \frac{16}{100} = \boxed{0{,}16} \qquad \textbf{2.}\quad n = 400 \;:\; \frac{16}{400} = \boxed{0{,}04} \qquad \textbf{3.}\quad n = 1600 \;:\; \frac{16}{1600} = \boxed{0{,}01}$$

    On constate que multiplier $n$ par $4$ divise le majorant par $4$. Pour le diviser encore par $4$ à partir de $n = 1600$ : 
    $$\boxed{\text{Il faudrait } n = 6\,400.}$$
- id: "t-10-22"
  feuille: "f-t-10"
  numero: 22
  partie: "Inégalité de concentration"
  etoiles: 1
  types: [Calcul]
  mots_cles: [échantillon, moyenne empirique, espérance, variance, "taille d'échantillon"]
