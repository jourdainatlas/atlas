  enonce: |
    Soit $n\geqslant 2$ un entier. Une entreprise suit la stratégie suivante pour recruter ses $n$ employés. L'employé $1$ fonde l'entreprise et recrute l'employé $2$ ; l'un des deux employés $1$ et $2$ recrute l'employé $3$ ; l'un des trois employés $1$, $2$ et $3$ recrute l'employé $4$, et ainsi de suite. On suppose que, pour $1\leqslant i\leqslant n-1$, chacun des employés $1$, …, $i$ a la même probabilité de recruter l'employé $i+1$, les choix successifs étant indépendants.

    **1.** Pour $1\leqslant i\leqslant n$, quelle est la probabilité que l'employé $i$ ne recrute personne ?

    **2.** Soit $N$ le nombre d'employés n'ayant recruté personne. Calculer $E(N)$.
  corrige: |
    **1.** L'employé $i$ ne peut recruter que les employés $i+1$, $i+2$, …, $n$. Lorsque l'employé $j+1$ est recruté ($j\geqslant i$), le recruteur est choisi parmi $j$ employés, donc l'employé $i$ n'est pas le recruteur avec la probabilité $1-\frac{1}{j}$. Les choix étant indépendants, la probabilité que $i$ ne recrute personne vaut 
    $$\prod_{j=i}^{n-1}\left(1-\frac{1}{j}\right)=\prod_{j=i}^{n-1}\frac{j-1}{j} =\frac{i-1}{i}\times\frac{i}{i+1}\times\cdots\times\frac{n-2}{n-1}$$
     Pour $i=1$, le premier facteur est nul : l'employé $1$ recrute forcément l'employé $2$. Pour $i\geqslant 2$, le produit se télescope. Pour $i=n$, il est vide et vaut $1$, ce qui est cohérent puisque le dernier employé ne recrute personne. 
    $$\boxed{P(\text{l'employé } i \text{ ne recrute personne})=\frac{i-1}{n-1} \qquad\text{pour } 1\leqslant i\leqslant n}$$

    **2.** Notons $Z_{i}$ la variable égale à $1$ si l'employé $i$ ne recrute personne, et à $0$ sinon. Alors $N=Z_{1}+\dots+Z_{n}$ et, par linéarité : 
    $$E(N)=\sum_{i=1}^{n}\frac{i-1}{n-1}=\frac{1}{n-1}\times\frac{(n-1)n}{2}=\boxed{\frac{n}{2}}$$

    *Vérification :* pour $n=3$, l'employé $3$ est recruté par l'employé $1$ ou par l'employé $2$, avec la probabilité $\frac{1}{2}$ chacun. Dans le premier cas, les employés $2$ et $3$ ne recrutent personne ($N=2$) ; dans le second, seul l'employé $3$ ne recrute personne ($N=1$). D'où $E(N)=\frac{2+1}{2}=\frac{3}{2}$, conformément à la formule. Une simulation pour $n=10$ donne une moyenne de $4{,}999$, contre $5$ attendu.
