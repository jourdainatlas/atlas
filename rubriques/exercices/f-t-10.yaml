  enonce: |
    On considère une assemblée de $n$ personnes, et l'on ignore les années bissextiles. On suppose les dates d'anniversaire des personnes indépendantes, chaque date étant équiprobable. Quelle est l'espérance du nombre de paires de personnes ayant le même anniversaire ? Pour $1\leqslant i<j\leqslant n$, on introduira la variable aléatoire $X_{i,j}$ égale à $1$ si les personnes $i$ et $j$ ont le même anniversaire, et à $0$ sinon.
  corrige: |
    Soient $i<j$. Quelle que soit la date d'anniversaire de la personne $i$, la personne $j$ a la même date avec la probabilité $\frac{1}{365}$, par indépendance et équiprobabilité. Ainsi $E(X_{i,j})=P(X_{i,j}=1)=\frac{1}{365}$.

    Le nombre $N$ de paires ayant le même anniversaire est la somme des $X_{i,j}$ sur toutes les paires $\{i\,;j\}$, au nombre de $\binom{n}{2}$ (chapitre 7). Par linéarité : 
    $$\boxed{E(N)=\binom{n}{2}\times\frac{1}{365}=\frac{n(n-1)}{730}}$$

    *Exemples :* pour $n=23$, $E(N)=\frac{253}{365}\approx 0{,}69$ ; pour $n=28$, $E(N)=\frac{378}{365}\approx 1{,}04$ : dans une classe de $28$ élèves, on compte en moyenne plus d'une paire d'élèves nés le même jour.

    *Interprétation :* le nombre de paires croît comme $n^{2}$, et non comme $n$ : c'est la raison profonde du paradoxe des anniversaires, rencontré au chapitre 2, où la probabilité d'une coïncidence dépasse $\frac{1}{2}$ dès $23$ personnes.
