  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 470 et 475"
  page_enonce: 5
  page_corrige: 19
  enonce: |
    **1.** Quel est le reste de la division de $5^{2022}$ par $8$ ?

    **2.** **a)** Vérifier que, si $n\in\mathbb{N}$, $(n+3)^{3}\equiv n^{3}\;[9]$ et $7^{n+3}\equiv 7^{n}\;[9]$.

    **b)** Quel est le reste de la division euclidienne de $7^{n}+n^{3}$ par $9$ ?
  corrige: |
    **1.** $5^{2}=25\equiv 1\;[8]$, donc $5^{2022}=\left(5^{2}\right)^{1011}\equiv 1\;[8]$ : le reste est $\boxed{1}$.

    **2.** **(a)** On a $(n+3)^{3}=n^{3}+9n^{2}+27n+27\equiv n^{3}\;[9]$, et $7^{3}=343=9\times 38+1\equiv 1\;[9]$, donc $7^{n+3}=7^{n}\times 7^{3}\equiv 7^{n}\;[9]$.

    **(b)** D'après a), $7^{n+3}+(n+3)^{3}\equiv 7^{n}+n^{3}\;[9]$ : par récurrence, le reste ne dépend que du reste de $n$ modulo $3$. On calcule $7^{0}+0=1$, $7^{1}+1=8$ et $7^{2}+8=57\equiv 3\;[9]$. Le reste vaut donc $\boxed{1,\ 8 \text{ ou } 3}$ selon que $n\equiv 0$, $1$ ou $2\;[3]$.
- id: "me-04-28"
  feuille: "f-me-04"
  numero: 28
  partie: "Pour aller plus loin"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [divisibilité]
  noeuds: [z-division]
  notions: []
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 471 et 472"
  page_enonce: 6
  page_corrige: 20
  enonce: |
    **1.** Montrer que, si $x\in\mathbb{Z}$, $11\mid 2x+3 \iff 11\mid 5x+2$.

    **2.** Quels sont les $x\in\mathbb{Z}$ tels que $12$ divise $x^{2}-1$ ? tels que $12$ divise $x^{2}-2$ ?
  corrige: |
    **1.** On a $8(2x+3)=16x+24\equiv 5x+2\;[11]$ : si $11$ divise $2x+3$, il divise $5x+2$. Réciproquement, $7(5x+2)=35x+14\equiv 2x+3\;[11]$ : si $11$ divise $5x+2$, il divise $2x+3$. D'où $\boxed{11\mid 2x+3 \iff 11\mid 5x+2}$. Les facteurs $8$ et $7$ s'obtiennent en cherchant par quel nombre multiplier $2$ (resp. $5$) pour obtenir $5$ (resp. $2$) modulo $11$.

    **2.** Les carrés modulo $12$ des entiers $0$, …, $11$ sont $0$, $1$, $4$, $9$, $4$, $1$, $0$, $1$, $4$, $9$, $4$, $1$. Ainsi : 
    $$\boxed{12\mid x^{2}-1 \iff x\equiv 1,\ 5,\ 7 \text{ ou } 11\;[12]}$$
     c'est-à-dire si et seulement si $x$ n'est divisible ni par $2$ ni par $3$. En revanche, $2$ n'est jamais un carré modulo $12$ : $\boxed{\text{aucun entier } x \text{ ne convient}}$ pour $x^{2}-2$.
- id: "me-04-29"
  feuille: "f-me-04"
  numero: 29
  partie: "Pour aller plus loin"
  etoiles: 2
  types: [Calcul]
  mots_cles: [divisibilité]
  noeuds: [z-division]
  notions: []
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 556"
  page_enonce: 6
  page_corrige: 20
  enonce: |
    **a)** Déterminer les $n\in\mathbb{N}$ tels que $5$ divise $2^{n}-3$.

    **b)** Déterminer les $n\in\mathbb{N}$ tels que $13$ divise $2^{n}-3$.

    **c)** Déterminer les $n\in\mathbb{N}$ tels que $65$ divise $2^{n}-3$.
  corrige: |
    **a)** Les puissances de $2$ modulo $5$ sont $1$, $2$, $4$, $3$, puis se répètent ($2^{4}\equiv 1$). On a $2^{n}\equiv 3\;[5]$ si et seulement si $\boxed{n\equiv 3\;[4]}$.

    **b)** Les puissances de $2$ modulo $13$ pour $n=0,\dots,12$ sont $1$, $2$, $4$, $8$, $3$, $6$, $12$, $11$, $9$, $5$, $10$, $7$, $1$ : elles se répètent avec la période $12$ (Fermat), et la valeur $3$ n'est atteinte que pour $n=4$. Donc $\boxed{n\equiv 4\;[12]}$.

    **c)** $65=5\times 13$ avec $5$ et $13$ premiers distincts : $65$ divise un entier si et seulement si $5$ et $13$ le divisent (lemme d'Euclide). Il faudrait donc $n\equiv 3\;[4]$ et $n\equiv 4\;[12]$. Mais la seconde condition donne $n\equiv 4\equiv 0\;[4]$, ce qui contredit la première. $\boxed{\text{Aucun entier } n \text{ ne convient.}}$
- id: "me-04-30"
  feuille: "f-me-04"
  numero: 30
  partie: "Pour aller plus loin"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [congruences, divisibilité, nombres premiers]
  noeuds: [z-zn, z-division, z-premiers]
  notions: [anneau-zn, nombre-premier]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 542 et 543"
  page_enonce: 6
  page_corrige: 20
  enonce: |
    **1.** Quels sont les nombres premiers $p$ tels que $p$ divise $7^{p}+8^{p}$ ?

    **2.** Montrer que, pour tout $x\in\mathbb{Z}$, $x^{11}\equiv x\;[33]$.
  corrige: |
    **1.** D'après le petit théorème de Fermat, $7^{p}\equiv 7$ et $8^{p}\equiv 8\;[p]$, donc $7^{p}+8^{p}\equiv 15\;[p]$. Ainsi $p$ divise $7^{p}+8^{p}$ si et seulement si $p$ divise $15$, c'est-à-dire $\boxed{p\in\{3\;;5\}}$. *Vérification :* $7^{3}+8^{3}=855=3\times 285$ et $7^{5}+8^{5}=49\,575=5\times 9\,915$.

    **2.** Modulo $11$, Fermat donne directement $x^{11}\equiv x$. Modulo $3$, Fermat donne $x^{3}\equiv x$, donc $x^{9}=\left(x^{3}\right)^{3}\equiv x^{3}\equiv x$ et $x^{11}=x^{9}x^{2}\equiv x^{3}\equiv x\;[3]$. Ainsi $3$ et $11$ divisent $x^{11}-x$ ; ce sont deux nombres premiers distincts, donc (lemme d'Euclide) $33$ divise $x^{11}-x$ : $\boxed{x^{11}\equiv x\;[33]}$.
