  enonce: |
    Montrer que l'équation $x^{2}+y^{2}=3z^{2}$ n'a pas de solution dans $\mathbb{Z}^{3}$ autre que $(0,0,0)$. On commencera par montrer que, si $(x,y,z)$ est une solution, alors $x$, $y$, $z$ sont divisibles par $3$.
  corrige: |
    **Étape 1.** Modulo $3$, les carrés valent $0$ (si $x\equiv 0$) ou $1$ (si $x\equiv 1$ ou $2$). Si $x^{2}+y^{2}=3z^{2}$, alors $x^{2}+y^{2}\equiv 0\;[3]$ ; or $x^{2}+y^{2}$ est congru à $0$, $1$ ou $2$, et ne vaut $0$ que si $x^{2}\equiv y^{2}\equiv 0$, c'est-à-dire si $3$ divise $x$ et $y$. Alors $9$ divise $x^{2}+y^{2}=3z^{2}$, donc $3$ divise $z^{2}$, puis $z$ (lemme d'Euclide).

    **Étape 2.** Supposons qu'il existe une solution non nulle, et choisissons-en une, $(x,y,z)$, pour laquelle l'entier $|x|+|y|+|z|>0$ est le plus petit possible. D'après l'étape 1, $x=3x'$, $y=3y'$ et $z=3z'$ ; en divisant l'équation par $9$, on obtient $x'^{2}+y'^{2}=3z'^{2}$ : $(x',y',z')$ est une solution non nulle avec $|x'|+|y'|+|z'|=\frac{1}{3}\left(|x|+|y|+|z|\right)$, strictement plus petit. C'est absurde.

    Donc $\boxed{(0,0,0) \text{ est la seule solution}}$. Ce raisonnement, dit de *descente infinie*, remonte à Fermat.
- id: "me-04-35"
  feuille: "f-me-04"
  numero: 35
  titre: "Carrés modulo un nombre premier"
  partie: "Pour aller plus loin"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [congruences, divisibilité, nombres premiers, arithmétique modulo p]
  noeuds: [z-zn, z-division, z-premiers]
  notions: [anneau-zn, nombre-premier]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 547 (questions a à d) et 548"
  page_enonce: 6
  page_corrige: 22
  enonce: |
    Soit $p$ un nombre premier. Si $x\in\mathbb{Z}$, on dit que $x$ est un carré modulo $p$ s'il existe $y\in\mathbb{Z}$ tel que $x\equiv y^{2}\;[p]$.

    **a)** Vérifier que tout $x\in\mathbb{Z}$ est un carré modulo $2$.

    **b)** Quels sont les $x\in\mathbb{Z}$ qui sont des carrés modulo $3$ ? $5$ ? $7$ ?

    **c)** On suppose que $p$ est impair et que $x\in\mathbb{Z}$, non divisible par $p$, est un carré modulo $p$. Montrer que $x^{\frac{p-1}{2}}\equiv 1\;[p]$.

    **d)** On suppose que $p\equiv 3\;[4]$. Montrer que $-1$ n'est pas un carré modulo $p$.

    **Il existe une infinité de nombres premiers congrus à $1$ modulo $4$.** Soient $n\geqslant 2$ un entier, $p$ un diviseur premier de $(n!)^{2}+1$.

    **e)** Montrer, en utilisant la question d), que $p\equiv 1\;[4]$.

    **f)** Montrer que $p>n$.

    **g)** Conclure que l'ensemble des nombres premiers congrus à $1$ modulo $4$ est infini.
  corrige: |
    **a)** Tout entier est congru à $0$ ou $1$ modulo $2$, et $0^{2}=0$, $1^{2}=1$ : tout $x$ vérifie $x\equiv x^{2}\;[2]$.

    **b)** Les carrés modulo $3$ sont $0$, $1$ ; modulo $5$ : $0$, $1$, $4$ ; modulo $7$ : $0$, $1$, $2$, $4$ (tableaux des exercices 9 et 13). Les carrés modulo $3$ sont donc les $x\equiv 0$ ou $1\;[3]$, et de même pour $5$ et $7$.

    **c)** Si $x\equiv y^{2}\;[p]$ avec $p$ ne divisant pas $x$, alors $p$ ne divise pas $y$ (sinon $p$ diviserait $y^{2}$, donc $x$). Comme $p$ est impair, $\frac{p-1}{2}$ est entier et, par Fermat, $x^{\frac{p-1}{2}}\equiv y^{p-1}\equiv 1\;[p]$.

    **d)** Si $p\equiv 3\;[4]$, alors $p$ est impair et $\frac{p-1}{2}$ est impair. Si $-1$ était un carré modulo $p$, la question c) donnerait $(-1)^{\frac{p-1}{2}}=-1\equiv 1\;[p]$, donc $p$ diviserait $2$, ce qui est absurde.

    **e)** Comme $n\geqslant 2$, $n!$ est pair, donc $(n!)^{2}+1$ est impair et $p\neq 2$. De plus $-1\equiv(n!)^{2}\;[p]$ est un carré modulo $p$, donc d'après d), $p\not\equiv 3\;[4]$. Un nombre impair étant congru à $1$ ou $3$ modulo $4$, on a $\boxed{p\equiv 1\;[4]}$.

    **f)** Si l'on avait $p\leqslant n$, $p$ diviserait $n!$, donc $(n!)^{2}$, et donc $1=\left((n!)^{2}+1\right)-(n!)^{2}$, ce qui est absurde. Ainsi $\boxed{p>n}$.

    **g)** Pour tout entier $n\geqslant 2$, il existe un nombre premier $p\equiv 1\;[4]$ strictement supérieur à $n$ : l'ensemble de ces nombres premiers n'est donc pas majoré, il est $\boxed{\text{infini}}$.

    La démarche des questions e) à g) reprend celle d'Euclide pour l'infinité des nombres premiers (Proposition 3 du chapitre 1), et celle de l'exercice 27 du chapitre 1 pour les nombres de la forme $6k+5$.
