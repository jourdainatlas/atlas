  enonce: |
    En utilisant éventuellement le fait que $p$ divise $\binom{p}{k}$ pour $1\leqslant k\leqslant p-1$ (démonstration du petit théorème de Fermat), montrer que, si $p$ est un nombre premier et $k\in\{0,\dots,p-1\}$, $\binom{p-1}{k}\equiv(-1)^{k}\;[p]$.
  corrige: |
    On raisonne par récurrence sur $k\in\{0,\dots,p-1\}$. Pour $k=0$, $\binom{p-1}{0}=1=(-1)^{0}$. Si la propriété est vraie au rang $k-1$, avec $1\leqslant k\leqslant p-1$, la formule de Pascal donne $\binom{p}{k}=\binom{p-1}{k}+\binom{p-1}{k-1}$. Or $p$ divise $\binom{p}{k}$ (c'est le point clé de la démonstration du petit théorème de Fermat dans le cours), donc : 
    $$\binom{p-1}{k}\equiv -\binom{p-1}{k-1}\equiv -(-1)^{k-1}=(-1)^{k}\;[p].$$
     Par récurrence, $\boxed{\binom{p-1}{k}\equiv(-1)^{k}\;[p]}$. *Vérification :* pour $p=7$, la ligne $\binom{6}{k}$ vaut $1$, $6$, $15$, $20$, $15$, $6$, $1$, congrue à $1$, $-1$, $1$, $-1$, $1$, $-1$, $1$ modulo $7$.
