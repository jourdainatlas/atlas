  titre: "Le petit théorème de Fermat par la méthode d'Euler"
  partie: "Pour aller plus loin"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [congruences, division euclidienne, divisibilité, petit théorème de Fermat, nombres premiers]
  noeuds: [z-zn, z-division, z-premiers]
  notions: [anneau-zn, division-euclidienne, nombre-premier]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 550"
  page_enonce: 7
  page_corrige: 22
  enonce: |
    Soient $p$ un nombre premier, $x\in\mathbb{Z}$ non divisible par $p$.

    **a)** Montrer que l'application qui à $a\in\{1,\dots,p-1\}$ associe le reste $r(a)$ de la division euclidienne de $ax$ par $p$ est une bijection de $\{1,\dots,p-1\}$ sur lui-même.

    **b)** En faisant le produit des congruences $ax\equiv r(a)\;[p]$ pour $a\in\{1,\dots,p-1\}$, retrouver le petit théorème de Fermat.
  corrige: |
    **a)** Pour $a\in\{1,\dots,p-1\}$, $p$ ne divise ni $a$ ni $x$, donc ne divise pas $ax$ (lemme d'Euclide) : $r(a)\in\{1,\dots,p-1\}$. Si $r(a)=r(b)$, alors $p$ divise $ax-bx=(a-b)x$, donc $p$ divise $a-b$ ; comme $|a-b|<p$, on a $a=b$. L'application $r$ est donc injective de $\{1,\dots,p-1\}$ dans lui-même ; un ensemble fini ayant autant d'éléments au départ qu'à l'arrivée, elle est bijective.

    **b)** En multipliant les $p-1$ congruences $ax\equiv r(a)\;[p]$ (Proposition 1), on obtient $(p-1)!\,x^{p-1}\equiv\prod_{a=1}^{p-1}r(a)\;[p]$. Comme $r$ est une bijection, le produit des $r(a)$ est celui des entiers de $1$ à $p-1$, soit $(p-1)!$. Ainsi $p$ divise $(p-1)!\left(x^{p-1}-1\right)$. Or $p$ ne divise aucun des facteurs de $(p-1)!$, donc ne divise pas $(p-1)!$, et le lemme d'Euclide donne que $p$ divise $x^{p-1}-1$ : $\boxed{x^{p-1}\equiv 1\;[p]}$.

    Cette démonstration, due à Euler, n'utilise pas les coefficients binomiaux : c'est une alternative à celle du cours.
- id: "me-04-37"
  feuille: "f-me-04"
  numero: 37
  titre: "Théorème de Wilson"
  partie: "Pour aller plus loin"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [congruences, nombres premiers, arithmétique modulo p]
  noeuds: [z-zn, z-premiers]
  notions: [anneau-zn, nombre-premier]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 511"
  page_enonce: 7
  page_corrige: 22
  enonce: |
    Soit $p$ un nombre premier. On dit que $b$ est un inverse de $a$ modulo $p$ si $ab\equiv 1\;[p]$.

    **a)** Justifier que tout $a\in\{1,\dots,p-1\}$ admet un unique inverse modulo $p$ dans $\{1,\dots,p-1\}$, que l'on note $i(a)$.

    **b)** Montrer que les seuls $a\in\{1,\dots,p-1\}$ tels que $i(a)=a$ sont $1$ et $p-1$ (qui sont égaux si $p=2$, distincts sinon).

    **c)** En regroupant judicieusement les facteurs du produit $\displaystyle\prod_{a=1}^{p-1}a$, établir le théorème de Wilson : 
    $$(p-1)!\equiv -1\;[p].$$

    **d)** On suppose que $n\geqslant 2$ est un entier tel que $(n-1)!\equiv -1\;[n]$. Montrer que tout élément de $\{1,\dots,n-1\}$ admet un inverse modulo $n$ et en déduire que $n$ est premier.
  corrige: |
    **a)** **Existence.** D'après Fermat, $a\times a^{p-2}=a^{p-1}\equiv 1\;[p]$. Le reste de $a^{p-2}$ modulo $p$ est donc un inverse de $a$ ; il n'est pas nul, puisque son produit par $a$ est congru à $1$. **Unicité.** Si $ab\equiv ab'\equiv 1\;[p]$ avec $b$, $b'$ dans $\{1,\dots,p-1\}$, alors $p$ divise $a(b-b')$, donc $b-b'$ (lemme d'Euclide), d'où $b=b'$.

    **b)** $i(a)=a$ équivaut à $a^{2}\equiv 1\;[p]$, c'est-à-dire $p\mid(a-1)(a+1)$, soit $p\mid a-1$ ou $p\mid a+1$. Dans $\{1,\dots,p-1\}$, cela donne $a=1$ ou $a=p-1$.

    **c)** Pour $p=2$, $(p-1)!=1\equiv -1\;[2]$. Pour $p\geqslant 3$, on a $i\big(i(a)\big)=a$, et d'après b), les entiers $2$, …, $p-2$ se regroupent en paires $\{a,i(a)\}$ d'éléments distincts dont le produit est congru à $1$. Donc $2\times 3\times\dots\times(p-2)\equiv 1\;[p]$, et $(p-1)!\equiv 1\times 1\times(p-1)\equiv -1\;[p]$ : $\boxed{(p-1)!\equiv -1\;[p]}$. *Vérification :* $6!=720=7\times 103-1$.

    **d)** Soit $a\in\{1,\dots,n-1\}$ et $c$ le produit des autres éléments de $\{1,\dots,n-1\}$ : $ac=(n-1)!\equiv -1\;[n]$, donc $a\times(-c)\equiv 1\;[n]$, et $-c$ est un inverse de $a$. Si $n$ n'était pas premier, il s'écrirait $n=ab$ avec $1<a<n$ ; en notant $d$ un inverse de $a$, on aurait $ad-1=kn=kab$ avec $k\in\mathbb{Z}$, donc $a$ diviserait $1$, ce qui est absurde. Ainsi $\boxed{n \text{ est premier}}$.

    Le théorème de Wilson fournit donc une caractérisation des nombres premiers : $n\geqslant 2$ est premier si et seulement si $(n-1)!\equiv -1\;[n]$. Elle est toutefois inutilisable en pratique, $(n-1)!$ étant gigantesque.

