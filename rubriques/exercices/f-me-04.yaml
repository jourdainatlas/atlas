  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 544 (coquille corrigée : x^13 ≡ x et non n)"
  page_enonce: 6
  page_corrige: 21
  enonce: |
    **a)** Décomposer $2730$ en facteurs premiers.

    **b)** Montrer que, pour tout nombre premier $p$ divisant $2730$, $p-1$ divise $12$.

    **c)** Montrer que, pour tout $x\in\mathbb{Z}$, on a $x^{13}\equiv x\;[2730]$.
  corrige: |
    **a)** $2730=2\times 1365=2\times 3\times 455=\boxed{2\times 3\times 5\times 7\times 13}$.

    **b)** Les nombres $p-1$ valent $1$, $2$, $4$, $6$ et $12$, qui divisent tous $12$.

    **c)** Soit $p$ l'un de ces nombres premiers. Si $p$ divise $x$, alors $x^{13}\equiv 0\equiv x\;[p]$. Sinon, $x^{p-1}\equiv 1\;[p]$ d'après Fermat, et comme $12=(p-1)m$ avec $m$ entier, $x^{12}=\left(x^{p-1}\right)^{m}\equiv 1$, d'où $x^{13}\equiv x\;[p]$. Ainsi les cinq nombres premiers distincts $2$, $3$, $5$, $7$, $13$ divisent $x^{13}-x$, donc leur produit aussi (lemme d'Euclide appliqué de proche en proche) : $\boxed{x^{13}\equiv x\;[2730]}$.

    L'énoncé original du poly écrit « $x^{13}\equiv n\;[2730]$ », ce qui est une coquille.
