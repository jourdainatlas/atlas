  enonce: |
    **Courbes en coordonnées polaires, spirales logarithmiques.** On considère une courbe plane d'équation polaire $\rho = \varphi(\theta)$, c'est-à-dire paramétrée par $f(\theta) = \varphi(\theta)\mathrm{e}^{\mathrm{i}\theta}$, où $\varphi : I \to \mathbb{R}$ est de classe $\mathcal{C}^{1}$.

    **1.** Montrer que la longueur de l'arc entre les paramètres $\alpha < \beta$ vaut $\mathop{\displaystyle \int_{\alpha}^{\beta}}\sqrt{\varphi(\theta)^{2} + \varphi'(\theta)^{2}}\,\mathrm{d}\theta$. Calculer la longueur de la cardioïde $\rho = a(1 + \cos\theta)$, $\theta \in \, ]{-\pi}, \pi[$, où $a > 0$.

    **2.** Soit $V \in \, ]0, \pi[$, $V \neq \dfrac{\pi}{2}$. Déterminer les courbes $\rho = \varphi(\theta)$, avec $\varphi > 0$, dont la tangente fait en tout point l'angle constant $V$ avec le rayon vecteur $f(\theta)$. On obtient les *spirales logarithmiques* $\rho = a\,\mathrm{e}^{m\theta}$, avec $m = \cot V$.

    **3.** Pour $m > 0$, montrer que l'arc de spirale correspondant à $\theta \in \, ]{-\infty}, \theta_{1}]$, qui tourne une infinité de fois autour de l'origine, est de longueur finie, et la calculer.

    **4.** Montrer que le rayon de courbure de la spirale est proportionnel à l'abscisse curviligne comptée depuis l'origine.

    **5.** Montrer que la développée de la spirale, c'est-à-dire le lieu de ses centres de courbure, est une spirale logarithmique de même paramètre $m$, image de la première par une similitude de centre $0$.
  corrige: |
    **1.** $f'(\theta) = (\varphi'(\theta) + \mathrm{i}\varphi(\theta))\mathrm{e}^{\mathrm{i}\theta}$, de norme $\sqrt{\varphi^{2} + \varphi'^{2}}$, d'où la formule (cours, prop. 3). Pour la cardioïde,
    $$\varphi^{2} + \varphi'^{2} = a^{2}\big((1 + \cos\theta)^{2} + \sin^{2}\theta\big) = 2a^{2}(1 + \cos\theta) = 4a^{2}\cos^{2}\frac{\theta}{2} ,$$
     et la longueur vaut
    $$\int_{-\pi}^{\pi}2a\cos\frac{\theta}{2}\,\mathrm{d}\theta = \boxed{8a} .$$

    **2.** L'angle $V$ de $f(\theta)$ à $f'(\theta)$ est l'argument de
    $$\frac{f'}{f} = \frac{\varphi'}{\varphi} + \mathrm{i} :$$
     il vérifie $\cot V = \dfrac{\varphi'}{\varphi}$. Il est constant si et seulement si $\dfrac{\varphi'}{\varphi} = m = \cot V$ est constant, c'est-à-dire $\varphi(\theta) = a\,\mathrm{e}^{m\theta}$ avec $a > 0$. Le cas exclu $V = \dfrac{\pi}{2}$ donnerait les cercles de centre $0$.

    **3.** Pour $\varphi = a\mathrm{e}^{m\theta}$, $\sqrt{\varphi^{2} + \varphi'^{2}} = \sqrt{1 + m^{2}}\,a\,\mathrm{e}^{m\theta}$, intégrable sur $]{-\infty}, \theta_{1}]$ puisque $m > 0$ : 
    $$\mathcal{L} = \int_{-\infty}^{\theta_{1}}\sqrt{1 + m^{2}}\,a\,\mathrm{e}^{m\theta}\,\mathrm{d}\theta = \frac{\sqrt{1 + m^{2}}}{m}\,\varphi(\theta_{1}) .$$
     L'arc fait une infinité de tours autour de $0$ et a pourtant une longueur finie : les tours rétrécissent assez vite.

    **4.** La proposition 11 donne, avec $r = \varphi$, $r' = m\varphi$, $r'' = m^{2}\varphi$ :
    $$k = \frac{\varphi^{2}(1 + 2m^{2} - m^{2})}{\varphi^{3}(1 + m^{2})^{3/2}} = \frac{1}{\sqrt{1 + m^{2}}\,\varphi} .$$
     Le rayon de courbure $\sqrt{1 + m^{2}}\,\varphi$ vaut donc $\boxed{m\,s}$, où $s = \dfrac{\sqrt{1 + m^{2}}}{m}\varphi$ est l'abscisse curviligne comptée depuis l'origine (question 3).

    **5.** Le centre de courbure est
    $$e = f + \frac{1}{k}\mathrm{i}\frac{f'}{\lVert f' \rVert} .$$
     Ici $f' = (m + \mathrm{i})f$, $\lVert f' \rVert = \sqrt{1 + m^{2}}\,|f|$, donc 
    $$e = f + \sqrt{1 + m^{2}}\,|f| \cdot \frac{\mathrm{i}(m + \mathrm{i})f}{\sqrt{1 + m^{2}}\,|f|} = f + (\mathrm{i} m - 1)f = \boxed{\mathrm{i} m\,f} .$$
     La développée est l'image de la spirale par la similitude $z \mapsto \mathrm{i} m z$, de centre $0$, de rapport $m$ et d'angle $\dfrac{\pi}{2}$ : c'est une spirale logarithmique de même paramètre.

    ![Figure](documents/figures/d4d66bbc03ac7f36.svg)

    La spirale $\rho = 0{,}9\,\mathrm{e}^{0{,}18\theta}$ (en bleu) et sa développée (en orange), qui en est une copie réduite et tournée d'un quart de tour. Le segment violet joint un point de la spirale à son centre de courbure ; il est tangent à la développée, comme l'établira l'exercice 11.
- id: "l3-gd-01-06"
  feuille: "f-l3-gd-01"
  numero: 6
  partie: "Arcs paramétrés, tangente, longueur"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [arcs paramétrés]
  noeuds: [cb-courbes, cb-abscisse]
  notions: [courbe-parametree, courbe-reguliere, longueur-courbe]
  source: "Bordeaux 2016, feuille 1, exercice 10 (courbe de Koch)"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **La courbe de Koch, un arc continu de longueur infinie.** Soient $a \neq b$ deux points de $\mathbb{R}^{2}$ et $s < t$ deux réels.

    **1.** Vérifier qu'il existe une unique application affine $\gamma : [s, t] \to \mathbb{R}^{2}$ telle que $\gamma(s) = a$ et $\gamma(t) = b$, et l'expliciter.

    **2.** On pose $a_{0} = a$, $a_{1} = a + \dfrac{b - a}{3}$, $a_{3} = a + \dfrac{2(b - a)}{3}$, $a_{4} = b$, et l'on note $a_{2}$ l'unique point tel que le triangle $(a_{1}, a_{3}, a_{2})$ soit équilatéral et direct. On pose aussi $t_{0} = s$, $t_{1} = s + \dfrac{t - s}{3}$, $t_{2} = \dfrac{s + t}{2}$, $t_{3} = s + \dfrac{2(t - s)}{3}$, $t_{4} = t$, et l'on note $\hat{\gamma} : [s, t] \to \mathbb{R}^{2}$ l'application affine sur chaque $[t_{i}, t_{i + 1}]$ telle que $\hat{\gamma}(t_{i}) = a_{i}$ pour $0 \leq i \leq 4$. Faire un dessin et prouver que 
    $$\lVert \gamma(u) - \hat{\gamma}(u) \rVert \leq \frac{\lVert b - a \rVert}{2\sqrt{3}} \qquad (u \in [s, t]) .$$

    **3.** On pose $f_{0} = \gamma$ et $f_{1} = \hat{\gamma}$, puis l'on définit $f_{n + 1}$ en remplaçant, dans $f_{n}$, chacun des $4^{n}$ morceaux affines $c$ par $\hat{c}$. Dessiner les images de $f_{0}$, $f_{1}$, $f_{2}$. Montrer que $(f_{n})$ converge uniformément sur $[s, t]$ vers une application continue $f$.

    **4.** On note $\ell(g)$ la longueur d'une ligne polygonale $g$, et $\ell_{[c, d]}(f)$ la borne supérieure des longueurs des lignes polygonales inscrites dans $f$ entre les paramètres $c$ et $d$ (cours, section 1.4.1). Montrer que $\ell(f_{n}) = \left(\dfrac{4}{3}\right)^{n}\lVert b - a \rVert$ et que $\ell(f_{n}) \leq \ell_{[s, t]}(f)$. En déduire que $\ell_{[s, t]}(f) = +\infty$. Que dire de $\ell_{[c, d]}(f)$ pour $s \leq c < d \leq t$ ?
  corrige: |
    **1.** L'application
    $$\boxed{\gamma(u) = a + \frac{u - s}{t - s}(b - a)}$$
     est affine et convient ; l'unicité vient de ce qu'une application affine de $\mathbb{R}$ est déterminée par ses valeurs en deux points.

    **2.** On a $a_{2} = a_{1} + (a_{3} - a_{1})\mathrm{e}^{\mathrm{i}\pi/3}$. L'application $\hat{\gamma}$ existe : sur chaque $[t_{i}, t_{i + 1}]$, c'est l'application affine de la question 1 envoyant $t_{i}$ sur $a_{i}$ et $t_{i + 1}$ sur $a_{i + 1}$, et les morceaux se raccordent aux $t_{i}$. Sur $[t_{0}, t_{1}]$, $\gamma$ et $\hat{\gamma}$ sont affines et coïncident en $t_{0}$ et $t_{1}$ (puisque $\gamma(t_{1}) = a_{1}$), donc sont égales ; de même sur $[t_{3}, t_{4}]$.

    Sur $[t_{1}, t_{2}]$, $\gamma - \hat{\gamma}$ est affine, nulle en $t_{1}$, et vaut en $t_{2}$ la différence entre le milieu $\dfrac{a_{1} + a_{3}}{2} = \gamma(t_{2})$ et le sommet $a_{2}$ du triangle équilatéral de côté $\dfrac{\lVert b - a \rVert}{3}$, c'est-à-dire sa hauteur
    $$\frac{\sqrt{3}}{2}\cdot\frac{\lVert b - a \rVert}{3} = \frac{\lVert b - a \rVert}{2\sqrt{3}} .$$
     Une fonction affine atteignant sa norme maximale en une extrémité,
    $$\lVert \gamma - \hat{\gamma} \rVert \leq \frac{\lVert b - a \rVert}{2\sqrt{3}}$$
     sur $[t_{1}, t_{2}]$, et de même sur $[t_{2}, t_{3}]$.

    **3.** Chaque morceau affine de $f_{n}$ a une longueur $\dfrac{\lVert b - a \rVert}{3^{n}}$, et la question 2, appliquée à chacun, donne 
    $$\lVert f_{n + 1} - f_{n} \rVert_{\infty} \leq \frac{\lVert b - a \rVert}{2\sqrt{3}\cdot 3^{n}} .$$
     La série
    $$\sum\lVert f_{n + 1} - f_{n} \rVert_{\infty}$$
     converge, donc $(f_{n})$ est de Cauchy pour la norme uniforme et converge uniformément vers une application $f$, continue comme limite uniforme d'applications continues.

    ![Figure](documents/figures/95a8124deb56dab4.svg)

    Les lignes polygonales $f_{0}$, $f_{1}$, $f_{2}$ et $f_{4}$ (à $256$ côtés). À chaque étape, chaque côté est remplacé par quatre côtés trois fois plus courts : la longueur est multipliée par $\dfrac{4}{3}$, tandis que la ligne bouge de moins en moins.

    **4.** Par récurrence, $f_{n}$ a $4^{n}$ côtés de longueur $\dfrac{\lVert b - a \rVert}{3^{n}}$, d'où
    $$\ell(f_{n}) = \left(\frac{4}{3}\right)^{n}\lVert b - a \rVert .$$
     Notons $D_{n}$ l'ensemble des extrémités des intervalles sur lesquels $f_{n}$ est affine. Le remplacement d'un côté $c$ par $\hat{c}$ ne change pas ses extrémités, donc $f_{m} = f_{n}$ sur $D_{n}$ pour $m \geq n$, puis $f = f_{n}$ sur $D_{n}$ par passage à la limite.

    Ainsi $f_{n}$ est la ligne polygonale inscrite dans $f$ de sommets les $f(\tau)$, $\tau \in D_{n}$, et $\ell(f_{n}) \leq \ell_{[s, t]}(f)$. Comme $\left(\dfrac{4}{3}\right)^{n} \to +\infty$, $\ell_{[s, t]}(f) = +\infty$ : la courbe de Koch est continue mais n'est pas rectifiable.

    Pour $s \leq c < d \leq t$ : les intervalles de $D_{n}$ ont une longueur au plus $\dfrac{t - s}{3^{n}}$, donc pour $n$ assez grand $[c, d]$ contient l'un d'eux, $[\tau, \tau']$. Sur $[\tau, \tau']$, $f$ est obtenue à partir du segment $f_{n}([\tau, \tau'])$ par la même construction, et le raisonnement précédent donne $\ell_{[\tau, \tau']}(f) = +\infty$. Donc $\ell_{[c, d]}(f) = +\infty$ : aucun morceau de la courbe n'a de longueur finie.

    *Remarque.* La longueur n'est donc pas la bonne mesure de la taille de cette courbe. Comme elle est formée de $4$ copies d'elle-même réduites dans le rapport $3$, sa dimension de Hausdorff vaut $\dfrac{\ln 4}{\ln 3} \approx 1{,}26$, strictement entre celle d'une courbe ($1$) et celle d'une surface ($2$).
