  enonce: |
    **Calculs de courbure.** On utilisera les formules des propositions 6, 11 et 13 du cours.

    **1.** Calculer la courbure algébrique du graphe $x \mapsto (x, \varphi(x))$ d'une fonction $\varphi : I \to \mathbb{R}$ de classe $\mathcal{C}^{2}$. Application à la parabole $y = ax^{2}$ ($a \neq 0$) : où la courbure est-elle maximale ?

    **2.** Calculer la courbure de la cardioïde $\rho = a(1 + \cos\theta)$, $\theta \in \, ]{-\pi}, \pi[$, où $a > 0$.

    **3.** Calculer la courbure de l'arc $(t, t^{2}, t^{3})$ de $\mathbb{R}^{3}$ au point de paramètre $t$, et sa valeur maximale.
  corrige: |
    **1.** Avec $f(x) = (x, \varphi(x))$, $f' = (1, \varphi')$ et $f'' = (0, \varphi'')$, la proposition 11 donne
    $$\boxed{k = \frac{\varphi''}{(1 + \varphi'^{2})^{3/2}}} ,$$
     l'arc étant orienté par $x$ croissant. Pour $y = ax^{2}$, $k(x) = \dfrac{2a}{(1 + 4a^{2}x^{2})^{3/2}}$, dont la valeur absolue est maximale, égale à $2|a|$, au sommet $x = 0$.

    **2.** Avec $r = a(1 + \cos\theta)$, $r' = -a\sin\theta$, $r'' = -a\cos\theta$ : 
    $$r^{2} + 2r'^{2} - rr'' = a^{2}\big((1 + \cos\theta)^{2} + 2\sin^{2}\theta + \cos\theta(1 + \cos\theta)\big) = 3a^{2}(1 + \cos\theta) ,$$
     et $r^{2} + r'^{2} = 2a^{2}(1 + \cos\theta)$. Donc
    $$k = \frac{3a^{2}(1 + \cos\theta)}{(2a^{2}(1 + \cos\theta))^{3/2}} = \frac{3}{2\sqrt{2}\,a\sqrt{1 + \cos\theta}} ,$$
     soit
    $$\boxed{k = \frac{3}{4a\cos\frac{\theta}{2}}} .$$
     Elle vaut $\dfrac{3}{4a}$ au point le plus éloigné de l'origine et tend vers $+\infty$ quand $\theta \to \pm\pi$, au rebroussement situé en $0$.

    **3.** $f' = (1, 2t, 3t^{2})$, $f'' = (0, 2, 6t)$, $f' \wedge f'' = (6t^{2}, -6t, 2)$, d'où, par la proposition 13, 
    $$k(t) = \frac{2\sqrt{9t^{4} + 9t^{2} + 1}}{(1 + 4t^{2} + 9t^{4})^{3/2}} .$$
     Avec $u = t^{2}$,
    $$\frac{k^{2}}{4} = \frac{N}{D^{3}}$$
     où $N = 9u^{2} + 9u + 1$ et $D = 9u^{2} + 4u + 1$. Le numérateur de la dérivée de $\dfrac{N}{D^{3}}$ est
    $$N'D - 3ND' = -324u^{3} - 441u^{2} - 108u - 3 < 0 ,$$
     donc $k$ décroît avec $|t|$, et son maximum vaut $2$, atteint en $t = 0$.
- id: "l3-gd-01-08"
  feuille: "f-l3-gd-01"
