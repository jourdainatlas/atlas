  source: "Bordeaux 2016, feuille 2, exercice 2"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    **Courbure nulle, courbure constante.**

    **1.** Montrer qu'un arc régulier de classe $\mathcal{C}^{2}$ de $\mathbb{R}^{n}$ de courbure nulle est porté par une droite.

    **2.** *Arcs sans point birégulier.* Soit $(I, f)$ un arc paramétré de classe $\mathcal{C}^{2}$ de $\mathbb{R}^{n}$ dont aucun point n'est birégulier, c'est-à-dire tel que $f'(t)$ et $f''(t)$ soient liés pour tout $t$. Montrer que si $f$ est régulier, son support est contenu dans une droite. Montrer, à l'aide de la fonction $g$ de l'exercice 3, que ce n'est plus vrai si $f$ n'est pas supposé régulier.

    **3.** Prouver qu'un arc régulier de classe $\mathcal{C}^{2}$ de $\mathbb{R}^{2}$ est de courbure constante si et seulement si c'est un arc de cercle ou de droite. On pourra utiliser la courbure algébrique.

    **4.** Reprendre la question 3 dans $\mathbb{R}^{3}$ : un arc birégulier de classe $\mathcal{C}^{3}$ de courbure constante est-il un arc de cercle ? Montrer qu'il l'est si et seulement si de plus sa torsion est nulle.
  corrige: |
    **1.** Soit $(J, g)$ un paramétrage par longueur d'arc (cours, prop. 4). Si $k = \lVert g'' \rVert = 0$, $g$ est affine : $g(s) = g(s_{0}) + (s - s_{0})g'(s_{0})$, et l'arc est porté par une droite.

    **2.** Si $f$ est régulier et $f''$ colinéaire à $f'$, le cas d'égalité de l'inégalité de Cauchy-Schwarz donne
    $$\lVert f' \rVert^{2}\lVert f'' \rVert^{2} - \langle f', f'' \rangle^{2} = 0 ,$$
     donc $k = 0$ par la proposition 6, et la question 1 conclut. Sans régularité, posons $f(t) = (g(t), 0)$ pour $t \leq 0$ et $f(t) = (0, g(t))$ pour $t \geq 0$ : comme à l'exercice 3, $f$ est de classe $\mathcal{C}^{\infty}$ ; $f'(t)$ et $f''(t)$ sont portés par le même axe pour $t \neq 0$, et nuls en $0$, donc aucun point n'est birégulier. Pourtant le support, réunion des segments $[0, 1[ \times \{0\}$ et $\{0\} \times [0, 1[$, n'est contenu dans aucune droite.

    **3.** Un arc de cercle de rayon $r$ a pour courbure $\dfrac{1}{r}$, un arc de droite $0$. Réciproquement, soit un arc plan de courbure constante $c$. Si $c = 0$, c'est un arc de droite (question 1). Sinon, orientons-le : la courbure algébrique $k$ est continue et $|k| = c$, donc, par le théorème des valeurs intermédiaires, $k$ est constante, égale à $\varepsilon c$. Par la proposition 10, un relèvement $\theta$ de $g'$ vérifie $\theta' = \varepsilon c$, donc $g' = \mathrm{e}^{\mathrm{i}(\varepsilon cs + \theta_{0})}$ et
    $$g(s) = z_{0} + \frac{\mathrm{e}^{\mathrm{i}(\varepsilon cs + \theta_{0})}}{\mathrm{i}\varepsilon c} :$$
     *c'est un arc du cercle de centre $z_{0}$ et de rayon $\dfrac{1}{c}$.*

    **4.** Non : l'hélice circulaire a une courbure constante $\dfrac{a}{a^{2} + b^{2}}$ (exercice 14) sans être plane. Si de plus $T = 0$, l'arc est plan (cours, prop. 12) et la question 3 dans ce plan montre que c'est un arc de cercle ; la réciproque est claire.
- id: "l3-gd-01-10"
  feuille: "f-l3-gd-01"
  numero: 10
  partie: "Courbure, cercle osculateur, développée"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [courbure, cercle osculateur]
  noeuds: [cb-courbure-plane, cb-planes]
  notions: [courbure-courbe, parametree-longueur]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    **Le cercle osculateur, limite de cercles.** Soit $(J, g)$ un arc plan paramétré par longueur d'arc, de classe $\mathcal{C}^{3}$, et $m = g(0)$ un point où la courbure algébrique $k(0)$ n'est pas nulle. On note $R = \dfrac{1}{k(0)}$, $\vec{\tau} = g'(0)$, $\vec{\nu} = \mathrm{i}\vec{\tau}$ et $c = m + R\vec{\nu}$ le centre de courbure en $m$.

    **1.** Pour $s \neq 0$ voisin de $0$, montrer qu'il existe un unique cercle tangent en $m$ à l'arc et passant par $n = g(s)$, et que son centre tend vers $c$ quand $s \to 0$ : le cercle osculateur est la limite des cercles tangents en $m$ qui passent par un point voisin.

    **2.** Montrer de même que le cercle passant par trois points $g(s_{1})$, $g(s_{2})$, $g(s_{3})$ distincts tend vers le cercle osculateur lorsque $s_{1}, s_{2}, s_{3}$ tendent vers $0$. On pourra admettre que son centre $\omega$ est caractérisé par l'annulation, en trois points, de $\varphi_{\omega}(s) = \lVert g(s) - \omega \rVert^{2}$ moins une constante, et utiliser le théorème de Rolle.

    **3.** *Ordre de contact.* On pose $\varphi(s) = \lVert g(s) - c \rVert^{2} - R^{2}$. Montrer que $\varphi(0) = \varphi'(0) = \varphi''(0) = 0$ et que $\varphi'''(0) = -2Rk'(0)$. On dit que le cercle osculateur a avec l'arc un contact d'ordre au moins $3$, et d'ordre au moins $4$ exactement lorsque $k'(0) = 0$ ; un tel point s'appelle un *sommet*.

    **4.** On suppose $k(0) > 0$ et $k'(0) > 0$. Montrer que, pour $s > 0$ petit, $g(s)$ est strictement à l'intérieur du cercle osculateur en $m$ et, pour $s < 0$ petit, strictement à l'extérieur : en un point qui n'est pas un sommet, la courbe traverse son cercle osculateur.
  corrige: |
    On écrit $k = k(0)$ et l'on utilise le développement
    $$g(s) - m = s\vec{\tau} + \frac{k s^{2}}{2}\vec{\nu} + o(s^{2}) ,$$
     qui vient de $g''(0) = k\vec{\nu}$.

    **1.** Un cercle tangent en $m$ à l'arc a son centre sur la normale : $\omega = m + \lambda\vec{\nu}$. Il passe par $g(s)$ si et seulement si $\lVert g(s) - m - \lambda\vec{\nu} \rVert^{2} = \lambda^{2}$, c'est-à-dire $\lVert g(s) - m \rVert^{2} = 2\lambda\langle g(s) - m, \vec{\nu} \rangle$. Or
    $$\langle g(s) - m, \vec{\nu} \rangle = \frac{k s^{2}}{2} + o(s^{2})$$
     n'est pas nul pour $s \neq 0$ petit, d'où une unique solution 
    $$\lambda(s) = \frac{\lVert g(s) - m \rVert^{2}}{2\langle g(s) - m, \vec{\nu} \rangle} = \frac{s^{2} + o(s^{2})}{k s^{2} + o(s^{2})} \longrightarrow \frac{1}{k} = R ,$$
     et le centre tend vers $m + R\vec{\nu} = c$.

    **2.** Les trois points ne sont pas alignés pour $s_{1}, s_{2}, s_{3}$ petits : sinon, $u$ étant un vecteur unitaire normal à leur droite, $\sigma \mapsto \langle g(\sigma) - g(s_{1}), u \rangle$ s'annulerait trois fois, et le théorème de Rolle donnerait $\sigma_{1}$ et $\sigma_{3}$ voisins de $0$ avec $\langle \vec{\tau}(\sigma_{1}), u \rangle = 0$ et $k(\sigma_{3})\langle \vec{\nu}(\sigma_{3}), u \rangle = 0$, impossible puisque $\vec{\tau}(\sigma_{1})$ et $\vec{\nu}(\sigma_{3})$, voisins de $\vec{\tau}$ et $\vec{\nu}$, forment une base.

    Soit $\omega$ le centre et $r$ le rayon du cercle circonscrit, et $\varphi_{\omega}(\sigma) = \lVert g(\sigma) - \omega \rVert^{2} - r^{2}$, nulle en $s_{1}, s_{2}, s_{3}$. Par Rolle, $\varphi_{\omega}' = 2\langle \vec{\tau}, g - \omega \rangle$ s'annule en un $\sigma_{1}$ et $\varphi_{\omega}'' = 2k\langle \vec{\nu}, g - \omega \rangle + 2$ en un $\sigma_{3}$, tous deux entre $\mathop{\displaystyle \min} s_{i}$ et $\mathop{\displaystyle \max} s_{i}$. Le centre $\omega$ est donc solution du système linéaire 
    $$\langle \vec{\tau}(\sigma_{1}), \omega \rangle = \langle \vec{\tau}(\sigma_{1}), g(\sigma_{1}) \rangle, \qquad \langle \vec{\nu}(\sigma_{3}), \omega \rangle = \langle \vec{\nu}(\sigma_{3}), g(\sigma_{3}) \rangle + \frac{1}{k(\sigma_{3})} .$$
     Quand les $s_{i}$ tendent vers $0$, les coefficients tendent vers ceux du système $\langle \vec{\tau}, \omega \rangle = \langle \vec{\tau}, m \rangle$, $\langle \vec{\nu}, \omega \rangle = \langle \vec{\nu}, m \rangle + R$, de matrice inversible et de solution $c$. Par continuité de la solution d'un système de Cramer, $\omega \to c$, et le rayon $\lVert g(s_{1}) - \omega \rVert \to R$.

    **3.** $\varphi' = 2\langle \vec{\tau}, g - c \rangle$, $\varphi'' = 2k\langle \vec{\nu}, g - c \rangle + 2$ et, puisque $\vec{\nu}' = -k\vec{\tau}$ dans le plan, 
    $$\varphi''' = 2k'\langle \vec{\nu}, g - c \rangle - 2k^{2}\langle \vec{\tau}, g - c \rangle + 2k\langle \vec{\nu}, \vec{\tau} \rangle = 2k'\langle \vec{\nu}, g - c \rangle - 2k^{2}\langle \vec{\tau}, g - c \rangle .$$
     En $0$, $g - c = -R\vec{\nu}$ : $\varphi(0) = 0$, $\varphi'(0) = 0$, $\varphi''(0) = -2kR + 2 = 0$ et $\boxed{\varphi'''(0) = -2Rk'(0)}$.

    **4.** Par la formule de Taylor,
    $$\varphi(s) = -\frac{Rk'(0)}{3}s^{3} + o(s^{3}) ,$$
     du signe de $-s$ si $k'(0) > 0$. Or $\varphi(s) < 0$ signifie que $g(s)$ est strictement à l'intérieur du cercle osculateur : c'est le cas pour $s > 0$ petit, et le point est à l'extérieur pour $s < 0$ petit.

    ![Figure](documents/figures/dcbd993a67c5c0d2.svg)

    L'arc $y = \dfrac{x^{2}}{2} + \dfrac{x^{3}}{3}$ (en bleu), pour lequel $k(0) = 1$ et $k'(0) = 2$, et son cercle osculateur en $m = 0$ (en violet). La courbure croît dans le sens du parcours : à droite de $m$, l'arc tourne plus vite que le cercle et passe à l'intérieur ; à gauche, il est à l'extérieur. L'arc traverse son cercle osculateur, contrairement à une tangente ordinaire qui reste d'un seul côté.
- id: "l3-gd-01-11"
  feuille: "f-l3-gd-01"
  numero: 11
  partie: "Courbure, cercle osculateur, développée"
  etoiles: 3
  types: [Problème, Démonstration, Calcul]
  mots_cles: [courbure, cercle osculateur]
  noeuds: [cb-courbure-plane, cb-planes]
  notions: [courbure-courbe, parametree-longueur]
  source: "Bordeaux 2016, feuille 2, exercices 3 et 9"
  page_enonce: 4
  page_corrige: 10
  enonce: |
    **Développée et développantes.** Soit $(J, g)$ un arc plan orienté, paramétré par longueur d'arc, de classe $\mathcal{C}^{3}$, de courbure algébrique $k$ qui ne s'annule pas. On note $\vec{\tau} = g'$, $\vec{\nu} = \mathrm{i}\vec{\tau}$, $R = \dfrac{1}{k}$ le rayon de courbure algébrique et $e(s) = g(s) + R(s)\vec{\nu}(s)$ le centre de courbure ; la courbe $e$ s'appelle la *développée* de $g$.

    **1.** Montrer que $e'(s) = R'(s)\vec{\nu}(s)$. En déduire que $e$ est régulière aux points qui ne sont pas des sommets ($k' \neq 0$), que la tangente à la développée en $e(s)$ est la normale à $g$ en $g(s)$, et que la longueur de la développée entre $e(s_{1})$ et $e(s_{2})$ vaut $|R(s_{2}) - R(s_{1})|$ s'il n'y a pas de sommet entre $s_{1}$ et $s_{2}$.

    **2.** *La parabole.* Soit $\mathcal{P}$ la parabole d'équation $y^{2} = 2px$ ($p > 0$) et $\mathcal{D}$ sa directrice $x = -\dfrac{p}{2}$. Pour $M \in \mathcal{P}$, la normale à $\mathcal{P}$ en $M$ coupe $\mathcal{D}$ en un point $P$. Exprimer le rayon de courbure de $\mathcal{P}$ en $M$ en fonction de $MP$. Déterminer et dessiner la développée de $\mathcal{P}$.

    **3.** *Développantes.* Réciproquement, une courbe $D$ étant donnée, paramétrée par longueur d'arc par $e$, on appelle *développante* de $D$ toute courbe dont $D$ est la développée. Montrer que les courbes $h_{\lambda}(\sigma) = e(\sigma) + (\lambda - \sigma)e'(\sigma)$, $\lambda \in \mathbb{R}$, sont des développantes de $D$ là où elles sont régulières (on interprétera : un fil tendu qui se déroule). Déterminer les développantes d'un cercle et dessiner l'une d'elles.

    **4.** *Théorème de Tait-Kneser.* On suppose $k > 0$ et $k' > 0$ sur $J$ (un arc sans sommet). En utilisant la question 1, montrer que, pour $s_{1} < s_{2}$, la distance des centres $\lVert e(s_{1}) - e(s_{2}) \rVert$ est strictement inférieure à $R(s_{1}) - R(s_{2})$. En déduire que le cercle osculateur en $g(s_{2})$ est contenu à l'intérieur du cercle osculateur en $g(s_{1})$ : les cercles osculateurs d'un arc sans sommet sont emboîtés, et deux d'entre eux ne se coupent jamais.

    **5.** *Dans l'espace.* Soit maintenant $\Gamma$ un arc de $\mathbb{R}^{3}$ paramétré par longueur d'arc, de classe $\mathcal{C}^{4}$, de courbure constante $k > 0$ et de torsion $T$ qui ne s'annule pas. On note $\Gamma_{1}$ la courbe $s \mapsto C(s) = g(s) + \dfrac{1}{k}\vec{\nu}(s)$ décrite par ses centres de courbure. Montrer que $\Gamma_{1}$ est birégulière, de courbure constante $k$, que son trièdre de Frenet vaut $\vec{\tau}_{1} = \varepsilon\vec{\beta}$, $\vec{\nu}_{1} = -\vec{\nu}$, $\vec{\beta}_{1} = \varepsilon\vec{\tau}$ avec $\varepsilon = \pm 1$, et calculer sa torsion. Que dire de $\Gamma_{1}$ si la torsion de $\Gamma$ est de plus constante ?
  corrige: |
    **1.** Dans le plan, $\vec{\nu}' = \mathrm{i}\vec{\tau}' = \mathrm{i}(k\vec{\nu}) = -k\vec{\tau}$. Donc 
    $$e' = \vec{\tau} + R'\vec{\nu} + R\vec{\nu}' = \vec{\tau} + R'\vec{\nu} - Rk\vec{\tau} = \boxed{R'\vec{\nu}} .$$
     La développée est régulière là où $R' = -\dfrac{k'}{k^{2}}$ ne s'annule pas, c'est-à-dire hors des sommets. Sa tangente en $e(s)$ est dirigée par $\vec{\nu}(s)$ et passe par $e(s)$, qui est sur la normale à $g$ en $g(s)$ : c'est cette normale. Les normales à $g$ sont donc les tangentes à la développée, qui en est l'*enveloppe*. Enfin, s'il n'y a pas de sommet entre $s_{1}$ et $s_{2}$, $R'$ garde un signe constant et la longueur vaut
    $$\int_{s_{1}}^{s_{2}}|R'| = |R(s_{2}) - R(s_{1})| .$$

    **2.** Paramétrons $\mathcal{P}$ par $M(t) = \left(\dfrac{t^{2}}{2p}, t\right)$. Alors $M' = \left(\dfrac{t}{p}, 1\right)$, $M'' = \left(\dfrac{1}{p}, 0\right)$, $\det(M', M'') = -\dfrac{1}{p}$, et la proposition 11 donne le rayon de courbure $R = \dfrac{(p^{2} + t^{2})^{3/2}}{p^{2}}$. La normale en $M$ est dirigée par $(p, -t)$ ; elle coupe la directrice en $P = M + \lambda(p, -t)$ avec
    $$\frac{t^{2}}{2p} + \lambda p = -\frac{p}{2} ,$$
     soit $\lambda = -\dfrac{p^{2} + t^{2}}{2p^{2}}$, et
    $$MP = |\lambda|\sqrt{p^{2} + t^{2}} = \frac{(p^{2} + t^{2})^{3/2}}{2p^{2}} .$$
     Ainsi $\boxed{R = 2\,MP}$.

    Le centre de courbure, du côté de la concavité, est $e = M - 2(P - M)$, soit 
    $$e(t) = \left(p + \frac{3t^{2}}{2p}, \ -\frac{t^{3}}{p^{2}}\right) , \qquad\text{d'où}\qquad \boxed{27p\,y^{2} = 8(x - p)^{3}} .$$
     La développée de la parabole est une *parabole semi-cubique*, avec un rebroussement en $(p, 0)$, centre de courbure au sommet, qui est le seul sommet de la parabole.

    ![Figure](documents/figures/36174f1f3d49da26.svg)

    La parabole $y^{2} = 2x$ (en bleu), sa directrice (en tirets) et sa développée (en orange). Pour $M = (\dfrac{1}{2}, 1)$, la normale (en violet) coupe la directrice en $P = (-\dfrac{1}{2}, 2)$ et le centre de courbure est $e = (\dfrac{5}{2}, -1)$ : $M$ est entre $P$ et $e$, et $Me = 2MP = 2\sqrt{2}$. La normale est tangente à la développée en $e$.

    **3.** Avec $e$ paramétrée par longueur d'arc, de courbure algébrique $k_{D}$ et de normale $\vec{\nu}_{D}$,
    $$h_{\lambda}'(\sigma) = e' - e' + (\lambda - \sigma)e'' = (\lambda - \sigma)k_{D}(\sigma)\vec{\nu}_{D}(\sigma) :$$
     $h_{\lambda}$ est régulière pour $\sigma \neq \lambda$ et $k_{D}(\sigma) \neq 0$, de tangente dirigée par $\vec{\nu}_{D}$. Sa normale en $h_{\lambda}(\sigma)$ est donc dirigée par $e'(\sigma)$, et c'est la tangente à $D$ en $e(\sigma)$.

    Sa vitesse est $|\lambda - \sigma||k_{D}|$ et son vecteur tangent unitaire $\pm\vec{\nu}_{D}$, de dérivée $\mp k_{D}e'$ : la courbure vaut
    $$\frac{|k_{D}|}{|\lambda - \sigma||k_{D}|} = \frac{1}{|\lambda - \sigma|} ,$$
     et le centre de courbure, à cette distance sur la normale du côté de $e(\sigma)$, est $h_{\lambda}(\sigma) - (\lambda - \sigma)e'(\sigma) = e(\sigma)$. $D$ est la développée de $h_{\lambda}$. Un fil de longueur $\lambda$ enroulé sur $D$ depuis $e(0)$ et déroulé en restant tendu a son extrémité en $h_{\lambda}(\sigma)$ : la partie déroulée, de longueur $\lambda - \sigma$, est tangente à $D$ en $e(\sigma)$.

    Pour le cercle unité $e(\sigma) = \mathrm{e}^{\mathrm{i}\sigma}$, $e' = \mathrm{i}\mathrm{e}^{\mathrm{i}\sigma}$ et les développantes sont
    $$\boxed{h_{\lambda}(\sigma) = \big(1 + \mathrm{i}(\lambda - \sigma)\big)\mathrm{e}^{\mathrm{i}\sigma}} ,$$
     qui se déduisent les unes des autres par rotation.

    ![Figure](documents/figures/aab6de913a75e7e8.svg)

    Le cercle unité (en orange) et sa développante issue du point $1$ (en bleu, $\lambda = 0$, $\sigma \in [0 ; 1{,}7\pi]$). En $\sigma = \dfrac{\pi}{2}$, le fil déroulé (en violet), de longueur $\dfrac{\pi}{2}$, est tangent au cercle en $\mathrm{i}$, et son extrémité (en rouge) est sur la développante. C'est le profil des dents d'engrenage, qui roulent l'une sur l'autre sans glisser.

    **4.** Comme $k > 0$ et $k' > 0$, $R' < 0$ ne s'annule pas et $e$ est régulière. Pour $s_{1} < s_{2}$, l'exercice 2 donne
    $$\lVert e(s_{1}) - e(s_{2}) \rVert \leq \int_{s_{1}}^{s_{2}}\lVert e' \rVert = R(s_{1}) - R(s_{2}) ,$$
     avec égalité seulement si $e$ décrit un segment, c'est-à-dire si $\vec{\nu}$ est constant, ce qui est exclu puisque $\vec{\nu}' = -k\vec{\tau} \neq 0$. Donc $\lVert e(s_{1}) - e(s_{2}) \rVert < R(s_{1}) - R(s_{2})$. Pour $x$ dans le disque fermé de centre $e(s_{2})$ et de rayon $R(s_{2})$, 
    $$\lVert x - e(s_{1}) \rVert \leq \lVert x - e(s_{2}) \rVert + \lVert e(s_{2}) - e(s_{1}) \rVert < R(s_{2}) + R(s_{1}) - R(s_{2}) = R(s_{1}) :$$
     *le disque osculateur en $g(s_{2})$ est dans le disque ouvert osculateur en $g(s_{1})$.* Les cercles osculateurs d'un arc sans sommet sont emboîtés et disjoints, alors que chacun touche la courbe : c'est le théorème de Tait (1896) et Kneser (1912), conséquence frappante de l'exercice 10, où l'on a vu que la courbe traverse chacun de ses cercles osculateurs.

    ![Figure](documents/figures/9e63c1d477c3e1e5.svg)

    Un arc de la spirale $\rho = \mathrm{e}^{0{,}4\,\theta}$, $\theta \in [0 ; 3{,}6]$ (en bleu), dont la courbure décroît le long du parcours, et trois de ses cercles osculateurs (en violet), aux points rouges $\theta = 0{,}8$, $2$ et $3{,}2$. Ils sont emboîtés : chacun est contenu dans le suivant, sans le toucher.

    **5.** Avec $\vec{\nu}' = -k\vec{\tau} - T\vec{\beta}$ et $k$ constant, 
    $$C' = \vec{\tau} + \frac{1}{k}\vec{\nu}' = -\frac{T}{k}\vec{\beta} ,$$
     de norme $\dfrac{|T|}{k} \neq 0$ : $\Gamma_{1}$ est régulière, et $\vec{\tau}_{1} = \varepsilon\vec{\beta}$ avec $\varepsilon = -\operatorname{signe}(T)$, constant puisque $T$ ne s'annule pas. Notons $\sigma$ l'abscisse curviligne de $\Gamma_{1}$, avec
    $$\frac{\mathrm{d}\sigma}{\mathrm{d} s} = \frac{|T|}{k} .$$
     Alors 
    $$\frac{\mathrm{d}\vec{\tau}_{1}}{\mathrm{d}\sigma} = \varepsilon T\vec{\nu}\cdot\frac{k}{|T|} = -k\vec{\nu} :$$
     $\Gamma_{1}$ est birégulière, de courbure $k$, et $\vec{\nu}_{1} = -\vec{\nu}$, puis $\vec{\beta}_{1} = \vec{\tau}_{1} \wedge \vec{\nu}_{1} = -\varepsilon\,\vec{\beta} \wedge \vec{\nu} = \varepsilon\vec{\tau}$.

    Enfin
    $$\frac{\mathrm{d}\vec{\beta}_{1}}{\mathrm{d}\sigma} = \varepsilon k\vec{\nu}\cdot\frac{k}{|T|} = -\frac{\varepsilon k^{2}}{|T|}\vec{\nu}_{1} ,$$
     d'où 
    $$\boxed{T_{1} = -\frac{\varepsilon k^{2}}{|T|} = \frac{k^{2}}{T}}, \qquad T\,T_{1} = k^{2} .$$
     Si $T$ est constante, $\Gamma$ et $\Gamma_{1}$ ont courbure et torsion constantes : ce sont des hélices circulaires (théorème 3 et exercice 14). Pour l'hélice de rayon $a$ et de pas $2\pi b$, le calcul donne une hélice de même axe et de rayon $\dfrac{b^{2}}{a}$, dont $\Gamma$ est à son tour le lieu des centres de courbure.
