  enonce: |
    **Courbes sphériques.**

    **1.** Soit $(I, \gamma)$ un arc régulier de classe $\mathcal{C}^{1}$ de $\mathbb{R}^{n}$. On note $N(t)$ l'hyperplan affine passant par $\gamma(t)$ et orthogonal à $\gamma'(t)$. Montrer que $\gamma(I)$ est contenu dans une sphère de centre $0$ si et seulement si $0 \in N(t)$ pour tout $t \in I$.

    **2.** Soit $(J, g)$ un arc birégulier de $\mathbb{R}^{3}$, paramétré par longueur d'arc, de classe $\mathcal{C}^{4}$, de torsion $T$ ne s'annulant pas, et $R = \dfrac{1}{k}$ son rayon de courbure. On suppose que $g(J)$ est contenu dans une sphère de centre $\omega$ et de rayon $r$. En dérivant trois fois $\lVert g - \omega \rVert^{2}$, montrer que 
    $$g(s) - \omega = -R\,\vec{\nu} + \frac{R'}{T}\,\vec{\beta} \qquad\text{et}\qquad r^{2} = R^{2} + \left(\frac{R'}{T}\right)^{2}.$$

    **3.** Réciproquement, on suppose que $R^{2} + \left(\dfrac{R'}{T}\right)^{2}$ est une constante $r^{2}$, et que $R' \neq 0$. Montrer que $\omega(s) = g(s) + R\,\vec{\nu} - \dfrac{R'}{T}\vec{\beta}$ est constant, et conclure.

    **4.** *Sphère osculatrice.* Sans hypothèse de sphère, on appelle sphère osculatrice en $g(s)$ la sphère de centre $\omega(s)$ défini à la question 3 passant par $g(s)$. Montrer que c'est l'unique sphère dont le centre $c$ vérifie $\psi(s) = \psi'(s) = \psi''(s) = \psi'''(s) = 0$ pour $\psi(\sigma) = \lVert g(\sigma) - c \rVert^{2} - \lVert g(s) - c \rVert^{2}$ : c'est la sphère qui « colle » le mieux à la courbe.

    **5.** *Torsion totale d'une courbe sphérique fermée.* On suppose $g$ périodique de période $L$, contenue dans une sphère de rayon $r$, et $T \neq 0$. Montrer qu'il existe une fonction continue $\varphi$ telle que $R = r\cos\varphi$ et $\dfrac{R'}{T} = r\sin\varphi$, à valeurs dans $\left]{-\dfrac{\pi}{2}}, \dfrac{\pi}{2}\right[$, puis que $\varphi' = -T$. En déduire que $\mathop{\displaystyle \int_{0}^{L}}T(s)\,\mathrm{d} s = 0$.
  corrige: |
    **1.** $0 \in N(t)$ s'écrit $\langle 0 - \gamma(t), \gamma'(t) \rangle = 0$, c'est-à-dire $\dfrac{\mathrm{d}}{\mathrm{d} t}\lVert \gamma(t) \rVert^{2} = 0$. Sur l'intervalle $I$, cela équivaut à la constance de $\lVert \gamma \rVert$, donc à $\gamma(I)$ contenu dans une sphère de centre $0$.

    **2.** Notons $x = g - \omega$, avec $\lVert x \rVert^{2} = r^{2}$. En dérivant : $\langle \vec{\tau}, x \rangle = 0$. Puis $1 + k\langle \vec{\nu}, x \rangle = 0$, soit $\langle \vec{\nu}, x \rangle = -R$. Puis, avec $\vec{\nu}' = -k\vec{\tau} - T\vec{\beta}$ : $\langle \vec{\nu}, \vec{\tau} \rangle - k\langle \vec{\tau}, x \rangle - T\langle \vec{\beta}, x \rangle = -R'$, soit $\langle \vec{\beta}, x \rangle = \dfrac{R'}{T}$. Dans la base orthonormée de Frenet : 
    $$\boxed{g - \omega = -R\,\vec{\nu} + \frac{R'}{T}\,\vec{\beta}}, \qquad r^{2} = R^{2} + \left(\frac{R'}{T}\right)^{2} .$$

    **3.** En dérivant
    $$R^{2} + \left(\frac{R'}{T}\right)^{2} = r^{2} :$$

    $$R'\left(R + \frac{1}{T}\left(\frac{R'}{T}\right)'\right) = 0 ,$$
     d'où, comme $R' \neq 0$, $\left(\dfrac{R'}{T}\right)' = -RT$. Alors 
    $$\omega' = \vec{\tau} + R'\vec{\nu} + R(-k\vec{\tau} - T\vec{\beta}) - \left(\frac{R'}{T}\right)'\vec{\beta} - R'\vec{\nu} = -RT\vec{\beta} + RT\vec{\beta} = 0 .$$
     $\omega$ est constant, et
    $$\lVert g - \omega \rVert^{2} = R^{2} + \left(\frac{R'}{T}\right)^{2} = r^{2} :$$
     *la courbe est tracée sur la sphère de centre $\omega$ et de rayon $r$.*

    **4.** Les dérivées de $\psi$ en $s$ sont celles de $\lVert g - c \rVert^{2}$ : les mêmes calculs qu'à la question 2 montrent que $\psi'(s) = \psi''(s) = \psi'''(s) = 0$ équivaut à $\langle \vec{\tau}, g - c \rangle = 0$, $\langle \vec{\nu}, g - c \rangle = -R$ et $\langle \vec{\beta}, g - c \rangle = \dfrac{R'}{T}$ en $s$ (la troisième dérivée vaut $2k'\langle \vec{\nu}, g - c \rangle - 2kT\langle \vec{\beta}, g - c \rangle$ une fois les deux premières conditions utilisées, et $-\dfrac{k'R}{k} = R'$). Ces trois conditions déterminent
    $$c = g(s) + R\vec{\nu} - \frac{R'}{T}\vec{\beta} = \omega(s)$$
     de façon unique, et $\psi(s) = 0$ est automatique. La sphère osculatrice a donc avec la courbe un contact d'ordre au moins $4$ ; c'est l'analogue, dans l'espace, du cercle osculateur de l'exercice 10.

    **5.** D'après la question 2, $\dfrac{R}{r}$ et $\dfrac{R'}{rT}$ sont continues, de somme des carrés $1$, et $\dfrac{R}{r} > 0$. La fonction $\varphi = \arcsin\dfrac{R'}{rT}$, à valeurs dans $\left]{-\dfrac{\pi}{2}}, \dfrac{\pi}{2}\right[$ puisque $\left|\dfrac{R'}{rT}\right| < 1$, convient :
    $$\cos\varphi = \sqrt{1 - \sin^{2}\varphi} = \frac{R}{r} .$$
     Elle est de classe $\mathcal{C}^{1}$ ($g$ étant de classe $\mathcal{C}^{4}$, $\dfrac{R'}{T}$ est $\mathcal{C}^{1}$).

    En dérivant $r\sin\varphi = \dfrac{R'}{T}$ et en utilisant la relation $\left(\dfrac{R'}{T}\right)' = -RT$, valable sur une sphère (elle découle de la dérivée de $\langle \vec{\beta}, x \rangle$) : 
    $$r\cos\varphi\,\varphi' = -RT = -r\cos\varphi\,T , \qquad\text{d'où}\qquad \varphi' = -T$$
     puisque $\cos\varphi > 0$. La fonction $\varphi$ est $L$-périodique, comme $R$, $R'$ et $T$, donc
    $$\boxed{\int_{0}^{L}T = \varphi(0) - \varphi(L) = 0} .$$
     Le résultat reste vrai sans supposer $T \neq 0$ (théorème de Segre), avec une démonstration plus délicate.
