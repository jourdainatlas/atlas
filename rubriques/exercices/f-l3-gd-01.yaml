  enonce: |
    **Courbure d'une courbe définie par une équation.** Soit $F : \mathbb{R}^{2} \to \mathbb{R}$ de classe $\mathcal{C}^{2}$, et $p$ un point de $C = \{F = 0\}$ où $\nabla F(p) \neq 0$.

    **1.** Justifier qu'au voisinage de $p$, $C$ est le support d'un arc régulier de classe $\mathcal{C}^{2}$. Montrer que sa courbure en $p$ vaut 
    $$k = \frac{\big|F_{xx}F_{y}^{2} - 2F_{xy}F_{x}F_{y} + F_{yy}F_{x}^{2}\big|}{\left(F_{x}^{2} + F_{y}^{2}\right)^{3/2}} ,$$
     les dérivées partielles étant prises en $p$. On pourra supposer $F_{y}(p) \neq 0$ et écrire $C$ comme un graphe $y = \varphi(x)$ près de $p$.

    **2.** Trouver le rayon de courbure à l'origine de la courbe d'équation 
    $$x^{15} - y^{13} + x^{3}y^{4} + x^{2} - y^{2} + x + 199\,y = 0 .$$
  corrige: |
    **1.** Supposons $F_{y}(p) \neq 0$. Par le théorème des fonctions implicites, il existe des voisinages $I$ de $x_{p}$ et $W$ de $p$ et $\varphi : I \to \mathbb{R}$ de classe $\mathcal{C}^{2}$ tels que $C \cap W$ soit le graphe de $\varphi$ ; c'est le support de l'arc régulier $x \mapsto (x, \varphi(x))$. En dérivant $F(x, \varphi(x)) = 0$ une fois puis deux fois : 
    $$F_{x} + F_{y}\varphi' = 0, \qquad F_{xx} + 2F_{xy}\varphi' + F_{yy}\varphi'^{2} + F_{y}\varphi'' = 0 ,$$
     d'où $\varphi' = -\dfrac{F_{x}}{F_{y}}$ et
    $$\varphi'' = -\frac{F_{xx}F_{y}^{2} - 2F_{xy}F_{x}F_{y} + F_{yy}F_{x}^{2}}{F_{y}^{3}} .$$
     L'exercice 7 donne alors 
    $$k = \frac{|\varphi''|}{(1 + \varphi'^{2})^{3/2}} = \frac{|F_{xx}F_{y}^{2} - 2F_{xy}F_{x}F_{y} + F_{yy}F_{x}^{2}|}{|F_{y}|^{3}}\cdot\frac{|F_{y}|^{3}}{(F_{y}^{2} + F_{x}^{2})^{3/2}} ,$$
     qui est la formule annoncée. Elle est symétrique en $x$ et $y$, donc vaut aussi lorsque $F_{x}(p) \neq 0$.

    **2.** En $0$, seuls comptent les termes de degré au plus $2$ : les monômes $x^{15}$, $y^{13}$, $x^{3}y^{4}$ ont toutes leurs dérivées d'ordre au plus $2$ nulles en $0$. On trouve $F_{x} = 1$, $F_{y} = 199$, $F_{xx} = 2$, $F_{xy} = 0$, $F_{yy} = -2$, donc 
    $$R = \frac{(1 + 199^{2})^{3/2}}{|2 \cdot 199^{2} - 2|} = \frac{39\,602^{3/2}}{79\,200} = \frac{19\,801\sqrt{39\,602}}{39\,600} \approx \boxed{99{,}51} .$$
     Les termes de haut degré ne sont que des leurres : la courbure ne dépend que du développement à l'ordre $2$ de $F$.
- id: "l3-gd-01-09"
  feuille: "f-l3-gd-01"
