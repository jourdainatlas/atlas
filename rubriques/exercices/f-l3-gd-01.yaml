  enonce: |
    **Calculs de trièdres de Frenet.** Déterminer le trièdre de Frenet, la courbure et la torsion des arcs suivants, avec la convention $\vec{\beta}' = T\vec{\nu}$ du cours ; on utilisera la proposition 13 du cours, et l'on vérifiera le résultat par les relations de Frenet.

    **1.** $c(s) = \left(\dfrac{1}{2}\sin s, \ \sin^{2}\dfrac{s}{2}, \ \dfrac{\sqrt{3}}{2}s\right)$, $s \in \mathbb{R}$, dont on montrera d'abord qu'il est paramétré par longueur d'arc, et dont on reconnaîtra la nature ;

    **2.** $(a\cos t, a\sin t, bt)$, $t \in [0, 2\pi]$, avec $a > 0$ et $b \neq 0$ ;

    **3.** $\left(t, \dfrac{t^{2}}{2}, \dfrac{t^{3}}{6}\right)$, $t \in \mathbb{R}$ ;

    **4.** $(\mathrm{e}^{t}, \mathrm{e}^{-t}, \sqrt{2}\,t)$, $t \in \mathbb{R}$.

    Comparer, dans les deux derniers cas, la courbure et la torsion.
  corrige: |
    **1.** Le vecteur
    $$c'(s) = \left(\frac{1}{2}\cos s, \frac{1}{2}\sin s, \frac{\sqrt{3}}{2}\right)$$
     est de norme $1$. Comme
    $$\sin^{2}\frac{s}{2} = \frac{1 - \cos s}{2} ,$$

    $$c(s) = \left(0, \frac{1}{2}, 0\right) + \frac{1}{2}(\sin s, -\cos s, 0) + \left(0, 0, \frac{\sqrt{3}}{2}s\right) :$$
     *une hélice circulaire de rayon $\dfrac{1}{2}$,* d'axe vertical passant par $(0, \dfrac{1}{2}, 0)$.

    Puis
    $$\vec{\tau}' = \left(-\frac{1}{2}\sin s, \frac{1}{2}\cos s, 0\right) ,$$
     donc 
    $$k = \frac{1}{2}, \quad \vec{\nu} = (-\sin s, \cos s, 0), \quad \vec{\beta} = \vec{\tau} \wedge \vec{\nu} = \left(-\frac{\sqrt{3}}{2}\cos s, -\frac{\sqrt{3}}{2}\sin s, \frac{1}{2}\right), \quad \vec{\beta}' = -\frac{\sqrt{3}}{2}\vec{\nu} ,$$
     d'où $\boxed{T = -\dfrac{\sqrt{3}}{2}}$. La normale principale pointe vers l'axe, et la torsion est négative pour une hélice qui monte en tournant dans le sens direct, avec la convention du cours.

    **2.** Avec $v = \sqrt{a^{2} + b^{2}}$ : $\vec{\tau} = \dfrac{1}{v}(-a\sin t, a\cos t, b)$, $\vec{\nu} = (-\cos t, -\sin t, 0)$, $\vec{\beta} = \dfrac{1}{v}(b\sin t, -b\cos t, a)$, et $k = \dfrac{a}{a^{2} + b^{2}}$, $T = -\dfrac{b}{a^{2} + b^{2}}$. Pour $a = \dfrac{1}{2}$, $b = \dfrac{\sqrt{3}}{2}$, on retrouve la question 1.

    **3.** $f' = (1, t, \dfrac{t^{2}}{2})$, de norme $\dfrac{t^{2} + 2}{2}$, $f'' = (0, 1, t)$, $f''' = (0, 0, 1)$,
    $$f' \wedge f'' = \left(\frac{t^{2}}{2}, -t, 1\right) ,$$
     de norme $\dfrac{t^{2} + 2}{2}$, et $\det(f', f'', f''') = 1$. Donc 
    $$\vec{\tau} = \frac{(2, 2t, t^{2})}{t^{2} + 2}, \ \ \vec{\beta} = \frac{(t^{2}, -2t, 2)}{t^{2} + 2}, \ \ \vec{\nu} = \vec{\beta} \wedge \vec{\tau} = \frac{(-2t, 2 - t^{2}, 2t)}{t^{2} + 2}, \qquad \boxed{k = \frac{4}{(t^{2} + 2)^{2}} = -T}.$$

    **4.** Le vecteur $f' = (\mathrm{e}^{t}, -\mathrm{e}^{-t}, \sqrt{2})$ a pour norme $2\operatorname{ch}t$ ; $f'' = (\mathrm{e}^{t}, \mathrm{e}^{-t}, 0)$, $f''' = (\mathrm{e}^{t}, -\mathrm{e}^{-t}, 0)$ ; $f' \wedge f'' = \sqrt{2}(-\mathrm{e}^{-t}, \mathrm{e}^{t}, \sqrt{2})$, de norme
    $$\lVert f' \wedge f'' \rVert = 2\sqrt{2}\operatorname{ch}t ,$$
     et $\det(f', f'', f''') = -2\sqrt{2}$. Donc 
    $$\vec{\tau} = \frac{(\mathrm{e}^{t}, -\mathrm{e}^{-t}, \sqrt{2})}{2\operatorname{ch}t}, \qquad \vec{\beta} = \frac{(-\mathrm{e}^{-t}, \mathrm{e}^{t}, \sqrt{2})}{2\operatorname{ch}t}, \qquad \vec{\nu} = \left(\frac{1}{\sqrt{2}\operatorname{ch}t}, \frac{1}{\sqrt{2}\operatorname{ch}t}, -\operatorname{th}t\right),$$

    $$\boxed{k = T = \frac{\sqrt{2}}{4\operatorname{ch}^{2}t}} .$$
     Dans les deux derniers cas, le rapport $\dfrac{T}{k}$ est constant ($-1$ et $1$) sans que $k$ et $T$ le soient : l'exercice 15 montrera que ce sont des hélices.
