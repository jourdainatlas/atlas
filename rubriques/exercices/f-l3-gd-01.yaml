  enonce: |
    **Courbes convexes et fonction support.** Soit $C$ une courbe plane fermée de classe $\mathcal{C}^{3}$, de longueur $L$, paramétrée positivement par longueur d'arc par une fonction $L$-périodique $g$, de courbure algébrique $k > 0$ en tout point et d'indice de rotation $1$ (exercice 18). On note $u(t) = (\cos t, \sin t)$.

    **1.** Soit $\theta$ un relèvement de $g'$. Montrer que $\theta$ est un $\mathcal{C}^{1}$-difféomorphisme de $[0, L]$ sur un intervalle de longueur $2\pi$. En déduire que $C$ admet un paramétrage $f : \mathbb{R} \to \mathbb{R}^{2}$, $2\pi$-périodique, de classe $\mathcal{C}^{2}$, tel que la normale extérieure en $f(t)$ soit dirigée par $u(t)$, c'est-à-dire $f'(t)$ positivement colinéaire à $u'(t)$.

    **2.** On pose $p(t) = \langle f(t), u(t) \rangle$, la *fonction support* de $C$. Montrer que la tangente à $C$ en $f(t)$ a pour équation $x\cos t + y\sin t - p(t) = 0$, et que $f(t) = p(t)u(t) + p'(t)u'(t)$.

    **3.** Montrer que le rayon de courbure en $f(t)$ vaut $p(t) + p''(t)$, et que $L = \mathop{\displaystyle \int_{0}^{2\pi}} p(t)\,\mathrm{d} t$. On admettra que l'aire du domaine limité par $C$ vaut $\dfrac{1}{2}\mathop{\displaystyle \int_{0}^{2\pi}}\det(f, f')\,\mathrm{d} t$, et l'on en déduira qu'elle vaut $\dfrac{1}{2}\mathop{\displaystyle \int_{0}^{2\pi}}\left(p^{2} - p'^{2}\right)\mathrm{d} t$.

    **4.** *Courbes de largeur constante.* Soit $h > 8$ et $p(t) = h + \cos 3t$. Montrer que $f = pu + p'u'$ définit une courbe vérifiant les hypothèses de l'exercice, et que la distance entre ses deux tangentes parallèles de normales $u(t)$ et $-u(t)$ vaut $2h$ pour tout $t$. Calculer sa longueur, et la comparer à celle du cercle de diamètre $2h$.
  corrige: |
    **1.** $\theta' = k > 0$ : $\theta$ est strictement croissante, de classe $\mathcal{C}^{1}$ à dérivée non nulle, donc un $\mathcal{C}^{1}$-difféomorphisme de $[0, L]$ sur $[\theta(0), \theta(0) + 2\pi]$ (indice $1$). Comme $\theta(s + L) = \theta(s) + 2\pi$, $\theta$ est une bijection croissante de $\mathbb{R}$ sur $\mathbb{R}$, de classe $\mathcal{C}^{2}$ puisque $k$ est de classe $\mathcal{C}^{1}$. Posons
    $$f(t) = g\big(\theta^{-1}(t + \frac{\pi}{2})\big) :$$
     $f$ est $2\pi$-périodique, de classe $\mathcal{C}^{2}$, et 
    $$f'(t) = \frac{g'(\theta^{-1}(t + \frac{\pi}{2}))}{k} = \frac{\mathrm{e}^{\mathrm{i}(t + \pi/2)}}{k} = \frac{u'(t)}{k} .$$
     La normale $u(t) = -\mathrm{i} u'(t)$ est extérieure : pour une courbe parcourue dans le sens direct avec $k > 0$, la courbe tourne vers $\vec{\nu} = \mathrm{i}\vec{\tau}$, qui pointe vers l'intérieur.

    **2.** La tangente en $f(t)$ passe par $f(t)$ et est orthogonale à $u(t)$ : c'est la droite d'équation $\langle X, u(t) \rangle = p(t)$, puisque $\langle f(t), u(t) \rangle = p(t)$. Comme $\langle f', u \rangle = 0$, $p' = \langle f, u' \rangle$, et la base $(u, u')$ étant orthonormée, on obtient $\boxed{f = pu + p'u'}$.

    **3.** En dérivant, avec $u'' = -u$ : $f' = p'u + pu' + p''u' - p'u = (p + p'')u'$. La vitesse vaut donc $p + p'' = \dfrac{1}{k}$, le rayon de courbure. Puis
    $$L = \int_{0}^{2\pi}(p + p'') = \int_{0}^{2\pi}p ,$$
     car $p'$ est périodique. Enfin $\det(f, f') = \det(pu + p'u', (p + p'')u') = p(p + p'')$, et une intégration par parties ($\mathop{\displaystyle \int} pp'' = -\mathop{\displaystyle \int} p'^{2}$) donne l'aire
    $$\frac{1}{2}\int_{0}^{2\pi}(p^{2} - p'^{2}) .$$

    **4.** $p + p'' = h - 8\cos 3t \geq h - 8 > 0$ : $f = pu + p'u'$ est régulière, $f' = (p + p'')u'$ a pour relèvement $t + \dfrac{\pi}{2}$, d'où une courbure algébrique $\dfrac{1}{p + p''} > 0$ et un indice $1$, et $\langle f, u \rangle = p$ : $p$ est sa fonction support. Les tangentes de normales $u(t)$ et $-u(t) = u(t + \pi)$ ont pour équations $\langle X, u(t) \rangle = p(t)$ et $\langle X, u(t) \rangle = -p(t + \pi)$ ; leur distance vaut 
    $$p(t) + p(t + \pi) = 2h + \cos 3t + \cos(3t + 3\pi) = \boxed{2h}.$$
     La longueur vaut
    $$\int_{0}^{2\pi}p = 2\pi h = \pi\cdot 2h ,$$
     comme le cercle de diamètre $2h$ : c'est le théorème de Barbier, toutes les courbes de largeur constante $\ell$ ont pour longueur $\pi\ell$.

    ![Figure](documents/figures/b7dbbde052283ce7.svg)

    La courbe de largeur constante de fonction support $p = 9 + \cos 3t$ (en bleu), entre deux tangentes parallèles (en violet) distantes de $2h = 18$, et, en pointillés, le cercle de même diamètre. Elle n'est pas un cercle, mais roule entre deux droites parallèles sans les quitter, comme une roue ronde.
