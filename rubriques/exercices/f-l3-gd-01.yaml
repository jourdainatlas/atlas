  enonce: |
    **La ligne droite est le plus court chemin.** Soit $(I, f)$ un arc paramétré de classe $\mathcal{C}^{1}$ de $\mathbb{R}^{n}$ et $[a, b] \subset I$. On note $L$ la longueur de l'arc entre $f(a)$ et $f(b)$.

    **1.** Montrer que $L \geq \lVert f(b) - f(a) \rVert$. On pourra, si $f(b) \neq f(a)$, considérer le vecteur unitaire $u = \dfrac{f(b) - f(a)}{\lVert f(b) - f(a) \rVert}$ et la fonction $t \mapsto \langle f(t), u \rangle$.

    **2.** Étudier le cas d'égalité, en supposant l'arc régulier : montrer que $L = \lVert f(b) - f(a) \rVert$ si et seulement si $f([a, b])$ est le segment $[f(a), f(b)]$, parcouru de façon monotone. En déduire que le plus court chemin entre deux points de $\mathbb{R}^{n}$, parmi les arcs réguliers qui les joignent, est le segment.
  corrige: |
    **1.** Si $f(b) = f(a)$, il n'y a rien à montrer. Sinon, posons $\varphi(t) = \langle f(t), u \rangle$. Par Cauchy-Schwarz, $\varphi'(t) = \langle f'(t), u \rangle \leq \lVert f'(t) \rVert$, donc 
    $$\lVert f(b) - f(a) \rVert = \langle f(b) - f(a), u \rangle = \int_{a}^{b}\varphi'(t)\,\mathrm{d} t \leq \int_{a}^{b}\lVert f'(t) \rVert\,\mathrm{d} t = L .$$

    **2.** Si l'arc est régulier, $L > 0$ ; supposons $L = \lVert f(b) - f(a) \rVert$, donc $f(b) \neq f(a)$. La fonction continue positive $\lVert f' \rVert - \langle f', u \rangle$ est d'intégrale nulle sur $[a, b]$, donc nulle : $\langle f'(t), u \rangle = \lVert f'(t) \rVert$, cas d'égalité de Cauchy-Schwarz, qui donne $f'(t) = \lVert f'(t) \rVert u$. Alors $f(t) = f(a) + \lambda(t)u$ avec
    $$\lambda(t) = \int_{a}^{t}\lVert f' \rVert$$
     strictement croissante de $0$ à $L$ : $f([a, b])$ est le segment $[f(a), f(b)]$, parcouru de façon monotone.

    La réciproque est immédiate. *Le segment est donc le seul plus court chemin régulier* entre deux points. Pour les arcs tracés sur une surface, la même question mène aux géodésiques du chapitre 4.
