  enonce: |
    **Hélices, théorème de Lancret.** Soit $(J, g)$ un arc birégulier de $\mathbb{R}^{3}$, paramétré par longueur d'arc, de classe $\mathcal{C}^{3}$, de courbure $k$ et de torsion $T$ ne s'annulant pas.

    **1.** Montrer l'équivalence des quatre propriétés suivantes :

    **(a)** il existe un vecteur unitaire $u$ tel que l'angle $(\vec{\tau}, u)$ soit constant ;

    **(b)** il existe un vecteur non nul $u$ orthogonal à $\vec{\nu}(s)$ pour tout $s$ ;

    **(c)** il existe un vecteur unitaire $u$ tel que l'angle $(\vec{\beta}, u)$ soit constant ;

    **(d)** le quotient $\dfrac{T}{k}$ est constant.

    Pour (d) $\Rightarrow$ (b), on cherchera $u$ sous la forme $\cos\alpha\,\vec{\tau} + \sin\alpha\,\vec{\beta}$.

    **2.** Sous ces conditions, montrer que $g$ s'écrit $g(s) = h(s) + \lambda(s - s_{0})u$, où $h$ est une courbe plane contenue dans un plan orthogonal à $u$ et $\lambda$ une constante : on dit que $g$ est une *hélice*, tracée sur le cylindre de base $h$.

    **3.** Vérifier que l'hélice circulaire de l'exercice 14 et l'arc $(\mathrm{e}^{t}, \mathrm{e}^{-t}, \sqrt{2}\,t)$ sont des hélices, et déterminer dans chaque cas la direction $u$.
  corrige: |
    **1.** On utilise $\langle \vec{\tau}, u \rangle' = k\langle \vec{\nu}, u \rangle$, $\langle \vec{\beta}, u \rangle' = T\langle \vec{\nu}, u \rangle$, avec $k \neq 0$ et $T \neq 0$. (a) $\Leftrightarrow$ (b) : l'angle $(\vec{\tau}, u)$ est constant si et seulement si $\langle \vec{\tau}, u \rangle$ l'est, si et seulement si $\langle \vec{\nu}, u \rangle = 0$ (quitte à normer $u$). (b) $\Leftrightarrow$ (c) : de même avec $\langle \vec{\beta}, u \rangle$ et $T \neq 0$. (b) $\Rightarrow$ (d) : si $u \perp \vec{\nu}$, $u = \alpha\vec{\tau} + \beta\vec{\beta}$ avec $\alpha = \langle u, \vec{\tau} \rangle$ et $\beta = \langle u, \vec{\beta} \rangle$ constants d'après ce qui précède ; en dérivant, $0 = (\alpha k + \beta T)\vec{\nu}$.

    Si $\beta = 0$, alors $\alpha k = 0$, donc $\alpha = 0$ et $u = 0$, exclu ; donc
    $$\frac{T}{k} = -\frac{\alpha}{\beta}$$
     est constant. (d) $\Rightarrow$ (b) : si $\dfrac{T}{k} = c$, choisissons $\alpha$ tel que $\cos\alpha + c\sin\alpha = 0$ et posons $u = \cos\alpha\,\vec{\tau} + \sin\alpha\,\vec{\beta}$. Alors $u' = k(\cos\alpha + c\sin\alpha)\vec{\nu} = 0$ : $u$ est un vecteur unitaire constant, orthogonal à $\vec{\nu}$.

    **2.** Soit $\lambda = \langle \vec{\tau}, u \rangle$, constant, et $h(s) = g(s) - \lambda(s - s_{0})u$. Alors
    $$\langle h(s) - h(s_{0}), u \rangle = \int_{s_{0}}^{s}\big(\langle \vec{\tau}, u \rangle - \lambda\big) = 0 :$$
     $h$ est contenue dans le plan passant par $g(s_{0})$ orthogonal à $u$, et $g = h + \lambda(s - s_{0})u$ monte à vitesse constante le long de $u$ sur le cylindre de base $h$.

    **3.** Pour l'hélice circulaire, $u = (0, 0, 1)$ et $\langle \vec{\tau}, u \rangle = \dfrac{b}{\sqrt{a^{2} + b^{2}}}$. Pour $(\mathrm{e}^{t}, \mathrm{e}^{-t}, \sqrt{2}\,t)$, $\dfrac{T}{k} = 1$ : on prend $\alpha = -\dfrac{\pi}{4}$, et les formules de l'exercice 14 donnent 
    $$u = \frac{\vec{\tau} - \vec{\beta}}{\sqrt{2}} = \frac{1}{\sqrt{2}}\cdot\frac{(\mathrm{e}^{t} + \mathrm{e}^{-t}, -\mathrm{e}^{-t} - \mathrm{e}^{t}, 0)}{2\operatorname{ch}t} = \boxed{\frac{(1, -1, 0)}{\sqrt{2}}},$$
     avec $\langle \vec{\tau}, u \rangle = \dfrac{1}{\sqrt{2}}$ : la tangente fait un angle constant de $\dfrac{\pi}{4}$ avec la direction horizontale $(1, -1, 0)$.

    La projection de la courbe sur le plan orthogonal à $u$ est $g - \langle g, u \rangle u = (\operatorname{ch}t, \operatorname{ch}t, \sqrt{2}\,t)$, puisque $\langle g, u \rangle = \sqrt{2}\operatorname{sh}t$ : dans le repère orthonormé $\left(\dfrac{(1, 1, 0)}{\sqrt{2}}, (0, 0, 1)\right)$ de ce plan, c'est la courbe
    $$X = \sqrt{2}\operatorname{ch}\frac{Z}{\sqrt{2}} ,$$
     une chaînette. La courbe est tracée sur le cylindre de base cette chaînette.
