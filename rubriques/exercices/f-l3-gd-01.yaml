  enonce: |
    **L'ellipse et les quatre sommets.** On considère la courbe $f : t \in \mathbb{R} \mapsto (a\cos t, b\sin t) \in \mathbb{R}^{2}$, où $0 < a < b$.

    **1.** Montrer que $f$ est régulière.

    **2.** Calculer la courbure algébrique $k(t)$ de $f$. Déterminer ses valeurs extrêmes, et les points où elles sont atteintes.

    **3.** Montrer qu'il existe exactement quatre valeurs de $t$ modulo $2\pi$ pour lesquelles $k'(t) = 0$. Dessiner l'ellipse, ces quatre points, qu'on appelle ses *sommets*, et les cercles osculateurs en ces points.

    **4.** Le *théorème des quatre sommets*, que l'on admettra, affirme que toute courbe fermée simple régulière de classe $\mathcal{C}^{3}$ possède au moins quatre sommets. Justifier sans ce théorème qu'une courbe fermée régulière de classe $\mathcal{C}^{3}$ en possède toujours au moins deux.

    **5.** Montrer que le limaçon $\rho = 1 + 2\cos\theta$ de l'exercice 18 a pour courbure $k(\theta) = \dfrac{3(3 + 2\cos\theta)}{(5 + 4\cos\theta)^{3/2}}$, et qu'il n'a que deux sommets. Pourquoi cela ne contredit-il pas le théorème des quatre sommets ?
  corrige: |
    **1.** $f'(t) = (-a\sin t, b\cos t)$ ne s'annule pas, puisque $\sin t$ et $\cos t$ ne s'annulent pas en même temps.

    **2.** $f'' = (-a\cos t, -b\sin t)$, $\det(f', f'') = ab$, et 
    $$\boxed{k(t) = \frac{ab}{(a^{2}\sin^{2}t + b^{2}\cos^{2}t)^{3/2}}}.$$
     Le dénominateur s'écrit $D = a^{2} + (b^{2} - a^{2})\cos^{2}t \in [a^{2}, b^{2}]$. Le maximum $\dfrac{b}{a^{2}}$ est atteint pour $\cos t = 0$, aux extrémités $(0, \pm b)$ du grand axe ; le minimum $\dfrac{a}{b^{2}}$ pour $\sin t = 0$, aux extrémités $(\pm a, 0)$ du petit axe. L'ellipse tourne le plus vite là où elle est la plus pointue.

    **3.** $k'(t) = -\dfrac{3}{2}ab\,D^{-5/2}D'$ avec $D' = -(b^{2} - a^{2})\sin 2t$ : $k'(t) = 0$ si et seulement si $\sin 2t = 0$, c'est-à-dire $t \in \{0, \dfrac{\pi}{2}, \pi, \dfrac{3\pi}{2}\}$ modulo $2\pi$. L'ellipse a exactement quatre sommets, les extrémités de ses axes.

    ![Figure](documents/figures/da235730d9461521.svg)

    L'ellipse $a = 1$, $b = 1{,}6$ (en bleu), ses quatre sommets (en rouge) et ses cercles osculateurs en ces points (en violet), de rayons $\dfrac{a^{2}}{b} = 0{,}625$ et $\dfrac{b^{2}}{a} = 2{,}56$. Aux sommets, le contact est d'ordre $4$ (exercice 10) : l'ellipse ne traverse pas ces cercles et reste du même côté.

    **4.** $k$ est continue et $L$-périodique : elle atteint son maximum et son minimum, en des points où $k' = 0$. Si $k$ n'est pas constante, ces points sont distincts ; sinon, tous les points sont des sommets. Il y a donc toujours au moins deux sommets. Le théorème des quatre sommets (Mukhopadhyaya, 1909, pour les courbes convexes ; Kneser, 1912, en général) dit qu'il y en a toujours deux de plus.

    **5.** Avec $\rho = 1 + 2\cos\theta$, $\rho' = -2\sin\theta$, $\rho'' = -2\cos\theta$, la proposition 11 donne $\rho^{2} + 2\rho'^{2} - \rho\rho'' = 9 + 6\cos\theta$ et $\rho^{2} + \rho'^{2} = 5 + 4\cos\theta$, d'où la formule. Posons $c = \cos\theta$ : 
    $$\frac{\mathrm{d}}{\mathrm{d} c}\left[(3 + 2c)(5 + 4c)^{-3/2}\right] = (5 + 4c)^{-5/2}\big(2(5 + 4c) - 6(3 + 2c)\big) = -(5 + 4c)^{-5/2}(8 + 4c) < 0 ,$$
     donc $k'(\theta) = -\sin\theta\,\dfrac{\mathrm{d} k}{\mathrm{d} c}$ ne s'annule que pour $\sin\theta = 0$ : deux sommets seulement, en $\theta = 0$ (point $(3, 0)$, courbure minimale $\dfrac{5}{9}$) et $\theta = \pi$ (point $(1, 0)$, courbure maximale $3$). Le limaçon se recoupe en l'origine, où passent ses deux boucles : il n'est pas simple, et le théorème ne s'applique pas. L'hypothèse de simplicité est donc indispensable.

