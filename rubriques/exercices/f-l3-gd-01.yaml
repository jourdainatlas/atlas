  enonce: |
    **Indice de rotation de la tangente.** Soit $f : \mathbb{R} \to \mathbb{C}$ une courbe fermée régulière de classe $\mathcal{C}^{2}$, de période $L > 0$. D'après la proposition 10 du cours, il existe $\theta : \mathbb{R} \to \mathbb{R}$ continue telle que $\dfrac{f'}{\lVert f' \rVert} = \mathrm{e}^{\mathrm{i}\theta}$.

    **1.** Montrer que $\theta(t + L) - \theta(t)$ est un multiple de $2\pi$ indépendant de $t$ et de la fonction $\theta$ choisie. On appelle *indice de rotation* de $f$ l'entier $\dfrac{\theta(L) - \theta(0)}{2\pi}$. Montrer que, si $f$ est paramétrée par longueur d'arc, il vaut $\dfrac{1}{2\pi}\mathop{\displaystyle \int_{0}^{L}} k(s)\,\mathrm{d} s$.

    **2.** Calculer l'indice de rotation des courbes suivantes, après en avoir tracé l'allure :

    **(a)** le cercle parcouru $p$ fois, $f(t) = \mathrm{e}^{\mathrm{i} pt}$, $p \in \mathbb{Z}^{*}$, sur une période $2\pi$ ;

    **(b)** l'ellipse $f(t) = (a\cos t, b\sin t)$, où $a, b > 0$ ;

    **(c)** la lemniscate de Gerono $f(t) = (\sin t, \sin t\cos t)$, en forme de huit ;

    **(d)** le limaçon $\rho = 1 + 2\cos\theta$, qui possède une boucle intérieure.

    **3.** *Lien avec le chapitre 5.* Montrer que l'indice de rotation est l'indice par rapport à $0$ du lacet $f'$, qui est tracé dans $\mathbb{R}^{2} \setminus \{0\}$, c'est-à-dire $\dfrac{1}{2\pi}\mathop{\displaystyle \int_{f'}}\omega$, où $\omega = \dfrac{-y\,\mathrm{d} x + x\,\mathrm{d} y}{x^{2} + y^{2}}$.
  corrige: |
    **1.** $\theta(t + L)$ et $\theta(t)$ sont deux relèvements du même vecteur unitaire, puisque $f'$ est $L$-périodique ; leur différence, continue et à valeurs dans $2\pi\mathbb{Z}$, est constante. Deux relèvements diffèrent d'une constante, donc la différence ne dépend pas du relèvement choisi. Par longueur d'arc, $\theta' = k$ (proposition 10), et
    $$\theta(L) - \theta(0) = \int_{0}^{L}k .$$

    **2.** (a) $f'(t) = \mathrm{i} p\,\mathrm{e}^{\mathrm{i} pt}$, de relèvement $pt + \dfrac{\pi}{2}$ (pour $p > 0$) ou $pt - \dfrac{\pi}{2}$ : indice $p$. (b) $f' = (-a\sin t, b\cos t)$ fait un tour dans le sens direct autour de $0$ : indice $1$. (c) $f'(t) = (\cos t, \cos 2t) = (x, 2x^{2} - 1)$ avec $x = \cos t$. Quand $t$ va de $0$ à $2\pi$, $x$ va de $1$ à $-1$ puis revient à $1$ : le vecteur $f'$ parcourt un arc de la parabole $y = 2x^{2} - 1$, qui ne passe pas par $0$, puis le reparcourt en sens inverse.

    Son relèvement revient à sa valeur initiale : indice $0$. (d) Pour $f = \rho\,\mathrm{e}^{\mathrm{i}\theta}$, $f' = (\rho' + \mathrm{i}\rho)\mathrm{e}^{\mathrm{i}\theta}$, et l'argument de $f'$ est $\theta + \arg(\rho' + \mathrm{i}\rho)$. Ici $\rho' + \mathrm{i}\rho = -2\sin\theta + \mathrm{i}(1 + 2\cos\theta)$ décrit, dans le sens direct, le cercle de centre $\mathrm{i}$ et de rayon $2$, qui entoure $0$ : son argument augmente de $2\pi$, comme $\theta$. Indice $2$. Le calcul numérique de $\dfrac{1}{2\pi}\mathop{\displaystyle \int} k$ confirme ces valeurs.

    ![Figure](documents/figures/1703422adb2ba73a.svg)

    Les quatre courbes et leur indice de rotation. Sur le huit (c), la tangente tourne dans un sens sur une boucle et dans l'autre sur la seconde, d'où l'indice nul ; sur le limaçon (d), elle fait deux tours, un pour la grande boucle et un pour la boucle intérieure.

    **3.** Écrivons $f' = |f'|\mathrm{e}^{\mathrm{i}\theta}$ avec $|f'|$ et $\theta$ de classe $\mathcal{C}^{1}$. Pour $c = r\mathrm{e}^{\mathrm{i}\theta}$, $x = r\cos\theta$, $y = r\sin\theta$, on calcule $x y' - y x' = r^{2}\theta'$, donc le tiré en arrière de $\omega$ par $c$ est $\theta'(t)\,\mathrm{d} t$ (c'est le calcul $P^{*}\omega = \mathrm{d}\theta$ du chapitre 5, section 5.6), et 
    $$\frac{1}{2\pi}\int_{f'}\omega = \frac{1}{2\pi}\int_{0}^{L}\theta'(t)\,\mathrm{d} t = \frac{\theta(L) - \theta(0)}{2\pi} .$$
     L'indice de rotation est l'indice du lacet $f'$ autour de $0$ ; l'invariance par homotopie du chapitre 5 (théorème 5) montre qu'il ne change pas quand on déforme $f$ en restant parmi les courbes fermées régulières, ce qui est le point de départ du théorème de Whitney-Graustein.
