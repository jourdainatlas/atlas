  enonce: |
    **Tangente géométrique.** Soit $(I, f)$ un arc paramétré continu de $\mathbb{R}^{n}$, $t_{0} \in I$ et $p = f(t_{0})$. On suppose que $f(t) \neq p$ pour $t \neq t_{0}$ voisin de $t_{0}$. On dit que l'arc admet une *tangente géométrique* en $p$ s'il existe un vecteur unitaire $v$ tel que $\dfrac{f(t) - p}{\lVert f(t) - p \rVert}$ ait une limite à droite et une limite à gauche en $t_{0}$, égales à $v$ ou à $-v$ ; la tangente est alors la droite passant par $p$ dirigée par $v$.

    **1.** Montrer que si $f$ est de classe $\mathcal{C}^{1}$ et $f'(t_{0}) \neq 0$, cette définition coïncide avec celle du cours.

    **2.** On suppose que $f$ est développable en série entière au voisinage de $t_{0}$ et n'est pas constante. Montrer, à l'aide d'un développement limité, que l'arc admet une tangente géométrique en $p$. Que se passe-t-il pour $f(t) = (t^{2}, t^{3})$ en $t_{0} = 0$ ?

    **3.** Soit $g : \mathbb{R} \to \mathbb{R}$ définie par $g(t) = \mathrm{e}^{-1/t^{2}}$ si $t \neq 0$ et $g(0) = 0$, que l'on sait être de classe $\mathcal{C}^{\infty}$. Montrer que l'arc défini par $f(t) = (g(t), -g(t))$ si $t < 0$ et $f(t) = (g(t), g(t))$ si $t \geq 0$ est de classe $\mathcal{C}^{\infty}$, mais n'admet pas de tangente géométrique en $0$. Dessiner son support.

    **4.** *Tangente, limite des cordes.* On revient à un arc régulier de classe $\mathcal{C}^{1}$. Montrer que, lorsque $t$ et $t'$ tendent vers $t_{0}$ avec $t \neq t'$, le vecteur unitaire de la corde $\dfrac{f(t') - f(t)}{\lVert f(t') - f(t) \rVert}$ tend vers $\pm \dfrac{f'(t_{0})}{\lVert f'(t_{0}) \rVert}$, le signe étant celui de $t' - t$. On pourra écrire $f(t') - f(t) = (t' - t)\mathop{\displaystyle \int_{0}^{1}} f'(t + u(t' - t))\,\mathrm{d} u$.
  corrige: |
    **1.** Si $f'(t_{0}) \neq 0$, $f(t) - p = (t - t_{0})\big(f'(t_{0}) + \varepsilon(t)\big)$ avec $\varepsilon(t) \to 0$, donc $f(t) \neq p$ pour $t \neq t_{0}$ voisin et 
    $$\frac{f(t) - p}{\lVert f(t) - p \rVert} = \operatorname{signe}(t - t_{0})\,\frac{f'(t_{0}) + \varepsilon(t)}{\lVert f'(t_{0}) + \varepsilon(t) \rVert} \longrightarrow \pm\frac{f'(t_{0})}{\lVert f'(t_{0}) \rVert} .$$
     La limite à droite est $v = \dfrac{f'(t_{0})}{\lVert f'(t_{0}) \rVert}$, la limite à gauche $-v$ : la tangente géométrique existe et c'est la droite $p + \mathbb{R} f'(t_{0})$ du cours.

    **2.** Écrivons
    $$f(t) - p = \sum_{j \geq 1} a_{j}(t - t_{0})^{j}$$
     et soit $m$ le plus petit indice tel que $a_{m} \neq 0$, qui existe puisque $f$ n'est pas constante (au voisinage de $t_{0}$). Alors $f(t) - p = (t - t_{0})^{m}\big(a_{m} + O(t - t_{0})\big)$ ne s'annule pas pour $t \neq t_{0}$ voisin, et 
    $$\frac{f(t) - p}{\lVert f(t) - p \rVert} \longrightarrow \frac{a_{m}}{\lVert a_{m} \rVert} \ \text{à droite}, \qquad (-1)^{m}\frac{a_{m}}{\lVert a_{m} \rVert} \ \text{à gauche} .$$
     *La tangente géométrique existe et est dirigée par $a_{m}$.* Pour $f(t) = (t^{2}, t^{3})$, $m = 2$ et $a_{2} = (1, 0)$ : les deux limites valent $(1, 0)$, et la tangente au point singulier $0$ est l'axe $Ox$. La courbe arrive sur l'origine et en repart dans la même direction : c'est un point de rebroussement.

    **3.** Toutes les dérivées de $g$ sont nulles en $0$ ; chaque composante de $f$ vaut $\pm g$ de chaque côté de $0$, avec des dérivées de tous ordres nulles en $0$ des deux côtés, donc $f$ est de classe $\mathcal{C}^{\infty}$. Pour $t > 0$,
    $$\frac{f(t)}{\lVert f(t) \rVert} = \frac{(1, 1)}{\sqrt{2}} ;$$
     pour $t < 0$, $\dfrac{(1, -1)}{\sqrt{2}}$. Ces deux vecteurs ne sont ni égaux ni opposés : *il n'y a pas de tangente géométrique en $0$.* Le support est la réunion des segments $\{(x, x)\}$ et $\{(x, -x)\}$, $0 \leq x < 1$ : un « V » couché ouvert vers la droite, dont la pointe est en $0$. Un paramétrage très régulier peut donc décrire un coin : c'est que $f'(0) = 0$, et la proposition sur la tangente suppose le point régulier.

    **4.** Avec l'écriture proposée,
    $$\frac{f(t') - f(t)}{t' - t} = \int_{0}^{1}f'(t + u(t' - t))\,\mathrm{d} u ,$$
     qui tend vers $f'(t_{0})$ quand $t, t' \to t_{0}$ par continuité uniforme de $f'$ au voisinage de $t_{0}$. Ce vecteur est donc non nul pour $t, t'$ voisins de $t_{0}$, et 
    $$\frac{f(t') - f(t)}{\lVert f(t') - f(t) \rVert} = \operatorname{signe}(t' - t)\,\frac{\frac{f(t') - f(t)}{t' - t}}{\lVert \frac{f(t') - f(t)}{t' - t} \rVert} \ \longrightarrow \ \pm\frac{f'(t_{0})}{\lVert f'(t_{0}) \rVert} .$$
     Ce résultat est plus fort que celui du cours : les deux extrémités de la corde bougent, et pas seulement l'une d'elles.
