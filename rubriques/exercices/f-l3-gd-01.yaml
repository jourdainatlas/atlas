  enonce: |
    **Équations intrinsèques.** D'après le théorème 1 du cours, une courbe plane paramétrée par longueur d'arc est déterminée, à un déplacement près, par sa courbure algébrique $s \mapsto k(s)$. Déterminer, et dessiner, les courbes planes dont le rayon de courbure algébrique $R = \dfrac{1}{k}$ vérifie :

    **1.** $R(s)^{2} + s^{2} = 1$ et $R > 0$, pour $s \in \, ]{-1}, 1[$ ; on reconnaîtra un arc de cycloïde ;

    **2.** $R(s) = \dfrac{1}{s}$ pour $s > 0$, c'est-à-dire $k(s) = s$ : c'est la *clothoïde*, ou spirale de Cornu, que l'on exprimera à l'aide des intégrales de Fresnel $\mathop{\displaystyle \int_{0}^{s}}\cos\dfrac{u^{2}}{2}\,\mathrm{d} u$ et $\mathop{\displaystyle \int_{0}^{s}}\sin\dfrac{u^{2}}{2}\,\mathrm{d} u$ ; on admettra que ces intégrales ont pour limite $\dfrac{\sqrt{\pi}}{2}$ quand $s \to +\infty$, et l'on dira vers quel point la courbe s'enroule ;

    **3.** $R(s) = \lambda s$ pour $s > 0$, où $\lambda > 0$ est fixé ; on comparera avec l'exercice 5.

    *Pour la petite histoire* : la clothoïde, dont la courbure croît proportionnellement à la distance parcourue, sert à raccorder une ligne droite à un virage dans les tracés routiers et ferroviaires.
  corrige: |
    D'après le théorème 1, si $k$ est continue, les courbes cherchées sont, à un déplacement près,
    $$g(s) = \int_{s_{0}}^{s}\mathrm{e}^{\mathrm{i}\theta(u)}\,\mathrm{d} u$$
     avec $\theta' = k$.

    **1.** $k = \dfrac{1}{\sqrt{1 - s^{2}}}$, donc $\theta = \arcsin s$. Le changement de variable $s = \sin\theta$, $\theta \in \, ]{-\dfrac{\pi}{2}}, \dfrac{\pi}{2}[$, donne 
    $$g = \int\mathrm{e}^{\mathrm{i}\theta}\cos\theta\,\mathrm{d}\theta = \left(\frac{\theta}{2} + \frac{\sin 2\theta}{4}, \ \frac{\sin^{2}\theta}{2}\right) = \frac{1}{4}\left(\varphi + \sin\varphi, \ 1 - \cos\varphi\right), \quad \varphi = 2\theta \in \, ]{-\pi}, \pi[ .$$
     *C'est une arche de cycloïde de cercle générateur de rayon $\dfrac{1}{4}$,* retournée, les rebroussements en haut, en $\left(\pm\dfrac{\pi}{4}, \dfrac{1}{2}\right)$.

    On retrouve l'exercice 1 : avec $s$ compté depuis le sommet de l'arche, le rayon de courbure $4R\sin\dfrac{t}{2}$ et l'abscisse curviligne $4R\cos\dfrac{t}{2}$ vérifient $R_{\mathrm{c}}^{2} + s^{2} = 16R^{2} = 1$.

    **2.** $\theta = \dfrac{s^{2}}{2}$ et
    $$\boxed{g(s) = \left(\int_{0}^{s}\cos\frac{u^{2}}{2}\,\mathrm{d} u, \ \int_{0}^{s}\sin\frac{u^{2}}{2}\,\mathrm{d} u\right)} .$$
     Quand $s \to +\infty$, $g(s)$ tend vers
    $$\left(\frac{\sqrt{\pi}}{2}, \frac{\sqrt{\pi}}{2}\right) \approx (0{,}886 ; 0{,}886) :$$
     la courbure croissant indéfiniment, la courbe s'enroule autour de ce point en tours de plus en plus serrés. La branche $s < 0$ est symétrique par rapport à l'origine.

    **3.** $k = \dfrac{1}{\lambda s}$, $\theta = \dfrac{\ln s}{\lambda}$ et $g'(s) = s^{\mathrm{i}/\lambda}$, donc
    $$g(s) = \frac{s^{1 + \mathrm{i}/\lambda}}{1 + \mathrm{i}/\lambda}, \qquad |g(s)| = \frac{s}{\sqrt{1 + 1/\lambda^{2}}}, \qquad \arg g(s) = \frac{\ln s}{\lambda} - \arg\left(1 + \frac{\mathrm{i}}{\lambda}\right) .$$
     En éliminant $s$, $|g| = C\,\mathrm{e}^{\lambda\arg g}$ : *c'est une spirale logarithmique de paramètre $m = \lambda$,* conformément à la question 4 de l'exercice 5, où le rayon de courbure valait $ms$.

    ![Figure](documents/figures/a86ded0e286d7637.svg)

    À gauche, la clothoïde $k(s) = s$ pour $s \in [0 ; 5{,}5]$ (en bleu), qui part en ligne droite de l'origine et s'enroule autour du point $\left(\dfrac{\sqrt{\pi}}{2}, \dfrac{\sqrt{\pi}}{2}\right)$. À droite, l'arche de cycloïde retournée de la question 1 (en orange), de rayon de courbure $\sqrt{1 - s^{2}}$.
