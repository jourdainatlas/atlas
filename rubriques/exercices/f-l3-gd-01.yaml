  enonce: |
    **Hypocycloïdes, épicycloïdes.** Un cercle $\Gamma'$ de rayon $r > 0$ roule sans glisser sur un cercle fixe $\Gamma$ de centre $0$ et de rayon $R > 0$ ; on suit un point de $\Gamma'$ qui est en $R$ à l'instant initial. Lorsque $\Gamma'$ roule à l'intérieur de $\Gamma$ ($r < R$), le point décrit une *hypocycloïde* ; lorsqu'il roule à l'extérieur, une *épicycloïde*.

    **1.** Montrer que l'hypocycloïde est paramétrée par 
    $$h(t) = (R - r)\,\mathrm{e}^{\mathrm{i} t} + r\,\mathrm{e}^{-\mathrm{i}\frac{R - r}{r}t}, \qquad t \in \mathbb{R},$$
     où $t$ est l'angle polaire du centre de $\Gamma'$, et donner de même un paramétrage de l'épicycloïde.

    **2.** Déterminer les points singuliers de $h$. On suppose $\dfrac{R}{r} = q$ entier, $q \geq 3$ : montrer que la courbe est fermée et possède exactement $q$ points de rebroussement, et en tracer l'allure pour $q = 3$ et $q = 4$.

    **3.** Pour $q = 4$, montrer que $h(t) = R(\cos^{3}t, \sin^{3}t)$ : c'est l'*astroïde*. Calculer sa longueur totale.

    **4.** Toujours pour $q$ entier, calculer la longueur d'une arche de l'hypocycloïde, entre deux points de rebroussement consécutifs, puis sa longueur totale. Que se passe-t-il si $\dfrac{R}{r}$ est rationnel non entier ? irrationnel (on se contentera de décrire le phénomène) ?
  corrige: |
    **1.** Le centre de $\Gamma'$ décrit le cercle de rayon $R - r$ : il est en $(R - r)\mathrm{e}^{\mathrm{i} t}$, et le point de contact en $R\mathrm{e}^{\mathrm{i} t}$, dans la direction $\mathrm{e}^{\mathrm{i} t}$ vue du centre. Sans glissement, les arcs parcourus sur $\Gamma$ et sur $\Gamma'$ ont la même longueur $Rt$ : vu du centre de $\Gamma'$, le point suivi, initialement dans la direction du contact, s'en est écarté de l'angle $-\dfrac{Rt}{r}$ (le petit cercle tourne en sens inverse).

    Sa direction est
    $$\mathrm{e}^{\mathrm{i}(t - Rt/r)} = \mathrm{e}^{-\mathrm{i}\frac{R - r}{r}t} ,$$
     d'où $h(t)$. Pour l'épicycloïde, le centre est en $(R + r)\mathrm{e}^{\mathrm{i} t}$, le contact dans la direction $-\mathrm{e}^{\mathrm{i} t}$, et l'on trouve 
    $$\boxed{e(t) = (R + r)\,\mathrm{e}^{\mathrm{i} t} - r\,\mathrm{e}^{\mathrm{i}\frac{R + r}{r}t}} ,$$
     qui vaut bien $R$ en $t = 0$.

    **2.** La dérivée
    $$h'(t) = \mathrm{i}(R - r)\left(\mathrm{e}^{\mathrm{i} t} - \mathrm{e}^{-\mathrm{i}\frac{R - r}{r}t}\right) = \mathrm{i}(R - r)\mathrm{e}^{\mathrm{i} t}\left(1 - \mathrm{e}^{-\mathrm{i}\frac{R}{r}t}\right)$$
     s'annule si et seulement si $\dfrac{R}{r}t \in 2\pi\mathbb{Z}$, c'est-à-dire aux instants où le point suivi touche $\Gamma$. Si $\dfrac{R}{r} = q$ est entier, $\dfrac{R - r}{r} = q - 1$ est entier, donc $h$ est $2\pi$-périodique, et les points singuliers sur une période sont les $t_{j} = \dfrac{2\pi j}{q}$, $0 \leq j < q$, en $R\,\mathrm{e}^{2\mathrm{i}\pi j/q}$.

    Ce sont des rebroussements : $|h(t)| \leq (R - r) + r = R$ avec égalité seulement en ces points, et
    $$h''(t_{j}) = -(R - r)\frac{R}{r}\mathrm{e}^{\mathrm{i} t_{j}}$$
     est radial, donc la courbe arrive sur le cercle $\Gamma$ et repart selon la même direction radiale. *L'hypocycloïde a exactement $q$ points de rebroussement.*

    ![Figure](documents/figures/9199541d340e4a08.svg)

    Les hypocycloïdes à trois et quatre rebroussements (en bleu), à l'intérieur du cercle fixe $\Gamma$ (en gris), avec le cercle roulant (en violet) et le point suivi (en rouge) à l'instant $t = 0{,}5$. Les rebroussements sont les points où le cercle roulant touche $\Gamma$ avec le point suivi.

    **3.** Pour $q = 4$, $r = \dfrac{R}{4}$ et
    $$h(t) = \frac{3R}{4}\mathrm{e}^{\mathrm{i} t} + \frac{R}{4}\mathrm{e}^{-3\mathrm{i} t} .$$
     Or $\cos^{3}t = \dfrac{3\cos t + \cos 3t}{4}$ et $\sin^{3}t = \dfrac{3\sin t - \sin 3t}{4}$, d'où $h(t) = R(\cos^{3}t, \sin^{3}t)$. Directement, $\lVert h'(t) \rVert = 3R|\sin t\cos t|$ et, par symétrie, la longueur vaut
    $$4\int_{0}^{\pi/2}3R\sin t\cos t\,\mathrm{d} t = \boxed{6R} .$$

    **4.** On a
    $$\lVert h'(t) \rVert = (R - r)\left|1 - \mathrm{e}^{-\mathrm{i}\frac{R}{r}t}\right| = 2(R - r)\left|\sin\frac{Rt}{2r}\right| ,$$
     donc une arche, $t \in [0, \dfrac{2\pi r}{R}]$, a pour longueur 
    $$\int_{0}^{2\pi r/R}2(R - r)\sin\frac{Rt}{2r}\,\mathrm{d} t = 2(R - r)\cdot\frac{2r}{R}\cdot 2 = \frac{8r(R - r)}{R} ,$$
     et la courbe entière, formée de $q = \dfrac{R}{r}$ arches, $\boxed{8(R - r)}$. Pour $q = 4$ on retrouve $8 \cdot \dfrac{3R}{4} = 6R$.

    Si
    $$\frac{R}{r} = \frac{q}{q'}$$
     avec $q' \geq 2$ premier avec $q$, la courbe se referme après $q'$ tours du centre ($t = 2\pi q'$) et présente encore $q$ rebroussements, en étoile. Si $\dfrac{R}{r}$ est irrationnel, elle ne se referme jamais, et l'on peut montrer qu'elle est dense dans la couronne $R - 2r \leq |z| \leq R$.
