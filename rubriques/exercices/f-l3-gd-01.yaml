- id: "l3-gd-01-01"
  feuille: "f-l3-gd-01"
  numero: 1
  partie: "Arcs paramétrés, tangente, longueur"
  etoiles: 1
  types: [Calcul]
  mots_cles: [arcs paramétrés]
  noeuds: [cb-courbes, cb-abscisse]
  notions: [courbe-parametree, courbe-reguliere, longueur-courbe]
  source: "Bordeaux 2016, feuille 1, exercice 1 ; Bordeaux 2016, feuille 2, exercice 1, question 3-a"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **La cycloïde.** On appelle cycloïde la trajectoire d'un point fixé d'un cercle qui roule sans glisser sur une droite.

    **1.** Un cercle de rayon $R > 0$ roule sans glisser sur l'axe $Ox$, au-dessus de lui, et le point suivi est à l'origine à l'instant initial. Montrer que la cycloïde décrite est paramétrée par $f(t) = R(t - \sin t, 1 - \cos t)$, $t \in \mathbb{R}$, où $t$ est l'angle dont le cercle a tourné. Vérifier que $f(t) = R(t + \mathrm{i} - \mathrm{i}\mathrm{e}^{-\mathrm{i} t})$ en notation complexe.

    **2.** Déterminer les points réguliers de cet arc et tracer son support.

    **3.** Calculer la longueur d'une arche, c'est-à-dire de l'arc $f(]0, 2\pi[)$.

    **4.** Calculer la courbure au point $f(t)$ pour $t \in \, ]0, 2\pi[$, et étudier son comportement lorsque $t$ tend vers $0$ ou vers $2\pi$.
  corrige: |
    **1.** Le cercle roule sans glisser : quand il a tourné de l'angle $t$, son point de contact a parcouru sur l'axe la longueur $Rt$ de l'arc déroulé, donc son centre est en $(Rt, R)$. Le point suivi, au contact à l'instant initial, a tourné de $t$ dans le sens indirect autour du centre (le cercle avance vers la droite) : il est en $(Rt, R) + R(-\sin t, -\cos t)$, d'où $f(t) = R(t - \sin t, 1 - \cos t)$. En complexe, $t + \mathrm{i} - \mathrm{i}\mathrm{e}^{-\mathrm{i} t} = t + \mathrm{i} - \mathrm{i}\cos t - \sin t$, qui est bien $f(t)/R$.

    **2.** $f'(t) = R(1 - \cos t, \sin t)$, de norme
    $$R\sqrt{2 - 2\cos t} = 2R\left|\sin\frac{t}{2}\right| .$$
     *Les points singuliers sont ceux de paramètre $t \in 2\pi\mathbb{Z}$,* où le point suivi touche l'axe : ce sont des points de rebroussement, la courbe arrivant verticalement sur l'axe et repartant verticalement.

    ![Figure](documents/figures/d9e2d6cd4091813c.svg)

    Deux arches de la cycloïde pour $R = 0{,}6$ (en bleu), avec le cercle roulant à l'instant $t = 2{,}2$ (en violet) et le point suivi (en rouge). Le point de contact du cercle avec l'axe est en $Rt$ : c'est la traduction de l'absence de glissement.

    **3.** Sur $]0, 2\pi[$, $\sin\dfrac{t}{2} > 0$, donc la longueur d'une arche vaut 
    $$\int_{0}^{2\pi} 2R\sin\frac{t}{2}\,\mathrm{d} t = 4R\left[-\cos\frac{t}{2}\right]_{0}^{2\pi} = \boxed{8R} .$$
     Elle ne fait pas intervenir $\pi$, alors que le cercle qui l'engendre a pour périmètre $2\pi R$ ; on retrouve la valeur $8$ de l'exemple du cours (section 1.4.1) pour $R = 1$.

    **4.** $f''(t) = R(\sin t, \cos t)$ et
    $$\det(f', f'') = R^{2}\big((1 - \cos t)\cos t - \sin^{2}t\big) = R^{2}(\cos t - 1) = -2R^{2}\sin^{2}\frac{t}{2} .$$
     Par la proposition 11, 
    $$k(t) = \frac{|\det(f', f'')|}{\lVert f' \rVert^{3}} = \frac{2R^{2}\sin^{2}\frac{t}{2}}{8R^{3}\sin^{3}\frac{t}{2}} = \boxed{\frac{1}{4R\sin\frac{t}{2}}} \qquad (0 < t < 2\pi) .$$
     La courbure est minimale au sommet de l'arche ($t = \pi$), où le rayon de courbure vaut $4R$, le double du diamètre du cercle roulant ; elle tend vers $+\infty$ aux points de rebroussement. On retrouvera le rayon de courbure $4R\sin\dfrac{t}{2}$ dans l'exercice 12.
