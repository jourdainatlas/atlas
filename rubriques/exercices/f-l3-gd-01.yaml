  enonce: |
    **Plan osculateur.**

    **1.** Déterminer les points biréguliers et le plan osculateur en ces points des arcs $(t^{2}, t^{3}, t^{4})$, $t \in \mathbb{R}$, et $(a\cos^{3}t, a\sin^{3}t, a\cos 2t)$, $t \in [0, 2\pi]$, où $a > 0$.

    **2.** *Le plan osculateur, limite de plans.* Soit $(I, f)$ un arc paramétré de $\mathbb{R}^{3}$ de classe $\mathcal{C}^{2}$, birégulier en $t$. Pour $s \neq t$ voisin de $t$, on note $P(s)$ le plan passant par $f(t)$ engendré par $f'(t)$ et $f(s) - f(t)$. Justifier que ces deux vecteurs sont indépendants pour $s$ voisin de $t$, puis montrer que le vecteur normal unitaire $\dfrac{f'(t) \wedge (f(s) - f(t))}{\lVert f'(t) \wedge (f(s) - f(t)) \rVert}$ de $P(s)$ tend, au signe près, vers un vecteur normal au plan osculateur. On dit que $P(s)$ tend vers le plan osculateur.
  corrige: |
    **1.** Pour $f(t) = (t^{2}, t^{3}, t^{4})$, $f' = (2t, 3t^{2}, 4t^{3})$, $f'' = (2, 6t, 12t^{2})$ et $f' \wedge f'' = 2t^{2}(6t^{2}, -8t, 3)$. Les points biréguliers sont ceux de paramètre $t \neq 0$, et le plan osculateur, normal à $(6t^{2}, -8t, 3)$ et passant par $f(t)$, a pour équation $\boxed{6t^{2}x - 8ty + 3z = t^{4}}$. En $t = 0$, $f'(0) = 0$ : le point n'est pas régulier.

    Pour le second arc, $f(t) = (a\cos^{3}t, a\sin^{3}t, a\cos 2t)$, et l'on trouve 
    $$f'(t) = a\sin t\cos t\,w(t), \qquad w(t) = (-3\cos t, 3\sin t, -4) ,$$
     où $\lVert w \rVert = 5$. L'arc est régulier pour $t \notin \dfrac{\pi}{2}\mathbb{Z}$. Alors $f'' = (a\sin t\cos t)'w + a\sin t\cos t\,w'$ et
    $$f' \wedge f'' = (a\sin t\cos t)^{2}\,w \wedge w' ,$$
     avec $w \wedge w' = (12\cos t, -12\sin t, -9) \neq 0$ : tous les points réguliers sont biréguliers, et le plan osculateur a pour équation 
    $$4\cos t\,x - 4\sin t\,y - 3z = \boxed{a\cos 2t} ,$$
     puisque $4a\cos^{4}t - 4a\sin^{4}t - 3a\cos 2t = 4a\cos 2t - 3a\cos 2t$. *Remarque.* Le vecteur unitaire tangent $\pm\dfrac{w}{5}$ fait un angle constant avec $Oz$ : c'est une hélice au sens de l'exercice 15.

    **2.** Par Taylor-Young,
    $$f(s) - f(t) = (s - t)f'(t) + \frac{(s - t)^{2}}{2}f''(t) + o((s - t)^{2}) ,$$
     donc 
    $$f'(t) \wedge \big(f(s) - f(t)\big) = \frac{(s - t)^{2}}{2}\big(f'(t) \wedge f''(t) + \varepsilon(s)\big), \qquad \varepsilon(s) \to 0 .$$
     Ce vecteur est non nul pour $s$ voisin de $t$, puisque $f'(t) \wedge f''(t) \neq 0$ : les deux vecteurs sont indépendants. Le vecteur normal unitaire de $P(s)$ tend vers $\dfrac{f'(t) \wedge f''(t)}{\lVert f'(t) \wedge f''(t) \rVert}$, normal au plan osculateur.
