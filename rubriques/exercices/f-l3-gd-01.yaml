  enonce: |
    **Plans osculateurs concourants.** Soit $(J, g)$ un arc birégulier de $\mathbb{R}^{3}$, paramétré par longueur d'arc, de classe $\mathcal{C}^{3}$, de trièdre de Frenet $(\vec{\tau}, \vec{\nu}, \vec{\beta})$. On suppose que les plans osculateurs passent tous par un même point $\Omega$.

    **1.** Justifier que $\langle g(s) - \Omega, \vec{\beta}(s) \rangle = 0$ pour tout $s \in J$.

    **2.** On veut montrer que $\vec{\beta}$ est constant. On raisonne par l'absurde en supposant qu'il existe $s_{0} \in J$ tel que $\vec{\beta}'(s_{0}) \neq 0$.

    **(a)** Justifier qu'il existe un intervalle $J_{0} \ni s_{0}$ sur lequel $\vec{\beta}'$ ne s'annule pas.

    **(b)** Montrer que $\langle g(s) - \Omega, \vec{\nu}(s) \rangle = 0$ pour tout $s \in J_{0}$.

    **(c)** Montrer que $\langle g(s) - \Omega, \vec{\tau}(s) \rangle = 0$ pour tout $s \in J_{0}$, et conclure.

    **3.** En déduire que l'arc est plan.
  corrige: |
    **1.** Le plan osculateur en $g(s)$ passe par $g(s)$ et a pour vecteur normal $\vec{\beta}(s)$. Il contient $\Omega$ si et seulement si $\langle g(s) - \Omega, \vec{\beta}(s) \rangle = 0$.

    **2.** (a) $\vec{\beta}'$ est continue et $\vec{\beta}'(s_{0}) \neq 0$, donc $\vec{\beta}'$ ne s'annule pas sur un intervalle $J_{0}$ contenant $s_{0}$. Sur $J_{0}$, $\vec{\beta}' = T\vec{\nu}$ donne $T \neq 0$. (b) En dérivant la relation de la question 1 : $\langle \vec{\tau}, \vec{\beta} \rangle + \langle g - \Omega, T\vec{\nu} \rangle = T\langle g - \Omega, \vec{\nu} \rangle = 0$, et $T \neq 0$ sur $J_{0}$. (c) En dérivant (b) :
    $$\langle \vec{\tau}, \vec{\nu} \rangle + \langle g - \Omega, -k\vec{\tau} - T\vec{\beta} \rangle = -k\langle g - \Omega, \vec{\tau} \rangle = 0 ,$$
     puisque $\langle g - \Omega, \vec{\beta} \rangle = 0$, et $k > 0$. Ainsi $g(s) - \Omega$ est orthogonal à la base $(\vec{\tau}, \vec{\nu}, \vec{\beta})$ : $g(s) = \Omega$ pour tout $s \in J_{0}$, ce qui contredit $g' = \vec{\tau} \neq 0$. Donc $\vec{\beta}$ est constant.

    **3.** Alors $T\vec{\nu} = \vec{\beta}' = 0$, donc $T = 0$ et l'arc est plan par la proposition 12 ; son plan, qui est le plan osculateur constant, contient $\Omega$. Le résultat est clair géométriquement pour une courbe plane ; l'exercice dit qu'il n'y a pas d'autre cas.
