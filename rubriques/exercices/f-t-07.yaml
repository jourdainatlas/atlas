  page_enonce: 4
  page_corrige: 7
  enonce: |
    Un club compte $25$ membres, parmi lesquels M. Dupont. On élit un bureau composé d'un président, d'un secrétaire et d'un trésorier, ces trois fonctions étant occupées par trois personnes différentes.

    **1.** Combien de bureaux différents peut-on former ?

    **2.** Combien de bureaux ont M. Dupont pour président ?

    **3.** Combien de bureaux comportent M. Dupont, quelle que soit sa fonction ?

    **4.** Combien de bureaux ne comportent pas M. Dupont ?

    **5.** Vérifier la cohérence des questions 1, 3 et 4.
  corrige: |
    **1.** 
    $$A_{25}^{3}=25\times 24\times 23=\boxed{13\,800 \text{ bureaux}}$$

    **2.** La place de président étant occupée par M. Dupont, il reste à pourvoir les deux autres fonctions parmi les $24$ membres restants : 
    $$A_{24}^{2}=24\times 23=\boxed{552 \text{ bureaux}}$$

    **3.** M. Dupont peut occuper l'une des trois fonctions, et le raisonnement précédent s'applique à chaque fois : 
    $$3\times A_{24}^{2}=3\times 552=\boxed{1\,656 \text{ bureaux}}$$

    **4.** Il s'agit de choisir les trois responsables parmi les $24$ autres membres : 
    $$A_{24}^{3}=24\times 23\times 22=\boxed{12\,144 \text{ bureaux}}$$

    **5.** Un bureau comporte M. Dupont ou ne le comporte pas : ces deux cas sont disjoints et recouvrent toutes les possibilités. 
    $$1\,656+12\,144=13\,800$$

    $$\boxed{\text{Le décompte est cohérent}}$$
- id: "t-07-15"
  feuille: "f-t-07"
  numero: 15
  partie: "Permutations et arrangements"
  etoiles: 2
  types: [Calcul]
