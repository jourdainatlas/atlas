  enonce: |
    Dénombrer les possibilités dans chacune des situations suivantes. On justifiera à chaque fois que l'ordre n'intervient pas.

    **1.** Un comité de $4$ personnes choisi parmi $20$ candidats.

    **2.** Une main de $5$ cartes dans un jeu de $32$.

    **3.** Une grille de $6$ numéros cochés parmi $49$.

    **4.** Une délégation de $3$ élèves choisie dans une classe de $15$.

    **5.** Le choix de $2$ exercices parmi les $8$ d'un devoir.
  corrige: |
    Dans les cinq situations, échanger deux objets choisis ne change rien au résultat : l'ordre n'intervient pas, et aucun objet n'est choisi deux fois. Ce sont des combinaisons.

    **1.** 
    $$\binom{20}{4}=\frac{20\times 19\times 18\times 17}{4\times 3\times 2\times 1} =\boxed{4\,845 \text{ comités}}$$

    **2.** 
    $$\binom{32}{5}=\boxed{201\,376 \text{ mains}}$$

    **3.** 
    $$\binom{49}{6}=\boxed{13\,983\,816 \text{ grilles}}$$

    **4.** 
    $$\binom{15}{3}=\frac{15\times 14\times 13}{3\times 2\times 1} =\boxed{455 \text{ délégations}}$$

    **5.** 
    $$\binom{8}{2}=\frac{8\times 7}{2}=\boxed{28 \text{ choix}}$$
- id: "t-07-18"
  feuille: "f-t-07"
