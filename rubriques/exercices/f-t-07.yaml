  enonce: |
    Calculer les coefficients binomiaux suivants, sans calculatrice lorsque c'est possible.

    **a)** $\dbinom{5}{2}$

    **b)** $\dbinom{7}{0}$

    **c)** $\dbinom{7}{7}$

    **d)** $\dbinom{10}{1}$

    **e)** $\dbinom{8}{3}$

    **f)** $\dbinom{6}{4}$

    **g)** $\dbinom{20}{18}$

    **h)** $\dbinom{12}{5}$

    Pour g), on utilisera la propriété de symétrie plutôt que la formule factorielle.
  corrige: |
    **a)** $\dbinom{5}{2}=\dfrac{5\times 4}{2\times 1}=\boxed{10}$

    **b)** $\dbinom{7}{0}=\boxed{1}$

    **c)** $\dbinom{7}{7}=\boxed{1}$

    **d)** $\dbinom{10}{1}=\boxed{10}$

    **e)** $\dbinom{8}{3}=\dfrac{8\times 7\times 6}{3\times 2\times 1}=\boxed{56}$

    **f)** $\dbinom{6}{4}=\dfrac{6\times 5\times 4\times 3}{4\times 3\times 2\times 1}=\boxed{15}$

    **g)** Par symétrie, $\dbinom{20}{18}=\dbinom{20}{2}=\dfrac{20\times 19}{2}=\boxed{190}$

    **h)** $\dbinom{12}{5}=\dfrac{12\times 11\times 10\times 9\times 8}{5\times 4\times 3\times 2\times 1} =\boxed{792}$

    En g), calculer directement $\dbinom{20}{18}$ demanderait un produit de dix-huit facteurs : la symétrie $\dbinom{n}{p}=\dbinom{n}{n-p}$ ramène le calcul à deux facteurs.
