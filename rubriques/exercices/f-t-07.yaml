  enonce: |
    *Problème des boîtes d'allumettes de Banach.* Soient $n\in\mathbb{N}^{*}$ et $k\in\{0\,;1\,;\dots\,;n\}$. Un mathématicien a deux boîtes de $n$ allumettes, une dans chaque poche. Chaque fois qu'il fume, il choisit au hasard une poche avec probabilité $\dfrac{1}{2}$, jusqu'à se rendre compte que l'une des deux boîtes est vide. On note $X$ la variable aléatoire donnant le nombre d'allumettes restant dans l'autre boîte à cet instant. Déterminer la loi de $X$.
  corrige: |
    *Modélisation.* Les choix successifs de poche sont indépendants, et chacun vaut « gauche » ou « droite » avec probabilité $\frac{1}{2}$. Une suite donnée de $L$ choix a donc la probabilité $\left(\frac{1}{2}\right)^{L}$, comme pour la loi binomiale du chapitre 2. Le mathématicien se rend compte qu'une boîte est vide au moment où il la choisit alors qu'elle ne contient plus d'allumette, c'est-à-dire lorsqu'il la choisit pour la $(n+1)$-ième fois.

    *Le cas où la boîte de gauche est découverte vide.* Soit $k\in\{0\,;\dots\,;n\}$. L'événement « il découvre la boîte de gauche vide alors que la boîte de droite contient $k$ allumettes » se produit exactement lorsque :

    • le dernier choix est le $(n+1)$-ième choix de la poche gauche ;

    • auparavant, il a choisi $n$ fois la gauche et $n-k$ fois la droite, dans un ordre quelconque.

    Les choix effectués sont donc au nombre de $L=(n+1)+(n-k)=2n-k+1$, le dernier étant imposé. Parmi les $2n-k$ premiers, il faut placer les $n$ choix « gauche » : il y a $\binom{2n-k}{n}$ façons de le faire. On remarque qu'aucune de ces suites ne s'arrête trop tôt, car la boîte de droite n'a été choisie que $n-k\leqslant n$ fois et n'a donc jamais été découverte vide. Chacune de ces suites ayant la probabilité $\left(\frac{1}{2}\right)^{2n-k+1}$, l'événement a pour probabilité $\binom{2n-k}{n}\left(\frac{1}{2}\right)^{2n-k+1}$.

    *Conclusion.* Le cas où la boîte de droite est découverte vide est symétrique et a la même probabilité, et les deux cas sont incompatibles. En additionnant : 
    $$\boxed{\text{pour } 0\leqslant k\leqslant n,\qquad P(X=k)=\binom{2n-k}{n}\left(\frac{1}{2}\right)^{2n-k}}$$
     *Vérification :* pour $n=1$, la formule donne $P(X=0)=P(X=1)=\frac{1}{2}$. En effet, s'il choisit deux fois de suite la même poche, il découvre au second choix que cette boîte est vide alors que l'autre est pleine ($X=1$) ; sinon, il a vidé les deux boîtes et découvre la première vide au troisième choix ($X=0$). Pour $n=5$, une simulation de $200\,000$ expériences en Python a donné des fréquences qui s'écartent de moins de $0{,}002$ des valeurs de la formule.

    ![Figure](documents/figures/ac85e5d171a700a2.svg)

    Ce diagramme représente la loi de $X$ pour $n=10$ : les petites valeurs de $k$ sont les plus probables, et il est très rare qu'il reste beaucoup d'allumettes dans l'autre boîte.

    *Remarque.* Il est remarquable que $P(X=0)=P(X=1)$ pour tout $n$ : la formule donne $\binom{2n}{n}\frac{1}{2^{2n}}$ et $\binom{2n-1}{n}\frac{1}{2^{2n-1}}$, et l'on a $\binom{2n}{n}=2\binom{2n-1}{n}$ d'après la question 4 de l'exercice 20 et la propriété de symétrie. On peut enfin vérifier que la somme des probabilités vaut $1$ pour les petites valeurs de $n$ ; la démontrer en général est un exercice de calcul plus difficile.

