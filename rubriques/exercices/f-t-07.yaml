  enonce: |
    On lance trois dés non pipés. Montrer que la probabilité d'amener un total inférieur ou égal à $10$ est $\dfrac{1}{2}$. On essaiera de donner un argument ne nécessitant aucun calcul.
  corrige: |
    On modélise l'expérience par l'ensemble $\Omega$ des triplets $(a\,;b\,;c)$ d'éléments de $\{1\,;\dots\,;6\}$, qui en compte $6^{3}=216$, tous équiprobables.

    *L'argument sans calcul.* Associons à chaque triplet $(a\,;b\,;c)$ le triplet $(7-a\,;7-b\,;7-c)$, ce qui revient à lire, sur chaque dé, la face opposée à la face supérieure. C'est encore un élément de $\Omega$, et en appliquant deux fois cette transformation on revient au triplet de départ : elle échange donc les triplets deux à deux, et réalise une correspondance terme à terme de $\Omega$ avec lui-même. Si la somme initiale vaut $s=a+b+c$, la nouvelle vaut $21-s$. Or 
    $$s\leqslant 10 \iff 21-s\geqslant 11$$
     La transformation fait donc correspondre exactement les triplets de total au plus $10$ et ceux de total au moins $11$ : ces deux ensembles ont le même nombre d'éléments. Comme ils sont disjoints et que leur réunion est $\Omega$, chacun en contient $\frac{216}{2}=108$. 
    $$\boxed{P(\text{total}\leqslant 10)=\frac{108}{216}=\frac{1}{2}}$$

    ![Figure](documents/figures/7481f34850b794aa.svg)

    Ce diagramme représente le nombre de triplets donnant chaque total $s$ : il est symétrique par rapport à $s=10{,}5$, et la transformation $s\mapsto 21-s$ échange la partie bleu ardoise et la partie ocre.

    *Remarque.* Le même diagramme montre qu'avec trois dés, le total $10$ (obtenu par $27$ triplets) est plus fréquent que le total $9$ (obtenu par $25$ triplets), bien que chacun s'écrive de six façons comme somme de trois entiers entre $1$ et $6$. Cette question, posée à Galilée, est un piège classique : l'erreur la plus répandue est de compter les décompositions comme $9=3+3+3$ ou $9=1+2+6$ au lieu des triplets ordonnés, qui seuls sont équiprobables.
