  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 49 et n° 50"
  page_enonce: 10
  page_corrige: 19
  enonce: |
    Soit $n$ un entier naturel non nul.

    **1.** Donner une forme simple de $\displaystyle\sum_{k=1}^{n}k\times k!$. On pourra utiliser l'égalité $k\times k!=(k+1)!-k!$.

    **2.** Par une méthode analogue, donner une forme simple de $\displaystyle\sum_{k=1}^{n}\frac{k}{(k+1)!}$.
  corrige: |
    **1.** On vérifie l'égalité proposée : $(k+1)!-k!=(k+1)\times k!-k!=k\times k!$. La somme est donc télescopique : 
    $$\sum_{k=1}^{n}k\times k!=\sum_{k=1}^{n}\Big((k+1)!-k!\Big) =\big(2!-1!\big)+\big(3!-2!\big)+\dots+\big((n+1)!-n!\big)$$
     Tous les termes intermédiaires se simplifient, et il reste le dernier moins le premier : 
    $$\boxed{\sum_{k=1}^{n}k\times k!=(n+1)!-1}$$
     *Vérification :* pour $n=3$, $1+4+18=23=4!-1$.

    **2.** On cherche à écrire $\dfrac{k}{(k+1)!}$ comme une différence de deux termes consécutifs. En écrivant $k=(k+1)-1$ : 
    $$\frac{k}{(k+1)!}=\frac{k+1}{(k+1)!}-\frac{1}{(k+1)!}=\frac{1}{k!}-\frac{1}{(k+1)!}$$
     puisque $(k+1)!=(k+1)\times k!$. La somme télescope de nouveau : 
    $$\boxed{\sum_{k=1}^{n}\frac{k}{(k+1)!}=\frac{1}{1!}-\frac{1}{(n+1)!}=1-\frac{1}{(n+1)!}}$$
     *Vérification :* pour $n=2$, $\frac{1}{2}+\frac{2}{6}=\frac{5}{6}=1-\frac{1}{3!}$.

    *Remarque.* Toute la difficulté est de deviner la décomposition télescopique, que le poly donne pour la première somme et laisse chercher pour la seconde. La seconde somme tend vers $1$ quand $n$ tend vers $+\infty$, puisque $(n+1)!$ tend vers $+\infty$ : c'est un exemple de somme infinie que l'on sait calculer exactement.
