  enonce: |
    *Monotonie des coefficients binomiaux.* Soit $n$ un entier naturel non nul, et $m$ le plus grand entier inférieur ou égal à $\dfrac{n}{2}$.

    **1.** Pour $0\leqslant p\leqslant n-1$, comparer le quotient $\dbinom{n}{p+1}\Big/\dbinom{n}{p}$ à $1$.

    **2.** En déduire que 
    $$\binom{n}{0}\leqslant\binom{n}{1}\leqslant\dots\leqslant\binom{n}{m}$$

    **3.** En considérant la somme $\displaystyle\sum_{k=0}^{n}\binom{n}{k}$, montrer que 
    $$\frac{2^{n}}{n+1}\leqslant\binom{n}{m}\leqslant 2^{n}$$
  corrige: |
    **1.** Pour $0\leqslant p\leqslant n-1$, avec la formule factorielle : 
    $$\frac{\binom{n}{p+1}}{\binom{n}{p}}=\frac{n!}{(p+1)!\,(n-p-1)!}\times\frac{p!\,(n-p)!}{n!} =\frac{n-p}{p+1}$$
     car $(p+1)!=(p+1)\times p!$ et $(n-p)!=(n-p)\times(n-p-1)!$. Ce quotient est supérieur ou égal à $1$ si et seulement si $n-p\geqslant p+1$, c'est-à-dire $p\leqslant\frac{n-1}{2}$. 
    $$\boxed{\frac{\binom{n}{p+1}}{\binom{n}{p}}\geqslant 1 \iff p\leqslant\frac{n-1}{2}}$$

    **2.** Si $p\leqslant m-1$, alors $p+1\leqslant m\leqslant\frac{n}{2}$, donc $p\leqslant\frac{n}{2}-1<\frac{n-1}{2}$ : d'après la question 1, $\binom{n}{p}\leqslant\binom{n}{p+1}$. En appliquant ceci pour $p=0$, $1$, …, $m-1$ : 
    $$\boxed{\binom{n}{0}\leqslant\binom{n}{1}\leqslant\dots\leqslant\binom{n}{m}}$$
     Par symétrie, $\binom{n}{p}=\binom{n}{n-p}$, les coefficients décroissent ensuite jusqu'à $\binom{n}{n}$ : la ligne $n$ du triangle de Pascal monte puis descend, et son plus grand terme est $\binom{n}{m}$, le coefficient « central ».

    **3.** Les $n+1$ nombres $\binom{n}{0}$, …, $\binom{n}{n}$ sont positifs, leur somme vaut $2^{n}$ (exercice 29) et le plus grand d'entre eux est $\binom{n}{m}$. D'une part, ce plus grand terme est inférieur à la somme ; d'autre part, il est supérieur à la moyenne $\frac{2^{n}}{n+1}$, sans quoi tous les termes seraient strictement inférieurs à la moyenne, et leur somme strictement inférieure à $2^{n}$. 
    $$\boxed{\frac{2^{n}}{n+1}\leqslant\binom{n}{m}\leqslant 2^{n}}$$

    ![Figure](documents/figures/2dff4c850f2edb97.svg)

    Ce diagramme des coefficients $\binom{10}{k}$ montre qu'ils croissent jusqu'au terme central, puis décroissent symétriquement ; le maximum $252$ dépasse bien la moyenne $\frac{1\,024}{11}$, comme l'affirme la question 3.

    *Remarque.* L'encadrement est grossier mais donne le bon ordre de grandeur exponentiel : pour $n=100$, il situe $\binom{100}{50}\approx 1{,}01\times 10^{29}$ entre $1{,}26\times 10^{28}$ et $1{,}27\times 10^{30}$. Une estimation beaucoup plus précise, la formule de Stirling, est étudiée après le baccalauréat.
- id: "t-07-35"
  feuille: "f-t-07"
  numero: 35
  partie: "Pour aller plus loin"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [combinaisons, formule du binôme, sommes, récurrence]
  noeuds: [n-sommes, n-recurrence]
  notions: []
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), § 10.7, théorème et exemple 1"
  page_enonce: 11
  page_corrige: 22
  enonce: |
    *La formule du binôme.*

    **1.** Démontrer par récurrence que, pour tout entier naturel $n$ et pour tous réels $a$ et $b$ : 
    $$(a+b)^{n}=\sum_{k=0}^{n}\binom{n}{k}a^{n-k}b^{k}$$

    **2.** En déduire, pour tout entier $n\geqslant 1$, les valeurs de $\displaystyle\sum_{k=0}^{n}\binom{n}{k}$ et de $\displaystyle\sum_{k=0}^{n}(-1)^{k}\binom{n}{k}$.

    **3.** On note $A_{n}$ (resp. $B_{n}$) la somme des $\dbinom{n}{k}$ pour $k$ décrivant l'ensemble des entiers pairs (resp. impairs) de $\{0\,;1\,;\dots\,;n\}$ : 
    $$A_{n}=\binom{n}{0}+\binom{n}{2}+\binom{n}{4}+\cdots \qquad\qquad B_{n}=\binom{n}{1}+\binom{n}{3}+\binom{n}{5}+\cdots$$
     Montrer que, pour tout entier $n\geqslant 1$, $A_{n}=B_{n}=2^{n-1}$.
  corrige: |
    **1.** Pour $n\in\mathbb{N}$, notons $\mathcal{P}_{n}$ la propriété : « pour tous réels $a$ et $b$, $(a+b)^{n}=\sum_{k=0}^{n}\binom{n}{k}a^{n-k}b^{k}$ ».

    **Initialisation :** pour $n=0$, les deux membres valent $1$, puisque $\binom{0}{0}=1$ : $\mathcal{P}_{0}$ est vraie.

    **Hérédité :** supposons $\mathcal{P}_{n}$ vraie pour un entier $n$, et soient $a$ et $b$ deux réels. Alors 
    $$(a+b)^{n+1}=(a+b)(a+b)^{n}=\sum_{k=0}^{n}\binom{n}{k}a^{n+1-k}b^{k} +\sum_{k=0}^{n}\binom{n}{k}a^{n-k}b^{k+1}$$
     Dans la seconde somme, on pose $j=k+1$, qui varie de $1$ à $n+1$ : $\sum_{j=1}^{n+1}\binom{n}{j-1}a^{n+1-j}b^{j}$. On regroupe alors les termes de même puissance de $b$ : le terme en $b^{0}$ vient de la première somme seule, le terme en $b^{n+1}$ de la seconde seule, et pour $1\leqslant j\leqslant n$ on additionne les deux contributions : 
    $$(a+b)^{n+1}=a^{n+1}+\sum_{j=1}^{n}\left(\binom{n}{j}+\binom{n}{j-1}\right)a^{n+1-j}b^{j} +b^{n+1}$$
     La relation de Pascal (exercice 20) donne $\binom{n}{j-1}+\binom{n}{j}=\binom{n+1}{j}$, et l'on a $\binom{n+1}{0}=\binom{n+1}{n+1}=1$. Il vient $(a+b)^{n+1}=\sum_{j=0}^{n+1}\binom{n+1}{j}a^{n+1-j}b^{j}$ : $\mathcal{P}_{n+1}$ est vraie.

    **Conclusion :** par récurrence, $\mathcal{P}_{n}$ est vraie pour tout entier naturel $n$. 
    $$\boxed{(a+b)^{n}=\sum_{k=0}^{n}\binom{n}{k}a^{n-k}b^{k}}$$
     *Remarque.* C'est la raison du nom de « coefficients binomiaux » : ce sont les coefficients du développement d'une puissance du binôme $a+b$. Le triangle de Pascal de l'exercice 19 se lit ainsi : $(a+b)^{3}=a^{3}+3a^{2}b+3ab^{2}+b^{3}$ correspond à la ligne $1$, $3$, $3$, $1$.

    **2.** Avec $a=b=1$, on obtient $\boxed{\sum_{k=0}^{n}\binom{n}{k}=2^{n}}$, ce qui redonne l'exercice 29 par une autre voie. Avec $a=1$ et $b=-1$, pour $n\geqslant 1$ : 
    $$\boxed{\sum_{k=0}^{n}(-1)^{k}\binom{n}{k}=(1-1)^{n}=0}$$
     Pour $n=0$, cette seconde somme vaudrait $1$, puisque $0^{0}=1$ par convention : c'est pourquoi on a supposé $n\geqslant 1$.

    **3.** Dans la somme alternée, les termes d'indice pair sont comptés avec le signe $+$ et ceux d'indice impair avec le signe $-$ : elle vaut donc $A_{n}-B_{n}$. La première somme vaut $A_{n}+B_{n}$. On a ainsi 
    $$A_{n}+B_{n}=2^{n}\qquad\text{et}\qquad A_{n}-B_{n}=0$$
     d'où, en ajoutant puis en soustrayant : 
    $$\boxed{A_{n}=B_{n}=2^{n-1}}$$
     *Interprétation.* $A_{n}$ est le nombre de parties de cardinal pair d'un ensemble à $n$ éléments : c'est la conjecture formulée à la question 6 de l'exercice 29, désormais démontrée. Exactement la moitié des parties ont un cardinal pair.
