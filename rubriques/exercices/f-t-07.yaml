  page_enonce: 8
  page_corrige: 16
  enonce: |
    Une association compte $24$ membres : $15$ femmes et $9$ hommes. Elle élit un conseil de $5$ personnes, tous les conseils possibles étant équiprobables.

    **1.** Combien de conseils différents peut-on former ?

    **2.** Combien de conseils ne sont composés que de femmes ?

    **3.** Combien de conseils comportent exactement $3$ femmes et $2$ hommes ?

    **4.** Combien de conseils comportent au moins une femme ?

    **5.** Calculer la probabilité que le conseil élu comporte exactement $3$ femmes. On donnera une valeur approchée au millième.

    **6.** Une fois le conseil élu, ses $5$ membres se répartissent trois fonctions distinctes : président, vice-président et trésorier. Combien de répartitions sont possibles pour un conseil donné ?

    **7.** En déduire le nombre total de configurations finales possibles.
  corrige: |
    **1.** Un conseil est une partie de $5$ éléments parmi $24$ : 
    $$\binom{24}{5}=\boxed{42\,504 \text{ conseils}}$$

    **2.** 
    $$\binom{15}{5}=\boxed{3\,003 \text{ conseils}}$$

    **3.** 
    $$\binom{15}{3}\times\binom{9}{2}=455\times 36=\boxed{16\,380 \text{ conseils}}$$

    **4.** Le contraire est « aucune femme », c'est-à-dire cinq hommes parmi $9$ : 
    $$42\,504-\binom{9}{5}=42\,504-126=\boxed{42\,378 \text{ conseils}}$$

    **5.** 
    $$p=\frac{16\,380}{42\,504}\approx\boxed{0{,}385}$$

    **6.** Trois fonctions distinctes attribuées à trois des cinq membres : l'ordre compte, c'est un arrangement. 
    $$A_{5}^{3}=5\times 4\times 3=\boxed{60 \text{ répartitions}}$$

    **7.** Le principe multiplicatif combine les deux étapes : 
    $$42\,504\times 60=\boxed{2\,550\,240 \text{ configurations}}$$

    Cet exercice illustre la complémentarité des deux outils : la combinaison pour désigner *qui* siège, l'arrangement pour décider *quel rôle* chacun occupe.
- id: "t-07-28"
  feuille: "f-t-07"
  numero: 28
  titre: "Type Bac"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Type Bac, Démonstration, Calcul]
  mots_cles: [principe multiplicatif, combinaisons, probabilités]
  noeuds: [r-produit, p-espace]
  notions: [produit-cartesien]
  page_enonce: 9
  page_corrige: 16
  enonce: |
    Au Loto, une grille consiste à cocher $5$ numéros parmi $49$, puis un « numéro chance » parmi $10$. L'ordre dans lequel les numéros sont cochés n'intervient pas.

    **1.** Justifier que le nombre de grilles différentes est $\dbinom{49}{5}\times 10$, puis en donner la valeur.

    **2.** Un joueur remplit une grille au hasard. Quelle est la probabilité qu'il obtienne le gros lot, c'est-à-dire les $5$ bons numéros et le bon numéro chance ?

    **3.** On ne s'intéresse désormais qu'aux $5$ numéros, le numéro chance étant ignoré. Combien de grilles comportent exactement $4$ bons numéros ?

    *Il faut choisir $4$ numéros parmi les $5$ gagnants, et $1$ parmi les $44$ perdants.*

    **4.** Combien de grilles comportent exactement $3$ bons numéros ?

    **5.** En déduire la probabilité qu'une grille comporte au moins $3$ bons numéros. On donnera une valeur approchée à $10^{-6}$ près.

    **6.** Le joueur affirme : « en cochant $10$ numéros au lieu de $5$, je multiplie mes chances par $2$ ». Que penser de cette affirmation ?

    *On pourra dénombrer les grilles de $5$ numéros contenues dans une sélection de $10$.*
  corrige: |
    **1.** Le choix des $5$ numéros ignore l'ordre : c'est une combinaison. Le numéro chance est ensuite choisi parmi $10$, indépendamment, d'où le produit : 
    $$\binom{49}{5}\times 10=1\,906\,884\times 10=\boxed{19\,068\,840 \text{ grilles}}$$

    **2.** Une seule grille est gagnante parmi toutes celles possibles : 
    $$p=\boxed{\frac{1}{19\,068\,840}\approx 5{,}2\times 10^{-8}}$$

    **3.** Les $49$ numéros se répartissent en $5$ gagnants et $44$ perdants. Avoir exactement $4$ bons numéros, c'est en choisir $4$ parmi les $5$ gagnants et $1$ parmi les $44$ perdants : 
    $$\binom{5}{4}\times\binom{44}{1}=5\times 44=\boxed{220 \text{ grilles}}$$

    **4.** 
    $$\binom{5}{3}\times\binom{44}{2}=10\times 946=\boxed{9\,460 \text{ grilles}}$$

    **5.** Il faut ajouter les grilles à $5$ bons numéros, au nombre de $\dbinom{5}{5}=1$ : 
    $$p=\frac{9\,460+220+1}{1\,906\,884}=\frac{9\,681}{1\,906\,884} \approx\boxed{0{,}005\,077}$$
     Environ une grille sur $197$ comporte au moins trois bons numéros.

    **6.** Une sélection de $10$ numéros contient exactement $\dbinom{10}{5}$ grilles de $5$ numéros : 
    $$\binom{10}{5}=\boxed{252 \text{ grilles}}$$

    $$\boxed{\text{L'affirmation est fausse : les chances sont multipliées par } 252, \text{ non par } 2}$$
     Le joueur raisonne comme si le nombre de chances était proportionnel au nombre de numéros cochés, alors qu'il l'est au nombre de *parties* de $5$ éléments que sa sélection contient. Ce serait évidemment $252$ fois plus cher.
- id: "t-07-29"
  feuille: "f-t-07"
  numero: 29
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Conjecture, Calcul]
  mots_cles: [cardinal, p-uplets, combinaisons, triangle de Pascal, "parties d'un ensemble", sommes]
  noeuds: [n-fini, r-produit, zf-parties, n-sommes]
  notions: [cardinal, ensemble-fini, produit-cartesien, ensemble-parties]
  page_enonce: 9
  page_corrige: 17
  enonce: |
    Soit $E$ un ensemble fini de cardinal $n$. On cherche à dénombrer les *parties* de $E$, c'est-à-dire les sous-ensembles de $E$, y compris $\varnothing$ et $E$ lui-même.

    **1.** Pour $E=\{a\,;b\,;c\}$, écrire la liste de toutes les parties de $E$. Combien y en a-t-il ?

    **2.** Choisir une partie de $E$, c'est décider pour chacun des $n$ éléments s'il appartient ou non à cette partie. En déduire que le nombre de parties de $E$ est $2^{n}$.

    *On reconnaîtra un $n$-uplet d'un ensemble à deux éléments.*

    **3.** Dénombrons autrement. Combien $E$ possède-t-il de parties de cardinal $p$ ? En déduire que : 
    $$\sum_{p=0}^{n}\binom{n}{p}=2^{n}$$

    **4.** Vérifier cette égalité pour $n=4$ à l'aide du triangle de Pascal.

    **5.** Combien un ensemble à $10$ éléments possède-t-il de parties ?

    **6.** Pour $n=4$, puis pour $n=5$, dénombrer les parties de cardinal *pair*. Quelle conjecture peut-on formuler ?

    **7.** Combien $E$ possède-t-il de parties non vides et différentes de $E$ ?
  corrige: |
    **1.** On liste les parties par cardinal croissant : 
    $$\varnothing \; ; \; \{a\} \; ; \; \{b\} \; ; \; \{c\} \; ; \; \{a\,;b\} \; ; \; \{a\,;c\} \; ; \; \{b\,;c\} \; ; \; \{a\,;b\,;c\}$$

    $$\boxed{E \text{ possède } 8 \text{ parties}}$$

    **2.** Construire une partie, c'est répondre par oui ou par non à $n$ questions successives : « l'élément $x_{1}$ est-il dans la partie ? », puis $x_{2}$, et ainsi de suite. Chaque réponse offre deux possibilités, indépendamment des autres.

    Une partie correspond donc exactement à un $n$-uplet de l'ensemble $\{\text{oui}\,; \text{non}\}$, qui compte deux éléments : 
    $$\boxed{\text{Le nombre de parties de } E \text{ est } 2^{n}}$$
     Pour $n=3$, on retrouve bien $2^{3}=8$.

    **3.** Une partie de cardinal $p$ est une combinaison de $p$ éléments parmi $n$, il y en a donc $\dbinom{n}{p}$. Or toute partie a un cardinal compris entre $0$ et $n$, et ces cas sont deux à deux disjoints. Le principe additif donne : 
    $$\text{nombre de parties}=\binom{n}{0}+\binom{n}{1}+\dots+\binom{n}{n} =\sum_{p=0}^{n}\binom{n}{p}$$
     En comparant avec la question 2, où le même nombre a été trouvé égal à $2^{n}$ : 
    $$\boxed{\sum_{p=0}^{n}\binom{n}{p}=2^{n}}$$
     Ce raisonnement est un *double dénombrement* : le même ensemble a été compté de deux façons.

    **4.** La ligne $n=4$ du triangle de Pascal est $1$, $4$, $6$, $4$, $1$ : 
    $$1+4+6+4+1=16=2^{4}$$

    $$\boxed{\text{L'égalité est vérifiée}}$$
     La conjecture de l'exercice 19 est donc démontrée.

    **5.** 
    $$2^{10}=\boxed{1\,024 \text{ parties}}$$

    **6.** Pour $n=4$, les parties de cardinal pair sont celles de cardinal $0$, $2$ ou $4$ : 
    $$\binom{4}{0}+\binom{4}{2}+\binom{4}{4}=1+6+1=8=2^{3}$$
     Pour $n=5$, ce sont celles de cardinal $0$, $2$ ou $4$ : 
    $$\binom{5}{0}+\binom{5}{2}+\binom{5}{4}=1+10+5=16=2^{4}$$

    $$\boxed{\text{Conjecture : il y a } 2^{n-1} \text{ parties de cardinal pair}}$$
     Autrement dit, exactement la moitié des parties ont un cardinal pair.

    **7.** Il suffit de retirer les deux parties exclues, à savoir $\varnothing$ et $E$ : 
    $$\boxed{2^{n}-2 \text{ parties}}$$
- id: "t-07-30"
  feuille: "f-t-07"
  numero: 30
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Calcul]
  mots_cles: [triangle de Pascal, chemins sur un quadrillage]
  noeuds: []
  notions: []
  page_enonce: 10
  page_corrige: 18
  enonce: |
    Un livreur se déplace dans une ville quadrillée. Il part du point $A$ et doit rejoindre le point $B$, en n'avançant qu'**vers la droite** ou **vers le haut**, le long des lignes du quadrillage.

    ![Figure](documents/figures/1e6d3f1342acb78e.svg)

    **1.** Justifier que tout chemin de $A$ à $B$ comporte exactement $8$ déplacements, dont $5$ vers la droite.

    **2.** Un chemin est donc entièrement déterminé par le choix des étapes qui seront des déplacements vers la droite. En déduire le nombre de chemins possibles.

    **3.** Retrouver ce résultat en inscrivant sur chaque nœud du quadrillage le nombre de chemins permettant de l'atteindre depuis $A$. Quel lien observe-t-on avec le triangle de Pascal ?

    **4.** Combien de chemins passent par le point $C$ ?

    *On décomposera le trajet en deux étapes indépendantes.*

    **5.** En déduire le nombre de chemins évitant $C$.

    **6.** Généraliser : combien existe-t-il de chemins allant de l'origine au point de coordonnées $(p\,;q)$ ?
  corrige: |
    **1.** Pour aller de $A(0\,;0)$ à $B(5\,;3)$, le livreur doit progresser de $5$ unités vers la droite et de $3$ unités vers le haut. Comme chaque déplacement vaut exactement une unité dans l'une des deux directions : 
    $$\boxed{\text{tout chemin comporte } 5+3=8 \text{ déplacements, dont } 5 \text{ vers la droite}}$$

    **2.** Un chemin est entièrement décrit par la donnée des étapes qui sont des déplacements vers la droite : les autres sont nécessairement vers le haut. Il s'agit donc de choisir $5$ étapes parmi les $8$, sans tenir compte de l'ordre — c'est une combinaison. 
    $$\binom{8}{5}=\binom{8}{3}=\frac{8\times 7\times 6}{3\times 2\times 1} =\boxed{56 \text{ chemins}}$$

    **3.** Un nœud ne peut être atteint qu'en venant de celui situé immédiatement à sa gauche ou de celui situé immédiatement en dessous : le nombre de chemins qui y mènent est donc la somme de ces deux nombres.

    ![Figure](documents/figures/f58c1193d9fd936d.svg)

    On lit bien $56$ en $B$. Cette règle de construction est exactement la relation de Pascal : 
    $$\binom{n}{p}+\binom{n}{p+1}=\binom{n+1}{p+1}$$

    $$\boxed{\text{Le tableau des chemins est un triangle de Pascal, présenté en diagonale}}$$
     On y retrouve d'ailleurs les lignes du triangle : $1$, $2$, $3$, $4$… puis $1$, $3$, $6$, $10$… qui sont les nombres triangulaires.

    **4.** Le trajet se décompose en deux étapes indépendantes, que le principe multiplicatif permet de combiner.

    De $A(0\,;0)$ à $C(2\,;1)$ : $3$ déplacements dont $2$ vers la droite, soit $\dbinom{3}{2}=3$ chemins.

    De $C(2\,;1)$ à $B(5\,;3)$ : il reste $3$ unités vers la droite et $2$ vers le haut, soit $5$ déplacements dont $3$ vers la droite, donc $\dbinom{5}{3}=10$ chemins. 
    $$3\times 10=\boxed{30 \text{ chemins passent par } C}$$

    **5.** Par passage au complémentaire : 
    $$56-30=\boxed{26 \text{ chemins évitent } C}$$

    **6.** Le raisonnement de la question 2 se transpose sans changement : un chemin comporte $p+q$ déplacements, dont $p$ vers la droite. 
    $$\boxed{\text{Il existe } \binom{p+q}{p} \text{ chemins allant de l'origine au point } (p\,;q)}$$
     On remarquera que $\dbinom{p+q}{p}=\dbinom{p+q}{q}$ : compter les déplacements vers la droite ou vers le haut revient au même, ce qui est cohérent avec la symétrie du problème.
