  enonce: |
    Soit $n$ un entier naturel non nul. Quelle est la moyenne des cardinaux des parties de $\{1\,;2\,;\dots\,;n\}$ ?
  corrige: |
    L'ensemble $E=\{1\,;2\,;\dots\,;n\}$ possède $2^{n}$ parties (exercice 29). La moyenne cherchée est la somme des cardinaux de toutes ces parties, divisée par $2^{n}$.

    *Première méthode : par un calcul.* Il y a $\dbinom{n}{k}$ parties de cardinal $k$, donc la somme des cardinaux vaut $\displaystyle\sum_{k=0}^{n}k\binom{n}{k}$. D'après la question 4 de l'exercice 20, $k\dbinom{n}{k}=n\dbinom{n-1}{k-1}$ pour $k\geqslant 1$, d'où, avec l'exercice 29 appliqué à un ensemble à $n-1$ éléments : 
    $$\sum_{k=1}^{n}k\binom{n}{k}=n\sum_{k=1}^{n}\binom{n-1}{k-1}=n\sum_{j=0}^{n-1}\binom{n-1}{j} =n\,2^{n-1}$$
     *Seconde méthode : sans calcul.* Associons à chaque partie $A$ son complémentaire $\overline{A}$ dans $E$. Cette association regroupe les $2^{n}$ parties en $2^{n-1}$ paires $\{A\,;\overline{A}\}$, et dans chaque paire $\mathrm{Card}(A)+\mathrm{Card}(\overline{A})=n$ (exercice 2). La somme de tous les cardinaux vaut donc $2^{n-1}\times n$, comme ci-dessus. 
    $$\boxed{\text{La moyenne des cardinaux des parties de } E \text{ vaut } \frac{n\,2^{n-1}}{2^{n}} =\frac{n}{2}}$$
     *Vérification :* pour $n=3$, les huit parties listées à l'exercice 29 ont pour cardinaux $0$, $1$, $1$, $1$, $2$, $2$, $2$, $3$, de somme $12$ et de moyenne $\frac{12}{8}=\frac{3}{2}$.

    *Remarque.* La seconde méthode montre la force d'un argument de symétrie : il remplace un calcul de somme par une observation. On retrouvera ce type d'argument à l'exercice suivant.
