  enonce: |
    On considère un jeu de $32$ cartes, comportant $4$ as et $8$ cartes de chaque couleur. On tire simultanément $5$ cartes : un tel tirage s'appelle une *main*.

    **1.** Combien de mains différentes peut-on obtenir ?

    **2.** Combien de mains contiennent exactement deux as ?

    **3.** Combien de mains ne contiennent aucun as ?

    **4.** En déduire le nombre de mains contenant au moins un as.

    **5.** Combien de mains contiennent les quatre as ?

    **6.** Combien de mains ne sont composées que de cœurs ?
  corrige: |
    Un tirage simultané ignore l'ordre : toutes les questions relèvent des combinaisons.

    **1.** 
    $$\binom{32}{5}=\boxed{201\,376 \text{ mains}}$$

    **2.** On choisit $2$ as parmi les $4$, puis $3$ cartes parmi les $28$ qui ne sont pas des as : 
    $$\binom{4}{2}\times\binom{28}{3}=6\times 3\,276=\boxed{19\,656 \text{ mains}}$$

    **3.** Les cinq cartes sont choisies parmi les $28$ cartes qui ne sont pas des as : 
    $$\binom{28}{5}=\boxed{98\,280 \text{ mains}}$$

    **4.** Par passage au complémentaire : 
    $$201\,376-98\,280=\boxed{103\,096 \text{ mains}}$$

    **5.** Les quatre as sont imposés, et il reste une carte à choisir parmi les $28$ autres : 
    $$\binom{4}{4}\times\binom{28}{1}=1\times 28=\boxed{28 \text{ mains}}$$

    **6.** Le jeu comporte $8$ cœurs, parmi lesquels il faut en choisir $5$ : 
    $$\binom{8}{5}=\binom{8}{3}=\boxed{56 \text{ mains}}$$
- id: "t-07-22"
  feuille: "f-t-07"
  numero: 22
  partie: "Combinaisons"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [principe multiplicatif, p-uplets, permutations, arrangements, combinaisons]
  noeuds: [r-produit]
  notions: [produit-cartesien]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Pour chacune des situations suivantes, préciser s'il s'agit d'un $p$-uplet, d'une permutation, d'un arrangement ou d'une combinaison, puis effectuer le dénombrement. On justifiera en répondant aux deux questions du récapitulatif du cours : *les répétitions sont-elles autorisées ? l'ordre compte-t-il ?*

    **1.** Un code d'accès formé de $5$ chiffres.

    **2.** Le podium d'une course réunissant $10$ concurrents.

    **3.** L'élection de $3$ délégués parmi $30$ élèves, sans distinction de rôle.

    **4.** Le rangement de $7$ livres sur une étagère.

    **5.** Le tirage successif avec remise de $4$ boules dans une urne en contenant $15$.

    **6.** Une main de $5$ cartes dans un jeu de $52$.

    **7.** Une plaque formée de $2$ lettres distinctes suivies de $3$ chiffres distincts.

    **8.** Le tirage successif sans remise de $3$ jetons parmi $10$.
  corrige: |
    ```tableau
    **Situation** ¦ **Répét.** ¦ **Ordre** ¦ **Nature** ¦ **Dénombrement**
    1. Code de $5$ chiffres ¦ oui ¦ oui ¦ $p$-uplet ¦ $10^{5}=100\,000$
    2. Podium parmi $10$ ¦ non ¦ oui ¦ arrangement ¦ $A_{10}^{3}=720$
    3. $3$ délégués parmi $30$ ¦ non ¦ non ¦ combinaison ¦ $\dbinom{30}{3}=4\,060$
    4. Rangement de $7$ livres ¦ non ¦ oui ¦ permutation ¦ $7!=5\,040$
    5. $4$ boules avec remise parmi $15$ ¦ oui ¦ oui ¦ $p$-uplet ¦ $15^{4}=50\,625$
    6. Main de $5$ cartes sur $52$ ¦ non ¦ non ¦ combinaison ¦ $\dbinom{52}{5}=2\,598\,960$
    7. $2$ lettres puis $3$ chiffres, tous distincts ¦ non ¦ oui ¦ deux arrangements ¦ $A_{26}^{2}\times A_{10}^{3}=468\,000$
    8. $3$ jetons sans remise parmi $10$ ¦ non ¦ oui ¦ arrangement ¦ $A_{10}^{3}=720$
    ```

    Deux remarques. La situation 4 est un cas particulier d'arrangement, celui où l'on ordonne *tous* les éléments : $A_{7}^{7}=7!$. La situation 7 combine deux dénombrements indépendants, que le principe multiplicatif permet de multiplier : $A_{26}^{2}=650$ pour les lettres et $A_{10}^{3}=720$ pour les chiffres.

    On comparera enfin les situations 2 et 8 : ce sont deux problèmes de nature très différente, mais leur dénombrement est identique. Choisir un podium parmi $10$ concurrents ou tirer successivement $3$ jetons sur $10$, c'est deux fois choisir $3$ objets ordonnés et distincts.
- id: "t-07-23"
