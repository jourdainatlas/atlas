  noeuds: []
  notions: []
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Une urne contient $12$ boules numérotées de $1$ à $12$. On en prélève $4$. Dénombrer les résultats possibles selon le mode de tirage.

    **1.** Tirage successif **avec** remise, en tenant compte de l'ordre.

    **2.** Tirage successif **sans** remise, en tenant compte de l'ordre.

    **3.** Tirage **simultané** des $4$ boules.

    **4.** Vérifier que le résultat de la question 2 est égal à celui de la question 3 multiplié par $4!$, et expliquer pourquoi.
  corrige: |
    **1.** Avec remise et avec ordre : c'est un $4$-uplet. 
    $$12^{4}=\boxed{20\,736 \text{ tirages}}$$

    **2.** Sans remise et avec ordre : c'est un arrangement. 
    $$A_{12}^{4}=12\times 11\times 10\times 9=\boxed{11\,880 \text{ tirages}}$$

    **3.** Un tirage simultané ignore l'ordre et interdit les répétitions : c'est une combinaison. 
    $$\binom{12}{4}=\frac{12\times 11\times 10\times 9}{4\times 3\times 2\times 1} =\frac{11\,880}{24}=\boxed{495 \text{ tirages}}$$

    **4.** 
    $$495\times 4!=495\times 24=11\,880$$
     L'égalité se comprend ainsi : se donner un tirage ordonné, c'est d'abord choisir *quelles* boules sortent — soit $\dbinom{12}{4}$ possibilités — puis dans quel *ordre* elles sortent, soit $4!$ possibilités. 
    $$\boxed{A_{12}^{4}=\binom{12}{4}\times 4!}$$
     C'est exactement la démonstration du théorème 2 du cours.
- id: "t-07-16"
