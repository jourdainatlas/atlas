  enonce: |
    Pour $n\in\mathbb{N}$ et $x\in\mathbb{R}$, donner une expression simple de la somme 
    $$\sum_{k=0}^{n}\binom{n}{k}\frac{x^{k+1}}{k+1}$$
  corrige: |
    D'après la formule du binôme (exercice 35, avec $a=1$ et $b=t$), pour tout réel $t$ : 
    $$(1+t)^{n}=\sum_{k=0}^{n}\binom{n}{k}t^{k}$$
     Les deux membres sont des fonctions continues de $t$ ; on les intègre entre $0$ et $x$, comme au chapitre 6. À gauche, une primitive de $t\mapsto(1+t)^{n}$ est $t\mapsto\frac{(1+t)^{n+1}}{n+1}$ ; à droite, par linéarité, chaque terme $t^{k}$ s'intègre en $\frac{x^{k+1}}{k+1}$ : 
    $$\int_{0}^{x}(1+t)^{n}\,\mathrm{d}t=\frac{(1+x)^{n+1}-1}{n+1} \qquad\text{et}\qquad \int_{0}^{x}\sum_{k=0}^{n}\binom{n}{k}t^{k}\,\mathrm{d}t=\sum_{k=0}^{n}\binom{n}{k} \frac{x^{k+1}}{k+1}$$

    $$\boxed{\sum_{k=0}^{n}\binom{n}{k}\frac{x^{k+1}}{k+1}=\frac{(1+x)^{n+1}-1}{n+1}}$$
     *Cas particuliers.* Pour $x=1$, on obtient $\sum_{k=0}^{n}\frac{1}{k+1}\binom{n}{k}=\frac{2^{n+1}-1}{n+1}$ ; pour $n=2$, par exemple, $1+\frac{2}{2}+\frac{1}{3}=\frac{7}{3}$. Pour $x=-1$, la somme $\sum_{k=0}^{n}\binom{n}{k}\frac{(-1)^{k+1}}{k+1}$ vaut $-\frac{1}{n+1}$.

    *Remarque.* On peut aussi éviter l'intégration. D'après la question 4 de l'exercice 20 appliquée à $n+1$ et $k+1$, on a $\frac{1}{k+1}\binom{n}{k}=\frac{1}{n+1}\binom{n+1}{k+1}$, et la somme devient $\frac{1}{n+1}\sum_{j=1}^{n+1}\binom{n+1}{j}x^{j}$, que la formule du binôme appliquée à $(1+x)^{n+1}$ permet de reconnaître. Les deux méthodes, l'une analytique et l'autre combinatoire, se confirment mutuellement.
- id: "t-07-37"
  feuille: "f-t-07"
  numero: 37
  partie: "Pour aller plus loin"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [combinaisons, formule du binôme, sommes]
  noeuds: [n-sommes]
  notions: []
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), § 11.1, exemple 3, et n° 414, n° 415"
  page_enonce: 11
  page_corrige: 23
  enonce: |
    *Identités de Vandermonde.* Soit $n$ un entier naturel.

    **1.** Établir par un raisonnement combinatoire que 
    $$\sum_{k=0}^{n}\binom{n}{k}^{2}=\binom{2n}{n}$$

    **2.** Plus généralement, soient $m$, $n$ et $k$ trois entiers naturels tels que $k\leqslant m$ et $k\leqslant n$. Montrer que 
    $$\sum_{j=0}^{k}\binom{m}{j}\binom{n}{k-j}=\binom{m+n}{k}$$

    **3.** Retrouver le résultat de la question 1 en comparant les coefficients de $x^{n}$ dans les deux membres de l'égalité $(1+x)^{2n}=\left((1+x)^{n}\right)^{2}$, développés à l'aide de la formule du binôme (exercice 35). On admettra que deux expressions polynomiales égales pour tout réel $x$ ont les mêmes coefficients.
  corrige: |
    **1.** Considérons un groupe de $2n$ personnes, formé de $n$ filles et de $n$ garçons, dans lequel on choisit un comité de $n$ personnes. Il y a $\binom{2n}{n}$ comités. Comptons-les autrement, selon le nombre $k$ de filles qu'ils contiennent, qui varie de $0$ à $n$. Un comité à $k$ filles s'obtient en choisissant $k$ filles parmi $n$, puis $n-k$ garçons parmi $n$ : il y en a $\binom{n}{k}\binom{n}{n-k}=\binom{n}{k}^{2}$, par symétrie. Ces cas étant deux à deux disjoints, le principe additif donne : 
    $$\boxed{\sum_{k=0}^{n}\binom{n}{k}^{2}=\binom{2n}{n}}$$
     *Vérification :* pour $n=3$, $1+9+9+1=20=\binom{6}{3}$.

    **2.** Le même raisonnement s'applique à un groupe de $m$ filles et $n$ garçons, dans lequel on choisit un comité de $k$ personnes : il y en a $\binom{m+n}{k}$. Un comité contenant $j$ filles contient $k-j$ garçons ; comme $k\leqslant m$ et $k\leqslant n$, l'entier $j$ peut prendre toutes les valeurs de $0$ à $k$, et il y a $\binom{m}{j}\binom{n}{k-j}$ tels comités. 
    $$\boxed{\sum_{j=0}^{k}\binom{m}{j}\binom{n}{k-j}=\binom{m+n}{k}}$$
     La question 1 est le cas $m=n=k$.

    **3.** D'après la formule du binôme, le coefficient de $x^{n}$ dans $(1+x)^{2n}$ est $\binom{2n}{n}$. D'autre part, 
    $$\left((1+x)^{n}\right)^{2}=\left(\sum_{j=0}^{n}\binom{n}{j}x^{j}\right) \left(\sum_{i=0}^{n}\binom{n}{i}x^{i}\right)$$
     En développant ce produit, on obtient un terme en $x^{n}$ pour chaque couple d'indices tels que $i+j=n$, c'est-à-dire $i=n-j$, avec $j$ variant de $0$ à $n$ ; le coefficient de $x^{n}$ vaut donc $\sum_{j=0}^{n}\binom{n}{j}\binom{n}{n-j}=\sum_{j=0}^{n}\binom{n}{j}^{2}$. Les deux expressions étant égales pour tout réel $x$, leurs coefficients de $x^{n}$ sont égaux, ce qui redonne le résultat de la question 1.

    *Remarque.* Les deux démonstrations ne se ressemblent pas, mais elles disent la même chose : développer un produit de deux puissances de $(1+x)$, c'est choisir une partie dans chacun de deux groupes. Les identités de ce type portent le nom de Vandermonde, qui les a publiées au XVIIIᵉ siècle.
