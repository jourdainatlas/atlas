  enonce: |
    Dénombrer les possibilités dans chacune des situations suivantes.

    **1.** Le tiercé dans l'ordre d'une course de $20$ chevaux.

    **2.** Le podium d'une finale réunissant $12$ athlètes.

    **3.** L'élection d'un président, d'un secrétaire et d'un trésorier parmi $25$ adhérents.

    **4.** Un code formé de $4$ chiffres tous distincts.

    **5.** Un sigle formé de $3$ lettres toutes distinctes.
  corrige: |
    Dans les cinq situations, l'ordre compte et les répétitions sont impossibles : ce sont des arrangements.

    **1.** 
    $$A_{20}^{3}=20\times 19\times 18=\boxed{6\,840 \text{ tiercés}}$$

    **2.** 
    $$A_{12}^{3}=12\times 11\times 10=\boxed{1\,320 \text{ podiums}}$$

    **3.** 
    $$A_{25}^{3}=25\times 24\times 23=\boxed{13\,800 \text{ bureaux}}$$

    **4.** 
    $$A_{10}^{4}=10\times 9\times 8\times 7=\boxed{5\,040 \text{ codes}}$$

    **5.** 
    $$A_{26}^{3}=26\times 25\times 24=\boxed{15\,600 \text{ sigles}}$$

    On remarquera la différence avec l'exercice 7 : un code de $4$ chiffres *quelconques* donne $10^{4}=10\,000$ possibilités, contre $5\,040$ seulement si les chiffres doivent être distincts.
- id: "t-07-14"
  feuille: "f-t-07"
  numero: 14
  partie: "Permutations et arrangements"
  etoiles: 2
