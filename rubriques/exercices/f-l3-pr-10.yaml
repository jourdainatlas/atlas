  page_enonce: 1
  page_corrige: 2
  enonce: |
    Soit $X$ un vecteur gaussien centré de $\mathbb{R}^{3}$, de matrice de covariance $\Gamma = \begin{pmatrix} 3 & -1 & 0 \\ -1 & 3 & 0 \\ 0 & 0 & 2 \end{pmatrix}$. Trouver une matrice $U$ telle que les composantes de $Y = UX$ soient indépendantes, et donner la loi de $Y$. Peut-on choisir $U$ orthogonale ? Peut-on obtenir $Y \sim \mathcal{N}(0, I_{3})$ ?
  corrige: |
    Les valeurs propres de $\Gamma$ sont $2$ (double, vecteurs propres $\frac{1}{\sqrt{2}}(1, 1, 0)$ et $(0, 0, 1)$) et $4$ (vecteur propre $\frac{1}{\sqrt{2}}(1, -1, 0)$). Avec la matrice orthogonale $U$ dont les lignes sont ces vecteurs, 
    $$\boxed{Y_{1} = \frac{X_{1} + X_{2}}{\sqrt{2}} \sim \mathcal{N}(0, 2), \qquad Y_{2} = \frac{X_{1} - X_{2}}{\sqrt{2}} \sim \mathcal{N}(0, 4), \qquad Y_{3} = X_{3} \sim \mathcal{N}(0, 2)},$$
     et $Y$ est gaussien de covariance $U\Gamma{U}^{T} = \operatorname{diag}(2, 4, 2)$ (prop. 5) : ses composantes sont indépendantes (th. 4). On peut donc choisir $\boxed{U \text{ orthogonale}}$ ; elle n'est pas unique, car toute rotation du plan propre de la valeur propre double convient. Avec $U' = \operatorname{diag}(\frac{1}{\sqrt{2}}, \frac{1}{2}, \frac{1}{\sqrt{2}})\,U$, on obtient $\boxed{U'X \sim \mathcal{N}(0, I_{3})}$, mais $U'$ n'est plus orthogonale.
- id: "l3-pr-10-03"
  feuille: "f-l3-pr-10"
  numero: 3
  partie: "Vecteurs gaussiens, covariance"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [vecteurs gaussiens]
  noeuds: [p-normale, fo-caracteristiques]
  notions: [loi-normale, covariance]
  source: "Durand, exercices 6.15 et 6.11"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    *(Marginales gaussiennes sans vecteur gaussien.)* Soit $X \sim \mathcal{N}(0, 1)$ et $\alpha > 0$. On pose $Y = X$ si $|X| \leqslant \alpha$, et $Y = -X$ sinon.

    **1.** Déterminer la loi de $Y$, et exprimer $\operatorname{Cov}(X, Y)$ à l'aide de $\Phi$. Montrer qu'il existe un unique $\alpha$ pour lequel cette covariance est nulle (on en donnera une valeur approchée).

    **2.** Pour cette valeur, $X$ et $Y$ sont-elles indépendantes ? Le couple $(X, Y)$ est-il gaussien ? Que montre cet exemple sur le théorème 4 ?

    **3.** Comparer avec l'exemple $(X, \varepsilon X)$ du cours.
  corrige: |
    **1.** Pour un borélien $B$, par symétrie de la loi de $X$ et de l'ensemble $\{|x| > \alpha\}$, 
    $$\mathbb{P}(Y \in B) = \mathbb{P}(X \in B, |X| \leqslant \alpha) + \mathbb{P}(-X \in B, |X| > \alpha),$$
     et le second terme vaut $\mathbb{P}(X \in B, |X| > \alpha)$ : $\mathbb{P}(Y \in B) = \mathbb{P}(X \in B)$, et $\boxed{Y \sim \mathcal{N}(0, 1)}$. Ensuite $\operatorname{Cov}(X, Y) = \mathbb{E}[X^{2}\mathbf{1}_{\{|X| \leqslant \alpha\}}] - \mathbb{E}[X^{2}\mathbf{1}_{\{|X| > \alpha\}}] = 2\,\mathbb{E}[X^{2}\mathbf{1}_{\{|X| \leqslant \alpha\}}] - 1$, et une intégration par parties donne, avec $\Phi'$ la densité normale, 
    $$\mathbb{E}[X^{2}\mathbf{1}_{\{|X| \leqslant \alpha\}}] = \int_{-\alpha}^{\alpha}x \cdot x\Phi'(x)\,\mathrm{d} x = 2\Phi(\alpha) - 1 - 2\alpha\Phi'(\alpha), \qquad \boxed{\operatorname{Cov}(X, Y) = 4\Phi(\alpha) - 3 - 4\alpha\Phi'(\alpha)}.$$
     Cette fonction de $\alpha$ a pour dérivée $4\alpha^{2}\Phi'(\alpha) > 0$ ; elle croît strictement de $-1$ (en $0$) à $1$ (en $+\infty$), et s'annule pour un unique $\boxed{\alpha_{0} \approx 1{,}538}$.

    1.5em

    ![Figure](documents/figures/7f5ecbc8477f1d55.svg)

    La covariance de $X$ et $Y$ en fonction de $\alpha$ : de $-1$ ($Y = -X$) à $1$ ($Y = X$), elle s'annule en $\alpha_{0}$, où les deux variables, pourtant liées par $|Y| = |X|$, sont non corrélées.

    **2.** Non : $|Y| = |X|$, donc par exemple $\mathbb{P}(|X| \leqslant 1, |Y| > 1) = 0 \neq \mathbb{P}(|X| \leqslant 1)\mathbb{P}(|Y| > 1)$ : $X$ et $Y$ 
    $$\boxed{\text{ne sont pas indépendantes}}.$$
     Le couple n'est pas gaussien : $X + Y = 2X\mathbf{1}_{\{|X| \leqslant \alpha\}}$ est bornée et non constante, donc ne suit aucune loi normale, alors que toute combinaison linéaire des composantes d'un vecteur gaussien est normale (prop. 5). Le th. 4 suppose que le *vecteur* est gaussien : des composantes normales non corrélées ne sont pas forcément indépendantes.

    **3.** Dans l'exemple $(X, \varepsilon X)$ du cours, la non-corrélation vient de l'indépendance du signe $\varepsilon$ ; ici, $Y$ est une fonction déterministe de $X$, et la covariance n'est nulle que pour une valeur particulière de $\alpha$. Dans les deux cas $|Y| = |X|$, et $X + Y$ a une loi non normale (avec un atome en $0$ de masse $\frac{1}{2}$ dans l'exemple du cours, bornée ici).
- id: "l3-pr-10-04"
  feuille: "f-l3-pr-10"
  numero: 4
  partie: "Vecteurs gaussiens, covariance"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [vecteurs gaussiens]
  noeuds: [p-normale, fo-caracteristiques]
  notions: [loi-normale, covariance]
  source: "Durand, exercices 6.2, 6.6 et 6.13"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    *(Somme et différence.)*

    **1.** Soit $\rho \in [-1, 1]$ et ${(X, Y)}^{T} \sim \mathcal{N}\big(0, \begin{pmatrix} 1 & \rho \\ \rho & 1 \end{pmatrix}\big)$. Déterminer la loi de $W = {(X + Y, X - Y)}^{T}$, et celles de $X + Y$ et $X - Y$. Sont-elles indépendantes ?

    **2.** Soient $X$ et $Y$ des vecteurs gaussiens de $\mathbb{R}^{d}$, indépendants, centrés et de même loi. Montrer que $X + Y$ et $X - Y$ sont des vecteurs gaussiens indépendants et de même loi.

    **3.** Soient $X$ et $Y$ des variables normales indépendantes. À quelle condition $X + Y$ et $X - Y$ sont-elles indépendantes ?

    **4.** On suppose $X$ et $Y$ indépendantes de loi $\mathcal{N}(0, 1)$. Calculer les fonctions caractéristiques de $\frac{X^{2}}{2}$, de $\frac{X^{2} - Y^{2}}{2}$ et de $XY$. En déduire que $\frac{X^{2} - Y^{2}}{2}$ a même loi que le produit de deux variables indépendantes de loi $\mathcal{N}(0, 1)$, et l'expliquer à l'aide de la question 1.
  corrige: |
    **1.** $W = A{(X, Y)}^{T}$ avec $A = \begin{pmatrix} 1 & 1 \\ 1 & -1 \end{pmatrix}$ : $W$ est gaussien (prop. 5), centré, de covariance 
    $$A\Gamma{A}^{T} = \begin{pmatrix} 2(1 + \rho) & 0 \\ 0 & 2(1 - \rho) \end{pmatrix} : \qquad \boxed{X + Y \sim \mathcal{N}(0, 2(1 + \rho)), \quad X - Y \sim \mathcal{N}(0, 2(1 - \rho))},$$
     et ces variables sont $\boxed{\text{indépendantes}}$ (th. 4), y compris dans les cas dégénérés $\rho = \pm 1$.

    **2.** $(X, Y)$ est un vecteur gaussien de $\mathbb{R}^{2d}$ : sa fonction caractéristique, produit de deux fonctions caractéristiques gaussiennes (prop. 4), est de la forme du th. 2, de covariance $\operatorname{diag}(\Gamma, \Gamma)$. Le vecteur $(X + Y, X - Y)$ en est une image linéaire, donc gaussien, et $\operatorname{Cov}(X + Y, X - Y) = \Gamma - \Gamma = 0$ (par blocs). Par le th. 4 (version par blocs), $\boxed{X + Y \text{ et } X - Y \text{ sont indépendants}}$, et tous deux de loi $\mathcal{N}(0, 2\Gamma)$.

    **3.** Le couple $(X, Y)$ est gaussien (prop. 6), donc aussi $(X + Y, X - Y)$, et la covariance $\operatorname{Cov}(X + Y, X - Y)$ vaut $\operatorname{Var}(X) - \operatorname{Var}(Y)$ : l'indépendance a lieu si et seulement si $X$ et $Y$ ont $\boxed{\text{la même variance}}$.

    **4.** Soit $g(t) = \mathbb{E}[\mathrm{e}^{itX^{2}/2}]$. En dérivant sous l'intégrale puis en intégrant par parties ($x\Phi'(x)$ a pour primitive $-\Phi'(x)$), 
    $$g'(t) = \frac{i}{2}\int x^{2}\mathrm{e}^{itx^{2}/2}\Phi'(x)\,\mathrm{d} x = \frac{i}{2}\int\big(\mathrm{e}^{itx^{2}/2} + itx^{2}\mathrm{e}^{itx^{2}/2}\big)\Phi'(x)\,\mathrm{d} x = \frac{i}{2}g(t) + itg'(t),$$
     donc $(1 - it)g' = \frac{i}{2}g$, $g(0) = 1$, et $\boxed{\varphi_{X^{2}/2}(t) = (1 - it)^{-1/2}}$ (racine principale, comme au chapitre 6 pour la loi normale). Par indépendance, $\varphi_{(X^{2} - Y^{2})/2}(t) = (1 - it)^{-1/2}(1 + it)^{-1/2} = \boxed{(1 + t^{2})^{-1/2}}$. Enfin, par Fubini, $\mathbb{E}[\mathrm{e}^{itXY}] = \mathbb{E}\big[\mathbb{E}[\mathrm{e}^{itXy}]_{y = Y}\big] = \mathbb{E}[\mathrm{e}^{-t^{2}Y^{2}/2}] = \boxed{(1 + t^{2})^{-1/2}}$, en calculant $\int\mathrm{e}^{-t^{2}y^{2}/2}\Phi'(y)\,\mathrm{d} y$. Les deux variables ont la même fonction caractéristique, donc $\boxed{\text{la même loi}}$ (chapitre 6, th. 1). La question 1 l'explique : avec $\rho = 0$, $U = \frac{X + Y}{\sqrt{2}}$ et $V = \frac{X - Y}{\sqrt{2}}$ sont indépendantes de loi $\mathcal{N}(0, 1)$, et $UV = \frac{X^{2} - Y^{2}}{2}$ exactement.
- id: "l3-pr-10-05"
  feuille: "f-l3-pr-10"
  numero: 5
  partie: "Vecteurs gaussiens, covariance"
  etoiles: 2
  types: [Calcul]
  mots_cles: [vecteurs gaussiens]
  noeuds: [p-normale, fo-caracteristiques]
  notions: [loi-normale, covariance, coordonnees-polaires]
  source: "Durand, exercice 6.1"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $\rho \in \,]-1, 1[$ et ${(X_{1}, X_{2})}^{T}$ de densité 
    $$f(x_{1}, x_{2}) = \frac{1}{2\pi\sqrt{1 - \rho^{2}}}\exp\Big(-\frac{x_{1}^{2} - 2\rho x_{1}x_{2} + x_{2}^{2}}{2(1 - \rho^{2})}\Big).$$

    **1.** Vérifier que $f$ est une densité, déterminer les lois marginales, les espérances, les variances et la covariance. À quelle condition $X_{1}$ et $X_{2}$ sont-elles indépendantes ?

    **2.** On note $(R, \Theta)$ les coordonnées polaires de $(X_{1}, X_{2})$, avec $\Theta \in [0, 2\pi[$. Déterminer la densité de $(R, \Theta)$, puis celle de $\Theta$. Pour quelles directions cette densité est-elle maximale ? Interpréter.

    **3.** Déterminer la densité de $R$ lorsque $\rho = 0$. Que dire alors de $R$ et $\Theta$ ?

    **4.** Mêmes questions qu'en 1 pour le couple de densité $g(x, y) = \frac{\sqrt{1 - \rho^{2}}}{2\pi}\exp\big(-\frac{x^{2} - 2\rho xy + y^{2}}{2}\big)$.
  corrige: |
    **1.** Avec $\Gamma = \begin{pmatrix} 1 & \rho \\ \rho & 1 \end{pmatrix}$, de déterminant $1 - \rho^{2}$ et d'inverse $\frac{1}{1 - \rho^{2}}\begin{pmatrix} 1 & -\rho \\ -\rho & 1 \end{pmatrix}$, $f$ est la densité de $\mathcal{N}(0, \Gamma)$ (th. 5) ; directement, $x_{1}^{2} - 2\rho x_{1}x_{2} + x_{2}^{2} = (x_{2} - \rho x_{1})^{2} + (1 - \rho^{2})x_{1}^{2}$, et l'intégration en $x_{2}$ donne la densité $\Phi'(x_{1})$, puis l'intégrale totale $1$. Ainsi $\boxed{X_{1}, X_{2} \sim \mathcal{N}(0, 1)}$, $\boxed{\operatorname{Cov}(X_{1}, X_{2}) = \rho}$, et elles sont indépendantes si et seulement si $\boxed{\rho = 0}$ (th. 4).

    **2.** En polaires, $x_{1}^{2} - 2\rho x_{1}x_{2} + x_{2}^{2} = r^{2}(1 - \rho\sin 2\theta)$ et $\mathrm{d} x_{1}\mathrm{d} x_{2} = r\,\mathrm{d} r\,\mathrm{d}\theta$ (chapitre 7, th. 1) : 
    $$f_{(R, \Theta)}(r, \theta) = \frac{r}{2\pi\sqrt{1 - \rho^{2}}}\exp\Big(-\frac{r^{2}(1 - \rho\sin 2\theta)}{2(1 - \rho^{2})}\Big), \qquad \boxed{f_{\Theta}(\theta) = \frac{\sqrt{1 - \rho^{2}}}{2\pi(1 - \rho\sin 2\theta)}},$$
     en intégrant en $r$ ($\int_{0}^{+\infty}r\mathrm{e}^{-cr^{2}}\mathrm{d} r = \frac{1}{2c}$). Pour $\rho > 0$, elle est maximale pour $\sin 2\theta = 1$, soit $\theta = \frac{\pi}{4}$ ou $\frac{5\pi}{4}$ : la direction de la première bissectrice, autour de laquelle s'allongent les nuages de points positivement corrélés ; pour $\rho < 0$, c'est la seconde bissectrice.

    1.5em

    ![Figure](documents/figures/39edd7d76e591c91.svg)

    La densité de l'angle polaire $\Theta$ pour $\rho = 0{,}5$ (en bleu) et $\rho = -0{,}8$ (en orange), comparée à la densité uniforme $\frac{1}{2\pi}$ (en tirets). Plus $|\rho|$ est grand, plus les directions se concentrent autour de la bissectrice correspondante.

    **3.** Pour $\rho = 0$, $f_{(R, \Theta)}(r, \theta) = \frac{1}{2\pi}\cdot r\mathrm{e}^{-r^{2}/2}$ : densité produit, donc 
    $$\boxed{R \text{ et } \Theta \text{ indépendantes}},$$
     $\Theta$ uniforme sur $[0, 2\pi[$ et $R$ de densité $\boxed{r\mathrm{e}^{-r^{2}/2}}$ sur $]0, +\infty[$ (chapitre 7, prop. 5).

    **4.** Ici la forme quadratique a pour matrice $M = \begin{pmatrix} 1 & -\rho \\ -\rho & 1 \end{pmatrix}$, de déterminant $1 - \rho^{2}$ : $g$ est la densité de $\mathcal{N}(0, M^{-1})$, avec $M^{-1} = \frac{1}{1 - \rho^{2}}\begin{pmatrix} 1 & \rho \\ \rho & 1 \end{pmatrix}$. Les marginales sont $\boxed{\mathcal{N}\big(0, \frac{1}{1 - \rho^{2}}\big)}$, la covariance vaut $\boxed{\frac{\rho}{1 - \rho^{2}}}$ (corrélation $\rho$), et l'indépendance a lieu si et seulement si $\rho = 0$. L'erreur la plus répandue est de lire la covariance directement sur l'exposant : c'est l'*inverse* de $\Gamma$ qui y figure.
- id: "l3-pr-10-06"
  feuille: "f-l3-pr-10"
  numero: 6
  partie: "Vecteurs gaussiens, covariance"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [vecteurs gaussiens, régression]
  noeuds: [p-normale, fo-caracteristiques, p-esperance]
  notions: [loi-normale, covariance]
  source: "Durand, exercices 6.9 et 5.33"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    *(Régression.)*

    **1.** Soit ${(Y, X_{1}, \dots, X_{n})}^{T}$ un vecteur gaussien centré ; on suppose inversible la matrice de covariance $\Gamma$ de $X = {(X_{1}, \dots, X_{n})}^{T}$, et l'on pose $u_{j} = \mathbb{E}[YX_{j}]$. Déterminer l'unique vecteur $\hat{a}$ qui minimise $\mathbb{E}[(Y - \langle a, X\rangle)^{2}]$. Montrer que le résidu $Z = Y - \langle\hat{a}, X\rangle$ est indépendant de $X$, et donner sa loi.

    **2.** Appliquer à $Y = Y_{1}$ et $X = {(Y_{2}, Y_{3})}^{T}$, lorsque la matrice de covariance de $(Y_{1}, Y_{2}, Y_{3})$ est 
    $$\begin{pmatrix} 4 & 1 & 2 \\ 1 & 9 & -3 \\ 2 & -3 & 4 \end{pmatrix}, \qquad \text{puis} \qquad \begin{pmatrix} 9 & 3 & 3/2 \\ 3 & 4 & 1 \\ 3/2 & 1 & 1 \end{pmatrix}.$$
     Dans le premier cas, déterminer $K$ tel que $\mathbb{P}(|Z| > K) = 0{,}05$.

    **3.** *Sans hypothèse gaussienne.* On choisit au hasard, uniformément, l'un des $n$ points $(x_{i}, y_{i})$ d'un nuage, et l'on note $(X, Y)$ ses coordonnées. Déterminer la droite de régression de $Y$ en $X$ (chapitre 5, prop. 7), et montrer qu'elle minimise $\sum_{i}(y_{i} - ax_{i} - b)^{2}$. Que se passe-t-il si tous les $x_{i}$ sont égaux ?
  corrige: |
    **1.** $\mathbb{E}[(Y - \langle a, X\rangle)^{2}] = \mathbb{E}[Y^{2}] - 2\langle a, u\rangle + {a}^{T}\Gamma a$ est une fonction quadratique de $a$, strictement convexe ($\Gamma$ définie positive), de gradient $2(\Gamma a - u)$ : elle est minimale en l'unique point $\boxed{\hat{a} = \Gamma^{-1}u}$. Le vecteur $(Z, X)$, image linéaire de $(Y, X)$, est gaussien, et $\operatorname{Cov}(Z, X_{j}) = u_{j} - (\Gamma\hat{a})_{j} = 0$ : par le th. 4 (par blocs), 
    $$\boxed{Z \text{ est indépendant de } X}.$$
     Il est centré, de variance $\mathbb{E}[Y^{2}] - 2\langle\hat{a}, u\rangle + {\hat{a}}^{T}\Gamma\hat{a}$, soit $\boxed{Z \sim \mathcal{N}(0, \mathbb{E}[Y^{2}] - {u}^{T}\Gamma^{-1}u)}$. Ainsi $Y = \langle\hat{a}, X\rangle + Z$ : pour un vecteur gaussien, la meilleure prédiction de $Y$ à partir de $X$ est linéaire, et l'erreur est indépendante de $X$.

    **2.** *Premier cas :* $\Gamma = \begin{pmatrix} 9 & -3 \\ -3 & 4 \end{pmatrix}$, $u = (1, 2)$, $\Gamma^{-1} = \frac{1}{27}\begin{pmatrix} 4 & 3 \\ 3 & 9 \end{pmatrix}$, d'où $\boxed{\hat{a} = \big(\frac{10}{27}, \frac{7}{9}\big)}$ et $\operatorname{Var}(Z) = 4 - \frac{10}{27} - \frac{14}{9} = \boxed{\frac{56}{27} \approx 2{,}07}$. Alors $\mathbb{P}(|Z| > K) = 0{,}05$ pour $\boxed{K = 1{,}96\sqrt{56/27} \approx 2{,}82}$.

    *Second cas :* 
    $$\Gamma = \begin{pmatrix} 4 & 1 \\ 1 & 1 \end{pmatrix}, \qquad u = \Big(3, \frac{3}{2}\Big), \qquad \Gamma^{-1} = \frac{1}{3}\begin{pmatrix} 1 & -1 \\ -1 & 4 \end{pmatrix},$$
     d'où $\boxed{\hat{a} = \big(\frac{1}{2}, 1\big)}$ et $\operatorname{Var}(Z) = 9 - \frac{3}{2} - \frac{3}{2} = \boxed{6}$.

    **3.** $(X, Y)$ suit la loi uniforme sur les $n$ points (comptés avec multiplicité), et la droite de régression (chapitre 5, prop. 7) est 
    $$\boxed{y = \bar{y} + \frac{c_{xy}}{s_{x}^{2}}(x - \bar{x})}, \qquad \bar{x} = \frac{1}{n}\sum_{i}x_{i}, \quad s_{x}^{2} = \frac{1}{n}\sum_{i}(x_{i} - \bar{x})^{2}, \quad c_{xy} = \frac{1}{n}\sum_{i}(x_{i} - \bar{x})(y_{i} - \bar{y}).$$
     Comme $\sum_{i}(y_{i} - ax_{i} - b)^{2} = n\,\mathbb{E}[(Y - aX - b)^{2}]$, elle minimise cette somme. Géométriquement, $(a\vec{x} + b\vec{1})$ est la projection orthogonale du vecteur $\vec{y} \in \mathbb{R}^{n}$ sur le plan engendré par $\vec{x}$ et $\vec{1} = (1, \dots, 1)$. Si tous les $x_{i}$ sont égaux, $s_{x} = 0$ : tous les $(a, b)$ tels que $a\bar{x} + b = \bar{y}$ réalisent le minimum, et la droite de régression n'est pas définie ; les points sont alignés sur une verticale, et seule la régression de $X$ en $Y$ a un sens.
- id: "l3-pr-10-07"
  feuille: "f-l3-pr-10"
