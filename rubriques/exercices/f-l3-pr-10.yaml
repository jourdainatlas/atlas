  source: "Durand, exercice 6.7"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    *(Sphères de grande dimension.)* Soient $Y_{1}$, …, $Y_{n}$ indépendantes de loi $\mathcal{N}(0, 1)$, $Y = {(Y_{1}, \dots, Y_{n})}^{T}$ et $X_{n} = \frac{Y}{\|Y\|}$.

    **1.** Montrer que la loi de $X_{n}$ est invariante par toute transformation orthogonale : $X_{n}$ est uniforme sur la sphère unité de $\mathbb{R}^{n}$ (on admettra qu'une telle loi est unique).

    **2.** Soit $Z_{n}$ uniforme sur la sphère de rayon $\sqrt{n}$. Montrer que, pour $p$ fixé, le vecteur de ses $p$ premières coordonnées converge en loi vers $\mathcal{N}(0, I_{p})$ (théorème de Poincaré). Comparer à l'exercice 2 de la feuille 9.
  corrige: |
    **1.** Soit $O$ orthogonale. $OY \sim \mathcal{N}(0, O{O}^{T}) = \mathcal{N}(0, I_{n})$ (th. 3), et $\|OY\| = \|Y\|$, donc $OX_{n} = \frac{OY}{\|OY\|}$ a même loi que $\frac{Y}{\|Y\|} = X_{n}$ ($Y \neq 0$ presque sûrement). La loi de $X_{n}$, portée par la sphère unité, est invariante par les transformations orthogonales : c'est 
    $$\boxed{\text{la loi uniforme sur la sphère}}.$$

    **2.** Soit $(Y_{k})_{k \geqslant 1}$ une suite de variables indépendantes de loi $\mathcal{N}(0, 1)$. Par la question 1, $Z_{n}$ a même loi que $\sqrt{n}\frac{(Y_{1}, \dots, Y_{n})}{\|(Y_{1}, \dots, Y_{n})\|}$, dont les $p$ premières coordonnées sont 
    $$\frac{(Y_{1}, \dots, Y_{p})}{\sqrt{\frac{1}{n}\sum_{k = 1}^{n}Y_{k}^{2}}} \xrightarrow[n \to +\infty]{\text{p.s.}} (Y_{1}, \dots, Y_{p}),$$
     car $\frac{1}{n}\sum Y_{k}^{2} \to 1$ presque sûrement (loi forte). La convergence presque sûre entraîne la convergence en loi (par convergence dominée dans $\mathbb{E}[h(\cdot)]$), d'où la limite $\boxed{\mathcal{N}(0, I_{p})}$. Comme à l'exercice 2 de la feuille 9, la norme d'un vecteur gaussien de grande dimension est concentrée autour de $\sqrt{n}$ : la sphère de rayon $\sqrt{n}$ « ressemble » à la loi $\mathcal{N}(0, I_{n})$, et ses projections sur un petit nombre de coordonnées sont presque gaussiennes.
- id: "l3-pr-10-08"
  feuille: "f-l3-pr-10"
  numero: 8
  partie: "Calculs gaussiens"
