- id: "l3-pr-10-01"
  feuille: "f-l3-pr-10"
  numero: 1
  partie: "Vecteurs gaussiens, covariance"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [vecteurs gaussiens]
  noeuds: [p-normale, fo-caracteristiques]
  notions: [loi-normale, covariance]
  source: "Durand (Orsay), exercices 6.3 et 6.4"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** À quelles conditions sur $a$, $b$, $c$, $d$ la matrice $\Gamma = \begin{pmatrix} a & b \\ c & d \end{pmatrix}$ est-elle la matrice de covariance d'un vecteur aléatoire ?

    **2.** On suppose ces conditions remplies, et l'on se donne $X$ et $Y$ indépendantes de loi $\mathcal{N}(0, 1)$. Construire à partir de $X$ et $Y$ un vecteur gaussien $Z$ de matrice de covariance $\Gamma$, sous la forme $Z = A{(X, Y)}^{T}$ avec $A$ triangulaire inférieure. À quelles conditions $Z$ a-t-il une densité ? A-t-il des composantes indépendantes ?

    **3.** Plus généralement, soit $X \sim \mathcal{N}(m, \Sigma)$ dans $\mathbb{R}^{d}$, où $\Sigma$ est de rang $p$. Montrer qu'il existe une matrice $A$ de taille $d \times p$ et de rang $p$ telle que $AY + m$ ait même loi que $X$, où $Y \sim \mathcal{N}(0, I_{p})$. Montrer que $X - m$ appartient presque sûrement à l'image de $\Sigma$.
  corrige: |
    **1.** Une matrice de covariance est symétrique, et positive car ${t}^{T}\Gamma t = \operatorname{Var}\langle t, X\rangle \geqslant 0$ (prop. 3). Pour $\Gamma = \begin{pmatrix} a & b \\ c & d \end{pmatrix}$, cela s'écrit 
    $$\boxed{b = c, \qquad a \geqslant 0, \qquad d \geqslant 0, \qquad ad - b^{2} \geqslant 0}.$$
     Réciproquement, ces conditions suffisent : la question 2 construit un vecteur de covariance $\Gamma$.

    **2.** Si $a > 0$, on pose 
    $$A = \begin{pmatrix} \sqrt{a} & 0 \\ \frac{b}{\sqrt{a}} & \sqrt{\frac{ad - b^{2}}{a}} \end{pmatrix}, \qquad A{A}^{T} = \begin{pmatrix} a & b \\ b & \frac{b^{2}}{a} + \frac{ad - b^{2}}{a} \end{pmatrix} = \Gamma ;$$
     si $a = 0$, alors $b = 0$, et la matrice diagonale de coefficients $0$ et $\sqrt{d}$ convient. Le vecteur $\boxed{Z = A{(X, Y)}^{T}}$, soit $Z = \big(\sqrt{a}X, \frac{b}{\sqrt{a}}X + \sqrt{\frac{ad - b^{2}}{a}}\,Y\big)$ si $a > 0$, est gaussien de covariance $A{A}^{T} = \Gamma$ (prop. 5) : c'est la décomposition de Cholesky. Il a une densité si et seulement si $\Gamma$ est inversible (th. 5), c'est-à-dire $\boxed{ad > b^{2}}$, et ses composantes sont indépendantes si et seulement si $\boxed{b = 0}$ (th. 4).

    **3.** $\Sigma$ est symétrique positive de rang $p$ : 
    $$\Sigma = PD{P}^{T}, \qquad P \text{ orthogonale}, \qquad D = \operatorname{diag}(\lambda_{1}, \dots, \lambda_{p}, 0, \dots, 0), \quad \lambda_{i} > 0.$$
     Soit $A$ la matrice $d \times p$ formée des $p$ premières colonnes de $P$, multipliées par $\sqrt{\lambda_{1}}$, …, $\sqrt{\lambda_{p}}$ : elle est de rang $p$, et $A{A}^{T} = \Sigma$. Donc $AY + m \sim \mathcal{N}(m, \Sigma)$ (prop. 5), qui est la loi de $X$ (th. 1 et 2). Pour $u \in \ker\Sigma$, $\operatorname{Var}\langle u, X\rangle = {u}^{T}\Sigma u = 0$, donc $\langle u, X - m\rangle = 0$ presque sûrement ; une base de $\ker\Sigma$ étant finie, $X - m \in (\ker\Sigma)^{\perp} = \boxed{\operatorname{Im}\Sigma}$ presque sûrement. Si $p < d$, $X$ vit dans un sous-espace affine de mesure nulle, et n'a pas de densité ; si $p = d$, sa densité est celle du th. 5.
