  noeuds: [fo-tcl, fo-levy]
  notions: [convergence-loi]
  source: "Durand, exercice 5.11"
  page_enonce: 5
  page_corrige: 10
  enonce: |
    *(Méthode delta.)*

    **1.** Soit $(Y_{n})$ une suite de vecteurs aléatoires de $\mathbb{R}^{d}$ telle que $\sqrt{n}(Y_{n} - m) \xrightarrow{\mathcal{L}} \mathcal{N}(0, \Gamma)$, et $f : \mathbb{R}^{d} \to \mathbb{R}^{d'}$ borélienne, différentiable en $m$, de matrice jacobienne $J$ en $m$. Montrer que $\sqrt{n}\big(f(Y_{n}) - f(m)\big) \xrightarrow{\mathcal{L}} \mathcal{N}(0, J\Gamma{J}^{T})$.

    **2.** *Application.* Soient $(X_{k})$ indépendantes de même loi, d'espérance $\mu$, de variance $\sigma^{2}$, avec $\mathbb{E}[X_{1}^{4}] < +\infty$, et $\mu_{4} = \mathbb{E}[(X_{1} - \mu)^{4}]$. Montrer que la variance empirique $V_{n} = \frac{1}{n}\sum_{k}(X_{k} - \bar{X}_{n})^{2}$ vérifie $\sqrt{n}(V_{n} - \sigma^{2}) \xrightarrow{\mathcal{L}} \mathcal{N}(0, \mu_{4} - \sigma^{4})$. Vérifier la cohérence avec le théorème 7 lorsque la loi est normale.
  corrige: |
    **1.** Par différentiabilité, $f(y) - f(m) = J(y - m) + \|y - m\|\,\varepsilon(y)$, avec $\varepsilon(m) = 0$ et $\varepsilon$ continue en $m$ (et borélienne, $f$ l'étant). Donc 
    $$\sqrt{n}\big(f(Y_{n}) - f(m)\big) = J\sqrt{n}(Y_{n} - m) + \|\sqrt{n}(Y_{n} - m)\|\,\varepsilon(Y_{n}).$$
     Le premier terme converge en loi vers la loi $\mathcal{N}(0, J\Gamma{J}^{T})$, par image continue et prop. 5. Ensuite $Y_{n} - m = \frac{1}{\sqrt{n}}\sqrt{n}(Y_{n} - m) \to 0$ en probabilité (exercice 14 (2), coordonnée par coordonnée), donc $\varepsilon(Y_{n}) \to 0$ en probabilité, et le second terme, produit d'une suite convergeant en loi et d'une suite tendant vers $0$ en probabilité, tend vers $0$ en probabilité (exercice 14 (2)). La même question, en dimension $d'$ (démonstration identique), donne $\boxed{\sqrt{n}\big(f(Y_{n}) - f(m)\big) \xrightarrow{\mathcal{L}} \mathcal{N}(0, J\Gamma{J}^{T})}$.

    **2.** $V_{n}$ ne change pas si l'on translate les $X_{k}$ : on suppose $\mu = 0$. Les vecteurs $Z_{k} = (X_{k}, X_{k}^{2})$ sont indépendants, de même loi, d'espérance $(0, \sigma^{2})$ et de covariance $\Gamma = \begin{pmatrix} \sigma^{2} & \mathbb{E}[X^{3}] \\ \mathbb{E}[X^{3}] & \mu_{4} - \sigma^{4} \end{pmatrix}$. Par le th. 8, $\sqrt{n}\big(\bar{Z}_{n} - (0, \sigma^{2})\big) \xrightarrow{\mathcal{L}} \mathcal{N}(0, \Gamma)$. Or $V_{n} = f(\bar{Z}_{n})$ avec $f(a, b) = b - a^{2}$, de jacobienne $(-2a, 1) = (0, 1)$ en $(0, \sigma^{2})$ : $J\Gamma{J}^{T} = \mu_{4} - \sigma^{4}$, et $\boxed{\sqrt{n}(V_{n} - \sigma^{2}) \xrightarrow{\mathcal{L}} \mathcal{N}(0, \mu_{4} - \sigma^{4})}$. Pour la loi normale, $\mu_{4} = 3\sigma^{4}$ et la variance limite vaut $2\sigma^{4}$ ; c'est cohérent avec le th. 7, puisque $\frac{nV_{n}}{\sigma^{2}} \sim \chi^{2}(n - 1)$, d'espérance $n - 1$ et de variance $2(n - 1)$.
- id: "l3-pr-10-16"
  feuille: "f-l3-pr-10"
