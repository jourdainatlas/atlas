  source: "Durand, exercice 6.8"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soient $X$ et $Y$ indépendantes de loi $\mathcal{N}(0, 1)$ et $Z = \sqrt{X^{2} + Y^{2}}$. Rappeler la loi de $Z^{2}$ (chapitre 7) ; en déduire la fonction de répartition, l'espérance et la variance de $Z$. Soient $X_{1}$, …, $X_{2n}$ indépendantes de loi $\mathcal{N}(0, 1)$ et $Z_{j} = \sqrt{X_{2j - 1}^{2} + X_{2j}^{2}}$. Déterminer $\beta$ pour que $\frac{1}{\sqrt{n}}\big(\sum_{j = 1}^{n}Z_{j} - n\beta\big)$ converge en loi, et préciser la limite.
  corrige: |
    $Z^{2} = X^{2} + Y^{2} \sim \mathcal{E}(\frac{1}{2})$ (chapitre 7, prop. 5), donc $\boxed{\mathbb{P}(Z \leqslant z) = 1 - \mathrm{e}^{-z^{2}/2}}$ pour $z \geqslant 0$. Par le chapitre 4 (prop. 6), 
    $$\mathbb{E}[Z] = \int_{0}^{+\infty}\mathrm{e}^{-z^{2}/2}\,\mathrm{d} z = \boxed{\sqrt{\frac{\pi}{2}}} \approx 1{,}253, \qquad \mathbb{E}[Z^{2}] = 2, \qquad \boxed{\operatorname{Var}(Z) = 2 - \frac{\pi}{2}} \approx 0{,}429.$$
     Les $Z_{j}$ sont indépendantes, de cette loi (fonctions de paquets disjoints) : par le th. 3 du chapitre 9, avec $\boxed{\beta = \sqrt{\frac{\pi}{2}}}$, $\frac{1}{\sqrt{n}}\big(\sum_{j}Z_{j} - n\beta\big) \xrightarrow{\mathcal{L}} \boxed{\mathcal{N}\big(0, 2 - \frac{\pi}{2}\big)}$. Pour tout autre $\beta$, la suite tend vers $\pm\infty$ en probabilité (feuille 9, exercice 21).
- id: "l3-pr-10-10"
  feuille: "f-l3-pr-10"
  numero: 10
  partie: "Calculs gaussiens"
  etoiles: 3
  types: [Calcul]
  mots_cles: [calculs gaussiens]
  noeuds: [p-normale]
  notions: [loi-normale, fonction-caracteristique]
  source: "Durand, exercice 6.12"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    *(Une caractérisation de la loi normale.)* Soient $n \geqslant 2$ et $X_{1}$, …, $X_{n}$ indépendantes, de même loi, de carré intégrable, non constantes ; $S_{n} = \sum_{i}X_{i}$ et $V_{n} = \sum_{i}X_{i}^{2} - \frac{S_{n}^{2}}{n}$. On sait (théorème 7) que, si la loi commune est normale, $S_{n}$ et $V_{n}$ sont indépendantes. On montre la réciproque.

    **1.** On suppose $S_{n}$ et $V_{n}$ indépendantes, et d'abord $\mathbb{E}[X_{1}] = 0$, $\operatorname{Var}(X_{1}) = 1$. Calculer $\mathbb{E}[V_{n}]$, puis $\mathbb{E}[V_{n}\mathrm{e}^{itS_{n}}]$ de deux manières, en fonction de la fonction caractéristique $\varphi$ de $X_{1}$ et de ses dérivées.

    **2.** En déduire que $\varphi\varphi'' - \varphi'^{2} = -\varphi^{2}$ sur tout intervalle où $\varphi$ ne s'annule pas, puis que $\varphi(t) = \mathrm{e}^{-t^{2}/2}$ sur le plus grand intervalle ouvert contenant $0$ où $\varphi$ ne s'annule pas, et enfin que cet intervalle est $\mathbb{R}$.

    **3.** Traiter le cas général.
  corrige: |
    **1.** $\mathbb{E}[V_{n}] = \sum_{i}\mathbb{E}[X_{i}^{2}] - \frac{\mathbb{E}[S_{n}^{2}]}{n} = n - 1$. Par indépendance de $V_{n}$ et $S_{n}$, $\mathbb{E}[V_{n}\mathrm{e}^{itS_{n}}] = \boxed{(n - 1)\varphi(t)^{n}}$. D'autre part, $V_{n} = \big(1 - \frac{1}{n}\big)\sum_{i}X_{i}^{2} - \frac{1}{n}\sum_{i \neq j}X_{i}X_{j}$, et $\varphi$ est de classe $\mathcal{C}^{2}$ (chapitre 6, prop. 8), avec $\mathbb{E}[X\mathrm{e}^{itX}] = -i\varphi'(t)$ et $\mathbb{E}[X^{2}\mathrm{e}^{itX}] = -\varphi''(t)$. Par indépendance des $X_{i}$, 
    $$\mathbb{E}[V_{n}\mathrm{e}^{itS_{n}}] = \Big(1 - \frac{1}{n}\Big)n\big(-\varphi''\varphi^{n - 1}\big) - \frac{n(n - 1)}{n}\big(-i\varphi'\big)^{2}\varphi^{n - 2} = \boxed{(n - 1)\big(\varphi'^{2}\varphi^{n - 2} - \varphi''\varphi^{n - 1}\big)}.$$

    **2.** En égalant et en divisant par $(n - 1)\varphi^{n - 2}$ là où $\varphi$ ne s'annule pas, $\boxed{\varphi\varphi'' - \varphi'^{2} = -\varphi^{2}}$. Soit $I$ le plus grand intervalle ouvert contenant $0$ où $\varphi \neq 0$ (il existe, car $\varphi(0) = 1$ et $\varphi$ est continue). Sur $I$, $\big(\frac{\varphi'}{\varphi}\big)' = \frac{\varphi''\varphi - \varphi'^{2}}{\varphi^{2}} = -1$, et $\frac{\varphi'(0)}{\varphi(0)} = i\mathbb{E}[X_{1}] = 0$, donc $\varphi' = -t\varphi$, puis $(\varphi(t)\mathrm{e}^{t^{2}/2})' = 0$ et $\boxed{\varphi(t) = \mathrm{e}^{-t^{2}/2}}$ sur $I$. Si $I$ était majoré, de borne supérieure $T$, la continuité donnerait $\varphi(T) = \mathrm{e}^{-T^{2}/2} \neq 0$, et $\varphi$ ne s'annulerait pas sur un voisinage de $T$, contredisant la maximalité ; de même à gauche. Donc $I = \mathbb{R}$, et $X_{1} \sim \mathcal{N}(0, 1)$ (chapitre 6, th. 1).

    **3.** Soit $m = \mathbb{E}[X_{1}]$ et $\sigma^{2} = \operatorname{Var}(X_{1}) > 0$ ($X_{1}$ n'est pas constante), et $X_{i}' = \frac{X_{i} - m}{\sigma}$. Alors $S_{n}' = \frac{S_{n} - nm}{\sigma}$ et $V_{n}' = \frac{V_{n}}{\sigma^{2}}$, car $V_{n} = \sum_{i}(X_{i} - \bar{X}_{n})^{2}$ ne change pas par translation. Fonctions respectives de $S_{n}$ et $V_{n}$, elles sont indépendantes, et la question 2 donne $X_{1}' \sim \mathcal{N}(0, 1)$, soit $\boxed{X_{1} \sim \mathcal{N}(m, \sigma^{2})}$. L'indépendance de la moyenne et de la variance empiriques (avec $V_{n} = (n - 1)S_{n}^{2}$) *caractérise* donc la loi normale ; le théorème de Geary-Lukacs, admis au cours, l'établit sans hypothèse de moment.
- id: "l3-pr-10-11"
  feuille: "f-l3-pr-10"
  numero: 11
  partie: "Statistique des échantillons gaussiens"
  etoiles: 1
  types: [Calcul]
  mots_cles: [échantillons gaussiens]
  noeuds: [p-normale, p-independance]
  notions: [loi-normale]
  source: "Durand, exercice 5.19 (partie intervalle de confiance)"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Soit $X_{1}$, …, $X_{n}$ un échantillon de la loi $\mathcal{N}(m, \sigma^{2})$, et $\alpha \in \,]0, 1[$.

    **1.** Donner la loi de $\bar{X}_{n}$, et construire un intervalle de confiance de niveau exactement $1 - \alpha$ pour $m$ lorsque $\sigma$ est connu.

    **2.** *Application :* on observe $101$, $103$, $99$, $102$, $101$, avec $\sigma = 1$. Donner l'intervalle de niveau $99{,}5\,\%$ ($\Phi(2{,}807) \approx 0{,}9975$). La valeur $m = 100$ lui appartient-elle ?

    **3.** On suppose maintenant $\sigma$ inconnu. Donner l'intervalle de niveau $95\,\%$ fondé sur la loi de Student (le quantile d'ordre $0{,}975$ de $\mathcal{T}(4)$ vaut $2{,}776$), et le comparer à celui qu'on obtiendrait en remplaçant ce quantile par $1{,}96$.
  corrige: |
    **1.** $\boxed{\bar{X}_{n} \sim \mathcal{N}\big(m, \frac{\sigma^{2}}{n}\big)}$ (th. 7). Avec $z$ tel que $\Phi(z) = 1 - \frac{\alpha}{2}$, $\mathbb{P}\big(|\bar{X}_{n} - m| \leqslant \frac{z\sigma}{\sqrt{n}}\big) = 2\Phi(z) - 1 = 1 - \alpha$ exactement, d'où l'intervalle $\boxed{\big[\bar{X}_{n} - \frac{z\sigma}{\sqrt{n}}, \bar{X}_{n} + \frac{z\sigma}{\sqrt{n}}\big]}$.

    **2.** $\bar{x} = 101{,}2$ et $\frac{2{,}807}{\sqrt{5}} \approx 1{,}255$ : l'intervalle est $\boxed{[99{,}94\,;\, 102{,}46]}$. Il contient $100$, de justesse : les observations sont compatibles avec $m = 100$ à ce niveau très exigeant.

    **3.** Les écarts à $101{,}2$ sont $-0{,}2$ ; $1{,}8$ ; $-2{,}2$ ; $0{,}8$ ; $-0{,}2$, d'où $S^{2} = \frac{8{,}8}{4} = 2{,}2$ et $S \approx 1{,}483$. Par le th. 7, $\frac{\sqrt{5}(\bar{X} - m)}{S} \sim \mathcal{T}(4)$, et l'intervalle de Student est $[101{,}2 \pm 2{,}776 \times \frac{1{,}483}{\sqrt{5}}] = \boxed{[99{,}36\,;\, 103{,}04]}$. Avec $1{,}96$ au lieu de $2{,}776$, on obtiendrait $[99{,}90\,;\, 102{,}50]$, trop étroit : son niveau réel est $\mathbb{P}(|\mathcal{T}(4)| \leqslant 1{,}96) \approx 0{,}88$, et non $0{,}95$. Pour un petit échantillon, l'erreur la plus répandue est d'oublier que $S$ est aléatoire.
- id: "l3-pr-10-12"
  feuille: "f-l3-pr-10"
  numero: 12
  partie: "Statistique des échantillons gaussiens"
  etoiles: 2
  types: [Calcul]
  mots_cles: [échantillons gaussiens, loi du khi-deux]
  noeuds: [p-normale, p-independance]
  notions: [loi-normale]
  source: "Durand, exercice 5.32"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    *(Précision d'un dosage.)* Des dosages indépendants $X_{1}$, …, $X_{n}$ suivent la loi $\mathcal{N}(5, \sigma^{2})$, la moyenne $5$ étant connue ; on pose $T_{n}^{2} = \frac{1}{n}\sum_{i}(X_{i} - 5)^{2}$.

    **1.** Déterminer la loi de $\frac{nT_{n}^{2}}{\sigma^{2}}$. Pourquoi a-t-on ici $n$ degrés de liberté, et non $n - 1$ comme au théorème 7 ?

    **2.** Construire un intervalle de confiance de niveau $95\,\%$ pour $\sigma$, à l'aide des quantiles $q_{1}$ et $q_{2}$ d'ordres $0{,}025$ et $0{,}975$ de $\chi^{2}(n)$.

    **3.** On observe $5{,}04$ ; $5{,}13$ ; $5{,}07$ ; $5$ ; $5{,}08$ ; $4{,}99$ ; $5{,}11$ (pour $\chi^{2}(7)$ : $q_{1} \approx 1{,}69$, $q_{2} \approx 16{,}01$). Donner l'intervalle, et calculer la probabilité que $\frac{nT_{n}^{2}}{(0{,}05)^{2}}$ dépasse la valeur observée si $\sigma = 0{,}05$ (elle vaut environ $0{,}019$). La précision annoncée $\sigma \leqslant 0{,}05$ est-elle plausible ?

    **4.** Même question avec $n = 100$ et $T_{100}^{2} = 0{,}003$ (pour $\chi^{2}(100)$ : $q_{1} \approx 74{,}2$, $q_{2} \approx 129{,}6$). Comparer à l'approximation de $\chi^{2}(n)$ par $\mathcal{N}(n, 2n)$ (feuille 9, exercice 13).
  corrige: |
    **1.** Les $\frac{X_{i} - 5}{\sigma}$ sont indépendantes de loi $\mathcal{N}(0, 1)$, donc $\boxed{\frac{nT_{n}^{2}}{\sigma^{2}} \sim \chi^{2}(n)}$, par définition de la loi du khi-deux. Au th. 7, la moyenne inconnue est remplacée par $\bar{X}_{n}$ : le vecteur des écarts $X_{i} - \bar{X}_{n}$ est la projection sur l'orthogonal de $(1, \dots, 1)$, de dimension $n - 1$ (th. 6). Ici la moyenne est connue, et l'on ne projette pas.

    **2.** $\mathbb{P}\big(q_{1} \leqslant \frac{nT_{n}^{2}}{\sigma^{2}} \leqslant q_{2}\big) = 0{,}95$, et cette condition s'écrit $\boxed{\sigma \in \Big[\sqrt{\frac{nT_{n}^{2}}{q_{2}}}, \sqrt{\frac{nT_{n}^{2}}{q_{1}}}\Big]}$.

    **3.** $nT_{7}^{2} = \sum(x_{i} - 5)^{2} = 0{,}042$ : l'intervalle est $\big[\sqrt{\frac{0{,}042}{16{,}01}}, \sqrt{\frac{0{,}042}{1{,}69}}\big] = \boxed{[0{,}051\,;\, 0{,}158]}$. Si $\sigma = 0{,}05$, la statistique $\frac{nT_{7}^{2}}{0{,}0025} = 16{,}8$ suit $\chi^{2}(7)$, et la dépasse avec la probabilité $0{,}019$ ; pour $\sigma < 0{,}05$, cette probabilité serait plus petite encore. La valeur $0{,}05$ est juste à l'extérieur de l'intervalle : la précision annoncée est $\boxed{\text{peu plausible}}$.

    **4.** $nT_{100}^{2} = 0{,}3$ : l'intervalle est $\big[\sqrt{\frac{0{,}3}{129{,}6}}, \sqrt{\frac{0{,}3}{74{,}2}}\big] = \boxed{[0{,}048\,;\, 0{,}064]}$, qui contient $0{,}05$ ; la statistique vaut $120$, et $\mathbb{P}(\chi^{2}(100) > 120) \approx 0{,}084$ : la précision annoncée est $\boxed{\text{plausible}}$. L'approximation $\mathcal{N}(100, 200)$ donne $1 - \Phi(\frac{20}{\sqrt{200}}) \approx 0{,}079$, et les quantiles $100 \pm 1{,}96\sqrt{200} = 72{,}3$ et $127{,}7$, décalés vers la gauche par rapport aux vrais ($74{,}2$ et $129{,}6$) : la loi $\chi^{2}(100)$ est encore un peu dissymétrique.
- id: "l3-pr-10-13"
  feuille: "f-l3-pr-10"
  numero: 13
  partie: "Statistique des échantillons gaussiens"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [échantillons gaussiens, loi du khi-deux]
  noeuds: [p-normale, p-independance]
  notions: [loi-normale]
  source: "Durand, exercices 5.18, 5.20 et 5.17"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    *(Durées exponentielles et loi du khi-deux.)*

    **1.** Soient $\tau_{1}$, …, $\tau_{n}$ indépendantes de loi $\mathcal{E}(\theta)$ et $T_{n} = \tau_{1} + \dots + \tau_{n}$. Montrer que $2\theta T_{n} \sim \chi^{2}(2n)$, et en déduire un intervalle de confiance exact pour $\theta$. Pour $n \geqslant 3$, calculer l'espérance et la variance de $\hat{\theta}_{n} = \frac{n}{T_{n}}$ ; montrer que $\hat{\theta}_{n}$ est biaisé, mais converge vers $\theta$ dans $L^{2}$. Proposer un estimateur sans biais.

    **2.** *(Censure.)* Soient $\tau_{1}$, …, $\tau_{n}$ indépendantes exponentielles de moyenne $2\theta$, et $T_{1} < \dots < T_{n}$ les mêmes variables rangées par ordre croissant (les instants des pannes successives). On pose $T_{0} = 0$ et $Y_{i} = T_{i} - T_{i - 1}$. Déterminer la densité de $(T_{1}, \dots, T_{n})$, puis montrer que $Y_{1}$, …, $Y_{n}$ sont indépendantes et que $(n - i + 1)Y_{i}$ suit la loi exponentielle de moyenne $2\theta$.

    **3.** Pour $1 \leqslant r \leqslant n$, soit $S_{r} = T_{1} + \dots + T_{r - 1} + (n - r + 1)T_{r}$, durée totale de fonctionnement observée jusqu'à la $r$-ième panne. Montrer que $\frac{S_{r}}{\theta} \sim \chi^{2}(2r)$, que $\frac{S_{r}}{2r} \to \theta$ en probabilité quand $r \to +\infty$, et déterminer la limite en loi de $\sqrt{r}\big(\frac{S_{r}}{2r} - \theta\big)$. Quel est l'intérêt pratique de $S_{r}$ ?

    **4.** Quatre composants indépendants ont des durées de vie de loi $\mathcal{E}(\lambda)$ ; les composants $1$ et $2$ sont montés en série avec le montage en parallèle des composants $3$ et $4$. Exprimer la durée de vie $D$ du système, calculer sa loi, son espérance et sa variance. À partir de $n$ durées indépendantes de tels systèmes, construire un intervalle de confiance de niveau asymptotique $90\,\%$ pour $\lambda$.
  corrige: |
    **1.** $T_{n} \sim \Gamma(n, \theta)$, donc $2\theta T_{n} \sim \Gamma(n, \frac{1}{2})$, dont la densité est celle de $\boxed{\chi^{2}(2n)}$ (prop. 7). Avec les quantiles $q_{1}$, $q_{2}$ d'ordres $\frac{\alpha}{2}$ et $1 - \frac{\alpha}{2}$ de $\chi^{2}(2n)$, $\boxed{\theta \in \big[\frac{q_{1}}{2T_{n}}, \frac{q_{2}}{2T_{n}}\big]}$ avec la probabilité exacte $1 - \alpha$. Ensuite, pour $k < n$, 
    $$\mathbb{E}[T_{n}^{-k}] = \int_{0}^{+\infty}\frac{\theta^{n}t^{n - 1 - k}\mathrm{e}^{-\theta t}}{(n - 1)!}\,\mathrm{d} t = \frac{\theta^{k}(n - k - 1)!}{(n - 1)!},$$
     d'où 
    $$\boxed{\mathbb{E}[\hat{\theta}_{n}] = \frac{n\theta}{n - 1}, \qquad \operatorname{Var}(\hat{\theta}_{n}) = \frac{n^{2}\theta^{2}}{(n - 1)^{2}(n - 2)}}.$$
     L'estimateur est biaisé, de biais $\frac{\theta}{n - 1}$, mais son écart quadratique moyen $\operatorname{Var}(\hat{\theta}_{n}) + \frac{\theta^{2}}{(n - 1)^{2}}$ tend vers $0$ : 
    $$\boxed{\hat{\theta}_{n} \xrightarrow{L^{2}} \theta}.$$
     L'estimateur $\boxed{\frac{n - 1}{T_{n}}}$ est sans biais.

    **2.** Les $\tau_{i}$ sont presque sûrement distinctes (feuille 9, exercice 8). Sur chacune des $n!$ régions où l'ordre des $\tau_{i}$ est fixé, le rangement est une permutation des coordonnées, de jacobien $\pm 1$ ; par le th. 1 du chapitre 7, $(T_{1}, \dots, T_{n})$ a pour densité 
    $$n!\,(2\theta)^{-n}\exp\Big(-\frac{1}{2\theta}\sum_{i}t_{i}\Big)\mathbf{1}_{\{0 < t_{1} < \dots < t_{n}\}}.$$
     L'application $(t_{i}) \mapsto (y_{i})$, $y_{i} = t_{i} - t_{i - 1}$, est linéaire triangulaire de jacobien $1$, et $\sum_{i}t_{i} = \sum_{i}(n - i + 1)y_{i}$. Comme $n! = \prod_{i}(n - i + 1)$, la densité de $Y$ est 
    $$\prod_{i = 1}^{n}\frac{n - i + 1}{2\theta}\exp\Big(-\frac{(n - i + 1)y_{i}}{2\theta}\Big)\mathbf{1}_{\{y_{i} > 0\}} :$$
     les $Y_{i}$ sont $\boxed{\text{indépendantes}}$, $Y_{i} \sim \mathcal{E}\big(\frac{n - i + 1}{2\theta}\big)$, et 
    $$\boxed{(n - i + 1)Y_{i} \text{ est exponentielle de moyenne } 2\theta}.$$
     Après $i - 1$ pannes, $n - i + 1$ composants fonctionnent encore et, par absence de mémoire, l'attente de la suivante est le minimum de $n - i + 1$ exponentielles neuves.

    **3.** Par une sommation d'Abel, $S_{r} = \sum_{i = 1}^{r}(n - i + 1)Y_{i}$ : c'est une somme de $r$ exponentielles indépendantes de moyenne $2\theta$, donc $S_{r} \sim \Gamma(r, \frac{1}{2\theta})$ et $\boxed{\frac{S_{r}}{\theta} \sim \chi^{2}(2r)}$. $\mathbb{E}[\frac{S_{r}}{2r}] = \theta$ et $\operatorname{Var}(\frac{S_{r}}{2r}) = \frac{\theta^{2}}{r} \to 0$ : $\boxed{\frac{S_{r}}{2r} \xrightarrow{\mathbb{P}} \theta}$. Par le théorème central limite (la loi de $S_{r}$ ne dépend que de $r$), $\boxed{\sqrt{r}\big(\frac{S_{r}}{2r} - \theta\big) \xrightarrow{\mathcal{L}} \mathcal{N}(0, \theta^{2})}$. On peut ainsi arrêter l'essai à la $r$-ième panne, sans attendre que les $n$ composants aient lâché, et obtenir un intervalle de confiance exact pour $\theta$ à l'aide de $\chi^{2}(2r)$.

    **4.** $\boxed{D = \min\big(T_{1}, T_{2}, \max(T_{3}, T_{4})\big)}$, et par indépendance 
    $$\mathbb{P}(D > t) = \mathrm{e}^{-2\lambda t}\big(1 - (1 - \mathrm{e}^{-\lambda t})^{2}\big) = \boxed{2\mathrm{e}^{-3\lambda t} - \mathrm{e}^{-4\lambda t}}, \qquad t \geqslant 0.$$
     Par le chapitre 4 (prop. 6), $\mathbb{E}[D] = \frac{2}{3\lambda} - \frac{1}{4\lambda} = \boxed{\frac{5}{12\lambda}}$, $\mathbb{E}[D^{2}] = \int_{0}^{+\infty}2t\,\mathbb{P}(D > t)\,\mathrm{d} t = \frac{23}{72\lambda^{2}}$ et $\boxed{\operatorname{Var}(D) = \frac{7}{48\lambda^{2}}}$. Pour un échantillon $D_{1}$, …, $D_{n}$, le théorème central limite donne 
    $$\sqrt{n}\Big(\frac{12\lambda\bar{D}_{n}}{5} - 1\Big) \xrightarrow{\mathcal{L}} \mathcal{N}\Big(0, \frac{21}{25}\Big),$$
     et avec $\hat{\lambda}_{n} = \frac{5}{12\bar{D}_{n}}$, comme à la feuille 9 (exercice 22), 
    $$\boxed{\lambda \in \Big[\hat{\lambda}_{n}\Big(1 - \frac{1{,}645 \times 0{,}917}{\sqrt{n}}\Big), \hat{\lambda}_{n}\Big(1 + \frac{1{,}645 \times 0{,}917}{\sqrt{n}}\Big)\Big]}$$
     avec une probabilité tendant vers $0{,}90$ ($\sqrt{21/25} \approx 0{,}917$).
- id: "l3-pr-10-14"
  feuille: "f-l3-pr-10"
  numero: 14
  partie: "Convergence en loi des vecteurs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [convergence en loi des vecteurs]
  noeuds: [fo-tcl, fo-levy]
  notions: [convergence-loi]
  source: "Durand, exercices 4.5 et 4.32"
  page_enonce: 5
  page_corrige: 9
  enonce: |
    *(Convergence de couples.)* Soient $(X_{n})$ et $(Y_{n})$ deux suites de variables réelles convergeant en loi vers des lois $\mu$ et $\nu$.

    **1.** Si $X_{n}$ et $Y_{n}$ sont indépendantes pour tout $n$, montrer que le couple $(X_{n}, Y_{n})$ converge en loi vers $\mu \otimes \nu$.

    **2.** Si $\nu = \delta_{a}$, montrer que $(X_{n}, Y_{n})$ converge en loi vers $\mu \otimes \delta_{a}$, sans hypothèse d'indépendance. En déduire que $X_{n} + Y_{n}$ et $X_{n}Y_{n}$ convergent en loi, et retrouver le lemme de Slutsky (feuille 8, exercice 20, et feuille 9, exercice 21).

    **3.** Montrer par un exemple que, sans ces hypothèses, le couple peut ne pas converger en loi.

    **4.** Soient $(X_{i})$ indépendantes, centrées, de variance $1$, et $S_{n} = X_{1} + \dots + X_{n}$. Déterminer la limite en loi de $\big(\frac{S_{n}}{\sqrt{n}}, \frac{S_{2n} - S_{n}}{\sqrt{n}}\big)$, puis celle de $\big(\frac{S_{n}}{\sqrt{n}}, \frac{S_{2n}}{\sqrt{2n}}\big)$. En déduire $\lim_{n}\mathbb{P}(S_{n} > 0, S_{2n} < 0)$.
  corrige: |
    **1.** Par indépendance, $\varphi_{(X_{n}, Y_{n})}(s, t) = \varphi_{X_{n}}(s)\varphi_{Y_{n}}(t) \to \varphi_{\mu}(s)\varphi_{\nu}(t)$ (chapitre 8, th. 3), qui est la fonction caractéristique de $\mu \otimes \nu$. Par le théorème de Lévy en dimension $2$, $\boxed{(X_{n}, Y_{n}) \xrightarrow{\mathcal{L}} \mu \otimes \nu}$.

    **2.** $Y_{n} \to a$ en loi, donc en probabilité (chapitre 8, th. 4). Comme à la feuille 8 (exercice 20), 
    $$\big|\varphi_{(X_{n}, Y_{n})}(s, t) - \varphi_{X_{n}}(s)\mathrm{e}^{iat}\big| \leqslant \mathbb{E}\big[|\mathrm{e}^{itY_{n}} - \mathrm{e}^{ita}|\big] \leqslant |t|\varepsilon + 2\,\mathbb{P}(|Y_{n} - a| > \varepsilon),$$
     de limite supérieure au plus $|t|\varepsilon$, pour tout $\varepsilon$ ; donc $\varphi_{(X_{n}, Y_{n})}(s, t) \to \varphi_{\mu}(s)\mathrm{e}^{iat}$, fonction caractéristique de $\mu \otimes \delta_{a}$, et $\boxed{(X_{n}, Y_{n}) \xrightarrow{\mathcal{L}} \mu \otimes \delta_{a}}$. Pour $h$ continue bornée sur $\mathbb{R}$, $(x, y) \mapsto h(x + y)$ et $(x, y) \mapsto h(xy)$ sont continues bornées sur $\mathbb{R}^{2}$ : $\boxed{X_{n} + Y_{n} \xrightarrow{\mathcal{L}} X + a}$ et $\boxed{X_{n}Y_{n} \xrightarrow{\mathcal{L}} aX}$, où $X \sim \mu$. C'est le lemme de Slutsky, ici sans hypothèse de continuité de la fonction de répartition.

    **3.** Soit $X \sim \mathcal{N}(0, 1)$, $X_{n} = X$ et $Y_{n} = (-1)^{n}X$ : les deux suites convergent en loi vers $\mathcal{N}(0, 1)$, mais $X_{n} + Y_{n}$ vaut alternativement $2X$ et $0$, et ne converge pas en loi. Si le couple convergeait en loi, la somme convergerait, par la question 2 : 
    $$\boxed{\text{le couple ne converge pas}}.$$
     Les lois marginales ne déterminent pas la loi du couple.

    **4.** $U_{n} = \frac{S_{n}}{\sqrt{n}}$ et $V_{n} = \frac{S_{2n} - S_{n}}{\sqrt{n}}$ sont indépendantes (paquets disjoints) et convergent en loi vers $\mathcal{N}(0, 1)$ (chapitre 9, th. 3) : par la question 1, $\boxed{(U_{n}, V_{n}) \xrightarrow{\mathcal{L}} \mathcal{N}(0, I_{2})}$. Par l'application linéaire $(u, v) \mapsto (u, \frac{u + v}{\sqrt{2}})$ (prop. 5), 
    $$\Big(\frac{S_{n}}{\sqrt{n}}, \frac{S_{2n}}{\sqrt{2n}}\Big) \xrightarrow{\mathcal{L}} \boxed{\mathcal{N}\Big(0, \begin{pmatrix} 1 & 1/\sqrt{2} \\ 1/\sqrt{2} & 1 \end{pmatrix}\Big)}.$$
     Enfin $\mathbb{P}(S_{n} > 0, S_{2n} < 0) = \mathbb{P}\big((U_{n}, V_{n}) \in C\big)$, avec $C = \{u > 0, u + v < 0\}$, ouvert dont le bord (deux demi-droites) est négligeable pour $\mathcal{N}(0, I_{2})$. En encadrant $\mathbf{1}_{C}$ par des fonctions continues $h_{k} \leqslant \mathbf{1}_{C} \leqslant g_{k}$, par exemple $h_{k}(x) = \min(1, k\operatorname{dist}(x, \mathbb{R}^{2} \setminus C))$ et $g_{k}(x) = \max(0, 1 - k\operatorname{dist}(x, C))$, on obtient $\mathbb{P}((U_{n}, V_{n}) \in C) \to \mathbb{P}(G \in C)$, où $G \sim \mathcal{N}(0, I_{2})$. La loi de $G$ est invariante par rotation, et $C$ est un secteur angulaire d'ouverture $\frac{\pi}{4}$ : la limite vaut $\boxed{\frac{1}{8}}$.

    1.5em

    ![Figure](documents/figures/a8baeb9ba07eeddd.svg)

    Le secteur $C = \{u > 0, u + v < 0\}$ (en vert) et des cercles de niveau de la densité de $\mathcal{N}(0, I_{2})$. Par invariance par rotation, la probabilité d'un secteur est proportionnelle à son ouverture : $\frac{\pi/4}{2\pi} = \frac{1}{8}$. Une marche qui est au-dessus de $0$ au temps $n$ repasse sous $0$ au temps $2n$ dans un cas sur quatre.
- id: "l3-pr-10-15"
  feuille: "f-l3-pr-10"
