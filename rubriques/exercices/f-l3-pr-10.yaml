  source: "Durand, exercice 6.14"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    *(Espérance d'un maximum.)*

    **1.** Montrer que $\mathrm{e}^{x} = \max_{t \in \mathbb{R}}\big(\mathrm{e}^{t} + (x - t)\mathrm{e}^{t}\big)$ pour tout réel $x$, et en déduire l'inégalité de Jensen $\mathrm{e}^{\mathbb{E}[X]} \leqslant \mathbb{E}[\mathrm{e}^{X}]$ pour $X$ intégrable.

    **2.** Soient $X_{1}$, …, $X_{N}$ intégrables, $Z = \max_{i}X_{i}$ et $\psi(\lambda) = \ln\max_{i}\mathbb{E}[\mathrm{e}^{\lambda X_{i}}]$. Montrer que 
    $$\mathbb{E}[Z] \leqslant \inf_{\lambda > 0}\frac{\psi(\lambda) + \ln N}{\lambda}.$$

    **3.** En déduire que $\mathbb{E}[Z] \leqslant \sqrt{2\ln N}$ si les $X_{i}$ sont de loi $\mathcal{N}(0, 1)$, *sans hypothèse d'indépendance*. Comparer, pour des variables indépendantes, à la feuille 8 (exercice 5) ; pour $N = 100$, la valeur exacte est $\mathbb{E}[Z] \approx 2{,}51$.
  corrige: |
    **1.** Par convexité, la tangente en $t$ est sous la courbe : $\mathrm{e}^{x} \geqslant \mathrm{e}^{t} + (x - t)\mathrm{e}^{t}$, avec égalité pour $t = x$ : c'est $\boxed{\text{un maximum}}$. Avec $t = \mathbb{E}[X]$ et $x = X$, en prenant l'espérance, $\mathbb{E}[\mathrm{e}^{X}] \geqslant \mathrm{e}^{\mathbb{E}[X]}$.

    **2.** $Z$ est intégrable ($|Z| \leqslant \sum|X_{i}|$). Pour $\lambda > 0$, par la question 1 appliquée à $\lambda Z$, 
    $$\mathrm{e}^{\lambda\mathbb{E}[Z]} \leqslant \mathbb{E}[\mathrm{e}^{\lambda Z}] = \mathbb{E}\big[\max_{i}\mathrm{e}^{\lambda X_{i}}\big] \leqslant \sum_{i}\mathbb{E}[\mathrm{e}^{\lambda X_{i}}] \leqslant N\mathrm{e}^{\psi(\lambda)},$$
     d'où $\lambda\mathbb{E}[Z] \leqslant \psi(\lambda) + \ln N$, et le résultat en passant à la borne inférieure.

    **3.** Pour $\mathcal{N}(0, 1)$, $\psi(\lambda) = \frac{\lambda^{2}}{2}$, et $\frac{\lambda}{2} + \frac{\ln N}{\lambda}$ est minimal pour $\lambda = \sqrt{2\ln N}$ : $\boxed{\mathbb{E}[Z] \leqslant \sqrt{2\ln N}}$. L'indépendance n'a servi nulle part : la majoration $\mathbb{E}[\max] \leqslant \sum$ est grossière, mais suffit. Pour des variables indépendantes, la feuille 8 (exercice 5) montre que $\frac{\max_{i \leqslant N}X_{i}}{\sqrt{2\ln N}}$ tend vers $1$ : la borne est asymptotiquement optimale. La convergence est lente : pour $N = 100$, $\mathbb{E}[Z] \approx 2{,}51$ contre $\sqrt{2\ln 100} \approx 3{,}03$. À l'opposé, si les $X_{i}$ sont toutes égales, $\mathbb{E}[Z] = 0$.
- id: "l3-pr-10-09"
  feuille: "f-l3-pr-10"
  numero: 9
  partie: "Calculs gaussiens"
  etoiles: 1
