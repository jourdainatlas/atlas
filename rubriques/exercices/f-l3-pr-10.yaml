  source: "Durand, exercice 5.3"
  page_enonce: 5
  page_corrige: 10
  enonce: |
    *(Chaîne d'atomes.)* Une longue molécule plane est formée de $n$ atomes $A_{1}$, …, $A_{n}$ ; deux atomes consécutifs sont à distance $\epsilon$, et la direction de $\overrightarrow{A_{i}A_{i + 1}}$ est uniforme sur $[0, 2\pi[$, indépendante des autres.

    **1.** Calculer l'espérance et la matrice de covariance de $\overrightarrow{A_{i}A_{i + 1}}$. Quelle est la loi approchée de $\overrightarrow{A_{1}A_{n}}$ pour $n$ grand ?

    **2.** En déduire la loi approchée du carré de la distance $A_{1}A_{n}$, et la comparer à la valeur exacte de $\mathbb{E}[A_{1}A_{n}^{2}]$. Quel est l'ordre de grandeur de la taille de la molécule ?
  corrige: |
    **1.** $\overrightarrow{A_{i}A_{i + 1}} = \epsilon(\cos\Theta_{i}, \sin\Theta_{i})$, avec $\Theta_{i}$ uniforme : $\mathbb{E}[\cos\Theta] = \mathbb{E}[\sin\Theta] = \mathbb{E}[\cos\Theta\sin\Theta] = 0$ et $\mathbb{E}[\cos^{2}\Theta] = \mathbb{E}[\sin^{2}\Theta] = \frac{1}{2}$. L'espérance est $\boxed{0}$ et la covariance $\boxed{\frac{\epsilon^{2}}{2}I_{2}}$. Par le th. 8 appliqué aux $n - 1$ pas, $\overrightarrow{A_{1}A_{n}}$ suit approximativement la loi $\boxed{\mathcal{N}\big(0, \frac{(n - 1)\epsilon^{2}}{2}I_{2}\big)}$.

    **2.** Alors $\frac{2A_{1}A_{n}^{2}}{(n - 1)\epsilon^{2}}$ suit approximativement $\chi^{2}(2) = \mathcal{E}(\frac{1}{2})$ : $A_{1}A_{n}^{2}$ est approximativement 
    $$\boxed{\text{exponentielle de moyenne } (n - 1)\epsilon^{2}},$$
     et 
    $$\mathbb{P}(A_{1}A_{n} > r) \approx \exp\Big(-\frac{r^{2}}{(n - 1)\epsilon^{2}}\Big).$$
     Exactement, $\mathbb{E}[A_{1}A_{n}^{2}] = \sum_{i}\mathbb{E}[\|\overrightarrow{A_{i}A_{i + 1}}\|^{2}] = (n - 1)\epsilon^{2}$, les termes croisés étant nuls par indépendance : l'approximation est exacte pour l'espérance. La molécule a une taille de l'ordre de $\epsilon\sqrt{n}$, et non $\epsilon n$ : une longue chaîne au hasard est pelotonnée.
- id: "l3-pr-10-17"
  feuille: "f-l3-pr-10"
  numero: 17
  partie: "Convergence en loi des vecteurs"
  etoiles: 3
  types: [Problème, Démonstration, Calcul]
  mots_cles: [convergence en loi des vecteurs, loi du khi-deux]
  noeuds: [fo-tcl, fo-levy, p-normale]
  notions: [convergence-loi]
  source: "Durand, exercices 5.10 et 5.39 (application)"
  page_enonce: 5
  page_corrige: 11
  enonce: |
    *(Statistique du khi-deux.)* Soient $X_{1}$, …, $X_{n}$ indépendantes, de même loi sur $\{1, \dots, k\}$ ($k \geqslant 2$), avec $p_{i} = \mathbb{P}(X_{1} = i) > 0$, $N_{n, i} = \#\{j \leqslant n \,;\, X_{j} = i\}$ et $N_{n} = {(N_{n, 1}, \dots, N_{n, k})}^{T}$.

    **1.** Donner la loi de $N_{n}$. Montrer que $\hat{p}_{n} = \frac{N_{n}}{n}$ converge presque sûrement vers $p = {(p_{1}, \dots, p_{k})}^{T}$, et déterminer la limite en loi de $\sqrt{n}(\hat{p}_{n} - p)$. Expliciter la matrice de covariance limite pour un dé équilibré ; est-elle inversible ?

    **2.** Soit $G_{n}$ le vecteur de coordonnées $\frac{N_{n, i} - np_{i}}{\sqrt{np_{i}}}$. Montrer que $G_{n} \xrightarrow{\mathcal{L}} \mathcal{N}(0, I_{k} - v{v}^{T})$, où $v$ est un vecteur unitaire à déterminer, et que $I_{k} - v{v}^{T}$ est la matrice d'une projection orthogonale dont on précisera l'image.

    **3.** En déduire que $T_{n} = \|G_{n}\|^{2} = \sum_{i = 1}^{k}\frac{(N_{n, i} - np_{i})^{2}}{np_{i}}$ converge en loi vers $\chi^{2}(k - 1)$ (théorème de Cochran).

    **4.** *Application.* En $1000$ tirages supposés indépendants et uniformes d'un chiffre, les chiffres $1$, $2$, …, $9$, $0$ ont été obtenus $87$, $103$, $90$, $110$, $81$, $108$, $85$, $123$, $90$, $123$ fois. Calculer $T_{1000}$. Sachant que $\mathbb{P}(\chi^{2}(9) > 16{,}9) \approx 0{,}05$ et $\mathbb{P}(\chi^{2}(9) > 21{,}7) \approx 0{,}01$, l'hypothèse d'uniformité vous paraît-elle plausible ?
  corrige: |
    **1.** $N_{n}$ suit la *loi multinomiale* : pour $k_{1} + \dots + k_{k} = n$, 
    $$\mathbb{P}(N_{n} = (k_{1}, \dots, k_{k})) = \frac{n!}{k_{1}!\cdots k_{k}!}\,p_{1}^{k_{1}}\cdots p_{k}^{k_{k}}.$$
     Le vecteur $N_{n} = \sum_{j}e_{X_{j}}$ est une somme de vecteurs indépendants de même loi, d'espérance $p$ et de covariance $\Sigma = \operatorname{diag}(p) - p{p}^{T}$ (car $\mathbf{1}_{\{X = i\}}\mathbf{1}_{\{X = l\}} = 0$ si $i \neq l$). La loi forte, coordonnée par coordonnée, donne $\hat{p}_{n} \to p$ presque sûrement, et le th. 8 donne $\boxed{\sqrt{n}(\hat{p}_{n} - p) \xrightarrow{\mathcal{L}} \mathcal{N}(0, \operatorname{diag}(p) - p{p}^{T})}$. Pour un dé équilibré, $\Sigma = \frac{1}{6}I_{6} - \frac{1}{36}\mathbf{J}$, où $\mathbf{J}$ est la matrice dont tous les coefficients valent $1$ ; elle $\boxed{\text{n'est pas inversible}}$ : $(1, \dots, 1) \in \ker\Sigma$, car $\sum_{i}(\hat{p}_{n, i} - p_{i}) = 0$.

    **2.** $G_{n} = D^{-1/2}\sqrt{n}(\hat{p}_{n} - p)$ avec $D = \operatorname{diag}(p)$ : par la prop. 5, 
    $$G_{n} \xrightarrow{\mathcal{L}} \mathcal{N}(0, D^{-1/2}\Sigma D^{-1/2}) = \mathcal{N}(0, I_{k} - v{v}^{T}),$$
     avec $\boxed{v = {(\sqrt{p_{1}}, \dots, \sqrt{p_{k}})}^{T}}$, unitaire car $\sum p_{i} = 1$. La matrice $P = I_{k} - v{v}^{T}$ est symétrique et $P^{2} = P$ : c'est la 
    $$\boxed{\text{projection orthogonale sur } v^{\perp}},$$
     de dimension $k - 1$.

    **3.** $x \mapsto \|x\|^{2}$ est continue, donc $T_{n} = \|G_{n}\|^{2} \xrightarrow{\mathcal{L}} \|G\|^{2}$, avec $G \sim \mathcal{N}(0, P)$. Comme $P{P}^{T} = P$, $G$ a la loi de $PZ$, $Z \sim \mathcal{N}(0, I_{k})$ (th. 3), et par le théorème de Cochran (avec $E_{1} = v^{\perp}$ et $E_{2} = \mathbb{R} v$), $\|PZ\|^{2} \sim \chi^{2}(k - 1)$ : $\boxed{T_{n} \xrightarrow{\mathcal{L}} \chi^{2}(k - 1)}$. Un degré de liberté est perdu parce que les effectifs ont une somme fixée $n$.

    **4.** Les écarts à $100$ sont $-13$, $3$, $-10$, $10$, $-19$, $8$, $-15$, $23$, $-10$, $23$, dont la somme des carrés vaut $2186$ : $\boxed{T_{1000} = 21{,}86}$. Elle dépasse $21{,}7$ : sous l'hypothèse d'uniformité, un écart au moins aussi grand a une probabilité inférieure à $0{,}01$ (environ $0{,}009$). L'hypothèse paraît $\boxed{\text{peu plausible}}$ ; les chiffres $8$ et $0$, obtenus $123$ fois chacun, contribuent pour près de la moitié de $T$.

    1.5em

    ![Figure](documents/figures/550ccc9376004351.svg)

    Les effectifs observés des dix chiffres (en bleu) et l'effectif attendu $100$ (en orange). Chaque écart, pris isolément, reste inférieur à deux écarts types et demi (l'écart type d'un effectif est $\sqrt{90} \approx 9{,}5$) ; c'est leur accumulation que mesure la statistique $T$.

