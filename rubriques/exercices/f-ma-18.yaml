  page_corrige: 21
  enonce: |
    Pour tout réel $x$, on pose 
    $$f(x) = \int_{0}^{\sin^{2} x} \operatorname{Arcsin}\sqrt{t}\,\mathrm{d} t + \int_{0}^{\cos^{2} x} \operatorname{Arccos}\sqrt{t}\,\mathrm{d} t.$$
     Justifier que $f$ est dérivable sur $\mathbb{R}$, calculer $f'$, et en déduire une expression simple de $f$.
  corrige: |
    On dérive une intégrale dont la borne dépend de $x$ : on l'écrit à l'aide d'une primitive, par le théorème 6, puis on applique la dérivation des fonctions composées. Les fonctions $t \mapsto \operatorname{Arcsin}\sqrt{t}$ et $t \mapsto \operatorname{Arccos}\sqrt{t}$ sont continues sur $[0\,,1]$ ; par le théorème 6, les fonctions 
    $$S(u) = \int_{0}^{u} \operatorname{Arcsin}\sqrt{t}\,\mathrm{d} t \qquad\text{et}\qquad C(u) = \int_{0}^{u} \operatorname{Arccos}\sqrt{t}\,\mathrm{d} t$$
     sont de classe $\mathcal{C}^{1}$ sur $[0\,,1]$, de dérivées $\operatorname{Arcsin}\sqrt{u}$ et $\operatorname{Arccos}\sqrt{u}$. Comme $\sin^{2}$ et $\cos^{2}$ sont dérivables à valeurs dans $[0\,,1]$, la fonction $f = S \circ \sin^{2} + C \circ \cos^{2}$ est dérivable sur $\mathbb{R}$ (chapitre 9, théorème 2), et, puisque $\sqrt{\sin^{2}x} = |\sin x|$, 
    $$f'(x) = 2\sin x\cos x\,\big(\operatorname{Arcsin}|\sin x| - \operatorname{Arccos}|\cos x|\big).$$
     Soit $y = \operatorname{Arcsin}|\sin x|$, qui appartient à $\big[0\,,\frac{\pi}{2}\big]$. Alors $\cos y \geqslant 0$, et 
    $$\cos y = \sqrt{1 - \sin^{2}y} = \sqrt{1 - \sin^{2}x} = |\cos x| \, ;$$
     comme $y \in [0\,,\pi]$, on en déduit $y = \operatorname{Arccos}|\cos x|$. La parenthèse est nulle. 
    $$\boxed{f' = 0 \text{ sur } \mathbb{R}}$$
     La fonction $f$ est donc constante sur l'intervalle $\mathbb{R}$. Pour trouver sa valeur, on compare 
    $$f(0) = \int_{0}^{1} \operatorname{Arccos}\sqrt{t}\,\mathrm{d} t \qquad\text{et}\qquad f\Big(\frac{\pi}{2}\Big) = \int_{0}^{1} \operatorname{Arcsin}\sqrt{t}\,\mathrm{d} t.$$
     Ces deux nombres sont égaux, et leur somme vaut $\int_{0}^{1} \frac{\pi}{2}\,\mathrm{d} t = \frac{\pi}{2}$, puisque $\operatorname{Arcsin} + \operatorname{Arccos} = \frac{\pi}{2}$ sur $[-1\,,1]$ (chapitre 5). 
    $$\boxed{f(x) = \frac{\pi}{4} \text{ pour tout réel } x}$$
     Un calcul numérique de $f(0{,}3)$, $f(1{,}1)$, $f(2{,}5)$ et $f(-4)$ donne bien $0{,}785\,398\ldots$ ✓

    *Piège.* L'erreur la plus répandue est d'écrire $\sqrt{\sin^{2}x} = \sin x$ puis $\operatorname{Arcsin}(\sin x) = x$ : ces deux égalités sont fausses dès que $x \notin \big[0\,,\frac{\pi}{2}\big]$. Elles conduisent ici au bon résultat sur $\big[0\,,\frac{\pi}{2}\big]$ seulement, et il faut l'argument ci-dessus, ou la parité et la $\pi$-périodicité de $f$, pour conclure sur $\mathbb{R}$.
- id: "ma-18-24"
  feuille: "f-ma-18"
  numero: 24
  partie: "Intégrale et primitives"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [intégrale et primitives, intégrales, "suites d'intégrales", logarithme et exponentielle]
  noeuds: [ar-tfa, ri-proprietes, su-convergence]
  notions: []
  page_enonce: 6
  page_corrige: 22
  enonce: |
    **1.** Pour $x > 0$, on pose $\displaystyle f(x) = \int_{x}^{2x} \frac{\mathrm{e}^{-t}}{t}\,\mathrm{d} t$.

    **(a)** Justifier que $f$ est de classe $\mathcal{C}^{1}$ sur $]0\,,+\infty[$, calculer $f'$ et en déduire les variations de $f$.

    **(b)** Montrer que $\mathrm{e}^{-2x}\ln 2 \leqslant f(x) \leqslant \mathrm{e}^{-x}\ln 2$ pour tout $x > 0$, puis déterminer les limites de $f$ en $0$ et en $+\infty$.

    **2.** Pour $0 < \varepsilon < M$, on pose $\displaystyle J(\varepsilon, M) = \int_{\varepsilon}^{M} \frac{\mathrm{e}^{-x} - \mathrm{e}^{-2x}}{x}\,\mathrm{d} x$. Montrer que $J(\varepsilon, M) = f(\varepsilon) - f(M)$, puis que, pour tout $\eta > 0$, il existe $\delta > 0$ et $A > 0$ tels que $|J(\varepsilon, M) - \ln 2| \leqslant \eta$ dès que $\varepsilon \leqslant \delta$ et $M \geqslant A$.

    **3.** Déterminer la limite de $\displaystyle\int_{x}^{3x} \frac{\cos(t^{2})}{\sin t}\,\mathrm{d} t$ quand $x$ tend vers $0$ par valeurs positives.
  corrige: |
    **1.** *(a)* On écrit $f$ à l'aide d'une primitive, par le théorème 6 : la fonction $g : t \mapsto \frac{\mathrm{e}^{-t}}{t}$ est continue sur $]0\,,+\infty[$, et $G(x) = \int_{1}^{x} g$ y est de classe $\mathcal{C}^{1}$, de dérivée $g$. Comme $f(x) = G(2x) - G(x)$, la fonction $f$ est de classe $\mathcal{C}^{1}$, et 
    $$\boxed{f'(x) = 2g(2x) - g(x) = \frac{\mathrm{e}^{-2x} - \mathrm{e}^{-x}}{x} < 0}$$
     puisque $\mathrm{e}^{-2x} < \mathrm{e}^{-x}$ pour $x > 0$. La fonction $f$ est strictement décroissante sur $]0\,,+\infty[$.

    *(b)* Pour $t \in [x\,,2x]$, on a $\mathrm{e}^{-2x} \leqslant \mathrm{e}^{-t} \leqslant \mathrm{e}^{-x}$ ; on divise par $t > 0$ et l'on intègre sur $[x\,,2x]$, dans l'ordre croissant, avec $\int_{x}^{2x} \frac{\mathrm{d} t}{t} = \ln 2$. 
    $$\boxed{\mathrm{e}^{-2x}\ln 2 \leqslant f(x) \leqslant \mathrm{e}^{-x}\ln 2}$$
     Les deux bornes tendent vers $\ln 2$ en $0$ et vers $0$ en $+\infty$, et le théorème d'encadrement conclut. 
    $$\boxed{\lim_{x \to 0^{+}} f(x) = \ln 2, \qquad \lim_{x \to +\infty} f(x) = 0}$$
     Le facteur $\frac{1}{t}$ seul donnerait exactement $\ln 2$ : quand $x$ tend vers $0$, le facteur $\mathrm{e}^{-t}$ est presque constant égal à $1$ sur $[x\,,2x]$, et c'est la valeur $\ln 2$ qui subsiste.

    **2.** On sépare $J(\varepsilon, M)$ en deux intégrales, et l'on effectue dans la seconde le changement de variable $u = 2x$ (chapitre 6, proposition 5). Il est naturel parce que $\frac{\mathrm{d} x}{x}$ est inchangé par une homothétie : $\frac{\mathrm{e}^{-2x}}{x}\,\mathrm{d} x = \frac{\mathrm{e}^{-u}}{u}\,\mathrm{d} u$. Ainsi 
    $$J(\varepsilon, M) = \int_{\varepsilon}^{M} \frac{\mathrm{e}^{-x}}{x}\,\mathrm{d} x - \int_{2\varepsilon}^{2M} \frac{\mathrm{e}^{-u}}{u}\,\mathrm{d} u = \int_{\varepsilon}^{2\varepsilon} \frac{\mathrm{e}^{-x}}{x}\,\mathrm{d} x - \int_{M}^{2M} \frac{\mathrm{e}^{-x}}{x}\,\mathrm{d} x,$$
     par la relation de Chasles, qui fait disparaître la partie commune entre $2\varepsilon$ et $M$ (avec la convention d'orientation si $2\varepsilon > M$). 
    $$\boxed{J(\varepsilon, M) = f(\varepsilon) - f(M)}$$
     Par la question 1 (b), $0 \leqslant \ln 2 - f(\varepsilon) \leqslant (1 - \mathrm{e}^{-2\varepsilon})\ln 2 \leqslant 2\varepsilon\ln 2$, puisque $1 - \mathrm{e}^{-u} \leqslant u$ (convexité de l'exponentielle, chapitre 9), et $0 \leqslant f(M) \leqslant \mathrm{e}^{-M}\ln 2 \leqslant \frac{\ln 2}{M}$, puisque $\mathrm{e}^{M} \geqslant 1 + M > M$. Donc 
    $$|J(\varepsilon, M) - \ln 2| \leqslant |f(\varepsilon) - \ln 2| + f(M) \leqslant 2\varepsilon\ln 2 + \frac{\ln 2}{M}.$$
     Soit $\eta > 0$. On pose $\delta = \frac{\eta}{4\ln 2}$ et $A = \frac{2\ln 2}{\eta}$ : chacun des deux termes est au plus $\frac{\eta}{2}$ dès que $\varepsilon \leqslant \delta$ et $M \geqslant A$. 
    $$\boxed{\varepsilon \leqslant \frac{\eta}{4\ln 2} \ \text{ et } \ M \geqslant \frac{2\ln 2}{\eta} \implies |J(\varepsilon, M) - \ln 2| \leqslant \eta}$$
     Avec $\eta = 10^{-2}$, une intégration numérique entre $\delta \approx 0{,}0036$ et $A \approx 138{,}6$ donne bien $J$ à moins de $\eta$ de $\ln 2$. ✓

    **3.** Pour $t$ voisin de $0$, $\frac{\cos(t^{2})}{\sin t}$ ressemble à $\frac{1}{t}$, dont l'intégrale sur $[x\,,3x]$ vaut exactement $\ln 3$ : on compare les deux fonctions. Pour $0 < x \leqslant \frac{1}{3}$, on a $[x\,,3x] \subset \,]0\,,1]$, où $\sin t > 0$, et l'on pose $h(t) = \frac{\cos(t^{2})}{\sin t} - \frac{1}{t}$. Par les développements limités du chapitre 10, 
    $$h(t) = \frac{t\cos(t^{2}) - \sin t}{t\sin t} = \frac{t - \big(t - \frac{t^{3}}{6}\big) + o(t^{3})}{t^{2} + o(t^{2})} \sim \frac{t}{6} \xrightarrow[t \to 0^{+}]{} 0.$$
     Il existe donc $\delta_{0} \in \,]0\,,1]$ tel que $|h(t)| \leqslant 1$ pour $0 < t \leqslant \delta_{0}$. Pour $0 < x \leqslant \frac{\delta_{0}}{3}$, l'inégalité triangulaire donne 
    $$\Big|\int_{x}^{3x} \frac{\cos(t^{2})}{\sin t}\,\mathrm{d} t - \ln 3\Big| = \Big|\int_{x}^{3x} h(t)\,\mathrm{d} t\Big| \leqslant 2x \xrightarrow[x \to 0^{+}]{} 0.$$

    $$\boxed{\lim_{x \to 0^{+}} \int_{x}^{3x} \frac{\cos(t^{2})}{\sin t}\,\mathrm{d} t = \ln 3}$$
     Numériquement, on trouve $1{,}098\,679$ pour $x = 10^{-2}$ et $1{,}098\,612\,96$ pour $x = 10^{-3}$, à comparer à $\ln 3 \approx 1{,}098\,612\,29$. ✓

    *À retenir.* Les trois questions reposent sur la même remarque : sur $[x\,,kx]$, l'intégrale de $\frac{1}{t}$ vaut $\ln k$, quel que soit $x$. Quand l'intégrande est équivalent à $\frac{1}{t}$ près de $0$, l'intégrale tend vers $\ln k$ : c'est le principe des intégrales de Frullani, dont $J(\varepsilon, M)$ est un exemple.
- id: "ma-18-25"
  feuille: "f-ma-18"
  numero: 25
  partie: "Intégrale et primitives"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [intégrale et primitives, intégrales, logarithme et exponentielle]
  noeuds: [ar-tfa, ri-proprietes]
  notions: []
  page_enonce: 7
  page_corrige: 23
  enonce: |
    **1.** Montrer que, pour tout réel $x$, il existe un unique réel $y$ tel que $\displaystyle\int_{x}^{y} \mathrm{e}^{t^{2}}\,\mathrm{d} t = 1$.

    **2.** On note $\varphi(x)$ ce réel. Montrer que la fonction $\varphi$ est de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}$, et exprimer $\varphi'(x)$ en fonction de $x$ et de $\varphi(x)$.
  corrige: |
    **1.** On ramène l'équation à une équation $G(y) = c$, à l'aide de la primitive $G(y) = \int_{0}^{y} \mathrm{e}^{t^{2}}\,\mathrm{d} t$ (théorème 6). La fonction $G$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$, de dérivée $y \mapsto \mathrm{e}^{y^{2}} > 0$ : elle est strictement croissante. Pour $y \geqslant 0$, $G(y) \geqslant \int_{0}^{y} 1 = y$, donc $G$ tend vers $+\infty$ en $+\infty$ ; l'intégrande étant pair, $G$ est impaire (chapitre 6, proposition 6), et tend vers $-\infty$ en $-\infty$. Par le théorème de la bijection (chapitre 8, théorème 11), $G$ est une bijection de $\mathbb{R}$ sur $\mathbb{R}$. Enfin, par la relation de Chasles, 
    $$\int_{x}^{y} \mathrm{e}^{t^{2}}\,\mathrm{d} t = 1 \iff G(y) = 1 + G(x) \iff y = G^{-1}\big(1 + G(x)\big).$$

    $$\boxed{\text{pour tout réel } x, \text{ il existe un unique } y, \text{ à savoir } \varphi(x) = G^{-1}\big(1 + G(x)\big)}$$

    **2.** *Régularité de $G^{-1}$.* La dérivée de $G$ ne s'annule pas, donc $G^{-1}$ est dérivable (chapitre 9, théorème 3), et 
    $$(G^{-1})' = \frac{1}{G' \circ G^{-1}} = \exp\big(-(G^{-1})^{2}\big).$$
     Par récurrence, si $G^{-1}$ est de classe $\mathcal{C}^{k}$, le membre de droite l'est aussi, donc $G^{-1}$ est de classe $\mathcal{C}^{k + 1}$ : $G^{-1}$ est de classe $\mathcal{C}^{\infty}$. Comme $G$, de dérivée $\exp(y^{2})$, l'est aussi, la composée $\varphi = G^{-1} \circ (1 + G)$ est de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}$.

    *Dérivée.* On dérive la relation $G\big(\varphi(x)\big) = 1 + G(x)$ : $\varphi'(x)\,\mathrm{e}^{\varphi(x)^{2}} = \mathrm{e}^{x^{2}}$. 
    $$\boxed{\varphi'(x) = \mathrm{e}^{x^{2} - \varphi(x)^{2}}}$$
     Numériquement, $\varphi(0) \approx 0{,}795\,17$, et la dérivée calculée par un taux d'accroissement en $-1{,}5$, $0$ et $0{,}8$ coïncide avec cette formule. ✓

    *À retenir.* On n'a jamais calculé $G$, qui ne s'exprime pas à l'aide des fonctions usuelles : le théorème 6 en garantit l'existence et la dérivée, et cela suffit pour tout le raisonnement. Comme $1 + G(x) > G(x)$, on a aussi $\varphi(x) > x$.
- id: "ma-18-26"
  feuille: "f-ma-18"
  numero: 26
  partie: "Intégrale et primitives"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [intégrale et primitives, intégrales, fonctions définies par une intégrale]
  noeuds: [ar-tfa, ri-proprietes]
  notions: []
  page_enonce: 7
  page_corrige: 24
  enonce: |
    On note $E = \mathcal{C}(\mathbb{R}, \mathbb{R})$ le $\mathbb{R}$-espace vectoriel des fonctions continues de $\mathbb{R}$ dans $\mathbb{R}$.

    **1.** Pour $f \in E$, on note $P_{0}(f)$ la fonction $x \mapsto \displaystyle\int_{0}^{x} f(t)\,\mathrm{d} t$. Montrer que $P_{0}$ est un endomorphisme de $E$, et déterminer son noyau et son image.

    **2.** Mêmes questions pour l'application $P_{a}$ qui envoie $f \in E$ sur sa primitive qui s'annule en $a \in \mathbb{R}$.

    **3.** Montrer que tout $f \in E$ admet une unique primitive $G$ telle que $\displaystyle\int_{0}^{1} G = 0$, et que l'application $\Pi$ qui envoie $f$ sur $G$ est un endomorphisme de $E$. Déterminer son noyau et son image.
  corrige: |
    **1.** *Endomorphisme.* Par le théorème 6, $P_{0}(f)$ est de classe $\mathcal{C}^{1}$, donc continue : $P_{0}(f) \in E$. La linéarité de l'intégrale donne celle de $P_{0}$.

    *Noyau.* Si $P_{0}(f) = 0$, on dérive : $f = P_{0}(f)' = 0$ par le théorème 6.

    *Image.* La fonction $P_{0}(f)$ est de classe $\mathcal{C}^{1}$ et s'annule en $0$. Réciproquement, si $F$ est de classe $\mathcal{C}^{1}$ et vérifie $F(0) = 0$, alors $F'$ est continue, et le théorème 6 donne $F(x) = F(0) + \int_{0}^{x} F' = P_{0}(F')(x)$. 
    $$\boxed{\mathrm{Ker}\, P_{0} = \{0\}, \qquad \mathrm{Im}\, P_{0} = \{F \in \mathcal{C}^{1}(\mathbb{R}, \mathbb{R}) : F(0) = 0\}}$$

    **2.** La primitive de $f$ qui s'annule en $a$ est $P_{a}(f) : x \mapsto \int_{a}^{x} f$ (théorème 6), et le même raisonnement, avec $a$ à la place de $0$, s'applique. 
    $$\boxed{\mathrm{Ker}\, P_{a} = \{0\}, \qquad \mathrm{Im}\, P_{a} = \{F \in \mathcal{C}^{1}(\mathbb{R}, \mathbb{R}) : F(a) = 0\}}$$

    **3.** *Existence et unicité.* Les primitives de $f$ sont les fonctions $P_{0}(f) + c$, où $c$ est une constante (chapitre 6, proposition 1). La condition $\int_{0}^{1}\big(P_{0}(f) + c\big) = 0$ équivaut à $c = -\int_{0}^{1} P_{0}(f)$ : il y a une unique primitive convenable, 
    $$\boxed{\Pi(f) = P_{0}(f) - \int_{0}^{1} P_{0}(f)}$$
     où l'intégrale désigne la fonction constante correspondante. L'application $\Pi$ est linéaire, comme $P_{0}$ et la forme linéaire $F \mapsto \int_{0}^{1} F$, et $\Pi(f)$ est continue : $\Pi$ est un endomorphisme de $E$.

    *Noyau et image.* Si $\Pi(f) = 0$, alors $f = \Pi(f)' = 0$. La fonction $\Pi(f)$ est de classe $\mathcal{C}^{1}$ d'intégrale nulle sur $[0\,,1]$ ; réciproquement, si $G$ est de classe $\mathcal{C}^{1}$ et vérifie $\int_{0}^{1} G = 0$, c'est une primitive de $G'$ d'intégrale nulle, donc $G = \Pi(G')$ par l'unicité. 
    $$\boxed{\mathrm{Ker}\, \Pi = \{0\}, \qquad \mathrm{Im}\, \Pi = \Big\{G \in \mathcal{C}^{1}(\mathbb{R}, \mathbb{R}) : \int_{0}^{1} G = 0\Big\}}$$
     *À retenir.* Les trois endomorphismes sont injectifs sans être surjectifs : la fonction $x \mapsto |x|$, continue mais non dérivable en $0$, n'est dans aucune des images. Au chapitre 15, un endomorphisme injectif d'un espace de dimension finie était automatiquement bijectif ; l'espace $E$ n'est pas de dimension finie, et ce résultat tombe. Par une intégration par parties, on peut aussi écrire $\int_{0}^{1} P_{0}(f) = \int_{0}^{1} (1 - t)f(t)\,\mathrm{d} t$.
- id: "ma-18-27"
  feuille: "f-ma-18"
  numero: 27
  partie: "Intégrale et primitives"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [intégrale et primitives, intégrales, sommes de Riemann]
  noeuds: [ar-tfa, ri-proprietes, ri-sommes]
  notions: [somme-riemann]
  page_enonce: 7
  page_corrige: 25
  enonce: |
    Soit $f : [1\,,2] \to [2\,,3]$ une bijection continue et strictement croissante. On veut montrer que 
    $$\int_{1}^{2} f + \int_{2}^{3} f^{-1} = 4.$$

    ![Figure](documents/figures/6afa7db92b2885f1.svg)

    Sur la figure, l'aire bleutée représente la première intégrale, et l'aire ocre la seconde, lue en intégrant selon l'axe des ordonnées.

    **1.** On suppose dans cette question que $f$ est de classe $\mathcal{C}^{1}$. Démontrer l'égalité, et l'interpréter sur la figure.

    **2.** On suppose seulement $f$ continue. Soit $n \geqslant 1$, $x_{k} = 1 + \frac{k}{n}$ et $y_{k} = f(x_{k})$ pour $k \in [\![0\,;n]\!]$. Montrer que 
    $$\sum_{k=0}^{n-1} (x_{k+1} - x_{k})\,f(x_{k}) + \sum_{k=0}^{n-1} (y_{k+1} - y_{k})\,f^{-1}(y_{k+1}) = 4,$$
     puis démontrer l'égalité à l'aide du théorème 9 du cours sur les sommes de Riemann.
  corrige: |
    Comme $f$ est une bijection croissante de $[1\,,2]$ sur $[2\,,3]$, on a $f(1) = 2$ et $f(2) = 3$, et $f^{-1}$ est continue sur $[2\,,3]$ (chapitre 8, théorème 11).

    **1.** On ne connaît pas $f^{-1}$, mais on connaît $f$ : le changement de variable $y = f(u)$ (chapitre 6, proposition 5) est naturel, puisqu'il transforme $f^{-1}(y)$ en $u$. La fonction $f$ est de classe $\mathcal{C}^{1}$ sur $[1\,,2]$, et $f^{-1}$ est continue sur $[2\,,3] = f([1\,,2])$ : 
    $$\int_{2}^{3} f^{-1}(y)\,\mathrm{d} y = \int_{f(1)}^{f(2)} f^{-1}(y)\,\mathrm{d} y = \int_{1}^{2} f^{-1}\big(f(u)\big)\,f'(u)\,\mathrm{d} u = \int_{1}^{2} u\,f'(u)\,\mathrm{d} u.$$
     On intègre ensuite par parties (chapitre 6, proposition 4), ce qui fait réapparaître $f$ : 
    $$\int_{1}^{2} u\,f'(u)\,\mathrm{d} u = \big[u\,f(u)\big]_{1}^{2} - \int_{1}^{2} f = 2 \times 3 - 1 \times 2 - \int_{1}^{2} f.$$

    $$\boxed{\int_{1}^{2} f + \int_{2}^{3} f^{-1} = 2f(2) - 1 \cdot f(1) = 4}$$
     *Lecture sur la figure.* Les deux domaines colorés recouvrent, sans se chevaucher, le rectangle $[0\,,2] \times [0\,,3]$ privé du rectangle blanc $[0\,,1] \times [0\,,2]$ : un point $(x, y)$ tel que $1 \leqslant x \leqslant 2$ et $2 \leqslant y \leqslant 3$ est sous la courbe si $y \leqslant f(x)$, et à gauche de la courbe si $x \leqslant f^{-1}(y)$. L'aire totale vaut $6 - 2 = 4$. Pour la fonction de la figure, $f(x) = 2 + (x - 1)^{2}$, on trouve $\int_{1}^{2} f = \frac{7}{3}$ et $\int_{2}^{3}\big(1 + \sqrt{y - 2}\big)\,\mathrm{d} y = \frac{5}{3}$. ✓

    **2.** *L'identité.* Comme $f^{-1}(y_{k + 1}) = x_{k + 1}$ et $f(x_{k}) = y_{k}$, chaque terme d'indice $k$ de la somme vaut 
    $$(x_{k + 1} - x_{k})\,y_{k} + (y_{k + 1} - y_{k})\,x_{k + 1} = x_{k + 1}y_{k + 1} - x_{k}y_{k}.$$
     La somme est télescopique, et vaut $x_{n}y_{n} - x_{0}y_{0} = 2 \times 3 - 1 \times 2$. 
    $$\boxed{\sum_{k = 0}^{n - 1} (x_{k + 1} - x_{k})\,f(x_{k}) + \sum_{k = 0}^{n - 1} (y_{k + 1} - y_{k})\,f^{-1}(y_{k + 1}) = 4}$$
     *Première somme.* C'est la somme $R_{n}(f)$ sur $[1\,,2]$ : par le théorème 9, elle tend vers $\int_{1}^{2} f$.

    *Seconde somme.* Comme $f$ est strictement croissante, $\sigma_{n} = (y_{0}, \dots, y_{n})$ est une subdivision de $[2\,,3]$, et $y_{k + 1} \in [y_{k}\,,y_{k + 1}]$ : c'est la somme de Riemann $S(f^{-1}, \sigma_{n}, \xi)$, avec $\xi_{k} = y_{k + 1}$. Elle n'est pas régulière, et il faut contrôler son pas. La fonction $f$ est continue sur un segment, donc uniformément continue (chapitre 8, théorème 12) : pour tout $\delta > 0$, il existe $\alpha > 0$ tel que $|x - x'| \leqslant \alpha$ entraîne $|f(x) - f(x')| \leqslant \delta$. Dès que $\frac{1}{n} \leqslant \alpha$, le pas de $\sigma_{n}$ est donc au plus $\delta$.

    Soit alors $\varepsilon > 0$, et $\delta$ associé à $\varepsilon$ et à $f^{-1} \in \mathcal{C}_{m}([2\,,3], \mathbb{R})$ par le théorème 9. Pour $n$ assez grand, le pas de $\sigma_{n}$ est au plus $\delta$, et la seconde somme est à moins de $\varepsilon$ de $\int_{2}^{3} f^{-1}$ : elle tend vers cette intégrale. En passant à la limite dans l'identité, 
    $$\boxed{\int_{1}^{2} f + \int_{2}^{3} f^{-1} = 4 \quad\text{pour } f \text{ seulement continue}}$$
     *Piège.* L'erreur la plus répandue est d'appliquer à la seconde somme la formule des sommes de Riemann régulières : les points $y_{k}$ ne sont pas équirépartis, et seul le théorème 9, avec un contrôle du pas, s'applique. C'est ici que sert la continuité uniforme, qui manquait au cas $\mathcal{C}^{1}$.

    *À retenir.* Le même calcul donne, pour toute bijection continue strictement croissante $f$ de $[a\,,b]$ sur $[f(a)\,,f(b)]$, l'égalité $\int_{a}^{b} f + \int_{f(a)}^{f(b)} f^{-1} = bf(b) - af(a)$. Avec $f = \ln$ sur $[1\,,\mathrm{e}]$, on retrouve $\int_{1}^{\mathrm{e}}\ln + \int_{0}^{1}\mathrm{e}^{y}\,\mathrm{d} y = 1 + (\mathrm{e} - 1) = \mathrm{e}$. ✓
- id: "ma-18-28"
  feuille: "f-ma-18"
  numero: 28
  partie: "Intégrale et primitives"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [intégrale et primitives, intégrales, fonctions définies par une intégrale, logarithme et exponentielle]
  noeuds: [ar-tfa, ri-proprietes]
  notions: []
  page_enonce: 8
  page_corrige: 26
  enonce: |
    *Une intégrale calculée sans primitive.* Pour $x \in \,]0\,,1[$, on pose $\displaystyle f(x) = \int_{x}^{x^{2}} \frac{\mathrm{d} t}{\ln t}$, et l'on pose $f(0) = 0$.

    **1.** Justifier que $f$ est bien définie, et montrer que $f$ est continue en $0$.

    **2.** Soit $x \in \,]0\,,1[$. Montrer que, pour tout $t \in [x^{2}\,,1]$, 
    $$\frac{2\ln x}{x^{2} - 1}\,(t - 1) \leqslant \ln t \leqslant t - 1.$$

    **3.** En déduire que $f$ se prolonge par continuité en $1$, en précisant la valeur $f(1)$.

    **4.** Montrer que $f$ est de classe $\mathcal{C}^{1}$ sur $[0\,,1]$, et calculer $f'$.

    **5.** En déduire la valeur de $\displaystyle\int_{0}^{1} \frac{t - 1}{\ln t}\,\mathrm{d} t$, après avoir justifié que la fonction intégrée se prolonge en une fonction continue sur $[0\,,1]$.
  corrige: |
    Aucune primitive de $t \mapsto \frac{1}{\ln t}$ n'est disponible : tout repose sur des encadrements et sur le théorème 6, qui permet de dériver $f$ sans la calculer.

    **1.** Pour $x \in \,]0\,,1[$, on a $0 < x^{2} < x < 1$ : le segment $[x^{2}\,,x]$ est contenu dans $]0\,,1[$, où $t \mapsto \frac{1}{\ln t}$ est continue, et $f(x)$ est bien défini. Pour $t \in [x^{2}\,,x]$, on a $\ln t \leqslant \ln x < 0$, donc $\big|\frac{1}{\ln t}\big| \leqslant \frac{1}{|\ln x|}$, et l'inégalité triangulaire donne 
    $$|f(x)| \leqslant \frac{x - x^{2}}{|\ln x|} \xrightarrow[x \to 0^{+}]{} 0 = f(0).$$

    $$\boxed{f \text{ est continue en } 0}$$

    **2.** La fonction $\ln$ est concave (chapitre 9) : sa courbe est au-dessous de ses tangentes et au-dessus de ses cordes. La tangente en $1$ est la droite $y = t - 1$. La corde entre les points d'abscisses $x^{2}$ et $1$ passe par $(1, 0)$ et $(x^{2}, 2\ln x)$, de pente $\frac{2\ln x}{x^{2} - 1}$ ; sur $[x^{2}\,,1]$, la courbe est au-dessus de cette corde. 
    $$\boxed{\forall t \in [x^{2}\,,1], \quad \frac{2\ln x}{x^{2} - 1}\,(t - 1) \leqslant \ln t \leqslant t - 1}$$

    **3.** On note $c = \frac{2\ln x}{x^{2} - 1} > 0$. Pour $t \in [x^{2}\,,x]$, les trois membres de l'encadrement précédent sont strictement négatifs, et l'on passe aux inverses, ce qui renverse les inégalités : 
    $$\frac{1}{t - 1} \leqslant \frac{1}{\ln t} \leqslant \frac{1}{c(t - 1)}.$$
     On intègre sur $[x^{2}\,,x]$, dans l'ordre croissant, avec $\int_{x^{2}}^{x} \frac{\mathrm{d} t}{t - 1} = \ln(1 - x) - \ln(1 - x^{2}) = -\ln(1 + x)$, puis on change de signe, puisque $f(x) = -\int_{x^{2}}^{x} \frac{\mathrm{d} t}{\ln t}$ : 
    $$\boxed{\frac{x^{2} - 1}{2\ln x}\,\ln(1 + x) \leqslant f(x) \leqslant \ln(1 + x)}$$
     Quand $x$ tend vers $1$, on a $\ln x \sim x - 1$ (chapitre 10), donc $\frac{x^{2} - 1}{2\ln x} \sim \frac{x + 1}{2}$ tend vers $1$, et les deux bornes tendent vers $\ln 2$. 
    $$\boxed{f \text{ se prolonge par continuité en } 1, \text{ avec } f(1) = \ln 2}$$
     Pour $x = 0{,}9$, l'encadrement s'écrit $0{,}578\,7 \leqslant f(x) \approx 0{,}595\,7 \leqslant 0{,}641\,9$. ✓

    *Piège.* L'erreur la plus répandue est d'oublier l'un des deux changements de sens : le passage aux inverses de nombres négatifs, puis le signe $-$ dû aux bornes $x > x^{2}$ dans le mauvais ordre. Le contrôle est simple : $c = \frac{\ln(x^{2})}{x^{2} - 1} > 1$, puisque $\ln u < u - 1 < 0$ pour $u = x^{2} \in \,]0\,,1[$, donc la borne inférieure est bien la plus petite.

    **4.** *Sur $]0\,,1[$.* Soit $H$ une primitive de $t \mapsto \frac{1}{\ln t}$ sur $]0\,,1[$ (théorème 6). Alors $f(x) = H(x^{2}) - H(x)$ est de classe $\mathcal{C}^{1}$ sur $]0\,,1[$, et 
    $$f'(x) = \frac{2x}{\ln(x^{2})} - \frac{1}{\ln x} = \frac{2x}{2\ln x} - \frac{1}{\ln x} = \frac{x - 1}{\ln x}.$$
     *En $0$ et en $1$.* La fonction $f$ est continue sur $[0\,,1]$ par les questions 1 et 3. Quand $x$ tend vers $0$, $f'(x)$ tend vers $0$, le numérateur tendant vers $-1$ et le dénominateur vers $-\infty$ ; quand $x$ tend vers $1$, $\ln x \sim x - 1$, et $f'(x)$ tend vers $1$. Le théorème de la limite de la dérivée (chapitre 9, théorème 8) montre que $f$ est dérivable en $0$ et en $1$, avec $f'(0) = 0$ et $f'(1) = 1$, et que $f'$ y est continue. 
    $$\boxed{f \in \mathcal{C}^{1}([0\,,1]), \qquad f'(x) = \frac{x - 1}{\ln x} \text{ sur } ]0\,,1[, \qquad f'(0) = 0, \quad f'(1) = 1}$$

    **5.** La fonction $h : t \mapsto \frac{t - 1}{\ln t}$, définie sur $]0\,,1[$, coïncide avec $f'$ ; elle se prolonge donc en une fonction continue sur $[0\,,1]$, par $h(0) = 0$ et $h(1) = 1$, et ce prolongement est $f'$. Le théorème 6 donne alors $\int_{0}^{1} h = f(1) - f(0)$. 
    $$\boxed{\int_{0}^{1} \frac{t - 1}{\ln t}\,\mathrm{d} t = \ln 2}$$
     Une intégration numérique donne $0{,}693\,147\,18\ldots$ ✓

    *À retenir.* On a calculé une intégrale dont on ne connaît aucune primitive explicite, en la reconnaissant comme la dérivée d'une fonction $f$ définie par une autre intégrale. Le seul calcul effectif est celui de $f(1)$, obtenu par encadrement.
- id: "ma-18-29"
  feuille: "f-ma-18"
  numero: 29
  partie: "Intégrale et primitives"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [intégrale et primitives, intégrales, "suites d'intégrales"]
  noeuds: [ar-tfa, ri-proprietes, su-convergence]
  notions: []
  page_enonce: 8
  page_corrige: 27
  enonce: |
    Soit $f : [0\,,1] \to \mathbb{R}$ continue. Pour $n \in \mathbb{N}$, on pose $\displaystyle u_{n} = \int_{0}^{1} t^{n}f(t)\,\mathrm{d} t$.

    **1.** Montrer que la suite $(u_{n})$ tend vers $0$.

    **2.** On suppose de plus que $f$ est de classe $\mathcal{C}^{1}$ et que $f(1) \neq 0$. Déterminer un équivalent de $u_{n}$.

    **3.** Déterminer un équivalent de $\displaystyle\int_{0}^{1} t^{n}\sin\frac{\pi t}{2}\,\mathrm{d} t$ et de $\displaystyle\int_{0}^{1} t^{n}\cos\frac{\pi t}{2}\,\mathrm{d} t$.
  corrige: |
    **1.** La fonction $f$ est continue sur le segment $[0\,,1]$, donc bornée (chapitre 8, théorème 10) ; on note $M = \max|f|$. L'inégalité triangulaire donne 
    $$|u_{n}| \leqslant \int_{0}^{1} t^{n}|f(t)|\,\mathrm{d} t \leqslant M\int_{0}^{1} t^{n}\,\mathrm{d} t = \frac{M}{n + 1}.$$

    $$\boxed{u_{n} \xrightarrow[n \to +\infty]{} 0}$$

    **2.** On intègre par parties (chapitre 6, proposition 4), en primitivant $t^{n}$ en $\frac{t^{n + 1}}{n + 1}$ et en dérivant $f$. C'est le choix naturel : la primitivation fait sortir un facteur $\frac{1}{n + 1}$, et l'intégrale qui reste est du type de la question 1, avec $f'$ à la place de $f$. Avec $v_{m} = \int_{0}^{1} t^{m}f'(t)\,\mathrm{d} t$, 
    $$u_{n} = \Big[\frac{t^{n + 1}}{n + 1}\,f(t)\Big]_{0}^{1} - \frac{1}{n + 1}\int_{0}^{1} t^{n + 1}f'(t)\,\mathrm{d} t = \frac{f(1) - v_{n + 1}}{n + 1}.$$
     La fonction $f'$ est continue, et la question 1, appliquée à $f'$, montre que $v_{n + 1}$ tend vers $0$. Donc $(n + 1)u_{n}$ tend vers $f(1) \neq 0$, ce qui signifie $u_{n} \sim \frac{f(1)}{n + 1} \sim \frac{f(1)}{n}$. 
    $$\boxed{u_{n} \sim \frac{f(1)}{n}}$$

    **3.** *Sinus.* La fonction $f(t) = \sin\frac{\pi t}{2}$ est de classe $\mathcal{C}^{1}$ et $f(1) = 1$. 
    $$\boxed{\int_{0}^{1} t^{n}\sin\frac{\pi t}{2}\,\mathrm{d} t \sim \frac{1}{n}}$$
     *Cosinus.* Ici $f(1) = \cos\frac{\pi}{2} = 0$, et la question 2 ne conclut pas. On revient à l'égalité exacte de la question 2, $(n + 1)u_{n} = -v_{n + 1}$, avec cette fois $f'(t) = -\frac{\pi}{2}\sin\frac{\pi t}{2}$ : 
    $$(n + 1)\,u_{n} = \frac{\pi}{2}\int_{0}^{1} t^{n + 1}\sin\frac{\pi t}{2}\,\mathrm{d} t \sim \frac{\pi}{2} \times \frac{1}{n + 1},$$
     par le cas du sinus au rang $n + 1$. Donc $u_{n} \sim \frac{\pi}{2(n + 1)^{2}} \sim \frac{\pi}{2n^{2}}$. 
    $$\boxed{\int_{0}^{1} t^{n}\cos\frac{\pi t}{2}\,\mathrm{d} t \sim \frac{\pi}{2n^{2}}}$$
     Pour $n = 10^{4}$, on calcule numériquement $n \times 0{,}000\,099\,99\ldots \approx 0{,}999\,90$ et $n^{2}$ fois la seconde intégrale $\approx 1{,}570\,3$, contre $\frac{\pi}{2} \approx 1{,}570\,8$. ✓

    *Piège.* L'erreur la plus répandue est d'écrire $u_{n} \sim \frac{0}{n}$ quand $f(1) = 0$ : un équivalent n'est jamais la suite nulle (chapitre 10). L'intégrale $\int_{0}^{1} t^{n}f(t)\,\mathrm{d} t$ ne voit, pour $n$ grand, que les valeurs de $f$ près de $1$ ; si $f(1) = 0$, il faut regarder l'ordre suivant, ici $f'(1)$.
- id: "ma-18-30"
  feuille: "f-ma-18"
  numero: 30
  partie: "Intégrale et primitives"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [intégrale et primitives, intégrales, "suites d'intégrales", logarithme et exponentielle]
  noeuds: [ar-tfa, ri-proprietes, su-convergence]
  notions: []
  page_enonce: 8
  page_corrige: 28
  enonce: |
    Pour $n \in \mathbb{N}$, on pose $\displaystyle I_{n} = \int_{0}^{\pi/2} \frac{t}{\cos\big(\frac{nt}{n + 1}\big)}\,\mathrm{d} t$.

    **1.** Justifier l'existence de $I_{n}$, et montrer que la suite $(I_{n})$ est monotone.

    **2.** Déterminer la limite de $(I_{n})$.

    **3.** Montrer que $I_{n} \sim \dfrac{\pi}{2}\ln n$ quand $n$ tend vers $+\infty$. On pourra montrer que la fonction 
    $$u \longmapsto \frac{u}{\cos u} - \frac{\pi/2}{\pi/2 - u}$$
     est bornée sur $\big[0\,,\frac{\pi}{2}\big[$.
  corrige: |
    On note $a_{n} = \frac{n}{n + 1}$ et $b_{n} = a_{n}\frac{\pi}{2}$, de sorte que $\frac{\pi}{2} - b_{n} = \frac{\pi}{2(n + 1)}$.

    **1.** Pour $t \in \big[0\,,\frac{\pi}{2}\big]$, on a $a_{n}t \in [0\,,b_{n}] \subset \big[0\,,\frac{\pi}{2}\big[$, où le cosinus est strictement positif : l'intégrande est continu sur le segment, et $I_{n}$ existe. À $t$ fixé, la suite $(a_{n}t)$ est croissante dans $\big[0\,,\frac{\pi}{2}\big[$, où le cosinus est décroissant et positif ; donc $\frac{t}{\cos(a_{n}t)}$ croît avec $n$, et la croissance de l'intégrale conclut. 
    $$\boxed{(I_{n}) \text{ est croissante}}$$

    **2.** Pour minorer, on utilise $\cos u = \sin\big(\frac{\pi}{2} - u\big) \leqslant \frac{\pi}{2} - u$ pour $u \in \big[0\,,\frac{\pi}{2}\big]$, puis le changement de variable $u = a_{n}t$, pour $n \geqslant 1$ (chapitre 6, proposition 5), naturel puisque $a_{n}t$ est l'argument du cosinus : 
    $$I_{n} \geqslant \int_{0}^{\pi/2} \frac{t\,\mathrm{d} t}{\frac{\pi}{2} - a_{n}t} = \frac{1}{a_{n}^{2}}\int_{0}^{b_{n}} \frac{u\,\mathrm{d} u}{\frac{\pi}{2} - u} \geqslant \int_{0}^{b_{n}} \Big(\frac{\pi/2}{\frac{\pi}{2} - u} - 1\Big)\mathrm{d} u,$$
     car $\frac{1}{a_{n}^{2}} \geqslant 1$ et l'intégrale est positive. La dernière intégrale vaut $\frac{\pi}{2}\ln\frac{\pi/2}{\pi/2 - b_{n}} - b_{n} = \frac{\pi}{2}\ln(n + 1) - b_{n}$. 
    $$\boxed{I_{n} \geqslant \frac{\pi}{2}\ln(n + 1) - \frac{\pi}{2} \xrightarrow[n \to +\infty]{} +\infty}$$

    **3.** *La fonction auxiliaire.* La fonction $\varphi(u) = \frac{u}{\cos u} - \frac{\pi/2}{\pi/2 - u}$ est continue sur $\big[0\,,\frac{\pi}{2}\big[$. On pose $u = \frac{\pi}{2} - h$, avec $h \to 0^{+}$ ; alors $\cos u = \sin h$, et 
    $$\varphi(u) = \frac{\pi}{2}\Big(\frac{1}{\sin h} - \frac{1}{h}\Big) - \frac{h}{\sin h} = \frac{\pi}{2} \times \frac{h - \sin h}{h\sin h} - \frac{h}{\sin h} \xrightarrow[h \to 0^{+}]{} -1,$$
     puisque $h - \sin h \sim \frac{h^{3}}{6}$ et $h\sin h \sim h^{2}$ (chapitre 10). Prolongée par $\varphi\big(\frac{\pi}{2}\big) = -1$, $\varphi$ est continue sur le segment $\big[0\,,\frac{\pi}{2}\big]$, donc bornée par un réel $K$ (chapitre 8, théorème 10).

    *Le calcul.* Le même changement de variable $u = a_{n}t$ donne cette fois l'égalité 
    $$I_{n} = \frac{1}{a_{n}^{2}}\int_{0}^{b_{n}} \frac{u\,\mathrm{d} u}{\cos u} = \frac{1}{a_{n}^{2}}\Big(\int_{0}^{b_{n}} \frac{\pi/2}{\frac{\pi}{2} - u}\,\mathrm{d} u + \int_{0}^{b_{n}} \varphi\Big) = \frac{1}{a_{n}^{2}}\Big(\frac{\pi}{2}\ln(n + 1) + R_{n}\Big),$$
     avec $|R_{n}| \leqslant \frac{K\pi}{2}$. Comme $a_{n}$ tend vers $1$ et que $\ln(n + 1) = \ln n + \ln\big(1 + \frac{1}{n}\big) \sim \ln n$, on obtient $\frac{2I_{n}}{\pi\ln n} \to 1$. 
    $$\boxed{I_{n} \sim \frac{\pi}{2}\ln n}$$
     *À retenir.* On peut aller plus loin. La fonction $x \mapsto \int_{0}^{x} \varphi$ est continue sur $\big[0\,,\frac{\pi}{2}\big]$, donc $R_{n}$ tend vers $C = \int_{0}^{\pi/2} \varphi \approx -1{,}4525$, et l'on vérifie que $I_{n} - \frac{\pi}{2}\ln n$ tend vers $C$. La convergence est lente : on trouve numériquement $-0{,}647$, $-1{,}305$, $-1{,}431$ et $-1{,}450$ pour $n = 10$, $10^{2}$, $10^{3}$ et $10^{4}$. Le rapport $\frac{2I_{n}}{\pi\ln n}$ tend vers $1$ plus lentement encore, puisque l'écart est de l'ordre de $\frac{2C}{\pi\ln n}$. La méthode est générale : pour trouver un équivalent d'une intégrale dont l'intégrande devient grand près d'une borne, on retranche une fonction simple qui a la même singularité, dont on sait calculer l'intégrale, et l'on montre que la différence reste bornée.
- id: "ma-18-31"
  feuille: "f-ma-18"
  numero: 31
  partie: "Intégrale et primitives"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [intégrale et primitives, intégrales]
  noeuds: [ar-tfa, ri-proprietes]
  notions: [fonction-convexe]
  page_enonce: 8
  page_corrige: 29
  enonce: |
    Soit $f : [0\,,2\pi] \to \mathbb{R}$ une fonction convexe de classe $\mathcal{C}^{1}$. Montrer que, pour tout entier $n \geqslant 1$, 
    $$a_{n} = \int_{0}^{2\pi} f(t)\cos(nt)\,\mathrm{d} t \geqslant 0.$$
     On pourra découper $[0\,,2\pi]$ en intervalles de longueur $\frac{\pi}{n}$.
  corrige: |
    On intègre par parties (chapitre 6, proposition 4), en dérivant $f$ et en primitivant $\cos(nt)$ en $\frac{\sin(nt)}{n}$. C'est le choix naturel : l'hypothèse de convexité porte sur $f'$, qui est croissante (chapitre 9, théorème 10), et le crochet est nul puisque $\sin(nt)$ s'annule en $0$ et en $2\pi$ : 
    $$a_{n} = \Big[\frac{f(t)\sin(nt)}{n}\Big]_{0}^{2\pi} - \frac{1}{n}\int_{0}^{2\pi} f'(t)\sin(nt)\,\mathrm{d} t = -\frac{1}{n}\int_{0}^{2\pi} f'(t)\sin(nt)\,\mathrm{d} t.$$
     On découpe $[0\,,2\pi]$, par la relation de Chasles, en $n$ intervalles $\big[\frac{2k\pi}{n}\,,\frac{(2k + 2)\pi}{n}\big]$, pour $k \in [\![0\,;n - 1]\!]$, et chacun en deux moitiés de longueur $\frac{\pi}{n}$. Sur la seconde moitié, le changement de variable $t = s + \frac{\pi}{n}$ et la relation $\sin(ns + \pi) = -\sin(ns)$ donnent 
    $$\int_{2k\pi/n}^{(2k + 2)\pi/n} f'(t)\sin(nt)\,\mathrm{d} t = \int_{2k\pi/n}^{(2k + 1)\pi/n} \Big(f'(s) - f'\Big(s + \frac{\pi}{n}\Big)\Big)\sin(ns)\,\mathrm{d} s.$$
     Sur l'intervalle d'intégration, $ns \in [2k\pi\,,(2k + 1)\pi]$, donc $\sin(ns) \geqslant 0$ ; et $f'(s) - f'\big(s + \frac{\pi}{n}\big) \leqslant 0$, puisque $f'$ est croissante. Chaque morceau est négatif, donc $\int_{0}^{2\pi} f'(t)\sin(nt)\,\mathrm{d} t \leqslant 0$. 
    $$\boxed{a_{n} = -\frac{1}{n}\int_{0}^{2\pi} f'(t)\sin(nt)\,\mathrm{d} t \geqslant 0}$$
     Pour $f(t) = t^{2}$, un calcul direct donne $a_{n} = \frac{4\pi}{n^{2}} > 0$. ✓

    *À retenir.* Le découpage compare la valeur de $f'$ sur une arche positive du sinus à sa valeur sur l'arche négative qui suit : comme $f'$ croît, l'arche négative pèse plus. Pour $f$ concave, on obtient de même $a_{n} \leqslant 0$. Les nombres $a_{n}$ sont, au facteur $\frac{1}{\pi}$ près, les coefficients de Fourier de $f$, que l'on étudiera en seconde année.
- id: "ma-18-32"
  feuille: "f-ma-18"
  numero: 32
  partie: "Formules de Taylor globales"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [formules de Taylor, formule de Taylor, logarithme et exponentielle]
  noeuds: [de-taylor, ar-tfa]
  notions: [polynome-taylor]
  page_enonce: 9
  page_corrige: 30
  enonce: |
    À l'aide de la formule de Taylor avec reste intégral, montrer les encadrements suivants.

    **(a)** Pour tout $x \geqslant 0$, $x - \dfrac{x^{2}}{2} \leqslant \ln(1 + x) \leqslant x - \dfrac{x^{2}}{2} + \dfrac{x^{3}}{3}$.

    **(b)** Pour tout $x \in \big[0\,,\frac{\pi}{2}\big]$, $x - \dfrac{x^{3}}{6} \leqslant \sin x \leqslant x - \dfrac{x^{3}}{6} + \dfrac{x^{5}}{120}$.

    **(c)** Pour tout $x \geqslant 0$, $1 - \dfrac{x}{3} + \dfrac{2x^{2}}{9} - \dfrac{14x^{3}}{81} \leqslant \dfrac{1}{\sqrt[3]{1 + x}} \leqslant 1 - \dfrac{x}{3} + \dfrac{2x^{2}}{9}$.
  corrige: |
    Dans les trois cas, on applique la formule de Taylor avec reste intégral (théorème 7) en $a = 0$, à l'ordre $n$ qui fait apparaître le polynôme voulu ; pour $x \geqslant 0$, le facteur $(x - t)^{n}$ est positif sur $[0\,,x]$, et le signe du reste est celui de la dérivée $f^{(n + 1)}$.

    *(a)* Pour $f(t) = \ln(1 + t)$, on a $f'''(t) = \frac{2}{(1 + t)^{3}} > 0$ et $f''''(t) = -\frac{6}{(1 + t)^{4}} < 0$. Les formules aux ordres $2$ et $3$ donnent 
    $$\ln(1 + x) = x - \frac{x^{2}}{2} + \int_{0}^{x} \frac{(x - t)^{2}}{2}\,f'''(t)\,\mathrm{d} t = x - \frac{x^{2}}{2} + \frac{x^{3}}{3} + \int_{0}^{x} \frac{(x - t)^{3}}{6}\,f''''(t)\,\mathrm{d} t,$$
     où le premier reste est positif et le second négatif. 
    $$\boxed{x - \frac{x^{2}}{2} \leqslant \ln(1 + x) \leqslant x - \frac{x^{2}}{2} + \frac{x^{3}}{3} \qquad (x \geqslant 0)}$$

    *(b)* Les dérivées d'ordre pair du sinus sont nulles en $0$, donc ses polynômes de Taylor d'ordres $4$ et $6$ sont $x - \frac{x^{3}}{6}$ et $x - \frac{x^{3}}{6} + \frac{x^{5}}{120}$. Les restes font intervenir $\sin^{(5)} = \cos$ et $\sin^{(7)} = -\cos$ : 
    $$\sin x = x - \frac{x^{3}}{6} + \int_{0}^{x} \frac{(x - t)^{4}}{24}\cos t\,\mathrm{d} t = x - \frac{x^{3}}{6} + \frac{x^{5}}{120} - \int_{0}^{x} \frac{(x - t)^{6}}{720}\cos t\,\mathrm{d} t.$$
     Pour $x \in \big[0\,,\frac{\pi}{2}\big]$, on a $\cos t \geqslant 0$ sur $[0\,,x]$ : le premier reste est positif, et le second est retranché. 
    $$\boxed{x - \frac{x^{3}}{6} \leqslant \sin x \leqslant x - \frac{x^{3}}{6} + \frac{x^{5}}{120} \qquad \Big(0 \leqslant x \leqslant \frac{\pi}{2}\Big)}$$

    *(c)* Pour $g(t) = (1 + t)^{-1/3}$, on calcule par récurrence 
    $$g'(t) = -\frac{1}{3}(1 + t)^{-4/3}, \quad g''(t) = \frac{4}{9}(1 + t)^{-7/3}, \quad g'''(t) = -\frac{28}{27}(1 + t)^{-10/3}, \quad g''''(t) = \frac{280}{81}(1 + t)^{-13/3}.$$
     Les coefficients de Taylor en $0$ sont $1$, $-\frac{1}{3}$, $\frac{4}{9} \times \frac{1}{2} = \frac{2}{9}$ et $-\frac{28}{27} \times \frac{1}{6} = -\frac{14}{81}$. Le reste d'ordre $2$ contient $g''' < 0$, et le reste d'ordre $3$ contient $g'''' > 0$. 
    $$\boxed{1 - \frac{x}{3} + \frac{2x^{2}}{9} - \frac{14x^{3}}{81} \leqslant \frac{1}{\sqrt[3]{1 + x}} \leqslant 1 - \frac{x}{3} + \frac{2x^{2}}{9} \qquad (x \geqslant 0)}$$
     Les trois encadrements ont été contrôlés numériquement sur $[0\,,50]$ et sur $\big[0\,,\frac{\pi}{2}\big]$. ✓

    *Piège.* Le signe du reste est celui de $f^{(n + 1)}$ seulement pour $x \geqslant 0$. Pour $x < 0$, on a $\int_{0}^{x} = -\int_{x}^{0}$, et le facteur $(x - t)^{n}$ a le signe de $(-1)^{n}$ : l'erreur la plus répandue est d'appliquer le même raisonnement sans regarder le sens des bornes. Par exemple, $\ln(1 + x) \leqslant x - \frac{x^{2}}{2} + \frac{x^{3}}{3}$ reste vrai pour $x \in \,]-1\,,0]$, mais $\ln(1 + x) \geqslant x - \frac{x^{2}}{2}$ devient faux.
- id: "ma-18-33"
  feuille: "f-ma-18"
  numero: 33
  partie: "Formules de Taylor globales"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [formules de Taylor, calcul approché, logarithme et exponentielle]
  noeuds: [de-taylor, ri-sommes, ar-tfa]
  notions: [polynome-taylor]
  page_enonce: 9
  page_corrige: 31
  enonce: |
    **1.** Montrer que, pour tout réel $a > 0$, $\Big|\cos a - 1 + \dfrac{a^{2}}{2} - \dfrac{a^{4}}{24}\Big| \leqslant \dfrac{a^{5}}{120}$, et en déduire que 
    $$\frac{337}{384} - \frac{1}{3840} \leqslant \cos\frac{1}{2} \leqslant \frac{337}{384} + \frac{1}{3840}.$$

    **2.** Montrer que $\Big|\ln(1 + x) - x + \dfrac{x^{2}}{2}\Big| \leqslant \dfrac{x^{3}}{3}$ pour tout $x > 0$, et en déduire une valeur approchée décimale de $\ln(1{,}003)$ à $10^{-8}$ près.
  corrige: |
    **1.** On applique l'inégalité de Taylor-Lagrange (théorème 8) au cosinus, en $0$, à l'ordre $4$ : le polynôme de Taylor est $1 - \frac{a^{2}}{2} + \frac{a^{4}}{24}$, et $|\cos^{(5)}| = |\sin| \leqslant 1$. 
    $$\boxed{\Big|\cos a - 1 + \frac{a^{2}}{2} - \frac{a^{4}}{24}\Big| \leqslant \frac{a^{5}}{5!} = \frac{a^{5}}{120}}$$
     Pour $a = \frac{1}{2}$, on a $1 - \frac{1}{8} + \frac{1}{384} = \frac{384 - 48 + 1}{384} = \frac{337}{384}$ et $\frac{(1/2)^{5}}{120} = \frac{1}{3840}$. 
    $$\boxed{\frac{337}{384} - \frac{1}{3840} \leqslant \cos\frac{1}{2} \leqslant \frac{337}{384} + \frac{1}{3840}}$$
     Numériquement, $\cos\frac{1}{2} - \frac{337}{384} \approx -2{,}16 \times 10^{-5}$, nettement moins que $\frac{1}{3840} \approx 2{,}6 \times 10^{-4}$. La raison est que la dérivée cinquième du cosinus est nulle en $0$ : le polynôme d'ordre $4$ est aussi celui d'ordre $5$, et le théorème 8 à l'ordre $5$ donne la majoration $\frac{a^{6}}{720} = \frac{1}{46\,080} \approx 2{,}17 \times 10^{-5}$, presque atteinte. ✓

    **2.** Pour $f(t) = \ln(1 + t)$, on a $f'''(t) = \frac{2}{(1 + t)^{3}}$, majoré par $2$ sur $[0\,,x]$. L'inégalité de Taylor-Lagrange à l'ordre $2$, en $0$, donne une erreur au plus $2 \times \frac{x^{3}}{3!}$. 
    $$\boxed{\Big|\ln(1 + x) - x + \frac{x^{2}}{2}\Big| \leqslant \frac{x^{3}}{3} \qquad (x > 0)}$$
     Pour $x = 0{,}003$, on a $x - \frac{x^{2}}{2} = 0{,}003 - 0{,}000\,004\,5 = 0{,}002\,995\,5$ et $\frac{x^{3}}{3} = 9 \times 10^{-9} < 10^{-8}$. L'exercice 32 (a) précise le signe : l'erreur est positive, et $0{,}002\,995\,5$ est une valeur approchée par défaut. 
    $$\boxed{\ln(1{,}003) \approx 0{,}002\,995\,5 \ \text{ à } 10^{-8} \text{ près, par défaut}}$$
     La valeur réelle est $\ln(1{,}003) = 0{,}002\,995\,508\,98\ldots$ : l'écart, $8{,}98 \times 10^{-9}$, est presque égal à la majoration, parce que $f'''(t)$ vaut presque $2$ sur un intervalle aussi court. ✓
- id: "ma-18-34"
  feuille: "f-ma-18"
  numero: 34
  partie: "Formules de Taylor globales"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [formules de Taylor, intégrales, formule de Taylor, logarithme et exponentielle]
  noeuds: [de-taylor, ri-proprietes, ar-tfa]
  notions: [polynome-taylor]
  page_enonce: 9
  page_corrige: 31
  enonce: |
    En appliquant la formule de Taylor avec reste intégral à la fonction $x \mapsto \ln(1 + x^{2})$ entre $0$ et $1$, à un ordre que l'on choisira, montrer que 
    $$\int_{0}^{1} \frac{(1 + t)(1 - t)^{2}}{(1 + t^{2})^{2}}\,\mathrm{d} t = \frac{\ln 2}{2}.$$
  corrige: |
    On applique la formule de Taylor avec reste intégral (théorème 7) à $f(x) = \ln(1 + x^{2})$, en $0$ et au point $1$. L'ordre se choisit en regardant l'intégrande : on a $f'(x) = \frac{2x}{1 + x^{2}}$ et 
    $$f''(x) = \frac{2(1 + x^{2}) - 4x^{2}}{(1 + x^{2})^{2}} = \frac{2(1 - x)(1 + x)}{(1 + x^{2})^{2}},$$
     de sorte que le facteur $(1 - t)$ du reste d'ordre $1$ complète le carré $(1 - t)^{2}$ attendu. C'est donc l'ordre $1$ qui convient, et, comme $f(0) = f'(0) = 0$, 
    $$\ln 2 = f(1) = f(0) + f'(0) + \int_{0}^{1} (1 - t)\,f''(t)\,\mathrm{d} t = 2\int_{0}^{1} \frac{(1 + t)(1 - t)^{2}}{(1 + t^{2})^{2}}\,\mathrm{d} t.$$

    $$\boxed{\int_{0}^{1} \frac{(1 + t)(1 - t)^{2}}{(1 + t^{2})^{2}}\,\mathrm{d} t = \frac{\ln 2}{2}}$$
     Un calcul symbolique de l'intégrale, par décomposition en éléments simples, confirme ce résultat. ✓

    *À retenir.* La formule de Taylor avec reste intégral se lit dans les deux sens : elle approche $f$ par son polynôme de Taylor, mais elle permet aussi, comme ici, de calculer une intégrale de la forme $\int_{a}^{x} \frac{(x - t)^{n}}{n!}\,g(t)\,\mathrm{d} t$ quand on reconnaît en $g$ une dérivée $(n + 1)$-ième. À l'ordre $2$, le reste ferait intervenir $f'''(t) = \frac{4t(t^{2} - 3)}{(1 + t^{2})^{3}}$ et le facteur $\frac{(1 - t)^{2}}{2}$, ce qui ne donne pas l'intégrande de l'énoncé.
