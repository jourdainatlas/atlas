  enonce: |
    **1.** Calculer les intégrales suivantes.

    **(a)** $\displaystyle\int_{2}^{3} \frac{t + 1}{t(t - 1)^{3}}\,\mathrm{d} t$

    **(b)** $\displaystyle\int_{0}^{1} \frac{t^{4}}{t^{2} + 2t + 5}\,\mathrm{d} t$

    **(c)** $\displaystyle\int_{2}^{3} \frac{x^{2} + x + 1}{x^{3} + 1}\,\mathrm{d} x$

    **(d)** $\displaystyle\int_{-1}^{1} \frac{\mathrm{d} x}{x^{4} - 4}$

    **(e)** $\displaystyle\int_{0}^{1} \frac{\mathrm{d} t}{(1 + t^{2})^{2}}$

    **2.** Déterminer une primitive des fonctions suivantes, sur un intervalle ne contenant aucun pôle.

    **(a)** $x \mapsto \dfrac{1}{(x^{2} - 1)(x - 2)^{2}}$

    **(b)** $x \mapsto \dfrac{x}{x^{4} - x^{2} - 2}$

    **(c)** $x \mapsto \dfrac{1}{x(x^{3} + 1)}$

    **(d)** $x \mapsto \dfrac{x^{7}}{(x^{4} + 1)^{2}}$

    **(e)** $x \mapsto \dfrac{1}{x^{3} - 1}$
  corrige: |
    Les fonctions à intégrer sont des fractions rationnelles, continues sur les intervalles considérés, qui ne contiennent aucun pôle : on applique la méthode du cours (section 18.4.4), c'est-à-dire la décomposition en éléments simples sur $\mathbb{R}$ (chapitre 13, théorème 14), après avoir cherché si un raccourci, une forme $\frac{u'}{u}$ ou un changement de variable $u = x^{k}$, évite le calcul complet.

    **1.(a)** Les pôles $0$ et $1$ sont hors de $[2\,,3]$. Le coefficient du pôle simple $0$ vaut $\frac{0 + 1}{(0 - 1)^{3}} = -1$ (chapitre 13, proposition 23). Pour le pôle triple, on pose $t = 1 + h$ : la partie polaire en $1$ s'obtient à partir du développement limité $\frac{2 + h}{1 + h} = 2 - h + h^{2} + o(h^{2})$ (chapitre 10), divisé par $h^{3}$. 
    $$\frac{t + 1}{t(t - 1)^{3}} = -\frac{1}{t} + \frac{2}{(t - 1)^{3}} - \frac{1}{(t - 1)^{2}} + \frac{1}{t - 1}.$$
     Une primitive sur $[2\,,3]$ est $t \mapsto -\ln t + \ln(t - 1) - \frac{1}{(t - 1)^{2}} + \frac{1}{t - 1}$, qui vaut $\ln\frac{2}{3} + \frac{1}{4}$ en $3$ et $-\ln 2$ en $2$. 
    $$\boxed{\int_{2}^{3} \frac{t + 1}{t(t - 1)^{3}}\,\mathrm{d} t = \frac{1}{4} + \ln\frac{4}{3} \approx 0{,}5377}$$

    **1.(b)** Le degré du numérateur dépasse celui du dénominateur : on commence par la division euclidienne, $t^{4} = (t^{2} - 2t - 1)(t^{2} + 2t + 5) + 12t + 5$. Le trinôme $t^{2} + 2t + 5 = (t + 1)^{2} + 4$ n'a pas de racine réelle, et l'on écrit $12t + 5 = 6(2t + 2) - 7$ pour faire apparaître sa dérivée : 
    $$\int_{0}^{1} \frac{t^{4}}{t^{2} + 2t + 5}\,\mathrm{d} t = \int_{0}^{1} (t^{2} - 2t - 1)\,\mathrm{d} t + 6\Big[\ln(t^{2} + 2t + 5)\Big]_{0}^{1} - \frac{7}{2}\Big[\operatorname{Arctan}\frac{t + 1}{2}\Big]_{0}^{1}.$$

    $$\boxed{\int_{0}^{1} \frac{t^{4}}{t^{2} + 2t + 5}\,\mathrm{d} t = -\frac{5}{3} + 6\ln\frac{8}{5} - \frac{7\pi}{8} + \frac{7}{2}\operatorname{Arctan}\frac{1}{2} \approx 0{,}02723}$$
     La valeur est cohérente : la fonction intégrée est comprise entre $0$ et $\frac{t^{4}}{5}$, d'intégrale $\frac{1}{25} = 0{,}04$. Elle résulte pourtant de la compensation de termes de l'ordre de l'unité, ce qui rend le calcul numérique de l'expression exacte délicat.

    **1.(c)** Les pôles sont $-1$ et les racines non réelles de $x^{2} - x + 1$. Un raccourci évite la décomposition : $x^{3} + 1 = (x + 1)(x^{2} - x + 1)$, et en écrivant le numérateur $x^{2} + (x + 1)$, 
    $$\frac{x^{2} + x + 1}{x^{3} + 1} = \frac{x^{2}}{x^{3} + 1} + \frac{1}{x^{2} - x + 1}.$$
     Le premier terme est de la forme $\frac{1}{3}\frac{u'}{u}$ ; le second se traite par la forme canonique $\big(x - \frac{1}{2}\big)^{2} + \frac{3}{4}$ et l'arc tangente, avec $\operatorname{Arctan}\sqrt{3} = \frac{\pi}{3}$ : 
    $$\boxed{\int_{2}^{3} \frac{x^{2} + x + 1}{x^{3} + 1}\,\mathrm{d} x = \frac{1}{3}\ln\frac{28}{9} + \frac{2}{\sqrt{3}}\Big(\operatorname{Arctan}\frac{5}{\sqrt{3}} - \frac{\pi}{3}\Big) \approx 0{,}5979}$$
     La décomposition complète, $\frac{1}{3(x + 1)} + \frac{2(x + 1)}{3(x^{2} - x + 1)}$, conduit au même résultat ✓.

    **1.(d)** Les pôles réels $\pm\sqrt{2}$ sont hors de $[-1\,,1]$. Comme $x^{4} - 4 = (x^{2} - 2)(x^{2} + 2)$ et que la différence des deux facteurs vaut $4$, on a $\frac{1}{x^{4} - 4} = \frac{1}{4}\Big(\frac{1}{x^{2} - 2} - \frac{1}{x^{2} + 2}\Big)$. La fonction est paire (chapitre 6, proposition 6), et sur $[0\,,1]$, 
    $$\int_{0}^{1} \frac{\mathrm{d} x}{x^{2} - 2} = \frac{1}{2\sqrt{2}}\Big[\ln\Big|\frac{x - \sqrt{2}}{x + \sqrt{2}}\Big|\Big]_{0}^{1} = \frac{1}{2\sqrt{2}}\ln\frac{\sqrt{2} - 1}{\sqrt{2} + 1} = -\frac{\ln(1 + \sqrt{2})}{\sqrt{2}}, \qquad \int_{0}^{1} \frac{\mathrm{d} x}{x^{2} + 2} = \frac{1}{\sqrt{2}}\operatorname{Arctan}\frac{1}{\sqrt{2}},$$
     où l'on a utilisé $\frac{\sqrt{2} - 1}{\sqrt{2} + 1} = (\sqrt{2} - 1)^{2}$ et $\frac{1}{\sqrt{2} - 1} = \sqrt{2} + 1$. 
    $$\boxed{\int_{-1}^{1} \frac{\mathrm{d} x}{x^{4} - 4} = -\frac{\sqrt{2}}{4}\Big(\ln(1 + \sqrt{2}) + \operatorname{Arctan}\frac{1}{\sqrt{2}}\Big) \approx -0{,}5292}$$
     Le résultat est négatif, comme la fonction intégrée sur $[-1\,,1]$, où $x^{4} - 4 < 0$ ✓.

    **1.(e)** C'est un élément simple de seconde espèce élevé au carré : comme l'indique le cours, on l'intègre par parties à partir de $J_{1} = \int_{0}^{1} \frac{\mathrm{d} t}{1 + t^{2}} = \frac{\pi}{4}$, en dérivant $\frac{1}{1 + t^{2}}$ et en intégrant $1$. En notant $J_{2}$ l'intégrale cherchée, 
    $$J_{1} = \Big[\frac{t}{1 + t^{2}}\Big]_{0}^{1} + \int_{0}^{1} \frac{2t^{2}}{(1 + t^{2})^{2}}\,\mathrm{d} t = \frac{1}{2} + 2J_{1} - 2J_{2}, \qquad\text{car}\qquad \frac{t^{2}}{(1 + t^{2})^{2}} = \frac{1}{1 + t^{2}} - \frac{1}{(1 + t^{2})^{2}}.$$

    $$\boxed{\int_{0}^{1} \frac{\mathrm{d} t}{(1 + t^{2})^{2}} = \frac{1}{4} + \frac{\pi}{8}}$$
     Le changement de variable $t = \tan u$, suggéré par le facteur $1 + t^{2} = \frac{1}{\cos^{2}u}$, conduit au même résultat ✓ : 
    $$\int_{0}^{1} \frac{\mathrm{d} t}{(1 + t^{2})^{2}} = \int_{0}^{\pi/4} \cos^{2}u\,\mathrm{d} u = \frac{\pi}{8} + \frac{1}{4}.$$
     L'exercice 20 généralisera les deux méthodes.

    **2.** Dans chaque cas, la primitive est valable sur tout intervalle ne contenant aucun pôle, et l'on contrôle le résultat en le dérivant.

    **(a)** Les pôles simples $1$ et $-1$ ont pour coefficients $\frac{1}{2 \times 1} = \frac{1}{2}$ et $\frac{1}{(-2) \times 9} = -\frac{1}{18}$ ; le coefficient de $\frac{1}{(x - 2)^{2}}$ vaut $\frac{1}{2^{2} - 1} = \frac{1}{3}$. Enfin, la limite de $xF(x)$ en $+\infty$ est nulle, ce qui impose que les coefficients des termes en $\frac{1}{x - \lambda}$ aient une somme nulle : celui de $\frac{1}{x - 2}$ vaut $-\frac{1}{2} + \frac{1}{18} = -\frac{4}{9}$. 
    $$\frac{1}{(x^{2} - 1)(x - 2)^{2}} = \frac{1}{2(x - 1)} - \frac{1}{18(x + 1)} - \frac{4}{9(x - 2)} + \frac{1}{3(x - 2)^{2}},$$

    $$\boxed{x \mapsto \frac{1}{2}\ln|x - 1| - \frac{1}{18}\ln|x + 1| - \frac{4}{9}\ln|x - 2| - \frac{1}{3(x - 2)}}$$

    **(b)** Le numérateur $x$ est, au facteur $\frac{1}{2}$ près, la dérivée de $x^{2}$, et le dénominateur ne dépend que de $x^{2}$ : c'est le changement de variable $u = x^{2}$ qui s'impose. Comme $u^{2} - u - 2 = (u - 2)(u + 1)$ et $\frac{1}{(u - 2)(u + 1)} = \frac{1}{3}\Big(\frac{1}{u - 2} - \frac{1}{u + 1}\Big)$, 
    $$\frac{x}{x^{4} - x^{2} - 2} = \frac{1}{3}\Big(\frac{x}{x^{2} - 2} - \frac{x}{x^{2} + 1}\Big), \qquad \boxed{x \mapsto \frac{1}{6}\ln\Big|\frac{x^{2} - 2}{x^{2} + 1}\Big|}$$

    **(c)** On écrit $1 = (x^{3} + 1) - x^{3}$, ce qui fait apparaître une forme $\frac{u'}{u}$ : 
    $$\frac{1}{x(x^{3} + 1)} = \frac{1}{x} - \frac{x^{2}}{x^{3} + 1}, \qquad \boxed{x \mapsto \ln|x| - \frac{1}{3}\ln|x^{3} + 1|}$$

    **(d)** Le facteur $x^{3}$ est, au facteur $\frac{1}{4}$ près, la dérivée de $x^{4}$, et le reste ne dépend que de $x^{4}$ : on pose $u = x^{4}$, ce qui revient à écrire $x^{7} = x^{3}\big((x^{4} + 1) - 1\big)$. 
    $$\frac{x^{7}}{(x^{4} + 1)^{2}} = \frac{x^{3}}{x^{4} + 1} - \frac{x^{3}}{(x^{4} + 1)^{2}}, \qquad \boxed{x \mapsto \frac{1}{4}\ln(x^{4} + 1) + \frac{1}{4(x^{4} + 1)}}$$
     Cette primitive est définie sur $\mathbb{R}$ tout entier, puisque $x^{4} + 1$ ne s'annule pas.

    **(e)** On factorise $x^{3} - 1 = (x - 1)(x^{2} + x + 1)$ ; le coefficient du pôle $1$ vaut $\frac{1}{3}$, et la limite de $xF(x)$ en $+\infty$ et l'évaluation en $0$ donnent le reste : 
    $$\frac{1}{x^{3} - 1} = \frac{1}{3(x - 1)} - \frac{x + 2}{3(x^{2} + x + 1)}, \qquad x + 2 = \frac{1}{2}(2x + 1) + \frac{3}{2}.$$
     Avec la forme canonique $x^{2} + x + 1 = \big(x + \frac{1}{2}\big)^{2} + \frac{3}{4}$, 
    $$\boxed{x \mapsto \frac{1}{3}\ln|x - 1| - \frac{1}{6}\ln(x^{2} + x + 1) - \frac{1}{\sqrt{3}}\operatorname{Arctan}\frac{2x + 1}{\sqrt{3}}}$$
     *À retenir.* Avant de décomposer, on cherche une forme $\frac{u'}{u}$ ou $\frac{u'}{u^{k}}$, ou un changement de variable $u = x^{k}$ lorsque le numérateur est, à une constante près, la dérivée de $x^{k}$ et que le reste ne dépend que de $x^{k}$ : en (b), (c) et (d), cela évite de décomposer des fractions de degré $4$, $4$ et $8$. Les logarithmes portent des valeurs absolues, sauf quand leur argument est positif sur $\mathbb{R}$.
- id: "ma-18-17"
  feuille: "f-ma-18"
  numero: 17
  partie: "Intégrale et primitives"
  etoiles: 1
  types: [Calcul]
  mots_cles: [intégrale et primitives, fonctions continues par morceaux, intégrales, fonctions définies par une intégrale, "suites d'intégrales"]
  noeuds: [ar-tfa, ri-continues, ri-proprietes, su-convergence]
  notions: [continue-par-morceaux]
  page_enonce: 5
  page_corrige: 15
  enonce: |
    **1.** Soit $f : [-1\,,1] \to \mathbb{R}$ continue. Déterminer les limites, quand $x$ tend vers $0$, de 
    $$\frac{1}{x}\int_{0}^{x} f(t)\,\mathrm{d} t \qquad\text{et}\qquad \frac{1}{x^{2}}\int_{0}^{x} t\,f(t)\,\mathrm{d} t.$$

    **2.** Que deviennent ces résultats si l'on suppose seulement $f$ continue par morceaux sur $[-1\,,1]$ ?
  corrige: |
    **1.** La fonction $F : x \mapsto \int_{0}^{x} f$ est dérivable de dérivée $f$ (théorème 6), et $F(0) = 0$ : la quantité $\frac{1}{x}\int_{0}^{x} f = \frac{F(x) - F(0)}{x}$ est un taux d'accroissement, qui tend vers $F'(0) = f(0)$. Pour la seconde limite, on utilise $\int_{0}^{x} t\,\mathrm{d} t = \frac{x^{2}}{2}$ pour écrire 
    $$\frac{1}{x^{2}}\int_{0}^{x} t f(t)\,\mathrm{d} t - \frac{f(0)}{2} = \frac{1}{x^{2}}\int_{0}^{x} t\big(f(t) - f(0)\big)\,\mathrm{d} t.$$
     Soit $\varepsilon > 0$, et $\delta > 0$ tel que $|f(t) - f(0)| \leqslant \varepsilon$ pour $|t| \leqslant \delta$. Pour $0 < |x| \leqslant \delta$, l'inégalité triangulaire, écrite avec la valeur absolue extérieure puisque $x$ peut être négatif, donne 
    $$\Big|\frac{1}{x^{2}}\int_{0}^{x} t\big(f(t) - f(0)\big)\,\mathrm{d} t\Big| \leqslant \frac{1}{x^{2}}\Big|\int_{0}^{x} |t|\,\varepsilon\,\mathrm{d} t\Big| = \frac{\varepsilon}{2}.$$

    $$\boxed{\frac{1}{x}\int_{0}^{x} f(t)\,\mathrm{d} t \xrightarrow[x \to 0]{} f(0), \qquad \frac{1}{x^{2}}\int_{0}^{x} t\,f(t)\,\mathrm{d} t \xrightarrow[x \to 0]{} \frac{f(0)}{2}}$$
     La même méthode redonne la première limite, en écrivant $\frac{1}{x}\int_{0}^{x} f - f(0) = \frac{1}{x}\int_{0}^{x} \big(f(t) - f(0)\big)\,\mathrm{d} t$.

    **2.** Si $f$ est seulement continue par morceaux, $0$ est soit un point intérieur d'un intervalle ouvert de la subdivision, où $f$ est continue, soit un point de la subdivision. Dans les deux cas, $f$ admet en $0$ une limite à droite $f(0^{+})$ et une limite à gauche $f(0^{-})$, finies, et la valeur $f(0)$ ne joue aucun rôle dans les intégrales (proposition 6). Pour $x > 0$, la méthode de la question 1 s'applique en remplaçant $f(0)$ par $f(0^{+})$ : si $|f(t) - f(0^{+})| \leqslant \varepsilon$ pour $0 < t \leqslant \delta$, alors $\big|\frac{1}{x}\int_{0}^{x} f - f(0^{+})\big| \leqslant \varepsilon$ pour $0 < x \leqslant \delta$, et de même pour la seconde quantité ; à gauche, on remplace $f(0)$ par $f(0^{-})$. 
    $$\boxed{\text{limites à droite } f(0^{+}) \text{ et } \frac{f(0^{+})}{2}, \qquad \text{limites à gauche } f(0^{-}) \text{ et } \frac{f(0^{-})}{2}}$$
     Ces quantités ont donc une limite en $0$ si et seulement si $f(0^{+}) = f(0^{-})$, c'est-à-dire si $f$ se prolonge par continuité en $0$ ; la limite est alors la valeur commune, et non nécessairement $f(0)$. Par exemple, pour $f$ égale à $0$ sur $[-1\,,0[$ et à $1$ sur $[0\,,1]$, on a $\frac{1}{x}\int_{0}^{x} f = 1$ pour $x > 0$ et $0$ pour $x < 0$.

    *À retenir.* La première limite redit le théorème 6 : la moyenne de $f$ sur $[0\,,x]$ tend vers la valeur en $0$. Pour une fonction continue par morceaux, elle tend vers la limite latérale, ce qui explique la remarque du cours après le théorème 6 : en un point de discontinuité, $x \mapsto \int_{0}^{x} f$ a des dérivées à gauche et à droite différentes.
- id: "ma-18-18"
  feuille: "f-ma-18"
  numero: 18
  partie: "Intégrale et primitives"
  etoiles: 2
  types: [Calcul]
  mots_cles: [intégrale et primitives, intégrales, fonctions définies par une intégrale, logarithme et exponentielle]
  noeuds: [ar-tfa, ri-proprietes]
  notions: []
  page_enonce: 5
  page_corrige: 16
  enonce: |
    Calculer les intégrales suivantes.

    **(a)** $\displaystyle\int_{0}^{\pi/4} \ln(1 + \tan x)\,\mathrm{d} x$.

    **(b)** $\displaystyle\int_{1/x}^{x} \frac{\ln t}{1 + t^{2}}\,\mathrm{d} t$ pour tout réel $x > 0$.

    **(c)** $\displaystyle\int_{-2}^{2} \sin t\;\mathrm{e}^{-t^{4}}\,\mathrm{d} t$, sans aucun calcul de primitive.

    **(d)** $\displaystyle\int_{0}^{\pi/2} \frac{\sin^{3} x}{\sqrt{2 + \cos x}}\,\mathrm{d} x$.

    **(e)** $\displaystyle\int_{0}^{1/2} \sqrt{\frac{\operatorname{Arcsin} x}{1 - x^{2}}}\,\mathrm{d} x$.
  corrige: |
    **(a)** La fonction $x \mapsto \ln(1 + \tan x)$ est continue sur $\big[0\,,\frac{\pi}{4}\big]$, où $\tan x \geqslant 0$, mais on ne lui connaît pas de primitive simple. On effectue le changement de variable $x = \frac{\pi}{4} - u$ (chapitre 6, proposition 5), qui échange les bornes $0$ et $\frac{\pi}{4}$. Il est suggéré par la formule d'addition (chapitre 4) 
    $$\tan\Big(\frac{\pi}{4} - u\Big) = \frac{1 - \tan u}{1 + \tan u}, \qquad\text{d'où}\qquad 1 + \tan\Big(\frac{\pi}{4} - u\Big) = \frac{2}{1 + \tan u},$$
     qui transforme $\ln(1 + \tan x)$ en $\ln 2 - \ln(1 + \tan u)$. En notant $I$ l'intégrale, et avec $\mathrm{d} x = -\mathrm{d} u$, 
    $$I = \int_{\pi/4}^{0} \ln\Big(1 + \tan\Big(\frac{\pi}{4} - u\Big)\Big)(-\mathrm{d} u) = \int_{0}^{\pi/4} \big(\ln 2 - \ln(1 + \tan u)\big)\,\mathrm{d} u = \frac{\pi}{4}\ln 2 - I.$$

    $$\boxed{\int_{0}^{\pi/4} \ln(1 + \tan x)\,\mathrm{d} x = \frac{\pi\ln 2}{8} \approx 0{,}2722}$$

    **(b)** Les bornes $\frac{1}{x}$ et $x$ sont échangées par $t \mapsto \frac{1}{t}$, qui change $\ln t$ en son opposé : on effectue le changement de variable $t = \frac{1}{u}$, de classe $\mathcal{C}^{1}$ sur $]0\,,+\infty[$. Avec $\mathrm{d} t = -\frac{\mathrm{d} u}{u^{2}}$ et $1 + \frac{1}{u^{2}} = \frac{u^{2} + 1}{u^{2}}$, l'élément $\frac{\mathrm{d} t}{1 + t^{2}}$ devient $-\frac{\mathrm{d} u}{1 + u^{2}}$. En notant $J$ l'intégrale, 
    $$J = \int_{x}^{1/x} \frac{-\ln u}{1 + u^{2}}\,(-1)\,\mathrm{d} u = \int_{x}^{1/x} \frac{\ln u}{1 + u^{2}}\,\mathrm{d} u = -J.$$

    $$\boxed{\int_{1/x}^{x} \frac{\ln t}{1 + t^{2}}\,\mathrm{d} t = 0 \quad \text{pour tout } x > 0}$$
     Par la relation de Chasles, cela revient à dire que $\int_{1/x}^{1} \frac{\ln t}{1 + t^{2}}\,\mathrm{d} t = -\int_{1}^{x} \frac{\ln t}{1 + t^{2}}\,\mathrm{d} t$ : la partie négative, sur $\big[\frac{1}{x}\,,1\big]$, compense exactement la partie positive.

    **(c)** La fonction $t \mapsto \sin t\;\mathrm{e}^{-t^{4}}$ est continue et impaire, produit d'une fonction impaire et d'une fonction paire, et l'intervalle $[-2\,,2]$ est symétrique : par la proposition 6 du chapitre 6, qui repose sur le changement de variable $t = -u$, 
    $$\boxed{\int_{-2}^{2} \sin t\;\mathrm{e}^{-t^{4}}\,\mathrm{d} t = 0}$$
     On ne connaît d'ailleurs aucune primitive simple de cette fonction : la symétrie est ici le seul moyen de calcul.

    **(d)** La puissance impaire de $\sin x$ suggère le changement de variable $u = \cos x$ : on met de côté un facteur $\sin x$, qui fournit $-\mathrm{d} u$, et l'on exprime le reste en fonction de $\cos x$, puisque $\sin^{2}x = 1 - \cos^{2}x$. Quand $x$ va de $0$ à $\frac{\pi}{2}$, $u$ va de $1$ à $0$ : 
    $$\int_{0}^{\pi/2} \frac{\sin^{3}x}{\sqrt{2 + \cos x}}\,\mathrm{d} x = \int_{0}^{\pi/2} \frac{(1 - \cos^{2}x)\sin x}{\sqrt{2 + \cos x}}\,\mathrm{d} x = \int_{0}^{1} \frac{1 - u^{2}}{\sqrt{2 + u}}\,\mathrm{d} u.$$
     Le changement de variable affine $w = 2 + u$ simplifie la racine : $1 - u^{2} = 1 - (w - 2)^{2} = -w^{2} + 4w - 3$, et 
    $$\int_{2}^{3} \big(-w^{3/2} + 4w^{1/2} - 3w^{-1/2}\big)\,\mathrm{d} w = \Big[-\frac{2}{5}w^{5/2} + \frac{8}{3}w^{3/2} - 6w^{1/2}\Big]_{2}^{3} = -\frac{8\sqrt{3}}{5} + \frac{34\sqrt{2}}{15}.$$

    $$\boxed{\int_{0}^{\pi/2} \frac{\sin^{3}x}{\sqrt{2 + \cos x}}\,\mathrm{d} x = \frac{34\sqrt{2}}{15} - \frac{8\sqrt{3}}{5} \approx 0{,}4343}$$

    **(e)** Sur $\big[0\,,\frac{1}{2}\big]$, $\operatorname{Arcsin} x \geqslant 0$ et $1 - x^{2} > 0$, donc la fonction intégrée s'écrit $\sqrt{\operatorname{Arcsin} x} \times \frac{1}{\sqrt{1 - x^{2}}}$. Le second facteur est la dérivée de $\operatorname{Arcsin}$ : c'est le changement de variable $u = \operatorname{Arcsin} x$, ou, ce qui revient au même, la reconnaissance d'une dérivée composée $u'\sqrt{u}$ (chapitre 6, proposition 3). Une primitive est $x \mapsto \frac{2}{3}(\operatorname{Arcsin} x)^{3/2}$, et $\operatorname{Arcsin}\frac{1}{2} = \frac{\pi}{6}$. 
    $$\boxed{\int_{0}^{1/2} \sqrt{\frac{\operatorname{Arcsin} x}{1 - x^{2}}}\,\mathrm{d} x = \frac{2}{3}\Big(\frac{\pi}{6}\Big)^{3/2} \approx 0{,}2526}$$
     *À retenir.* En (a), (b) et (c), on calcule une intégrale sans en connaître de primitive : un changement de variable qui conserve l'intervalle d'intégration transforme l'intégrale en une expression où elle réapparaît, et l'on résout une équation. On reconnaît ce cas à une symétrie de l'intervalle, $x \mapsto \frac{\pi}{4} - x$, $t \mapsto \frac{1}{t}$ ou $t \mapsto -t$, qui transforme simplement la fonction intégrée. L'erreur la plus répandue est d'oublier le signe de $\mathrm{d} x = -\mathrm{d} u$ en même temps que l'échange des bornes : les deux se compensent.
- id: "ma-18-19"
  feuille: "f-ma-18"
  numero: 19
  partie: "Intégrale et primitives"
  etoiles: 2
  types: [Calcul]
  mots_cles: [intégrale et primitives, intégrales, "suites d'intégrales", logarithme et exponentielle]
  noeuds: [ar-tfa, ri-proprietes, su-convergence]
  notions: []
  page_enonce: 5
  page_corrige: 17
  enonce: |
    **1.** Montrer que la fonction $x \mapsto \dfrac{x\ln x}{(x^{2} + 1)^{2}}$, définie sur $]0\,,1]$, se prolonge en une fonction continue sur $[0\,,1]$, puis calculer son intégrale sur $[0\,,1]$.

    **2.** Pour $A > 0$, calculer les intégrales suivantes, puis déterminer leur limite quand $A$ tend vers $+\infty$. 
    $$\int_{0}^{A} \frac{t\,\mathrm{d} t}{(t + 1)^{2}(2t + 1)}, \qquad \int_{0}^{A} \frac{\mathrm{d} t}{(t^{2} + 4)(t + 2)^{2}}, \qquad \int_{0}^{A} \frac{t\,\mathrm{d} t}{t^{3} + 1}.$$
  corrige: |
    **1.** Par croissances comparées (chapitre 10, proposition 2), $x\ln x$ tend vers $0$ en $0$, et $(x^{2} + 1)^{2}$ vers $1$ : la fonction se prolonge par continuité en $0$ par la valeur $0$. Notons $g$ ce prolongement, continu sur $[0\,,1]$, et $I = \int_{0}^{1} g$.

    Le produit d'un logarithme, dont la dérivée est simple, et de $\frac{x}{(x^{2} + 1)^{2}}$, dont on connaît une primitive, suggère une intégration par parties. On ne peut pas l'écrire directement sur $[0\,,1]$, puisque $\ln$ n'est pas défini en $0$ : on l'écrit sur $[\varepsilon\,,1]$, avec $\varepsilon \in \,]0\,,1[$, et l'on choisit la primitive de $x \mapsto \frac{x}{(x^{2} + 1)^{2}}$ qui s'annule en $0$, 
    $$V(x) = \frac{1}{2} - \frac{1}{2(x^{2} + 1)} = \frac{x^{2}}{2(x^{2} + 1)},$$
     d'où 
    $$\int_{\varepsilon}^{1} g = \Big[V(x)\ln x\Big]_{\varepsilon}^{1} - \int_{\varepsilon}^{1} \frac{V(x)}{x}\,\mathrm{d} x = -V(\varepsilon)\ln\varepsilon - \int_{\varepsilon}^{1} \frac{x}{2(x^{2} + 1)}\,\mathrm{d} x.$$
     Quand $\varepsilon$ tend vers $0$, le membre de gauche tend vers $I$, puisque $\varepsilon \mapsto \int_{\varepsilon}^{1} g$ est continue sur $[0\,,1]$ (théorème 6) ; le terme $V(\varepsilon)\ln\varepsilon$, équivalent à $\frac{\varepsilon^{2}\ln\varepsilon}{2}$, tend vers $0$, et la dernière intégrale tend vers 
    $$\int_{0}^{1} \frac{x}{2(x^{2} + 1)}\,\mathrm{d} x = \Big[\frac{\ln(x^{2} + 1)}{4}\Big]_{0}^{1} = \frac{\ln 2}{4}.$$

    $$\boxed{\int_{0}^{1} \frac{x\ln x}{(x^{2} + 1)^{2}}\,\mathrm{d} x = -\frac{\ln 2}{4} \approx -0{,}1733}$$
     Le résultat est négatif, comme la fonction intégrée sur $]0\,,1[$ ✓.

    *Piège.* Avec la primitive $-\frac{1}{2(x^{2} + 1)}$, le terme de bord $\frac{\ln\varepsilon}{2(\varepsilon^{2} + 1)}$ tend vers $-\infty$, et il faudrait le compenser par une intégrale elle aussi divergente. Le choix de la constante d'intégration, ici celle qui annule $V$ en $0$, est ce qui rend le calcul propre.

    **2.** Les trois fonctions sont des fractions rationnelles sans pôle sur $[0\,,+\infty[$ : on les décompose en éléments simples, comme à l'exercice 16, puis l'on regroupe les logarithmes en un seul avant de faire tendre $A$ vers $+\infty$.

    *Première intégrale.* En multipliant par $2t + 1$ et en évaluant en $-\frac{1}{2}$, le coefficient de $\frac{1}{2t + 1}$ vaut $\frac{-1/2}{(1/2)^{2}} = -2$ ; de même, celui de $\frac{1}{(t + 1)^{2}}$ vaut $\frac{-1}{-1} = 1$. Enfin, la limite nulle de $tF(t)$ en $+\infty$ donne le coefficient $1$ de $\frac{1}{t + 1}$, puisque $\frac{-2}{2t + 1} = \frac{-1}{t + 1/2}$. Ainsi 
    $$\frac{t}{(t + 1)^{2}(2t + 1)} = \frac{1}{t + 1} + \frac{1}{(t + 1)^{2}} - \frac{2}{2t + 1}, \qquad \int_{0}^{A} \frac{t\,\mathrm{d} t}{(t + 1)^{2}(2t + 1)} = \ln\frac{A + 1}{2A + 1} + 1 - \frac{1}{A + 1}.$$

    $$\boxed{\int_{0}^{A} \frac{t\,\mathrm{d} t}{(t + 1)^{2}(2t + 1)} \xrightarrow[A \to +\infty]{} 1 - \ln 2}$$

    *Deuxième intégrale.* La décomposition est 
    $$\frac{1}{(t^{2} + 4)(t + 2)^{2}} = \frac{1}{16(t + 2)} + \frac{1}{8(t + 2)^{2}} - \frac{t}{16(t^{2} + 4)},$$
     d'où une primitive $\frac{1}{32}\ln\frac{(t + 2)^{2}}{t^{2} + 4} - \frac{1}{8(t + 2)}$, qui vaut $-\frac{1}{16}$ en $0$ : 
    $$\int_{0}^{A} \frac{\mathrm{d} t}{(t^{2} + 4)(t + 2)^{2}} = \frac{1}{32}\ln\frac{(A + 2)^{2}}{A^{2} + 4} - \frac{1}{8(A + 2)} + \frac{1}{16}, \qquad \boxed{\text{limite } \frac{1}{16}}$$

    *Troisième intégrale.* Avec $t^{3} + 1 = (t + 1)(t^{2} - t + 1)$, le coefficient du pôle $-1$ vaut $\frac{-1}{3}$, et 
    $$\frac{t}{t^{3} + 1} = -\frac{1}{3(t + 1)} + \frac{t + 1}{3(t^{2} - t + 1)}, \qquad t + 1 = \frac{1}{2}(2t - 1) + \frac{3}{2}.$$
     Avec la forme canonique $t^{2} - t + 1 = \big(t - \frac{1}{2}\big)^{2} + \frac{3}{4}$, on obtient 
    $$\int_{0}^{A} \frac{t\,\mathrm{d} t}{t^{3} + 1} = \frac{1}{6}\ln\frac{A^{2} - A + 1}{(A + 1)^{2}} + \frac{1}{\sqrt{3}}\Big(\operatorname{Arctan}\frac{2A - 1}{\sqrt{3}} + \frac{\pi}{6}\Big),$$
     et, quand $A$ tend vers $+\infty$, le logarithme tend vers $\ln 1 = 0$ et l'arc tangente vers $\frac{\pi}{2}$ : 
    $$\boxed{\int_{0}^{A} \frac{t\,\mathrm{d} t}{t^{3} + 1} \xrightarrow[A \to +\infty]{} \frac{1}{\sqrt{3}}\Big(\frac{\pi}{2} + \frac{\pi}{6}\Big) = \frac{2\pi}{3\sqrt{3}} \approx 1{,}2092}$$
     *Piège.* Chaque logarithme, pris séparément, tend vers $+\infty$ ou $-\infty$ : l'erreur la plus répandue est d'écrire une forme indéterminée $\infty - \infty$, ou de conclure à la divergence. La limite existe parce que la fonction intégrée est en $O\big(\frac{1}{t^{2}}\big)$ en $+\infty$, ce qui force les coefficients des termes $\frac{1}{t - \lambda}$ à se compenser : les logarithmes se regroupent en le logarithme d'un quotient qui tend vers une constante.
- id: "ma-18-20"
  feuille: "f-ma-18"
  numero: 20
  partie: "Intégrale et primitives"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [intégrale et primitives, intégrales, fonctions définies par une intégrale, intégrales de Wallis, "suites d'intégrales"]
  noeuds: [ar-tfa, ri-proprietes, su-convergence]
  notions: []
  page_enonce: 6
  page_corrige: 19
  enonce: |
    Pour tout $n \in \mathbb{N}$ et tout réel $x$, on pose $\displaystyle I_{n}(x) = \int_{0}^{x} \frac{\mathrm{d} t}{(t^{2} + 1)^{n + 1}}$.

    **1.** Exprimer $I_{n + 1}(x)$ en fonction de $I_{n}(x)$.

    **2.** Montrer que, pour tout $n \in \mathbb{N}$, $I_{n}(x)$ admet une limite finie $L_{n}$ quand $x$ tend vers $+\infty$, et calculer $L_{n}$.

    **3.** Comparer $L_{n}$ et l'intégrale de Wallis $W_{2n}$ du cours. Retrouver ce résultat par un calcul direct de $L_{n}$.
  corrige: |
    **1.** On intègre $I_{n}(x)$ par parties (chapitre 6, proposition 4), en dérivant $t \mapsto (t^{2} + 1)^{-(n + 1)}$ et en primitivant $1$ en $t$. C'est le choix naturel : dériver la puissance $-(n + 1)$ fait apparaître la puissance $-(n + 2)$, c'est-à-dire l'intégrande de $I_{n + 1}$. Les deux fonctions sont de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$, et 
    $$I_{n}(x) = \Big[\frac{t}{(t^{2} + 1)^{n + 1}}\Big]_{0}^{x} + 2(n + 1)\int_{0}^{x} \frac{t^{2}}{(t^{2} + 1)^{n + 2}}\,\mathrm{d} t.$$
     On écrit $t^{2} = (t^{2} + 1) - 1$ dans la dernière intégrale, qui vaut donc $I_{n}(x) - I_{n + 1}(x)$. Ainsi 
    $$I_{n}(x) = \frac{x}{(x^{2} + 1)^{n + 1}} + 2(n + 1)\big(I_{n}(x) - I_{n + 1}(x)\big),$$
     et l'on regroupe les termes en $I_{n + 1}(x)$. 
    $$\boxed{2(n + 1)\,I_{n + 1}(x) = \frac{x}{(x^{2} + 1)^{n + 1}} + (2n + 1)\,I_{n}(x)}$$
     *Piège.* L'erreur la plus répandue est d'intégrer par parties $I_{n + 1}$ lui-même : on obtient alors une intégrale de puissance $-(n + 3)$, et l'on s'éloigne du but. Pour faire monter l'exposant, on intègre par parties l'intégrale d'exposant le plus bas.

    **2.** On raisonne par récurrence sur $n$. Pour $n = 0$, $I_{0}(x) = \operatorname{Arctan} x$ tend vers $\frac{\pi}{2}$ quand $x$ tend vers $+\infty$. Si $I_{n}(x)$ tend vers $L_{n}$, la relation de la question 1 montre que $I_{n + 1}(x)$ admet une limite finie, puisque 
    $$0 \leqslant \frac{x}{(x^{2} + 1)^{n + 1}} \leqslant \frac{x}{x^{2} + 1} \xrightarrow[x \to +\infty]{} 0 \qquad (x \geqslant 0),$$
     et cette limite vérifie $2(n + 1)L_{n + 1} = (2n + 1)L_{n}$. On en déduit, par produit télescopique, 
    $$L_{n} = \frac{\pi}{2}\prod_{k = 0}^{n - 1}\frac{2k + 1}{2k + 2} = \frac{\pi}{2} \times \frac{1 \times 3 \times \cdots \times (2n - 1)}{2 \times 4 \times \cdots \times (2n)},$$
     et l'on complète le numérateur en multipliant haut et bas par $2 \times 4 \times \cdots \times (2n) = 2^{n}n!$. 
    $$\boxed{L_{n} = \frac{(2n)!}{4^{n}(n!)^{2}}\,\frac{\pi}{2}}$$
     On trouve $L_{1} = \frac{\pi}{4}$, $L_{2} = \frac{3\pi}{16}$ et $L_{3} = \frac{5\pi}{32}$, valeurs confirmées par un calcul symbolique. ✓

    **3.** La proposition 15 (iii) du cours donne $W_{2n} = \frac{(2n)!}{4^{n}(n!)^{2}}\,\frac{\pi}{2}$ : c'est exactement $L_{n}$. 
    $$\boxed{L_{n} = W_{2n}}$$
     Pour le retrouver directement, on effectue le changement de variable $t = \tan\theta$ (chapitre 6, proposition 5), avec $\theta \in [0\,,\operatorname{Arctan} x]$ : le facteur $1 + t^{2}$ appelle la tangente, puisque $1 + \tan^{2}\theta = \frac{1}{\cos^{2}\theta}$ et que $\mathrm{d} t = (1 + \tan^{2}\theta)\,\mathrm{d}\theta$. La fonction $\tan$ est de classe $\mathcal{C}^{1}$ sur $\big[0\,,\frac{\pi}{2}\big[$, et 
    $$I_{n}(x) = \int_{0}^{\operatorname{Arctan} x} \frac{1 + \tan^{2}\theta}{(1 + \tan^{2}\theta)^{n + 1}}\,\mathrm{d}\theta = \int_{0}^{\operatorname{Arctan} x} \cos^{2n}\theta\,\mathrm{d}\theta.$$
     La fonction $u \mapsto \int_{0}^{u} \cos^{2n}$ est continue sur $\mathbb{R}$ (théorème 6), et $\operatorname{Arctan} x$ tend vers $\frac{\pi}{2}$ : par composition des limites, 
    $$\boxed{L_{n} = \int_{0}^{\pi/2} \cos^{2n}\theta\,\mathrm{d}\theta = W_{2n}}$$
     la dernière égalité étant la proposition 15 (i).

    *À retenir.* La relation de récurrence de la question 1, à la limite, est celle des intégrales de Wallis, $(2n + 2)W_{2n + 2} = (2n + 1)W_{2n}$ : le changement de variable $t = \tan\theta$ explique cette coïncidence. C'est aussi la récurrence annoncée par la méthode du cours pour intégrer les éléments simples $\frac{1}{(1 + u^{2})^{k}}$. L'exercice 46 reviendra sur les intégrales de Wallis.
- id: "ma-18-21"
  feuille: "f-ma-18"
  numero: 21
  partie: "Intégrale et primitives"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [intégrale et primitives, intégrales, fonctions définies par une intégrale]
  noeuds: [ar-tfa, ri-proprietes]
  notions: []
  page_enonce: 6
  page_corrige: 20
  enonce: |
    **1.** Soit $f$ et $g$ deux fonctions continues sur $[a\,,b]$. Montrer qu'il existe $\theta \in [a\,,b]$ tel que 
    $$f(\theta)\int_{\theta}^{b} g = g(\theta)\int_{a}^{\theta} f.$$
     On pourra étudier la fonction $x \mapsto \int_{a}^{x} f \times \int_{x}^{b} g$.

    **2.** Soit $f : [0\,,1] \to \mathbb{R}$ de classe $\mathcal{C}^{1}$ telle que $f(1) = \displaystyle\int_{0}^{1} f$. Montrer qu'il existe $c \in [0\,,1]$ tel que $f'(c) = 0$.
  corrige: |
    **1.** Il n'y a ici aucune intégrale à calculer : on suit l'indication, et l'on applique le théorème de Rolle (chapitre 9, théorème 4) à la fonction 
    $$\varphi(x) = \int_{a}^{x} f \times \int_{x}^{b} g, \qquad x \in [a\,,b].$$
     Par le théorème 6, les fonctions $x \mapsto \int_{a}^{x} f$ et $x \mapsto \int_{x}^{b} g = -\int_{b}^{x} g$ sont de classe $\mathcal{C}^{1}$ sur $[a\,,b]$, de dérivées $f$ et $-g$. Leur produit $\varphi$ est donc dérivable, et 
    $$\varphi'(x) = f(x)\int_{x}^{b} g - g(x)\int_{a}^{x} f.$$
     De plus, $\varphi(a) = 0$, puisque le premier facteur est nul, et $\varphi(b) = 0$, puisque le second l'est. Le théorème de Rolle fournit $\theta \in \,]a\,,b[$ tel que $\varphi'(\theta) = 0$. 
    $$\boxed{\exists\,\theta \in \,]a\,,b[, \quad f(\theta)\int_{\theta}^{b} g = g(\theta)\int_{a}^{\theta} f}$$

    **2.** L'idée est de trouver un point $d \in [0\,,1[$ tel que $f(d) = f(1)$, puis d'appliquer le théorème de Rolle sur $[d\,,1]$. Supposons par l'absurde que $f(x) \neq f(1)$ pour tout $x \in [0\,,1[$. La fonction $h = f - f(1)$ est continue et ne s'annule pas sur l'intervalle $[0\,,1[$ : elle y garde un signe constant strict (chapitre 8, proposition 15), et l'on peut supposer $h > 0$ sur $[0\,,1[$, quitte à changer $f$ en $-f$. Alors $h$ est continue, positive sur $[0\,,1]$ (avec $h(1) = 0$), et non identiquement nulle ; mais, par hypothèse, 
    $$\int_{0}^{1} h = \int_{0}^{1} f - f(1) = 0,$$
     ce que le théorème 4 interdit. Il existe donc $d \in [0\,,1[$ tel que $f(d) = f(1)$. La fonction $f$ est continue sur $[d\,,1]$, dérivable sur $]d\,,1[$, et prend la même valeur aux deux bornes : le théorème de Rolle conclut. 
    $$\boxed{\exists\,c \in \,]d\,,1[\, \subset [0\,,1], \quad f'(c) = 0}$$
     *Piège.* L'égalité de la moyenne (proposition 7) fournit bien $d \in [0\,,1]$ tel que $f(d) = \int_{0}^{1} f = f(1)$, mais rien n'empêche alors d'avoir $d = 1$, et le théorème de Rolle sur le segment $[1\,,1]$ ne dit rien. L'erreur la plus répandue est de ne pas voir ce cas : c'est le théorème 4, et non la seule proposition 7, qui permet de l'écarter.
- id: "ma-18-22"
  feuille: "f-ma-18"
  numero: 22
  partie: "Intégrale et primitives"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [intégrale et primitives, intégrales]
  noeuds: [ar-tfa, ri-proprietes]
  notions: []
  page_enonce: 6
  page_corrige: 21
  enonce: |
    Soit $f : [a\,,b] \to \mathbb{R}$ continue. Pour tout réel $x$, on pose $\displaystyle F(x) = \int_{a}^{b} |t - x|\,f(t)\,\mathrm{d} t$. Montrer que $F$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$, en calculant $F'$, puis déterminer à quelle condition sur $f$ la fonction $F$ est de classe $\mathcal{C}^{2}$ sur $\mathbb{R}$.
  corrige: |
    La valeur absolue $|t - x|$ change d'expression en $t = x$ : on découpe donc l'intégrale par la relation de Chasles en ce point, lorsqu'il est dans $[a\,,b]$, puis on dérive les intégrales dont la borne dépend de $x$ par le théorème 6. On note $A = \int_{a}^{b} f$ et $B = \int_{a}^{b} tf(t)\,\mathrm{d} t$.

    *Cas $x \leqslant a$ et $x \geqslant b$.* Pour $x \leqslant a$, on a $|t - x| = t - x$ pour tout $t \in [a\,,b]$, donc $F(x) = B - xA$ ; pour $x \geqslant b$, de même, $F(x) = xA - B$. Sur ces deux intervalles, $F$ est affine, de dérivée $-A$ puis $A$.

    *Cas $a \leqslant x \leqslant b$.* La relation de Chasles donne 
    $$F(x) = \int_{a}^{x} (x - t)f(t)\,\mathrm{d} t + \int_{x}^{b} (t - x)f(t)\,\mathrm{d} t = x\int_{a}^{x} f - \int_{a}^{x} tf(t)\,\mathrm{d} t + \int_{x}^{b} tf(t)\,\mathrm{d} t - x\int_{x}^{b} f.$$
     Les fonctions $f$ et $t \mapsto tf(t)$ sont continues : par le théorème 6, chaque intégrale est une fonction de classe $\mathcal{C}^{1}$ de $x$ sur $[a\,,b]$. En dérivant, les termes $xf(x)$ se compensent deux à deux : 
    $$F'(x) = \int_{a}^{x} f + xf(x) - xf(x) - xf(x) - \int_{x}^{b} f + xf(x) = \int_{a}^{x} f - \int_{x}^{b} f.$$

    *Raccords.* Les expressions coïncident en $a$ et en $b$, et la dérivée à droite en $a$, égale à $-\int_{a}^{b} f = -A$, est la dérivée à gauche ; de même en $b$, les deux dérivées valent $A$. Donc $F$ est dérivable sur $\mathbb{R}$, et $F'$, continue sur chacun des trois intervalles fermés avec des valeurs qui se raccordent, est continue sur $\mathbb{R}$. 
    $$\boxed{F \in \mathcal{C}^{1}(\mathbb{R}), \qquad F'(x) = \begin{cases} -\int_{a}^{b} f & \text{si } x \leqslant a \\[1mm] \int_{a}^{x} f - \int_{x}^{b} f & \text{si } a \leqslant x \leqslant b \\[1mm] \int_{a}^{b} f & \text{si } x \geqslant b \end{cases}}$$

    *Classe $\mathcal{C}^{2}$.* Sur $]-\infty\,,a[$ et sur $]b\,,+\infty[$, $F'$ est constante, de dérivée nulle. Sur $[a\,,b]$, le théorème 6 donne $F''(x) = f(x) + f(x) = 2f(x)$. En $a$, la dérivée à gauche de $F'$ vaut $0$ et sa dérivée à droite vaut $2f(a)$ : $F'$ est dérivable en $a$ si et seulement si $f(a) = 0$, et de même en $b$. Réciproquement, si $f(a) = f(b) = 0$, la fonction $F''$, nulle hors de $[a\,,b]$ et égale à $2f$ sur $[a\,,b]$, est continue sur $\mathbb{R}$. 
    $$\boxed{F \in \mathcal{C}^{2}(\mathbb{R}) \iff f(a) = f(b) = 0, \qquad\text{et alors } F'' = 2f \text{ sur } [a\,,b], \ F'' = 0 \text{ ailleurs}}$$
     Avec $f(t) = t^{2}$ sur $[0\,,1]$, on vérifie par un calcul symbolique que $F''$ vaut $0$ à droite de $0$ mais $2$ à gauche de $1$ : $F$ n'est pas de classe $\mathcal{C}^{2}$, alors que $f(t) = t(1 - t)$ donne une fonction de classe $\mathcal{C}^{2}$. ✓

    *À retenir.* La relation $F'' = 2f$ sur $]a\,,b[$ dit que $\frac{1}{2}F$ est une primitive seconde de $f$. Si $f \geqslant 0$, la fonction $F$ est convexe (chapitre 9, théorème 11) : c'est une moyenne pondérée des fonctions convexes $x \mapsto |t - x|$.
