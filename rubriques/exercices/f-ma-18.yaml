  page_enonce: 9
  page_corrige: 33
  enonce: |
    Soit $f : \mathbb{R} \to \mathbb{R}$ de classe $\mathcal{C}^{\infty}$, et $P \in \mathbb{R}[X]$ un polynôme de degré impair tel que 
    $$\big|f^{(n)}(x)\big| \leqslant |P(x)| \qquad\text{pour tout } n \in \mathbb{N} \text{ et tout réel } x.$$

    **1.** Montrer que $f$ est la fonction nulle.

    **2.** Le résultat subsiste-t-il si le degré de $P$ est pair ?
  corrige: |
    **1.** Le polynôme réel $P$ est de degré impair : il admet une racine réelle $x_{0}$ (chapitre 8, proposition 13). L'hypothèse, en $x = x_{0}$, donne $f^{(n)}(x_{0}) = 0$ pour tout $n \in \mathbb{N}$ : tous les polynômes de Taylor de $f$ en $x_{0}$ sont nuls.

    Soit $A > 0$, et $M_{A}$ le maximum de $|P|$ sur le segment $[x_{0} - A\,,x_{0} + A]$ (chapitre 8, théorème 10). Pour $x$ dans ce segment et tout $n \in \mathbb{N}$, on a $|f^{(n + 1)}| \leqslant |P| \leqslant M_{A}$ entre $x_{0}$ et $x$, et l'inégalité de Taylor-Lagrange (théorème 8) en $x_{0}$, à l'ordre $n$, donne 
    $$|f(x)| = \Big|f(x) - \sum_{k = 0}^{n} \frac{f^{(k)}(x_{0})}{k!}(x - x_{0})^{k}\Big| \leqslant M_{A}\,\frac{A^{n + 1}}{(n + 1)!} \xrightarrow[n \to +\infty]{} 0,$$
     par les croissances comparées (chapitre 7, théorème 7). Donc $f(x) = 0$ pour $|x - x_{0}| \leqslant A$, et ce pour tout $A > 0$. 
    $$\boxed{f = 0}$$

    **2.** Non. La fonction $f = \sin$ vérifie $|f^{(n)}(x)| \leqslant 1$ pour tout $n$ et tout $x$, puisque ses dérivées sont $\pm\sin$ et $\pm\cos$ : le polynôme constant $P = 1$, de degré $0$, pair, convient, ou encore $P = X^{2} + 1$. 
    $$\boxed{\text{non : } f = \sin \text{ et } P = 1 \text{ sont un contre-exemple}}$$
     *À retenir.* La démonstration n'utilise le degré impair que pour obtenir une racine réelle de $P$. Le résultat reste donc vrai pour tout polynôme $P$ qui a une racine réelle, par exemple $P = X^{2}$, et c'est l'absence de racine réelle, et non la parité du degré, qui fait tomber le résultat. L'argument est celui de la proposition 11 du cours, qui montre la convergence des polynômes de Taylor de l'exponentielle : ici, la limite est la fonction nulle.
- id: "ma-18-37"
  feuille: "f-ma-18"
