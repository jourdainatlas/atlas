  enonce: |
    Soit $f : [0\,,1] \to \mathbb{R}$ continue. Montrer que 
    $$\int_{-1/2}^{3/2} f(3x^{2} - 2x^{3})\,\mathrm{d} x = 2\int_{0}^{1} f(3x^{2} - 2x^{3})\,\mathrm{d} x.$$
  corrige: |
    *Idée.* Le polynôme $P = 3X^{2} - 2X^{3}$ réalise trois bijections de $\big[-\frac{1}{2}\,,0\big]$, $[0\,,1]$ et $\big[1\,,\frac{3}{2}\big]$ sur $[0\,,1]$. Tout $y \in [0\,,1]$ a donc trois antécédents $r \leqslant x \leqslant q$, et, par les relations entre coefficients et racines, $r + x + q = \frac{3}{2}$. On effectue dans les deux intégrales extérieures les changements de variable $X = r(x)$ et $X = q(x)$, qui les ramènent à $[0\,,1]$ ; la relation $r' + q' = -1$ fait le reste.

    *Étude de $P$.* On a $P'(X) = 6X(1 - X)$, et les factorisations 
    $$P = X^{2}(3 - 2X), \qquad 1 - P = (X - 1)^{2}(2X + 1)$$
     montrent que $0 \leqslant P(X) \leqslant 1$ si et seulement si $X \in \big[-\frac{1}{2}\,,\frac{3}{2}\big]$. En particulier, $f \circ P$ est définie et continue sur ce segment, et les deux membres de l'égalité ont un sens.

    *Les deux autres antécédents.* Pour $x \in [0\,,1]$, on factorise $P(X) - P(x)$ par $X - x$ : 
    $$P(X) - P(x) = -(X - x)\big(2X^{2} + (2x - 3)X + 2x^{2} - 3x\big).$$
     Le discriminant du second facteur vaut $(2x - 3)^{2} - 8(2x^{2} - 3x) = 9 + 12x(1 - x) \geqslant 9 > 0$. Ses racines sont 
    $$r(x) = \frac{3 - 2x - \sqrt{9 + 12x - 12x^{2}}}{4}, \qquad q(x) = \frac{3 - 2x + \sqrt{9 + 12x - 12x^{2}}}{4}.$$
     La quantité sous la racine reste supérieure à $9$, donc $r$ et $q$ sont de classe $\mathcal{C}^{1}$ sur $[0\,,1]$. Par construction, $P\big(r(x)\big) = P\big(q(x)\big) = P(x)$ ; la somme des racines donne $r(x) + q(x) = \frac{3 - 2x}{2}$, d'où 
    $$r'(x) + q'(x) = -1, \qquad r(0) = 0, \quad r(1) = -\frac{1}{2}, \quad q(0) = \frac{3}{2}, \quad q(1) = 1.$$
     Enfin, comme $P(r(x)) = P(x) \in [0\,,1]$, l'étude de $P$ montre que $r(x)$ et $q(x)$ appartiennent à $\big[-\frac{1}{2}\,,\frac{3}{2}\big]$, où $f \circ P$ est continue.

    ![Figure](documents/figures/3656f92ef6cff149.svg)

    La courbe de $P$ sur $\big[-\frac{1}{2}\,,\frac{3}{2}\big]$ se compose de trois arcs monotones, chacun réalisant une bijection sur $[0\,,1]$. Pour $x = \frac{1}{2}$, le niveau $y = P(x) = \frac{1}{2}$ est atteint aussi en $r(x) = \frac{1 - \sqrt{3}}{2} \approx -0{,}37$ et en $q(x) = \frac{1 + \sqrt{3}}{2} \approx 1{,}37$, et l'on vérifie $r(x) + x + q(x) = \frac{3}{2}$.

    *Les changements de variable.* Dans $\int_{-1/2}^{0} f\big(P(X)\big)\,\mathrm{d} X$, on pose $X = r(x)$, avec $x$ allant de $1$ à $0$ (chapitre 6, proposition 5) : 
    $$\int_{-1/2}^{0} f\big(P(X)\big)\,\mathrm{d} X = \int_{1}^{0} f\Big(P\big(r(x)\big)\Big)\,r'(x)\,\mathrm{d} x = -\int_{0}^{1} f\big(P(x)\big)\,r'(x)\,\mathrm{d} x.$$
     De même, avec $X = q(x)$, $x$ allant de $1$ à $0$ : 
    $$\int_{1}^{3/2} f\big(P(X)\big)\,\mathrm{d} X = \int_{1}^{0} f\Big(P\big(q(x)\big)\Big)\,q'(x)\,\mathrm{d} x = -\int_{0}^{1} f\big(P(x)\big)\,q'(x)\,\mathrm{d} x.$$
     En ajoutant, avec $r' + q' = -1$ : 
    $$\int_{-1/2}^{0} f(P) + \int_{1}^{3/2} f(P) = -\int_{0}^{1} f\big(P(x)\big)\big(r'(x) + q'(x)\big)\,\mathrm{d} x = \int_{0}^{1} f(P).$$
     Par la relation de Chasles, en ajoutant l'intégrale sur $[0\,,1]$, 
    $$\boxed{\int_{-1/2}^{3/2} f(3x^{2} - 2x^{3})\,\mathrm{d} x = 2\int_{0}^{1} f(3x^{2} - 2x^{3})\,\mathrm{d} x}$$
     L'égalité a été contrôlée numériquement pour $f = \exp$, $f = \sqrt{\cdot}$ et $f(y) = \cos 5y$ ✓.

    *Piège.* Le changement de variable « naturel » $y = P(X)$ sur chacun des trois intervalles fait apparaître la réciproque de $P$, dont la dérivée est infinie aux points où $P'$ s'annule : la proposition 5 du chapitre 6 ne s'applique pas directement. On contourne la difficulté en paramétrant les deux arcs extérieurs par l'arc central, avec les fonctions $r$ et $q$, qui sont de classe $\mathcal{C}^{1}$ jusqu'au bord.

    *À retenir.* Tout repose sur la relation $r + x + q = \frac{3}{2}$, somme des racines du polynôme $2X^{3} - 3X^{2} + y$ (chapitre 13, théorème 4). La même méthode montre que, pour un polynôme de degré $3$ qui réalise ainsi trois bijections sur le même intervalle, l'intégrale de $f \circ P$ sur les deux arcs extérieurs est égale à celle sur l'arc central : c'est la dérivée de la somme des racines, constante, qui l'impose.

