- id: "ma-18-01"
  feuille: "f-ma-18"
  numero: 1
  partie: "Fonctions en escalier et fonctions continues par morceaux"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fonctions continues par morceaux, fonctions en escalier, intégrales, fonctions définies par une intégrale, "suites d'intégrales"]
  noeuds: [ri-escalier, ri-continues, ri-proprietes, ar-tfa, su-convergence]
  notions: [fonction-escalier, continue-par-morceaux]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Soit $m < n$ deux entiers relatifs. Justifier que la restriction de la partie entière à $[m\,,n]$ est une fonction en escalier, en donnant une subdivision adaptée, puis calculer $\displaystyle\int_{m}^{n} \lfloor x \rfloor\,\mathrm{d} x$.

    **2.** Justifier que $x \mapsto x|x|$ est continue par morceaux sur $[-1\,,2]$, et calculer $\displaystyle\int_{-1}^{2} x|x|\,\mathrm{d} x$.

    **3.** Pour tout réel $a$, calculer $\displaystyle I(a) = \int_{0}^{1} \min(x, a)\,\mathrm{d} x$, en distinguant selon la position de $a$ par rapport à $0$ et à $1$.

    **4.** Calculer $\displaystyle\int_{0}^{2} \min\big(x^{2} + 1,\ x^{2} + 3x - 2\big)\,\mathrm{d} x$.

    **5.** Pour $x \geqslant 0$, on pose $\displaystyle F(x) = \int_{0}^{x} \lfloor t \rfloor\,\mathrm{d} t$. Calculer $F(x)$ lorsque $x \in [N\,,N + 1[$, avec $N \in \mathbb{N}$, puis donner un équivalent simple de $F(x)$ quand $x$ tend vers $+\infty$.
  corrige: |
    **1.** Pour $k \in [\![m\,;n - 1]\!]$, la partie entière vaut $k$ sur $[k\,,k + 1[$, donc sur l'intervalle ouvert $]k\,,k + 1[$ : la subdivision $(m, m + 1, \dots, n)$ est adaptée, et la restriction de $\lfloor \cdot \rfloor$ à $[m\,,n]$ est en escalier. La proposition 3 donne alors son intégrale comme une somme d'aires de rectangles de largeur $1$, que l'on calcule comme une somme de termes d'une suite arithmétique (chapitre 3) : 
    $$\boxed{\int_{m}^{n} \lfloor x \rfloor\,\mathrm{d} x = \sum_{k = m}^{n - 1} k = \frac{(n - m)(n + m - 1)}{2}}$$
     Pour $m = 2$ et $n = 5$, on trouve $2 + 3 + 4 = 9 = \frac{3 \times 6}{2}$ ✓. Pour $m = -n$, l'intégrale vaut $-n$ : les rectangles situés sous l'axe, de hauteurs $-n$, …, $-1$, ne sont pas compensés par ceux de hauteurs $1$, …, $n - 1$, puisque la partie entière n'est pas impaire.

    **2.** La fonction $x \mapsto x|x|$ vaut $-x^{2}$ sur $[-1\,,0]$ et $x^{2}$ sur $[0\,,2]$ ; elle est continue sur $[-1\,,2]$, donc continue par morceaux, avec la subdivision $(-1, 2)$. Pour l'intégrer, on la coupe en $0$ par la relation de Chasles (théorème 3) : 
    $$\boxed{\int_{-1}^{2} x|x|\,\mathrm{d} x = \int_{-1}^{0} (-x^{2})\,\mathrm{d} x + \int_{0}^{2} x^{2}\,\mathrm{d} x = -\frac{1}{3} + \frac{8}{3} = \frac{7}{3}}$$
     La fonction étant impaire, la partie située sur $[-1\,,0]$ compense exactement celle sur $[0\,,1]$, et le résultat est l'intégrale de $x^{2}$ sur $[1\,,2]$, qui vaut bien $\frac{7}{3}$ ✓.

    **3.** On distingue trois cas, selon que le point de rencontre $x = a$ des deux fonctions $x \mapsto x$ et $x \mapsto a$ est à gauche de $[0\,,1]$, dedans ou à droite. Si $a \leqslant 0$, on a $\min(x, a) = a$ pour tout $x \in [0\,,1]$. Si $a \geqslant 1$, on a $\min(x, a) = x$. Si $0 \leqslant a \leqslant 1$, on coupe en $a$ par la relation de Chasles : 
    $$\int_{0}^{1} \min(x, a)\,\mathrm{d} x = \int_{0}^{a} x\,\mathrm{d} x + \int_{a}^{1} a\,\mathrm{d} x = \frac{a^{2}}{2} + a(1 - a).$$

    $$\boxed{I(a) = a \ \text{ si } a \leqslant 0, \qquad I(a) = a - \frac{a^{2}}{2} \ \text{ si } 0 \leqslant a \leqslant 1, \qquad I(a) = \frac{1}{2} \ \text{ si } a \geqslant 1}$$
     Les expressions se raccordent en $a = 0$ et en $a = 1$, où elles valent $0$ et $\frac{1}{2}$ ✓ : la fonction $I$ est continue, ce que l'on pouvait prévoir, puisque $|\min(x, a) - \min(x, a')| \leqslant |a - a'|$.

    **4.** La différence $(x^{2} + 3x - 2) - (x^{2} + 1) = 3(x - 1)$ est négative sur $[0\,,1]$ et positive sur $[1\,,2]$. Le minimum vaut donc $x^{2} + 3x - 2$ sur $[0\,,1]$ et $x^{2} + 1$ sur $[1\,,2]$ ; c'est une fonction continue, et l'on coupe en $1$ : 
    $$\boxed{\int_{0}^{2} \min\big(x^{2} + 1,\ x^{2} + 3x - 2\big)\,\mathrm{d} x = \Big(\frac{1}{3} + \frac{3}{2} - 2\Big) + \Big(\frac{7}{3} + 1\Big) = -\frac{1}{6} + \frac{10}{3} = \frac{19}{6}}$$

    **5.** Soit $x \in [N\,,N + 1[$. Sur chaque $[k\,,k + 1]$, avec $k \leqslant N - 1$, l'intégrale de la partie entière vaut $k$, et sur $[N\,,x]$ la partie entière est constante égale à $N$. La relation de Chasles donne 
    $$\boxed{F(x) = \sum_{k = 0}^{N - 1} k + N(x - N) = \frac{N(N - 1)}{2} + N(x - N) \qquad (N \leqslant x < N + 1)}$$
     Pour l'équivalent, plutôt que de manipuler $N = \lfloor x \rfloor$, on encadre la fonction intégrée : $t - 1 < \lfloor t \rfloor \leqslant t$ pour tout réel $t$ (chapitre 7, proposition 4), et la croissance de l'intégrale donne, pour $x \geqslant 0$, 
    $$\frac{x^{2}}{2} - x \leqslant F(x) \leqslant \frac{x^{2}}{2}, \qquad\text{donc}\qquad 1 - \frac{2}{x} \leqslant \frac{F(x)}{x^{2}/2} \leqslant 1 \quad (x > 0).$$

    $$\boxed{F(x) \underset{x \to +\infty}{\sim} \frac{x^{2}}{2}}$$
     *À retenir.* La fonction $F$ est continue et affine par morceaux, de pente $N$ sur $[N\,,N + 1]$, mais elle n'est pas dérivable aux entiers : c'est la figure du cours qui suit le théorème 6. Encadrer la fonction intégrée est souvent plus rapide que calculer l'intégrale exactement, dès qu'on ne demande qu'un ordre de grandeur.
- id: "ma-18-02"
  feuille: "f-ma-18"
  numero: 2
  partie: "Fonctions en escalier et fonctions continues par morceaux"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [fonctions continues par morceaux, intégrales, sommes de Riemann, "suites d'intégrales", logarithme et exponentielle, fonctions à valeurs complexes]
  noeuds: [ri-escalier, ri-continues, ri-proprietes, ri-sommes, su-convergence, ar-tfa]
  notions: [fonction-escalier, continue-par-morceaux, somme-riemann]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    *Lemme de Riemann-Lebesgue.* Pour $f \in \mathcal{C}_{m}([a\,,b], \mathbb{K})$ et $n \in \mathbb{N}$, on pose 
    $$u_{n}(f) = \int_{a}^{b} f(t)\,\mathrm{e}^{\mathrm{i} nt}\,\mathrm{d} t.$$
     On veut montrer que la suite $\big(u_{n}(f)\big)$ tend vers $0$ pour toute fonction $f$ continue par morceaux.

    **1.** On suppose dans cette question que $f$ est de classe $\mathcal{C}^{1}$ sur $[a\,,b]$. Montrer qu'il existe une constante $C$ telle que $|u_{n}(f)| \leqslant \frac{C}{n}$ pour tout $n \geqslant 1$, et conclure.

    **2.** Soit $[\alpha\,,\beta]$ un segment contenu dans $[a\,,b]$, et $f$ la fonction égale à $1$ sur $[\alpha\,,\beta]$ et à $0$ ailleurs. Calculer $u_{n}(f)$ pour $n \geqslant 1$, et montrer que $u_{n}(f)$ tend vers $0$. En déduire que $u_{n}(\varphi)$ tend vers $0$ pour toute fonction $\varphi \in \mathcal{E}([a\,,b], \mathbb{K})$.

    **3.** Soit $f \in \mathcal{C}_{m}([a\,,b], \mathbb{R})$ et $\varepsilon > 0$. À l'aide du théorème d'approximation du cours, montrer qu'il existe $\varphi \in \mathcal{E}([a\,,b], \mathbb{R})$ telle que $|u_{n}(f) - u_{n}(\varphi)| \leqslant \varepsilon$ pour tout $n$, et conclure. Étendre le résultat aux fonctions à valeurs complexes.

    **4.** En déduire que, pour toute fonction $f \in \mathcal{C}_{m}([a\,,b], \mathbb{R})$, 
    $$\int_{a}^{b} f(t)\cos(nt)\,\mathrm{d} t \xrightarrow[n \to +\infty]{} 0 \qquad\text{et}\qquad \int_{a}^{b} f(t)\sin(nt)\,\mathrm{d} t \xrightarrow[n \to +\infty]{} 0.$$
     Pourquoi la première question ne suffisait-elle pas ?
  corrige: |
    **1.** On intègre par parties (chapitre 6, proposition 4), en dérivant $f$ et en intégrant $t \mapsto \mathrm{e}^{\mathrm{i} nt}$. C'est le choix naturel : la primitive $\frac{\mathrm{e}^{\mathrm{i} nt}}{\mathrm{i} n}$ fait apparaître le facteur $\frac{1}{n}$ cherché, et l'hypothèse $f$ de classe $\mathcal{C}^{1}$ est exactement ce qu'il faut pour dériver $f$. Pour $n \geqslant 1$, 
    $$u_{n}(f) = \Big[f(t)\frac{\mathrm{e}^{\mathrm{i} nt}}{\mathrm{i} n}\Big]_{a}^{b} - \frac{1}{\mathrm{i} n}\int_{a}^{b} f'(t)\,\mathrm{e}^{\mathrm{i} nt}\,\mathrm{d} t.$$
     Comme $|\mathrm{e}^{\mathrm{i} nt}| = 1$, l'inégalité triangulaire complexe (théorème 5) donne 
    $$\boxed{|u_{n}(f)| \leqslant \frac{C}{n}, \qquad C = |f(a)| + |f(b)| + \int_{a}^{b} |f'(t)|\,\mathrm{d} t}$$
     et $u_{n}(f)$ tend vers $0$ par encadrement.

    **2.** La fonction $t \mapsto f(t)\,\mathrm{e}^{\mathrm{i} nt}$ est nulle sur $[a\,,\alpha[$ et sur $]\beta\,,b]$, et égale à $\mathrm{e}^{\mathrm{i} nt}$ sur $[\alpha\,,\beta]$. Par la relation de Chasles et la proposition 6, appliquée aux parties réelle et imaginaire sur $[a\,,\alpha]$ et sur $[\beta\,,b]$, et puisque $t \mapsto \frac{\mathrm{e}^{\mathrm{i} nt}}{\mathrm{i} n}$ est une primitive de $t \mapsto \mathrm{e}^{\mathrm{i} nt}$ (théorème 6), 
    $$\boxed{u_{n}(f) = \int_{\alpha}^{\beta} \mathrm{e}^{\mathrm{i} nt}\,\mathrm{d} t = \frac{\mathrm{e}^{\mathrm{i} n\beta} - \mathrm{e}^{\mathrm{i} n\alpha}}{\mathrm{i} n}, \qquad |u_{n}(f)| \leqslant \frac{2}{n} \xrightarrow[n \to +\infty]{} 0}$$
     Soit maintenant $\varphi \in \mathcal{E}([a\,,b], \mathbb{K})$, $(x_{0}, \dots, x_{p})$ une subdivision adaptée et $c_{i}$ la valeur de $\varphi$ sur $]x_{i - 1}\,,x_{i}[$. La fonction $\varphi$ ne diffère de $\sum_{i = 1}^{p} c_{i}\mathbf{1}_{[x_{i - 1}, x_{i}]}$ qu'aux points $x_{k}$, où $\mathbf{1}_{J}$ désigne la fonction égale à $1$ sur $J$ et à $0$ ailleurs. La proposition 6, appliquée aux parties réelle et imaginaire, et la linéarité de l'intégrale (proposition 8) donnent 
    $$u_{n}(\varphi) = \sum_{i = 1}^{p} c_{i}\,u_{n}\big(\mathbf{1}_{[x_{i - 1}, x_{i}]}\big), \qquad\text{d'où}\qquad \boxed{|u_{n}(\varphi)| \leqslant \frac{2}{n}\sum_{i = 1}^{p} |c_{i}| \xrightarrow[n \to +\infty]{} 0}$$

    **3.** Le théorème 1, appliqué avec $\frac{\varepsilon}{b - a}$, fournit $\varphi$, $\psi \in \mathcal{E}([a\,,b], \mathbb{R})$ telles que $\varphi \leqslant f \leqslant \psi$ et $\psi - \varphi \leqslant \frac{\varepsilon}{b - a}$. Par linéarité et par le théorème 5, pour tout $n$, 
    $$|u_{n}(f) - u_{n}(\varphi)| = \Big|\int_{a}^{b} \big(f(t) - \varphi(t)\big)\mathrm{e}^{\mathrm{i} nt}\,\mathrm{d} t\Big| \leqslant \int_{a}^{b} (f - \varphi) \leqslant \int_{a}^{b} (\psi - \varphi) \leqslant \varepsilon.$$
     Par la question 2, il existe $n_{0}$ tel que $|u_{n}(\varphi)| \leqslant \varepsilon$ pour $n \geqslant n_{0}$ ; alors $|u_{n}(f)| \leqslant 2\varepsilon$ pour $n \geqslant n_{0}$. Ceci valant pour tout $\varepsilon > 0$, $u_{n}(f)$ tend vers $0$. Si $f$ est à valeurs complexes, $\operatorname{Re} f$ et $\operatorname{Im} f$ sont continues par morceaux et réelles, et $u_{n}(f) = u_{n}(\operatorname{Re} f) + \mathrm{i}\,u_{n}(\operatorname{Im} f)$ par linéarité. 
    $$\boxed{u_{n}(f) \xrightarrow[n \to +\infty]{} 0 \quad \text{pour toute } f \in \mathcal{C}_{m}([a\,,b], \mathbb{K})}$$

    **4.** Pour $f$ réelle, la proposition 8 donne 
    $$\operatorname{Re} u_{n}(f) = \int_{a}^{b} f(t)\cos(nt)\,\mathrm{d} t \qquad\text{et}\qquad \operatorname{Im} u_{n}(f) = \int_{a}^{b} f(t)\sin(nt)\,\mathrm{d} t,$$
     et ces deux nombres sont majorés en valeur absolue par $|u_{n}(f)|$. 
    $$\boxed{\int_{a}^{b} f(t)\cos(nt)\,\mathrm{d} t \xrightarrow[n \to +\infty]{} 0 \qquad\text{et}\qquad \int_{a}^{b} f(t)\sin(nt)\,\mathrm{d} t \xrightarrow[n \to +\infty]{} 0}$$
     La première question ne suffisait pas, parce qu'une fonction continue par morceaux n'est en général pas de classe $\mathcal{C}^{1}$ : la fonction $\mathbf{1}_{[\alpha, \beta]}$ de la question 2 n'est même pas continue, et une fonction continue comme $t \mapsto |t - c|$ n'est pas dérivable en $c$.

    *À retenir.* C'est le schéma type d'un argument de densité : on démontre le résultat pour une classe simple de fonctions (les indicatrices de segments, puis les fonctions en escalier), et l'on passe aux fonctions continues par morceaux grâce au théorème 1 et à une majoration uniforme en $n$. Le prix à payer est la perte de la vitesse : on sait que $u_{n}(f)$ tend vers $0$, mais plus à quelle vitesse. L'exercice 31 étudiera le signe de ces intégrales pour une fonction convexe.
- id: "ma-18-03"
  feuille: "f-ma-18"
  numero: 3
  partie: "Intégrale d'une fonction continue par morceaux"
  etoiles: 1
  types: [Démonstration]
  mots_cles: ["propriétés de l'intégrale", inégalités intégrales, intégrales]
  noeuds: [ri-proprietes, ri-moyenne]
  notions: []
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $a < b < c$ trois réels et $f : [a\,,c] \to \mathbb{R}$ une fonction continue. Montrer que 
    $$\frac{1}{c - a}\int_{a}^{c} f \leqslant \max\Big(\frac{1}{b - a}\int_{a}^{b} f,\ \frac{1}{c - b}\int_{b}^{c} f\Big),$$
     et interpréter ce résultat en termes de valeurs moyennes.
  corrige: |
    Notons $\mu_{1} = \frac{1}{b - a}\int_{a}^{b} f$ et $\mu_{2} = \frac{1}{c - b}\int_{b}^{c} f$ les valeurs moyennes de $f$ sur $[a\,,b]$ et sur $[b\,,c]$. Par la relation de Chasles, 
    $$\frac{1}{c - a}\int_{a}^{c} f = \frac{(b - a)\mu_{1} + (c - b)\mu_{2}}{c - a} = \lambda\mu_{1} + (1 - \lambda)\mu_{2}, \qquad \lambda = \frac{b - a}{c - a} \in \,]0\,,1[.$$
     Comme $\lambda\mu_{1} + (1 - \lambda)\mu_{2} \leqslant \lambda\max(\mu_{1}, \mu_{2}) + (1 - \lambda)\max(\mu_{1}, \mu_{2})$, on obtient l'inégalité demandée. 
    $$\boxed{\frac{1}{c - a}\int_{a}^{c} f = \frac{b - a}{c - a}\,\mu_{1} + \frac{c - b}{c - a}\,\mu_{2} \leqslant \max(\mu_{1}, \mu_{2})}$$
     La valeur moyenne sur $[a\,,c]$ est le barycentre des valeurs moyennes sur $[a\,,b]$ et sur $[b\,,c]$, affectées des longueurs de ces intervalles : elle est comprise entre les deux, et plus proche de celle du plus long intervalle. C'est l'analogue de la moyenne d'une classe formée de deux groupes, qui est la moyenne des deux moyennes pondérées par les effectifs.

    *Piège.* La continuité de $f$ ne sert pas : l'égalité n'utilise que la relation de Chasles, valable pour toute fonction continue par morceaux. L'erreur la plus répandue est d'écrire que la moyenne sur $[a\,,c]$ est $\frac{\mu_{1} + \mu_{2}}{2}$, ce qui n'est vrai que si $b$ est le milieu de $[a\,,c]$.
- id: "ma-18-04"
  feuille: "f-ma-18"
  numero: 4
  partie: "Intégrale d'une fonction continue par morceaux"
  etoiles: 1
  types: [Démonstration]
  mots_cles: ["propriétés de l'intégrale", intégrales, fonctions définies par une intégrale, "suites d'intégrales", logarithme et exponentielle]
  noeuds: [ri-proprietes, ar-tfa, su-convergence]
  notions: []
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **1.** Sans chercher de primitive, montrer que 
    $$\frac{\ln 2}{\sqrt{3}} \leqslant \int_{\pi/6}^{\pi/3} \frac{\tan x}{x}\,\mathrm{d} x \leqslant \sqrt{3}\,\ln 2.$$

    **2.** Pour $n \geqslant 1$, on pose $\displaystyle I_{n} = \int_{0}^{1} \frac{t^{n}\sin(nt)}{1 + t^{3}}\,\mathrm{d} t$. Montrer que $|I_{n}| \leqslant \dfrac{1}{n + 1}$, et en déduire la limite de la suite $(I_{n})$.
  corrige: |
    **1.** On ne cherche pas de primitive de $x \mapsto \frac{\tan x}{x}$ : on encadre le facteur $\tan x$, qui varie peu, et l'on garde le facteur $\frac{1}{x}$, dont on connaît une primitive. La tangente est croissante sur $\big[\frac{\pi}{6}\,,\frac{\pi}{3}\big]$, de $\frac{1}{\sqrt{3}}$ à $\sqrt{3}$, et $\frac{1}{x} > 0$, donc 
    $$\frac{1}{\sqrt{3}}\cdot\frac{1}{x} \leqslant \frac{\tan x}{x} \leqslant \sqrt{3}\cdot\frac{1}{x} \qquad \Big(\frac{\pi}{6} \leqslant x \leqslant \frac{\pi}{3}\Big).$$
     La croissance de l'intégrale (théorème 3), avec $\int_{\pi/6}^{\pi/3} \frac{\mathrm{d} x}{x} = \ln\frac{\pi/3}{\pi/6} = \ln 2$, donne l'encadrement. 
    $$\boxed{\frac{\ln 2}{\sqrt{3}} \leqslant \int_{\pi/6}^{\pi/3} \frac{\tan x}{x}\,\mathrm{d} x \leqslant \sqrt{3}\,\ln 2}$$
     Numériquement, l'intégrale vaut environ $0{,}6842$, entre $0{,}4002$ et $1{,}2006$ ✓. L'encadrement est grossier, d'un facteur $3$, parce que $\tan x$ triple sur l'intervalle ; on l'affinerait en coupant l'intervalle en plusieurs morceaux, ce qui est l'idée des sommes de Riemann de la section 18.6.

    **2.** Pour $t \in [0\,,1]$, on a $|\sin(nt)| \leqslant 1$ et $1 + t^{3} \geqslant 1$, donc $\Big|\frac{t^{n}\sin(nt)}{1 + t^{3}}\Big| \leqslant t^{n}$. L'inégalité triangulaire et la croissance de l'intégrale donnent 
    $$\boxed{|I_{n}| \leqslant \int_{0}^{1} t^{n}\,\mathrm{d} t = \frac{1}{n + 1}, \qquad I_{n} \xrightarrow[n \to +\infty]{} 0}$$
     *Piège.* Le facteur $\sin(nt)$ n'est pour rien dans la convergence : c'est $t^{n}$, petit sauf près de $1$, qui écrase l'intégrale. L'erreur la plus répandue est d'écrire $|I_{n}| \leqslant \int_{0}^{1} \frac{\mathrm{d} t}{1 + t^{3}}$, majoration exacte mais inutile, puisqu'elle ne dépend pas de $n$.
- id: "ma-18-05"
  feuille: "f-ma-18"
  numero: 5
  partie: "Intégrale d'une fonction continue par morceaux"
  etoiles: 1
  types: [Démonstration]
  mots_cles: ["propriétés de l'intégrale", intégrales]
  noeuds: [ri-proprietes]
  notions: []
  page_enonce: 2
  page_corrige: 5
  enonce: |
    **1.** Montrer que $|\sin u - \sin v| \leqslant |u - v|$ pour tous réels $u$ et $v$.

    **2.** Soit $f : [a\,,b] \to \mathbb{R}$ continue. Pour tout réel $x$, on pose $\displaystyle F(x) = \int_{a}^{b} f(t)\sin(xt)\,\mathrm{d} t$. Montrer que $F$ est lipschitzienne sur $\mathbb{R}$, et donner une constante de Lipschitz.
  corrige: |
    **1.** La fonction sinus est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$, et $|\sin'| = |\cos| \leqslant 1$. La proposition 10 donne : 
    $$\boxed{|\sin u - \sin v| \leqslant |u - v| \quad \text{pour tous réels } u, v}$$

    **2.** Pour tout réel $x$, la fonction $t \mapsto f(t)\sin(xt)$ est continue sur $[a\,,b]$, donc $F(x)$ est bien défini. Pour $x$, $y$ réels, la linéarité, l'inégalité triangulaire et la question 1, appliquée à $u = xt$ et $v = yt$, donnent 
    $$|F(x) - F(y)| = \Big|\int_{a}^{b} f(t)\big(\sin(xt) - \sin(yt)\big)\,\mathrm{d} t\Big| \leqslant \int_{a}^{b} |f(t)|\,|t|\,|x - y|\,\mathrm{d} t.$$

    $$\boxed{|F(x) - F(y)| \leqslant K|x - y|, \qquad K = \int_{a}^{b} |t\,f(t)|\,\mathrm{d} t}$$
     La constante $K$ ne dépend ni de $x$ ni de $y$ : $F$ est $K$-lipschitzienne sur $\mathbb{R}$. Pour $f = 1$ sur $[0\,,1]$, on trouve $F(x) = \frac{1 - \cos x}{x}$ pour $x \neq 0$, $F(0) = 0$ et $K = \frac{1}{2}$ ; comme $\frac{F(x) - F(0)}{x} = \frac{1 - \cos x}{x^{2}}$ tend vers $\frac{1}{2}$ en $0$ (chapitre 10), aucune constante plus petite ne convient dans ce cas.

    *À retenir.* La majoration se fait sous le signe intégrale, point par point en $t$, avant d'intégrer : c'est la croissance de l'intégrale qui transporte une inégalité entre fonctions en une inégalité entre intégrales.
- id: "ma-18-06"
  feuille: "f-ma-18"
  numero: 6
  partie: "Intégrale d'une fonction continue par morceaux"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: ["propriétés de l'intégrale", intégrales, "suites d'intégrales"]
  noeuds: [ri-proprietes, su-convergence]
  notions: []
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Pour tout entier $n \geqslant 1$, on définit $f_{n} : [0\,,1] \to \mathbb{R}$ par $f_{n}(x) = 2n(1 - nx)$ si $0 \leqslant x < \frac{1}{n}$, et $f_{n}(x) = 0$ sinon.

    ![Figure](documents/figures/867a2fd2dfbf14ac.svg)

    La figure représente $f_{1}$, $f_{2}$ et $f_{4}$ : les triangles s'affinent et s'élèvent en gardant la même aire.

    **1.** Montrer que $f_{n}$ est continue sur $[0\,,1]$, et calculer $\displaystyle\int_{0}^{1} f_{n}(x)\,\mathrm{d} x$.

    **2.** Montrer que, pour tout $x \in \,]0\,,1]$, la suite $\big(f_{n}(x)\big)$ est nulle à partir d'un certain rang. Que vaut $f_{n}(0)$ ?

    **3.** Soit $g$ une fonction définie sur $[0\,,1]$, nulle sur $]0\,,1]$. Comparer $\displaystyle\lim_{n \to +\infty} \int_{0}^{1} f_{n}$ et $\displaystyle\int_{0}^{1} g$. Quelle prudence ce résultat impose-t-il ?
  corrige: |
    **1.** Sur $[0\,,\frac{1}{n}[$, la fonction $f_{n}$ est affine, donc continue, et sa limite à gauche en $\frac{1}{n}$ vaut $2n(1 - 1) = 0$ ; sur $[\frac{1}{n}\,,1]$, elle est nulle. Les deux expressions se raccordent en $\frac{1}{n}$, où $f_{n}$ vaut $0$, et $f_{n}$ est continue sur $[0\,,1]$. Son intégrale est l'aire d'un triangle de base $\frac{1}{n}$ et de hauteur $2n$ ; par le calcul, 
    $$\boxed{\int_{0}^{1} f_{n} = \int_{0}^{1/n} 2n(1 - nx)\,\mathrm{d} x + \int_{1/n}^{1} 0\,\mathrm{d} x = 2n\Big[x - \frac{nx^{2}}{2}\Big]_{0}^{1/n} = 2n \times \frac{1}{2n} = 1}$$

    **2.** Soit $x \in \,]0\,,1]$. Pour $n > \frac{1}{x}$, on a $\frac{1}{n} < x$, donc $f_{n}(x) = 0$ : la suite $\big(f_{n}(x)\big)$ est nulle à partir du rang $\lfloor \frac{1}{x} \rfloor + 1$. En revanche, 
    $$\boxed{f_{n}(x) = 0 \text{ pour } n > \frac{1}{x}, \qquad f_{n}(0) = 2n \xrightarrow[n \to +\infty]{} +\infty}$$

    **3.** La fonction $g$ ne diffère de la fonction nulle qu'au point $0$ : elle est en escalier, et son intégrale est nulle par la proposition 6. Ainsi 
    $$\boxed{\lim_{n \to +\infty} \int_{0}^{1} f_{n} = 1 \neq 0 = \int_{0}^{1} g}$$
     On ne peut donc pas intervertir limite et intégrale, même lorsque $f_{n}(x)$ tend vers $g(x)$ en tout point de $]0\,,1]$. Les fonctions $f_{n}$ tendent vers $0$ en chaque point de $]0\,,1]$, mais leur masse, toujours égale à $1$, se concentre sur des intervalles de plus en plus courts près de $0$.

    *À retenir.* Une interversion légitime demande un contrôle uniforme : si $|f_{n}(x) - g(x)| \leqslant \varepsilon_{n}$ pour tout $x \in [0\,,1]$, avec $\varepsilon_{n} \to 0$, l'inégalité triangulaire donne $\big|\int_{0}^{1} f_{n} - \int_{0}^{1} g\big| \leqslant \varepsilon_{n}$, qui tend vers $0$. Ici, $\max|f_{n}| = 2n$ ne tend pas vers $0$. Les exercices 10 et 11 contourneront la difficulté en coupant l'intervalle d'intégration.
- id: "ma-18-07"
  feuille: "f-ma-18"
  numero: 7
  partie: "Intégrale d'une fonction continue par morceaux"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["propriétés de l'intégrale", intégrales]
  noeuds: [ri-proprietes]
  notions: []
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **1.** Soit $f : [a\,,b] \to \mathbb{R}$ continue telle que $|f| \leqslant 1$ et $\displaystyle\int_{a}^{b} f = b - a$. Que dire de $f$ ?

    **2.** Déterminer les fonctions $f : [0\,,1] \to [0\,,1]$ continues telles que $\displaystyle\int_{0}^{1} f = \int_{0}^{1} f^{2}$.

    **3.** Soit $f : [0\,,1] \to \mathbb{R}$ continue telle que $\displaystyle\int_{0}^{1} f^{2} = \int_{0}^{1} f^{3} = \int_{0}^{1} f^{4}$. Montrer que $f$ est la fonction nulle ou la fonction constante égale à $1$.
  corrige: |
    Les trois questions reposent sur le théorème 4 : une fonction continue, positive et d'intégrale nulle est nulle. Il s'agit chaque fois de fabriquer, à partir des hypothèses, une telle fonction.

    **1.** Comme $f \leqslant |f| \leqslant 1$, la fonction $1 - f$ est continue et positive, et 
    $$\int_{a}^{b} (1 - f) = (b - a) - \int_{a}^{b} f = 0.$$
     Par le théorème 4, $1 - f$ est nulle. 
    $$\boxed{f \text{ est la fonction constante égale à } 1}$$
     Réciproquement, cette fonction convient.

    **2.** Comme $f$ est à valeurs dans $[0\,,1]$, la fonction $f - f^{2} = f(1 - f)$ est continue et positive ; par hypothèse, son intégrale est nulle. Par le théorème 4, $f(x)(1 - f(x)) = 0$, c'est-à-dire $f(x) \in \{0, 1\}$, pour tout $x \in [0\,,1]$. Or $f([0\,,1])$ est un intervalle (chapitre 8, théorème 9) contenu dans $\{0, 1\}$ : il est réduit à un point. 
    $$\boxed{f = 0 \quad\text{ou}\quad f = 1}$$
     Réciproquement, ces deux fonctions conviennent.

    **3.** On cherche une combinaison des trois intégrales qui soit l'intégrale d'une fonction positive. Le carré $f^{2}(1 - f)^{2} = f^{2} - 2f^{3} + f^{4}$ convient : 
    $$\int_{0}^{1} f^{2}(1 - f)^{2} = \int_{0}^{1} f^{2} - 2\int_{0}^{1} f^{3} + \int_{0}^{1} f^{4} = 0.$$
     La fonction $f^{2}(1 - f)^{2}$ est continue et positive, donc nulle, et $f(x) \in \{0, 1\}$ pour tout $x$. On conclut comme à la question 2. 
    $$\boxed{f = 0 \quad\text{ou}\quad f = 1}$$
     *Piège.* Le théorème 4 exige la continuité. L'erreur la plus répandue est de l'appliquer à une fonction continue par morceaux : la fonction égale à $1$ en $\frac{1}{2}$ et nulle ailleurs vérifie les hypothèses de la question 3, sauf la continuité, et n'est ni nulle ni égale à $1$. Le passage par le théorème des valeurs intermédiaires, à la fin, utilise lui aussi la continuité.
- id: "ma-18-08"
  feuille: "f-ma-18"
  numero: 8
  partie: "Intégrale d'une fonction continue par morceaux"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["propriétés de l'intégrale", intégrales]
  noeuds: [ri-proprietes]
  notions: []
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **1.** Soit $f : [0\,,1] \to \mathbb{R}$ continue et positive, telle que $\displaystyle\int_{0}^{1} f \leqslant \frac{1}{2}$. Montrer que $f$ admet un point fixe.

    **2.** L'hypothèse de positivité est-elle utile ?
  corrige: |
    **1.** Posons $g(x) = f(x) - x$, continue sur $[0\,,1]$, et supposons que $f$ n'a pas de point fixe. La fonction $g$ ne s'annule pas sur l'intervalle $[0\,,1]$, donc garde un signe strict constant (chapitre 8, proposition 15). Deux cas se présentent.

    • Si $g < 0$, alors $f(0) = g(0) < 0$, ce qui contredit la positivité de $f$.

    • Si $g > 0$, la fonction $g$ est continue, positive et non nulle, donc d'intégrale strictement positive (théorème 4, sous forme contraposée) : $\int_{0}^{1} f > \int_{0}^{1} x\,\mathrm{d} x = \frac{1}{2}$, ce qui contredit l'hypothèse.

    $$\boxed{f \text{ admet au moins un point fixe dans } [0\,,1]}$$

    **2.** La positivité n'a servi qu'à exclure le cas $g < 0$, et elle est indispensable : la fonction $f : x \mapsto x - 1$ est continue, d'intégrale $-\frac{1}{2} \leqslant \frac{1}{2}$, et l'équation $x - 1 = x$ n'a pas de solution. 
    $$\boxed{\text{oui : } f(x) = x - 1 \text{ vérifie } \int_{0}^{1} f = -\frac{1}{2} \text{ et n'a aucun point fixe}}$$
     *À retenir.* La constante $\frac{1}{2}$ est optimale : pour tout $\varepsilon > 0$, la fonction $x \mapsto x + \varepsilon$ est positive, d'intégrale $\frac{1}{2} + \varepsilon$, et n'a pas de point fixe. L'inégalité stricte du théorème 4 est ce qui permet d'atteindre le cas limite $\int_{0}^{1} f = \frac{1}{2}$.
- id: "ma-18-09"
  feuille: "f-ma-18"
  numero: 9
  partie: "Intégrale d'une fonction continue par morceaux"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["propriétés de l'intégrale", intégrales, logarithme et exponentielle, fonctions à valeurs complexes]
  noeuds: [ri-proprietes, ar-tfa]
  notions: []
  page_enonce: 3
  page_corrige: 7
  enonce: |
    **1.** Soit $f : [a\,,b] \to \mathbb{R}$ continue telle que $\displaystyle\Big|\int_{a}^{b} f\Big| = \int_{a}^{b} |f|$. Montrer que $f$ garde un signe constant sur $[a\,,b]$.

    **2.** Soit $f : [0\,,1] \to \mathbb{C}$ continue telle que $\displaystyle\Big|\int_{0}^{1} f(t)\,\mathrm{d} t\Big| = \int_{0}^{1} |f(t)|\,\mathrm{d} t$. Montrer qu'il existe un réel $\theta$ et une fonction $g : [0\,,1] \to \mathbb{R}_{+}$ continue tels que $f(t) = g(t)\,\mathrm{e}^{\mathrm{i}\theta}$ pour tout $t \in [0\,,1]$. On pourra reprendre la démonstration du théorème 5 du cours.
  corrige: |
    **1.** Notons $S = \int_{a}^{b} f$. Si $S \geqslant 0$, l'hypothèse s'écrit $\int_{a}^{b} (|f| - f) = 0$ ; la fonction $|f| - f$ est continue et positive, donc nulle par le théorème 4, et $f = |f| \geqslant 0$. Si $S < 0$, on obtient de même $\int_{a}^{b} (|f| + f) = 0$, et $f = -|f| \leqslant 0$. 
    $$\boxed{f \geqslant 0 \text{ sur } [a\,,b] \text{ si } \int_{a}^{b} f \geqslant 0, \qquad f \leqslant 0 \text{ sur } [a\,,b] \text{ sinon}}$$

    **2.** Si $\int_{0}^{1} f = 0$, alors $\int_{0}^{1} |f| = 0$, et $|f|$, continue et positive, est nulle : $f = 0$ convient avec $g = 0$ et $\theta = 0$. Sinon, on écrit, comme dans la démonstration du théorème 5, $\int_{0}^{1} f = r\,\mathrm{e}^{\mathrm{i}\theta}$ avec $r > 0$. Par linéarité, $\int_{0}^{1} \mathrm{e}^{-\mathrm{i}\theta}f = r$ est réel, et la proposition 8 donne $\int_{0}^{1} \operatorname{Re}\big(\mathrm{e}^{-\mathrm{i}\theta}f\big) = r = \int_{0}^{1} |f|$. Ainsi 
    $$\int_{0}^{1} \Big(|f(t)| - \operatorname{Re}\big(\mathrm{e}^{-\mathrm{i}\theta}f(t)\big)\Big)\,\mathrm{d} t = 0.$$
     La fonction intégrée est continue et positive, puisque $\operatorname{Re} z \leqslant |z|$ et $|\mathrm{e}^{-\mathrm{i}\theta}f(t)| = |f(t)|$ ; elle est donc nulle. Or, pour $z = x + \mathrm{i} y$ complexe, $\operatorname{Re} z = |z|$ s'écrit $x = \sqrt{x^{2} + y^{2}}$, ce qui impose $y = 0$ et $x \geqslant 0$ : le nombre $\mathrm{e}^{-\mathrm{i}\theta}f(t)$ est un réel positif, égal à $|f(t)|$. 
    $$\boxed{f(t) = g(t)\,\mathrm{e}^{\mathrm{i}\theta} \quad\text{avec}\quad g = |f| \text{ continue et positive}}$$
     *À retenir.* C'est le cas d'égalité de l'inégalité triangulaire complexe : il n'y a égalité que si toutes les valeurs $f(t)$ sont sur une même demi-droite issue de $0$, de sorte qu'elles ne se compensent pas. La question 1 en est le cas réel, où les deux demi-droites possibles sont $\mathbb{R}_{+}$ et $\mathbb{R}_{-}$. On comparera avec le cas d'égalité de l'inégalité triangulaire pour deux complexes (chapitre 4, théorème 3), qui reposait sur la même équivalence $\operatorname{Re} w = |w| \iff w \in \mathbb{R}_{+}$.
- id: "ma-18-10"
  feuille: "f-ma-18"
  numero: 10
  partie: "Intégrale d'une fonction continue par morceaux"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["propriétés de l'intégrale", intégrales, "suites d'intégrales", logarithme et exponentielle]
  noeuds: [ri-proprietes, su-convergence, ar-tfa]
  notions: [cosinus-sinus]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Déterminer la limite des suites de termes généraux suivants, en encadrant chaque intégrale.

    **(a)** $\displaystyle\int_{0}^{1} x^{n}\ln(1 + x)\,\mathrm{d} x$

    **(b)** $\displaystyle\int_{0}^{n} \frac{\mathrm{d} t}{1 + \mathrm{e}^{nt}}$

    **(c)** $\displaystyle\int_{0}^{\pi/2} \mathrm{e}^{-n\sin t}\,\mathrm{d} t$

    Pour (c), on pourra utiliser l'inégalité $\sin t \geqslant \frac{2t}{\pi}$ sur $\big[0\,,\frac{\pi}{2}\big]$, établie au chapitre 9 par concavité du sinus.
  corrige: |
    Dans les trois cas, la fonction intégrée est continue et positive, et l'on la majore par une fonction dont on connaît une primitive.

    **(a)** Pour $x \in [0\,,1]$, $0 \leqslant \ln(1 + x) \leqslant \ln 2$, donc $0 \leqslant x^{n}\ln(1 + x) \leqslant x^{n}\ln 2$. En intégrant, 
    $$\boxed{0 \leqslant \int_{0}^{1} x^{n}\ln(1 + x)\,\mathrm{d} x \leqslant \frac{\ln 2}{n + 1}, \qquad\text{limite } 0}$$

    **(b)** Pour $t \geqslant 0$, $\frac{1}{1 + \mathrm{e}^{nt}} \leqslant \frac{1}{\mathrm{e}^{nt}} = \mathrm{e}^{-nt}$. En intégrant, 
    $$\boxed{0 \leqslant \int_{0}^{n} \frac{\mathrm{d} t}{1 + \mathrm{e}^{nt}} \leqslant \int_{0}^{n} \mathrm{e}^{-nt}\,\mathrm{d} t = \frac{1 - \mathrm{e}^{-n^{2}}}{n} \leqslant \frac{1}{n}, \qquad\text{limite } 0}$$
     Ici, l'intervalle d'intégration s'allonge avec $n$, mais la fonction intégrée décroît assez vite pour que cela ne compte pas. On peut d'ailleurs calculer l'intégrale exactement, en écrivant $\frac{1}{1 + \mathrm{e}^{nt}} = 1 - \frac{\mathrm{e}^{nt}}{1 + \mathrm{e}^{nt}}$, de la forme $1 - \frac{1}{n}\frac{u'}{u}$ : elle vaut $\frac{\ln 2 - \ln(1 + \mathrm{e}^{-n^{2}})}{n}$, équivalente à $\frac{\ln 2}{n}$ ✓.

    **(c)** L'inégalité de Jordan $\sin t \geqslant \frac{2t}{\pi}$, valable sur $\big[0\,,\frac{\pi}{2}\big]$, et la décroissance de la fonction $u \mapsto \mathrm{e}^{-nu}$ donnent 
    $$0 \leqslant \mathrm{e}^{-n\sin t} \leqslant \mathrm{e}^{-2nt/\pi} \qquad \Big(0 \leqslant t \leqslant \frac{\pi}{2}\Big).$$
     En intégrant, 
    $$\boxed{0 \leqslant \int_{0}^{\pi/2} \mathrm{e}^{-n\sin t}\,\mathrm{d} t \leqslant \int_{0}^{\pi/2} \mathrm{e}^{-2nt/\pi}\,\mathrm{d} t = \frac{\pi}{2n}\big(1 - \mathrm{e}^{-n}\big) \leqslant \frac{\pi}{2n}, \qquad\text{limite } 0}$$
     Pour $n = 20$, l'intégrale vaut environ $0{,}0501$, et la majoration $0{,}0785$ ✓.

    *Piège.* En (c), la fonction intégrée vaut $1$ en $t = 0$ pour tout $n$ : elle ne tend pas vers $0$ uniformément, et la majoration triviale $\mathrm{e}^{-n\sin t} \leqslant 1$ ne donne rien. C'est la situation de l'exercice 6 ; l'inégalité de Jordan montre que la zone où la fonction n'est pas petite a une longueur de l'ordre de $\frac{1}{n}$.
- id: "ma-18-11"
  feuille: "f-ma-18"
  numero: 11
  partie: "Intégrale d'une fonction continue par morceaux"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["propriétés de l'intégrale", intégrales, "suites d'intégrales"]
  noeuds: [ri-proprietes, su-convergence]
  notions: []
  page_enonce: 3
  page_corrige: 8
  enonce: |
    Soit $f : [0\,,1] \to \mathbb{R}$ continue. Déterminer la limite de la suite de terme général $\displaystyle\int_{0}^{1} f(x^{n})\,\mathrm{d} x$. On pourra, pour $\alpha \in \,]0\,,1[$, couper l'intégrale en $\alpha$.
  corrige: |
    La fonction $x \mapsto f(x^{n})$ est continue sur $[0\,,1]$, et $x^{n}$ tend vers $0$ pour $x \in [0\,,1[$, mais pas pour $x = 1$ : on s'attend à la limite $f(0)$, et l'on contrôle séparément la zone proche de $1$, où $x^{n}$ n'est pas petit, en coupant en $\alpha$.

    Soit $M$ un majorant de $|f|$ sur $[0\,,1]$, qui existe par le théorème des bornes atteintes (chapitre 8, théorème 10), et que l'on peut supposer strictement positif. Soit $\varepsilon > 0$.

    • Par continuité de $f$ en $0$, il existe $\eta > 0$ tel que $|f(y) - f(0)| \leqslant \varepsilon$ pour $y \in [0\,,\eta]$.

    • On choisit $\alpha = 1 - \frac{\varepsilon}{2M + \varepsilon} \in \,]0\,,1[$, de sorte que $2M(1 - \alpha) = \frac{2M\varepsilon}{2M + \varepsilon} \leqslant \varepsilon$.

    • Comme $\alpha^{n} \to 0$, il existe $n_{0}$ tel que $\alpha^{n} \leqslant \eta$ pour $n \geqslant n_{0}$ ; alors, pour $x \in [0\,,\alpha]$, $0 \leqslant x^{n} \leqslant \alpha^{n} \leqslant \eta$.

    Pour $n \geqslant n_{0}$, on écrit $f(0) = \int_{0}^{1} f(0)\,\mathrm{d} x$, et l'on coupe en $\alpha$ : 
    $$\Big|\int_{0}^{1} f(x^{n})\,\mathrm{d} x - f(0)\Big| \leqslant \int_{0}^{\alpha} \big|f(x^{n}) - f(0)\big|\,\mathrm{d} x + \int_{\alpha}^{1} \big|f(x^{n}) - f(0)\big|\,\mathrm{d} x \leqslant \alpha\varepsilon + 2M(1 - \alpha) \leqslant 2\varepsilon.$$

    $$\boxed{\int_{0}^{1} f(x^{n})\,\mathrm{d} x \xrightarrow[n \to +\infty]{} f(0)}$$
     Pour $f = \cos$ et $n = 200$, l'intégrale vaut environ $0{,}9988$ ✓.

    *À retenir.* L'ordre des choix est essentiel : on fixe d'abord $\alpha$, qui rend petite la contribution de la zone $[\alpha\,,1]$ grâce à sa longueur, puis $n$, qui rend petite celle de $[0\,,\alpha]$ grâce à la convergence de $\alpha^{n}$. On ne peut pas prendre $\alpha = 1$ : la convergence de $x^{n}$ vers $0$ n'est pas uniforme sur $[0\,,1[$. Le même découpage resservira à l'exercice 29.
- id: "ma-18-12"
  feuille: "f-ma-18"
  numero: 12
  partie: "Intégrale d'une fonction continue par morceaux"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["propriétés de l'intégrale", intégrales, fonctions définies par une intégrale, "suites d'intégrales"]
  noeuds: [ri-proprietes, ar-tfa, su-convergence]
  notions: []
  page_enonce: 3
  page_corrige: 8
  enonce: |
    **1.** Soit $f : [0\,,+\infty[ \to \mathbb{R}$ continue, admettant une limite finie $\ell$ en $+\infty$. Montrer que 
    $$\frac{1}{x}\int_{0}^{x} f(t)\,\mathrm{d} t \xrightarrow[x \to +\infty]{} \ell.$$

    **2.** Soit $f : \mathbb{R} \to \mathbb{R}$ continue et $T$-périodique, avec $T > 0$. On rappelle que $\int_{x}^{x + T} f$ ne dépend pas du réel $x$ (chapitre 6). Déterminer la limite de $\frac{1}{x}\int_{0}^{x} f(t)\,\mathrm{d} t$ quand $x$ tend vers $+\infty$.
  corrige: |
    **1.** Soit $\varepsilon > 0$, et $A > 0$ tel que $|f(t) - \ell| \leqslant \varepsilon$ pour $t \geqslant A$. Pour $x > A$, on écrit $\ell = \frac{1}{x}\int_{0}^{x} \ell\,\mathrm{d} t$ et l'on coupe en $A$ : 
    $$\Big|\frac{1}{x}\int_{0}^{x} f(t)\,\mathrm{d} t - \ell\Big| \leqslant \frac{1}{x}\Big|\int_{0}^{A} \big(f(t) - \ell\big)\,\mathrm{d} t\Big| + \frac{1}{x}\int_{A}^{x} |f(t) - \ell|\,\mathrm{d} t \leqslant \frac{C}{x} + \frac{x - A}{x}\,\varepsilon,$$
     où $C = \Big|\int_{0}^{A} (f - \ell)\Big|$ ne dépend pas de $x$. Pour $x > \max\big(A, \frac{C}{\varepsilon}\big)$, le majorant est au plus $2\varepsilon$. 
    $$\boxed{\frac{1}{x}\int_{0}^{x} f(t)\,\mathrm{d} t \xrightarrow[x \to +\infty]{} \ell}$$
     C'est la version intégrale du lemme de Cesàro (exercice 47 du chapitre 7) : la moyenne des valeurs de $f$ sur $[0\,,x]$ tend vers la limite de $f$. Le début de l'intervalle, où $f$ peut être loin de $\ell$, pèse de moins en moins dans la moyenne.

    **2.** Notons $I = \int_{0}^{T} f$ et $M = \max_{[0, T]} |f|$, qui majore $|f|$ sur $\mathbb{R}$ par périodicité. Pour $x > 0$, soit $N = \lfloor \frac{x}{T} \rfloor$, de sorte que $NT \leqslant x < (N + 1)T$. Chaque intégrale $\int_{kT}^{(k + 1)T} f$ vaut $I$ (chapitre 6, proposition 6), et la relation de Chasles donne 
    $$\int_{0}^{x} f = NI + \int_{NT}^{x} f, \qquad\text{avec}\qquad \Big|\int_{NT}^{x} f\Big| \leqslant (x - NT)M \leqslant TM.$$
     Ainsi $\Big|\frac{1}{x}\int_{0}^{x} f - \frac{N}{x}I\Big| \leqslant \frac{TM}{x}$, qui tend vers $0$, et $\frac{1}{T} - \frac{1}{x} < \frac{N}{x} \leqslant \frac{1}{T}$ donne $\frac{N}{x} \to \frac{1}{T}$. 
    $$\boxed{\frac{1}{x}\int_{0}^{x} f(t)\,\mathrm{d} t \xrightarrow[x \to +\infty]{} \frac{1}{T}\int_{0}^{T} f(t)\,\mathrm{d} t}$$
     La moyenne sur $[0\,,x]$ tend vers la valeur moyenne de $f$ sur une période. Pour $f = \sin^{2}$, de période $\pi$, on trouve $\frac{1}{\pi}\int_{0}^{\pi} \sin^{2} = \frac{1}{2}$ ✓.

    *Piège.* La question 1 ne s'applique pas ici : une fonction périodique non constante n'a pas de limite en $+\infty$. Pourtant sa moyenne converge : la réciproque de la question 1 est fausse, comme pour le lemme de Cesàro sur les suites, où la suite $\big((-1)^{n}\big)$ a des moyennes qui tendent vers $0$.
- id: "ma-18-13"
  feuille: "f-ma-18"
  numero: 13
  partie: "Intégrale d'une fonction continue par morceaux"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["propriétés de l'intégrale", intégrales]
  noeuds: [ri-proprietes]
  notions: []
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Soit $f : [0\,,\pi] \to \mathbb{R}$ continue telle que 
    $$\int_{0}^{\pi} f(t)\sin t\,\mathrm{d} t = \int_{0}^{\pi} f(t)\cos t\,\mathrm{d} t = 0.$$

    **1.** Montrer que $f$ s'annule au moins deux fois sur l'intervalle $]0\,,\pi[$. On pourra raisonner par l'absurde et considérer $\int_{0}^{\pi} f(t)\sin(t - \alpha)\,\mathrm{d} t$ pour un réel $\alpha$ bien choisi.

    **2.** Donner un exemple de fonction $f$ non nulle vérifiant les hypothèses.
  corrige: |
    **1.** On raisonne par l'absurde, en supposant que $f$ s'annule au plus une fois sur $]0\,,\pi[$. L'outil est le théorème 4 : si une fonction continue $h$ garde un signe constant strict sur $[0\,,\pi]$ privé d'un nombre fini de points, alors $\int_{0}^{\pi} h \neq 0$, puisque $|h|$ est continue, positive et non nulle.

    • Si $f$ ne s'annule pas sur $]0\,,\pi[$, elle y garde un signe strict constant (chapitre 8, proposition 15), et $h(t) = f(t)\sin t$ aussi, puisque $\sin t > 0$ sur $]0\,,\pi[$. Alors $\int_{0}^{\pi} f(t)\sin t\,\mathrm{d} t \neq 0$ : contradiction.

    • Si $f$ s'annule en un seul point $\alpha$ de $]0\,,\pi[$, elle garde un signe strict constant sur $]0\,,\alpha[$ et sur $]\alpha\,,\pi[$. Si ces signes sont les mêmes, on conclut comme ci-dessus avec $f(t)\sin t$. S'ils sont opposés, on considère $h(t) = f(t)\sin(t - \alpha)$ : pour $t \in \,]0\,,\alpha[$, on a $t - \alpha \in \,]-\pi\,,0[$ et $\sin(t - \alpha) < 0$ ; pour $t \in \,]\alpha\,,\pi[$, on a $t - \alpha \in \,]0\,,\pi[$ et $\sin(t - \alpha) > 0$. Le facteur $\sin(t - \alpha)$ change de signe en $\alpha$ en même temps que $f$, et $h$ garde un signe strict constant sur $]0\,,\alpha[\, \cup \,]\alpha\,,\pi[$. Or 
    $$\int_{0}^{\pi} h = \cos\alpha\int_{0}^{\pi} f(t)\sin t\,\mathrm{d} t - \sin\alpha\int_{0}^{\pi} f(t)\cos t\,\mathrm{d} t = 0,$$
     ce qui est une contradiction.

    $$\boxed{f \text{ s'annule au moins deux fois sur } ]0\,,\pi[}$$

    **2.** On cherche une fonction trigonométrique dont les produits par $\sin$ et $\cos$ s'intègrent en $0$. La fonction $f(t) = \sin 3t$ convient : en linéarisant (chapitre 4), 
    $$\int_{0}^{\pi} \sin 3t\,\sin t\,\mathrm{d} t = \frac{1}{2}\int_{0}^{\pi} (\cos 2t - \cos 4t)\,\mathrm{d} t = 0, \qquad \int_{0}^{\pi} \sin 3t\,\cos t\,\mathrm{d} t = \frac{1}{2}\int_{0}^{\pi} (\sin 4t + \sin 2t)\,\mathrm{d} t = 0.$$

    $$\boxed{f(t) = \sin 3t \text{ vérifie les hypothèses}}$$
     Elle s'annule exactement en $\frac{\pi}{3}$ et $\frac{2\pi}{3}$ sur $]0\,,\pi[$ : le nombre de zéros garanti par la question 1 est atteint. En revanche, $\sin 2t$ ne convient pas, car $\int_{0}^{\pi} \sin 2t\cos t\,\mathrm{d} t = \frac{4}{3}$.

    *À retenir.* Les conditions $\int f\sin = \int f\cos = 0$ entraînent $\int f\,g = 0$ pour toute combinaison $g = \lambda\sin + \mu\cos$, et l'on choisit $g$ pour qu'elle change de signe là où $f$ en change. L'exercice 14 applique la même idée avec des polynômes à la place des fonctions trigonométriques.
- id: "ma-18-14"
  feuille: "f-ma-18"
  numero: 14
  partie: "Intégrale d'une fonction continue par morceaux"
  etoiles: 3
  types: [Démonstration]
  mots_cles: ["propriétés de l'intégrale", intégrales]
  noeuds: [ri-proprietes]
  notions: []
  page_enonce: 4
  page_corrige: 10
  enonce: |
    Soit $n \geqslant 1$ et $f : [a\,,b] \to \mathbb{R}$ continue, non identiquement nulle, telle que 
    $$\int_{a}^{b} t^{k}f(t)\,\mathrm{d} t = 0 \qquad\text{pour tout } k \in [\![0\,;n - 1]\!].$$
     On veut montrer que $f$ change au moins $n$ fois de signe, c'est-à-dire qu'il existe des réels $y_{0}$, …, $y_{n}$ de $[a\,,b]$ tels que 
    $$y_{0} < y_{1} < \cdots < y_{n} \qquad\text{et}\qquad f(y_{i - 1})f(y_{i}) < 0 \quad\text{pour tout } i \in [\![1\,;n]\!].$$

    **1.** Traiter le cas $n = 1$.

    **2.** Traiter le cas $n = 2$. On pourra raisonner par l'absurde et multiplier $f$ par une fonction affine bien choisie.

    **3.** Traiter le cas général.

    **4.** Vérifier que $t \mapsto 6t^{2} - 6t + 1$ satisfait les hypothèses pour $n = 2$ sur $[0\,,1]$. Le résultat peut-il être amélioré ?
  corrige: |
    Dans tout l'exercice, on dit qu'une suite $y_{0} < \cdots < y_{m}$ de points de $[a\,,b]$ est une *chaîne* de longueur $m$ si $f(y_{i - 1})f(y_{i}) < 0$ pour tout $i \in [\![1\,;m]\!]$ ; il s'agit de trouver une chaîne de longueur $n$. L'outil, comme à l'exercice 13, est le théorème 4 : une fonction continue de signe constant et d'intégrale nulle est nulle.

    **1.** Si l'on avait $f \geqslant 0$ sur $[a\,,b]$, la fonction $f$, continue, positive et d'intégrale nulle, serait nulle par le théorème 4, ce qui est exclu. Donc $f$ prend une valeur strictement négative, en un point $y$, et de même, en appliquant ce raisonnement à $-f$, une valeur strictement positive, en un point $z$. En rangeant $y$ et $z$ dans l'ordre croissant, on obtient une chaîne de longueur $1$. 
    $$\boxed{n = 1 : f \text{ change au moins une fois de signe}}$$

    **2.** Supposons qu'il n'existe pas de chaîne de longueur $2$. Par la question 1, il existe une chaîne $y_{0} < y_{1}$ ; quitte à remplacer $f$ par $-f$, on suppose $f(y_{0}) > 0 > f(y_{1})$. On pose 
    $$c = \sup\big\{t \in [y_{0}\,,y_{1}] \ \big|\ f(t) > 0\big\},$$
     qui existe puisque cet ensemble contient $y_{0}$ et est majoré par $y_{1}$. On montre que $f \geqslant 0$ sur $[a\,,c[$ et $f \leqslant 0$ sur $]c\,,b]$.

    • Sur $]c\,,y_{1}]$, $f \leqslant 0$ par définition de $c$. Sur $[y_{1}\,,b]$, un point $z$ tel que $f(z) > 0$ donnerait la chaîne $y_{0} < y_{1} < z$ : donc $f \leqslant 0$.

    • Sur $[a\,,y_{0}]$, un point $z$ tel que $f(z) < 0$ donnerait la chaîne $z < y_{0} < y_{1}$ : donc $f \geqslant 0$. Sur $[y_{0}\,,c[$, s'il existait $u$ tel que $f(u) < 0$, alors $u < c$, et par définition de la borne supérieure il existerait $v > u$ dans $[y_{0}\,,y_{1}]$ tel que $f(v) > 0$ : la suite $y_{0} < u < v$ serait une chaîne de longueur $2$.

    La fonction $g : t \mapsto (t - c)f(t)$ est donc continue et négative sur $[a\,,b]$, puisque ses deux facteurs sont de signes opposés de part et d'autre de $c$. Par hypothèse, avec $k = 0$ et $k = 1$, 
    $$\int_{a}^{b} g = \int_{a}^{b} t f(t)\,\mathrm{d} t - c\int_{a}^{b} f(t)\,\mathrm{d} t = 0.$$
     Par le théorème 4, appliqué à $-g$, la fonction $g$ est nulle ; donc $f(t) = 0$ pour $t \neq c$, puis $f(c) = 0$ par continuité, et $f$ est nulle, ce qui est exclu. 
    $$\boxed{n = 2 : f \text{ change au moins deux fois de signe}}$$

    **3.** Supposons qu'il n'existe pas de chaîne de longueur $n$. Il n'en existe alors pas non plus de longueur supérieure, puisque les $n + 1$ premiers points d'une chaîne plus longue en formeraient une de longueur $n$. L'ensemble des longueurs de chaînes est donc une partie de $[\![1\,;n - 1]\!]$, non vide par la question 1 ; soit $m$ son plus grand élément et $y_{0} < \cdots < y_{m}$ une chaîne de longueur $m$. Quitte à remplacer $f$ par $-f$, on suppose $f(y_{0}) > 0$, de sorte que $f(y_{i})$ est du signe de $(-1)^{i}$. On généralise la construction de la question 2 en posant, pour $i \in [\![1\,;m]\!]$, 
    $$c_{i} = \sup\big\{t \in [y_{i - 1}\,,y_{i}] \ \big|\ (-1)^{i - 1}f(t) > 0\big\}, \qquad c_{0} = a, \qquad c_{m + 1} = b.$$
     Par continuité de $f$ en $y_{i - 1}$ et en $y_{i}$, on a $y_{i - 1} < c_{i} < y_{i}$, donc $c_{1} < c_{2} < \cdots < c_{m}$. Exactement comme à la question 2, en remplaçant chaque fois une chaîne de longueur $2$ par une chaîne de longueur $m + 1$ ou $m + 2$, obtenue en insérant un ou deux points dans $(y_{0}, \dots, y_{m})$, la maximalité de $m$ donne : 
    $$(-1)^{i}f \geqslant 0 \ \text{ sur } \,]c_{i}\,,c_{i + 1}[ \quad\text{pour tout } i \in [\![0\,;m]\!].$$
     Précisément, sur $]c_{i}\,,y_{i}]$, c'est la définition de $c_{i}$ ; un point $u \in [y_{i}\,,c_{i + 1}[$ où $(-1)^{i}f(u) < 0$ fournirait un $v \in \,]u\,,y_{i + 1}[$ où $(-1)^{i}f(v) > 0$, et la suite $y_{0} < \cdots < y_{i} < u < v < y_{i + 1} < \cdots < y_{m}$ serait une chaîne de longueur $m + 2$ ; un point $u < y_{0}$ où $f(u) < 0$, ou un point $u > y_{m}$ où $(-1)^{m}f(u) < 0$, prolongerait la chaîne d'un cran.

    On pose alors $P = \prod_{i = 1}^{m} (X - c_{i})$, de degré $m \leqslant n - 1$. Pour $t \in \,]c_{i}\,,c_{i + 1}[$, exactement $m - i$ facteurs $t - c_{j}$ sont négatifs, donc $P(t)$ est du signe de $(-1)^{m - i}$, et $(-1)^{m}P(t)f(t) = (-1)^{m - i}P(t) \times (-1)^{i}f(t) \geqslant 0$. La fonction $t \mapsto (-1)^{m}P(t)f(t)$ est donc continue et positive sur $[a\,,b]$, privé d'un nombre fini de points, donc sur $[a\,,b]$ par continuité. Comme $P$ est une combinaison linéaire de $1$, $X$, …, $X^{n - 1}$, l'hypothèse et la linéarité donnent $\int_{a}^{b} P(t)f(t)\,\mathrm{d} t = 0$. Par le théorème 4, $Pf$ est nulle ; $f$ s'annule hors des $c_{i}$, donc partout par continuité, ce qui est exclu. 
    $$\boxed{f \text{ change au moins } n \text{ fois de signe}}$$

    **4.** Pour $p(t) = 6t^{2} - 6t + 1$, on calcule 
    $$\int_{0}^{1} p(t)\,\mathrm{d} t = 2 - 3 + 1 = 0, \qquad \int_{0}^{1} t\,p(t)\,\mathrm{d} t = \frac{6}{4} - \frac{6}{3} + \frac{1}{2} = 0.$$

    $$\boxed{p \text{ vérifie les hypothèses pour } n = 2 \text{ sur } [0\,,1]}$$
     Ses racines sont $\frac{3 \pm \sqrt{3}}{6}$, et $p(0) = 1$, $p\big(\frac{1}{2}\big) = -\frac{1}{2}$, $p(1) = 1$ : la suite $0 < \frac{1}{2} < 1$ est une chaîne de longueur $2$. Il n'en existe pas de longueur $3$, puisque, par le théorème des valeurs intermédiaires, $p$ aurait alors trois racines distinctes, une entre deux points consécutifs de la chaîne, alors qu'il est de degré $2$ (chapitre 13, théorème 3). 
    $$\boxed{\text{le résultat ne peut pas être amélioré : } p \text{ change exactement deux fois de signe}}$$
     On constate d'ailleurs que $\int_{0}^{1} t^{2}p(t)\,\mathrm{d} t = \frac{1}{30} \neq 0$ : $p$ ne vérifie pas les hypothèses pour $n = 3$, ce qui est cohérent.

    *À retenir.* L'hypothèse dit que $\int_{a}^{b} Pf = 0$ pour tout polynôme $P$ de degré au plus $n - 1$ ; si $f$ changeait de signe moins de $n$ fois, on fabriquerait un tel $P$ qui change de signe aux mêmes endroits que $f$, et $Pf$ serait de signe constant. C'est l'argument de l'exercice 13, où les fonctions $\lambda\sin + \mu\cos$ jouaient le rôle des polynômes.
- id: "ma-18-15"
  feuille: "f-ma-18"
  numero: 15
  partie: "Intégrale d'une fonction continue par morceaux"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: ["propriétés de l'intégrale", intégrales, "suites d'intégrales", logarithme et exponentielle]
  noeuds: [ri-proprietes, su-convergence, ar-tfa]
  notions: []
  page_enonce: 4
  page_corrige: 11
  enonce: |
    *Inégalités de Hölder et de Minkowski.* Pour $p \geqslant 1$ et $f \in \mathcal{C}_{m}([0\,,1], \mathbb{R})$, on pose 
    $$N_{p}(f) = \Big(\int_{0}^{1} |f|^{p}\Big)^{1/p}.$$

    **1.** Soit $f$ continue sur $[0\,,1]$. Montrer que $N_{p}(f)$ tend vers $\max\limits_{[0, 1]} |f|$ quand $p$ tend vers $+\infty$.

    **2.** Soit $p > 1$, et $q = \frac{p}{p - 1}$, de sorte que $\frac{1}{p} + \frac{1}{q} = 1$.

    **(a)** Montrer l'inégalité de Young : $a^{1/p}b^{1/q} \leqslant \dfrac{a}{p} + \dfrac{b}{q}$ pour tous réels $a$, $b \geqslant 0$. On pourra utiliser la concavité du logarithme (chapitre 9).

    **(b)** En commençant par le cas où $N_{p}(f) = N_{q}(g) = 1$, montrer l'inégalité de Hölder : pour toutes fonctions $f$, $g \in \mathcal{C}_{m}([0\,,1], \mathbb{R})$, 
    $$\int_{0}^{1} |fg| \leqslant N_{p}(f)\,N_{q}(g).$$
     Quelle inégalité obtient-on pour $p = 2$ ?

    **(c)** Soit $1 \leqslant p_{1} \leqslant p_{2}$. Comparer $N_{p_{1}}(f)$ et $N_{p_{2}}(f)$.

    **3.** Soit $f$, $g \in \mathcal{C}_{m}([0\,,1], \mathbb{R})$ et $p > 1$.

    **(a)** Montrer que $\displaystyle N_{p}(f + g)^{p} \leqslant \int_{0}^{1} |f|\,|f + g|^{p - 1} + \int_{0}^{1} |g|\,|f + g|^{p - 1}$.

    **(b)** En appliquant l'inégalité de Hölder, montrer l'inégalité de Minkowski : 
    $$N_{p}(f + g) \leqslant N_{p}(f) + N_{p}(g).$$
  corrige: |
    **1.** Soit $M = \max_{[0, 1]} |f| = |f(x_{0})|$, qui existe par le théorème des bornes atteintes (chapitre 8, théorème 10). Si $M = 0$, tout est nul. Sinon, la majoration $|f|^{p} \leqslant M^{p}$ et la croissance de l'intégrale donnent $N_{p}(f) \leqslant M$. Pour la minoration, soit $\varepsilon \in \,]0\,,M[$. Par continuité de $|f|$ en $x_{0}$, il existe un segment $[\alpha\,,\beta] \subset [0\,,1]$ contenant $x_{0}$, de longueur $\ell > 0$, sur lequel $|f| \geqslant M - \varepsilon$. Comme $|f|^{p} \geqslant 0$, la relation de Chasles et la croissance donnent 
    $$\int_{0}^{1} |f|^{p} \geqslant \int_{\alpha}^{\beta} |f|^{p} \geqslant \ell\,(M - \varepsilon)^{p}, \qquad\text{donc}\qquad \ell^{1/p}(M - \varepsilon) \leqslant N_{p}(f) \leqslant M.$$
     Comme $\ell^{1/p} = \mathrm{e}^{(\ln\ell)/p}$ tend vers $1$ quand $p$ tend vers $+\infty$, on a $N_{p}(f) \geqslant M - 2\varepsilon$ pour $p$ assez grand. 
    $$\boxed{N_{p}(f) \xrightarrow[p \to +\infty]{} \max_{[0, 1]} |f|}$$
     Pour $f = \cos 3t$, dont le maximum de $|f|$ vaut $1$, on trouve $N_{10}(f) \approx 0{,}856$ et $N_{1000}(f) \approx 0{,}996$ ✓. La continuité est indispensable : pour l'indicatrice de $\{0\}$, $N_{p}$ est nul pour tout $p$, et le maximum vaut $1$.

    **2.(a)** Si $a = 0$ ou $b = 0$, le membre de gauche est nul et celui de droite positif. Sinon, la fonction $\ln$ est concave sur $]0\,,+\infty[$, puisque $\ln'' : x \mapsto -\frac{1}{x^{2}}$ est négative (chapitre 9, théorème 11). Comme $\frac{1}{p}$ et $\frac{1}{q}$ sont positifs de somme $1$, la définition de la concavité donne 
    $$\ln\Big(\frac{a}{p} + \frac{b}{q}\Big) \geqslant \frac{1}{p}\ln a + \frac{1}{q}\ln b = \ln\big(a^{1/p}b^{1/q}\big),$$
     et l'on conclut par croissance de l'exponentielle. 
    $$\boxed{a^{1/p}b^{1/q} \leqslant \frac{a}{p} + \frac{b}{q} \quad \text{pour tous } a, b \geqslant 0}$$

    **2.(b)** Supposons $N_{p}(f) = N_{q}(g) = 1$. Pour tout $t$, l'inégalité de Young appliquée à $a = |f(t)|^{p}$ et $b = |g(t)|^{q}$ donne 
    $$|f(t)g(t)| \leqslant \frac{|f(t)|^{p}}{p} + \frac{|g(t)|^{q}}{q}, \qquad\text{et en intégrant,}\qquad \int_{0}^{1} |fg| \leqslant \frac{N_{p}(f)^{p}}{p} + \frac{N_{q}(g)^{q}}{q} = \frac{1}{p} + \frac{1}{q} = 1.$$
     Dans le cas général, on fixe un réel $\lambda > 0$, et l'on applique la même inégalité à $\lambda f$ et $\frac{g}{\lambda}$, dont le produit est $fg$ : 
    $$\int_{0}^{1} |fg| \leqslant \frac{\lambda^{p}N_{p}(f)^{p}}{p} + \frac{N_{q}(g)^{q}}{q\lambda^{q}}.$$
     Si $N_{p}(f) = 0$, on fait tendre $\lambda$ vers $+\infty$, et l'on obtient $\int_{0}^{1} |fg| = 0$ ; de même si $N_{q}(g) = 0$, avec $\lambda \to 0$. Sinon, on applique le cas particulier à $\frac{f}{N_{p}(f)}$ et $\frac{g}{N_{q}(g)}$, qui vérifient $N_{p} = N_{q} = 1$, puisque $N_{p}(\mu f) = |\mu|\,N_{p}(f)$. 
    $$\boxed{\int_{0}^{1} |fg| \leqslant N_{p}(f)\,N_{q}(g)}$$
     Pour $p = 2$, on a $q = 2$, et l'on obtient l'*inégalité de Cauchy-Schwarz*, que le chapitre 19 replacera dans un cadre général : 
    $$\boxed{\int_{0}^{1} |fg| \leqslant \Big(\int_{0}^{1} f^{2}\Big)^{1/2}\Big(\int_{0}^{1} g^{2}\Big)^{1/2}}$$

    *Piège.* Pour $f$ seulement continue par morceaux, $N_{p}(f) = 0$ n'entraîne pas $f = 0$ (le théorème 4 exige la continuité) : on ne peut donc pas se contenter de traiter le cas $N_{p}(f) > 0$ en disant que l'autre est trivial. C'est pourquoi on a introduit le paramètre $\lambda$.

    **2.(c)** Si $p_{1} = p_{2}$, il n'y a rien à démontrer. Sinon, on applique l'inégalité de Hölder avec l'exposant $p = \frac{p_{2}}{p_{1}} > 1$ aux fonctions $|f|^{p_{1}}$ et $1$ ; comme $N_{q}(1) = 1$ et $\big(|f|^{p_{1}}\big)^{p} = |f|^{p_{2}}$, 
    $$\int_{0}^{1} |f|^{p_{1}} \leqslant \Big(\int_{0}^{1} |f|^{p_{2}}\Big)^{p_{1}/p_{2}}, \qquad\text{d'où, en élevant à la puissance } \frac{1}{p_{1}}, \qquad \boxed{N_{p_{1}}(f) \leqslant N_{p_{2}}(f)}$$
     Ainsi $p \mapsto N_{p}(f)$ est croissante, ce qui est cohérent avec la question 1. Pour $f(t) = t$, on trouve $N_{1} = \frac{1}{2}$, $N_{2} = \frac{1}{\sqrt{3}} \approx 0{,}577$, et $N_{p} = (p + 1)^{-1/p}$ tend vers $1$ ✓. Le résultat utilise que l'intervalle est de longueur $1$ : sur un segment de longueur $L$, un facteur $L^{1/p_{1} - 1/p_{2}}$ apparaîtrait.

    **3.(a)** Pour tout $t$, l'inégalité triangulaire $|f + g| \leqslant |f| + |g|$, multipliée par $|f + g|^{p - 1} \geqslant 0$, donne $|f + g|^{p} \leqslant |f|\,|f + g|^{p - 1} + |g|\,|f + g|^{p - 1}$. On intègre : 
    $$\boxed{N_{p}(f + g)^{p} \leqslant \int_{0}^{1} |f|\,|f + g|^{p - 1} + \int_{0}^{1} |g|\,|f + g|^{p - 1}}$$

    **3.(b)** On applique l'inégalité de Hölder à chacune des deux intégrales, avec $q = \frac{p}{p - 1}$. Comme $(p - 1)q = p$, 
    $$\int_{0}^{1} |f|\,|f + g|^{p - 1} \leqslant N_{p}(f)\Big(\int_{0}^{1} |f + g|^{p}\Big)^{1/q} = N_{p}(f)\,N_{p}(f + g)^{p/q},$$
     et de même pour $g$. Ainsi $N_{p}(f + g)^{p} \leqslant \big(N_{p}(f) + N_{p}(g)\big)N_{p}(f + g)^{p/q}$. Si $N_{p}(f + g) = 0$, l'inégalité cherchée est évidente ; sinon, on divise par $N_{p}(f + g)^{p/q}$, et $p - \frac{p}{q} = 1$. 
    $$\boxed{N_{p}(f + g) \leqslant N_{p}(f) + N_{p}(g)}$$
     *À retenir.* L'inégalité de Minkowski est une inégalité triangulaire pour $N_{p}$ : avec $N_{p}(\lambda f) = |\lambda|\,N_{p}(f)$, elle fait de $N_{p}$ une mesure de la « taille » d'une fonction, qui généralise la valeur absolue. Le cas $p = 1$ est immédiat, et le cas $p = 2$ reviendra au chapitre 19. La difficulté était de savoir à quoi appliquer Hölder : on a fait apparaître $N_{p}(f + g)$ des deux côtés, puis simplifié.
- id: "ma-18-16"
  feuille: "f-ma-18"
