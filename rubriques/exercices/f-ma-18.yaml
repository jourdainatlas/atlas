  noeuds: [de-taylor, ri-proprietes, ar-tfa, su-convergence]
  notions: [polynome-taylor]
  page_enonce: 10
  page_corrige: 33
  enonce: |
    Soit $f : \mathbb{R} \to \mathbb{R}$ de classe $\mathcal{C}^{\infty}$ telle que $f(0) = 0$, et $g$ la fonction définie sur $\mathbb{R}^{*}$ par $g(x) = \dfrac{f(x)}{x}$.

    **1.** Montrer que $g$ se prolonge par continuité en $0$.

    **2.** Pour $n \in \mathbb{N}$ et $x \neq 0$, calculer $g^{(n)}(x)$ à l'aide de la formule de Leibniz, puis, en reconnaissant une formule de Taylor, montrer que 
    $$g^{(n)}(x) = \frac{1}{x^{n+1}}\int_{0}^{x} t^{n}f^{(n+1)}(t)\,\mathrm{d} t.$$

    **3.** Calculer la limite de $g^{(n)}(x)$ quand $x$ tend vers $0$.

    **4.** En déduire que le prolongement de $g$ est de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}$.
  corrige: |
    **1.** Comme $f(0) = 0$, on a $g(x) = \frac{f(x) - f(0)}{x - 0}$ : c'est le taux d'accroissement de $f$ en $0$, qui tend vers $f'(0)$. 
    $$\boxed{g \text{ se prolonge par continuité en } 0, \text{ avec } g(0) = f'(0)}$$

    **2.** *Formule de Leibniz.* Sur chacun des intervalles $]-\infty\,,0[$ et $]0\,,+\infty[$, la fonction $g$ est le produit de $f$ et de $x \mapsto \frac{1}{x}$, toutes deux de classe $\mathcal{C}^{\infty}$, et $\big(\frac{1}{x}\big)^{(k)} = \frac{(-1)^{k}k!}{x^{k + 1}}$ par récurrence. La formule de Leibniz (chapitre 9, théorème 9) donne 
    $$g^{(n)}(x) = \sum_{k = 0}^{n} \binom{n}{k} f^{(n - k)}(x)\,\frac{(-1)^{k}k!}{x^{k + 1}} = \frac{(-1)^{n}n!}{x^{n + 1}}\sum_{j = 0}^{n} \frac{f^{(j)}(x)}{j!}\,(-x)^{j},$$
     où l'on a posé $j = n - k$, puis utilisé $\binom{n}{k}k! = \frac{n!}{j!}$ et $(-1)^{k}x^{j} = (-1)^{n}(-x)^{j}$.

    *Formule de Taylor.* La dernière somme est le polynôme de Taylor de $f$ *au point $x$*, évalué en $0$, puisque $(-x)^{j} = (0 - x)^{j}$. La formule de Taylor avec reste intégral (théorème 7), entre $x$ et $0$, et l'hypothèse $f(0) = 0$ donnent donc 
    $$0 = f(0) = \sum_{j = 0}^{n} \frac{f^{(j)}(x)}{j!}\,(0 - x)^{j} + \int_{x}^{0} \frac{(0 - t)^{n}}{n!}\,f^{(n + 1)}(t)\,\mathrm{d} t,$$
     d'où $\sum_{j = 0}^{n} \frac{f^{(j)}(x)}{j!}(-x)^{j} = \frac{(-1)^{n}}{n!}\int_{0}^{x} t^{n}f^{(n + 1)}(t)\,\mathrm{d} t$. En reportant, les facteurs $(-1)^{n}n!$ se simplifient. 
    $$\boxed{g^{(n)}(x) = \frac{1}{x^{n + 1}}\int_{0}^{x} t^{n}f^{(n + 1)}(t)\,\mathrm{d} t \qquad (x \neq 0)}$$
     On a vérifié cette formule pour $f = \sin$, $x \mapsto \mathrm{e}^{x} - 1$ et $x \mapsto \ln(1 + x)$, pour $n \leqslant 3$, en $x = 0{,}7$ et en $x = -0{,}3$. ✓

    **3.** On compare $f^{(n + 1)}(t)$ à sa valeur en $0$. Comme $\int_{0}^{x} t^{n}\,\mathrm{d} t = \frac{x^{n + 1}}{n + 1}$, 
    $$g^{(n)}(x) - \frac{f^{(n + 1)}(0)}{n + 1} = \frac{1}{x^{n + 1}}\int_{0}^{x} t^{n}\big(f^{(n + 1)}(t) - f^{(n + 1)}(0)\big)\,\mathrm{d} t.$$
     Soit $\varepsilon > 0$. Par continuité de $f^{(n + 1)}$ en $0$, il existe $\delta > 0$ tel que $|f^{(n + 1)}(t) - f^{(n + 1)}(0)| \leqslant \varepsilon$ pour $|t| \leqslant \delta$. Pour $0 < |x| \leqslant \delta$, tout $t$ entre $0$ et $x$ vérifie $|t| \leqslant \delta$, et l'inégalité triangulaire, appliquée sur le segment d'extrémités $0$ et $x$, majore l'intégrale par $\varepsilon\,\frac{|x|^{n + 1}}{n + 1}$. Donc $\big|g^{(n)}(x) - \frac{f^{(n + 1)}(0)}{n + 1}\big| \leqslant \frac{\varepsilon}{n + 1}$. 
    $$\boxed{\lim_{x \to 0} g^{(n)}(x) = \frac{f^{(n + 1)}(0)}{n + 1}}$$

    **4.** On montre par récurrence sur $n$ que le prolongement de $g$ est de classe $\mathcal{C}^{n}$ sur $\mathbb{R}$, avec $g^{(n)}(0) = \frac{f^{(n + 1)}(0)}{n + 1}$. Pour $n = 0$, c'est la question 1. Supposons-le au rang $n$. La fonction $g^{(n)}$ est continue sur $\mathbb{R}$, dérivable sur $\mathbb{R}^{*}$, et sa dérivée $g^{(n + 1)}$ y admet la limite $\frac{f^{(n + 2)}(0)}{n + 2}$ en $0$, par la question 3. Le théorème de la limite de la dérivée (chapitre 9, théorème 8) montre que $g^{(n)}$ est dérivable en $0$, de dérivée cette limite, et que $g^{(n + 1)}$ est continue en $0$ ; elle l'est sur $\mathbb{R}^{*}$, où $g$ est de classe $\mathcal{C}^{\infty}$. Donc $g$ est de classe $\mathcal{C}^{n + 1}$ sur $\mathbb{R}$. 
    $$\boxed{g \in \mathcal{C}^{\infty}(\mathbb{R}), \qquad g^{(n)}(0) = \frac{f^{(n + 1)}(0)}{n + 1}}$$
     On retrouve les coefficients attendus : $\frac{g^{(n)}(0)}{n!} = \frac{f^{(n + 1)}(0)}{(n + 1)!}$ est bien le coefficient de $x^{n}$ dans le développement limité de $\frac{f(x)}{x}$ (chapitre 10). Pour $f = \sin$, on obtient que $x \mapsto \frac{\sin x}{x}$, prolongée par $1$, est de classe $\mathcal{C}^{\infty}$, avec $g''(0) = -\frac{1}{3}$. ✓

    *Piège.* La formule de Leibniz donne $g^{(n)}(x)$ comme une somme de termes qui, pris séparément, tendent vers l'infini en $0$ : l'erreur la plus répandue est d'en conclure que $g^{(n)}$ n'a pas de limite. Les termes se compensent, et c'est la formule de Taylor qui rend cette compensation visible, en remplaçant la somme par une intégrale de taille $|x|^{n + 1}$.
- id: "ma-18-38"
  feuille: "f-ma-18"
  numero: 38
  partie: "Sommes de Riemann et calcul approché"
  etoiles: 1
  types: [Calcul]
  mots_cles: [sommes de Riemann, "suites d'intégrales", logarithme et exponentielle]
  noeuds: [ri-sommes, ri-proprietes, su-convergence, ar-tfa]
  notions: [somme-riemann]
  page_enonce: 10
  page_corrige: 34
  enonce: |
    Déterminer les limites des suites de termes généraux suivants.

    **(a)** $\displaystyle\frac{1}{n}\sum_{k=0}^{n-1} \sin\frac{k\pi}{n}$

    **(b)** $\displaystyle\sum_{k=0}^{n-1} \frac{k}{n^{2} + k^{2}}$

    **(c)** $\displaystyle\frac{1}{n^{2}}\sum_{k=1}^{n} k\,\mathrm{e}^{-k/n}$

    **(d)** $\displaystyle\frac{1}{n^{2}}\sum_{k=1}^{n} \big(\ln(k^{k}) - \ln(n^{k})\big)$

    **(e)** $\displaystyle\frac{1}{n}\sum_{k=1}^{n} \cos^{2}\frac{k\pi}{n}$

    **(f)** $\displaystyle n\sum_{k=1}^{n} \frac{1}{(n + k)^{2}}$

    **(g)** $\displaystyle\frac{\sqrt{1} + \sqrt{2} + \cdots + \sqrt{n}}{n\sqrt{n}}$

    **(h)** $\displaystyle\sum_{k=1}^{n} \frac{1}{\sqrt{4n^{2} - k^{2}}}$

    **(i)** $\displaystyle\Big(\frac{n!}{n^{n}}\Big)^{1/n}$

    **(j)** $\displaystyle\Big(\prod_{k=1}^{n} \Big(1 + \frac{k^{2}}{n^{2}}\Big)\Big)^{1/n}$
  corrige: |
    On applique la méthode du cours : on met $\frac{1}{n}$ en facteur, on écrit le terme général sous la forme $g\big(\frac{k}{n}\big)$ pour une fonction $g$ indépendante de $n$, on lit l'intervalle sur les bornes de $k$, puis on conclut par le théorème 9. Lorsque $k$ va de $0$ à $n - 1$, on reconnaît $R_{n}(g)$ ; lorsqu'il va de $1$ à $n$, on reconnaît $R'_{n}(g)$ ; dans les deux cas, l'intervalle est $[0\,,1]$. Reste à calculer l'intégrale, et c'est là qu'il faut choisir une technique.

    **(a)** La somme vaut $R_{n}(g)$ pour $g(t) = \sin(\pi t)$, qui est continue. Une primitive est $-\frac{1}{\pi}\cos(\pi t)$. 
    $$\frac{1}{n}\sum_{k=0}^{n-1} \sin\frac{k\pi}{n} \xrightarrow[n \to +\infty]{} \int_{0}^{1} \sin(\pi t)\,\mathrm{d} t = \Big[-\frac{\cos(\pi t)}{\pi}\Big]_{0}^{1} = \boxed{\frac{2}{\pi}}$$
     C'est la valeur moyenne de $\sin$ sur une arche, environ $0{,}64$.

    **(b)** On divise numérateur et dénominateur par $n^{2}$ : $\frac{k}{n^{2} + k^{2}} = \frac{1}{n}\,\frac{k/n}{1 + (k/n)^{2}}$, et la somme est $R_{n}(g)$ avec $g(t) = \frac{t}{1 + t^{2}}$. L'intégrande est de la forme $\frac{1}{2}\frac{u'}{u}$, avec $u = 1 + t^{2}$ : 
    $$\sum_{k=0}^{n-1} \frac{k}{n^{2} + k^{2}} \xrightarrow[n \to +\infty]{} \int_{0}^{1} \frac{t\,\mathrm{d} t}{1 + t^{2}} = \Big[\frac{1}{2}\ln(1 + t^{2})\Big]_{0}^{1} = \boxed{\frac{\ln 2}{2}}$$

    **(c)** On écrit $\frac{1}{n^{2}}\,k\,\mathrm{e}^{-k/n} = \frac{1}{n}\,\frac{k}{n}\,\mathrm{e}^{-k/n}$ : c'est $R'_{n}(g)$ avec $g(t) = t\,\mathrm{e}^{-t}$. Pour l'intégrale, on intègre par parties (chapitre 6, proposition 4) : le facteur polynomial $t$ disparaît quand on le dérive, et $\mathrm{e}^{-t}$ a une primitive immédiate. 
    $$\int_{0}^{1} t\,\mathrm{e}^{-t}\,\mathrm{d} t = \big[-t\,\mathrm{e}^{-t}\big]_{0}^{1} + \int_{0}^{1} \mathrm{e}^{-t}\,\mathrm{d} t = -\mathrm{e}^{-1} + 1 - \mathrm{e}^{-1}, \qquad \text{d'où} \qquad \boxed{\lim = 1 - \frac{2}{\mathrm{e}}}$$

    **(d)** Comme $\ln(k^{k}) - \ln(n^{k}) = k\ln\frac{k}{n}$, le terme général est $\frac{1}{n}\sum_{k=1}^{n} \frac{k}{n}\ln\frac{k}{n} = R'_{n}(g)$, avec $g(t) = t\ln t$ pour $t > 0$ et $g(0) = 0$. Cette fonction est continue sur $[0\,,1]$, puisque $t\ln t$ tend vers $0$ en $0$ (croissances comparées), et le théorème 9 s'applique. Pour l'intégrale, on intègre par parties en dérivant $\ln t$ et en primitivant $t$ : pour $t > 0$, la fonction $G(t) = \frac{t^{2}}{2}\ln t - \frac{t^{2}}{4}$ vérifie $G' = g$. Pour $\varepsilon \in \,]0\,,1]$, on a donc $\int_{\varepsilon}^{1} g = G(1) - G(\varepsilon)$. Quand $\varepsilon$ tend vers $0$, le premier membre tend vers $\int_{0}^{1} g$ (la fonction $x \mapsto \int_{x}^{1} g$ est continue, par le théorème 6), et $G(\varepsilon)$ tend vers $0$. 
    $$\int_{0}^{1} t\ln t\,\mathrm{d} t = G(1) = \boxed{-\frac{1}{4}}$$
     *Piège.* L'intégrale est bien celle d'une fonction continue sur le segment $[0\,,1]$ : il ne s'agit pas d'une intégrale « impropre ». Mais on ne peut pas intégrer par parties directement sur $[0\,,1]$, puisque $\ln$ n'y est pas définie en $0$ : on passe par $[\varepsilon\,,1]$.

    **(e)** C'est $R'_{n}(g)$ avec $g(t) = \cos^{2}(\pi t)$. On linéarise : $\cos^{2}(\pi t) = \frac{1 + \cos(2\pi t)}{2}$, et le cosinus a une intégrale nulle sur la période $[0\,,1]$. 
    $$\frac{1}{n}\sum_{k=1}^{n} \cos^{2}\frac{k\pi}{n} \xrightarrow[n \to +\infty]{} \int_{0}^{1} \frac{1 + \cos(2\pi t)}{2}\,\mathrm{d} t = \boxed{\frac{1}{2}}$$

    **(f)** On factorise $n^{2}$ au dénominateur : $\frac{n}{(n + k)^{2}} = \frac{1}{n}\,\frac{1}{(1 + k/n)^{2}}$, et l'on reconnaît $R'_{n}(g)$ avec $g(t) = \frac{1}{(1 + t)^{2}}$, de primitive $-\frac{1}{1 + t}$. 
    $$n\sum_{k=1}^{n} \frac{1}{(n + k)^{2}} \xrightarrow[n \to +\infty]{} \Big[-\frac{1}{1 + t}\Big]_{0}^{1} = \boxed{\frac{1}{2}}$$

    **(g)** On divise chaque $\sqrt{k}$ par $\sqrt{n}$ : le terme général est $\frac{1}{n}\sum_{k=1}^{n} \sqrt{k/n} = R'_{n}(\sqrt{\cdot})$, la racine carrée étant continue sur $[0\,,1]$. 
    $$\frac{\sqrt{1} + \cdots + \sqrt{n}}{n\sqrt{n}} \xrightarrow[n \to +\infty]{} \int_{0}^{1} \sqrt{t}\,\mathrm{d} t = \boxed{\frac{2}{3}}$$
     Autrement dit, $\sum_{k=1}^{n} \sqrt{k} \sim \frac{2}{3}\,n^{3/2}$ : la somme se comporte comme l'intégrale $\int_{0}^{n} \sqrt{t}\,\mathrm{d} t$.

    **(h)** On factorise $n$ dans la racine : $\frac{1}{\sqrt{4n^{2} - k^{2}}} = \frac{1}{n}\,\frac{1}{\sqrt{4 - (k/n)^{2}}}$. La fonction $g(t) = \frac{1}{\sqrt{4 - t^{2}}}$ est continue sur $[0\,,1]$, et l'on reconnaît la dérivée de $\operatorname{Arcsin}\frac{t}{2}$. 
    $$\sum_{k=1}^{n} \frac{1}{\sqrt{4n^{2} - k^{2}}} \xrightarrow[n \to +\infty]{} \Big[\operatorname{Arcsin}\frac{t}{2}\Big]_{0}^{1} = \boxed{\frac{\pi}{6}}$$

    **(i)** Le cours ramène un produit à une somme par le logarithme : $\ln\Big(\frac{n!}{n^{n}}\Big)^{1/n} = \frac{1}{n}\sum_{k=1}^{n} \ln\frac{k}{n} = S_{n}$. On aimerait conclure que $S_{n}$ tend vers $\int_{0}^{1} \ln t\,\mathrm{d} t$, mais la fonction $\ln$, non bornée au voisinage de $0$, n'est pas continue par morceaux sur $[0\,,1]$ : le théorème 9 ne s'applique pas. On contourne la difficulté par un encadrement direct, en utilisant la croissance de $\ln$. Pour $1 \leqslant k \leqslant n - 1$ et $t \in \big[\frac{k}{n}\,,\frac{k + 1}{n}\big]$, on a $\ln\frac{k}{n} \leqslant \ln t \leqslant \ln\frac{k + 1}{n}$, donc, par croissance de l'intégrale, 
    $$\frac{1}{n}\ln\frac{k}{n} \leqslant \int_{k/n}^{(k + 1)/n} \ln t\,\mathrm{d} t \leqslant \frac{1}{n}\ln\frac{k + 1}{n}.$$
     On somme pour $k$ de $1$ à $n - 1$, avec la relation de Chasles, et l'on pose $J_{n} = \int_{1/n}^{1} \ln t\,\mathrm{d} t$. Comme le terme d'indice $n$ de $S_{n}$ est $\ln 1 = 0$, et celui d'indice $1$ vaut $-\frac{\ln n}{n}$, on obtient 
    $$S_{n} \leqslant J_{n} \leqslant S_{n} + \frac{\ln n}{n}, \qquad\text{soit}\qquad J_{n} - \frac{\ln n}{n} \leqslant S_{n} \leqslant J_{n}.$$
     Une primitive de $\ln$ est $t\ln t - t$ (chapitre 6), d'où $J_{n} = -1 + \frac{\ln n}{n} + \frac{1}{n}$, qui tend vers $-1$ par croissances comparées, de même que $J_{n} - \frac{\ln n}{n}$. Par encadrement, $S_{n} \to -1$, et par continuité de l'exponentielle : 
    $$\boxed{\Big(\frac{n!}{n^{n}}\Big)^{1/n} \xrightarrow[n \to +\infty]{} \frac{1}{\mathrm{e}}}$$
     La formule de Stirling (théorème 10) confirme ce résultat : $\frac{n!}{n^{n}} \sim \sqrt{2\pi n}\,\mathrm{e}^{-n}$, et $\frac{1}{n}\ln\big(\sqrt{2\pi n}\big) \to 0$. Numériquement, pour $n = 500$, l'encadrement donne $-0{,}998 \leqslant S_{500} \approx -0{,}992 \leqslant -0{,}986$ ✓.

    *Piège.* L'erreur la plus répandue est d'appliquer le théorème 9 à $\ln$ sur $[0\,,1]$ : le résultat est juste, mais le raisonnement ne l'est pas, faute de continuité par morceaux. L'encadrement par la monotonie est l'outil qui remplace le théorème quand la fonction n'est pas bornée au bord.

    **(j)** Le logarithme du terme général est $\frac{1}{n}\sum_{k=1}^{n} \ln\big(1 + \frac{k^{2}}{n^{2}}\big) = R'_{n}(g)$, avec $g(t) = \ln(1 + t^{2})$ continue sur $[0\,,1]$. On intègre par parties en dérivant le logarithme, qui devient une fraction rationnelle, et en primitivant $1$ en $t$ : 
    $$\int_{0}^{1} \ln(1 + t^{2})\,\mathrm{d} t = \big[t\ln(1 + t^{2})\big]_{0}^{1} - \int_{0}^{1} \frac{2t^{2}}{1 + t^{2}}\,\mathrm{d} t = \ln 2 - 2\int_{0}^{1} \Big(1 - \frac{1}{1 + t^{2}}\Big)\,\mathrm{d} t = \ln 2 - 2 + \frac{\pi}{2}.$$
     Par continuité de l'exponentielle, 
    $$\Big(\prod_{k=1}^{n}\Big(1 + \frac{k^{2}}{n^{2}}\Big)\Big)^{1/n} \xrightarrow[n \to +\infty]{} \mathrm{e}^{\ln 2 - 2 + \pi/2} = \boxed{2\,\mathrm{e}^{\pi/2 - 2} \approx 1{,}3021}$$
     Toutes ces limites ont été contrôlées numériquement pour $n = 4\,000$ ✓.
- id: "ma-18-39"
  feuille: "f-ma-18"
  numero: 39
  partie: "Sommes de Riemann et calcul approché"
  etoiles: 2
  types: [Calcul]
  mots_cles: [sommes de Riemann, "suites d'intégrales", logarithme et exponentielle]
  noeuds: [ri-sommes, ri-proprietes, su-convergence, ar-tfa]
  notions: [somme-riemann]
  page_enonce: 10
  page_corrige: 37
  enonce: |
    **1.** Déterminer les limites des suites de termes généraux suivants, en prenant garde à l'intervalle d'intégration. 
    $$\sum_{k=1}^{3n} \frac{n}{n^{2} + k^{2}}, \qquad \sum_{k=1}^{4n} \frac{1}{\sqrt{n^{2} + k^{2}}}, \qquad \frac{1}{n}\sum_{k=1}^{2n} \frac{2k}{n}\,\mathrm{e}^{1 + 3k/n}.$$

    **2.** Déterminer un équivalent simple de $\displaystyle\sum_{k=1}^{n} \frac{1}{n^{2} + k^{2}}$ et de $\displaystyle\sum_{k=n+1}^{2n} \frac{1}{k^{2}}$.
  corrige: |
    **1.** Dans les trois sommes, $k$ va jusqu'à $3n$, $4n$ ou $2n$ : les points $\frac{k}{n}$ parcourent $[0\,,3]$, $[0\,,4]$ ou $[0\,,2]$ avec le pas $\frac{1}{n}$. Sur $[0\,,c]$, avec $N = cn$ intervalles, le pas est $\frac{c}{N} = \frac{1}{n}$, et l'on reconnaît $R'_{N}(g) = \frac{1}{n}\sum_{k=1}^{cn} g\big(\frac{k}{n}\big)$, qui tend vers $\int_{0}^{c} g$ par le théorème 9.

    Pour la première somme, $\frac{n}{n^{2} + k^{2}} = \frac{1}{n}\,\frac{1}{1 + (k/n)^{2}}$ : 
    $$\sum_{k=1}^{3n} \frac{n}{n^{2} + k^{2}} \xrightarrow[n \to +\infty]{} \int_{0}^{3} \frac{\mathrm{d} t}{1 + t^{2}} = \boxed{\operatorname{Arctan} 3}$$
     Pour la deuxième, $\frac{1}{\sqrt{n^{2} + k^{2}}} = \frac{1}{n}\,\frac{1}{\sqrt{1 + (k/n)^{2}}}$. Une primitive de $\frac{1}{\sqrt{1 + t^{2}}}$ est $\ln\big(t + \sqrt{1 + t^{2}}\big)$, ce que l'on vérifie en dérivant : $\frac{1 + t/\sqrt{1 + t^{2}}}{t + \sqrt{1 + t^{2}}} = \frac{1}{\sqrt{1 + t^{2}}}$. 
    $$\sum_{k=1}^{4n} \frac{1}{\sqrt{n^{2} + k^{2}}} \xrightarrow[n \to +\infty]{} \Big[\ln\big(t + \sqrt{1 + t^{2}}\big)\Big]_{0}^{4} = \boxed{\ln\big(4 + \sqrt{17}\big)}$$
     La troisième est $R'_{2n}(g)$ sur $[0\,,2]$, avec $g(t) = 2t\,\mathrm{e}^{1 + 3t}$. On intègre par parties, en dérivant le facteur polynomial $2t$ et en primitivant l'exponentielle en $\frac{1}{3}\mathrm{e}^{1 + 3t}$ : 
    $$\int_{0}^{2} 2t\,\mathrm{e}^{1 + 3t}\,\mathrm{d} t = \Big[\frac{2t}{3}\,\mathrm{e}^{1 + 3t}\Big]_{0}^{2} - \frac{2}{3}\int_{0}^{2} \mathrm{e}^{1 + 3t}\,\mathrm{d} t = \frac{4}{3}\,\mathrm{e}^{7} - \frac{2}{9}\big(\mathrm{e}^{7} - \mathrm{e}\big),$$

    $$\frac{1}{n}\sum_{k=1}^{2n} \frac{2k}{n}\,\mathrm{e}^{1 + 3k/n} \xrightarrow[n \to +\infty]{} \boxed{\frac{2\mathrm{e}}{9}\big(1 + 5\mathrm{e}^{6}\big) \approx 1\,219{,}09}$$

    *Piège.* L'erreur la plus répandue, signalée dans le cours, est d'intégrer sur $[0\,,1]$ par réflexe. Le facteur devant la somme reste $\frac{1}{n}$, alors que la longueur de l'intervalle est $3$, $4$ ou $2$ : c'est le nombre de termes, $cn$, qui fixe l'intervalle.

    **2.** On fait apparaître une somme de Riemann en factorisant $n^{2}$ : 
    $$\sum_{k=1}^{n} \frac{1}{n^{2} + k^{2}} = \frac{1}{n}\cdot\frac{1}{n}\sum_{k=1}^{n} \frac{1}{1 + (k/n)^{2}},$$
     où le second facteur tend vers $\int_{0}^{1} \frac{\mathrm{d} t}{1 + t^{2}} = \frac{\pi}{4} \neq 0$. Une suite de limite finie non nulle $\ell$ est équivalente à $\ell$ (chapitre 10), d'où 
    $$\boxed{\sum_{k=1}^{n} \frac{1}{n^{2} + k^{2}} \sim \frac{\pi}{4n}}$$
     Pour la seconde somme, on pose $k = n + j$, avec $1 \leqslant j \leqslant n$ : 
    $$\sum_{k=n+1}^{2n} \frac{1}{k^{2}} = \sum_{j=1}^{n} \frac{1}{(n + j)^{2}} = \frac{1}{n}\cdot\frac{1}{n}\sum_{j=1}^{n} \frac{1}{(1 + j/n)^{2}}, \qquad \text{d'où} \qquad \boxed{\sum_{k=n+1}^{2n} \frac{1}{k^{2}} \sim \frac{1}{2n}}$$
     par l'exercice précédent, (f). Pour $n = 10\,000$, les rapports de chaque somme à son équivalent valent $0{,}99997$ et $0{,}99993$ ✓.

    *À retenir.* Une somme de Riemann donne une limite ; si cette limite est nulle, on cherche le bon facteur de normalisation. Ici, sans le facteur $n$, chaque somme tend vers $0$, et c'est le produit par $n$ qui tend vers une intégrale.
- id: "ma-18-40"
  feuille: "f-ma-18"
  numero: 40
  partie: "Sommes de Riemann et calcul approché"
  etoiles: 2
  types: [Calcul]
  mots_cles: [sommes de Riemann, "suites d'intégrales"]
  noeuds: [ri-sommes, ri-proprietes, su-convergence]
  notions: [somme-riemann]
  page_enonce: 10
  page_corrige: 38
  enonce: |
    Soit $f$, $g : [0\,,1] \to \mathbb{R}$ continues.

    **1.** Déterminer la limite de $\displaystyle S_{n} = \frac{1}{n^{2}}\sum_{1 \leqslant k, \ell \leqslant n} f\Big(\frac{k}{n}\Big)f\Big(\frac{\ell}{n}\Big)$, puis celle de $\displaystyle T_{n} = \frac{1}{n^{2}}\sum_{1 \leqslant k \leqslant \ell \leqslant n} f\Big(\frac{k}{n}\Big)f\Big(\frac{\ell}{n}\Big)$.

    **2.** Déterminer la limite de $\displaystyle\frac{1}{n}\sum_{k=0}^{n-1} f\Big(\frac{k}{n}\Big)\,g\Big(\frac{k + 1}{n}\Big)$. On pourra utiliser la continuité uniforme de $g$ (chapitre 8).
  corrige: |
    **1.** La somme double se factorise, puisque les indices $k$ et $\ell$ varient indépendamment : 
    $$S_{n} = \Big(\frac{1}{n}\sum_{k=1}^{n} f\Big(\frac{k}{n}\Big)\Big)\Big(\frac{1}{n}\sum_{\ell=1}^{n} f\Big(\frac{\ell}{n}\Big)\Big) = R'_{n}(f)^{2}.$$
     Par le théorème 9 et la continuité de $x \mapsto x^{2}$, 
    $$\boxed{S_{n} \xrightarrow[n \to +\infty]{} \Big(\int_{0}^{1} f\Big)^{2}}$$
     Pour $T_{n}$, on découpe le carré des indices en trois parties : $k < \ell$, $k > \ell$ et $k = \ell$. Les deux premières donnent la même somme, en échangeant les noms des indices. En notant $D_{n} = \sum_{k=1}^{n} f\big(\frac{k}{n}\big)^{2}$ la somme diagonale, on a donc $n^{2}S_{n} = 2\sum_{k < \ell} + D_{n}$ et $n^{2}T_{n} = \sum_{k < \ell} + D_{n}$, d'où 
    $$T_{n} = \frac{1}{2}\Big(S_{n} + \frac{D_{n}}{n^{2}}\Big).$$
     Or $\frac{D_{n}}{n^{2}} = \frac{1}{n}\,R'_{n}(f^{2})$, où $R'_{n}(f^{2})$ tend vers $\int_{0}^{1} f^{2}$ : ce terme tend vers $0$. 
    $$\boxed{T_{n} \xrightarrow[n \to +\infty]{} \frac{1}{2}\Big(\int_{0}^{1} f\Big)^{2}}$$
     *À retenir.* Le résultat est naturel : $T_{n}$ porte sur la moitié du carré $[0\,,1]^{2}$ découpé par sa diagonale, et la diagonale elle-même, qui ne contient que $n$ termes sur $n^{2}$, ne compte pas à la limite.

    **2.** La somme proposée n'est pas une somme de Riemann de $fg$, puisque $f$ et $g$ ne sont pas évaluées au même point. On la compare à $R_{n}(fg) = \frac{1}{n}\sum_{k=0}^{n-1} f\big(\frac{k}{n}\big)g\big(\frac{k}{n}\big)$, qui tend vers $\int_{0}^{1} fg$ par le théorème 9. Soit $M = \max_{[0, 1]} |f|$, qui existe par le théorème des bornes atteintes (chapitre 8, théorème 10), et $\varepsilon > 0$. La fonction $g$, continue sur un segment, y est uniformément continue (théorème de Heine, chapitre 8, théorème 12) : il existe $\delta > 0$ tel que $|g(x) - g(y)| \leqslant \varepsilon$ dès que $|x - y| \leqslant \delta$. Pour $n \geqslant \frac{1}{\delta}$, chacun des écarts $\big|g\big(\frac{k + 1}{n}\big) - g\big(\frac{k}{n}\big)\big|$ est au plus $\varepsilon$, donc 
    $$\Big|\frac{1}{n}\sum_{k=0}^{n-1} f\Big(\frac{k}{n}\Big)g\Big(\frac{k + 1}{n}\Big) - R_{n}(fg)\Big| \leqslant \frac{1}{n}\sum_{k=0}^{n-1} M\varepsilon = M\varepsilon.$$
     La différence tend vers $0$, et 
    $$\boxed{\frac{1}{n}\sum_{k=0}^{n-1} f\Big(\frac{k}{n}\Big)\,g\Big(\frac{k + 1}{n}\Big) \xrightarrow[n \to +\infty]{} \int_{0}^{1} f(t)g(t)\,\mathrm{d} t}$$
     On a contrôlé numériquement les trois limites avec $f(t) = \cos 3t + t$, $g = \exp$ et $n = 400$ ✓. C'est un cas particulier de la souplesse du théorème 9 : décaler un peu les points d'évaluation ne change pas la limite, et c'est la continuité uniforme qui le garantit.
- id: "ma-18-41"
  feuille: "f-ma-18"
  numero: 41
  partie: "Sommes de Riemann et calcul approché"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [sommes de Riemann, intégrales]
  noeuds: [ri-sommes, ri-proprietes]
  notions: [somme-riemann, fonction-convexe]
  page_enonce: 11
  page_corrige: 39
  enonce: |
    *Inégalité de Jensen intégrale.* Soit $f : [a\,,b] \to \mathbb{R}$ continue et $\varphi : \mathbb{R} \to \mathbb{R}$ continue et convexe. À l'aide de sommes de Riemann et de l'inégalité de Jensen du chapitre 9, démontrer que 
    $$\varphi\Big(\frac{1}{b - a}\int_{a}^{b} f(t)\,\mathrm{d} t\Big) \leqslant \frac{1}{b - a}\int_{a}^{b} \varphi\big(f(t)\big)\,\mathrm{d} t.$$
     Que donne cette inégalité pour $\varphi : x \mapsto x^{2}$, puis pour $\varphi = \exp$ ?
  corrige: |
    Pour $n \geqslant 1$, on note $x_{k} = a + k\,\frac{b - a}{n}$. L'inégalité de Jensen (chapitre 9, proposition 7), appliquée à $\varphi$ avec les points $f(x_{0})$, …, $f(x_{n-1})$ et les poids égaux $\lambda_{k} = \frac{1}{n}$, donne 
    $$\varphi\Big(\frac{1}{n}\sum_{k=0}^{n-1} f(x_{k})\Big) \leqslant \frac{1}{n}\sum_{k=0}^{n-1} \varphi\big(f(x_{k})\big), \qquad\text{soit}\qquad \varphi\Big(\frac{R_{n}(f)}{b - a}\Big) \leqslant \frac{R_{n}(\varphi \circ f)}{b - a}.$$
     Les fonctions $f$ et $\varphi \circ f$ sont continues sur $[a\,,b]$ : par le théorème 9, $R_{n}(f)$ et $R_{n}(\varphi \circ f)$ tendent vers leurs intégrales. Comme $\varphi$ est continue, le membre de gauche tend vers $\varphi\big(\frac{1}{b - a}\int_{a}^{b} f\big)$ (caractérisation séquentielle de la continuité, chapitre 8, théorème 7). On passe à la limite dans l'inégalité large (chapitre 7, théorème 5) : 
    $$\boxed{\varphi\Big(\frac{1}{b - a}\int_{a}^{b} f(t)\,\mathrm{d} t\Big) \leqslant \frac{1}{b - a}\int_{a}^{b} \varphi\big(f(t)\big)\,\mathrm{d} t}$$
     L'hypothèse de continuité de $\varphi$ a servi exactement à ce passage à la limite.

    Pour $\varphi : x \mapsto x^{2}$, convexe puisque $\varphi'' = 2 \geqslant 0$ (chapitre 9, théorème 11), on obtient, après multiplication par $(b - a)^{2}$, 
    $$\boxed{\Big(\int_{a}^{b} f\Big)^{2} \leqslant (b - a)\int_{a}^{b} f^{2}}$$
     C'est le cas particulier $g = 1$ de l'inégalité de Cauchy-Schwarz de l'exercice 15. Pour $\varphi = \exp$, également convexe, 
    $$\boxed{\exp\Big(\frac{1}{b - a}\int_{a}^{b} f\Big) \leqslant \frac{1}{b - a}\int_{a}^{b} \mathrm{e}^{f}}$$
     Pour $f(t) = t$ sur $[0\,,1]$, ces inégalités s'écrivent $\frac{1}{4} \leqslant \frac{1}{3}$ et $\mathrm{e}^{1/2} \approx 1{,}649 \leqslant \mathrm{e} - 1 \approx 1{,}718$ ✓.

    *À retenir.* En appliquant la dernière inégalité à $\ln h$, pour $h$ continue et strictement positive, on obtient $\exp\big(\frac{1}{b - a}\int_{a}^{b} \ln h\big) \leqslant \frac{1}{b - a}\int_{a}^{b} h$ : c'est l'inégalité entre moyenne géométrique et moyenne arithmétique, version continue de celle du chapitre 9. Les sommes de Riemann transportent ainsi toute inégalité sur des moyennes finies en une inégalité intégrale.
- id: "ma-18-42"
  feuille: "f-ma-18"
  numero: 42
  partie: "Sommes de Riemann et calcul approché"
  etoiles: 2
  types: [Calcul]
  mots_cles: [sommes de Riemann, intégrales, formule de Taylor, calcul approché, "suites d'intégrales"]
  noeuds: [ri-sommes, ri-proprietes, de-taylor, su-convergence]
  notions: [somme-riemann, polynome-taylor]
  page_enonce: 11
  page_corrige: 39
  enonce: |
    Soit $f : [0\,,1] \to \mathbb{R}$ de classe $\mathcal{C}^{2}$ et $I = \displaystyle\int_{0}^{1} f$. Déterminer la limite de 
    $$n\Big(I - \frac{1}{n}\sum_{k=0}^{n-1} f\Big(\frac{k}{n}\Big)\Big) = nI - \sum_{k=0}^{n-1} f\Big(\frac{k}{n}\Big).$$
     On pourra appliquer l'inégalité de Taylor-Lagrange à l'ordre $1$ sur chaque intervalle $\big[\frac{k}{n}\,,\frac{k + 1}{n}\big]$. Que retrouve-t-on sur la vitesse de convergence de la méthode des rectangles ?
  corrige: |
    On note $h = \frac{1}{n}$ et $x_{k} = kh$. Par la relation de Chasles, 
    $$nI - \sum_{k=0}^{n-1} f(x_{k}) = n\sum_{k=0}^{n-1} \int_{x_{k}}^{x_{k+1}} \big(f(t) - f(x_{k})\big)\,\mathrm{d} t.$$
     Soit $M_{2} = \max_{[0, 1]} |f''|$. L'inégalité de Taylor-Lagrange à l'ordre $1$ (théorème 8), en $x_{k}$, donne pour $t \in [x_{k}\,,x_{k+1}]$ 
    $$\big|f(t) - f(x_{k}) - f'(x_{k})(t - x_{k})\big| \leqslant M_{2}\,\frac{(t - x_{k})^{2}}{2}.$$
     On intègre sur $[x_{k}\,,x_{k+1}]$, avec $\int_{x_{k}}^{x_{k+1}} (t - x_{k})\,\mathrm{d} t = \frac{h^{2}}{2}$ et $\int_{x_{k}}^{x_{k+1}} \frac{(t - x_{k})^{2}}{2}\,\mathrm{d} t = \frac{h^{3}}{6}$ : 
    $$\Big|\int_{x_{k}}^{x_{k+1}} \big(f(t) - f(x_{k})\big)\,\mathrm{d} t - \frac{h^{2}}{2}\,f'(x_{k})\Big| \leqslant \frac{M_{2}h^{3}}{6}.$$
     En sommant ces $n$ inégalités et en multipliant par $n$, avec $h = \frac{1}{n}$, 
    $$\Big|nI - \sum_{k=0}^{n-1} f(x_{k}) - \frac{1}{2}\cdot\frac{1}{n}\sum_{k=0}^{n-1} f'(x_{k})\Big| \leqslant n \cdot n\,\frac{M_{2}}{6n^{3}} = \frac{M_{2}}{6n}.$$
     Le terme $\frac{1}{n}\sum_{k=0}^{n-1} f'(x_{k})$ est $R_{n}(f')$, qui tend vers $\int_{0}^{1} f' = f(1) - f(0)$ par le théorème 9, $f'$ étant continue. 
    $$\boxed{nI - \sum_{k=0}^{n-1} f\Big(\frac{k}{n}\Big) \xrightarrow[n \to +\infty]{} \frac{f(1) - f(0)}{2}}$$
     Pour $f = \exp$, la limite vaut $\frac{\mathrm{e} - 1}{2} \approx 0{,}85914$, et l'on calcule $0{,}84482$ pour $n = 10$, $0{,}85771$ pour $n = 100$ et $0{,}85900$ pour $n = 1\,000$ ✓.

    Ce résultat s'écrit $I - R_{n}(f) = \frac{f(1) - f(0)}{2n} + o\big(\frac{1}{n}\big)$. Si $f(1) \neq f(0)$, l'erreur de la méthode des rectangles est donc équivalente à $\frac{f(1) - f(0)}{2n}$ : elle est exactement d'ordre $\frac{1}{n}$, et la majoration en $\frac{1}{n}$ de la proposition 13 ne peut pas être améliorée en ordre de grandeur. Multiplier le nombre de points par $10$ ne fait gagner qu'une décimale, comme le montrait le tableau du cours.

    *À retenir.* Puisque $T_{n}(f) = \frac{R_{n}(f) + R'_{n}(f)}{2}$ et $R'_{n}(f) - R_{n}(f) = \frac{f(1) - f(0)}{n}$, on a exactement $T_{n}(f) = R_{n}(f) + \frac{f(1) - f(0)}{2n}$ : la méthode des trapèzes est la méthode des rectangles à laquelle on ajoute le terme correctif trouvé ici. C'est pourquoi son erreur est d'un ordre plus petit, en $\frac{1}{n^{2}}$ (proposition 14).
- id: "ma-18-43"
  feuille: "f-ma-18"
  numero: 43
  partie: "Sommes de Riemann et calcul approché"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [sommes de Riemann, "suites d'intégrales", logarithme et exponentielle]
  noeuds: [ri-sommes, ri-proprietes, su-convergence, ar-tfa]
  notions: [somme-riemann]
  page_enonce: 11
  page_corrige: 40
  enonce: |
    Soit $f : [0\,,1] \to \mathbb{R}$ continue. Déterminer la limite de 
    $$\prod_{k=1}^{n} \Big(1 + \frac{1}{n}\,f\Big(\frac{k}{n}\Big)\Big)$$
     quand $n$ tend vers $+\infty$. On pourra montrer que $|\ln(1 + u) - u| \leqslant 2u^{2}$ pour $|u| \leqslant \frac{1}{2}$.
  corrige: |
    On établit d'abord l'inégalité suggérée. La fonction $\psi : u \mapsto \ln(1 + u)$ est de classe $\mathcal{C}^{2}$ sur $\big[-\frac{1}{2}\,,\frac{1}{2}\big]$, avec $\psi(0) = 0$, $\psi'(0) = 1$ et $\psi''(u) = -\frac{1}{(1 + u)^{2}}$, donc $|\psi''(u)| \leqslant \frac{1}{(1/2)^{2}} = 4$. L'inégalité de Taylor-Lagrange à l'ordre $1$ en $0$ (théorème 8) donne 
    $$\boxed{|\ln(1 + u) - u| \leqslant 4\,\frac{u^{2}}{2} = 2u^{2} \qquad \text{pour } |u| \leqslant \frac{1}{2}}$$

    Soit $M = \max_{[0, 1]} |f|$, qui existe par le théorème des bornes atteintes, et $n \geqslant \max(1, 2M)$. Pour tout $k$, le nombre $u_{k} = \frac{1}{n}f\big(\frac{k}{n}\big)$ vérifie $|u_{k}| \leqslant \frac{M}{n} \leqslant \frac{1}{2}$ : tous les facteurs du produit $P_{n}$ sont strictement positifs, et l'on peut en prendre le logarithme. On compare alors $\ln P_{n} = \sum_{k=1}^{n} \ln(1 + u_{k})$ à $\sum_{k=1}^{n} u_{k} = R'_{n}(f)$ : 
    $$\big|\ln P_{n} - R'_{n}(f)\big| \leqslant \sum_{k=1}^{n} |\ln(1 + u_{k}) - u_{k}| \leqslant \sum_{k=1}^{n} 2u_{k}^{2} \leqslant n \cdot \frac{2M^{2}}{n^{2}} = \frac{2M^{2}}{n}.$$
     Ce majorant tend vers $0$, et $R'_{n}(f)$ tend vers $\int_{0}^{1} f$ par le théorème 9 : $\ln P_{n}$ tend vers $\int_{0}^{1} f$. Par continuité de l'exponentielle, 
    $$\boxed{\prod_{k=1}^{n}\Big(1 + \frac{1}{n}\,f\Big(\frac{k}{n}\Big)\Big) \xrightarrow[n \to +\infty]{} \exp\Big(\int_{0}^{1} f\Big)}$$
     Pour $f = 1$, on retrouve la limite $\big(1 + \frac{1}{n}\big)^{n} \to \mathrm{e}$ du chapitre 10. Pour $f(x) = x^{2}$, la limite est $\mathrm{e}^{1/3} \approx 1{,}39561$, et le produit vaut $1{,}39567$ pour $n = 10\,000$ ✓.

    *Piège.* Il ne suffit pas de dire que $\ln(1 + u_{k}) \sim u_{k}$ pour chaque $k$ : on somme $n$ termes, et $n$ erreurs « négligeables » peuvent ne pas l'être ensemble. C'est la majoration *uniforme* en $\frac{2M^{2}}{n^{2}}$, la même pour tous les $k$, qui permet de contrôler la somme des $n$ erreurs.
- id: "ma-18-44"
  feuille: "f-ma-18"
  numero: 44
  partie: "Sommes de Riemann et calcul approché"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [sommes de Riemann, intégrales, fonctions définies par une intégrale, "suites d'intégrales"]
  noeuds: [ri-sommes, ri-proprietes, ar-tfa, su-convergence]
  notions: [somme-riemann]
  page_enonce: 11
  page_corrige: 41
  enonce: |
    Soit $f : [a\,,b] \to \mathbb{R}$ continue, à valeurs strictement positives, et $I = \displaystyle\int_{a}^{b} f$.

    **1.** Montrer que $I > 0$.

    **2.** Soit $n \geqslant 1$. Montrer qu'il existe une unique subdivision $(x_{0}, x_{1}, \dots, x_{n})$ de $[a\,,b]$ telle que 
    $$\int_{x_{k-1}}^{x_{k}} f = \frac{I}{n} \qquad\text{pour tout } k \in [\![1\,;n]\!].$$
     Les réels $x_{k}$ dépendent de $n$ ; on les note $x_{n,k}$ lorsqu'il faut le préciser.

    **3.** Déterminer la limite de $\displaystyle\frac{1}{n}\sum_{k=0}^{n-1} f(x_{n,k})$ quand $n$ tend vers $+\infty$. On pourra exprimer $x_{n,k}$ à l'aide de la réciproque de la fonction $x \mapsto \int_{a}^{x} f$.
  corrige: |
    **1.** La fonction $f$ est continue, positive et non identiquement nulle, et $a < b$. Par la contraposée du théorème 4 : 
    $$\boxed{I = \int_{a}^{b} f > 0}$$
     On peut aussi dire que $f$ atteint un minimum $m > 0$, d'où $I \geqslant m(b - a) > 0$ par la proposition 7.

    **2.** On introduit $F : x \mapsto \int_{a}^{x} f$. Par le théorème 6, $F$ est de classe $\mathcal{C}^{1}$ et $F' = f > 0$ : elle est continue et strictement croissante sur $[a\,,b]$, avec $F(a) = 0$ et $F(b) = I$. Par le théorème de la bijection continue (chapitre 8, théorème 11), $F$ est une bijection de $[a\,,b]$ sur $[0\,,I]$, et sa réciproque $F^{-1}$ est continue.

    Soit $(x_{0}, \dots, x_{n})$ une subdivision de $[a\,,b]$, avec donc $x_{0} = a$. Par la relation de Chasles, 
    $$\int_{x_{k-1}}^{x_{k}} f = F(x_{k}) - F(x_{k-1}),$$
     et les $n$ conditions de l'énoncé équivalent, de proche en proche à partir de $F(x_{0}) = 0$, à $F(x_{k}) = \frac{kI}{n}$ pour tout $k \in [\![0\,;n]\!]$. Réciproquement, les réels $x_{k} = F^{-1}\big(\frac{kI}{n}\big)$ vérifient $x_{0} = a$, $x_{n} = F^{-1}(I) = b$, et ils sont strictement croissants puisque $F^{-1}$ l'est : ils forment une subdivision qui convient. 
    $$\boxed{\text{la subdivision existe et est unique : } x_{n,k} = F^{-1}\Big(\frac{kI}{n}\Big), \quad 0 \leqslant k \leqslant n}$$

    **3.** Par la question 2, 
    $$\frac{1}{n}\sum_{k=0}^{n-1} f(x_{n,k}) = \frac{1}{I}\cdot\frac{I}{n}\sum_{k=0}^{n-1} (f \circ F^{-1})\Big(0 + k\,\frac{I}{n}\Big) = \frac{1}{I}\,R_{n}(f \circ F^{-1}),$$
     où $R_{n}$ est la somme des rectangles sur le segment $[0\,,I]$. La fonction $f \circ F^{-1}$ est continue sur $[0\,,I]$, et le théorème 9 donne la limite $\frac{1}{I}\int_{0}^{I} f\big(F^{-1}(y)\big)\,\mathrm{d} y$. Pour calculer cette intégrale, on effectue le changement de variable $y = F(x)$ (chapitre 6, proposition 5) : c'est le changement naturel, puisqu'il fait disparaître la réciproque $F^{-1}$, et que $\mathrm{d} y = F'(x)\,\mathrm{d} x = f(x)\,\mathrm{d} x$ fait apparaître un second facteur $f$. La fonction $F$ est de classe $\mathcal{C}^{1}$ sur $[a\,,b]$, avec $F(a) = 0$ et $F(b) = I$ : 
    $$\int_{0}^{I} f\big(F^{-1}(y)\big)\,\mathrm{d} y = \int_{a}^{b} f\big(F^{-1}(F(x))\big)\,F'(x)\,\mathrm{d} x = \int_{a}^{b} f(x)^{2}\,\mathrm{d} x.$$

    $$\boxed{\frac{1}{n}\sum_{k=0}^{n-1} f(x_{n,k}) \xrightarrow[n \to +\infty]{} \frac{1}{I}\int_{a}^{b} f^{2}}$$
     Pour $f(x) = 1 + x$ sur $[0\,,1]$, on trouve $I = \frac{3}{2}$, $\int_{0}^{1} (1 + x)^{2}\,\mathrm{d} x = \frac{7}{3}$, et la limite vaut $\frac{14}{9} \approx 1{,}5556$ ; avec $x_{n,k} = -1 + \sqrt{1 + 3k/n}$, la moyenne calculée vaut $1{,}5551$ pour $n = 1\,000$ ✓.

    *À retenir.* Les points $x_{n,k}$ se resserrent là où $f$ est grande, puisque chaque intervalle porte la même aire. La moyenne des valeurs de $f$ en ces points dépasse donc la valeur moyenne de $f$ : en effet, par l'exercice 41 appliqué à $x \mapsto x^{2}$, $\frac{1}{I}\int_{a}^{b} f^{2} \geqslant \frac{I}{b - a}$. Sur l'exemple, $\frac{14}{9} \geqslant \frac{3}{2}$.
- id: "ma-18-45"
  feuille: "f-ma-18"
  numero: 45
  partie: "Sommes de Riemann et calcul approché"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [sommes de Riemann, intégrales, calcul approché, "suites d'intégrales"]
  noeuds: [ri-sommes, ri-proprietes, su-convergence]
  notions: [somme-riemann, fonction-convexe, derivee-successive]
  page_enonce: 11
  page_corrige: 42
  enonce: |
    *Inégalités de Hermite-Hadamard et méthode du point milieu.* Soit $f : [a\,,b] \to \mathbb{R}$ et $m = \frac{a + b}{2}$.

    **1.** On suppose $f$ continue et convexe. Montrer que 
    $$f(m) \leqslant \frac{1}{b - a}\int_{a}^{b} f \leqslant \frac{f(a) + f(b)}{2}.$$
     Pour l'inégalité de gauche, on pourra comparer $f(t)$ et $f(a + b - t)$ à $f(m)$.

    **2.** On suppose $f$ de classe $\mathcal{C}^{2}$, et l'on note $M_{2} = \max\limits_{[a, b]} |f''|$. Montrer que 
    $$\Big|\int_{a}^{b} f - (b - a)f(m)\Big| \leqslant M_{2}\,\frac{(b - a)^{3}}{24}.$$

    **3.** Pour $n \geqslant 1$, on note $x_{k} = a + k\,\frac{b - a}{n}$. En déduire que 
    $$\Big|\int_{a}^{b} f - \frac{b - a}{n}\sum_{k=0}^{n-1} f\Big(\frac{x_{k} + x_{k+1}}{2}\Big)\Big| \leqslant M_{2}\,\frac{(b - a)^{3}}{24n^{2}}.$$
     C'est la majoration de l'erreur de la méthode du point milieu, admise dans le cours.

    **4.** Montrer que, si $f$ est continue et convexe, la méthode du point milieu donne une valeur approchée par défaut de $\int_{a}^{b} f$, et celle des trapèzes une valeur approchée par excès.

    **5.** Pour $f(x) = \frac{4}{1 + x^{2}}$ sur $[0\,,1]$, calculer la valeur approchée de $\pi$ donnée par la méthode du point milieu avec $n = 4$, et la comparer à la valeur $T_{4}(f) \approx 3{,}1312$ donnée par la méthode des trapèzes dans le cours.
  corrige: |
    **1.** Pour l'inégalité de droite, on utilise la position de la courbe sous ses cordes (chapitre 9, proposition 9). Pour $t \in [a\,,b]$, la corde joignant les points d'abscisses $a$ et $b$ donne 
    $$f(t) \leqslant \frac{b - t}{b - a}\,f(a) + \frac{t - a}{b - a}\,f(b).$$
     On intègre sur $[a\,,b]$, avec $\int_{a}^{b} (b - t)\,\mathrm{d} t = \int_{a}^{b} (t - a)\,\mathrm{d} t = \frac{(b - a)^{2}}{2}$ : 
    $$\int_{a}^{b} f \leqslant \frac{b - a}{2}\big(f(a) + f(b)\big).$$
     Pour l'inégalité de gauche, on remarque que $m$ est le milieu de $t$ et de $a + b - t$. La convexité, avec les poids $\frac{1}{2}$ et $\frac{1}{2}$, donne 
    $$f(m) \leqslant \frac{f(t) + f(a + b - t)}{2} \qquad \text{pour tout } t \in [a\,,b].$$
     On intègre sur $[a\,,b]$. Le changement de variable affine $u = a + b - t$, qui échange $a$ et $b$, montre que $\int_{a}^{b} f(a + b - t)\,\mathrm{d} t = \int_{a}^{b} f(u)\,\mathrm{d} u$ : on obtient $(b - a)f(m) \leqslant \int_{a}^{b} f$. 
    $$\boxed{f(m) \leqslant \frac{1}{b - a}\int_{a}^{b} f \leqslant \frac{f(a) + f(b)}{2}}$$
     Géométriquement, l'aire sous la courbe est comprise entre celle du rectangle de hauteur $f(m)$, qui est aussi celle du trapèze limité par la tangente en $m$ quand $f$ est dérivable, et celle du trapèze limité par la corde.

    **2.** On applique l'inégalité de Taylor-Lagrange à l'ordre $1$ (théorème 8) en $m$ : pour tout $t \in [a\,,b]$, 
    $$\big|f(t) - f(m) - f'(m)(t - m)\big| \leqslant M_{2}\,\frac{(t - m)^{2}}{2}.$$
     On intègre sur $[a\,,b]$. Le terme du premier ordre disparaît, car $\int_{a}^{b} (t - m)\,\mathrm{d} t = 0$ par symétrie : c'est tout l'intérêt du point milieu. Par ailleurs, en notant $\ell = \frac{b - a}{2}$, 
    $$\int_{a}^{b} \frac{(t - m)^{2}}{2}\,\mathrm{d} t = \Big[\frac{(t - m)^{3}}{6}\Big]_{a}^{b} = \frac{2\ell^{3}}{6} = \frac{(b - a)^{3}}{24}.$$
     Par l'inégalité triangulaire (théorème 3 (iv)), 
    $$\boxed{\Big|\int_{a}^{b} f - (b - a)f(m)\Big| \leqslant M_{2}\,\frac{(b - a)^{3}}{24}}$$

    **3.** On applique la question 2 sur chaque segment $[x_{k}\,,x_{k+1}]$, de longueur $h = \frac{b - a}{n}$ et de milieu $m_{k} = \frac{x_{k} + x_{k+1}}{2}$, le réel $M_{2}$ majorant encore $|f''|$ sur ce segment. Par la relation de Chasles et l'inégalité triangulaire, 
    $$\Big|\int_{a}^{b} f - h\sum_{k=0}^{n-1} f(m_{k})\Big| \leqslant \sum_{k=0}^{n-1} \Big|\int_{x_{k}}^{x_{k+1}} f - hf(m_{k})\Big| \leqslant n\,\frac{M_{2}h^{3}}{24},$$

    $$\boxed{\Big|\int_{a}^{b} f - \frac{b - a}{n}\sum_{k=0}^{n-1} f\Big(\frac{x_{k} + x_{k+1}}{2}\Big)\Big| \leqslant M_{2}\,\frac{(b - a)^{3}}{24n^{2}}}$$
     C'est la majoration admise dans la deuxième remarque qui suit la proposition 14.

    **4.** On suppose $f$ convexe et, comme à la question 1, continue. On note $M_{n}(f)$ la somme du point milieu. L'inégalité de gauche de la question 1, sur chaque $[x_{k}\,,x_{k+1}]$, donne $hf(m_{k}) \leqslant \int_{x_{k}}^{x_{k+1}} f$ ; celle de droite donne $\int_{x_{k}}^{x_{k+1}} f \leqslant h\,\frac{f(x_{k}) + f(x_{k+1})}{2}$. En sommant, 
    $$\boxed{f \text{ convexe} \implies M_{n}(f) \leqslant \int_{a}^{b} f \leqslant T_{n}(f)}$$
     La méthode du point milieu donne une valeur par défaut, celle des trapèzes une valeur par excès. On retrouve, sans supposer $f$ de classe $\mathcal{C}^{2}$, la première remarque qui suit la proposition 14.

    **5.** Les milieux sont $\frac{1}{8}$, $\frac{3}{8}$, $\frac{5}{8}$ et $\frac{7}{8}$, et $f\big(\frac{j}{8}\big) = \frac{256}{64 + j^{2}}$, d'où 
    $$M_{4}(f) = \frac{1}{4}\sum_{k=0}^{3} f\Big(\frac{2k + 1}{8}\Big) = \frac{64}{65} + \frac{64}{73} + \frac{64}{89} + \frac{64}{113}, \qquad \boxed{M_{4}(f) \approx 3{,}146\,801}$$

    $$M_{4}(f) - \pi \approx +5{,}2 \times 10^{-3}, \qquad T_{4}(f) - \pi \approx 3{,}131\,176 - \pi \approx -1{,}04 \times 10^{-2}.$$
     L'erreur du point milieu est environ la moitié de celle des trapèzes, et de signe opposé, ce qu'annonçaient les constantes $\frac{1}{24}$ et $\frac{1}{12}$. Avec $M_{2} = \max_{[0, 1]} |f''| = 8$, la question 3 garantit une erreur au plus $\frac{8}{24 \times 16} \approx 2{,}1 \times 10^{-2}$, quatre fois plus que l'erreur réelle.

    *Piège.* La question 4 ne s'applique pas ici : $f''(x) = \frac{8(3x^{2} - 1)}{(1 + x^{2})^{3}}$ est négative sur $\big[0\,,\frac{1}{\sqrt{3}}\big]$, et $f$ n'est pas convexe sur $[0\,,1]$. Les signes observés, point milieu par excès et trapèzes par défaut, sont ceux d'une fonction concave, ce que $f$ est sur la plus grande partie de l'intervalle.

    *À retenir.* Les deux erreurs étant à peu près dans le rapport $-\frac{1}{2}$, la combinaison $\frac{2M_{4}(f) + T_{4}(f)}{3}$ les compense : elle vaut $3{,}141\,592\,50$, à $1{,}5 \times 10^{-7}$ de $\pi$, avec seulement neuf évaluations de $f$. C'est la méthode de Simpson, que l'on rencontrera en informatique.
- id: "ma-18-46"
  feuille: "f-ma-18"
  numero: 46
  partie: "Intégrales de Wallis et constante de Stirling"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [intégrales de Wallis, intégrales, "suites d'intégrales"]
  noeuds: [ri-proprietes, ar-tfa, su-convergence]
  notions: []
  page_enonce: 12
  page_corrige: 43
  enonce: |
    Pour tout $n \in \mathbb{N}$, on pose $\displaystyle a_{n} = \int_{0}^{1} t^{n}\sqrt{1 - t^{2}}\,\mathrm{d} t$.

    **1.** Calculer $a_{0}$ et $a_{1}$.

    **2.** Montrer que la suite $(a_{n})$ est monotone, puis convergente, et calculer sa limite.

    **3.** Montrer que $a_{n+2} = \dfrac{n + 1}{n + 4}\,a_{n}$ pour tout $n \in \mathbb{N}$.

    **4.** En s'inspirant de la démonstration de la proposition 15 du cours, en déduire un équivalent de $a_{n}$ quand $n$ tend vers $+\infty$.

    **5.** Retrouver ce résultat en exprimant $a_{n}$ à l'aide des intégrales de Wallis $W_{n}$.
  corrige: |
    **1.** Pour $a_{0} = \int_{0}^{1} \sqrt{1 - t^{2}}\,\mathrm{d} t$, on effectue le changement de variable $t = \sin\theta$, avec $\theta \in \big[0\,,\frac{\pi}{2}\big]$ (chapitre 6, proposition 5) : c'est le changement naturel devant $\sqrt{1 - t^{2}}$, qui devient $\sqrt{1 - \sin^{2}\theta} = \cos\theta$, positif sur cet intervalle. Avec $\mathrm{d} t = \cos\theta\,\mathrm{d}\theta$, 
    $$a_{0} = \int_{0}^{\pi/2} \cos^{2}\theta\,\mathrm{d}\theta = W_{2}, \qquad \boxed{a_{0} = \frac{\pi}{4}}$$
     par la proposition 15 (iii). C'est l'aire d'un quart de disque de rayon $1$. Pour $a_{1}$, l'intégrande $t\sqrt{1 - t^{2}}$ est de la forme $-\frac{1}{2}u'u^{1/2}$, avec $u = 1 - t^{2}$ : une primitive est $-\frac{1}{3}(1 - t^{2})^{3/2}$. 
    $$a_{1} = \Big[-\frac{1}{3}(1 - t^{2})^{3/2}\Big]_{0}^{1}, \qquad \boxed{a_{1} = \frac{1}{3}}$$

    **2.** Pour $t \in [0\,,1]$, on a $t^{n+1} \leqslant t^{n}$, donc $t^{n+1}\sqrt{1 - t^{2}} \leqslant t^{n}\sqrt{1 - t^{2}}$, et la croissance de l'intégrale donne $a_{n+1} \leqslant a_{n}$. La suite est décroissante, et minorée par $0$ par positivité : elle converge. Pour la limite, $\sqrt{1 - t^{2}} \leqslant 1$ donne 
    $$0 \leqslant a_{n} \leqslant \int_{0}^{1} t^{n}\,\mathrm{d} t = \frac{1}{n + 1}, \qquad\text{d'où}\qquad \boxed{(a_{n}) \text{ est décroissante et } \lim\limits_{n \to +\infty} a_{n} = 0}$$
     De plus, $a_{n} > 0$ par le théorème 4, l'intégrande étant continu, positif et non nul en $\frac{1}{2}$.

    **3.** On intègre par parties, pour abaisser l'exposant de $t$ : c'est la technique naturelle, comme pour les intégrales de Wallis, et le facteur $t\sqrt{1 - t^{2}}$ a une primitive explicite, trouvée à la question 1. On écrit $t^{n+2}\sqrt{1 - t^{2}} = t^{n+1} \cdot t\sqrt{1 - t^{2}}$, on dérive $t^{n+1}$ et l'on primitive $t\sqrt{1 - t^{2}}$ en $-\frac{1}{3}(1 - t^{2})^{3/2}$ : 
    $$a_{n+2} = \Big[-\frac{t^{n+1}(1 - t^{2})^{3/2}}{3}\Big]_{0}^{1} + \frac{n + 1}{3}\int_{0}^{1} t^{n}(1 - t^{2})\sqrt{1 - t^{2}}\,\mathrm{d} t = \frac{n + 1}{3}\,(a_{n} - a_{n+2}),$$
     le crochet étant nul aux deux bornes. On regroupe les termes en $a_{n+2}$ : $(n + 4)\,a_{n+2} = (n + 1)\,a_{n}$. 
    $$\boxed{a_{n+2} = \frac{n + 1}{n + 4}\,a_{n}}$$
     On contrôle avec $n = 0$ : $a_{2} = \frac{1}{4}\,a_{0} = \frac{\pi}{16}$, et l'on trouve bien $W_{2} - W_{4} = \frac{\pi}{4} - \frac{3\pi}{16} = \frac{\pi}{16}$ par la question 5 ci-dessous ✓.

    **4.** Dans la proposition 15, la relation de récurrence fait apparaître le produit constant $nW_{n}W_{n-1}$. On cherche ici l'analogue : posons $v_{n} = (n + 1)(n + 2)(n + 3)\,a_{n}a_{n+1}$. Par la question 3, 
    $$v_{n+1} = (n + 2)(n + 3)(n + 4)\,a_{n+1}a_{n+2} = (n + 2)(n + 3)(n + 4)\,a_{n+1}\,\frac{n + 1}{n + 4}\,a_{n} = v_{n}.$$
     La suite $(v_{n})$ est constante, égale à $v_{0} = 6\,a_{0}a_{1} = 6 \times \frac{\pi}{4} \times \frac{1}{3}$ : 
    $$\boxed{(n + 1)(n + 2)(n + 3)\,a_{n}a_{n+1} = \frac{\pi}{2}}$$
     Comme dans la démonstration du cours, on montre ensuite que $a_{n+1} \sim a_{n}$. Par décroissance, on a $a_{n+2} \leqslant a_{n+1} \leqslant a_{n}$ et, en divisant par $a_{n} > 0$, 
    $$\frac{n + 1}{n + 4} = \frac{a_{n+2}}{a_{n}} \leqslant \frac{a_{n+1}}{a_{n}} \leqslant 1.$$
     Par encadrement, $\frac{a_{n+1}}{a_{n}} \to 1$. Ainsi $\frac{\pi}{2} = (n + 1)(n + 2)(n + 3)\,a_{n}a_{n+1} \sim n^{3}a_{n}^{2}$, donc $n^{3}a_{n}^{2} \to \frac{\pi}{2}$ et, par continuité de la racine carrée, $n^{3/2}a_{n} \to \sqrt{\frac{\pi}{2}}$. 
    $$\boxed{a_{n} \sim \sqrt{\frac{\pi}{2}}\,\frac{1}{n^{3/2}}}$$
     Pour $n = 2\,000$, le rapport des deux membres vaut $0{,}9989$ ✓.

    **5.** Le même changement de variable qu'à la question 1, $t = \sin\theta$, transforme $t^{n}\sqrt{1 - t^{2}}\,\mathrm{d} t$ en $\sin^{n}\theta\cos^{2}\theta\,\mathrm{d}\theta$. Avec $\cos^{2} = 1 - \sin^{2}$ et la proposition 15 (ii), 
    $$a_{n} = \int_{0}^{\pi/2} \sin^{n}\theta\,(1 - \sin^{2}\theta)\,\mathrm{d}\theta = W_{n} - W_{n+2} = W_{n} - \frac{n + 1}{n + 2}\,W_{n}, \qquad \boxed{a_{n} = \frac{W_{n}}{n + 2}}$$
     On retrouve $a_{0} = \frac{W_{0}}{2} = \frac{\pi}{4}$ et $a_{1} = \frac{W_{1}}{3} = \frac{1}{3}$ ✓. Par la proposition 15 (v), $a_{n} \sim \frac{1}{n}\sqrt{\frac{\pi}{2n}} = \sqrt{\frac{\pi}{2}}\,n^{-3/2}$ : c'est l'équivalent de la question 4.

    *À retenir.* Les deux méthodes ont des rôles différents. La question 4 montre que le procédé du cours (récurrence, produit constant, décroissance) s'adapte à d'autres familles d'intégrales ; la question 5 montre qu'un changement de variable bien choisi ramène souvent une famille nouvelle à une famille connue.
- id: "ma-18-47"
  feuille: "f-ma-18"
  numero: 47
  partie: "Intégrales de Wallis et constante de Stirling"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [intégrales de Wallis, intégrales, "suites d'intégrales"]
  noeuds: [ri-proprietes, ar-tfa, su-convergence]
  notions: []
  page_enonce: 12
  page_corrige: 45
  enonce: |
    *Les intégrales de Wallis donnent la limite de $\sum_{k=1}^{n} \frac{1}{k^{2}}$.* Pour tout $n \in \mathbb{N}$, on pose 
    $$a_{n} = \int_{0}^{\pi/2} \cos^{n} t\,\mathrm{d} t \qquad\text{et}\qquad b_{n} = \int_{0}^{\pi/2} t^{2}\cos^{2n} t\,\mathrm{d} t.$$
     On rappelle que $a_{n}$ est l'intégrale de Wallis $W_{n}$ du cours, que $a_{n} > 0$ et que $(n + 2)\,a_{n+2} = (n + 1)\,a_{n}$.

    **1.** Montrer que $0 < b_{n} \leqslant \dfrac{\pi^{2}}{4}\,(a_{2n} - a_{2n+2})$ pour tout $n \in \mathbb{N}$, en comparant la courbe de $\sin$ à l'une de ses cordes sur $\big[0\,,\frac{\pi}{2}\big]$.

    **2.** En déduire que $\dfrac{b_{n}}{a_{2n}}$ tend vers $0$.

    **3.** Établir, pour tout $n \in \mathbb{N}$, les formules suivantes : 
    $$a_{2n+2} = (2n + 2)\int_{0}^{\pi/2} t\sin t\,\cos^{2n+1} t\,\mathrm{d} t, \qquad \frac{a_{2n+2}}{n + 1} = (2n + 1)\,b_{n} - (2n + 2)\,b_{n+1},$$

    $$2\Big(\frac{b_{n}}{a_{2n}} - \frac{b_{n+1}}{a_{2n+2}}\Big) = \frac{1}{(n + 1)^{2}}.$$

    **4.** En déduire que la suite de terme général $\displaystyle\sum_{k=1}^{n} \frac{1}{k^{2}}$ converge, et calculer sa limite.
  corrige: |
    **1.** L'intégrande $t^{2}\cos^{2n} t$ est continu, positif sur $\big[0\,,\frac{\pi}{2}\big]$, et non nul en $\frac{\pi}{4}$ : par le théorème 4, $b_{n} > 0$. Pour la majoration, on utilise la concavité de $\sin$ sur $\big[0\,,\frac{\pi}{2}\big]$, où $\sin'' = -\sin \leqslant 0$ (chapitre 9, théorème 11). La fonction $-\sin$ est convexe, et sa courbe est au-dessous de sa corde entre $0$ et $\frac{\pi}{2}$ (chapitre 9, proposition 9) : la courbe de $\sin$ est donc au-dessus de la corde joignant $(0, 0)$ à $\big(\frac{\pi}{2}, 1\big)$, et 
    $$\sin t \geqslant \frac{2}{\pi}\,t, \qquad\text{soit}\qquad t^{2} \leqslant \frac{\pi^{2}}{4}\sin^{2} t \qquad \text{pour } t \in \Big[0\,,\frac{\pi}{2}\Big].$$
     On multiplie par $\cos^{2n} t \geqslant 0$, on remplace $\sin^{2}$ par $1 - \cos^{2}$, et l'on intègre : 
    $$\boxed{0 < b_{n} \leqslant \frac{\pi^{2}}{4}\int_{0}^{\pi/2} \big(\cos^{2n} t - \cos^{2n+2} t\big)\,\mathrm{d} t = \frac{\pi^{2}}{4}\,(a_{2n} - a_{2n+2})}$$

    **2.** La relation rappelée, au rang $2n$, donne $a_{2n+2} = \frac{2n + 1}{2n + 2}\,a_{2n}$, donc $a_{2n} - a_{2n+2} = \frac{a_{2n}}{2n + 2}$. En divisant la question 1 par $a_{2n} > 0$, 
    $$0 < \frac{b_{n}}{a_{2n}} \leqslant \frac{\pi^{2}}{4}\cdot\frac{1}{2n + 2} = \frac{\pi^{2}}{8(n + 1)}, \qquad\text{d'où}\qquad \boxed{\frac{b_{n}}{a_{2n}} \xrightarrow[n \to +\infty]{} 0}$$

    **3.** On procède par deux intégrations par parties. Le but est de faire apparaître le facteur $t^{2}$ de $b_{n}$ à partir de $a_{2n+2}$, qui n'en contient pas : la technique naturelle est d'intégrer par parties en primitivant le facteur polynomial, $1$ puis $t$, ce qui augmente son degré, et en dérivant la puissance de $\cos$.

    *Première formule.* On écrit $a_{2n+2} = \int_{0}^{\pi/2} 1 \cdot \cos^{2n+2} t\,\mathrm{d} t$, on primitive $1$ en $t$ et l'on dérive $\cos^{2n+2} t$ en $-(2n + 2)\sin t\cos^{2n+1} t$. Le crochet $\big[t\cos^{2n+2} t\big]_{0}^{\pi/2}$ est nul : 
    $$\boxed{a_{2n+2} = (2n + 2)\int_{0}^{\pi/2} t\sin t\,\cos^{2n+1} t\,\mathrm{d} t}$$

    *Deuxième formule.* On intègre par parties $J = \int_{0}^{\pi/2} t \cdot \sin t\cos^{2n+1} t\,\mathrm{d} t$, en primitivant $t$ en $\frac{t^{2}}{2}$ et en dérivant $v(t) = \sin t\cos^{2n+1} t$ : 
    $$v'(t) = \cos^{2n+2} t - (2n + 1)\sin^{2} t\cos^{2n} t = (2n + 2)\cos^{2n+2} t - (2n + 1)\cos^{2n} t,$$
     en remplaçant $\sin^{2}$ par $1 - \cos^{2}$. Le crochet $\big[\frac{t^{2}}{2}\,v(t)\big]_{0}^{\pi/2}$ est nul, car $v(0) = 0$ et $\cos\frac{\pi}{2} = 0$. Donc 
    $$J = -\frac{1}{2}\int_{0}^{\pi/2} t^{2}\big((2n + 2)\cos^{2n+2} t - (2n + 1)\cos^{2n} t\big)\,\mathrm{d} t = \frac{1}{2}\big((2n + 1)\,b_{n} - (2n + 2)\,b_{n+1}\big).$$
     Avec la première formule, $a_{2n+2} = (2n + 2)J = (n + 1)\big((2n + 1)\,b_{n} - (2n + 2)\,b_{n+1}\big)$, soit 
    $$\boxed{\frac{a_{2n+2}}{n + 1} = (2n + 1)\,b_{n} - (2n + 2)\,b_{n+1}}$$

    *Troisième formule.* On divise la deuxième par $(n + 1)\,a_{2n+2} > 0$ : 
    $$\frac{1}{(n + 1)^{2}} = \frac{(2n + 1)\,b_{n}}{(n + 1)\,a_{2n+2}} - \frac{2\,b_{n+1}}{a_{2n+2}}.$$
     Or $a_{2n+2} = \frac{2n + 1}{2n + 2}\,a_{2n}$ donne $\frac{2n + 1}{(n + 1)\,a_{2n+2}} = \frac{2n + 1}{n + 1}\cdot\frac{2n + 2}{(2n + 1)\,a_{2n}} = \frac{2}{a_{2n}}$. Ainsi 
    $$\boxed{2\Big(\frac{b_{n}}{a_{2n}} - \frac{b_{n+1}}{a_{2n+2}}\Big) = \frac{1}{(n + 1)^{2}}}$$
     Les trois formules ont été contrôlées numériquement pour $n$ de $0$ à $4$ ✓.

    **4.** On somme la troisième formule pour $j$ allant de $0$ à $n - 1$ : la somme est télescopique. 
    $$\sum_{k=1}^{n} \frac{1}{k^{2}} = \sum_{j=0}^{n-1} \frac{1}{(j + 1)^{2}} = 2\Big(\frac{b_{0}}{a_{0}} - \frac{b_{n}}{a_{2n}}\Big).$$
     Or $b_{0} = \int_{0}^{\pi/2} t^{2}\,\mathrm{d} t = \frac{\pi^{3}}{24}$ et $a_{0} = \frac{\pi}{2}$, donc $\frac{b_{0}}{a_{0}} = \frac{\pi^{2}}{12}$, et $\frac{b_{n}}{a_{2n}} \to 0$ par la question 2. 
    $$\boxed{\sum_{k=1}^{n} \frac{1}{k^{2}} \xrightarrow[n \to +\infty]{} \frac{\pi^{2}}{6}}$$
     Pour $n = 10$, les deux membres de l'égalité télescopique valent $1{,}549\,77$ ✓, encore loin de la limite $\frac{\pi^{2}}{6} \approx 1{,}644\,93$. La question 2 donne même une vitesse : $0 < \frac{\pi^{2}}{6} - \sum_{k=1}^{n} \frac{1}{k^{2}} = \frac{2b_{n}}{a_{2n}} \leqslant \frac{\pi^{2}}{4(n + 1)}$.

    *À retenir.* Ce résultat, dû à Euler, est le premier exemple de ce que le chapitre 20 appellera la somme d'une série. La démonstration n'utilise que des outils de ce chapitre : positivité, comparaison à une corde, intégration par parties et la relation de récurrence de Wallis.
- id: "ma-18-48"
  feuille: "f-ma-18"
  numero: 48
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [fonctions en escalier, fonctions continues par morceaux, intégrales, fonctions définies par une intégrale, formule de Taylor, sommes de Riemann, calcul approché, fonctions à valeurs complexes]
  noeuds: [ri-escalier, ri-continues, ri-proprietes, ar-tfa, de-taylor, ri-sommes]
  notions: [fonction-escalier, continue-par-morceaux, polynome-taylor, somme-riemann, fonction-convexe]
  page_enonce: 13
  page_corrige: 46
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par une démonstration ou un contre-exemple.

    **1.** Une fonction bornée sur $[0\,,1]$, continue en tout point sauf en $0$, est continue par morceaux sur $[0\,,1]$.

    **2.** Si $f \in \mathcal{C}_{m}([a\,,b], \mathbb{R})$ est positive et d'intégrale nulle, alors $f$ est nulle sauf en un nombre fini de points.

    **3.** Si $f \in \mathcal{C}_{m}([0\,,1], \mathbb{R})$ et si la fonction $x \mapsto \int_{0}^{x} f$ est dérivable sur $[0\,,1]$, alors $f$ est continue sur $[0\,,1]$.

    **4.** Si $f$ est continue sur $[a\,,b]$ et si $\int_{a}^{b} f = 0$, alors $f$ s'annule au moins une fois sur $[a\,,b]$.

    **5.** Pour toute fonction $f : [0\,,1] \to \mathbb{C}$ de classe $\mathcal{C}^{1}$, $\displaystyle|f(1) - f(0)| \leqslant \int_{0}^{1} |f'|$.

    **6.** Si $f$ est continue sur $[0\,,1]$ et si $\int_{0}^{1} f = \int_{0}^{1} t\,f(t)\,\mathrm{d} t = 0$, alors $f$ est la fonction nulle.

    **7.** Pour toute fonction $f$ continue sur $[0\,,1]$, $\displaystyle\frac{1}{n}\sum_{k=0}^{n} f\Big(\frac{k}{n}\Big) \xrightarrow[n \to +\infty]{} \int_{0}^{1} f$, bien que la somme comporte $n + 1$ termes.

    **8.** Si $f$ est de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}$, alors, pour tout réel $x$, la suite des valeurs en $x$ des polynômes de Taylor de $f$ en $0$ converge vers $f(x)$.

    **9.** Si $f$ est continue sur $[0\,,1]$ et si $\int_{0}^{1} f\varphi = 0$ pour toute fonction en escalier $\varphi$ sur $[0\,,1]$, alors $f$ est la fonction nulle.

    **10.** Si $f$ est convexe et de classe $\mathcal{C}^{2}$ sur $[a\,,b]$, la méthode des trapèzes fournit une valeur approchée par excès de $\int_{a}^{b} f$.
  corrige: |
    **1. Faux.** La fonction $g$ définie par $g(0) = 0$ et $g(x) = \sin\frac{1}{x}$ pour $x \in \,]0\,,1]$ est bornée et continue en tout point sauf en $0$. Elle n'est pas continue par morceaux : sur tout intervalle $]0\,,x_{1}[$, elle n'a pas de limite en $0$, puisqu'elle y prend les valeurs $1$ et $-1$. C'est l'exemple du cours qui suit la proposition 2 : la définition exige des limites finies aux bords de chaque morceau, et pas seulement un nombre fini de discontinuités.

    **2. Vrai.** Soit $\sigma = (x_{0}, \dots, x_{n})$ une subdivision adaptée, et $f_{i}$ le morceau d'indice $i$, continu sur $[x_{i-1}\,,x_{i}]$ et positif comme limite de valeurs positives. Par la proposition 6, $\int_{x_{i-1}}^{x_{i}} f = \int_{x_{i-1}}^{x_{i}} f_{i} \geqslant 0$, et ces $n$ intégrales positives ont une somme nulle par la relation de Chasles : elles sont toutes nulles. Par le théorème 4, chaque $f_{i}$ est nulle, donc $f$ est nulle sur chaque $]x_{i-1}\,,x_{i}[$ : elle ne peut être non nulle qu'aux points $x_{i}$.

    **3. Faux.** Soit $f$ l'indicatrice de $\big\{\frac{1}{2}\big\}$ sur $[0\,,1]$, qui est en escalier. Par la proposition 6, $\int_{0}^{x} f = 0$ pour tout $x$ : la fonction $x \mapsto \int_{0}^{x} f$ est nulle, donc dérivable, alors que $f$ n'est pas continue en $\frac{1}{2}$. Sa dérivée, nulle, ne coïncide d'ailleurs pas avec $f$ en $\frac{1}{2}$ : le théorème 6 exige la continuité.

    **4. Vrai.** Par la proposition 7, il existe $c \in [a\,,b]$ tel que $f(c) = \frac{1}{b - a}\int_{a}^{b} f = 0$.

    **5. Vrai.** La fonction $f$ est une primitive de la fonction continue $f'$, donc $f(1) - f(0) = \int_{0}^{1} f'$ par le théorème 6, qui vaut pour $\mathbb{K} = \mathbb{C}$. L'inégalité triangulaire complexe (théorème 5) conclut. Le résultat est faux pour les fonctions seulement continues par morceaux : il exige que $f$ soit une primitive de $f'$.

    **6. Faux.** La fonction $f(t) = 6t^{2} - 6t + 1$ vérifie 
    $$\int_{0}^{1} f = 2 - 3 + 1 = 0 \qquad\text{et}\qquad \int_{0}^{1} t\,f(t)\,\mathrm{d} t = \frac{6}{4} - \frac{6}{3} + \frac{1}{2} = 0,$$
     sans être nulle. C'est la question 4 de l'exercice 14 : deux conditions d'orthogonalité forcent au moins deux changements de signe, mais pas la nullité.

    **7. Vrai.** La somme proposée vaut $R'_{n}(f) + \frac{f(0)}{n}$. Le premier terme tend vers $\int_{0}^{1} f$ par le théorème 9, et le second vers $0$. Un nombre fixé de termes supplémentaires, chacun de poids $\frac{1}{n}$, ne change pas la limite.

    **8. Faux.** La fonction plate $f$, égale à $\mathrm{e}^{-1/x}$ pour $x > 0$ et à $0$ pour $x \leqslant 0$, est de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}$, et toutes ses dérivées sont nulles en $0$ (exercice 30 du chapitre 9). Tous ses polynômes de Taylor en $0$ sont nuls, et leur valeur en $x = 1$ tend vers $0 \neq \mathrm{e}^{-1} = f(1)$. C'est la troisième remarque qui suit le théorème 8.

    **9. Vrai.** Pour $x \in \,]0\,,1]$, la fonction $\varphi$ égale à $1$ sur $[0\,,x]$ et à $0$ ailleurs est en escalier, et $\int_{0}^{1} f\varphi = \int_{0}^{x} f = 0$. La fonction $F : x \mapsto \int_{0}^{x} f$ est donc nulle sur $[0\,,1]$, et par le théorème 6, $f = F' = 0$.

    **10. Vrai.** La démonstration de la proposition 14 établit, sur chaque segment $[\alpha\,,\beta]$ de la subdivision, de longueur $h = \beta - \alpha$, l'égalité 
    $$\int_{\alpha}^{\beta} f - h\,\frac{f(\alpha) + f(\beta)}{2} = \int_{\alpha}^{\beta} \theta f'', \qquad \text{avec } \theta \leqslant 0.$$
     Si $f$ est convexe, $f'' \geqslant 0$, et cette quantité est négative : en sommant, $\int_{a}^{b} f \leqslant T_{n}(f)$. C'est aussi la question 4 de l'exercice 45, qui n'utilise que la position de la courbe sous ses cordes.

    $$\boxed{\text{Vrai : } 2, 4, 5, 7, 9, 10 ; \qquad \text{Faux : } 1, 3, 6, 8}$$
     *Piège.* Les assertions 2 et 3 opposent continuité et continuité par morceaux : une fonction continue par morceaux est « invisible » de l'intégrale en un nombre fini de points, ce qui rend la 2 vraie avec la restriction « sauf en un nombre fini de points » et la 3 fausse. L'assertion 8 rappelle que la formule de Taylor donne une égalité exacte, mais que le reste ne tend pas toujours vers $0$.
- id: "ma-18-49"
  feuille: "f-ma-18"
  numero: 49
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Algorithmique, Démonstration, Calcul]
  mots_cles: [intégrales, "suites d'intégrales", logarithme et exponentielle]
  noeuds: [ri-proprietes, su-convergence, ar-tfa]
  notions: []
  page_enonce: 13
  page_corrige: 48
  enonce: |
    *Une récurrence instable.* Pour tout $n \in \mathbb{N}$, on pose $\displaystyle I_{n} = \int_{0}^{1} \mathrm{e}^{x}(1 - x)^{n}\,\mathrm{d} x$.

    **1.** Calculer $I_{0}$, et montrer que $I_{n+1} = (n + 1)I_{n} - 1$ pour tout $n \in \mathbb{N}$.

    **2.** Écrire une fonction Python `I(n)` qui calcule $I_{n}$ à l'aide de cette relation, en partant de la valeur `math.e - 1`. Afficher les valeurs obtenues pour $n$ allant de $0$ à $25$ : que semble faire la suite ?

    **3.** Montrer que la suite $(I_{n})$ est décroissante et convergente, et préciser sa limite.

    **4.** Soit $\alpha$ un réel. On définit la suite $(J_{n})$ par $J_{0} = \alpha$ et $J_{n+1} = (n + 1)J_{n} - 1$. Montrer que $J_{n+1} - I_{n+1} = (n + 1)(J_{n} - I_{n})$ pour tout $n$, et exprimer $J_{n} - I_{n}$ en fonction de $n$ et de $\alpha$.

    **5.** En déduire le comportement de $(J_{n})$ selon la valeur de $\alpha$, et expliquer l'observation de la deuxième question.
  corrige: |
    **1.** On a $I_{0} = \int_{0}^{1} \mathrm{e}^{x}\,\mathrm{d} x$, soit $\boxed{I_{0} = \mathrm{e} - 1}$. Pour la relation, on intègre par parties : c'est la technique naturelle, puisque le facteur polynomial $(1 - x)^{n+1}$ perd un degré quand on le dérive, et que $\mathrm{e}^{x}$ est sa propre primitive. On dérive $(1 - x)^{n+1}$ en $-(n + 1)(1 - x)^{n}$ : 
    $$I_{n+1} = \big[\mathrm{e}^{x}(1 - x)^{n+1}\big]_{0}^{1} + (n + 1)\int_{0}^{1} \mathrm{e}^{x}(1 - x)^{n}\,\mathrm{d} x = (0 - 1) + (n + 1)I_{n}.$$

    $$\boxed{I_{n+1} = (n + 1)\,I_{n} - 1}$$
     En particulier $I_{1} = \mathrm{e} - 2$.

    **2.** Voici une fonction possible, qui applique la relation $n$ fois à partir de $I_{0}$.

    ```python
    import math

    def I(n):
        v = math.e - 1              # valeur flottante de I_0
        for k in range(n):          # passage de I_k a I_(k+1)
            v = (k + 1) * v - 1
        return v

    for n in range(26):
        print(n, I(n))
    ```

    Le tableau compare quelques valeurs affichées aux valeurs exactes, calculées en précision étendue.

    4pt 

    ```tableau
    $n$ ¦ $0$ ¦ $5$ ¦ $10$ ¦ $15$ ¦ $16$ ¦ $17$ ¦ $18$ ¦ $20$ ¦ $25$
    \texttt{I(n)} ¦ $1{,}718\,28$ ¦ $0{,}193\,82$ ¦ $0{,}099\,11$ ¦ $0{,}066\,20$ ¦ $0{,}059\,25$ ¦ $0{,}007\,21$ ¦ $-0{,}870$ ¦ $-351{,}7$ ¦ $-2{,}24 \times 10^{9}$
    $I_{n}$ ¦ $1{,}718\,28$ ¦ $0{,}193\,82$ ¦ $0{,}099\,11$ ¦ $0{,}066\,39$ ¦ $0{,}062\,27$ ¦ $0{,}058\,63$ ¦ $0{,}055\,39$ ¦ $0{,}049\,88$ ¦ $0{,}039\,94$
    ```

    La suite semble d'abord décroître vers $0$, puis, vers $n = 17$, elle devient brutalement négative et part vers $-\infty$ : à $n = 25$, elle vaut environ $-2{,}24 \times 10^{9}$. 
    $$\boxed{\text{les valeurs calculées décroissent jusqu'à } n \approx 16, \text{ puis divergent vers } -\infty}$$

    **3.** Pour $x \in [0\,,1]$, on a $0 \leqslant (1 - x)^{n+1} \leqslant (1 - x)^{n}$, d'où $I_{n+1} \leqslant I_{n}$ par croissance de l'intégrale. De plus $1 \leqslant \mathrm{e}^{x} \leqslant \mathrm{e}$, donc 
    $$0 < \frac{1}{n + 1} = \int_{0}^{1} (1 - x)^{n}\,\mathrm{d} x \leqslant I_{n} \leqslant \mathrm{e}\int_{0}^{1} (1 - x)^{n}\,\mathrm{d} x = \frac{\mathrm{e}}{n + 1}.$$

    $$\boxed{(I_{n}) \text{ est décroissante, } \frac{1}{n + 1} \leqslant I_{n} \leqslant \frac{\mathrm{e}}{n + 1}, \text{ et } \lim\limits_{n \to +\infty} I_{n} = 0}$$
     En particulier $I_{n} > 0$ pour tout $n$ : les valeurs négatives affichées à la question 2 sont fausses.

    **4.** En soustrayant les relations $J_{n+1} = (n + 1)J_{n} - 1$ et $I_{n+1} = (n + 1)I_{n} - 1$, le terme constant disparaît : 
    $$J_{n+1} - I_{n+1} = (n + 1)(J_{n} - I_{n}).$$
     Par récurrence immédiate, à partir de $J_{0} - I_{0} = \alpha - (\mathrm{e} - 1)$, 
    $$\boxed{J_{n} - I_{n} = n!\,\big(\alpha - (\mathrm{e} - 1)\big)}$$

    **5.** Comme $I_{n} \to 0$ et $n! \to +\infty$, la question 4 donne : 
    $$\boxed{\alpha = \mathrm{e} - 1 : \ J_{n} = I_{n} \to 0 ; \quad \alpha > \mathrm{e} - 1 : \ J_{n} \to +\infty ; \quad \alpha < \mathrm{e} - 1 : \ J_{n} \to -\infty}$$
     L'ordinateur ne connaît pas $\mathrm{e} - 1$, mais seulement un nombre flottant voisin $\alpha$, avec ici 
    $$\alpha - (\mathrm{e} - 1) \approx -1{,}45 \times 10^{-16}.$$
     La fonction `I` calcule donc $J_{n}$, et non $I_{n}$ : l'erreur initiale est multipliée par $n!$. On calcule 
    $$18! \times (-1{,}45 \times 10^{-16}) \approx -0{,}93 \qquad\text{et}\qquad 25! \times (-1{,}45 \times 10^{-16}) \approx -2{,}24 \times 10^{9} :$$
     le signe change donc vers $n = 18$, et la valeur affichée pour $n = 25$ est exactement celle de l'erreur. Les erreurs d'arrondi commises à chaque étape s'ajoutent, mais elles sont multipliées par des facteurs plus petits, et c'est l'erreur initiale qui domine.

    *À retenir.* Une relation de récurrence exacte peut être inutilisable numériquement : il faut regarder comment elle propage les erreurs. Ici, il suffit de la parcourir à l'envers, $I_{n} = \frac{I_{n+1} + 1}{n + 1}$, ce qui *divise* l'erreur par $n + 1$ à chaque étape : en partant de la valeur grossière $I_{60} \approx 0$, on obtient $I_{25}$ avec toutes ses décimales, $0{,}039\,938\,729\,673\ldots$ C'est l'encadrement de la question 3 qui garantit la limite que l'ordinateur ne voyait pas.
- id: "ma-18-50"
  feuille: "f-ma-18"
  numero: 50
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [intégrales, logarithme et exponentielle]
  noeuds: [ri-proprietes, ar-tfa]
  notions: []
  page_enonce: 14
  page_corrige: 49
  enonce: |
    *Une formule de quadrature exacte.* Soit $n \in \mathbb{N}$.

    **1.** Montrer qu'il existe un unique $(n + 1)$-uplet $(\lambda_{0}, \dots, \lambda_{n}) \in \mathbb{R}^{n+1}$ tel que, pour tout polynôme $P \in \mathbb{R}_{n}[X]$, 
    $$\int_{1}^{3} P(\sin t)\,\mathrm{e}^{-t^{3}}\,\mathrm{d} t = \sum_{k=0}^{n} \lambda_{k}\,P\big(\operatorname{sh}(k)\big).$$
     On pourra utiliser les polynômes interpolateurs de Lagrange (chapitre 13).

    **2.** Pour $n \geqslant 2$, existe-t-il encore de tels réels $\lambda_{k}$ si l'on remplace les points $\operatorname{sh}(k)$ par les points $\cos(k\pi)$ ?
  corrige: |
    **1.** La fonction $\operatorname{sh}$ est strictement croissante : les $n + 1$ réels $s_{k} = \operatorname{sh}(k)$, pour $0 \leqslant k \leqslant n$, sont deux à deux distincts. On note $L_{0}$, …, $L_{n}$ les polynômes interpolateurs de Lagrange associés (chapitre 13, théorème 13) : $L_{k} \in \mathbb{R}_{n}[X]$ et $L_{k}(s_{j})$ vaut $1$ si $j = k$ et $0$ sinon. Tout $P \in \mathbb{R}_{n}[X]$ s'écrit alors $P = \sum_{k=0}^{n} P(s_{k})\,L_{k}$, par l'unicité dans le théorème 13, puisque les deux membres sont dans $\mathbb{R}_{n}[X]$ et prennent les mêmes valeurs aux $n + 1$ points $s_{k}$.

    *Existence.* Pour $P \in \mathbb{R}_{n}[X]$, la linéarité de l'intégrale donne 
    $$\int_{1}^{3} P(\sin t)\,\mathrm{e}^{-t^{3}}\,\mathrm{d} t = \sum_{k=0}^{n} P(s_{k})\int_{1}^{3} L_{k}(\sin t)\,\mathrm{e}^{-t^{3}}\,\mathrm{d} t.$$
     *Unicité.* Si $(\mu_{0}, \dots, \mu_{n})$ convient aussi, on applique la formule à $P = L_{j}$ : le second membre vaut $\sum_{k} \mu_{k}L_{j}(s_{k}) = \mu_{j}$, et le premier est le même pour les deux familles. 
    $$\boxed{\lambda_{k} = \int_{1}^{3} L_{k}(\sin t)\,\mathrm{e}^{-t^{3}}\,\mathrm{d} t, \qquad L_{k} = \prod_{j \neq k} \frac{X - \operatorname{sh}(j)}{\operatorname{sh}(k) - \operatorname{sh}(j)}}$$
     On a contrôlé numériquement, pour $n = 2$, que ces réels donnent la valeur exacte de l'intégrale pour $P = 1$, $X$ et $3X^{2} - X + 2$ ✓.

    **2.** Les points $\cos(k\pi) = (-1)^{k}$ ne prennent que les deux valeurs $1$ et $-1$. Pour $n \geqslant 2$, le polynôme $P = X^{2} - 1$ appartient à $\mathbb{R}_{n}[X]$ et s'annule en tous ces points : le second membre est nul quels que soient les $\lambda_{k}$. Le premier membre vaut 
    $$\int_{1}^{3} (\sin^{2} t - 1)\,\mathrm{e}^{-t^{3}}\,\mathrm{d} t = -\int_{1}^{3} \cos^{2} t\,\mathrm{e}^{-t^{3}}\,\mathrm{d} t < 0,$$
     par le théorème 4, l'intégrande $\cos^{2} t\,\mathrm{e}^{-t^{3}}$ étant continu, positif et non nul en $2$. Numériquement, il vaut environ $-0{,}0136$. 
    $$\boxed{\text{non : pour } n \geqslant 2, \text{ aucune famille } (\lambda_{k}) \text{ ne convient avec les points } \cos(k\pi)}$$
     *À retenir.* L'intégrale compliquée $\int_{1}^{3} P(\sin t)\,\mathrm{e}^{-t^{3}}\,\mathrm{d} t$ est une forme linéaire sur $\mathbb{R}_{n}[X]$, et l'on vient de l'écrire comme combinaison des $n + 1$ évaluations aux points $s_{k}$ : c'est le principe de toutes les formules de quadrature. La seule chose qui compte est que les points soient distincts ; la méthode du point milieu et celle des trapèzes en sont des cas où les poids sont explicites.
- id: "ma-18-51"
  feuille: "f-ma-18"
  numero: 51
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [intégrales, logarithme et exponentielle, fonctions à valeurs complexes]
  noeuds: [ri-proprietes, ar-tfa]
  notions: []
  page_enonce: 14
  page_corrige: 50
  enonce: |
    *Une intégrale calculée par un produit.* Soit $\theta$ un réel différent de $1$ et de $-1$.

    **1.** Pour $t$ réel, factoriser dans $\mathbb{C}[X]$ le polynôme $X^{2} - 2X\cos t + 1$.

    **2.** On pose $f(t) = \ln(1 - 2\theta\cos t + \theta^{2})$.

    **(a)** Montrer que $f$ est bien définie et continue sur $[0\,,2\pi]$.

    **(b)** Pour $n \geqslant 1$, calculer $\displaystyle\sum_{k=0}^{n-1} f\Big(\frac{2k\pi}{n}\Big)$. On pourra utiliser la factorisation de $X^{n} - 1$ dans $\mathbb{C}[X]$.

    **(c)** En déduire la valeur de $\displaystyle\int_{0}^{2\pi} \ln(1 - 2\theta\cos t + \theta^{2})\,\mathrm{d} t$, en distinguant les cas $|\theta| < 1$ et $|\theta| > 1$.
  corrige: |
    **1.** Les nombres $\mathrm{e}^{\mathrm{i} t}$ et $\mathrm{e}^{-\mathrm{i} t}$ ont pour somme $2\cos t$ et pour produit $1$. Ce sont donc les racines du polynôme unitaire de degré $2$ de l'énoncé. 
    $$\boxed{X^{2} - 2X\cos t + 1 = \big(X - \mathrm{e}^{\mathrm{i} t}\big)\big(X - \mathrm{e}^{-\mathrm{i} t}\big)}$$

    **2. (a)** Par la question 1, avec $X = \theta$ réel, et comme $\mathrm{e}^{-\mathrm{i} t} = \overline{\mathrm{e}^{\mathrm{i} t}}$, 
    $$1 - 2\theta\cos t + \theta^{2} = \big(\theta - \mathrm{e}^{\mathrm{i} t}\big)\overline{\big(\theta - \mathrm{e}^{\mathrm{i} t}\big)} = \big|\theta - \mathrm{e}^{\mathrm{i} t}\big|^{2}.$$
     Ce nombre est positif, et il est nul si et seulement si $\theta = \mathrm{e}^{\mathrm{i} t}$, ce qui imposerait $|\theta| = 1$ avec $\theta$ réel, c'est-à-dire $\theta = \pm 1$, cas exclus. Donc $1 - 2\theta\cos t + \theta^{2} > 0$ pour tout $t$, et $f$, composée de fonctions continues, est continue sur $[0\,,2\pi]$. 
    $$\boxed{1 - 2\theta\cos t + \theta^{2} = \big|\theta - \mathrm{e}^{\mathrm{i} t}\big|^{2} > 0}$$

    **(b)** Soit $\omega = \mathrm{e}^{2\mathrm{i}\pi/n}$. Par la question précédente, $f\big(\frac{2k\pi}{n}\big) = \ln|\theta - \omega^{k}|^{2}$, et la somme des logarithmes est le logarithme du produit : 
    $$\sum_{k=0}^{n-1} f\Big(\frac{2k\pi}{n}\Big) = \ln\Big|\prod_{k=0}^{n-1} (\theta - \omega^{k})\Big|^{2}.$$
     Par la factorisation $X^{n} - 1 = \prod_{k=0}^{n-1} (X - \omega^{k})$ (chapitre 13, proposition 17), évaluée en $\theta$, le produit vaut $\theta^{n} - 1$, qui n'est pas nul car $\theta \neq \pm 1$. 
    $$\boxed{\sum_{k=0}^{n-1} f\Big(\frac{2k\pi}{n}\Big) = 2\ln|\theta^{n} - 1|}$$
     Pour $\theta = 0{,}7$ et $n = 7$, les deux membres valent $-0{,}1704$ ✓.

    **(c)** On ne connaît pas de primitive de $f$ : on calcule l'intégrale comme limite de sommes de Riemann. La fonction $f$ est continue sur $[0\,,2\pi]$, et la somme des rectangles de pas $\frac{2\pi}{n}$ est, par (b), 
    $$R_{n}(f) = \frac{2\pi}{n}\sum_{k=0}^{n-1} f\Big(\frac{2k\pi}{n}\Big) = \frac{4\pi}{n}\ln|\theta^{n} - 1|,$$
     qui tend vers $\int_{0}^{2\pi} f$ par le théorème 9.

    • Si $|\theta| < 1$, alors $\theta^{n} \to 0$ et $\ln|\theta^{n} - 1| \to 0$ : $R_{n}(f) \to 0$.

    • Si $|\theta| > 1$, on factorise : $\ln|\theta^{n} - 1| = n\ln|\theta| + \ln|1 - \theta^{-n}|$, où le second terme tend vers $0$. Donc $R_{n}(f) = 4\pi\ln|\theta| + \frac{4\pi}{n}\ln|1 - \theta^{-n}| \to 4\pi\ln|\theta|$.

    $$\boxed{\int_{0}^{2\pi} \ln(1 - 2\theta\cos t + \theta^{2})\,\mathrm{d} t = \begin{cases} 0 & \text{si } |\theta| < 1 \\ 4\pi\ln|\theta| & \text{si } |\theta| > 1 \end{cases}}$$
     Une intégration numérique confirme ces valeurs pour $\theta = 0{,}5$, $-0{,}3$, $2$ et $-3$ ✓. Les deux cas sont cohérents entre eux : en remplaçant $\theta$ par $\frac{1}{\theta}$, l'intégrande devient $f(t) - 2\ln|\theta|$, et l'intégrale diminue de $4\pi\ln|\theta|$.

    *À retenir.* Ici, la somme de Riemann n'est pas une approximation de l'intégrale : c'est elle qu'on sait calculer exactement, grâce à l'algèbre des racines de l'unité, et le théorème 9 transfère le résultat à l'intégrale. C'est le chemin inverse de celui de la méthode des rectangles.
- id: "ma-18-52"
  feuille: "f-ma-18"
  numero: 52
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [intégrales]
  noeuds: [ri-proprietes]
  notions: []
  page_enonce: 14
  page_corrige: 51
  enonce: |
    *Le nombre $\pi$ est irrationnel.* On suit ici une démonstration publiée par Ivan Niven en 1947. On suppose par l'absurde que $\pi = \frac{a}{b}$, avec $a$ et $b$ entiers naturels non nuls, et l'on pose, pour tout $n \in \mathbb{N}$, 
    $$P_{n}(X) = \frac{X^{n}(a - bX)^{n}}{n!}.$$

    **1.** Montrer que, pour tous $k$ et $n$ dans $\mathbb{N}$, les nombres $P_{n}^{(k)}(0)$ et $P_{n}^{(k)}(\pi)$ sont des entiers. On pourra remarquer que $P_{n}(\pi - X) = P_{n}(X)$.

    **2.** Montrer que $\displaystyle I_{n} = \int_{0}^{\pi} P_{n}(t)\sin t\,\mathrm{d} t$ est un entier.

    **3.** Montrer que $I_{n} > 0$.

    **4.** Trouver une constante $\xi > 0$ telle que $I_{n} \leqslant \pi\,\dfrac{\xi^{n}}{n!}$ pour tout $n$.

    **5.** En déduire une contradiction. Qu'a-t-on démontré ?

    Les quatre derniers exercices sont des problèmes à traiter en autonomie : l'énoncé fixe le but, et c'est à vous de trouver le chemin.
  corrige: |
    **1.** Comme $a = b\pi$, on a $a - bX = b(\pi - X)$, donc $P_{n} = \frac{b^{n}}{n!}\,X^{n}(\pi - X)^{n}$, expression visiblement inchangée quand on remplace $X$ par $\pi - X$ : 
    $$\boxed{P_{n}(\pi - X) = P_{n}(X)}$$
     *En $0$.* Par la formule du binôme, $P_{n} = \frac{1}{n!}\sum_{j=0}^{n} \binom{n}{j}a^{n-j}(-b)^{j}X^{n+j}$ : les monômes ont des degrés compris entre $n$ et $2n$. Comme $P_{n}^{(k)}(0) = k!\,c_{k}$, où $c_{k}$ est le coefficient de $X^{k}$ (chapitre 13, théorème 6), on obtient $P_{n}^{(k)}(0) = 0$ si $k < n$ ou $k > 2n$, et, pour $k = n + j$ avec $0 \leqslant j \leqslant n$, 
    $$P_{n}^{(k)}(0) = \frac{k!}{n!}\binom{n}{j}a^{n-j}(-b)^{j},$$
     qui est un entier, puisque $\frac{k!}{n!} = (n + 1)(n + 2)\cdots k$ en est un.

    *En $\pi$.* On dérive $k$ fois l'égalité $P_{n}(\pi - x) = P_{n}(x)$ : $(-1)^{k}P_{n}^{(k)}(\pi - x) = P_{n}^{(k)}(x)$. En $x = 0$, $P_{n}^{(k)}(\pi) = (-1)^{k}P_{n}^{(k)}(0)$. 
    $$\boxed{P_{n}^{(k)}(0) \in \mathbb{Z} \quad\text{et}\quad P_{n}^{(k)}(\pi) = (-1)^{k}P_{n}^{(k)}(0) \in \mathbb{Z} \quad \text{pour tous } k, n}$$
     *Piège.* Le facteur $\frac{1}{n!}$ semble empêcher les coefficients d'être entiers, et ils ne le sont pas. Ce sont les *dérivées* en $0$ qui le sont : la $k$-ième dérivée multiplie le coefficient par $k!$, qui est divisible par $n!$ puisque seuls les degrés $k \geqslant n$ apparaissent.

    **2.** On procède par intégrations par parties répétées : c'est la technique naturelle, puisque $P_{n}$ est un polynôme, dont les dérivées successives finissent par s'annuler, alors que $\sin$ et $\cos$ ont des primitives immédiates. Pour un polynôme $Q$ quelconque, deux intégrations par parties, en dérivant $Q$ puis $Q'$, donnent 
    $$\int_{0}^{\pi} Q\sin = \big[-Q\cos\big]_{0}^{\pi} + \int_{0}^{\pi} Q'\cos = Q(\pi) + Q(0) + \big[Q'\sin\big]_{0}^{\pi} - \int_{0}^{\pi} Q''\sin = Q(0) + Q(\pi) - \int_{0}^{\pi} Q''\sin.$$
     On applique cette relation à $Q = P_{n}$, puis à $P_{n}''$, …, jusqu'à $P_{n}^{(2n)}$. Comme $P_{n}$ est de degré $2n$, $P_{n}^{(2n+2)} = 0$, et il reste 
    $$I_{n} = \sum_{j=0}^{n} (-1)^{j}\big(P_{n}^{(2j)}(0) + P_{n}^{(2j)}(\pi)\big).$$
     Par la question 1, c'est une somme d'entiers : $\boxed{I_{n} \in \mathbb{Z}}$.

    **3.** Sur $]0\,,\pi[$, on a $t > 0$, $a - bt = b(\pi - t) > 0$ et $\sin t > 0$ : l'intégrande $P_{n}(t)\sin t$ est continu, positif sur $[0\,,\pi]$, et non nul en $\frac{\pi}{2}$. Par le théorème 4, $\boxed{I_{n} > 0}$.

    **4.** Pour $t \in [0\,,\pi]$, on a $0 \leqslant t \leqslant \pi$ et $0 \leqslant a - bt \leqslant a$, donc on a $0 \leqslant t(a - bt) \leqslant \pi a$ et $0 \leqslant P_{n}(t)\sin t \leqslant \frac{(\pi a)^{n}}{n!}$. Par l'inégalité de la moyenne (proposition 7), sur un intervalle de longueur $\pi$ : 
    $$\boxed{I_{n} \leqslant \pi\,\frac{\xi^{n}}{n!} \qquad \text{avec } \xi = \pi a}$$
     On peut faire mieux : le maximum de $t(a - bt) = bt(\pi - t)$ est atteint en $\frac{\pi}{2}$ et vaut $\frac{b\pi^{2}}{4} = \frac{\pi a}{4}$, mais toute constante convient pour la suite.

    **5.** Par croissances comparées (chapitre 7, théorème 7), $\frac{\xi^{n}}{n!} \to 0$. Il existe donc un rang $n$ tel que $\pi\,\frac{\xi^{n}}{n!} < 1$, et pour ce rang, $I_{n}$ est un entier tel que $0 < I_{n} < 1$, ce qui est impossible. L'hypothèse $\pi = \frac{a}{b}$ est donc fausse. 
    $$\boxed{\pi \text{ est irrationnel}}$$
     *À retenir.* La structure est celle de la démonstration de l'irrationalité de $\mathrm{e}$ dans le cours (proposition 12) : une quantité construite à partir de l'hypothèse est un entier, elle est strictement positive, et elle est trop petite pour l'être. La positivité stricte (théorème 4) est indispensable : sans elle, on aurait seulement $I_{n} = 0$, ce qui n'est pas contradictoire.

    Les quatre derniers exercices sont des problèmes en autonomie ; le corrigé commence par l'idée directrice.
- id: "ma-18-53"
  feuille: "f-ma-18"
  numero: 53
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [intégrales]
  noeuds: [ri-proprietes]
  notions: []
  page_enonce: 14
  page_corrige: 52
  enonce: |
    Soit $a < b$. Montrer que, pour tout $\varepsilon > 0$, il existe un réel $D > 0$ tel que, pour toute fonction $f : [a\,,b] \to \mathbb{R}$ de classe $\mathcal{C}^{1}$, 
    $$\max_{[a, b]} f^{2} \leqslant D\int_{a}^{b} f^{2} + \varepsilon\int_{a}^{b} f'^{2}.$$
     On pourra commencer par majorer $|f(x)^{2} - f(a)^{2}|$ pour $x \in [a\,,b]$.
  corrige: |
    *Idée.* La différence $f(x)^{2} - f(y)^{2}$ est l'intégrale de $(f^{2})' = 2ff'$. On sépare le produit $|f|\,|f'|$ par l'inégalité $2uv \leqslant \frac{u^{2}}{\varepsilon} + \varepsilon v^{2}$, puis on fait la moyenne en $y$ pour remplacer $f(y)^{2}$ par une intégrale.

    Soit $\varepsilon > 0$ et $f$ de classe $\mathcal{C}^{1}$ sur $[a\,,b]$. Pour tous réels $u$, $v$, on a $0 \leqslant \big(\frac{u}{\sqrt{\varepsilon}} - \sqrt{\varepsilon}\,v\big)^{2}$, c'est-à-dire 
    $$2uv \leqslant \frac{u^{2}}{\varepsilon} + \varepsilon v^{2}.$$
     Soit $x$, $y \in [a\,,b]$. La fonction $f^{2}$ est de classe $\mathcal{C}^{1}$, de dérivée $2ff'$, donc, par le théorème 6 et l'inégalité triangulaire, 
    $$f(x)^{2} - f(y)^{2} = \int_{y}^{x} 2f(t)f'(t)\,\mathrm{d} t \leqslant \int_{a}^{b} 2|f|\,|f'| \leqslant \frac{1}{\varepsilon}\int_{a}^{b} f^{2} + \varepsilon\int_{a}^{b} f'^{2}.$$
     Le cas $y = a$ est l'indication de l'énoncé. On fixe $x$ et l'on intègre cette inégalité par rapport à $y$ sur $[a\,,b]$, puis l'on divise par $b - a$ : 
    $$f(x)^{2} \leqslant \frac{1}{b - a}\int_{a}^{b} f^{2} + \frac{1}{\varepsilon}\int_{a}^{b} f^{2} + \varepsilon\int_{a}^{b} f'^{2}.$$
     Le second membre ne dépend pas de $x$, et $f^{2}$ atteint son maximum sur le segment $[a\,,b]$ : 
    $$\boxed{\max_{[a, b]} f^{2} \leqslant D\int_{a}^{b} f^{2} + \varepsilon\int_{a}^{b} f'^{2}, \qquad D = \frac{1}{b - a} + \frac{1}{\varepsilon}}$$
     La constante $D$ ne dépend que de $a$, $b$ et $\varepsilon$, et pas de $f$, comme l'exige l'énoncé. On a contrôlé l'inégalité sur des fonctions trigonométriques et polynomiales aléatoires, pour $\varepsilon = 0{,}01$ et $\varepsilon = 0{,}5$ ✓.

    *Piège.* Le terme $\varepsilon\int f'^{2}$ ne peut pas être supprimé : aucune inégalité $\max f^{2} \leqslant D\int_{a}^{b} f^{2}$ n'est vraie pour toutes les $f$. Pour $f_{k}(x) = \mathrm{e}^{-k(x - a)}$, on a $\max f_{k}^{2} = 1$, alors que $\int_{a}^{b} f_{k}^{2} \leqslant \frac{1}{2k}$ tend vers $0$. Une fonction peut avoir une intégrale de $f^{2}$ minuscule et un maximum élevé, à condition de varier vite ; c'est ce que mesure $\int f'^{2}$, qui vaut ici environ $\frac{k}{2}$.

    *À retenir.* Le prix à payer pour un petit coefficient $\varepsilon$ devant $\int f'^{2}$ est un grand coefficient $D$, de l'ordre de $\frac{1}{\varepsilon}$, devant $\int f^{2}$. Ce type d'inégalité, qui contrôle les valeurs d'une fonction par des intégrales de la fonction et de sa dérivée, est fondamental en analyse ; il complète l'exercice 54 du chapitre 9, où $f'$ était contrôlée par $f$ et $f''$.
- id: "ma-18-54"
  feuille: "f-ma-18"
  numero: 54
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [intégrales]
  noeuds: [ri-proprietes]
  notions: []
  page_enonce: 15
  page_corrige: 53
  enonce: |
    Soit $f : [0\,,1] \to [0\,,1]$ une fonction de classe $\mathcal{C}^{1}$ dont la dérivée est croissante. On appelle *longueur* de la courbe de $f$ le réel 
    $$L = \int_{0}^{1} \sqrt{1 + f'(x)^{2}}\,\mathrm{d} x.$$
     Montrer que $L < 3$, puis que le nombre $3$ ne peut pas être remplacé par un nombre plus petit.
  corrige: |
    *Idée.* On majore $\sqrt{1 + u^{2}}$ par $1 + |u|$, ce qui ramène $L$ à $1 + \int_{0}^{1} |f'|$. Comme $f'$ est croissante, elle change de signe au plus une fois : $f$ descend puis remonte, et chaque trajet vertical est au plus $1$. Pour l'optimalité, on prend des fonctions $|2x - 1|^{p}$, dont la courbe ressemble de plus en plus à un chemin en forme de « V » plat, qui longe le bord inférieur puis les deux bords verticaux du carré.

    *Majoration.* Pour tout réel $u$, $(1 + |u|)^{2} = 1 + 2|u| + u^{2} \geqslant 1 + u^{2}$, avec égalité si et seulement si $u = 0$ ; donc $\sqrt{1 + u^{2}} \leqslant 1 + |u|$, et l'inégalité est stricte pour $u \neq 0$. Ainsi $L \leqslant 1 + \int_{0}^{1} |f'|$. Montrons que $\int_{0}^{1} |f'| \leqslant 2$, en distinguant trois cas selon le signe de $f'$, qui est continue et croissante.

    • Si $f'(0) \geqslant 0$, alors $f' \geqslant 0$ sur $[0\,,1]$, et $\int_{0}^{1} |f'| = f(1) - f(0) \leqslant 1$, puisque $f$ est à valeurs dans $[0\,,1]$.

    • Si $f'(1) \leqslant 0$, de même $\int_{0}^{1} |f'| = f(0) - f(1) \leqslant 1$.

    • Sinon, $f'(0) < 0 < f'(1)$, et le théorème des valeurs intermédiaires fournit $c$ tel que $f'(c) = 0$. Par croissance, $f' \leqslant 0$ sur $[0\,,c]$ et $f' \geqslant 0$ sur $[c\,,1]$, d'où 
    $$\int_{0}^{1} |f'| = -\int_{0}^{c} f' + \int_{c}^{1} f' = \big(f(0) - f(c)\big) + \big(f(1) - f(c)\big) \leqslant 1 + 1.$$

    Dans tous les cas, $L \leqslant 3$. Pour l'inégalité stricte, la fonction $g = 1 + |f'| - \sqrt{1 + f'^{2}}$ est continue et positive. Si $f'$ n'est pas identiquement nulle, $g$ ne l'est pas, et $\int_{0}^{1} g > 0$ par le théorème 4, d'où $L < 1 + \int_{0}^{1} |f'| \leqslant 3$. Si $f' = 0$, alors $L = 1 < 3$. 
    $$\boxed{L < 3}$$

    *Optimalité.* Pour $p \geqslant 2$, la fonction $f_{p}(x) = |2x - 1|^{p}$ est à valeurs dans $[0\,,1]$, de classe $\mathcal{C}^{1}$, de dérivée $f_{p}'(x) = 2p\,|2x - 1|^{p-1}$ pour $x \geqslant \frac{1}{2}$ et $-2p\,|2x - 1|^{p-1}$ pour $x \leqslant \frac{1}{2}$, qui est croissante. Par la symétrie $x \mapsto 1 - x$, puis par le changement de variable $u = 2x - 1$ sur $\big[\frac{1}{2}\,,1\big]$, 
    $$L_{p} = 2\int_{1/2}^{1} \sqrt{1 + 4p^{2}(2x - 1)^{2p - 2}}\,\mathrm{d} x = \int_{0}^{1} \sqrt{1 + 4p^{2}u^{2p - 2}}\,\mathrm{d} u.$$
     Soit $\delta \in \,]0\,,1[$. On minore l'intégrande par $1$ sur $[0\,,\delta]$, et par $2pu^{p-1}$ sur $[\delta\,,1]$ : 
    $$L_{p} \geqslant \delta + \int_{\delta}^{1} 2pu^{p-1}\,\mathrm{d} u = \delta + 2\big(1 - \delta^{p}\big).$$
     Soit $M < 3$. On choisit $\delta \in \,]0\,,1[$ tel que $2 + \delta > M$ ; comme $\delta^{p} \to 0$ quand $p \to +\infty$, on a $2 + \delta - 2\delta^{p} > M$ pour $p$ assez grand, et donc $L_{p} > M$. 
    $$\boxed{\sup L = 3 : \text{ le nombre } 3 \text{ ne peut pas être remplacé par un nombre plus petit}}$$
     Numériquement, $L_{2} \approx 2{,}323$, $L_{10} \approx 2{,}701$, $L_{100} \approx 2{,}945$ et $L_{1000} \approx 2{,}992$ ✓.

    *À retenir.* La borne $3$ n'est jamais atteinte, mais elle est approchée : c'est une borne supérieure, pas un maximum. Elle se lit sur la figure du chemin limite, qui parcourt un côté vertical de longueur $1$, puis le côté inférieur, de longueur $1$, puis l'autre côté vertical. Une courbe de pente croissante, prisonnière du carré, ne peut pas être plus longue que ce chemin.
- id: "ma-18-55"
  feuille: "f-ma-18"
  numero: 55
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [intégrales, logarithme et exponentielle, fonctions à valeurs complexes]
  noeuds: [ri-proprietes, ar-tfa]
  notions: [multiplicite-racine]
  page_enonce: 15
  page_corrige: 54
  enonce: |
    Soit $P \in \mathbb{C}[X]$ un polynôme non nul qui n'admet aucune racine de module $1$. Montrer que 
    $$\frac{1}{2\pi}\int_{0}^{2\pi} \frac{\mathrm{e}^{\mathrm{i} x}\,P'(\mathrm{e}^{\mathrm{i} x})}{P(\mathrm{e}^{\mathrm{i} x})}\,\mathrm{d} x$$
     est égal au nombre de racines de $P$ de module strictement inférieur à $1$, comptées avec leur multiplicité.
  corrige: |
    *Idée.* On décompose $\frac{P'}{P}$ en somme de termes $\frac{m_{j}}{X - a_{j}}$, ce qui ramène le problème au calcul de $\frac{1}{2\pi}\int_{0}^{2\pi} \frac{\mathrm{e}^{\mathrm{i} x}}{\mathrm{e}^{\mathrm{i} x} - a}\,\mathrm{d} x$ pour un seul complexe $a$ de module différent de $1$. On écrit ce quotient comme une somme géométrique finie, plus un reste que l'on majore, et l'on utilise $\int_{0}^{2\pi} \mathrm{e}^{\mathrm{i} kx}\,\mathrm{d} x = 0$ pour $k$ entier non nul.

    Si $P$ est constant, $P' = 0$, l'intégrale est nulle et $P$ n'a pas de racine : le résultat est vrai. Sinon, $P$ est scindé dans $\mathbb{C}[X]$ (chapitre 13, proposition 16) : $P = \lambda(X - a_{1})^{m_{1}}\cdots(X - a_{r})^{m_{r}}$, avec des $a_{j}$ distincts, et par hypothèse $|a_{j}| \neq 1$. La décomposition de la dérivée logarithmique (chapitre 13, proposition 24), évaluée en un point $z$ qui n'est pas racine, donne $\frac{P'(z)}{P(z)} = \sum_{j=1}^{r} \frac{m_{j}}{z - a_{j}}$. Avec $z = \mathrm{e}^{\mathrm{i} x}$, la linéarité de l'intégrale donne 
    $$\frac{1}{2\pi}\int_{0}^{2\pi} \frac{\mathrm{e}^{\mathrm{i} x}P'(\mathrm{e}^{\mathrm{i} x})}{P(\mathrm{e}^{\mathrm{i} x})}\,\mathrm{d} x = \sum_{j=1}^{r} m_{j}\,K(a_{j}), \qquad\text{où}\qquad K(a) = \frac{1}{2\pi}\int_{0}^{2\pi} \frac{\mathrm{e}^{\mathrm{i} x}}{\mathrm{e}^{\mathrm{i} x} - a}\,\mathrm{d} x.$$
     Les intégrandes sont continus, puisque $\mathrm{e}^{\mathrm{i} x} \neq a_{j}$. Il reste à montrer que $K(a) = 1$ si $|a| < 1$ et $K(a) = 0$ si $|a| > 1$. On utilise deux outils.

    • Pour $k \in \mathbb{Z}^{*}$, $x \mapsto \frac{\mathrm{e}^{\mathrm{i} kx}}{\mathrm{i} k}$ est une primitive de $\mathrm{e}^{\mathrm{i} kx}$, et elle prend la même valeur en $0$ et en $2\pi$ : $\int_{0}^{2\pi} \mathrm{e}^{\mathrm{i} kx}\,\mathrm{d} x = 0$.

    • Pour $q \in \mathbb{C}$, $q \neq 1$, et $N \in \mathbb{N}$, la somme géométrique donne $\frac{1}{1 - q} = \sum_{k=0}^{N} q^{k} + \frac{q^{N+1}}{1 - q}$.

    *Cas $|a| < 1$.* On écrit $\frac{\mathrm{e}^{\mathrm{i} x}}{\mathrm{e}^{\mathrm{i} x} - a} = \frac{1}{1 - q}$ avec $q = a\,\mathrm{e}^{-\mathrm{i} x}$, de module $|a| < 1$. Par la somme géométrique, et comme $\int_{0}^{2\pi} q^{k}\,\mathrm{d} x = a^{k}\int_{0}^{2\pi} \mathrm{e}^{-\mathrm{i} kx}\,\mathrm{d} x$ est nul pour $k \geqslant 1$ et vaut $2\pi$ pour $k = 0$, 
    $$2\pi K(a) = 2\pi + \int_{0}^{2\pi} \frac{q^{N+1}}{1 - q}\,\mathrm{d} x.$$
     Comme $|1 - q| \geqslant 1 - |q| = 1 - |a|$, l'inégalité triangulaire complexe (théorème 5) donne 
    $$\big|2\pi K(a) - 2\pi\big| \leqslant 2\pi\,\frac{|a|^{N+1}}{1 - |a|}.$$
     Le premier membre ne dépend pas de $N$, et le second tend vers $0$ quand $N \to +\infty$ : $K(a) = 1$.

    *Cas $|a| > 1$.* On écrit cette fois $\frac{\mathrm{e}^{\mathrm{i} x}}{\mathrm{e}^{\mathrm{i} x} - a} = -\frac{q}{1 - q}$ avec $q = \frac{\mathrm{e}^{\mathrm{i} x}}{a}$, de module $\frac{1}{|a|} < 1$. La somme géométrique, multipliée par $q$, donne $\frac{q}{1 - q} = \sum_{k=1}^{N+1} q^{k} + \frac{q^{N+2}}{1 - q}$, où chaque $q^{k}$, pour $k \geqslant 1$, est d'intégrale nulle. Donc 
    $$\big|2\pi K(a)\big| = \Big|\int_{0}^{2\pi} \frac{q^{N+2}}{1 - q}\,\mathrm{d} x\Big| \leqslant 2\pi\,\frac{|a|^{-(N+2)}}{1 - |a|^{-1}} \xrightarrow[N \to +\infty]{} 0,$$
     et $K(a) = 0$. En reportant, 
    $$\boxed{\frac{1}{2\pi}\int_{0}^{2\pi} \frac{\mathrm{e}^{\mathrm{i} x}P'(\mathrm{e}^{\mathrm{i} x})}{P(\mathrm{e}^{\mathrm{i} x})}\,\mathrm{d} x = \sum_{|a_{j}| < 1} m_{j} = \text{nombre de racines de module} < 1, \text{ comptées avec multiplicité}}$$
     Pour $P = (X - 0{,}5)(X + 0{,}3\mathrm{i})(X - 2)(X - 1{,}5\mathrm{i})^{2}$, une intégration numérique donne $2{,}000$, et pour $P = (X - 0{,}2)^{3}(X + 3)$, elle donne $3{,}000$ ✓.

    *Piège.* L'erreur la plus répandue est de développer $\frac{1}{1 - q}$ en « somme infinie » $\sum q^{k}$ et d'intégrer terme à terme : c'est une manipulation de série, qui n'est pas justifiée à ce stade. La somme géométrique *finie*, avec son reste explicite, donne le même résultat de façon rigoureuse.

    *À retenir.* L'intégrale compte les racines : c'est un entier, alors que l'intégrande n'a rien d'entier. Ce résultat est un cas particulier du principe de l'argument, qui sera étudié en analyse complexe ; il dit que l'argument de $P(\mathrm{e}^{\mathrm{i} x})$ fait autant de tours autour de $0$, quand $x$ parcourt $[0\,,2\pi]$, que $P$ a de racines dans le disque.
