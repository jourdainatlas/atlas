  partie: "Formules de Taylor globales"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [formules de Taylor, formule de Taylor, "suites d'intégrales"]
  noeuds: [de-taylor, ri-proprietes, su-convergence]
  notions: [polynome-taylor]
  page_enonce: 9
  page_corrige: 32
  enonce: |
    **1.** À l'aide de la formule de Taylor avec reste intégral, montrer que $x^{2} - \dfrac{x^{4}}{3} \leqslant \sin^{2} x \leqslant x^{2}$ pour tout $x \in [0\,,1]$.

    **2.** En déduire la limite de la suite de terme général $\displaystyle\sum_{k=1}^{n} \sin^{2}\frac{1}{\sqrt{n + k}}$.
  corrige: |
    **1.** On note $g = \sin^{2}$. On a $g'(t) = 2\sin t\cos t = \sin 2t$, $g''(t) = 2\cos 2t$, $g'''(t) = -4\sin 2t$ et $g''''(t) = -8\cos 2t$, d'où $g(0) = g'(0) = g'''(0) = 0$ et $g''(0) = 2$ : les polynômes de Taylor de $g$ en $0$ aux ordres $2$ et $3$ valent tous deux $x^{2}$.

    *Majoration.* La formule de Taylor avec reste intégral (théorème 7) à l'ordre $2$ s'écrit 
    $$\sin^{2}x = x^{2} - 4\int_{0}^{x} \frac{(x - t)^{2}}{2}\sin 2t\,\mathrm{d} t.$$
     Pour $x \in [0\,,1]$ et $t \in [0\,,x]$, on a $2t \in [0\,,2] \subset [0\,,\pi]$, donc $\sin 2t \geqslant 0$, et le reste est négatif.

    *Minoration.* À l'ordre $3$, le reste fait intervenir $\cos 2t$, qui change de signe en $t = \frac{\pi}{4} < 1$ : on ne peut plus raisonner sur le signe. On utilise plutôt l'inégalité de Taylor-Lagrange (théorème 8), avec $|g''''| \leqslant 8$ : $|\sin^{2}x - x^{2}| \leqslant 8 \times \frac{x^{4}}{24} = \frac{x^{4}}{3}$. 
    $$\boxed{x^{2} - \frac{x^{4}}{3} \leqslant \sin^{2}x \leqslant x^{2} \qquad (0 \leqslant x \leqslant 1)}$$
     *Piège.* Il faut choisir l'outil selon le signe de la dérivée : le reste intégral ne donne une inégalité que si $g^{(n + 1)}$ garde un signe constant sur $[0\,,x]$, ce qui n'est pas le cas de $\cos 2t$ sur $[0\,,1]$. L'inégalité de Taylor-Lagrange, elle, n'exige qu'une majoration.

    **2.** On applique la question 1 à $x_{k} = \frac{1}{\sqrt{n + k}} \in \,]0\,,1]$, pour lequel $x_{k}^{2} = \frac{1}{n + k}$, et l'on somme : 
    $$\sum_{k = 1}^{n} \frac{1}{n + k} - \frac{1}{3}\sum_{k = 1}^{n} \frac{1}{(n + k)^{2}} \leqslant \sum_{k = 1}^{n} \sin^{2}\frac{1}{\sqrt{n + k}} \leqslant \sum_{k = 1}^{n} \frac{1}{n + k}.$$
     La seconde somme de gauche compte $n$ termes au plus égaux à $\frac{1}{n^{2}}$ : elle est au plus $\frac{1}{n}$, et tend vers $0$. La première est une somme de Riemann (théorème 9), pour la fonction continue $x \mapsto \frac{1}{1 + x}$ sur $[0\,,1]$ : 
    $$\sum_{k = 1}^{n} \frac{1}{n + k} = \frac{1}{n}\sum_{k = 1}^{n} \frac{1}{1 + \frac{k}{n}} = R'_{n} \xrightarrow[n \to +\infty]{} \int_{0}^{1} \frac{\mathrm{d} x}{1 + x} = \ln 2.$$
     Le théorème d'encadrement conclut. 
    $$\boxed{\lim_{n \to +\infty} \sum_{k = 1}^{n} \sin^{2}\frac{1}{\sqrt{n + k}} = \ln 2}$$
     Numériquement, la somme vaut $0{,}653\,5$ pour $n = 10$, $0{,}692\,73$ pour $n = 1000$ et $0{,}693\,143$ pour $n = 10^{5}$, contre $\ln 2 \approx 0{,}693\,147$. ✓

    *À retenir.* Les termes $\sin^{2}\frac{1}{\sqrt{n + k}}$ tendent tous vers $0$, mais ils sont au nombre de $n$ : l'erreur la plus répandue est de conclure que la somme tend vers $0$. L'encadrement de la question 1 ramène la somme à une somme de Riemann, à une erreur près qui, elle, tend bien vers $0$.
- id: "ma-18-36"
  feuille: "f-ma-18"
  numero: 36
  partie: "Formules de Taylor globales"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [formules de Taylor]
