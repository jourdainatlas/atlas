  source: "Exo7 (fic00029), exercices 1, 2 et 7 ; Exo7 (fic00020), exercice 6"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    **1.** Déterminer les carrés modulo $3$, $4$ et $8$, les cubes modulo $9$ et les puissances quatrièmes modulo $16$.

    **2.** Calculer le reste de la division euclidienne de $999 \times 1998$ par $1999$, de $136^{7}$ par $137$, de $1997 \times 1998 \times 1999 \times 2000$ par $2001$, de $2792^{217}$ par $5$ et de $10^{1000}$ par $13$.

    **3.** Selon l'entier $n \geqslant 1$, calculer $7^{n} + 11^{n}$ modulo $19$.

    **4.** Montrer que $13$ divise $2^{70} + 3^{70}$ et que $11$ divise $2^{129} + 3^{118}$.

    **5.** Soit $n$ un entier impair non divisible par $3$. Montrer que $24$ divise $n^{2} - 1$.
  corrige: |
    **1.** Il suffit d'élever au carré un système de représentants. Les carrés modulo $3$ et modulo $4$ sont $0$ et $1$ ; modulo $8$, ce sont $0$, $1$ et $4$, car un impair vérifie $(2k + 1)^{2} = 4k(k + 1) + 1 \equiv 1 \pmod{8}$, $k(k + 1)$ étant pair. Les cubes modulo $9$ sont $0$, $1$ et $-1$, car $(3k)^{3} \equiv 0$ et $(3k \pm 1)^{3} = 27k^{3} \pm 27k^{2} + 9k \pm 1 \equiv \pm 1 \pmod{9}$. Les puissances quatrièmes modulo $16$ sont $0$ et $1$ : $(2k)^{4} = 16k^{4}$ et, pour $a$ impair, $a^{2} = 8j + 1$ donne $a^{4} = 64j^{2} + 16j + 1 \equiv 1 \pmod{16}$.

    **2.** On remplace chaque facteur par un petit représentant, souvent négatif :

    • $1998 \equiv -1 \pmod{1999}$, donc $999 \times 1998 \equiv -999 \equiv \boxed{1000}$ ;

    • $136 \equiv -1 \pmod{137}$, donc $136^{7} \equiv -1 \equiv \boxed{136}$ ;

    • $1997 \times 1998 \times 1999 \times 2000 \equiv (-4)(-3)(-2)(-1) = \boxed{24} \pmod{2001}$ ;

    • $2792 \equiv 2 \pmod{5}$ et $2^{4} \equiv 1$ (Fermat) ; comme $217 = 4 \times 54 + 1$, $2792^{217} \equiv 2^{217} \equiv \boxed{2}$ ;

    • $10^{3} = 1000 = 13 \times 77 - 1 \equiv -1 \pmod{13}$, donc $10^{6} \equiv 1$ ; comme $1000 = 6 \times 166 + 4$, $10^{1000} \equiv 10^{4} \equiv -10 \equiv \boxed{3}$.

    **3.** On a $7^{3} = 343 = 18 \times 19 + 1$ et $11^{2} = 121 \equiv 7$, $11^{3} \equiv 77 \equiv 1 \pmod{19}$ : $7$ et $11$ sont d'ordre $3$ modulo $19$. Il suffit donc de regarder $n$ modulo $3$ : si $3 \mid n$, $7^{n} + 11^{n} \equiv 2$ ; sinon, $7^{n} + 11^{n} \equiv 7 + 11$ ou $49 + 121 \equiv 11 + 7$, soit $18 \equiv -1$ dans les deux cas.

    *Interprétation* : $7 + 11 \equiv -1$ et $7 \times 11 = 77 \equiv 1$, donc $\overline{7}$ et $\overline{11}$ sont les racines de $X^{2} + X + 1$ dans $\mathbb{F}_{19}$, les deux racines cubiques primitives de l'unité ; le calcul est celui de $\mathrm{j}^{n} + \mathrm{j}^{2n}$ dans $\mathbb{C}$, qui vaut $2$ ou $-1$.

    **4.** Modulo $13$ : $2^{12} \equiv 1$ (Fermat) et $3^{3} = 27 \equiv 1$, donc $2^{70} \equiv 2^{10} = 1024 \equiv 10$ et $3^{70} \equiv 3$ : la somme est $\equiv 13 \equiv 0$.

    Modulo $11$ : $2^{10} \equiv 1$ et $3^{5} = 243 \equiv 1$, donc $2^{129} \equiv 2^{9} = 512 \equiv 6$ et $3^{118} \equiv 3^{3} = 27 \equiv 5$ : la somme est $\equiv 11 \equiv 0$.

    **5.** Comme $n$ est impair, $n^{2} \equiv 1 \pmod{8}$ (question 1) ; comme $3 \nmid n$, $n^{2} \equiv 1 \pmod{3}$. Les entiers $8$ et $3$, premiers entre eux, divisent $n^{2} - 1$, donc leur produit aussi.
