  enonce: |
    **1.** Déterminer, à isomorphisme près, tous les groupes d'ordre au plus $5$. *Pour l'ordre $4$, distinguer selon qu'il existe ou non un élément d'ordre $4$, et utiliser l'exercice 4.*

    **2.** En déduire qu'un groupe non commutatif a au moins $6$ éléments, et vérifier que $\mathfrak{S}_{3}$ n'est pas commutatif.

    **3.** Déterminer tous les sous-groupes de $\mu_{2} \times \mu_{2}$.

    **4.** Déterminer tous les sous-groupes de $\mathfrak{S}_{3}$.

    **5.** Le groupe alterné $\mathfrak{A}_{4}$ a $12$ éléments. Montrer qu'il n'a pas de sous-groupe d'ordre $6$, bien que $6$ divise $12$ : la réciproque du théorème de Lagrange est fausse. *Si $H$ est un sous-groupe d'indice $2$ d'un groupe $G$ et $x \notin H$, comparer les classes $H$, $xH$ et $x^{2}H$ ; en déduire que $H$ contient tous les carrés, puis compter les carrés de $\mathfrak{A}_{4}$.*
  corrige: |
    **1.** Un groupe d'ordre $1$ est trivial. Un groupe d'ordre premier $2$, $3$ ou $5$ est cyclique (cours, prop. 6), donc isomorphe à $\mathbb{Z}/2\mathbb{Z}$, $\mathbb{Z}/3\mathbb{Z}$ ou $\mathbb{Z}/5\mathbb{Z}$ (prop. 8). Soit $G$ d'ordre $4$.

    S'il a un élément d'ordre $4$, il est cyclique, isomorphe à $\mathbb{Z}/4\mathbb{Z}$.

    Sinon, l'ordre de chaque élément divise $4$ sans être $4$, donc $x^{2} = e$ pour tout $x$ : par l'exercice 4, $G$ est un $\mathbb{F}_{2}$-espace vectoriel de dimension $2$, isomorphe à $\mathbb{F}_{2}^{2}$, ou encore à $\mu_{2} \times \mu_{2}$ (*groupe de Klein*).

    Les deux groupes d'ordre $4$ ne sont pas isomorphes, puisque seul $\mathbb{Z}/4\mathbb{Z}$ a un élément d'ordre $4$.

    Il y a ainsi, à isomorphisme près, six groupes d'ordre au plus $5$ : 
    $$\{e\}, \quad \mathbb{Z}/2\mathbb{Z}, \quad \mathbb{Z}/3\mathbb{Z}, \quad \mathbb{Z}/4\mathbb{Z}, \quad \mu_{2} \times \mu_{2}, \quad \mathbb{Z}/5\mathbb{Z}.$$

    **2.** Ces six groupes sont commutatifs : un groupe non commutatif a donc au moins $6$ éléments.

    Dans $\mathfrak{S}_{3}$, avec la convention $\sigma\tau = \sigma \circ \tau$, on trouve $(1\ 2)(1\ 3) = (1\ 3\ 2)$ et $(1\ 3)(1\ 2) = (1\ 2\ 3)$ : $\mathfrak{S}_{3}$ n'est pas commutatif, et c'est le plus petit groupe non commutatif.

    **3.** Les ordres possibles sont $1$, $2$ et $4$ (Lagrange). Chacun des trois éléments $(-1, 1)$, $(1, -1)$, $(-1, -1)$ est d'ordre $2$ et engendre un sous-groupe d'ordre $2$ ; un sous-groupe d'ordre $2$ est engendré par son élément non neutre. D'où *cinq* sous-groupes : $\{(1, 1)\}$, les trois sous-groupes d'ordre $2$, et le groupe entier.

    **4.** Les ordres possibles sont $1$, $2$, $3$ et $6$. Un sous-groupe d'ordre $2$ ou $3$ est d'ordre premier, donc cyclique, engendré par un élément d'ordre $2$ (une transposition) ou $3$ (un $3$-cycle) ; les deux $3$-cycles engendrent le même sous-groupe $\mathfrak{A}_{3}$. D'où *six* sous-groupes : $\{\mathrm{id}\}$, $\langle (1\ 2) \rangle$, $\langle (1\ 3) \rangle$, $\langle (2\ 3) \rangle$, $\mathfrak{A}_{3} = \{\mathrm{id}, (1\ 2\ 3), (1\ 3\ 2)\}$ et $\mathfrak{S}_{3}$.

    1.5em

    ![Figure](documents/figures/b7d8d1114b84f148.svg)

    Les treillis des sous-groupes de $\mu_{2} \times \mu_{2}$ et de $\mathfrak{S}_{3}$ sont placés par ordre croissant de bas en haut ; dans $\mathfrak{S}_{3}$, le sous-groupe $\mathfrak{A}_{3}$ d'indice $2$, en rouge, est plus haut que les trois sous-groupes d'ordre $2$.

    **5.** Soit $H$ d'indice $2$ dans $G$ et $x \notin H$. Les classes à gauche $H$ et $xH$ sont distinctes et recouvrent $G$.

    Si l'on avait $x^{2} \in xH$, soit $x^{2} = xh$, on aurait $x = h \in H$ : donc $x^{2} \in H$.

    Pour $x \in H$, c'est évident : *$H$ contient tous les carrés de $G$*.

    Or $\mathfrak{A}_{4}$ contient l'identité, les trois doubles transpositions et les huit $3$-cycles ; un $3$-cycle $c$ vérifie $c^{3} = \mathrm{id}$, donc $c = c^{4} = (c^{2})^{2}$ est un carré.

    Un sous-groupe d'ordre $6$ de $\mathfrak{A}_{4}$, d'indice $2$, contiendrait l'identité et les huit $3$-cycles, soit $9 > 6$ éléments : il n'existe pas.

    *La réciproque du théorème de Lagrange est fausse* ; elle est vraie, en revanche, pour les groupes cycliques (cours, prop. 8).
