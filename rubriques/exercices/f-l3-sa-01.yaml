- id: "l3-sa-01-01"
  feuille: "f-l3-sa-01"
  numero: 1
  partie: "Lois de composition, groupes"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["lois de composition, groupes"]
  noeuds: [a-groupe, a-sous-groupe]
  notions: [groupe, sous-groupe]
  source: "Exo7 (fic00020), exercice 7"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    On munit $\mathbb{R}$ de la loi $x \star y = x + y - xy$.

    **1.** Cette loi est-elle associative ? commutative ? Admet-elle un élément neutre ? Quels réels ont un inverse pour cette loi ? *On pourra calculer $1 - x \star y$.*

    **2.** Donner une formule pour la puissance $n$-ième $x^{\star n} = x \star x \star \cdots \star x$ ($n$ facteurs) d'un réel $x$.

    **3.** En déduire que $\mathbb{R} \setminus \{1\}$, muni de $\star$, est un groupe isomorphe à $(\mathbb{R}^{*}, \times)$.
  corrige: |
    **1.** La loi est évidemment commutative. L'indication donne 
    $$1 - x \star y = 1 - x - y + xy = (1 - x)(1 - y).$$
     Par suite $1 - (x \star y) \star z = (1 - x \star y)(1 - z) = (1 - x)(1 - y)(1 - z)$, expression symétrique en $x$, $y$, $z$, qui vaut donc aussi $1 - x \star (y \star z)$ : la loi est associative. Le réel $0$ est neutre, car $x \star 0 = x$.

    Enfin $x \star y = 0$ équivaut à $(1 - x)(1 - y) = 1$ : si $x \neq 1$, l'unique inverse de $x$ est $y = 1 - \frac{1}{1 - x} = \frac{x}{x - 1}$, tandis que $1$ n'a pas d'inverse, puisque $1 \star y = 1$ pour tout $y$ ($1$ est absorbant).

    **2.** Par récurrence sur $n$, l'identité précédente donne $1 - x^{\star n} = (1 - x)^{n}$, soit $\boxed{x^{\star n} = 1 - (1 - x)^{n}}$.

    **3.** L'application $\varphi : x \mapsto 1 - x$ est une bijection de $\mathbb{R} \setminus \{1\}$ sur $\mathbb{R}^{*}$, et la question 1 s'écrit $\varphi(x \star y) = \varphi(x)\varphi(y)$. En particulier $x \star y \neq 1$ si $x$, $y \neq 1$ : la loi $\star$ est interne sur $\mathbb{R} \setminus \{1\}$, et elle n'est autre que la multiplication de $\mathbb{R}^{*}$ transportée par $\varphi^{-1}$. Tous les axiomes de groupe se transportent : $(\mathbb{R} \setminus \{1\}, \star)$ est un groupe et $\varphi$ un isomorphisme.

    *Cette remarque rend toutes les questions précédentes immédiates* : le neutre est $\varphi^{-1}(1) = 0$, l'inverse de $x$ est $\varphi^{-1}\big(1/(1 - x)\big)$ et la puissance $n$-ième est $\varphi^{-1}\big((1 - x)^{n}\big)$.
- id: "l3-sa-01-02"
  feuille: "f-l3-sa-01"
  numero: 2
  partie: "Lois de composition, groupes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["lois de composition, groupes"]
  noeuds: [a-groupe, a-sous-groupe]
  notions: [groupe, sous-groupe]
  source: "Exo7 (fic00020), exercices 8, 9 et 13"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $E$ un ensemble muni d'une loi associative notée multiplicativement.

    **1.** On suppose que $E$ a un élément neutre $e$. On dit que $b$ est un inverse à gauche de $a$ si $ba = e$, un inverse à droite si $ab = e$.

    **(a)** Si $a$ a un inverse à gauche $b$, lui-même doté d'un inverse à gauche, montrer que $a$ est inversible.

    **(b)** Si tout élément de $E$ a un inverse à gauche, montrer que $E$ est un groupe.

    **2.** On suppose seulement que $E$ a un *neutre à gauche* $e$ (c'est-à-dire $ex = x$ pour tout $x \in E$) et que tout élément $x$ a un inverse à gauche relativement à $e$ (il existe $y$ tel que $yx = e$). Montrer que $E$ est un groupe.

    **3.** On considère l'ensemble $E$ des matrices réelles $\begin{pmatrix} a & 0 \\ b & 0 \end{pmatrix}$, avec $a \in \mathbb{R}^{*}$ et $b \in \mathbb{R}$, muni du produit matriciel.

    **(a)** Montrer que le produit est une loi interne associative sur $E$.

    **(b)** Déterminer les éléments neutres à droite de $E$, et montrer que $E$ n'a pas d'élément neutre à gauche.

    **(c)** Soit $e$ un neutre à droite. Montrer que tout $g \in E$ a un inverse à gauche relativement à $e$, c'est-à-dire qu'il existe $h \in E$ tel que $hg = e$.

    **(d)** Comparer avec la question 2 : que retenir ?
  corrige: |
    **1. (a)** Soit $b$ tel que $ba = e$ et $c$ tel que $cb = e$. Alors $c = c(ba) = (cb)a = a$, donc $ab = cb = e$ : $b$ est aussi inverse à droite de $a$, et $a$ est inversible, d'inverse $b$.

    **(b)** Si tout élément a un inverse à gauche, l'inverse à gauche $b$ de $a$ en a un aussi, et $a$ est inversible par (a). L'ensemble $E$, associatif, unifère et dont tout élément est inversible, est un groupe.

    **2.** Soit $x \in E$, $y$ tel que $yx = e$ et $z$ tel que $zy = e$. Comme $e$ est neutre à gauche, $ey = y$, et 
    $$xy = e(xy) = (zy)(xy) = z(yx)y = z(ey) = zy = e.$$
     Ainsi $y$ est aussi inverse à droite de $x$.

    On en déduit $xe = x(yx) = (xy)x = ex = x$ : $e$ est aussi neutre à droite, donc neutre, et tout élément est inversible. $E$ est un groupe.

    **3. (a)** On calcule $\begin{pmatrix} a & 0 \\ b & 0 \end{pmatrix}\begin{pmatrix} c & 0 \\ d & 0 \end{pmatrix} = \begin{pmatrix} ac & 0 \\ bc & 0 \end{pmatrix}$, avec $ac \neq 0$ : le produit est interne sur $E$, et il est associatif comme le produit matriciel.

    **(b)** La matrice $\begin{pmatrix} \alpha & 0 \\ \beta & 0 \end{pmatrix}$ est neutre à droite si $\begin{pmatrix} a\alpha & 0 \\ b\alpha & 0 \end{pmatrix} = \begin{pmatrix} a & 0 \\ b & 0 \end{pmatrix}$ pour tous $a$, $b$, c'est-à-dire si $\alpha = 1$ : les neutres à droite sont les $\boxed{e_{\beta} = \begin{pmatrix} 1 & 0 \\ \beta & 0 \end{pmatrix}}$, $\beta \in \mathbb{R}$. Elle est neutre à gauche si $\begin{pmatrix} \alpha a & 0 \\ \beta a & 0 \end{pmatrix} = \begin{pmatrix} a & 0 \\ b & 0 \end{pmatrix}$ pour tous $a$, $b$ ; avec $a = 1$, il faudrait $\beta = b$ pour tout $b$, ce qui est impossible.

    **(c)** Pour $g = \begin{pmatrix} a & 0 \\ b & 0 \end{pmatrix}$, la matrice $h = \begin{pmatrix} 1/a & 0 \\ \beta/a & 0 \end{pmatrix}$ vérifie $hg = e_{\beta}$.

    **(d)** $E$ possède un neutre à droite, et des inverses à gauche relativement à lui, sans être un groupe, puisqu'il n'a pas de neutre. Dans la question 2, le neutre et les inverses sont *du même côté* : c'est indispensable.

    *L'erreur la plus répandue est de croire qu'un neutre « d'un côté » et des inverses « de l'autre » suffisent.*
- id: "l3-sa-01-03"
  feuille: "f-l3-sa-01"
  numero: 3
  partie: "Lois de composition, groupes"
  etoiles: 1
  types: [Démonstration]
  mots_cles: ["lois de composition, groupes"]
  noeuds: [a-groupe, a-sous-groupe]
  notions: [groupe, sous-groupe]
  source: "Exo7 (fic00020), exercices 10, 11, 12 et 23 (a)"
  page_enonce: 2
  page_corrige: 2
  enonce: |
    **1.** Les rationnels non nuls forment-ils un sous-groupe de $(\mathbb{R}^{*}, \times)$ ?

    **2.** Montrer que $\{2^{n} ; n \in \mathbb{Z}\}$ et $\left\{\frac{1 + 2m}{1 + 2n} ; m, n \in \mathbb{Z}\right\}$ sont des sous-groupes de $(\mathbb{Q}^{*}, \times)$. Quelle est leur intersection ?

    **3.** Rappeler pourquoi l'ensemble $\mathrm{GL}_{n}(\mathbb{R})$ des matrices réelles $n \times n$ de déterminant non nul est un groupe pour le produit. Les matrices à coefficients entiers de déterminant non nul forment-elles un groupe ? Montrer que $\mathrm{GL}_{n}(\mathbb{Z}) = \{M \in \mathcal{M}_{n}(\mathbb{Z}) ; \det M = \pm 1\}$ en est un (*on pourra utiliser la comatrice*), et que 
    $$\mathrm{SL}_{2}(\mathbb{Z}) = \left\{\begin{pmatrix} a & b \\ c & d \end{pmatrix} ; a, b, c, d \in \mathbb{Z}, \ ad - bc = 1\right\}$$
     est un sous-groupe de $\mathrm{GL}_{2}(\mathbb{Z})$.
  corrige: |
    **1.** Oui : $\mathbb{Q}^{*}$ est non vide et, pour $x$, $y \in \mathbb{Q}^{*}$, $xy^{-1} \in \mathbb{Q}^{*}$ (cours, prop. 2).

    **2.** Pour $H_{1} = \{2^{n} ; n \in \mathbb{Z}\}$, on a $1 = 2^{0} \in H_{1}$ et $2^{n}(2^{m})^{-1} = 2^{n - m} \in H_{1}$. Pour $H_{2}$, ensemble des quotients de deux entiers impairs, $1 = \frac{1}{1} \in H_{2}$ et $\frac{a}{b}\left(\frac{c}{d}\right)^{-1} = \frac{ad}{bc}$, où $ad$ et $bc$ sont impairs.

    Si $2^{n} = \frac{a}{b}$ avec $a$, $b$ impairs, alors $2^{n}b = a$ si $n \geqslant 0$, et $b = 2^{-n}a$ sinon ; un impair n'étant jamais un multiple pair, $n = 0$. Ainsi $\boxed{H_{1} \cap H_{2} = \{1\}}$.

    *On peut aller plus loin* : tout rationnel non nul s'écrit de façon unique $2^{n}u$, avec $u \in H_{2}$, de sorte que $(x, y) \mapsto xy$ est un isomorphisme de $H_{1} \times H_{2}$ sur $\mathbb{Q}^{*}$. L'entier $n$ est la valuation $2$-adique, que le chapitre 3 généralisera.

    **3.** Le produit de matrices est associatif, $I_{n}$ est neutre, $\det(AB) = \det A \det B$ montre que $\mathrm{GL}_{n}(\mathbb{R})$ est stable, et toute $M$ de déterminant non nul a un inverse $M^{-1}$, de déterminant $1/\det M \neq 0$. Les matrices entières de déterminant non nul ne forment pas un groupe : l'inverse de $2I_{n}$ est $\frac{1}{2}I_{n}$, qui n'est pas entière.

    Si $M \in \mathcal{M}_{n}(\mathbb{Z})$ et $\det M = \pm 1$, la formule $M^{-1} = \frac{1}{\det M}{}^{t}\mathrm{Com}(M)$ montre que $M^{-1}$ est entière, de déterminant $\pm 1$ ; comme $\mathrm{GL}_{n}(\mathbb{Z})$ contient $I_{n}$ et est stable par produit, c'est un sous-groupe de $\mathrm{GL}_{n}(\mathbb{R})$.

    Réciproquement, si $M$ et $M^{-1}$ sont entières, $\det M \det M^{-1} = 1$ dans $\mathbb{Z}$ impose $\det M = \pm 1$ : *$\mathrm{GL}_{n}(\mathbb{Z})$ est exactement le groupe des inversibles de l'anneau $\mathcal{M}_{n}(\mathbb{Z})$*.

    Enfin $\mathrm{SL}_{2}(\mathbb{Z})$ est le noyau du morphisme $\det : \mathrm{GL}_{2}(\mathbb{Z}) \to \{-1, 1\}$, donc un sous-groupe (cours, prop. 4).
- id: "l3-sa-01-04"
  feuille: "f-l3-sa-01"
  numero: 4
  partie: "Équations dans un groupe"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [équations dans un groupe]
  noeuds: [a-groupe, gs-lagrange]
  notions: [groupe, ordre-element]
  source: "Exo7 (fic00020), exercices 14, 15, 16 et 17"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $G$ un groupe.

    **1.** On suppose que $x^{2} = e$ pour tout $x \in G$. Montrer que $G$ est commutatif. Si de plus $G$ est fini, montrer que son ordre est une puissance de $2$. *On pourra noter $G$ additivement et en faire un espace vectoriel sur le corps $\mathbb{F}_{2}$.*

    **2.** On suppose $G$ fini d'ordre pair. Montrer qu'il existe $x \neq e$ tel que $x^{2} = e$. *On pourra regrouper chaque élément avec son inverse.*

    **3.** On suppose $G$ fini d'ordre impair. Montrer que $x \mapsto x^{2}$ est une bijection de $G$ sur lui-même, et en déduire que $e$ est la seule solution de $x^{2} = e$.

    **4.** Plus généralement, soit $G$ fini et $m$ un entier premier avec l'ordre de $G$. Montrer que, pour tout $a \in G$, l'équation $x^{m} = a$ a une unique solution dans $G$.
  corrige: |
    **1.** Chaque élément est son propre inverse, donc $xy = (xy)^{-1} = y^{-1}x^{-1} = yx$ : $G$ est commutatif. Notons-le additivement ; on a $x + x = 0$ pour tout $x$. On définit le produit par un scalaire de $\mathbb{F}_{2} = \{0, 1\}$ par $0 \cdot x = 0$ et $1 \cdot x = x$. Le seul axiome qui demande vérification est $(1 + 1) \cdot x = 1 \cdot x + 1 \cdot x$, c'est-à-dire $0 = x + x$, qui est l'hypothèse. Ainsi $G$ est un $\mathbb{F}_{2}$-espace vectoriel ; s'il est fini, il est de dimension finie $d$, isomorphe à $\mathbb{F}_{2}^{d}$, et $|G| = 2^{d}$.

    **2.** Les paires $\{x, x^{-1}\}$ partitionnent $G$ ; elles ont deux éléments, sauf lorsque $x = x^{-1}$, c'est-à-dire $x^{2} = e$. Le nombre $N$ de solutions de $x^{2} = e$ est donc de la parité de $|G|$, c'est-à-dire pair. Comme $e$ est solution, $N \geqslant 2$ : il existe une solution $x \neq e$.

    **3.** C'est le cas $m = 2$ de la question 4. On peut aussi raisonner directement : si $|G| = 2k + 1$, alors $x = x^{2k + 2} = (x^{k + 1})^{2}$ pour tout $x$, donc $x \mapsto x^{2}$ est surjective, et bijective puisque $G$ est fini. L'unique antécédent de $e$ est $e$.

    *Attention : $x \mapsto x^{2}$ n'est pas un morphisme si $G$ n'est pas commutatif*, et l'on ne peut pas raisonner sur son noyau ; c'est la finitude qui fait passer de la surjectivité à l'injectivité.

    **4.** Soit $n = |G|$ ; comme $m \wedge n = 1$, il existe $u$, $v \in \mathbb{Z}$ tels que $um + vn = 1$, et $x^{n} = e$ pour tout $x$ (cours, prop. 6).

    *Unicité* : si $x^{m} = a$, alors $x = x^{um + vn} = (x^{m})^{u}(x^{n})^{v} = a^{u}$.

    *Existence* : $(a^{u})^{m} = a^{1 - vn} = a$. L'équation $x^{m} = a$ a donc l'unique solution $\boxed{x = a^{u}}$, où $u$ est un inverse de $m$ modulo $n$.
- id: "l3-sa-01-05"
  feuille: "f-l3-sa-01"
  numero: 5
  partie: "Sous-groupes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [sous-groupes]
  noeuds: [a-sous-groupe]
  notions: [sous-groupe, sous-groupe-engendre]
  source: "Exo7 (fic00020), exercices 18, 19, 20 et 21"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $G$ un groupe et $H$ une partie non vide de $G$. On pose $H^{-1} = \{x^{-1} ; x \in H\}$ et, pour $a \in G$, $Ha = \{xa ; x \in H\}$.

    **1.** Montrer que $H$ est un sous-groupe de $G$ si et seulement si $HH^{-1} \subset H$, et si et seulement si $Ha = H$ pour tout $a \in H$.

    **2.** Soit $H$ et $K$ deux sous-groupes de $G$. On suppose qu'il existe $a$, $b \in G$ tels que $Ha \subset Kb$. Montrer que $H \subset K$.

    **3.** Montrer qu'une partie finie non vide de $G$, stable par la loi de $G$, est un sous-groupe de $G$. Donner un contre-exemple pour une partie infinie.

    **4.** Soit $H$ et $K$ deux sous-groupes de $G$. Montrer que $H \cup K$ est un sous-groupe de $G$ si et seulement si $H \subset K$ ou $K \subset H$. En déduire qu'un groupe n'est jamais réunion de deux sous-groupes distincts de lui-même.
  corrige: |
    **1.** La condition $HH^{-1} \subset H$ signifie que $xy^{-1} \in H$ pour tous $x$, $y \in H$ : c'est la caractérisation du cours (prop. 2).

    Si $H$ est un sous-groupe et $a \in H$, alors $Ha \subset H$, et tout $x \in H$ s'écrit $(xa^{-1})a \in Ha$ : $Ha = H$.

    Réciproquement, supposons $Ha = H$ pour tout $a \in H$. Pour $a \in H$, on a $a \in Ha$, donc $a = ha$ avec $h \in H$, et $h = e \in H$. Puis $e \in Ha$ donne $e = h'a$, $h' \in H$, donc $a^{-1} = h' \in H$.

    Enfin, pour $x$, $y \in H$, $xy \in Hy = H$ : $H$ est un sous-groupe.

    **2.** Comme $e \in H$, $a \in Kb$, donc $ab^{-1} \in K$.

    Pour $h \in H$, $ha \in Kb$ donne $hab^{-1} \in K$, puis $h = (hab^{-1})(ab^{-1})^{-1} \in K$.

    **3.** Soit $P$ une partie finie non vide stable et $x \in P$. Les puissances $x, x^{2}, \dots$ sont dans $P$, qui est fini : il existe $i < j$ tels que $x^{i} = x^{j}$, donc $x^{d} = e$ avec $d = j - i \geqslant 1$. Ainsi $e = x^{d} \in P$, et $x^{-1} = x^{d - 1} \in P$ (c'est $e$ si $d = 1$). Partie non vide, stable par produit et par inverse, $P$ est un sous-groupe. La partie $\mathbb{N}$ de $(\mathbb{Z}, +)$ est stable, infinie, et n'est pas un sous-groupe.

    **4.** Si $H \subset K$, $H \cup K = K$ est un sous-groupe.

    Supposons $H \cup K$ sous-groupe, $H \not\subset K$ et $K \not\subset H$ : il existe $h \in H \setminus K$ et $k \in K \setminus H$. Le produit $hk$ est dans $H \cup K$ ; s'il est dans $H$, $k = h^{-1}(hk) \in H$, et s'il est dans $K$, $h = (hk)k^{-1} \in K$, deux contradictions.

    Si enfin $G = H \cup K$ avec $H$, $K$ sous-groupes, $G$ étant un sous-groupe on a $H \subset K$ ou $K \subset H$, donc $G = K$ ou $G = H$.

    *Avec trois sous-groupes, c'est possible* : $\mu_{2} \times \mu_{2}$ est réunion de ses trois sous-groupes d'ordre $2$ (exercice 10).
- id: "l3-sa-01-06"
  feuille: "f-l3-sa-01"
  numero: 6
  partie: "Sous-groupes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [sous-groupes]
  noeuds: [a-sous-groupe]
  notions: [sous-groupe, sous-groupe-engendre]
  source: "Exo7 (fic00020), exercice 30"
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Soit $H$ et $K$ deux sous-groupes d'un groupe $G$, et $HK = \{xy ; x \in H, y \in K\}$.

    **1.** Montrer que $HK$ est un sous-groupe de $G$ si et seulement si $HK = KH$. C'est le cas en particulier lorsque $G$ est commutatif.

    **2.** On suppose $H$ et $K$ finis. Montrer que $\operatorname{card}(HK) = \dfrac{|H|\,|K|}{|H \cap K|}$. *On pourra étudier les fibres de l'application $(x, y) \mapsto xy$ de $H \times K$ dans $HK$.*

    **3.** Dans $\mathfrak{S}_{3}$, on prend $H = \langle (1\ 2) \rangle$ et $K = \langle (1\ 3) \rangle$. Montrer, sans calculer $HK$, que $HK$ n'est pas un sous-groupe.
  corrige: |
    **1.** Si $HK$ est un sous-groupe, il est stable par passage à l'inverse : 
    $$HK = (HK)^{-1} = K^{-1}H^{-1} = KH.$$
     Réciproquement, si $HK = KH$, alors $e \in HK$ et, pour $h$, $h' \in H$ et $k$, $k' \in K$, 
    $$(hk)(h'k')^{-1} = h\,(kk'^{-1}h'^{-1}),$$
     où $kk'^{-1}h'^{-1} \in KH = HK$ s'écrit $h''k''$ ; le produit vaut $(hh'')k'' \in HK$, et la prop. 2 du cours conclut.

    Si $G$ est commutatif, $HK = KH$ est clair.

    **2.** L'application $\mu : (x, y) \mapsto xy$ de $H \times K$ sur $HK$ est surjective.

    Si $xy = x'y'$, l'élément $u = x^{-1}x' = yy'^{-1}$ est dans $H \cap K$, et $(x', y') = (xu, u^{-1}y)$ ; réciproquement, chaque $u \in H \cap K$ donne un antécédent $(xu, u^{-1}y)$ de $xy$, et deux $u$ distincts donnent des couples distincts. Toutes les fibres ont donc $|H \cap K|$ éléments, et $|H|\,|K| = \operatorname{card}(HK)\,|H \cap K|$.

    **3.** Ici $|H| = |K| = 2$ et $H \cap K = \{\mathrm{id}\}$, donc $\operatorname{card}(HK) = 4$, qui ne divise pas $6$ : $HK$ n'est pas un sous-groupe de $\mathfrak{S}_{3}$, par le théorème de Lagrange. D'après la question 1, on en déduit $HK \neq KH$.
- id: "l3-sa-01-07"
  feuille: "f-l3-sa-01"
  numero: 7
  partie: "Sous-groupes"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [sous-groupes]
  noeuds: [a-sous-groupe]
  notions: [sous-groupe, sous-groupe-engendre]
  source: "Exo7 (fic00020), exercice 27"
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Soit $G \neq \{e\}$ un groupe fini commutatif. Un sous-groupe $M \neq G$ est dit *maximal* si les seuls sous-groupes de $G$ contenant $M$ sont $M$ et $G$. On note $F$ l'intersection des sous-groupes maximaux de $G$.

    **1.** Justifier que tout sous-groupe $H \neq G$ est contenu dans un sous-groupe maximal.

    **2.** Montrer que $F$ est l'ensemble des éléments $a \in G$ qui vérifient : pour toute partie $S$ de $G$ contenant $a$ et engendrant $G$, la partie $S \setminus \{a\}$ engendre encore $G$.

    **3.** Déterminer $F$ lorsque $G = \mathbb{Z}/8\mathbb{Z}$, puis lorsque $G = \mathbb{Z}/6\mathbb{Z}$.
  corrige: |
    **1.** La famille des sous-groupes $L \neq G$ qui contiennent $H$ est non vide (elle contient $H$) et finie. Un élément $M$ de cardinal maximal de cette famille est un sous-groupe maximal : un sous-groupe $L \neq G$ contenant $M$ contient $H$, et son cardinal ne peut dépasser celui de $M$, donc $L = M$.

    **2.** Appelons *superflu* un élément $a$ ayant la propriété de l'énoncé.

    $\triangleright$ *Tout élément de $F$ est superflu.* Soit $a \in F$ et $S$ une partie contenant $a$ et engendrant $G$.

    Si $L = \langle S \setminus \{a\} \rangle$ était différent de $G$, il serait contenu dans un sous-groupe maximal $M$ (question 1). Comme $a \in F \subset M$, on aurait $S \subset M$, donc $G = \langle S \rangle \subset M$, ce qui est absurde.

    $\triangleright$ *Tout élément superflu est dans $F$.* Si $a \notin F$, il existe un sous-groupe maximal $M$ tel que $a \notin M$. La partie $S = M \cup \{a\}$ engendre un sous-groupe qui contient strictement $M$, donc égal à $G$ par maximalité ; mais $S \setminus \{a\} = M$ engendre $M \neq G$. Ainsi $a$ n'est pas superflu.

    *La commutativité de $G$ n'a pas servi* : le résultat vaut pour tout groupe fini non trivial.

    **3.** Les sous-groupes de $\mathbb{Z}/8\mathbb{Z}$ sont les $\langle \overline{d} \rangle$ pour $d$ divisant $8$ (cours, prop. 8) ; ils forment une chaîne, et $\langle \overline{2} \rangle = \{\overline{0}, \overline{2}, \overline{4}, \overline{6}\}$ est le seul sous-groupe maximal : $\boxed{F = \langle \overline{2} \rangle}$. Les classes paires ne servent jamais à engendrer $\mathbb{Z}/8\mathbb{Z}$ : une partie l'engendre si et seulement si elle contient une classe impaire.

    Dans $\mathbb{Z}/6\mathbb{Z}$, les sous-groupes propres non nuls sont $\langle \overline{2} \rangle$, d'ordre $3$, et $\langle \overline{3} \rangle$, d'ordre $2$, tous deux maximaux, d'intersection nulle : $\boxed{F = \{\overline{0}\}}$.

    1.5em

    ![Figure](documents/figures/1635112707dc32f8.svg)

    Les deux treillis de sous-groupes, les sous-groupes maximaux étant encadrés en rouge, montrent la différence : dans $\mathbb{Z}/8\mathbb{Z}$ les sous-groupes forment une chaîne et $F$ est gros, dans $\mathbb{Z}/6\mathbb{Z}$ deux maximaux « se croisent » et $F$ est réduit à $\{\overline{0}\}$.
- id: "l3-sa-01-08"
  feuille: "f-l3-sa-01"
  numero: 8
  partie: "Ordre d'un élément"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["ordre d'un élément"]
  noeuds: [gf-cycliques]
  notions: [ordre-element, groupe-cyclique]
  source: "Exo7 (fic00020), exercices 22 et 23 (b)"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** Soit $x$ un élément d'ordre fini $d$ d'un groupe $G$, et $k \in \mathbb{Z}$. Montrer que $\operatorname{ord}(x^{k}) = \dfrac{d}{d \wedge k}$. Combien $\langle x \rangle$ a-t-il de générateurs ? Montrer aussi que $x^{-1}$ et $yxy^{-1}$ ($y \in G$) sont d'ordre $d$.

    **2.** Dans $\mathrm{SL}_{2}(\mathbb{Z})$ (exercice 3), on considère 
    $$A = \begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix} \qquad\text{et}\qquad B = \begin{pmatrix} 0 & 1 \\ -1 & -1 \end{pmatrix}.$$
     Montrer que $A$ et $B$ sont d'ordre fini, mais que $AB$ est d'ordre infini.
  corrige: |
    **1.** Posons $\delta = d \wedge k$, $d = \delta d'$ et $k = \delta k'$, avec $d' \wedge k' = 1$. D'après la prop. 5 du cours, $(x^{k})^{j} = e$ équivaut à $d \mid kj$, soit $d' \mid k'j$, soit $d' \mid j$ par le lemme de Gauss : $\boxed{\operatorname{ord}(x^{k}) = \frac{d}{d \wedge k}}$.

    Les générateurs de $\langle x \rangle$ sont les éléments d'ordre $d$, c'est-à-dire les $x^{k}$, $0 \leqslant k < d$, avec $k \wedge d = 1$ : il y en a $\varphi(d)$, comme dans $\mathbb{Z}/d\mathbb{Z}$ (cours, prop. 8).

    Le cas $k = -1$ donne $\operatorname{ord}(x^{-1}) = d$.

    Enfin $z \mapsto yzy^{-1}$ est un automorphisme de $G$, et $(yxy^{-1})^{j} = yx^{j}y^{-1}$ vaut $e$ si et seulement si $x^{j} = e$ : $yxy^{-1}$ est d'ordre $d$.

    **2.** On calcule $A^{2} = -I_{2}$, donc $A^{4} = I_{2}$ et $\operatorname{ord}(A) = 4$. Puis $B^{2} = \begin{pmatrix} -1 & -1 \\ 1 & 0 \end{pmatrix}$ et $B^{3} = I_{2}$ : $\operatorname{ord}(B) = 3$.

    Enfin 
    $$AB = \begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}, \qquad (AB)^{n} = \begin{pmatrix} 1 & n \\ 0 & 1 \end{pmatrix} \neq I_{2} \text{ pour } n \geqslant 1,$$
     donc $AB$ est d'ordre infini.

    *Le produit de deux éléments d'ordre fini peut être d'ordre infini* : l'exercice suivant montre que cela ne peut pas arriver dans un groupe commutatif.
- id: "l3-sa-01-09"
  feuille: "f-l3-sa-01"
  numero: 9
  partie: "Ordre d'un élément"
