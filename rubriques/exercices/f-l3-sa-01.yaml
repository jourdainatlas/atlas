  source: "Exo7 (fic00030), exercices 3, 4 et 2 (1)"
  page_enonce: 5
  page_corrige: 10
  enonce: |
    **1.** Soit $A$ un ensemble muni de deux lois $+$ et $\times$ qui vérifient tous les axiomes d'un anneau commutatif unitaire, sauf peut-être $1 \neq 0$. Montrer que $0 \cdot a = 0$ et $(-1)a = -a$ pour tout $a \in A$, et que $1 = 0$ si et seulement si $A = \{0\}$.

    **2.** Soit $A$ un anneau et $x$, $y \in A$. Montrer que, si $xy$ est inversible, alors $x$ et $y$ le sont. Montrer qu'un élément inversible n'est pas diviseur de zéro.

    **3.** Soit $K$ un corps et $a$, $b$, $c \in K$. Résoudre l'équation $ax + b = c$ d'inconnue $x \in K$.
  corrige: |
    **1.** On a $0 \cdot a = (0 + 0)a = 0 \cdot a + 0 \cdot a$, d'où $0 \cdot a = 0$ en ajoutant $-(0 \cdot a)$. Puis 
    $$(-1)a + a = (-1 + 1)a = 0 \cdot a = 0,$$
     donc $(-1)a = -a$.

    Si $1 = 0$, tout $a$ vérifie $a = 1 \cdot a = 0 \cdot a = 0$, et $A = \{0\}$ ; la réciproque est claire.

    *Ces calculs n'utilisent pas $1 \neq 0$* : la convention du cours exclut seulement l'anneau nul, où $0$ serait inversible et où les énoncés sur les corps et les anneaux intègres deviendraient faux ou vides.

    **2.** Si $(xy)z = 1$, alors $x(yz) = 1$ : $x$ est inversible, et de même $y$ par commutativité.

    Si $u$ est inversible et $ux = 0$, alors $x = u^{-1}ux = 0$ : $u$ n'est pas diviseur de zéro.

    *Ainsi, dans tout anneau, inversibles et diviseurs de zéro forment deux ensembles disjoints* ; l'exercice suivant montre que, dans un anneau fini, ils recouvrent les éléments non nuls.

    **3.** Si $a \neq 0$, l'unique solution est $x = a^{-1}(c - b)$.

    Si $a = 0$, tout $x \in K$ est solution lorsque $b = c$, aucun sinon.
- id: "l3-sa-01-18"
  feuille: "f-l3-sa-01"
  numero: 18
  partie: "Anneaux, corps"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [anneaux et corps]
  noeuds: [a-anneau, a-corps, a-fractions]
  notions: [anneau, anneau-integre, corps, sous-anneau]
  source: "Exo7 (fic00030), exercice 5 ; examen du 15/12/2014, exercice 6 (a)"
  page_enonce: 6
  page_corrige: 11
  enonce: |
    **1.** Soit $A$ un anneau fini. Montrer que tout élément non nul de $A$ est inversible ou diviseur de zéro.

    **2.** Soit $A$ un anneau intègre fini et $a \in A$ non nul. Montrer qu'il existe $i < j$ tels que $a^{i} = a^{j}$, et en déduire, sans utiliser d'argument de cardinal sur $x \mapsto ax$, que $a$ est inversible.

    **3.** Pour $p$ premier, on munit $\mathbb{F}_{p}^{2}$ de l'addition terme à terme et du produit 
    $$(a, b)(c, d) = (ac - bd, ad + bc),$$
     ce qui en fait un anneau, noté $\mathbb{F}_{p}[\mathrm{i}]$, où l'on écrit $a + b\mathrm{i}$ pour $(a, b)$. Montrer que $\mathbb{F}_{3}[\mathrm{i}]$ est un corps à $9$ éléments, mais que $\mathbb{F}_{5}[\mathrm{i}]$ n'est pas intègre.
  corrige: |
    **1.** Soit $a \neq 0$. L'application $m_{a} : x \mapsto ax$ est un endomorphisme du groupe additif $A$. Si elle est injective, elle est bijective, $A$ étant fini, et il existe $x$ tel que $ax = 1$ : $a$ est inversible.

    Sinon, il existe $x \neq 0$ tel que $ax = 0$, et $a$ est diviseur de zéro.

    Si $A$ est intègre, le second cas est exclu, et l'on retrouve le th. 4 du cours.

    **2.** Les puissances $a^{k}$, $k \geqslant 1$, sont dans l'ensemble fini $A$ : il existe $1 \leqslant i < j$ tels que $a^{i} = a^{j}$, donc $a^{i}(a^{j - i} - 1) = 0$. Comme $a^{i} \neq 0$ ($A$ intègre, $a \neq 0$), $a^{j - i} = 1$, soit $a \cdot a^{j - i - 1} = 1$ : *l'inverse de $a$ est une puissance de $a$*.

    **3.** Pour $z = a + b\mathrm{i}$, posons $\bar{z} = a - b\mathrm{i}$ ; on calcule $z\bar{z} = a^{2} + b^{2} \in \mathbb{F}_{p}$.

    Dans $\mathbb{F}_{3}$, les carrés sont $0$ et $1$ (exercice 13), donc $a^{2} + b^{2} = 0$ impose $a = b = 0$.

    Si $z \neq 0$, $N = a^{2} + b^{2}$ est inversible dans $\mathbb{F}_{3}$, et $z \cdot (N^{-1}\bar{z}) = 1$ : $\mathbb{F}_{3}[\mathrm{i}]$ est un corps à $9$ éléments.

    Dans $\mathbb{F}_{5}$, $1 + 2^{2} = 0$ : $(1 + 2\mathrm{i})(1 + 3\mathrm{i}) = 1 - 6 + 5\mathrm{i} = 0$, avec deux facteurs non nuls, et $\mathbb{F}_{5}[\mathrm{i}]$ n'est pas intègre.

    *C'est l'exercice 16 qui commande* : $\mathbb{F}_{p}[\mathrm{i}]$ est un corps exactement lorsque $-1$ n'est pas un carré modulo $p$, c'est-à-dire pour $p \equiv 3 \pmod{4}$ ; le chapitre 2 le réinterprétera par $\mathbb{F}_{p}[\mathrm{i}] \simeq \mathbb{F}_{p}[X]/\langle X^{2} + 1 \rangle$.

    1.5em

    ![Figure](documents/figures/368d642e305c46e1.svg)

    La figure montre les puissances successives de $1 + \mathrm{i}$ dans $\mathbb{F}_{3}[\mathrm{i}]$ : elles parcourent les huit éléments non nuls avant de revenir à $1$, en rouge. Le groupe multiplicatif de ce corps à $9$ éléments est donc cyclique, d'ordre $8$, engendré par $1 + \mathrm{i}$ ; le chapitre 8 du cours montre que c'est le cas de tout corps fini.
- id: "l3-sa-01-19"
  feuille: "f-l3-sa-01"
  numero: 19
  partie: "Anneaux, corps"
  etoiles: 1
  types: [Calcul]
  mots_cles: [anneaux et corps]
  noeuds: [a-anneau, a-corps, a-fractions]
  notions: [anneau, anneau-integre, corps, sous-anneau]
  source: "Exo7 (fic00030), exercices 6 et 7 (1)"
  page_enonce: 6
  page_corrige: 11
  enonce: |
    Parmi les parties suivantes de $\mathbb{C}$, lesquelles sont des sous-anneaux ? des sous-corps ?

    **1.** l'ensemble $D = \bigcup_{n \in \mathbb{N}}10^{-n}\mathbb{Z}$ des nombres décimaux ;

    **2.** l'ensemble $\mathbb{Z}_{(p)}$ des rationnels $\frac{m}{n}$, avec $m \in \mathbb{Z}$, $n \in \mathbb{N}^{*}$, $m \wedge n = 1$ et $p$ ne divisant pas $n$, où $p$ est un nombre premier fixé ;

    **3.** $\mathbb{Z}[\mathrm{i}] = \mathbb{Z} + \mathbb{Z}\mathrm{i}$ et $\mathbb{Z}[\sqrt{2}] = \mathbb{Z} + \mathbb{Z}\sqrt{2}$ ;

    **4.** $\mathbb{Q}[\mathrm{i}] = \mathbb{Q} + \mathbb{Q}\mathrm{i}$ et $\mathbb{Q}[\sqrt{2}] = \mathbb{Q} + \mathbb{Q}\sqrt{2}$.

    Déterminer les groupes $D^{\times}$ et $\mathbb{Z}_{(p)}^{\times}$.
  corrige: |
    On utilise le critère : une partie de $\mathbb{C}$ est un sous-anneau si elle contient $1$ et est stable par différence et par produit.

    **1.** $D$ contient $1$, et $\frac{a}{10^{n}} \pm \frac{b}{10^{m}}$, $\frac{a}{10^{n}}\frac{b}{10^{m}}$ s'écrivent avec le dénominateur $10^{n + m}$ : $D$ est un sous-anneau.

    Ce n'est pas un corps, car $\frac{1}{3} = \frac{a}{10^{n}}$ donnerait $10^{n} = 3a$.

    Si $x = \frac{a}{10^{n}}$ est inversible dans $D$, $\frac{1}{x} = \frac{b}{10^{m}}$ et $ab = 10^{n + m}$, donc $a = \pm 2^{\alpha}5^{\beta}$ ; réciproquement $\frac{1}{2} = \frac{5}{10}$ et $\frac{1}{5} = \frac{2}{10}$ sont dans $D$. Ainsi $\boxed{D^{\times} = \{\pm 2^{\alpha}5^{\beta} ; \alpha, \beta \in \mathbb{Z}\}}$.

    **2.** Un rationnel est dans $\mathbb{Z}_{(p)}$ dès qu'il s'écrit $\frac{m}{n}$ avec $p \nmid n$, irréductible ou non : le dénominateur réduit divise $n$. Comme $p \nmid nn'$ si $p \nmid n$ et $p \nmid n'$ (lemme d'Euclide), $\mathbb{Z}_{(p)}$ est stable par différence et produit ; il contient $1$.

    Ce n'est pas un corps, puisque $\frac{1}{p} \notin \mathbb{Z}_{(p)}$.

    Un élément $\frac{m}{n}$ (irréductible, $p \nmid n$) est inversible si et seulement si $\frac{n}{m} \in \mathbb{Z}_{(p)}$, c'est-à-dire $p \nmid m$ : $\boxed{\mathbb{Z}_{(p)}^{\times} = \{\tfrac{m}{n} ; p \nmid m, \ p \nmid n\}}$.

    **3.** $(a + b\mathrm{i})(c + d\mathrm{i}) = (ac - bd) + (ad + bc)\mathrm{i}$ et $(a + b\sqrt{2})(c + d\sqrt{2}) = (ac + 2bd) + (ad + bc)\sqrt{2}$ : $\mathbb{Z}[\mathrm{i}]$ et $\mathbb{Z}[\sqrt{2}]$ sont des sous-anneaux.

    Ce ne sont pas des corps : $\frac{1}{2}$ n'en fait pas partie (pour $\mathbb{Z}[\sqrt{2}]$, l'écriture $a + b\sqrt{2}$, $a$, $b \in \mathbb{Q}$, est unique, $\sqrt{2}$ étant irrationnel).

    **4.** Les mêmes calculs montrent que $\mathbb{Q}[\mathrm{i}]$ et $\mathbb{Q}[\sqrt{2}]$ sont des sous-anneaux.

    Ce sont des corps : pour $(a, b) \neq (0, 0)$, 
    $$\frac{1}{a + b\mathrm{i}} = \frac{a - b\mathrm{i}}{a^{2} + b^{2}}, \qquad \frac{1}{a + b\sqrt{2}} = \frac{a - b\sqrt{2}}{a^{2} - 2b^{2}},$$
     où $a^{2} - 2b^{2} \neq 0$ car $\sqrt{2} \notin \mathbb{Q}$.

    *La même astuce, multiplier par le « conjugué », servira au chapitre 7 pour inverser dans $\mathbb{Q}(\alpha)$.*

    1.5em

    ![Figure](documents/figures/bf99eaf42ddea122.svg)

    Le diagramme range ces sous-anneaux de $\mathbb{C}$ par inclusion, de bas en haut ; les corps sont encadrés en rouge. $D$ et $\mathbb{Z}_{(p)}$ sont intermédiaires entre $\mathbb{Z}$ et $\mathbb{Q}$ : ce sont des anneaux de fractions, obtenus en autorisant certains dénominateurs seulement.
- id: "l3-sa-01-20"
  feuille: "f-l3-sa-01"
  numero: 20
  partie: "Anneaux, corps"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [anneaux et corps, corps des fractions]
  noeuds: [a-anneau, a-corps, a-fractions]
  notions: [anneau, anneau-integre, corps, sous-anneau, corps-fractions]
  source: "examen du 15/12/2014, exercice 2 ; L3 Algèbre 2, TD 5 (2011-12), exercice 2 (1)-(2)"
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Soit $S$ une partie de $\mathbb{C}$. On note $\mathbb{Q}(S)$ l'intersection des sous-corps de $\mathbb{C}$ qui contiennent $S$, et $\mathbb{Q}[S]$ l'intersection des sous-anneaux de $\mathbb{C}$ qui contiennent $\mathbb{Q}$ et $S$.

    **1.** Montrer que $\mathbb{Q}(S)$ est un sous-corps de $\mathbb{C}$, et que $\mathbb{Q}[S]$ est une sous-$\mathbb{Q}$-algèbre de $\mathbb{C}$. Montrer que $\mathbb{Q}(S)$ est isomorphe au corps des fractions de $\mathbb{Q}[S]$. *On utilisera la propriété universelle du corps des fractions.*

    **2.** Montrer que $\mathbb{Z}[\mathrm{i}] = \{x + y\mathrm{i} ; x, y \in \mathbb{Z}\}$ est un anneau intègre.

    **3.** On note $\mathbb{Q}(\mathrm{i}) = \mathbb{Q}(\{\mathrm{i}\})$. Montrer que $\mathbb{Q}(\mathrm{i}) = \{a + b\mathrm{i} ; a, b \in \mathbb{Q}\}$. Est-il vrai que $\mathbb{Q}(\mathrm{i})$ est le corps des fractions de l'anneau $\mathbb{Z}[\mathrm{i}]$ ?
  corrige: |
    **1.** Une intersection de sous-corps de $\mathbb{C}$ contient $0$ et $1$, est stable par différence, produit et passage à l'inverse d'un élément non nul : c'est un sous-corps, et $\mathbb{Q}(S)$ est le plus petit sous-corps contenant $S$.

    De même, $\mathbb{Q}[S]$ est le plus petit sous-anneau contenant $\mathbb{Q}$ et $S$ ; il est stable par multiplication par un rationnel, donc c'est une sous-$\mathbb{Q}$-algèbre.

    Tout sous-corps de $\mathbb{C}$ contient $\mathbb{Q}$ (cours, prop. 17), donc $\mathbb{Q}(S)$ est un sous-anneau contenant $\mathbb{Q}$ et $S$ : $\mathbb{Q}[S] \subset \mathbb{Q}(S)$.

    L'anneau $\mathbb{Q}[S]$, sous-anneau de $\mathbb{C}$, est intègre ; par la propriété universelle du corps des fractions (cours, th. 5), l'inclusion de $\mathbb{Q}[S]$ dans le corps $\mathbb{Q}(S)$ se prolonge en un morphisme $\varphi : \operatorname{Frac}(\mathbb{Q}[S]) \to \mathbb{Q}(S)$, $\varphi(a/b) = ab^{-1}$, injectif car défini sur un corps (prop. 16).

    Son image $L = \{ab^{-1} ; a, b \in \mathbb{Q}[S], b \neq 0\}$ est un sous-corps de $\mathbb{C}$ qui contient $S$, donc $L \supset \mathbb{Q}(S)$ ; comme $L \subset \mathbb{Q}(S)$, $\varphi$ est surjectif : $\mathbb{Q}(S) \simeq \operatorname{Frac}(\mathbb{Q}[S])$.

    **2.** $\mathbb{Z}[\mathrm{i}]$ est un sous-anneau de $\mathbb{C}$ (exercice 19), et un sous-anneau d'un corps est intègre : $zw = 0$ dans $\mathbb{C}$ impose $z = 0$ ou $w = 0$.

    **3.** $K = \{a + b\mathrm{i} ; a, b \in \mathbb{Q}\}$ est un sous-corps de $\mathbb{C}$ contenant $\mathrm{i}$ (exercice 19), donc $\mathbb{Q}(\mathrm{i}) \subset K$ ; et $\mathbb{Q}(\mathrm{i})$, qui contient $\mathbb{Q}$ et $\mathrm{i}$, contient tous les $a + b\mathrm{i}$ : $\boxed{\mathbb{Q}(\mathrm{i}) = K}$.

    Tout élément de $K$ s'écrit, en réduisant $a$ et $b$ au même dénominateur $n \geqslant 1$, $a + b\mathrm{i} = \frac{a' + b'\mathrm{i}}{n}$ avec $a'$, $b' \in \mathbb{Z}$ : c'est un quotient de deux éléments de $\mathbb{Z}[\mathrm{i}]$.

    Le raisonnement de la question 1, appliqué à $\mathbb{Z}[\mathrm{i}] \subset \mathbb{Q}(\mathrm{i})$, montre que $\operatorname{Frac}(\mathbb{Z}[\mathrm{i}]) \to \mathbb{Q}(\mathrm{i})$, $a/b \mapsto ab^{-1}$, est injectif, et il est surjectif par ce qui précède : *oui, $\mathbb{Q}(\mathrm{i})$ est le corps des fractions de $\mathbb{Z}[\mathrm{i}]$*. C'est le résultat annoncé au chapitre 1 du cours. Il en va de même de $\mathbb{Q}(\sqrt{2})$ pour $\mathbb{Z}[\sqrt{2}]$ ; en revanche $\mathbb{Q}(\mathrm{i})$ est aussi le corps des fractions de l'anneau plus gros $\mathbb{Z}[\frac{\mathrm{i}}{2}]$ : *un corps est le corps des fractions de beaucoup d'anneaux*.

