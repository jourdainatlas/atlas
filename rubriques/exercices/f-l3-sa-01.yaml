  source: "Exo7 (fic00020), exercices 24, 25 et 29"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** Soit $G$ un groupe commutatif et $a$, $b \in G$ d'ordres finis $m$ et $n$. Montrer que $ab$ est d'ordre fini divisant $\mathrm{ppcm}(m, n)$, et que $\operatorname{ord}(ab) = mn$ lorsque $m \wedge n = 1$.

    **2.** En déduire que les éléments d'ordre fini d'un groupe commutatif forment un sous-groupe. L'exercice 8 montre que ce n'est plus vrai sans commutativité.

    **3.** Le *centre* d'un groupe $G$ est $Z(G) = \{a \in G ; ax = xa \text{ pour tout } x \in G\}$. Montrer que $Z(G)$ est un sous-groupe commutatif de $G$. Montrer que, si $G$ possède un unique élément d'ordre $2$, cet élément appartient à $Z(G)$.
  corrige: |
    **1.** Comme $G$ est commutatif, $(ab)^{k} = a^{k}b^{k}$. Pour $L = \mathrm{ppcm}(m, n)$, $a^{L} = b^{L} = e$, donc $(ab)^{L} = e$ et $\operatorname{ord}(ab)$ divise $L$.

    Supposons $m \wedge n = 1$ et soit $k = \operatorname{ord}(ab)$ : de $(ab)^{k} = e$ vient $a^{k} = b^{-k} \in \langle a \rangle \cap \langle b \rangle$. Ce sous-groupe a un ordre qui divise $m$ et $n$ (Lagrange), donc égal à $1$ : $a^{k} = b^{k} = e$, d'où $m \mid k$ et $n \mid k$, puis $mn \mid k$.

    Comme $k \mid L = mn$, $\boxed{\operatorname{ord}(ab) = mn}$.

    *Sans l'hypothèse $m \wedge n = 1$, l'ordre de $ab$ peut être strictement plus petit* : pour $b = a^{-1}$, $ab = e$.

    **2.** L'ensemble $T$ des éléments d'ordre fini contient $e$ ; si $a$, $b \in T$, $b^{-1}$ est d'ordre fini (exercice 8) et $ab^{-1} \in T$ par la question 1.

    Dans $\mathrm{SL}_{2}(\mathbb{Z})$, $A$ et $B$ sont d'ordre fini et $AB$ ne l'est pas : la commutativité est indispensable.

    **3.** $e \in Z(G)$ et, si $a$, $b \in Z(G)$, la relation $bx = xb$ donne $xb^{-1} = b^{-1}x$, d'où 
    $$ab^{-1}x = axb^{-1} = xab^{-1} :$$
     $Z(G)$ est un sous-groupe, commutatif par définition. Soit $t$ l'unique élément d'ordre $2$. Pour tout $y \in G$, $yty^{-1}$ est d'ordre $2$ (exercice 8), donc égal à $t$ : $yt = ty$, et $t \in Z(G)$.
- id: "l3-sa-01-10"
