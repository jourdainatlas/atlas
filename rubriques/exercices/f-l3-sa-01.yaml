  enonce: |
    **1.** Montrer qu'un groupe d'ordre $35$ possède un élément d'ordre $5$ et un élément d'ordre $7$. *On pourra raisonner par l'absurde et compter les éléments selon leur ordre.*

    **2.** Soit $p$ un nombre premier. Montrer qu'un groupe d'ordre $2p$ possède un élément d'ordre $2$ et un élément d'ordre $p$.
  corrige: |
    **1.** Les ordres des éléments divisent $35$ (cours, prop. 6).

    S'il existe $x$ d'ordre $35$, $x^{7}$ est d'ordre $5$ et $x^{5}$ d'ordre $7$ (exercice 8).

    Sinon, les $34$ éléments distincts de $e$ sont d'ordre $5$ ou $7$.

    Chaque élément d'ordre $5$ engendre un sous-groupe d'ordre $5$, qui contient exactement $4$ éléments d'ordre $5$, et deux sous-groupes d'ordre $5$ distincts ont une intersection d'ordre divisant $5$ et distinct de $5$, donc triviale : le nombre d'éléments d'ordre $5$ est un multiple $4a$ de $4$.

    De même, celui des éléments d'ordre $7$ est un multiple $6b$ de $6$.

    De $4a + 6b = 34$ on tire $a \neq 0$ (sinon $6 \mid 34$) et $b \neq 0$ (sinon $4 \mid 34$) : il y a des éléments d'ordre $5$ et d'ordre $7$.

    **2.** Si $p = 2$, le groupe est d'ordre $4$, pair, et a un élément d'ordre $2$ (exercice 4).

    Supposons $p$ impair. Un élément d'ordre $2$ existe encore par l'exercice 4, l'ordre $2p$ étant pair.

    Les ordres possibles sont $1$, $2$, $p$, $2p$.

    S'il existe $x$ d'ordre $2p$, $x^{2}$ est d'ordre $p$.

    Sinon, s'il n'y avait aucun élément d'ordre $p$, on aurait $x^{2} = e$ pour tout $x$, et l'ordre du groupe serait une puissance de $2$ (exercice 4), ce que $2p$ n'est pas.
- id: "l3-sa-01-12"
  feuille: "f-l3-sa-01"
  numero: 12
  partie: "Petits groupes, théorème de Lagrange"
