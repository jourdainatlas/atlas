  enonce: |
    En se plaçant modulo un entier bien choisi, montrer que les équations suivantes n'ont pas de solution dans $\mathbb{Z}$ :

    **1.** $3x^{2} + 2 = y^{2}$ ;

    **2.** $x^{2} + y^{2} = 2003$, puis $x^{2} + y^{2} = 2004$ ;

    **3.** $x^{2} + y^{2} + z^{2} = 1999$ ;

    **4.** $x^{3} + y^{3} + z^{3} = 5$ ;

    **5.** $x_{1}^{4} + x_{2}^{4} + \cdots + x_{15}^{4} = 7936$.
  corrige: |
    Le principe est toujours le même : une égalité dans $\mathbb{Z}$ reste vraie modulo $n$, et l'on choisit $n$ pour que les puissances en jeu prennent peu de valeurs (exercice 13).

    **1.** Modulo $3$ : $y^{2} \equiv 2$, impossible.

    **2.** Modulo $4$, $x^{2} + y^{2} \in \{0, 1, 2\}$, alors que $2003 \equiv 3$.

    Pour $2004 \equiv 0 \pmod{4}$, le module $4$ ne conclut pas ; on travaille modulo $3$ : $2004 \equiv 0$, et $x^{2} + y^{2} \equiv 0 \pmod{3}$ impose $x \equiv y \equiv 0$, car $1 + 0$ et $1 + 1$ ne sont pas nuls. Alors $9$ divise $x^{2} + y^{2} = 2004 = 9 \times 222 + 6$, ce qui est faux.

    *Il arrive qu'un seul module ne suffise pas, et qu'il faille raisonner modulo $3$, puis modulo $9$.*

    **3.** Modulo $8$, une somme de trois éléments de $\{0, 1, 4\}$ ne vaut jamais $7$ (on obtient $0$, $1$, $2$, $3$, $4$, $5$, $6$), alors que $1999 = 8 \times 249 + 7$.

    **4.** Modulo $9$, une somme de trois éléments de $\{0, 1, -1\}$ est comprise entre $-3$ et $3$, donc ne vaut jamais $5 \equiv -4$.

    **5.** Modulo $16$, $x_{1}^{4} + \cdots + x_{15}^{4}$ est congru au nombre de $x_{i}$ impairs, compris entre $0$ et $15$.

    Comme $7936 = 16 \times 496 \equiv 0$, tous les $x_{i}$ sont pairs ; en posant $x_{i} = 2y_{i}$, on obtient $\sum y_{i}^{4} = 496 = 16 \times 31 \equiv 0$, et tous les $y_{i}$ sont pairs ; avec $y_{i} = 2z_{i}$, $\sum z_{i}^{4} = 31 \equiv 15 \pmod{16}$, et les quinze $z_{i}$ sont impairs. Mais alors $z_{i}^{4} \geqslant 1$, et $z_{i}^{4} \leqslant 31 < 81$ impose $z_{i} = \pm 1$ : la somme vaut $15 \neq 31$. Il n'y a pas de solution.
- id: "l3-sa-01-15"
  feuille: "f-l3-sa-01"
  numero: 15
  partie: "Congruences"
  etoiles: 1
  types: [Calcul]
  mots_cles: [congruences]
  noeuds: [z-zn]
  notions: [anneau-zn, inversible]
  source: "Exo7 (fic00029), exercices 4 et 5 ; Exo7 (fic00030), exercice 2 (2)"
  page_enonce: 5
  page_corrige: 9
  enonce: |
    **1.** Déterminer les éléments inversibles de $\mathbb{Z}/5\mathbb{Z}$, $\mathbb{Z}/6\mathbb{Z}$, $\mathbb{Z}/9\mathbb{Z}$ et $\mathbb{Z}/11\mathbb{Z}$, et leurs inverses.

    **2.** Calculer $107 \wedge 281$ par l'algorithme d'Euclide, et en déduire une relation de Bézout entre $107$ et $281$. Quel est l'inverse de $107$ modulo $281$ ? celui de $281$ modulo $107$ ?

    **3.** Résoudre dans $\mathbb{Z}$ : 
    $$2x + 3 \equiv 10 \pmod{13} ; \qquad \left\{ \begin{array}{l} 2x + 3y \equiv 5 \pmod{7} \\ 5x + 2y \equiv 2 \pmod{7} \end{array} \right. ; \qquad x^{2} + 2x + 14 \equiv 0 \pmod{17}.$$

    **4.** Résoudre $2x = \overline{3}$ et $2x = \overline{6}$ dans $\mathbb{Z}/10\mathbb{Z}$. Plus généralement, soit $n \geqslant 2$, $a$, $b \in \mathbb{Z}$ et $d = a \wedge n$. Montrer que l'équation $\overline{a}x = \overline{b}$ a une solution dans $\mathbb{Z}/n\mathbb{Z}$ si et seulement si $d$ divise $b$, et qu'elle en a alors exactement $d$.
  corrige: |
    **1.** D'après le cours (prop. 12), les inversibles sont les classes premières avec le module ; on note $a \leftrightarrow b$ deux inverses l'un de l'autre :

    • $(\mathbb{Z}/5\mathbb{Z})^{\times} = \{\overline{1}, \overline{2}, \overline{3}, \overline{4}\}$, avec $1 \leftrightarrow 1$, $2 \leftrightarrow 3$, $4 \leftrightarrow 4$ ;

    • $(\mathbb{Z}/6\mathbb{Z})^{\times} = \{\overline{1}, \overline{5}\}$, chacun étant son propre inverse ;

    • $(\mathbb{Z}/9\mathbb{Z})^{\times} = \{\overline{1}, \overline{2}, \overline{4}, \overline{5}, \overline{7}, \overline{8}\}$, avec $2 \leftrightarrow 5$, $4 \leftrightarrow 7$, $8 \leftrightarrow 8$ ;

    • $(\mathbb{Z}/11\mathbb{Z})^{\times}$ contient les dix classes non nulles, avec $2 \leftrightarrow 6$, $3 \leftrightarrow 4$, $5 \leftrightarrow 9$, $7 \leftrightarrow 8$, $10 \leftrightarrow 10$.

    **2.** L'algorithme d'Euclide donne successivement 
    $$281 = 2 \times 107 + 67, \quad 107 = 67 + 40, \quad 67 = 40 + 27, \quad 40 = 27 + 13, \quad 27 = 2 \times 13 + 1,$$
     donc $107 \wedge 281 = 1$. En remontant les calculs, 
    $$1 = 27 - 2 \times 13 = 3 \times 27 - 2 \times 40 = 3 \times 67 - 5 \times 40 = 8 \times 67 - 5 \times 107 = \boxed{8 \times 281 - 21 \times 107}.$$
     L'inverse de $107$ modulo $281$ est donc $-21 \equiv \boxed{260}$, et celui de $281$ modulo $107$ est $\boxed{8}$ (vérification : $281 \equiv 67$ et $67 \times 8 = 536 = 5 \times 107 + 1$).

    **3.** *Première équation* : $2x \equiv 7 \pmod{13}$ ; l'inverse de $2$ est $7$, donc $x \equiv 49 \equiv 10$ : $x \in 10 + 13\mathbb{Z}$.

    *Système* : son déterminant $2 \times 2 - 3 \times 5 = -11 \equiv 3$ est inversible modulo $7$, d'inverse $5$. Les formules de Cramer, valables dans le corps $\mathbb{F}_{7}$, donnent $x \equiv 5\,(5 \times 2 - 3 \times 2) = 20 \equiv 6$ et $y \equiv 5\,(2 \times 2 - 5 \times 5) = -105 \equiv 0$ : les solutions sont les $(x, y) \in (6 + 7\mathbb{Z}) \times 7\mathbb{Z}$.

    *Équation du second degré* : $x^{2} + 2x + 14 = (x + 1)^{2} + 13$, et $-13 \equiv 4 \pmod{17}$. Dans le corps $\mathbb{F}_{17}$, $(x + 1)^{2} = 4$ équivaut à $(x + 1 - 2)(x + 1 + 2) = 0$, donc à $x \equiv 1$ ou $x \equiv -3 \equiv 14$ : $x \in (1 + 17\mathbb{Z}) \cup (14 + 17\mathbb{Z})$.

    **4.** L'équation $2x \equiv 3 \pmod{10}$ n'a pas de solution, $2x - 3$ étant impair. L'équation $2x \equiv 6 \pmod{10}$ équivaut à $x \equiv 3 \pmod{5}$ : solutions $\overline{3}$ et $\overline{8}$ dans $\mathbb{Z}/10\mathbb{Z}$. En général, si $\overline{a}x = \overline{b}$ a une solution $x = \overline{x_{0}}$, alors $b = ax_{0} - kn$ est multiple de $d$.

    Réciproquement, si $d \mid b$, écrivons $a = da'$, $n = dn'$, $b = db'$, avec $a' \wedge n' = 1$. Alors $ax \equiv b \pmod{n}$ équivaut à $a'x \equiv b' \pmod{n'}$, soit $x \equiv x_{0} := ub' \pmod{n'}$, où $u$ est un inverse de $a'$ modulo $n'$ (cours, prop. 12).

    Les solutions dans $\mathbb{Z}/n\mathbb{Z}$ sont les classes de $x_{0} + kn'$, $0 \leqslant k < d$, deux à deux distinctes modulo $n = dn'$ : il y en a exactement $\boxed{d}$. On retrouve les deux cas précédents ($d = 2$).
- id: "l3-sa-01-16"
  feuille: "f-l3-sa-01"
  numero: 16
  partie: "Congruences"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [congruences, groupe symétrique]
  noeuds: [z-zn, v-permutations]
  notions: [anneau-zn, inversible, groupe-symetrique]
  source: "Exo7 (fic00029), exercices 6, 8 et 9"
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Soit $p$ un nombre premier.

    **1.** *(Fermat, sans le théorème de Lagrange.)* Soit $a$ un entier premier avec $p$. Montrer que $am \equiv an \pmod{p}$ si et seulement si $m \equiv n \pmod{p}$, puis que $a, 2a, \dots, (p - 1)a$ sont, modulo $p$, une permutation de $1, 2, \dots, p - 1$. En déduire que $a^{p - 1} \equiv 1 \pmod{p}$.

    **2.** *(Wilson.)* On suppose $p = 2m + 1$ impair. Montrer que $(p - 1)! \equiv -1 \pmod{p}$, puis que $(m!)^{2} \equiv (-1)^{m + 1} \pmod{p}$. *On pourra grouper chaque élément de $\mathbb{F}_{p}^{*}$ avec son inverse.*

    **3.** Soit $a$ premier avec $p$, $p$ impair. Si $x^{2} \equiv a \pmod{p}$ a une solution, montrer que $a^{(p - 1)/2} \equiv 1 \pmod{p}$. En déduire que $x^{2} \equiv -1 \pmod{p}$ a une solution si et seulement si $p \equiv 1 \pmod{4}$.
  corrige: |
    **1.** $am \equiv an \pmod{p}$ signifie que $p$ divise $a(m - n)$ ; comme $p \nmid a$, c'est équivalent à $p \mid m - n$ (lemme d'Euclide). La multiplication par $\overline{a}$ est donc injective sur $\mathbb{F}_{p}$ ; elle envoie $\mathbb{F}_{p}^{*}$ dans $\mathbb{F}_{p}^{*}$, donc le permute, puisqu'il est fini.

    Par suite $\prod_{k = 1}^{p - 1}(ka) \equiv \prod_{k = 1}^{p - 1}k$, c'est-à-dire $a^{p - 1}(p - 1)! \equiv (p - 1)! \pmod{p}$, et l'on simplifie par $(p - 1)!$, premier avec $p$ : $a^{p - 1} \equiv 1 \pmod{p}$. Le même argument, appliqué à $(\mathbb{Z}/n\mathbb{Z})^{\times}$, démontre le théorème d'Euler sans le théorème de Lagrange.

    **2.** Dans le corps $\mathbb{F}_{p}$, $x = x^{-1}$ équivaut à $x^{2} = 1$, soit $(x - 1)(x + 1) = 0$, soit $x = \pm 1$.

    Les autres éléments de $\mathbb{F}_{p}^{*}$ se regroupent en paires $\{x, x^{-1}\}$ de produit $1$, et le produit de tous les éléments vaut $1 \times (-1) = -1$ : $(p - 1)! \equiv -1 \pmod{p}$.

    Ensuite, $p - k \equiv -k$ donne 
    $$(p - 1)! = \prod_{k = 1}^{m}k \prod_{k = 1}^{m}(p - k) \equiv (-1)^{m}(m!)^{2} \pmod{p},$$
     d'où $(m!)^{2} \equiv (-1)^{m + 1} \pmod{p}$.

    1.5em

    ![Figure](documents/figures/2e5dfecfd9bfab4c.svg)

    La figure illustre le cas $p = 13$ : les douze éléments de $\mathbb{F}_{13}^{*}$ sont sur un cercle, chaque corde relie un élément à son inverse ($2 \leftrightarrow 7$, $3 \leftrightarrow 9$, $4 \leftrightarrow 10$, $5 \leftrightarrow 8$, $6 \leftrightarrow 11$), et seuls $1$ et $-1$, en rouge, restent seuls ; le produit total vaut donc $-1$.

    **3.** Si $x^{2} \equiv a$, alors $p \nmid x$, et $a^{(p - 1)/2} \equiv x^{p - 1} \equiv 1$ par Fermat.

    Si $-1$ est un carré modulo $p$, on obtient $(-1)^{(p - 1)/2} \equiv 1$, et $-1 \not\equiv 1$ puisque $p > 2$ : $(p - 1)/2$ est pair, $p \equiv 1 \pmod{4}$.

    Réciproquement, si $p = 4k + 1$, alors $m = 2k$ est pair et la question 2 donne $(m!)^{2} \equiv -1$ : $x = m!$ est une solution explicite.

    Pour $p = 13$, $6! = 720 \equiv 5$ et $5^{2} = 25 \equiv -1 \pmod{13}$.
- id: "l3-sa-01-17"
  feuille: "f-l3-sa-01"
