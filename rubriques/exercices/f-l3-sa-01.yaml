  source: "Exo7 (fic00020), exercices 34 et 35"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    **1.** Soit $n \geqslant 0$ et $p$ un nombre premier divisant $F_{n} = 2^{2^{n}} + 1$. En étudiant l'ordre de $\overline{2}$ dans $(\mathbb{Z}/p\mathbb{Z})^{\times}$, montrer que $p$ est de la forme $k\,2^{n + 1} + 1$, avec $k \in \mathbb{N}$.

    **2.** Vérifier que $641 = 5 \times 2^{7} + 1$ divise $F_{5} = 2^{32} + 1$. *On pourra remarquer que $641 = 5^{4} + 2^{4}$.*

    **3.** Soit $n \geqslant 1$. En étudiant l'ordre de $\overline{2}$ dans $(\mathbb{Z}/(2^{n} - 1)\mathbb{Z})^{\times}$, montrer que $n$ divise $\varphi(2^{n} - 1)$, où $\varphi$ est l'indicatrice d'Euler.
  corrige: |
    **1.** Le nombre $F_{n}$ est impair, donc $p \neq 2$, et $2^{2^{n}} \equiv -1 \pmod{p}$, d'où $2^{2^{n + 1}} \equiv 1 \pmod{p}$. L'ordre de $\overline{2}$ dans $(\mathbb{Z}/p\mathbb{Z})^{\times}$ divise donc $2^{n + 1}$ mais pas $2^{n}$, puisque $-1 \not\equiv 1 \pmod{p}$ : il vaut $2^{n + 1}$.

    Par le théorème de Lagrange, il divise l'ordre $p - 1$ du groupe : $\boxed{p = k\,2^{n + 1} + 1}$.

    **2.** On a $5 \times 2^{7} \equiv -1$ et $5^{4} \equiv -2^{4} \pmod{641}$, donc 
    $$2^{32} = 2^{4}\,(2^{7})^{4} \equiv -5^{4}\,(2^{7})^{4} = -(5 \times 2^{7})^{4} \equiv -(-1)^{4} = -1 \pmod{641}.$$
     Ainsi $641$ divise $F_{5} = 4\,294\,967\,297$ : c'est ainsi qu'Euler montra que $F_{5}$ n'est pas premier, contrairement à ce qu'avait conjecturé Fermat. Le diviseur $641 = 10 \times 2^{6} + 1$ a bien la forme prévue par la question 1 pour $n = 5$ ; cette forme réduit fortement les essais, puisque seuls les premiers $\equiv 1 \pmod{64}$ sont à tester.

    **3.** Pour $n = 1$, $\varphi(1) = 1$ est divisible par $1$. Soit $n \geqslant 2$ et $N = 2^{n} - 1 \geqslant 3$, impair, donc premier avec $2$ : $\overline{2} \in (\mathbb{Z}/N\mathbb{Z})^{\times}$.

    On a $2^{n} \equiv 1 \pmod{N}$ et, pour $1 \leqslant k < n$, $0 < 2^{k} - 1 < N$, donc $2^{k} \not\equiv 1$ : l'ordre de $\overline{2}$ est exactement $n$.

    Il divise l'ordre $\varphi(N)$ du groupe (cours, prop. 12 et th. 1) : $n \mid \varphi(2^{n} - 1)$.
- id: "l3-sa-01-13"
  feuille: "f-l3-sa-01"
  numero: 13
  partie: "Congruences"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [congruences]
