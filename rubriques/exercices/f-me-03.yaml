  enonce: |
    On pose $J=\begin{pmatrix} 0&-1\\1&0 \end{pmatrix}$ et, pour tout nombre complexe $z=a+ib$ avec $a$ et $b$ réels : 
    $$M(z)=aI_{2}+bJ=\begin{pmatrix} a&-b\\b&a \end{pmatrix}.$$

    **1.** Calculer $J^{2}$, $J^{3}$ et $J^{4}$. En déduire $J^{n}$ selon le reste de la division euclidienne de $n$ par $4$, et comparer avec les puissances de $i$.

    **2.** Montrer que, pour tous complexes $z$ et $z'$, $M(z)+M(z')=M(z+z')$ et $M(z)M(z')=M(zz')$.

    **3.** Montrer que $\det\big(M(z)\big)=z\overline{z}$. En déduire que $M(z)$ est inversible si et seulement si $z\neq 0$, et que $M(z)^{-1}=M\!\left(\dfrac{1}{z}\right)$.

    **4.** À l'aide du chapitre 2, calculer $\begin{pmatrix} 1&-1\\1&1 \end{pmatrix}^{2026}$.
  corrige: |
    **1.** On obtient $J^{2}=\begin{pmatrix} -1&0\\0&-1 \end{pmatrix}=-I_{2}$, puis $J^{3}=-J$ et $J^{4}=I_{2}$. Si $n=4q+r$, alors $J^{n}=(J^{4})^{q}J^{r}=J^{r}$, d'où $J^{n}=I_{2}$, $J$, $-I_{2}$ ou $-J$ selon que $r=0$, $1$, $2$ ou $3$. C'est exactement le comportement des puissances de $i$ (exercice 3 du chapitre 2) : la matrice $J$ joue le rôle de $i$.

    **2.** La somme est immédiate : $M(z)+M(z')=(a+a')I_{2}+(b+b')J=M(z+z')$. Pour le produit, $I_{2}$ commute avec $J$ et $J^{2}=-I_{2}$, donc : 
    $$M(z)M(z')=(aI_{2}+bJ)(a'I_{2}+b'J)=(aa'-bb')I_{2}+(ab'+ba')J=M(zz'),$$
     puisque $zz'=(aa'-bb')+i(ab'+ba')$.

    **3.** $\det\big(M(z)\big)=a\times a-(-b)\times b=a^{2}+b^{2}=z\overline{z}$. D'après la Proposition 4 du cours, $M(z)$ est inversible si et seulement si $a^{2}+b^{2}\neq 0$, c'est-à-dire $z\neq 0$. Dans ce cas, d'après la question 2, $M(z)M\!\left(\frac{1}{z}\right)=M(1)=I_{2}$, et de même dans l'autre ordre, donc $\boxed{M(z)^{-1}=M\!\left(\dfrac{1}{z}\right)}$.

    **4.** La matrice est $M(1+i)$. D'après la question 2 (par récurrence), $M(1+i)^{n}=M\big((1+i)^{n}\big)$, et d'après l'exercice 3 du chapitre 2, $(1+i)^{2026}=2^{1013}i$. Ainsi : 
    $$\begin{pmatrix} 1&-1\\1&1 \end{pmatrix}^{2026}=M\left(2^{1013}i\right)=2^{1013}J=\boxed{\begin{pmatrix} 0&-2^{1013}\\2^{1013}&0 \end{pmatrix}}$$

    L'application $z\mapsto M(z)$ transporte les calculs sur les complexes en calculs matriciels : on peut ainsi « construire » $\mathbb{C}$ sans postuler l'existence de $i$, ce qui répond à la démonstration admise de la Proposition 1 du chapitre 2.
- id: "me-03-25"
  feuille: "f-me-03"
  numero: 25
  titre: "Suite de Fibonacci"
  partie: "Pour aller plus loin"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [matrices, opérations matricielles, "puissances d'une matrice", suites récurrentes]
  noeuds: [v-matrices]
  notions: [espace-matrices]
  source: "inspiré de poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), § 1.3 exemple 1 et n° 10 (transposition matricielle)"
  page_enonce: 6
  page_corrige: 16
  enonce: |
    La suite de Fibonacci $(F_{n})_{n\geqslant 0}$ est définie par $F_{0}=0$, $F_{1}=1$ et, pour tout $n\in\mathbb{N}$, $F_{n+2}=F_{n+1}+F_{n}$. On pose $M=\begin{pmatrix} 1&1\\1&0 \end{pmatrix}$.

    **1.** Montrer par récurrence que, pour tout $n\in\mathbb{N}^{*}$, $M^{n}=\begin{pmatrix} F_{n+1}&F_{n}\\F_{n}&F_{n-1} \end{pmatrix}$.

    **2.** À l'aide de l'exercice 21, en déduire que, pour tout $n\in\mathbb{N}^{*}$, $F_{n+1}F_{n-1}-F_{n}^{2}=(-1)^{n}$.

    **3.** En écrivant $M^{m+n}=M^{m}M^{n}$, montrer que, pour tous $m,n\in\mathbb{N}^{*}$, $F_{m+n}=F_{m+1}F_{n}+F_{m}F_{n-1}$.

    **4.** En déduire que $F_{2n}=F_{n}\left(F_{n+1}+F_{n-1}\right)$, puis calculer $F_{20}$ à partir de $F_{9}=34$, $F_{10}=55$ et $F_{11}=89$.
  corrige: |
    **1.** On note $\mathcal{P}_{n}$ : « $M^{n}=\begin{pmatrix} F_{n+1}&F_{n}\\F_{n}&F_{n-1} \end{pmatrix}$ ».

    **Initialisation :** Pour $n=1$ : $F_{2}=1$, $F_{1}=1$, $F_{0}=0$, et la matrice vaut bien $M$.

    **Hérédité :** Si $\mathcal{P}_{k}$ est vraie, alors : 
    $$M^{k+1}=M^{k}M=\begin{pmatrix} F_{k+1}&F_{k}\\F_{k}&F_{k-1} \end{pmatrix}\begin{pmatrix} 1&1\\1&0 \end{pmatrix}=\begin{pmatrix} F_{k+1}+F_{k}&F_{k+1}\\F_{k}+F_{k-1}&F_{k} \end{pmatrix}=\begin{pmatrix} F_{k+2}&F_{k+1}\\F_{k+1}&F_{k} \end{pmatrix}.$$

    **Conclusion :** Par récurrence, $\mathcal{P}_{n}$ est vraie pour tout $n\in\mathbb{N}^{*}$.

    **2.** D'après l'exercice 21, $\det(M^{n})=\det(M)^{n}=(-1)^{n}$, puisque $\det(M)=0-1=-1$. Or $\det(M^{n})=F_{n+1}F_{n-1}-F_{n}^{2}$, d'où $\boxed{F_{n+1}F_{n-1}-F_{n}^{2}=(-1)^{n}}$. C'est l'identité de Cassini ; avec $n+1$ à la place de $n$, elle donne $F_{n}F_{n+2}-F_{n+1}^{2}=(-1)^{n+1}$, ce que le poly fait conjecturer puis démontrer par récurrence. *Vérification :* pour $n=5$, $F_{6}F_{4}-F_{5}^{2}=8\times 3-25=-1$.

    **3.** Le coefficient en haut à droite de $M^{m+n}$ vaut $F_{m+n}$. Celui de $M^{m}M^{n}$ s'obtient en multipliant la première ligne $(F_{m+1}\;;F_{m})$ de $M^{m}$ par la deuxième colonne $\begin{pmatrix} F_{n}\\F_{n-1} \end{pmatrix}$ de $M^{n}$. D'où $\boxed{F_{m+n}=F_{m+1}F_{n}+F_{m}F_{n-1}}$.

    **4.** Avec $m=n$, $F_{2n}=F_{n+1}F_{n}+F_{n}F_{n-1}=F_{n}\left(F_{n+1}+F_{n-1}\right)$. Pour $n=10$ : $F_{20}=55\times(89+34)=55\times 123=\boxed{6765}$.
