  numero: 26
  titre: "Une suite récurrente d'ordre 2"
  partie: "Pour aller plus loin"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [matrices, opérations matricielles, "puissances d'une matrice", inverse, diagonalisation, suites récurrentes]
  noeuds: [v-matrices, v-determinant]
