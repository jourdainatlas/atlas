  noeuds: [v-matrices, v-determinant, c-calcul]
  notions: [espace-matrices, inversible, determinant]
  source: "inspiré de poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), § 10.1 et n° 331 (transposition matricielle)"
  page_enonce: 6
