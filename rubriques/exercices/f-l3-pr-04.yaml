  enonce: |
    Soit $X \sim \mathcal{N}(0, 1)$ et, pour $u \in \mathbb{R}$, $g(u) = \mathbb{E}\Big[\frac{\mathrm{e}^{uX} - 1}{X}\Big]$ (on prolonge $\frac{\mathrm{e}^{ux} - 1}{x}$ par $u$ en $x = 0$).

    **1.** Montrer que $g(u)$ est bien définie.

    **2.** Soit $M > 0$. Justifier l'existence d'une constante $C_{M}$ telle que $M|x| - \frac{x^{2}}{2} \leqslant C_{M} - \frac{x^{2}}{4}$ pour tout réel $x$, puis montrer que $g$ est dérivable sur $]-M, M[$, de dérivée $u \mapsto \mathbb{E}[\mathrm{e}^{uX}]$ (théorème de dérivation sous l'intégrale, Intégration, chapitre 5).

    **3.** Calculer $\mathbb{E}[\mathrm{e}^{uX}]$, et en déduire $g$ sous la forme d'une intégrale simple.
  corrige: |
    **1.** $\big|\frac{\mathrm{e}^{ux} - 1}{x}\big| \leqslant |u|\mathrm{e}^{|ux|}$ (accroissements finis), et $\mathrm{e}^{|u||x|}\varphi_{0}(x)$ est intégrable : $g(u)$ est bien définie.

    **2.** $M|x| - \frac{x^{2}}{2} + \frac{x^{2}}{4} = M|x| - \frac{x^{2}}{4} \leqslant M^{2}$ (maximum en $|x| = 2M$), d'où $C_{M} = M^{2}$. La dérivée de $u \mapsto \frac{\mathrm{e}^{ux} - 1}{x}$ est $\mathrm{e}^{ux}$, majorée pour $|u| < M$ par $\mathrm{e}^{M|x|}$, et $\mathrm{e}^{M|x|}\varphi_{0}(x) \leqslant \frac{1}{\sqrt{2\pi}}\mathrm{e}^{C_{M} - x^{2}/4}$, intégrable et indépendant de $u$. Le théorème de dérivation sous l'intégrale donne $g'(u) = \mathbb{E}[\mathrm{e}^{uX}]$ sur $]-M, M[$, et $M$ est arbitraire.

    **3.** En complétant le carré, $\mathbb{E}[\mathrm{e}^{uX}] = \int\mathrm{e}^{ux}\varphi_{0}(x)\,\mathrm{d} x = \mathrm{e}^{u^{2}/2}\int\varphi_{0}(x - u)\,\mathrm{d} x = \mathrm{e}^{u^{2}/2}$. Comme $g(0) = 0$, 
    $$\boxed{g(u) = \int_{0}^{u}\mathrm{e}^{v^{2}/2}\,\mathrm{d} v}.$$
- id: "l3-pr-04-12"
  feuille: "f-l3-pr-04"
  numero: 12
  partie: "Transformations, simulation"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [simulation]
  noeuds: [p-variables]
  notions: [densite-probabilite, fonction-repartition]
  source: "Durand, exercices 2.49, 2.51 et 1.15 ; Rubenthaler, chapitre 6, exercice 5"
  page_enonce: 4
  page_corrige: 6
  enonce: |
    **1.** Soit $X$ de densité $f$ et $\phi : \mathbb{R} \to \mathbb{R}$. On suppose que $\mathbb{R}$ est, à un ensemble fini près, la réunion d'intervalles ouverts disjoints $I_{1}$, …, $I_{r}$, sur chacun desquels $\phi$ est de classe $\mathcal{C}^{1}$, de dérivée non nulle. Montrer que $\phi(X)$ admet la densité 
    $$g(y) = \sum_{k = 1}^{r}\frac{f(\psi_{k}(y))}{|\phi'(\psi_{k}(y))|}\mathbf{1}_{\phi(I_{k})}(y), \qquad \text{où } \psi_{k} = (\phi_{|I_{k}})^{-1}.$$
     Retrouver ainsi la densité de $X^{2}$ en fonction de $f$.

    **2.** Soit $X \sim \mathcal{E}(a)$ et $b \neq 0$. Déterminer les lois de $bX$ et de $\lfloor X \rfloor$.

    **3.** Soit $Y$ de densité $\frac{1}{\pi(1 + x^{2})}$ (loi de Cauchy). Montrer que $\frac{1}{Y}$ a la même loi que $Y$.
  corrige: |
    **1.** Soit $h$ continue bornée. L'ensemble fini exclu est négligeable pour la loi de $X$ ; par le théorème de transfert, puis le changement de variable $y = \phi(x)$ sur chaque $I_{k}$ (Intégration, chapitre 6, th. 2, en dimension $1$), 
    $$\mathbb{E}[h(\phi(X))] = \sum_{k = 1}^{r}\int_{I_{k}}h(\phi(x))f(x)\,\mathrm{d} x = \sum_{k = 1}^{r}\int_{\phi(I_{k})}h(y)\frac{f(\psi_{k}(y))}{|\phi'(\psi_{k}(y))|}\,\mathrm{d} y = \int_{\mathbb{R}}h(y)g(y)\,\mathrm{d} y,$$
     et $g$ est une densité de $\phi(X)$ (cours, prop. 2 et chapitre 7, prop. 1). Pour $\phi(x) = x^{2}$, avec $I_{1} = \, ]-\infty, 0[$, $I_{2} = \, ]0, +\infty[$, $\psi_{1}(y) = -\sqrt{y}$ et $\psi_{2}(y) = \sqrt{y}$, 
    $$\boxed{f_{X^{2}}(y) = \frac{f(\sqrt{y}) + f(-\sqrt{y})}{2\sqrt{y}}\mathbf{1}_{y > 0}},$$
     ce qui redonne la loi $\chi^{2}(1)$ du cours pour $X \sim \mathcal{N}(0, 1)$.

    **2.** Si $b > 0$, $\mathbb{P}(bX > t) = \mathrm{e}^{-at/b}$ : $bX \sim \mathcal{E}(\frac{a}{b})$. Si $b < 0$, $bX = -|b|X$ a la densité $\frac{a}{|b|}\mathrm{e}^{ax/|b|}\mathbf{1}_{x < 0}$. Enfin $\mathbb{P}(\lfloor X \rfloor = k) = \mathrm{e}^{-ak}(1 - \mathrm{e}^{-a})$, $k \in \mathbb{N}$ : $1 + \lfloor X \rfloor \sim \mathcal{G}(1 - \mathrm{e}^{-a})$ (exercice 7).

    **3.** $\phi(y) = \frac{1}{y}$ est de classe $\mathcal{C}^{1}$, de dérivée non nulle, sur $]-\infty, 0[$ et $]0, +\infty[$, qu'elle conserve, et $\{0\}$ est négligeable. Par la question 1, $\frac{1}{Y}$ a la densité 
    $$\frac{1}{\pi(1 + 1/y^{2})} \cdot \frac{1}{y^{2}} = \frac{1}{\pi(1 + y^{2})} :$$
     $\boxed{\frac{1}{Y} \text{ a la loi de } Y}$. Géométriquement, si $Y = \tan\Theta$ avec $\Theta$ uniforme, $\frac{1}{Y} = \tan(\frac{\pi}{2} - \Theta)$, et $\frac{\pi}{2} - \Theta$ est encore uniforme modulo $\pi$.
- id: "l3-pr-04-13"
  feuille: "f-l3-pr-04"
  numero: 13
  partie: "Transformations, simulation"
  etoiles: 2
  types: [Calcul]
  mots_cles: [simulation]
  noeuds: [p-variables]
  notions: [densite-probabilite, fonction-repartition, cosinus-sinus]
  source: "Bordeaux, TD 2, exercice 8"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    On munit $\Omega = [0, 2\pi]$ de la probabilité uniforme sur ses boréliens, et l'on note $X(\omega) = \cos\omega$ et $Y(\omega) = \sin\omega$ l'abscisse et l'ordonnée du point du cercle trigonométrique d'angle $\omega$.

    **1.** Déterminer les fonctions de répartition et les lois de $X$ et de $Y$. Les évènements $\{X \geqslant 0\}$ et $\{Y \geqslant 0\}$ sont-ils indépendants ?

    **2.** Déterminer la loi de $X^{2}$, puis celle de $X^{2} + Y^{2}$.

    **3.** Les évènements $\{|X| \geqslant 0{,}5\}$ et $\{|Y| \leqslant 0{,}5\}$ sont-ils indépendants ?
  corrige: |
    **1.** Pour $x \in [-1, 1]$, $\cos\omega \leqslant x$ si et seulement si $\omega \in [\arccos x, 2\pi - \arccos x]$, d'où 
    $$F_{X}(x) = 1 - \frac{\arccos x}{\pi}, \qquad \boxed{f_{X}(x) = \frac{1}{\pi\sqrt{1 - x^{2}}}\mathbf{1}_{]-1, 1[}(x)}$$
     (*loi de l'arc sinus*) ; $Y = \cos(\omega - \frac{\pi}{2})$ a la même loi, l'uniforme sur le cercle étant invariante par rotation. On a $\{X \geqslant 0\} \cap \{Y \geqslant 0\} = \{\omega \in [0, \frac{\pi}{2}]\}$, de probabilité $\frac{1}{4} = \frac{1}{2} \cdot \frac{1}{2}$ : ces évènements sont indépendants.

    **2.** Pour $0 \leqslant t \leqslant 1$, $\mathbb{P}(X^{2} \leqslant t) = \mathbb{P}(|X| \leqslant \sqrt{t}) = F_{X}(\sqrt{t}) - F_{X}(-\sqrt{t}) = 1 - \frac{2}{\pi}\arccos\sqrt{t}$, de dérivée $\boxed{\frac{1}{\pi\sqrt{t(1 - t)}}\mathbf{1}_{]0, 1[}(t)}$ (loi bêta $\beta(\frac{1}{2}, \frac{1}{2})$, chapitre 7). Et $X^{2} + Y^{2} = 1$ : sa loi est la masse de Dirac en $1$.

    **3.** $|X| \geqslant \frac{1}{2}$ sur une partie de $\Omega$ de longueur $\frac{4\pi}{3}$, de probabilité $\frac{2}{3}$ ; $|Y| \leqslant \frac{1}{2}$ sur une longueur $\frac{2\pi}{3}$, de probabilité $\frac{1}{3}$. Mais $|Y| \leqslant \frac{1}{2}$ entraîne $|X| \geqslant \frac{\sqrt{3}}{2} \geqslant \frac{1}{2}$ : l'intersection a la probabilité $\frac{1}{3} \neq \frac{2}{9}$. $\boxed{\text{Ils ne sont pas indépendants}}$ : $X$ et $Y$ sont liées par $X^{2} + Y^{2} = 1$.

    1.5em

    ![Figure](documents/figures/309665154fa6bde0.svg)

    La densité de l'abscisse d'un point uniforme du cercle : elle est minimale en $0$ et tend vers l'infini aux bords. Le point passe « plus de temps » près de $x = \pm 1$, où le cercle est presque vertical et où l'abscisse varie lentement.
- id: "l3-pr-04-14"
  feuille: "f-l3-pr-04"
  numero: 14
  partie: "Transformations, simulation"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [simulation]
  noeuds: [p-variables]
  notions: [densite-probabilite, fonction-repartition]
  source: "Durand, exercices 2.52 et 2.54"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    **1.** Soit $X \sim \mathcal{U}([0, N[)$, avec $N \in \mathbb{N}^{*}$. Montrer que $\lfloor X \rfloor$ et $X - \lfloor X \rfloor$ sont indépendantes, et déterminer leurs lois.

    **2.** Soit $(B_{k})_{k \geqslant 1}$ des variables indépendantes de loi $\mathcal{B}(\frac{1}{2})$. Montrer que $U = \sum_{k \geqslant 1}2^{-k}B_{k}$ suit la loi $\mathcal{U}([0, 1])$. *On pourra calculer $\mathbb{P}(U \leqslant t)$ pour $t$ dyadique.* Comparer à la construction du cours (chapitre 3, section 3.7.4).
  corrige: |
    **1.** Pour $k \in \llbracket 0, N - 1 \rrbracket$ et $z \in [0, 1[$, $\mathbb{P}(\lfloor X \rfloor = k, X - \lfloor X \rfloor \leqslant z) = \mathbb{P}(k \leqslant X \leqslant k + z) = \frac{z}{N} = \frac{1}{N} \cdot z$. Donc $\boxed{\lfloor X \rfloor \sim \mathcal{U}(\llbracket 0, N - 1 \rrbracket)}$, $\boxed{X - \lfloor X \rfloor \sim \mathcal{U}([0, 1[)}$, et elles sont indépendantes (en sommant sur $k$, puis en faisant $z \to 1$).

    **2.** Soit $t = \frac{j}{2^{n}}$, $0 \leqslant j \leqslant 2^{n}$. Notons $V_{n} = \sum_{k \leqslant n}2^{-k}B_{k}$ : $2^{n}V_{n}$ est uniforme sur $\llbracket 0, 2^{n} - 1 \rrbracket$ (ses $n$ chiffres binaires sont indépendants et équiprobables), et $0 \leqslant U - V_{n} \leqslant 2^{-n}$. Donc $U < t$ entraîne $V_{n} < t$, c'est-à-dire $2^{n}V_{n} \leqslant j - 1$, et $V_{n} \leqslant t - 2^{-n}$ entraîne $U \leqslant t$ ; ainsi 
    $$\mathbb{P}(U < t) \leqslant \frac{j}{2^{n}} \leqslant \mathbb{P}(U \leqslant t).$$
     L'égalité $U = t$ demande que les bits de $U$ coïncident avec un développement de $t$, à partir du rang $n$, ce qui est de probabilité nulle ($\mathbb{P}(B_{k} = b_{k}, k > n) = 0$). Donc $\mathbb{P}(U \leqslant t) = t$ pour $t$ dyadique, puis pour tout $t \in [0, 1]$ par monotonie et densité des dyadiques : $\boxed{U \sim \mathcal{U}([0, 1])}$. C'est la réciproque de la construction du cours (chapitre 3, section 3.7.4), qui extrait des bits indépendants d'une variable uniforme.
- id: "l3-pr-04-15"
  feuille: "f-l3-pr-04"
  numero: 15
  partie: "Transformations, simulation"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [simulation]
  noeuds: [p-variables]
  notions: [densite-probabilite, fonction-repartition]
  source: "Bordeaux, TD 2, exercice 9 ; Durand, exercices 10.23 et 10.26"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Soit $U \sim \mathcal{U}(]0, 1[)$. On rappelle (cours, th. 2) que si $F$ est une fonction de répartition et $G(u) = \inf\{x \,;\, F(x) \geqslant u\}$, la variable $G(U)$ a pour fonction de répartition $F$.

    **1.** Donner une méthode pour simuler la loi $\mathcal{E}(\lambda)$, puis la loi de Cauchy de paramètre $c > 0$, de densité $\frac{c}{\pi(c^{2} + x^{2})}$.

    **2.** Montrer que $1 + \lfloor nU \rfloor$ suit la loi uniforme sur $\llbracket 1, n \rrbracket$, et que $1 + \big\lfloor\frac{\ln U}{\ln(1 - p)}\big\rfloor$ suit la loi $\mathcal{G}(p)$, pour $p \in \, ]0, 1[$.

    **3.** Soit $\mu$ une loi sur $\{e_{1}, \dots, e_{n}\}$, et $q_{i} = \mu(\{e_{1}, \dots, e_{i}\})$. Montrer que l'algorithme « $u \leftarrow U$ ; $i \leftarrow 1$ ; tant que $u > q_{i}$, $i \leftarrow i + 1$ ; renvoyer $e_{i}$ » simule la loi $\mu$. Quel est le nombre moyen de comparaisons ? Comment numéroter les $e_{i}$ pour le minimiser ?

    **4.** Déterminer $a$ pour que $f(x) = \frac{a}{(1 + x)^{2}}\mathbf{1}_{[1, 2]}(x)$ soit une densité, calculer la fonction de répartition associée, et donner une méthode de simulation de cette loi.
  corrige: |
    **1.** Pour $\mathcal{E}(\lambda)$, $F(x) = 1 - \mathrm{e}^{-\lambda x}$ et $G(u) = -\frac{\ln(1 - u)}{\lambda}$ ; comme $1 - U$ a la loi de $U$, $\boxed{-\frac{\ln U}{\lambda} \sim \mathcal{E}(\lambda)}$. Pour la loi de Cauchy de paramètre $c$, $F(x) = \frac{1}{2} + \frac{1}{\pi}\arctan\frac{x}{c}$, et $\boxed{c\tan\big(\pi(U - \tfrac{1}{2})\big)}$ convient.

    **2.** $1 + \lfloor nU \rfloor = k$ si et seulement si $\frac{k - 1}{n} \leqslant U < \frac{k}{n}$, de probabilité $\frac{1}{n}$. Avec $q = 1 - p$, $\ln q < 0$, et pour $k \in \mathbb{N}$, 
    $$\mathbb{P}\Big(1 + \Big\lfloor\frac{\ln U}{\ln q}\Big\rfloor > k\Big) = \mathbb{P}\Big(\frac{\ln U}{\ln q} \geqslant k\Big) = \mathbb{P}(U \leqslant q^{k}) = q^{k},$$
     ce qui caractérise la loi $\mathcal{G}(p)$. C'est la partie entière d'une variable exponentielle (exercice 7).

    **3.** L'algorithme renvoie $e_{i}$ si et seulement si $q_{i - 1} < u \leqslant q_{i}$ (avec $q_{0} = 0$), ce qui arrive avec la probabilité $q_{i} - q_{i - 1} = \mu(\{e_{i}\})$ : c'est le th. 2 du cours pour une loi discrète. Il fait alors $i$ comparaisons, d'où un nombre moyen $\boxed{\sum_{i}i\,\mu(\{e_{i}\})}$, minimal lorsque les $e_{i}$ sont rangés par probabilités décroissantes (inégalité de réarrangement).

    **4.** $\int_{1}^{2}\frac{a\,\mathrm{d} x}{(1 + x)^{2}} = a\big(\frac{1}{2} - \frac{1}{3}\big) = \frac{a}{6}$, donc $\boxed{a = 6}$, et $F(x) = 3 - \frac{6}{1 + x}$ sur $[1, 2]$. En résolvant $F(x) = u$, $G(u) = \frac{3 + u}{3 - u}$ : on simule la loi par $\frac{3 + U}{3 - U}$.
- id: "l3-pr-04-16"
  feuille: "f-l3-pr-04"
  numero: 16
  partie: "Minimum, maximum, plusieurs variables"
  etoiles: 1
  types: [Calcul]
  mots_cles: [minimum et maximum]
  noeuds: [p-variables, p-independance]
  notions: [fonction-repartition, independance]
  source: "Bordeaux, TD 2, exercice 11 ; Rubenthaler, chapitre 6, exercice 6 ; Durand, exercice 10.15 (1)"
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Soit $X_{1}$, …, $X_{n}$ ($n \geqslant 2$) des variables réelles indépendantes, de fonctions de répartition $F_{1}$, …, $F_{n}$, et $Y = \max(X_{1}, \dots, X_{n})$, $Z = \min(X_{1}, \dots, X_{n})$.

    **1.** Déterminer les fonctions de répartition de $Y$ et de $Z$.

    **2.** Déterminer les densités de $Y$ et $Z$ lorsque les $X_{i}$ suivent la loi $\mathcal{E}(1)$.

    **3.** Soit $U$, $V$ indépendantes de loi $\mathcal{U}([0, 1])$. Calculer $\mathbb{P}(\min(U, V) \geqslant t)$, puis la fonction de répartition de $\min(U, V)$. Donner la fonction de répartition et la densité du maximum de trois variables indépendantes de loi $\mathcal{U}([0, 1])$.
  corrige: |
    **1.** $\{Y \leqslant t\} = \bigcap_{i}\{X_{i} \leqslant t\}$ et $\{Z > t\} = \bigcap_{i}\{X_{i} > t\}$ ; par indépendance, 
    $$\boxed{F_{Y}(t) = F_{1}(t)\cdots F_{n}(t)}, \qquad \boxed{F_{Z}(t) = 1 - (1 - F_{1}(t))\cdots(1 - F_{n}(t))}.$$

    **2.** Pour la loi $\mathcal{E}(1)$, en dérivant, $f_{Y}(t) = n(1 - \mathrm{e}^{-t})^{n - 1}\mathrm{e}^{-t}\mathbf{1}_{t \geqslant 0}$, et $\mathbb{P}(Z > t) = \mathrm{e}^{-nt}$ : $\boxed{Z \sim \mathcal{E}(n)}$.

    **3.** $\mathbb{P}(\min(U, V) \geqslant t) = (1 - t)^{2}$ et $F_{\min(U, V)}(t) = 1 - (1 - t)^{2}$ pour $t \in [0, 1]$. Le maximum de trois uniformes a la fonction de répartition $t^{3}$ et la densité $3t^{2}$ sur $[0, 1]$ : il est plutôt proche de $1$.
- id: "l3-pr-04-17"
  feuille: "f-l3-pr-04"
  numero: 17
  partie: "Minimum, maximum, plusieurs variables"
  etoiles: 2
  types: [Calcul]
  mots_cles: [minimum et maximum]
  noeuds: [p-variables, p-independance]
  notions: [fonction-repartition, independance]
  source: "Durand, exercices 2.13 et 2.9 (2)"
  page_enonce: 5
  page_corrige: 8
  enonce: |
    **1.** Jean, Luc et Marc entrent en même temps dans un bureau de poste qui a deux guichets. Jean et Luc sont servis immédiatement, et Marc attend qu'un guichet se libère. Les durées $X$, $Y$, $Z$ nécessaires pour servir Jean, Luc et Marc sont indépendantes, de loi $\mathcal{E}(a)$. Quelle est la probabilité que Marc ne soit pas le dernier à sortir ? Déterminer la loi et l'espérance du temps $T$ que Marc passe à la poste.

    **2.** Un poste de radio fonctionne avec deux piles en série, dont les durées de vie sont indépendantes, de loi $\mathcal{E}(a)$ : il s'arrête dès que l'une est usée. Quelle est la loi de sa durée de fonctionnement ?
  corrige: |
    **1.** Marc commence à l'instant $M = \min(X, Y)$, quand le premier guichet se libère. À cet instant, la personne encore servie a un temps de service restant de loi $\mathcal{E}(a)$, par l'absence de mémoire, indépendant de $Z$. Marc et elle sont dans la même situation : $\boxed{\mathbb{P}(\text{Marc n'est pas le dernier}) = \frac{1}{2}}$.

    Le temps passé par Marc est $T = M + Z$, avec $M \sim \mathcal{E}(2a)$ (exercice 16) indépendante de $Z$. Par la formule de convolution (chapitre 7, th. 2), pour $t \geqslant 0$, 
    $$f_{T}(t) = \int_{0}^{t}2a\mathrm{e}^{-2as}\,a\mathrm{e}^{-a(t - s)}\,\mathrm{d} s = \boxed{2a\,\mathrm{e}^{-at}(1 - \mathrm{e}^{-at})}, \qquad \mathbb{E}[T] = \frac{1}{2a} + \frac{1}{a} = \frac{3}{2a}.$$

    **2.** Le poste s'arrête au minimum des deux durées : sa durée de fonctionnement suit la loi $\boxed{\mathcal{E}(2a)}$, d'espérance $\frac{1}{2a}$, moitié de celle d'une pile.
- id: "l3-pr-04-18"
