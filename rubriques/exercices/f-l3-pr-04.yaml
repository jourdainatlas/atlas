  source: "Durand, exercice 1.25 (3)"
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Deux pannes se produisent indépendamment, en des points uniformes d'un tronçon d'autoroute de $100$ km. On admettra (chapitre 7) que la probabilité que le couple des deux positions tombe dans une partie $A$ de $[0, 100]^{2}$ est l'aire de $A$ divisée par $100^{2}$. Calculer la probabilité que la panne la plus proche de l'entrée soit à moins de $10$ km de celle-ci, puis, sachant cela, que les deux pannes soient distantes de plus de $60$ km.
  corrige: |
    Soit $(x, y)$ les positions. La plus proche de l'entrée est à moins de $10$ km si $\min(x, y) < 10$ : $\mathbb{P} = 1 - 0{,}9^{2} = \boxed{0{,}19}$. L'évènement « $\min < 10$ et $|x - y| > 60$ » est formé, pour $x < y$, des points $x < 10$, $y > x + 60$, d'aire $\int_{0}^{10}(40 - x)\,\mathrm{d} x = 350$, et du symétrique : aire $700$, probabilité $0{,}07$. Donc 
    $$\mathbb{P}(|x - y| > 60 \,|\, \min < 10) = \frac{0{,}07}{0{,}19} = \boxed{\frac{7}{19} \approx 0{,}37},$$
     contre $\mathbb{P}(|x - y| > 60) = 0{,}4^{2} = 0{,}16$ sans condition : savoir qu'une panne est près de l'entrée rend plus probable un grand écart.

