  enonce: |
    On dit que $X$ suit la *loi de Laplace* $\mathcal{L}(\lambda)$, avec $\lambda > 0$, si $X = \varepsilon Y$, où $\varepsilon$ et $Y$ sont indépendantes, $\mathbb{P}(\varepsilon = 1) = \mathbb{P}(\varepsilon = -1) = \frac{1}{2}$ et $Y \sim \mathcal{E}(\lambda)$. Déterminer la fonction de répartition et la densité de $X$, puis son espérance et sa variance.
  corrige: |
    Par la formule des probabilités totales, $F_{X}(x) = \frac{1}{2}\mathbb{P}(Y \leqslant x) + \frac{1}{2}\mathbb{P}(Y \geqslant -x)$ : 
    $$F_{X}(x) = \frac{1}{2}\mathrm{e}^{\lambda x} \text{ si } x < 0, \qquad F_{X}(x) = 1 - \frac{1}{2}\mathrm{e}^{-\lambda x} \text{ si } x \geqslant 0, \qquad \boxed{f_{X}(x) = \frac{\lambda}{2}\mathrm{e}^{-\lambda|x|}}.$$
     La loi est symétrique, donc $\mathbb{E}[X] = 0$, et $\operatorname{Var}(X) = \mathbb{E}[X^{2}] = \mathbb{E}[\varepsilon^{2}Y^{2}] = \mathbb{E}[Y^{2}] = \boxed{\frac{2}{\lambda^{2}}}$.
- id: "l3-pr-04-09"
  feuille: "f-l3-pr-04"
  numero: 9
  partie: "Lois usuelles, moments"
  etoiles: 2
  types: [Calcul]
  mots_cles: [lois usuelles]
  noeuds: [p-variables, p-esperance]
  notions: [densite-probabilite, esperance]
  source: "Durand, exercice 2.17"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Soit $X$ une variable réelle de loi symétrique ($X$ et $-X$ ont la même loi), avec $\mathbb{E}[X^{2}] < +\infty$, et $\varepsilon$ une variable indépendante de $X$, de loi $\mathbb{P}(\varepsilon = 1) = p = 1 - \mathbb{P}(\varepsilon = -1)$, $p \in \, ]0, 1[$.

    **1.** Déterminer la loi de $\varepsilon X$. À quelle condition sur $p$ la covariance $\mathbb{E}[X \cdot \varepsilon X] - \mathbb{E}[X]\mathbb{E}[\varepsilon X]$ est-elle nulle ? Les variables $X$ et $\varepsilon X$ sont-elles alors indépendantes ?

    **2.** Soit $Y = \mathbf{1}_{\{X > 0\}} - \mathbf{1}_{\{X < 0\}}$ le signe de $X$. Déterminer la loi de $Y$ et celle de $XY$. Calculer $\mathbb{E}[|X|Y] - \mathbb{E}[|X|]\mathbb{E}[Y]$. Les variables $|X|$ et $Y$ sont-elles indépendantes ? On traitera aussi le cas $\mathbb{P}(X = 0) > 0$.
  corrige: |
    **1.** Pour tout borélien $B$, par indépendance et symétrie, 
    $$\mathbb{P}(\varepsilon X \in B) = p\,\mathbb{P}(X \in B) + (1 - p)\mathbb{P}(-X \in B) = \mathbb{P}(X \in B) :$$
     $\varepsilon X$ a la loi de $X$. Les deux espérances sont nulles par symétrie, et la covariance vaut 
    $$\mathbb{E}[X \cdot \varepsilon X] = \mathbb{E}[\varepsilon]\mathbb{E}[X^{2}] = (2p - 1)\mathbb{E}[X^{2}] :$$
     elle est nulle si et seulement si $\boxed{p = \frac{1}{2}}$ (ou $X = 0$ p.s.). Les variables ne sont pas indépendantes pour autant, sauf si $X$ est constante : $|\varepsilon X| = |X|$, et c'est l'exemple $(X, \varepsilon X)$ du chapitre 10.

    **2.** $\mathbb{P}(Y = 1) = \mathbb{P}(X > 0) = \mathbb{P}(X < 0) = \mathbb{P}(Y = -1) = \frac{1 - \mathbb{P}(X = 0)}{2}$, $\mathbb{P}(Y = 0) = \mathbb{P}(X = 0)$, et $XY = |X|$. Comme $|X|Y = X$, $\mathbb{E}[|X|Y] = \mathbb{E}[X] = 0 = \mathbb{E}[|X|]\mathbb{E}[Y]$ : la covariance est nulle.

    Si $\mathbb{P}(X = 0) = 0$, $|X|$ et $Y$ sont indépendantes : pour $t \geqslant 0$, par symétrie, 
    $$\mathbb{P}(|X| > t, Y = 1) = \mathbb{P}(X > t) = \frac{1}{2}\mathbb{P}(|X| > t) = \mathbb{P}(|X| > t)\mathbb{P}(Y = 1),$$
     et de même pour $Y = -1$. Si $\mathbb{P}(X = 0) > 0$ (et $X$ non nulle presque sûrement), elles ne le sont pas : $\{Y = 0\} = \{|X| = 0\}$, et $\mathbb{P}(|X| = 0, Y = 0) = \mathbb{P}(X = 0) \neq \mathbb{P}(X = 0)^{2}$. Une loi symétrique sans atome en $0$ se décompose ainsi en une « valeur absolue » et un « signe » indépendants.
- id: "l3-pr-04-10"
  feuille: "f-l3-pr-04"
  numero: 10
  partie: "Lois usuelles, moments"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [lois usuelles, loi normale]
  noeuds: [p-variables, p-esperance, p-normale]
  notions: [densite-probabilite, esperance, loi-normale]
  source: "Rubenthaler, chapitre 6, exercices 11 et 13"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** *(Queue de la loi normale.)* Soit $Y \sim \mathcal{N}(0, 1)$ et $\delta > 0$. En écrivant $\mathrm{e}^{-x^{2}/2} = \frac{1}{x}\cdot x\mathrm{e}^{-x^{2}/2}$ et en intégrant par parties, montrer que 
    $$\frac{1}{\delta + \frac{1}{\delta}}\cdot\frac{\mathrm{e}^{-\delta^{2}/2}}{\sqrt{2\pi}} \leqslant \mathbb{P}(Y > \delta) \leqslant \frac{1}{\delta}\cdot\frac{\mathrm{e}^{-\delta^{2}/2}}{\sqrt{2\pi}}.$$
     *Pour la minoration, on pourra poser $G(y) = \mathbb{P}(Y > y)$, montrer que $\mathbb{P}(Y > \delta) \geqslant \delta\int_{\delta}^{+\infty}G(y)\,\mathrm{d} y$, et intégrer par parties.* En déduire un équivalent de $\mathbb{P}(Y > \delta)$ quand $\delta \to +\infty$, et encadrer $\mathbb{P}(Y > 4)$.

    **2.** Soit $X$ de densité $\sqrt{\frac{2}{\pi}}\,\mathrm{e}^{-x^{2}/2}\mathbf{1}_{x \geqslant 0}$. Reconnaître la loi de $X$ à partir d'une variable normale. Pour $u > -1$, on pose $\varphi(u) = \mathbb{E}[\mathrm{e}^{-uX}]$ ; écrire $\varphi(u)$ comme une intégrale, montrer que $\varphi$ est continue, et déterminer $\lim_{n \to +\infty}\varphi(n)$. Déterminer la densité de $Y = \mathrm{e}^{-X}$.
  corrige: |
    On note $\varphi_{0}(x) = \frac{1}{\sqrt{2\pi}}\mathrm{e}^{-x^{2}/2}$.

    **1.** Pour $x \geqslant \delta$, $\frac{1}{x} \leqslant \frac{1}{\delta}$, donc $\mathbb{P}(Y > \delta) = \int_{\delta}^{+\infty}\frac{1}{x}\,x\varphi_{0}(x)\,\mathrm{d} x \leqslant \frac{1}{\delta}\big[-\varphi_{0}\big]_{\delta}^{+\infty} = \frac{\varphi_{0}(\delta)}{\delta}$. L'intégration par parties donne plus précisément $\mathbb{P}(Y > \delta) = \frac{\varphi_{0}(\delta)}{\delta} - \int_{\delta}^{+\infty}\frac{\varphi_{0}(x)}{x^{2}}\,\mathrm{d} x$.

    Pour la minoration, $\int_{\delta}^{+\infty}\frac{\varphi_{0}(x)}{x^{2}}\,\mathrm{d} x \leqslant \frac{1}{\delta^{2}}\mathbb{P}(Y > \delta)$, d'où $\mathbb{P}(Y > \delta)\big(1 + \frac{1}{\delta^{2}}\big) \geqslant \frac{\varphi_{0}(\delta)}{\delta}$, c'est-à-dire la minoration annoncée (on peut aussi suivre l'indication). Les deux bornes sont équivalentes : $\boxed{\mathbb{P}(Y > \delta) \sim \frac{\mathrm{e}^{-\delta^{2}/2}}{\delta\sqrt{2\pi}}}$ quand $\delta \to +\infty$. Pour $\delta = 4$, $3{,}15 \times 10^{-5} \leqslant \mathbb{P}(Y > 4) \leqslant 3{,}35 \times 10^{-5}$ ; la valeur exacte est $3{,}17 \times 10^{-5}$. La queue gaussienne décroît beaucoup plus vite qu'une exponentielle.

    **2.** $X$ a la loi de $|N|$, $N \sim \mathcal{N}(0, 1)$ : $\mathbb{P}(|N| \leqslant t) = 2\Phi(t) - 1$, de dérivée $2\varphi_{0}(t)$. Par le théorème de transfert, $\varphi(u) = \int_{0}^{+\infty}\sqrt{\frac{2}{\pi}}\,\mathrm{e}^{-ux - x^{2}/2}\,\mathrm{d} x$. Pour $u \geqslant -1 + \eta$, l'intégrande est majoré par $\mathrm{e}^{(1 - \eta)x - x^{2}/2}$, intégrable : $\varphi$ est continue sur $]-1, +\infty[$ (continuité sous l'intégrale). Pour $x > 0$, $\mathrm{e}^{-nx} \to 0$, et par convergence dominée $\boxed{\varphi(n) \to 0}$. Enfin $Y = \mathrm{e}^{-X} \in \, ]0, 1]$, et par la prop. 10 du cours (transformation décroissante, réciproque $y \mapsto -\ln y$), 
    $$f_{Y}(y) = \sqrt{\frac{2}{\pi}}\,\frac{\mathrm{e}^{-(\ln y)^{2}/2}}{y}\,\mathbf{1}_{]0, 1]}(y).$$
- id: "l3-pr-04-11"
  feuille: "f-l3-pr-04"
  numero: 11
  partie: "Lois usuelles, moments"
