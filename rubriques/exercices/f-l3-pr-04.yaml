  noeuds: [p-variables, p-esperance, p-poisson-exp]
  notions: [densite-probabilite, esperance]
  source: "Bordeaux, TD 2, exercice 7"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    La durée de vie, en heures, d'une ampoule électrique suit la loi exponentielle $\mathcal{E}(\lambda)$, avec $\lambda = \frac{1}{1\,000}$. On contrôle une ampoule neuve après $300$ heures d'utilisation.

    **1.** Quelle est la probabilité qu'elle soit hors d'usage ?

    **2.** Si elle fonctionne, quelle est la probabilité que sa durée de vie soit inférieure à $400$ heures ?

    **3.** Un local est équipé de $n \geqslant 2$ ampoules neuves, dont les durées de vie sont indépendantes, de loi $\mathcal{E}(\lambda)$. Avec quelle probabilité exactement deux ampoules sont-elles hors d'usage après $300$ heures ?
  corrige: |
    **1.** $\mathbb{P}(X \leqslant 300) = 1 - \mathrm{e}^{-0{,}3} \approx \boxed{0{,}259}$.

    **2.** $\mathbb{P}(X < 400 \,|\, X > 300) = 1 - \frac{\mathrm{e}^{-0{,}4}}{\mathrm{e}^{-0{,}3}} = 1 - \mathrm{e}^{-0{,}1} \approx \boxed{0{,}095}$ : par l'absence de mémoire, c'est la probabilité qu'une ampoule neuve tombe en panne dans les $100$ premières heures.

    **3.** Les évènements « l'ampoule $i$ est hors d'usage après $300$ h » sont indépendants, de probabilité $\pi = 1 - \mathrm{e}^{-0{,}3}$ : le nombre d'ampoules hors d'usage suit la loi $\mathcal{B}(n, \pi)$, et la probabilité cherchée est $\boxed{\binom{n}{2}\pi^{2}(1 - \pi)^{n - 2}}$, soit $\binom{n}{2}(1 - \mathrm{e}^{-0{,}3})^{2}\mathrm{e}^{-0{,}3(n - 2)}$.
- id: "l3-pr-04-06"
  feuille: "f-l3-pr-04"
  numero: 6
  partie: "Lois usuelles, moments"
  etoiles: 2
  types: [Démonstration, Calcul, Modélisation]
  mots_cles: [lois usuelles, loi exponentielle]
  noeuds: [p-variables, p-esperance, p-poisson-exp]
  notions: [densite-probabilite, esperance]
  source: "Bordeaux, DS du 16/03/2016, exercice 1, partie A"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    *(Loi de Weibull.)* La loi exponentielle modélise souvent l'instant de première panne d'une machine ; il est parfois plus réaliste d'utiliser une loi de Weibull. On dit que $Y$ suit la loi de Weibull $\mathcal{W}(a, \lambda)$, avec $a > 0$ et $\lambda > 0$, si $Y = X^{1/a}$ pour une variable $X$ de loi $\mathcal{E}(\lambda)$.

    **1.** Déterminer la fonction de répartition et la densité de $Y$.

    **2.** Soit $a \geqslant 1$. Montrer que $(t + s)^{a} \geqslant s^{a} + t^{a}$ pour tous $s$, $t \geqslant 0$, puis que 
    $$\mathbb{P}(Y > t + s \,|\, Y > t) \leqslant \mathbb{P}(Y > s).$$
     Que se passe-t-il pour $0 < a \leqslant 1$ ?

    **3.** On modélise la durée de vie d'une machine, dont les pannes proviennent d'une usure mécanique, par une loi de Weibull. Vaut-il mieux prendre $a \geqslant 1$ ou $a \leqslant 1$ ?

    **4.** Exprimer $\mathbb{E}[Y]$ à l'aide de la fonction $\Gamma$ et des paramètres $a$ et $\lambda$.
  corrige: |
    **1.** Pour $y > 0$, $\mathbb{P}(Y > y) = \mathbb{P}(X > y^{a}) = \mathrm{e}^{-\lambda y^{a}}$, donc $F_{Y}(y) = 1 - \mathrm{e}^{-\lambda y^{a}}$, et par dérivation (cours, prop. 3), $Y$ a la densité $\boxed{a\lambda y^{a - 1}\mathrm{e}^{-\lambda y^{a}}\mathbf{1}_{y > 0}}$.

    **2.** Pour $a \geqslant 1$, $(t + s)^{a} = (t + s)^{a - 1}t + (t + s)^{a - 1}s \geqslant t^{a - 1}t + s^{a - 1}s$. Donc 
    $$\mathbb{P}(Y > t + s \,|\, Y > t) = \mathrm{e}^{-\lambda((t + s)^{a} - t^{a})} \leqslant \mathrm{e}^{-\lambda s^{a}} = \mathbb{P}(Y > s).$$
     Pour $0 < a \leqslant 1$, l'inégalité $(t + s)^{a} \leqslant t^{a} + s^{a}$ (concavité) renverse la conclusion. Le cas $a = 1$ est la loi exponentielle.

    **3.** Pour $a \geqslant 1$, une machine qui a déjà fonctionné un temps $t$ a moins de chances de fonctionner encore un temps $s$ qu'une machine neuve : elle vieillit. C'est le modèle de l'usure, $\boxed{a \geqslant 1}$. Le cas $a < 1$ modélise au contraire des défauts de jeunesse : une machine qui a survécu est plus fiable.

    1.5em

    ![Figure](documents/figures/cfaca7f7ea629af5.svg)

    Le taux de défaillance $\frac{f_{Y}(t)}{\mathbb{P}(Y > t)} = a\lambda t^{a - 1}$ des lois de Weibull, pour $\lambda = 1$ : croissant pour $a > 1$, constant pour $a = 1$, décroissant pour $a < 1$. C'est l'analogue continu du taux de défaillance de la feuille 3 (exercice 5).

    **4.** Par la prop. 6 du cours et le changement de variable $x = \lambda y^{a}$, 
    $$\mathbb{E}[Y] = \int_{0}^{+\infty}\mathrm{e}^{-\lambda y^{a}}\,\mathrm{d} y = \frac{\lambda^{-1/a}}{a}\int_{0}^{+\infty}x^{1/a - 1}\mathrm{e}^{-x}\,\mathrm{d} x = \boxed{\lambda^{-1/a}\,\Gamma\Big(1 + \frac{1}{a}\Big)}.$$
- id: "l3-pr-04-07"
  feuille: "f-l3-pr-04"
  numero: 7
  partie: "Lois usuelles, moments"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [lois usuelles, loi exponentielle]
  noeuds: [p-variables, p-esperance, p-poisson-exp]
  notions: [densite-probabilite, esperance]
  source: "Durand, exercices 2.4 (2)-(7) et 2.58 ; Rubenthaler, chapitre 9, exercice 3 ; Bordeaux, DS du 16/03/2016, exercice 1, partie B"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **1.** Soit $Y$ une variable strictement positive telle que $\mathbb{P}(Y \geqslant s + t \,|\, Y \geqslant s) = \mathbb{P}(Y \geqslant t)$ pour tous $s$, $t > 0$ tels que $\mathbb{P}(Y \geqslant s) > 0$.

    **(a)** Montrer que $Y_{n} = \lfloor 2^{n}Y \rfloor$ vérifie l'absence de mémoire discrète de la feuille 3 (exercice 5), et que $q_{n} = \mathbb{P}(Y_{n} \geqslant 1)$ vérifie $q_{n} = q_{n + 1}^{2}$ et $0 < q_{0} < 1$.

    **(b)** Pour $t > 0$, montrer que $\mathbb{P}(Y \leqslant t) = \lim_{n}\mathbb{P}(Y_{n} \leqslant \lfloor 2^{n}t \rfloor)$, et en déduire que $Y$ suit une loi exponentielle.

    **(c)** Pour $s \geqslant 0$, calculer $\lim_{\varepsilon \to 0}\frac{1}{\varepsilon}\mathbb{P}(Y \leqslant s + \varepsilon \,|\, Y > s)$, et interpréter lorsque $Y$ est une durée de fonctionnement.

    **2.** Soit $Y \sim \mathcal{E}(\lambda)$. Déterminer les lois de $K = \lfloor Y \rfloor$, de $1 + K$ et de $Z = Y - K$. Les variables $K$ et $Z$ sont-elles indépendantes ? Quelle est la limite de la loi de $Z$ quand $\lambda \to 0$ ?

    **3.** Soit $X \sim \mathcal{E}(\lambda)$ et $Z \sim \mathcal{G}(p)$ indépendantes. Calculer $\mathbb{P}(X \geqslant Z)$.
  corrige: |
    **1. (a)** Pour $k \in \mathbb{N}$, $\{Y_{n} \geqslant k\} = \{Y \geqslant k2^{-n}\}$, donc 
    $$\mathbb{P}(Y_{n} \geqslant k + \ell \,|\, Y_{n} \geqslant k) = \mathbb{P}(Y \geqslant \ell 2^{-n}) = \mathbb{P}(Y_{n} \geqslant \ell).$$
     Par la feuille 3 (exercice 5), $\mathbb{P}(Y_{n} \geqslant k) = q_{n}^{k}$, et $q_{n} = \mathbb{P}(Y_{n + 1} \geqslant 2) = q_{n + 1}^{2}$. Si $q_{0} = 0$, tous les $q_{n}$ sont nuls, et $\mathbb{P}(Y \geqslant 2^{-n}) = 0$ pour tout $n$, d'où $Y \leqslant 0$ presque sûrement : c'est exclu. Si $q_{0} = 1$, $\mathbb{P}(Y \geqslant k) = 1$ pour tout $k$ : $Y$ serait infinie. Donc $0 < q_{0} < 1$, et $q_{n} = q_{0}^{2^{-n}}$.

    **(b)** $\mathbb{P}(Y \geqslant k2^{-n}) = q_{0}^{k2^{-n}}$. Avec $k = \lfloor 2^{n}t \rfloor + 1$, $k2^{-n}$ décroît vers $t$ (au sens large) et $\{Y \geqslant k2^{-n}\}$ croît vers $\{Y > t\}$ ; par continuité, $\mathbb{P}(Y > t) = \lim q_{0}^{k2^{-n}} = q_{0}^{t}$. Donc $\boxed{Y \sim \mathcal{E}(\lambda)}$ avec $\lambda = -\ln q_{0}$. Cette démonstration n'utilise aucune régularité de $t \mapsto \mathbb{P}(Y > t)$, contrairement à l'approche par l'équation différentielle $G' = G'(0)G$, qui suppose la fonction de survie dérivable.

    **(c)** $\frac{1}{\varepsilon}\mathbb{P}(Y \leqslant s + \varepsilon \,|\, Y > s) = \frac{1 - \mathrm{e}^{-\lambda\varepsilon}}{\varepsilon} \to \boxed{\lambda}$ : le « taux de panne » d'une machine qui fonctionne encore est constant, quel que soit son âge ; elle ne s'use pas.

    **2.** $\mathbb{P}(K = k) = \mathbb{P}(k \leqslant Y < k + 1) = \mathrm{e}^{-\lambda k}(1 - \mathrm{e}^{-\lambda})$ : $1 + K \sim \mathcal{G}(1 - \mathrm{e}^{-\lambda})$. Pour $k \in \mathbb{N}$ et $z \in [0, 1]$, 
    $$\mathbb{P}(K = k, Z \leqslant z) = \mathbb{P}(k \leqslant Y \leqslant k + z) = \mathrm{e}^{-\lambda k}(1 - \mathrm{e}^{-\lambda z}) = \mathbb{P}(K = k) \cdot \frac{1 - \mathrm{e}^{-\lambda z}}{1 - \mathrm{e}^{-\lambda}} :$$
     $\boxed{K \text{ et } Z \text{ sont indépendantes}}$, et $Z$ a la densité $\frac{\lambda\mathrm{e}^{-\lambda z}}{1 - \mathrm{e}^{-\lambda}}\mathbf{1}_{[0, 1]}(z)$, qui tend vers $1$ quand $\lambda \to 0$ : $Z$ tend en loi vers $\mathcal{U}([0, 1])$.

    **3.** Par la formule des probabilités totales, en conditionnant par $Z$ indépendante de $X$, 
    $$\mathbb{P}(X \geqslant Z) = \sum_{k \geqslant 1}pq^{k - 1}\mathrm{e}^{-\lambda k} = \boxed{\frac{p\,\mathrm{e}^{-\lambda}}{1 - q\,\mathrm{e}^{-\lambda}}}.$$
- id: "l3-pr-04-08"
  feuille: "f-l3-pr-04"
