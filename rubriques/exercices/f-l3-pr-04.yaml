- id: "l3-pr-04-01"
  feuille: "f-l3-pr-04"
  numero: 1
  partie: "Fonctions de répartition, lois mélangées"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [fonction de répartition]
  noeuds: [p-variables]
  notions: [fonction-repartition, loi-variable]
  source: "Durand (Orsay), exercices 2.35, 2.50 et 2.37"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Soit $X$ une variable aléatoire réelle et $t \in \mathbb{R}$. Montrer que $\mathbb{P}(X < t) = \lim_{n}\mathbb{P}(X \leqslant t - \frac{1}{n})$, et exprimer $\mathbb{P}(X = t)$ à l'aide de $F_{X}$.

    **2.** Soit $(\mu_{k})$ une suite finie ou dénombrable de probabilités sur $\mathbb{R}$ et $(\alpha_{k})$ des réels positifs de somme $1$. Montrer que $\mu = \sum_{k}\alpha_{k}\mu_{k}$ est une probabilité sur $\mathbb{R}$, et donner sa densité lorsque chaque $\mu_{k}$ en a une.

    **3.** Tracer les fonctions de répartition de la masse de Dirac $\delta_{a}$, et de $\mu = \frac{1}{3}\delta_{0} + \frac{1}{3}\delta_{1} + \frac{1}{3}\mathcal{U}([0, 1])$. La loi $\mu$ est-elle discrète ? à densité ?

    **4.** Peut-on choisir la probabilité $p$ de face d'une pièce de façon que le nombre de faces obtenues en deux lancers indépendants suive la loi uniforme sur $\{0, 1, 2\}$ ?
  corrige: |
    **1.** Les évènements $\{X \leqslant t - \frac{1}{n}\}$ croissent, de réunion $\{X < t\}$ ; par continuité croissante, $\mathbb{P}(X < t) = \lim_{n}F_{X}(t - \frac{1}{n}) = F_{X}(t^{-})$, limite à gauche de $F_{X}$, qui existe par monotonie. Donc $\boxed{\mathbb{P}(X = t) = F_{X}(t) - F_{X}(t^{-})}$, le saut de $F_{X}$ en $t$.

    **2.** $\mu(B) = \sum_{k}\alpha_{k}\mu_{k}(B) \in [0, 1]$, $\mu(\mathbb{R}) = \sum_{k}\alpha_{k} = 1$, et pour des boréliens disjoints $B_{j}$, la sommation par paquets de réels positifs donne $\mu(\bigcup_{j}B_{j}) = \sum_{k}\alpha_{k}\sum_{j}\mu_{k}(B_{j}) = \sum_{j}\mu(B_{j})$. Si $\mu_{k}$ a la densité $f_{k}$, par convergence monotone, $\mu(B) = \int_{B}\sum_{k}\alpha_{k}f_{k}$ : $\mu$ a la densité $\boxed{\sum_{k}\alpha_{k}f_{k}}$.

    **3.** $F_{\delta_{a}} = \mathbf{1}_{[a, +\infty[}$. Pour $\mu$, $F(x) = 0$ si $x < 0$, $F(x) = \frac{1}{3} + \frac{x}{3}$ si $0 \leqslant x < 1$, et $F(x) = 1$ si $x \geqslant 1$.

    1.5em

    ![Figure](documents/figures/b32da9d4e41c1c3e.svg)

    La fonction de répartition de la loi mélangée $\mu$ : deux sauts de hauteur $\frac{1}{3}$, en $0$ et en $1$, qui portent la partie discrète, et une rampe de pente $\frac{1}{3}$ entre les deux, qui porte la partie à densité.

    La loi $\mu$ n'est pas discrète, car $\mu(\{0, 1\}) = \frac{2}{3} < 1$ et les autres points sont de masse nulle ; elle n'est pas à densité, car $\mu(\{0\}) > 0$ alors qu'une loi à densité ne charge aucun point (cours, prop. 4).

    **4.** Il faudrait $(1 - p)^{2} = p^{2} = 2p(1 - p) = \frac{1}{3}$. Les deux premières égalités imposent $p = \frac{1}{2}$, et alors $2p(1 - p) = \frac{1}{2} \neq \frac{1}{3}$ : $\boxed{\text{c'est impossible}}$. Sur trois issues « à première vue symétriques », la loi uniforme n'est pas toujours le bon modèle.
- id: "l3-pr-04-02"
  feuille: "f-l3-pr-04"
  numero: 2
  partie: "Fonctions de répartition, lois mélangées"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fonction de répartition, loi normale]
  noeuds: [p-variables, p-normale]
  notions: [fonction-repartition, loi-variable, loi-normale]
  source: "Durand, exercice 2.53"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    On suppose que la vitesse de marche d'une femme suit la loi $\mathcal{N}(1{,}4\,;\, 0{,}4^{2})$, et celle d'un homme la loi $\mathcal{N}(1{,}6\,;\, 0{,}4^{2})$, en mètres par seconde. La population compte deux tiers de femmes. Soit $V$ la vitesse d'une personne choisie au hasard. Calculer $\mathbb{P}(V < 1{,}2)$, puis la probabilité qu'il s'agisse d'une femme sachant que $V < 1{,}2$. Déterminer la densité de $V$. Suit-elle une loi normale ?
  corrige: |
    Par la formule des probabilités totales, avec la prop. 9 du cours, 
    $$\mathbb{P}(V < 1{,}2) = \frac{2}{3}\Phi\Big(\frac{1{,}2 - 1{,}4}{0{,}4}\Big) + \frac{1}{3}\Phi\Big(\frac{1{,}2 - 1{,}6}{0{,}4}\Big) = \frac{2}{3}\Phi(-0{,}5) + \frac{1}{3}\Phi(-1) \approx \boxed{0{,}259},$$
     et par la formule de Bayes, $\mathbb{P}(\text{femme} \,|\, V < 1{,}2) = \frac{2/3 \times 0{,}3085}{0{,}259} \approx \boxed{0{,}795}$, plus que les deux tiers. Par l'exercice 1, $V$ a la densité 
    $$f_{V}(x) = \frac{2}{3} \cdot \frac{1}{0{,}4\sqrt{2\pi}}\mathrm{e}^{-(x - 1{,}4)^{2}/0{,}32} + \frac{1}{3} \cdot \frac{1}{0{,}4\sqrt{2\pi}}\mathrm{e}^{-(x - 1{,}6)^{2}/0{,}32}.$$
     Ce n'est pas une densité normale. Le logarithme d'une densité normale est un polynôme du second degré. Or 
    $$\ln f_{V}(x) = -\frac{(x - 1{,}6)^{2}}{0{,}32} + O(1) \quad (x \to +\infty), \qquad \ln f_{V}(x) = -\frac{(x - 1{,}4)^{2}}{0{,}32} + O(1) \quad (x \to -\infty) :$$
     les termes en $x$ diffèrent, ce qui est impossible pour un même polynôme.

    1.5em

    ![Figure](documents/figures/e5baf2d16be2b53e.svg)

    La densité de la vitesse $V$ est la somme des deux densités pondérées, en tirets. L'aire verte est $\mathbb{P}(V < 1{,}2)$ ; sous la courbe orange, elle représente près de $80\,\%$ du total.
- id: "l3-pr-04-03"
  feuille: "f-l3-pr-04"
  numero: 3
  partie: "Fonctions de répartition, lois mélangées"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fonction de répartition]
  noeuds: [p-variables]
  notions: [fonction-repartition, loi-variable]
  source: "Durand, exercices 2.3 et 2.24"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Une fléchette manque une cible circulaire de rayon $10$ avec la probabilité $p \in \, ]0, 1[$ ; si elle atteint la cible, son point d'impact est uniforme sur le disque $D$ de centre $O$ et de rayon $10$ (la probabilité d'une partie de $D$ est proportionnelle à son aire). On représente l'échec par un point $\dagger$ ajouté à $D$.

    **1.** Décrire un espace probabilisé associé à cette expérience. Calculer, en cas de réussite, la probabilité d'atteindre la cible à moins de $t \in [0, 10]$ du centre, puis à moins de $t$ du bord.

    **2.** Le score est $X = 20 - R$ en cas de réussite, où $R$ est la distance au centre, et $0$ en cas d'échec. Calculer la fonction de répartition de $X$, puis son espérance. La loi de $X$ est-elle à densité ?

    **3.** Avec un second barème, le score vaut $S = 10 - R$ en cas de réussite et $-10$ en cas d'échec. Déterminer sa loi et son espérance.

    **4.** On note $\Theta$ l'angle polaire du point d'impact en cas de réussite. Déterminer la loi de $\tan\Theta$ sachant la réussite.
  corrige: |
    **1.** On prend $\Omega = D \cup \{\dagger\}$, avec la tribu formée des $B$ et $B \cup \{\dagger\}$, $B$ borélien de $D$, et $\mathbb{P}(\{\dagger\}) = p$, $\mathbb{P}(B) = (1 - p)\frac{\mathrm{aire}(B)}{100\pi}$. En cas de réussite, la distance $R$ au centre vérifie $\mathbb{P}(R \leqslant t) = \frac{\pi t^{2}}{100\pi} = \boxed{\frac{t^{2}}{100}}$ : $R$ a la densité $\frac{r}{50}\mathbf{1}_{[0, 10]}(r)$. Être à moins de $t$ du bord, c'est $R \geqslant 10 - t$, de probabilité $\boxed{1 - \frac{(10 - t)^{2}}{100}}$.

    **2.** $X$ vaut $0$ avec la probabilité $p$, et prend ses autres valeurs dans $[10, 20]$ ; pour $10 \leqslant x \leqslant 20$, 
    $$F_{X}(x) = p + (1 - p)\mathbb{P}(R \geqslant 20 - x) = p + (1 - p)\Big(1 - \frac{(20 - x)^{2}}{100}\Big),$$
     $F_{X} = 0$ sur $]-\infty, 0[$, $F_{X} = p$ sur $[0, 10[$ et $F_{X} = 1$ sur $[20, +\infty[$. La loi n'est pas à densité (atome $p$ en $0$), ni discrète. Comme $\mathbb{E}[R \,|\, \text{réussite}] = \int_{0}^{10}\frac{r^{2}}{50}\,\mathrm{d} r = \frac{20}{3}$, $\boxed{\mathbb{E}[X] = (1 - p)\Big(20 - \frac{20}{3}\Big) = \frac{40(1 - p)}{3}}$.

    **3.** $S = -10$ avec la probabilité $p$, et $S = 10 - R \in [0, 10]$ sinon, avec $\mathbb{P}(10 - R \leqslant s) = 1 - \frac{(10 - s)^{2}}{100}$. Donc $\boxed{\mathbb{E}[S] = -10p + \frac{10}{3}(1 - p)}$, nulle pour $p = \frac{1}{4}$.

    **4.** En cas de réussite, la probabilité que $\Theta$ soit dans un intervalle de longueur $\ell$ est l'aire du secteur correspondant, rapportée à celle du disque : $\Theta$ est uniforme sur $[0, 2\pi[$. Comme $\tan$ est de période $\pi$, $\tan\Theta$ a la loi de $\tan V$, avec $V$ uniforme sur $]-\frac{\pi}{2}, \frac{\pi}{2}[$ : c'est la $\boxed{\text{loi de Cauchy}}$ de densité $\frac{1}{\pi(1 + x^{2})}$ (cours, section 4.6.3).
- id: "l3-pr-04-04"
  feuille: "f-l3-pr-04"
  numero: 4
