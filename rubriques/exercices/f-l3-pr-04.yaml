  mots_cles: [lois usuelles, loi exponentielle, loi normale]
  noeuds: [p-variables, p-esperance, p-poisson-exp, p-normale]
  notions: [densite-probabilite, esperance, loi-normale]
  source: "Bordeaux, L3 Probabilités 2015-2016, TD 2, exercice 1 (4) ; Durand, exercices 2.49 (normalisation) et 10.8 ; Rubenthaler (Nice, 2021), chapitre 6, exercices 1 et 2"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Vérifier que les densités uniforme, exponentielle et normale sont d'intégrale $1$.

    **2.** Soit $U \sim \mathcal{U}([0, 1])$. Calculer $\mathbb{E}[U]$ et $\operatorname{Var}(U)$. Soit $a < b$. Vérifier que $V = a + (b - a)U$ suit la loi $\mathcal{U}([a, b])$, et en déduire son espérance et sa variance. Comment simuler une variable de loi $\mathcal{U}([a, b])$ ?

    **3.** Soit $X \sim \mathcal{E}(\lambda)$. Calculer $\mathbb{E}[X]$ et $\operatorname{Var}(X)$, la densité de $2X$, puis $\mathbb{E}[2X]$ et $\operatorname{Var}(2X)$.

    **4.** Soit $U \sim \mathcal{N}(0, 1)$, $m \in \mathbb{R}$ et $\sigma > 0$. Montrer que $\sigma U + m$ a la densité $\frac{1}{\sigma\sqrt{2\pi}}\mathrm{e}^{-(x - m)^{2}/(2\sigma^{2})}$, et en déduire l'espérance et la variance de la loi $\mathcal{N}(m, \sigma^{2})$.
  corrige: |
    **1.** $\int_{a}^{b}\frac{\mathrm{d} x}{b - a} = 1$ ; $\int_{0}^{+\infty}\lambda\mathrm{e}^{-\lambda x}\,\mathrm{d} x = [-\mathrm{e}^{-\lambda x}]_{0}^{+\infty} = 1$ ; pour la loi normale, le changement de variable $x = m + \sigma y$ ramène à $\int\mathrm{e}^{-y^{2}/2}\,\mathrm{d} y = \sqrt{2\pi}$ (Intégration, chapitre 7, prop. 5).

    **2.** On a $\mathbb{E}[U] = \int_{0}^{1}x\,\mathrm{d} x = \frac{1}{2}$ et $\mathbb{E}[U^{2}] = \frac{1}{3}$, donc $\boxed{\operatorname{Var}(U) = \frac{1}{12}}$. Pour $a \leqslant t \leqslant b$, 
    $$\mathbb{P}(V \leqslant t) = \mathbb{P}\Big(U \leqslant \frac{t - a}{b - a}\Big) = \frac{t - a}{b - a} :$$
     $V \sim \mathcal{U}([a, b])$, et $\mathbb{E}[V] = \frac{a + b}{2}$, $\operatorname{Var}(V) = \frac{(b - a)^{2}}{12}$. On simule $\mathcal{U}([a, b])$ par $a + (b - a)U$, à partir d'un générateur uniforme sur $[0, 1]$.

    **3.** Par intégrations par parties, $\mathbb{E}[X] = \frac{1}{\lambda}$ et $\mathbb{E}[X^{2}] = \frac{2}{\lambda^{2}}$, donc $\operatorname{Var}(X) = \frac{1}{\lambda^{2}}$. $\mathbb{P}(2X > t) = \mathrm{e}^{-\lambda t/2}$ : $2X \sim \mathcal{E}(\frac{\lambda}{2})$, de densité $\frac{\lambda}{2}\mathrm{e}^{-\lambda x/2}\mathbf{1}_{x \geqslant 0}$, $\mathbb{E}[2X] = \frac{2}{\lambda}$, $\operatorname{Var}(2X) = \frac{4}{\lambda^{2}}$. Changer d'unité de temps change le paramètre de la loi exponentielle.

    **4.** $\mathbb{P}(\sigma U + m \leqslant t) = \Phi\big(\frac{t - m}{\sigma}\big)$, de dérivée $\frac{1}{\sigma}\cdot\frac{1}{\sqrt{2\pi}}\mathrm{e}^{-(t - m)^{2}/(2\sigma^{2})}$ ; par la prop. 3 du cours, c'est la densité de $\sigma U + m$. Par linéarité et par la prop. 8 du cours, on a $\mathbb{E}[\sigma U + m] = m$, et $\operatorname{Var}(\sigma U + m) = \sigma^{2}$.
- id: "l3-pr-04-05"
  feuille: "f-l3-pr-04"
  numero: 5
  partie: "Lois usuelles, moments"
  etoiles: 1
