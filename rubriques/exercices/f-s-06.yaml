- id: "s-06-01"
  feuille: "f-s-06"
  numero: 1
  partie: "Proportions et pourcentages"
  etoiles: 1
  types: [Calcul]
  mots_cles: [proportions]
  noeuds: [q]
  notions: [ensemble-rationnels]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Recopier et compléter le tableau suivant. On donnera si nécessaire des valeurs arrondies au dixième de pourcent.

    ```tableau
    Écriture fractionnaire ¦ $\dfrac{3}{4}$ ¦ $\dfrac{1}{5}$ ¦  ¦ $\dfrac{1}{8}$ ¦  ¦ $\dfrac{1}{3}$ ¦ $\dfrac{1}{40}$
    Écriture décimale ¦  ¦  ¦ $0{,}35$ ¦  ¦ $1{,}5$ ¦  ¦ 
    Pourcentage ¦  ¦  ¦  ¦  ¦  ¦  ¦ 
    ```

    Que remarque-t-on pour la colonne où l'écriture décimale vaut $1{,}5$ ? Une proportion peut-elle dépasser $100\,\%$ ?
  corrige: |
    *On passe de la fraction au décimal en effectuant la division, et du décimal au pourcentage en multipliant par $100$.*

    ```tableau
    Fractionnaire ¦ $\dfrac{3}{4}$ ¦ $\dfrac{1}{5}$ ¦ $\dfrac{7}{20}$ ¦ $\dfrac{1}{8}$ ¦ $\dfrac{3}{2}$ ¦ $\dfrac{1}{3}$ ¦ $\dfrac{1}{40}$
    Décimale ¦ $0{,}75$ ¦ $0{,}2$ ¦ $0{,}35$ ¦ $0{,}125$ ¦ $1{,}5$ ¦ $\approx 0{,}333$ ¦ $0{,}025$
    Pourcentage ¦ $75\,\%$ ¦ $20\,\%$ ¦ $35\,\%$ ¦ $12{,}5\,\%$ ¦ $150\,\%$ ¦ $\approx 33{,}3\,\%$ ¦ $2{,}5\,\%$
    ```

    **La colonne à $1{,}5$.** Ce nombre vaut $150\,\%$, donc dépasse $100\,\%$. 
    $$\boxed{\begin{array}{l} \text{une \emph{proportion} ne peut jamais dépasser } 100\,\% \text{ : une part}\\[1mm] \text{ne peut excéder le tout ; un \emph{pourcentage}, lui, le peut, dès qu'il}\\[1mm] \text{compare deux quantités indépendantes.} \end{array}}$$
- id: "s-06-02"
  feuille: "f-s-06"
  numero: 2
  partie: "Proportions et pourcentages"
  etoiles: 1
  types: [Calcul]
  mots_cles: [proportions, évolutions successives]
  noeuds: [q, n-operations]
  notions: [ensemble-rationnels]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Dans chaque cas, calculer la proportion demandée, puis l'exprimer en pourcentage.

    **a)** $12$ filles dans une classe de $30$ élèves.

    **b)** $45$ abonnés parmi $180$ clients.

    **c)** $7$ réussites sur $20$ tentatives.

    **d)** $51$ admis sur $60$ candidats.

    **e)** $3$ places occupées sur $8$.

    **f)** $156$ votes sur $400$ exprimés.

    **g)** $27$ licenciés sur $45$ inscrits.

    **h)** $13$ pièces défectueuses sur $200$.
  corrige: |
    *On calcule $p=\dfrac{k}{n}$, puis on multiplie par $100$.*

    **a)** $\dfrac{12}{30}=0{,}4=\boxed{40\,\%}$

    **b)** $\dfrac{45}{180}=0{,}25=\boxed{25\,\%}$

    **c)** $\dfrac{7}{20}=0{,}35=\boxed{35\,\%}$

    **d)** $\dfrac{51}{60}=0{,}85=\boxed{85\,\%}$

    **e)** $\dfrac{3}{8}=0{,}375=\boxed{37{,}5\,\%}$

    **f)** $\dfrac{156}{400}=0{,}39=\boxed{39\,\%}$

    **g)** $\dfrac{27}{45}=0{,}6=\boxed{60\,\%}$

    **h)** $\dfrac{13}{200}=0{,}065=\boxed{6{,}5\,\%}$
- id: "s-06-03"
  feuille: "f-s-06"
  numero: 3
  partie: "Proportions et pourcentages"
  etoiles: 1
  types: [Calcul]
  mots_cles: [proportions]
  noeuds: [q]
  notions: [ensemble-rationnels]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Calculer, sans calculatrice.

    **a)** $25\,\%$ de $80$

    **b)** $15\,\%$ de $340$

    **c)** $7\,\%$ de $250$

    **d)** $120\,\%$ de $45$

    **e)** $2{,}5\,\%$ de $800$

    **f)** $60\,\%$ de $1\,250$

    **g)** $0{,}5\,\%$ de $4\,000$

    **h)** $35\,\%$ de $340$
  corrige: |
    *Appliquer $t\,\%$ revient à multiplier par $\dfrac{t}{100}$.*

    **a)** $\dfrac{80}{4}=\boxed{20}$

    **b)** $0{,}15\times 340=\boxed{51}$

    **c)** $0{,}07\times 250=\boxed{17{,}5}$

    **d)** $1{,}2\times 45=\boxed{54}$

    **e)** $0{,}025\times 800=\boxed{20}$

    **f)** $0{,}6\times 1\,250=\boxed{750}$

    **g)** $0{,}005\times 4\,000=\boxed{20}$

    **h)** $0{,}35\times 340=\boxed{119}$

    **Astuces de calcul mental.** Pour a), $25\,\%$ c'est un quart. Pour b), $10\,\%$ de $340$ font $34$ et $5\,\%$ en font $17$, d'où $51$. Pour h), $25\,\%$ de $340$ font $85$, auxquels on ajoute les $34$ de $10\,\%$, ce qui donne $119$.
- id: "s-06-04"
  feuille: "f-s-06"
  numero: 4
  partie: "Proportions et pourcentages"
  etoiles: 1
  types: [Calcul]
  mots_cles: [proportions, contexte économique]
  noeuds: [q]
  notions: [ensemble-rationnels]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    *On cherche ici la quantité totale, connaissant une part et le pourcentage correspondant.*

    **1.** Déterminer le nombre $N$ dans chacun des cas suivants :

    **a)** $20\,\%$ de $N$ valent $45$.

    **b)** $8\,\%$ de $N$ valent $36$.

    **c)** $150\,\%$ de $N$ valent $90$.

    **d)** $2{,}5\,\%$ de $N$ valent $12$.

    **2.** Dans un lycée, $35\,\%$ des élèves sont externes, ce qui représente $168$ élèves. Combien le lycée compte-t-il d'élèves ?

    **3.** Sur une facture, la TVA au taux de $20\,\%$ s'élève à $15$ €. Quel est le prix hors taxes de l'article ?

    **4.** Lors d'une élection, un candidat obtient $28\,\%$ des voix, ce qui représente $4\,200$ suffrages. Combien de suffrages ont été exprimés au total ?
  corrige: |
    *Si $t\,\%$ de $N$ valent $V$, alors $N=\dfrac{V}{t/100}$ : on **divise** par la proportion.*

    **1.**

    **a)** $N=\dfrac{45}{0{,}2}=\boxed{225}$

    **b)** $N=\dfrac{36}{0{,}08}=\boxed{450}$

    **c)** $N=\dfrac{90}{1{,}5}=\boxed{60}$

    **d)** $N=\dfrac{12}{0{,}025}=\boxed{480}$

    *On remarque à la question c) que* $N$ est plus *petit* que la part obtenue, ce qui est normal puisque le pourcentage dépasse $100\,\%$.

    **2.** $\dfrac{168}{0{,}35}=\boxed{480 \text{ élèves}}$

    **3.** $\dfrac{15}{0{,}2}=\boxed{75~\text{€}}$

    **4.** $\dfrac{4\,200}{0{,}28}=\boxed{15\,000 \text{ suffrages}}$
- id: "s-06-05"
  feuille: "f-s-06"
  numero: 5
  partie: "Proportions et pourcentages"
  etoiles: 2
  types: [Calcul]
  mots_cles: [proportions]
  noeuds: [q]
  notions: [ensemble-rationnels]
  page_enonce: 2
  page_corrige: 2
  enonce: |
    Le tableau ci-dessous donne la répartition des $800$ élèves d'un lycée.

    ```tableau
     ¦ *Seconde* ¦ *Première* ¦ *Terminale* ¦ *Total*
    *Filles* ¦ $150$ ¦ $140$ ¦ $130$ ¦ $420$
    *Garçons* ¦ $170$ ¦ $120$ ¦ $90$ ¦ $380$
    *Total* ¦ $320$ ¦ $260$ ¦ $220$ ¦ $800$
    ```

    *Attention : à chaque question, on identifiera soigneusement le total de référence.*

    **1.** Quelle est la proportion de filles dans le lycée ?

    **2.** Quelle est la proportion d'élèves de Seconde dans le lycée ?

    **3.** Quelle est la proportion de filles **parmi les élèves de Seconde** ?

    **4.** Quelle est la proportion d'élèves de Seconde **parmi les filles** ?

    **5.** Quelle est la proportion de filles de Seconde **dans le lycée entier** ?

    **6.** Les résultats des questions 3, 4 et 5 sont différents alors qu'ils portent tous sur les $150$ filles de Seconde. Expliquer pourquoi.
  corrige: |
    **1.** Le total de référence est le lycée entier, soit $800$ élèves : 
    $$\frac{420}{800}=0{,}525=\boxed{52{,}5\,\%}$$

    **2.** Même référence : $\dfrac{320}{800}=0{,}4=\boxed{40\,\%}$

    **3.** La référence devient l'ensemble des élèves de Seconde, soit $320$ : 
    $$\frac{150}{320}=0{,}468\,75\approx\boxed{46{,}9\,\%}$$

    **4.** La référence devient l'ensemble des filles, soit $420$ : 
    $$\frac{150}{420}=\frac{5}{14}\approx\boxed{35{,}7\,\%}$$

    **5.** La référence redevient le lycée entier : 
    $$\frac{150}{800}=0{,}187\,5=\boxed{18{,}75\,\%}$$

    **6.** Les trois quotients ont le même numérateur $150$, mais des dénominateurs différents : $320$, $420$ puis $800$. 
    $$\boxed{\text{Un pourcentage n'a de sens que rapporté à un total de référence.}}$$
     Changer ce total change le résultat, sans que la situation elle-même ait changé.
- id: "s-06-06"
  feuille: "f-s-06"
  numero: 6
  partie: "Proportions et pourcentages"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [proportions]
  noeuds: [q]
  notions: [ensemble-rationnels]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Dans une classe, $40\,\%$ des élèves étudient l'espagnol, $35\,\%$ l'allemand et $25\,\%$ l'italien. Chaque élève n'étudie qu'une seule de ces trois langues.

    **(a)** Quelle proportion étudie l'espagnol ou l'allemand ?

    **(b)** Vérifier que le total des trois proportions vaut $100\,\%$. Pourquoi était-ce prévisible ?

    **2.** Dans un club, $45\,\%$ des membres pratiquent le football, $30\,\%$ le tennis, et $10\,\%$ pratiquent les deux.

    **(a)** Peut-on additionner directement $45\,\%$ et $30\,\%$ ? Justifier.

    **(b)** Quelle proportion des membres pratique au moins l'un des deux sports ?

    **(c)** Quelle proportion n'en pratique aucun des deux ?
  corrige: |
    **1.** **(a)** Chaque élève n'étudie qu'une seule langue : les deux groupes n'ont aucun élément commun, on peut donc additionner. 
    $$40\,\%+35\,\%=\boxed{75\,\%}$$

    **(b)** $40+35+25=100$. C'était prévisible : les trois groupes n'ont aucun élément commun et recouvrent la classe entière. 
    $$\boxed{\text{Ils forment une partition de la classe, donc leurs proportions totalisent } 100\,\%.}$$

    **2.** **(a)** Non. Les $10\,\%$ qui pratiquent les deux sports seraient comptés **deux fois**, une fois parmi les footballeurs et une fois parmi les joueurs de tennis.

    **(b)** On retire donc une fois l'intersection : 
    $$45\,\%+30\,\%-10\,\%=\boxed{65\,\%}$$

    **(c)** Par événement contraire : $100\,\%-65\,\%=\boxed{35\,\%}$
- id: "s-06-07"
  feuille: "f-s-06"
  numero: 7
  partie: "Proportion d'une proportion"
  etoiles: 1
  types: [Calcul]
  mots_cles: [proportions]
  noeuds: [q]
  notions: [ensemble-rationnels]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Dans chaque cas, une proportion $p_{1}$ de la population possède le caractère $A$, et parmi ceux-ci une proportion $p_{2}$ possède le caractère $B$. Calculer la proportion d'individus possédant à la fois $A$ et $B$ dans la population totale.

    **a)** $p_{1}=40\,\%$ et $p_{2}=25\,\%$

    **b)** $p_{1}=80\,\%$ et $p_{2}=60\,\%$

    **c)** $p_{1}=30\,\%$ et $p_{2}=30\,\%$

    **d)** $p_{1}=75\,\%$ et $p_{2}=20\,\%$

    **e)** $p_{1}=12\,\%$ et $p_{2}=50\,\%$

    **f)** $p_{1}=90\,\%$ et $p_{2}=90\,\%$

    Pour la question f), le résultat est-il supérieur ou inférieur à $90\,\%$ ? Expliquer pourquoi c'était prévisible.
  corrige: |
    *Les proportions successives se **multiplient** : $p=p_{1}\times p_{2}$.*

    **a)** $0{,}4\times 0{,}25=0{,}1=\boxed{10\,\%}$

    **b)** $0{,}8\times 0{,}6=0{,}48=\boxed{48\,\%}$

    **c)** $0{,}3\times 0{,}3=0{,}09=\boxed{9\,\%}$

    **d)** $0{,}75\times 0{,}2=0{,}15=\boxed{15\,\%}$

    **e)** $0{,}12\times 0{,}5=0{,}06=\boxed{6\,\%}$

    **f)** $0{,}9\times 0{,}9=0{,}81=\boxed{81\,\%}$

    **Question f).** Le résultat $81\,\%$ est **inférieur** à $90\,\%$. C'était prévisible : on prend une partie d'une partie, donc le résultat est nécessairement plus petit que chacune des deux proportions. 
    $$\boxed{\text{Multiplier par un nombre compris entre } 0 \text{ et } 1 \text{ diminue toujours.}}$$
- id: "s-06-08"
  feuille: "f-s-06"
  numero: 8
  partie: "Proportion d'une proportion"
  etoiles: 1
  types: [Calcul]
  mots_cles: [proportions]
  noeuds: [q]
  notions: [ensemble-rationnels]
  page_enonce: 3
  page_corrige: 3
  enonce: |
    **1.** Une ville compte $40\,000$ habitants. Parmi eux, $25\,\%$ ont moins de $20$ ans, et $60\,\%$ de ces jeunes sont scolarisés dans la ville.

    **(a)** Quelle proportion de la population totale cela représente-t-il ?

    **(b)** Combien de personnes cela fait-il ?

    **2.** Dans un magasin, $45\,\%$ des clients sont des femmes, et $20\,\%$ des femmes achètent un livre. Quelle proportion de la clientèle totale est constituée de femmes achetant un livre ?

    **3.** Dans un lycée, $30\,\%$ des élèves sont demi-pensionnaires, et parmi eux $80\,\%$ prennent le bus. Sur $600$ élèves, combien sont demi-pensionnaires et prennent le bus ?
  corrige: |
    **1.** **(a)** $0{,}25\times 0{,}6=0{,}15=\boxed{15\,\%}$

    **(b)** $0{,}15\times 40\,000=\boxed{6\,000 \text{ personnes}}$

    **2.** $0{,}45\times 0{,}2=0{,}09=\boxed{9\,\%}$

    *Attention :* les $20\,\%$ se rapportent aux femmes, tandis que les $9\,\%$ se rapportent à l'ensemble de la clientèle.

    **3.** $0{,}3\times 0{,}8=0{,}24$, soit $24\,\%$ des élèves, d'où 
    $$0{,}24\times 600=\boxed{144 \text{ élèves}}$$
- id: "s-06-09"
  feuille: "f-s-06"
  numero: 9
  partie: "Proportion d'une proportion"
  etoiles: 2
  types: [Calcul]
  mots_cles: [proportions, évolutions successives]
  noeuds: [q, n-operations]
  notions: [ensemble-rationnels]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Un club sportif compte $500$ membres. On sait que $60\,\%$ d'entre eux sont des adultes, les autres étant des jeunes. Parmi les adultes, $35\,\%$ pratiquent la natation ; parmi les jeunes, cette proportion s'élève à $70\,\%$.

    ![Figure](documents/figures/97e2da1ec3c2c03e.svg)

    **1.** Recopier et compléter l'arbre ci-dessus.

    **2.** Quelle proportion des membres du club est constituée d'adultes nageurs ?

    **3.** Quelle proportion est constituée de jeunes nageurs ?

    **4.** En déduire la proportion de nageurs dans le club, puis leur nombre.

    **5.** Combien y a-t-il d'adultes qui ne pratiquent pas la natation ?
  corrige: |
    **1.** Les proportions issues d'un même point totalisent $100\,\%$ :

    ![Figure](documents/figures/c2876e6e862fcb8f.svg)

    **2.** $0{,}6\times 0{,}35=0{,}21=\boxed{21\,\%}$

    **3.** $0{,}4\times 0{,}7=0{,}28=\boxed{28\,\%}$

    **4.** Les adultes nageurs et les jeunes nageurs forment deux groupes sans élément commun, on peut donc les additionner : 
    $$21\,\%+28\,\%=\boxed{49\,\%} \qquad\text{soit}\qquad 0{,}49\times 500=\boxed{245 \text{ nageurs}}$$

    **5.** $0{,}6\times 0{,}65=0{,}39$, soit $0{,}39\times 500=\boxed{195 \text{ adultes}}$.
- id: "s-06-10"
  feuille: "f-s-06"
  numero: 10
  partie: "Proportion d'une proportion"
  etoiles: 2
  types: [Calcul]
  mots_cles: [proportions]
  noeuds: [q]
  notions: [ensemble-rationnels]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    *Il s'agit ici de retrouver l'une des deux proportions, connaissant l'autre et le résultat.*

    **1.** Dans un lycée, $30\,\%$ des élèves sont en Terminale. Par ailleurs, $12\,\%$ de l'ensemble des élèves sont des élèves de Terminale étudiant l'espagnol. Quelle proportion des élèves de Terminale étudie l'espagnol ?

    **2.** Dans une entreprise, $20\,\%$ des salariés sont des cadres, et $9\,\%$ de l'ensemble des salariés sont des cadres travaillant à l'étranger. Quelle proportion des cadres travaille à l'étranger ?

    **3.** Dans une ville, $70\,\%$ des habitants ont plus de $18$ ans, et $56\,\%$ de la population totale est composée de majeurs inscrits sur les listes électorales. Quelle proportion des majeurs est inscrite ?
  corrige: |
    *Puisque $p=p_{1}\times p_{2}$, on retrouve la proportion manquante en **divisant** : $p_{2}=\dfrac{p}{p_{1}}$.*

    **1.** $\dfrac{0{,}12}{0{,}30}=0{,}4=\boxed{40\,\%}$ des élèves de Terminale.

    **2.** $\dfrac{0{,}09}{0{,}20}=0{,}45=\boxed{45\,\%}$ des cadres.

    **3.** $\dfrac{0{,}56}{0{,}70}=0{,}8=\boxed{80\,\%}$ des majeurs.

    *Vérification systématique :* on peut toujours contrôler en refaisant le produit, par exemple $0{,}70\times 0{,}80=0{,}56$.
- id: "s-06-11"
  feuille: "f-s-06"
  numero: 11
  partie: "Taux d'évolution et coefficient multiplicateur"
  etoiles: 1
  types: [Calcul]
  mots_cles: [proportions, "taux d'évolution"]
  noeuds: [q]
  notions: [ensemble-rationnels]
  page_enonce: 4
  page_corrige: 5
  enonce: |
    Dans chaque cas, une quantité passe de la valeur $V_{D}$ à la valeur $V_{A}$. Calculer le taux d'évolution, et l'exprimer en pourcentage.

    **a)** $V_{D}=50$ et $V_{A}=60$

    **b)** $V_{D}=80$ et $V_{A}=60$

    **c)** $V_{D}=200$ et $V_{A}=250$

    **d)** $V_{D}=120$ et $V_{A}=90$

    **e)** $V_{D}=45$ et $V_{A}=45$

    **f)** $V_{D}=30$ et $V_{A}=45$

    **g)** $V_{D}=1\,200$ et $V_{A}=1\,500$

    **h)** $V_{D}=250$ et $V_{A}=200$

    Les questions b) et h) donnent des taux différents alors que la quantité a diminué de $20$ dans les deux cas. Expliquer.
  corrige: |
    *On applique $t=\dfrac{V_{A}-V_{D}}{V_{D}}$.*

    **a)** $\dfrac{10}{50}=0{,}2=\boxed{+20\,\%}$

    **b)** $\dfrac{-20}{80}=-0{,}25=\boxed{-25\,\%}$

    **c)** $\dfrac{50}{200}=0{,}25=\boxed{+25\,\%}$

    **d)** $\dfrac{-30}{120}=-0{,}25=\boxed{-25\,\%}$

    **e)** $\dfrac{0}{45}=\boxed{0\,\%}$

    **f)** $\dfrac{15}{30}=0{,}5=\boxed{+50\,\%}$

    **g)** $\dfrac{300}{1\,200}=0{,}25=\boxed{+25\,\%}$

    **h)** $\dfrac{-50}{250}=-0{,}2=\boxed{-20\,\%}$

    **Comparaison des questions b) et h).** La baisse est de $20$ unités dans les deux cas, mais elle ne se rapporte pas au même point de départ : $20$ sur $80$ pèsent plus lourd que $20$ sur $250$. 
    $$\boxed{\text{Le taux d'évolution mesure une variation \emph{relative}, pas une variation absolue.}}$$
- id: "s-06-12"
  feuille: "f-s-06"
  numero: 12
  partie: "Taux d'évolution et coefficient multiplicateur"
  etoiles: 1
  types: [Calcul]
  mots_cles: [proportions, "taux d'évolution", coefficient multiplicateur]
  noeuds: [q]
  notions: [ensemble-rationnels]
  page_enonce: 4
  page_corrige: 5
  enonce: |
    Recopier et compléter le tableau suivant.

    ```tableau
    Taux d'évolution ¦ $+20\,\%$ ¦ $-15\,\%$ ¦  ¦ $+3{,}5\,\%$ ¦  ¦ 
    Coefficient multiplicateur ¦  ¦  ¦ $0{,}92$ ¦  ¦ $2$ ¦ $0{,}6$
    ```

    ```tableau
    Taux d'évolution ¦ $-50\,\%$ ¦  ¦ $+0{,}8\,\%$ ¦  ¦ $-100\,\%$ ¦ 
    Coefficient multiplicateur ¦  ¦ $1{,}4$ ¦  ¦ $0{,}95$ ¦  ¦ $3$
    ```

    À quelle condition sur le coefficient multiplicateur l'évolution est-elle une hausse ? une baisse ?
  corrige: |
    *On passe du taux au coefficient par $\mathrm{CM}=1+t$, et du coefficient au taux par $t=\mathrm{CM}-1$.*

    $$\begin{array}{|l|c|c|c|c|c|c|} \hline \text{Taux} & +20\,\% & -15\,\% & \mathbf{-8\,\%} & +3{,}5\,\% & \mathbf{+100\,\%} & \mathbf{-40\,\%} \\ \hline \text{Coefficient} & \mathbf{1{,}20} & \mathbf{0{,}85} & 0{,}92 & \mathbf{1{,}035} & 2 & 0{,}6 \\ \hline \end{array}$$

    $$\begin{array}{|l|c|c|c|c|c|c|} \hline \text{Taux} & -50\,\% & \mathbf{+40\,\%} & +0{,}8\,\% & \mathbf{-5\,\%} & -100\,\% & \mathbf{+200\,\%} \\ \hline \text{Coefficient} & \mathbf{0{,}5} & 1{,}4 & \mathbf{1{,}008} & 0{,}95 & \mathbf{0} & 3 \\ \hline \end{array}$$

    $$\boxed{\begin{array}{l} \text{L'évolution est une \textbf{hausse} lorsque } \mathrm{CM}>1, \text{ une \textbf{baisse} lorsque } 0\leqslant\mathrm{CM}<1.\\[1mm] \text{Le cas } \mathrm{CM}=1 \text{ correspond à une quantité inchangée.} \end{array}}$$
- id: "s-06-13"
  feuille: "f-s-06"
  numero: 13
  partie: "Taux d'évolution et coefficient multiplicateur"
  etoiles: 1
  types: [Calcul]
  mots_cles: [proportions]
  noeuds: [q]
  notions: [ensemble-rationnels]
  page_enonce: 4
  page_corrige: 5
  enonce: |
    Calculer la valeur d'arrivée dans chacun des cas suivants.

    **a)** $80$ € augmentés de $15\,\%$

    **b)** $250$ € diminués de $12\,\%$

    **c)** $1\,500$ augmentés de $4\,\%$

    **d)** $60$ diminués de $35\,\%$

    **e)** $4\,200$ € augmentés de $2{,}5\,\%$

    **f)** $90$ diminués de $100\,\%$
  corrige: |
    **a)** $1{,}15\times 80=\boxed{92~\text{€}}$

    **b)** $0{,}88\times 250=\boxed{220~\text{€}}$

    **c)** $1{,}04\times 1\,500=\boxed{1\,560}$

    **d)** $0{,}65\times 60=\boxed{39}$

    **e)** $1{,}025\times 4\,200=\boxed{4\,305~\text{€}}$

    **f)** $0\times 90=\boxed{0}$

    *La question f) illustre le cas limite :* une baisse de $100\,\%$ fait disparaître la totalité de la quantité.
- id: "s-06-14"
  feuille: "f-s-06"
  numero: 14
  partie: "Taux d'évolution et coefficient multiplicateur"
  etoiles: 1
  types: [Calcul]
  mots_cles: [proportions, "taux d'évolution", coefficient multiplicateur]
  noeuds: [q]
  notions: [ensemble-rationnels]
  page_enonce: 4
  page_corrige: 5
  enonce: |
    *On cherche cette fois la valeur de départ. On rappelle que l'on **divise** par le coefficient multiplicateur, et que l'on n'applique surtout pas l'évolution inverse.*

    Déterminer la valeur de départ dans chacun des cas suivants.

    **a)** Après une hausse de $15\,\%$, on obtient $92$ €.

    **b)** Après une baisse de $20\,\%$, on obtient $96$ €.

    **c)** Après une hausse de $8\,\%$, on obtient $540$.

    **d)** Après une baisse de $35\,\%$, on obtient $78$ €.

    **e)** Après une hausse de $25\,\%$, on obtient $375$.

    **f)** Après une baisse de $4\,\%$, on obtient $96$.
  corrige: |
    **a)** $\dfrac{92}{1{,}15}=\boxed{80~\text{€}}$

    **b)** $\dfrac{96}{0{,}8}=\boxed{120~\text{€}}$

    **c)** $\dfrac{540}{1{,}08}=\boxed{500}$

    **d)** $\dfrac{78}{0{,}65}=\boxed{120~\text{€}}$

    **e)** $\dfrac{375}{1{,}25}=\boxed{300}$

    **f)** $\dfrac{96}{0{,}96}=\boxed{100}$

    *Contrôle sur la question b).* Appliquer une hausse de $20\,\%$ à $96$ donnerait $1{,}2\times 96=115{,}2$, et non $120$ : c'est bien la division qu'il faut effectuer.
- id: "s-06-15"
  feuille: "f-s-06"
  numero: 15
  partie: "Taux d'évolution et coefficient multiplicateur"
  etoiles: 2
  types: [Calcul]
  mots_cles: [proportions, "taux d'évolution", contexte économique]
  noeuds: [q]
  notions: [ensemble-rationnels]
  page_enonce: 5
  page_corrige: 6
  enonce: |
    **1.** Le prix d'un billet de train passe de $45$ € à $51{,}30$ €. Calculer le taux d'évolution.

    **2.** Un salaire mensuel de $1\,800$ € augmente de $3\,\%$. Calculer le nouveau salaire.

    **3.** Une commune de $12\,500$ habitants voit sa population diminuer de $4\,\%$. Combien compte-t-elle d'habitants ?

    **4.** Un article est soldé à $51$ € après une remise de $15\,\%$. Quel était son prix avant les soldes ?

    **5.** Une entreprise employait $240$ salariés et n'en emploie plus que $216$. Calculer le taux d'évolution de l'effectif.

    **6.** Le prix d'un litre de carburant passe de $1{,}75$ € à $1{,}82$ €. Calculer le taux d'évolution, arrondi au dixième de pourcent.
  corrige: |
    **1.** $t=\dfrac{51{,}30-45}{45}=\dfrac{6{,}30}{45}=0{,}14=\boxed{+14\,\%}$

    **2.** $1\,800\times 1{,}03=\boxed{1\,854~\text{€}}$

    **3.** $12\,500\times 0{,}96=\boxed{12\,000 \text{ habitants}}$

    **4.** $\dfrac{51}{0{,}85}=\boxed{60~\text{€}}$

    **5.** $t=\dfrac{216-240}{240}=\dfrac{-24}{240}=-0{,}1=\boxed{-10\,\%}$

    **6.** $t=\dfrac{1{,}82-1{,}75}{1{,}75}=\dfrac{0{,}07}{1{,}75}=0{,}04=\boxed{+4\,\%}$
- id: "s-06-16"
  feuille: "f-s-06"
  numero: 16
  partie: "Taux d'évolution et coefficient multiplicateur"
  etoiles: 2
  types: [Calcul]
  mots_cles: [proportions, contexte économique]
  noeuds: [q]
  notions: [ensemble-rationnels]
  page_enonce: 5
  page_corrige: 6
  enonce: |
    Un article coûte $120$ €. Pendant les soldes, il est vendu $90$ €.

    **1.** Calculer le taux de remise appliqué.

    **2.** Un élève affirme : « pour retrouver le prix initial, il suffit d'augmenter le prix soldé de ce même pourcentage ». Effectuer ce calcul et constater qu'il ne redonne pas $120$ €.

    **3.** Expliquer l'erreur commise, en précisant à quelle valeur de référence se rapporte chacun des deux pourcentages.

    **4.** De quel pourcentage faudrait-il réellement augmenter le prix soldé pour retrouver $120$ € ? On arrondira au dixième.
  corrige: |
    **1.** $t=\dfrac{90-120}{120}=\dfrac{-30}{120}=-0{,}25$, soit une remise de $\boxed{25\,\%}$.

    **2.** $90\times 1{,}25=\boxed{112{,}50~\text{€}}$, et non $120$ €.

    **3.** Les deux pourcentages ne se rapportent pas à la même référence : 
    $$\boxed{\begin{array}{l} \text{la remise de } 25\,\% \text{ porte sur } 120~\text{€, et retire } 30~\text{€ ;}\\[1mm] \text{la hausse de } 25\,\% \text{ porte sur } 90~\text{€, et n'ajoute que } 22{,}50~ \text{€.} \end{array}}$$

    **4.** Il faut résoudre $90\times\mathrm{CM}=120$, soit 
    $$\mathrm{CM}=\frac{120}{90}=\frac{4}{3}\approx 1{,}333 \qquad\text{soit une hausse de}\qquad \boxed{+33{,}3\,\%}$$
- id: "s-06-17"
  feuille: "f-s-06"
  numero: 17
  partie: "Évolutions successives"
  etoiles: 1
  types: [Calcul]
  mots_cles: [proportions, "taux d'évolution", coefficient multiplicateur, évolutions successives]
  noeuds: [q, n-operations]
  notions: [ensemble-rationnels]
  page_enonce: 5
  page_corrige: 6
  enonce: |
    Dans chaque cas, calculer le coefficient multiplicateur global, puis le taux d'évolution global.

    **a)** Une hausse de $10\,\%$ puis une hausse de $20\,\%$.

    **b)** Une baisse de $10\,\%$ puis une baisse de $20\,\%$.

    **c)** Une hausse de $50\,\%$ puis une baisse de $50\,\%$.

    **d)** Une hausse de $25\,\%$ puis une baisse de $20\,\%$.

    **e)** Une baisse de $40\,\%$ puis une hausse de $40\,\%$.

    **f)** Trois hausses successives de $10\,\%$.

    Commenter le résultat de la question d).
  corrige: |
    *Les coefficients se multiplient ; les taux ne s'additionnent jamais.*

    **a)** $1{,}1\times 1{,}2=1{,}32$ : $\boxed{+32\,\%}$

    **b)** $0{,}9\times 0{,}8=0{,}72$ : $\boxed{-28\,\%}$

    **c)** $1{,}5\times 0{,}5=0{,}75$ : $\boxed{-25\,\%}$

    **d)** $1{,}25\times 0{,}8=1$ : $\boxed{0\,\%}$

    **e)** $0{,}6\times 1{,}4=0{,}84$ : $\boxed{-16\,\%}$

    **f)** $1{,}1^{3}=1{,}331$ : $\boxed{+33{,}1\,\%}$

    **Question d).** Le coefficient global vaut exactement $1$ : la quantité revient à sa valeur de départ. 
    $$\boxed{\text{Une hausse de } 25\,\% \text{ est donc exactement compensée par une baisse de } 20\,\%.}$$
     C'est un cas très particulier — on le retrouvera à l'exercice 22 : ces deux évolutions sont réciproques l'une de l'autre.
- id: "s-06-18"
  feuille: "f-s-06"
  numero: 18
  partie: "Évolutions successives"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [proportions, "taux d'évolution", coefficient multiplicateur, évolutions successives, contexte économique]
  noeuds: [q, n-operations]
  notions: [ensemble-rationnels]
  page_enonce: 5
  page_corrige: 7
  enonce: |
    **1.** Un prix de $200$ € augmente de $10\,\%$, puis de $5\,\%$.

    **(a)** Calculer le prix après chacune des deux hausses.

    **(b)** Calculer le coefficient multiplicateur global, puis le taux d'évolution global.

    **(c)** Ce taux est-il égal à $15\,\%$ ? Justifier.

    **2.** La population d'une ville de $50\,000$ habitants diminue de $2\,\%$ par an pendant trois années consécutives.

    **(a)** Calculer la population au bout de trois ans, arrondie à l'unité.

    **(b)** Calculer le taux d'évolution global sur les trois ans, arrondi au dixième de pourcent.

    **(c)** Ce taux est-il égal à $-6\,\%$ ? Justifier.
  corrige: |
    **1.** **(a)** Après la première hausse : $200\times 1{,}1=\boxed{220~\text{€}}$.

    Après la seconde : $220\times 1{,}05=\boxed{231~\text{€}}$.

    **(b)** $\mathrm{CM}=1{,}1\times 1{,}05=\boxed{1{,}155}$, soit un taux global de $\boxed{+15{,}5\,\%}$.

    **(c)** Non. La seconde hausse de $5\,\%$ s'applique à $220$ € et non à $200$ € : elle rapporte $11$ € au lieu de $10$ €. 
    $$\boxed{\text{L'écart de } 0{,}5 \text{ point vient de cette différence de référence.}}$$

    **2.** **(a)** $50\,000\times 0{,}98^{3}=50\,000\times 0{,}941\,192=47\,059{,}6$, soit environ $\boxed{47\,060 \text{ habitants}}$.

    **(b)** $\mathrm{CM}=0{,}98^{3}\approx 0{,}941\,19$, d'où un taux global de $\boxed{-5{,}9\,\%}$.

    **(c)** Non, le taux global n'est pas $-6\,\%$ : chaque baisse porte sur une population déjà réduite, et retire donc un peu moins que la précédente.
- id: "s-06-19"
  feuille: "f-s-06"
  numero: 19
  partie: "Évolutions successives"
  etoiles: 2
  types: [Calcul]
  mots_cles: [proportions, "taux d'évolution", évolutions successives, contexte économique]
  noeuds: [q, n-operations]
  notions: [ensemble-rationnels]
  page_enonce: 6
  page_corrige: 7
  enonce: |
    *C'est l'illusion évoquée dans l'introduction du cours.*

    Un article coûte $100$ €. Son prix augmente de $20\,\%$, puis diminue de $20\,\%$.

    **1.** Calculer le prix après la hausse, puis le prix après la baisse.

    **2.** Le prix final est-il revenu à $100$ € ? Calculer le taux d'évolution global.

    **3.** Reprendre les questions 1 et 2 en inversant l'ordre : d'abord la baisse, puis la hausse. Que constate-t-on ?

    **4.** Expliquer, en comparant les deux valeurs de référence, pourquoi la baisse retire plus d'argent que la hausse n'en a ajouté.

    **5.** Reprendre la question 2 avec une hausse puis une baisse de $50\,\%$. L'écart final est-il plus ou moins important ?
  corrige: |
    **1.** Après la hausse : $100\times 1{,}2=\boxed{120~\text{€}}$.

    Après la baisse : $120\times 0{,}8=\boxed{96~\text{€}}$.

    **2.** Non, le prix ne revient pas à $100$ €. Le coefficient global vaut 
    $$\mathrm{CM}=1{,}2\times 0{,}8=0{,}96 \qquad\text{soit}\qquad \boxed{-4\,\%}$$

    **3.** Dans l'autre ordre : $100\times 0{,}8=80$, puis $80\times 1{,}2=96$ €. Le coefficient global vaut $0{,}8\times 1{,}2=0{,}96$, identique. 
    $$\boxed{\text{L'ordre des deux évolutions ne change rien, car la multiplication est commutative.}}$$

    **4.** La hausse s'applique à $100$ € et ajoute $20$ €. La baisse, elle, s'applique à $120$ € et retire $24$ €. 
    $$\boxed{\text{La baisse porte sur une somme plus grande : elle retire donc davantage.}}$$

    **5.** Avec $50\,\%$ : $\mathrm{CM}=1{,}5\times 0{,}5=0{,}75$, soit $-25\,\%$. 
    $$\boxed{\text{L'écart est bien plus important : } -25\,\% \text{ contre } -4\,\%.}$$
     Plus le taux est grand, plus la perte finale est importante — ce que l'exercice 31 démontrera.
- id: "s-06-20"
  feuille: "f-s-06"
  numero: 20
  partie: "Évolutions successives"
  etoiles: 2
  types: [Calcul]
  mots_cles: [proportions, coefficient multiplicateur, évolutions successives, contexte économique]
  noeuds: [q, n-operations]
  notions: [ensemble-rationnels]
  page_enonce: 6
  page_corrige: 7
  enonce: |
    Un magasin applique une première démarque de $30\,\%$, puis une seconde démarque de $20\,\%$ sur le prix déjà soldé.

    **1.** Calculer le coefficient multiplicateur global, puis le taux de remise global.

    **2.** Un article coûtait $150$ €. Quel est son prix après les deux démarques ?

    **3.** Un client affirme que la remise totale est de $50\,\%$. Expliquer son erreur et calculer l'écart, en euros, entre son calcul et la réalité pour cet article.

    **4.** Le magasin voudrait annoncer une remise globale de $50\,\%$ après ces deux démarques. Quelle troisième démarque devrait-il appliquer ?
  corrige: |
    **1.** $\mathrm{CM}=0{,}7\times 0{,}8=\boxed{0{,}56}$, soit une remise globale de $\boxed{44\,\%}$.

    **2.** $150\times 0{,}56=\boxed{84~\text{€}}$

    **3.** Le client additionne les taux, ce qui est faux : la seconde démarque de $20\,\%$ s'applique au prix *déjà soldé* de $105$ €, et non aux $150$ € de départ.

    Avec son calcul, il attendrait $150\times 0{,}5=75$ € : 
    $$\boxed{\text{il se trompe de } 84-75=9~\text{€.}}$$

    **4.** Il faut un coefficient global de $0{,}5$. La troisième démarque doit donc avoir pour coefficient 
    $$\mathrm{CM}_{3}=\frac{0{,}5}{0{,}56}\approx 0{,}892\,9 \qquad\text{soit une remise de}\qquad \boxed{10{,}7\,\%}$$
- id: "s-06-21"
  feuille: "f-s-06"
  numero: 21
  partie: "Évolutions successives"
  etoiles: 2
  types: [Calcul]
  mots_cles: [proportions, "taux d'évolution", évolutions successives, évolution réciproque, contexte économique]
  noeuds: [q, n-operations, q-construction]
  notions: [ensemble-rationnels]
  page_enonce: 6
  page_corrige: 8
  enonce: |
    **1.** Un prix augmente de $20\,\%$, puis subit une seconde évolution. Au total, il a augmenté de $8\,\%$. Déterminer la seconde évolution.

    **2.** Après deux baisses successives de même taux, un prix a diminué de $19\,\%$. Déterminer le taux de chacune des deux baisses.

    **3.** Une population double en deux ans, avec le même taux d'évolution chaque année. Déterminer ce taux annuel, arrondi au dixième de pourcent.

    **4.** Un prix diminue de $25\,\%$ puis augmente de $25\,\%$. Quelle troisième évolution ramènerait exactement le prix initial ? On arrondira au centième de pourcent.
  corrige: |
    **1.** Le coefficient global vaut $1{,}08$ et le premier $1{,}2$, donc 
    $$\mathrm{CM}_{2}=\frac{1{,}08}{1{,}2}=0{,}9 \qquad\text{soit}\qquad \boxed{\text{une baisse de } 10\,\%.}$$

    **2.** Les deux baisses ayant le même coefficient $\mathrm{CM}$, on a $\mathrm{CM}^{2}=0{,}81$, donc $\mathrm{CM}=\sqrt{0{,}81}=0{,}9$ : 
    $$\boxed{\text{chaque baisse est de } 10\,\%.}$$
     *On ne retient que la racine positive*, un coefficient multiplicateur ne pouvant être négatif.

    **3.** Doubler signifie $\mathrm{CM}^{2}=2$, donc $\mathrm{CM}=\sqrt{2}\approx 1{,}414$ : 
    $$\boxed{\text{le taux annuel vaut environ } +41{,}4\,\%.}$$

    **4.** $\mathrm{CM}=0{,}75\times 1{,}25=0{,}937\,5$. Pour revenir au prix initial, il faut 
    $$\mathrm{CM}_{3}=\frac{1}{0{,}937\,5}\approx 1{,}066\,7 \qquad\text{soit}\qquad \boxed{+6{,}67\,\%}$$
- id: "s-06-22"
  feuille: "f-s-06"
  numero: 22
  partie: "Évolution réciproque et points de pourcentage"
  etoiles: 1
  types: [Calcul]
  mots_cles: [proportions, "taux d'évolution", évolution réciproque]
  noeuds: [q, q-construction]
  notions: [ensemble-rationnels]
  page_enonce: 7
  page_corrige: 8
  enonce: |
    Dans chaque cas, déterminer le taux de l'évolution réciproque, c'est-à-dire celle qui ramène à la valeur de départ. On arrondira si nécessaire au dixième de pourcent.

    **a)** Une hausse de $25\,\%$

    **b)** Une baisse de $20\,\%$

    **c)** Une hausse de $50\,\%$

    **d)** Une baisse de $10\,\%$

    **e)** Une hausse de $100\,\%$

    **f)** Une baisse de $75\,\%$

    Vérifier, pour la question a), que le produit des deux coefficients vaut bien $1$.
  corrige: |
    *Le coefficient de l'évolution réciproque est l'**inverse** du coefficient initial.*

    **a)** $\dfrac{1}{1{,}25}=0{,}8$ : $\boxed{-20\,\%}$

    **b)** $\dfrac{1}{0{,}8}=1{,}25$ : $\boxed{+25\,\%}$

    **c)** $\dfrac{1}{1{,}5}\approx 0{,}667$ : $\boxed{-33{,}3\,\%}$

    **d)** $\dfrac{1}{0{,}9}\approx 1{,}111$ : $\boxed{+11{,}1\,\%}$

    **e)** $\dfrac{1}{2}=0{,}5$ : $\boxed{-50\,\%}$

    **f)** $\dfrac{1}{0{,}25}=4$ : $\boxed{+300\,\%}$

    **Vérification pour a).** $1{,}25\times 0{,}8=1$ : la quantité est bien inchangée. 
    $$\boxed{\text{Deux évolutions réciproques ont un produit de coefficients égal à } 1.}$$
     *On remarque que* les questions a) et b) sont réciproques l'une de l'autre, ce qui confirme le résultat de l'exercice 17.d).
- id: "s-06-23"
  feuille: "f-s-06"
  numero: 23
  partie: "Évolution réciproque et points de pourcentage"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [proportions, évolution réciproque, contexte économique]
  noeuds: [q, q-construction]
  notions: [ensemble-rationnels]
  page_enonce: 7
  page_corrige: 8
  enonce: |
    **1.** Le prix d'un produit a augmenté de $60\,\%$. De quel pourcentage doit-il baisser pour revenir à son prix initial ?

    **2.** La population d'un village a diminué de $4\,\%$. De quel pourcentage doit-elle augmenter pour retrouver son effectif initial ? On arrondira au centième.

    **3.** Un commerçant augmente ses prix de $10\,\%$ en janvier. En mars, il souhaite revenir aux prix de décembre. Quelle remise doit-il annoncer ?

    **4.** Une hausse et sa réciproque ont-elles le même taux, au signe près ? Justifier à l'aide des questions précédentes.
  corrige: |
    **1.** $\dfrac{1}{1{,}6}=0{,}625$, soit une baisse de $\boxed{37{,}5\,\%}$.

    **2.** $\dfrac{1}{0{,}96}\approx 1{,}041\,67$, soit une hausse de $\boxed{+4{,}17\,\%}$.

    **3.** $\dfrac{1}{1{,}1}\approx 0{,}909\,1$, soit une remise de $\boxed{9{,}1\,\%}$.

    **4.** Non, jamais — sauf dans le cas trivial d'une évolution nulle. Une hausse de $60\,\%$ s'annule par une baisse de $37{,}5\,\%$, et une baisse de $4\,\%$ par une hausse de $4{,}17\,\%$. 
    $$\boxed{\begin{array}{l} \text{La baisse réciproque d'une hausse est toujours \emph{plus faible} en valeur absolue,}\\[1mm] \text{car elle s'applique à une quantité devenue plus grande.} \end{array}}$$
- id: "s-06-24"
  feuille: "f-s-06"
  numero: 24
  partie: "Évolution réciproque et points de pourcentage"
  etoiles: 1
  types: [Calcul]
  mots_cles: [proportions, "taux d'évolution", points de pourcentage]
  noeuds: [q]
  notions: [ensemble-rationnels]
  page_enonce: 7
  page_corrige: 9
  enonce: |
    *On rappelle la distinction du cours : le **point** mesure un écart entre deux pourcentages, le **pourcentage** mesure une évolution relative.*

    **1.** Le taux de chômage d'un pays passe de $8\,\%$ à $9{,}6\,\%$.

    **(a)** De combien de points a-t-il augmenté ?

    **(b)** De combien de pourcents a-t-il augmenté ?

    **2.** Le taux de réussite à un examen passe de $80\,\%$ à $84\,\%$. Répondre aux deux mêmes questions.

    **3.** Un taux de participation passe de $12\,\%$ à $9\,\%$. Répondre aux deux mêmes questions.

    **4.** Un journal titre : « le chômage augmente de $2\,\%$ », alors que le taux est passé de $10\,\%$ à $12\,\%$. Le titre est-il correct ? Que faudrait-il écrire ?
  corrige: |
    **1.** **(a)** $9{,}6-8=\boxed{1{,}6 \text{ point}}$

    **(b)** $\dfrac{9{,}6-8}{8}=\dfrac{1{,}6}{8}=0{,}2=\boxed{+20\,\%}$

    **2.** $84-80=\boxed{4 \text{ points}}$ et $\dfrac{4}{80}=0{,}05=\boxed{+5\,\%}$

    **3.** $9-12=\boxed{-3 \text{ points}}$ et $\dfrac{-3}{12}=-0{,}25=\boxed{-25\,\%}$

    **4.** Le titre est **incorrect**. Le taux a augmenté de $2$ *points*, mais l'évolution relative vaut 
    $$\frac{12-10}{10}=0{,}2=20\,\%$$

    $$\boxed{\text{Il faudrait écrire : « le chômage augmente de } 2 \text{ points », ou « de } 20\,\% \text{ ».}}$$
     *L'erreur n'est pas anodine :* elle annonce une hausse dix fois moindre qu'elle ne l'est réellement.
- id: "s-06-25"
  feuille: "f-s-06"
  numero: 25
  partie: "Évolution réciproque et points de pourcentage"
  etoiles: 2
  types: [Calcul]
  mots_cles: [proportions, évolutions successives, contexte économique]
  noeuds: [q, n-operations]
  notions: [ensemble-rationnels]
  page_enonce: 7
  page_corrige: 9
  enonce: |
    *Chacun des énoncés suivants est trompeur ou faux. L'analyser, expliquer l'erreur ou l'ambiguïté, puis proposer une formulation correcte.*

    **1.** « Notre magasin a baissé ses prix de $40\,\%$ le mois dernier et de $30\,\%$ ce mois-ci : soit $70\,\%$ de remise au total ! »

    **2.** « Le nombre d'accidents a augmenté de $200\,\%$ : il a donc doublé. »

    **3.** « Cette année, $30\,\%$ des élèves ont choisi l'option théâtre, contre $25\,\%$ l'an dernier : une progression de $5\,\%$. »

    **4.** « Le prix a augmenté de $10\,\%$ puis a rebaissé de $10\,\%$ : vous ne perdez rien. »

    **5.** « Les ventes de notre produit ont progressé de $500\,\%$, celles du concurrent de $20\,\%$ seulement. » On précisera quelle information manque pour juger de cette affirmation.
  corrige: |
    **1.** **Faux.** Les taux ne s'additionnent pas. Le coefficient global vaut $0{,}6\times 0{,}7=0{,}42$, soit une remise réelle de $58\,\%$. 
    $$\boxed{\text{Formulation correcte : « soit } 58\,\% \text{ de remise au total ».}}$$
     *Ici l'annonce est en défaveur du magasin*, qui pourrait afficher mieux que ce qu'il prétend.

    **2.** **Faux.** Une hausse de $200\,\%$ correspond à $\mathrm{CM}=3$ : le nombre a été **triplé**. 
    $$\boxed{\text{Doubler correspond à une hausse de } 100\,\%.}$$

    **3.** **Ambigu.** L'écart est de $5$ *points*, mais l'évolution relative vaut $\dfrac{30-25}{25}=20\,\%$. 
    $$\boxed{\text{Il faut écrire « une progression de } 5 \text{ points » ou « de } 20\,\% \text{ ».}}$$

    **4.** **Faux.** Le coefficient global vaut $1{,}1\times 0{,}9=0{,}99$ : 
    $$\boxed{\text{le prix a en réalité baissé de } 1\,\%.}$$
     *Cette fois l'annonce est en défaveur du client*, à qui l'on fait croire qu'il paiera le prix initial.

    **5.** **Information manquante : les valeurs de départ.** Une progression de $500\,\%$ sur $10$ ventes fait passer à $60$ ventes, tandis qu'une progression de $20\,\%$ sur $100\,000$ ventes en ajoute $20\,000$. 
    $$\boxed{\text{Un pourcentage d'évolution ne dit rien tant qu'on ignore la quantité de départ.}}$$
- id: "s-06-26"
  feuille: "f-s-06"
  numero: 26
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [QCM, Démonstration, Calcul]
  mots_cles: [proportions, "taux d'évolution", coefficient multiplicateur, évolution réciproque, points de pourcentage, contexte économique]
  noeuds: [q, q-construction]
  notions: [ensemble-rationnels]
  page_enonce: 8
  page_corrige: 9
  enonce: |
    Pour chaque question, une seule réponse est exacte. Déterminer laquelle et justifier.

    ```tableau
     ¦ Réponse A ¦ Réponse B ¦ Réponse C
    1. $20\,\%$ de $150$ vaut ¦ $30$ ¦ $3$ ¦ $130$
    2. La proportion $\dfrac{3}{8}$ correspond à ¦ $3{,}8\,\%$ ¦ $37{,}5\,\%$ ¦ $0{,}38\,\%$
    3. Le coefficient multiplicateur associé à une baisse de $15\,\%$ est ¦ $0{,}15$ ¦ $0{,}85$ ¦ $1{,}15$
    4. Un prix passe de $40$ € à $50$ €. Le taux d'évolution est ¦ $+25\,\%$ ¦ $+20\,\%$ ¦ $+10\,\%$
    5. Une hausse de $10\,\%$ suivie d'une hausse de $10\,\%$ donne une hausse globale de ¦ $20\,\%$ ¦ $21\,\%$ ¦ $100\,\%$
    6. Après une hausse de $25\,\%$, un prix vaut $75$ €. Le prix initial était ¦ $60$ € ¦ $56{,}25$ € ¦ $50$ €
    7. L'évolution réciproque d'une baisse de $50\,\%$ est une hausse de ¦ $50\,\%$ ¦ $100\,\%$ ¦ $200\,\%$
    8. Un taux passe de $20\,\%$ à $25\,\%$ : il a augmenté de ¦ $5$ points ¦ $5\,\%$ ¦ $20$ points
    9. $30\,\%$ des $40\,\%$ d'une population représentent ¦ $70\,\%$ ¦ $12\,\%$ ¦ $10\,\%$
    10. Un coefficient multiplicateur de $1{,}5$ correspond à ¦ $+50\,\%$ ¦ $+150\,\%$ ¦ $+15\,\%$
    ```
  corrige: |
    **1.** **Réponse A.** $0{,}2\times 150=30$. La réponse B divise par $100$ une fois de trop.

    **2.** **Réponse B.** $3\div 8=0{,}375$, que l'on multiplie par $100$.

    **3.** **Réponse B.** $\mathrm{CM}=1+t=1-0{,}15=0{,}85$. La réponse A confond le coefficient avec le taux lui-même.

    **4.** **Réponse A.** $\dfrac{50-40}{40}=\dfrac{10}{40}=0{,}25$. La réponse B rapporterait la hausse à la valeur d'arrivée, ce qui est faux.

    **5.** **Réponse B.** $1{,}1\times 1{,}1=1{,}21$. La réponse A additionne les taux.

    **6.** **Réponse A.** $\dfrac{75}{1{,}25}=60$. La réponse B applique une baisse de $25\,\%$ au lieu de diviser.

    **7.** **Réponse B.** $\dfrac{1}{0{,}5}=2$, soit une hausse de $100\,\%$ — il faut doubler pour retrouver la valeur initiale.

    **8.** **Réponse A.** L'écart entre deux pourcentages se mesure en points. En relatif, la hausse serait de $25\,\%$.

    **9.** **Réponse B.** $0{,}3\times 0{,}4=0{,}12$. La réponse A additionne les proportions au lieu de les multiplier.

    **10.** **Réponse A.** $t=\mathrm{CM}-1=1{,}5-1=0{,}5$.
- id: "s-06-27"
  feuille: "f-s-06"
  numero: 27
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux]
  mots_cles: [proportions, "taux d'évolution", coefficient multiplicateur, évolutions successives, évolution réciproque, contexte économique]
  noeuds: [q, n-operations, q-construction]
  notions: [ensemble-rationnels]
  page_enonce: 8
  page_corrige: 10
  enonce: |
    Pour chacune des affirmations suivantes, dire si elle est vraie ou fausse. Si elle est fausse, donner un contre-exemple ou l'énoncé correct.

    **1.** Une proportion est toujours comprise entre $0$ et $1$.

    **2.** Un taux d'évolution peut dépasser $100\,\%$.

    **3.** Deux hausses successives de $10\,\%$ donnent une hausse globale de $20\,\%$.

    **4.** Une hausse de $50\,\%$ suivie d'une baisse de $50\,\%$ ramène au prix initial.

    **5.** Pour retrouver le prix avant une hausse de $20\,\%$, on divise par $1{,}2$.

    **6.** Le coefficient multiplicateur d'une baisse de $100\,\%$ vaut $0$.

    **7.** Un taux de chômage qui passe de $5\,\%$ à $10\,\%$ a augmenté de $5\,\%$.

    **8.** Deux proportions calculées sur la même référence, portant sur des groupes sans élément commun, peuvent s'additionner.

    **9.** $20\,\%$ de $50\,\%$ d'une population représentent $10\,\%$ de cette population.

    **10.** L'ordre dans lequel on applique deux évolutions successives change le résultat final.
  corrige: |
    **1.** **Vraie**. Une proportion est un quotient $\dfrac{k}{n}$ avec $0\leqslant k\leqslant n$ : une part ne peut pas dépasser le tout.

    **2.** **Vraie**. *Exemple :* un prix qui triple subit une hausse de $200\,\%$. Un taux d'évolution n'est pas une proportion : il compare une variation à une valeur de départ, et n'est donc pas borné.

    **3.** **Fausse**. Le coefficient global vaut $1{,}1\times 1{,}1=1{,}21$, soit une hausse de $\boxed{21\,\%}$ et non $20\,\%$.

    **4.** **Fausse**. $1{,}5\times 0{,}5=0{,}75$ : le prix a en réalité *baissé* de $25\,\%$. *Énoncé correct :* c'est une baisse de $33{,}3\,\%$ qui compense une hausse de $50\,\%$.

    **5.** **Vraie**. On a $V_{A}=1{,}2\times V_{D}$, donc $V_{D}=\dfrac{V_{A}}{1{,}2}$.

    **6.** **Vraie**. Une baisse de $100\,\%$ donne $\mathrm{CM}=1-1=0$ : la quantité disparaît entièrement.

    **7.** **Fausse**. Il a augmenté de $5$ *points*, ce qui correspond à une hausse relative de $\dfrac{10-5}{5}=100\,\%$. *Le taux a doublé.*

    **8.** **Vraie**. C'est précisément la condition énoncée par le cours : les groupes ne doivent pas se recouvrir.

    **9.** **Vraie**. $0{,}2\times 0{,}5=0{,}1$, soit $10\,\%$.

    **10.** **Fausse**. Le coefficient global est un produit, et la multiplication est commutative : 
    $$\mathrm{CM}_{1}\times\mathrm{CM}_{2}=\mathrm{CM}_{2}\times\mathrm{CM}_{1}$$

    $$\boxed{\text{L'ordre n'a aucune importance — c'est l'objet de la question 3 de l'exercice 19.}}$$
- id: "s-06-28"
  feuille: "f-s-06"
  numero: 28
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Calcul]
  mots_cles: [proportions, "taux d'évolution", coefficient multiplicateur, évolutions successives, évolution réciproque, contexte économique]
  noeuds: [q, n-operations, q-construction]
  notions: [ensemble-rationnels]
  page_enonce: 9
  page_corrige: 10
  enonce: |
    Un magasin vend un vélo au prix de $480$ €.

    **1.** En janvier, le prix augmente de $5\,\%$. Calculer le nouveau prix.

    **2.** En mars, le magasin applique une remise de $15\,\%$ sur ce nouveau prix. Calculer le prix soldé.

    **3.** Calculer le coefficient multiplicateur global depuis le prix initial, puis le taux d'évolution global. Le prix a-t-il finalement augmenté ou diminué ?

    **4.** Quelle évolution, appliquée au prix soldé, ramènerait exactement au prix initial de $480$ € ? On arrondira au dixième de pourcent.

    **5.** Le magasin souhaitait en réalité que le prix de mars soit inférieur de $5\,\%$ au prix initial. Quelle remise aurait-il dû appliquer en mars, à la place des $15\,\%$ ? On arrondira au dixième de pourcent.
  corrige: |
    **1.** $480\times 1{,}05=\boxed{504~\text{€}}$

    **2.** $504\times 0{,}85=\boxed{428{,}40~\text{€}}$

    **3.** $\mathrm{CM}=1{,}05\times 0{,}85=\boxed{0{,}892\,5}$, soit un taux global de $\boxed{-10{,}75\,\%}$. 
    $$\boxed{\text{Le prix a donc finalement \emph{diminué}, malgré la hausse de janvier.}}$$

    **4.** Il faut un coefficient $\mathrm{CM}'=\dfrac{1}{0{,}892\,5}\approx 1{,}120\,4$ : 
    $$\boxed{\text{une hausse d'environ } 12{,}0\,\%.}$$
     *Vérification :* $428{,}40\times 1{,}1204\approx 480$ €.

    **5.** On veut un coefficient global de $0{,}95$. La remise de mars doit donc avoir pour coefficient 
    $$\mathrm{CM}_{2}=\frac{0{,}95}{1{,}05}\approx 0{,}904\,8 \qquad\text{soit une remise de}\qquad \boxed{9{,}5\,\%}$$
- id: "s-06-29"
  feuille: "f-s-06"
  numero: 29
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Calcul]
  mots_cles: [proportions, "taux d'évolution", coefficient multiplicateur, évolutions successives]
  noeuds: [q, n-operations]
  notions: [ensemble-rationnels]
  page_enonce: 9
  page_corrige: 11
  enonce: |
    Une ville comptait $25\,000$ habitants au $1^{\text{er}}$ janvier $2020$. Sa population a ensuite évolué ainsi : $+2\,\%$ en $2021$, $-1{,}5\,\%$ en $2022$, puis $+3\,\%$ en $2023$.

    **1.** Calculer la population au $1^{\text{er}}$ janvier de chacune des trois années suivantes. On arrondira à l'unité.

    **2.** Calculer le coefficient multiplicateur global sur les trois années.

    **3.** En déduire le taux d'évolution global, arrondi au dixième de pourcent.

    **4.** Retrouver la population de $2023$ en utilisant directement le coefficient global.

    **5.** Un habitant affirme : « la population a augmenté de $2-1{,}5+3=3{,}5\,\%$ ». Expliquer pourquoi ce raisonnement est faux, et pourquoi il donne malgré tout un résultat proche.

    **6.** De quel pourcentage la population devrait-elle évoluer en $2024$ pour retrouver exactement son effectif de $2020$ ? On arrondira au dixième.
  corrige: |
    **1.** En $2021$ : $25\,000\times 1{,}02=\boxed{25\,500}$ habitants.

    En $2022$ : $25\,500\times 0{,}985=25\,117{,}5$, soit environ $\boxed{25\,118}$ habitants.

    En $2023$ : $25\,117{,}5\times 1{,}03=25\,871{,}025$, soit environ $\boxed{25\,871}$ habitants.

    **2.** $\mathrm{CM}=1{,}02\times 0{,}985\times 1{,}03=\boxed{1{,}034\,841}$

    **3.** $t=\mathrm{CM}-1\approx 0{,}0348$, soit $\boxed{+3{,}5\,\%}$ arrondi au dixième.

    **4.** $25\,000\times 1{,}034\,841=25\,871{,}025$ : on retrouve bien le résultat de la question 1. 
    $$\boxed{\text{Le coefficient global permet de sauter les étapes intermédiaires.}}$$

    **5.** Le raisonnement est faux : les taux ne s'additionnent pas, ce sont les coefficients qui se multiplient. Il donne malgré tout un résultat proche ici parce que les trois taux sont **petits** : les produits croisés qu'on néglige alors sont d'ordre très faible. 
    $$\boxed{\begin{array}{l} \text{Le hasard fait que les deux méthodes donnent } 3{,}5\,\% \text{ à l'arrondi près,}\\[1mm] \text{mais le calcul exact vaut } 3{,}484\,1\,\% \text{ : l'accord n'est qu'approximatif.} \end{array}}$$

    **6.** Il faut un coefficient $\mathrm{CM}'=\dfrac{1}{1{,}034\,841}\approx 0{,}966\,3$ : 
    $$\boxed{\text{une baisse d'environ } 3{,}4\,\%.}$$
     *On notera que ce n'est pas* $-3{,}5\,\%$ : l'évolution réciproque d'une hausse est toujours un peu plus faible.
- id: "s-06-30"
  feuille: "f-s-06"
  numero: 30
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Calcul]
  mots_cles: [proportions, "taux d'évolution", coefficient multiplicateur, évolutions successives, contexte économique]
  noeuds: [q, n-operations]
  notions: [ensemble-rationnels]
  page_enonce: 9
  page_corrige: 11
  enonce: |
    Un salarié perçoit un salaire mensuel net de $1\,950$ €. Il obtient une augmentation de $2{,}5\,\%$, puis une seconde augmentation de $1{,}8\,\%$ l'année suivante.

    **1.** Calculer son salaire après chacune des deux augmentations. On arrondira au centime.

    **2.** Calculer le coefficient multiplicateur global, puis le taux d'évolution global du salaire sur les deux années.

    **3.** Sur la même période, les prix ont augmenté de $5\,\%$. Le *pouvoir d'achat* du salarié est mesuré par le rapport entre son salaire et les prix. Calculer le coefficient multiplicateur du pouvoir d'achat.

    **4.** Le pouvoir d'achat de ce salarié a-t-il augmenté ou diminué ? De quel pourcentage ? On arrondira au dixième.

    **5.** Quelle augmentation globale de salaire aurait-il fallu obtenir pour que le pouvoir d'achat reste inchangé ?
  corrige: |
    **1.** Après la première augmentation : $1\,950\times 1{,}025=\boxed{1\,998{,}75~\text{€}}$.

    Après la seconde : $1\,998{,}75\times 1{,}018\approx\boxed{2\,034{,}73~\text{€}}$.

    **2.** $\mathrm{CM}=1{,}025\times 1{,}018=\boxed{1{,}043\,45}$, soit un taux global de $\boxed{+4{,}345\,\%}$.

    **3.** Le pouvoir d'achat est le rapport du salaire aux prix : son coefficient est donc le quotient des deux coefficients. 
    $$\mathrm{CM}_{\text{pouvoir d'achat}}=\frac{1{,}043\,45}{1{,}05}\approx\boxed{0{,}993\,8}$$

    **4.** Ce coefficient est **inférieur à $1$** : 
    $$\boxed{\text{le pouvoir d'achat a \emph{diminué} d'environ } 0{,}6\,\%.}$$
     Le salaire a bien augmenté, mais moins vite que les prix.

    **5.** Pour que le pouvoir d'achat reste inchangé, il aurait fallu que le salaire suive exactement les prix, c'est-à-dire un coefficient global de $1{,}05$ : 
    $$\boxed{\text{une augmentation globale de } 5\,\%.}$$
- id: "s-06-31"
  feuille: "f-s-06"
  numero: 31
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Calcul]
  mots_cles: [proportions, "taux d'évolution", coefficient multiplicateur, évolutions successives, contexte économique]
  noeuds: [q, n-operations]
  notions: [ensemble-rationnels]
  page_enonce: 10
  page_corrige: 12
  enonce: |
    Un prix subit une hausse de $t\,\%$, puis une baisse de $t\,\%$. Dans tout l'exercice, on note $t$ le taux **en écriture décimale**, avec $0<t<1$ : ainsi $t=0{,}2$ correspond à $20\,\%$.

    **1.** Exprimer, en fonction de $t$, le coefficient multiplicateur de la hausse, puis celui de la baisse.

    **2.** En déduire que le coefficient multiplicateur global vaut $(1+t)(1-t)$.

    **3.** Développer cette expression à l'aide d'une identité remarquable.

    **4.** En déduire que le prix final est **toujours** strictement inférieur au prix initial, quelle que soit la valeur de $t$ choisie.

    **5.** Calculer le taux d'évolution global pour $t=0{,}1$, puis $t=0{,}2$, puis $t=0{,}5$.

    **6.** Existe-t-il une valeur de $t$ pour laquelle le prix final égale le prix initial ?

    **7.** Déterminer la valeur de $t$ pour laquelle la perte finale est exactement de $9\,\%$.

    **8.** Que se passe-t-il si l'on applique d'abord la baisse puis la hausse ? Justifier sans aucun calcul supplémentaire.
  corrige: |
    **1.** La hausse de $t$ a pour coefficient $\boxed{1+t}$, et la baisse de $t$ a pour coefficient $\boxed{1-t}$.

    **2.** Les coefficients se multiplient : 
    $$\boxed{\mathrm{CM}_{\text{global}}=(1+t)(1-t)}$$

    **3.** On reconnaît l'identité remarquable $(a+b)(a-b)=a^{2}-b^{2}$ avec $a=1$ et $b=t$ : 
    $$\boxed{(1+t)(1-t)=1-t^{2}}$$

    **4.** Comme $0<t<1$, on a $t^{2}>0$, donc $1-t^{2}<1$. 
    $$\boxed{\begin{array}{l} \text{Le coefficient global est strictement inférieur à } 1 \text{ : le prix final est}\\[1mm] \text{toujours strictement inférieur au prix initial, quelle que soit la valeur de } t. \end{array}}$$

    **5.**

    • $t=0{,}1$ : $\mathrm{CM}=1-0{,}01=0{,}99$, soit $\boxed{-1\,\%}$ ;

    • $t=0{,}2$ : $\mathrm{CM}=1-0{,}04=0{,}96$, soit $\boxed{-4\,\%}$ ;

    • $t=0{,}5$ : $\mathrm{CM}=1-0{,}25=0{,}75$, soit $\boxed{-25\,\%}$.

    *On retrouve les résultats des exercices 19 et 17.c).* La perte augmente très vite avec $t$, puisqu'elle vaut exactement $t^{2}$.

    **6.** Il faudrait $1-t^{2}=1$, c'est-à-dire $t^{2}=0$, donc $t=0$ : 
    $$\boxed{\text{aucune valeur de } t \text{ dans } ]0\,;1[ \text{ ne convient.}}$$

    **7.** Une perte de $9\,\%$ signifie $\mathrm{CM}=0{,}91$, donc 
    $$1-t^{2}=0{,}91 \iff t^{2}=0{,}09 \iff t=0{,}3$$
     (on ne retient que la solution positive, car $0<t<1$) 
    $$\boxed{t=30\,\%}$$

    **8.** L'expression $(1+t)(1-t)$ est un produit, et la multiplication est commutative : on obtiendrait $(1-t)(1+t)$, c'est-à-dire le même nombre. 
    $$\boxed{\text{Le résultat final est identique, quel que soit l'ordre choisi.}}$$
- id: "s-06-32"
  feuille: "f-s-06"
  numero: 32
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Conjecture, Démonstration]
  mots_cles: [proportions, "taux d'évolution", coefficient multiplicateur, évolution réciproque, contexte économique]
  noeuds: [q, q-construction]
  notions: [ensemble-rationnels]
  page_enonce: 10
  page_corrige: 12
  enonce: |
    On s'intéresse à l'évolution réciproque d'une hausse. Un prix augmente de $t\,\%$, où $t$ désigne encore le taux en écriture décimale, avec $t>0$. On note $t'$ le taux de l'évolution qui ramène au prix initial.

    **1.** Justifier que le coefficient multiplicateur de l'évolution réciproque vaut $\dfrac{1}{1+t}$.

    **2.** En déduire que 
    $$t'=\frac{1}{1+t}-1=\frac{-t}{1+t}$$

    **3.** Vérifier cette formule pour $t=0{,}25$, et retrouver le résultat du cours.

    **4.** Recopier et compléter le tableau suivant, en arrondissant au centième de pourcent.

    $$\begin{array}{|c|c|c|c|c|} \hline \text{Hausse }t & 10\,\% & 20\,\% & 50\,\% & 100\,\% \\ \hline \text{Baisse réciproque }t' &  &  &  &  \\ \hline \end{array}$$

    **5.** Comparer $|t'|$ et $t$ dans chacun des cas du tableau. Émettre une conjecture.

    **6.** Démontrer cette conjecture. *On pourra comparer $\dfrac{t}{1+t}$ et $t$ en remarquant que $1+t>1$.*

    **7.** Que devient le taux $t'$ lorsque $t$ devient très grand ? Interpréter ce résultat par une phrase.
  corrige: |
    **1.** La hausse a pour coefficient $1+t$. L'évolution réciproque doit ramener à la valeur de départ, donc le produit des deux coefficients doit valoir $1$ : 
    $$(1+t)\times\mathrm{CM}'=1 \qquad\Longrightarrow\qquad \boxed{\mathrm{CM}'=\frac{1}{1+t}}$$

    **2.** On en déduit le taux en retranchant $1$, puis en réduisant au même dénominateur : 
    $$t'=\mathrm{CM}'-1=\frac{1}{1+t}-\frac{1+t}{1+t}=\frac{1-(1+t)}{1+t}=\boxed{\frac{-t}{1+t}}$$

    **3.** Pour $t=0{,}25$ : 
    $$t'=\frac{-0{,}25}{1{,}25}=-0{,}2=\boxed{-20\,\%}$$
     On retrouve bien le résultat du cours : une hausse de $25\,\%$ s'annule par une baisse de $20\,\%$.

    **4.**

    $$\begin{array}{|c|c|c|c|c|} \hline \text{Hausse }t & 10\,\% & 20\,\% & 50\,\% & 100\,\% \\ \hline \text{Baisse réciproque }t' & -9{,}09\,\% & -16{,}67\,\% & -33{,}33\,\% & -50\,\% \\ \hline \end{array}$$

    **5.** Dans les quatre cas, $|t'|$ est **strictement inférieur** à $t$ : $9{,}09<10$, $16{,}67<20$, $33{,}33<50$ et $50<100$. 
    $$\boxed{\text{Conjecture : pour tout } t>0,\ |t'|<t.}$$

    **6.** On a $|t'|=\dfrac{t}{1+t}$. Comme $t>0$, on a $1+t>1$, et diviser par un nombre strictement supérieur à $1$ diminue : 
    $$\frac{t}{1+t}<\frac{t}{1}=t$$

    $$\boxed{\text{La conjecture est démontrée : } |t'|<t.}$$
     *Interprétation :* la baisse réciproque s'applique à une quantité devenue plus grande, elle peut donc être proportionnellement plus faible pour retirer la même chose.

    **7.** Lorsque $t$ devient très grand, le quotient $\dfrac{t}{1+t}$ se rapproche de $1$ sans jamais l'atteindre : par exemple $t=99$ donne $|t'|=\dfrac{99}{100}=0{,}99$. 
    $$\boxed{t' \text{ se rapproche de } -100\,\%.}$$
     *Interprétation :* si un prix est multiplié par un très grand nombre, il faut le réduire de presque tout — mais jamais de la totalité, ce qui l'annulerait.

