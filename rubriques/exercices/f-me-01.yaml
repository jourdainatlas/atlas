  enonce: |
    Soit $p > 3$ un nombre premier.

    **1.** Quels sont les restes possibles dans la division euclidienne de $p$ par $12$ ?

    **2.** Montrer que $p^{2} + 11$ est divisible par 12.
  corrige: |
    Soit $p > 3$ un nombre premier.

    **1.** Si on considère la division euclidienne de $p$ par $12$ en notant $q$ on quotient et $r$ son reste, on a alors : 
    $$p=12q+r$$
     avec $0\leqslant r<12$. On élimine les restes impossibles : si $r$ est pair, alors $p=2(6q)+r$ est pair, donc $p=2$, ce qui est exclu puisque $p>3$ ; si $r=3$ ou $r=9$, alors $p=3(4q)+r$ est divisible par $3$, donc $p=3$, ce qui est également exclu ; enfin $r=0$ donnerait $p=12q$, divisible par $12$. On en déduit donc : 
    $$\boxed{ r \in \{ 1,5,7,11 \} }$$

    **2.** On remarque que : 
    $$\begin{aligned} p^2+11 &= (12q+r)^2+11 \\ &= 144q^2+24qr+r^2+11 \\ &= 12(12q^2+2qr)+r^2+11 \end{aligned}$$
     Ainsi $p^2+11$ est divisible par $12$ si et seulement si $r^2+11$ est divisible par $12$, or pour les différentes valeurs possibles de $r$ : 
    $$\begin{aligned} 1^2+11 &= 12 \\ 5^2+11&= 25+11 \\ &= 36 = 3\times 12 \\ 7^2+11 &= 49 +11 \\ &= 60 = 5 \times 12 \\ 11^2+11 &= 11(11+1) = 11\times 12 \end{aligned}$$
     Ce qui prouve que $\boxed{{p^2+11}\text{ est divisible par }{12}}$.
- id: "me-01-18"
  feuille: "f-me-01"
  numero: 18
  partie: "Nombres premiers et décomposition en facteurs premiers"
  etoiles: 2
  types: [Calcul]
  mots_cles: [nombres premiers, parité]
  noeuds: [z-premiers]
  notions: [nombre-premier]
  page_enonce: 3
  page_corrige: 12
  enonce: |
    Déterminer si chacune des affirmations suivantes est **Vraie** ou **Fausse** :

    **1.** Il existe une valeur $n\in\mathbb{N}$ tel que $2n^{2}+n-10$ est premier.

    **2.** Il existe une valeur $n\in\mathbb{N}$ tel que $2n^{2}+7n+6$ est premier.

    **3.** Pour tout $n\in\mathbb{N}$, le nombre $n^{2}-3n+10$ n'est pas premier.

    **4.** Pour tout entier $n$ impair, le nombre $N=n+(n+2)+n(n+2)$ est un nombre premier.
  corrige: |
    Déterminer si chacune des affirmations suivantes est **Vraie** ou **Fausse** :

    **1.** $\boxed{\text{Vraie, pour }{n=3}}$, en effet : 
    $$2\times 3^2+3-10 = 18-7 = 11 \; \text{qui est premier}$$

    **2.** $\boxed{\text{Fausse}}$, en effet pour tout $n\in\mathbb{N}$ : 
    $$\begin{aligned} (2n+3)(n+2) &= 2n^2+4n+3n+6 \\ &= 2n^2+7n+6 \end{aligned}$$
     Et par définition de $n$, $(2n+3)$ et $(n+2)$ sont des entiers différents de $1$.

    **3.** $\boxed{\text{Vraie}}$, en effet, on remarque que pour tout $n\in\mathbb{N}$ : 
    $$\begin{aligned} n^{2}-3n+10 &= n(n-3)+10 \end{aligned}$$
     Or $n$ ou $n-3$ est nécessairement pair, donc $n(n-3)$ est pair. Le nombre $10$ étant également pair, $2$ est donc facteur du nombre $n(n-3)+10$. De plus, $n^2-3n+10=\left(n-\frac{3}{2}\right)^{2}+\frac{31}{4}\geqslant\frac{31}{4}>2$ : c'est un nombre pair différent de $2$, ce qui justifie que $n^2-3n+10$ n'est pas premier.

    **4.** $\boxed{\text{Fausse}}$, en effet, on pourrait tester jusqu'à trouver un contre exemple, mais en partant de l'idée que l'affirmation est vraie, on peut mettre en évidence ce dernier. Soit $n\in\mathbb{N}$ impair, on sait alors qu'il existe $k\in\mathbb{N}$ tel que $n=2k+1$. Ainsi : 
    $$\begin{aligned} N &= n+(n+2)+n(n+2) \\ &= 2k+1+(2k+3)+(2k+1)(2k+3) \\ &= 4k+4+(4k^2+6k+2k+3) \\ &= 4k^2+12k+7 \end{aligned}$$
     Or on voit ici que si $n=15$, donc si $k=7$, alors $7$ est facteur de $N$, ce qui prouve que $N$ n'est pas premier. ($n=9$ est également un contre-exemple)
- id: "me-01-19"
  feuille: "f-me-01"
  numero: 19
  partie: "Nombres premiers et décomposition en facteurs premiers"
  etoiles: 1
  types: [Calcul]
  mots_cles: [divisibilité]
  noeuds: [z-division]
  notions: []
  page_enonce: 3
  page_corrige: 12
  enonce: |
    L’entier parmi les nombres inférieurs ou égaux à 50 qui possède le plus de diviseurs en possède précisément 10. Trouver cet entier.
  corrige: |
    Notons $N$ le nombre recherché. On utilise dans cet exercice la propriété sur le nombre de diviseurs à partir de la décomposition en facteurs premiers. En effet, on cherche : 
    $$N=p_{1}^{\alpha_1}p_{2}^{\alpha_2}\dots p_{k}^{\alpha_k} \qquad \text{tel que} \qquad (\alpha_1+1)(\alpha_2+1)\dots(\alpha_k+1)=10$$
     Or $10=2\times 5$, le produit ne peut donc être que $10$ ou $2\times 5$. On comprend tout d'abord qu'aucun $\alpha_i$ ne peut valoir $9$, car sinon $p_{i}^9$ serait supérieur à $50$, ce qui est impossible. Ainsi le produit est nécessairement $2\times5$ et on a un $\alpha_i$ qui vaut $1$ et l'autre qui vaut $4$. Sachant que $3^4=81$, ce qui est supérieur à $50$, on en déduit que $4$ est l'exposant du nombre premier $2$, ce qui donne alors : 
    $$N=2^4\times 3^1=48$$
     Le deuxième nombre premier est nécessairement $3$, car $2^4\times 5^1=80>50$. On peut donc enfin conclure qu'il n'existe qu'un unique entier contenu entre $0$ et $50$ qui possède précisément $10$ diviseurs, et c'est : 
    $$\boxed{N=48}$$
- id: "me-01-20"
  feuille: "f-me-01"
  numero: 20
  partie: "Nombres premiers et décomposition en facteurs premiers"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [divisibilité, nombres premiers, nombre et somme des diviseurs]
  noeuds: [z-division, z-premiers]
  notions: [nombre-premier]
  page_enonce: 3
  page_corrige: 12
  enonce: |
    **1.** Montrer qu'un entier naturel possède exactement $7$ diviseurs positifs si et seulement s'il s'écrit $p^{6}$ avec $p$ premier. Quel est le plus petit d'entre eux ?

    **2.** Déterminer le plus petit entier naturel possédant exactement $9$ diviseurs positifs.

    **3.** Déterminer le plus petit entier naturel possédant exactement $12$ diviseurs positifs.
  corrige: |
    Dans tout l'exercice, on écrit $N=p_{1}^{\alpha_{1}}\times\dots\times p_{k}^{\alpha_{k}}$ avec des exposants $\alpha_{i}\geqslant 1$, de sorte que chaque facteur $\alpha_{i}+1$ du nombre de diviseurs est au moins égal à $2$.

    **1.** Si $(\alpha_{1}+1)\times\dots\times(\alpha_{k}+1)=7$, comme $7$ est premier et que chaque facteur vaut au moins $2$, il n'y a qu'un seul facteur : $k=1$ et $\alpha_{1}=6$, donc $N=p^{6}$. Réciproquement, $p^{6}$ a bien $6+1=7$ diviseurs. Le plus petit est $\boxed{2^{6}=64}$.

    **2.** On a $9=9=3\times 3$, donc $N=p^{8}$ ou $N=p^{2}q^{2}$ avec $p<q$ premiers. Le plus petit nombre de la première forme est $2^{8}=256$, celui de la seconde $2^{2}\times 3^{2}=36$. Le plus petit entier ayant $9$ diviseurs est donc $\boxed{36}$.

    **3.** On a $12=12=6\times 2=4\times 3=3\times 2\times 2$. Pour minimiser $N$, on attribue les plus grands exposants aux plus petits nombres premiers : 
    $$\begin{aligned} &p^{11} : 2^{11}=2048 ; & &p^{5}q : 2^{5}\times 3=96 ; & &p^{3}q^{2} : 2^{3}\times 3^{2}=72 ; & &p^{2}qr : 2^{2}\times 3\times 5=60. \end{aligned}$$
     Le plus petit entier ayant $12$ diviseurs est donc $\boxed{60}$.

    L'erreur la plus répandue est d'oublier une des factorisations possibles du nombre de diviseurs : ici, c'est la dernière, avec trois facteurs premiers, qui donne le minimum.
- id: "me-01-21"
  feuille: "f-me-01"
  numero: 21
  partie: "Nombres premiers et décomposition en facteurs premiers"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [divisibilité, nombres premiers]
  noeuds: [z-division, z-premiers]
