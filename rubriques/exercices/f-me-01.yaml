  enonce: |
    Soit $E=\{(m,n)\in\mathbb{N}^{*}\times\mathbb{N}\;;\;m^{2}-1=2^{n}\}$.

    **a)** Montrer que, si $(m,n)\in E$, $m-1$ et $m+1$ sont de la forme $2^{k}$ avec $k\in\mathbb{N}$.

    **b)** Déterminer $E$.
  corrige: |
    **a)** Soit $(m,n)\in E$ : $(m-1)(m+1)=2^{n}$. On a $m\neq 1$, sinon $0=2^{n}$, donc $m\geqslant 2$ et $m-1\geqslant 1$. De plus $n\geqslant 1$, sinon $m^{2}=2$. Les entiers $m-1$ et $m+1$ sont des diviseurs positifs de $2^{n}$ ; d'après l'exercice 16, ils sont de la forme $2^{k}$ avec $0\leqslant k\leqslant n$. Ainsi $\boxed{m-1=2^{a} \text{ et } m+1=2^{b}}$ avec $a<b$.

    **b)** On a alors $2^{b}-2^{a}=2$. Si $a\geqslant 2$, le membre de gauche $2^{a}(2^{b-a}-1)$ est divisible par $4$, ce qui n'est pas le cas de $2$. Si $a=0$, on obtient $2^{b}=3$, impossible. Il reste $a=1$, qui donne $2^{b}=4$, donc $m-1=2$, soit $m=3$, puis $2^{n}=9-1=8$, soit $n=3$. Réciproquement $(3,3)$ convient, donc $\boxed{E=\{(3,3)\}}$.
