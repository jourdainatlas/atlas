  enonce: |
    Déterminer, parmi les nombres $101$, $10101$, $1010101$… ceux qui sont premiers.
  corrige: |
    Pour $k\geqslant 1$, on note $N_{k}=1+10^{2}+10^{4}+\dots+10^{2k}$ l'entier qui s'écrit avec $k+1$ chiffres $1$ séparés par des $0$ : $N_{1}=101$, $N_{2}=10101$, etc. D'après l'identité de l'exercice 30 a), appliquée à $100$ et $1$ : 
    $$99\,N_{k}=(100-1)(1+100+\dots+100^{k})=100^{k+1}-1=\left(10^{k+1}-1\right)\left(10^{k+1}+1\right).$$

    • **Si $k+1=2j$ est pair**, alors $10^{k+1}-1=100^{j}-1$ est divisible par $99$ (exercice 30 a)), et $N_{k}=\dfrac{100^{j}-1}{99}\times\left(10^{k+1}+1\right)$, où le premier facteur vaut $1+100+\dots+100^{j-1}$. Pour $j=1$, c'est-à-dire $k=1$, on obtient $N_{1}=101$, qui est premier : il n'est divisible ni par $2$, ni par $3$, ni par $5$, ni par $7$, et $11^{2}>101$. Pour $j\geqslant 2$, les deux facteurs sont strictement supérieurs à $1$, donc $N_{k}$ n'est pas premier.

    • **Si $k+1$ est impair**, avec $k+1\geqslant 3$, alors $9$ divise $10^{k+1}-1$ (exercice 28) et $11=10+1$ divise $10^{k+1}+1$ (exercice 30 b)). Ainsi : 
    $$N_{k}=\frac{10^{k+1}-1}{9}\times\frac{10^{k+1}+1}{11},$$
     où le premier facteur est l'entier $11\dots1$ à $k+1$ chiffres, au moins égal à $111$, et le second est au moins égal à $\frac{1001}{11}=91$. Donc $N_{k}$ n'est pas premier.

    Finalement, $\boxed{101 \text{ est le seul nombre premier de la liste}}$. *Vérification :* $10101=111\times 91=3\times 7\times 13\times 37$ et $1010101=101\times 10001=73\times 101\times 137$.
- id: "me-01-41"
  feuille: "f-me-01"
  numero: 41
  titre: "Nombres parfaits"
  partie: "Pour aller plus loin"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [divisibilité, nombres premiers, nombres remarquables]
  noeuds: [z-division, z-premiers]
  notions: [nombre-premier]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 537"
  page_enonce: 6
  page_corrige: 21
  enonce: |
    Un entier naturel $n\geqslant 2$ est parfait si la somme des diviseurs de $n$ autres que $n$ dans $\mathbb{N}^{*}$ est égale à $n$, autrement dit si la somme des diviseurs de $n$ dans $\mathbb{N}^{*}$ est égale à $2n$.

    **a)** Vérifier que $6$ et $28$ sont des nombres parfaits.

    **b)** Soit $n\in\mathbb{N}^{*}$ tel que $p:=2^{n}-1$ soit premier (i.e. un nombre de Mersenne, exercice 25). On pose $N=2^{n-1}(2^{n}-1)$. Montrer que $N$ est parfait.
  corrige: |
    **a)** Les diviseurs de $6$ autres que $6$ sont $1$, $2$, $3$, et $1+2+3=6$. Ceux de $28=2^{2}\times 7$ sont $1$, $2$, $4$, $7$, $14$, et $1+2+4+7+14=28$. Donc $\boxed{6 \text{ et } 28 \text{ sont parfaits}}$.

    **b)** Comme $2^{1}-1=1$ n'est pas premier, on a $n\geqslant 2$, donc $p=2^{n}-1\geqslant 3$ est un nombre premier impair, distinct de $2$. La décomposition de $N$ est donc $N=2^{n-1}\times p$, et d'après l'exercice 16, ses diviseurs sont les $2^{i}$ et les $2^{i}p$ pour $0\leqslant i\leqslant n-1$. Leur somme vaut : 
    $$(1+2+\dots+2^{n-1})(1+p)=(2^{n}-1)\times 2^{n}=2\times 2^{n-1}(2^{n}-1)=2N,$$
     en utilisant $1+2+\dots+2^{n-1}=2^{n}-1$ (exercice 26, question 2). Ainsi $\boxed{N \text{ est parfait}}$.

    Pour $n=2$, $3$, $5$ et $7$, on obtient les nombres parfaits $6$, $28$, $496$ et $8128$. Ce résultat figure déjà dans les Éléments d'Euclide (livre IX, proposition 36) ; Euler a démontré au XVIIIe siècle que tout nombre parfait pair est de cette forme. On ignore toujours s'il existe des nombres parfaits impairs.

