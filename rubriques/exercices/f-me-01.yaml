  page_enonce: 4
  page_corrige: 15
  enonce: |
    Soit $n\in\mathbb{N}^{*}$, on appelle nombre de Mersenne tout nombre $M_{n}=2^{n}-1$.

    **1.** Soient $a\in\mathbb{N}^{*}$. On suppose que $a$ et $n$ sont supérieurs ou égaux à $2$. Montrer que si $a^{n}-1$ est premier, alors $a=2$ et $n$ est premier.

    **2.** Vérifier que $M_{11}$ n'est pas premier.
  corrige: |
    Soit $n\in\mathbb{N}^{*}$, on appelle nombre de Mersenne tout nombre $M_{n}=2^{n}-1$.

    **1.** Pour répondre à cette question, on aura besoin de prouver le résultat suivant : 
    $$\mathcal{P}_{n} \; : \; \text{«} \forall n \in \mathbb{N}^*, \qquad a^n-1=(a-1)(1+a+a^2+\dots+a^{n-1}) \text{»}$$
     On procède par récurrence :

    • **Initialisation :** On constate que : 
    $$a^1-1=(a-1)\times 1$$
     Ainsi $\mathcal{P}_1$ est vraie.

    • **Hérédité :** Soit $k\in\mathbb{N}^{*}$, on suppose que la propriété $\mathcal{P}_{k}$ est vraie. On a alors : 
    $$\begin{aligned} (a-1)(1+a+a^2+\dots+a^k) &= (a-1)(1+a+a^2+\dots+a^{k-1}+a^k) \\ &= (a-1)(1+a+a^2+\dots+a^{k-1})+(a-1)\times a^k \\ &= a^k-1+a^{k+1}-a^k \\ &= a^{k+1}-1 \end{aligned}$$
     Ce qui prouve donc que $\mathcal{P}_{k+1}$ est vraie.

    • **Conclusion :** D'après le principe de récurrence, la propriété $\mathcal{P}_{n}$ est donc vraie pour tout $n\in\mathbb{N}$.

    On déduit ainsi du résultat précédent que si $a^n-1$ est premier, son facteur $(a-1)$ vaut nécessairement $1$ et donc $\boxed{a=2}$. Supposons maintenant que $n$ n'est pas premier afin de raisonner par l'absurde. Si $n$ n'est pas premier, alors il existe $p$ et $q$ deux entiers supérieurs ou égaux à $2$ tels que $n=p\times q$. Ainsi si on applique le résultat prouvé précédemment, on a : 
    $$\begin{aligned} a^n-1 &= a^{p\times q}-1 \\ &= (a^p)^q-1 \\ &= (a^p-1)(1+a^p+a^{2p}+\dots + a^{p \times (q-1)} ) \\ &= (a-1)\underbrace{(1+a+a^2+\dots+a^{p-1})}_{\neq 1}\underbrace{(1+a^p+a^{2p}+\dots + a^{p \times (q-1)} )}_{\neq 1} \end{aligned}$$
     Ainsi $a^n-1$ ne serait pas premier, ce qui est absurde, ce qui justifie que $\boxed{{n}\text{ est premier}}$. Ainsi, un nombre de Mersenne ne peut être premier que si $n$ est premier.

    **2.** Dans cette question, on vérifie que la réciproque est fausse, tout nombre de Mersenne n'est pas premier. En effet : 
    $$2^{11}-1=2047 = 23\times 89$$
     Ainsi $\boxed{{M_{11}}\text{ n'est pas premier}}$.
- id: "me-01-26"
  feuille: "f-me-01"
  numero: 26
