    • $401$ est un nombre premier.

    • $419$ est un nombre premier.

    • $437=19\times 23$.

    • $527=17\times 31$.

    • $719$ est un nombre premier.
- id: "me-01-16"
  feuille: "f-me-01"
  numero: 16
  partie: "Nombres premiers et décomposition en facteurs premiers"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [divisibilité, nombres premiers, décomposition en facteurs premiers, nombre et somme des diviseurs]
  noeuds: [z-division, z-premiers]
  notions: [nombre-premier]
  page_enonce: 3
  page_corrige: 11
  enonce: |
    **1.** Décomposer en produit de facteurs premiers les entiers $360$, $1001$, $2024$ et $3600$, puis donner le nombre de diviseurs positifs de chacun d'eux.

    **2.** Décomposer $72$ en produit de facteurs premiers, puis donner la liste complète de ses diviseurs positifs.

    **3.** Soit $N=p_{1}^{\alpha_{1}}\times\dots\times p_{k}^{\alpha_{k}}$ la décomposition en facteurs premiers d'un entier $N\geqslant 2$. Montrer qu'un entier naturel $d$ divise $N$ si et seulement si $d$ s'écrit : 
    $$d=p_{1}^{\beta_{1}}\times\dots\times p_{k}^{\beta_{k}} \qquad\text{avec}\qquad 0\leqslant \beta_{i}\leqslant\alpha_{i} \text{ pour tout } i\in\llbracket 1;k\rrbracket.$$
     *On pourra écrire $N=d\times m$ et utiliser l'unicité de la décomposition.*
  corrige: |
    **1.** En divisant successivement par les nombres premiers dans l'ordre croissant, on obtient : 
    $$\begin{aligned} 360 &= 2^{3}\times 3^{2}\times 5, & &\text{donc } (3+1)(2+1)(1+1)=24 \text{ diviseurs} ; \\ 1001 &= 7\times 11\times 13, & &\text{donc } 2\times 2\times 2=8 \text{ diviseurs} ; \\ 2024 &= 2^{3}\times 11\times 23, & &\text{donc } 4\times 2\times 2=16 \text{ diviseurs} ; \\ 3600 &= 2^{4}\times 3^{2}\times 5^{2}, & &\text{donc } 5\times 3\times 3=45 \text{ diviseurs}. \end{aligned}$$

    **2.** On a $72=2^{3}\times 3^{2}$, qui possède $(3+1)(2+1)=12$ diviseurs : 
    $$\boxed{1,\; 2,\; 3,\; 4,\; 6,\; 8,\; 9,\; 12,\; 18,\; 24,\; 36,\; 72}$$
     On peut les ranger dans un tableau selon les exposants de $2$ et de $3$, comme sur la figure ci-dessous.

    ![Figure](documents/figures/ab1232709ec8bb15.svg)

    Chaque case correspond à un unique couple d'exposants $(\beta_{1},\beta_{2})$ avec $0\leqslant\beta_{1}\leqslant 3$ et $0\leqslant\beta_{2}\leqslant 2$ : on lit sur ce tableau de $4\times 3$ cases que $72$ a bien $12$ diviseurs, ce qui illustre la formule du cours.

    **3.**

    • **Sens réciproque.** Si $d=p_{1}^{\beta_{1}}\times\dots\times p_{k}^{\beta_{k}}$ avec $0\leqslant\beta_{i}\leqslant\alpha_{i}$, alors $N=d\times m$ avec $m=p_{1}^{\alpha_{1}-\beta_{1}}\times\dots\times p_{k}^{\alpha_{k}-\beta_{k}}$, qui est un entier puisque les exposants $\alpha_{i}-\beta_{i}$ sont positifs. Donc $d$ divise $N$.

    • **Sens direct.** Supposons que $d$ divise $N$ : $N=d\times m$ avec $d$ et $m$ dans $\mathbb{N}^{*}$. Soit $q$ un facteur premier de $d$. Par transitivité, $q$ divise $N=p_{1}^{\alpha_{1}}\times\dots\times p_{k}^{\alpha_{k}}$, et en appliquant le lemme d'Euclide autant de fois que nécessaire, $q$ divise l'un des $p_{i}$. Les deux étant premiers, $q=p_{i}$. Ainsi les seuls facteurs premiers possibles de $d$, et de même de $m$, sont $p_{1}$, …, $p_{k}$, et l'on peut écrire, avec des exposants éventuellement nuls : 
    $$d=p_{1}^{\beta_{1}}\times\dots\times p_{k}^{\beta_{k}} \qquad\text{et}\qquad m=p_{1}^{\gamma_{1}}\times\dots\times p_{k}^{\gamma_{k}}.$$
     On obtient alors $N=p_{1}^{\beta_{1}+\gamma_{1}}\times\dots\times p_{k}^{\beta_{k}+\gamma_{k}}$, et l'unicité de la décomposition donne $\beta_{i}+\gamma_{i}=\alpha_{i}$, donc $\boxed{0\leqslant\beta_{i}\leqslant\alpha_{i}}$ pour tout $i$.

    Ce résultat justifie la formule du cours : on choisit chaque $\beta_{i}$ parmi $\alpha_{i}+1$ valeurs, et deux choix différents donnent deux diviseurs différents grâce à l'unicité de la décomposition. Il servira dans les exercices 26, 38, 39 et 41.
- id: "me-01-17"
  feuille: "f-me-01"
