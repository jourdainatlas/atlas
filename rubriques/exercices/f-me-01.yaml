  noeuds: [z-division, z-premiers]
  notions: []
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 524, 526 et 528"
  page_enonce: 6
  page_corrige: 20
  enonce: |
    Pour $n\in\mathbb{N}^{*}$, on note $d(n)$ le nombre de diviseurs de $n$ dans $\mathbb{N}^{*}$.

    **1.** Soient $a$ et $b$ dans $\mathbb{N}^{*}$. Montrer que $a$ divise $b$ si et seulement si $a^{2}$ divise $b^{2}$.

    **2.** Soient $a$ et $b$ deux éléments de $\mathbb{N}^{*}$ tels que $a^{2}=b^{3}$. Montrer qu'il existe $c\in\mathbb{N}^{*}$ tel que $a=c^{3}$ et $b=c^{2}$.

    **3.** Soit $n\in\mathbb{N}^{*}$. Montrer que $n$ est le carré d'un nombre entier si et seulement si $d(n)$ est impair.
  corrige: |
    Dans tout l'exercice, on décompose les entiers sur une même liste de nombres premiers $p_{1}$, …, $p_{k}$, quitte à autoriser des exposants nuls. D'après l'exercice 16, $\prod p_{i}^{\beta_{i}}$ divise $\prod p_{i}^{\alpha_{i}}$ si et seulement si $\beta_{i}\leqslant\alpha_{i}$ pour tout $i$.

    **1.** Le sens direct est la question 6 de l'exercice 4. Réciproquement, si $a=\prod p_{i}^{\alpha_{i}}$ et $b=\prod p_{i}^{\beta_{i}}$, alors $a^{2}=\prod p_{i}^{2\alpha_{i}}$ et $b^{2}=\prod p_{i}^{2\beta_{i}}$. Si $a^{2}$ divise $b^{2}$, alors $2\alpha_{i}\leqslant 2\beta_{i}$, donc $\alpha_{i}\leqslant\beta_{i}$ pour tout $i$, et $a$ divise $b$. Ainsi $\boxed{a\mid b \iff a^{2}\mid b^{2}}$.

    **2.** Si $a=b=1$, on prend $c=1$. Sinon, avec $a=\prod p_{i}^{\alpha_{i}}$ et $b=\prod p_{i}^{\beta_{i}}$, l'égalité $a^{2}=b^{3}$ et l'unicité de la décomposition donnent $2\alpha_{i}=3\beta_{i}$ pour tout $i$. Ainsi $3$ divise $2\alpha_{i}$ ; comme $3$ est premier et ne divise pas $2$, le lemme d'Euclide donne que $3$ divise $\alpha_{i}$ : $\alpha_{i}=3\gamma_{i}$, puis $3\beta_{i}=6\gamma_{i}$, soit $\beta_{i}=2\gamma_{i}$. En posant $c=\prod p_{i}^{\gamma_{i}}$, on obtient $\boxed{a=c^{3} \text{ et } b=c^{2}}$. Par exemple, $8^{2}=4^{3}=64$ avec $c=2$.

    **3.** Pour $n=1$, $d(1)=1$ est impair et $1=1^{2}$. Pour $n\geqslant 2$, on a $d(n)=(\alpha_{1}+1)\cdots(\alpha_{k}+1)$ avec des exposants $\alpha_{i}\geqslant 1$. Un produit d'entiers est impair si et seulement si chacun de ses facteurs est impair, donc $d(n)$ est impair si et seulement si tous les $\alpha_{i}$ sont pairs. Si c'est le cas, $n=\left(\prod p_{i}^{\alpha_{i}/2}\right)^{2}$ est un carré ; réciproquement, si $n=m^{2}$, les exposants de $n$ sont les doubles de ceux de $m$, donc pairs. Ainsi $\boxed{n \text{ est un carré} \iff d(n) \text{ est impair}}$.

    On peut aussi le voir en associant chaque diviseur $d$ de $n$ au diviseur $\frac{n}{d}$ : les diviseurs vont par paires, sauf lorsque $d=\frac{n}{d}$, c'est-à-dire $d=\sqrt{n}$. Ainsi $36$ a $9$ diviseurs, son diviseur $6$ étant « seul ».
