  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 483"
  page_enonce: 6
  page_corrige: 18
  enonce: |
    Montrer que, pour tout nombre premier $p\geqslant 5$, $24$ divise $p^{2}-1$.
  corrige: |
    Soit $p\geqslant 5$ un nombre premier. Il est impair : $p=2a+1$ avec $a\geqslant 2$. On a : 
    $$p^{2}-1=(p-1)(p+1)=2a(2a+2)=4a(a+1).$$
     L'un des deux entiers consécutifs $a$ et $a+1$ est pair, donc $8$ divise $p^{2}-1$ : il existe $b\in\mathbb{N}$ tel que $p^{2}-1=8b$.

    Par ailleurs, en écrivant $p=3q+r$ avec $r\in\{0\,;1\,;2\}$, on a $r\neq 0$ car $p$ est premier et différent de $3$. Si $r=1$, $3$ divise $p-1$ ; si $r=2$, alors $p+1=3(q+1)$. Dans les deux cas, $3$ divise $(p-1)(p+1)=8b$. Comme $3$ est premier et ne divise pas $8$, le lemme d'Euclide donne que $3$ divise $b$ : $b=3c$, d'où $p^{2}-1=24c$. Ainsi $\boxed{24 \text{ divise } p^{2}-1}$.

    *Vérification :* $5^{2}-1=24$, $7^{2}-1=48$, $11^{2}-1=120=24\times 5$. Ce résultat renforce celui de l'exercice 17, puisque $p^{2}+11=(p^{2}-1)+12$.
- id: "me-01-34"
  feuille: "f-me-01"
  numero: 34
  titre: "Nombres de Fermat"
  partie: "Pour aller plus loin"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [nombres premiers, nombres remarquables]
  noeuds: [z-premiers]
  notions: [nombre-premier]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 485"
  page_enonce: 6
  page_corrige: 18
  enonce: |
    Soit $n\in\mathbb{N}^{*}$ tel que $2^{n}+1$ soit premier. Montrer que $n$ est une puissance de $2$.
  corrige: |
    Raisonnons par l'absurde en supposant que $n$ n'est pas une puissance de $2$. En regroupant les facteurs $2$ de sa décomposition, on écrit $n=2^{\alpha}m$ avec $m$ impair, et $m\neq 1$ puisque $n$ n'est pas une puissance de $2$ : donc $m\geqslant 3$. On pose $k=2^{\alpha}$, de sorte que $n=km$ et : 
    $$2^{n}+1=\left(2^{k}\right)^{m}+1^{m}.$$
     Comme $m$ est impair, l'exercice 30 b) montre que $2^{k}+1$ divise $2^{n}+1$. Or $k=\frac{n}{m}<n$, donc $1<2^{k}+1<2^{n}+1$ : l'entier $2^{n}+1$ admet un diviseur autre que $1$ et lui-même, ce qui contredit le fait qu'il soit premier. Ainsi $\boxed{n \text{ est une puissance de } 2}$.

    La réciproque est fausse : $F_{0}=3$, $F_{1}=5$, $F_{2}=17$, $F_{3}=257$ et $F_{4}=65\,537$, où $F_{j}=2^{2^{j}}+1$, sont premiers, mais Euler a montré en 1732 que $F_{5}=4\,294\,967\,297=641\times 6\,700\,417$. Le résultat est l'analogue « additif » de celui de l'exercice 25 sur les nombres de Mersenne.
- id: "me-01-35"
  feuille: "f-me-01"
  numero: 35
  partie: "Pour aller plus loin"
  etoiles: 2
  types: [Calcul]
  mots_cles: [nombres premiers, carrés, factorisation]
  noeuds: [z-premiers]
  notions: [nombre-premier]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 487 (avec n° 32 pour la factorisation)"
  page_enonce: 6
  page_corrige: 18
  enonce: |
    Soient $x$ et $y$ deux nombres réels.

    **a)** En complétant un carré, donner une factorisation de $x^{4}+4y^{4}$.

    **b)** En déduire que, si $m$ et $n$ sont dans $\mathbb{N}^{*}$, $m^{4}+4n^{4}$ est premier si et seulement si $m=n=1$.
  corrige: |
    **a)** On complète le carré $x^{4}+4y^{4}$ en $(x^{2}+2y^{2})^{2}=x^{4}+4x^{2}y^{2}+4y^{4}$ : 
    $$x^{4}+4y^{4}=(x^{2}+2y^{2})^{2}-(2xy)^{2}=\boxed{(x^{2}-2xy+2y^{2})(x^{2}+2xy+2y^{2})}.$$

    **b)** D'après a), $m^{4}+4n^{4}=(m^{2}-2mn+2n^{2})(m^{2}+2mn+2n^{2})$. Le second facteur vaut au moins $5$, et le premier s'écrit $(m-n)^{2}+n^{2}\geqslant 1$. Si $m^{4}+4n^{4}$ est premier, le premier facteur vaut nécessairement $1$, donc $(m-n)^{2}+n^{2}=1$ avec $n\geqslant 1$, ce qui impose $n=1$ et $m-n=0$, soit $m=n=1$. Réciproquement, $1^{4}+4\times 1^{4}=5$ est premier. Ainsi $\boxed{m^{4}+4n^{4} \text{ premier} \iff m=n=1}$.

    En particulier, avec $n=1$, l'entier $m^{4}+4$ n'est jamais premier pour $m\geqslant 2$, par exemple $3^{4}+4=85=5\times 17$. Cette factorisation est appelée identité de Sophie Germain.
- id: "me-01-36"
  feuille: "f-me-01"
  numero: 36
  partie: "Pour aller plus loin"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [divisibilité, nombres premiers, parité]
  noeuds: [z-division, z-premiers]
  notions: [nombre-premier]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 488 et 489"
  page_enonce: 6
  page_corrige: 18
  enonce: |
    **1.** Montrer que, si $n\geqslant 2$, aucun des nombres $n!+k$, $2\leqslant k\leqslant n$, n'est premier. Il existe donc des suites d'entiers consécutifs de longueur arbitraire dont aucun n'est premier.

    **2.** Quels sont les $k\in\mathbb{N}$ tels que l'ensemble des entiers $n$ tels que $k+1\leqslant n\leqslant k+10$ contienne le plus grand nombre de nombres premiers ? On s'intéressera aux nombres pairs et aux nombres impairs divisibles par $3$.
  corrige: |
    **1.** Soit $k\in\llbracket 2;n\rrbracket$. L'entier $k$ figure dans le produit $n!=1\times 2\times\dots\times n$, donc il divise $n!$, et il divise $k$ : il divise donc $n!+k$. Comme $2\leqslant k<n!+k$, l'entier $n!+k$ admet un diviseur autre que $1$ et lui-même : $\boxed{n!+k \text{ n'est pas premier}}$. Les $n-1$ entiers consécutifs $n!+2$, …, $n!+n$ sont donc tous composés ; pour obtenir $L$ entiers consécutifs composés, il suffit de prendre $n=L+1$. Par exemple, pour $n=5$ : $122=2\times 61$, $123=3\times 41$, $124=4\times 31$ et $125=5\times 25$. Cela n'entre pas en contradiction avec la Proposition 3 : les nombres premiers sont en nombre infini, mais de plus en plus espacés « par endroits ».

    **2.** On note $A_{k}=\llbracket k+1;k+10\rrbracket$. Cet ensemble contient $5$ entiers pairs et $5$ entiers impairs consécutifs $u$, $u+2$, $u+4$, $u+6$, $u+8$.

    • Le seul nombre premier pair est $2$.

    • Parmi $u$, $u+2$, $u+4$, l'un est multiple de $3$ : si $u=3q$, c'est $u$ ; si $u=3q+1$, c'est $u+2=3(q+1)$ ; si $u=3q+2$, c'est $u+4=3(q+2)$. Ce multiple de $3$ n'est premier que s'il vaut $3$.

    Si $k\geqslant 3$, ni $2$ ni $3$ n'appartiennent à $A_{k}$ : au plus $4$ des entiers impairs sont premiers, et aucun pair, donc $A_{k}$ contient au plus $4$ nombres premiers. Il reste à examiner $k\in\{0\,;1\,;2\}$ : $A_{0}$ contient $2$, $3$, $5$, $7$ (quatre premiers), $A_{1}$ contient $2$, $3$, $5$, $7$, $11$ (cinq premiers) et $A_{2}$ contient $3$, $5$, $7$, $11$ (quatre premiers). Le maximum vaut donc $5$, atteint $\boxed{\text{uniquement pour } k=1}$.

    ![Figure](documents/figures/f7c608b3b70e59ac.svg)

    Les nombres premiers sont marqués en rouge : la fenêtre $\llbracket 2;11\rrbracket$ est la seule à en contenir cinq, car elle contient à la fois $2$ et $3$, qui échappent aux arguments de parité et de divisibilité par $3$, sans contenir $1$, qui n'est pas premier.
- id: "me-01-37"
  feuille: "f-me-01"
  numero: 37
  partie: "Pour aller plus loin"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [irrationalité]
  noeuds: [q-irrationnel]
  notions: []
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 18 et 21"
  page_enonce: 6
  page_corrige: 20
  enonce: |
    **1.** Montrer que $\sqrt{3}$ est irrationnel. Généraliser.

    **2.** Montrer que $\sqrt{6}$ est irrationnel, puis en déduire que $\sqrt{2}+\sqrt{3}$ est irrationnel.
  corrige: |
    **1.** Supposons que $\sqrt{3}=\frac{p}{q}$ avec $p$ et $q$ dans $\mathbb{N}^{*}$. Alors $p^{2}=3q^{2}$. Comparons l'exposant de $3$ dans les décompositions en facteurs premiers des deux membres : si $3$ apparaît avec l'exposant $a$ dans $p$ et $b$ dans $q$ (éventuellement nuls), il apparaît avec l'exposant $2a$, pair, dans $p^{2}$, et $2b+1$, impair, dans $3q^{2}$. Cela contredit l'unicité de la décomposition. Ainsi $\boxed{\sqrt{3} \text{ est irrationnel}}$.

    **Généralisation :** si $n\in\mathbb{N}^{*}$ n'est pas le carré d'un entier, $\sqrt{n}$ est irrationnel. En effet, si tous les exposants $\alpha_{i}$ de la décomposition de $n$ étaient pairs, on aurait $n=\left(p_{1}^{\alpha_{1}/2}\cdots p_{k}^{\alpha_{k}/2}\right)^{2}$ ; l'un d'eux, $\alpha_{i}$, est donc impair. Si $\sqrt{n}=\frac{p}{q}$, alors $p^{2}=nq^{2}$, et l'exposant de $p_{i}$ est pair à gauche et égal à $\alpha_{i}$ plus un nombre pair, donc impair, à droite : contradiction. Ainsi $\boxed{\sqrt{n}\in\mathbb{Q} \iff n \text{ est un carré parfait}}$.

    **2.** Comme $6=2\times 3$ n'est pas un carré (ses exposants sont impairs), $\boxed{\sqrt{6} \text{ est irrationnel}}$ d'après la question 1. Supposons que $r=\sqrt{2}+\sqrt{3}$ soit rationnel. Alors $r^{2}=2+2\sqrt{6}+3$, donc $\sqrt{6}=\frac{r^{2}-5}{2}$ serait rationnel, ce qui est faux. Ainsi $\boxed{\sqrt{2}+\sqrt{3} \text{ est irrationnel}}$.

    La preuve classique de l'irrationalité de $\sqrt{2}$, vue en Seconde, utilise une fraction irréductible ; celle-ci n'utilise que l'unicité de la décomposition, et s'adapte immédiatement à tout entier qui n'est pas un carré.
- id: "me-01-38"
  feuille: "f-me-01"
  numero: 38
  partie: "Pour aller plus loin"
  etoiles: 3
  types: [Démonstration]
