  enonce: |
    **1.** On divise un entier naturel $n$ par $23$, ce qui donne pour reste $1$, et on divise ensuite $n$ par $17$ ce qui donne le même quotient mais pour reste $13$. Que vaut $n$ ?

    **2.** On divise un entier naturel $n$ par $152$, ce qui donne pour reste $13$, et on divise ensuite $n$ par $147$ ce qui donne le même quotient mais pour reste $98$. Que vaut $n$ ?
  corrige: |
    **1.** On pose $q$ le quotient de la division euclidienne de $n$. On a alors d'après l'énoncé : 
    $$\left\{ \begin{array}{ll} n=23q+1 \\ n=17q+13 \end{array} \right.$$
     En soustrayant la deuxième équation à la première, on obtient alors : 
    $$\begin{aligned} 0 &= 6q-12 \\ \Rightarrow \qquad q &= 2 \end{aligned}$$
     On en déduit ensuite que $\boxed{n=47}$.

    **2.** On pose $q$ le quotient de la division euclidienne de $n$. On a alors d'après l'énoncé : 
    $$\left\{ \begin{array}{ll} n=152q+13 \\ n=147q+98 \end{array} \right.$$
     En soustrayant la deuxième équation à la première, on obtient alors : 
    $$\begin{aligned} 0 &= 5q-85 \\ \Rightarrow \qquad q &= 17 \end{aligned}$$
     On en déduit ensuite que $\boxed{n=2597}$.
- id: "me-01-13"
  feuille: "f-me-01"
  numero: 13
  partie: "Division euclidienne"
  etoiles: 2
  types: [Calcul]
  mots_cles: [divisibilité, division euclidienne]
  noeuds: [z-division]
  notions: [division-euclidienne]
  page_enonce: 2
  page_corrige: 10
  enonce: |
    **1.** Déterminer les entiers naturels $n$ dont le quotient et le reste dans la division euclidienne par $5$ sont égaux.

    **2.** Dans la division euclidienne de $1000$ par un entier naturel non nul $b$, le quotient vaut $37$. Déterminer $b$ et le reste de cette division.

    **3.** Déterminer tous les entiers naturels $a$ dont le quotient dans la division euclidienne par $13$ vaut $7$.
  corrige: |
    **1.** On écrit $n=5q+r$ avec $0\leqslant r\leqslant 4$. La condition $q=r$ donne $n=5r+r=6r$ avec $r\in\llbracket 0;4\rrbracket$, donc : 
    $$\boxed{n\in\{0\,;6\,;12\,;18\,;24\}}$$
     Pour $r=5$, on aurait $n=30=5\times 6+0$ : le reste n'est plus $5$, ce qui explique que la liste s'arrête à $24$.

    **2.** On a $1000=37b+r$ avec $0\leqslant r<b$. On en déduit $37b\leqslant 1000<37b+b=38b$, c'est-à-dire : 
    $$\frac{1000}{38}<b\leqslant\frac{1000}{37}, \qquad\text{soit}\qquad 26{,}3\dots<b\leqslant 27{,}02\dots$$
     Le seul entier possible est $b=27$, et alors $r=1000-37\times 27=1000-999=1$. Ainsi $\boxed{b=27 \text{ et } r=1}$.

    **3.** On a $a=13\times 7+r=91+r$ avec $0\leqslant r\leqslant 12$, donc $\boxed{a\in\llbracket 91;103\rrbracket}$, soit treize valeurs.
- id: "me-01-14"
  feuille: "f-me-01"
  numero: 14
  partie: "Division euclidienne"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [divisibilité, division euclidienne, carrés]
  noeuds: [z-division]
  notions: [division-euclidienne]
  page_enonce: 3
  page_corrige: 10
  enonce: |
    **1.** En distinguant les cas $n=2k$ et $n=2k+1$, montrer que le reste de la division euclidienne de $n^{2}$ par $4$ vaut $0$ ou $1$, pour tout entier $n$.

    **2.** En déduire les restes possibles de la division par $4$ d'une somme de deux carrés d'entiers. L'entier $2023$ peut-il s'écrire comme la somme de deux carrés d'entiers ?

    **3.** En distinguant quatre cas, montrer que le reste de la division euclidienne de $n^{2}$ par $8$ vaut $0$, $1$ ou $4$.

    **4.** En déduire qu'un entier dont le reste dans la division par $8$ vaut $7$ ne peut pas s'écrire comme la somme de trois carrés d'entiers. Est-ce le cas de $2023$ ?
  corrige: |
    **1.** Si $n=2k$, alors $n^{2}=4k^{2}$ et le reste est $0$. Si $n=2k+1$, alors $n^{2}=4k^{2}+4k+1=4(k^{2}+k)+1$ et le reste est $1$. Ainsi $\boxed{\text{le reste de } n^{2} \text{ par } 4 \text{ vaut } 0 \text{ ou } 1}$.

    **2.** Si $x^{2}=4a+r$ et $y^{2}=4b+s$ avec $r,s\in\{0\,;1\}$, alors $x^{2}+y^{2}=4(a+b)+(r+s)$ avec $r+s\in\{0\,;1\,;2\}$. Comme $r+s<4$, c'est le reste de la division par $4$, qui vaut donc $0$, $1$ ou $2$. Or $2023=4\times 505+3$ : $\boxed{2023 \text{ n'est pas une somme de deux carrés}}$.

    **3.** On écrit $n=4k+r$ avec $r\in\{0\,;1\,;2\,;3\}$ : 
    $$\begin{aligned} (4k)^{2} &= 16k^{2}=8\times 2k^{2}+0, & (4k+1)^{2} &= 8(2k^{2}+k)+1, \\ (4k+2)^{2} &= 8(2k^{2}+2k)+4, & (4k+3)^{2} &= 8(2k^{2}+3k+1)+1. \end{aligned}$$
     Ainsi $\boxed{\text{le reste de } n^{2} \text{ par } 8 \text{ vaut } 0, 1 \text{ ou } 4}$.

    **4.** Si $x^{2}=8a+r$, $y^{2}=8b+s$ et $z^{2}=8c+t$ avec $r,s,t\in\{0\,;1\,;4\}$, alors $x^{2}+y^{2}+z^{2}=8(a+b+c)+(r+s+t)$. Les valeurs possibles de $r+s+t$ sont $0$, $1$, $2$, $3$, $4$, $5$, $6$, $8$, $9$ et $12$ ; lorsque la somme dépasse $7$, on retire $8$ pour obtenir le reste ($8\to 0$, $9\to 1$, $12\to 4$). Les restes possibles sont donc $0$, $1$, $2$, $3$, $4$, $5$ et $6$, mais jamais $7$. Comme $2023=8\times 252+7$, $\boxed{2023 \text{ n'est pas une somme de trois carrés}}$.

    Il faut en revanche quatre carrés : $2023=1^{2}+2^{2}+13^{2}+43^{2}$. Lagrange a démontré en 1770 que tout entier naturel est somme de quatre carrés d'entiers.
