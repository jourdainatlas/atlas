- id: "me-01-01"
  feuille: "f-me-01"
  numero: 1
  partie: "Divisibilité dans $\\mathbb{Z}$"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équations en entiers]
  noeuds: [z-division]
  notions: []
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Sans utiliser de discriminant, déterminer les valeurs de $n$ entier relatif tel que :

    **a)** $n^{2}+n=20$

    **b)** $n^{2}+2n=35$

    **2.** Déterminer les couples d'entiers relatifs $(x;y)$ tels que :

    **a)** $x^{2}=y^{2}+21$

    **b)** $x^{2}-7xy=17$
  corrige: |
    **1.** On utilise la factorisation et les propriétés de divisibilité :

    **(a)** On constate que : 
    $$\begin{aligned} n^2+n &= 20 \\ \Rightarrow \qquad n(n+1) &= 20 \end{aligned}$$
     Or $n$ étant un entier relatif, on en déduit que $n$ divise 20, et fait donc partie de l'ensemble : 
    $$\left\{-20,-10,-5,-4,-2,-1,1,2,4,5,10,20 \right\}$$
     Dans cet ensemble, les seules valeurs possibles de $n$ sont ainsi celles telles que $(n+1)$ divise aussi $20$ et pour lesquelles $n(n+1)=20$. N'ayant que $-5\times(-4)$ et $4\times 5$ comme possibilités, on en déduit donc que : 
    $$\boxed{ n\in \{-5,4\}}$$

    **(b)** On procède de la même manière, en constatant que : 
    $$\begin{aligned} n^2+2n &= 35 \\ \Rightarrow \qquad n(n+2) &= 35 \end{aligned}$$
     Or $n$ étant un entier relatif, on en déduit que $n$ divise 35, et fait donc partie de l'ensemble : 
    $$\left\{-35,-7,-5,-1,1,5,7,35 \right\}$$
     Dans cet ensemble, les seules valeurs possibles de $n$ sont ainsi celles telles que $(n+2)$ divise aussi $35$ et pour lesquelles $n(n+2)=35$, n'ayant que $-7\times -5=35$ et $5 \times 7 =35$ comme possibilités, on en déduit donc que : 
    $$\boxed{n\in \{-7,5\}}$$

    **2.** On utilise de même la factorisation et les propriétés de divisibilité :

    **(a)** On constate que : 
    $$\begin{aligned} &x^2 = y^2+21 \\ \Rightarrow \qquad &x^2-y^2 = 21 \\ \Rightarrow \qquad &(x-y)(x+y) = 21 \end{aligned}$$
     Or on ne dispose que de quatre possibilités pour factoriser $21$ : 
    $$\begin{aligned} 1 \times 21 \qquad& -1\times -21 \\ 3 \times 7 \qquad& -3\times (-7) \end{aligned}$$
     Pour la première factorisation, on a donc : 
    $$\left\{ \begin{array}{ll} x-y = 1 \\ x+y =21 \end{array} \right. \qquad \text{ou} \qquad \left\{ \begin{array}{ll} x+y = 1 \\ x-y =21 \end{array} \right.$$
     Ce qui nous donne rapidement : 
    $$(x,y)=(11,10) \qquad \text{ou} \qquad (x,y)=(11,-10)$$
     En procédant de la même façon pour toutes les factorisations, on trouve enfin : 
    $$\boxed{ (x,y)\in \left\{(\pm 11,\pm10),(\pm 5,\pm 2)\right\} }$$

    **(b)** On constate que : 
    $$\begin{aligned} &x^2-7xy = 17 \\ &x(x-7y)=17 \end{aligned}$$
     Or on ne dispose que de deux possibilités pour factoriser $17$ : 
    $$1\times 17 \qquad \text{ou} \qquad -1\times -17$$
     Pour la première factorisation, on a donc : 
    $$\left\{ \begin{array}{ll} x=1 \\ x-7y= 17 \end{array} \right. \qquad \text{ou} \qquad \left\{ \begin{array}{ll} x=17 \\ x-7y=1 \end{array} \right.$$
     Ce qui nous donne rapidement : 
    $$\left\{ \begin{array}{ll} x=1 \\ -7y=16 \end{array} \right. \qquad \text{ou} \qquad \left\{ \begin{array}{ll} x=17 \\ 7y=16 \end{array} \right.$$
     Or ni $7$ ni $-7$ ne divise $16$, ce qui rend impossible pour $y$ de prendre une valeur entière. Ainsi cette factorisation ne dispose d'aucune solution. On trouve de la même manière que l'autre factorisation est également sans solution, afin d'en déduire que : 
    $$\boxed{ (x,y) \in \varnothing }$$
- id: "me-01-02"
  feuille: "f-me-01"
  numero: 2
  partie: "Divisibilité dans $\\mathbb{Z}$"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [divisibilité]
  noeuds: [z-division]
  notions: []
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Le but de l'exercice est de trouver les valeurs du naturel $n>4$ pour lesquelles la fraction : 
    $$\frac{n+17}{n-4} \; \text{ est un entier.}$$

    **1.** Démontrer que $(n-4)$ divise $(n+17)$ équivaut à $(n-4)$ divise 21.

    **2.** Lister les diviseurs de $21$.

    **3.** Résoudre le problème.
  corrige: |
    Le but de l'exercice est de trouver les valeurs du naturel $n>4$ pour lesquelles la fraction : 
    $$\frac{n+17}{n-4} \; \text{ est un entier.}$$

    **1.** On sait que pour que $\dfrac{n+17}{n-4}$ soit entier, $n-4$ doit diviser $n+17$, or on remarque que : 
    $$\begin{aligned} \frac{n+17}{n-4} &= \frac{n-4+21}{n-4} \\ &= \frac{n-4}{n-4}+\frac{21}{n-4} \\ &= 1 + \frac{21}{n-4} \end{aligned}$$
     Ainsi pour que ce nombre soit entier, $21$ doit nécessairement être divisible par $n-4$.

    **2.** Les diviseurs de $21$ sont : 
    $$-21,-7,-3,-1,1,3,7,21$$

    **3.** D'après la question précédente : 
    $$n-4 \in \{ -21,-7,-3,-1,1,3,7,21 \}$$
     On en déduit donc, sachant que $n>4$ : 
    $$\boxed{n \in \{5,7,11,25 \} }$$
- id: "me-01-03"
  feuille: "f-me-01"
  numero: 3
  partie: "Divisibilité dans $\\mathbb{Z}$"
  etoiles: 1
  types: [Calcul]
  mots_cles: [divisibilité]
  noeuds: [z-division]
  notions: []
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Déterminer les entiers relatifs $n$ tels que :

    **a)** $6$ divise $n+5$

    **b)** $n$ divise $n+6$

    **c)** $n+3$ divise $n+10$

    **d)** $n+1$ divise $3n+4$

    **e)** $2n+1$ divise $6n+12$

    **f)** $3n+1$ divise $10n-4$
  corrige: |
    **a)** Pour que $6$ divise $n+5$, il faut que $n+5$ soit multiple de $6$, autrement dit qu'il existe $k\in\mathbb{Z}$ tel que $n+5=6k$, ce qui nous dit donc que : 
    $$\boxed{ n\in \{6k-5 \; | \; k\in\mathbb{Z} \} }$$
     En effet, tout élément de cet ensemble donne un $n+5$ divisible par 6. La première partie de notre raisonnement nous donne une **contrainte** sur $n$, on doit par la suite vérifier que l'ensemble donné est bien solution.

    **b)** Pour que $n$ divise $n+6$, le nombre suivant doit être un entier : 
    $$\frac{n+6}{n} = \frac{n}{n}+\frac{6}{n} = 1+\frac{6}{n}$$
     On en déduit alors que $n$ doit être un diviseur de $6$, et donc que : 
    $$\boxed{ n\in \{-6,-3,-2,-1,1,2,3,6 \}}$$

    **c)** Pour que $n+3$ divise $n+10$, le nombre suivant doit être un entier : 
    $$\begin{aligned} \frac{n+10}{n+3} &= \frac{n+3+7}{n+3} \\ &= \frac{n+3}{n+3}+\frac{7}{n+3} \\ &= 1+\frac{7}{n+3} \end{aligned}$$
     On en déduit donc que $n+3$ doit être un diviseur de $7$, autrement dit que $n+3$ appartient à l'ensemble $\{-7,-1,1,7\}$, ce qui nous permet d'en conclure que : 
    $$\boxed{ n\in \{ -10,-4,-2,4 \}}$$

    **d)** Pour que $n+1$ divise $3n+4$, le nombre suivant doit être un entier : 
    $$\begin{aligned} \frac{3n+4}{n+1} &= \frac{3n+3+1}{n+1} \\ &= \frac{3(n+1)}{n+1}+\frac{1}{n+1} \\ &= 3+\frac{1}{n+1} \end{aligned}$$
     On en déduit donc que $n+1$ doit être un diviseur de $1$, autrement dit que $n+1$ appartient à l'ensemble $\{-1,1\}$, ce qui nous permet d'en conclure que : 
    $$\boxed{ n\in \{-2,0 \} }$$

    **e)** Pour que $2n+1$ divise $6n+12$, le nombre suivant doit être un entier : 
    $$\begin{aligned} \frac{6n+12}{2n+1} &= \frac{6n+3+9}{2n+1} \\ &= \frac{3(2n+1)}{2n+1}+\frac{9}{2n+1} \\ &= 3+\frac{9}{2n+1} \end{aligned}$$
     On en déduit donc que $2n+1$ doit être un diviseur de $9$, autrement dit que $2n+1$ appartient à l'ensemble $\{-9,-3,-1,1,3,9\}$, ce qui nous permet d'en conclure que : 
    $$\boxed{ n \in \{ -5,-2,-1,0,1,4 \}}$$

    **f)** Pour que $3n+1$ divise $10n-4$, le nombre suivant doit être un entier : 
    $$\begin{aligned} \frac{10n-4}{3n+1} &= \frac{9n+3+n-7}{3n+1} \\ &= \frac{3(3n+1)}{3n+1} + \frac{n-7}{3n+1} \\ &= 3+\frac{n-7}{3n+1} \end{aligned}$$
     On en déduit donc que $3n+1$ doit être un diviseur de $n-7$. Or si c'est le cas, alors d'après la Proposition 1 du cours, $3n+1$ est nécessairement diviseur de : 
    $$3\times(n-7)+(-1)\times(3n+1)=-22 \qquad \text{(car }{3n+1}\text{ se divise lui même)}$$
     On sait alors que $3n+1$ appartient à l'ensemble $\{-22,-11,-2,-1,1,2,11,22\}$, ce qui nous permet de conclure que : 
    $$\boxed{ n \in \{-4,-1,0,7\}}$$
     On peut vérifier notamment que $3n+1$ ne peut pas être égal à $-22$, $-1$, $2$ ou $11$, sinon $n$ ne serait pas entier.
- id: "me-01-04"
  feuille: "f-me-01"
  numero: 4
  partie: "Divisibilité dans $\\mathbb{Z}$"
  etoiles: 1
  types: [Calcul]
  mots_cles: [divisibilité]
  noeuds: [z-division]
  notions: []
  page_enonce: 1
  page_corrige: 4
  enonce: |
    Soient $a$, $b$ et $c$ trois entiers relatifs non nuls. Dire si chacune des affirmations suivantes est **Vraie** ou **Fausse**, en justifiant par une démonstration ou par un contre-exemple.

    **1.** Si $a$ divise $b$ et $b$ divise $c$, alors $a$ divise $c$.

    **2.** Si $a$ divise $b+c$, alors $a$ divise $b$ ou $a$ divise $c$.

    **3.** Si $a$ divise $b$ et $a$ divise $c$, alors $a$ divise $2b-3c$.

    **4.** Si $a$ divise $bc$, alors $a$ divise $b$ ou $a$ divise $c$.

    **5.** Si $a$ divise $b$ et $b$ divise $a$, alors $a=b$.

    **6.** Si $a$ divise $b$, alors $a^{2}$ divise $b^{2}$.
  corrige: |
    **1.** **Vrai.** Il existe $k$ et $k'$ dans $\mathbb{Z}$ tels que $b=ka$ et $c=k'b$, donc $c=(k'k)a$ avec $k'k\in\mathbb{Z}$ : c'est la transitivité de la Proposition 1 du cours. Ainsi $\boxed{a \text{ divise } c}$.

    **2.** **Faux.** Avec $a=2$ et $b=c=1$, on a bien $2$ qui divise $b+c=2$, mais $2$ ne divise ni $b$ ni $c$. L'erreur la plus répandue consiste à « distribuer » la divisibilité sur une somme : seule l'implication inverse est vraie.

    **3.** **Vrai.** En écrivant $b=ka$ et $c=k'a$, on obtient $2b-3c=(2k-3k')a$ avec $2k-3k'\in\mathbb{Z}$. C'est le cas particulier $u=2$, $v=-3$ de la Proposition 1.

    **4.** **Faux.** Avec $a=6$, $b=2$ et $c=3$, l'entier $6$ divise $bc=6$ mais ne divise ni $2$ ni $3$. L'affirmation devient vraie lorsque $a$ est un nombre premier : c'est exactement le lemme d'Euclide.

    **5.** **Faux.** Avec $a=2$ et $b=-2$, chacun divise l'autre mais $a\neq b$. En revanche, si $b=ka$ et $a=k'b$, alors $a=kk'a$, donc $kk'=1$ puisque $a\neq 0$, ce qui impose $k=\pm 1$ : on a toujours $\boxed{a=\pm b}$, et $a=b$ si $a$ et $b$ sont tous deux positifs.

    **6.** **Vrai.** Si $b=ka$, alors $b^{2}=k^{2}a^{2}$ avec $k^{2}\in\mathbb{Z}$, donc $\boxed{a^{2} \text{ divise } b^{2}}$. La réciproque est également vraie, mais beaucoup plus délicate : elle fait l'objet de l'exercice 38.
- id: "me-01-05"
  feuille: "f-me-01"
  numero: 5
  partie: "Divisibilité dans $\\mathbb{Z}$"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [divisibilité, parité, critères de divisibilité]
  noeuds: [z-division]
  notions: []
  page_enonce: 1
  page_corrige: 4
  enonce: |
    Soit $n$ un entier naturel.

    **1.** Montrer que si $n$ est impair alors $n^{2}$ aussi.

    **2.** Montrer que si $n$ est impair, alors $n^{2}-1$ est divisible par $8$.

    **3.** Montrer que quel que soit $n$ le nombre $3n^{4}+5n+1$ est impair, et en déduire qu'il n'est jamais divisible par $n(n+1)$.

    **4.** Montrer que si $n$ est strictement inférieur à $100$, alors en lui soustrayant la somme de ses chiffres on obtient toujours un nombre divisible par $9$.

    **5.** Montrer en étudiant trois cas différents que quel que soit $n$, $n(n^{2}+5)$ est divisible par $3$.
  corrige: |
    Soit $n$ un entier naturel.

    **1.** Supposons que $n$ est impair. Autrement dit, il existe $k\in\mathbb{Z}$ tel que $n=2k+1$, ce qui donne : 
    $$\begin{aligned} n^2 &= (2k+1)^2 \\ &= 4k^2+4k+1 \\ &= 2\underbrace{(2k^2+2k)}_{\in\mathbb{Z}}+1 \\ &= 2k'+1 \qquad \text{où }{k'\in\mathbb{Z}} \end{aligned}$$
     Ainsi, on a bien montré que $\boxed{{n^2}\text{ est impair}}$.

    **2.** Supposons que $n$ est impair. Autrement dit, il existe $k\in\mathbb{Z}$ tel que $n=2k+1$, ce qui donne : 
    $$\begin{aligned} n^2-1 &= (2k+1)^2-1 \\ &= 4k^2+4k \\ &= 4k(k+1) \end{aligned}$$
     Or $k$ ou $k+1$ est nécessairement pair, et le produit d'un entier pair par n'importe quel autre entier est pair, donc il existe $k'\in\mathbb{Z}$ tel que $k(k+1)=2k'$, ce qui donne : 
    $$n^2-1 = 4\times 2k'=8k'$$
     On en déduit donc que $\boxed{{n^2-1}\text{ est divisible par }{8}}$.

    **3.** On procède par disjonction de cas :

    • Supposons que $n$ est pair :

    On sait alors qu'il existe $k\in\mathbb{Z}$ tel que $n=2k$, et donc : 
    $$\begin{aligned} 3n^4+5n+1 &= 3(2k)^4+5\times 2k+1 \\ &= 3\times 16 k^4+ 5\times 2k +1 \\ &= 48k^4+10k+1 \\ &= 2\underbrace{(24k^4+5k)}_{\in \mathbb{Z}}+1 \end{aligned}$$
     Ce qui justifie que le nombre étudié est impair.

    • Supposons que $n$ est impair :

    On sait alors qu'il existe $k\in\mathbb{Z}$ tel que $n=2k+1$, et donc : 
    $$\begin{aligned} 3n^4+5n+1 &= 3(2k+1)^4 + 5(2k+1) +1 \\ &= 3(2k+1)^2(2k+1)^2+10k+5+1 \\ &= 3(4k^2+4k+1)(4k^2+4k+1)+10k+6 \\ &= 3(16k^4+16k^3+4k^2+16k^3+16k^2+4k+4k^2+4k+1)+10k+6 \\ &= 3(16k^4+32k^3+24k^2+8k+1)+10k+6 \\ &= 48k^4+96k^3+72k^2+24k+3+10k+6 \\ &= 48k^4+96k^3+72k^2+34k+8+1 \\ &= 2\underbrace{(24k^4+48k^3+36k^2+17k+4)}_{\in\mathbb{Z}}+1 \end{aligned}$$
     Ce qui justifie que le nombre étudié est impair.

    Le nombre $3n^4+5n+1$ est donc nécessairement impair, il n'est donc pas divisible par un nombre pair. Or on a vu précédemment que $n(n+1)$ est pair, ce qui justifie que : 
    $$\boxed{{3n^4+5n+1}\text{ n'est jamais divisible par }{n(n+1)}}$$

    **4.** Soit $n$ un nombre strictement inférieur à $100$. On pose $a$ le nombre entier correspondant au chiffre des dizaines de $n$, et $b$ le nombre entier correspondant au chiffre des unités de $n$. On a alors : 
    $$n=10a+b$$
     Sachant ceci, on constate alors que : 
    $$\begin{aligned} n-(a+b) &= 10a+b-a-b \\ &= 9a \end{aligned}$$
     Ce qui justifie qu'on obtient $\boxed{\text{un nombre divisible par }{9}}$.

    **5.** Soit $n\in\mathbb{Z}$. On procède par disjonction de cas :

    • Supposons qu'il existe $k\in\mathbb{Z}$ tel que $n=3k$ :

    Ainsi : 
    $$\begin{aligned} n(n^2+5) &= 3\underbrace{k((3k)^2+5)}_{\in\mathbb{Z}} \end{aligned}$$
     Ce qui justifie que $n(n^2+5)$ est divisible par $3$.

    • Supposons qu'il existe $k\in\mathbb{Z}$ tel que $n=3k+1$ :

    Ainsi : 
    $$\begin{aligned} n(n^2+5) &= (3k+1)((3k+1)^2+5) \\ &= (3k+1)(9k^2+6k+1+5) \\ &= (3k+1)(9k^2+6k+6) \\ &= 3\underbrace{(3k+1)(3k^2+2k+2)}_{\in\mathbb{Z}} \end{aligned}$$
     Ce qui justifie que $n(n^2+5)$ est divisible par $3$.

    • Supposons qu'il existe $k\in\mathbb{Z}$ tel que $n=3k+2$ :

    Ainsi : 
    $$\begin{aligned} n(n^2+5) &= (3k+2)((3k+2)^2+5) \\ &= (3k+2)(9k^2+12k+4+5) \\ &= (3k+2)(9k^2+12k+9) \\ &= 3\underbrace{(3k+2)(3k^2+4k+3)}_{\in\mathbb{Z}} \end{aligned}$$
     Ce qui justifie que $n(n^2+5)$ est divisible par $3$.

    On a donc prouvé que quel que soit $n\in\mathbb{Z}$, $\boxed{{n(n^2+5)}\text{ est divisible par }{3}}$.
- id: "me-01-06"
  feuille: "f-me-01"
  numero: 6
  partie: "Divisibilité dans $\\mathbb{Z}$"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [divisibilité, récurrence]
  noeuds: [z-division, n-recurrence]
  notions: []
  page_enonce: 2
  page_corrige: 6
  enonce: |
    Démontrer par récurrence que, pour tout entier naturel $n$ :

    **1.** $3$ divise $4^{n}-1$ ;

    **2.** $7$ divise $9^{n}-2^{n}$ ;

    **3.** $6$ divise $n^{3}+5n$ ;

    **4.** $5$ divise $2\times 4^{n}+3\times 9^{n}$.
  corrige: |
    Les quatre récurrences suivent le même schéma : on fait apparaître dans l'expression au rang $k+1$ l'expression au rang $k$, puis on utilise l'hypothèse de récurrence.

    **1.** On note $\mathcal{P}_{n}$ : « $3$ divise $4^{n}-1$ ».

    • **Initialisation :** $4^{0}-1=0=3\times 0$, donc $\mathcal{P}_{0}$ est vraie.

    • **Hérédité :** Soit $k\in\mathbb{N}$ tel que $\mathcal{P}_{k}$ soit vraie : il existe $m\in\mathbb{Z}$ tel que $4^{k}-1=3m$. Alors : 
    $$4^{k+1}-1=4\times 4^{k}-4+3=4(4^{k}-1)+3=4\times 3m+3=3(4m+1),$$
     donc $\mathcal{P}_{k+1}$ est vraie.

    • **Conclusion :** Pour tout $n\in\mathbb{N}$, $\boxed{3 \text{ divise } 4^{n}-1}$.

    **2.** On note $\mathcal{P}_{n}$ : « $7$ divise $9^{n}-2^{n}$ ». On a $9^{0}-2^{0}=0$, donc $\mathcal{P}_{0}$ est vraie. Si $9^{k}-2^{k}=7m$ avec $m\in\mathbb{Z}$, alors : 
    $$9^{k+1}-2^{k+1}=9\times 9^{k}-2\times 2^{k}=9(9^{k}-2^{k})+7\times 2^{k}=7(9m+2^{k}),$$
     donc $\mathcal{P}_{k+1}$ est vraie, et par récurrence $\boxed{7 \text{ divise } 9^{n}-2^{n}}$ pour tout $n\in\mathbb{N}$.

    **3.** On note $\mathcal{P}_{n}$ : « $6$ divise $n^{3}+5n$ ». On a $0^{3}+5\times 0=0$, donc $\mathcal{P}_{0}$ est vraie. Si $k^{3}+5k=6m$ avec $m\in\mathbb{Z}$, alors : 
    $$\begin{aligned} (k+1)^{3}+5(k+1) &= k^{3}+3k^{2}+3k+1+5k+5 \\ &= (k^{3}+5k)+3k(k+1)+6. \end{aligned}$$
     Or $k(k+1)$ est le produit de deux entiers consécutifs, dont l'un est pair : il existe $j\in\mathbb{N}$ tel que $k(k+1)=2j$, donc $3k(k+1)=6j$. On obtient $(k+1)^{3}+5(k+1)=6(m+j+1)$, et par récurrence $\boxed{6 \text{ divise } n^{3}+5n}$ pour tout $n\in\mathbb{N}$.

    **4.** On note $\mathcal{P}_{n}$ : « $5$ divise $2\times 4^{n}+3\times 9^{n}$ ». On a $2+3=5$, donc $\mathcal{P}_{0}$ est vraie. Si $2\times 4^{k}+3\times 9^{k}=5m$ avec $m\in\mathbb{Z}$, alors en écrivant $9=4+5$ : 
    $$\begin{aligned} 2\times 4^{k+1}+3\times 9^{k+1} &= 4\times 2\times 4^{k}+(4+5)\times 3\times 9^{k} \\ &= 4\,(2\times 4^{k}+3\times 9^{k})+15\times 9^{k} = 5\,(4m+3\times 9^{k}), \end{aligned}$$
     donc par récurrence $\boxed{5 \text{ divise } 2\times 4^{n}+3\times 9^{n}}$ pour tout $n\in\mathbb{N}$.

    Le chapitre suivant, consacré aux congruences, permettra de démontrer ces quatre résultats en une ligne chacun, sans récurrence.
- id: "me-01-07"
  feuille: "f-me-01"
  numero: 7
  partie: "Divisibilité dans $\\mathbb{Z}$"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [divisibilité]
  noeuds: [z-division]
  notions: []
  page_enonce: 2
  page_corrige: 6
  enonce: |
    Soit $n$ un entier naturel.

    **1.** Montrer que $(n+1)$ divise $(n^{2}+5n+4)$ et $(n^{2}+3n+2)$.

    **2.** Déterminer toutes les valeurs de $n$ pour lesquelles $(n+1)$ divise $(3n^{2}+15n+19)$.

    **3.** En déduire que pour tout $n$, $(3n^{2}+15n+19)$ n'est pas divisible par $(n^{2}+3n+2)$.
  corrige: |
    Soit $n$ un entier naturel.

    **1.** Il suffit de faire apparaître $n+1$ en facteur. En effet : 
    $$\begin{aligned} (n+1)(n+4) &= n^2 +n+4n+4 \\ &= n^2 +5n +4 \end{aligned}$$
     Donc $\boxed{{(n^2+5n+4)}\text{ est bien divisible par }{(n+1)}}$. De plus : 
    $$\begin{aligned} (n+1)(n+2) &= n^2+n+2n+2 \\ &= n^2+3n+2 \end{aligned}$$
     Donc $\boxed{{(n^2+3n+2)}\text{ est bien divisible par }{(n+1)}}$.

    **2.** On remarque que : 
    $$\begin{aligned} \frac{3n^2+15n+19}{n+1} &= \frac{3n^2+3n+12n+12+7}{n+1} \\ &= \frac{3n^2+3n}{n+1}+\frac{12n+12}{n+1}+\frac{7}{n+1} \\ &= \frac{3n(n+1)}{n+1}+\frac{12(n+1)}{n+1}+\frac{7}{n+1} \\ &= 3n+12+\frac{7}{n+1} \end{aligned}$$
     Ainsi $3n^2+15n+19$ est divisible par $(n+1)$ si et seulement si $7$ est divisible par $(n+1)$, et comme $n$ est un entier naturel, $n+1\geqslant 1$, donc $(n+1)$ appartient à l'ensemble $\{1\,;7\}$, autrement dit : 
    $$\boxed{n\in \{0\,;6 \} }$$

    **3.** On sait d'après la question 1. que $(n+1)$ divise $(n^2+3n+2)$ pour toute valeur de $n$. Si $(n^2+3n+2)$ divisait $(3n^2+15n+19)$, alors $(n+1)$ diviserait $(3n^2+15n+19)$ par transitivité, ce qui n'est possible, d'après la question 2, que pour $n=0$ ou $n=6$. Il reste à examiner ces deux cas : pour $n=0$, $n^2+3n+2=2$ ne divise pas $19$ ; pour $n=6$, $n^2+3n+2=56$ ne divise pas $3\times 36+90+19=217$, car $56\times 3=168$ et $56\times 4=224$. Ainsi : 
    $$\boxed{{(3n^2+15n+19)}\text{ n'est jamais divisible par }{(n^2+3n+2)}}$$
- id: "me-01-08"
  feuille: "f-me-01"
  numero: 8
  partie: "Divisibilité dans $\\mathbb{Z}$"
  etoiles: 2
  types: [Calcul]
  mots_cles: [divisibilité]
  noeuds: [z-division]
  notions: []
  page_enonce: 2
  page_corrige: 7
  enonce: |
    Déterminer les entiers relatifs $n$ tels que :

    **a)** $n-2$ divise $n^{2}+3$ *(on pourra développer $(n-2)(n+2)$)* ;

    **b)** $n+2$ divise $n^{2}+5n+11$ ;

    **c)** $n^{2}+2$ divise $n^{4}+2n^{2}+7$.
  corrige: |
    La méthode est celle de l'exercice 2 : on écrit le dividende comme un multiple du diviseur plus une constante, puis on utilise la Proposition 1.

    **a)** On a $(n-2)(n+2)=n^{2}-4$, donc $n^{2}+3=(n-2)(n+2)+7$. Si $n-2$ divise $n^{2}+3$, comme il divise aussi $(n-2)(n+2)$, il divise leur différence $7$ ; réciproquement, si $n-2$ divise $7$, il divise la somme $(n-2)(n+2)+7$. Ainsi $n-2$ divise $n^{2}+3$ si et seulement si $n-2\in\{-7\,;-1\,;1\,;7\}$, c'est-à-dire : 
    $$\boxed{n\in\{-5\,;1\,;3\,;9\}}$$
     *Vérification :* pour $n=9$, $n^{2}+3=84=7\times 12$ ; pour $n=-5$, $n^{2}+3=28=(-7)\times(-4)$.

    **b)** On a $(n+2)(n+3)=n^{2}+5n+6$, donc $n^{2}+5n+11=(n+2)(n+3)+5$. Comme précédemment, $n+2$ divise $n^{2}+5n+11$ si et seulement si $n+2$ divise $5$, soit $n+2\in\{-5\,;-1\,;1\,;5\}$ : 
    $$\boxed{n\in\{-7\,;-3\,;-1\,;3\}}$$
     *Vérification :* pour $n=3$, $n^{2}+5n+11=35=5\times 7$.

    **c)** On a $n^{4}+2n^{2}+7=n^{2}(n^{2}+2)+7$, donc $n^{2}+2$ divise $n^{4}+2n^{2}+7$ si et seulement si $n^{2}+2$ divise $7$. Comme $n^{2}+2\geqslant 2$ est positif, cela impose $n^{2}+2=7$, soit $n^{2}=5$, ce qui est impossible pour un entier. Il n'y a donc $\boxed{\text{aucune solution}}$.
- id: "me-01-09"
  feuille: "f-me-01"
  numero: 9
  partie: "Division euclidienne"
  etoiles: 1
  types: [Calcul]
  mots_cles: [divisibilité, division euclidienne]
  noeuds: [z-division]
  notions: [division-euclidienne]
  page_enonce: 2
  page_corrige: 7
  enonce: |
    Déterminer, sans calculatrice, la division euclidienne de :

    **a)** $320$ par $7$

    **b)** $-187$ par $7$

    **c)** $3225$ par $11$

    **d)** $2024$ par $17$

    **e)** $-5000$ par $13$

    **f)** $12345678$ par $9$
  corrige: |
    On pose les divisions euclidiennes :

    **a)** On cherche à diviser $320$ par $7$ :

    $$\begin{array}{cccc|cc}   & 3 & 2 & 0 & 7 &  \\  - & 2 & 8 & \vdots & 4 & 5 \\   &  & 4 & 0 &  &  \\   & - & 3 & 5 &  &  \\   &  &  & 5 &  &  \end{array}$$

    On a donc $\boxed{320=7\times 45+5}$.

    **b)** On cherche à diviser $-187$ par $7$, on s'intéresse donc à la division de $187$ par $7$ puis on arrangera afin d'obtenir un reste positif :

    $$\begin{array}{cccc|cc}   & 1 & 8 & 7 & 7 &  \\  - & 1 & 4 & \vdots & 2 & 6 \\   &  & 4 & 7 &  &  \\   & - & 4 & 2 &  &  \\   &  &  & 5 &  &  \end{array}$$

    Ce qui donne : 
    $$\begin{aligned} 187 &= 7 \times 26 + 5 \\ \Rightarrow \qquad -187& =7\times(-26)-5 \\ &= 7\times (-26)-5+7-7 \\ &= 7\times (-27)+2 \end{aligned}$$
     On a donc $\boxed{-187=7\times(-27)+2}$.

    **c)** On cherche à diviser $3225$ par $11$ :

    $$\begin{array}{ccccc|ccc}   & 3 & 2 & 2 & 5 & 1 & 1 &  \\  - & 2 & 2 & \vdots & \vdots & 2 & 9 & 3 \\   & 1 & 0 & 2 & \vdots &  &  &  \\   & - & 9 & 9 & \vdots &  &  &  \\   &  &  & 3 & 5 &  &  &  \\   &  & - & 3 & 3 &  &  &  \\   &  &  &  & 2 &  &  &  \end{array}$$

    On a donc $\boxed{3225=11\times 293+2}$. *Vérification :* $11\times 293=3\,223$ et $3\,225-3\,223=2$.

    **d)** On cherche à diviser $2024$ par $17$ :

    $$\begin{array}{ccccc|ccc}   & 2 & 0 & 2 & 4 & 1 & 7 &  \\  - & 1 & 7 & \vdots & \vdots & 1 & 1 & 9 \\   &  & 3 & 2 & \vdots &  &  &  \\   & - & 1 & 7 & \vdots &  &  &  \\   &  & 1 & 5 & 4 &  &  &  \\   & - & 1 & 5 & 3 &  &  &  \\   &  &  &  & 1 &  &  &  \end{array}$$

    On a donc $\boxed{2024=17\times 119+1}$.

    **e)** On cherche à diviser $-5000$ par $13$, on s'intéresse donc à la division de $5000$ par $13$ puis on arrangera afin d'obtenir un reste positif :

    $$\begin{array}{ccccc|ccc}   & 5 & 0 & 0 & 0 & 1 & 3 &  \\  - & 3 & 9 & \vdots & \vdots & 3 & 8 & 4 \\   & 1 & 1 & 0 & \vdots &  &  &  \\  - & 1 & 0 & 4 & \vdots &  &  &  \\   &  &  & 6 & 0 &  &  &  \\   &  & - & 5 & 2 &  &  &  \\   &  &  &  & 8 &  &  &  \end{array}$$

    On a donc : 
    $$\begin{aligned} 5000 &= 13\times 384 +8 \\ \Rightarrow \qquad -5000 &= 13\times (-384) -8 \\ &= 13\times (-384)-8+13-13 \\ &= 13\times (-385)+5 \end{aligned}$$
     Ainsi $\boxed{-5000=13\times (-385)+5}$.

    **f)** On peut vérifier en posant la division que : $\boxed{12345678=9\times 1371742}$.
- id: "me-01-10"
  feuille: "f-me-01"
  numero: 10
  partie: "Division euclidienne"
  etoiles: 1
  types: [Calcul]
  mots_cles: [divisibilité, division euclidienne]
  noeuds: [z-division]
  notions: [division-euclidienne]
  page_enonce: 2
  page_corrige: 8
  enonce: |
    Soit $a$ un entier naturel dont le reste dans la division euclidienne par $7$ est égal à $3$.

    **1.** Déterminer le reste de la division euclidienne par $7$ de chacun des nombres $2a$, $a+5$, $a^{2}$ et $a^{3}$.

    **2.** En déduire que $a^{3}+1$ est divisible par $7$.
  corrige: |
    **1.** Il existe $q\in\mathbb{N}$ tel que $a=7q+3$. Pour chaque nombre, on cherche une écriture $7Q+R$ avec $0\leqslant R<7$, et l'unicité de la division euclidienne garantit que $R$ est le reste.

    • $2a=14q+6=7\times(2q)+6$ : le reste est $\boxed{6}$.

    • $a+5=7q+8=7(q+1)+1$ : le reste est $\boxed{1}$. Attention, $8$ n'est pas un reste possible : il faut « faire passer » $7$ dans le quotient.

    • $a^{2}=49q^{2}+42q+9=7(7q^{2}+6q+1)+2$ : le reste est $\boxed{2}$.

    • En notant $m=7q^{2}+6q+1$, on a $a^{3}=a^{2}\times a=(7m+2)(7q+3)=49mq+21m+14q+6=7(7mq+3m+2q)+6$ : le reste est $\boxed{6}$.

    **2.** D'après ce qui précède, $a^{3}+1=7(7mq+3m+2q)+7=7(7mq+3m+2q+1)$, donc $\boxed{7 \text{ divise } a^{3}+1}$.

    On remarque que ces restes ne dépendent que du reste de $a$, et non de $q$ : c'est l'idée qui fonde les congruences, étudiées au chapitre suivant.
- id: "me-01-11"
  feuille: "f-me-01"
  numero: 11
  partie: "Division euclidienne"
  etoiles: 1
  types: [Calcul]
  mots_cles: [divisibilité, division euclidienne]
  noeuds: [z-division]
  notions: [division-euclidienne]
  page_enonce: 2
  page_corrige: 9
  enonce: |
    La différence entre deux entiers naturels est 538. Si l’on divise l’un par l’autre le quotient est 13, et le reste 34. Quels sont ces deux entiers naturels ?
  corrige: |
    Soient $a$ et $b$ les deux entiers naturels désignés par l'énoncé, tels que $a>b$. On a alors : 
    $$\left\{ \begin{array}{ll} a-b=538 \\ a=13b+34 \end{array}\right.$$
     Ce qui donne par combinaison linéaire, en soustrayant la deuxième équation à la première : 
    $$\begin{aligned} -b &= 538-13b-34 \\ \Rightarrow \qquad 12b &= 504 \\ \Rightarrow \qquad b &= 42 \end{aligned}$$
     Or sachant que $a=538+b$, on en déduit que $a=580$, d'où $\boxed{(a,b)=(580,42)}$. *Vérification :* $580=13\times 42+34$ avec $34<42$.
- id: "me-01-12"
  feuille: "f-me-01"
  numero: 12
  partie: "Division euclidienne"
