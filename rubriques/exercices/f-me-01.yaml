  page_enonce: 4
  page_corrige: 13
  enonce: |
    On considère un entier $n\in\mathbb{N}$ tel que $n$ a exactement $5$ diviseurs, et $(n-16)$ est le produit de deux nombres premiers.

    **1.** Montrer que $n=p^{4}$ avec $p$ premier.

    **2.** Écrire $(n-16)$ comme le produit de trois facteurs dépendant de $p$.

    **3.** En déduire la valeur de $p$, puis la valeur de $n$.
  corrige: |
    On considère un entier $n\in\mathbb{N}$ tel que $n$ a exactement $5$ diviseurs, et $(n-16)$ est le produit de deux nombres premiers.

    **1.** On procède comme dans l'exercice 19 pour constater que : 
    $$n=p_{1}^{\alpha_1}p_{2}^{\alpha_2}\dots p_{k}^{\alpha_k} \qquad \text{tel que} \qquad (\alpha_1+1)(\alpha_2+1)\dots(\alpha_k+1)=5$$
     Ainsi, on en déduit qu'un seul élément peut faire partie du produit, et donc que seul $p_1$ est différent de $1$, avec $\alpha_1=4$. Donc si on note $p=p_1$, on a : 
    $$\boxed{n=p^4}$$

    **2.** On constate que : 
    $$\begin{aligned} n-16=p^4-16 &= (p^2-4)(p^2+4) \\ &= \boxed{(p-2)(p+2)(p^2+4)} \end{aligned}$$

    **3.** Sachant que $n-16$ est le produit d'exactement deux nombres premiers, l'un des trois facteurs obtenus à la question précédente vaut nécessairement $1$ (pour $p=2$ on aurait $n-16=0$, donc $p\geqslant 3$ et tous les facteurs sont positifs). Le seul candidat possible est $p-2$, on en déduit donc que $\boxed{p=3}$ et donc que $\boxed{n=3^4=81}$. *Vérification :* $81-16=65=5\times 13$, et $81$ a bien $5$ diviseurs : $1$, $3$, $9$, $27$ et $81$.
- id: "me-01-22"
  feuille: "f-me-01"
  numero: 22
  partie: "Nombres premiers et décomposition en facteurs premiers"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [nombres premiers]
  noeuds: [z-premiers]
  notions: [nombre-premier]
  page_enonce: 4
  page_corrige: 13
  enonce: |
    Soient $a$ et $b$ deux entiers tels que $(a^{2}-b^{2})$ soit un nombre premier.

    **1.** Quelle relation existe-t-il entre $a$ et $b$ ?

    **2.** Montrer que $401$ est un nombre premier.

    **3.** Résoudre dans $\mathbb{N}^{2}$ : 
    $$x^{2}-y^{2}=401$$
  corrige: |
    Soient $a$ et $b$ deux entiers tels que $(a^{2}-b^{2})$ soit un nombre premier.

    **1.** On sait que : 
    $$\begin{aligned} a^2-b^2 &= (a-b)(a+b) \end{aligned}$$
     Or $(a^2-b^2)$ est premier donc $(a-b)$ vaut nécessairement $1$, d'où : $\boxed{a=b+1}$.

    **2.** $401$ n'est divisible par aucun premier inférieur à $23$, il est donc premier.

    **3.** D'après la question $1$, on a donc : 
    $$\begin{aligned} &\left\{ \begin{array}{ll} x+y =401 \\ x-y=1 \end{array} \right. \\ \Rightarrow \qquad &2x=402 \\ \Rightarrow \qquad &x=201 \end{aligned}$$
     On en déduit que $y=200$, et ainsi $\boxed{(x,y)=(201,200)}$.
- id: "me-01-23"
  feuille: "f-me-01"
  numero: 23
  partie: "Nombres premiers et décomposition en facteurs premiers"
  etoiles: 2
  types: [Calcul]
  mots_cles: [nombres premiers]
  noeuds: [z-premiers]
  notions: [nombre-premier]
  page_enonce: 4
  page_corrige: 13
  enonce: |
    **1.** Déterminer les entiers naturels $n$ pour lesquels $n^{2}+2n-3$ est un nombre premier.

    **2.** Déterminer les entiers naturels $n$ pour lesquels $n^{3}-1$ est un nombre premier.

    **3.** Déterminer les entiers relatifs $n$ pour lesquels $|n^{2}-6n+8|$ est un nombre premier.

    **4.** Montrer que $4^{n}-1$ n'est premier que pour $n=1$.
  corrige: |
    Dans chaque question, on factorise : un produit de deux entiers naturels ne peut être premier que si l'un des facteurs vaut $1$.

    **1.** On a $n^{2}+2n-3=(n-1)(n+3)$. Pour $n=0$, on obtient $-3$, et pour $n=1$, on obtient $0$, qui ne sont pas premiers. Pour $n\geqslant 2$, les deux facteurs sont positifs et $n+3\geqslant 5$, donc le nombre ne peut être premier que si $n-1=1$, soit $n=2$, qui donne bien $5$. Ainsi $\boxed{n=2}$.

    **2.** On a $n^{3}-1=(n-1)(n^{2}+n+1)$. Pour $n\in\{0\,;1\}$, on obtient $-1$ ou $0$. Pour $n\geqslant 2$, $n^{2}+n+1\geqslant 7>1$, donc il faut $n-1=1$, soit $n=2$, qui donne $7$, premier. Ainsi $\boxed{n=2}$.

    **3.** On a $|n^{2}-6n+8|=|n-2|\times|n-4|$. Ce produit est premier si et seulement si l'un des facteurs vaut $1$ et l'autre est premier. Si $|n-2|=1$, alors $n=1$, qui donne $1\times 3=3$, premier, ou $n=3$, qui donne $1\times 1=1$, non premier. Si $|n-4|=1$, alors $n=3$, déjà exclu, ou $n=5$, qui donne $3\times 1=3$. Ainsi $\boxed{n\in\{1\,;5\}}$.

    **4.** On a $4^{n}-1=(2^{n})^{2}-1=(2^{n}-1)(2^{n}+1)$. Pour $n=0$, on obtient $0$ ; pour $n=1$, on obtient $3$, premier ; pour $n\geqslant 2$, on a $2^{n}-1\geqslant 3$ et $2^{n}+1\geqslant 5$, donc $4^{n}-1$ n'est pas premier. On retrouve d'ailleurs que $3$ divise $4^{n}-1$ (exercice 6).
- id: "me-01-24"
  feuille: "f-me-01"
  numero: 24
  partie: "Exercices d'approfondissement"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [nombres premiers, parité, factorisation]
  noeuds: [z-premiers]
  notions: [nombre-premier]
  page_enonce: 4
  page_corrige: 14
  enonce: |
    Soit $n$ un entier relatif et $A$ le nombre défini par : 
    $$A = n^{4} - 12n^{2} + 16$$

    **1.** En remarquant que $A = n^{4} - 8n^{2} + 16 - 4n^{2}$, factoriser $A$.

    **2.** Montrer que si $n$ est pair alors, $|A|$ n’est pas premier.

    **3.** On suppose que $n$ est impair. On pose alors $n = 2k + 1$ avec $k \in\mathbb{Z}$.

    **(a)** Montrer que : 
    $$A = (4k^{2} + 8k - 1)(4k^{2} - 5)$$

    **(b)** En déduire les valeurs de $n$ pour lesquelles $|A|$ est nombre premier.
  corrige: |
    Soit $n$ un entier relatif et $A$ le nombre défini par : 
    $$A = n^{4} - 12n^{2} + 16$$

    **1.** On constate que : 
    $$\begin{aligned} A &= n^{4} - 8n^{2} + 16 - 4n^{2} \\ &= (n^2-4)^2-(2n)^2 \\ &=(n^2-4+2n)(n^2-4-2n) \end{aligned}$$

    **2.** Supposons que $n$ est pair, il existe donc $k\in\mathbb{Z}$ tel que $n=2k$. Ainsi : 
    $$\begin{aligned} |A| &= |(2k)^4-12(2k)^2+16| \\ &= |16k^4-48k^2+16| \\ &= 16\times |k^4-3k^2+1| \end{aligned}$$
     Or $k^4-3k^2+1$ ne peut pas être nul pour $k$ entier (on aurait $k^{2}=\frac{3\pm\sqrt{5}}{2}$, qui n'est pas entier), donc $|A|\geqslant 16$ et $|A|$ est divisible par $2$ : $\boxed{{|A|}\text{ n'est pas premier}}$.

    **3.** On suppose que $n$ est impair. On pose alors $n = 2k + 1$ avec $k \in\mathbb{Z}$.

    **(a)** On suppose que $n$ est impair, donc qu'il existe $k\in\mathbb{Z}$ tel que $n=2k+1$. On constate tout d'abord que : 
    $$\begin{aligned} (4k^{2} + 8k - 1)(4k^{2} - 5) &= 4k^2\times4k^2+4k^2\times(-5)+8k\times 4k^2 \\ &\qquad +8k\times(-5) -4k^2+5 \\ &= 16k^4-20k^2+32k^3 -40k-4k^2+5 \\ &= 16k^4+32k^3-24k^2-40k+5 \end{aligned}$$
     On constate alors de plus que : 
    $$\begin{aligned} A &= (2k+1)^4-12(2k+1)^2 +16 \\ &= (2k+1)^2(2k+1)^2-12(4k^2+4k+1) +16 \\ &= (4k^2+4k+1)(4k^2+4k+1)-48k^2-48k-12+16 \\ &= 16k^4+16k^3+4k^2+16k^3+16k^2+4k+4k^2+4k+1-48k^2-48k+4 \\ &= 16k^4+32k^3-24k^2-40k+5 \\ &= (4k^{2} + 8k - 1)(4k^{2} - 5) \end{aligned}$$

    **(b)** $|A|$ est un nombre premier seulement si l'un de ses deux facteurs vaut $1$ ou $-1$, donc premièrement si $4k^2+8k-1=1$ ou $4k^2-5=1$. On a tout d'abord : 
    $$\begin{aligned} 4k^2+8k-1=1 \qquad &\Rightarrow \qquad 4k^2+8k-2=0 \\ &\Rightarrow \qquad 2k^2+4k-1=0 \end{aligned}$$
     Or cette équation a pour discriminant : 
    $$\Delta = 4^2-4\times 2\times (-1) = 25$$
     Elle a ainsi deux solutions réelles : 
    $$k_1=\dfrac{-4-5}{2\times2}=-\frac{11}{4} \qquad \text{et} \qquad k_2=\dfrac{-4+5}{2\times2}=\frac{1}{4}$$
     Or aucune des deux n'est entière. De plus la deuxième équation équivaut à $k^2=\dfrac{3}{2}$, qui n'a manifestement pas non plus de solutions entières.

    On regarde deuxièmement $4k^2+8k-1=-1$ et $4k^2-5=-1$. On a tout d'abord : 
    $$\begin{aligned} 4k^2+8k-1=-1 \qquad &\Rightarrow \qquad 4k^2+8k=0 \\ &\Rightarrow \qquad k(k+2)=0 \end{aligned}$$
     On a donc deux solutions entières, $k_1=0$ et $k_2=-2$. De plus la deuxième équation équivaut à $k^2=1$, elle donne donc deux solutions entières supplémentaires, $k_3=1$ et $k_4=-1$. On peut enfin en conclure que $|A|$ est premier pour : 
    $$\boxed{n\in \{-3, -1,1,3 \} }$$
- id: "me-01-25"
  feuille: "f-me-01"
  numero: 25
  titre: "Nombres de Mersenne"
  partie: "Exercices d'approfondissement"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [nombres premiers, nombres remarquables]
  noeuds: [z-premiers]
