  enonce: |
    Pour tout entier $n\geqslant 1$, on note $\sigma(n)$ la somme des diviseurs positifs de $n$.

    **1.** Calculer $\sigma(72)$ à l'aide de la liste des diviseurs de $72$ (exercice 16), puis vérifier que $\sigma(72)=(1+2+4+8)(1+3+9)$.

    **2.** Soient $p$ un nombre premier et $\alpha\in\mathbb{N}$. Montrer que : 
    $$\sigma(p^{\alpha})=1+p+\dots+p^{\alpha}=\frac{p^{\alpha+1}-1}{p-1}.$$

    **3.** Soient $p$ et $q$ deux nombres premiers distincts, $\alpha$ et $\beta$ deux entiers naturels. En utilisant la question 3 de l'exercice 16, montrer que $\sigma(p^{\alpha}q^{\beta})=\sigma(p^{\alpha})\times\sigma(q^{\beta})$.

    **4.** Admettant que cette formule se généralise à un nombre quelconque de facteurs premiers, calculer $\sigma(360)$.

    **5.** Déterminer les entiers $n\geqslant 1$ tels que $\sigma(n)=n+1$.
  corrige: |
    **1.** D'après l'exercice 16, $\sigma(72)=1+2+3+4+6+8+9+12+18+24+36+72=\boxed{195}$, et $(1+2+4+8)(1+3+9)=15\times 13=195$. En développant ce produit, on obtient chacun des termes $2^{i}3^{j}$ une et une seule fois, c'est-à-dire chacune des cases du tableau de l'exercice 16.

    **2.** D'après l'exercice 16, les diviseurs de $p^{\alpha}$ sont $1$, $p$, …, $p^{\alpha}$, donc $\sigma(p^{\alpha})=1+p+\dots+p^{\alpha}$. C'est la somme des termes d'une suite géométrique de raison $p\neq 1$ ; on peut aussi utiliser l'identité démontrée dans l'exercice 25, $(p-1)(1+p+\dots+p^{\alpha})=p^{\alpha+1}-1$. Comme $p-1\neq 0$ : 
    $$\boxed{\sigma(p^{\alpha})=\frac{p^{\alpha+1}-1}{p-1}}$$

    **3.** D'après l'exercice 16, les diviseurs de $p^{\alpha}q^{\beta}$ sont les $p^{i}q^{j}$ avec $0\leqslant i\leqslant\alpha$ et $0\leqslant j\leqslant\beta$, et ils sont deux à deux distincts par unicité de la décomposition. Or en développant : 
    $$(1+p+\dots+p^{\alpha})(1+q+\dots+q^{\beta})=\sum_{i=0}^{\alpha}\sum_{j=0}^{\beta}p^{i}q^{j},$$
     on obtient exactement la somme de ces diviseurs, chacun une fois. Donc $\boxed{\sigma(p^{\alpha}q^{\beta})=\sigma(p^{\alpha})\times\sigma(q^{\beta})}$.

    **4.** Comme $360=2^{3}\times 3^{2}\times 5$ : 
    $$\sigma(360)=(1+2+4+8)(1+3+9)(1+5)=15\times 13\times 6=\boxed{1170}.$$

    **5.** Pour $n=1$, $\sigma(1)=1\neq 2$. Pour $n\geqslant 2$, $1$ et $n$ sont deux diviseurs distincts de $n$, donc $\sigma(n)\geqslant n+1$, avec égalité si et seulement si $n$ n'a pas d'autre diviseur, c'est-à-dire si et seulement si $n$ est premier. Ainsi $\boxed{\sigma(n)=n+1 \iff n \text{ est premier}}$.

    La fonction $\sigma$ intervient dans la définition des nombres parfaits, étudiés dans l'exercice 41.
- id: "me-01-27"
  feuille: "f-me-01"
  numero: 27
  titre: "Une infinité de nombres premiers de la forme $6k+5$"
  partie: "Exercices d'approfondissement"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [divisibilité, récurrence, nombres premiers, infinité des nombres premiers]
  noeuds: [z-division, n-recurrence, z-premiers]
  notions: [nombre-premier]
  page_enonce: 5
  page_corrige: 16
  enonce: |
    **1.** Montrer que tout nombre premier $p\geqslant 5$ s'écrit sous la forme $6k+1$ ou $6k+5$, avec $k\in\mathbb{N}$.

    **2.** Montrer que le produit de deux entiers de la forme $6k+1$ est encore de la forme $6k+1$. En déduire, par récurrence, que tout produit de $r\geqslant 1$ entiers de la forme $6k+1$ est de la forme $6k+1$.

    **3.** En déduire que tout entier naturel de la forme $6k+5$ admet au moins un diviseur premier de la forme $6k+5$.

    **4.** On suppose par l'absurde qu'il n'existe qu'un nombre fini de nombres premiers de la forme $6k+5$, que l'on note $p_{1}$, $p_{2}$, …, $p_{r}$. En considérant l'entier $N=6p_{1}p_{2}\cdots p_{r}-1$, aboutir à une contradiction.
  corrige: |
    **1.** On écrit $p=6k+r$ avec $0\leqslant r\leqslant 5$. Si $r\in\{0\,;2\,;4\}$, alors $p=2\left(3k+\frac{r}{2}\right)$ est pair, donc $p=2$, ce qui est exclu puisque $p\geqslant 5$. Si $r=3$, alors $p=3(2k+1)$ est divisible par $3$, donc $p=3$, exclu également. Il reste $\boxed{r\in\{1\,;5\}}$.

    **2.** On a $(6a+1)(6b+1)=36ab+6a+6b+1=6(6ab+a+b)+1$. Par récurrence sur $r$ : un seul entier de la forme $6k+1$ convient évidemment, et si un produit de $r$ tels entiers s'écrit $6k+1$, alors en le multipliant par un $(r+1)$-ième entier $6b+1$, on obtient, d'après le calcul précédent, un entier de la forme $6k'+1$.

    **3.** Soit $N=6k+5$. Il est impair, car $N=2(3k+2)+1$, et il n'est pas divisible par $3$, car $N=3(2k+1)+2$ et le reste $2$ n'est pas nul. Tous ses facteurs premiers sont donc au moins égaux à $5$, et sont donc de la forme $6j+1$ ou $6j+5$ d'après la question 1. S'ils étaient tous de la forme $6j+1$, leur produit $N$ serait de la forme $6K+1$ d'après la question 2. Mais l'unicité de la division euclidienne par $6$ interdit que $N$ ait à la fois $1$ et $5$ pour reste. Ainsi $\boxed{N \text{ admet un diviseur premier de la forme } 6k+5}$.

    **4.** L'entier $N=6p_{1}\cdots p_{r}-1=6(p_{1}\cdots p_{r}-1)+5$ est de la forme $6k+5$ (avec $k\geqslant 0$ car $p_{1}\cdots p_{r}\geqslant 5$). D'après la question 3, il admet un diviseur premier de la forme $6k+5$, qui est donc l'un des $p_{i}$. Mais alors $p_{i}$ divise $N$ et $6p_{1}\cdots p_{r}$, donc il divise leur différence, qui vaut $1$ : c'est absurde. Il existe donc $\boxed{\text{une infinité de nombres premiers de la forme } 6k+5}$.

    La démarche est celle de la Proposition 3 du cours. Elle ne s'adapte pas directement aux nombres premiers de la forme $6k+1$ : un entier de la forme $6k+1$ peut n'avoir que des facteurs premiers de la forme $6k+5$, comme $25=5\times 5$. Le théorème de Dirichlet (1837) affirme plus généralement qu'il y a une infinité de nombres premiers de la forme $ak+b$ dès que $a$ et $b$ n'ont pas de diviseur commun autre que $\pm 1$.
- id: "me-01-28"
  feuille: "f-me-01"
  numero: 28
  titre: "Critères de divisibilité"
  partie: "Exercices d'approfondissement"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [divisibilité, récurrence, critères de divisibilité]
  noeuds: [z-division, n-recurrence]
  notions: []
  page_enonce: 5
  page_corrige: 16
  enonce: |
    Soit $N$ un entier naturel, dont l'écriture décimale est $N=\overline{a_{k}a_{k-1}\dots a_{1}a_{0}}$, c'est-à-dire : 
    $$N=a_{k}\times 10^{k}+a_{k-1}\times 10^{k-1}+\dots+a_{1}\times 10+a_{0}, \qquad\text{où les chiffres } a_{i} \text{ sont dans } \llbracket 0;9\rrbracket.$$

    **1.** Montrer par récurrence que, pour tout $n\in\mathbb{N}$, $10^{n}-1$ est divisible par $9$.

    **2.** On note $S=a_{k}+\dots+a_{1}+a_{0}$ la somme des chiffres de $N$. Montrer que $N-S$ est divisible par $9$. En déduire que $N$ est divisible par $9$ si et seulement si $S$ l'est, puis qu'il en est de même pour $3$.

    **3.** L'entier $123\,456\,789$ est-il divisible par $9$ ?

    **4.** Montrer par récurrence que, pour tout $n\in\mathbb{N}$, $10^{2n}-1$ et $10^{2n+1}+1$ sont divisibles par $11$.

    **5.** On note $T=a_{0}-a_{1}+a_{2}-\dots+(-1)^{k}a_{k}$ la somme alternée des chiffres de $N$. Montrer que $N-T$ est divisible par $11$, et en déduire un critère de divisibilité par $11$.

    **6.** L'entier $918\,082$ est-il divisible par $11$ ?
  corrige: |
    **1.** On a $10^{0}-1=0$, divisible par $9$. Si $10^{k}-1=9m$, alors $10^{k+1}-1=10(10^{k}-1)+9=9(10m+1)$. Par récurrence, $\boxed{9 \text{ divise } 10^{n}-1}$ pour tout $n\in\mathbb{N}$.

    **2.** En regroupant les termes : 
    $$N-S=a_{k}(10^{k}-1)+a_{k-1}(10^{k-1}-1)+\dots+a_{1}(10-1)+a_{0}(1-1).$$
     Chaque $10^{i}-1$ est un multiple de $9$ d'après la question 1, donc $9$ divise $N-S$ par la Proposition 1. Si $9$ divise $S$, il divise $N=(N-S)+S$ ; si $9$ divise $N$, il divise $S=N-(N-S)$. Enfin $3$ divise $9$, donc $3$ divise aussi $N-S$ par transitivité, et le même raisonnement montre que $3$ divise $N$ si et seulement si $3$ divise $S$.

    **3.** La somme des chiffres de $123\,456\,789$ est $1+2+\dots+9=45=9\times 5$, donc $123\,456\,789$ est $\boxed{\text{divisible par } 9}$ ; on trouve d'ailleurs $123\,456\,789=9\times 13\,717\,421$.

    **4.** On note $\mathcal{Q}_{n}$ : « $11$ divise $10^{2n}-1$ ». On a $10^{0}-1=0$. Si $10^{2k}-1=11m$, alors : 
    $$10^{2k+2}-1=100(10^{2k}-1)+99=11(100m+9).$$
     Par récurrence, $11$ divise $10^{2n}-1$ pour tout $n$. On en déduit $10^{2n+1}+1=10(10^{2n}-1)+11=11(10m+1)$, divisible par $11$.

    **5.** On a $N-T=\displaystyle\sum_{i=0}^{k}a_{i}\left(10^{i}-(-1)^{i}\right)$. Pour $i$ pair, $10^{i}-(-1)^{i}=10^{i}-1$ et pour $i$ impair, $10^{i}-(-1)^{i}=10^{i}+1$ : dans les deux cas, c'est un multiple de $11$ d'après la question 4. Donc $11$ divise $N-T$ et, comme à la question 2 : 
    $$\boxed{11 \text{ divise } N \iff 11 \text{ divise } T}$$

    **6.** En partant du chiffre des unités, $T=2-8+0-8+1-9=-22=11\times(-2)$, donc $918\,082$ est $\boxed{\text{divisible par } 11}$ ; en effet $918\,082=11\times 83\,462$.

    La question 2 généralise la question 4 de l'exercice 5, qui ne traitait que des nombres à deux chiffres. Avec les congruences du chapitre suivant, ces critères découleront immédiatement de ce que $10$ a pour reste $1$ dans la division par $9$, et $-1$ « modulo $11$ ».
- id: "me-01-29"
  feuille: "f-me-01"
  numero: 29
  partie: "Pour aller plus loin"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [carrés, "produit d'entiers consécutifs"]
  noeuds: [z-anneau]
  notions: []
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 31 (coquille corrigée : n+1 et non n-1)"
  page_enonce: 5
  page_corrige: 17
  enonce: |
    Soit $n$ le produit de quatre éléments de $\mathbb{N}^{*}$ consécutifs. Montrer que $n+1$ est le carré d'un entier.
  corrige: |
    Soit $n=k(k+1)(k+2)(k+3)$ avec $k\in\mathbb{N}^{*}$. On regroupe le premier facteur avec le dernier, et les deux du milieu ensemble : 
    $$k(k+3)=k^{2}+3k \qquad\text{et}\qquad (k+1)(k+2)=k^{2}+3k+2.$$
     En posant $u=k^{2}+3k$, on obtient $n=u(u+2)=u^{2}+2u$, donc : 
    $$n+1=u^{2}+2u+1=(u+1)^{2}=\boxed{(k^{2}+3k+1)^{2}}$$
     *Vérification :* pour $k=1$, $n+1=24+1=25=5^{2}$ ; pour $k=2$, $n+1=120+1=121=11^{2}$. L'énoncé original du poly écrit « $n-1$ », ce qui est une coquille : $24-1=23$ n'est pas un carré.
- id: "me-01-30"
  feuille: "f-me-01"
  numero: 30
  partie: "Pour aller plus loin"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [divisibilité, parité]
  noeuds: [z-division]
  notions: []
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 461"
  page_enonce: 5
  page_corrige: 17
  enonce: |
    Soient $n\in\mathbb{N}^{*}$, $a$ et $b$ dans $\mathbb{Z}$.

    **a)** Montrer que $a-b$ divise $a^{n}-b^{n}$.

    **b)** On suppose que $n$ est impair. Montrer que $a+b$ divise $a^{n}+b^{n}$.
  corrige: |
    **a)** On montre l'identité $a^{n}-b^{n}=(a-b)(a^{n-1}+a^{n-2}b+\dots+ab^{n-2}+b^{n-1})$. En effet, en développant, les termes se télescopent : 
    $$\begin{aligned} (a-b)\sum_{i=0}^{n-1}a^{n-1-i}b^{i} &= \sum_{i=0}^{n-1}a^{n-i}b^{i}-\sum_{i=0}^{n-1}a^{n-1-i}b^{i+1} \\ &= \sum_{i=0}^{n-1}a^{n-i}b^{i}-\sum_{i=1}^{n}a^{n-i}b^{i}=a^{n}-b^{n}. \end{aligned}$$
     La somme $\sum a^{n-1-i}b^{i}$ étant un entier, $\boxed{a-b \text{ divise } a^{n}-b^{n}}$. Pour $b=1$, on retrouve l'identité utilisée dans l'exercice 25 sur les nombres de Mersenne.

    **b)** Si $n$ est impair, $(-b)^{n}=-b^{n}$. En appliquant a) aux entiers $a$ et $-b$, on obtient que $a-(-b)=a+b$ divise $a^{n}-(-b)^{n}=a^{n}+b^{n}$. Ainsi $\boxed{a+b \text{ divise } a^{n}+b^{n}}$. Pour $n$ pair, c'est faux en général : $1+2=3$ ne divise pas $1^{2}+2^{2}=5$.
- id: "me-01-31"
  feuille: "f-me-01"
  numero: 31
  partie: "Pour aller plus loin"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [divisibilité, division euclidienne]
  noeuds: [z-division]
  notions: [division-euclidienne]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 462"
  page_enonce: 5
  page_corrige: 17
  enonce: |
    Soient $m$ et $n$ deux éléments de $\mathbb{N}^{*}$, $a\geqslant 2$ un entier.

    **a)** Montrer que, si $m$ divise $n$, $a^{m}-1$ divise $a^{n}-1$.

    **b)** On suppose que le reste de la division euclidienne de $n$ par $m$ est $r$. Montrer que le reste de la division euclidienne de $a^{n}-1$ par $a^{m}-1$ est $a^{r}-1$. On écrira explicitement une identité mettant en évidence la division euclidienne.
  corrige: |
    **a)** Si $n=mk$ avec $k\in\mathbb{N}^{*}$, alors $a^{n}-1=(a^{m})^{k}-1^{k}$, qui est divisible par $a^{m}-1$ d'après l'exercice 30 a). Ainsi $\boxed{a^{m}-1 \text{ divise } a^{n}-1}$.

    **b)** On écrit $n=mq+r$ avec $0\leqslant r<m$. Alors : 
    $$a^{n}-1=a^{r}\left(a^{mq}-1\right)+\left(a^{r}-1\right).$$
     Si $q\geqslant 1$, la question a) donne $a^{mq}-1=(a^{m}-1)Q$ avec $Q=1+a^{m}+\dots+a^{m(q-1)}$ ; si $q=0$, on pose $Q=0$. On obtient l'identité : 
    $$\boxed{a^{n}-1=(a^{m}-1)\times a^{r}Q+\left(a^{r}-1\right)}$$
     Comme $a\geqslant 2$ et $0\leqslant r<m$, on a $1\leqslant a^{r}<a^{m}$, donc $0\leqslant a^{r}-1<a^{m}-1$. Par unicité de la division euclidienne, le quotient de $a^{n}-1$ par $a^{m}-1$ est $a^{r}Q$ et le reste est $\boxed{a^{r}-1}$.

    *Vérification :* pour $a=2$, $n=10$, $m=3$, on a $r=1$, et en effet $2^{10}-1=1023=7\times 146+1$. On en déduit que $a^{m}-1$ divise $a^{n}-1$ si et seulement si $r=0$, c'est-à-dire si et seulement si $m$ divise $n$.
- id: "me-01-32"
  feuille: "f-me-01"
  numero: 32
  partie: "Pour aller plus loin"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [divisibilité, factorisation]
  noeuds: [z-division]
  notions: []
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 463 et 464"
  page_enonce: 5
  page_corrige: 18
  enonce: |
    **1.** Soit $n\in\mathbb{N}$. En utilisant la factorisation $(n+1)(n-1)=n^{2}-1$, montrer que $n+1$ divise $n^{2}+1$ si et seulement si $n+1$ divise $2$. En déduire l'ensemble des $n\in\mathbb{N}$ tels que $n+1$ divise $n^{2}+1$.

    **2.** En adaptant la méthode de la question précédente, déterminer les $n\in\mathbb{Z}$ tels que $n+3$ divise $n^{3}+3$.
  corrige: |
    **1.** On a $n^{2}+1=(n+1)(n-1)+2$. Si $n+1$ divise $n^{2}+1$, comme il divise $(n+1)(n-1)$, il divise la différence $2$ ; réciproquement, s'il divise $2$, il divise la somme $(n+1)(n-1)+2$. Comme $n+1\geqslant 1$, la condition s'écrit $n+1\in\{1\,;2\}$, soit $\boxed{n\in\{0\,;1\}}$.

    **2.** On cherche à faire apparaître un multiple de $n+3$. D'après l'exercice 30 b), $n+3$ divise $n^{3}+3^{3}=n^{3}+27$, et plus précisément $n^{3}+27=(n+3)(n^{2}-3n+9)$. Ainsi : 
    $$n^{3}+3=(n+3)(n^{2}-3n+9)-24.$$
     Pour $n=-3$, $n+3=0$ ne divise pas $n^{3}+3=-24\neq 0$. Pour $n\neq -3$, le même raisonnement qu'à la question 1 montre que $n+3$ divise $n^{3}+3$ si et seulement si $n+3$ divise $24$, c'est-à-dire $n+3\in\{\pm 1,\pm 2,\pm 3,\pm 4,\pm 6,\pm 8,\pm 12,\pm 24\}$. On obtient les seize valeurs : 
    $$\boxed{n\in\{-27,-15,-11,-9,-7,-6,-5,-4,-2,-1,0,1,3,5,9,21\}}$$

    *Vérification :* pour $n=21$, $n^{3}+3=9264=24\times 386$ ; pour $n=-27$, $n^{3}+3=-19680=(-24)\times 820$.
- id: "me-01-33"
  feuille: "f-me-01"
  numero: 33
  partie: "Pour aller plus loin"
  etoiles: 2
  types: [Démonstration]
