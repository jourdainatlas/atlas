  notions: [couple, norme]
  page_enonce: 11
  page_corrige: 15
  enonce: |
    $ABCD$ est un rectangle. On se place dans le repère orthonormé d'origine $A$ dans lequel 
    $$A(0\,;0) \qquad B(8\,;0) \qquad C(8\,;4) \qquad D(0\,;4)$$
     On note $I$, $J$, $K$ et $L$ les milieux respectifs de $[AB]$, $[BC]$, $[CD]$ et $[DA]$.

    **1.** Déterminer les coordonnées de $I$, $J$, $K$ et $L$.

    **2.** Calculer les longueurs $IJ$, $JK$, $KL$ et $LI$. Que peut-on en déduire ?

    **3.** Calculer les longueurs des diagonales $IK$ et $JL$. Le quadrilatère $IJKL$ est-il un carré ?

    **4.** Conclure sur la nature exacte de $IJKL$.

    **5.** Reprendre les questions 1 à 4 en remplaçant le rectangle par le carré $A(0\,;0)$, $B(6\,;0)$, $C(6\,;6)$, $D(0\,;6)$. Que devient alors le quadrilatère $IJKL$ ?
  corrige: |
    **1.** $I=\boxed{(4\,;0)}$ $J=\boxed{(8\,;2)}$ $K=\boxed{(4\,;4)}$ $L=\boxed{(0\,;2)}$

    **2.** $IJ=\sqrt{(8-4)^{2}+(2-0)^{2}}=\sqrt{20}$, et de même 
    $$JK=\sqrt{16+4}=\sqrt{20} \qquad KL=\sqrt{16+4}=\sqrt{20} \qquad LI=\sqrt{16+4}=\sqrt{20}$$
     Les quatre côtés ont la même longueur : $\boxed{IJKL \text{ est un losange.}}$

    **3.** $IK=\sqrt{0+16}=4$ et $JL=\sqrt{64+0}=8$.

    Les diagonales n'ont pas la même longueur : 
    $$\boxed{IJKL \text{ n'est pas un carré.}}$$

    **4.** $\boxed{IJKL \text{ est un losange non carré.}}$

    **5.** Avec le carré $A(0\,;0)$, $B(6\,;0)$, $C(6\,;6)$, $D(0\,;6)$, on obtient 
    $$I(3\,;0) \qquad J(6\,;3) \qquad K(3\,;6) \qquad L(0\,;3)$$
     Les quatre côtés valent $\sqrt{9+9}=\sqrt{18}$, et les diagonales $IK=6$ et $JL=6$ sont égales : 
    $$\boxed{IJKL \text{ est alors un carré.}}$$
     *Conclusion générale :* en joignant les milieux des côtés d'un rectangle on obtient un losange, et si le rectangle est un carré, ce losange est lui-même un carré.
- id: "s-05-28"
  feuille: "f-s-05"
  numero: 28
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [repères, distance]
  noeuds: [v-espace, gd-normes]
  notions: [norme]
  page_enonce: 11
  page_corrige: 16
  enonce: |
    Le plan est muni d'un repère orthonormé. On donne $A(0\,;0)$ et $B(4\,;0)$, et l'on considère le point $M(m\,;3)$, où $m$ désigne un nombre réel.

    **1.** Exprimer $MA^{2}$ et $MB^{2}$ en fonction de $m$.

    **2.** Déterminer la ou les valeurs de $m$ pour lesquelles le triangle $ABM$ est isocèle en $M$.

    **3.** Déterminer la ou les valeurs de $m$ pour lesquelles $MA=5$.

    **4.** Déterminer la ou les valeurs de $m$ pour lesquelles le triangle $ABM$ est rectangle en $A$.

    **5.** On cherche maintenant les valeurs de $m$ pour lesquelles $ABM$ est rectangle en $M$.

    **(a)** Montrer que cette condition se traduit par l'équation $m^{2}-4m+9=0$.

    **(b)** Montrer que $m^{2}-4m+9=(m-2)^{2}+5$.

    **(c)** Conclure.
  corrige: |
    **1.** $MA^{2}=(0-m)^{2}+(0-3)^{2}=\boxed{m^{2}+9}$

    $MB^{2}=(4-m)^{2}+(0-3)^{2}=16-8m+m^{2}+9=\boxed{m^{2}-8m+25}$

    **2.** Le triangle est isocèle en $M$ si et seulement si $MA=MB$, c'est-à-dire $MA^{2}=MB^{2}$ : 
    $$m^{2}+9=m^{2}-8m+25 \iff 9=-8m+25 \iff 8m=16 \iff \boxed{m=2}$$
     *Interprétation :* $M$ est alors à l'aplomb du milieu de $[AB]$, ce qui est bien la position attendue.

    **3.** $MA=5$ équivaut à $MA^{2}=25$, soit 
    $$m^{2}+9=25 \iff m^{2}=16 \iff \boxed{m=4 \text{ ou } m=-4}$$
     *Il y a bien deux solutions :* deux points de la droite d'ordonnée $3$ sont à distance $5$ de l'origine.

    **4.** Le triangle est rectangle en $A$ si et seulement si $AM^{2}+AB^{2}=MB^{2}$. Comme $AB^{2}=16$ : 
    $$m^{2}+9+16=m^{2}-8m+25 \iff 25=-8m+25 \iff \boxed{m=0}$$
     Le point $M(0\,;3)$ est alors situé à la verticale de $A$, ce qui donne bien un angle droit en $A$.

    **5.** **(a)** Le triangle est rectangle en $M$ si et seulement si $MA^{2}+MB^{2}=AB^{2}$ : 
    $$m^{2}+9+m^{2}-8m+25=16 \iff 2m^{2}-8m+34=16 \iff 2m^{2}-8m+18=0$$
     et en divisant par $2$ : 
    $$\boxed{m^{2}-4m+9=0}$$

    **(b)** On développe le membre de droite : 
    $$(m-2)^{2}+5=m^{2}-4m+4+5=m^{2}-4m+9$$
     L'égalité est bien vérifiée.

    **(c)** Un carré étant toujours positif ou nul, on a $(m-2)^{2}+5\geqslant 5>0$ pour tout réel $m$ : l'équation $m^{2}-4m+9=0$ n'a donc aucune solution. 
    $$\boxed{\text{Il n'existe aucune valeur de } m \text{ pour laquelle } ABM \text{ est rectangle en } M.}$$
     *Interprétation géométrique :* un tel point $M$ devrait se trouver sur le cercle de diamètre $[AB]$, dont le rayon vaut $2$ et le centre $(2\,;0)$. Or ce cercle ne monte pas au-dessus de l'ordonnée $2$, tandis que $M$ est toujours à l'ordonnée $3$.
- id: "s-05-29"
  feuille: "f-s-05"
  numero: 29
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [repères, coordonnées, distance, quadrilatères, cercle et médiatrice]
  noeuds: [v-espace, gd-normes]
  notions: [couple, norme]
  page_enonce: 11
  page_corrige: 16
  enonce: |
    Le plan est muni d'un repère orthonormé. On donne les points 
    $$A(0\,;0) \qquad B(6\,;3) \qquad C(4\,;7) \qquad D(-2\,;4)$$

    **1.** Démontrer que $ABCD$ est un parallélogramme.

    **2.** Calculer $AB^{2}$, $BC^{2}$ et $AC^{2}$. En déduire que le triangle $ABC$ est rectangle en $B$.

    **3.** Que peut-on alors dire du parallélogramme $ABCD$ ?

    **4.** Retrouver ce résultat en comparant les longueurs des deux diagonales.

    **5.** Calculer les longueurs exactes $AB$ et $BC$, puis le périmètre et l'aire de $ABCD$.

    **6.** Le quadrilatère $ABCD$ est-il un carré ? Justifier.

    **7.** Déterminer les coordonnées du centre du rectangle, puis vérifier qu'il est équidistant des quatre sommets. Quelle propriété du rectangle retrouve-t-on ainsi ?
  corrige: |
    **1.** Milieu de $[AC]$ : $\left(\dfrac{0+4}{2}\,;\dfrac{0+7}{2}\right)=(2\,;3{,}5)$.

    Milieu de $[BD]$ : $\left(\dfrac{6-2}{2}\,;\dfrac{3+4}{2}\right)=(2\,;3{,}5)$. 
    $$\boxed{ABCD \text{ est un parallélogramme.}}$$

    **2.** $AB^{2}=36+9=45$, $BC^{2}=(4-6)^{2}+(7-3)^{2}=4+16=20$, $AC^{2}=16+49=65$.

    Or $AB^{2}+BC^{2}=45+20=65=AC^{2}$ : 
    $$\boxed{\text{d'après la réciproque du théorème de Pythagore, } ABC \text{ est rectangle en } B.}$$

    **3.** Un parallélogramme possédant un angle droit est un rectangle : 
    $$\boxed{ABCD \text{ est un rectangle.}}$$

    **4.** $AC=\sqrt{65}$ et $BD=\sqrt{(-2-6)^{2}+(4-3)^{2}}=\sqrt{64+1}=\sqrt{65}$.

    Les diagonales du parallélogramme sont égales, ce qui caractérise également le rectangle : on retrouve donc le même résultat par un autre chemin.

    **5.** $AB=\sqrt{45}=3\sqrt{5}$ et $BC=\sqrt{20}=2\sqrt{5}$. 
    $$\mathcal{P}=2\left(3\sqrt{5}+2\sqrt{5}\right)=2\times 5\sqrt{5}=\boxed{10\sqrt{5}\approx 22{,}4}$$

    $$\mathcal{A}=AB\times BC=3\sqrt{5}\times 2\sqrt{5}=6\times 5=\boxed{30}$$
     *On remarque que* l'aire tombe sur un entier, alors qu'aucun côté n'est entier.

    **6.** Un carré est un rectangle dont deux côtés consécutifs sont égaux. Or $3\sqrt{5}\neq 2\sqrt{5}$ : 
    $$\boxed{ABCD \text{ n'est pas un carré.}}$$

    **7.** Le centre est le milieu commun des diagonales, soit $\Omega(2\,;3{,}5)$. On calcule : 
    $$\Omega A^{2}=4+12{,}25=16{,}25 \qquad \Omega B^{2}=16+0{,}25=16{,}25$$

    $$\Omega C^{2}=4+12{,}25=16{,}25 \qquad \Omega D^{2}=16+0{,}25=16{,}25$$
     Les quatre distances sont égales à $\sqrt{16{,}25}=\dfrac{\sqrt{65}}{2}$ : 
    $$\boxed{\Omega \text{ est équidistant des quatre sommets.}}$$
     **Propriété retrouvée :** les quatre sommets d'un rectangle sont sur un même cercle, dont le centre est le point d'intersection des diagonales et le diamètre la longueur d'une diagonale.
- id: "s-05-30"
  feuille: "f-s-05"
  numero: 30
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration, Calcul]
  mots_cles: [repères, coordonnées, milieu, distance]
  noeuds: [v-espace, gd-normes]
  notions: [couple, norme]
  page_enonce: 12
  page_corrige: 17
  enonce: |
    Dans un vieux livre, Anselme trouve la formule donnant la longueur $L$ de la médiane issue de $C$ dans un triangle $ABC$, en fonction des longueurs de ses trois côtés : 
    $$L^{2}=\frac{1}{4}\left(2a^{2}+2b^{2}-c^{2}\right)$$
     où l'on a noté, comme sur la figure, $a=BC$, $b=AC$ et $c=AB$, et où $I$ désigne le milieu de $[AB]$.

    ![Figure](documents/figures/80fd1173e45f858e.svg)

    Anselme est curieux d'en connaître la preuve. On se place dans un repère orthonormé d'origine $A$ dans lequel la droite $(AB)$ est l'axe des abscisses, et l'on note $\left(x_{C}\,;y_{C} \right)$ les coordonnées du point $C$.

    **1.** Quelles sont les coordonnées des points $A$ et $B$ dans ce repère ?

    **2.** En déduire les coordonnées du milieu $I$ de $[AB]$.

    **3.** En utilisant la formule de la distance, vérifier que : 
    $$L^{2}=IC^{2}=x_{C}^{2}+y_{C}^{2}-c\,x_{C}+\frac{c^{2}}{4}$$

    **4.** Par la même méthode, exprimer $a^{2}$ puis $b^{2}$ en fonction de $x_{C}$, $y_{C}$ et $c$. On donnera les résultats sous forme développée.

    **5.** En partant du membre de droite de la formule du livre, et en y remplaçant $a^{2}$ et $b^{2}$ par les expressions trouvées à la question 4, démontrer l'égalité d'Anselme.

    **6.** **Application.** Un triangle a pour côtés $a=7$, $b=5$ et $c=8$. Calculer la longueur exacte de la médiane issue de $C$, puis en donner une valeur approchée au dixième.
  corrige: |
    **1.** L'origine du repère est $A$, donc $A(0\,;0)$. Le point $B$ est sur l'axe des abscisses, à la distance $AB=c$ de l'origine : 
    $$\boxed{A(0\,;0) \qquad B(c\,;0)}$$

    **2.** $I$ est le milieu de $[AB]$ : 
    $$I=\left(\frac{0+c}{2}\,;\frac{0+0}{2}\right)=\boxed{\left(\frac{c}{2}\,;0\right)}$$

    **3.** Le repère étant orthonormé, on applique la formule de la distance entre $I\left(\frac{c}{2}\,;0\right)$ et $C\left(x_{C}\,;y_{C}\right)$ : 
    $$L^{2}=IC^{2}=\left(x_{C}-\frac{c}{2}\right)^{2}+\left(y_{C}-0\right)^{2}$$
     En développant l'identité remarquable : 
    $$L^{2}=x_{C}^{2}-2\times x_{C}\times\frac{c}{2}+\frac{c^{2}}{4}+y_{C}^{2} =\boxed{x_{C}^{2}+y_{C}^{2}-c\,x_{C}+\frac{c^{2}}{4}}$$

    **4.** **Longueur $a=BC$**, entre $B(c\,;0)$ et $C\left(x_{C}\,;y_{C}\right)$ : 
    $$a^{2}=\left(x_{C}-c\right)^{2}+y_{C}^{2}=\boxed{x_{C}^{2}-2c\,x_{C}+c^{2}+y_{C}^{2}}$$

    **Longueur $b=AC$**, entre $A(0\,;0)$ et $C\left(x_{C}\,;y_{C}\right)$ : 
    $$b^{2}=\boxed{x_{C}^{2}+y_{C}^{2}}$$

    **5.** Partons du membre de droite de la formule d'Anselme et remplaçons : 
    $$\frac{1}{4}\left(2a^{2}+2b^{2}-c^{2}\right) =\frac{1}{4}\Big(2\left(x_{C}^{2}-2c\,x_{C}+c^{2}+y_{C}^{2}\right) +2\left(x_{C}^{2}+y_{C}^{2}\right)-c^{2}\Big)$$

    $$=\frac{1}{4}\left(2x_{C}^{2}-4c\,x_{C}+2c^{2}+2y_{C}^{2}+2x_{C}^{2}+2y_{C}^{2}-c^{2}\right)$$

    $$=\frac{1}{4}\left(4x_{C}^{2}+4y_{C}^{2}-4c\,x_{C}+c^{2}\right) =x_{C}^{2}+y_{C}^{2}-c\,x_{C}+\frac{c^{2}}{4}$$
     On reconnaît exactement l'expression de $L^{2}$ obtenue à la question 3 : 
    $$\boxed{L^{2}=\frac{1}{4}\left(2a^{2}+2b^{2}-c^{2}\right)}$$
     La formule du vieux livre est donc démontrée.

    *Ce qui a rendu la preuve possible :* le choix du repère. En plaçant $A$ à l'origine et $B$ sur l'axe des abscisses, on n'a laissé que deux inconnues, $x_{C}$ et $y_{C}$, et celles-ci disparaissent d'elles-mêmes à la fin.

    **6.** Avec $a=7$, $b=5$ et $c=8$ : 
    $$L^{2}=\frac{1}{4}\left(2\times 49+2\times 25-64\right)=\frac{1}{4}\left(98+50-64\right) =\frac{84}{4}=21$$

    $$\boxed{L=\sqrt{21}\approx 4{,}6}$$

