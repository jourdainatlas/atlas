- id: "s-05-01"
  feuille: "f-s-05"
  numero: 1
  partie: "Repères et lecture de coordonnées"
  etoiles: 1
  types: [Lecture graphique, Démonstration]
  mots_cles: [repères, coordonnées, milieu, distance]
  noeuds: [v-espace, gd-normes]
  notions: [couple, norme]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    On a représenté ci-dessous trois repères du plan.

    ![Figure](documents/figures/688d3f56d4a029f2.svg)

    **1.** Pour chacun d'eux, préciser s'il est quelconque, orthogonal ou orthonormé. Justifier.

    **2.** Dans lequel de ces repères peut-on utiliser la formule donnant les coordonnées du milieu d'un segment ?

    **3.** Dans lequel peut-on utiliser la formule donnant la distance entre deux points ?

    **4.** Donner, dans chacun de ces trois repères, les coordonnées des points $O$, $I$ et $J$.
  corrige: |
    **1.** On observe l'angle formé par les deux axes, puis les longueurs $OI$ et $OJ$.

    • Repère n$^{\circ}1$ : les axes ne sont pas perpendiculaires, le repère est $\boxed{\text{quelconque}}$.

    • Repère n$^{\circ}2$ : les axes sont perpendiculaires, mais $OI$ est visiblement plus grand que $OJ$ : le repère est $\boxed{\text{orthogonal}}$ sans être orthonormé.

    • Repère n$^{\circ}3$ : les axes sont perpendiculaires et $OI=OJ$ : le repère est $\boxed{\text{orthonormé}}$.

    **2.** La formule du milieu ne fait intervenir ni longueur ni angle : elle reste valable quel que soit le repère. 
    $$\boxed{\text{Elle s'applique dans les trois repères.}}$$

    **3.** La formule de la distance repose sur le théorème de Pythagore, donc sur la présence d'un angle droit entre les axes, et sur le fait que la même unité serve dans les deux directions. 
    $$\boxed{\text{Elle ne s'applique que dans le repère n}^{\circ}3.}$$
     *Attention :* le repère n$^{\circ}2$ possède bien un angle droit, mais les deux unités diffèrent : la formule y serait fausse.

    **4.** Ces trois points ne se calculent pas, ils sont fixés par la définition même du repère : 
    $$\boxed{O(0\,;0) \qquad I(1\,;0) \qquad J(0\,;1)}$$
     et ce, dans *chacun* des trois repères.
- id: "s-05-02"
  feuille: "f-s-05"
  numero: 2
  partie: "Repères et lecture de coordonnées"
  etoiles: 1
  types: [Calcul]
  mots_cles: [repères, coordonnées, milieu, distance]
  noeuds: [v-espace, gd-normes]
  notions: [couple, norme]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Le plan est muni du repère orthonormé $\left(O\,;I,J\right)$ ci-dessous.

    ![Figure](documents/figures/5126b7a7f1643c1a.svg)

    **1.** Donner les coordonnées des points $A$, $B$, $C$, $D$, $E$, $F$, $G$ et $H$.

    **2.** Quels sont les points situés sur un axe du repère ? Que remarque-t-on sur leurs coordonnées ?

    **3.** Calculer la distance $OA$, puis la distance $BH$.

    **4.** Déterminer les coordonnées du milieu de $[AE]$, puis celles du milieu de $[BD]$.
  corrige: |
    **1.** On lit d'abord l'abscisse sur l'axe horizontal, puis l'ordonnée sur l'axe vertical :

    • $A(3\,;2)$

    • $B(-2\,;1)$

    • $C(0\,;3)$

    • $D(4\,;-2)$

    • $E(-3\,;-3)$

    • $F(2\,;0)$

    • $G(0\,;-2)$

    • $H(-1\,;4)$

    **2.** Le point $F$ est sur l'axe des abscisses, les points $C$ et $G$ sur l'axe des ordonnées. 
    $$\boxed{\begin{array}{l} \text{un point de l'axe des abscisses a une \textbf{ordonnée} nulle ;} \\[1mm] \text{un point de l'axe des ordonnées a une \textbf{abscisse} nulle.} \end{array}}$$

    **3.** Le repère étant orthonormé, la formule de la distance s'applique : 
    $$OA=\sqrt{(3-0)^{2}+(2-0)^{2}}=\sqrt{9+4}=\boxed{\sqrt{13}}$$

    $$BH=\sqrt{(-1-(-2))^{2}+(4-1)^{2}}=\sqrt{1+9}=\boxed{\sqrt{10}}$$

    **4.** Milieu de $[AE]$ : $\left(\dfrac{3+(-3)}{2}\,;\dfrac{2+(-3)}{2}\right) =\boxed{(0\,;-0{,}5)}$

    Milieu de $[BD]$ : $\left(\dfrac{-2+4}{2}\,;\dfrac{1+(-2)}{2}\right)=\boxed{(1\,;-0{,}5)}$
- id: "s-05-03"
  feuille: "f-s-05"
  numero: 3
  partie: "Repères et lecture de coordonnées"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [repères, coordonnées, milieu]
  noeuds: [v-espace]
  notions: [couple]
  page_enonce: 2
  page_corrige: 2
  enonce: |
    Le plan est muni du repère $\left(O\,;I,J\right)$ ci-dessous. **Attention : les deux axes n'ont pas la même unité.**

    ![Figure](documents/figures/e3e00d10024353b8.svg)

    **1.** Ce repère est-il quelconque, orthogonal ou orthonormé ? Justifier soigneusement.

    **2.** Donner les coordonnées des points $A$, $B$, $C$, $D$, $E$ et $F$.

    **3.** Déterminer les coordonnées du milieu de $[AC]$, puis celles du milieu de $[BE]$.

    **4.** Un élève affirme que $OF=\sqrt{4^{2}+1^{2}}=\sqrt{17}$. Expliquer pourquoi ce calcul n'a aucun sens ici.
  corrige: |
    **1.** Les deux axes sont perpendiculaires : le repère est **orthogonal**. En revanche, la longueur $OI$ est bien plus grande que la longueur $OJ$ : l'unité n'est pas la même sur les deux axes. 
    $$\boxed{\text{Le repère est orthogonal, mais il n'est pas orthonormé.}}$$

    **2.** On compte les graduations portées sur chaque axe, sans tenir compte de la forme des rectangles du quadrillage :

    • $A(2\,;3)$

    • $B(-1\,;5)$

    • $C(3\,;-2)$

    • $D(0\,;4)$

    • $E(-3\,;-4)$

    • $F(4\,;1)$

    **3.** La formule du milieu est valable dans *tout* repère, donc ici aussi : 
    $$\text{milieu de } [AC] : \left(\dfrac{2+3}{2}\,;\dfrac{3+(-2)}{2}\right) =\boxed{(2{,}5\,;0{,}5)}$$

    $$\text{milieu de } [BE] : \left(\dfrac{-1+(-3)}{2}\,;\dfrac{5+(-4)}{2}\right) =\boxed{(-2\,;0{,}5)}$$

    **4.** La formule $\sqrt{(x_{B}-x_{A})^{2}+(y_{B}-y_{A})^{2}}$ se démontre avec le théorème de Pythagore, appliqué à un triangle dont les côtés de l'angle droit mesurent $|x_{B}-x_{A}|$ et $|y_{B}-y_{A}|$. Or ces deux nombres ne peuvent être comparés que si l'unité est la même sur les deux axes, ce qui n'est pas le cas ici : $1$ unité d'abscisse et $1$ unité d'ordonnée ne représentent pas la même longueur. 
    $$\boxed{\text{Le calcul additionne des longueurs mesurées avec deux étalons différents : il n'a aucun sens.}}$$
- id: "s-05-04"
  feuille: "f-s-05"
  numero: 4
  partie: "Repères et lecture de coordonnées"
  etoiles: 1
  types: [Lecture graphique, Démonstration, Calcul]
  mots_cles: [repères, coordonnées, milieu, quadrilatères]
  noeuds: [v-espace]
  notions: [couple]
  page_enonce: 2
  page_corrige: 2
  enonce: |
    Le plan est muni du repère $\left(O\,;I,J\right)$ ci-dessous, dont les axes ne sont pas perpendiculaires. Le quadrillage est formé de parallélogrammes dont les côtés sont parallèles aux axes.

    ![Figure](documents/figures/cd9f21975704759a.svg)

    **1.** De quel type de repère s'agit-il ?

    **2.** Donner les coordonnées des huit points $A$, $B$, $C$, $D$, $E$, $F$, $G$ et $H$. *On se déplacera le long du quadrillage, et non à l'horizontale et à la verticale.*

    **3.** Déterminer par le calcul les coordonnées du milieu de $[AC]$, puis vérifier le résultat par lecture graphique.

    **4.** Peut-on affirmer que $OA=\sqrt{5}$ ? Justifier.
  corrige: |
    **1.** Les axes ne sont pas perpendiculaires : $\boxed{\text{c'est un repère quelconque.}}$

    **2.** On se déplace le long du quadrillage : d'abord un certain nombre de « pas » parallèlement à $(OI)$, puis parallèlement à $(OJ)$.

    • $A(2\,;-1)$

    • $B(3\,;1)$

    • $C(4\,;2)$

    • $D(1\,;2)$

    • $E(-1\,;2)$

    • $F(2\,;0)$

    • $G(-2\,;1)$

    • $H(-1\,;-2)$

    *Piège classique :* lire les coordonnées « à l'horizontale et à la verticale » donnerait ici des résultats faux, car les axes sont inclinés.

    **3.** Milieu de $[AC]$ : $\left(\dfrac{2+4}{2}\,;\dfrac{-1+2}{2}\right)=\boxed{(3\,;0{,}5)}$

    Sur le graphique, ce point se situe bien au milieu du segment tracé de $A$ à $C$ : la formule du milieu fonctionne dans ce repère quelconque.

    **4.** Non. La formule de la distance exige un repère orthonormé, ce qui n'est pas le cas ici : 
    $$\boxed{\text{on ne peut rien dire de la longueur } OA \text{ dans ce repère.}}$$
- id: "s-05-05"
  feuille: "f-s-05"
  numero: 5
  partie: "Repères et lecture de coordonnées"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [repères, coordonnées, milieu, quadrilatères]
  noeuds: [v-espace]
  notions: [couple]
  page_enonce: 3
  page_corrige: 3
  enonce: |
    La figure ci-dessous est un pavage formé de parallélogrammes identiques. **Aucun repère n'est tracé : c'est à vous de le construire mentalement.**

    ![Figure](documents/figures/fdca02f876cd4d7b.svg)

    **1.** Justifier que $\left(A\,;B,C\right)$ est un repère du plan. De quel type est-il ?

    **2.** Dans ce repère, donner les coordonnées des points $D$, $E$, $P$, $Q$, $V$, $R$, $S$, $T$ et $U$.

    **3.** Déterminer les coordonnées du milieu de $[DS]$ dans ce repère.

    **4.** On change maintenant de repère et l'on se place dans $\left(E\,;P,Q\right)$. Donner les nouvelles coordonnées des points $A$, $B$, $C$, $D$, $R$ et $S$.

    **5.** Quel point de la figure a pour coordonnées $(1\,;1)$ dans le repère $\left(E\,;P,Q\right)$ ?

    **6.** Que constate-t-on lorsque l'on change de repère ? Le point $S$ a-t-il changé de place ?
  corrige: |
    **1.** Les trois points $A$, $B$ et $C$ ne sont pas alignés : ils forment donc un repère. Les droites $(AB)$ et $(AC)$ n'étant pas perpendiculaires, 
    $$\boxed{\text{le repère } \left(A\,;B,C\right) \text{ est quelconque.}}$$

    **2.** On compte les mailles du pavage : le premier nombre en suivant la direction $(AB)$, le second en suivant la direction $(AC)$.

    • $D(4\,;0)$

    • $E(2\,;1)$

    • $P(3\,;1)$

    • $Q(2\,;2)$

    • $V(3\,;2)$

    • $R(4\,;3)$

    • $S(0\,;3)$

    • $T(1\,;2)$

    • $U(3\,;3)$

    **3.** Milieu de $[DS]$ : $\left(\dfrac{4+0}{2}\,;\dfrac{0+3}{2}\right)=\boxed{(2\,;1{,}5)}$

    **4.** L'origine est maintenant $E$, et les deux unités sont $\vphantom{)}EP$ et $EQ$, qui correspondent exactement aux mêmes déplacements qu'avant. Il suffit donc de retrancher les coordonnées de $E$, soit $(2\,;1)$, à celles de chaque point :

    • $A(-2\,;-1)$

    • $B(-1\,;-1)$

    • $C(-2\,;0)$

    • $D(2\,;-1)$

    • $R(2\,;2)$

    • $S(-2\,;2)$

    **5.** Le point de coordonnées $(1\,;1)$ dans ce repère s'obtient en partant de $E$, en avançant d'une maille dans la direction $EP$ puis d'une maille dans la direction $EQ$ : 
    $$\boxed{\text{c'est le point } V.}$$

    **6.** Les coordonnées ont changé, mais aucun point n'a bougé. 
    $$\boxed{\begin{array}{l} \text{les coordonnées décrivent la position d'un point \emph{relativement à un repère},}\\[1mm] \text{et non le point lui-même.} \end{array}}$$
     Le point $S$ est toujours au même endroit du pavage : il s'appelle $(0\,;3)$ dans le premier repère et $(-2\,;2)$ dans le second.
- id: "s-05-06"
  feuille: "f-s-05"
  numero: 6
  partie: "Repères et lecture de coordonnées"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [repères, coordonnées, milieu, quadrilatères]
  noeuds: [v-espace]
  notions: [couple]
  page_enonce: 3
  page_corrige: 3
  enonce: |
    $ABCDEF$ est un hexagone régulier de centre $O$. On a tracé en gris le quadrillage formé par les directions $(OA)$ et $(OB)$.

    ![Figure](documents/figures/f3c952a459d97e06.svg)

    **1.** Justifier que $\left(O\,;A,B\right)$ est un repère du plan. Est-il orthonormé ?

    **2.** Dans ce repère, donner les coordonnées des points $O$, $A$ et $B$. *Aucun calcul n'est nécessaire.*

    **3.** En s'aidant du quadrillage, donner les coordonnées des points $C$, $D$, $E$ et $F$.

    **4.** Déterminer les coordonnées du milieu de $[AB]$, puis celles du milieu de $[CF]$. Que remarque-t-on pour ce dernier ?

    **5.** Déterminer les coordonnées du milieu de $[BE]$ et de $[AD]$. Qu'en déduit-on sur les diagonales de l'hexagone ?

    **6.** Le quadrilatère $ABCO$ est-il un parallélogramme ? Justifier à l'aide des milieux.
  corrige: |
    **1.** Les points $O$, $A$ et $B$ ne sont pas alignés, donc $\left(O\,;A,B\right)$ est un repère. Dans un hexagone régulier, l'angle $\widehat{AOB}$ mesure $60^{\circ}$ et non $90^{\circ}$ : 
    $$\boxed{\text{le repère n'est pas orthonormé ; il est quelconque.}}$$
     *On notera cependant que* $OA=OB$, puisque tous les rayons de l'hexagone sont égaux : c'est l'angle, et lui seul, qui empêche le repère d'être orthonormé.

    **2.** Par définition du repère : $\boxed{O(0\,;0) \qquad A(1\,;0) \qquad B(0\,;1)}$

    **3.** On lit sur le quadrillage : 
    $$\boxed{C(-1\,;1) \qquad D(-1\,;0) \qquad E(0\,;-1) \qquad F(1\,;-1)}$$
     *Vérification par la symétrie :* $D$ est diamétralement opposé à $A$, et l'on trouve bien des coordonnées opposées ; de même pour $E$ et $B$, ainsi que pour $C$ et $F$.

    **4.** Milieu de $[AB]$ : $\left(\dfrac{1+0}{2}\,;\dfrac{0+1}{2}\right)=\boxed{(0{,}5\,;0{,}5)}$

    Milieu de $[CF]$ : $\left(\dfrac{-1+1}{2}\,;\dfrac{1+(-1)}{2}\right)=\boxed{(0\,;0)}$

    Ce dernier milieu est le point $O$ lui-même : $\boxed{[CF] \text{ est une grande diagonale de l'hexagone.}}$

    **5.** Milieu de $[BE]$ : $\left(\dfrac{0+0}{2}\,;\dfrac{1+(-1)}{2}\right)=(0\,;0)=O$

    Milieu de $[AD]$ : $\left(\dfrac{1+(-1)}{2}\,;\dfrac{0+0}{2}\right)=(0\,;0)=O$ 
    $$\boxed{\text{Les trois grandes diagonales } [AD],\ [BE] \text{ et } [CF] \text{ ont le même milieu } O.}$$
     Elles se coupent donc toutes en $O$, qui est le centre de symétrie de l'hexagone.

    **6.** Les diagonales du quadrilatère $ABCO$ sont $[AC]$ et $[BO]$ : 
    $$\text{milieu de } [AC] : \left(\dfrac{1+(-1)}{2}\,;\dfrac{0+1}{2}\right)=(0\,;0{,}5)$$

    $$\text{milieu de } [BO] : \left(\dfrac{0+0}{2}\,;\dfrac{1+0}{2}\right)=(0\,;0{,}5)$$
     Les deux milieux coïncident : $\boxed{ABCO \text{ est un parallélogramme.}}$
- id: "s-05-07"
  feuille: "f-s-05"
  numero: 7
  partie: "Repères et lecture de coordonnées"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [repères, coordonnées, milieu, distance]
  noeuds: [v-espace, gd-normes]
  notions: [couple, norme]
  page_enonce: 4
  page_corrige: 4
  enonce: |
    $ABCD$ est un rectangle tel que $AB=8$ cm et $AD=4$ cm. On note $I$, $J$, $K$ et $L$ les milieux respectifs des côtés $[AB]$, $[BC]$, $[CD]$ et $[DA]$, et $O$ le point d'intersection des diagonales.

    ![Figure](documents/figures/fdc1d579435d7f3e.svg)

    **Partie A : dans le repère $\left(A\,;I,L\right)$**

    **1.** Justifier que $\left(A\,;I,L\right)$ est bien un repère du plan. Est-il orthogonal ? Est-il orthonormé ? Justifier en calculant les longueurs $AI$ et $AL$.

    **2.** Donner, dans ce repère, les coordonnées des neuf points $A$, $B$, $C$, $D$, $I$, $J$, $K$, $L$ et $O$.

    **3.** Vérifier par le calcul que $O$ est bien le milieu de $[AC]$ et le milieu de $[BD]$.

    **4.** Un élève écrit $AC=\sqrt{2^{2}+2^{2}}=2\sqrt{2}$. Expliquer pourquoi c'est faux.

    **Partie B : dans un repère orthonormé**

    On se place maintenant dans un repère orthonormé d'origine $A$, d'unité $1$ cm, dont les axes sont portés par les droites $(AB)$ et $(AD)$.

    **5.** Donner les nouvelles coordonnées des neuf points de la figure.

    **6.** Calculer la longueur exacte de la diagonale $[AC]$.

    **7.** Calculer les longueurs $IJ$, $JK$, $KL$ et $LI$. Quelle est la nature du quadrilatère $IJKL$ ?
  corrige: |
    **Partie A**

    **1.** Les points $A$, $I$ et $L$ ne sont pas alignés : $\left(A\,;I,L\right)$ est bien un repère. Les droites $(AI)$ et $(AL)$ portent deux côtés du rectangle : elles sont perpendiculaires, donc le repère est **orthogonal**. En revanche : 
    $$AI=\dfrac{AB}{2}=4 \text{ cm} \qquad\text{et}\qquad AL=\dfrac{AD}{2}=2 \text{ cm}$$

    $$\boxed{AI\neq AL \text{ : le repère n'est pas orthonormé.}}$$

    **2.** Dans ce repère, une unité d'abscisse vaut $AI$ et une unité d'ordonnée vaut $AL$ :

    • $A(0\,;0)$

    • $I(1\,;0)$

    • $B(2\,;0)$

    • $J(2\,;1)$

    • $C(2\,;2)$

    • $K(1\,;2)$

    • $D(0\,;2)$

    • $L(0\,;1)$

    • $O(1\,;1)$

    **3.** Milieu de $[AC]$ : $\left(\dfrac{0+2}{2}\,;\dfrac{0+2}{2}\right)=(1\,;1)$

    Milieu de $[BD]$ : $\left(\dfrac{2+0}{2}\,;\dfrac{0+2}{2}\right)=(1\,;1)$ 
    $$\boxed{\text{Ces deux milieux sont le point } O \text{ : les diagonales du rectangle se coupent en leur milieu.}}$$

    **4.** Le repère n'est pas orthonormé : la formule de la distance ne s'y applique pas. Le calcul proposé additionne deux unités de longueurs différentes ($4$ cm et $2$ cm), et ne peut donc rien donner de correct. 
    $$\boxed{\text{En réalité } AC=4\sqrt{5}\approx 8{,}9 \text{ cm, et non } 2\sqrt{2}\approx 2{,}8.}$$

    **Partie B**

    **5.** L'unité vaut maintenant $1$ cm sur les deux axes :

    • $A(0\,;0)$

    • $I(4\,;0)$

    • $B(8\,;0)$

    • $J(8\,;2)$

    • $C(8\,;4)$

    • $K(4\,;4)$

    • $D(0\,;4)$

    • $L(0\,;2)$

    • $O(4\,;2)$

    **6.** Le repère étant orthonormé, on peut enfin appliquer la formule : 
    $$AC=\sqrt{(8-0)^{2}+(4-0)^{2}}=\sqrt{64+16}=\sqrt{80}=\boxed{4\sqrt{5}\approx 8{,}9 \text{ cm}}$$

    **7.** On calcule les quatre côtés du quadrilatère $IJKL$ : 
    $$IJ=\sqrt{(8-4)^{2}+(2-0)^{2}}=\sqrt{20} \qquad JK=\sqrt{(4-8)^{2}+(4-2)^{2}}=\sqrt{20}$$

    $$KL=\sqrt{(0-4)^{2}+(2-4)^{2}}=\sqrt{20} \qquad LI=\sqrt{(4-0)^{2}+(0-2)^{2}}=\sqrt{20}$$
     Les quatre côtés ont la même longueur : 
    $$\boxed{IJKL \text{ est un losange.}}$$
- id: "s-05-08"
  feuille: "f-s-05"
  numero: 8
  partie: "Repères et lecture de coordonnées"
  etoiles: 1
  types: [Calcul]
  mots_cles: [repères, coordonnées, milieu, quadrilatères]
  noeuds: [v-espace]
  notions: [couple]
  page_enonce: 4
  page_corrige: 5
  enonce: |
    **1.** Dans un repère orthonormé, placer les points 
    $$A(2\,;3) \qquad B(-1\,;4) \qquad C(0\,;-2) \qquad D(-3\,;-1) \qquad E(4\,;0)$$
     *On prendra un repère allant de $-4$ à $5$ en abscisse comme en ordonnée.*

    **2.** Placer le point $F$ d'abscisse $-2$ situé sur l'axe des abscisses, puis le point $G$ d'ordonnée $3$ situé sur l'axe des ordonnées.

    **3.** Placer le point $H$ tel que $B$ soit le milieu de $[AH]$. On donnera ses coordonnées.

    **4.** Placer le point $K$ tel que $ABCK$ soit un parallélogramme, en utilisant le critère des diagonales. On donnera ses coordonnées.
  corrige: |
    **** **Questions 1 à 4.** Voici la figure complète.

    ![Figure](documents/figures/29f491208883eeb3.svg)

    **2.** Le point $F$ est sur l'axe des abscisses, donc son ordonnée est nulle : $\boxed{F(-2\,;0)}$. Le point $G$ est sur l'axe des ordonnées, donc son abscisse est nulle : $\boxed{G(0\,;3)}$.

    **3.** Si $B$ est le milieu de $[AH]$, alors $\dfrac{2+x_{H}}{2}=-1$ et $\dfrac{3+y_{H}}{2}=4$, d'où $x_{H}=-4$ et $y_{H}=5$ : 
    $$\boxed{H(-4\,;5)}$$

    **4.** $ABCK$ est un parallélogramme si et seulement si $[AC]$ et $[BK]$ ont le même milieu. Le milieu de $[AC]$ vaut $\left(\dfrac{2+0}{2}\,;\dfrac{3-2}{2}\right)=(1\,;0{,}5)$. Il faut donc $\dfrac{-1+x_{K}}{2}=1$ et $\dfrac{4+y_{K}}{2}=0{,}5$ : 
    $$\boxed{K(3\,;-3)}$$
- id: "s-05-09"
  feuille: "f-s-05"
  numero: 9
  partie: "Milieu d'un segment"
  etoiles: 1
  types: [Calcul]
  mots_cles: [coordonnées, milieu]
  noeuds: [v-espace]
  notions: [couple]
  page_enonce: 5
  page_corrige: 6
  enonce: |
    Dans chaque cas, déterminer les coordonnées du milieu $M$ du segment $[AB]$.

    **a)** $A(2\,;5)$ et $B(6\,;1)$

    **b)** $A(-3\,;4)$ et $B(7\,;-2)$

    **c)** $A(0\,;0)$ et $B(5\,;7)$

    **d)** $A(-1\,;-6)$ et $B(-5\,;2)$

    **e)** $A\left(\frac{1}{2}\,;3\right)$ et $B\left(\frac{5}{2}\,;-1\right)$

    **f)** $A(-4\,;7)$ et $B(-4\,;-3)$

    **g)** $A(0{,}5\,;1{,}5)$ et $B(2{,}5\,;-0{,}5)$

    **h)** $A(-7\,;2)$ et $B(3\,;2)$

    **i)** $A(1\,;-1)$ et $B(-1\,;1)$

    **j)** $A(-2{,}5\,;4)$ et $B(3{,}5\,;-1)$

    Pour les questions f), h) et i), interpréter géométriquement le résultat obtenu.
  corrige: |
    *On applique la formule $x_{M}=\dfrac{x_{A}+x_{B}}{2}$ et $y_{M}=\dfrac{y_{A}+y_{B}}{2}$ : les coordonnées du milieu sont les moyennes de celles des extrémités.*

    **a)** $\left(\dfrac{2+6}{2}\,;\dfrac{5+1}{2}\right)=\boxed{(4\,;3)}$

    **b)** $\left(\dfrac{-3+7}{2}\,;\dfrac{4-2}{2}\right)=\boxed{(2\,;1)}$

    **c)** $\left(\dfrac{0+5}{2}\,;\dfrac{0+7}{2}\right)=\boxed{(2{,}5\,;3{,}5)}$

    **d)** $\left(\dfrac{-1-5}{2}\,;\dfrac{-6+2}{2}\right)=\boxed{(-3\,;-2)}$

    **e)** $\left(\dfrac{\frac{1}{2}+\frac{5}{2}}{2}\,;\dfrac{3-1}{2}\right) =\boxed{\left(\dfrac{3}{2}\,;1\right)}$

    **f)** $\left(\dfrac{-4-4}{2}\,;\dfrac{7-3}{2}\right)=\boxed{(-4\,;2)}$

    **g)** $\left(\dfrac{0{,}5+2{,}5}{2}\,;\dfrac{1{,}5-0{,}5}{2}\right)=\boxed{(1{,}5\,;0{,}5)}$

    **h)** $\left(\dfrac{-7+3}{2}\,;\dfrac{2+2}{2}\right)=\boxed{(-2\,;2)}$

    **i)** $\left(\dfrac{1-1}{2}\,;\dfrac{-1+1}{2}\right)=\boxed{(0\,;0)}$

    **j)** $\left(\dfrac{-2{,}5+3{,}5}{2}\,;\dfrac{4-1}{2}\right)=\boxed{(0{,}5\,;1{,}5)}$

    **Interprétations.**

    • Question f) : $A$ et $B$ ont la même abscisse $-4$, donc le milieu aussi. Le segment $[AB]$ est « vertical », parallèle à l'axe des ordonnées.

    • Question h) : $A$ et $B$ ont la même ordonnée $2$ : le segment est « horizontal ».

    • Question i) : le milieu est l'origine du repère, donc $A$ et $B$ sont symétriques par rapport à $O$.
- id: "s-05-10"
  feuille: "f-s-05"
  numero: 10
  partie: "Milieu d'un segment"
  etoiles: 1
  types: [Calcul]
  mots_cles: [coordonnées, milieu]
  noeuds: [v-espace]
  notions: [couple]
  page_enonce: 5
  page_corrige: 6
  enonce: |
    *On n'utilisera pas de nouvelle formule : on écrira la formule du milieu, et l'on résoudra l'équation obtenue, comme au chapitre 4.*

    Dans chaque cas, $M$ est le milieu de $[AB]$. Déterminer les coordonnées du point manquant.

    **a)** $M(3\,;2)$ et $A(-1\,;5)$ ; trouver $B$.

    **b)** $M(0\,;-4)$ et $A(2\,;1)$ ; trouver $B$.

    **c)** $M(-1\,;3)$ et $B(5\,;0)$ ; trouver $A$.

    **d)** $M(2{,}5\,;1)$ et $A(0\,;-3)$ ; trouver $B$.

    **e)** $M(-3\,;-2)$ et $A(-3\,;4)$ ; trouver $B$.

    **f)** $M\left(\frac{1}{2}\,;\frac{3}{2}\right)$ et $A(2\,;-1)$ ; trouver $B$.
  corrige: |
    *On écrit la formule du milieu, puis on résout l'équation obtenue.* Détaillons la première : 
    $$\frac{-1+x_{B}}{2}=3 \iff -1+x_{B}=6 \iff x_{B}=7 \qquad ; \qquad \frac{5+y_{B}}{2}=2 \iff 5+y_{B}=4 \iff y_{B}=-1$$

    $$\boxed{B(7\,;-1)}$$

    **b)** $\boxed{B(-2\,;-9)}$

    **c)** $\boxed{A(-7\,;6)}$

    **d)** $\boxed{B(5\,;5)}$

    **e)** $\boxed{B(-3\,;-8)}$

    **f)** $\boxed{B(-1\,;4)}$

    *On remarque que* l'on retrouve à chaque fois le point cherché par le calcul $x_{B}=2x_{M}-x_{A}$, ce qui est simplement la formule du milieu réarrangée.
- id: "s-05-11"
  feuille: "f-s-05"
  numero: 11
  partie: "Milieu d'un segment"
  etoiles: 1
  types: [Calcul]
  mots_cles: [repères, coordonnées, symétrique]
  noeuds: [v-espace]
  notions: [couple]
  page_enonce: 5
  page_corrige: 6
  enonce: |
    **1.** Déterminer les coordonnées du symétrique du point $A(3\,;-2)$ par rapport au point $B(1\,;4)$.

    **2.** Déterminer les coordonnées du symétrique du point $C(-5\,;1)$ par rapport à l'origine $O$ du repère.

    **3.** Déterminer les coordonnées du symétrique du point $D(2\,;7)$ par rapport au point $E(2\,;3)$. Que remarque-t-on sur les abscisses ?

    **4.** Le point $F(4\,;-1)$ est-il le symétrique de $G(0\,;5)$ par rapport à $H(2\,;2)$ ? Justifier.
  corrige: |
    *Dire que $A'$ est le symétrique de $A$ par rapport à $B$ signifie exactement que $B$ est le milieu de $[AA']$.*

    **1.** $\dfrac{3+x}{2}=1$ donne $x=-1$, et $\dfrac{-2+y}{2}=4$ donne $y=10$ : $\boxed{(-1\,;10)}$

    **2.** Le symétrique par rapport à l'origine s'obtient en changeant les deux signes : $\boxed{(5\,;-1)}$

    **3.** $\dfrac{2+x}{2}=2$ donne $x=2$, et $\dfrac{7+y}{2}=3$ donne $y=-1$ : $\boxed{(2\,;-1)}$

    Les points $D$, $E$ et le symétrique ont tous la même abscisse $2$ : ils sont alignés sur une même verticale, ce qui est logique puisque $D$ et $E$ le sont déjà.

    **4.** Le milieu de $[GF]$ vaut $\left(\dfrac{0+4}{2}\,;\dfrac{5-1}{2}\right)=(2\,;2)$, qui est exactement le point $H$ : 
    $$\boxed{\text{oui, } F \text{ est bien le symétrique de } G \text{ par rapport à } H.}$$
- id: "s-05-12"
  feuille: "f-s-05"
  numero: 12
  partie: "Milieu d'un segment"
  etoiles: 2
  types: [Calcul]
  mots_cles: [coordonnées, milieu, quadrilatères]
  noeuds: [v-espace]
  notions: [couple]
  page_enonce: 5
  page_corrige: 7
  enonce: |
    *On rappelle le critère du cours : $ABCD$ est un parallélogramme si et seulement si les diagonales $[AC]$ et $[BD]$ ont le même milieu.*

    **1.** Le quadrilatère $ABCD$ est-il un parallélogramme, avec $A(-2\,;1)$, $B(1\,;3)$, $C(3\,;0)$ et $D(0\,;-2)$ ?

    **2.** Même question avec $A(1\,;2)$, $B(4\,;3)$, $C(5\,;0)$ et $D(2\,;1)$.

    **3.** On donne $A(-1\,;3)$, $B(2\,;5)$ et $C(4\,;1)$. Déterminer les coordonnées du point $D$ tel que $ABCD$ soit un parallélogramme.

    **4.** Toujours avec les mêmes points $A$, $B$ et $C$, déterminer les coordonnées des points $E$ et $F$ tels que $ABEC$ et $AFBC$ soient des parallélogrammes.

    **5.** Combien existe-t-il de points permettant de former un parallélogramme avec trois points donnés non alignés ?
  corrige: |
    **1.** Milieu de $[AC]$ : $\left(\dfrac{-2+3}{2}\,;\dfrac{1+0}{2}\right)=(0{,}5\,;0{,}5)$.

    Milieu de $[BD]$ : $\left(\dfrac{1+0}{2}\,;\dfrac{3-2}{2}\right)=(0{,}5\,;0{,}5)$.

    Les deux milieux coïncident : $\boxed{ABCD \text{ est un parallélogramme.}}$

    **2.** Milieu de $[AC]$ : $(3\,;1)$ ; milieu de $[BD]$ : $(3\,;2)$.

    Les deux milieux diffèrent : $\boxed{ABCD \text{ n'est pas un parallélogramme.}}$

    **3.** Le milieu de $[AC]$ vaut $\left(\dfrac{-1+4}{2}\,;\dfrac{3+1}{2}\right)=(1{,}5\,;2)$. Il doit être aussi le milieu de $[BD]$ : 
    $$\frac{2+x_{D}}{2}=1{,}5 \iff x_{D}=1 \qquad ; \qquad \frac{5+y_{D}}{2}=2 \iff y_{D}=-1$$

    $$\boxed{D(1\,;-1)}$$

    **4.** **Pour $ABEC$**, les diagonales sont $[AE]$ et $[BC]$. Le milieu de $[BC]$ vaut $(3\,;3)$, d'où $E=\boxed{(7\,;3)}$.

    **Pour $AFBC$**, les diagonales sont $[AB]$ et $[FC]$. Le milieu de $[AB]$ vaut $(0{,}5\,;4)$, d'où $F=\boxed{(-3\,;7)}$.

    **5.** Trois points non alignés étant donnés, chacun des trois peut jouer le rôle du sommet « opposé » au quatrième : 
    $$\boxed{\text{il existe exactement } 3 \text{ points possibles.}}$$
     Ici ce sont $D(1\,;-1)$, $E(7\,;3)$ et $F(-3\,;7)$.
- id: "s-05-13"
  feuille: "f-s-05"
  numero: 13
  partie: "Milieu d'un segment"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [repères, coordonnées, milieu, quadrilatères]
  noeuds: [v-espace]
  notions: [couple]
  page_enonce: 6
  page_corrige: 7
  enonce: |
    Le plan est muni d'un repère. On donne les points 
    $$A(-4\,;2) \qquad B(2\,;6) \qquad C(6\,;-2) \qquad D(2\,;-4)$$

    **1.** Déterminer les coordonnées des milieux $I$ de $[AB]$, $J$ de $[BC]$, $K$ de $[CD]$ et $L$ de $[DA]$.

    **2.** Le quadrilatère $ABCD$ est-il un parallélogramme ?

    **3.** Le quadrilatère $IJKL$ est-il un parallélogramme ? Justifier à l'aide du critère des diagonales.

    **4.** Ce résultat vous semble-t-il dépendre du choix des quatre points de départ ?
  corrige: |
    **1.** $I=\left(\dfrac{-4+2}{2}\,;\dfrac{2+6}{2}\right)=\boxed{(-1\,;4)}$ $J=\left(\dfrac{2+6}{2}\,;\dfrac{6-2}{2}\right)=\boxed{(4\,;2)}$

    $K=\left(\dfrac{6+2}{2}\,;\dfrac{-2-4}{2}\right)=\boxed{(4\,;-3)}$ $L=\left(\dfrac{2-4}{2}\,;\dfrac{-4+2}{2}\right)=\boxed{(-1\,;-1)}$

    **2.** Milieu de $[AC]$ : $(1\,;0)$ ; milieu de $[BD]$ : $(2\,;1)$. Les deux milieux sont différents : 
    $$\boxed{ABCD \text{ n'est pas un parallélogramme.}}$$

    **3.** Milieu de $[IK]$ : $\left(\dfrac{-1+4}{2}\,;\dfrac{4-3}{2}\right)=(1{,}5\,;0{,}5)$.

    Milieu de $[JL]$ : $\left(\dfrac{4-1}{2}\,;\dfrac{2-1}{2}\right)=(1{,}5\,;0{,}5)$. 
    $$\boxed{IJKL \text{ est un parallélogramme.}}$$

    **4.** Non, le résultat ne dépend pas des points choisis. C'est un théorème général : **en joignant les milieux des côtés d'un quadrilatère quelconque, on obtient toujours un parallélogramme.** L'exemple est d'ailleurs frappant ici, puisque le quadrilatère de départ, lui, n'en était pas un.
- id: "s-05-14"
  feuille: "f-s-05"
  numero: 14
  partie: "Milieu d'un segment"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [repères, coordonnées, milieu, distance, quadrilatères, symétrique]
  noeuds: [v-espace, gd-normes]
  notions: [couple, norme]
  page_enonce: 6
  page_corrige: 8
  enonce: |
    La figure ci-dessous est composée de deux carrés accolés $ABCD$ et $CBKJ$, et d'un trapèze $EHGF$. La droite $(BC)$ est un axe de symétrie de la figure. Les segments portant le même codage ont la même longueur, et les segments $[DF]$ et $[JG]$ sont perpendiculaires à $(EH)$.

    ![Figure](documents/figures/e0857d49b3038628.svg)

    On se place dans le repère $\left(C\,;I,B\right)$.

    **1.** Justifier que $\left(C\,;I,B\right)$ est bien un repère du plan. Est-il orthogonal ? Est-il orthonormé ? *On observera attentivement les longueurs $CI$ et $CB$.*

    **2.** Donner les coordonnées des onze points $A$, $B$, $C$, $D$, $E$, $F$, $G$, $H$, $I$, $J$ et $K$.

    **3.** Calculer les coordonnées du milieu $M$ de $[EF]$.

    **4.** Calculer les coordonnées du milieu $N$ de $[GH]$.

    **5.** Vérifier que $M$ et $N$ sont symétriques par rapport à la droite $(BC)$. Que peut-on dire plus généralement de deux points symétriques par rapport à cet axe ?

    **6.** Un élève veut calculer la longueur $EH$ à l'aide de la formule de distance. A-t-il le droit de le faire dans ce repère ? Justifier.
  corrige: |
    **1.** Les points $C$, $I$ et $B$ ne sont pas alignés : c'est bien un repère. Les droites $(CI)$ et $(CB)$ portent deux côtés du carré $CBKJ$, elles sont donc perpendiculaires : le repère est **orthogonal**. En revanche, les codages montrent que 
    $$CI=CJ+JI=2\times DC \qquad\text{alors que}\qquad CB=DC$$

    $$\boxed{CI=2\,CB \text{ : le repère n'est pas orthonormé.}}$$

    **2.** Une unité d'abscisse vaut $CI$, soit *deux* côtés de carré, tandis qu'une unité d'ordonnée vaut $CB$, soit *un* côté. Les abscisses comportent donc des demis :

    • $A(-0{,}5\,;1)$

    • $B(0\,;1)$

    • $C(0\,;0)$

    • $D(-0{,}5\,;0)$

    • $E(-1{,}5\,;0)$

    • $F(-0{,}5\,;-1)$

    • $G(0{,}5\,;-1)$

    • $H(1{,}5\,;0)$

    • $I(1\,;0)$

    • $J(0{,}5\,;0)$

    • $K(0{,}5\,;1)$

    *Comment obtient-on $E$ et $H$ ?* Les codages donnent $CJ=JI=IH=DC$, donc $CH$ vaut trois côtés de carré, soit $1{,}5$ unité. Et comme $(BC)$ est un axe de symétrie, $E$ est le symétrique de $H$, d'où $E(-1{,}5\,;0)$.

    **3.** $M=\left(\dfrac{-1{,}5+(-0{,}5)}{2}\,;\dfrac{0+(-1)}{2}\right)=\boxed{(-1\,;-0{,}5)}$

    **4.** $N=\left(\dfrac{0{,}5+1{,}5}{2}\,;\dfrac{-1+0}{2}\right)=\boxed{(1\,;-0{,}5)}$

    **5.** Les points $M(-1\,;-0{,}5)$ et $N(1\,;-0{,}5)$ ont des **abscisses opposées** et la **même ordonnée**.

    L'axe $(BC)$ étant l'axe des ordonnées du repère, cela signifie exactement que $M$ et $N$ sont symétriques par rapport à lui. 
    $$\boxed{\text{Deux points symétriques par rapport à } (BC) \text{ ont des abscisses opposées et la même ordonnée.}}$$

    **6.** Non. La formule de la distance exige un repère orthonormé, or celui-ci ne l'est pas : les unités diffèrent sur les deux axes. 
    $$\boxed{\text{Le calcul est interdit dans ce repère.}}$$
     *On peut cependant conclure autrement :* $EH$ vaut six côtés de carré, d'après les codages et la symétrie.
- id: "s-05-15"
  feuille: "f-s-05"
  numero: 15
  partie: "Distance entre deux points"
  etoiles: 1
  types: [Calcul]
  mots_cles: [repères, distance]
  noeuds: [v-espace, gd-normes]
  notions: [norme]
  page_enonce: 7
  page_corrige: 9
  enonce: |
    *Dans tout cet exercice, le plan est muni d'un repère **orthonormé**.*

    Calculer la distance $AB$ dans chacun des cas suivants. On donnera la valeur exacte.

    **a)** $A(1\,;2)$ et $B(4\,;6)$

    **b)** $A(-1\,;2)$ et $B(3\,;5)$

    **c)** $A(0\,;0)$ et $B(5\,;12)$

    **d)** $A(2\,;-3)$ et $B(-4\,;5)$

    **e)** $A(1\,;1)$ et $B(4\,;1)$

    **f)** $A(-2\,;3)$ et $B(-2\,;-4)$

    **g)** $A(0\,;0)$ et $B(1\,;1)$

    **h)** $A(-3\,;-1)$ et $B(2\,;4)$

    **i)** $A(1\,;-2)$ et $B(6\,;10)$

    **j)** $A(-5\,;2)$ et $B(3\,;-4)$

    Pour les questions e) et f), retrouver le résultat sans utiliser la formule.
  corrige: |
    *On applique $AB=\sqrt{(x_{B}-x_{A})^{2}+(y_{B}-y_{A})^{2}}$.* Détaillons la première : 
    $$AB=\sqrt{(4-1)^{2}+(6-2)^{2}}=\sqrt{9+16}=\sqrt{25}=5$$

    **a)** $\sqrt{9+16}=\boxed{5}$

    **b)** $\sqrt{16+9}=\boxed{5}$

    **c)** $\sqrt{25+144}=\boxed{13}$

    **d)** $\sqrt{36+64}=\boxed{10}$

    **e)** $\sqrt{9+0}=\boxed{3}$

    **f)** $\sqrt{0+49}=\boxed{7}$

    **g)** $\sqrt{1+1}=\boxed{\sqrt{2}}$

    **h)** $\sqrt{25+25}=\sqrt{50}=\boxed{5\sqrt{2}}$

    **i)** $\sqrt{25+144}=\boxed{13}$

    **j)** $\sqrt{64+36}=\boxed{10}$

    **Sans la formule.** Question e) : $A$ et $B$ ont la même ordonnée, le segment est horizontal et sa longueur est l'écart des abscisses, soit $4-1=3$. Question f) : $A$ et $B$ ont la même abscisse, le segment est vertical et sa longueur vaut $3-(-4)=7$.
- id: "s-05-16"
  feuille: "f-s-05"
  numero: 16
  partie: "Distance entre deux points"
  etoiles: 1
  types: [Calcul]
  mots_cles: [repères, distance, quadrilatères]
  noeuds: [v-espace, gd-normes]
  notions: [norme]
  page_enonce: 7
  page_corrige: 9
  enonce: |
    Dans un repère orthonormé, déterminer la nature précise de chacun des triangles suivants. On calculera à chaque fois les trois longueurs, en les laissant sous forme de racines carrées.

    **1.** $A(0\,;0)$, $B(6\,;0)$ et $C(3\,;5)$

    **2.** $A(0\,;0)$, $B(4\,;0)$ et $C(4\,;3)$

    **3.** $A(-1\,;0)$, $B(3\,;2)$ et $C(1\,;-4)$

    **4.** $A(1\,;1)$, $B(5\,;2)$ et $C(2\,;6)$
  corrige: |
    *On calcule les trois longueurs et l'on compare. On garde les racines carrées : arrondir empêcherait toute comparaison exacte.*

    **1.** $AB=\sqrt{36+0}=6$, $AC=\sqrt{9+25}=\sqrt{34}$, $BC=\sqrt{9+25}=\sqrt{34}$.

    Deux côtés sont égaux : $\boxed{ABC \text{ est isocèle en } C.}$

    Il n'est pas rectangle : $AC^{2}+BC^{2}=68$ alors que $AB^{2}=36$, et le plus grand côté est $\sqrt{34}$, pour lequel $34\neq 36+34$.

    **2.** $AB=\sqrt{16}=4$, $BC=\sqrt{0+9}=3$, $AC=\sqrt{16+9}=5$.

    Le plus grand côté est $[AC]$, et $AB^{2}+BC^{2}=16+9=25=AC^{2}$ : 
    $$\boxed{ABC \text{ est rectangle en } B \text{ (et non isocèle).}}$$

    **3.** $AB=\sqrt{16+4}=\sqrt{20}$, $AC=\sqrt{4+16}=\sqrt{20}$, $BC=\sqrt{4+36}=\sqrt{40}$.

    On a $AB=AC$, et $AB^{2}+AC^{2}=20+20=40=BC^{2}$ : 
    $$\boxed{ABC \text{ est rectangle isocèle en } A.}$$

    **4.** $AB=\sqrt{16+1}=\sqrt{17}$, $AC=\sqrt{1+25}=\sqrt{26}$, $BC=\sqrt{9+16}=5$.

    Les trois longueurs sont différentes, et $AB^{2}+BC^{2}=17+25=42\neq 26$ : 
    $$\boxed{ABC \text{ est un triangle quelconque.}}$$
- id: "s-05-17"
  feuille: "f-s-05"
  numero: 17
  partie: "Distance entre deux points"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [distance, quadrilatères]
  noeuds: [gd-normes]
  notions: [norme]
  page_enonce: 7
  page_corrige: 10
  enonce: |
    *Pour montrer qu'un triangle est rectangle, on compare le carré du plus grand côté à la somme des carrés des deux autres : c'est la réciproque du théorème de Pythagore. On travaillera donc directement sur les **carrés** des longueurs, ce qui évite les racines.*

    **1.** Montrer que le triangle $ABC$ est rectangle, avec $A(1\,;-1)$, $B(5\,;1)$ et $C(3\,;5)$. Préciser en quel sommet.

    **2.** Même question avec $A(-2\,;2)$, $B(4\,;0)$ et $C(0\,;8)$.

    **3.** Le triangle $ABC$ avec $A(0\,;1)$, $B(3\,;2)$ et $C(1\,;5)$ est-il rectangle ?

    **4.** Calculer l'aire du triangle de la question 1.
  corrige: |
    **1.** $AB^{2}=16+4=20$, $BC^{2}=4+16=20$, $AC^{2}=4+36=40$.

    Le plus grand carré est $AC^{2}=40$, et $AB^{2}+BC^{2}=20+20=40$ : 
    $$\boxed{ABC \text{ est rectangle en } B \text{ (et même isocèle).}}$$

    **2.** $AB^{2}=36+4=40$, $AC^{2}=4+36=40$, $BC^{2}=16+64=80$.

    On a $AB^{2}+AC^{2}=80=BC^{2}$ : $\boxed{ABC \text{ est rectangle isocèle en } A.}$

    **3.** $AB^{2}=9+1=10$, $AC^{2}=1+16=17$, $BC^{2}=4+9=13$.

    Le plus grand carré est $17$, et $10+13=23\neq 17$ : 
    $$\boxed{ABC \text{ n'est pas rectangle.}}$$

    **4.** Le triangle de la question 1 est rectangle en $B$, ses côtés de l'angle droit mesurent $AB=BC=\sqrt{20}$ : 
    $$\text{Aire}=\frac{AB\times BC}{2}=\frac{\sqrt{20}\times\sqrt{20}}{2}=\frac{20}{2}=\boxed{10}$$
     *On remarque que* travailler sur les carrés des longueurs évite toute racine carrée jusqu'au bout : c'est plus rapide et plus sûr.
- id: "s-05-18"
  feuille: "f-s-05"
  numero: 18
  partie: "Distance entre deux points"
  etoiles: 2
  types: [Calcul]
  mots_cles: [coordonnées, distance, cercle et médiatrice]
  noeuds: [v-espace, gd-normes]
  notions: [couple, norme]
  page_enonce: 7
  page_corrige: 10
  enonce: |
    **1.** On donne $A(2\,;1)$ et le cercle $\mathcal{C}$ de centre $A$ et de rayon $5$. Parmi les points $B(5\,;5)$, $C(-1\,;5)$, $D(6\,;4)$ et $E(0\,;0)$, lesquels appartiennent à $\mathcal{C}$ ?

    **2.** Déterminer les coordonnées des points de l'axe des abscisses situés à une distance $5$ du point $F(3\,;4)$.

    **3.** Déterminer les coordonnées des points de l'axe des ordonnées équidistants de $G(-2\,;1)$ et $H(4\,;3)$.

    **4.** Le point $K(4\,;1)$ est-il équidistant de $L(1\,;2)$ et $M(5\,;4)$ ? Que peut-on en déduire pour $K$ ?
  corrige: |
    **1.** Un point appartient au cercle si sa distance au centre $A$ vaut exactement $5$, donc si le carré de cette distance vaut $25$ : 
    $$AB^{2}=9+16=25 \qquad AC^{2}=9+16=25 \qquad AD^{2}=16+9=25 \qquad AE^{2}=4+1=5$$
     Les trois premiers valent bien $25$, le dernier non. 
    $$\boxed{B,\ C \text{ et } D \text{ appartiennent à } \mathcal{C} \text{ ; } E \text{ non.}}$$

    **2.** Un point de l'axe des abscisses s'écrit $M(x\,;0)$. La condition $FM=5$ s'écrit : 
    $$(x-3)^{2}+(0-4)^{2}=25 \iff (x-3)^{2}+16=25 \iff (x-3)^{2}=9$$
     d'où $x-3=3$ ou $x-3=-3$ : 
    $$\boxed{(6\,;0) \quad\text{et}\quad (0\,;0)}$$

    **3.** Un point de l'axe des ordonnées s'écrit $M(0\,;y)$. La condition $GM=HM$ s'écrit, en passant aux carrés : 
    $$4+(y-1)^{2}=16+(y-3)^{2} \iff 4+y^{2}-2y+1=16+y^{2}-6y+9$$

    $$\iff -2y+5=-6y+25 \iff 4y=20 \iff y=5$$

    $$\boxed{(0\,;5)}$$
     *Vérification :* $\sqrt{4+16}=\sqrt{20}$ des deux côtés.

    **4.** $KL^{2}=9+1=10$ et $KM^{2}=1+9=10$, donc $KL=KM$ : 
    $$\boxed{K \text{ est équidistant de } L \text{ et } M \text{ : il appartient à la médiatrice de } [LM].}$$
- id: "s-05-19"
  feuille: "f-s-05"
  numero: 19
  partie: "Distance entre deux points"
  etoiles: 2
  types: [Calcul]
  mots_cles: [milieu, distance]
  noeuds: [v-espace, gd-normes]
  notions: [norme]
  page_enonce: 8
  page_corrige: 11
  enonce: |
    Dans chaque cas, déterminer la nature précise du quadrilatère $ABCD$. On commencera par comparer les milieux des diagonales, puis on calculera les longueurs utiles.

    **1.** $A(-2\,;1)$, $B(1\,;3)$, $C(3\,;0)$ et $D(0\,;-2)$

    **2.** $A(0\,;0)$, $B(4\,;2)$, $C(3\,;4)$ et $D(-1\,;2)$

    **3.** $A(1\,;1)$, $B(5\,;2)$, $C(6\,;5)$ et $D(2\,;4)$
  corrige: |
    **1.** Milieux des diagonales : $[AC]$ donne $(0{,}5\,;0{,}5)$ et $[BD]$ aussi : c'est un parallélogramme. Les quatre côtés valent tous $\sqrt{13}$, c'est donc un losange. Enfin $AC=\sqrt{26}$ et $BD=\sqrt{26}$ : les diagonales sont égales. 
    $$\boxed{ABCD \text{ est un carré.}}$$

    **2.** Milieux des diagonales : $(1{,}5\,;2)$ des deux côtés, c'est un parallélogramme. On a $AB^{2}=20$ et $BC^{2}=5$ : les côtés consécutifs diffèrent, ce n'est pas un losange. En revanche $AC^{2}=25$ et $BD^{2}=25$ : 
    $$\boxed{ABCD \text{ est un rectangle (non carré).}}$$

    **3.** Milieux des diagonales : $(3{,}5\,;3)$ des deux côtés, c'est un parallélogramme. Mais $AB^{2}=17$ et $BC^{2}=10$ (pas un losange), et $AC^{2}=41$ tandis que $BD^{2}=13$ (pas un rectangle) : 
    $$\boxed{ABCD \text{ est un parallélogramme quelconque.}}$$
- id: "s-05-20"
  feuille: "f-s-05"
  numero: 20
  partie: "Applications Python"
  etoiles: 1
  types: [Algorithmique]
  mots_cles: [repères, coordonnées, milieu, distance, quadrilatères, symétrique]
  noeuds: [v-espace, gd-normes]
  notions: [couple, norme]
  page_enonce: 8
  page_corrige: 11
  enonce: |
    On donne la fonction suivante :

    ```python
    def milieu(xA, yA, xB, yB):
        xM = (xA + xB) / 2
        yM = (yA + yB) / 2
        return xM, yM
    ```

    **1.** Que renvoie l'appel `milieu(-2, 5, 6, 1)` ?

    **2.** Écrire une fonction `distance(xA, yA, xB, yB)` qui renvoie la distance $AB$ dans un repère orthonormé. On n'oubliera pas d'importer la racine carrée.

    **3.** Que renvoie l'appel `distance(1, 2, 4, 6)` ?

    **4.** Recopier et compléter la fonction suivante, qui renvoie les coordonnées du symétrique du point $A$ par rapport au point $M$ :

    ```python
    def symetrique(xA, yA, xM, yM):
        xB = ...
        yB = ...
        return xB, yB
    ```

    **5.** Tester cette fonction sur la question 1 de l'exercice 11.
  corrige: |
    **1.** Le programme calcule $\dfrac{-2+6}{2}=2$ et $\dfrac{5+1}{2}=3$ : 
    $$\boxed{\texttt{milieu(-2, 5, 6, 1)} \text{ renvoie } \texttt{(2.0, 3.0)}}$$
     *Python affiche $2.0$ et non $2$ :* la division `/` produit toujours un nombre décimal.

    **2.** 

    ```python
    from math import sqrt

    def distance(xA, yA, xB, yB):
        return sqrt((xB - xA)**2 + (yB - yA)**2)
    ```

    **3.** $\sqrt{(4-1)^{2}+(6-2)^{2}}=\sqrt{25}=5$, donc $\boxed{\texttt{distance(1, 2, 4, 6)} \text{ renvoie } \texttt{5.0}}$

    **4.** Le symétrique vérifie $x_{B}=2x_{M}-x_{A}$ et $y_{B}=2y_{M}-y_{A}$ : 

    ```python
    def symetrique(xA, yA, xM, yM):
        xB = 2*xM - xA
        yB = 2*yM - yA
        return xB, yB
    ```

    **5.** L'appel `symetrique(3, -2, 1, 4)` renvoie `(-1, 10)`, ce qui confirme le résultat trouvé à la main.
- id: "s-05-21"
  feuille: "f-s-05"
  numero: 21
  partie: "Applications Python"
  etoiles: 2
  types: [Algorithmique]
  mots_cles: [distance, quadrilatères]
  noeuds: [gd-normes]
  notions: [norme]
  page_enonce: 8
  page_corrige: 11
  enonce: |
    On donne la fonction suivante, qui teste si un triangle est isocèle :

    ```python
    from math import sqrt

    def distance(xA, yA, xB, yB):
        return sqrt((xB - xA)**2 + (yB - yA)**2)

    def est_isocele(xA, yA, xB, yB, xC, yC):
        AB = distance(xA, yA, xB, yB)
        AC = distance(xA, yA, xC, yC)
        BC = distance(xB, yB, xC, yC)
        if AB == AC or AB == BC or AC == BC:
            return True
        else:
            return False
    ```

    **1.** Que renvoie l'appel `est_isocele(0, 0, 6, 0, 3, 5)` ?

    **2.** Tester la fonction sur les quatre triangles de l'exercice 16.

    **3.** Le test `AB == AC` porte sur des valeurs approchées. Expliquer pourquoi ce programme peut parfois répondre `False` alors que le triangle est bel et bien isocèle.

    **4.** Écrire une fonction `est_rectangle` qui teste si un triangle est rectangle. On travaillera sur les **carrés** des longueurs, afin d'éviter toute racine carrée : pourquoi est-ce plus fiable ?
  corrige: |
    **1.** Le triangle a pour côtés $6$, $\sqrt{34}$ et $\sqrt{34}$ : il est isocèle, donc 
    $$\boxed{\texttt{est\_isocele(0, 0, 6, 0, 3, 5)} \text{ renvoie } \texttt{True}}$$

    **2.** En reprenant les quatre triangles de l'exercice 16 : 
    $$\boxed{\texttt{True} \qquad \texttt{False} \qquad \texttt{True} \qquad \texttt{False}}$$
     Seuls les triangles 1 et 3 sont isocèles.

    **3.** La fonction `sqrt` ne renvoie qu'une **valeur approchée**. Deux longueurs théoriquement égales, comme $\sqrt{34}$ et $\sqrt{34}$, peuvent être calculées par deux chemins différents et différer de très peu dans la mémoire de la machine — par exemple $5{,}830951894845301$ et $5{,}830951894845300$. Le test `AB == AC` renvoie alors `False` alors que le triangle est bel et bien isocèle.

    **4.** On compare les carrés des longueurs, qui sont des entiers lorsque les coordonnées le sont : 

    ```python
    def carre_distance(xA, yA, xB, yB):
        return (xB - xA)**2 + (yB - yA)**2

    def est_rectangle(xA, yA, xB, yB, xC, yC):
        AB = carre_distance(xA, yA, xB, yB)
        AC = carre_distance(xA, yA, xC, yC)
        BC = carre_distance(xB, yB, xC, yC)
        if AB + AC == BC or AB + BC == AC or AC + BC == AB:
            return True
        else:
            return False
    ```

     *Pourquoi est-ce plus fiable ?* Aucune racine carrée n'apparaît : tous les calculs se font sur des entiers, que la machine manipule de façon **exacte**. Le test d'égalité est alors parfaitement sûr.
- id: "s-05-22"
  feuille: "f-s-05"
  numero: 22
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [QCM, Démonstration, Calcul]
  mots_cles: [repères, coordonnées, milieu, distance, quadrilatères, Python]
  noeuds: [v-espace, gd-normes]
  notions: [couple, norme]
  page_enonce: 9
  page_corrige: 12
  enonce: |
    Pour chaque question, une seule réponse est exacte. Déterminer laquelle et justifier.

    ```tableau
     ¦ Réponse A ¦ Réponse B ¦ Réponse C
    1. Le milieu de $[AB]$, avec $A(2\,;5)$ et $B(6\,;1)$, est ¦ $(4\,;3)$ ¦ $(8\,;6)$ ¦ $(2\,;-2)$
    2. Si $M(3\,;1)$ est le milieu de $[AB]$ et $A(1\,;-2)$, alors $B$ a pour coordonnées ¦ $(2\,;3)$ ¦ $(5\,;4)$ ¦ $(4\,;-1)$
    3. La distance entre $A(0\,;0)$ et $B(3\,;4)$ vaut ¦ $5$ ¦ $7$ ¦ $25$
    4. La formule de la distance est valable ¦ dans tout repère ¦ dans un repère orthogonal ¦ dans un repère orthonormé
    5. La formule du milieu est valable ¦ dans tout repère ¦ seulement si le repère est orthonormé ¦ seulement si le repère est orthogonal
    6. Le point de coordonnées $(0\,;-3)$ est situé ¦ sur l'axe des abscisses ¦ sur l'axe des ordonnées ¦ en dehors des deux axes
    7. $ABCD$ est un parallélogramme si et seulement si ¦ $[AB]$ et $[CD]$ ont le même milieu ¦ $[AC]$ et $[BD]$ ont le même milieu ¦ $AB=CD$
    8. Le triangle $A(0\,;0)$, $B(4\,;0)$, $C(0\,;3)$ est ¦ isocèle ¦ rectangle en $A$ ¦ équilatéral
    ```
  corrige: |
    **1.** **Réponse A.** $\left(\dfrac{2+6}{2}\,;\dfrac{5+1}{2}\right)=(4\,;3)$. La réponse B additionne les coordonnées sans diviser par $2$.

    **2.** **Réponse B.** De $\dfrac{1+x_{B}}{2}=3$ on tire $x_{B}=5$, et de $\dfrac{-2+y_{B}}{2}=1$ on tire $y_{B}=4$.

    **3.** **Réponse A.** $\sqrt{3^{2}+4^{2}}=\sqrt{25}=5$. La réponse C oublie la racine carrée.

    **4.** **Réponse C.** La démonstration utilise le théorème de Pythagore : il faut un angle droit entre les axes, et la même unité sur les deux.

    **5.** **Réponse A.** La formule du milieu ne fait intervenir ni longueur ni angle.

    **6.** **Réponse B.** Son abscisse est nulle, il est donc sur l'axe des ordonnées.

    **7.** **Réponse B.** C'est le critère du cours : les *diagonales* ont le même milieu. La réponse A concerne deux côtés opposés, et donnerait un quadrilatère croisé.

    **8.** **Réponse B.** $AB=4$, $AC=3$ et $BC=\sqrt{16+9}=5$, et $16+9=25$ : le triangle est rectangle en $A$. Il n'est ni isocèle ni équilatéral.
- id: "s-05-23"
  feuille: "f-s-05"
  numero: 23
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux]
  mots_cles: [repères, coordonnées, milieu, distance]
  noeuds: [v-espace, gd-normes]
  notions: [couple, norme]
  page_enonce: 9
  page_corrige: 12
  enonce: |
    Pour chacune des affirmations suivantes, dire si elle est vraie ou fausse. Si elle est fausse, donner un contre-exemple ou l'énoncé correct.

    **1.** Dans n'importe quel repère, les coordonnées du milieu de $[AB]$ sont les moyennes des coordonnées de $A$ et de $B$.

    **2.** Dans n'importe quel repère, $AB=\sqrt{(x_{B}-x_{A})^{2}+(y_{B}-y_{A})^{2}}$.

    **3.** Dans n'importe quel repère, le point $I$ a pour coordonnées $(1\,;0)$.

    **4.** Un même point peut avoir deux couples de coordonnées différents dans un même repère.

    **5.** Si $AB=AC$, alors le triangle $ABC$ est isocèle en $A$.

    **6.** Si $AB^{2}+AC^{2}=BC^{2}$, alors le triangle $ABC$ est rectangle en $A$.

    **7.** Un point conserve les mêmes coordonnées lorsque l'on change de repère.

    **8.** Le point $(3\,;1)$ et le point $(1\,;3)$ sont confondus.
  corrige: |
    **1.** **Vraie**. C'est la propriété 1 du cours, valable dans n'importe quel repère.

    **2.** **Fausse**. Cette formule exige un repère **orthonormé**. *Contre-exemple :* dans le repère de l'exercice 3, les deux axes n'ont pas la même unité et le calcul n'a aucun sens.

    **3.** **Vraie**. Le point $I$ est celui qui *définit* l'unité sur l'axe des abscisses : ses coordonnées sont $(1\,;0)$ par construction, dans tout repère.

    **4.** **Fausse**. Le cours précise que tout point est repéré par un **unique** couple. Dans un repère donné, les coordonnées d'un point sont uniques.

    **5.** **Vraie**. C'est la définition d'un triangle isocèle en $A$ : les deux côtés issus de $A$ ont la même longueur.

    **6.** **Vraie**. C'est la réciproque du théorème de Pythagore. *Attention à l'ordre :* c'est le côté $[BC]$, opposé au sommet $A$, dont le carré est la somme des deux autres.

    **7.** **Fausse**. C'est même tout le contraire. *Contre-exemple :* à l'exercice 5, le point $S$ a pour coordonnées $(0\,;3)$ dans le premier repère et $(-2\,;2)$ dans le second, sans avoir bougé.

    **8.** **Fausse**. Le premier a pour abscisse $3$ et pour ordonnée $1$, le second l'inverse : ce sont deux points distincts. L'ordre des coordonnées est essentiel.
- id: "s-05-24"
  feuille: "f-s-05"
  numero: 24
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Calcul]
  mots_cles: [repères, coordonnées, milieu, distance, quadrilatères]
  noeuds: [v-espace, gd-normes]
  notions: [couple, norme]
  page_enonce: 10
  page_corrige: 13
  enonce: |
    Le plan est muni d'un repère orthonormé. On donne les points 
    $$A(-3\,;1) \qquad B(1\,;3) \qquad C(5\,;-1) \qquad D(1\,;-3)$$

    **1.** Déterminer les coordonnées du milieu de $[AC]$, puis celles du milieu de $[BD]$. Que peut-on en déduire pour le quadrilatère $ABCD$ ?

    **2.** Calculer les longueurs $AB$ et $BC$. Le quadrilatère $ABCD$ est-il un losange ?

    **3.** Calculer les longueurs des diagonales $AC$ et $BD$. Le quadrilatère $ABCD$ est-il un rectangle ?

    **4.** Conclure sur la nature exacte de $ABCD$.

    **5.** Calculer le périmètre de $ABCD$. On donnera la valeur exacte, puis une valeur approchée au dixième.

    **6.** Le point $E(9\,;7)$ est-il tel que $B$ soit le milieu de $[AE]$ ? Justifier.
  corrige: |
    **1.** Milieu de $[AC]$ : $\left(\dfrac{-3+5}{2}\,;\dfrac{1-1}{2}\right)=(1\,;0)$.

    Milieu de $[BD]$ : $\left(\dfrac{1+1}{2}\,;\dfrac{3-3}{2}\right)=(1\,;0)$.

    Les deux diagonales ont le même milieu : 
    $$\boxed{ABCD \text{ est un parallélogramme, de centre } (1\,;0).}$$

    **2.** $AB=\sqrt{(1+3)^{2}+(3-1)^{2}}=\sqrt{16+4}=\sqrt{20}=2\sqrt{5}$

    $BC=\sqrt{(5-1)^{2}+(-1-3)^{2}}=\sqrt{16+16}=\sqrt{32}=4\sqrt{2}$

    Ces deux côtés consécutifs sont de longueurs différentes : 
    $$\boxed{ABCD \text{ n'est pas un losange.}}$$

    **3.** $AC=\sqrt{64+4}=\sqrt{68}$ et $BD=\sqrt{0+36}=6$.

    Or $\sqrt{68}\neq 6$ (puisque $6^{2}=36\neq 68$) : 
    $$\boxed{ABCD \text{ n'est pas un rectangle.}}$$

    **4.** $\boxed{ABCD \text{ est un parallélogramme quelconque.}}$

    **5.** Dans un parallélogramme, les côtés opposés ont la même longueur : 
    $$\mathcal{P}=2\left(AB+BC\right)=2\left(2\sqrt{5}+4\sqrt{2}\right) =\boxed{4\sqrt{5}+8\sqrt{2}\approx 20{,}3}$$

    **6.** Si $B$ était le milieu de $[AE]$, on aurait $\dfrac{-3+9}{2}=3$, or l'abscisse de $B$ vaut $1$ et non $3$. 
    $$\boxed{\text{Non, } B \text{ n'est pas le milieu de } [AE].}$$
- id: "s-05-25"
  feuille: "f-s-05"
  numero: 25
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Calcul]
  mots_cles: [repères, coordonnées, milieu, distance, cercle et médiatrice]
  noeuds: [v-espace, gd-normes]
  notions: [couple, norme]
  page_enonce: 10
  page_corrige: 14
  enonce: |
    Le plan est muni d'un repère orthonormé. On donne $A(1\,;2)$ et $B(5\,;4)$.

    **1.** Déterminer les coordonnées du milieu $I$ de $[AB]$, puis calculer la longueur $AB$.

    **2.** Le point $C(6\,;-1)$ est-il équidistant de $A$ et de $B$ ?

    **3.** Vérifier que le point $D(4\,;1)$ est équidistant de $A$ et de $B$.

    **4.** Déterminer les coordonnées du point de l'axe des abscisses équidistant de $A$ et de $B$.

    **5.** Les points $I$ et $D$ sont-ils tous deux équidistants de $A$ et de $B$ ? Que peut-on dire de la droite $(ID)$ ?
  corrige: |
    **1.** $I=\left(\dfrac{1+5}{2}\,;\dfrac{2+4}{2}\right)=\boxed{(3\,;3)}$ et $AB=\sqrt{16+4}=\sqrt{20}=\boxed{2\sqrt{5}}$

    **2.** $CA^{2}=(1-6)^{2}+(2+1)^{2}=25+9=34$ et $CB^{2}=(5-6)^{2}+(4+1)^{2}=1+25=26$. 
    $$\boxed{34\neq 26 \text{ : le point } C \text{ n'est pas équidistant de } A \text{ et } B.}$$

    **3.** $DA^{2}=(1-4)^{2}+(2-1)^{2}=9+1=10$ et $DB^{2}=(5-4)^{2}+(4-1)^{2}=1+9=10$. 
    $$\boxed{DA=DB=\sqrt{10} \text{ : le point } D \text{ est bien équidistant de } A \text{ et } B.}$$

    **4.** Un point de l'axe des abscisses s'écrit $M(x\,;0)$. On écrit $MA^{2}=MB^{2}$ : 
    $$(x-1)^{2}+4=(x-5)^{2}+16 \iff x^{2}-2x+1+4=x^{2}-10x+25+16$$

    $$\iff -2x+5=-10x+41 \iff 8x=36 \iff x=4{,}5$$

    $$\boxed{(4{,}5\,;0)}$$

    **5.** Les points $I$ et $D$ sont tous deux équidistants de $A$ et de $B$ — $I$ parce qu'il est le milieu de $[AB]$, $D$ d'après la question 3. 
    $$\boxed{(ID) \text{ est la médiatrice du segment } [AB].}$$
     *On remarque que* le point trouvé à la question 4 est lui aussi sur cette droite : les points équidistants de $A$ et $B$ forment bien une droite entière, et non quelques points isolés.
- id: "s-05-26"
  feuille: "f-s-05"
  numero: 26
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [repères, coordonnées, milieu, distance, quadrilatères, cercle et médiatrice]
  noeuds: [v-espace, gd-normes]
  notions: [couple, norme]
  page_enonce: 10
  page_corrige: 14
  enonce: |
    Le plan est muni d'un repère orthonormé $\left(O\,;I,J\right)$. On considère les points $A(4\,;0)$ et $B(0\,;2)$. On note $\Delta$ la médiatrice du segment $[IA]$. La perpendiculaire à l'axe des ordonnées passant par $B$ coupe la droite $\Delta$ en un point noté $H$.

    **1.** Faire une figure représentant le repère, les points $A$ et $B$, puis la droite $\Delta$ et le point $H$. *On prendra un repère allant de $-3$ à $5$ en abscisse et de $-3$ à $3$ en ordonnée.*

    **2.** Déterminer, en justifiant, les coordonnées du point $H$.

    *On rappelle que la médiatrice d'un segment lui est perpendiculaire et passe par son milieu.*

    **3.** On note $\mathcal{C}$ le cercle de centre $H$ passant par $I$. Démontrer que le point $A$ appartient à $\mathcal{C}$.

    **4.** Démontrer que l'axe des ordonnées est tangent en $B$ au cercle $\mathcal{C}$, c'est-à-dire qu'il coupe $\mathcal{C}$ en $B$ et qu'il est perpendiculaire au rayon $[HB]$ en ce point.

    **5.** Placer les points $D(-2\,;0)$ et $E(2\,;-2)$ sur la figure, puis démontrer que $ABDE$ est un parallélogramme.

    **6.** Le quadrilatère $ABDE$ est-il un losange ? Justifier par un calcul de longueurs.
  corrige: |
    **1.** Voici la figure complète.

    ![Figure](documents/figures/f8040adfa7237a20.svg)

    **2.** La médiatrice de $[IA]$ est perpendiculaire à $(IA)$ et passe par le milieu de $[IA]$. Comme $I(1\,;0)$ et $A(4\,;0)$ sont tous deux sur l'axe des abscisses, ce milieu vaut $\left(\dfrac{1+4}{2}\,;0\right)=(2{,}5\,;0)$, et $\Delta$ est la droite **verticale** passant par ce point : tous ses points ont pour abscisse $2{,}5$.

    La perpendiculaire à l'axe des ordonnées passant par $B(0\,;2)$ est la droite **horizontale** d'ordonnée $2$. Le point $H$ appartient aux deux : 
    $$\boxed{H(2{,}5\,;2)}$$

    **3.** Le rayon du cercle est $HI$. On calcule les deux distances : 
    $$HI^{2}=(1-2{,}5)^{2}+(0-2)^{2}=2{,}25+4=6{,}25 \qquad\text{donc}\qquad HI=2{,}5$$

    $$HA^{2}=(4-2{,}5)^{2}+(0-2)^{2}=2{,}25+4=6{,}25 \qquad\text{donc}\qquad HA=2{,}5$$

    $$\boxed{HA=HI \text{ : le point } A \text{ appartient au cercle } \mathcal{C}.}$$
     *C'était prévisible :* $H$ est sur la médiatrice de $[IA]$, donc équidistant de $I$ et de $A$.

    **4.** **$B$ appartient au cercle :** 
    $$HB^{2}=(0-2{,}5)^{2}+(2-2)^{2}=6{,}25 \qquad\text{donc}\qquad HB=2{,}5=\text{rayon}$$

    **Le rayon $[HB]$ est perpendiculaire à l'axe des ordonnées :** les points $H(2{,}5\,;2)$ et $B(0\,;2)$ ont la même ordonnée, donc $[HB]$ est horizontal, tandis que l'axe des ordonnées est vertical. 
    $$\boxed{\text{L'axe des ordonnées est tangent au cercle } \mathcal{C} \text{ au point } B.}$$

    **5.** Les diagonales de $ABDE$ sont $[AD]$ et $[BE]$ : 
    $$\text{milieu de } [AD] : \left(\dfrac{4-2}{2}\,;\dfrac{0+0}{2}\right)=(1\,;0)$$

    $$\text{milieu de } [BE] : \left(\dfrac{0+2}{2}\,;\dfrac{2-2}{2}\right)=(1\,;0)$$

    $$\boxed{ABDE \text{ est un parallélogramme, de centre } I.}$$

    **6.** $AB^{2}=(0-4)^{2}+(2-0)^{2}=16+4=20$ et $BD^{2}=(-2-0)^{2}+(0-2)^{2}=4+4=8$. 
    $$\boxed{20\neq 8 \text{ : } ABDE \text{ n'est pas un losange.}}$$
