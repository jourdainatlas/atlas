  enonce: |
    *Une formule de Viète.*

    **Partie A : radicaux itérés.** Pour tout entier $n\geqslant 1$, on note $u_{n}$ le nombre formé de $n$ radicaux : 
    $$u_{n}=\sqrt{2+\sqrt{2+\sqrt{2+\cdots+\sqrt{2}}}}$$
     de sorte que $u_{1}=\sqrt{2}$ et $u_{n+1}=\sqrt{2+u_{n}}$. En utilisant l'identité $1+\cos(2a)=2\cos^{2}(a)$, valable pour tout réel $a$, montrer que, pour tout entier $n\geqslant 1$, $u_{n}=2\cos\left(\dfrac{\pi}{2^{n+1}}\right)$.

    **Partie B : un produit de cosinus.** Soit $x$ un réel qui n'est pas un multiple entier de $\pi$. En utilisant la formule de duplication du sinus, $\sin(2a)=2\sin(a)\cos(a)$, simplifier, pour tout entier $n\geqslant 1$, le produit 
    $$P_{n}(x)=\cos\left(\frac{x}{2}\right)\times\cos\left(\frac{x}{4}\right)\times\cdots\times \cos\left(\frac{x}{2^{n}}\right)$$

    **Partie C : la formule.**

    **1.** Déterminer la limite de la suite $\left(P_{n}(x)\right)$.

    **2.** On pose, pour $n\geqslant 1$, $v_{n}=u_{1}\times u_{2}\times\cdots\times u_{n}$. Montrer que 
    $$\lim_{n\to+\infty}\frac{v_{n}}{2^{n}}=\frac{2}{\pi}$$
  corrige: |
    **Partie A.** Pour $n\geqslant 1$, notons $\mathcal{P}_{n}$ la propriété « $u_{n}=2\cos\left(\frac{\pi}{2^{n+1}}\right)$ ».

    **Initialisation :** $2\cos\left(\frac{\pi}{4}\right)=2\times\frac{\sqrt{2}}{2}=\sqrt{2}=u_{1}$.

    **Hérédité :** si $\mathcal{P}_{n}$ est vraie, alors, avec $1+\cos(2a)=2\cos^{2}(a)$ et $a=\frac{\pi}{2^{n+2}}$ : 
    $$u_{n+1}=\sqrt{2+2\cos\left(\frac{\pi}{2^{n+1}}\right)}=\sqrt{4\cos^{2}\left(\frac{\pi}{2^{n+2}} \right)}=2\left|\cos\left(\frac{\pi}{2^{n+2}}\right)\right|=2\cos\left(\frac{\pi}{2^{n+2}}\right)$$
     puisque $\frac{\pi}{2^{n+2}}\in\left]0\,;\frac{\pi}{2}\right[$, où le cosinus est positif.

    **Conclusion :** $\boxed{u_{n}=2\cos\left(\dfrac{\pi}{2^{n+1}}\right)}$ pour tout $n\geqslant 1$.

    **Partie B.** Montrons par récurrence que $2^{n}\sin\left(\frac{x}{2^{n}}\right) P_{n}(x)=\sin(x)$ pour tout $n\geqslant 1$. Pour $n=1$, c'est la formule de duplication $2\sin\left(\frac{x}{2}\right)\cos\left(\frac{x}{2}\right)=\sin(x)$. Si l'égalité est vraie au rang $n$, alors, comme $P_{n+1}(x)=P_{n}(x)\cos\left(\frac{x}{2^{n+1}}\right)$ et $2\sin\left(\frac{x}{2^{n+1}}\right)\cos\left(\frac{x}{2^{n+1}}\right)=\sin\left(\frac{x}{2^{n}} \right)$ : 
    $$2^{n+1}\sin\left(\frac{x}{2^{n+1}}\right)P_{n+1}(x)=2^{n}\sin\left(\frac{x}{2^{n}}\right) P_{n}(x)=\sin(x)$$
     Enfin, $\sin\left(\frac{x}{2^{n}}\right)\neq 0$, sans quoi $\frac{x}{2^{n}}$, donc $x$, serait un multiple de $\pi$. 
    $$\boxed{P_{n}(x)=\frac{\sin(x)}{2^{n}\sin\left(\frac{x}{2^{n}}\right)}}$$

    **Partie C**

    **1.** Posons $h=\frac{x}{2^{n}}$, qui tend vers $0$. Alors $2^{n}\sin\left(\frac{x}{2^{n}}\right) =x\times\frac{\sin(h)}{h}$ tend vers $x\times 1=x$, d'après la proposition 3 du cours. 
    $$\boxed{\lim_{n\to+\infty}P_{n}(x)=\frac{\sin(x)}{x}}$$

    **2.** D'après la partie A, $\frac{u_{k}}{2}=\cos\left(\frac{\pi}{2^{k+1}}\right) =\cos\left(\frac{\pi/2}{2^{k}}\right)$, donc $\frac{v_{n}}{2^{n}}=\frac{u_{1}}{2}\times\cdots\times\frac{u_{n}}{2}=P_{n}\left(\frac{\pi}{2} \right)$, et la question 1 donne 
    $$\boxed{\lim_{n\to+\infty}\frac{v_{n}}{2^{n}}=\frac{\sin(\pi/2)}{\pi/2}=\frac{2}{\pi}}$$

    *Vérification numérique :*

    $$\begin{array}{|c|c|c|c|c|c|} \hline n & 1 & 2 & 3 & 5 & 10 \\ \hline \dfrac{v_{n}}{2^{n}} & 0{,}707\,107 & 0{,}653\,281 & 0{,}640\,729 & 0{,}636\,876 & 0{,}636\,620 \\ \hline \end{array}$$

    alors que $\frac{2}{\pi}\approx 0{,}636\,620$ : la convergence est très rapide.

    *Remarque.* En écrivant le résultat sous la forme $\frac{2}{\pi}=\frac{\sqrt{2}}{2}\times\frac{\sqrt{2+\sqrt{2}}}{2}\times \frac{\sqrt{2+\sqrt{2+\sqrt{2}}}}{2}\times\cdots$, on obtient la formule publiée par Viète en 1593, l'une des premières expressions de $\pi$ comme limite d'un calcul infini.
