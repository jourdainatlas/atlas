  enonce: |
    *Les intégrales de Wallis.* Pour tout entier naturel $n$, on pose 
    $$W_{n}=\int_{0}^{\frac{\pi}{2}}\cos^{n}(t)\,\mathrm{d}t$$

    **1.** Calculer $W_{0}$ et $W_{1}$.

    **2.** À l'aide d'une intégration par parties, en écrivant $\cos^{n+2}(t)=\cos(t)\times\cos^{n+1}(t)$, montrer que, pour tout entier naturel $n$ : 
    $$W_{n+2}=\frac{n+1}{n+2}\,W_{n}$$

    **3.** En déduire que $W_{n}>0$ pour tout $n$, et exprimer $W_{2k}$ et $W_{2k+1}$ en fonction de $k$.

    **4.** Montrer que, pour tout entier naturel $n$, $W_{n+1}\leqslant W_{n}$.

    **5.** En utilisant la question 2, en déduire que $\dfrac{n+1}{n+2}\,W_{n}\leqslant W_{n+1}$.

    **6.** Déterminer la limite de $\dfrac{W_{n+1}}{W_{n}}$ lorsque $n$ tend vers $+\infty$.

    **7.** Conclure que 
    $$\left(\frac{2\times 4\times 6\times\cdots\times(2k)}{3\times 5\times 7\times\cdots\times(2k-1)} \right)^{2}\times\frac{1}{2k+1}\;\xrightarrow[k\to+\infty]{}\;\frac{\pi}{2}$$
  corrige: |
    **1.** $W_{0}=\displaystyle\int_{0}^{\pi/2}1\,\mathrm{d}t=\boxed{\frac{\pi}{2}}$ et $W_{1}=\Big[\sin(t)\Big]_{0}^{\pi/2}=\boxed{1}$.

    **2.** Posons $u(t)=\cos^{n+1}(t)$ et $v(t)=\sin(t)$ ; alors $u'(t)=-(n+1)\sin(t)\cos^{n}(t)$ et $v'(t)=\cos(t)$. Comme $u\left(\frac{\pi}{2}\right)=0$ et $v(0)=0$, le crochet est nul et 
    $$W_{n+2}=\int_{0}^{\pi/2}u(t)v'(t)\,\mathrm{d}t=-\int_{0}^{\pi/2}u'(t)v(t)\,\mathrm{d}t =(n+1)\int_{0}^{\pi/2}\sin^{2}(t)\cos^{n}(t)\,\mathrm{d}t$$
     Avec $\sin^{2}(t)=1-\cos^{2}(t)$ et la linéarité : $W_{n+2}=(n+1)\left(W_{n}-W_{n+2}\right)$, soit $(n+2)W_{n+2}=(n+1)W_{n}$. 
    $$\boxed{W_{n+2}=\frac{n+1}{n+2}\,W_{n}}$$

    **3.** Comme $W_{0}>0$, $W_{1}>0$ et que $W_{n+2}$ est le produit de $W_{n}$ par un nombre strictement positif, une récurrence de deux en deux montre que $W_{n}>0$ pour tout $n$. En appliquant la relation de proche en proche : 
    $$\boxed{W_{2k}=\frac{1\times 3\times\cdots\times(2k-1)}{2\times 4\times\cdots\times(2k)}\times \frac{\pi}{2}\qquad W_{2k+1}=\frac{2\times 4\times\cdots\times(2k)}{3\times 5\times\cdots\times(2k+1)}}$$
     Avec les factorielles du chapitre 7, $2\times 4\times\cdots\times(2k)=2^{k}k!$, et l'on obtient $W_{2k}=\binom{2k}{k}\frac{1}{4^{k}}\times\frac{\pi}{2}$ : le coefficient binomial central de l'exercice 34 du chapitre 7 apparaît.

    **4.** Sur $\left[0\,;\frac{\pi}{2}\right]$, $0\leqslant\cos(t)\leqslant 1$, donc $\cos^{n+1}(t)\leqslant\cos^{n}(t)$. En intégrant : $\boxed{W_{n+1}\leqslant W_{n}}$.

    **5.** La question 4 au rang $n+1$ donne $W_{n+2}\leqslant W_{n+1}$, c'est-à-dire, d'après la question 2 : 
    $$\boxed{\frac{n+1}{n+2}\,W_{n}\leqslant W_{n+1}}$$

    **6.** En divisant par $W_{n}>0$ : $\dfrac{n+1}{n+2}\leqslant\dfrac{W_{n+1}}{W_{n}}\leqslant 1$. Le membre de gauche tend vers $1$, et le théorème des gendarmes donne $\boxed{\dfrac{W_{n+1}}{W_{n}}\longrightarrow 1}$.

    **7.** D'après la question 3, en simplifiant les facteurs communs : 
    $$\frac{W_{2k+1}}{W_{2k}}=\frac{\big(2\times 4\times\cdots\times(2k)\big)^{2}} {\big(3\times 5\times\cdots\times(2k-1)\big)^{2}\times(2k+1)}\times\frac{2}{\pi}$$
     Ce quotient tend vers $1$ d'après la question 6, donc 
    $$\boxed{\left(\frac{2\times 4\times\cdots\times(2k)}{3\times 5\times\cdots\times(2k-1)}\right)^{2} \times\frac{1}{2k+1}\longrightarrow\frac{\pi}{2}}$$
     *Vérification numérique :* cette quantité vaut environ $1{,}533\,9$ pour $k=10$, $1{,}566\,9$ pour $k=100$ et $1{,}570\,4$ pour $k=1\,000$, alors que $\frac{\pi}{2}\approx 1{,}570\,8$.

    *Remarque.* Ce résultat, obtenu par Wallis au milieu du XVIIᵉ siècle, exprime $\pi$ à l'aide de seuls nombres entiers. La convergence est lente, à l'opposé de la formule de Viète de l'exercice 41. Combinée à la question 3, elle donne une estimation précise du coefficient binomial central, $\binom{2k}{k}\approx\frac{4^{k}}{\sqrt{\pi k}}$, bien plus fine que l'encadrement de l'exercice 34 du chapitre 7.

