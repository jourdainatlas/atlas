  enonce: |
    **1.** Soit $f$ la fonction définie sur $[0\,;2\pi]$ par $f(x)=3\sin(x)$.

    **(a)** Calculer $f'(x)$ et étudier son signe sur $[0\,;2\pi]$.

    **(b)** Dresser le tableau de variations de $f$ sur cet intervalle.

    **(c)** Tracer la courbe de $f$ sur $[0\,;2\pi]$, en prenant $1$ cm pour une unité en abscisse et $1$ cm pour une unité en ordonnée.

    **2.** Reprendre les trois questions pour la fonction $g$ définie sur $[0\,;2\pi]$ par $g(x)=1-2\cos(x)$.
  corrige: |
    **1.** **(a)** $f'(x)=3\cos(x)$, qui est du signe de $\cos(x)$ : positif sur $\left[0\,;\dfrac{\pi}{2}\right]$, négatif sur $\left[\dfrac{\pi}{2}\,;\dfrac{3\pi}{2}\right]$, positif sur $\left[\dfrac{3\pi}{2}\,;2\pi\right]$.

    **(b)**

