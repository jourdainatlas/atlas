- id: "t-09-01"
  feuille: "f-t-09"
  numero: 1
  partie: "Périodicité, parité et valeurs remarquables"
  etoiles: 1
  types: [Calcul]
  mots_cles: [cosinus et sinus, valeurs remarquables]
  noeuds: [cx-pi]
  notions: [pi]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Donner la valeur exacte de chacun des nombres suivants, en s'aidant du cercle trigonométrique.

    **a)** $\cos\left(\dfrac{\pi}{3}\right)$

    **b)** $\sin\left(\dfrac{\pi}{4}\right)$

    **c)** $\cos\left(\dfrac{2\pi}{3}\right)$

    **d)** $\sin\left(\dfrac{5\pi}{6}\right)$

    **e)** $\cos\left(-\dfrac{\pi}{6}\right)$

    **f)** $\sin\left(-\dfrac{\pi}{3}\right)$

    **g)** $\cos\left(\dfrac{3\pi}{4}\right)$

    **h)** $\sin\left(\dfrac{3\pi}{2}\right)$
  corrige: |
    On lit les valeurs sur le cercle trigonométrique, en se ramenant aux angles du premier quadrant à l'aide de la parité et des symétries.

    ```tableau
     ¦ **Valeur exacte** ¦ **Justification**
    a) ¦ $\dfrac{1}{2}$ ¦ valeur remarquable du tableau du cours
    b) ¦ $\dfrac{\sqrt{2}}{2}$ ¦ valeur remarquable
    c) ¦ $-\dfrac{1}{2}$ ¦ $\dfrac{2\pi}{3}=\pi-\dfrac{\pi}{3}$, et $\cos(\pi-u)=-\cos(u)$
    d) ¦ $\dfrac{1}{2}$ ¦ $\dfrac{5\pi}{6}=\pi-\dfrac{\pi}{6}$, et $\sin(\pi-u)=\sin(u)$
    e) ¦ $\dfrac{\sqrt{3}}{2}$ ¦ le cosinus est pair : $\cos(-u)=\cos(u)$
    f) ¦ $-\dfrac{\sqrt{3}}{2}$ ¦ le sinus est impair : $\sin(-u)=-\sin(u)$
    g) ¦ $-\dfrac{\sqrt{2}}{2}$ ¦ $\dfrac{3\pi}{4}=\pi-\dfrac{\pi}{4}$
    h) ¦ $-1$ ¦ le point associé est le bas du cercle trigonométrique
    ```
- id: "t-09-02"
  feuille: "f-t-09"
  numero: 2
  partie: "Périodicité, parité et valeurs remarquables"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [cosinus et sinus, valeurs remarquables, périodicité, fonction composée]
  noeuds: [cx-pi]
  notions: [pi, composee]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    En utilisant la périodicité, ramener chacun des réels suivants à un réel de $\left]-\pi\,;\pi\right]$, puis donner la valeur exacte demandée.

    **a)** $\cos\left(\dfrac{13\pi}{3}\right)$

    **b)** $\sin\left(\dfrac{17\pi}{4}\right)$

    **c)** $\cos\left(-\dfrac{25\pi}{6}\right)$

    **d)** $\sin\left(\dfrac{15\pi}{2}\right)$

    Démontrer ensuite que pour tout entier relatif $k$ et tout réel $x$ : 
    $$\cos\big(x+2k\pi\big)+\sin\big(x+2k\pi\big)=\cos(x)+\sin(x)$$
  corrige: |
    On retranche ou l'on ajoute un multiple entier de $2\pi$, ce qui ne change ni le cosinus ni le sinus.

    **a)** On retranche deux tours complets : 
    $$\frac{13\pi}{3}=\frac{\pi}{3}+\frac{12\pi}{3}=\frac{\pi}{3}+4\pi =\frac{\pi}{3}+2\times 2\pi$$

    $$\boxed{\cos\left(\frac{13\pi}{3}\right)=\cos\left(\frac{\pi}{3}\right)=\frac{1}{2}}$$

    **b)** 
    $$\frac{17\pi}{4}=\frac{\pi}{4}+4\pi=\frac{\pi}{4}+2\times 2\pi$$

    $$\boxed{\sin\left(\frac{17\pi}{4}\right)=\sin\left(\frac{\pi}{4}\right) =\frac{\sqrt{2}}{2}}$$

    **c)** 
    $$-\frac{25\pi}{6}=-\frac{\pi}{6}-4\pi=-\frac{\pi}{6}-2\times 2\pi$$

    $$\boxed{\cos\left(-\frac{25\pi}{6}\right)=\cos\left(-\frac{\pi}{6}\right) =\frac{\sqrt{3}}{2}}$$

    **d)** 
    $$\frac{15\pi}{2}=-\frac{\pi}{2}+8\pi=-\frac{\pi}{2}+4\times 2\pi$$

    $$\boxed{\sin\left(\frac{15\pi}{2}\right)=\sin\left(-\frac{\pi}{2}\right)=-1}$$

    Démonstration. Soit $k$ un entier relatif et $x$ un réel. D'après la proposition 1 du cours, $\cos(x+2k\pi)=\cos(x)$ et $\sin(x+2k\pi)=\sin(x)$. En additionnant ces deux égalités : 
    $$\boxed{\cos\big(x+2k\pi\big)+\sin\big(x+2k\pi\big)=\cos(x)+\sin(x)}$$
- id: "t-09-03"
  feuille: "f-t-09"
  numero: 3
  partie: "Périodicité, parité et valeurs remarquables"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [cosinus et sinus, parité, fonction composée]
  noeuds: [cx-pi]
  notions: [pi, composee]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Déterminer si chacune des fonctions suivantes, définies sur $\mathbb{R}$, est paire, impaire, ou ni l'une ni l'autre. Justifier par le calcul de $f(-x)$.

    **a)** $f(x)=\cos(3x)$

    **b)** $f(x)=\sin(x)+x$

    **c)** $f(x)=x^{2}\cos(x)$

    **d)** $f(x)=\sin(x)\cos(x)$

    **e)** $f(x)=\cos(x)+\sin(x)$

    **f)** $f(x)=\dfrac{\sin(x)}{2+\cos(x)}$

    Pour f), on justifiera d'abord que le dénominateur ne s'annule jamais.
  corrige: |
    On calcule à chaque fois $f(-x)$, en utilisant $\cos(-u)=\cos(u)$ et $\sin(-u)=-\sin(u)$.

    **a)** $f(-x)=\cos(-3x)=\cos(3x)=f(x)$ : $\boxed{f \text{ est paire}}$

    **b)** $f(-x)=\sin(-x)+(-x)=-\sin(x)-x=-\big(\sin(x)+x\big)=-f(x)$ : $\boxed{f \text{ est impaire}}$

    **c)** $f(-x)=(-x)^{2}\cos(-x)=x^{2}\cos(x)=f(x)$ : $\boxed{f \text{ est paire}}$ *C'est le produit de deux fonctions paires.*

    **d)** $f(-x)=\sin(-x)\cos(-x)=-\sin(x)\cos(x)=-f(x)$ : $\boxed{f \text{ est impaire}}$ *C'est le produit d'une fonction impaire par une fonction paire.*

    **e)** $f(-x)=\cos(x)-\sin(x)$, qui n'est ni $f(x)$ ni $-f(x)$. Deux contre-exemples le confirment : 
    $$f\left(\frac{\pi}{2}\right)=1 \quad \text{et} \quad f\left(-\frac{\pi}{2}\right)=-1 \quad \text{donc } f \text{ n'est pas paire}$$

    $$f(0)=1\neq 0 \quad \text{donc } f \text{ n'est pas impaire}$$
     *Une fonction impaire vérifie toujours $f(0)=-f(0)$, donc $f(0)=0$.* 
    $$\boxed{f \text{ n'est ni paire ni impaire}}$$

    **f)** Comme $-1\leqslant\cos(x)\leqslant 1$, on a $1\leqslant 2+\cos(x)\leqslant 3$ : le dénominateur est toujours strictement positif, donc $f$ est bien définie sur $\mathbb{R}$. Alors : 
    $$f(-x)=\frac{\sin(-x)}{2+\cos(-x)}=\frac{-\sin(x)}{2+\cos(x)}=-f(x)$$

    $$\boxed{f \text{ est impaire}}$$
- id: "t-09-04"
  feuille: "f-t-09"
  numero: 4
  partie: "Périodicité, parité et valeurs remarquables"
  etoiles: 2
  types: [Conjecture, Démonstration]
  mots_cles: [cosinus et sinus, périodicité, fonction composée]
  noeuds: [cx-pi]
  notions: [pi, composee]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Démontrer que la fonction $f$ définie sur $\mathbb{R}$ par $f(x)=\cos(3x)$ est périodique de période $\dfrac{2\pi}{3}$.

    **2.** Démontrer de même que $g:x\mapsto\sin\left(\dfrac{x}{2}\right)$ est périodique de période $4\pi$.

    **3.** Soit $a$ un réel strictement positif. Conjecturer la période de $x\mapsto\sin(ax)$, puis le démontrer.

    **4.** La fonction $h:x\mapsto x+\sin(x)$ est-elle périodique ? Justifier.
  corrige: |
    **1.** Soit $x$ un réel. Alors : 
    $$f\left(x+\frac{2\pi}{3}\right)=\cos\left(3x+3\times\frac{2\pi}{3}\right) =\cos\big(3x+2\pi\big)=\cos(3x)=f(x)$$

    $$\boxed{f \text{ est périodique de période } \frac{2\pi}{3}}$$

    **2.** 
    $$g\big(x+4\pi\big)=\sin\left(\frac{x+4\pi}{2}\right) =\sin\left(\frac{x}{2}+2\pi\right)=\sin\left(\frac{x}{2}\right)=g(x)$$

    $$\boxed{g \text{ est périodique de période } 4\pi}$$

    **3.** Les deux exemples suggèrent que la période est inversement proportionnelle au coefficient de $x$ : 
    $$\boxed{\text{Conjecture : } x\mapsto\sin(ax) \text{ est périodique de période } \frac{2\pi}{a}}$$
     Démonstration. Pour tout réel $x$ : 
    $$\sin\left(a\left(x+\frac{2\pi}{a}\right)\right)=\sin\big(ax+2\pi\big)=\sin(ax)$$
     Les deux premières questions en sont les cas particuliers $a=3$ et $a=\dfrac{1}{2}$.

    **4.** Raisonnons par l'absurde en supposant $h$ périodique de période $T>0$. L'égalité $h(x+T)=h(x)$ s'écrit alors, pour tout réel $x$ : 
    $$x+T+\sin(x+T)=x+\sin(x) \qquad \text{soit} \qquad \sin(x+T)-\sin(x)=-T$$
     Appliquons-la successivement à deux valeurs bien choisies. Pour $x=0$ : 
    $$\sin(T)-0=-T \qquad \text{donc} \qquad \sin(T)=-T$$
     Pour $x=-T$ : 
    $$\sin(0)-\sin(-T)=-T \qquad \text{donc} \qquad \sin(T)=-T \ \text{devient} \ \sin(T)=T$$
     On aurait donc $T=-T$, c'est-à-dire $T=0$, ce qui contredit $T>0$. 
    $$\boxed{h \text{ n'est pas périodique}}$$
     *Intuitivement, le terme $x$ fait dériver la courbe vers le haut : le motif ne peut pas se répéter à l'identique.*
- id: "t-09-05"
  feuille: "f-t-09"
  numero: 5
  partie: "Périodicité, parité et valeurs remarquables"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [cosinus et sinus, valeurs remarquables, fonction composée, formules trigonométriques]
  noeuds: [cx-pi]
  notions: [pi, composee]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Soit $x$ un réel tel que $\cos(x)=\dfrac{3}{5}$ et $x\in\left[0\,;\dfrac{\pi}{2}\right]$. Déterminer la valeur exacte de $\sin(x)$.

    **2.** Soit $x$ un réel tel que $\sin(x)=-\dfrac{2}{3}$ et $x\in\left[-\dfrac{\pi}{2}\,;0\right]$. Déterminer la valeur exacte de $\cos(x)$.

    **3.** Simplifier, pour tout réel $x$, l'expression $A(x)=\cos^{4}(x)-\sin^{4}(x)+2\sin^{2}(x)$.

    *On pourra reconnaître une différence de deux carrés.*

    **4.** Démontrer que pour tout réel $x$, $\left(\cos(x)+\sin(x)\right)^{2} =1+2\sin(x)\cos(x)$.
  corrige: |
    **1.** D'après la proposition 1, $\cos^{2}(x)+\sin^{2}(x)=1$, donc : 
    $$\sin^{2}(x)=1-\left(\frac{3}{5}\right)^{2}=1-\frac{9}{25}=\frac{16}{25}$$
     D'où $\sin(x)=\pm\dfrac{4}{5}$. Comme $x\in\left[0\,;\dfrac{\pi}{2}\right]$, le sinus est positif : 
    $$\boxed{\sin(x)=\frac{4}{5}}$$

    **2.** 
    $$\cos^{2}(x)=1-\left(-\frac{2}{3}\right)^{2}=1-\frac{4}{9}=\frac{5}{9}$$
     D'où $\cos(x)=\pm\dfrac{\sqrt{5}}{3}$. Comme $x\in\left[-\dfrac{\pi}{2}\,;0\right]$, le cosinus est positif : 
    $$\boxed{\cos(x)=\frac{\sqrt{5}}{3}}$$

    **3.** On reconnaît $u^{2}-v^{2}$ avec $u=\cos^{2}(x)$ et $v=\sin^{2}(x)$ : 
    $$\begin{aligned} A(x) &= \left(\cos^{2}(x)-\sin^{2}(x)\right) \underbrace{\left(\cos^{2}(x)+\sin^{2}(x)\right)}_{=\,1}+2\sin^{2}(x) \\ &= \cos^{2}(x)-\sin^{2}(x)+2\sin^{2}(x) \\ &= \cos^{2}(x)+\sin^{2}(x) \end{aligned}$$

    $$\boxed{A(x)=1 \text{ pour tout réel } x}$$

    **4.** On développe l'identité remarquable : 
    $$\left(\cos(x)+\sin(x)\right)^{2} =\underbrace{\cos^{2}(x)+\sin^{2}(x)}_{=\,1}+2\sin(x)\cos(x)$$

    $$\boxed{\left(\cos(x)+\sin(x)\right)^{2}=1+2\sin(x)\cos(x)}$$
- id: "t-09-06"
  feuille: "f-t-09"
  numero: 6
  partie: "Lecture graphique"
  etoiles: 1
  types: [Lecture graphique, Calcul]
  mots_cles: [cosinus et sinus, périodicité, parité, lecture graphique, équations trigonométriques]
  noeuds: [cx-pi]
  notions: [pi]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Ci-dessous est tracée la courbe $\mathcal{C}$ d'une fonction $f$ définie sur $\mathbb{R}$, dont l'expression est de la forme $f(x)=a\cos(bx)$ avec $a>0$ et $b>0$.

    ![Figure](documents/figures/ffa6eab78d5a18ce.svg)

    **1.** Lire graphiquement la période de $f$. En déduire la valeur de $b$.

    **2.** Lire le maximum et le minimum de $f$. En déduire la valeur de $a$.

    **3.** Donner l'expression de $f(x)$.

    **4.** En quelles valeurs de $x$ de $[0\,;2\pi]$ la fonction atteint-elle son maximum ? Et son minimum ?

    **5.** Combien l'équation $f(x)=0$ admet-elle de solutions sur $[0\,;2\pi]$ ? Les déterminer par le calcul.

    **6.** La fonction $f$ est-elle paire ou impaire ? Justifier à la fois graphiquement et par le calcul.
  corrige: |
    **1.** Le motif se répète tous les $\pi$ : par exemple, la courbe atteint son maximum en $0$, puis de nouveau en $\pi$. 
    $$\boxed{\text{La période vaut } \pi}$$
     Or la période de $x\mapsto\cos(bx)$ vaut $\dfrac{2\pi}{b}$, d'où $\dfrac{2\pi}{b}=\pi$ : $\boxed{b=2}$

    **2.** La courbe oscille entre $-3$ et $3$ : 
    $$\boxed{\text{maximum } 3 \quad ; \quad \text{minimum } -3 \quad ; \quad a=3}$$

    **3.** 
    $$\boxed{f(x)=3\cos(2x)}$$

    **4.** Le maximum $3$ est atteint lorsque $\cos(2x)=1$, ce que la courbe montre en $0$, $\pi$ et $2\pi$. Le minimum $-3$ correspond à $\cos(2x)=-1$ : 
    $$\boxed{\text{maximum en } x=0,\ \pi,\ 2\pi \quad ; \quad \text{minimum en } x=\frac{\pi}{2},\ \frac{3\pi}{2}}$$

    **5.** La courbe coupe l'axe des abscisses quatre fois sur $[0\,;2\pi]$. Par le calcul : 
    $$3\cos(2x)=0 \iff \cos(2x)=0 \iff 2x=\frac{\pi}{2}+k\pi \iff x=\frac{\pi}{4}+k\frac{\pi}{2}$$
     En ne gardant que les valeurs de $[0\,;2\pi]$ : 
    $$\boxed{S=\left\{\frac{\pi}{4}\,;\frac{3\pi}{4}\,;\frac{5\pi}{4}\,;\frac{7\pi}{4}\right\}}$$

    **6.** Graphiquement, la courbe est symétrique par rapport à l'axe des ordonnées. Par le calcul : 
    $$f(-x)=3\cos(-2x)=3\cos(2x)=f(x)$$

    $$\boxed{f \text{ est paire}}$$
- id: "t-09-07"
  feuille: "f-t-09"
  numero: 7
  partie: "Lecture graphique"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [cosinus et sinus, périodicité, parité, lecture graphique, fonction composée]
  noeuds: [cx-pi]
  notions: [pi, composee]
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Sur le graphique ci-dessous sont tracées quatre courbes, représentant dans le désordre les fonctions définies sur $\mathbb{R}$ par : 
    $$x\mapsto\sin(x) \quad ; \quad x\mapsto 2\sin(x) \quad ; \quad x\mapsto\sin(2x) \quad ; \quad x\mapsto\sin(x)+1$$

    ![Figure](documents/figures/4058e053f9b03495.svg)

    **1.** Associer chaque courbe à son expression. On justifiera chaque réponse par au moins deux arguments choisis parmi la période, le maximum, le minimum et la valeur en $0$.

    **2.** Parmi ces quatre fonctions, lesquelles sont impaires ? Le vérifier par le calcul.

    **3.** Laquelle n'est ni paire ni impaire ? Quelle transformation géométrique fait passer de sa courbe à celle du sinus ?
  corrige: |
    **1.** On compare période, maximum et minimum.

    ```tableau
    **Courbe** ¦ **Période** ¦ **Max** ¦ **Min** ¦ **Expression**
    $\mathcal{C}_{1}$ ¦ $2\pi$ ¦ $1$ ¦ $-1$ ¦ $x\mapsto\sin(x)$
    $\mathcal{C}_{2}$ ¦ $2\pi$ ¦ $2$ ¦ $-2$ ¦ $x\mapsto 2\sin(x)$
    $\mathcal{C}_{3}$ ¦ $\pi$ ¦ $1$ ¦ $-1$ ¦ $x\mapsto\sin(2x)$
    $\mathcal{C}_{4}$ ¦ $2\pi$ ¦ $2$ ¦ $0$ ¦ $x\mapsto\sin(x)+1$
    ```

    Les courbes $\mathcal{C}_{2}$ et $\mathcal{C}_{4}$ ont le même maximum : c'est le *minimum* qui les départage. Les courbes $\mathcal{C}_{1}$ et $\mathcal{C}_{3}$ ont les mêmes bornes : c'est la *période* qui les départage.

    **2.** 
    $$\boxed{\mathcal{C}_{1},\ \mathcal{C}_{2} \text{ et } \mathcal{C}_{3} \text{ sont impaires}}$$
     En effet $\sin(-x)=-\sin(x)$, $2\sin(-x)=-2\sin(x)$ et $\sin(-2x)=-\sin(2x)$. Leurs courbes sont bien symétriques par rapport à l'origine.

    **3.** La fonction $x\mapsto\sin(x)+1$ vérifie $f(0)=1\neq 0$ : elle ne peut donc pas être impaire, et $f(-x)=-\sin(x)+1\neq f(x)$ interdit la parité. 
    $$\boxed{\mathcal{C}_{4} \text{ n'est ni paire ni impaire}}$$

    $$\boxed{\text{On passe de la courbe de } \sin \text{ à } \mathcal{C}_{4} \text{ par la translation de vecteur } \vec{\jmath}}$$
- id: "t-09-08"
  feuille: "f-t-09"
  numero: 8
  partie: "Lecture graphique"
  etoiles: 2
  types: [Lecture graphique, Calcul]
  mots_cles: [cosinus et sinus, lecture graphique, équations trigonométriques]
  noeuds: [cx-pi]
  notions: [pi]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Ci-dessous est tracée la courbe de la fonction cosinus sur $[-2\pi\,;2\pi]$, ainsi que les droites d'équations $y=\dfrac{1}{2}$ et $y=-\dfrac{\sqrt{2}}{2}$.

    ![Figure](documents/figures/21b64bb1ec4766df.svg)

    **1.** Résoudre graphiquement, sur $[-2\pi\,;2\pi]$, l'équation $\cos(x)=\dfrac{1}{2}$, puis donner les valeurs exactes.

    **2.** Résoudre graphiquement, sur le même intervalle, l'équation $\cos(x)=-\dfrac{\sqrt{2}}{2}$, puis donner les valeurs exactes.

    **3.** Résoudre graphiquement l'inéquation $\cos(x)\geqslant\dfrac{1}{2}$ sur $[0\,;2\pi]$.

    **4.** Résoudre graphiquement l'inéquation $\cos(x)<-\dfrac{\sqrt{2}}{2}$ sur $[0\,;2\pi]$.

    **5.** Combien l'équation $\cos(x)=\dfrac{1}{2}$ admet-elle de solutions sur $\mathbb{R}$ ? Les décrire toutes.
  corrige: |
    **1.** La droite $y=\dfrac{1}{2}$ coupe la courbe en quatre points sur $[-2\pi\,;2\pi]$. 
    $$\boxed{S=\left\{-\frac{5\pi}{3}\,;-\frac{\pi}{3}\,;\frac{\pi}{3}\,;\frac{5\pi}{3}\right\}}$$
     En effet $\cos\left(\dfrac{\pi}{3}\right)=\dfrac{1}{2}$, et l'on obtient les autres solutions par parité puis par périodicité.

    **2.** De même, $\cos\left(\dfrac{3\pi}{4}\right)=-\dfrac{\sqrt{2}}{2}$ : 
    $$\boxed{S=\left\{-\frac{5\pi}{4}\,;-\frac{3\pi}{4}\,;\frac{3\pi}{4}\,;\frac{5\pi}{4}\right\}}$$

    **3.** Sur $[0\,;2\pi]$, la courbe est au-dessus de la droite $y=\dfrac{1}{2}$ au début et à la fin de l'intervalle : 
    $$\boxed{S=\left[0\,;\frac{\pi}{3}\right]\cup\left[\frac{5\pi}{3}\,;2\pi\right]}$$

    **4.** La courbe est strictement en dessous de $y=-\dfrac{\sqrt{2}}{2}$ entre les deux points d'intersection situés dans $[0\,;2\pi]$ : 
    $$\boxed{S=\left]\frac{3\pi}{4}\,;\frac{5\pi}{4}\right[}$$

    **5.** La fonction étant $2\pi$-périodique, chaque solution se reproduit indéfiniment : 
    $$\boxed{\text{L'équation admet une infinité de solutions sur } \mathbb{R}}$$

    $$\boxed{S=\left\{\frac{\pi}{3}+2k\pi \; ; \; k\in\mathbb{Z}\right\} \cup\left\{-\frac{\pi}{3}+2k\pi \; ; \; k\in\mathbb{Z}\right\}}$$
- id: "t-09-09"
  feuille: "f-t-09"
  numero: 9
  partie: "Lecture graphique"
  etoiles: 2
  types: [Calcul]
  mots_cles: [périodicité, parité, lecture graphique]
  noeuds: [cx-pi]
  notions: []
  page_enonce: 3
  page_corrige: 6
  enonce: |
    On considère une fonction $f$ définie sur $\mathbb{R}$, **paire** et **périodique de période** $2\pi$. Sa courbe n'est représentée ci-dessous que sur l'intervalle $[0\,;\pi]$.

    ![Figure](documents/figures/7015204aef816fd0.svg)

    **1.** Que vaut $f(0)$ ? Que vaut $f(\pi)$ ?

    **2.** En utilisant la parité, reproduire la figure et compléter la courbe sur $[-\pi\,;0]$.

    **3.** En utilisant la périodicité, compléter alors la courbe sur $[-2\pi\,;2\pi]$.

    **4.** Déterminer $f\left(-\dfrac{\pi}{2}\right)$, puis $f\left(\dfrac{5\pi}{2}\right)$, en justifiant par les propriétés utilisées.

    **5.** Combien de fois la fonction atteint-elle son minimum sur $[-2\pi\,;2\pi]$ ?
  corrige: |
    **1.** On lit les ordonnées aux extrémités de l'arc tracé : 
    $$\boxed{f(0)=2 \qquad ; \qquad f(\pi)=0}$$

    **2.** et 3. La fonction étant paire, la courbe est symétrique par rapport à l'axe des ordonnées : on complète sur $[-\pi\,;0]$ par cette symétrie. Elle est ensuite $2\pi$-périodique, donc on reproduit le motif obtenu sur $[-\pi\,;\pi]$ par translations successives de vecteur $2\pi\,\vec{\imath}$.

    ![Figure](documents/figures/d08e3143d76baf97.svg)

    En bleu l'arc fourni, en gris tout le reste, obtenu sans aucun calcul.

    **3.** La parité donne directement : 
    $$\boxed{f\left(-\frac{\pi}{2}\right)=f\left(\frac{\pi}{2}\right)=-1}$$
     La périodicité permet ensuite de retrancher $2\pi$ : 
    $$\boxed{f\left(\frac{5\pi}{2}\right)=f\left(\frac{5\pi}{2}-2\pi\right) =f\left(\frac{\pi}{2}\right)=-1}$$

    **4.** Le minimum est atteint une fois sur $[0\,;\pi]$, donc deux fois sur $[-\pi\,;\pi]$ par symétrie, et le motif se répète une fois de chaque côté sur $[-2\pi\,;2\pi]$ : 
    $$\boxed{\text{Le minimum est atteint } 4 \text{ fois sur } [-2\pi\,;2\pi]}$$
