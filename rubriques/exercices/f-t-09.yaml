  page_enonce: 13
  page_corrige: 31
  enonce: |
    On rappelle que, pour tout réel $a$, $\cos(2a)=2\cos^{2}(a)-1=1-2\sin^{2}(a)$ et $\sin(2a)=2\sin(a)\cos(a)$.

    **1.** Montrer que, pour tout réel $x$, $2\cos(2x)+4\cos(x)+3\geqslant 0$, et déterminer le cas d'égalité.

    **2.** Pour quelles valeurs du réel $\lambda$ la fonction $f_{\lambda}$ définie sur $\mathbb{R}$ par 
    $$f_{\lambda}(x)=\cos^{6}(x)+\sin^{6}(x)-\lambda\cos(4x)$$
     est-elle constante ?
  corrige: |
    **1.** Notons $c=\cos(x)$. Avec $\cos(2x)=2c^{2}-1$ : 
    $$2\cos(2x)+4\cos(x)+3=4c^{2}-2+4c+3=4c^{2}+4c+1=(2c+1)^{2}\geqslant 0$$
     Il y a égalité si et seulement si $\cos(x)=-\frac{1}{2}$. 
    $$\boxed{2\cos(2x)+4\cos(x)+3\geqslant 0,\ \text{avec égalité si et seulement si } x=\pm\frac{2\pi}{3}+2k\pi,\ k\in\mathbb{Z}}$$

    **2.** Notons $c=\cos^{2}(x)$ et $s=\sin^{2}(x)$, de sorte que $c+s=1$. D'après l'identité $(c+s)^{3}=c^{3}+s^{3}+3cs(c+s)$ : 
    $$\cos^{6}(x)+\sin^{6}(x)=c^{3}+s^{3}=1-3cs=1-3\big(\sin(x)\cos(x)\big)^{2} =1-\frac{3}{4}\sin^{2}(2x)$$
     Enfin, $\cos(2a)=1-2\sin^{2}(a)$ appliquée à $a=2x$ donne $\sin^{2}(2x)=\frac{1-\cos(4x)}{2}$, d'où 
    $$\cos^{6}(x)+\sin^{6}(x)=1-\frac{3}{8}\big(1-\cos(4x)\big)=\frac{5}{8}+\frac{3}{8}\cos(4x)$$
     et $f_{\lambda}(x)=\frac{5}{8}+\left(\frac{3}{8}-\lambda\right)\cos(4x)$. Si $\lambda=\frac{3}{8}$, la fonction est constante, égale à $\frac{5}{8}$. Sinon, elle prend des valeurs différentes en $x=0$ et $x=\frac{\pi}{4}$, où $\cos(4x)$ vaut $1$ et $-1$. 
    $$\boxed{f_{\lambda} \text{ est constante si et seulement si } \lambda=\frac{3}{8} \text{ ; elle vaut alors } \frac{5}{8}.}$$
     *Vérification :* en $x=0$, $1+0-\frac{3}{8}=\frac{5}{8}$ ; en $x=\frac{\pi}{4}$, $\frac{1}{8}+\frac{1}{8}+\frac{3}{8}=\frac{5}{8}$.

    *Remarque.* Dans les deux questions, la clé est d'écrire l'expression à l'aide d'une seule quantité ($\cos(x)$ dans la première, $\cos(4x)$ dans la seconde). On peut aussi traiter la question 2 en dérivant, puisque $f_{\lambda}$ est constante si et seulement si sa dérivée est nulle, mais le calcul est nettement plus long.
- id: "t-09-39"
  feuille: "f-t-09"
  numero: 39
  partie: "Pour aller plus loin"
  etoiles: 3
  types: [Calcul]
  mots_cles: [cosinus et sinus, formules trigonométriques]
  noeuds: [cx-pi]
  notions: [pi]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 102"
  page_enonce: 13
  page_corrige: 31
  enonce: |
    Soit $\alpha$ l'unique élément de $[0\,;\pi]$ tel que $\cos(\alpha)=\dfrac{\sqrt{5}-1}{4}$. On rappelle que, pour tout réel $a$, $\cos(2a)=2\cos^{2}(a)-1$.

    **1.** Calculer $\cos(2\alpha)$, puis $\cos(4\alpha)$.

    **2.** En déduire qu'il existe un entier relatif $k$ tel que $4\alpha=\alpha+2k\pi$ ou $4\alpha=-\alpha+2k\pi$.

    **3.** Conclure que $\alpha=\dfrac{2\pi}{5}$.
  corrige: |
    **1.** Avec $\cos^{2}(\alpha)=\frac{(\sqrt{5}-1)^{2}}{16}=\frac{6-2\sqrt{5}}{16}$ : 
    $$\cos(2\alpha)=2\cos^{2}(\alpha)-1=\frac{6-2\sqrt{5}}{8}-1=\boxed{-\frac{1+\sqrt{5}}{4}}$$
     Puis, avec $\cos^{2}(2\alpha)=\frac{6+2\sqrt{5}}{16}$ : 
    $$\cos(4\alpha)=2\cos^{2}(2\alpha)-1=\frac{6+2\sqrt{5}}{8}-1=\boxed{\frac{\sqrt{5}-1}{4}=\cos(\alpha)}$$

    **2.** D'après le cours, les réels $X$ tels que $\cos(X)=\cos(\alpha)$ sont les réels $X=\alpha+2k\pi$ et $X=-\alpha+2k\pi$, avec $k\in\mathbb{Z}$. Appliqué à $X=4\alpha$ : 
    $$\boxed{4\alpha=\alpha+2k\pi \quad\text{ou}\quad 4\alpha=-\alpha+2k\pi,\qquad k\in\mathbb{Z}}$$

    **3.** *Premier cas :* $3\alpha=2k\pi$, donc $\alpha=\frac{2k\pi}{3}$. Comme $\alpha\in[0\,;\pi]$, $\alpha=0$ ou $\alpha=\frac{2\pi}{3}$, de cosinus $1$ et $-\frac{1}{2}$ ; or $\cos(\alpha)=\frac{\sqrt{5}-1}{4}\approx 0{,}309$. Ce cas est impossible.

    *Second cas :* $5\alpha=2k\pi$, donc $\alpha=\frac{2k\pi}{5}$, et $\alpha\in[0\,;\pi]$ laisse $\alpha\in\left\{0\,;\frac{2\pi}{5}\,;\frac{4\pi}{5}\right\}$. La valeur $0$ est exclue comme ci-dessus, et $\frac{4\pi}{5}\in\left]\frac{\pi}{2}\,;\pi\right]$ a un cosinus négatif, alors que $\cos(\alpha)>0$. 
    $$\boxed{\alpha=\frac{2\pi}{5}\qquad\text{c'est-à-dire}\qquad\cos\left(\frac{2\pi}{5}\right) =\frac{\sqrt{5}-1}{4}}$$

    ![Figure](documents/figures/043386cf8b4dfe92.svg)

    Cette figure montre le pentagone régulier inscrit dans le cercle trigonométrique : le sommet d'angle $\frac{2\pi}{5}$ se projette sur l'axe des abscisses en $\frac{\sqrt{5}-1}{4}\approx 0{,}309$.

    *Remarque.* Le nombre $\frac{\sqrt{5}-1}{4}$ s'écrit $\frac{1}{2\varphi}$, où $\varphi=\frac{1+\sqrt{5}}{2}$ est le nombre d'or. Comme $\cos\left(\frac{2\pi}{5}\right)$ ne fait intervenir qu'une racine carrée, on peut construire le pentagone régulier à la règle et au compas, ce que savaient déjà les géomètres grecs.
