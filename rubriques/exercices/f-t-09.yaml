    Déterminer la dérivée de chacune des fonctions suivantes, définies sur $\mathbb{R}$.

    **a)** $f(x)=3\sin(x)$

    **b)** $f(x)=\cos(x)-2x$

    **c)** $f(x)=5\cos(x)+\sin(x)$

    **d)** $f(x)=x^{2}-4\cos(x)$

    **e)** $f(x)=\sin(x)-\cos(x)$

    **f)** $f(x)=\dfrac{\cos(x)}{2}$
  corrige: |
    On utilise $\sin'=\cos$ et $\cos'=-\sin$, sans oublier le signe moins de la seconde formule.

    **a)** $\boxed{f'(x)=3\cos(x)}$

    **b)** $\boxed{f'(x)=-\sin(x)-2}$

    **c)** $\boxed{f'(x)=-5\sin(x)+\cos(x)}$

    **d)** $\boxed{f'(x)=2x+4\sin(x)}$

    **e)** $\boxed{f'(x)=\cos(x)+\sin(x)}$

    **f)** $\boxed{f'(x)=-\dfrac{\sin(x)}{2}}$

    En d), la dérivée de $-4\cos(x)$ vaut $-4\times\left(-\sin(x)\right)=+4\sin(x)$ : les deux signes moins se compensent.
- id: "t-09-11"
  feuille: "f-t-09"
  numero: 11
  partie: "Dérivation et primitives"
  etoiles: 1
  types: [Calcul]
  mots_cles: [cosinus et sinus, fonction composée, étude de signe et de variations]
  noeuds: [cx-pi]
  notions: [pi, composee]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Même consigne, en utilisant la proposition 4 du cours.

    **a)** $f(x)=\sin(3x)$

    **b)** $f(x)=\cos(2x-1)$

    **c)** $f(x)=\sin\left(\dfrac{x}{2}\right)$

    **d)** $f(x)=\cos\left(x^{2}\right)$

    **e)** $f(x)=\sin\left(x^{3}+x\right)$

    **f)** $f(x)=\cos(-4x+\pi)$
  corrige: |
    On applique $\big(\sin(u)\big)'=u'\cos(u)$ et $\big(\cos(u)\big)'=-u'\sin(u)$.

    $$\begin{array}{|c||c|c|c|} \hline  & f(x) & u(x)\text{ \; et \; }u'(x) & f'(x) \\ \hline \text{a)} & \sin(3x) & u=3x\text{, }u'=3 & 3\cos(3x) \\ \hline \text{b)} & \cos(2x-1) & u=2x-1\text{, }u'=2 & -2\sin(2x-1) \\ \hline \text{c)} & \sin\left(\frac{x}{2}\right) & u=\frac{x}{2}\text{, }u'=\frac{1}{2} & \frac{1}{2}\cos\left(\frac{x}{2}\right) \\ \hline \text{d)} & \cos\left(x^{2}\right) & u=x^{2}\text{, }u'=2x & -2x\sin\left(x^{2}\right) \\ \hline \text{e)} & \sin\left(x^{3}+x\right) & u=x^{3}+x\text{, }u'=3x^{2}+1 & \left(3x^{2}+1\right)\cos\left(x^{3}+x\right) \\ \hline \text{f)} & \cos(-4x+\pi) & u=-4x+\pi\text{, }u'=-4 & 4\sin(-4x+\pi) \\ \hline \end{array}$$

    En f), les deux signes moins se compensent à nouveau : $-(-4)\sin(u)=+4\sin(u)$.
- id: "t-09-12"
  feuille: "f-t-09"
  numero: 12
  partie: "Dérivation et primitives"
  etoiles: 2
  types: [Calcul]
  mots_cles: [cosinus et sinus, dérivée, fonction composée, formules trigonométriques]
  noeuds: [cx-pi, ar-deriv]
  notions: [pi, derivable, composee]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Déterminer la dérivée de chacune des fonctions suivantes, en précisant la formule utilisée (produit, quotient ou composée).

    **a)** $f(x)=x\cos(x)$

    **b)** $f(x)=\sin(x)\cos(x)$

    **c)** $f(x)=\sin^{2}(x)$

    **d)** $f(x)=\dfrac{\sin(x)}{x}$ sur $]0\,;+\infty[$

    **e)** $f(x)=\dfrac{1}{2+\cos(x)}$

    **f)** $f(x)=\mathrm{e}^{\sin(x)}$
  corrige: |
    **a)** Produit $u=x$ et $v=\cos(x)$ : 
    $$f'(x)=1\times\cos(x)+x\times\left(-\sin(x)\right)=\boxed{\cos(x)-x\sin(x)}$$

    **b)** Produit $u=\sin(x)$ et $v=\cos(x)$ : 
    $$f'(x)=\cos(x)\times\cos(x)+\sin(x)\times\left(-\sin(x)\right) =\boxed{\cos^{2}(x)-\sin^{2}(x)}$$
     On reconnaît $\cos(2x)$.

    **c)** Composée : $f=u^{2}$ avec $u=\sin(x)$, donc $f'=2u'u$ : 
    $$f'(x)=2\cos(x)\sin(x)=\boxed{2\sin(x)\cos(x)}$$
     On reconnaît $\sin(2x)$.

    **d)** Quotient $u=\sin(x)$ et $v=x$ : 
    $$f'(x)=\frac{\cos(x)\times x-\sin(x)\times 1}{x^{2}} =\boxed{\frac{x\cos(x)-\sin(x)}{x^{2}}}$$

    **e)** Composée : $f=\dfrac{1}{v}$ avec $v=2+\cos(x)$, donc $f'=-\dfrac{v'}{v^{2}}$ : 
    $$f'(x)=-\frac{-\sin(x)}{\left(2+\cos(x)\right)^{2}} =\boxed{\frac{\sin(x)}{\left(2+\cos(x)\right)^{2}}}$$

    **f)** Composée : $f=\mathrm{e}^{u}$ avec $u=\sin(x)$, donc $f'=u'\mathrm{e}^{u}$ : 
    $$\boxed{f'(x)=\cos(x)\,\mathrm{e}^{\sin(x)}}$$
- id: "t-09-13"
  feuille: "f-t-09"
  numero: 13
  partie: "Dérivation et primitives"
  etoiles: 2
  types: [Lecture graphique, Calcul]
  mots_cles: [cosinus et sinus, lecture graphique, fonction composée, tangente, équations trigonométriques]
  noeuds: [cx-pi, ar-deriv]
  notions: [pi, composee]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Dans chaque cas, déterminer une équation de la tangente à la courbe de $f$ au point d'abscisse $a$.

    **a)** $f(x)=\sin(x)$ et $a=0$

    **b)** $f(x)=\cos(x)$ et $a=0$

    **c)** $f(x)=\sin(x)$ et $a=\dfrac{\pi}{2}$

    **d)** $f(x)=\cos(2x)$ et $a=\dfrac{\pi}{4}$

    **e)** $f(x)=x\sin(x)$ et $a=\pi$

    Que remarque-t-on pour les questions b) et c) ? Interpréter graphiquement.
  corrige: |
    On utilise $y=f'(a)(x-a)+f(a)$.

    $$\begin{array}{|c||c|c|c|c|} \hline  & f(x) & a & f(a)\text{ \; ; \; }f'(a) & \text{Tangente} \\ \hline \text{a)} & \sin(x) & 0 & 0\text{ \; ; \; }1 & y=x \\ \hline \text{b)} & \cos(x) & 0 & 1\text{ \; ; \; }0 & y=1 \\ \hline \text{c)} & \sin(x) & \frac{\pi}{2} & 1\text{ \; ; \; }0 & y=1 \\ \hline \text{d)} & \cos(2x) & \frac{\pi}{4} & 0\text{ \; ; \; }-2 & y=-2x+\frac{\pi}{2} \\ \hline \text{e)} & x\sin(x) & \pi & 0\text{ \; ; \; }-\pi & y=-\pi x+\pi^{2} \\ \hline \end{array}$$

    Détail de d) : $f'(x)=-2\sin(2x)$, donc $f'\left(\dfrac{\pi}{4}\right)=-2\sin\left(\dfrac{\pi}{2}\right)=-2$, et $f\left(\dfrac{\pi}{4}\right)=\cos\left(\dfrac{\pi}{2}\right)=0$.

    Détail de e) : $f'(x)=\sin(x)+x\cos(x)$, donc $f'(\pi)=0+\pi\times(-1)=-\pi$.

    Les questions b) et c) donnent la même tangente $y=1$ : 
    $$\boxed{\text{Les deux courbes admettent une tangente horizontale, car elles y atteignent leur maximum}}$$
     C'est cohérent avec le fait qu'en un extremum, le nombre dérivé s'annule.
- id: "t-09-14"
  feuille: "f-t-09"
  numero: 14
  partie: "Dérivation et primitives"
  etoiles: 2
  types: [Calcul]
  mots_cles: [cosinus et sinus, fonction composée, limite]
  noeuds: [cx-pi]
  notions: [pi, composee]
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Déterminer les limites suivantes, en se ramenant à la proposition 3 du cours.

    **a)** $\displaystyle\lim_{x\to 0}\frac{\sin(5x)}{x}$

    **b)** $\displaystyle\lim_{x\to 0}\frac{\sin(x)}{3x}$

    **c)** $\displaystyle\lim_{x\to 0}\frac{\sin(2x)}{\sin(3x)}$

    **d)** $\displaystyle\lim_{x\to 0}\frac{x}{\sin(x)}$

    **e)** $\displaystyle\lim_{x\to 0}\frac{\cos(x)-1}{2x}$

    **f)** $\displaystyle\lim_{x\to 0}\frac{\sin(x)\cos(x)}{x}$

    Pour a) et c), on pourra faire apparaître artificiellement le quotient $\dfrac{\sin(u)}{u}$ en multipliant et divisant par la quantité adéquate.
  corrige: |
    Le cours donne $\displaystyle\lim_{x\to 0}\frac{\sin(x)}{x}=1$ et $\displaystyle\lim_{x\to 0}\frac{\cos(x)-1}{x}=0$. Toute la technique consiste à faire apparaître ces quotients.

    **a)** On multiplie et divise par $5$ : 
    $$\frac{\sin(5x)}{x}=5\times\frac{\sin(5x)}{5x}$$
     Lorsque $x$ tend vers $0$, $5x$ tend vers $0$ et le quotient tend vers $1$ : 
    $$\boxed{\lim_{x\to 0}\frac{\sin(5x)}{x}=5}$$

    **b)** 
    $$\frac{\sin(x)}{3x}=\frac{1}{3}\times\frac{\sin(x)}{x} \qquad \Longrightarrow \qquad \boxed{\lim_{x\to 0}\frac{\sin(x)}{3x}=\frac{1}{3}}$$

    **c)** On fait apparaître les deux quotients de référence : 
    $$\frac{\sin(2x)}{\sin(3x)}=\frac{\sin(2x)}{2x}\times\frac{3x}{\sin(3x)} \times\frac{2x}{3x}$$
     Les deux premiers facteurs tendent vers $1$, le troisième vaut $\dfrac{2}{3}$ : 
    $$\boxed{\lim_{x\to 0}\frac{\sin(2x)}{\sin(3x)}=\frac{2}{3}}$$

    **d)** C'est l'inverse du quotient de référence, dont la limite $1$ est non nulle : 
    $$\boxed{\lim_{x\to 0}\frac{x}{\sin(x)}=1}$$

    **e)** 
    $$\frac{\cos(x)-1}{2x}=\frac{1}{2}\times\frac{\cos(x)-1}{x} \qquad \Longrightarrow \qquad \boxed{\lim_{x\to 0}\frac{\cos(x)-1}{2x}=0}$$

    **f)** 
    $$\frac{\sin(x)\cos(x)}{x}=\frac{\sin(x)}{x}\times\cos(x)$$
     Le premier facteur tend vers $1$ et le second vers $\cos(0)=1$ : 
    $$\boxed{\lim_{x\to 0}\frac{\sin(x)\cos(x)}{x}=1}$$
- id: "t-09-15"
  feuille: "f-t-09"
  numero: 15
  partie: "Dérivation et primitives"
  etoiles: 1
  types: [Calcul]
  mots_cles: [cosinus et sinus, fonction composée, primitive]
  noeuds: [cx-pi, ar-tfa]
  notions: [pi, composee]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Le cours donne $\sin'=\cos$ et $\cos'=-\sin$ : en lisant ces formules à l'envers, on obtient des primitives. Déterminer une primitive de chacune des fonctions suivantes sur $\mathbb{R}$.

    **a)** $f(x)=\cos(x)$

    **b)** $f(x)=\sin(x)$

    **c)** $f(x)=3\cos(x)-2\sin(x)$

    **d)** $f(x)=\cos(2x)$

    **e)** $f(x)=\sin(3x-1)$

    **f)** $f(x)=\cos(x)+x$

    **g)** $f(x)=\sin(x)\cos(x)$

    **h)** $f(x)=\cos(x)\,\mathrm{e}^{\sin(x)}$

    On vérifiera chaque réponse en la dérivant. Pour g), on pourra reconnaître une expression de la forme $u'u$.
  corrige: |
    Une primitive $F$ de $f$ est une fonction dont la dérivée est $f$. On lit donc les formules du cours à l'envers, sans oublier de compenser le coefficient intérieur par sa division.

    ```tableau
     ¦ $f(x)$ ¦ **Primitive** $F(x)$ ¦ **Vérification** $F'(x)$
    a) ¦ $\cos(x)$ ¦ $\sin(x)$ ¦ $\sin'=\cos$
    b) ¦ $\sin(x)$ ¦ $-\cos(x)$ ¦ $(-\cos)'=+\sin$
    c) ¦ $3\cos(x)-2\sin(x)$ ¦ $3\sin(x)+2\cos(x)$ ¦ $3\cos(x)-2\sin(x)$
    d) ¦ $\cos(2x)$ ¦ $\dfrac{1}{2}\sin(2x)$ ¦ $\dfrac{1}{2}\times 2\cos(2x)=\cos(2x)$
    e) ¦ $\sin(3x-1)$ ¦ $-\dfrac{1}{3}\cos(3x-1)$ ¦ $-\dfrac{1}{3}\times\left(-3\sin(3x-1)\right)$
    f) ¦ $\cos(x)+x$ ¦ $\sin(x)+\dfrac{x^{2}}{2}$ ¦ $\cos(x)+x$
    g) ¦ $\sin(x)\cos(x)$ ¦ $\dfrac{1}{2}\sin^{2}(x)$ ¦ $\dfrac{1}{2}\times 2\sin(x)\cos(x)$
    h) ¦ $\cos(x)\,\mathrm{e}^{\sin(x)}$ ¦ $\mathrm{e}^{\sin(x)}$ ¦ $\cos(x)\,\mathrm{e}^{\sin(x)}$
    ```

    En d) et e), le facteur $\dfrac{1}{2}$ ou $-\dfrac{1}{3}$ compense exactement le coefficient qui apparaît lors de la dérivation de la composée : c'est le point délicat.

    En g), on reconnaît la forme $u'u$ avec $u=\sin(x)$, dont une primitive est $\dfrac{u^{2}}{2}$. On aurait aussi pu écrire $\sin(x)\cos(x)=\dfrac{1}{2}\sin(2x)$, dont une primitive est $-\dfrac{1}{4}\cos(2x)$ : les deux réponses diffèrent d'une constante, ce qui est normal.

    En h), on reconnaît $u'\mathrm{e}^{u}$ avec $u=\sin(x)$.
- id: "t-09-16"
  feuille: "f-t-09"
  numero: 16
  partie: "Dérivation et primitives"
  etoiles: 2
  types: [Calcul]
  mots_cles: [cosinus et sinus, parité, fonction composée, intégrale]
  noeuds: [cx-pi, ar-riemann]
  notions: [pi, composee]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Calculer les intégrales suivantes. On donnera des valeurs exactes.

    **a)** $\displaystyle\int_{0}^{\frac{\pi}{2}}\cos(x)\,\mathrm{d}x$

    **b)** $\displaystyle\int_{0}^{\pi}\sin(x)\,\mathrm{d}x$

    **c)** $\displaystyle\int_{0}^{\frac{\pi}{2}}\sin(2x)\,\mathrm{d}x$

    **d)** $\displaystyle\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\cos(x)\,\mathrm{d}x$

    **e)** $\displaystyle\int_{0}^{2\pi}\sin(x)\,\mathrm{d}x$

    **f)** $\displaystyle\int_{0}^{\frac{\pi}{4}}\big(\cos(x)-\sin(x)\big)\,\mathrm{d}x$

    Le résultat de la question e) peut surprendre : l'expliquer à l'aide de l'imparité du sinus.
  corrige: |
    On applique $\displaystyle\int_{a}^{b}f(x)\,\mathrm{d}x=F(b)-F(a)$, en utilisant les primitives de l'exercice précédent.

    **a)** 
    $$\int_{0}^{\frac{\pi}{2}}\cos(x)\,\mathrm{d}x =\Big[\sin(x)\Big]_{0}^{\frac{\pi}{2}}=\sin\left(\frac{\pi}{2}\right)-\sin(0) =\boxed{1}$$

    **b)** 
    $$\int_{0}^{\pi}\sin(x)\,\mathrm{d}x=\Big[-\cos(x)\Big]_{0}^{\pi} =-\cos(\pi)+\cos(0)=1+1=\boxed{2}$$

    **c)** 
    $$\int_{0}^{\frac{\pi}{2}}\sin(2x)\,\mathrm{d}x =\left[-\frac{1}{2}\cos(2x)\right]_{0}^{\frac{\pi}{2}} =-\frac{1}{2}\cos(\pi)+\frac{1}{2}\cos(0)=\frac{1}{2}+\frac{1}{2}=\boxed{1}$$

    **d)** 
    $$\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\cos(x)\,\mathrm{d}x =\Big[\sin(x)\Big]_{-\frac{\pi}{2}}^{\frac{\pi}{2}}=1-(-1)=\boxed{2}$$

    **e)** 
    $$\int_{0}^{2\pi}\sin(x)\,\mathrm{d}x=\Big[-\cos(x)\Big]_{0}^{2\pi} =-\cos(2\pi)+\cos(0)=-1+1=\boxed{0}$$

    **f)** 
    $$\int_{0}^{\frac{\pi}{4}}\big(\cos(x)-\sin(x)\big)\,\mathrm{d}x =\Big[\sin(x)+\cos(x)\Big]_{0}^{\frac{\pi}{4}} =\left(\frac{\sqrt{2}}{2}+\frac{\sqrt{2}}{2}\right)-(0+1)=\boxed{\sqrt{2}-1}$$

    Explication de e). Sur $[0\,;\pi]$ le sinus est positif, sur $[\pi\,;2\pi]$ il est négatif. Plus précisément, le sinus vérifie $\sin(x+\pi)=-\sin(x)$ : à chaque valeur prise sur la première moitié correspond son opposée sur la seconde. 
    $$\boxed{\text{Les deux contributions se compensent exactement, d'où une intégrale nulle}}$$
     Attention : une intégrale nulle ne signifie pas que l'aire est nulle, comme le montre l'exercice 28.
- id: "t-09-17"
  feuille: "f-t-09"
  numero: 17
  partie: "Étude et représentation graphique"
  etoiles: 1
  types: [Calcul]
  mots_cles: [cosinus et sinus, fonction composée, étude de signe et de variations, équations trigonométriques]
  noeuds: [cx-pi]
  notions: [pi, composee]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    **1.** Déterminer le signe de $\cos(x)$ sur $[0\,;2\pi]$, puis dresser le tableau de signes correspondant.

    **2.** Faire de même pour $\sin(x)$ sur $[0\,;2\pi]$.

    **3.** En déduire le signe de $\sin(x)\cos(x)$ sur $[0\,;2\pi]$.

    **4.** Résoudre sur $[0\,;2\pi]$ l'inéquation $\sin(x)\cos(x)\geqslant 0$.
  corrige: |
    **1.** Le cosinus est l'abscisse du point du cercle : il est positif sur le premier et le quatrième quadrant, c'est-à-dire pour $x<\dfrac{\pi}{2}$ et $x>\dfrac{3\pi}{2}$.

    ![Figure](documents/figures/c6d5b1ab98026afb.svg)

    **2.** Le sinus est l'ordonnée : il est positif au-dessus de l'axe horizontal, donc sur $[0\,;\pi]$.

    ![Figure](documents/figures/5b7717232ac71dee.svg)

    **3.** On combine les deux lignes précédentes dans un même tableau, en faisant figurer les trois valeurs remarquables $\dfrac{\pi}{2}$, $\pi$ et $\dfrac{3\pi}{2}$.

    ![Figure](documents/figures/88f6360757101419.svg)

    **4.** On lit la dernière ligne du tableau : 
    $$\boxed{S=\left[0\,;\frac{\pi}{2}\right]\cup\left[\pi\,;\frac{3\pi}{2}\right]}$$
     *On peut le retrouver autrement : $\sin(x)\cos(x)=\dfrac{1}{2}\sin(2x)$, qui est positif lorsque $2x$ appartient à $[0\,;\pi]$ ou à $[2\pi\,;3\pi]$.*
