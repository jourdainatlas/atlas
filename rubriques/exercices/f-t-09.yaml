  mots_cles: [cosinus et sinus, périodicité]
  noeuds: [cx-pi]
  notions: [pi]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 114 et n° 113"
  page_enonce: 13
  page_corrige: 29
  enonce: |
    *Périodicité d'une somme.* Une fonction $f$ définie sur $\mathbb{R}$ est dite périodique s'il existe un réel $T>0$ tel que $f(x+T)=f(x)$ pour tout réel $x$.

    **1.** Soient $f$ et $g$ deux fonctions définies sur $\mathbb{R}$, $T$ et $T'$ deux réels strictement positifs. On suppose que $f$ est $T$-périodique, que $g$ est $T'$-périodique et que $\dfrac{T}{T'}$ est rationnel. Montrer que $f+g$ est périodique.

    **2.** Soit $\alpha$ un nombre irrationnel. On pose, pour tout réel $x$, $f(x)=\cos(x)+\cos(\alpha x)$.

    **(a)** Montrer que le seul réel $x$ tel que $f(x)=2$ est $x=0$.

    **(b)** La fonction $f$ est-elle périodique ?
  corrige: |
    **1.** Comme $\frac{T}{T'}$ est un rationnel strictement positif, on peut écrire $\frac{T}{T'}=\frac{p}{q}$ avec $p$ et $q$ entiers strictement positifs, d'où $qT=pT'$. Posons $S=qT=pT'>0$. En appliquant $q$ fois la $T$-périodicité de $f$ (récurrence immédiate), on obtient $f(x+S)=f(x+qT)=f(x)$ ; de même, $g(x+S)=g(x+pT')=g(x)$. 
    $$\boxed{f+g \text{ est périodique, de période } S=qT=pT'.}$$
     *Exemple :* $x\mapsto\cos(2x)+\sin(3x)$ est somme de fonctions de périodes $\pi$ et $\frac{2\pi}{3}$, de rapport $\frac{3}{2}$ ; elle est $2\pi$-périodique.

    **2.** **(a)** Comme $\cos(x)\leqslant 1$ et $\cos(\alpha x)\leqslant 1$, on a $f(x)=2$ si et seulement si $\cos(x)=1$ et $\cos(\alpha x)=1$, c'est-à-dire s'il existe deux entiers $k$ et $m$ tels que $x=2k\pi$ et $\alpha x=2m\pi$. Si $x\neq 0$, alors $k\neq 0$ et $\alpha=\frac{\alpha x}{x}=\frac{2m\pi}{2k\pi}=\frac{m}{k}$ serait rationnel, ce qui est exclu. Donc $x=0$, et l'on vérifie que $f(0)=2$. 
    $$\boxed{f(x)=2\iff x=0}$$

    **(b)** Supposons $f$ périodique, de période $T>0$. Alors $f(T)=f(0+T)=f(0)=2$, donc $T=0$ d'après la question précédente : c'est absurde. 
    $$\boxed{f \text{ n'est pas périodique.}}$$

    ![Figure](documents/figures/a4bda8f78cd14fcc.svg)

    Pour $\alpha=\sqrt{2}$, cette courbe ressemble à une courbe périodique, et s'approche par moments de la valeur $2$ (en orange, $f\approx 1{,}967$ pour $x\approx 31{,}2$), mais elle n'atteint cette valeur qu'en $0$ et ne se répète jamais exactement.

    *Remarque.* La somme de deux fonctions périodiques n'est donc pas toujours périodique : l'hypothèse sur le rapport des périodes est essentielle. Une fonction comme $\cos(x)+\cos(\sqrt{2}\,x)$ est dite *presque périodique* ; elle s'approche de $2$ d'aussi près qu'on veut (on trouve $f\approx 1{,}999$ vers $x\approx 182{,}2$) sans jamais l'atteindre.
- id: "t-09-38"
  feuille: "f-t-09"
  numero: 38
  partie: "Pour aller plus loin"
