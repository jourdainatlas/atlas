    **(c)**

    ![Figure](documents/figures/83482afb16b5638c.svg)

    **2.** $g'(x)=2\sin(x)$, qui est du signe de $\sin(x)$ : positif sur $[0\,;\pi]$, négatif sur $[\pi\,;2\pi]$. Les valeurs sont $g(0)=1-2=-1$, $g(\pi)=1+2=3$ et $g(2\pi)=-1$.

