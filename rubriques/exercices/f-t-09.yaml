  enonce: |
    Montrer que, pour tout réel $x$ : 
    $$\cos\big(\sin(x)\big)>\sin\big(\cos(x)\big)$$
  corrige: |
    Fixons un réel $x$.

    *Étape 1 : une majoration.* On a 
    $$\big(|\sin(x)|+|\cos(x)|\big)^{2}=\sin^{2}(x)+\cos^{2}(x)+2|\sin(x)\cos(x)|=1+|\sin(2x)| \leqslant 2$$
     donc $|\sin(x)|+|\cos(x)|\leqslant\sqrt{2}$. Comme $\sqrt{2}\approx 1{,}414<\frac{\pi}{2}\approx 1{,}571$, il vient 
    $$|\sin(x)|+\cos(x)\leqslant|\sin(x)|+|\cos(x)|<\frac{\pi}{2} \qquad\text{soit}\qquad |\sin(x)|<\frac{\pi}{2}-\cos(x)$$

    *Étape 2 : se ramener à deux cosinus.* Par parité, $\cos\big(\sin(x)\big)=\cos\big(|\sin(x)| \big)$, et, d'après l'exercice 31, $\sin\big(\cos(x)\big)=\cos\left(\frac{\pi}{2}-\cos(x)\right)$.

    *Étape 3 : comparer.* Les réels $|\sin(x)|$ et $\frac{\pi}{2}-\cos(x)$ appartiennent tous deux à $[0\,;\pi]$, puisque $0\leqslant|\sin(x)|\leqslant 1$ et $\frac{\pi}{2}-1\leqslant\frac{\pi}{2}-\cos(x)\leqslant\frac{\pi}{2}+1<\pi$. Le cosinus étant strictement décroissant sur $[0\,;\pi]$, l'inégalité stricte de l'étape 1 donne 
    $$\cos\big(|\sin(x)|\big)>\cos\left(\frac{\pi}{2}-\cos(x)\right)$$

    $$\boxed{\text{Pour tout réel } x,\quad\cos\big(\sin(x)\big)>\sin\big(\cos(x)\big)}$$
     *Remarque.* Un calcul numérique montre que l'écart $\cos(\sin(x))-\sin(\cos(x))$ ne descend jamais en dessous de $0{,}107$ environ. Le piège de l'exercice est l'étape 3 : comparer $\cos(u)$ et $\cos(v)$ à partir de $u<v$ n'est légitime que si $u$ et $v$ sont dans un même intervalle où le cosinus est monotone, ce qu'il faut vérifier.
