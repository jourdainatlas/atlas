  enonce: |
    Déterminer le maximum et le minimum sur $\mathbb{R}$ de la fonction $x\mapsto\cos(x)-\cos^{2}(x)$.
  corrige: |
    Posons $t=\cos(x)$. Lorsque $x$ décrit $\mathbb{R}$, le réel $t$ décrit exactement l'intervalle $[-1\,;1]$, et l'expression devient $g(t)=t-t^{2}$. Il s'agit donc de trouver le maximum et le minimum du trinôme $g$ sur $[-1\,;1]$. Sous forme canonique : 
    $$g(t)=\frac{1}{4}-\left(t-\frac{1}{2}\right)^{2}$$
     Le maximum de $g$ vaut $\frac{1}{4}$, atteint en $t=\frac{1}{2}\in[-1\,;1]$. Sur $[-1\,;1]$, la quantité $\left(t-\frac{1}{2}\right)^{2}$ est la plus grande pour le point le plus éloigné de $\frac{1}{2}$, c'est-à-dire $t=-1$ : le minimum vaut $g(-1)=-2$. 
    $$\boxed{\max_{\mathbb{R}}\left(\cos-\cos^{2}\right)=\frac{1}{4}\ \text{ en } x=\pm\frac{\pi}{3}+2k\pi \qquad\text{et}\qquad\min_{\mathbb{R}}\left(\cos-\cos^{2}\right)=-2\ \text{ en } x=\pi+2k\pi}$$

    ![Figure](documents/figures/bd24928f6f4fbf4f.svg)

    Sur cette courbe, on lit que la fonction oscille entre $-2$, atteint lorsque $\cos(x)=-1$, et $\frac{1}{4}$, atteint deux fois par période lorsque $\cos(x)=\frac{1}{2}$.

    *Remarque.* L'erreur la plus répandue est d'oublier que $t$ ne parcourt que $[-1\,;1]$ : sur $\mathbb{R}$ tout entier, le trinôme $t-t^{2}$ n'a pas de minimum, et c'est la borne $t=-1$ qui le fournit ici. Le changement de variable $t=\cos(x)$ est la même idée qu'à la partie B de l'exercice 34.
