- id: "t-09-19"
  feuille: "f-t-09"
  numero: 19
  partie: "Étude et représentation graphique"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [cosinus et sinus, périodicité, parité, lecture graphique, dérivée, fonction composée, étude de signe et de variations]
  noeuds: [cx-pi, ar-deriv]
  notions: [pi, derivable, composee]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Soit $f$ la fonction définie sur $\mathbb{R}$ par $f(x)=\cos(2x)$.

    **1.** Démontrer que $f$ est périodique de période $\pi$.

    **2.** Démontrer que $f$ est paire.

    **3.** En déduire qu'il suffit d'étudier $f$ sur l'intervalle $\left[0\,;\dfrac{\pi}{2}\right]$, en précisant les transformations qui permettront ensuite d'obtenir toute la courbe.

    **4.** Calculer $f'(x)$, étudier son signe sur $\left[0\,;\dfrac{\pi}{2}\right]$, puis dresser le tableau de variations de $f$ sur cet intervalle.

    **5.** Tracer la courbe de $f$ sur $\left[0\,;\dfrac{\pi}{2}\right]$, puis la compléter par symétrie sur $\left[-\dfrac{\pi}{2}\,;\dfrac{\pi}{2}\right]$, puis par translations sur $[-2\pi\,;2\pi]$.
  corrige: |
    **1.** Pour tout réel $x$ : 
    $$f(x+\pi)=\cos\big(2(x+\pi)\big)=\cos\big(2x+2\pi\big)=\cos(2x)=f(x)$$

    $$\boxed{f \text{ est périodique de période } \pi}$$

    **2.** 
    $$f(-x)=\cos(-2x)=\cos(2x)=f(x) \qquad \Longrightarrow \qquad \boxed{f \text{ est paire}}$$

    **3.** La périodicité permet de se limiter à un intervalle de longueur $\pi$, par exemple $\left[-\dfrac{\pi}{2}\,;\dfrac{\pi}{2}\right]$. La parité permet de diviser encore cet intervalle par deux. 
    $$\boxed{\text{Il suffit d'étudier } f \text{ sur } \left[0\,;\frac{\pi}{2}\right]}$$
     On complète ensuite par **symétrie par rapport à l'axe des ordonnées** sur $\left[-\dfrac{\pi}{2}\,;\dfrac{\pi}{2}\right]$, puis par **translations de vecteur** $\pi\,\vec{\imath}$ sur $\mathbb{R}$.

    **4.** $f'(x)=-2\sin(2x)$. Sur $\left[0\,;\dfrac{\pi}{2}\right]$, le réel $2x$ décrit $[0\,;\pi]$, intervalle sur lequel le sinus est positif. Donc $f'(x)\leqslant 0$.

    ![Figure](documents/figures/c1c591a126e8803c.svg)

    **5.**

    ![Figure](documents/figures/1a98bb2e4898e6a0.svg)

    En rouge la portion réellement étudiée, en gris tout le reste, obtenu sans aucun calcul supplémentaire.
- id: "t-09-20"
  feuille: "f-t-09"
  numero: 20
  partie: "Étude et représentation graphique"
  etoiles: 2
  types: [Calcul]
  mots_cles: [cosinus et sinus, périodicité, lecture graphique, fonction composée]
  noeuds: [cx-pi]
  notions: [pi, composee]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    On considère les quatre fonctions définies sur $\mathbb{R}$ par : 
    $$f(x)=\sin(x) \quad ; \quad g(x)=3\sin(x) \quad ; \quad h(x)=\sin(3x) \quad ; \quad k(x)=\sin(x)-2$$

    **1.** Pour chacune, déterminer le maximum, le minimum et la période.

    **2.** Tracer les quatre courbes dans un même repère, sur l'intervalle $[-\pi\,;\pi]$.

    **3.** Décrire la transformation géométrique qui permet de passer de la courbe de $f$ à celle de $g$, puis à celle de $k$.

    **4.** Soient $a$ et $b$ deux réels strictement positifs. Donner, en fonction de $a$ et $b$, le maximum, le minimum et la période de $x\mapsto a\sin(bx)$.
  corrige: |
    **1.**

    ```tableau
    **Fonction** ¦ **Maximum** ¦ **Minimum** ¦ **Période**
    $f(x)=\sin(x)$ ¦ $1$ ¦ $-1$ ¦ $2\pi$
    $g(x)=3\sin(x)$ ¦ $3$ ¦ $-3$ ¦ $2\pi$
    $h(x)=\sin(3x)$ ¦ $1$ ¦ $-1$ ¦ $\dfrac{2\pi}{3}$
    $k(x)=\sin(x)-2$ ¦ $-1$ ¦ $-3$ ¦ $2\pi$
    ```

    **2.**

    ![Figure](documents/figures/afb84b23e0fc8964.svg)

    **3.** 
    $$\boxed{\begin{array}{l} \text{De } f \text{ à } g : \text{ dilatation verticale de facteur } 3 \\[1mm] \text{De } f \text{ à } k : \text{ translation de vecteur } -2\,\vec{\jmath} \end{array}}$$

    **4.** 
    $$\boxed{\text{maximum } a \quad ; \quad \text{minimum } -a \quad ; \quad \text{période } \frac{2\pi}{b}}$$
     Le coefficient $a$ règle l'*amplitude*, le coefficient $b$ règle la *fréquence* : plus $b$ est grand, plus les oscillations sont resserrées.
- id: "t-09-21"
  feuille: "f-t-09"
  numero: 21
  partie: "Étude et représentation graphique"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [cosinus et sinus, périodicité, parité, lecture graphique, dérivée, fonction composée, étude de signe et de variations, formules trigonométriques]
  noeuds: [cx-pi, ar-deriv]
  notions: [pi, derivable, composee]
  page_enonce: 6
  page_corrige: 14
  enonce: |
    Soit $f$ la fonction définie sur $\mathbb{R}$ par $f(x)=2\cos(x)+\cos(2x)$.

    **1.** Démontrer que $f$ est paire et périodique de période $2\pi$. En déduire l'intervalle d'étude que l'on peut choisir.

    **2.** Démontrer que pour tout réel $x$, $f'(x)=-2\sin(x)\big(1+2\cos(x)\big)$.

    *On pourra utiliser l'identité $\sin(2x)=2\sin(x)\cos(x)$.*

    **3.** Étudier le signe de $f'(x)$ sur $[0\,;\pi]$, en dressant un tableau de signes à deux facteurs.

    **4.** Dresser le tableau de variations de $f$ sur $[0\,;\pi]$, en donnant les valeurs exactes de $f(0)$, $f\left(\dfrac{2\pi}{3}\right)$ et $f(\pi)$.

    **5.** Tracer la courbe de $f$ sur $[0\,;\pi]$, puis la compléter sur $[-2\pi\,;2\pi]$.
  corrige: |
    **1.** Parité. Pour tout réel $x$ : 
    $$f(-x)=2\cos(-x)+\cos(-2x)=2\cos(x)+\cos(2x)=f(x)$$
     Périodicité. Les fonctions $x\mapsto\cos(x)$ et $x\mapsto\cos(2x)$ sont toutes deux $2\pi$-périodiques, donc leur somme l'est aussi : 
    $$f(x+2\pi)=2\cos(x+2\pi)+\cos(2x+4\pi)=2\cos(x)+\cos(2x)=f(x)$$

    $$\boxed{f \text{ est paire et } 2\pi\text{-périodique : il suffit de l'étudier sur } [0\,;\pi]}$$

    **2.** On dérive, puis on utilise $\sin(2x)=2\sin(x)\cos(x)$ : 
    $$\begin{aligned} f'(x) &= -2\sin(x)-2\sin(2x) \\ &= -2\sin(x)-4\sin(x)\cos(x) \\ &= \boxed{-2\sin(x)\big(1+2\cos(x)\big)} \end{aligned}$$

    **3.** Sur $[0\,;\pi]$, le facteur $\sin(x)$ est positif, et il ne s'annule qu'aux bornes. Le facteur $1+2\cos(x)$ s'annule lorsque $\cos(x)=-\dfrac{1}{2}$, c'est-à-dire pour $x=\dfrac{2\pi}{3}$ ; il est positif avant, négatif après.

    ![Figure](documents/figures/d2a962d716d7c5d2.svg)

    **4.** Les valeurs demandées sont : 
    $$f(0)=2\times 1+1=\boxed{3}$$

    $$f\left(\frac{2\pi}{3}\right)=2\times\left(-\frac{1}{2}\right) +\cos\left(\frac{4\pi}{3}\right)=-1-\frac{1}{2}=\boxed{-\frac{3}{2}}$$

    $$f(\pi)=2\times(-1)+\cos(2\pi)=-2+1=\boxed{-1}$$

    ![Figure](documents/figures/904fe568598df6fb.svg)

    **5.**

    ![Figure](documents/figures/d0fc4d94fb51277d.svg)

    En rouge la portion étudiée, en gris la courbe complète, obtenue par symétrie puis translations.
- id: "t-09-22"
  feuille: "f-t-09"
  numero: 22
  partie: "Étude et représentation graphique"
  etoiles: 2
  types: [Calcul]
  mots_cles: [périodicité, parité, lecture graphique, étude de signe et de variations, équations trigonométriques]
  noeuds: [cx-pi]
  notions: []
  page_enonce: 7
  page_corrige: 15
  enonce: |
    Une fonction $f$, définie sur $\mathbb{R}$, est **impaire** et **périodique de période** $2\pi$. Son tableau de variations sur $[0\,;\pi]$ est le suivant.

    ![Figure](documents/figures/614aabe74e508256.svg)

    **1.** Que valent $f(0)$, $f\left(\dfrac{\pi}{2}\right)$ et $f(\pi)$ ?

    **2.** Déterminer $f\left(-\dfrac{\pi}{2}\right)$ et $f\left(\dfrac{5\pi}{2}\right)$, en précisant la propriété utilisée à chaque fois.

    **3.** Tracer l'allure de la courbe de $f$ sur $[0\,;\pi]$, puis la compléter sur $[-2\pi\,;2\pi]$.

    **4.** Dresser le tableau de variations de $f$ sur $[-\pi\,;\pi]$.

    **5.** Combien l'équation $f(x)=1$ admet-elle de solutions sur $[-2\pi\,;2\pi]$ ?
  corrige: |
    **1.** Le tableau donne directement : 
    $$\boxed{f(0)=0 \qquad ; \qquad f\left(\frac{\pi}{2}\right)=2 \qquad ; \qquad f(\pi)=0}$$

    **2.** La fonction étant impaire : 
    $$\boxed{f\left(-\frac{\pi}{2}\right)=-f\left(\frac{\pi}{2}\right)=-2}$$
     La fonction étant $2\pi$-périodique : 
    $$\boxed{f\left(\frac{5\pi}{2}\right)=f\left(\frac{5\pi}{2}-2\pi\right) =f\left(\frac{\pi}{2}\right)=2}$$

    **3.** L'imparité donne une symétrie par rapport à l'origine, puis la périodicité une répétition tous les $2\pi$.

    ![Figure](documents/figures/5f4da1a465ee8139.svg)

    *L'allure obtenue est celle de $x\mapsto 2\sin(x)$, qui vérifie effectivement toutes les conditions de l'énoncé.*

    **4.** Sur $[-\pi\,;0]$, l'imparité inverse le sens de variation par rapport à $[0\,;\pi]$ : la fonction décroît puis croît, en passant par le minimum $-2$ en $-\dfrac{\pi}{2}$.

    ![Figure](documents/figures/db16a23684e80ade.svg)

    **5.** Sur une période, la droite $y=1$ coupe la courbe deux fois. L'intervalle $[-2\pi\,;2\pi]$ contient deux périodes complètes : 
    $$\boxed{\text{L'équation } f(x)=1 \text{ admet } 4 \text{ solutions sur } [-2\pi\,;2\pi]}$$
- id: "t-09-23"
  feuille: "f-t-09"
  numero: 23
  titre: "QCM"
  partie: "Exercices de synthèse"
  etoiles: 1
  types: [QCM, Démonstration]
  mots_cles: [cosinus et sinus, périodicité, parité, lecture graphique, dérivée, fonction composée, tangente, limite]
  noeuds: [cx-pi, ar-deriv]
  notions: [pi, derivable, composee]
  page_enonce: 8
  page_corrige: 16
  enonce: |
    Pour chaque question, une seule réponse est exacte. La justifier.

    ```tableau
    **Question** ¦ **Réponse A** ¦ **Réponse B** ¦ **Réponse C**
    1. La dérivée de la fonction cosinus est : ¦ $\sin$ ¦ $-\sin$ ¦ $\cos$
    2. $\cos\left(\dfrac{2\pi}{3}\right)$ vaut : ¦ $-\dfrac{1}{2}$ ¦ $\dfrac{1}{2}$ ¦ $-\dfrac{\sqrt{3}}{2}$
    3. La dérivée de $x\mapsto\sin(3x)$ est : ¦ $\cos(3x)$ ¦ $3\cos(3x)$ ¦ $-3\cos(3x)$
    4. La période de $x\mapsto\cos(4x)$ est : ¦ $4\pi$ ¦ $2\pi$ ¦ $\dfrac{\pi}{2}$
    5. $\displaystyle\lim_{x\to 0}\dfrac{\sin(x)}{x}$ vaut : ¦ $0$ ¦ $1$ ¦ n'existe pas
    6. La fonction sinus est : ¦ paire ¦ impaire ¦ ni l'une ni l'autre
    7. Pour tout réel $x$, $\cos^{2}(x)+\sin^{2}(x)$ vaut : ¦ $1$ ¦ $2$ ¦ $\cos(2x)$
    8. La tangente à la courbe du sinus en $0$ a pour équation : ¦ $y=0$ ¦ $y=x$ ¦ $y=1$
    9. Sur $\left]\dfrac{\pi}{2}\,;\pi\right[$, la fonction cosinus est : ¦ positive ¦ négative ¦ de signe variable
    10. La courbe de la fonction cosinus est symétrique par rapport : ¦ à l'origine ¦ à l'axe des ordonnées ¦ à la droite $y=x$
    ```
  corrige: |
    ```tableau
    **Question** ¦ **Réponse** ¦ **Justification**
    1 ¦ **B** ¦ C'est le théorème 1 : $\cos'=-\sin$. Le signe moins s'oublie facilement.
    2 ¦ **A** ¦ $\dfrac{2\pi}{3}=\pi-\dfrac{\pi}{3}$, donc le cosinus vaut l'opposé de $\cos\left(\dfrac{\pi}{3}\right)=\dfrac{1}{2}$.
    3 ¦ **B** ¦ Avec $u=3x$ et $u'=3$, la proposition 4 donne $3\cos(3x)$.
    4 ¦ **C** ¦ La période de $x\mapsto\cos(bx)$ vaut $\dfrac{2\pi}{b}$, soit ici $\dfrac{2\pi}{4}=\dfrac{\pi}{2}$.
    5 ¦ **B** ¦ C'est la proposition 3, qui exprime le nombre dérivé du sinus en $0$.
    6 ¦ **B** ¦ $\sin(-x)=-\sin(x)$ : la courbe est symétrique par rapport à l'origine.
    7 ¦ **A** ¦ C'est la proposition 1, conséquence du théorème de Pythagore dans le cercle trigonométrique.
    8 ¦ **B** ¦ $f(0)=0$ et $f'(0)=\cos(0)=1$, d'où $y=x$.
    9 ¦ **B** ¦ Sur cet intervalle le point du cercle est dans le deuxième quadrant : son abscisse est négative.
    10 ¦ **B** ¦ Le cosinus est une fonction paire. La réponse A correspondrait au sinus.
    ```
- id: "t-09-24"
  feuille: "f-t-09"
  numero: 24
  titre: "Vrai ou faux"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [cosinus et sinus, périodicité, parité, lecture graphique, dérivée, fonction composée, tangente, équations trigonométriques]
  noeuds: [cx-pi, ar-deriv]
  notions: [pi, derivable, composee]
  page_enonce: 8
  page_corrige: 17
  enonce: |
    Chacune des affirmations suivantes est-elle vraie ou fausse ? Justifier la réponse : par une démonstration si l'affirmation est vraie, par un contre-exemple sinon.

    **1.** Pour tout réel $x$, $\cos(x)\leqslant 1$.

    **2.** Pour tout réel $x$, $\sin(2x)=2\sin(x)$.

    **3.** La fonction $x\mapsto\cos(x)$ est décroissante sur $\mathbb{R}$.

    **4.** Toute fonction périodique de période $2\pi$ est aussi périodique de période $4\pi$.

    **5.** La somme d'une fonction paire et d'une fonction impaire est toujours paire.

    **6.** La dérivée d'une fonction $2\pi$-périodique est $2\pi$-périodique.

    **7.** L'équation $\cos(x)=2$ admet une infinité de solutions.

    **8.** Pour tout réel $x$, $\sin(x)\leqslant x$.

    **9.** La fonction $x\mapsto x\sin(x)$ est paire.

    **10.** La courbe de la fonction sinus admet une tangente horizontale en $\dfrac{\pi}{2}$.
  corrige: |
    **1.** **Vraie**. C'est la proposition 1 : le cosinus est l'abscisse d'un point du cercle de rayon $1$, donc $-1\leqslant\cos(x)\leqslant 1$.

    **2.** **Fausse**. Contre-exemple avec $x=\dfrac{\pi}{2}$ : 
    $$\sin(\pi)=0 \qquad \text{alors que} \qquad 2\sin\left(\frac{\pi}{2}\right)=2$$
     La formule correcte est $\sin(2x)=2\sin(x)\cos(x)$.

    **3.** **Fausse**. Le cosinus est décroissant sur $[0\,;\pi]$, mais croissant sur $[\pi\,;2\pi]$. Contre-exemple : $\cos(\pi)=-1$ et $\cos(2\pi)=1$, donc la fonction croît entre ces deux valeurs.

    **4.** **Vraie**. Si $f(x+2\pi)=f(x)$ pour tout $x$, alors en appliquant deux fois : 
    $$f(x+4\pi)=f\big((x+2\pi)+2\pi\big)=f(x+2\pi)=f(x)$$
     *Attention : $4\pi$ est une période, mais ce n'est pas *la* plus petite.*

    **5.** **Fausse**. Contre-exemple avec $f(x)=\cos(x)$ (paire) et $g(x)=\sin(x)$ (impaire) : leur somme $\cos(x)+\sin(x)$ n'est ni paire ni impaire, comme l'a montré l'exercice 3.

    **6.** **Vraie**. Si $f(x+2\pi)=f(x)$ pour tout $x$, on dérive les deux membres. La dérivée du membre de gauche vaut $f'(x+2\pi)$ d'après la dérivation d'une composée, d'où $f'(x+2\pi)=f'(x)$.

    **7.** **Fausse**. Le cosinus est toujours inférieur ou égal à $1$ : l'équation $\cos(x)=2$ n'admet *aucune* solution.

    **8.** **Fausse**. L'inégalité $\sin(x)\leqslant x$ n'est vraie que pour $x\geqslant 0$, comme l'établit l'exercice 30. Contre-exemple avec $x=-\dfrac{\pi}{2}$ : 
    $$\sin\left(-\frac{\pi}{2}\right)=-1 \qquad \text{alors que} \qquad -\frac{\pi}{2}\approx -1{,}57$$
     On a donc $\sin(x)>x$.

    **9.** **Vraie**. C'est le produit de deux fonctions impaires : 
    $$f(-x)=(-x)\sin(-x)=(-x)\times\left(-\sin(x)\right)=x\sin(x)=f(x)$$

    **10.** **Vraie**. $\sin'\left(\dfrac{\pi}{2}\right)=\cos\left(\dfrac{\pi}{2}\right)=0$ : la tangente est horizontale, ce qui est cohérent avec le maximum atteint en ce point.
- id: "t-09-25"
  feuille: "f-t-09"
  numero: 25
  titre: "Type Bac"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Type Bac, Démonstration, Calcul]
  mots_cles: [cosinus et sinus, périodicité, lecture graphique, dérivée, tangente, étude de signe et de variations, équations trigonométriques]
  noeuds: [cx-pi, ar-deriv]
  notions: [pi, derivable]
  page_enonce: 9
  page_corrige: 17
  enonce: |
    Soit $f$ la fonction définie sur $[0\,;2\pi]$ par $f(x)=x+\cos(x)$.

    **1.** Calculer $f'(x)$.

    **2.** Démontrer que $f'(x)\geqslant 0$ pour tout $x$ de $[0\,;2\pi]$, et préciser la seule valeur pour laquelle $f'(x)=0$.

    **3.** En déduire le sens de variation de $f$ sur $[0\,;2\pi]$, puis dresser son tableau de variations en donnant les valeurs exactes de $f(0)$ et $f(2\pi)$.

    **4.** Déterminer une équation de la tangente à la courbe de $f$ au point d'abscisse $\dfrac{\pi}{2}$. Que remarque-t-on ?

    **5.** La fonction $f$ est-elle périodique ? Justifier.

    **6.** Démontrer que l'équation $f(x)=4$ admet une unique solution sur $[0\,;2\pi]$, puis en donner une valeur approchée au centième à l'aide de la calculatrice.
  corrige: |
    **1.** 
    $$\boxed{f'(x)=1-\sin(x)}$$

    **2.** Pour tout réel $x$, $\sin(x)\leqslant 1$, donc $1-\sin(x)\geqslant 0$ : 
    $$\boxed{f'(x)\geqslant 0 \text{ sur } [0\,;2\pi]}$$
     L'égalité a lieu si et seulement si $\sin(x)=1$, ce qui, sur $[0\,;2\pi]$, ne se produit qu'en un seul point : 
    $$\boxed{f'(x)=0 \text{ uniquement pour } x=\frac{\pi}{2}}$$

    **3.** La dérivée est positive et ne s'annule qu'en un point isolé : la décroissance n'est jamais interrompue.

    ![Figure](documents/figures/979a77ff8af61997.svg)

    $$f(0)=0+\cos(0)=\boxed{1} \qquad ; \qquad f(2\pi)=2\pi+\cos(2\pi)=\boxed{2\pi+1}$$

    $$\boxed{f \text{ est strictement croissante sur } [0\,;2\pi]}$$

    **4.** On calcule $f\left(\dfrac{\pi}{2}\right)=\dfrac{\pi}{2}+0=\dfrac{\pi}{2}$ et $f'\left(\dfrac{\pi}{2}\right)=0$ : 
    $$\boxed{T : y=\frac{\pi}{2}}$$

    $$\boxed{\text{La tangente est horizontale, sans que } f \text{ y admette d'extremum}}$$
     C'est le point important : la dérivée s'annule sans changer de signe. La courbe présente en ce point un simple palier avant de poursuivre sa montée.

    **5.** Non. On a $f(0)=1$, tandis que $f(2\pi)=2\pi+1\neq 1$ : la fonction ne reprend pas la même valeur après un tour. 
    $$\boxed{f \text{ n'est pas périodique}}$$
     Le terme $x$ fait croître la fonction indéfiniment, alors que seul $\cos(x)$ est périodique.

    **6.** La fonction $f$ est continue et strictement croissante sur $[0\,;2\pi]$, avec $f(0)=1$ et $f(2\pi)=2\pi+1\approx 7{,}28$. Comme $4$ est compris entre ces deux valeurs, le théorème des valeurs intermédiaires garantit : 
    $$\boxed{\text{L'équation } f(x)=4 \text{ admet une unique solution sur } [0\,;2\pi]}$$
     La calculatrice donne alors : 
    $$\boxed{x\approx 4{,}35}$$
     Vérification : $4{,}35+\cos(4{,}35)\approx 4{,}35-0{,}35\approx 4$.
- id: "t-09-26"
  feuille: "f-t-09"
  numero: 26
  titre: "Type Bac"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Type Bac, Calcul]
  mots_cles: [cosinus et sinus, périodicité, dérivée, étude de signe et de variations, équations trigonométriques, modélisation]
  noeuds: [cx-pi, ar-deriv]
  notions: [pi, derivable]
  page_enonce: 9
  page_corrige: 18
  enonce: |
    Dans un port, la hauteur d'eau, exprimée en mètres, est modélisée par la fonction $h$ définie sur $[0\,;24]$ par : 
    $$h(t)=5+3\sin\left(\frac{\pi t}{6}\right)$$
     où $t$ désigne le temps écoulé, en heures, depuis minuit.

    **1.** Calculer $h(0)$, $h(3)$ et $h(9)$. Interpréter chacun de ces résultats.

    **2.** Démontrer que $h$ est périodique de période $12$. Interpréter dans le contexte.

    **3.** Calculer $h'(t)$, puis étudier son signe sur $[0\,;12]$.

    **4.** Dresser le tableau de variations de $h$ sur $[0\,;12]$. À quelles heures observe-t-on la marée haute et la marée basse ?

    **5.** Un navire ne peut entrer dans le port que si la hauteur d'eau atteint au moins $6{,}5$ mètres. Résoudre l'inéquation $h(t)\geqslant 6{,}5$ sur $[0\,;12]$.

    **6.** En déduire les créneaux horaires d'accès au port sur une journée complète.
  corrige: |
    **1.** 
    $$h(0)=5+3\sin(0)=\boxed{5 \text{ m}}$$

    $$h(3)=5+3\sin\left(\frac{\pi}{2}\right)=5+3=\boxed{8 \text{ m}}$$

    $$h(9)=5+3\sin\left(\frac{3\pi}{2}\right)=5-3=\boxed{2 \text{ m}}$$

    $$\boxed{\begin{array}{l} \text{À minuit, la hauteur d'eau est de } 5 \text{ m} \\[1mm] \text{À } 3 \text{ h, elle est maximale : c'est la marée haute} \\[1mm] \text{À } 9 \text{ h, elle est minimale : c'est la marée basse} \end{array}}$$

    **2.** Pour tout $t$ : 
    $$h(t+12)=5+3\sin\left(\frac{\pi(t+12)}{6}\right) =5+3\sin\left(\frac{\pi t}{6}+2\pi\right)=h(t)$$

    $$\boxed{h \text{ est périodique de période } 12}$$

    $$\boxed{\text{Le cycle des marées se répète toutes les } 12 \text{ heures}}$$

    **3.** Avec $u(t)=\dfrac{\pi t}{6}$ et $u'(t)=\dfrac{\pi}{6}$ : 
    $$h'(t)=3\times\frac{\pi}{6}\cos\left(\frac{\pi t}{6}\right) =\boxed{\frac{\pi}{2}\cos\left(\frac{\pi t}{6}\right)}$$
     Sur $[0\,;12]$, le réel $\dfrac{\pi t}{6}$ décrit $[0\,;2\pi]$. Le cosinus y est positif pour $\dfrac{\pi t}{6}<\dfrac{\pi}{2}$, c'est-à-dire $t<3$, puis négatif jusqu'à $\dfrac{\pi t}{6}=\dfrac{3\pi}{2}$, soit $t=9$, puis à nouveau positif.

    **4.**

    ![Figure](documents/figures/55e6b2e0957a1afa.svg)

    $$\boxed{\text{Marée haute à } 3 \text{ h} \qquad ; \qquad \text{marée basse à } 9 \text{ h}}$$

    **5.** 
    $$5+3\sin\left(\frac{\pi t}{6}\right)\geqslant 6{,}5 \iff \sin\left(\frac{\pi t}{6}\right)\geqslant\frac{1}{2}$$
     Posons $X=\dfrac{\pi t}{6}$, qui décrit $[0\,;2\pi]$ lorsque $t$ décrit $[0\,;12]$. On sait que $\sin(X)\geqslant\dfrac{1}{2}$ pour $X\in\left[\dfrac{\pi}{6}\,; \dfrac{5\pi}{6}\right]$, d'où : 
    $$\frac{\pi}{6}\leqslant\frac{\pi t}{6}\leqslant\frac{5\pi}{6} \iff 1\leqslant t\leqslant 5$$

    $$\boxed{S=[1\,;5]}$$

    **6.** La période valant $12$ heures, le phénomène se reproduit à l'identique entre $12$ h et minuit : 
    $$\boxed{\text{Le port est accessible de } 1 \text{ h à } 5 \text{ h, puis de } 13 \text{ h à } 17 \text{ h}}$$
     Soit huit heures d'accès par jour.
- id: "t-09-27"
  feuille: "f-t-09"
  numero: 27
  titre: "Type Bac"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Type Bac, Démonstration, Calcul]
  mots_cles: [cosinus et sinus, périodicité, parité, lecture graphique, dérivée, fonction composée, étude de signe et de variations, formules trigonométriques]
  noeuds: [cx-pi, ar-deriv]
  notions: [pi, derivable, composee]
  page_enonce: 9
  page_corrige: 19
  enonce: |
    Soit $f$ la fonction définie sur $\mathbb{R}$ par $f(x)=\sin^{2}(x)$.

    **1.** Démontrer que $f$ est paire.

    **2.** Démontrer que $f$ est périodique de période $\pi$.

    *On pourra utiliser l'identité $\sin(x+\pi)=-\sin(x)$.*

    **3.** En déduire qu'il suffit d'étudier $f$ sur $\left[0\,;\dfrac{\pi}{2}\right]$.

    **4.** Démontrer que $f'(x)=\sin(2x)$.

    **5.** Étudier le signe de $f'(x)$ sur $\left[0\,;\dfrac{\pi}{2}\right]$, puis dresser le tableau de variations de $f$ sur cet intervalle.

    **6.** Tracer la courbe de $f$ sur $[-\pi\,;\pi]$.

    **7.** Démontrer que pour tout réel $x$, $f(x)=\dfrac{1-\cos(2x)}{2}$. Ce résultat était-il prévisible d'après les questions 2 et 5 ?
  corrige: |
    **1.** 
    $$f(-x)=\sin^{2}(-x)=\left(-\sin(x)\right)^{2}=\sin^{2}(x)=f(x)$$

    $$\boxed{f \text{ est paire}}$$
     *Le carré efface le signe : une fonction impaire élevée au carré devient paire.*

    **2.** Pour tout réel $x$ : 
    $$f(x+\pi)=\sin^{2}(x+\pi)=\left(-\sin(x)\right)^{2}=\sin^{2}(x)=f(x)$$

    $$\boxed{f \text{ est périodique de période } \pi}$$

    **3.** La périodicité permet de se limiter à un intervalle de longueur $\pi$, par exemple $\left[-\dfrac{\pi}{2}\,;\dfrac{\pi}{2}\right]$, et la parité de le réduire de moitié. 
    $$\boxed{\text{Il suffit d'étudier } f \text{ sur } \left[0\,;\frac{\pi}{2}\right]}$$

    **4.** On dérive la composée $f=u^{2}$ avec $u=\sin(x)$ : 
    $$f'(x)=2\sin(x)\cos(x)=\boxed{\sin(2x)}$$

    **5.** Sur $\left[0\,;\dfrac{\pi}{2}\right]$, le réel $2x$ décrit $[0\,;\pi]$, où le sinus est positif.

    ![Figure](documents/figures/5dc367486f4f1111.svg)

    **6.**

    ![Figure](documents/figures/9b814b4c2f234fd4.svg)

    La courbe reste au-dessus de l'axe des abscisses, ce qui est logique puisque $f$ est un carré.

    **7.** On part de l'identité $\cos(2x)=1-2\sin^{2}(x)$, vue en Première. En isolant $\sin^{2}(x)$ : 
    $$2\sin^{2}(x)=1-\cos(2x) \qquad \text{d'où} \qquad \boxed{f(x)=\frac{1-\cos(2x)}{2}}$$

    $$\boxed{\text{Oui, ce résultat était prévisible}}$$
     En effet, la question 2 a établi que $f$ est $\pi$-périodique, ce qui est la période de $x\mapsto\cos(2x)$ ; et la question 5 montre que $f$ oscille entre $0$ et $1$, ce qui est exactement l'amplitude de $\dfrac{1-\cos(2x)}{2}$. La courbe de $f$ n'est donc qu'une sinusoïde, remontée d'une demi-unité et d'amplitude divisée par deux.
- id: "t-09-28"
  feuille: "f-t-09"
  numero: 28
  titre: "Type Bac"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Type Bac, Démonstration, Calcul]
  mots_cles: [cosinus et sinus, lecture graphique, fonction composée, intégrale, équations trigonométriques]
  noeuds: [cx-pi, ar-riemann]
  notions: [pi, composee]
  page_enonce: 10
  page_corrige: 21
  enonce: |
    On note $\mathcal{C}$ la courbe de la fonction sinus et $\mathcal{D}$ le domaine du plan compris entre $\mathcal{C}$, l'axe des abscisses et les droites d'équations $x=0$ et $x=\pi$.

    **1.** Justifier que $\sin(x)\geqslant 0$ pour tout $x$ de $[0\,;\pi]$.

    **2.** En déduire que l'aire de $\mathcal{D}$, exprimée en unités d'aire, vaut $\displaystyle\int_{0}^{\pi}\sin(x)\,\mathrm{d}x$, puis la calculer.

    **3.** Calculer $\displaystyle\int_{0}^{2\pi}\sin(x)\,\mathrm{d}x$. Le résultat obtenu représente-t-il une aire ? Expliquer.

    **4.** En déduire l'aire totale comprise entre $\mathcal{C}$ et l'axe des abscisses sur $[0\,;2\pi]$.

    **5.** La *valeur moyenne* de $f$ sur $[a\,;b]$ est le réel $\mu=\dfrac{1}{b-a}\displaystyle\int_{a}^{b}f(x)\,\mathrm{d}x$. Calculer la valeur moyenne du sinus sur $[0\,;\pi]$, puis en donner une valeur approchée au millième.

    **6.** Comparer cette valeur moyenne au maximum de la fonction sinus. Le résultat était-il prévisible ?

    **7.** Sans calcul, donner la valeur moyenne du sinus sur $[0\,;2\pi]$. Justifier.
  corrige: |
    **1.** Pour $x\in[0\,;\pi]$, le point du cercle trigonométrique associé à $x$ se situe au-dessus de l'axe horizontal : son ordonnée est positive. 
    $$\boxed{\sin(x)\geqslant 0 \text{ sur } [0\,;\pi]}$$

    **2.** La fonction étant continue et positive sur $[0\,;\pi]$, l'aire du domaine situé sous sa courbe est donnée par l'intégrale : 
    $$\mathcal{A}=\int_{0}^{\pi}\sin(x)\,\mathrm{d}x=\Big[-\cos(x)\Big]_{0}^{\pi} =1+1=\boxed{2 \text{ unités d'aire}}$$

    **3.** 
    $$\int_{0}^{2\pi}\sin(x)\,\mathrm{d}x=\Big[-\cos(x)\Big]_{0}^{2\pi}=-1+1=\boxed{0}$$

    $$\boxed{\text{Non, ce nombre ne représente pas une aire}}$$
     Sur $[\pi\,;2\pi]$, la fonction est négative : l'intégrale y compte l'aire *négativement*. Les deux morceaux, de même aire $2$, se compensent donc exactement.

    **4.** Il suffit d'additionner les deux aires, chacune comptée positivement : 
    $$\boxed{\mathcal{A}_{\text{totale}}=2+2=4 \text{ unités d'aire}}$$
     On peut aussi écrire $\displaystyle\int_{0}^{2\pi}\left|\sin(x)\right|\,\mathrm{d}x=4$.

    **5.** 
    $$\mu=\frac{1}{\pi-0}\int_{0}^{\pi}\sin(x)\,\mathrm{d}x=\frac{2}{\pi}$$

    $$\boxed{\mu=\frac{2}{\pi}\approx 0{,}637}$$

    **6.** Le maximum du sinus vaut $1$, et $\dfrac{2}{\pi}\approx 0{,}637<1$. 
    $$\boxed{\text{Oui, c'était prévisible}}$$
     La valeur moyenne d'une fonction est toujours comprise entre son minimum et son maximum sur l'intervalle, ici entre $0$ et $1$. Géométriquement, $\mu$ est la hauteur du rectangle de base $[0\,;\pi]$ ayant la même aire que le domaine $\mathcal{D}$.

    **7.** D'après la question 3, l'intégrale sur $[0\,;2\pi]$ est nulle : 
    $$\mu=\frac{1}{2\pi}\times 0=\boxed{0}$$
     C'était prévisible sans calcul : sur une période complète, le sinus prend autant de valeurs positives que de valeurs opposées, et sa moyenne est donc nulle.
- id: "t-09-29"
  feuille: "f-t-09"
  numero: 29
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Calcul]
  mots_cles: [cosinus et sinus, valeurs remarquables, lecture graphique, fonction composée, équations trigonométriques]
  noeuds: [cx-pi]
  notions: [pi, composee]
  page_enonce: 10
  page_corrige: 21
  enonce: |
    Résoudre sur l'intervalle $[0\,;2\pi]$ les équations et inéquations suivantes. On pourra s'aider du cercle trigonométrique ou d'une courbe.

    **a)** $\cos(x)=\dfrac{\sqrt{3}}{2}$

    **b)** $\sin(x)=-\dfrac{1}{2}$

    **c)** $\cos(x)\leqslant 0$

    **d)** $\sin(x)>\dfrac{\sqrt{2}}{2}$

    **e)** $2\sin(x)-1=0$

    **f)** $\cos(2x)=\dfrac{1}{2}$

    Pour f), on posera $X=2x$ et l'on prendra garde à l'intervalle dans lequel varie $X$.
  corrige: |
    **a)** $\cos\left(\dfrac{\pi}{6}\right)=\dfrac{\sqrt{3}}{2}$, et la seconde solution s'obtient par symétrie : $2\pi-\dfrac{\pi}{6}=\dfrac{11\pi}{6}$. 
    $$\boxed{S=\left\{\frac{\pi}{6}\,;\frac{11\pi}{6}\right\}}$$

    **b)** $\sin\left(\dfrac{\pi}{6}\right)=\dfrac{1}{2}$, donc les solutions de $\sin(x)=-\dfrac{1}{2}$ se situent dans le troisième et le quatrième quadrant : 
    $$\boxed{S=\left\{\frac{7\pi}{6}\,;\frac{11\pi}{6}\right\}}$$

    **c)** Le cosinus est négatif lorsque le point du cercle est à gauche de l'axe vertical : 
    $$\boxed{S=\left[\frac{\pi}{2}\,;\frac{3\pi}{2}\right]}$$

    **d)** $\sin\left(\dfrac{\pi}{4}\right)=\dfrac{\sqrt{2}}{2}$, et le sinus dépasse strictement cette valeur entre $\dfrac{\pi}{4}$ et $\dfrac{3\pi}{4}$ : 
    $$\boxed{S=\left]\frac{\pi}{4}\,;\frac{3\pi}{4}\right[}$$

    **e)** $2\sin(x)-1=0 \iff \sin(x)=\dfrac{1}{2}$ : 
    $$\boxed{S=\left\{\frac{\pi}{6}\,;\frac{5\pi}{6}\right\}}$$

    **f)** On pose $X=2x$. Lorsque $x$ décrit $[0\,;2\pi]$, le réel $X$ décrit $[0\,;4\pi]$ : il faut donc chercher les solutions sur *deux* tours. 
    $$\cos(X)=\frac{1}{2} \iff X\in\left\{\frac{\pi}{3}\,;\frac{5\pi}{3}\,; \frac{7\pi}{3}\,;\frac{11\pi}{3}\right\}$$
     En divisant par $2$ : 
    $$\boxed{S=\left\{\frac{\pi}{6}\,;\frac{5\pi}{6}\,;\frac{7\pi}{6}\,; \frac{11\pi}{6}\right\}}$$

    $$\boxed{\text{L'erreur classique consiste à oublier les deux dernières solutions}}$$
- id: "t-09-30"
  feuille: "f-t-09"
  numero: 30
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Lecture graphique, Calcul]
  mots_cles: [cosinus et sinus, parité, lecture graphique, dérivée, fonction composée, étude de signe et de variations, équations trigonométriques, modélisation]
  noeuds: [cx-pi, ar-deriv]
  notions: [pi, derivable, composee]
  page_enonce: 10
  page_corrige: 22
  enonce: |
    L'objectif est de démontrer l'inégalité $\sin(x)\leqslant x$ pour tout réel $x\geqslant 0$, puis d'en mesurer la qualité.

    **Partie A : la démonstration.**

    Soit $g$ la fonction définie sur $[0\,;+\infty[$ par $g(x)=x-\sin(x)$.

    **1.** Calculer $g'(x)$, puis déterminer son signe sur $[0\,;+\infty[$.

    **2.** Dresser le tableau de variations de $g$ et calculer $g(0)$.

    **3.** En déduire que pour tout $x\geqslant 0$, $\sin(x)\leqslant x$.

    **4.** Interpréter graphiquement : quelle est la position de la courbe du sinus par rapport à la droite d'équation $y=x$ sur $[0\,;+\infty[$ ?

    **5.** Que peut-on dire sur $]-\infty\,;0]$ ? On utilisera l'imparité.

    **Partie B : qualité de l'approximation.**

    **6.** Calculer, à $10^{-6}$ près, l'écart $x-\sin(x)$ pour $x=0{,}1$, puis pour $x=0{,}5$, puis pour $x=1$.

    **7.** Pour quelles valeurs de $x$ l'approximation $\sin(x)\approx x$ vous paraît-elle acceptable ? Justifier votre réponse.

    **8.** Un physicien remplace $\sin(x)$ par $x$ pour étudier les petites oscillations d'un pendule. Pourquoi cette approximation serait-elle fausse si l'angle était exprimé en degrés ?
  corrige: |
    **Partie A : la démonstration.**

    **1.** 
    $$\boxed{g'(x)=1-\cos(x)}$$
     Pour tout réel $x$, $\cos(x)\leqslant 1$, donc : 
    $$\boxed{g'(x)\geqslant 0 \text{ sur } [0\,;+\infty[}$$
     La dérivée s'annule lorsque $\cos(x)=1$, c'est-à-dire aux points $x=2k\pi$ : ce sont des points isolés, qui n'interrompent pas la croissance.

    **2.**

    ![Figure](documents/figures/22b976958df0fca0.svg)

    $$g(0)=0-\sin(0)=\boxed{0}$$

    **3.** La fonction $g$ étant croissante sur $[0\,;+\infty[$ et valant $0$ en $0$, elle reste positive : 
    $$\forall x\geqslant 0, \quad g(x)\geqslant g(0)=0$$

    $$x-\sin(x)\geqslant 0 \qquad \text{d'où} \qquad \boxed{\sin(x)\leqslant x}$$

    **4.** 
    $$\boxed{\text{Sur } [0\,;+\infty[, \text{ la courbe du sinus est située en dessous de la droite } y=x}$$
     Les deux courbes se touchent uniquement en l'origine, ce qui correspond au cas $g(x)=0$.

    **5.** Le sinus étant impair, pour $x\leqslant 0$ on pose $x=-u$ avec $u\geqslant 0$ : 
    $$\sin(u)\leqslant u \quad \Longrightarrow \quad -\sin(u)\geqslant -u \quad \Longrightarrow \quad \sin(-u)\geqslant -u$$

    $$\boxed{\text{Sur } ]-\infty\,;0], \text{ on a } \sin(x)\geqslant x : \text{ la courbe est au-dessus de la droite}}$$

    **Partie B : qualité de l'approximation.**

    **6.**

    $$\begin{array}{|c||c|c|c|} \hline x & 0{,}1 & 0{,}5 & 1 \\ \hline \sin(x) & 0{,}099833 & 0{,}479426 & 0{,}841471 \\ \hline x-\sin(x) & 0{,}000167 & 0{,}020574 & 0{,}158529 \\ \hline \end{array}$$

    **7.** L'écart croît très vite : il est de l'ordre de $2\times 10^{-4}$ pour $x=0{,}1$, mais déjà de $0{,}16$ pour $x=1$, soit près de $16\ \%$ de la valeur. 
    $$\boxed{\text{L'approximation est acceptable pour } |x| \text{ inférieur à environ } 0{,}2 \text{ ou } 0{,}3}$$
     On peut le formuler en pourcentage : pour $x=0{,}1$, l'erreur relative vaut environ $0{,}17\ \%$ ; pour $x=0{,}5$, elle atteint déjà $4\ \%$.

    **8.** Parce que la limite $\displaystyle\lim_{x\to 0}\frac{\sin(x)}{x}=1$, sur laquelle tout repose, n'est vraie qu'en **radians**. En degrés, le taux de variation du sinus en $0$ vaut $\dfrac{\pi}{180}\approx 0{,}0175$, et non $1$. 
    $$\boxed{\text{En degrés, l'approximation correcte serait } \sin(x)\approx \frac{\pi}{180}\,x}$$
     C'est précisément ce qui justifie l'emploi du radian en analyse : c'est la seule unité pour laquelle les formules de dérivation prennent leur forme simple.
- id: "t-09-31"
  feuille: "f-t-09"
  numero: 31
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [cosinus et sinus, lecture graphique, dérivée, fonction composée, tangente]
  noeuds: [cx-pi, ar-deriv]
  notions: [pi, derivable, composee]
  page_enonce: 11
  page_corrige: 23
  enonce: |
    Le cours démontre que $\sin'=\cos$. L'objectif est d'en déduire la dérivée du cosinus sans refaire tout le calcul.

    **1.** Rappeler pourquoi, pour tout réel $x$, $\cos(x)=\sin\left(\dfrac{\pi}{2}-x\right)$.

    **2.** En dérivant cette égalité à l'aide de la proposition 4, démontrer que $\cos'(x)=-\cos\left(\dfrac{\pi}{2}-x\right)$.

    **3.** En déduire que $\cos'(x)=-\sin(x)$.

    **4.** Vérifier la cohérence de ce résultat en $0$ et en $\dfrac{\pi}{2}$, à l'aide des tangentes lues sur la courbe du cosinus.

    **5.** Reprendre le même raisonnement pour retrouver $\sin'=\cos$ à partir de $\cos'=-\sin$.
  corrige: |
    **1.** C'est une formule des angles associés, vue en Première : les réels $x$ et $\dfrac{\pi}{2}-x$ correspondent à deux points du cercle symétriques par rapport à la première bissectrice, ce qui échange abscisse et ordonnée. 
    $$\boxed{\cos(x)=\sin\left(\frac{\pi}{2}-x\right)}$$

    **2.** On dérive les deux membres. À droite, on applique $\big(\sin(u)\big)'=u'\cos(u)$ avec $u(x)=\dfrac{\pi}{2}-x$, donc $u'(x)=-1$ : 
    $$\cos'(x)=(-1)\times\cos\left(\frac{\pi}{2}-x\right) =\boxed{-\cos\left(\frac{\pi}{2}-x\right)}$$

    **3.** Par la même formule des angles associés appliquée cette fois au cosinus : 
    $$\cos\left(\frac{\pi}{2}-x\right)=\sin(x)$$

    $$\boxed{\cos'(x)=-\sin(x)}$$

    **4.** En $0$, le cosinus atteint son maximum : la tangente y est horizontale, donc $\cos'(0)=0$. La formule donne bien $-\sin(0)=0$.

    En $\dfrac{\pi}{2}$, la courbe du cosinus descend le plus rapidement : la tangente y a la pente la plus négative possible, à savoir $-1$. La formule donne $-\sin\left(\dfrac{\pi}{2}\right)=-1$. 
    $$\boxed{\text{Les deux vérifications sont cohérentes}}$$

    **5.** On part cette fois de $\sin(x)=\cos\left(\dfrac{\pi}{2}-x\right)$, puis on dérive avec $\big(\cos(u)\big)'=-u'\sin(u)$ et $u'=-1$ : 
    $$\sin'(x)=-(-1)\times\sin\left(\frac{\pi}{2}-x\right) =\sin\left(\frac{\pi}{2}-x\right)=\boxed{\cos(x)}$$
     Les deux formules se déduisent donc l'une de l'autre : il suffit d'en admettre une seule.
- id: "t-09-32"
  feuille: "f-t-09"
  numero: 32
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [cosinus et sinus, périodicité, parité, dérivée, fonction composée, étude de signe et de variations, formules trigonométriques]
  noeuds: [cx-pi, ar-deriv]
  notions: [pi, derivable, composee]
  page_enonce: 11
  page_corrige: 24
  enonce: |
    Soit $f$ la fonction définie sur $\mathbb{R}$ par $f(x)=\sin(x)\cos(x)$.

    **1.** Démontrer que $f$ est impaire.

    **2.** Démontrer que $f'(x)=\cos(2x)$.

    *On pourra utiliser l'identité $\cos(2x)=\cos^{2}(x)-\sin^{2}(x)$.*

    **3.** Démontrer que $f$ est périodique de période $\pi$.

    **4.** Étudier le signe de $f'(x)$ sur $\left[0\,;\dfrac{\pi}{2}\right]$, puis dresser le tableau de variations de $f$ sur cet intervalle.

    **5.** En déduire le maximum de $f$ sur $\mathbb{R}$, ainsi que les valeurs de $x$ en lesquelles il est atteint.

    **6.** Démontrer que pour tout réel $x$, $f(x)=\dfrac{1}{2}\sin(2x)$. Retrouver alors directement le résultat de la question 5.
  corrige: |
    **1.** 
    $$f(-x)=\sin(-x)\cos(-x)=\left(-\sin(x)\right)\times\cos(x)=-f(x)$$

    $$\boxed{f \text{ est impaire}}$$

    **2.** On dérive le produit : 
    $$f'(x)=\cos(x)\times\cos(x)+\sin(x)\times\left(-\sin(x)\right) =\cos^{2}(x)-\sin^{2}(x)$$
     Or l'identité rappelée donne exactement : 
    $$\boxed{f'(x)=\cos(2x)}$$

    **3.** 
    $$f(x+\pi)=\sin(x+\pi)\cos(x+\pi)=\left(-\sin(x)\right)\times\left(-\cos(x)\right) =\sin(x)\cos(x)=f(x)$$

    $$\boxed{f \text{ est périodique de période } \pi}$$

    **4.** Sur $\left[0\,;\dfrac{\pi}{2}\right]$, le réel $2x$ décrit $[0\,;\pi]$ : le cosinus y est positif jusqu'à $\dfrac{\pi}{2}$, puis négatif. Donc $f'(x)\geqslant 0$ pour $2x\leqslant\dfrac{\pi}{2}$, c'est-à-dire $x\leqslant\dfrac{\pi}{4}$.

    ![Figure](documents/figures/79f826b92d011e26.svg)

    En effet $f\left(\dfrac{\pi}{4}\right)=\dfrac{\sqrt{2}}{2}\times\dfrac{\sqrt{2}}{2} =\dfrac{1}{2}$.

    **5.** La fonction étant $\pi$-périodique, ce maximum local est le maximum sur $\mathbb{R}$ tout entier, et il se reproduit à chaque période : 
    $$\boxed{\text{Le maximum de } f \text{ vaut } \frac{1}{2}, \text{ atteint en } x=\frac{\pi}{4}+k\pi \text{ avec } k\in\mathbb{Z}}$$

    **6.** L'identité $\sin(2x)=2\sin(x)\cos(x)$ donne immédiatement : 
    $$\boxed{f(x)=\frac{1}{2}\sin(2x)}$$
     Sous cette forme, tout devient évident : le sinus étant compris entre $-1$ et $1$, la fonction $f$ oscille entre $-\dfrac{1}{2}$ et $\dfrac{1}{2}$, et le maximum est atteint lorsque $\sin(2x)=1$, c'est-à-dire $2x=\dfrac{\pi}{2}+2k\pi$, soit $x=\dfrac{\pi}{4}+k\pi$. On retrouve bien le résultat de la question 5, sans aucune étude de dérivée.
- id: "t-09-33"
  feuille: "f-t-09"
  numero: 33
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Lecture graphique, Calcul]
  mots_cles: [cosinus et sinus, lecture graphique, fonction composée, équations trigonométriques]
  noeuds: [cx-pi]
  notions: [pi, composee]
  page_enonce: 11
  page_corrige: 25
  enonce: |
    Soit $k$ un réel. On s'intéresse au nombre de solutions de l'équation $\cos(x)=k$ sur l'intervalle $[0\,;2\pi]$.

    **1.** Tracer la courbe de la fonction cosinus sur $[0\,;2\pi]$.

    **2.** Déterminer graphiquement, selon les valeurs de $k$, le nombre de solutions de l'équation. On distinguera tous les cas.

    **3.** Vérifier la discussion précédente pour $k=1$, $k=0$ et $k=-1$, en donnant à chaque fois les solutions exactes.

    **4.** Reprendre la question 2 pour l'équation $\cos(x)=k$ sur $\mathbb{R}$ tout entier.

    **5.** Reprendre enfin la question 2 pour l'équation $\cos(2x)=k$ sur $[0\,;2\pi]$.
  corrige: |
    **1.**

    ![Figure](documents/figures/f76cfa0c39bf4759.svg)

    **2.** On fait glisser la droite horizontale d'ordonnée $k$ et l'on compte les intersections. 
    $$\boxed{\begin{array}{ll} \text{si } k<-1 \text{ ou } k>1 & : \; \text{aucune solution} \\[1mm] \text{si } k=1 & : \; 2 \text{ solutions } (x=0 \text{ et } x=2\pi) \\[1mm] \text{si } -1<k<1 & : \; 2 \text{ solutions} \\[1mm] \text{si } k=-1 & : \; 1 \text{ solution } (x=\pi) \end{array}}$$
     Le cas $k=1$ est particulier : les deux solutions sont les *bornes* de l'intervalle, qui correspondent au même point du cercle trigonométrique.

    **3.** 
    $$\boxed{k=1 : S=\{0\,;2\pi\} \quad ; \quad k=0 : S=\left\{\frac{\pi}{2}\,;\frac{3\pi}{2}\right\} \quad ; \quad k=-1 : S=\{\pi\}}$$

    **4.** Sur $\mathbb{R}$, la périodicité reproduit indéfiniment chaque solution : 
    $$\boxed{\begin{array}{ll} \text{si } |k|>1 & : \; \text{aucune solution} \\[1mm] \text{si } |k|\leqslant 1 & : \; \text{une infinité de solutions} \end{array}}$$

    **5.** On pose $X=2x$ : lorsque $x$ décrit $[0\,;2\pi]$, le réel $X$ décrit $[0\,;4\pi]$, soit *deux* périodes. Chaque solution en $X$ fournit une solution en $x$, et le nombre de solutions double. 
    $$\boxed{\begin{array}{ll} \text{si } |k|>1 & : \; \text{aucune solution} \\[1mm] \text{si } -1<k<1 & : \; 4 \text{ solutions} \\[1mm] \text{si } k=1 & : \; 3 \text{ solutions } \left(x=0,\ \pi,\ 2\pi\right) \\[1mm] \text{si } k=-1 & : \; 2 \text{ solutions } \left(x=\frac{\pi}{2},\ \frac{3\pi}{2}\right) \end{array}}$$
- id: "t-09-34"
  feuille: "f-t-09"
  numero: 34
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Lecture graphique, Problème, Démonstration]
  mots_cles: [cosinus et sinus, périodicité, parité, lecture graphique, fonction composée, étude de signe et de variations, équations trigonométriques, formules trigonométriques]
  noeuds: [cx-pi]
  notions: [pi, composee]
  page_enonce: 11
  page_corrige: 26
  enonce: |
    Soit $f$ la fonction définie par : 
    $$f(x)=\frac{-\cos(2x)}{3+2\sin(x)}$$
     L'objectif de cet exercice est de tracer sa courbe représentative.

    **Partie A : premières propriétés.**

    **1.** Démontrer que pour tout réel $x$, $1\leqslant 3+2\sin(x)\leqslant 5$. En déduire que $f$ est définie sur $\mathbb{R}$ tout entier.

    **2.** Démontrer que $f$ est périodique de période $2\pi$.

    **3.** La fonction $f$ est-elle paire ? impaire ?

    **4.** Démontrer que pour tout réel $x$, $f(\pi-x)=f(x)$. Interpréter graphiquement.

    **5.** En déduire qu'il suffit d'étudier $f$ sur l'intervalle $\left[-\dfrac{\pi}{2}\,;\dfrac{\pi}{2}\right]$, en précisant les transformations qui permettront ensuite d'obtenir toute la courbe.

    **Partie B : réduction à une fonction rationnelle.**

    **6.** Démontrer que pour tout réel $x$ : 
    $$f(x)=\frac{2\sin^{2}(x)-1}{3+2\sin(x)}$$

    **7.** On pose $t=\sin(x)$ et l'on considère la fonction $g$ définie sur $[-1\,;1]$ par $g(t)=\dfrac{2t^{2}-1}{2t+3}$. Justifier que lorsque $x$ décrit $\left[-\dfrac{\pi}{2}\,;\dfrac{\pi}{2}\right]$, le réel $t$ décrit $[-1\,;1]$ de façon strictement croissante.

    **8.** Démontrer que pour tout $t$ de $[-1\,;1]$ : 
    $$g'(t)=\frac{2\left(2t^{2}+6t+1\right)}{(2t+3)^{2}}$$

    **9.** Démontrer que le trinôme $2t^{2}+6t+1$ admet une unique racine $t_{0}$ dans $[-1\,;1]$, et que $t_{0}=\dfrac{-3+\sqrt{7}}{2}$.

    **10.** En déduire le signe de $g'(t)$ sur $[-1\,;1]$.

    **11.** Calculer $g(-1)$ et $g(1)$.

    **12.** Démontrer que $2t_{0}^{2}=-6t_{0}-1$, puis en déduire que $g\left(t_{0}\right)=\sqrt{7}-3$.

    *On remplacera $2t_{0}^{2}$ dans le numérateur de $g(t_{0})$, puis on remarquera que $2t_{0}+3=\sqrt{7}$.*

    **13.** Dresser le tableau de variations de $g$ sur $[-1\,;1]$.

    **Partie C : retour à $f$ et tracé.**

    **14.** En déduire le tableau de variations de $f$ sur $\left[-\dfrac{\pi}{2}\,;\dfrac{\pi}{2}\right]$. On notera $x_{0}$ l'abscisse du minimum et l'on en donnera une valeur approchée au centième.

    **15.** Résoudre l'équation $f(x)=0$ sur $\left[-\dfrac{\pi}{2}\,;\dfrac{\pi}{2}\right]$.

    **16.** Donner les valeurs exactes de $f\left(-\dfrac{\pi}{2}\right)$, $f(0)$ et $f\left(\dfrac{\pi}{2}\right)$.

    **17.** Tracer la courbe de $f$ sur $\left[-\dfrac{\pi}{2}\,;\dfrac{\pi}{2}\right]$, puis la compléter par symétrie sur $\left[-\dfrac{\pi}{2}\,;\dfrac{3\pi}{2}\right]$, et enfin par périodicité sur $[-2\pi\,;2\pi]$.
  corrige: |
    **Partie A : premières propriétés.**

    **1.** Pour tout réel $x$, $-1\leqslant\sin(x)\leqslant 1$. En multipliant par $2$, qui est positif, puis en ajoutant $3$ : 
    $$-2\leqslant 2\sin(x)\leqslant 2 \qquad \text{puis} \qquad \boxed{1\leqslant 3+2\sin(x)\leqslant 5}$$
     Le dénominateur est donc toujours supérieur ou égal à $1$ : il ne s'annule jamais. 
    $$\boxed{f \text{ est définie sur } \mathbb{R} \text{ tout entier}}$$

    **2.** Le numérateur et le dénominateur sont tous deux $2\pi$-périodiques : 
    $$f(x+2\pi)=\frac{-\cos(2x+4\pi)}{3+2\sin(x+2\pi)}=\frac{-\cos(2x)}{3+2\sin(x)}=f(x)$$

    $$\boxed{f \text{ est périodique de période } 2\pi}$$

    **3.** 
    $$f(-x)=\frac{-\cos(-2x)}{3+2\sin(-x)}=\frac{-\cos(2x)}{3-2\sin(x)}$$
     Le dénominateur a changé : ce n'est ni $f(x)$ ni $-f(x)$. On le confirme par un contre-exemple : 
    $$f\left(\frac{\pi}{2}\right)=\frac{-\cos(\pi)}{3+2}=\frac{1}{5} \qquad \text{et} \qquad f\left(-\frac{\pi}{2}\right)=\frac{-\cos(-\pi)}{3-2}=1$$

    $$\boxed{f \text{ n'est ni paire ni impaire}}$$

    **4.** On utilise $\sin(\pi-x)=\sin(x)$ et $\cos(2\pi-2x)=\cos(2x)$ : 
    $$f(\pi-x)=\frac{-\cos\big(2(\pi-x)\big)}{3+2\sin(\pi-x)} =\frac{-\cos(2\pi-2x)}{3+2\sin(x)}=\frac{-\cos(2x)}{3+2\sin(x)}=f(x)$$

    $$\boxed{f(\pi-x)=f(x)}$$

    $$\boxed{\text{La courbe est symétrique par rapport à la droite d'équation } x=\frac{\pi}{2}}$$

    **5.** Connaître $f$ sur $\left[-\dfrac{\pi}{2}\,;\dfrac{\pi}{2}\right]$ suffit : la symétrie de la question 4 donne alors $f$ sur $\left[\dfrac{\pi}{2}\,;\dfrac{3\pi}{2}\right]$, puisque $\pi-x$ décrit le premier intervalle lorsque $x$ décrit le second. 
    $$\boxed{\text{Il suffit d'étudier } f \text{ sur } \left[-\frac{\pi}{2}\,;\frac{\pi}{2}\right]}$$
     On obtient ainsi $f$ sur $\left[-\dfrac{\pi}{2}\,;\dfrac{3\pi}{2}\right]$, intervalle de longueur $2\pi$, puis toute la courbe par **translations de vecteur** $2\pi\,\vec{\imath}$.

    **Partie B : réduction à une fonction rationnelle.**

    **6.** L'identité $\cos(2x)=1-2\sin^{2}(x)$ donne $-\cos(2x)=2\sin^{2}(x)-1$ : 
    $$\boxed{f(x)=\frac{2\sin^{2}(x)-1}{3+2\sin(x)}}$$

    **7.** Sur $\left[-\dfrac{\pi}{2}\,;\dfrac{\pi}{2}\right]$, la dérivée du sinus est $\cos(x)$, qui y est positive et ne s'annule qu'aux deux bornes. 
    $$\boxed{t=\sin(x) \text{ croît strictement de } -1 \text{ à } 1}$$
     Chaque valeur de $t$ de $[-1\,;1]$ correspond donc à un unique $x$ de l'intervalle d'étude : on peut remplacer l'étude de $f$ par celle de $g$.

    **8.** On dérive le quotient, avec $u=2t^{2}-1$ et $v=2t+3$ : 
    $$\begin{aligned} g'(t) &= \frac{4t(2t+3)-2\left(2t^{2}-1\right)}{(2t+3)^{2}} = \frac{8t^{2}+12t-4t^{2}+2}{(2t+3)^{2}} \\ &= \frac{4t^{2}+12t+2}{(2t+3)^{2}} = \boxed{\frac{2\left(2t^{2}+6t+1\right)}{(2t+3)^{2}}} \end{aligned}$$

    **9.** Le discriminant vaut $\Delta=36-8=28$, d'où $\sqrt{\Delta}=2\sqrt{7}$ et les deux racines : 
    $$t=\frac{-6-2\sqrt{7}}{4}=\frac{-3-\sqrt{7}}{2}\approx -2{,}82 \qquad ; \qquad t=\frac{-6+2\sqrt{7}}{4}=\frac{-3+\sqrt{7}}{2}\approx -0{,}18$$
     La première n'appartient pas à $[-1\,;1]$, la seconde si : 
    $$\boxed{t_{0}=\frac{-3+\sqrt{7}}{2}\approx -0{,}177}$$

    **10.** Le dénominateur $(2t+3)^{2}$ est un carré, strictement positif car $2t+3\geqslant 1$. Le signe de $g'(t)$ est donc celui du trinôme $2t^{2}+6t+1$, dont le coefficient dominant est positif : il est négatif entre les racines, positif à l'extérieur. Sur $[-1\,;1]$, seule $t_{0}$ intervient. 
    $$\boxed{g'(t)<0 \text{ sur } \left[-1\,;t_{0}\right[ \quad \text{et} \quad g'(t)>0 \text{ sur } \left]t_{0}\,;1\right]}$$

    **11.** 
    $$g(-1)=\frac{2-1}{-2+3}=\boxed{1} \qquad ; \qquad g(1)=\frac{2-1}{2+3}=\boxed{\frac{1}{5}}$$

    **12.** Comme $t_{0}$ est racine de $2t^{2}+6t+1$, on a $2t_{0}^{2}+6t_{0}+1=0$, c'est-à-dire : 
    $$\boxed{2t_{0}^{2}=-6t_{0}-1}$$
     On remplace alors dans le numérateur de $g(t_{0})$ : 
    $$g(t_{0})=\frac{2t_{0}^{2}-1}{2t_{0}+3}=\frac{-6t_{0}-1-1}{2t_{0}+3} =\frac{-6t_{0}-2}{2t_{0}+3}$$
     Or $2t_{0}=-3+\sqrt{7}$, donc $2t_{0}+3=\sqrt{7}$ et $-6t_{0}-2=-3\left(-3+\sqrt{7}\right)-2=7-3\sqrt{7}$ : 
    $$g(t_{0})=\frac{7-3\sqrt{7}}{\sqrt{7}}=\frac{7}{\sqrt{7}}-3=\sqrt{7}-3$$

    $$\boxed{g(t_{0})=\sqrt{7}-3\approx -0{,}354}$$

    **13.**

    ![Figure](documents/figures/996b82677c859d1f.svg)

    **Partie C : retour à $f$ et tracé.**

    **14.** Comme $t=\sin(x)$ croît strictement sur l'intervalle d'étude, $f$ varie exactement comme $g$ : il suffit de traduire $t_{0}$ en $x_{0}=\arcsin\left(t_{0}\right)$, obtenu à la calculatrice. 
    $$\boxed{x_{0}\approx -0{,}18}$$

    ![Figure](documents/figures/2338be7ccb9bd0fb.svg)

    **15.** Le dénominateur ne s'annulant jamais, le quotient est nul si et seulement si son numérateur l'est : 
    $$f(x)=0 \iff \cos(2x)=0 \iff 2x=\frac{\pi}{2}+k\pi \iff x=\frac{\pi}{4}+k\frac{\pi}{2}$$
     En ne gardant que les valeurs de $\left[-\dfrac{\pi}{2}\,;\dfrac{\pi}{2}\right]$ : 
    $$\boxed{S=\left\{-\frac{\pi}{4}\,;\frac{\pi}{4}\right\}}$$

    **16.** 
    $$f\left(-\frac{\pi}{2}\right)=\frac{-\cos(-\pi)}{3-2}=\boxed{1} \qquad ; \qquad f(0)=\frac{-\cos(0)}{3+0}=\boxed{-\frac{1}{3}}$$

    $$f\left(\frac{\pi}{2}\right)=\frac{-\cos(\pi)}{3+2}=\boxed{\frac{1}{5}}$$

    **17.** Voici la courbe. En rouge la portion réellement étudiée, en bleu son image par la symétrie d'axe $x=\dfrac{\pi}{2}$, et en gris tout le reste, obtenu par translations.

    ![Figure](documents/figures/538dc343e8c91617.svg)

    On vérifie sur la figure les trois points remarquables : le maximum $1$ atteint en $-\dfrac{\pi}{2}$ et en $\dfrac{3\pi}{2}$, le minimum $\sqrt{7}-3$ atteint deux fois par période, et les zéros aux abscisses $\dfrac{\pi}{4}+k\dfrac{\pi}{2}$.
