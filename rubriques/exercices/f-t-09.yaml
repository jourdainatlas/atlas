  enonce: |
    Trouver les fonctions $f$ dérivables sur $\mathbb{R}$ telles que, pour tout réel $x$, $f'(x)+3f(x)=\sin(x)$. On cherchera une solution particulière de la forme $x\mapsto a\sin(x)+b\cos(x)$.
  corrige: |
    L'équation s'écrit $y'=-3y+\sin(x)$. Comme au chapitre 8 (exercices 28 et 31), si $\varphi$ est une solution particulière, les solutions sont les fonctions $\varphi+K\mathrm{e}^{-3x}$, $K\in\mathbb{R}$.

    Cherchons $\varphi(x)=a\sin(x)+b\cos(x)$. Alors $\varphi'(x)=a\cos(x)-b\sin(x)$ et 
    $$\varphi'(x)+3\varphi(x)=(3a-b)\sin(x)+(a+3b)\cos(x)$$
     Si cette quantité vaut $\sin(x)$ pour tout réel $x$, on obtient en $x=\frac{\pi}{2}$ l'égalité $3a-b=1$, et en $x=0$ l'égalité $a+3b=0$. Ce système donne $a=\frac{3}{10}$ et $b=-\frac{1}{10}$. Réciproquement, ces valeurs conviennent pour tout $x$. 
    $$\boxed{f(x)=\frac{3\sin(x)-\cos(x)}{10}+K\mathrm{e}^{-3x},\qquad K\in\mathbb{R}}$$
     *Vérification :* pour $K=0$, $f'(x)+3f(x)=\frac{3\cos(x)+\sin(x)}{10}+\frac{9\sin(x)-3\cos(x)}{10}=\sin(x)$.

    *Interprétation.* Quand $x\to+\infty$, le terme $K\mathrm{e}^{-3x}$ tend vers $0$ : toutes les solutions finissent par se confondre avec la solution périodique $\varphi$. En physique, on parle de *régime transitoire* pour $K\mathrm{e}^{-3x}$ et de *régime permanent* pour $\varphi$ ; c'est ce qu'on observe par exemple dans un circuit électrique soumis à une tension sinusoïdale.
- id: "t-09-37"
  feuille: "f-t-09"
  numero: 37
  partie: "Pour aller plus loin"
  etoiles: 3
