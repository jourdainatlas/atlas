  page_enonce: 13
  page_corrige: 26
  enonce: |
    Dans un repère orthonormé, on considère les points $A(0\,;0)$ et $B(4\,;0)$. Pour tout réel $k$, on note $\mathcal{E}_{k}$ l'ensemble des points $M(x\,;y)$ du plan tels que : 
    $$\overrightarrow{MA}\cdot\overrightarrow{MB}=k$$

    **1.** Démontrer que $M$ appartient à $\mathcal{E}_{k}$ si et seulement si : 
    $$(x-2)^{2}+y^{2}=k+4$$

    **2.** En déduire la nature de $\mathcal{E}_{k}$ dans chacun des cas suivants, en précisant les éléments caractéristiques lorsqu'il s'agit d'un cercle :

    **(a)** $k=0$

    **(b)** $k=5$

    **(c)** $k=-4$

    **(d)** $k=-8$

    **3.** Tracer dans un même repère les ensembles obtenus pour $k=0$ et $k=5$.

    **4.** Discuter, selon la valeur de $k$, la nature de $\mathcal{E}_{k}$.

    **5.** On note $I$ le milieu de $[AB]$. Démontrer que pour tout point $M$ du plan : 
    $$\overrightarrow{MA}\cdot\overrightarrow{MB}=MI^{2}-\frac{AB^{2}}{4}$$

    *On pourra écrire $\overrightarrow{MA}=\overrightarrow{MI}+\overrightarrow{IA}$ et $\overrightarrow{MB}=\overrightarrow{MI}+\overrightarrow{IB}$, puis remarquer que $\overrightarrow{IB}=-\overrightarrow{IA}$.*

    **6.** Retrouver ainsi le résultat de la question 4 pour deux points $A$ et $B$ quelconques.
  corrige: |
    **1.** Avec $M(x\,;y)$, on a $\overrightarrow{MA}\begin{pmatrix} -x \\ -y \end{pmatrix}$ et $\overrightarrow{MB}\begin{pmatrix} 4-x \\ -y \end{pmatrix}$, d'où : 
    $$\overrightarrow{MA}\cdot\overrightarrow{MB}=-x(4-x)+(-y)(-y)=x^{2}-4x+y^{2}$$
     L'équation $\overrightarrow{MA}\cdot\overrightarrow{MB}=k$ s'écrit donc $x^{2}-4x+y^{2}=k$, et l'on complète le carré : 
    $$(x-2)^{2}-4+y^{2}=k$$

    $$\boxed{M\in\mathcal{E}_{k} \iff (x-2)^{2}+y^{2}=k+4}$$

    **2.** On note $I(2\,;0)$, qui est le milieu de $[AB]$.

    **(a)** $k=0$ : le second membre vaut $4$. 
    $$\boxed{\text{cercle de centre } I(2\,;0) \text{ et de rayon } 2}$$
     C'est le cercle de diamètre $[AB]$, conformément à l'exercice 28.

    **(b)** $k=5$ : le second membre vaut $9$. 
    $$\boxed{\text{cercle de centre } I(2\,;0) \text{ et de rayon } 3}$$

    **(c)** $k=-4$ : le second membre vaut $0$, donc $(x-2)^{2}+y^{2}=0$. 
    $$\boxed{\mathcal{E}_{-4} \text{ se réduit au seul point } I(2\,;0)}$$

    **(d)** $k=-8$ : le second membre vaut $-4$, or une somme de carrés ne peut être négative. 
    $$\boxed{\mathcal{E}_{-8}=\varnothing}$$

    **3.** Voici les deux cercles.

    ![Figure](documents/figures/1e5c7f2619734b96.svg)

    **4.** Le second membre $k+4$ doit être positif ou nul pour que l'ensemble ne soit pas vide : 
    $$\boxed{\begin{array}{ll} \text{si } k>-4 & : \; \mathcal{E}_{k} \text{ est le cercle de centre } I \text{ et de rayon } \sqrt{k+4} \\[1mm] \text{si } k=-4 & : \; \mathcal{E}_{k}=\{I\} \\[1mm] \text{si } k<-4 & : \; \mathcal{E}_{k}=\varnothing \end{array}}$$
     On remarque que $-4=-\dfrac{AB^{2}}{4}$, puisque $AB=4$.

    **5.** Le point $I$ étant le milieu de $[AB]$, on a $\overrightarrow{IB}=-\overrightarrow{IA}$. En décomposant : 
    $$\begin{aligned} \overrightarrow{MA}\cdot\overrightarrow{MB} &= \left(\overrightarrow{MI}+\overrightarrow{IA}\right)\cdot\left(\overrightarrow{MI}+\overrightarrow{IB}\right) \\ &= \left(\overrightarrow{MI}+\overrightarrow{IA}\right)\cdot\left(\overrightarrow{MI}-\overrightarrow{IA}\right) \\ &= \left\|\overrightarrow{MI}\right\|^{2}-\left\|\overrightarrow{IA}\right\|^{2} \end{aligned}$$
     la dernière égalité étant celle de l'exercice 18. Or $IA=\dfrac{AB}{2}$ : 
    $$\boxed{\overrightarrow{MA}\cdot\overrightarrow{MB}=MI^{2}-\frac{AB^{2}}{4}}$$

    **6.** L'équation $\overrightarrow{MA}\cdot\overrightarrow{MB}=k$ devient alors, pour deux points $A$ et $B$ quelconques : 
    $$MI^{2}=k+\frac{AB^{2}}{4}$$

    $$\boxed{\begin{array}{ll} \text{si } k>-\dfrac{AB^{2}}{4} & : \; \text{cercle de centre } I \text{ et de rayon } \sqrt{k+\dfrac{AB^{2}}{4}} \\[3mm] \text{si } k=-\dfrac{AB^{2}}{4} & : \; \text{le point } I \text{ seul} \\[2mm] \text{si } k<-\dfrac{AB^{2}}{4} & : \; \text{l'ensemble vide} \end{array}}$$
     On retrouve exactement la discussion de la question 4, mais cette fois sans aucun repère : le résultat est purement géométrique, et le centre est toujours le milieu de $[AB]$.

