  noeuds: [f-hilbert, gd-normes]
  notions: [norme]
  page_enonce: 9
  page_corrige: 17
  enonce: |
    Dans chaque cas, déterminer si l'équation proposée est celle d'un cercle. Si oui, en préciser le centre et le rayon. *On fera apparaître des identités remarquables.*

    **1.** $x^{2}+y^{2}-4x+6y-3=0$

    **2.** $x^{2}+y^{2}+2x-8y+1=0$

    **3.** $x^{2}+y^{2}-6x+9=0$

    **4.** $x^{2}+y^{2}+2x+4y+10=0$

    **5.** $x^{2}+y^{2}-x-3y=0$

    Deux de ces cinq équations ne définissent pas un cercle : on précisera à chaque fois quel est l'ensemble des points dont les coordonnées les vérifient.
  corrige: |
    La méthode est toujours la même : on regroupe les termes en $x$ d'une part, en $y$ d'autre part, et l'on complète chaque groupe pour reconnaître le début d'une identité remarquable.

    **1.** 
    $$\begin{aligned} x^{2}+y^{2}-4x+6y-3=0 &\iff \underbrace{x^{2}-4x+4}_{=(x-2)^{2}}-4+\underbrace{y^{2}+6y+9}_{=(y+3)^{2}}-9-3=0 \\ &\iff (x-2)^{2}+(y+3)^{2}=16 \end{aligned}$$

    $$\boxed{\text{Cercle de centre } (2\,;-3) \text{ et de rayon } 4}$$

    **2.** 
    $$\begin{aligned} x^{2}+y^{2}+2x-8y+1=0 &\iff (x+1)^{2}-1+(y-4)^{2}-16+1=0 \\ &\iff (x+1)^{2}+(y-4)^{2}=16 \end{aligned}$$

    $$\boxed{\text{Cercle de centre } (-1\,;4) \text{ et de rayon } 4}$$

    **3.** 
    $$x^{2}+y^{2}-6x+9=0 \iff (x-3)^{2}-9+y^{2}+9=0 \iff (x-3)^{2}+y^{2}=0$$
     Une somme de deux carrés est nulle si et seulement si chacun l'est, donc $x=3$ et $y=0$ : 
    $$\boxed{\text{Ce n'est pas un cercle : l'ensemble se réduit au seul point } (3\,;0)}$$
     On peut voir cela comme un cercle de rayon nul.

    **4.** 
    $$\begin{aligned} x^{2}+y^{2}+2x+4y+10=0 &\iff (x+1)^{2}-1+(y+2)^{2}-4+10=0 \\ &\iff (x+1)^{2}+(y+2)^{2}=-5 \end{aligned}$$
     Une somme de deux carrés ne peut pas être négative : 
    $$\boxed{\text{Ce n'est pas un cercle : aucun point ne convient, l'ensemble est vide}}$$

    **5.** 
    $$\begin{aligned} x^{2}+y^{2}-x-3y=0 &\iff \left(x-\frac{1}{2}\right)^{2}-\frac{1}{4} +\left(y-\frac{3}{2}\right)^{2}-\frac{9}{4}=0 \\ &\iff \left(x-\frac{1}{2}\right)^{2}+\left(y-\frac{3}{2}\right)^{2}=\frac{10}{4} \end{aligned}$$

    $$\boxed{\text{Cercle de centre } \left(\frac{1}{2}\,;\frac{3}{2}\right) \text{ et de rayon } \frac{\sqrt{10}}{2}\approx 1{,}58}$$
     On remarque au passage que ce cercle passe par l'origine, ce qui se lit directement sur l'équation : $x=y=0$ la vérifie.
- id: "p-07-28"
  feuille: "f-p-07"
  numero: 28
  partie: "Équations de cercles"
  etoiles: 2
