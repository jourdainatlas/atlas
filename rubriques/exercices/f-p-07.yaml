  page_enonce: 10
  page_corrige: 19
  enonce: |
    **1.** On considère le cercle $\mathcal{C}$ d'équation $x^{2}+y^{2}=25$ et la droite $d$ d'équation $y=x+1$.

    **(a)** Tracer $\mathcal{C}$ et $d$ dans un même repère.

    **(b)** Déterminer par le calcul les coordonnées de leurs points d'intersection.

    *On remplacera $y$ par $x+1$ dans l'équation du cercle.*

    **2.** On considère maintenant le cercle $\mathcal{C}'$ de centre $\Omega(1\,;2)$ et de rayon $3$, ainsi que la droite $d' : 3x+4y-5=0$.

    **(a)** Déterminer les coordonnées du projeté orthogonal $H$ de $\Omega$ sur $d'$.

    **(b)** Calculer $\Omega H$ et le comparer au rayon. En déduire la position relative de $\mathcal{C}'$ et de $d'$.

    **3.** En procédant de la même façon, démontrer que la droite $d'' : 3x+4y+4=0$ est tangente au cercle $\mathcal{C}'$, et déterminer les coordonnées du point de contact.
  corrige: |
    **1.** **(a)** Le cercle a pour centre $O$ et pour rayon $5$ ; la droite passe par $(0\,;1)$ et a pour coefficient directeur $1$.

    ![Figure](documents/figures/43a5f5c798b488fe.svg)

    **(b)** On remplace $y$ par $x+1$ dans l'équation du cercle : 
    $$\begin{aligned} x^{2}+(x+1)^{2}=25 &\iff x^{2}+x^{2}+2x+1=25 \\ &\iff 2x^{2}+2x-24=0 \\ &\iff x^{2}+x-12=0 \end{aligned}$$
     Le discriminant vaut $\Delta=1+48=49$, d'où $\sqrt{\Delta}=7$ et : 
    $$x=\frac{-1-7}{2}=-4 \qquad \text{ou} \qquad x=\frac{-1+7}{2}=3$$
     En reportant dans $y=x+1$ : 
    $$\boxed{\text{Les points d'intersection sont } (-4\,;-3) \text{ et } (3\,;4)}$$

    **2.** **(a)** La droite $d'$ a pour vecteur normal $\begin{pmatrix} 3 \\ 4 \end{pmatrix}$, donc pour vecteur directeur $\begin{pmatrix} 4 \\ -3 \end{pmatrix}$. La perpendiculaire à $d'$ passant par $\Omega(1\,;2)$ admet donc ce dernier pour vecteur normal : 
    $$4x-3y+c=0 \quad \text{avec} \quad 4-6+c=0 \quad \text{soit} \quad c=2$$
     On résout alors : 
    $$\left\{\begin{array}{rcl} 3x+4y &=& 5 \\ 4x-3y &=& -2 \end{array}\right.$$
     En multipliant la première ligne par $3$ et la seconde par $4$, puis en additionnant : $25x=15-8=7$, d'où $x=\dfrac{7}{25}$, puis $y=\dfrac{26}{25}$ : 
    $$\boxed{H\left(\frac{7}{25}\,;\frac{26}{25}\right)}$$

    **(b)** 
    $$\Omega H=\sqrt{\left(1-\frac{7}{25}\right)^{2}+\left(2-\frac{26}{25}\right)^{2}} =\sqrt{\left(\frac{18}{25}\right)^{2}+\left(\frac{24}{25}\right)^{2}} =\frac{\sqrt{324+576}}{25}=\frac{30}{25}$$

    $$\boxed{\Omega H=\frac{6}{5}=1{,}2}$$
     Comme $1{,}2<3=R$, la droite passe à l'intérieur du cercle : 
    $$\boxed{d' \text{ coupe } \mathcal{C}' \text{ en deux points : elle est sécante}}$$

    **3.** La droite $d''$ a le même vecteur normal que $d'$ : la perpendiculaire issue de $\Omega$ est donc encore $4x-3y+2=0$. On résout : 
    $$\left\{\begin{array}{rcl} 3x+4y &=& -4 \\ 4x-3y &=& -2 \end{array}\right.$$
     Par la même combinaison, $25x=-12-8=-20$, d'où $x=-\dfrac{4}{5}$, puis $y=-\dfrac{2}{5}$. On calcule alors : 
    $$\Omega H=\sqrt{\left(1+\frac{4}{5}\right)^{2}+\left(2+\frac{2}{5}\right)^{2}} =\sqrt{\left(\frac{9}{5}\right)^{2}+\left(\frac{12}{5}\right)^{2}} =\frac{\sqrt{81+144}}{5}=\frac{15}{5}=3$$
     Cette distance est exactement égale au rayon : 
    $$\boxed{d'' \text{ est tangente à } \mathcal{C}', \text{ au point de contact } H\left(-\frac{4}{5}\,;-\frac{2}{5}\right)}$$
- id: "p-07-30"
  feuille: "f-p-07"
  numero: 30
  titre: "QCM"
