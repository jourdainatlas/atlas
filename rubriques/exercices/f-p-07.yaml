  enonce: |
    Le plan est muni d'un repère orthonormé. On considère les points $A(-2\,;1)$, $B(4\,;3)$ et $C(2\,;-3)$.

    **Partie A : nature du triangle.**

    **1.** Placer les trois points et tracer le triangle $ABC$.

    **2.** Calculer les longueurs $AB$, $AC$ et $BC$. Que peut-on en déduire ?

    **3.** Calculer $\overrightarrow{AB}\cdot\overrightarrow{AC}$, puis en déduire la valeur exacte de $\cos\left(\widehat{BAC}\right)$ et une valeur approchée au dixième de degré de cet angle.

    **Partie B : droites remarquables.**

    **4.** Déterminer une équation cartésienne de la médiatrice $\Delta$ du segment $[AC]$.

    **5.** Vérifier par le calcul que le point $B$ appartient à $\Delta$. Ce résultat était-il prévisible d'après la question 2 ?

    **6.** Déterminer une équation cartésienne de la médiatrice $\Delta'$ du segment $[AB]$.

    **Partie C : cercle circonscrit.**

    **7.** Déterminer les coordonnées du point $\Omega$, intersection de $\Delta$ et $\Delta'$.

    **8.** Calculer $\Omega A$, puis vérifier que $\Omega B=\Omega C=\Omega A$.

    **9.** En déduire une équation du cercle circonscrit au triangle $ABC$, puis le tracer sur la figure.
  corrige: |
    **Partie A : nature du triangle.**

    **1.** Voici la figure, complétée du cercle circonscrit obtenu à la partie C.

    ![Figure](documents/figures/45434d954ada9d6e.svg)

    **2.** On calcule les coordonnées des vecteurs, puis les longueurs : 
    $$\overrightarrow{AB}\begin{pmatrix} 6 \\ 2 \end{pmatrix} \quad ; \quad \overrightarrow{AC}\begin{pmatrix} 4 \\ -4 \end{pmatrix} \quad ; \quad \overrightarrow{BC}\begin{pmatrix} -2 \\ -6 \end{pmatrix}$$

    $$AB=\sqrt{36+4}=\sqrt{40}=2\sqrt{10} \quad ; \quad AC=\sqrt{16+16}=\sqrt{32}=4\sqrt{2} \quad ; \quad BC=\sqrt{4+36}=2\sqrt{10}$$

    $$\boxed{AB=BC=2\sqrt{10}\approx 6{,}32 : \text{le triangle } ABC \text{ est isocèle en } B}$$

    **3.** 
    $$\overrightarrow{AB}\cdot\overrightarrow{AC}=6\times 4+2\times(-4)=24-8=\boxed{16}$$

    $$\cos\left(\widehat{BAC}\right)=\frac{16}{2\sqrt{10}\times 4\sqrt{2}} =\frac{16}{8\sqrt{20}}=\frac{2}{2\sqrt{5}}=\boxed{\frac{1}{\sqrt{5}}=\frac{\sqrt{5}}{5}}$$
     Comme $\dfrac{\sqrt{5}}{5}\approx 0{,}4472$, la calculatrice donne : 
    $$\boxed{\widehat{BAC}\approx 63{,}4^{\circ}}$$

    **Partie B : droites remarquables.**

    **4.** Le milieu de $[AC]$ est $\left(\dfrac{-2+2}{2}\,;\dfrac{1-3}{2}\right)=(0\,;-1)$, et $\overrightarrow{AC}\begin{pmatrix} 4 \\ -4 \end{pmatrix}$, que l'on simplifie en $\begin{pmatrix} 1 \\ -1 \end{pmatrix}$, est normal à $\Delta$ : 
    $$x-y+c=0 \quad \text{avec} \quad 0+1+c=0 \quad \text{soit} \quad c=-1$$

    $$\boxed{\Delta : x-y-1=0}$$

    **5.** On remplace par les coordonnées de $B(4\,;3)$ : 
    $$4-3-1=0$$

    $$\boxed{B \text{ appartient bien à } \Delta}$$
     C'était prévisible : la médiatrice de $[AC]$ est l'ensemble des points équidistants de $A$ et de $C$. Or la question 2 a établi que $BA=BC$, donc $B$ en fait partie.

    **6.** Le milieu de $[AB]$ est $\left(\dfrac{-2+4}{2}\,;\dfrac{1+3}{2}\right)=(1\,;2)$, et $\overrightarrow{AB}\begin{pmatrix} 6 \\ 2 \end{pmatrix}$ se simplifie en $\begin{pmatrix} 3 \\ 1 \end{pmatrix}$ : 
    $$3x+y+c=0 \quad \text{avec} \quad 3+2+c=0 \quad \text{soit} \quad c=-5$$

    $$\boxed{\Delta' : 3x+y-5=0}$$

    **Partie C : cercle circonscrit.**

    **7.** On résout : 
    $$\left\{\begin{array}{rcl} x-y &=& 1 \\ 3x+y &=& 5 \end{array}\right.$$
     En additionnant les deux lignes : $4x=6$, donc $x=\dfrac{3}{2}$, puis $y=x-1=\dfrac{1}{2}$ : 
    $$\boxed{\Omega\left(\frac{3}{2}\,;\frac{1}{2}\right)}$$

    **8.** 
    $$\Omega A^{2}=\left(-2-\frac{3}{2}\right)^{2}+\left(1-\frac{1}{2}\right)^{2} =\left(-\frac{7}{2}\right)^{2}+\left(\frac{1}{2}\right)^{2}=\frac{49+1}{4}=\frac{25}{2}$$

    $$\Omega B^{2}=\left(\frac{5}{2}\right)^{2}+\left(\frac{5}{2}\right)^{2}=\frac{50}{4} =\frac{25}{2} \qquad ; \qquad \Omega C^{2}=\left(\frac{1}{2}\right)^{2}+\left(-\frac{7}{2}\right)^{2}=\frac{25}{2}$$

    $$\boxed{\Omega A=\Omega B=\Omega C=\sqrt{\frac{25}{2}}=\frac{5\sqrt{2}}{2}\approx 3{,}54}$$

    **9.** Le point $\Omega$ est donc équidistant des trois sommets : c'est le centre du cercle circonscrit, de rayon $R=\dfrac{5\sqrt{2}}{2}$. 
    $$\boxed{\left(x-\frac{3}{2}\right)^{2}+\left(y-\frac{1}{2}\right)^{2}=\frac{25}{2}}$$
     Ce cercle est tracé en ocre sur la figure de la question 1.
- id: "p-07-33"
  feuille: "f-p-07"
  numero: 33
  titre: "Type Bac"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Type Bac, Conjecture, Calcul]
  mots_cles: [produit scalaire, norme, angle et cosinus, orthogonalité, expression analytique, équations de droites, lignes de niveau]
  noeuds: [f-hilbert, gd-normes]
  notions: [norme]
  page_enonce: 12
  page_corrige: 24
  enonce: |
    $ABCD$ est un carré de côté $a>0$. On note $I$ le milieu de $[BC]$ et $J$ celui de $[CD]$.

    **1.** Faire une figure soignée avec $a=6$ cm, puis tracer les segments $[AI]$ et $[BJ]$. Que peut-on conjecturer à propos des droites $(AI)$ et $(BJ)$ ?

    **2.** On munit le plan du repère orthonormé $\left(A\,;\dfrac{1}{a}\overrightarrow{AB},\dfrac{1}{a}\overrightarrow{AD}\right)$. Donner les coordonnées des points $A$, $B$, $C$, $D$, $I$ et $J$ dans ce repère.

    **3.** Déterminer les coordonnées des vecteurs $\overrightarrow{AI}$ et $\overrightarrow{BJ}$, puis calculer $\overrightarrow{AI}\cdot\overrightarrow{BJ}$. Conclure quant à la conjecture.

    **4.** Calculer $\overrightarrow{AI}\cdot\overrightarrow{AJ}$, ainsi que les longueurs $AI$ et $AJ$. En déduire une valeur approchée au dixième de degré de l'angle $\widehat{IAJ}$.

    **5.** *Généralisation.* On remplace le carré par un rectangle de longueur $L=AB$ et de largeur $\ell=AD$. Reprendre la question 3 et déterminer à quelle condition sur $L$ et $\ell$ les droites $(AI)$ et $(BJ)$ restent perpendiculaires.
  corrige: |
    **1.** En traçant le carré et les deux segments, on constate qu'ils semblent se couper à angle droit. 
    $$\boxed{\text{Conjecture : les droites } (AI) \text{ et } (BJ) \text{ sont perpendiculaires}}$$

    ![Figure](documents/figures/2ea73bb7f34733ca.svg)

    **2.** Dans le repère $\left(A\,;\dfrac{1}{a}\overrightarrow{AB},\dfrac{1}{a}\overrightarrow{AD}\right)$, les deux vecteurs de base sont unitaires et orthogonaux : le repère est bien orthonormé, et les coordonnées sont exprimées en multiples de $a$. 
    $$\boxed{A(0\,;0) \quad ; \quad B(a\,;0) \quad ; \quad C(a\,;a) \quad ; \quad D(0\,;a)}$$
     Le point $I$ est le milieu de $[BC]$ et $J$ celui de $[CD]$ : 
    $$\boxed{I\left(a\,;\frac{a}{2}\right) \qquad ; \qquad J\left(\frac{a}{2}\,;a\right)}$$

    **3.** 
    $$\overrightarrow{AI}\begin{pmatrix} a \\[1mm] \frac{a}{2} \end{pmatrix} \qquad ; \qquad \overrightarrow{BJ}\begin{pmatrix} \frac{a}{2}-a \\[1mm] a \end{pmatrix} =\begin{pmatrix} -\frac{a}{2} \\[1mm] a \end{pmatrix}$$

    $$\overrightarrow{AI}\cdot\overrightarrow{BJ}=a\times\left(-\frac{a}{2}\right)+\frac{a}{2}\times a =-\frac{a^{2}}{2}+\frac{a^{2}}{2}=\boxed{0}$$
     Le produit scalaire est nul, donc les deux vecteurs sont orthogonaux : 
    $$\boxed{\text{La conjecture est démontrée : } (AI)\perp(BJ)}$$

    **4.** Avec $\overrightarrow{AJ}\begin{pmatrix} \frac{a}{2} \\[1mm] a \end{pmatrix}$ : 
    $$\overrightarrow{AI}\cdot\overrightarrow{AJ}=a\times\frac{a}{2}+\frac{a}{2}\times a=\boxed{a^{2}}$$

    $$AI=\sqrt{a^{2}+\frac{a^{2}}{4}}=\sqrt{\frac{5a^{2}}{4}}=\frac{a\sqrt{5}}{2}=AJ$$

    $$\cos\left(\widehat{IAJ}\right)=\frac{a^{2}} {\frac{a\sqrt{5}}{2}\times\frac{a\sqrt{5}}{2}}=\frac{a^{2}}{\frac{5a^{2}}{4}} =\boxed{\frac{4}{5}}$$
     Ce résultat ne dépend pas de $a$, ce qui est logique : tous les carrés sont semblables. 
    $$\boxed{\widehat{IAJ}\approx 36{,}9^{\circ}}$$

    **5.** Dans le rectangle, $B(L\,;0)$, $C(L\,;\ell)$, $D(0\,;\ell)$, donc $I\left(L\,;\dfrac{\ell}{2}\right)$ et $J\left(\dfrac{L}{2}\,;\ell\right)$ : 
    $$\overrightarrow{AI}\cdot\overrightarrow{BJ}=L\times\left(-\frac{L}{2}\right)+\frac{\ell}{2}\times\ell =\frac{\ell^{2}-L^{2}}{2}$$
     Ce produit est nul si et seulement si $\ell^{2}=L^{2}$, soit, ces longueurs étant positives : 
    $$\boxed{(AI)\perp(BJ) \iff L=\ell, \text{ c'est-à-dire si et seulement si le rectangle est un carré}}$$
     La propriété est donc caractéristique du carré : elle tombe en défaut dès que le rectangle s'allonge.
- id: "p-07-34"
  feuille: "f-p-07"
  numero: 34
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration, Calcul]
  mots_cles: [produit scalaire, norme, angle et cosinus, "théorème d'Al-Kashi"]
  noeuds: [f-hilbert, gd-normes]
  notions: [norme]
  page_enonce: 13
  page_corrige: 25
  enonce: |
    **Partie A : le théorème d'Al-Kashi.**

    Soit $ABC$ un triangle quelconque. On note $a=BC$, $b=AC$, $c=AB$, et $\alpha$ la mesure de l'angle $\widehat{BAC}$.

    **1.** Justifier l'égalité vectorielle $\overrightarrow{BC}=\overrightarrow{AC}-\overrightarrow{AB}$.

    **2.** En développant $\left\|\overrightarrow{AC}-\overrightarrow{AB}\right\|^{2}$, démontrer que : 
    $$BC^{2}=AB^{2}+AC^{2}-2\,\overrightarrow{AB}\cdot\overrightarrow{AC}$$

    **3.** En déduire le théorème d'Al-Kashi : 
    $$a^{2}=b^{2}+c^{2}-2bc\cos(\alpha)$$

    **4.** Que devient cette formule lorsque $\alpha=\dfrac{\pi}{2}$ ? Quel théorème retrouve-t-on ?

    **Partie B : applications.**

    **5.** Dans un triangle $ABC$, on donne $AB=7$, $AC=5$ et $\widehat{BAC}=60^{\circ}$. Calculer la valeur exacte de $BC$, puis une valeur approchée au centième.

    **6.** Dans un triangle $ABC$, on donne $AB=8$, $AC=6$ et $BC=7$. Déterminer la valeur exacte de $\cos\left(\widehat{BAC}\right)$, puis une valeur approchée au dixième de degré de cet angle.

    **7.** Un randonneur part d'un point $A$, marche $4$ km vers le nord jusqu'à un point $B$, puis tourne de $50^{\circ}$ vers l'est et marche encore $3$ km jusqu'à un point $C$. Faire un schéma, puis calculer la distance $AC$ à $10$ m près.

    *On commencera par déterminer la mesure de l'angle $\widehat{ABC}$.*
  corrige: |
    **Partie A : le théorème d'Al-Kashi.**

    **1.** Par la relation de Chasles, $\overrightarrow{BC}=\overrightarrow{BA}+\overrightarrow{AC}$. Or $\overrightarrow{BA}=-\overrightarrow{AB}$, donc : 
    $$\boxed{\overrightarrow{BC}=\overrightarrow{AC}-\overrightarrow{AB}}$$

    **2.** On développe la norme au carré, comme à l'exercice 14 : 
    $$\begin{aligned} BC^{2} &= \left\|\overrightarrow{AC}-\overrightarrow{AB}\right\|^{2} \\ &= \left\|\overrightarrow{AC}\right\|^{2}-2\,\overrightarrow{AC}\cdot\overrightarrow{AB} +\left\|\overrightarrow{AB}\right\|^{2} \end{aligned}$$

    $$\boxed{BC^{2}=AB^{2}+AC^{2}-2\,\overrightarrow{AB}\cdot\overrightarrow{AC}}$$

    **3.** Il reste à remplacer le produit scalaire par son expression géométrique, $\overrightarrow{AB}\cdot\overrightarrow{AC}=AB\times AC\times\cos(\alpha)=cb\cos(\alpha)$ : 
    $$\boxed{a^{2}=b^{2}+c^{2}-2bc\cos(\alpha)}$$

    **4.** Si $\alpha=\dfrac{\pi}{2}$, alors $\cos(\alpha)=0$ et le dernier terme disparaît : 
    $$a^{2}=b^{2}+c^{2}$$

    $$\boxed{\text{On retrouve le théorème de Pythagore}}$$
     Le terme $-2bc\cos(\alpha)$ mesure ainsi l'écart à l'angle droit : négatif si $\alpha$ est aigu, positif s'il est obtus.

    **Partie B : applications.**

    **5.** Avec $b=AC=5$, $c=AB=7$ et $\alpha=60^{\circ}$ : 
    $$BC^{2}=25+49-2\times 5\times 7\times\frac{1}{2}=74-35=39$$

    $$\boxed{BC=\sqrt{39}\approx 6{,}24}$$

    **6.** On isole le cosinus dans la formule : 
    $$\cos(\alpha)=\frac{b^{2}+c^{2}-a^{2}}{2bc}=\frac{36+64-49}{2\times 6\times 8} =\frac{51}{96}=\boxed{\frac{17}{32}}$$
     Comme $\dfrac{17}{32}=0{,}53125$ : 
    $$\boxed{\widehat{BAC}\approx 57{,}9^{\circ}}$$

    **7.** Le randonneur avance d'abord vers le nord, puis tourne de $50^{\circ}$ vers l'est : l'angle intérieur du triangle en $B$ vaut donc : 
    $$\widehat{ABC}=180^{\circ}-50^{\circ}=130^{\circ}$$

    ![Figure](documents/figures/6758b400e090d0ad.svg)

    Le théorème d'Al-Kashi appliqué au sommet $B$ donne alors : 
    $$AC^{2}=BA^{2}+BC^{2}-2\times BA\times BC\times\cos\left(\widehat{ABC}\right)$$

    $$AC^{2}=16+9-2\times 4\times 3\times\cos(130^{\circ})\approx 25+15{,}43\approx 40{,}43$$

    $$\boxed{AC\approx 6{,}36 \text{ km}}$$
     Le cosinus étant négatif, le dernier terme *augmente* la distance : c'est logique, le randonneur s'éloigne de son point de départ en ne tournant que de $50^{\circ}$.
- id: "p-07-35"
  feuille: "f-p-07"
