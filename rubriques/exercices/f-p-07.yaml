  page_corrige: 18
  enonce: |
    Dans un repère orthonormé, on considère les points $A(-1\,;2)$ et $B(5\,;4)$. On note $\mathcal{E}$ l'ensemble des points $M(x\,;y)$ du plan tels que $\overrightarrow{MA}\cdot\overrightarrow{MB}=0$.

    **1.** Placer $A$ et $B$, puis quelques points de $\mathcal{E}$ obtenus « à vue » en cherchant des points d'où l'on voit $[AB]$ sous un angle droit. Que semble être $\mathcal{E}$ ?

    **2.** Exprimer les coordonnées de $\overrightarrow{MA}$ et $\overrightarrow{MB}$ en fonction de $x$ et $y$.

    **3.** Démontrer que $M$ appartient à $\mathcal{E}$ si et seulement si : 
    $$x^{2}+y^{2}-4x-6y+3=0$$

    **4.** Démontrer que cette équation est celle d'un cercle dont on précisera le centre et le rayon.

    **5.** Vérifier que ce centre est le milieu de $[AB]$ et que ce rayon vaut $\dfrac{AB}{2}$. Énoncer la propriété de géométrie ainsi retrouvée.

    **6.** Tracer $\mathcal{E}$ sur la figure de la question 1.
  corrige: |
    **1.** Les points d'où l'on voit $[AB]$ sous un angle droit semblent décrire un cercle passant par $A$ et par $B$. La figure obtenue à la question 6 le confirme.

    **2.** 
    $$\boxed{\overrightarrow{MA}\begin{pmatrix} -1-x \\ 2-y \end{pmatrix} \qquad ; \qquad \overrightarrow{MB}\begin{pmatrix} 5-x \\ 4-y \end{pmatrix}}$$

    **3.** On écrit le produit scalaire puis on développe : 
    $$\begin{aligned} \overrightarrow{MA}\cdot\overrightarrow{MB} &= (-1-x)(5-x)+(2-y)(4-y) \\ &= -5+x-5x+x^{2}+8-2y-4y+y^{2} \\ &= x^{2}+y^{2}-4x-6y+3 \end{aligned}$$

    $$\boxed{M\in\mathcal{E} \iff x^{2}+y^{2}-4x-6y+3=0}$$

    **4.** On procède comme à l'exercice 27 : 
    $$x^{2}+y^{2}-4x-6y+3=0 \iff (x-2)^{2}-4+(y-3)^{2}-9+3=0 \iff (x-2)^{2}+(y-3)^{2}=10$$

    $$\boxed{\mathcal{E} \text{ est le cercle de centre } \Omega(2\,;3) \text{ et de rayon } \sqrt{10}\approx 3{,}16}$$

    **5.** Le milieu de $[AB]$ a pour coordonnées $\left(\dfrac{-1+5}{2}\,;\dfrac{2+4}{2}\right) =(2\,;3)$ : c'est bien $\Omega$. Par ailleurs $AB=\sqrt{36+4}=\sqrt{40}$, donc : 
    $$\frac{AB}{2}=\frac{\sqrt{40}}{2} \qquad \text{et} \qquad \left(\frac{AB}{2}\right)^{2}=\frac{40}{4}=10=R^{2}$$

    $$\boxed{\mathcal{E} \text{ est le cercle de diamètre } [AB]}$$
     On retrouve ainsi une propriété connue depuis le collège : 
    $$\boxed{\begin{array}{c} \text{Un point } M \text{ distinct de } A \text{ et } B \text{ voit } [AB] \text{ sous un angle droit} \\[1mm] \text{si et seulement s'il appartient au cercle de diamètre } [AB] \end{array}}$$

    **6.** Voici la figure complétée.

    ![Figure](documents/figures/b0beaf02b74d5990.svg)

    On vérifie sur un exemple : pour $M(1\,;6)$, on a $\overrightarrow{MA}\begin{pmatrix} -2 \\ -4 \end{pmatrix}$ et $\overrightarrow{MB}\begin{pmatrix} 4 \\ -2 \end{pmatrix}$, dont le produit scalaire vaut $-8+8=0$. Le point $M$ appartient bien à $\mathcal{E}$.
- id: "p-07-29"
  feuille: "f-p-07"
  numero: 29
