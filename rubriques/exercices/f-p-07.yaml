  enonce: |
    Chacune des affirmations suivantes est-elle vraie ou fausse ? Justifier la réponse : par une démonstration si l'affirmation est vraie, par un contre-exemple sinon.

    **1.** Pour tous vecteurs $\vec{u}$ et $\vec{v}$, $\vec{u}\cdot\vec{v}=\vec{v}\cdot\vec{u}$.

    **2.** Si $\vec{u}\cdot\vec{v}=0$, alors $\vec{u}=\vec{0}$ ou $\vec{v}=\vec{0}$.

    **3.** Pour tout vecteur $\vec{u}$, $\vec{u}\cdot\vec{u}\geqslant 0$.

    **4.** Si $\vec{u}\cdot\vec{v}>0$, alors la mesure principale de l'angle $(\vec{u},\vec{v})$ appartient à $\left]-\dfrac{\pi}{2}\,;\dfrac{\pi}{2}\right[$.

    **5.** Le produit scalaire de deux vecteurs est un vecteur.

    **6.** La formule $\vec{u}\cdot\vec{v}=xx'+yy'$ est valable dans n'importe quel repère.

    **7.** Toute équation de la forme $x^{2}+y^{2}+ax+by+c=0$ est celle d'un cercle.

    **8.** Si $\|\vec{u}\|=\|\vec{v}\|$, alors $(\vec{u}+\vec{v})\cdot(\vec{u}-\vec{v})=0$.

    **9.** Deux droites de vecteurs normaux respectifs $\vec{n}\begin{pmatrix} 2 \\ 3 \end{pmatrix}$ et $\vec{n}'\begin{pmatrix} 3 \\ -2 \end{pmatrix}$ sont perpendiculaires.

    **10.** Si trois points $A$, $B$ et $C$ vérifient $\overrightarrow{AB}\cdot\overrightarrow{AC}<0$, alors l'angle $\widehat{BAC}$ est obtus.
  corrige: |
    **1.** **Vraie**. C'est la symétrie du produit scalaire, énoncée à la proposition 6. Elle se lit aussi sur l'expression analytique : $xx'+yy'=x'x+y'y$.

    **2.** **Fausse**. C'est le point le plus important du chapitre : deux vecteurs *non nuls* peuvent avoir un produit scalaire nul. Contre-exemple avec $\vec{u}\begin{pmatrix} 1 \\ 0 \end{pmatrix}$ et $\vec{v}\begin{pmatrix} 0 \\ 1 \end{pmatrix}$ : 
    $$\vec{u}\cdot\vec{v}=1\times 0+0\times 1=0$$
     et pourtant aucun des deux n'est nul : ils sont simplement orthogonaux.

    **3.** **Vraie**. D'après la proposition 1, $\vec{u}\cdot\vec{u}=\|\vec{u}\|^{2}$, et un carré est toujours positif.

    **4.** **Vraie**. Le signe de $\vec{u}\cdot\vec{v}$ est celui de $\cos\left(\vec{u},\vec{v}\right)$, qui est strictement positif exactement lorsque la mesure principale appartient à $\left]-\dfrac{\pi}{2}\,;\dfrac{\pi}{2}\right[$.

    **5.** **Fausse**. Le produit scalaire de deux vecteurs est un **nombre réel**, ce qui explique d'ailleurs son nom : un scalaire. C'est ce qui le distingue du produit vectoriel évoqué dans l'introduction du cours.

    **6.** **Fausse**. Cette formule n'est valable que dans un repère **orthonormé**. C'est une hypothèse explicite de la proposition 5, et elle est indispensable : sa démonstration repose sur le fait que les vecteurs de base sont unitaires et orthogonaux.

    **7.** **Fausse**. L'exercice 27 en donne deux contre-exemples : l'équation $x^{2}+y^{2}-6x+9=0$ décrit un point unique, et $x^{2}+y^{2}+2x+4y+10=0$ décrit l'ensemble vide.

    **8.** **Vraie**. D'après l'exercice 18 : 
    $$(\vec{u}+\vec{v})\cdot(\vec{u}-\vec{v})=\|\vec{u}\|^{2}-\|\vec{v}\|^{2}=0$$
     puisque les deux normes sont égales.

    **9.** **Vraie**. On calcule le produit scalaire des deux vecteurs normaux : 
    $$2\times 3+3\times(-2)=6-6=0$$
     Les vecteurs normaux étant orthogonaux, les droites le sont aussi.

    **10.** **Vraie**. On a $\overrightarrow{AB}\cdot\overrightarrow{AC}=AB\times AC\times\cos\left(\widehat{BAC}\right)$. Les longueurs étant positives, le produit est négatif si et seulement si le cosinus l'est, c'est-à-dire si et seulement si l'angle est obtus.
