  etoiles: 1
  types: [QCM, Démonstration]
  mots_cles: [produit scalaire, norme, orthogonalité, expression analytique, vecteur normal, équations de droites, équations de cercles]
  noeuds: [f-hilbert, gd-normes]
  notions: [norme]
  page_enonce: 11
  page_corrige: 21
  enonce: |
    Pour chaque question, une seule réponse est exacte. La justifier. Le plan est muni d'un repère orthonormé.

    ```tableau
    **Question** ¦ **Réponse A** ¦ **Réponse B** ¦ **Réponse C**
    1. Si $\vec{u}\begin{pmatrix} 3 \\ -1 \end{pmatrix}$ et $\vec{v}\begin{pmatrix} 2 \\ 5 \end{pmatrix}$, alors $\vec{u}\cdot\vec{v}$ vaut : ¦ $1$ ¦ $11$ ¦ $-1$
    2. Si $\|\vec{u}\|=4$, $\|\vec{v}\|=3$ et $(\vec{u},\vec{v})=\dfrac{\pi}{3}$, alors $\vec{u}\cdot\vec{v}$ vaut : ¦ $6$ ¦ $12$ ¦ $-6$
    3. Pour tout vecteur $\vec{u}$, le produit $\vec{u}\cdot\vec{u}$ vaut : ¦ $\|\vec{u}\|$ ¦ $\|\vec{u}\|^{2}$ ¦ $0$
    4. Deux vecteurs non nuls sont orthogonaux si et seulement si leur produit scalaire vaut : ¦ $1$ ¦ $0$ ¦ $-1$
    5. Un vecteur normal à la droite $4x-3y+7=0$ est : ¦ $\begin{pmatrix} 4 \\ -3 \end{pmatrix}$ ¦ $\begin{pmatrix} 3 \\ 4 \end{pmatrix}$ ¦ $\begin{pmatrix} -3 \\ -4 \end{pmatrix}$
    6. Le cercle d'équation $(x+1)^{2}+(y-2)^{2}=9$ a pour centre : ¦ $(1\,;-2)$ ¦ $(-1\,;2)$ ¦ $(-1\,;-2)$
    7. Le cercle d'équation $(x-3)^{2}+(y+1)^{2}=5$ a pour rayon : ¦ $5$ ¦ $25$ ¦ $\sqrt{5}$
    8. Si $\vec{u}$ et $\vec{v}$ sont non nuls et $\vec{u}\cdot\vec{v}=-\|\vec{u}\|\times\|\vec{v}\|$, alors ils sont : ¦ orthogonaux ¦ colinéaires de même sens ¦ colinéaires de sens contraire
    9. Dans un carré $ABCD$ de côté $2$, $\overrightarrow{AB}\cdot\overrightarrow{AC}$ vaut : ¦ $0$ ¦ $4$ ¦ $4\sqrt{2}$
    10. La droite d'équation $x=3$ admet pour vecteur normal : ¦ $\begin{pmatrix} 1 \\ 0 \end{pmatrix}$ ¦ $\begin{pmatrix} 0 \\ 1 \end{pmatrix}$ ¦ $\begin{pmatrix} 3 \\ 0 \end{pmatrix}$
    ```
  corrige: |
    ```tableau
    **Question** ¦ **Réponse** ¦ **Justification**
    1 ¦ **A** ¦ $3\times 2+(-1)\times 5=6-5=1$. La réponse B additionnerait les produits sans tenir compte du signe.
    2 ¦ **A** ¦ $4\times 3\times\cos\left(\frac{\pi}{3}\right)=12\times\frac{1}{2}=6$. La réponse B oublie le cosinus.
    3 ¦ **B** ¦ C'est la proposition 1 : $\vec{u}\cdot\vec{u}=\|\vec{u}\|\times\|\vec{u}\| \times\cos(0)=\|\vec{u}\|^{2}$.
    4 ¦ **B** ¦ Deux vecteurs non nuls sont orthogonaux si et seulement si le cosinus de leur angle est nul, donc si et seulement si leur produit scalaire est nul.
    5 ¦ **A** ¦ Pour $ax+by+c=0$, le vecteur normal est $\binom{a}{b}$. Le vecteur $\binom{3}{4}$ est ici *directeur* : c'est le piège de la question.
    6 ¦ **B** ¦ L'équation $(x+1)^{2}=(x-(-1))^{2}$ correspond à une abscisse de centre égale à $-1$, et $(y-2)^{2}$ à une ordonnée égale à $2$.
    7 ¦ **C** ¦ Le second membre vaut $R^{2}$, donc $R=\sqrt{5}$ et non $5$.
    8 ¦ **C** ¦ C'est le cas d'égalité $\cos\left(\vec{u},\vec{v}\right)=-1$, obtenu lorsque l'angle vaut $\pi$.
    9 ¦ **B** ¦ $\overrightarrow{AB}\cdot\overrightarrow{AC}=2\times 2\sqrt{2}\times\cos\left(\frac{\pi}{4}\right) =4$. On peut aussi projeter $C$ sur $(AB)$ en $B$ : le produit vaut $AB^{2}=4$.
    10 ¦ **A** ¦ L'équation s'écrit $1\times x+0\times y-3=0$, d'où le vecteur normal $\binom{1}{0}$. Le vecteur $\binom{3}{0}$ convient aussi, mais il est colinéaire à $\binom{1}{0}$ et la réponse A est la forme attendue.
    ```
- id: "p-07-31"
