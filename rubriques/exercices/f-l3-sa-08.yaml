- id: "l3-sa-08-01"
  feuille: "f-l3-sa-08"
  numero: 1
  partie: "Calculs dans les corps finis"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [calculs dans les corps finis]
  noeuds: [gs-corps-finis]
  notions: [corps-fini]
  source: "Nice, L3 Algèbre effective, « Corps finis », exercice 1 ; Exo7 (fic00031), exercice 1 (4)"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Soit $A = X^{4} + 2X + 1$ et $B = 2X^{2} + X + 2$, dans $\mathbb{Z}[X]$. Calculer la division euclidienne de $A$ par $B$ dans $\mathbb{F}_{3}[X]$, puis dans $\mathbb{F}_{5}[X]$, et comparer les PGCD de $A$ et $B$ dans ces deux anneaux. Qu'en déduit-on sur le PGCD de $A$ et $B$ dans $\mathbb{Q}[X]$ ? dans $\mathbb{Z}[X]$ ?

    **2.** Soit $K$ un corps. Montrer que $K[X]$ possède une infinité de polynômes unitaires irréductibles. *On pourra imiter la démonstration d'Euclide de l'infinité des nombres premiers.*
  corrige: |
    **1.** Dans $\mathbb{F}_{3}[X]$, on trouve $A = B \cdot (-X^{2} - X) + (X + 1)$. Comme $B(-1) = 2 - 1 + 2 = 3 = 0$, le reste $X + 1$ divise $B$ : $\boxed{\mathrm{pgcd}(A, B) = X + 1 \text{ dans } \mathbb{F}_{3}[X]}$.

    Dans $\mathbb{F}_{5}[X]$, on trouve $A = B \cdot (3X^{2} + X + 4) + (X - 2)$. Comme $B(2) = 12 = 2 \neq 0$, $X - 2$ ne divise pas $B$, et $\boxed{\mathrm{pgcd}(A, B) = 1 \text{ dans } \mathbb{F}_{5}[X]}$.

    Dans $\mathbb{Q}[X]$, le PGCD vaut $1$. Sinon, un facteur commun $D$ de degré $\geqslant 1$ pourrait être pris primitif dans $\mathbb{Z}[X]$, et il diviserait $A$ et $B$ dans $\mathbb{Z}[X]$ (chapitre 5, prop. 5). Comme $A$ est unitaire, le coefficient dominant de $D$ vaudrait $\pm 1$, et la réduction de $D$ modulo $5$, de même degré, serait un diviseur commun non constant de $\overline{A}$ et $\overline{B}$ dans $\mathbb{F}_{5}[X]$ : c'est exclu. Dans $\mathbb{Z}[X]$, le PGCD vaut aussi $1$, puisque $A$ est primitif.

    *Le PGCD ne commute donc pas à la réduction modulo $p$* : il peut grossir. Ici, $3$ divise le résultant $R(A, B) = 141 = 3 \times 47$ (feuille 6), ce qui explique le facteur commun modulo $3$.

    **2.** L'ensemble des polynômes unitaires irréductibles n'est pas vide : $X$ en est un. Supposons qu'il soit fini, formé de $P_{1}$, …, $P_{k}$, et posons $Q = P_{1}\cdots P_{k} + 1$, de degré $\geqslant 1$.

    Un facteur irréductible unitaire de $Q$ est l'un des $P_{i}$ ; il divise alors $Q - P_{1}\cdots P_{k} = 1$, ce qui est absurde. Il y a donc une $\boxed{\text{infinité}}$ de polynômes unitaires irréductibles. Si $K$ est infini, les $X - a$ suffisent ; l'argument est utile pour les corps finis.
- id: "l3-sa-08-02"
  feuille: "f-l3-sa-08"
  numero: 2
  partie: "Calculs dans les corps finis"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [calculs dans les corps finis, groupe multiplicatif cyclique]
  noeuds: [gs-corps-finis, gf-multiplicatif]
  notions: [corps-fini, groupe-multiplicatif]
  source: "Nice, « Corps finis », exercice 2 ; Paris 13, M1, exercices de théorie des corps finis, exercice 8"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** On note $\mathbb{F}_{4} = \mathbb{F}_{2}[X]/\langle X^{2} + X + 1 \rangle$ et $j$ la classe de $X$. Dresser la table de multiplication de $\mathbb{F}_{4}$, donner l'inverse de chaque élément non nul, et les générateurs de $\mathbb{F}_{4}^{*}$.

    **2.** Montrer que $Q_{1} = X^{3} + X^{2} + 2$ et $Q_{2} = X^{3} + 2X + 1$ sont irréductibles dans $\mathbb{F}_{3}[X]$. Combien le groupe multiplicatif d'un corps à $27$ éléments a-t-il de générateurs ?

    **3.** Dans $\mathbb{F}_{3}[X]/\langle Q_{1} \rangle$, la classe $x$ de $X$ est-elle un générateur du groupe multiplicatif ? En trouver un.

    **4.** Dans $\mathbb{F}_{3}[X]/\langle Q_{2} \rangle$, montrer que la classe $y$ de $X$ engendre le groupe multiplicatif, et trouver $i$ tel que $y^{2} + y = y^{i}$.
  corrige: |
    **1.** Avec $j^{2} = j + 1$, on obtient $j(j + 1) = j^{2} + j = 1$ et $(j + 1)^{2} = j^{2} + 1 = j$. D'où la table : 
    $$\begin{array}{c|cccc} \times & 0 & 1 & j & j + 1 \\ \hline 0 & 0 & 0 & 0 & 0 \\ 1 & 0 & 1 & j & j + 1 \\ j & 0 & j & j + 1 & 1 \\ j + 1 & 0 & j + 1 & 1 & j \end{array}$$
     Les inverses sont $1^{-1} = 1$, $j^{-1} = j + 1$ et $(j + 1)^{-1} = j$. Le groupe $\mathbb{F}_{4}^{*}$ est d'ordre $3$, premier : ses générateurs sont $\boxed{j \text{ et } j + 1 = j^{2}}$.

    **2.** En $0$, $1$, $2$, le polynôme $Q_{1}$ prend les valeurs $2$, $1$, $2$, et $Q_{2}$ les valeurs $1$, $1$, $1$ : ni l'un ni l'autre n'a de racine, et, de degré $3$, ils sont irréductibles.

    Le groupe multiplicatif d'un corps à $27$ éléments est cyclique d'ordre $26$ (cours, th. 2) : il a $\boxed{\varphi(26) = 12 \text{ générateurs}}$.

    **3.** Dans $\mathbb{F}_{3}[X]/\langle Q_{1} \rangle$, on a $x^{3} = -x^{2} - 2 = 2x^{2} + 1$. L'ordre de $x$ divise $26$, et $x$, $x^{2}$ ne valent pas $1$. Calculons $x^{13}$ en utilisant le Frobenius, qui est additif : 
    $$x^{4} = 2x^{3} + x = x^{2} + x + 2, \qquad x^{9} = (x^{3})^{3} = 2x^{6} + 1 = 2(2x^{2} + 1)^{2} + 1 = x^{2} + 2x + 1,$$
     après réduction. Puis $x^{13} = x^{9}x^{4} = (x^{2} + 2x + 1)(x^{2} + x + 2) = 1$, après développement et réduction (calcul contrôlé par ordinateur).

    Ainsi $x$ est d'ordre $13$ : *ce n'est pas un générateur*. En revanche, $(-x)^{13} = -1$ et $(-x)^{2} = x^{2} \neq 1$, donc $\boxed{-x \text{ est d'ordre } 26}$ et engendre le groupe multiplicatif.

    **4.** Dans $\mathbb{F}_{3}[X]/\langle Q_{2} \rangle$, on a $y^{3} = -2y - 1 = y + 2$, puis $y^{9} = (y + 2)^{3} = y^{3} + 8 = y + 1$. Il vient 
    $$y^{13} = y^{9}\,y^{3}\,y = (y + 1)(y + 2)\,y = (y^{2} + 2)\,y = y^{3} + 2y = 2 = -1.$$
     Comme $y^{13} \neq 1$ et $y^{2} \neq 1$, l'ordre de $y$ est $26$ : $y$ est un générateur.

    Enfin, $y^{10} = y^{9}\,y = (y + 1)\,y = y^{2} + y$, donc $\boxed{i = 10}$ convient (et c'est le seul exposant entre $0$ et $25$).
