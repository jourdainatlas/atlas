  enonce: |
    **1.** *(Clôture algébrique de $\mathbb{F}_{p}$.)* On choisit, pour tout $n \geqslant 1$, un corps $K_{n}$ à $p^{n!}$ éléments, de sorte que $K_{1} \subset K_{2} \subset \cdots$, et l'on pose $\Omega = \bigcup_{n \geqslant 1}K_{n}$. Justifier ce choix. Montrer que $\Omega$ est un corps, algébrique sur $\mathbb{F}_{p}$, qui contient un unique sous-corps à $p^{n}$ éléments pour tout $n \geqslant 1$, et que $\Omega$ est une clôture algébrique de $\mathbb{F}_{p}$.

    **2.** *(Corps parfaits.)* Soit $K$ un corps. On dit qu'une extension algébrique $L/K$ est *séparable* si le polynôme minimal sur $K$ de tout élément de $L$ a des racines simples (dans un corps de décomposition), et que $K$ est *parfait* si toute extension finie de $K$ est séparable.

    **(a)** Soit $P \in K[X]$. Montrer que, si $\operatorname{car} K = 0$, $P' = 0$ si et seulement si $P$ est constant, et que, si $\operatorname{car} K = p$, $P' = 0$ si et seulement s'il existe $Q \in K[X]$ tel que $P = Q(X^{p})$.

    **(b)** Montrer qu'un corps algébriquement clos, et un corps de caractéristique nulle, sont parfaits.

    **(c)** Montrer qu'un corps de caractéristique $p$ est parfait si et seulement si son morphisme de Frobenius est surjectif. En déduire que les corps finis sont parfaits, mais pas $\mathbb{F}_{p}(T)$.
  corrige: |
    **1.** *Le choix.* On construit les $K_{n}$ par récurrence. Si $K_{n}$ est construit, soit $K_{n + 1}$ un corps de décomposition de $X^{p^{(n + 1)!}} - X$ sur $K_{n}$. Comme $n!$ divise $(n + 1)!$, les éléments de $K_{n}$, qui vérifient $x^{p^{n!}} = x$, vérifient $x^{p^{(n + 1)!}} = x$ : ce sont des racines de ce polynôme. Ses racines forment un corps (points fixes d'une puissance du Frobenius), qui contient $K_{n}$ et toutes les racines : c'est $K_{n + 1}$, qui a donc $p^{(n + 1)!}$ éléments (racines simples).

    *Corps, algébrique.* Deux éléments de $\Omega$ appartiennent à un même $K_{n}$, puisque la suite est croissante : les opérations y sont définies et vérifient les axiomes de corps. Chaque élément appartient à un corps fini $K_{n}$, extension finie de $\mathbb{F}_{p}$ : il est algébrique sur $\mathbb{F}_{p}$.

    *Sous-corps.* Comme $n \mid n!$, le corps $K_{n}$ contient un sous-corps à $p^{n}$ éléments (cours, prop. 3). Si $F \subset \Omega$ est un sous-corps à $p^{n}$ éléments, ses éléments sont racines de $X^{p^{n}} - X$, qui a au plus $p^{n}$ racines dans $\Omega$ : $F$ est l'ensemble de ces racines, d'où l'unicité. *En revanche, un plongement de $\mathbb{F}_{p^{n}}$ dans $\Omega$ n'est pas unique* : il y en a $n$, qui diffèrent par une puissance du Frobenius (exercice 8). C'est l'image qui est unique ; l'énoncé d'origine parlait d'unicité du plongement.

    *Clôture algébrique.* Soit $P \in \Omega[X]$ non constant, et $\gamma$ une racine de $P$ dans un corps de rupture $E$ d'un facteur irréductible de $P$. Alors $\gamma$ est algébrique sur $\Omega$, qui est algébrique sur $\mathbb{F}_{p}$, donc $\gamma$ est algébrique sur $\mathbb{F}_{p}$ (chapitre 7, th. 3). Son polynôme minimal sur $\mathbb{F}_{p}$, de degré $d$, divise $X^{p^{d}} - X$ (cours, prop. 4), qui est scindé sur $K_{d} \subset \Omega$ puisque $d \mid d!$. Ainsi $\gamma$ est l'une des racines de ce polynôme dans $\Omega$ : $P$ a une racine dans $\Omega$.

    Le corps $\Omega$ est donc algébriquement clos (chapitre 7, prop. 3) et algébrique sur $\mathbb{F}_{p}$ : c'est $\boxed{\text{une clôture algébrique de } \mathbb{F}_{p}}$.

    **2.** (a) Si $P = \sum a_{k}X^{k}$, alors $P' = \sum k\,a_{k}X^{k - 1}$, et $P' = 0$ si et seulement si $k\,a_{k} = 0$ pour tout $k \geqslant 1$.

    En caractéristique nulle, cela signifie $a_{k} = 0$ pour $k \geqslant 1$ : $P$ est constant.

    En caractéristique $p$, cela signifie $a_{k} = 0$ dès que $p \nmid k$ : seuls les exposants multiples de $p$ subsistent, et $P = Q(X^{p})$ avec $Q = \sum a_{pk}X^{k}$.

    (b) Si $K$ est algébriquement clos, le polynôme minimal d'un élément algébrique est irréductible sur $K$, donc de degré $1$ : il a une racine simple.

    Si $\operatorname{car} K = 0$, soit $\mu$ irréductible. Sa dérivée est non nulle (question (a)), de degré inférieur, donc $\mathrm{pgcd}(\mu, \mu')$, diviseur de $\mu$ irréductible, vaut $1$. Une relation de Bézout $u\mu + v\mu' = 1$ montre que $\mu$ et $\mu'$ n'ont pas de racine commune dans un corps de décomposition : les racines de $\mu$ sont simples (chapitre 5, prop. 4). Dans les deux cas, $K$ est $\boxed{\text{parfait}}$.

    (c) *Si le Frobenius est surjectif*, soit $\mu$ irréductible ayant une racine multiple. Alors $\mathrm{pgcd}(\mu, \mu') \neq 1$, donc $\mu$ divise $\mu'$, ce qui impose $\mu' = 0$. Par (a), $\mu = \sum a_{k}X^{pk}$, et en écrivant $a_{k} = b_{k}^{p}$, il vient 
    $$\mu = \sum b_{k}^{p}X^{pk} = \Big(\sum b_{k}X^{k}\Big)^{p},$$
     puisque l'élévation à la puissance $p$ est additive en caractéristique $p$. C'est une contradiction avec l'irréductibilité. Les racines des polynômes minimaux sont donc simples : $K$ est parfait.

    *Si le Frobenius n'est pas surjectif*, soit $a \in K$ qui n'est pas une puissance $p$-ième, et $b$ une racine de $X^{p} - a$ dans un corps de décomposition. Alors $X^{p} - a = X^{p} - b^{p} = (X - b)^{p}$, et le polynôme minimal de $b$ sur $K$ est de la forme $(X - b)^{k}$, avec $1 \leqslant k \leqslant p$. Si $k = 1$, on aurait $b \in K$ et $a = b^{p}$ : c'est exclu. Donc $k \geqslant 2$, $b$ est racine multiple de son polynôme minimal, et l'extension finie $K(b)/K$ n'est pas séparable.

    Ainsi $\boxed{K \text{ parfait} \iff \mathrm{Fr} \text{ surjectif}}$. Un corps fini est parfait, son Frobenius étant injectif donc bijectif (cours, prop. 2). Le corps $\mathbb{F}_{p}(T)$ ne l'est pas : $T$ n'y est pas une puissance $p$-ième, et $X^{p} - T$ est irréductible, avec une unique racine, de multiplicité $p$.
