  enonce: |
    *(Théorème de Wedderburn.)* Dans cet exercice, $A$ est un anneau fini, non nécessairement commutatif, sans diviseur de zéro ($xy = 0 \Rightarrow x = 0$ ou $y = 0$). On veut montrer que $A$ est un corps commutatif.

    **1.** Montrer que tout élément non nul de $A$ est inversible.

    **2.** Montrer que le centre $K = \{x \in A ; ax = xa \text{ pour tout } a \in A\}$ est un corps commutatif fini, et que $|A| = q^{n}$, où $q = |K|$ et $n \geqslant 1$.

    **3.** Pour $x \in A^{\times} = A \setminus \{0\}$, on note $C(x) = \{a \in A ; ax = xa\}$ et $\mathcal{O}(x) = \{gxg^{-1} ; g \in A^{\times}\}$. Montrer que $C(x)$ est un sous-anneau de $A$ contenant $K$, de cardinal $q^{d}$ avec $d \mid n$, et que $|\mathcal{O}(x)| = \frac{q^{n} - 1}{q^{d} - 1}$. *On pourra considérer l'application $g \mapsto gxg^{-1}$ de $A^{\times}$ sur $\mathcal{O}(x)$.*

    **4.** Les ensembles $\mathcal{O}(x)$ forment une partition de $A^{\times}$, et $\mathcal{O}(x) = \{x\}$ si et seulement si $x \in K$. En déduire une relation $q^{n} - 1 = q - 1 + \sum_{i}\frac{q^{n} - 1}{q^{d_{i}} - 1}$, avec des diviseurs $d_{i} < n$ de $n$.

    **5.** Montrer que $\Phi_{n}(q)$ divise $q - 1$, puis que $n = 1$ (exercice 14 (1)). Conclure.
  corrige: |
    **1.** Soit $x \neq 0$. L'application $a \mapsto xa$ est injective, puisque $xa = xb$ entraîne $x(a - b) = 0$, puis $a = b$. L'ensemble $A$ étant fini, elle est bijective : il existe $y$ tel que $xy = 1$.

    Alors $x(yx - 1) = xyx - x = 0$, donc $yx = 1$ : $\boxed{x \text{ est inversible}}$.

    **2.** Le centre $K$ est un sous-anneau commutatif. Si $x \in K$ est non nul et $a \in A$, en multipliant $ax = xa$ à gauche et à droite par $x^{-1}$, on obtient $x^{-1}a = ax^{-1}$ : $x^{-1} \in K$. Ainsi $K$ est un corps commutatif fini, de cardinal $q$.

    La multiplication à gauche par les éléments de $K$ fait de $A$ un $K$-espace vectoriel, de dimension finie $n$ : $\boxed{|A| = q^{n}}$.

    **3.** L'ensemble $C(x)$ contient $1$, $K$ et $x$, et il est stable par somme et produit. Il est aussi stable par inverse : si $a \in C(x)$ est non nul, $ax = xa$ donne $xa^{-1} = a^{-1}x$. C'est un sous-$K$-espace vectoriel de $A$, de cardinal $q^{d}$.

    Le groupe $C(x) \setminus \{0\}$ est un sous-groupe de $A^{\times}$, donc $q^{d} - 1$ divise $q^{n} - 1$ (théorème de Lagrange). Par l'exercice 6 (1), $\mathrm{pgcd}(q^{d} - 1, q^{n} - 1) = q^{\mathrm{pgcd}(d, n)} - 1$ vaut alors $q^{d} - 1$, donc $\mathrm{pgcd}(d, n) = d$ et $\boxed{d \mid n}$.

    L'application $g \mapsto gxg^{-1}$ est surjective de $A^{\times}$ sur $\mathcal{O}(x)$, et $gxg^{-1} = hxh^{-1}$ si et seulement si $h^{-1}g \in C(x)$, c'est-à-dire $g \in h\,(C(x) \setminus \{0\})$. Les fibres sont les classes à gauche suivant ce sous-groupe, toutes de cardinal $q^{d} - 1$, donc 
    $$\boxed{|\mathcal{O}(x)| = \frac{q^{n} - 1}{q^{d} - 1}}.$$

    **4.** La relation « $y \in \mathcal{O}(x)$ » est une relation d'équivalence (conjugaison), d'où la partition. On a $\mathcal{O}(x) = \{x\}$ si et seulement si $x$ commute avec tous les éléments de $A^{\times}$, donc de $A$, c'est-à-dire $x \in K$ : il y a $q - 1$ classes réduites à un élément.

    Pour les autres classes, de représentants $x_{i} \notin K$, on a $C(x_{i}) \neq A$, donc $d_{i} < n$. En comptant les éléments de $A^{\times}$ : 
    $$\boxed{q^{n} - 1 = (q - 1) + \sum_{i}\frac{q^{n} - 1}{q^{d_{i}} - 1}}.$$

    **5.** L'entier $\Phi_{n}(q)$ divise $q^{n} - 1$ (cours, prop. 5) et chacun des $\frac{q^{n} - 1}{q^{d_{i}} - 1}$, puisque $d_{i} \mid n$, $d_{i} < n$ (exercice 14 (1)). Par la relation précédente, $\boxed{\Phi_{n}(q) \text{ divise } q - 1}$.

    Si l'on avait $n \geqslant 2$, l'exercice 14 (1) donnerait $\Phi_{n}(q) > q - 1 \geqslant 1$, ce qui est incompatible avec cette divisibilité. Donc $n = 1$ et $A = K$ : $\boxed{{A}\text{ est un corps commutatif}}$.

    C'est le **théorème de Wedderburn**. Il justifie, a posteriori, que le cours ne considère que des corps commutatifs parmi les corps finis.

