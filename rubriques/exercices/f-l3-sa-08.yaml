  notions: [polynome-cyclotomique, racine-nieme-unite]
  source: "exercices de polynômes cyclotomiques (I. Kortchemski), exercices 2, 3 et 7 (liste courte des Olympiades internationales 2006)"
  page_enonce: 4
  page_corrige: 12
  enonce: |
    On utilise les résultats de l'exercice 14.

    **1.** Montrer que $p^{p} - 1$ a un diviseur premier congru à $1$ modulo $p$.

    **2.** Soit $n$, $b \geqslant 2$ des entiers. Montrer que, si $\frac{b^{n} - 1}{b - 1}$ est une puissance d'un nombre premier, alors $n$ est une puissance d'un nombre premier.

    **3.** Trouver tous les couples d'entiers relatifs $(x, y)$, avec $x \neq 1$, tels que $\frac{x^{7} - 1}{x - 1} = y^{5} - 1$.
  corrige: |
    **1.** On a $\frac{p^{p} - 1}{p - 1} = \Phi_{p}(p) > p - 1 \geqslant 1$ (exercice 14 (1)) : soit $q$ un diviseur premier de $\Phi_{p}(p)$, donc de $p^{p} - 1$.

    Comme $\Phi_{p}(p) = 1 + p + \cdots + p^{p - 1} \equiv 1 \pmod{p}$, on a $q \neq p$. Par l'exercice 14 (4), $q$ divise $p$ ou $q \equiv 1 \pmod{p}$ : c'est donc $\boxed{q \equiv 1 \pmod{p}}$.

    **2.** Par la proposition 5 du cours, $\frac{b^{n} - 1}{b - 1} = \prod_{d \mid n, d > 1}\Phi_{d}(b)$, et chaque facteur est $> b - 1 \geqslant 1$ (exercice 14 (1)). Si ce produit est une puissance de $q$ premier, chaque facteur est une puissance de $q$ d'exposant $\geqslant 1$ : $q$ divise $\Phi_{d}(b)$ pour tout diviseur $d > 1$ de $n$.

    Si $n$ avait deux diviseurs premiers distincts $r$ et $s$, l'exercice 14 (5) montrerait que $\frac{r}{s}$ est une puissance de $q$, ce qui est impossible. Donc 
    $$\boxed{n \text{ est une puissance d'un nombre premier}}.$$

    **3.** L'équation s'écrit $\Phi_{7}(x) = (y - 1)(y^{4} + y^{3} + y^{2} + y + 1)$.

    Le polynôme $\Phi_{7}$ n'a pas de racine réelle et est unitaire : $\Phi_{7}(x) > 0$. Donc $y^{5} > 1$, $y \geqslant 2$, et les deux facteurs du membre de droite sont des diviseurs positifs de $\Phi_{7}(x)$.

    Par l'exercice 14 (4), un diviseur premier de $\Phi_{7}(x)$ vaut $7$ ou est congru à $1$ modulo $7$ ; un diviseur positif est donc congru à $0$ ou à $1$ modulo $7$. Appliqué à $y - 1$, cela donne $y \equiv 1$ ou $y \equiv 2 \pmod{7}$.

    Mais alors $y^{4} + y^{3} + y^{2} + y + 1 \equiv 5$ ou $31 \equiv 3 \pmod{7}$, qui n'est ni $0$ ni $1$ : contradiction. L'équation n'a $\boxed{\text{aucune solution}}$, ce que confirme une recherche exhaustive pour $|x|$, $|y| \leqslant 200$.
- id: "l3-sa-08-17"
  feuille: "f-l3-sa-08"
  numero: 17
  partie: "Polynômes cyclotomiques"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [polynômes cyclotomiques]
  noeuds: [gc-cyclotomiques, gc-irreductibilite]
  notions: [polynome-cyclotomique, racine-nieme-unite]
  source: "exercices de polynômes cyclotomiques (I. Kortchemski), exercices 4 et 5 (liste courte des Olympiades internationales 2002)"
  page_enonce: 5
  page_corrige: 12
  enonce: |
    On utilise les résultats de l'exercice 14.

    **1.** Soit $m \geqslant 1$ impair. Montrer que $X^{m} + 1 = \prod_{d \mid m}\Phi_{2d}$.

    **2.** Soit $n \geqslant 1$. Montrer que $2^{2^{n}} + 2^{2^{n - 1}} + 1$ est divisible par au moins $n$ nombres premiers distincts. Quel est le plus petit $n$ pour lequel il en a au moins $n + 1$ ?

    **3.** Soit $p_{1}$, …, $p_{n}$ des nombres premiers impairs distincts. Montrer que $2^{p_{1}p_{2}\cdots p_{n}} + 1$ a au moins $2^{2^{n - 1}}$ diviseurs positifs.
  corrige: |
    **1.** Comme $m$ est impair, $X^{m} + 1 = -\big((-X)^{m} - 1\big) = -\prod_{d \mid m}\Phi_{d}(-X)$. Pour $d \geqslant 3$ (impair), $\Phi_{d}(-X) = \Phi_{2d}(X)$ (exercice 14 (2)), et pour $d = 1$, $-\Phi_{1}(-X) = X + 1 = \Phi_{2}$. D'où $\boxed{X^{m} + 1 = \prod_{d \mid m}\Phi_{2d}}$.

    **2.** Posons $A = 2^{2^{n - 1}}$ : le nombre étudié est $A^{2} + A + 1 = \Phi_{3}(A)$.

    Montrons par récurrence que $\Phi_{3}(X^{2^{k}}) = \prod_{j = 0}^{k}\Phi_{3 \cdot 2^{j}}(X)$. Le cas $k = 0$ est clair. Pour passer de $k$ à $k + 1$, on remplace $X$ par $X^{2}$ et l'on utilise l'exercice 14 (2) : $\Phi_{3}(X^{2}) = \Phi_{3}\Phi_{6}$ (car $2 \nmid 3$), et $\Phi_{3 \cdot 2^{j}}(X^{2}) = \Phi_{3 \cdot 2^{j + 1}}$ pour $j \geqslant 1$ (car $2 \mid 3 \cdot 2^{j}$).

    Ainsi $2^{2^{n}} + 2^{2^{n - 1}} + 1 = \prod_{j = 0}^{n - 1}\Phi_{3 \cdot 2^{j}}(2)$ : c'est un produit de $n$ facteurs, chacun $> 1$ (exercice 14 (1)). Ils sont premiers entre eux deux à deux : si un premier $q$ divisait deux d'entre eux, l'exercice 14 (5) montrerait que $2^{j - j'}$ est une puissance de $q$, donc $q = 2$, alors que le nombre est impair. Il a donc 
    $$\boxed{\text{au moins }{n}\text{ facteurs premiers distincts}}.$$

    Il en a au moins $n + 1$ dès que l'un des facteurs n'est pas premier. Pour $j \geqslant 1$, on a 
    $$\Phi_{3 \cdot 2^{j}}(X) = \Phi_{6}(X^{2^{j - 1}}) = X^{2^{j}} - X^{2^{j - 1}} + 1,$$
     d'où les valeurs 
    $$\Phi_{3}(2) = 7, \quad \Phi_{6}(2) = 3, \quad \Phi_{12}(2) = 13, \quad \Phi_{24}(2) = 241, \quad \Phi_{48}(2) = 65\,281 = 97 \times 673.$$
     Les quatre premiers sont premiers, le cinquième ne l'est pas : le plus petit $n$ cherché est $\boxed{n = 5}$, avec $2^{32} + 2^{16} + 1 = 3 \times 7 \times 13 \times 97 \times 241 \times 673$.

    **3.** Soit $N = p_{1}\cdots p_{n}$, impair. Par la question 1, $2^{N} + 1 = \prod_{d \mid N}\Phi_{2d}(2)$, et chaque facteur est $> 1$.

    Considérons les $2^{n - 1}$ diviseurs $d$ de $N$ ayant un nombre pair de facteurs premiers (la moitié des parties de $\{p_{1}, \dots, p_{n}\}$). Si un premier $q$ divisait $\Phi_{2d}(2)$ et $\Phi_{2d'}(2)$, avec $d \neq d'$ dans cette famille, alors $\frac{d}{d'} = q^{k}$, $k \neq 0$ (exercice 14 (5)). Comme $d$ et $d'$ sont sans facteur carré, $k = \pm 1$ : $d$ et $d'$ diffèrent d'un seul facteur premier, et n'ont pas des nombres de facteurs de même parité. C'est exclu.

    Ces $2^{n - 1}$ facteurs, premiers entre eux deux à deux et $> 1$, fournissent au moins $s \geqslant 2^{n - 1}$ diviseurs premiers distincts de $2^{N} + 1$. Les produits de parties de ces $s$ premiers sont des diviseurs distincts : il y en a au moins $\boxed{2^{s} \geqslant 2^{2^{n - 1}}}$.
- id: "l3-sa-08-18"
  feuille: "f-l3-sa-08"
  numero: 18
  partie: "Polynômes cyclotomiques"
  etoiles: 2
