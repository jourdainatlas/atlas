  page_corrige: 3
  enonce: |
    On considère $Q = X^{9} - X + 1$ et $f = X^{3} - X + 1$ dans $\mathbb{F}_{3}[X]$.

    **1.** Montrer que $Q$ n'a pas de racine dans $\mathbb{F}_{3}$, ni dans $\mathbb{F}_{9}$.

    **2.** Montrer que $X^{3} - X - 1$ est irréductible sur $\mathbb{F}_{3}$, et que $\mathbb{F}_{27} \simeq \mathbb{F}_{3}[X]/\langle X^{3} - X - 1 \rangle$. Le polynôme $f$ est-il irréductible dans $\mathbb{F}_{3}[X]$ ? dans $\mathbb{F}_{9}[X]$ ? Quel est son corps de décomposition sur $\mathbb{F}_{3}$ ?

    **3.** Soit $\gamma \in \mathbb{F}_{27}$ une racine de $X^{3} - X - 1$. Montrer que $\gamma$ est racine de $Q$, puis déterminer toutes les racines de $Q$ dans $\mathbb{F}_{27}$. Factoriser $Q$ dans $\mathbb{F}_{3}[X]$.

    **4.** Soit $\alpha$, $\beta$, $\delta$ les racines de $f$ dans $\mathbb{F}_{27}$. Montrer que $\alpha^{13} = \beta^{13} = \delta^{13} \in \{1, -1\}$, puis calculer cette valeur et $\alpha^{4} + \beta^{4} + \delta^{4}$.
  corrige: |
    **1.** Pour $a \in \mathbb{F}_{9}$, et a fortiori pour $a \in \mathbb{F}_{3}$, on a $a^{9} = a$ (cours, th. 1), donc $Q(a) = 1 \neq 0$.

    **2.** Le polynôme $X^{3} - X - 1$ prend en $0$, $1$, $2$ les valeurs $2$, $2$, $2$ : il est irréductible sur $\mathbb{F}_{3}$, et $\mathbb{F}_{3}[X]/\langle X^{3} - X - 1 \rangle$ est un corps à $27$ éléments, isomorphe à $\mathbb{F}_{27}$ (cours, th. 1).

    Comme $f(-X) = -(X^{3} - X - 1)$, le polynôme $f$ est aussi $\boxed{\text{irréductible dans }{\mathbb{F}_{3}[X]}}$. Il reste $\boxed{\text{irréductible dans }{\mathbb{F}_{9}[X]}}$, puisque $\mathbb{F}_{9}$ est une extension de degré $2$ de $\mathbb{F}_{3}$ et que $f$ est de degré $3$ (feuille 7, exercice 9 (1)).

    Une racine $\alpha$ de $f$ engendre $\mathbb{F}_{3}(\alpha) \simeq \mathbb{F}_{27}$. Comme $f$ divise $X^{27} - X$ (cours, prop. 4), scindé sur $\mathbb{F}_{27}$, toutes ses racines sont dans $\mathbb{F}_{3}(\alpha)$ : le corps de décomposition de $f$ est $\boxed{\mathbb{F}_{27}}$.

    **3.** De $\gamma^{3} = \gamma + 1$, on tire $\gamma^{9} = (\gamma + 1)^{3} = \gamma^{3} + 1 = \gamma + 2$, donc $Q(\gamma) = \gamma + 2 - \gamma + 1 = 3 = 0$.

    Écrivons un élément de $\mathbb{F}_{27}$ sous la forme $x = a\gamma^{2} + b\gamma + c$. Avec $\gamma^{18} = (\gamma + 2)^{2} = \gamma^{2} + \gamma + 1$, le Frobenius donne 
    $$x^{9} - x + 1 = a(\gamma^{2} + \gamma + 1) + b(\gamma + 2) + c - a\gamma^{2} - b\gamma - c + 1 = a\gamma + (a + 2b + 1).$$
     Cette quantité est nulle si et seulement si $a = 0$ et $2b + 1 = 0$, soit $b = 1$. Les racines de $Q$ dans $\mathbb{F}_{27}$ sont donc $\boxed{\gamma, \ \gamma + 1, \ \gamma + 2}$ : ce sont exactement les racines de $X^{3} - X - 1$.

    Ainsi $X^{3} - X - 1$ divise $Q$, et la division donne 
    $$\boxed{Q = (X^{3} - X - 1)(X^{6} + X^{4} + X^{3} + X^{2} - X - 1)}.$$
     Le second facteur $R$ est irréductible. Comme $Q' = -1$, $Q$ n'a pas de racine multiple, donc $R$ n'a pas de racine dans $\mathbb{F}_{27}$ ; il n'en a pas non plus dans $\mathbb{F}_{3}$, ni dans $\mathbb{F}_{9}$ (question 1). Un facteur de degré $1$, $2$ ou $3$ de $R$ aurait une racine dans $\mathbb{F}_{3}$, $\mathbb{F}_{9}$ ou $\mathbb{F}_{27}$ ; or un polynôme réductible de degré $6$ a un facteur de degré au plus $3$.

    **4.** Les racines de $f$ sont non nulles, et le Frobenius les permute : si $\alpha$ est l'une d'elles, ce sont $\alpha$, $\alpha^{3}$, $\alpha^{9}$, distinctes puisque $\mathbb{F}_{3}(\alpha) = \mathbb{F}_{27}$. Leur produit vaut $-f(0) = -1$, d'où 
    $$\alpha^{13} = \alpha \cdot \alpha^{3} \cdot \alpha^{9} = \alpha\beta\delta = -1.$$
     Le calcul est le même pour $\beta$ et $\delta$ : $\boxed{\alpha^{13} = \beta^{13} = \delta^{13} = -1}$. On retrouve que $(\alpha^{13})^{2} = \alpha^{26} = 1$.

    Comme $\alpha^{3} = \alpha - 1$, on a $\alpha^{4} = \alpha^{2} - \alpha$, et de même pour $\beta$ et $\delta$. Avec $\Sigma_{1} = 0$ et $\Sigma_{2} = -1$ (relations entre coefficients et racines), il vient 
    $$\alpha^{4} + \beta^{4} + \delta^{4} = (\Sigma_{1}^{2} - 2\Sigma_{2}) - \Sigma_{1} = 2, \qquad \boxed{\alpha^{4} + \beta^{4} + \delta^{4} = -1 \text{ dans } \mathbb{F}_{3}}.$$
- id: "l3-sa-08-06"
  feuille: "f-l3-sa-08"
  numero: 6
  partie: "Structure des corps finis"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [structure des corps finis]
  noeuds: [gs-corps-finis, gf-multiplicatif]
  notions: [corps-fini, frobenius]
  source: "Nice, « Corps finis », exercice 4 ; ENS Lyon, Algèbre 2, TD 10 (2015-16), exercice 1"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $m$, $n \geqslant 1$ des entiers et $a \geqslant 2$ un entier.

    **1.** Soit $n = km + r$ la division euclidienne de $n$ par $m$. Montrer que $X^{n} - 1 = (X^{m} - 1)Q + X^{r} - 1$ dans $\mathbb{Z}[X]$, avec $Q$ à expliciter. En déduire que $\mathrm{pgcd}(X^{n} - 1, X^{m} - 1) = X^{\mathrm{pgcd}(n, m)} - 1$, puis que $\mathrm{pgcd}(a^{n} - 1, a^{m} - 1) = a^{\mathrm{pgcd}(n, m)} - 1$.

    **2.** Retrouver ainsi que $\mathbb{F}_{p^{n}}$ possède un sous-corps à $p^{m}$ éléments si $m$ divise $n$.

    **3.** Dessiner le diagramme des inclusions possibles entre $\mathbb{F}_{2}$, $\mathbb{F}_{4}$, $\mathbb{F}_{8}$, $\mathbb{F}_{16}$, $\mathbb{F}_{32}$, $\mathbb{F}_{64}$, $\mathbb{F}_{128}$ et $\mathbb{F}_{256}$.

    **4.** Dans $\mathbb{F}_{2^{12}}$, que vaut l'intersection des sous-corps à $2^{4}$ et $2^{6}$ éléments ? Plus généralement, que vaut l'intersection des sous-corps à $p^{d}$ et $p^{e}$ éléments de $\mathbb{F}_{p^{n}}$, pour $d$, $e$ divisant $n$ ?
  corrige: |
    **1.** On écrit $X^{n} - 1 = X^{r}(X^{km} - 1) + (X^{r} - 1)$ et $X^{km} - 1 = (X^{m} - 1)(X^{(k - 1)m} + \cdots + X^{m} + 1)$. D'où 
    $$X^{n} - 1 = (X^{m} - 1)\,Q + (X^{r} - 1), \qquad Q = X^{r}\big(X^{(k - 1)m} + \cdots + X^{m} + 1\big).$$
     C'est la division euclidienne de $X^{n} - 1$ par $X^{m} - 1$, puisque $r < m$.

    L'algorithme d'Euclide appliqué à $(X^{n} - 1, X^{m} - 1)$ suit donc exactement celui appliqué à $(n, m)$, les restes successifs étant les $X^{r_{i}} - 1$. Il s'arrête au reste $X^{0} - 1 = 0$, et le dernier reste non nul est $\boxed{X^{\mathrm{pgcd}(n, m)} - 1}$.

    En évaluant en $a$, l'égalité $a^{n} - 1 = (a^{m} - 1)Q(a) + (a^{r} - 1)$, avec $0 \leqslant a^{r} - 1 < a^{m} - 1$, est une division euclidienne dans $\mathbb{Z}$. Le même raisonnement donne 
    $$\boxed{\mathrm{pgcd}(a^{n} - 1, a^{m} - 1) = a^{\mathrm{pgcd}(n, m)} - 1}.$$

    **2.** Si $m$ divise $n$, la question 1 avec $a = p$ montre que $p^{m} - 1$ divise $p^{n} - 1$. Elle montre ensuite que $X^{p^{m} - 1} - 1$ divise $X^{p^{n} - 1} - 1$, donc que $X^{p^{m}} - X$ divise $X^{p^{n}} - X$.

    Ce dernier polynôme est scindé à racines simples sur $\mathbb{F}_{p^{n}}$ (cours, th. 1) : $X^{p^{m}} - X$ a $p^{m}$ racines dans $\mathbb{F}_{p^{n}}$. Ce sont les points fixes de $\mathrm{Fr}^{m}$, qui forment un sous-corps.

    **3.** On a $\mathbb{F}_{2^{d}} \subset \mathbb{F}_{2^{e}}$ (à isomorphisme près) si et seulement si $d$ divise $e$. Le diagramme ne garde que les inclusions où $e/d$ est premier ; les autres s'en déduisent par transitivité.

    1.5em

    ![Figure](documents/figures/ab82f7a8fe02399c.svg)

    Les sous-corps de $\mathbb{F}_{256}$ forment une chaîne $\mathbb{F}_{2} \subset \mathbb{F}_{4} \subset \mathbb{F}_{16} \subset \mathbb{F}_{256}$, alors que $\mathbb{F}_{64}$ contient à la fois $\mathbb{F}_{4}$ et $\mathbb{F}_{8}$. Les corps $\mathbb{F}_{32}$ et $\mathbb{F}_{128}$, de degré premier, n'ont pas d'autre sous-corps que $\mathbb{F}_{2}$ ; les nombres en rouge sont les degrés des premières extensions.

    **4.** Un élément $x$ de $\mathbb{F}_{p^{n}}$ appartient au sous-corps à $p^{d}$ éléments si et seulement si $\mathrm{Fr}^{d}(x) = x$ (cours, prop. 3). Il est dans les deux sous-corps si et seulement s'il est fixe par $\mathrm{Fr}^{d}$ et $\mathrm{Fr}^{e}$, donc par tout le sous-groupe qu'ils engendrent. Or ce sous-groupe contient $\mathrm{Fr}^{g}$, avec $g = \mathrm{pgcd}(d, e) = ud + ve$ (Bézout), et réciproquement $\mathrm{Fr}^{d}$ et $\mathrm{Fr}^{e}$ sont des puissances de $\mathrm{Fr}^{g}$. Donc 
    $$\boxed{\mathbb{F}_{p^{d}} \cap \mathbb{F}_{p^{e}} = \mathbb{F}_{p^{\mathrm{pgcd}(d, e)}}}, \qquad \text{et dans } \mathbb{F}_{2^{12}}, \ \mathbb{F}_{16} \cap \mathbb{F}_{64} = \mathbb{F}_{4}.$$
- id: "l3-sa-08-07"
  feuille: "f-l3-sa-08"
  numero: 7
