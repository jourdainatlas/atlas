  source: "Paris 13, exercices 6 et 7"
  page_enonce: 5
  page_corrige: 14
  enonce: |
    *(Irréductible sur $\mathbb{Q}$, réductible modulo tout $p$.)*

    **1.** Montrer que $X^{4} + 1$ est irréductible dans $\mathbb{Z}[X]$ et réductible modulo tout nombre premier $p$. *Pour $p$ impair, on pourra montrer que $X^{4} + 1$ a une racine dans $\mathbb{F}_{p^{2}}$.*

    **2.** Soit $n \geqslant 3$ tel que $(\mathbb{Z}/n\mathbb{Z})^{\times}$ ne soit pas cyclique ; c'est le cas de $n = 8$, $12$ ou $15$. Montrer, à l'aide des exercices 14 et 15, que $\Phi_{n}$ est réductible modulo tout nombre premier.

    **3.** Soit $P = X^{4} - 10X^{3} + 21X^{2} - 10X + 11$. Factoriser $P$ modulo $2$, $3$ et $5$, puis montrer que $P$ est irréductible sur $\mathbb{Q}$.
  corrige: |
    **1.** Le polynôme $X^{4} + 1 = \Phi_{8}$ est irréductible dans $\mathbb{Z}[X]$ (cours, th. 3).

    Modulo $2$, $X^{4} + 1 = (X + 1)^{4}$. Pour $p$ impair, $p^{2} - 1 = (p - 1)(p + 1)$ est divisible par $8$ (produit de deux entiers pairs consécutifs, dont l'un est multiple de $4$). Le groupe $\mathbb{F}_{p^{2}}^{*}$, cyclique d'ordre $p^{2} - 1$, contient un élément $x$ d'ordre $8$ ; alors $(x^{4})^{2} = 1$ et $x^{4} \neq 1$, donc $x^{4} = -1$.

    Ainsi $X^{4} + 1$ a une racine dans $\mathbb{F}_{p^{2}}$, de degré $1$ ou $2$ sur $\mathbb{F}_{p}$ : son polynôme minimal est un facteur de degré au plus $2$ de $X^{4} + 1$. Celui-ci est donc $\boxed{\text{réductible modulo tout }{p}}$. On retrouve ce résultat par l'exercice 15 (5) : $\operatorname{ord}_{8}(p) \leqslant 2$, car tout élément de $(\mathbb{Z}/8\mathbb{Z})^{\times}$ est de carré $1$.

    **2.** *Si $p \nmid n$.* Par l'exercice 15 (5), $\overline{\Phi_{n}}$ est produit de facteurs irréductibles de degré $k = \operatorname{ord}_{n}(p)$. Comme $(\mathbb{Z}/n\mathbb{Z})^{\times}$, d'ordre $\varphi(n)$, n'est pas cyclique, $k < \varphi(n)$ : il y a au moins deux facteurs.

    *Si $p \mid n$.* Écrivons $n = p^{\alpha}N$, $p \nmid N$. Si $\varphi(p^{\alpha}) \geqslant 2$, l'égalité $\overline{\Phi_{n}} = \overline{\Phi_{N}}^{\,\varphi(p^{\alpha})}$ (exercice 14 (3)) montre que $\overline{\Phi_{n}}$ est réductible.

    Sinon, $p = 2$, $\alpha = 1$ et $n = 2N$ avec $N \geqslant 3$ impair. Alors $\overline{\Phi_{n}} = \overline{\Phi_{N}}$, et $(\mathbb{Z}/N\mathbb{Z})^{\times} \simeq (\mathbb{Z}/n\mathbb{Z})^{\times}$ (lemme chinois, $(\mathbb{Z}/2\mathbb{Z})^{\times}$ étant trivial) n'est pas cyclique : le premier cas, appliqué à $N$, donne la réductibilité modulo $2$.

    Pour les exemples, les groupes $(\mathbb{Z}/8\mathbb{Z})^{\times}$ et $(\mathbb{Z}/12\mathbb{Z})^{\times}$ ont tous leurs éléments de carré $1$, et $(\mathbb{Z}/15\mathbb{Z})^{\times} \simeq (\mathbb{Z}/3\mathbb{Z})^{\times} \times (\mathbb{Z}/5\mathbb{Z})^{\times}$, d'ordre $8$, n'a pas d'élément d'ordre $8$. Ainsi $\Phi_{12} = X^{4} - X^{2} + 1$ et $\Phi_{15}$, irréductibles sur $\mathbb{Q}$, sont $\boxed{\text{réductibles modulo tout }{p}}$.

    **3.** On réduit les coefficients : 
    $$\begin{array}{ll} \text{modulo } 2 : & \overline{P} = (X^{2} + X + 1)^{2}, \\ \text{modulo } 3 : & \overline{P} = (X^{2} + 1)(X^{2} - X - 1), \\ \text{modulo } 5 : & \overline{P} = (X^{2} + X + 1)(X^{2} - X + 1). \end{array}$$
     Les réductions ne suffisent pas : elles ont toutes deux facteurs de degré $2$.

    Le polynôme $P$ n'a pas de racine rationnelle, qui serait entière et racine de $\overline{P}$ modulo $2$. S'il était réductible, il s'écrirait $(X^{2} + aX + b)(X^{2} + cX + d)$ dans $\mathbb{Z}[X]$ (lemme de Gauss), avec 
    $$a + c = -10, \qquad b + d + ac = 21, \qquad ad + bc = -10, \qquad bd = 11.$$
     Si $\{b, d\} = \{1, 11\}$, alors $ac = 9$ et $a + c = -10$, donc $\{a, c\} = \{-1, -9\}$, et $ad + bc$ vaut $-20$ ou $-100$, jamais $-10$. Si $\{b, d\} = \{-1, -11\}$, alors $ac = 33$ et $a + c = -10$, et $t^{2} + 10t + 33$, de discriminant $-32$, n'a pas de racine réelle. Donc $\boxed{{P}\text{ est irréductible sur }{\mathbb{Q}}}$.
- id: "l3-sa-08-20"
  feuille: "f-l3-sa-08"
  numero: 20
  partie: "Perspective"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [compléments sur les corps]
  noeuds: [gs-extensions, gs-corps-finis]
  notions: [corps]
  source: "L3 Algèbre 2, TD 5, exercice 4"
  page_enonce: 5
  page_corrige: 15
  enonce: |
    *(Anneaux d'entiers des corps quadratiques.)* Un nombre complexe $\alpha$ est un *entier algébrique* s'il est racine d'un polynôme unitaire de $\mathbb{Z}[X]$. Soit $K$ une extension de $\mathbb{Q}$ de degré $2$, contenue dans $\mathbb{C}$, et $\mathcal{O}_{K}$ l'ensemble des entiers algébriques appartenant à $K$.

    **1.** Montrer qu'un élément $\alpha$ de $K$ est un entier algébrique si et seulement si son polynôme minimal sur $\mathbb{Q}$ est à coefficients entiers.

    **2.** Montrer qu'il existe un entier $D \neq 0$, $1$, sans facteur carré, tel que $K = \mathbb{Q}(\sqrt{D})$.

    **3.** Montrer que tout élément de $K$ s'écrit $\alpha = \frac{a + b\sqrt{D}}{c}$, avec $a$, $b$, $c \in \mathbb{Z}$, $c \geqslant 1$ et $\mathrm{pgcd}(a, b, c) = 1$, et que $\alpha$ est un entier algébrique si et seulement si $\frac{a^{2} - b^{2}D}{c^{2}}$ et $\frac{2a}{c}$ sont entiers. Montrer qu'alors $c = 1$ ou $c = 2$.

    **4.** En déduire que $\mathcal{O}_{K} = \mathbb{Z}[\sqrt{D}]$ si $D \not\equiv 1 \pmod{4}$, et que $\mathcal{O}_{K} = \mathbb{Z}\big[\frac{1 + \sqrt{D}}{2}\big]$ si $D \equiv 1 \pmod{4}$.
  corrige: |
    **1.** Si $\mu_{\alpha} \in \mathbb{Z}[X]$, il est unitaire et annule $\alpha$ : $\alpha$ est un entier algébrique.

    Réciproquement, soit $f \in \mathbb{Z}[X]$ unitaire tel que $f(\alpha) = 0$. Alors $\mu_{\alpha}$ divise $f$ dans $\mathbb{Q}[X]$ : $f = \mu_{\alpha}g$. Écrivons $\mu_{\alpha} = c\,\mu_{0}$ et $g = c'g_{0}$, avec $\mu_{0}$, $g_{0}$ primitifs de coefficients dominants positifs et $c$, $c' \in \mathbb{Q}_{+}^{*}$. Par le lemme de Gauss, $\mu_{0}g_{0}$ est primitif, comme $f$ ; donc $cc' = 1$ et $f = \mu_{0}g_{0}$. Les coefficients dominants de $\mu_{0}$ et $g_{0}$, entiers positifs de produit $1$, valent $1$. Ainsi $\mu_{0}$ est unitaire, comme $\mu_{\alpha} = c\,\mu_{0}$, donc $c = 1$ et $\boxed{\mu_{\alpha} = \mu_{0} \in \mathbb{Z}[X]}$.

    **2.** Par la proposition 1 du cours, $K = \mathbb{Q}(\sqrt{d})$ avec $d \in \mathbb{Q}$ non carré. Écrivons $d = \frac{u}{v}$ ; alors $\sqrt{d} = \frac{\sqrt{uv}}{v}$, et $K = \mathbb{Q}(\sqrt{uv})$. En écrivant $uv = s^{2}D$ avec $D$ sans facteur carré, on obtient $\boxed{K = \mathbb{Q}(\sqrt{D})}$, avec $D \neq 0$, $1$ puisque $d$ n'est pas un carré.

    **3.** Dans la base $(1, \sqrt{D})$, $\alpha = x + y\sqrt{D}$, $x$, $y \in \mathbb{Q}$. En réduisant au même dénominateur $c \geqslant 1$ minimal, $\alpha = \frac{a + b\sqrt{D}}{c}$ avec $\mathrm{pgcd}(a, b, c) = 1$.

    Si $b \neq 0$, $\alpha \notin \mathbb{Q}$, et son polynôme minimal est 
    $$\mu_{\alpha} = X^{2} - \frac{2a}{c}X + \frac{a^{2} - b^{2}D}{c^{2}},$$
     puisque $\alpha$ et $\frac{a - b\sqrt{D}}{c}$ ont pour somme $\frac{2a}{c}$ et pour produit $\frac{a^{2} - b^{2}D}{c^{2}}$. Par la question 1, $\alpha$ est entier si et seulement si ces deux nombres sont entiers. Si $b = 0$, $\mathrm{pgcd}(a, c) = 1$, et la condition équivaut à $c = 1$, comme le critère $\mu_{\alpha} = X - \frac{a}{c} \in \mathbb{Z}[X]$.

    Supposons $\alpha$ entier et soit $\ell$ un nombre premier divisant $c$.

    Si $\ell$ est impair, $\ell \mid 2a$ donne $\ell \mid a$, puis $\ell^{2} \mid a^{2} - b^{2}D$ donne $\ell^{2} \mid b^{2}D$. Comme $D$ est sans facteur carré, $\ell \mid b$, et $\ell$ divise $a$, $b$, $c$ : c'est exclu.

    Donc $c$ est une puissance de $2$. Si $4 \mid c$, alors $2 \mid a$, et $16 \mid a^{2} - b^{2}D$ donne $4 \mid b^{2}D$, donc $2 \mid b$ : c'est encore exclu. Ainsi $\boxed{c \in \{1, 2\}}$.

    **4.** Si $c = 1$, $\alpha = a + b\sqrt{D}$ est toujours entier. Si $c = 2$, $a$ et $b$ ne sont pas tous deux pairs, et il faut $a^{2} \equiv b^{2}D \pmod{4}$.

    Si $a$ est pair, $b$ est impair et $D \equiv b^{2}D \equiv 0 \pmod{4}$, ce qui contredit « sans facteur carré ». Donc $a$ est impair, puis $b^{2}D \equiv 1 \pmod{4}$, ce qui impose $b$ impair et $D \equiv 1 \pmod{4}$.

    Ainsi, si $D \not\equiv 1 \pmod{4}$, $\boxed{\mathcal{O}_{K} = \mathbb{Z}[\sqrt{D}]}$. Si $D \equiv 1 \pmod{4}$, $\mathcal{O}_{K}$ est formé des $\frac{a + b\sqrt{D}}{2}$ avec $a \equiv b \pmod{2}$. Avec $\omega = \frac{1 + \sqrt{D}}{2}$, qui vérifie $\omega^{2} = \omega + \frac{D - 1}{4}$, on a $\mathbb{Z}[\omega] = \mathbb{Z} + \mathbb{Z}\omega$, et $u + v\omega = \frac{(2u + v) + v\sqrt{D}}{2}$ décrit exactement ces éléments. Donc $\boxed{\mathcal{O}_{K} = \mathbb{Z}\big[\tfrac{1 + \sqrt{D}}{2}\big]}$.

    Par exemple, $\mathcal{O}_{\mathbb{Q}(\mathrm{i})} = \mathbb{Z}[\mathrm{i}]$, mais $\mathcal{O}_{\mathbb{Q}(\mathrm{i}\sqrt{3})} = \mathbb{Z}\big[\frac{1 + \mathrm{i}\sqrt{3}}{2}\big] \supsetneq \mathbb{Z}[\mathrm{i}\sqrt{3}]$. Cela éclaire le chapitre 3 : $\mathbb{Z}[\mathrm{i}\sqrt{3}]$, non factoriel, n'est pas l'anneau des entiers de son corps des fractions, alors que $\mathbb{Z}\big[\frac{1 + \mathrm{i}\sqrt{3}}{2}\big]$ est euclidien.
