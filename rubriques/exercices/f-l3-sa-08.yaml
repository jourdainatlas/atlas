  page_corrige: 3
  enonce: |
    **1.** Le nombre $2$ est-il un carré dans $\mathbb{F}_{5}$ ? Montrer que $X^{2} + X + 1$ est irréductible dans $\mathbb{F}_{5}[X]$.

    **2.** Soit $\alpha$ une racine de $X^{2} + X + 1$ dans $\mathbb{F}_{25}$. Montrer que tout $\beta \in \mathbb{F}_{25}$ s'écrit de façon unique $a\alpha + b$ avec $a$, $b \in \mathbb{F}_{5}$, et calculer $\alpha^{5}$.

    **3.** Soit $P = X^{5} - X + 1$. Montrer que $P(\beta) \neq 0$ pour tout $\beta \in \mathbb{F}_{25}$. En déduire que $P$ est irréductible sur $\mathbb{F}_{5}$. L'est-il sur $\mathbb{Q}$ ?
  corrige: |
    **1.** Les carrés de $\mathbb{F}_{5}$ sont $0$, $1$, $4$ : $\boxed{2 \text{ n'est pas un carré}}$. Le polynôme $X^{2} + X + 1$ prend en $0$, $1$, $2$, $3$, $4$ les valeurs $1$, $3$, $2$, $3$, $1$ : sans racine, il est irréductible.

    **2.** Le corps $\mathbb{F}_{5}(\alpha) \subset \mathbb{F}_{25}$ est de degré $2$ sur $\mathbb{F}_{5}$, donc égal à $\mathbb{F}_{25}$, de base $(1, \alpha)$ : d'où l'écriture unique $\beta = a\alpha + b$.

    Comme $\alpha$ est racine de $X^{2} + X + 1$, qui divise $X^{3} - 1$, on a $\alpha^{3} = 1$, donc $\boxed{\alpha^{5} = \alpha^{2} = -\alpha - 1}$.

    **3.** Pour $\beta = a\alpha + b$, le Frobenius donne $\beta^{5} = a\alpha^{5} + b = -a\alpha - a + b$, puisque $a^{5} = a$ et $b^{5} = b$. Donc 
    $$P(\beta) = \beta^{5} - \beta + 1 = -2a\,\alpha + (1 - a).$$
     S'il était nul, on aurait $a = 0$ (coordonnée sur $\alpha$), puis $1 = 0$ : c'est impossible. Ainsi $P$ n'a pas de racine dans $\mathbb{F}_{25}$.

    Un facteur de degré $1$ ou $2$ de $P$ dans $\mathbb{F}_{5}[X]$ aurait une racine dans $\mathbb{F}_{5}$ ou dans $\mathbb{F}_{25}$ ; comme $P$ est de degré $5$, il est $\boxed{\text{irréductible sur }{\mathbb{F}_{5}}}$.

    Le polynôme $P$ est unitaire à coefficients entiers, et sa réduction modulo $5$ est irréductible, de même degré : il est $\boxed{\text{irréductible sur }{\mathbb{Q}}}$ (chapitre 5, prop. 10).
