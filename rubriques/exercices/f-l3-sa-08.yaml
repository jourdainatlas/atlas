  page_enonce: 5
  page_corrige: 13
  enonce: |
    Soit $n \geqslant 1$ et $\zeta_{n} = \mathrm{e}^{2\mathrm{i}\pi/n}$.

    **1.** Montrer que $[\mathbb{Q}(\zeta_{n}) : \mathbb{Q}(\cos\frac{2\pi}{n})] = 2$ pour $n \geqslant 3$. En déduire le degré de $\cos\frac{2\pi}{n}$ sur $\mathbb{Q}$, et déterminer son polynôme minimal $P_{n}$ pour $n \leqslant 7$.

    **2.** Soit $f : \mathbb{Q}(\zeta_{n}) \to \mathbb{C}$ un morphisme d'anneaux. Montrer que $f(\zeta_{n})$ est une racine primitive $n$-ième de l'unité et que $f(\mathbb{Q}(\zeta_{n})) = \mathbb{Q}(\zeta_{n})$. Réciproquement, montrer que, pour toute racine primitive $n$-ième de l'unité $\zeta'$, il existe un unique morphisme $f$ tel que $f(\zeta_{n}) = \zeta'$.

    **3.** Montrer que $r \mapsto (\zeta_{n} \mapsto \zeta_{n}^{r})$ définit un isomorphisme de groupes de $(\mathbb{Z}/n\mathbb{Z})^{\times}$ sur $\operatorname{Aut}(\mathbb{Q}(\zeta_{n}))$. En déduire que $\operatorname{Aut}(\mathbb{Q}(\zeta_{n}))$ est cyclique si $n$ est premier.

    **4.** Montrer que, si le polygone régulier à $n$ côtés est constructible à la règle et au compas, $\varphi(n)$ est une puissance de $2$ (feuille 7, exercice 11). Pour quels $n \leqslant 20$ cette condition est-elle satisfaite ?
  corrige: |
    Notons $\zeta = \zeta_{n}$ et $c = \cos\frac{2\pi}{n}$.

    **1.** On a $c = \frac{\zeta + \zeta^{-1}}{2} \in \mathbb{Q}(\zeta)$, et $\zeta$ est racine de $X^{2} - 2cX + 1 \in \mathbb{Q}(c)[X]$. Pour $n \geqslant 3$, $\zeta$ n'est pas réel, alors que $\mathbb{Q}(c) \subset \mathbb{R}$ : ce polynôme est irréductible sur $\mathbb{Q}(c)$, et $[\mathbb{Q}(\zeta) : \mathbb{Q}(c)] = 2$.

    Comme $[\mathbb{Q}(\zeta) : \mathbb{Q}] = \varphi(n)$ (cours, th. 3), le théorème de la base télescopique donne 
    $$\boxed{[\mathbb{Q}(c) : \mathbb{Q}] = \frac{\varphi(n)}{2} \text{ pour } n \geqslant 3}$$
     et, pour $n = 1$ et $2$, $c = \pm 1$ est de degré $1$. C'est la remarque annoncée dans le cours.

    Pour $n \leqslant 7$ :

    • $n = 1$, $2$, $3$, $4$, $6$ : $c = 1$, $-1$, $-\frac{1}{2}$, $0$, $\frac{1}{2}$, et $P_{n} = X - c$ ;

    • $n = 5$ : en divisant $\Phi_{5}(\zeta) = 0$ par $\zeta^{2}$, $y = 2c$ vérifie $(y^{2} - 2) + y + 1 = 0$, d'où $P_{5} = X^{2} + \frac{1}{2}X - \frac{1}{4}$, de degré $\frac{\varphi(5)}{2} = 2$ ;

    • $n = 7$ : $2c$ est racine de $X^{3} + X^{2} - 2X - 1$ (feuille 7, exercice 8), d'où $P_{7} = X^{3} + \frac{1}{2}X^{2} - \frac{1}{2}X - \frac{1}{8}$, de degré $3$.

    On vérifie que $c = \cos\frac{2\pi}{5} = \frac{\sqrt{5} - 1}{4}$ est bien racine de $P_{5}$.

    **2.** Un morphisme d'anneaux fixe $\mathbb{Z}$, donc $\mathbb{Q}$. On a $f(\zeta)^{n} = f(\zeta^{n}) = 1$, et $f$ est injectif (morphisme défini sur un corps), donc $f(\zeta)^{k} = f(\zeta^{k}) \neq 1$ pour $0 < k < n$ : $f(\zeta)$ est une racine primitive $n$-ième, de la forme $\zeta^{r}$. Alors $f(\mathbb{Q}(\zeta)) = \mathbb{Q}(\zeta^{r}) \subset \mathbb{Q}(\zeta)$, et l'égalité vient des degrés, tous deux égaux à $\varphi(n)$.

    Réciproquement, $\zeta$ et $\zeta'$ ont le même polynôme minimal $\Phi_{n}$ (cours, th. 3). Par le théorème 4 du chapitre 7, $\mathbb{Q}(\zeta) \simeq \mathbb{Q}[X]/\langle \Phi_{n} \rangle \simeq \mathbb{Q}(\zeta')$, par un isomorphisme qui envoie $\zeta$ sur $\zeta'$. Il est unique, puisque $\zeta$ engendre $\mathbb{Q}(\zeta)$.

    **3.** Pour $r$ premier à $n$, notons $\sigma_{r}$ l'automorphisme tel que $\sigma_{r}(\zeta) = \zeta^{r}$ ; il ne dépend que de la classe de $r$ modulo $n$. On a $\sigma_{r} \circ \sigma_{s}(\zeta) = \sigma_{r}(\zeta^{s}) = \zeta^{rs}$, donc $\sigma_{r} \circ \sigma_{s} = \sigma_{rs}$ : c'est un morphisme de groupes.

    Il est injectif, car $\sigma_{r} = \mathrm{id}$ impose $\zeta^{r} = \zeta$, soit $r \equiv 1$ ; il est surjectif par la question 2. Ainsi $\boxed{\operatorname{Aut}(\mathbb{Q}(\zeta_{n})) \simeq (\mathbb{Z}/n\mathbb{Z})^{\times}}$. Si $n$ est premier, $(\mathbb{Z}/n\mathbb{Z})^{\times} = \mathbb{F}_{n}^{*}$ est cyclique (cours, th. 2).

    **4.** Construire le polygone régulier à $n$ côtés, c'est, à similitude près, construire le point $(c, \sin\frac{2\pi}{n})$ à partir de $O$ et $I$. Par le théorème de Wantzel (feuille 7, exercice 11 (4)), $c$ est alors de degré une puissance de $2$, donc $\varphi(n) = 2\deg c$ aussi.

    Pour $3 \leqslant n \leqslant 20$, cette condition est satisfaite pour 
    $$\boxed{n = 3, 4, 5, 6, 8, 10, 12, 15, 16, 17, 20},$$
     et elle exclut $7$, $9$, $11$, $13$, $14$, $18$, $19$.

    1.5em

    ![Figure](documents/figures/748c2fbb35002eb3.svg)

    Pour $3 \leqslant n \leqslant 20$, la valeur de $\varphi(n)$ est inscrite au-dessus de $n$ : les polygones marqués en bleu satisfont la condition nécessaire de Wantzel ($\varphi(n)$ puissance de $2$), ceux marqués d'une croix rouge ne sont pas constructibles. Gauss a montré, en 1796, que le polygone à $17$ côtés est constructible ; la condition est en fait suffisante (admis).
- id: "l3-sa-08-19"
  feuille: "f-l3-sa-08"
