  page_corrige: 6
  enonce: |
    On note $I_{d}$ le nombre de polynômes unitaires irréductibles de degré $d$ de $\mathbb{F}_{p}[X]$. On rappelle (cours, après la prop. 4) que $\sum_{d \mid n}d\,I_{d} = p^{n}$ pour tout $n \geqslant 1$.

    **1.** Montrer que $\frac{p^{n} - p^{\lfloor n/2 \rfloor + 1}}{n} \leqslant I_{n} \leqslant \frac{p^{n}}{n}$. En déduire que $I_{n} \sim \frac{p^{n}}{n}$, et que, pour $n \geqslant 3$, un polynôme unitaire de degré $n$ choisi au hasard dans $\mathbb{F}_{p}[X]$ a au moins une chance sur $2n$ d'être irréductible.

    **2.** On définit la *fonction de Möbius* par $\mu(1) = 1$, $\mu(d) = (-1)^{k}$ si $d$ est produit de $k$ nombres premiers distincts, et $\mu(d) = 0$ si $d$ est divisible par un carré différent de $1$. Montrer que $\sum_{d \mid n}\mu(d) = 0$ pour $n \geqslant 2$, puis que 
    $$n\,I_{n} = \sum_{d \mid n}\mu(d)\,p^{n/d}.$$
     Calculer $I_{n}$ pour $p = 2$ et $n \leqslant 8$.
  corrige: |
    **1.** La formule donne $nI_{n} = p^{n} - \sum_{d \mid n, d < n}d\,I_{d} \leqslant p^{n}$. Elle donne aussi $d\,I_{d} \leqslant p^{d}$ pour tout $d$, et les diviseurs stricts de $n$ sont au plus égaux à $\lfloor n/2 \rfloor$, donc 
    $$\sum_{d \mid n, d < n}d\,I_{d} \leqslant \sum_{d = 1}^{\lfloor n/2 \rfloor}p^{d} = \frac{p^{\lfloor n/2 \rfloor + 1} - p}{p - 1} < p^{\lfloor n/2 \rfloor + 1}.$$
     D'où l'encadrement 
    $$\boxed{\frac{p^{n} - p^{\lfloor n/2 \rfloor + 1}}{n} \leqslant I_{n} \leqslant \frac{p^{n}}{n}}.$$

    Comme $\frac{p^{\lfloor n/2 \rfloor + 1}}{p^{n}} = p^{\lfloor n/2 \rfloor + 1 - n} \to 0$, on obtient $\boxed{I_{n} \sim \frac{p^{n}}{n}}$.

    Il y a $p^{n}$ polynômes unitaires de degré $n$. La proportion d'irréductibles est donc au plus $\frac{1}{n}$, et au moins $\frac{1}{n}(1 - p^{\lfloor n/2 \rfloor + 1 - n})$. Pour $n \geqslant 3$, l'exposant $\lfloor n/2 \rfloor + 1 - n$ est $\leqslant -1$, donc $p^{\lfloor n/2 \rfloor + 1 - n} \leqslant \frac{1}{2}$, et la proportion est au moins $\boxed{\frac{1}{2n}}$.

    *L'énoncé d'origine annonçait « au moins une chance sur $n$ » : c'est faux*, puisque $I_{n} < \frac{p^{n}}{n}$ dès que $n \geqslant 2$ (la somme des $d\,I_{d}$, $d < n$, contient $I_{1} = p > 0$).

    **2.** Soit $n \geqslant 2$, divisible par exactement $k \geqslant 1$ nombres premiers. Les diviseurs $d$ de $n$ tels que $\mu(d) \neq 0$ sont les produits de $j$ de ces premiers, pour $0 \leqslant j \leqslant k$, et 
    $$\sum_{d \mid n}\mu(d) = \sum_{j = 0}^{k}\binom{k}{j}(-1)^{j} = (1 - 1)^{k} = 0.$$

    Alors, en remplaçant $p^{n/d}$ par $\sum_{e \mid n/d}e\,I_{e}$ et en regroupant selon $e$ : 
    $$\sum_{d \mid n}\mu(d)\,p^{n/d} = \sum_{d \mid n}\mu(d)\sum_{e \mid n/d}e\,I_{e} = \sum_{e \mid n}e\,I_{e}\sum_{d \mid n/e}\mu(d) = n\,I_{n},$$
     car la somme intérieure est nulle sauf pour $n/e = 1$. Pour $p = 2$, on trouve 
    $$\boxed{I_{1}, \dots, I_{8} = 2, \ 1, \ 2, \ 3, \ 6, \ 9, \ 18, \ 30},$$
     par exemple $8I_{8} = 2^{8} - 2^{4} = 240$ et $6I_{6} = 2^{6} - 2^{3} - 2^{2} + 2 = 54$.

    1.5em

    ![Figure](documents/figures/d016f456b88d479a.svg)

    Les quotients $\frac{nI_{n}}{2^{n}}$ pour $1 \leqslant n \leqslant 12$ (en bleu) tendent vers $1$ (en orange) : $I_{n} \sim \frac{2^{n}}{n}$. Les creux en $n = 2$, $4$, $6$, $8$ viennent des diviseurs $n/2$, qui retranchent le terme $2^{n/2}$, le plus gros de la somme.
