  enonce: |
    Soit $P \in \mathbb{F}_{p}[X]$ irréductible de degré $n$, et $m \geqslant 1$. Montrer que $P$ est irréductible dans $\mathbb{F}_{p^{m}}[X]$ si et seulement si $m$ et $n$ sont premiers entre eux, et que, dans tous les cas, ses facteurs irréductibles dans $\mathbb{F}_{p^{m}}[X]$ sont tous de degré $\frac{n}{\mathrm{pgcd}(m, n)}$. Pour $n = 5$, quel est le plus petit $m$ tel que tout polynôme de degré $5$ de $\mathbb{F}_{p}[X]$ soit scindé sur $\mathbb{F}_{p^{m}}$ ? ait une racine dans $\mathbb{F}_{p^{m}}$ ?
  corrige: |
    On travaille dans $\mathbb{F}_{p^{mn}}$, qui contient $\mathbb{F}_{p^{m}}$ et les racines de $P$ : en effet, $P$ divise $X^{p^{n}} - X$ (cours, prop. 4), qui divise $X^{p^{mn}} - X$ (exercice 6), scindé sur $\mathbb{F}_{p^{mn}}$.

    Soit $\alpha$ une racine de $P$. Le corps $\mathbb{F}_{p}(\alpha)$ a $p^{n}$ éléments. Le corps $\mathbb{F}_{p^{m}}(\alpha)$ est le plus petit sous-corps de $\mathbb{F}_{p^{mn}}$ contenant $\mathbb{F}_{p^{m}}$ et $\mathbb{F}_{p^{n}}$. Un sous-corps à $p^{l}$ éléments les contient si et seulement si $m \mid l$ et $n \mid l$ (cours, prop. 3), c'est-à-dire si $\mathrm{ppcm}(m, n) \mid l$. Donc $\mathbb{F}_{p^{m}}(\alpha) = \mathbb{F}_{p^{\mathrm{ppcm}(m, n)}}$, et 
    $$[\mathbb{F}_{p^{m}}(\alpha) : \mathbb{F}_{p^{m}}] = \frac{\mathrm{ppcm}(m, n)}{m} = \frac{n}{\mathrm{pgcd}(m, n)}.$$

    Ce degré est le même pour toutes les racines de $P$ : chaque facteur irréductible de $P$ dans $\mathbb{F}_{p^{m}}[X]$, polynôme minimal de l'une d'elles, est de degré $\boxed{\frac{n}{\mathrm{pgcd}(m, n)}}$. En particulier, $P$ reste irréductible si et seulement si $\boxed{\mathrm{pgcd}(m, n) = 1}$.

    Pour $n = 5$, un polynôme de degré $5$ peut avoir des facteurs irréductibles de degrés $1$, $2$, $3$, $4$ ou $5$, selon toutes les partitions de $5$ (il existe des irréductibles de chaque degré). Un facteur irréductible de degré $d$ est scindé sur $\mathbb{F}_{p^{m}}$ si et seulement si $\frac{d}{\mathrm{pgcd}(m, d)} = 1$, c'est-à-dire $d \mid m$.

    • Pour que tout polynôme de degré $5$ soit scindé, il faut et il suffit que $1$, $2$, $3$, $4$, $5$ divisent $m$ : le plus petit $m$ est $\boxed{60}$.

    • Pour qu'il ait une racine, il faut que, pour chaque partition de $5$, l'une des parts divise $m$. La partition $5$ impose $5 \mid m$, la partition $3 + 2$ impose $3 \mid m$ ou $2 \mid m$ ; les autres contiennent $1$. Le plus petit $m$ est $\boxed{10}$.
- id: "l3-sa-08-11"
  feuille: "f-l3-sa-08"
  numero: 11
