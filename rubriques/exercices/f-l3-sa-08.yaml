  notions: [corps-fini, frobenius]
  source: "Nice, « Corps finis », exercices 6 (a), (c) et 7"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    **1.** Le polynôme $X^{4} + 1$ de $\mathbb{F}_{7}[X]$ est-il sans facteur carré ? Le factoriser dans $\mathbb{F}_{7}[X]$.

    **2.** Soit $P = X^{3} + X^{2} + X + 1 \in \mathbb{F}_{3}[X]$ et $A = \mathbb{F}_{3}[X]/\langle P \rangle$. Donner une base de $A$ sur $\mathbb{F}_{3}$ et la matrice, dans cette base, de l'application $\mathbb{F}_{3}$-linéaire $\phi : y \mapsto y^{3}$. Donner une base de $\mathrm{Ker}(\phi - \mathrm{id})$. Qu'en déduit-on sur l'irréductibilité de $P$ ? *On pourra observer que, si $P$ est irréductible, $\mathrm{Ker}(\phi - \mathrm{id})$ est un sous-corps de $A$.*

    **3.** Factoriser $P$ dans $\mathbb{F}_{3}[X]$. À l'aide d'une relation de Bézout, expliciter un isomorphisme d'un produit de corps $\mathbb{F}_{3}[X]/\langle Q_{1} \rangle \times \mathbb{F}_{3}[X]/\langle Q_{2} \rangle$ sur $A$, et retrouver par cet isomorphisme une base de $\mathrm{Ker}(\phi - \mathrm{id})$.
  corrige: |
    **1.** La dérivée $4X^{3}$ ne s'annule qu'en $0$, qui n'est pas racine de $X^{4} + 1$ : le PGCD de $X^{4} + 1$ et de sa dérivée vaut $1$, et $X^{4} + 1$ est $\boxed{\text{sans facteur carré}}$.

    Comme $2 = 3^{2}$ est un carré dans $\mathbb{F}_{7}$, 
    $$X^{4} + 1 = (X^{2} + 1)^{2} - 2X^{2} = \boxed{(X^{2} - 3X + 1)(X^{2} + 3X + 1)}.$$
     Les deux facteurs ont pour discriminant $9 - 4 = 5$, qui n'est pas un carré modulo $7$ (les carrés non nuls sont $1$, $2$, $4$) : ils sont irréductibles.

    **2.** Notons $x$ la classe de $X$. La famille $(1, x, x^{2})$ est une base de $A$. Comme $P = (X + 1)(X^{2} + 1)$ divise $X^{4} - 1$, on a $x^{4} = 1$, donc 
    $$\phi(1) = 1, \qquad \phi(x) = x^{3} = -x^{2} - x - 1, \qquad \phi(x^{2}) = x^{6} = x^{2}.$$
     La matrice de $\phi$, puis celle de $\phi - \mathrm{id}$, sont 
    $$M = \begin{pmatrix} 1 & 2 & 0 \\ 0 & 2 & 0 \\ 0 & 2 & 1 \end{pmatrix}, \qquad M - I = \begin{pmatrix} 0 & 2 & 0 \\ 0 & 1 & 0 \\ 0 & 2 & 0 \end{pmatrix}.$$
     Le noyau de $\phi - \mathrm{id}$ est formé des $a + bx + cx^{2}$ tels que $b = 0$ : il a pour base $\boxed{(1, x^{2})}$.

    Si $P$ était irréductible, $A$ serait un corps à $27$ éléments, et $\mathrm{Ker}(\phi - \mathrm{id}) = \{y ; y^{3} = y\}$ serait son sous-corps premier $\mathbb{F}_{3}$, de dimension $1$. La dimension $2$ montre que $\boxed{{P}\text{ est réductible}}$. Plus généralement, on montre que cette dimension est le nombre de facteurs irréductibles d'un polynôme sans facteur carré : c'est le principe de l'algorithme de Berlekamp.

    **3.** Comme $P(-1) = 0$, on a $\boxed{P = (X + 1)(X^{2} + 1)}$, et $X^{2} + 1$ est irréductible sur $\mathbb{F}_{3}$ ($-1$ n'est pas un carré modulo $3$).

    La division $X^{2} + 1 = (X + 1)(X - 1) + 2$ donne, en multipliant par $2 = -1$, la relation de Bézout 
    $$1 = e_{1} + e_{2}, \qquad e_{1} = -(X^{2} + 1), \qquad e_{2} = X^{2} - 1 = (X + 1)(X - 1).$$
     On a $e_{1} \equiv 1$ modulo $X + 1$ et $e_{1} \equiv 0$ modulo $X^{2} + 1$, et l'inverse pour $e_{2}$. L'application 
    $$\Psi : \mathbb{F}_{3}[X]/\langle X + 1 \rangle \times \mathbb{F}_{3}[X]/\langle X^{2} + 1 \rangle \longrightarrow A, \qquad (\overline{u}, \overline{v}) \longmapsto \overline{u\,e_{1} + v\,e_{2}}$$
     est l'isomorphisme réciproque de celui du lemme chinois (chapitre 2, th. 6). Le premier facteur est $\mathbb{F}_{3}$, le second est $\mathbb{F}_{9}$.

    Par $\Psi$, l'application $\phi$ devient l'élévation au cube composante par composante, et ses points fixes sont les couples formés d'un élément de $\mathbb{F}_{3}$ et d'un élément de $\mathbb{F}_{9}$ fixe par le Frobenius, c'est-à-dire de $\mathbb{F}_{3}$. Ainsi $\mathrm{Ker}(\phi - \mathrm{id})$ a pour base $(e_{1}, e_{2}) = (-x^{2} - 1, x^{2} - 1)$. On retrouve la base $(1, x^{2})$, puisque $e_{1} + e_{2} = -2 = 1$ et $e_{2} - e_{1} = 2x^{2}$.
