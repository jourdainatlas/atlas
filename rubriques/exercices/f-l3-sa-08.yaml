  enonce: |
    On rappelle (feuille 5, exercice 9) que les polynômes unitaires irréductibles de degré $4$ de $\mathbb{F}_{2}[X]$ sont $X^{4} + X + 1$, $X^{4} + X^{3} + 1$ et $X^{4} + X^{3} + X^{2} + X + 1$. On note $\mathbb{F}_{4} = \{0, 1, j, j^{2}\}$, avec $j^{2} = j + 1$.

    **1.** Retrouver, à l'aide de la proposition 4 du cours, le nombre d'irréductibles unitaires de degré $2$, $3$, $4$ et $5$ de $\mathbb{F}_{2}[X]$, sans les écrire.

    **2.** Soit $P \in \mathbb{F}_{2}[X]$ irréductible de degré $4$. Montrer que $P$ se factorise dans $\mathbb{F}_{4}[X]$ en un produit de deux irréductibles de degré $2$.

    **3.** En déduire le nombre de polynômes unitaires irréductibles de degré $2$ de $\mathbb{F}_{4}[X]$, puis les expliciter.
  corrige: |
    **1.** D'après la proposition 4 du cours, en comparant les degrés, $\sum_{d \mid n}d\,I_{d} = 2^{n}$, où $I_{d}$ est le nombre d'irréductibles unitaires de degré $d$. Avec $I_{1} = 2$ ($X$ et $X + 1$) : 
    $$2 + 2I_{2} = 4, \qquad 2 + 3I_{3} = 8, \qquad 2 + 2I_{2} + 4I_{4} = 16, \qquad 2 + 5I_{5} = 32,$$
     d'où $\boxed{I_{2} = 1, \ I_{3} = 2, \ I_{4} = 3, \ I_{5} = 6}$, conformément à la feuille 5.

    **2.** Soit $\alpha$ une racine de $P$ dans $\mathbb{F}_{16}$. Comme $\mathbb{F}_{2}(\alpha) = \mathbb{F}_{16}$ (degré $4$), $\alpha \notin \mathbb{F}_{4}$. Or $[\mathbb{F}_{16} : \mathbb{F}_{4}] = 2$, donc $\alpha$ est de degré $2$ sur $\mathbb{F}_{4}$ : son polynôme minimal $M$ sur $\mathbb{F}_{4}$ est un facteur irréductible de degré $2$ de $P$ dans $\mathbb{F}_{4}[X]$.

    Le quotient $P/M$ est de degré $2$, et ses racines, qui sont aussi des racines de $P$, ne sont pas dans $\mathbb{F}_{4}$ par le même argument : il est irréductible. Ainsi $P$ est 
    $$\boxed{\text{produit de deux irréductibles de degré }{2}}.$$

    **3.** Les trois irréductibles de degré $4$ fournissent six facteurs de degré $2$, distincts puisque ces polynômes sont premiers entre eux deux à deux.

    Réciproquement, soit $N \in \mathbb{F}_{4}[X]$ unitaire irréductible de degré $2$ et $\beta$ une racine de $N$ dans $\mathbb{F}_{16}$. Alors $\beta \notin \mathbb{F}_{4}$, et $\mathbb{F}_{4}$ est le seul sous-corps de $\mathbb{F}_{16}$ de degré $2$ sur $\mathbb{F}_{2}$ (cours, prop. 3) : le degré de $\beta$ sur $\mathbb{F}_{2}$ est $4$. Son polynôme minimal sur $\mathbb{F}_{2}$ est l'un des trois polynômes ci-dessus, et $N$ en est un facteur.

    Il y a donc $\boxed{6}$ irréductibles unitaires de degré $2$ dans $\mathbb{F}_{4}[X]$. Un dénombrement direct le confirme : $16$ polynômes unitaires de degré $2$, dont $4 + 6 = 10$ de la forme $(X - a)(X - b)$. Ce sont : 
    $$X^{4} + X + 1 = (X^{2} + X + j)(X^{2} + X + j^{2}), \qquad X^{4} + X^{3} + 1 = (X^{2} + jX + j)(X^{2} + j^{2}X + j^{2}),$$

    $$X^{4} + X^{3} + X^{2} + X + 1 = (X^{2} + jX + 1)(X^{2} + j^{2}X + 1).$$
     Vérifions la première : $(X^{2} + X)^{2} + (j + j^{2})(X^{2} + X) + j^{3} = X^{4} + X^{2} + X^{2} + X + 1 = X^{4} + X + 1$, car $j + j^{2} = 1$ et $j^{3} = 1$. Les autres se vérifient de même. Dans chaque produit, le second facteur se déduit du premier en échangeant $j$ et $j^{2}$, c'est-à-dire en appliquant le Frobenius de $\mathbb{F}_{4}$ aux coefficients.
