  source: "Nice, « Corps finis », exercice 5"
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Soit $n \geqslant 1$ et $P_{1}$, $P_{2}$ deux polynômes unitaires irréductibles de $\mathbb{F}_{p}[X]$ de degré $n$. On note $K_{1} = \mathbb{F}_{p}[X]/\langle P_{1} \rangle$ et $K_{2} = \mathbb{F}_{p}[X]/\langle P_{2} \rangle$.

    **1.** Soit $A$ une $\mathbb{F}_{p}$-algèbre (un anneau contenant $\mathbb{F}_{p}$). Montrer que la donnée d'un morphisme de $\mathbb{F}_{p}$-algèbres de $K_{1}$ dans $A$ équivaut à celle d'une racine de $P_{1}$ dans $A$.

    **2.** Montrer que $P_{1}$ a une racine $\alpha$ dans $K_{2}$. *On pourra utiliser la proposition 4 du cours.* En déduire un isomorphisme de $K_{1}$ sur $K_{2}$.

    **3.** Expliciter un tel isomorphisme lorsque $p = 3$, $P_{1} = X^{2} + X + 2$ et $P_{2} = X^{2} + 2X + 2$.

    **4.** L'isomorphisme de $K_{1}$ sur $K_{2}$ est-il unique ? Combien y en a-t-il ?
  corrige: |
    **1.** Notons $x$ la classe de $X$ dans $K_{1}$. Si $f : K_{1} \to A$ est un morphisme de $\mathbb{F}_{p}$-algèbres, alors $P_{1}(f(x)) = f(P_{1}(x)) = 0$ : $f(x)$ est une racine de $P_{1}$ dans $A$. Comme $x$ engendre $K_{1}$, $f$ est déterminé par $f(x)$.

    Réciproquement, si $a \in A$ est racine de $P_{1}$, le morphisme d'évaluation $\mathbb{F}_{p}[X] \to A$, $P \mapsto P(a)$, s'annule sur $\langle P_{1} \rangle$ et passe au quotient (chapitre 2, th. 2) : il fournit un morphisme $K_{1} \to A$ qui envoie $x$ sur $a$.

    **2.** Le corps $K_{2}$ a $p^{n}$ éléments : $X^{p^{n}} - X = \prod_{a \in K_{2}}(X - a)$ (cours, th. 1). Comme $P_{1}$ est irréductible de degré $n$, il divise $X^{p^{n}} - X$ (cours, prop. 4), donc il est scindé sur $K_{2}$ et y a une racine $\alpha$.

    Par la question 1, $x \mapsto \alpha$ définit un morphisme $f : K_{1} \to K_{2}$. Il est injectif, puisque $K_{1}$ est un corps (chapitre 1, prop. 16), et $|K_{1}| = |K_{2}| = p^{n}$ : $\boxed{f \text{ est un isomorphisme}}$. Le polynôme minimal de $\alpha$ sur $\mathbb{F}_{p}$ est $P_{1}$, unitaire irréductible annulant $\alpha$.

    **3.** Notons $y$ la classe de $X$ dans $K_{2}$, de sorte que $y^{2} = -2y - 2 = y + 1$. On cherche $\alpha = ay + b$ tel que $\alpha^{2} + \alpha + 2 = 0$ ; par exemple, pour $\alpha = 2y$, 
    $$(2y)^{2} + 2y + 2 = 4y^{2} + 2y + 2 = y^{2} + 2y + 2 = 0.$$
     L'isomorphisme est donc $\boxed{a + bx \longmapsto a + 2by}$. L'autre racine est $-1 - 2y = y + 2$, puisque la somme des racines de $P_{1}$ vaut $-1$.

    **4.** L'isomorphisme *n'est pas unique* : il y en a autant que de racines de $P_{1}$ dans $K_{2}$, soit $\boxed{n}$, puisque $P_{1}$, qui divise $X^{p^{n}} - X$, a ses racines simples. Deux d'entre eux diffèrent d'un automorphisme de $K_{2}$, puissance du Frobenius (exercice 8). Ici, $n = 2$ : le second isomorphisme envoie $x$ sur $y + 2$.
- id: "l3-sa-08-08"
  feuille: "f-l3-sa-08"
  numero: 8
  partie: "Structure des corps finis"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [structure des corps finis, groupe multiplicatif cyclique]
  noeuds: [gs-corps-finis, gf-multiplicatif]
  notions: [corps-fini, frobenius, groupe-multiplicatif]
  source: "ENS Lyon, TD 10, exercice 2 ; Paris 13, exercice 5 (1)"
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Soit $L/K$ une extension de corps. On note $\operatorname{Aut}(L/K)$ l'ensemble des automorphismes de $L$ dont la restriction à $K$ est l'identité.

    **1.** Montrer que $\operatorname{Aut}(L/K)$ est un groupe pour la composition. Si $L = K(\alpha)$ est une extension finie, montrer que $|\operatorname{Aut}(L/K)| \leqslant [L : K]$.

    **2.** Montrer que $\operatorname{Aut}(\mathbb{F}_{p^{n}}/\mathbb{F}_{p})$ est cyclique d'ordre $n$, engendré par $\mathrm{Fr}$.

    **3.** Soit $\sigma \in \operatorname{Aut}(\mathbb{F}_{p^{n}}/\mathbb{F}_{p})$ d'ordre $k$. Montrer que l'ensemble des points fixes de $\sigma$ est le sous-corps à $p^{n/k}$ éléments.

    **4.** En déduire que $H \mapsto \{x \in \mathbb{F}_{p^{n}} ; \sigma(x) = x \text{ pour tout } \sigma \in H\}$ est une bijection décroissante de l'ensemble des sous-groupes de $\operatorname{Aut}(\mathbb{F}_{p^{n}}/\mathbb{F}_{p})$ sur l'ensemble des sous-corps de $\mathbb{F}_{p^{n}}$.
  corrige: |
    **1.** Les automorphismes de $L$ forment un groupe pour la composition ; ceux qui fixent $K$ point par point forment un sous-groupe, puisque la composée et l'inverse d'automorphismes fixant $K$ le fixent encore.

    Si $L = K(\alpha)$ est fini sur $K$, alors $L = K[\alpha]$, et $\sigma \in \operatorname{Aut}(L/K)$ est déterminé par $\sigma(\alpha)$. Or $\mu_{\alpha}(\sigma(\alpha)) = \sigma(\mu_{\alpha}(\alpha)) = 0$, les coefficients de $\mu_{\alpha}$ étant fixes : $\sigma(\alpha)$ est l'une des au plus $\deg\mu_{\alpha} = [L : K]$ racines de $\mu_{\alpha}$ dans $L$. Donc $\boxed{|\operatorname{Aut}(L/K)| \leqslant [L : K]}$.

    **2.** Le Frobenius est un automorphisme de $\mathbb{F}_{p^{n}}$ (cours, prop. 2), qui fixe $\mathbb{F}_{p}$ (petit théorème de Fermat). On a $\mathrm{Fr}^{k} = \mathrm{id}$ si et seulement si tous les éléments sont racines de $X^{p^{k}} - X$, ce qui impose $p^{n} \leqslant p^{k}$ ; et $\mathrm{Fr}^{n} = \mathrm{id}$. Donc $\mathrm{Fr}$ est d'ordre $n$.

    D'autre part, $\mathbb{F}_{p^{n}} = \mathbb{F}_{p}(\zeta)$ pour un élément primitif $\zeta$ (cours, après le th. 2), donc $|\operatorname{Aut}(\mathbb{F}_{p^{n}}/\mathbb{F}_{p})| \leqslant n$ par la question 1. Ainsi $\boxed{\operatorname{Aut}(\mathbb{F}_{p^{n}}/\mathbb{F}_{p}) = \langle \mathrm{Fr} \rangle \simeq \mathbb{Z}/n\mathbb{Z}}$.

    **3.** Le groupe cyclique $\langle \mathrm{Fr} \rangle$, d'ordre $n$, a un unique sous-groupe d'ordre $k$, engendré par $\mathrm{Fr}^{n/k}$ (chapitre 1, prop. 8) : c'est $\langle \sigma \rangle$. Un élément est fixe par $\sigma$ si et seulement s'il est fixe par $\langle \sigma \rangle = \langle \mathrm{Fr}^{n/k} \rangle$, c'est-à-dire si $x^{p^{n/k}} = x$. C'est le sous-corps à $p^{n/k}$ éléments (cours, prop. 3).

    **4.** Les sous-groupes de $\langle \mathrm{Fr} \rangle$ sont les $H_{k} = \langle \mathrm{Fr}^{n/k} \rangle$, un pour chaque diviseur $k$ de $n$, et l'ensemble des points fixes de $H_{k}$ est $\mathbb{F}_{p^{n/k}}$ (question 3). Les sous-corps de $\mathbb{F}_{p^{n}}$ sont les $\mathbb{F}_{p^{d}}$, un pour chaque diviseur $d$ de $n$ (cours, prop. 3). Comme $k \mapsto n/k$ est une bijection de l'ensemble des diviseurs de $n$, l'application $H \mapsto \mathrm{Fix}(H)$ est $\boxed{\text{bijective}}$.

    Elle est décroissante : si $H \subset H'$, un élément fixe par $H'$ l'est par $H$. Sa réciproque associe à un sous-corps $F$ le groupe $\operatorname{Aut}(\mathbb{F}_{p^{n}}/F)$, d'ordre $[\mathbb{F}_{p^{n}} : F]$. C'est le premier exemple de la *correspondance de Galois*.
- id: "l3-sa-08-09"
