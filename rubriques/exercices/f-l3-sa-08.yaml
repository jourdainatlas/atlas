  page_enonce: 4
  page_corrige: 9
  enonce: |
    **1.** Expliciter $\Phi_{n}$ pour $1 \leqslant n \leqslant 10$.

    **2.** Montrer que $X^{n - 1} + X^{n - 2} + \cdots + X + 1$ est irréductible dans $\mathbb{Q}[X]$ si et seulement si $n$ est premier. Décomposer $X^{9} + X^{8} + \cdots + X + 1$ en facteurs irréductibles dans $\mathbb{Q}[X]$.
  corrige: |
    **1.** Le cours donne $\Phi_{1} = X - 1$, $\Phi_{2} = X + 1$, $\Phi_{4} = X^{2} + 1$, $\Phi_{6} = X^{2} - X + 1$ et $\Phi_{p} = X^{p - 1} + \cdots + 1$ pour $p$ premier. Les autres s'obtiennent par les formules de l'exercice 14 (2), ou en divisant $X^{n} - 1$ par les $\Phi_{d}$, $d \mid n$, $d < n$ : 
    $$\Phi_{8} = \Phi_{4}(X^{2}) = X^{4} + 1, \qquad \Phi_{9} = \Phi_{3}(X^{3}) = X^{6} + X^{3} + 1, \qquad \Phi_{10} = \Phi_{5}(-X) = X^{4} - X^{3} + X^{2} - X + 1.$$
     Avec $\Phi_{3} = X^{2} + X + 1$, $\Phi_{5} = X^{4} + X^{3} + X^{2} + X + 1$ et $\Phi_{7} = X^{6} + \cdots + X + 1$, la liste est complète.

    **2.** Pour $n \geqslant 2$, on a $X^{n - 1} + \cdots + 1 = \frac{X^{n} - 1}{X - 1} = \prod_{d \mid n, d > 1}\Phi_{d}$ (cours, prop. 5).

    Si $n$ est premier, c'est $\Phi_{n}$, irréductible (cours, th. 3). Sinon, $n$ a un diviseur $d$ avec $1 < d < n$, et le produit contient au moins les deux facteurs non constants $\Phi_{d}$ et $\Phi_{n}$ : le polynôme est réductible. Pour $n = 1$, le polynôme vaut $1$, qui n'est pas irréductible. D'où l'équivalence.

    Pour $n = 10$ : 
    $$\boxed{X^{9} + \cdots + X + 1 = \Phi_{2}\Phi_{5}\Phi_{10} = (X + 1)(X^{4} + X^{3} + X^{2} + X + 1)(X^{4} - X^{3} + X^{2} - X + 1)}.$$
- id: "l3-sa-08-14"
  feuille: "f-l3-sa-08"
  numero: 14
  partie: "Polynômes cyclotomiques"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [polynômes cyclotomiques]
  noeuds: [gc-cyclotomiques, gc-irreductibilite]
  notions: [polynome-cyclotomique, racine-nieme-unite]
  source: "L3 Algèbre 2, TD 5 (2011-12), exercice 5 ; rappels (1), (3), (4) des exercices de polynômes cyclotomiques (I. Kortchemski)"
  page_enonce: 4
  page_corrige: 10
  enonce: |
    *(Propriétés arithmétiques des polynômes cyclotomiques.)*

    **1.** Soit $n \geqslant 2$ et $d$ un diviseur de $n$, $d < n$. Montrer que $\Phi_{n}$ divise $\frac{X^{n} - 1}{X^{d} - 1}$ dans $\mathbb{Z}[X]$. Montrer que $\Phi_{n}(r) > r - 1$ pour tout réel $r \geqslant 2$.

    **2.** Soit $N \geqslant 1$. Montrer que 
    $$\Phi_{pN}(X)\,\Phi_{N}(X) = \Phi_{N}(X^{p}) \ \text{ si } p \nmid N, \qquad \Phi_{pN}(X) = \Phi_{N}(X^{p}) \ \text{ si } p \mid N.$$
     En déduire que $\Phi_{2n}(X) = \Phi_{n}(-X)$ si $n \geqslant 3$ est impair, et que $\Phi_{2n}(X) = \Phi_{n}(X^{2})$ si $n$ est pair.

    **3.** Soit $n = p^{\alpha}N$, avec $\alpha \geqslant 1$ et $p$ ne divisant pas $N$. Montrer que, dans $\mathbb{F}_{p}[X]$, $\overline{\Phi_{n}} = \overline{\Phi_{N}}^{\,\varphi(p^{\alpha})}$.

    **4.** Soit $a \in \mathbb{Z}$ et $n = p^{\alpha}N$ avec $\alpha \geqslant 0$ et $p$ ne divisant pas $N$. On suppose que $p$ divise $\Phi_{n}(a)$. Montrer que $\operatorname{ord}_{p}(a) = N$. En déduire que $p$ divise $n$ ou que $p \equiv 1 \pmod{n}$.

    **5.** Soit $m$, $n \geqslant 1$ et $a \in \mathbb{Z}$. On suppose que $p$ divise $\Phi_{m}(a)$ et $\Phi_{n}(a)$. Montrer que $\frac{m}{n} = p^{k}$ pour un $k \in \mathbb{Z}$.
  corrige: |
    **1.** Par la proposition 5 du cours, 
    $$\frac{X^{n} - 1}{X^{d} - 1} = \frac{\prod_{e \mid n}\Phi_{e}}{\prod_{e \mid d}\Phi_{e}} = \prod_{e \mid n, \ e \nmid d}\Phi_{e},$$
     produit de polynômes de $\mathbb{Z}[X]$ qui contient $\Phi_{n}$, puisque $n \nmid d$.

    Pour $r \geqslant 2$ et $n \geqslant 3$, les racines de $\Phi_{n}$ sont non réelles et conjuguées deux à deux, donc $\Phi_{n}(r) = \prod_{\zeta}|r - \zeta|$. Pour $|\zeta| = 1$ et $\zeta \neq 1$, l'inégalité triangulaire est stricte : $|r - \zeta| > r - 1 \geqslant 1$. Donc $\Phi_{n}(r) > (r - 1)^{\varphi(n)} \geqslant r - 1$. Pour $n = 2$, $\Phi_{2}(r) = r + 1 > r - 1$. Ainsi $\boxed{\Phi_{n}(r) > r - 1 \text{ pour } n \geqslant 2}$.

    **2.** Soit $z$ tel que $z^{pN} = 1$, d'ordre $m$ ; l'ordre de $z^{p}$ est $\frac{m}{\mathrm{pgcd}(m, p)}$.

    Supposons $p \nmid N$. Alors $z^{p}$ est d'ordre $N$ si et seulement si $m = N$ ou $m = pN$. Les racines de $\Phi_{N}(X^{p})$, polynôme unitaire de degré $p\,\varphi(N)$, sont donc les racines primitives $N$-ièmes et $pN$-ièmes de l'unité. Elles sont au nombre de $\varphi(N) + \varphi(pN) = \varphi(N) + (p - 1)\varphi(N) = p\,\varphi(N)$, toutes distinctes. D'où $\boxed{\Phi_{N}(X^{p}) = \Phi_{N}\,\Phi_{pN}}$.

    Supposons $p \mid N$. Si $z^{p}$ est d'ordre $N$, alors $m = N$ est exclu (sinon $z^{p}$ serait d'ordre $N/p$), donc $m = pN$ ; réciproquement, si $m = pN$, $z^{p}$ est d'ordre $N$. Les degrés coïncident, $p\,\varphi(N) = \varphi(pN)$, d'où $\boxed{\Phi_{pN}(X) = \Phi_{N}(X^{p})}$.

    *Cas $p = 2$.* Si $n$ est pair, c'est la seconde formule : $\Phi_{2n}(X) = \Phi_{n}(X^{2})$.

    Si $n \geqslant 3$ est impair, l'application $\zeta \mapsto \omega = \zeta^{(n + 1)/2}$ est une bijection des racines primitives $n$-ièmes sur elles-mêmes, de réciproque $\omega \mapsto \omega^{2}$. Comme $X^{2} - \omega^{2} = (X - \omega)(X + \omega)$, 
    $$\Phi_{n}(X^{2}) = \prod_{\omega}(X - \omega)(X + \omega) = \Phi_{n}(X)\,(-1)^{\varphi(n)}\Phi_{n}(-X) = \Phi_{n}(X)\,\Phi_{n}(-X),$$
     car $\varphi(n)$ est pair. Avec la première formule, on obtient $\boxed{\Phi_{2n}(X) = \Phi_{n}(-X)}$.

    *Pour $n = 1$, la formule est fausse* : $\Phi_{2} = X + 1$ et $\Phi_{1}(-X) = -X - 1$. C'est pourquoi l'énoncé suppose $n \geqslant 3$, alors que la source l'énonçait pour tout $n$ impair.

    **3.** Dans $\mathbb{F}_{p}[X]$, le Frobenius fixe les coefficients, donc $\overline{F}(X^{p}) = \overline{F}(X)^{p}$ pour tout $F \in \mathbb{Z}[X]$.

    Pour $\alpha = 1$, la question 2 donne $\overline{\Phi_{pN}}\,\overline{\Phi_{N}} = \overline{\Phi_{N}}^{\,p}$. On simplifie par $\overline{\Phi_{N}} \neq 0$ dans l'anneau intègre $\mathbb{F}_{p}[X]$ : $\overline{\Phi_{pN}} = \overline{\Phi_{N}}^{\,p - 1}$.

    Pour $\alpha \geqslant 2$, $p$ divise $p^{\alpha - 1}N$, et $\Phi_{p^{\alpha}N}(X) = \Phi_{p^{\alpha - 1}N}(X^{p})$, donc $\overline{\Phi_{p^{\alpha}N}} = \overline{\Phi_{p^{\alpha - 1}N}}^{\,p}$. Par récurrence, 
    $$\boxed{\overline{\Phi_{p^{\alpha}N}} = \overline{\Phi_{N}}^{\,(p - 1)p^{\alpha - 1}} = \overline{\Phi_{N}}^{\,\varphi(p^{\alpha})}}.$$

    **4.** Comme $\Phi_{n}$ divise $X^{n} - 1$, on a $a^{n} \equiv 1 \pmod{p}$, donc $\overline{a} \neq 0$. Par la question 3 (ou directement si $\alpha = 0$), $\overline{\Phi_{N}}(\overline{a}) = 0$, et $\overline{a}^{N} = 1$ : l'ordre $d$ de $\overline{a}$ divise $N$.

    Si l'on avait $d < N$, $\overline{a}$ serait racine de $X^{d} - 1 = \prod_{e \mid d}\Phi_{e}$, donc d'un $\overline{\Phi_{e}}$ avec $e \mid N$, $e < N$. Dans $X^{N} - 1 = \prod_{e' \mid N}\Phi_{e'}$, les deux facteurs distincts $\overline{\Phi_{e}}$ et $\overline{\Phi_{N}}$ s'annuleraient en $\overline{a}$, qui serait racine multiple de $X^{N} - 1$. C'est impossible, car la dérivée $N X^{N - 1}$ ne s'annule pas en $\overline{a} \neq 0$ ($p \nmid N$). Donc $\boxed{\operatorname{ord}_{p}(a) = N}$.

    Par le théorème de Lagrange dans $\mathbb{F}_{p}^{*}$, $N$ divise $p - 1$. Si $p \nmid n$, alors $\alpha = 0$ et $N = n$ : $\boxed{p \equiv 1 \pmod{n}}$.

    **5.** Écrivons $m = p^{\alpha}M$ et $n = p^{\beta}N$, avec $p \nmid M$, $p \nmid N$. Par la question 4, $\operatorname{ord}_{p}(a)$ vaut à la fois $M$ et $N$, donc $M = N$ et $\boxed{\frac{m}{n} = p^{\alpha - \beta}}$.
