  notions: [polynome-cyclotomique, racine-nieme-unite]
  source: "L3 Algèbre 2, TD 5, exercice 6 ; exercices de polynômes cyclotomiques (I. Kortchemski), exercices 1 et 6 (Olympiades d'Iran 2013) ; Paris 13, exercice 5 (2)"
  page_enonce: 4
  page_corrige: 11
  enonce: |
    Soit $n \geqslant 1$ et $p$ un nombre premier ne divisant pas $n$.

    **1.** Montrer que le coefficient constant de $\Phi_{n}$ vaut $1$ ou $-1$.

    **2.** Soit $a \in \mathbb{Z}$. Montrer que $p$ divise $\Phi_{n}(a)$ si et seulement si $\operatorname{ord}_{p}(a) = n$. En déduire que $p \equiv 1 \pmod{n}$ si et seulement s'il existe $a \in \mathbb{Z}$ tel que $p$ divise $\Phi_{n}(a)$.

    **3.** Montrer qu'il existe une infinité de nombres premiers congrus à $1$ modulo $n$. *On pourra considérer $\Phi_{n}(T^{k})$, où $T$ est le produit de $n$ et d'un nombre fini de nombres premiers $\equiv 1 \pmod{n}$.*

    **4.** Soit $d$ un diviseur de $p - 1$. Calculer le produit des éléments de $\mathbb{F}_{p}^{*}$ d'ordre $d$.

    **5.** Montrer que $\overline{\Phi_{n}}$ est, dans $\mathbb{F}_{p}[X]$, le produit de $\frac{\varphi(n)}{k}$ polynômes irréductibles distincts, tous de degré $k = \operatorname{ord}_{n}(p)$.
  corrige: |
    **1.** Le coefficient constant $\Phi_{n}(0) = \prod_{\zeta}(-\zeta)$ est un entier de module $1$ : il vaut $\boxed{\pm 1}$ (et même $1$ pour $n \geqslant 2$).

    **2.** Si $p$ divise $\Phi_{n}(a)$, l'exercice 14 (4), avec $\alpha = 0$, donne $\operatorname{ord}_{p}(a) = n$.

    Réciproquement, si $\operatorname{ord}_{p}(a) = n$, alors $\overline{a}$ est racine de $X^{n} - 1 = \prod_{d \mid n}\Phi_{d}$, donc d'un $\overline{\Phi_{d}}$ avec $d \mid n$. Par le sens direct appliqué à $d$ (qui est premier à $p$), $\operatorname{ord}_{p}(a) = d$, donc $d = n$ : $p$ divise $\Phi_{n}(a)$.

    Par conséquent, il existe $a$ tel que $p \mid \Phi_{n}(a)$ si et seulement si $\mathbb{F}_{p}^{*}$ a un élément d'ordre $n$. Ce groupe étant cyclique d'ordre $p - 1$ (cours, th. 2), c'est le cas si et seulement si $\boxed{n \mid p - 1}$.

    **3.** Pour $n = 1$, il n'y a rien à montrer. Soit $n \geqslant 2$ ; supposons qu'il n'y ait qu'un nombre fini de premiers $p_{1}$, …, $p_{k}$ congrus à $1$ modulo $n$, et posons $T = n\,p_{1}\cdots p_{k} \geqslant 2$.

    Par l'exercice 14 (1), $\Phi_{n}(T) > T - 1 \geqslant 1$ : il a un diviseur premier $p$. Modulo tout premier divisant $T$, $\Phi_{n}(T) \equiv \Phi_{n}(0) = \pm 1$, donc $p \nmid T$ : en particulier, $p \nmid n$ et $p$ n'est aucun des $p_{i}$. Mais la question 2 donne $p \equiv 1 \pmod{n}$ : c'est une contradiction. Il existe donc 
    $$\boxed{\text{une infinité de nombres premiers }{\equiv 1 \pmod{n}}}.$$

    C'est un cas particulier du théorème de Dirichlet sur les progressions arithmétiques, dont la démonstration générale, analytique, dépasse ce cours.

    **4.** Comme $d < p$, $p \nmid d$, et par la question 2 les éléments d'ordre $d$ de $\mathbb{F}_{p}^{*}$ sont les racines de $\overline{\Phi_{d}}$ dans $\mathbb{F}_{p}$. Ils sont au nombre de $\varphi(d) = \deg\Phi_{d}$, puisque $\mathbb{F}_{p}^{*}$ est cyclique : $\overline{\Phi_{d}}$ est scindé à racines simples sur $\mathbb{F}_{p}$, et le produit cherché vaut $(-1)^{\varphi(d)}\Phi_{d}(0)$.

    Pour $d = 1$, il vaut $1$ ; pour $d = 2$, $-1$ ; pour $d \geqslant 3$, $\varphi(d)$ est pair et $\Phi_{d}(0) = 1$. Donc 
    $$\boxed{\text{le produit vaut } -1 \text{ si } d = 2, \text{ et } 1 \text{ sinon}}.$$
     En faisant le produit sur tous les $d \mid p - 1$, on retrouve le théorème de Wilson : $(p - 1)! \equiv -1 \pmod{p}$.

    **5.** Soit $\zeta$ une racine de $\overline{\Phi_{n}}$ dans un corps de décomposition de $\overline{\Phi_{n}}$ sur $\mathbb{F}_{p}$. Elle est d'ordre exactement $n$ : sinon, elle serait racine de $X^{d} - 1$ pour un $d < n$, $d \mid n$, et racine multiple de $X^{n} - 1$, ce qui est exclu puisque $p \nmid n$.

    Soit $r = [\mathbb{F}_{p}(\zeta) : \mathbb{F}_{p}]$ et $k = \operatorname{ord}_{n}(p)$. Le corps $\mathbb{F}_{p}(\zeta)$ a $p^{r}$ éléments, donc $\zeta^{p^{r} - 1} = 1$, et $n \mid p^{r} - 1$ : ainsi $k \mid r$. Inversement, $n \mid p^{k} - 1$ donne $\zeta^{p^{k}} = \zeta$ : le polynôme minimal de $\zeta$ divise $X^{p^{k}} - X$, et son degré $r$ divise $k$ (cours, prop. 4). Donc $r = k$.

    Tout facteur irréductible de $\overline{\Phi_{n}}$ est le polynôme minimal de l'une de ses racines, donc de degré $k$. Comme $\overline{\Phi_{n}}$ divise $X^{n} - 1$, sans facteur carré, ses facteurs sont distincts : il y en a $\boxed{\frac{\varphi(n)}{k}, \text{ tous de degré } k = \operatorname{ord}_{n}(p)}$.
- id: "l3-sa-08-16"
  feuille: "f-l3-sa-08"
  numero: 16
  partie: "Polynômes cyclotomiques"
  etoiles: 2
