  page_enonce: 11
  page_corrige: 20
  enonce: |
    **1.** Développer $\left(1+\sqrt{2}\right)^2$, puis en déduire une écriture simplifiée de $\sqrt{3+2\sqrt{2}}$.

    **2.** En procédant de la même manière, simplifier $\sqrt{6+2\sqrt{5}}$.

    **3.** En déduire la valeur exacte, puis la nature, du nombre : 
    $$K=\sqrt{3+2\sqrt{2}}-\sqrt{6+2\sqrt{5}}+\sqrt{5}-\sqrt{2}$$
  corrige: |
    **1.** On développe le carré par double distributivité : 
    $$\left(1+\sqrt{2}\right)^2=\left(1+\sqrt{2}\right)\left(1+\sqrt{2}\right) =1+\sqrt{2}+\sqrt{2}+2=3+2\sqrt{2}$$
     Or $1+\sqrt{2}$ est positif, et la racine carrée d'un nombre est l'unique nombre *positif* dont le carré vaut ce nombre : 
    $$\boxed{\sqrt{3+2\sqrt{2}}=1+\sqrt{2}}$$

    **2.** On cherche de même un carré donnant $6+2\sqrt{5}$ : 
    $$\left(1+\sqrt{5}\right)^2=\left(1+\sqrt{5}\right)\left(1+\sqrt{5}\right) =1+\sqrt{5}+\sqrt{5}+5=6+2\sqrt{5}$$
     Comme $1+\sqrt{5}$ est positif : 
    $$\boxed{\sqrt{6+2\sqrt{5}}=1+\sqrt{5}}$$

    **3.** On remplace les deux racines par les expressions obtenues : 
    $$\begin{aligned} K &= \left(1+\sqrt{2}\right)-\left(1+\sqrt{5}\right)+\sqrt{5}-\sqrt{2}\\ &= 1+\sqrt{2}-1-\sqrt{5}+\sqrt{5}-\sqrt{2} \end{aligned}$$

    $$\boxed{K=0}$$
     Bien que son écriture fasse intervenir plusieurs irrationnels, $K$ est donc un entier naturel.
- id: "s-01-41"
  feuille: "f-s-01"
  numero: 41
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Conjecture, Calcul]
  mots_cles: [fractions]
