- id: "s-01-01"
  feuille: "f-s-01"
  numero: 1
  partie: "Fractions"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fractions]
  noeuds: [q-construction]
  notions: [ensemble-rationnels]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Simplifier chacune des fractions suivantes afin de la rendre irréductible :

    **a)** $\dfrac{12}{18}$

    **b)** $\dfrac{45}{60}$

    **c)** $\dfrac{84}{126}$

    **d)** $\dfrac{-105}{45}$

    **e)** $\dfrac{144}{60}$

    **f)** $\dfrac{2\times 3^2\times 5}{3\times 5^2}$

    **g)** $\dfrac{462}{546}$

    **h)** $\dfrac{2^2\times 3^3\times 5}{2^3\times 3\times 5^2}$
  corrige: |
    On décompose le numérateur et le dénominateur en facteurs, puis on simplifie par les facteurs communs :

    **a)** $\dfrac{12}{18}=\dfrac{6\times 2}{6\times 3}=\boxed{\dfrac{2}{3}}$

    **b)** $\dfrac{45}{60}=\dfrac{15\times 3}{15\times 4}=\boxed{\dfrac{3}{4}}$

    **c)** $\dfrac{84}{126}=\dfrac{42\times 2}{42\times 3}=\boxed{\dfrac{2}{3}}$

    **d)** $\dfrac{-105}{45}=\dfrac{15\times(-7)}{15\times 3}=\boxed{-\dfrac{7}{3}}$

    **e)** $\dfrac{144}{60}=\dfrac{12\times 12}{12\times 5}=\boxed{\dfrac{12}{5}}$

    **f)** $\dfrac{2\times 3^2\times 5}{3\times 5^2}=\dfrac{2\times 3}{5}=\boxed{\dfrac{6}{5}}$

    **g)** $\dfrac{462}{546}=\dfrac{2\times 3\times 7\times 11}{2\times 3\times 7\times 13} =\boxed{\dfrac{11}{13}}$

    **h)** $\dfrac{2^2\times 3^3\times 5}{2^3\times 3\times 5^2}=\dfrac{3^2}{2\times 5} =\boxed{\dfrac{9}{10}}$

    Pour **g)**, les deux nombres se décomposent en $462=2\times 3\times 7\times 11$ et $546=2\times 3\times 7\times 13$ : le facteur commun $2\times 3\times 7=42$ ne saute pas aux yeux, d'où l'intérêt de la décomposition systématique.
- id: "s-01-02"
  feuille: "f-s-01"
  numero: 2
  partie: "Fractions"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fractions]
  noeuds: [q-construction]
  notions: [ensemble-rationnels]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Calculer et donner le résultat sous forme d'une fraction irréductible :

    **a)** $\dfrac{3}{4}+\dfrac{5}{6}$

    **b)** $\dfrac{7}{10}-\dfrac{2}{15}$

    **c)** $5-\dfrac{3}{7}$

    **d)** $\dfrac{2}{3}+\dfrac{5}{12}-\dfrac{1}{4}$

    **e)** $\dfrac{3}{8}-\dfrac{5}{6}+\dfrac{1}{2}$

    **f)** $\dfrac{1}{2}+\dfrac{1}{3}+\dfrac{1}{6}$

    **g)** $\dfrac{5}{12}+\dfrac{7}{18}-\dfrac{3}{8}$

    **h)** $\dfrac{3}{4}-\dfrac{5}{6}+\dfrac{7}{12}-\dfrac{1}{3}$
  corrige: |
    On réduit d'abord au même dénominateur, en cherchant le plus petit dénominateur commun :

    **a)** $\dfrac{3}{4}+\dfrac{5}{6}=\dfrac{3\times 3}{4\times 3}+\dfrac{5\times 2}{6\times 2} =\dfrac{9}{12}+\dfrac{10}{12}=\boxed{\dfrac{19}{12}}$

    **b)** $\dfrac{7}{10}-\dfrac{2}{15}=\dfrac{21}{30}-\dfrac{4}{30}=\boxed{\dfrac{17}{30}}$

    **c)** $5-\dfrac{3}{7}=\dfrac{35}{7}-\dfrac{3}{7}=\boxed{\dfrac{32}{7}}$

    **d)** $\dfrac{2}{3}+\dfrac{5}{12}-\dfrac{1}{4}=\dfrac{8}{12}+\dfrac{5}{12}-\dfrac{3}{12} =\dfrac{10}{12}=\boxed{\dfrac{5}{6}}$

    **e)** $\dfrac{3}{8}-\dfrac{5}{6}+\dfrac{1}{2}=\dfrac{9}{24}-\dfrac{20}{24}+\dfrac{12}{24} =\boxed{\dfrac{1}{24}}$

    **f)** $\dfrac{1}{2}+\dfrac{1}{3}+\dfrac{1}{6}=\dfrac{3}{6}+\dfrac{2}{6}+\dfrac{1}{6} =\dfrac{6}{6}=\boxed{1}$

    **g)** Le plus petit dénominateur commun de $12$, $18$ et $8$ est $72$, car $12=2^2\times 3$, $18=2\times 3^2$ et $8=2^3$, d'où $72=2^3\times 3^2$ : 
    $$\dfrac{5}{12}+\dfrac{7}{18}-\dfrac{3}{8}=\dfrac{30}{72}+\dfrac{28}{72}-\dfrac{27}{72} =\boxed{\dfrac{31}{72}}$$

    **h)** Le dénominateur commun est $12$ : 
    $$\dfrac{3}{4}-\dfrac{5}{6}+\dfrac{7}{12}-\dfrac{1}{3}=\dfrac{9}{12}-\dfrac{10}{12}+\dfrac{7}{12}-\dfrac{4}{12} =\dfrac{2}{12}=\boxed{\dfrac{1}{6}}$$
- id: "s-01-03"
  feuille: "f-s-01"
  numero: 3
  partie: "Fractions"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fractions]
  noeuds: [q-construction]
  notions: [ensemble-rationnels]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Calculer en simplifiant *avant* d'effectuer les produits :

    **a)** $\dfrac{14}{15}\times\dfrac{25}{21}$

    **b)** $\dfrac{3}{8}\div\dfrac{9}{4}$

    **c)** $-\dfrac{4}{9}\times\dfrac{27}{16}$

    **d)** $\dfrac{\frac{5}{6}}{\frac{10}{3}}$

    **e)** $\dfrac{2}{7}\times\dfrac{21}{4}\times\dfrac{2}{3}$

    **f)** $\dfrac{7}{12}\div\dfrac{14}{9}$

    **g)** $\dfrac{5}{6}\times\dfrac{9}{10}\times\dfrac{4}{3}\times\dfrac{1}{2}$

    **h)** $\dfrac{8}{15}\div\dfrac{4}{5}\times\dfrac{9}{4}$
  corrige: |
    On repère les facteurs communs *avant* d'effectuer les produits, ce qui évite de manipuler de grands nombres :

    **a)** $\dfrac{14}{15}\times\dfrac{25}{21}=\dfrac{2\times 7}{3\times 5}\times\dfrac{5\times 5}{3\times 7} =\dfrac{2\times 5}{3\times 3}=\boxed{\dfrac{10}{9}}$

    **b)** $\dfrac{3}{8}\div\dfrac{9}{4}=\dfrac{3}{8}\times\dfrac{4}{9} =\dfrac{3\times 4}{8\times 9}=\boxed{\dfrac{1}{6}}$

    **c)** $-\dfrac{4}{9}\times\dfrac{27}{16}=-\dfrac{4\times 27}{9\times 16} =-\dfrac{27}{9\times 4}=\boxed{-\dfrac{3}{4}}$

    **d)** $\dfrac{\frac{5}{6}}{\frac{10}{3}}=\dfrac{5}{6}\times\dfrac{3}{10} =\dfrac{5\times 3}{6\times 10}=\boxed{\dfrac{1}{4}}$

    **e)** $\dfrac{2}{7}\times\dfrac{21}{4}\times\dfrac{2}{3}=\dfrac{2\times 21\times 2}{7\times 4\times 3} =\dfrac{84}{84}=\boxed{1}$

    **f)** $\dfrac{7}{12}\div\dfrac{14}{9}=\dfrac{7}{12}\times\dfrac{9}{14} =\dfrac{7\times 9}{12\times 14}=\boxed{\dfrac{3}{8}}$

    **g)** On écrit tout en un seul quotient, puis on simplifie : 
    $$\dfrac{5}{6}\times\dfrac{9}{10}\times\dfrac{4}{3}\times\dfrac{1}{2} =\dfrac{5\times 9\times 4}{6\times 10\times 3\times 2} =\dfrac{180}{360}=\boxed{\dfrac{1}{2}}$$

    **h)** La division se transforme en multiplication par l'inverse, et l'on simplifie ensuite : 
    $$\dfrac{8}{15}\div\dfrac{4}{5}\times\dfrac{9}{4} =\dfrac{8}{15}\times\dfrac{5}{4}\times\dfrac{9}{4} =\dfrac{8\times 5\times 9}{15\times 4\times 4}=\dfrac{360}{240}=\boxed{\dfrac{3}{2}}$$
- id: "s-01-04"
  feuille: "f-s-01"
  numero: 4
  partie: "Fractions"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fractions]
  noeuds: [q-construction]
  notions: [ensemble-rationnels]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    En respectant les priorités opératoires, calculer les nombres suivants : 
    $$A=\frac{2}{3}+\frac{1}{4}\times\frac{8}{5} \qquad B=\left(\frac{2}{5}+\frac{1}{3}\right)\times\frac{15}{11} \qquad C=\frac{5}{6}-\frac{2}{3}\times\frac{9}{4} \qquad D=\left(1-\frac{3}{5}\right)\div\left(1+\frac{1}{5}\right)$$

    $$E=\frac{2}{3}\times\left(\frac{9}{8}-\frac{3}{4}\right)+\frac{1}{2} \qquad F=\frac{\frac{3}{4}+\frac{2}{3}}{\frac{5}{6}-\frac{1}{4}} \qquad G=\left(\frac{1}{2}-\frac{1}{3}\right)\times\left(\frac{1}{2}+\frac{1}{3}\right)\div\frac{5}{36}$$
  corrige: |
    On effectue d'abord les calculs entre parenthèses, puis les multiplications et divisions, et enfin les additions et soustractions : 
    $$\begin{aligned} A &= \frac{2}{3}+\frac{1}{4}\times\frac{8}{5}=\frac{2}{3}+\frac{8}{20} =\frac{2}{3}+\frac{2}{5}=\frac{10}{15}+\frac{6}{15} & &\text{d'où}\quad \boxed{A=\frac{16}{15}}\\[0.4em] B &= \left(\frac{6}{15}+\frac{5}{15}\right)\times\frac{15}{11}=\frac{11}{15}\times\frac{15}{11} & &\text{d'où}\quad \boxed{B=1}\\[0.4em] C &= \frac{5}{6}-\frac{2\times 9}{3\times 4}=\frac{5}{6}-\frac{3}{2}=\frac{5}{6}-\frac{9}{6} =-\frac{4}{6} & &\text{d'où}\quad \boxed{C=-\frac{2}{3}}\\[0.4em] D &= \left(\frac{5}{5}-\frac{3}{5}\right)\div\left(\frac{5}{5}+\frac{1}{5}\right) =\frac{2}{5}\times\frac{5}{6}=\frac{10}{30} & &\text{d'où}\quad \boxed{D=\frac{1}{3}} \\[0.4em] E &= \frac{2}{3}\times\left(\frac{9}{8}-\frac{6}{8}\right)+\frac{1}{2} =\frac{2}{3}\times\frac{3}{8}+\frac{1}{2}=\frac{1}{4}+\frac{2}{4} & &\text{d'où}\quad \boxed{E=\frac{3}{4}}\\[0.4em] F &= \frac{\frac{9}{12}+\frac{8}{12}}{\frac{10}{12}-\frac{3}{12}} =\frac{\frac{17}{12}}{\frac{7}{12}}=\frac{17}{12}\times\frac{12}{7} & &\text{d'où}\quad \boxed{F=\frac{17}{7}}\\[0.4em] G &= \left(\frac{3}{6}-\frac{2}{6}\right)\times\left(\frac{3}{6}+\frac{2}{6}\right)\div\frac{5}{36} =\frac{1}{6}\times\frac{5}{6}\times\frac{36}{5}=\frac{5}{36}\times\frac{36}{5} & &\text{d'où}\quad \boxed{G=1} \end{aligned}$$
- id: "s-01-05"
  feuille: "f-s-01"
  numero: 5
  partie: "Fractions"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fractions]
  noeuds: [q-construction]
  notions: [ensemble-rationnels]
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Écrire chacun des nombres suivants sous la forme d'une fraction irréductible : 
    $$E=\frac{\frac{1}{2}+\frac{1}{3}}{\frac{1}{2}-\frac{1}{3}} \qquad F=\frac{\frac{3}{4}}{2+\frac{1}{2}} \qquad G=\cfrac{1}{1+\cfrac{1}{1+\cfrac{1}{2}}} \qquad H=\frac{\frac{2}{3}-\frac{1}{6}}{\frac{1}{2}+\frac{1}{4}}$$
  corrige: |
    On calcule séparément le numérateur et le dénominateur, puis on divise : 
    $$\begin{aligned} E &= \frac{\frac{3}{6}+\frac{2}{6}}{\frac{3}{6}-\frac{2}{6}}=\frac{\frac{5}{6}}{\frac{1}{6}} =\frac{5}{6}\times\frac{6}{1} & &\text{d'où}\quad \boxed{E=5}\\[0.4em] F &= \frac{\frac{3}{4}}{\frac{5}{2}}=\frac{3}{4}\times\frac{2}{5}=\frac{6}{20} & &\text{d'où}\quad \boxed{F=\frac{3}{10}}\\[0.4em] G &= \cfrac{1}{1+\cfrac{1}{\frac{3}{2}}}=\cfrac{1}{1+\frac{2}{3}}=\cfrac{1}{\frac{5}{3}} & &\text{d'où}\quad \boxed{G=\frac{3}{5}}\\[0.4em] H &= \frac{\frac{4}{6}-\frac{1}{6}}{\frac{2}{4}+\frac{1}{4}}=\frac{\frac{1}{2}}{\frac{3}{4}} =\frac{1}{2}\times\frac{4}{3} & &\text{d'où}\quad \boxed{H=\frac{2}{3}} \end{aligned}$$
- id: "s-01-06"
  feuille: "f-s-01"
  numero: 6
  partie: "Fractions"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fractions]
  noeuds: [q-construction]
  notions: [ensemble-rationnels]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Un terrain rectangulaire de $1\,200\;\text{m}^2$ est aménagé de la façon suivante : les $\dfrac{2}{5}$ de sa surface sont occupés par un potager, puis le tiers de la surface restante est recouvert de pelouse. Enfin, le quart de ce qu'il reste alors sert d'allée, et le reste est planté de fleurs.

    **1.** Quelle fraction du terrain la pelouse occupe-t-elle ?

    **2.** Quelle fraction du terrain l'allée occupe-t-elle ? Et le massif de fleurs ?

    **3.** Vérifier que la somme des quatre fractions obtenues vaut bien $1$.

    **4.** En déduire l'aire, en $\text{m}^2$, de chacune des quatre zones.
  corrige: |
    On raisonne sur des fractions du terrain *tout entier*, en prenant garde au fait que l'énoncé parle à chaque fois de ce qu'il *reste*.

    **1.** Le potager occupe $\dfrac{2}{5}$ du terrain, il reste donc $1-\dfrac{2}{5}=\dfrac{3}{5}$ du terrain. La pelouse en occupe le tiers : 
    $$\frac{1}{3}\times\frac{3}{5}=\frac{3}{15} \qquad\text{d'où}\qquad \boxed{\text{la pelouse occupe }\frac{1}{5}\text{ du terrain}}$$

    **2.** Après le potager et la pelouse, il reste $\dfrac{3}{5}-\dfrac{1}{5}=\dfrac{2}{5}$ du terrain. L'allée en occupe le quart, et les fleurs les trois quarts : 
    $$\frac{1}{4}\times\frac{2}{5}=\frac{2}{20}=\frac{1}{10} \qquad ; \qquad \frac{2}{5}-\frac{1}{10}=\frac{4}{10}-\frac{1}{10}=\frac{3}{10}$$

    $$\boxed{\text{l'allée occupe }\frac{1}{10}\text{ du terrain, et les fleurs }\frac{3}{10}}$$

    **3.** On réduit au même dénominateur $10$ : 
    $$\frac{2}{5}+\frac{1}{5}+\frac{1}{10}+\frac{3}{10}=\frac{4}{10}+\frac{2}{10}+\frac{1}{10}+\frac{3}{10} =\frac{10}{10}=\boxed{1}$$
     Les quatre zones recouvrent bien la totalité du terrain.

    **4.** Il suffit de multiplier chaque fraction par $1\,200$ : 
    $$\boxed{\text{potager : }480\;\text{m}^2 \;;\; \text{pelouse : }240\;\text{m}^2 \;;\; \text{allée : }120\;\text{m}^2 \;;\; \text{fleurs : }360\;\text{m}^2}$$

    En ramenant toutes les fractions au dénominateur $10$, on peut représenter le terrain par un rectangle partagé en dix parts égales, chacune valant $\dfrac{1}{10}$ du terrain, soit $120\;\text{m}^2$ :

    ![Figure](documents/figures/884ecb855cef85e4.svg)
- id: "s-01-07"
  feuille: "f-s-01"
  numero: 7
  partie: "Nombres premiers et décomposition"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [nombres premiers et décomposition]
  noeuds: [z-premiers]
  notions: [nombre-premier]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **1.** Parmi les entiers suivants, déterminer ceux qui sont premiers. On justifiera chaque réponse négative en donnant un diviseur autre que $1$ et le nombre lui-même :

    **a)** $51$

    **b)** $57$

    **c)** $61$

    **d)** $87$

    **e)** $91$

    **f)** $97$

    **g)** $101$

    **h)** $111$

    **2.** Expliquer pourquoi $1$ n'est pas un nombre premier, alors que $2$ l'est.

    **3.** Un nombre premier autre que $2$ peut-il être pair ? Justifier.

    **4.** Pour savoir si $101$ est premier, il a suffi de tester les diviseurs $2$, $3$, $5$ et $7$. Expliquer pourquoi il était inutile de tester $11$ ou davantage. On pourra remarquer que $11\times 11=121$.
  corrige: |
    **1.** Un entier est premier lorsqu'il n'admet que deux diviseurs positifs. Il suffit donc d'exhiber un diviseur intermédiaire pour conclure qu'il ne l'est pas.

    $$\begin{array}{|c|c|c||c|c|c|} \hline \text{Nombre} & \text{Premier ?} & \text{Diviseur} & \text{Nombre} & \text{Premier ?} & \text{Diviseur} \\ \hline 51 & \text{non} & 51=3\times 17 & 91 & \text{non} & 91=7\times 13 \\ \hline 57 & \text{non} & 57=3\times 19 & 97 & \text{oui} &  \\ \hline 61 & \text{oui} &  & 101 & \text{oui} &  \\ \hline 87 & \text{non} & 87=3\times 29 & 111 & \text{non} & 111=3\times 37 \\ \hline \end{array}$$

    Les cas $51$, $57$, $87$ et $111$ se repèrent par le critère de divisibilité par $3$ : la somme des chiffres vaut respectivement $6$, $12$, $15$ et $3$. Le cas $91$ est le piège classique, car $91$ n'est divisible ni par $2$, ni par $3$, ni par $5$ : il faut aller jusqu'à $7$.

    **2.** Le nombre $1$ n'a qu'un seul diviseur positif, lui-même : il en faut *exactement deux*. Le nombre $2$ en a deux, $1$ et $2$ : il est premier.

    **3.** Un nombre pair autre que $2$ est divisible par $1$, par $2$ et par lui-même : il a donc au moins trois diviseurs. 
    $$\boxed{2 \text{ est le seul nombre premier pair.}}$$

    **4.** Si $101$ admettait un diviseur $d$ supérieur ou égal à $11$, le quotient $\dfrac{101}{d}$ serait un second diviseur, inférieur ou égal à $\dfrac{101}{11}<11$. On l'aurait donc déjà rencontré en testant $2$, $3$, $5$ et $7$. 
    $$\boxed{\text{Il suffit de tester les nombres premiers } p \text{ tels que } p\times p\leqslant n.}$$
     Comme $11\times 11=121>101$, les tests s'arrêtent à $7$.
- id: "s-01-08"
  feuille: "f-s-01"
  numero: 8
  partie: "Nombres premiers et décomposition"
  etoiles: 1
  types: [Calcul]
  mots_cles: [nombres premiers et décomposition]
  noeuds: [z-premiers]
  notions: [nombre-premier]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Décomposer chacun des entiers suivants en produit de facteurs premiers, en présentant les divisions successives dans une potence comme dans le cours :

    **a)** $84$

    **b)** $126$

    **c)** $225$

    **d)** $300$

    **e)** $504$

    **f)** $1\,001$

    Pour le dernier, on remarquera qu'il n'est divisible ni par $2$, ni par $3$, ni par $5$.
  corrige: |
    On divise successivement par $2$, puis $3$, puis $5$, puis $7$, jusqu'à obtenir le quotient $1$ : 
    $$\boxed{84=2^{2}\times 3\times 7} \qquad \boxed{126=2\times 3^{2}\times 7} \qquad \boxed{225=3^{2}\times 5^{2}}$$

    $$\boxed{300=2^{2}\times 3\times 5^{2}} \qquad \boxed{504=2^{3}\times 3^{2}\times 7} \qquad \boxed{1\,001=7\times 11\times 13}$$

    *Détail pour $504$ :* $504=2\times 252$, $252=2\times 126$, $126=2\times 63$, $63=3\times 21$, $21=3\times 7$, $7=7\times 1$. On a utilisé trois fois $2$, deux fois $3$ et une fois $7$.

    *Détail pour $1\,001$ :* il n'est ni pair, ni de somme des chiffres divisible par $3$, ni terminé par $0$ ou $5$. On teste alors $7$ : $1\,001=7\times 143$, puis $143=11\times 13$.
- id: "s-01-09"
  feuille: "f-s-01"
  numero: 9
  partie: "Nombres premiers et décomposition"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fractions, nombres premiers et décomposition]
  noeuds: [q-construction, z-premiers]
  notions: [ensemble-rationnels, nombre-premier]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Rendre chacune des fractions suivantes irréductible, en décomposant le numérateur et le dénominateur en facteurs premiers puis en barrant les facteurs communs :

    **a)** $\dfrac{84}{126}$

    **b)** $\dfrac{225}{300}$

    **c)** $\dfrac{588}{840}$

    **d)** $\dfrac{1\,001}{1\,430}$

    Pour chacune, vérifier sur les décompositions obtenues que la fraction finale ne peut plus être simplifiée.
  corrige: |
    On décompose, on barre les facteurs communs, puis on multiplie ce qui reste.

    **a)** $84=2^{2}\times 3\times 7$ et $126=2\times 3^{2}\times 7$ : 
    $$\frac{84}{126}=\frac{\cancel{2}\times 2\times\cancel{3}\times\cancel{7}} {\cancel{2}\times\cancel{3}\times 3\times\cancel{7}} \qquad\text{d'où}\qquad \boxed{\frac{84}{126}=\frac{2}{3}}$$

    **b)** $225=3^{2}\times 5^{2}$ et $300=2^{2}\times 3\times 5^{2}$ : 
    $$\frac{225}{300}=\frac{\cancel{3}\times 3\times\cancel{5^{2}}} {2^{2}\times\cancel{3}\times\cancel{5^{2}}} \qquad\text{d'où}\qquad \boxed{\frac{225}{300}=\frac{3}{4}}$$

    **c)** $588=2^{2}\times 3\times 7^{2}$ et $840=2^{3}\times 3\times 5\times 7$, donc les facteurs communs sont $2^{2}$, $3$ et $7$ : 
    $$\frac{588}{840}=\frac{2^{2}\times 3\times 7\times 7}{2^{2}\times 3\times 7\times 2\times 5} \qquad\text{d'où}\qquad \boxed{\frac{588}{840}=\frac{7}{10}}$$

    **d)** $1\,001=7\times 11\times 13$ et $1\,430=2\times 5\times 11\times 13$ : 
    $$\frac{1\,001}{1\,430}=\frac{7\times\cancel{11}\times\cancel{13}}{2\times 5\times\cancel{11}\times\cancel{13}} \qquad\text{d'où}\qquad \boxed{\frac{1\,001}{1\,430}=\frac{7}{10}}$$

    Dans chaque cas, le numérateur et le dénominateur obtenus n'ont plus aucun facteur premier commun : $2$ et $3$ ; $3$ et $2^{2}$ ; $7$ et $2\times 5$ ; $7$ et $2\times 5$. Les fractions sont donc irréductibles.

    On remarquera que **c)** et **d)** donnent la même fraction, alors que les nombres de départ n'ont rien de commun.
- id: "s-01-10"
  feuille: "f-s-01"
  numero: 10
  partie: "Nombres premiers et décomposition"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [nombres premiers et décomposition]
  noeuds: [z-premiers]
  notions: [nombre-premier]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** Écrire la liste des diviseurs positifs de $12$, puis celle des diviseurs positifs de $18$. Combien y en a-t-il à chaque fois ?

    **2.** On sait que $12=2^2\times 3$ et que $18=2\times 3^2$. Observer le lien entre les exposants de la décomposition et le nombre de diviseurs trouvé à la question précédente.

    **3.** En déduire, sans les énumérer, le nombre de diviseurs positifs de $360=2^3\times 3^2\times 5$.

    **4.** Décomposer $90$ en facteurs premiers. Quel est le plus petit entier $k$ non nul tel que $90\times k$ soit le carré d'un entier ? On précisera ce carré.

    **5.** Même question avec $504$, dont la décomposition a été obtenue à l'exercice 8.

    **6.** Soit $n$ un entier naturel. Démontrer que si $n^2$ est divisible par $3$, alors $n$ l'est aussi. On pourra raisonner sur la décomposition en facteurs premiers de $n$.
  corrige: |
    **1.** On liste les diviseurs : 
    $$12 : 1 \,;\, 2 \,;\, 3 \,;\, 4 \,;\, 6 \,;\, 12 \qquad\text{soit } \boxed{6 \text{ diviseurs}}$$

    $$18 : 1 \,;\, 2 \,;\, 3 \,;\, 6 \,;\, 9 \,;\, 18 \qquad\text{soit } \boxed{6 \text{ diviseurs}}$$

    **2.** Pour $12=2^{2}\times 3$, un diviseur s'écrit $2^{a}\times 3^{b}$ avec $a\in\{0;1;2\}$ et $b\in\{0;1\}$ : il y a $3$ choix pour $a$ et $2$ pour $b$, soit $3\times 2=6$ diviseurs. On retrouve bien le compte, et de même $18=2\times 3^{2}$ donne $2\times 3=6$. 
    $$\boxed{\text{On ajoute } 1 \text{ à chaque exposant, puis on multiplie.}}$$

    **3.** Avec $360=2^{3}\times 3^{2}\times 5$ : 
    $$\boxed{(3+1)\times(2+1)\times(1+1)=4\times 3\times 2=24 \text{ diviseurs}}$$

    **4.** On a $90=2\times 3^{2}\times 5$. Un carré parfait est un nombre dont *tous* les exposants de la décomposition sont pairs. Ici $3$ a l'exposant $2$, qui convient, mais $2$ et $5$ ont l'exposant $1$ : il faut les compléter. 
    $$\boxed{k=2\times 5=10 \qquad\text{et}\qquad 90\times 10=900=30^{2}}$$

    **5.** On a $504=2^{3}\times 3^{2}\times 7$. Les exposants impairs sont ceux de $2$ et de $7$ : 
    $$\boxed{k=2\times 7=14 \qquad\text{et}\qquad 504\times 14=7\,056=84^{2}}$$
     *Vérification :* $504\times 14=2^{4}\times 3^{2}\times 7^{2}=\left(2^{2}\times 3\times 7\right)^{2}=84^{2}$.

    **6.** Écrivons la décomposition de $n$ en facteurs premiers. Celle de $n^{2}$ s'obtient en doublant tous les exposants. Si $3$ divise $n^{2}$, alors $3$ figure dans la décomposition de $n^{2}$, donc son exposant $2e$ y est non nul, donc $e\neq 0$ : le facteur $3$ figure déjà dans la décomposition de $n$. 
    $$\boxed{\text{Si } 3 \text{ divise } n^{2}, \text{ alors } 3 \text{ divise } n.}$$
     Ce raisonnement resservira plus loin dans le chapitre, avec $2$ à la place de $3$.
- id: "s-01-11"
  feuille: "f-s-01"
  numero: 11
  partie: "Puissances"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fractions, puissances, écriture scientifique]
  noeuds: [q-construction, n-operations]
  notions: [ensemble-rationnels]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Écrire chaque expression sous la forme $a^n$, où $n$ est un entier relatif :

    **a)** $2^5\times 2^3$

    **b)** $\dfrac{3^7}{3^4}$

    **c)** $\left(5^2\right)^3$

    **d)** $7^{-2}\times 7^5$

    **e)** $\dfrac{2^3\times 2^{-5}}{2^{-4}}$

    **f)** $\dfrac{10^6\times 10^{-9}}{10^{-2}}$

    **g)** $\dfrac{\left(2^3\right)^2\times 2^{-5}}{\left(2^{-2}\right)^3}$

    **h)** $\dfrac{\left(3^{-1}\right)^4\times 3^{7}}{3^{2}\times 3^{-3}}$
  corrige: |
    On utilise les règles $a^m\times a^n=a^{m+n}$, $\dfrac{a^m}{a^n}=a^{m-n}$ et $(a^m)^n=a^{m\times n}$ :

    **a)** $2^5\times 2^3=2^{5+3}=\boxed{2^8}$

    **b)** $\dfrac{3^7}{3^4}=3^{7-4}=\boxed{3^3}$

    **c)** $\left(5^2\right)^3=5^{2\times 3}=\boxed{5^6}$

    **d)** $7^{-2}\times 7^5=7^{-2+5}=\boxed{7^3}$

    **e)** $\dfrac{2^3\times 2^{-5}}{2^{-4}}=\dfrac{2^{-2}}{2^{-4}}=2^{-2-(-4)}=\boxed{2^2}$

    **f)** $\dfrac{10^6\times 10^{-9}}{10^{-2}}=\dfrac{10^{-3}}{10^{-2}}=\boxed{10^{-1}}$

    **g)** $\dfrac{\left(2^3\right)^2\times 2^{-5}}{\left(2^{-2}\right)^3} =\dfrac{2^{6}\times 2^{-5}}{2^{-6}}=\dfrac{2^{1}}{2^{-6}}=\boxed{2^{7}}$

    **h)** $\dfrac{\left(3^{-1}\right)^4\times 3^{7}}{3^{2}\times 3^{-3}} =\dfrac{3^{-4}\times 3^{7}}{3^{-1}}=\dfrac{3^{3}}{3^{-1}}=\boxed{3^{4}}$

    Dans **g)** et **h)**, on commence par réduire chaque puissance de puissance, puis on regroupe le numérateur, et l'on termine par la division. Trois règles interviennent donc successivement.
- id: "s-01-12"
  feuille: "f-s-01"
  numero: 12
  partie: "Puissances"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fractions, puissances]
  noeuds: [q-construction, n-operations]
  notions: [ensemble-rationnels]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Calculer les nombres suivants, en prêtant attention aux parenthèses :

    **a)** $(-2)^4$

    **b)** $-2^4$

    **c)** $(-1)^{2024}$

    **d)** $3^{-2}$

    **e)** $\left(\dfrac{2}{3}\right)^3$

    **f)** $\left(-\dfrac{1}{2}\right)^{-3}$

    **g)** $\left(\dfrac{2}{3}\right)^3\times\left(\dfrac{9}{4}\right)^2$

    **h)** $\dfrac{\left(-2\right)^5\times 3^{-2}}{\left(-2\right)^{3}\times 3^{-4}}$
  corrige: |
    On prend garde au fait que, sans parenthèses, la puissance ne porte que sur le nombre qui la précède :

    **a)** $(-2)^4=(-2)\times(-2)\times(-2)\times(-2)=\boxed{16}$

    **b)** $-2^4=-\left(2^4\right)=\boxed{-16}$

    **c)** $(-1)^{2024}=\boxed{1}$ (l'exposant est pair)

    **d)** $3^{-2}=\dfrac{1}{3^2}=\boxed{\dfrac{1}{9}}$

    **e)** $\left(\dfrac{2}{3}\right)^3=\dfrac{2^3}{3^3}=\boxed{\dfrac{8}{27}}$

    **f)** $\left(-\dfrac{1}{2}\right)^{-3}=\dfrac{1}{\left(-\frac{1}{2}\right)^3}=\dfrac{1}{-\frac{1}{8}}=\boxed{-8}$

    **g)** $\left(\dfrac{2}{3}\right)^3\times\left(\dfrac{9}{4}\right)^2 =\dfrac{8}{27}\times\dfrac{81}{16}=\dfrac{8\times 81}{27\times 16}=\boxed{\dfrac{3}{2}}$

    **h)** $\dfrac{\left(-2\right)^5\times 3^{-2}}{\left(-2\right)^{3}\times 3^{-4}} =(-2)^{5-3}\times 3^{-2-(-4)}=(-2)^{2}\times 3^{2}=\boxed{36}$

    Dans **h)**, le signe disparaît car l'exposant obtenu, $2$, est pair.
