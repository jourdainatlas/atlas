  enonce: |
    Pour chaque question, une seule réponse est exacte. Déterminer laquelle et justifier.

    $$\begin{array}{|l|c|c|c|} \hline  & \text{Réponse A} & \text{Réponse B} & \text{Réponse C} \\ \hline \text{1. }\dfrac{2}{3}+\dfrac{3}{4}\text{ vaut} & \dfrac{5}{7} & \dfrac{17}{12} & \dfrac{6}{12} \\ \hline \text{2. }\left(-3\right)^2\times 3^{-4}\text{ vaut} & 3^{-2} & -3^{-2} & 3^{6} \\ \hline \text{3. }\sqrt{45}\text{ vaut} & 5\sqrt{3} & 9\sqrt{5} & 3\sqrt{5} \\ \hline \text{4. }\dfrac{15}{6}\text{ appartient à} & \mathbb{N} & \mathbb{D} & \mathbb{R}\setminus\mathbb{Q} \\ \hline \text{5. }[-1\,;4[\;\cap\;[4\,;6]\text{ vaut} & \{4\} & \emptyset & [-1\,;6] \\ \hline \text{6. }\left(\sqrt{3}-1\right)^2\text{ vaut} & 4-2\sqrt{3} & 2 & 4+2\sqrt{3} \\ \hline \end{array}$$
  corrige: |
    **1.** $\dfrac{2}{3}+\dfrac{3}{4}=\dfrac{8}{12}+\dfrac{9}{12}=\dfrac{17}{12}$ : réponse B

    **2.** $(-3)^2\times 3^{-4}=9\times 3^{-4}=3^2\times 3^{-4}=3^{-2}$ : réponse A

    **3.** $\sqrt{45}=\sqrt{9\times 5}=3\sqrt{5}$ : réponse C

    **4.** $\dfrac{15}{6}=\dfrac{5}{2}=2{,}5$, dont l'écriture décimale s'arrête, mais qui n'est pas un entier : réponse B

    **5.** Aucun réel ne peut être à la fois strictement inférieur à $4$ et supérieur ou égal à $4$ : réponse B

    **6.** $\left(\sqrt{3}-1\right)^2=\left(\sqrt{3}-1\right)\left(\sqrt{3}-1\right) =3-\sqrt{3}-\sqrt{3}+1=4-2\sqrt{3}$ : réponse A
- id: "s-01-40"
