  notions: [ensemble-rationnels]
  page_enonce: 11
  page_corrige: 20
  enonce: |
    Soit $n$ un entier naturel non nul. On pose : 
    $$S=\frac{1}{1\times 2}+\frac{1}{2\times 3}+\frac{1}{3\times 4}+\cdots+\frac{1}{n\times(n+1)}$$

    **1.** Vérifier que $\dfrac{1}{1\times 2}=1-\dfrac{1}{2}$, puis que $\dfrac{1}{2\times 3}=\dfrac{1}{2}-\dfrac{1}{3}$.

    **2.** Soit $k$ un entier naturel non nul. Vérifier que $\dfrac{1}{k}-\dfrac{1}{k+1}=\dfrac{1}{k\times(k+1)}$.

    **3.** Calculer $S$ pour $n=3$, puis pour $n=4$, en utilisant les simplifications précédentes.

    **4.** Conjecturer une expression de $S$ en fonction de $n$, puis vérifier la conjecture pour $n=10$.

    **5.** Le nombre $S$ peut-il être égal à $1$ ? Peut-il dépasser $1$ ?
  corrige: |
    **1.** On vérifie les deux égalités : 
    $$\frac{1}{1\times 2}=\frac{1}{2} \quad\text{et}\quad 1-\frac{1}{2}=\frac{1}{2} \qquad ; \qquad \frac{1}{2\times 3}=\frac{1}{6} \quad\text{et}\quad \frac{1}{2}-\frac{1}{3}=\frac{3-2}{6}=\frac{1}{6}$$

    **2.** Soit $k$ un entier naturel non nul. On réduit au même dénominateur $k(k+1)$ : 
    $$\frac{1}{k}-\frac{1}{k+1}=\frac{k+1}{k(k+1)}-\frac{k}{k(k+1)}=\frac{k+1-k}{k(k+1)}$$

    $$\boxed{\frac{1}{k}-\frac{1}{k+1}=\frac{1}{k\times(k+1)}}$$

    **3.** On remplace chaque terme par une différence : les termes intermédiaires se simplifient deux à deux. 
    $$S=\left(1-\frac{1}{2}\right)+\left(\frac{1}{2}-\frac{1}{3}\right)+\left(\frac{1}{3}-\frac{1}{4}\right) =1-\frac{1}{4}=\boxed{\frac{3}{4}} \qquad\text{pour } n=3$$

    $$S=1-\frac{1}{2}+\frac{1}{2}-\frac{1}{3}+\frac{1}{3}-\frac{1}{4}+\frac{1}{4}-\frac{1}{5} =1-\frac{1}{5}=\boxed{\frac{4}{5}} \qquad\text{pour } n=4$$

    **4.** Dans les deux cas, il ne reste que le premier et le dernier terme, ce qui conduit à conjecturer : 
    $$\boxed{S=1-\frac{1}{n+1}=\frac{n}{n+1}}$$
     Pour $n=10$, la formule donne $S=\dfrac{10}{11}$, ce que l'on retrouve bien en calculant $1-\dfrac{1}{11}$.

    **5.** Le nombre $\dfrac{1}{n+1}$ est strictement positif quel que soit l'entier $n\geqslant 1$, donc $S=1-\dfrac{1}{n+1}$ est toujours strictement inférieur à $1$ : 
    $$\boxed{S\text{ ne peut ni valoir }1\text{, ni le dépasser}}$$
     En revanche, en prenant $n$ de plus en plus grand, $S$ s'approche autant que l'on veut de $1$.
- id: "s-01-42"
  feuille: "f-s-01"
  numero: 42
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fractions, nombres premiers et décomposition, puissances, racines carrées, rationnels et irrationnels]
  noeuds: [q-construction, z-premiers, n-operations, c-racine-reelle, q-irrationnel]
  notions: [ensemble-rationnels, nombre-premier]
  page_enonce: 11
  page_corrige: 21
  enonce: |
    On pose $a=2^{3}\times 3^{2}\times 5$ et $b=2^{2}\times 3\times 5^{2}\times 7$.

    **1.** Calculer $a$ et $b$.

    **2.** Sans effectuer la division, écrire la fraction $\dfrac{a}{b}$ sous forme irréductible en barrant les facteurs communs.

    **3.** Le nombre $a\times b$ est-il le carré d'un entier ? Justifier en examinant les exposants de sa décomposition.

    **4.** Déterminer le plus petit entier $k$ non nul tel que $a\times k$ soit le carré d'un entier.

    **5.** Le nombre $\sqrt{a}$ est-il rationnel ? Et $\sqrt{a\times 10}$ ? Justifier.

    **6.** Combien $b$ possède-t-il de diviseurs positifs ?
  corrige: |
    **1.** On effectue les produits : 
    $$a=2^{3}\times 3^{2}\times 5=8\times 9\times 5 \qquad b=2^{2}\times 3\times 5^{2}\times 7=4\times 3\times 25\times 7$$

    $$\boxed{a=360 \qquad\text{et}\qquad b=2\,100}$$

    **2.** Les facteurs communs sont $2^{2}$, $3$ et $5$ : 
    $$\frac{a}{b}=\frac{\cancel{2^{2}}\times 2\times\cancel{3}\times 3\times\cancel{5}} {\cancel{2^{2}}\times\cancel{3}\times\cancel{5}\times 5\times 7} =\frac{2\times 3}{5\times 7} \qquad\text{d'où}\qquad \boxed{\frac{a}{b}=\frac{6}{35}}$$
     On vérifie que $6=2\times 3$ et $35=5\times 7$ n'ont plus de facteur commun.

    **3.** On additionne les exposants de chaque facteur premier : 
    $$a\times b=2^{3+2}\times 3^{2+1}\times 5^{1+2}\times 7=2^{5}\times 3^{3}\times 5^{3}\times 7$$
     Les exposants $5$, $3$, $3$ et $1$ sont tous impairs. 
    $$\boxed{a\times b \text{ n'est pas un carré parfait.}}$$

    **4.** Dans $a=2^{3}\times 3^{2}\times 5$, les exposants impairs sont ceux de $2$ et de $5$ : 
    $$\boxed{k=2\times 5=10 \qquad\text{et}\qquad a\times 10=3\,600=60^{2}}$$

    **5.** Si $\sqrt{a}$ était rationnel, ce serait un entier $n$ vérifiant $n^{2}=a$, et $a$ serait un carré parfait — ce qu'il n'est pas, d'après la question 4. En revanche $a\times 10=3\,600=60^{2}$. 
    $$\boxed{\sqrt{a} \text{ est irrationnel, tandis que } \sqrt{a\times 10}=60 \text{ est un entier.}}$$

    **6.** On ajoute $1$ à chaque exposant de $b=2^{2}\times 3\times 5^{2}\times 7$, puis on multiplie : 
    $$\boxed{(2+1)\times(1+1)\times(2+1)\times(1+1)=3\times 2\times 3\times 2=36 \text{ diviseurs}}$$

