  page_corrige: 14
  enonce: |
    Pour chacun des nombres suivants, déterminer le plus petit ensemble parmi $\mathbb{N}$, $\mathbb{Z}$, $\mathbb{D}$, $\mathbb{Q}$ et $\mathbb{R}$ auquel il appartient. On justifiera en calculant d'abord une écriture simplifiée du nombre.

    **a)** $\sqrt{8}\times\sqrt{2}$

    **b)** $\left(1+\sqrt{3}\right)\left(1-\sqrt{3}\right)$

    **c)** $\dfrac{\sqrt{2}}{\sqrt{8}}$

    **d)** $\dfrac{2}{3}+\dfrac{1}{6}$

    **e)** $\left(2+\sqrt{2}\right)+\left(2-\sqrt{2}\right)$

    **f)** $\sqrt{2}\times\sqrt{3}$
  corrige: |
    On simplifie d'abord chaque écriture :

    **a)** $\sqrt{8}\times\sqrt{2}=\sqrt{16}=4$, donc ce nombre appartient à $\boxed{\mathbb{N}}$.

    **b)** $\left(1+\sqrt{3}\right)\left(1-\sqrt{3}\right)=1-\sqrt{3}+\sqrt{3}-3=-2$, donc ce nombre appartient à $\boxed{\mathbb{Z}}$.

    **c)** $\dfrac{\sqrt{2}}{\sqrt{8}}=\sqrt{\dfrac{2}{8}}=\sqrt{\dfrac{1}{4}}=\dfrac{1}{2}=0{,}5$, donc ce nombre appartient à $\boxed{\mathbb{D}}$.

    **d)** $\dfrac{2}{3}+\dfrac{1}{6}=\dfrac{4}{6}+\dfrac{1}{6}=\dfrac{5}{6}$. Le dénominateur de cette fraction irréductible n'est pas une puissance de $10$ simplifiable ($\frac{5}{6}=0{,}8333\ldots$), donc ce nombre appartient à $\boxed{\mathbb{Q}}$.

    **e)** $\left(2+\sqrt{2}\right)+\left(2-\sqrt{2}\right)=4$, donc ce nombre appartient à $\boxed{\mathbb{N}}$.

    **f)** $\sqrt{2}\times\sqrt{3}=\sqrt{6}$, qui est irrationnel, donc ce nombre appartient à $\boxed{\mathbb{R}}$ seulement.
- id: "s-01-29"
  feuille: "f-s-01"
  numero: 29
  partie: "Ensembles de nombres"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [fractions, racines carrées, rationnels et irrationnels]
  noeuds: [q-construction, c-racine-reelle, q-irrationnel]
  notions: [ensemble-rationnels]
  page_enonce: 8
  page_corrige: 14
  enonce: |
    On admet dans cet exercice que $\sqrt{2}$ est irrationnel.

    **1.** On souhaite démontrer que le nombre $3+\sqrt{2}$ est irrationnel. Pour cela, on raisonne par l'absurde en supposant que $3+\sqrt{2}$ est rationnel.

    **(a)** Justifier qu'il existe alors deux entiers $a$ et $b$, avec $b$ non nul, tels que $3+\sqrt{2}=\dfrac{a}{b}$.

    **(b)** En déduire une écriture de $\sqrt{2}$ sous la forme d'un quotient de deux entiers.

    **(c)** Conclure.

    **2.** En adaptant ce raisonnement, démontrer que $\dfrac{\sqrt{2}}{2}$ est irrationnel.

    **3.** Donner deux nombres irrationnels dont la somme est un entier. Que peut-on en conclure quant à l'affirmation 6. de l'exercice 26 ?
  corrige: |
    **1.** **(a)** Si $3+\sqrt{2}$ est rationnel, alors par définition d'un nombre rationnel, il s'écrit comme un quotient de deux entiers : il existe donc $a\in\mathbb{Z}$ et $b\in\mathbb{Z}^*$ tels que $3+\sqrt{2}=\dfrac{a}{b}$.

    **(b)** On isole alors $\sqrt{2}$ en réduisant au même dénominateur : 
    $$\sqrt{2}=\frac{a}{b}-3=\frac{a}{b}-\frac{3b}{b} \qquad\text{d'où}\qquad \boxed{\sqrt{2}=\frac{a-3b}{b}}$$

    **(c)** Or $a-3b$ est un entier relatif et $b$ est un entier non nul : l'égalité précédente signifie que $\sqrt{2}$ est un nombre rationnel, ce qui contredit l'hypothèse de l'énoncé. L'hypothèse de départ est donc fausse : 
    $$\boxed{3+\sqrt{2}\text{ est irrationnel}}$$

    **2.** On raisonne de la même façon par l'absurde : supposons que $\dfrac{\sqrt{2}}{2}$ soit rationnel. Il existe alors $a\in\mathbb{Z}$ et $b\in\mathbb{Z}^*$ tels que $\dfrac{\sqrt{2}}{2}=\dfrac{a}{b}$, et en multipliant par $2$ : 
    $$\sqrt{2}=\frac{2a}{b}$$
     Or $2a$ est un entier relatif et $b$ un entier non nul, donc $\sqrt{2}$ serait rationnel, ce qui est absurde : 
    $$\boxed{\frac{\sqrt{2}}{2}\text{ est irrationnel}}$$

    **3.** Les nombres $\sqrt{2}$ et $2-\sqrt{2}$ sont tous deux irrationnels (le second d'après un raisonnement identique à celui de la question 1.), et pourtant : 
    $$\boxed{\sqrt{2}+\left(2-\sqrt{2}\right)=2}$$
     La somme de deux irrationnels peut donc être un entier : cela confirme que l'affirmation 6. de l'exercice 26 est bien fausse.
