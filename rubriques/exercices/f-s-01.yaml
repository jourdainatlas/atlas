- id: "s-01-14"
  feuille: "f-s-01"
  numero: 14
  partie: "Puissances"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fractions, puissances, écriture scientifique]
  noeuds: [q-construction, n-operations]
  notions: [ensemble-rationnels]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Calculer les nombres suivants et donner le résultat en écriture scientifique : 
    $$A=\left(4\times 10^{5}\right)\times\left(3\times 10^{-8}\right) \qquad B=\frac{6\times 10^{7}}{1{,}5\times 10^{-2}} \qquad C=\left(2\times 10^{3}\right)^4 \qquad D=\left(3\times 10^{-4}\right)^2\times 5\times 10^{9}$$
  corrige: |
    On regroupe d'un côté les nombres décimaux, de l'autre les puissances de $10$, puis on ajuste l'écriture pour que le premier facteur soit compris entre $1$ et $10$ : 
    $$\begin{aligned} A &= (4\times 3)\times 10^{5+(-8)}=12\times 10^{-3}=1{,}2\times 10^{1}\times 10^{-3} & &\text{d'où}\quad \boxed{A=1{,}2\times 10^{-2}}\\[0.3em] B &= \frac{6}{1{,}5}\times 10^{7-(-2)} & &\text{d'où}\quad \boxed{B=4\times 10^{9}}\\[0.3em] C &= 2^4\times 10^{3\times 4}=16\times 10^{12} & &\text{d'où}\quad \boxed{C=1{,}6\times 10^{13}}\\[0.3em] D &= 9\times 10^{-8}\times 5\times 10^{9}=45\times 10^{1} & &\text{d'où}\quad \boxed{D=4{,}5\times 10^{2}} \end{aligned}$$
- id: "s-01-15"
  feuille: "f-s-01"
  numero: 15
  partie: "Puissances"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fractions, puissances]
  noeuds: [q-construction, n-operations]
  notions: [ensemble-rationnels]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Soient $a$ et $b$ deux nombres non nuls. Simplifier les expressions suivantes, de manière à n'écrire que des exposants positifs :

    **a)** $\dfrac{a^3b^{-2}}{a^{-1}b^{3}}$

    **b)** $\left(2a^2\right)^3\times 3a^{-4}$

    **c)** $\dfrac{\left(a^2b\right)^3}{\left(ab^2\right)^2}$

    **d)** $\left(5a^{-1}b^2\right)^{-2}$
  corrige: |
    On applique les règles de calcul sur les puissances, en n'oubliant pas que l'exposant extérieur s'applique à *chaque* facteur :

    **a)** $\dfrac{a^3b^{-2}}{a^{-1}b^{3}}=a^{3-(-1)}\times b^{-2-3}=a^4b^{-5}=\boxed{\dfrac{a^4}{b^5}}$

    **b)** $\left(2a^2\right)^3\times 3a^{-4}=2^3a^{6}\times 3a^{-4}=8\times 3\times a^{6-4}=\boxed{24a^2}$

    **c)** $\dfrac{\left(a^2b\right)^3}{\left(ab^2\right)^2}=\dfrac{a^6b^3}{a^2b^4}=a^{6-2}b^{3-4} =\boxed{\dfrac{a^4}{b}}$

    **d)** $\left(5a^{-1}b^2\right)^{-2}=5^{-2}\times a^{2}\times b^{-4}=\boxed{\dfrac{a^2}{25b^4}}$
- id: "s-01-16"
  feuille: "f-s-01"
  numero: 16
  partie: "Puissances"
  etoiles: 2
  types: [Calcul]
  mots_cles: [nombres premiers et décomposition, puissances, écriture scientifique]
  noeuds: [z-premiers, n-operations]
  notions: [nombre-premier]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    On donne les valeurs approchées suivantes : 
    $$\text{masse du Soleil}\approx 2\times 10^{30}\;\text{kg} \qquad ; \qquad \text{masse de la Terre}\approx 6\times 10^{24}\;\text{kg}$$

    $$\text{distance Terre-Soleil}\approx 1{,}5\times 10^{11}\;\text{m} \qquad ; \qquad \text{vitesse de la lumière}\approx 3\times 10^{8}\;\text{m}\cdot\text{s}^{-1}$$

    **1.** Combien de fois la masse du Soleil est-elle plus grande que celle de la Terre ? Donner le résultat en écriture scientifique, arrondi à l'unité près sur le premier facteur.

    **2.** Combien de temps la lumière du Soleil met-elle à nous parvenir ? Convertir le résultat en minutes et secondes.

    **3.** Une année-lumière est la distance parcourue par la lumière en une année. Sachant qu'une année compte environ $3{,}15\times 10^{7}$ secondes, exprimer une année-lumière en mètres, en écriture scientifique.

    **4.** À combien de distances Terre-Soleil une année-lumière correspond-elle ?
  corrige: |
    **1.** On calcule le quotient des deux masses : 
    $$\frac{2\times 10^{30}}{6\times 10^{24}}=\frac{2}{6}\times 10^{30-24}=0{,}333\ldots\times 10^{6} \approx 3{,}33\times 10^{5}$$

    $$\boxed{\text{le Soleil est environ }3\times 10^{5}\text{ fois plus lourd que la Terre}}$$

    **2.** On utilise la relation $t=\dfrac{d}{v}$ : 
    $$t=\frac{1{,}5\times 10^{11}}{3\times 10^{8}}=0{,}5\times 10^{3}=500\;\text{s}$$
     Or $500=8\times 60+20$, d'où : 
    $$\boxed{t=500\;\text{s},\text{ soit }8\text{ min }20\text{ s}}$$

    **3.** Une année-lumière est la distance $d=v\times t$ parcourue en une année : 
    $$d=3\times 10^{8}\times 3{,}15\times 10^{7}=9{,}45\times 10^{8+7}$$

    $$\boxed{1\text{ année-lumière}\approx 9{,}45\times 10^{15}\;\text{m}}$$

    **4.** On divise cette distance par la distance Terre-Soleil : 
    $$\frac{9{,}45\times 10^{15}}{1{,}5\times 10^{11}}=6{,}3\times 10^{4}$$

    $$\boxed{\text{une année-lumière vaut environ }63\,000\text{ fois la distance Terre-Soleil}}$$
- id: "s-01-17"
  feuille: "f-s-01"
  numero: 17
  partie: "Racines carrées"
  etoiles: 1
  types: [Calcul]
  mots_cles: [nombres premiers et décomposition, racines carrées]
  noeuds: [z-premiers, c-racine-reelle]
  notions: [nombre-premier]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Écrire chacun des nombres suivants sous la forme $a\sqrt{b}$, où $a$ et $b$ sont des entiers, $b$ étant le plus petit possible :

    **a)** $\sqrt{50}$

    **b)** $\sqrt{72}$

    **c)** $\sqrt{48}$

    **d)** $\sqrt{98}$

    **e)** $\sqrt{300}$

    **f)** $\sqrt{147}$

    **g)** $\sqrt{288}$

    **h)** $\sqrt{500}$

    **i)** $\sqrt{1\,008}$

    **j)** $\sqrt{2\,352}$

    Pour les deux derniers, on pourra s'appuyer sur la décomposition en facteurs premiers.
  corrige: |
    On cherche à chaque fois le plus grand carré parfait contenu dans le nombre sous la racine :

    **a)** $\sqrt{50}=\sqrt{25\times 2}=\sqrt{25}\times\sqrt{2}=\boxed{5\sqrt{2}}$

    **b)** $\sqrt{72}=\sqrt{36\times 2}=\boxed{6\sqrt{2}}$

    **c)** $\sqrt{48}=\sqrt{16\times 3}=\boxed{4\sqrt{3}}$

    **d)** $\sqrt{98}=\sqrt{49\times 2}=\boxed{7\sqrt{2}}$

    **e)** $\sqrt{300}=\sqrt{100\times 3}=\boxed{10\sqrt{3}}$

    **f)** $\sqrt{147}=\sqrt{49\times 3}=\boxed{7\sqrt{3}}$

    **g)** $\sqrt{288}=\sqrt{144\times 2}=\boxed{12\sqrt{2}}$

    **h)** $\sqrt{500}=\sqrt{100\times 5}=\boxed{10\sqrt{5}}$

    Pour les deux derniers, le plus grand carré ne se devine pas : on passe par la décomposition en facteurs premiers, en sortant chaque facteur présent en nombre *pair*. 
    $$1\,008=2^{4}\times 3^{2}\times 7 \qquad\text{donc}\qquad \sqrt{1\,008}=2^{2}\times 3\times\sqrt{7}=\boxed{12\sqrt{7}}$$

    $$2\,352=2^{4}\times 3\times 7^{2} \qquad\text{donc}\qquad \sqrt{2\,352}=2^{2}\times 7\times\sqrt{3}=\boxed{28\sqrt{3}}$$
     Un facteur d'exposant pair sort entièrement de la racine, en divisant son exposant par $2$ ; un facteur d'exposant impair y laisse un exemplaire.
- id: "s-01-18"
  feuille: "f-s-01"
  numero: 18
  partie: "Racines carrées"
  etoiles: 1
  types: [Calcul]
  mots_cles: [racines carrées]
  noeuds: [c-racine-reelle]
  notions: []
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Écrire les nombres suivants sous la forme $a\sqrt{b}$ la plus simple possible : 
    $$A=\sqrt{50}-\sqrt{18}+\sqrt{8} \qquad B=3\sqrt{12}+\sqrt{27}-\sqrt{75} \qquad C=\sqrt{45}+2\sqrt{20}-\sqrt{80} \qquad D=\sqrt{98}-2\sqrt{50}+3\sqrt{2}$$

    $$E=2\sqrt{1\,008}-3\sqrt{112}+\sqrt{343} \qquad F=\sqrt{720}-\sqrt{245}+\sqrt{180}$$
  corrige: |
    On commence par simplifier chaque racine, puis on regroupe les termes semblables : 
    $$\begin{aligned} A &= 5\sqrt{2}-3\sqrt{2}+2\sqrt{2}=(5-3+2)\sqrt{2} & &\text{d'où}\quad \boxed{A=4\sqrt{2}}\\[0.3em] B &= 3\times 2\sqrt{3}+3\sqrt{3}-5\sqrt{3}=(6+3-5)\sqrt{3} & &\text{d'où}\quad \boxed{B=4\sqrt{3}}\\[0.3em] C &= 3\sqrt{5}+2\times 2\sqrt{5}-4\sqrt{5}=(3+4-4)\sqrt{5} & &\text{d'où}\quad \boxed{C=3\sqrt{5}}\\[0.3em] D &= 7\sqrt{2}-2\times 5\sqrt{2}+3\sqrt{2}=(7-10+3)\sqrt{2} & &\text{d'où}\quad \boxed{D=0} \end{aligned}$$

    Pour $E$ et $F$, on décompose d'abord chaque nombre sous la racine : 
    $$1\,008=2^{4}\times 3^{2}\times 7 \quad;\quad 112=2^{4}\times 7 \quad;\quad 343=7^{3}$$

    $$720=2^{4}\times 3^{2}\times 5 \quad;\quad 245=5\times 7^{2} \quad;\quad 180=2^{2}\times 3^{2}\times 5$$

    $$\begin{aligned} E &= 2\times 12\sqrt{7}-3\times 4\sqrt{7}+7\sqrt{7}=(24-12+7)\sqrt{7} & &\text{d'où}\quad \boxed{E=19\sqrt{7}}\\[0.3em] F &= 12\sqrt{5}-7\sqrt{5}+6\sqrt{5}=(12-7+6)\sqrt{5} & &\text{d'où}\quad \boxed{F=11\sqrt{5}} \end{aligned}$$
     Les trois racines de $E$ se ramènent toutes à $\sqrt{7}$, et celles de $F$ à $\sqrt{5}$ : c'est ce qui permet de regrouper les termes.
- id: "s-01-19"
  feuille: "f-s-01"
  numero: 19
  partie: "Racines carrées"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fractions, racines carrées]
  noeuds: [q-construction, c-racine-reelle]
  notions: [ensemble-rationnels]
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Calculer les nombres suivants, et préciser à chaque fois s'il s'agit d'un entier :

    **a)** $\sqrt{3}\times\sqrt{12}$

    **b)** $\sqrt{8}\times\sqrt{18}$

    **c)** $\dfrac{\sqrt{27}}{\sqrt{3}}$

    **d)** $\left(2\sqrt{5}\right)^2$

    **e)** $\sqrt{\dfrac{45}{5}}$

    **f)** $\sqrt{6}\times\sqrt{10}$

    **g)** $\sqrt{2}\times\sqrt{3}\times\sqrt{6}$

    **h)** $\dfrac{\sqrt{50}\times\sqrt{8}}{\sqrt{4}}$

    **i)** $\left(3\sqrt{2}\right)^2\times\dfrac{\sqrt{2}}{\sqrt{8}}$
  corrige: |
    On utilise la propriété $\sqrt{a}\times\sqrt{b}=\sqrt{a\times b}$ :

    **a)** $\sqrt{3}\times\sqrt{12}=\sqrt{36}=\boxed{6}$ : entier.

    **b)** $\sqrt{8}\times\sqrt{18}=\sqrt{144}=\boxed{12}$ : entier.

    **c)** $\dfrac{\sqrt{27}}{\sqrt{3}}=\sqrt{\dfrac{27}{3}}=\sqrt{9}=\boxed{3}$ : entier.

    **d)** $\left(2\sqrt{5}\right)^2=2^2\times\left(\sqrt{5}\right)^2=4\times 5=\boxed{20}$ : entier.

    **e)** $\sqrt{\dfrac{45}{5}}=\sqrt{9}=\boxed{3}$ : entier.

    **f)** $\sqrt{6}\times\sqrt{10}=\sqrt{60}=\sqrt{4\times 15}=\boxed{2\sqrt{15}}$ : **pas** un entier.

    **g)** $\sqrt{2}\times\sqrt{3}\times\sqrt{6}=\sqrt{36}=\boxed{6}$ : entier.

    **h)** $\dfrac{\sqrt{50}\times\sqrt{8}}{\sqrt{4}}=\dfrac{\sqrt{400}}{2}=\dfrac{20}{2}=\boxed{10}$ : entier.

    **i)** $\left(3\sqrt{2}\right)^2\times\dfrac{\sqrt{2}}{\sqrt{8}}=18\times\sqrt{\dfrac{2}{8}} =18\times\dfrac{1}{2}=\boxed{9}$ : entier.

    Dans **i)**, les trois racines se regroupent en une seule : $2\times 3\times 6=36$. Dans **k)**, on traite séparément le carré, qui vaut $3^2\times 2=18$, et le quotient de racines, qui vaut $\sqrt{\frac{1}{4}}=\frac{1}{2}$.
- id: "s-01-20"
  feuille: "f-s-01"
  numero: 20
  partie: "Racines carrées"
  etoiles: 2
  types: [Vrai ou faux]
  mots_cles: [racines carrées]
  noeuds: [c-racine-reelle]
  notions: []
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Pour chacune des affirmations suivantes, dire si elle est vraie ou fausse, en justifiant par une démonstration ou par un contre-exemple :

    **1.** Pour tout nombre réel $x$, $\sqrt{x^2}=x$.

    **2.** Si $x^2=5$, alors $x=\sqrt{5}$.

    **3.** Le nombre $\left(\sqrt{3}+\sqrt{5}\right)^2$ est un entier.

    **4.** Le nombre $\sqrt{2}\times\sqrt{18}$ est un entier.

    **5.** Le nombre $\left(\sqrt{5}-2\right)\left(\sqrt{5}+2\right)$ est un entier.

    **6.** Pour tout nombre positif $a$, on a $\sqrt{a}\leqslant a$.

    **7.** Il existe un nombre positif $a$, différent de $0$ et de $1$, tel que $\sqrt{a}=a$.

    **8.** Le nombre $\sqrt{50}-\sqrt{18}-\sqrt{8}$ est nul.

    **9.** Pour tous nombres réels positifs $a$ et $b$, $\sqrt{a+b}\leqslant\sqrt{a}+\sqrt{b}$.

    Pour les affirmations 7. et 9., on pourra élever au carré.
  corrige: |
    **1.** **Fausse** : pour $x=-3$, on a $\sqrt{(-3)^2}=\sqrt{9}=3$, qui est différent de $-3$. Une racine carrée est toujours positive : on a en réalité $\sqrt{x^2}=|x|$, donc l'égalité n'est vraie que pour $x\geqslant 0$.

    **2.** **Fausse** : le nombre $-\sqrt{5}$ vérifie aussi $\left(-\sqrt{5}\right)^2=5$. L'équation $x^2=5$ possède *deux* solutions, $\sqrt{5}$ et $-\sqrt{5}$.

    **3.** **Fausse** : la double distributivité donne $\left(\sqrt{3}+\sqrt{5}\right)^2=3+2\sqrt{3}\times\sqrt{5}+5=8+2\sqrt{15}$. Comme $\sqrt{15}$ n'est pas un entier — car $3^2=9<15<16=4^2$ —, le résultat n'en est pas un.

    **4.** **Vraie** : la racine carrée traverse les produits, donc $\sqrt{2}\times\sqrt{18}=\sqrt{36}=6$. C'est un entier, bien qu'aucun des deux facteurs n'en soit un.

    **5.** **Vraie** : la double distributivité donne 
    $$\left(\sqrt{5}-2\right)\left(\sqrt{5}+2\right)=5+2\sqrt{5}-2\sqrt{5}-4=5-4=1$$
     Les deux termes du milieu s'éliminent, et le résultat est bien un entier, alors qu'aucun des deux facteurs n'en est un.

    **6.** **Fausse** : la propriété est vraie pour $a\geqslant 1$, mais fausse pour les nombres compris strictement entre $0$ et $1$. Avec $a=\dfrac{1}{4}$ : 
    $$\sqrt{a}=\frac{1}{2} \qquad\text{alors que}\qquad a=\frac{1}{4}$$
     et $\dfrac{1}{2}>\dfrac{1}{4}$. Prendre la racine carrée d'un nombre plus petit que $1$ l'*augmente*.

    **7.** **Fausse** : supposons $\sqrt{a}=a$ avec $a$ positif. En élevant au carré, $a=a^2$, donc $a^2-a=0$, c'est-à-dire $a\times(a-1)=0$. Un produit est nul lorsque l'un de ses facteurs l'est, donc $a=0$ ou $a=1$. 
    $$\boxed{\text{Les seuls nombres positifs vérifiant } \sqrt{a}=a \text{ sont } 0 \text{ et } 1.}$$

    **8.** **Vraie** : on simplifie chaque racine avant de conclure. 
    $$\sqrt{50}=5\sqrt{2} \qquad \sqrt{18}=3\sqrt{2} \qquad \sqrt{8}=2\sqrt{2}$$

    $$\text{donc}\qquad \sqrt{50}-\sqrt{18}-\sqrt{8}=5\sqrt{2}-3\sqrt{2}-2\sqrt{2}=0$$

    **9.** **Vraie** : les deux membres étant positifs, comparons leurs carrés. 
    $$\left(\sqrt{a}+\sqrt{b}\right)^2=a+2\sqrt{a}\sqrt{b}+b=(a+b)+2\sqrt{ab}$$
     Comme $2\sqrt{ab}\geqslant 0$, ce carré est supérieur ou égal à $a+b=\left(\sqrt{a+b}\right)^2$. Deux nombres positifs étant rangés comme leurs carrés, on conclut. 
    $$\boxed{\sqrt{a+b}\leqslant\sqrt{a}+\sqrt{b}, \text{ avec égalité si et seulement si } a=0 \text{ ou } b=0.}$$

    **À retenir.** Les affirmations 3., 4. et 5. montrent qu'il ne faut jamais conclure sur la nature d'un nombre avant de l'avoir simplifié : $\sqrt{2}\times\sqrt{18}$ a l'air d'un nombre compliqué et vaut $6$, tandis que $\left(\sqrt{3}+\sqrt{5}\right)^2$ a l'air d'un entier et n'en est pas un.
- id: "s-01-21"
  feuille: "f-s-01"
  numero: 21
  partie: "Racines carrées"
  etoiles: 2
  types: [Calcul]
  mots_cles: [racines carrées]
  noeuds: [c-racine-reelle]
  notions: []
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Développer et réduire les expressions suivantes : 
    $$A=\sqrt{3}\left(\sqrt{12}+5\right) \qquad B=2\sqrt{5}\left(3\sqrt{5}-\sqrt{20}\right) \qquad C=\sqrt{2}\left(\sqrt{8}-\sqrt{18}+3\sqrt{2}\right)$$

    $$P=\sqrt{6}\left(\sqrt{3}+\sqrt{2}\right)-\sqrt{2}\left(\sqrt{12}-\sqrt{3}\right) \qquad D=\left(\sqrt{2}+3\right)\left(\sqrt{8}-1\right)$$

    $$E=\left(2\sqrt{3}-1\right)\left(\sqrt{3}+4\right) \qquad F=\left(\sqrt{5}+2\right)\left(\sqrt{5}-3\right) \qquad G=\left(3\sqrt{2}-\sqrt{5}\right)\left(\sqrt{2}+2\sqrt{5}\right)$$

    $$N=\left(\sqrt{5}-2\sqrt{3}\right)\left(2\sqrt{5}+\sqrt{3}\right) \qquad Q=\left(\sqrt{3}+2\sqrt{2}\right)\left(2\sqrt{3}-\sqrt{2}\right)$$
  corrige: |
    On utilise la distributivité, sous ses deux formes, ainsi que la règle $\sqrt{a}\times\sqrt{b}=\sqrt{ab}$ : 
    $$k(a+b)=ka+kb \qquad\text{et}\qquad (a+b)(c+d)=ac+ad+bc+bd$$

    $$\begin{aligned} A &= \sqrt{3}\times\sqrt{12}+\sqrt{3}\times 5=\sqrt{36}+5\sqrt{3} & &\text{d'où}\quad \boxed{A=6+5\sqrt{3}}\\[0.4em] B &= 2\sqrt{5}\times 3\sqrt{5}-2\sqrt{5}\times\sqrt{20}=6\times 5-2\sqrt{100}=30-20 & &\text{d'où}\quad \boxed{B=10}\\[0.4em] C &= \sqrt{16}-\sqrt{36}+3\times 2=4-6+6 & &\text{d'où}\quad \boxed{C=4}\\[0.4em] P &= \sqrt{18}+\sqrt{12}-\left(\sqrt{24}-\sqrt{6}\right)=3\sqrt{2}+2\sqrt{3}-2\sqrt{6}+\sqrt{6} & &\text{d'où}\quad \boxed{P=3\sqrt{2}+2\sqrt{3}-\sqrt{6}}\\[0.4em] D &= \sqrt{2}\times\sqrt{8}-\sqrt{2}+3\sqrt{8}-3=\sqrt{16}-\sqrt{2}+3\times 2\sqrt{2}-3\\ &= 4-\sqrt{2}+6\sqrt{2}-3 & &\text{d'où}\quad \boxed{D=1+5\sqrt{2}}\\[0.4em] E &= 2\sqrt{3}\times\sqrt{3}+2\sqrt{3}\times 4-\sqrt{3}-4=2\times 3+8\sqrt{3}-\sqrt{3}-4\\ &= 6+7\sqrt{3}-4 & &\text{d'où}\quad \boxed{E=2+7\sqrt{3}}\\[0.4em] F &= 5-3\sqrt{5}+2\sqrt{5}-6 & &\text{d'où}\quad \boxed{F=-1-\sqrt{5}}\\[0.4em] G &= 3\times 2+6\sqrt{10}-\sqrt{10}-2\times 5=6+5\sqrt{10}-10 & &\text{d'où}\quad \boxed{G=-4+5\sqrt{10}}\\[0.4em] N &= 2\times 5+\sqrt{15}-4\sqrt{15}-2\times 3=10-3\sqrt{15}-6 & &\text{d'où}\quad \boxed{N=4-3\sqrt{15}}\\[0.4em] Q &= 2\times 3-\sqrt{6}+4\sqrt{6}-2\times 2=6+3\sqrt{6}-4 & &\text{d'où}\quad \boxed{Q=2+3\sqrt{6}} \end{aligned}$$

    Pour $B$, on prendra garde au signe : le facteur $2\sqrt{5}$ multiplie *les deux* termes de la parenthèse, y compris celui qui est précédé du signe moins. Pour $P$, le signe moins devant la seconde parenthèse change les deux signes qu'elle contient.

    Dans $G$, $N$ et $Q$, les quatre produits font intervenir des coefficients *devant* les racines : on multiplie séparément les nombres et les racines, par exemple $3\sqrt{2}\times 2\sqrt{5}=6\sqrt{10}$.
- id: "s-01-22"
  feuille: "f-s-01"
  numero: 22
  partie: "Racines carrées"
  etoiles: 2
  types: [Calcul]
  mots_cles: [racines carrées]
  noeuds: [c-racine-reelle]
  notions: []
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Développer et réduire les expressions suivantes : 
    $$H=\left(1+\sqrt{2}\right)^2 \qquad I=\left(3-\sqrt{5}\right)\left(3+\sqrt{5}\right) \qquad J=\left(\sqrt{7}+\sqrt{2}\right)\left(\sqrt{7}-\sqrt{2}\right)$$

    $$K=\left(\sqrt{3}+1\right)^2-\left(\sqrt{3}-1\right)^2 \qquad L=\left(\sqrt{2}+1\right)\left(\sqrt{2}-1\right)\left(\sqrt{5}+2\right)$$

    $$M=\left(2\sqrt{3}-\sqrt{2}\right)^2+\left(2\sqrt{3}+\sqrt{2}\right)^2$$
  corrige: |
    Un carré est un produit : $\left(a+b\right)^2=\left(a+b\right)\left(a+b\right)$, et l'on développe donc encore par double distributivité.

    $$\begin{aligned} H &= 1\times 1+1\times\sqrt{2}+\sqrt{2}\times 1+\sqrt{2}\times\sqrt{2}=1+\sqrt{2}+\sqrt{2}+2 & &\text{d'où}\quad \boxed{H=3+2\sqrt{2}}\\[0.4em] I &= 9+3\sqrt{5}-3\sqrt{5}-5 & &\text{d'où}\quad \boxed{I=4}\\[0.4em] J &= 7-\sqrt{14}+\sqrt{14}-2 & &\text{d'où}\quad \boxed{J=5} \end{aligned}$$

    Dans $I$ et $J$, les deux termes du milieu s'éliminent : le résultat est un entier, alors que les deux facteurs contenaient des racines.

    Pour les trois dernières expressions, on développe chaque morceau séparément *avant* de réduire.

    $$\begin{aligned} K &= \left(4+2\sqrt{3}\right)-\left(4-2\sqrt{3}\right)=4+2\sqrt{3}-4+2\sqrt{3} & &\text{d'où}\quad \boxed{K=4\sqrt{3}}\\[0.4em] L &= \underbrace{\left(\sqrt{2}+1\right)\left(\sqrt{2}-1\right)}_{=\,2-1\,=\,1}\times\left(\sqrt{5}+2\right) & &\text{d'où}\quad \boxed{L=\sqrt{5}+2}\\[0.4em] M &= \left(12-4\sqrt{6}+2\right)+\left(12+4\sqrt{6}+2\right)=14-4\sqrt{6}+14+4\sqrt{6} & &\text{d'où}\quad \boxed{M=28} \end{aligned}$$

    Dans $K$ et $M$, les termes en $\sqrt{3}$ et en $\sqrt{6}$ se simplifient entre eux à la fin. Dans $L$, le produit des deux premiers facteurs vaut $1$ : il ne reste plus rien à développer.
- id: "s-01-23"
  feuille: "f-s-01"
  numero: 23
  partie: "Racines carrées"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fractions, racines carrées]
  noeuds: [q-construction, c-racine-reelle]
  notions: [ensemble-rationnels]
  page_enonce: 6
  page_corrige: 11
  enonce: |
    Le but de l'exercice est d'écrire les nombres suivants sans racine carrée au dénominateur.

    **1.** Écrire $\dfrac{1}{\sqrt{3}}$ et $\dfrac{5}{2\sqrt{5}}$ sans racine carrée au dénominateur, en multipliant le numérateur et le dénominateur par un même nombre bien choisi.

    **2.** Vérifier que $\left(1+\sqrt{2}\right)\left(\sqrt{2}-1\right)=1$.

    **3.** En s'inspirant de la question précédente, écrire $\dfrac{2}{1+\sqrt{2}}$ puis $\dfrac{3}{\sqrt{5}-\sqrt{2}}$ sans racine carrée au dénominateur.
  corrige: |
    **1.** On multiplie le numérateur et le dénominateur par la racine présente au dénominateur : 
    $$\frac{1}{\sqrt{3}}=\frac{1\times\sqrt{3}}{\sqrt{3}\times\sqrt{3}}=\frac{\sqrt{3}}{3} \qquad ; \qquad \frac{5}{2\sqrt{5}}=\frac{5\sqrt{5}}{2\times 5}=\frac{5\sqrt{5}}{10}$$

    $$\boxed{\frac{1}{\sqrt{3}}=\frac{\sqrt{3}}{3} \qquad\text{et}\qquad \frac{5}{2\sqrt{5}}=\frac{\sqrt{5}}{2}}$$

    **2.** On développe le produit par double distributivité : 
    $$\begin{aligned} \left(1+\sqrt{2}\right)\left(\sqrt{2}-1\right) &= 1\times\sqrt{2}-1\times 1+\sqrt{2}\times\sqrt{2}-\sqrt{2}\times 1\\ &= \sqrt{2}-1+2-\sqrt{2} \end{aligned}$$

    $$\boxed{\left(1+\sqrt{2}\right)\left(\sqrt{2}-1\right)=1}$$

    **3.** D'après la question précédente, multiplier par $\left(\sqrt{2}-1\right)$ fait disparaître la racine du dénominateur : 
    $$\frac{2}{1+\sqrt{2}}=\frac{2\left(\sqrt{2}-1\right)}{\left(1+\sqrt{2}\right)\left(\sqrt{2}-1\right)} =\frac{2\left(\sqrt{2}-1\right)}{1} \qquad\text{d'où}\qquad \boxed{\frac{2}{1+\sqrt{2}}=2\sqrt{2}-2}$$
     On procède de même en multipliant par $\left(\sqrt{5}+\sqrt{2}\right)$ : en développant le nouveau dénominateur, les deux termes du milieu s'éliminent. 
    $$\left(\sqrt{5}-\sqrt{2}\right)\left(\sqrt{5}+\sqrt{2}\right) =5+\sqrt{10}-\sqrt{10}-2=3$$

    $$\frac{3}{\sqrt{5}-\sqrt{2}}=\frac{3\left(\sqrt{5}+\sqrt{2}\right)} {\left(\sqrt{5}-\sqrt{2}\right)\left(\sqrt{5}+\sqrt{2}\right)} =\frac{3\left(\sqrt{5}+\sqrt{2}\right)}{3}$$

    $$\boxed{\frac{3}{\sqrt{5}-\sqrt{2}}=\sqrt{5}+\sqrt{2}}$$
- id: "s-01-24"
  feuille: "f-s-01"
  numero: 24
  partie: "Racines carrées"
  etoiles: 2
  types: [Calcul]
  mots_cles: [racines carrées]
  noeuds: [c-racine-reelle]
  notions: []
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Un rectangle $ABCD$ a pour longueur $\sqrt{50}$ cm et pour largeur $2\sqrt{2}$ cm.

    **1.** Écrire la longueur sous la forme $a\sqrt{2}$.

    **2.** Calculer le périmètre du rectangle sous la forme $a\sqrt{2}$, puis en donner une valeur arrondie au dixième.

    **3.** Calculer l'aire du rectangle. Que remarque-t-on ?

    **4.** Calculer la longueur exacte de la diagonale $[AC]$, puis la simplifier si possible.
  corrige: |
    **1.** On extrait le plus grand carré parfait : 
    $$\sqrt{50}=\sqrt{25\times 2}=\boxed{5\sqrt{2}}$$

    **2.** Le périmètre d'un rectangle vaut $2\times(\text{longueur}+\text{largeur})$ : 
    $$P=2\left(5\sqrt{2}+2\sqrt{2}\right)=2\times 7\sqrt{2}$$

    $$\boxed{P=14\sqrt{2}\;\text{cm}\approx 19{,}8\;\text{cm}}$$

    **3.** L'aire vaut le produit de la longueur par la largeur : 
    $$\mathcal{A}=5\sqrt{2}\times 2\sqrt{2}=10\times\left(\sqrt{2}\right)^2=10\times 2$$

    $$\boxed{\mathcal{A}=20\;\text{cm}^2}$$
     On remarque que, bien que les deux côtés s'écrivent à l'aide de racines carrées, l'aire est un nombre entier.

    **4.** Le triangle $ABC$ étant rectangle en $B$, le théorème de Pythagore donne : 
    $$AC^2=AB^2+BC^2=\left(5\sqrt{2}\right)^2+\left(2\sqrt{2}\right)^2=50+8=58$$
     Or $58=2\times 29$ ne contient aucun carré parfait autre que $1$ : 
    $$\boxed{AC=\sqrt{58}\;\text{cm}\approx 7{,}6\;\text{cm}}$$
- id: "s-01-25"
  feuille: "f-s-01"
  numero: 25
  partie: "Ensembles de nombres"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fractions, puissances, écriture scientifique, racines carrées, rationnels et irrationnels, ensembles de nombres]
  noeuds: [q-construction, n-operations, c-racine-reelle, q-irrationnel, r]
  notions: [ensemble-rationnels, ensemble-reels]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Recopier et compléter le tableau suivant en cochant les cases correspondant aux ensembles auxquels chaque nombre appartient :

    ```tableau
     ¦ $\mathbb{N}$ ¦ $\mathbb{Z}$ ¦ $\mathbb{D}$ ¦ $\mathbb{Q}$ ¦ $\mathbb{R}$
    $-7$ ¦  ¦  ¦  ¦  ¦ 
    $\dfrac{3}{4}$ ¦  ¦  ¦  ¦  ¦ 
    $\dfrac{-12}{3}$ ¦  ¦  ¦  ¦  ¦ 
    $\sqrt{16}$ ¦  ¦  ¦  ¦  ¦ 
    $\sqrt{3}$ ¦  ¦  ¦  ¦  ¦ 
    $\dfrac{7}{3}$ ¦  ¦  ¦  ¦  ¦ 
    $10^{-2}$ ¦  ¦  ¦  ¦  ¦ 
    $-\pi$ ¦  ¦  ¦  ¦  ¦ 
    $\left(\sqrt{2}\right)^2$ ¦  ¦  ¦  ¦  ¦ 
    ```
  corrige: |
    On simplifie d'abord chaque écriture, puisque c'est la *valeur* du nombre qui décide, et non son apparence : $\dfrac{-12}{3}=-4$, $\sqrt{16}=4$, $10^{-2}=0{,}01$ et $\left(\sqrt{2}\right)^2=2$.

    ```tableau
     ¦ $\mathbb{N}$ ¦ $\mathbb{Z}$ ¦ $\mathbb{D}$ ¦ $\mathbb{Q}$ ¦ $\mathbb{R}$
    $-7$ ¦  ¦ $\checkmark$ ¦ $\checkmark$ ¦ $\checkmark$ ¦ $\checkmark$
    $\dfrac{3}{4}=0{,}75$ ¦  ¦  ¦ $\checkmark$ ¦ $\checkmark$ ¦ $\checkmark$
    $\dfrac{-12}{3}=-4$ ¦  ¦ $\checkmark$ ¦ $\checkmark$ ¦ $\checkmark$ ¦ $\checkmark$
    $\sqrt{16}=4$ ¦ $\checkmark$ ¦ $\checkmark$ ¦ $\checkmark$ ¦ $\checkmark$ ¦ $\checkmark$
    $\sqrt{3}$ ¦  ¦  ¦  ¦  ¦ $\checkmark$
    $\dfrac{7}{3}$ ¦  ¦  ¦  ¦ $\checkmark$ ¦ $\checkmark$
    $10^{-2}=0{,}01$ ¦  ¦  ¦ $\checkmark$ ¦ $\checkmark$ ¦ $\checkmark$
    $-\pi$ ¦  ¦  ¦  ¦  ¦ $\checkmark$
    $\left(\sqrt{2}\right)^2=2$ ¦ $\checkmark$ ¦ $\checkmark$ ¦ $\checkmark$ ¦ $\checkmark$ ¦ $\checkmark$
    ```

    On remarque que les croix se propagent toujours vers la droite, ce qui traduit les inclusions : 
    $$\mathbb{N}\subset\mathbb{Z}\subset\mathbb{D}\subset\mathbb{Q}\subset\mathbb{R}$$
- id: "s-01-26"
  feuille: "f-s-01"
  numero: 26
  partie: "Ensembles de nombres"
  etoiles: 1
  types: [Calcul]
  mots_cles: [nombres premiers et décomposition, rationnels et irrationnels, ensembles de nombres]
  noeuds: [z-premiers, q-irrationnel, r]
  notions: [nombre-premier, ensemble-rationnels, ensemble-reels]
  page_enonce: 7
  page_corrige: 13
  enonce: |
    Pour chacune des affirmations suivantes, dire si elle est toujours vraie. Si elle est fausse, donner un contre-exemple.

    **1.** Tout entier naturel est un nombre décimal.

    **2.** Tout nombre décimal est un nombre rationnel.

    **3.** Tout nombre rationnel est un nombre décimal.

    **4.** Si $x\in\mathbb{Z}$, alors $-x\in\mathbb{N}$.

    **5.** Le nombre $\pi$ appartient à $\mathbb{R}$ mais pas à $\mathbb{Q}$.

    **6.** La somme de deux nombres irrationnels est toujours irrationnelle.

    **7.** La différence de deux nombres entiers naturels est un entier naturel.

    **8.** Le quotient de deux nombres décimaux est un nombre décimal.

    **9.** Le quotient de deux nombres réels est un nombre rationnel.

    **10.** Le produit d'un nombre rationnel par un nombre entier relatif est un nombre rationnel.

    **11.** Le quotient de deux nombres premiers distincts peut être un entier relatif.

    **12.** Le quotient de deux nombres premiers distincts peut être un nombre décimal.

    Répondre enfin aux deux questions suivantes :

    **a)** Trouver deux nombres irrationnels différents dont le produit est un nombre irrationnel.

    **b)** Trouver deux nombres irrationnels différents dont le produit est un entier naturel.
  corrige: |
    **1.** **Vraie** : un entier naturel $n$ s'écrit $n=\dfrac{n}{10^0}$, son écriture décimale s'arrête donc immédiatement.

    **2.** **Vraie** : un décimal s'écrit $\dfrac{a}{10^n}$ avec $a\in\mathbb{Z}$, et $10^n$ est un entier non nul : c'est donc bien un quotient de deux entiers.

    **3.** **Fausse** : le nombre $\dfrac{1}{3}=0{,}333\ldots$ est rationnel, mais son écriture décimale ne s'arrête jamais : il n'est pas décimal.

    **4.** **Fausse** : pour $x=5\in\mathbb{Z}$, on a $-x=-5$, qui n'appartient pas à $\mathbb{N}$.

    **5.** **Vraie** : $\pi$ est repérable sur la droite graduée donc $\pi\in\mathbb{R}$, mais c'est un nombre irrationnel : son écriture décimale est infinie et non périodique.

    **6.** **Fausse** : $\sqrt{2}$ et $-\sqrt{2}$ sont irrationnels, mais $\sqrt{2}+\left(-\sqrt{2}\right)=0$, qui est un entier.

    **7.** **Fausse** : $3$ et $5$ sont des entiers naturels, mais $3-5=-2$ n'appartient pas à $\mathbb{N}$.

    **8.** **Fausse** : $1$ et $3$ sont des nombres décimaux, mais $\dfrac{1}{3}=0{,}333\ldots$ n'est pas décimal.

    **9.** **Fausse** : $\sqrt{2}$ et $1$ sont des nombres réels, mais $\dfrac{\sqrt{2}}{1}=\sqrt{2}$ est irrationnel.

    **10.** **Vraie** : soit $\dfrac{a}{b}$ un rationnel (avec $a\in\mathbb{Z}$, $b\in\mathbb{Z}^*$) et $k\in\mathbb{Z}$. Alors $\dfrac{a}{b}\times k=\dfrac{a\times k}{b}$, qui est bien un quotient de deux entiers avec $b\neq 0$.

    **11.** **Fausse** : soient $p$ et $q$ deux nombres premiers distincts. Si $\dfrac{p}{q}$ était un entier $k$, on aurait $p=k\times q$, donc $q$ serait un diviseur de $p$. Or les seuls diviseurs positifs de $p$ sont $1$ et $p$ : comme $q$ est premier, $q\neq 1$, et comme les deux nombres sont distincts, $q\neq p$. C'est donc impossible.

    **12.** **Vraie** : $2$ et $5$ sont deux nombres premiers distincts, et $\dfrac{2}{5}=0{,}4$ est bien un nombre décimal.

    **a)** Les nombres $\sqrt{2}$ et $\sqrt{3}$ conviennent, car $\sqrt{2}\times\sqrt{3}=\sqrt{6}$, qui est irrationnel : 
    $$\boxed{\sqrt{2}\times\sqrt{3}=\sqrt{6}}$$

    **b)** Les nombres $\sqrt{2}$ et $\sqrt{8}$ conviennent, car ils sont bien différents et : 
    $$\boxed{\sqrt{2}\times\sqrt{8}=\sqrt{16}=4}$$

    Ces deux questions montrent que le produit de deux irrationnels peut être aussi bien irrationnel que rationnel : on ne peut rien affirmer en général.
- id: "s-01-27"
  feuille: "f-s-01"
  numero: 27
  partie: "Ensembles de nombres"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fractions, ensembles de nombres, écriture décimale périodique]
  noeuds: [q-construction, r, q]
  notions: [ensemble-rationnels, ensemble-reels]
  page_enonce: 7
  page_corrige: 13
  enonce: |
    On considère le nombre $x=0{,}777\ldots$, dont l'écriture décimale est infinie et périodique.

    **1.** Calculer $10x$, puis $10x-x$. En déduire l'écriture de $x$ sous forme de fraction.

    **2.** En procédant de la même manière avec $100y$, écrire $y=0{,}272727\ldots$ sous forme d'une fraction irréductible.

    **3.** Écrire de même $z=1{,}2333\ldots$ sous forme d'une fraction irréductible. *(On pourra calculer $100z-10z$.)*

    **4.** À quel ensemble de nombres ces trois nombres appartiennent-ils ?
  corrige: |
    **1.** Multiplier par $10$ décale la virgule d'un rang, sans changer la partie qui se répète : 
    $$10x=7{,}777\ldots \qquad\text{donc}\qquad 10x-x=7{,}777\ldots-0{,}777\ldots=7$$
     Or $10x-x=9x$, d'où $9x=7$ : 
    $$\boxed{x=\frac{7}{9}}$$

    **2.** Ici c'est un bloc de deux chiffres qui se répète, on multiplie donc par $100$ : 
    $$100y=27{,}2727\ldots \qquad\text{donc}\qquad 100y-y=27 \qquad\text{soit}\qquad 99y=27$$

    $$\boxed{y=\frac{27}{99}=\frac{3}{11}}$$

    **3.** Le chiffre $2$ ne fait pas partie de la période : on décale d'abord d'un rang, puis de deux. 
    $$10z=12{,}333\ldots \qquad ; \qquad 100z=123{,}333\ldots$$
     En soustrayant, les parties décimales disparaissent : 
    $$100z-10z=123-12=111 \qquad\text{soit}\qquad 90z=111$$

    $$\boxed{z=\frac{111}{90}=\frac{37}{30}}$$

    **4.** Chacun de ces trois nombres s'écrit comme un quotient de deux entiers, ce sont donc des nombres rationnels. En revanche leur écriture décimale ne s'arrête pas : ils ne sont pas décimaux. 
    $$\boxed{x,\;y\text{ et }z\text{ appartiennent à }\mathbb{Q}\text{ mais pas à }\mathbb{D}}$$
