  page_enonce: 9
  page_corrige: 16
  enonce: |
    Traduire chacune des phrases suivantes par une appartenance à un intervalle (ou à une réunion d'intervalles) :

    **1.** $x$ est un nombre réel positif ou nul.

    **2.** $x$ est un nombre réel strictement négatif.

    **3.** $x$ est compris entre $-3$ et $8$, ces deux valeurs étant comprises.

    **4.** $x$ est supérieur ou égal à $2$ et strictement inférieur à $9$.

    **5.** $x$ est un nombre réel non nul.

    **6.** $x$ est un nombre réel différent de $3$.
  corrige: |
    On traduit chaque phrase en faisant attention aux mots « strictement » (crochet vers l'extérieur) et « ou nul » (crochet vers l'intérieur) :

    **1.** $\boxed{x\in[0\,;+\infty[}$

    **2.** $\boxed{x\in\;]-\infty\,;0[}$

    **3.** $\boxed{x\in[-3\,;8]}$

    **4.** $\boxed{x\in[2\,;9[}$

    **5.** $\boxed{x\in\;]-\infty\,;0[\;\cup\;]0\,;+\infty[}$ (ensemble également noté $\mathbb{R}^*$)

    **6.** $\boxed{x\in\;]-\infty\,;3[\;\cup\;]3\,;+\infty[}$
- id: "s-01-33"
  feuille: "f-s-01"
  numero: 33
  partie: "Intervalles"
  etoiles: 1
  types: [Calcul]
  mots_cles: [ensembles de nombres, intervalles]
  noeuds: [r, ar-corps]
  notions: [ensemble-reels, intervalle]
  page_enonce: 9
  page_corrige: 16
  enonce: |
    Déterminer les ensembles suivants, en les écrivant sous la forme d'un intervalle lorsque c'est possible :

    **a)** $[-2\,;5]\cap[0\,;8]$

    **b)** $[-2\,;5]\cup[0\,;8]$

    **c)** $]-\infty\,;3]\cap\;]0\,;+\infty[$

    **d)** $[1\,;4[\;\cap\;]4\,;7]$

    **e)** $]-5\,;2]\cup[2\,;6[$

    **f)** $[0\,;3[\;\cup\;]5\,;9]$
  corrige: |
    On s'aide d'une droite graduée : l'intersection correspond à la partie commune aux deux intervalles, la réunion à la partie totale recouverte. Sur chaque figure, les deux intervalles de départ sont tracés au-dessus de l'axe, et le résultat sur l'axe lui-même.

    **a)** $\boxed{[-2\,;5]\cap[0\,;8]=[0\,;5]}$

    ![Figure](documents/figures/4f9510ec90eace9f.svg)

    **b)** $\boxed{[-2\,;5]\cup[0\,;8]=[-2\,;8]}$

    ![Figure](documents/figures/4496f21c57ecc644.svg)

    **c)** $\boxed{]-\infty\,;3]\cap\;]0\,;+\infty[\;=\;]0\,;3]}$

    ![Figure](documents/figures/860f1ec9feb0fbfa.svg)

    **d)** $\boxed{[1\,;4[\;\cap\;]4\,;7]=\emptyset}$

    ![Figure](documents/figures/03fc40db35801c3a.svg)

    Aucun réel ne peut être à la fois strictement inférieur à $4$ et strictement supérieur à $4$ : les deux intervalles sont disjoints, la valeur $4$ étant exclue de l'un comme de l'autre.

    **e)** $\boxed{]-5\,;2]\cup[2\,;6[\;=\;]-5\,;6[}$

    ![Figure](documents/figures/93691e351e25aab7.svg)

    La valeur $2$ appartient au second intervalle : les deux morceaux se recollent, et la réunion est bien un seul intervalle.

    **f)** $\boxed{[0\,;3[\;\cup\;]5\,;9]}$

    ![Figure](documents/figures/f8769e60103e9bc5.svg)

    L'ensemble obtenu est « en deux morceaux » : il ne peut pas s'écrire comme un seul intervalle, et on conserve donc l'écriture avec le symbole $\cup$.
- id: "s-01-34"
  feuille: "f-s-01"
  numero: 34
  partie: "Intervalles"
  etoiles: 2
  types: [Calcul]
  mots_cles: [ensembles de nombres, intervalles]
  noeuds: [r, ar-corps]
  notions: [ensemble-reels, intervalle]
  page_enonce: 9
  page_corrige: 17
  enonce: |
    On considère les trois intervalles : 
    $$A=[-4\,;2[ \qquad B=\;]-1\,;5] \qquad C=[2\,;7[$$

    **1.** Représenter ces trois intervalles sur une même droite graduée.

    **2.** Déterminer $A\cap B$, $A\cup B$, $B\cap C$ et $A\cap C$.

    **3.** Déterminer $(A\cup B)\cap C$ et $A\cap(B\cup C)$. Ces deux ensembles sont-ils égaux ?
  corrige: |
    **1.** On représente les trois intervalles sur une même droite graduée :

    ![Figure](documents/figures/c38819a48a2aa26f.svg)

    **2.** On lit alors directement les résultats sur la figure : 
    $$\boxed{A\cap B=\;]-1\,;2[ \qquad ; \qquad A\cup B=[-4\,;5]}$$

    $$\boxed{B\cap C=[2\,;5] \qquad ; \qquad A\cap C=\emptyset}$$
     Pour cette dernière intersection, on remarque que $2$ n'appartient pas à $A$ (crochet vers l'extérieur) alors qu'il appartient à $C$ : les deux intervalles n'ont donc aucun point commun.

    **3.** On utilise les résultats précédents : 
    $$(A\cup B)\cap C=[-4\,;5]\cap[2\,;7[\;=\;\boxed{[2\,;5]}$$

    $$B\cup C=\;]-1\,;7[ \qquad\text{donc}\qquad A\cap(B\cup C)=[-4\,;2[\;\cap\;]-1\,;7[\;=\; \boxed{]-1\,;2[}$$
     Ces deux ensembles sont donc **différents** : l'ordre dans lequel on effectue une intersection et une réunion a une réelle importance.
- id: "s-01-35"
  feuille: "f-s-01"
  numero: 35
  partie: "Intervalles"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [fractions, racines carrées, intervalles]
  noeuds: [q-construction, c-racine-reelle, ar-corps]
  notions: [ensemble-rationnels, intervalle]
  page_enonce: 9
  page_corrige: 18
  enonce: |
    Dans chaque cas, dire si le nombre proposé appartient ou non à l'intervalle donné. On justifiera en comparant des écritures décimales.

    **1.** $\dfrac{22}{7}$ et l'intervalle $[3\,;3{,}14]$.

    **2.** $\sqrt{2}$ et l'intervalle $]1\,;1{,}41]$.

    **3.** $\pi$ et l'intervalle $[3{,}14\,;3{,}15]$.

    **4.** $-\sqrt{5}$ et l'intervalle $[-2{,}3\,;-2{,}2]$.

    **5.** $\dfrac{5}{3}$ et l'intervalle $]1{,}66\,;1{,}67[$.
  corrige: |
    On compare les écritures décimales, en poussant le calcul assez loin pour pouvoir conclure :

    **1.** $\dfrac{22}{7}=3{,}142857\ldots$ Or $3{,}142857>3{,}14$, donc $\boxed{\dfrac{22}{7}\notin[3\,;3{,}14]}$

    **2.** $\sqrt{2}=1{,}41421\ldots$ Or $1{,}41421>1{,}41$, donc $\boxed{\sqrt{2}\notin\;]1\,;1{,}41]}$

    **3.** $\pi=3{,}14159\ldots$ Or $3{,}14\leqslant 3{,}14159\leqslant 3{,}15$, donc $\boxed{\pi\in[3{,}14\,;3{,}15]}$

    **4.** $\sqrt{5}=2{,}2360\ldots$ donc $-\sqrt{5}=-2{,}2360\ldots$ Or $-2{,}3\leqslant -2{,}236\leqslant -2{,}2$, donc $\boxed{-\sqrt{5}\in[-2{,}3\,;-2{,}2]}$ *(attention : plus un nombre négatif est « grand » en valeur absolue, plus il est petit)*.

    **5.** $\dfrac{5}{3}=1{,}6666\ldots$ Or $1{,}66<1{,}6666<1{,}67$, donc $\boxed{\dfrac{5}{3}\in\;]1{,}66\,;1{,}67[}$
- id: "s-01-36"
  feuille: "f-s-01"
  numero: 36
  partie: "Intervalles"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fractions, intervalles, encadrement]
  noeuds: [q-construction, ar-corps, q-ordre]
  notions: [ensemble-rationnels, intervalle]
  page_enonce: 9
  page_corrige: 18
  enonce: |
    On rappelle que donner un *encadrement* d'un nombre, c'est donner une inégalité de la forme $a\leqslant x\leqslant b$, ou de manière équivalente l'intervalle auquel ce nombre appartient : les deux écritures disent exactement la même chose.

    Soit $x$ un nombre réel appartenant à l'intervalle $[2\,;5]$.

    **1.** Traduire l'appartenance de $x$ à cet intervalle par un encadrement de $x$.

    **2.** Donner un encadrement de $3x$, puis de $x+4$, puis de $3x-1$.

    **3.** Donner un encadrement de $-2x$. *(Attention au sens des inégalités.)*

    **4.** Donner un encadrement de $x^2$, puis de $\dfrac{1}{x}$.

    **5.** Soit maintenant $y\in\;]-1\,;4[$. Donner un encadrement de $5-2y$, et préciser l'intervalle auquel appartient $5-2y$.
  corrige: |
    **1.** Les deux bornes appartenant à l'intervalle, les inégalités sont larges : 
    $$\boxed{x\in[2\,;5] \iff 2\leqslant x\leqslant 5}$$

    **2.** On multiplie l'encadrement par $3$, puis on lui ajoute $4$, ce qui ne change pas le sens des inégalités : 
    $$2\leqslant x\leqslant 5 \implies \boxed{6\leqslant 3x\leqslant 15}$$

    $$2\leqslant x\leqslant 5 \implies \boxed{6\leqslant x+4\leqslant 9}$$
     En enlevant enfin $1$ au premier encadrement : 
    $$\boxed{5\leqslant 3x-1\leqslant 14}$$

    **3.** Multiplier par un nombre négatif *inverse* le sens des inégalités : 
    $$2\leqslant x\leqslant 5 \implies -4\geqslant -2x\geqslant -10 \qquad\text{soit}\qquad \boxed{-10\leqslant -2x\leqslant -4}$$

    **4.** Les trois nombres de l'encadrement étant positifs, on peut élever au carré sans changer le sens des inégalités, et passer à l'inverse en le changeant : 
    $$2\leqslant x\leqslant 5 \implies \boxed{4\leqslant x^2\leqslant 25}$$

    $$2\leqslant x\leqslant 5 \implies \boxed{\frac{1}{5}\leqslant\frac{1}{x}\leqslant\frac{1}{2}}$$

    **5.** On part de $-1<y<4$, on multiplie par $-2$ (ce qui inverse le sens), puis on ajoute $5$ : 
    $$-1<y<4 \implies 2>-2y>-8 \implies -8<-2y<2 \implies -3<5-2y<7$$

    $$\boxed{-3<5-2y<7 \qquad\text{c'est-à-dire}\qquad 5-2y\in\;]-3\,;7[}$$
- id: "s-01-37"
  feuille: "f-s-01"
  numero: 37
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fractions, puissances, écriture scientifique, intervalles]
  noeuds: [q-construction, n-operations, ar-corps]
  notions: [ensemble-rationnels, intervalle]
  page_enonce: 10
  page_corrige: 19
  enonce: |
    On considère le nombre : 
    $$N=\frac{\left(2\times 10^{-3}\right)^2\times 15\times 10^{5}}{4\times 10^{-1}}$$

    **1.** Calculer $N$ et donner son écriture scientifique.

    **2.** Le nombre $N$ est-il un entier naturel ? Un nombre décimal ? Justifier.

    **3.** Le nombre $\dfrac{N}{9}$ est-il un nombre décimal ? Justifier.

    **4.** Le nombre $N$ appartient-il à l'intervalle $[14\,;16]$ ? Et à l'intervalle $]15\,;20]$ ?
  corrige: |
    **1.** On calcule d'abord le carré, puis on regroupe les puissances de $10$ : 
    $$\begin{aligned} N &= \frac{\left(2\times 10^{-3}\right)^2\times 15\times 10^{5}}{4\times 10^{-1}}\\ &= \frac{4\times 10^{-6}\times 15\times 10^{5}}{4\times 10^{-1}}\\ &= \frac{60\times 10^{-1}}{4\times 10^{-1}}=\frac{60}{4} \end{aligned}$$

    $$\boxed{N=15=1{,}5\times 10^{1}}$$

    **2.** Le nombre $N$ vaut $15$ : c'est un entier naturel, et donc également un nombre décimal (puisque $\mathbb{N}\subset\mathbb{D}$) : 
    $$\boxed{N\in\mathbb{N}\text{ et }N\in\mathbb{D}}$$

    **3.** On simplifie la fraction : 
    $$\frac{N}{9}=\frac{15}{9}=\frac{3\times 5}{3\times 3}=\frac{5}{3}=1{,}666\ldots$$
     Cette écriture décimale ne s'arrête pas : 
    $$\boxed{\frac{N}{9}\text{ n'est pas un nombre décimal}}$$

    **4.** Comme $14\leqslant 15\leqslant 16$, le nombre $N$ appartient au premier intervalle. En revanche la borne $15$ est exclue du second (crochet vers l'extérieur) : 
    $$\boxed{N\in[14\,;16] \qquad\text{mais}\qquad N\notin\;]15\,;20]}$$
- id: "s-01-38"
  feuille: "f-s-01"
  numero: 38
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Calcul]
  mots_cles: [puissances, écriture scientifique]
  noeuds: [n-operations]
  notions: []
  page_enonce: 10
  page_corrige: 19
  enonce: |
    D'après une légende, l'inventeur du jeu d'échecs demanda pour récompense un grain de riz sur la première case, deux sur la deuxième, quatre sur la troisième, et ainsi de suite en doublant à chaque case jusqu'à la $64^{\text{e}}$.

    **1.** Combien de grains de riz la $10^{\text{e}}$ case porte-t-elle ? Et la $64^{\text{e}}$ ? Exprimer les réponses sous la forme d'une puissance de $2$.

    **2.** À l'aide de la calculatrice, donner l'écriture scientifique du nombre de grains de la dernière case, arrondie au dixième.

    **3.** Un grain de riz pèse environ $25$ mg. Quelle masse, en kilogrammes, représente la dernière case ? Donner le résultat en écriture scientifique.

    **4.** La production mondiale annuelle de riz est d'environ $8\times 10^{11}$ kg. Pendant combien d'années faudrait-il produire du riz pour honorer cette seule case ?
  corrige: |
    **1.** La première case porte $1=2^0$ grain, la deuxième $2=2^1$, la troisième $4=2^2$ : à chaque fois l'exposant vaut le numéro de la case diminué de $1$. 
    $$\boxed{\text{la }10^{\text{e}}\text{ case porte }2^{9}=512\text{ grains, et la } 64^{\text{e}}\text{ case }2^{63}\text{ grains}}$$

    **2.** La calculatrice donne $2^{63}=9\,223\,372\,036\,854\,775\,808$, soit : 
    $$\boxed{2^{63}\approx 9{,}2\times 10^{18}\text{ grains}}$$

    **3.** On convertit d'abord la masse d'un grain en kilogrammes : $25\;\text{mg}=0{,}000\,025\;\text{kg}=2{,}5\times 10^{-5}\;\text{kg}$. Ainsi : 
    $$m\approx 9{,}2\times 10^{18}\times 2{,}5\times 10^{-5}=23\times 10^{13}$$

    $$\boxed{m\approx 2{,}3\times 10^{14}\;\text{kg}}$$

    **4.** On divise cette masse par la production annuelle : 
    $$\frac{2{,}3\times 10^{14}}{8\times 10^{11}}=0{,}2875\times 10^{3}\approx 288$$

    $$\boxed{\text{il faudrait environ }288\text{ années de production mondiale}}$$
