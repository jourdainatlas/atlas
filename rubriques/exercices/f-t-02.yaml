  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 283"
  page_enonce: 13
  page_corrige: 27
  enonce: |
    Soient $A$ et $B$ deux événements d'un même univers. On se propose de comparer les deux nombres 
    $$P(A)\times P(B) \qquad\text{et}\qquad P(A\cup B)\times P(A\cap B)$$

    **1.** On reprend les événements de l'exercice 1, pour lesquels : 
    $$P(A)=0{,}4 \qquad P(B)=0{,}5 \qquad P(A\cap B)=0{,}2$$
     Calculer ces deux nombres. Quelle conjecture peut-on formuler ?

    **2.** On revient au cas général, et l'on pose : 
    $$x=P(A\cap B) \qquad a=P\left(A\cap\overline{B}\right) \qquad b=P\left(\overline{A}\cap B\right)$$
     Représenter la situation par un diagramme, puis justifier que $P(A)=a+x$, que $P(B)=b+x$ et que $P(A\cup B)=a+b+x$.

    **3.** Démontrer que $P(A)\times P(B)-P(A\cup B)\times P(A\cap B)=ab$, puis conclure.

    **4.** À quelle condition a-t-on égalité ? Donner un exemple d'événements $A$ et $B$, lors du lancer d'un dé équilibré, pour lesquels l'égalité est réalisée.

    **5.** Application : deux événements $A$ et $B$ vérifient $P(A)\times P(B)=0{,}24$ et $P(A\cup B)=0{,}8$. Démontrer que $P(A\cap B)\leqslant 0{,}3$.
  corrige: |
    **1.** On a $P(A)\times P(B)=0{,}4\times 0{,}5=0{,}2$, et $P(A\cup B)=0{,}4+0{,}5-0{,}2=0{,}7$, d'où : 
    $$\boxed{P(A)\times P(B)=0{,}2 \qquad P(A\cup B)\times P(A\cap B)=0{,}7\times 0{,}2=0{,}14}$$
     On conjecture que l'on a toujours $P(A\cup B)\times P(A\cap B)\leqslant P(A)\times P(B)$.

    **2.** Les événements $A\cap\overline{B}$, $A\cap B$ et $\overline{A}\cap B$ découpent $A\cup B$ en trois morceaux deux à deux incompatibles :

    ![Figure](documents/figures/0b12346364be4da4.svg)

    Deux événements incompatibles ont une intersection vide, et la probabilité de leur réunion est donc la somme de leurs probabilités. Comme $A$ est la réunion de $A\cap\overline{B}$ et de $A\cap B$, et ainsi de suite : 
    $$\boxed{P(A)=a+x \qquad P(B)=b+x \qquad P(A\cup B)=a+b+x}$$

    **3.** On développe, puis on réduit : 
    $$\begin{aligned} P(A)\times P(B)-P(A\cup B)\times P(A\cap B) &=(a+x)(b+x)-(a+b+x)x\\ &=ab+ax+bx+x^2-ax-bx-x^2=\boxed{ab} \end{aligned}$$
     Or $a$ et $b$ sont des probabilités, donc positives : leur produit l'est aussi. 
    $$\boxed{P(A\cup B)\times P(A\cap B)\leqslant P(A)\times P(B)}$$

    **4.** L'égalité a lieu si et seulement si $ab=0$, c'est-à-dire si $a=0$ ou $b=0$ : l'un des deux événements $A\cap\overline{B}$ ou $\overline{A}\cap B$ a une probabilité nulle. C'est le cas notamment lorsque $A$ est inclus dans $B$, ou $B$ dans $A$. 
    $$\boxed{\text{Égalité si et seulement si } P\left(A\cap\overline{B}\right)=0 \text{ ou } P\left(\overline{A}\cap B\right)=0}$$
     Par exemple, avec $A$ « obtenir $6$ » et $B$ « obtenir $5$ ou $6$ », on a $A\subset B$, et les deux produits valent $\dfrac{1}{6}\times\dfrac{1}{3}=\dfrac{1}{18}$. ✓

    **5.** Si $P(A\cup B)=0{,}8$, l'inégalité de la question 3 donne $0{,}8\times P(A\cap B)\leqslant 0{,}24$, d'où : 
    $$\boxed{P(A\cap B)\leqslant\frac{0{,}24}{0{,}8}=0{,}3}$$
     Cette borne est atteinte, par exemple lorsque $A\subset B$ avec $P(A)=0{,}3$ et $P(B)=0{,}8$.

    *Remarque.* Tout le travail tient dans le choix des inconnues $a$, $b$ et $x$, adaptées au découpage de $A\cup B$ en morceaux incompatibles : exprimées avec $P(A)$, $P(B)$ et $P(A\cap B)$, les mêmes quantités n'auraient rien laissé voir. Enfin, lorsque $A$ et $B$ sont indépendants, comme ceux de l'exercice 1, on a $P(A)\times P(B)=P(A\cap B)$ : l'inégalité se réduit alors à $P(A\cup B)\leqslant 1$ et n'apprend rien. Elle n'a d'intérêt que pour des événements qui ne sont pas indépendants.
