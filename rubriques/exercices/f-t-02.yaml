  page_enonce: 10
  page_corrige: 21
  enonce: |
    Une variable aléatoire $X$ suit une loi binomiale $\mathcal{B}(n\,;p)$ dont on ignore les paramètres. On sait seulement que : 
    $$E(X)=6 \qquad\text{et}\qquad V(X)=4{,}2$$

    **1.** Exprimer $E(X)$ et $V(X)$ en fonction de $n$ et $p$.

    **2.** En formant le quotient $\dfrac{V(X)}{E(X)}$, déterminer la valeur de $p$.

    **3.** En déduire la valeur de $n$.

    **4.** Calculer alors $P(X=6)$, arrondie à $10^{-3}$.
  corrige: |
    **1.** D'après la proposition 6 du cours : 
    $$\boxed{E(X)=np \qquad\text{et}\qquad V(X)=np(1-p)}$$

    **2.** On forme le quotient, ce qui fait disparaître $n$ : 
    $$\frac{V(X)}{E(X)}=\frac{np(1-p)}{np}=1-p$$
     Or ce quotient vaut $\dfrac{4{,}2}{6}=0{,}7$, donc $1-p=0{,}7$ : 
    $$\boxed{p=0{,}3}$$

    **3.** On reporte dans $E(X)=np=6$ : 
    $$0{,}3\,n=6 \iff n=\frac{6}{0{,}3} \qquad\text{d'où}\qquad \boxed{n=20}$$

    **4.** La variable $X$ suit donc la loi $\mathcal{B}(20\,;0{,}3)$ : 
    $$P(X=6)=\begin{pmatrix}20\\6\end{pmatrix}\times 0{,}3^6\times 0{,}7^{14}=38\,760\times 0{,}3^6\times 0{,}7^{14}$$

    $$\boxed{P(X=6)\approx 0{,}192}$$
- id: "t-02-32"
