  page_enonce: 9
  page_corrige: 18
  enonce: |
    Une jardinerie vend de jeunes plants d'arbres provenant de trois horticulteurs : $35\,\%$ des plants proviennent de l'horticulteur $H_1$, $25\,\%$ de l'horticulteur $H_2$, et le reste de l'horticulteur $H_3$. Chaque horticulteur livre deux catégories d'arbres : des conifères et des arbres à feuilles. La livraison de $H_1$ comporte $80\,\%$ de conifères, celle de $H_2$ seulement $50\,\%$, et celle de $H_3$ seulement $30\,\%$.

    **1.** Le gérant choisit un arbre au hasard dans son stock. On note $H_i$ l'événement « l'arbre provient de l'horticulteur $H_i$ » et $C$ l'événement « l'arbre choisi est un conifère ».

    **(a)** Construire un arbre pondéré traduisant la situation.

    **(b)** Calculer la probabilité que l'arbre choisi soit un conifère provenant de $H_3$.

    **(c)** Justifier que $P(C)=0{,}525$.

    **(d)** L'arbre choisi est un conifère. Quelle est la probabilité qu'il provienne de $H_1$ ? Arrondir à $10^{-3}$.

    **2.** On choisit au hasard un échantillon de $10$ arbres dans le stock, suffisamment important pour assimiler ce choix à un tirage avec remise. On note $X$ le nombre de conifères de l'échantillon.

    **(a)** Justifier que $X$ suit une loi binomiale dont on précisera les paramètres.

    **(b)** Calculer $E(X)$ et interpréter ce résultat.

    **(c)** Quelle est la probabilité que l'échantillon comporte exactement $5$ conifères ? Arrondir à $10^{-3}$.

    **(d)** Quelle est la probabilité que l'échantillon comporte au moins deux arbres à feuilles ?

    **3.** Soit $n$ un entier supérieur à $1$. On choisit cette fois un échantillon de $n$ arbres, et on note $A_n$ l'événement « au moins un des $n$ arbres choisis est un conifère ».

    **(a)** Montrer que $P\left(A_n\right)=1-0{,}475^{\,n}$.

    **(b)** Déterminer à la calculatrice la taille minimale de l'échantillon pour que $P\left(A_n\right)\geqslant 0{,}9999$.

    **(c)** Déterminer la taille minimale de l'échantillon pour qu'en moyenne, au moins $100$ des $n$ arbres choisis soient des conifères.
  corrige: |
    **1.** **(a)** Les trois horticulteurs se partagent la totalité du stock, donc $P\left(H_3\right)=1-0{,}35-0{,}25=0{,}40$.

    ![Figure](documents/figures/4df46e3571e93c33.svg)

    **(b)** On multiplie les probabilités le long du chemin : 
    $$P\left(H_3\cap C\right)=0{,}40\times 0{,}30=\boxed{0{,}12}$$

    **(c)** Les trois horticulteurs formant une partition du stock : 
    $$\begin{aligned} P(C) &= P\left(H_1\cap C\right)+P\left(H_2\cap C\right)+P\left(H_3\cap C\right)\\ &= 0{,}35\times 0{,}8+0{,}25\times 0{,}5+0{,}40\times 0{,}3\\ &= 0{,}28+0{,}125+0{,}12 \end{aligned}$$

    $$\boxed{P(C)=0{,}525}$$

    **(d)** On applique la définition d'une probabilité conditionnelle : 
    $$P_C\left(H_1\right)=\frac{P\left(H_1\cap C\right)}{P(C)}=\frac{0{,}28}{0{,}525} \qquad\text{d'où}\qquad \boxed{P_C\left(H_1\right)\approx 0{,}533}$$

    **2.** **(a)** Le stock est suffisamment important pour assimiler le choix des $10$ arbres à un tirage avec remise : les $10$ prélèvements sont donc des épreuves de Bernoulli identiques et indépendantes, de succès « l'arbre est un conifère » et de paramètre $0{,}525$. 
    $$\boxed{X\sim\mathcal{B}(10\,;0{,}525)}$$

    **(b)** $E(X)=10\times 0{,}525=\boxed{5{,}25}$ : sur un grand nombre d'échantillons de $10$ arbres, on compte en moyenne $5{,}25$ conifères par échantillon.

    **(c)** $P(X=5)=\begin{pmatrix}10\\5\end{pmatrix}\times 0{,}525^5\times 0{,}475^5=252\times 0{,}525^5\times 0{,}475^5$ : 
    $$\boxed{P(X=5)\approx 0{,}243}$$

    **(d)** L'échantillon comporte au moins deux arbres à feuilles si et seulement s'il comporte au plus huit conifères, c'est-à-dire si $X\leqslant 8$. On passe à l'événement contraire : 
    $$\begin{aligned} P(X\leqslant 8) &= 1-P(X=9)-P(X=10)\\ &\approx 1-0{,}0144-0{,}0016 \end{aligned}$$

    $$\boxed{P(X\leqslant 8)\approx 0{,}984}$$

    **3.** **(a)** L'événement contraire de $A_n$ est « aucun des $n$ arbres n'est un conifère », c'est-à-dire $n$ échecs consécutifs, chacun de probabilité $1-0{,}525=0{,}475$ : 
    $$\boxed{P\left(A_n\right)=1-0{,}475^{\,n}}$$

    **(b)** On cherche le plus petit entier $n$ tel que $0{,}475^{\,n}\leqslant 0{,}0001$. La calculatrice donne $0{,}475^{12}\approx 1{,}3\times 10^{-4}$ et $0{,}475^{13}\approx 6{,}3\times 10^{-5}$ : 
    $$\boxed{n=13\text{ arbres}}$$

    **(c)** On résout $E\left(Y_n\right)\geqslant 100$, avec $E\left(Y_n\right)=0{,}525\,n$ : 
    $$0{,}525\,n\geqslant 100 \iff n\geqslant 190{,}47\ldots \qquad\text{d'où}\qquad \boxed{n=191\text{ arbres}}$$
