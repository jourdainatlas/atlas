  enonce: |
    Dans une chaîne de production, $2\,\%$ des pièces présentent un défaut. On prélève au hasard $n$ pièces dans un stock très important, et on note $X_n$ le nombre de pièces défectueuses prélevées.

    **1.** Quelle est la loi suivie par $X_n$ ?

    **2.** Exprimer en fonction de $n$ la probabilité qu'aucune pièce prélevée ne soit défectueuse.

    **3.** En déduire une expression de $P(X_n\geqslant 1)$ en fonction de $n$.

    **4.** À l'aide de la calculatrice, déterminer le plus petit entier $n$ tel que $P(X_n\geqslant 1)\geqslant 0{,}95$.

    **5.** Interpréter ce résultat par une phrase.
  corrige: |
    **1.** Le stock étant très important, les $n$ prélèvements sont assimilables à des épreuves de Bernoulli identiques et indépendantes, de succès « la pièce est défectueuse » : 
    $$\boxed{X_n\sim\mathcal{B}(n\,;0{,}02)}$$

    **2.** Aucune pièce défectueuse signifie $n$ échecs consécutifs : 
    $$P\left(X_n=0\right)=\begin{pmatrix}n\\0\end{pmatrix}\times 0{,}02^0\times 0{,}98^{\,n} \qquad\text{d'où}\qquad \boxed{P\left(X_n=0\right)=0{,}98^{\,n}}$$

    **3.** En passant à l'événement contraire : 
    $$\boxed{P\left(X_n\geqslant 1\right)=1-0{,}98^{\,n}}$$

    **4.** On cherche le plus petit entier $n$ tel que $1-0{,}98^{\,n}\geqslant 0{,}95$, c'est-à-dire tel que $0{,}98^{\,n}\leqslant 0{,}05$. À l'aide d'un tableau de valeurs : 
    $$0{,}98^{148}\approx 0{,}0503>0{,}05 \qquad\text{et}\qquad 0{,}98^{149}\approx 0{,}0493<0{,}05$$

    $$\boxed{n=149}$$

    **5.** À partir de $149$ pièces prélevées, on est sûr à $95\,\%$ d'en trouver au moins une défectueuse. Autrement dit, sur un prélèvement plus petit, il est fréquent de ne détecter aucun défaut alors que la production en contient bel et bien $2\,\%$.
- id: "t-02-24"
  feuille: "f-t-02"
  numero: 24
  titre: "Python"
  partie: "Loi binomiale"
  etoiles: 2
  types: [Algorithmique]
  mots_cles: [variable aléatoire, coefficient binomial, loi binomiale, seuil]
  noeuds: [p-variables]
  notions: [variable-aleatoire, loi-variable]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    On considère une variable aléatoire $X$ suivant la loi binomiale $\mathcal{B}(n\,;p)$.

    **1.** Recopier et compléter la fonction `proba(n,p,k)` ci-dessous, qui renvoie $P(X=k)$. On rappelle que `comb(n,k)` du module `math` renvoie $\begin{pmatrix}n\\k\end{pmatrix}$. 

    ```python
    from math import comb

    def proba(n, p, k):
        return ...
    ```

    **2.** Écrire une fonction `cumul(n,p,k)` qui renvoie $P(X\leqslant k)$, en utilisant une boucle et la fonction précédente.

    **3.** On reprend la situation de l'exercice 23. Recopier et compléter la fonction suivante, qui renvoie le plus petit entier $n$ tel que $P(X_n\geqslant 1)\geqslant s$ : 

    ```python
    def seuil(s):
        n = 0
        while ... :
            n = n + 1
        return n
    ```

    **4.** Que renvoie `seuil(0.95)` ? Et `seuil(0.99)` ?
  corrige: |
    **1.** Il suffit de traduire la formule $P(X=k)=\begin{pmatrix}n\\k\end{pmatrix}p^k(1-p)^{n-k}$ : 

    ```python
    from math import comb

    def proba(n, p, k):
        return comb(n, k) * p**k * (1-p)**(n-k)
    ```

    **2.** La probabilité cumulée est la somme des probabilités de $0$ à $k$ : 

    ```python
    def cumul(n, p, k):
        s = 0
        for i in range(k+1):
            s = s + proba(n, p, i)
        return s
    ```

    **3.** On incrémente $n$ tant que le seuil n'est pas atteint : 

    ```python
    def seuil(s):
        n = 0
        while 1 - 0.98**n < s :
            n = n + 1
        return n
    ```

     On peut aussi écrire la condition sous la forme `1 - proba(n, 0.02, 0) < s`.

    **4.** La fonction renvoie le plus petit entier $n$ tel que $P\left(X_n\geqslant 1\right)$ dépasse le seuil : 
    $$\boxed{\texttt{seuil(0.95)}\text{ renvoie }149 \qquad\text{et}\qquad \texttt{seuil(0.99)}\text{ renvoie }228}$$
     On retrouve bien le résultat de l'exercice 23.
