  enonce: |
    *Le problème du chevalier de Méré, suite.* Cet exercice prolonge l'exercice 32. Pour défendre son intuition, le chevalier de Méré invoquait une « règle de proportion » : en passant d'un dé à deux dés, la probabilité d'obtenir un double $6$ est divisée par $6$ ; il suffirait donc de multiplier par $6$ le nombre de lancers, en passant de $4$ à $24$, pour conserver les mêmes chances de gain.

    Soit $n$ un entier naturel non nul. On lance simultanément $n$ dés équilibrés, et l'on répète ce lancer $N_n=4\times 6^{n-1}$ fois, les lancers étant indépendants. On note $X_n$ le nombre de lancers au cours desquels les $n$ dés donnent tous un $6$, et l'on pose $p_n=P(X_n\geqslant 1)$.

    **1.** Justifier que, lors d'un lancer, la probabilité que les $n$ dés donnent tous un $6$ vaut $\dfrac{1}{6^n}$.

    **2.** Déterminer la loi de $X_n$, puis démontrer que $E(X_n)=\dfrac{2}{3}$ pour tout entier $n\geqslant 1$. En quoi ce résultat donne-t-il en partie raison à la « règle de proportion » ?

    **3.** Exprimer $p_n$ en fonction de $n$. Vérifier que $p_1$ et $p_2$ sont les deux probabilités calculées à l'exercice 32.

    **4.** Calculer $p_3$, $p_4$, $p_5$ et $p_6$, arrondis à $10^{-4}$. Quelle conjecture peut-on formuler sur le sens de variation de la suite $(p_n)$ ?

    **5.** On admet que la suite $(p_n)$ converge vers $1-\mathrm{e}^{-2/3}$. Donner une valeur approchée de cette limite à $10^{-4}$ près. Le pari devient-il favorable au joueur lorsque $n$ augmente ?

    **6.** Expliquer en quelques phrases l'erreur de raisonnement du chevalier de Méré.
  corrige: |
    **1.** Les $n$ dés sont indépendants, et chacun donne un $6$ avec la probabilité $\dfrac{1}{6}$. La probabilité qu'ils donnent tous un $6$ est donc le produit de $n$ facteurs égaux à $\dfrac{1}{6}$ : 
    $$\boxed{\left(\frac{1}{6}\right)^n=\frac{1}{6^n}}$$

    **2.** Les $N_n$ lancers sont des épreuves de Bernoulli identiques et indépendantes, de succès « les $n$ dés donnent tous un $6$ », de probabilité $\dfrac{1}{6^n}$. Ainsi : 
    $$\boxed{X_n\sim\mathcal{B}\left(4\times 6^{n-1}\,;\frac{1}{6^n}\right)}$$
     D'après la formule donnant l'espérance d'une loi binomiale : 
    $$E(X_n)=4\times 6^{n-1}\times\frac{1}{6^n}=\frac{4}{6} \qquad\text{d'où}\qquad \boxed{E(X_n)=\frac{2}{3} \text{ pour tout } n\geqslant 1}$$
     La « règle de proportion » conserve donc bien quelque chose : le *nombre moyen* de succès, qui reste égal à $\dfrac{2}{3}$ quel que soit le nombre de dés.

    **3.** L'événement $(X_n\geqslant 1)$ est le contraire de $(X_n=0)$ : 
    $$\boxed{p_n=1-\left(1-\frac{1}{6^n}\right)^{4\times 6^{n-1}}}$$
     Pour $n=1$ et $n=2$, on retrouve les deux paris de l'exercice 32 : 
    $$p_1=1-\left(\frac{5}{6}\right)^4\approx 0{,}5177 \qquad\text{et}\qquad p_2=1-\left(\frac{35}{36}\right)^{24}\approx 0{,}4914 \quad\checkmark$$

    **4.** À la calculatrice, on obtient les valeurs suivantes :

    $$\begin{array}{|c|c|c|c|c|c|c|} \hline n & 1 & 2 & 3 & 4 & 5 & 6 \\ \hline p_n & 0{,}5177 & 0{,}4914 & 0{,}4874 & 0{,}4867 & 0{,}4866 & 0{,}4866 \\ \hline \end{array}$$

    $$\boxed{\text{La suite } (p_n) \text{ semble décroissante, et se stabiliser vers } 0{,}4866.}$$

    **5.** On calcule la limite admise : 
    $$\boxed{1-\mathrm{e}^{-2/3}\approx 0{,}4866}$$
     Dès $n=2$, on a $p_n<\dfrac{1}{2}$ : le pari est défavorable au joueur, et, d'après la conjecture de la question 4, il le devient même un peu plus lorsque $n$ augmente. La règle de proportion ne sauve donc pas le chevalier de Méré.

    **6.** Le chevalier de Méré raisonnait comme si la probabilité d'obtenir *au moins un* succès ne dépendait que du nombre *moyen* de succès. Or deux variables aléatoires de même espérance peuvent avoir des lois différentes : les variables $X_n$ ont toutes la même espérance $\dfrac{2}{3}$, mais les probabilités $P(X_n=0)$, et donc $p_n$, varient avec $n$. 
    $$\boxed{\text{L'espérance ne suffit pas à déterminer } P(X\geqslant 1) \text{ : il faut connaître la loi.}}$$

    *Remarque.* La limite $1-\mathrm{e}^{-2/3}$ n'a rien d'un hasard : lorsque le nombre d'épreuves est grand et la probabilité de succès petite, avec une espérance $\lambda$ fixée, $P(X=0)$ se rapproche de $\mathrm{e}^{-\lambda}$. C'est le point de départ de la loi de Poisson, étudiée après le baccalauréat ; ici $\lambda=\dfrac{2}{3}$.
