  page_corrige: 28
  enonce: |
    *Tirages avec ou sans remise.* Une urne contient $10$ boules indiscernables au toucher : $4$ blanches et $6$ noires. On en tire trois, l'une après l'autre, et l'on s'intéresse au nombre de boules blanches obtenues. On compare deux protocoles.

    **Partie A : tirages avec remise.** Chaque boule tirée est remise dans l'urne avant le tirage suivant. On note $Y$ le nombre de boules blanches obtenues.

    **1.** Justifier que $Y$ suit une loi binomiale, dont on précisera les paramètres. Donner sa loi dans un tableau, puis calculer $E(Y)$ et $V(Y)$.

    **Partie B : tirages sans remise.** Les boules tirées ne sont plus remises dans l'urne. On note $X$ le nombre de boules blanches obtenues.

    **2.** Les trois tirages sont-ils encore indépendants ? On pourra comparer avec l'exercice 10.

    **3.** Construire l'arbre pondéré de l'expérience. Calculer la probabilité du chemin « blanche, blanche, noire », puis celles des chemins « blanche, noire, blanche » et « noire, blanche, blanche ». Que constate-t-on ?

    **4.** Justifier que tous les chemins comportant exactement $k$ boules blanches ont la même probabilité. En s'inspirant de la démonstration du cours établissant la loi binomiale, en déduire la loi de $X$.

    **5.** Calculer $E(X)$ et $V(X)$. Comparer avec la partie A, et interpréter.

    **Partie C : une urne beaucoup plus grande.** L'urne contient maintenant $1\,000$ boules, dont $400$ blanches, et l'on effectue encore trois tirages.

    **6.** Calculer, arrondies à $10^{-4}$, la probabilité de n'obtenir aucune boule blanche avec remise, puis sans remise. Commenter, en rapprochant ce résultat de l'exemple du cours portant sur un lot de pièces défectueuses.
  corrige: |
    **Partie A : tirages avec remise.**

    **1.** Les boules étant remises, chaque tirage donne une boule blanche avec la probabilité $\dfrac{4}{10}=0{,}4$, et les trois tirages sont identiques et indépendants : 
    $$\boxed{Y\sim\mathcal{B}(3\,;0{,}4)}$$
     La formule $P(Y=k)=\begin{pmatrix}3\\k\end{pmatrix}0{,}4^k\,0{,}6^{3-k}$ donne la loi suivante :

    $$\begin{array}{|c|c|c|c|c|} \hline k & 0 & 1 & 2 & 3 \\ \hline P(Y=k) & 0{,}216 & 0{,}432 & 0{,}288 & 0{,}064 \\ \hline \end{array}$$

    $$\boxed{E(Y)=3\times 0{,}4=1{,}2 \qquad V(Y)=3\times 0{,}4\times 0{,}6=0{,}72}$$

    **Partie B : tirages sans remise.**

    **2.** Non. Si la première boule est blanche, il ne reste que $3$ boules blanches parmi $9$, et la probabilité que la deuxième soit blanche vaut $\dfrac{3}{9}$ ; si la première est noire, elle vaut $\dfrac{4}{9}$. Le résultat du premier tirage influence donc le second, comme à l'exercice 10. 
    $$\boxed{\text{Les tirages sans remise ne sont pas indépendants.}}$$

    **3.** À chaque étape, les probabilités portées par les branches tiennent compte des boules déjà retirées. On note $B$ une boule blanche et $N$ une boule noire ; les probabilités des chemins sont exprimées en sept-cent-vingtièmes, puisque $10\times 9\times 8=720$. Les trois chemins réalisant deux boules blanches et une noire ont pour probabilités : 
    $$\frac{4}{10}\times\frac{3}{9}\times\frac{6}{8} \qquad \frac{4}{10}\times\frac{6}{9}\times\frac{3}{8} \qquad \frac{6}{10}\times\frac{4}{9}\times\frac{3}{8}$$

    $$\boxed{\text{Ces trois chemins ont la même probabilité } \frac{72}{720}=\frac{1}{10}}$$
     Les numérateurs sont les mêmes facteurs $4$, $3$ et $6$, rencontrés dans un ordre différent. L'arbre complet de l'expérience est le suivant :

    ![Figure](documents/figures/12b568db444ce365.svg)

    **4.** Sur un chemin comportant $k$ boules blanches, les dénominateurs sont toujours $10$, $9$ et $8$. Les numérateurs des branches « blanche » valent successivement $4$, $3$, …, puisqu'il reste une boule blanche de moins à chaque fois, et ceux des branches « noire » valent $6$, $5$, … : seul l'ordre dans lequel ils apparaissent dépend du chemin. Le produit est donc le même pour tous ces chemins. Comme pour la loi binomiale, il y a $\begin{pmatrix}3\\k\end{pmatrix}$ chemins comportant $k$ boules blanches, et $P(X=k)$ vaut $\begin{pmatrix}3\\k\end{pmatrix}$ fois la probabilité commune de ces chemins :

    $$\begin{array}{|c|c|c|c|c|} \hline k & 0 & 1 & 2 & 3 \\ \hline P(X=k) & \dfrac{120}{720}=\dfrac{1}{6} & 3\times\dfrac{120}{720}=\dfrac{1}{2} & 3\times\dfrac{72}{720}=\dfrac{3}{10} & \dfrac{24}{720}=\dfrac{1}{30} \\ \hline \end{array}$$

    On vérifie que $\dfrac{1}{6}+\dfrac{1}{2}+\dfrac{3}{10}+\dfrac{1}{30}=\dfrac{5+15+9+1}{30}=1$. ✓

    **5.** On calcule l'espérance, puis la variance par la formule de König-Huygens : 
    $$E(X)=0\times\frac{1}{6}+1\times\frac{1}{2}+2\times\frac{3}{10}+3\times\frac{1}{30} =0{,}5+0{,}6+0{,}1=\boxed{1{,}2}$$

    $$E\left(X^2\right)=\frac{1}{2}+4\times\frac{3}{10}+9\times\frac{1}{30}=2 \qquad\text{d'où}\qquad V(X)=2-1{,}2^2=\boxed{0{,}56}$$
     Les deux protocoles donnent la même espérance, mais $V(X)<V(Y)$ : les tirages sans remise sont moins dispersés. Chaque boule blanche tirée rend la suivante moins probable, ce qui corrige les écarts. Les valeurs extrêmes deviennent ainsi plus rares : 
    $$P(X=0)\approx 0{,}167<P(Y=0)=0{,}216 \qquad\text{et}\qquad P(X=3)\approx 0{,}033<P(Y=3)=0{,}064$$

    $$\boxed{\text{Même espérance, mais moins de dispersion sans remise.}}$$

    **Partie C : une urne beaucoup plus grande.**

    **6.** Avec remise, $Y\sim\mathcal{B}(3\,;0{,}4)$ comme dans la partie A. Sans remise, on suit le chemin « noire, noire, noire » : 
    $$\boxed{P(Y=0)=0{,}6^3=0{,}216} \qquad \boxed{P(X=0)=\frac{600}{1\,000}\times\frac{599}{999}\times\frac{598}{998}\approx 0{,}2156}$$
     Les deux probabilités sont presque égales : lorsque l'urne est grande, retirer trois boules ne modifie pratiquement pas sa composition, et les tirages sans remise se comportent comme des tirages avec remise. C'est exactement ce qui justifie l'exemple du cours : on y modélise le prélèvement de $50$ pièces par une loi binomiale, parce que le stock est suffisamment grand pour assimiler ce prélèvement à un tirage avec remise.

    *Remarque.* La loi de $X$ s'appelle la *loi hypergéométrique*. Le chapitre 7, consacré au dénombrement, permettra de l'écrire directement sous la forme $P(X=k)=\begin{pmatrix}4\\k\end{pmatrix}\begin{pmatrix}6\\3-k\end{pmatrix}\Big/\begin{pmatrix}10\\3\end{pmatrix}$, en comptant les façons de choisir $k$ boules blanches et $3-k$ boules noires. On retrouve par exemple : 
    $$P(X=1)=\frac{\begin{pmatrix}4\\1\end{pmatrix}\begin{pmatrix}6\\2\end{pmatrix}}{\begin{pmatrix}10\\3\end{pmatrix}}=\frac{4\times 15}{120}=\frac{1}{2} \quad\checkmark$$
