  enonce: |
    *Le jeu de Monty Hall.* Dans un jeu télévisé américain, un candidat fait face à trois portes fermées. Derrière l'une d'elles se trouve une voiture, derrière chacune des deux autres une chèvre. Le candidat désigne une porte, sans l'ouvrir. Le présentateur, qui sait où se trouve la voiture, ouvre alors l'une des deux autres portes, derrière laquelle se trouve une chèvre ; lorsqu'il a le choix entre deux portes, il choisit au hasard, avec équiprobabilité. Il propose enfin au candidat de conserver son choix ou d'en changer.

    On suppose que la voiture a été placée au hasard, avec équiprobabilité, et que le candidat désigne la porte 1. On note $V$ le numéro de la porte cachant la voiture, et $O$ celui de la porte ouverte par le présentateur.

    **1.** Construire un arbre pondéré décrivant l'expérience, dont le premier niveau indique la valeur de $V$ et le second celle de $O$.

    **2.** Calculer $P(O=3)$.

    **3.** Le présentateur ouvre la porte 3. Calculer $P_{(O=3)}(V=1)$ et $P_{(O=3)}(V=2)$. Le candidat a-t-il intérêt à changer de porte ?

    **4.** Retrouver ce résultat sans calcul, en décrivant les cas dans lesquels la stratégie « toujours conserver » et la stratégie « toujours changer » font gagner la voiture.

    **5.** *Variante.* Le présentateur ne sait plus où se trouve la voiture : il ouvre au hasard l'une des portes 2 et 3, avec équiprobabilité. Il ouvre la porte 3, qui se trouve cacher une chèvre. Le candidat a-t-il encore intérêt à changer de porte ?

    **6.** Pourquoi les réponses aux questions 3 et 5 diffèrent-elles, alors que le candidat observe exactement la même chose dans les deux cas ?
  corrige: |
    **1.** Au premier niveau, les trois positions de la voiture sont équiprobables. Au second, si la voiture est derrière la porte 1, le présentateur choisit au hasard entre les portes 2 et 3 ; sinon, il n'a pas le choix, car il doit éviter à la fois la porte du candidat et celle de la voiture. Les chemins réalisant $(O=3)$ sont tracés en rouge.

    ![Figure](documents/figures/6148cc7179c4c8d9.svg)

    **2.** L'événement $(O=3)$ est réalisé par les deux chemins rouges ; on additionne leurs probabilités : 
    $$P(O=3)=\frac{1}{6}+\frac{1}{3} \qquad\text{d'où}\qquad \boxed{P(O=3)=\frac{1}{2}}$$

    **3.** On applique la définition de la probabilité conditionnelle : 
    $$P_{(O=3)}(V=1)=\frac{P\big((V=1)\cap(O=3)\big)}{P(O=3)}=\frac{1/6}{1/2} \qquad\text{d'où}\qquad \boxed{P_{(O=3)}(V=1)=\frac{1}{3}}$$

    $$P_{(O=3)}(V=2)=\frac{1/3}{1/2} \qquad\text{d'où}\qquad \boxed{P_{(O=3)}(V=2)=\frac{2}{3}}$$

    $$\boxed{\text{Le candidat a intérêt à changer de porte : il double ainsi ses chances.}}$$

    **4.** La stratégie « toujours conserver » gagne exactement lorsque le premier choix était le bon, ce qui arrive avec la probabilité $\dfrac{1}{3}$. La stratégie « toujours changer » gagne exactement lorsque le premier choix était mauvais : le présentateur ayant écarté la seule autre chèvre, la porte restante cache alors forcément la voiture. Cela arrive avec la probabilité $\dfrac{2}{3}$. 
    $$\boxed{P(\text{gagner en conservant})=\frac{1}{3} \qquad P(\text{gagner en changeant})=\frac{2}{3}}$$

    **5.** Le présentateur choisit désormais la porte à ouvrir indépendamment de la position de la voiture. On note $E=(O=3)\cap(V\neq 3)$ l'événement « la porte 3 est ouverte et cache une chèvre ». Sa probabilité vaut : 
    $$P(E)=P\big((V=1)\cap(O=3)\big)+P\big((V=2)\cap(O=3)\big) =\frac{1}{3}\times\frac{1}{2}+\frac{1}{3}\times\frac{1}{2}=\frac{1}{3}$$

    $$P_E(V=1)=\frac{1/6}{1/3}=\frac{1}{2} \qquad\text{et}\qquad P_E(V=2)=\frac{1/6}{1/3}=\frac{1}{2}$$

    $$\boxed{\text{Changer de porte ne sert plus à rien : les deux portes ont la même probabilité } \tfrac{1}{2}.}$$

    **6.** Ce qui diffère n'est pas ce que voit le candidat, mais la façon dont cette observation a été produite. Le présentateur informé n'ouvre *jamais* la porte de la voiture : lorsque la voiture est derrière la porte 2, il est *contraint* d'ouvrir la porte 3, ce qui rend cette ouverture deux fois plus probable que lorsque la voiture est derrière la porte 1. Son geste apporte donc une information. Le présentateur ignorant, lui, aurait pu révéler la voiture ; qu'il ne l'ait pas fait est un simple hasard, qui ne favorise aucune des deux portes restantes. 
    $$\boxed{\text{Une probabilité conditionnelle dépend du modèle qui a produit l'observation.}}$$

    *Remarque historique.* Le 9 septembre 1990, la chroniqueuse Marilyn vos Savant répond à ce problème dans le magazine américain *Parade* en conseillant de changer de porte. Elle reçoit environ $10\,000$ lettres, dont près d'un millier signées par des titulaires d'un doctorat, la plupart affirmant qu'elle se trompe. La réponse « une chance sur deux » que défendaient ses contradicteurs est celle de la question 5 : elle suppose, sans le dire, un présentateur qui ne sait rien.

