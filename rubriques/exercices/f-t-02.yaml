  enonce: |
    Une usine fabrique des composants électroniques. Une étude montre que $4\,\%$ d'entre eux sont défectueux. On prélève au hasard un lot de $30$ composants dans la production, assimilée à un tirage avec remise. On note $X$ le nombre de composants défectueux du lot.

    **1.** Justifier que $X$ suit une loi binomiale dont on précisera les paramètres.

    **2.** Calculer la probabilité que le lot ne contienne aucun composant défectueux, arrondie à $10^{-3}$.

    **3.** Calculer la probabilité que le lot contienne exactement deux composants défectueux.

    **4.** Calculer la probabilité que le lot contienne au moins un composant défectueux.

    **5.** Calculer la probabilité que le lot contienne au plus deux composants défectueux.

    **6.** Un lot est refusé lorsqu'il contient strictement plus de trois composants défectueux. Calculer la probabilité qu'un lot soit refusé.

    **7.** Calculer $E(X)$ et $\sigma(X)$, puis interpréter l'espérance dans le contexte de l'exercice.
  corrige: |
    **1.** Le prélèvement est assimilé à un tirage avec remise : les $30$ prélèvements sont donc des épreuves de Bernoulli identiques et indépendantes, de succès « le composant est défectueux » et de paramètre $p=0{,}04$. La variable $X$ compte le nombre de succès : 
    $$\boxed{X\sim\mathcal{B}(30\,;0{,}04)}$$

    **2.** $P(X=0)=\begin{pmatrix}30\\0\end{pmatrix}\times 0{,}04^0\times 0{,}96^{30}=0{,}96^{30}$ : 
    $$\boxed{P(X=0)\approx 0{,}294}$$

    **3.** $P(X=2)=\begin{pmatrix}30\\2\end{pmatrix}\times 0{,}04^2\times 0{,}96^{28}=435\times 0{,}0016\times 0{,}96^{28}$ : 
    $$\boxed{P(X=2)\approx 0{,}222}$$

    **4.** On passe par l'événement contraire : 
    $$P(X\geqslant 1)=1-P(X=0)\approx 1-0{,}294 \qquad\text{d'où}\qquad \boxed{P(X\geqslant 1)\approx 0{,}706}$$

    **5.** « Au plus deux » signifie $0$, $1$ ou $2$ composants défectueux : 
    $$P(X\leqslant 2)=P(X=0)+P(X=1)+P(X=2) \qquad\text{d'où}\qquad \boxed{P(X\leqslant 2)\approx 0{,}883}$$

    **6.** Le lot est refusé lorsque $X>3$, c'est-à-dire lorsque $X\geqslant 4$, événement contraire de $(X\leqslant 3)$ : 
    $$P(X\geqslant 4)=1-P(X\leqslant 3)\approx 1-0{,}969 \qquad\text{d'où}\qquad \boxed{P(X\geqslant 4)\approx 0{,}031}$$
     Environ $3\,\%$ des lots sont donc refusés.

    **7.** On applique les formules de la loi binomiale : 
    $$\boxed{E(X)=30\times 0{,}04=1{,}2} \qquad\text{et}\qquad \boxed{\sigma(X)=\sqrt{30\times 0{,}04\times 0{,}96}\approx 1{,}07}$$
     Sur un grand nombre de lots de $30$ composants, on compte en moyenne $1{,}2$ composant défectueux par lot.
- id: "t-02-26"
  feuille: "f-t-02"
  numero: 26
