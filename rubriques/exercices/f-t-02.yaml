  enonce: |
    Soit $n$ un entier naturel non nul. Une urne contient $10$ boules noires et $n$ boules blanches, indiscernables au toucher. On effectue $20$ tirages successifs d'une boule, *avec remise*. On note $Y_n$ le nombre de boules blanches obtenues, et $p_n$ la probabilité d'obtenir au moins une boule blanche au cours des $20$ tirages.

    **1.** Justifier que $Y_n$ suit une loi binomiale, dont on précisera les paramètres.

    **2.** Démontrer que $p_n=1-\left(\dfrac{10}{n+10}\right)^{20}$.

    **3.** Calculer $p_1$, arrondi à $10^{-4}$. Ce résultat vous surprend-il ?

    **4.** Démontrer que la suite $(p_n)$ est croissante. En déduire l'ensemble des entiers $n\geqslant 1$ tels que $p_n\geqslant\dfrac{1}{2}$.

    **5.** On considère la fonction Python suivante, où `s` désigne un nombre de $]0\,;1[$. 

    ```python
    def seuil(s):
        n = 1
        while ............ :
            n = n + 1
        return n
    ```

     Compléter la condition de la boucle pour que `seuil(s)` renvoie le plus petit entier $n\geqslant 1$ tel que $p_n\geqslant s$. Déterminer alors le plus petit entier $n$ tel que $p_n\geqslant 0{,}99$, puis le plus petit tel que $p_n\geqslant 0{,}999$.
  corrige: |
    **1.** L'urne contient $n+10$ boules, dont $n$ blanches ; les boules étant indiscernables au toucher, la probabilité de tirer une boule blanche vaut $\dfrac{n}{n+10}$ à chaque tirage. Comme on remet la boule tirée, les $20$ tirages sont identiques et indépendants : ils forment un schéma de Bernoulli, de succès « tirer une boule blanche ». 
    $$\boxed{Y_n\sim\mathcal{B}\left(20\,;\frac{n}{n+10}\right)}$$

    **2.** L'événement « obtenir au moins une boule blanche » est $(Y_n\geqslant 1)$, contraire de $(Y_n=0)$. La probabilité d'échec valant $1-\dfrac{n}{n+10}=\dfrac{10}{n+10}$ : 
    $$p_n=1-P(Y_n=0)=\boxed{1-\left(\frac{10}{n+10}\right)^{20}}$$

    **3.** Avec une seule boule blanche parmi onze : 
    $$p_1=1-\left(\frac{10}{11}\right)^{20} \qquad\text{d'où}\qquad \boxed{p_1\approx 0{,}8514}$$
     Le résultat surprend : la boule blanche n'a qu'environ $9\,\%$ de chances de sortir à chaque tirage, et l'on a pourtant plus de $85\,\%$ de chances de la voir au moins une fois en $20$ tirages. Le calcul de l'espérance le rend moins étonnant : $E(Y_1)=20\times\dfrac{1}{11}\approx 1{,}8$, ce qui signifie qu'on obtient en moyenne près de deux boules blanches.

    **4.** Soit $n\geqslant 1$. On a $0<n+10<n+11$, donc $0<\dfrac{10}{n+11}<\dfrac{10}{n+10}$. La fonction $t\mapsto t^{20}$ étant strictement croissante sur $[0\,;+\infty[$, on en déduit $\left(\dfrac{10}{n+11}\right)^{20}<\left(\dfrac{10}{n+10}\right)^{20}$, puis $p_{n+1}>p_n$. 
    $$\boxed{\text{La suite } (p_n) \text{ est strictement croissante.}}$$
     Pour tout $n\geqslant 1$, on a donc $p_n\geqslant p_1\approx 0{,}85>\dfrac{1}{2}$ : 
    $$\boxed{p_n\geqslant\frac{1}{2} \text{ pour \emph{tout} entier } n\geqslant 1}$$

    **5.** La boucle doit se poursuivre tant que le seuil n'est pas atteint, c'est-à-dire tant que $p_n<s$ : 

    ```python
    def seuil(s):
        n = 1
        while 1 - (10/(n+10))**20 < s :
            n = n + 1
        return n
    ```

     On obtient $p_2\approx 0{,}9739<0{,}99\leqslant p_3\approx 0{,}9947$, et $p_4\approx 0{,}9988<0{,}999\leqslant p_5\approx 0{,}9997$ : 
    $$\boxed{\texttt{seuil(0.99)}\text{ renvoie }3 \qquad\text{et}\qquad \texttt{seuil(0.999)}\text{ renvoie }5}$$

    *Piège.* On pourrait croire qu'il faut autant de boules blanches que de noires pour avoir une chance sur deux d'en tirer une : c'est confondre la probabilité de succès lors d'*un* tirage avec la probabilité d'*au moins un* succès en $20$ tirages.

    *Remarque.* On retrouve la démarche des exercices 23 et 24, où l'on cherchait le nombre d'épreuves nécessaire pour atteindre un seuil. Ici, le nombre de tirages est fixé, et c'est la composition de l'urne qui varie.
