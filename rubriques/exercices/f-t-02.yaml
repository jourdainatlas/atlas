  types: [Type Bac, Démonstration, Calcul]
  mots_cles: [arbre pondéré, probabilité conditionnelle, indépendance, espérance, épreuve de Bernoulli, schéma de Bernoulli, coefficient binomial, loi binomiale]
  noeuds: [p-espace, p-independance, p-esperance, p-variables]
