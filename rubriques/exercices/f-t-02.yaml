  enonce: |
    Le virus de la grippe atteint chaque année, en période hivernale, une partie de la population d'une ville. Une étude menée à l'issue de la période hivernale a permis de constater que :

    • $40\,\%$ de la population est vaccinée ;

    • $8\,\%$ des personnes vaccinées ont contracté la grippe ;

    • $20\,\%$ de la population a contracté la grippe.

    On choisit une personne au hasard dans la population de la ville, et on considère les événements $V$ : « la personne est vaccinée » et $G$ : « la personne a contracté la grippe ».

    **Partie A**

    **1.** Donner $P(V)$ et $P(G)$, puis représenter la situation par un arbre pondéré.

    **2.** Déterminer la probabilité que la personne choisie soit vaccinée et ait contracté la grippe.

    **3.** La personne choisie n'est pas vaccinée. Montrer que la probabilité qu'elle ait contracté la grippe est égale à $0{,}28$.

    **4.** Les événements $V$ et $G$ sont-ils indépendants ? Commenter ce résultat.

    **Partie B**

    *Dans cette partie, les probabilités demandées seront arrondies à $10^{-3}$.* Un laboratoire interroge au hasard $n$ habitants de la ville, ce choix étant assimilé à $n$ tirages successifs, indépendants et avec remise. On note $X$ le nombre de personnes vaccinées parmi les $n$ interrogées.

    **1.** Quelle est la loi de probabilité suivie par $X$ ?

    **2.** Dans cette question, on suppose que $n=40$.

    **(a)** Déterminer la probabilité qu'exactement $15$ des $40$ personnes interrogées soient vaccinées.

    **(b)** Déterminer la probabilité qu'au moins la moitié des personnes interrogées soit vaccinée.

    **(c)** Déterminer la probabilité qu'entre $5$ et $10$ des personnes interrogées soient vaccinées.

    **(d)** Déterminer $E(X)$ et interpréter le résultat dans le cadre de l'exercice.

    **3.** Dans cette question, $n$ désigne un entier naturel non nul.

    **(a)** Déterminer le nombre minimal de personnes à interroger pour qu'en moyenne, au moins $100$ soient vaccinées.

    **(b)** Exprimer $P(X=0)$ en fonction de $n$.

    **(c)** Déterminer le nombre minimal de personnes à interroger pour que la probabilité qu'au moins l'une d'elles soit vaccinée dépasse $0{,}99$.
  corrige: |
    **Partie A**

    **1.** L'énoncé donne directement $\boxed{P(V)=0{,}4}$ et $\boxed{P(G)=0{,}2}$, ainsi que $P_V(G)=0{,}08$.

    ![Figure](documents/figures/1cc0c360259606ce.svg)

    **2.** On multiplie les probabilités le long du chemin : 
    $$P(V\cap G)=P(V)\times P_V(G)=0{,}4\times 0{,}08 \qquad\text{d'où}\qquad \boxed{P(V\cap G)=0{,}032}$$

    **3.** Les événements $V$ et $\overline{V}$ forment une partition de l'univers, donc : 
    $$P(G)=P(V\cap G)+P\left(\overline{V}\cap G\right) \implies P\left(\overline{V}\cap G\right)=0{,}2-0{,}032=0{,}168$$

    $$P_{\overline{V}}(G)=\frac{P\left(\overline{V}\cap G\right)}{P\left(\overline{V}\right)} =\frac{0{,}168}{0{,}6} \qquad\text{d'où}\qquad \boxed{P_{\overline{V}}(G)=0{,}28}$$

    **4.** On compare $P(V\cap G)=0{,}032$ au produit $P(V)\times P(G)=0{,}4\times 0{,}2=0{,}08$. Ces deux nombres sont différents : 
    $$\boxed{V\text{ et }G\text{ ne sont pas indépendants}}$$
     C'est heureux : la probabilité de contracter la grippe passe de $0{,}28$ chez les non-vaccinés à $0{,}08$ chez les vaccinés, ce qui traduit l'efficacité du vaccin.

    **Partie B**

    **1.** Les $n$ interrogations sont assimilées à des tirages successifs, indépendants et avec remise ; chacune n'a que deux issues, « la personne est vaccinée » (de probabilité $0{,}4$) ou non. 
    $$\boxed{X\sim\mathcal{B}(n\,;0{,}4)}$$

    **2.** **(a)** $P(X=15)=\begin{pmatrix}40\\15\end{pmatrix}\times 0{,}4^{15}\times 0{,}6^{25}$, d'où $\boxed{P(X=15)\approx 0{,}123}$

    **(b)** « Au moins la moitié » signifie $X\geqslant 20$ : 
    $$P(X\geqslant 20)=1-P(X\leqslant 19)\approx\boxed{0{,}130}$$

    **(c)** On ramène l'encadrement à des probabilités cumulées : 
    $$P(5\leqslant X\leqslant 10)=P(X\leqslant 10)-P(X\leqslant 4)\approx\boxed{0{,}035}$$

    **(d)** $E(X)=40\times 0{,}4=\boxed{16}$ : en interrogeant $40$ habitants, on peut s'attendre à en trouver $16$ vaccinés en moyenne.

    **3.** **(a)** On cherche le plus petit entier $n$ tel que $E(X)\geqslant 100$ : 
    $$0{,}4n\geqslant 100 \iff n\geqslant 250 \qquad\text{d'où}\qquad \boxed{n=250\text{ personnes}}$$

    **(b)** Aucune personne vaccinée signifie $n$ échecs consécutifs : 
    $$\boxed{P(X=0)=0{,}6^{\,n}}$$

    **(c)** On cherche le plus petit entier $n$ tel que $1-0{,}6^{\,n}>0{,}99$, c'est-à-dire tel que $0{,}6^{\,n}<0{,}01$. La calculatrice donne $0{,}6^{9}\approx 0{,}0101$ et $0{,}6^{10}\approx 0{,}0060$ : 
    $$\boxed{n=10\text{ personnes}}$$
- id: "t-02-29"
  feuille: "f-t-02"
  numero: 29
  titre: "Type Bac"
  partie: "Exercices de synthèse"
