  page_enonce: 10
  page_corrige: 19
  enonce: |
    *Cet exercice réinvestit le chapitre sur les suites.* Un détaillant en fruits et légumes étudie l'évolution des ventes de melons. Il constate que :

    • parmi les clients qui achètent un melon une semaine donnée, $90\,\%$ en achètent un la semaine suivante ;

    • parmi les clients qui n'achètent pas de melon une semaine donnée, $60\,\%$ n'en achètent pas la semaine suivante.

    On choisit au hasard un client ayant acheté un melon au cours de la semaine $1$ et, pour $n\geqslant 1$, on note $A_n$ l'événement « le client achète un melon au cours de la semaine $n$ ». On a ainsi $P\left(A_1\right)=1$, et on pose $p_n=P\left(A_n\right)$.

    **1.** **(a)** Construire l'arbre pondéré relatif aux trois premières semaines.

    **(b)** Démontrer que $p_3=0{,}85$.

    **(c)** Sachant que le client achète un melon au cours de la semaine $3$, quelle est la probabilité qu'il en ait acheté un au cours de la semaine $2$ ? Arrondir au centième.

    **2.** Démontrer que, pour tout entier $n\geqslant 1$ : $p_{n+1}=0{,}5\,p_n+0{,}4$.

    **3.** **(a)** Démontrer par récurrence que, pour tout entier $n\geqslant 1$ : $p_n>0{,}8$.

    **(b)** Démontrer que la suite $\left(p_n\right)$ est décroissante.

    **(c)** En déduire que la suite $\left(p_n\right)$ est convergente.

    **4.** On pose, pour tout entier $n\geqslant 1$ : $v_n=p_n-0{,}8$.

    **(a)** Démontrer que $\left(v_n\right)$ est géométrique, et préciser son premier terme et sa raison.

    **(b)** Exprimer $v_n$ en fonction de $n$, puis en déduire que $p_n=0{,}8+\dfrac{2}{5}\times 0{,}5^{\,n}$.

    **(c)** Déterminer la limite de la suite $\left(p_n\right)$ et interpréter ce résultat.
  corrige: |
    **1.** **(a)** D'après l'énoncé, $P_{A_n}\left(A_{n+1}\right)=0{,}9$ et $P_{\overline{A_n}}\left(\overline{A_{n+1}}\right)=0{,}6$, donc $P_{\overline{A_n}}\left(A_{n+1}\right)=0{,}4$. Comme $p_1=1$, on obtient :

    ![Figure](documents/figures/047b773b23e63abb.svg)

    **(b)** Les événements $A_2$ et $\overline{A_2}$ formant une partition de l'univers : 
    $$p_3=0{,}9\times 0{,}9+0{,}1\times 0{,}4=0{,}81+0{,}04 \qquad\text{d'où}\qquad \boxed{p_3=0{,}85}$$

    **(c)** On applique la définition d'une probabilité conditionnelle : 
    $$P_{A_3}\left(A_2\right)=\frac{P\left(A_2\cap A_3\right)}{P\left(A_3\right)} =\frac{0{,}9\times 0{,}9}{0{,}85}=\frac{0{,}81}{0{,}85} \qquad\text{d'où}\qquad \boxed{P_{A_3}\left(A_2\right)\approx 0{,}95}$$

    **2.** Pour tout $n\geqslant 1$, les événements $A_n$ et $\overline{A_n}$ forment une partition de l'univers. La formule des probabilités totales donne alors : 
    $$\begin{aligned} p_{n+1} &= P\left(A_n\cap A_{n+1}\right)+P\left(\overline{A_n}\cap A_{n+1}\right)\\ &= 0{,}9\,p_n+0{,}4\left(1-p_n\right)\\ &= 0{,}9\,p_n+0{,}4-0{,}4\,p_n \end{aligned}$$

    $$\boxed{p_{n+1}=0{,}5\,p_n+0{,}4}$$

    **3.** **(a)** Démontrons par récurrence la propriété $P_n$ : « $p_n>0{,}8$ ».

    **Initialisation :** $p_1=1>0{,}8$, donc $P_1$ est vraie.

    **Hérédité :** soit $k\geqslant 1$. Supposons $p_k>0{,}8$. En multipliant par $0{,}5>0$ puis en ajoutant $0{,}4$ : 
    $$p_k>0{,}8 \implies 0{,}5\,p_k>0{,}4 \implies 0{,}5\,p_k+0{,}4>0{,}8$$
     autrement dit $p_{k+1}>0{,}8$, ce qui prouve $P_{k+1}$.

    **Conclusion :** par principe de récurrence, $\boxed{\forall n\geqslant 1,\; p_n>0{,}8}$

    **(b)** Pour tout $n\geqslant 1$ : 
    $$p_{n+1}-p_n=0{,}5\,p_n+0{,}4-p_n=0{,}4-0{,}5\,p_n=0{,}5\left(0{,}8-p_n\right)$$
     Or $p_n>0{,}8$ d'après la question précédente, donc $0{,}8-p_n<0$ : 
    $$\boxed{\text{la suite }\left(p_n\right)\text{ est décroissante}}$$

    **(c)** La suite $\left(p_n\right)$ est décroissante et minorée par $0{,}8$ : d'après le théorème de convergence monotone, $\boxed{\left(p_n\right)\text{ converge}}$

    **4.** **(a)** Pour tout $n\geqslant 1$ : 
    $$\begin{aligned} v_{n+1} &= p_{n+1}-0{,}8=0{,}5\,p_n+0{,}4-0{,}8\\ &= 0{,}5\,p_n-0{,}4=0{,}5\left(p_n-0{,}8\right)=0{,}5\,v_n \end{aligned}$$

    $$\boxed{\left(v_n\right)\text{ est géométrique de raison }0{,}5\text{ et de premier terme } v_1=p_1-0{,}8=0{,}2}$$

    **(b)** On en déduit $v_n=0{,}2\times 0{,}5^{\,n-1}$. En remarquant que $0{,}2\times 0{,}5^{\,n-1}=0{,}4\times 0{,}5^{\,n}$, et comme $p_n=v_n+0{,}8$ : 
    $$\boxed{v_n=\frac{2}{5}\times 0{,}5^{\,n}\qquad\text{et}\qquad p_n=0{,}8+\frac{2}{5}\times 0{,}5^{\,n}}$$

    **(c)** Comme $-1<0{,}5<1$, on a $\displaystyle\lim_{n\to+\infty}0{,}5^{\,n}=0$, d'où : 
    $$\boxed{\lim_{n\to+\infty}p_n=0{,}8}$$
     À long terme, la probabilité qu'un client achète un melon une semaine donnée se stabilise autour de $0{,}8$ : le détaillant peut estimer que $80\,\%$ de ses clients achèteront un melon chaque semaine.
- id: "t-02-31"
  feuille: "f-t-02"
