  enonce: |
    *Peut-on truquer deux dés ?* On lance deux dés à six faces, éventuellement truqués, de façon indépendante. Pour $1\leqslant i\leqslant 6$, on note $p_i$ la probabilité que le premier dé donne $i$, et $q_i$ la probabilité que le second donne $i$. On note $S$ la somme des deux résultats. On se demande s'il est possible de truquer les dés pour que $S$ suive la loi uniforme sur $\{2\,;3\,;\dots\,;12\}$.

    **1.** Dans le cas de deux dés équilibrés, calculer $P(S=2)$, $P(S=7)$ et $P(S=12)$. La loi de $S$ est-elle uniforme ?

    **2.** On revient au cas général. Exprimer $P(S=2)$ et $P(S=12)$ à l'aide des nombres $p_i$ et $q_i$.

    **3.** Démontrer que $P(S=7)\geqslant p_1q_6+p_6q_1$.

    **4.** Démontrer que pour tous réels positifs $x$ et $y$, on a $x+y\geqslant 2\sqrt{xy}$.

    **5.** En déduire que $P(S=7)\geqslant 2\sqrt{P(S=2)\times P(S=12)}$, puis répondre à la question posée.
  corrige: |
    **1.** Avec deux dés équilibrés, les $36$ couples de résultats sont équiprobables. La somme $2$ n'est obtenue que par $(1\,;1)$, la somme $12$ que par $(6\,;6)$, tandis que la somme $7$ l'est par les six couples $(1\,;6)$, $(2\,;5)$, $(3\,;4)$, $(4\,;3)$, $(5\,;2)$ et $(6\,;1)$ : 
    $$\boxed{P(S=2)=\frac{1}{36} \qquad P(S=7)=\frac{6}{36}=\frac{1}{6} \qquad P(S=12)=\frac{1}{36}}$$
     La loi n'est pas uniforme, puisque chacune des $11$ valeurs aurait alors pour probabilité $\dfrac{1}{11}$.

    **2.** La somme vaut $2$ si et seulement si les deux dés donnent $1$, et $12$ si et seulement si ils donnent $6$. Les lancers étant indépendants : 
    $$\boxed{P(S=2)=p_1q_1 \qquad P(S=12)=p_6q_6}$$

    **3.** L'événement $(S=7)$ est la réunion des six événements incompatibles « le premier dé donne $i$ et le second $7-i$ », pour $1\leqslant i\leqslant 6$ : 
    $$P(S=7)=p_1q_6+p_2q_5+p_3q_4+p_4q_3+p_5q_2+p_6q_1$$
     Les quatre termes centraux étant des produits de probabilités, ils sont positifs, et on peut les supprimer : 
    $$\boxed{P(S=7)\geqslant p_1q_6+p_6q_1}$$

    **4.** Pour $x$ et $y$ positifs, $\sqrt{x}$ et $\sqrt{y}$ existent, et un carré est positif : 
    $$x+y-2\sqrt{xy}=\left(\sqrt{x}-\sqrt{y}\right)^2\geqslant 0 \qquad\text{d'où}\qquad \boxed{x+y\geqslant 2\sqrt{xy}}$$

    **5.** On applique la question 4 à $x=p_1q_6$ et $y=p_6q_1$, puis l'on regroupe les facteurs : 
    $$P(S=7)\geqslant p_1q_6+p_6q_1\geqslant 2\sqrt{p_1q_6\,p_6q_1}=2\sqrt{p_1q_1\times p_6q_6}$$

    $$\boxed{P(S=7)\geqslant 2\sqrt{P(S=2)\times P(S=12)}}$$
     Si $S$ suivait la loi uniforme sur les $11$ valeurs de $\{2\,;\dots\,;12\}$, ces trois probabilités vaudraient $\dfrac{1}{11}$, et l'inégalité deviendrait $\dfrac{1}{11}\geqslant 2\sqrt{\dfrac{1}{121}} =\dfrac{2}{11}$, ce qui est faux. 
    $$\boxed{\text{Aucun trucage des deux dés ne rend la somme uniforme.}}$$

    *Remarque.* L'argument ne compare que trois valeurs de la somme : les deux valeurs extrêmes, qui ne s'obtiennent que d'une seule façon, et la valeur centrale, qui s'obtient de six façons. C'est cette dissymétrie entre le nombre de façons d'obtenir chaque somme, et non les valeurs particulières des probabilités, qui interdit l'uniformité.
