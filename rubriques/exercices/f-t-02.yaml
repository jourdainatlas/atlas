  enonce: |
    Pour réaliser une loterie, un organisateur dispose d'un sac contenant un jeton blanc et neuf jetons noirs, indiscernables au toucher, ainsi que d'un dé cubique équilibré dont les faces sont numérotées de $1$ à $6$. Le joueur tire un jeton, puis lance le dé :

    • si le jeton est blanc, le joueur perd lorsque le dé donne $6$ ;

    • si le jeton est noir, le joueur gagne lorsque le dé donne $6$.

    À la fin de la partie, le jeton est remis dans le sac. On note $B$ l'événement « le jeton tiré est blanc » et $G$ l'événement « le joueur gagne la partie ».

    **Partie A**

    **1.** Représenter la situation par un arbre pondéré, puis montrer que $P(G)=\dfrac{7}{30}$.

    **2.** Le joueur a perdu la partie. Quelle est la probabilité qu'il ait tiré le jeton blanc ?

    **3.** Un joueur effectue $n$ parties de façon indépendante. On note $X$ le nombre de parties gagnées.

    **(a)** Quelle est la loi suivie par $X$ ?

    **(b)** Exprimer en fonction de $n$ la probabilité de gagner au moins une partie.

    **(c)** À l'aide de la calculatrice, déterminer le nombre minimal de parties qu'un joueur doit effectuer pour que cette probabilité dépasse $0{,}99$.

    **Partie B**

    L'organisateur décide de faire de sa loterie un jeu d'argent : chaque joueur paie $1$ euro la partie, et reçoit $5$ euros s'il gagne, rien sinon. On note $Y$ le gain algébrique du joueur à l'issue d'une partie.

    **1.** Déterminer la loi de probabilité de $Y$, puis calculer $E(Y)$.

    **2.** On dit que le jeu est favorable à l'organisateur lorsque $E(Y)<0$. Le jeu est-il favorable à l'organisateur ?

    **3.** L'organisateur décide de modifier le nombre $n$ de jetons noirs, tout en gardant un unique jeton blanc. Montrer que la probabilité de gagner une partie vaut alors $\dfrac{n+5}{6(n+1)}$.

    **4.** Pour quelles valeurs de $n$ le jeu est-il défavorable à l'organisateur ?
  corrige: |
    **Partie A**

    **1.** Le tirage du jeton et le lancer du dé sont indépendants. On obtient l'arbre suivant, où l'on a indiqué sur chaque branche du second niveau la probabilité de gagner ou de perdre :

    ![Figure](documents/figures/d382b8f94ddd87a6.svg)

    Les événements $B$ et $\overline{B}$ formant une partition de l'univers, on somme les deux chemins menant à $G$ : 
    $$P(G)=\frac{1}{10}\times\frac{5}{6}+\frac{9}{10}\times\frac{1}{6} =\frac{5}{60}+\frac{9}{60}=\frac{14}{60} \qquad\text{d'où}\qquad \boxed{P(G)=\frac{7}{30}}$$

    **2.** On cherche la probabilité de $B$ sachant $\overline{G}$. D'une part $P\left(\overline{G}\right)=1-\dfrac{7}{30}=\dfrac{23}{30}$, d'autre part le chemin « jeton blanc puis défaite » donne $P\left(B\cap\overline{G}\right) =\dfrac{1}{10}\times\dfrac{1}{6}=\dfrac{1}{60}$. Ainsi : 
    $$P_{\overline{G}}(B)=\frac{P\left(B\cap\overline{G}\right)}{P\left(\overline{G}\right)} =\frac{\frac{1}{60}}{\frac{23}{30}}=\frac{1}{60}\times\frac{30}{23} \qquad\text{d'où}\qquad \boxed{P_{\overline{G}}(B)=\frac{1}{46}\approx 0{,}022}$$

    **3.** **(a)** Les parties sont identiques et indépendantes, et chacune n'a que deux issues : gagner (avec la probabilité $\frac{7}{30}$) ou perdre. 
    $$\boxed{X\sim\mathcal{B}\left(n\,;\frac{7}{30}\right)}$$

    **(b)** L'événement « gagner au moins une partie » est le contraire de « n'en gagner aucune » : 
    $$P(X\geqslant 1)=1-P(X=0) \qquad\text{d'où}\qquad \boxed{P(X\geqslant 1)=1-\left(\frac{23}{30}\right)^{n}}$$

    **(c)** On cherche le plus petit entier $n$ tel que $\left(\dfrac{23}{30}\right)^{n}\leqslant 0{,}01$. La calculatrice donne : 
    $$\left(\frac{23}{30}\right)^{17}\approx 0{,}0109>0{,}01 \qquad\text{et}\qquad \left(\frac{23}{30}\right)^{18}\approx 0{,}0084<0{,}01$$

    $$\boxed{n=18\text{ parties}}$$

    **Partie B**

    **1.** Le joueur paie $1$ euro dans tous les cas et reçoit $5$ euros s'il gagne : son gain algébrique vaut donc $4$ euros en cas de victoire et $-1$ euro sinon.

    $$\begin{array}{|c|c|c|} \hline y_i & -1 & 4 \\ \hline P(Y=y_i) & \dfrac{23}{30} & \dfrac{7}{30} \\ \hline \end{array}$$

    $$E(Y)=\frac{23}{30}\times(-1)+\frac{7}{30}\times 4=\frac{-23+28}{30} \qquad\text{d'où}\qquad \boxed{E(Y)=\frac{1}{6}\approx 0{,}17}$$

    **2.** L'espérance étant strictement positive, on a $E(Y)>0$ : 
    $$\boxed{\text{le jeu n'est pas favorable à l'organisateur}}$$
     Celui-ci perd en moyenne environ $17$ centimes par partie jouée.

    **3.** Le sac contient alors $n$ jetons noirs et un jeton blanc, soit $n+1$ jetons au total. En reprenant l'arbre de la partie A : 
    $$\begin{aligned} P(G) &= \frac{1}{n+1}\times\frac{5}{6}+\frac{n}{n+1}\times\frac{1}{6}\\ &= \frac{5}{6(n+1)}+\frac{n}{6(n+1)} \end{aligned}$$

    $$\boxed{P(G)=\frac{n+5}{6(n+1)}}$$

    **4.** Le gain algébrique vaut toujours $4$ en cas de victoire et $-1$ sinon, donc : 
    $$E(Y)=4\,P(G)-\big(1-P(G)\big)=5\,P(G)-1$$
     Le jeu est défavorable à l'organisateur lorsque $E(Y)>0$, c'est-à-dire lorsque $P(G)>\dfrac{1}{5}$ : 
    $$\begin{aligned} \frac{n+5}{6(n+1)}>\frac{1}{5} &\iff 5(n+5)>6(n+1)\\ &\iff 5n+25>6n+6\\ &\iff 19>n \end{aligned}$$

    $$\boxed{\text{le jeu est défavorable à l'organisateur pour }n\leqslant 18}$$
     Avec $9$ jetons noirs, l'organisateur perd donc bien de l'argent : il lui en faudrait au moins $19$.
