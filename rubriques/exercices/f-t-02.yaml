  notions: [variable-aleatoire, esperance, loi-variable]
  page_enonce: 11
  page_corrige: 23
  enonce: |
    Le but de cet exercice est de démontrer la formule $E(X)=np$ pour une variable aléatoire $X$ suivant la loi binomiale $\mathcal{B}(n\,;p)$.

    **1.** Soit $k$ un entier tel que $1\leqslant k\leqslant n$. Démontrer, à l'aide de la formule explicite, que : 
    $$k\begin{pmatrix}n\\k\end{pmatrix}=n\begin{pmatrix}n-1\\k-1\end{pmatrix}$$

    **2.** Justifier que $E(X)=\displaystyle\sum_{k=0}^{n}k\begin{pmatrix}n\\k\end{pmatrix}p^k(1-p)^{n-k}$, puis que le terme correspondant à $k=0$ est nul.

    **3.** En utilisant la question 1., démontrer que : 
    $$E(X)=np\sum_{k=1}^{n}\begin{pmatrix}n-1\\k-1\end{pmatrix}p^{k-1}(1-p)^{n-k}$$

    **4.** On admet que la somme précédente vaut $1$, car elle correspond à la somme de toutes les probabilités d'une loi binomiale $\mathcal{B}(n-1\,;p)$. Conclure.
  corrige: |
    **1.** On applique la formule explicite au membre de gauche, en écrivant $n!=n\times(n-1)!$ et $k!=k\times(k-1)!$ : 
    $$\begin{aligned} k\begin{pmatrix}n\\k\end{pmatrix} &= k\times\frac{n!}{k!\,(n-k)!} = \frac{k\times n\times(n-1)!}{k\times(k-1)!\,(n-k)!}\\ &= n\times\frac{(n-1)!}{(k-1)!\,(n-k)!} \end{aligned}$$
     Or $n-k=(n-1)-(k-1)$, donc le second facteur est exactement $\begin{pmatrix}n-1\\k-1\end{pmatrix}$ : 
    $$\boxed{k\begin{pmatrix}n\\k\end{pmatrix}=n\begin{pmatrix}n-1\\k-1\end{pmatrix}}$$

    **2.** La variable $X$ prend les valeurs $0$, $1$, …, $n$ avec $P(X=k)=\begin{pmatrix}n\\k\end{pmatrix}p^k(1-p)^{n-k}$. Par définition de l'espérance : 
    $$E(X)=\sum_{k=0}^{n}k\,P(X=k)=\sum_{k=0}^{n}k\begin{pmatrix}n\\k\end{pmatrix}p^k(1-p)^{n-k}$$
     Le terme correspondant à $k=0$ contient le facteur $k=0$ : il est donc nul, et la somme peut commencer à $k=1$.

    **3.** En remplaçant $k\begin{pmatrix}n\\k\end{pmatrix}$ par $n\begin{pmatrix}n-1\\k-1\end{pmatrix}$ d'après la question 1., puis en factorisant par $np$ (en écrivant $p^k=p\times p^{k-1}$) : 
    $$\begin{aligned} E(X) &= \sum_{k=1}^{n}n\begin{pmatrix}n-1\\k-1\end{pmatrix}p^k(1-p)^{n-k}\\ &= np\sum_{k=1}^{n}\begin{pmatrix}n-1\\k-1\end{pmatrix}p^{k-1}(1-p)^{n-k} \end{aligned}$$

    **4.** En posant $j=k-1$, la somme précédente s'écrit : 
    $$\sum_{j=0}^{n-1}\begin{pmatrix}n-1\\j\end{pmatrix}p^{j}(1-p)^{(n-1)-j}$$
     On y reconnaît la somme de toutes les probabilités d'une variable suivant la loi $\mathcal{B}(n-1\,;p)$, qui vaut donc $1$. On en déduit : 
    $$\boxed{E(X)=np}$$
- id: "t-02-35"
  feuille: "f-t-02"
  numero: 35
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [QCM, Démonstration, Calcul]
  mots_cles: [indépendance, espérance, variance, écart-type, "linéarité de l'espérance", coefficient binomial, loi binomiale]
  noeuds: [p-independance, p-esperance, p-variables]
  notions: [independance, esperance, loi-variable]
  page_enonce: 11
  page_corrige: 23
  enonce: |
    Pour chaque question, une seule réponse est exacte. Déterminer laquelle et justifier.

    $$\begin{array}{|l|c|c|c|} \hline  & \text{Réponse A} & \text{Réponse B} & \text{Réponse C} \\ \hline \text{1. Si }P(A)=0{,}3\text{, }P(B)=0{,}5\text{ et si }A\text{ et }B\text{ sont indépendants, alors }P(A\cup B)\text{ vaut} & 0{,}8 & 0{,}65 & 0{,}15 \\ \hline \text{2. }\begin{pmatrix}9\\7\end{pmatrix}\text{ vaut} & 36 & 72 & 9 \\ \hline \text{3. Si }X\sim\mathcal{B}(40\,;0{,}25)\text{, alors }V(X)\text{ vaut} & 10 & 7{,}5 & 30 \\ \hline \text{4. Si }E(X)=2\text{, alors }E(3X-1)\text{ vaut} & 5 & 6 & 2 \\ \hline \text{5. Si }X\sim\mathcal{B}(n\,;p)\text{, }P(X\geqslant 4)\text{ vaut} & 1-P(X\leqslant 4) & 1-P(X\leqslant 3) & P(X\leqslant 3) \\ \hline \text{6. Si }\sigma(X)=3\text{, alors }V(-2X+5)\text{ vaut} & 36 & 18 & -18 \\ \hline \end{array}$$
  corrige: |
    **1.** Les événements étant indépendants, $P(A\cap B)=0{,}3\times 0{,}5=0{,}15$, d'où $P(A\cup B)=0{,}3+0{,}5-0{,}15=0{,}65$. $\boxed{\text{réponse B}}$

    **2.** Par symétrie, $\begin{pmatrix}9\\7\end{pmatrix}=\begin{pmatrix}9\\2\end{pmatrix}=\dfrac{9\times 8}{2}=36$. $\boxed{\text{réponse A}}$

    **3.** $V(X)=np(1-p)=40\times 0{,}25\times 0{,}75=7{,}5$. $\boxed{\text{réponse B}}$

    **4.** Par linéarité, $E(3X-1)=3\,E(X)-1=6-1=5$. $\boxed{\text{réponse A}}$

    **5.** L'événement $(X\geqslant 4)$ est le contraire de $(X\leqslant 3)$, et non de $(X\leqslant 4)$. $\boxed{\text{réponse B}}$

    **6.** $V(X)=\sigma(X)^2=9$, donc $V(-2X+5)=(-2)^2\times 9=36$ : une variance est toujours positive, ce qui élimine d'emblée la réponse C. $\boxed{\text{réponse A}}$
