- id: "t-02-01"
  feuille: "f-t-02"
  numero: 1
  partie: "Rappels de probabilités"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [indépendance]
  noeuds: [p-independance]
  notions: [independance]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soient $A$ et $B$ deux événements d'un même univers tels que : 
    $$P(A)=0{,}4 \qquad P(B)=0{,}5 \qquad P(A\cap B)=0{,}2$$

    **1.** Calculer $P\left(\overline{A}\right)$ et $P\left(\overline{B}\right)$.

    **2.** Calculer $P(A\cup B)$.

    **3.** En déduire $P\left(\overline{A\cup B}\right)$.

    **4.** Les événements $A$ et $B$ sont-ils indépendants ? Justifier.
  corrige: |
    **1.** On utilise la probabilité de l'événement contraire : 
    $$P\left(\overline{A}\right)=1-0{,}4=\boxed{0{,}6} \qquad\text{et}\qquad P\left(\overline{B}\right)=1-0{,}5=\boxed{0{,}5}$$

    **2.** D'après la formule de la proposition 1 : 
    $$P(A\cup B)=P(A)+P(B)-P(A\cap B)=0{,}4+0{,}5-0{,}2 \qquad\text{d'où}\qquad \boxed{P(A\cup B)=0{,}7}$$

    **3.** En passant de nouveau à l'événement contraire : 
    $$P\left(\overline{A\cup B}\right)=1-0{,}7=\boxed{0{,}3}$$

    **4.** On compare $P(A\cap B)$ au produit $P(A)\times P(B)$ : 
    $$P(A)\times P(B)=0{,}4\times 0{,}5=0{,}2=P(A\cap B)$$

    $$\boxed{\text{les événements }A\text{ et }B\text{ sont indépendants}}$$
- id: "t-02-02"
  feuille: "f-t-02"
  numero: 2
  partie: "Rappels de probabilités"
  etoiles: 1
  types: [Calcul]
  mots_cles: [indépendance]
  noeuds: [p-independance]
  notions: [independance]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    On tire au hasard une carte dans un jeu de $32$ cartes. On note $R$ l'événement « la carte tirée est un roi » et $C$ l'événement « la carte tirée est un cœur ».

    **1.** Justifier que l'on se trouve dans une situation d'équiprobabilité, puis calculer $P(R)$ et $P(C)$.

    **2.** Décrire par une phrase l'événement $R\cap C$, puis calculer sa probabilité.

    **3.** Calculer $P(R\cup C)$ et interpréter le résultat par une phrase.

    **4.** Les événements $R$ et $C$ sont-ils indépendants ?
  corrige: |
    **1.** La carte étant tirée *au hasard*, les $32$ cartes ont toutes la même probabilité d'être tirées : on est bien en situation d'équiprobabilité, et on peut appliquer la formule 
    $$P(A)=\frac{\text{nombre d'issues favorables à }A}{\text{nombre d'issues possibles}}$$

    Le jeu contient $4$ rois et $8$ cœurs, donc : 
    $$P(R)=\frac{4}{32}=\boxed{\frac{1}{8}} \qquad\text{et}\qquad P(C)=\frac{8}{32}=\boxed{\frac{1}{4}}$$

    **2.** L'événement $R\cap C$ est « la carte tirée est le roi de cœur ». Il n'y a qu'une seule carte favorable : 
    $$\boxed{P(R\cap C)=\frac{1}{32}}$$

    **3.** D'après la formule de la réunion : 
    $$P(R\cup C)=\frac{4}{32}+\frac{8}{32}-\frac{1}{32}=\boxed{\frac{11}{32}}$$
     Autrement dit, il y a $11$ chances sur $32$ que la carte tirée soit un roi *ou* un cœur (le roi de cœur n'étant compté qu'une seule fois).

    **4.** On compare de nouveau : 
    $$P(R)\times P(C)=\frac{1}{8}\times\frac{1}{4}=\frac{1}{32}=P(R\cap C)$$

    $$\boxed{\text{les événements }R\text{ et }C\text{ sont indépendants}}$$
     Ce résultat est cohérent : connaître la couleur de la carte ne renseigne en rien sur sa hauteur.
- id: "t-02-03"
  feuille: "f-t-02"
  numero: 3
  partie: "Rappels de probabilités"
  etoiles: 1
  types: [Calcul]
  mots_cles: [indépendance]
  noeuds: [p-independance]
  notions: [independance]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Soient $A$ et $B$ deux événements tels que $P(A)=0{,}3$, $P(B)=0{,}6$ et $P(A\cup B)=0{,}72$.

    **(a)** Calculer $P(A\cap B)$.

    **(b)** Les événements $A$ et $B$ sont-ils indépendants ?

    **2.** Soient $C$ et $D$ deux événements *indépendants* tels que $P(C)=0{,}25$ et $P(D)=0{,}4$.

    **(a)** Calculer $P(C\cap D)$, puis $P(C\cup D)$.

    **(b)** Calculer $P\left(\overline{C}\cap\overline{D}\right)$.
  corrige: |
    **1.** **(a)** On isole $P(A\cap B)$ dans la formule de la réunion : 
    $$P(A\cap B)=P(A)+P(B)-P(A\cup B)=0{,}3+0{,}6-0{,}72$$

    $$\boxed{P(A\cap B)=0{,}18}$$

    **(b)** On calcule le produit : $P(A)\times P(B)=0{,}3\times 0{,}6=0{,}18=P(A\cap B)$. 
    $$\boxed{A\text{ et }B\text{ sont indépendants}}$$

    **2.** **(a)** Cette fois l'indépendance est une hypothèse de l'énoncé : on peut donc s'en servir pour calculer l'intersection. 
    $$P(C\cap D)=0{,}25\times 0{,}4=\boxed{0{,}1}$$

    $$P(C\cup D)=0{,}25+0{,}4-0{,}1=\boxed{0{,}55}$$

    **(b)** L'événement $\overline{C}\cap\overline{D}$ est le contraire de $C\cup D$ : 
    $$P\left(\overline{C}\cap\overline{D}\right)=1-P(C\cup D)=1-0{,}55=\boxed{0{,}45}$$
- id: "t-02-04"
  feuille: "f-t-02"
  numero: 4
  partie: "Rappels de probabilités"
  etoiles: 2
  types: [Calcul]
  mots_cles: [arbre pondéré, indépendance, au moins un succès, urne]
  noeuds: [p-espace, p-independance]
  notions: [espace-probabilise, independance]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Une urne contient $3$ boules blanches et $2$ boules noires, indiscernables au toucher. On tire une boule au hasard, on note sa couleur, on la remet dans l'urne, puis on recommence : on effectue ainsi trois tirages successifs.

    **1.** Justifier que les trois tirages sont indépendants.

    **2.** Représenter la situation par un arbre pondéré.

    **3.** Calculer la probabilité de n'obtenir que des boules blanches.

    **4.** Calculer la probabilité d'obtenir au moins une boule noire.

    **5.** Calculer la probabilité d'obtenir exactement une boule noire.
  corrige: |
    **1.** Après chaque tirage, la boule est remise dans l'urne : sa composition est donc identique avant chaque tirage. Le résultat d'un tirage n'influence pas les suivants : 
    $$\boxed{\text{les trois tirages sont indépendants}}$$
     La probabilité de tirer une boule blanche vaut $\dfrac{3}{5}$ à chaque tirage, et celle de tirer une boule noire $\dfrac{2}{5}$.

    **2.** On obtient l'arbre pondéré suivant, où $B$ désigne « boule blanche » et $N$ « boule noire » :

    ![Figure](documents/figures/de08496605ff2b32.svg)

    **3.** Les tirages étant indépendants, la probabilité d'un chemin est le produit des probabilités portées par ses branches : 
    $$P(BBB)=\frac{3}{5}\times\frac{3}{5}\times\frac{3}{5}=\frac{27}{125} \qquad\text{d'où}\qquad \boxed{P(BBB)=\frac{27}{125}=0{,}216}$$

    **4.** L'événement « au moins une boule noire » est le contraire de « aucune boule noire », c'est-à-dire de l'événement précédent : 
    $$1-\frac{27}{125}=\frac{98}{125} \qquad\text{d'où}\qquad \boxed{P=\frac{98}{125}=0{,}784}$$

    **5.** Trois chemins réalisent exactement une boule noire ($NBB$, $BNB$ et $BBN$), et chacun a pour probabilité $\dfrac{2}{5}\times\left(\dfrac{3}{5}\right)^2=\dfrac{18}{125}$ : 
    $$\boxed{P=3\times\frac{18}{125}=\frac{54}{125}=0{,}432}$$
- id: "t-02-05"
  feuille: "f-t-02"
  numero: 5
  partie: "Variables aléatoires"
  etoiles: 1
  types: [Calcul]
  mots_cles: [variable aléatoire, loi de probabilité, dés]
  noeuds: [p-variables]
