  enonce: |
    *Le problème des anniversaires.* Dans une assemblée de $m$ personnes, on cherche la probabilité que deux d'entre elles au moins soient nées le même jour de l'année. On ignore les années bissextiles, et l'on suppose que la date d'anniversaire de chaque personne est l'un des $365$ jours de l'année, choisi avec équiprobabilité et indépendamment des autres personnes.

    On note $q_m$ la probabilité que les $m$ personnes aient des anniversaires deux à deux distincts, avec la convention $q_1=1$, et l'on pose $p_m=1-q_m$.

    **1.** Que vaut $p_m$ lorsque $m\geqslant 366$ ? Justifier sans calcul.

    **2.** On considère les personnes l'une après l'autre. En s'appuyant sur un arbre, justifier que pour tout entier $m$ tel que $1\leqslant m\leqslant 364$ : 
    $$q_{m+1}=q_m\times\frac{365-m}{365}$$

    **3.** En déduire que la suite $(q_m)$ est décroissante, puis exprimer $q_m$ sous la forme d'un produit. Quel est le sens de variation de la suite $(p_m)$ ?

    **4.** Écrire une fonction Python `anniversaire(m)` qui renvoie $p_m$, en utilisant la relation de la question 2.

    **5.** Déterminer le plus petit entier $m$ tel que $p_m>\dfrac{1}{2}$. Calculer également $p_{50}$, arrondi à $10^{-4}$.

    **6.** Beaucoup de personnes pensent qu'il faudrait environ $183$ personnes, soit la moitié de $365$, pour que $p_m$ dépasse $\dfrac{1}{2}$. Combien de paires distinctes de personnes peut-on former dans une assemblée de $23$ personnes ? En quoi ce nombre éclaire-t-il le résultat de la question 5 ?
  corrige: |
    **1.** Il n'existe que $365$ dates possibles. Dès que $m\geqslant 366$, les $m$ personnes ne peuvent donc pas toutes avoir des dates différentes : deux au moins partagent la même. 
    $$\boxed{p_m=1 \text{ pour } m\geqslant 366}$$

    **2.** Supposons que les $m$ premières personnes aient des anniversaires deux à deux distincts ; cela se produit avec la probabilité $q_m$, et ces personnes occupent alors $m$ dates. L'anniversaire de la personne suivante est indépendant des précédents et équiprobable : il évite les $m$ dates déjà prises avec la probabilité $\dfrac{365-m}{365}$. Dans l'arbre, les $m+1$ personnes ont des anniversaires distincts si et seulement si l'on suit la branche « les $m$ premières sont distinctes », puis la branche « la suivante est différente » ; la probabilité de ce chemin est le produit des probabilités de ses branches : 
    $$\boxed{q_{m+1}=q_m\times\frac{365-m}{365}}$$

    **3.** Pour $1\leqslant m\leqslant 364$, on a $0\leqslant\dfrac{365-m}{365}<1$ et $q_m\geqslant 0$, donc $q_{m+1}\leqslant q_m$ : la suite $(q_m)$ est décroissante. En appliquant la relation de proche en proche à partir de $q_1=1$, on obtient, pour $1\leqslant m\leqslant 365$ : 
    $$\boxed{q_m=\frac{365}{365}\times\frac{364}{365}\times\frac{363}{365}\times\cdots\times \frac{365-m+1}{365}}$$
     Comme $p_m=1-q_m$, la suite $(p_m)$ est croissante : plus l'assemblée est nombreuse, plus une coïncidence est probable.

    **4.** La boucle applique la relation de la question 2 à partir de $q_1=1$ : 

    ```python
    def anniversaire(m):
        q = 1
        for k in range(1, m):
            q = q * (365 - k) / 365
        return 1 - q
    ```

     Pour $m=1$, la boucle n'est pas parcourue et la fonction renvoie $0$ ; pour $m=2$, elle renvoie $1-\dfrac{364}{365}=\dfrac{1}{365}$. ✓

    **5.** On obtient $p_{22}\approx 0{,}4757$ et $p_{23}\approx 0{,}5073$. La suite $(p_m)$ étant croissante, le premier entier qui convient est $23$ : 
    $$\boxed{m=23} \qquad\text{et}\qquad \boxed{p_{50}\approx 0{,}9704}$$
     Dans une classe de $50$ élèves, il est donc presque certain que deux d'entre eux fêtent leur anniversaire le même jour.

    **6.** Une paire de personnes est une partie à $2$ éléments de l'assemblée : 
    $$\begin{pmatrix}23\\2\end{pmatrix}=\frac{23\times 22}{2} \qquad\text{d'où}\qquad \boxed{253 \text{ paires}}$$
     L'intuition du « $183$ » répond en fait à une autre question : combien faut-il de personnes pour qu'*une personne donnée* ait une chance sur deux de partager son anniversaire avec quelqu'un ? Ici, au contraire, n'importe quelle paire convient, et chacune des $253$ paires offre une occasion de coïncidence. Le nombre de paires croît bien plus vite que le nombre de personnes.

    *Remarque.* Le calcul confirme cette explication de façon frappante. Pour qu'une personne donnée ait au moins une chance sur deux de trouver quelqu'un né le même jour qu'elle, il faut que $1-\left(\dfrac{364}{365}\right)^{k}\geqslant\dfrac{1}{2}$, où $k$ est le nombre d'autres personnes ; on trouve à la calculatrice $k\geqslant 253$. Il faut donc $253$ autres personnes, soit exactement autant que de paires dans une assemblée de $23$.
