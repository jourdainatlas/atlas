  page_enonce: 10
  page_corrige: 21
  enonce: |
    *Le problème du chevalier de Méré.* Au XVIIᵉ siècle, un joueur soumet à Pascal le problème suivant : il pensait avoir autant de chances d'obtenir au moins un $6$ en lançant $4$ fois un dé, que d'obtenir au moins un double $6$ en lançant $24$ fois deux dés. L'expérience lui donnait pourtant tort.

    **1.** On lance $4$ fois un dé équilibré. On note $A$ l'événement « obtenir au moins un $6$ ». Calculer $P(A)$, arrondie à $10^{-4}$.

    **2.** On lance $24$ fois deux dés équilibrés. Justifier que la probabilité d'obtenir un double $6$ lors d'un lancer vaut $\dfrac{1}{36}$.

    **3.** On note $B$ l'événement « obtenir au moins un double $6$ au cours des $24$ lancers ». Calculer $P(B)$, arrondie à $10^{-4}$.

    **4.** Le chevalier de Méré avait-il raison ? Commenter.
  corrige: |
    **1.** Les $4$ lancers sont identiques et indépendants, de succès « obtenir un $6$ » et de probabilité $\dfrac{1}{6}$. En notant $X$ le nombre de $6$ obtenus, on a $X\sim\mathcal{B}\left(4\,;\frac{1}{6}\right)$, et $A$ est l'événement $(X\geqslant 1)$ : 
    $$P(A)=1-P(X=0)=1-\left(\frac{5}{6}\right)^4 \qquad\text{d'où}\qquad \boxed{P(A)\approx 0{,}5177}$$

    **2.** Les deux dés étant indépendants, la probabilité que tous deux donnent un $6$ vaut : 
    $$\frac{1}{6}\times\frac{1}{6}=\boxed{\frac{1}{36}}$$

    **3.** De même, en notant $Y$ le nombre de double $6$ obtenus, on a $Y\sim\mathcal{B}\left(24\,;\frac{1}{36}\right)$ : 
    $$P(B)=1-\left(\frac{35}{36}\right)^{24} \qquad\text{d'où}\qquad \boxed{P(B)\approx 0{,}4914}$$

    **4.** Les deux probabilités sont proches, mais $P(A)>0{,}5>P(B)$ : 
    $$\boxed{\text{le chevalier de Méré avait tort}}$$
     Le premier pari est légèrement gagnant, le second légèrement perdant. L'écart, de l'ordre de $3$ points, n'est décelable qu'après un très grand nombre de parties : c'est précisément ce que l'expérience du joueur avait fini par révéler, sans qu'il puisse l'expliquer.
- id: "t-02-33"
  feuille: "f-t-02"
  numero: 33
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [variable aléatoire, espérance, coefficient binomial, factorielle, loi binomiale, valeur la plus probable, inégalité]
  noeuds: [p-variables, p-esperance]
  notions: [variable-aleatoire, esperance, loi-variable]
  page_enonce: 11
  page_corrige: 21
  enonce: |
    Soit $X$ une variable aléatoire suivant la loi binomiale $\mathcal{B}(n\,;p)$, avec $0<p<1$. Le but de l'exercice est de déterminer la valeur la plus probable de $X$.

    **1.** Soit $k$ un entier tel que $0\leqslant k\leqslant n-1$. Démontrer que : 
    $$\frac{P(X=k+1)}{P(X=k)}=\frac{n-k}{k+1}\times\frac{p}{1-p}$$
     *(On pourra utiliser la formule explicite des coefficients binomiaux.)*

    **2.** En déduire que $P(X=k+1)\geqslant P(X=k)$ si et seulement si $k\leqslant np-(1-p)$.

    **3.** Application : on prend $n=10$ et $p=0{,}4$. Déterminer la valeur la plus probable de $X$.

    **4.** Vérifier ce résultat à la calculatrice en calculant $P(X=k)$ pour $k$ allant de $2$ à $6$.
  corrige: |
    **1.** On écrit les deux probabilités à l'aide de la formule du cours, puis on simplifie le quotient : 
    $$\begin{aligned} \frac{P(X=k+1)}{P(X=k)} &= \frac{\begin{pmatrix}n\\k+1\end{pmatrix}p^{k+1}(1-p)^{n-k-1}}{\begin{pmatrix}n\\k\end{pmatrix}p^{k}(1-p)^{n-k}}\\ &= \frac{\begin{pmatrix}n\\k+1\end{pmatrix}}{\begin{pmatrix}n\\k\end{pmatrix}}\times\frac{p}{1-p} \end{aligned}$$
     Or, d'après la formule explicite : 
    $$\frac{\begin{pmatrix}n\\k+1\end{pmatrix}}{\begin{pmatrix}n\\k\end{pmatrix}}=\frac{n!}{(k+1)!\,(n-k-1)!}\times\frac{k!\,(n-k)!}{n!} =\frac{k!}{(k+1)!}\times\frac{(n-k)!}{(n-k-1)!}=\frac{n-k}{k+1}$$

    $$\boxed{\frac{P(X=k+1)}{P(X=k)}=\frac{n-k}{k+1}\times\frac{p}{1-p}}$$

    **2.** Comme $P(X=k)>0$, l'inégalité $P(X=k+1)\geqslant P(X=k)$ équivaut à ce que le quotient précédent soit supérieur ou égal à $1$. Les quantités $k+1$ et $1-p$ étant strictement positives, on peut multiplier sans changer le sens : 
    $$\begin{aligned} \frac{n-k}{k+1}\times\frac{p}{1-p}\geqslant 1 &\iff (n-k)p\geqslant (k+1)(1-p)\\ &\iff np-kp\geqslant k+1-kp-p\\ &\iff np\geqslant k+1-p \end{aligned}$$

    $$\boxed{P(X=k+1)\geqslant P(X=k) \iff k\leqslant np-(1-p)}$$

    **3.** Pour $n=10$ et $p=0{,}4$ : $np-(1-p)=4-0{,}6=3{,}4$. Les probabilités augmentent donc tant que $k\leqslant 3{,}4$, c'est-à-dire jusqu'à $k=3$, puis diminuent ensuite : 
    $$P(X=0)\leqslant\cdots\leqslant P(X=3)\leqslant P(X=4)>P(X=5)>\cdots$$

    $$\boxed{\text{la valeur la plus probable est }k=4}$$

    **4.** La calculatrice confirme ce résultat :

    $$\begin{array}{|c|c|c|c|c|c|} \hline k & 2 & 3 & 4 & 5 & 6 \\ \hline P(X=k) & 0{,}121 & 0{,}215 & 0{,}251 & 0{,}201 & 0{,}111 \\ \hline \end{array}$$

    Le maximum est bien atteint en $k=4$, alors que $E(X)=4$ également ici.
- id: "t-02-34"
  feuille: "f-t-02"
  numero: 34
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [variable aléatoire, espérance, coefficient binomial, factorielle, loi binomiale]
