  page_enonce: 2
  page_corrige: 3
  enonce: |
    On lance un dé équilibré à six faces. On note $X$ la variable aléatoire qui vaut $3$ si le résultat est un $6$, qui vaut $1$ si le résultat est un $4$ ou un $5$, et qui vaut $0$ sinon.

    **1.** Préciser l'univers $\Omega$ de cette expérience, puis l'ensemble $X(\Omega)$.

    **2.** Déterminer la loi de probabilité de $X$ et la présenter dans un tableau.

    **3.** Vérifier que la somme des probabilités vaut $1$.

    **4.** Représenter cette loi par un diagramme en bâtons.
  corrige: |
    **1.** L'univers est l'ensemble des résultats possibles du dé : 
    $$\boxed{\Omega=\{1\,;2\,;3\,;4\,;5\,;6\}}$$
     La variable $X$ ne prend que trois valeurs : 
    $$X(1)=X(2)=X(3)=0 \qquad X(4)=X(5)=1 \qquad X(6)=3$$

    $$\boxed{X(\Omega)=\{0\,;1\,;3\}}$$

    **2.** Le dé étant équilibré, chaque face a pour probabilité $\dfrac{1}{6}$ :

    $$\begin{array}{|c|c|c|c|} \hline x_i & 0 & 1 & 3 \\ \hline P(X=x_i) & \dfrac{3}{6}=\dfrac{1}{2} & \dfrac{2}{6}=\dfrac{1}{3} & \dfrac{1}{6} \\ \hline \end{array}$$

    **3.** On vérifie la somme : 
    $$\frac{1}{2}+\frac{1}{3}+\frac{1}{6}=\frac{3}{6}+\frac{2}{6}+\frac{1}{6}=\boxed{1}$$

    **4.** On obtient le diagramme en bâtons suivant :

    ![Figure](documents/figures/73866b470a6940ab.svg)
- id: "t-02-06"
  feuille: "f-t-02"
  numero: 6
  partie: "Variables aléatoires"
  etoiles: 1
  types: [Calcul]
  mots_cles: [variable aléatoire, loi de probabilité, espérance, variance, écart-type]
  noeuds: [p-variables, p-esperance]
  notions: [variable-aleatoire, loi-variable, esperance]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    La loi de probabilité d'une variable aléatoire $X$ est donnée par le tableau suivant :

    $$\begin{array}{|c|c|c|c|c|} \hline x_i & -3 & 0 & 2 & 5 \\ \hline P(X=x_i) & 0{,}2 & 0{,}3 & a & 0{,}1 \\ \hline \end{array}$$

    **1.** Déterminer la valeur du réel $a$.

    **2.** Calculer $P(X\geqslant 0)$, puis $P(X<2)$.

    **3.** Calculer l'espérance $E(X)$.

    **4.** Calculer $E\left(X^2\right)$, puis en déduire la variance $V(X)$ et l'écart-type $\sigma(X)$, arrondi au centième.
  corrige: |
    **1.** La somme des probabilités d'une loi vaut toujours $1$ : 
    $$0{,}2+0{,}3+a+0{,}1=1 \iff a=1-0{,}6 \qquad\text{d'où}\qquad \boxed{a=0{,}4}$$

    **2.** On additionne les probabilités des valeurs concernées : 
    $$P(X\geqslant 0)=0{,}3+0{,}4+0{,}1=\boxed{0{,}8} \qquad ; \qquad P(X<2)=0{,}2+0{,}3=\boxed{0{,}5}$$

    **3.** On applique la définition de l'espérance : 
    $$\begin{aligned} E(X) &= 0{,}2\times(-3)+0{,}3\times 0+0{,}4\times 2+0{,}1\times 5\\ &= -0{,}6+0+0{,}8+0{,}5 \end{aligned}$$

    $$\boxed{E(X)=0{,}7}$$

    **4.** On calcule d'abord $E\left(X^2\right)$ : 
    $$E\left(X^2\right)=0{,}2\times 9+0{,}3\times 0+0{,}4\times 4+0{,}1\times 25=1{,}8+1{,}6+2{,}5 =\boxed{5{,}9}$$
     La formule de König-Huygens donne alors : 
    $$V(X)=E\left(X^2\right)-\big(E(X)\big)^2=5{,}9-0{,}7^2=5{,}9-0{,}49$$

    $$\boxed{V(X)=5{,}41 \qquad\text{et}\qquad \sigma(X)=\sqrt{5{,}41}\approx 2{,}33}$$
- id: "t-02-07"
  feuille: "f-t-02"
  numero: 7
  partie: "Variables aléatoires"
  etoiles: 1
  types: [Calcul]
  mots_cles: [loi de probabilité, espérance, variance, écart-type, jeu équitable]
  noeuds: [p-variables, p-esperance]
  notions: [loi-variable, esperance]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Une roue de loterie est partagée en $8$ secteurs identiques : un secteur fait gagner $20$ euros, trois secteurs font gagner $5$ euros, et les autres ne font rien gagner. Pour jouer, il faut miser $6$ euros. On note $X$ le gain algébrique du joueur, c'est-à-dire la somme remportée diminuée de la mise.

    **1.** Déterminer $X(\Omega)$, puis la loi de probabilité de $X$.

    **2.** Calculer $E(X)$ et interpréter ce résultat.

    **3.** Le jeu est-il équitable ? Quelle mise faudrait-il fixer pour qu'il le devienne ?

    **4.** Calculer l'écart-type de $X$, arrondi au centième.
  corrige: |
    **1.** Le joueur mise $6$ euros dans tous les cas. Il remporte donc $20-6=14$ euros avec le secteur gagnant, $5-6=-1$ euro avec un secteur à $5$ euros, et $-6$ euros sinon : 
    $$\boxed{X(\Omega)=\{-6\,;-1\,;14\}}$$
     Les huit secteurs étant identiques, on est en situation d'équiprobabilité :

    $$\begin{array}{|c|c|c|c|} \hline x_i & -6 & -1 & 14 \\ \hline P(X=x_i) & \dfrac{4}{8}=\dfrac{1}{2} & \dfrac{3}{8} & \dfrac{1}{8} \\ \hline \end{array}$$

    **2.** On calcule l'espérance : 
    $$E(X)=\frac{1}{2}\times(-6)+\frac{3}{8}\times(-1)+\frac{1}{8}\times 14 =\frac{-24-3+14}{8}$$

    $$\boxed{E(X)=-\frac{13}{8}=-1{,}625}$$
     Sur un très grand nombre de parties, le joueur perd en moyenne $1{,}625$ euro par partie.

    **3.** Un jeu est équitable lorsque $E(X)=0$, ce qui n'est pas le cas ici : le jeu est défavorable au joueur. Le gain moyen *avant* déduction de la mise vaut : 
    $$\frac{1}{8}\times 20+\frac{3}{8}\times 5+\frac{4}{8}\times 0=\frac{35}{8}=4{,}375$$

    $$\boxed{\text{il faudrait fixer la mise à }4{,}375\text{ euro}}$$

    **4.** On applique de nouveau König-Huygens : 
    $$E\left(X^2\right)=\frac{1}{2}\times 36+\frac{3}{8}\times 1+\frac{1}{8}\times 196 =\frac{144+3+196}{8}=\frac{343}{8}=42{,}875$$

    $$V(X)=42{,}875-(-1{,}625)^2=42{,}875-2{,}640625=40{,}234375$$

    $$\boxed{\sigma(X)=\sqrt{40{,}234\ldots}\approx 6{,}34\text{ euros}}$$
     Le jeu est donc à la fois défavorable et très dispersé.
- id: "t-02-08"
  feuille: "f-t-02"
  numero: 8
  partie: "Variables aléatoires"
  etoiles: 1
  types: [Calcul]
  mots_cles: [probabilité conditionnelle, variable aléatoire, loi de probabilité, espérance]
  noeuds: [p-espace, p-variables, p-esperance]
  notions: [espace-probabilise, variable-aleatoire, loi-variable, esperance]
  page_enonce: 2
  page_corrige: 5
  enonce: |
    La variable aléatoire $Y$ prend les valeurs $1$, $2$ et $4$ avec les probabilités respectives $\dfrac{1}{2}$, $\dfrac{1}{3}$ et $\dfrac{1}{6}$.

    **1.** Vérifier qu'il s'agit bien d'une loi de probabilité, puis calculer $E(Y)$.

    **2.** Calculer $V(Y)$ en utilisant directement la définition $V(Y)=\sum p_i\left(y_i-E(Y)\right)^2$.

    **3.** Calculer $V(Y)$ à l'aide de la formule de König-Huygens.

    **4.** Comparer les deux méthodes.
  corrige: |
    **1.** Les trois probabilités sont positives et leur somme vaut : 
    $$\frac{1}{2}+\frac{1}{3}+\frac{1}{6}=\frac{3+2+1}{6}=1$$
     Il s'agit bien d'une loi de probabilité. Son espérance vaut : 
    $$E(Y)=\frac{1}{2}\times 1+\frac{1}{3}\times 2+\frac{1}{6}\times 4 =\frac{3}{6}+\frac{4}{6}+\frac{4}{6} \qquad\text{d'où}\qquad \boxed{E(Y)=\frac{11}{6}}$$

    **2.** On applique la définition, en calculant chaque écart à l'espérance : 
    $$\begin{aligned} V(Y) &= \frac{1}{2}\left(1-\frac{11}{6}\right)^2+\frac{1}{3}\left(2-\frac{11}{6}\right)^2 +\frac{1}{6}\left(4-\frac{11}{6}\right)^2\\ &= \frac{1}{2}\times\frac{25}{36}+\frac{1}{3}\times\frac{1}{36}+\frac{1}{6}\times\frac{169}{36}\\ &= \frac{75}{216}+\frac{2}{216}+\frac{169}{216}=\frac{246}{216} \end{aligned}$$

    $$\boxed{V(Y)=\frac{41}{36}\approx 1{,}14}$$

    **3.** Avec la formule de König-Huygens, on calcule d'abord $E\left(Y^2\right)$ : 
    $$E\left(Y^2\right)=\frac{1}{2}\times 1+\frac{1}{3}\times 4+\frac{1}{6}\times 16 =\frac{1}{2}+\frac{4}{3}+\frac{8}{3}=\frac{1}{2}+4=\frac{9}{2}$$

    $$V(Y)=\frac{9}{2}-\left(\frac{11}{6}\right)^2=\frac{162}{36}-\frac{121}{36} \qquad\text{d'où}\qquad \boxed{V(Y)=\frac{41}{36}}$$

    **4.** Les deux méthodes donnent bien le même résultat, mais la seconde évite de soustraire l'espérance à chacune des valeurs, et donc de manipuler trois fractions au carré : c'est celle que l'on utilisera systématiquement en pratique.
- id: "t-02-09"
  feuille: "f-t-02"
  numero: 9
  partie: "Variables aléatoires"
  etoiles: 1
  types: [Calcul]
  mots_cles: [variable aléatoire, espérance, variance, écart-type, "linéarité de l'espérance"]
  noeuds: [p-variables, p-esperance]
  notions: [variable-aleatoire, esperance]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Soit $X$ une variable aléatoire telle que $E(X)=3$ et $V(X)=4$.

    **1.** Calculer $\sigma(X)$.

    **2.** On pose $Y=5X-2$. Calculer $E(Y)$, $V(Y)$ et $\sigma(Y)$.

    **3.** On pose $Z=-2X+7$. Calculer $E(Z)$, $V(Z)$ et $\sigma(Z)$.

    **4.** On pose $T=\dfrac{X-3}{2}$. Calculer $E(T)$ et $V(T)$.
  corrige: |
    **1.** L'écart-type est la racine carrée de la variance : 
    $$\sigma(X)=\sqrt{4}=\boxed{2}$$

    **2.** On applique les formules de linéarité avec $a=5$ et $b=-2$ : 
    $$E(Y)=5\times 3-2=\boxed{13} \qquad V(Y)=5^2\times 4=\boxed{100} \qquad \sigma(Y)=|5|\times 2=\boxed{10}$$

    **3.** Ici $a=-2$ et $b=7$. On prend garde à la valeur absolue pour l'écart-type : 
    $$E(Z)=-2\times 3+7=\boxed{1} \qquad V(Z)=(-2)^2\times 4=\boxed{16} \qquad \sigma(Z)=|-2|\times 2=\boxed{4}$$

    **4.** On écrit d'abord $T$ sous la forme $aX+b$ : 
    $$T=\frac{X-3}{2}=\frac{1}{2}X-\frac{3}{2}$$
     d'où, avec $a=\dfrac{1}{2}$ et $b=-\dfrac{3}{2}$ : 
    $$E(T)=\frac{1}{2}\times 3-\frac{3}{2}=\boxed{0} \qquad\text{et}\qquad V(T)=\left(\frac{1}{2}\right)^2\times 4=\boxed{1}$$
     La variable $T$ est ainsi centrée et réduite : c'est un procédé que l'on retrouvera en statistiques.
- id: "t-02-10"
  feuille: "f-t-02"
  numero: 10
  partie: "Variables aléatoires"
  etoiles: 2
  types: [Calcul]
  mots_cles: [arbre pondéré, indépendance, loi de probabilité, espérance, variance, loi binomiale, tirage sans remise, tirage avec remise]
  noeuds: [p-espace, p-independance, p-variables, p-esperance]
  notions: [espace-probabilise, independance, loi-variable, esperance]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Une urne contient $3$ boules blanches et $2$ boules noires. On tire successivement et *avec remise* deux boules de l'urne. On note $X$ le nombre de boules blanches obtenues.

    **1.** Déterminer $X(\Omega)$.

    **2.** À l'aide d'un arbre pondéré, déterminer la loi de probabilité de $X$.

    **3.** Calculer $E(X)$ et $V(X)$.

    **4.** Reprendre la question 2. dans le cas d'un tirage *sans remise*. Les deux tirages sont-ils encore indépendants ?
  corrige: |
    **1.** On tire deux boules : le nombre de boules blanches obtenues peut valoir $0$, $1$ ou $2$. 
    $$\boxed{X(\Omega)=\{0\,;1\,;2\}}$$

    **2.** Les tirages étant effectués avec remise, ils sont indépendants et la probabilité d'obtenir une boule blanche vaut $\dfrac{3}{5}$ à chaque fois.

    ![Figure](documents/figures/f691dbd5fefbfcc2.svg)

    Deux chemins réalisent $X=1$, d'où la loi :

    $$\begin{array}{|c|c|c|c|} \hline x_i & 0 & 1 & 2 \\ \hline P(X=x_i) & \dfrac{4}{25} & \dfrac{12}{25} & \dfrac{9}{25} \\ \hline \end{array}$$

    La somme vaut bien $\dfrac{4+12+9}{25}=1$.

    **3.** On applique les définitions : 
    $$E(X)=\frac{4}{25}\times 0+\frac{12}{25}\times 1+\frac{9}{25}\times 2=\frac{30}{25} \qquad\text{d'où}\qquad \boxed{E(X)=\frac{6}{5}=1{,}2}$$

    $$E\left(X^2\right)=\frac{12}{25}\times 1+\frac{9}{25}\times 4=\frac{48}{25} \qquad\text{d'où}\qquad V(X)=\frac{48}{25}-\left(\frac{6}{5}\right)^2=\frac{48-36}{25}$$

    $$\boxed{V(X)=\frac{12}{25}=0{,}48}$$
     On remarquera que $X$ suit en réalité la loi binomiale $\mathcal{B}\left(2\,;\frac{3}{5}\right)$, et que l'on retrouve bien les valeurs $E(X)=np=1{,}2$ et $V(X)=np(1-p)=0{,}48$.

    **4.** Sans remise, la composition de l'urne change entre les deux tirages : la probabilité du second tirage dépend du premier. 
    $$\boxed{\text{les deux tirages ne sont plus indépendants}}$$
     Les probabilités du second niveau de l'arbre deviennent $\dfrac{2}{4}$ et $\dfrac{2}{4}$ après une boule blanche, $\dfrac{3}{4}$ et $\dfrac{1}{4}$ après une boule noire, ce qui donne : 
    $$P(X=2)=\frac{3}{5}\times\frac{2}{4}=\frac{6}{20} \qquad P(X=1)=\frac{3}{5}\times\frac{2}{4}+\frac{2}{5}\times\frac{3}{4}=\frac{12}{20} \qquad P(X=0)=\frac{2}{5}\times\frac{1}{4}=\frac{2}{20}$$

    $$\boxed{P(X=0)=\frac{1}{10} \;;\; P(X=1)=\frac{3}{5} \;;\; P(X=2)=\frac{3}{10}}$$
- id: "t-02-11"
  feuille: "f-t-02"
  numero: 11
  partie: "Variables aléatoires"
  etoiles: 2
  types: [Calcul]
  mots_cles: [loi de probabilité, espérance, jeu équitable]
  noeuds: [p-variables, p-esperance]
  notions: [loi-variable, esperance]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Une compagnie d'assurance propose un contrat couvrant un sinistre dont la probabilité de survenue est estimée à $0{,}02$ sur une année. En cas de sinistre, la compagnie verse une indemnité de $3\,000$ euros. Le client paie une prime annuelle de $p$ euros.

    On note $X$ le gain algébrique de la compagnie pour un contrat, sur une année.

    **1.** Déterminer la loi de probabilité de $X$ en fonction de $p$.

    **2.** Exprimer $E(X)$ en fonction de $p$.

    **3.** Quelle prime la compagnie doit-elle fixer pour que le contrat soit équitable ?

    **4.** Quelle prime doit-elle fixer pour espérer un bénéfice moyen de $40$ euros par contrat ?

    **5.** La compagnie a signé $10\,000$ contrats identiques. Quel bénéfice total peut-elle espérer avec la prime de la question précédente ?
  corrige: |
    **1.** La compagnie encaisse la prime $p$ dans tous les cas, et verse $3\,000$ euros en cas de sinistre :

    $$\begin{array}{|c|c|c|} \hline x_i & p & p-3\,000 \\ \hline P(X=x_i) & 0{,}98 & 0{,}02 \\ \hline \end{array}$$

    **2.** On calcule l'espérance : 
    $$\begin{aligned} E(X) &= 0{,}98\times p+0{,}02\times(p-3\,000)\\ &= 0{,}98p+0{,}02p-60 \end{aligned}$$

    $$\boxed{E(X)=p-60}$$

    **3.** Le contrat est équitable lorsque $E(X)=0$, c'est-à-dire lorsque $p-60=0$ : 
    $$\boxed{p=60\text{ euros}}$$

    **4.** On résout $E(X)=40$, soit $p-60=40$ : 
    $$\boxed{p=100\text{ euros}}$$

    **5.** L'espérance donne le bénéfice moyen *par contrat*. Sur $10\,000$ contrats identiques : 
    $$10\,000\times 40=\boxed{400\,000\text{ euros}}$$
- id: "t-02-12"
  feuille: "f-t-02"
  numero: 12
  partie: "Épreuves de Bernoulli et combinaisons"
  etoiles: 1
  types: [QCM]
  mots_cles: [indépendance, épreuve de Bernoulli, schéma de Bernoulli, tirage sans remise, dés]
  noeuds: [p-independance, p-variables]
  notions: [independance]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Pour chacune des expériences suivantes, dire s'il s'agit d'un schéma de Bernoulli. Si oui, préciser le succès, sa probabilité $p$ et le nombre $n$ d'épreuves ; sinon, expliquer pourquoi.

    **1.** On lance $15$ fois une pièce équilibrée et on s'intéresse au nombre de « pile » obtenus.

    **2.** On tire successivement et sans remise $4$ cartes d'un jeu de $32$, et on s'intéresse au nombre de rois obtenus.

    **3.** On interroge $200$ personnes choisies au hasard dans une très grande population dont $18\,\%$ sont gauchères, et on s'intéresse au nombre de gauchers.

    **4.** On lance un dé équilibré $10$ fois et on s'intéresse à la somme des résultats obtenus.

    **5.** Un élève répond au hasard aux $12$ questions d'un QCM proposant $5$ réponses par question, dont une seule est correcte. On s'intéresse au nombre de bonnes réponses.
  corrige: |
    **1.** **Oui** : les $15$ lancers sont identiques et indépendants, et chacun n'a que deux issues. 
    $$\boxed{\text{succès : « obtenir pile »},\; p=0{,}5,\; n=15}$$

    **2.** **Non** : les tirages se font *sans remise*, donc la composition du jeu change d'un tirage à l'autre. 
    $$\boxed{\text{les épreuves ne sont pas indépendantes}}$$

    **3.** **Oui** : la population étant très grande, prélever une personne ne modifie pas sensiblement la proportion de gauchers, et l'on peut assimiler les $200$ interrogations à des épreuves identiques et indépendantes. 
    $$\boxed{\text{succès : « la personne est gauchère »},\; p=0{,}18,\; n=200}$$

    **4.** **Non** : chaque lancer a six issues, et surtout la variable étudiée est la *somme* des résultats, et non un nombre de succès. 
    $$\boxed{\text{ce n'est pas un schéma de Bernoulli}}$$

    **5.** **Oui** : chaque question donne lieu à deux issues, « bonne réponse » ou non, et les questions sont indépendantes puisque l'élève répond au hasard. 
    $$\boxed{\text{succès : « la réponse est correcte »},\; p=\frac{1}{5}=0{,}2,\; n=12}$$
- id: "t-02-13"
  feuille: "f-t-02"
  numero: 13
  partie: "Épreuves de Bernoulli et combinaisons"
  etoiles: 1
  types: [Calcul]
  mots_cles: [coefficient binomial, triangle de Pascal]
  noeuds: []
  notions: []
  page_enonce: 3
  page_corrige: 8
  enonce: |
    **1.** Recopier et compléter le triangle de Pascal jusqu'à la ligne $n=7$.

    **2.** En déduire les valeurs de $\begin{pmatrix}6\\2\end{pmatrix}$, $\begin{pmatrix}7\\3\end{pmatrix}$ et $\begin{pmatrix}7\\4\end{pmatrix}$.

    **3.** Que remarque-t-on en comparant $\begin{pmatrix}7\\3\end{pmatrix}$ et $\begin{pmatrix}7\\4\end{pmatrix}$ ? Quelle propriété du cours retrouve-t-on ?

    **4.** Vérifier sur cet exemple la relation de Pascal : $\begin{pmatrix}6\\2\end{pmatrix}+\begin{pmatrix}6\\3\end{pmatrix}=\begin{pmatrix}7\\3\end{pmatrix}$.
  corrige: |
    **1.** Chaque coefficient s'obtient en additionnant celui qui le surplombe et son voisin de gauche :

    $$\begin{array}{|c|c|c|c|c|c|c|c|c|} \hline n\backslash k & 0 & 1 & 2 & 3 & 4 & 5 & 6 & 7 \\ \hline 0 & 1 &  &  &  &  &  &  &  \\ \hline 1 & 1 & 1 &  &  &  &  &  &  \\ \hline 2 & 1 & 2 & 1 &  &  &  &  &  \\ \hline 3 & 1 & 3 & 3 & 1 &  &  &  &  \\ \hline 4 & 1 & 4 & 6 & 4 & 1 &  &  &  \\ \hline 5 & 1 & 5 & 10 & 10 & 5 & 1 &  &  \\ \hline 6 & 1 & 6 & 15 & 20 & 15 & 6 & 1 &  \\ \hline 7 & 1 & 7 & 21 & 35 & 35 & 21 & 7 & 1 \\ \hline \end{array}$$

    **2.** On lit directement dans le tableau : 
    $$\boxed{\begin{pmatrix}6\\2\end{pmatrix}=15 \qquad \begin{pmatrix}7\\3\end{pmatrix}=35 \qquad \begin{pmatrix}7\\4\end{pmatrix}=35}$$

    **3.** Ces deux coefficients sont égaux : on retrouve la relation de symétrie $\begin{pmatrix}n\\k\end{pmatrix}=\begin{pmatrix}n\\n-k\end{pmatrix}$, ici avec $n=7$ et $k=3$, puisque $7-3=4$.

    **4.** On vérifie sur le tableau : 
    $$\begin{pmatrix}6\\2\end{pmatrix}+\begin{pmatrix}6\\3\end{pmatrix}=15+20=35=\begin{pmatrix}7\\3\end{pmatrix}$$
     ce qui illustre bien la relation de Pascal.
- id: "t-02-14"
  feuille: "f-t-02"
  numero: 14
  partie: "Épreuves de Bernoulli et combinaisons"
  etoiles: 1
  types: [Calcul]
  mots_cles: [coefficient binomial, triangle de Pascal]
  noeuds: []
  notions: []
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Calculer les coefficients binomiaux suivants, en précisant à chaque fois la méthode utilisée (propriété immédiate, symétrie, triangle de Pascal ou formule explicite) :

    **a)** $\begin{pmatrix}6\\2\end{pmatrix}$

    **b)** $\begin{pmatrix}10\\1\end{pmatrix}$

    **c)** $\begin{pmatrix}8\\8\end{pmatrix}$

    **d)** $\begin{pmatrix}7\\5\end{pmatrix}$

    **e)** $\begin{pmatrix}9\\3\end{pmatrix}$

    **f)** $\begin{pmatrix}12\\11\end{pmatrix}$
  corrige: |
    **a)** Lecture dans le triangle de Pascal : $\boxed{\begin{pmatrix}6\\2\end{pmatrix}=15}$

    **b)** Propriété immédiate $\begin{pmatrix}n\\1\end{pmatrix}=n$ : $\boxed{\begin{pmatrix}10\\1\end{pmatrix}=10}$

    **c)** Propriété immédiate $\begin{pmatrix}n\\n\end{pmatrix}=1$ : $\boxed{\begin{pmatrix}8\\8\end{pmatrix}=1}$

    **d)** Par symétrie, $\begin{pmatrix}7\\5\end{pmatrix}=\begin{pmatrix}7\\2\end{pmatrix}$, que l'on lit dans le triangle : $\boxed{\begin{pmatrix}7\\5\end{pmatrix}=21}$

    **e)** Par la formule explicite : 
    $$\begin{pmatrix}9\\3\end{pmatrix}=\frac{9!}{3!\times 6!}=\frac{9\times 8\times 7}{3\times 2\times 1} =\frac{504}{6} \qquad\text{d'où}\qquad \boxed{\begin{pmatrix}9\\3\end{pmatrix}=84}$$

    **f)** Par symétrie, $\begin{pmatrix}12\\11\end{pmatrix}=\begin{pmatrix}12\\1\end{pmatrix}$ : $\boxed{\begin{pmatrix}12\\11\end{pmatrix}=12}$
- id: "t-02-15"
  feuille: "f-t-02"
  numero: 15
  partie: "Épreuves de Bernoulli et combinaisons"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [coefficient binomial, factorielle]
  noeuds: []
  notions: []
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Dans cet exercice, $n$ désigne un entier naturel non nul. On rappelle la formule explicite : 
    $$\begin{pmatrix}n\\k\end{pmatrix}=\frac{n!}{k!\,(n-k)!}$$

    **1.** Démontrer que $\begin{pmatrix}n\\1\end{pmatrix}=n$.

    **2.** Démontrer que $\begin{pmatrix}n\\n-1\end{pmatrix}=n$. Retrouver ce résultat à l'aide de la relation de symétrie.

    **3.** Démontrer que $\begin{pmatrix}n\\2\end{pmatrix}=\dfrac{n(n-1)}{2}$.

    **4.** En déduire le nombre de façons de choisir deux délégués parmi les $30$ élèves d'une classe.
  corrige: |
    **1.** On applique la formule avec $k=1$, en remarquant que $n!=n\times(n-1)!$ : 
    $$\begin{pmatrix}n\\1\end{pmatrix}=\frac{n!}{1!\times(n-1)!}=\frac{n\times(n-1)!}{(n-1)!}=\boxed{n}$$

    **2.** On applique cette fois la formule avec $k=n-1$ : 
    $$\begin{pmatrix}n\\n-1\end{pmatrix}=\frac{n!}{(n-1)!\times\big(n-(n-1)\big)!}=\frac{n!}{(n-1)!\times 1!}=\boxed{n}$$
     On peut aussi l'obtenir sans calcul par symétrie : $\begin{pmatrix}n\\n-1\end{pmatrix}=\begin{pmatrix}n\\n-(n-1)\end{pmatrix}=\begin{pmatrix}n\\1\end{pmatrix}=n$.

    **3.** On applique la formule avec $k=2$, en écrivant $n!=n(n-1)\times(n-2)!$ : 
    $$\begin{pmatrix}n\\2\end{pmatrix}=\frac{n!}{2!\times(n-2)!}=\frac{n(n-1)\times(n-2)!}{2\times(n-2)!} =\boxed{\frac{n(n-1)}{2}}$$

    **4.** Choisir deux délégués parmi $30$ élèves, c'est choisir une partie de $2$ éléments dans un ensemble qui en compte $30$, sans tenir compte de l'ordre : 
    $$\begin{pmatrix}30\\2\end{pmatrix}=\frac{30\times 29}{2}=\boxed{435\text{ façons}}$$
- id: "t-02-16"
  feuille: "f-t-02"
  numero: 16
  partie: "Épreuves de Bernoulli et combinaisons"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [arbre pondéré, épreuve de Bernoulli, schéma de Bernoulli, coefficient binomial]
  noeuds: [p-espace, p-variables, p-independance]
  notions: [espace-probabilise]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Répondre aux questions suivantes à l'aide des coefficients binomiaux, en justifiant le choix de la formule.

    **1.** De combien de façons peut-on constituer un comité de $3$ personnes au sein d'une association de $12$ membres ?

    **2.** Combien de mains différentes de $5$ cartes peut-on former avec un jeu de $32$ cartes ?

    **3.** Dans un schéma de Bernoulli à $10$ épreuves, combien de chemins de l'arbre réalisent exactement $4$ succès ?

    **4.** Combien de chemins réalisent exactement $6$ succès ? Justifier le lien avec la question précédente sans effectuer de nouveau calcul.
  corrige: |
    **1.** Un comité est une partie de $3$ membres choisis parmi $12$, sans ordre : 
    $$\begin{pmatrix}12\\3\end{pmatrix}=\frac{12\times 11\times 10}{3\times 2\times 1}=\boxed{220\text{ comités}}$$

    **2.** Une main est un ensemble de $5$ cartes, l'ordre dans lequel on les reçoit n'important pas : 
    $$\begin{pmatrix}32\\5\end{pmatrix}=\frac{32\times 31\times 30\times 29\times 28}{5\times 4\times 3\times 2\times 1} =\boxed{201\,376\text{ mains}}$$

    **3.** Choisir un chemin réalisant $4$ succès, c'est choisir quelles épreuves, parmi les $10$, seront des succès : 
    $$\begin{pmatrix}10\\4\end{pmatrix}=\frac{10\times 9\times 8\times 7}{4\times 3\times 2\times 1} =\boxed{210\text{ chemins}}$$

    **4.** D'après la relation de symétrie, $\begin{pmatrix}10\\6\end{pmatrix}=\begin{pmatrix}10\\10-6\end{pmatrix}=\begin{pmatrix}10\\4\end{pmatrix}$ : 
    $$\boxed{210\text{ chemins également}}$$
     Ce qui se comprend directement : choisir les $6$ épreuves qui sont des succès revient à choisir les $4$ épreuves qui sont des échecs.
- id: "t-02-17"
  feuille: "f-t-02"
  numero: 17
  partie: "Loi binomiale"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [indépendance, variable aléatoire, schéma de Bernoulli, loi binomiale, tirage sans remise, tirage avec remise, dés, urne]
  noeuds: [p-independance, p-variables]
  notions: [independance, variable-aleatoire, loi-variable]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Dans chacune des situations suivantes, dire si la variable aléatoire $X$ suit une loi binomiale. Si oui, préciser ses paramètres ; sinon, justifier.

    **1.** On lance $30$ fois un dé équilibré ; $X$ compte le nombre de $6$ obtenus.

    **2.** Dans un stock très important dont $5\,\%$ des articles sont défectueux, on prélève $25$ articles au hasard ; $X$ compte le nombre d'articles défectueux prélevés.

    **3.** Une urne contient $10$ jetons dont $4$ rouges. On tire $3$ jetons simultanément ; $X$ compte le nombre de jetons rouges obtenus.

    **4.** On lance une pièce équilibrée jusqu'à obtenir « pile » ; $X$ compte le nombre de lancers effectués.
  corrige: |
    **1.** Les $30$ lancers sont identiques et indépendants, et l'on ne s'intéresse qu'à deux issues : « obtenir un $6$ » ou non. 
    $$\boxed{X\sim\mathcal{B}\left(30\,;\frac{1}{6}\right)}$$

    **2.** Le stock étant très important, le prélèvement est assimilable à un tirage avec remise : les $25$ prélèvements sont alors identiques et indépendants. 
    $$\boxed{X\sim\mathcal{B}(25\,;0{,}05)}$$

    **3.** Un tirage simultané est un tirage *sans remise* : la composition de l'urne change, et les épreuves ne sont pas indépendantes. 
    $$\boxed{X\text{ ne suit pas une loi binomiale}}$$

    **4.** Le nombre d'épreuves n'est pas fixé à l'avance : on répète l'expérience jusqu'à obtenir un succès, et $X$ peut prendre n'importe quelle valeur entière. 
    $$\boxed{X\text{ ne suit pas une loi binomiale}}$$
- id: "t-02-18"
  feuille: "f-t-02"
  numero: 18
  partie: "Loi binomiale"
  etoiles: 1
  types: [Calcul]
  mots_cles: [variable aléatoire, coefficient binomial, loi binomiale]
  noeuds: [p-variables]
  notions: [variable-aleatoire, loi-variable]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    La variable aléatoire $X$ suit la loi binomiale $\mathcal{B}(10\,;0{,}3)$. En détaillant l'application de la formule du cours, calculer les probabilités suivantes, arrondies à $10^{-3}$ :

    **a)** $P(X=0)$

    **b)** $P(X=1)$

    **c)** $P(X=3)$

    **d)** $P(X=10)$
  corrige: |
    On applique la formule du théorème 1 : $P(X=k)=\begin{pmatrix}10\\k\end{pmatrix}\times 0{,}3^k\times 0{,}7^{10-k}$.

    **a)** $P(X=0)=\begin{pmatrix}10\\0\end{pmatrix}\times 0{,}3^0\times 0{,}7^{10}=1\times 1\times 0{,}7^{10}$, d'où $\boxed{P(X=0)\approx 0{,}028}$

    **b)** $P(X=1)=\begin{pmatrix}10\\1\end{pmatrix}\times 0{,}3^1\times 0{,}7^{9}=10\times 0{,}3\times 0{,}7^{9}$, d'où $\boxed{P(X=1)\approx 0{,}121}$

    **c)** $P(X=3)=\begin{pmatrix}10\\3\end{pmatrix}\times 0{,}3^3\times 0{,}7^{7}=120\times 0{,}027\times 0{,}7^{7}$, d'où $\boxed{P(X=3)\approx 0{,}267}$

    **d)** $P(X=10)=\begin{pmatrix}10\\10\end{pmatrix}\times 0{,}3^{10}\times 0{,}7^{0}=0{,}3^{10}$, d'où $\boxed{P(X=10)\approx 0{,}000}$ (plus précisément $5{,}9\times 10^{-6}$)
- id: "t-02-19"
  feuille: "f-t-02"
  numero: 19
  partie: "Loi binomiale"
  etoiles: 1
  types: [Calcul]
  mots_cles: [variable aléatoire, coefficient binomial, loi binomiale]
  noeuds: [p-variables]
  notions: [variable-aleatoire, loi-variable]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    La variable aléatoire $X$ suit la loi binomiale $\mathcal{B}(20\,;0{,}15)$.

    **1.** Calculer $P(X=0)$, arrondie à $10^{-4}$.

    **2.** En déduire $P(X\geqslant 1)$.

    **3.** Calculer $P(X\leqslant 2)$ en décomposant cette probabilité en une somme, puis vérifier le résultat à la calculatrice.

    **4.** En déduire $P(X\geqslant 3)$. *(Attention au décalage d'une unité.)*
  corrige: |
    **1.** Aucun succès signifie $20$ échecs consécutifs : 
    $$P(X=0)=\begin{pmatrix}20\\0\end{pmatrix}\times 0{,}15^0\times 0{,}85^{20}=0{,}85^{20} \qquad\text{d'où}\qquad \boxed{P(X=0)\approx 0{,}0388}$$

    **2.** L'événement $(X\geqslant 1)$ est le contraire de $(X=0)$ : 
    $$P(X\geqslant 1)=1-0{,}0388 \qquad\text{d'où}\qquad \boxed{P(X\geqslant 1)\approx 0{,}9612}$$

    **3.** L'événement $(X\leqslant 2)$ est la réunion des événements $(X=0)$, $(X=1)$ et $(X=2)$, qui sont deux à deux incompatibles : 
    $$\begin{aligned} P(X\leqslant 2) &= P(X=0)+P(X=1)+P(X=2)\\ &\approx 0{,}0388+0{,}1368+0{,}2293 \end{aligned}$$

    $$\boxed{P(X\leqslant 2)\approx 0{,}405}$$
     La calculatrice donne directement ce résultat avec `binomFRep(20 ;0.15 ;2)`.

    **4.** L'événement $(X\geqslant 3)$ est le contraire de $(X\leqslant 2)$, et non de $(X\leqslant 3)$ : 
    $$P(X\geqslant 3)=1-P(X\leqslant 2)\approx 1-0{,}405 \qquad\text{d'où}\qquad \boxed{P(X\geqslant 3)\approx 0{,}595}$$
- id: "t-02-20"
  feuille: "f-t-02"
  numero: 20
  partie: "Loi binomiale"
  etoiles: 1
  types: [Calcul]
  mots_cles: [espérance, variance, écart-type, loi binomiale, valeur la plus probable]
  noeuds: [p-esperance, p-variables]
  notions: [esperance, loi-variable]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Le diagramme en bâtons ci-dessous représente la loi binomiale $\mathcal{B}(5\,;0{,}4)$.

    ![Figure](documents/figures/f05ab5dd4fd94be3.svg)

    **1.** Retrouver par le calcul la hauteur de chacun des six bâtons, arrondie à $10^{-4}$.

    **2.** Vérifier que la somme de ces six probabilités vaut $1$.

    **3.** Calculer $E(X)$, $V(X)$ et $\sigma(X)$. Placer l'espérance sur l'axe des abscisses du diagramme.

    **4.** Quelle est la valeur la plus probable de $X$ ? Est-ce l'espérance ?
  corrige: |
    **1.** On applique la formule avec $n=5$ et $p=0{,}4$ : 
    $$\begin{aligned} P(X=0) &= 0{,}6^5\approx 0{,}0778 & P(X=1) &= 5\times 0{,}4\times 0{,}6^4\approx 0{,}2592\\ P(X=2) &= 10\times 0{,}4^2\times 0{,}6^3\approx 0{,}3456 & P(X=3) &= 10\times 0{,}4^3\times 0{,}6^2\approx 0{,}2304\\ P(X=4) &= 5\times 0{,}4^4\times 0{,}6\approx 0{,}0768 & P(X=5) &= 0{,}4^5\approx 0{,}0102 \end{aligned}$$
     On retrouve bien les hauteurs des six bâtons.

    **2.** On additionne : 
    $$0{,}0778+0{,}2592+0{,}3456+0{,}2304+0{,}0768+0{,}0102=\boxed{1}$$
     (la somme est exactement égale à $1$, les écarts n'étant dus qu'aux arrondis).

    **3.** On applique les formules de la proposition 6 : 
    $$\boxed{E(X)=5\times 0{,}4=2} \qquad \boxed{V(X)=5\times 0{,}4\times 0{,}6=1{,}2} \qquad \boxed{\sigma(X)=\sqrt{1{,}2}\approx 1{,}10}$$

    ![Figure](documents/figures/6166116722518f49.svg)

    **4.** Le bâton le plus haut est celui de $k=2$ : 
    $$\boxed{\text{la valeur la plus probable de }X\text{ est }2}$$
     Elle coïncide ici avec l'espérance, mais ce n'est pas une règle générale : l'espérance n'est d'ailleurs pas toujours un entier.
- id: "t-02-21"
  feuille: "f-t-02"
  numero: 21
  partie: "Loi binomiale"
  etoiles: 1
  types: [Calcul]
  mots_cles: [espérance, variance, écart-type, loi binomiale]
  noeuds: [p-esperance, p-variables]
  notions: [esperance, loi-variable]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Calculer l'espérance, la variance et l'écart-type (arrondi au centième) de chacune des variables aléatoires suivantes :

    **a)** $X\sim\mathcal{B}(50\,;0{,}2)$

    **b)** $Y\sim\mathcal{B}(100\,;0{,}45)$

    **c)** $Z\sim\mathcal{B}\left(12\,;\dfrac{1}{3}\right)$
  corrige: |
    On applique les formules $E(X)=np$, $V(X)=np(1-p)$ et $\sigma(X)=\sqrt{V(X)}$.

    **a)** $E(X)=50\times 0{,}2=\boxed{10}$ ; $V(X)=50\times 0{,}2\times 0{,}8=\boxed{8}$ ; $\sigma(X)=\sqrt{8}\approx\boxed{2{,}83}$

    **b)** $E(Y)=100\times 0{,}45=\boxed{45}$ ; $V(Y)=100\times 0{,}45\times 0{,}55=\boxed{24{,}75}$ ; $\sigma(Y)=\sqrt{24{,}75}\approx\boxed{4{,}97}$

    **c)** $E(Z)=12\times\dfrac{1}{3}=\boxed{4}$ ; $V(Z)=12\times\dfrac{1}{3}\times\dfrac{2}{3}=\boxed{\dfrac{8}{3}\approx 2{,}67}$ ; $\sigma(Z)=\sqrt{\dfrac{8}{3}}\approx\boxed{1{,}63}$
- id: "t-02-22"
  feuille: "f-t-02"
  numero: 22
