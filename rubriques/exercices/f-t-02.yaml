  enonce: |
    Dans une fête foraine, un stand propose le jeu suivant. Le joueur lance une fléchette sur une cible ; la probabilité qu'il atteigne la zone centrale est de $0{,}2$, indépendamment des lancers précédents. Une partie consiste en $5$ lancers, et le joueur paie $3$ euros pour jouer une partie. On note $N$ le nombre de fois où le joueur atteint la zone centrale au cours d'une partie.

    **1.** Justifier que $N$ suit une loi binomiale dont on précisera les paramètres.

    **2.** Calculer $P(N=0)$ et $P(N=1)$, arrondies à $10^{-3}$.

    **3.** Le joueur remporte $2$ euros par fléchette ayant atteint la zone centrale. On note $G$ le gain algébrique du joueur sur une partie. Exprimer $G$ en fonction de $N$.

    **4.** Calculer $E(N)$, puis en déduire $E(G)$ sans déterminer la loi de $G$.

    **5.** Le jeu est-il favorable au joueur ? Quel prix le forain devrait-il fixer pour que le jeu soit équitable ?

    **6.** Calculer $\sigma(N)$, puis $\sigma(G)$.
  corrige: |
    **1.** Une partie est constituée de $5$ lancers identiques et indépendants, chacun n'ayant que deux issues : atteindre la zone centrale (succès, de probabilité $0{,}2$) ou non. La variable $N$ compte le nombre de succès : 
    $$\boxed{N\sim\mathcal{B}(5\,;0{,}2)}$$

    **2.** On applique la formule du cours : 
    $$P(N=0)=0{,}8^5\approx\boxed{0{,}328} \qquad ; \qquad P(N=1)=5\times 0{,}2\times 0{,}8^4\approx\boxed{0{,}410}$$

    **3.** Le joueur remporte $2$ euros par succès et paie $3$ euros pour jouer : 
    $$\boxed{G=2N-3}$$

    **4.** L'espérance de $N$ vaut $E(N)=5\times 0{,}2=1$. La linéarité de l'espérance donne alors, sans qu'il soit nécessaire de déterminer la loi de $G$ : 
    $$E(G)=2\,E(N)-3=2\times 1-3 \qquad\text{d'où}\qquad \boxed{E(N)=1\text{ et }E(G)=-1}$$

    **5.** L'espérance de gain étant négative, le jeu n'est pas favorable au joueur : celui-ci perd en moyenne $1$ euro par partie. Pour un prix de $x$ euros, on aurait $E(G)=2\times 1-x$, qui s'annule pour : 
    $$\boxed{x=2\text{ euros}}$$

    **6.** On applique la formule de l'écart-type d'une loi binomiale, puis la linéarité : 
    $$\sigma(N)=\sqrt{5\times 0{,}2\times 0{,}8}=\sqrt{0{,}8}\approx\boxed{0{,}89}$$

    $$\sigma(G)=|2|\times\sigma(N)=2\sqrt{0{,}8}\approx\boxed{1{,}79}$$
     (le $-3$ n'intervient pas : ajouter une constante ne modifie pas la dispersion).
