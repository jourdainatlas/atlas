  types: [QCM, Calcul]
  mots_cles: [indépendance, espérance, épreuve de Bernoulli, schéma de Bernoulli, coefficient binomial, loi binomiale]
  noeuds: [p-independance, p-esperance, p-variables]
  notions: [independance, esperance, loi-variable]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Un QCM comporte $20$ questions indépendantes. Chaque question propose $4$ réponses, dont une seule est correcte. Un candidat répond au hasard à toutes les questions, et on note $X$ le nombre de bonnes réponses.

    **1.** Justifier que $X$ suit une loi binomiale dont on précisera les paramètres.

    **2.** Calculer $P(X=5)$, arrondie à $10^{-3}$.

    **3.** Calculer $P(X\leqslant 3)$ à l'aide de la calculatrice.

    **4.** Calculer $P(X\geqslant 10)$, puis interpréter ce résultat.

    **5.** Calculer $P(5\leqslant X\leqslant 8)$.

    **6.** Combien de bonnes réponses le candidat peut-il espérer en moyenne ?
  corrige: |
    **1.** Le candidat répond au hasard à $20$ questions indépendantes. Chaque question constitue une épreuve de Bernoulli, de succès « la réponse est correcte », de probabilité $\dfrac{1}{4}=0{,}25$ puisqu'une seule des quatre réponses convient. Ces épreuves étant identiques et indépendantes : 
    $$\boxed{X\sim\mathcal{B}(20\,;0{,}25)}$$

    **2.** On applique la formule du cours : 
    $$P(X=5)=\begin{pmatrix}20\\5\end{pmatrix}\times 0{,}25^5\times 0{,}75^{15}=15\,504\times 0{,}25^5\times 0{,}75^{15}$$

    $$\boxed{P(X=5)\approx 0{,}202}$$

    **3.** Avec `binomFRep(20 ;0.25 ;3)` : 
    $$\boxed{P(X\leqslant 3)\approx 0{,}225}$$

    **4.** L'événement $(X\geqslant 10)$ est le contraire de $(X\leqslant 9)$ : 
    $$P(X\geqslant 10)=1-P(X\leqslant 9) \qquad\text{d'où}\qquad \boxed{P(X\geqslant 10)\approx 0{,}014}$$
     Un candidat répondant totalement au hasard n'a donc qu'environ $1{,}4\,\%$ de chances d'obtenir la moyenne : le hasard ne remplace pas les révisions.

    **5.** On ramène l'encadrement à des probabilités cumulées, en prenant garde au décalage : 
    $$P(5\leqslant X\leqslant 8)=P(X\leqslant 8)-P(X\leqslant 4)$$

    $$\boxed{P(5\leqslant X\leqslant 8)\approx 0{,}544}$$

    **6.** L'espérance donne le nombre moyen de bonnes réponses : 
    $$E(X)=20\times 0{,}25=\boxed{5\text{ bonnes réponses}}$$
- id: "t-02-23"
