  enonce: |
    Soit $p$ un nombre premier. Le *groupe affine* de $\mathbb{F}_{p}$ est 
    $$\mathrm{Aff}(\mathbb{F}_{p})=\big\{\varphi_{a,b} : x \mapsto ax+b \;\big|\; a \in \mathbb{F}_{p}^{*}, \; b \in \mathbb{F}_{p}\big\}$$
     muni de la composition.

    **1.** Démontrer que c'est un groupe d'ordre $p(p-1)$, non abélien dès que $p \geqslant 3$.

    **2.** Démontrer que le sous-groupe $T$ des translations est distingué, isomorphe à $\mathbb{Z}/p\mathbb{Z}$, et que le quotient est isomorphe à $\mathbb{F}_{p}^{*}$.

    **3.** En déduire que $\mathrm{Aff}(\mathbb{F}_{p})$ est résoluble, en exhibant une suite de résolubilité.

    **4.** Déterminer $Z\big(\mathrm{Aff}(\mathbb{F}_{p})\big)$ pour $p \geqslant 3$.

    **5.** Traiter le cas $p=3$ : quel groupe déjà rencontré reconnaît-on ?

    **6.** Faire agir $\mathrm{Aff}(\mathbb{F}_{p})$ sur $\mathbb{F}_{p}$. Démontrer que l'action est transitive, et que le stabilisateur de $0$ est isomorphe à $\mathbb{F}_{p}^{*}$. Vérifier la formule orbite-stabilisateur.

    Pour $p=5$, ce groupe réapparaîtra à l'exercice 37 comme groupe de Galois de $X^{5}-2$ sur $\mathbb{Q}$.
  corrige: |
    **1.** La composée vérifie $\varphi_{a,b} \circ \varphi_{a',b'}=\varphi_{aa',\,ab'+b}$, ce qui montre la stabilité ; l'inverse est $\varphi_{a^{-1},\,-a^{-1}b}$. Le couple $(a\,;b)$ décrit $\mathbb{F}_{p}^{*} \times \mathbb{F}_{p}$ : 
    $$\boxed{\big|\mathrm{Aff}(\mathbb{F}_{p})\big|=p(p-1)}$$
     La formule ci-dessus n'est pas symétrique dès que $p \geqslant 3$ : avec $\varphi_{2,0}$ et $\varphi_{1,1}$, on obtient $\varphi_{2,2}$ dans un sens et $\varphi_{2,1}$ dans l'autre.

    **2.** On a $\varphi_{a,b} \circ \varphi_{1,t} \circ \varphi_{a,b}^{-1}=\varphi_{1,at}$, qui est encore une translation. L'application $\varphi_{a,b} \mapsto a$ est un morphisme surjectif sur $\mathbb{F}_{p}^{*}$, de noyau $T$ : 
    $$\boxed{T \simeq \mathbb{Z}/p\mathbb{Z} \text{ est distingué, et } \mathrm{Aff}(\mathbb{F}_{p})/T \simeq \mathbb{F}_{p}^{*} \simeq \mathbb{Z}/(p-1)\mathbb{Z}}$$

    **3.** La suite $\{\mathrm{id}\} \trianglelefteq T \trianglelefteq \mathrm{Aff}(\mathbb{F}_{p})$ a pour quotients successifs $\mathbb{Z}/p\mathbb{Z}$ et $\mathbb{Z}/(p-1)\mathbb{Z}$, tous deux abéliens. 
    $$\boxed{\mathrm{Aff}(\mathbb{F}_{p}) \text{ est résoluble.}}$$

    **4.** Si $\varphi_{a,b}$ est central, il commute avec toute translation, ce qui impose $at=t$ pour tout $t$, donc $a=1$ ; et il commute avec $\varphi_{c,0}$ pour $c \neq 1$, ce qui impose $b=cb$, donc $b=0$. 
    $$\boxed{Z\big(\mathrm{Aff}(\mathbb{F}_{p})\big)=\{\mathrm{id}\} \text{ pour } p \geqslant 3.}$$

    **5.** Pour $p=3$, l'ordre vaut $3 \times 2=6$, et le groupe n'est pas abélien. 
    $$\boxed{\mathrm{Aff}(\mathbb{F}_{3}) \simeq \mathfrak{S}_{3}, \text{ d'après l'unicité établie à l'exercice 4.}}$$

    **6.** Pour $x$, $y \in \mathbb{F}_{p}$, la translation $\varphi_{1,y-x}$ envoie $x$ sur $y$ : l'action est transitive, l'orbite de $0$ est $\mathbb{F}_{p}$ tout entier. Le stabilisateur de $0$ est formé des $\varphi_{a,0}$, c'est-à-dire des homothéties. 
    $$\boxed{\big|\mathcal{O}(0)\big| \times \big|\mathrm{Stab}(0)\big|=p \times (p-1)=\big|\mathrm{Aff}(\mathbb{F}_{p})\big| \quad \checkmark}$$
- id: "m-galois-16"
  feuille: "f-m-galois"
  numero: 16
  partie: "Chapitre 2 - Quotients, actions et résolubilité"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [groupes, morphismes de groupes, sous-groupes distingués et quotients, groupes résolubles]
  noeuds: [a-groupe, a-morphisme, a-distingue, a-quotient, gs-radicaux]
  notions: [sous-groupe-distingue, groupe-quotient, groupe-resoluble]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    On pose $G=\mathrm{SL}_{2}(\mathbb{F}_{3})$, groupe des matrices de $\mathcal{M}_{2}(\mathbb{F}_{3})$ de déterminant $1$.

    **1.** Démontrer que $|G|=24$. On comptera d'abord les couples $(u\,;v)$ de vecteurs formant une base de $\mathbb{F}_{3}^{2}$, puis on tiendra compte de la condition sur le déterminant.

    **2.** Démontrer que $-I_{2}$ est le *seul* élément d'ordre $2$ de $G$. On résoudra $A^{2}=I_{2}$ avec $\det A=1$.

    **3.** Combien $\mathfrak{S}_{4}$ possède-t-il d'éléments d'ordre $2$ ? En déduire que $G$ et $\mathfrak{S}_{4}$ ne sont pas isomorphes, bien qu'ils soient de même ordre.

    **4.** Démontrer que $\{\pm I_{2}\}$ est distingué dans $G$, et que le quotient est d'ordre $12$. On admettra qu'il est isomorphe à $\mathfrak{A}_{4}$.

    **5.** Le groupe $G$ est-il résoluble ? Justifier à l'aide du théorème 2.8 et de la question précédente.

    **6.** Pourquoi cet exemple montre-t-il que l'ordre d'un groupe ne détermine pas sa structure, même lorsqu'il est petit ?
  corrige: |
    **1.** Une matrice de $\mathrm{GL}_{2}(\mathbb{F}_{3})$ est déterminée par une base $(u\,;v)$ de $\mathbb{F}_{3}^{2}$ : il y a $3^{2}-1=8$ choix pour $u$ non nul, puis $3^{2}-3=6$ choix pour $v$ hors de la droite engendrée par $u$, soit $48$ matrices. Le déterminant est un morphisme surjectif de $\mathrm{GL}_{2}(\mathbb{F}_{3})$ sur $\mathbb{F}_{3}^{*}$, d'ordre $2$ : 
    $$\boxed{\big|\mathrm{SL}_{2}(\mathbb{F}_{3})\big|=\frac{48}{2}=24}$$

    **2.** Soit $A \in G$ avec $A^{2}=I_{2}$. Le polynôme $X^{2}-1=(X-1)(X+1)$ annule $A$ et est scindé à racines simples sur $\mathbb{F}_{3}$, donc $A$ est diagonalisable de valeurs propres dans $\{\pm 1\}$. Comme $\det A=1$, ces valeurs propres sont $(1\,;1)$ ou $(-1\,;-1)$, d'où $A=I_{2}$ ou $A=-I_{2}$. 
    $$\boxed{-I_{2} \text{ est le seul élément d'ordre } 2 \text{ de } \mathrm{SL}_{2}(\mathbb{F}_{3}).}$$

    **3.** L'exercice 3 a dénombré $6+3=9$ éléments d'ordre $2$ dans $\mathfrak{S}_{4}$. 
    $$\boxed{\mathrm{SL}_{2}(\mathbb{F}_{3}) \not\simeq \mathfrak{S}_{4}, \text{ bien que tous deux soient d'ordre } 24.}$$
     *À retenir :* l'ordre ne détermine pas le groupe. Il existe en fait quinze groupes d'ordre $24$ à isomorphisme près.

    **4.** Le sous-groupe $\{\pm I_{2}\}$ est le centre de $G$, donc distingué, et le quotient est d'ordre $\dfrac{24}{2}=12$. 
    $$\boxed{\mathrm{SL}_{2}(\mathbb{F}_{3})/\{\pm I_{2}\} \simeq \mathfrak{A}_{4}}$$

    **5.** Le groupe $\mathfrak{A}_{4}$ est résoluble, avec la suite $\{\mathrm{id}\} \trianglelefteq V \trianglelefteq \mathfrak{A}_{4}$, et $\{\pm I_{2}\} \simeq \mathbb{Z}/2\mathbb{Z}$ l'est aussi. Le théorème 2.8 assure qu'une extension d'un groupe résoluble par un groupe résoluble est résoluble. 
    $$\boxed{\mathrm{SL}_{2}(\mathbb{F}_{3}) \text{ est résoluble.}}$$

    **6.** 
    $$\boxed{\begin{array}{l} \text{Deux groupes de même ordre peuvent différer par la répartition des ordres} \\[1mm] \text{de leurs éléments, par leur centre, ou par leurs sous-groupes distingués.} \end{array}}$$
     Ici $Z\big(\mathrm{SL}_{2}(\mathbb{F}_{3})\big)$ est d'ordre $2$ alors que $Z(\mathfrak{S}_{4})$ est trivial : c'est une seconde façon, indépendante de la première, de séparer les deux groupes.
