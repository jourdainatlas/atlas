  enonce: |
    **1.** Déterminer tous les sous-corps de $\mathbb{F}_{64}$, et tracer le treillis correspondant.

    **2.** Même question pour $\mathbb{F}_{3^{12}}$.
  corrige: |
    **1.** $64=2^{6}$ et les diviseurs de $6$ sont $1$, $2$, $3$, $6$ : 
    $$\boxed{\mathbb{F}_{2} \subset \mathbb{F}_{4} \subset \mathbb{F}_{64} \quad\text{et}\quad \mathbb{F}_{2} \subset \mathbb{F}_{8} \subset \mathbb{F}_{64}, \text{ avec } \mathbb{F}_{4} \not\subseteq \mathbb{F}_{8}.}$$
     Le treillis reproduit celui des diviseurs de $6$.

    **2.** Les diviseurs de $12$ sont au nombre de six : 
    $$\boxed{\mathbb{F}_{3}, \; \mathbb{F}_{3^{2}}, \; \mathbb{F}_{3^{3}}, \; \mathbb{F}_{3^{4}}, \; \mathbb{F}_{3^{6}}, \; \mathbb{F}_{3^{12}}}$$
- id: "m-galois-30"
  feuille: "f-m-galois"
  numero: 30
  partie: "Chapitre 5 - Séparabilité, normalité, corps finis"
  etoiles: 2
  types: [Calcul]
  mots_cles: [corps finis, théorème de Wilson]
  noeuds: [gs-corps-finis]
  notions: [corps-fini]
  page_enonce: 8
  page_corrige: 19
  enonce: |
    **1.** Déterminer tous les générateurs de $\mathbb{F}_{7}^{*}$, puis de $\mathbb{F}_{11}^{*}$.

    **2.** Combien $\mathbb{F}_{q}^{*}$ possède-t-il de générateurs ? Exprimer la réponse à l'aide de l'indicatrice d'Euler.

    **3.** Démontrer le théorème de Wilson : $(p-1)! \equiv -1 \; [p]$ pour $p$ premier. On appariera chaque élément avec son inverse.

    **4.** En déduire la valeur de $6!$ modulo $7$, et vérifier par le calcul direct.
  corrige: |
    **1.** On teste les puissances successives : 
    $$\boxed{\text{Générateurs de } \mathbb{F}_{7}^{*} : \{3\,;5\} \qquad \text{de } \mathbb{F}_{11}^{*} : \{2\,;6\,;7\,;8\}}$$
     On en compte $\varphi(6)=2$ et $\varphi(10)=4$, conformément à la question suivante.

    **2.** Un groupe cyclique d'ordre $m$ possède $\varphi(m)$ générateurs : 
    $$\boxed{\mathbb{F}_{q}^{*} \text{ possède } \varphi(q-1) \text{ générateurs.}}$$

    **3.** Dans le produit $(p-1)!$, chaque élément de $\mathbb{F}_{p}^{*}$ apparaît une fois. On apparie $x$ avec $x^{-1}$ : les paires se simplifient, et il ne reste que les éléments égaux à leur inverse, c'est-à-dire les racines de $X^{2}-1$, à savoir $1$ et $-1$. 
    $$\boxed{(p-1)! \equiv 1 \times (-1)=-1 \; [p]}$$

    **4.** $6!=720=102 \times 7+6$, et $6 \equiv -1 \; [7]$ : 
    $$\boxed{6! \equiv -1 \; [7] \quad \checkmark}$$
- id: "m-galois-31"
  feuille: "f-m-galois"
  numero: 31
  partie: "Chapitre 5 - Séparabilité, normalité, corps finis"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [extensions de corps, cyclotomie]
  noeuds: [gs-extensions, galois-cyclotomie]
  notions: [extension-corps, polynome-cyclotomique]
  source: "Cambridge, Part II Galois Theory, feuille 3 (2013), exercice 6"
  page_enonce: 8
  page_corrige: 20
  enonce: |
    Soit $p$ un nombre premier impair. Démontrer que $-1$ est un carré dans $\mathbb{F}_{p}$ si et seulement si $p \equiv 1 \;[4]$, puis que $2$ est un carré dans $\mathbb{F}_{p}$ si et seulement si $p \equiv \pm 1 \;[8]$. On pourra considérer une racine primitive huitième de l'unité $x$ dans une extension de $\mathbb{F}_{p}$, et l'élément $x+x^{-1}$.
  corrige: |
    *Le cas de $-1$.* Le nombre $-1$ est un carré dans $\mathbb{F}_{p}$ si et seulement si $\mathbb{F}_{p}^{*}$ contient un élément d'ordre $4$. Ce groupe étant cyclique d'ordre $p-1$ (théorème 5.4), cela équivaut à $4 \mid p-1$. 
    $$\boxed{-1 \text{ est un carré dans } \mathbb{F}_{p} \iff p \equiv 1 \;[4]}$$

    *Le cas de $2$.* Comme $p$ est impair, $8$ divise $p^{2}-1$, et le groupe cyclique $\mathbb{F}_{p^{2}}^{*}$ contient un élément $x$ d'ordre $8$ ; on a $x^{4}=-1$, seul élément d'ordre $2$ d'un corps. Posons $y=x+x^{-1}$. Alors : 
    $$y^{2}=x^{2}+2+x^{-2}=2+x^{-2}\big(x^{4}+1\big)=2$$
     Les racines carrées de $2$ dans $\mathbb{F}_{p^{2}}$ sont donc $\pm y$, et $2$ est un carré dans $\mathbb{F}_{p}$ si et seulement si $y \in \mathbb{F}_{p}$, c'est-à-dire $y^{p}=y$. Le Frobenius étant un morphisme, $y^{p}=x^{p}+x^{-p}$, qui ne dépend que de $p$ modulo $8$.

    Si $p \equiv \pm 1 \;[8]$, alors $x^{p}=x^{\pm 1}$ et $y^{p}=y$. Si $p \equiv \pm 3 \;[8]$, alors $y^{p}=x^{3}+x^{-3}=x^{3}+x^{5}$ ; comme $x^{4}=-1$, on a $x^{5}=-x$ et $x^{3}=-x^{-1}$, d'où $y^{p}=-y \neq y$, puisque $y \neq 0$. 
    $$\boxed{2 \text{ est un carré dans } \mathbb{F}_{p} \iff p \equiv \pm 1 \;[8]}$$
     On retrouve ainsi, par la seule théorie des corps finis, les deux « lois complémentaires » de la réciprocité quadratique.
- id: "m-galois-32"
  feuille: "f-m-galois"
  numero: 32
  partie: "Chapitre 5 - Séparabilité, normalité, corps finis"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [groupes, corps de décomposition, cyclotomie]
  noeuds: [a-groupe, gs-decomposition, galois-cyclotomie]
  notions: [corps-decomposition, polynome-cyclotomique]
  source: "J. S. Milne, Fields and Galois Theory, exercice 2-4 ; P. Armana, devoir corrigé de M1 (Paris 7, 2006-2007)"
  page_enonce: 8
  page_corrige: 20
  enonce: |
    Soit $p$ un nombre premier et $n \geqslant 1$ un entier premier à $p$. Démontrer que le corps de décomposition de $X^{n}-1$ sur $\mathbb{F}_{p}$ est $\mathbb{F}_{p^{d}}$, où $d$ est l'ordre de $\overline{p}$ dans le groupe $\big(\mathbb{Z}/n\mathbb{Z}\big)^{*}$. Déterminer le corps engendré sur $\mathbb{F}_{3}$ par une racine primitive septième de l'unité. Que devient le corps de décomposition lorsqu'on remplace $X^{n}-1$ par $X^{p^{m}}-1$ ?
  corrige: |
    Comme $p$ ne divise pas $n$, le polynôme $X^{n}-1$ est premier avec sa dérivée $nX^{n-1}$ : il est séparable, et ses racines forment dans son corps de décomposition $L$ un sous-groupe $\mu_{n}$ de $L^{*}$ d'ordre $n$, cyclique d'après le théorème 5.4. Le corps $L$ est fini, égal à $\mathbb{F}_{p}(\mu_{n})$.

    Un corps $\mathbb{F}_{p^{k}}$ contient $n$ racines $n$-ièmes de l'unité si et seulement si son groupe multiplicatif, cyclique d'ordre $p^{k}-1$, possède un sous-groupe d'ordre $n$, c'est-à-dire si $n \mid p^{k}-1$, soit $p^{k} \equiv 1 \;[n]$. Cela équivaut à dire que l'ordre $d$ de $\overline{p}$ dans $\big(\mathbb{Z}/n\mathbb{Z}\big)^{*}$ divise $k$. Le plus petit corps convenable est donc $\mathbb{F}_{p^{d}}$. 
    $$\boxed{\text{Le corps de décomposition de } X^{n}-1 \text{ sur } \mathbb{F}_{p} \text{ est } \mathbb{F}_{p^{d}}, \ d=\text{ordre de } \overline{p} \text{ dans } \big(\mathbb{Z}/n\mathbb{Z}\big)^{*}.}$$
     Pour $p=3$ et $n=7$, les puissances de $3$ modulo $7$ sont $3$, $2$, $6$, $4$, $5$, $1$ : l'ordre vaut $6$. Une racine primitive septième $\zeta$ engendre $\mu_{7}$, donc $\mathbb{F}_{3}(\zeta)=\mathbb{F}_{3}(\mu_{7})$. 
    $$\boxed{\mathbb{F}_{3}(\zeta)=\mathbb{F}_{3^{6}}=\mathbb{F}_{729}}$$
     Enfin, d'après le rêve du débutant, $X^{p^{m}}-1=(X-1)^{p^{m}}$ : ce polynôme est déjà scindé sur $\mathbb{F}_{p}$, avec l'unique racine $1$ de multiplicité $p^{m}$. 
    $$\boxed{\text{Le corps de décomposition de } X^{p^{m}}-1 \text{ sur } \mathbb{F}_{p} \text{ est } \mathbb{F}_{p} \text{ lui-même.}}$$
- id: "m-galois-33"
  feuille: "f-m-galois"
  numero: 33
  partie: "Chapitre 5 - Séparabilité, normalité, corps finis"
  etoiles: 3
