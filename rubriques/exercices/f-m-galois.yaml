  notions: [polynome-irreductible, extension-corps]
  source: "M. Reversat et B. Zhang, Cours de théorie des corps (Université de Toulouse), exercice 2.5"
  page_enonce: 7
  page_corrige: 18
  enonce: |
    Soit $K$ un corps et $f \in K[X]$ un polynôme de degré $p$ premier. On suppose que, pour toute extension $L$ de $K$, dès que $f$ possède une racine dans $L$, il est scindé sur $L$. Démontrer que $f$ est irréductible sur $K$ ou possède une racine dans $K$.
  corrige: |
    Soit $g$ un facteur irréductible de $f$ de degré $d$ minimal, et $L=K[X]/(g)$ un corps de rupture de $g$, de degré $d$ sur $K$. Le polynôme $f$ y possède une racine, donc il y est scindé par hypothèse. Chaque facteur irréductible $h$ de $f$ possède alors une racine $\beta \in L$, et $K(\beta) \subseteq L$ : par multiplicativité des degrés, $\deg h=[K(\beta):K]$ divise $[L:K]=d$. Par minimalité de $d$, on obtient $\deg h=d$.

    Tous les facteurs irréductibles de $f$ ont donc le même degré $d$, et $d$ divise $\deg f=p$. Ainsi $d=1$, auquel cas $f$ a une racine dans $K$, ou $d=p$, auquel cas $f$ est irréductible. 
    $$\boxed{f \text{ est irréductible sur } K \text{ ou possède une racine dans } K.}$$
     Sans l'hypothèse de primalité, la conclusion tombe : sur $\mathbb{Q}$, le polynôme $\big(X^{2}-2\big)^{2}$, de degré $4$, vérifie l'hypothèse, puisque toute extension contenant l'une des racines $\pm\sqrt{2}$ contient l'autre ; il n'est pourtant ni irréductible, ni pourvu d'une racine rationnelle.
- id: "m-galois-26"
  feuille: "f-m-galois"
