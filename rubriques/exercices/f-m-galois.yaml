  enonce: |
    **1.** Démontrer que toute extension de degré $2$ est normale.

    **2.** Donner un exemple de tour $K \subseteq M \subseteq L$ où $L/M$ et $M/K$ sont normales sans que $L/K$ le soit. On pourra prendre $K=\mathbb{Q}$, $M=\mathbb{Q}\big(\sqrt{2}\big)$, $L=\mathbb{Q}\big(\sqrt[4]{2}\big)$.
  corrige: |
    **1.** Soit $[L:K]=2$ et $P$ irréductible sur $K$ ayant une racine $\alpha \in L$. Alors $\deg P \mid 2$ ; si $\deg P=1$ c'est fini, si $\deg P=2$ alors $L=K(\alpha)$ et $P=(X-\alpha)(X-\beta)$ avec $\beta=-\alpha-\dfrac{a_{1}}{a_{2}} \in L$. 
    $$\boxed{\text{Toute extension de degré } 2 \text{ est normale.}}$$

    **2.** Avec $K=\mathbb{Q}$, $M=\mathbb{Q}\big(\sqrt{2}\big)$, $L=\mathbb{Q}\big(\sqrt[4]{2}\big)$ : les deux étages sont de degré $2$, donc normaux. Mais $X^{4}-2$ est irréductible sur $\mathbb{Q}$, possède la racine $\sqrt[4]{2} \in L$, et ses racines $\pm\mathrm{i}\sqrt[4]{2}$ ne sont pas réelles. 
    $$\boxed{L/\mathbb{Q} \text{ n'est pas normale : la normalité n'est pas transitive.}}$$
- id: "m-galois-29"
