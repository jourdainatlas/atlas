  page_enonce: 6
  page_corrige: 10
  enonce: |
    **1.** Effectuer la division euclidienne de $X^{4}+X^{3}+2X+1$ par $X^{2}+1$ dans $\mathbb{Q}[X]$.

    **2.** Déterminer le PGCD de $X^{4}-1$ et $X^{6}-1$ dans $\mathbb{Q}[X]$, puis une relation de Bézout.

    **3.** Donner un polynôme de degré $2$ ayant quatre racines dans $\mathbb{Z}/8\mathbb{Z}$. Pourquoi n'y a-t-il pas contradiction ?
  corrige: |
    **1.** On pose la division : 
    $$\boxed{X^{4}+X^{3}+2X+1=\big(X^{2}+1\big)\big(X^{2}+X-1\big)+(X+2)}$$

    **2.** L'algorithme d'Euclide donne $X^{6}-1=X^{2}\big(X^{4}-1\big)+\big(X^{2}-1\big)$, puis $X^{4}-1=\big(X^{2}+1\big)\big(X^{2}-1\big)$ : le dernier reste non nul est $X^{2}-1$, et la première égalité fournit directement la relation de Bézout. 
    $$\boxed{\mathrm{pgcd}=X^{2}-1 \qquad\text{avec}\qquad -X^{2}\big(X^{4}-1\big)+1 \cdot \big(X^{6}-1\big)=X^{2}-1}$$

    **3.** Le polynôme $X^{2}-1$ admet dans $\mathbb{Z}/8\mathbb{Z}$ les quatre racines $\overline{1}$, $\overline{3}$, $\overline{5}$, $\overline{7}$. 
    $$\boxed{\text{Aucune contradiction : } \mathbb{Z}/8\mathbb{Z} \text{ n'est pas intègre, car } \overline{2}\,\overline{4}=\overline{0}.}$$
- id: "m-galois-19"
  feuille: "f-m-galois"
  numero: 19
  partie: "Chapitre 3 - Anneaux, corps et polynômes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [irréductibilité, cyclotomie]
  noeuds: [z-polynomes, galois-cyclotomie]
  notions: [polynome-irreductible, polynome-cyclotomique]
  page_enonce: 6
  page_corrige: 11
  enonce: |
    **1.** Les polynômes suivants sont-ils irréductibles sur $\mathbb{Q}$ ? Justifier par le critère le plus économique.

    **(a)** $X^{2}-2$

    **(b)** $X^{3}-3X-1$

    **(c)** $X^{4}+1$

    **(d)** $X^{5}-4X+2$

    **(e)** $X^{4}+X^{3}+X^{2}+X+1$

    **(f)** $X^{4}+4$

    **2.** Démontrer que $X^{4}+1$ est irréductible sur $\mathbb{Q}$ mais réductible sur $\mathbb{F}_{p}$ pour *tout* nombre premier $p$. On traitera d'abord le cas $p=2$.

    **3.** Énoncer le critère d'Eisenstein et l'appliquer à $\Phi_{p}(X)=X^{p-1}+\dots+X+1$ après le changement de variable $X \mapsto X+1$.

    **4.** Démontrer que la réduction modulo $p$ fournit un critère d'irréductibilité, et l'appliquer à $X^{3}+X+1$ sur $\mathbb{Q}$ en réduisant modulo $2$.
  corrige: |
    **1.** C'est la première question d'irréductibilité du document. Avant de traiter les six polynômes, on rassemble les quatre outils dont on aura besoin, chacun avec sa justification ; on verra ensuite comment choisir le plus économique.

    *Outil 1 : le degré $2$ ou $3$.* Sur un corps $K$, un polynôme de degré $2$ ou $3$ est réductible si et seulement s'il a une racine dans $K$. En effet, une factorisation non triviale $P = UV$ vérifie $\deg U + \deg V = \deg P \in \{2\,;3\}$ avec $\deg U, \deg V \geqslant 1$ : l'un des deux facteurs est donc de degré $1$, de la forme $c(X-a)$, et $a$ est racine de $P$. Réciproquement, si $a$ est racine, $X-a$ divise $P$ d'après la proposition 3.6, et le quotient est de degré au moins $1$.

    *Piège.* Dès le degré $4$, l'argument tombe : un polynôme peut se factoriser en deux facteurs de degré $2$ sans avoir aucune racine. Les polynômes (c) et (f) ci-dessous en donnent l'illustration.

    *Outil 2 : les racines rationnelles.* Soit $P = a_{n}X^{n}+\dots+a_{1}X+a_{0} \in \mathbb{Z}[X]$, et $\frac{r}{s}$ une racine rationnelle écrite sous forme irréductible. Alors $r \mid a_{0}$ et $s \mid a_{n}$. En effet, en multipliant l'égalité $P\big(\tfrac{r}{s}\big) = 0$ par $s^{n}$, on obtient 
    $$a_{n}r^{n} + a_{n-1}r^{n-1}s + \dots + a_{1}rs^{n-1} + a_{0}s^{n} = 0$$
     L'entier $r$ divise tous les termes sauf le dernier, donc il divise $a_{0}s^{n}$ ; comme $r$ est premier avec $s$, il divise $a_{0}$. Le même raisonnement, en isolant le premier terme, montre que $s$ divise $a_{n}r^{n}$, donc $a_{n}$. En particulier, les racines rationnelles d'un polynôme *unitaire* à coefficients entiers sont des entiers qui divisent $a_{0}$ : il n'y a qu'un nombre fini de candidats à tester.

    *Outil 3 : le critère d'Eisenstein.* Soit $P = a_{n}X^{n}+\dots+a_{0} \in \mathbb{Z}[X]$ et $p$ un nombre premier. Si $p$ divise $a_{0}, \dots, a_{n-1}$, ne divise pas $a_{n}$, et si $p^{2}$ ne divise pas $a_{0}$, alors $P$ est irréductible sur $\mathbb{Q}$. C'est le critère énoncé à la question 3, qui fait l'objet du théorème 3.6 ; il a l'avantage de s'appliquer en tout degré.

    *Outil 4 : la translation.* Pour $a \in \mathbb{Q}$, le polynôme $P(X)$ est irréductible sur $\mathbb{Q}$ si et seulement si $P(X+a)$ l'est. En effet, l'application $\tau : U(X) \mapsto U(X+a)$ est un morphisme d'anneaux de $\mathbb{Q}[X]$ dans lui-même, bijectif de réciproque $U(X) \mapsto U(X-a)$, et qui conserve le degré puisque le coefficient dominant est inchangé. Une factorisation non triviale $P = UV$ donne donc la factorisation non triviale $\tau(P) = \tau(U)\,\tau(V)$, et inversement. Ce changement de variable sert à rendre le critère d'Eisenstein applicable quand il ne l'est pas directement.

    *Le choix du critère.* On procède dans l'ordre suivant : en degré $2$ ou $3$, on cherche les racines rationnelles, ce qui règle la question ; en degré plus grand, on essaie Eisenstein directement, puis après une translation ; si rien ne fonctionne, on cherche une factorisation explicite.

    **(a)** Le polynôme $X^{2}-2$ est de degré $2$ : d'après l'outil 1, il suffit de vérifier qu'il n'a pas de racine rationnelle. Il est unitaire, donc l'outil 2 limite les candidats aux diviseurs de $2$, à savoir $\pm 1$ et $\pm 2$. Or $(\pm 1)^{2}-2 = -1$ et $(\pm 2)^{2}-2 = 2$ : aucun ne convient. 
    $$\boxed{X^{2}-2 \text{ est irréductible sur } \mathbb{Q}.}$$
     On vient simplement de redémontrer l'irrationalité de $\sqrt{2}$.

    **(b)** Le polynôme $P = X^{3}-3X-1$ est de degré $3$ et unitaire, de terme constant $-1$ : ses seules racines rationnelles possibles sont $\pm 1$. On calcule $P(1) = 1-3-1 = -3$ et $P(-1) = -1+3-1 = 1$, tous deux non nuls. 
    $$\boxed{X^{3}-3X-1 \text{ est irréductible sur } \mathbb{Q}.}$$

    **(c)** Le polynôme $X^{4}+1$ est de degré $4$ : l'outil 1 ne s'applique plus. Il n'a aucune racine réelle, puisque $x^{4}+1 \geqslant 1$, mais cela ne prouve rien, comme le montrera (f). Le critère d'Eisenstein ne s'applique pas directement : le terme constant $1$ n'est divisible par aucun nombre premier. On effectue donc la translation $X \mapsto X+1$ : 
    $$(X+1)^{4}+1 = X^{4}+4X^{3}+6X^{2}+4X+2$$
     Avec $p = 2$ : les coefficients $4$, $6$, $4$ et $2$ sont pairs, le coefficient dominant $1$ ne l'est pas, et le terme constant $2$ n'est pas divisible par $4$. Le critère d'Eisenstein s'applique, et l'outil 4 ramène la conclusion au polynôme de départ. 
    $$\boxed{X^{4}+1 \text{ est irréductible sur } \mathbb{Q}.}$$

    **(d)** Le polynôme $X^{5}-4X+2$ relève directement d'Eisenstein avec $p = 2$ : ses coefficients sont, dans l'ordre des degrés décroissants, $1$, $0$, $0$, $0$, $-4$ et $2$. Le nombre $2$ divise tous les coefficients sauf le dominant, et $4$ ne divise pas le terme constant $2$. 
    $$\boxed{X^{5}-4X+2 \text{ est irréductible sur } \mathbb{Q}.}$$
     En degré $5$, aucune recherche de racines ne suffirait : c'est ici qu'Eisenstein montre toute son économie. Il possède trois racines réelles, et la proposition 7.5 montrera que son groupe de Galois est $\mathfrak{S}_{5}$ : il n'est pas résoluble par radicaux.

    **(e)** Le polynôme $X^{4}+X^{3}+X^{2}+X+1$ est le polynôme cyclotomique $\Phi_{5} = \dfrac{X^{5}-1}{X-1}$. Son terme constant vaut $1$, donc Eisenstein ne s'applique pas directement ; après la translation $X \mapsto X+1$ : 
    $$\Phi_{5}(X+1) = \frac{(X+1)^{5}-1}{X} = X^{4}+5X^{3}+10X^{2}+10X+5$$
     Avec $p = 5$ : les coefficients $5$, $10$, $10$ et $5$ sont multiples de $5$, le coefficient dominant ne l'est pas, et $25$ ne divise pas $5$. 
    $$\boxed{\Phi_{5} = X^{4}+X^{3}+X^{2}+X+1 \text{ est irréductible sur } \mathbb{Q}.}$$
     C'est le cas $p = 5$ de la question 3, conformément au théorème 3.6.

    **(f)** Le polynôme $X^{4}+4$ n'a pas de racine réelle, puisque $x^{4}+4 \geqslant 4$, et Eisenstein ne s'applique pas : le seul candidat est $p = 2$, mais $4 = 2^{2}$ est divisible par $p^{2}$. Cherchons alors une factorisation, en complétant le carré : 
    $$X^{4}+4 = \big(X^{4}+4X^{2}+4\big)-4X^{2} = \big(X^{2}+2\big)^{2}-(2X)^{2}$$
     C'est une différence de deux carrés, qui se factorise : 
    $$\boxed{X^{4}+4=\big(X^{2}-2X+2\big)\big(X^{2}+2X+2\big)}$$
     Le polynôme est donc **réductible**, alors qu'il n'a aucune racine rationnelle. Chacun des deux facteurs est irréductible sur $\mathbb{Q}$, étant de degré $2$ et de discriminant $4-8 = -4 < 0$. C'est l'identité de Sophie Germain, $a^{4}+4b^{4} = \big(a^{2}-2ab+2b^{2}\big)\big(a^{2}+2ab+2b^{2}\big)$, prise en $b = 1$.

    *Remarque.* La même idée, appliquée à $X^{4}+1$, donne $X^{4}+1 = \big(X^{2}+1\big)^{2}-2X^{2}$. Mais $2X^{2}$ n'est pas le carré d'un polynôme à coefficients rationnels, puisque $\sqrt{2} \notin \mathbb{Q}$ : la factorisation n'existe que sur $\mathbb{R}$, en $\big(X^{2}-\sqrt{2}X+1\big)\big(X^{2}+\sqrt{2}X+1\big)$. Toute la différence entre (c) et (f) tient à ce que $4$ est un carré dans $\mathbb{Q}$ et $2$ n'en est pas un.

    **Récapitulatif.**

    ```tableau
    **polynôme** ¦ **outil décisif** ¦ **irréductible ?**
    $X^{2}-2$ ¦ degré $2$ et racines rationnelles ¦ oui
    $X^{3}-3X-1$ ¦ degré $3$ et racines rationnelles ¦ oui
    $X^{4}+1$ ¦ Eisenstein en $2$ après $X \mapsto X+1$ ¦ oui
    $X^{5}-4X+2$ ¦ Eisenstein en $2$ ¦ oui
    $X^{4}+X^{3}+X^{2}+X+1$ ¦ Eisenstein en $5$ après $X \mapsto X+1$ ¦ oui
    $X^{4}+4$ ¦ factorisation explicite ¦ **non**
    ```

    *À retenir.* Au-delà du degré $3$, l'absence de racine ne prouve rien : $X^{4}+1$ et $X^{4}+4$ n'ont ni l'un ni l'autre de racine rationnelle, et pourtant le premier est irréductible et le second non.

    **2.** L'irréductibilité sur $\mathbb{Q}$ a été établie à la question 1 (c). Reste la réductibilité modulo tout nombre premier $p$.

    *Le cas $p = 2$.* Dans $\mathbb{F}_{2}[X]$, on a $2 = 0$, donc $(X+1)^{2} = X^{2}+2X+1 = X^{2}+1$, puis 
    $$(X+1)^{4} = \big(X^{2}+1\big)^{2} = X^{4}+2X^{2}+1 = X^{4}+1$$

    $$\boxed{\text{Dans } \mathbb{F}_{2}[X], \ X^{4}+1 = (X+1)^{4}.}$$

    *Le cas $p$ impair : un lemme sur les carrés.* Montrons que l'un au moins des trois éléments $\overline{-1}$, $\overline{2}$, $\overline{-2}$ est un carré dans $\mathbb{F}_{p}$. L'application $\varphi : \mathbb{F}_{p}^{*} \to \mathbb{F}_{p}^{*}$, $x \mapsto x^{2}$, est un morphisme de groupes, puisque $\mathbb{F}_{p}^{*}$ est commutatif. Son noyau est l'ensemble des racines de $X^{2}-1$, qui en a au plus deux dans le corps $\mathbb{F}_{p}$ (proposition 3.6) : c'est $\{\overline{1}\,;\overline{-1}\}$, et ces deux éléments sont distincts car $p$ est impair. Le premier théorème d'isomorphisme (théorème 2.2) montre alors que l'image $C$, formée des carrés non nuls, a $\frac{p-1}{2}$ éléments : c'est un sous-groupe d'indice $2$. Le groupe quotient $\mathbb{F}_{p}^{*}/C$ est donc d'ordre $2$, et son élément non trivial est la classe commune de tous les non-carrés ; comme cet élément est son propre inverse, *le produit de deux non-carrés est un carré*. Si $\overline{-1}$ et $\overline{2}$ ne sont pas des carrés, leur produit $\overline{-2}$ en est donc un.

    *Les trois factorisations.* Chacun des trois cas fournit une factorisation explicite en deux facteurs de degré $2$, obtenue comme en 1 (f) par une différence de deux carrés.

    Si $\overline{-1} = a^{2}$, alors $X^{4}+1 = X^{4}-a^{2} = \big(X^{2}-a\big)\big(X^{2}+a\big)$.

    Si $\overline{2} = b^{2}$, alors $X^{4}+1 = \big(X^{2}+1\big)^{2}-2X^{2} = \big(X^{2}-bX+1\big)\big(X^{2}+bX+1\big)$.

    Si $\overline{-2} = c^{2}$, alors $X^{4}+1 = \big(X^{2}-1\big)^{2}+2X^{2} = \big(X^{2}-cX-1\big)\big(X^{2}+cX-1\big)$.

    Par exemple, modulo $3$ on a $\overline{-2} = \overline{1}^{2}$, d'où $X^{4}+1 = \big(X^{2}-X-1\big)\big(X^{2}+X-1\big)$ ; modulo $5$ on a $\overline{-1} = \overline{2}^{2}$, d'où $\big(X^{2}-2\big)\big(X^{2}+2\big)$ ; modulo $7$ on a $\overline{2} = \overline{3}^{2}$, d'où $\big(X^{2}-3X+1\big)\big(X^{2}+3X+1\big)$. 
    $$\boxed{X^{4}+1 \text{ est irréductible sur } \mathbb{Q} \text{ et réductible sur tout } \mathbb{F}_{p}.}$$

    *Remarque.* Sur $\mathbb{Q}$, aucune de ces trois factorisations n'existe, parce qu'aucun des nombres $-1$, $2$, $-2$ n'est un carré rationnel ; la remarque de la question 1 (f) l'avait constaté pour $2$. Modulo $p$, l'un des trois l'est toujours : c'est tout le contraste entre $\mathbb{Q}$ et les $\mathbb{F}_{p}$.

    *Remarque.* Le chapitre 5 donnera une explication plus structurelle. Pour $p$ impair, $p^{2}-1 = (p-1)(p+1)$ est le produit de deux entiers pairs consécutifs, dont l'un est multiple de $4$ : il est donc divisible par $8$. Le groupe $\mathbb{F}_{p^{2}}^{*}$, cyclique d'ordre $p^{2}-1$, contient alors un élément $\zeta$ d'ordre $8$, dont les puissances impaires sont les quatre racines de $X^{4}+1$. Toutes ces racines vivant dans une extension de degré $2$ de $\mathbb{F}_{p}$, les facteurs irréductibles de $X^{4}+1$ sur $\mathbb{F}_{p}$ sont de degré au plus $2$.

    **3.** *Le critère d'Eisenstein* s'énonce ainsi : soit $P = a_{n}X^{n}+\dots+a_{0} \in \mathbb{Z}[X]$ et $p$ un nombre premier ; si $p$ divise $a_{0}, \dots, a_{n-1}$, ne divise pas $a_{n}$, et si $p^{2}$ ne divise pas $a_{0}$, alors $P$ est irréductible sur $\mathbb{Q}$.

    Pour l'appliquer à $\Phi_{p}$, on remarque d'abord que $(X-1)\big(X^{p-1}+\dots+X+1\big) = X^{p}-1$, les termes intermédiaires s'annulant deux à deux, de sorte que $\Phi_{p} = \dfrac{X^{p}-1}{X-1}$. La formule du binôme donne alors : 
    $$\Phi_{p}(X+1) = \frac{(X+1)^{p}-1}{X} = \sum_{k=1}^{p}\binom{p}{k}X^{k-1} = X^{p-1}+\binom{p}{p-1}X^{p-2}+\dots+\binom{p}{2}X+\binom{p}{1}$$
     Pour $1 \leqslant k \leqslant p-1$, le nombre premier $p$ divise $\binom{p}{k}$. En effet, $k!\,(p-k)!\,\binom{p}{k} = p!$ est divisible par $p$, tandis que $k!\,(p-k)!$ est un produit d'entiers tous strictement inférieurs à $p$, donc premier avec $p$ ; le lemme d'Euclide conclut. Ainsi tous les coefficients sauf le dominant sont divisibles par $p$, le coefficient dominant vaut $1$, et le terme constant vaut $\binom{p}{1} = p$, qui n'est pas divisible par $p^{2}$. Le critère d'Eisenstein s'applique à $\Phi_{p}(X+1)$, et l'outil 4 de la question 1 le transporte à $\Phi_{p}$. 
    $$\boxed{\Phi_{p} \text{ est irréductible sur } \mathbb{Q}.}$$
     Pour $p = 5$, on retrouve exactement le calcul de la question 1 (e).

    **4.** On établit le critère suivant : *soit $P \in \mathbb{Z}[X]$ unitaire de degré $n \geqslant 1$ et $p$ un nombre premier ; si la réduction $\overline{P} \in \mathbb{F}_{p}[X]$ est irréductible, alors $P$ est irréductible sur $\mathbb{Q}$.*

    Raisonnons par contraposée et supposons $P = UV$ dans $\mathbb{Q}[X]$, avec $\deg U, \deg V \geqslant 1$. Un polynôme unitaire est primitif, et le lemme de Gauss (théorème 3.6) montre qu'on peut alors écrire $P = U_{0}V_{0}$ avec $U_{0}, V_{0} \in \mathbb{Z}[X]$ de mêmes degrés que $U$ et $V$. Leurs coefficients dominants sont deux entiers de produit $1$, donc tous deux égaux à $1$ ou tous deux à $-1$ ; quitte à remplacer $U_{0}$ et $V_{0}$ par leurs opposés, ils sont unitaires, et l'on renomme $U = U_{0}$ et $V = V_{0}$. En réduisant modulo $p$, on obtient $\overline{P} = \overline{U}\,\overline{V}$ dans $\mathbb{F}_{p}[X]$. Comme $U$ et $V$ sont unitaires, leur coefficient dominant $1$ ne s'annule pas modulo $p$, de sorte que $\overline{U}$ et $\overline{V}$ gardent les degrés de $U$ et de $V$, tous deux au moins égaux à $1$. On obtient ainsi une factorisation non triviale de $\overline{P}$, qui n'est donc pas irréductible.

    *Piège.* L'hypothèse « unitaire » — ou plus généralement « $p$ ne divise pas le coefficient dominant » — est indispensable, car sans elle le degré peut chuter à la réduction. Ainsi $P = (2X+1)(X+1) = 2X^{2}+3X+1$ est réductible sur $\mathbb{Q}$, alors que sa réduction modulo $2$ vaut $X+1$, polynôme de degré $1$ donc irréductible.

    *Piège.* La réciproque est fausse : $X^{4}+1$ est irréductible sur $\mathbb{Q}$ mais réductible modulo tout nombre premier, d'après la question 2. Le critère ne fonctionne que dans un sens, et il peut ne jamais s'appliquer.

    *Application.* Le polynôme $X^{3}+X+1$ est unitaire. Dans $\mathbb{F}_{2}$, il prend les valeurs $\overline{0}^{3}+\overline{0}+\overline{1} = \overline{1}$ et $\overline{1}^{3}+\overline{1}+\overline{1} = \overline{3} = \overline{1}$ : il n'a pas de racine, et comme il est de degré $3$, l'outil 1 de la question 1, valable sur tout corps, le rend irréductible sur $\mathbb{F}_{2}$. Le critère conclut. 
    $$\boxed{X^{3}+X+1 \text{ est irréductible sur } \mathbb{Q}.}$$
     On pouvait aussi conclure directement par l'outil 2 : les seules racines rationnelles possibles sont $\pm 1$, et $P(1) = 3$, $P(-1) = -1$. La réduction modulo $p$ devient en revanche précieuse lorsque le degré dépasse $3$ et qu'Eisenstein échoue : c'est ainsi que l'exercice 52 établira l'irréductibilité d'un polynôme de degré $5$, en réduisant modulo $7$.
- id: "m-galois-20"
  feuille: "f-m-galois"
  numero: 20
  partie: "Chapitre 3 - Anneaux, corps et polynômes"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [sous-groupes distingués et quotients]
  noeuds: [a-distingue, a-quotient]
  notions: [sous-groupe-distingue, groupe-quotient]
  source: "J. S. Milne, Fields and Galois Theory, exercice 1-1"
  page_enonce: 6
  page_corrige: 14
  enonce: |
    Soit $\alpha$ la classe de $X$ dans $\mathbb{Q}[X]/\big(X^{3}-X^{2}+X+2\big)$. Justifier que ce quotient est un corps, puis exprimer $\big(\alpha^{2}+\alpha+1\big)\big(\alpha^{2}-\alpha\big)$ et $(\alpha-1)^{-1}$ sous la forme $a\alpha^{2}+b\alpha+c$, avec $a,b,c \in \mathbb{Q}$.
  corrige: |
    Le polynôme $P=X^{3}-X^{2}+X+2$ est de degré $3$, et ses seules racines rationnelles possibles sont $\pm 1$ et $\pm 2$ ; or $P(1)=3$, $P(-1)=-1$, $P(2)=8$ et $P(-2)=-12$. Il est donc irréductible sur $\mathbb{Q}$, et le quotient est un corps d'après la proposition 3.7 et le théorème 3.2.

    *Le produit.* On réduit à l'aide de $\alpha^{3}=\alpha^{2}-\alpha-2$, d'où $\alpha^{4}=\alpha^{3}-\alpha^{2}-2\alpha=-3\alpha-2$ : 
    $$\big(\alpha^{2}+\alpha+1\big)\big(\alpha^{2}-\alpha\big)=\alpha^{4}-\alpha \qquad\text{d'où}\qquad \boxed{\big(\alpha^{2}+\alpha+1\big)\big(\alpha^{2}-\alpha\big)=-4\alpha-2}$$

    *L'inverse.* La division de $P$ par $X-1$ donne $P=(X-1)\big(X^{2}+1\big)+3$, puisque $P(1)=3$. En évaluant en $\alpha$, il vient $(\alpha-1)\big(\alpha^{2}+1\big)=-3$ : 
    $$\boxed{(\alpha-1)^{-1}=-\frac{1}{3}\alpha^{2}-\frac{1}{3}}$$
     Cette astuce n'est qu'un cas particulier de la relation de Bézout entre $P$ et $X-1$, qui fournit l'inverse de tout élément non nul.
- id: "m-galois-21"
  feuille: "f-m-galois"
  numero: 21
  partie: "Chapitre 3 - Anneaux, corps et polynômes"
  etoiles: 2
  types: [Calcul]
  mots_cles: [groupes]
  noeuds: [a-groupe]
  notions: []
  page_enonce: 6
  page_corrige: 15
  enonce: |
    **1.** Construire explicitement $\mathbb{F}_{4}$ comme $\mathbb{F}_{2}[X]/\big(X^{2}+X+1\big)$ : dresser les tables d'addition et de multiplication.

    **2.** Vérifier que le groupe multiplicatif $\mathbb{F}_{4}^{*}$ est cyclique et en exhiber un générateur.

    **3.** Construire $\mathbb{F}_{8}$ comme $\mathbb{F}_{2}[X]/\big(X^{3}+X+1\big)$. Combien d'éléments ? Quel est l'ordre de la classe de $X$ ?

    **4.** Construire $\mathbb{F}_{9}$ comme $\mathbb{F}_{3}[X]/\big(X^{2}+1\big)$, après avoir vérifié l'irréductibilité.
  corrige: |
    **1.** Le polynôme $X^{2}+X+1$ n'a pas de racine dans $\mathbb{F}_{2}$, donc est irréductible. En notant $\alpha$ la classe de $X$, on a $\mathbb{F}_{4}=\{0\,;1\,;\alpha\,;\alpha+1\}$ avec $\alpha^{2}=\alpha+1$.

    $$\begin{array}{|c||c|c|c|c|} \hline + & 0 & 1 & \alpha & \alpha+1 \\ \hline 0 & 0 & 1 & \alpha & \alpha+1 \\ \hline 1 & 1 & 0 & \alpha+1 & \alpha \\ \hline \alpha & \alpha & \alpha+1 & 0 & 1 \\ \hline \alpha+1 & \alpha+1 & \alpha & 1 & 0 \\ \hline \end{array}$$

    $$\begin{array}{|c||c|c|c|} \hline \times & 1 & \alpha & \alpha+1 \\ \hline 1 & 1 & \alpha & \alpha+1 \\ \hline \alpha & \alpha & \alpha+1 & 1 \\ \hline \alpha+1 & \alpha+1 & 1 & \alpha \\ \hline \end{array}$$

    **2.** $\mathbb{F}_{4}^{*}$ est d'ordre $3$, donc cyclique, et tout élément $\neq 1$ l'engendre : 
    $$\boxed{\alpha \text{ est un générateur, avec } \alpha^{2}=\alpha+1 \text{ et } \alpha^{3}=1.}$$

    **3.** $X^{3}+X+1$ est irréductible sur $\mathbb{F}_{2}$ (exercice 19), donc le quotient est un corps à $2^{3}=8$ éléments. La classe $\beta$ de $X$ vérifie $\beta^{3}=\beta+1$, et $\mathbb{F}_{8}^{*}$ est d'ordre $7$ premier : 
    $$\boxed{\big|\mathbb{F}_{8}\big|=8, \text{ et } \beta \text{ est d'ordre } 7.}$$

    **4.** Le polynôme $X^{2}+1$ n'a pas de racine dans $\mathbb{F}_{3}$, puisque $0^{2}+1=1$, $1^{2}+1=2$ et $2^{2}+1=2$ : 
    $$\boxed{\mathbb{F}_{9}=\mathbb{F}_{3}[X]/\big(X^{2}+1\big)=\big\{a+b\mathrm{i} \;\big|\; a,b \in \mathbb{F}_{3}\big\}}$$
- id: "m-galois-22"
  feuille: "f-m-galois"
  numero: 22
  partie: "Chapitre 3 - Anneaux, corps et polynômes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [irréductibilité, extensions de corps]
  noeuds: [z-polynomes, gs-extensions]
  notions: [polynome-irreductible, extension-corps]
  page_enonce: 6
  page_corrige: 15
  enonce: |
    **1.** Dresser la liste des polynômes unitaires de degré $2$ de $\mathbb{F}_{2}[X]$, et déterminer lesquels sont irréductibles.

    **2.** Faire de même en degré $3$. Combien en trouve-t-on ?

    **3.** Soit $p$ un nombre premier. Pour tout entier $d\geqslant 1$, on note $N_{d}$ le nombre de polynômes unitaires irréductibles de degré $d$ de $\mathbb{F}_{p}[X]$. Démontrer que, pour tout entier $n\geqslant 1$, on a $\sum_{d \mid n} d\,N_{d}=p^{n}$, la somme portant sur les diviseurs positifs $d$ de $n$. On pourra établir que $X^{p^{n}}-X$ est le produit des polynômes unitaires irréductibles de $\mathbb{F}_{p}[X]$ dont le degré divise $n$.

    **4.** En déduire $N_{1}$, $N_{2}$, $N_{3}$ et $N_{4}$ sur $\mathbb{F}_{2}$, et comparer aux questions 1 et 2.
  corrige: |
    **1.** Les quatre unitaires de degré $2$ sont $X^{2}$, $X^{2}+1$, $X^{2}+X$, $X^{2}+X+1$. Les trois premiers ont une racine dans $\mathbb{F}_{2}$ : 
    $$\boxed{\text{Un seul irréductible : } X^{2}+X+1.}$$

    **2.** Parmi les huit unitaires de degré $3$, ceux sans racine sont ceux dont le terme constant vaut $1$ et qui ont un nombre impair de coefficients non nuls : 
    $$\boxed{X^{3}+X+1 \quad\text{et}\quad X^{3}+X^{2}+1}$$

    **3.** Fixons un nombre premier $p$ et un entier $n\geqslant 1$, et posons $F=X^{p^{n}}-X$. Tout repose sur la factorisation suivante : *$F$ est le produit des polynômes unitaires irréductibles de $\mathbb{F}_{p}[X]$ dont le degré divise $n$, chacun n'apparaissant qu'une seule fois.* On l'établit en deux étapes, puis on compare les degrés.

    *Première étape : $F$ n'a pas de facteur carré.* Supposons $F=Q^{2}R$ avec $Q$ non constant. Le polynôme dérivé, défini formellement par $\big(X^{m}\big)'=mX^{m-1}$ et prolongé par linéarité, vérifie la règle de dérivation d'un produit, ce que l'on contrôle sur les monômes. On en tire : 
    $$F'=2QQ'R+Q^{2}R'=Q\,\big(2Q'R+QR'\big)$$
     donc $Q$ divise $F'$. Or $F'=p^{n}X^{p^{n}-1}-1=-1$, puisque l'entier $p^{n}$ est nul dans $\mathbb{F}_{p}$. Un polynôme non constant ne pouvant pas diviser $-1$, c'est absurde.

    *Deuxième étape : un polynôme unitaire irréductible $P$ de degré $d$ divise $F$ si et seulement si $d$ divise $n$.* On travaille dans $K=\mathbb{F}_{p}[X]/(P)$, qui est un corps puisque $P$ est irréductible (théorème 3.2), exactement comme $\mathbb{F}_{4}$ à l'exercice 21. On note $\alpha$ la classe de $X$ : pour tout polynôme $Q$, la classe de $Q$ est $Q(\alpha)$, de sorte que $Q(\alpha)=0$ si et seulement si $P$ divise $Q$. Trois faits vont servir.

    *Premier fait : $K$ a $p^{d}$ éléments.* Chaque classe contient en effet un unique reste de la division euclidienne par $P$, c'est-à-dire un polynôme de degré au plus $d-1$, dont les $d$ coefficients se choisissent de $p$ façons chacun.

    *Deuxième fait : tout $x\in K$ vérifie $x^{p^{d}}=x$.* Si $x\neq 0$, le théorème de Lagrange, appliqué dans le groupe $K^{*}$ d'ordre $p^{d}-1$, donne $x^{p^{d}-1}=1$, puis on multiplie par $x$ ; si $x=0$, c'est évident.

    *Troisième fait : l'application $x\mapsto x^{p}$ est un morphisme d'anneaux de $K$ dans lui-même.* Elle respecte évidemment le produit, et la formule du binôme donne $(x+y)^{p}=x^{p}+y^{p}$, puisque $p$ divise $\binom{p}{k}$ pour $1\leqslant k\leqslant p-1$ (exercice 19, question 3) et que $p\cdot 1=0$ dans $K$. En la composant $n$ fois avec elle-même, on obtient que $x\mapsto x^{p^{n}}$ est aussi un morphisme d'anneaux.

    Supposons d'abord que $d$ divise $n$, et écrivons $n=qd$. En appliquant $q$ fois le deuxième fait, on obtient $\alpha^{p^{n}}=\alpha$, c'est-à-dire $F(\alpha)=0$ : donc $P$ divise $F$.

    Réciproquement, supposons que $P$ divise $F$, c'est-à-dire que $\alpha^{p^{n}}=\alpha$. L'ensemble des $x\in K$ tels que $x^{p^{n}}=x$ est stable par somme et par produit, d'après le troisième fait ; il contient les éléments de $\mathbb{F}_{p}$, qui vérifient $x^{p}=x$ d'après le petit théorème de Fermat, ainsi que $\alpha$. Il contient donc toutes les expressions polynomiales en $\alpha$, c'est-à-dire $K$ tout entier. Écrivons alors $n=qd+r$ avec $0\leqslant r<d$. Pour tout $x\in K$, le deuxième fait donne $x^{p^{qd}}=x$, d'où : 
    $$x=x^{p^{n}}=\big(x^{p^{qd}}\big)^{p^{r}}=x^{p^{r}}$$
     Si l'on avait $r\geqslant 1$, le polynôme non nul $X^{p^{r}}-X$, de degré $p^{r}$, aurait les $p^{d}$ éléments de $K$ pour racines, avec $p^{d}>p^{r}$ : c'est impossible dans un corps, d'après la proposition 3.6. Donc $r=0$, et $d$ divise $n$.

    *Conclusion.* Le polynôme $F$ est unitaire, et se décompose de façon unique en produit de polynômes unitaires irréductibles de $\mathbb{F}_{p}[X]$. D'après la première étape, chaque facteur n'y apparaît qu'une fois ; d'après la deuxième, ces facteurs sont exactement les unitaires irréductibles dont le degré divise $n$. En notant $\mathcal{I}_{d}$ l'ensemble des $N_{d}$ unitaires irréductibles de degré $d$ : 
    $$X^{p^{n}}-X=\prod_{d\mid n}\ \prod_{P\in\mathcal{I}_{d}}P$$
     Le membre de droite est un produit de $N_{d}$ polynômes de degré $d$ pour chaque diviseur $d$ de $n$ : son degré vaut $\sum_{d\mid n}d\,N_{d}$, celui de gauche vaut $p^{n}$. 
    $$\boxed{\sum_{d \mid n} d\,N_{d}=p^{n}}$$
     Par exemple, pour $p=2$ et $n=3$, on obtient $X^{8}-X=X\,(X+1)\big(X^{3}+X+1\big)\big(X^{3}+X^{2}+1\big)$, de degré $1+1+3+3=8$ : on y retrouve les deux irréductibles de degré $1$ et les deux irréductibles de degré $3$ de la question 2.

    *Remarque.* Cette factorisation sera au cœur de l'étude des corps finis au chapitre 5. On voit ici qu'elle se démontre dès le chapitre 3, avec le théorème de Lagrange, la construction de $\mathbb{F}_{p}[X]/(P)$ et la majoration du nombre de racines d'un polynôme.

    **4.** On applique la question 3 avec $p=2$, successivement pour $n=1$, $2$, $3$ et $4$. Les diviseurs de $2$ sont $1$ et $2$, ceux de $3$ sont $1$ et $3$, ceux de $4$ sont $1$, $2$ et $4$ : 
    $$N_{1}=2 \qquad N_{1}+2N_{2}=4 \qquad N_{1}+3N_{3}=8 \qquad N_{1}+2N_{2}+4N_{4}=16$$
     On en tire successivement $N_{2}=1$, $N_{3}=2$, puis $N_{4}=\dfrac{16-2-2}{4}=3$. 
    $$\boxed{N_{1}=2,\quad N_{2}=1,\quad N_{3}=2,\quad N_{4}=3}$$
     Les valeurs de $N_{2}$ et $N_{3}$ confirment les questions 1 et 2. Les trois irréductibles de degré $4$ sont $X^{4}+X+1$, $X^{4}+X^{3}+1$ et $X^{4}+X^{3}+X^{2}+X+1$.
- id: "m-galois-23"
  feuille: "f-m-galois"
  numero: 23
  partie: "Chapitre 4 - Extensions de corps"
  etoiles: 1
  types: [Calcul]
  mots_cles: [polynôme minimal, cyclotomie]
  noeuds: [gs-algebriques, galois-cyclotomie]
  notions: [polynome-minimal, polynome-cyclotomique]
  page_enonce: 7
  page_corrige: 17
  enonce: |
    **1.** Déterminer le polynôme minimal sur $\mathbb{Q}$ de chacun des nombres ci-dessous, en justifiant à chaque fois l'irréductibilité.

    **(a)** $\sqrt[3]{5}$

    **(b)** $\mathrm{i}\sqrt{3}$

    **(c)** $\zeta_{5}=\mathrm{e}^{2\mathrm{i}\pi/5}$

    **(d)** $1+\sqrt{2}$

    **2.** Déterminer le polynôme minimal de $\sqrt{2}$ sur $\mathbb{Q}\big(\sqrt{3}\big)$, puis sur $\mathbb{Q}\big(\sqrt{2}\big)$.
  corrige: |
    **1.** On identifie le polynôme minimal puis on justifie son irréductibilité :

    ```tableau
    $\alpha$ ¦ $\mu_{\alpha}$ ¦ irréductibilité
    $\sqrt[3]{5}$ ¦ $X^{3}-5$ ¦ Eisenstein en $5$
    $\mathrm{i}\sqrt{3}$ ¦ $X^{2}+3$ ¦ pas de racine réelle
    $\zeta_{5}$ ¦ $X^{4}+X^{3}+X^{2}+X+1$ ¦ c'est $\Phi_{5}$ (Eisenstein après $X \mapsto X+1$)
    $1+\sqrt{2}$ ¦ $X^{2}-2X-1$ ¦ discriminant $8$, non carré dans $\mathbb{Q}$
    ```

    **2.** Sur $\mathbb{Q}\big(\sqrt{3}\big)$, le polynôme $X^{2}-2$ reste sans racine, car $\sqrt{2} \notin \mathbb{Q}\big(\sqrt{3}\big)$ : l'égalité $\sqrt{2}=a+b\sqrt{3}$ donnerait $2=a^{2}+3b^{2}+2ab\sqrt{3}$, donc $ab=0$, puis $2=a^{2}$ ou $2=3b^{2}$, ce qui est impossible dans $\mathbb{Q}$ : 
    $$\boxed{\mu_{\sqrt{2}/\mathbb{Q}(\sqrt{3})}=X^{2}-2 \qquad \mu_{\sqrt{2}/\mathbb{Q}(\sqrt{2})}=X-\sqrt{2}}$$
- id: "m-galois-24"
  feuille: "f-m-galois"
  numero: 24
  partie: "Chapitre 4 - Extensions de corps"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [groupes, sous-groupes, morphismes de groupes, extensions de corps]
  noeuds: [a-groupe, a-sous-groupe, a-morphisme, gs-extensions]
  notions: [extension-corps]
  source: "J. S. Milne, Fields and Galois Theory, exercice 2-1"
  page_enonce: 7
  page_corrige: 17
  enonce: |
    Soit $F$ un corps de caractéristique différente de $2$. Pour toute extension $E$ de $F$ de degré $2$, on note $S(E)$ l'ensemble des $a \in F^{*}$ qui sont des carrés dans $E$.

    **1.** Démontrer que $S(E)$ est un sous-groupe de $F^{*}$ contenant $F^{*2}=\big\{x^{2} \ ; \ x \in F^{*}\big\}$.

    **2.** Démontrer que deux extensions $E$ et $E'$ de $F$ de degré $2$ sont $F$-isomorphes si et seulement si $S(E)=S(E')$.

    **3.** En déduire qu'il existe une infinité d'extensions de $\mathbb{Q}$ de degré $2$, deux à deux non isomorphes.
  corrige: |
    Soit $E$ une extension de $F$ de degré $2$ et $\beta \in E \setminus F$, de polynôme minimal $X^{2}+bX+c$. Comme la caractéristique est différente de $2$, on peut compléter le carré : $\delta=2\beta+b$ vérifie $\delta^{2}=b^{2}-4c=:d \in F$, et $E=F(\delta)$. Le nombre $d$ n'est pas un carré dans $F$, sinon $\delta \in F$.

    **1.** Soit $x=u+v\delta \in E$, avec $u,v \in F$. Alors $x^{2}=u^{2}+dv^{2}+2uv\delta$ appartient à $F$ si et seulement si $uv=0$, et vaut alors $u^{2}$ ou $dv^{2}$. Ainsi : 
    $$\boxed{S(E)=F^{*2} \cup d\,F^{*2}}$$
     C'est la réunion de deux classes de $F^{*}$ modulo le sous-groupe $F^{*2}$ ; comme $d^{2} \in F^{*2}$, c'est le sous-groupe engendré par $F^{*2}$ et $d$.

    **2.** Un $F$-isomorphisme $E \to E'$ envoie un carré sur un carré et fixe $F^{*}$, donc $S(E) \subseteq S(E')$ ; par symétrie, $S(E)=S(E')$. Réciproquement, si $S(E)=S(E')$ avec $E=F(\delta)$, $\delta^{2}=d$, alors $d \in S(E')$ : il existe $\delta' \in E'$ tel que $\delta'^{2}=d$. Comme $d$ n'est pas un carré dans $F$, on a $F(\delta')=E'$ par égalité des degrés, et les deux corps sont isomorphes à $F[X]/\big(X^{2}-d\big)$. 
    $$\boxed{E \simeq_{F} E' \iff S(E)=S(E')}$$

    **3.** Pour chaque nombre premier $q$, posons $E_{q}=\mathbb{Q}\big(\sqrt{q}\big)$, de sorte que $S(E_{q})=\mathbb{Q}^{*2} \cup q\,\mathbb{Q}^{*2}$. Si $q \neq q'$, le rationnel $q'$ n'appartient pas à $S(E_{q})$, car ni $q'$ ni $q'/q$ n'est un carré dans $\mathbb{Q}$. 
    $$\boxed{\text{Les corps } \mathbb{Q}\big(\sqrt{q}\big), \ q \text{ premier, sont deux à deux non isomorphes.}}$$
- id: "m-galois-25"
  feuille: "f-m-galois"
  numero: 25
  partie: "Chapitre 4 - Extensions de corps"
  etoiles: 3
