  enonce: |
    **1.** Déterminer $\mathrm{Gal}\big(\mathbb{Q}(\zeta_{7})/\mathbb{Q}\big)$ et vérifier qu'il est cyclique d'ordre $6$.

    **2.** En déduire le nombre de corps intermédiaires entre $\mathbb{Q}$ et $\mathbb{Q}(\zeta_{7})$, et les déterminer tous.

    **3.** Expliciter le sous-corps de degré $3$ à l'aide de sommes de racines de l'unité — les *périodes de Gauss*.

    **4.** Démontrer que toute extension abélienne de $\mathbb{Q}$ obtenue ainsi est résoluble par radicaux.
  corrige: |
    **1.** $\big(\mathbb{Z}/7\mathbb{Z}\big)^{*}$ est cyclique d'ordre $6$, engendré par $\overline{3}$ : 
    $$\boxed{\mathrm{Gal}\big(\mathbb{Q}(\zeta_{7})/\mathbb{Q}\big) \simeq \mathbb{Z}/6\mathbb{Z}, \text{ engendré par } \sigma : \zeta \mapsto \zeta^{3}.}$$

    **2.** Un groupe cyclique d'ordre $6$ possède exactement quatre sous-groupes, d'ordres $1$, $2$, $3$, $6$ : 
    $$\boxed{\mathbb{Q} \subset \mathbb{Q}\big(\sqrt{-7}\big) \subset \mathbb{Q}(\zeta_{7}) \qquad\text{et}\qquad \mathbb{Q} \subset \mathbb{Q}\big(\cos\tfrac{2\pi}{7}\big) \subset \mathbb{Q}(\zeta_{7})}$$
     Le corps de degré $2$ correspond au sous-groupe d'ordre $3$, celui de degré $3$ au sous-groupe d'ordre $2$, engendré par la conjugaison complexe $\zeta \mapsto \zeta^{-1}$.

    **3.** Le corps fixe de $\langle \sigma^{3} \rangle=\{\mathrm{id}\,;\zeta\mapsto\zeta^{-1}\}$ est engendré par les *périodes de Gauss* : 
    $$\boxed{\eta_{1}=\zeta+\zeta^{6}, \quad \eta_{2}=\zeta^{3}+\zeta^{4}, \quad \eta_{3}=\zeta^{2}+\zeta^{5}}$$
     Ce sont les $2\cos\dfrac{2k\pi}{7}$, racines de $X^{3}+X^{2}-2X-1$, et $\mathbb{Q}\big(\eta_{1}\big)$ est le sous-corps de degré $3$.

    **4.** Un groupe abélien est résoluble (proposition 2.6), et le théorème 7.4 conclut. 
    $$\boxed{\text{Toute extension abélienne de } \mathbb{Q} \text{ est résoluble par radicaux.}}$$
