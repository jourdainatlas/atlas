  page_enonce: 9
  page_corrige: 21
  enonce: |
    **1.** Déterminer un élément primitif de $\mathbb{Q}\big(\sqrt[3]{2}\,;\mathrm{j}\big)$ sur $\mathbb{Q}$, où $\mathrm{j}=\mathrm{e}^{2\mathrm{i}\pi/3}$.

    **2.** Démontrer que l'extension $\mathbb{F}_{p}(T\,;S)/\mathbb{F}_{p}\big(T^{p}\,;S^{p}\big)$ est finie mais n'admet *aucun* élément primitif. On montrera qu'elle possède une infinité de corps intermédiaires.

    **3.** Quelle hypothèse du théorème 5.5 est ici mise en défaut ?
  corrige: |
    **1.** Posons $\theta=\sqrt[3]{2}+\mathrm{j}$. L'extension $\mathbb{Q}\big(\sqrt[3]{2}\,;\mathrm{j}\big)/\mathbb{Q}$ est de degré $6$, séparable, donc monogène ; on vérifie que $\theta$ engendre, son degré devant diviser $6$ sans valoir $1$, $2$ ni $3$ — car $\mathbb{Q}(\theta)$ n'est contenu ni dans $\mathbb{R}$, ni dans $\mathbb{Q}(\mathrm{j})$. 
    $$\boxed{\theta=\sqrt[3]{2}+\mathrm{j} \text{ est un élément primitif, de degré } 6.}$$

    **2.** Posons $K=\mathbb{F}_{p}\big(T^{p}\,;S^{p}\big)$ et $L=\mathbb{F}_{p}(T\,;S)$. On a $[L:K]=p^{2}$, mais tout $\alpha \in L$ vérifie $\alpha^{p} \in K$, donc $[K(\alpha):K] \leqslant p$ : aucun élément n'engendre. Les corps $K\big(T+\lambda S\big)$, pour $\lambda \in \mathbb{F}_{p}(T^{p};S^{p})$, sont deux à deux distincts et en nombre infini. 
    $$\boxed{L/K \text{ est finie sans élément primitif, et possède une infinité de corps intermédiaires.}}$$

    **3.** L'hypothèse manquante se lit sur le polynôme minimal : 
    $$\boxed{\text{La séparabilité : ici } \mu_{\alpha} \text{ divise } X^{p}-\alpha^{p}=(X-\alpha)^{p}.}$$
- id: "m-galois-34"
  feuille: "f-m-galois"
  numero: 34
  partie: "Chapitre 6 - La correspondance de Galois"
  etoiles: 2
  types: [Calcul]
  mots_cles: [polynôme minimal]
  noeuds: [gs-algebriques]
  notions: [polynome-minimal]
  source: "M. Reversat et B. Zhang, Cours de théorie des corps (Université de Toulouse)"
  page_enonce: 9
  page_corrige: 21
  enonce: |
    Déterminer le polynôme minimal de $\sqrt{2}+\sqrt{3}+\sqrt{5}$ sur $\mathbb{Q}$.
  corrige: |
    Posons $F=\mathbb{Q}\big(\sqrt{2}\,;\sqrt{3}\big)$. Si l'on avait $\sqrt{3}=a+b\sqrt{2}$ avec $a,b \in \mathbb{Q}$, alors $3=a^{2}+2b^{2}+2ab\sqrt{2}$ imposerait $ab=0$, puis $3=a^{2}$ ou $3=2b^{2}$, ce qui est impossible. Ainsi $[F:\mathbb{Q}]=4$, et $F/\mathbb{Q}$ est galoisienne de groupe $(\mathbb{Z}/2\mathbb{Z})^{2}$, formé des quatre changements de signes de $\sqrt{2}$ et $\sqrt{3}$. Ce groupe a trois sous-groupes d'ordre $2$, donc $F$ a exactement trois sous-corps quadratiques : $\mathbb{Q}\big(\sqrt{2}\big)$, $\mathbb{Q}\big(\sqrt{3}\big)$ et $\mathbb{Q}\big(\sqrt{6}\big)$.

    Si $\sqrt{5}$ appartenait à $F$, le corps $\mathbb{Q}\big(\sqrt{5}\big)$ serait l'un d'eux. Mais $\mathbb{Q}\big(\sqrt{5}\big)=\mathbb{Q}\big(\sqrt{m}\big)$ entraîne, par le même calcul que ci-dessus, que $5m$ est un carré dans $\mathbb{Q}$, ce qui est faux pour $m=2$, $3$ et $6$. Donc $L=\mathbb{Q}\big(\sqrt{2}\,;\sqrt{3}\,;\sqrt{5}\big)$ est de degré $8$ : c'est le corps de décomposition de $\big(X^{2}-2\big)\big(X^{2}-3\big)\big(X^{2}-5\big)$, galoisien, et ses huit automorphismes changent indépendamment les signes de $\sqrt{2}$, $\sqrt{3}$ et $\sqrt{5}$.

    Les images de $\gamma=\sqrt{2}+\sqrt{3}+\sqrt{5}$ sont les huit nombres $\pm\sqrt{2}\pm\sqrt{3}\pm\sqrt{5}$. Ils sont deux à deux distincts : une égalité entre deux d'entre eux fournirait une relation $a\sqrt{2}+b\sqrt{3}+c\sqrt{5}=0$ à coefficients dans $\{0\,;\pm 2\}$ non tous nuls, impossible puisque $1$, $\sqrt{2}$, $\sqrt{3}$ et $\sqrt{5}$ font partie d'une base de $L$ sur $\mathbb{Q}$. L'élément $\gamma$ a donc huit conjugués, il est de degré $8$, et son polynôme minimal est le produit des $X-\big(\pm\sqrt{2}\pm\sqrt{3}\pm\sqrt{5}\big)$ : 
    $$\boxed{\mu_{\gamma}=X^{8}-40X^{6}+352X^{4}-960X^{2}+576}$$
     Au passage, $\gamma$ est un élément primitif de $L$.
- id: "m-galois-35"
  feuille: "f-m-galois"
  numero: 35
