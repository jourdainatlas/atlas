  notions: [sous-groupe-distingue, groupe-quotient]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **1.** Décrire les éléments du quotient $\mathbb{Z}/12\mathbb{Z}$ modulo le sous-groupe $\langle 4 \rangle$, et identifier ce quotient.

    **2.** Identifier $\mathfrak{S}_{3}/\mathfrak{A}_{3}$, puis $D_{4}/\langle r^{2} \rangle$.

    **3.** Soit $G$ un groupe et $H \trianglelefteq G$. Démontrer que si $G$ est abélien, alors $G/H$ l'est. La réciproque est-elle vraie ?

    **4.** Démontrer que $G/Z(G)$ cyclique entraîne $G$ abélien. En déduire qu'un groupe d'ordre $p^{2}$ est abélien.
  corrige: |
    **1.** Le sous-groupe $\langle \overline{4} \rangle=\{\overline{0};\overline{4};\overline{8}\}$ est d'ordre $3$, donc le quotient est d'ordre $4$ ; il est cyclique, engendré par la classe de $\overline{1}$ : 
    $$\boxed{\mathbb{Z}/12\mathbb{Z} \big/ \langle \overline{4} \rangle \simeq \mathbb{Z}/4\mathbb{Z}}$$

    **2.** Chaque quotient est d'ordre $2$ ou $4$ : 
    $$\boxed{\mathfrak{S}_{3}/\mathfrak{A}_{3} \simeq \mathbb{Z}/2\mathbb{Z} \qquad D_{4}/\langle r^{2} \rangle \simeq (\mathbb{Z}/2\mathbb{Z})^{2}}$$
     Pour le second, le quotient est d'ordre $4$ et tous ses éléments non triviaux sont d'ordre $2$, puisque $r^{2}$, $s^{2}$ et $(rs)^{2}$ appartiennent à $\langle r^{2} \rangle$.

    **3.** Si $G$ est abélien, $\overline{x}\,\overline{y}=\overline{xy}=\overline{yx}=\overline{y}\,\overline{x}$. La réciproque est fausse : $\mathfrak{S}_{3}/\mathfrak{A}_{3}$ est abélien sans que $\mathfrak{S}_{3}$ le soit.

    **4.** Soit $G/Z(G)=\langle \overline{a} \rangle$. Tout $x \in G$ s'écrit $x=a^{i}z$ avec $z \in Z(G)$, et deux tels éléments commutent : 
    $$\big(a^{i}z\big)\big(a^{j}z'\big)=a^{i+j}zz'=\big(a^{j}z'\big)\big(a^{i}z\big)$$
     Si $|G|=p^{2}$, le centre est non trivial, d'après l'équation aux classes du paragraphe 2.4 du cours, donc $G/Z(G)$ est d'ordre $1$ ou $p$, donc cyclique. 
    $$\boxed{\text{Tout groupe d'ordre } p^{2} \text{ est abélien.}}$$
- id: "m-galois-11"
