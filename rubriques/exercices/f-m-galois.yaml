  enonce: |
    **1.** Démontrer que $\mathbb{Q}\big(\zeta_{15}\big)/\mathbb{Q}$ est galoisienne, et déterminer son degré.

    **2.** Démontrer que $\mathrm{Gal}\big(\mathbb{Q}(\zeta_{15})/\mathbb{Q}\big) \simeq \big(\mathbb{Z}/15\mathbb{Z}\big)^{*}$, puis identifier la structure de ce groupe.

    **3.** En déduire le nombre de corps intermédiaires, et déterminer ceux de degré $2$ sur $\mathbb{Q}$.

    **4.** Démontrer que $\mathbb{Q}\big(\zeta_{15}\big)$ contient $\mathbb{Q}\big(\sqrt{5}\big)$, et expliciter $\sqrt{5}$ en fonction de $\zeta_{5}$.

    **5.** Plus généralement, démontrer que $\mathbb{Q}\big(\zeta_{p}\big)$ contient un unique sous-corps quadratique pour $p$ premier impair, et préciser lequel selon la classe de $p$ modulo $4$.
  corrige: |
    **1.** $\mathbb{Q}(\zeta_{15})$ est le corps de décomposition de $X^{15}-1$, séparable puisque $\mathrm{pgcd}\big(X^{15}-1\,;15X^{14}\big)=1$ en caractéristique nulle : 
    $$\boxed{\text{Extension galoisienne de degré } \varphi(15)=8.}$$

    **2.** Tout $\sigma \in G$ envoie $\zeta_{15}$ sur $\zeta_{15}^{k}$ avec $\mathrm{pgcd}(k\,;15)=1$, et $\sigma \mapsto \overline{k}$ est un isomorphisme. Par le théorème chinois : 
    $$\boxed{G \simeq \big(\mathbb{Z}/15\mathbb{Z}\big)^{*} \simeq \big(\mathbb{Z}/3\mathbb{Z}\big)^{*} \times \big(\mathbb{Z}/5\mathbb{Z}\big)^{*} \simeq \mathbb{Z}/2\mathbb{Z} \times \mathbb{Z}/4\mathbb{Z}}$$

    **3.** Le groupe $\mathbb{Z}/2\mathbb{Z} \times \mathbb{Z}/4\mathbb{Z}$ possède huit sous-groupes, dont trois d'ordre $4$ : 
    $$\boxed{\text{Huit corps intermédiaires, dont trois quadratiques : } \mathbb{Q}\big(\sqrt{5}\big), \; \mathbb{Q}\big(\sqrt{-3}\big), \; \mathbb{Q}\big(\sqrt{-15}\big).}$$

    **4.** La somme de Gauss $\displaystyle g=\sum_{k=1}^{4}\left(\frac{k}{5}\right)\zeta_{5}^{k}=\zeta_{5}+\zeta_{5}^{4}-\zeta_{5}^{2}-\zeta_{5}^{3}$ vérifie $g^{2}=5$ : 
    $$\boxed{\sqrt{5}=\zeta_{5}+\zeta_{5}^{4}-\zeta_{5}^{2}-\zeta_{5}^{3} \in \mathbb{Q}(\zeta_{5}) \subset \mathbb{Q}(\zeta_{15})}$$
     On peut aussi écrire $\zeta_{5}+\zeta_{5}^{4}=2\cos\dfrac{2\pi}{5}=\dfrac{-1+\sqrt{5}}{2}$.

    **5.** $\mathrm{Gal}\big(\mathbb{Q}(\zeta_{p})/\mathbb{Q}\big) \simeq \big(\mathbb{Z}/p\mathbb{Z}\big)^{*}$ est cyclique d'ordre $p-1$ pair, donc possède un unique sous-groupe d'indice $2$, donc $\mathbb{Q}(\zeta_{p})$ possède un unique sous-corps quadratique. La somme de Gauss donne $g^{2}=\left(\frac{-1}{p}\right)p$ : 
    $$\boxed{\mathbb{Q}\big(\sqrt{p}\big) \text{ si } p \equiv 1 \; [4] \qquad \mathbb{Q}\big(\sqrt{-p}\big) \text{ si } p \equiv 3 \; [4]}$$
- id: "m-galois-45"
  feuille: "f-m-galois"
  numero: 45
  partie: "Chapitre 7 - Résolubilité par radicaux"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [groupes, extensions de corps, constructions à la règle et au compas, correspondance de Galois, cyclotomie]
  noeuds: [a-groupe, gs-extensions, galois-cyclotomie, gs-correspondance]
  notions: [extension-corps, point-constructible, polynome-cyclotomique]
  page_enonce: 11
  page_corrige: 27
  enonce: |
    On étudie l'extension $\mathbb{Q}(\zeta_{16})/\mathbb{Q}$, où $\zeta_{16}=\mathrm{e}^{2\mathrm{i}\pi/16}$.

    **1.** Justifier que $\Phi_{16}=X^{8}+1$, puis que $\big[\mathbb{Q}(\zeta_{16}):\mathbb{Q}\big]=8$.

    **2.** Déterminer la structure du groupe $\big(\mathbb{Z}/16\mathbb{Z}\big)^{*}$ : on calculera l'ordre de chacun de ses huit éléments.

    **3.** En déduire que $\mathrm{Gal}\big(\mathbb{Q}(\zeta_{16})/\mathbb{Q}\big)$ *n'est pas cyclique*, contrairement à $\mathrm{Gal}\big(\mathbb{Q}(\zeta_{p})/\mathbb{Q}\big)$ pour $p$ premier impair.

    **4.** Combien $\mathbb{Q}(\zeta_{16})$ possède-t-il de sous-corps quadratiques ? Les expliciter.

    **5.** Plus généralement, démontrer que $\big(\mathbb{Z}/2^{k}\mathbb{Z}\big)^{*} \simeq \mathbb{Z}/2\mathbb{Z} \times \mathbb{Z}/2^{k-2}\mathbb{Z}$ pour $k \geqslant 3$. On montrera que $5$ est d'ordre $2^{k-2}$ et que $-1 \notin \langle 5 \rangle$.

    **6.** Quelle conséquence ce résultat a-t-il sur la constructibilité du polygone régulier à $16$ côtés ?
  corrige: |
    **1.** On a $X^{16}-1=\prod_{d \mid 16}\Phi_{d}$, et $16=2^{4}$ n'a que des diviseurs de la forme $2^{j}$. Comme $X^{8}-1=\prod_{j \leqslant 3}\Phi_{2^{j}}$, il vient $\Phi_{16}=\dfrac{X^{16}-1}{X^{8}-1}=X^{8}+1$. 
    $$\boxed{\Phi_{16}=X^{8}+1 \qquad\text{et}\qquad \big[\mathbb{Q}(\zeta_{16}):\mathbb{Q}\big]=\varphi(16)=8}$$

    **2.** Le groupe $\big(\mathbb{Z}/16\mathbb{Z}\big)^{*}=\{1\,;3\,;5\,;7\,;9\,;11\,;13\,;15\}$ est d'ordre $8$. On calcule les ordres :

    $$\begin{array}{|c||c|c|c|c|c|c|c|c|} \hline a & 1 & 3 & 5 & 7 & 9 & 11 & 13 & 15 \\ \hline \text{ordre} & 1 & 4 & 4 & 2 & 2 & 4 & 4 & 2 \\ \hline \end{array}$$

    $$\boxed{\text{Aucun élément d'ordre } 8 : \big(\mathbb{Z}/16\mathbb{Z}\big)^{*} \simeq \mathbb{Z}/2\mathbb{Z} \times \mathbb{Z}/4\mathbb{Z}}$$
     Un isomorphisme est donné par $(-1)^{i}5^{j} \mapsto (i\,;j)$.

    **3.** 
    $$\boxed{\mathrm{Gal}\big(\mathbb{Q}(\zeta_{16})/\mathbb{Q}\big) \simeq \mathbb{Z}/2\mathbb{Z} \times \mathbb{Z}/4\mathbb{Z} \text{ n'est pas cyclique.}}$$
     *Piège à retenir.* On retient volontiers que $\mathrm{Gal}\big(\mathbb{Q}(\zeta_{n})/\mathbb{Q}\big) \simeq \big(\mathbb{Z}/n\mathbb{Z}\big)^{*}$ *et* que ce groupe est cyclique. La seconde affirmation n'est vraie que pour $n$ premier, ou plus généralement pour $n \in \{1\,;2\,;4\,;p^{k}\,;2p^{k}\}$ avec $p$ impair. Dès $n=16$, elle tombe.

    **4.** Les sous-corps quadratiques correspondent aux sous-groupes d'indice $2$, c'est-à-dire d'ordre $4$. Le groupe $\mathbb{Z}/2\mathbb{Z} \times \mathbb{Z}/4\mathbb{Z}$ en possède trois. 
    $$\boxed{\mathbb{Q}(\mathrm{i}) \;,\; \mathbb{Q}\big(\sqrt{2}\big) \;,\; \mathbb{Q}\big(\sqrt{-2}\big)}$$
     En effet $\zeta_{16}^{4}=\mathrm{i}$ et $\zeta_{16}^{2}+\zeta_{16}^{-2}=2\cos\dfrac{\pi}{4}=\sqrt{2}$.

    **5.** Posons $k \geqslant 3$. On démontre par récurrence que $5^{2^{k-3}}=1+2^{k-1}+\lambda 2^{k}$ pour un entier $\lambda$, ce qui donne $5^{2^{k-3}} \neq 1$ et $5^{2^{k-2}}=1$ modulo $2^{k}$ : l'élément $5$ est d'ordre $2^{k-2}$. Par ailleurs $\langle 5 \rangle$ ne contient que des éléments congrus à $1$ modulo $4$, alors que $-1 \equiv 3 \; [4]$. 
    $$\boxed{\big(\mathbb{Z}/2^{k}\mathbb{Z}\big)^{*}=\{\pm 1\} \times \langle 5 \rangle \simeq \mathbb{Z}/2\mathbb{Z} \times \mathbb{Z}/2^{k-2}\mathbb{Z}}$$

    **6.** Aucune : le critère de constructibilité porte sur $\varphi(n)$, qui doit être une puissance de $2$, et non sur la cyclicité du groupe. Ici $\varphi(16)=8=2^{3}$. 
    $$\boxed{\text{Le polygone régulier à } 16 \text{ côtés est constructible, comme tout } 2^{k}\text{-gone.}}$$
     La tour de radicaux carrés se lit d'ailleurs sur la chaîne de sous-groupes d'indices $2$ successifs du groupe de Galois.
