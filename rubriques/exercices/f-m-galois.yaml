  enonce: |
    Soit $K$ un corps, $L=K\big(X_{1}\,;X_{2}\,;X_{3}\,;X_{4}\big)$ le corps des fractions rationnelles en quatre indéterminées, et $M=K\big(s_{1}\,;s_{2}\,;s_{3}\,;s_{4}\big)$ le sous-corps engendré par les fonctions symétriques élémentaires. Démontrer que $\theta=X_{1}X_{3}+X_{2}X_{4}$ possède un polynôme minimal de degré $3$ sur $M$, et l'expliciter à l'aide de $s_{1}$, $s_{2}$, $s_{3}$ et $s_{4}$. Démontrer ensuite que le corps des invariants du sous-groupe de $\mathfrak{S}_{4}$ engendré par $(1\ 2\ 3\ 4)$ et $(1\ 3)$ est $M(\theta)$.
  corrige: |
    D'après l'exemple du cours consacré aux fonctions symétriques, $L/M$ est galoisienne de groupe $\mathfrak{S}_{4}$, agissant par permutation des indéterminées. Une permutation envoie le découpage $\big\{\{1\,;3\}\,;\{2\,;4\}\big\}$ de $\{1\,;2\,;3\,;4\}$ sur l'un des trois découpages en deux paires ; l'orbite de $\theta$ est donc formée des trois éléments distincts 
    $$\theta_{1}=X_{1}X_{3}+X_{2}X_{4} \qquad \theta_{2}=X_{1}X_{2}+X_{3}X_{4} \qquad \theta_{3}=X_{1}X_{4}+X_{2}X_{3}$$
     Le polynôme minimal de $\theta$ sur $M$ est le produit des $T-\theta_{i}$, de coefficients symétriques donc dans $M$. Son développement donne : 
    $$\boxed{\mu_{\theta}=T^{3}-s_{2}T^{2}+\big(s_{1}s_{3}-4s_{4}\big)T-\big(s_{1}^{2}s_{4}-4s_{2}s_{4}+s_{3}^{2}\big)}$$
     Le stabilisateur $H$ de $\theta$ est formé des permutations qui préservent le découpage $\big\{\{1\,;3\}\,;\{2\,;4\}\big\}$ ; il est d'ordre $\dfrac{24}{3}=8$. Les permutations $(1\ 2\ 3\ 4)$ et $(1\ 3)$ préservent ce découpage et engendrent un groupe $D$ d'ordre $8$, isomorphe à $D_{4}$ : donc $D=H$. D'après la correspondance de Galois, $L^{D}$ contient $M(\theta)$, et $\big[L^{D}:M\big]=\big[\mathfrak{S}_{4}:D\big]=3=[M(\theta):M]$. 
    $$\boxed{L^{D}=M(\theta)}$$
     Pour un polynôme $X^{4}+pX+q$, on a $s_{1}=s_{2}=0$, $s_{3}=-p$ et $s_{4}=q$, et $\mu_{\theta}$ devient $T^{3}-4qT-p^{2}$ : c'est la résolvante cubique utilisée à l'exercice 50, qui prend ici tout son sens.
