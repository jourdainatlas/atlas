  enonce: |
    Déterminer le corps de décomposition $L$ de $X^{5}-2$ sur $\mathbb{Q}$, ainsi que son degré $[L:\mathbb{Q}]$.
  corrige: |
    Le polynôme $X^{5}-2$ est irréductible sur $\mathbb{Q}$ par le critère d'Eisenstein en $2$. En notant $\alpha=\sqrt[5]{2}$ et $\zeta=\mathrm{e}^{2\mathrm{i}\pi/5}$, ses racines sont les $\alpha\zeta^{k}$ pour $0 \leqslant k \leqslant 4$. Le corps $L=\mathbb{Q}(\alpha\,;\zeta)$ les contient toutes, et il est engendré par elles puisque $\zeta=\dfrac{\alpha\zeta}{\alpha}$ : 
    $$\boxed{L=\mathbb{Q}\big(\sqrt[5]{2}\,;\zeta\big)}$$
     On a $[\mathbb{Q}(\alpha):\mathbb{Q}]=5$ et $[\mathbb{Q}(\zeta):\mathbb{Q}]=4$, puisque $\zeta$ est racine de $\Phi_{5}$, irréductible. Ces deux degrés divisent $[L:\mathbb{Q}]$ et sont premiers entre eux, donc $20$ divise $[L:\mathbb{Q}]$. Par ailleurs $\zeta$ est racine de $\Phi_{5}$ sur $\mathbb{Q}(\alpha)$, donc $[L:\mathbb{Q}(\alpha)] \leqslant 4$ et $[L:\mathbb{Q}] \leqslant 20$. 
    $$\boxed{[L:\mathbb{Q}]=20}$$
- id: "m-galois-27"
  feuille: "f-m-galois"
  numero: 27
  partie: "Chapitre 4 - Extensions de corps"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [constructions à la règle et au compas]
  noeuds: [galois-cyclotomie]
  notions: [point-constructible]
  page_enonce: 7
  page_corrige: 18
  enonce: |
    Démontrer que ni l'heptagone régulier ni l'ennéagone régulier ne sont constructibles à la règle et au compas. Pourquoi la quadrature du cercle échappe-t-elle à ce type de raisonnement ?
  corrige: |
    *L'heptagone.* Posons $\zeta=\mathrm{e}^{2\mathrm{i}\pi/7}$ et $c=\zeta+\zeta^{-1}=2\cos\dfrac{2\pi}{7}$. En divisant la relation $1+\zeta+\dots+\zeta^{6}=0$ par $\zeta^{3}$, et en utilisant $\zeta^{2}+\zeta^{-2}=c^{2}-2$ et $\zeta^{3}+\zeta^{-3}=c^{3}-3c$, on obtient : 
    $$c^{3}+c^{2}-2c-1=0$$
     Ce polynôme de degré $3$ n'a pas de racine rationnelle, ses seules candidates $\pm 1$ donnant $-1$ et $1$ : il est irréductible, et $\cos\dfrac{2\pi}{7}$ est de degré $3$ sur $\mathbb{Q}$. Or construire l'heptagone régulier revient à construire $\cos\dfrac{2\pi}{7}$ ; le critère de Wantzel l'interdit, $3$ n'étant pas une puissance de $2$.

    *L'ennéagone.* La formule $\cos(3\theta)=4\cos^{3}\theta-3\cos\theta$, appliquée à $\theta=\dfrac{2\pi}{9}$, montre que $x=\cos\dfrac{2\pi}{9}$ est racine de $8X^{3}-6X+1$. Aucun des candidats $\pm 1$, $\pm\frac{1}{2}$, $\pm\frac{1}{4}$, $\pm\frac{1}{8}$ n'est racine : ce polynôme est irréductible, et la même conclusion s'impose. 
    $$\boxed{\text{Ni l'heptagone ni l'ennéagone réguliers ne sont constructibles.}}$$
     *La quadrature.* Le critère de Wantzel ne porte que sur des nombres *algébriques* : il exige que le nombre à construire soit racine d'un polynôme, pour en mesurer le degré. Or la quadrature du cercle demande de construire $\sqrt{\pi}$, et l'on doit admettre un résultat d'une autre nature, la transcendance de $\pi$ démontrée par Lindemann en 1882.
- id: "m-galois-28"
  feuille: "f-m-galois"
  numero: 28
  partie: "Chapitre 5 - Séparabilité, normalité, corps finis"
  etoiles: 2
