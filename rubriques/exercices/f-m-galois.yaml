  enonce: |
    **1.** Déterminer tous les entiers $n$ compris entre $3$ et $30$ pour lesquels le polygone régulier à $n$ côtés est constructible.

    **2.** Justifier chacune des exclusions : $7$, $9$, $11$, $13$, $14$, $18$, $19$, $21$, $22$, $23$, $25$, $26$, $27$, $28$, $29$.

    **3.** Démontrer que si $2^{k}+1$ est premier, alors $k$ est une puissance de $2$. On appelle *nombres de Fermat* les entiers $F_{m}=2^{2^{m}}+1$.

    **4.** Les cinq premiers nombres de Fermat sont-ils tous premiers ? Que sait-on aujourd'hui de cette question, et quelle conséquence cela a-t-il sur la liste des polygones constructibles ?
  corrige: |
    **1.** On applique le critère à chaque entier : 
    $$\boxed{n \in \{3\,;4\,;5\,;6\,;8\,;10\,;12\,;15\,;16\,;17\,;20\,;24\,;30\}}$$

    **2.** On récapitule les exclusions :

    ```tableau
    $n$ ¦ $\varphi(n)$ ¦ raison
    $7$, $14$, $21$, $28$ ¦ $6$, $6$, $12$, $12$ ¦ $7$ n'est pas un premier de Fermat
    $9$, $18$, $27$ ¦ $6$, $6$, $18$ ¦ $3^{2}$ divise $n$
    $11$, $22$ ¦ $10$, $10$ ¦ $11$ n'est pas un premier de Fermat
    $13$, $26$ ¦ $12$, $12$ ¦ $13$ n'est pas un premier de Fermat
    $19$ ¦ $18$ ¦ $19$ n'est pas un premier de Fermat
    $23$ ¦ $22$ ¦ $23$ n'est pas un premier de Fermat
    $25$ ¦ $20$ ¦ $5^{2}$ divise $n$
    $29$ ¦ $28$ ¦ $29$ n'est pas un premier de Fermat
    ```

    **3.** Si $k=ab$ avec $a$ impair $>1$, alors $2^{b}+1$ divise $2^{ab}+1$, puisque $Y+1$ divise $Y^{a}+1$ pour $a$ impair, avec $Y=2^{b}$. Le nombre $2^{k}+1$ n'est donc pas premier. 
    $$\boxed{2^{k}+1 \text{ premier} \Longrightarrow k \text{ est une puissance de } 2.}$$

    **4.** $F_{0}=3$, $F_{1}=5$, $F_{2}=17$, $F_{3}=257$, $F_{4}=65537$ sont premiers ; mais Euler a montré en 1732 que $F_{5}=4294967297=641 \times 6700417$ ne l'est pas. Aucun $F_{m}$ avec $m \geqslant 5$ n'est connu premier. 
    $$\boxed{\begin{array}{l} \text{On ne sait pas s'il existe une infinité de premiers de Fermat,} \\[1mm] \text{donc la liste des polygones constructibles à nombre impair de côtés} \\[1mm] \text{n'est pas connue en totalité.} \end{array}}$$
- id: "m-galois-54"
  feuille: "f-m-galois"
  numero: 54
  partie: "Chapitre 7 - Résolubilité par radicaux"
  etoiles: 3
  types: [Calcul]
  mots_cles: [constructions à la règle et au compas]
  noeuds: [galois-cyclotomie]
  notions: [point-constructible]
  source: "Cambridge, Part II Galois Theory, feuille 4 (2019), exercice 16"
  page_enonce: 12
  page_corrige: 32
  enonce: |
    Pour quels entiers $n \geqslant 1$ peut-on trisecter à la règle et au compas un angle de mesure $\dfrac{2\pi}{n}$ ?
  corrige: |
    Disposer d'un angle de mesure $\dfrac{2\pi}{n}$ revient à disposer du point $\zeta_{n}=\mathrm{e}^{2\mathrm{i}\pi/n}$, et le trisecter revient à construire $\zeta_{3n}$.

    *Si $3$ ne divise pas $n$.* Il existe des entiers $u$ et $v$ tels que $3u+nv=1$, d'où $\dfrac{2\pi}{3n}=u\cdot\dfrac{2\pi}{n}+v\cdot\dfrac{2\pi}{3}$. L'angle $\dfrac{2\pi}{3}$ est constructible, puisque le triangle équilatéral l'est, et l'on sait reporter et additionner des angles : la trisection est possible.

    *Si $3$ divise $n$.* Les points constructibles à partir de $0$, $1$ et $\zeta_{n}$ sont obtenus par une suite d'extensions de degré $2$ au-dessus de $\mathbb{Q}(\zeta_{n})$, stable par conjugaison puisque $\overline{\zeta_{n}}=\zeta_{n}^{-1}$ : la démonstration du critère de Wantzel s'applique mot pour mot avec ce corps de base, et tout point constructible a un degré sur $\mathbb{Q}(\zeta_{n})$ qui est une puissance de $2$. Or, d'après le théorème 7.2 : 
    $$\big[\mathbb{Q}(\zeta_{3n}):\mathbb{Q}(\zeta_{n})\big]=\frac{\varphi(3n)}{\varphi(n)}=3 \qquad\text{lorsque } 3 \mid n$$
     Donc $\zeta_{3n}$ n'est pas constructible à partir de $\zeta_{n}$. 
    $$\boxed{\text{L'angle } \frac{2\pi}{n} \text{ est trisectable si et seulement si } 3 \nmid n.}$$
     Pour $n=6$, on retrouve l'impossibilité de trisecter l'angle $\dfrac{\pi}{3}$, établie au chapitre 4.
- id: "m-galois-55"
  feuille: "f-m-galois"
  numero: 55
  partie: "Chapitre 7 - Résolubilité par radicaux"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [groupes, irréductibilité, groupe de Galois]
  noeuds: [a-groupe, z-polynomes, gs-galoisiennes, gs-correspondance]
  notions: [polynome-irreductible, extension-galoisienne, groupe-galois]
  source: "Cambridge, Part II Galois Theory, feuille 4 (2017), exercice 14 ; feuille 4 (2019), exercice 21"
  page_enonce: 13
  page_corrige: 33
  enonce: |
    Démontrer que, pour tout entier $n \geqslant 2$, le polynôme $X^{n}+X+3$ est irréductible sur $\mathbb{Q}$. Déterminer son groupe de Galois pour $n \leqslant 4$, en admettant les critères utilisés aux exercices 49 et 50.
  corrige: |
    *Irréductibilité.* Soit $P=X^{n}+X+3$, et supposons $P=GH$ avec $G,H \in \mathbb{Q}[X]$ unitaires non constants ; d'après le lemme de Gauss (théorème 3.6), on peut les prendre dans $\mathbb{Z}[X]$. Alors $G(0)H(0)=3$, et l'un des deux, disons $G(0)$, vaut $\pm 1$. D'après le théorème fondamental de l'algèbre, $G$ est scindé sur $\mathbb{C}$, et $|G(0)|$ est le produit des modules de ses racines : l'une d'elles, $z$, vérifie $|z| \leqslant 1$. Mais $z$ est racine de $P$, donc $3=\big|z^{n}+z\big| \leqslant |z|^{n}+|z| \leqslant 2$ : c'est absurde. 
    $$\boxed{X^{n}+X+3 \text{ est irréductible sur } \mathbb{Q} \text{ pour tout } n \geqslant 2.}$$
     *Groupes de Galois.* Pour $n=2$, le groupe est $\mathbb{Z}/2\mathbb{Z}$. Pour $n=3$, le discriminant $-4\cdot 1^{3}-27\cdot 3^{2}=-247$ n'est pas un carré : le groupe, transitif et non contenu dans $\mathfrak{A}_{3}$, est $\mathfrak{S}_{3}$. Pour $n=4$, avec les notations de l'exercice 50, la résolvante cubique $X^{3}-12X-1$ n'a pas de racine rationnelle, donc est irréductible ; ses racines appartenant au corps de décomposition d'après l'exercice 41, le degré $3$ divise $|G|$. Le discriminant $-27+256\cdot 27=6\,885$ n'est pas un carré, donc $G \not\subseteq \mathfrak{A}_{4}$. Parmi les sous-groupes transitifs de $\mathfrak{S}_{4}$, seul $\mathfrak{S}_{4}$ a un ordre multiple de $3$ sans être contenu dans $\mathfrak{A}_{4}$. 
    $$\boxed{\mathbb{Z}/2\mathbb{Z} \qquad \mathfrak{S}_{3} \qquad \mathfrak{S}_{4} \qquad (n=2,\ 3,\ 4)}$$

