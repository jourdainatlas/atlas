  enonce: |
    Déterminer le groupe de Galois de $X^{5}-2$ sur $\mathbb{Q}$, dont l'exercice 26 a calculé le corps de décomposition. On le comparera au groupe affine $\mathrm{Aff}(\mathbb{F}_{5})$ de l'exercice 15.
  corrige: |
    D'après l'exercice 26, le corps de décomposition est $L=\mathbb{Q}(\alpha\,;\zeta)$ avec $\alpha=\sqrt[5]{2}$ et $\zeta=\mathrm{e}^{2\mathrm{i}\pi/5}$, de degré $20$ ; comme $L/\mathbb{Q}$ est galoisienne, $|G|=20$. Un élément $\sigma \in G$ envoie $\zeta$ sur une racine primitive cinquième de l'unité et $\alpha$ sur une racine de $X^{5}-2$ : 
    $$\sigma(\zeta)=\zeta^{a} \quad (a \in \mathbb{F}_{5}^{*}) \qquad\text{et}\qquad \sigma(\alpha)=\alpha\zeta^{b} \quad (b \in \mathbb{F}_{5})$$
     L'élément $\sigma$ est déterminé par le couple $(a\,;b)$, et il y a $4 \times 5=20$ couples : tous sont réalisés. Si $\tau$ correspond à $(c\,;d)$, alors $\sigma\tau(\zeta)=\zeta^{ac}$ et $\sigma\tau(\alpha)=\sigma\big(\alpha\zeta^{d}\big)=\alpha\zeta^{b+ad}$. Or dans le groupe affine, $\varphi_{a,b}\circ\varphi_{c,d}=\varphi_{ac,\,ad+b}$ : l'application $\sigma \mapsto \varphi_{a,b}$ est un isomorphisme. 
    $$\boxed{\mathrm{Gal}\big(X^{5}-2\big) \simeq \mathrm{Aff}(\mathbb{F}_{5}), \text{ d'ordre } 20}$$
     Ce groupe est résoluble, conformément à l'exercice 15 et au fait évident que les racines de $X^{5}-2$ s'expriment par radicaux. Le sous-groupe $\mathrm{Gal}(L/\mathbb{Q}(\zeta))$ correspond aux translations, et $\mathrm{Gal}(L/\mathbb{Q}(\alpha))$ au stabilisateur de $0$.
