  page_enonce: 5
  page_corrige: 10
  enonce: |
    Soit $\mathbb{F}$ un corps fini et $n \geqslant 1$. Démontrer que le groupe des matrices triangulaires supérieures inversibles de taille $n$ à coefficients dans $\mathbb{F}$ est résoluble.
  corrige: |
    Notons $B$ ce groupe et $U$ le sous-groupe des matrices triangulaires supérieures à diagonale formée de $1$. L'application qui à $A \in B$ associe sa diagonale est un morphisme surjectif de $B$ sur $\big(\mathbb{F}^{*}\big)^{n}$, puisque la diagonale d'un produit de matrices triangulaires supérieures est le produit des diagonales. Son noyau est $U$, donc $U \trianglelefteq B$ et le premier théorème d'isomorphisme donne $B/U \simeq \big(\mathbb{F}^{*}\big)^{n}$, qui est abélien.

    Pour $1 \leqslant k \leqslant n$, notons $U_{k}$ l'ensemble des $I_{n}+N \in U$ tels que $N_{ij}=0$ dès que $j-i<k$, de sorte que $U_{1}=U$ et $U_{n}=\{I_{n}\}$. Si $I_{n}+N$ et $I_{n}+N'$ sont dans $U_{k}$, leur produit vaut $I_{n}+N+N'+NN'$, et $NN'$ n'a de coefficients non nuls qu'à partir de la diagonale d'indice $2k \geqslant k+1$. L'application qui associe à un élément de $U_{k}$ sa $k$-ième surdiagonale est donc un morphisme de $U_{k}$ vers le groupe additif $\mathbb{F}^{n-k}$, de noyau $U_{k+1}$. Il en résulte que $U_{k+1} \trianglelefteq U_{k}$ et que $U_{k}/U_{k+1}$ est abélien. 
    $$U=U_{1} \trianglerighteq U_{2} \trianglerighteq \cdots \trianglerighteq U_{n}=\{I_{n}\}$$
     Le groupe $U$ est donc résoluble, ainsi que $B/U$, et le théorème 2.8 conclut. 
    $$\boxed{\text{Le groupe des matrices triangulaires supérieures inversibles est résoluble.}}$$
     La finitude de $\mathbb{F}$ ne sert pas : le résultat vaut sur tout corps. Pour $n=3$ et $\mathbb{F}=\mathbb{F}_{p}$, le groupe $U$ est le groupe de Heisenberg de l'exercice 9.
