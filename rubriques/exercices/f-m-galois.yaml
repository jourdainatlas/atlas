  enonce: |
    On pose $\alpha=\sqrt{\big(2+\sqrt{2}\big)\big(3+\sqrt{3}\big)}$ et $E=\mathbb{Q}(\alpha)$. Démontrer que $E/\mathbb{Q}$ est une extension galoisienne de degré $8$, dont le groupe de Galois est isomorphe au groupe des quaternions $Q_{8}$ de l'exercice 8.
  corrige: |
    Posons $F=\mathbb{Q}\big(\sqrt{2}\,;\sqrt{3}\big)$, de degré $4$, et $a=\big(2+\sqrt{2}\big)\big(3+\sqrt{3}\big)$. Pour des signes $\varepsilon,\varepsilon'$, notons $a_{\varepsilon,\varepsilon'}=\big(2+\varepsilon\sqrt{2}\big)\big(3+\varepsilon'\sqrt{3}\big)$ : ce sont quatre éléments distincts de $F$.

    *Le nombre $a$ n'est pas un carré dans $F$.* Soit $\rho$ l'automorphisme de $F$ qui change le signe de $\sqrt{2}$ et fixe $\sqrt{3}$. Si $a=\gamma^{2}$ avec $\gamma \in F$, alors $\gamma\rho(\gamma)$ est fixé par $\rho$, donc appartient à $\mathbb{Q}\big(\sqrt{3}\big)$, et $\big(\gamma\rho(\gamma)\big)^{2}=a\,\rho(a)=2\big(3+\sqrt{3}\big)^{2}$. Le nombre $2$ serait un carré dans $\mathbb{Q}\big(\sqrt{3}\big)$, ce qui est faux. Ainsi $[F(\alpha):F]=2$ et $[F(\alpha):\mathbb{Q}]=8$.

    *Le corps $F(\alpha)$ est galoisien.* Il contient les racines carrées de tous les $a_{\varepsilon,\varepsilon'}$, car les produits 
    $$\alpha^{2}a_{-,+}=2\big(3+\sqrt{3}\big)^{2} \qquad \alpha^{2}a_{+,-}=6\big(2+\sqrt{2}\big)^{2} \qquad \alpha^{2}a_{-,-}=12$$
     sont des carrés dans $F$. C'est donc le corps de décomposition du polynôme $\prod\big(X^{2}-a_{\varepsilon,\varepsilon'}\big)$, à coefficients rationnels, et $F(\alpha)/\mathbb{Q}$ est galoisienne de degré $8$.

    *On a $E=F(\alpha)$.* Tout $g \in G=\mathrm{Gal}(F(\alpha)/\mathbb{Q})$ vérifie $g(\alpha)^{2}=g(a)=a_{\varepsilon,\varepsilon'}$, les signes étant ceux de la restriction de $g$ à $F$. Si $g(\alpha)=g'(\alpha)$, alors $g(a)=g'(a)$, les restrictions à $F$ coïncident, et $g=g'$. L'élément $\alpha$ a donc huit conjugués distincts : $[\mathbb{Q}(\alpha):\mathbb{Q}]=8$, et $E=F(\alpha)$ est galoisienne de degré $8$.

    *Le groupe.* Notons $z$ l'automorphisme qui fixe $F$ et change $\alpha$ en $-\alpha$ ; il change aussi le signe des racines $\dfrac{\gamma}{\alpha}$, $\gamma \in F$, donc il commute à tout $g \in G$. Soit $\sigma$ un relèvement de $\rho$. D'après la première égalité ci-dessus, $\sigma(\alpha)=\dfrac{s\sqrt{2}\big(3+\sqrt{3}\big)}{\alpha}$ avec $s=\pm 1$, d'où : 
    $$\sigma^{2}(\alpha)=\frac{s\,\sigma\big(\sqrt{2}\big(3+\sqrt{3}\big)\big)}{\sigma(\alpha)}=\frac{-s\sqrt{2}\big(3+\sqrt{3}\big)\,\alpha}{s\sqrt{2}\big(3+\sqrt{3}\big)}=-\alpha$$
     Donc $\sigma^{2}=z$. Le même calcul, mené avec $\sqrt{6}\big(2+\sqrt{2}\big)$ et $2\sqrt{3}$, montre que tout relèvement $\tau$ de l'automorphisme qui fixe $\sqrt{2}$ et change le signe de $\sqrt{3}$ vérifie $\tau^{2}=z$, et que $(\sigma\tau)^{2}=z$, puisque $\sigma\tau$ relève le troisième élément non trivial de $\mathrm{Gal}(F/\mathbb{Q})$.

    Le commutateur $\sigma\tau\sigma^{-1}\tau^{-1}$ se restreint à l'identité sur $F$, le groupe $\mathrm{Gal}(F/\mathbb{Q})$ étant abélien : il vaut $\mathrm{id}$ ou $z$. S'il valait $\mathrm{id}$, on aurait $(\sigma\tau)^{2}=\sigma^{2}\tau^{2}=z^{2}=\mathrm{id}$, ce qui est faux. Donc $\sigma\tau=z\,\tau\sigma$. Posons alors $\mathrm{i}=\sigma$, $\mathrm{j}=\tau$, $\mathrm{k}=\sigma\tau$ et $-1=z$ : on a $\mathrm{i}^{2}=\mathrm{j}^{2}=\mathrm{k}^{2}=-1$, l'élément $-1$ est central d'ordre $2$, et 
    $$\mathrm{j}\mathrm{k}=\tau\sigma\tau=z\,\sigma\tau^{2}=\sigma=\mathrm{i} \qquad \mathrm{k}\mathrm{i}=\sigma\tau\sigma=z\,\sigma^{2}\tau=\tau=\mathrm{j}$$
     Ce sont exactement les relations qui définissent $Q_{8}$ à l'exercice 8. Les huit éléments $\pm 1$, $\pm\mathrm{i}$, $\pm\mathrm{j}$, $\pm\mathrm{k}$ de $G$ sont distincts, car leurs restrictions à $F$ et leurs actions sur $\alpha$ les séparent, et leur table de multiplication est entièrement déterminée par ces relations. 
    $$\boxed{\mathrm{Gal}(E/\mathbb{Q}) \simeq Q_{8}}$$
     Le groupe des quaternions, dont les sous-groupes sont tous distingués, n'a que des sous-corps galoisiens : les trois corps quadratiques de $F$, le corps $F$ lui-même, $\mathbb{Q}$ et $E$.
