  source: "Cambridge, Part II Galois Theory, feuille 4 (2017), exercice 7"
  page_enonce: 12
  page_corrige: 31
  enonce: |
    Démontrer que le groupe de Galois de $X^{5}+20X^{2}-2$ sur $\mathbb{Q}$ est $\mathfrak{S}_{5}$. Soit ensuite $K$ une extension finie de $\mathbb{Q}$ de degré premier $q \geqslant 7$ : démontrer que le groupe de Galois de ce polynôme sur $K$ est encore $\mathfrak{S}_{5}$.
  corrige: |
    *Sur $\mathbb{Q}$.* Le polynôme $f=X^{5}+20X^{2}-2$ est irréductible par Eisenstein en $2$. Sa dérivée $5x^{4}+40x=5x\big(x^{3}+8\big)$ s'annule en $-2$ et $0$, avec $f(-2)=46>0$ et $f(0)=-2<0$ ; comme $f$ tend vers $-\infty$ en $-\infty$ et vers $+\infty$ en $+\infty$, le théorème des valeurs intermédiaires fournit exactement trois racines réelles. La proposition 7.5 donne : 
    $$\boxed{\mathrm{Gal}_{\mathbb{Q}}(f) \simeq \mathfrak{S}_{5}}$$
     *Sur $K$.* Soit $L \subset \mathbb{C}$ le corps de décomposition de $f$ sur $\mathbb{Q}$, de degré $120$, et $LK$ le corps engendré par $K$ et les racines de $f$, qui est le corps de décomposition de $f$ sur $K$. En calculant $[LK:\mathbb{Q}]$ de deux façons : 
    $$[LK:K]\times q=[LK:\mathbb{Q}]=[LK:L]\times 120$$
     Comme $q \geqslant 7$ est premier, il est premier avec $120$, qui divise donc $[LK:K]$. Or $\mathrm{Gal}(LK/K)$ agit fidèlement sur les cinq racines, donc s'identifie à un sous-groupe de $\mathfrak{S}_{5}$, et $[LK:K] \leqslant 120$. Ainsi $[LK:K]=120$. 
    $$\boxed{\mathrm{Gal}_{K}(f) \simeq \mathfrak{S}_{5}}$$
     Pour $q \in \{2\,;3\,;5\}$, l'argument ne s'applique plus, et la conclusion peut tomber : sur l'extension de degré $2$ engendrée par une racine carrée du discriminant de $f$, le groupe devient $\mathfrak{A}_{5}$.
- id: "m-galois-52"
  feuille: "f-m-galois"
  numero: 52
  partie: "Chapitre 7 - Résolubilité par radicaux"
  etoiles: 3
  types: [Problème, Démonstration, Calcul]
  mots_cles: [groupes, sous-groupes, groupe symétrique, actions de groupes, groupes résolubles, irréductibilité, corps finis, résolubilité par radicaux]
  noeuds: [a-groupe, a-sous-groupe, a-distingue, gs-radicaux, z-polynomes, gs-corps-finis, gs-abel-ruffini]
  notions: [groupe-symetrique, action-groupe, groupe-resoluble, polynome-irreductible, corps-fini]
  page_enonce: 12
  page_corrige: 31
  enonce: |
    On pose $P=X^{5}-5X+12$. Contrairement à $X^{5}-4X+2$, ce polynôme est *résoluble par radicaux*.

    **1.** Démontrer que $P$ est irréductible sur $\mathbb{Q}$. On pourra réduire modulo un nombre premier bien choisi.

    **2.** Démontrer que $P$ possède exactement une racine réelle, en étudiant les variations.

    **3.** Calculer le discriminant et vérifier que $64\,000\,000=8000^{2}$. En déduire que $G \subseteq \mathfrak{A}_{5}$.

    **4.** Dresser la liste des sous-groupes transitifs de $\mathfrak{A}_{5}$ : on trouvera $\mathbb{Z}/5\mathbb{Z}$, le groupe diédral $D_{5}$ d'ordre $10$, et $\mathfrak{A}_{5}$.

    **5.** La conjugaison complexe fixe une racine et échange les autres deux à deux : quelle est sa structure de cycles ? En déduire que $G \neq \mathbb{Z}/5\mathbb{Z}$.

    **6.** On admet que, pour presque tout premier $p$, la structure de cycles du Frobenius se lit sur la factorisation de $P$ modulo $p$. Les motifs observés pour $p<200$ sont $(5)$, $(1\,;2\,;2)$ et $(1\,;1\,;1\,;1\,;1)$, jamais $(1\,;1\,;3)$. Qu'en déduit-on sur les ordres des éléments de $G$, et donc sur $G$ ?

    **7.** Conclure que $G \simeq D_{5}$, puis que $P$ *est* résoluble par radicaux. Quelle morale en tirer sur le théorème d'Abel-Ruffini ?
  corrige: |
    **1.** Modulo $7$, le polynôme devient $X^{5}+2X+5$, qui n'a pas de racine dans $\mathbb{F}_{7}$ et ne se factorise pas en degrés $2+3$ — un calcul direct montre qu'il est irréductible sur $\mathbb{F}_{7}$. Le lemme de Gauss conclut. 
    $$\boxed{P \text{ est irréductible sur } \mathbb{Q}.}$$
     *Piège :* le premier $2$ ne convient pas, car $P \equiv X(X+1)^{4} \; [2]$ : le discriminant est divisible par $2$, et la réduction perd la séparabilité.

    **2.** On a $P'(x)=5x^{4}-5=5\big(x^{4}-1\big)$, qui s'annule en $\pm 1$. Or : 
    $$P(-1)=-1+5+12=16>0 \qquad\text{et}\qquad P(1)=1-5+12=8>0$$
     La fonction croît jusqu'à $16$, redescend jusqu'à $8$ en restant positive, puis croît. Comme $P(x) \to -\infty$ en $-\infty$, elle ne s'annule qu'une fois. 
    $$\boxed{P \text{ possède exactement une racine réelle, et quatre racines complexes non réelles.}}$$

    **3.** Le discriminant vaut $64\,000\,000$, et $8000^{2}=64\,000\,000$. 
    $$\boxed{\Delta \text{ est un carré, donc } G \subseteq \mathfrak{A}_{5}.}$$

    **4.** Un sous-groupe transitif de $\mathfrak{S}_{5}$ a un ordre divisible par $5$. Ceux contenus dans $\mathfrak{A}_{5}$ sont : 
    $$\boxed{\mathbb{Z}/5\mathbb{Z} \; (\text{ordre } 5), \qquad D_{5} \; (\text{ordre } 10), \qquad \mathfrak{A}_{5} \; (\text{ordre } 60)}$$
     Le groupe $F_{20}$ d'ordre $20$ n'est pas contenu dans $\mathfrak{A}_{5}$, car il contient des $4$-cycles.

    **5.** La conjugaison complexe fixe l'unique racine réelle et échange les racines complexes deux à deux conjuguées : c'est un produit de deux transpositions. 
    $$\boxed{G \text{ contient un élément d'ordre } 2, \text{ donc } G \neq \mathbb{Z}/5\mathbb{Z}.}$$

    **6.** Les motifs $(5)$, $(1\,;2\,;2)$ et $(1^{5})$ correspondent respectivement à des éléments d'ordre $5$, $2$ et $1$. L'absence du motif $(1\,;1\,;3)$ signale qu'aucun élément de $G$ n'est d'ordre $3$. 
    $$\boxed{G \text{ ne contient aucun élément d'ordre } 3, \text{ donc } G \neq \mathfrak{A}_{5}.}$$
     En effet $\mathfrak{A}_{5}$ possède vingt $3$-cycles, d'après l'exercice 11. Or $D_{5}$ n'a que des éléments d'ordre $1$, $2$ et $5$ — ce qui correspond exactement aux trois motifs observés.

    **7.** Il ne reste qu'une possibilité, et $D_{5}$ est résoluble : la suite $\{\mathrm{id}\} \trianglelefteq \mathbb{Z}/5\mathbb{Z} \trianglelefteq D_{5}$ a pour quotients $\mathbb{Z}/5\mathbb{Z}$ et $\mathbb{Z}/2\mathbb{Z}$. 
    $$\boxed{G \simeq D_{5}, \text{ et } P=X^{5}-5X+12 \text{ \emph{est} résoluble par radicaux.}}$$

    *Morale.* Le théorème d'Abel-Ruffini n'affirme pas que *toute* équation de degré $5$ est irrésoluble, mais qu'il n'existe pas de formule *générale*. Comparée à $X^{5}+20X^{2}-2$ de l'exercice 51, qui a pour groupe $\mathfrak{S}_{5}$, cette quintique montre que le degré ne décide de rien : c'est la structure du groupe de Galois, et elle seule, qui tranche.
