  enonce: |
    **1.** Dresser la liste des classes de conjugaison de $\mathfrak{S}_{4}$, avec leurs cardinaux. Vérifier que la somme vaut $24$.

    **2.** Faire de même pour $\mathfrak{S}_{5}$. On trouvera sept classes.

    **3.** En déduire, sans calcul supplémentaire, les sous-groupes distingués possibles de $\mathfrak{S}_{4}$ : un sous-groupe distingué est une réunion de classes de conjugaison contenant $\mathrm{id}$, dont le cardinal divise $24$.
  corrige: |
    **1.** Les cinq partitions de $4$ donnent cinq classes :

    $$\begin{array}{|c||c|c|c|c|c|} \hline \text{structure} & 1^{4} & 2\,1^{2} & 2^{2} & 3\,1 & 4 \\ \hline \text{cardinal} & 1 & 6 & 3 & 8 & 6 \\ \hline \end{array}$$

    $$\boxed{1+6+3+8+6=24 \quad \checkmark}$$

    **2.** Les sept partitions de $5$ donnent sept classes, de cardinaux : 
    $$\boxed{1 \;(\,1^{5}) \;,\; 10 \;(2\,1^{3}) \;,\; 15 \;(2^{2}1) \;,\; 20 \;(3\,1^{2}) \;,\; 20 \;(3\,2) \;,\; 30 \;(4\,1) \;,\; 24 \;(5)}$$
     dont la somme vaut $120$.

    **3.** Les réunions de classes contenant $\mathrm{id}$ dont le cardinal divise $24$ sont $1$, $1+3=4$, $1+3+8=12$ et $24$ : 
    $$\boxed{\{\mathrm{id}\} \;\trianglelefteq\; V \;\trianglelefteq\; \mathfrak{A}_{4} \;\trianglelefteq\; \mathfrak{S}_{4}}$$
- id: "m-galois-12"
  feuille: "f-m-galois"
  numero: 12
  partie: "Chapitre 2 - Quotients, actions et résolubilité"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [groupes, théorèmes de Sylow, groupes résolubles]
  noeuds: [a-groupe, gs-radicaux]
  notions: [sous-groupe-sylow, groupe-resoluble]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    **1.** Énoncer le théorème de Cauchy, puis l'appliquer pour montrer qu'un groupe d'ordre $15$ contient un élément d'ordre $3$ et un élément d'ordre $5$.

    **2.** Soit $G$ d'ordre $15$. À l'aide des théorèmes de Sylow, démontrer que $G$ possède un unique $3$-Sylow et un unique $5$-Sylow, puis que $G \simeq \mathbb{Z}/15\mathbb{Z}$.

    **3.** Soit $G$ d'ordre $12$. Démontrer que $G$ n'est pas simple. On discutera selon le nombre de $3$-Sylow.

    **4.** Démontrer qu'un groupe d'ordre $pq$, avec $p<q$ premiers et $p \nmid q-1$, est cyclique.
  corrige: |
    **1.** *Cauchy :* si $p$ premier divise $|G|$, alors $G$ contient un élément d'ordre $p$. Comme $15=3 \times 5$, on obtient un élément d'ordre $3$ et un d'ordre $5$.

    **2.** Notons $n_{3}$ et $n_{5}$ les nombres de $3$- et $5$-Sylow. On a $n_{3} \equiv 1 \; [3]$ et $n_{3} \mid 5$, donc $n_{3}=1$ ; de même $n_{5} \equiv 1 \; [5]$ et $n_{5} \mid 3$, donc $n_{5}=1$. Ces deux sous-groupes $P$ et $Q$ sont donc distingués, d'intersection triviale, et $PQ$ est d'ordre $15$ : 
    $$\boxed{G \simeq \mathbb{Z}/3\mathbb{Z} \times \mathbb{Z}/5\mathbb{Z} \simeq \mathbb{Z}/15\mathbb{Z}}$$

    **3.** Ici $12=2^{2} \times 3$. On a $n_{3} \in \{1\,;4\}$. Si $n_{3}=1$, le $3$-Sylow est distingué. Si $n_{3}=4$, les quatre $3$-Sylow fournissent $4 \times 2=8$ éléments d'ordre $3$ ; il reste $12-8=4$ éléments, qui forment nécessairement l'unique $2$-Sylow, lequel est alors distingué. 
    $$\boxed{\text{Aucun groupe d'ordre } 12 \text{ n'est simple.}}$$

    **4.** On a $n_{q} \equiv 1 \; [q]$ et $n_{q} \mid p<q$, donc $n_{q}=1$ ; et $n_{p} \equiv 1 \; [p]$ avec $n_{p} \mid q$, donc $n_{p} \in \{1\,;q\}$, mais $q \not\equiv 1 \; [p]$ par hypothèse, donc $n_{p}=1$. Les deux Sylow sont distingués, d'intersection triviale : 
    $$\boxed{G \simeq \mathbb{Z}/p\mathbb{Z} \times \mathbb{Z}/q\mathbb{Z} \simeq \mathbb{Z}/pq\mathbb{Z}}$$
- id: "m-galois-13"
  feuille: "f-m-galois"
  numero: 13
  partie: "Chapitre 2 - Quotients, actions et résolubilité"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [groupes, sous-groupes]
  noeuds: [a-groupe, a-sous-groupe]
  notions: []
  source: "K. Conrad, « Consequences of the Sylow theorems », notes en ligne"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Démontrer qu'un groupe fini qui possède au plus un sous-groupe de chaque ordre est cyclique. On pourra commencer par le cas où l'ordre du groupe est une puissance d'un nombre premier.
  corrige: |
    *Le cas d'un $p$-groupe.* Supposons $|G|=p^{n}$, et soit $g$ un élément d'ordre maximal $p^{m}$. Tout $h \in G$ a un ordre $p^{k}$ avec $k \leqslant m$. Le groupe cyclique $\langle g \rangle$ possède un sous-groupe d'ordre $p^{k}$, à savoir $\big\langle g^{p^{m-k}} \big\rangle$ ; or $\langle h \rangle$ est aussi d'ordre $p^{k}$, et l'hypothèse d'unicité impose $\langle h \rangle=\big\langle g^{p^{m-k}} \big\rangle \subseteq \langle g \rangle$. Ainsi $G=\langle g \rangle$ est cyclique.

    *Le cas général.* Écrivons $|G|=p_{1}^{a_{1}}\cdots p_{r}^{a_{r}}$. Pour chaque $i$, les $p_{i}$-Sylow sont tous de même ordre, donc il n'y en a qu'un, $P_{i}$ : il est distingué, puisque ses conjugués sont encore des $p_{i}$-Sylow. Les sous-groupes de $P_{i}$ étant des sous-groupes de $G$, le groupe $P_{i}$ hérite de l'hypothèse, et il est cyclique d'après le premier cas ; soit $g_{i}$ un générateur.

    Pour $i \neq j$, les éléments de $P_{i}$ et de $P_{j}$ commutent : si $x \in P_{i}$ et $y \in P_{j}$, le commutateur $xyx^{-1}y^{-1}$ appartient à $P_{i}$, puisque $yx^{-1}y^{-1} \in P_{i}$, et à $P_{j}$, puisque $xyx^{-1} \in P_{j}$ ; or $P_{i} \cap P_{j}=\{e\}$, les ordres étant premiers entre eux. L'élément $g=g_{1}\cdots g_{r}$ est alors un produit d'éléments qui commutent deux à deux et d'ordres premiers entre eux : son ordre est le produit de ces ordres, c'est-à-dire $|G|$. 
    $$\boxed{G=\langle g_{1}\cdots g_{r} \rangle \text{ est cyclique.}}$$
     La réciproque est vraie : un groupe cyclique d'ordre $n$ possède exactement un sous-groupe de chaque ordre divisant $n$.
- id: "m-galois-14"
  feuille: "f-m-galois"
  numero: 14
  partie: "Chapitre 2 - Quotients, actions et résolubilité"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [groupes, théorèmes de Sylow, groupes résolubles]
  noeuds: [a-groupe, gs-radicaux]
  notions: [sous-groupe-sylow, groupe-resoluble]
  source: "K. Conrad, « Consequences of the Sylow theorems », théorème 9.3"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Soit $G$ un groupe d'ordre $60$ possédant plus d'un $5$-Sylow. Démontrer que $G$ est simple.
  corrige: |
    Les $5$-Sylow sont en nombre $n_{5} \equiv 1 \;[5]$ divisant $12$, donc $n_{5} \in \{1\,;6\}$, et l'hypothèse impose $n_{5}=6$. Deux $5$-Sylow distincts se coupant trivialement, $G$ contient $6\times 4=24$ éléments d'ordre $5$. Supposons l'existence d'un sous-groupe distingué $N$ avec $\{e\} \neq N \neq G$.

    *Un lemme.* Tout groupe $H$ d'ordre $30$ possède un unique $5$-Sylow. En effet $n_{5}(H) \in \{1\,;6\}$ et $n_{3}(H) \in \{1\,;10\}$, et l'on ne peut avoir à la fois $n_{5}=6$ et $n_{3}=10$, ce qui ferait $24+20>30$ éléments. Si $n_{3}(H)=1$, le $3$-Sylow $Q$ est distingué, $QP$ est un sous-groupe d'ordre $15$ pour tout $5$-Sylow $P$, donc d'indice $2$ et distingué. Ce sous-groupe d'ordre $15$ est cyclique (exercice 12) et contient tous les $5$-Sylow de $H$, puisque l'image de l'un d'eux dans le quotient d'ordre $2$ est triviale : il n'en contient qu'un, donc $n_{5}(H)=1$.

    *Si $5$ divise $|N|$.* Alors $N$ contient un $5$-Sylow de $G$, donc tous ses conjugués, c'est-à-dire les six. Ainsi $|N| \geqslant 1+24=25$, et $|N|$ est un diviseur strict de $60$ multiple de $5$ : c'est $30$. Le lemme contredit alors la présence de six $5$-Sylow dans $N$.

    *Si $5$ ne divise pas $|N|$.* On a $|N| \in \{2\,;3\,;4\,;6\,;12\}$. Si $|N|=6$ ou $12$, le groupe $N$ possède un sous-groupe de Sylow qui y est unique : pour l'ordre $6$ c'est le $3$-Sylow, pour l'ordre $12$ l'un des deux d'après l'exercice 12. Ce sous-groupe $N'$ est distingué dans $G$, car $gN'g^{-1}$ est un sous-groupe de $gNg^{-1}=N$ de même ordre, donc égal à $N'$. Quitte à remplacer $N$ par $N'$, on peut supposer $|N| \in \{2\,;3\,;4\}$.

    Le quotient $G/N$ est alors d'ordre $30$, $20$ ou $15$, et possède un unique $5$-Sylow : par le lemme pour l'ordre $30$, et parce que $n_{5}$ divise $4$ ou $3$ dans les autres cas. Si $P$ est un $5$-Sylow de $G$, son image $PN/N$ est ce $5$-Sylow, qui est distingué dans $G/N$ ; d'après le théorème de correspondance, $PN$ est distingué dans $G$. Il contient alors les six $5$-Sylow, donc au moins $25$ éléments, alors que $|PN|=5\,|N| \leqslant 20$ : c'est absurde. 
    $$\boxed{G \text{ est simple.}}$$
     On peut montrer qu'un groupe simple d'ordre $60$ est isomorphe à $\mathfrak{A}_{5}$ : cet exercice est ainsi la première étape d'une caractérisation de $\mathfrak{A}_{5}$ par son ordre.
- id: "m-galois-15"
  feuille: "f-m-galois"
  numero: 15
