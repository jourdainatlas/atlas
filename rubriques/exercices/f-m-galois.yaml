  enonce: |
    Démontrer que le groupe de Galois de $X^{6}+3$ sur $\mathbb{Q}$ est isomorphe à $\mathfrak{S}_{3}$. Démontrer ensuite que ce polynôme, irréductible sur $\mathbb{Q}$, est réductible sur $\mathbb{F}_{p}$ pour tout nombre premier $p$.
  corrige: |
    *Le corps de décomposition.* Le polynôme $X^{6}+3$ est irréductible par le critère d'Eisenstein en $3$. Soit $\beta=\sqrt[6]{3}\,\mathrm{e}^{\mathrm{i}\pi/6}$, qui vérifie $\beta^{3}=\sqrt{3}\,\mathrm{e}^{\mathrm{i}\pi/2}=\mathrm{i}\sqrt{3}$, donc $\beta^{6}=-3$. Le corps $\mathbb{Q}(\beta)$ contient $\mathrm{i}\sqrt{3}=\beta^{3}$, donc $\omega=\mathrm{e}^{\mathrm{i}\pi/3}=\dfrac{1+\mathrm{i}\sqrt{3}}{2}$, racine primitive sixième de l'unité. Les six racines $\beta\omega^{k}$ sont donc dans $\mathbb{Q}(\beta)$, qui est le corps de décomposition $L$. 
    $$[L:\mathbb{Q}]=6 \qquad\text{donc}\qquad |G|=6$$
     *Les éléments.* Pour chaque $k \in \{0\,;\dots\,;5\}$, il existe un unique $\sigma_{k} \in G$ tel que $\sigma_{k}(\beta)=\beta\omega^{k}$. Comme $\omega=\dfrac{1+\beta^{3}}{2}$, on a $\sigma_{k}(\omega)=\dfrac{1+(-1)^{k}\beta^{3}}{2}$, qui vaut $\omega$ si $k$ est pair et $\omega^{-1}$ si $k$ est impair. Par conséquent $\sigma_{k}^{2}(\beta)=\beta\,\omega^{k}\,\sigma_{k}(\omega)^{k}$ vaut $\beta\omega^{2k}$ pour $k$ pair et $\beta$ pour $k$ impair : les $\sigma_{k}$ d'indice impair sont d'ordre $2$, et $\sigma_{2}$, $\sigma_{4}$ sont d'ordre $3$. Aucun élément n'est d'ordre $6$. Or un groupe abélien d'ordre $6$ est cyclique, le produit d'un élément d'ordre $2$ et d'un élément d'ordre $3$ qui commutent étant d'ordre $6$ : le groupe n'est donc pas abélien, et l'exercice 4 conclut. 
    $$\boxed{\mathrm{Gal}\big(X^{6}+3\big) \simeq \mathfrak{S}_{3}}$$
     *Réductibilité modulo $p$.* Pour $p=2$, on a $X^{6}+1=\big(X^{3}+1\big)^{2}$ ; pour $p=3$, le polynôme vaut $X^{6}$. Soit $p \geqslant 5$.

    • Si $p \equiv 2 \;[3]$, l'application $x \mapsto x^{3}$ est injective sur $\mathbb{F}_{p}^{*}$, puisque $3$ ne divise pas $p-1$ ; elle est donc bijective, et il existe $c$ tel que $c^{3}=-3$. Alors $X^{6}+3=X^{6}-c^{3}=\big(X^{2}-c\big)\big(X^{4}+cX^{2}+c^{2}\big)$.

    • Si $p \equiv 1 \;[3]$, le groupe cyclique $\mathbb{F}_{p}^{*}$ contient un élément $j$ d'ordre $3$, qui vérifie $j^{2}+j+1=0$, d'où $(2j+1)^{2}=-3$. Avec $s=2j+1$, il vient $X^{6}+3=X^{6}-s^{2}=\big(X^{3}-s\big)\big(X^{3}+s\big)$.

    $$\boxed{X^{6}+3 \text{ est réductible sur } \mathbb{F}_{p} \text{ pour tout nombre premier } p.}$$
     C'est le même phénomène que pour $X^{4}+1$ à l'exercice 19. Son explication générale, hors programme, est que le groupe de Galois ne contient aucun $6$-cycle.
