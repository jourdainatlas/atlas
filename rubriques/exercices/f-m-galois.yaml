  enonce: |
    On pose $P=X^{4}+8X+12$. Cet exercice détermine son groupe de Galois $G$.

    **1.** Démontrer que $P$ n'a pas de racine rationnelle, puis qu'il est irréductible sur $\mathbb{Q}$. On écartera aussi la factorisation en deux facteurs de degré $2$.

    **2.** En déduire que $G$ est un sous-groupe *transitif* de $\mathfrak{S}_{4}$. Dresser la liste des sous-groupes transitifs de $\mathfrak{S}_{4}$ : on en trouvera cinq, à savoir $\mathbb{Z}/4\mathbb{Z}$, le groupe de Klein $V$, $D_{4}$, $\mathfrak{A}_{4}$ et $\mathfrak{S}_{4}$.

    **3.** Calculer le discriminant de $P$ et vérifier que $331\,776=576^{2}$. En déduire que $G \subseteq \mathfrak{A}_{4}$.

    **4.** Il reste $V$ et $\mathfrak{A}_{4}$. La *résolvante cubique* de $X^{4}+pX+q$ est $R=X^{3}-4qX-p^{2}$. L'écrire ici, et démontrer qu'elle est irréductible sur $\mathbb{Q}$.

    **5.** On admet que $G$ est contenu dans $V$ si et seulement si $R$ est scindé sur $\mathbb{Q}$. Conclure que $G \simeq \mathfrak{A}_{4}$, puis donner $[L:\mathbb{Q}]$.

    **6.** Pourquoi ce groupe est-il « atypique » ? On comparera avec les exemples $X^{4}-2$, $X^{4}+1$ et $X^{4}-5X^{2}+6$ rencontrés dans le cours.
  corrige: |
    **1.** Les racines rationnelles possibles divisent $12$ : on vérifie que $\pm 1$, $\pm 2$, $\pm 3$, $\pm 4$, $\pm 6$, $\pm 12$ ne conviennent pas. Reste à écarter une factorisation en deux facteurs de degré $2$ ; en écrivant 
    $$X^{4}+8X+12=\big(X^{2}+aX+b\big)\big(X^{2}-aX+c\big)$$
     l'identification donne $b+c-a^{2}=0$, $a(c-b)=8$ et $bc=12$. De $c-b=\dfrac{8}{a}$ et $b+c=a^{2}$ on tire $4bc=a^{4}-\dfrac{64}{a^{2}}$, soit $a^{6}-48a^{2}-64=0$ : le réel $a^{2}$ serait racine de la résolvante de la question 4, qui est irréductible sur $\mathbb{Q}$. 
    $$\boxed{P \text{ est irréductible sur } \mathbb{Q}.}$$

    **2.** Le groupe $G$ permute les quatre racines et agit transitivement, puisque $P$ est irréductible. 
    $$\boxed{\text{Sous-groupes transitifs de } \mathfrak{S}_{4} : \; \mathbb{Z}/4\mathbb{Z}, \; V, \; D_{4}, \; \mathfrak{A}_{4}, \; \mathfrak{S}_{4}}$$
     Ce sont les seuls : un sous-groupe transitif a un ordre divisible par $4$, donc d'ordre $4$, $8$ ou $24$ ; les trois sous-groupes d'ordre $4$ qui sont transitifs sont les trois $\mathbb{Z}/4\mathbb{Z}$ et $V$, les sous-groupes d'ordre $8$ sont les trois conjugués de $D_{4}$, et l'on ajoute $\mathfrak{A}_{4}$ et $\mathfrak{S}_{4}$.

    **3.** Le discriminant vaut $331\,776$, et $576^{2}=331\,776$. 
    $$\boxed{\Delta \text{ est un carré, donc } G \subseteq \mathfrak{A}_{4}.}$$
     Il ne reste que deux possibilités, $V$ et $\mathfrak{A}_{4}$, puisque $\mathbb{Z}/4\mathbb{Z}$ et $D_{4}$ contiennent des $4$-cycles, qui sont impairs.

    **4.** Avec $p=8$ et $q=12$ : 
    $$R=X^{3}-4 \times 12\,X-8^{2}=X^{3}-48X-64$$
     Ses racines rationnelles diviseraient $64$ ; on vérifie que $\pm 1$, $\pm 2$, $\pm 4$, $\pm 8$, $\pm 16$, $\pm 32$, $\pm 64$ ne conviennent pas — par exemple $R(8)=512-384-64=64 \neq 0$. Étant de degré $3$ sans racine rationnelle : 
    $$\boxed{R=X^{3}-48X-64 \text{ est irréductible sur } \mathbb{Q}.}$$

    **5.** La résolvante n'étant pas scindée, $G \not\subseteq V$. 
    $$\boxed{G \simeq \mathfrak{A}_{4} \qquad\text{et}\qquad [L:\mathbb{Q}]=|G|=12}$$

    **6.** Les exemples usuels de degré $4$ épuisent les autres cas : $X^{4}-5X^{2}+6$ donne $V$, $X^{4}+1$ donne $V$ également, $X^{4}-2$ donne $D_{4}$, et un polynôme « générique » donne $\mathfrak{S}_{4}$. 
    $$\boxed{\begin{array}{l} \mathfrak{A}_{4} \text{ est le sous-groupe transitif de } \mathfrak{S}_{4} \text{ que l'on ne rencontre} \\[1mm] \text{jamais dans les exemples classiques : il exige un discriminant carré} \\[1mm] \text{\emph{et} une résolvante cubique irréductible.} \end{array}}$$
     C'est aussi le seul des cinq pour lequel $[L:\mathbb{Q}]=12$ n'est ni $4$, ni $8$, ni $24$.
- id: "m-galois-51"
  feuille: "f-m-galois"
