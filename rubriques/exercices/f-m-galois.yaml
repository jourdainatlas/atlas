  page_enonce: 9
  page_corrige: 22
  enonce: |
    Déterminer le groupe de Galois du polynôme $X^{4}+X^{3}+1$ sur chacun des corps $\mathbb{F}_{2}$, $\mathbb{F}_{3}$ et $\mathbb{F}_{4}$.
  corrige: |
    Sur un corps fini $\mathbb{F}_{q}$, le corps de décomposition d'un polynôme séparable est un $\mathbb{F}_{q^{m}}$, et son groupe de Galois est cyclique d'ordre $m$, engendré par $x \mapsto x^{q}$ ; il suffit donc de trouver $m$. Posons $P=X^{4}+X^{3}+1$.

    *Sur $\mathbb{F}_{2}$.* On a $P(0)=P(1)=1$ : pas de racine. Le seul polynôme irréductible de degré $2$ sur $\mathbb{F}_{2}$ est $X^{2}+X+1$, et son carré $X^{4}+X^{2}+1$ diffère de $P$. Donc $P$ est irréductible ; son corps de rupture $\mathbb{F}_{16}$ contient toutes ses racines, puisque c'est un corps de décomposition de $X^{16}-X$. 
    $$\boxed{\mathrm{Gal}_{\mathbb{F}_{2}}(P) \simeq \mathbb{Z}/4\mathbb{Z}}$$
     *Sur $\mathbb{F}_{3}$.* On a $P(1)=3=0$, et la division donne $P=(X-1)\big(X^{3}-X^{2}-X-1\big)$. Ce facteur cubique prend les valeurs $2$, $1$ et $1$ en $0$, $1$ et $2$ : il est irréductible, et son corps de décomposition est $\mathbb{F}_{27}$. 
    $$\boxed{\mathrm{Gal}_{\mathbb{F}_{3}}(P) \simeq \mathbb{Z}/3\mathbb{Z}}$$
     *Sur $\mathbb{F}_{4}$.* Les racines de $P$ engendrent $\mathbb{F}_{16}$ sur $\mathbb{F}_{2}$, donc n'appartiennent pas à $\mathbb{F}_{4}$, et $\mathbb{F}_{4}(\text{racines})=\mathbb{F}_{16}$, de degré $2$ sur $\mathbb{F}_{4}$. Le polynôme $P$ se factorise sur $\mathbb{F}_{4}$ en deux facteurs irréductibles de degré $2$. 
    $$\boxed{\mathrm{Gal}_{\mathbb{F}_{4}}(P) \simeq \mathbb{Z}/2\mathbb{Z}}$$
     Le même polynôme a donc trois groupes de Galois différents selon le corps de base.
