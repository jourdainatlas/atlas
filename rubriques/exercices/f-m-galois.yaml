  enonce: |
    Soient $a,b \in \mathbb{Q}$ tels que $b>0$ ne soit pas le carré d'un rationnel et que $a+\sqrt{b}>0$. On dit que $\alpha=\sqrt{a+\sqrt{b}}$ se *désimbrique* s'il appartient à un corps de la forme $\mathbb{Q}\big(\sqrt{c_{1}}\,;\dots\,;\sqrt{c_{k}}\big)$, avec $c_{1},\dots,c_{k} \in \mathbb{Q}$. Démontrer que $\alpha$ se désimbrique si et seulement si $a^{2}-b$ est le carré d'un rationnel. Lesquels des nombres suivants se désimbriquent ? Le cas échéant, en donner une écriture sans radical emboîté. 
    $$\sqrt{2+\sqrt{11}} \qquad \sqrt{6+\sqrt{11}} \qquad \sqrt{11+6\sqrt{2}} \qquad \sqrt{11+\sqrt{6}}$$
  corrige: |
    Posons $\beta=\sqrt{a-\sqrt{b}}$, racine carrée complexe de $a-\sqrt{b}$. Les nombres $\pm\alpha$ et $\pm\beta$ sont les racines de $f=X^{4}-2aX^{2}+\big(a^{2}-b\big) \in \mathbb{Q}[X]$, et l'on a : 
    $$(\alpha\beta)^{2}=\big(a+\sqrt{b}\big)\big(a-\sqrt{b}\big)=a^{2}-b$$
     *Condition suffisante.* Si $a^{2}-b=c^{2}$ avec $c \in \mathbb{Q}_{+}$, alors $b \leqslant a^{2}$ ; comme $a+\sqrt{b}>0$, on a nécessairement $a>0$. Posons $x=\dfrac{a+c}{2}$ et $y=\dfrac{a-c}{2}$ : leur somme vaut $a>0$ et leur produit $\dfrac{b}{4}>0$, donc ils sont positifs, et $\big(\sqrt{x}+\sqrt{y}\big)^{2}=a+2\sqrt{xy}=a+\sqrt{b}$. Ainsi $\alpha=\sqrt{x}+\sqrt{y}$ se désimbrique.

    *Condition nécessaire.* Supposons $\alpha \in M=\mathbb{Q}\big(\sqrt{c_{1}}\,;\dots\,;\sqrt{c_{k}}\big)$. Le corps $M$ est le corps de décomposition de $\prod\big(X^{2}-c_{i}\big)$ ; tout élément de son groupe de Galois change les signes des $\sqrt{c_{i}}$, si bien que ce groupe est abélien, d'exposant $2$. Tout sous-groupe étant distingué, $\mathbb{Q}(\alpha)/\mathbb{Q}$ est galoisienne, et son groupe, quotient du précédent, est abélien d'exposant $2$. Comme $\alpha^{2}=a+\sqrt{b} \notin \mathbb{Q}$, on a $[\mathbb{Q}(\alpha):\mathbb{Q}] \in \{2\,;4\}$.

    • Si $[\mathbb{Q}(\alpha):\mathbb{Q}]=2$, alors $\mathbb{Q}(\alpha)=\mathbb{Q}\big(\sqrt{b}\big)$, et $\alpha=u+v\sqrt{b}$ avec $u,v \in \mathbb{Q}$. En identifiant, $u^{2}+bv^{2}=a$ et $2uv=1$, d'où $a^{2}-b=\big(u^{2}+bv^{2}\big)^{2}-4u^{2}v^{2}b=\big(u^{2}-bv^{2}\big)^{2}$.

    • Si $[\mathbb{Q}(\alpha):\mathbb{Q}]=4$, alors $f$ est le polynôme minimal de $\alpha$, et $\beta \in \mathbb{Q}(\alpha)$. Soit $\sigma$ l'automorphisme tel que $\sigma(\alpha)=\beta$ : comme $\sigma^{2}=\mathrm{id}$, on a $\sigma(\beta)=\alpha$, donc $\sigma(\alpha\beta)=\alpha\beta$. Soit $\tau$ tel que $\tau(\alpha)=-\alpha$ : il fixe $\sqrt{b}=\alpha^{2}-a$, donc $\tau(\beta)=\pm\beta$. Si l'on avait $\tau(\beta)=\beta$, alors $\sigma\tau(\alpha)=-\beta$ et $\tau\sigma(\alpha)=\beta$, contredisant la commutativité ; donc $\tau(\beta)=-\beta$ et $\tau(\alpha\beta)=\alpha\beta$. Le produit $\alpha\beta$ est fixé par $\sigma$ et $\tau$, qui engendrent le groupe d'ordre $4$ : il est rationnel, et $a^{2}-b=(\alpha\beta)^{2}$ est le carré d'un rationnel.

    $$\boxed{\sqrt{a+\sqrt{b}} \text{ se désimbrique} \iff a^{2}-b \text{ est le carré d'un rationnel.}}$$
     *Application.* Pour $\sqrt{2+\sqrt{11}}$, on a $a^{2}-b=-7$ ; pour $\sqrt{11+\sqrt{6}}$, on a $a^{2}-b=115$ : ces deux nombres ne se désimbriquent pas. Pour $\sqrt{6+\sqrt{11}}$, on a $a^{2}-b=25$, d'où $x=\frac{11}{2}$ et $y=\frac{1}{2}$ ; pour $\sqrt{11+6\sqrt{2}}=\sqrt{11+\sqrt{72}}$, on a $a^{2}-b=49$, d'où $x=9$ et $y=2$ : 
    $$\boxed{\sqrt{6+\sqrt{11}}=\frac{\sqrt{22}+\sqrt{2}}{2} \qquad \sqrt{11+6\sqrt{2}}=3+\sqrt{2}}$$
