  enonce: |
    Soit $K$ un corps de caractéristique $p>0$, $a \in K$ et $f=X^{p}-X-a$. On suppose que $f$ n'a aucune racine dans $K$. Démontrer que $f$ est irréductible sur $K$, que son corps de décomposition est engendré par n'importe laquelle de ses racines, et que son groupe de Galois est isomorphe à $\mathbb{Z}/p\mathbb{Z}$. En déduire que $X^{p}-X-1$ est irréductible sur $\mathbb{Q}$ pour tout nombre premier $p$.
  corrige: |
    Soit $x$ une racine de $f$ dans un corps de décomposition $L$. Pour $b \in \mathbb{F}_{p} \subseteq K$, le rêve du débutant donne $f(x+b)=x^{p}+b^{p}-x-b-a=f(x)=0$, puisque $b^{p}=b$. Les racines de $f$ sont donc les $p$ éléments distincts $x+b$, $b \in \mathbb{F}_{p}$ : $f$ est séparable, et $L=K(x)$ pour n'importe quelle racine $x$.

    Tout $\sigma \in G=\mathrm{Gal}(L/K)$ vérifie $\sigma(x)=x+b_{\sigma}$ pour un unique $b_{\sigma} \in \mathbb{F}_{p}$, et $\sigma\tau(x)=x+b_{\tau}+b_{\sigma}$ : l'application $\sigma \mapsto b_{\sigma}$ est un morphisme injectif de $G$ dans $(\mathbb{F}_{p}\,;+)$. Comme $x \notin K$, le groupe $G$ n'est pas trivial ; $p$ étant premier, $G \simeq \mathbb{Z}/p\mathbb{Z}$. Ainsi $[K(x):K]=|G|=p=\deg f$, et $f$, qui annule $x$, est son polynôme minimal. 
    $$\boxed{f \text{ est irréductible, } L=K(x), \text{ et } \mathrm{Gal}(L/K) \simeq \mathbb{Z}/p\mathbb{Z}.}$$
     *Application.* Le polynôme $X^{p}-X-1$ n'a pas de racine dans $\mathbb{F}_{p}$, puisque $x^{p}-x=0$ pour tout $x \in \mathbb{F}_{p}$. Il est donc irréductible sur $\mathbb{F}_{p}$ ; étant unitaire, il est irréductible sur $\mathbb{Q}$ d'après le critère de réduction de l'exercice 19, question 4. 
    $$\boxed{X^{p}-X-1 \text{ est irréductible sur } \mathbb{Q} \text{ pour tout nombre premier } p.}$$
