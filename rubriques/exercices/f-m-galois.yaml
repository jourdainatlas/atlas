  enonce: |
    **1.** Calculer $\Phi_{n}$ pour $n$ allant de $1$ à $12$, en utilisant la relation $X^{n}-1=\prod_{d \mid n} \Phi_{d}$.

    **2.** Vérifier que $\deg \Phi_{n}=\varphi(n)$ dans chacun de ces cas.

    **3.** Démontrer que $\Phi_{2m}(X)=\Phi_{m}\big(-X\big)$ pour $m$ impair supérieur à $1$, et le vérifier sur $\Phi_{6}$ et $\Phi_{10}$.
  corrige: |
    **1.** On divise successivement $X^{n}-1$ par les $\Phi_{d}$ déjà connus, pour $d \mid n$ et $d<n$ :

    $$\begin{array}{|c|c|c||c|c|c|} \hline n & \Phi_{n} & \varphi(n) & n & \Phi_{n} & \varphi(n) \\ \hline 1 & X-1 & 1 & 7 & X^{6}+X^{5}+X^{4}+X^{3}+X^{2}+X+1 & 6 \\ \hline 2 & X+1 & 1 & 8 & X^{4}+1 & 4 \\ \hline 3 & X^{2}+X+1 & 2 & 9 & X^{6}+X^{3}+1 & 6 \\ \hline 4 & X^{2}+1 & 2 & 10 & X^{4}-X^{3}+X^{2}-X+1 & 4 \\ \hline 5 & X^{4}+X^{3}+X^{2}+X+1 & 4 & 11 & \sum_{k=0}^{10}X^{k} & 10 \\ \hline 6 & X^{2}-X+1 & 2 & 12 & X^{4}-X^{2}+1 & 4 \\ \hline \end{array}$$

    **2.** Le degré de $\Phi_{n}$ est le nombre de racines primitives $n$-ièmes, c'est-à-dire le nombre de $k \in [\![1\,;n]\!]$ premiers à $n$ : 
    $$\boxed{\deg \Phi_{n}=\varphi(n), \text{ ce que confirme le tableau.}}$$

    **3.** Si $m$ est impair $>1$, l'application $\zeta \mapsto -\zeta$ est une bijection entre les racines primitives $m$-ièmes et les racines primitives $2m$-ièmes. Comme $\deg \Phi_{m}=\varphi(m)$ est pair, le signe dominant est préservé : 
    $$\boxed{\Phi_{2m}(X)=\Phi_{m}(-X)}$$
     *Vérification :* $\Phi_{3}(-X)=X^{2}-X+1=\Phi_{6}$ et $\Phi_{5}(-X)=X^{4}-X^{3}+X^{2}-X+1=\Phi_{10}$ ✓
