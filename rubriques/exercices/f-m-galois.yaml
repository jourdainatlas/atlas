  enonce: |
    Soit $n \geqslant 1$, et $t$, $u$ deux indéterminées. Démontrer que l'extension $\mathbb{C}(t\,;u)/\mathbb{C}\big(t^{n}\,;u^{n}\big)$ est galoisienne, et déterminer son groupe de Galois.
  corrige: |
    Notons $L=\mathbb{C}(t\,;u)$, $K=\mathbb{C}\big(t^{n}\,;u^{n}\big)$ et $\zeta=\mathrm{e}^{2\mathrm{i}\pi/n}$. Pour $(a\,;b) \in \big(\mathbb{Z}/n\mathbb{Z}\big)^{2}$, la substitution $F(t\,;u) \mapsto F\big(\zeta^{a}t\,;\zeta^{b}u\big)$ définit un automorphisme $\sigma_{a,b}$ de $L$, de réciproque $\sigma_{-a,-b}$, qui fixe $K$. Ces automorphismes forment un groupe $G \simeq \big(\mathbb{Z}/n\mathbb{Z}\big)^{2}$, d'ordre $n^{2}$, et $K \subseteq L^{G}$.

    D'après le théorème d'Artin, $L/L^{G}$ est galoisienne de groupe $G$, et $\big[L:L^{G}\big]=n^{2}$. D'autre part $L=K(t\,;u)$, où $t$ est racine de $X^{n}-t^{n} \in K[X]$ et $u$ racine de $X^{n}-u^{n}$ ; par multiplicativité des degrés, $[L:K] \leqslant n \times n=n^{2}$. Ainsi $n^{2}=\big[L:L^{G}\big] \leqslant [L:K] \leqslant n^{2}$, et $L^{G}=K$. 
    $$\boxed{\mathbb{C}(t\,;u)/\mathbb{C}\big(t^{n}\,;u^{n}\big) \text{ est galoisienne, de groupe } \big(\mathbb{Z}/n\mathbb{Z}\big)^{2}.}$$
     Le corps $\mathbb{C}$ ne sert qu'à fournir une racine primitive $n$-ième de l'unité : le résultat vaut sur tout corps qui en contient une.
