  enonce: |
    Démontrer que $\mathbb{Q}\Big(\sqrt{2+\sqrt{2+\sqrt{2}}}\Big)$ est une extension galoisienne de $\mathbb{Q}$, et déterminer son groupe de Galois.
  corrige: |
    La formule $2\cos\dfrac{\theta}{2}=\sqrt{2+2\cos\theta}$, valable pour $\theta \in [0\,;\pi]$, appliquée trois fois à partir de $2\cos\dfrac{\pi}{4}=\sqrt{2}$, donne : 
    $$\alpha=\sqrt{2+\sqrt{2+\sqrt{2}}}=2\cos\frac{\pi}{16}=\zeta+\zeta^{-1} \qquad\text{avec}\qquad \zeta=\mathrm{e}^{\mathrm{i}\pi/16}$$
     et $\zeta$ est une racine primitive $32$-ième de l'unité. L'extension $\mathbb{Q}(\zeta)/\mathbb{Q}$ est galoisienne de groupe $\big(\mathbb{Z}/32\mathbb{Z}\big)^{*}$, abélien, d'après le théorème 7.2 : tous ses sous-groupes sont distingués, donc le sous-corps $\mathbb{Q}(\alpha)$ est galoisien sur $\mathbb{Q}$.

    Le nombre $\zeta$ est racine de $X^{2}-\alpha X+1 \in \mathbb{Q}(\alpha)[X]$ et n'est pas réel, alors que $\mathbb{Q}(\alpha) \subset \mathbb{R}$ : ainsi $[\mathbb{Q}(\zeta):\mathbb{Q}(\alpha)]=2$, et $\mathrm{Gal}(\mathbb{Q}(\zeta)/\mathbb{Q}(\alpha))$ est le sous-groupe $\{\pm 1\}$, qui correspond à la conjugaison. Par conséquent : 
    $$\mathrm{Gal}(\mathbb{Q}(\alpha)/\mathbb{Q}) \simeq \big(\mathbb{Z}/32\mathbb{Z}\big)^{*}/\{\pm 1\}, \text{ d'ordre } \frac{16}{2}=8$$
     Ce quotient est cyclique : $3^{4}=81 \equiv 17 \;[32]$ n'est pas $\pm 1$, donc la classe de $3$ n'est pas d'ordre divisant $4$ ; elle est d'ordre $8$ et engendre le quotient. 
    $$\boxed{\mathbb{Q}\Big(\sqrt{2+\sqrt{2+\sqrt{2}}}\Big)/\mathbb{Q} \text{ est galoisienne de groupe } \mathbb{Z}/8\mathbb{Z}.}$$
     Le polynôme minimal de $\alpha$ est $X^{8}-8X^{6}+20X^{4}-16X^{2}+2$, irréductible par Eisenstein en $2$ : on retrouve le degré $8$ sans passer par la cyclotomie.
- id: "m-galois-48"
  feuille: "f-m-galois"
  numero: 48
  partie: "Chapitre 7 - Résolubilité par radicaux"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [irréductibilité, extensions de corps, cyclotomie]
  noeuds: [z-polynomes, gs-extensions, galois-cyclotomie]
  notions: [polynome-irreductible, extension-corps, polynome-cyclotomique]
  source: "Cambridge, Part II Galois Theory, feuille 4 (2019), exercice 1"
  page_enonce: 11
  page_corrige: 29
  enonce: |
    Soit $K$ un corps, $p$ un nombre premier distinct de la caractéristique de $K$, et $\zeta$ une racine primitive $p$-ième de l'unité dans une extension de $K$. Soit $a \in K$. Démontrer que $X^{p}-a$ est irréductible sur $K$ si et seulement s'il l'est sur $K(\zeta)$. Le résultat subsiste-t-il lorsque l'exposant n'est pas premier ?
  corrige: |
    Un sens est immédiat : une factorisation non triviale sur $K$ en est une sur $K(\zeta)$. Réciproquement, supposons $X^{p}-a$ irréductible sur $K$, et soit $\alpha$ une racine, de sorte que $[K(\alpha):K]=p$. Le nombre $\zeta$ est racine de $X^{p-1}+\dots+X+1$, donc $m=[K(\zeta):K] \leqslant p-1$ est premier avec $p$. Le degré $[K(\zeta\,;\alpha):K]$ est divisible par $p$ et par $m$, donc par $mp$, et il vaut au plus $m\,[K(\zeta\,;\alpha):K(\zeta)] \leqslant mp$. Ainsi $[K(\zeta\,;\alpha):K(\zeta)]=p$, et $X^{p}-a$, qui annule $\alpha$, est irréductible sur $K(\zeta)$. 
    $$\boxed{X^{p}-a \text{ est irréductible sur } K \iff \text{il l'est sur } K(\zeta)}$$
     Le résultat tombe pour un exposant composé : $X^{4}+1=X^{4}-(-1)$ est irréductible sur $\mathbb{Q}$ d'après l'exercice 19, mais se factorise sur $\mathbb{Q}(\mathrm{i})=\mathbb{Q}(\zeta_{4})$ en $\big(X^{2}-\mathrm{i}\big)\big(X^{2}+\mathrm{i}\big)$. L'argument échoue parce que $[\mathbb{Q}(\mathrm{i}):\mathbb{Q}]=2$ n'est pas premier avec $4$.
- id: "m-galois-49"
  feuille: "f-m-galois"
  numero: 49
  partie: "Chapitre 7 - Résolubilité par radicaux"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [groupes, irréductibilité, extensions de corps, corps de décomposition, séparabilité, groupe de Galois, résolubilité par radicaux, discriminant et résolvante]
  noeuds: [a-groupe, z-polynomes, gs-extensions, gs-decomposition, gs-separabilite, gs-galoisiennes, gs-correspondance, gs-radicaux, gs-abel-ruffini]
  notions: [polynome-irreductible, extension-corps, corps-decomposition, polynome-separable, extension-galoisienne, groupe-galois, groupe-resoluble]
  page_enonce: 11
  page_corrige: 29
  enonce: |
    On pose $P=X^{3}-3X+1$.

    **1.** Démontrer que $P$ est irréductible sur $\mathbb{Q}$, et qu'il possède *trois* racines réelles.

    **2.** Calculer le discriminant $\Delta=-4p^{3}-27q^{2}$ de $P$, et vérifier que c'est un carré parfait.

    **3.** On admet que le groupe de Galois d'un polynôme séparable est contenu dans $\mathfrak{A}_{n}$ si et seulement si son discriminant est un carré. En déduire que $\mathrm{Gal}(L/\mathbb{Q}) \simeq \mathbb{Z}/3\mathbb{Z}$, où $L$ est le corps de décomposition.

    **4.** En déduire que $[L:\mathbb{Q}]=3$ et que $L=\mathbb{Q}(\alpha)$ pour n'importe quelle racine $\alpha$ : les trois racines s'expriment rationnellement les unes en fonction des autres. Vérifier que $\alpha^{2}-2$ est encore racine de $P$.

    **5.** Démontrer que $2\cos\dfrac{2\pi}{9}$ est racine de $P$, à l'aide de la formule $\cos(3\theta)=4\cos^{3}\theta-3\cos\theta$.

    **6.** *Le casus irreducibilis.* Les trois racines sont réelles, et pourtant la formule de Cardan les exprime au moyen de racines cubiques de nombres *complexes*. Expliquer pourquoi, en observant que $L \subset \mathbb{R}$ mais que $L$ ne contient aucune racine carrée de $\Delta$ absente de $\mathbb{Q}$.
  corrige: |
    **1.** Les racines rationnelles possibles sont $\pm 1$, et $P(1)=-1$, $P(-1)=3$ : le polynôme, de degré $3$, est donc irréductible sur $\mathbb{Q}$.

    L'étude de $x \mapsto x^{3}-3x+1$ donne $P'(x)=3(x^{2}-1)$, d'où un maximum local $P(-1)=3>0$ et un minimum local $P(1)=-1<0$. 
    $$\boxed{P \text{ est irréductible et possède trois racines réelles}, \; \approx -1{,}879 \;;\; 0{,}347 \;;\; 1{,}532.}$$

    **2.** Avec $p=-3$ et $q=1$ : 
    $$\Delta=-4(-3)^{3}-27(1)^{2}=108-27=81$$

    $$\boxed{\Delta=81=9^{2} \text{ est un carré parfait.}}$$

    **3.** Le groupe $G$ est un sous-groupe transitif de $\mathfrak{S}_{3}$, donc $\mathfrak{S}_{3}$ ou $\mathfrak{A}_{3}$. Le discriminant étant un carré, $G \subseteq \mathfrak{A}_{3}$. 
    $$\boxed{G=\mathfrak{A}_{3} \simeq \mathbb{Z}/3\mathbb{Z}}$$

    **4.** On a $|G|=3$, donc $[L:\mathbb{Q}]=3$. Comme $\mathbb{Q}(\alpha) \subseteq L$ et $[\mathbb{Q}(\alpha):\mathbb{Q}]=3$, il vient $L=\mathbb{Q}(\alpha)$ : le corps de décomposition est engendré par *une* racine.

    Vérifions que $\alpha^{2}-2$ est encore racine. De $\alpha^{3}=3\alpha-1$ on tire : 
    $$(\alpha^{2}-2)^{3}-3(\alpha^{2}-2)+1=\alpha^{6}-6\alpha^{4}+9\alpha^{2}-1$$
     et $\alpha^{6}=(3\alpha-1)^{2}=9\alpha^{2}-6\alpha+1$, $\alpha^{4}=\alpha \cdot \alpha^{3}=3\alpha^{2}-\alpha$, d'où : 
    $$9\alpha^{2}-6\alpha+1-6(3\alpha^{2}-\alpha)+9\alpha^{2}-1=9\alpha^{2}-18\alpha^{2}+9\alpha^{2}-6\alpha+6\alpha=0$$

    $$\boxed{\alpha \mapsto \alpha^{2}-2 \text{ permute les trois racines : c'est un générateur de } G.}$$

    **5.** La formule $\cos(3\theta)=4\cos^{3}\theta-3\cos\theta$ avec $\theta=\dfrac{2\pi}{9}$ donne $\cos\dfrac{2\pi}{3}=-\dfrac{1}{2}$, soit : 
    $$4c^{3}-3c=-\frac{1}{2} \qquad\text{avec}\qquad c=\cos\frac{2\pi}{9}$$
     En posant $\alpha=2c$, il vient $\dfrac{\alpha^{3}}{2}-\dfrac{3\alpha}{2}=-\dfrac{1}{2}$, donc $\alpha^{3}-3\alpha+1=0$. 
    $$\boxed{2\cos\dfrac{2\pi}{9} \text{ est racine de } P, \text{ et } L=\mathbb{Q}\big(2\cos\tfrac{2\pi}{9}\big) \subset \mathbb{Q}(\zeta_{9}).}$$

    **6.** Le corps $L$ est réel, de degré $3$ sur $\mathbb{Q}$. Une formule de Cardan sans nombres complexes exigerait d'extraire une racine carrée de $\Delta$ puis une racine cubique à l'intérieur de $\mathbb{R}$. Or $\sqrt{\Delta}=9 \in \mathbb{Q}$ : l'étape quadratique ne produit rien, et il faudrait que $L$ contienne une racine cubique réelle non triviale, c'est-à-dire une sous-extension de degré $3$ obtenue par radicaux réels — ce que le degré $3$ de $L$ sur $\mathbb{Q}$, premier, interdit sans passer par $\mathbb{Q}(\mathrm{j})$. 
    $$\boxed{\begin{array}{l} \text{C'est le \emph{casus irreducibilis} : une cubique à trois racines réelles} \\[1mm] \text{n'est jamais résoluble par radicaux \emph{réels} si elle est irréductible.} \end{array}}$$
     Le détour par $\mathbb{C}$ n'est donc pas une maladresse de Cardan : il est inévitable.
- id: "m-galois-50"
  feuille: "f-m-galois"
  numero: 50
  partie: "Chapitre 7 - Résolubilité par radicaux"
  etoiles: 4
  types: [Démonstration, Calcul]
  mots_cles: [groupes, sous-groupes, irréductibilité, extensions de corps, groupe de Galois, discriminant et résolvante]
  noeuds: [a-groupe, a-sous-groupe, z-polynomes, gs-extensions, gs-galoisiennes, gs-correspondance, gs-radicaux]
  notions: [polynome-irreductible, extension-corps, extension-galoisienne, groupe-galois]
  page_enonce: 11
