  source: "examen du 15/12/2014, exercice 7 (a), (b), (d)"
  page_enonce: 2
  page_corrige: 6
  enonce: |
    **1.** Soit $K$ un corps, $L$ une extension de $K$ de degré $2$, et $f \in K[t]$ de degré $3$. Montrer que $f$ est irréductible dans $K[t]$ si et seulement s'il est irréductible dans $L[t]$.

    **2.** Cet énoncé s'étend-il aux polynômes de degré $2$ ? de degré $4$ ? de degré $5$ ?

    **3.** Le polynôme $2014t^{3} + 2013t^{2} + 2015t + 2014$ est-il irréductible dans $\mathbb{Z}[t]$ ? dans $\mathbb{Q}[t]$ ? dans $\mathbb{Q}(\mathrm{i})[t]$ ? dans $\mathbb{Z}[\mathrm{i}][t]$ ?
  corrige: |
    **1.** Un polynôme de degré $3$ sur un corps est irréductible si et seulement s'il n'a pas de racine dans ce corps (chapitre 5, prop. 7).

    Si $f$ est irréductible dans $L[t]$, il n'a pas de racine dans $L$, a fortiori dans $K$ : il est irréductible dans $K[t]$.

    Réciproquement, supposons $f$ irréductible dans $K[t]$, et qu'il ait une racine $\beta \in L$. Alors $f$, divisé par son coefficient dominant, est le polynôme minimal de $\beta$ sur $K$, donc $[K(\beta) : K] = 3$. Mais $K(\beta) \subset L$, et $3$ devrait diviser $[L : K] = 2$ (exercice 1 (2)) : c'est absurde. Donc $f$ n'a pas de racine dans $L$, et il est irréductible dans $L[t]$.

    **2.** En degré $2$, l'énoncé est faux : $t^{2} - 2$ est irréductible sur $\mathbb{Q}$, pas sur $\mathbb{Q}(\sqrt{2})$.

    En degré $4$, il est faux aussi : $t^{4} - 10t^{2} + 1$ est irréductible sur $\mathbb{Q}$ (exercice 5), mais sur $\mathbb{Q}(\sqrt{2})$, 
    $$t^{4} - 10t^{2} + 1 = (t^{2} - 2\sqrt{2}\,t - 1)(t^{2} + 2\sqrt{2}\,t - 1),$$
     en regroupant les racines $\sqrt{2} \pm \sqrt{3}$ d'une part et $-\sqrt{2} \pm \sqrt{3}$ d'autre part.

    En degré $5$, et plus généralement en degré $n$ impair, l'énoncé reste vrai. Le sens direct est inchangé : un facteur dans $K[t]$ est un facteur dans $L[t]$.

    Pour la réciproque, soit $f$ irréductible de degré $n$ sur $K$, $g$ un facteur irréductible de $f$ dans $L[t]$, de degré $d$, et $\beta$ une racine de $g$ dans un corps de rupture de $g$ sur $L$. Alors $[L(\beta) : K] = 2d$, et ce nombre est divisible par $[K(\beta) : K] = n$. Comme $n$ est impair, $n$ divise $d$, donc $d = n$ : $f$ est irréductible sur $L$.

    **3.** Notons $f = 2014t^{3} + 2013t^{2} + 2015t + 2014$. Modulo $3$, on a $2014 \equiv 1$, $2013 \equiv 0$, $2015 \equiv 2$, donc 
    $$\overline{f} = t^{3} - t + 1 \in \mathbb{F}_{3}[t].$$
     Ce polynôme prend la valeur $1$ en $0$, $1$ et $2$ : il n'a pas de racine, il est irréductible sur $\mathbb{F}_{3}$. Comme $3$ ne divise pas le coefficient dominant $2014$, $f$ est irréductible dans $\mathbb{Q}[t]$ (chapitre 5, prop. 10).

    Le contenu de $f$ divise $2014 - 2013 = 1$ : $f$ est primitif, donc irréductible dans $\mathbb{Z}[t]$ (chapitre 5, prop. 5).

    Le corps $\mathbb{Q}(\mathrm{i})$ est une extension de degré $2$ de $\mathbb{Q}$ : par la question 1, $f$ est irréductible dans $\mathbb{Q}(\mathrm{i})[t]$.

    Enfin, $\mathbb{Z}[\mathrm{i}]$ est principal, donc factoriel, de corps des fractions $\mathbb{Q}(\mathrm{i})$ (feuille 1, exercice 20). Tout diviseur commun dans $\mathbb{Z}[\mathrm{i}]$ de $2014$ et $2013$ divise leur différence $1$ : $f$ est primitif dans $\mathbb{Z}[\mathrm{i}][t]$, donc irréductible.

    La réponse est donc $\boxed{\text{oui dans les quatre anneaux}}$.

    C'est un peu inattendu, car $f$ est très proche d'un polynôme réductible : ses racines sont proches de $-1$ et de $\pm\mathrm{i}$, puisque 
    $$f = 2014(t + 1)(t^{2} + 1) - t(t - 1).$$
