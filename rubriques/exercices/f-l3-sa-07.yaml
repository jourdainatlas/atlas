- id: "l3-sa-07-01"
  feuille: "f-l3-sa-07"
  numero: 1
  partie: "Éléments algébriques, degré"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["éléments algébriques, degré", nombres transcendants]
  noeuds: [gs-extensions, gs-algebriques]
  notions: [element-algebrique, polynome-minimal, degre-extension]
  source: "Bordeaux N1MA5011, liste 8 (2011), exercice 3 ; L3 Algèbre 2, TD 5 (2011-12), exercice 1 (1)-(2) et exercice 2 (3)-(4)"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $L/K$ une extension et $\alpha \in L$.

    **1.** Le théorème 2 du cours montre que, si $\alpha$ est algébrique sur $K$, l'anneau $K[\alpha]$ est un corps. Montrer la réciproque.

    **2.** On suppose $[L : K]$ fini. Montrer que le degré de $\alpha$ sur $K$ divise $[L : K]$. En déduire que $\sqrt[3]{2}$ n'appartient à aucune extension de $\mathbb{Q}$ de degré $2$, ni de degré $4$.

    **3.** On suppose $\alpha$ transcendant sur $K$. Montrer que $K[\alpha] \simeq K[X]$, que $K[\alpha] \neq K(\alpha)$, et que $K(\alpha)$ est isomorphe au corps $K(X)$ des fractions rationnelles.

    **4.** Montrer que l'ensemble des nombres complexes algébriques sur $\mathbb{Q}$ est dénombrable. En déduire l'existence de nombres réels transcendants sur $\mathbb{Q}$.
  corrige: |
    **1.** Supposons que $K[\alpha]$ soit un corps. Si $\alpha = 0$, il est annulé par $X$.

    Sinon, $\alpha$ est inversible dans $K[\alpha]$ : il existe $Q \in K[X]$ tel que $\alpha^{-1} = Q(\alpha)$. Alors $\alpha$ annule $XQ - 1$, polynôme non nul puisque son terme constant vaut $-1$. Dans les deux cas, $\alpha$ est algébrique.

    Avec le théorème 2 du cours, on obtient : 
    $$\boxed{\alpha \text{ algébrique sur } K \iff K[\alpha] \text{ est un corps} \iff K[\alpha] = K(\alpha)}.$$

    **2.** On a $K \subset K(\alpha) \subset L$. Le corps $K(\alpha)$ est un sous-espace de $L$, donc de dimension finie, et le théorème 1 donne 
    $$[L : K] = [L : K(\alpha)]\,[K(\alpha) : K].$$
     Ainsi $\boxed{\deg_{K}\alpha = [K(\alpha) : K] \text{ divise } [L : K]}$.

    Le nombre $\sqrt[3]{2}$ est de degré $3$ sur $\mathbb{Q}$, puisque $X^{3} - 2$ est irréductible (Eisenstein avec $p = 2$). Comme $3$ ne divise ni $2$ ni $4$, il n'appartient à aucune extension de $\mathbb{Q}$ de degré $2$ ou $4$.

    **3.** Le morphisme d'évaluation $K[X] \to K[\alpha]$, $P \mapsto P(\alpha)$, est surjectif par définition de $K[\alpha]$, et injectif puisque aucun polynôme non nul n'annule $\alpha$ : c'est un isomorphisme $K[X] \simeq K[\alpha]$.

    Comme $K[X]$ n'est pas un corps ($X$ n'y est pas inversible), $K[\alpha]$ n'en est pas un non plus ; en particulier $K[\alpha] \neq K(\alpha)$, et $\alpha^{-1} \notin K[\alpha]$.

    Enfin, le morphisme injectif $K[X] \to K(\alpha)$ est à valeurs dans un corps. Par la propriété universelle du corps des fractions (chapitre 1, th. 5), il se prolonge en un morphisme $K(X) \to K(\alpha)$, $\dfrac{P}{Q} \mapsto \dfrac{P(\alpha)}{Q(\alpha)}$, injectif comme tout morphisme défini sur un corps. Son image est un sous-corps de $K(\alpha)$ contenant $K$ et $\alpha$, donc égal à $K(\alpha)$ : $\boxed{K(\alpha) \simeq K(X)}$.

    **4.** L'ensemble $\mathbb{Q}[X]$ est dénombrable : c'est la réunion, pour $n \in \mathbb{N}$, des ensembles $\mathbb{Q}_{n}[X]$ des polynômes de degré au plus $n$, en bijection avec $\mathbb{Q}^{n + 1}$, dénombrable.

    Un nombre algébrique est racine d'un polynôme non nul de $\mathbb{Q}[X]$, et un tel polynôme a un nombre fini de racines. L'ensemble des nombres algébriques est donc une réunion dénombrable d'ensembles finis : il est $\boxed{\text{dénombrable}}$.

    Comme $\mathbb{R}$ n'est pas dénombrable (argument diagonal de Cantor), il existe des réels transcendants ; « presque tous » les réels le sont, au sens où les algébriques forment une partie dénombrable. Cet argument est celui qu'annonçait le cours, à la suite des théorèmes de Hermite et de Lindemann.
- id: "l3-sa-07-02"
  feuille: "f-l3-sa-07"
  numero: 2
  partie: "Éléments algébriques, degré"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["éléments algébriques, degré"]
  noeuds: [gs-extensions, gs-algebriques]
  notions: [element-algebrique, polynome-minimal, degre-extension]
  source: "Bordeaux N1MA5011, liste 8 (2011), exercices 4 et 7"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Parmi les sous-ensembles suivants de $\mathbb{C}$ ou de $\mathbb{C}(X)$, déterminer ceux qui sont des extensions finies de $\mathbb{Q}$, et donner alors leur degré sur $\mathbb{Q}$ : 
    $$\mathbb{Q} \oplus \mathrm{i}\mathbb{Q}, \qquad \mathbb{Q} \oplus \sqrt{5}\,\mathbb{Q}, \qquad \mathbb{Q} \oplus \sqrt[3]{2}\,\mathbb{Q}, \qquad \mathbb{Q}[\sqrt[3]{2}], \qquad \mathbb{R}, \qquad \mathbb{C}, \qquad \mathbb{Q}(X).$$

    **2.** Calculer le degré de $\mathbb{Q}(\sqrt{2}, \sqrt[3]{3}, \sqrt[5]{5})$ sur $\mathbb{Q}$.
  corrige: |
    **1.** On examine les ensembles un par un.

    • $\mathbb{Q} \oplus \mathrm{i}\mathbb{Q} = \mathbb{Q}[\mathrm{i}]$, puisque $\mathrm{i}^{2} = -1$. Le polynôme $X^{2} + 1$ est irréductible sur $\mathbb{Q}$ (sans racine réelle) : $\mathbb{Q}[\mathrm{i}] = \mathbb{Q}(\mathrm{i})$ est une extension de degré $\boxed{2}$.

    • De même, $\mathbb{Q} \oplus \sqrt{5}\,\mathbb{Q} = \mathbb{Q}(\sqrt{5})$ est de degré $\boxed{2}$, car $X^{2} - 5$ est irréductible ($\sqrt{5} \notin \mathbb{Q}$).

    • $\mathbb{Q} \oplus \sqrt[3]{2}\,\mathbb{Q}$ n'est pas stable par produit : $\sqrt[3]{2} \cdot \sqrt[3]{2} = \sqrt[3]{4}$ n'y est pas, car $(1, \sqrt[3]{2}, \sqrt[3]{4})$ est une base de $\mathbb{Q}(\sqrt[3]{2})$ (cours, exemple après le th. 2). Ce n'est donc *pas un corps*.

    • $\mathbb{Q}[\sqrt[3]{2}] = \mathbb{Q}(\sqrt[3]{2})$ est de degré $\boxed{3}$.

    • $\mathbb{R}$ et $\mathbb{C}$ ne sont pas des extensions finies de $\mathbb{Q}$. Une extension finie de $\mathbb{Q}$ est un $\mathbb{Q}$-espace vectoriel de dimension finie $d$, en bijection avec $\mathbb{Q}^{d}$, donc dénombrable, alors que $\mathbb{R}$ et $\mathbb{C}$ ne le sont pas. On peut aussi dire qu'elles contiennent des transcendants (exercice 1).

    • $\mathbb{Q}(X)$ n'est pas finie : $X$ y est transcendant sur $\mathbb{Q}$, et la famille $(1, X, X^{2}, \dots)$ est libre.

    **2.** Les nombres $\sqrt{2}$, $\sqrt[3]{3}$, $\sqrt[5]{5}$ ont pour polynômes minimaux $X^{2} - 2$, $X^{3} - 3$, $X^{5} - 5$, irréductibles par le critère d'Eisenstein (avec $p = 2$, $3$, $5$). Ils sont donc de degrés $2$, $3$ et $5$.

    Notons $L = \mathbb{Q}(\sqrt{2}, \sqrt[3]{3}, \sqrt[5]{5})$. Par l'exercice 1 (2), $2$, $3$ et $5$ divisent $[L : \mathbb{Q}]$, donc $30$ le divise. D'autre part, $[L : \mathbb{Q}] \leqslant 2 \times 3 \times 5$ (cours, prop. 2). Ainsi $\boxed{[L : \mathbb{Q}] = 30}$.
- id: "l3-sa-07-03"
  feuille: "f-l3-sa-07"
  numero: 3
  partie: "Éléments algébriques, degré"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: ["éléments algébriques, degré"]
  noeuds: [gs-extensions, gs-algebriques]
  notions: [element-algebrique, polynome-minimal, degre-extension]
  source: "Bordeaux N1MA5011, liste 8 (2011), exercice 5 ; Exo7 fic00033, exercice 1"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Montrer que $P = X^{3} + X + 1$ est irréductible sur $\mathbb{Q}$. Soit $\alpha$ une racine complexe de $P$. Écrire $\dfrac{\alpha^{2}}{\alpha + 1}$ sous la forme $g(\alpha)$, avec $g \in \mathbb{Q}[X]$ de degré au plus $2$.

    **2.** Montrer que l'anneau quotient $\mathbb{Q}[X]/\langle X^{3} - X + 2 \rangle$ est un corps. On note $y$ la classe de $X$. Calculer l'inverse de $y$, puis montrer que $1 + y + y^{2}$ est non nul et calculer son inverse.
  corrige: |
    **1.** Le polynôme $P$ est de degré $3$, et ses seules racines rationnelles possibles sont $\pm 1$ ; or $P(1) = 3$ et $P(-1) = -1$. Il est donc irréductible sur $\mathbb{Q}$ (chapitre 5, prop. 7).

    On commence par inverser $\alpha + 1$, non nul puisque $-1$ n'est pas racine de $P$. La division euclidienne de $P$ par $X + 1$ s'écrit 
    $$X^{3} + X + 1 = (X + 1)(X^{2} - X + 2) - 1,$$
     d'où $(\alpha + 1)(\alpha^{2} - \alpha + 2) = 1$. Alors $\dfrac{\alpha^{2}}{\alpha + 1} = \alpha^{2}(\alpha^{2} - \alpha + 2) = \alpha^{4} - \alpha^{3} + 2\alpha^{2}$.

    On réduit à l'aide de $\alpha^{3} = -\alpha - 1$ et $\alpha^{4} = -\alpha^{2} - \alpha$ : 
    $$\frac{\alpha^{2}}{\alpha + 1} = -\alpha^{2} - \alpha + \alpha + 1 + 2\alpha^{2} = \alpha^{2} + 1, \qquad \boxed{g = X^{2} + 1}.$$
     On le vérifie directement : $(\alpha + 1)(\alpha^{2} + 1) = \alpha^{3} + \alpha^{2} + \alpha + 1 = \alpha^{2}$.

    **2.** Le polynôme $X^{3} - X + 2$ n'a pas de racine rationnelle : les candidats $\pm 1$, $\pm 2$ donnent $2$, $2$, $8$, $-4$. De degré $3$, il est irréductible, et le quotient est un corps (chapitre 2, prop. 8).

    L'égalité $y^{3} - y + 2 = 0$ s'écrit $y(y^{2} - 1) = -2$, donc 
    $$\boxed{y^{-1} = \frac{1 - y^{2}}{2}}.$$

    L'élément $1 + y + y^{2}$ est non nul, puisque $(1, y, y^{2})$ est une base du quotient (chapitre 2, prop. 6). Pour l'inverser, on applique l'algorithme d'Euclide à $X^{3} - X + 2$ et $X^{2} + X + 1$ : 
    $$X^{3} - X + 2 = (X^{2} + X + 1)(X - 1) + (3 - X), \qquad X^{2} + X + 1 = (3 - X)(-X - 4) + 13.$$
     En remontant, $13 = (X^{2} + X + 1) + (X + 4)(3 - X) = (X^{2} + X + 1)(-X^{2} - 3X + 5) + (X + 4)(X^{3} - X + 2)$. Dans le quotient, le dernier terme s'annule : 
    $$\boxed{(1 + y + y^{2})^{-1} = \frac{5 - 3y - y^{2}}{13}}.$$
