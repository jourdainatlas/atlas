  enonce: |
    Pour $n \in \mathbb{N}$, le *polynôme de Tchebychev de première espèce* d'indice $n$ est 
    $$T_{n} = \sum_{0 \leqslant k \leqslant \lfloor n/2 \rfloor}(-1)^{k}\binom{n}{2k}X^{n - 2k}(1 - X^{2})^{k} \in \mathbb{Z}[X].$$

    **1.** Expliciter $T_{n}$ sous forme développée pour $n \leqslant 5$.

    **2.** À l'aide de la formule de Moivre, montrer que $T_{n}$ est l'unique polynôme de $\mathbb{R}[X]$ tel que $\cos nx = T_{n}(\cos x)$ pour tout réel $x$. Factoriser $T_{n}$ dans $\mathbb{R}[X]$.

    **3.** En déduire que $\cos\dfrac{2\pi}{n}$ est algébrique sur $\mathbb{Q}$ pour tout entier $n \geqslant 1$.

    **4.** Déterminer, à l'aide de $T_{3}$, le polynôme minimal $P$ de $\cos\dfrac{\pi}{9}$ sur $\mathbb{Q}$. Quelles sont les racines de $P$ dans $\mathbb{R}$ ?
  corrige: |
    **1.** Le développement donne 
    $$T_{0} = 1, \quad T_{1} = X, \quad T_{2} = 2X^{2} - 1, \quad T_{3} = 4X^{3} - 3X,$$

    $$T_{4} = 8X^{4} - 8X^{2} + 1, \quad T_{5} = 16X^{5} - 20X^{3} + 5X.$$

    **2.** Par la formule de Moivre et celle du binôme, 
    $$\cos nx + \mathrm{i}\sin nx = (\cos x + \mathrm{i}\sin x)^{n} = \sum_{j = 0}^{n}\binom{n}{j}\cos^{n - j}x\,(\mathrm{i}\sin x)^{j}.$$
     Les termes réels sont ceux d'indice pair $j = 2k$, pour lesquels $\mathrm{i}^{2k} = (-1)^{k}$ et $\sin^{2k}x = (1 - \cos^{2}x)^{k}$. La partie réelle donne $\cos nx = T_{n}(\cos x)$.

    Si $Q \in \mathbb{R}[X]$ vérifie aussi $\cos nx = Q(\cos x)$ pour tout $x$, alors $T_{n} - Q$ s'annule sur $[-1, 1]$, ensemble infini : $Q = T_{n}$.

    Pour $n \geqslant 1$, le coefficient de $X^{n}$ dans $(-1)^{k}X^{n - 2k}(1 - X^{2})^{k}$ est $(-1)^{k}(-1)^{k} = 1$, donc le coefficient dominant de $T_{n}$ est $\mathop{\displaystyle \sum_{k}}\dbinom{n}{2k} = 2^{n - 1}$ : $T_{n}$ est de degré $n$.

    Les réels $x_{k} = \cos\dfrac{(2k + 1)\pi}{2n}$, $0 \leqslant k \leqslant n - 1$, sont $n$ racines distinctes de $T_{n}$, puisque $T_{n}(x_{k}) = \cos\dfrac{(2k + 1)\pi}{2} = 0$ et que les angles sont dans $]0, \pi[$. D'où 
    $$\boxed{T_{n} = 2^{n - 1}\prod_{k = 0}^{n - 1}\Big(X - \cos\frac{(2k + 1)\pi}{2n}\Big)}.$$

    **3.** On a $T_{n}\big(\cos\dfrac{2\pi}{n}\big) = \cos 2\pi = 1$ : le nombre $\cos\dfrac{2\pi}{n}$ annule $T_{n} - 1$, polynôme à coefficients entiers, non nul car de degré $n \geqslant 1$. Il est donc algébrique sur $\mathbb{Q}$.

    **4.** Comme $T_{3}\big(\cos\dfrac{\pi}{9}\big) = \cos\dfrac{\pi}{3} = \dfrac{1}{2}$, le nombre $c = \cos\dfrac{\pi}{9}$ annule $4X^{3} - 3X - \dfrac{1}{2}$, donc $8X^{3} - 6X - 1$.

    Avec $Y = 2X$, ce polynôme devient $Y^{3} - 3Y - 1$. Ses seules racines rationnelles possibles sont $\pm 1$, qui donnent $-3$ et $1$ : il est irréductible sur $\mathbb{Q}$ (degré $3$), et $8X^{3} - 6X - 1$ aussi. Donc 
    $$\boxed{P = X^{3} - \frac{3}{4}X - \frac{1}{8}}, \qquad [\mathbb{Q}(c) : \mathbb{Q}] = 3.$$

    Les racines réelles de $P$ sont les $x \in [-1, 1]$ tels que $T_{3}(x) = \dfrac{1}{2}$ (hors de $[-1, 1]$, $|T_{3}| > 1$). En écrivant $x = \cos\theta$ avec $\theta \in [0, \pi]$, la condition $\cos 3\theta = \dfrac{1}{2}$, avec $3\theta \in [0, 3\pi]$, donne $3\theta \in \{\dfrac{\pi}{3}, \dfrac{5\pi}{3}, \dfrac{7\pi}{3}\}$. Les trois racines, toutes réelles, sont 
    $$\boxed{\cos\tfrac{\pi}{9} \approx 0{,}940, \qquad \cos\tfrac{5\pi}{9} \approx -0{,}174, \qquad \cos\tfrac{7\pi}{9} \approx -0{,}766}.$$

    1.5em

    ![Figure](documents/figures/eeb60bc183350f5c.svg)

    Le graphe de $T_{3}$ sur $[-1{,}08 \, ; 1{,}08]$ (en bleu) coupe la droite $y = \dfrac{1}{2}$ (en orange) en trois points, d'abscisses les trois racines de $P$ (en rouge). Entre $-1$ et $1$, $T_{3}$ oscille entre $-1$ et $1$, comme $\cos 3\theta$.
- id: "l3-sa-07-11"
  feuille: "f-l3-sa-07"
  numero: 11
  partie: "Constructions à la règle et au compas"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [constructions à la règle et au compas, nombres transcendants]
  noeuds: [gc-wantzel, gs-extensions, gs-algebriques]
  notions: [degre-extension]
  source: "TD Algèbre 4, feuille 7 (2014-15), exercice 5"
  page_enonce: 3
  page_corrige: 9
  enonce: |
    *(Théorème de Wantzel.)* On identifie le plan $\mathcal{P}$ à $\mathbb{R}^{2}$ par le choix d'un repère orthonormé $(O, I, J)$. Un point $M$ de $\mathcal{P}$ est *constructible à la règle et au compas* s'il existe un entier $r \geqslant 2$ et des points $M_{0}, \dots, M_{r}$ tels que $M_{0} = O$, $M_{1} = I$, $M_{r} = M$ et que, pour tout $i \in \{1, \dots, r - 1\}$, $M_{i + 1}$ soit un point d'intersection de deux figures distinctes de l'un des types suivants :

    • une droite passant par deux points distincts de $\{M_{0}, \dots, M_{i}\}$ ;

    • un cercle centré en un point de $\{M_{0}, \dots, M_{i}\}$, de rayon la distance entre deux points de $\{M_{0}, \dots, M_{i}\}$.

    **1.** Soit $K$ un sous-corps de $\mathbb{R}$ et $A$, $B$, $C$ des points de $K^{2}$, avec $A \neq B$. Montrer que la droite $(AB)$ admet une équation $ax + by + c = 0$ avec $a$, $b$, $c \in K$, et que le cercle de centre $C$ et de rayon $AB$ admet une équation $x^{2} + y^{2} + ax + by + c = 0$ avec $a$, $b$, $c \in K$.

    **2.** Soit $\mathcal{D}$, $\mathcal{D}'$ deux droites passant chacune par deux points distincts de $K^{2}$, et $\mathcal{C}$, $\mathcal{C}'$ deux cercles centrés en des points de $K^{2}$, de rayons des distances entre points de $K^{2}$. On suppose $\mathcal{D}$ et $\mathcal{D}'$ non parallèles, et les centres de $\mathcal{C}$ et $\mathcal{C}'$ distincts. Montrer que les coordonnées des points d'intersection de $\mathcal{D}$ et $\mathcal{D}'$, de $\mathcal{D}$ et $\mathcal{C}$, ou de $\mathcal{C}$ et $\mathcal{C}'$ sont dans $K$ ou dans une extension $L$ de $K$ de degré $2$ contenue dans $\mathbb{R}$.

    **3.** Prouver qu'un point $M$ est constructible si et seulement s'il existe des sous-corps de $\mathbb{R}$ 
    $$\mathbb{Q} = K_{0} \subset K_{1} \subset \cdots \subset K_{r}$$
     tels que $[K_{i + 1} : K_{i}] \in \{1, 2\}$ pour $0 \leqslant i \leqslant r - 1$, et que les coordonnées de $M$ soient dans $K_{r}$.

    **4.** Montrer que, si $M = (x, y)$ est constructible, $x$ et $y$ sont algébriques sur $\mathbb{Q}$, de degrés des puissances de $2$.

    **5.** En utilisant les exercices 8 et 10, prouver qu'on ne peut pas construire à la règle et au compas un heptagone régulier, ni diviser en trois un angle de $60^{\circ}$.

    La caractérisation de la question 3 est due à Pierre-Laurent Wantzel (1837). Elle prouve aussi l'impossibilité de la quadrature du cercle, puisque $\pi$ est transcendant sur $\mathbb{Q}$ (Lindemann, 1882).
  corrige: |
    **1.** Soit $A = (x_{A}, y_{A})$ et $B = (x_{B}, y_{B})$. La droite $(AB)$ a pour équation 
    $$(y_{B} - y_{A})(x - x_{A}) - (x_{B} - x_{A})(y - y_{A}) = 0,$$
     de la forme $ax + by + c = 0$ avec $a = y_{B} - y_{A}$, $b = x_{A} - x_{B}$, $c = -ax_{A} - by_{A}$ dans $K$, et $(a, b) \neq (0, 0)$ puisque $A \neq B$.

    Le cercle de centre $C = (x_{C}, y_{C})$ et de rayon $AB$ a pour équation $(x - x_{C})^{2} + (y - y_{C})^{2} = AB^{2}$, avec $AB^{2} = (x_{B} - x_{A})^{2} + (y_{B} - y_{A})^{2} \in K$. Elle s'écrit 
    $$x^{2} + y^{2} - 2x_{C}\,x - 2y_{C}\,y + (x_{C}^{2} + y_{C}^{2} - AB^{2}) = 0,$$
     à coefficients dans $K$. On remarque que le centre se lit sur l'équation : $(a, b) = (-2x_{C}, -2y_{C})$.

    **2.** On traite les trois cas.

    $\triangleright$ *Deux droites.* Les équations $ax + by + c = 0$ et $a'x + b'y + c' = 0$ forment un système linéaire de déterminant $ab' - a'b \neq 0$, puisque les droites ne sont pas parallèles. Par les formules de Cramer, la solution est dans $K^{2}$.

    $\triangleright$ *Une droite et un cercle.* On suppose seulement que la droite a une équation $ax + by + c = 0$ à coefficients dans $K$, par exemple avec $b \neq 0$ (sinon, on échange les rôles de $x$ et $y$). En reportant $y = -\dfrac{ax + c}{b}$ dans l'équation du cercle, on obtient une équation $\lambda x^{2} + \mu x + \nu = 0$ à coefficients dans $K$, avec $\lambda = 1 + \dfrac{a^{2}}{b^{2}} \neq 0$.

    S'il y a des points d'intersection, leurs abscisses sont $\dfrac{-\mu \pm \sqrt{D}}{2\lambda}$, où $D = \mu^{2} - 4\lambda\nu \in K$ est positif. Elles sont dans $L = K(\sqrt{D})$, de degré $1$ ou $2$ sur $K$ et contenu dans $\mathbb{R}$ ; les ordonnées aussi, par $y = -\dfrac{ax + c}{b}$.

    $\triangleright$ *Deux cercles.* En soustrayant les deux équations, on obtient 
    $$(a - a')x + (b - b')y + (c - c') = 0,$$
     avec $(a - a', b - b') \neq (0, 0)$ puisque les centres sont distincts : c'est l'équation d'une droite à coefficients dans $K$ (l'axe radical). Les points d'intersection des deux cercles sont ceux du premier cercle et de cette droite, et le cas précédent s'applique.

    **3.** *Sens direct.* Soit $M$ constructible, et $M_{0}, \dots, M_{r}$ comme dans la définition. On construit par récurrence des sous-corps $K_{0} \subset K_{1} \subset \cdots \subset K_{r}$ de $\mathbb{R}$ tels que les coordonnées de $M_{0}, \dots, M_{i}$ soient dans $K_{i}$ et que $[K_{i + 1} : K_{i}] \in \{1, 2\}$.

    Au départ, $O = (0, 0)$ et $I = (1, 0)$ ont leurs coordonnées dans $\mathbb{Q}$ : on pose $K_{0} = K_{1} = \mathbb{Q}$.

    Supposons $K_{i}$ construit, avec $i \geqslant 1$. Le point $M_{i + 1}$ est un point d'intersection de deux figures distinctes, définies par des points de $K_{i}^{2}$. Deux droites distinctes qui se coupent ne sont pas parallèles, et deux cercles distincts de même centre ne se coupent pas : on est dans l'un des cas de la question 2. Les coordonnées de $M_{i + 1}$ sont donc dans une extension $K_{i + 1} \subset \mathbb{R}$ de $K_{i}$ de degré $1$ ou $2$.

    La tour $\mathbb{Q} = K_{0} \subset \cdots \subset K_{r}$ convient, puisque $M = M_{r}$ a ses coordonnées dans $K_{r}$.

    *Réciproque.* On montre d'abord que les constructions élémentaires sont possibles, en n'utilisant que des points déjà construits.

    • *Médiatrice, milieu, perpendiculaire.* Les cercles de centres $P$ et $Q$ et de rayon $PQ$ se coupent en deux points, qui définissent la médiatrice de $[PQ]$ ; elle coupe $(PQ)$ au milieu. Pour une perpendiculaire à une droite $(PQ)$ en $P$, on trace le cercle de centre $P$ de rayon $PQ$, qui recoupe $(PQ)$ en $Q'$, puis la médiatrice de $[QQ']$.

    • *Parallèle.* La parallèle à $\mathcal{D}$ passant par $P$ est la perpendiculaire, en $P$, à la perpendiculaire à $\mathcal{D}$ passant par $P$.

    • *Axes.* L'axe des abscisses est $(OI)$ ; la perpendiculaire en $O$ coupe le cercle de centre $O$ et de rayon $OI$ en $J = (0, 1)$.

    Appelons *constructible* un réel $x$ tel que le point $(x, 0)$ le soit. Le point $(x, y)$ est constructible si et seulement si $x$ et $y$ le sont : on projette sur les axes par des perpendiculaires, et l'on passe de $(0, y)$ à $(y, 0)$ par le cercle de centre $O$ passant par $(0, y)$ ; inversement, $(x, y)$ est l'intersection des perpendiculaires aux axes en $(x, 0)$ et $(0, y)$.

    L'ensemble $\mathcal{K}$ des réels constructibles est un sous-corps de $\mathbb{R}$, stable par racine carrée des éléments positifs.

    • $-x$ et $x + y$ : on reporte la longueur $|y|$ à partir de $(x, 0)$ par le cercle de centre $(x, 0)$ et de rayon la distance de $O$ à $(y, 0)$, et l'on choisit le bon point d'intersection avec l'axe.

    • $xy$ et $\dfrac{1}{x}$ (pour $x$, $y > 0$, les signes se traitant par l'opposé) : avec le théorème de Thalès. La parallèle à la droite joignant $(1, 0)$ à $(0, y)$, menée par $(x, 0)$, coupe l'axe des ordonnées en $(0, xy)$. La parallèle à la droite joignant $(x, 0)$ à $(0, 1)$, menée par $(1, 0)$, le coupe en $(0, \dfrac{1}{x})$.

    • $\sqrt{d}$ pour $d > 0$ : le cercle de diamètre $[EF]$, avec $E = (-1, 0)$ et $F = (d, 0)$, coupe l'axe des ordonnées en $G = (0, \sqrt{d})$. En effet, le triangle $EGF$ est rectangle en $G$, et la hauteur issue de $G$ vérifie $OG^{2} = OE \cdot OF = d$.

    1.5em

    ![Figure](documents/figures/b90ff5e87cf02b96.svg)

    À gauche, le produit par Thalès : la droite orange est parallèle à la droite bleue, et le rapport $x$ des abscisses se retrouve entre les ordonnées. À droite, la racine carrée, ici pour $d = 3$ : le cercle de diamètre $[EF]$, de centre le milieu $\Omega$, coupe l'axe des ordonnées en $G$, et $OG = \sqrt{d}$.

    Montrons enfin, par récurrence sur $i$, que $K_{i} \subset \mathcal{K}$. C'est vrai pour $K_{0} = \mathbb{Q}$, puisque $\mathcal{K}$ est un corps contenant $1$. Si $K_{i} \subset \mathcal{K}$ et $[K_{i + 1} : K_{i}] = 2$, alors $K_{i + 1} = K_{i}(\beta)$, où $\beta$ est racine d'un polynôme $X^{2} + pX + q$ de $K_{i}[X]$. On a $\beta = \dfrac{-p \pm \sqrt{D}}{2}$ avec $D = p^{2} - 4q \geqslant 0$ (car $\beta$ est réel), d'où $K_{i + 1} = K_{i}(\sqrt{D}) = K_{i} + K_{i}\sqrt{D} \subset \mathcal{K}$.

    Les coordonnées de $M$ sont alors dans $K_{r} \subset \mathcal{K}$, et $M$ est constructible. On a établi le **théorème de Wantzel** : 
    $$\boxed{\begin{array}{c} M \text{ constructible} \iff \text{ses coordonnées sont dans le dernier corps d'une tour} \\ \mathbb{Q} = K_{0} \subset K_{1} \subset \cdots \subset K_{r} \subset \mathbb{R}, \quad [K_{i + 1} : K_{i}] \leqslant 2 \end{array}}$$

    **4.** Par la base télescopique, $[K_{r} : \mathbb{Q}]$ est une puissance de $2$. Les coordonnées $x$, $y$ de $M$ sont dans $K_{r}$, extension finie de $\mathbb{Q}$, donc algébriques (cours, prop. 2), et leurs degrés divisent $[K_{r} : \mathbb{Q}]$ (exercice 1 (2)) : $\boxed{\text{ce sont des puissances de } 2}$.

    **5.** *L'heptagone.* Construire un heptagone régulier, c'est, quitte à choisir le repère, construire son sommet $(\cos\dfrac{2\pi}{7}, \sin\dfrac{2\pi}{7})$ à partir du centre $O$ et du sommet $I$. Or $2\cos\dfrac{2\pi}{7}$ est racine de $X^{3} + X^{2} - 2X - 1$, irréductible sur $\mathbb{Q}$ (exercice 8) : $\cos\dfrac{2\pi}{7}$ est de degré $3$, qui n'est pas une puissance de $2$. L'heptagone régulier n'est pas constructible.

    *La trisection.* L'angle de $60^{\circ}$ est constructible : le point $(\dfrac{1}{2}, \dfrac{\sqrt{3}}{2})$ est l'intersection des cercles de centres $O$ et $I$ et de rayon $OI$. Le diviser en trois reviendrait à construire $(\cos\dfrac{\pi}{9}, \sin\dfrac{\pi}{9})$. Or $\cos\dfrac{\pi}{9}$ est de degré $3$ (exercice 10) : c'est impossible.

    Il n'existe donc pas de méthode générale de trisection à la règle et au compas, bien que certains angles ($90^{\circ}$, par exemple) se trisectent. De même, la quadrature du cercle demanderait de construire $\sqrt{\pi}$, qui serait algébrique, alors que $\pi$ est transcendant (Lindemann, admis).

