  source: "Bordeaux N1MA5011, liste 8 (2011), exercice 6"
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Dans le corps $\mathbb{C}(T)$ des fractions rationnelles, on considère le sous-corps $K = \mathbb{C}(T^{2})$ des fractions rationnelles en $T^{2}$ ; il est isomorphe à $\mathbb{C}(X)$, et $T$ y joue le rôle d'une racine carrée de $X$.

    **1.** Déterminer le polynôme minimal de $T$ sur $K$, et $[\mathbb{C}(T) : K]$.

    **2.** Plus généralement, soit $n \geqslant 1$. Montrer que $Y^{n} - X$ est irréductible dans $\mathbb{C}(X)[Y]$, puis que $[\mathbb{C}(T) : \mathbb{C}(T^{n})] = n$.
  corrige: |
    **1.** L'élément $T$ annule $Y^{2} - T^{2} \in K[Y]$, unitaire de degré $2$. Ce polynôme est irréductible sur $K$ si et seulement s'il n'a pas de racine dans $K$ ; ses racines sont $\pm T$.

    Montrons que $T \notin K$. Si $T = \dfrac{A(T^{2})}{B(T^{2})}$ avec $A$, $B \in \mathbb{C}[X]$, $B \neq 0$, alors $TB(T^{2}) = A(T^{2})$. Le membre de gauche est de degré impair $1 + 2\deg B$ ; celui de droite est nul ou de degré pair : c'est impossible.

    Donc $\boxed{\mu_{T} = Y^{2} - T^{2}}$. Comme $\mathbb{C}(T)$ est engendré par $T$ sur $\mathbb{C} \subset K$, on a $\mathbb{C}(T) = K(T)$ et $\boxed{[\mathbb{C}(T) : K] = 2}$.

    **2.** L'anneau $\mathbb{C}[X]$ est principal, donc factoriel, et $X$ y est irréductible. Dans $\mathbb{C}[X][Y]$, le polynôme $Y^{n} - X$ est unitaire en $Y$, ses autres coefficients ($0$ et $-X$) sont divisibles par $X$, et son coefficient constant $-X$ n'est pas divisible par $X^{2}$. Par le critère d'Eisenstein (chapitre 5, th. 3), il est irréductible dans $\mathbb{C}(X)[Y]$, le corps des fractions de $\mathbb{C}[X]$.

    Le nombre $T^{n}$ est transcendant sur $\mathbb{C}$ (il n'annule aucun polynôme non nul), donc $X \mapsto T^{n}$ définit un isomorphisme $\mathbb{C}(X) \simeq \mathbb{C}(T^{n})$ (exercice 1 (3)). Il transporte $Y^{n} - X$ en $Y^{n} - T^{n}$, irréductible sur $\mathbb{C}(T^{n})$ et annulé par $T$. Comme $\mathbb{C}(T) = \mathbb{C}(T^{n})(T)$, on obtient 
    $$\boxed{[\mathbb{C}(T) : \mathbb{C}(T^{n})] = n}.$$
- id: "l3-sa-07-05"
  feuille: "f-l3-sa-07"
  numero: 5
  partie: "Éléments algébriques, degré"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["éléments algébriques, degré"]
  noeuds: [gs-extensions, gs-algebriques]
  notions: [element-algebrique, polynome-minimal, degre-extension]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $L = \mathbb{Q}(\sqrt{2}, \sqrt{3})$ et $\alpha = \sqrt{2} + \sqrt{3}$.

    **1.** Montrer que $\sqrt{3} \notin \mathbb{Q}(\sqrt{2})$, puis que $[L : \mathbb{Q}] = 4$ et que $(1, \sqrt{2}, \sqrt{3}, \sqrt{6})$ est une base de $L$ sur $\mathbb{Q}$.

    **2.** Exprimer $\sqrt{2}$ et $\sqrt{3}$ en fonction de $\alpha$ et de $\alpha^{3}$. En déduire que $L = \mathbb{Q}(\alpha)$ et que $X^{4} - 10X^{2} + 1$ est irréductible sur $\mathbb{Q}$.

    **3.** Soit $F$ un sous-corps de $L$ tel que $[F : \mathbb{Q}] = 2$. Montrer qu'il existe $d \in \mathbb{Q}$ tel que $F = \mathbb{Q}(\sqrt{d})$, puis, en écrivant $\sqrt{d}$ dans la base de la question 1, que $F$ est l'un des corps $\mathbb{Q}(\sqrt{2})$, $\mathbb{Q}(\sqrt{3})$, $\mathbb{Q}(\sqrt{6})$. Quels sont les sous-corps de $L$ ?
  corrige: |
    **1.** La famille $(1, \sqrt{2})$ est une base de $\mathbb{Q}(\sqrt{2})$. Supposons $\sqrt{3} = u + v\sqrt{2}$ avec $u$, $v \in \mathbb{Q}$. En élevant au carré, $3 = u^{2} + 2v^{2} + 2uv\sqrt{2}$, donc $uv = 0$.

    Si $v = 0$, alors $u^{2} = 3$, impossible dans $\mathbb{Q}$. Si $u = 0$, alors $2v^{2} = 3$, soit $(2v)^{2} = 6$, impossible aussi. Donc $\sqrt{3} \notin \mathbb{Q}(\sqrt{2})$.

    Ainsi $X^{2} - 3$ n'a pas de racine dans $\mathbb{Q}(\sqrt{2})$ : il est irréductible sur ce corps, et $[L : \mathbb{Q}(\sqrt{2})] = 2$. Par la base télescopique, $\boxed{[L : \mathbb{Q}] = 4}$, de base les produits $(1, \sqrt{2}) \times (1, \sqrt{3})$, c'est-à-dire $(1, \sqrt{2}, \sqrt{3}, \sqrt{6})$.

    **2.** On calcule $\alpha^{2} = 5 + 2\sqrt{6}$, puis $\alpha^{3} = (\sqrt{2} + \sqrt{3})(5 + 2\sqrt{6}) = 11\sqrt{2} + 9\sqrt{3}$. Il vient 
    $$\boxed{\sqrt{2} = \frac{\alpha^{3} - 9\alpha}{2}, \qquad \sqrt{3} = \frac{11\alpha - \alpha^{3}}{2}}.$$

    Donc $L \subset \mathbb{Q}(\alpha) \subset L$, et $\mathbb{Q}(\alpha) = L$ est de degré $4$ : le polynôme minimal de $\alpha$ est de degré $4$. Or $\alpha$ annule $X^{4} - 10X^{2} + 1$, unitaire de degré $4$ (cours, exemple après le th. 2) : c'est son polynôme minimal, qui est irréductible.

    *Remarque.* Ce polynôme est réductible modulo $2$, $3$ et $5$ : on trouve $(X + 1)^{4}$, $(X^{2} + 1)^{2}$ et $(X^{2} - 2)(X^{2} + 2)$. Le critère de réduction modulo $p$ ne permet donc pas de prouver son irréductibilité ; il fallait l'argument de degré ci-dessus.

    **3.** Soit $\beta \in F \setminus \mathbb{Q}$. Son degré divise $2$ et vaut donc $2$, d'où $F = \mathbb{Q}(\beta)$. Si $\mu_{\beta} = X^{2} + pX + q$, alors $\beta = \dfrac{-p \pm \sqrt{d}}{2}$ avec $d = p^{2} - 4q > 0$ (car $\beta$ est réel et irrationnel), et $F = \mathbb{Q}(\sqrt{d})$.

    Écrivons $\sqrt{d} = a + b\sqrt{2} + c\sqrt{3} + e\sqrt{6}$, avec $a$, $b$, $c$, $e \in \mathbb{Q}$. En élevant au carré : 
    $$d = a^{2} + 2b^{2} + 3c^{2} + 6e^{2} + 2(ab + 3ce)\sqrt{2} + 2(ac + 2be)\sqrt{3} + 2(ae + bc)\sqrt{6}.$$
     Comme $d \in \mathbb{Q}$, les trois coefficients irrationnels sont nuls : $ab + 3ce = 0$, $ac + 2be = 0$, $ae + bc = 0$.

    Supposons $a \neq 0$. Alors $b = -\dfrac{3ce}{a}$ et $c = -\dfrac{2be}{a}$, d'où $b = \dfrac{6be^{2}}{a^{2}}$, soit $b(a^{2} - 6e^{2}) = 0$. Comme $6$ n'est pas le carré d'un rationnel, $a^{2} \neq 6e^{2}$, donc $b = 0$, puis $c = 0$, puis $ae = 0$ donne $e = 0$. Mais alors $\sqrt{d} = a \in \mathbb{Q}$, ce qui contredit $\beta \notin \mathbb{Q}$.

    Donc $a = 0$, et les relations deviennent $ce = be = bc = 0$ : un seul des nombres $b$, $c$, $e$ est non nul. Ainsi $\sqrt{d}$ est dans $\mathbb{Q}\sqrt{2}$, $\mathbb{Q}\sqrt{3}$ ou $\mathbb{Q}\sqrt{6}$, et $F$ est $\boxed{\mathbb{Q}(\sqrt{2}), \ \mathbb{Q}(\sqrt{3}) \text{ ou } \mathbb{Q}(\sqrt{6})}$.

    Le degré d'un sous-corps de $L$ divise $4$ (exercice 1 (2)). Les sous-corps de $L$ sont donc $\mathbb{Q}$, les trois corps quadratiques précédents et $L$ lui-même : $\boxed{\text{cinq sous-corps}}$, ceux du treillis dessiné dans le cours (section 7.5). La promesse du cours est tenue.
- id: "l3-sa-07-06"
  feuille: "f-l3-sa-07"
  numero: 6
  partie: "Corps de rupture, corps de décomposition"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [corps de rupture et de décomposition]
  noeuds: [gs-decomposition]
  notions: [corps-rupture, corps-decomposition]
  source: "TD Algèbre 4, feuille 7 (2014-15), exercice 1"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $\alpha$ le réel $\sqrt{5 + \sqrt{5}}$.

    **1.** Montrer que $\alpha$ est algébrique sur $\mathbb{Q}$ et déterminer son polynôme minimal $P \in \mathbb{Q}[X]$.

    **2.** Prouver que $\mathbb{Q}(\alpha)$ est un corps de décomposition de $P$ sur $\mathbb{Q}$.

    **3.** Montrer que $x = \alpha^{5} - 9\alpha^{3} + 10\alpha + 1$ est non nul, et trouver $Q \in \mathbb{Q}[X]$ tel que $x^{-1} = Q(\alpha)$.
  corrige: |
    **1.** On a $\alpha^{2} = 5 + \sqrt{5}$, puis $(\alpha^{2} - 5)^{2} = 5$ : $\alpha$ annule $X^{4} - 10X^{2} + 20$, donc est algébrique. Ce polynôme est irréductible par le critère d'Eisenstein avec $p = 5$ ($5$ divise $10$ et $20$, $25$ ne divise pas $20$). Donc 
    $$\boxed{P = X^{4} - 10X^{2} + 20}, \qquad [\mathbb{Q}(\alpha) : \mathbb{Q}] = 4.$$

    **2.** Les racines de $P$ vérifient $X^{2} = 5 \pm \sqrt{5}$ : ce sont $\pm\alpha$ et $\pm\beta$, avec $\beta = \sqrt{5 - \sqrt{5}}$. Or $\alpha\beta = \sqrt{25 - 5} = 2\sqrt{5}$ et $\sqrt{5} = \alpha^{2} - 5$, donc 
    $$\beta = \frac{2(\alpha^{2} - 5)}{\alpha} \in \mathbb{Q}(\alpha).$$
     Les quatre racines sont dans $\mathbb{Q}(\alpha)$, qui est engendré par l'une d'elles : $\mathbb{Q}(\alpha)$ est un corps de décomposition de $P$. Ici, contrairement à $X^{3} - 2$, un corps de rupture suffit à décomposer $P$.

    **3.** De $\alpha^{4} = 10\alpha^{2} - 20$, on tire $\alpha^{5} = 10\alpha^{3} - 20\alpha$, et 
    $$x = \alpha^{3} - 10\alpha + 1.$$
     Comme $(1, \alpha, \alpha^{2}, \alpha^{3})$ est une base de $\mathbb{Q}(\alpha)$ et que les coefficients ne sont pas tous nuls, $x \neq 0$.

    Notons $R = X^{3} - 10X + 1$. L'algorithme d'Euclide donne 
    $$P = XR + (20 - X), \qquad R = (20 - X)(-X^{2} - 20X - 390) + 7801,$$
     le dernier reste étant $R(20) = 7801 = 29 \times 269$. En remontant, 
    $$7801 = R\,(-X^{3} - 20X^{2} - 390X + 1) + P\,(X^{2} + 20X + 390).$$
     En évaluant en $\alpha$, on obtient 
    $$\boxed{x^{-1} = Q(\alpha), \qquad Q = \frac{-X^{3} - 20X^{2} - 390X + 1}{7801}},$$
     ce que confirme le calcul numérique : $x \approx -6{,}43496$ et $Q(\alpha)\,x = 1$.
- id: "l3-sa-07-07"
  feuille: "f-l3-sa-07"
  numero: 7
  partie: "Corps de rupture, corps de décomposition"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [corps de rupture et de décomposition]
  noeuds: [gs-decomposition]
  notions: [corps-rupture, corps-decomposition]
  source: "TD Algèbre 4, feuille 7 (2014-15), exercice 2"
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Soit $\alpha$ le réel $\sqrt{1 + \sqrt{3}}$. On a vu dans le cours que son polynôme minimal sur $\mathbb{Q}$ est $P = X^{4} - 2X^{2} - 2$, de sorte que $[\mathbb{Q}(\alpha) : \mathbb{Q}] = 4$.

    **1.** Déterminer les racines complexes de $P$. Montrer que $K = \mathbb{Q}(\alpha, \mathrm{i}\sqrt{2})$ est le corps de décomposition de $P$ sur $\mathbb{Q}$ contenu dans $\mathbb{C}$.

    **2.** Déterminer le degré et une base de $K$ sur $\mathbb{Q}$.
  corrige: |
    **1.** Les racines de $P$ vérifient $X^{2} = 1 \pm \sqrt{3}$. Ce sont $\pm\alpha$ et $\pm\alpha'$, où $\alpha' = \mathrm{i}\sqrt{\sqrt{3} - 1}$, puisque $1 - \sqrt{3} < 0$.

    Comme $\alpha\sqrt{\sqrt{3} - 1} = \sqrt{3 - 1} = \sqrt{2}$, on a $\alpha' = \dfrac{\mathrm{i}\sqrt{2}}{\alpha}$, donc $\alpha' \in K$, et inversement $\mathrm{i}\sqrt{2} = \alpha\alpha'$. Ainsi 
    $$\boxed{K = \mathbb{Q}(\alpha, \mathrm{i}\sqrt{2}) = \mathbb{Q}(\alpha, -\alpha, \alpha', -\alpha')}$$
     est le corps de décomposition de $P$ dans $\mathbb{C}$.

    **2.** Le corps $\mathbb{Q}(\alpha)$ est contenu dans $\mathbb{R}$, alors que $\mathrm{i}\sqrt{2}$, racine de $X^{2} + 2$, n'est pas réel. Donc $X^{2} + 2$ est irréductible sur $\mathbb{Q}(\alpha)$ et $[K : \mathbb{Q}(\alpha)] = 2$. Par la base télescopique, 
    $$\boxed{[K : \mathbb{Q}] = 8}, \qquad \text{de base } (1, \alpha, \alpha^{2}, \alpha^{3}, \mathrm{i}\sqrt{2}, \mathrm{i}\sqrt{2}\,\alpha, \mathrm{i}\sqrt{2}\,\alpha^{2}, \mathrm{i}\sqrt{2}\,\alpha^{3}).$$

    1.5em

    ![Figure](documents/figures/4590a3a394c3f970.svg)

    Quelques sous-corps de $K$, de bas en haut par degrés $1$, $2$, $4$, $8$ ; chaque trait correspond à une extension de degré $2$. Les corps $\mathbb{Q}(\alpha)$ et $\mathbb{Q}(\alpha')$ sont tous deux des corps de rupture de $P$, isomorphes (cours, th. 4) mais distincts dans $\mathbb{C}$ : le premier est réel, le second non.
