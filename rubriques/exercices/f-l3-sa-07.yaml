  page_enonce: 2
  page_corrige: 5
  enonce: |
    Soit $P \in \mathbb{Q}[X]$ unitaire, irréductible de degré $3$, de racines complexes $a$, $b$, $c$. On pose $\delta = (a - b)(a - c)(b - c)$ : son carré $\delta^{2} = \Delta(P)$ est le discriminant de $P$.

    **1.** Prouver que le corps de décomposition $\mathbb{Q}(a, b, c)$ de $P$ dans $\mathbb{C}$ est le sous-corps $K = \mathbb{Q}(a, \delta)$. *On pourra exprimer $b - c$ à l'aide de $\delta$ et de $P'(a)$.*

    **2.** Montrer que $[K : \mathbb{Q}]$ vaut $3$ si $\Delta(P)$ est le carré d'un rationnel, et $6$ sinon. Traiter les exemples $P = X^{3} - 2$ et $P = X^{3} + X^{2} - 2X - 1$.

    **3.** Soit $\zeta = \mathrm{e}^{2\mathrm{i}\pi/7}$. Montrer que $\zeta + \zeta^{-1} = 2\cos\dfrac{2\pi}{7}$ est racine de $X^{3} + X^{2} - 2X - 1$, et déterminer les deux autres racines.
  corrige: |
    Le polynôme $P$ est irréductible sur $\mathbb{Q}$, de caractéristique nulle : il est premier avec $P'$, non nul de degré $2$, donc ses racines sont simples et $\delta \neq 0$.

    **1.** On a $\delta \in \mathbb{Q}(a, b, c)$, donc $K \subset \mathbb{Q}(a, b, c)$.

    Réciproquement, $P'(a) = (a - b)(a - c)$ est non nul et appartient à $\mathbb{Q}(a)$, donc $b - c = \dfrac{\delta}{P'(a)} \in K$. Par ailleurs, si $P = X^{3} + p_{2}X^{2} + p_{1}X + p_{0}$, alors $b + c = -p_{2} - a \in \mathbb{Q}(a)$. On en déduit $b$ et $c$, demi-somme et demi-différence, dans $K$, et $\boxed{\mathbb{Q}(a, b, c) = \mathbb{Q}(a, \delta)}$.

    **2.** On a $[\mathbb{Q}(a) : \mathbb{Q}] = 3$, et $\delta$ est racine de $X^{2} - \Delta(P) \in \mathbb{Q}[X]$, donc $[K : \mathbb{Q}(a)] \in \{1, 2\}$.

    Si $\Delta(P) = r^{2}$ avec $r \in \mathbb{Q}$, alors $\delta = \pm r \in \mathbb{Q}$, $K = \mathbb{Q}(a)$ et $[K : \mathbb{Q}] = 3$.

    Sinon, $\delta \notin \mathbb{Q}$, et $\delta$ n'appartient pas à $\mathbb{Q}(a)$ : son degré sur $\mathbb{Q}$ diviserait $3$ (exercice 1 (2)) tout en valant au plus $2$, donc vaudrait $1$. Ainsi $[K : \mathbb{Q}(a)] = 2$ et $[K : \mathbb{Q}] = 6$. En résumé : 
    $$\boxed{[K : \mathbb{Q}] = 3 \text{ si } \Delta(P) \text{ est un carré dans } \mathbb{Q}, \qquad [K : \mathbb{Q}] = 6 \text{ sinon}}.$$

    Pour $X^{3} - 2$, la formule du cours $\Delta = -4p^{3} - 27q^{2}$ donne $\Delta = -108$, qui n'est pas un carré (il est négatif) : le corps de décomposition est de degré $6$, comme dans le cours.

    Pour $X^{3} + X^{2} - 2X - 1$, irréductible puisque $P(1) = -1$ et $P(-1) = 1$, la formule du degré $3$ général (feuille 6, exercice 6) donne $\Delta = 4 + 32 + 4 - 27 + 36 = 49 = 7^{2}$ : le corps de décomposition est de degré $3$, et un corps de rupture contient déjà les trois racines.

    **3.** Comme $\zeta^{7} = 1$ et $\zeta \neq 1$, on a $1 + \zeta + \cdots + \zeta^{6} = 0$. On divise par $\zeta^{3}$ : 
    $$(\zeta^{3} + \zeta^{-3}) + (\zeta^{2} + \zeta^{-2}) + (\zeta + \zeta^{-1}) + 1 = 0.$$
     Avec $y = \zeta + \zeta^{-1}$, on a $\zeta^{2} + \zeta^{-2} = y^{2} - 2$ et $\zeta^{3} + \zeta^{-3} = y^{3} - 3y$, d'où 
    $$y^{3} + y^{2} - 2y - 1 = 0.$$

    Le même calcul s'applique à $\zeta^{2}$ et $\zeta^{3}$, qui vérifient aussi $z^{7} = 1$, $z \neq 1$. Les nombres $2\cos\dfrac{2\pi}{7}$, $2\cos\dfrac{4\pi}{7}$, $2\cos\dfrac{6\pi}{7}$ sont distincts (le cosinus est injectif sur $[0, \pi]$) : ce sont les trois racines, 
    $$\boxed{2\cos\tfrac{2\pi}{7} \approx 1{,}247, \qquad 2\cos\tfrac{4\pi}{7} \approx -0{,}445, \qquad 2\cos\tfrac{6\pi}{7} \approx -1{,}802}.$$
     Conformément à la question 2, elles s'expriment les unes en fonction des autres, par exemple 
    $$2\cos\frac{4\pi}{7} = \Big(2\cos\frac{2\pi}{7}\Big)^{2} - 2.$$

    1.5em

    ![Figure](documents/figures/ffcac40855a2d0ce.svg)

    Les racines septièmes de l'unité forment un heptagone régulier (en bleu). Les sommets conjugués $\zeta^{k}$ et $\zeta^{-k}$, reliés en pointillés, ont la même abscisse $\cos\dfrac{2k\pi}{7}$ (en rouge, reportée sous la figure) ; les doubles de ces trois abscisses sont les racines de $X^{3} + X^{2} - 2X - 1$.
- id: "l3-sa-07-09"
  feuille: "f-l3-sa-07"
  numero: 9
