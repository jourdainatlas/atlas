  enonce: |
    *Double pile.* On lance une pièce qui donne pile avec la probabilité $p \in ]0, 1[$. Pour $n \geqslant 2$, on note $a_{n}$ la probabilité d'obtenir pour la première fois deux piles consécutifs aux lancers $n - 1$ et $n$, et l'on pose $a_{1} = 0$.

    **1.** Calculer $a_{2}$, $a_{3}$ et $a_{4}$.

    **2.** Montrer que $a_{n + 2} = q\,a_{n + 1} + pq\,a_{n}$ pour $n \geqslant 2$. On pourra discuter selon le résultat des premiers lancers.

    **3.** On suppose $p = \frac{2}{3}$. Exprimer $a_{n}$ en fonction de $n$, et calculer $\sum_{n \geqslant 2} a_{n}$. Interpréter.
  corrige: |
    On conditionne par le début de la partie : un face au premier lancer, ou un pile suivi d'un face, ramènent à la situation initiale, décalée d'un ou de deux lancers.

    **1.** Le premier double pile apparaît au lancer $2$ si l'on obtient $PP$ ; au lancer $3$ si l'on obtient $FPP$ ; au lancer $4$ si l'on obtient $PFPP$ ou $FFPP$. 
    $$\boxed{a_{2} = p^{2}, \qquad a_{3} = qp^{2}, \qquad a_{4} = p^{3}q + q^{2}p^{2} = qp^{2}}$$

    **2.** Soit $n \geqslant 1$. Si le premier lancer donne face, le premier double pile au rang $n + 2$ revient à un premier double pile au rang $n + 1$ pour la suite des lancers, qui est indépendante du premier ; si les deux premiers donnent $PF$, il revient à un premier double pile au rang $n$ ; si les deux premiers donnent $PP$, le premier double pile est au rang $2 < n + 2$. Ainsi : 
    $$\boxed{a_{n + 2} = q\,a_{n + 1} + pq\,a_{n}}$$

    **3.** Pour $p = \frac{2}{3}$, l'équation caractéristique $r^{2} = \frac{1}{3}r + \frac{2}{9}$ a pour racines $\frac{2}{3}$ et $-\frac{1}{3}$. Les conditions $a_{1} = 0$ et $a_{2} = \frac{4}{9}$ donnent, en remarquant que la formule vaut aussi pour $n = 1$ : 
    $$\boxed{a_{n} = \Big(\frac{2}{3}\Big)^{n + 1} + \frac{4}{3}\Big(-\frac{1}{3}\Big)^{n}, \qquad \sum_{n = 2}^{+\infty} a_{n} = \frac{2}{3}\cdot\frac{4/9}{1/3} + \frac{4}{3}\cdot\frac{1/9}{4/3} = \frac{8}{9} + \frac{1}{9} = 1}$$
     Le double pile finit presque sûrement par apparaître. La formule a été vérifiée par énumération exacte des suites de longueur $n \leqslant 9$.
