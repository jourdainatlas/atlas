  enonce: |
    *L'indicatrice d'Euler.* Soit $n \geqslant 2$, de diviseurs premiers $p_{1}$, …, $p_{r}$. On choisit $x$ uniformément dans $\llbracket 1\,,n \rrbracket$. Pour $m$ divisant $n$, on note $A_{m}$ l'événement « $m$ divise $x$ », et $B$ l'événement « $x$ est premier avec $n$ ».

    **1.** Calculer $\mathbb{P}(A_{m})$ pour $m$ divisant $n$, et exprimer $B$ à l'aide des $A_{p_{k}}$.

    **2.** Montrer que les événements $A_{p_{1}}$, …, $A_{p_{r}}$ sont mutuellement indépendants.

    **3.** En déduire que $\varphi(n) = n\prod_{k = 1}^{r} \Big(1 - \dfrac{1}{p_{k}}\Big)$, où $\varphi(n)$ est le nombre d'entiers de $\llbracket 1\,,n \rrbracket$ premiers avec $n$.
  corrige: |
    L'indépendance des événements « $p_{k}$ divise $x$ » traduit le lemme chinois : la divisibilité par des nombres premiers distincts se comporte comme des épreuves indépendantes.

    **1.** Les multiples de $m$ dans $\llbracket 1\,,n \rrbracket$ sont au nombre de $\frac{n}{m}$, puisque $m$ divise $n$. Un entier est premier avec $n$ si et seulement s'il n'est divisible par aucun $p_{k}$. 
    $$\boxed{\mathbb{P}(A_{m}) = \frac{1}{m}, \qquad B = \bar{A}_{p_{1}} \cap \cdots \cap \bar{A}_{p_{r}}}$$

    **2.** Pour $J \subset \llbracket 1\,,r \rrbracket$, un entier est divisible par tous les $p_{j}$, $j \in J$, si et seulement s'il l'est par leur produit $m_{J}$, qui divise $n$. Donc $\mathbb{P}\big(\bigcap_{j \in J} A_{p_{j}}\big) = \frac{1}{m_{J}} = \prod_{j \in J} \frac{1}{p_{j}}$ : les événements sont mutuellement indépendants.

    **3.** Les complémentaires sont aussi indépendants (proposition 8), d'où $\mathbb{P}(B) = \prod_{k} \big(1 - \frac{1}{p_{k}}\big)$, et $\varphi(n) = n\mathbb{P}(B)$. 
    $$\boxed{\varphi(n) = n\prod_{k = 1}^{r} \Big(1 - \frac{1}{p_{k}}\Big)}$$
- id: "mp-14-19"
  feuille: "f-mp-14"
  numero: 19
  partie: "Conditionnement et indépendance"
  etoiles: 2
  types: [Calcul]
  mots_cles: [conditionnement et indépendance]
  noeuds: [p-independance]
  notions: [probabilite-conditionnelle, independance]
  source: "BibM@th, Espaces probabilisés, exercices 21 et 22"
  page_enonce: 5
  page_corrige: 9
  enonce: |
    **1.** Soit $A_{1}$, …, $A_{n}$ des événements mutuellement indépendants, de probabilités $p_{1}$, …, $p_{n}$. Exprimer $\mathbb{P}(A_{1} \cup \cdots \cup A_{n})$. Quelle est la probabilité d'au moins un accident lors de $n$ expériences indépendantes, si chacune a la probabilité $p$ de causer un accident ?

    **2.** Un livre contient $4$ erreurs. À chaque relecture, chaque erreur encore présente est corrigée avec la probabilité $\frac{1}{3}$, indépendamment des autres et des relectures précédentes. Quelle est la probabilité que le livre soit entièrement corrigé après $n$ relectures ? Combien faut-il de relectures pour que cette probabilité dépasse $0{,}9$ ?
  corrige: |
    La probabilité d'une réunion d'événements indépendants se calcule par le complémentaire, qui est une intersection.

    **1.** Par indépendance des complémentaires : 
    $$\boxed{\mathbb{P}(A_{1} \cup \cdots \cup A_{n}) = 1 - \prod_{i = 1}^{n} (1 - p_{i}), \qquad \mathbb{P}(\text{au moins un accident}) = 1 - (1 - p)^{n}}$$
     Même pour $p$ petit, cette probabilité tend vers $1$ quand $n \to +\infty$ : c'est une première forme de la loi de Murphy.

    **2.** Une erreur donnée subsiste après $n$ relectures avec la probabilité $\big(\frac{2}{3}\big)^{n}$. Les quatre erreurs étant traitées indépendamment : 
    $$\boxed{\mathbb{P}(\text{livre corrigé après } n \text{ relectures}) = \Big(1 - \Big(\frac{2}{3}\Big)^{n}\Big)^{4}}$$
     Cette probabilité vaut environ $0{,}8997$ pour $n = 9$ et $0{,}9324$ pour $n = 10$ : il faut $10$ relectures.
- id: "mp-14-20"
  feuille: "f-mp-14"
  numero: 20
  partie: "Conditionnement et indépendance"
