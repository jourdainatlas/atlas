  enonce: |
    Deux joueurs $J_{1}$ et $J_{2}$ tirent à tour de rôle sur une cible, en commençant par $J_{1}$ ; le premier qui l'atteint gagne. À chaque tir, $J_{1}$ atteint la cible avec la probabilité $p_{1} \in ]0, 1[$, et $J_{2}$ avec la probabilité $p_{2} \in ]0, 1[$, les tirs étant indépendants.

    **1.** Calculer la probabilité que $J_{1}$ gagne au tir de rang $2n + 1$, puis celle que $J_{2}$ gagne au tir de rang $2n + 2$.

    **2.** En déduire les probabilités de gain de chaque joueur, et la probabilité que le jeu dure indéfiniment.

    **3.** Montrer que le jeu est équitable si et seulement si $p_{2} = \frac{p_{1}}{1 - p_{1}}$. Quelle condition cela impose-t-il à $p_{1}$ ?
  corrige: |
    Le jeu se décompose selon le rang du tir gagnant, et les probabilités forment des séries géométriques de raison $q_{1}q_{2}$, où $q_{i} = 1 - p_{i}$.

    **1.** Le joueur $J_{1}$ gagne au rang $2n + 1$ si les $2n$ premiers tirs sont manqués, puis s'il réussit ; de même pour $J_{2}$. 
    $$\boxed{\mathbb{P}(J_{1} \text{ gagne au rang } 2n + 1) = (q_{1}q_{2})^{n}p_{1}, \qquad \mathbb{P}(J_{2} \text{ gagne au rang } 2n + 2) = (q_{1}q_{2})^{n}q_{1}p_{2}}$$

    **2.** Par $\sigma$-additivité, avec $q_{1}q_{2} < 1$ : 
    $$\boxed{\mathbb{P}(G_{1}) = \frac{p_{1}}{1 - q_{1}q_{2}}, \qquad \mathbb{P}(G_{2}) = \frac{q_{1}p_{2}}{1 - q_{1}q_{2}}}$$
     On vérifie que $p_{1} + q_{1}p_{2} = 1 - q_{1}q_{2}$ : la somme vaut $1$, et le jeu s'arrête presque sûrement.

    **3.** Le jeu est équitable si et seulement si $p_{1} = q_{1}p_{2}$. 
    $$\boxed{\text{jeu équitable} \iff p_{2} = \frac{p_{1}}{1 - p_{1}}}$$
     Comme $p_{2} < 1$, cela impose $p_{1} < \frac{1}{2}$ : un joueur qui commence et réussit plus d'un tir sur deux est toujours avantagé.
