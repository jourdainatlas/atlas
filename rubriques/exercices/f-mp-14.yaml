  enonce: |
    *Le taux de panne.* Soit $X$ une variable aléatoire à valeurs dans $\mathbb{N}^{*}$, telle que $\mathbb{P}(X \geqslant n) > 0$ pour tout $n$. On note $p_{n} = \mathbb{P}(X = n)$, et l'on définit le *taux de panne* $x_{n} = \mathbb{P}_{(X \geqslant n)}(X = n)$.

    **1.** Montrer que $x_{n} \in [0, 1[$ et que $p_{n} = x_{n}\prod_{k = 1}^{n - 1} (1 - x_{k})$ pour tout $n \geqslant 1$.

    **2.** Montrer que $X$ suit une loi géométrique si et seulement si le taux de panne est constant. Comparer avec la proposition 13 du cours.

    **3.** Réciproquement, soit $(x_{n})_{n \geqslant 1}$ une suite de $[0, 1[$. À quelle condition sur la série $\sum x_{n}$ existe-t-il une variable aléatoire à valeurs dans $\mathbb{N}^{*}$ dont le taux de panne est $(x_{n})$ ?
  corrige: |
    Le taux de panne est la probabilité de « mourir » à l'instant $n$ pour un objet qui a survécu jusque-là ; il détermine la loi, et il est constant exactement pour la loi sans mémoire.

    **1.** Comme $(X = n) \subset (X \geqslant n)$ et $\mathbb{P}(X \geqslant n + 1) > 0$, on a $0 \leqslant x_{n} = \frac{p_{n}}{\mathbb{P}(X \geqslant n)} < 1$. Ensuite $\mathbb{P}(X \geqslant n + 1) = \mathbb{P}(X \geqslant n) - p_{n} = \mathbb{P}(X \geqslant n)(1 - x_{n})$, d'où $\mathbb{P}(X \geqslant n) = \prod_{k < n} (1 - x_{k})$ par récurrence. 
    $$\boxed{p_{n} = x_{n}\prod_{k = 1}^{n - 1} (1 - x_{k})}$$

    **2.** Si $X \sim \mathcal{G}(p)$, $x_{n} = \frac{pq^{n - 1}}{q^{n - 1}} = p$. Réciproquement, si $x_{n} = x$ pour tout $n$, la question 1 donne $p_{n} = x(1 - x)^{n - 1}$, avec $x > 0$ puisque la somme des $p_{n}$ vaut $1$. 
    $$\boxed{X \text{ géométrique} \iff \text{taux de panne constant}}$$
     C'est une autre forme de la proposition 13 : un objet sans usure a, à chaque instant, la même probabilité de tomber en panne, quel que soit son âge.

    **3.** En posant $p_{n} = x_{n}\prod_{k < n} (1 - x_{k}) \geqslant 0$, la somme télescopique donne $\sum_{n \leqslant N} p_{n} = 1 - \prod_{k \leqslant N} (1 - x_{k})$. Il existe une variable de taux de panne $(x_{n})$ si et seulement si ce produit tend vers $0$, c'est-à-dire si $\sum -\ln(1 - x_{k}) = +\infty$. Comme $-\ln(1 - x) \geqslant x$, et $-\ln(1 - x) \sim x$ quand $x \to 0$, cela équivaut à la divergence de $\sum x_{k}$ : si $x_{k}$ ne tend pas vers $0$, les deux séries divergent grossièrement. 
    $$\boxed{\text{condition nécessaire et suffisante : } \sum x_{n} = +\infty}$$
