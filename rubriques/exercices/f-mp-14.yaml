  enonce: |
    *La loi des séries.* Soit $(X_{n})_{n \geqslant 1}$ une suite i.i.d. de loi $\mathcal{B}(p)$, et $r \in \mathbb{N}^{*}$. On pose 
    $$T_{r} = \min\{n \geqslant r \mid X_{n - r + 1} = \cdots = X_{n} = 1\},$$
     avec $T_{r} = +\infty$ si cet ensemble est vide.

    **1.** Que représente $T_{r}$ ? Montrer que $(T_{r} = n)$ est un événement pour tout $n \in \mathbb{N}^{*} \cup \{+\infty\}$.

    **2.** Montrer que, pour tout $n \in \mathbb{N}$, $\mathbb{P}(T_{r} = n + r + 1) = q\,p^{r}\,\mathbb{P}(T_{r} > n)$.

    **3.** En déduire que la série $\sum \mathbb{P}(T_{r} > n)$ converge, puis que $T_{r}$ est presque sûrement finie.

    **4.** Calculer $\mathbb{P}(T_{r} = r)$, et, pour $r = 2$, retrouver le résultat de l'exercice 14.
  corrige: |
    Pour qu'une première série de $r$ succès se termine au rang $n + r + 1$, il faut un échec au rang $n + 1$, et aucune série terminée auparavant.

    **1.** La variable $T_{r}$ est le rang où s'achève la première série de $r$ succès consécutifs. Pour $n$ fini, $(T_{r} = n)$ ne dépend que de $X_{1}$, …, $X_{n}$, et c'est une réunion finie d'intersections d'événements $(X_{k} = 0)$ ou $(X_{k} = 1)$ ; $(T_{r} = +\infty)$ est le complémentaire de la réunion dénombrable des $(T_{r} = n)$.

    **2.** Soit $n \in \mathbb{N}$. L'événement $(T_{r} = n + r + 1)$ est l'intersection de $(T_{r} > n)$, de $(X_{n + 1} = 0)$ et de $(X_{n + 2} = \cdots = X_{n + r + 1} = 1)$. En effet, si $X_{n + 1}$ valait $1$, une série se terminerait au rang $n + r$ ; et l'échec au rang $n + 1$ empêche toute série de se terminer entre $n + 1$ et $n + r$. L'événement $(T_{r} > n)$ ne dépend que de $X_{1}$, …, $X_{n}$, et le lemme des coalitions donne : 
    $$\boxed{\mathbb{P}(T_{r} = n + r + 1) = q\,p^{r}\,\mathbb{P}(T_{r} > n)}$$

    **3.** Les événements $(T_{r} = n + r + 1)$ sont deux à deux incompatibles, donc $\sum_{n} q\,p^{r}\mathbb{P}(T_{r} > n) \leqslant 1$ : la série converge et son terme général tend vers $0$. La continuité décroissante donne alors 
    $$\mathbb{P}(T_{r} = +\infty) = \lim\limits_{n \to +\infty} \mathbb{P}(T_{r} > n) = 0.$$

    $$\boxed{\sum_{n \geqslant 0} \mathbb{P}(T_{r} > n) \leqslant \frac{1}{qp^{r}}, \qquad T_{r} \text{ est presque sûrement finie}}$$
     Au chapitre 15, cette somme sera l'espérance de $T_{r}$.

    **4.** On a $\mathbb{P}(T_{r} = r) = p^{r}$. Pour $r = 2$, avec $a_{n} = \mathbb{P}(T_{2} = n)$, la question 2 s'écrit 
    $$a_{n + 3} = qp^{2}\Big(1 - \sum_{k \leqslant n} a_{k}\Big),$$
     d'où, en retranchant la même relation au rang précédent, $a_{n + 3} = a_{n + 2} - qp^{2}a_{n}$. On retrouve la suite de l'exercice 14 : avec les mêmes valeurs initiales $a_{1} = 0$, $a_{2} = p^{2}$, $a_{3} = qp^{2}$, la récurrence de l'exercice 14 entraîne celle-ci, puisque 
    $$q\,a_{n + 2} + pq\,a_{n + 1} - a_{n + 2} + qp^{2}a_{n} = -p\big(a_{n + 2} - q\,a_{n + 1} - pq\,a_{n}\big) = 0.$$
- id: "mp-14-42"
  feuille: "f-mp-14"
  numero: 42
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [synthèse, ensembles dénombrables]
  noeuds: [q-denombrable]
  notions: [denombrable]
  page_enonce: 10
  page_corrige: 19
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par un renvoi précis au cours ou par un contre-exemple.

    **1.** Une réunion dénombrable d'ensembles dénombrables est dénombrable.

    **2.** Il existe une probabilité sur $\mathcal{P}(\mathbb{N})$ pour laquelle tous les singletons ont la même probabilité.

    **3.** Si $(A_{n})$ est une suite croissante d'événements, alors $\mathbb{P}(A_{n}) \to \mathbb{P}\big(\bigcup A_{n}\big)$.

    **4.** Une réunion quelconque d'événements négligeables est négligeable.

    **5.** Si $\sum \mathbb{P}(A_{n})$ converge, alors presque sûrement seul un nombre fini des $A_{n}$ se réalisent.

    **6.** Trois événements deux à deux indépendants sont mutuellement indépendants.

    **7.** Si $X \sim Y$, alors $X^{2} \sim Y^{2}$.

    **8.** Si $X$ et $Y$ ont la même loi et sont indépendantes, alors $\mathbb{P}(X = Y) > 0$.

    **9.** Si $X$ et $Y$ suivent des lois de Poisson, alors $X + Y$ suit une loi de Poisson.

    **10.** Si $X \sim \mathcal{G}(p)$, alors $\mathbb{P}_{(X > 5)}(X = 8) = \mathbb{P}(X = 3)$.
  corrige: |
    Six affirmations sont vraies (1, 3, 5, 7, 8, 10) et quatre sont fausses (2, 4, 6, 9).

    **1. Vrai.** La réunion est au plus dénombrable par le théorème 1, et infinie.

    **2. Faux.** Si tous les singletons avaient la probabilité $c$, la $\sigma$-additivité donnerait $1 = \sum_{n} c$, qui vaut $0$ ou $+\infty$ (remarque du théorème 5).

    **3. Vrai.** C'est la continuité croissante, théorème 3.

    **4. Faux.** Dans le jeu de pile ou face infini, chaque issue est négligeable (exercice 2), et leur réunion est l'univers entier.

    **5. Vrai.** C'est le premier lemme de Borel-Cantelli (exercice 9).

    **6. Faux.** On lance deux pièces équilibrées ; $A$ : « pile au premier lancer », $B$ : « pile au second », $C$ : « les deux lancers donnent le même résultat ». Ces événements sont deux à deux indépendants, de probabilité $\frac{1}{2}$, mais $\mathbb{P}(A \cap B \cap C) = \frac{1}{4} \neq \frac{1}{8}$.

    **7. Vrai.** C'est la proposition 10 avec $f(x) = x^{2}$.

    **8. Vrai.** On a $\mathbb{P}(X = Y) = \sum_{x} \mathbb{P}(X = x)\mathbb{P}(Y = x) = \sum_{x} \mathbb{P}(X = x)^{2}$, et l'un au moins de ces termes est non nul.

    **9. Faux.** Si $Y = X \sim \mathcal{P}(\lambda)$, alors $X + Y = 2X$ ne prend que des valeurs paires, alors qu'une loi de Poisson charge tous les entiers.

    **10. Vrai.** On a $\mathbb{P}_{(X > 5)}(X = 8) = \frac{pq^{7}}{q^{5}} = pq^{2} = \mathbb{P}(X = 3)$ : c'est l'absence de mémoire.
