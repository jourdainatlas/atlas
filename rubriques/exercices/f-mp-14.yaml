  enonce: |
    *La loi trinomiale.* On effectue $n$ tirages avec remise dans une urne contenant des boules rouges, bleues et vertes, en proportions $p$, $r$ et $1 - p - r$, avec $p$, $r > 0$ et $p + r < 1$. On note $X$ et $Y$ les nombres de boules rouges et bleues obtenues.

    **1.** Déterminer les lois de $X$, de $Y$ et du couple $(X, Y)$.

    **2.** Les variables $X$ et $Y$ sont-elles indépendantes ?

    **3.** Déterminer la loi conditionnelle de $Y$ sachant $(X = i)$, et l'interpréter.
  corrige: |
    Chaque tirage a trois issues ; on compte les suites de résultats ayant $i$ rouges, $j$ bleues et $n - i - j$ vertes.

    **1.** Chaque boule est rouge avec la probabilité $p$, indépendamment des autres : $X \sim \mathcal{B}(n, p)$, et de même $Y \sim \mathcal{B}(n, r)$. Pour la loi conjointe, on choisit les positions des rouges, puis celles des bleues parmi les places restantes : 
    $$\boxed{\mathbb{P}(X = i, Y = j) = \frac{n!}{i!\,j!\,(n - i - j)!}\,p^{i}r^{j}(1 - p - r)^{n - i - j}, \qquad i + j \leqslant n}$$

    **2.** Pour $n \geqslant 1$, $\mathbb{P}(X = n, Y = n) = 0$, alors que $\mathbb{P}(X = n)\mathbb{P}(Y = n) = p^{n}r^{n} > 0$. 
    $$\boxed{X \text{ et } Y \text{ ne sont pas indépendantes}}$$

    **3.** En divisant la loi conjointe par $\mathbb{P}(X = i) = \binom{n}{i}p^{i}(1 - p)^{n - i}$, on obtient 
    $$\boxed{\mathbb{P}_{(X = i)}(Y = j) = \binom{n - i}{j}\Big(\frac{r}{1 - p}\Big)^{j}\Big(1 - \frac{r}{1 - p}\Big)^{n - i - j}, \quad\text{c'est-à-dire } \mathcal{B}\Big(n - i, \frac{r}{1 - p}\Big)}$$
     Sachant qu'il y a $i$ rouges, les $n - i$ autres boules sont bleues ou vertes, et chacune est bleue avec la probabilité conditionnelle $\frac{r}{1 - p}$.
- id: "mp-14-32"
  feuille: "f-mp-14"
