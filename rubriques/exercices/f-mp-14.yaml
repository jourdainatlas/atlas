  enonce: |
    Soit $X$ et $Y$ deux variables indépendantes de même loi, donnée par $\mathbb{P}(X = k) = pq^{k}$ pour $k \in \mathbb{N}$. On pose $U = \max(X, Y)$ et $V = \min(X, Y)$.

    **1.** Déterminer la loi du couple $(U, V)$, puis les lois marginales.

    **2.** Montrer que $V + 1$ suit une loi géométrique. Les variables $U$ et $V$ sont-elles indépendantes ?

    **3.** Montrer que $V$ et $U - V$ sont indépendantes, et déterminer la loi de $U - V$.
  corrige: |
    On distingue les cas $X < Y$, $X > Y$ et $X = Y$, puis l'on reconnaît une loi produit.

    **1.** Pour $v < u$, l'événement $(U = u, V = v)$ est la réunion disjointe de $(X = u, Y = v)$ et $(X = v, Y = u)$ ; pour $u = v$, c'est $(X = Y = u)$. 
    $$\boxed{\mathbb{P}(U = u, V = v) = 2p^{2}q^{u + v} \ (v < u), \qquad \mathbb{P}(U = V = u) = p^{2}q^{2u}}$$
     Pour les marginales, on utilise $\mathbb{P}(X \geqslant k) = q^{k}$. Par indépendance, $\mathbb{P}(V \geqslant v) = q^{2v}$ et 
    $$\mathbb{P}(U \leqslant u) = (1 - q^{u + 1})^{2},$$
     d'où : 
    $$\boxed{\mathbb{P}(V = v) = (1 - q^{2})\,q^{2v}, \qquad \mathbb{P}(U = u) = (1 - q^{u + 1})^{2} - (1 - q^{u})^{2}}$$

    **2.** Pour $k \geqslant 1$, on a $\mathbb{P}(V + 1 = k) = (1 - q^{2})(q^{2})^{k - 1}$, donc la variable $V + 1$ suit la loi $\mathcal{G}(1 - q^{2})$. Enfin, $\mathbb{P}(U = 0, V = 1) = 0$, alors que $\mathbb{P}(U = 0)$ et $\mathbb{P}(V = 1)$ sont non nulles : $U$ et $V$ ne sont pas indépendantes, ce qui est naturel puisque $V \leqslant U$.

    **3.** Pour $v \in \mathbb{N}$ et $d \in \mathbb{N}$, $\mathbb{P}(V = v, U - V = d)$ vaut $2p^{2}q^{2v + d}$ si $d \geqslant 1$, et $p^{2}q^{2v}$ si $d = 0$. Cela s'écrit $(1 - q^{2})q^{2v}\cdot g(d)$, avec $g(0) = \frac{p^{2}}{1 - q^{2}} = \frac{p}{1 + q}$ et $g(d) = \frac{2pq^{d}}{1 + q}$ pour $d \geqslant 1$. La somme des $g(d)$ vaut $\frac{p}{1 + q} + \frac{2q}{1 + q} = 1$. 
    $$\boxed{V \perp\!\!\!\perp U - V, \qquad \mathbb{P}(U - V = 0) = \frac{p}{1 + q}, \quad \mathbb{P}(U - V = d) = \frac{2pq^{d}}{1 + q} \ (d \geqslant 1)}$$
     L'écart entre le maximum et le minimum ne dépend pas de la valeur du minimum : c'est une nouvelle manifestation de l'absence de mémoire.
