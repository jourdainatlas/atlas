  source: "Feuille d'exercices #10 (Prost), exercice 12"
  page_enonce: 5
  page_corrige: 9
  enonce: |
    *Le paradoxe des anniversaires.* On répartit $q$ jetons dans $n$ boîtes, chaque jeton étant placé dans une boîte choisie uniformément, indépendamment des autres.

    **1.** Calculer la probabilité $p_{q, n}$ que chaque boîte contienne au plus un jeton.

    **2.** Déterminer les limites de $p_{q, n}$, pour $q$ fixé, et de $p_{n, n}$, lorsque $n \to +\infty$.

    **3.** On suppose que $q = q_{n}$ dépend de $n$, avec $q_{n} \sim c\sqrt{n}$, où $c > 0$. Montrer que $p_{q_{n}, n} \to \mathrm{e}^{-c^{2}/2}$.

    **4.** Combien faut-il de personnes pour que la probabilité que deux d'entre elles aient le même anniversaire dépasse $\frac{1}{2}$, en prenant $n = 365$ ?
  corrige: |
    On compte les répartitions injectives parmi les $n^{q}$ répartitions équiprobables, puis l'on étudie le logarithme du produit obtenu.

    **1.** Il y a $n(n - 1)\cdots(n - q + 1)$ répartitions injectives. 
    $$\boxed{p_{q, n} = \frac{n(n - 1)\cdots(n - q + 1)}{n^{q}} = \prod_{k = 0}^{q - 1} \Big(1 - \frac{k}{n}\Big)}$$

    **2.** Pour $q$ fixé, chaque facteur tend vers $1$. D'autre part, $p_{n, n} = \frac{n!}{n^{n}} \sim \sqrt{2\pi n}\,\mathrm{e}^{-n}$ par la formule de Stirling. 
    $$\boxed{p_{q, n} \xrightarrow[n \to +\infty]{} 1, \qquad p_{n, n} \xrightarrow[n \to +\infty]{} 0}$$

    **3.** Pour $0 \leqslant x \leqslant \frac{1}{2}$, $-x - x^{2} \leqslant \ln(1 - x) \leqslant -x$. Comme $q_{n} = o(n)$, on peut l'appliquer à tous les $\frac{k}{n}$ pour $n$ assez grand : 
    $$-\frac{q_{n}(q_{n} - 1)}{2n} - \frac{q_{n}^{3}}{n^{2}} \leqslant \ln p_{q_{n}, n} \leqslant -\frac{q_{n}(q_{n} - 1)}{2n},$$
     et les deux bornes tendent vers $-\frac{c^{2}}{2}$, puisque $\frac{q_{n}^{3}}{n^{2}} \sim \frac{c^{3}}{\sqrt{n}}$. 
    $$\boxed{p_{q_{n}, n} \xrightarrow[n \to +\infty]{} \mathrm{e}^{-c^{2}/2}}$$

    **4.** Pour $n = 365$, on trouve $1 - p_{22, 365} \approx 0{,}476$ et $1 - p_{23, 365} \approx 0{,}507$. 
    $$\boxed{\text{il suffit de } 23 \text{ personnes}}$$
     L'approximation de la question 3 donne $q \approx \sqrt{2n\ln 2} \approx 22{,}5$, en bon accord. Le nombre de personnes est de l'ordre de $\sqrt{365}$, et non de $365$, ce qui surprend toujours.
- id: "mp-14-21"
  feuille: "f-mp-14"
  numero: 21
  partie: "Conditionnement et indépendance"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [conditionnement et indépendance]
  noeuds: [p-independance]
  notions: [probabilite-conditionnelle, independance]
  source: "BibM@th, Espaces probabilisés, exercice 20 (questions 2 et 3, sans la partie algorithmique)"
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Une urne contient initialement une boule blanche et une boule noire. On tire une boule : si elle est noire, on la remet ; si elle est blanche, on la remet et l'on double le nombre de boules blanches. On répète indéfiniment l'opération, et l'on note $B_{n}$ l'événement « les $n$ premiers tirages donnent des boules blanches », $B_{\infty}$ l'événement « tous les tirages donnent des boules blanches ».

    **1.** Montrer que $u_{n} = \mathbb{P}(B_{n}) = \prod_{k = 0}^{n - 1} \dfrac{2^{k}}{1 + 2^{k}}$.

    **2.** Montrer que $\mathbb{P}(B_{\infty}) = \lim u_{n}$, puis que cette limite est strictement positive.

    **3.** Comparer avec l'exemple du jeu de pile ou face du cours, où l'événement « face à tous les lancers » est négligeable.
  corrige: |
    La probabilité de tirer une blanche augmente si vite que la probabilité de ne tirer que des blanches reste strictement positive, contrairement au jeu de pile ou face.

    **1.** Si les $k$ premiers tirages ont donné des blanches, l'urne contient $2^{k}$ blanches et une noire : $\mathbb{P}_{B_{k}}(B_{k + 1}) = \frac{2^{k}}{2^{k} + 1}$. La formule des probabilités composées donne : 
    $$\boxed{u_{n} = \prod_{k = 0}^{n - 1} \frac{2^{k}}{1 + 2^{k}}}$$

    **2.** La suite $(B_{n})$ est décroissante, d'intersection $B_{\infty}$ : par continuité décroissante, $\mathbb{P}(B_{\infty}) = \lim u_{n}$. On a $-\ln u_{n} = \ln 2 + \sum_{k = 1}^{n - 1} \ln(1 + 2^{-k})$, et $0 \leqslant \ln(1 + 2^{-k}) \leqslant 2^{-k}$ : la série converge, de somme au plus $1$, donc $\lim u_{n} \geqslant \frac{1}{2}\mathrm{e}^{-1} > 0$. 
    $$\boxed{\mathbb{P}(B_{\infty}) = \lim\limits_{n \to +\infty} u_{n} \approx 0{,}2097 > 0}$$

    **3.** Pour une pièce équilibrée, la probabilité de « face » à chaque lancer reste $\frac{1}{2}$, et le produit $\big(\frac{1}{2}\big)^{n}$ tend vers $0$. Ici, la probabilité d'échec au $k$-ième tirage est $\frac{1}{1 + 2^{k}}$, terme général d'une série convergente : c'est la condition qui rend le produit infini non nul (comparer avec l'exercice 9 et l'exercice 37).
- id: "mp-14-22"
  feuille: "f-mp-14"
  numero: 22
  partie: "Espaces probabilisés discrets"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [espaces probabilisés discrets]
  noeuds: [p-espace]
  notions: [espace-probabilise]
  source: "BibM@th, Espaces probabilisés, exercice 10"
  page_enonce: 6
  page_corrige: 10
  enonce: |
    Soit $a \in ]0, 1[$.

    **1.** Montrer qu'il existe une unique probabilité $\mathbb{P}$ sur $\mathcal{P}(\mathbb{N})$ telle que $\mathbb{P}(\{n\}) = (1 - a)a^{n}$ pour tout $n \in \mathbb{N}$.

    **2.** Soit $A$ l'ensemble des entiers pairs et $B$ celui des entiers impairs. Calculer $\mathbb{P}(A)$ et $\mathbb{P}(B)$. Les événements $A$ et $B$ sont-ils incompatibles ? indépendants ?

    **3.** Pour $k \in \mathbb{N}^{*}$, calculer la probabilité de l'ensemble $k\mathbb{N}$ des multiples de $k$.
  corrige: |
    Le théorème 5 du cours ramène la construction de la probabilité à la vérification d'une famille positive de somme $1$.

    **1.** La famille $\big((1 - a)a^{n}\big)_{n \in \mathbb{N}}$ est positive, de somme $(1 - a)\cdot\frac{1}{1 - a} = 1$ : le théorème 5 donne l'existence et l'unicité.

    **2.** On a $\mathbb{P}(A) = (1 - a)\sum_{k \geqslant 0} a^{2k} = \frac{1 - a}{1 - a^{2}}$. 
    $$\boxed{\mathbb{P}(A) = \frac{1}{1 + a}, \qquad \mathbb{P}(B) = \frac{a}{1 + a}}$$
     Les événements $A$ et $B$ sont incompatibles, mais ils ne sont pas indépendants, puisque $\mathbb{P}(A \cap B) = 0$ alors que $\mathbb{P}(A)\mathbb{P}(B) \neq 0$.

    *Piège.* Deux événements incompatibles de probabilités non nulles ne sont jamais indépendants : savoir que l'un est réalisé apprend que l'autre ne l'est pas.

    **3.** On a $\mathbb{P}(k\mathbb{N}) = (1 - a)\sum_{m \geqslant 0} a^{km} = \frac{1 - a}{1 - a^{k}}$. 
    $$\boxed{\mathbb{P}(k\mathbb{N}) = \frac{1 - a}{1 - a^{k}}}$$
- id: "mp-14-23"
  feuille: "f-mp-14"
  numero: 23
  partie: "Espaces probabilisés discrets"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [espaces probabilisés discrets]
  noeuds: [p-espace]
  notions: [espace-probabilise]
  source: "BibM@th, Espaces probabilisés, exercice 19"
  page_enonce: 6
  page_corrige: 11
  enonce: |
    On munit $\mathbb{N}^{*}$ de la probabilité telle que $\mathbb{P}(\{n\}) = 2^{-n}$, et l'on note $A_{k}$ l'événement « $k$ divise $n$ ».

    **1.** Calculer $\mathbb{P}(A_{k})$ pour $k \in \mathbb{N}^{*}$, puis $\mathbb{P}(A_{2} \cup A_{3})$.

    **2.** Montrer que, pour $p$, $q \geqslant 2$, les événements $A_{p}$ et $A_{q}$ ne sont jamais indépendants.

    **3.** Comparer avec l'exemple de la loi zêta du cours. Qu'est-ce qui distingue les deux probabilités ?
  corrige: |
    On calcule chaque probabilité par une série géométrique ; la non-indépendance se lit sur un argument de congruence.

    **1.** On a $\mathbb{P}(A_{k}) = \sum_{m \geqslant 1} 2^{-km} = \frac{1}{2^{k} - 1}$, et $A_{2} \cap A_{3} = A_{6}$. 
    $$\boxed{\mathbb{P}(A_{k}) = \frac{1}{2^{k} - 1}, \qquad \mathbb{P}(A_{2} \cup A_{3}) = \frac{1}{3} + \frac{1}{7} - \frac{1}{63} = \frac{29}{63}}$$

    **2.** Soit $p$, $q \geqslant 2$ et $m$ leur plus petit commun multiple, de sorte que $A_{p} \cap A_{q} = A_{m}$ et $m \geqslant 2$. L'indépendance s'écrirait $2^{m} - 1 = (2^{p} - 1)(2^{q} - 1)$. Or $2^{m} - 1 \equiv 3 \pmod 4$, alors que $(2^{p} - 1)(2^{q} - 1) \equiv 3 \times 3 \equiv 1 \pmod 4$. 
    $$\boxed{A_{p} \text{ et } A_{q} \text{ ne sont jamais indépendants}}$$

    **3.** Pour la loi zêta du cours, $\mathbb{P}(D_{k}) = k^{-s}$ est une fonction multiplicative de $k$, ce qui rend les $D_{p}$, pour $p$ premier, indépendants. Ici, $\mathbb{P}(A_{k}) = \frac{1}{2^{k} - 1}$ ne vérifie pas $\mathbb{P}(A_{pq}) = \mathbb{P}(A_{p})\mathbb{P}(A_{q})$ : la loi géométrique, qui privilégie fortement les petits entiers, ne respecte pas la structure multiplicative de $\mathbb{N}^{*}$.
- id: "mp-14-24"
  feuille: "f-mp-14"
  numero: 24
  partie: "Espaces probabilisés discrets"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [espaces probabilisés discrets, tribus, ensembles dénombrables]
  noeuds: [p-espace, m-tribus, q-denombrable]
  notions: [espace-probabilise, tribu, denombrable]
  source: "BibM@th, Espaces probabilisés, exercice 25 ; question 3 composée pour la feuille"
  page_enonce: 6
  page_corrige: 11
  enonce: |
    **1.** Soit $\Omega$ un univers fini muni d'une probabilité, et $A_{1}$, …, $A_{n}$ des événements mutuellement indépendants tels que $\mathbb{P}(A_{k}) \in ]0, 1[$ pour tout $k$. Pour chaque choix de $B_{k} \in \{A_{k}, \bar{A}_{k}\}$, montrer que $B_{1} \cap \cdots \cap B_{n} \neq \varnothing$. En déduire que $\operatorname{card}(\Omega) \geqslant 2^{n}$.

    **2.** En déduire qu'il n'existe pas d'univers fini, ni même d'univers dénombrable muni de la tribu de ses parties, portant une suite *infinie* d'événements mutuellement indépendants de probabilité $\frac{1}{2}$. On pourra montrer que chaque singleton serait de probabilité nulle.
  corrige: |
    L'indépendance force l'univers à contenir une issue pour chaque combinaison de résultats, ce qui interdit un univers trop petit.

    **1.** Les $B_{k}$ sont mutuellement indépendants (proposition 8), d'où $\mathbb{P}(B_{1} \cap \cdots \cap B_{n}) = \prod \mathbb{P}(B_{k}) > 0$ : l'intersection n'est pas vide. Deux choix différents diffèrent en un indice $k$, où l'un contient $A_{k}$ et l'autre $\bar{A}_{k}$ : les intersections correspondantes sont disjointes. On obtient ainsi $2^{n}$ parties non vides et deux à deux disjointes de $\Omega$. 
    $$\boxed{\operatorname{card}(\Omega) \geqslant 2^{n}}$$

    **2.** Un univers fini ne peut donc pas porter une infinité d'événements indépendants de probabilité $\frac{1}{2}$. Supposons maintenant $\Omega$ dénombrable, muni de $\mathcal{P}(\Omega)$, et $(A_{n})$ une telle suite. Pour $\omega \in \Omega$ et $n \in \mathbb{N}^{*}$, $\omega$ appartient à l'une des intersections $B_{1} \cap \cdots \cap B_{n}$, de probabilité $2^{-n}$ ; donc $\mathbb{P}(\{\omega\}) \leqslant 2^{-n}$ pour tout $n$, c'est-à-dire $\mathbb{P}(\{\omega\}) = 0$. Mais alors $\mathbb{P}(\Omega) = \sum_{\omega} \mathbb{P}(\{\omega\}) = 0$, ce qui est absurde. 
    $$\boxed{\text{pas d'univers dénombrable portant une suite infinie d'événements indépendants de probabilité } \tfrac{1}{2}}$$
     C'est la raison pour laquelle le théorème 7 du cours est admis : il demande un univers non dénombrable.
- id: "mp-14-25"
  feuille: "f-mp-14"
  numero: 25
  partie: "Variables aléatoires discrètes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [variables aléatoires discrètes]
  noeuds: [p-variables]
  notions: [variable-aleatoire, loi-variable]
  source: "Feuille d'exercices #10 (Prost), exercice 17"
  page_enonce: 6
  page_corrige: 11
  enonce: |
    Dans chacune des expériences suivantes, reconnaître la loi de la variable $X$.

    **1.** On range au hasard $20$ objets dans $3$ tiroirs ; $X$ est le nombre d'objets dans le premier tiroir.

    **2.** Un enclos contient $15$ lamas, $15$ dromadaires et $15$ chameaux ; on en sort un animal au hasard, et $X$ est son nombre de bosses.

    **3.** On tire avec remise les cartes d'un jeu de $32$ ; $X$ est le rang d'apparition de la première dame.

    **4.** On retourne une à une les cartes d'un jeu de $32$ bien battu, jusqu'à l'apparition de l'as de cœur ; $X$ est le nombre de cartes retournées.

    **5.** $X$ est le nombre de garçons dans une famille de $3$ enfants, les naissances étant indépendantes et équiprobables.

    **6.** $1\,\%$ des trèfles ont quatre feuilles ; on en cueille $100$, et $X$ est le nombre de trèfles à quatre feuilles. Par quelle loi peut-on approcher celle de $X$ ? Comparer les valeurs de $\mathbb{P}(X = 0)$.
  corrige: |
    On reconnaît une loi binomiale dans un nombre de succès en un nombre fixé d'épreuves indépendantes, une loi géométrique dans un rang de premier succès, et une loi uniforme lorsque les issues sont équiprobables. 
    $$\boxed{\begin{array}{ll} \text{1. } \mathcal{B}(20, \frac{1}{3}) & \text{2. loi uniforme sur } \{0, 1, 2\} \\[1mm] \text{3. } \mathcal{G}(\frac{1}{8}) & \text{4. loi uniforme sur } \llbracket 1\,,32 \rrbracket \\[1mm] \text{5. } \mathcal{B}(3, \frac{1}{2}) & \text{6. } \mathcal{B}(100, \frac{1}{100}) \approx \mathcal{P}(1) \end{array}}$$
     Dans la question 4, l'as de cœur occupe une position uniforme dans le paquet ; ce n'est pas une loi géométrique, car les cartes ne sont pas remises. Dans la question 6, $\mathbb{P}(X = 0) = 0{,}99^{100} \approx 0{,}3660$, contre $\mathrm{e}^{-1} \approx 0{,}3679$ pour la loi de Poisson : l'approximation du théorème 9 est excellente.
- id: "mp-14-26"
  feuille: "f-mp-14"
  numero: 26
  partie: "Variables aléatoires discrètes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [variables aléatoires discrètes]
  noeuds: [p-variables]
  notions: [variable-aleatoire, loi-variable]
  source: "Feuille d'exercices #10 (Prost), exercice 18"
  page_enonce: 7
  page_corrige: 12
  enonce: |
    *Marche aléatoire.* Soit $X_{1}$, …, $X_{n}$ des variables indépendantes, à valeurs dans $\{-1, 1\}$, telles que $\mathbb{P}(X_{k} = 1) = \frac{1}{2}$ pour tout $k$. On pose $S_{n} = X_{1} + \cdots + X_{n}$.

    **1.** Déterminer la loi de $S_{n}$. On pourra exprimer $S_{n}$ à l'aide d'une variable binomiale.

    **2.** Calculer $\mathbb{P}(S_{2n} = 0)$, et en donner un équivalent à l'aide de la formule de Stirling.
  corrige: |
    On se ramène à une loi binomiale en comptant les pas vers le haut.

    **1.** Les variables $Y_{k} = \frac{X_{k} + 1}{2}$ sont indépendantes, de loi $\mathcal{B}(\frac{1}{2})$, et 
    $$S_{n} = 2B_{n} - n, \qquad B_{n} = Y_{1} + \cdots + Y_{n} \sim \mathcal{B}(n, \tfrac{1}{2}).$$

    $$\boxed{\forall k \in \llbracket 0\,,n \rrbracket, \quad \mathbb{P}(S_{n} = 2k - n) = \frac{1}{2^{n}}\binom{n}{k}}$$

    **2.** On a $S_{2n} = 0$ si et seulement si $B_{2n} = n$, et la formule de Stirling donne l'équivalent. 
    $$\boxed{\mathbb{P}(S_{2n} = 0) = \frac{1}{4^{n}}\binom{2n}{n} \underset{n \to +\infty}{\sim} \frac{1}{\sqrt{\pi n}}}$$
     Le retour à l'origine devient de plus en plus rare, mais lentement ; l'exercice 43 exploite ce calcul.
- id: "mp-14-27"
  feuille: "f-mp-14"
  numero: 27
  partie: "Variables aléatoires discrètes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [variables aléatoires discrètes]
  noeuds: [p-variables]
  notions: [variable-aleatoire, loi-variable]
  source: "Feuille d'exercices #10 (Prost), exercice 33 (sans espérance)"
  page_enonce: 7
  page_corrige: 12
  enonce: |
    On dispose de $n$ boîtes numérotées de $1$ à $n$ ; la boîte numéro $k$ contient $k$ boules numérotées de $1$ à $k$. On choisit une boîte au hasard, puis une boule dans cette boîte. Soit $X$ le numéro de la boîte et $Y$ celui de la boule.

    **1.** Déterminer la loi du couple $(X, Y)$, puis calculer $\mathbb{P}(X = Y)$ et en donner un équivalent.

    **2.** Déterminer la loi de $Y$. Les variables $X$ et $Y$ sont-elles indépendantes ?
  corrige: |
    On conditionne par la boîte choisie : la loi conditionnelle de $Y$ sachant $(X = k)$ est uniforme sur $\llbracket 1\,,k \rrbracket$.

    **1.** Pour $1 \leqslant j \leqslant k \leqslant n$, $\mathbb{P}(X = k, Y = j) = \frac{1}{n}\cdot\frac{1}{k}$, et $0$ si $j > k$. Avec $H_{n} = \sum_{k = 1}^{n} \frac{1}{k}$ : 
    $$\boxed{\mathbb{P}(X = k, Y = j) = \frac{1}{nk} \ (j \leqslant k), \qquad \mathbb{P}(X = Y) = \frac{H_{n}}{n} \underset{n \to +\infty}{\sim} \frac{\ln n}{n}}$$

    **2.** La proposition 11 donne la loi de $Y$ en sommant sur $k$ : 
    $$\boxed{\mathbb{P}(Y = j) = \frac{1}{n}\sum_{k = j}^{n} \frac{1}{k} = \frac{H_{n} - H_{j - 1}}{n}}$$
     Les petites valeurs de $Y$ sont plus probables. Pour $n \geqslant 2$, on a $\mathbb{P}(X = 1, Y = 2) = 0$, alors que $\mathbb{P}(X = 1)$ et $\mathbb{P}(Y = 2)$ sont non nulles : $X$ et $Y$ ne sont pas indépendantes.
