  notions: []
  page_enonce: 11
  page_corrige: 21
  enonce: |
    *Le collectionneur de vignettes.* Une collection comporte $n$ vignettes différentes. On achète des vignettes une par une ; chacune est uniformément répartie parmi les $n$ possibles, indépendamment des autres. On note $T$ le nombre d'achats nécessaires pour compléter la collection, et, pour $m \in \mathbb{N}$ et $i \in \llbracket 1\,,n \rrbracket$, $E_{i, m}$ l'événement « la vignette $i$ n'a pas été obtenue lors des $m$ premiers achats ».

    **1.** Montrer que $T$ est presque sûrement fini, et que $\mathbb{P}(T > m) \leqslant n\Big(1 - \dfrac{1}{n}\Big)^{m} \leqslant n\,\mathrm{e}^{-m/n}$.

    **2.** Soit $c$ un réel. Montrer que $\mathbb{P}(T > n\ln n + cn) \leqslant \mathrm{e}^{-c}$. Combien d'achats suffisent pour compléter une collection de $100$ vignettes avec une probabilité d'au moins $0{,}99$ ?

    **3.** À l'aide de la formule du crible, montrer que $\mathbb{P}(T > m) = \sum_{k = 1}^{n} (-1)^{k + 1}\dbinom{n}{k}\Big(1 - \dfrac{k}{n}\Big)^{m}$.

    **4.** Soit $c$ réel et $m_{n} = \lfloor n\ln n + cn \rfloor$. Montrer que $\mathbb{P}(T \leqslant m_{n}) \to \exp(-\mathrm{e}^{-c})$ quand $n \to +\infty$. On utilisera le théorème de convergence dominée du chapitre 13, appliqué aux fonctions en escalier $t \mapsto u_{\lfloor t \rfloor, n}$ associées aux termes $u_{k, n}$ de la somme précédente.
  corrige: |
    Une majoration grossière par la sous-additivité donne déjà le bon ordre de grandeur, $n\ln n$ ; la formule du crible et la convergence dominée donnent la loi limite exacte.

    **1.** On a $(T > m) = \bigcup_{i = 1}^{n} E_{i, m}$, et $\mathbb{P}(E_{i, m}) = \big(1 - \frac{1}{n}\big)^{m}$ par indépendance des achats. La sous-additivité et l'inégalité $1 - x \leqslant \mathrm{e}^{-x}$ donnent la majoration. Elle tend vers $0$ quand $m \to +\infty$, et $(T = +\infty) = \bigcap_{m} (T > m)$ est négligeable par continuité décroissante. 
    $$\boxed{\mathbb{P}(T > m) \leqslant n\Big(1 - \frac{1}{n}\Big)^{m} \leqslant n\,\mathrm{e}^{-m/n}, \qquad T < +\infty \text{ presque sûrement}}$$

    **2.** Pour $m \geqslant n\ln n + cn$, $n\,\mathrm{e}^{-m/n} \leqslant n\,\mathrm{e}^{-\ln n - c} = \mathrm{e}^{-c}$. Pour $n = 100$ et $\mathrm{e}^{-c} = 0{,}01$, il suffit que $m \geqslant 100\ln 100 + 100\ln 100 \approx 921{,}03$. 
    $$\boxed{\mathbb{P}(T > n\ln n + cn) \leqslant \mathrm{e}^{-c}, \qquad 922 \text{ achats suffisent pour } n = 100}$$

    **3.** Pour une partie $I$ de $\llbracket 1\,,n \rrbracket$ à $k$ éléments, $\bigcap_{i \in I} E_{i, m}$ est l'événement « les $m$ premiers achats évitent les vignettes de $I$ », de probabilité $\big(1 - \frac{k}{n}\big)^{m}$. La formule du crible (chapitre 21 de MPSI) donne : 
    $$\boxed{\mathbb{P}(T > m) = \sum_{k = 1}^{n} (-1)^{k + 1}\binom{n}{k}\Big(1 - \frac{k}{n}\Big)^{m}}$$

    **4.** Notons $u_{k, n} = (-1)^{k + 1}\binom{n}{k}\big(1 - \frac{k}{n}\big)^{m_{n}}$ pour $k \leqslant n$, et $u_{k, n} = 0$ pour $k > n$.

    Limite de chaque terme. Pour $k$ fixé, $\binom{n}{k} \sim \frac{n^{k}}{k!}$, et 
    $$m_{n}\ln\Big(1 - \frac{k}{n}\Big) = -\frac{km_{n}}{n} + O\Big(\frac{m_{n}}{n^{2}}\Big) = -k\ln n - kc + o(1),$$
     puisque $\frac{m_{n}}{n} = \ln n + c + O\big(\frac{1}{n}\big)$ et $\frac{m_{n}}{n^{2}} \to 0$. Ainsi $u_{k, n} \to (-1)^{k + 1}\frac{\mathrm{e}^{-kc}}{k!}$.

    Domination. Pour $k \leqslant n$, $\binom{n}{k} \leqslant \frac{n^{k}}{k!}$ et $\big(1 - \frac{k}{n}\big)^{m_{n}} \leqslant \mathrm{e}^{-km_{n}/n} \leqslant \mathrm{e}^{-k(\ln n + c - 1/n)} \leqslant \mathrm{e}\cdot\frac{\mathrm{e}^{-kc}}{n^{k}}$, d'où $|u_{k, n}| \leqslant \mathrm{e}\cdot\frac{\mathrm{e}^{-kc}}{k!}$, terme général d'une série convergente indépendant de $n$.

    Passage à la limite. Les fonctions en escalier $f_{n} : t \mapsto u_{\lfloor t\rfloor, n}$ sur $[1, +\infty[$ convergent simplement vers $t \mapsto (-1)^{\lfloor t\rfloor + 1}\frac{\mathrm{e}^{-\lfloor t\rfloor c}}{\lfloor t\rfloor!}$, et elles sont dominées par la fonction en escalier $t \mapsto \mathrm{e}\cdot\frac{\mathrm{e}^{-\lfloor t\rfloor c}}{\lfloor t\rfloor!}$, intégrable sur $[1, +\infty[$ puisque son intégrale est la somme d'une série convergente. Le théorème 1 du chapitre 13 donne $\sum_{k \geqslant 1} u_{k, n} = \int_{1}^{+\infty} f_{n} \to \sum_{k \geqslant 1} (-1)^{k + 1}\frac{\mathrm{e}^{-kc}}{k!} = 1 - \exp(-\mathrm{e}^{-c})$. 
    $$\boxed{\mathbb{P}(T \leqslant m_{n}) \xrightarrow[n \to +\infty]{} \exp\big(-\mathrm{e}^{-c}\big)}$$
     La loi limite de $\frac{T - n\ln n}{n}$ est la *loi de Gumbel*, résultat d'Erdős et Rényi (1961). Pour $n = 100$ et $c = \ln 100$, elle donne $\mathbb{P}(T > 921) \approx 1 - \exp(-0{,}01) \approx 0{,}00995$ : la majoration de la question 2 est presque optimale.

