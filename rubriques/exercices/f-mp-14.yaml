  source: "Feuille d'exercices #10 (Prost), exercice 5"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    On dispose de deux pièces : la pièce $A$ donne face avec la probabilité $\frac{1}{2}$, la pièce $B$ avec la probabilité $\frac{2}{3}$. On choisit une pièce au hasard et on la lance. Si l'on obtient face, on garde la pièce pour le lancer suivant ; sinon, on change de pièce.

    **1.** Calculer la probabilité $a_{n}$ de jouer avec la pièce $A$ au $n$-ième lancer.

    **2.** En déduire la probabilité d'obtenir face au $n$-ième lancer, et sa limite.
  corrige: |
    On conditionne par la pièce utilisée au lancer $n$, ce qui donne une suite arithmético-géométrique.

    **1.** On joue avec $A$ au lancer $n + 1$ si l'on a joué avec $A$ et obtenu face, ou avec $B$ et obtenu pile. La formule des probabilités totales donne $a_{n + 1} = \frac{1}{2}a_{n} + \frac{1}{3}(1 - a_{n}) = \frac{1}{6}a_{n} + \frac{1}{3}$, avec $a_{1} = \frac{1}{2}$. Le point fixe vaut $\frac{2}{5}$, d'où : 
    $$\boxed{a_{n} = \frac{2}{5} + \frac{1}{10}\Big(\frac{1}{6}\Big)^{n - 1}}$$

    **2.** La probabilité d'obtenir face au $n$-ième lancer vaut $\frac{1}{2}a_{n} + \frac{2}{3}(1 - a_{n}) = \frac{2}{3} - \frac{a_{n}}{6}$. 
    $$\boxed{\mathbb{P}(\text{face au } n\text{-ième lancer}) = \frac{3}{5} - \frac{1}{60}\Big(\frac{1}{6}\Big)^{n - 1} \xrightarrow[n \to +\infty]{} \frac{3}{5}}$$
     La pièce $B$, plus favorable à face, est conservée plus souvent : à long terme, on l'utilise dans $60\,\%$ des lancers.
- id: "mp-14-12"
