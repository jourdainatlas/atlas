  noeuds: [p-independance, mart-markov]
  notions: [probabilite-conditionnelle, chaine-markov]
  source: "BibM@th, Espaces probabilisés, exercice 29"
  page_enonce: 11
  page_corrige: 20
  enonce: |
    *Perspective : une chaîne de Markov.* Un pion se déplace sur les sommets $A$, $B$, $C$ d'un triangle. Il part de $A$ à l'instant $0$. À chaque instant, s'il est en $A$, il va en $A$, $B$ ou $C$ avec la probabilité $\frac{1}{3}$ chacun ; s'il est en $B$, il y reste ; s'il est en $C$, il va en $A$, $B$ ou $C$ avec les probabilités $\frac{1}{12}$, $\frac{7}{12}$ et $\frac{1}{3}$. On note $a_{n}$, $b_{n}$, $c_{n}$ les probabilités d'être en $A$, $B$, $C$ à l'instant $n$, et $U_{n} = (a_{n}, b_{n}, c_{n})^{T}$.

    **1.** À l'aide de la formule des probabilités totales, déterminer une matrice $M$ telle que $U_{n + 1} = MU_{n}$ pour tout $n$.

    **2.** Montrer que $M$ est diagonalisable, et la diagonaliser.

    **3.** En déduire $a_{n}$, $b_{n}$ et $c_{n}$, puis leurs limites. Interpréter.

    **4.** Montrer que le pion atteint presque sûrement le sommet $B$, et déterminer la loi de l'instant où il l'atteint pour la première fois.
  corrige: |
    L'évolution des probabilités est linéaire : $U_{n} = M^{n}U_{0}$, et la diagonalisation de $M$ donne tout. Le sommet $B$ est absorbant.

    **1.** La formule des probabilités totales, avec le système complet des positions à l'instant $n$, donne, colonne par colonne selon la position de départ : 
    $$\boxed{M = \begin{pmatrix} \frac{1}{3} & 0 & \frac{1}{12} \\ \frac{1}{3} & 1 & \frac{7}{12} \\ \frac{1}{3} & 0 & \frac{1}{3} \end{pmatrix}}$$
     Chaque colonne a pour somme $1$ : c'est une matrice stochastique.

    **2.** En développant par rapport à la deuxième colonne, 
    $$\chi_{M}(x) = (x - 1)\Big(\Big(x - \frac{1}{3}\Big)^{2} - \frac{1}{36}\Big) = (x - 1)\Big(x - \frac{1}{2}\Big)\Big(x - \frac{1}{6}\Big) :$$
     trois valeurs propres distinctes, donc $M$ est diagonalisable. Des vecteurs propres associés à $1$, $\frac{1}{2}$ et $\frac{1}{6}$ sont $(0, 1, 0)$, $(1, -3, 2)$ et $(1, 1, -2)$. 
    $$\boxed{M = PDP^{-1}, \qquad P = \begin{pmatrix} 0 & 1 & 1 \\ 1 & -3 & 1 \\ 0 & 2 & -2 \end{pmatrix}, \qquad D = \operatorname{diag}\Big(1, \frac{1}{2}, \frac{1}{6}\Big)}$$

    **3.** On décompose $U_{0} = (1, 0, 0)^{T} = (0, 1, 0)^{T} + \frac{1}{2}(1, -3, 2)^{T} + \frac{1}{2}(1, 1, -2)^{T}$, d'où : 
    $$\boxed{a_{n} = \frac{1}{2^{n + 1}} + \frac{1}{2 \cdot 6^{n}}, \qquad b_{n} = 1 - \frac{3}{2^{n + 1}} + \frac{1}{2 \cdot 6^{n}}, \qquad c_{n} = \frac{1}{2^{n}} - \frac{1}{6^{n}}}$$
     On vérifie que $a_{1} = b_{1} = c_{1} = \frac{1}{3}$. Quand $n \to +\infty$, $a_{n}$ et $c_{n}$ tendent vers $0$ et $b_{n}$ vers $1$ : le pion finit en $B$, à une vitesse géométrique de raison $\frac{1}{2}$, la plus grande valeur propre différente de $1$.

    **4.** Soit $\tau$ l'instant d'arrivée en $B$. Comme $B$ est absorbant, $(\tau \leqslant n)$ est l'événement « le pion est en $B$ à l'instant $n$ », de probabilité $b_{n} \to 1$ : $\tau$ est presque sûrement fini, par continuité croissante. 
    $$\boxed{\mathbb{P}(\tau = n) = b_{n} - b_{n - 1} = \frac{3}{2^{n + 1}} - \frac{5}{2 \cdot 6^{n}}, \qquad n \geqslant 1}$$
     On vérifie que $\mathbb{P}(\tau = 1) = \frac{3}{4} - \frac{5}{12} = \frac{1}{3}$ et que la somme de ces probabilités vaut $\frac{3}{2} - \frac{1}{2} = 1$.
- id: "mp-14-46"
