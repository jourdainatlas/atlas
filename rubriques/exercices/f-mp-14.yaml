  page_enonce: 4
  page_corrige: 7
  enonce: |
    Une urne contient initialement $a$ boules blanches et $b$ boules noires, avec $a$, $b \geqslant 1$. Après chaque tirage, la boule tirée est remise dans l'urne avec $c$ boules supplémentaires de la même couleur, où $c \in \mathbb{N}^{*}$.

    **1.** Pour $n \in \mathbb{N}^{*}$, déterminer la probabilité $p_{n}$ que la première boule blanche soit obtenue au $n$-ième tirage.

    **2.** On pose $a_{0} = 1$ et $a_{n} = \prod_{k = 0}^{n - 1} \frac{b + kc}{a + b + kc}$. Montrer que $p_{n} = a_{n - 1} - a_{n}$ pour $n \geqslant 1$.

    **3.** Calculer $\lim a_{n}$, et en déduire $\sum_{n \geqslant 1} p_{n}$. Interpréter.
  corrige: |
    C'est l'urne de Pólya : chaque tirage renforce la couleur tirée. La première boule blanche arrive pourtant presque sûrement.

    **1.** Si les $n - 1$ premiers tirages ont donné des noires, l'urne contient $a$ blanches et $b + (n - 1)c$ noires. La formule des probabilités composées donne 
    $$\boxed{p_{n} = \Big(\prod_{k = 0}^{n - 2} \frac{b + kc}{a + b + kc}\Big)\frac{a}{a + b + (n - 1)c}}$$

    **2.** On a $a_{n} = a_{n - 1}\,\frac{b + (n - 1)c}{a + b + (n - 1)c}$, d'où 
    $$a_{n - 1} - a_{n} = a_{n - 1}\Big(1 - \frac{b + (n - 1)c}{a + b + (n - 1)c}\Big) = a_{n - 1}\,\frac{a}{a + b + (n - 1)c} = p_{n}.$$

    **3.** On a $\ln a_{n} = \sum_{k = 0}^{n - 1} \ln\Big(1 - \frac{a}{a + b + kc}\Big)$, et le terme général est équivalent à $-\frac{a}{kc}$, terme d'une série divergente à termes négatifs : $\ln a_{n} \to -\infty$. La somme est télescopique. 
    $$\boxed{\lim a_{n} = 0, \qquad \sum_{n = 1}^{+\infty} p_{n} = a_{0} - \lim a_{n} = 1}$$
     L'événement « on ne tire jamais de boule blanche » est négligeable, alors que sa probabilité décroît beaucoup plus lentement que dans un tirage avec remise simple : $a_{n}$ est de l'ordre de $n^{-a/c}$.
