  enonce: |
    Soit $X_{1}$, …, $X_{n}$ des variables indépendantes de loi $\mathcal{G}(p)$.

    **1.** Calculer $\mathbb{P}(X_{1} \geqslant X_{2})$, puis $\mathbb{P}(X_{1} = X_{2})$.

    **2.** Déterminer la loi de $Z = \min(X_{1}, \dots, X_{n})$, en calculant $\mathbb{P}(Z > k)$. Interpréter.

    **3.** Déterminer la loi de $M = \max(X_{1}, \dots, X_{n})$.

    **4.** Si $X \sim \mathcal{G}(p)$ et $Y \sim \mathcal{G}(p')$ sont indépendantes, calculer $\mathbb{P}(Y > X)$.
  corrige: |
    Pour une loi géométrique, ce sont les probabilités $\mathbb{P}(X > k) = q^{k}$ qui se calculent le plus simplement ; les minimum et maximum s'en déduisent par indépendance.

    **1.** Par indépendance, puis par symétrie : 
    $$\mathbb{P}(X_{1} = X_{2}) = \sum_{k \geqslant 1} p^{2}q^{2k - 2} = \frac{p}{1 + q}, \qquad \mathbb{P}(X_{1} > X_{2}) = \mathbb{P}(X_{1} < X_{2}) = \frac{1}{2}\Big(1 - \frac{p}{1 + q}\Big) = \frac{q}{1 + q}.$$

    $$\boxed{\mathbb{P}(X_{1} = X_{2}) = \frac{p}{1 + q}, \qquad \mathbb{P}(X_{1} \geqslant X_{2}) = \frac{1}{1 + q} = \frac{1}{2 - p}}$$

    **2.** Par indépendance, $\mathbb{P}(Z > k) = \prod_{i} \mathbb{P}(X_{i} > k) = (q^{n})^{k}$. 
    $$\boxed{Z \sim \mathcal{G}(1 - q^{n})}$$
     Le minimum est le rang du premier succès lorsque l'on mène $n$ suites d'épreuves en parallèle : une « épreuve » groupée échoue si les $n$ échouent, avec la probabilité $q^{n}$.

    **3.** Par indépendance, $\mathbb{P}(M \leqslant k) = (1 - q^{k})^{n}$. 
    $$\boxed{\mathbb{P}(M = k) = (1 - q^{k})^{n} - (1 - q^{k - 1})^{n}, \qquad k \geqslant 1}$$

    **4.** Par la formule des probabilités totales, avec $q' = 1 - p'$ : 
    $$\boxed{\mathbb{P}(Y > X) = \sum_{k = 1}^{+\infty} pq^{k - 1}q'^{k} = \frac{pq'}{1 - qq'}}$$
     Pour $p = p'$, on retrouve $\frac{q}{1 + q}$.
