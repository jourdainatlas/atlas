  enonce: |
    *La ruine du joueur.* Un joueur possède $k$ euros, avec $0 \leqslant k \leqslant N$. À chaque partie, il gagne un euro avec la probabilité $p \in ]0, 1[$ et en perd un avec la probabilité $q$, les parties étant indépendantes. Il s'arrête lorsqu'il est ruiné ou qu'il possède $N$ euros. On note $p_{k}$ la probabilité qu'il soit ruiné.

    **1.** Déterminer $p_{0}$ et $p_{N}$, et montrer que $p_{k} = p\,p_{k + 1} + q\,p_{k - 1}$ pour $1 \leqslant k \leqslant N - 1$.

    **2.** En déduire $p_{k}$ pour tout $k$, en distinguant les cas $p \neq \frac{1}{2}$ et $p = \frac{1}{2}$.

    **3.** Un joueur dispose de $10$ euros face à un casino qui en possède $990$, avec $p = 0{,}49$. Calculer sa probabilité de ruine.
  corrige: |
    On conditionne par le résultat de la première partie, ce qui donne une récurrence linéaire d'ordre $2$ avec deux conditions aux bords.

    **1.** Avec $0$ euro, le joueur est ruiné ; avec $N$ euros, il s'est arrêté. Pour $1 \leqslant k \leqslant N - 1$, après la première partie, il possède $k + 1$ ou $k - 1$ euros, et la suite du jeu est indépendante de cette partie. 
    $$\boxed{p_{0} = 1, \qquad p_{N} = 0, \qquad p_{k} = p\,p_{k + 1} + q\,p_{k - 1}}$$

    **2.** L'équation caractéristique $pr^{2} - r + q = 0$ a pour racines $1$ et $\rho = \frac{q}{p}$. Si $p \neq \frac{1}{2}$, ces racines sont distinctes, et les conditions aux bords donnent la première formule ; si $p = \frac{1}{2}$, la racine double $1$ donne $p_{k} = \alpha + \beta k$. 
    $$\boxed{p_{k} = \frac{\rho^{k} - \rho^{N}}{1 - \rho^{N}} \quad (p \neq \tfrac{1}{2}), \qquad p_{k} = 1 - \frac{k}{N} \quad (p = \tfrac{1}{2})}$$

    **3.** Pour $k = 10$, $N = 1000$ et $\rho = \frac{51}{49}$, on a $p_{10} = 1 - \frac{\rho^{10} - 1}{\rho^{1000} - 1}$, et $\rho^{1000} \approx 2{,}3 \cdot 10^{17}$. 
    $$\boxed{p_{10} \approx 1 - 2 \cdot 10^{-18}}$$
     Avec un léger désavantage à chaque partie, la ruine est quasi certaine. Même pour $p = \frac{1}{2}$, elle aurait une probabilité $0{,}99$.
