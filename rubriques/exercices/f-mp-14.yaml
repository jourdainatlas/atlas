  enonce: |
    *Fonctions de répartition.*

    **1.** Soit $X \sim \mathcal{G}(p)$. Déterminer la fonction $x \mapsto \mathbb{P}(X \leqslant x)$ sur $\mathbb{R}$, et retrouver l'absence de mémoire.

    **2.** Soit $Y \sim \mathcal{P}(\lambda)$. Montrer que, pour tout $n \in \mathbb{N}$, 
    $$\mathbb{P}(Y \leqslant n) = \frac{1}{n!}\int_{\lambda}^{+\infty} \mathrm{e}^{-x}x^{n}\,\mathrm{d} x.$$

    **3.** En déduire que $\lambda \mapsto \mathbb{P}(Y \leqslant n)$ est décroissante, et interpréter.
  corrige: |
    La fonction de répartition d'une variable entière est une fonction en escalier ; pour la loi de Poisson, elle s'exprime par une intégrale apparentée à la fonction $\Gamma$.

    **1.** On a $\mathbb{P}(X \leqslant x) = 0$ pour $x < 1$, et $\mathbb{P}(X \leqslant x) = 1 - \mathbb{P}(X > \lfloor x\rfloor) = 1 - q^{\lfloor x\rfloor}$ pour $x \geqslant 1$. 
    $$\boxed{\mathbb{P}(X \leqslant x) = 1 - q^{\lfloor x\rfloor} \ (x \geqslant 1), \qquad \mathbb{P}(X \leqslant x) = 0 \ (x < 1)}$$
     Alors $\mathbb{P}_{(X > n)}(X > n + k) = \frac{1 - \mathbb{P}(X \leqslant n + k)}{1 - \mathbb{P}(X \leqslant n)} = q^{k} = \mathbb{P}(X > k)$.

    **2.** Notons $I_{n} = \frac{1}{n!}\int_{\lambda}^{+\infty} \mathrm{e}^{-x}x^{n}\,\mathrm{d} x$, intégrale convergente. Pour $n \geqslant 1$, une intégration par parties donne $I_{n} = \mathrm{e}^{-\lambda}\frac{\lambda^{n}}{n!} + I_{n - 1}$, et $I_{0} = \mathrm{e}^{-\lambda}$. Par récurrence : 
    $$\boxed{I_{n} = \sum_{k = 0}^{n} \mathrm{e}^{-\lambda}\frac{\lambda^{k}}{k!} = \mathbb{P}(Y \leqslant n)}$$

    **3.** Par le théorème fondamental de l'analyse, $\frac{\mathrm{d}}{\mathrm{d}\lambda}\mathbb{P}(Y \leqslant n) = -\mathrm{e}^{-\lambda}\frac{\lambda^{n}}{n!} < 0$. 
    $$\boxed{\lambda \mapsto \mathbb{P}(Y \leqslant n) \text{ est strictement décroissante}}$$
     Plus le nombre moyen d'événements est grand, moins il est probable d'en observer peu. Pour $\lambda$ entier et $n = \lambda$, la formule relie la loi de Poisson à la fonction $\Gamma$ incomplète du chapitre 13.
