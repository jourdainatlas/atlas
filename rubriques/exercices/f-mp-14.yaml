  page_corrige: 6
  enonce: |
    On lance deux dés équilibrés, jusqu'à ce qu'une somme égale à $5$ ou à $7$ apparaisse.

    **1.** Soit $E_{n}$ l'événement « la somme $5$ apparaît au $n$-ième double lancer, et ni $5$ ni $7$ n'est apparu auparavant ». Calculer $\mathbb{P}(E_{n})$.

    **2.** Quelle est la probabilité que l'on s'arrête sur une somme de $5$ ? sur une somme de $7$ ? Quelle est la probabilité que le jeu ne s'arrête jamais ?
  corrige: |
    Sur $36$ résultats équiprobables, $4$ donnent la somme $5$ et $6$ la somme $7$ ; les autres, au nombre de $26$, font continuer le jeu.

    **1.** Par indépendance des doubles lancers : 
    $$\boxed{\mathbb{P}(E_{n}) = \Big(\frac{26}{36}\Big)^{n - 1}\frac{4}{36} = \frac{1}{9}\Big(\frac{13}{18}\Big)^{n - 1}}$$

    **2.** Les $E_{n}$ sont deux à deux incompatibles, et leur réunion est l'événement « on s'arrête sur $5$ » : sa probabilité vaut $\frac{1}{9}\cdot\frac{1}{1 - 13/18} = \frac{2}{5}$. De même, on s'arrête sur $7$ avec la probabilité $\frac{6/36}{10/36} = \frac{3}{5}$. 
    $$\boxed{\mathbb{P}(\text{arrêt sur } 5) = \frac{2}{5}, \qquad \mathbb{P}(\text{arrêt sur } 7) = \frac{3}{5}, \qquad \mathbb{P}(\text{le jeu ne s'arrête pas}) = 0}$$
     Tout se passe comme si l'on ne regardait que les lancers utiles : la probabilité de s'arrêter sur $5$ est $\frac{4}{4 + 6}$.
- id: "mp-14-13"
