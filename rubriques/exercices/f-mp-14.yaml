  notions: [loi-variable]
  source: "Feuille d'exercices #10 (Prost), exercice 27 ; BibM@th, Variables aléatoires discrètes, exercice 9"
  page_enonce: 9
  page_corrige: 17
  enonce: |
    Soit $X \sim \mathcal{P}(\lambda)$ et $Y \sim \mathcal{P}(\mu)$ indépendantes.

    **1.** Déterminer la loi conditionnelle de $X$ sachant $(X + Y = n)$.

    **2.** *Mutualisation.* Dix hôpitaux reçoivent chacun un nombre de patients par jour qui suit la loi $\mathcal{P}(8)$, indépendamment les uns des autres, et chacun dispose de $10$ lits. Calculer la probabilité qu'un hôpital donné soit saturé, puis qu'au moins un hôpital le soit. On regroupe les dix hôpitaux en un seul de $100$ lits : quelle est la probabilité de saturation ? On donnera des valeurs numériques.
  corrige: |
    La première question est un calcul de loi conditionnelle ; la seconde montre l'intérêt pratique de la proposition 14 du cours.

    **1.** Pour $0 \leqslant k \leqslant n$, par indépendance et la proposition 14 : 
    $$\mathbb{P}_{(X + Y = n)}(X = k) = \frac{\mathbb{P}(X = k)\mathbb{P}(Y = n - k)}{\mathbb{P}(X + Y = n)} = \frac{\mathrm{e}^{-\lambda}\frac{\lambda^{k}}{k!}\,\mathrm{e}^{-\mu}\frac{\mu^{n - k}}{(n - k)!}}{\mathrm{e}^{-(\lambda + \mu)}\frac{(\lambda + \mu)^{n}}{n!}} = \binom{n}{k}\Big(\frac{\lambda}{\lambda + \mu}\Big)^{k}\Big(\frac{\mu}{\lambda + \mu}\Big)^{n - k}.$$

    $$\boxed{\text{sachant } (X + Y = n), \ X \sim \mathcal{B}\Big(n, \frac{\lambda}{\lambda + \mu}\Big)}$$

    **2.** Un hôpital est saturé si $X \geqslant 11$, avec $X \sim \mathcal{P}(8)$ ; au moins un hôpital l'est avec la probabilité $1 - (1 - \mathbb{P}(X \geqslant 11))^{10}$. Après regroupement, le nombre total de patients suit la loi $\mathcal{P}(80)$ (proposition 14), et la saturation correspond à $Y \geqslant 101$. 
    $$\boxed{\mathbb{P}(X \geqslant 11) \approx 0{,}184, \qquad \mathbb{P}(\text{au moins une saturation}) \approx 0{,}869, \qquad \mathbb{P}(Y \geqslant 101) \approx 0{,}013}$$
     Mettre les lits en commun réduit le risque de saturation d'un facteur proche de $70$ : les fluctuations d'une loi de Poisson de paramètre $\lambda$ sont de l'ordre de $\sqrt{\lambda}$, et croissent donc moins vite que $\lambda$, comme le chapitre 15 permettra de le préciser.
- id: "mp-14-39"
  feuille: "f-mp-14"
  numero: 39
  partie: "Lois usuelles"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [lois usuelles]
  noeuds: [p-variables, p-poisson-exp, pol-binome]
  notions: [loi-variable, coefficient-binomial]
  source: "Feuille d'exercices #10 (Prost), exercices 19 et 20 ; BibM@th, Variables aléatoires discrètes, exercices 10, 12 et 28"
  page_enonce: 9
  page_corrige: 17
  enonce: |
    *Amincissement d'une loi de Poisson.* Soit $(X_{n})_{n \geqslant 1}$ une suite de variables indépendantes de loi $\mathcal{B}(p)$, et $N$ une variable à valeurs dans $\mathbb{N}$, indépendante de la suite $(X_{n})$. On pose $S = X_{1} + \cdots + X_{N}$, avec $S = 0$ si $N = 0$, et $T = N - S$.

    **1.** Montrer que $S$ et $T$ sont des variables aléatoires discrètes, et que 
    $$\mathbb{P}(S = i, T = j) = \mathbb{P}(N = i + j)\binom{i + j}{i}p^{i}q^{j}.$$

    **2.** On suppose que $N \sim \mathcal{P}(\lambda)$. Montrer que $S$ et $T$ suivent des lois de Poisson, que l'on précisera, et qu'elles sont indépendantes. C'est le résultat annoncé dans le cours.

    **3.** On suppose que $S$ et $T$ sont indépendantes et que $\mathbb{P}(N = 0) < 1$. Montrer que $\mathbb{P}(N = i + j)\,(i + j)!$ s'écrit $a_{i}b_{j}$, que la suite $(a_{i})$ est géométrique, et en déduire que $N$ suit une loi de Poisson.
  corrige: |
    La loi conjointe de $(S, T)$ se calcule en conditionnant par $N$. Pour une loi de Poisson, elle se factorise ; la réciproque montre que c'est la seule loi pour laquelle cela se produit.

    **1.** Pour $n \in \mathbb{N}$, $(S = i, T = j)$ équivaut à $(N = i + j) \cap (X_{1} + \cdots + X_{i + j} = i)$. Ces deux événements sont indépendants, car $N$ est indépendante de la suite $(X_{n})$, et la somme $X_{1} + \cdots + X_{i + j}$ suit la loi $\mathcal{B}(i + j, p)$. Les variables $S$ et $T$ sont à valeurs dans $\mathbb{N}$, et $(S = i)$ est la réunion dénombrable des $(S = i, T = j)$ : ce sont des variables aléatoires discrètes. 
    $$\boxed{\mathbb{P}(S = i, T = j) = \mathbb{P}(N = i + j)\binom{i + j}{i}p^{i}q^{j}}$$

    **2.** Si $N \sim \mathcal{P}(\lambda)$, la question 1 donne 
    $$\mathbb{P}(S = i, T = j) = \mathrm{e}^{-\lambda}\frac{\lambda^{i + j}}{(i + j)!}\cdot\frac{(i + j)!}{i!\,j!}p^{i}q^{j} = \mathrm{e}^{-\lambda p}\frac{(\lambda p)^{i}}{i!}\cdot\mathrm{e}^{-\lambda q}\frac{(\lambda q)^{j}}{j!}.$$
     En sommant sur $j$, puis sur $i$, on obtient les marginales, et le théorème 6 donne l'indépendance. 
    $$\boxed{S \sim \mathcal{P}(\lambda p), \qquad T \sim \mathcal{P}(\lambda q), \qquad S \perp\!\!\!\perp T}$$
     Le nombre d'insectes nés et le nombre d'œufs qui n'ont pas éclos sont indépendants : connaître l'un n'apprend rien sur l'autre, ce qui n'a rien d'intuitif.

    **3.** L'indépendance et la question 1 donnent $\mathbb{P}(N = i + j)\frac{(i + j)!}{i!\,j!}p^{i}q^{j} = \mathbb{P}(S = i)\mathbb{P}(T = j)$, soit 
    $$\mathbb{P}(N = i + j)\,(i + j)! = a_{i}b_{j}, \qquad a_{i} = \frac{i!\,\mathbb{P}(S = i)}{p^{i}}, \quad b_{j} = \frac{j!\,\mathbb{P}(T = j)}{q^{j}}.$$
     On a $b_{0} = \mathbb{P}(T = 0) = \sum_{n} \mathbb{P}(N = n)p^{n} > 0$, et de même $a_{0} > 0$. Le membre de gauche ne dépend que de $i + j$, donc $a_{i + 1}b_{0} = a_{i}b_{1}$, et $a_{i} = a_{0}\rho^{i}$ avec $\rho = \frac{b_{1}}{b_{0}} \geqslant 0$. Alors $\mathbb{P}(N = n) = \frac{a_{n}b_{0}}{n!} = a_{0}b_{0}\frac{\rho^{n}}{n!}$. Comme $\mathbb{P}(N = 0) < 1$, on a $\rho > 0$, et la somme égale à $1$ donne $a_{0}b_{0} = \mathrm{e}^{-\rho}$. 
    $$\boxed{N \sim \mathcal{P}(\rho)}$$
     L'indépendance de $S$ et de $N - S$, pour un paramètre $p \in ]0, 1[$ quelconque, caractérise donc la loi de Poisson.
