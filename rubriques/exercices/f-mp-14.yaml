  enonce: |
    *La loi de Pascal.*

    **1.** Soit $X$, $Y \sim \mathcal{G}(p)$ indépendantes. Déterminer la loi de $X + Y$.

    **2.** Montrer que $\sum_{j = n}^{k} \binom{j - 1}{n - 1} = \binom{k}{n}$ pour $k \geqslant n \geqslant 1$.

    **3.** Soit $X_{1}$, …, $X_{n}$ indépendantes de loi $\mathcal{G}(p)$, et $S_{n} = X_{1} + \cdots + X_{n}$. Montrer que, pour tout $k \geqslant n$, 
    $$\mathbb{P}(S_{n} = k) = \binom{k - 1}{n - 1}p^{n}q^{k - n}.$$

    **4.** Retrouver ce résultat à l'aide du rang du $n$-ième pile de l'exercice 33.
  corrige: |
    La loi d'une somme de variables indépendantes à valeurs entières s'obtient en sommant sur les décompositions, comme pour la proposition 14 du cours.

    **1.** Pour $k \geqslant 2$, $\mathbb{P}(X + Y = k) = \sum_{i = 1}^{k - 1} pq^{i - 1}\,pq^{k - i - 1}$. 
    $$\boxed{\mathbb{P}(X + Y = k) = (k - 1)p^{2}q^{k - 2}, \qquad k \geqslant 2}$$

    **2.** Par récurrence sur $k$ : pour $k = n$, les deux membres valent $1$ ; si l'égalité est vraie pour $k$, la formule de Pascal donne $\binom{k}{n} + \binom{k}{n - 1} = \binom{k + 1}{n}$. C'est la « formule de la crosse de hockey », qui se lit sur le triangle de Pascal.

    **3.** Par récurrence sur $n$. Si la formule est vraie pour $S_{n}$, alors, pour $k \geqslant n + 1$, par indépendance de $S_{n}$ et $X_{n + 1}$ (lemme des coalitions) : 
    $$\mathbb{P}(S_{n + 1} = k) = \sum_{j = n}^{k - 1} \binom{j - 1}{n - 1}p^{n}q^{j - n}\,pq^{k - j - 1} = p^{n + 1}q^{k - n - 1}\sum_{j = n}^{k - 1} \binom{j - 1}{n - 1},$$
     et la question 2 donne $\binom{k - 1}{n}$. 
    $$\boxed{\mathbb{P}(S_{n} = k) = \binom{k - 1}{n - 1}p^{n}q^{k - n}, \qquad k \geqslant n}$$

    **4.** D'après l'exercice 33, le rang $T_{n}$ du $n$-ième pile est la somme de $n$ variables indépendantes de loi $\mathcal{G}(p)$ : il a la loi de $S_{n}$. Directement, $(T_{n} = k)$ signifie qu'il y a un pile au rang $k$ et exactement $n - 1$ piles parmi les $k - 1$ premiers lancers, d'où $\binom{k - 1}{n - 1}p^{n - 1}q^{k - n}\cdot p$. C'est la *loi de Pascal*, ou loi binomiale négative.
