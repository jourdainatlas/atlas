  enonce: |
    *Le deuxième pile.* On lance indéfiniment une pièce qui donne pile avec la probabilité $p \in ]0, 1[$. On note $X$ le rang du premier pile, et $Y$ celui du deuxième.

    **1.** Déterminer la loi conjointe de $(X, Y)$, puis la loi de $Y$.

    **2.** Déterminer la loi conditionnelle de $X$ sachant $(Y = j)$, et l'interpréter.

    **3.** Montrer que $X$ et $Y - X$ sont indépendantes et de même loi.

    **4.** Plus généralement, on note $T_{k}$ le rang du $k$-ième pile. Montrer que $T_{1}$, $T_{2} - T_{1}$, …, $T_{k} - T_{k - 1}$ sont indépendantes, de loi $\mathcal{G}(p)$.
  corrige: |
    Les rangs des succès découpent la suite des lancers en blocs indépendants, chacun terminé par un pile : c'est l'absence de mémoire, sous forme de loi conjointe.

    **1.** L'événement $(X = i, Y = j)$, pour $1 \leqslant i < j$, signifie : face aux rangs $1$ à $i - 1$, pile en $i$, face de $i + 1$ à $j - 1$, pile en $j$. En sommant sur $i \in \llbracket 1\,,j - 1 \rrbracket$ : 
    $$\boxed{\mathbb{P}(X = i, Y = j) = p^{2}q^{j - 2} \ (1 \leqslant i < j), \qquad \mathbb{P}(Y = j) = (j - 1)p^{2}q^{j - 2} \ (j \geqslant 2)}$$

    **2.** On a $\mathbb{P}_{(Y = j)}(X = i) = \frac{1}{j - 1}$ pour $1 \leqslant i \leqslant j - 1$. 
    $$\boxed{\text{sachant } (Y = j), \ X \text{ suit la loi uniforme sur } \llbracket 1\,,j - 1 \rrbracket}$$
     Sachant où se trouve le deuxième pile, le premier est à une position uniforme avant lui : toutes les suites ayant deux piles exactement aux rangs $i$ et $j$ ont la même probabilité $p^{2}q^{j - 2}$.

    **3.** Pour $i$, $k \geqslant 1$, $\mathbb{P}(X = i, Y - X = k) = p^{2}q^{i + k - 2} = pq^{i - 1}\cdot pq^{k - 1}$ : le théorème 6 donne l'indépendance. 
    $$\boxed{X \perp\!\!\!\perp Y - X, \qquad X \sim Y - X \sim \mathcal{G}(p)}$$

    **4.** De même, pour $1 \leqslant t_{1} < \cdots < t_{k}$, $\mathbb{P}(T_{1} = t_{1}, \dots, T_{k} = t_{k}) = p^{k}q^{t_{k} - k}$. En posant $d_{1} = t_{1}$ et $d_{i} = t_{i} - t_{i - 1}$, cette probabilité s'écrit $\prod_{i = 1}^{k} pq^{d_{i} - 1}$. 
    $$\boxed{T_{1}, \ T_{2} - T_{1}, \ \dots, \ T_{k} - T_{k - 1} \text{ sont indépendantes, de loi } \mathcal{G}(p)}$$
