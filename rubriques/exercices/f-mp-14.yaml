  enonce: |
    *Perspective : retour à l'origine d'une marche aléatoire.* Une particule part de l'origine de $\mathbb{Z}^{3}$. À chaque instant entier, elle passe de $(x, y, z)$ à l'un des huit points $(x \pm 1, y \pm 1, z \pm 1)$, choisi uniformément, indépendamment du passé.

    **1.** Soit $A_{n}$ l'événement « la particule est à l'origine à l'instant $2n$ ». En considérant séparément les trois coordonnées, montrer que $\mathbb{P}(A_{n}) = \Big(\dfrac{1}{4^{n}}\dbinom{2n}{n}\Big)^{3}$.

    **2.** Montrer que la suite $u_{n} = \frac{\sqrt{n}}{4^{n}}\binom{2n}{n}$ converge vers une limite $\ell > 0$, en étudiant la série $\sum \ln\frac{u_{n + 1}}{u_{n}}$. Que vaut $\ell$ d'après la formule de Stirling ?

    **3.** En déduire que la particule ne repasse presque sûrement qu'un nombre fini de fois par l'origine.

    **4.** Que donne le même raisonnement dans $\mathbb{Z}$, pour la marche de l'exercice 26 ? Peut-on conclure ?

    Pólya a démontré en 1921 que la marche aléatoire simple revient presque sûrement une infinité de fois à l'origine en dimension $1$ et $2$, mais pas en dimension $3$ ou plus. On résume souvent ce théorème en disant qu'un piéton ivre finit par rentrer chez lui, alors qu'un oiseau ivre peut se perdre à jamais.
  corrige: |
    En dimension $3$, la probabilité de retour décroît en $n^{-3/2}$, terme d'une série convergente : le premier lemme de Borel-Cantelli conclut, sans aucune hypothèse d'indépendance.

    **1.** Choisir uniformément l'un des huit déplacements revient à choisir indépendamment les trois signes : les trois coordonnées sont des marches indépendantes comme celle de l'exercice 26. La particule est à l'origine si et seulement si chaque coordonnée est nulle. 
    $$\boxed{\mathbb{P}(A_{n}) = \Big(\frac{1}{4^{n}}\binom{2n}{n}\Big)^{3}}$$

    **2.** On a $\frac{u_{n + 1}}{u_{n}} = \sqrt{1 + \frac{1}{n}}\cdot\frac{2n + 1}{2n + 2}$, d'où 
    $$\ln\frac{u_{n + 1}}{u_{n}} = \frac{1}{2}\ln\Big(1 + \frac{1}{n}\Big) + \ln\Big(1 - \frac{1}{2n + 2}\Big) = \frac{1}{2n} - \frac{1}{2n + 2} + O\Big(\frac{1}{n^{2}}\Big) = O\Big(\frac{1}{n^{2}}\Big).$$
     La série converge, donc $(\ln u_{n})$ converge, et $u_{n} \to \ell > 0$. La formule de Stirling donne $\binom{2n}{n} \sim \frac{4^{n}}{\sqrt{\pi n}}$. 
    $$\boxed{\ell = \frac{1}{\sqrt{\pi}}, \qquad \mathbb{P}(A_{n}) \sim \frac{1}{(\pi n)^{3/2}}}$$

    **3.** La série $\sum \mathbb{P}(A_{n})$ converge, et le premier lemme de Borel-Cantelli (exercice 9) montre que l'événement « $A_{n}$ est réalisé pour une infinité d'indices $n$ » est négligeable. 
    $$\boxed{\text{presque sûrement, la particule ne repasse qu'un nombre fini de fois par l'origine}}$$

    **4.** Dans $\mathbb{Z}$, $\mathbb{P}(S_{2n} = 0) \sim \frac{1}{\sqrt{\pi n}}$, terme d'une série divergente. Le second lemme de Borel-Cantelli ne s'applique pas, car les événements de retour ne sont pas indépendants : on ne peut pas conclure ainsi. Le théorème de Pólya affirme qu'en dimension $1$ la marche revient presque sûrement une infinité de fois à l'origine, mais sa démonstration demande un autre argument, fondé sur le premier temps de retour.
