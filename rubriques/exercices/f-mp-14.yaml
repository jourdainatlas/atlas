  source: "Feuille d'exercices #10 (Prost), exercice 29"
  page_enonce: 11
  page_corrige: 20
  enonce: |
    *Une matrice aléatoire.* Soit $X$, $Y$, $Z$ trois variables indépendantes de loi $\mathcal{P}(\lambda)$, et $M = \begin{pmatrix} X & Y \\ 0 & Z \end{pmatrix}$.

    **1.** Montrer que $M$ est diagonalisable si et seulement si $X \neq Z$ ou $Y = 0$ (chapitre 2). En déduire la probabilité $\mathbb{P}(A)$ de l'événement $A$ : « $M$ est diagonalisable », sous la forme d'une série.

    **2.** Montrer que $\max_{k \in \mathbb{N}} \mathbb{P}(X = k) \to 0$ quand $\lambda \to +\infty$, et en déduire la limite de $\mathbb{P}(A)$.
  corrige: |
    La diagonalisabilité d'une matrice triangulaire $2 \times 2$ se lit sur ses coefficients ; la probabilité cherchée fait intervenir $\mathbb{P}(X = Z)$, qui tend vers $0$ quand la loi s'étale.

    **1.** Les valeurs propres de $M$ sont $X$ et $Z$. Si $X \neq Z$, elles sont distinctes, et $M$ est diagonalisable (chapitre 2). Si $X = Z$, $M$ n'a qu'une valeur propre, et elle est diagonalisable si et seulement si $M = XI_{2}$, c'est-à-dire $Y = 0$. Par indépendance : 
    $$\boxed{\mathbb{P}(A) = 1 - \mathbb{P}(X = Z)\,\mathbb{P}(Y \neq 0) = 1 - (1 - \mathrm{e}^{-\lambda})\sum_{k = 0}^{+\infty} \mathrm{e}^{-2\lambda}\frac{\lambda^{2k}}{(k!)^{2}}}$$
     Pour $\lambda = 2$, on trouve $\mathbb{P}(A) \approx 0{,}821$.

    **2.** Soit $m = \lfloor\lambda\rfloor$ ; d'après l'exercice 34, le maximum est $\mathbb{P}(X = m)$. La fonction $t \mapsto \mathrm{e}^{-t}t^{m}$ est maximale en $t = m$, d'où $\mathbb{P}(X = m) \leqslant \frac{\mathrm{e}^{-m}m^{m}}{m!} \sim \frac{1}{\sqrt{2\pi m}}$ par la formule de Stirling. Ensuite, $\mathbb{P}(X = Z) = \sum_{k} \mathbb{P}(X = k)^{2} \leqslant \max_{k} \mathbb{P}(X = k)$. 
    $$\boxed{\max_{k} \mathbb{P}(X = k) \xrightarrow[\lambda \to +\infty]{} 0, \qquad \mathbb{P}(A) \xrightarrow[\lambda \to +\infty]{} 1}$$
     Une matrice aléatoire « très étalée » est presque sûrement à valeurs propres distinctes, donc diagonalisable : c'est un phénomène général.
- id: "mp-14-45"
  feuille: "f-mp-14"
