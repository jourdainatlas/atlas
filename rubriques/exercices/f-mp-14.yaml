  enonce: |
    Soit $a$ un réel et $(X, Y)$ un couple de variables aléatoires à valeurs dans $(\mathbb{N}^{*})^{2}$ tel que 
    $$\forall i, j \geqslant 1, \quad \mathbb{P}(X = i, Y = j) = \frac{a}{2^{i + j}}.$$

    **1.** Déterminer $a$, puis les lois marginales.

    **2.** Les variables $X$ et $Y$ sont-elles indépendantes ? Calculer $\mathbb{P}(X = Y)$ et $\mathbb{P}(X < Y)$.
  corrige: |
    La loi conjointe est un produit d'une fonction de $i$ et d'une fonction de $j$ : c'est le critère d'indépendance du théorème 6.

    **1.** On a $\sum_{i, j \geqslant 1} 2^{-i - j} = \big(\sum_{i \geqslant 1} 2^{-i}\big)^{2} = 1$, par le théorème de Fubini pour les familles positives. 
    $$\boxed{a = 1, \qquad X \sim \mathcal{G}(\tfrac{1}{2}), \qquad Y \sim \mathcal{G}(\tfrac{1}{2})}$$

    **2.** On a $\mathbb{P}(X = i, Y = j) = 2^{-i}\cdot 2^{-j} = \mathbb{P}(X = i)\mathbb{P}(Y = j)$ : $X$ et $Y$ sont indépendantes. Ensuite, $\mathbb{P}(X = Y) = \sum_{i \geqslant 1} 4^{-i} = \frac{1}{3}$, et par symétrie $\mathbb{P}(X < Y) = \mathbb{P}(X > Y) = \frac{1}{2}\big(1 - \frac{1}{3}\big)$. 
    $$\boxed{X \perp\!\!\!\perp Y, \qquad \mathbb{P}(X = Y) = \frac{1}{3}, \qquad \mathbb{P}(X < Y) = \frac{1}{3}}$$
