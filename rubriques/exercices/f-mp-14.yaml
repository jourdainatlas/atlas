  source: "Feuille d'exercices #10 (Prost), exercice 21"
  page_enonce: 7
  page_corrige: 13
  enonce: |
    Une urne contient $n \geqslant 2$ jetons numérotés de $1$ à $n$. On les tire un à un, avec remise, et l'on note $X$ le nombre de tirages nécessaires pour obtenir, pour la première fois, deux numéros distincts.

    **1.** Soit $A_{i}$ l'événement « le numéro $i$ apparaît au premier tirage ». Calculer $\mathbb{P}_{A_{i}}(X = k)$ pour $k \geqslant 2$, et en déduire la loi de $X$.

    **2.** Quelle est la loi de $Y = X - 1$ ? Retrouver directement ce résultat.
  corrige: |
    Après le premier tirage, on attend un numéro différent du premier : c'est un temps d'attente géométrique.

    **1.** Sachant $A_{i}$, on a $X = k$, avec $k \geqslant 2$, si les tirages $2$ à $k - 1$ redonnent $i$ et si le tirage $k$ donne un autre numéro : $\mathbb{P}_{A_{i}}(X = k) = \big(\frac{1}{n}\big)^{k - 2}\big(1 - \frac{1}{n}\big)$. Cette valeur ne dépend pas de $i$, et la formule des probabilités totales donne la même expression pour $\mathbb{P}(X = k)$. 
    $$\boxed{\mathbb{P}(X = k) = \Big(1 - \frac{1}{n}\Big)\Big(\frac{1}{n}\Big)^{k - 2}, \qquad k \geqslant 2}$$

    **2.** On a $\mathbb{P}(Y = j) = \big(1 - \frac{1}{n}\big)\big(\frac{1}{n}\big)^{j - 1}$ pour $j \geqslant 1$. 
    $$\boxed{Y = X - 1 \sim \mathcal{G}(1 - \tfrac{1}{n})}$$
     Directement : $Y$ est le rang, compté à partir du deuxième tirage, du premier tirage différent du premier ; chacun de ces tirages est un « succès » avec la probabilité $1 - \frac{1}{n}$, indépendamment des autres, et le théorème 8 s'applique.
