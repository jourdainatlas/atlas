  source: "Feuille d'exercices #10 (Prost), exercice 7 ; BibM@th, Espaces probabilisés, exercice 32"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Un laboratoire a mis au point un test de dépistage d'une maladie qui touche en moyenne un individu sur $5\,000$. Pour un patient malade, la probabilité que le test soit positif est $\frac{998}{1000}$ ; pour un patient sain, la probabilité que le test soit négatif est $\frac{2999}{3000}$.

    **1.** Un patient est positif. Quelle est la probabilité qu'il soit malade ? Le test est-il fiable pour dépister les malades ?

    **2.** Un patient est négatif. Quelle est la probabilité qu'il soit sain ?

    **3.** Quelle devrait être la probabilité $\varepsilon$ d'un faux positif pour qu'un patient positif soit malade avec une probabilité d'au moins $\frac{1}{2}$ ?
  corrige: |
    C'est la formule de Bayes, avec le système complet formé de $M$, « être malade », et de $\bar{M}$. On note $T$ l'événement « le test est positif ».

    **1.** On a $\mathbb{P}(M) = \frac{1}{5000}$, $\mathbb{P}_{M}(T) = 0{,}998$ et $\mathbb{P}_{\bar{M}}(T) = \frac{1}{3000}$, d'où 
    $$\mathbb{P}_{T}(M) = \frac{\mathbb{P}(M)\mathbb{P}_{M}(T)}{\mathbb{P}(M)\mathbb{P}_{M}(T) + \mathbb{P}(\bar{M})\mathbb{P}_{\bar{M}}(T)} = \frac{0{,}998/5000}{0{,}998/5000 + (4999/5000)/3000} \approx 0{,}375.$$

    $$\boxed{\mathbb{P}_{T}(M) \approx 0{,}375}$$
     Un patient positif n'est malade qu'avec une probabilité d'environ $\frac{3}{8}$ : la maladie est si rare que les faux positifs, pourtant peu fréquents, sont plus nombreux que les vrais. Le test sert à sélectionner les patients pour un examen complémentaire, pas à poser un diagnostic.

    **2.** De même, $\mathbb{P}_{\bar{T}}(\bar{M}) = \frac{(4999/5000)(2999/3000)}{(4999/5000)(2999/3000) + (1/5000) \cdot 0{,}002} \approx 1 - 4 \cdot 10^{-7}$. 
    $$\boxed{\mathbb{P}_{\bar{T}}(\bar{M}) \approx 0{,}9999996}$$
     Un test négatif rassure pleinement.

    **3.** On veut $\frac{0{,}998}{5000} \geqslant \varepsilon\,\frac{4999}{5000}$, soit : 
    $$\boxed{\varepsilon \leqslant \frac{0{,}998}{4999} \approx 2{,}0 \cdot 10^{-4}}$$
     Il faudrait diviser le taux de faux positifs par $1{,}7$ environ ; ce taux doit être comparé à la prévalence, et non à $1$.

    *Piège.* L'erreur la plus répandue est de confondre $\mathbb{P}_{T}(M)$ avec $\mathbb{P}_{M}(T) = 0{,}998$.
- id: "mp-14-11"
  feuille: "f-mp-14"
