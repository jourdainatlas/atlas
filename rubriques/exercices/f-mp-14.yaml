- id: "mp-14-01"
  feuille: "f-mp-14"
  numero: 1
  partie: "Ensembles dénombrables"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [ensembles dénombrables]
  noeuds: [q-denombrable]
  notions: [denombrable]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Montrer que les ensembles suivants sont dénombrables :

    **1.** l'ensemble $\mathcal{P}_{f}(\mathbb{N})$ des parties finies de $\mathbb{N}$ ;

    **2.** l'ensemble des suites finies d'entiers naturels, c'est-à-dire $\bigcup_{k \geqslant 1} \mathbb{N}^{k}$ ;

    **3.** l'ensemble $\mathbb{Q}[X]$ des polynômes à coefficients rationnels ;

    **4.** l'ensemble des nombres réels *algébriques*, c'est-à-dire racines d'un polynôme non nul de $\mathbb{Q}[X]$.

    En déduire qu'il existe des réels qui ne sont racines d'aucun polynôme non nul à coefficients rationnels.
  corrige: |
    On construit des injections dans des ensembles déjà connus pour être dénombrables, ou l'on écrit l'ensemble comme réunion dénombrable d'ensembles au plus dénombrables (théorème 1).

    **1.** L'application $A \mapsto \sum_{a \in A} 2^{a}$ associe à une partie finie de $\mathbb{N}$ l'entier dont l'écriture binaire a des $1$ exactement aux positions de $A$ : c'est une bijection de $\mathcal{P}_{f}(\mathbb{N})$ sur $\mathbb{N}$, par unicité de l'écriture en base $2$.

    **2.** Chaque $\mathbb{N}^{k}$ est dénombrable (théorème 1), et une réunion dénombrable d'ensembles dénombrables est au plus dénombrable, et ici infinie.

    **3.** L'application qui associe à un polynôme non nul de degré $d$ la suite $(a_{0}, \dots, a_{d})$ de ses coefficients est injective, à valeurs dans $\bigcup_{k} \mathbb{Q}^{k}$, dénombrable comme à la question 2, puisque $\mathbb{Q}$ l'est.

    **4.** L'ensemble des réels algébriques est la réunion, indexée par l'ensemble dénombrable $\mathbb{Q}[X] \setminus \{0\}$, des ensembles finis de racines réelles de chaque polynôme : il est au plus dénombrable, et infini puisqu'il contient $\mathbb{Q}$. 
    $$\boxed{\mathcal{P}_{f}(\mathbb{N}), \ \bigcup_{k \geqslant 1} \mathbb{N}^{k}, \ \mathbb{Q}[X] \text{ et l'ensemble des réels algébriques sont dénombrables}}$$
     Comme $\mathbb{R}$ n'est pas dénombrable (théorème 2), il existe des réels non algébriques, dits *transcendants*. C'est l'argument de Cantor de 1874 : il prouve l'existence de nombres transcendants sans en exhiber aucun, alors que Liouville en avait construit explicitement en 1844.
- id: "mp-14-02"
  feuille: "f-mp-14"
  numero: 2
  partie: "Ensembles dénombrables"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [ensembles dénombrables]
  noeuds: [q-denombrable]
  notions: [denombrable]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    *L'argument diagonal.*

    **1.** Soit $E$ un ensemble et $f : E \to \mathcal{P}(E)$. En considérant $D = \{x \in E \mid x \notin f(x)\}$, montrer que $f$ n'est pas surjective.

    **2.** En déduire que $\mathcal{P}(\mathbb{N})$ n'est pas dénombrable, puis que l'ensemble $\{0, 1\}^{\mathbb{N}}$ des suites à valeurs dans $\{0, 1\}$ ne l'est pas.

    **3.** Pourquoi ce résultat explique-t-il que l'univers du jeu de pile ou face infini ne puisse pas être muni d'une probabilité définie par ses valeurs sur les singletons (théorème 7 du cours) ?
  corrige: |
    L'ensemble $D$ est construit pour différer de chaque $f(x)$ au point $x$ lui-même : c'est la forme abstraite de l'argument diagonal.

    **1.** Supposons $D = f(x_{0})$. Si $x_{0} \in D$, alors $x_{0} \notin f(x_{0}) = D$ par définition de $D$ ; si $x_{0} \notin D$, alors $x_{0} \in f(x_{0}) = D$. Les deux cas sont contradictoires. 
    $$\boxed{\text{aucune application } E \to \mathcal{P}(E) \text{ n'est surjective}}$$

    **2.** En particulier, il n'existe pas de surjection de $\mathbb{N}$ sur $\mathcal{P}(\mathbb{N})$, et $\mathcal{P}(\mathbb{N})$ n'est pas au plus dénombrable (proposition 1 du cours). L'application $A \mapsto \mathbf{1}_{A}$ est une bijection de $\mathcal{P}(\mathbb{N})$ sur $\{0, 1\}^{\mathbb{N}}$. 
    $$\boxed{\mathcal{P}(\mathbb{N}) \text{ et } \{0, 1\}^{\mathbb{N}} \text{ ne sont pas dénombrables}}$$

    **3.** Dans un modèle du jeu de pile ou face équilibré, chaque suite $\omega$ de résultats est contenue, pour tout $n$, dans l'événement « les $n$ premiers lancers coïncident avec ceux de $\omega$ », de probabilité $2^{-n}$ : le singleton $\{\omega\}$ est de probabilité nulle. Une probabilité définie par ses valeurs sur les singletons, au sens du théorème 5 du cours, donnerait donc $\mathbb{P}(\Omega) = 0$. La non-dénombrabilité de l'univers est ce qui permet à une somme de probabilités nulles de ne pas être un obstacle : on ne peut pas sommer sur $\Omega$.
- id: "mp-14-03"
  feuille: "f-mp-14"
  numero: 3
  partie: "Ensembles dénombrables"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [ensembles dénombrables]
  noeuds: [q-denombrable]
  notions: [denombrable]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Soit $(I_{j})_{j \in J}$ une famille d'intervalles ouverts non vides de $\mathbb{R}$, deux à deux disjoints. Montrer que $J$ est au plus dénombrable.

    **2.** Soit $f : \mathbb{R} \to \mathbb{R}$ croissante. Montrer que l'ensemble des points de discontinuité de $f$ est au plus dénombrable.

    **3.** Soit $(a_{x})_{x \in \mathbb{R}}$ une famille de réels positifs. On suppose qu'il existe $M$ tel que $\sum_{x \in F} a_{x} \leqslant M$ pour toute partie finie $F$ de $\mathbb{R}$. Montrer que $\{x \mid a_{x} > 0\}$ est au plus dénombrable.
  corrige: |
    Les trois questions reposent sur le même principe : associer injectivement à chaque élément un objet pris dans un ensemble dénombrable.

    **1.** Chaque intervalle $I_{j}$ contient un rationnel $r_{j}$, par densité de $\mathbb{Q}$ dans $\mathbb{R}$. Les intervalles étant disjoints, l'application $j \mapsto r_{j}$ est injective de $J$ dans $\mathbb{Q}$, dénombrable. 
    $$\boxed{J \text{ est au plus dénombrable}}$$

    **2.** Pour une fonction croissante, les limites à gauche et à droite $f(x^{-}) \leqslant f(x) \leqslant f(x^{+})$ existent en tout point, et $f$ est discontinue en $x$ si et seulement si $f(x^{-}) < f(x^{+})$. Si $x < y$, on a $f(x^{+}) \leqslant f(y^{-})$, donc les intervalles ouverts $]f(x^{-}), f(x^{+})[$, pour $x$ point de discontinuité, sont non vides et deux à deux disjoints : la question 1 conclut. 
    $$\boxed{\text{l'ensemble des discontinuités d'une fonction croissante est au plus dénombrable}}$$

    **3.** C'est l'argument de la proposition 2 du cours : pour $k \geqslant 1$, l'ensemble $S_{k} = \{x \mid a_{x} \geqslant \frac{1}{k}\}$ a au plus $kM$ éléments, sans quoi une partie finie de $S_{k}$ aurait une somme supérieure à $M$. Le support est la réunion des $S_{k}$. 
    $$\boxed{\{x \mid a_{x} > 0\} \text{ est au plus dénombrable}}$$
- id: "mp-14-04"
  feuille: "f-mp-14"
  numero: 4
  partie: "Espaces probabilisés"
  etoiles: 1
  types: [Calcul]
  mots_cles: [espaces probabilisés]
  noeuds: [p-espace, m-tribus]
  notions: [espace-probabilise, tribu]
  source: "Feuille d'exercices #10 (Prost), exercice 1"
  page_enonce: 2
  page_corrige: 2
  enonce: |
    Soit $A$, $B$, $C$ des événements et $(A_{n})_{n \in \mathbb{N}}$ une suite d'événements. Traduire à l'aide d'opérations ensemblistes les événements suivants.

    **1.** « L'un au moins des événements $A$ ou $B$ se réalise. »

    **2.** « L'un et l'un seulement des événements $A$ ou $B$ se réalise. »

    **3.** « $A$ et $B$ se réalisent, mais pas $C$. »

    **4.** « Tous les événements $A_{n}$ se réalisent. »

    **5.** « Une infinité d'événements $A_{n}$ se réalisent. »

    **6.** « Seul un nombre fini d'événements $A_{n}$ se réalisent. »

    **7.** « Une infinité d'événements $A_{n}$ ne se réalisent pas. »

    **8.** « Tous les événements $A_{n}$ se réalisent à partir d'un certain rang. »
  corrige: |
    « Pour tout $n$ » se traduit par une intersection, « il existe $n$ » par une réunion ; « une infinité » se lit « pour tout rang, il en existe un au-delà ». 
    $$\boxed{\begin{array}{llll} \text{1. } A \cup B & \text{2. } (A \cap \bar{B}) \cup (\bar{A} \cap B) & \text{3. } A \cap B \cap \bar{C} & \text{4. } \bigcap_{n} A_{n} \\[2mm] \text{5. } \bigcap_{n} \bigcup_{k \geqslant n} A_{k} & \text{6. } \bigcup_{n} \bigcap_{k \geqslant n} \bar{A}_{k} & \text{7. } \bigcap_{n} \bigcup_{k \geqslant n} \bar{A}_{k} & \text{8. } \bigcup_{n} \bigcap_{k \geqslant n} A_{k} \end{array}}$$
     L'événement 6 est le complémentaire de 5, et 8 celui de 7. Ce sont les limites supérieure et inférieure de l'exercice 7.

    *Piège.* L'événement 6, « seul un nombre fini des $A_{n}$ se réalisent », n'est pas $\bigcup_{n} \bar{A}_{n}$, qui signifie seulement que l'un au moins des $A_{n}$ ne se réalise pas.
- id: "mp-14-05"
  feuille: "f-mp-14"
  numero: 5
  partie: "Espaces probabilisés"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [espaces probabilisés, tribus]
  noeuds: [p-espace, m-tribus]
  notions: [espace-probabilise, tribu]
  source: "BibM@th, Espaces probabilisés, exercices 2, 3 et 4"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    *Quelques tribus.*

    **1.** Soit $\phi : E \to F$ et $\mathcal{T}$ une tribu sur $F$. Montrer que $\{\phi^{-1}(A) \mid A \in \mathcal{T}\}$ est une tribu sur $E$.

    **2.** Soit $(A_{n})_{n \in \mathbb{N}}$ une partition de $E$ en parties non vides. Montrer que l'ensemble des réunions $B_{J} = \bigcup_{j \in J} A_{j}$, pour $J \subset \mathbb{N}$, est une tribu, et que c'est la plus petite tribu contenant tous les $A_{n}$.

    **3.** Construire une partition de $\mathbb{N}$ en une infinité de parties infinies, et en déduire une tribu infinie sur $\mathbb{N}$ dont tous les éléments non vides sont infinis.
  corrige: |
    On vérifie les trois axiomes ; pour une partition, le complémentaire d'une réunion de blocs est la réunion des autres blocs.

    **1.** On a $E = \phi^{-1}(F)$, $\overline{\phi^{-1}(A)} = \phi^{-1}(\bar{A})$ et $\bigcup \phi^{-1}(A_{n}) = \phi^{-1}\big(\bigcup A_{n}\big)$ : les trois axiomes passent de $\mathcal{T}$ à son image réciproque.

    **2.** On a $E = B_{\mathbb{N}}$, le complémentaire de $B_{J}$ est $B_{\mathbb{N} \setminus J}$ puisque les $A_{n}$ forment une partition, et $\bigcup_{m} B_{J_{m}} = B_{\bigcup J_{m}}$. Toute tribu contenant les $A_{n}$ contient leurs réunions dénombrables, c'est-à-dire tous les $B_{J}$, puisque $J \subset \mathbb{N}$ est au plus dénombrable. 
    $$\boxed{\{B_{J} \mid J \subset \mathbb{N}\} \text{ est la plus petite tribu contenant les } A_{n}}$$

    **3.** D'après la démonstration du théorème 1, tout entier $m \geqslant 1$ s'écrit de façon unique $2^{k}(2j + 1)$ : les ensembles $P_{k} = \{2^{k}(2j + 1) - 1 \mid j \in \mathbb{N}\}$, pour $k \in \mathbb{N}$, forment une partition de $\mathbb{N}$ en parties infinies. La tribu associée par la question 2 est infinie, puisque $J \mapsto B_{J}$ est injective, et ses éléments non vides sont des réunions de parties infinies.
- id: "mp-14-06"
  feuille: "f-mp-14"
  numero: 6
  partie: "Espaces probabilisés"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [espaces probabilisés]
  noeuds: [p-espace, m-tribus]
  notions: [espace-probabilise, tribu]
  source: "BibM@th, Espaces probabilisés, exercices 6 et 8"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $A$, $B$, $A_{1}$, …, $A_{n}$ des événements.

    **1.** Montrer que $\max\big(0, \mathbb{P}(A) + \mathbb{P}(B) - 1\big) \leqslant \mathbb{P}(A \cap B) \leqslant \min\big(\mathbb{P}(A), \mathbb{P}(B)\big)$.

    **2.** *Inégalité de Bonferroni.* Montrer que $\mathbb{P}(A_{1} \cap \cdots \cap A_{n}) \geqslant \sum_{i = 1}^{n} \mathbb{P}(A_{i}) - (n - 1)$.

    **3.** Dans une classe, $90\,\%$ des élèves ont lu le cours, $85\,\%$ ont cherché les exercices et $80\,\%$ sont venus en colle. Que peut-on dire de la proportion d'élèves qui ont fait les trois ?
  corrige: |
    Toutes ces inégalités découlent de la formule $\mathbb{P}(A \cup B) = \mathbb{P}(A) + \mathbb{P}(B) - \mathbb{P}(A \cap B)$ et de la majoration $\mathbb{P}(A \cup B) \leqslant 1$.

    **1.** Comme $A \cap B$ est inclus dans $A$ et dans $B$, $\mathbb{P}(A \cap B) \leqslant \min(\mathbb{P}(A), \mathbb{P}(B))$. D'autre part, $\mathbb{P}(A \cap B) = \mathbb{P}(A) + \mathbb{P}(B) - \mathbb{P}(A \cup B) \geqslant \mathbb{P}(A) + \mathbb{P}(B) - 1$.

    **2.** Par récurrence : si l'inégalité est vraie pour $n$ événements, la question 1, appliquée à $A_{1} \cap \cdots \cap A_{n}$ et $A_{n + 1}$, donne 
    $$\mathbb{P}(A_{1} \cap \cdots \cap A_{n + 1}) \geqslant \sum_{i = 1}^{n} \mathbb{P}(A_{i}) - (n - 1) + \mathbb{P}(A_{n + 1}) - 1.$$

    $$\boxed{\mathbb{P}(A_{1} \cap \cdots \cap A_{n}) \geqslant \sum_{i = 1}^{n} \mathbb{P}(A_{i}) - (n - 1)}$$

    **3.** La proportion cherchée est au moins $0{,}90 + 0{,}85 + 0{,}80 - 2 = 0{,}55$, et au plus $0{,}80$. Les deux bornes sont atteintes : la première si les $10\,\%$, $15\,\%$ et $20\,\%$ d'élèves défaillants sont trois groupes disjoints, la seconde si les assidus aux colles ont tous aussi lu le cours et cherché les exercices. 
    $$\boxed{\text{entre } 55\,\% \text{ et } 80\,\%}$$
- id: "mp-14-07"
  feuille: "f-mp-14"
  numero: 7
  partie: "Espaces probabilisés"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [espaces probabilisés, lemme de Borel-Cantelli]
  noeuds: [p-espace, m-tribus, p-borel-cantelli]
  notions: [espace-probabilise, tribu]
  source: "BibM@th, Espaces probabilisés, exercice 5"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    *Limites supérieure et inférieure.* Pour une suite $(A_{n})$ de parties d'un ensemble $\Omega$, on pose 
    $$\limsup A_{n} = \bigcap_{n \geqslant 0} \bigcup_{k \geqslant n} A_{k} \qquad\text{et}\qquad \liminf A_{n} = \bigcup_{n \geqslant 0} \bigcap_{k \geqslant n} A_{k}.$$

    **1.** Traduire « $\omega \in \limsup A_{n}$ » et « $\omega \in \liminf A_{n}$ » à l'aide de quantificateurs, puis comparer ces deux ensembles.

    **2.** Calculer $\limsup A_{n}$ et $\liminf A_{n}$ lorsque $A_{n} = ]-\infty, n]$, lorsque $A_{n} = ]-\infty, -n]$, lorsque $A_{2n} = A$ et $A_{2n + 1} = B$, et lorsque $A_{n} = ]-\infty, (-1)^{n}]$.

    **3.** Montrer que le complémentaire de $\limsup A_{n}$ est $\liminf \bar{A}_{n}$.

    **4.** Montrer que $\mathbb{P}(\liminf A_{n}) \leqslant \liminf \mathbb{P}(A_{n}) \leqslant \limsup \mathbb{P}(A_{n}) \leqslant \mathbb{P}(\limsup A_{n})$.
  corrige: |
    La limite supérieure est l'ensemble des $\omega$ qui appartiennent à une infinité de $A_{n}$, la limite inférieure celui des $\omega$ qui appartiennent à tous les $A_{n}$ à partir d'un certain rang.

    **1.** On a $\omega \in \limsup A_{n} \iff \forall n, \exists k \geqslant n, \ \omega \in A_{k}$, et $\omega \in \liminf A_{n} \iff \exists n, \forall k \geqslant n, \ \omega \in A_{k}$. 
    $$\boxed{\liminf A_{n} \subset \limsup A_{n}}$$

    **2.** Dans les quatre cas : 
    $$\boxed{\begin{array}{lll} A_{n} = ]-\infty, n] : & \limsup = \liminf = \mathbb{R} ; \\ A_{n} = ]-\infty, -n] : & \limsup = \liminf = \varnothing ; \\ A_{2n} = A, \ A_{2n + 1} = B : & \limsup = A \cup B, & \liminf = A \cap B ; \\ A_{n} = ]-\infty, (-1)^{n}] : & \limsup = ]-\infty, 1], & \liminf = ]-\infty, -1]. \end{array}}$$

    **3.** Les lois de De Morgan échangent intersections et réunions, et $\omega \notin \limsup A_{n}$ signifie que $\omega$ n'appartient qu'à un nombre fini de $A_{n}$, c'est-à-dire qu'il appartient à tous les $\bar{A}_{n}$ à partir d'un certain rang.

    **4.** Pour $k \geqslant n$, $\bigcap_{j \geqslant n} A_{j} \subset A_{k} \subset \bigcup_{j \geqslant n} A_{j}$, d'où $\mathbb{P}\big(\bigcap_{j \geqslant n} A_{j}\big) \leqslant \inf_{k \geqslant n} \mathbb{P}(A_{k})$ et $\sup_{k \geqslant n} \mathbb{P}(A_{k}) \leqslant \mathbb{P}\big(\bigcup_{j \geqslant n} A_{j}\big)$. Les suites $\big(\bigcap_{j \geqslant n} A_{j}\big)_{n}$ et $\big(\bigcup_{j \geqslant n} A_{j}\big)_{n}$ sont croissante et décroissante : la continuité monotone (théorème 3) permet de passer à la limite. 
    $$\boxed{\mathbb{P}(\liminf A_{n}) \leqslant \liminf \mathbb{P}(A_{n}) \leqslant \limsup \mathbb{P}(A_{n}) \leqslant \mathbb{P}(\limsup A_{n})}$$
- id: "mp-14-08"
  feuille: "f-mp-14"
  numero: 8
  partie: "Espaces probabilisés"
  etoiles: 1
  types: [Calcul]
  mots_cles: [espaces probabilisés]
  noeuds: [p-espace, m-tribus]
  notions: [espace-probabilise, tribu]
  source: "BibM@th, Espaces probabilisés, exercice 11"
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Une urne contient $v$ boules vertes et une boule rouge. On effectue une infinité de tirages avec remise. On note $A_{n}$ l'événement « la première boule rouge est obtenue au $n$-ième tirage », $B_{n}$ l'événement « les $n$ premiers tirages donnent des boules vertes », $C_{n}$ l'événement « au moins une boule rouge est obtenue lors des $n$ premiers tirages », et $E$ l'événement « on obtient au moins une boule rouge ».

    **1.** Calculer $\mathbb{P}(A_{n})$, $\mathbb{P}(B_{n})$ et $\mathbb{P}(C_{n})$.

    **2.** Exprimer $E$ à l'aide des $A_{n}$, des $B_{n}$, puis des $C_{n}$, et calculer $\mathbb{P}(E)$ de trois manières différentes. Que peut-on dire de l'événement $E$ ?
  corrige: |
    On calcule la même probabilité par $\sigma$-additivité, puis par continuité décroissante, puis par continuité croissante : les trois outils du cours donnent bien la même valeur.

    **1.** Par indépendance des tirages, avec $r = \frac{v}{v + 1}$ : 
    $$\boxed{\mathbb{P}(A_{n}) = r^{n - 1}\,\frac{1}{v + 1}, \qquad \mathbb{P}(B_{n}) = r^{n}, \qquad \mathbb{P}(C_{n}) = 1 - r^{n}}$$

    **2.** On a $E = \bigcup_{n} A_{n}$, réunion d'événements deux à deux incompatibles, d'où 
    $$\mathbb{P}(E) = \sum_{n \geqslant 1} \frac{r^{n - 1}}{v + 1} = \frac{1}{(v + 1)(1 - r)} = 1.$$
     On a aussi $\bar{E} = \bigcap_{n} B_{n}$, suite décroissante, d'où $\mathbb{P}(\bar{E}) = \lim r^{n} = 0$ ; et $E = \bigcup_{n} C_{n}$, suite croissante, d'où $\mathbb{P}(E) = \lim (1 - r^{n}) = 1$. 
    $$\boxed{\mathbb{P}(E) = 1}$$
     L'événement $E$ est presque sûr, mais il n'est pas certain : la suite de tirages formée uniquement de boules vertes est une issue possible.
- id: "mp-14-09"
  feuille: "f-mp-14"
  numero: 9
  partie: "Espaces probabilisés"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [espaces probabilisés, lemme de Borel-Cantelli]
  noeuds: [p-espace, m-tribus, p-borel-cantelli]
  notions: [espace-probabilise, tribu]
  source: "Feuille d'exercices #10 (Prost), exercice 15 (questions 1 à 3, et 4 sans espérance) ; BibM@th, Espaces probabilisés, exercices 14 et 24"
  page_enonce: 3
  page_corrige: 4
  enonce: |
    *Le lemme de Borel-Cantelli.* Soit $(A_{n})_{n \in \mathbb{N}}$ une suite d'événements et $B = \limsup A_{n}$ l'événement « une infinité des $A_{n}$ se réalisent » (exercice 7).

    **1.** On suppose que la série $\sum \mathbb{P}(A_{n})$ converge. Montrer que $\mathbb{P}(B) \leqslant \sum_{p \geqslant k} \mathbb{P}(A_{p})$ pour tout $k$, et en déduire que $B$ est négligeable. Interpréter.

    **2.** On suppose que la série $\sum \mathbb{P}(A_{n})$ diverge et que les $A_{n}$ sont mutuellement indépendants. Pour $k \leqslant \ell$, exprimer $\mathbb{P}\big(\bigcap_{p = k}^{\ell} \bar{A}_{p}\big)$ à l'aide des $\mathbb{P}(A_{p})$, puis montrer que $B$ est presque sûr. On pourra utiliser l'inégalité $1 - x \leqslant \mathrm{e}^{-x}$.

    **3.** Montrer par un exemple que l'hypothèse d'indépendance ne peut pas être supprimée dans la question 2.

    **4.** Soit $(X_{n})_{n \geqslant 1}$ une suite de variables indépendantes avec $X_{n} \sim \mathcal{B}(n^{-\alpha})$, où $\alpha > 0$. Montrer que l'ensemble $\{n \mid X_{n} = 1\}$ est presque sûrement infini si $\alpha \leqslant 1$, et presque sûrement fini si $\alpha > 1$.
  corrige: |
    Le premier lemme ne demande que la sous-additivité ; le second demande l'indépendance, qui permet de calculer la probabilité qu'aucun des $A_{p}$ ne se réalise à partir d'un rang.

    **1.** Pour tout $k$, $B \subset \bigcup_{p \geqslant k} A_{p}$, et la sous-additivité (proposition 4) donne $\mathbb{P}(B) \leqslant \sum_{p \geqslant k} \mathbb{P}(A_{p})$, reste d'une série convergente, qui tend vers $0$ quand $k \to +\infty$. 
    $$\boxed{\sum \mathbb{P}(A_{n}) < +\infty \implies \mathbb{P}(\limsup A_{n}) = 0}$$
     Presque sûrement, seul un nombre fini des $A_{n}$ se réalisent.

    **2.** Par indépendance des complémentaires (proposition 8) et l'inégalité $1 - x \leqslant \mathrm{e}^{-x}$ : 
    $$\mathbb{P}\Big(\bigcap_{p = k}^{\ell} \bar{A}_{p}\Big) = \prod_{p = k}^{\ell} \big(1 - \mathbb{P}(A_{p})\big) \leqslant \exp\Big(-\sum_{p = k}^{\ell} \mathbb{P}(A_{p})\Big) \xrightarrow[\ell \to +\infty]{} 0.$$
     Par continuité décroissante, $\mathbb{P}\big(\bigcap_{p \geqslant k} \bar{A}_{p}\big) = 0$ pour tout $k$, et $\bar{B} = \bigcup_{k} \bigcap_{p \geqslant k} \bar{A}_{p}$ est négligeable comme réunion dénombrable d'événements négligeables. 
    $$\boxed{\sum \mathbb{P}(A_{n}) = +\infty \text{ et } (A_{n}) \text{ indépendants} \implies \mathbb{P}(\limsup A_{n}) = 1}$$

    **3.** Si $A_{n} = A$ pour tout $n$, avec $\mathbb{P}(A) = \frac{1}{2}$, la série $\sum \mathbb{P}(A_{n})$ diverge, mais $\limsup A_{n} = A$ est de probabilité $\frac{1}{2}$.

    **4.** Les événements $(X_{n} = 1)$ sont indépendants, de probabilités $n^{-\alpha}$, et la série de Riemann $\sum n^{-\alpha}$ diverge si et seulement si $\alpha \leqslant 1$. 
    $$\boxed{\{n \mid X_{n} = 1\} \text{ est p.s. infini si } \alpha \leqslant 1, \text{ p.s. fini si } \alpha > 1}$$
     Le seuil est très net : pour $\alpha = 1$, il y a presque sûrement une infinité de succès, bien que leur probabilité tende vers $0$.
- id: "mp-14-10"
