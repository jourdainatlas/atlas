  enonce: |
    Une urne contient $n$ jetons numérotés de $1$ à $n$, avec $n \geqslant 2$. On tire successivement et sans remise deux jetons ; $X$ est le numéro du premier, $Y$ celui du second.

    **1.** Déterminer la loi conjointe du couple $(X, Y)$ et les lois marginales.

    **2.** Déterminer la loi conditionnelle de $X$ sachant $(Y = j)$. Les variables $X$ et $Y$ sont-elles indépendantes ?

    **3.** Déterminer la loi de $|X - Y|$.
  corrige: |
    Les $n(n - 1)$ couples ordonnés de numéros distincts sont équiprobables.

    **1.** Les lois marginales sont uniformes, par symétrie, ou en sommant les $n - 1$ cases de chaque ligne. 
    $$\boxed{\mathbb{P}(X = i, Y = j) = \frac{1}{n(n - 1)} \ (i \neq j), \qquad X \text{ et } Y \text{ suivent la loi uniforme sur } \llbracket 1\,,n \rrbracket}$$

    **2.** On a $\mathbb{P}_{(Y = j)}(X = i) = \frac{1/(n(n - 1))}{1/n} = \frac{1}{n - 1}$ pour $i \neq j$ : la loi conditionnelle est uniforme sur $\llbracket 1\,,n \rrbracket \setminus \{j\}$. Comme $\mathbb{P}(X = Y) = 0 \neq \sum_{i} \mathbb{P}(X = i)\mathbb{P}(Y = i) = \frac{1}{n}$, les variables ne sont pas indépendantes.

    **3.** Pour $d \in \llbracket 1\,,n - 1 \rrbracket$, il y a $2(n - d)$ couples $(i, j)$ tels que $|i - j| = d$. 
    $$\boxed{\mathbb{P}(|X - Y| = d) = \frac{2(n - d)}{n(n - 1)}, \qquad d \in \llbracket 1\,,n - 1 \rrbracket}$$
