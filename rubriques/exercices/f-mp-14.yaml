  enonce: |
    Soit $\lambda > 0$ et $X \sim \mathcal{P}(\lambda)$.

    **1.** Calculer $\frac{\mathbb{P}(X = k + 1)}{\mathbb{P}(X = k)}$, et en déduire une condition nécessaire et suffisante sur $\lambda$ pour que la suite $\big(\mathbb{P}(X = k)\big)_{k \in \mathbb{N}}$ soit décroissante.

    **2.** Déterminer la ou les valeurs de $k$ pour lesquelles $\mathbb{P}(X = k)$ est maximale.

    **3.** Pour la loi de Bortkiewicz du cours, $\lambda = 0{,}61$ : quelle est la valeur la plus probable ? Retrouver ce résultat sur la figure de l'introduction du chapitre.
  corrige: |
    Le quotient de deux probabilités consécutives est simple, et son signe par rapport à $1$ donne les variations.

    **1.** On a $\frac{\mathbb{P}(X = k + 1)}{\mathbb{P}(X = k)} = \frac{\lambda}{k + 1}$, quotient inférieur ou égal à $1$ pour tout $k$ si et seulement si $\lambda \leqslant 1$, le cas le plus défavorable étant $k = 0$. 
    $$\boxed{\big(\mathbb{P}(X = k)\big)_{k} \text{ décroissante} \iff \lambda \leqslant 1}$$

    **2.** La suite croît tant que $k + 1 < \lambda$ et décroît dès que $k + 1 > \lambda$. 
    $$\boxed{\text{maximum en } \lfloor\lambda\rfloor \text{ si } \lambda \notin \mathbb{N}, \qquad \text{en } \lambda - 1 \text{ et } \lambda \text{ si } \lambda \in \mathbb{N}^{*}}$$

    **3.** Pour $\lambda = 0{,}61$, la valeur la plus probable est $0$ : c'est la barre la plus haute de la figure du chapitre, où $109$ des $200$ corps-années n'ont connu aucun décès.
