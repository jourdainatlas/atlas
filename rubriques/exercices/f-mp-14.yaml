  enonce: |
    *La loi de succession de Laplace.* On dispose de $N + 1$ urnes $U_{0}$, …, $U_{N}$ ; l'urne $U_{k}$ contient $k$ boules blanches et $N - k$ boules noires. On choisit une urne au hasard, puis l'on effectue des tirages avec remise dans cette urne.

    **1.** Déterminer la probabilité de l'événement $A_{n}$ : « les $n$ premiers tirages donnent des boules blanches ».

    **2.** Exprimer $\mathbb{P}_{A_{n}}(A_{n + 1})$, puis déterminer sa limite quand $N \to +\infty$.

    **3.** Laplace appliquait ce résultat au lever du soleil. Commenter.
  corrige: |
    On conditionne par l'urne choisie ; quand $N \to +\infty$, les sommes deviennent des sommes de Riemann, et l'urne inconnue se comporte comme une proportion de blanches uniforme sur $[0, 1]$.

    **1.** Les urnes forment un système complet d'événements équiprobables, et dans l'urne $U_{k}$, la probabilité de $n$ blanches consécutives est $\big(\frac{k}{N}\big)^{n}$. 
    $$\boxed{\mathbb{P}(A_{n}) = \frac{1}{N + 1}\sum_{k = 0}^{N} \Big(\frac{k}{N}\Big)^{n}}$$

    **2.** Comme $A_{n + 1} \subset A_{n}$, $\mathbb{P}_{A_{n}}(A_{n + 1}) = \frac{\mathbb{P}(A_{n + 1})}{\mathbb{P}(A_{n})}$. En divisant numérateur et dénominateur par $\frac{N}{N + 1}$, on fait apparaître des sommes de Riemann de $x^{n + 1}$ et $x^{n}$ sur $[0, 1]$ : 
    $$\mathbb{P}_{A_{n}}(A_{n + 1}) = \frac{\frac{1}{N}\sum_{k = 0}^{N} (k/N)^{n + 1}}{\frac{1}{N}\sum_{k = 0}^{N} (k/N)^{n}} \xrightarrow[N \to +\infty]{} \frac{\int_{0}^{1} x^{n + 1}\,\mathrm{d} x}{\int_{0}^{1} x^{n}\,\mathrm{d} x}.$$

    $$\boxed{\lim\limits_{N \to +\infty} \mathbb{P}_{A_{n}}(A_{n + 1}) = \frac{n + 1}{n + 2}}$$

    **3.** Laplace estimait ainsi la probabilité que le soleil se lève demain, sachant qu'il s'est levé chaque jour depuis $n$ jours. Le modèle suppose que l'on ignore tout de la « proportion » de jours où le soleil se lève, considérée comme uniforme a priori : c'est une hypothèse discutable, qui fait de cet exemple un classique de la discussion sur les probabilités a priori.
- id: "mp-14-16"
