  enonce: |
    Décomposer $P = 2X^{4} + X^{2} - 3$ en produit de polynômes irréductibles de $\mathbb{R}[X]$.
  corrige: |
    En posant $Y = X^{2}$, le polynôme $2Y^{2} + Y - 3$ a la racine évidente $1$ et le produit des racines $-\frac{3}{2}$ : $2Y^{2} + Y - 3 = (Y - 1)(2Y + 3)$. Donc $P = (X^{2} - 1)(2X^{2} + 3)$. Le facteur $2X^{2} + 3$ n'a pas de racine réelle, donc il est irréductible dans $\mathbb{R}[X]$ (proposition 14). 
    $$\boxed{P = 2(X - 1)(X + 1)\Big(X^{2} + \frac{3}{2}\Big)}$$
     C'est la forme du théorème 8, avec des facteurs unitaires et le coefficient dominant en tête. Dans $\mathbb{C}[X]$, le dernier facteur se scinde en $\big(X - \mathrm{i}\sqrt{3/2}\big)\big(X + \mathrm{i}\sqrt{3/2}\big)$.
