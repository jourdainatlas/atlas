  enonce: |
    Dans un anneau commutatif $A$, un idéal $I$ différent de $A$ est dit *premier* si, pour tous $x$, $y \in A$, $xy \in I$ entraîne $x \in I$ ou $y \in I$.

    **1.** Déterminer les idéaux premiers de $\mathbb{Z}$.

    **2.** Soit $f : A \to B$ un morphisme surjectif d'anneaux commutatifs. À quelle condition $\mathrm{Ker}\, f$ est-il premier ?
  corrige: |
    **1.** Par le théorème 3, un idéal de $\mathbb{Z}$ distinct de $\mathbb{Z}$ est $n\mathbb{Z}$ avec $n = 0$ ou $n \geqslant 2$. L'idéal $\{0\}$ est premier, car $\mathbb{Z}$ est intègre. Si $n = p$ est premier, $p \mid xy$ entraîne $p \mid x$ ou $p \mid y$ (lemme d'Euclide, chapitre 12 de MPSI). Si $n = ab$ avec $1 < a, b < n$, alors $ab \in n\mathbb{Z}$ alors que $a$, $b \notin n\mathbb{Z}$. 
    $$\boxed{\text{Les idéaux premiers de } \mathbb{Z} \text{ sont } \{0\} \text{ et les } p\mathbb{Z}, \ p \text{ premier.}}$$

    **2.** D'une part, $\mathrm{Ker}\, f \neq A$ équivaut à $1 \notin \mathrm{Ker}\, f$, soit $1_{B} \neq 0_{B}$ : l'anneau $B$ n'est pas nul. D'autre part, la seconde condition s'écrit « $f(x)f(y) = 0$ entraîne $f(x) = 0$ ou $f(y) = 0$ », et comme $f$ est surjective, tout couple $(b, b')$ de $B^{2}$ est de la forme $\big(f(x), f(y)\big)$ : elle dit que $B$ n'a pas de diviseur de zéro. 
    $$\boxed{\mathrm{Ker}\, f \text{ est premier} \iff B \text{ est intègre}}$$
     Avec la surjection canonique $\pi : \mathbb{Z} \to \mathbb{Z}/n\mathbb{Z}$, on retrouve, pour $n \geqslant 2$, que $n\mathbb{Z}$ est premier si et seulement si $\mathbb{Z}/n\mathbb{Z}$ est intègre, c'est-à-dire si et seulement si $n$ est premier (théorème 4).
- id: "mp-01-29"
  feuille: "f-mp-01"
  numero: 29
