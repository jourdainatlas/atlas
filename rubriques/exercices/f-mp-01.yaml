  enonce: |
    On munit $\mathbb{Z}^{2}$ de sa structure d'anneau produit. Pour tout $d \in \mathbb{N}$, on note 
    $$A_{d} = \{(x, y) \in \mathbb{Z}^{2} \mid x \equiv y \;[d]\},$$
     avec la convention que la congruence modulo $0$ est l'égalité. Montrer que tout sous-anneau de $\mathbb{Z}^{2}$ est égal à $A_{d}$ pour un certain $d \in \mathbb{N}$. On pourra commencer par s'intéresser à l'intersection d'un sous-anneau avec $\mathbb{Z} \times \{0\}$.
  corrige: |
    Vérifions d'abord que $A_{d}$ est un sous-anneau : il contient $(1, 1)$, et si $x \equiv y$ et $x' \equiv y' \;[d]$, alors $x - x' \equiv y - y'$ et $xx' \equiv yy' \;[d]$ (chapitre 12 de MPSI), ce qui vaut encore pour $d = 0$.

    Soit $R$ un sous-anneau de $\mathbb{Z}^{2}$. L'ensemble $\{x \in \mathbb{Z} \mid (x, 0) \in R\}$ est un sous-groupe de $\mathbb{Z}$, intersection de $R$ avec le sous-groupe $\mathbb{Z} \times \{0\}$ lue sur la première coordonnée : il s'écrit $d\mathbb{Z}$ avec $d \in \mathbb{N}$. Comme $(1, 1) \in R$, on a $y(1, 1) = (y, y) \in R$ pour tout $y \in \mathbb{Z}$. Pour $(x, y) \in \mathbb{Z}^{2}$, 
    $$(x, y) = (y, y) + (x - y, 0),$$
     donc $(x, y) \in R$ si et seulement si $(x - y, 0) \in R$, c'est-à-dire $x - y \in d\mathbb{Z}$, ou encore $x \equiv y \;[d]$. 
    $$\boxed{\text{Tout sous-anneau de } \mathbb{Z}^{2} \text{ est l'un des } A_{d}, \ d \in \mathbb{N}.}$$
     L'entier $d$ est déterminé par $R$, puisque $d\mathbb{Z}$ se lit sur $R$ : les $A_{d}$ sont deux à deux distincts. On a $A_{1} = \mathbb{Z}^{2}$ et $A_{0} = \{(x, x) \mid x \in \mathbb{Z}\}$, la diagonale. On remarque que la stabilité par produit n'a pas servi : les sous-groupes de $\mathbb{Z}^{2}$ qui contiennent $(1, 1)$ sont déjà les $A_{d}$.
