  enonce: |
    **1.** Montrer que, pour tout $n \in \mathbb{N}$, il existe un unique polynôme $P_{n} \in \mathbb{Z}[X]$, unitaire de degré $n$, tel que $P_{n}\big(X + \frac{1}{X}\big) = X^{n} + \frac{1}{X^{n}}$ dans $\mathbb{Q}(X)$.

    **2.** Soit $r \in \mathbb{Q}$ tel que $\cos(\pi r) \in \mathbb{Q}$. Montrer que $2\cos(\pi r) \in \mathbb{Z}$. On pourra utiliser l'exercice 57.

    **3.** En déduire l'ensemble des $r \in \mathbb{Q}$ tels que $\cos(\pi r) \in \mathbb{Q}$.
  corrige: |
    **1.** Pour $n = 0$, la relation impose $P_{0} = 2$, qui n'est pas unitaire : c'est pourquoi l'énoncé se limite à $n \geqslant 1$.

    *Existence.* Posons $P_{0} = 2$, $P_{1} = X$ et $P_{n+1} = XP_{n} - P_{n-1}$ pour $n \geqslant 1$. Par récurrence, $P_{n}$ est à coefficients entiers, unitaire de degré $n$ pour $n \geqslant 1$ ($P_{2} = X^{2} - 2$ l'est, et l'hérédité vient de ce que $XP_{n}$ est unitaire de degré $n + 1$ et $P_{n-1}$ de degré $n - 1$). Enfin, si la relation est vraie aux rangs $n - 1$ et $n$, elle l'est au rang $n + 1$, puisque 
    $$\Big(X + \frac{1}{X}\Big)\Big(X^{n} + \frac{1}{X^{n}}\Big) = X^{n+1} + \frac{1}{X^{n+1}} + X^{n-1} + \frac{1}{X^{n-1}}.$$

    *Unicité.* Si $P$ et $Q$ conviennent, alors $R = P - Q$ vérifie $R\big(t + \frac{1}{t}\big) = 0$ pour tout réel $t > 0$. Comme $t + \frac{1}{t}$ prend toutes les valeurs de $[2\,, +\infty[$, le polynôme $R$ a une infinité de racines : $R = 0$. 
    $$\boxed{P_{n} \text{ existe et est unique : } P_{1} = X, \ P_{2} = X^{2} - 2, \ P_{3} = X^{3} - 3X, \ldots}$$

    **2.** Écrivons $r = \frac{a}{b}$ avec $b \in \mathbb{N}^{*}$, et $z = \mathrm{e}^{\mathrm{i}\pi r}$, de sorte que $z + \frac{1}{z} = 2\cos(\pi r)$ et $z^{2b} = \mathrm{e}^{2\mathrm{i}\pi a} = 1$. En évaluant l'égalité de la question 1 en $z \neq 0$, au rang $2b$, 
    $$P_{2b}\big(2\cos(\pi r)\big) = z^{2b} + \frac{1}{z^{2b}} = 2.$$
     Le nombre rationnel $2\cos(\pi r)$ est donc racine du polynôme $P_{2b} - 2$, unitaire à coefficients entiers. Par l'exercice 57, écrit sous forme irréductible $\frac{p}{q}$ avec $q \geqslant 1$, son dénominateur divise le coefficient dominant $1$. 
    $$\boxed{2\cos(\pi r) \in \mathbb{Z}}$$

    **3.** L'entier $2\cos(\pi r)$ appartient à $[-2\,, 2]$, donc $\cos(\pi r) \in \big\{-1, -\frac{1}{2}, 0, \frac{1}{2}, 1\big\}$. Ces valeurs sont atteintes exactement pour $\pi r \equiv \pi$ ou $0$, $\pm\frac{\pi}{2}$, $\pm\frac{\pi}{3}$, $\pm\frac{2\pi}{3}$ modulo $2\pi$, c'est-à-dire pour $r$ entier, demi-entier, ou de la forme $\frac{k}{3}$ avec $k$ entier. 
    $$\boxed{\{r \in \mathbb{Q} \mid \cos(\pi r) \in \mathbb{Q}\} = \tfrac{1}{2}\mathbb{Z} \cup \tfrac{1}{3}\mathbb{Z}}$$
     *À retenir.* Les seuls angles « rationnels » (en fractions de $\pi$) dont le cosinus est rationnel sont les multiples de $\frac{\pi}{2}$ et de $\frac{\pi}{3}$. Ainsi $\cos\frac{\pi}{5} = \frac{1 + \sqrt{5}}{4}$ est irrationnel, ce que le résultat prévoyait sans calcul. Les polynômes $P_{n}$ sont liés aux polynômes de Tchebychev $T_{n}$, définis par $T_{n}(\cos\theta) = \cos(n\theta)$, par la relation $P_{n}(2x) = 2T_{n}(x)$.
- id: "mp-01-75"
