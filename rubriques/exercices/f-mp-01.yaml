  enonce: |
    Montrer que, dans $\mathbb{Z}$, toute suite croissante d'idéaux est stationnaire.
  corrige: |
    Soit $(I_{k})_{k \in \mathbb{N}}$ une suite croissante d'idéaux de $\mathbb{Z}$, et $I = \bigcup_{k} I_{k}$. C'est un idéal : il contient $0$, et si $x \in I_{k}$ et $y \in I_{\ell}$, alors $x$ et $y$ appartiennent tous deux à $I_{\max(k, \ell)}$, qui contient $x - y$ et $ax$ pour tout $a \in \mathbb{Z}$. Par le théorème 3, $I = a\mathbb{Z}$, et $a$ appartient à l'un des $I_{k_{0}}$. Pour $k \geqslant k_{0}$, on a alors 
    $$I = a\mathbb{Z} \subset I_{k_{0}} \subset I_{k} \subset I,$$

    $$\boxed{I_{k} = I_{k_{0}} \text{ pour tout } k \geqslant k_{0} : \text{la suite est stationnaire.}}$$
     *Piège.* La réunion de deux idéaux n'est pas un idéal en général ($2\mathbb{Z} \cup 3\mathbb{Z}$ ne contient pas $2 + 3$) : c'est la croissance de la suite qui rend la réunion stable par somme. L'exercice 49 transpose mot pour mot l'argument à $\mathbb{K}[X]$.
- id: "mp-01-28"
  feuille: "f-mp-01"
