  source: "TD 2 Algèbre générale (Sainte-Geneviève), exercice 18"
  page_enonce: 6
  page_corrige: 17
  enonce: |
    Résoudre l'équation $x^{2} = \overline{1}$ dans l'anneau $\mathbb{Z}/666\mathbb{Z}$.
  corrige: |
    On a $666 = 2 \times 9 \times 37$, et par le théorème 5 (cas de trois facteurs premiers entre eux deux à deux), $x = \overline{k}$ vérifie $x^{2} = \overline{1}$ si et seulement si $k^{2} \equiv 1$ modulo $2$, modulo $9$ et modulo $37$.

    • Modulo $2$, la condition est $k$ impair.

    • Modulo $9$, la condition $9 \mid (k - 1)(k + 1)$ impose $3 \mid k - 1$ ou $3 \mid k + 1$, mais pas les deux, puisque leur différence est $2$ : c'est donc $9$ tout entier qui divise $k - 1$ ou $k + 1$, soit $k \equiv \pm 1 \;[9]$.

    • Modulo $37$, qui est premier, $\mathbb{Z}/37\mathbb{Z}$ est intègre et $k \equiv \pm 1 \;[37]$.

    Les deux premières conditions s'écrivent $k \equiv \pm 1 \;[18]$. Il y a $2 \times 2 = 4$ solutions. Outre $\pm\overline{1}$, cherchons $k \equiv 1 \;[18]$ et $k \equiv -1 \;[37]$ : avec $k = 1 + 18t$, il faut $18t \equiv -2$, soit $9t \equiv -1 \;[37]$ ; or $9 \times 33 = 297 = 8 \times 37 + 1$, donc $t \equiv -33 \equiv 4$, et $k = 73$. La dernière solution est l'opposée $-73 \equiv 593$. 
    $$\boxed{x \in \{\overline{1}, \overline{73}, \overline{593}, \overline{665}\}}$$
     On vérifie $73^{2} = 5\,329 = 8 \times 666 + 1$ ✓. L'exercice 41 généralise ce dénombrement.
- id: "mp-01-37"
  feuille: "f-mp-01"
  numero: 37
  partie: "Les anneaux $\\mathbb{Z}/n\\mathbb{Z}$"
  etoiles: 2
  types: [Calcul]
  mots_cles: [anneaux Z/nZ]
  noeuds: [z-zn]
  notions: [anneau-zn]
  source: "bibmath, Anneaux, exercice 14"
  page_enonce: 6
  page_corrige: 17
  enonce: |
    Résoudre les systèmes suivants, d'inconnue $(x, y)$ : 
    $$\text{dans } \mathbb{Z}/13\mathbb{Z} : \left\{ \begin{array}{l} \overline{2}x + \overline{3}y = \overline{4} \\ \overline{3}x + \overline{2}y = \overline{5} \end{array} \right. \qquad \text{dans } \mathbb{Z}/18\mathbb{Z} : \left\{ \begin{array}{l} \overline{4}x + \overline{7}y = \overline{1} \\ \overline{5}x + \overline{2}y = \overline{2} \end{array} \right. \qquad \text{dans } \mathbb{Z}/18\mathbb{Z} : \left\{ \begin{array}{l} \overline{2}x + \overline{3}y = \overline{1} \\ \overline{3}x + \overline{4}y = \overline{2} \end{array} \right.$$
  corrige: |
    On combine les équations comme dans la méthode du pivot (chapitre 3 de MPSI), en prenant garde que diviser n'est possible que par un inversible.

    **Premier système.** En formant $2L_{1} - 3L_{2}$, on obtient $-\overline{5}x = -\overline{7}$, soit $\overline{5}x = \overline{7}$ ; comme $\overline{5}^{-1} = \overline{8}$ dans $\mathbb{Z}/13\mathbb{Z}$ (car $40 = 3 \times 13 + 1$), $x = \overline{56} = \overline{4}$. La première équation donne alors $\overline{3}y = \overline{4} - \overline{8} = \overline{9}$, et $y = \overline{3}$, puisque $\overline{3}$ est inversible. Le déterminant $\overline{4} - \overline{9} = -\overline{5}$ est inversible, donc les combinaisons effectuées sont réversibles et le couple trouvé est l'unique solution, ce que confirme la seconde équation : $12 + 6 = 18 \equiv 5$ ✓. 
    $$\boxed{(x, y) = (\overline{4}, \overline{3})}$$

    **Deuxième système.** La combinaison $2L_{1} - 7L_{2}$ donne $(8 - 35)x = 2 - 14$, soit $-\overline{27}x = -\overline{12}$, c'est-à-dire $\overline{9}x = \overline{12}$ dans $\mathbb{Z}/18\mathbb{Z}$. Or $9k$ est congru à $0$ ou à $9$ modulo $18$, jamais à $12$. 
    $$\boxed{\text{Pas de solution}}$$

    **Troisième système.** La combinaison $4L_{1} - 3L_{2}$ donne $-x = -\overline{2}$, et la combinaison $3L_{1} - 2L_{2}$ donne $y = \overline{3} - \overline{4} = -\overline{1}$. Le déterminant $8 - 9 = -1$ est inversible : le système équivaut au système obtenu. 
    $$\boxed{(x, y) = (\overline{2}, \overline{17})}$$
     On vérifie : $4 + 51 = 55 = 3 \times 18 + 1$ et $6 + 68 = 74 = 4 \times 18 + 2$ ✓.

    *Piège.* Dans le deuxième système, le déterminant $8 - 35 = -27 \equiv 9$ n'est ni nul ni inversible modulo $18$ : l'alternative « une solution unique ou aucune ou une infinité » du cas d'un corps ne s'applique pas. Selon le second membre, un tel système peut aussi avoir plusieurs solutions.
- id: "mp-01-38"
  feuille: "f-mp-01"
  numero: 38
  partie: "Les anneaux $\\mathbb{Z}/n\\mathbb{Z}$"
  etoiles: 2
  types: [Calcul]
  mots_cles: [anneaux Z/nZ, congruences et Z/nZ]
  noeuds: [z-zn]
  notions: [anneau-zn]
  source: "TD 3 Arithmétique (Sainte-Geneviève), exercice 41"
  page_enonce: 6
  page_corrige: 18
  enonce: |
    Déterminer les entiers naturels $n$ tels que $n\,3^{n} \equiv 1 \;[7]$.
  corrige: |
    Dans $\mathbb{Z}/7\mathbb{Z}$, la classe $\overline{3}$ est d'ordre $6$, puisque ses puissances successives sont $\overline{3}, \overline{2}, \overline{6}, \overline{4}, \overline{5}, \overline{1}$. Ainsi $3^{n} \bmod 7$ ne dépend que de $n \bmod 6$ (proposition 4 (i)), et $n\,3^{n} \bmod 7$ ne dépend que du couple $(n \bmod 6, n \bmod 7)$, donc de $n \bmod 42$ (théorème 5). Pour chaque reste $r = n \bmod 6$, la condition s'écrit $n \equiv \overline{3}^{-r} \;[7]$ :

    $$\begin{array}{|c|c|c|c|c|c|c|} \hline n \bmod 6 & 0 & 1 & 2 & 3 & 4 & 5 \\ \hline 3^{n} \bmod 7 & 1 & 3 & 2 & 6 & 4 & 5 \\ \hline n \bmod 7\text{ imposé} & 1 & 5 & 4 & 6 & 2 & 3 \\ \hline n \bmod 42 & 36 & 19 & 32 & 27 & 16 & 17 \\ \hline \end{array}$$

    La dernière ligne se lit par le théorème chinois : $36$ est le seul entier de $\llbracket 0\,,41 \rrbracket$ multiple de $6$ et congru à $1$ modulo $7$, et ainsi de suite. 
    $$\boxed{n\,3^{n} \equiv 1 \;[7] \iff n \equiv 16, 17, 19, 27, 32 \text{ ou } 36 \;[42]}$$
     Par exemple, $16 \times 3^{16} = 688\,747\,536 = 7 \times 98\,392\,505 + 1$ ✓. Un test exhaustif pour $n < 500$ confirme la liste.
- id: "mp-01-39"
  feuille: "f-mp-01"
  numero: 39
  partie: "Les anneaux $\\mathbb{Z}/n\\mathbb{Z}$"
  etoiles: 2
  types: [Calcul]
  mots_cles: [anneaux Z/nZ, idéaux]
  noeuds: [z-zn, a-ideal]
  notions: [anneau-zn, ideal]
  source: "TD 2 Algèbre générale (Sainte-Geneviève), exercice 20"
  page_enonce: 6
  page_corrige: 18
  enonce: |
    Soit $n \geqslant 2$. Déterminer les idéaux de l'anneau $\mathbb{Z}/n\mathbb{Z}$.
  corrige: |
    Soit $\pi : \mathbb{Z} \to \mathbb{Z}/n\mathbb{Z}$ la surjection canonique, et $I$ un idéal de $\mathbb{Z}/n\mathbb{Z}$. L'image réciproque $\pi^{-1}(I)$ est un idéal de $\mathbb{Z}$, car $\pi$ est un morphisme d'anneaux, et il contient $\mathrm{Ker}\, \pi = n\mathbb{Z}$ : par le théorème 3, $\pi^{-1}(I) = d\mathbb{Z}$ avec $d \geqslant 1$ et $d \mid n$. Comme $\pi$ est surjective, $I = \pi(d\mathbb{Z}) = \overline{d}\,\mathbb{Z}/n\mathbb{Z}$. Réciproquement, pour tout diviseur $d$ de $n$, la partie $\overline{d}\,\mathbb{Z}/n\mathbb{Z}$ est un idéal (proposition 8), d'image réciproque $d\mathbb{Z} + n\mathbb{Z} = d\mathbb{Z}$, ce qui montre que deux diviseurs distincts donnent deux idéaux distincts. 
    $$\boxed{\text{Les idéaux de } \mathbb{Z}/n\mathbb{Z} \text{ sont les } \overline{d}\,\mathbb{Z}/n\mathbb{Z}, \ d \text{ diviseur positif de } n.}$$
     L'idéal $\overline{d}\,\mathbb{Z}/n\mathbb{Z}$ a $\frac{n}{d}$ éléments. Ce sont exactement les sous-groupes de l'exercice 1 : dans $\mathbb{Z}/n\mathbb{Z}$, tout sous-groupe additif est un idéal, car $\overline{a}x = x + \cdots + x$ pour $a \geqslant 0$. Ainsi $\mathbb{Z}/12\mathbb{Z}$ a six idéaux.
- id: "mp-01-40"
  feuille: "f-mp-01"
  numero: 40
  partie: "Les anneaux $\\mathbb{Z}/n\\mathbb{Z}$"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [anneaux Z/nZ]
  noeuds: [z-zn]
