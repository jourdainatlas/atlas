  page_enonce: 4
  page_corrige: 10
  enonce: |
    **1.** Montrer que tout endomorphisme de l'anneau $\mathbb{Z}$ est l'identité. Même question pour $\mathbb{Q}$.

    **2.** Soit $\phi$ un endomorphisme de l'anneau $\mathbb{R}$.

    **(a)** Montrer que $\phi(x) = x$ pour tout $x \in \mathbb{Q}$.

    **(b)** Montrer que $\phi(\mathbb{R}_{+}^{*}) \subset \mathbb{R}_{+}^{*}$, et en déduire que $\phi$ est croissante.

    **(c)** En déduire que $\phi = \mathrm{id}_{\mathbb{R}}$.

    **3.** Montrer qu'il y a exactement deux endomorphismes $\phi$ de l'anneau $\mathbb{C}$ tels que $\phi(x) = x$ pour tout $x \in \mathbb{R}$.
  corrige: |
    **1.** Par l'exercice 14, le seul morphisme d'anneaux de $\mathbb{Z}$ dans $\mathbb{Z}$ est $n \mapsto n \cdot 1 = n$. Soit $\phi$ un endomorphisme de $\mathbb{Q}$ ; il coïncide avec l'identité sur $\mathbb{Z}$, par le même argument. Pour $p \in \mathbb{Z}$ et $q \in \mathbb{N}^{*}$, on a $q\,\phi\big(\frac{p}{q}\big) = \phi(q)\,\phi\big(\frac{p}{q}\big) = \phi(p) = p$. 
    $$\boxed{\text{Les seuls endomorphismes de } \mathbb{Z} \text{ et de } \mathbb{Q} \text{ sont les identités.}}$$

    **2.(a)** Le calcul de la question 1 vaut dans $\mathbb{R}$ : $\phi(x) = x$ pour tout $x \in \mathbb{Q}$.

    **(b)** Soit $x > 0$. Alors $\phi(x) = \phi\big(\sqrt{x}\big)^{2} \geqslant 0$, et $\phi(x) \neq 0$, puisque $\phi(x)\phi\big(\frac{1}{x}\big) = \phi(1) = 1$ : $\phi(x) > 0$. Si $x < y$, alors $\phi(y) - \phi(x) = \phi(y - x) > 0$. 
    $$\boxed{\phi(\mathbb{R}_{+}^{*}) \subset \mathbb{R}_{+}^{*}, \text{ et } \phi \text{ est strictement croissante}}$$

    **(c)** Supposons $\phi(x) < x$ pour un certain réel $x$. Par densité de $\mathbb{Q}$ dans $\mathbb{R}$ (chapitre 7 de MPSI), il existe $r \in \mathbb{Q}$ tel que $\phi(x) < r < x$ ; la croissance donne $r = \phi(r) \leqslant \phi(x)$, ce qui est absurde. Le cas $\phi(x) > x$ est symétrique. 
    $$\boxed{\phi = \mathrm{id}_{\mathbb{R}}}$$
     *À retenir.* L'ordre de $\mathbb{R}$ est défini par sa structure d'anneau, puisque les réels positifs sont les carrés : c'est pourquoi un endomorphisme d'anneau est automatiquement croissant, sans aucune hypothèse de continuité.

    **3.** Soit $\phi$ un endomorphisme de $\mathbb{C}$ qui fixe les réels. Alors $\phi(\mathrm{i})^{2} = \phi(\mathrm{i}^{2}) = \phi(-1) = -1$, donc $\phi(\mathrm{i}) \in \{\mathrm{i}, -\mathrm{i}\}$, et pour $a$, $b$ réels, $\phi(a + \mathrm{i} b) = a + b\,\phi(\mathrm{i})$ : $\phi$ est l'identité ou la conjugaison. Les deux sont des morphismes d'anneaux (chapitre 4 de MPSI pour la conjugaison). 
    $$\boxed{\text{Les endomorphismes de } \mathbb{C} \text{ qui fixent } \mathbb{R} \text{ sont } \mathrm{id}_{\mathbb{C}} \text{ et } z \mapsto \overline{z}}$$
- id: "mp-01-21"
  feuille: "f-mp-01"
  numero: 21
  partie: "Compléments sur les anneaux"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [anneaux, idéaux]
  noeuds: [a-anneau, a-ideal]
  notions: [ideal]
  source: "bibmath, Anneaux, exercice 5"
  page_enonce: 4
  page_corrige: 11
  enonce: |
    Soit $A = \mathcal{C}([0\,,1], \mathbb{R})$, $B = \mathcal{C}^{1}([0\,,1], \mathbb{R})$ et $I = \{f \in A \mid f(0) = 0\}$.

    **1.** Montrer que $A$, muni de la somme et du produit des fonctions, est un anneau.

    **2.** Montrer que $B$ est un sous-anneau de $A$. Est-ce un idéal de $A$ ?

    **3.** Montrer que $I$ est un idéal de $A$. Est-ce un sous-anneau de $A$ ?

    **4.** Montrer que $I$ est maximal : si $J$ est un idéal de $A$ tel que $I \subset J \subset A$, alors $J = I$ ou $J = A$.
  corrige: |
    **1.** L'ensemble $\mathcal{F}([0\,,1], \mathbb{R})$ des fonctions de $[0\,,1]$ dans $\mathbb{R}$ est un anneau commutatif (chapitre 11 de MPSI), et $A$ en est un sous-anneau : il contient la fonction constante $1$, et la différence et le produit de deux fonctions continues sont continus (chapitre 8 de MPSI).

    **2.** De même, $B$ contient $1$ et il est stable par différence et par produit, grâce à $(fg)' = f'g + fg'$ (chapitre 9 de MPSI) : c'est un sous-anneau de $A$. Ce n'est pas un idéal : un idéal qui contient $1$ contient $a \cdot 1 = a$ pour tout $a$, donc est l'anneau tout entier, alors que $B \neq A$, la fonction $x \mapsto \big|x - \frac{1}{2}\big|$ étant continue sans être dérivable en $\frac{1}{2}$. 
    $$\boxed{B \text{ est un sous-anneau de } A, \text{ mais pas un idéal de } A}$$

    **3.** L'application $f \mapsto f(0)$ est un morphisme d'anneaux de $A$ dans $\mathbb{R}$, de noyau $I$ : c'est un idéal par la proposition 7 (i). Il ne contient pas la fonction constante $1$, donc ce n'est pas un sous-anneau. 
    $$\boxed{I \text{ est un idéal de } A, \text{ mais pas un sous-anneau de } A}$$
     Les deux questions illustrent la même remarque : un sous-anneau contient $1$, et un idéal qui contient $1$ est l'anneau entier. Les seuls idéaux qui sont des sous-anneaux sont donc les anneaux eux-mêmes.

    **4.** Soit $J$ un idéal tel que $I \subset J$ et $J \neq I$, et $g \in J \setminus I$, de sorte que $g(0) \neq 0$. On écrit 
    $$1 = \Big(1 - \frac{g}{g(0)}\Big) + \frac{1}{g(0)}\,g.$$
     La première fonction s'annule en $0$, donc appartient à $I \subset J$, et la seconde appartient à $J$, qui est un idéal. Donc $1 \in J$, et $J = A$. 
    $$\boxed{I \text{ est un idéal maximal de } A}$$
     L'exercice 54 donnera la même conclusion pour l'idéal $X\mathbb{K}[X]$, avec le même argument : on retire à un élément de $J$ sa « valeur en $0$ ».
- id: "mp-01-22"
  feuille: "f-mp-01"
  numero: 22
  partie: "Compléments sur les anneaux"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [anneaux, idéaux, corps]
  noeuds: [a-anneau, a-ideal, a-corps]
  notions: [ideal]
  source: "bibmath, Anneaux, exercice 6"
  page_enonce: 4
  page_corrige: 11
  enonce: |
    Soit $A$ un anneau commutatif.

    **1.** On suppose que les seuls idéaux de $A$ sont $\{0\}$ et $A$, et que $A$ n'est pas l'anneau nul. Montrer que $A$ est un corps.

    **2.** On suppose que $A$ est intègre et n'a qu'un nombre fini d'idéaux. Montrer que $A$ est un corps.
  corrige: |
    **1.** Soit $x \neq 0$. L'idéal $xA$ (proposition 8) contient $x \neq 0$, donc il est égal à $A$ ; en particulier $1 \in xA$, et $x$ a un inverse. L'anneau $A$ est commutatif, non nul, et tous ses éléments non nuls sont inversibles. 
    $$\boxed{A \text{ est un corps}}$$

    **2.** Un anneau intègre est commutatif et non nul. Soit $x \neq 0$. Les idéaux $x^{k}A$, pour $k \in \mathbb{N}$, ne prennent qu'un nombre fini de valeurs : il existe $k < \ell$ tels que $x^{k}A = x^{\ell}A$. En particulier $x^{k} = x^{\ell}a$ pour un $a \in A$, soit $x^{k}\big(1 - x^{\ell - k}a\big) = 0$. Comme $x^{k} \neq 0$ et que $A$ est intègre, $1 = x^{\ell-k}a = x \cdot x^{\ell-k-1}a$. 
    $$\boxed{A \text{ est un corps}}$$
     En particulier, tout anneau intègre fini est un corps, ce que l'exercice 67 démontre aussi directement. L'hypothèse d'intégrité est nécessaire : $\mathbb{Z}/4\mathbb{Z}$ n'a que trois idéaux, et ce n'est pas un corps.
- id: "mp-01-23"
  feuille: "f-mp-01"
  numero: 23
  partie: "Compléments sur les anneaux"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [anneaux, idéaux]
  noeuds: [a-anneau, a-ideal]
  notions: [ideal]
  source: "bibmath, Anneaux, exercice 8"
  page_enonce: 4
  page_corrige: 12
  enonce: |
    Soit $I$ et $J$ deux idéaux d'un anneau commutatif $A$. On note $I + J = \{i + j \mid i \in I, \ j \in J\}$, et $I \cdot J$ l'ensemble des sommes finies d'éléments de la forme $ij$, avec $i \in I$ et $j \in J$. On dit que $I$ et $J$ sont *étrangers* si $I + J = A$.

    **1.** Montrer que $I \cdot J$ est un idéal de $A$.

    **2.** Montrer que $I \cdot J \subset I \cap J$.

    **3.** Montrer que $(I + J) \cdot (I \cap J) \subset I \cdot J$.

    **4.** Montrer que si $I$ et $J$ sont étrangers, alors $I \cdot J = I \cap J$. Que retrouve-t-on pour $A = \mathbb{Z}$ ?
  corrige: |
    **1.** La partie $I \cdot J$ contient $0 = 0 \times 0$. La somme de deux sommes finies de produits $ij$ en est encore une, et l'opposé de $\sum i_{k}j_{k}$ est $\sum (-i_{k})j_{k}$. Pour $a \in A$, on a $a\sum i_{k}j_{k} = \sum (ai_{k})j_{k}$, avec $ai_{k} \in I$. 
    $$\boxed{I \cdot J \text{ est un idéal de } A}$$

    **2.** Pour $i \in I$ et $j \in J$, le produit $ij$ appartient à $I$ et à $J$, qui sont des idéaux ; l'intersection $I \cap J$, qui est un idéal (proposition 7 (ii)), contient donc toutes les sommes de tels produits. 
    $$\boxed{I \cdot J \subset I \cap J}$$

    **3.** Un élément de $(I + J) \cdot (I \cap J)$ est une somme de termes $(i + j)c$, avec $i \in I$, $j \in J$ et $c \in I \cap J$. Or $ic$ est un produit d'un élément de $I$ par un élément de $J$, et $jc = cj$ aussi, puisque $c \in I$ : chaque terme est dans $I \cdot J$, qui est stable par somme. 
    $$\boxed{(I + J) \cdot (I \cap J) \subset I \cdot J}$$

    **4.** Si $I + J = A$, alors $(I + J) \cdot (I \cap J) = A \cdot (I \cap J)$ contient $1 \cdot c = c$ pour tout $c \in I \cap J$. Les questions 2 et 3 donnent $I \cap J \subset I \cdot J \subset I \cap J$. 
    $$\boxed{I + J = A \implies I \cdot J = I \cap J}$$
     Pour $A = \mathbb{Z}$, $I = a\mathbb{Z}$ et $J = b\mathbb{Z}$ avec $a$, $b \geqslant 1$, on a $I + J = (a \wedge b)\mathbb{Z}$, $I \cap J = (a \vee b)\mathbb{Z}$ (théorème 3 et chapitre 12 de MPSI) et $I \cdot J = ab\mathbb{Z}$. Les idéaux sont étrangers si et seulement si $a \wedge b = 1$, et l'on retrouve que *le PPCM de deux entiers premiers entre eux est leur produit*. Pour $a$ et $b$ quelconques, les questions 2 et 3 disent seulement que $ab$ divise $(a \wedge b)(a \vee b)$ et que $a \vee b$ divise $ab$ : l'égalité $(a \wedge b)(a \vee b) = ab$ du chapitre 12 de MPSI demande un argument de plus.
