  page_corrige: 2
  enonce: |
    Soit $(G, \cdot)$ un groupe fini dont tous les éléments sont d'ordre au plus $2$. Montrer que $G$ est abélien. Que peut-on dire de $\operatorname{card}(G)$ ? Montrer que $G$ est isomorphe à un groupe produit $(\mathbb{Z}/2\mathbb{Z})^{n}$.
  corrige: |
    Tout élément $x$ vérifie $x^{2} = e$, c'est-à-dire $x = x^{-1}$. Pour $x$, $y \in G$, on a donc 
    $$xy = (xy)^{-1} = y^{-1}x^{-1} = yx,$$
     et $G$ est abélien. Choisissons une partie génératrice $\{x_{1}, \dots, x_{n}\}$ de $G$ de cardinal minimal, qui existe puisque $G$, fini, s'engendre lui-même ; si $G = \{e\}$, on prend la partie vide et $n = 0$. Considérons 
    $$\begin{array}{r|ccl} f : & (\mathbb{Z}/2\mathbb{Z})^{n} & \longrightarrow & G \\ & (\overline{k_{1}}, \dots, \overline{k_{n}}) & \longmapsto & x_{1}^{k_{1}}x_{2}^{k_{2}} \cdots x_{n}^{k_{n}} \end{array}$$
     Elle est bien définie, puisque $x_{i}^{k}$ ne dépend que de la parité de $k$, et c'est un morphisme de groupes parce que $G$ est abélien : on peut regrouper les facteurs d'un produit selon leur indice. Elle est surjective : par la proposition 1 (i), tout élément de $G$ est un produit de $x_{i}$ et de leurs inverses, qu'on peut réordonner puisque $G$ est abélien, et où l'on remplace $x_{i}^{-1}$ par $x_{i}$. Elle est injective : si $f(\overline{k_{1}}, \dots, \overline{k_{n}}) = e$ avec un $k_{j}$ impair, alors $x_{j}$ s'écrit comme produit des autres générateurs, et l'on pourrait retirer $x_{j}$ de la partie génératrice, contrairement à sa minimalité. 
    $$\boxed{G \text{ est abélien}, \qquad G \simeq (\mathbb{Z}/2\mathbb{Z})^{n}, \qquad \operatorname{card}(G) = 2^{n}}$$
     Le cardinal d'un tel groupe est donc une puissance de $2$. On peut aussi voir $G$ comme un espace vectoriel sur le corps $\mathbb{Z}/2\mathbb{Z}$, la loi externe étant $\overline{k} \cdot x = x^{k}$ ; la partie génératrice minimale est alors une base, et l'isomorphisme ci-dessus est celui que fournit le choix d'une base. C'est le point de vue que l'exercice 10 utilise.
- id: "mp-01-05"
  feuille: "f-mp-01"
  numero: 5
  partie: "Compléments sur les groupes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [groupes]
  noeuds: [a-sous-groupe, gf-cycliques]
  notions: [sous-groupe-engendre, ordre-element]
  source: "Algèbre générale (LLG), exercice 21"
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Soit $G$ un groupe multiplicatif fini de cardinal $n$, de neutre $e$, et $S$ une partie non vide de $G$ contenant $e$. Pour $k \in \mathbb{N}^{*}$, on pose 
    $$A_{k} = \{s_{1}s_{2} \cdots s_{k} \mid (s_{1}, \dots, s_{k}) \in S^{k}\} \qquad\text{et}\qquad a_{k} = \operatorname{card}(A_{k}).$$

    **1.** Montrer que la suite $(a_{k})_{k \in \mathbb{N}^{*}}$ est croissante.

    **2.** Montrer que $a_{k+1} = a_{k}$ pour tout $k \geqslant n$.

    **3.** Montrer que $A_{n}$ est un sous-groupe de $G$.
  corrige: |
    On note que $A_{k}A_{\ell} = \{xy \mid x \in A_{k}, \ y \in A_{\ell}\} = A_{k + \ell}$, par simple concaténation des listes.

    **1.** Pour $x = s_{1} \cdots s_{k} \in A_{k}$, on a $x = s_{1} \cdots s_{k}\,e$, et $e \in S$ : donc $x \in A_{k+1}$. Ainsi $A_{k} \subset A_{k+1}$, et 
    $$\boxed{a_{k} \leqslant a_{k+1} \text{ pour tout } k \in \mathbb{N}^{*}}$$

    **2.** Si $a_{k+1} = a_{k}$ pour un certain $k$, l'inclusion de la question 1 est une égalité, $A_{k+1} = A_{k}$, et alors $A_{k+2} = A_{k+1}S = A_{k}S = A_{k+1}$ : la suite $(A_{j})$ est constante à partir du rang $k$. Or la suite $(a_{k})$ ne peut pas croître strictement de $1$ à $n + 1$ : on aurait $a_{n+1} \geqslant a_{1} + n \geqslant n + 1$, alors que $a_{n+1} \leqslant \operatorname{card}(G) = n$. Il existe donc $k_{0} \leqslant n$ tel que $a_{k_{0}+1} = a_{k_{0}}$, et la suite est constante à partir de $k_{0}$, a fortiori à partir de $n$. 
    $$\boxed{a_{k+1} = a_{k} \text{ pour tout } k \geqslant n}$$

    **3.** La partie $A_{n}$ contient $e = e \cdots e$, et elle est stable par produit : $A_{n}A_{n} = A_{2n} = A_{n}$, par la question 2. Soit $x \in A_{n}$, d'ordre $d$ (fini, car $G$ est fini) ; ses puissances $x^{k}$, $k \geqslant 1$, sont dans $A_{n}$ par stabilité, en particulier $x^{d-1} = x^{-1}$ si $d \geqslant 2$, et $x^{-1} = e$ si $d = 1$. 
    $$\boxed{A_{n} \text{ est un sous-groupe de } G}$$
     Ce sous-groupe contient $S$, puisque $s = s\,e \cdots e$, et il est contenu dans $\langle S \rangle$ : c'est $\langle S \rangle$. L'exercice montre que, *dans un groupe fini, tout élément de $\langle S \rangle$ est un produit d'au plus $n$ éléments de $S$*, sans recours aux inverses. La finitude est essentielle : dans $(\mathbb{Z}, +)$, les sommes d'éléments de $S = \{0, 1\}$ ne forment pas un sous-groupe.
- id: "mp-01-06"
  feuille: "f-mp-01"
  numero: 6
  partie: "Compléments sur les groupes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [groupes, "ordre d'un élément"]
  noeuds: [a-sous-groupe, gf-cycliques]
  notions: [sous-groupe-engendre, ordre-element]
  source: "Algèbre générale (LLG), exercice 14, questions 1 à 3"
  page_enonce: 1
  page_corrige: 3
  enonce: |
    **1.** Soit $\sigma \in \mathfrak{S}_{n}$ et $c_{1} \circ \cdots \circ c_{r}$ sa décomposition en produit de cycles à supports disjoints. Calculer l'ordre de $\sigma$ dans le groupe $\mathfrak{S}_{n}$.

    **2.** On note $g(n)$ l'ordre maximal d'un élément de $\mathfrak{S}_{n}$. Montrer que $g$ est croissante, et que 
    $$n \leqslant g(n) \leqslant n!.$$

    **3.** Trouver le plus petit entier $n$ tel que $g(n) > n$.
  corrige: |
    **1.** Notons $\ell_{1}, \dots, \ell_{r}$ les longueurs des cycles $c_{1}, \dots, c_{r}$. Ces cycles ont des supports disjoints, donc commutent (chapitre 17 de MPSI), et pour tout $m \in \mathbb{N}$, $\sigma^{m} = c_{1}^{m} \circ \cdots \circ c_{r}^{m}$. Chaque $c_{i}^{m}$ ne déplace que des éléments du support de $c_{i}$ : les $c_{i}^{m}$ agissent sur des parties disjointes, et leur composée est l'identité si et seulement si chacun d'eux l'est. Un cycle de longueur $\ell$ étant d'ordre $\ell$ (exemple de la section 1.2.4), on obtient par la proposition 4 (i) 
    $$\sigma^{m} = \mathrm{id} \iff \forall i, \ \ell_{i} \mid m \iff \ell_{1} \vee \cdots \vee \ell_{r} \mid m.$$

    $$\boxed{\text{L'ordre de } \sigma \text{ est le PPCM } \ell_{1} \vee \ell_{2} \vee \cdots \vee \ell_{r} \text{ des longueurs des cycles.}}$$

    **2.** Une permutation $\sigma \in \mathfrak{S}_{n}$ d'ordre $g(n)$ se prolonge en une permutation de $\llbracket 1\,,n + 1 \rrbracket$ qui fixe $n + 1$, avec la même décomposition en cycles, donc le même ordre : $g(n + 1) \geqslant g(n)$, et $g$ est croissante. Le cycle $(1\ 2\ \cdots\ n)$ est d'ordre $n$, donc $g(n) \geqslant n$. Enfin, l'ordre de tout élément divise $\operatorname{card}(\mathfrak{S}_{n}) = n!$ (théorème 2). 
    $$\boxed{g \text{ est croissante}, \qquad n \leqslant g(n) \leqslant n!}$$

    **3.** Par la question 1, $g(n)$ est le plus grand PPCM d'une famille d'entiers strictement positifs de somme $n$ (les points fixes comptant comme des cycles de longueur $1$). Pour $n \leqslant 4$, les découpages possibles de $4$ sont $4$, $3 + 1$, $2 + 2$, $2 + 1 + 1$ et $1 + 1 + 1 + 1$, de PPCM $4$, $3$, $2$, $2$ et $1$ : $g(4) = 4$, et de même $g(1) = 1$, $g(2) = 2$, $g(3) = 3$. Pour $n = 5$, la permutation $(1\ 2\ 3)(4\ 5)$ est d'ordre $3 \vee 2 = 6 > 5$. 
    $$\boxed{\text{Le plus petit entier } n \text{ tel que } g(n) > n \text{ est } n = 5, \text{ avec } g(5) = 6.}$$
     Un calcul exhaustif donne les premières valeurs $1, 2, 3, 4, 6, 6, 12, 15, 20, 30$ de $g$ : la fonction croît bien plus vite que $n$, mais bien moins vite que $n!$.
- id: "mp-01-07"
  feuille: "f-mp-01"
  numero: 7
  partie: "Compléments sur les groupes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [groupes, nombres premiers]
  noeuds: [a-sous-groupe, gf-cycliques, z-premiers]
  notions: [sous-groupe-engendre, ordre-element]
  source: "Algèbre générale (LLG), exercice 31"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $G$ un groupe. Un sous-groupe $H$ de $G$ est dit *maximal* lorsque $H \neq G$ et qu'aucun sous-groupe de $G$ n'est compris strictement entre $H$ et $G$. Soit $n \geqslant 2$ ; on note $\varepsilon$ la signature.

    **1.** Montrer que $\{\sigma \in \mathfrak{S}_{n} \mid \varepsilon(\sigma) = 1\}$ est un sous-groupe maximal de $\mathfrak{S}_{n}$.

    **2.** Soit $k \in \llbracket 1\,,n \rrbracket$. Montrer que $\{\sigma \in \mathfrak{S}_{n} \mid \sigma(k) = k\}$ est un sous-groupe maximal de $\mathfrak{S}_{n}$.

    **3.** On suppose que $G$ est fini, et l'on se donne un sous-groupe $H$ de $G$ tel que $\dfrac{\operatorname{card}(G)}{\operatorname{card}(H)}$ soit un nombre premier. Montrer que $H$ est maximal.
  corrige: |
    On commence par la question 3, dont les deux autres sont des cas particuliers ou des variantes.

    **3.** Notons $p = \frac{\operatorname{card}(G)}{\operatorname{card}(H)}$, premier ; en particulier $p > 1$ et $H \neq G$. Soit $K$ un sous-groupe tel que $H \subset K \subset G$. Le théorème de Lagrange (proposition 5), appliqué à $H$ dans $K$ puis à $K$ dans $G$, donne 
    $$p = \frac{\operatorname{card}(G)}{\operatorname{card}(K)} \times \frac{\operatorname{card}(K)}{\operatorname{card}(H)},$$
     produit de deux entiers naturels : l'un d'eux vaut $1$, c'est-à-dire $K = G$ ou $K = H$ (inclusion et égalité des cardinaux). 
    $$\boxed{\text{Un sous-groupe d'indice premier est maximal.}}$$

    **1.** Le groupe alterné $\mathfrak{A}_{n} = \mathrm{Ker}\, \varepsilon$ est un sous-groupe, et $\varepsilon$ est surjective sur $\{-1, 1\}$ puisque $n \geqslant 2$ ; les deux classes $\mathfrak{A}_{n}$ et $\tau\mathfrak{A}_{n}$, où $\tau$ est une transposition, partagent $\mathfrak{S}_{n}$ en deux parties de même cardinal (proposition 5), d'où $\frac{\operatorname{card}(\mathfrak{S}_{n})}{\operatorname{card}(\mathfrak{A}_{n})} = 2$, qui est premier. 
    $$\boxed{\mathfrak{A}_{n} \text{ est un sous-groupe maximal de } \mathfrak{S}_{n}}$$

    **2.** Notons $H_{k}$ le stabilisateur de $k$, qui est un sous-groupe (il contient $\mathrm{id}$ et il est stable par composée et par inverse). Il est distinct de $\mathfrak{S}_{n}$, car une transposition $(k\ j)$, $j \neq k$, n'y est pas. Son indice $\frac{n!}{(n - 1)!} = n$ n'est pas premier en général : il faut un argument direct. Soit $K$ un sous-groupe contenant strictement $H_{k}$, et $\rho \in K \setminus H_{k}$, de sorte que $j = \rho(k) \neq k$.

    Montrons que, pour tout $\ell \in \llbracket 1\,,n \rrbracket$, le sous-groupe $K$ contient un élément $\kappa_{\ell}$ tel que $\kappa_{\ell}(k) = \ell$. Pour $\ell = k$, l'identité convient ; pour $\ell = j$, $\rho$ convient ; pour $\ell \notin \{k, j\}$, la transposition $(j\ \ell)$ fixe $k$, donc appartient à $H_{k} \subset K$, et $\kappa_{\ell} = (j\ \ell) \circ \rho$ envoie $k$ sur $\ell$. Soit alors $\sigma \in \mathfrak{S}_{n}$ et $\ell = \sigma(k)$ : la permutation $\kappa_{\ell}^{-1}\sigma$ fixe $k$, donc appartient à $H_{k}$, et $\sigma = \kappa_{\ell}\,(\kappa_{\ell}^{-1}\sigma) \in K$. 
    $$\boxed{\{\sigma \in \mathfrak{S}_{n} \mid \sigma(k) = k\} \text{ est un sous-groupe maximal de } \mathfrak{S}_{n}}$$
     *Piège.* La réciproque de la question 3 est fausse, comme le montre la question 2 : pour $n = 4$, le stabilisateur d'un point est maximal et d'indice $4$, qui n'est pas premier.
- id: "mp-01-08"
  feuille: "f-mp-01"
  numero: 8
  partie: "Compléments sur les groupes"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [groupes]
  noeuds: [a-sous-groupe, gf-cycliques]
  notions: [sous-groupe-engendre, ordre-element]
  source: "Algèbre générale (LLG), exercice 22"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $(G, \cdot)$ un groupe de neutre $e$, et $H$, $K$ deux sous-groupes de $G$. On note 
    $$HK = \{hk \mid (h, k) \in H \times K\}.$$

    **1.** Montrer que $HK$ est un sous-groupe de $G$ si et seulement si $KH \subset HK$.

    **2.** On définit $f : H \times K \to G$ par $f(h, k) = hk$, le produit $H \times K$ étant muni de sa structure de groupe produit. Donner une condition nécessaire et suffisante pour que $f$ soit un morphisme de groupes.

    **3.** Soit $z = h_{0}k_{0} \in HK$, avec $(h_{0}, k_{0}) \in H \times K$. Montrer que les antécédents de $z$ par $f$ sont les couples $(h_{0}t, t^{-1}k_{0})$ avec $t \in H \cap K$.

    **4.** On suppose $G$ fini. En déduire que $\operatorname{card}(HK)\,\operatorname{card}(H \cap K) = \operatorname{card}(H)\,\operatorname{card}(K)$, et que $f$ est injective si et seulement si $H \cap K = \{e\}$.

    **5.** On dit que $H$ est *distingué* lorsque $xHx^{-1} \subset H$ pour tout $x \in G$. On suppose $H$ et $K$ distingués.

    **(a)** Montrer que $HK$ est un sous-groupe distingué de $G$.

    **(b)** Montrer que si $H \cap K = \{e\}$ et $HK = G$, alors $G$ est isomorphe à $H \times K$.
  corrige: |
    **1.** Supposons que $HK$ soit un sous-groupe. Pour $(h, k) \in H \times K$, l'élément $h^{-1}k^{-1}$ appartient à $HK$, donc son inverse $kh$ aussi : $KH \subset HK$. Réciproquement, supposons $KH \subset HK$. La partie $HK$ contient $e = ee$. Pour $h_{1}k_{1}$, $h_{2}k_{2} \in HK$, on écrit $k_{1}h_{2} = h_{3}k_{3}$ avec $h_{3} \in H$ et $k_{3} \in K$, d'où 
    $$(h_{1}k_{1})(h_{2}k_{2}) = (h_{1}h_{3})(k_{3}k_{2}) \in HK, \qquad (h_{1}k_{1})^{-1} = k_{1}^{-1}h_{1}^{-1} \in KH \subset HK.$$

    $$\boxed{HK \text{ est un sous-groupe de } G \iff KH \subset HK}$$

    **2.** Pour $(h, k)$, $(h', k') \in H \times K$, on a $f\big((h, k)(h', k')\big) = hh'kk'$ et $f(h, k)f(h', k') = hkh'k'$. Ces deux éléments sont égaux si et seulement si $h'k = kh'$, après simplification à gauche par $h$ et à droite par $k'$. 
    $$\boxed{f \text{ est un morphisme} \iff \text{tout élément de } H \text{ commute avec tout élément de } K}$$

    **3.** Pour $t \in H \cap K$, on a $h_{0}t \in H$, $t^{-1}k_{0} \in K$ et $f(h_{0}t, t^{-1}k_{0}) = h_{0}k_{0} = z$. Réciproquement, si $hk = h_{0}k_{0}$, l'élément $t = h_{0}^{-1}h$ appartient à $H$, et il est égal à $k_{0}k^{-1}$, qui appartient à $K$ : donc $t \in H \cap K$, $h = h_{0}t$ et $k = t^{-1}k_{0}$. 
    $$\boxed{f^{-1}(\{z\}) = \big\{(h_{0}t, t^{-1}k_{0}) \mid t \in H \cap K\big\}}$$
     Deux valeurs distinctes de $t$ donnant deux couples distincts, chaque élément de $HK$ a exactement $\operatorname{card}(H \cap K)$ antécédents.

    **4.** L'application $f$ est surjective de $H \times K$ sur $HK$, et chaque fibre a $\operatorname{card}(H \cap K)$ éléments : le lemme des bergers (chapitre 21 de MPSI) donne la formule. L'application $f$ est injective si et seulement si ses fibres sont des singletons, c'est-à-dire $\operatorname{card}(H \cap K) = 1$. 
    $$\boxed{\operatorname{card}(HK)\,\operatorname{card}(H \cap K) = \operatorname{card}(H)\,\operatorname{card}(K), \qquad f \text{ injective} \iff H \cap K = \{e\}}$$
     Par exemple, dans $\mathfrak{S}_{3}$, les sous-groupes $H = \langle (1\ 2) \rangle$ et $K = \langle (1\ 3) \rangle$ donnent une partie $HK$ à $\frac{2 \times 2}{1} = 4$ éléments, qui ne divise pas $6$ : ce n'est pas un sous-groupe, et la question 1 l'explique, puisque $(1\ 3)(1\ 2) \notin HK$.

    **5.(a)** Pour $(h, k) \in H \times K$, on écrit $kh = h\,(h^{-1}kh)$, et $h^{-1}kh \in K$ parce que $K$ est distingué : $KH \subset HK$, et $HK$ est un sous-groupe par la question 1. Pour $x \in G$, on a enfin 
    $$x(hk)x^{-1} = (xhx^{-1})(xkx^{-1}) \in HK.$$

    $$\boxed{HK \text{ est un sous-groupe distingué de } G}$$

    **(b)** Pour $(h, k) \in H \times K$, considérons $u = hkh^{-1}k^{-1}$. D'une part $u = (hkh^{-1})k^{-1} \in K$, puisque $K$ est distingué ; d'autre part $u = h(kh^{-1}k^{-1}) \in H$, puisque $H$ l'est. Donc $u \in H \cap K = \{e\}$, et $hk = kh$. Par la question 2, $f$ est un morphisme ; ses fibres sont des singletons par la question 3, et il est surjectif puisque $HK = G$. 
    $$\boxed{f : H \times K \to G \text{ est un isomorphisme de groupes}}$$
     Cette question n'utilise pas la finitude de $G$. C'est le pendant, pour les groupes, de la décomposition d'un espace vectoriel en somme directe de deux sous-espaces (chapitre 15 de MPSI) : la condition $H \cap K = \{e\}$ joue le rôle de $F \cap G = \{0\}$.
- id: "mp-01-09"
  feuille: "f-mp-01"
  numero: 9
  partie: "Compléments sur les groupes"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [groupes, sous-groupe engendré]
  noeuds: [a-sous-groupe, gf-cycliques]
  notions: [sous-groupe-engendre, ordre-element]
  source: "Algèbre générale (LLG), exercice 13"
  page_enonce: 2
  page_corrige: 5
  enonce: |
    **1.** Donner le nombre minimal de permutations nécessaires pour engendrer le groupe $\mathfrak{S}_{n}$.

    **2.** Donner le nombre minimal de transpositions nécessaires pour engendrer le groupe $\mathfrak{S}_{n}$.

    **3.** On suppose que, pour toute transposition $\tau$ de $\mathfrak{S}_{n}$ et tout $n$-cycle $c$ de $\mathfrak{S}_{n}$, les permutations $\tau$ et $c$ engendrent $\mathfrak{S}_{n}$. Montrer que $n$ est premier.

    **4.** Réciproquement, montrer que si $n$ est premier, alors pour toute transposition $\tau$ et tout $n$-cycle $c$ de $\mathfrak{S}_{n}$, les permutations $\tau$ et $c$ engendrent $\mathfrak{S}_{n}$.

    **5.** Soit $n \geqslant 2$, $a$ et $b$ deux éléments distincts de $\llbracket 1\,,n \rrbracket$, et $G_{a,b}$ le sous-groupe de $\mathfrak{S}_{n}$ engendré par $(a\ b)$ et $(1\ 2\ \cdots\ n)$. À quelle condition a-t-on $G_{a,b} = \mathfrak{S}_{n}$ ?
  corrige: |
    Rappelons deux outils. D'abord la formule de conjugaison de l'exercice 3, valable pour tout cycle : $\sigma(a_{1}\ \cdots\ a_{k})\sigma^{-1} = (\sigma(a_{1})\ \cdots\ \sigma(a_{k}))$. Ensuite, tout élément de $\mathfrak{S}_{n}$ est un produit de transpositions (chapitre 17 de MPSI).

    **1.** Pour $n = 1$, le groupe $\mathfrak{S}_{1}$ est réduit à l'identité, engendré par la partie vide ; pour $n = 2$, il est cyclique d'ordre $2$, engendré par $(1\ 2)$. Pour $n \geqslant 3$, le groupe $\mathfrak{S}_{n}$ n'est pas abélien, donc pas monogène, et il faut au moins deux générateurs. Montrons que $\tau = (1\ 2)$ et $c = (1\ 2\ \cdots\ n)$ suffisent. La formule de conjugaison donne 
    $$c^{k}\tau c^{-k} = \big(c^{k}(1)\ \ c^{k}(2)\big) = (k + 1\ \ k + 2) \qquad \text{pour } 0 \leqslant k \leqslant n - 2.$$
     Le groupe $\langle \tau, c \rangle$ contient donc les transpositions $(i\ \ i + 1)$. Il contient alors, par récurrence sur $k$, les transpositions $(1\ k)$, grâce à $(1\ \ k + 1) = (k\ \ k + 1)(1\ k)(k\ \ k + 1)$, puis toutes les transpositions, grâce à $(i\ j) = (1\ i)(1\ j)(1\ i)$ pour $i$, $j \neq 1$ distincts. Il contient donc tous les produits de transpositions, c'est-à-dire $\mathfrak{S}_{n}$. 
    $$\boxed{\text{Il faut } 0 \text{ permutation pour } n = 1, \ 1 \text{ pour } n = 2, \text{ et } 2 \text{ pour } n \geqslant 3.}$$

    **2.** Les $n - 1$ transpositions $(1\ 2), (1\ 3), \dots, (1\ n)$ engendrent $\mathfrak{S}_{n}$, comme on vient de le voir. Montrons qu'on ne peut pas faire mieux. Soit $\tau_{1} = (a_{1}\ b_{1}), \dots, \tau_{m} = (a_{m}\ b_{m})$ des transpositions. On construit des partitions de $\llbracket 1\,,n \rrbracket$ : $\mathcal{P}_{0}$ est la partition en singletons, et $\mathcal{P}_{i}$ s'obtient à partir de $\mathcal{P}_{i-1}$ en réunissant la partie qui contient $a_{i}$ et celle qui contient $b_{i}$, si elles sont distinctes. Chaque étape diminue le nombre de parties d'au plus $1$ : la partition $\mathcal{P}_{m}$ compte au moins $n - m$ parties. Chaque $\tau_{i}$ envoie chaque partie de $\mathcal{P}_{m}$ sur elle-même, puisqu'elle échange $a_{i}$ et $b_{i}$, qui sont dans la même partie, et fixe les autres éléments ; il en va de même de leurs inverses et de leurs produits, donc de tout élément de $\langle \tau_{1}, \dots, \tau_{m} \rangle$ (proposition 1 (i)). Si $m \leqslant n - 2$, la partition $\mathcal{P}_{m}$ a au moins deux parties ; pour $x$ et $y$ dans deux parties distinctes, la transposition $(x\ y)$ n'envoie pas la partie de $x$ sur elle-même, et n'est donc pas engendrée. 
    $$\boxed{\text{Il faut au moins, et il suffit de, } n - 1 \text{ transpositions pour engendrer } \mathfrak{S}_{n}.}$$

    **3.** On suppose $n \geqslant 2$ (pour $n = 1$, il n'y a pas de transposition et l'hypothèse est vide). Supposons $n$ non premier : $n = ab$ avec $2 \leqslant a < n$. Prenons $c = (1\ 2\ \cdots\ n)$ et $\tau = (1\ \ 1 + a)$, ce qui a un sens car $1 + a \leqslant n$. Appelons *bonne* une permutation $\sigma$ qui respecte la congruence modulo $a$, au sens où $i \equiv j \;[a]$ entraîne $\sigma(i) \equiv \sigma(j) \;[a]$. Les bonnes permutations forment un sous-groupe de $\mathfrak{S}_{n}$ : l'identité est bonne, la composée de deux bonnes permutations aussi, et l'inverse d'une bonne permutation $\sigma$ l'est également, car $\sigma$ envoie chaque classe de congruence dans une classe et, étant bijective, permute les $a$ classes, qui ont toutes $\frac{n}{a}$ éléments. Le cycle $c$ est bon : il ajoute $1$ à chaque entier, sauf $c(n) = 1$, et $n + 1 \equiv 1 \;[a]$ puisque $a \mid n$. La transposition $\tau$ est bonne, car elle échange deux éléments de la même classe. Mais $(1\ 2)$ n'est pas bonne : $1 \equiv 1 + a$, alors que $(1\ 2)$ envoie $1$ sur $2$ et fixe $1 + a$ (car $1 + a \geqslant 3$), et $2 \not\equiv 1 + a \;[a]$ puisque $a \geqslant 2$. Ainsi $\langle \tau, c \rangle \neq \mathfrak{S}_{n}$, contrairement à l'hypothèse. 
    $$\boxed{n \text{ est premier}}$$

    **4.** Supposons $n$ premier, et soit $\tau = (a\ b)$ et $c$ un $n$-cycle. Par l'exercice 3, il existe $\sigma$ telle que $\sigma c \sigma^{-1} = (1\ 2\ \cdots\ n)$, et la conjugaison par $\sigma$ est un automorphisme de $\mathfrak{S}_{n}$ : il suffit de traiter le cas $c = (1\ 2\ \cdots\ n)$, $\tau$ étant remplacée par la transposition $\sigma\tau\sigma^{-1}$. Quitte à échanger $a$ et $b$, on note $k = b - a \in \llbracket 1\,,n - 1 \rrbracket$. Comme $n$ est premier, $k \wedge n = 1$, et $\overline{k}$ engendre $\mathbb{Z}/n\mathbb{Z}$ (proposition 3) : les entiers $a, a + k, a + 2k, \dots$, réduits modulo $n$, décrivent $\llbracket 1\,,n \rrbracket$ avant de revenir à $a$, et $c^{k}$ est le $n$-cycle $(a\ \ b\ \ d_{3}\ \cdots\ d_{n})$, où $d_{j}$ est le représentant dans $\llbracket 1\,,n \rrbracket$ de $a + (j - 1)k$. Si $\rho$ envoie $a$ sur $1$, $b$ sur $2$ et $d_{j}$ sur $j$, alors $\rho c^{k} \rho^{-1} = (1\ 2\ \cdots\ n)$ et $\rho\tau\rho^{-1} = (1\ 2)$ engendrent $\mathfrak{S}_{n}$ (question 1), donc $c^{k}$ et $\tau$ aussi. Enfin $c^{k} \in \langle c \rangle$, donc $\langle \tau, c \rangle \supset \langle \tau, c^{k} \rangle = \mathfrak{S}_{n}$. 
    $$\boxed{\text{Si } n \text{ est premier, une transposition et un } n\text{-cycle quelconques engendrent } \mathfrak{S}_{n}.}$$

    **5.** Les deux arguments précédents s'adaptent avec $k = |b - a|$. Si $k \wedge n = 1$, la démonstration de la question 4 s'applique telle quelle : elle n'utilisait que cette propriété. Si $\delta = k \wedge n > 1$, alors $\delta < n$, car $n$ ne divise pas $k \in \llbracket 1\,,n - 1 \rrbracket$, et la démonstration de la question 3, menée avec la congruence modulo $\delta$, montre que $(a\ b)$ et $c$ sont bonnes et que $(1\ 2)$ ne l'est pas. 
    $$\boxed{G_{a,b} = \mathfrak{S}_{n} \iff (b - a) \wedge n = 1}$$
     Ainsi, pour $n = 6$, les transpositions $(1\ 2)$ et $(1\ 6)$ donnent tout $\mathfrak{S}_{6}$ avec $c$, mais pas $(1\ 3)$, ni $(1\ 4)$ : dans ce dernier cas, le groupe engendré respecte la partition $\{1, 4\}$, $\{2, 5\}$, $\{3, 6\}$.
- id: "mp-01-10"
  feuille: "f-mp-01"
  numero: 10
  partie: "Compléments sur les groupes"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [groupes]
  noeuds: [a-sous-groupe, gf-cycliques]
  notions: [sous-groupe-engendre, ordre-element]
  source: "Algèbre générale (LLG), exercice 32"
  page_enonce: 2
  page_corrige: 6
  enonce: |
    Soit $(G, \cdot)$ un groupe et $\operatorname{Aut}(G)$ l'ensemble de ses automorphismes.

    **1.** Montrer que $(\operatorname{Aut}(G), \circ)$ est un groupe.

    **2.** Quels sont les groupes finis $G$ tels que $\operatorname{Aut}(G)$ soit réduit à un élément ? On pourra utiliser les applications $x \mapsto gxg^{-1}$, puis l'exercice 4.
  corrige: |
    **1.** L'ensemble $\mathcal{S}(G)$ des bijections de $G$ dans lui-même est un groupe pour la composition (chapitre 11 de MPSI), et $\operatorname{Aut}(G)$ en est une partie. Elle contient $\mathrm{id}_{G}$ ; la composée de deux morphismes est un morphisme ; la réciproque d'un morphisme bijectif est un morphisme (chapitre 11 de MPSI). C'est donc un sous-groupe de $\mathcal{S}(G)$. 
    $$\boxed{(\operatorname{Aut}(G), \circ) \text{ est un groupe}}$$

    **2.** Supposons $\operatorname{Aut}(G) = \{\mathrm{id}_{G}\}$. Pour $g \in G$, l'application $i_{g} : x \mapsto gxg^{-1}$ est un morphisme, puisque $gxyg^{-1} = (gxg^{-1})(gyg^{-1})$, et elle est bijective, de réciproque $i_{g^{-1}}$ : c'est un automorphisme, donc $i_{g} = \mathrm{id}_{G}$, c'est-à-dire $gx = xg$ pour tout $x$. Le groupe $G$ est donc abélien. L'application $x \mapsto x^{-1}$ est alors un automorphisme, puisque $(xy)^{-1} = y^{-1}x^{-1} = x^{-1}y^{-1}$ ; elle est égale à l'identité, donc $x^{2} = e$ pour tout $x$. Par l'exercice 4, $G \simeq (\mathbb{Z}/2\mathbb{Z})^{n}$. Si $n \geqslant 2$, l'application qui échange les deux premières coordonnées est un automorphisme de $(\mathbb{Z}/2\mathbb{Z})^{n}$ distinct de l'identité, qui se transporte en un automorphisme non trivial de $G$ : c'est exclu, donc $n \leqslant 1$. Réciproquement, le groupe trivial n'a qu'une application dans lui-même, et un automorphisme de $\mathbb{Z}/2\mathbb{Z}$ fixe $\overline{0}$ et, étant bijectif, fixe aussi $\overline{1}$. 
    $$\boxed{\operatorname{Aut}(G) = \{\mathrm{id}_{G}\} \iff G \text{ est trivial ou isomorphe à } \mathbb{Z}/2\mathbb{Z}}$$
     *À retenir.* Les automorphismes $i_{g}$ s'appellent les automorphismes *intérieurs* ; ils sont tous triviaux exactement quand le groupe est abélien. L'argument se répète à l'exercice 73, où la relation « $x = gyg^{-1}$ pour un certain $g$ » partage le groupe en classes.
- id: "mp-01-11"
  feuille: "f-mp-01"
