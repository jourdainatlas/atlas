  enonce: |
    *Anneaux booléens.* Soit $A$ un anneau dans lequel tout élément $x$ est nilpotent, au sens de l'exercice 18, ou idempotent, c'est-à-dire tel que $x^{2} = x$.

    **1.** Montrer que tout élément de $A$ est idempotent.

    **2.** Montrer que $A$ est commutatif.

    **3.** On suppose $A$ fini. Montrer qu'il existe $n \in \mathbb{N}$ tel que $A$ soit isomorphe à l'anneau produit $(\mathbb{Z}/2\mathbb{Z})^{n}$.
  corrige: |
    **1.** Soit $x$ nilpotent. Par l'exercice 19, $1 - x$ est inversible. S'il était nilpotent, avec $(1 - x)^{k} = 0$, on aurait $1 = (1 - x)^{-k}(1 - x)^{k} = 0$, et l'anneau serait nul, auquel cas tout est idempotent. Sinon, $1 - x$ est idempotent : $(1 - x)^{2} = 1 - x$, soit $1 - 2x + x^{2} = 1 - x$, c'est-à-dire $x^{2} = x$. 
    $$\boxed{\text{Tout élément de } A \text{ est idempotent}}$$
     Un élément à la fois nilpotent et idempotent est nul, puisque $x = x^{2} = \cdots = x^{k} = 0$ : les seuls nilpotents de $A$ sont $0$.

    **2.** Pour tout $x$, on a $(x + x)^{2} = x + x$, soit $4x = 2x$, donc $2x = 0$ et $x = -x$. Pour $x$, $y \in A$, on a $(x + y)^{2} = x + y$, soit $x + xy + yx + y = x + y$, donc $xy = -yx = yx$. 
    $$\boxed{A \text{ est commutatif, et } 2x = 0 \text{ pour tout } x}$$

    **3.** On raisonne par récurrence forte sur le cardinal de $A$. Si $A = \{0\}$, il est isomorphe à $(\mathbb{Z}/2\mathbb{Z})^{0}$, l'anneau nul. Si $A$ n'a pas d'autre idempotent que $0$ et $1$, la question 1 donne $A = \{0, 1\}$ avec $0 \neq 1$, et la question 2 donne $1 + 1 = 0$ : $A$ est isomorphe à $\mathbb{Z}/2\mathbb{Z}$.

    Sinon, soit $e$ un idempotent distinct de $0$ et de $1$ ; alors $1 - e$ est aussi idempotent, et $e(1 - e) = 0$. L'ensemble $eA = \{ea \mid a \in A\}$ est stable par somme et par produit, et c'est un anneau d'unité $e$, puisque $e \cdot ea = ea$ ; il est booléen. De même pour $(1 - e)A$, d'unité $1 - e$. L'application 
    $$\begin{array}{r|ccl} \theta : & A & \longrightarrow & eA \times (1 - e)A \\ & x & \longmapsto & \big(ex, (1 - e)x\big) \end{array}$$
     est un morphisme d'anneaux, car $A$ est commutatif, $e^{2} = e$ et $\theta(1) = (e, 1 - e)$. Elle est injective, puisque $ex = 0$ et $(1 - e)x = 0$ entraînent $x = 0$ par somme, et surjective, puisque $\theta(ea + (1 - e)b) = (ea, (1 - e)b)$, grâce à $e(1 - e) = 0$. Les anneaux $eA$ et $(1 - e)A$ ont strictement moins d'éléments que $A$, car $(1 - e)A$ contient $1 - e \neq 0$ et $\theta$ est bijective, de sorte que $\operatorname{card}(A) = \operatorname{card}(eA)\operatorname{card}((1 - e)A)$ avec deux facteurs au moins égaux à $2$. L'hypothèse de récurrence donne $eA \simeq (\mathbb{Z}/2\mathbb{Z})^{a}$ et $(1 - e)A \simeq (\mathbb{Z}/2\mathbb{Z})^{b}$, d'où $A \simeq (\mathbb{Z}/2\mathbb{Z})^{a+b}$. 
    $$\boxed{A \simeq (\mathbb{Z}/2\mathbb{Z})^{n}, \qquad \operatorname{card}(A) = 2^{n}}$$
     L'exemple type est l'anneau $\mathcal{P}(E)$ des parties d'un ensemble fini $E$ à $n$ éléments, muni de la différence symétrique et de l'intersection : la fonction indicatrice l'identifie à $(\mathbb{Z}/2\mathbb{Z})^{n}$. L'exercice 24 contenait déjà l'idée : l'idempotent $(1, 0)$ découpe un anneau produit.
- id: "mp-01-70"
  feuille: "f-mp-01"
  numero: 70
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [synthèse, groupes cycliques, "ordre d'un élément", corps]
  noeuds: [gf-cycliques, a-corps]
  notions: [groupe-cyclique, ordre-element]
  source: "Algèbre générale (LLG), exercice 17"
  page_enonce: 11
  page_corrige: 32
  enonce: |
    Soit $G$ un groupe fini de neutre $e$ et de cardinal $n$. Pour $d$ diviseur de $n$, on note $n_{d}(G)$ le nombre d'éléments d'ordre $d$ de $G$.

    **1.** Que vaut $\displaystyle\sum_{d \mid n} n_{d}(G)$ ?

    **2.** Calculer les $n_{d}(G)$ lorsque $G$ est cyclique. Que déduire de la question précédente dans ce cas ?

    **3.** Montrer que $G$ est cyclique si et seulement si, pour tout diviseur $d$ de $n$, l'ensemble 
    $$\{x \in G \mid x^{d} = e\}$$
     a au plus $d$ éléments.

    **4.** On suppose qu'il existe un corps $\mathbb{K}$ tel que $G$ soit un sous-groupe de $(\mathbb{K}^{*}, \times)$. Montrer que $G$ est cyclique. On pourra utiliser l'exercice 17.

    **5.** Que dire dans la situation de la question précédente si $\mathbb{K} = \mathbb{C}$ ?
  corrige: |
    **1.** Par le théorème 2, l'ordre de tout élément divise $n$ : les ensembles d'éléments d'ordre $d$, pour $d \mid n$, forment une partition de $G$. 
    $$\boxed{\sum_{d \mid n} n_{d}(G) = n}$$

    **2.** On peut supposer $G = \mathbb{Z}/n\mathbb{Z}$ (théorème 1). L'ordre de $\overline{k}$ est $\frac{n}{k \wedge n}$ (exemple de la section 1.2.4). Pour $d \mid n$, la classe $\overline{k}$, $k \in \llbracket 1\,,n \rrbracket$, est d'ordre $d$ si et seulement si $k \wedge n = \frac{n}{d}$, c'est-à-dire $k = \frac{n}{d}j$ avec $j \in \llbracket 1\,,d \rrbracket$ et $j \wedge d = 1$. Il y en a $\varphi(d)$. 
    $$\boxed{n_{d}(G) = \varphi(d) \text{ pour tout } d \mid n, \qquad\text{d'où}\qquad \sum_{d \mid n} \varphi(d) = n}$$
     Cette formule, qui ne fait plus intervenir $G$, vaut pour tout entier $n \geqslant 1$ ; par exemple, 
    $$\varphi(1) + \varphi(2) + \varphi(3) + \varphi(4) + \varphi(6) + \varphi(12) = 1 + 1 + 2 + 2 + 2 + 4 = 12.$$

    **3.** Si $G = \mathbb{Z}/n\mathbb{Z}$ et $d \mid n$, l'équation $d\,\overline{k} = \overline{0}$ équivaut à $\frac{n}{d} \mid k$ : elle a exactement $d$ solutions. Réciproquement, supposons que, pour tout $d \mid n$, l'équation $x^{d} = e$ ait au plus $d$ solutions. Si $n_{d}(G) \geqslant 1$, soit $x$ d'ordre $d$ : les $d$ éléments de $\langle x \rangle$ vérifient tous $y^{d} = e$, donc ce sont toutes les solutions, et les éléments d'ordre $d$ sont ceux du groupe cyclique $\langle x \rangle$, au nombre de $\varphi(d)$ par la question 2. Ainsi $n_{d}(G) \in \{0, \varphi(d)\}$, et 
    $$n = \sum_{d \mid n} n_{d}(G) \leqslant \sum_{d \mid n} \varphi(d) = n.$$
     Toutes les inégalités sont des égalités : en particulier $n_{n}(G) = \varphi(n) \geqslant 1$, et un élément d'ordre $n$ engendre $G$. 
    $$\boxed{G \text{ est cyclique} \iff \forall d \mid n, \ \operatorname{card}\{x \in G \mid x^{d} = e\} \leqslant d}$$

    **4.** Dans le corps $\mathbb{K}$, qui est intègre, l'équation $x^{d} = 1$ a au plus $d$ solutions (exercice 17), et a fortiori dans $G$. La question 3 s'applique. 
    $$\boxed{\text{Tout sous-groupe fini de } (\mathbb{K}^{*}, \times) \text{ est cyclique}}$$
     En particulier, $(\mathbb{Z}/p\mathbb{Z})^{\times}$ est cyclique pour $p$ premier : il existe une *racine primitive* modulo $p$, comme $\overline{2}$ modulo $13$ (exercice 46) ou $\overline{3}$ modulo $7$ (exercice 38).

    **5.** Si $G$ est un sous-groupe fini de $\mathbb{C}^{*}$ de cardinal $n$, tous ses éléments vérifient $z^{n} = 1$ (théorème 2), donc $G \subset \mathbb{U}_{n}$ ; les deux ensembles ont $n$ éléments. 
    $$\boxed{\text{Les sous-groupes finis de } \mathbb{C}^{*} \text{ sont les } \mathbb{U}_{n}, \ n \in \mathbb{N}^{*}}$$
     Pour $\mathbb{C}$, on n'a pas besoin de la question 4 : $\mathbb{U}_{n}$ est engendré par $\mathrm{e}^{2\mathrm{i}\pi/n}$ (chapitre 4 de MPSI). L'intérêt de la question 4 est de valoir pour un corps sans exponentielle, comme $\mathbb{Z}/p\mathbb{Z}$.
- id: "mp-01-71"
  feuille: "f-mp-01"
  numero: 71
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [synthèse, "indicatrice d'Euler"]
  noeuds: [z-zn]
  notions: []
  source: "TD 2 Algèbre générale (Sainte-Geneviève), exercice 14"
  page_enonce: 11
  page_corrige: 33
  enonce: |
    Soit $A = \{a + b\sqrt{2} \mid a, b \in \mathbb{Z}\}$.

    **1.** Montrer que $A$ est un sous-anneau de $\mathbb{R}$.

    **2.** Montrer qu'un endomorphisme de l'anneau $A$ envoie nécessairement $\sqrt{2}$ sur $\pm\sqrt{2}$, puis que $A$ n'a que deux endomorphismes : $\mathrm{id}_{A}$ et un endomorphisme non trivial, que l'on notera $c$.

    **3.** Montrer que, pour tout $x \in A$, on a $x + c(x) \in \mathbb{Z}$ et $x\,c(x) \in \mathbb{Z}$.

    **4.** En déduire que $A^{\times} = \{x \in A \mid x\,c(x) = \pm 1\}$.

    **5.** Montrer que $A^{\times}$ est infini.

    **6.** Montrer que l'équation de Pell-Fermat $x^{2} - 2y^{2} = 1$ possède une infinité de solutions dans $\mathbb{Z}^{2}$.
  corrige: |
    **1.** La partie $A$ contient $1$, et pour $a$, $b$, $c$, $d$ entiers, 
    $$(a + b\sqrt{2}) - (c + d\sqrt{2}) = (a - c) + (b - d)\sqrt{2}, \qquad (a + b\sqrt{2})(c + d\sqrt{2}) = (ac + 2bd) + (ad + bc)\sqrt{2}.$$

    $$\boxed{A \text{ est un sous-anneau de } \mathbb{R}}$$
     L'écriture $a + b\sqrt{2}$ est unique, car $\sqrt{2}$ est irrationnel : si $a + b\sqrt{2} = a' + b'\sqrt{2}$ avec $b \neq b'$, alors $\sqrt{2} = \frac{a - a'}{b' - b} \in \mathbb{Q}$.

    **2.** Soit $f$ un endomorphisme de $A$. Il coïncide avec l'identité sur $\mathbb{Z}$ (exercice 14), donc 
    $$f(a + b\sqrt{2}) = a + b\,f(\sqrt{2}) \qquad\text{et}\qquad f(\sqrt{2})^{2} = f(2) = 2 \ ;$$
     comme $f(\sqrt{2})$ est un réel, $f(\sqrt{2}) = \pm\sqrt{2}$. Le cas $+$ donne l'identité. Le cas $-$ donne l'application 
    $$c : a + b\sqrt{2} \longmapsto a - b\sqrt{2},$$
     bien définie par l'unicité de l'écriture, qui est additive, envoie $1$ sur $1$, et respecte le produit : 
    $$c\big((a + b\sqrt{2})(c' + d\sqrt{2})\big) = (ac' + 2bd) - (ad + bc')\sqrt{2} = (a - b\sqrt{2})(c' - d\sqrt{2}).$$

    $$\boxed{A \text{ a exactement deux endomorphismes : } \mathrm{id}_{A} \text{ et } c : a + b\sqrt{2} \mapsto a - b\sqrt{2}}$$

    **3.** Pour $x = a + b\sqrt{2}$, on calcule directement : 
    $$\boxed{x + c(x) = 2a \in \mathbb{Z}, \qquad x\,c(x) = a^{2} - 2b^{2} \in \mathbb{Z}}$$
     C'est l'analogue de $z + \overline{z} = 2\mathrm{Re}(z)$ et $z\overline{z} = |z|^{2}$ pour les complexes.

    **4.** Notons $N(x) = x\,c(x)$. Comme $c$ est un morphisme et $A$ commutatif, $N(xy) = N(x)N(y)$. Si $x$ est inversible, $N(x)N(x^{-1}) = N(1) = 1$ dans $\mathbb{Z}$, donc $N(x) = \pm 1$. Réciproquement, si $N(x) = \pm 1$, alors $x \cdot \big(\pm c(x)\big) = 1$, avec $\pm c(x) \in A$. 
    $$\boxed{A^{\times} = \{x \in A \mid x\,c(x) = \pm 1\}}$$

    **5.** Le nombre $u = 1 + \sqrt{2}$ vérifie $N(u) = 1 - 2 = -1$ : il est inversible, et ses puissances $u^{k}$, $k \in \mathbb{N}$, aussi. Comme $u > 1$, la suite $(u^{k})$ est strictement croissante, donc ses termes sont deux à deux distincts. 
    $$\boxed{A^{\times} \supset \{(1 + \sqrt{2})^{k} \mid k \in \mathbb{N}\} \text{ est infini}}$$

    **6.** Les puissances de $u^{2} = 3 + 2\sqrt{2}$ vérifient $N(u^{2k}) = N(u)^{2k} = 1$. En écrivant $u^{2k} = a_{k} + b_{k}\sqrt{2}$, on obtient $a_{k}^{2} - 2b_{k}^{2} = 1$, et les couples $(a_{k}, b_{k})$ sont deux à deux distincts par unicité de l'écriture. 
    $$\boxed{x^{2} - 2y^{2} = 1 \text{ a une infinité de solutions, dont } (3, 2), \ (17, 12), \ (99, 70), \ \ldots}$$
     On vérifie $17^{2} - 2 \times 12^{2} = 289 - 288 = 1$ ✓. Les quotients $\frac{a_{k}}{b_{k}}$, à savoir $\frac{3}{2}$, $\frac{17}{12}$, $\frac{99}{70}$, sont d'excellentes approximations de $\sqrt{2}$, puisque $\frac{a_{k}}{b_{k}} - \sqrt{2} = \frac{1}{b_{k}(a_{k} + b_{k}\sqrt{2})}$.
- id: "mp-01-72"
  feuille: "f-mp-01"
  numero: 72
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Algorithmique, Démonstration, Calcul]
  mots_cles: [synthèse, "indicatrice d'Euler", PGCD et Bézout, nombres premiers]
  noeuds: [z-zn, z-bezout, z-premiers]
  notions: [pgcd-anneau]
  source: "TD 3 Arithmétique (Sainte-Geneviève), exercice 70"
  page_enonce: 12
  page_corrige: 34
  enonce: |
    *Nombres de Fermat.*

    **1.** Soit $b \in \mathbb{N}^{*}$. Montrer que si $2^{b} + 1$ est premier, alors il existe $n \in \mathbb{N}$ tel que $b = 2^{n}$.

    Pour $n \in \mathbb{N}$, on pose $F_{n} = 2^{2^{n}} + 1$.

    **2.** Étudier la primalité de $F_{n}$ pour $n \in \llbracket 0\,,6 \rrbracket$, à l'aide d'un programme Python si nécessaire.

    **3.** Montrer que $F_{n} \wedge F_{m} = 1$ pour tous entiers naturels $n \neq m$.

    **4.** En déduire une nouvelle preuve de l'existence d'une infinité de nombres premiers.
  corrige: |
    **1.** Supposons que $b$ ait un diviseur impair $m > 1$, et écrivons $b = mk$, avec $k < b$. Comme $m$ est impair, $y^{m} + 1 = (y + 1)\big(y^{m-1} - y^{m-2} + \cdots - y + 1\big)$, et avec $y = 2^{k}$, l'entier $2^{k} + 1$ divise $2^{b} + 1$, avec $1 < 2^{k} + 1 < 2^{b} + 1$ : ce dernier n'est pas premier. Si $2^{b} + 1$ est premier, $b$ n'a donc pas de diviseur impair autre que $1$. 
    $$\boxed{2^{b} + 1 \text{ premier} \implies b = 2^{n} \text{ pour un } n \in \mathbb{N}}$$

    **2.** On obtient $F_{0} = 3$, $F_{1} = 5$, $F_{2} = 17$, $F_{3} = 257$ et $F_{4} = 65\,537$, qui sont premiers ; pour les deux derniers, il suffit de tester les diviseurs premiers jusqu'à $\sqrt{F_{n}}$, soit jusqu'à $16$ et $255$. En revanche, un programme de recherche de diviseurs, comme

    `next(d for d in range(3, 10**6, 2) if (2**32 + 1) % d == 0)`

    renvoie $641$, et l'on trouve 
    $$\boxed{F_{5} = 641 \times 6\,700\,417, \qquad F_{6} = 274\,177 \times 67\,280\,421\,310\,721}$$
     Les nombres $F_{0}$ à $F_{4}$ sont premiers, $F_{5}$ et $F_{6}$ ne le sont pas : la conjecture de Fermat selon laquelle tous les $F_{n}$ seraient premiers est fausse, ce qu'Euler a établi pour $F_{5}$.

    **3.** Montrons d'abord, par récurrence sur $n \geqslant 1$, que $F_{0}F_{1} \cdots F_{n-1} = F_{n} - 2$. Pour $n = 1$, $F_{0} = 3 = F_{1} - 2$. Si c'est vrai au rang $n$, alors 
    $$F_{0} \cdots F_{n} = (F_{n} - 2)F_{n} = \big(2^{2^{n}} - 1\big)\big(2^{2^{n}} + 1\big) = 2^{2^{n+1}} - 1 = F_{n+1} - 2.$$
     Soit $m < n$ et $d$ un diviseur commun de $F_{m}$ et $F_{n}$. Alors $d$ divise $F_{0} \cdots F_{n-1}$, dont $F_{m}$ est un facteur, et $F_{n}$, donc leur différence $2$ ; comme les $F_{k}$ sont impairs, $d = \pm 1$. 
    $$\boxed{F_{n} \wedge F_{m} = 1 \text{ pour } n \neq m}$$

    **4.** Pour chaque $n$, choisissons un diviseur premier $p_{n}$ de $F_{n} \geqslant 3$. Si $p_{n} = p_{m}$ avec $n \neq m$, ce nombre premier diviserait $F_{n} \wedge F_{m} = 1$. Les $p_{n}$ sont donc deux à deux distincts. 
    $$\boxed{\text{Il existe une infinité de nombres premiers.}}$$
     Cette preuve remplace l'argument d'Euclide (chapitre 12 de MPSI) par une suite explicite d'entiers deux à deux premiers entre eux.
- id: "mp-01-73"
  feuille: "f-mp-01"
  numero: 73
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Algorithmique, Démonstration]
  mots_cles: [synthèse]
  noeuds: [a-anneau]
  notions: []
  source: "Algèbre générale (LLG), exercice 23, questions 1 à 4"
  page_enonce: 12
  page_corrige: 35
  enonce: |
    Soit $G$ un groupe fini et $\Omega = G^{2}$, que l'on munit de la probabilité uniforme. On pose 
    $$C = \{(x, y) \in G^{2} \mid xy = yx\} \qquad\text{et}\qquad p = P(C).$$

    **1.** Montrer que $p > 0$. Que dire si $p = 1$ ?

    Dans la suite, on suppose que $G$ n'est pas abélien.

    **2.** Calculer $p$ lorsque $G = \mathfrak{S}_{3}$, puis lorsque $G = \mathfrak{S}_{4}$, à l'aide d'un programme Python pour $\mathfrak{S}_{4}$.

    **3.** On définit la relation $\sim$ sur $G$ par : $x \sim y$ s'il existe $g \in G$ tel que $x = gyg^{-1}$. Montrer que $\sim$ est une relation d'équivalence.

    **4.** On note $s$ le nombre de classes d'équivalence. Montrer que $p = \dfrac{s}{\operatorname{card}(G)}$. On pourra, pour $x \in G$, dénombrer de deux façons les éléments $g$ qui commutent avec $x$.
  corrige: |
    **1.** Pour tout $x \in G$, le couple $(x, e)$ appartient à $C$ : donc $\operatorname{card}(C) \geqslant \operatorname{card}(G)$, et $p \geqslant \frac{1}{\operatorname{card}(G)}$. On a $p = 1$ si et seulement si $C = G^{2}$, c'est-à-dire si et seulement si $G$ est abélien. 
    $$\boxed{p \geqslant \frac{1}{\operatorname{card}(G)} > 0, \qquad p = 1 \iff G \text{ abélien}}$$

    **2.** Dans $\mathfrak{S}_{3}$, l'identité commute avec les $6$ éléments ; chaque transposition commute avec elle-même et l'identité, soit $2$ éléments ; chaque $3$-cycle commute avec les $3$ éléments du groupe qu'il engendre. Ainsi $\operatorname{card}(C) = 6 + 3 \times 2 + 2 \times 3 = 18$, sur $36$ couples. Pour $\mathfrak{S}_{4}$, un programme Python compte les couples :

    `G = list(permutations(range(4)))`

    `c = sum(1 for x in G for y in G if compose(x, y) == compose(y, x))`

    avec `compose(x, y)` $=$ `tuple(x[y[i]] for i in range(4))` et `permutations` importé du module `itertools`. Il renvoie $120$ couples sur $576$. 
    $$\boxed{p = \frac{18}{36} = \frac{1}{2} \text{ pour } \mathfrak{S}_{3}, \qquad p = \frac{120}{576} = \frac{5}{24} \text{ pour } \mathfrak{S}_{4}}$$

    **3.** La relation est réflexive ($x = exe^{-1}$), symétrique (si $x = gyg^{-1}$, alors $y = g^{-1}x(g^{-1})^{-1}$) et transitive (si $x = gyg^{-1}$ et $y = hzh^{-1}$, alors $x = (gh)z(gh)^{-1}$). 
    $$\boxed{\sim \text{ est une relation d'équivalence}}$$
     Ses classes s'appellent les *classes de conjugaison*. Dans $\mathfrak{S}_{n}$, la formule de l'exercice 3 montre que deux permutations sont conjuguées si et seulement si leurs décompositions en cycles ont les mêmes longueurs.

    **4.** Pour $x \in G$, notons $Z(x) = \{g \in G \mid gx = xg\}$ et $\mathrm{Cl}(x)$ la classe de $x$. L'application $g \mapsto gxg^{-1}$ est surjective de $G$ sur $\mathrm{Cl}(x)$, et $gxg^{-1} = hxh^{-1}$ équivaut à $h^{-1}g \in Z(x)$, c'est-à-dire à $g \in hZ(x)$ : chaque fibre a $\operatorname{card}(Z(x))$ éléments. On dénombre ainsi les éléments de $G$ de deux façons, ce qui donne 
    $$\operatorname{card}(G) = \operatorname{card}\big(\mathrm{Cl}(x)\big) \times \operatorname{card}\big(Z(x)\big).$$
     En comptant les couples de $C$ selon leur première composante, 
    $$\operatorname{card}(C) = \sum_{x \in G} \operatorname{card}\big(Z(x)\big) = \operatorname{card}(G)\sum_{x \in G} \frac{1}{\operatorname{card}(\mathrm{Cl}(x))} = \operatorname{card}(G) \times s,$$
     car, dans la dernière somme, chaque classe à $c$ éléments contribue $c$ fois $\frac{1}{c}$, soit $1$. 
    $$\boxed{p = \frac{\operatorname{card}(C)}{\operatorname{card}(G)^{2}} = \frac{s}{\operatorname{card}(G)}}$$
     Pour $\mathfrak{S}_{3}$, les classes sont l'identité, les transpositions et les $3$-cycles, soit $s = 3$ et $p = \frac{3}{6}$ ; pour $\mathfrak{S}_{4}$, les cinq types $1 + 1 + 1 + 1$, $2 + 1 + 1$, $2 + 2$, $3 + 1$ et $4$ donnent $s = 5$ et $p = \frac{5}{24}$ ✓. On peut montrer que $p \leqslant \frac{5}{8}$ pour tout groupe non abélien : deux éléments pris au hasard dans un groupe non abélien commutent avec probabilité au plus $\frac{5}{8}$.
