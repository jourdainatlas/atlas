  enonce: |
    Quels sont les entiers $m \in \mathbb{N}^{*}$ tels qu'il existe $m$ entiers naturels non nuls consécutifs dont chacun est divisible par le cube d'un entier supérieur ou égal à $2$ ?
  corrige: |
    Tous les entiers $m \in \mathbb{N}^{*}$ conviennent. Soit $m \geqslant 1$, et $p_{1}, \dots, p_{m}$ des nombres premiers distincts (il en existe une infinité). Les entiers $p_{1}^{3}, \dots, p_{m}^{3}$ sont premiers entre eux deux à deux, et le théorème 5, sous sa forme à $m$ facteurs, fournit un entier $N$ tel que 
    $$N \equiv -k \;[p_{k}^{3}] \qquad \text{pour tout } k \in \llbracket 1\,,m \rrbracket.$$
     Quitte à lui ajouter un multiple de $p_{1}^{3} \cdots p_{m}^{3}$, on peut le supposer positif. Alors $N + 1, N + 2, \dots, N + m$ sont $m$ entiers naturels non nuls consécutifs, et $N + k$ est divisible par le cube $p_{k}^{3}$, avec $p_{k} \geqslant 2$. 
    $$\boxed{\text{Pour tout } m \in \mathbb{N}^{*}, \text{ il existe } m \text{ entiers consécutifs tous divisibles par un cube} \geqslant 8}$$
     Pour $m = 2$, avec $p_{1} = 2$ et $p_{2} = 3$, on cherche $N \equiv -1 \;[8]$ et $N \equiv -2 \;[27]$ : $N = 79$ convient, et $80 = 2^{3} \times 10$, $81 = 3^{3} \times 3$. Le théorème chinois transforme un problème de rencontres improbables en un simple système de congruences.
