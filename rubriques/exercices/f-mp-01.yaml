  source: "TD 3 Arithmétique (Sainte-Geneviève), exercice 39"
  page_enonce: 12
  page_corrige: 37
  enonce: |
    Soit $n \in \mathbb{N}^{*}$. Montrer que $n$ est impair si et seulement si $n$ divise $\displaystyle\sum_{k=1}^{n} k^{n}$.
  corrige: |
    Notons $S = \sum_{k=1}^{n} k^{n}$.

    *Si $n$ est impair,* on regroupe les termes $k$ et $n - k$ pour $1 \leqslant k \leqslant n - 1$, qui sont distincts puisque $n$ est impair : comme $n - k \equiv -k \;[n]$ et que $n$ est impair, $(n - k)^{n} \equiv -k^{n} \;[n]$. Les termes se compensent deux à deux modulo $n$, et le dernier terme $n^{n}$ est multiple de $n$ : $n \mid S$.

    *Si $n$ est pair,* écrivons $n = 2^{\alpha}m$ avec $\alpha \geqslant 1$ et $m$ impair, et montrons que $2^{\alpha} \nmid S$, ce qui suffit. Pour $k$ pair, $k^{n}$ est divisible par $2^{n}$, et $n \geqslant 2^{\alpha} > \alpha$, donc $k^{n} \equiv 0 \;[2^{\alpha}]$. Pour $k$ impair, l'exercice 42, appliqué avec l'exposant $\alpha + 2 \geqslant 3$, donne $k^{2^{\alpha}} \equiv 1 \;[2^{\alpha+2}]$, donc a fortiori modulo $2^{\alpha}$, et 
    $$k^{n} = \big(k^{2^{\alpha}}\big)^{m} \equiv 1 \;[2^{\alpha}].$$
     Ainsi $S$ est congru modulo $2^{\alpha}$ au nombre d'entiers impairs de $\llbracket 1\,,n \rrbracket$, soit $\frac{n}{2} = 2^{\alpha - 1}m$, qui n'est pas multiple de $2^{\alpha}$ puisque $m$ est impair. 
    $$\boxed{n \text{ est impair} \iff n \text{ divise } \sum_{k=1}^{n} k^{n}}$$
     Pour $n = 4$, on a $S = 1 + 16 + 81 + 256 = 354 \equiv 2 \;[4]$, et le contrôle numérique pour $n \leqslant 12$ confirme l'équivalence.
