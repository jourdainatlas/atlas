  enonce: |
    Soit $a \geqslant 2$ et $n \geqslant 2$ deux entiers.

    **1.** Montrer que si $a^{n} - 1$ est premier, alors $a = 2$ et $n$ est premier.

    **2.** Que dire de la réciproque ?
  corrige: |
    **1.** On a la factorisation $a^{n} - 1 = (a - 1)\big(a^{n-1} + \cdots + a + 1\big)$, dont le second facteur est au moins $1 + a > 1$. Si $a^{n} - 1$ est premier, le premier facteur vaut $1$ : $a = 2$. Si $n = k\ell$ avec $1 < k < n$, alors $2^{k} - 1$ divise $(2^{k})^{\ell} - 1 = 2^{n} - 1$, par la même factorisation, et $1 < 3 \leqslant 2^{k} - 1 < 2^{n} - 1$ : le nombre $2^{n} - 1$ n'est pas premier. Donc $n$ est premier. 
    $$\boxed{a^{n} - 1 \text{ premier} \implies a = 2 \text{ et } n \text{ premier}}$$

    **2.** La réciproque est fausse : $11$ est premier, et 
    $$\boxed{2^{11} - 1 = 2\,047 = 23 \times 89}$$
     Les nombres premiers de la forme $2^{p} - 1$ s'appellent nombres premiers de Mersenne ; pour $p = 2, 3, 5, 7$, on obtient $3$, $7$, $31$ et $127$, qui sont premiers, et $p = 11$ est le premier contre-exemple. L'exercice 72 étudie le problème symétrique des nombres $2^{b} + 1$.
- id: "mp-01-30"
  feuille: "f-mp-01"
  numero: 30
  partie: "Idéaux de $\\mathbb{Z}$"
  etoiles: 2
