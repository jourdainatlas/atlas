  enonce: |
    Soit $n \in \mathbb{N}^{*}$ et $a_{1}, \dots, a_{n+1}$ des éléments deux à deux distincts de $\llbracket 1\,,2n \rrbracket$.

    **1.** Montrer qu'il existe $i \neq j$ dans $\llbracket 1\,,n + 1 \rrbracket$ tels que $a_{i} \wedge a_{j} = 1$.

    **2.** Montrer qu'il existe $i \neq j$ dans $\llbracket 1\,,n + 1 \rrbracket$ tels que $a_{i}$ divise $a_{j}$.
  corrige: |
    **1.** Répartissons les éléments de $\llbracket 1\,,2n \rrbracket$ dans les $n$ « tiroirs » $\{1, 2\}$, $\{3, 4\}$, …, $\{2n - 1, 2n\}$. Les $n + 1$ entiers $a_{1}, \dots, a_{n+1}$ ne peuvent pas être dans des tiroirs deux à deux distincts : deux d'entre eux, distincts, sont dans le même, donc sont consécutifs. Un diviseur commun de $a$ et $a + 1$ divise leur différence $1$. 
    $$\boxed{\text{Deux des } a_{i} \text{ sont consécutifs, donc premiers entre eux.}}$$

    **2.** Écrivons chaque $a_{i}$ sous la forme $2^{e_{i}}m_{i}$, avec $m_{i}$ impair. Les $m_{i}$ sont des entiers impairs de $\llbracket 1\,,2n \rrbracket$, qui n'en compte que $n$ : il existe $i \neq j$ avec $m_{i} = m_{j}$. Si $e_{i} \leqslant e_{j}$, alors $a_{i} \mid a_{j}$, et sinon $a_{j} \mid a_{i}$. 
    $$\boxed{\text{L'un des } a_{i} \text{ divise un autre.}}$$
     Les deux résultats sont optimaux : les $n$ entiers pairs de $\llbracket 1\,,2n \rrbracket$ ne contiennent aucun couple premier entre eux, et les $n$ entiers de $\llbracket n + 1\,,2n \rrbracket$ aucun couple dont l'un divise l'autre, puisque le double du plus petit dépasse $2n$.
- id: "mp-01-32"
  feuille: "f-mp-01"
  numero: 32
  partie: "Les anneaux $\\mathbb{Z}/n\\mathbb{Z}$"
  etoiles: 1
  types: [Calcul]
  mots_cles: [anneaux Z/nZ, anneaux]
