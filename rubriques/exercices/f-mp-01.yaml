  enonce: |
    Soit $P \in \mathbb{K}[X]$ non constant et $x_{1}, \dots, x_{n}$ ses racines distinctes dans $\mathbb{C}$. Montrer que le polynôme $\displaystyle\prod_{i=1}^{n} (X - x_{i})$ appartient à $\mathbb{K}[X]$.
  corrige: |
    Notons $R = \prod_{i=1}^{n}(X - x_{i})$, et décomposons $P$ dans $\mathbb{C}[X]$ : $P = c\prod_{i=1}^{n}(X - x_{i})^{m_{i}}$, avec $c \in \mathbb{K}^{*}$ le coefficient dominant de $P$. Chaque $x_{i}$ est racine de $P'$ de multiplicité exactement $m_{i} - 1$ (chapitre 13 de MPSI), et les autres racines de $P'$ ne sont pas racines de $P$ : le PGCD unitaire de $P$ et $P'$ dans $\mathbb{C}[X]$ est 
    $$D = \prod_{i=1}^{n}(X - x_{i})^{m_{i} - 1}, \qquad\text{de sorte que}\qquad P = c\,R\,D.$$
     Montrons que $D \in \mathbb{K}[X]$. Soit $\Delta$ le PGCD unitaire de $P$ et $P'$ dans $\mathbb{K}[X]$. Par la proposition 13, il existe $U$, $V \in \mathbb{K}[X]$ tels que $UP + VP' = \Delta$ ; tout diviseur commun de $P$ et $P'$ dans $\mathbb{C}[X]$ divise donc $\Delta$, et $\Delta$, qui divise $P$ et $P'$ dans $\mathbb{K}[X] \subset \mathbb{C}[X]$, est un diviseur commun. Ainsi $\Delta$ est le PGCD unitaire de $P$ et $P'$ dans $\mathbb{C}[X]$ : $\Delta = D$. Enfin $cD \in \mathbb{K}[X]$ divise $P \in \mathbb{K}[X]$ dans $\mathbb{C}[X]$, de quotient $R$ ; par l'exercice 56, le quotient appartient à $\mathbb{K}[X]$. 
    $$\boxed{\prod_{i=1}^{n}(X - x_{i}) = \frac{P}{c\,(P \wedge P')} \in \mathbb{K}[X]}$$
     Pour $P = (X^{2} - 2)^{3} \in \mathbb{Q}[X]$, on trouve $R = X^{2} - 2$, alors que les racines $\pm\sqrt{2}$ ne sont pas rationnelles. Le polynôme $R$, sans racine multiple, a les mêmes racines que $P$.
