  enonce: |
    *Théorème de Wilson.* Soit $n \geqslant 2$. Montrer que $n$ est premier si et seulement si $(n - 1)! \equiv -1 \;[n]$.
  corrige: |
    Supposons $n = p$ premier. Dans le corps $\mathbb{Z}/p\mathbb{Z}$, l'équation $x^{2} = \overline{1}$ s'écrit $(x - \overline{1})(x + \overline{1}) = \overline{0}$, et ses seules solutions sont $\pm\overline{1}$, puisque $\mathbb{Z}/p\mathbb{Z}$ est intègre. Les autres éléments non nuls se regroupent en paires $\{x, x^{-1}\}$, avec $x \neq x^{-1}$, dont le produit vaut $\overline{1}$. Le produit de tous les éléments non nuls se réduit donc à $\overline{1} \times (-\overline{1})$ : 
    $$\overline{(p - 1)!} = \prod_{x \in \mathbb{Z}/p\mathbb{Z} \setminus \{\overline{0}\}} x = -\overline{1}.$$
     Pour $p = 2$, il n'y a qu'un élément non nul, $\overline{1} = -\overline{1}$, et le résultat subsiste. Réciproquement, si $n$ n'est pas premier, il a un diviseur $a$ tel que $1 < a < n$ ; alors $a$ divise $(n - 1)!$, et si l'on avait $(n - 1)! \equiv -1 \;[n]$, on aurait $0 \equiv -1 \;[a]$, ce qui est absurde. 
    $$\boxed{n \text{ premier} \iff (n - 1)! \equiv -1 \;[n]}$$
     Pour $p = 7$, on a $6! = 720 = 103 \times 7 - 1$ ✓. Le critère est remarquable mais inutilisable en pratique : calculer $(n - 1)!$ modulo $n$ demande bien plus d'opérations que la recherche de diviseurs jusqu'à $\sqrt{n}$.
