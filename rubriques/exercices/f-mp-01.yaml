  enonce: |
    **1.** La classe $\overline{18}$ est-elle inversible dans $\mathbb{Z}/49\mathbb{Z}$ ? Si oui, quel est son inverse ?

    **2.** La classe $\overline{42}$ est-elle inversible dans $\mathbb{Z}/135\mathbb{Z}$ ? Si oui, quel est son inverse ?
  corrige: |
    **1.** Comme $49 = 7^{2}$ et que $7 \nmid 18$, on a $18 \wedge 49 = 1$, et $\overline{18}$ est inversible (théorème 4). On applique la méthode de la section 1.5.1 : l'algorithme d'Euclide donne successivement 
    $$49 = 2 \times 18 + 13, \quad 18 = 13 + 5, \quad 13 = 2 \times 5 + 3, \quad 5 = 3 + 2, \quad 3 = 2 + 1,$$
     et en remontant les calculs, $18 \times 30 - 11 \times 49 = 540 - 539 = 1$. 
    $$\boxed{\overline{18}^{-1} = \overline{30} \text{ dans } \mathbb{Z}/49\mathbb{Z}}$$

    **2.** On a $42 \wedge 135 = 3$, puisque $42 = 2 \times 3 \times 7$ et $135 = 3^{3} \times 5$ : la classe $\overline{42}$ n'est pas inversible (théorème 4). 
    $$\boxed{\overline{42} \text{ n'est pas inversible dans } \mathbb{Z}/135\mathbb{Z}}$$
     C'est même un diviseur de zéro, puisque $\overline{42} \times \overline{45} = \overline{1\,890} = \overline{14 \times 135} = \overline{0}$, avec $45 = \frac{135}{3}$.
- id: "mp-01-33"
  feuille: "f-mp-01"
  numero: 33
  partie: "Les anneaux $\\mathbb{Z}/n\\mathbb{Z}$"
  etoiles: 1
  types: [Calcul]
  mots_cles: [anneaux Z/nZ]
