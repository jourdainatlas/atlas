  page_corrige: 38
  enonce: |
    Soit $a$, $b > 1$ deux entiers. Montrer que la suite $a$, $a^{a}$, $a^{a^{a}}$, $a^{a^{a^{a}}}$, … est stationnaire modulo $b$.
  corrige: |
    On fixe $a > 1$ et l'on note $u_{1} = a$, $u_{k+1} = a^{u_{k}}$. On démontre, par récurrence forte sur $b \geqslant 1$, l'énoncé : *la suite $(u_{k})$ est stationnaire modulo $b$*. Pour $b = 1$, c'est évident.

    Soit $b \geqslant 2$, et supposons le résultat vrai pour tout entier strictement inférieur à $b$. Écrivons $b = uv$, où $u$ regroupe les facteurs $p^{\beta}$ de la décomposition de $b$ pour lesquels $p$ divise $a$, et $v$ les autres ; ainsi $u \wedge v = 1$ et $v \wedge a = 1$. Notons $\beta_{\max}$ le plus grand exposant apparaissant dans $u$ ($0$ si $u = 1$).

    • Pour $e \geqslant \beta_{\max}$, chaque $p^{\beta}$ de $u$ divise $a^{e}$, donc $u \mid a^{e}$.

    • Par le théorème d'Euler (théorème 6), $a^{\varphi(v)} \equiv 1 \;[v]$, donc $a^{e}$ modulo $v$ ne dépend que de $e$ modulo $T = \varphi(v)$.

    Par conséquent, si $e$, $e' \geqslant \beta_{\max}$ et $e \equiv e' \;[T]$, alors $a^{e} \equiv a^{e'}$ modulo $u$ et modulo $v$, donc modulo $b$ (théorème 5). Or $T = \varphi(v) \leqslant v \leqslant b$, et $T < b$ : si $v \geqslant 2$, $\varphi(v) \leqslant v - 1$, et si $v = 1$, $T = 1 < b$. Par l'hypothèse de récurrence appliquée à $T$, il existe $k_{0}$ tel que $u_{k} \equiv u_{k+1} \;[T]$ pour $k \geqslant k_{0}$. D'autre part, $u_{k+1} = a^{u_{k}} > u_{k}$, car $a^{x} > x$ pour tout entier $x$ ; la suite $(u_{k})$ est strictement croissante d'entiers, et dépasse $\beta_{\max}$ à partir d'un rang $k_{1}$. Pour $k \geqslant \max(k_{0}, k_{1})$, les exposants $u_{k}$ et $u_{k+1}$ sont au moins égaux à $\beta_{\max}$ et congrus modulo $T$, donc 
    $$u_{k+1} = a^{u_{k}} \equiv a^{u_{k+1}} = u_{k+2} \;[b].$$

    $$\boxed{\text{La suite } a, \ a^{a}, \ a^{a^{a}}, \ldots \text{ est stationnaire modulo } b}$$
     *À retenir.* Deux difficultés se cumulent : $a$ n'est pas forcément premier avec $b$, d'où la séparation $b = uv$, et l'exposant est lui-même une tour, d'où la récurrence sur le module, qui diminue à chaque étage. Par exemple, modulo $1\,000$, la suite des tours de $3$ vaut $3$, $27$, $987$ (car $3^{3^{3}} = 7\,625\,597\,484\,987$), puis $387$ à partir du quatrième terme, comme le confirme un calcul fondé sur la même réduction des exposants.

