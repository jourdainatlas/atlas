  enonce: |
    Soit $A$, $B \in \mathbb{K}[X]$ et $P \in \mathbb{K}[X]$ non constant. Montrer que $A \circ P$ divise $B \circ P$ si et seulement si $A$ divise $B$.
  corrige: |
    Rappelons que, pour $P$ fixé, l'application $A \mapsto A \circ P$ respecte la somme et le produit (chapitre 13 de MPSI), et que $\deg(A \circ P) = \deg A \times \deg P$ pour $A \neq 0$.

    Si $B = AC$, alors $B \circ P = (A \circ P)(C \circ P)$, et $A \circ P$ divise $B \circ P$. Réciproquement, supposons que $A \circ P$ divise $B \circ P$. Si $A = 0$, alors $B \circ P = 0$, donc $B = 0$ (sinon $\deg(B \circ P) \geqslant 0$), et $A$ divise $B$. Sinon, la division euclidienne $B = AQ + R$, avec $\deg R < \deg A$, donne 
    $$B \circ P = (A \circ P)(Q \circ P) + R \circ P,$$
     donc $A \circ P$ divise $R \circ P$. Si $R \neq 0$, on aurait $\deg(R \circ P) = \deg R \deg P < \deg A \deg P = \deg(A \circ P)$, car $\deg P \geqslant 1$ : un multiple non nul de $A \circ P$ aurait un degré inférieur au sien. Donc $R \circ P = 0$, puis $R = 0$, et $A \mid B$. 
    $$\boxed{A \circ P \mid B \circ P \iff A \mid B}$$
     L'hypothèse « $P$ non constant » est indispensable : avec $P = 1$, le polynôme $X \circ P = 1$ divise $1 \circ P = 1$, alors que $X$ ne divise pas $1$.
- id: "mp-01-56"
  feuille: "f-mp-01"
  numero: 56
  partie: "L'anneau $\\mathbb{K}[X]$"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["anneau K[X]", anneau des polynômes, corps]
  noeuds: [pol-principal, pol-irreductibles, a-corps]
  notions: [polynome-irreductible]
  source: "TD 3 Arithmétique (Sainte-Geneviève), exercice 93 (corps L et K pris dans C)"
  page_enonce: 9
  page_corrige: 25
  enonce: |
    Soit $\mathbb{L}$ un sous-corps de $\mathbb{C}$ et $\mathbb{K}$ un sous-corps de $\mathbb{L}$. Soit $A$, $B \in \mathbb{K}[X]$ deux polynômes tels qu'il existe $Q \in \mathbb{L}[X]$ vérifiant $A = QB$. Montrer qu'il existe $Q \in \mathbb{K}[X]$ tel que $A = QB$.
  corrige: |
    Si $B = 0$, alors $A = 0$ et $Q = 0$ convient. Sinon, effectuons la division euclidienne de $A$ par $B$ dans $\mathbb{K}[X]$ : $A = BQ_{1} + R_{1}$, avec $Q_{1}$, $R_{1} \in \mathbb{K}[X]$ et $\deg R_{1} < \deg B$. C'est aussi une division euclidienne dans $\mathbb{L}[X]$, puisque $\mathbb{K}[X] \subset \mathbb{L}[X]$ ; et $A = QB + 0$ en est une autre. Par unicité de la division euclidienne dans $\mathbb{L}[X]$ (chapitre 13 de MPSI), $Q = Q_{1}$ et $R_{1} = 0$. 
    $$\boxed{Q \in \mathbb{K}[X] : \ \text{si } B \text{ divise } A \text{ dans } \mathbb{L}[X], \text{ il le divise dans } \mathbb{K}[X].}$$
     *À retenir.* La divisibilité, la division euclidienne et donc le PGCD ne dépendent pas du corps dans lequel on se place : ce sont des calculs qui n'utilisent que les coefficients. L'irréductibilité, elle, en dépend (exercices 51 et 53). L'exercice 58 utilise ce principe.
- id: "mp-01-57"
  feuille: "f-mp-01"
  numero: 57
  partie: "L'anneau $\\mathbb{K}[X]$"
  etoiles: 2
