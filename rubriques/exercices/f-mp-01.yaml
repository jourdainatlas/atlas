  enonce: |
    On dit qu'un polynôme $P \in \mathbb{Z}[X]$ non constant est *irréductible dans $\mathbb{Z}[X]$* s'il ne s'écrit pas comme produit de deux polynômes non constants de $\mathbb{Z}[X]$. Soit $\lambda_{1}, \dots, \lambda_{n}$ des entiers deux à deux distincts. Montrer que $P = \displaystyle\prod_{k=1}^{n} (X - \lambda_{k}) - 1$ est irréductible dans $\mathbb{Z}[X]$.
  corrige: |
    Supposons $P = AB$ avec $A$, $B \in \mathbb{Z}[X]$ non constants ; alors $\deg A$ et $\deg B$ sont strictement inférieurs à $n = \deg A + \deg B$. Pour chaque $k$, 
    $$A(\lambda_{k})\,B(\lambda_{k}) = P(\lambda_{k}) = -1,$$
     et $A(\lambda_{k})$, $B(\lambda_{k})$ sont des entiers : l'un vaut $1$ et l'autre $-1$, de sorte que $(A + B)(\lambda_{k}) = 0$. Le polynôme $A + B$, de degré strictement inférieur à $n$, a donc $n$ racines distinctes : il est nul (chapitre 13 de MPSI). Alors $P = -A^{2}$, dont le coefficient dominant $-a^{2}$ est strictement négatif, alors que $P$ est unitaire : c'est absurde. 
    $$\boxed{\prod_{k=1}^{n}(X - \lambda_{k}) - 1 \text{ est irréductible dans } \mathbb{Z}[X]}$$
     L'argument repose sur le fait que $\pm 1$ sont les seuls inversibles de $\mathbb{Z}$ : les valeurs $A(\lambda_{k})$ sont prises dans un ensemble fini. Le polynôme obtenu en remplaçant $-1$ par $+1$ peut, lui, être réductible : $(X - 1)(X - 3) + 1 = (X - 2)^{2}$.
- id: "mp-01-60"
  feuille: "f-mp-01"
  numero: 60
  partie: "Algèbres"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [algèbres]
  noeuds: [alg]
  notions: []
  source: "bibmath, Anneaux, exercice 26"
  page_enonce: 9
  page_corrige: 27
  enonce: |
    Pour $a$, $b$, $c \in \mathbb{R}$, on note 
    $$M(a, b, c) = \begin{pmatrix} a & b & c \\ c & a & b \\ b & c & a \end{pmatrix}, \qquad\text{et}\qquad E = \{M(a, b, c) \mid (a, b, c) \in \mathbb{R}^{3}\}.$$
     Montrer que $E$ est une sous-algèbre de $\mathcal{M}_{3}(\mathbb{R})$, et en donner une base en tant qu'espace vectoriel.
  corrige: |
    Notons $J = M(0, 1, 0)$. Un calcul direct donne 
    $$J = \begin{pmatrix} 0 & 1 & 0 \\ 0 & 0 & 1 \\ 1 & 0 & 0 \end{pmatrix}, \qquad J^{2} = \begin{pmatrix} 0 & 0 & 1 \\ 1 & 0 & 0 \\ 0 & 1 & 0 \end{pmatrix} = M(0, 0, 1), \qquad J^{3} = I_{3},$$
     de sorte que $M(a, b, c) = aI_{3} + bJ + cJ^{2}$, et $E = \mathrm{Vect}(I_{3}, J, J^{2})$ est un sous-espace vectoriel de $\mathcal{M}_{3}(\mathbb{R})$ qui contient $I_{3}$. Il est stable par produit, puisque $J^{k}J^{\ell} = J^{k+\ell}$ et que $J^{3} = I_{3}$, $J^{4} = J$ : le produit de deux éléments de $E$ est une combinaison linéaire de $I_{3}$, $J$, $J^{2}$. Enfin la famille $(I_{3}, J, J^{2})$ est libre, car la première ligne de $aI_{3} + bJ + cJ^{2}$ est $(a, b, c)$. 
    $$\boxed{E \text{ est une sous-algèbre de } \mathcal{M}_{3}(\mathbb{R}), \text{ de base } (I_{3}, J, J^{2})}$$
     Cette algèbre est commutative, alors que $\mathcal{M}_{3}(\mathbb{R})$ ne l'est pas. L'application $P \mapsto P(J)$ de $\mathbb{R}[X]$ sur $E$ est un morphisme d'algèbres surjectif, de noyau $(X^{3} - 1)\mathbb{R}[X]$ : $E$ est « l'algèbre des polynômes modulo $X^{3} - 1$ », et les matrices de $E$ sont appelées *circulantes*.
