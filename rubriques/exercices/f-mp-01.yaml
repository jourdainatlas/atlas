  source: "TD 3 Arithmétique (Sainte-Geneviève), exercice 130"
  page_enonce: 9
  page_corrige: 26
  enonce: |
    *Théorème des racines rationnelles.* Soit $P = \displaystyle\sum_{k=0}^{n} a_{k}X^{k} \in \mathbb{Z}[X]$, avec $a_{n} \neq 0$. On suppose que $P$ possède des racines rationnelles $\frac{p_{1}}{q_{1}}, \dots, \frac{p_{r}}{q_{r}}$, écrites sous forme irréductible avec $q_{j} \in \mathbb{N}^{*}$ et répétées selon leur multiplicité.

    **1.** Montrer qu'il existe $Q \in \mathbb{Z}[X]$ tel que $P = Q \displaystyle\prod_{j=1}^{r} (q_{j}X - p_{j})$.

    **2.** En déduire que $p_{1} \cdots p_{r}$ divise $a_{0}$ et que $q_{1} \cdots q_{r}$ divise $a_{n}$.
  corrige: |
    **1.** *Le cas d'une racine.* Soit $\frac{p}{q}$ une racine rationnelle de $P$, avec $p \wedge q = 1$ et $q \geqslant 1$. Dans $\mathbb{Q}[X]$, on a $P = (qX - p)Q$ avec $Q \in \mathbb{Q}[X]$ (chapitre 13 de MPSI), et il s'agit de montrer que $Q \in \mathbb{Z}[X]$. Soit $d \geqslant 1$ le plus petit entier tel que $dQ$ soit à coefficients entiers, et supposons $d > 1$ ; soit $\ell$ un diviseur premier de $d$. Écrivons $dQ = \sum_{k} c_{k}X^{k}$ ; par minimalité de $d$, les $c_{k}$ ne sont pas tous multiples de $\ell$. En identifiant les coefficients de $dP = (qX - p)\,dQ$, avec $c_{-1} = 0$ et $c_{k} = 0$ pour $k \geqslant n$, 
    $$d\,a_{k} = q\,c_{k-1} - p\,c_{k} \qquad \text{pour } 0 \leqslant k \leqslant n,$$
     et le membre de gauche est multiple de $\ell$. Soit $i$ le plus petit indice tel que $\ell \nmid c_{i}$ : l'égalité pour $k = i$ donne $\ell \mid p\,c_{i}$, donc $\ell \mid p$. Soit $j$ le plus grand indice tel que $\ell \nmid c_{j}$ : l'égalité pour $k = j + 1$ donne $\ell \mid q\,c_{j}$, donc $\ell \mid q$. Ainsi $\ell$ divise $p \wedge q = 1$, ce qui est absurde : $d = 1$.

    *Le cas général,* par récurrence sur $r$. Écrivons $P = (q_{1}X - p_{1})Q_{1}$ avec $Q_{1} \in \mathbb{Z}[X]$. Comme $\prod_{j}\big(X - \frac{p_{j}}{q_{j}}\big)$ divise $P$ dans $\mathbb{Q}[X]$, et que $\mathbb{Q}[X]$ est intègre, $\prod_{j \geqslant 2}\big(X - \frac{p_{j}}{q_{j}}\big)$ divise $Q_{1}$ : on applique l'hypothèse de récurrence à $Q_{1}$ et aux $r - 1$ racines restantes. 
    $$\boxed{P = Q\prod_{j=1}^{r}(q_{j}X - p_{j}), \quad Q \in \mathbb{Z}[X]}$$

    **2.** Le coefficient constant et le coefficient dominant d'un produit sont les produits des coefficients correspondants. Avec $Q = \sum b_{k}X^{k}$ de degré $n - r$, 
    $$a_{0} = b_{0}\prod_{j=1}^{r}(-p_{j}), \qquad a_{n} = b_{n-r}\prod_{j=1}^{r}q_{j},$$
     où $b_{0}$ et $b_{n-r}$ sont des entiers. 
    $$\boxed{p_{1} \cdots p_{r} \mid a_{0} \qquad\text{et}\qquad q_{1} \cdots q_{r} \mid a_{n}}$$
     En particulier, une racine rationnelle d'un polynôme *unitaire* à coefficients entiers est un entier, qui divise $a_{0}$ : c'est ce qu'utilisent les exercices 53 et 74. Le point délicat est la question 1 : diviser dans $\mathbb{Q}[X]$ ne garantit pas un quotient entier, et c'est la condition $p \wedge q = 1$ qui le donne.
- id: "mp-01-58"
