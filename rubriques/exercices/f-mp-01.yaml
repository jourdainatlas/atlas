  noeuds: [alg, pol-principal]
  notions: []
  source: "TD 2 Algèbre générale (Sainte-Geneviève), exercice 54"
  page_enonce: 10
  page_corrige: 29
  enonce: |
    Déterminer toutes les sous-algèbres de dimension finie de la $\mathbb{R}$-algèbre $\mathcal{C}(\mathbb{R}, \mathbb{R})$ des fonctions continues de $\mathbb{R}$ dans $\mathbb{R}$. On pourra se demander à quelle condition une fonction $f$ vérifie $P(f) = 0$, pour un polynôme $P \in \mathbb{R}[X]$ non nul.
  corrige: |
    Soit $\mathcal{B}$ une sous-algèbre de dimension finie $N$, et $f \in \mathcal{B}$. La famille $(1, f, f^{2}, \dots, f^{N})$ de $N + 1$ éléments de $\mathcal{B}$ est liée (chapitre 15 de MPSI) : il existe un polynôme $P \in \mathbb{R}[X]$ non nul tel que $P(f) = 0$, c'est-à-dire $P\big(f(x)\big) = 0$ pour tout réel $x$. La fonction $f$ prend donc ses valeurs dans l'ensemble fini des racines réelles de $P$. Comme elle est continue sur l'intervalle $\mathbb{R}$, son image est un intervalle (théorème des valeurs intermédiaires, chapitre 8 de MPSI), contenu dans un ensemble fini : c'est un singleton, et $f$ est constante. Ainsi $\mathcal{B}$ est contenue dans la droite des fonctions constantes, et la contient, puisqu'elle contient $1$. 
    $$\boxed{\text{La seule sous-algèbre de dimension finie de } \mathcal{C}(\mathbb{R}, \mathbb{R}) \text{ est celle des fonctions constantes.}}$$
     *À retenir.* Le principe « dans une algèbre de dimension finie, tout élément annule un polynôme non nul » est le point de départ de la réduction des endomorphismes : le chapitre 3 l'appliquera à l'algèbre $\mathcal{L}(E)$. La continuité est essentielle : dans l'algèbre de toutes les fonctions de $\mathbb{R}$ dans $\mathbb{R}$, la fonction indicatrice de $\mathbb{R}_{+}$, qui vérifie $f^{2} = f$, engendre la sous-algèbre de dimension $2$ formée des fonctions constantes sur $\mathbb{R}_{-}^{*}$ et sur $\mathbb{R}_{+}$.
- id: "mp-01-66"
  feuille: "f-mp-01"
  numero: 66
  partie: "Algèbres"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [algèbres, anneaux]
  noeuds: [alg, a-anneau]
  notions: []
  source: "bibmath, Anneaux, exercice 27"
  page_enonce: 10
  page_corrige: 29
  enonce: |
    Soit $\mathcal{A}$ une $\mathbb{R}$-algèbre commutative et intègre, de dimension finie $n \geqslant 2$, d'unité $1$ ; on identifie $\mathbb{R}$ à $\mathbb{R} \cdot 1$.

    **1.** Montrer que tout élément non nul de $\mathcal{A}$ est inversible.

    **2.** Soit $a \in \mathcal{A}$ tel que $a \notin \mathbb{R} \cdot 1$. Montrer que $(1, a)$ est libre et que $(1, a, a^{2})$ est liée.

    **3.** En déduire qu'il existe $i \in \mathrm{Vect}(1, a)$ tel que $i^{2} = -1$.

    **4.** En déduire que $\dim \mathcal{A} = 2$.

    **5.** En déduire que $\mathcal{A}$ est isomorphe à $\mathbb{C}$.
  corrige: |
    **1.** Soit $a \neq 0$. L'application $x \mapsto ax$ est linéaire de $\mathcal{A}$ dans $\mathcal{A}$, et injective, puisque $ax = 0$ entraîne $x = 0$ par intégrité. En dimension finie, elle est donc bijective (chapitre 15 de MPSI) : il existe $b$ tel que $ab = 1$, et $ba = 1$ par commutativité. 
    $$\boxed{\text{Tout élément non nul de } \mathcal{A} \text{ est inversible}}$$

    **2.** Comme $a \notin \mathbb{R} \cdot 1$ et $1 \neq 0$, la famille $(1, a)$ est libre. La famille $(1, a, \dots, a^{n})$, de $n + 1$ éléments, est liée : il existe un polynôme non nul $P \in \mathbb{R}[X]$ tel que $P(a) = 0$. Décomposons $P$ en produit de facteurs irréductibles de $\mathbb{R}[X]$, de degré $1$ ou $2$ (théorème 8 et chapitre 13 de MPSI). L'application $Q \mapsto Q(a)$ étant un morphisme d'algèbres, le produit des $P_{i}(a)$ est nul, et l'un d'eux est nul par intégrité. Il ne peut être de degré $1$, car $a \notin \mathbb{R} \cdot 1$ ; il est donc de la forme $X^{2} + \beta X + \gamma$, et $a^{2} + \beta a + \gamma = 0$. 
    $$\boxed{(1, a) \text{ est libre}, \qquad (1, a, a^{2}) \text{ est liée}}$$

    **3.** Le polynôme $X^{2} + \beta X + \gamma$ est irréductible, donc son discriminant $\Delta = \beta^{2} - 4\gamma$ est strictement négatif. La forme canonique donne 
    $$\Big(a + \frac{\beta}{2}\Big)^{2} = \frac{\beta^{2}}{4} - \gamma = \frac{\Delta}{4} = -\frac{|\Delta|}{4}, \qquad\text{d'où}\qquad i = \frac{2a + \beta}{\sqrt{|\Delta|}}.$$

    $$\boxed{i \in \mathrm{Vect}(1, a) \text{ vérifie } i^{2} = -1}$$

    **4.** Fixons un élément $i$ comme à la question 3 ; il n'est pas dans $\mathbb{R} \cdot 1$, car le carré d'un réel n'est pas $-1$, donc $(1, i)$ est libre. Soit $b \in \mathcal{A} \setminus \mathbb{R} \cdot 1$. La question 3, appliquée à $b$, fournit $j = u + vb$, avec $u$, $v$ réels et $v \neq 0$ (sinon $j^{2}$ serait un réel positif), tel que $j^{2} = -1$. Alors $(j - i)(j + i) = j^{2} - i^{2} = 0$ par commutativité, donc $j = \pm i$ par intégrité, et 
    $$b = \frac{j - u}{v} \in \mathrm{Vect}(1, i).$$

    $$\boxed{\mathcal{A} = \mathrm{Vect}(1, i), \qquad \dim \mathcal{A} = 2}$$

    **5.** L'application $\phi : x + \mathrm{i} y \mapsto x + y\,i$, de $\mathbb{C}$ dans $\mathcal{A}$, est linéaire et bijective, puisque $(1, i)$ est une base de $\mathcal{A}$ ; elle envoie $1$ sur $1$. Elle respecte le produit, car $i^{2} = -1 = \mathrm{i}^{2}$ et que $\mathcal{A}$ est commutative : 
    $$(x + y\,i)(x' + y'\,i) = (xx' - yy') + (xy' + x'y)\,i.$$

    $$\boxed{\mathcal{A} \text{ est isomorphe à l'algèbre } \mathbb{C}}$$
     Avec l'hypothèse $n \geqslant 1$ au lieu de $n \geqslant 2$, on obtiendrait $\mathcal{A} \simeq \mathbb{R}$ ou $\mathcal{A} \simeq \mathbb{C}$. Le résultat dit que $\mathbb{C}$ est le seul « corps commutatif de nombres » de dimension finie au-dessus de $\mathbb{R}$ ; les quaternions de Hamilton, de dimension $4$, n'y échappent qu'en renonçant à la commutativité.
- id: "mp-01-67"
  feuille: "f-mp-01"
  numero: 67
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [synthèse, groupes cycliques, "ordre d'un élément", idéaux, anneaux, "indicatrice d'Euler", nombres premiers, polynômes irréductibles]
  noeuds: [gf-cycliques, a-ideal, a-anneau, z-zn, z-premiers, pol-irreductibles, pol-principal, alg, a-corps]
  notions: [groupe-cyclique, ordre-element, ideal, polynome-irreductible]
  page_enonce: 10
  page_corrige: 30
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par une démonstration ou un contre-exemple.

    **1.** Tout groupe dont le cardinal est un nombre premier est cyclique.

    **2.** Dans un groupe fini, si $x$ et $y$ sont d'ordre $2$, alors $xy$ est d'ordre $1$ ou $2$.

    **3.** Le groupe $(\mathbb{Q}^{*}, \times)$ est monogène.

    **4.** Si $G$ et $H$ sont deux groupes cycliques de cardinaux premiers entre eux, le groupe produit $G \times H$ est cyclique.

    **5.** Dans l'anneau $\mathbb{Z}/n\mathbb{Z}$, tout élément non nul est inversible ou diviseur de zéro.

    **6.** L'image d'un idéal par un morphisme d'anneaux commutatifs est un idéal de l'anneau d'arrivée.

    **7.** Tout anneau intègre fini est un corps.

    **8.** Pour tout entier $n \geqslant 3$, l'entier $\varphi(n)$ est pair.

    **9.** Un polynôme de $\mathbb{Q}[X]$ de degré $4$ qui n'a aucune racine rationnelle est irréductible dans $\mathbb{Q}[X]$.

    **10.** L'ensemble des matrices triangulaires supérieures de $\mathcal{M}_{n}(\mathbb{K})$ dont tous les coefficients diagonaux sont égaux est une sous-algèbre de $\mathcal{M}_{n}(\mathbb{K})$.
  corrige: |
    **1. Vrai.** Soit $G$ de cardinal $p$ premier, et $x \neq e$. L'ordre de $x$ divise $p$ (théorème 2) et n'est pas $1$ : il vaut $p$, et $\langle x \rangle$, qui a $p$ éléments (proposition 4 (ii)), est égal à $G$.

    **2. Faux.** Dans $\mathfrak{S}_{3}$, les transpositions $x = (1\ 2)$ et $y = (2\ 3)$ sont d'ordre $2$, et $xy = (1\ 2\ 3)$ est d'ordre $3$. L'affirmation est vraie dans un groupe abélien, où $(xy)^{2} = x^{2}y^{2} = e$.

    **3. Faux.** Si $\mathbb{Q}^{*} = \{a^{k} \mid k \in \mathbb{Z}\}$, on pourrait écrire $2 = a^{k}$ et $3 = a^{\ell}$, avec $k$, $\ell$ non nuls, d'où $2^{\ell} = a^{k\ell} = 3^{k}$. Si $k$ et $\ell$ ont le même signe, cela donne $2^{|\ell|} = 3^{|k|}$, un nombre pair égal à un nombre impair ; sinon, $2^{|\ell|}3^{|k|} = 1$, ce qui est impossible.

    **4. Vrai.** Si $G \simeq \mathbb{Z}/m\mathbb{Z}$ et $H \simeq \mathbb{Z}/n\mathbb{Z}$ avec $m \wedge n = 1$ (théorème 1), alors 
    $$G \times H \simeq \mathbb{Z}/m\mathbb{Z} \times \mathbb{Z}/n\mathbb{Z} \simeq \mathbb{Z}/mn\mathbb{Z}$$
     par le théorème 5, qui fournit en particulier un isomorphisme de groupes additifs. Le groupe $G \times H$ est donc cyclique.

    **5. Vrai.** Soit $\overline{k} \neq \overline{0}$. Si $k \wedge n = 1$, il est inversible (théorème 4). Sinon, $d = k \wedge n > 1$, et $\overline{k} \times \overline{n/d} = \overline{(k/d)\,n} = \overline{0}$, avec $\overline{n/d} \neq \overline{0}$ puisque $0 < \frac{n}{d} < n$ : c'est un diviseur de zéro.

    **6. Faux.** L'injection canonique $\mathbb{Z} \to \mathbb{Q}$ est un morphisme d'anneaux, et l'image de l'idéal $2\mathbb{Z}$ est $2\mathbb{Z}$, qui n'est pas un idéal de $\mathbb{Q}$, car $\frac{1}{2} \times 2 = 1 \notin 2\mathbb{Z}$. L'affirmation devient vraie pour un morphisme surjectif.

    **7. Vrai.** Soit $A$ intègre fini et $x \neq 0$. L'application $y \mapsto xy$ de $A$ dans $A$ est injective par intégrité, donc bijective puisque $A$ est fini : il existe $y$ tel que $xy = 1$.

    **8. Vrai.** Pour $n \geqslant 3$, la classe $-\overline{1}$ est un élément de $(\mathbb{Z}/n\mathbb{Z})^{\times}$ distinct de $\overline{1}$ et de carré $\overline{1}$ : elle est d'ordre $2$, et $2$ divise le cardinal $\varphi(n)$ du groupe (théorème 2).

    **9. Faux.** Le polynôme $X^{4} + 4$ n'a aucune racine réelle, a fortiori aucune racine rationnelle, et pourtant 
    $$X^{4} + 4 = (X^{2} + 2X + 2)(X^{2} - 2X + 2).$$

    **10. Vrai.** Une telle matrice s'écrit $aI_{n} + N$, avec $N$ triangulaire supérieure stricte. L'ensemble considéré est donc $\mathbb{K} I_{n} + \mathcal{T}$, où $\mathcal{T}$ est le sous-espace des matrices triangulaires supérieures strictes : c'est un sous-espace qui contient $I_{n}$. Le produit des matrices triangulaires supérieures strictes en est une (chapitre 16 de MPSI), donc 
    $$(aI_{n} + N)(bI_{n} + M) = ab\,I_{n} + (aM + bN + NM)$$
     appartient encore à l'ensemble.

    $$\boxed{\text{Vrai : } 1, 4, 5, 7, 8, 10. \qquad \text{Faux : } 2, 3, 6, 9.}$$
- id: "mp-01-68"
  feuille: "f-mp-01"
  numero: 68
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [synthèse, sous-groupe engendré, idéaux]
  noeuds: [a-sous-groupe, a-ideal]
  notions: [sous-groupe-engendre, ideal]
  source: "TD 2 Algèbre générale (Sainte-Geneviève), exercice 4"
  page_enonce: 11
  page_corrige: 31
  enonce: |
    Soit $A$ un anneau commutatif et $x$, $y \in A$. On note $(x) = xA$, et $(x, y) = \{ax + by \mid a, b \in A\}$.

    **1.** Montrer que si l'idéal $(x, y)$ est engendré par un seul élément, alors $(x) \cap (y)$ l'est aussi.

    **2.** La réciproque est-elle vraie ?
  corrige: |
    **1.** Supposons $(x, y) = (d)$. Comme $x$, $y \in (d)$, on écrit $x = dx'$ et $y = dy'$ ; comme $d \in (x, y)$, on écrit $d = ax + by$. Posons $e = ax' + by'$, de sorte que $d = de$, soit $d(1 - e) = 0$. Montrons que 
    $$(x) \cap (y) = (m), \qquad\text{où}\quad m = xy' = dx'y' = x'y.$$
     L'élément $m$ appartient à $(x)$ et à $(y)$, d'après ses deux écritures, donc $(m) \subset (x) \cap (y)$. Réciproquement, soit $z = xu = yv$ dans $(x) \cap (y)$. D'une part, 
    $$ze = ax'z + by'z = ax'(yv) + by'(xu) = m\,(av + bu) \in (m) ;$$
     d'autre part, $z(1 - e) = x'u \cdot d(1 - e) = 0$. Donc $z = ze \in (m)$. 
    $$\boxed{\text{Si } (x, y) = (d), \text{ alors } (x) \cap (y) = (xy'), \text{ où } x = dx', \ y = dy'}$$
     Dans un anneau intègre, on simplifierait directement par $d$ ; l'élément $e$, qui vérifie $de = d$, remplace cette simplification. Dans $\mathbb{Z}$, on retrouve que le PPCM de $x$ et $y$ est $\frac{xy}{x \wedge y}$.

    **2.** La réciproque est fausse. Dans l'anneau $\mathbb{Z}[X]$ des polynômes à coefficients entiers, prenons $x = 2$ et $y = X$. Un polynôme de $(2) \cap (X)$ s'écrit $XQ$, à coefficients tous pairs, donc $Q$ est à coefficients pairs : $(2) \cap (X) = (2X)$ est principal. Supposons en revanche $(2, X) = (D)$. Alors $D$ divise $2$, donc est un entier diviseur de $2$ (comparer les degrés) ; et $D$ divise $X$, donc $D = \pm 1$. On aurait $1 = 2A + XB$ avec $A$, $B \in \mathbb{Z}[X]$, et l'évaluation en $0$ donnerait $1 = 2A(0)$, qui est pair. 
    $$\boxed{\text{Dans } \mathbb{Z}[X], \ (2) \cap (X) = (2X) \text{ est principal, mais } (2, X) \text{ ne l'est pas.}}$$
