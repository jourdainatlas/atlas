  source: "bibmath, Anneaux, exercice 9"
  page_enonce: 5
  page_corrige: 13
  enonce: |
    Soit $p$ un nombre premier. On note $\mathbb{Z}_{p} = \Big\{\dfrac{m}{n} \;\Big|\; m \in \mathbb{Z}, \ n \in \mathbb{N}^{*}, \ p \wedge n = 1\Big\}$.

    **1.** Montrer que $\mathbb{Z}_{p}$ est un sous-anneau de $(\mathbb{Q}, +, \times)$.

    **2.** Pour $k \in \mathbb{N}$, on note $J_{p^{k}} = \Big\{\dfrac{m}{n} \;\Big|\; m \in \mathbb{Z}, \ n \in \mathbb{N}^{*}, \ p \wedge n = 1, \ p^{k} \mid m\Big\}$. Montrer que $J_{p^{k}}$ est un idéal de $\mathbb{Z}_{p}$.

    **3.** Montrer que tout idéal non nul $I$ de $\mathbb{Z}_{p}$ est égal à l'un des $J_{p^{k}}$, pour un certain $k \in \mathbb{N}$.
  corrige: |
    **1.** La partie $\mathbb{Z}_{p}$ contient $1 = \frac{1}{1}$. Pour $\frac{m}{n}$ et $\frac{m'}{n'}$ dans $\mathbb{Z}_{p}$, on a 
    $$\frac{m}{n} - \frac{m'}{n'} = \frac{mn' - m'n}{nn'}, \qquad \frac{m}{n} \times \frac{m'}{n'} = \frac{mm'}{nn'},$$
     et $p$ ne divise pas $nn'$, puisqu'un nombre premier qui divise un produit divise l'un des facteurs (lemme d'Euclide, chapitre 12 de MPSI). 
    $$\boxed{\mathbb{Z}_{p} \text{ est un sous-anneau de } \mathbb{Q}}$$

    **2.** La partie $J_{p^{k}}$ contient $0$. Avec les mêmes écritures, si $p^{k}$ divise $m$ et $m'$, il divise $mn' - m'n$ ; et pour $\frac{a}{b} \in \mathbb{Z}_{p}$, il divise $am$, avec $p \nmid bn$. 
    $$\boxed{J_{p^{k}} \text{ est un idéal de } \mathbb{Z}_{p}}$$

    **3.** Soit $x = \frac{m}{n} \in \mathbb{Z}_{p}$ non nul ; écrivons $m = p^{v}m'$ avec $p \nmid m'$. L'entier $v$ ne dépend pas de l'écriture choisie : si $\frac{m}{n} = \frac{M}{N}$, alors $mN = Mn$, et comme $p$ ne divise ni $n$ ni $N$, les exposants de $p$ dans $m$ et dans $M$ coïncident (chapitre 12 de MPSI). On le note $v(x)$. On a alors $x = p^{v(x)}u$, où $u = \frac{m'}{n}$ est inversible dans $\mathbb{Z}_{p}$, d'inverse $\frac{n}{m'}$ (au signe près du dénominateur), et 
    $$x \in J_{p^{k}} \iff v(x) \geqslant k, \qquad\text{d'où}\qquad J_{p^{k}} = p^{k}\mathbb{Z}_{p}.$$
     Soit $I$ un idéal non nul, et $k$ la plus petite valeur de $v(x)$ pour $x \in I \setminus \{0\}$, atteinte en $x_{0} = p^{k}u_{0}$. Alors $p^{k} = x_{0}u_{0}^{-1} \in I$, donc $J_{p^{k}} = p^{k}\mathbb{Z}_{p} \subset I$. Réciproquement, tout $x \in I$ non nul vérifie $v(x) \geqslant k$, donc $x \in J_{p^{k}}$. 
    $$\boxed{\text{Les idéaux non nuls de } \mathbb{Z}_{p} \text{ sont les } J_{p^{k}} = p^{k}\mathbb{Z}_{p}, \ k \in \mathbb{N}.}$$
     Ils forment une chaîne $\mathbb{Z}_{p} = J_{1} \supset J_{p} \supset J_{p^{2}} \supset \cdots$, et $J_{p}$, formé des non-inversibles, est le seul idéal maximal. Comme $\mathbb{Z}$ et $\mathbb{K}[X]$, l'anneau $\mathbb{Z}_{p}$ n'a que des idéaux principaux.
