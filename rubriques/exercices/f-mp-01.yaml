  source: "Algèbre générale (LLG), exercice 3"
  page_enonce: 12
  page_corrige: 37
  enonce: |
    *Lemme de Zolotarev.* Soit $p$ un nombre premier impair et $a \in \mathbb{Z}/p\mathbb{Z} \setminus \{\overline{0}\}$. On note $m_{a}$ l'application $x \mapsto ax$ de $\mathbb{Z}/p\mathbb{Z}$ dans lui-même. Montrer que $m_{a}$ est une permutation de $\mathbb{Z}/p\mathbb{Z}$, et qu'elle est de signature $1$ si et seulement si $a$ est un carré dans l'anneau $\mathbb{Z}/p\mathbb{Z}$. On pourra utiliser l'exercice 48.

    Les quatre derniers exercices sont des problèmes à traiter en autonomie : l'énoncé fixe le but, et c'est à vous de trouver le chemin.
  corrige: |
    L'application $m_{a}$ est bijective, de réciproque $m_{a^{-1}}$, puisque $a$ est inversible dans le corps $\mathbb{Z}/p\mathbb{Z}$. Elle fixe $\overline{0}$, et $m_{ab} = m_{a} \circ m_{b}$ : l'application $a \mapsto \varepsilon(m_{a})$ est un morphisme du groupe $(\mathbb{Z}/p\mathbb{Z})^{\times}$ dans $\{-1, 1\}$.

    Par l'exercice 70, le groupe $(\mathbb{Z}/p\mathbb{Z})^{\times}$ est cyclique ; soit $g$ un générateur, d'ordre $p - 1$. La permutation $m_{g}$ fixe $\overline{0}$ et envoie $g^{k}$ sur $g^{k+1}$ : c'est le cycle $(g\ \ g^{2}\ \cdots\ g^{p-1})$ de longueur $p - 1$, dont la signature est $(-1)^{p-2} = -1$, puisque $p$ est impair (chapitre 17 de MPSI). Ainsi $\varepsilon(m_{g^{k}}) = (-1)^{k}$.

    Il reste à voir que $g^{k}$ est un carré si et seulement si $k$ est pair. Si $k$ est pair, $g^{k} = (g^{k/2})^{2}$. Les puissances paires $g^{0}, g^{2}, \dots, g^{p-3}$ sont deux à deux distinctes et au nombre de $\frac{p-1}{2}$, qui est exactement le nombre de carrés non nuls (exercice 48) : les carrés non nuls sont donc exactement les puissances paires de $g$. 
    $$\boxed{m_{a} \text{ est une permutation de } \mathbb{Z}/p\mathbb{Z}, \text{ et } \varepsilon(m_{a}) = 1 \iff a \text{ est un carré}}$$
     Par le critère d'Euler (exercice 48), on peut écrire le résultat $\varepsilon(m_{a}) = a^{\frac{p-1}{2}}$, l'égalité ayant lieu dans $\{-\overline{1}, \overline{1}\}$. Pour $p = 7$ et $a = \overline{3}$, qui n'est pas un carré, $m_{3}$ est le cycle $(1\ 3\ 2\ 6\ 4\ 5)$, de longueur $6$ et de signature $-1$ ✓.

    Les quatre derniers exercices sont des problèmes en autonomie ; on en donne une solution complète, rédigée comme on l'attend d'une copie.
- id: "mp-01-76"
