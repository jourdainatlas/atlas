  source: "bibmath, Anneaux, exercice 2"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Soit $A$ un anneau. On appelle *centre* de $A$ l'ensemble $C(A) = \{a \in A \mid \forall x \in A, \ ax = xa\}$. Montrer que $C(A)$ est un sous-anneau de $A$.
  corrige: |
    On utilise la caractérisation des sous-anneaux (chapitre 11 de MPSI) : contenir $1$, être stable par différence et par produit. Le centre contient $1$, puisque $1x = x = x1$. Pour $a$, $b \in C(A)$ et $x \in A$, la distributivité et l'associativité donnent 
    $$(a - b)x = ax - bx = xa - xb = x(a - b), \qquad (ab)x = a(xb) = (ax)b = x(ab).$$

    $$\boxed{C(A) \text{ est un sous-anneau de } A}$$
     Le centre est commutatif, et il vaut $A$ exactement quand $A$ est commutatif. Pour $A = \mathcal{M}_{n}(\mathbb{K})$, c'est l'ensemble des matrices scalaires $\lambda I_{n}$ (chapitre 16 de MPSI).
- id: "mp-01-12"
  feuille: "f-mp-01"
  numero: 12
  partie: "Compléments sur les anneaux"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [anneaux]
  noeuds: [a-anneau, a-ideal]
  notions: [ideal]
  source: "TD 2 Algèbre générale (Sainte-Geneviève), exercice 1"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Soit $A$ un anneau tel que $(xy)^{2} = x^{2}y^{2}$ pour tous $x$, $y \in A$.

    **1.** Montrer que $x^{2}y = xyx = yx^{2}$ pour tous $x$, $y \in A$. On pourra appliquer l'hypothèse à $1 + x$ ou à $1 + y$.

    **2.** Montrer que $A$ est commutatif.
  corrige: |
    **1.** Appliquons l'hypothèse au couple $(x, 1 + y)$ : $\big(x(1 + y)\big)^{2} = x^{2}(1 + y)^{2}$. En développant sans jamais permuter de facteurs, puisque $A$ n'est pas supposé commutatif, 
    $$(x + xy)^{2} = x^{2} + x^{2}y + xyx + (xy)^{2}, \qquad x^{2}(1 + 2y + y^{2}) = x^{2} + 2x^{2}y + x^{2}y^{2}.$$
     Comme $(xy)^{2} = x^{2}y^{2}$, il reste $x^{2}y + xyx = 2x^{2}y$, soit $xyx = x^{2}y$. Appliquons de même l'hypothèse au couple $(1 + x, y)$ : 
    $$(y + xy)^{2} = y^{2} + yxy + xy^{2} + (xy)^{2}, \qquad (1 + 2x + x^{2})y^{2} = y^{2} + 2xy^{2} + x^{2}y^{2},$$
     d'où $yxy = xy^{2}$ pour tous $x$, $y$ ; en échangeant les rôles de $x$ et de $y$, $xyx = yx^{2}$. 
    $$\boxed{x^{2}y = xyx = yx^{2} \text{ pour tous } x, y \in A}$$

    **2.** Appliquons l'égalité $x^{2}y = xyx$ de la question 1 à $1 + x$ au lieu de $x$ : $(1 + x)^{2}y = (1 + x)y(1 + x)$. En développant, 
    $$y + 2xy + x^{2}y = y + yx + xy + xyx,$$
     et comme $x^{2}y = xyx$, il reste $2xy = yx + xy$, c'est-à-dire $xy = yx$. 
    $$\boxed{A \text{ est commutatif}}$$
     *Piège.* L'erreur la plus répandue est d'écrire $(xy)^{2} = x^{2}y^{2}$ « par les règles de calcul » dès le départ : dans un anneau non commutatif, $(xy)^{2} = xyxy$, et c'est précisément ce que l'hypothèse impose d'égaler à $xxyy$. Le développement $(1 + x)^{2} = 1 + 2x + x^{2}$ reste, lui, toujours valable, car $1$ et $x$ commutent.
- id: "mp-01-13"
  feuille: "f-mp-01"
  numero: 13
  partie: "Compléments sur les anneaux"
