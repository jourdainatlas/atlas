  enonce: |
    Soit $n \in \mathbb{N}^{*}$. Montrer que $x^{2} = \overline{1}$ pour tout $x \in (\mathbb{Z}/n\mathbb{Z})^{\times}$ si et seulement si $n$ divise $24$. On pourra utiliser le théorème chinois, et traiter d'abord le cas où $n$ est premier.
  corrige: |
    Écrivons $n = \prod p^{\alpha_{p}}$. Par le théorème 5 et la proposition 6, l'isomorphisme chinois se restreint en un isomorphisme de groupes 
    $$(\mathbb{Z}/n\mathbb{Z})^{\times} \simeq \prod_{p \mid n} (\mathbb{Z}/p^{\alpha_{p}}\mathbb{Z})^{\times},$$
     et la propriété « tout élément est de carré $\overline{1}$ », qui se vérifie composante par composante, est vraie pour $\mathbb{Z}/n\mathbb{Z}$ si et seulement si elle l'est pour chaque $\mathbb{Z}/p^{\alpha_{p}}\mathbb{Z}$.

    **Le cas d'un nombre premier,** suggéré par l'énoncé, montre le mécanisme : dans le corps $\mathbb{Z}/p\mathbb{Z}$, l'équation $x^{2} = \overline{1}$ a au plus deux solutions (exercice 17), donc la propriété impose $p - 1 \leqslant 2$, soit $p \in \{2, 3\}$.

    **Puissances d'un premier impair.** Si $p$ est impair, $\overline{2}$ est inversible modulo $p^{\alpha}$, et la propriété impose $4 \equiv 1 \;[p^{\alpha}]$, soit $p^{\alpha} \mid 3$ : $p^{\alpha} = 3$.

    **Puissances de $2$.** Modulo $2^{\alpha}$ avec $\alpha \geqslant 2$, l'élément $\overline{3}$ est inversible, et la propriété impose $2^{\alpha} \mid 9 - 1 = 8$ : $\alpha \leqslant 3$.

    **Réciproque.** Les inversibles de $\mathbb{Z}/8\mathbb{Z}$ sont $\overline{1}, \overline{3}, \overline{5}, \overline{7}$, de carrés $1, 9, 25, 49 \equiv 1$ ; ceux de $\mathbb{Z}/4\mathbb{Z}$, $\mathbb{Z}/2\mathbb{Z}$ et $\mathbb{Z}/3\mathbb{Z}$ sont $\pm\overline{1}$. La propriété est donc vraie pour $2^{\alpha}$ avec $\alpha \leqslant 3$ et pour $3$.

    En rassemblant, la propriété vaut pour $n$ si et seulement si $n = 2^{\alpha}3^{\beta}$ avec $\alpha \leqslant 3$ et $\beta \leqslant 1$, c'est-à-dire $n \mid 24$. 
    $$\boxed{\forall x \in (\mathbb{Z}/n\mathbb{Z})^{\times}, \ x^{2} = \overline{1} \iff n \mid 24}$$
     Le cas $n = 1$ est compris : $\mathbb{Z}/1\mathbb{Z}$ est l'anneau nul, où $\overline{0} = \overline{1}$. Un test exhaustif pour $n < 200$ ne retient que $1, 2, 3, 4, 6, 8, 12, 24$ ✓. Concrètement, le carré de tout entier premier avec $24$ est congru à $1$ modulo $24$ : $5^{2} = 25$, $7^{2} = 49 = 2 \times 24 + 1$, et ainsi de suite.
- id: "mp-01-48"
  feuille: "f-mp-01"
  numero: 48
  partie: "Les anneaux $\\mathbb{Z}/n\\mathbb{Z}$"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [anneaux Z/nZ, congruences et Z/nZ, nombres premiers]
  noeuds: [z-zn, z-premiers]
  notions: [anneau-zn]
  source: "Algèbre générale (LLG), exercice 1, questions 1 à 4"
  page_enonce: 8
  page_corrige: 22
  enonce: |
    Soit $p$ un nombre premier impair.

    **1.** Dénombrer les carrés de $\mathbb{Z}/p\mathbb{Z}$.

    **2.** Démontrer qu'un élément $t$ de $\mathbb{Z}/p\mathbb{Z} \setminus \{\overline{0}\}$ est un carré si et seulement si $t^{\frac{p-1}{2}} = \overline{1}$. On pourra utiliser l'exercice 17.

    **3.** En déduire que $-\overline{1}$ est un carré dans $\mathbb{Z}/p\mathbb{Z}$ si et seulement si $p \equiv 1 \;[4]$.

    **4.** On suppose $p \equiv -1 \;[4]$. Soit $x \in \mathbb{Z}/p\mathbb{Z} \setminus \{\overline{0}\}$. Montrer que $x$ est un carré si et seulement si $-x$ n'est pas un carré.
  corrige: |
    **1.** Considérons l'application $x \mapsto x^{2}$ de $\mathbb{Z}/p\mathbb{Z} \setminus \{\overline{0}\}$ dans lui-même. On a $x^{2} = y^{2}$ si et seulement si $(x - y)(x + y) = \overline{0}$, c'est-à-dire $y = \pm x$, puisque $\mathbb{Z}/p\mathbb{Z}$ est un corps. Comme $p$ est impair, $x \neq -x$ : chaque carré non nul a exactement deux antécédents, et il y a $\frac{p-1}{2}$ carrés non nuls (lemme des bergers). Il faut ajouter $\overline{0} = \overline{0}^{2}$. 
    $$\boxed{\mathbb{Z}/p\mathbb{Z} \text{ compte } \frac{p + 1}{2} \text{ carrés, dont } \frac{p - 1}{2} \text{ non nuls}}$$

    **2.** Notons $q = \frac{p-1}{2}$. Si $t = x^{2}$ avec $x \neq \overline{0}$, alors $t^{q} = x^{p-1} = \overline{1}$ par le petit théorème de Fermat, cas $n = p$ du théorème 6. Ainsi les $q$ carrés non nuls sont racines de l'équation $t^{q} = \overline{1}$, qui en a au plus $q$ dans le corps $\mathbb{Z}/p\mathbb{Z}$ (exercice 17) : ses solutions sont exactement les carrés non nuls. 
    $$\boxed{t \neq \overline{0} \text{ est un carré} \iff t^{\frac{p-1}{2}} = \overline{1}}$$
     C'est le *critère d'Euler*. Pour un non-carré $t \neq \overline{0}$, on a $\big(t^{q}\big)^{2} = \overline{1}$ et $t^{q} \neq \overline{1}$, donc $t^{q} = -\overline{1}$.

    **3.** Par la question 2, $-\overline{1}$ est un carré si et seulement si $(-\overline{1})^{q} = \overline{1}$, c'est-à-dire, puisque $-\overline{1} \neq \overline{1}$, si et seulement si $q = \frac{p-1}{2}$ est pair. 
    $$\boxed{-\overline{1} \text{ est un carré de } \mathbb{Z}/p\mathbb{Z} \iff p \equiv 1 \;[4]}$$
     Ainsi $-1 \equiv 2^{2} \;[5]$ et $-1 \equiv 5^{2} \;[13]$, mais $-1$ n'est pas un carré modulo $3$, $7$ ou $11$.

    **4.** Si $p \equiv -1 \;[4]$, alors $q$ est impair et $(-x)^{q} = -x^{q}$. Comme $x^{q} \in \{\overline{1}, -\overline{1}\}$, la remarque de la question 2 donne 
    $$x \text{ carré} \iff x^{q} = \overline{1} \iff (-x)^{q} = -\overline{1} \iff -x \text{ n'est pas un carré.}$$

    $$\boxed{x \text{ est un carré} \iff -x \text{ n'en est pas un}}$$
     Pour $p = 7$, les carrés non nuls sont $\overline{1}, \overline{2}, \overline{4}$, et leurs opposés $\overline{6}, \overline{5}, \overline{3}$ sont exactement les non-carrés ✓. Ce critère sert de nouveau dans le lemme de Zolotarev (exercice 75).
