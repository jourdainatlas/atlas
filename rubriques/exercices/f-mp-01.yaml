  source: "TD 2 Algèbre générale (Sainte-Geneviève), exercice 19"
  page_enonce: 7
  page_corrige: 18
  enonce: |
    Soit $n_{1}$, $n_{2} \geqslant 2$. Montrer que les anneaux $\mathbb{Z}/n_{1}n_{2}\mathbb{Z}$ et $\mathbb{Z}/n_{1}\mathbb{Z} \times \mathbb{Z}/n_{2}\mathbb{Z}$ sont isomorphes si et seulement si $n_{1}$ et $n_{2}$ sont premiers entre eux.
  corrige: |
    Si $n_{1} \wedge n_{2} = 1$, c'est le théorème 5. Réciproquement, supposons $\delta = n_{1} \wedge n_{2} > 1$, et notons $m = n_{1} \vee n_{2} = \frac{n_{1}n_{2}}{\delta} < n_{1}n_{2}$. Tout élément $(a, b)$ de $\mathbb{Z}/n_{1}\mathbb{Z} \times \mathbb{Z}/n_{2}\mathbb{Z}$ vérifie $m(a, b) = (0, 0)$, puisque $n_{1}$ et $n_{2}$ divisent $m$ ; son ordre additif est donc au plus $m$. Dans $\mathbb{Z}/n_{1}n_{2}\mathbb{Z}$, l'élément $\overline{1}$ est d'ordre $n_{1}n_{2}$. Un isomorphisme d'anneaux étant en particulier un isomorphisme de groupes additifs, qui conserve les ordres, il n'en existe pas. 
    $$\boxed{\mathbb{Z}/n_{1}n_{2}\mathbb{Z} \simeq \mathbb{Z}/n_{1}\mathbb{Z} \times \mathbb{Z}/n_{2}\mathbb{Z} \iff n_{1} \wedge n_{2} = 1}$$
     Le résultat est même plus fort que demandé : les *groupes* additifs ne sont pas isomorphes, ce qu'illustre l'exercice 35 avec $n_{1} = 2$ et $n_{2} = 4$.
- id: "mp-01-41"
  feuille: "f-mp-01"
  numero: 41
  partie: "Les anneaux $\\mathbb{Z}/n\\mathbb{Z}$"
  etoiles: 2
  types: [Calcul]
  mots_cles: [anneaux Z/nZ, nombres premiers]
  noeuds: [z-zn, z-premiers]
  notions: [anneau-zn]
  source: "bibmath, Anneaux, exercice 18"
  page_enonce: 7
  page_corrige: 19
  enonce: |
    Soit $n \geqslant 2$. On cherche le nombre de solutions de l'équation $x^{2} = \overline{1}$ dans $\mathbb{Z}/n\mathbb{Z}$.

    **1.** Traiter le cas où $n = p^{\alpha}$, avec $p$ un nombre premier impair et $\alpha \geqslant 1$.

    **2.** Traiter les cas $n = 2$ et $n = 4$.

    **3.** Traiter le cas où $n = 2^{\alpha}$, avec $\alpha \geqslant 3$.

    **4.** Traiter le cas général.
  corrige: |
    Pour $x = \overline{k}$, l'équation s'écrit $n \mid (k - 1)(k + 1)$.

    **1.** Soit $n = p^{\alpha}$ avec $p$ premier impair. Le nombre $p$ ne peut diviser à la fois $k - 1$ et $k + 1$, dont la différence $2$ n'est pas multiple de $p$. Si $p \nmid k + 1$, alors $p^{\alpha} \wedge (k + 1) = 1$, et le lemme de Gauss donne $p^{\alpha} \mid k - 1$ ; de même dans l'autre cas. Ainsi $x = \pm\overline{1}$, et $\overline{1} \neq -\overline{1}$ car $p^{\alpha} > 2$. 
    $$\boxed{2 \text{ solutions}}$$

    **2.** Dans $\mathbb{Z}/2\mathbb{Z}$, seul $\overline{1}$ convient ; dans $\mathbb{Z}/4\mathbb{Z}$, $\overline{1}$ et $\overline{3}$. 
    $$\boxed{1 \text{ solution pour } n = 2, \qquad 2 \text{ solutions pour } n = 4}$$

    **3.** Soit $n = 2^{\alpha}$ avec $\alpha \geqslant 3$. Une solution est impaire, et $k - 1$, $k + 1$ sont alors deux entiers pairs consécutifs parmi les pairs : l'un d'eux n'est pas multiple de $4$, et contient exactement une fois le facteur $2$. L'autre doit donc être multiple de $2^{\alpha - 1}$, soit $k \equiv \pm 1 \;[2^{\alpha-1}]$. Dans $\llbracket 0\,,2^{\alpha} - 1 \rrbracket$, cela laisse 
    $$k \in \big\{1, \ 2^{\alpha-1} - 1, \ 2^{\alpha-1} + 1, \ 2^{\alpha} - 1\big\},$$
     quatre valeurs distinctes puisque $2^{\alpha-1} \geqslant 4$. Elles conviennent toutes : $(2^{\alpha-1} \pm 1)^{2} = 2^{2\alpha-2} \pm 2^{\alpha} + 1 \equiv 1$, car $2\alpha - 2 \geqslant \alpha$. 
    $$\boxed{4 \text{ solutions}}$$

    **4.** Écrivons $n = 2^{\alpha}p_{1}^{\alpha_{1}} \cdots p_{r}^{\alpha_{r}}$, avec $\alpha \geqslant 0$ et $p_{1}, \dots, p_{r}$ premiers impairs distincts. L'isomorphisme d'anneaux du théorème 5 transforme l'équation $x^{2} = \overline{1}$ dans $\mathbb{Z}/n\mathbb{Z}$ en le même système d'équations, composante par composante, dans le produit : le nombre de solutions est le produit des nombres de solutions dans chaque facteur. En notant $c(\alpha) = 1$ si $\alpha \leqslant 1$, $c(2) = 2$, et $c(\alpha) = 4$ si $\alpha \geqslant 3$, 
    $$\boxed{\operatorname{card}\{x \in \mathbb{Z}/n\mathbb{Z} \mid x^{2} = \overline{1}\} = c(\alpha) \times 2^{r}}$$
     On retrouve les $4$ solutions de l'exercice 34 pour $n = 12 = 2^{2} \times 3$, et celles de l'exercice 36 pour $n = 666 = 2 \times 3^{2} \times 37$. Le contrôle exhaustif donne aussi $8$ solutions pour $24$ et $16$ pour $360 = 2^{3} \times 3^{2} \times 5$ ✓.
- id: "mp-01-42"
  feuille: "f-mp-01"
  numero: 42
  partie: "Les anneaux $\\mathbb{Z}/n\\mathbb{Z}$"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [anneaux Z/nZ, groupes cycliques, congruences et Z/nZ]
  noeuds: [z-zn, gf-cycliques]
  notions: [anneau-zn, groupe-cyclique]
  source: "bibmath, Anneaux, exercice 19"
  page_enonce: 7
  page_corrige: 19
  enonce: |
    Soit $n \geqslant 3$.

    **1.** Montrer que, pour tout entier impair $a$, on a $a^{2^{n-2}} \equiv 1 \;[2^{n}]$.

    **2.** Le groupe $(\mathbb{Z}/2^{n}\mathbb{Z})^{\times}$ est-il cyclique ?
  corrige: |
    **1.** Par récurrence sur $n \geqslant 3$. Pour $n = 3$, un entier impair s'écrit $a = 2k + 1$, et 
    $$a^{2} = 4k(k + 1) + 1 \equiv 1 \;[8],$$
     puisque $k(k + 1)$ est pair. Si $a^{2^{n-2}} = 1 + 2^{n}t$ avec $t \in \mathbb{Z}$, alors 
    $$a^{2^{n-1}} = \big(1 + 2^{n}t\big)^{2} = 1 + 2^{n+1}t + 2^{2n}t^{2} \equiv 1 \;[2^{n+1}].$$

    $$\boxed{a^{2^{n-2}} \equiv 1 \;[2^{n}] \text{ pour tout } a \text{ impair}}$$

    **2.** Les inversibles de $\mathbb{Z}/2^{n}\mathbb{Z}$ sont les classes impaires, au nombre de $\varphi(2^{n}) = 2^{n-1}$ (proposition 12). Par la question 1, chacun a un ordre qui divise $2^{n-2}$ (proposition 4 (i)), donc aucun n'est d'ordre $2^{n-1}$. 
    $$\boxed{(\mathbb{Z}/2^{n}\mathbb{Z})^{\times} \text{ n'est pas cyclique pour } n \geqslant 3}$$
     Pour $n = 3$, c'est le groupe $\{\overline{1}, \overline{3}, \overline{5}, \overline{7}\}$, dont tous les éléments sont de carré $\overline{1}$ : il est isomorphe à $(\mathbb{Z}/2\mathbb{Z})^{2}$ par l'exercice 4. En revanche, $(\mathbb{Z}/2\mathbb{Z})^{\times}$ et $(\mathbb{Z}/4\mathbb{Z})^{\times}$ sont cycliques, ainsi que $(\mathbb{Z}/p\mathbb{Z})^{\times}$ pour $p$ premier (exercice 70).
- id: "mp-01-43"
  feuille: "f-mp-01"
  numero: 43
  partie: "Les anneaux $\\mathbb{Z}/n\\mathbb{Z}$"
  etoiles: 2
  types: [Calcul]
  mots_cles: [anneaux Z/nZ, sous-groupe engendré, groupes cycliques]
  noeuds: [z-zn, a-sous-groupe, gf-cycliques]
  notions: [anneau-zn, sous-groupe-engendre, groupe-cyclique]
  source: "bibmath, Anneaux, exercice 20"
  page_enonce: 7
  page_corrige: 20
  enonce: |
    On note $G = (\mathbb{Z}/20\mathbb{Z})^{\times}$.

    **1.** Donner la liste des éléments de $G$.

    **2.** Pour chaque $a \in G$, déterminer le sous-groupe $\langle a \rangle$ engendré par $a$.

    **3.** Déterminer une partie génératrice de $G$ ayant le moins d'éléments possible.

    **4.** Le groupe $G$ est-il cyclique ?

    **5.** Déterminer tous les sous-groupes de $G$, et une partie génératrice de chacun d'eux.

    **6.** Lesquels de ces sous-groupes sont isomorphes à un groupe additif $(\mathbb{Z}/m\mathbb{Z}, +)$ ?
  corrige: |
    **1.** Les inversibles sont les classes des entiers premiers avec $20$ (théorème 4), au nombre de $\varphi(20) = 8$. 
    $$\boxed{G = \{\overline{1}, \overline{3}, \overline{7}, \overline{9}, \overline{11}, \overline{13}, \overline{17}, \overline{19}\}}$$

    **2.** On calcule les puissances successives de chaque élément jusqu'à retrouver $\overline{1}$ (proposition 4 (ii)) : 
    $$\langle \overline{3} \rangle = \langle \overline{7} \rangle = \{\overline{1}, \overline{3}, \overline{9}, \overline{7}\}, \qquad \langle \overline{13} \rangle = \langle \overline{17} \rangle = \{\overline{1}, \overline{13}, \overline{9}, \overline{17}\},$$

    $$\langle \overline{9} \rangle = \{\overline{1}, \overline{9}\}, \qquad \langle \overline{11} \rangle = \{\overline{1}, \overline{11}\}, \qquad \langle \overline{19} \rangle = \{\overline{1}, \overline{19}\}, \qquad \langle \overline{1} \rangle = \{\overline{1}\}.$$
     Ainsi $\overline{3}$, $\overline{7}$, $\overline{13}$, $\overline{17}$ sont d'ordre $4$, et $\overline{9}$, $\overline{11}$, $\overline{19}$ d'ordre $2$.

    **3 et 4.** Aucun élément n'est d'ordre $8$ : le groupe n'est pas monogène, il faut au moins deux générateurs. Le sous-groupe $\langle \overline{3}, \overline{11} \rangle$ contient strictement $\langle \overline{3} \rangle$, car $\overline{11} \notin \langle \overline{3} \rangle$, et son cardinal divise $8$ (proposition 5) : c'est $G$. 
    $$\boxed{\{\overline{3}, \overline{11}\} \text{ engendre } G, \text{ et } G \text{ n'est pas cyclique}}$$

    **5.** Par le théorème de Lagrange, un sous-groupe a $1$, $2$, $4$ ou $8$ éléments. Ceux d'ordre $2$ sont engendrés par un élément d'ordre $2$ : il y en a trois. Un sous-groupe d'ordre $4$ contenant un élément d'ordre $4$ est engendré par lui : on obtient les deux sous-groupes cycliques de la question 2. Sinon, ses trois éléments non neutres sont d'ordre $2$ : c'est $\{\overline{1}, \overline{9}, \overline{11}, \overline{19}\}$, qui est bien un sous-groupe, puisque $\overline{9} \times \overline{11} = \overline{19}$, $\overline{9} \times \overline{19} = \overline{11}$ et $\overline{11} \times \overline{19} = \overline{9}$.

    $$\begin{array}{|c|l|l|} \hline \text{Cardinal} & \text{Sous-groupes} & \text{Parties génératrices} \\ \hline 1 & \{\overline{1}\} & \varnothing \\ \hline 2 & \{\overline{1}, \overline{9}\}\text{, \ }\{\overline{1}, \overline{11}\}\text{, \ }\{\overline{1}, \overline{19}\} & \{\overline{9}\}\text{, \ }\{\overline{11}\}\text{, \ }\{\overline{19}\} \\ \hline 4 & \{\overline{1}, \overline{3}, \overline{7}, \overline{9}\}\text{, \ }\{\overline{1}, \overline{9}, \overline{13}, \overline{17}\} & \{\overline{3}\}\text{, \ }\{\overline{13}\} \\ \hline 4 & \{\overline{1}, \overline{9}, \overline{11}, \overline{19}\} & \{\overline{9}, \overline{11}\} \\ \hline 8 & G & \{\overline{3}, \overline{11}\} \\ \hline \end{array}$$

    Le groupe $G$ a donc huit sous-groupes.

    **6.** Un groupe isomorphe à $\mathbb{Z}/m\mathbb{Z}$ est cyclique (théorème 1). Les sous-groupes cycliques sont $\{\overline{1}\} \simeq \mathbb{Z}/1\mathbb{Z}$, les trois sous-groupes d'ordre $2$, isomorphes à $\mathbb{Z}/2\mathbb{Z}$, et les deux sous-groupes $\langle \overline{3} \rangle$ et $\langle \overline{13} \rangle$, isomorphes à $\mathbb{Z}/4\mathbb{Z}$. Le sous-groupe $\{\overline{1}, \overline{9}, \overline{11}, \overline{19}\}$ est isomorphe à $(\mathbb{Z}/2\mathbb{Z})^{2}$ (exercice 4), et $G$ à $\mathbb{Z}/2\mathbb{Z} \times \mathbb{Z}/4\mathbb{Z}$ ; aucun des deux n'est cyclique. 
    $$\boxed{\text{Six sous-groupes sur huit sont isomorphes à un } \mathbb{Z}/m\mathbb{Z}}$$
     Par le théorème 5, $G \simeq (\mathbb{Z}/4\mathbb{Z})^{\times} \times (\mathbb{Z}/5\mathbb{Z})^{\times} \simeq \mathbb{Z}/2\mathbb{Z} \times \mathbb{Z}/4\mathbb{Z}$, ce qui explique la structure trouvée.
- id: "mp-01-44"
  feuille: "f-mp-01"
  numero: 44
  partie: "Les anneaux $\\mathbb{Z}/n\\mathbb{Z}$"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [anneaux Z/nZ, "ordre d'un élément"]
  noeuds: [z-zn, gf-cycliques]
  notions: [anneau-zn, ordre-element]
  source: "bibmath, Anneaux, exercice 21"
  page_enonce: 7
  page_corrige: 21
  enonce: |
    On veut montrer qu'il n'existe pas d'entier $n \geqslant 2$ tel que $n$ divise $2^{n} - 1$. On suppose qu'un tel entier existe, et l'on note $p$ son plus petit diviseur premier.

    **1.** Montrer que $p > 2$.

    **2.** Soit $m$ l'ordre de $\overline{2}$ dans le groupe $(\mathbb{Z}/p\mathbb{Z})^{\times}$.

    **(a)** Montrer que $m$ divise $p - 1$.

    **(b)** Montrer que $m$ divise $n$.

    **(c)** Conclure.
  corrige: |
    **1.** L'entier $2^{n} - 1$ est impair, donc $n$, qui le divise, l'est aussi, et $p \neq 2$. 
    $$\boxed{p > 2}$$

    **2.(a)** Comme $p$ est impair, $\overline{2}$ est inversible dans $\mathbb{Z}/p\mathbb{Z}$. L'ordre $m$ de $\overline{2}$ divise le cardinal $p - 1$ du groupe $(\mathbb{Z}/p\mathbb{Z})^{\times}$ (théorème 2). 
    $$\boxed{m \mid p - 1}$$
     **(b)** Comme $p \mid n$ et $n \mid 2^{n} - 1$, on a $\overline{2}^{n} = \overline{1}$ dans $\mathbb{Z}/p\mathbb{Z}$, et la proposition 4 (i) donne $m \mid n$. 
    $$\boxed{m \mid n}$$
     **(c)** Tout diviseur premier de $p - 1$ est strictement inférieur à $p$, donc ne divise pas $n$, par minimalité de $p$ : ainsi $(p - 1) \wedge n = 1$, et $m$, qui divise les deux, vaut $1$. Alors $\overline{2} = \overline{1}$ dans $\mathbb{Z}/p\mathbb{Z}$, soit $p \mid 1$, ce qui est absurde. 
    $$\boxed{\text{Aucun entier } n \geqslant 2 \text{ ne divise } 2^{n} - 1}$$
     *À retenir.* Le choix du *plus petit* diviseur premier de $n$ rend $n$ premier avec $p - 1$ ; c'est l'idée de l'exercice. L'énoncé exclut $n = 1$, qui divise évidemment $2^{1} - 1$.
