  enonce: |
    Soit $p$ un nombre premier. Montrer qu'il existe un entier naturel $n$ tel que $2^{n} \equiv n \;[p]$.
  corrige: |
    Posons $n = (p - 1)^{2} + 1$, qui est un entier naturel. Modulo $p$, on a $n \equiv 1 + 1 = 2$. Modulo $p - 1$, on a $n \equiv 1$, soit $n = 1 + k(p - 1)$ avec $k \in \mathbb{N}$. Si $p$ est impair, $2$ est premier avec $p$, et le petit théorème de Fermat (théorème 6) donne 
    $$2^{n} = 2 \times \big(2^{p-1}\big)^{k} \equiv 2 \equiv n \;[p].$$
     Si $p = 2$, alors $n = 2$ et $2^{2} = 4 \equiv 0 \equiv 2 \;[2]$. 
    $$\boxed{n = (p - 1)^{2} + 1 \text{ vérifie } 2^{n} \equiv n \;[p]}$$
     L'idée est de découpler les deux occurrences de $n$ : l'exposant n'importe que modulo $p - 1$, la base que modulo $p$, et $p - 1$ et $p$ sont premiers entre eux ; le théorème chinois assure l'existence, et l'on a ici trouvé une solution explicite. Pour $p = 5$, $n = 17$ et $2^{17} = 131\,072 \equiv 2 \equiv 17 \;[5]$ ✓.
