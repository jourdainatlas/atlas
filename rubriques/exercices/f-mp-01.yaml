  source: "Algèbre générale (LLG), exercice 19"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Les sous-groupes stricts de $(\mathbb{Q}, +)$ sont-ils monogènes ?
  corrige: |
    Non. Considérons l'ensemble $D = \Big\{\dfrac{k}{2^{m}} \;\Big|\; k \in \mathbb{Z}, \ m \in \mathbb{N}\Big\}$ des nombres dyadiques. Il contient $0$, et la différence de deux de ses éléments, réduite au dénominateur commun $2^{\max(m, m')}$, lui appartient : c'est un sous-groupe de $(\mathbb{Q}, +)$. Il est strict, car $\frac{1}{3} \notin D$ : l'égalité $\frac{1}{3} = \frac{k}{2^{m}}$ donnerait $2^{m} = 3k$, et $3$ diviserait une puissance de $2$.

    Supposons $D = \langle a \rangle = a\mathbb{Z}$ (proposition 1 (ii)). Alors $a \neq 0$, puisque $D \neq \{0\}$, et $a = \frac{k}{2^{m}}$ ; le nombre $\frac{a}{2} = \frac{k}{2^{m+1}}$ appartient à $D$, donc s'écrit $ja$ avec $j \in \mathbb{Z}$, ce qui impose $j = \frac{1}{2}$, absurde. 
    $$\boxed{\text{Le sous-groupe strict } D \text{ des nombres dyadiques n'est pas monogène.}}$$
     Certains sous-groupes stricts sont monogènes, comme $\mathbb{Z}$ ou $\frac{1}{7}\mathbb{Z}$ ; la réponse à la question posée, qui porte sur tous les sous-groupes stricts, est donc négative. Le même argument, appliqué à $\frac{a}{2}$, montre que $\mathbb{Q}$ lui-même n'est pas monogène.
- id: "mp-01-03"
  feuille: "f-mp-01"
  numero: 3
