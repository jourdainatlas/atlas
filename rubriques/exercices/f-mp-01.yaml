  notions: [anneau-zn]
  source: "bibmath, Anneaux, exercice 13"
  page_enonce: 6
  page_corrige: 16
  enonce: |
    Résoudre les équations suivantes, d'inconnue $x$ : 
    $$\overline{7}x = \overline{2} \ \text{ dans } \mathbb{Z}/37\mathbb{Z}, \qquad \overline{10}x = \overline{6} \ \text{ dans } \mathbb{Z}/34\mathbb{Z}, \qquad \overline{10}x = \overline{5} \ \text{ dans } \mathbb{Z}/34\mathbb{Z}.$$
  corrige: |
    **Première équation.** Comme $7 \times 16 = 112 = 3 \times 37 + 1$, la classe $\overline{7}$ est inversible d'inverse $\overline{16}$, et l'équation équivaut à $x = \overline{16} \times \overline{2} = \overline{32}$. 
    $$\boxed{x = \overline{32}}$$

    **Deuxième équation.** Ici $10 \wedge 34 = 2$ et $\overline{10}$ n'est pas inversible. Pour $x = \overline{k}$, l'équation s'écrit $34 \mid 10k - 6$, soit, en divisant par $2$, $17 \mid 5k - 3$. Dans $\mathbb{Z}/17\mathbb{Z}$, on a $\overline{5}^{-1} = \overline{7}$ (car $35 = 2 \times 17 + 1$), d'où $k \equiv 21 \equiv 4 \;[17]$. Modulo $34$, cela donne deux classes. 
    $$\boxed{x \in \{\overline{4}, \overline{21}\}}$$

    **Troisième équation.** L'entier $10k - 5$ est impair, et ne peut pas être multiple de $34$. 
    $$\boxed{\text{Pas de solution}}$$
     *À retenir.* L'équation $\overline{a}x = \overline{b}$ dans $\mathbb{Z}/n\mathbb{Z}$ a une solution si et seulement si $d = a \wedge n$ divise $b$, et elle en a alors exactement $d$ : on divise tout par $d$ et l'on se ramène à une équation inversible modulo $\frac{n}{d}$.
- id: "mp-01-34"
  feuille: "f-mp-01"
  numero: 34
  partie: "Les anneaux $\\mathbb{Z}/n\\mathbb{Z}$"
  etoiles: 1
  types: [Calcul]
  mots_cles: [anneaux Z/nZ]
  noeuds: [z-zn]
  notions: [anneau-zn]
  source: "bibmath, Anneaux, exercice 15"
  page_enonce: 6
  page_corrige: 16
  enonce: |
    **1.** Dans $\mathbb{Z}/13\mathbb{Z}$ :

    **(a)** Déterminer $\overline{k}$ tel que $x^{2} + x + \overline{7} = (x + \overline{7})^{2} - \overline{k}^{2}$ pour tout $x \in \mathbb{Z}/13\mathbb{Z}$.

    **(b)** En déduire les solutions de l'équation $x^{2} + x + \overline{7} = \overline{0}$.

    **2.** Dans $\mathbb{Z}/12\mathbb{Z}$ :

    **(a)** Déterminer tous les éléments dont le carré vaut $\overline{1}$.

    **(b)** Montrer que l'équation $x^{2} - \overline{4}x + \overline{3} = \overline{0}$ a exactement quatre solutions, et les déterminer.
  corrige: |
    **1.(a)** Pour $x \in \mathbb{Z}/13\mathbb{Z}$, on a $(x + \overline{7})^{2} = x^{2} + \overline{14}x + \overline{49} = x^{2} + x + \overline{10}$. L'égalité demandée équivaut donc à $\overline{10} - \overline{k}^{2} = \overline{7}$, soit $\overline{k}^{2} = \overline{3}$. Or $4^{2} = 16 \equiv 3$, et l'équation $y^{2} = \overline{3}$ a au plus deux solutions dans le corps $\mathbb{Z}/13\mathbb{Z}$ (exercice 17), qui sont $\overline{4}$ et $-\overline{4} = \overline{9}$. 
    $$\boxed{\overline{k} \in \{\overline{4}, \overline{9}\}}$$

    **(b)** L'équation s'écrit $(x + \overline{7})^{2} - \overline{4}^{2} = (x + \overline{7} - \overline{4})(x + \overline{7} + \overline{4}) = (x + \overline{3})(x + \overline{11}) = \overline{0}$. Comme $\mathbb{Z}/13\mathbb{Z}$ est un corps, donc intègre, $x = -\overline{3}$ ou $x = -\overline{11}$. 
    $$\boxed{x \in \{\overline{2}, \overline{10}\}}$$
     On vérifie : $4 + 2 + 7 = 13$ et $100 + 10 + 7 = 117 = 9 \times 13$ ✓.

    **2.(a)** Un élément de carré $\overline{1}$ est inversible : il suffit de tester les quatre classes $\overline{1}$, $\overline{5}$, $\overline{7}$, $\overline{11}$ de $(\mathbb{Z}/12\mathbb{Z})^{\times}$ (théorème 4), et $1$, $25$, $49$, $121$ sont tous congrus à $1$ modulo $12$. 
    $$\boxed{x^{2} = \overline{1} \iff x \in \{\overline{1}, \overline{5}, \overline{7}, \overline{11}\}}$$

    **(b)** On a $x^{2} - \overline{4}x + \overline{3} = (x - \overline{2})^{2} - \overline{1}$ : l'équation équivaut à $(x - \overline{2})^{2} = \overline{1}$, c'est-à-dire, par (a), à $x - \overline{2} \in \{\overline{1}, \overline{5}, \overline{7}, \overline{11}\}$. 
    $$\boxed{x \in \{\overline{1}, \overline{3}, \overline{7}, \overline{9}\}}$$
     *Piège.* L'erreur la plus répandue est de factoriser $x^{2} - \overline{4}x + \overline{3} = (x - \overline{1})(x - \overline{3})$ et de conclure $x \in \{\overline{1}, \overline{3}\}$. L'anneau $\mathbb{Z}/12\mathbb{Z}$ n'est pas intègre : pour $x = \overline{7}$, le produit $\overline{6} \times \overline{4}$ est nul sans qu'aucun facteur le soit. Une équation de degré $2$ peut avoir plus de deux solutions, ce que l'exercice 17 interdit seulement dans un anneau intègre.
- id: "mp-01-35"
  feuille: "f-mp-01"
  numero: 35
  partie: "Les anneaux $\\mathbb{Z}/n\\mathbb{Z}$"
  etoiles: 1
  types: [Calcul]
  mots_cles: [anneaux Z/nZ]
  noeuds: [z-zn]
  notions: [anneau-zn]
  source: "bibmath, Anneaux, exercice 17"
  page_enonce: 6
  page_corrige: 17
  enonce: |
    Les groupes additifs $\mathbb{Z}/8\mathbb{Z}$, $\mathbb{Z}/2\mathbb{Z} \times \mathbb{Z}/4\mathbb{Z}$ et $(\mathbb{Z}/2\mathbb{Z})^{3}$ sont-ils isomorphes ?
  corrige: |
    Un isomorphisme de groupes conserve l'ordre des éléments. Dans $\mathbb{Z}/8\mathbb{Z}$, l'élément $\overline{1}$ est d'ordre $8$. Dans $\mathbb{Z}/2\mathbb{Z} \times \mathbb{Z}/4\mathbb{Z}$, tout élément $(a, b)$ vérifie $4(a, b) = (0, 0)$, donc est d'ordre au plus $4$, et $(\overline{0}, \overline{1})$ est d'ordre $4$. Dans $(\mathbb{Z}/2\mathbb{Z})^{3}$, tout élément vérifie $2x = 0$. 
    $$\boxed{\text{Les trois groupes, de cardinal } 8, \text{ sont deux à deux non isomorphes.}}$$
     C'est cohérent avec le théorème 5 : $\mathbb{Z}/2\mathbb{Z} \times \mathbb{Z}/4\mathbb{Z}$ n'est pas isomorphe à $\mathbb{Z}/8\mathbb{Z}$ parce que $2 \wedge 4 \neq 1$ (exercice 40). Le groupe $(\mathbb{Z}/2\mathbb{Z})^{3}$ est celui de l'exercice 4.
- id: "mp-01-36"
  feuille: "f-mp-01"
  numero: 36
  partie: "Les anneaux $\\mathbb{Z}/n\\mathbb{Z}$"
  etoiles: 1
