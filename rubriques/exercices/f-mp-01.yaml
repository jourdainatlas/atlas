  enonce: |
    Montrer que toute suite croissante d'idéaux de $\mathbb{K}[X]$ est stationnaire.
  corrige: |
    L'argument de l'exercice 27 s'applique mot pour mot. Si $(I_{k})$ est une suite croissante d'idéaux de $\mathbb{K}[X]$, leur réunion $I$ est un idéal, puisque deux éléments de $I$ appartiennent à un même $I_{k}$. Par le théorème 7, $I = P\,\mathbb{K}[X]$, et $P$ appartient à l'un des $I_{k_{0}}$ ; pour $k \geqslant k_{0}$, on a $I = P\,\mathbb{K}[X] \subset I_{k_{0}} \subset I_{k} \subset I$. 
    $$\boxed{\text{Toute suite croissante d'idéaux de } \mathbb{K}[X] \text{ est stationnaire.}}$$
     Dans les deux cas, c'est le caractère principal des idéaux qui conclut. On peut aussi raisonner sur les générateurs unitaires, lorsque les idéaux sont non nuls : si $I_{k} = P_{k}\mathbb{K}[X]$, la suite des degrés des $P_{k}$ décroît, car $P_{k+1}$ divise $P_{k}$, et une suite décroissante d'entiers naturels est stationnaire.
- id: "mp-01-50"
  feuille: "f-mp-01"
  numero: 50
  partie: "L'anneau $\\mathbb{K}[X]$"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["anneau K[X]"]
  noeuds: [pol-principal, pol-irreductibles]
  notions: [polynome-irreductible]
  source: "bibmath, Anneaux, exercice 22"
  page_enonce: 8
  page_corrige: 23
  enonce: |
    Soit $P = X^{4} - 4X^{3} + 4X^{2} + X - 2$.

    **1.** Trouver deux racines évidentes $a$ et $b$ de $P$.

    **2.** Effectuer la division euclidienne de $P$ par $(X - a)(X - b)$.

    **3.** En déduire toutes les racines de $P$.
  corrige: |
    **1.** On calcule $P(1) = 1 - 4 + 4 + 1 - 2 = 0$ et $P(2) = 16 - 32 + 16 + 2 - 2 = 0$. 
    $$\boxed{a = 1, \qquad b = 2}$$

    **2.** On divise $P$ par $(X - 1)(X - 2) = X^{2} - 3X + 2$ : 
    $$X^{4} - 4X^{3} + 4X^{2} + X - 2 = \big(X^{2} - 3X + 2\big)\big(X^{2} - X - 1\big).$$

    $$\boxed{\text{Quotient } X^{2} - X - 1, \qquad \text{reste } 0}$$
     Le reste est nul, comme il se doit : $1$ et $2$ sont racines, donc $(X - 1)(X - 2)$ divise $P$ (chapitre 13 de MPSI).

    **3.** Le discriminant de $X^{2} - X - 1$ vaut $5$. 
    $$\boxed{\text{Les racines de } P \text{ sont } 1, \ 2, \ \frac{1 + \sqrt{5}}{2} \text{ et } \frac{1 - \sqrt{5}}{2}}$$
     Toutes sont simples. Dans $\mathbb{Q}[X]$, la factorisation $P = (X - 1)(X - 2)(X^{2} - X - 1)$ est la décomposition en irréductibles : le facteur de degré $2$ n'a pas de racine rationnelle (proposition 14).
- id: "mp-01-51"
  feuille: "f-mp-01"
  numero: 51
  partie: "L'anneau $\\mathbb{K}[X]$"
  etoiles: 1
