  enonce: |
    Soit $A$ et $B$ deux anneaux commutatifs. Montrer que les idéaux de l'anneau produit $A \times B$ sont exactement les produits $I \times J$, où $I$ est un idéal de $A$ et $J$ un idéal de $B$.
  corrige: |
    Si $I$ et $J$ sont des idéaux de $A$ et de $B$, le produit $I \times J$ est un sous-groupe de $A \times B$, et $(a, b)(i, j) = (ai, bj) \in I \times J$ : c'est un idéal. Réciproquement, soit $K$ un idéal de $A \times B$, et $I$, $J$ ses projections sur $A$ et sur $B$. Évidemment $K \subset I \times J$. Si $a \in I$, il existe $b'$ tel que $(a, b') \in K$, et alors $(a, 0) = (1, 0)(a, b') \in K$ ; de même, $(0, b) \in K$ pour tout $b \in J$. Pour $(a, b) \in I \times J$, on a donc $(a, b) = (a, 0) + (0, b) \in K$. Enfin $I = \{a \mid (a, 0) \in K\}$ est un idéal de $A$ : il contient $0$, il est stable par différence, et $(a', 0)(a, 0) = (a'a, 0)$. Il en est de même de $J$. 
    $$\boxed{\text{Les idéaux de } A \times B \text{ sont les produits } I \times J \text{ d'idéaux de } A \text{ et de } B.}$$
     *À retenir.* L'élément $(1, 0)$, qui vérifie $(1, 0)^{2} = (1, 0)$, sert à « découper » chaque élément de $K$ suivant les deux facteurs. C'est l'outil de l'exercice 69, où des éléments de ce type décomposent un anneau en produit.
- id: "mp-01-25"
  feuille: "f-mp-01"
  numero: 25
