  enonce: |
    Soit $\mathcal{A}$ une $\mathbb{K}$-algèbre.

    **1.** Montrer que tout idéal de $\mathcal{A}$, supposée commutative, en est un sous-espace vectoriel.

    **2.** On suppose $\mathcal{A}$ commutative et l'on suppose que tout sous-espace vectoriel de $\mathcal{A}$ en est un idéal. Montrer que $\dim \mathcal{A} \leqslant 1$.
  corrige: |
    **1.** Un idéal $I$ est un sous-groupe additif, et pour $\lambda \in \mathbb{K}$ et $x \in I$, on a $\lambda x = (\lambda 1_{\mathcal{A}})x$, produit de $x$ par un élément de $\mathcal{A}$ : il appartient à $I$. 
    $$\boxed{\text{Tout idéal de } \mathcal{A} \text{ est un sous-espace vectoriel}}$$

    **2.** Si $\mathcal{A} = \{0\}$, sa dimension est nulle. Sinon, $1_{\mathcal{A}} \neq 0$, et la droite $\mathbb{K} \cdot 1_{\mathcal{A}}$ est un sous-espace, donc un idéal par hypothèse ; elle contient $1_{\mathcal{A}}$, donc elle est égale à $\mathcal{A}$. 
    $$\boxed{\dim \mathcal{A} \leqslant 1}$$
     Les idéaux sont donc des sous-espaces particuliers : dans $\mathbb{K}[X]$, le sous-espace $\mathbb{K}_{n}[X]$ n'est pas un idéal. L'exercice suivant les dénombre dans un cas où ils sont en nombre fini.
- id: "mp-01-62"
  feuille: "f-mp-01"
  numero: 62
  partie: "Algèbres"
  etoiles: 2
  types: [Calcul]
  mots_cles: [algèbres, idéaux]
  noeuds: [alg, a-ideal]
  notions: [ideal]
  source: "TD 2 Algèbre générale (Sainte-Geneviève), exercice 49"
  page_enonce: 10
  page_corrige: 28
  enonce: |
    Combien la $\mathbb{K}$-algèbre produit $\mathbb{K}^{n}$ possède-t-elle d'idéaux ?
  corrige: |
    Par l'exercice 24, appliqué de proche en proche à $\mathbb{K}^{n} = \mathbb{K}^{n-1} \times \mathbb{K}$, les idéaux de l'anneau $\mathbb{K}^{n}$ sont les produits $I_{1} \times \cdots \times I_{n}$, où chaque $I_{k}$ est un idéal de $\mathbb{K}$. Un corps n'a que deux idéaux : un idéal qui contient un élément non nul contient son produit par l'inverse, soit $1$, et c'est le corps entier. Par l'exercice 61, les idéaux de l'algèbre sont ceux de l'anneau. 
    $$\boxed{\mathbb{K}^{n} \text{ possède } 2^{n} \text{ idéaux : les } \prod_{k=1}^{n} I_{k}, \text{ avec } I_{k} \in \{\{0\}, \mathbb{K}\}}$$
     L'idéal correspondant à une partie $S$ de $\llbracket 1\,,n \rrbracket$ est formé des vecteurs nuls en dehors de $S$ : les idéaux de $\mathbb{K}^{n}$ sont en bijection avec les parties de $\llbracket 1\,,n \rrbracket$, ce qui explique le nombre $2^{n}$.
- id: "mp-01-63"
  feuille: "f-mp-01"
  numero: 63
  partie: "Algèbres"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [algèbres]
  noeuds: [alg]
  notions: []
  source: "TD 2 Algèbre générale (Sainte-Geneviève), exercice 52"
  page_enonce: 10
  page_corrige: 28
  enonce: |
    **1.** Construire une $\mathbb{K}$-algèbre $\mathbb{K}[\varepsilon]$ possédant une base $(1, \varepsilon)$, où $\varepsilon^{2} = 0$. On pourra utiliser une matrice de $\mathcal{M}_{2}(\mathbb{K})$ de carré nul.

    **2.** Soit $\phi : \mathbb{K}[X] \to \mathbb{K}[\varepsilon]$ un morphisme d'algèbres. Montrer qu'il existe $a$, $b \in \mathbb{K}$ tels que 
    $$\forall P \in \mathbb{K}[X], \qquad \phi(P) = P(a) + bP'(a)\,\varepsilon.$$
  corrige: |
    **1.** Soit $N = \begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$, qui vérifie $N^{2} = 0$, et $\mathbb{K}[\varepsilon] = \mathrm{Vect}(I_{2}, N) = \{aI_{2} + bN \mid a, b \in \mathbb{K}\}$. C'est un sous-espace de $\mathcal{M}_{2}(\mathbb{K})$ qui contient $I_{2}$, et il est stable par produit : 
    $$(aI_{2} + bN)(cI_{2} + dN) = ac\,I_{2} + (ad + bc)\,N.$$
     La famille $(I_{2}, N)$ est libre, car $aI_{2} + bN = \begin{pmatrix} a & b \\ 0 & a \end{pmatrix}$. 
    $$\boxed{\mathbb{K}[\varepsilon] = \mathrm{Vect}(I_{2}, N) \text{ est une sous-algèbre de base } (1, \varepsilon), \text{ avec } \varepsilon = N \text{ et } \varepsilon^{2} = 0}$$
     On identifie $1$ et $I_{2}$, et l'on écrit $a + b\varepsilon$ pour $aI_{2} + bN$.

    **2.** Écrivons $\phi(X) = a + b\varepsilon$, avec $a$, $b \in \mathbb{K}$. Comme $\phi$ est un morphisme d'algèbres, $\phi(X^{k}) = (a + b\varepsilon)^{k}$, et la formule du binôme, valable puisque $a$ et $b\varepsilon$ commutent, donne, grâce à $\varepsilon^{2} = 0$, 
    $$\phi(X^{k}) = a^{k} + k\,a^{k-1}b\,\varepsilon \qquad (k \geqslant 1), \qquad \phi(1) = 1.$$
     On reconnaît $X^{k}(a) + b\,(X^{k})'(a)\,\varepsilon$, et cette expression est linéaire en le polynôme. Par linéarité de $\phi$, de l'évaluation et de la dérivation, 
    $$\boxed{\phi(P) = P(a) + b\,P'(a)\,\varepsilon \text{ pour tout } P \in \mathbb{K}[X]}$$
     L'élément $\varepsilon$ se comporte comme un « infiniment petit » dont le carré est négligeable : l'égalité 
    $$P(a + b\varepsilon) = P(a) + P'(a)\,b\varepsilon$$
     est le développement limité à l'ordre $1$, qui est ici exact. On parle de *nombres duaux* ; ils servent en informatique à calculer simultanément une fonction et sa dérivée.
- id: "mp-01-64"
  feuille: "f-mp-01"
  numero: 64
  partie: "Algèbres"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [algèbres, anneau des polynômes]
  noeuds: [alg, pol-principal]
  notions: []
  source: "TD 2 Algèbre générale (Sainte-Geneviève), exercice 53"
  page_enonce: 10
  page_corrige: 29
  enonce: |
    On considère l'ensemble $\mathcal{A}$ des polynômes $P \in \mathbb{K}[X]$ dont le coefficient de degré $1$ est nul.

    **1.** Montrer que $\mathcal{A}$ est une sous-algèbre de $\mathbb{K}[X]$.

    **2.** Montrer que $\mathcal{A}$ n'est pas isomorphe, comme algèbre, à $\mathbb{K}[X]$.
  corrige: |
    **1.** L'application $P \mapsto P'(0)$ est une forme linéaire sur $\mathbb{K}[X]$, de noyau $\mathcal{A}$, qui est donc un sous-espace vectoriel ; il contient $1$. Pour $P$, $Q \in \mathcal{A}$, on a 
    $$(PQ)'(0) = P'(0)Q(0) + P(0)Q'(0) = 0.$$

    $$\boxed{\mathcal{A} \text{ est une sous-algèbre de } \mathbb{K}[X]}$$

    **2.** Supposons qu'il existe un isomorphisme d'algèbres $\psi : \mathbb{K}[X] \to \mathcal{A}$, et notons $F = \psi(X)$. Pour tout $Q \in \mathbb{K}[X]$, on a $\psi(Q) = Q(F)$ ; comme $\psi$ est surjectif, tout élément de $\mathcal{A}$ est un polynôme en $F$. Soit $d = \deg F$. Si $d = 0$, les polynômes en $F$ sont des constantes, alors que $X^{2} \in \mathcal{A}$. Sinon, $\deg Q(F) = d \deg Q$ pour $Q \neq 0$, et les degrés des éléments non nuls de $\mathcal{A}$ sont des multiples de $d$. Or $X^{2}$ et $X^{3}$ appartiennent à $\mathcal{A}$ : $d$ divise $2$ et $3$, donc $d = 1$. Mais $\mathcal{A}$ ne contient aucun polynôme de degré $1$, puisque son coefficient de degré $1$ serait non nul. 
    $$\boxed{\mathcal{A} \text{ n'est pas isomorphe à } \mathbb{K}[X]}$$
     *Piège.* Les deux algèbres sont de dimension infinie dénombrable, donc isomorphes comme espaces vectoriels : c'est le produit qui les distingue. L'algèbre $\mathbb{K}[X]$ est engendrée par un seul élément, $X$, alors que $\mathcal{A}$ demande deux générateurs, par exemple $X^{2}$ et $X^{3}$.
- id: "mp-01-65"
  feuille: "f-mp-01"
  numero: 65
  partie: "Algèbres"
  etoiles: 3
