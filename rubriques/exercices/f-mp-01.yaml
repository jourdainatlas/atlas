  enonce: |
    Soit $n \in \mathbb{N}^{*}$. Déterminer le reste de la division euclidienne :

    **1.** de $X^{n}$ par $X^{2} - 3X + 2$ ;

    **2.** de $X^{n}$ par $(X - 1)^{3}$ ;

    **3.** de $\big(\cos\theta + X\sin\theta\big)^{n}$ par $X^{2} + 1$, pour $\theta \in \mathbb{R}$ ;

    **4.** de $X^{n}$ par $X^{2} + X + 1$.
  corrige: |
    Dans chaque cas, on écrit $X^{n} = BQ + R$ avec $\deg R < \deg B$, et l'on évalue en des racines de $B$, qui annulent $BQ$.

    **1.** Le reste s'écrit $R = \alpha X + \beta$, et $B = (X - 1)(X - 2)$. L'évaluation en $1$ et en $2$ donne $\alpha + \beta = 1$ et $2\alpha + \beta = 2^{n}$. 
    $$\boxed{R = \big(2^{n} - 1\big)X + 2 - 2^{n}}$$

    **2.** Ici la racine $1$ est triple, et l'évaluation ne fournit qu'une équation. On utilise la formule de Taylor en $1$ (chapitre 13 de MPSI), ou simplement la formule du binôme : 
    $$X^{n} = \big(1 + (X - 1)\big)^{n} = \sum_{k=0}^{n} \binom{n}{k}(X - 1)^{k} = 1 + n(X - 1) + \binom{n}{2}(X - 1)^{2} + (X - 1)^{3}Q.$$

    $$\boxed{R = 1 + n(X - 1) + \frac{n(n - 1)}{2}(X - 1)^{2} = \frac{n(n - 1)}{2}X^{2} - n(n - 2)X + \frac{(n - 1)(n - 2)}{2}}$$
     Pour $n = 5$, on trouve $10X^{2} - 15X + 6$, ce que confirme le calcul symbolique.

    **3.** Le reste s'écrit $\alpha X + \beta$ avec $\alpha$, $\beta$ réels, puisque la division a lieu dans $\mathbb{R}[X]$. L'évaluation en $\mathrm{i}$ et la formule de Moivre (chapitre 4 de MPSI) donnent 
    $$\alpha\mathrm{i} + \beta = (\cos\theta + \mathrm{i}\sin\theta)^{n} = \cos(n\theta) + \mathrm{i}\sin(n\theta).$$

    $$\boxed{R = \sin(n\theta)\,X + \cos(n\theta)}$$

    **4.** Comme $X^{3} - 1 = (X - 1)(X^{2} + X + 1)$, on a $X^{3} \equiv 1$ modulo $X^{2} + X + 1$, et donc $X^{n} \equiv X^{r}$, où $r$ est le reste de $n$ modulo $3$. Pour $r = 2$, on réduit encore $X^{2} = (X^{2} + X + 1) - X - 1$. 
    $$\boxed{R = 1 \text{ si } n \equiv 0, \qquad R = X \text{ si } n \equiv 1, \qquad R = -X - 1 \text{ si } n \equiv 2 \;[3]}$$
     On peut aussi évaluer en $j = \mathrm{e}^{2\mathrm{i}\pi/3}$, qui vérifie $j^{3} = 1$, comme à la question 3. La congruence modulo un polynôme se manie comme la congruence modulo un entier ; ici, « $X^{3} \equiv 1$ » joue le rôle de « $10 \equiv 1 \;[9]$ » dans la preuve par neuf.
- id: "mp-01-53"
  feuille: "f-mp-01"
  numero: 53
