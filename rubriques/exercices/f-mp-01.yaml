  enonce: |
    Soit $A$ un anneau commutatif. Pour un idéal $I$ de $A$, on appelle *radical* de $I$ l'ensemble 
    $$\sqrt{I} = \{x \in A \mid \exists n \in \mathbb{N}^{*}, \ x^{n} \in I\}.$$

    **1.** Montrer que $\sqrt{I}$ est un idéal de $A$.

    **2.** Soit $I$ et $J$ deux idéaux de $A$ et $p \in \mathbb{N}^{*}$. Montrer que $\sqrt{I \cdot J} = \sqrt{I \cap J} = \sqrt{I} \cap \sqrt{J}$, que $\sqrt{\sqrt{I}} = \sqrt{I}$, et que $\sqrt{I^{p}} = \sqrt{I}$, le produit d'idéaux étant défini comme dans l'exercice 23.

    **3.** On prend $A = \mathbb{Z}$ et $I = k\mathbb{Z}$, avec $k \geqslant 1$. Déterminer $\sqrt{I}$.
  corrige: |
    **1.** Le radical contient $0$. Soit $x$, $y \in \sqrt{I}$, avec $x^{n} \in I$ et $y^{m} \in I$, et $a \in A$. Comme $A$ est commutatif, $(ax)^{n} = a^{n}x^{n} \in I$, et la formule du binôme donne 
    $$(x - y)^{n+m-1} = \sum_{k=0}^{n+m-1} \binom{n + m - 1}{k} x^{k}(-y)^{n+m-1-k} \in I,$$
     car chaque terme contient $x^{k}$ avec $k \geqslant n$, ou $y^{j}$ avec $j \geqslant m$, et appartient donc à $I$. 
    $$\boxed{\sqrt{I} \text{ est un idéal de } A}$$
     C'est le raisonnement de l'exercice 18, question 4 (a) : $\sqrt{\{0\}}$ est l'ensemble des nilpotents.

    **2.** Le radical est croissant : si $I \subset J$, alors $\sqrt{I} \subset \sqrt{J}$. Comme $I \cdot J \subset I \cap J$ (exercice 23) et que $I \cap J$ est contenu dans $I$ et dans $J$, on a $\sqrt{I \cdot J} \subset \sqrt{I \cap J} \subset \sqrt{I} \cap \sqrt{J}$. Réciproquement, si $x^{n} \in I$ et $x^{m} \in J$, alors $x^{n+m} = x^{n}x^{m} \in I \cdot J$.

    Comme $I \subset \sqrt{I}$, on a $\sqrt{I} \subset \sqrt{\sqrt{I}}$ ; si $x^{n} \in \sqrt{I}$, il existe $m$ tel que $x^{nm} = (x^{n})^{m} \in I$, donc $x \in \sqrt{I}$.

    Enfin $I^{p}$, produit de $p$ copies de $I$, est contenu dans $I$ (exercice 23, question 2, et récurrence), d'où $\sqrt{I^{p}} \subset \sqrt{I}$ ; si $x^{n} \in I$, alors $x^{np} = (x^{n})^{p} \in I^{p}$. 
    $$\boxed{\sqrt{I \cdot J} = \sqrt{I \cap J} = \sqrt{I} \cap \sqrt{J}, \qquad \sqrt{\sqrt{I}} = \sqrt{I}, \qquad \sqrt{I^{p}} = \sqrt{I}}$$

    **3.** Écrivons $k = p_{1}^{\alpha_{1}} \cdots p_{s}^{\alpha_{s}}$ (chapitre 12 de MPSI), et $r = p_{1}p_{2} \cdots p_{s}$, avec $r = 1$ si $k = 1$. Si $x \in \sqrt{k\mathbb{Z}}$, alors $k \mid x^{n}$, donc chaque $p_{i}$ divise $x^{n}$, puis $x$ (lemme d'Euclide), et $r \mid x$. Réciproquement, si $x = ry$, alors pour $n \geqslant \max_{i} \alpha_{i}$, l'entier $k$ divise $r^{n}$, qui divise $x^{n}$. 
    $$\boxed{\sqrt{k\mathbb{Z}} = (p_{1}p_{2} \cdots p_{s})\mathbb{Z}}$$
     Par exemple, $\sqrt{72\mathbb{Z}} = 6\mathbb{Z}$, puisque $72 = 2^{3} \times 3^{2}$. Le radical « oublie les exposants », ce que traduit l'égalité $\sqrt{I^{p}} = \sqrt{I}$.
