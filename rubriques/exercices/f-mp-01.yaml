  notions: [sous-groupe-engendre, ordre-element]
  source: "Algèbre générale (LLG), exercice 9"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    On donne un entier $n \geqslant 2$ et, dans le groupe $\mathfrak{S}_{n}$, on considère l'application qui à $\sigma$ associe $\sigma c \sigma^{-1}$, où $c$ désigne le cycle $(1\ 2\ \cdots\ n)$. Déterminer l'image de cette application.
  corrige: |
    Notons $c = (1\ 2\ \cdots\ n)$ et calculons $\sigma c \sigma^{-1}$ sur l'élément $\sigma(i)$, pour $i \in \llbracket 1\,,n \rrbracket$, en convenant que $n + 1$ désigne $1$ : 
    $$\sigma c \sigma^{-1}\big(\sigma(i)\big) = \sigma\big(c(i)\big) = \sigma(i + 1).$$
     Comme $\sigma(1), \dots, \sigma(n)$ parcourent $\llbracket 1\,,n \rrbracket$, cela détermine entièrement $\sigma c \sigma^{-1}$ : 
    $$\boxed{\sigma c \sigma^{-1} = \big(\sigma(1)\ \ \sigma(2)\ \ \cdots\ \ \sigma(n)\big)}$$
     C'est un $n$-cycle. Réciproquement, tout $n$-cycle s'écrit $(a_{1}\ a_{2}\ \cdots\ a_{n})$, où $a_{1}, \dots, a_{n}$ sont les éléments de $\llbracket 1\,,n \rrbracket$ dans un certain ordre, et la permutation $\sigma$ définie par $\sigma(i) = a_{i}$ l'obtient. 
    $$\boxed{\text{L'image de } \sigma \mapsto \sigma c \sigma^{-1} \text{ est l'ensemble des } n\text{-cycles de } \mathfrak{S}_{n}.}$$
     Chaque $n$-cycle s'écrit de $n$ façons, selon l'élément par lequel on commence, et provient donc de $n$ permutations $\sigma$ : il y a $\frac{n!}{n} = (n - 1)!$ cycles de longueur $n$. La formule encadrée, valable pour un cycle quelconque, resservira aux exercices 9 et 73 : conjuguer un cycle revient à renommer les éléments de son support.
- id: "mp-01-04"
