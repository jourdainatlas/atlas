  enonce: |
    Dénombrer les morphismes de groupes de $(\mathbb{Z}/4\mathbb{Z}, +)$ dans le groupe $\operatorname{Aut}(\mathbb{Z}/13\mathbb{Z})$ des automorphismes du groupe $(\mathbb{Z}/13\mathbb{Z}, +)$, défini à l'exercice 10.
  corrige: |
    **Le groupe $\operatorname{Aut}(\mathbb{Z}/13\mathbb{Z})$.** Un endomorphisme $u$ du groupe $\mathbb{Z}/13\mathbb{Z}$ est déterminé par $u(\overline{1}) = \overline{k}$, puisque $u(\overline{j}) = j\,u(\overline{1}) = \overline{k}\,\overline{j}$ : c'est la multiplication par $\overline{k}$. Elle est bijective si et seulement si $\overline{k}$ est inversible, c'est-à-dire $\overline{k} \neq \overline{0}$, et $u_{\overline{k}} \circ u_{\overline{k'}} = u_{\overline{kk'}}$. Ainsi $\overline{k} \mapsto u_{\overline{k}}$ est un isomorphisme de $(\mathbb{Z}/13\mathbb{Z})^{\times}$ sur $\operatorname{Aut}(\mathbb{Z}/13\mathbb{Z})$. Les puissances de $\overline{2}$ dans $\mathbb{Z}/13\mathbb{Z}$ sont 
    $$\overline{2}, \overline{4}, \overline{8}, \overline{3}, \overline{6}, \overline{12}, \overline{11}, \overline{9}, \overline{5}, \overline{10}, \overline{7}, \overline{1} :$$
     $\overline{2}$ est d'ordre $12$, et $\operatorname{Aut}(\mathbb{Z}/13\mathbb{Z})$ est cyclique d'ordre $12$.

    **Les morphismes.** Un morphisme $f$ de $\mathbb{Z}/4\mathbb{Z}$ dans un groupe multiplicatif $H$ est déterminé par $h = f(\overline{1})$, puisque $f(\overline{j}) = h^{j}$, et $h^{4} = f(\overline{4}) = f(\overline{0}) = e$. Réciproquement, si $h^{4} = e$, la formule $f(\overline{j}) = h^{j}$ ne dépend pas du représentant $j$ et définit un morphisme. Il y a donc autant de morphismes que de solutions de $h^{4} = e$ dans $H \simeq (\mathbb{Z}/13\mathbb{Z})^{\times}$. Or $k^{4} \equiv 1 \;[13]$ équivaut à $k^{2} \equiv \pm 1$, dont les solutions sont $\pm 1$ et, puisque $5^{2} = 25 \equiv -1$, $\pm 5$. 
    $$\boxed{\text{Il y a } 4 \text{ morphismes : } \overline{j} \mapsto u_{\overline{k}}^{\,j}, \ \text{ avec } \overline{k} \in \{\overline{1}, \overline{5}, \overline{8}, \overline{12}\}}$$
     Dans un groupe cyclique d'ordre $12$, l'équation $h^{4} = e$ a toujours $4 \wedge 12 = 4$ solutions (exercice 70, question 3) ; le calcul direct le confirme ici.
- id: "mp-01-47"
