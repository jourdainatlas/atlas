  page_enonce: 8
  page_corrige: 24
  enonce: |
    Montrer que les polynômes $P = X^{3} + 3X^{2} + 2$ et $Q = X^{4} + 1$ sont irréductibles dans $\mathbb{Q}[X]$.
  corrige: |
    **Le polynôme $P$.** Il est de degré $3$ : par la proposition 14, il suffit de montrer qu'il n'a pas de racine rationnelle. Si $\frac{p}{q}$ en est une, avec $p \wedge q = 1$ et $q \geqslant 1$, alors 
    $$p^{3} + 3p^{2}q + 2q^{3} = 0.$$
     Donc $q$ divise $p^{3}$ ; comme $q \wedge p^{3} = 1$, on a $q = 1$. Puis $p$ divise $2q^{3} = 2$, et $p \in \{\pm 1, \pm 2\}$. Or $P(1) = 6$, $P(-1) = 4$, $P(2) = 22$ et $P(-2) = 6$. 
    $$\boxed{P \text{ est irréductible dans } \mathbb{Q}[X]}$$
     C'est un cas particulier du théorème des racines rationnelles (exercice 57).

    **Le polynôme $Q$.** Il n'a pas de racine réelle, car $x^{4} + 1 > 0$, donc pas de facteur de degré $1$. S'il était réductible, il s'écrirait, après division des facteurs par leurs coefficients dominants, $Q = (X^{2} + aX + b)(X^{2} + cX + d)$ avec $a, b, c, d \in \mathbb{Q}$. En identifiant les coefficients de $X^{3}$, $X^{2}$, $X$ et $1$, 
    $$a + c = 0, \qquad b + d + ac = 0, \qquad ad + bc = 0, \qquad bd = 1.$$
     Avec $c = -a$, la troisième équation s'écrit $a(d - b) = 0$. Si $a = 0$, alors $b + d = 0$ et $bd = 1$, d'où $-b^{2} = 1$, ce qui est impossible. Si $d = b$, alors $b^{2} = 1$ et $a^{2} = 2b = \pm 2$, ce qui impose $a^{2} = 2$, impossible dans $\mathbb{Q}$. 
    $$\boxed{Q = X^{4} + 1 \text{ est irréductible dans } \mathbb{Q}[X]}$$
     *Piège.* Le calcul montre aussi que $X^{4} + 1 = (X^{2} + \sqrt{2}X + 1)(X^{2} - \sqrt{2}X + 1)$ dans $\mathbb{R}[X]$ : l'irréductibilité dépend du corps. Et un polynôme de degré $4$ sans racine n'est pas forcément irréductible, comme le montre $X^{4} + 4$ (exercice 67).
- id: "mp-01-54"
  feuille: "f-mp-01"
  numero: 54
  partie: "L'anneau $\\mathbb{K}[X]$"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["anneau K[X]", idéaux]
  noeuds: [pol-principal, pol-irreductibles, a-ideal]
  notions: [polynome-irreductible, ideal]
  source: "TD 2 Algèbre générale (Sainte-Geneviève), exercice 28, questions 1 et 2"
  page_enonce: 8
  page_corrige: 25
  enonce: |
    Un idéal $\mathfrak{m}$ d'un anneau commutatif $A$ est dit *maximal* si $\mathfrak{m} \neq A$ et si aucun idéal de $A$ n'est compris strictement entre $\mathfrak{m}$ et $A$.

    **1.** Montrer que $\mathfrak{m}_{0} = \{XP \mid P \in \mathbb{K}[X]\}$ est un idéal maximal de $\mathbb{K}[X]$.

    **2.** Déterminer les idéaux maximaux de $\mathbb{Z}$ et de $\mathbb{K}[X]$.
  corrige: |
    **1.** L'ensemble $\mathfrak{m}_{0} = X\mathbb{K}[X]$ est un idéal (proposition 8), qui ne contient pas $1$. Soit $J$ un idéal contenant strictement $\mathfrak{m}_{0}$, et $P \in J \setminus \mathfrak{m}_{0}$, de sorte que $P(0) \neq 0$. On écrit $P = P(0) + XQ$ ; alors $P(0) = P - XQ \in J$ est une constante non nulle, donc inversible, et $J = \mathbb{K}[X]$. 
    $$\boxed{X\mathbb{K}[X] \text{ est un idéal maximal de } \mathbb{K}[X]}$$

    **2.** *Dans $\mathbb{Z}$.* Les idéaux distincts de $\mathbb{Z}$ sont les $n\mathbb{Z}$ avec $n = 0$ ou $n \geqslant 2$ (théorème 3). L'idéal $\{0\}$ n'est pas maximal, car $\{0\} \subsetneq 2\mathbb{Z} \subsetneq \mathbb{Z}$ ; si $n = ab$ avec $1 < a, b < n$, alors $n\mathbb{Z} \subsetneq a\mathbb{Z} \subsetneq \mathbb{Z}$. Si $p$ est premier et $p\mathbb{Z} \subset m\mathbb{Z}$ avec $m \geqslant 0$, alors $m \mid p$, donc $m = 1$ ou $m = p$.

    *Dans $\mathbb{K}[X]$.* Par le théorème 7 et la proposition 9, $P\mathbb{K}[X] \subset A\mathbb{K}[X]$ équivaut à $A \mid P$. L'idéal nul n'est pas maximal, puisqu'il est contenu dans $X\mathbb{K}[X]$. Si $P$ est réductible, $P = AB$ avec $A$, $B$ non constants, et $P\mathbb{K}[X] \subsetneq A\mathbb{K}[X] \subsetneq \mathbb{K}[X]$. Si $P$ est irréductible et $P\mathbb{K}[X] \subset A\mathbb{K}[X]$, alors $A$ divise $P$, donc $A$ est une constante non nulle, et $A\mathbb{K}[X] = \mathbb{K}[X]$, ou $A$ est associé à $P$, et $A\mathbb{K}[X] = P\mathbb{K}[X]$. 
    $$\boxed{\text{Idéaux maximaux : les } p\mathbb{Z}, \ p \text{ premier, dans } \mathbb{Z} ; \ \text{les } P\mathbb{K}[X], \ P \text{ irréductible, dans } \mathbb{K}[X].}$$
     La question 1 est le cas $P = X$. Avec l'exercice 22, on obtient que $\mathbb{Z}/p\mathbb{Z}$ est un corps : ses idéaux sont les images des idéaux de $\mathbb{Z}$ contenant $p\mathbb{Z}$ (exercice 39), soit $\{\overline{0}\}$ et lui-même.
- id: "mp-01-55"
