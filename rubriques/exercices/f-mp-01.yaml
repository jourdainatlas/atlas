  enonce: |
    Soit $(A, +, \times)$ un anneau commutatif et $M$ une partie de $A$. On appelle *annulateur* de $M$ l'ensemble $\{x \in A \mid \forall y \in M, \ xy = 0\}$. Montrer que c'est un idéal de $A$.
  corrige: |
    Notons $\mathrm{Ann}(M)$ l'annulateur. Il contient $0$. Pour $x$, $x' \in \mathrm{Ann}(M)$, $a \in A$ et $y \in M$, on a 
    $$(x - x')y = xy - x'y = 0, \qquad (ax)y = a(xy) = a \cdot 0 = 0.$$

    $$\boxed{\mathrm{Ann}(M) \text{ est un idéal de } A}$$
     C'est aussi l'intersection des noyaux des applications $x \mapsto xy$, pour $y \in M$, qui sont des idéaux, mais ces applications ne sont pas des morphismes d'anneaux : la démonstration directe est la bonne. Dans $\mathbb{Z}/12\mathbb{Z}$, l'annulateur de $\{\overline{4}\}$ est $\{\overline{0}, \overline{3}, \overline{6}, \overline{9}\}$, l'idéal engendré par $\overline{3}$.
- id: "mp-01-14"
  feuille: "f-mp-01"
  numero: 14
  partie: "Compléments sur les anneaux"
  etoiles: 1
  types: [Calcul]
  mots_cles: [anneaux]
  noeuds: [a-anneau, a-ideal]
  notions: [ideal]
  source: "TD 2 Algèbre générale (Sainte-Geneviève), exercice 7"
  page_enonce: 3
  page_corrige: 8
  enonce: |
    **1.** Soit $A$ un anneau. Déterminer tous les morphismes d'anneaux de $\mathbb{Z}$ dans $A$.

    **2.** Donner un exemple d'anneau $A$ tel qu'il n'existe aucun morphisme d'anneaux de $A$ dans $\mathbb{Z}$.
  corrige: |
    **1.** Soit $f : \mathbb{Z} \to A$ un morphisme d'anneaux. C'est en particulier un morphisme de groupes additifs, donc $f(n) = n\,f(1)$ pour tout $n \in \mathbb{Z}$ (chapitre 11 de MPSI), et $f(1) = 1_{A}$. Réciproquement, l'application $n \mapsto n \cdot 1_{A}$ est un morphisme de groupes, envoie $1$ sur $1_{A}$, et respecte le produit, puisque $(n \cdot 1_{A})(m \cdot 1_{A}) = nm \cdot 1_{A}$ par distributivité. 
    $$\boxed{\text{Il existe un unique morphisme d'anneaux de } \mathbb{Z} \text{ dans } A : \ n \longmapsto n \cdot 1_{A}}$$

    **2.** Prenons $A = \mathbb{Z}/2\mathbb{Z}$. Un morphisme $f : \mathbb{Z}/2\mathbb{Z} \to \mathbb{Z}$ vérifierait $f(\overline{1}) = 1$, puis 
    $$0 = f(\overline{0}) = f(\overline{1} + \overline{1}) = 1 + 1 = 2,$$
     ce qui est absurde. 
    $$\boxed{\text{Il n'existe aucun morphisme d'anneaux de } \mathbb{Z}/2\mathbb{Z} \text{ dans } \mathbb{Z}}$$
     Le corps $\mathbb{Q}$ convient aussi : un morphisme $f$ vérifierait $2f\big(\frac{1}{2}\big) = f(1) = 1$, et $1$ n'est pas pair. La question 1 dit que $\mathbb{Z}$ est l'anneau « le plus simple » : il s'envoie dans tout anneau, d'une seule façon.
- id: "mp-01-15"
  feuille: "f-mp-01"
  numero: 15
  partie: "Compléments sur les anneaux"
  etoiles: 1
  types: [Calcul]
  mots_cles: [anneaux, idéaux]
  noeuds: [a-anneau, a-ideal]
  notions: [ideal]
  source: "bibmath, Anneaux, exercice 3"
  page_enonce: 3
  page_corrige: 8
  enonce: |
    On note $\mathcal{A}$ l'anneau des suites réelles et $\mathcal{B}$ celui des suites réelles bornées, munis de la somme et du produit terme à terme ; on admet que ce sont des anneaux. Soit $I$ l'ensemble des suites réelles qui tendent vers $0$. L'ensemble $I$ est-il un idéal de $\mathcal{A}$ ? de $\mathcal{B}$ ?
  corrige: |
    L'ensemble $I$ n'est pas un idéal de $\mathcal{A}$ : la suite $u = \big(\frac{1}{n + 1}\big)_{n}$ appartient à $I$, la suite $v = (n + 1)_{n}$ à $\mathcal{A}$, et leur produit est la suite constante égale à $1$, qui ne tend pas vers $0$.

    Il en est un de $\mathcal{B}$. D'abord $I \subset \mathcal{B}$, car une suite convergente est bornée ; $I$ contient la suite nulle et il est stable par différence (chapitre 7 de MPSI). Enfin, le produit d'une suite bornée par une suite de limite nulle a une limite nulle (chapitre 7 de MPSI) : si $|v_{n}| \leqslant M$, alors $|u_{n}v_{n}| \leqslant M|u_{n}|$. 
    $$\boxed{I \text{ n'est pas un idéal de } \mathcal{A}, \text{ mais c'est un idéal de } \mathcal{B}}$$
     *À retenir.* La notion d'idéal dépend de l'anneau ambiant : on multiplie par *tous* ses éléments. Ici, c'est la condition « bornée » qui fait fonctionner le théorème des gendarmes.
- id: "mp-01-16"
  feuille: "f-mp-01"
  numero: 16
  partie: "Compléments sur les anneaux"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [anneaux]
  noeuds: [a-anneau, a-ideal]
  notions: [ideal]
  source: "TD 2 Algèbre générale (Sainte-Geneviève), exercice 2"
  page_enonce: 3
  page_corrige: 8
  enonce: |
    Soit $A$ un anneau tel que, pour tous $x$, $y \in A$, on ait $xy = yx$ ou $xy = -yx$. Montrer que $A$ est commutatif. On pourra constater que, pour tout $x \in A$, les ensembles $\{y \in A \mid xy = yx\}$ et $\{y \in A \mid xy = -yx\}$ sont des sous-groupes de $(A, +)$.
  corrige: |
    Fixons $x \in A$, et notons $C_{x} = \{y \in A \mid xy = yx\}$ et $D_{x} = \{y \in A \mid xy = -yx\}$. Ce sont des sous-groupes de $(A, +)$ : ils contiennent $0$, et si $xy = \pm yx$ et $xy' = \pm y'x$ avec le même signe, alors $x(y - y') = \pm(y - y')x$ avec ce signe. L'hypothèse s'écrit $A = C_{x} \cup D_{x}$.

    Montrons qu'un groupe n'est pas réunion de deux sous-groupes dont aucun ne contient l'autre. Si $c \in C_{x} \setminus D_{x}$ et $d \in D_{x} \setminus C_{x}$, la somme $c + d$ appartient à $C_{x}$ ou à $D_{x}$ ; dans le premier cas $d = (c + d) - c \in C_{x}$, dans le second $c = (c + d) - d \in D_{x}$, ce qui est exclu dans les deux cas. Ainsi l'un des deux sous-groupes contient l'autre, et il est égal à $A$.

    Si $C_{x} = A$, l'élément $x$ commute avec tout $y$. Si $D_{x} = A$, alors $1 \in D_{x}$, soit $x = -x$, c'est-à-dire $2x = 0$ ; pour tout $y$, on a alors $2yx = y(2x) = 0$, donc $-yx = yx$, et $xy = -yx = yx$. Dans les deux cas $x$ commute avec tous les éléments de $A$. 
    $$\boxed{A \text{ est commutatif}}$$
     *Piège.* Le lemme « un groupe n'est pas réunion de deux sous-groupes stricts » est le cœur de l'exercice ; il est faux pour trois sous-groupes, puisque le groupe $(\mathbb{Z}/2\mathbb{Z})^{2}$ est réunion de ses trois sous-groupes d'ordre $2$.
- id: "mp-01-17"
  feuille: "f-mp-01"
  numero: 17
  partie: "Compléments sur les anneaux"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [anneaux]
  noeuds: [a-anneau, a-ideal]
  notions: [ideal]
  source: "TD 2 Algèbre générale (Sainte-Geneviève), exercice 3"
  page_enonce: 3
  page_corrige: 9
  enonce: |
    Soit $A$ un anneau commutatif intègre, et $a_{0}, \dots, a_{n}$ des éléments de $A$, avec $a_{n}$ non nul. Montrer que l'équation $a_{n}x^{n} + \cdots + a_{1}x + a_{0} = 0$, d'inconnue $x \in A$, possède au plus $n$ solutions.
  corrige: |
    Pour $P = a_{n}X^{n} + \cdots + a_{0}$ à coefficients dans $A$, notons $P(x) = a_{n}x^{n} + \cdots + a_{0}$, et raisonnons par récurrence sur $n$. Pour $n = 0$, l'équation $a_{0} = 0$ n'a aucune solution, puisque $a_{0} \neq 0$.

    Soit $n \geqslant 1$, et supposons le résultat vrai au rang $n - 1$. Si l'équation n'a pas de solution, c'est terminé. Sinon, soit $r$ une solution. Comme $A$ est commutatif, $x^{k} - r^{k} = (x - r)\sum_{j=0}^{k-1} x^{j}r^{k-1-j}$, et donc 
    $$P(x) = P(x) - P(r) = \sum_{k=1}^{n} a_{k}\big(x^{k} - r^{k}\big) = (x - r)\,Q(x), \qquad\text{où}\quad Q(x) = \sum_{k=1}^{n} a_{k}\sum_{j=0}^{k-1} x^{j}r^{k-1-j}.$$
     L'expression $Q(x)$ est polynomiale en $x$, de coefficient de $x^{n-1}$ égal à $a_{n} \neq 0$. Si $s \neq r$ est une autre solution, alors $(s - r)Q(s) = 0$ avec $s - r \neq 0$, donc $Q(s) = 0$ puisque $A$ est intègre. L'hypothèse de récurrence dit que $Q$ a au plus $n - 1$ racines. 
    $$\boxed{\text{L'équation possède au plus } n \text{ solutions dans } A}$$
     *Piège.* L'intégrité est indispensable : dans $\mathbb{Z}/8\mathbb{Z}$, l'équation $x^{2} = \overline{1}$, de degré $2$, a les quatre solutions $\overline{1}$, $\overline{3}$, $\overline{5}$ et $\overline{7}$ (exercice 41). Ce résultat sert aux exercices 48 et 70, avec $A = \mathbb{Z}/p\mathbb{Z}$ ou un corps quelconque.
- id: "mp-01-18"
  feuille: "f-mp-01"
  numero: 18
  partie: "Compléments sur les anneaux"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [anneaux]
  noeuds: [a-anneau, a-ideal]
  notions: [ideal]
  source: "TD 2 Algèbre générale (Sainte-Geneviève), exercice 5"
  page_enonce: 3
  page_corrige: 9
  enonce: |
    On dit qu'un élément $x$ d'un anneau $A$ est *nilpotent* s'il existe $n \in \mathbb{N}$ tel que $x^{n} = 0$. Dans toute la suite, $A$ est un anneau et $x$, $y \in A$.

    **1.** Donner un exemple d'élément nilpotent non nul dans un anneau commutatif, et un autre dans un anneau non commutatif.

    **2.** Un anneau est dit *réduit* si $0$ est son seul élément nilpotent. Montrer que tout anneau intègre est réduit, et donner un exemple d'anneau réduit non intègre.

    **3.** **(a)** On suppose $xy$ nilpotent. Montrer que $yx$ l'est.

    **(b)** Trouver un exemple de situation où l'on a, pour un certain $n \in \mathbb{N}$, $(xy)^{n} = 0 \neq (yx)^{n}$.

    **4.** **(a)** On suppose $A$ commutatif et $x$, $y$ nilpotents. Montrer que $xy$ et $x + y$ sont nilpotents.

    **(b)** Donner un exemple de situation où $x$ et $y$ sont nilpotents, mais où ni $xy$ ni $x + y$ ne le sont.
  corrige: |
    **1.** Dans l'anneau commutatif $\mathbb{Z}/4\mathbb{Z}$, la classe $\overline{2}$ est non nulle et $\overline{2}^{2} = \overline{0}$. Dans l'anneau non commutatif $\mathcal{M}_{2}(\mathbb{R})$, la matrice élémentaire $E_{12}$ vérifie $E_{12}^{2} = 0$.

    **2.** Soit $A$ intègre et $x$ nilpotent, avec $x^{n} = 0$. Si $x \neq 0$, alors $x^{k} \neq 0$ pour tout $k$, par récurrence, puisqu'un produit d'éléments non nuls est non nul : c'est absurde, donc $x = 0$. L'anneau produit $\mathbb{Z} \times \mathbb{Z}$ est réduit, car $(a, b)^{n} = (a^{n}, b^{n})$ est nul seulement si $a = b = 0$, et il n'est pas intègre, car $(1, 0)(0, 1) = (0, 0)$. 
    $$\boxed{\text{Intègre} \implies \text{réduit}, \qquad \mathbb{Z} \times \mathbb{Z} \text{ est réduit et non intègre}}$$

    **3.(a)** Si $(xy)^{n} = 0$, alors, par associativité, 
    $$(yx)^{n+1} = y\,(xy)^{n}\,x = 0.$$
     **(b)** Prenons $x = E_{12}$ et $y = E_{11}$ dans $\mathcal{M}_{2}(\mathbb{R})$ : on a $xy = E_{12}E_{11} = 0$ et $yx = E_{11}E_{12} = E_{12} \neq 0$. 
    $$\boxed{(xy)^{1} = 0 \neq (yx)^{1}}$$
     L'exposant ne peut augmenter que d'une unité, comme le montre (a) : ici $(yx)^{2} = 0$.

    **4.(a)** Supposons $x^{p} = 0$ et $y^{q} = 0$. Comme $A$ est commutatif, $(xy)^{p} = x^{p}y^{p} = 0$, et la formule du binôme (chapitre 11 de MPSI) donne 
    $$(x + y)^{p+q-1} = \sum_{k=0}^{p+q-1} \binom{p + q - 1}{k} x^{k}y^{p+q-1-k} = 0,$$
     car dans chaque terme, ou bien $k \geqslant p$, ou bien $p + q - 1 - k \geqslant q$. 
    $$\boxed{xy \text{ et } x + y \text{ sont nilpotents}}$$
     **(b)** Prenons $x = E_{12}$ et $y = E_{21}$, nilpotentes. Alors $xy = E_{11}$ vérifie $(xy)^{k} = E_{11} \neq 0$ pour tout $k \geqslant 1$, et $x + y = \begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}$ a pour carré $I_{2}$, de sorte que ses puissances valent $I_{2}$ ou $x + y$. 
    $$\boxed{E_{12}, E_{21} \text{ nilpotentes}, \quad E_{11} \text{ et } E_{12} + E_{21} \text{ non nilpotentes}}$$
- id: "mp-01-19"
  feuille: "f-mp-01"
  numero: 19
  partie: "Compléments sur les anneaux"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [anneaux]
  noeuds: [a-anneau, a-ideal]
  notions: [ideal]
  source: "TD 2 Algèbre générale (Sainte-Geneviève), exercice 6"
  page_enonce: 4
  page_corrige: 10
  enonce: |
    Soit $A$ un anneau.

    **1.** Soit $x \in A$ nilpotent, au sens de l'exercice 18. Montrer que $1 - x$ est inversible, et exprimer son inverse.

    **2.** Soit $x$, $y \in A$ tels que $xy$ soit nilpotent. Montrer que $yx$ est nilpotent et exprimer $(1 - yx)^{-1}$ en fonction de $(1 - xy)^{-1}$.

    **3.** On ne fait plus d'hypothèse de nilpotence. Soit $x$, $y \in A$. Montrer que si $1 - xy$ est inversible, alors $1 - yx$ l'est aussi.
  corrige: |
    **1.** Soit $x^{n} = 0$. Les éléments $1$ et $x$ commutent, et la factorisation de $1 - x^{n}$ (chapitre 11 de MPSI) donne 
    $$(1 - x)\big(1 + x + \cdots + x^{n-1}\big) = \big(1 + x + \cdots + x^{n-1}\big)(1 - x) = 1 - x^{n} = 1.$$

    $$\boxed{(1 - x)^{-1} = \sum_{k=0}^{n-1} x^{k}}$$
     C'est la série géométrique $\sum x^{k}$, qui s'arrête d'elle-même.

    **2.** L'élément $yx$ est nilpotent par l'exercice 18. En appliquant la question 1 à $yx$, puis en regroupant $(yx)^{k} = y\,(xy)^{k-1}\,x$ pour $k \geqslant 1$, 
    $$(1 - yx)^{-1} = 1 + \sum_{k \geqslant 1} (yx)^{k} = 1 + y\Big(\sum_{j \geqslant 0} (xy)^{j}\Big)x,$$
     toutes les sommes étant finies. 
    $$\boxed{(1 - yx)^{-1} = 1 + y\,(1 - xy)^{-1}\,x}$$

    **3.** Le calcul précédent suggère la formule ; vérifions qu'elle vaut sans nilpotence. Notons $u$ l'inverse de $1 - xy$, de sorte que 
    $$u - xyu = 1 \qquad\text{et}\qquad u - uxy = 1.$$
     Alors 
    $$(1 - yx)(1 + yux) = 1 - yx + y\big(u - xyu\big)x = 1 - yx + yx = 1,$$

    $$(1 + yux)(1 - yx) = 1 - yx + y\big(u - uxy\big)x = 1 - yx + yx = 1.$$

    $$\boxed{1 - xy \text{ inversible} \implies 1 - yx \text{ inversible, d'inverse } 1 + y(1 - xy)^{-1}x}$$
     *À retenir.* Le calcul formel sur des sommes infinies, illégitime en soi, sert ici d'heuristique, et la vérification directe le valide. Avec $x \in \mathcal{M}_{n,p}(\mathbb{K})$ et $y \in \mathcal{M}_{p,n}(\mathbb{K})$, le même calcul montre que $I_{n} - xy$ et $I_{p} - yx$ sont simultanément inversibles, ce que le chapitre 2 retrouvera par les valeurs propres.
- id: "mp-01-20"
  feuille: "f-mp-01"
