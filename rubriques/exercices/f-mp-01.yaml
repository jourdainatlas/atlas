- id: "mp-01-01"
  feuille: "f-mp-01"
  numero: 1
  partie: "Compléments sur les groupes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [groupes, groupes cycliques]
  noeuds: [a-sous-groupe, gf-cycliques]
  notions: [sous-groupe-engendre, ordre-element, groupe-cyclique]
  source: "Algèbre générale (LLG), exercice 16"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $G$ un groupe cyclique de cardinal $n$. Quel est le nombre de sous-groupes de $G$ ?
  corrige: |
    Par le théorème 1, le groupe $G$ est isomorphe à $\mathbb{Z}/n\mathbb{Z}$, et un isomorphisme envoie les sous-groupes de l'un bijectivement sur ceux de l'autre : il suffit de compter les sous-groupes de $\mathbb{Z}/n\mathbb{Z}$. Notons $\pi : \mathbb{Z} \to \mathbb{Z}/n\mathbb{Z}$ la surjection canonique, qui est un morphisme de groupes (proposition 2).

    Si $H$ est un sous-groupe de $\mathbb{Z}/n\mathbb{Z}$, son image réciproque $\pi^{-1}(H)$ est un sous-groupe de $\mathbb{Z}$ qui contient $\mathrm{Ker}\, \pi = n\mathbb{Z}$ ; c'est donc $d\mathbb{Z}$ pour un unique entier $d \geqslant 1$ (chapitre 12 de MPSI), et l'inclusion $n\mathbb{Z} \subset d\mathbb{Z}$ signifie que $d$ divise $n$. Comme $\pi$ est surjective, $H = \pi\big(\pi^{-1}(H)\big) = \pi(d\mathbb{Z})$. Réciproquement, pour tout diviseur $d \geqslant 1$ de $n$, l'image $\pi(d\mathbb{Z})$ est un sous-groupe de $\mathbb{Z}/n\mathbb{Z}$, et son image réciproque est $d\mathbb{Z} + n\mathbb{Z} = d\mathbb{Z}$ : deux diviseurs distincts donnent deux sous-groupes distincts. L'application $d \mapsto \pi(d\mathbb{Z}) = \langle \overline{d} \rangle$ est donc une bijection de l'ensemble des diviseurs positifs de $n$ sur l'ensemble des sous-groupes de $\mathbb{Z}/n\mathbb{Z}$. 
    $$\boxed{\text{Un groupe cyclique de cardinal } n \text{ a autant de sous-groupes que } n \text{ a de diviseurs positifs.}}$$
     Par exemple, $\mathbb{Z}/12\mathbb{Z}$ possède six sous-groupes, engendrés par $\overline{1}$, $\overline{2}$, $\overline{3}$, $\overline{4}$, $\overline{6}$ et $\overline{12} = \overline{0}$ ; le sous-groupe engendré par $\overline{d}$ a $\frac{n}{d}$ éléments. On a même obtenu un peu plus : pour chaque diviseur $m$ de $n$, il existe un unique sous-groupe de cardinal $m$, résultat que l'exercice 70 retournera en une caractérisation des groupes cycliques.
