  enonce: |
    **1.** Montrer que $20^{15} - 1$ est divisible par $11 \times 31 \times 61$.

    **2.** Déterminer le reste de la division de $2^{6754}$ par $1155$.

    **3.** Déterminer les restes de la division de $10^{100}$ par $13$, par $19$, puis par $247 = 13 \times 19$. En déduire que $10^{99} + 1$ est multiple de $247$.
  corrige: |
    **1.** Les nombres $11$, $31$ et $61$ sont premiers et distincts ; il suffit que chacun divise $20^{15} - 1$ (cours, prop. 12).

    • Modulo $11$ : $20 \equiv 9$, $9^{2} \equiv 4$, $9^{4} \equiv 5$, $9^{5} \equiv 45 \equiv 1$, donc $20^{15} \equiv 1$.

    • Modulo $31$ : $20^{2} = 400 \equiv 28$, $20^{3} \equiv 560 \equiv 2$, donc $20^{15} \equiv 2^{5} = 32 \equiv 1$.

    • Modulo $61$ : $20^{3} = 8000 = 131 \times 61 + 9$, et $9^{5} = 59\,049 = 968 \times 61 + 1$, donc $20^{15} \equiv 1$.

    **2.** On a $1155 = 3 \times 5 \times 7 \times 11$. Par le petit théorème de Fermat :

    • $2^{2} \equiv 1 \pmod{3}$ et $6754$ est pair : $2^{6754} \equiv 1$ ;

    • $2^{4} \equiv 1 \pmod{5}$ et $6754 \equiv 2 \pmod{4}$ : $2^{6754} \equiv 4$ ;

    • $2^{3} \equiv 1 \pmod{7}$ et $6754 \equiv 1 \pmod{3}$ : $2^{6754} \equiv 2$ ;

    • $2^{10} \equiv 1 \pmod{11}$ et $6754 \equiv 4 \pmod{10}$ : $2^{6754} \equiv 16 \equiv 5$.

    On résout ce système comme à l'exercice 11 : le reste cherché est $\boxed{709}$. Vérification : 
    $$709 = 236 \times 3 + 1 = 141 \times 5 + 4 = 101 \times 7 + 2 = 64 \times 11 + 5.$$

    **3.** Modulo $13$ : $10^{3} \equiv -1$, donc $10^{6} \equiv 1$, et $10^{100} \equiv 10^{4} \equiv -10 \equiv \boxed{3}$.

    Modulo $19$ : $10^{2} \equiv 5$, $10^{4} \equiv 6$, $10^{8} \equiv 36 \equiv -2$, donc $10^{10} \equiv -10$ ; comme $10^{18} \equiv 1$ (Fermat), $10^{100} \equiv 10^{10} \equiv -10 \equiv \boxed{9}$.

    Dans les deux cas $10^{100} \equiv -10$ : par le lemme chinois, $10^{100} \equiv -10 \equiv \boxed{237} \pmod{247}$. Comme $10$ est premier avec $247$, on peut simplifier $10 \times 10^{99} \equiv 10 \times (-1)$ : $10^{99} \equiv -1$, et $247$ divise $10^{99} + 1$.
- id: "l3-sa-02-13"
  feuille: "f-l3-sa-02"
  numero: 13
  partie: "Lemme chinois"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [lemme chinois, "radical, nilradical"]
  noeuds: [ac-chinois, ga-nilradical]
  notions: [anneau-produit, nilradical, radical-ideal]
  source: "Exo7 (fic00034), exercices 3 et 6"
  page_enonce: 4
  page_corrige: 9
  enonce: |
    **1.** Soit $A$ et $B$ deux anneaux. Décrire les éléments inversibles, les diviseurs de zéro et les éléments nilpotents de l'anneau produit $A \times B$.

    **2.** Démontrer que les anneaux $\mathbb{Z}/72\mathbb{Z} \times \mathbb{Z}/84\mathbb{Z}$ et $\mathbb{Z}/36\mathbb{Z} \times \mathbb{Z}/168\mathbb{Z}$ sont isomorphes.
  corrige: |
    **1.** Les opérations de $A \times B$ se font composante par composante.

    • $(a, b)$ est inversible si et seulement si $a$ et $b$ le sont.

    • $(a, b)$ est nilpotent si et seulement si $a$ et $b$ le sont (prendre le plus grand des deux exposants).

    • Un élément non nul $(a, b)$ est diviseur de zéro si et seulement si $a$ est nul ou diviseur de zéro, ou $b$ est nul ou diviseur de zéro : par exemple $(a, 0)(0, 1) = (0, 0)$.

    En particulier, *un produit de deux anneaux n'est jamais intègre*, car $(1, 0)(0, 1) = (0, 0)$.

    **2.** On décompose les modules en produits de puissances de premiers : $72 = 8 \times 9$, $84 = 4 \times 3 \times 7$, $36 = 4 \times 9$ et $168 = 8 \times 3 \times 7$. Par la prop. 12 du cours, les deux anneaux sont isomorphes à 
    $$\mathbb{Z}/8\mathbb{Z} \times \mathbb{Z}/9\mathbb{Z} \times \mathbb{Z}/4\mathbb{Z} \times \mathbb{Z}/3\mathbb{Z} \times \mathbb{Z}/7\mathbb{Z},$$
     à l'ordre des facteurs près. *Ce sont les mêmes puissances de nombres premiers, réparties autrement.*
