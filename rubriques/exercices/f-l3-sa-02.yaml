  enonce: |
    **1.** Déterminer le polynôme $f \in \mathbb{Q}[X]$ de plus petit degré tel que $f \equiv 2X \pmod{(X - 1)^{2}}$ et $f \equiv 3X \pmod{(X - 2)^{3}}$. Est-il à coefficients entiers ?

    **2.** Déterminer les polynômes $P \in \mathbb{F}_{2}[X]$ tels que $P \equiv X^{2} + 1 \pmod{X^{4} + X^{2} + 1}$ et $P \equiv X \pmod{X^{3} + X}$.
  corrige: |
    **1.** Les polynômes $(X - 1)^{2}$ et $(X - 2)^{3}$ sont premiers entre eux : par le lemme chinois, les solutions forment une classe modulo $(X - 1)^{2}(X - 2)^{3}$, qui contient un unique polynôme de degré $< 5$.

    Cherchons-le sous la forme $f = 3X + (X - 2)^{3}h$, avec $\deg h \leqslant 1$. La congruence modulo $(X - 1)^{2}$ équivaut à $f(1) = 2$ et $f'(1) = 2$.

    • $f(1) = 3 - h(1) = 2$ donne $h(1) = 1$.

    • $f' = 3 + 3(X - 2)^{2}h + (X - 2)^{3}h'$, donc $f'(1) = 3 + 3h(1) - h'(1) = 2$ donne $h'(1) = 4$.

    D'où $h = 4X - 3$ et 
    $$\boxed{f = 3X + (X - 2)^{3}(4X - 3) = 4X^{4} - 27X^{3} + 66X^{2} - 65X + 24}.$$
     C'est le polynôme de plus petit degré, $4$, et il est à coefficients entiers.

    **2.** Dans $\mathbb{F}_{2}[X]$, $X^{4} + X^{2} + 1 = (X^{2} + X + 1)^{2}$ et $X^{3} + X = X(X + 1)^{2}$. Ces polynômes sont premiers entre eux, $X^{2} + X + 1$ étant irréductible et distinct de $X$ et $X + 1$. L'algorithme d'Euclide s'arrête dès la première étape : 
    $$X^{4} + X^{2} + 1 = X \cdot (X^{3} + X) + 1.$$
     D'où la relation de Bézout $1 = (X^{4} + X^{2} + 1) + X(X^{3} + X)$ (en caractéristique $2$, $+$ et $-$ coïncident).

    Une solution est alors 
    $$P_{0} = (X^{2} + 1) \cdot X(X^{3} + X) + X \cdot (X^{4} + X^{2} + 1) = X^{6} + X^{5} + X^{3} + X^{2} + X.$$
     En effet $P_{0} \equiv X^{2} + 1$ modulo $X^{4} + X^{2} + 1$, car $X(X^{3} + X) \equiv 1$, et $P_{0} \equiv X$ modulo $X^{3} + X$, car $X^{4} + X^{2} + 1 \equiv 1$. Les solutions sont les 
    $$\boxed{P \in X^{6} + X^{5} + X^{3} + X^{2} + X + (X^{4} + X^{2} + 1)(X^{3} + X)\,\mathbb{F}_{2}[X]}.$$

