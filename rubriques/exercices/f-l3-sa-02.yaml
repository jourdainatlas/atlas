  enonce: |
    Résoudre dans $\mathbb{Z}$ les systèmes 
    $$\left\{ \begin{array}{l} x \equiv 1 \pmod{3} \\ x \equiv 3 \pmod{5} \\ x \equiv 4 \pmod{7} \\ x \equiv 2 \pmod{11} \end{array} \right. \qquad\text{et}\qquad \left\{ \begin{array}{l} x \equiv 997 \pmod{2001} \\ x \equiv 998 \pmod{2002} \\ x \equiv 999 \pmod{2003} \end{array} \right.$$
     *Pour le second système, on pourra chercher une solution évidente.*
  corrige: |
    **Premier système.** Les modules $3$, $5$, $7$, $11$ sont premiers entre eux deux à deux : par le lemme chinois (cours, prop. 12), il y a une unique solution modulo $1155$. On combine les congruences deux par deux.

    • $x = 1 + 3k \equiv 3 \pmod{5}$ donne $3k \equiv 2$, $k \equiv 4$ : $x \equiv 13 \pmod{15}$.

    • $x = 13 + 15k \equiv 4 \pmod{7}$ donne $6 + k \equiv 4$, $k \equiv 5$ : $x \equiv 88 \pmod{105}$.

    • $x = 88 + 105k \equiv 2 \pmod{11}$ donne $6k \equiv 2$, $k \equiv 4$ : $x \equiv 508 \pmod{1155}$.

    Les solutions sont les $\boxed{x \in 508 + 1155\mathbb{Z}}$.

    **Second système.** On remarque que $997 = 2001 - 1004$, $998 = 2002 - 1004$ et $999 = 2003 - 1004$ : $x = -1004$ est solution.

    Les modules sont premiers entre eux deux à deux : deux entiers consécutifs le sont, et $2001$ et $2003$, impairs, ont un pgcd qui divise leur différence $2$. Les solutions sont donc les $x \equiv -1004$ modulo $N = 2001 \times 2002 \times 2003 = 8\,024\,022\,006$, soit 
    $$\boxed{x \in 8\,024\,021\,002 + N\mathbb{Z}}.$$
