- id: "l3-sa-02-01"
  feuille: "f-l3-sa-02"
  numero: 1
  partie: "Idéaux"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [idéaux, idéaux premiers et maximaux]
  noeuds: [a-ideal, a-premier-maximal]
  notions: [ideal, ideal-principal, ideal-premier, ideal-maximal]
  source: "Exo7 (fic00030), exercices 9 et 11 ; devoir surveillé du 7/11/2014, question de cours 1"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Soit $I = \langle x_{1}, \dots, x_{n} \rangle$ et $J = \langle y_{1}, \dots, y_{m} \rangle$ deux idéaux d'un anneau $A$. Donner des familles génératrices de $I + J$, de $IJ$ et de $I^{2}$.

    **2.** Dans $\mathbb{Z}$, déterminer $n\mathbb{Z} \cap m\mathbb{Z}$, $n\mathbb{Z} + m\mathbb{Z}$ et $(n\mathbb{Z})(m\mathbb{Z})$. Expliciter le cas $n = 12$, $m = 18$.

    **3.** Dans $\mathbb{Q}[X]$, déterminer un générateur unitaire de $I + J$, $I \cap J$ et $IJ$ pour $I = \langle X^{2} - 1 \rangle$ et $J = \langle X^{2} + X \rangle$.

    **4.** Montrer qu'un anneau $A$ est un corps si et seulement si $\langle 0 \rangle$ est un idéal maximal, et si et seulement si tout morphisme d'anneaux de $A$ dans un anneau est injectif.
  corrige: |
    **1.** D'après la prop. 2 du cours, $I + J = \langle x_{1}, \dots, x_{n}, y_{1}, \dots, y_{m} \rangle$.

    Les produits $x_{k}y_{l}$ sont dans $IJ$. Réciproquement, si $x = \mathop{\displaystyle \sum_{k}}a_{k}x_{k} \in I$ et $y = \mathop{\displaystyle \sum_{l}}b_{l}y_{l} \in J$, alors $xy = \mathop{\displaystyle \sum_{k, l}}a_{k}b_{l}\,x_{k}y_{l}$, et $IJ$, formé des sommes de tels produits, est contenu dans l'idéal engendré par les $x_{k}y_{l}$. Ainsi $\boxed{IJ = \langle x_{k}y_{l} ; 1 \leqslant k \leqslant n, 1 \leqslant l \leqslant m \rangle}$.

    En particulier $I^{2} = \langle x_{k}x_{l} ; 1 \leqslant k \leqslant l \leqslant n \rangle$.

    **2.** Un entier est dans $n\mathbb{Z} \cap m\mathbb{Z}$ si et seulement s'il est multiple commun de $n$ et $m$, d'où $n\mathbb{Z} \cap m\mathbb{Z} = \mathrm{ppcm}(n, m)\mathbb{Z}$.

    L'idéal $n\mathbb{Z} + m\mathbb{Z}$ est de la forme $d\mathbb{Z}$ (cours, prop. 4) ; $d$ divise $n$ et $m$, et, comme $d = nu + mv$, tout diviseur commun de $n$ et $m$ divise $d$ : $n\mathbb{Z} + m\mathbb{Z} = (n \wedge m)\mathbb{Z}$. C'est le théorème de Bézout.

    Enfin $(n\mathbb{Z})(m\mathbb{Z}) = nm\mathbb{Z}$ par la question 1.

    Pour $n = 12$ et $m = 18$ : $12\mathbb{Z} \cap 18\mathbb{Z} = 36\mathbb{Z}$, $12\mathbb{Z} + 18\mathbb{Z} = 6\mathbb{Z}$ et $(12\mathbb{Z})(18\mathbb{Z}) = 216\mathbb{Z}$. On remarque que $216 = 36 \times 6$ : ici $IJ = (I + J)(I \cap J)$, ce que l'exercice 3 éclaire.

    **3.** Écrivons $X^{2} - 1 = (X - 1)(X + 1)$ et $X^{2} + X = X(X + 1)$. Comme dans $\mathbb{Z}$, l'idéal $\langle P \rangle + \langle Q \rangle$ est engendré par le pgcd unitaire de $P$ et $Q$, et $\langle P \rangle \cap \langle Q \rangle$ par leur ppcm unitaire (même démonstration, avec la prop. 4 du cours). D'où 
    $$I + J = \langle X + 1 \rangle, \qquad I \cap J = \langle X^{3} - X \rangle, \qquad IJ = \langle X(X - 1)(X + 1)^{2} \rangle.$$

    **4.** Si $A$ est un corps, ses seuls idéaux sont $\{0\}$ et $A$ (cours, prop. 1), donc $\langle 0 \rangle$ est maximal. Réciproquement, si $\langle 0 \rangle$ est maximal, $A \simeq A/\langle 0 \rangle$ est un corps (cours, th. 4).

    Si $A$ est un corps, tout morphisme d'anneaux défini sur $A$ est injectif (chapitre 1, prop. 16).

    Réciproquement, supposons que $a \neq 0$ ne soit pas inversible. Alors $\langle a \rangle \neq A$, et la surjection canonique $A \to A/\langle a \rangle$ est un morphisme d'anneaux non injectif, puisqu'elle envoie $a$ sur $0$. Si tout morphisme défini sur $A$ est injectif, tout élément non nul est donc inversible.
- id: "l3-sa-02-02"
  feuille: "f-l3-sa-02"
  numero: 2
  partie: "Idéaux"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [idéaux, "radical, nilradical", idéaux premiers et maximaux]
  noeuds: [a-ideal, ga-nilradical, a-premier-maximal]
  notions: [ideal, ideal-principal, nilradical, radical-ideal, ideal-premier, ideal-maximal]
  source: "Exo7 (fic00030), exercices 8 et 10 ; ENS Lyon, TD 3 (2016-17), exercice 3"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Déterminer les éléments inversibles, les diviseurs de zéro et les éléments nilpotents de $\mathbb{Z}/360\mathbb{Z}$, puis de $\mathbb{Z}/n\mathbb{Z}$, $n \geqslant 2$.

    **2.** Soit $x$ un élément nilpotent d'un anneau $A$. Montrer que $1 + x$ est inversible ; plus généralement, que $u + x$ est inversible pour tout $u \in A^{\times}$.

    **3.** Déterminer les radicaux des idéaux de $\mathbb{Z}$ et de $\mathbb{C}[X]$.

    **4.** Montrer que le *nilradical* $\sqrt{\langle 0 \rangle}$ de $A$ est contenu dans l'intersection des idéaux premiers de $A$, et que $\sqrt{I}$ est contenu dans l'intersection des idéaux premiers qui contiennent $I$.

    **5.** Réciproquement, soit $I \neq A$ un idéal et $a \notin \sqrt{I}$. Montrer, à l'aide du lemme de Zorn, que l'ensemble des idéaux qui contiennent $I$ et ne contiennent aucune puissance $a^{n}$, $n \geqslant 1$, a un élément maximal $\mathfrak{p}$, puis que $\mathfrak{p}$ est premier. En déduire que $\sqrt{I}$ est l'intersection des idéaux premiers qui contiennent $I$.
  corrige: |
    **1.** Écrivons $n = p_{1}^{a_{1}}\cdots p_{r}^{a_{r}}$. Dans $\mathbb{Z}/n\mathbb{Z}$ :

    • $\overline{k}$ est inversible si et seulement si $k \wedge n = 1$ : il y a $\varphi(n)$ inversibles (chapitre 1, prop. 12) ;

    • toute autre classe non nulle est diviseur de zéro : si $d = k \wedge n > 1$, alors $\overline{k} \cdot \overline{n/d} = \overline{0}$ avec $\overline{n/d} \neq \overline{0}$ ;

    • $\overline{k}$ est nilpotent si et seulement si $p_{1}\cdots p_{r}$ divise $k$. En effet, si $k^{N} \equiv 0 \pmod{n}$, chaque $p_{i}$ divise $k^{N}$, donc $k$ ; inversement, si $p_{1}\cdots p_{r} \mid k$, alors $n \mid k^{N}$ pour $N = \mathop{\displaystyle \max} a_{i}$.

    Pour $n = 360 = 2^{3} \times 3^{2} \times 5$, il y a $\varphi(360) = 96$ inversibles, $360 - 1 - 96 = \boxed{263}$ diviseurs de zéro, et les nilpotents sont les $\boxed{12}$ multiples de $\overline{30}$.

    **2.** Si $x^{n} = 0$, alors 
    $$(1 + x)\big(1 - x + x^{2} - \cdots + (-1)^{n - 1}x^{n - 1}\big) = 1 + (-1)^{n - 1}x^{n} = 1,$$
     donc $1 + x$ est inversible : c'est la série géométrique, qui s'arrête.

    Pour $u \in A^{\times}$, $u + x = u(1 + u^{-1}x)$, et $u^{-1}x$ est nilpotent car $A$ est commutatif : $u + x$ est inversible.

    **3.** Pour $n = p_{1}^{a_{1}}\cdots p_{r}^{a_{r}} \geqslant 2$, la question 1 donne $\sqrt{n\mathbb{Z}} = p_{1}\cdots p_{r}\mathbb{Z}$ ; de plus $\sqrt{\mathbb{Z}} = \mathbb{Z}$ et $\sqrt{\langle 0 \rangle} = \langle 0 \rangle$.

    Dans $\mathbb{C}[X]$, soit $P = c\mathop{\displaystyle \prod_{i}}(X - \alpha_{i})^{m_{i}}$, les $\alpha_{i}$ distincts. Une puissance de $Q$ est multiple de $P$ si et seulement si chaque $\alpha_{i}$ est racine de $Q$ : $\sqrt{\langle P \rangle} = \langle \mathop{\displaystyle \prod_{i}}(X - \alpha_{i}) \rangle$. *Le radical efface les multiplicités*, comme dans $\mathbb{Z}$.

    **4.** Soit $\mathfrak{p}$ un idéal premier et $x$ tel que $x^{n} \in \mathfrak{p}$. Par récurrence, de $x \cdot x^{n - 1} \in \mathfrak{p}$ on tire $x \in \mathfrak{p}$ ou $x^{n - 1} \in \mathfrak{p}$, et finalement $x \in \mathfrak{p}$.

    Ainsi un nilpotent, dont une puissance est $0 \in \mathfrak{p}$, est dans tout idéal premier. De même, si $a^{n} \in I \subset \mathfrak{p}$, alors $a \in \mathfrak{p}$.

    **5.** Soit $\mathcal{E}$ l'ensemble des idéaux $J \supset I$ qui ne contiennent aucune puissance $a^{n}$, $n \geqslant 1$.

    $\triangleright$ *$\mathcal{E}$ a un élément maximal.* $\mathcal{E}$ contient $I$, puisque $a \notin \sqrt{I}$. La réunion d'une chaîne d'éléments de $\mathcal{E}$ est un idéal (deux éléments sont dans un même idéal de la chaîne), qui contient $I$ et aucune puissance de $a$. L'ensemble $\mathcal{E}$, ordonné par l'inclusion, est inductif : le lemme de Zorn fournit un élément maximal $\mathfrak{p}$.

    $\triangleright$ *$\mathfrak{p}$ est premier.* On a $\mathfrak{p} \neq A$, sinon $a \in \mathfrak{p}$. Soit $x$, $y \notin \mathfrak{p}$. Les idéaux $\mathfrak{p} + \langle x \rangle$ et $\mathfrak{p} + \langle y \rangle$ contiennent strictement $\mathfrak{p}$, donc ne sont pas dans $\mathcal{E}$ : il existe $n$, $m$ tels que $a^{n} = p_{1} + rx$ et $a^{m} = p_{2} + sy$, avec $p_{1}$, $p_{2} \in \mathfrak{p}$. En multipliant, 
    $$a^{n + m} = \underbrace{p_{1}p_{2} + p_{1}sy + p_{2}rx}_{\in\,\mathfrak{p}} + rs\,xy.$$
     Si l'on avait $xy \in \mathfrak{p}$, on aurait $a^{n + m} \in \mathfrak{p}$, ce qui est exclu. Donc $xy \notin \mathfrak{p}$.

    $\triangleright$ *Conclusion.* Tout $a \notin \sqrt{I}$ est hors d'un idéal premier contenant $I$ : l'intersection de ces idéaux premiers est contenue dans $\sqrt{I}$. Avec la question 4, 
    $$\boxed{\sqrt{I} = \bigcap_{\mathfrak{p} \text{ premier},\ \mathfrak{p} \supset I}\mathfrak{p}}.$$
     Pour $I = \langle 0 \rangle$, *le nilradical est l'intersection de tous les idéaux premiers*. On retrouve sur $\mathbb{Z}/12\mathbb{Z}$ : $\sqrt{\langle \overline{0} \rangle} = \langle \overline{6} \rangle = \langle \overline{2} \rangle \cap \langle \overline{3} \rangle$ (voir la figure de l'exercice 6).
- id: "l3-sa-02-03"
  feuille: "f-l3-sa-02"
  numero: 3
