  page_corrige: 5
  enonce: |
    **1.** Soit $B$ un sous-anneau de $A$ et $I \neq A$ un idéal de $A$. Montrer que $B \cap I$ est un idéal de $B$, que $B + I = \{b + i ; b \in B, i \in I\}$ est un sous-anneau de $A$ dont $I$ est un idéal, et que 
    $$B/(B \cap I) \simeq (B + I)/I.$$
     *On pourra composer l'inclusion $B \to B + I$ et la surjection canonique $B + I \to (B + I)/I$.*

    **2.** Soit $m \geqslant 2$ et $f \in \mathbb{Z}[X]$. On note $\bar{f}$ la réduction de $f$ modulo $m$, dans $(\mathbb{Z}/m\mathbb{Z})[X]$. Montrer que la réduction $r_{m} : \mathbb{Z}[X] \to (\mathbb{Z}/m\mathbb{Z})[X]$ est un morphisme surjectif de noyau $m\mathbb{Z}[X]$, puis, à l'aide de la proposition 7 du cours, que 
    $$\mathbb{Z}[X]/\langle m, f \rangle \simeq (\mathbb{Z}/m\mathbb{Z})[X]/\langle \bar{f} \rangle.$$

    **3.** Soit $p$ un nombre premier et $f \in \mathbb{Z}[X]$ tel que $\bar{f}$ soit irréductible dans $\mathbb{F}_{p}[X]$. Montrer que $\langle p, f \rangle$ est un idéal maximal de $\mathbb{Z}[X]$. Décrire $\mathbb{Z}[X]/\langle 2, X^{2} + X + 1 \rangle$ et $\mathbb{Z}[X]/\langle 3, X^{2} + 1 \rangle$.
  corrige: |
    **1.** *Structures.* $B \cap I$ est un sous-groupe de $B$, et, pour $b \in B$ et $i \in B \cap I$, $bi \in B$ et $bi \in I$ : c'est un idéal de $B$.

    L'ensemble $B + I$ contient $1 = 1 + 0$ et est stable par différence ; il l'est par produit, car 
    $$(b + i)(b' + i') = bb' + (bi' + ib' + ii'), \quad bb' \in B, \ bi' + ib' + ii' \in I.$$
     C'est un sous-anneau de $A$, dont $I$ est un idéal, distinct de $B + I$ puisque $1 \notin I$.

    *Isomorphisme.* Le morphisme $\psi : B \to (B + I)/I$, $b \mapsto \overline{b}$, est surjectif, car $\overline{b + i} = \overline{b}$. Son noyau est $B \cap I$, qui est distinct de $B$. Le th. 2 du cours donne $B/(B \cap I) \simeq (B + I)/I$.

    **2.** La réduction $r_{m}$ réduit chaque coefficient. Elle est compatible à la somme et au produit, car les coefficients d'un produit sont des sommes de produits de coefficients. Elle est surjective, et son noyau est formé des polynômes dont tous les coefficients sont multiples de $m$, c'est-à-dire $m\mathbb{Z}[X] = \langle m \rangle$.

    On applique la deuxième propriété de la prop. 7 du cours à $r_{m}$ et à $I = \langle f \rangle$. D'une part $I + \mathrm{Ker}\, r_{m} = \langle f \rangle + \langle m \rangle = \langle m, f \rangle$. D'autre part, $r_{m}$ étant surjectif, $r_{m}(\langle f \rangle) = \langle \bar{f} \rangle$. D'où, lorsque $\langle \bar{f} \rangle \neq (\mathbb{Z}/m\mathbb{Z})[X]$ (sinon les deux quotients sont nuls), 
    $$\boxed{\mathbb{Z}[X]/\langle m, f \rangle \simeq (\mathbb{Z}/m\mathbb{Z})[X]/\langle \bar{f} \rangle}.$$

    **3.** Si $\bar{f}$ est irréductible, $\mathbb{F}_{p}[X]/\langle \bar{f} \rangle$ est un corps (cours, prop. 8), donc $\mathbb{Z}[X]/\langle p, f \rangle$ aussi, et $\langle p, f \rangle$ est maximal (th. 4).

    Le polynôme $X^{2} + X + 1$ n'a pas de racine dans $\mathbb{F}_{2}$ ; de degré $2$, il est irréductible, et $\mathbb{Z}[X]/\langle 2, X^{2} + X + 1 \rangle$ est le corps à $4$ éléments $\mathbb{F}_{2}[X]/\langle X^{2} + X + 1 \rangle$ du cours.

    De même, $X^{2} + 1$ n'a pas de racine dans $\mathbb{F}_{3}$, et $\mathbb{Z}[X]/\langle 3, X^{2} + 1 \rangle$ est un corps à $9$ éléments : c'est le corps $\mathbb{F}_{3}[\mathrm{i}]$ de la feuille 1 (exercice 18).
- id: "l3-sa-02-08"
  feuille: "f-l3-sa-02"
  numero: 8
