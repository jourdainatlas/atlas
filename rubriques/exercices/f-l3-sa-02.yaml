  enonce: |
    **1.** Déterminer la structure des anneaux quotients 
    $$\mathbb{F}_{2}[X]/\langle X^{3} + X^{2} + X + 1 \rangle, \qquad \mathbb{Z}[X]/\langle X^{2} - 1 \rangle, \qquad \mathbb{Q}[X]/\langle X^{8} - 1 \rangle.$$

    **2.** Soit $K$ un corps, $f$ et $g$ deux polynômes unitaires irréductibles distincts de $K[X]$, $n$, $m \geqslant 1$, et $R = K[X]/\langle f^{n}g^{m} \rangle$. Décrire les diviseurs de zéro et les éléments nilpotents de $R$, puis tous ses idéaux.

    **3.** On suppose $K$ fini à $q$ éléments. Déterminer le nombre d'éléments inversibles de $R$. Généraliser à $K[X]/\langle f_{1}^{n_{1}}\cdots f_{r}^{n_{r}} \rangle$, où $f_{1}, \dots, f_{r}$ sont unitaires, irréductibles et deux à deux distincts.
  corrige: |
    **1.** On traite les trois quotients l'un après l'autre.

    $\triangleright$ *$\mathbb{F}_{2}[X]/\langle X^{3} + X^{2} + X + 1 \rangle$.* En caractéristique $2$, $X^{3} + X^{2} + X + 1 = (X + 1)(X^{2} + 1) = (X + 1)^{3}$ : le lemme chinois ne décompose rien. En posant $Y = X + 1$, on obtient $\mathbb{F}_{2}[Y]/\langle Y^{3} \rangle$, à $8$ éléments $a + bY + cY^{2}$ ; les $4$ éléments tels que $a = 0$ sont nilpotents, les $4$ autres sont inversibles (exercice 2).

    $\triangleright$ *$\mathbb{Z}[X]/\langle X^{2} - 1 \rangle$.* Soit $\varphi : P \mapsto (P(1), P(-1))$, de $\mathbb{Z}[X]$ dans $\mathbb{Z} \times \mathbb{Z}$.

    • Son noyau est $\langle X^{2} - 1 \rangle$ : en divisant par ce polynôme unitaire, $P = Q(X^{2} - 1) + a + bX$, et $a + b = a - b = 0$ impose $a = b = 0$.

    • Son image est $\Lambda = \{(m, n) ; m \equiv n \pmod{2}\}$. En effet, $P(1) - P(-1)$ est le double de la somme des coefficients d'indice impair ; réciproquement, $(m, n) \in \Lambda$ est l'image de $\dfrac{m + n}{2} + \dfrac{m - n}{2}X$.

    Ainsi $\mathbb{Z}[X]/\langle X^{2} - 1 \rangle \simeq \Lambda$, sous-anneau strict de $\mathbb{Z} \times \mathbb{Z}$. *Ce n'est pas $\mathbb{Z} \times \mathbb{Z}$* : le lemme chinois ne s'applique pas, car $\langle X - 1 \rangle + \langle X + 1 \rangle$ contient $2$ et est égal à $\langle 2, X + 1 \rangle \neq \mathbb{Z}[X]$. D'ailleurs $\Lambda$ n'a que $(0, 0)$ et $(1, 1)$ comme éléments $e$ tels que $e^{2} = e$, alors que $\mathbb{Z} \times \mathbb{Z}$ a aussi $(1, 0)$.

    1.5em

    ![Figure](documents/figures/d9fd4195eb08987e.svg)

    L'image de $\varphi$ forme un damier : c'est un sous-anneau d'indice $2$ de $\mathbb{Z} \times \mathbb{Z}$, qui ne contient pas $(1, 0)$. On « voit » ainsi que $\mathbb{Z}[X]/\langle X^{2} - 1 \rangle$ n'est pas le produit $\mathbb{Z} \times \mathbb{Z}$.

    $\triangleright$ *$\mathbb{Q}[X]/\langle X^{8} - 1 \rangle$.* On a $X^{8} - 1 = (X - 1)(X + 1)(X^{2} + 1)(X^{4} + 1)$. Ces facteurs sont premiers entre eux deux à deux, puisque $X^{8} - 1$ a huit racines complexes distinctes. Le lemme chinois (cours, prop. 11) donne 
    $$\mathbb{Q}[X]/\langle X^{8} - 1 \rangle \simeq \mathbb{Q} \times \mathbb{Q} \times \mathbb{Q}[X]/\langle X^{2} + 1 \rangle \times \mathbb{Q}[X]/\langle X^{4} + 1 \rangle.$$
     Le troisième facteur est un corps ($X^{2} + 1$ est irréductible sur $\mathbb{Q}$), le quatrième aussi, $X^{4} + 1$ étant irréductible sur $\mathbb{Q}$ (cours, chapitre 5) : c'est un produit de quatre corps.

    **2.** Les polynômes $f$ et $g$, irréductibles et distincts, sont premiers entre eux, donc $f^{n}$ et $g^{m}$ aussi (exercice 3). Le lemme chinois donne 
    $$R \simeq K[X]/\langle f^{n} \rangle \times K[X]/\langle g^{m} \rangle.$$
     Dans $K[X]/\langle f^{n} \rangle$, la classe de $P$ est inversible si $f \nmid P$ (Bézout), nilpotente si $f \mid P$. Avec l'exercice 13, la classe de $P$ dans $R$ est donc :

    • inversible si et seulement si $f \nmid P$ et $g \nmid P$ ;

    • nilpotente si et seulement si $fg$ divise $P$ ;

    • diviseur de zéro si et seulement si elle est non nulle et $f \mid P$ ou $g \mid P$.

    Les idéaux de $R$ sont les $\langle \overline{f^{a}g^{b}} \rangle$, $0 \leqslant a \leqslant n$ et $0 \leqslant b \leqslant m$ (exercice 6) : il y en a $(n + 1)(m + 1)$.

    **3.** Soit $d = \deg f$. L'anneau $K[X]/\langle f^{n} \rangle$ a $q^{nd}$ éléments (cours, prop. 6) ; les non inversibles sont les classes des multiples $fQ$, $\deg Q < (n - 1)d$, au nombre de $q^{(n - 1)d}$. Il a donc $q^{(n - 1)d}(q^{d} - 1)$ inversibles. Pour $R$, avec $e = \deg g$, 
    $$|R^{\times}| = q^{(n - 1)d}(q^{d} - 1) \cdot q^{(m - 1)e}(q^{e} - 1).$$
     En général, $\big|\big(K[X]/\langle f_{1}^{n_{1}}\cdots f_{r}^{n_{r}} \rangle\big)^{\times}\big| = \mathop{\displaystyle \prod_{i = 1}^{r}}q^{(n_{i} - 1)d_{i}}(q^{d_{i}} - 1)$, avec $d_{i} = \deg f_{i}$. *C'est l'analogue exact de la formule $\varphi(n) = \mathop{\displaystyle \prod} p_{i}^{a_{i} - 1}(p_{i} - 1)$*, $q^{d_{i}}$ jouant le rôle de $p_{i}$.
