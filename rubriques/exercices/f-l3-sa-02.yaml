  source: "Exo7 (fic00030), exercice 12 ; examen du 15/12/2014, exercice 5 (a) et (c) ; Exo7 (fic00034), exercice 1"
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Soit $I$ et $J$ deux idéaux d'un anneau $A$.

    **1.** Montrer que $(I + J)(I \cap J) \subset IJ \subset I \cap J$. En déduire, sans utiliser le cours, que $IJ = I \cap J$ si $I$ et $J$ sont étrangers. *On pourra d'abord montrer qu'il existe $a \in I$ et $b \in J$ tels que $a + b = 1$.*

    **2.** On suppose $I$ et $J$ étrangers. Montrer que $I^{n}$ et $J^{m}$ sont étrangers pour tous $n$, $m \geqslant 1$.

    **3.** Soit $a$, $b \in \mathbb{Z}$, ou $a$, $b \in K[X]$ avec $K$ un corps. Montrer que $\langle a \rangle$ et $\langle b \rangle$ sont étrangers si et seulement si $a$ et $b$ sont premiers entre eux.

    **4.** Donner deux idéaux de $\mathbb{Z}$ tels que $IJ \neq I \cap J$.
  corrige: |
    **1.** L'inclusion $IJ \subset I \cap J$ est dans la prop. 3 du cours.

    L'idéal $(I + J)(I \cap J)$ est engendré par les produits $(x + y)z$, avec $x \in I$, $y \in J$ et $z \in I \cap J$. Or $xz \in IJ$, car $x \in I$ et $z \in J$, et $yz = zy \in IJ$, car $z \in I$ et $y \in J$ : d'où $(I + J)(I \cap J) \subset IJ$.

    Si $I + J = A$, cela donne $I \cap J = A(I \cap J) \subset IJ$, donc $IJ = I \cap J$. On peut aussi suivre l'indication : si $a + b = 1$, tout $z \in I \cap J$ s'écrit $z = az + zb$, somme de deux éléments de $IJ$.

    **2.** Écrivons $1 = a + b$, $a \in I$, $b \in J$. La formule du binôme donne 
    $$1 = (a + b)^{n + m - 1} = \sum_{k = 0}^{n + m - 1}\binom{n + m - 1}{k}a^{k}b^{n + m - 1 - k}.$$
     Dans chaque terme, ou bien $k \geqslant n$ et le terme est dans $I^{n}$, ou bien $k \leqslant n - 1$, donc $n + m - 1 - k \geqslant m$, et le terme est dans $J^{m}$. Ainsi $1 \in I^{n} + J^{m}$.

    **3.** D'après l'exercice 1, $\langle a \rangle + \langle b \rangle = \langle d \rangle$, où $d$ est le pgcd de $a$ et $b$. Les idéaux sont étrangers si et seulement si $\langle d \rangle = A$, c'est-à-dire si $d$ est inversible : $a$ et $b$ sont premiers entre eux. *C'est le théorème de Bézout, lu en termes d'idéaux* ; le chapitre 3 l'étend à tous les anneaux principaux.

    **4.** Avec $I = 4\mathbb{Z}$ et $J = 6\mathbb{Z}$, $IJ = 24\mathbb{Z}$ et $I \cap J = 12\mathbb{Z}$. La question 1 explique l'écart : ici $(I + J)(I \cap J) = 2\mathbb{Z} \cdot 12\mathbb{Z} = 24\mathbb{Z} = IJ$, et c'est le facteur $I + J = 2\mathbb{Z} \neq \mathbb{Z}$ qui fait la différence.
- id: "l3-sa-02-04"
  feuille: "f-l3-sa-02"
  numero: 4
  partie: "Anneaux quotients"
  etoiles: 1
  types: [Calcul]
  mots_cles: [anneaux quotients, idéaux premiers et maximaux]
  noeuds: [a-anneau-quotient, a-premier-maximal]
  notions: [ideal, ideal-premier, ideal-maximal]
  source: "Exo7 (fic00032), exercice 6"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $A$ un anneau. Déterminer, à isomorphisme près, les anneaux quotients 
    $$A[X]/\langle X \rangle, \qquad A[X, Y]/\langle X \rangle, \qquad A[X, Y]/\langle X, Y \rangle, \qquad A[X_{1}, \dots, X_{n}]/\langle X_{1}, \dots, X_{n} \rangle.$$
     *On pourra utiliser des morphismes d'évaluation.* À quelle condition sur $A$ ces idéaux sont-ils premiers ? maximaux ?
  corrige: |
    $\triangleright$ *$A[X]/\langle X \rangle$.* L'évaluation $P \mapsto P(0)$ est un morphisme surjectif de $A[X]$ sur $A$. Son noyau est $\langle X \rangle$ : si $P(0) = 0$, $P$ n'a pas de terme constant, donc $P = XQ$. Par le th. 2 du cours, $\boxed{A[X]/\langle X \rangle \simeq A}$.

    $\triangleright$ *$A[X, Y]/\langle X \rangle$.* On applique ce qui précède à l'anneau $A[Y]$, puisque $A[X, Y] = A[Y][X]$ : $P(X, Y) \mapsto P(0, Y)$ donne $\boxed{A[X, Y]/\langle X \rangle \simeq A[Y]}$.

    $\triangleright$ *$A[X, Y]/\langle X, Y \rangle$.* Le morphisme $P \mapsto P(0, 0)$ est surjectif sur $A$. Si $P(0, 0) = 0$, on écrit $P = P(0, Y) + XQ_{1}$, puis $P(0, Y) = P(0, 0) + YQ_{2} = YQ_{2}$ : $P \in \langle X, Y \rangle$. Réciproquement, $\langle X, Y \rangle$ est dans le noyau. Donc $\boxed{A[X, Y]/\langle X, Y \rangle \simeq A}$.

    $\triangleright$ *$n$ variables.* Par récurrence, de la même façon, $\boxed{A[X_{1}, \dots, X_{n}]/\langle X_{1}, \dots, X_{n} \rangle \simeq A}$.

    $\triangleright$ *Premiers, maximaux.* Par le th. 4 du cours :

    • $\langle X \rangle$ est premier dans $A[X]$ si et seulement si $A$ est intègre, et maximal si et seulement si $A$ est un corps ; de même pour $\langle X_{1}, \dots, X_{n} \rangle$ ;

    • $\langle X \rangle$ est premier dans $A[X, Y]$ si et seulement si $A[Y]$ est intègre, c'est-à-dire si $A$ est intègre (le coefficient dominant d'un produit est le produit des coefficients dominants) ; il n'est *jamais* maximal, car $Y$ n'est pas inversible dans $A[Y]$.
- id: "l3-sa-02-05"
  feuille: "f-l3-sa-02"
  numero: 5
  partie: "Anneaux quotients"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [anneaux quotients, idéaux premiers et maximaux]
  noeuds: [a-anneau-quotient, a-premier-maximal]
  notions: [ideal, ideal-premier, ideal-maximal]
  source: "Exo7 (fic00032), exercice 7"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $d \in \mathbb{Z}$ qui n'est pas un carré et $\sqrt{d}$ une racine carrée complexe de $d$. On note $\mathbb{Z}[\sqrt{d}]$ l'anneau $\{a + b\sqrt{d} ; a, b \in \mathbb{Z}\}$.

    **1.** Montrer que $\mathbb{Z}[\sqrt{d}] \simeq \mathbb{Z}[X]/\langle X^{2} - d \rangle$.

    **2.** Soit $m \in \mathbb{Z}$ non nul. Montrer que l'anneau quotient $\mathbb{Z}[\sqrt{d}]/\langle m \rangle$ a $m^{2}$ éléments.

    **3.** L'idéal $\langle 2 \rangle$ est-il premier dans $\mathbb{Z}[\sqrt{d}]$ ?
  corrige: |
    *Préliminaire.* Comme $d$ n'est pas un carré, $\sqrt{d} \notin \mathbb{Q}$ : une racine rationnelle de $X^{2} - d$ serait entière. L'écriture $a + b\sqrt{d}$, $a$, $b \in \mathbb{Q}$, est donc unique.

    **1.** Le morphisme $\varphi : P \mapsto P(\sqrt{d})$ de $\mathbb{Z}[X]$ dans $\mathbb{C}$ a pour image $\mathbb{Z}[\sqrt{d}]$, puisque $\sqrt{d}^{\,2} = d$. Son noyau contient $X^{2} - d$.

    Réciproquement, si $P(\sqrt{d}) = 0$, la division par le polynôme unitaire $X^{2} - d$ donne 
    $$P = Q(X^{2} - d) + a + bX, \qquad a, b \in \mathbb{Z},$$
     et $a + b\sqrt{d} = 0$ impose $a = b = 0$. Ainsi $\mathrm{Ker}\,\varphi = \langle X^{2} - d \rangle$, et le th. 2 du cours conclut.

    **2.** Divisons $a$ et $b$ par $m$ : $a = mq + a'$ et $b = mr + b'$, avec $0 \leqslant a', b' < |m|$. Alors $a + b\sqrt{d} \equiv a' + b'\sqrt{d}$ modulo $\langle m \rangle$ : chaque classe contient un élément de 
    $$C = \{a' + b'\sqrt{d} ; 0 \leqslant a', b' < |m|\}.$$
     Si deux éléments de $C$ sont congrus, leur différence $(a' - a'') + (b' - b'')\sqrt{d}$ est de la forme $m(c + e\sqrt{d})$. Par unicité des coordonnées, $m$ divise $a' - a''$ et $b' - b''$, qui sont donc nuls. Le quotient a ainsi $\boxed{m^{2}}$ éléments.

    1.5em

    ![Figure](documents/figures/d3431db8f2eef939.svg)

    La figure traite le cas $d = -1$, $m = 3$ : l'idéal $\langle 3 \rangle$ de $\mathbb{Z}[\mathrm{i}]$ est le réseau de pas $3$, et le carré bleu en contient un domaine fondamental, formé de $9$ représentants, un par classe.

    **3.** L'idéal $\langle 2 \rangle$ n'est jamais premier. Un élément $c + e\sqrt{d}$ est dans $\langle 2 \rangle$ si et seulement si $c$ et $e$ sont pairs.

    • Si $d$ est pair, $\sqrt{d} \cdot \sqrt{d} = d \in \langle 2 \rangle$, mais $\sqrt{d} \notin \langle 2 \rangle$.

    • Si $d$ est impair, $(1 + \sqrt{d})^{2} = (1 + d) + 2\sqrt{d} \in \langle 2 \rangle$, mais $1 + \sqrt{d} \notin \langle 2 \rangle$.

    Dans les deux cas, le quotient à $4$ éléments contient un nilpotent non nul.
- id: "l3-sa-02-06"
  feuille: "f-l3-sa-02"
  numero: 6
  partie: "Anneaux quotients"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [anneaux quotients]
  noeuds: [a-anneau-quotient]
  notions: [ideal]
  source: "Exo7 (fic00032), exercice 9"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $A$ l'anneau $\mathbb{Z}$, ou l'anneau $K[X]$ avec $K$ un corps.

    **1.** Soit $I \neq A$ un idéal de $A$. Montrer que tous les idéaux de $A/I$ sont principaux.

    **2.** Déterminer tous les idéaux de $\mathbb{Z}/n\mathbb{Z}$, puis de $\mathbb{Q}[X]/\langle f \rangle$, où $f$ est un polynôme non constant. Expliciter les idéaux de $\mathbb{Z}/12\mathbb{Z}$.

    **3.** Déterminer les idéaux maximaux de $\mathbb{Z}/n\mathbb{Z}$ et de $\mathbb{Q}[X]/\langle f \rangle$.
  corrige: |
    **1.** Par le th. 3 du cours, les idéaux de $A/I$ sont les $\pi(J)$, où $J$ est un idéal de $A$ contenant $I$. Un tel $J$ s'écrit $\langle a \rangle$ (cours, prop. 4), et $\pi(J) = \langle \pi(a) \rangle$ est principal.

    **2.** Les idéaux de $\mathbb{Z}$ qui contiennent $n\mathbb{Z}$ sont les $d\mathbb{Z}$, $d \geqslant 1$ divisant $n$. Les idéaux de $\mathbb{Z}/n\mathbb{Z}$ sont donc les $\boxed{\langle \overline{d} \rangle}$, *un par diviseur positif $d$ de $n$*, et $\langle \overline{d} \rangle$ a $n/d$ éléments.

    Pour $n = 12$, on obtient six idéaux : $\langle \overline{1} \rangle = \mathbb{Z}/12\mathbb{Z}$, $\langle \overline{2} \rangle$ (six éléments), $\langle \overline{3} \rangle$ (quatre), $\langle \overline{4} \rangle$ (trois), $\langle \overline{6} \rangle$ (deux) et $\langle \overline{0} \rangle$.

    De même, les idéaux de $\mathbb{Q}[X]/\langle f \rangle$ sont les $\langle \overline{g} \rangle$, pour $g$ diviseur unitaire de $f$.

    **3.** La correspondance du th. 3 respecte l'inclusion, donc la maximalité. Les idéaux maximaux de $\mathbb{Z}/n\mathbb{Z}$ sont les $\langle \overline{p} \rangle$, $p$ premier divisant $n$ ; ceux de $\mathbb{Q}[X]/\langle f \rangle$ sont les $\langle \overline{g} \rangle$, $g$ facteur irréductible unitaire de $f$.

    1.5em

    ![Figure](documents/figures/d8d3114f1dfe21f1.svg)

    Le treillis des idéaux de $\mathbb{Z}/12\mathbb{Z}$ est celui des diviseurs de $12$, renversé : $\langle \overline{d} \rangle \subset \langle \overline{d'} \rangle$ si et seulement si $d'$ divise $d$. Les deux idéaux maximaux sont en rouge ; leur intersection $\langle \overline{6} \rangle$ est le nilradical, comme le prévoit l'exercice 2.
