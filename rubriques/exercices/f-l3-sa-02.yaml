  source: "devoir surveillé du 7/11/2014, exercice 1, questions 3 à 5"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $S$ une partie infinie de $\mathbb{R}$, $F(t, u) = (t - 2)^{5} - (u + 5)^{2}$, et $I$ l'ensemble des polynômes $P \in \mathbb{R}[t, u]$ tels que $P(a^{2} + 2, a^{5} - 5) = 0$ pour tout $a \in S$.

    **1.** Montrer que $I$ est un idéal de $\mathbb{R}[t, u]$ et que $F \in I$.

    **2.** Vérifier que $f : P(t, u) \mapsto P(x^{2} + 2, x^{5} - 5)$ est un morphisme d'anneaux de $\mathbb{R}[t, u]$ dans $\mathbb{R}[x]$, et montrer que $\mathrm{Ker}\, f = I$. Montrer enfin que $I = \langle F \rangle$. *On admettra que tout $P \in \mathbb{R}[t, u]$ s'écrit $P = QF + a(t) + b(t)u$, avec $Q \in \mathbb{R}[t, u]$ et $a$, $b \in \mathbb{R}[t]$ (division par $F$ vu comme polynôme en $u$, de coefficient dominant $-1$), et l'on comparera les parités des degrés.*

    **3.** Soit $J = \langle F, t - 1 \rangle$. Montrer que $J = \langle t - 1, (u + 5)^{2} + 1 \rangle$, puis que $\mathbb{R}[t, u]/J$ est isomorphe à $\mathbb{C}$. *On considérera $P \mapsto P(1, -5 + \mathrm{i})$.*
  corrige: |
    **1.** Pour $a \in S$, l'évaluation $P \mapsto P(a^{2} + 2, a^{5} - 5)$ est un morphisme d'anneaux de $\mathbb{R}[t, u]$ dans $\mathbb{R}$. L'ensemble $I$ est l'intersection de leurs noyaux, donc un idéal.

    On vérifie $F(a^{2} + 2, a^{5} - 5) = (a^{2})^{5} - (a^{5})^{2} = 0$ : $F \in I$.

    **2.** L'application $f$ est un morphisme d'évaluation, en $(x^{2} + 2, x^{5} - 5) \in \mathbb{R}[x]^{2}$.

    $\triangleright$ *$\mathrm{Ker}\, f = I$.* Si $f(P) = 0$, alors $P(a^{2} + 2, a^{5} - 5) = f(P)(a) = 0$ pour tout $a$ : $\mathrm{Ker}\, f \subset I$. Réciproquement, si $P \in I$, le polynôme $f(P) \in \mathbb{R}[x]$ s'annule sur l'ensemble infini $S$, donc est nul.

    $\triangleright$ *$I = \langle F \rangle$.* On sait déjà $\langle F \rangle \subset I$. Soit $P \in I$, écrit $P = QF + a(t) + b(t)u$ comme dans l'indication. Comme $f(F) = 0$, 
    $$0 = f(P) = a(x^{2} + 2) + b(x^{2} + 2)\,(x^{5} - 5).$$
     Si $a \neq 0$, le premier terme est de degré pair $2\deg a$ ; si $b \neq 0$, le second est de degré impair $2\deg b + 5$. Deux polynômes non nuls de degrés différents ne peuvent avoir une somme nulle, et un seul terme non nul ne peut être nul : donc $a = b = 0$, et $P = QF$.

    Ainsi $\boxed{I = \mathrm{Ker}\, f = \langle F \rangle}$. En particulier $\mathbb{R}[t, u]/\langle F \rangle$ est isomorphe au sous-anneau $\operatorname{Im} f$ de $\mathbb{R}[x]$, qui est intègre : $\langle F \rangle$ est premier.

    **3.** Pour tout $P$, $P(t, u) - P(1, u)$ est divisible par $t - 1$. Or $F(1, u) = -1 - (u + 5)^{2}$, donc 
    $$J = \langle F, t - 1 \rangle = \langle F(1, u), t - 1 \rangle = \langle t - 1, (u + 5)^{2} + 1 \rangle.$$

    Soit $\theta : P \mapsto P(1, -5 + \mathrm{i})$, morphisme de $\mathbb{R}[t, u]$ dans $\mathbb{C}$. Il est surjectif, car $\theta\big(\alpha + \beta(u + 5)\big) = \alpha + \beta\mathrm{i}$. Son noyau contient $t - 1$ et $(u + 5)^{2} + 1$, donc $J$.

    Réciproquement, soit $P \in \mathrm{Ker}\,\theta$. On a $P \equiv P(1, u)$ modulo $J$, et la division de $P(1, u)$ par $(u + 5)^{2} + 1$ dans $\mathbb{R}[u]$ donne $P(1, u) = Q \cdot \big((u + 5)^{2} + 1\big) + \alpha + \beta(u + 5)$. Alors $0 = \theta(P) = \alpha + \beta\mathrm{i}$, donc $\alpha = \beta = 0$ et $P \in J$.

    Ainsi $\boxed{\mathbb{R}[t, u]/J \simeq \mathbb{C}}$, et $J$ est un idéal maximal.

    1.5em

    ![Figure](documents/figures/665ee83593b5fbc7.svg)

    La courbe réelle $F = 0$, paramétrée par $a \mapsto (a^{2} + 2, a^{5} - 5)$, ne rencontre pas la droite $t = 1$ : les zéros communs de $F$ et de $t - 1$ sont les deux points complexes $(1, -5 \pm \mathrm{i})$. C'est pourquoi le quotient $\mathbb{R}[t, u]/J$ est le corps $\mathbb{C}$, et non $\mathbb{R}$.
- id: "l3-sa-02-09"
  feuille: "f-l3-sa-02"
  numero: 9
  partie: "Idéaux premiers, idéaux maximaux"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [idéaux premiers et maximaux]
  noeuds: [a-premier-maximal]
  notions: [ideal-premier, ideal-maximal]
  source: "Exo7 (fic00032), exercices 4, 5 et 11"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    **1.** Montrer que, dans un anneau fini, tout idéal premier est maximal.

    **2.** Montrer qu'un idéal $I \neq A$ est premier si et seulement si, pour tous idéaux $J$ et $K$, $JK \subset I$ implique $J \subset I$ ou $K \subset I$. En déduire que, si $M$ est un idéal maximal, le seul idéal premier qui contient $M^{n}$ ($n \geqslant 1$) est $M$.

    **3.** Soit $f : A \to B$ un morphisme d'anneaux. Montrer par des exemples que l'image réciproque d'un idéal maximal n'est pas toujours maximale, et que l'image d'un idéal n'est pas toujours un idéal. Si $f$ est surjectif, montrer que l'image d'un idéal maximal est $B$ ou un idéal maximal de $B$.

    **4.** On note $r_{m} : \mathbb{Z}[X] \to (\mathbb{Z}/m\mathbb{Z})[X]$ la réduction modulo $m$. Les idéaux $\langle X \rangle$ et $\langle X^{2} + 1 \rangle$ sont premiers dans $\mathbb{Z}[X]$ ; les idéaux $r_{6}(\langle X \rangle)$ et $r_{2}(\langle X^{2} + 1 \rangle)$ sont-ils premiers ?
  corrige: |
    **1.** Si $\mathfrak{p}$ est premier, $A/\mathfrak{p}$ est intègre (cours, th. 4) et fini, donc c'est un corps (chapitre 1, th. 4) : $\mathfrak{p}$ est maximal.

    **2.** Supposons $I$ premier, $JK \subset I$ et $J \not\subset I$ : soit $x \in J \setminus I$. Pour $y \in K$, $xy \in JK \subset I$, et $x \notin I$ impose $y \in I$ : $K \subset I$.

    Réciproquement, si $ab \in I$, alors $\langle a \rangle\langle b \rangle = \langle ab \rangle \subset I$, donc $\langle a \rangle \subset I$ ou $\langle b \rangle \subset I$ : $a \in I$ ou $b \in I$, et $I$, distinct de $A$, est premier.

    Si un idéal premier $\mathfrak{p}$ contient $M^{n} = M \cdot M^{n - 1}$, il contient $M$ ou $M^{n - 1}$, et, par récurrence, $M \subset \mathfrak{p}$. Comme $M$ est maximal et $\mathfrak{p} \neq A$, $\mathfrak{p} = M$. Enfin $M$ lui-même convient, étant premier (cours, th. 4).

    **3.** *Contre-exemples.* Pour l'inclusion $f : \mathbb{Z} \to \mathbb{Q}$, l'idéal $\{0\}$ est maximal dans le corps $\mathbb{Q}$, mais son image réciproque $\{0\}$ n'est pas maximale dans $\mathbb{Z}$, car $\{0\} \subsetneq 2\mathbb{Z}$. L'image $f(2\mathbb{Z}) = 2\mathbb{Z}$ n'est pas un idéal de $\mathbb{Q}$, puisque $\dfrac{1}{2} \times 2 = 1 \notin 2\mathbb{Z}$.

    *Cas surjectif.* Soit $M$ maximal ; $f(M)$ est un idéal (cours, prop. 5).

    • Si $\mathrm{Ker}\, f \subset M$, la correspondance du th. 3 du cours, qui respecte l'inclusion, fait de $f(M)$ un idéal maximal de $B$.

    • Sinon, $M + \mathrm{Ker}\, f$ contient strictement $M$, donc vaut $A$, et $f(M) = f(M + \mathrm{Ker}\, f) = f(A) = B$.

    **4.** $r_{6}$ étant surjectif, $r_{6}(\langle X \rangle) = \langle X \rangle$ dans $(\mathbb{Z}/6\mathbb{Z})[X]$, et le quotient est isomorphe à $\mathbb{Z}/6\mathbb{Z}$ (exercice 4), qui n'est pas intègre : l'idéal n'est pas premier.

    Dans $\mathbb{F}_{2}[X]$, $X^{2} + 1 = (X + 1)^{2}$, et $r_{2}(\langle X^{2} + 1 \rangle) = \langle (X + 1)^{2} \rangle$ contient $(X + 1)(X + 1)$ sans contenir $X + 1$ : il n'est pas premier.

    *L'image d'un idéal premier par un morphisme surjectif n'est donc pas toujours un idéal premier*, contrairement à l'image réciproque.
- id: "l3-sa-02-10"
  feuille: "f-l3-sa-02"
