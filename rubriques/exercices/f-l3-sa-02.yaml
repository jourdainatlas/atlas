  notions: [ideal-premier, ideal-maximal]
  source: "Exo7 (fic00033), exercice 4"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    L'idéal $\langle x^{2} + y^{2} + 1 \rangle$ est-il maximal dans $\mathbb{C}[x, y]$ ? dans $\mathbb{R}[x, y]$ ? dans $\mathbb{Q}[x, y]$ ? dans $\mathbb{F}_{2}[x, y]$ ? L'idéal $\langle x^{2} + 1 \rangle$ est-il maximal dans $\mathbb{Z}[x]$ ? dans $\mathbb{Q}[x]$ ?
  corrige: |
    $\triangleright$ *Dans $\mathbb{C}[x, y]$.* On a $x^{2} + y^{2} + 1 = x \cdot x + (y - \mathrm{i})(y + \mathrm{i})$, donc $\langle x^{2} + y^{2} + 1 \rangle \subset \langle x, y - \mathrm{i} \rangle$. Ce dernier idéal est le noyau de l'évaluation en $(0, \mathrm{i})$, de quotient $\mathbb{C}$, donc distinct de $\mathbb{C}[x, y]$ ; il contient $x$, qui n'est pas multiple de $x^{2} + y^{2} + 1$ (degré). L'idéal n'est pas maximal.

    $\triangleright$ *Dans $\mathbb{R}[x, y]$ et $\mathbb{Q}[x, y]$.* De même, $\langle x^{2} + y^{2} + 1 \rangle \subsetneq \langle x, y^{2} + 1 \rangle$, et ce dernier idéal a pour quotient $K[y]/\langle y^{2} + 1 \rangle$, non nul (exercice 4 et cours, prop. 6) : pas maximal.

    $\triangleright$ *Dans $\mathbb{F}_{2}[x, y]$.* En caractéristique $2$, $x^{2} + y^{2} + 1 = (x + y + 1)^{2}$ : l'idéal n'est même pas premier.

    $\triangleright$ *Dans $\mathbb{Z}[x]$ et $\mathbb{Q}[x]$.* L'idéal $\langle x^{2} + 1 \rangle$ est contenu strictement dans $\langle 3, x^{2} + 1 \rangle$, qui est maximal (exercice 7, quotient à $9$ éléments) : il n'est pas maximal dans $\mathbb{Z}[x]$. Il est cependant premier, car $\mathbb{Z}[x]/\langle x^{2} + 1 \rangle \simeq \mathbb{Z}[\mathrm{i}]$ est intègre (exercice 5).

    Dans $\mathbb{Q}[x]$, $x^{2} + 1$ n'a pas de racine rationnelle ; de degré $2$, il est irréductible, et $\langle x^{2} + 1 \rangle$ est maximal (cours, prop. 8).

    *Dans ces exemples, un idéal principal n'est maximal que dans l'anneau de polynômes en une variable sur un corps* : en deux variables, ou sur $\mathbb{Z}$, on peut toujours ajouter un générateur.
