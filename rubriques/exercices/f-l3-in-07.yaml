  enonce: |
    **1.** Énoncer les théorèmes de Fubini-Tonelli et de Fubini pour la mesure de comptage sur $\mathbb{N} \times \mathbb{N}$.

    **2.** Soit $f(n, m) = 1$ si $n = m - 1$, $f(n, m) = -1$ si $n = m + 1$, et $f(n, m) = 0$ sinon. Calculer $\sum_{n}\sum_{m}f(n, m)$ et $\sum_{m}\sum_{n}f(n, m)$, et dire lesquelles des hypothèses de la question 1 sont satisfaites.
  corrige: |
    **1.** Pour $f \geqslant 0$ sur $\mathbb{N}^{2}$, $\sum_{n}\sum_{m}f(n, m) = \sum_{m}\sum_{n}f(n, m)$, dans $[0, +\infty]$. Si $\sum_{n, m}|f(n, m)| < +\infty$, toutes les séries convergent absolument et les deux sommes itérées sont égales.

    **2.** Pour $n$ fixé, seuls $m = n + 1$ (valeur $1$) et $m = n - 1$ (valeur $-1$, si $n \geqslant 1$) contribuent : $\sum_{m}f(0, m) = 1$ et $\sum_{m}f(n, m) = 0$ pour $n \geqslant 1$, d'où $\sum_{n}\sum_{m}f = \boxed{1}$. De même, $\sum_{n}f(n, 0) = -1$, et $\sum_{n}f(n, m) = 0$ si $m \geqslant 1$, d'où $\sum_{m}\sum_{n}f = \boxed{-1}$. La fonction n'est pas positive, et $\sum|f(n, m)| = +\infty$ : aucun des deux théorèmes ne s'applique.
