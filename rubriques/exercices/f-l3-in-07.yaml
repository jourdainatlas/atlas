  enonce: |
    Soit $\mu_{1}$, $\mu_{2}$ deux mesures boréliennes $\sigma$-finies non nulles sur $\mathbb{R}$, telles que $\mu_{1} \otimes \mu_{2}(\mathbb{R}^{2} \setminus \Delta) = 0$, où $\Delta = \{(x, x) ; x \in \mathbb{R}\}$. On veut montrer qu'il existe $a \in \mathbb{R}$ et $b_{1}$, $b_{2} > 0$ tels que $\mu_{1} = b_{1}\delta_{a}$ et $\mu_{2} = b_{2}\delta_{a}$.

    **1.** Si $\mu_{1}(A_{1}) > 0$ et $\mu_{2}(A_{2}) > 0$, montrer que $(A_{1} \times A_{2}) \cap \Delta \neq \emptyset$, et donc que $A_{1} \cap A_{2} \neq \emptyset$.

    **2.** Soit $A$ un borélien tel que $\mu_{1}(A) > 0$. Montrer que $\mu_{2}(\mathbb{R} \setminus A) = 0$, puis que $\mu_{2}(A) > 0$, et enfin que $\mu_{1}(\mathbb{R} \setminus A) = 0$.

    **3.** En déduire que $\mu_{1}$ est finie.

    **4.** Soit $a = \sup\{x ; \mu_{1}(]-\infty, x]) = 0\}$. Montrer que $a$ est réel et que $\mu_{1} = \mu_{1}(\{a\})\delta_{a}$. Conclure. Réciproquement, de telles mesures conviennent-elles ?
  corrige: |
    **1.** $(\mu_{1} \otimes \mu_{2})(A_{1} \times A_{2}) = \mu_{1}(A_{1})\mu_{2}(A_{2}) > 0$. Si $A_{1} \times A_{2}$ ne rencontrait pas $\Delta$, il serait contenu dans $\mathbb{R}^{2} \setminus \Delta$, de mesure nulle. Un point $(x, x)$ de $(A_{1} \times A_{2}) \cap \Delta$ donne $x \in A_{1} \cap A_{2}$.

    **2.** Si $\mu_{2}(\mathbb{R} \setminus A) > 0$, la question 1, avec $A_{1} = A$ et $A_{2} = \mathbb{R} \setminus A$, donne $A \cap (\mathbb{R} \setminus A) \neq \emptyset$ : absurde. Donc $\mu_{2}(\mathbb{R} \setminus A) = 0$, et $\mu_{2}(A) = \mu_{2}(\mathbb{R}) > 0$. Le même argument, avec $A_{1} = \mathbb{R} \setminus A$ et $A_{2} = A$, donne $\mu_{1}(\mathbb{R} \setminus A) = 0$. Ainsi, pour tout borélien $A$, ou bien $\mu_{1}(A) = 0$, ou bien $\mu_{1}(\mathbb{R} \setminus A) = 0$.

    **3.** Si $\mathbb{R} = \bigcup E_{k}$ avec $\mu_{1}(E_{k}) < +\infty$, l'un des $E_{k}$ est de mesure positive, donc de complémentaire négligeable, et $\mu_{1}(\mathbb{R}) = \mu_{1}(E_{k}) < +\infty$.

    **4.** Par la question 2, $\varphi(x) = \mu_{1}(]-\infty, x])$ ne prend que les valeurs $0$ et $b_{1} = \mu_{1}(\mathbb{R})$ ; croissante, elle tend vers $0$ en $-\infty$ et vers $b_{1} > 0$ en $+\infty$. L'ensemble $\{\varphi = 0\}$ est donc non vide et majoré, et $a$ est réel. Par continuité monotone, $\mu_{1}(]-\infty, a[) = \lim\varphi(a - \frac{1}{k}) = 0$, et, pour $x > a$, $\varphi(x) = b_{1}$ donne $\mu_{1}(]x, +\infty[) = 0$, d'où $\mu_{1}(]a, +\infty[) = 0$. Ainsi $\mu_{1} = b_{1}\delta_{a}$, et de même $\mu_{2} = b_{2}\delta_{a'}$. Le produit $b_{1}b_{2}\delta_{(a, a')}$ est porté par $\Delta$ si et seulement si $a' = a$. Réciproquement, $b_{1}\delta_{a} \otimes b_{2}\delta_{a} = b_{1}b_{2}\delta_{(a, a)}$ convient.
