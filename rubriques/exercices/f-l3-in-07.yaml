  page_enonce: 5
  page_corrige: 9
  enonce: |
    Soit $\mu$ une mesure finie sur $\mathcal{B}(\mathbb{R})$ et $\varphi(x) = \int_{\mathbb{R}}\mathrm{e}^{-\mathrm{i} xt}\,\mathrm{d}\mu(t)$ sa transformée de Fourier.

    **1.** Pour $n \geqslant 1$ et $a \in \mathbb{R}$, montrer que $\frac{1}{2n}\int_{-n}^{n}\mathrm{e}^{\mathrm{i} ax}\varphi(x)\,\mathrm{d} x = \int_{\mathbb{R}}K_{n}(t - a)\,\mathrm{d}\mu(t)$, où $K_{n}$ est une fonction que l'on explicitera.

    **2.** En déduire la limite de $\frac{1}{2n}\int_{-n}^{n}\mathrm{e}^{\mathrm{i} ax}\varphi(x)\,\mathrm{d} x$ quand $n \to +\infty$.

    **3.** Montrer que, si $\varphi(x) \to 0$ quand $|x| \to +\infty$, ou si $\varphi$ est intégrable sur $\mathbb{R}$, alors $\mu$ est diffuse, c'est-à-dire sans atome.
  corrige: |
    **1.** La fonction $(x, t) \mapsto \mathrm{e}^{\mathrm{i} ax}\mathrm{e}^{-\mathrm{i} xt}$ est de module $1$, intégrable sur $[-n, n] \times \mathbb{R}$ pour $\lambda \otimes \mu$, mesure finie. Par Fubini, 
    $$\frac{1}{2n}\int_{-n}^{n}\mathrm{e}^{\mathrm{i} ax}\varphi(x)\,\mathrm{d} x = \int_{\mathbb{R}}\Big(\frac{1}{2n}\int_{-n}^{n}\mathrm{e}^{-\mathrm{i} x(t - a)}\,\mathrm{d} x\Big)\mathrm{d}\mu(t) = \int_{\mathbb{R}}K_{n}(t - a)\,\mathrm{d}\mu(t), \qquad K_{n}(s) = \frac{\sin(ns)}{ns},$$
     avec $K_{n}(0) = 1$.

    **2.** $|K_{n}| \leqslant 1$, et $K_{n}(s) \to \chi_{\{0\}}(s)$ : par convergence dominée, la limite est $\boxed{\mu(\{a\})}$. La transformée de Fourier « lit » les atomes de $\mu$ par une moyenne de Cesàro.

    ![Figure](documents/figures/416f782db34dee8b.svg)

    Les fonctions $K_{n}(s) = \frac{\sin(ns)}{ns}$ pour $n = 2$, $5$, $15$ (ocre, de plus en plus épaisses) valent toujours $1$ en $0$ (carmin) et tendent vers $0$ ailleurs, en oscillant : leur limite simple est l'indicatrice de $\{0\}$, qui n'isole que la masse ponctuelle en $a$.

    **3.** Si $\varphi \to 0$, pour $\varepsilon > 0$ on choisit $X$ tel que $|\varphi| \leqslant \varepsilon$ hors de $[-X, X]$, et $\frac{1}{2n}\int_{-n}^{n}|\varphi| \leqslant \varepsilon + \frac{X\mu(\mathbb{R})}{n}$, qui est inférieur à $2\varepsilon$ pour $n$ grand. Si $\varphi$ est intégrable, $\frac{1}{2n}\int|\varphi| \leqslant \frac{1}{2n}\int_{\mathbb{R}}|\varphi| \to 0$. Dans les deux cas, $\mu(\{a\}) = 0$ pour tout $a$. Par exemple, $\widehat{\delta_{0}} = 1$ ne tend pas vers $0$.
- id: "l3-in-07-24"
