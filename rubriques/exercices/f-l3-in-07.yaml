  enonce: |
    Soit $D = \{(x, y) \in \mathbb{R}^{2} ; x \geqslant 0, y \geqslant 0, x + y \leqslant 1\}$. Dessiner $D$ et déterminer ses sections $D_{x}$ et $D^{y}$ pour $x$, $y \in \mathbb{R}$. Montrer que $D$ est borélien, et calculer son aire et $\int_{D}(x^{2} + y^{2})\,\mathrm{d} x\,\mathrm{d} y$.
  corrige: |
    Pour $0 \leqslant x \leqslant 1$, $D_{x} = [0, 1 - x]$, et $D_{x} = \emptyset$ sinon ; de même pour $D^{y}$. Le triangle $D$ est fermé, donc borélien. Par le théorème 1 et Tonelli, 
    $$\lambda(D) = \int_{0}^{1}(1 - x)\,\mathrm{d} x = \boxed{\frac{1}{2}}, \qquad \int_{D}(x^{2} + y^{2}) = 2\int_{0}^{1}x^{2}(1 - x)\,\mathrm{d} x = \boxed{\frac{1}{6}}\text{,}$$
     la seconde par symétrie entre $x$ et $y$.

    ![Figure](documents/figures/1f9cc9a8b7510c32.svg)

    La section verticale $D_{x}$ (ocre) du triangle $D$ (ardoise) est un segment de longueur $1 - x$ : le théorème 1 du cours calcule l'aire en intégrant ces longueurs, ce qui redonne la formule « base fois hauteur sur deux ».
