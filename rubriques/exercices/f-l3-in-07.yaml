  page_enonce: 4
  page_corrige: 6
  enonce: |
    Soit $\mu$ la mesure de comptage sur $\mathbb{N}$, $\nu$ une mesure $\sigma$-finie sur $(X, \mathcal{T})$, $(f_{n})$ une suite de fonctions mesurables de $X$ dans $\mathbb{R}$, et $f(n, x) = f_{n}(x)$. Quelles hypothèses supplémentaires permettent d'appliquer à $f$ et $\mu \otimes \nu$ le théorème de Fubini-Tonelli, puis celui de Fubini, et quelles identités obtient-on ? Restent-elles valables si $\nu$ n'est pas $\sigma$-finie ?
  corrige: |
    $f$ est mesurable pour $\mathcal{P}(\mathbb{N}) \otimes \mathcal{T}$, puisque $f^{-1}(B) = \bigcup_{n}\{n\} \times f_{n}^{-1}(B)$. Si les $f_{n}$ sont positives, Tonelli donne $\int\sum_{n}f_{n}\,\mathrm{d}\nu = \sum_{n}\int f_{n}\,\mathrm{d}\nu$. Si $\sum_{n}\int|f_{n}|\,\mathrm{d}\nu < +\infty$, Fubini donne la convergence de $\sum f_{n}(x)$ pour presque tout $x$, et la même identité. Ces deux identités restent vraies sans $\sigma$-finitude de $\nu$ : ce sont la proposition 13 du chapitre 3 et la proposition 7 du chapitre 4, qui reposent sur la seule convergence monotone. Le théorème de Fubini-Tonelli les contient, mais elles n'en ont pas besoin.
- id: "l3-in-07-18"
  feuille: "f-l3-in-07"
  numero: 18
  partie: "Applications"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [applications de Fubini]
  noeuds: [m-fubini]
  notions: [integrale-iteree]
  source: "Féjoz (exosIntegration), exercice 4.12 ; Lyon 1 (TD06 2020), exercices 3 et 4 ; Exo7 (fic00149), exercice 4"
  page_enonce: 4
  page_corrige: 6
  enonce: |
    Pour $a$, $b > 0$, soit $B(a, b) = \int_{0}^{1}t^{a-1}(1 - t)^{b-1}\,\mathrm{d} t$.

    **1.** Montrer que $B(a, b) = B(b, a) = 2\int_{0}^{\pi/2}\sin^{2a-1}\theta\cos^{2b-1}\theta\,\mathrm{d}\theta$, et calculer $B(\frac{1}{2}, \frac{1}{2})$ et $B(a, 1)$.

    **2.** Retrouver la proposition 7 du cours, $B(a, b) = \frac{\Gamma(a)\Gamma(b)}{\Gamma(a + b)}$, en calculant $\int_{(\mathbb{R}_{+}^{*})^{2}}t^{a-1}s^{b-1}\mathrm{e}^{-(t+s)}\,\mathrm{d} t\,\mathrm{d} s$ à l'aide du $C^{1}$-difféomorphisme $H(u, v) = (uv, u(1 - v))$ de $]0, +\infty[ \times ]0, 1[$ sur $(\mathbb{R}_{+}^{*})^{2}$.

    **3.** Pour $\alpha > \frac{n}{2}$, calculer $\int_{\mathbb{R}^{n}}\frac{\mathrm{d} x}{(1 + |x|^{2})^{\alpha}}$ à l'aide de $B$, puis de $\Gamma$.

    **4.** Soit $a_{1}$, …, $a_{n}$ et $b_{1}$, …, $b_{n} > 0$. Montrer qu'il existe $\nu_{n} > 0$ tel que, pour toute $f : \mathbb{R}_{+} \to \mathbb{R}_{+}$ borélienne, 
    $$\int_{(\mathbb{R}_{+}^{*})^{n}}f(x_{1} + \dots + x_{n})x_{1}^{a_{1}-1}\cdots x_{n}^{a_{n}-1}\,\mathrm{d} x = \nu_{n}\int_{0}^{+\infty}f(t)t^{a_{1} + \dots + a_{n} - 1}\,\mathrm{d} t,$$
     et calculer $\nu_{n}$ en prenant $f(t) = \mathrm{e}^{-t}$. En déduire une formule analogue pour 
    $$\int_{(\mathbb{R}_{+}^{*})^{n}}f(x_{1}^{b_{1}} + \dots + x_{n}^{b_{n}})x_{1}^{a_{1}-1}\cdots x_{n}^{a_{n}-1}\,\mathrm{d} x.$$
  corrige: |
    **1.** Le changement de variable $t \mapsto 1 - t$ échange $a$ et $b$, et $t = \sin^{2}\theta$, avec $\mathrm{d} t = 2\sin\theta\cos\theta\,\mathrm{d}\theta$, donne la seconde formule. Ainsi $B(\frac{1}{2}, \frac{1}{2}) = 2\int_{0}^{\pi/2}\mathrm{d}\theta = \boxed{\pi}$ et $B(a, 1) = \int_{0}^{1}t^{a-1}\,\mathrm{d} t = \boxed{\frac{1}{a}}$.

    **2.** Par Tonelli, l'intégrale vaut $\Gamma(a)\Gamma(b)$. L'application $H$ est bijective, sa réciproque étant donnée par $u = t + s$ et $v = \frac{t}{t + s}$, et de jacobien 
    $$\det\begin{pmatrix}v & u\\ 1 - v & -u\end{pmatrix} = -u.$$
     Par le théorème de changement de variables, puis Tonelli, 
    $$\Gamma(a)\Gamma(b) = \int_{0}^{+\infty}\int_{0}^{1}(uv)^{a-1}(u(1 - v))^{b-1}\mathrm{e}^{-u}\,u\,\mathrm{d} v\,\mathrm{d} u = \Gamma(a + b)B(a, b).$$

    **3.** Par la formule des fonctions radiales (chapitre 6, prop. 4), puis $r^{2} = u$ et $u = \frac{t}{1 - t}$, 
    $$\int_{\mathbb{R}^{n}}\frac{\mathrm{d} x}{(1 + |x|^{2})^{\alpha}} = nv_{n}\int_{0}^{+\infty}\frac{r^{n-1}\,\mathrm{d} r}{(1 + r^{2})^{\alpha}} = \frac{nv_{n}}{2}B\Big(\frac{n}{2}, \alpha - \frac{n}{2}\Big) = \boxed{\pi^{n/2}\frac{\Gamma(\alpha - \frac{n}{2})}{\Gamma(\alpha)}}\text{,}$$
     puisque $nv_{n} = \frac{2\pi^{n/2}}{\Gamma(n/2)}$. Pour $n = 3$ et $\alpha = 2{,}6$, les deux membres valent $3{,}7055$.

    **4.** Pour $n = 2$, le calcul de la question 2, avec $\mathrm{e}^{-u}$ remplacé par $f(u)$, donne $\nu_{2} = B(a_{1}, a_{2})$. Par récurrence, en intégrant d'abord en $(x_{1}, \dots, x_{n})$ (Tonelli), $\nu_{n+1} = \nu_{n}B(a_{1} + \dots + a_{n}, a_{n+1})$. Avec $f(t) = \mathrm{e}^{-t}$, le membre de gauche vaut $\Gamma(a_{1})\cdots\Gamma(a_{n})$ et celui de droite $\nu_{n}\Gamma(a_{1} + \dots + a_{n})$, d'où $\nu_{n} = \frac{\Gamma(a_{1})\cdots\Gamma(a_{n})}{\Gamma(a_{1} + \dots + a_{n})}$. Le changement de variables $y_{i} = x_{i}^{b_{i}}$, pour lequel $x_{i}^{a_{i}-1}\,\mathrm{d} x_{i} = \frac{1}{b_{i}}y_{i}^{a_{i}/b_{i} - 1}\,\mathrm{d} y_{i}$, donne enfin 
    $$\int_{(\mathbb{R}_{+}^{*})^{n}}f\big(\textstyle\sum x_{i}^{b_{i}}\big)\prod x_{i}^{a_{i}-1}\,\mathrm{d} x = \frac{\prod_{i}\Gamma(a_{i}/b_{i})}{b_{1}\cdots b_{n}\,\Gamma(s)}\int_{0}^{+\infty}f(t)t^{s-1}\,\mathrm{d} t, \qquad s = \sum_{i}\frac{a_{i}}{b_{i}},$$
     formule contrôlée numériquement pour $f(t) = \mathrm{e}^{-t}$, $(a_{1}, a_{2}) = (1{,}5 ; 2)$ et $(b_{1}, b_{2}) = (2 ; 3)$.
