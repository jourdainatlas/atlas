  enonce: |
    Soit $\mu$ la mesure de comptage sur $([0, 1], \mathcal{B}([0, 1]))$ et $\Delta = \{(x, x) ; x \in [0, 1]\}$ la diagonale.

    **1.** Montrer que $\Delta$ est un borélien de $\mathbb{R}^{2}$, et de $[0, 1]^{2}$.

    **2.** Justifier l'existence des intégrales itérées suivantes, et les calculer : 
    $$I_{1} = \int_{[0, 1]}\Big(\int_{[0, 1]}\chi_{\Delta}(x, y)\,\mathrm{d}\lambda(x)\Big)\mathrm{d}\mu(y), \qquad I_{2} = \int_{[0, 1]}\Big(\int_{[0, 1]}\chi_{\Delta}(x, y)\,\mathrm{d}\mu(y)\Big)\mathrm{d}\lambda(x).$$

    **3.** Quelle hypothèse du théorème de Fubini-Tonelli n'est pas satisfaite ?
  corrige: |
    **1.** $\Delta$ est fermé dans $\mathbb{R}^{2}$, donc borélien, et aussi dans $[0, 1]^{2}$, dont les boréliens sont les traces de ceux de $\mathbb{R}^{2}$.

    **2.** Les sections de $\chi_{\Delta}$ sont des indicatrices de singletons, boréliennes. Pour tous $x$, $y$, 
    $$\int\chi_{\Delta}(x, y)\,\mathrm{d}\lambda(x) = \lambda(\{y\}) = 0, \qquad \int\chi_{\Delta}(x, y)\,\mathrm{d}\mu(y) = \mu(\{x\}) = 1,$$
     d'où $\boxed{I_{1} = 0}$ et $\boxed{I_{2} = 1}$.

    **3.** La mesure de comptage sur $[0, 1]$, ensemble non dénombrable, n'est pas $\sigma$-finie : une réunion dénombrable de parties de mesure finie, donc finies, serait dénombrable. Sans $\sigma$-finitude, la mesure produit n'est pas définie de façon unique, et les deux intégrales itérées peuvent différer.
