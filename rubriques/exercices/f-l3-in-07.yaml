  enonce: |
    Pour $x$, $y \geqslant 0$ et $t \geqslant 0$, soit $f(x, y, t) = \frac{1}{(1 + x^{2}t^{2})(1 + y^{2}t^{2})}$. En intégrant $f$ sur $[0, 1]^{2} \times [0, +\infty[$ dans deux ordres différents, calculer $I = \int_{0}^{+\infty}\Big(\frac{\arctan t}{t}\Big)^{2}\mathrm{d} t$.
  corrige: |
    La fonction est positive, et Tonelli permet tous les ordres. En intégrant d'abord en $x$ et en $y$, avec $\int_{0}^{1}\frac{\mathrm{d} x}{1 + x^{2}t^{2}} = \frac{\arctan t}{t}$, on obtient $I$. En intégrant d'abord en $t$, une décomposition en éléments simples donne, pour $x \neq y$, 
    $$\int_{0}^{+\infty}\frac{\mathrm{d} t}{(1 + x^{2}t^{2})(1 + y^{2}t^{2})} = \frac{1}{x^{2} - y^{2}}\int_{0}^{+\infty}\Big(\frac{x^{2}}{1 + x^{2}t^{2}} - \frac{y^{2}}{1 + y^{2}t^{2}}\Big)\mathrm{d} t = \frac{\pi}{2(x + y)}.$$
     Comme $\int_{0}^{1}\int_{0}^{1}\frac{\mathrm{d} x\,\mathrm{d} y}{x + y} = \int_{0}^{1}\big(\ln(1 + y) - \ln y\big)\,\mathrm{d} y = 2\ln 2$, on obtient $\boxed{I = \pi\ln 2 \approx 2{,}178}$, la moitié de la valeur trouvée sur $\mathbb{R}$ à la feuille 5, exercice 13.
- id: "l3-in-07-15"
