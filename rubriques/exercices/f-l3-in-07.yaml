  source: "Lyon 1 (TD05 2020), exercice 21"
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Soit $\mu$ et $\nu$ des probabilités sur $\mathcal{B}(\mathbb{R})$. Pour $t \in \mathbb{R}$, on pose $F_{\mu}(t) = \mu(]t, +\infty[)$, $G_{\mu}(t) = \mu(]-\infty, t])$ et $H_{\mu}(t) = \mu(\{t\})$.

    **1.** Montrer que $F_{\mu}$, $G_{\mu}$ et $H_{\mu}$ sont boréliennes, et que $\int_{\mathbb{R}}F_{\mu}\,\mathrm{d}\nu = \int_{\mathbb{R}}(G_{\nu} - H_{\nu})\,\mathrm{d}\mu$.

    **2.** Soit $D_{\mu} = \{t ; H_{\mu}(t) \neq 0\}$ et $D_{\nu}$ de même. Expliquer pourquoi ces ensembles sont au plus dénombrables, et montrer que 
    $$\int_{\mathbb{R}}F_{\mu}\,\mathrm{d}\nu + \int_{\mathbb{R}}F_{\nu}\,\mathrm{d}\mu + \sum_{t \in D_{\mu} \cap D_{\nu}}H_{\mu}(t)H_{\nu}(t) = 1.$$
  corrige: |
    **1.** $F_{\mu}$ décroît, $G_{\mu}$ croît, et $H_{\mu}(t) = G_{\mu}(t) - \lim_{k}G_{\mu}(t - \frac{1}{k})$ est limite de fonctions boréliennes. Par Tonelli, sur l'ensemble $\{(s, t) ; s > t\}$, 
    $$\int F_{\mu}\,\mathrm{d}\nu = \int\Big(\int\chi_{\{s > t\}}\,\mathrm{d}\mu(s)\Big)\mathrm{d}\nu(t) = \int\nu(]-\infty, s[)\,\mathrm{d}\mu(s) = \int(G_{\nu} - H_{\nu})\,\mathrm{d}\mu.$$

    **2.** Pour tout $k$, une probabilité a moins de $k$ atomes de masse $> \frac{1}{k}$ : $D_{\mu}$ et $D_{\nu}$ sont au plus dénombrables. Les trois termes sont les mesures, pour $\mu \otimes \nu$, des parties $\{s > t\}$, $\{s < t\}$ et $\Delta = \{s = t\}$, qui partitionnent $\mathbb{R}^{2}$. En effet, par Tonelli, $(\mu \otimes \nu)(\Delta) = \int\nu(\{s\})\,\mathrm{d}\mu(s) = \sum_{s \in D_{\nu}}\nu(\{s\})\mu(\{s\})$, et seuls les points de $D_{\mu} \cap D_{\nu}$ contribuent. En probabilités : $P(X > Y) + P(X < Y) + P(X = Y) = 1$ pour deux variables indépendantes de lois $\mu$ et $\nu$.
