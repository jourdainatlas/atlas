  enonce: |
    **1.** Montrer que $I = \int_{0}^{+\infty}\frac{\ln x}{x^{2} - 1}\,\mathrm{d} x$ existe et que $I = 2\int_{0}^{1}\frac{\ln x}{x^{2} - 1}\,\mathrm{d} x$.

    **2.** Montrer que, pour $y > 0$, et pour $x > 0$, $x \neq 1$, 
    $$\int_{0}^{+\infty}\frac{\mathrm{d} x}{(1 + y)(1 + x^{2}y)} = \frac{\pi}{2}\frac{1}{\sqrt{y}(1 + y)}, \qquad \int_{0}^{+\infty}\frac{\mathrm{d} y}{(1 + y)(1 + x^{2}y)} = \frac{2\ln x}{x^{2} - 1}.$$
     En calculant de deux façons $\int_{\mathbb{R}_{+}^{2}}\frac{\mathrm{d} x\,\mathrm{d} y}{(1 + y)(1 + x^{2}y)}$, montrer que $I = \frac{\pi^{2}}{4}$.

    **3.** À l'aide d'un développement en série entière de $\frac{1}{1 - x^{2}}$, en déduire que $\sum_{n \geqslant 0}\frac{1}{(2n + 1)^{2}} = \frac{\pi^{2}}{8}$ et $\sum_{n \geqslant 1}\frac{1}{n^{2}} = \frac{\pi^{2}}{6}$.
  corrige: |
    **1.** La fonction est positive sur $]0, +\infty[ \setminus \{1\}$, prolongeable par $\frac{1}{2}$ en $1$, équivalente à $-\ln x$ en $0$ et à $\frac{\ln x}{x^{2}}$ en $+\infty$ : elle est intégrable. Le changement de variable $x = \frac{1}{u}$ transforme $\int_{1}^{+\infty}$ en $\int_{0}^{1}\frac{-\ln u}{1 - u^{2}}\,\mathrm{d} u$, d'où $I = 2\int_{0}^{1}\frac{\ln x}{x^{2} - 1}\,\mathrm{d} x$.

    **2.** Le premier calcul est immédiat ($x\sqrt{y} = s$), le second par la décomposition 
    $$\frac{1}{(1 + y)(1 + x^{2}y)} = \frac{1}{1 - x^{2}}\Big(\frac{1}{1 + y} - \frac{x^{2}}{1 + x^{2}y}\Big),$$
     qui donne $\frac{1}{1 - x^{2}}\ln\frac{1}{x^{2}}$. Par Tonelli, l'intégrale double vaut, d'une part, 
    $$\frac{\pi}{2}\int_{0}^{+\infty}\frac{\mathrm{d} y}{\sqrt{y}(1 + y)} = \frac{\pi}{2}\big[2\arctan\sqrt{y}\big]_{0}^{+\infty} = \frac{\pi^{2}}{2},$$
     et d'autre part $\int_{0}^{+\infty}\frac{2\ln x}{x^{2} - 1}\,\mathrm{d} x = 2I$ : $\boxed{I = \frac{\pi^{2}}{4}}$.

    **3.** Sur $]0, 1[$, $\frac{\ln x}{x^{2} - 1} = \sum_{n \geqslant 0}(-\ln x)x^{2n}$, série de fonctions positives, et $\int_{0}^{1}(-\ln x)x^{2n}\,\mathrm{d} x = \frac{1}{(2n + 1)^{2}}$ par parties. Donc $\frac{\pi^{2}}{4} = 2\sum\frac{1}{(2n + 1)^{2}}$, soit $\sum_{n \geqslant 0}\frac{1}{(2n + 1)^{2}} = \boxed{\frac{\pi^{2}}{8}}$. Si $S = \sum_{n \geqslant 1}\frac{1}{n^{2}}$, les termes pairs donnent $\frac{S}{4}$, donc $S = \frac{\pi^{2}}{8} + \frac{S}{4}$ et $\boxed{S = \frac{\pi^{2}}{6}}$, comme à la feuille 6, exercice 11.
