  source: "Exo7 (fic00147), exercice 7"
  page_enonce: 6
  page_corrige: 10
  enonce: |
    Pour $a > 0$, calculer la transformée de Fourier de la gaussienne $f(x) = \mathrm{e}^{-a|x|^{2}/2}$ de $\mathbb{R}^{n}$, $\widehat{f}(\xi) = \int_{\mathbb{R}^{n}}f(x)\mathrm{e}^{-\mathrm{i}\langle\xi, x\rangle}\,\mathrm{d} x$.
  corrige: |
    $f(x)\mathrm{e}^{-\mathrm{i}\langle\xi, x\rangle} = \prod_{k}\mathrm{e}^{-ax_{k}^{2}/2}\mathrm{e}^{-\mathrm{i}\xi_{k}x_{k}}$ est intégrable, produit de fonctions intégrables des variables séparées. Par Fubini et la feuille 5, exercice 18, appliquée avec le paramètre $\frac{a}{2}$, 
    $$\widehat{f}(\xi) = \prod_{k = 1}^{n}\sqrt{\frac{2\pi}{a}}\,\mathrm{e}^{-\xi_{k}^{2}/(2a)} = \boxed{\Big(\frac{2\pi}{a}\Big)^{n/2}\mathrm{e}^{-|\xi|^{2}/(2a)}}\text{.}$$
     La séparation des variables, que justifie le théorème de Fubini, ramène le calcul en dimension $n$ au calcul en dimension $1$.
- id: "l3-in-07-25"
  feuille: "f-l3-in-07"
  numero: 25
  partie: "Applications"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [applications de Fubini]
  noeuds: [m-fubini]
  notions: [integrale-iteree]
  source: "Féjoz (exosIntegration), exercice 6.4"
  page_enonce: 6
  page_corrige: 10
  enonce: |
    *La transformation de Fourier n'est pas surjective.* On note $\mathrm{Si}(x) = \int_{0}^{x}\frac{\sin u}{u}\,\mathrm{d} u$.

    **1.** Montrer que $\mathrm{Si}$ est continue et bornée sur $\mathbb{R}$.

    **2.** Soit $f \in \mathcal{L}^{1}(\mathbb{R})$. Montrer, à l'aide du théorème de Fubini, que 
    $$\int_{1}^{\Xi}\frac{\widehat{f}(\xi) - \widehat{f}(-\xi)}{\xi}\,\mathrm{d}\xi = -2\mathrm{i}\int_{\mathbb{R}}f(x)\big(\mathrm{Si}(\Xi x) - \mathrm{Si}(x)\big)\,\mathrm{d} x,$$
     et en déduire que cette quantité a une limite finie quand $\Xi \to +\infty$.

    **3.** Soit $g$ la fonction impaire, continue, égale à $\frac{1}{\ln\xi}$ pour $\xi \geqslant \mathrm{e}$ et affine sur $[0, \mathrm{e}]$. Montrer que $g$ tend vers $0$ à l'infini, mais n'est la transformée de Fourier d'aucune fonction intégrable. Comparer au lemme de Riemann-Lebesgue.
  corrige: |
    **1.** $\mathrm{Si}$ est continue et impaire, et tend vers $\frac{\pi}{2}$ en $+\infty$ (chapitre 5, prop. 7) : elle est bornée.

    **2.** $\widehat{f}(\xi) - \widehat{f}(-\xi) = -2\mathrm{i}\int f(x)\sin(\xi x)\,\mathrm{d} x$. Sur $\mathbb{R} \times [1, \Xi]$, $\big|\frac{f(x)\sin(\xi x)}{\xi}\big| \leqslant |f(x)|$ est intégrable, et Fubini donne la formule, puisque $\int_{1}^{\Xi}\frac{\sin(\xi x)}{\xi}\,\mathrm{d}\xi = \mathrm{Si}(\Xi x) - \mathrm{Si}(x)$. Quand $\Xi \to +\infty$, $\mathrm{Si}(\Xi x) \to \frac{\pi}{2}\operatorname{sgn}x$, et l'intégrande est dominé par $2\sup|\mathrm{Si}|\cdot|f|$ : la limite existe et vaut $-2\mathrm{i}\int f(x)\big(\frac{\pi}{2}\operatorname{sgn}x - \mathrm{Si}(x)\big)\,\mathrm{d} x$.

    **3.** $g$ est continue, impaire, et tend vers $0$. Si l'on avait $g = \widehat{f}$, on aurait, par la question 2, une limite finie pour 
    $$\int_{1}^{\Xi}\frac{g(\xi) - g(-\xi)}{\xi}\,\mathrm{d}\xi = 2\int_{1}^{\Xi}\frac{g(\xi)}{\xi}\,\mathrm{d}\xi \geqslant 2\int_{\mathrm{e}}^{\Xi}\frac{\mathrm{d}\xi}{\xi\ln\xi} = 2\ln\ln\Xi \to +\infty.$$
     Le lemme de Riemann-Lebesgue dit que $\widehat{f}$ est continue et tend vers $0$ à l'infini ; cet exercice montre que la réciproque est fausse : une fonction continue tendant vers $0$, même très régulière, n'est pas toujours une transformée de Fourier.

    ![Figure](documents/figures/1902896da103844e.svg)

    La fonction impaire $g$ (ardoise) tend vers $0$ à l'infini, mais si lentement, comme $\frac{1}{\ln\xi}$, que $\int^{\Xi}\frac{g(\xi)}{\xi}\,\mathrm{d}\xi$ diverge, comme $\ln\ln\Xi$ : c'est trop lent pour une transformée de Fourier impaire.

