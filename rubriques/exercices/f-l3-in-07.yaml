  enonce: |
    Sur $[-1, 1]^{2}$, on pose $f(x, y) = \frac{xy}{(x^{2} + y^{2})^{2}}$ et $g(x, y) = \frac{x^{2} - y^{2}}{(x^{2} + y^{2})^{2}}$ pour $(x, y) \neq (0, 0)$, et $f(0, 0) = g(0, 0) = 0$.

    **1.** Montrer que les intégrales itérées de $f$ existent et sont égales. La fonction $f$ est-elle intégrable sur $[-1, 1]^{2}$ ?

    **2.** Montrer que $\int_{-1}^{1}\Big(\int_{-1}^{1}g(x, y)\,\mathrm{d} x\Big)\mathrm{d} y \neq \int_{-1}^{1}\Big(\int_{-1}^{1}g(x, y)\,\mathrm{d} y\Big)\mathrm{d} x$. Y a-t-il contradiction avec le théorème de Fubini ? On pourra calculer l'intégrale de $|g|$ sur la couronne $\{\varepsilon \leqslant x^{2} + y^{2} \leqslant 1\}$.
  corrige: |
    **1.** Pour $y \neq 0$ fixé, $x \mapsto f(x, y)$ est continue, impaire, donc d'intégrale nulle sur $[-1, 1]$ ; pour $y = 0$, elle est nulle. Les deux intégrales itérées valent $0$. Mais, en coordonnées polaires, $|f| = \frac{|\cos\theta\sin\theta|}{r^{2}}$, et $\int_{\{r < 1\}}|f| = \int_{0}^{1}\frac{\mathrm{d} r}{r}\int_{0}^{2\pi}|\cos\theta\sin\theta|\,\mathrm{d}\theta = +\infty$ : $f$ n'est pas intégrable. L'égalité des intégrales itérées ne prouve pas l'intégrabilité.

    **2.** Comme $\frac{\partial}{\partial x}\frac{x}{x^{2} + y^{2}} = \frac{y^{2} - x^{2}}{(x^{2} + y^{2})^{2}} = -g$, on a, pour $y \neq 0$, $\int_{-1}^{1}g(x, y)\,\mathrm{d} x = -\frac{2}{1 + y^{2}}$, puis 
    $$\int_{-1}^{1}\Big(\int_{-1}^{1}g\,\mathrm{d} x\Big)\mathrm{d} y = -2\int_{-1}^{1}\frac{\mathrm{d} y}{1 + y^{2}} = \boxed{-\pi}, \qquad \int_{-1}^{1}\Big(\int_{-1}^{1}g\,\mathrm{d} y\Big)\mathrm{d} x = \boxed{\pi},$$
     la seconde par l'antisymétrie $g(y, x) = -g(x, y)$. Il n'y a pas de contradiction : en polaires, $|g| = \frac{|\cos 2\theta|}{r^{2}}$, et l'intégrale de $|g|$ sur la couronne $\{\varepsilon \leqslant r^{2} \leqslant 1\}$ vaut $4\ln\frac{1}{\sqrt{\varepsilon}} \to +\infty$ : $g$ n'est pas intégrable, et le théorème de Fubini ne s'applique pas.
