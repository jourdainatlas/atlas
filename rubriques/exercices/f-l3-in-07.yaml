  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** Étudier, selon $\alpha \in \mathbb{R}$, l'intégrabilité de $f(x, y) = (1 + x + y)^{-\alpha}$ sur $[0, +\infty[^{2}$, et calculer son intégrale lorsqu'elle est finie.

    **2.** En écrivant $\frac{1}{x} = \int_{0}^{+\infty}\mathrm{e}^{-xt}\,\mathrm{d} t$, montrer que $\lim_{a \to +\infty}\int_{0}^{a}\frac{\sin x}{x}\,\mathrm{d} x = \frac{\pi}{2}$. Montrer que $\frac{\sin x}{x}$ n'est pas intégrable sur $[0, +\infty[$, en raisonnant par l'absurde avec $\frac{\sin^{2}x}{x}$.
  corrige: |
    **1.** Par Tonelli, l'intégrale $\int_{0}^{+\infty}(1 + x + y)^{-\alpha}\,\mathrm{d} y$ vaut $\frac{(1 + x)^{1-\alpha}}{\alpha - 1}$ si $\alpha > 1$, et $+\infty$ sinon ; puis $\int_{0}^{+\infty}\frac{(1 + x)^{1-\alpha}}{\alpha - 1}\,\mathrm{d} x$ est finie si et seulement si $\alpha > 2$. Ainsi $f$ est intégrable si et seulement si $\alpha > 2$, d'intégrale $\boxed{\frac{1}{(\alpha - 1)(\alpha - 2)}}$.

    **2.** Sur $[0, a] \times [0, +\infty[$, $|\sin x\,\mathrm{e}^{-xt}|$ est intégrable, d'intégrale $\int_{0}^{a}\frac{|\sin x|}{x}\,\mathrm{d} x < +\infty$. Par Fubini, 
    $$\int_{0}^{a}\frac{\sin x}{x}\,\mathrm{d} x = \int_{0}^{+\infty}\Big(\int_{0}^{a}\sin x\,\mathrm{e}^{-xt}\,\mathrm{d} x\Big)\mathrm{d} t = \int_{0}^{+\infty}\frac{1 - \mathrm{e}^{-at}(t\sin a + \cos a)}{1 + t^{2}}\,\mathrm{d} t.$$
     Pour $a \geqslant 1$, l'intégrande est dominé par $\frac{1 + (1 + t)\mathrm{e}^{-t}}{1 + t^{2}}$ et tend vers $\frac{1}{1 + t^{2}}$ : la limite est $\boxed{\frac{\pi}{2}}$. Si $\frac{\sin x}{x}$ était intégrable sur $[1, +\infty[$, $\frac{\sin^{2}x}{x} \leqslant \frac{|\sin x|}{x}$ le serait ; or $\int_{1}^{A}\frac{\sin^{2}x}{x}\,\mathrm{d} x = \frac{1}{2}\ln A - \frac{1}{2}\int_{1}^{A}\frac{\cos 2x}{x}\,\mathrm{d} x$, et la dernière intégrale converge quand $A \to +\infty$ : le membre de gauche tend vers $+\infty$.
