  enonce: |
    Soit $\mu$ une probabilité sur $\mathcal{B}(\mathbb{R})$ et, pour $x \in \mathbb{R}$ et $y > 0$, $H_{\mu}(x, y) = \frac{1}{\pi}\int_{\mathbb{R}}\frac{y}{y^{2} + (x - t)^{2}}\,\mathrm{d}\mu(t)$ (comparer à la feuille 5, exercice 22). On veut montrer que $H_{\mu}$ détermine $\mu$.

    **1.** Montrer que $H_{\mu}$ est continue sur $\mathbb{R} \times ]0, +\infty[$.

    **2.** Pour $x \in \mathbb{R}$, déterminer $\lim_{y \to 0^{+}}yH_{\mu}(x, y)$.

    **3.** Pour $a < b$, déterminer $\lim_{y \to 0^{+}}\int_{a}^{b}H_{\mu}(x, y)\,\mathrm{d} x$.

    **4.** Soit $\nu$ une autre probabilité telle que $H_{\mu} = H_{\nu}$. Montrer que $\mu = \nu$.
  corrige: |
    **1.** Pour $y \geqslant b > 0$, l'intégrande est continu en $(x, y)$ et majoré par $\frac{1}{\pi b}$, intégrable pour la probabilité $\mu$ : $H_{\mu}$ est continue (chapitre 5, th. 1).

    **2.** On a $yH_{\mu}(x, y) = \frac{1}{\pi}\int\frac{y^{2}}{y^{2} + (x - t)^{2}}\,\mathrm{d}\mu(t)$ ; l'intégrande, majoré par $1$, tend vers $\chi_{\{x\}}(t)$, d'où 
    $$\boxed{yH_{\mu}(x, y) \to \frac{\mu(\{x\})}{\pi}}\text{.}$$

    **3.** Par Tonelli, $\int_{a}^{b}H_{\mu}(x, y)\,\mathrm{d} x = \frac{1}{\pi}\int\Big(\arctan\frac{b - t}{y} - \arctan\frac{a - t}{y}\Big)\mathrm{d}\mu(t)$. L'intégrande, majoré par $\pi$, tend vers $\pi$ pour $t \in ]a, b[$, vers $\frac{\pi}{2}$ pour $t \in \{a, b\}$, vers $0$ ailleurs : 
    $$\lim_{y \to 0^{+}}\int_{a}^{b}H_{\mu}(x, y)\,\mathrm{d} x = \boxed{\mu(]a, b[) + \frac{\mu(\{a\}) + \mu(\{b\})}{2}}\text{.}$$

    **4.** Par la question 2, $\mu$ et $\nu$ ont les mêmes atomes, de mêmes masses ; par la question 3, $\mu(]a, b[) = \nu(]a, b[)$ pour tous $a < b$. Les intervalles ouverts forment un $\pi$-système qui engendre $\mathcal{B}(\mathbb{R})$, et deux probabilités qui y coïncident sont égales (chapitre 1, prop. 18).
- id: "l3-in-07-23"
  feuille: "f-l3-in-07"
  numero: 23
  partie: "Applications"
  etoiles: 2
