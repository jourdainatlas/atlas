  enonce: |
    Soit $f : \mathbb{R}^{d} \to \mathbb{R}$ borélienne et $\Gamma = \{(x, f(x)) ; x \in \mathbb{R}^{d}\}$ son graphe. Montrer que $\Gamma$ est un borélien de $\mathbb{R}^{d+1}$, et qu'il est négligeable.
  corrige: |
    $\varphi(x, y) = f(x) - y$ est borélienne sur $\mathbb{R}^{d+1}$, comme différence de composées de projections et de fonctions boréliennes, et $\Gamma = \varphi^{-1}(\{0\})$ est borélien. Par Tonelli, $\lambda(\Gamma) = \int_{\mathbb{R}^{d}}\lambda(\{f(x)\})\,\mathrm{d} x = 0$. Un graphe est donc toujours négligeable, alors qu'il existe des courbes continues $\gamma : [0, 1] \to \mathbb{R}^{2}$ dont l'image remplit un carré (courbes de Peano).
