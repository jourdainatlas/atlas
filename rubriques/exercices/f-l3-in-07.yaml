  enonce: |
    Soit $-1 < a < b$ et $f(x, y) = y^{x}$. Montrer que $f$ est intégrable sur $[a, b] \times ]0, 1]$, et en déduire la valeur de $\int_{0}^{1}\frac{y^{b} - y^{a}}{\ln y}\,\mathrm{d} y$.
  corrige: |
    $y^{x} \geqslant 0$, et, par Tonelli, $\int_{a}^{b}\int_{0}^{1}y^{x}\,\mathrm{d} y\,\mathrm{d} x = \int_{a}^{b}\frac{\mathrm{d} x}{x + 1} = \ln\frac{b + 1}{a + 1} < +\infty$. Dans l'autre ordre, $\int_{a}^{b}y^{x}\,\mathrm{d} x = \frac{y^{b} - y^{a}}{\ln y}$, d'où 
    $$\int_{0}^{1}\frac{y^{b} - y^{a}}{\ln y}\,\mathrm{d} y = \boxed{\ln\frac{b + 1}{a + 1}}\text{,}$$
     résultat obtenu à la feuille 5, exercice 7, par dérivation sous le signe somme.
