  enonce: |
    Montrer que $(x, y) \mapsto \mathrm{e}^{-x}\sin(2xy)$ est intégrable sur $]0, +\infty[ \times [0, 1]$, et, en calculant de deux façons son intégrale, déterminer $\int_{0}^{+\infty}\mathrm{e}^{-x}\frac{\sin^{2}x}{x}\,\mathrm{d} x$.
  corrige: |
    $|\mathrm{e}^{-x}\sin(2xy)| \leqslant \mathrm{e}^{-x}$, intégrable sur $]0, +\infty[ \times [0, 1]$. Par Fubini, en intégrant d'abord en $y$, $\int_{0}^{1}\sin(2xy)\,\mathrm{d} y = \frac{1 - \cos 2x}{2x} = \frac{\sin^{2}x}{x}$ ; d'abord en $x$, $\int_{0}^{+\infty}\mathrm{e}^{-x}\sin(2xy)\,\mathrm{d} x = \frac{2y}{1 + 4y^{2}}$. Donc 
    $$\int_{0}^{+\infty}\mathrm{e}^{-x}\frac{\sin^{2}x}{x}\,\mathrm{d} x = \int_{0}^{1}\frac{2y\,\mathrm{d} y}{1 + 4y^{2}} = \boxed{\frac{\ln 5}{4} \approx 0{,}402}\text{.}$$
- id: "l3-in-07-17"
  feuille: "f-l3-in-07"
