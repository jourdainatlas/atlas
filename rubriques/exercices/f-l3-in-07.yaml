  enonce: |
    **1.** Calculer $\int_{[0, 1]^{2}}x\mathrm{e}^{xy}\,\mathrm{d} x\,\mathrm{d} y$.

    **2.** Soit $\Delta = \{(x, y) \in \mathbb{R}^{2} ; 0 < x < y\}$ et $\alpha$, $\beta > 0$. Calculer $\int_{\Delta}\mathrm{e}^{-\alpha x}\mathrm{e}^{-\beta y}\,\mathrm{d} x\,\mathrm{d} y$.
  corrige: |
    **1.** En intégrant d'abord en $y$, $\int_{0}^{1}x\mathrm{e}^{xy}\,\mathrm{d} y = \mathrm{e}^{x} - 1$, puis $\int_{0}^{1}(\mathrm{e}^{x} - 1)\,\mathrm{d} x = \boxed{\mathrm{e} - 2}$. L'autre ordre conduit à un calcul plus pénible : Tonelli permet de choisir.

    **2.** Par Tonelli, 
    $$\int_{\Delta}\mathrm{e}^{-\alpha x}\mathrm{e}^{-\beta y} = \int_{0}^{+\infty}\mathrm{e}^{-\alpha x}\Big(\int_{x}^{+\infty}\mathrm{e}^{-\beta y}\,\mathrm{d} y\Big)\mathrm{d} x = \int_{0}^{+\infty}\frac{\mathrm{e}^{-(\alpha + \beta)x}}{\beta}\,\mathrm{d} x = \boxed{\frac{1}{\beta(\alpha + \beta)}}\text{.}$$
     Multipliée par $\alpha\beta$, c'est la probabilité $\frac{\alpha}{\alpha + \beta}$ qu'une variable exponentielle de paramètre $\alpha$ soit inférieure à une variable exponentielle indépendante de paramètre $\beta$.
- id: "l3-in-07-11"
  feuille: "f-l3-in-07"
  numero: 11
  partie: "Calculs d'intégrales et de volumes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["calculs d'intégrales et de volumes", sections, calcul de volumes]
  noeuds: [m-fubini, m-produit]
  notions: [integrale-iteree, section-partie-produit]
  source: "Lyon 1 (TD05 2020), exercices 6, 7, 8 (b)-(d) et 9"
  page_enonce: 3
  page_corrige: 4
  enonce: |
    **1.** *Identité d'Archimède.* Dans $\mathbb{R}^{3}$, soit la demi-boule $D = \{z \geqslant 0, x^{2} + y^{2} + z^{2} \leqslant 1\}$, le cône $K = \{0 \leqslant z \leqslant 1, x^{2} + y^{2} \leqslant z^{2}\}$ et le cylindre $C = \{0 \leqslant z \leqslant 1, x^{2} + y^{2} \leqslant 1\}$. En comparant les aires de leurs sections à la hauteur $z$, montrer que $\lambda(C) = \lambda(D) + \lambda(K)$, et vérifier cette identité à l'aide de formules connues.

    **2.** Calculer le volume d'un cylindre plein, pas forcément circulaire ni droit, en fonction de l'aire de sa base et de sa hauteur. Que dire dans $\mathbb{R}^{n}$ ?

    **3.** Calculer le volume d'une pyramide de $\mathbb{R}^{3}$ en fonction de l'aire de sa base et de sa hauteur. Généraliser à d'autres formes et à d'autres dimensions, et montrer que deux pyramides de même base et de même hauteur ont le même volume (*principe de Cavalieri*).

    **4.** Calculer le volume de l'intersection de deux cylindres pleins circulaires droits infinis de rayon $1$, dont les axes sont concourants et orthogonaux.
  corrige: |
    **1.** À la hauteur $z \in [0, 1]$, les sections sont des disques d'aires $\pi$ pour $C$, $\pi(1 - z^{2})$ pour $D$ et $\pi z^{2}$ pour $K$, et $\pi = \pi(1 - z^{2}) + \pi z^{2}$. En intégrant en $z$ (théorème 1), $\lambda(C) = \lambda(D) + \lambda(K)$, soit $\pi = \frac{2\pi}{3} + \frac{\pi}{3}$.

    ![Figure](documents/figures/4fba62a318c013df.svg)

    À chaque hauteur $z$, la section du cylindre (aire $\pi$, carmin) se partage entre celle de la demi-boule (ardoise, au-dessus de la parabole) et celle du cône (ocre, au-dessous). Les aires totales, $\frac{2\pi}{3}$ et $\frac{\pi}{3}$, sont les volumes : l'identité donne celui de la demi-boule à partir des volumes, élémentaires, du cylindre et du cône.

    **2.** Si le cylindre est $\{b + sv ; b \in B, s \in [0, 1]\}$, de base $B$ dans le plan $z = 0$ et de hauteur $h$ (la troisième coordonnée de $v$), ses sections horizontales sont des translatées de $B$, de même aire. Par le théorème 1, $\boxed{\text{volume} = \lambda_{2}(B)h}$, et, dans $\mathbb{R}^{n}$, $\lambda_{n-1}(B)h$.

    **3.** Pour une pyramide de sommet $S$ à la hauteur $h$ et de base $B$, la section à la hauteur $z$ est l'image de $B$ par l'homothétie de centre $S$ et de rapport $\frac{h - z}{h}$, d'aire $\lambda(B)\big(\frac{h - z}{h}\big)^{2}$ (chapitre 2, prop. 12). Donc 
    $$\text{volume} = \lambda(B)\int_{0}^{h}\Big(1 - \frac{z}{h}\Big)^{2}\mathrm{d} z = \boxed{\frac{\lambda(B)h}{3}}\text{,}$$
     quelle que soit la forme de $B$ (cône, pyramide), et $\frac{\lambda_{n-1}(B)h}{n}$ dans $\mathbb{R}^{n}$. Le volume ne dépend que de l'aire de la base et de la hauteur : c'est le principe de Cavalieri.

    **4.** Les cylindres $\{y^{2} + z^{2} \leqslant 1\}$ et $\{x^{2} + z^{2} \leqslant 1\}$ ont pour intersection, à $z$ fixé, le carré $|x|, |y| \leqslant \sqrt{1 - z^{2}}$, d'aire $4(1 - z^{2})$ ; le volume est $\int_{-1}^{1}4(1 - z^{2})\,\mathrm{d} z = \boxed{\frac{16}{3}}$.
