  enonce: |
    On note $\mathcal{L}_{n}$ la tribu de Lebesgue de $\mathbb{R}^{n}$, $\nu_{n}$ la mesure de Lebesgue sur $\mathcal{B}(\mathbb{R}^{n})$ et $\lambda_{n}$ sa complétée sur $\mathcal{L}_{n}$. Prouver ou réfuter :

    **1.** $\mathcal{T}_{1} \otimes \mathcal{T}_{2} = \{A \times B ; A \in \mathcal{T}_{1}, B \in \mathcal{T}_{2}\}$ (on pourra chercher, si $E$ a au moins deux éléments, une partie de $E \times E$ qui ne soit pas un rectangle) ;

    **2.** $\mathcal{B}(\mathbb{R}^{n}) \otimes \mathcal{B}(\mathbb{R}^{m}) = \mathcal{B}(\mathbb{R}^{n+m})$, et $\nu_{n} \otimes \nu_{m} = \nu_{n+m}$ ;

    **3.** $\mathcal{L}_{n} \otimes \mathcal{L}_{m} = \mathcal{L}_{n+m}$, et $\lambda_{n} \otimes \lambda_{m} = \lambda_{n+m}$ ;

    **4.** si $\mu_{1}$, $\mu_{2}$ sont $\sigma$-finies, $E \in \mathcal{T}_{1} \otimes \mathcal{T}_{2}$ et $\mu_{2}(E_{x}) = 0$ pour presque tout $x$, alors $(\mu_{1} \otimes \mu_{2})(E) = 0$ ;

    **5.** si $\mu_{1}$ et $\mu_{2}$ sont $\sigma$-finies, $\mu_{1} \otimes \mu_{2}$ l'est ;

    **6.** toute mesure sur $\mathcal{B}(\mathbb{R}^{2})$ est le produit de deux mesures sur $\mathcal{B}(\mathbb{R})$.
  corrige: |
    **1.** Faux. Si $a \neq b$ sont dans $E$, la partie $A = \{(a, a), (b, b)\}$ est dans $\mathcal{P}(E) \otimes \mathcal{P}(E)$, réunion de deux rectangles. Si l'on avait $A = A_{1} \times A_{2}$, alors $a$, $b \in A_{1}$ et $a$, $b \in A_{2}$, donc $(a, b) \in A$ : absurde. La tribu produit est *engendrée* par les rectangles, mais en contient bien d'autres.

    **2.** Vrai : ce sont les propositions 2 et 3 du cours.

    **3.** Faux. Soit $V \subset \mathbb{R}$ non mesurable (chapitre 2, prop. 14) et $E = V \times \{0\}$. Contenu dans la droite $\mathbb{R} \times \{0\}$, négligeable, $E$ est dans $\mathcal{L}_{2}$, tribu complète. Mais sa section $E^{0} = V$ n'est pas dans $\mathcal{L}_{1}$, donc $E \notin \mathcal{L}_{1} \otimes \mathcal{L}_{1}$ (cours, prop. 1). Ainsi $\mathcal{L}_{n} \otimes \mathcal{L}_{m} \subsetneq \mathcal{L}_{n+m}$, et les mesures $\lambda_{n} \otimes \lambda_{m}$ et $\lambda_{n+m}$, définies sur des tribus différentes, ne sont pas égales : la seconde est la complétée de la première. *Le piège* est que le produit de deux tribus complètes n'est pas complet.

    **4.** Vrai, par le théorème 1 : $(\mu_{1} \otimes \mu_{2})(E) = \int\mu_{2}(E_{x})\,\mathrm{d}\mu_{1}(x) = 0$.

    **5.** Vrai : si $\Omega_{1} = \bigcup A_{k}$ et $\Omega_{2} = \bigcup B_{l}$ avec des mesures finies, les rectangles $A_{k} \times B_{l}$, en quantité dénombrable, recouvrent $\Omega_{1} \times \Omega_{2}$ et sont de mesures finies.

    **6.** Faux. Soit $\mu = \delta_{(0,0)} + \delta_{(1,0)} + \delta_{(0,1)}$. Si $\mu = \alpha \otimes \beta$, alors 
    $$\alpha(\{0\})\beta(\{0\}) = \alpha(\{1\})\beta(\{0\}) = \alpha(\{0\})\beta(\{1\}) = 1,$$
     donc $\alpha(\{1\})$ et $\beta(\{1\})$ sont non nuls, alors que $\alpha(\{1\})\beta(\{1\}) = \mu(\{(1, 1)\}) = 0$.
