  enonce: |
    *Intégrales de Wallis, boules et sphères.* Pour $n \in \mathbb{N}$, soit $I_{n} = \int_{0}^{\pi/2}\sin^{n}x\,\mathrm{d} x$.

    **1.** Calculer $I_{0}$, $I_{1}$, une relation entre $I_{n}$ et $I_{n+2}$, et en déduire $I_{2p}$ et $I_{2p+1}$.

    **2.** Montrer que $I_{2p+1} \leqslant I_{2p} \leqslant I_{2p-1}$, que $\frac{I_{2p}}{I_{2p+1}} \to 1$, et en déduire la *formule de Wallis* $\lim_{p}\frac{1}{p}\Big(\frac{2p(2p - 2)\cdots 2}{(2p - 1)(2p - 3)\cdots 1}\Big)^{2} = \pi$, puis que $I_{n} \sim \sqrt{\frac{\pi}{2n}}$.

    **3.** Montrer, par le théorème de Fubini, que le volume $V_{n}$ de la boule unité de $\mathbb{R}^{n}$ vérifie $V_{n} = 2I_{n}V_{n-1}$, et calculer $V_{n}$ pour $n \leqslant 7$.

    **4.** On définit l'aire de la sphère unité par $A_{n-1} = nV_{n}$. En calculant $\int_{\mathbb{R}^{n}}\mathrm{e}^{-|x|^{2}}\,\mathrm{d} x$ de deux façons, exprimer $A_{n-1}$ à l'aide de $\Gamma$, et calculer $A_{n-1}$ pour $n \leqslant 6$. Montrer que $V_{n} \to 0$ quand $n \to +\infty$.
  corrige: |
    **1.** $I_{0} = \frac{\pi}{2}$, $I_{1} = 1$, et une intégration par parties donne $I_{n+2} = \frac{n + 1}{n + 2}I_{n}$, d'où 
    $$I_{2p} = \frac{(2p - 1)(2p - 3)\cdots 1}{2p(2p - 2)\cdots 2}\cdot\frac{\pi}{2}, \qquad I_{2p+1} = \frac{2p(2p - 2)\cdots 2}{(2p + 1)(2p - 1)\cdots 1}.$$

    **2.** $(\sin^{n}x)$ décroît avec $n$ sur $[0, \frac{\pi}{2}]$, d'où l'encadrement, et $1 \leqslant \frac{I_{2p}}{I_{2p+1}} \leqslant \frac{I_{2p-1}}{I_{2p+1}} = \frac{2p + 1}{2p} \to 1$. Avec $P_{p} = \frac{2p(2p - 2)\cdots 2}{(2p - 1)\cdots 1}$, $\frac{I_{2p}}{I_{2p+1}} = \frac{\pi}{2}\cdot\frac{2p + 1}{P_{p}^{2}} \to 1$, d'où $\frac{P_{p}^{2}}{p} \to \pi$. Enfin, la relation de récurrence montre que $nI_{n}I_{n-1}$ est constant, égal à $I_{1}I_{0} = \frac{\pi}{2}$, et comme $I_{n} \sim I_{n-1}$, $\boxed{I_{n} \sim \sqrt{\frac{\pi}{2n}}}$.

    **3.** Par Fubini, la section de la boule à $x_{n} = t$ est une boule de rayon $\sqrt{1 - t^{2}}$ de $\mathbb{R}^{n-1}$, et, avec $t = \cos\theta$, 
    $$V_{n} = V_{n-1}\int_{-1}^{1}(1 - t^{2})^{\frac{n-1}{2}}\,\mathrm{d} t = V_{n-1}\int_{0}^{\pi}\sin^{n}\theta\,\mathrm{d}\theta = 2I_{n}V_{n-1}.$$
     On obtient $V_{1} = 2$, $V_{2} = \pi$, $V_{3} = \frac{4\pi}{3}$, $V_{4} = \frac{\pi^{2}}{2}$, $V_{5} = \frac{8\pi^{2}}{15}$, $V_{6} = \frac{\pi^{3}}{6}$, $V_{7} = \frac{16\pi^{3}}{105}$.

    **4.** Par la formule des fonctions radiales, $\pi^{n/2} = \int\mathrm{e}^{-|x|^{2}} = nV_{n}\int_{0}^{+\infty}r^{n-1}\mathrm{e}^{-r^{2}}\,\mathrm{d} r = A_{n-1}\frac{\Gamma(n/2)}{2}$, d'où $\boxed{A_{n-1} = \frac{2\pi^{n/2}}{\Gamma(n/2)}}$ : $A_{0} = 2$, $A_{1} = 2\pi$, $A_{2} = 4\pi$, $A_{3} = 2\pi^{2}$, $A_{4} = \frac{8\pi^{2}}{3}$, $A_{5} = \pi^{3}$. Comme $V_{n} = 2I_{n}I_{n-1}V_{n-2} = \frac{2\pi}{n}V_{n-2}$, $V_{n} \to 0$.

    ![Figure](documents/figures/c74d6cb8445768ea.svg)

    Le volume $V_{n}$ de la boule unité croît jusqu'à $n = 5$ (carmin), puis décroît vers $0$, de plus en plus vite : en grande dimension, presque tout le volume du cube $[-1, 1]^{n}$, qui vaut $2^{n}$, est hors de la boule.
- id: "l3-in-07-20"
  feuille: "f-l3-in-07"
  numero: 20
  partie: "Applications"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [applications de Fubini]
  noeuds: [m-fubini]
  notions: [integrale-iteree]
  source: "Lyon 1 (TD03 2020), exercices 27 et 28 ; Exo7 (fic00144), exercice 6 (ii) ; Féjoz (exosIntegration), exercice 2.4"
  page_enonce: 5
  page_corrige: 8
  enonce: |
    *Ensembles de niveau.* Soit $\mu$ $\sigma$-finie, $f : \Omega \to [0, +\infty[$ mesurable, et $F_{f}(t) = \mu(\{f > t\})$.

    **1.** Montrer que la fonction $F_{f}$ est borélienne, et vérifier directement, pour $f$ étagée, la formule $\int f\,\mathrm{d}\mu = \int_{0}^{+\infty}F_{f}(t)\,\mathrm{d} t$ (cours, prop. 8).

    **2.** Soit $\Phi : [0, +\infty[ \to [0, +\infty[$ croissante, de classe $C^{1}$, telle que $\Phi(0) = 0$. Montrer que $\int\Phi(f)\,\mathrm{d}\mu = \int_{0}^{+\infty}\Phi'(t)F_{f}(t)\,\mathrm{d} t$. En déduire, pour $1 \leqslant p < +\infty$ et $g$ mesurable réelle, $\int|g|^{p}\,\mathrm{d}\mu = p\int_{0}^{+\infty}t^{p-1}\mu(\{|g| > t\})\,\mathrm{d} t$.

    **3.** Pour $p > 0$, calculer l'intégrale $\int_{\{|x| < 1\}}|x|^{-p}\,\mathrm{d} x$ sur $\mathbb{R}^{n}$ à l'aide de la mesure des ensembles $\{|x|^{-p}\chi_{\{|x| < 1\}} > t\}$.

    **4.** Si $\mu$ est une probabilité, traduire la formule de la question 1 en termes de la *fonction de répartition* $G_{f}(t) = \mu(\{f \leqslant t\})$. La formule de la question 1 reste-t-elle vraie pour une fonction $f$ intégrable de signe quelconque ?
  corrige: |
    **1.** $F_{f}$ est décroissante, donc borélienne. Si $f = \sum_{j}c_{j}\chi_{E_{j}}$, avec des $E_{j}$ disjoints et $0 < c_{1} < \dots < c_{k}$, alors $F_{f}(t) = \sum_{c_{j} > t}\mu(E_{j})$, en escalier, et $\int_{0}^{+\infty}F_{f} = \sum_{j}c_{j}\mu(E_{j}) = \int f$.

    **2.** La partie $\{(\omega, t) ; t < f(\omega)\}$ est mesurable, et, par Tonelli, 
    $$\int\Phi(f)\,\mathrm{d}\mu = \int_{\Omega}\Big(\int_{0}^{f(\omega)}\Phi'(t)\,\mathrm{d} t\Big)\mathrm{d}\mu(\omega) = \int_{0}^{+\infty}\Phi'(t)\mu(\{f > t\})\,\mathrm{d} t.$$
     Avec $\Phi(t) = t^{p}$ et $f = |g|$ : $\boxed{\int|g|^{p}\,\mathrm{d}\mu = p\int_{0}^{+\infty}t^{p-1}\mu(\{|g| > t\})\,\mathrm{d} t}$.

    ![Figure](documents/figures/de3728d63c09b701.svg)

    L'aire sous $f$ (ardoise) se découpe en tranches horizontales : à la hauteur $t$ (tirets ocre), la tranche a pour largeur la mesure de $\{f > t\}$ (traits carmin), réunion ici de deux intervalles. Intégrer ces largeurs en $t$ redonne l'aire : c'est l'idée originelle de Lebesgue, qui découpe l'axe des valeurs plutôt que celui des abscisses.

    **3.** Pour $t > 0$, $\{|x|^{-p}\chi_{\{|x| < 1\}} > t\}$ est la boule ouverte de rayon $\min(1, t^{-1/p})$, de mesure $v_{n}\min(1, t^{-n/p})$. Donc l'intégrale vaut $v_{n}\big(1 + \int_{1}^{+\infty}t^{-n/p}\,\mathrm{d} t\big)$, soit $\frac{nv_{n}}{n - p}$ si $p < n$ et $+\infty$ sinon, comme à la feuille 6, exercice 14.

    **4.** $F_{f} = 1 - G_{f}$, et $\int f\,\mathrm{d}\mu = \int_{0}^{+\infty}(1 - G_{f}(t))\,\mathrm{d} t$ : c'est la formule de l'espérance d'une variable positive. Pour $f$ de signe quelconque, la formule est fausse : pour $f = -1$, le membre de droite est nul. La version correcte est $\int f = \int_{0}^{+\infty}\mu(\{f > t\})\,\mathrm{d} t - \int_{0}^{+\infty}\mu(\{f < -t\})\,\mathrm{d} t$, obtenue en appliquant la formule à $f^{+}$ et $f^{-}$.
