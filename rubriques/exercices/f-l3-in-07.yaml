  enonce: |
    Soit $X$ et $Y$ des ensembles au plus dénombrables. Montrer que $\mathcal{P}(X) \otimes \mathcal{P}(Y) = \mathcal{P}(X \times Y)$, et que, si $\mu$ et $\nu$ sont les mesures de comptage sur $X$ et $Y$, $\mu \otimes \nu$ est la mesure de comptage sur $X \times Y$.
  corrige: |
    L'inclusion $\mathcal{P}(X) \otimes \mathcal{P}(Y) \subset \mathcal{P}(X \times Y)$ est claire. Chaque singleton $\{(x, y)\} = \{x\} \times \{y\}$ est un rectangle, et toute partie de $X \times Y$, ensemble au plus dénombrable, est réunion au plus dénombrable de singletons : d'où l'égalité. Les mesures de comptage sur des ensembles dénombrables sont $\sigma$-finies, et $(\mu \otimes \nu)(\{(x, y)\}) = \mu(\{x\})\nu(\{y\}) = 1$ ; par additivité dénombrable, $\mu \otimes \nu(A) = \operatorname{card} A$ pour toute partie $A$.
