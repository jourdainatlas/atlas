  enonce: |
    **1.** Montrer que $\mathcal{B}(\mathbb{R}_{+}) \otimes \mathcal{P}(\mathbb{N})$ est l'ensemble des parties de $\mathbb{R}_{+} \times \mathbb{N}$ de la forme $\bigcup_{n \in \mathbb{N}}(A_{n} \times \{n\})$, avec $A_{n} \in \mathcal{B}(\mathbb{R}_{+})$.

    **2.** Soit $m$ une mesure finie sur $\mathcal{B}(\mathbb{R}_{+})$. Montrer qu'il existe une unique mesure finie $\mu$ sur $\mathcal{B}(\mathbb{R}_{+}) \otimes \mathcal{P}(\mathbb{N})$ telle que $\mu(A \times \{n\}) = \int_{A}\mathrm{e}^{-t}\frac{t^{n}}{n!}\,\mathrm{d} m(t)$ pour tout borélien $A$ et tout $n$.

    **3.** Calculer $\int\mathrm{e}^{\mathrm{i} nt}\,\mathrm{d}\mu(t, n)$ en fonction de l'intégrale d'une fonction sur $\mathbb{R}_{+}$.

    **4.** La mesure $\mu$ est-elle toujours une mesure produit ?
  corrige: |
    **1.** L'ensemble $\mathcal{S}$ des parties $\bigcup_{n}(A_{n} \times \{n\})$ est une tribu : son complémentaire est $\bigcup_{n}({A_{n}}^{c} \times \{n\})$, et une réunion dénombrable se réorganise indice par indice. Il contient les rectangles, puisque $A \times N = \bigcup_{n \in N}(A \times \{n\})$, donc la tribu produit ; inversement, chaque $A_{n} \times \{n\}$ est un rectangle.

    **2.** Les $A_{n}$ sont déterminés par $C$ (ce sont ses sections), et l'on doit poser 
    $$\mu(C) = \sum_{n}\int_{A_{n}}\mathrm{e}^{-t}\frac{t^{n}}{n!}\,\mathrm{d} m(t) \text{ :}$$
     d'où l'unicité. Cette formule définit une mesure, par additivité des séries de termes positifs, de masse totale $\int\mathrm{e}^{-t}\sum_{n}\frac{t^{n}}{n!}\,\mathrm{d} m = m(\mathbb{R}_{+}) < +\infty$.

    **3.** La fonction $\mathrm{e}^{\mathrm{i} nt}$ est bornée et $\mu$ finie ; par convergence dominée, puis en sommant la série exponentielle, 
    $$\int\mathrm{e}^{\mathrm{i} nt}\,\mathrm{d}\mu(t, n) = \sum_{n}\int\mathrm{e}^{\mathrm{i} nt}\mathrm{e}^{-t}\frac{t^{n}}{n!}\,\mathrm{d} m(t) = \boxed{\int_{\mathbb{R}_{+}}\exp\big(t(\mathrm{e}^{\mathrm{i} t} - 1)\big)\,\mathrm{d} m(t)}\text{.}$$

    **4.** Non. Si $m = \delta_{0}$, $\mu = \delta_{0} \otimes \delta_{0}$. Si $m = \delta_{0} + \delta_{2}$ et $\mu = \alpha \otimes \beta$, alors $\alpha(\{0\})\beta(\{n\}) = \mu(\{0\} \times \{n\})$ vaut $1$ si $n = 0$ et $0$ sinon, donc $\beta(\{1\}) = 0$ ; mais $\alpha(\{2\})\beta(\{1\}) = \mu(\{2\} \times \{1\}) = 2\mathrm{e}^{-2} \neq 0$. En probabilités, $\mu$ est la loi d'un couple formé d'un paramètre aléatoire $t$, de loi $m$, et d'une variable de Poisson de paramètre $t$ : les deux coordonnées ne sont pas indépendantes.
