  enonce: |
    *Fonctions plateaux.* Soit $K$ un compact de $\mathbb{R}^{d}$ et $\Omega$ un ouvert contenant $K$. Pour $\alpha > 0$, soit $K_{\alpha} = \{x ; \mathrm{dist}(x, K) \leqslant \alpha\}$.

    **1.** Justifier qu'il existe $\varepsilon > 0$ tel que $K_{2\varepsilon} \subset \Omega$.

    **2.** Montrer que $\varphi = \chi_{K_{\varepsilon}} * \rho_{\varepsilon}$ est de classe $C^{\infty}$, à valeurs dans $[0, 1]$, égale à $1$ sur $K$ et nulle hors de $\Omega$.
  corrige: |
    **1.** La distance du compact $K$ au fermé $\mathbb{R}^{d} \setminus \Omega$, disjoint, est strictement positive (ou infinie) ; on prend $\varepsilon$ inférieur à son tiers.

    **2.** Par la proposition 2, $\varphi$ est de classe $C^{\infty}$ et nulle hors de $K_{\varepsilon} + \overline{B}(0, \varepsilon) \subset K_{2\varepsilon} \subset \Omega$. On a $0 \leqslant \varphi(x) = \mathop{\displaystyle \int_{K_{\varepsilon}}}\rho_{\varepsilon}(x - y)\,\mathrm{d} y \leqslant \mathop{\displaystyle \int}\rho_{\varepsilon} = 1$, et, pour $x \in K$, $B(x, \varepsilon) \subset K_{\varepsilon}$, d'où $\varphi(x) = \mathop{\displaystyle \int}\rho_{\varepsilon} = 1$.

    ![Figure](documents/figures/98f1c54409c23e1c.svg)

    Sur $\mathbb{R}$, avec $K = [-1, 1]$ (carmin) et $\varepsilon = \dfrac{1}{2}$ : la fonction plateau $\varphi = \chi_{K_{\varepsilon}} * \rho_{\varepsilon}$ (ardoise) vaut $1$ sur $K$, est nulle hors de $[-2, 2] = K_{2\varepsilon}$, et passe de l'une à l'autre de façon $C^{\infty}$ sur les bords de $K_{\varepsilon} = [-\dfrac{3}{2}, \dfrac{3}{2}]$ (ocre).
- id: "l3-in-09-12"
  feuille: "f-l3-in-09"
  numero: 12
  partie: "Régularité, supports"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["régularité et support d'une convolée"]
  noeuds: [ds-regularisation]
  notions: [produit-convolution, support-fonction]
  source: "Bibmath, exercices 5, 22 et 25"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    *Moyennes glissantes.* Soit $f \in L^{p}(\mathbb{R})$, $1 \leqslant p \leqslant +\infty$, et $F(x) = \mathop{\displaystyle \int_{x}^{x+1}}f(y)\,\mathrm{d} y$.

    **1.** Écrire $F$ comme un produit de convolution. Montrer que $F$ est continue et tend vers $0$ à l'infini si $p < +\infty$, et que $F \in L^{p}$ si $1 < p < +\infty$. Si $p = 1$, montrer que $F \in L^{q}$ pour tout $q \in [1, +\infty]$. Que dire si $p = +\infty$ ?

    **2.** Soit $f \in L^{1}(\mathbb{R})$. Vérifier que l'intégrale de $f$ sur l'intervalle de centre $x$ et de longueur $2h$ vaut $\chi_{[-h, h]} * f(x)$. En déduire que, si $\mathop{\displaystyle \int_{I}}f = 0$ pour tout intervalle borné $I$, alors $f = 0$ presque partout.

    **3.** Soit $f \in L^{1}(\mathbb{R})$, $F(x) = \mathop{\displaystyle \int_{0}^{x}}f$ et $G_{h}(x) = \dfrac{F(x + h) - F(x)}{h}$. Montrer que $G_{h} \to f$ dans $L^{1}$ quand $h \to 0$.
  corrige: |
    **1.** $F = f * \chi_{[-1, 0]}$, puisque $\chi_{[-1, 0]}(x - y) = 1$ si et seulement si $x \leqslant y \leqslant x + 1$. Pour $1 < p < +\infty$, $\chi_{[-1, 0]} \in L^{1} \cap L^{q}$ : $F$ est continue et tend vers $0$ à l'infini (th. 1), et $\lVert F \rVert_{p} \leqslant \lVert f \rVert_{p}$. Pour $p = 1$, $F$ est continue, $|F(x)| \leqslant \mathop{\displaystyle \int_{x}^{x+1}}|f| \to 0$ à l'infini, $\lVert F \rVert_{1} \leqslant \lVert f \rVert_{1}$ et $\lVert F \rVert_{\infty} \leqslant \lVert f \rVert_{1}$ ; comme $|F|^{q} \leqslant \lVert F \rVert_{\infty}^{q-1}|F|$, $F$ est dans tous les $L^{q}$. Pour $p = \infty$, $F$ est bornée et lipschitzienne, de constante $2\lVert f \rVert_{\infty}$, mais ne tend pas forcément vers $0$ : pour $f = 1$, $F = 1$.

    **2.** $\chi_{[-h, h]} * f(x) = \mathop{\displaystyle \int_{x-h}^{x+h}}f$. Si toutes ces intégrales sont nulles, $f * \dfrac{1}{2h}\chi_{[-h, h]} = 0$ pour tout $h > 0$ ; ces noyaux forment une approximation de l'unité quand $h \to 0$, et le théorème 2 donne $f = 0$ dans $L^{1}$. C'est une autre démonstration de l'exercice 6 de la feuille 4.

    **3.** Pour $h > 0$, $G_{h} = f * \dfrac{1}{h}\chi_{[-h, 0]}$, et pour $h < 0$, $G_{h} = f * \dfrac{1}{|h|}\chi_{[0, |h|]}$ ; dans les deux cas, le noyau est positif, d'intégrale $1$ et porté par $[-|h|, |h|]$ : $G_{h} \to f$ dans $L^{1}$ par le théorème 2. La dérivée « au sens $L^{1}$ » de la primitive $F$ est $f$, même si $F$ n'est dérivable que presque partout.
- id: "l3-in-09-13"
  feuille: "f-l3-in-09"
  numero: 13
  partie: "Régularité, supports"
  etoiles: 3
  types: [Démonstration]
  mots_cles: ["régularité et support d'une convolée"]
  noeuds: [ds-regularisation]
  notions: [produit-convolution, support-fonction]
  source: "Bibmath, exercices 13 et 24"
  page_enonce: 4
  page_corrige: 5
  enonce: |
    **1.** Soit $f \in L^{1}(\mathbb{R}^{n})$. Montrer que $T : g \mapsto f * g$ est un opérateur continu de $L^{2}(\mathbb{R}^{n})$ dans lui-même, et calculer son adjoint.

    **2.** Soit $h \in L^{p}(\mathbb{R}^{d})$. En testant $T_{h} : f \mapsto f * h$ sur une approximation de l'unité, montrer que la norme de $T_{h}$, comme opérateur de $L^{1}$ dans $L^{p}$, vaut $\lVert h \rVert_{p}$ si $p < +\infty$.

    **3.** Soit $h \in L^{1}(\mathbb{R}^{d})$ positive non nulle, $1 \leqslant p < +\infty$, et $T_{h} : f \mapsto f * h$ sur $L^{p}$. Avec $h_{k}(x) = \dfrac{k^{d}h(kx)}{\lVert h \rVert_{1}}$ et $f_{k}(x) = f(x/k)$, montrer que $f * h_{k}(x) = \dfrac{1}{\lVert h \rVert_{1}}(f_{k} * h)(kx)$, et en déduire que la norme de $T_{h}$ dans $L^{p}$ vaut $\lVert h \rVert_{1}$.
  corrige: |
    **1.** $\lVert f * g \rVert_{2} \leqslant \lVert f \rVert_{1}\lVert g \rVert_{2}$ (th. 1). Pour $g$, $h \in L^{2}$, la fonction $(x, y) \mapsto f(x - y)g(y)\overline{h(x)}$ est intégrable, puisque $\mathop{\displaystyle \int}\mathop{\displaystyle \int}|f(x - y)||g(y)||h(x)| \leqslant \lVert |f| * |g| \rVert_{2}\lVert h \rVert_{2}$, et Fubini donne 
    $$\langle Tg, h\rangle = \int g(y)\overline{\int\overline{f(x - y)}h(x)\,\mathrm{d} x}\,\mathrm{d} y = \langle g, \tilde{f} * h\rangle, \qquad \tilde{f}(z) = \overline{f(-z)}.$$
     L'adjoint est $\boxed{T^{*}h = \tilde{f} * h}$ ; $T$ est autoadjoint si $f(-z) = \overline{f(z)}$.

    **2.** Si $(\varphi_{k})$ est une approximation de l'unité, $\lVert \varphi_{k} \rVert_{1} = 1$ et $T_{h}\varphi_{k} = \varphi_{k} * h \to h$ dans $L^{p}$ (th. 2). Donc $\lVert T_{h} \rVert \geqslant \mathop{\displaystyle \lim}\lVert \varphi_{k} * h \rVert_{p} = \lVert h \rVert_{p}$, et l'inégalité inverse est le théorème 1.

    **3.** La suite $(h_{k})$ est une approximation de l'unité : positive, d'intégrale $1$ par homothétie, et 
    $$\int_{|x| \geqslant \delta}h_{k} = \frac{1}{\lVert h \rVert_{1}}\int_{|u| \geqslant k\delta}h \to 0.$$
     Le changement de variable $z = ky$ donne $f * h_{k}(x) = \dfrac{1}{\lVert h \rVert_{1}}\mathop{\displaystyle \int} f\big(x - \dfrac{z}{k}\big)h(z)\,\mathrm{d} z = \dfrac{1}{\lVert h \rVert_{1}}(f_{k} * h)(kx)$. Comme $\lVert u(k\cdot) \rVert_{p} = k^{-d/p}\lVert u \rVert_{p}$ et $\lVert f_{k} \rVert_{p} = k^{d/p}\lVert f \rVert_{p}$, 
    $$\lVert f * h_{k} \rVert_{p} \leqslant \frac{k^{-d/p}}{\lVert h \rVert_{1}}\lVert T_{h} \rVert\lVert f_{k} \rVert_{p} = \frac{\lVert T_{h} \rVert}{\lVert h \rVert_{1}}\lVert f \rVert_{p}.$$
     Quand $k \to +\infty$, $f * h_{k} \to f$ dans $L^{p}$, d'où $\lVert T_{h} \rVert \geqslant \lVert h \rVert_{1}$, et l'égalité.
- id: "l3-in-09-14"
  feuille: "f-l3-in-09"
  numero: 14
  partie: "Régularité, supports"
  etoiles: 3
  types: [Démonstration]
  mots_cles: ["régularité et support d'une convolée"]
  noeuds: [ds-regularisation]
  notions: [produit-convolution, support-fonction]
  source: "Bibmath, exercice 17"
  page_enonce: 4
  page_corrige: 6
  enonce: |
    On note $C_{0}(\mathbb{R})$ l'espace des fonctions continues tendant vers $0$ à l'infini, muni de la norme uniforme. Un opérateur (application linéaire continue) $T : L^{2}(\mathbb{R}) \to C_{0}(\mathbb{R})$ *commute avec les translations* si $T(\tau_{a}f) = \tau_{a}(Tf)$ pour tous $f$ et $a$.

    **1.** Pour $\varphi \in L^{2}(\mathbb{R})$, montrer que $T_{\varphi} : f \mapsto f * \varphi$ est un tel opérateur.

    **2.** Soit $T$ un tel opérateur. Montrer qu'il existe $\varphi \in L^{2}$ telle que $(Tf)(0) = \mathop{\displaystyle \int} f(y)\varphi(-y)\,\mathrm{d} y$ pour toute $f$, et en déduire que $T = T_{\varphi}$.
  corrige: |
    **1.** Pour $f$, $\varphi \in L^{2}$, $f * \varphi \in C_{0}(\mathbb{R})$ et $\lVert f * \varphi \rVert_{\infty} \leqslant \lVert f \rVert_{2}\lVert \varphi \rVert_{2}$ (th. 1) : $T_{\varphi}$ est linéaire continue, et commute avec les translations par l'exercice 6.

    **2.** $f \mapsto (Tf)(0)$ est une forme linéaire continue sur $L^{2}$, puisque $|(Tf)(0)| \leqslant \lVert Tf \rVert_{\infty} \leqslant \lVert T \rVert\lVert f \rVert_{2}$. Par la proposition 5 du chapitre 8, il existe $\psi \in L^{2}$ telle que $(Tf)(0) = \mathop{\displaystyle \int} f\overline{\psi}$ ; on pose $\varphi(y) = \overline{\psi(-y)}$. Alors, avec $\tau_{-a}u(x) = u(x + a)$, 
    $$(Tf)(a) = \big(\tau_{-a}(Tf)\big)(0) = \big(T(\tau_{-a}f)\big)(0) = \int f(y + a)\varphi(-y)\,\mathrm{d} y = \int f(a - u)\varphi(u)\,\mathrm{d} u = f * \varphi(a).$$
     Ainsi les opérateurs qui commutent avec les translations sont exactement les convolutions : c'est la raison profonde de l'omniprésence de la convolution en analyse et en traitement du signal.
- id: "l3-in-09-15"
  feuille: "f-l3-in-09"
  numero: 15
  partie: "Densité, approximations de l'unité"
  etoiles: 1
  types: [Démonstration]
  mots_cles: ["densité, approximations de l'unité"]
  noeuds: [ds-regularisation, lp-densite]
  notions: [noyau-regularisant, espace-Lp]
  source: "Lyon 1 (TD07 2020), exercice 25"
  page_enonce: 4
  page_corrige: 6
  enonce: |
    Soit $\Omega$ un ouvert de $\mathbb{R}^{n}$, $1 \leqslant p_{1}, \dots, p_{k} < +\infty$ et $f \in L^{p_{1}}(\Omega) \cap \dots \cap L^{p_{k}}(\Omega)$. Montrer qu'il existe une suite $(\varphi_{j})$ de $C_{c}^{\infty}(\Omega)$ telle que $\varphi_{j} \to f$ dans chacun des $L^{p_{i}}(\Omega)$.
  corrige: |
    Soit $K_{j} = \{x \in \Omega ; |x| \leqslant j, \mathrm{dist}(x, \mathbb{R}^{n} \setminus \Omega) \geqslant \dfrac{1}{j}\}$, compacts croissants de réunion $\Omega$, et $f_{j} = f\chi_{K_{j}}$. Par convergence dominée, $f_{j} \to f$ dans chaque $L^{p_{i}}$. Pour $\varepsilon < \dfrac{1}{2j}$, $\rho_{\varepsilon} * f_{j}$ est de classe $C^{\infty}$ et nulle hors de $K_{j} + \overline{B}(0, \varepsilon)$, compact contenu dans $\Omega$ (prop. 2), et $\rho_{\varepsilon} * f_{j} \to f_{j}$ dans chaque $L^{p_{i}}$ quand $\varepsilon \to 0$ (th. 2). Pour chaque $j$, on choisit $\varepsilon_{j}$ tel que $\lVert \rho_{\varepsilon_{j}} * f_{j} - f_{j} \rVert_{p_{i}} \leqslant \dfrac{1}{j}$ pour tous les $i$, en nombre fini : $\varphi_{j} = \rho_{\varepsilon_{j}} * f_{j}$ convient. Le même procédé donne une approximation *simultanée*, ce que la seule densité dans chaque $L^{p_{i}}$ ne garantit pas.
- id: "l3-in-09-16"
  feuille: "f-l3-in-09"
  numero: 16
  partie: "Densité, approximations de l'unité"
  etoiles: 1
  types: [Démonstration]
  mots_cles: ["densité, approximations de l'unité"]
  noeuds: [ds-regularisation, lp-densite]
  notions: [noyau-regularisant, espace-Lp]
  source: "Lyon 1 (TD07 2020), exercice 26"
  page_enonce: 4
  page_corrige: 6
  enonce: |
    Soit $\Omega$ un ouvert non vide de $\mathbb{R}^{n}$. Montrer que $C^{\infty}(\Omega) \cap L^{\infty}(\Omega)$ et $C_{c}^{\infty}(\Omega)$ ne sont pas denses dans $L^{\infty}(\Omega)$. Quelle est l'adhérence de $C_{c}(\mathbb{R}^{n})$ dans $L^{\infty}(\mathbb{R}^{n})$ ?
  corrige: |
    Soit $B$ une boule ouverte dont l'adhérence est dans $\Omega$, $f = \chi_{B}$, et $g$ continue avec $\lVert f - g \rVert_{\infty} = \eta < \dfrac{1}{2}$. Alors $g \geqslant 1 - \eta$ presque partout sur $B$, et $g \leqslant \eta$ presque partout sur $\Omega \setminus \overline{B}$ ; par continuité, et parce que toute boule est de mesure positive, ces inégalités valent partout sur $\overline{B}$ et sur l'adhérence de $\Omega \setminus \overline{B}$. En un point du bord de $B$, on aurait $1 - \eta \leqslant \eta$ : absurde. Donc $f$ est à distance $\geqslant \dfrac{1}{2}$ des fonctions continues. L'adhérence de $C_{c}(\mathbb{R}^{n})$ dans $L^{\infty}$ est l'ensemble des (classes de) fonctions continues tendant vers $0$ à l'infini : une suite de fonctions continues de Cauchy dans $L^{\infty}$ est uniformément de Cauchy (exercice 9 de la feuille 8), et sa limite uniforme est continue et tend vers $0$ ; inversement, une telle fonction est limite uniforme de ses produits par des fonctions plateaux (exercice 11).
- id: "l3-in-09-17"
  feuille: "f-l3-in-09"
  numero: 17
  partie: "Densité, approximations de l'unité"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["densité, approximations de l'unité"]
  noeuds: [ds-regularisation, lp-densite]
  notions: [noyau-regularisant, espace-Lp]
  source: "Exo7 (fic00149), exercice 1"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    *$L^{p}(\mathbb{R}^{n})$ est séparable pour $1 \leqslant p < +\infty$.* Pour $j \geqslant 1$ et $m \in \mathbb{Z}^{n}$, soit $\Gamma_{j, m} = \mathop{\displaystyle \prod_{i}}]2^{-j}m_{i}, 2^{-j}(m_{i} + 1)]$, et $\mathcal{F}_{j}$ l'ensemble des combinaisons $\mathop{\displaystyle \sum_{m}}c_{m}\chi_{\Gamma_{j, m}}$ à coefficients rationnels presque tous nuls.

    **1.** Montrer que, pour tout $j$, les $\Gamma_{j, m}$ partitionnent $\mathbb{R}^{n}$, et que $\mathcal{F} = \mathop{\displaystyle \bigcup_{j}}\mathcal{F}_{j}$ est dénombrable.

    **2.** Soit $\tilde{f}$ continue à support compact et $\varepsilon > 0$. Montrer qu'il existe $j$ tel que $|\tilde{f}(x) - \tilde{f}(y)| \leqslant \varepsilon$ pour $x$, $y$ dans un même $\Gamma_{j, m}$, puis un élément $\varphi \in \mathcal{F}$ tel que $\lVert \tilde{f} - \varphi \rVert_{p}$ soit petit.

    **3.** Conclure à l'aide du théorème 3 du cours.
  corrige: |
    **1.** Chaque $x_{i}$ est dans un unique intervalle $]2^{-j}m_{i}, 2^{-j}(m_{i} + 1)]$, avec $m_{i} = \lceil 2^{j}x_{i}\rceil - 1$ : les $\Gamma_{j, m}$ partitionnent $\mathbb{R}^{n}$. $\mathcal{F}_{j}$ est en bijection avec les suites presque nulles de $\mathbb{Q}^{\mathbb{Z}^{n}}$, ensemble dénombrable (réunion sur les parties finies de $\mathbb{Z}^{n}$ de produits finis de $\mathbb{Q}$), et $\mathcal{F}$ est une réunion dénombrable d'ensembles dénombrables.

    **2.** $\tilde{f}$ est uniformément continue, nulle hors de $B(0, M)$. Si $2^{-j}\sqrt{n} < \delta$, où $\delta$ est associé à $\varepsilon$ par la continuité uniforme, deux points d'un même cube sont à distance $< \delta$. On choisit $c_{m}$ rationnel (parties réelle et imaginaire rationnelles dans le cas complexe) à moins de $\varepsilon$ de la valeur de $\tilde{f}$ en un point de $\Gamma_{j, m}$, et nul si $\Gamma_{j, m}$ ne rencontre pas $B(0, M)$. Alors $|\tilde{f} - \varphi| \leqslant 2\varepsilon$ partout, et $\varphi = \tilde{f} = 0$ hors de $B(0, M + 1)$ dès que $2^{-j}\sqrt{n} < 1$ : $\lVert \tilde{f} - \varphi \rVert_{p} \leqslant 2\varepsilon\lambda(B(0, M + 1))^{1/p}$.

    **3.** $C_{c}$ est dense dans $L^{p}$ (th. 3), et $\mathcal{F}$ est dense dans $C_{c}$ pour $\lVert \cdot \rVert_{p}$ : $\mathcal{F}$ est une partie dénombrable dense de $L^{p}$.
