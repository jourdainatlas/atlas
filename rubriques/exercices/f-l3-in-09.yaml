  enonce: |
    *Approximations de l'unité de signe quelconque.* Soit $(\varphi_{k})$ une suite de fonctions intégrables sur $\mathbb{R}^{n}$ telles que $\mathop{\displaystyle \int}\varphi_{k} = 1$, $\mathop{\displaystyle \int}|\varphi_{k}| \leqslant K$ pour une constante $K$, et $\mathop{\displaystyle \int_{|x| > \varepsilon}}|\varphi_{k}| \to 0$ pour tout $\varepsilon > 0$. Soit $f \in L^{p}$, $1 \leqslant p < +\infty$.

    **1.** Montrer, à l'aide de l'inégalité de Hölder pour la mesure $|\varphi_{k}(y)|\,\mathrm{d} y$, que 
    $$|\varphi_{k} * f(x) - f(x)|^{p} \leqslant K^{p/q}\int|f(x - y) - f(x)|^{p}|\varphi_{k}(y)|\,\mathrm{d} y.$$

    **2.** En déduire que $\lVert \varphi_{k} * f - f \rVert_{p}^{p} \leqslant K^{p/q}\mathop{\displaystyle \int}\lVert \tau_{y}f - f \rVert_{p}^{p}|\varphi_{k}(y)|\,\mathrm{d} y$, puis que $\varphi_{k} * f \to f$ dans $L^{p}$.
  corrige: |
    **1.** Comme $\mathop{\displaystyle \int}\varphi_{k} = 1$, $\varphi_{k} * f(x) - f(x) = \mathop{\displaystyle \int}(f(x - y) - f(x))\varphi_{k}(y)\,\mathrm{d} y$. Pour $p > 1$, Hölder pour la mesure $|\varphi_{k}(y)|\,\mathrm{d} y$, de masse $\leqslant K$, donne l'inégalité ; pour $p = 1$, elle est immédiate avec $K^{0} = 1$.

    **2.** En intégrant en $x$ et par Tonelli, on obtient la première inégalité. Soit $\varepsilon > 0$ et $\delta > 0$ tel que $\lVert \tau_{y}f - f \rVert_{p} \leqslant \varepsilon$ pour $|y| \leqslant \delta$ (prop. 1). Comme $\lVert \tau_{y}f - f \rVert_{p} \leqslant 2\lVert f \rVert_{p}$, 
    $$\lVert \varphi_{k} * f - f \rVert_{p}^{p} \leqslant K^{p/q}\Big(\varepsilon^{p}K + (2\lVert f \rVert_{p})^{p}\int_{|y| > \delta}|\varphi_{k}|\Big),$$
     et le second terme tend vers $0$. La positivité des noyaux n'est donc pas nécessaire : il suffit que leurs normes $L^{1}$ soient bornées.
