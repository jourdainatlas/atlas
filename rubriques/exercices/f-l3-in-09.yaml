  enonce: |
    *Théorème de Steinhaus.* Soit $A$, $B$ des parties mesurables de $\mathbb{R}^{n}$ de mesures strictement positives. On veut montrer que $A + B = \{a + b ; a \in A, b \in B\}$ contient une boule ouverte non vide.

    **1.** Montrer que l'on peut supposer $A$ et $B$ compacts, donc de mesures finies.

    **2.** Montrer que $f = \chi_{A} * \chi_{B}$ est continue, calculer $\mathop{\displaystyle \int} f$, et conclure.

    **3.** En déduire que, si $\lambda(A) > 0$, $A - A$ contient un voisinage de $0$.
  corrige: |
    **1.** Par régularité intérieure (chapitre 2, prop. 11), $A$ et $B$ contiennent des compacts $A'$, $B'$ de mesures strictement positives, et $A' + B' \subset A + B$.

    **2.** $\chi_{A}$, $\chi_{B} \in L^{2}$ : $f$ est continue (th. 1). Par Tonelli, $\mathop{\displaystyle \int} f = \lambda(A)\lambda(B) > 0$, donc $f(x_{0}) > 0$ en un point, puis sur une boule $B(x_{0}, r)$. Or $f(x) = \lambda(A \cap (x - B)) > 0$ entraîne l'existence de $b \in B$ avec $x - b \in A$, c'est-à-dire $x \in A + B$ : $B(x_{0}, r) \subset A + B$.

    **3.** Avec $B = -A$ (compact), $f(x) = \lambda(A \cap (x + A))$, et $f(0) = \lambda(A) > 0$ : par continuité, $f > 0$ sur un voisinage de $0$, contenu dans $A - A$. Par exemple, l'ensemble de Cantor $K$, négligeable, vérifie pourtant $K - K = [-1, 1]$ : la condition $\lambda(A) > 0$ est suffisante, pas nécessaire.
