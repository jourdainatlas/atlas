  enonce: |
    *Équations de Cauchy.* On considère les équations fonctionnelles 
    $$f : \mathbb{R} \to \mathbb{R}, \quad f(x + y) = f(x) + f(y), \qquad g : \mathbb{R} \to \mathbb{U} = \{|z| = 1\}, \quad g(x + y) = g(x)g(y).$$
     On admet que les solutions continues sont $f(x) = Ax$ et $g(x) = \mathrm{e}^{\mathrm{i} Ax}$, $A \in \mathbb{R}$. On veut montrer que ce sont les seules solutions mesurables. On admet provisoirement que, si $g \in L^{\infty}(\mathbb{R})$ n'est pas nulle, il existe $\psi \in C_{c}^{\infty}(\mathbb{R})$, à valeurs complexes, telle que $\mathop{\displaystyle \int} g\psi \neq 0$.

    **1.** Soit $g$ une solution mesurable. En multipliant l'équation par $\psi(y)$ et en intégrant en $y$, montrer que $g$ est de classe $C^{\infty}$, et conclure.

    **2.** Soit $f$ une solution mesurable. En appliquant la question 1 à $\mathrm{e}^{\mathrm{i} f}$, montrer qu'il existe $A \in \mathbb{R}$ et $h : \mathbb{R} \to \mathbb{Z}$ tels que $f(x) = Ax + 2\pi h(x)$.

    **3.** Soit $h : \mathbb{R} \to \mathbb{Z}$ vérifiant $h(x + y) = h(x) + h(y)$. Montrer que $h = 0$, et conclure.

    **4.** Démontrer le résultat admis : avec $A = \{g \neq 0\}$, justifier que $\lambda(A) > 0$, qu'il existe un compact $K \subset A$ de mesure positive, et que $\psi = (\overline{g}\chi_{K}) * \rho_{\varepsilon}$ convient pour $\varepsilon$ assez petit.
  corrige: |
    **1.** La fonction $g$ est bornée et non nulle : soit $\psi$ telle que $c = \mathop{\displaystyle \int} g\psi \neq 0$. En intégrant $g(x + y)\psi(y) = g(x)g(y)\psi(y)$ en $y$, et avec $z = x + y$, 
    $$g(x) = \frac{1}{c}\int g(z)\psi(z - x)\,\mathrm{d} z = \frac{1}{c}\,g * \check{\psi}(x), \qquad \check{\psi}(u) = \psi(-u),$$
     qui est de classe $C^{\infty}$ (prop. 2). $g$ est donc continue, et $g(x) = \mathrm{e}^{\mathrm{i} Ax}$.

    **2.** $\mathrm{e}^{\mathrm{i} f}$ est mesurable et vérifie l'équation multiplicative : $\mathrm{e}^{\mathrm{i} f(x)} = \mathrm{e}^{\mathrm{i} Ax}$, et $h(x) = \dfrac{f(x) - Ax}{2\pi}$ est à valeurs entières.

    **3.** $h(x) = nh\big(\dfrac{x}{n}\big)$ pour tout $n \geqslant 1$, donc $\dfrac{h(x)}{n} = h\big(\dfrac{x}{n}\big)$ est entier pour tout $n$ : $h(x) = 0$. Ainsi $\boxed{f(x) = Ax}$, et $h$ est additive puisque $f$ et $x \mapsto Ax$ le sont.

    **4.** Si $\lambda(A) = 0$, $g = 0$ dans $L^{\infty}$. Par régularité intérieure, il existe un compact $K \subset A$ avec $0 < \lambda(K) < +\infty$. $\overline{g}\chi_{K} \in L^{1}$, et $\psi_{\varepsilon} = (\overline{g}\chi_{K}) * \rho_{\varepsilon}$ est de classe $C^{\infty}$ à support compact, avec $\psi_{\varepsilon} \to \overline{g}\chi_{K}$ dans $L^{1}$ (th. 2). Comme $g$ est bornée, $\mathop{\displaystyle \int} g\psi_{\varepsilon} \to \mathop{\displaystyle \int_{K}}|g|^{2} > 0$. Sans hypothèse de mesurabilité, il existe d'autres solutions, construites à l'aide d'une base de $\mathbb{R}$ comme $\mathbb{Q}$-espace vectoriel (axiome du choix) ; elles ne sont mesurables sur aucune partie de mesure positive.
