  enonce: |
    **1.** Montrer que $\lVert \tau_{h}f - f \rVert_{\infty}$ ne tend pas vers $0$ quand $h \to 0$ pour $f = \chi_{[0, 1]}$. Pour quelles $f \in L^{\infty}$ a-t-on $\lVert \tau_{h}f - f \rVert_{\infty} \to 0$ ?

    **2.** Soit $f \in L^{p}$ et $g \in L^{q}$, $p$, $q$ conjugués, $1 < p < +\infty$. Retrouver, à l'aide de la proposition 1 du cours, que $f * g$ est uniformément continue.
  corrige: |
    **1.** $\tau_{h}\chi_{[0, 1]} - \chi_{[0, 1]}$ vaut $\pm 1$ sur une partie de mesure $2|h| > 0$ (pour $0 < |h| < 1$) : $\lVert \tau_{h}f - f \rVert_{\infty} = 1$. On a $\lVert \tau_{h}f - f \rVert_{\infty} \to 0$ si et seulement si $f$ est égale presque partout à une fonction bornée uniformément continue. La condition est suffisante, par définition. Inversement, $f * \rho_{\varepsilon}$ est uniformément continue, et $\lVert f * \rho_{\varepsilon} - f \rVert_{\infty} \leqslant \mathop{\displaystyle \sup_{|y| \leqslant \varepsilon}}\lVert \tau_{y}f - f \rVert_{\infty} \to 0$ ; une limite uniforme presque partout de fonctions uniformément continues coïncide presque partout avec une fonction uniformément continue (même argument qu'à l'exercice 16).

    **2.** $f * g(x + h) - f * g(x) = \mathop{\displaystyle \int}(\tau_{-h}f - f)(x - y)g(y)\,\mathrm{d} y$, de module $\leqslant \lVert \tau_{-h}f - f \rVert_{p}\lVert g \rVert_{q}$, qui tend vers $0$ indépendamment de $x$ (prop. 1).
