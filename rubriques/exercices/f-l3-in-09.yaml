  page_enonce: 2
  page_corrige: 4
  enonce: |
    **1.** Soit $f$, $g$ mesurables sur $\mathbb{R}$, nulles sur $]-\infty, 0[$ et bornées sur tout segment de $[0, +\infty[$. Montrer que $f * g$ a un sens, et qu'elle est nulle sur $]-\infty, 0[$.

    **2.** Soit $K$ un tel noyau, et $K_{n} = K^{*n}$. Montrer que, pour tout $a > 0$, $x \in [0, a]$ et $n \geqslant 1$, $|K_{n}(x)| \leqslant M(a)^{n}\dfrac{x^{n-1}}{(n - 1)!}$, où $M(a) = \mathop{\displaystyle \sup_{[0, a]}}|K|$.

    **3.** En déduire que la série $R = \mathop{\displaystyle \sum_{n \geqslant 1}}K_{n}$ converge uniformément sur tout segment de $[0, +\infty[$ (*résolvante* de $K$), et que $R - K = K * R$. Calculer $R$ pour $K = 1$.
  corrige: |
    **1.** Pour $x < 0$, $f(x - y)g(y) = 0$ pour tout $y$ (l'un des deux facteurs est nul). Pour $x \geqslant 0$, l'intégrande est nul hors de $[0, x]$, où il est borné : l'intégrale existe.

    **2.** Par récurrence : 
    $$|K_{n+1}(x)| \leqslant \int_{0}^{x}|K(x - y)||K_{n}(y)|\,\mathrm{d} y \leqslant M(a)\int_{0}^{x}M(a)^{n}\frac{y^{n-1}}{(n - 1)!}\,\mathrm{d} y = M(a)^{n+1}\frac{x^{n}}{n!}.$$

    **3.** Sur $[0, a]$, $\mathop{\displaystyle \sum_{n}}M(a)^{n}\dfrac{a^{n-1}}{(n - 1)!} < +\infty$ : la série converge normalement. La convergence étant uniforme sur $[0, x]$, on peut intégrer terme à terme : $K * R = \mathop{\displaystyle \sum_{n \geqslant 1}}K * K_{n} = \mathop{\displaystyle \sum_{n \geqslant 2}}K_{n} = R - K$. Pour $K = 1$ sur $[0, +\infty[$, $K_{n}(x) = \dfrac{x^{n-1}}{(n - 1)!}$, et $\boxed{R(x) = \mathrm{e}^{x}}$ ; en effet $\mathrm{e}^{x} - 1 = \mathop{\displaystyle \int_{0}^{x}}\mathrm{e}^{y}\,\mathrm{d} y$. L'équation $u = h + K * u$ (*équation de Volterra*) a pour solution $u = h + R * h$.
- id: "l3-in-09-09"
  feuille: "f-l3-in-09"
  numero: 9
  partie: "Régularité, supports"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["régularité et support d'une convolée", théorème de Weierstrass]
  noeuds: [ds-regularisation, fc-weierstrass]
  notions: [produit-convolution, support-fonction]
  source: "Lyon 1 (TD07 2020), exercices 23 et 24 ; Bibmath, exercices 20 et 21"
  page_enonce: 3
  page_corrige: 4
  enonce: |
    **1.** Montrer que $\rho_{\varepsilon} \geqslant 0$, $\rho_{\varepsilon}(x) = 0$ si $|x| \geqslant \varepsilon$, et $\mathop{\displaystyle \int}\rho_{\varepsilon} = 1$. Donner un exemple de fonction $\rho$.

    **2.** Soit $f$ de classe $C^{k}$ sur $\mathbb{R}^{n}$ et $\varphi$ continue à support compact. Montrer que $f * \varphi$ est définie partout, de classe $C^{k}$, avec $\partial^{\alpha}(f * \varphi) = (\partial^{\alpha}f) * \varphi$ pour $|\alpha| \leqslant k$. Si $f$ est un polynôme de degré $\leqslant m$, montrer que $f * \varphi$ en est un.

    **3.** Soit $f$, $g$ de classe $C^{1}$ sur $\mathbb{R}$, bornées, de dérivées bornées, avec $f$ et $g'$ intégrables. Montrer que $f * g$ est définie et de classe $C^{2}$.

    **4.** Soit $f \in L^{1}(\mathbb{R})$ à support compact et $g$ $\alpha$-höldérienne, $\alpha \in ]0, 1]$. Montrer que $f * g$ existe et est $\alpha$-höldérienne.
  corrige: |
    **1.** $\rho_{\varepsilon}(x) = \varepsilon^{-n}\rho(x/\varepsilon)$ est positive, nulle si $|x/\varepsilon| \geqslant 1$, et $\mathop{\displaystyle \int}\rho_{\varepsilon} = 1$ par homothétie (chapitre 2, prop. 12). On peut prendre $\rho(x) = c\,\mathrm{e}^{-1/(1 - |x|^{2})}$ pour $|x| < 1$, nulle ailleurs, la constante $c$ normalisant l'intégrale.

    **2.** Si $\varphi$ est nulle hors d'un compact $L$, $f * \varphi(x) = \mathop{\displaystyle \int_{L}}f(x - y)\varphi(y)\,\mathrm{d} y$ est définie partout. Pour $x$ dans un compact $C$ et $|\alpha| \leqslant k$, $|\partial^{\alpha}f(x - y)\varphi(y)| \leqslant \mathop{\displaystyle \sup_{C - L}}|\partial^{\alpha}f|\cdot|\varphi(y)|$, intégrable : les théorèmes de continuité et de dérivation sous le signe somme (chapitre 5, th. 1 et 2), appliqués variable par variable, donnent la classe $C^{k}$ et $\partial^{\alpha}(f * \varphi) = (\partial^{\alpha}f) * \varphi$. Si $f$ est un polynôme de degré $\leqslant m$, $f(x - y)$ est un polynôme en $x$ de degré $\leqslant m$ dont les coefficients sont des polynômes en $y$ ; en intégrant contre $\varphi$, on obtient un polynôme en $x$.

    **3.** $f \in L^{1}$ et $g$ bornée : $f * g$ est définie partout. On écrit $f * g(x) = \mathop{\displaystyle \int} f(y)g(x - y)\,\mathrm{d} y$ ; la dérivée en $x$ est dominée par $\lVert g' \rVert_{\infty}|f(y)|$, et $(f * g)' = f * g' = g' * f$. De même, $g' * f(x) = \mathop{\displaystyle \int} g'(y)f(x - y)\,\mathrm{d} y$ a une dérivée dominée par $\lVert f' \rVert_{\infty}|g'(y)|$, intégrable : $(f * g)'' = g' * f'$, continue par le théorème 1 ($g' \in L^{1}$, $f' \in L^{\infty}$). On répartit les deux dérivées entre les deux facteurs, chacun portant une dérivée.

    **4.** Si $f$ est nulle hors du compact $K$, $t \mapsto g(x - t)$ est bornée sur $K$, et $f * g(x)$ existe. Ensuite 
    $$|f * g(x) - f * g(y)| \leqslant \int_{K}|f(t)||g(x - t) - g(y - t)|\,\mathrm{d} t \leqslant C\lVert f \rVert_{1}|x - y|^{\alpha}.$$
- id: "l3-in-09-10"
  feuille: "f-l3-in-09"
  numero: 10
  partie: "Régularité, supports"
  etoiles: 3
  types: [Démonstration]
  mots_cles: ["régularité et support d'une convolée"]
  noeuds: [ds-regularisation]
  notions: [produit-convolution, support-fonction]
  source: "Bibmath, exercice 15"
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Pour $f : \mathbb{R}^{d} \to \mathbb{R}$ mesurable, on note $\mathrm{Supp}(f)$ l'adhérence de $\{f \neq 0\}$, et $\mathrm{EssSupp}(f)$ l'ensemble des $x$ tels que, pour tout $r > 0$, $f$ n'est pas presque partout nulle sur $B(x, r)$ (*support essentiel*).

    **1.** Comparer $\mathrm{EssSupp}(f)$ et $\mathrm{Supp}(f)$ pour $f = \chi_{[0, 1] \cap \mathbb{Q}}$, puis pour $f$ continue. Le support essentiel dépend-il du représentant de $f$ ?

    **2.** Soit $\Omega = \mathbb{R}^{d} \setminus \mathrm{EssSupp}(f)$. Pour $n \geqslant 1$, soit $K_{n} = \{x ; \mathrm{dist}(x, \mathrm{EssSupp}(f)) \geqslant \dfrac{1}{n}, |x| \leqslant n\}$. Montrer que $K_{n}$ est compact, contenu dans $\Omega$, que $\Omega = \mathop{\displaystyle \bigcup} K_{n}$, et que $K_{n}$ est recouvert par un nombre fini d'ouverts sur lesquels $f$ est nulle presque partout. En déduire que $f = 0$ presque partout sur $\Omega$.

    **3.** Soit $f$, $g \in L^{1}(\mathbb{R}^{d})$. Montrer que $\mathrm{EssSupp}(f * g) \subset \overline{\mathrm{EssSupp}(f) + \mathrm{EssSupp}(g)}$.
  corrige: |
    **1.** Pour $f = \chi_{[0, 1] \cap \mathbb{Q}}$, $\mathrm{Supp}(f) = [0, 1]$, mais $f = 0$ presque partout, et $\mathrm{EssSupp}(f) = \emptyset$. Pour $f$ continue, les deux coïncident : si $f(x) \neq 0$, $f \neq 0$ sur une boule, de mesure positive ; si $f$ est nulle presque partout sur une boule, elle l'est partout sur cette boule par continuité. Le support essentiel ne dépend que de la classe de $f$, puisqu'il est défini par des propriétés « presque partout ».

    **2.** $\mathrm{EssSupp}(f)$ est fermé, son complémentaire $\Omega$ étant ouvert par définition. $K_{n}$ est fermé et borné, donc compact, et ses points sont à distance $\geqslant \dfrac{1}{n}$ de $\mathrm{EssSupp}(f)$, donc dans $\Omega$ (si $\mathrm{EssSupp}(f) = \emptyset$, on pose la distance égale à $+\infty$). Un point de l'ouvert $\Omega$ est à distance strictement positive du fermé $\mathrm{EssSupp}(f)$ : il est dans $K_{n}$ pour $n$ grand. Chaque $x \in K_{n}$ a une boule ouverte sur laquelle $f = 0$ presque partout ; par compacité, un nombre fini de ces boules recouvrent $K_{n}$, et $f = 0$ presque partout sur $K_{n}$, puis sur $\Omega = \mathop{\displaystyle \bigcup} K_{n}$.

    **3.** Soit $S$, $T$ les supports essentiels de $f$ et $g$, et $x \notin \overline{S + T}$ : il existe $r > 0$ tel que $B(x, r) \cap (S + T) = \emptyset$. Pour $z \in B(x, r)$, l'ensemble des $y$ tels que $f(z - y)g(y) \neq 0$ est contenu dans $\{y \notin T, g(y) \neq 0\} \cup \{y ; z - y \notin S, f(z - y) \neq 0\}$, puisque $y \in T$ et $z - y \in S$ donneraient $z \in S + T$. Par la question 2, ces deux ensembles sont négligeables : $f * g(z) = 0$ pour tout $z \in B(x, r)$ où elle est définie, et $x \notin \mathrm{EssSupp}(f * g)$.
- id: "l3-in-09-11"
  feuille: "f-l3-in-09"
  numero: 11
  partie: "Régularité, supports"
