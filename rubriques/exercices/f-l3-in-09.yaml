  source: "Bibmath (F. Bayart), «~Produit de convolution~», exercices 1 et 8"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Soit $f(x) = |x|\mathrm{e}^{-|x|}$ et $g(x) = \mathrm{e}^{-x^{2}}$ sur $\mathbb{R}$. Justifier que $f * g$ existe, est continue et appartient à $L^{p}$ pour tout $p \in [1, +\infty]$.

    **2.** Pour $a > 0$, soit $g_{a}(x) = \mathrm{e}^{-a|x|}$. Sans calcul, montrer que $g_{a} * g_{b}$ est continue et dans tous les $L^{p}$. Calculer $g_{a} * g_{b}$ pour $a \neq b$, puis pour $a = b$.
  corrige: |
    **1.** $f$ est continue, bornée et intégrable, donc dans tous les $L^{p}$, et $g$ aussi. Par le théorème 1, $f * g \in L^{p}$ pour $1 \leqslant p \leqslant +\infty$ (avec $f \in L^{1}$, $g \in L^{p}$), et $f * g$ est continue (avec $f \in L^{1}$, $g \in L^{\infty}$).

    **2.** Même raisonnement. Pour $x \geqslant 0$ et $a \neq b$, en coupant en $t < 0$, $0 \leqslant t \leqslant x$ et $t > x$, 
    $$g_{a} * g_{b}(x) = \frac{\mathrm{e}^{-ax}}{a + b} + \frac{\mathrm{e}^{-bx} - \mathrm{e}^{-ax}}{a - b} + \frac{\mathrm{e}^{-bx}}{a + b} = \boxed{\frac{2b\,\mathrm{e}^{-a|x|} - 2a\,\mathrm{e}^{-b|x|}}{b^{2} - a^{2}}}\text{,}$$
     par parité pour $x < 0$ (exercice 6). Pour $a = b$, le même découpage donne $\boxed{g_{a} * g_{a}(x) = \big(|x| + \dfrac{1}{a}\big)\mathrm{e}^{-a|x|}}$, limite de la formule précédente quand $b \to a$.
- id: "l3-in-09-03"
  feuille: "f-l3-in-09"
  numero: 3
  partie: "Existence et calculs"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [existence et calcul de convolées]
