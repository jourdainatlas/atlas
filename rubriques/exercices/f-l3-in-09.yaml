- id: "l3-in-09-01"
  feuille: "f-l3-in-09"
  numero: 1
  partie: "Existence et calculs"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [existence et calcul de convolées]
  noeuds: [ds-regularisation]
  notions: [produit-convolution, localement-integrable]
  source: "Lyon 1 (TD07 2020), exercice 22 ; Lyon 1 (TD06 2020), exercice 17 ; Exo7 (fic00147), exercice 3"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Soit $f$, $g : \mathbb{R}^{n} \to \overline{\mathbb{R}}$ mesurables. Montrer que $f * g(x)$ existe si et seulement si $g * f(x)$ existe, et qu'alors $f * g(x) = g * f(x)$.

    **2.** Soit $f \in L^{1}$ et $g \in L^{p}$, $1 \leqslant p \leqslant +\infty$. En appliquant le théorème de Fubini-Tonelli à $(x, y) \mapsto |f(x - y)||g(y)|$, montrer que $f * g(x)$ existe pour presque tout $x$ lorsque $p = 1$, et que $\lVert f * g \rVert_{1} \leqslant \lVert f \rVert_{1}\lVert g \rVert_{1}$. Pour $1 < p < +\infty$, retrouver $\lVert f * g \rVert_{p} \leqslant \lVert f \rVert_{1}\lVert g \rVert_{p}$ en appliquant l'inégalité de Hölder à la mesure $|f(x - y)|\,\mathrm{d} y$.

    **3.** Pour $f$, $g$, $h \in L^{1}$, montrer que $(f * g) * h = f * (g * h)$.
  corrige: |
    **1.** Le changement de variable $y = x - z$, de jacobien $1$ en valeur absolue, transforme $y \mapsto f(x - y)g(y)$ en $z \mapsto f(z)g(x - z)$ : l'une est intégrable si et seulement si l'autre l'est, et les intégrales sont égales.

    **2.** Par Tonelli et l'invariance de la mesure de Lebesgue par translation, 
    $$\int\int|f(x - y)||g(y)|\,\mathrm{d} y\,\mathrm{d} x = \lVert f \rVert_{1}\lVert g \rVert_{1} \text{ :}$$
     pour presque tout $x$, l'intégrale intérieure est finie, et $\lVert f * g \rVert_{1} \leqslant \lVert f \rVert_{1}\lVert g \rVert_{1}$. Pour $1 < p < +\infty$, si $f \neq 0$, Hölder pour la mesure finie $|f(x - y)|\,\mathrm{d} y$, de masse $\lVert f \rVert_{1}$, donne 
    $$\Big(\int|f(x - y)||g(y)|\,\mathrm{d} y\Big)^{p} \leqslant \lVert f \rVert_{1}^{p/q}\int|f(x - y)||g(y)|^{p}\,\mathrm{d} y,$$
     et l'on intègre en $x$ par Tonelli : $\lVert f * g \rVert_{p}^{p} \leqslant \lVert f \rVert_{1}^{p/q}\lVert f \rVert_{1}\lVert g \rVert_{p}^{p} = \lVert f \rVert_{1}^{p}\lVert g \rVert_{p}^{p}$. Le membre de droite est fini, donc $f * g(x)$ existe presque partout.

    **3.** Par Tonelli, 
    $$\int\int\int|f(x - y - z)||g(y)||h(z)|\,\mathrm{d} x\,\mathrm{d} y\,\mathrm{d} z = \lVert f \rVert_{1}\lVert g \rVert_{1}\lVert h \rVert_{1} \text{ :}$$
     la fonction $(x, y, z) \mapsto f(x - y - z)g(y)h(z)$ est intégrable, et Fubini permet d'intégrer d'abord en $y$ ou d'abord en $z$. Avec le changement de variable $u = y + z$ en $y$ à $z$ fixé, on obtient $(f * g) * h(x)$ dans un ordre et $f * (g * h)(x)$ dans l'autre, pour presque tout $x$.
- id: "l3-in-09-02"
  feuille: "f-l3-in-09"
  numero: 2
  partie: "Existence et calculs"
  etoiles: 1
  types: [Démonstration, Calcul]
