  enonce: |
    **1.** Pour $m \in \mathbb{R}$ et $\sigma > 0$, soit $g_{m, \sigma}(x) = \dfrac{1}{\sigma\sqrt{2\pi}}\mathrm{e}^{-(x - m)^{2}/(2\sigma^{2})}$. Justifier l'existence de $g_{m, \sigma} * g_{p, \tau}$, et la calculer. On rappelle que $\mathop{\displaystyle \int_{\mathbb{R}}}\mathrm{e}^{-x^{2}/2}\,\mathrm{d} x = \sqrt{2\pi}$.

    **2.** Pour $a$, $b > 0$, calculer $f * g$, où $f(x) = \mathrm{e}^{-a|x|^{2}/2}$ et $g(x) = \mathrm{e}^{-b|x|^{2}/2}$ sur $\mathbb{R}^{n}$.
  corrige: |
    **1.** Ces gaussiennes sont intégrables et bornées : la convolée existe partout, est continue et d'intégrale $1$, c'est donc une densité de probabilité. Par l'exercice 6, $g_{m, \sigma} = \tau_{m}g_{0, \sigma}$, et $g_{m, \sigma} * g_{p, \tau} = \tau_{m + p}(g_{0, \sigma} * g_{0, \tau})$. Avec $s^{2} = \sigma^{2} + \tau^{2}$, on complète le carré : 
    $$\frac{(x - t)^{2}}{2\sigma^{2}} + \frac{t^{2}}{2\tau^{2}} = \frac{x^{2}}{2s^{2}} + \frac{s^{2}}{2\sigma^{2}\tau^{2}}\Big(t - \frac{\tau^{2}x}{s^{2}}\Big)^{2},$$
     et l'intégrale en $t$ vaut $\sqrt{2\pi}\dfrac{\sigma\tau}{s}$. D'où $\boxed{g_{m, \sigma} * g_{p, \tau} = g_{m + p, \sqrt{\sigma^{2} + \tau^{2}}}}$ : les moyennes et les variances s'ajoutent.

    **2.** Les fonctions sont des produits de fonctions d'une variable, et Fubini ramène le calcul à $n$ intégrales sur $\mathbb{R}$ ; le même calcul, avec $\sigma^{2} = \dfrac{1}{a}$ et $\tau^{2} = \dfrac{1}{b}$, donne 
    $$f * g(x) = \boxed{\Big(\frac{2\pi}{a + b}\Big)^{n/2}\exp\Big(-\frac{ab|x|^{2}}{2(a + b)}\Big)}\text{.}$$
- id: "l3-in-09-05"
  feuille: "f-l3-in-09"
  numero: 5
  partie: "Existence et calculs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [existence et calcul de convolées]
  noeuds: [ds-regularisation, pol-binome]
  notions: [produit-convolution, localement-integrable, coefficient-binomial]
  source: "Bibmath, exercice 4"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $f = \chi_{]0, 1]}$ et $f^{*n} = f * \dots * f$ ($n$ facteurs). Montrer que, pour $n \geqslant 1$ et $x \in \mathbb{R}$, 
    $$f^{*n}(x) = \frac{1}{(n - 1)!}\sum_{k = 0}^{n}(-1)^{k}\binom{n}{k}(x - k)_{+}^{n-1},$$
     où $y_{+} = \mathop{\displaystyle \max}(y, 0)$, avec la convention $(y_{+})^{0} = 0$ si $y \leqslant 0$ et $1$ si $y > 0$. Quelle est la régularité de $f^{*n}$ ? Tracer $f^{*1}$, $f^{*2}$ et $f^{*3}$.
  corrige: |
    Par récurrence. Pour $n = 1$, la formule donne $(x)_{+}^{0} - (x - 1)_{+}^{0} = \chi_{]0, 1]}(x)$. Si elle vaut au rang $n$, $f^{*(n+1)}(x) = \mathop{\displaystyle \int_{x-1}^{x}}f^{*n}(y)\,\mathrm{d} y$, et $\mathop{\displaystyle \int_{x-1}^{x}}(y - k)_{+}^{n-1}\,\mathrm{d} y = \dfrac{(x - k)_{+}^{n} - (x - k - 1)_{+}^{n}}{n}$. En regroupant les termes en $(x - k)_{+}^{n}$ par la formule de Pascal $\dbinom{n}{k} + \dbinom{n}{k-1} = \dbinom{n+1}{k}$, on obtient la formule au rang $n + 1$. Pour $n \geqslant 2$, $f^{*n}$ est polynomiale de degré $n - 1$ sur chaque intervalle $[k, k + 1]$, nulle hors de $[0, n]$, et de classe $C^{n-2}$ : chaque convolution par $f$ gagne une dérivée.

    ![Figure](documents/figures/9797a1d6b15ac05b.svg)

    La fonction $f = \chi_{]0, 1]}$ (tirets ocre) et ses itérées $f^{*2}$, $f^{*3}$, $f^{*4}$ (ardoise, de plus en plus épaisses), de maxima $1$, $\dfrac{3}{4}$, $\dfrac{2}{3}$ : un triangle, puis des arcs de paraboles et de cubiques raccordés. Elles gagnent en régularité et ressemblent de plus en plus à une gaussienne, ce que le théorème central limite expliquerait.
