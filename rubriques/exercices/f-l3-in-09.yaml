  enonce: |
    *Convolution des mesures.* Soit $\mu$, $\nu$ des mesures boréliennes $\sigma$-finies sur $\mathbb{R}^{n}$. Pour $E$ borélien, on pose $F(E) = \{(x, y) ; x + y \in E\}$ et $\mu * \nu(E) = \mu \otimes \nu(F(E))$.

    **1.** Montrer que $F(E)$ est borélien, que $\mu * \nu$ est une mesure, que la convolution est commutative, et associative pour des mesures finies. Montrer que $\delta_{0}$ est un élément neutre, et que $\mu * \delta_{a}$ est l'image de $\mu$ par la translation $x \mapsto x + a$.

    **2.** Si $\mu$ et $\nu$ ont des densités $f$ et $g$ par rapport à $\lambda$, montrer que $\mu * \nu$ a la densité $f * g$. Si seule $\mu$ a une densité $f$, montrer que $\mu * \nu$ a la densité $f * \nu(x) = \mathop{\displaystyle \int} f(x - y)\,\mathrm{d}\nu(y)$.

    **3.** Si $\mu$ est une probabilité, calculer $\lambda * \mu$. Existe-t-il une mesure $\sigma$-finie $\mu$ telle que $\mu * \nu = \nu$ pour toute $\nu$ ?

    **4.** Pour $m \geqslant 1$ et $p \in [0, 1]$, soit 
    $$B(m, p) = \sum_{k = 0}^{m}\binom{m}{k}p^{k}(1 - p)^{m-k}\delta_{k}.$$
     Montrer que $B(m, p) = B(1, p)^{*m}$.

    **5.** Soit $f$ borélienne et $\mu$ borélienne sur $\mathbb{R}^{n}$, et $f * \mu(x) = \mathop{\displaystyle \int} f(x - y)\,\mathrm{d}\mu(y)$ lorsque cela a un sens. Si $f$ est intégrable et $\mu$ finie, montrer que $f * \mu$ est définie presque partout et intégrable. Si $f \in C_{c}^{k}$ et $\mu$ est finie sur les compacts, montrer que $f * \mu$ est définie partout et de classe $C^{k}$.
  corrige: |
    **1.** $F(E) = s^{-1}(E)$, où $s(x, y) = x + y$ est continue : $F(E)$ est borélien, et $\mu * \nu = s_{*}(\mu \otimes \nu)$ est la mesure image (chapitre 1, prop. 14). La formule de transfert (chapitre 3, prop. 15) donne $\mathop{\displaystyle \int}\varphi\,\mathrm{d}(\mu * \nu) = \mathop{\displaystyle \int}\mathop{\displaystyle \int}\varphi(x + y)\,\mathrm{d}\mu(x)\,\mathrm{d}\nu(y)$ pour $\varphi \geqslant 0$. La commutativité vient de la symétrie $(x, y) \mapsto (y, x)$, et l'associativité, pour des mesures finies, de ce que les deux convolées sont les images de $\mu \otimes \nu \otimes \eta$ par $(x, y, z) \mapsto x + y + z$. Enfin $\mu * \delta_{a}(E) = \mathop{\displaystyle \int}\chi_{E}(x + a)\,\mathrm{d}\mu(x) = \mu(E - a)$ : c'est l'image de $\mu$ par la translation de $a$, et $\mu * \delta_{0} = \mu$.

    **2.** Par Tonelli et le changement de variable $z = x + y$ en $x$ à $y$ fixé, 
    $$\mu * \nu(E) = \int\int\chi_{E}(x + y)f(x)g(y)\,\mathrm{d} x\,\mathrm{d} y = \int\chi_{E}(z)\Big(\int f(z - y)g(y)\,\mathrm{d} y\Big)\mathrm{d} z = \int_{E}f * g,$$
     et, de même, en remplaçant $g(y)\,\mathrm{d} y$ par $\mathrm{d}\nu(y)$, $\mu * \nu(E) = \mathop{\displaystyle \int_{E}}(f * \nu)(z)\,\mathrm{d} z$.

    **3.** $\lambda * \mu(E) = \mathop{\displaystyle \int}\lambda(E - y)\,\mathrm{d}\mu(y) = \lambda(E)\mu(\mathbb{R}^{n}) = \lambda(E)$ : la mesure de Lebesgue est absorbante pour les probabilités. La mesure $\delta_{0}$, $\sigma$-finie, est un élément neutre.

    **4.** $B(1, p) = (1 - p)\delta_{0} + p\delta_{1}$, et $\delta_{k} * \delta_{1} = \delta_{k+1}$. Par récurrence, 
    $$B(m, p) * B(1, p) = \sum_{k}\binom{m}{k}p^{k}(1 - p)^{m-k}\big((1 - p)\delta_{k} + p\delta_{k+1}\big),$$
     et la formule de Pascal donne $B(m + 1, p)$. En probabilités, le nombre de succès en $m$ épreuves indépendantes est la somme de $m$ variables de Bernoulli indépendantes, et la loi d'une somme de variables indépendantes est la convolée des lois.

    **5.** Par Tonelli, $\mathop{\displaystyle \int}\mathop{\displaystyle \int}|f(x - y)|\,\mathrm{d} x\,\mathrm{d}\mu(y) = \lVert f \rVert_{1}\mu(\mathbb{R}^{n}) < +\infty$ : $f * \mu$ est définie presque partout et intégrable. Si $f \in C_{c}^{k}$ est nulle hors du compact $L$, pour $x$ dans un compact $C$, $f(x - y) \neq 0$ impose $y \in C - L$, compact de $\mu$-mesure finie ; les dérivées $\partial^{\alpha}f(x - y)$, $|\alpha| \leqslant k$, sont dominées par $\lVert \partial^{\alpha}f \rVert_{\infty}\chi_{C - L}(y)$, $\mu$-intégrable, et le théorème de dérivation sous le signe somme donne la classe $C^{k}$.
