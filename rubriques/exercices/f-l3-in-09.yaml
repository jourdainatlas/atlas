  partie: "Sur le cercle"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [convolution sur le cercle, théorème de Weierstrass]
  noeuds: [fo-parseval, fc-weierstrass]
  notions: [produit-convolution]
  source: "Bibmath, exercice 27"
  page_enonce: 7
  page_corrige: 10
  enonce: |
    *Théorème de Fejér.* Soit $f$ continue sur $\mathbb{T}$, $e_{k}(t) = \mathrm{e}^{\mathrm{i} kt}$, $S_{n} = \mathop{\displaystyle \sum_{|k| \leqslant n}}e_{k}$ et $C_{n} = \dfrac{S_{0} + \dots + S_{n}}{n + 1}$.

    **1.** Montrer que $f * S_{n}$ est un polynôme trigonométrique, la $n$-ième somme partielle de la série de Fourier de $f$.

    **2.** Montrer que $C_{n}(x) = \dfrac{1}{n + 1}\Big(\dfrac{\sin((n + 1)x/2)}{\sin(x/2)}\Big)^{2}$ pour $x \notin 2\pi\mathbb{Z}$.

    **3.** Montrer que $C_{n} \geqslant 0$, que $\dfrac{1}{2\pi}\mathop{\displaystyle \int_{-\pi}^{\pi}}C_{n} = 1$, et que $C_{n} \to 0$ uniformément sur $[-\pi, \pi] \setminus [-\alpha, \alpha]$ pour tout $\alpha \in ]0, \pi]$.

    **4.** En déduire que $f * C_{n} \to f$ uniformément : les moyennes de Cesàro de la série de Fourier de $f$ convergent uniformément vers $f$.
  corrige: |
    **1.** $f * e_{k}(\theta) = \dfrac{1}{2\pi}\mathop{\displaystyle \int} f(t)\mathrm{e}^{\mathrm{i} k(\theta - t)}\,\mathrm{d} t = c_{k}(f)e_{k}(\theta)$, d'où $f * S_{n} = \mathop{\displaystyle \sum_{|k| \leqslant n}}c_{k}(f)e_{k}$ : la somme partielle d'ordre $n$ de la série de Fourier de $f$.

    **2.** $S_{j}(x) = \dfrac{\sin((j + \frac{1}{2})x)}{\sin(x/2)}$ (somme géométrique). Avec $2\sin\dfrac{x}{2}\sin\big((j + \dfrac{1}{2})x\big) = \cos(jx) - \cos((j + 1)x)$, la somme télescopique donne 
    $$\sum_{j = 0}^{n}\sin\Big(\big(j + \tfrac{1}{2}\big)x\Big) = \frac{1 - \cos((n + 1)x)}{2\sin(x/2)} = \frac{\sin^{2}((n + 1)x/2)}{\sin(x/2)},$$
     d'où la formule de $C_{n}$.

    **3.** $C_{n} \geqslant 0$ sur la formule ; $\dfrac{1}{2\pi}\mathop{\displaystyle \int} S_{j} = 1$, seul $e_{0}$ ayant une moyenne non nulle, donc $C_{n}$ est de moyenne $1$ ; sur $\alpha \leqslant |x| \leqslant \pi$, $0 \leqslant C_{n}(x) \leqslant \dfrac{1}{(n + 1)\sin^{2}(\alpha/2)} \to 0$.

    **4.** $f$ est uniformément continue sur $\mathbb{T}$, de module de continuité $\omega$. Alors 
    $$|f * C_{n}(x) - f(x)| \leqslant \frac{1}{2\pi}\int_{-\pi}^{\pi}|f(x - t) - f(x)|C_{n}(t)\,\mathrm{d} t \leqslant \omega(\alpha) + 2\lVert f \rVert_{\infty}\sup_{\alpha \leqslant |t| \leqslant \pi}C_{n}(t),$$
     et $f * C_{n} = \dfrac{1}{n + 1}\mathop{\displaystyle \sum_{j \leqslant n}}f * S_{j}$ converge uniformément vers $f$. On retrouve le théorème 4 du cours avec un autre noyau, le noyau de Fejér, plus naturel puisqu'il fait apparaître les sommes de Fourier elles-mêmes.

    ![Figure](documents/figures/cf625a6714aa1971.svg)

    Les noyaux de Fejér $C_{2}$, $C_{5}$, $C_{10}$ (ocre, de plus en plus épais), positifs, de moyenne $1$ et de maximum $n + 1$ en $0$, se concentrent en $0$ : c'est une approximation de l'unité sur le cercle, alors que les noyaux de Dirichlet $S_{n}$, qui changent de signe, n'en sont pas une.
- id: "l3-in-09-27"
