  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Soit $f$, $g \in L^{1}(\mathbb{R})$ et $a \in \mathbb{R}$. Montrer que $(\tau_{a}f) * g = f * (\tau_{a}g) = \tau_{a}(f * g)$.

    **2.** Soit $f \in L^{1}(\mathbb{R})$ et $g$ continue et périodique. Justifier que $f * g$ existe et est périodique.

    **3.** Montrer que la convolée de deux fonctions paires est paire. Que dire pour deux fonctions impaires, ou pour une fonction paire et une fonction impaire ? Plus généralement, montrer que la convolée de deux fonctions radiales de $L^{1}(\mathbb{R}^{n})$ est radiale.

    **4.** *Formule de Leibniz.* Soit $f$, $g$ continues sur $\mathbb{R}$, l'une d'elles à support compact. Montrer que $x^{m}(f * g) = \mathop{\displaystyle \sum_{k = 0}^{m}}\dbinom{m}{k}(x^{k}f) * (x^{m-k}g)$.
  corrige: |
    **1.** Le changement de variable $u = y + a$ donne 
    $$(\tau_{a}f) * g(x) = \int f(x - y - a)g(y)\,\mathrm{d} y = \int f(x - u)g(u - a)\,\mathrm{d} u = f * (\tau_{a}g)(x),$$
     et la première expression est aussi $(f * g)(x - a)$.

    **2.** $g$ est continue et périodique, donc bornée : $f * g$ est définie partout et continue (th. 1), et, si $T$ est une période de $g$, $\tau_{-T}(f * g) = f * \tau_{-T}g = f * g$.

    **3.** Avec $u = -y$, $f * g(-x) = \mathop{\displaystyle \int} f(-x + u)g(-u)\,\mathrm{d} u$ ; si $f$ et $g$ sont paires, c'est $f * g(x)$. Le même calcul montre que la convolée de deux fonctions impaires est paire, et celle d'une paire et d'une impaire est impaire. Si $A$ est une rotation, $|\det A| = 1$ et le changement de variable $y = Az$ donne $f * g(Ax) = \mathop{\displaystyle \int} f(A(x - z))g(Az)\,\mathrm{d} z = f * g(x)$ pour $f$, $g$ radiales.

    **4.** Si $g$ est nulle hors de $[a, b]$, on développe $x^{m} = ((x - t) + t)^{m}$ par la formule du binôme sous l'intégrale sur $[a, b]$, ce qui est licite pour une somme finie.
- id: "l3-in-09-07"
  feuille: "f-l3-in-09"
  numero: 7
  partie: "Existence et calculs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [existence et calcul de convolées]
  noeuds: [ds-regularisation]
  notions: [produit-convolution, localement-integrable]
  source: "Bibmath, exercices 16 et 23 ; Féjoz (exosIntegration), exercice 6.1 (d), reporté de la feuille 5"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    *$L^{1}(\mathbb{R})$ n'a pas d'élément neutre.* On suppose qu'il existe $f \in L^{1}(\mathbb{R})$ telle que $f * g = g$ pour toute $g \in L^{1}(\mathbb{R})$.

    **1.** Soit $\alpha > 0$ tel que $\mathop{\displaystyle \int_{-\alpha}^{\alpha}}|f| < 1$ et $g = \chi_{[-\alpha, \alpha]}$. En étudiant $g * f(0)$, et en remarquant que $g * f$ est continue, obtenir une contradiction.

    **2.** Seconde démonstration : soit $(g_{k})$ une approximation de l'unité. Montrer qu'une sous-suite de $(g_{k})$ converge presque partout vers $f$, et conclure.

    **3.** Troisième démonstration : à l'aide de la transformée de Fourier d'une gaussienne et du lemme de Riemann-Lebesgue (chapitre 5, prop. 5), conclure.
  corrige: |
    **1.** $g \in L^{\infty}$ et $f \in L^{1}$ : $g * f$ est continue (th. 1) et égale presque partout à $g$, donc égale à $1$ sur $]-\alpha, \alpha[$ par continuité. Mais $g * f(0) = \mathop{\displaystyle \int_{-\alpha}^{\alpha}}f(-y)\,\mathrm{d} y$, de module $\leqslant \mathop{\displaystyle \int_{-\alpha}^{\alpha}}|f| < 1$ : contradiction.

    **2.** Prenons $g_{k} = k\chi_{[0, 1/k]}$. Par le théorème 2, $f * g_{k} \to f$ dans $L^{1}$ ; or $f * g_{k} = g_{k}$, qui tend vers $0$ presque partout. Une sous-suite convergeant presque partout vers $f$, $f = 0$ presque partout, et alors $f * g = 0 \neq g$.

    **3.** Avec $g(x) = \mathrm{e}^{-x^{2}}$, $\widehat{g}$ ne s'annule pas (feuille 5, exercice 18), et l'exercice 25 donne $\widehat{f}\,\widehat{g} = \widehat{g}$, donc $\widehat{f} = 1$, ce qui contredit $\widehat{f}(\xi) \to 0$ (chapitre 5, prop. 5). La masse de Dirac $\delta_{0}$ est l'élément neutre naturel (exercice 24), mais ce n'est pas une fonction.
