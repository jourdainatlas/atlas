  enonce: |
    *Noyau de la chaleur.* Pour $t > 0$ et $x \in \mathbb{R}^{d}$, soit $G(t, x) = (4\pi t)^{-d/2}\mathrm{e}^{-|x|^{2}/(4t)}$.

    **1.** Montrer que $\mathop{\displaystyle \int} G(t, x)\,\mathrm{d} x = 1$, que $\mathop{\displaystyle \int_{|x| > \delta}}G(t, x)\,\mathrm{d} x \to 0$ quand $t \to 0$, et que $\dfrac{\partial G}{\partial t} = \Delta G$.

    **2.** Soit $g$ continue et bornée. Montrer que $G(t, \cdot) * g$ est définie et tend vers $g$ simplement quand $t \to 0$.

    **3.** Soit $f \in L^{p}(\mathbb{R}^{d})$, $1 \leqslant p < +\infty$, et $u(t, x) = G(t, \cdot) * f(x)$. Montrer que $u$ est de classe $C^{2}$ sur $]0, +\infty[ \times \mathbb{R}^{d}$, que $\dfrac{\partial u}{\partial t} = \Delta u$, et que $u(t, \cdot) \to f$ dans $L^{p}$ quand $t \to 0$.
  corrige: |
    **1.** Avec $x = 2\sqrt{t}u$, 
    $$\int G(t, x)\,\mathrm{d} x = \pi^{-d/2}\int\mathrm{e}^{-|u|^{2}}\,\mathrm{d} u = 1, \qquad \int_{|x| > \delta}G(t, x)\,\mathrm{d} x = \pi^{-d/2}\int_{|u| > \frac{\delta}{2\sqrt{t}}}\mathrm{e}^{-|u|^{2}}\,\mathrm{d} u \to 0$$
     quand $t \to 0$, par convergence dominée. Ensuite 
    $$\frac{\partial G}{\partial t} = \Big(-\frac{d}{2t} + \frac{|x|^{2}}{4t^{2}}\Big)G, \qquad \frac{\partial^{2}G}{\partial x_{i}^{2}} = \Big(-\frac{1}{2t} + \frac{x_{i}^{2}}{4t^{2}}\Big)G,$$
     et la somme des secondes est la première.

    **2.** $G(t, \cdot) \in L^{1}$ et $g$ bornée : la convolée est définie. Si $g$ est continue en $x$, pour $\varepsilon > 0$ soit $\delta$ tel que $|g(x - y) - g(x)| \leqslant \varepsilon$ pour $|y| \leqslant \delta$ ; alors $|G(t, \cdot) * g(x) - g(x)| \leqslant \varepsilon + 2\lVert g \rVert_{\infty}\mathop{\displaystyle \int_{|y| > \delta}}G(t, y)\,\mathrm{d} y$, inférieur à $2\varepsilon$ pour $t$ petit.

    **3.** Pour $t \in [a, b] \subset ]0, +\infty[$ et $|x - x_{0}| \leqslant 1$, les dérivées partielles de $(t, x) \mapsto G(t, x - y)$ jusqu'à l'ordre $2$ sont majorées par $C(1 + |x - y|^{4})\mathrm{e}^{-|x - y|^{2}/(4b)}$, donc par $C'\mathrm{e}^{-|x_{0} - y|^{2}/(8b)}$, fonction de $y$ qui est dans $L^{q}$ ; multipliée par $|f(y)|$, elle est intégrable par Hölder. Le théorème de dérivation sous le signe somme donne la classe $C^{2}$ de $u$, et $\dfrac{\partial u}{\partial t} - \Delta u = \big(\dfrac{\partial G}{\partial t} - \Delta G\big) * f = 0$. Enfin $(G(t_{k}, \cdot))$ est une approximation de l'unité pour toute suite $t_{k} \to 0$ : $u(t, \cdot) \to f$ dans $L^{p}$ (th. 2).

    ![Figure](documents/figures/0127a2393c3e72d2.svg)

    Les noyaux de la chaleur $G(t, \cdot)$ sur $\mathbb{R}$ pour $t = 0{,}5$, $0{,}1$ et $0{,}02$ (ocre, de plus en plus épais), d'intégrale $1$ : la chaleur initialement concentrée en $0$ se diffuse, sa hauteur décroissant comme $\dfrac{1}{\sqrt{4\pi t}}$ et sa largeur croissant comme $\sqrt{t}$. Lire la figure du plus épais au plus fin revient à remonter le temps vers la masse de Dirac.
