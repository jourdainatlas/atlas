  notions: [produit-convolution, localement-integrable]
  source: "Bibmath, exercices 2 et 3 ; Féjoz (exosIntegration), exercice 4.14 (a)"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Justifier l'existence et calculer $f * g$ dans les cas suivants :

    **1.** $f = g = \chi_{[0, +\infty[}$ ; $f = \chi_{[0, 1]}$ et $g(x) = x\chi_{[0, +\infty[}(x)$ ; $f = \chi_{[-1, 1]}$ et $g = \chi_{[-a, a]}$, avec $a \geqslant 1$ ;

    **2.** $f(x) = \mathrm{e}^{\alpha x}\chi_{[0, +\infty[}(x)$ et $g(x) = \mathrm{e}^{\beta x}\chi_{[0, +\infty[}(x)$, avec $\alpha$, $\beta$ réels ;

    **3.** $f = g$, avec $f(x) = x^{-2}\chi_{[1, +\infty[}(x)$.
  corrige: |
    Toutes les fonctions sont positives : les intégrales définissant $f * g(x)$ ont un sens dans $[0, +\infty]$, et l'on vérifie qu'elles sont finies.

    **1.** $\chi_{[0, +\infty[} * \chi_{[0, +\infty[}(x) = \lambda([0, x]) = \boxed{x_{+}}$. Ensuite $\chi_{[0, 1]} * g(x) = \mathop{\displaystyle \int_{x-1}^{x}}y_{+}\,\mathrm{d} y$, qui vaut $0$ pour $x \leqslant 0$, $\dfrac{x^{2}}{2}$ pour $0 \leqslant x \leqslant 1$, et $x - \dfrac{1}{2}$ pour $x \geqslant 1$. Enfin $\chi_{[-1, 1]} * \chi_{[-a, a]}(x) = \lambda([x - 1, x + 1] \cap [-a, a])$ vaut $2$ pour $|x| \leqslant a - 1$, $a + 1 - |x|$ pour $a - 1 \leqslant |x| \leqslant a + 1$, et $0$ au-delà : c'est un trapèze.

    ![Figure](documents/figures/559ff93a095d3472.svg)

    Pour $a = 2$ : la convolée (ardoise) des indicatrices de $[-1, 1]$ (tirets ocre) et de $[-2, 2]$ (pointillés ocre) mesure le recouvrement de $[x - 1, x + 1]$ avec $[-2, 2]$. Elle est continue, nulle hors de $[-3, 3] = [-1, 1] + [-2, 2]$, d'intégrale $2 \times 4 = 8$.

    **2.** Pour $x \geqslant 0$, $\mathop{\displaystyle \int_{0}^{x}}\mathrm{e}^{\alpha(x - t)}\mathrm{e}^{\beta t}\,\mathrm{d} t = \boxed{\dfrac{\mathrm{e}^{\alpha x} - \mathrm{e}^{\beta x}}{\alpha - \beta}}$ si $\alpha \neq \beta$, et $x\mathrm{e}^{\alpha x}$ si $\alpha = \beta$ ; la convolée est nulle pour $x < 0$.

    **3.** $f * f(x) = \mathop{\displaystyle \int} f(x - y)f(y)\,\mathrm{d} y$ est nulle si $x < 2$. Pour $x \geqslant 2$, l'intégrande est non nul pour $1 \leqslant y \leqslant x - 1$, et la décomposition $\dfrac{1}{(x - y)^{2}y^{2}} = \dfrac{1}{x^{2}}\big(\dfrac{1}{y} + \dfrac{1}{x - y}\big)^{2}$ donne 
    $$f * f(x) = \frac{2}{x^{2}}\Big(\frac{x - 2}{x - 1} + \frac{2\ln(x - 1)}{x}\Big)\chi_{[2, +\infty[}(x),$$
     formule confirmée numériquement en $x = 3{,}5$ (valeur $0{,}18344$).
