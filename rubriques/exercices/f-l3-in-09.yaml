  enonce: |
    *Théorème de Weierstrass, par les noyaux de Landau.* Pour $n \geqslant 1$, soit $a_{n} = \mathop{\displaystyle \int_{-1}^{1}}(1 - t^{2})^{n}\,\mathrm{d} t$ et $p_{n}(t) = \dfrac{(1 - t^{2})^{n}}{a_{n}}$ si $|t| \leqslant 1$, $p_{n}(t) = 0$ sinon.

    **1.** Montrer que $a_{n} \geqslant \dfrac{1}{n + 1}$, et que $(p_{n})$ est une approximation de l'unité.

    **2.** Soit $f$ continue sur $\mathbb{R}$, nulle hors de $I = [-\dfrac{1}{2}, \dfrac{1}{2}]$. Montrer que $p_{n} * f$ est polynomiale sur $I$, et en déduire que $f$ est limite uniforme sur $I$ de polynômes.

    **3.** En déduire que toute fonction continue sur un segment est limite uniforme de polynômes.
  corrige: |
    **1.** $a_{n} = 2\mathop{\displaystyle \int_{0}^{1}}(1 - t^{2})^{n}\,\mathrm{d} t \geqslant 2\mathop{\displaystyle \int_{0}^{1}}t(1 - t^{2})^{n}\,\mathrm{d} t = \dfrac{1}{n + 1}$. Les $p_{n}$ sont positives, d'intégrale $1$, et, pour $0 < \delta < 1$, $\mathop{\displaystyle \int_{|t| \geqslant \delta}}p_{n} \leqslant \dfrac{2(1 - \delta^{2})^{n}}{a_{n}} \leqslant 2(n + 1)(1 - \delta^{2})^{n} \to 0$.

    **2.** Pour $x \in I$, $p_{n} * f(x) = \mathop{\displaystyle \int_{I}}p_{n}(x - t)f(t)\,\mathrm{d} t$, et $|x - t| \leqslant 1$ pour $x$, $t \in I$ : $p_{n}(x - t) = \dfrac{(1 - (x - t)^{2})^{n}}{a_{n}}$ est un polynôme en $(x, t)$, et $p_{n} * f$ est un polynôme en $x$ sur $I$. Comme $f$ est continue à support compact, donc bornée et uniformément continue, $p_{n} * f \to f$ uniformément sur $\mathbb{R}$ (th. 2).

    **3.** Par une bijection affine, on envoie $J$ sur $[-\dfrac{1}{4}, \dfrac{1}{4}]$ ; on prolonge la fonction obtenue en une fonction continue sur $\mathbb{R}$, affine sur $[-\dfrac{1}{2}, -\dfrac{1}{4}]$ et sur $[\dfrac{1}{4}, \dfrac{1}{2}]$, nulle hors de $I$. La question 2 et la bijection affine inverse, qui transforme les polynômes en polynômes, concluent.
