  source: "Féjoz (exosIntegration), exercice 5.4"
  page_enonce: 7
  page_corrige: 11
  enonce: |
    **1.** Soit $\phi$ de classe $C^{\infty}$ sur $\mathbb{T}$. Montrer, par deux intégrations par parties, que $|c_{k}(\phi)| \leqslant \dfrac{C}{k^{2}}$, et en déduire que la série de Fourier de $\phi$ converge uniformément.

    **2.** Montrer que $S_{N}\phi(t) = \dfrac{1}{2\pi}\mathop{\displaystyle \int_{0}^{2\pi}}\phi(\theta)D_{N}(t - \theta)\,\mathrm{d}\theta$, avec $D_{N}(x) = \dfrac{\sin((N + \frac{1}{2})x)}{\sin(x/2)}$, et en déduire, à l'aide de l'exercice 26, que $S_{N}\phi \to \phi$ uniformément.

    **3.** Soit $\alpha \in \mathbb{R}$ et $g \in L^{2}(\mathbb{T})$. On cherche $f \in L^{2}(\mathbb{T})$ telle que $f(t + 2\pi\alpha) - f(t) = g(t)$. Exprimer les $c_{k}(f)$ en fonction des $c_{k}(g)$. Montrer que, si $\alpha$ est rationnel, l'équation n'a pas de solution en général, et donner un exemple avec $\alpha \notin \mathbb{Q}$ où elle admet une solution non constante.
  corrige: |
    **1.** Deux intégrations par parties, sans termes de bord par périodicité, donnent $c_{k}(\phi) = \dfrac{c_{k}(\phi'')}{(\mathrm{i} k)^{2}}$ pour $k \neq 0$, d'où $|c_{k}(\phi)| \leqslant \dfrac{\lVert \phi'' \rVert_{\infty}}{k^{2}}$. La série $\mathop{\displaystyle \sum} c_{k}(\phi)e_{k}$ converge normalement, donc uniformément, vers une fonction continue $\psi$.

    **2.** Par l'exercice 26, $S_{N}\phi = \phi * S_{N}$, avec $S_{N} = D_{N}$. Pour chaque $t$, la suite $S_{N}\phi(t)$ converge vers $\psi(t)$, donc ses moyennes de Cesàro aussi ; or ces moyennes, $\phi * C_{N}(t)$, tendent vers $\phi(t)$ par l'exercice 26. Donc $\psi = \phi$, et $S_{N}\phi \to \phi$ uniformément.

    **3.** $c_{k}(f(\cdot + 2\pi\alpha)) = \mathrm{e}^{2\mathrm{i}\pi k\alpha}c_{k}(f)$ : l'équation équivaut, par l'injectivité des coefficients (th. 4), à $(\mathrm{e}^{2\mathrm{i}\pi k\alpha} - 1)c_{k}(f) = c_{k}(g)$ pour tout $k$. Si $\alpha = \dfrac{p}{q}$, avec $q \geqslant 1$, le facteur s'annule pour $k = q$ : il faut $c_{q}(g) = 0$, et $g = e_{q}$ n'a pas de solution. Si $\alpha \notin \mathbb{Q}$, $f = e_{1}$ est solution, non constante, pour $g = (\mathrm{e}^{2\mathrm{i}\pi\alpha} - 1)e_{1}$. Plus généralement, une solution est déterminée à une constante près, et elle existe si et seulement si $c_{0}(g) = 0$ et $\mathop{\displaystyle \sum_{k \neq 0}}\dfrac{|c_{k}(g)|^{2}}{|\mathrm{e}^{2\mathrm{i}\pi k\alpha} - 1|^{2}} < +\infty$ (Parseval), condition qui dépend des propriétés arithmétiques de $\alpha$.
- id: "l3-in-09-28"
  feuille: "f-l3-in-09"
  numero: 28
  partie: "Sur le cercle"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [convolution sur le cercle]
  noeuds: [fo-parseval, fc-weierstrass]
  notions: [produit-convolution]
  source: "Féjoz (exosIntegration), exercice 6.9"
  page_enonce: 7
  page_corrige: 11
  enonce: |
    *Rotations irrationnelles.* Soit $\alpha \in \mathbb{R}$ et $R(t) = t + 2\pi\alpha$ sur $\mathbb{T}$. Une fonction borélienne $\varphi$ est *presque invariante* si $\varphi \circ R = \varphi$ presque partout.

    **1.** Pour $\alpha = \dfrac{1}{2}$, donner une fonction presque invariante non constante.

    **2.** Calculer les coefficients de Fourier de $\varphi \circ R$ en fonction de ceux de $\varphi$, pour $\varphi \in L^{1}(\mathbb{T})$.

    **3.** Si $\alpha$ est irrationnel, montrer qu'une fonction presque invariante intégrable est presque partout constante. En déduire que les seules parties presque invariantes sont négligeables ou de complémentaire négligeable (*ergodicité*). Interpréter.
  corrige: |
    **1.** $R(t) = t + \pi$, et $\varphi(t) = \cos 2t$, de période $\pi$, est invariante.

    **2.** Le changement de variable $u = t + 2\pi\alpha$ donne $\boxed{c_{k}(\varphi \circ R) = \mathrm{e}^{2\mathrm{i}\pi k\alpha}c_{k}(\varphi)}$.

    **3.** Si $\varphi \circ R = \varphi$ presque partout, $(\mathrm{e}^{2\mathrm{i}\pi k\alpha} - 1)c_{k}(\varphi) = 0$ ; pour $\alpha$ irrationnel, le facteur ne s'annule que pour $k = 0$. Ainsi $\varphi - c_{0}(\varphi)$ a tous ses coefficients nuls, et $\varphi = c_{0}(\varphi)$ presque partout (th. 4). Pour $\varphi$ borélienne quelconque, on applique ce résultat à $\arctan\varphi$, bornée. Si $A$ est presque invariante, $\chi_{A}$ est presque partout constante, égale à $0$ ou à $1$ : $\lambda(A) = 0$ ou $\lambda(\mathbb{T} \setminus A) = 0$. On ne peut pas découper le cercle en deux parties de mesures positives que la rotation conserverait chacune : la dynamique est indécomposable, au sens de la mesure, et presque toute orbite visite toute partie de mesure positive.

