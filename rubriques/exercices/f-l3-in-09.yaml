  enonce: |
    Soit $f$, $g \in L^{1}(\mathbb{R}^{n})$. Montrer que $\mathop{\displaystyle \int}\widehat{f}g = \mathop{\displaystyle \int} f\widehat{g}$ et que $\widehat{f * g} = \widehat{f}\,\widehat{g}$.
  corrige: |
    $(\xi, x) \mapsto f(\xi)g(x)\mathrm{e}^{-\mathrm{i}\langle\xi, x\rangle}$ est intégrable sur $\mathbb{R}^{2n}$, de module $|f(\xi)||g(x)|$ ; par Fubini, l'intégrer d'abord en $\xi$ ou d'abord en $x$ donne $\mathop{\displaystyle \int}\widehat{f}g = \mathop{\displaystyle \int} f\widehat{g}$. De même, $(x, y) \mapsto f(x - y)g(y)\mathrm{e}^{-\mathrm{i}\langle\xi, x\rangle}$ est intégrable, d'intégrale de module $\leqslant \lVert f \rVert_{1}\lVert g \rVert_{1}$, et, avec $x = y + u$, 
    $$\widehat{f * g}(\xi) = \int g(y)\mathrm{e}^{-\mathrm{i}\langle\xi, y\rangle}\Big(\int f(u)\mathrm{e}^{-\mathrm{i}\langle\xi, u\rangle}\,\mathrm{d} u\Big)\mathrm{d} y = \widehat{f}(\xi)\,\widehat{g}(\xi).$$
     La transformation de Fourier change la convolution en produit : c'est ce qui en fait l'outil naturel de l'étude des équations de convolution.
