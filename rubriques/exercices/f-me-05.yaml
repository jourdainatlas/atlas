  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 401"
  page_enonce: 7
  page_corrige: 20
  enonce: |
    Soit $n$ un entier $\geqslant 2$. Déterminer les complexes $z$ tels que : 
    $$(z-i)^{n}=(z+i)^{n}.$$
     On pourra noter qu'une solution $z$ de cette équation est nécessairement différente de $i$ et réécrire l'équation sous la forme : 
    $$\left(\frac{z+i}{z-i}\right)^{n}=1.$$
  corrige: |
    Si $z=i$, l'équation donne $0=(2i)^{n}$, ce qui est faux : une solution vérifie $z\neq i$, et l'équation équivaut à $w^{n}=1$ avec $w=\dfrac{z+i}{z-i}$. D'après l'exercice 22, $w=e^{i\theta_{k}}$ avec $\theta_{k}=\dfrac{2k\pi}{n}$, $k\in\llbracket 0;n-1\rrbracket$. Le cas $k=0$ est impossible, puisque $w=1$ donnerait $z+i=z-i$. Pour $k\in\llbracket 1;n-1\rrbracket$, on isole $z$ : 
    $$z+i=w(z-i) \iff z(1-w)=-i(1+w) \iff z=-i\,\frac{1+e^{i\theta_{k}}}{1-e^{i\theta_{k}}}.$$
     Par l'arc moitié, $1+e^{i\theta}=2\cos\left(\frac{\theta}{2}\right)e^{i\frac{\theta}{2}}$ et $1-e^{i\theta}=-2i\sin\left(\frac{\theta}{2}\right)e^{i\frac{\theta}{2}}$ (exercice 24), d'où : 
    $$\boxed{z=\frac{\cos\left(\frac{k\pi}{n}\right)}{\sin\left(\frac{k\pi}{n}\right)}, \qquad k\in\llbracket 1;n-1\rrbracket}$$
     Ces $n-1$ nombres sont réels et distincts. *Vérification pour $n=2$ :* $z=\frac{\cos(\pi/2)}{\sin(\pi/2)}=0$, et en effet $(0-i)^{2}=(0+i)^{2}=-1$. Géométriquement, la relation impose $|z-i|=|z+i|$, donc $z$ réel (exercice 25) : c'est cohérent.
