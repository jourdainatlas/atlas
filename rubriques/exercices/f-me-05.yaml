  enonce: |
    On veut résoudre l'équation d'inconnue $z\in\mathbb{C}$ : 
    $$(1) \qquad z^{5}=\overline{z}.$$
     Montrer que, si $z$ vérifie (1), alors $z$ est nul ou de module $1$. Conclure ; on montrera en particulier que l'équation admet $7$ solutions.
  corrige: |
    Si $z^{5}=\overline{z}$, alors $|z|^{5}=|\overline{z}|=|z|$, donc $|z|\left(|z|^{4}-1\right)=0$ : $|z|=0$ ou $|z|=1$, puisque $|z|$ est un réel positif.

    Le nombre $0$ est solution. Si $|z|=1$, alors $z\overline{z}=1$, donc $\overline{z}=\dfrac{1}{z}$ et l'équation équivaut à $z^{6}=1$. D'après l'exercice 22, $z$ est l'une des six racines sixièmes de l'unité $e^{i\frac{k\pi}{3}}$, $k\in\llbracket 0;5\rrbracket$, qui sont bien de module $1$. Réciproquement, ces six nombres vérifient $z^{5}=\dfrac{z^{6}}{z}=\dfrac{1}{z}=\overline{z}$. 
    $$\boxed{\mathcal{S}=\left\{0\right\}\cup\left\{e^{i\frac{k\pi}{3}}\;;\;k\in\llbracket 0;5\rrbracket\right\}}$$
     L'équation admet donc $7$ solutions : $0$ et les sommets de l'hexagone régulier de l'exercice 22.
- id: "me-05-28"
  feuille: "f-me-05"
  numero: 28
  partie: "Pour aller plus loin"
