  enonce: |
    Trouver les nombres complexes $z$ tels que 
    $$(z-1)^{3}=i(z+1)^{3}.$$
  corrige: |
    $z=-1$ n'est pas solution (le membre de gauche vaut $-8$, celui de droite $0$). Pour $z\neq -1$, l'équation équivaut à $w^{3}=i=e^{i\frac{\pi}{2}}$ avec $w=\dfrac{z-1}{z+1}$. Comme dans l'exercice 22, $|w|=1$ et $3\arg(w)\equiv\frac{\pi}{2}\;[2\pi]$, d'où $w=e^{i\varphi}$ avec $\varphi\in\left\{\frac{\pi}{6}\;;\frac{5\pi}{6}\;;\frac{3\pi}{2}\right\}$. Comme $w\neq 1$, on isole $z$ : 
    $$z-1=w(z+1) \iff z=\frac{1+w}{1-w}=\frac{2\cos\left(\frac{\varphi}{2}\right)e^{i\frac{\varphi}{2}}}{-2i\sin\left(\frac{\varphi}{2}\right)e^{i\frac{\varphi}{2}}}=i\,\frac{\cos\left(\frac{\varphi}{2}\right)}{\sin\left(\frac{\varphi}{2}\right)}.$$
     Avec $\frac{\varphi}{2}\in\left\{\frac{\pi}{12}\;;\frac{5\pi}{12}\;;\frac{3\pi}{4}\right\}$ : d'après l'exercice 11, $\tan\left(\frac{\pi}{12}\right)=2-\sqrt{3}$, donc $\dfrac{\cos(\pi/12)}{\sin(\pi/12)}=\dfrac{1}{2-\sqrt{3}}=2+\sqrt{3}$ ; comme $\frac{5\pi}{12}=\frac{\pi}{2}-\frac{\pi}{12}$, $\dfrac{\cos(5\pi/12)}{\sin(5\pi/12)}=\dfrac{\sin(\pi/12)}{\cos(\pi/12)}=2-\sqrt{3}$ ; enfin $\dfrac{\cos(3\pi/4)}{\sin(3\pi/4)}=-1$. Ainsi : 
    $$\boxed{\mathcal{S}=\left\{i(2+\sqrt{3})\;;\;i(2-\sqrt{3})\;;\;-i\right\}}$$
     *Vérification pour $z=-i$ :* $(-1-i)^{3}=2-2i$ et $i(1-i)^{3}=i(-2-2i)=2-2i$.

