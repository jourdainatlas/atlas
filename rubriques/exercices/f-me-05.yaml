  enonce: |
    **a)** Déterminer une fonction polynomiale $P$ telle que $\forall x\in\mathbb{R}$, $\cos(5x)=P\big(\cos(x)\big)$.

    **b)** En déduire la valeur de $\cos\left(\dfrac{\pi}{10}\right)$.
  corrige: |
    **a)** Comme dans l'exercice 28, avec $c=\cos(x)$ et $s=\sin(x)$, la partie réelle de $(c+is)^{5}$ vaut $c^{5}-10c^{3}s^{2}+5cs^{4}$. En remplaçant $s^{2}$ par $1-c^{2}$ : 
    $$\cos(5x)=c^{5}-10c^{3}(1-c^{2})+5c(1-c^{2})^{2}=16c^{5}-20c^{3}+5c, \qquad\text{d'où}\qquad \boxed{P(X)=16X^{5}-20X^{3}+5X}.$$

    **b)** Pour $x=\frac{\pi}{10}$, $\cos(5x)=\cos\left(\frac{\pi}{2}\right)=0$, donc $c=\cos\left(\frac{\pi}{10}\right)$ vérifie $c\left(16c^{4}-20c^{2}+5\right)=0$. Comme $c>0$, $c^{2}$ est racine de $16X^{2}-20X+5=0$, de discriminant $80$ : $c^{2}=\frac{5\pm\sqrt{5}}{8}$. Or $\frac{\pi}{10}<\frac{\pi}{4}$, donc $c>\frac{\sqrt{2}}{2}$ et $c^{2}>\frac{1}{2}$ ; seule la valeur $\frac{5+\sqrt{5}}{8}\approx 0{,}90$ convient ($\frac{5-\sqrt{5}}{8}\approx 0{,}35$). Ainsi : 
    $$\boxed{\cos\left(\frac{\pi}{10}\right)=\sqrt{\frac{5+\sqrt{5}}{8}}=\frac{\sqrt{10+2\sqrt{5}}}{4}}\approx 0{,}951.$$

    L'autre valeur $\sqrt{\frac{5-\sqrt{5}}{8}}$ est $\cos\left(\frac{3\pi}{10}\right)$, puisque $5\times\frac{3\pi}{10}=\frac{3\pi}{2}$ annule aussi le cosinus.
- id: "me-05-33"
  feuille: "f-me-05"
  numero: 33
  titre: "Calcul de $\\cos\\left(\\frac{2\\pi}{5}\\right)$"
  partie: "Pour aller plus loin"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [forme trigonométrique]
  noeuds: [cx-pi]
  notions: [pi]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 398"
  page_enonce: 7
  page_corrige: 19
  enonce: |
    Soient $z=e^{\frac{2i\pi}{5}}$ et $x=2\cos\left(\dfrac{2\pi}{5}\right)$.

    **a)** Montrer que $1+z+z^{2}+z^{3}+z^{4}=0$.

    **b)** Vérifier l'égalité $x=z+\dfrac{1}{z}$.

    **c)** Exprimer $x^{2}$ en fonction de $z$. En utilisant a), trouver alors une équation du second degré vérifiée par $x$. En déduire une expression simple du nombre $\cos\left(\dfrac{2\pi}{5}\right)$.

    **d)** Calculer $\sin\left(\dfrac{2\pi}{5}\right)$.
  corrige: |
    **a)** $z^{5}=e^{2i\pi}=1$ et $z\neq 1$, donc $1+z+z^{2}+z^{3}+z^{4}=\dfrac{z^{5}-1}{z-1}=0$ (exercice 22).

    **b)** $\dfrac{1}{z}=e^{-\frac{2i\pi}{5}}$, donc $z+\dfrac{1}{z}=2\cos\left(\dfrac{2\pi}{5}\right)=x$ (formule d'Euler).

    **c)** $x^{2}=z^{2}+2+\dfrac{1}{z^{2}}$. En divisant la relation a) par $z^{2}$, on obtient $z^{2}+z+1+\dfrac{1}{z}+\dfrac{1}{z^{2}}=0$, c'est-à-dire $(x^{2}-2)+x+1=0$ : $\boxed{x^{2}+x-1=0}$. Comme $x>0$ ($\frac{2\pi}{5}<\frac{\pi}{2}$), $x=\frac{-1+\sqrt{5}}{2}$, d'où : 
    $$\boxed{\cos\left(\frac{2\pi}{5}\right)=\frac{\sqrt{5}-1}{4}} \approx 0{,}309.$$

    **d)** $\sin\left(\frac{2\pi}{5}\right)>0$ et $\sin^{2}\left(\frac{2\pi}{5}\right)=1-\frac{(\sqrt{5}-1)^{2}}{16}=\frac{10+2\sqrt{5}}{16}$, d'où $\boxed{\sin\left(\frac{2\pi}{5}\right)=\frac{\sqrt{10+2\sqrt{5}}}{4}}\approx 0{,}951$.

    On retrouve la méthode de l'exercice 25 du chapitre 2 (équation réciproque), et l'on remarque que $\sin\left(\frac{2\pi}{5}\right)=\cos\left(\frac{\pi}{10}\right)$, en accord avec l'exercice 32.
