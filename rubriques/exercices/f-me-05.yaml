  enonce: |
    Soit $\theta$ un réel. À tout point $M$ d'affixe $z\neq 0$, on associe le point $M'$ d'affixe $z'=e^{i\theta}z$.

    **1.** Montrer que $OM'=OM$ et que $\arg(z')\equiv\arg(z)+\theta\;[2\pi]$. Interpréter géométriquement.

    **2.** On considère le point $A$ d'affixe $a=3+i$. Déterminer l'affixe du point $C$ tel que $OC=OA$ et $(\overrightarrow{OA},\overrightarrow{OC})\equiv\dfrac{\pi}{2}\;[2\pi]$, puis celle du point $B$ tel que $OABC$ soit un carré.

    **3.** Déterminer l'affixe du point $D$ obtenu en tournant $A$ d'un angle $\dfrac{\pi}{3}$ autour de $O$. À l'aide de l'exercice 4, montrer que le triangle $OAD$ est équilatéral.
  corrige: |
    **1.** D'après la Proposition 4, $|z'|=\left|e^{i\theta}\right||z|=|z|$, donc $OM'=OM$, et $\arg(z')\equiv\theta+\arg(z)\;[2\pi]$, c'est-à-dire $(\overrightarrow{OM},\overrightarrow{OM'})\equiv\theta\;[2\pi]$. Le point $M'$ s'obtient donc en **tournant** $M$ d'un angle $\theta$ autour de $O$ : c'est l'image de $M$ par la rotation de centre $O$ et d'angle $\theta$.

    **2.** Le point $C$ est l'image de $A$ par la rotation d'angle $\dfrac{\pi}{2}$, et $e^{i\frac{\pi}{2}}=i$ : $c=ia=i(3+i)=\boxed{-1+3i}$. Le quadrilatère $OABC$ est un carré lorsque $\overrightarrow{OB}=\overrightarrow{OA}+\overrightarrow{OC}$, et les coordonnées s'ajoutant, $b=a+c=\boxed{2+4i}$.

    **3.** On a $d=e^{i\frac{\pi}{3}}a=\left(\dfrac{1}{2}+i\dfrac{\sqrt{3}}{2}\right)(3+i)$, soit : 
    $$\boxed{d=\frac{3-\sqrt{3}}{2}+i\,\frac{1+3\sqrt{3}}{2}} \approx 0{,}63+3{,}10\,i.$$
     D'après l'exercice 4 : $OA=|a|=\sqrt{10}$, $OD=|d|=|a|=\sqrt{10}$ et $AD=|d-a|=\left|e^{i\frac{\pi}{3}}-1\right||a|$. Or $e^{i\frac{\pi}{3}}-1=-\dfrac{1}{2}+i\dfrac{\sqrt{3}}{2}$, de module $1$. Donc $AD=\sqrt{10}$ et $\boxed{OAD \text{ est équilatéral}}$.

    ![Figure](documents/figures/23a5be7da179766f.svg)

    Le carré $OABC$ (en violet) s'obtient avec un quart de tour, le triangle équilatéral $OAD$ (en ocre) avec un sixième de tour : multiplier une affixe par $e^{i\theta}$, c'est tourner.
- id: "me-05-24"
  feuille: "f-me-05"
  numero: 24
  titre: "Une somme trigonométrique"
  partie: "Exercices d'approfondissement"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [forme trigonométrique, forme exponentielle, sommes trigonométriques]
  noeuds: [cx-pi, cx-exponentielle]
  notions: [pi, exponentielle]
  page_enonce: 5
  page_corrige: 16
  enonce: |
    **1.** Soit $\alpha$ un réel. En factorisant par $e^{i\frac{\alpha}{2}}$, montrer que $e^{i\alpha}-1=2i\sin\left(\dfrac{\alpha}{2}\right)e^{i\frac{\alpha}{2}}$.

    **2.** Soient $x\in\,]0;2\pi[$ et $n\in\mathbb{N}$. On pose $S=\displaystyle\sum_{k=0}^{n}e^{ikx}$. Montrer que : 
    $$S=\frac{e^{i(n+1)x}-1}{e^{ix}-1}=e^{i\frac{nx}{2}}\,\frac{\sin\left(\frac{(n+1)x}{2}\right)}{\sin\left(\frac{x}{2}\right)}.$$

    **3.** En déduire une expression simple de $\displaystyle\sum_{k=0}^{n}\cos(kx)$ et de $\displaystyle\sum_{k=0}^{n}\sin(kx)$, puis vérifier le résultat pour $n=1$.
  corrige: |
    **1.** On factorise : $e^{i\alpha}-1=e^{i\frac{\alpha}{2}}\left(e^{i\frac{\alpha}{2}}-e^{-i\frac{\alpha}{2}}\right)=e^{i\frac{\alpha}{2}}\times 2i\sin\left(\dfrac{\alpha}{2}\right)$, d'après la formule d'Euler pour le sinus. Ainsi $\boxed{e^{i\alpha}-1=2i\sin\left(\frac{\alpha}{2}\right)e^{i\frac{\alpha}{2}}}$.

    **2.** $S$ est la somme des termes d'une suite géométrique de raison $e^{ix}$, différente de $1$ puisque $x\in\,]0;2\pi[$ : 
    $$S=\frac{\left(e^{ix}\right)^{n+1}-1}{e^{ix}-1}=\frac{2i\sin\left(\frac{(n+1)x}{2}\right)e^{i\frac{(n+1)x}{2}}}{2i\sin\left(\frac{x}{2}\right)e^{i\frac{x}{2}}}=\boxed{e^{i\frac{nx}{2}}\,\frac{\sin\left(\frac{(n+1)x}{2}\right)}{\sin\left(\frac{x}{2}\right)}},$$
     en appliquant la question 1 avec $\alpha=(n+1)x$ et $\alpha=x$ ; on a bien $\sin\left(\frac{x}{2}\right)\neq 0$.

    **3.** Comme $e^{ikx}=\cos(kx)+i\sin(kx)$, on prend les parties réelle et imaginaire de $S$ : 
    $$\boxed{\sum_{k=0}^{n}\cos(kx)=\frac{\cos\left(\frac{nx}{2}\right)\sin\left(\frac{(n+1)x}{2}\right)}{\sin\left(\frac{x}{2}\right)} \qquad\text{et}\qquad \sum_{k=0}^{n}\sin(kx)=\frac{\sin\left(\frac{nx}{2}\right)\sin\left(\frac{(n+1)x}{2}\right)}{\sin\left(\frac{x}{2}\right)}}$$
     *Vérification pour $n=1$ :* le membre de droite vaut $\dfrac{\cos\left(\frac{x}{2}\right)\sin(x)}{\sin\left(\frac{x}{2}\right)}=\dfrac{\cos\left(\frac{x}{2}\right)\times 2\sin\left(\frac{x}{2}\right)\cos\left(\frac{x}{2}\right)}{\sin\left(\frac{x}{2}\right)}=2\cos^{2}\left(\frac{x}{2}\right)=1+\cos(x)$, ce qui est bien $\cos(0)+\cos(x)$.

    La technique de la question 1, dite de l'*arc moitié*, est réutilisée dans les exercices 29, 34, 35 et 37.
