  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 374 et 376"
  page_enonce: 6
  page_corrige: 18
  enonce: |
    **1.** Trouver deux fonctions polynomiales $P$ et $Q$ telles que 
    $$\forall x\in\mathbb{R}, \qquad \cos(4x)=P\big(\cos(x)\big), \qquad \sin(4x)=\sin(x)\,Q\big(\cos(x)\big).$$

    **2.** **Linéarisation.**

    **a)** Écrire $x\mapsto\cos^{3}(x)$ comme combinaison linéaire des fonctions $x\mapsto\cos(kx)$, $k\in\{0,\dots,3\}$.

    **b)** Écrire $x\mapsto\cos^{4}(x)$ comme combinaison linéaire des fonctions $x\mapsto\cos(kx)$, $k\in\{0,\dots,4\}$.
  corrige: |
    **1.** On note $c=\cos(x)$ et $s=\sin(x)$. D'après la formule de Moivre et le binôme : 
    $$\cos(4x)+i\sin(4x)=(c+is)^{4}=c^{4}+4ic^{3}s-6c^{2}s^{2}-4ics^{3}+s^{4}.$$
     Les parties réelles donnent, avec $s^{2}=1-c^{2}$ : $\cos(4x)=c^{4}-6c^{2}(1-c^{2})+(1-c^{2})^{2}=8c^{4}-8c^{2}+1$. Les parties imaginaires donnent $\sin(4x)=s\,(4c^{3}-4c(1-c^{2}))=s\,(8c^{3}-4c)$. Ainsi : 
    $$\boxed{P(X)=8X^{4}-8X^{2}+1 \qquad\text{et}\qquad Q(X)=8X^{3}-4X}$$

    **2.** **a)** C'est l'exercice 20, question 2 : $\boxed{\cos^{3}(x)=\frac{3}{4}\cos(x)+\frac{1}{4}\cos(3x)}$.

    **b)** D'après la formule d'Euler et le binôme : 
    $$\cos^{4}(x)=\frac{\left(e^{ix}+e^{-ix}\right)^{4}}{16}=\frac{e^{4ix}+4e^{2ix}+6+4e^{-2ix}+e^{-4ix}}{16}=\frac{2\cos(4x)+8\cos(2x)+6}{16},$$
     d'où $\boxed{\cos^{4}(x)=\frac{3}{8}+\frac{1}{2}\cos(2x)+\frac{1}{8}\cos(4x)}$. *Vérification :* pour $x=0$, $\frac{3}{8}+\frac{1}{2}+\frac{1}{8}=1$.
- id: "me-05-29"
  feuille: "f-me-05"
  numero: 29
  partie: "Pour aller plus loin"
