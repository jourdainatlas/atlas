  enonce: |
    Montrer, pour $x$ réel et $n$ entier $\geqslant 2$ : 
    $$\sum_{k=0}^{n-1}\cos\left(x+\frac{2k\pi}{n}\right)=0.$$
     *On pourra utiliser l'exercice 22.*
  corrige: |
    On a $\cos\left(x+\frac{2k\pi}{n}\right)=\mathcal{R}e\left(e^{ix}e^{i\frac{2k\pi}{n}}\right)=\mathcal{R}e\left(e^{ix}\omega_{k}\right)$ avec les notations de l'exercice 22. Ainsi : 
    $$\sum_{k=0}^{n-1}\cos\left(x+\frac{2k\pi}{n}\right)=\mathcal{R}e\left(e^{ix}\sum_{k=0}^{n-1}\omega_{1}^{k}\right)=\mathcal{R}e\left(e^{ix}\times 0\right)=\boxed{0}.$$
     Pour $n=3$, on retrouve la question 1.(a) de l'exercice 9 : $\cos(x)+\cos\left(x+\frac{2\pi}{3}\right)+\cos\left(x+\frac{4\pi}{3}\right)=0$.
