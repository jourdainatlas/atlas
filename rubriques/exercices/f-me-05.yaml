  enonce: |
    On note $\mathbb{U}$ l'ensemble des nombres complexes de module $1$. Il est conseillé, dans cet exercice, d'éviter les parties réelles et imaginaires et de travailler avec les carrés des modules écrits avec l'aide du conjugué. Soit $a\in\mathbb{C}$.

    **a)** Montrer que, si $a\in\mathbb{C}\setminus\mathbb{U}$, 
    $$\forall z\in\mathbb{U}, \qquad \frac{z-a}{1-\overline{a}z}\in\mathbb{U}.$$

    **b)** Soit $D=\{z\in\mathbb{C}\;;\;|z|<1\}$. Montrer que, si $a\in D$, alors 
    $$\forall z\in D, \qquad \frac{z-a}{1-\overline{a}z}\in D.$$
  corrige: |
    **a)** Soit $z\in\mathbb{U}$. Alors $|\overline{a}z|=|a|\neq 1$, donc $1-\overline{a}z\neq 0$ et le quotient est défini. Comme $z\overline{z}=1$ : 
    $$1-\overline{a}z=z\overline{z}-\overline{a}z=z\left(\overline{z}-\overline{a}\right)=z\,\overline{z-a},$$
     donc $|1-\overline{a}z|=|z|\,|z-a|=|z-a|$, et $\boxed{\left|\frac{z-a}{1-\overline{a}z}\right|=1}$.

    **b)** Soient $a$ et $z$ dans $D$. Alors $|\overline{a}z|<1$, donc $1-\overline{a}z\neq 0$. En développant avec les conjugués : 
    $$\begin{aligned} |1-\overline{a}z|^{2}-|z-a|^{2} &= (1-\overline{a}z)(1-a\overline{z})-(z-a)(\overline{z}-\overline{a}) \\ &= 1-a\overline{z}-\overline{a}z+|a|^{2}|z|^{2}-|z|^{2}+z\overline{a}+a\overline{z}-|a|^{2} \\ &= (1-|a|^{2})(1-|z|^{2})>0. \end{aligned}$$
     Ainsi $|z-a|<|1-\overline{a}z|$, et $\boxed{\left|\frac{z-a}{1-\overline{a}z}\right|<1}$.

    Ces transformations, qui conservent le cercle unité et le disque qu'il borde, jouent un rôle central en analyse complexe et en géométrie hyperbolique.
