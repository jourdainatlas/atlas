  noeuds: [cx-pi]
  notions: [pi]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 361 et 363"
  page_enonce: 6
  page_corrige: 17
  enonce: |
    **1.** Mettre $1+i\sqrt{3}$ sous forme trigonométrique et trouver les entiers naturels $n$ tels que $(1+i\sqrt{3})^{n}\in\mathbb{R}^{+}$.

    **2.** **a)** En utilisant la forme trigonométrique, déterminer les nombres complexes dont le carré est un nombre réel.

    **b)** En utilisant la forme trigonométrique, déterminer les nombres complexes dont le carré est un nombre imaginaire pur.
  corrige: |
    **1.** $|1+i\sqrt{3}|=2$ et $1+i\sqrt{3}=2\left(\cos\left(\frac{\pi}{3}\right)+i\sin\left(\frac{\pi}{3}\right)\right)$. D'après la formule de Moivre : 
    $$(1+i\sqrt{3})^{n}=2^{n}\left(\cos\left(\frac{n\pi}{3}\right)+i\sin\left(\frac{n\pi}{3}\right)\right),$$
     qui est un réel positif si et seulement si $\frac{n\pi}{3}\equiv 0\;[2\pi]$, c'est-à-dire : 
    $$\boxed{n\equiv 0\;[6]}, \qquad n\in\{0\;;6\;;12\;;\dots\}$$

    **2.** Soit $z=re^{i\theta}$ non nul ($z=0$ convient dans les deux cas). Alors $z^{2}=r^{2}e^{2i\theta}$.

    **a)** $z^{2}$ est réel si et seulement si $2\theta\equiv 0\;[\pi]$, soit $\theta\equiv 0\;\left[\frac{\pi}{2}\right]$ : 
    $$\boxed{z \text{ est réel ou imaginaire pur}}$$

    **b)** $z^{2}$ est imaginaire pur si et seulement si $2\theta\equiv\frac{\pi}{2}\;[\pi]$, soit $\theta\equiv\frac{\pi}{4}\;\left[\frac{\pi}{2}\right]$ : 
    $$\boxed{z \text{ est sur l'une des deux bissectrices}}$$
     c'est-à-dire $z=x(1+i)$ ou $z=x(1-i)$ avec $x$ réel.

    On retrouve les résultats de l'exercice 30 du chapitre 2, obtenus alors par la forme algébrique.
