  enonce: |
    En utilisant les formules d'Euler, montrer que pour tout réel $x$, 
    $$\cos^{2}(x)\sin^{2}(x)=\frac{1-\cos(4x)}{8}$$
  corrige: |
    * On démontre ici l'égalité $\cos^2(x)\sin^2(x)=\dfrac{1-\cos(4x)}{8}$.*

    Soit $x$ un réel quelconque. On applique les formules d'Euler au produit $\cos(x)\sin(x)$ : 
    $$\begin{aligned} \cos(x)\sin(x) &= \frac{e^{ix}+e^{-ix}}{2}\times\frac{e^{ix}-e^{-ix}}{2i}\\ &= \frac{\left(e^{ix}\right)^2-\left(e^{-ix}\right)^2}{4i}\\ &= \frac{e^{2ix}-e^{-2ix}}{4i} \end{aligned}$$
     On élève alors cette égalité au carré, en remarquant que $(4i)^2=16i^2=-16$ : 
    $$\begin{aligned} \cos^2(x)\sin^2(x) &= \frac{\left(e^{2ix}-e^{-2ix}\right)^2}{-16}\\ &= \frac{e^{4ix}-2e^{2ix}e^{-2ix}+e^{-4ix}}{-16}\\ &= \frac{\overbrace{e^{4ix}+e^{-4ix}}^{=\,2\cos(4x)}-2}{-16}\\ &= \frac{2\cos(4x)-2}{-16} \end{aligned}$$
     On en déduit donc que pour tout réel $x$ : 
    $$\boxed{\cos^2(x)\sin^2(x)=\frac{1-\cos(4x)}{8}}$$
- id: "me-05-22"
  feuille: "f-me-05"
  numero: 22
  titre: "Racines $n$-ièmes de l'unité"
  partie: "Exercices d'approfondissement"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [affixe et représentation, module, argument, forme trigonométrique, forme exponentielle, "racines de l'unité"]
  noeuds: [c-calcul, cx-pi, cx-exponentielle]
  notions: [nombre-complexe, module-complexe, pi, exponentielle]
  page_enonce: 5
  page_corrige: 15
  enonce: |
    Soit $n\geqslant 2$ un entier. On appelle *racine $n$-ième de l'unité* tout nombre complexe $z$ tel que $z^{n}=1$.

    **1.** Soit $z$ une racine $n$-ième de l'unité. Montrer que $|z|=1$, puis qu'un argument $\theta$ de $z$ vérifie $n\theta\equiv 0\;[2\pi]$.

    **2.** En déduire que les racines $n$-ièmes de l'unité sont les $n$ nombres $\omega_{k}=e^{i\frac{2k\pi}{n}}$, pour $k\in\llbracket 0;n-1\rrbracket$.

    **3.** Donner la forme algébrique des racines $n$-ièmes de l'unité pour $n=3$, $n=4$ et $n=6$, et les placer dans le plan. Que reconnaît-on pour $n=3$ ?

    **4.** Montrer que $1+\omega_{1}+\omega_{1}^{2}+\dots+\omega_{1}^{n-1}=0$. En déduire que : 
    $$\sum_{k=0}^{n-1}\cos\left(\frac{2k\pi}{n}\right)=0 \qquad\text{et}\qquad \sum_{k=0}^{n-1}\sin\left(\frac{2k\pi}{n}\right)=0.$$
  corrige: |
    **1.** Si $z^{n}=1$, alors $z\neq 0$ et, d'après la Proposition 4, $|z|^{n}=|z^{n}|=1$ ; comme $|z|$ est un réel positif, $\boxed{|z|=1}$. De plus $n\arg(z)\equiv\arg(z^{n})=\arg(1)\equiv 0\;[2\pi]$.

    **2.** D'après la question 1, $z=e^{i\theta}$ avec $n\theta=2k\pi$, $k\in\mathbb{Z}$, soit $\theta=\dfrac{2k\pi}{n}$. Réciproquement, $\left(e^{i\frac{2k\pi}{n}}\right)^{n}=e^{2ik\pi}=1$. Enfin, deux valeurs de $k$ donnent le même nombre si et seulement si leurs arguments diffèrent d'un multiple de $2\pi$, c'est-à-dire si $k$ et $k'$ sont congrus modulo $n$ (chapitre 4) : il suffit de prendre $k\in\llbracket 0;n-1\rrbracket$, et l'on obtient $n$ racines distinctes.

    **3.**

    • $n=3$ : $1$, $e^{i\frac{2\pi}{3}}=-\dfrac{1}{2}+i\dfrac{\sqrt{3}}{2}$ et $e^{i\frac{4\pi}{3}}=-\dfrac{1}{2}-i\dfrac{\sqrt{3}}{2}$, c'est-à-dire $1$, $j$ et $j^{2}$ : on retrouve les solutions de $z^{3}=1$ de l'exercice 20 du chapitre 2.

    • $n=4$ : $1$, $i$, $-1$, $-i$.

    • $n=6$ : $\pm 1$, $\pm\left(\dfrac{1}{2}+i\dfrac{\sqrt{3}}{2}\right)$ et $\pm\left(-\dfrac{1}{2}+i\dfrac{\sqrt{3}}{2}\right)$.

    ![Figure](documents/figures/05e533ced8fa4a5e.svg)

    Les racines sixièmes de l'unité (en bleu pétrole) sont les sommets d'un hexagone régulier inscrit dans le cercle de centre $O$ et de rayon $1$ ; une sur deux est une racine cubique de l'unité, sommet du triangle équilatéral en pointillés.

    **4.** Comme $\omega_{1}\neq 1$ et $\omega_{1}^{n}=1$, la formule de la somme géométrique (Proposition 7 du chapitre 2) donne : 
    $$1+\omega_{1}+\dots+\omega_{1}^{n-1}=\frac{\omega_{1}^{n}-1}{\omega_{1}-1}=0.$$
     Or $\omega_{1}^{k}=e^{i\frac{2k\pi}{n}}=\cos\left(\dfrac{2k\pi}{n}\right)+i\sin\left(\dfrac{2k\pi}{n}\right)$ ; en séparant parties réelle et imaginaire, on obtient les deux sommes nulles.

    Pour $n=3$, on retrouve $1+j+j^{2}=0$, utilisé dans l'exercice 20 du chapitre 2 ; l'exercice 9 en est une variante avec un décalage $x$, généralisée dans l'exercice 31.
- id: "me-05-23"
  feuille: "f-me-05"
