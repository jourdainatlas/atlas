  enonce: |
    Soient $n$ dans $\mathbb{N}^{*}$, $x\in\mathbb{R}$. En appliquant la formule du binôme à $(1+e^{ix})^{n}$ et en utilisant la technique de l'arc moitié (exercice 29), établir les formules 
    $$\sum_{k=0}^{n}\binom{n}{k}\cos(kx)=2^{n}\left(\cos\left(\frac{x}{2}\right)\right)^{n}\cos\left(\frac{nx}{2}\right),$$

    $$\sum_{k=0}^{n}\binom{n}{k}\sin(kx)=2^{n}\left(\cos\left(\frac{x}{2}\right)\right)^{n}\sin\left(\frac{nx}{2}\right).$$
  corrige: |
    D'après la formule du binôme, $(1+e^{ix})^{n}=\displaystyle\sum_{k=0}^{n}\binom{n}{k}e^{ikx}$. Par la technique de l'arc moitié (exercice 29 avec $\alpha=0$, $\beta=x$), $1+e^{ix}=2\cos\left(\frac{x}{2}\right)e^{i\frac{x}{2}}$, d'où : 
    $$\sum_{k=0}^{n}\binom{n}{k}e^{ikx}=2^{n}\left(\cos\left(\frac{x}{2}\right)\right)^{n}e^{i\frac{nx}{2}}.$$
     En prenant les parties réelle et imaginaire, on obtient les deux formules demandées. *Vérification :* pour $x=0$, la première donne $\sum\binom{n}{k}=2^{n}$.
- id: "me-05-35"
  feuille: "f-me-05"
  numero: 35
  partie: "Pour aller plus loin"
