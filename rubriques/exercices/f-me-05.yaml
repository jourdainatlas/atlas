  enonce: |
    Soient $\alpha$ et $\beta$ deux réels, $Z=e^{i\alpha}+e^{i\beta}$.

    **a)** En factorisant $e^{i\alpha}$ dans $Z$, trouver le module de $Z$ et, si $Z$ est non nul, un argument de $Z$.

    **b)** Retrouver les formules donnant $\cos(\alpha)+\cos(\beta)$ et $\sin(\alpha)+\sin(\beta)$.
  corrige: |
    **a)** On factorise $e^{i\alpha}$, puis on applique la technique de l'arc moitié à $1+e^{i(\beta-\alpha)}$ : 
    $$Z=e^{i\alpha}\left(1+e^{i(\beta-\alpha)}\right)=e^{i\alpha}e^{i\frac{\beta-\alpha}{2}}\left(e^{-i\frac{\beta-\alpha}{2}}+e^{i\frac{\beta-\alpha}{2}}\right)=2\cos\left(\frac{\beta-\alpha}{2}\right)e^{i\frac{\alpha+\beta}{2}}.$$
     Donc $\boxed{|Z|=2\left|\cos\left(\frac{\alpha-\beta}{2}\right)\right|}$. Si $\cos\left(\frac{\alpha-\beta}{2}\right)>0$, un argument de $Z$ est $\frac{\alpha+\beta}{2}$ ; s'il est négatif, c'est $\frac{\alpha+\beta}{2}+\pi$ (Proposition 1).

    **b)** En prenant les parties réelle et imaginaire : 
    $$\boxed{\cos(\alpha)+\cos(\beta)=2\cos\left(\frac{\alpha+\beta}{2}\right)\cos\left(\frac{\alpha-\beta}{2}\right), \qquad \sin(\alpha)+\sin(\beta)=2\sin\left(\frac{\alpha+\beta}{2}\right)\cos\left(\frac{\alpha-\beta}{2}\right)}$$

    Géométriquement, $Z$ est la diagonale du losange construit sur les deux vecteurs unitaires d'affixes $e^{i\alpha}$ et $e^{i\beta}$ : elle porte la bissectrice, d'angle $\frac{\alpha+\beta}{2}$.
