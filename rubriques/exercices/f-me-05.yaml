    **2.** Déterminer l'ensemble des nombres complexes $z$ tels que $|z|=|z-1|=1$. Interpréter géométriquement.
  corrige: |
    **1.** **a)** **Par le calcul.** Avec $z=x+iy$ : $|z-i|^{2}=x^{2}+(y-1)^{2}$ et $|z+i|^{2}=x^{2}+(y+1)^{2}$. L'égalité équivaut à $-2y=2y$, soit $y=0$ : $z$ est réel. **Géométriquement.** En notant $A$ et $B$ les points d'affixes $i$ et $-i$, la relation (1) s'écrit $AM=BM$ (exercice 4) : $M$ est sur la médiatrice de $[AB]$, qui est l'axe des abscisses. Dans les deux cas, $\boxed{\text{l'ensemble cherché est } \mathbb{R}}$.

    **b)** De même, $|z-i|<|z+i|$ équivaut à $-2y<2y$, soit $y>0$ : c'est le $\boxed{\text{demi-plan ouvert } \operatorname{Im}(z)>0}$, formé des points plus proches de $A$ que de $B$.

    **2.** $|z|=1$ et $|z-1|=1$ signifient $x^{2}+y^{2}=1$ et $(x-1)^{2}+y^{2}=1$. Par différence, $2x-1=0$, d'où $x=\dfrac{1}{2}$ et $y^{2}=\dfrac{3}{4}$. Ainsi $\boxed{z=\frac{1}{2}\pm i\frac{\sqrt{3}}{2}=e^{\pm i\frac{\pi}{3}}}$. Géométriquement, ce sont les points d'intersection des cercles de rayon $1$ centrés en $O$ et au point $I$ d'affixe $1$ : chacun forme avec $O$ et $I$ un triangle équilatéral.

    ![Figure](documents/figures/0b0aff3d5b3e19d7.svg)

    À gauche, la médiatrice de $[AB]$ (axe réel) sépare le plan en deux, et le demi-plan coloré est celui des points plus proches de $A$ ; à droite, les deux solutions sont les sommets des triangles équilatéraux construits sur $[OI]$.
- id: "me-05-26"
  feuille: "f-me-05"
  numero: 26
  partie: "Pour aller plus loin"
  etoiles: 2
