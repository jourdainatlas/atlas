  enonce: |
    Quels sont les $n\in\mathbb{N}^{*}$ tels que 
    $$\forall\theta\in\mathbb{R}, \qquad \big(\sin(\theta)+i\cos(\theta)\big)^{n}=\sin(n\theta)+i\cos(n\theta) \;?$$
  corrige: |
    On remarque que $\sin(\theta)+i\cos(\theta)=i\big(\cos(\theta)-i\sin(\theta)\big)=ie^{-i\theta}$. De même, $\sin(n\theta)+i\cos(n\theta)=ie^{-in\theta}$. L'égalité demandée s'écrit donc $i^{n}e^{-in\theta}=ie^{-in\theta}$, c'est-à-dire, en divisant par $e^{-in\theta}\neq 0$, $i^{n}=i$. D'après l'exercice 3 du chapitre 2, cela équivaut à $\boxed{n\equiv 1\;[4]}$ : $n\in\{1\;;5\;;9\;;\dots\}$. La condition ne dépend pas de $\theta$, ce qui justifie le « pour tout $\theta$ ».
