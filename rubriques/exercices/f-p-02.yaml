  types: [Démonstration, Calcul]
  mots_cles: [suites, suite géométrique, raison, sommes de termes, "comportement à l'infini"]
  noeuds: [ar-suites, n-sommes]
  notions: [suite]
  page_enonce: 8
  page_corrige: 16
  enonce: |
    On considère la figure suivant, où les deux droites issues de $O$ font des angles de $\dfrac{\pi}{3}$ et la mesure de $OA_{0}$ est $4$ :

    ![Figure](documents/figures/9aaf4e8e89e8219d.svg)

    On définit la suite $(u_{n})$ par : $u_{n} = A_{0}A_{1} + A_{1}A_{2} + A_{2}A_{3} + \cdots + A_{n-1}A_{n}$.

    **1.** On pose $v_{n} = A_{n-1}A_{n}$. Montrer que la suite $(v_{n})$ est une suite géométrique dont on précisera la raison et le premier terme $v_{1}$.

    **2.** Calculer $u_{n}$ en fonction de $n$.

    **3.** Quelle est la limite supposée de la suite $(u_{n})$ ? C'est à dire la valeur vers laquelle $u_{n}$ semble se rapprocher quand $n$ grandit.
  corrige: |
    **1.** Le triangle $OA_{0}A_{1}$ est rectangle en $A_{1}$, et l'angle en $O$ mesure $\dfrac{\pi}{3}$. La trigonométrie dans ce triangle rectangle donne : 
    $$OA_{1}=OA_{0}\times\cos\left(\frac{\pi}{3}\right)=\frac{OA_{0}}{2} \qquad\text{et}\qquad A_{0}A_{1}=OA_{0}\times\sin\left(\frac{\pi}{3}\right)=\frac{\sqrt{3}}{2}\,OA_{0}$$
     Le même raisonnement s'applique à chaque triangle $OA_{n-1}A_{n}$, rectangle en $A_{n}$ : 
    $$OA_{n}=\frac{OA_{n-1}}{2} \qquad\text{et}\qquad v_{n}=A_{n-1}A_{n}=\frac{\sqrt{3}}{2}\,OA_{n-1}$$
     Les longueurs $OA_{n}$ étant divisées par $2$ à chaque étape, il en va de même des $v_{n}$ : 
    $$\frac{v_{n+1}}{v_{n}}=\frac{OA_{n}}{OA_{n-1}}=\frac{1}{2}$$

    $$\boxed{(v_{n})\text{ est géométrique de raison }\frac{1}{2}\text{, avec } v_{1}=\frac{\sqrt{3}}{2}\times 4=2\sqrt{3}}$$

    **2.** La suite $(u_{n})$ est la somme des $n$ premiers termes de $(v_{n})$ : 
    $$u_{n}=v_{1}\times\frac{1-\left(\frac{1}{2}\right)^{n}}{1-\frac{1}{2}} =2\sqrt{3}\times 2\left(1-\left(\frac{1}{2}\right)^{n}\right)$$

    $$\boxed{u_{n}=4\sqrt{3}\left(1-\left(\frac{1}{2}\right)^{n}\right)}$$

    **3.** Lorsque $n$ grandit, $\left(\dfrac{1}{2}\right)^{n}$ devient très petit : 
    $$\boxed{\text{on conjecture que }u_{n}\text{ se rapproche de }4\sqrt{3}\approx 6,93}$$
     La ligne brisée rouge, bien qu'elle comporte une infinité de segments, a donc une longueur totale finie.

