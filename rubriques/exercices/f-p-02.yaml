  page_enonce: 8
  page_corrige: 15
  enonce: |
    On considère la suite $(u_{n})_{n\in\mathbb{N}}$ définie par $u_0=0$ et : 
    $$u_{n+1}=\frac{1}{2}\sqrt{u_{n}^{2}+12}$$

    **1.** Calculer les trois premiers termes.

    **2.** Pour tout entier naturel $n$, on définit la suite $(v_n)$ par : 
    $$v_n=u_{n}^{2}-4$$
     Démontrer que $v_n$ est une suite géométrique de raison $\dfrac{1}{4}$.

    **3.** En déduire une expression explicite de la suite $v_n$.

    **4.** Sachant que $(u_n)$ est une suite positive, en déduire que : 
    $$u_{n}=2\sqrt{1-\left(\frac{1}{4}\right)^{n}}$$

    **5.** Si $n$ devient de plus en plus grand, de quelle valeur peut-on conjecturer que $u_{n}$ va se rapprocher ?
  corrige: |
    **1.** $u_{1}=\dfrac{1}{2}\sqrt{0+12}=\dfrac{\sqrt{12}}{2}=\sqrt{3}$, puis : 
    $$u_{2}=\frac{1}{2}\sqrt{3+12}=\frac{\sqrt{15}}{2} \qquad ; \qquad u_{3}=\frac{1}{2}\sqrt{\frac{15}{4}+12}=\frac{1}{2}\sqrt{\frac{63}{4}}=\frac{3\sqrt{7}}{4}$$

    $$\boxed{u_{1}=\sqrt{3}\approx 1,73 \; ; \; u_{2}=\frac{\sqrt{15}}{2}\approx 1,94 \; ; \; u_{3}=\frac{3\sqrt{7}}{4}\approx 1,98}$$

    **2.** Pour tout $n\in\mathbb{N}$, en élevant la relation de récurrence au carré : 
    $$\begin{aligned} v_{n+1} &= u_{n+1}^{2}-4=\frac{1}{4}\left(u_{n}^{2}+12\right)-4\\ &= \frac{1}{4}u_{n}^{2}+3-4=\frac{1}{4}u_{n}^{2}-1=\frac{1}{4}\left(u_{n}^{2}-4\right) \end{aligned}$$

    $$\boxed{v_{n+1}=\frac{1}{4}v_{n} \; : \; (v_{n})\text{ est géométrique de raison }\frac{1}{4}}$$

    **3.** Son premier terme vaut $v_{0}=u_{0}^{2}-4=-4$, d'où : 
    $$\boxed{v_{n}=-4\left(\frac{1}{4}\right)^{n}}$$

    **4.** Comme $u_{n}^{2}=v_{n}+4$ : 
    $$u_{n}^{2}=4-4\left(\frac{1}{4}\right)^{n}=4\left(1-\left(\frac{1}{4}\right)^{n}\right)$$
     La suite étant positive, on prend la racine carrée : 
    $$\boxed{u_{n}=2\sqrt{1-\left(\frac{1}{4}\right)^{n}}}$$

    **5.** Lorsque $n$ grandit, $\left(\dfrac{1}{4}\right)^{n}$ devient très petit, et le contenu de la racine se rapproche de $1$ : 
    $$\boxed{\text{on conjecture que }u_{n}\text{ se rapproche de }2}$$
- id: "p-02-30"
  feuille: "f-p-02"
  numero: 30
  titre: "Construction géométrique"
  partie: "Suites particulières"
