- id: "p-02-01"
  feuille: "f-p-02"
  numero: 1
  partie: "Généralités"
  etoiles: 1
  types: [Calcul]
  mots_cles: [suites, suite définie par récurrence]
  noeuds: [ar-suites, n-recdef]
  notions: [suite]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Pour les suites suivantes, calculer les termes de $u_{1}$ à $u_{4}$ :

    **a)** $\left\{ \begin{array}{ll} u_{n+1}=\dfrac{2u_{n}}{u_{n}+1}\\ u_{0}=5 \end{array} \right.$

    **b)** $\left\{ \begin{array}{ll} u_{n+1}=(u_{n}+1)^{2}\\ u_{0}=-1 \end{array} \right.$

    **c)** $\left\{ \begin{array}{ll} u_{n+1}=\dfrac{u_{n}-1}{u_{n}}\\ u_{0}=2 \end{array} \right.$

    **d)** $\left\{ \begin{array}{ll} u_{n+1}=1-\dfrac{1}{1+u_{n}}\\ u_{0}=1 \end{array} \right.$

    **e)** $\left\{ \begin{array}{ll} u_{n+1}=nu_{n}+4\\ u_{0}=3 \end{array} \right.$

    **f)** $\left\{ \begin{array}{ll} u_{n+1}=u_{n}^{2}-(n+2)\\ u_{0}=-1 \end{array} \right.$
  corrige: |
    On applique à chaque fois la relation de récurrence en remplaçant $u_{n}$ par le terme qui vient d'être calculé.

    **a)** $u_{1}=\dfrac{2\times 5}{5+1}=\dfrac{10}{6}=\dfrac{5}{3}$, puis : 
    $$\boxed{u_{1}=\frac{5}{3} \quad ; \quad u_{2}=\frac{5}{4} \quad ; \quad u_{3}=\frac{10}{9} \quad ; \quad u_{4}=\frac{20}{19}}$$

    **b)** $u_{1}=(-1+1)^{2}=0$, puis : 
    $$\boxed{u_{1}=0 \quad ; \quad u_{2}=1 \quad ; \quad u_{3}=4 \quad ; \quad u_{4}=25}$$

    **c)** $u_{1}=\dfrac{2-1}{2}=\dfrac{1}{2}$, puis : 
    $$\boxed{u_{1}=\frac{1}{2} \quad ; \quad u_{2}=-1 \quad ; \quad u_{3}=2 \quad ; \quad u_{4}=\frac{1}{2}}$$
     On remarque que les termes se répètent de trois en trois.

    **d)** $u_{1}=1-\dfrac{1}{1+1}=\dfrac{1}{2}$, puis : 
    $$\boxed{u_{1}=\frac{1}{2} \quad ; \quad u_{2}=\frac{1}{3} \quad ; \quad u_{3}=\frac{1}{4} \quad ; \quad u_{4}=\frac{1}{5}}$$

    **e)** Attention, la relation dépend aussi de $n$ : $u_{1}=0\times 3+4=4$, puis $u_{2}=1\times 4+4=8$ : 
    $$\boxed{u_{1}=4 \quad ; \quad u_{2}=8 \quad ; \quad u_{3}=20 \quad ; \quad u_{4}=64}$$

    **f)** De même, $u_{1}=(-1)^{2}-2=-1$ : 
    $$\boxed{u_{1}=-1 \quad ; \quad u_{2}=-2 \quad ; \quad u_{3}=0 \quad ; \quad u_{4}=-5}$$
- id: "p-02-02"
  feuille: "f-p-02"
  numero: 2
  partie: "Généralités"
  etoiles: 1
  types: [Calcul]
  mots_cles: [suites, suite définie par récurrence, forme explicite]
  noeuds: [ar-suites, n-recdef]
  notions: [suite]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Les suites suivantes sont définies pour tout $n\in\mathbb{N}$.

    **1.** Préciser dans chaque cas si la suite est définie **par récurrence** ou **de façon explicite**, puis calculer $u_{2}$ et $u_{5}$ :

    **a)** $u_{n}=3n-7$

    **b)** $\left\{ \begin{array}{ll} u_{n+1}=u_{n}+3\\ u_{0}=2 \end{array} \right.$

    **c)** $u_{n}=\dfrac{n^{2}}{n+1}$

    **d)** $u_{n}=(-1)^{n}(2n+1)$

    **e)** $u_{n}=\sqrt{n+4}$

    **f)** $\left\{ \begin{array}{ll} u_{n+1}=2u_{n}\\ u_{0}=1 \end{array} \right.$

    **2.** Pour lesquelles de ces suites peut-on calculer $u_{100}$ sans calculer aucun autre terme ? Justifier.
  corrige: |
    **1.** Une suite est définie **par récurrence** lorsque chaque terme se calcule à partir du *terme précédent*, et **de façon explicite** lorsqu'il se calcule directement à partir du *rang*.

    **a)** Explicite : $u_{2}=3\times 2-7=\boxed{-1}$ et $u_{5}=3\times 5-7=\boxed{8}$

    **b)** Récurrence : $u_{1}=5$, $u_{2}=\boxed{8}$, puis $u_{3}=11$, $u_{4}=14$ et $u_{5}=\boxed{17}$

    **c)** Explicite : $u_{2}=\dfrac{4}{3}$ et $u_{5}=\dfrac{25}{6}$, soit $\boxed{u_{2}=\frac{4}{3} \; ; \; u_{5}=\frac{25}{6}}$

    **d)** Explicite : $u_{2}=(-1)^{2}\times 5=\boxed{5}$ et $u_{5}=(-1)^{5}\times 11=\boxed{-11}$

    **e)** Explicite : $u_{2}=\sqrt{6}$ et $u_{5}=\sqrt{9}=3$, soit $\boxed{u_{2}=\sqrt{6} \; ; \; u_{5}=3}$

    **f)** Récurrence : $u_{1}=2$, $u_{2}=\boxed{4}$, puis $u_{3}=8$, $u_{4}=16$ et $u_{5}=\boxed{32}$

    **2.** Pour les suites définies de façon explicite, il suffit de remplacer $n$ par $100$ : 
    $$\boxed{\text{les suites a), c), d) et e) permettent de calculer directement }u_{100}}$$
     Pour les suites b) et f), définies par récurrence, il faudrait calculer les $100$ termes précédents : c'est tout l'intérêt d'une formule explicite.
- id: "p-02-03"
  feuille: "f-p-02"
  numero: 3
  partie: "Généralités"
  etoiles: 2
  types: [Conjecture, Calcul]
  mots_cles: [suites, suite définie par récurrence, forme explicite, "comportement à l'infini"]
  noeuds: [ar-suites, n-recdef]
  notions: [suite]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Pour chacune des suites suivantes, calculer les termes de $u_{1}$ à $u_{4}$, puis **conjecturer une formule explicite** pour $u_{n}$. On vérifiera ensuite avec la formule conjecturée la valeur de $u_{0}$, puis la relation entre $u_{n+1}$ et $u_{n}$ :

    **a)** $\left\{ \begin{array}{ll} u_{n+1}=\dfrac{1}{2}u_{n}\\ u_{0}=1 \end{array} \right.$

    **b)** $\left\{ \begin{array}{ll} u_{n+1}=u_{n}+5\\ u_{0}=1 \end{array} \right.$

    **c)** $\left\{ \begin{array}{ll} u_{n+1}=1-\dfrac{1}{1+u_{n}}\\ u_{0}=1 \end{array} \right.$
  corrige: |
    **a)** $u_{1}=\dfrac{1}{2}$, $u_{2}=\dfrac{1}{4}$, $u_{3}=\dfrac{1}{8}$, $u_{4}=\dfrac{1}{16}$. Les dénominateurs sont les puissances de $2$ : 
    $$\boxed{u_{n}=\left(\frac{1}{2}\right)^{n}=\frac{1}{2^{n}}}$$
     *Vérification :* pour $n=0$, $\dfrac{1}{2^{0}}=1=u_{0}$, et $u_{n+1}=\dfrac{1}{2^{n+1}}=\dfrac{1}{2}\times\dfrac{1}{2^{n}}=\dfrac{1}{2}u_{n}$.

    **b)** $u_{1}=6$, $u_{2}=11$, $u_{3}=16$, $u_{4}=21$. On ajoute $5$ à chaque étape : 
    $$\boxed{u_{n}=5n+1}$$
     *Vérification :* $u_{0}=1$, et $u_{n+1}=5(n+1)+1=5n+1+5=u_{n}+5$.

    **c)** $u_{1}=\dfrac{1}{2}$, $u_{2}=\dfrac{1}{3}$, $u_{3}=\dfrac{1}{4}$, $u_{4}=\dfrac{1}{5}$ : 
    $$\boxed{u_{n}=\frac{1}{n+1}}$$
     *Vérification :* $u_{0}=1$, et : 
    $$1-\frac{1}{1+u_{n}}=1-\frac{1}{1+\frac{1}{n+1}}=1-\frac{n+1}{n+2}=\frac{1}{n+2}=u_{n+1}$$
- id: "p-02-04"
  feuille: "f-p-02"
  numero: 4
  partie: "Généralités"
  etoiles: 2
  types: [Calcul]
  mots_cles: [suites, suite définie par récurrence]
  noeuds: [ar-suites, n-recdef]
  notions: [suite]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    On considère les suites suivantes définies pour tout $n\in\mathbb{N}$ :

    **a)** $\left\{ \begin{array}{ll} u_{n+1}=5u_{n}-3\\ u_{0}=3 \end{array} \right.$

    **b)** $\left\{ \begin{array}{ll} u_{n+1}=4u_{n}-(n-3)\\ u_{0}=1 \end{array} \right.$

    **c)** $\left\{ \begin{array}{ll} u_{n+1}=(n+1)u_{n}+2\\ u_{0}=-1 \end{array} \right.$

    **d)** $\left\{ \begin{array}{ll} u_{n+1}=\dfrac{u_{n}^{2}}{2n+3}\\ u_{0}=-1 \end{array} \right.$

    **1.** Pour chacune de ces suites, exprimer $u_{n}$ en fonction de $u_{n-1}$ pour tout $n\geqslant 1$, puis $u_{n+2}$ en fonction de $u_{n+1}$ pour tout entier $n$.

    **2.** En déduire pour chacune de ces suites l'expression de $u_{n+2}$ en fonction de $u_{n}$ et de $n$.
  corrige: |
    Pour obtenir $u_{n}$ en fonction de $u_{n-1}$, on remplace $n$ par $n-1$ dans la relation ; pour obtenir $u_{n+2}$ en fonction de $u_{n+1}$, on remplace $n$ par $n+1$. On reporte ensuite l'expression de $u_{n+1}$.

    **a)** $u_{n}=5u_{n-1}-3$ et $u_{n+2}=5u_{n+1}-3$, d'où : 
    $$u_{n+2}=5(5u_{n}-3)-3 \qquad\text{soit}\qquad \boxed{u_{n+2}=25u_{n}-18}$$

    **b)** $u_{n}=4u_{n-1}-(n-4)$ et $u_{n+2}=4u_{n+1}-(n-2)$, d'où : 
    $$u_{n+2}=4\big(4u_{n}-(n-3)\big)-(n-2)=16u_{n}-4n+12-n+2$$

    $$\boxed{u_{n+2}=16u_{n}-5n+14}$$

    **c)** $u_{n}=nu_{n-1}+2$ et $u_{n+2}=(n+2)u_{n+1}+2$, d'où : 
    $$u_{n+2}=(n+2)\big[(n+1)u_{n}+2\big]+2 \qquad\text{soit}\qquad \boxed{u_{n+2}=(n+1)(n+2)u_{n}+2n+6}$$

    **d)** $u_{n}=\dfrac{u_{n-1}^{2}}{2n+1}$ et $u_{n+2}=\dfrac{u_{n+1}^{2}}{2n+5}$, d'où : 
    $$u_{n+2}=\frac{1}{2n+5}\left(\frac{u_{n}^{2}}{2n+3}\right)^{2} \qquad\text{soit}\qquad \boxed{u_{n+2}=\frac{u_{n}^{4}}{(2n+3)^{2}(2n+5)}}$$
- id: "p-02-05"
  feuille: "f-p-02"
  numero: 5
  partie: "Généralités"
  etoiles: 1
  types: [Calcul]
  mots_cles: [suites, sens de variation]
  noeuds: [ar-suites]
  notions: [suite]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Pour chacune des suites $(u_n)_{n\in \mathbb{N}^{*}}$ suivantes, déterminer le sens de variation :

    **a)** 
    $$u_{n}=n^{2}+2n$$

    **b)** 
    $$u_{n}=\frac{4}{n+1}$$

    **c)** 
    $$u_{n}=-5^{n}$$

    **d)** 
    $$u_{n}=\frac{2^{n}}{n}$$

    **e)** 
    $$u_{n}=\frac{n-3}{2n+1}$$

    **f)** 
    $$u_{n}=2n^{2}-3n+1$$

    **g)** 
    $$u_{n}=\frac{3^{n}}{2^{n-1}}$$

    **h)** 
    $$u_{n}=\frac{n^{2}+1}{2n^{2}}$$

    **i)** 
    $$u_{n}=\frac{\sqrt{n}}{2^{n}}$$
  corrige: |
    On étudie le signe de $u_{n+1}-u_{n}$, ou le quotient $\dfrac{u_{n+1}}{u_{n}}$ lorsque les termes sont de signe constant.

    **a)** $u_{n+1}-u_{n}=(n+1)^{2}+2(n+1)-n^{2}-2n=2n+3>0$ : $\boxed{\text{croissante}}$

    **b)** $u_{n+1}-u_{n}=\dfrac{4}{n+2}-\dfrac{4}{n+1}=\dfrac{4(n+1)-4(n+2)}{(n+1)(n+2)} =\dfrac{-4}{(n+1)(n+2)}<0$ : $\boxed{\text{décroissante}}$

    **c)** $u_{n+1}-u_{n}=-5^{n+1}+5^{n}=5^{n}(1-5)=-4\times 5^{n}<0$ : $\boxed{\text{décroissante}}$

    **d)** Tous les termes sont strictement positifs, et $\dfrac{u_{n+1}}{u_{n}}=\dfrac{2^{n+1}}{n+1}\times\dfrac{n}{2^{n}}=\dfrac{2n}{n+1}\geqslant 1$ car $2n\geqslant n+1$ pour $n\geqslant 1$ : $\boxed{\text{croissante}}$ (les deux premiers termes sont égaux, puis la croissance est stricte).

    **e)** On a : 
    $$\begin{aligned} u_{n+1}-u_{n} &=\dfrac{n-2}{2n+3}-\dfrac{n-3}{2n+1} \\ &=\dfrac{(n-2)(2n+1)-(n-3)(2n+3)}{(2n+1)(2n+3)} \\ &=\dfrac{7}{(2n+1)(2n+3)}>0 \end{aligned}$$
     $\boxed{\text{croissante}}$

    **f)** $u_{n+1}-u_{n}=2(n+1)^{2}-3(n+1)+1-2n^{2}+3n-1=4n-1>0$ pour $n\geqslant 1$ : $\boxed{\text{croissante}}$

    **g)** $u_{n}=\dfrac{3^{n}}{2^{n-1}}=2\left(\dfrac{3}{2}\right)^{n}>0$ et $\dfrac{u_{n+1}}{u_{n}}=\dfrac{3}{2}>1$ : $\boxed{\text{croissante}}$

    **h)** $u_{n}=\dfrac{n^{2}+1}{2n^{2}}=\dfrac{1}{2}+\dfrac{1}{2n^{2}}$, donc $u_{n+1}-u_{n}=\dfrac{1}{2}\left(\dfrac{1}{(n+1)^{2}}-\dfrac{1}{n^{2}}\right)<0$ : $\boxed{\text{décroissante}}$

    **i)** Tous les termes sont strictement positifs, et 
    $$\dfrac{u_{n+1}}{u_{n}}=\dfrac{\sqrt{n+1}}{2^{n+1}}\times\dfrac{2^{n}}{\sqrt{n}} =\dfrac{1}{2}\sqrt{\dfrac{n+1}{n}}\leqslant\dfrac{\sqrt{2}}{2}<1$$
     $\boxed{\text{décroissante}}$
- id: "p-02-06"
  feuille: "f-p-02"
  numero: 6
  partie: "Généralités"
  etoiles: 2
  types: [Calcul]
  mots_cles: [suites, suite définie par récurrence, forme explicite, sens de variation]
  noeuds: [ar-suites, n-recdef]
  notions: [suite]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Les suites suivantes sont définies pour tout $n\in\mathbb{N}$. Déterminer le sens de variation de chacune d'elles en étudiant directement le signe de $u_{n+1}-u_{n}$, sans chercher de formule explicite :

    **a)** $\left\{ \begin{array}{ll} u_{n+1}=u_{n}+n^{2}+1\\ u_{0}=2 \end{array} \right.$

    **b)** $\left\{ \begin{array}{ll} u_{n+1}=u_{n}-3n-2\\ u_{0}=10 \end{array} \right.$

    **c)** $\left\{ \begin{array}{ll} u_{n+1}=u_{n}+n-5\\ u_{0}=4 \end{array} \right.$

    **d)** $\left\{ \begin{array}{ll} v_{n+1}=0,8\,v_{n}\\ v_{0}=3 \end{array} \right.$

    Pour la suite c), on précisera à partir de quel rang la suite est croissante. Pour la suite d), on pourra étudier le quotient $\dfrac{v_{n+1}}{v_{n}}$ après avoir justifié que tous les termes sont strictement positifs.
  corrige: |
    La relation de récurrence donne directement la différence entre deux termes consécutifs.

    **a)** $u_{n+1}-u_{n}=n^{2}+1>0$ pour tout $n$ : $\boxed{\text{la suite est croissante}}$

    **b)** $u_{n+1}-u_{n}=-3n-2<0$ pour tout $n\in\mathbb{N}$ : $\boxed{\text{la suite est décroissante}}$

    **c)** $u_{n+1}-u_{n}=n-5$, dont le signe change : 
    $$n-5<0 \text{ si } n\leqslant 4 \qquad ; \qquad n-5=0 \text{ si } n=5 \qquad ; \qquad n-5>0 \text{ si } n\geqslant 6$$

    $$\boxed{\text{la suite décroît jusqu'au rang }5\text{, puis est croissante à partir du rang }5}$$

    **d)** Tous les termes sont strictement positifs : $v_{0}=3>0$, et si $v_{n}>0$ alors $v_{n+1}=0,8\,v_{n}>0$. On peut donc former le quotient : 
    $$\frac{v_{n+1}}{v_{n}}=0,8<1 \qquad\text{d'où}\qquad \boxed{\text{la suite est décroissante}}$$
- id: "p-02-07"
  feuille: "f-p-02"
  numero: 7
  partie: "Généralités"
  etoiles: 1
  types: [Lecture graphique, Conjecture, Démonstration]
  mots_cles: [suites, suite définie par récurrence, sens de variation, "comportement à l'infini", représentation graphique]
  noeuds: [ar-suites, n-recdef]
  notions: [suite]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Dans un repère orthonormé, on a représenté la fonction $f$ définie sur $\mathbb{R}$ par $f(x)=0,5x+3$ et la droite d'équation $y=x$. On définit par ailleurs pour tout $n\in\mathbb{N}$ la suite $(u_n)$ par : 
    $$\left\{ \begin{array}{ll} u_{n+1}=f(u_{n})\\ u_{0}=1 \end{array} \right.$$

    ![Figure](documents/figures/22dbaa46ffd7a89b.svg)

    **1.** Reproduire la figure et représenter les cinq premiers termes de la suite sur l'axe des abscisses.

    **2.** Conjecturer le sens de variation de la suite, puis le démontrer.

    **3.** Les termes de la suite semblent se rapprocher de plus en plus d'une certaine valeur, qu'on nommera **limite**. Quelle valeur peut-on conjecturer pour limite ?
  corrige: |
    **1.** On part de $u_{0}=1$ sur l'axe des abscisses : on monte verticalement jusqu'à la courbe pour obtenir $u_{1}=f(u_{0})$, puis on se déplace horizontalement jusqu'à la droite d'équation $y=x$ pour reporter cette valeur sur l'axe des abscisses, et on recommence.

    ![Figure](documents/figures/b3c25ead561a9d8a.svg)

    Numériquement : $u_{0}=1$, $u_{1}=3,5$, $u_{2}=4,75$, $u_{3}=5,375$ et $u_{4}=5,6875$.

    **2.** Les termes semblent augmenter : on conjecture que la suite est **croissante**. Pour le démontrer, on introduit la suite $(v_{n})$ définie par $v_{n}=u_{n}-6$ : 
    $$v_{n+1}=u_{n+1}-6=0,5u_{n}+3-6=0,5(u_{n}-6)=0,5\,v_{n}$$
     La suite $(v_{n})$ est donc géométrique de raison $0,5$ et de premier terme $v_{0}=1-6=-5$, d'où $v_{n}=-5\times 0,5^{n}$ et $u_{n}=6-5\times 0,5^{n}$. Alors : 
    $$u_{n+1}-u_{n}=-5\left(0,5^{n+1}-0,5^{n}\right)=-5\times 0,5^{n}(0,5-1)=2,5\times 0,5^{n}>0$$

    $$\boxed{\text{la suite }(u_{n})\text{ est croissante}}$$

    **3.** Les termes se rapprochent de l'abscisse du point d'intersection des deux droites, que l'on obtient en résolvant $f(x)=x$ : 
    $$0,5x+3=x \iff 3=0,5x \iff x=6$$

    $$\boxed{\text{on conjecture que la limite de la suite est }6}$$
     Ce que confirme l'expression $u_{n}=6-5\times 0,5^{n}$, puisque $0,5^{n}$ devient très petit.
- id: "p-02-08"
  feuille: "f-p-02"
  numero: 8
  partie: "Généralités"
  etoiles: 1
  types: [Algorithmique]
  mots_cles: [suites, suite définie par récurrence, Python]
  noeuds: [ar-suites, n-recdef]
  notions: [suite]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Soit pour tout $n\in\mathbb{N}$ la suite définie par : 
    $$\left\{ \begin{array}{ll} u_{n+1}=-u_{n}+4\\ u_{0}=5 \end{array} \right.$$
     On considère l'algorithme suivant :

    ![Figure](documents/figures/5b8d19bb5870b1bd.svg)

    **1.** Que permet d'afficher cet algorithme ?

    **2.** Quelle valeur affiche l'algorithme ?

    **3.** Modifier l'algorithme pour qu'il affiche la valeur de $u_{40}$.
  corrige: |
    **1.** La variable `u` contient d'abord $u_{0}=5$, puis la boucle applique $25$ fois la relation de récurrence : 
    $$\boxed{\text{l'algorithme affiche }u_{25}}$$

    **2.** Les premiers termes sont $u_{0}=5$, $u_{1}=-1$, $u_{2}=5$, $u_{3}=-1$, … : la suite est périodique, les termes de rang pair valant $5$ et ceux de rang impair $-1$. Comme $25$ est impair : 
    $$\boxed{\text{l'algorithme affiche }-1}$$

    **3.** Il suffit de remplacer $25$ par $40$ dans la boucle :

    `u ← 5`

    `Pour i allant de 1 à 40`

    ` u ← -u + 4`

    `Fin pour`

    `Afficher u`

    L'algorithme affichera alors $u_{40}=5$, puisque $40$ est pair.
- id: "p-02-09"
  feuille: "f-p-02"
  numero: 9
  partie: "Généralités"
  etoiles: 2
  types: [Algorithmique, Calcul]
  mots_cles: [suites, suite définie par récurrence, Python]
  noeuds: [ar-suites, n-recdef]
  notions: [suite]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Soit pour tout $n\in\mathbb{N}$ la suite définie par : 
    $$\left\{ \begin{array}{ll} u_{n+1}=2u_{n}+1\\ u_{0}=5 \end{array} \right.$$

    **1.** Calculer $u_{1}$ et $u_{2}$.

    **2.** Écrire un algorithme permettant de calculer $u_{20}$.

    **3.** Utiliser la calculatrice pour calculer $u_{20}$.
  corrige: |
    **1.** $u_{1}=2\times 5+1=\boxed{11}$ et $u_{2}=2\times 11+1=\boxed{23}$

    **2.** On reprend le principe de l'algorithme précédent, avec $20$ répétitions :

    `u ← 5`

    `Pour i allant de 1 à 20`

    ` u ← 2*u + 1`

    `Fin pour`

    `Afficher u`

    En Python : 

    ```python
    u = 5
    for i in range(20):
        u = 2*u + 1
    print(u)
    ```

    **3.** La calculatrice (ou le programme) donne : 
    $$\boxed{u_{20}=6\,291\,455}$$
     On peut le retrouver en remarquant que la suite $(u_{n}+1)$ est géométrique de raison $2$ et de premier terme $6$, d'où $u_{n}=6\times 2^{n}-1$ et $u_{20}=6\times 2^{20}-1$.
- id: "p-02-10"
  feuille: "f-p-02"
  numero: 10
  partie: "Généralités"
  etoiles: 2
  types: [Algorithmique, Conjecture, Calcul]
  mots_cles: [suites, sens de variation, "comportement à l'infini", Python]
  noeuds: [ar-suites]
  notions: [suite]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Soit pour tout $n\in\mathbb{N}$ la suite définie par : 
    $$u_{n}=5+\frac{3}{2n+1}$$

    **1.** Calculer les cinq premiers termes de la suite $(u_{n})_{n\in\mathbb{N}}$.

    **2.** Déterminer le sens de variation de $(u_{n})_{n\in\mathbb{N}}$.

    **3.** Déterminer par le calcul le plus petit entier $n_{0}$ tel que : 
    $$|u_{n}-5|\leqslant 0,001$$

    **4.** Conjecturer la limite de la suite.

    **5.** Écrire un algorithme permettant de trouver le rang $n_{0}$ à partir duquel $|u_{n}-5|\leqslant \varepsilon$ pour un $\varepsilon$ donné par l'utilisateur.

    **6.** Programmer cet algorithme en Python et le tester pour $\varepsilon=0,001$ et $\varepsilon=10^{-5}$.
  corrige: |
    **1.** On remplace $n$ par $0$, $1$, $2$, $3$ puis $4$ : 
    $$\boxed{u_{0}=8 \; ; \; u_{1}=6 \; ; \; u_{2}=5,6 \; ; \; u_{3}=5+\frac{3}{7}\approx 5,43 \; ; \; u_{4}=5+\frac{1}{3}\approx 5,33}$$

    **2.** Pour tout $n\in\mathbb{N}$ : 
    $$u_{n+1}-u_{n}=\frac{3}{2n+3}-\frac{3}{2n+1}=\frac{3(2n+1)-3(2n+3)}{(2n+1)(2n+3)} =\frac{-6}{(2n+1)(2n+3)}<0$$

    $$\boxed{\text{la suite }(u_{n})\text{ est décroissante}}$$

    **3.** Comme $u_{n}-5=\dfrac{3}{2n+1}>0$, on a $|u_{n}-5|=\dfrac{3}{2n+1}$, d'où : 
    $$\frac{3}{2n+1}\leqslant 0,001 \iff 2n+1\geqslant 3\,000 \iff n\geqslant 1\,499,5$$

    $$\boxed{n_{0}=1\,500}$$

    **4.** Les termes se rapprochent de $5$ d'aussi près que l'on veut : 
    $$\boxed{\text{on conjecture que la limite vaut }5}$$

    **5.** On augmente le rang tant que l'écart reste supérieur à $\varepsilon$ :

    `Saisir eps`

    `n ← 0`

    `Tant que 3/(2n+1) > eps`

    ` n ← n + 1`

    `Fin tant que`

    `Afficher n`

    **6.** Le programme correspondant est : 

    ```python
    def rang(eps):
        n = 0
        while 3/(2*n+1) > eps:
            n = n + 1
        return n
    ```


    $$\boxed{\texttt{rang(0.001)}\text{ renvoie }1\,500 \qquad\text{et}\qquad \texttt{rang(10**(-5))}\text{ renvoie }150\,000}$$
- id: "p-02-11"
  feuille: "f-p-02"
  numero: 11
  titre: "Méthode de Héron"
  partie: "Généralités"
  etoiles: 2
  types: [Algorithmique, Calcul]
  mots_cles: [suites, suite définie par récurrence, Python]
  noeuds: [ar-suites, n-recdef]
  notions: [suite]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    On reprend la méthode présentée en introduction du cours : pour approcher $\sqrt{a}$, on remplace à chaque étape la longueur $x$ par la moyenne de $x$ et de $\dfrac{a}{x}$. Pour $a=2$, cela conduit à la suite $(u_{n})$ définie par : 
    $$\left\{ \begin{array}{ll} u_{n+1}=\dfrac{1}{2}\left(u_{n}+\dfrac{2}{u_{n}}\right)\\ u_{0}=1 \end{array} \right.$$

    **1.** Calculer $u_{1}$, $u_{2}$ et $u_{3}$ sous forme de fractions irréductibles.

    **2.** Donner une valeur approchée de $u_{3}$ à $10^{-6}$ près, puis la comparer à celle de $\sqrt{2}$. Combien de décimales exactes obtient-on en trois étapes seulement ?

    **3.** Recopier et compléter la fonction Python suivante, qui renvoie le terme $u_{n}$ : 

    ```python
    def heron(n):
        u = 1
        for i in range(n):
            u = ...
        return u
    ```

    **4.** Modifier cette fonction pour qu'elle prenne le nombre $a$ en argument et approche $\sqrt{a}$. La tester avec $a=5$.

    **5.** À l'aide de la calculatrice ou de Python, déterminer le plus petit rang $n$ tel que : 
    $$|u_{n}-\sqrt{2}|\leqslant 10^{-9}$$
  corrige: |
    **1.** On applique la relation de récurrence : 
    $$u_{1}=\frac{1}{2}\left(1+\frac{2}{1}\right)=\frac{3}{2} \qquad ; \qquad u_{2}=\frac{1}{2}\left(\frac{3}{2}+\frac{4}{3}\right)=\frac{1}{2}\times\frac{17}{6} =\frac{17}{12}$$

    $$u_{3}=\frac{1}{2}\left(\frac{17}{12}+\frac{24}{17}\right) =\frac{1}{2}\times\frac{289+288}{204}=\frac{577}{408}$$

    $$\boxed{u_{1}=\frac{3}{2} \quad ; \quad u_{2}=\frac{17}{12} \quad ; \quad u_{3}=\frac{577}{408}}$$

    **2.** On compare les deux écritures décimales : 
    $$u_{3}\approx 1,414216 \qquad\text{et}\qquad \sqrt{2}\approx 1,414214$$

    $$\boxed{\text{les }5\text{ premières décimales sont exactes après trois étapes seulement}}$$
     L'écart vaut environ $2\times 10^{-6}$ : la méthode double approximativement le nombre de décimales exactes à chaque étape.

    **3.** Il suffit de traduire la relation de récurrence : 

    ```python
    def heron(n):
        u = 1
        for i in range(n):
            u = (u + 2/u)/2
        return u
    ```

    **4.** On remplace $2$ par le paramètre `a` : 

    ```python
    def heron(a, n):
        u = 1
        for i in range(n):
            u = (u + a/u)/2
        return u
    ```

     Pour $a=5$, on obtient $\texttt{heron(5, 5)}\approx 2,236068$, alors que $\sqrt{5}\approx 2,2360680$.

    **5.** En comparant les termes successifs à $\sqrt{2}$ : 
    $$|u_{3}-\sqrt{2}|\approx 2,1\times 10^{-6} \qquad\text{et}\qquad |u_{4}-\sqrt{2}|\approx 1,6\times 10^{-12}$$

    $$\boxed{n=4}$$
- id: "p-02-12"
  feuille: "f-p-02"
  numero: 12
  partie: "Suites particulières"
  etoiles: 1
  types: [Calcul]
  mots_cles: [suites, suite définie par récurrence, suite arithmétique, raison]
  noeuds: [ar-suites, n-recdef]
  notions: [suite]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Pour chacune des suites $(u_{n})$ suivantes, déterminer si elle est arithmétique, et si oui préciser son premier terme et sa raison :

    **1.** $u_{n}=3n-5$

    **2.** $u_{n+1}=\dfrac{3n+1}{2}$

    **3.** $u_{n}=n^{2}-n$

    **4.** $u_{n}=n^{2}-3$

    **5.** $u_{n}=(n+1)^{2}-n^{2}$

    **6.** $u_{n}=4n(n-1)-n(n+1)$
  corrige: |
    Une suite est arithmétique lorsque la différence $u_{n+1}-u_{n}$ est *constante*.

    **1.** $u_{n+1}-u_{n}=3(n+1)-5-3n+5=3$ : $\boxed{\text{arithmétique, }u_{0}=-5\text{ et }r=3}$

    **2.** La relation donne $u_{n+1}=\dfrac{3n+1}{2}$, donc $u_{n}=\dfrac{3n-2}{2}$ pour $n\geqslant 1$, et : 
    $$u_{n+1}-u_{n}=\frac{3n+1}{2}-\frac{3n-2}{2}=\frac{3}{2}$$
     $\boxed{\text{arithmétique, }u_{1}=\frac{1}{2}\text{ et }r=\frac{3}{2}}$

    **3.** $u_{n+1}-u_{n}=(n+1)n-n(n-1)=n\big[(n+1)-(n-1)\big]=2n$, qui dépend de $n$ : $\boxed{\text{pas arithmétique}}$

    **4.** $u_{n+1}-u_{n}=(n+1)^{2}-3-n^{2}+3=2n+1$, qui dépend de $n$ : $\boxed{\text{pas arithmétique}}$

    **5.** En développant, $u_{n}=(n+1)^{2}-n^{2}=2n+1$, donc $u_{n+1}-u_{n}=2$ : 
    $$\boxed{\text{arithmétique, }u_{0}=1\text{ et }r=2}$$

    **6.** En développant, $u_{n}=4n^{2}-4n-n^{2}-n=3n^{2}-5n$, donc $u_{n+1}-u_{n}=3(2n+1)-5=6n-2$ : $\boxed{\text{pas arithmétique}}$
- id: "p-02-13"
  feuille: "f-p-02"
  numero: 13
  partie: "Suites particulières"
  etoiles: 1
  types: [Calcul]
  mots_cles: [suites, forme explicite, suite arithmétique]
  noeuds: [ar-suites]
  notions: [suite]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Pour chacune des suites arithmétiques suivantes, donner la formule explicite et calculer le terme demandé :

    **1.** $u_0=4 \text{ et } r=-3 \\ \text{Calculer }{u_{15}}$

    **2.** $u_0=-2 \text{ et } r=7 \\ \text{Calculer }{u_{13}}$

    **3.** $u_0=-\sqrt{2} \text{ et } r=\sqrt{2} \\ \text{Calculer }{u_{7}}$

    **4.** $u_0=\dfrac{1}{2} \text{ et } r=-\dfrac{1}{3} \\ \text{Calculer }{u_{6}}$

    **5.** $u_1=5 \text{ et } r=2 \\ \text{Calculer }{u_{20}}$

    **6.** $u_7=4 \text{ et } r=-5 \\ \text{Calculer }{u_{11}}$
  corrige: |
    On applique la formule explicite $u_{n}=u_{0}+nr$, ou $u_{n}=u_{p}+(n-p)r$ lorsque le premier terme donné n'est pas $u_{0}$.

    **1.** $u_{n}=4-3n$ d'où $\boxed{u_{15}=4-45=-41}$

    **2.** $u_{n}=-2+7n$ d'où $\boxed{u_{13}=-2+91=89}$

    **3.** $u_{n}=-\sqrt{2}+n\sqrt{2}=(n-1)\sqrt{2}$ d'où $\boxed{u_{7}=6\sqrt{2}}$

    **4.** $u_{n}=\dfrac{1}{2}-\dfrac{n}{3}$ d'où $\boxed{u_{6}=\dfrac{1}{2}-2=-\dfrac{3}{2}}$

    **5.** $u_{n}=u_{1}+(n-1)\times 2=2n+3$ d'où $\boxed{u_{20}=43}$

    **6.** $u_{n}=u_{7}+(n-7)\times(-5)=39-5n$ d'où $\boxed{u_{11}=39-55=-16}$
- id: "p-02-14"
  feuille: "f-p-02"
  numero: 14
  partie: "Suites particulières"
  etoiles: 1
  types: [Calcul]
  mots_cles: [suites, suite arithmétique, raison]
  noeuds: [ar-suites]
  notions: [suite]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Soit $(u_{n})$ une suite arithmétique de raison $r$.

    **1.** $u_{0}=1$ et $u_{10}=31$. Déterminer $r$ puis calculer $u_{2025}$.

    **2.** $u_{0}=5$ et $u_{100}=-45$. Déterminer $r$ puis calculer $u_{20}$.

    **3.** $u_{17}=24$ et $u_{40}=70=$. Déterminer $r$ puis calculer $u_{0}$.
  corrige: |
    **1.** $u_{10}=u_{0}+10r$ donne $31=1+10r$, soit $\boxed{r=3}$, puis : 
    $$u_{2025}=1+3\times 2025 \qquad\text{d'où}\qquad \boxed{u_{2025}=6\,076}$$

    **2.** $u_{100}=u_{0}+100r$ donne $-45=5+100r$, soit $\boxed{r=-0,5}$, puis : 
    $$u_{20}=5-0,5\times 20 \qquad\text{d'où}\qquad \boxed{u_{20}=-5}$$

    **3.** $u_{40}=u_{17}+23r$ donne $70=24+23r$, soit $\boxed{r=2}$, puis : 
    $$u_{0}=u_{17}-17r=24-34 \qquad\text{d'où}\qquad \boxed{u_{0}=-10}$$
- id: "p-02-15"
  feuille: "f-p-02"
  numero: 15
  partie: "Suites particulières"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [suites, suite arithmétique, raison]
  noeuds: [ar-suites]
  notions: [suite]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Soit $(u_{n})$ la suite arithmétique de premier terme $u_{0}=7$ et de raison $r=4$.

    **1.** Exprimer $u_{n}$ en fonction de $n$.

    **2.** Le nombre $143$ est-il un terme de la suite ? Si oui, préciser son rang.

    **3.** Le nombre $200$ est-il un terme de la suite ? Justifier.

    **4.** Combien la liste $u_{5}$, $u_{6}$, …, $u_{50}$ comporte-t-elle de termes ?

    **5.** Déterminer le plus petit rang $n$ tel que $u_{n}\geqslant 1000$.
  corrige: |
    **1.** $\boxed{u_{n}=7+4n}$

    **2.** On résout $7+4n=143$, soit $4n=136$ : 
    $$\boxed{143=u_{34}\text{ : c'est bien un terme de la suite, de rang }34}$$

    **3.** On résout $7+4n=200$, soit $4n=193$. Or $193$ n'est pas divisible par $4$ : 
    $$\boxed{200\text{ n'est pas un terme de la suite}}$$

    **4.** De $u_{5}$ à $u_{50}$, il y a $50-5+1$ termes : 
    $$\boxed{46\text{ termes}}$$

    **5.** On résout $7+4n\geqslant 1\,000$, soit $n\geqslant\dfrac{993}{4}=248,25$ : 
    $$\boxed{n=249}$$
- id: "p-02-16"
  feuille: "f-p-02"
  numero: 16
  titre: "Suite auxiliaire"
  partie: "Suites particulières"
  etoiles: 1
  types: [Calcul]
  mots_cles: [suites, suite définie par récurrence, suite arithmétique, raison, suite auxiliaire]
  noeuds: [ar-suites, n-recdef]
  notions: [suite]
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Soit $(u_{n})$ la suite définie pour tout $n\in\mathbb{N}$ par $u_{0}=1$ et $u_{n+1}=\dfrac{u_{n}}{u_{n}+1}$.

    **1.** Calculer $u_{1}$, $u_{2}$, $u_{3}$ et $u_{4}$.

    **2.** Pour tout $n\in\mathbb{N}$, on pose $v_{n}=\dfrac{1}{u_{n}}$. Calculer $v_{0}$, $v_{1}$, $v_{2}$, $v_{3}$ et $v_{4}$.

    **3.** Démontrer que $(v_{n})$ est une suite arithmétique dont on précisera la raison.

    **4.** Déterminer $v_{n}$ en fonction de $n$.

    **5.** En déduire l'expression de $u_{n}$ en fonction de $n$.
  corrige: |
    **1.** $u_{1}=\dfrac{1}{2}$, $u_{2}=\dfrac{\frac{1}{2}}{\frac{3}{2}}=\dfrac{1}{3}$, puis : 
    $$\boxed{u_{1}=\frac{1}{2} \; ; \; u_{2}=\frac{1}{3} \; ; \; u_{3}=\frac{1}{4} \; ; \; u_{4}=\frac{1}{5}}$$

    **2.** En prenant les inverses : 
    $$\boxed{v_{0}=1 \; ; \; v_{1}=2 \; ; \; v_{2}=3 \; ; \; v_{3}=4 \; ; \; v_{4}=5}$$

    **3.** Pour tout $n\in\mathbb{N}$ (les termes $u_{n}$ étant non nuls) : 
    $$v_{n+1}=\frac{1}{u_{n+1}}=\frac{u_{n}+1}{u_{n}}=1+\frac{1}{u_{n}}=v_{n}+1$$

    $$\boxed{(v_{n})\text{ est arithmétique de raison }1}$$

    **4.** Comme $v_{0}=1$ : $\boxed{v_{n}=1+n}$

    **5.** Enfin $u_{n}=\dfrac{1}{v_{n}}$ : 
    $$\boxed{u_{n}=\frac{1}{n+1}}$$
- id: "p-02-17"
  feuille: "f-p-02"
  numero: 17
  partie: "Suites particulières"
  etoiles: 1
  types: [Calcul]
  mots_cles: [suites, suite géométrique, raison]
  noeuds: [ar-suites]
  notions: [suite]
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Pour chacune des suites $(v_{n})$ suivantes, déterminer si elle est géométrique, et si oui préciser son premier terme et sa raison :

    **1.** $v_{n}=5^{n+3}$

    **2.** $v_{n}=\dfrac{2n+3}{3}$

    **3.** $v_{n}=3^{n}+3n$

    **4.** $v_{0}=-1=$ et $5v_{n+1}-2v_{n}=1$

    **5.** $v_{0}=-1=$ et $5v_{n+1}-2v_{n}=0$

    **6.** $v_{n}=\left(\dfrac{1}{2}\right)^{n+1}-\left(\dfrac{1}{2}\right)^{n-1}$
  corrige: |
    Une suite est géométrique lorsque le quotient $\dfrac{v_{n+1}}{v_{n}}$ est *constant*.

    **1.** $\dfrac{v_{n+1}}{v_{n}}=\dfrac{5^{n+4}}{5^{n+3}}=5$ : $\boxed{\text{géométrique, }v_{0}=125\text{ et }q=5}$

    **2.** $v_{n+1}-v_{n}=\dfrac{2}{3}$ : la suite est arithmétique, mais le quotient $\dfrac{2n+5}{2n+3}$ n'est pas constant : $\boxed{\text{pas géométrique}}$

    **3.** $v_{0}=1$, $v_{1}=6$ et $v_{2}=15$, or $\dfrac{6}{1}\neq\dfrac{15}{6}$ : $\boxed{\text{pas géométrique}}$

    **4.** La relation s'écrit $v_{n+1}=\dfrac{2v_{n}+1}{5}$ : la présence du $+1$ empêche le quotient d'être constant. En effet $v_{1}=-\dfrac{1}{5}$ et $v_{2}=\dfrac{3}{25}$, or $\dfrac{v_{1}}{v_{0}}=\dfrac{1}{5}$ et $\dfrac{v_{2}}{v_{1}}=-\dfrac{3}{5}$ : $\boxed{\text{pas géométrique}}$

    **5.** La relation s'écrit $v_{n+1}=\dfrac{2}{5}v_{n}$ : $\boxed{\text{géométrique, }v_{0}=-1\text{ et }q=\frac{2}{5}}$

    **6.** On factorise par $\left(\dfrac{1}{2}\right)^{n-1}$ : 
    $$v_{n}=\left(\frac{1}{2}\right)^{n-1}\left[\left(\frac{1}{2}\right)^{2}-1\right] =-\frac{3}{4}\left(\frac{1}{2}\right)^{n-1}$$
     $\boxed{\text{géométrique, }v_{0}=-\frac{3}{2}\text{ et }q=\frac{1}{2}}$
- id: "p-02-18"
  feuille: "f-p-02"
  numero: 18
  partie: "Suites particulières"
  etoiles: 1
  types: [Calcul]
  mots_cles: [suites, forme explicite, suite géométrique]
  noeuds: [ar-suites]
  notions: [suite]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Pour chacune des suites géométriques suivantes, donner l'expression explicite et calculer le terme demandé :

    **a)** $u_0=4 \text{ et } r=-2 \\ \text{Calculer }{u_{8}}$

    **b)** $u_0=-2 \text{ et } r=5 \\ \text{Calculer }{u_{6}}$

    **c)** $u_0=-\sqrt{2} \text{ et } r=\sqrt{2} \\ \text{Calculer }{u_{7}}$

    **d)** $u_0=\dfrac{1}{2} \text{ et } r=-\dfrac{1}{3} \\ \text{Calculer }{u_{6}}$

    **e)** $u_1=5 \text{ et } r=2 \\ \text{Calculer }{u_{20}}$

    **f)** $u_7=4 \text{ et } r=-5 \\ \text{Calculer }{u_{11}}$
  corrige: |
    On applique la formule explicite $u_{n}=u_{0}\times q^{n}$, ou $u_{n}=u_{p}\times q^{n-p}$.

    **a)** $u_{n}=4\times(-2)^{n}$ d'où $\boxed{u_{8}=4\times 256=1\,024}$

    **b)** $u_{n}=-2\times 5^{n}$ d'où $\boxed{u_{6}=-2\times 15\,625=-31\,250}$

    **c)** $u_{n}=-\sqrt{2}\times\left(\sqrt{2}\right)^{n}=-\left(\sqrt{2}\right)^{n+1}$ d'où $\boxed{u_{7}=-\left(\sqrt{2}\right)^{8}=-16}$

    **d)** $u_{n}=\dfrac{1}{2}\times\left(-\dfrac{1}{3}\right)^{n}$ d'où $\boxed{u_{6}=\dfrac{1}{2}\times\dfrac{1}{729}=\dfrac{1}{1\,458}}$

    **e)** $u_{n}=5\times 2^{n-1}$ d'où $\boxed{u_{20}=5\times 2^{19}=2\,621\,440}$

    **f)** $u_{n}=4\times(-5)^{n-7}$ d'où $\boxed{u_{11}=4\times(-5)^{4}=2\,500}$
- id: "p-02-19"
  feuille: "f-p-02"
  numero: 19
  partie: "Suites particulières"
  etoiles: 1
  types: [Calcul]
  mots_cles: [suites, suite géométrique, raison]
  noeuds: [ar-suites]
  notions: [suite]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Soit $(v_{n})$ une suite géométrique de raison $q$.

    **1.** $v_{5} = 64$, $v_{7} = 256$, $q > 0$. Déterminer $q$ puis calculer $v_{10}$.

    **2.** $v_{5} = 486$, $v_{7} = 4 374$, $q > 0$. Déterminer $q$ puis calculer $v_{0}$ et $v_{10}$.
  corrige: |
    **1.** De $v_{7}=v_{5}\times q^{2}$, on tire $q^{2}=\dfrac{256}{64}=4$, et comme $q>0$ : $\boxed{q=2}$. Alors : 
    $$v_{10}=v_{7}\times q^{3}=256\times 8 \qquad\text{d'où}\qquad \boxed{v_{10}=2\,048}$$

    **2.** De même $q^{2}=\dfrac{4\,374}{486}=9$, et comme $q>0$ : $\boxed{q=3}$. Alors : 
    $$v_{0}=\frac{v_{5}}{q^{5}}=\frac{486}{243}=\boxed{2} \qquad\text{et}\qquad v_{10}=v_{0}\times 3^{10} \qquad\text{d'où}\qquad \boxed{v_{10}=118\,098}$$
- id: "p-02-20"
  feuille: "f-p-02"
  numero: 20
  partie: "Suites particulières"
  etoiles: 2
  types: [Calcul]
  mots_cles: [suites, suite géométrique, raison, sens de variation]
  noeuds: [ar-suites]
  notions: [suite]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    **1.** Soit $(u_{n})$ une suite géométrique de termes non nuls et de raison $q>0$ telle que : 
    $$u_{n+2}=u_{n+1}+u_{n}$$
     Déterminer $q$.

    **2.** Soit $(v_{n})$ une suite géométrique croissante dont les termes sont négatifs. Son premier terme est $v_{1}$.

    **(a)** Que peut-on dire de sa raison ?

    **(b)** On sait que $v_{1}\times v_{3}=\dfrac{4}{9}$ et $v_{1}+v_{2}+v_{3}=-\dfrac{19}{9}$.

    Calculer $v_{1}$, $v_{2}$ et $v_{3}$.

    **(c)** Exprimer $v_{n}$ en fonction de $n$.
  corrige: |
    **1.** En écrivant $u_{n+1}=u_{n}q$ et $u_{n+2}=u_{n}q^{2}$, la relation devient : 
    $$u_{n}q^{2}=u_{n}q+u_{n}$$
     Les termes étant non nuls, on peut diviser par $u_{n}$ : 
    $$q^{2}=q+1 \iff q^{2}-q-1=0$$
     Le discriminant vaut $\Delta=1+4=5$, d'où les solutions $\dfrac{1\pm\sqrt{5}}{2}$. Comme $q>0$ : 
    $$\boxed{q=\frac{1+\sqrt{5}}{2}}$$
     On reconnaît le *nombre d'or*.

    **2.** **(a)** Les termes sont tous négatifs, donc le quotient de deux termes consécutifs est positif : la raison est positive. De plus la suite est croissante, donc les termes se rapprochent de $0$ en valeur absolue : 
    $$\boxed{0<q<1}$$

    **(b)** Comme $v_{1}\times v_{3}=v_{1}\times v_{1}q^{2}=\left(v_{1}q\right)^{2}=v_{2}^{2}$, on a $v_{2}^{2}=\dfrac{4}{9}$, et comme les termes sont négatifs : $v_{2}=-\dfrac{2}{3}$. Alors : 
    $$v_{1}+v_{3}=-\frac{19}{9}+\frac{2}{3}=-\frac{13}{9} \qquad\text{et}\qquad v_{1}\times v_{3}=\frac{4}{9}$$
     Les nombres $v_{1}$ et $v_{3}$ sont donc les solutions de $9X^{2}+13X+4=0$, dont le discriminant vaut $\Delta=169-144=25$ : ce sont $-1$ et $-\dfrac{4}{9}$. La suite étant croissante : 
    $$\boxed{v_{1}=-1 \quad ; \quad v_{2}=-\frac{2}{3} \quad ; \quad v_{3}=-\frac{4}{9}}$$

    **(c)** La raison vaut $q=\dfrac{v_{2}}{v_{1}}=\dfrac{2}{3}$, d'où : 
    $$\boxed{v_{n}=-\left(\frac{2}{3}\right)^{n-1}}$$
- id: "p-02-21"
  feuille: "f-p-02"
  numero: 21
  titre: "Suite auxiliaire"
