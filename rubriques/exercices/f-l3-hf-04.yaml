  source: "ENS, Topologie, analyse et calcul différentiel, feuille 7 (13/11/2014), exercice 1"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **Théorème de Hellinger et Toeplitz.** On admet le théorème de Banach-Steinhaus, dans la forme suivante : si $(\varphi_{i})_{i \in I}$ est une famille de formes linéaires continues sur un espace de Hilbert $H$ telle que $\mathop{\displaystyle \sup_{i \in I}} |\varphi_{i}(x)| < +\infty$ pour tout $x \in H$, alors $\mathop{\displaystyle \sup_{i \in I}} \lVert \varphi_{i} \rVert < +\infty$.

    Soit $T : H \to H$ une application linéaire, *a priori* non continue, telle que $\langle Tx, y \rangle = \langle x, Ty \rangle$ pour tous $x, y \in H$. Démontrer que $T$ est continue. On pourra considérer les formes $\varphi_{y} : x \mapsto \langle x, Ty \rangle$ pour $\lVert y \rVert \leq 1$.
  corrige: |
    Pour $y$ dans la boule unité $B$, la forme $\varphi_{y} : x \mapsto \langle x, Ty \rangle$ est linéaire continue, de norme $\lVert Ty \rVert$ (Cauchy-Schwarz, avec égalité en $x = Ty$).

    Pour $x$ fixé, l'hypothèse de symétrie donne $\varphi_{y}(x) = \langle x, Ty \rangle = \langle Tx, y \rangle$, d'où $|\varphi_{y}(x)| \leq \lVert Tx \rVert$ pour tout $y \in B$ : la famille $(\varphi_{y})_{y \in B}$ est bornée en chaque point.

    Le théorème de Banach-Steinhaus fournit $M = \mathop{\displaystyle \sup_{y \in B}} \lVert \varphi_{y} \rVert < +\infty$, c'est-à-dire $\lVert Ty \rVert \leq M$ pour tout $y \in B$. Par linéarité, $\lVert Ty \rVert \leq M \lVert y \rVert$ pour tout $y$ : $T$ est continue.

    *Remarque.* Un opérateur symétrique défini partout est donc automatiquement borné. Les opérateurs symétriques non bornés de la physique, comme $f \mapsto \mathrm{i} f'$ sur $L^{2}$, ne sont définis que sur un sous-espace dense, et c'est là leur seule échappatoire.
