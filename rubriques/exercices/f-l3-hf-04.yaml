  enonce: |
    **Trace.** Soit $H$ un espace de Hilbert complexe, $(e_{n})_{n \geq 0}$ et $(f_{k})_{k \geq 0}$ deux bases hilbertiennes de $H$, et $T \in \mathcal{L}(H)$ telle que la série $\mathop{\displaystyle \sum_{n}} \lVert Te_{n} \rVert$ converge.

    **1.** Vérifier que la série $\mathop{\displaystyle \sum_{n}} |\langle Te_{n}, e_{n} \rangle|$ converge.

    **2.** Soit $x \in H$. Établir les égalités 
    $$\langle Tx, x \rangle = \sum_{k \geq 0} \langle Tx, f_{k} \rangle \langle f_{k}, x \rangle \qquad \text{et} \qquad \langle x, T^{*}x \rangle = \sum_{n \geq 0} \langle x, e_{n} \rangle \langle Te_{n}, x \rangle .$$

    **3.** En déduire que la série $\mathop{\displaystyle \sum_{k}} |\langle Tf_{k}, f_{k} \rangle|$ converge (on pourra la comparer à $\mathop{\displaystyle \sum_{n}} \lVert Te_{n} \rVert$), puis que 
    $$\sum_{k \geq 0} \langle Tf_{k}, f_{k} \rangle = \sum_{n \geq 0} \langle Te_{n}, e_{n} \rangle .$$
  corrige: |
    $\triangleright$ *1.* Par Cauchy-Schwarz, $|\langle Te_{n}, e_{n} \rangle| \leq \lVert Te_{n} \rVert$ : la série converge absolument.

    $\triangleright$ *2.* La première égalité est l'identité de Parseval « polarisée » : pour $u, v \in H$, $\langle u, v \rangle = \mathop{\displaystyle \sum_{k}} \langle u, f_{k} \rangle\langle f_{k}, v \rangle$ (chapitre 3), appliquée à $u = Tx$, $v = x$.

    Pour la seconde, $x = \mathop{\displaystyle \sum_{n}} \langle x, e_{n} \rangle e_{n}$, et par continuité $Tx = \mathop{\displaystyle \sum_{n}} \langle x, e_{n} \rangle Te_{n}$, d'où 
    $$\langle x, T^{*}x \rangle = \langle Tx, x \rangle = \sum_{n} \langle x, e_{n} \rangle \langle Te_{n}, x \rangle .$$

    $\triangleright$ *3.* Avec $x = f_{k}$ dans la seconde égalité, $\langle Tf_{k}, f_{k} \rangle = \mathop{\displaystyle \sum_{n}} \langle f_{k}, e_{n} \rangle \langle Te_{n}, f_{k} \rangle$. On majore la série double des modules, en sommant d'abord sur $k$ (termes positifs) et en appliquant Cauchy-Schwarz puis Parseval : 
    $$\sum_{n} \sum_{k} |\langle f_{k}, e_{n} \rangle| \, |\langle Te_{n}, f_{k} \rangle| \leq \sum_{n} \Big( \sum_{k} |\langle e_{n}, f_{k} \rangle|^{2} \Big)^{1/2} \Big( \sum_{k} |\langle Te_{n}, f_{k} \rangle|^{2} \Big)^{1/2} = \sum_{n} \lVert Te_{n} \rVert < +\infty .$$
     La série $\mathop{\displaystyle \sum_{k}} |\langle Tf_{k}, f_{k} \rangle|$ converge donc, et la série double est absolument convergente : on peut intervertir les sommations. Avec la première égalité de la question 2 (pour $u = Te_{n}$, $v = e_{n}$), 
    $$\sum_{k} \langle Tf_{k}, f_{k} \rangle = \sum_{n} \sum_{k} \langle Te_{n}, f_{k} \rangle \langle f_{k}, e_{n} \rangle = \sum_{n} \langle Te_{n}, e_{n} \rangle .$$
     La trace $\mathop{\displaystyle \sum_{n}} \langle Te_{n}, e_{n} \rangle$ ne dépend pas de la base, comme en dimension finie, où elle est la somme des coefficients diagonaux de la matrice.
