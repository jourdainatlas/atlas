  source: "Bordeaux 2015-2016, TD 2, exercice 7 (2) ; Bibmath, exercice 11 (3) ; Bibmath, exercice 10"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **Opérateurs à noyau.** Soit $H = L^{2}([0, 1], \mathbb{C})$ et $K : [0, 1]^{2} \to \mathbb{C}$ une fonction continue. Pour $f \in H$, on pose $Tf(x) = \mathop{\displaystyle \int_{0}^{1}} K(x, y) f(y) \, \mathrm{d} y$.

    **1.** Vérifier que $Tf$ est une fonction continue sur $[0, 1]$, que $T$ est linéaire continue de $H$ dans $H$, et que $\lVert T \rVert \leq \big( \mathop{\displaystyle \int_{[0, 1]^{2}}} |K|^{2} \big)^{1/2}$.

    **2.** Calculer l'adjoint de $T$. À quelle condition sur $K$ l'opérateur $T$ est-il autoadjoint ?

    **3.** On prend $K(x, y) = \mathrm{e}^{2\mathrm{i}\pi(x - y)}$. Déterminer $\operatorname{Im} T$, $\ker T$ et $\ker T^{*}$, et vérifier la relation $\ker T^{*} = (\operatorname{Im} T)^{\perp}$ de la proposition 3 du cours.
  corrige: |
    $\triangleright$ *1.* La fonction $K$ est continue sur le compact $[0, 1]^{2}$, donc uniformément continue. Pour $x, x' \in [0, 1]$, Cauchy-Schwarz donne 
    $$|Tf(x) - Tf(x')| \leq \Big( \int_{0}^{1} |K(x, y) - K(x', y)|^{2} \, \mathrm{d} y \Big)^{1/2} \lVert f \rVert \leq \sup_{y} |K(x, y) - K(x', y)| \, \lVert f \rVert ,$$
     qui tend vers $0$ quand $x' \to x$ : $Tf$ est continue. De même, $|Tf(x)|^{2} \leq \mathop{\displaystyle \int_{0}^{1}} |K(x, y)|^{2} \, \mathrm{d} y \, \lVert f \rVert^{2}$, et en intégrant en $x$, 
    $$\lVert Tf \rVert^{2} \leq \Big( \int_{[0, 1]^{2}} |K|^{2} \Big) \lVert f \rVert^{2} .$$
     L'opérateur $T$, évidemment linéaire, est donc continu, de norme au plus $\lVert K \rVert_{L^{2}}$.

    $\triangleright$ *2.* Pour $f, g \in H$, le théorème de Fubini (l'intégrande est intégrable sur $[0, 1]^{2}$) donne 
    $$\langle Tf, g \rangle = \int_{0}^{1} \int_{0}^{1} K(x, y) f(y) \overline{g(x)} \, \mathrm{d} y \, \mathrm{d} x = \int_{0}^{1} f(y) \, \overline{\int_{0}^{1} \overline{K(x, y)} g(x) \, \mathrm{d} x} \, \mathrm{d} y .$$
     Donc $T^{*} g(y) = \mathop{\displaystyle \int_{0}^{1}} \overline{K(x, y)} g(x) \, \mathrm{d} x$ : l'adjoint est l'opérateur de noyau $K^{*}(y, x) = \overline{K(x, y)}$. Il est autoadjoint si $K(y, x) = \overline{K(x, y)}$ pour tous $x, y$ ; réciproquement, si $T = T^{*}$, les noyaux continus $K$ et $K^{*}$ définissent le même opérateur, et l'on peut montrer qu'ils sont alors égaux (tester sur des fonctions concentrées près d'un point).

    $\triangleright$ *3.* Avec $e(x) = \mathrm{e}^{2\mathrm{i}\pi x}$, de norme $1$, on a $Tf(x) = e(x) \mathop{\displaystyle \int_{0}^{1}} \overline{e(y)} f(y) \, \mathrm{d} y = \langle f, e \rangle e(x)$ : $T$ est la projection orthogonale sur la droite $\mathbb{C} e$, de rang $1$ (exercice 6). Ici $K(y, x) = \overline{K(x, y)}$, donc $T^{*} = T$. On obtient 
    $$\operatorname{Im} T = \mathbb{C} e , \qquad \ker T = \ker T^{*} = \{e\}^{\perp} = (\operatorname{Im} T)^{\perp} ,$$
     en accord avec la proposition 3 du cours.
- id: "l3-hf-04-09"
  feuille: "f-l3-hf-04"
  numero: 9
  partie: "Adjoints"
  etoiles: 2
  types: [Calcul]
  mots_cles: [adjoint]
  noeuds: [f-operateurs, f-riesz]
  notions: [norme-operateur, espace-hilbert]
  source: "Bibmath, Espaces de Hilbert, exercice 12 ; Bordeaux 2015-2016, TD 2, exercice 5"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **Opérateurs d'intégration.** Soit $H = L^{2}([0, 1], \mathbb{C})$ et $\alpha \in [0, \dfrac{1}{2}[$. Pour $f \in H$ et $x \in [0, 1]$, on pose 
    $$T_{\alpha} f(x) = \int_{0}^{x} \frac{f(t)}{t^{\alpha}} \, \mathrm{d} t .$$

    **1.** Vérifier que $T_{\alpha} f(x)$ est bien défini, que $T_{\alpha} f$ est continue sur $[0, 1]$, et que $T_{\alpha}$ est une application linéaire continue de $H$ dans $H$, de norme au plus $\big((1 - 2\alpha)(2 - 2\alpha)\big)^{-1/2}$.

    **2.** Déterminer l'adjoint de $T_{0}$, puis celui de $T_{\alpha}$.
  corrige: |
    $\triangleright$ *1.* Comme $2\alpha < 1$, la fonction $t \mapsto t^{-\alpha}$ est de carré intégrable sur $]0, 1]$, et $\mathop{\displaystyle \int_{0}^{x}} t^{-2\alpha} \, \mathrm{d} t = \dfrac{x^{1 - 2\alpha}}{1 - 2\alpha}$. Par Cauchy-Schwarz, $f(t) t^{-\alpha}$ est intégrable sur $[0, x]$ et 
    $$|T_{\alpha} f(x)|^{2} \leq \lVert f \rVert^{2} \, \frac{x^{1 - 2\alpha}}{1 - 2\alpha} .$$
     Pour $x' < x$, de même, $|T_{\alpha} f(x) - T_{\alpha} f(x')|^{2} \leq \lVert f \rVert^{2} \mathop{\displaystyle \int_{x'}^{x}} t^{-2\alpha} \, \mathrm{d} t$, qui tend vers $0$ quand $x' \to x$ (continuité de l'intégrale d'une fonction intégrable) : $T_{\alpha} f$ est continue. En intégrant la première inégalité en $x$, 
    $$\lVert T_{\alpha} f \rVert^{2} \leq \frac{\lVert f \rVert^{2}}{1 - 2\alpha} \int_{0}^{1} x^{1 - 2\alpha} \, \mathrm{d} x = \frac{\lVert f \rVert^{2}}{(1 - 2\alpha)(2 - 2\alpha)} .$$
     L'opérateur $T_{\alpha}$, linéaire, est donc continu, de norme au plus $\big((1 - 2\alpha)(2 - 2\alpha)\big)^{-1/2}$.

    $\triangleright$ *2.* On écrit $T_{\alpha} f(x) = \mathop{\displaystyle \int_{0}^{1}} K(x, t) f(t) \, \mathrm{d} t$ avec $K(x, t) = t^{-\alpha} \mathbf{1}_{t < x}$, qui est de carré intégrable sur $[0, 1]^{2}$. Le calcul de l'exercice 8 (Fubini) donne 
    $$\boxed{T_{\alpha}^{*} g(t) = t^{-\alpha} \int_{t}^{1} g(x) \, \mathrm{d} x , \qquad \text{en particulier} \qquad T_{0}^{*} g(t) = \int_{t}^{1} g(x) \, \mathrm{d} x .}$$
     L'adjoint de « intégrer depuis $0$ » est « intégrer jusqu'à $1$ ».

    *Remarque.* Pour $\alpha = 0$, la borne obtenue est $\dfrac{1}{\sqrt{2}} \approx 0{,}707$ ; on peut montrer que la norme exacte de $T_{0}$ est $\dfrac{2}{\pi} \approx 0{,}637$, en calculant les valeurs propres de $T_{0}^{*}T_{0}$, ce qui conduit à une équation différentielle du second ordre.
- id: "l3-hf-04-10"
  feuille: "f-l3-hf-04"
  numero: 10
  partie: "Adjoints"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [adjoint]
  noeuds: [f-operateurs, f-riesz]
  notions: [norme-operateur, espace-hilbert, valeur-propre]
  source: "Sorbonne 3M210, TD 3, exercice 12 ; Mathovore, exercices L3, exercice 10 ; Bibmath, exercice 11 (2)"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **Décalage bilatéral.** Soit $T : \ell^{2}(\mathbb{Z}) \to \ell^{2}(\mathbb{Z})$ défini par $T\big((a_{n})_{n \in \mathbb{Z}}\big) = (a_{n-1})_{n \in \mathbb{Z}}$. On note $(\varepsilon_{n})_{n \in \mathbb{Z}}$ la base canonique de $\ell^{2}(\mathbb{Z})$.

    **1.** Montrer que $T$ est une isométrie linéaire bijective de $\ell^{2}(\mathbb{Z})$ sur lui-même.

    **2.** Quel est l'inverse $S = T^{-1}$ ? Montrer que $T^{*} = S$. Comparer avec le décalage de $\ell^{2}(\mathbb{N})$ étudié dans le cours.

    **3.** Calculer $T^{n} \varepsilon_{0}$ et $S^{n} \varepsilon_{n}$ pour $n \in \mathbb{N}$, et en déduire que $\langle T^{n} a, \varepsilon_{n} \rangle = a_{0}$ pour tout $a \in \ell^{2}(\mathbb{Z})$.

    **4.** Montrer que $T$ n'a aucune valeur propre.

    **5.** Soit $G = \{ a \in \ell^{2}(\mathbb{Z}) ; \ a_{k} = 0 \ \text{pour tout } k \leq 0 \}$. Montrer que $G$ est un sous-espace fermé tel que $T(G) \subset G$. A-t-on $T(G) = G$ ?
  corrige: |
    $\triangleright$ *1.* La linéarité est claire, et $\lVert Ta \rVert^{2} = \mathop{\displaystyle \sum_{n}} |a_{n-1}|^{2} = \lVert a \rVert^{2}$ : $T$ est une isométrie. Elle est surjective : la suite $b = (a_{n+1})_{n}$ vérifie $Tb = a$.

    $\triangleright$ *2.* L'inverse est le décalage dans l'autre sens, $S\big((a_{n})_{n}\big) = (a_{n+1})_{n}$. Pour $a, b \in \ell^{2}(\mathbb{Z})$, 
    $$\langle Ta, b \rangle = \sum_{n \in \mathbb{Z}} a_{n-1} \overline{b_{n}} = \sum_{m \in \mathbb{Z}} a_{m} \overline{b_{m+1}} = \langle a, Sb \rangle ,$$
     donc $T^{*} = S = T^{-1}$ : $T$ est *unitaire*. Sur $\ell^{2}(\mathbb{N})$, au contraire, le décalage $S$ du cours vérifie $S^{*}S = \mathrm{id}$ mais $SS^{*} \neq \mathrm{id}$ : il manque le premier terme. Sur $\mathbb{Z}$, il n'y a pas de « premier terme » à perdre.

    $\triangleright$ *3.* Le décalage déplace l'unique coordonnée non nulle d'un cran vers la droite : $T^{n}\varepsilon_{0} = \varepsilon_{n}$, et de même $S^{n}\varepsilon_{n} = \varepsilon_{0}$. D'où, puisque $(T^{n})^{*} = S^{n}$, 
    $$\langle T^{n} a, \varepsilon_{n} \rangle = \langle a, S^{n}\varepsilon_{n} \rangle = \langle a, \varepsilon_{0} \rangle = a_{0} .$$

    $\triangleright$ *4.* Si $Ta = \lambda a$ avec $a \neq 0$, alors $\lVert a \rVert = \lVert Ta \rVert = |\lambda| \lVert a \rVert$, donc $|\lambda| = 1$. La relation $a_{n-1} = \lambda a_{n}$ donne $|a_{n}| = |a_{n-1}|$ pour tout $n$ : la suite $(|a_{n}|)$ est constante, non nulle, et $\mathop{\displaystyle \sum_{n \in \mathbb{Z}}} |a_{n}|^{2} = +\infty$. Contradiction : $T$ n'a pas de valeur propre.

    $\triangleright$ *5.* On a $G = \mathop{\displaystyle \bigcap_{k \leq 0}} \ker(a \mapsto a_{k})$, intersection de noyaux de formes continues : $G$ est un sous-espace fermé. Si $a \in G$, $(Ta)_{k} = a_{k-1} = 0$ pour $k \leq 0$ : $T(G) \subset G$. Mais $T(G) = \{a ; \ a_{k} = 0 \text{ pour } k \leq 1\}$ ne contient pas $\varepsilon_{1} \in G$ : $T(G) \subsetneq G$. La restriction de $T$ à $G \simeq \ell^{2}(\mathbb{N}^{*})$ est exactement le décalage unilatéral du cours.

    1.5em

    ![Figure](documents/figures/446fc5816fec740a.svg)

    Le décalage bilatéral déplace chaque terme d'un cran vers la droite. Contrairement au décalage de $\ell^{2}(\mathbb{N})$, aucun terme n'est créé ni perdu : $T$ est une isométrie surjective.
- id: "l3-hf-04-11"
  feuille: "f-l3-hf-04"
  numero: 11
  partie: "Adjoints"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [adjoint]
  noeuds: [f-operateurs, f-riesz]
  notions: [norme-operateur, espace-hilbert]
  source: "Bordeaux 2012-2013, feuille 3, exercice 3"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Soit $H$ un espace de Hilbert complexe et $T \in \mathcal{L}(H)$. Montrer que $\lVert T^{*}T \rVert = \lVert T \rVert^{2}$, puis que $\lVert TT^{*} \rVert = \lVert T \rVert^{2}$.
  corrige: |
    D'après le cours (th. 2 et prop. 2), $\lVert T^{*} \rVert = \lVert T \rVert$, donc $\lVert T^{*}T \rVert \leq \lVert T^{*} \rVert \lVert T \rVert = \lVert T \rVert^{2}$.

    Inversement, pour $x \in H$, Cauchy-Schwarz donne 
    $$\lVert Tx \rVert^{2} = \langle Tx, Tx \rangle = \langle T^{*}Tx, x \rangle \leq \lVert T^{*}T \rVert \lVert x \rVert^{2} ,$$
     d'où $\lVert T \rVert^{2} \leq \lVert T^{*}T \rVert$. Ainsi $\lVert T^{*}T \rVert = \lVert T \rVert^{2}$. En appliquant ce résultat à $T^{*}$, avec $T^{**} = T$, on obtient $\lVert TT^{*} \rVert = \lVert T^{*} \rVert^{2} = \lVert T \rVert^{2}$.

    *Remarque.* Cette identité relie la norme, notion métrique, à la structure algébrique $T \mapsto T^{*}$ ; pour un opérateur autoadjoint, elle donne $\lVert T^{2} \rVert = \lVert T \rVert^{2}$, puis $\lVert T^{2^{k}} \rVert = \lVert T \rVert^{2^{k}}$.
- id: "l3-hf-04-12"
  feuille: "f-l3-hf-04"
  numero: 12
  partie: "Adjoints"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [adjoint]
  noeuds: [f-operateurs, f-riesz]
  notions: [norme-operateur, espace-hilbert]
  source: "Bordeaux 2015-2016, devoir maison 1 (DS 2014-2015), exercice 1"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    **Isométries.** On note $j = \mathrm{e}^{2\mathrm{i}\pi/3}$.

    **1.** Soit $E$ un espace préhilbertien complexe et $(x, y) \in E^{2}$. Exprimer en fonction de $\langle x, y \rangle$ la quantité 
    $$\lVert x + y \rVert^{2} + j \lVert x + jy \rVert^{2} + j^{2} \lVert x + j^{2}y \rVert^{2} .$$

    **2.** Soit $T : H \to H'$ linéaire continue entre espaces de Hilbert complexes. Montrer que les assertions suivantes sont équivalentes : 
    $$(\alpha) \ \lVert Tx \rVert = \lVert x \rVert \ \text{pour tout } x \in H ; \quad (\beta) \ \langle Tx, Ty \rangle = \langle x, y \rangle \ \text{pour tous } x, y \in H ; \quad (\gamma) \ T^{*}T = \mathrm{id}_{H} .$$
  corrige: |
    $\triangleright$ *1.* Pour $\omega \in \{1, j, j^{2}\}$, on a $|\omega| = 1$, et par sesquilinéarité (linéarité à gauche) 
    $$\lVert x + \omega y \rVert^{2} = \lVert x \rVert^{2} + \lVert y \rVert^{2} + \overline{\omega} \langle x, y \rangle + \omega \langle y, x \rangle .$$
     On multiplie par $\omega$ et l'on somme sur les trois valeurs. Comme $1 + j + j^{2} = 0$, les termes en $\lVert x \rVert^{2} + \lVert y \rVert^{2}$ disparaissent ; $\omega\overline{\omega} = 1$ donne $3\langle x, y \rangle$ ; et $\mathop{\displaystyle \sum} \omega^{2} = 1 + j^{2} + j^{4} = 1 + j^{2} + j = 0$. Donc 
    $$\boxed{\lVert x + y \rVert^{2} + j \lVert x + jy \rVert^{2} + j^{2} \lVert x + j^{2}y \rVert^{2} = 3 \langle x, y \rangle .}$$
     C'est une variante de l'identité de polarisation complexe du chapitre 1, avec les racines cubiques de l'unité au lieu des racines quatrièmes $\pm 1$, $\pm \mathrm{i}$.

    $\triangleright$ *2.* $(\alpha) \Rightarrow (\beta)$ : la question 1, appliquée dans $H$ et dans $H'$, exprime $\langle x, y \rangle$ et $\langle Tx, Ty \rangle$ à l'aide des normes de $x + \omega y$ et de $T(x + \omega y) = Tx + \omega Ty$, qui sont égales.

    $(\beta) \Rightarrow (\gamma)$ : pour tous $x, y$, $\langle T^{*}Tx, y \rangle = \langle Tx, Ty \rangle = \langle x, y \rangle$, donc $T^{*}Tx - x$ est orthogonal à tout $y$, et $T^{*}Tx = x$.

    $(\gamma) \Rightarrow (\alpha)$ : $\lVert Tx \rVert^{2} = \langle T^{*}Tx, x \rangle = \lVert x \rVert^{2}$.

    *Remarque.* Une isométrie n'est pas forcément surjective : le décalage du cours vérifie $S^{*}S = \mathrm{id}$ sans être inversible. Lorsque, de plus, $TT^{*} = \mathrm{id}$, l'opérateur est *unitaire*, comme le décalage bilatéral de l'exercice 10.
- id: "l3-hf-04-13"
  feuille: "f-l3-hf-04"
  numero: 13
  partie: "Adjoints"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [adjoint]
  noeuds: [f-operateurs, f-riesz]
  notions: [norme-operateur, espace-hilbert]
  source: "Bordeaux 2015-2016, devoir maison 1 (DS 2014-2015), exercice 2"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    **Opérateurs minorés.** Soit $T : H \to H'$ linéaire continue entre espaces de Hilbert complexes. On suppose qu'il existe $c > 0$ tel que $\lVert Tx \rVert \geq c \lVert x \rVert$ pour tout $x \in H$.

    **1.** Soit $(x_{n})$ une suite de $H$ telle que $(Tx_{n})$ converge dans $H'$. Montrer que $(x_{n})$ est de Cauchy.

    **2.** En déduire que $\operatorname{Im} T$ est fermé dans $H'$.

    **3.** Vérifier que $T$ est injective et que $T^{-1} : \operatorname{Im} T \to H$ est continue.

    **4.** En conclure qu'il existe $S \in \mathcal{L}(H', H)$ telle que $ST = \mathrm{id}_{H}$.
  corrige: |
    $\triangleright$ *1.* Par linéarité, $\lVert x_{n} - x_{m} \rVert \leq \dfrac{1}{c} \lVert Tx_{n} - Tx_{m} \rVert$, et $(Tx_{n})$ est de Cauchy puisqu'elle converge : $(x_{n})$ est de Cauchy.

    $\triangleright$ *2.* Soit $y \in \overline{\operatorname{Im} T}$, limite d'une suite $(Tx_{n})$. D'après la question 1, $(x_{n})$ converge vers un $x \in H$ ($H$ est complet), et par continuité $Tx = \mathop{\displaystyle \lim} Tx_{n} = y$. Donc $y \in \operatorname{Im} T$ : $\operatorname{Im} T$ est fermé.

    $\triangleright$ *3.* Si $Tx = 0$, alors $c\lVert x \rVert \leq 0$ et $x = 0$ : $T$ est injective. Pour $y = Tx \in \operatorname{Im} T$, $\lVert T^{-1}y \rVert = \lVert x \rVert \leq \dfrac{1}{c}\lVert y \rVert$ : $T^{-1}$ est continue, de norme au plus $1/c$.

    $\triangleright$ *4.* Le sous-espace $F = \operatorname{Im} T$ est fermé ; soit $p_{F}$ la projection orthogonale sur $F$. On pose $S = T^{-1} \circ p_{F} : H' \to H$, composée d'applications linéaires continues. Pour $x \in H$, $p_{F}(Tx) = Tx$, donc $STx = x$ : $ST = \mathrm{id}_{H}$. L'opérateur $S$ inverse $T$ sur son image et annule $F^{\perp} = \ker T^{*}$.
- id: "l3-hf-04-14"
  feuille: "f-l3-hf-04"
  numero: 14
  partie: "Adjoints"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [adjoint, projection orthogonale]
  noeuds: [f-operateurs, f-riesz, me-produit-scalaire]
  notions: [norme-operateur, espace-hilbert, projection-orthogonale, produit-scalaire]
  source: "Bordeaux 2015-2016, TD 2, exercice 6 ; Bibmath, exercice 4 ; Sorbonne 3M210, TD 3, exercice 8"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    **Projecteurs.** Soit $H$ un espace de Hilbert réel et $P \in \mathcal{L}(H)$ non nulle telle que $P^{2} = P$ (un *projecteur*). On note $E = \operatorname{Im} P$.

    **1.** Montrer que $E = \ker(\mathrm{id} - P)$, et que $E$ est fermé.

    **2.** Montrer l'équivalence des assertions suivantes : 
    $$(i) \ \lVert P \rVert = 1 ; \qquad (ii) \ P \text{ est la projection orthogonale sur } E ; \qquad (iii) \ P^{*} = P .$$
     Pour montrer que $(i)$ entraîne $(ii)$, on pourra considérer $z = y + \lambda(x - Px)$, où $x \in H$, $y \in E$ et $\lambda \in \mathbb{R}$.

    **3.** Dans $\mathbb{R}^{2}$ euclidien, donner un projecteur de rang $1$ qui n'est pas une projection orthogonale, et calculer sa norme.
  corrige: |
    $\triangleright$ *1.* Si $y = Px \in E$, alors $Py = P^{2}x = Px = y$ ; réciproquement, si $Py = y$, $y \in \operatorname{Im} P$. Donc $E = \ker(\mathrm{id} - P)$, noyau d'une application continue : $E$ est fermé.

    $\triangleright$ *2.* $(ii) \Rightarrow (iii)$ : une projection orthogonale est autoadjointe (cours, exemples de la section sur l'adjoint).

    $(iii) \Rightarrow (ii)$ : si $P^{*} = P$, la proposition 3 du cours donne $\ker P = (\operatorname{Im} P^{*})^{\perp} = E^{\perp}$. Pour $x \in H$, on écrit $x = Px + (x - Px)$, avec $Px \in E$ et $P(x - Px) = Px - P^{2}x = 0$, c'est-à-dire $x - Px \in \ker P = E^{\perp}$. Par la caractérisation de la projection orthogonale (chapitre 2, th. 4), $Px = p_{E}(x)$.

    $(ii) \Rightarrow (i)$ : c'est la proposition 5 du chapitre 2 ($E \neq \{0\}$ puisque $P \neq 0$).

    $(i) \Rightarrow (ii)$ : soit $x \in H$, $y \in E$, $w = x - Px \in \ker P$ et $\lambda \in \mathbb{R}$. Le vecteur $z = y + \lambda w$ vérifie $Pz = Py + \lambda Pw = y$. Comme $\lVert P \rVert = 1$, $\lVert y \rVert^{2} = \lVert Pz \rVert^{2} \leq \lVert z \rVert^{2} = \lVert y \rVert^{2} + 2\lambda\langle y, w \rangle + \lambda^{2}\lVert w \rVert^{2}$, d'où 
    $$2\lambda\langle y, w \rangle + \lambda^{2}\lVert w \rVert^{2} \geq 0 \qquad \text{pour tout } \lambda \in \mathbb{R} .$$
     Ce trinôme, nul en $\lambda = 0$, est positif : sa dérivée en $0$ est nulle, et $\langle y, w \rangle = 0$. Ainsi $x - Px$ est orthogonal à $E$, et comme au point précédent $Px = p_{E}(x)$.

    $\triangleright$ *3.* Prenons $P(x, y) = (x + y, 0)$. Alors $P^{2}(x, y) = P(x + y, 0) = (x + y, 0)$ : c'est un projecteur, d'image l'axe des abscisses et de noyau la droite $x + y = 0$, qui n'est pas orthogonale à l'image. Par Cauchy-Schwarz, $|x + y| \leq \sqrt{2}\sqrt{x^{2} + y^{2}}$, avec égalité pour $(x, y) = (1, 1)$ : $\lVert P \rVert = \sqrt{2} > 1$, conformément à la question 2.

    1.5em

    ![Figure](documents/figures/fff89c1c68b0af24.svg)

    Le projecteur $P$ envoie $v$ sur l'axe parallèlement à la droite $\ker P$ (pointillés orange), et non perpendiculairement (pointillés rouges) : l'image $Pv$ peut être plus longue que $v$, d'où $\lVert P \rVert > 1$.
- id: "l3-hf-04-15"
  feuille: "f-l3-hf-04"
  numero: 15
  partie: "Adjoints"
  etoiles: 2
  types: [Calcul]
  mots_cles: [adjoint, théorème ergodique, projection orthogonale]
  noeuds: [f-operateurs, f-riesz, me-produit-scalaire]
  notions: [norme-operateur, espace-hilbert, projection-orthogonale, produit-scalaire]
  source: "Bordeaux 2012-2013, feuille 3, exercice 4 (théorème ergodique de von Neumann)"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    **Deux exemples de moyennes ergodiques.** Pour $T \in \mathcal{L}(H)$ de norme au plus $1$, on note $M_{n} = \dfrac{1}{n} \mathop{\displaystyle \sum_{k=0}^{n-1}} T^{k}$ et $P$ la projection orthogonale sur $\ker(\mathrm{id} - T)$ ; le théorème 3 du cours affirme que $M_{n} x \to P x$ pour tout $x \in H$.

    **1.** Soit $(X, \mu)$ un espace mesuré, $g : X \to \mathbb{C}$ mesurable avec $|g| \leq 1$, et $T f = g f$ sur $H = L^{2}(X, \mu)$. Déterminer $\ker(\mathrm{id} - T)$ et $P$. Calculer $M_{n} f$, et vérifier directement, par le théorème de convergence dominée, que $M_{n} f \to P f$.

    **2.** Dans le cas où $g$ est une constante $\mathrm{e}^{\mathrm{i}\theta}$, avec $\theta \notin 2\pi\mathbb{Z}$, montrer que la suite $(T^{n} f)$ ne converge pas si $f \neq 0$, alors que $(M_{n} f)$ converge.

    **3.** Soit $S$ le décalage à droite de $\ell^{2}(\mathbb{N})$. Déterminer $\ker(\mathrm{id} - S)$, puis calculer $\lVert M_{n} \varepsilon_{0} \rVert$. Retrouver le théorème 3 pour $x = \varepsilon_{0}$, et préciser la vitesse de convergence.
  corrige: |
    $\triangleright$ *1.* On a $f \in \ker(\mathrm{id} - T)$ si et seulement si $(1 - g) f = 0$ presque partout, c'est-à-dire si $f$ est nulle presque partout sur $\{g \neq 1\}$. En notant $A = \{g = 1\}$, $\ker(\mathrm{id} - T) = \{ f ; \ f = \mathbf{1}_{A} f \}$, et la projection orthogonale sur ce sous-espace est $Pf = \mathbf{1}_{A} f$ (c'est un opérateur de multiplication autoadjoint idempotent, exercice 14).

    Ensuite $M_{n} f = h_{n} f$ avec $h_{n} = \dfrac{1}{n} \mathop{\displaystyle \sum_{k=0}^{n-1}} g^{k}$. Sur $A$, $h_{n} = 1$. Hors de $A$, $g \neq 1$ et $|g| \leq 1$, donc 
    $$|h_{n}| = \Big| \frac{1 - g^{n}}{n(1 - g)} \Big| \leq \frac{2}{n |1 - g|} \longrightarrow 0 .$$
     Ainsi $h_{n} f \to \mathbf{1}_{A} f$ presque partout, avec $|h_{n} f - \mathbf{1}_{A} f|^{2} \leq 4|f|^{2}$ intégrable, puisque $|h_{n}| \leq 1$. Le théorème de convergence dominée donne $\lVert M_{n} f - Pf \rVert_{2} \to 0$, comme l'annonce le théorème 3.

    $\triangleright$ *2.* Si $g = \mathrm{e}^{\mathrm{i}\theta}$ avec $\theta \notin 2\pi\mathbb{Z}$, alors $A = \varnothing$ et $P = 0$ : $M_{n} f \to 0$. En revanche $T^{n} f = \mathrm{e}^{\mathrm{i} n\theta} f$. Si cette suite convergeait, $\lVert T^{n+1}f - T^{n}f \rVert = |\mathrm{e}^{\mathrm{i}\theta} - 1| \, \lVert f \rVert$ tendrait vers $0$, ce qui impose $f = 0$. Les itérés tournent sans converger ; seules leurs moyennes convergent.

    1.5em

    ![Figure](documents/figures/194718942b51b7a6.svg)

    Pour $\theta = 1$, les points bleus représentent $|h_{n}| = \dfrac{|\sin(n\theta/2)|}{n|\sin(\theta/2)|}$ : ils tendent vers $0$ sous l'enveloppe orange, alors que les itérés $\mathrm{e}^{\mathrm{i} n\theta}$ restent de module $1$ (rouge).

    $\triangleright$ *3.* Si $Sx = x$, alors $x_{0} = 0$ et $x_{n} = x_{n-1}$ pour $n \geq 1$, donc $x = 0$ : $\ker(\mathrm{id} - S) = \{0\}$ et $P = 0$. D'autre part $M_{n}\varepsilon_{0} = \dfrac{1}{n}(\varepsilon_{0} + \cdots + \varepsilon_{n-1})$, et par Pythagore 
    $$\boxed{\lVert M_{n}\varepsilon_{0} \rVert = \frac{\sqrt{n}}{n} = \frac{1}{\sqrt{n}} \longrightarrow 0 = P\varepsilon_{0} .}$$
     La convergence a lieu, mais lentement, en $1/\sqrt{n}$. Le théorème 3 ne donne aucune vitesse, et l'on peut construire des exemples où la convergence est arbitrairement lente.
- id: "l3-hf-04-16"
  feuille: "f-l3-hf-04"
  numero: 16
  partie: "Opérateurs de Hilbert-Schmidt, trace"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [opérateurs de Hilbert-Schmidt, projection orthogonale]
  noeuds: [f-operateurs, f-bases-hilbertiennes, me-produit-scalaire]
  notions: [norme-operateur, base-hilbertienne, projection-orthogonale, produit-scalaire]
  source: "Bordeaux 2015-2016, TD 2, exercice 8 ; ENS, feuille 7, exercice 4 ; Bibmath, exercice 14"
  page_enonce: 4
  page_corrige: 9
  enonce: |
    **Opérateurs de Hilbert-Schmidt.** Soit $H$ un espace de Hilbert séparable de dimension infinie, et $(e_{n})$, $(f_{p})$ deux bases hilbertiennes de $H$. Pour $T \in \mathcal{L}(H)$, on note 
    $$\lVert T \rVert_{2} = \Big( \sum_{n \geq 0} \lVert Te_{n} \rVert^{2} \Big)^{1/2} \in [0, +\infty] .$$

    **1.** Montrer que $\mathop{\displaystyle \sum_{n}} \lVert Te_{n} \rVert^{2} = \mathop{\displaystyle \sum_{p}} \lVert T^{*}f_{p} \rVert^{2}$ dans $[0, +\infty]$. En déduire que $\lVert T \rVert_{2}$ ne dépend pas de la base hilbertienne choisie, et que $\lVert T^{*} \rVert_{2} = \lVert T \rVert_{2}$.

    On dit que $T$ est *de Hilbert-Schmidt* si $\lVert T \rVert_{2} < +\infty$, et l'on note $\mathrm{HS}(H)$ l'ensemble de ces opérateurs.

    **2.** Montrer que $\lVert T \rVert \leq \lVert T \rVert_{2}$, et que l'identité n'est pas de Hilbert-Schmidt.

    **3.** Montrer que si $A \in \mathcal{L}(H)$ et $T \in \mathrm{HS}(H)$, alors $AT$ et $TA$ sont de Hilbert-Schmidt.

    **4.** Montrer que $\mathcal{L}(H)$ est complet pour la norme d'opérateur.

    **5.** Montrer que $\mathrm{HS}(H)$, muni de $\langle S, T \rangle_{2} = \mathop{\displaystyle \sum_{n}} \langle Se_{n}, Te_{n} \rangle$, est un espace de Hilbert.

    **6.** Soit $P_{n}$ la projection orthogonale sur $\mathrm{Vect}(e_{0}, \dots, e_{n})$. Montrer que $\lVert T - TP_{n} \rVert_{2} \to 0$ pour $T \in \mathrm{HS}(H)$, et en déduire que les opérateurs de rang fini sont denses dans $\mathrm{HS}(H)$.

    On prend maintenant $H = L^{2}([0, 1], \mathbb{R})$. Pour $K \in L^{2}([0, 1]^{2})$, on pose $A_{K} f(x) = \mathop{\displaystyle \int_{0}^{1}} K(x, y) f(y) \, \mathrm{d} y$. On admet que $A_{K}$ est un opérateur continu de $H$, et que si $(e_{i})$ est une base hilbertienne de $H$, les fonctions $(x, y) \mapsto e_{i}(x) e_{j}(y)$ forment une base hilbertienne de $L^{2}([0, 1]^{2})$.

    **7.** Montrer que $\lVert A_{K} \rVert_{2} = \lVert K \rVert_{L^{2}([0, 1]^{2})}$.

    **8.** Réciproquement, montrer que tout $A \in \mathrm{HS}(H)$ est de la forme $A_{K}$, avec $K = \mathop{\displaystyle \sum_{i, j}} \langle Ae_{j}, e_{i} \rangle \, e_{i} \otimes e_{j}$, où $(e_{i} \otimes e_{j})(x, y) = e_{i}(x) e_{j}(y)$.
  corrige: |
    $\triangleright$ *1.* Par Parseval dans la base $(f_{p})$, $\lVert Te_{n} \rVert^{2} = \mathop{\displaystyle \sum_{p}} |\langle Te_{n}, f_{p} \rangle|^{2} = \mathop{\displaystyle \sum_{p}} |\langle e_{n}, T^{*}f_{p} \rangle|^{2}$. On somme sur $n$ et l'on permute les sommes de termes positifs, puis on utilise Parseval dans la base $(e_{n})$ : 
    $$\sum_{n} \lVert Te_{n} \rVert^{2} = \sum_{p} \sum_{n} |\langle T^{*}f_{p}, e_{n} \rangle|^{2} = \sum_{p} \lVert T^{*}f_{p} \rVert^{2} .$$
     Si $(e'_{n})$ est une autre base, le même calcul donne $\mathop{\displaystyle \sum} \lVert Te'_{n} \rVert^{2} = \mathop{\displaystyle \sum_{p}} \lVert T^{*}f_{p} \rVert^{2}$, d'où l'indépendance. Avec $(f_{p}) = (e_{n})$ et en échangeant les rôles de $T$ et $T^{*}$, on obtient $\lVert T^{*} \rVert_{2} = \lVert T \rVert_{2}$.

    $\triangleright$ *2.* Pour $x = \mathop{\displaystyle \sum} x_{n} e_{n}$, la continuité de $T$ donne $Tx = \mathop{\displaystyle \sum} x_{n} Te_{n}$, d'où, par Cauchy-Schwarz, 
    $$\lVert Tx \rVert \leq \sum_{n} |x_{n}| \lVert Te_{n} \rVert \leq \Big( \sum |x_{n}|^{2} \Big)^{1/2} \Big( \sum \lVert Te_{n} \rVert^{2} \Big)^{1/2} = \lVert x \rVert \lVert T \rVert_{2} .$$
     Donc $\lVert T \rVert \leq \lVert T \rVert_{2}$. Pour l'identité, $\mathop{\displaystyle \sum} \lVert e_{n} \rVert^{2} = +\infty$ : elle n'est pas de Hilbert-Schmidt, et $\mathrm{HS}(H) \neq \mathcal{L}(H)$.

    $\triangleright$ *3.* On a $\lVert ATe_{n} \rVert \leq \lVert A \rVert\lVert Te_{n} \rVert$, d'où $\lVert AT \rVert_{2} \leq \lVert A \rVert\lVert T \rVert_{2}$. Pour $TA$, on passe aux adjoints : $\lVert TA \rVert_{2} = \lVert A^{*}T^{*} \rVert_{2} \leq \lVert A^{*} \rVert\lVert T^{*} \rVert_{2} = \lVert A \rVert\lVert T \rVert_{2}$.

    $\triangleright$ *4.* Soit $(T_{k})$ une suite de Cauchy de $\mathcal{L}(H)$. Pour tout $x$, $\lVert T_{k}x - T_{m}x \rVert \leq \lVert T_{k} - T_{m} \rVert\lVert x \rVert$ : la suite $(T_{k}x)$ est de Cauchy dans $H$ complet, et l'on note $Tx$ sa limite. L'application $T$ est linéaire. Soit $\varepsilon > 0$ et $K$ tel que $\lVert T_{k} - T_{m} \rVert \leq \varepsilon$ pour $k, m \geq K$ ; en faisant tendre $m$ vers l'infini, $\lVert T_{k}x - Tx \rVert \leq \varepsilon\lVert x \rVert$. Donc $T = T_{k} - (T_{k} - T)$ est continue, et $\lVert T_{k} - T \rVert \leq \varepsilon$ pour $k \geq K$ : $T_{k} \to T$.

    $\triangleright$ *5.* Par Cauchy-Schwarz dans $\ell^{2}$, $\mathop{\displaystyle \sum} \lVert Se_{n} \rVert\lVert Te_{n} \rVert \leq \lVert S \rVert_{2}\lVert T \rVert_{2}$ : la série définissant $\langle S, T \rangle_{2}$ converge absolument, et l'inégalité triangulaire de $\ell^{2}$ donne $\lVert S + T \rVert_{2} \leq \lVert S \rVert_{2} + \lVert T \rVert_{2}$, de sorte que $\mathrm{HS}(H)$ est un sous-espace. La forme $\langle \cdot, \cdot \rangle_{2}$ est sesquilinéaire hermitienne, et $\langle T, T \rangle_{2} = \lVert T \rVert_{2}^{2} = 0$ entraîne $Te_{n} = 0$ pour tout $n$, donc $T = 0$.

    Complétude : soit $(T_{k})$ de Cauchy pour $\lVert \cdot \rVert_{2}$. Par la question 2, elle est de Cauchy dans $\mathcal{L}(H)$, donc converge vers un $T$ pour la norme d'opérateur (question 4). Soit $\varepsilon > 0$ et $K$ tel que $\lVert T_{k} - T_{m} \rVert_{2} \leq \varepsilon$ pour $k, m \geq K$. Pour $N$ fixé, 
    $$\sum_{n \leq N} \lVert (T_{k} - T_{m})e_{n} \rVert^{2} \leq \varepsilon^{2} ;$$
     on fait tendre $m$ vers l'infini, puis $N$ : $\lVert T_{k} - T \rVert_{2} \leq \varepsilon$. Donc $T \in \mathrm{HS}(H)$ et $T_{k} \to T$ pour $\lVert \cdot \rVert_{2}$ : $\mathrm{HS}(H)$ est un espace de Hilbert.

    $\triangleright$ *6.* On a $(T - TP_{n})e_{k} = 0$ pour $k \leq n$ et $Te_{k}$ pour $k > n$, d'où $\lVert T - TP_{n} \rVert_{2}^{2} = \mathop{\displaystyle \sum_{k > n}} \lVert Te_{k} \rVert^{2}$, reste d'une série convergente. L'opérateur $TP_{n}$ est de rang au plus $n + 1$, et l'on conclut : 
    $$\boxed{\text{les opérateurs de rang fini sont denses dans } \mathrm{HS}(H) .}$$

    $\triangleright$ *7.* Pour tous $i, j$, Fubini donne 
    $$\langle A_{K}e_{j}, e_{i} \rangle = \int_{0}^{1} \int_{0}^{1} K(x, y) e_{j}(y) e_{i}(x) \, \mathrm{d} y \, \mathrm{d} x = \langle K, e_{i} \otimes e_{j} \rangle .$$
     Par Parseval dans $H$ puis dans $L^{2}([0, 1]^{2})$, pour la base $(e_{i} \otimes e_{j})$, 
    $$\lVert A_{K} \rVert_{2}^{2} = \sum_{j} \lVert A_{K}e_{j} \rVert^{2} = \sum_{j} \sum_{i} \langle A_{K}e_{j}, e_{i} \rangle^{2} = \sum_{i, j} \langle K, e_{i} \otimes e_{j} \rangle^{2} = \lVert K \rVert^{2} .$$

    $\triangleright$ *8.* Si $A \in \mathrm{HS}(H)$, $\mathop{\displaystyle \sum_{i, j}} \langle Ae_{j}, e_{i} \rangle^{2} = \mathop{\displaystyle \sum_{j}} \lVert Ae_{j} \rVert^{2} < +\infty$ : la série définissant $K$ converge dans $L^{2}([0, 1]^{2})$ (chapitre 3, th. 2), et $\langle K, e_{i} \otimes e_{j} \rangle = \langle Ae_{j}, e_{i} \rangle$. Par la question 7, $\langle A_{K}e_{j}, e_{i} \rangle = \langle Ae_{j}, e_{i} \rangle$ pour tous $i$, $j$, donc $A_{K}e_{j} = Ae_{j}$ pour tout $j$, et $A_{K} = A$ par densité. L'application $K \mapsto A_{K}$ est donc une isométrie de $L^{2}([0, 1]^{2})$ sur $\mathrm{HS}(H)$.
