- id: "l3-hf-04-01"
  feuille: "f-l3-hf-04"
  numero: 1
  partie: "Formes linéaires, théorème de Riesz"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [théorème de Riesz]
  noeuds: [f-riesz]
  notions: [forme-lineaire, dual-topologique, norme-operateur]
  source: "Mathovore, exercices L3, exercice 8 ; Sorbonne 3M210, TD 2, exercice 2 ; Mathovore, Contrôle L3, exercice 1 (c)"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    On se place dans $H = L^{2}([0, 1], \mathbb{R})$.

    **1.** Montrer que $\varphi_{1} : f \mapsto \mathop{\displaystyle \int_{0}^{1}} t f(t) \, \mathrm{d} t$ et $\varphi_{2} : f \mapsto \mathop{\displaystyle \int_{0}^{1/2}} f - \mathop{\displaystyle \int_{1/2}^{1}} f$ sont des formes linéaires continues. Déterminer les fonctions $g_{1}$, $g_{2}$ qui les représentent au sens du théorème de Riesz, et en déduire $\lVert \varphi_{1} \rVert$ et $\lVert \varphi_{2} \rVert$.

    **2.** L'application $f \mapsto f(0)$ a-t-elle un sens sur $H$ ?

    **3.** On munit $E = \mathcal{C}([0, 1], \mathbb{R})$ de la norme $\lVert \cdot \rVert_{2}$. Montrer, à l'aide de fonctions « chapeaux » $f_{n}$ affines par morceaux, nulles hors de $[\dfrac{1}{2} - \dfrac{1}{n}, \dfrac{1}{2} + \dfrac{1}{n}]$ et égales à $1$ en $\dfrac{1}{2}$, que $\delta : f \mapsto f(1/2)$ est une forme linéaire non continue sur $E$.
  corrige: |
    $\triangleright$ *1.* On a $\varphi_{1}(f) = \langle f, g_{1} \rangle$ avec $g_{1}(t) = t$, et $\varphi_{2}(f) = \langle f, g_{2} \rangle$ avec $g_{2} = \mathbf{1}_{[0, 1/2]} - \mathbf{1}_{]1/2, 1]}$. Ce sont donc des formes linéaires continues, et le théorème de Riesz (cours, th. 1) donne $\lVert \varphi_{i} \rVert = \lVert g_{i} \rVert$ : 
    $$\boxed{\lVert \varphi_{1} \rVert = \Big( \int_{0}^{1} t^{2} \, \mathrm{d} t \Big)^{1/2} = \frac{1}{\sqrt{3}} , \qquad \lVert \varphi_{2} \rVert = \Big( \int_{0}^{1} 1 \, \mathrm{d} t \Big)^{1/2} = 1 .}$$
     La borne est atteinte en $f = g_{i}$, par le cas d'égalité de Cauchy-Schwarz.

    $\triangleright$ *2.* Non : un élément de $H$ est une classe de fonctions égales presque partout, et modifier une fonction au point $0$ ne change pas sa classe. La « valeur en $0$ » n'est pas définie sur $H$.

    $\triangleright$ *3.* Pour $n \geq 2$, soit $f_{n}$ la fonction chapeau de l'énoncé, de sommet $(1/2, 1)$ et de demi-largeur $1/n$. Par symétrie, 
    $$\lVert f_{n} \rVert_{2}^{2} = 2 \int_{0}^{1/n} (1 - nu)^{2} \, \mathrm{d} u = \frac{2}{3n} \longrightarrow 0 , \qquad \text{alors que} \qquad \delta(f_{n}) = 1 .$$
     La forme $\delta$ n'est donc pas bornée sur la boule unité, et $\delta$ n'est pas continue pour $\lVert \cdot \rVert_{2}$ (cours, prop. 1). Elle ne peut d'ailleurs se prolonger à $L^{2}$, d'après la question 2.

    1.5em

    ![Figure](documents/figures/80767ddc81a8fa42.svg)

    Les chapeaux valent tous $1$ en $\dfrac{1}{2}$, mais leur norme quadratique $\sqrt{2/(3n)}$ tend vers $0$ : pour la norme $L^{2}$, une fonction peut être petite tout en prenant une grande valeur en un point.
- id: "l3-hf-04-02"
  feuille: "f-l3-hf-04"
  numero: 2
  partie: "Formes linéaires, théorème de Riesz"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [théorème de Riesz]
  noeuds: [f-riesz]
  notions: [forme-lineaire, dual-topologique, norme-operateur]
  source: "Mathovore, exercices L3, exercice 9 ; Bibmath, Espaces de Hilbert, exercice 13"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **Formes linéaires sur $\ell^{2}$ et sur $c_{00}$.** Les suites sont indexées par $n \geq 1$.

    **1.** Montrer que $\varphi : u \mapsto \mathop{\displaystyle \sum_{n \geq 1}} \dfrac{u_{n}}{n}$ est une forme linéaire continue sur $\ell^{2}$, et calculer sa norme.

    **2.** Montrer que toute forme linéaire continue $\psi$ sur $\ell^{2}$ s'écrit $\psi(u) = \mathop{\displaystyle \sum_{n \geq 1}} a_{n} u_{n}$ pour une unique suite $(a_{n}) \in \ell^{2}$, que l'on exprimera à l'aide des $\psi(\varepsilon_{n})$.

    **3.** Montrer que $\psi : u \mapsto \mathop{\displaystyle \sum_{n \geq 1}} u_{n}$ est une forme linéaire sur $c_{00}$, non continue pour la norme de $\ell^{2}$. On pourra considérer $u^{(N)} = \dfrac{1}{N}(1, \dots, 1, 0, 0, \dots)$, avec $N$ termes non nuls.

    **4.** Montrer que $\varphi$, restreinte à $c_{00}$, est continue mais qu'il n'existe aucun $a \in c_{00}$ tel que $\varphi(u) = \langle u, a \rangle$ pour tout $u \in c_{00}$. Que peut-on en conclure sur $c_{00}$ ?
  corrige: |
    $\triangleright$ *1.* La suite $a = (1/n)_{n \geq 1}$ est dans $\ell^{2}$, et $\varphi(u) = \mathop{\displaystyle \sum} u_{n} \overline{a_{n}} = \langle u, a \rangle$, la série convergeant absolument par Cauchy-Schwarz. Donc $\varphi$ est continue, et 
    $$\boxed{\lVert \varphi \rVert = \lVert a \rVert_{2} = \Big( \sum_{n \geq 1} \frac{1}{n^{2}} \Big)^{1/2} = \frac{\pi}{\sqrt{6}} .}$$
     La valeur de $\mathop{\displaystyle \sum} 1/n^{2}$ sera établie au chapitre 5.

    $\triangleright$ *2.* D'après le théorème de Riesz, il existe un unique $b \in \ell^{2}$ tel que $\psi(u) = \langle u, b \rangle = \mathop{\displaystyle \sum_{n}} u_{n} \overline{b_{n}}$. Avec $a_{n} = \overline{b_{n}}$, on obtient $\psi(u) = \mathop{\displaystyle \sum} a_{n} u_{n}$, et $a_{n} = \psi(\varepsilon_{n})$ en prenant $u = \varepsilon_{n}$. L'unicité de $a$ découle de cette formule.

    $\triangleright$ *3.* La somme est finie pour $u \in c_{00}$, et $\psi$ est linéaire. Pour $u^{(N)}$, on a $\psi(u^{(N)}) = 1$ et $\lVert u^{(N)} \rVert_{2} = \sqrt{N \cdot \dfrac{1}{N^{2}}} = \dfrac{1}{\sqrt{N}} \to 0$ : $\psi$ n'est pas continue en $0$. En termes de la question 2, $\psi$ « serait représentée » par la suite constante $(1, 1, \dots)$, qui n'est pas dans $\ell^{2}$.

    $\triangleright$ *4.* La restriction d'une forme continue est continue. S'il existait $a \in c_{00}$ avec $\varphi(u) = \langle u, a \rangle$, on aurait $\overline{a_{n}} = \varphi(\varepsilon_{n}) = \dfrac{1}{n} \neq 0$ pour tout $n$, ce qui contredit $a \in c_{00}$. Le théorème de Riesz est donc en défaut sur $c_{00}$ : $c_{00}$ n'est pas un espace de Hilbert, ce que l'on savait déjà (il n'est pas fermé dans $\ell^{2}$). Le représentant naturel $(1/n)$ existe, mais dans le complété $\ell^{2}$ seulement.
- id: "l3-hf-04-03"
  feuille: "f-l3-hf-04"
  numero: 3
  partie: "Formes linéaires, théorème de Riesz"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [théorème de Riesz]
  noeuds: [f-riesz]
  notions: [forme-lineaire, dual-topologique, norme-operateur]
  source: "Bordeaux, Espaces de Hilbert et analyse de Fourier 2012-2013, feuille 3, exercice 2"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **Noyau reproduisant.** Soit $X$ un ensemble et $H$ un espace de Hilbert dont les éléments sont des fonctions $X \to \mathbb{C}$ (avec les opérations usuelles). Une fonction $K : X \times X \to \mathbb{C}$ est un *noyau reproduisant* de $H$ si, pour tout $y \in X$, la fonction $K_{y} : x \mapsto K(x, y)$ appartient à $H$ et vérifie $f(y) = \langle f, K_{y} \rangle$ pour toute $f \in H$.

    **1.** Vérifier que $H$ admet au plus un noyau reproduisant.

    **2.** Montrer que $H$ admet un noyau reproduisant si et seulement si, pour tout $y \in X$, il existe $C_{y} \geq 0$ tel que $|f(y)| \leq C_{y} \lVert f \rVert$ pour toute $f \in H$.

    **3.** Soit $K$ un noyau reproduisant de $H$ et $B$ la boule unité fermée de $H$. Montrer que, pour tout $x \in X$, 
    $$K(x, x) = \sup_{f \in B} |f(x)|^{2} .$$

    **4.** On suppose $H$ de dimension finie $n$, de base orthonormée $(e_{1}, \dots, e_{n})$. Expliciter son noyau reproduisant.

    **5.** Exemple : $X = [0, 1]$ et $H$ est l'espace des fonctions affines, muni de $\langle f, g \rangle = \mathop{\displaystyle \int_{0}^{1}} f \overline{g}$. Calculer $K$, puis $\mathop{\displaystyle \sup} \{ |f(0)| ; \ f \in H, \ \lVert f \rVert \leq 1 \}$.
  corrige: |
    $\triangleright$ *1.* Si $K$ et $L$ sont deux noyaux reproduisants, alors $\langle f, K_{y} - L_{y} \rangle = f(y) - f(y) = 0$ pour toute $f \in H$ ; avec $f = K_{y} - L_{y}$, on obtient $K_{y} = L_{y}$ pour tout $y$, donc $K = L$.

    $\triangleright$ *2.* Si $K$ existe, Cauchy-Schwarz donne $|f(y)| = |\langle f, K_{y} \rangle| \leq \lVert K_{y} \rVert \lVert f \rVert$ : on prend $C_{y} = \lVert K_{y} \rVert$.

    Réciproquement, si l'inégalité a lieu, l'évaluation $\delta_{y} : f \mapsto f(y)$ est une forme linéaire continue sur $H$. Le théorème de Riesz fournit $k_{y} \in H$ tel que $f(y) = \langle f, k_{y} \rangle$ pour toute $f$, et l'on pose $K(x, y) = k_{y}(x)$ : c'est un noyau reproduisant.

    $\triangleright$ *3.* D'après la question 2, $\mathop{\displaystyle \sup_{f \in B}} |f(x)| = \lVert \delta_{x} \rVert = \lVert K_{x} \rVert$ (théorème de Riesz). Et, en appliquant la propriété reproduisante à $f = K_{x}$, 
    $$\lVert K_{x} \rVert^{2} = \langle K_{x}, K_{x} \rangle = K_{x}(x) = K(x, x) .$$
     D'où $K(x, x) = \mathop{\displaystyle \sup_{f \in B}} |f(x)|^{2}$. En particulier $K(x, x) \geq 0$.

    $\triangleright$ *4.* Pour $f \in H$, $f = \mathop{\displaystyle \sum_{i}} \langle f, e_{i} \rangle e_{i}$, d'où $f(y) = \mathop{\displaystyle \sum_{i}} \langle f, e_{i} \rangle e_{i}(y) = \langle f, \mathop{\displaystyle \sum_{i}} \overline{e_{i}(y)} e_{i} \rangle$. Donc 
    $$\boxed{K(x, y) = \sum_{i=1}^{n} e_{i}(x) \overline{e_{i}(y)} .}$$

    $\triangleright$ *5.* Une base orthonormée de $H$ est $e_{1} = 1$, $e_{2}(x) = \sqrt{3}(2x - 1)$ (feuille 1, exercice 7). D'où 
    $$\boxed{K(x, y) = 1 + 3(2x - 1)(2y - 1) , \qquad \sup_{\lVert f \rVert \leq 1} |f(0)| = \sqrt{K(0, 0)} = 2 ,}$$
     la borne étant atteinte pour $f = K_{0} / \lVert K_{0} \rVert = \dfrac{1}{2}(4 - 6x)$, soit $f(x) = 2 - 3x$, qui vérifie bien $\mathop{\displaystyle \int_{0}^{1}} (2 - 3x)^{2} \, \mathrm{d} x = 1$.

    1.5em

    ![Figure](documents/figures/e60f113bb8b2bf31.svg)

    La fonction $x \mapsto K(x, x)$ mesure la plus grande valeur (au carré) qu'une fonction affine de norme $1$ peut prendre en $x$ : elle vaut $1$ au milieu, où seule la constante compte, et $4$ aux extrémités.
