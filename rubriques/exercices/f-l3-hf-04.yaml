  source: "Sorbonne 3M210, TD 1, exercice 21 (espace S1 et dual de L(l2^n))"
  page_enonce: 5
  page_corrige: 11
  enonce: |
    **Norme trace en dimension finie.** On munit $\mathbb{R}^{n}$ du produit scalaire usuel et de la norme euclidienne $|\cdot|$, et l'on note $\lVert \cdot \rVert_{op}$ la norme d'opérateur sur $\mathcal{L}(\mathbb{R}^{n})$.

    **1.** Rappeler pourquoi, si $\varphi \in \mathcal{L}(\mathbb{R}^{n})$ est autoadjoint positif, il existe un unique $\psi$ autoadjoint positif tel que $\psi \circ \psi = \varphi$ ; on le note $\sqrt{\varphi}$. (On pourra admettre l'unicité.)

    **2.** Montrer que, si $f \in \mathcal{L}(\mathbb{R}^{n})$, $f^{*}f$ est autoadjoint positif.

    On note $0 \leq s_{1}(f) \leq \cdots \leq s_{n}(f)$ les valeurs propres de $\sqrt{f^{*}f}$, répétées avec multiplicité, et l'on pose $\lVert f \rVert_{1} = \mathop{\displaystyle \sum_{i=1}^{n}} s_{i}(f)$.

    **3.** Montrer que $\lVert f \rVert_{op} = s_{n}(f)$, et que $\lVert f \rVert_{1} = \operatorname{Tr}\sqrt{f^{*}f}$.

    **4.** *(Décomposition polaire.)* Montrer qu'il existe $u \in \mathcal{L}(\mathbb{R}^{n})$ orthogonal tel que $f = u\sqrt{f^{*}f}$. On pourra commencer par remarquer que $|\sqrt{f^{*}f}\,x| = |f x|$.

    **5.** Montrer que $\operatorname{Tr}(g^{*}f) \leq \lVert f \rVert_{1} \lVert g \rVert_{op}$ pour tous $f, g$, avec égalité pour un $g$ bien choisi.

    **6.** En déduire que $\lVert f \rVert_{1} = \mathop{\displaystyle \sup} \{ \operatorname{Tr}(g^{*}f) ; \ \lVert g \rVert_{op} \leq 1 \}$, puis que $\lVert \cdot \rVert_{1}$ est une norme sur $\mathcal{L}(\mathbb{R}^{n})$.

    **7.** Montrer que l'application $f \mapsto \big(g \mapsto \operatorname{Tr}(g^{*}f)\big)$ est une isométrie de $(\mathcal{L}(\mathbb{R}^{n}), \lVert \cdot \rVert_{1})$ sur le dual de $(\mathcal{L}(\mathbb{R}^{n}), \lVert \cdot \rVert_{op})$.
  corrige: |
    $\triangleright$ *1.* D'après le théorème spectral, $\varphi$ se diagonalise dans une base orthonormée $(v_{i})$, avec des valeurs propres $\lambda_{i} \geq 0$ (car $\lambda_{i} = \langle \varphi v_{i}, v_{i} \rangle \geq 0$). L'endomorphisme $\psi$ défini par $\psi v_{i} = \sqrt{\lambda_{i}}\, v_{i}$ est autoadjoint positif et vérifie $\psi^{2} = \varphi$.

    $\triangleright$ *2.* $(f^{*}f)^{*} = f^{*}f^{**} = f^{*}f$, et $\langle f^{*}fx, x \rangle = |fx|^{2} \geq 0$.

    $\triangleright$ *3.* Notons $|f| = \sqrt{f^{*}f}$ et $(v_{i})$ une base orthonormée de vecteurs propres, $|f|v_{i} = s_{i}v_{i}$, de sorte que $f^{*}fv_{i} = s_{i}^{2}v_{i}$. Pour $x = \mathop{\displaystyle \sum} x_{i}v_{i}$, $|fx|^{2} = \langle f^{*}fx, x \rangle = \mathop{\displaystyle \sum} s_{i}^{2}x_{i}^{2} \leq s_{n}^{2}|x|^{2}$, avec égalité pour $x = v_{n}$ : $\lVert f \rVert_{op} = s_{n}(f)$. La trace de $|f|$ est la somme de ses valeurs propres : $\lVert f \rVert_{1} = \operatorname{Tr}|f|$.

    $\triangleright$ *4.* Pour tout $x$, $\big||f|x\big|^{2} = \langle |f|^{2}x, x \rangle = \langle f^{*}fx, x \rangle = |fx|^{2}$. En particulier $\ker |f| = \ker f$, et les sous-espaces $V = \operatorname{Im} |f|$ et $W = \operatorname{Im} f$ ont la même dimension.

    On définit $u_{0} : V \to W$ par $u_{0}(|f|x) = fx$ : c'est bien défini, car $|f|x = |f|x'$ entraîne $|f(x - x')| = \big||f|(x - x')\big| = 0$ ; c'est linéaire et isométrique, donc bijectif de $V$ sur $W$. Les orthogonaux $V^{\perp}$ et $W^{\perp}$ ont aussi la même dimension ; on choisit une isométrie $u_{1} : V^{\perp} \to W^{\perp}$ (en envoyant une base orthonormée sur une base orthonormée). L'application $u = u_{0} \oplus u_{1}$ est orthogonale, et $u|f| = f$ par construction.

    $\triangleright$ *5.* Avec $f = u|f|$ et la base $(v_{i})$ de la question 3, 
    $$\operatorname{Tr}(g^{*}f) = \sum_{i} \langle g^{*}u|f|v_{i}, v_{i} \rangle = \sum_{i} s_{i} \langle uv_{i}, gv_{i} \rangle \leq \sum_{i} s_{i} |uv_{i}| \, |gv_{i}| \leq \lVert g \rVert_{op} \sum_{i} s_{i} = \lVert f \rVert_{1}\lVert g \rVert_{op} ,$$
     car $|uv_{i}| = 1$. Pour $g = u$, on a $\langle uv_{i}, uv_{i} \rangle = 1$ et $\lVert u \rVert_{op} = 1$ : l'égalité a lieu.

    $\triangleright$ *6.* La question 5 donne immédiatement $\lVert f \rVert_{1} = \mathop{\displaystyle \sup} \{ \operatorname{Tr}(g^{*}f) ; \ \lVert g \rVert_{op} \leq 1 \}$. Comme $f \mapsto \operatorname{Tr}(g^{*}f)$ est linéaire, cette borne supérieure est sous-additive : $\lVert f + f' \rVert_{1} \leq \lVert f \rVert_{1} + \lVert f' \rVert_{1}$. De plus $s_{i}(\lambda f) = |\lambda| s_{i}(f)$, et $\lVert f \rVert_{1} = 0$ impose $s_{n}(f) = \lVert f \rVert_{op} = 0$, donc $f = 0$. C'est une norme.

    $\triangleright$ *7.* Notons $\ell_{f}(g) = \operatorname{Tr}(g^{*}f)$. L'application $f \mapsto \ell_{f}$ est linéaire et injective, car, si $f \neq 0$ et si $(e_{i})$ est la base canonique, 
    $$\ell_{f}(f) = \operatorname{Tr}(f^{*}f) = \sum_{i} |fe_{i}|^{2} > 0 .$$
     Les deux espaces ont la même dimension $n^{2}$ : elle est bijective. Enfin, en remplaçant $g$ par $-g$, 
    $$\lVert \ell_{f} \rVert = \sup_{\lVert g \rVert_{op} \leq 1} |\operatorname{Tr}(g^{*}f)| = \sup_{\lVert g \rVert_{op} \leq 1} \operatorname{Tr}(g^{*}f) = \lVert f \rVert_{1} .$$
     Le dual de $(\mathcal{L}(\mathbb{R}^{n}), \lVert \cdot \rVert_{op})$ s'identifie isométriquement à $(\mathcal{L}(\mathbb{R}^{n}), \lVert \cdot \rVert_{1})$. En dimension infinie, la même dualité relie les opérateurs à trace de l'exercice 17 et les opérateurs bornés.

