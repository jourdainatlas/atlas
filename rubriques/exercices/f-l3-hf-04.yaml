  noeuds: [f-operateurs, f-riesz]
  notions: [norme-operateur, espace-hilbert]
  source: "Bordeaux 2015-2016, TD 2, exercice 4"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $H$ un espace de Hilbert complexe et $T \in \mathcal{L}(H)$ de rang $1$.

    **1.** Montrer qu'il existe $(y, z) \in H^{2}$ tel que $Tx = \langle x, y \rangle \, z$ pour tout $x \in H$.

    **2.** Déterminer l'adjoint de $T$. À quelle condition $T$ est-il autoadjoint ?
  corrige: |
    $\triangleright$ *1.* L'image de $T$ est une droite $\mathbb{C} z$, avec $z \neq 0$. Pour tout $x$, il existe donc un unique scalaire $\lambda(x)$ tel que $Tx = \lambda(x) z$ ; on a $\lambda(x) = \langle Tx, z \rangle / \lVert z \rVert^{2}$, qui est linéaire et continu en $x$. Par le théorème de Riesz, il existe $y \in H$ tel que $\lambda(x) = \langle x, y \rangle$, d'où $Tx = \langle x, y \rangle z$.

    $\triangleright$ *2.* Pour $x, w \in H$, 
    $$\langle Tx, w \rangle = \langle x, y \rangle \langle z, w \rangle = \langle x, \overline{\langle z, w \rangle}\, y \rangle = \langle x, \langle w, z \rangle y \rangle ,$$
     donc $T^{*} w = \langle w, z \rangle \, y$ : l'adjoint échange les rôles de $y$ et de $z$. Ainsi $T$ est autoadjoint si et seulement si $\langle x, y \rangle z = \langle x, z \rangle y$ pour tout $x$ ; en prenant $x = y$ puis $x = z$, on voit que c'est le cas si et seulement si $z = \lambda y$ avec $\lambda$ réel. Par exemple, si $\lVert y \rVert = 1$, $x \mapsto \langle x, y \rangle y$ est la projection orthogonale sur $\mathbb{C} y$.
- id: "l3-hf-04-07"
  feuille: "f-l3-hf-04"
  numero: 7
  partie: "Adjoints"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [adjoint]
  noeuds: [f-operateurs, f-riesz]
  notions: [norme-operateur, espace-hilbert]
  source: "Bordeaux 2015-2016, devoir surveillé, exercice 1 ; TD 2, exercice 7 (1) ; Bibmath, exercice 11 (1)"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **Opérateurs diagonaux.** Soit $H$ un espace de Hilbert complexe, $(e_{n})_{n \in \mathbb{N}}$ une base hilbertienne de $H$ et $(c_{n})_{n \geq 0}$ une suite complexe bornée, de borne $M = \mathop{\displaystyle \sup_{n}} |c_{n}|$.

    **1.** Soit $x \in H$. Montrer que la suite $\Big( \mathop{\displaystyle \sum_{n=0}^{p}} c_{n} \langle x, e_{n} \rangle e_{n} \Big)_{p \geq 0}$ converge dans $H$ ; on note $Tx$ sa limite.

    **2.** Vérifier que $T$ est linéaire continue, et que $\lVert T \rVert = M$.

    **3.** Prouver que $T$ est l'unique application linéaire continue telle que $Te_{n} = c_{n} e_{n}$ pour tout $n$.

    **4.** Calculer $T^{*} e_{n}$ pour tout $n$, puis comparer $TT^{*}$ et $T^{*}T$.

    **5.** Que donnent ces résultats pour l'opérateur $(x_{n}) \mapsto (\alpha_{n} x_{n})$ de $\ell^{2}(\mathbb{N}, \mathbb{C})$, avec $(\alpha_{n})$ bornée ?
  corrige: |
    $\triangleright$ *1.* La série $\mathop{\displaystyle \sum_{n}} |c_{n} \langle x, e_{n} \rangle|^{2}$ converge, puisqu'elle est majorée par $M^{2} \mathop{\displaystyle \sum_{n}} |\langle x, e_{n} \rangle|^{2} = M^{2} \lVert x \rVert^{2}$ (Parseval). Le théorème des séries orthogonales (chapitre 3, th. 2) assure la convergence de $\mathop{\displaystyle \sum} c_{n} \langle x, e_{n} \rangle e_{n}$.

    $\triangleright$ *2.* La linéarité vient de celle des sommes partielles et des limites. Par Parseval, 
    $$\lVert Tx \rVert^{2} = \sum_{n} |c_{n}|^{2} |\langle x, e_{n} \rangle|^{2} \leq M^{2} \lVert x \rVert^{2} ,$$
     donc $\lVert T \rVert \leq M$. Comme $\lVert Te_{n} \rVert = |c_{n}|$, on a aussi $\lVert T \rVert \geq \mathop{\displaystyle \sup_{n}} |c_{n}| = M$ : $\lVert T \rVert = M$.

    $\triangleright$ *3.* Clairement $Te_{n} = c_{n} e_{n}$. Si $T'$ est linéaire continue et vérifie la même propriété, $T$ et $T'$ coïncident sur $\mathrm{Vect}(e_{n})$, qui est dense ; par continuité, $T = T'$.

    $\triangleright$ *4.* Pour tous $n$, $m$, $\langle T^{*}e_{n}, e_{m} \rangle = \langle e_{n}, Te_{m} \rangle = \overline{c_{m}} \langle e_{n}, e_{m} \rangle$, qui vaut $\overline{c_{n}}$ si $m = n$ et $0$ sinon. Les coordonnées de $T^{*}e_{n}$ dans la base sont donc celles de $\overline{c_{n}} e_{n}$ : $T^{*} e_{n} = \overline{c_{n}} e_{n}$, et $T^{*}$ est l'opérateur diagonal associé à $(\overline{c_{n}})$.

    Alors $TT^{*}e_{n} = |c_{n}|^{2} e_{n} = T^{*}Te_{n}$ ; par la question 3, $TT^{*} = T^{*}T$ : $T$ est un opérateur *normal*. Il est autoadjoint si et seulement si tous les $c_{n}$ sont réels.

    $\triangleright$ *5.* Dans $\ell^{2}(\mathbb{N}, \mathbb{C})$ avec la base canonique, l'opérateur $(x_{n}) \mapsto (\alpha_{n} x_{n})$ est de ce type : il est continu, de norme $\mathop{\displaystyle \sup} |\alpha_{n}|$, d'adjoint $(x_{n}) \mapsto (\overline{\alpha_{n}} x_{n})$. C'est l'analogue discret des opérateurs de multiplication du cours, dont l'adjoint est $M_{\overline{g}}$.
- id: "l3-hf-04-08"
  feuille: "f-l3-hf-04"
