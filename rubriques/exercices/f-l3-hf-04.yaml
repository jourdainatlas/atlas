  source: "ENS, feuille 7, exercice 7, questions 1 et 2 (a)"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **Un espace de Hilbert est réflexif.** Soit $H$ un espace de Hilbert réel, $H'$ son dual (formes linéaires continues, munies de la norme d'opérateur) et $H''$ le dual de $H'$. On définit $J : H \to H''$ par $J(x)(\ell) = \ell(x)$.

    **1.** Montrer que $J$ est linéaire, et que $\lVert J(x) \rVert = \lVert x \rVert$ pour tout $x$. On pourra utiliser la forme $\ell = \langle \cdot, x \rangle$.

    **2.** Montrer que $J$ est surjective. On pourra utiliser l'application $R : a \mapsto \langle \cdot, a \rangle$ de $H$ dans $H'$ donnée par le théorème de Riesz.
  corrige: |
    $\triangleright$ *1.* La linéarité de $J$ est immédiate. Pour $\ell \in H'$, $|J(x)(\ell)| = |\ell(x)| \leq \lVert \ell \rVert \lVert x \rVert$, donc $\lVert J(x) \rVert \leq \lVert x \rVert$. Pour $x \neq 0$, la forme $\ell = \langle \cdot, x \rangle / \lVert x \rVert$ est de norme $1$ et $J(x)(\ell) = \lVert x \rVert$ : d'où $\lVert J(x) \rVert = \lVert x \rVert$.

    $\triangleright$ *2.* L'application $R : a \mapsto \langle \cdot, a \rangle$ est, d'après le théorème de Riesz, une bijection linéaire isométrique de $H$ sur $H'$ (cas réel). Soit $\Phi \in H''$. Alors $\Phi \circ R$ est une forme linéaire continue sur $H$ ; par Riesz, il existe $b \in H$ tel que $\Phi(R(a)) = \langle a, b \rangle$ pour tout $a$. Pour $\ell = R(a) \in H'$, 
    $$\Phi(\ell) = \langle a, b \rangle = \langle b, a \rangle = \ell(b) = J(b)(\ell) .$$
     Donc $\Phi = J(b)$, et $J$ est surjective : $H$ est réflexif.
- id: "l3-hf-04-06"
