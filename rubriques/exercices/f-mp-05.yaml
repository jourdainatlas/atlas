    Soit $E$ et $F$ deux espaces de dimension finie.

    **1.** Soit $f : E \to \mathbb{R}$ continue telle que $f(x) \to +\infty$ lorsque $\lVert x \rVert \to +\infty$. Montrer que $f$ admet un minimum sur $E$.

    **2.** Soit $f : E \to \mathbb{R}$ continue, admettant une limite finie $\ell$ lorsque $\lVert x \rVert \to +\infty$. Montrer que $f$ est bornée et uniformément continue sur $E$.

    **3.** Soit $f : E \to F$ continue. On dit que $f$ est *propre* si l'image réciproque de tout compact est compacte. Montrer que $f$ est propre si et seulement si $\lVert f(x) \rVert \to +\infty$ lorsque $\lVert x \rVert \to +\infty$, et qu'alors l'image par $f$ de tout fermé est fermée.
  corrige: |
    **1.** Il existe $R$ tel que $f(x) \geqslant f(0)$ pour $\lVert x \rVert \geqslant R$. Le minimum de $f$ sur le compact $B_{f}(0, R)$ (proposition 13) est atteint (théorème 6), et il est inférieur à $f(0)$ : c'est un minimum sur $E$.

    **2.** Soit $\varepsilon > 0$ et $R$ tel que $|f(x) - \ell| \leqslant \dfrac{\varepsilon}{2}$ pour $\lVert x \rVert \geqslant R$. Sur le compact $B_{f}(0, R + 1)$, $f$ est bornée et uniformément continue (théorèmes 6 et 7) : il existe $\delta_{0}$ associé à $\varepsilon$. Avec $\delta = \mathop{\displaystyle \min}(\delta_{0}, 1)$, si $\lVert x - y \rVert < \delta$, ou bien $x$ et $y$ sont tous deux de norme au moins $R$, et $|f(x) - f(y)| \leqslant \varepsilon$, ou bien l'un est de norme strictement inférieure à $R$, et les deux sont dans $B_{f}(0, R + 1)$, d'où $|f(x) - f(y)| < \varepsilon$. La bornitude s'obtient de même, avec $\varepsilon = 1$. 
    $$\boxed{f \text{ est bornée et uniformément continue}}$$

    **3.** Si $\lVert f(x) \rVert$ ne tend pas vers $+\infty$, il existe $M$ et une suite $(x_{n})$ avec $\lVert x_{n} \rVert \to +\infty$ et $\lVert f(x_{n}) \rVert \leqslant M$ : l'image réciproque du compact $B_{f}(0, M)$ n'est pas bornée, et $f$ n'est pas propre. Réciproquement, soit $K$ un compact, contenu dans une boule $B_{f}(0, M)$ ; l'image réciproque $f^{-1}(K)$ est fermée (théorème 2) et contenue dans une boule $B_{f}(0, R)$ hors de laquelle $\lVert f(x) \rVert > M$ : elle est compacte. Enfin, si $G$ est fermé et $f(x_{n}) \to y$ avec $x_{n} \in G$, la partie $K = \{f(x_{n})\} \cup \{y\}$ est compacte (exercice 19), donc $(x_{n})$ est dans le compact $f^{-1}(K)$ : une suite extraite converge vers un $x$, qui est dans $G$, et $f(x) = y$. 
    $$\boxed{f \text{ propre} \iff \lim_{\lVert x \rVert \to +\infty} \lVert f(x) \rVert = +\infty, \text{ et alors } f(G) \text{ est fermé si } G \text{ l'est}}$$
- id: "mp-05-43"
  feuille: "f-mp-05"
  numero: 43
  partie: "Espaces vectoriels normés de dimension finie"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [dimension finie]
  noeuds: [gd-equivalence, f-compacts]
  notions: [normes-equivalentes]
  source: "Compacité, connexité par arcs (Sainte-Geneviève), exercice 59"
  page_enonce: 7
  page_corrige: 15
  enonce: |
    On munit $\mathbb{C}_{d}[X]$ d'une norme. Soit $(P_{n})$ et $(Q_{n})$ deux suites de polynômes unitaires de $\mathbb{C}_{d}[X]$, avec $(Q_{n})$ bornée et $P_{n}$ divisant $Q_{n}$ pour tout $n$. Montrer que $(P_{n})$ est bornée. On pourra majorer les racines de $Q_{n}$, puis exprimer les coefficients de $P_{n}$ à l'aide de ses racines.
  corrige: |
    Toutes les normes étant équivalentes, on utilise la norme $N_{\infty}$, maximum des modules des coefficients, et l'on suppose $N_{\infty}(Q_{n}) \leqslant M$. Si $Q = X^{e} + \mathop{\displaystyle \sum_{k < e}} b_{k}X^{k}$ est unitaire et $Q(z) = 0$ avec $|z| > 1$, alors 
    $$|z|^{e} \leqslant \sum_{k < e} |b_{k}|\,|z|^{k} \leqslant eM|z|^{e-1}, \qquad\text{d'où}\qquad |z| \leqslant dM.$$
     Toutes les racines de $Q_{n}$ sont donc de module au plus $\rho = \mathop{\displaystyle \max}(1, dM)$. Comme $P_{n}$ divise $Q_{n}$ et est unitaire, $P_{n} = \mathop{\displaystyle \prod_{i}}(X - z_{i})$ avec des racines $z_{i}$ de $Q_{n}$ (au plus $d$). Le coefficient de $X^{m - k}$ dans ce produit est, au signe près, une somme de $\dbinom{m}{k}$ produits de $k$ racines, donc de module au plus $2^{d}\rho^{d}$. 
    $$\boxed{N_{\infty}(P_{n}) \leqslant 2^{d}\max(1, dM)^{d}}$$
     C'est ici qu'interviennent les racines complexes : le résultat serait faux pour la divisibilité par un polynôme quelconque, non unitaire.
- id: "mp-05-44"
