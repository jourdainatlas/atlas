  enonce: |
    Soit $n \in \mathbb{N}$.

    **1.** Montrer qu'il existe $\lambda > 0$ tel que $\int_{0}^{1} |P| \geqslant \lambda \sup_{[0, 1]} |P|$ pour tout $P \in \mathbb{R}_{n}[X]$.

    **2.** On note $U_{n}$ l'ensemble des polynômes unitaires de degré $n$, et $a_{n} = \inf\limits_{P \in U_{n}} \int_{0}^{1} |P|$. Montrer que $a_{n} > 0$ et que cette borne inférieure est atteinte. On pourra écrire $P = X^{n} - Q$ avec $Q \in \mathbb{R}_{n-1}[X]$ et interpréter $a_{n}$ comme une distance.
  corrige: |
    **1.** Sur l'espace $\mathbb{R}_{n}[X]$, de dimension finie, les normes $P \mapsto \mathop{\displaystyle \int_{0}^{1}} |P|$ et $P \mapsto \mathop{\displaystyle \sup_{[0, 1]}} |P|$ sont équivalentes (théorème 9). 
    $$\boxed{\exists \lambda > 0, \ \forall P \in \mathbb{R}_{n}[X], \quad \int_{0}^{1} |P| \geqslant \lambda\sup_{[0, 1]} |P|}$$

    **2.** Tout $P \in U_{n}$ s'écrit $X^{n} - Q$ avec $Q \in \mathbb{R}_{n-1}[X]$, d'où 
    $$a_{n} = \inf_{Q \in \mathbb{R}_{n-1}[X]} \int_{0}^{1} |X^{n} - Q| = d\big(X^{n}, \mathbb{R}_{n-1}[X]\big)$$
     dans $\mathbb{R}_{n}[X]$ muni de la norme $\lVert \cdot \rVert_{1}$. Le sous-espace $\mathbb{R}_{n-1}[X]$ est fermé (proposition 14) et ne contient pas $X^{n}$ : la distance est strictement positive (proposition 6) et atteinte, puisque c'est la distance d'un point à un fermé en dimension finie (section 5.6 du cours). 
    $$\boxed{a_{n} > 0, \ \text{ et la borne inférieure est atteinte}}$$
