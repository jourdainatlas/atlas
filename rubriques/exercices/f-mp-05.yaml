  page_enonce: 7
  page_corrige: 15
  enonce: |
    Soit $E$ de dimension finie.

    **1.** Soit $K$ un compact de $E$ et $r > 0$. Montrer que $L = \bigcup_{x \in K} B_{f}(x, r)$ est compact.

    **2.** Soit $f : E \to \mathbb{R}$ continue. Pour $r \geqslant 0$, on pose $M(r) = \max\limits_{\lVert x \rVert \leqslant r} f(x)$. Justifier l'existence de $M(r)$, montrer que $M$ est croissante, et montrer que $M$ est lipschitzienne si $f$ l'est.
  corrige: |
    **1.** On a $L = K + B_{f}(0, r)$, somme de deux compacts (la boule fermée est compacte en dimension finie) : $L$ est compacte (exercice 20).

    **2.** La boule $B_{f}(0, r)$ est un compact non vide : $M(r)$ existe (théorème 6). Les boules croissent avec $r$, donc $M$ aussi. Si $f$ est $k$-lipschitzienne et $0 \leqslant r < r'$, tout $x$ de norme au plus $r'$ est à distance au plus $r' - r$ du point $y = \dfrac{r}{r'}x$, de norme au plus $r$, d'où $f(x) \leqslant f(y) + k(r' - r) \leqslant M(r) + k(r' - r)$. 
    $$\boxed{0 \leqslant M(r') - M(r) \leqslant k(r' - r)}$$
- id: "mp-05-45"
  feuille: "f-mp-05"
  numero: 45
  partie: "Connexité par arcs"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [connexité par arcs, ouverts et fermés]
  noeuds: [tr-connexes, tr-ouverts]
  notions: [connexe-par-arcs, ouvert]
  source: "BibM@th, Compléments de topologie, exercices 19 et 20 ; Compacité, connexité par arcs (Sainte-Geneviève), exercices 74 et 79 ; Topologie des espaces normés (Prost), exercice 45"
  page_enonce: 8
  page_corrige: 15
  enonce: |
    Soit $A$ et $B$ deux parties connexes par arcs de $E$.

    **1.** Montrer que $A \times B$ est une partie connexe par arcs de $E \times E$, et que $A + B$ est connexe par arcs.

    **2.** Montrer que si $A \cap B \neq \emptyset$, alors $A \cup B$ est connexe par arcs. Et si $A \cap B = \emptyset$ ?

    **3.** L'intérieur d'une partie connexe par arcs est-il connexe par arcs ? On pourra dessiner deux disques fermés tangents.
  corrige: |
    **1.** Si $\gamma$ joint $a$ à $a'$ dans $A$ et $\delta$ joint $b$ à $b'$ dans $B$, le chemin $t \mapsto \big(\gamma(t), \delta(t)\big)$ est continu (proposition 3) et joint $(a, b)$ à $(a', b')$ dans $A \times B$. La somme $A + B$ est l'image de $A \times B$ par l'addition, continue : elle est connexe par arcs (théorème 11).

    **2.** Deux points de $A \cup B$ situés dans la même partie se joignent directement ; si $a \in A$ et $b \in B$, on passe par un point $c \in A \cap B$ (proposition 15). Si $A \cap B = \emptyset$, la réunion peut ne pas être connexe par arcs : $[0, 1] \cup [2, 3]$ n'est pas un intervalle (théorème 10).

    **3.** Les disques fermés de centres $(\pm 1, 0)$ et de rayon $1$ se touchent en $(0, 0)$ : leur réunion est connexe par arcs par la question 2. Son intérieur est la réunion des deux disques ouverts, qui ne contient aucun point d'abscisse nulle. Un chemin de $(-1, 0)$ à $(1, 0)$ aurait une abscisse continue passant de $-1$ à $1$, donc s'annulant (théorème 11) : il sortirait de l'intérieur. 
    $$\boxed{\text{L'intérieur d'une partie connexe par arcs n'est pas toujours connexe par arcs}}$$
- id: "mp-05-46"
