- id: "mp-05-01"
  feuille: "f-mp-05"
  numero: 1
  partie: "Limites et continuité"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [limites et continuité]
  noeuds: [c-uniforme]
  notions: [continuite]
  source: "BibM@th, Topologie des espaces vectoriels normés, exercices 37, 38 et 40"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    On munit $\mathbb{R}^{2}$ de la norme euclidienne. Étudier l'existence d'une limite en $(0, 0)$ pour les fonctions définies sur $\mathbb{R}^{2} \setminus \{(0, 0)\}$ par 
    $$f(x, y) = \frac{3x^{2} + xy}{\sqrt{x^{2} + y^{2}}}, \qquad g(x, y) = \frac{xy}{x^{2} + y^{2}}, \qquad h(x, y) = \frac{xy^{4}}{x^{4} + y^{6}}.$$
     Pour $f$, on pourra commencer par montrer que $2|xy| \leqslant x^{2} + y^{2}$ ; pour $h$, on pourra étudier la restriction à une courbe d'équation $x = y^{\alpha}$ bien choisie.
  corrige: |
    On note $r = \sqrt{x^{2} + y^{2}}$. Pour $f$, l'inégalité $2|xy| \leqslant x^{2} + y^{2}$, qui équivaut à $(|x| - |y|)^{2} \geqslant 0$, donne 
    $$|3x^{2} + xy| \leqslant 3r^{2} + \frac{r^{2}}{2} = \frac{7}{2}r^{2}, \qquad\text{d'où}\qquad |f(x, y)| \leqslant \frac{7}{2}r \xrightarrow[(x, y) \to (0, 0)]{} 0.$$
     Pour $g$, on se restreint aux droites $y = tx$ : $g(x, tx) = \dfrac{t}{1 + t^{2}}$ ne dépend que de $t$, et vaut $0$ pour $t = 0$ et $\dfrac{1}{2}$ pour $t = 1$. Pour $h$, on suit la courbe $x = y^{3/2}$, avec $y > 0$ : 
    $$h(y^{3/2}, y) = \frac{y^{3/2}y^{4}}{y^{6} + y^{6}} = \frac{1}{2\sqrt{y}} \xrightarrow[y \to 0^{+}]{} +\infty,$$
     alors que $h(0, y) = 0$. 
    $$\boxed{\lim_{(0, 0)} f = 0 ; \quad g \text{ et } h \text{ n'ont pas de limite en } (0, 0)}$$
     *Piège.* Pour $h$, toutes les droites passant par l'origine donnent la limite $0$ : $h(x, tx) = \dfrac{t^{4}x^{5}}{x^{4} + t^{6}x^{6}} \to 0$. Il faut une courbe adaptée aux degrés du dénominateur, ici choisie pour que $x^{4}$ et $y^{6}$ soient du même ordre.
- id: "mp-05-02"
  feuille: "f-mp-05"
  numero: 2
  partie: "Limites et continuité"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [limites et continuité]
  noeuds: [c-uniforme]
  notions: [continuite, puissance-reelle]
  source: "BibM@th, Topologie des espaces vectoriels normés, exercice 39"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $\alpha$, $\beta > 0$ et $f(x, y) = \dfrac{x^{\alpha}y^{\beta}}{x^{2} + y^{2}}$ sur $]0, +\infty[^{2}$. Montrer que $f$ admet une limite en $(0, 0)$ si et seulement si $\alpha + \beta > 2$.
  corrige: |
    On passe en coordonnées polaires : $x = r\cos\theta$, $y = r\sin\theta$, avec $r > 0$ et $\theta \in \, ]0, \dfrac{\pi}{2}[$. 
    $$f(x, y) = r^{\alpha + \beta - 2}\cos^{\alpha}\theta\,\sin^{\beta}\theta, \qquad 0 < f(x, y) \leqslant r^{\alpha + \beta - 2}.$$
     Si $\alpha + \beta > 2$, le majorant tend vers $0$ avec $r$, indépendamment de $\theta$ : la limite est $0$. Si $\alpha + \beta \leqslant 2$, on se restreint aux demi-droites $y = kx$ : $f(x, kx) = \dfrac{k^{\beta}}{1 + k^{2}}x^{\alpha + \beta - 2}$. Pour $\alpha + \beta < 2$, cette quantité tend vers $+\infty$ ; pour $\alpha + \beta = 2$, elle vaut $\dfrac{k^{\beta}}{1 + k^{2}}$, qui dépend de $k$ (elle tend vers $0$ quand $k \to 0^{+}$ et vaut $\dfrac{1}{2}$ pour $k = 1$). 
    $$\boxed{f \text{ admet une limite en } (0, 0) \iff \alpha + \beta > 2, \text{ et cette limite est } 0}$$
- id: "mp-05-03"
  feuille: "f-mp-05"
  numero: 3
  partie: "Limites et continuité"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [limites et continuité]
  noeuds: [c-uniforme]
  notions: [continuite]
  source: "BibM@th, Topologie des espaces vectoriels normés, exercices 42 et 43"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Montrer que la fonction $(x, y) \mapsto \frac{\sin(xy)}{xy}$, définie pour $xy \neq 0$, se prolonge en une fonction continue sur $\mathbb{R}^{2}$.

    **2.** Soit $f \in \mathcal{C}^{1}(\mathbb{R}, \mathbb{R})$. On pose $F(x, y) = \frac{f(x) - f(y)}{x - y}$ si $x \neq y$, et $F(x, x) = f'(x)$. Montrer que $F$ est continue sur $\mathbb{R}^{2}$.
  corrige: |
    **1.** La fonction $\sigma : u \mapsto \dfrac{\sin u}{u}$, prolongée par $\sigma(0) = 1$, est continue sur $\mathbb{R}$ (chapitre 8 de MPSI). La composée $(x, y) \mapsto \sigma(xy)$ est continue sur $\mathbb{R}^{2}$ (proposition 3) et coïncide avec la fonction donnée lorsque $xy \neq 0$. 
    $$\boxed{\text{Le prolongement par } 1 \text{ sur les axes est continu}}$$

    **2.** En un point $(a, b)$ avec $a \neq b$, $F$ est un quotient de fonctions continues au voisinage. Au point $(a, a)$, on utilise le théorème des accroissements finis : si $x \neq y$, $F(x, y) = f'(c)$ pour un $c$ compris entre $x$ et $y$, et si $x = y$, $F(x, y) = f'(x)$. Dans les deux cas, $F(x, y) = f'(c)$ avec 
    $$|c - a| \leqslant \max(|x - a|, |y - a|) = \lVert (x, y) - (a, a) \rVert_{\infty}.$$
     Par continuité de $f'$ en $a$, $F(x, y) \to f'(a) = F(a, a)$. 
    $$\boxed{F \text{ est continue sur } \mathbb{R}^{2}}$$
     L'hypothèse $f \in \mathcal{C}^{1}$ est indispensable : c'est la continuité de $f'$ qui permet de contrôler le point $c$, sur lequel on ne sait rien d'autre.
