  enonce: |
    Soit $f \in \mathcal{L}(\mathbb{R}^{n}, \mathbb{R}^{p})$. On dit que $f$ est *ouverte* si l'image par $f$ de tout ouvert est un ouvert. Montrer que $f$ est ouverte si et seulement si elle est surjective. On pourra, pour le sens direct, considérer l'image d'une boule centrée en $0$ ; pour le sens réciproque, utiliser une application linéaire $g$ telle que $f \circ g = \mathrm{id}$.
  corrige: |
    Si $f$ est ouverte, $f\big(B(0, 1)\big)$ est un ouvert contenant $0$, donc une boule $B(0, \rho)$. Le sous-espace $\mathrm{Im}\, f$ contient cette boule : il est d'intérieur non vide, donc égal à $\mathbb{R}^{p}$ (exercice 35 de la feuille du chapitre 4). Réciproquement, si $f$ est surjective, on choisit des antécédents des vecteurs d'une base de $\mathbb{R}^{p}$, ce qui définit $g \in \mathcal{L}(\mathbb{R}^{p}, \mathbb{R}^{n})$ telle que $f \circ g = \mathrm{id}$. Soit $U$ un ouvert, $y_{0} = f(x_{0})$ avec $x_{0} \in U$, et $B(x_{0}, r) \subset U$. Pour $\lVert y - y_{0} \rVert < \dfrac{r}{|\mkern-1.5mu|\mkern-1.5mu|g|\mkern-1.5mu|\mkern-1.5mu| + 1}$, le vecteur $x = x_{0} + g(y - y_{0})$ est dans $B(x_{0}, r)$ et $f(x) = y$ : la boule $B\big(y_{0}, \dfrac{r}{|\mkern-1.5mu|\mkern-1.5mu|g|\mkern-1.5mu|\mkern-1.5mu| + 1}\big)$ est contenue dans $f(U)$. 
    $$\boxed{f \text{ ouverte} \iff f \text{ surjective}}$$
