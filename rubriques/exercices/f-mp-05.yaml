  page_enonce: 5
  page_corrige: 10
  enonce: |
    **1.** Soit $K$ un compact contenu dans la boule ouverte $B(0, 1)$ de $E$. Montrer qu'il existe $r < 1$ tel que $K \subset B_{f}(0, r)$.

    **2.** Soit $\Omega$ un ouvert de $\mathbb{R}^{d}$ contenant la boule fermée $B_{f}(0, 1)$. Montrer qu'il existe $R > 1$ tel que $B(0, R) \subset \Omega$. On pourra étudier $x \mapsto d(x, \mathbb{R}^{d} \setminus \Omega)$ sur $B_{f}(0, 1)$.
  corrige: |
    **1.** Si $K$ est vide, tout $r$ convient. Sinon, la norme, continue sur $K$, y atteint son maximum $r = \lVert x_{0} \rVert$ en un point $x_{0} \in K \subset B(0, 1)$ (théorème 6), et $r < 1$.

    **2.** Soit $C = \mathbb{R}^{d} \setminus \Omega$, fermé ; s'il est vide, il n'y a rien à montrer. Pour $x \in B_{f}(0, 1)$, $x \notin C$, donc $d(x, C) > 0$ (proposition 6). La fonction continue $x \mapsto d(x, C)$ atteint sur le compact $B_{f}(0, 1)$ un minimum $m > 0$. Soit $R = 1 + m$ et $\lVert y \rVert < R$. Si $\lVert y \rVert \leqslant 1$, $y \in \Omega$. Sinon, $x = \dfrac{y}{\lVert y \rVert} \in B_{f}(0, 1)$ et $\lVert y - x \rVert = \lVert y \rVert - 1 < m \leqslant d(x, C)$, donc $y \notin C$. 
    $$\boxed{B(0, 1 + m) \subset \Omega}$$
     La compacité transforme une marge qui dépend du point en une marge uniforme : c'est le mécanisme du théorème de Heine.
