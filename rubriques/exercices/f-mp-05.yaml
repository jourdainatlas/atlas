  enonce: |
    Soit $E$ de dimension finie $d$ et $p \leqslant d$. Montrer que l'ensemble des familles libres $(x_{1}, \dots, x_{p})$ est un ouvert de $E^{p}$. On pourra utiliser une base de $E$ et les mineurs de la matrice des coordonnées.
  corrige: |
    On fixe une base de $E$, et l'on note $M(x_{1}, \dots, x_{p}) \in \mathcal{M}_{d, p}(\mathbb{K})$ la matrice des coordonnées. La famille est libre si et seulement si cette matrice est de rang $p$, c'est-à-dire si l'un de ses mineurs de taille $p$ est non nul (chapitre 16 de MPSI). Chaque mineur est une fonction polynomiale des coordonnées, donc continue sur $E^{p}$ (proposition 14), et l'ensemble où il ne s'annule pas est ouvert (théorème 2). L'ensemble des familles libres est la réunion de ces ouverts. 
    $$\boxed{\text{Les familles libres forment un ouvert de } E^{p}}$$
     Une petite perturbation d'une famille libre reste libre ; en revanche, une famille liée peut devenir libre par perturbation, et l'ensemble des familles liées est d'intérieur vide.
