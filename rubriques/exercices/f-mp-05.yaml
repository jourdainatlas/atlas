  noeuds: [c-uniforme, c-heine, tr-ouverts]
  notions: [continuite, continuite-uniforme, ouvert]
  source: "BibM@th, Topologie des espaces vectoriels normés, exercices 30, 31 et 36 ; Topologie (LLG), exercice 14"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Montrer que $x \mapsto \frac{1}{1 + \lVert x \rVert}$ est $1$-lipschitzienne sur $E$.

    **2.** Montrer que $g : x \mapsto \frac{x}{1 + \lVert x \rVert}$ est une bijection de $E$ sur la boule ouverte $B(0, 1)$, et que $g$ et $g^{-1}$ sont continues.

    **3.** L'application $(x, y) \mapsto xy$ est-elle uniformément continue sur $\mathbb{R}^{2}$ ? sur $[0, 1]^{2}$ ?
  corrige: |
    **1.** On réduit au même dénominateur et l'on utilise $\big|\lVert y \rVert - \lVert x \rVert\big| \leqslant \lVert x - y \rVert$ : 
    $$\Big|\frac{1}{1 + \lVert x \rVert} - \frac{1}{1 + \lVert y \rVert}\Big| = \frac{\big|\lVert y \rVert - \lVert x \rVert\big|}{(1 + \lVert x \rVert)(1 + \lVert y \rVert)} \leqslant \lVert x - y \rVert.$$

    **2.** On a $\lVert g(x) \rVert = \dfrac{\lVert x \rVert}{1 + \lVert x \rVert} < 1$. Pour $\lVert y \rVert < 1$, on pose $h(y) = \dfrac{y}{1 - \lVert y \rVert}$. On vérifie que 
    $$1 + \lVert h(y) \rVert = \frac{1}{1 - \lVert y \rVert}, \qquad 1 - \lVert g(x) \rVert = \frac{1}{1 + \lVert x \rVert},$$
     d'où $g(h(y)) = y$ et $h(g(x)) = x$. Les applications $g$ et $h$ sont des produits d'une fonction scalaire continue par l'identité : elles sont continues (proposition 3). 
    $$\boxed{g : E \to B(0, 1) \text{ est bijective, de réciproque } y \mapsto \frac{y}{1 - \lVert y \rVert}, \text{ et bicontinue}}$$
     Un espace normé tout entier et sa boule unité ouverte sont donc « topologiquement identiques », bien que l'un soit borné et l'autre non.

    **3.** Sur $\mathbb{R}^{2}$, les points $(n, 0)$ et $(n, \dfrac{1}{n})$ sont à distance $\dfrac{1}{n}$, mais leurs images diffèrent de $1$ : $(x, y) \mapsto xy$ n'est pas uniformément continue. Sur $[0, 1]^{2}$, elle l'est, par le théorème de Heine, ou directement : $|xy - x'y'| \leqslant |x - x'|\,|y| + |x'|\,|y - y'| \leqslant |x - x'| + |y - y'|$. 
    $$\boxed{\text{Non uniformément continue sur } \mathbb{R}^{2}, \text{ lipschitzienne sur } [0, 1]^{2}}$$
