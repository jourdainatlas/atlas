  notions: [compact, ouvert]
  source: "BibM@th, Compléments de topologie, exercice 17 ; Compacité, connexité par arcs (Sainte-Geneviève), exercices 9 et 16 ; Topologie (LLG), exercice 34"
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Soit $A$ une partie de $E$ et $f : A \to F$. On note $\Gamma = \{(x, f(x)) \mid x \in A\}$ le graphe de $f$, partie de $E \times F$ muni de la norme produit.

    **1.** Montrer que si $f$ est continue, $\Gamma$ est un fermé relatif de $A \times F$. Donner une fonction $\mathbb{R} \to \mathbb{R}$ discontinue dont le graphe est fermé.

    **2.** On suppose que $f$ est à valeurs dans un compact $K$ et que $\Gamma$ est un fermé relatif de $A \times F$. Montrer que $f$ est continue.

    **3.** On suppose $A$ compacte et $f$ continue et injective. Montrer que la bijection réciproque $f(A) \to A$ est continue.
  corrige: |
    **1.** Soit $\big(x_{n}, f(x_{n})\big) \to (x, y)$ avec $x \in A$. Par continuité, $f(x_{n}) \to f(x)$, donc $y = f(x)$ et $(x, y) \in \Gamma$ : par le théorème 3 du chapitre 4, $\Gamma$ est un fermé relatif. La fonction définie par $f(x) = \dfrac{1}{x}$ pour $x \neq 0$ et $f(0) = 0$ n'est pas continue en $0$, mais son graphe $\{xy = 1\} \cup \{(0, 0)\}$ est fermé.

    **2.** Soit $x_{n} \to x$ dans $A$. La suite $\big(f(x_{n})\big)$ est dans le compact $K$. Si $y$ en est une valeur d'adhérence, $\big(x_{\varphi(n)}, f(x_{\varphi(n)})\big) \to (x, y)$, avec $x \in A$, donc $(x, y) \in \Gamma$ et $y = f(x)$. La suite a pour unique valeur d'adhérence $f(x)$ dans le compact $K$ : elle converge vers $f(x)$ (proposition 10). 
    $$\boxed{\Gamma \text{ fermé et } f \text{ à valeurs dans un compact} \implies f \text{ continue}}$$

    **3.** Le graphe de $g = f^{-1} : f(A) \to A$ est $\{(f(x), x) \mid x \in A\}$. Si $\big(f(x_{n}), x_{n}\big) \to (y, x)$ avec $y \in f(A)$, alors $x \in A$, car $A$ est fermée, et $f(x) = \mathop{\displaystyle \lim} f(x_{n}) = y$ : ce graphe est un fermé relatif de $f(A) \times E$, et $g$ est à valeurs dans le compact $A$. La question 2 conclut. 
    $$\boxed{f^{-1} : f(A) \to A \text{ est continue}}$$
     Sur un compact, une bijection continue est donc automatiquement bicontinue ; sans compacité, la bijection $t \mapsto \mathrm{e}^{\mathrm{i} t}$ de $[0, 2\pi[$ sur $\mathbb{U}$ a une réciproque discontinue en $1$.
