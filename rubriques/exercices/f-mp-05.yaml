  enonce: |
    **1.** Soit $N$ une norme quelconque sur $\mathcal{M}_{n}(\mathbb{K})$. Montrer qu'il existe un réel $c > 0$ tel que, pour toutes matrices $A$ et $B$, on ait $N(AB) \leqslant c\,N(A)N(B)$.

    **2.** On munit $\mathbb{K}[X]$ de la norme $N_{\infty}\big(\sum a_{k}X^{k}\big) = \max_{k} |a_{k}|$. En considérant $P_{n} = 1 + X + \cdots + X^{n}$, montrer qu'il n'existe aucune constante $c$ telle que $N_{\infty}(PQ) \leqslant c\,N_{\infty}(P)N_{\infty}(Q)$ pour tous $P$, $Q$.
  corrige: |
    **1.** La norme $N$ est équivalente à la norme subordonnée $|\mkern-1.5mu|\mkern-1.5mu|\cdot|\mkern-1.5mu|\mkern-1.5mu|_{\infty}$ (théorème 9) : $\alpha|\mkern-1.5mu|\mkern-1.5mu|\cdot|\mkern-1.5mu|\mkern-1.5mu|_{\infty} \leqslant N \leqslant \beta|\mkern-1.5mu|\mkern-1.5mu|\cdot|\mkern-1.5mu|\mkern-1.5mu|_{\infty}$. Par sous-multiplicativité, 
    $$N(AB) \leqslant \beta|\mkern-1.5mu|\mkern-1.5mu|AB|\mkern-1.5mu|\mkern-1.5mu|_{\infty} \leqslant \beta|\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|_{\infty}|\mkern-1.5mu|\mkern-1.5mu|B|\mkern-1.5mu|\mkern-1.5mu|_{\infty} \leqslant \frac{\beta}{\alpha^{2}}N(A)N(B).$$

    $$\boxed{c = \frac{\beta}{\alpha^{2}} \text{ convient}}$$

    **2.** Le coefficient de $X^{k}$ dans $P_{n}^{2}$ est le nombre de couples $(i, j) \in \llbracket 0\,,n \rrbracket^{2}$ tels que $i + j = k$ ; il vaut $n + 1$ pour $k = n$. Donc $N_{\infty}(P_{n}^{2}) = n + 1$, alors que $N_{\infty}(P_{n}) = 1$. 
    $$\boxed{\text{Aucune constante } c \text{ ne convient sur } \mathbb{K}[X]}$$
     La question 1 est un phénomène de dimension finie : en dimension infinie, la multiplication peut ne pas être continue pour une norme donnée.
