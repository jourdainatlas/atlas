  enonce: |
    *Extraction diagonale.* On munit l'espace $\ell^{\infty}$ des suites réelles bornées de $\lVert \cdot \rVert_{\infty}$. Soit $\varepsilon = (\varepsilon_{n})$ une suite bornée de réels positifs, et $K = \{a \in \ell^{\infty} \mid \forall n, \ |a_{n}| \leqslant \varepsilon_{n}\}$.

    **1.** Montrer que $K$ est fermée et bornée.

    **2.** On suppose que $(\varepsilon_{n})$ ne tend pas vers $0$. Construire une suite d'éléments de $K$ deux à deux à distance au moins $\delta > 0$, et en déduire que $K$ n'est pas compacte.

    **3.** On suppose $\varepsilon_{n} \xrightarrow[n \to +\infty]{} 0$. Soit $(a^{(k)})$ une suite de $K$.

    **(a)** Construire des applications strictement croissantes $\varphi_{0}$, $\varphi_{1}$, … telles que, pour tout $p$, la suite $\big(a^{(\varphi_{0} \circ \cdots \circ \varphi_{p}(k))}_{p}\big)_{k}$ converge.

    **(b)** On pose $\psi(k) = \varphi_{0} \circ \cdots \circ \varphi_{k}(k)$. Montrer que $\psi$ est strictement croissante, et que chaque coordonnée de $a^{(\psi(k))}$ converge vers un réel $b_{p}$.

    **(c)** Montrer que $b \in K$ et que $a^{(\psi(k))} \to b$ pour $\lVert \cdot \rVert_{\infty}$. Conclure.
  corrige: |
    **1.** Si $a^{(k)} \to a$ pour $\lVert \cdot \rVert_{\infty}$, chaque coordonnée converge, et les inégalités $|a^{(k)}_{n}| \leqslant \varepsilon_{n}$ passent à la limite. Et $\lVert a \rVert_{\infty} \leqslant \mathop{\displaystyle \sup_{n}} \varepsilon_{n}$ sur $K$.

    **2.** Il existe $\delta > 0$ et $\varphi$ strictement croissante telles que $\varepsilon_{\varphi(k)} \geqslant \delta$. Les suites $a^{(k)} = \varepsilon_{\varphi(k)}e_{\varphi(k)}$ sont dans $K$, et $\lVert a^{(k)} - a^{(l)} \rVert_{\infty} = \mathop{\displaystyle \max}(\varepsilon_{\varphi(k)}, \varepsilon_{\varphi(l)}) \geqslant \delta$ pour $k \neq l$ : aucune suite extraite ne converge. 
    $$\boxed{\varepsilon_{n} \not\to 0 \implies K \text{ n'est pas compacte}}$$

    **3.a.** La suite $(a^{(k)}_{0})_{k}$ est bornée par $\varepsilon_{0}$ : par Bolzano-Weierstrass, il existe $\varphi_{0}$ qui la fait converger. Si $\varphi_{0}$, …, $\varphi_{p-1}$ sont construites, la suite de la coordonnée $p$ le long de $\varphi_{0} \circ \cdots \circ \varphi_{p-1}$ est bornée par $\varepsilon_{p}$, et l'on extrait $\varphi_{p}$. Les coordonnées précédentes convergent toujours, le long d'une suite extraite.

    **3.b.** Notons $\Phi_{k} = \varphi_{0} \circ \cdots \circ \varphi_{k}$. Comme $\varphi_{k+1}(k + 1) \geqslant k + 1 > k$, on a 
    $$\psi(k + 1) = \Phi_{k}\big(\varphi_{k+1}(k + 1)\big) > \Phi_{k}(k) = \psi(k).$$
     Pour $p$ fixé et $k \geqslant p$, $\psi(k) = \Phi_{p}\big(\varphi_{p+1} \circ \cdots \circ \varphi_{k}(k)\big)$, et ces indices croissent strictement avec $k$ : $(a^{(\psi(k))}_{p})_{k \geqslant p}$ est extraite d'une suite convergente, et converge vers un réel $b_{p}$.

    **3.c.** Les inégalités $|a^{(\psi(k))}_{p}| \leqslant \varepsilon_{p}$ passent à la limite : $b \in K$. Soit $\eta > 0$ et $N$ tel que $\varepsilon_{p} \leqslant \eta$ pour $p \geqslant N$. Pour ces indices, $|a^{(\psi(k))}_{p} - b_{p}| \leqslant 2\eta$ ; pour les $N$ premières coordonnées, en nombre fini, il existe $k_{0}$ tel que $|a^{(\psi(k))}_{p} - b_{p}| \leqslant \eta$ pour $k \geqslant k_{0}$. Ainsi $\lVert a^{(\psi(k))} - b \rVert_{\infty} \leqslant 2\eta$ pour $k \geqslant k_{0}$. 
    $$\boxed{K \text{ est compacte} \iff \varepsilon_{n} \xrightarrow[n \to +\infty]{} 0}$$
     L'extraction diagonale fait converger une infinité de coordonnées à la fois ; l'hypothèse $\varepsilon_{n} \to 0$ rend la convergence uniforme en contrôlant la queue d'un seul coup.
