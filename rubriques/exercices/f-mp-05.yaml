  enonce: |
    Montrer que l'ensemble des matrices nilpotentes et l'ensemble des matrices diagonalisables de $\mathcal{M}_{n}(\mathbb{K})$ sont étoilés par rapport à la matrice nulle, donc connexes par arcs.
  corrige: |
    Si $N^{p} = 0$, alors $(tN)^{p} = 0$ pour tout $t \in [0, 1]$ ; si $D = P\Delta P^{-1}$ avec $\Delta$ diagonale, alors $tD = P(t\Delta)P^{-1}$ est diagonalisable. Les deux ensembles contiennent donc les segments $[0, N]$ et $[0, D]$ : ils sont étoilés par rapport à $0$, donc connexes par arcs (proposition 16).
