  enonce: |
    **1.** Soit $K$ et $L$ deux compacts non vides de $E$. Montrer qu'il existe $a \in K$ et $b \in L$ tels que $\lVert a - b \rVert = \inf\limits_{x \in K, \, y \in L} \lVert x - y \rVert$. En déduire que cette distance est strictement positive si $K \cap L = \emptyset$.

    **2.** Soit $G$ un fermé et $K$ un compact, non vides et disjoints. Montrer que $\inf\limits_{x \in K} d(x, G) > 0$.

    **3.** Donner deux fermés non vides et disjoints de $\mathbb{R}^{2}$ dont la distance est nulle.
  corrige: |
    **1.** L'application $(x, y) \mapsto \lVert x - y \rVert$ est continue sur le compact $K \times L$ (proposition 11) : elle y atteint son minimum en un couple $(a, b)$ (théorème 6). Si $K \cap L = \emptyset$, alors $a \neq b$. 
    $$\boxed{d(K, L) = \lVert a - b \rVert, \ \text{ strictement positive si } K \cap L = \emptyset}$$

    **2.** La fonction $x \mapsto d(x, G)$ est continue, et strictement positive sur $K$, car $K \cap G = \emptyset$ et $G$ est fermé (proposition 6). Elle atteint sur $K$ un minimum strictement positif.

    **3.** La branche $\{(x, \dfrac{1}{x}) \mid x > 0\}$ et l'axe $\mathbb{R} \times \{0\}$ sont fermés et disjoints, et les points $(n, \dfrac{1}{n})$ et $(n, 0)$ sont à distance $\dfrac{1}{n}$. 
    $$\boxed{\text{Deux fermés disjoints peuvent être à distance nulle}}$$
- id: "mp-05-28"
  feuille: "f-mp-05"
