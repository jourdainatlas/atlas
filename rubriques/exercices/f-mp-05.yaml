  page_corrige: 2
  enonce: |
    **1.** Montrer que les parties $\{(x, y) \mid x^{2} < \mathrm{e}^{\sin y} + 12\}$ et $\{(x, y) \mid -1 < \ln(x^{2} + 1) < 1\}$ de $\mathbb{R}^{2}$ sont ouvertes, et que $\{(x, y) \mid 0 \leqslant x \leqslant y\}$ et $\{(x, y) \mid xy = 1\}$ sont fermées.

    **2.** Déterminer l'intérieur et l'adhérence des parties 
    $$\{(x, y) \mid xy > 1\} \qquad\text{et}\qquad \{(x, y) \mid x^{2} + y^{2} \leqslant 2\} \setminus \{(x, y) \mid (x - 1)^{2} + y^{2} < 1\}.$$
  corrige: |
    **1.** On applique le théorème 2. La première partie est l'image réciproque de $]-\infty, 12[$ par la fonction continue $(x, y) \mapsto x^{2} - \mathrm{e}^{\sin y}$, la deuxième celle de $]-1, 1[$ par $(x, y) \mapsto \ln(x^{2} + 1)$ : elles sont ouvertes. La troisième est l'intersection des images réciproques de $[0, +\infty[$ par $(x, y) \mapsto x$ et par $(x, y) \mapsto y - x$, et la quatrième l'image réciproque de $\{1\}$ par $(x, y) \mapsto xy$ : elles sont fermées.

    **2.** La partie $U = \{xy > 1\}$ est ouverte, donc égale à son intérieur. Elle est contenue dans le fermé $\{xy \geqslant 1\}$ ; réciproquement, si $xy = 1$, les points $\big((1 + \dfrac{1}{n})x, y\big)$ sont dans $U$ et tendent vers $(x, y)$. 
    $$\boxed{\mathring{U} = \{xy > 1\}, \qquad \overline{U} = \{xy \geqslant 1\}}$$
     La partie $V$ est l'intersection des fermés $\{x^{2} + y^{2} \leqslant 2\}$ et $\{(x - 1)^{2} + y^{2} \geqslant 1\}$ : elle est fermée, et $\overline{V} = V$. L'ouvert $W = \{x^{2} + y^{2} < 2\} \cap \{(x - 1)^{2} + y^{2} > 1\}$ est contenu dans $V$, donc dans son intérieur. Un point de $V$ situé sur l'un des deux cercles est limite de points extérieurs à $V$ (au-delà du grand cercle, ou à l'intérieur du petit disque) : il n'est pas intérieur. 
    $$\boxed{\overline{V} = V, \qquad \mathring{V} = \{x^{2} + y^{2} < 2\} \cap \{(x - 1)^{2} + y^{2} > 1\}}$$
     Les deux cercles se coupent en $(1, \pm 1)$, solutions de $x^{2} + y^{2} = 2$ et $x^{2} - 2x + y^{2} = 0$, d'où $2 - 2x = 0$.
- id: "mp-05-05"
  feuille: "f-mp-05"
  numero: 5
  partie: "Limites et continuité"
  etoiles: 1
  types: [Calcul]
  mots_cles: [limites et continuité, ouverts et fermés]
  noeuds: [c-uniforme, tr-ouverts]
  notions: [continuite, ouvert]
  source: "BibM@th, Topologie des espaces vectoriels normés, exercices 3 et 4"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Soit $E = \mathcal{C}([0, 1], \mathbb{R})$. On considère 
    $$O = \{f \in E \mid f(1) > 0\}, \qquad G = \Big\{f \in E \ \Big| \ \int_{0}^{1/2} f \leqslant 0\Big\}, \qquad P = \{f \in E \mid \forall t \in [0, 1], \ f(t) > 0\}.$$
     Ces parties sont-elles ouvertes ? fermées ? On répondra pour la norme $\lVert \cdot \rVert_{\infty}$, puis pour la norme $\lVert \cdot \rVert_{1}$.
  corrige: |
    On utilise les applications $f \mapsto f(1)$ et $L : f \mapsto \mathop{\displaystyle \int_{0}^{1/2}} f$, qui vérifient $|f(1) - g(1)| \leqslant \lVert f - g \rVert_{\infty}$ et $|L(f) - L(g)| \leqslant \lVert f - g \rVert_{1} \leqslant \lVert f - g \rVert_{\infty}$.

    *Pour $\lVert \cdot \rVert_{\infty}$.* La partie $O$ est ouverte et $G$ fermée (théorème 2). Pour $f \in P$, le minimum $m$ de $f$ sur $[0, 1]$ est atteint, donc strictement positif (chapitre 8 de MPSI), et $B(f, m) \subset P$ : $P$ est ouverte. Aucune n'est à la fois ouverte et fermée (exercice 41 de la feuille du chapitre 4) ; concrètement, les constantes $\dfrac{1}{n}$ sont dans $O$ et dans $P$ et tendent vers $0$, et $\varepsilon \notin G$ pour $\varepsilon > 0$ alors que $0 \in G$.

    *Pour $\lVert \cdot \rVert_{1}$.* La partie $G$ reste fermée. Soit $h_{n}(t) = \mathop{\displaystyle \max}(0, 1 - n(1 - t))$, fonction triangulaire de hauteur $1$ en $t = 1$ et d'intégrale $\dfrac{1}{2n}$. Si $f \in O$, la fonction $f - f(1)h_{n}$ s'annule en $1$, donc n'est pas dans $O$, et elle est à distance $\dfrac{f(1)}{2n}$ de $f$ : $O$ n'est pas ouverte. De même, avec la fonction triangulaire $k_{n}(t) = \mathop{\displaystyle \max}(0, 1 - nt)$, si $f \in P$, la fonction $f - \big(f(0) + 1\big)k_{n}$ vaut $-1$ en $0$ et est à distance $\dfrac{f(0) + 1}{2n}$ de $f$ : $P$ n'est pas ouverte.

    $$\begin{array}{c|cc}   & \lVert \cdot \rVert_{\infty} & \lVert \cdot \rVert_{1} \\ \hline O & \text{ouvert, non fermé} & \text{ni ouvert, ni fermé} \\  G & \text{fermé, non ouvert} & \text{fermé, non ouvert} \\  P & \text{ouvert, non fermé} & \text{ni ouvert, ni fermé} \end{array}$$

    La norme $\lVert \cdot \rVert_{1}$ ne voit pas la valeur en un point : les conditions ponctuelles ($f(1) > 0$, $f > 0$ partout) cessent d'être ouvertes, alors que la condition intégrale reste fermée.
- id: "mp-05-06"
  feuille: "f-mp-05"
  numero: 6
