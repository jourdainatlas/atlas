  source: "Compacité, connexité par arcs (Sainte-Geneviève), exercice 76"
  page_enonce: 10
  page_corrige: 18
  enonce: |
    **1.** Montrer que $\mathbb{R}^{2} \setminus \mathbb{Q}^{2}$ est connexe par arcs. On pourra utiliser des segments horizontaux et verticaux bien choisis.

    **2.** *(Plus difficile.)* Soit $D$ une partie dénombrable de $\mathbb{R}^{d}$, avec $d \geqslant 2$. Montrer que $\mathbb{R}^{d} \setminus D$ est connexe par arcs. On pourra, pour deux points $a$ et $b$, considérer les lignes brisées $[a, m] \cup [m, b]$, lorsque $m$ décrit une droite qui coupe $[a, b]$ en son milieu.
  corrige: |
    **1.** Un point $(x, y)$ est dans $\mathbb{R}^{2} \setminus \mathbb{Q}^{2}$ si et seulement si $x \notin \mathbb{Q}$ ou $y \notin \mathbb{Q}$. Les droites $x = \alpha$ et $y = \beta$, avec $\alpha$ ou $\beta$ irrationnel, sont donc contenues dans cet ensemble. Joignons un point $a = (a_{1}, a_{2})$ au point $c = (\sqrt{2}, \sqrt{2})$. Si $a_{1} \notin \mathbb{Q}$, on suit la verticale $x = a_{1}$ jusqu'à $(a_{1}, \sqrt{2})$, puis l'horizontale $y = \sqrt{2}$. Si $a_{2} \notin \mathbb{Q}$, on suit l'horizontale $y = a_{2}$ jusqu'à $(\sqrt{2}, a_{2})$, puis la verticale $x = \sqrt{2}$. Deux points quelconques sont alors joints en passant par $c$. 
    $$\boxed{\mathbb{R}^{2} \setminus \mathbb{Q}^{2} \text{ est connexe par arcs}}$$

    **2.** Soit $a \neq b$ hors de $D$, $c$ le milieu de $[a, b]$ et $v$ un vecteur non nul orthogonal à $b - a$. Pour $s > 0$, soit $\Gamma_{s} = [a, c + sv] \cup [c + sv, b]$. Dans le plan contenant $a$, $b$ et $c + v$, avec des coordonnées où $a = (0, 0)$, $b = (2, 0)$ et $c + sv = (1, s)$, la ligne $\Gamma_{s}$ est le graphe de $x \mapsto s\mathop{\displaystyle \min}(x, 2 - x)$ sur $[0, 2]$. Pour $s \neq s'$, ces graphes ne se rencontrent qu'en $a$ et $b$ : chaque point de $D$ est sur au plus une ligne $\Gamma_{s}$. Comme $D$ est dénombrable et que $]0, +\infty[$ ne l'est pas, une ligne $\Gamma_{s}$ évite $D$. 
    $$\boxed{\mathbb{R}^{d} \setminus D \text{ est connexe par arcs}}$$
     Retirer une infinité dénombrable de points, même denses, ne déconnecte pas le plan ; dans $\mathbb{R}$, au contraire, retirer un seul point suffit.
- id: "mp-05-57"
  feuille: "f-mp-05"
  numero: 57
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [synthèse, compacité, normes en dimension finie, ouverts et fermés]
  noeuds: [tr-compacts, gd-equivalence, tr-ouverts]
  notions: [compact, normes-equivalentes, ouvert]
  source: "BibM@th, Compléments de topologie, exercice 31 ; Compacité, connexité par arcs (Sainte-Geneviève), exercice 66 ; Topologie des espaces normés (Prost), exercice 41"
  page_enonce: 10
  page_corrige: 19
  enonce: |
    *Le théorème de F. Riesz.* Soit $E$ un espace vectoriel normé et $F$ un sous-espace de dimension finie de $E$.

    **1.** Soit $a \in E$. Montrer qu'il existe $x \in F$ tel que $d(a, F) = \lVert a - x \rVert$.

    **2.** On suppose $F \neq E$ ; soit $a \notin F$ et $x$ comme ci-dessus. Montrer que $b = \frac{a - x}{\lVert a - x \rVert}$ vérifie $\lVert b \rVert = 1$ et $d(b, F) = 1$.

    **3.** On suppose $E$ de dimension infinie. Construire une suite $(b_{n})$ de vecteurs unitaires telle que $d\big(b_{n}, \mathrm{Vect}(b_{0}, \dots, b_{n-1})\big) = 1$ pour tout $n \geqslant 1$.

    **4.** En déduire que la boule unité fermée de $E$ est compacte si et seulement si $E$ est de dimension finie.

    Ce théorème a été démontré par Frigyes Riesz en 1918 (*Über lineare Funktionalgleichungen*, Acta Mathematica, vol. 41).
  corrige: |
    **1.** Sur $F$, de dimension finie, la partie $F \cap B_{f}(a, \lVert a \rVert)$ est fermée et bornée, donc compacte (proposition 13), et non vide puisqu'elle contient $0$. La distance de $a$ à $F$ est la borne inférieure de la fonction continue $x \mapsto \lVert a - x \rVert$ sur cette partie : elle est atteinte (théorème 6).

    **2.** On a $\lVert b \rVert = 1$, et $\delta = \lVert a - x \rVert = d(a, F) > 0$ puisque $F$ est fermé (proposition 14) et ne contient pas $a$. Pour $y \in F$, 
    $$\lVert b - y \rVert = \frac{\lVert a - (x + \delta y) \rVert}{\delta} \geqslant \frac{d(a, F)}{\delta} = 1,$$
     avec égalité pour $y = 0$. 
    $$\boxed{d(b, F) = 1}$$

    **3.** On choisit $b_{0}$ unitaire. Si $b_{0}$, …, $b_{n-1}$ sont construits, $F_{n} = \mathrm{Vect}(b_{0}, \dots, b_{n-1})$ est de dimension finie, donc distinct de $E$, et la question 2 fournit $b_{n}$.

    **4.** Pour $m < n$, $b_{m} \in F_{n}$, donc $\lVert b_{n} - b_{m} \rVert \geqslant 1$ : la suite $(b_{n})$ de la boule unité n'a aucune suite extraite convergente. En dimension finie, au contraire, la boule fermée est compacte (proposition 13). 
    $$\boxed{B_{f}(0, 1) \text{ compacte} \iff \dim E < +\infty}$$
- id: "mp-05-58"
  feuille: "f-mp-05"
  numero: 58
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [synthèse, normes en dimension finie]
  noeuds: [gd-equivalence]
  notions: [normes-equivalentes]
  source: "BibM@th, Topologie des espaces vectoriels normés, exercice 50 ; Compacité, connexité par arcs (Sainte-Geneviève), exercice 14 ; Topologie des espaces normés (Prost), exercice 40"
  page_enonce: 10
  page_corrige: 19
  enonce: |
    *Théorème ergodique.* Soit $u \in \mathcal{L}(E)$ tel que $\lVert u(x) \rVert \leqslant \lVert x \rVert$ pour tout $x$. On pose $v_{n} = \frac{1}{n + 1}\sum_{k=0}^{n} u^{k}$.

    **1.** Calculer $(u - \mathrm{id}) \circ v_{n}$, et montrer que $\lVert (u - \mathrm{id})\big(v_{n}(x)\big) \rVert \leqslant \frac{2\lVert x \rVert}{n + 1}$.

    **2.** Montrer que $\mathrm{Ker}\,(u - \mathrm{id}) \cap \mathrm{Im}\,(u - \mathrm{id}) = \{0\}$.

    **3.** On suppose $E$ de dimension finie. Montrer que $E = \mathrm{Ker}\,(u - \mathrm{id}) \oplus \mathrm{Im}\,(u - \mathrm{id})$, puis que, pour tout $x$, $v_{n}(x)$ converge vers le projeté $p(x)$ de $x$ sur $\mathrm{Ker}\,(u - \mathrm{id})$ parallèlement à $\mathrm{Im}\,(u - \mathrm{id})$.

    **4.** En déduire que la suite $(v_{n})$ converge vers $p$ dans $\mathcal{L}(E)$.
  corrige: |
    **1.** La somme est télescopique : 
    $$(u - \mathrm{id}) \circ v_{n} = \frac{1}{n + 1}\sum_{k=0}^{n} (u^{k+1} - u^{k}) = \frac{u^{n+1} - \mathrm{id}}{n + 1},$$
     et $\lVert u^{n+1}(x) \rVert \leqslant \lVert x \rVert$ donne la majoration $\dfrac{2\lVert x \rVert}{n + 1}$.

    **2.** Soit $x = u(y) - y$ tel que $u(x) = x$. Alors $v_{n}(x) = x$, et, comme $u$ et $v_{n}$ commutent, $x = v_{n}\big((u - \mathrm{id})(y)\big) = (u - \mathrm{id})\big(v_{n}(y)\big)$, de norme au plus $\dfrac{2\lVert y \rVert}{n + 1}$. Donc $x = 0$. 
    $$\boxed{\mathrm{Ker}\,(u - \mathrm{id}) \cap \mathrm{Im}\,(u - \mathrm{id}) = \{0\}}$$

    **3.** Par le théorème du rang, les dimensions de $\mathrm{Ker}\,(u - \mathrm{id})$ et $\mathrm{Im}\,(u - \mathrm{id})$ ont pour somme $\dim E$, et leur intersection est nulle : $E$ est leur somme directe. Écrivons $x = x_{1} + (u - \mathrm{id})(y)$ avec $u(x_{1}) = x_{1}$. Alors $v_{n}(x_{1}) = x_{1}$, et $v_{n}\big((u - \mathrm{id})(y)\big) = (u - \mathrm{id})\big(v_{n}(y)\big) \to 0$ par la question 1. 
    $$\boxed{v_{n}(x) \xrightarrow[n \to +\infty]{} x_{1} = p(x)}$$

    **4.** Les matrices de $v_{n}$ dans une base $(e_{i})$ ont pour colonnes les $v_{n}(e_{i})$, qui convergent vers les $p(e_{i})$ : elles convergent coefficient par coefficient vers celle de $p$ (proposition 13). 
    $$\boxed{v_{n} \xrightarrow[n \to +\infty]{} p \ \text{ dans } \mathcal{L}(E)}$$
     Les moyennes des itérées d'une contraction large convergent vers un projecteur ; les itérées elles-mêmes peuvent ne pas converger, comme pour $u = -\mathrm{id}$.
- id: "mp-05-59"
  feuille: "f-mp-05"
  numero: 59
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
