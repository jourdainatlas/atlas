  enonce: |
    Soit $(u_{n})$ une suite de $E$, $A_{n} = \{u_{p} \mid p \geqslant n\}$, et $V$ l'ensemble des valeurs d'adhérence de $(u_{n})$.

    **1.** Montrer que $V = \bigcap_{n \in \mathbb{N}} \overline{A_{n}}$. Retrouver que $V$ est fermé.

    **2.** On suppose $E$ de dimension finie et $(u_{n})$ bornée. Montrer que $V$ est compact et non vide.
  corrige: |
    **1.** Par la proposition 8 (iii) du chapitre 4, $\lambda$ est valeur d'adhérence si et seulement si, pour tout $n$ et tout $\varepsilon > 0$, il existe $p \geqslant n$ tel que $\lVert u_{p} - \lambda \rVert < \varepsilon$, c'est-à-dire si et seulement si $\lambda \in \overline{A_{n}}$ pour tout $n$. 
    $$\boxed{V = \bigcap_{n} \overline{A_{n}}, \ \text{ intersection de fermés}}$$

    **2.** Les $\overline{A_{n}}$ sont fermés, bornés, donc compacts en dimension finie (proposition 13), non vides et décroissants. L'exercice 22 conclut. 
    $$\boxed{V \text{ est un compact non vide}}$$
