  enonce: |
    Soit $K$ un compact non vide de $E$ et $f : K \to K$ continue. On pose $X_{0} = K$ et $X_{n+1} = f(X_{n})$. Montrer que $X = \bigcap_{n} X_{n}$ est un compact non vide qui vérifie $f(X) = X$. On pourra utiliser l'exercice 22.
  corrige: |
    On a $X_{1} = f(K) \subset K = X_{0}$, puis, par récurrence, $X_{n+1} = f(X_{n}) \subset f(X_{n-1}) = X_{n}$. Les $X_{n}$ sont des compacts non vides (théorème 5), décroissants. Par l'exercice 22, dont la question 3 vaut pour $f : K \to K$ avec la même démonstration, $X$ est un compact non vide et 
    $$f(X) = \bigcap_{n} f(X_{n}) = \bigcap_{n} X_{n+1} = X.$$

    $$\boxed{f(X) = X}$$
