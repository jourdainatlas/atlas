  enonce: |
    Soit $E$ un $\mathbb{R}$-espace vectoriel normé et $K$ une partie compacte de $E$ telle que $0 \notin K$.

    **1.** Montrer que le cône $\mathbb{R}_{+}K = \{\lambda x \mid \lambda \geqslant 0, \ x \in K\}$ est fermé.

    **2.** Montrer par un exemple dans $\mathbb{R}^{2}$ que le résultat est faux si $K$ est seulement supposée fermée.
  corrige: |
    **1.** La norme, continue sur le compact $K$, y atteint un minimum $m$ et un maximum (théorème 6), et $m > 0$ puisque $0 \notin K$. Soit $z_{n} = \lambda_{n}x_{n} \to z$, avec $\lambda_{n} \geqslant 0$ et $x_{n} \in K$. Alors $0 \leqslant \lambda_{n} = \dfrac{\lVert z_{n} \rVert}{\lVert x_{n} \rVert} \leqslant \dfrac{\lVert z_{n} \rVert}{m}$ est bornée. On extrait $x_{\varphi(n)} \to x \in K$, puis, par Bolzano-Weierstrass, $\lambda_{\varphi(\psi(n))} \to \lambda \geqslant 0$ ; la limite de $\lambda_{n}x_{n}$ le long de cette extraction est $z = \lambda x \in \mathbb{R}_{+}K$. 
    $$\boxed{\mathbb{R}_{+}K \text{ est fermé}}$$

    **2.** La droite $K = \{1\} \times \mathbb{R}$ est fermée et ne contient pas $0$, mais $\mathbb{R}_{+}K = \big(]0, +\infty[ \times \mathbb{R}\big) \cup \{(0, 0)\}$ ; les points $(\dfrac{1}{n}, 1)$ y sont et tendent vers $(0, 1)$, qui n'y est pas. C'est la minoration $\lVert x \rVert \geqslant m > 0$ qui manque : sur $K$, la direction de $x$ peut s'approcher de celle de l'axe vertical.
- id: "mp-05-22"
  feuille: "f-mp-05"
  numero: 22
  partie: "Parties compactes"
