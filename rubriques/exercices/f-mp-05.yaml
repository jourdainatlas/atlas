  page_enonce: 5
  page_corrige: 9
  enonce: |
    **1.** Sur $E = \mathcal{C}([0, 2\pi], \mathbb{R})$ muni de la norme $\lVert f \rVert_{2} = \big(\int_{0}^{2\pi} f^{2}\big)^{1/2}$, on pose $f_{n}(x) = \cos(nx)$. Calculer $\lVert f_{n} - f_{p} \rVert_{2}$ pour $n \neq p$ non nuls, et en déduire que la boule unité fermée de $E$ n'est pas compacte.

    **2.** Montrer que la sphère unité de $(\ell^{\infty}, \lVert \cdot \rVert_{\infty})$ n'est pas compacte.

    **3.** Montrer, pour $E \neq \{0\}$ quelconque, que la boule unité fermée est compacte si et seulement si la sphère unité l'est.
  corrige: |
    **1.** Pour $n \neq p$ non nuls, $\mathop{\displaystyle \int_{0}^{2\pi}} \cos^{2}(nx)\,\mathrm{d} x = \pi$ et $\mathop{\displaystyle \int_{0}^{2\pi}} \cos(nx)\cos(px)\,\mathrm{d} x = 0$, d'où 
    $$\lVert f_{n} - f_{p} \rVert_{2}^{2} = \pi + \pi - 0 = 2\pi.$$
     Les fonctions $g_{n} = \dfrac{f_{n}}{\sqrt{\pi}}$ sont de norme $1$ et deux à deux à distance $\sqrt{2}$ : aucune suite extraite ne converge, puisque ses termes devraient se rapprocher. 
    $$\boxed{\lVert f_{n} - f_{p} \rVert_{2} = \sqrt{2\pi} ; \ \text{ la boule unité fermée de } E \text{ n'est pas compacte}}$$

    **2.** Les suites $e_{p}$ de la feuille du chapitre 4 sont de norme $1$ et vérifient $\lVert e_{p} - e_{q} \rVert_{\infty} = 1$ pour $p \neq q$.

    **3.** La sphère est un fermé contenu dans la boule : si la boule est compacte, la sphère l'est (proposition 10). Réciproquement, la boule est l'image de $[0, 1] \times S$ par l'application continue $(t, s) \mapsto ts$, et $[0, 1] \times S$ est compact (proposition 11) si $S$ l'est. 
    $$\boxed{B_{f}(0, 1) \text{ compacte} \iff S(0, 1) \text{ compacte}}$$
- id: "mp-05-26"
  feuille: "f-mp-05"
  numero: 26
  partie: "Applications continues sur une partie compacte"
  etoiles: 1
