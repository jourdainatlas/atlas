  enonce: |
    Soit $\theta \in \mathbb{R}$ et, pour $n \geqslant 1$, $A_{n} = \begin{pmatrix} 1 & -\frac{\theta}{n} \\ \frac{\theta}{n} & 1 \end{pmatrix}$. En identifiant $A_{n}$ à la multiplication par le nombre complexe $1 + \mathrm{i}\frac{\theta}{n}$, étudier la convergence de la suite $(A_{n}^{n})$ et déterminer sa limite.
  corrige: |
    La matrice $A_{n}$ est celle de $z \mapsto z_{n}z$ dans la base $(1, \mathrm{i})$ de $\mathbb{C}$ vu comme $\mathbb{R}$-espace vectoriel, avec $z_{n} = 1 + \mathrm{i}\dfrac{\theta}{n}$ ; $A_{n}^{n}$ est donc celle de la multiplication par $z_{n}^{n}$. On écrit $z_{n} = |z_{n}|\mathrm{e}^{\mathrm{i}\alpha_{n}}$ avec $\alpha_{n} = \arctan\dfrac{\theta}{n}$. Alors 
    $$|z_{n}|^{n} = \exp\Big(\frac{n}{2}\ln\Big(1 + \frac{\theta^{2}}{n^{2}}\Big)\Big) \xrightarrow[n \to +\infty]{} 1, \qquad n\alpha_{n} \xrightarrow[n \to +\infty]{} \theta,$$
     d'où $z_{n}^{n} \to \mathrm{e}^{\mathrm{i}\theta}$. Les coefficients de $A_{n}^{n}$ sont les parties réelle et imaginaire de $z_{n}^{n}$, au signe près ; par la proposition 13 : 
    $$\boxed{A_{n}^{n} \xrightarrow[n \to +\infty]{} \begin{pmatrix} \cos\theta & -\sin\theta \\ \sin\theta & \cos\theta \end{pmatrix}}$$
     C'est l'analogue matriciel de $\big(1 + \dfrac{x}{n}\big)^{n} \to \mathrm{e}^{x}$ : la rotation d'angle $\theta$ apparaît comme la limite de $n$ petites rotations-dilatations.
