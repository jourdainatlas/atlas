  noeuds: [c-uniforme, tr-compacts]
  notions: [compact, fonction-convexe]
  source: "Compacité, connexité par arcs (Sainte-Geneviève), exercice 12"
  page_enonce: 10
  page_corrige: 20
  enonce: |
    Soit $C$ une partie compacte, convexe et non vide de $E$, et $f : C \to C$ une application $1$-lipschitzienne. On fixe $a \in C$ et, pour $n \geqslant 1$, on pose $f_{n}(x) = \big(1 - \frac{1}{n}\big)f(x) + \frac{1}{n}f(a)$.

    **1.** Montrer que $f_{n}$ envoie $C$ dans $C$ et qu'elle est $k_{n}$-lipschitzienne pour un $k_{n} < 1$.

    **2.** En déduire, à l'aide de l'exercice 31, que $f_{n}$ admet un point fixe $x_{n} \in C$.

    **3.** Montrer que $f$ admet un point fixe. Est-il nécessairement unique ?
  corrige: |
    **1.** Le point $f_{n}(x)$ est une combinaison convexe de $f(x)$ et $f(a)$, qui sont dans le convexe $C$. Et $\lVert f_{n}(x) - f_{n}(y) \rVert = \big(1 - \dfrac{1}{n}\big)\lVert f(x) - f(y) \rVert \leqslant \big(1 - \dfrac{1}{n}\big)\lVert x - y \rVert$. 
    $$\boxed{k_{n} = 1 - \frac{1}{n} < 1}$$

    **2.** Pour $x \neq y$, $\lVert f_{n}(x) - f_{n}(y) \rVert \leqslant k_{n}\lVert x - y \rVert < \lVert x - y \rVert$, et $C$ est compact : l'exercice 31 fournit un point fixe $x_{n}$.

    **3.** On a $\lVert f(x_{n}) - x_{n} \rVert = \lVert f(x_{n}) - f_{n}(x_{n}) \rVert = \dfrac{1}{n}\lVert f(x_{n}) - f(a) \rVert \leqslant \dfrac{\delta(C)}{n}$, où $\delta(C)$ est le diamètre de $C$. On extrait $x_{\varphi(n)} \to x \in C$ ; par continuité de $f$, $f(x) - x = \mathop{\displaystyle \lim} \big(f(x_{\varphi(n)}) - x_{\varphi(n)}\big) = 0$. 
    $$\boxed{f \text{ admet un point fixe, pas nécessairement unique (exemple : } f = \mathrm{id})}$$
     La convexité sert à fabriquer les applications strictement contractantes $f_{n}$ ; sans elle, une rotation d'un cercle est $1$-lipschitzienne sans point fixe.
- id: "mp-05-60"
  feuille: "f-mp-05"
  numero: 60
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [synthèse, compacité, ouverts et fermés, densité]
  noeuds: [tr-compacts, tr-ouverts, tr-dense]
  notions: [compact, ouvert, partie-dense]
  source: "Topologie (LLG), exercice 80 ; Compacité, connexité par arcs (Sainte-Geneviève), exercice 54 ; BibM@th, Topologie des espaces vectoriels normés, exercice 27"
  page_enonce: 10
  page_corrige: 20
  enonce: |
    *Sous-groupes compacts de $\mathbb{C}^{*}$.* Soit $G$ un sous-groupe compact du groupe multiplicatif $\mathbb{C}^{*}$.

    **1.** Montrer que $G \subset \mathbb{U}$.

    **2.** Soit $H$ un sous-groupe non nul de $(\mathbb{R}, +)$, et $m = \inf(H \cap \, ]0, +\infty[)$. Montrer que si $m > 0$, alors $H = m\mathbb{Z}$, et que si $m = 0$, $H$ est dense dans $\mathbb{R}$.

    **3.** On pose $H = \{\theta \in \mathbb{R} \mid \mathrm{e}^{\mathrm{i}\theta} \in G\}$. Montrer que $H$ est un sous-groupe fermé de $\mathbb{R}$ contenant $2\pi$.

    **4.** En déduire que $G = \mathbb{U}$ ou que $G$ est le groupe $\mathbb{U}_{n}$ des racines $n$-ièmes de l'unité pour un entier $n \geqslant 1$.
  corrige: |
    **1.** Soit $z \in G$. Les puissances $z^{n}$, $n \in \mathbb{Z}$, sont dans $G$, qui est borné. Si $|z| > 1$, $|z^{n}| \to +\infty$ ; si $|z| < 1$, $|z^{-n}| \to +\infty$. Donc $|z| = 1$.

    **2.** Supposons $m > 0$. Si $m \notin H$, il existe $h_{1} > h_{2}$ dans $H \cap \, ]m, 2m[$, et $h_{1} - h_{2} \in H \cap \, ]0, m[$ : c'est absurde. Donc $m \in H$ et $m\mathbb{Z} \subset H$ ; pour $h \in H$, $h - m\lfloor \dfrac{h}{m} \rfloor \in H \cap [0, m[$ est nul, donc $h \in m\mathbb{Z}$. Si $m = 0$, pour tout $\varepsilon > 0$, il existe $h \in H \cap \, ]0, \varepsilon[$, et tout réel est à moins de $\varepsilon$ d'un multiple de $h$. 
    $$\boxed{H = m\mathbb{Z} \ (m > 0) \quad \text{ou} \quad H \text{ dense } (m = 0)}$$

    **3.** Si $\theta$, $\theta' \in H$, alors $\mathrm{e}^{\mathrm{i}(\theta - \theta')} = \mathrm{e}^{\mathrm{i}\theta}(\mathrm{e}^{\mathrm{i}\theta'})^{-1} \in G$, et $2\pi \in H$ puisque $1 \in G$. Si $\theta_{n} \to \theta$ avec $\theta_{n} \in H$, alors $\mathrm{e}^{\mathrm{i}\theta_{n}} \to \mathrm{e}^{\mathrm{i}\theta}$, qui est dans le fermé $G$ : $H$ est fermé.

    **4.** Si $H$ est dense, il est égal à son adhérence $\mathbb{R}$, et $G = \mathbb{U}$. Sinon $H = m\mathbb{Z}$, et $2\pi \in H$ donne $m = \dfrac{2\pi}{n}$ avec $n \geqslant 1$ : $G = \{\mathrm{e}^{2\mathrm{i} k\pi/n}\} = \mathbb{U}_{n}$. 
    $$\boxed{G = \mathbb{U} \quad \text{ou} \quad G = \mathbb{U}_{n}}$$
- id: "mp-05-61"
  feuille: "f-mp-05"
