  enonce: |
    *L'ensemble de Cantor.* On pose $K_{0} = [0, 1]$ et, pour tout $n$, on obtient $K_{n+1}$ en retirant à chacun des $2^{n}$ segments $[\alpha, \beta]$ qui composent $K_{n}$, de longueur $3^{-n}$, son tiers central ouvert $\big]\frac{2\alpha + \beta}{3}, \frac{\alpha + 2\beta}{3}\big[$.

    **1.** Montrer que $K = \bigcap_{n} K_{n}$ est un compact non vide de $\mathbb{R}$, qui contient $0$, $1$, $\frac{1}{3}$ et $\frac{2}{3}$.

    **2.** Montrer que $K$ est d'intérieur vide.

    **3.** Montrer que $\frac{1}{4}$ appartient à $K$, bien qu'il ne soit extrémité d'aucun des segments des $K_{n}$.
  corrige: |
    **1.** Chaque $K_{n}$ est une réunion finie de segments, donc fermé, et $K$ est fermé et contenu dans $[0, 1]$ : il est compact (proposition 12). Les extrémités des segments de $K_{n}$ restent des extrémités de segments de $K_{n+1}$ : elles sont dans tous les $K_{p}$ ultérieurs. En particulier $0$, $1$, $\dfrac{1}{3}$, $\dfrac{2}{3} \in K$.

    **2.** Si $K$ contenait un intervalle $J$ de longueur $\ell > 0$, cet intervalle, contenu dans la réunion disjointe des segments de $K_{n}$, serait contenu dans l'un d'eux : sinon il contiendrait un point d'un « trou ». Donc $\ell \leqslant 3^{-n}$ pour tout $n$, ce qui est absurde. 
    $$\boxed{K \text{ est un compact non vide d'intérieur vide}}$$

    **3.** Par récurrence, $K_{n+1} = \dfrac{1}{3}K_{n} \cup \big(\dfrac{2}{3} + \dfrac{1}{3}K_{n}\big)$ : retirer les tiers centraux commute avec les deux similitudes $x \mapsto \dfrac{x}{3}$ et $x \mapsto \dfrac{2 + x}{3}$. Ainsi, pour $x \leqslant \dfrac{1}{3}$, $x \in K_{n+1} \iff 3x \in K_{n}$, et pour $x \geqslant \dfrac{2}{3}$, $x \in K_{n+1} \iff 3x - 2 \in K_{n}$. Comme $3 \cdot \dfrac{1}{4} = \dfrac{3}{4}$ et $3 \cdot \dfrac{3}{4} - 2 = \dfrac{1}{4}$, une récurrence montre que $\dfrac{1}{4}$ et $\dfrac{3}{4}$ sont dans tous les $K_{n}$. Les extrémités des segments de $K_{n}$ sont de la forme $\dfrac{k}{3^{n}}$, et $\dfrac{1}{4} = \dfrac{k}{3^{n}}$ imposerait $3^{n} = 4k$. 
    $$\boxed{\tfrac{1}{4} \in K, \text{ sans être une extrémité de segment}}$$
     En base $3$, $\dfrac{1}{4} = 0{,}0202\ldots$ : l'ensemble de Cantor est formé des nombres qui ont un développement triadique sans chiffre $1$.
- id: "mp-05-25"
