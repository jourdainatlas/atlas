  enonce: |
    Soit $E$ de dimension finie et $X$ une partie connexe par arcs de $\mathcal{L}(E)$ formée de projecteurs. Montrer que tous les éléments de $X$ ont le même rang. On pourra utiliser la trace.
  corrige: |
    Le rang d'un projecteur est égal à sa trace (chapitre 16 de MPSI). La trace est continue sur $\mathcal{L}(E)$, de dimension finie (proposition 14). Si $p$, $q \in X$ et $\gamma$ est un chemin de $p$ à $q$ dans $X$, la fonction $t \mapsto \operatorname{tr}\gamma(t) = \mathrm{rg}\gamma(t)$ est continue et à valeurs entières : son image est un intervalle de $\mathbb{R}$ contenu dans $\mathbb{N}$, donc un singleton (théorème 11). 
    $$\boxed{\mathrm{rg} p = \mathrm{rg} q}$$
- id: "mp-05-52"
  feuille: "f-mp-05"
  numero: 52
  partie: "Connexité par arcs"
  etoiles: 2
