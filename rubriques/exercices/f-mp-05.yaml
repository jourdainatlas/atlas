  enonce: |
    Soit $(A_{k})$ et $(B_{k})$ deux suites de $\mathcal{M}_{n}(\mathbb{K})$ qui convergent vers $A$ et $B$, avec $A_{k}$ semblable à $B_{k}$ pour tout $k$. Les matrices $A$ et $B$ sont-elles semblables ? Ont-elles le même polynôme caractéristique ?
  corrige: |
    Les matrices $A_{k} = \dfrac{1}{k}E_{12}$ et $B_{k} = E_{12}$ sont semblables : 
    $$D_{k}^{-1}E_{12}D_{k} = \frac{1}{k}E_{12}, \qquad D_{k} = \operatorname{diag}\Big(1, \frac{1}{k}, 1, \dots, 1\Big).$$
     Leurs limites $0$ et $E_{12}$ ne le sont pas. En revanche, $\chi_{A_{k}} = \chi_{B_{k}}$, et les coefficients du polynôme caractéristique sont continus (proposition 14) : $\chi_{A} = \chi_{B}$. 
    $$\boxed{A \text{ et } B \text{ ne sont pas forcément semblables, mais } \chi_{A} = \chi_{B}}$$
     La classe de similitude de $E_{12}$ n'est pas fermée : elle contient des matrices arbitrairement proches de $0$.
