  source: "BibM@th, Topologie des espaces vectoriels normés, exercices 45, 47 et 51 ; Topologie des espaces normés (Prost), exercice 20"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    On munit $\mathbb{R}[X]$ de la norme $N_{1}\big(\sum a_{k}X^{k}\big) = \sum |a_{k}|$. Étudier la continuité des endomorphismes suivants, et calculer leur norme subordonnée lorsqu'ils sont continus : 
    $$P \mapsto XP, \qquad P \mapsto AP \ (A \in \mathbb{R}[X] \text{ fixé}), \qquad P \mapsto P', \qquad P \mapsto \int_{0}^{X} P(t)\,\mathrm{d} t, \qquad P \mapsto P(X + 1).$$
     Pour la multiplication par $A$, on se contentera d'une majoration de la norme subordonnée.
  corrige: |
    On teste chaque application sur les $X^{n}$, de norme $1$, puis on majore. La multiplication par $X$ décale les coefficients : $N_{1}(XP) = N_{1}(P)$. Pour $A = \mathop{\displaystyle \sum} a_{i}X^{i}$ et $P = \mathop{\displaystyle \sum} p_{j}X^{j}$, le coefficient de $X^{k}$ dans $AP$ est $\mathop{\displaystyle \sum_{i + j = k}} a_{i}p_{j}$, d'où 
    $$N_{1}(AP) \leqslant \sum_{k}\sum_{i + j = k} |a_{i}|\,|p_{j}| = N_{1}(A)N_{1}(P),$$
     avec égalité pour $P = 1$. L'intégration envoie $X^{k}$ sur $\dfrac{X^{k+1}}{k + 1}$, d'où $N_{1}\big(\mathop{\displaystyle \int_{0}^{X}} P\big) \leqslant N_{1}(P)$, avec égalité pour $P = 1$. En revanche, $N_{1}(D(X^{n})) = n$ et $N_{1}\big((X + 1)^{n}\big) = 2^{n}$ ne sont pas bornés. 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|P \mapsto XP|\mkern-1.5mu|\mkern-1.5mu| = 1, \qquad |\mkern-1.5mu|\mkern-1.5mu|P \mapsto AP|\mkern-1.5mu|\mkern-1.5mu| = N_{1}(A), \qquad |\mkern-1.5mu|\mkern-1.5mu|P \mapsto \textstyle\int_{0}^{X} P|\mkern-1.5mu|\mkern-1.5mu| = 1}$$

    $$\boxed{D \text{ et } P \mapsto P(X + 1) \text{ ne sont pas continues}}$$
