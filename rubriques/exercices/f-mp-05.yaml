  enonce: |
    *Théorème de Darboux.* Soit $I$ un intervalle ouvert et $f : I \to \mathbb{R}$ dérivable. On pose 
    $$A = \{(x, y) \in I^{2} \mid x < y\}, \qquad g(x, y) = \frac{f(y) - f(x)}{y - x}.$$

    **1.** Montrer que $g(A)$ est un intervalle.

    **2.** Montrer que $g(A) \subset f'(I) \subset \overline{g(A)}$.

    **3.** En déduire que $f'(I)$ est un intervalle, bien que $f'$ ne soit pas supposée continue.
  corrige: |
    **1.** La partie $A$ est convexe (exercice 46), et $g$ est continue : $g(A)$ est un intervalle (théorème 11).

    **2.** Par le théorème des accroissements finis, $g(x, y) = f'(c)$ avec $c \in \, ]x, y[ \subset I$ : $g(A) \subset f'(I)$. Pour $t \in I$, comme $I$ est ouvert, $g(t, t + h)$ est défini pour $h > 0$ petit et tend vers $f'(t)$ : $f'(t) \in \overline{g(A)}$.

    **3.** Une partie comprise entre un intervalle $J$ et son adhérence est un intervalle, puisque $\overline{J}$ ne diffère de $J$ que par d'éventuelles extrémités. 
    $$\boxed{f'(I) \text{ est un intervalle}}$$
     Une dérivée vérifie donc la propriété des valeurs intermédiaires sans être continue : par exemple, la dérivée de $x \mapsto x^{2}\sin\dfrac{1}{x}$, prolongée par $0$, n'est pas continue en $0$.
