  source: "Compacité, connexité par arcs (Sainte-Geneviève), exercice 93 ; Topologie (LLG), exercice 13"
  page_enonce: 9
  page_corrige: 17
  enonce: |
    *Passage des douanes.* Soit $A$ une partie de $E$.

    **1.** Soit $\gamma : [0, 1] \to E$ continue, avec $\gamma(0) \in A$ et $\gamma(1) \notin A$. Montrer qu'il existe $c \in [0, 1]$ tel que $\gamma(c) \in \operatorname{Fr}(A)$. On pourra considérer $c = \sup\{t \in [0, 1] \mid \gamma([0, t]) \subset A\}$.

    **2.** Soit $\Gamma$ une partie connexe par arcs qui rencontre $A$ et $E \setminus A$. Montrer que $\Gamma$ rencontre $\operatorname{Fr}(A)$.

    **3.** En déduire que si $A \neq \emptyset$ et $A \neq E$, la frontière de $A$ n'est pas vide.
  corrige: |
    **1.** L'ensemble $T = \{t \in [0, 1] \mid \gamma([0, t]) \subset A\}$ contient $0$ ; soit $c$ sa borne supérieure. Pour $s < c$, il existe $t \in T$ avec $t > s$, donc $\gamma(s) \in A$ : $\gamma(c)$ est limite de points de $\gamma([0, c[) \subset A$, ou égal à $\gamma(0) \in A$ si $c = 0$, donc $\gamma(c) \in \overline{A}$. Si $c = 1$, $\gamma(c) = \gamma(1) \notin A$. Si $c < 1$, pour tout $s \in \, ]c, 1]$, $s \notin T$, donc il existe $s' \in [c, s]$ tel que $\gamma(s') \notin A$ : $\gamma(c)$ est limite de points de $E \setminus A$. Dans les deux cas, $\gamma(c) \in \overline{A} \cap \overline{E \setminus A} = \operatorname{Fr}(A)$.

    **2.** Soit $a \in \Gamma \cap A$ et $b \in \Gamma \setminus A$, et $\gamma$ un chemin de $a$ à $b$ dans $\Gamma$. Par la question 1, un point $\gamma(c)$ de $\Gamma$ est dans $\operatorname{Fr}(A)$.

    **3.** On applique la question 2 à $\Gamma = E$, connexe par arcs puisque convexe. 
    $$\boxed{A \neq \emptyset, \ A \neq E \implies \operatorname{Fr}(A) \neq \emptyset}$$
     On retrouve que $\emptyset$ et $E$ sont les seules parties à la fois ouvertes et fermées : pour une telle partie, $\operatorname{Fr}(A) = \overline{A} \setminus \mathring{A} = A \setminus A = \emptyset$.
- id: "mp-05-53"
  feuille: "f-mp-05"
  numero: 53
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [synthèse, applications lipschitziennes, continuité uniforme, norme subordonnée, compacité, Bolzano-Weierstrass, bornes atteintes, normes en dimension finie]
  noeuds: [c-uniforme, c-heine, gd-normes, tr-compacts, ar-bw, gd-equivalence, tr-connexes, tr-ouverts]
  notions: [continuite-uniforme, norme-subordonnee, compact, normes-equivalentes, connexe-par-arcs, ouvert]
  page_enonce: 9
  page_corrige: 17
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par un renvoi précis au cours ou par un contre-exemple.

    **1.** L'image d'un fermé par une application continue est fermée.

    **2.** L'image réciproque d'un compact par une application continue est compacte.

    **3.** Toute application linéaire de $\mathbb{R}^{n}$ dans un espace vectoriel normé est continue.

    **4.** Une fonction réelle continue sur une partie fermée et bornée d'un espace vectoriel normé y atteint ses bornes.

    **5.** Toute norme subordonnée vérifie $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{id}_{E}|\mkern-1.5mu|\mkern-1.5mu| = 1$.

    **6.** Pour $n \geqslant 2$, la norme $A \mapsto \max_{i, j} |a_{ij}|$ est subordonnée à une norme de $\mathbb{K}^{n}$.

    **7.** Une application lipschitzienne est uniformément continue.

    **8.** L'image d'une partie connexe par arcs par une application continue est connexe par arcs.

    **9.** Dans un espace de dimension finie, toute suite bornée a une valeur d'adhérence.

    **10.** Une partie fermée contenue dans un compact est compacte.
  corrige: |
    **1. Faux.** La fonction $\arctan$ envoie le fermé $\mathbb{R}$ sur $\big]-\dfrac{\pi}{2}, \dfrac{\pi}{2}\big[$, qui n'est pas fermé.

    **2. Faux.** L'image réciproque du compact $\{0\}$ par la fonction nulle de $\mathbb{R}$ dans $\mathbb{R}$ est $\mathbb{R}$.

    **3. Vrai.** C'est la proposition 14 (ii) : l'espace de départ est de dimension finie.

    **4. Faux.** Dans $E = \mathcal{C}([0, 1], \mathbb{R})$ muni de $\lVert \cdot \rVert_{\infty}$, soit $B$ la boule unité fermée et $\Phi(g) = \mathop{\displaystyle \int_{0}^{1}} g - g(0)$, qui est $2$-lipschitzienne. Sur $B$, $\Phi \leqslant 2$, et les fonctions $g_{n} = \mathop{\displaystyle \min}(1, -1 + 2nt)$ donnent $\Phi(g_{n}) = 2 - \dfrac{1}{n}$. Si $\Phi(g) = 2$, alors $\mathop{\displaystyle \int_{0}^{1}}(1 - g) + \big(1 + g(0)\big) = 0$, avec deux termes positifs : $g = 1$ et $g(0) = -1$, ce qui est absurde. Le résultat est vrai en dimension finie, où les fermés bornés sont compacts.

    **5. Vrai.** Pour $x \neq 0$, $\dfrac{\lVert \mathrm{id}(x) \rVert}{\lVert x \rVert} = 1$.

    **6. Faux.** Une norme subordonnée est sous-multiplicative (proposition 7), et $\mathop{\displaystyle \max_{i, j}} |a_{ij}|$ ne l'est pas : $J^{2} = nJ$ (exercice 12 de la feuille du chapitre 4).

    **7. Vrai.** C'est la proposition 5.

    **8. Vrai.** C'est le théorème 11.

    **9. Vrai.** C'est la proposition 13 (iv).

    **10. Vrai.** Une partie fermée de $E$ contenue dans $K$ en est un fermé relatif, et la proposition 10 (i) s'applique. 
    $$\boxed{\text{Vrai : } 3, 5, 7, 8, 9, 10 \qquad \text{Faux : } 1, 2, 4, 6}$$
     *À retenir.* Les propriétés passent des ouverts et fermés de l'arrivée à ceux du départ (image réciproque), mais passent des compacts et des connexes par arcs du départ à ceux de l'arrivée (image directe).
- id: "mp-05-54"
  feuille: "f-mp-05"
  numero: 54
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [synthèse, bornes atteintes, topologie des matrices]
  noeuds: [tr-compacts, gd-normes]
  notions: [produit-scalaire, valeur-propre]
  source: "BibM@th, Compléments de topologie, exercice 18"
  page_enonce: 9
  page_corrige: 18
  enonce: |
    *Vers le théorème spectral.* On munit $\mathbb{R}^{n}$ de son produit scalaire canonique et de la norme associée ; soit $S$ la sphère unité et $A \in \mathcal{M}_{n}(\mathbb{R})$ une matrice symétrique. On pose $\varphi(x) = \langle Ax, x \rangle$.

    **1.** Montrer que $\varphi$ atteint sur $S$ un maximum, en un point $x_{0}$.

    **2.** Soit $h$ orthogonal à $x_{0}$. Pour $t \in \mathbb{R}$, on pose $y(t) = \frac{x_{0} + th}{\lVert x_{0} + th \rVert}$. Calculer $\varphi\big(y(t)\big)$, et en déduire, en étudiant cette fonction de $t$ au voisinage de $0$, que $\langle Ax_{0}, h \rangle = 0$.

    **3.** En déduire que $x_{0}$ est un vecteur propre de $A$, associé à la valeur propre $\varphi(x_{0})$.

    **4.** Montrer que l'orthogonal de $x_{0}$ est stable par $A$. Comment pourrait-on poursuivre ?
  corrige: |
    **1.** La sphère $S$ est fermée et bornée, donc compacte (proposition 13), et $\varphi$, polynomiale en les coordonnées, est continue : elle atteint son maximum en un point $x_{0}$ (théorème 6).

    **2.** Comme $h \perp x_{0}$ et $\lVert x_{0} \rVert = 1$, le théorème de Pythagore donne $\lVert x_{0} + th \rVert^{2} = 1 + t^{2}\lVert h \rVert^{2}$. La symétrie de $A$ donne $\langle Ax_{0}, h \rangle = \langle x_{0}, Ah \rangle$, d'où 
    $$\varphi\big(y(t)\big) = \frac{\varphi(x_{0}) + 2t\langle Ax_{0}, h \rangle + t^{2}\langle Ah, h \rangle}{1 + t^{2}\lVert h \rVert^{2}}.$$
     Cette fonction dérivable de $t$ est maximale en $t = 0$, donc sa dérivée en $0$, qui vaut $2\langle Ax_{0}, h \rangle$, est nulle. 
    $$\boxed{\langle Ax_{0}, h \rangle = 0 \ \text{ pour tout } h \perp x_{0}}$$

    **3.** Le vecteur $Ax_{0}$ est orthogonal à $x_{0}^{\perp}$, donc colinéaire à $x_{0}$ (chapitre 19 de MPSI) : $Ax_{0} = \lambda x_{0}$, et $\lambda = \langle Ax_{0}, x_{0} \rangle = \varphi(x_{0})$. 
    $$\boxed{Ax_{0} = \varphi(x_{0})\,x_{0}}$$

    **4.** Si $y \perp x_{0}$, alors $\langle Ay, x_{0} \rangle = \langle y, Ax_{0} \rangle = \lambda\langle y, x_{0} \rangle = 0$ : $x_{0}^{\perp}$ est stable par $A$. La restriction de $A$ à cet hyperplan est encore « symétrique » ; en recommençant, on construit une base orthonormée de vecteurs propres. C'est le théorème spectral, que le chapitre 7 établira : la compacité de la sphère fournit le premier vecteur propre, sans calcul de polynôme caractéristique.
