  page_enonce: 8
  page_corrige: 16
  enonce: |
    **1.** Soit $\Omega$ un ouvert de $\mathbb{R}^{d}$. Montrer que les composantes connexes par arcs de $\Omega$ sont des ouverts.

    **2.** En déduire que tout ouvert de $\mathbb{R}$ est une réunion d'intervalles ouverts deux à deux disjoints, et que ces intervalles sont en nombre fini ou dénombrable. On pourra choisir un rationnel dans chacun.
  corrige: |
    **1.** Soit $C$ une composante et $y \in C$. Comme $\Omega$ est ouvert, il contient une boule $B(y, r)$, convexe : tout point de la boule est joint à $y$ par un segment contenu dans $\Omega$, donc est dans $C$. Ainsi $C$ est ouverte.

    **2.** Les composantes d'un ouvert de $\mathbb{R}$ sont des parties connexes par arcs de $\mathbb{R}$, donc des intervalles (théorème 10), et des ouverts par la question 1 : ce sont des intervalles ouverts, deux à deux disjoints (ce sont des classes d'équivalence). Chacun, ouvert et non vide, contient un rationnel ; en choisissant un rationnel dans chacun, on définit une injection de l'ensemble des composantes dans $\mathbb{Q}$. 
    $$\boxed{\text{Un ouvert de } \mathbb{R} \text{ est réunion d'une famille finie ou dénombrable d'intervalles ouverts disjoints}}$$
