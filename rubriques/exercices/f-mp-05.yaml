  enonce: |
    Soit $I$ un intervalle et $f : I \to \mathbb{R}$ continue et injective. On pose $C = \{(x, y) \in I^{2} \mid x < y\}$ et $F(x, y) = f(y) - f(x)$. Montrer que $C$ est convexe, puis que $F(C)$ est un intervalle ne contenant pas $0$. En déduire que $f$ est strictement monotone.
  corrige: |
    Si $x < y$ et $x' < y'$, alors $(1 - t)x + tx' < (1 - t)y + ty'$ pour $t \in [0, 1]$ : $C$ est convexe, donc connexe par arcs. La fonction continue $F$ envoie $C$ sur un intervalle (théorème 11), qui ne contient pas $0$ puisque $f$ est injective. Donc $F > 0$ sur $C$, ou $F < 0$ sur $C$. 
    $$\boxed{f \text{ est strictement croissante ou strictement décroissante}}$$
- id: "mp-05-47"
  feuille: "f-mp-05"
