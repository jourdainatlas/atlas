    Soit $(a, b, c) \in \mathbb{C}^{3}$ et $\mathcal{S}$ l'ensemble des suites complexes $u$ telles que $u_{n+3} = au_{n+2} + bu_{n+1} + cu_{n}$ pour tout $n$. Montrer qu'il existe une constante $A$ telle que $|u_{1854}| \leqslant A\big(|u_{0}| + |u_{1}| + |u_{2}|\big)$ pour toute $u \in \mathcal{S}$.
  corrige: |
    L'ensemble $\mathcal{S}$ est un $\mathbb{C}$-espace vectoriel, et $u \mapsto (u_{0}, u_{1}, u_{2})$ en est un isomorphisme sur $\mathbb{C}^{3}$ (une suite récurrente d'ordre $3$ est déterminée par ses trois premiers termes) : $\mathcal{S}$ est de dimension $3$, et $N(u) = |u_{0}| + |u_{1}| + |u_{2}|$ est une norme sur $\mathcal{S}$. La forme linéaire $u \mapsto u_{1854}$ est continue (proposition 14), d'où la constante $A$ par le théorème 3. 
    $$\boxed{\exists A, \ \forall u \in \mathcal{S}, \quad |u_{1854}| \leqslant A\big(|u_{0}| + |u_{1}| + |u_{2}|\big)}$$
     L'argument ne donne pas la valeur de $A$ : c'est la norme subordonnée de la forme linéaire, que l'on pourrait calculer à partir des racines de $X^{3} - aX^{2} - bX - c$.
