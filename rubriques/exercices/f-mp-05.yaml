  notions: [continuite, partie-dense]
  source: "BibM@th, Topologie des espaces vectoriels normés, exercices 29 et 34 ; Topologie (LLG), exercice 19"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **1.** Soit $h : E \to F$ continue en $0$ telle que $h(x) = h\big(\frac{x}{2}\big)$ pour tout $x$. Montrer que $h$ est constante.

    **2.** Soit $f : \mathbb{R} \to \mathbb{R}$ continue telle que, pour tous réels $x$ et $y$, 
    $$f\Big(\frac{x + y}{2}\Big) = \frac{f(x) + f(y)}{2}.$$
     On pose $g(x) = f(x) - f(0) - \big(f(1) - f(0)\big)x$. Montrer que $g$ est nulle sur l'ensemble $D$ des nombres dyadiques $\frac{p}{2^{n}}$, avec $p \in \mathbb{Z}$ et $n \in \mathbb{N}$, puis que $D$ est dense dans $\mathbb{R}$. En déduire que $f$ est affine.
  corrige: |
    **1.** Par récurrence, $h(x) = h\big(\dfrac{x}{2^{n}}\big)$ pour tout $n$. Comme $\dfrac{x}{2^{n}} \xrightarrow[n \to +\infty]{} 0$ et que $h$ est continue en $0$, $h(x) = h(0)$. 
    $$\boxed{h \text{ est constante}}$$

    **2.** La partie affine $x \mapsto f(0) + \big(f(1) - f(0)\big)x$ vérifie la relation avec égalité, donc $g$ la vérifie aussi, et $g(0) = g(1) = 0$. Avec $y = 0$, la relation donne $g\big(\dfrac{x}{2}\big) = \dfrac{g(x)}{2}$. Avec $(x, y) = (n - 1, n + 1)$, elle donne $g(n + 1) = 2g(n) - g(n - 1)$, d'où $g(n) = 0$ pour tout $n \in \mathbb{N}$ par récurrence double, et de même pour les entiers négatifs. Ensuite $g\big(\dfrac{p}{2^{n}}\big) = \dfrac{g(p)}{2^{n}} = 0$. Enfin, $D$ est dense : pour $x \in \mathbb{R}$, $\dfrac{\lfloor 2^{n}x \rfloor}{2^{n}} \in D$ et $0 \leqslant x - \dfrac{\lfloor 2^{n}x \rfloor}{2^{n}} < \dfrac{1}{2^{n}}$. La fonction continue $g$, nulle sur la partie dense $D$, est nulle (proposition 4). 
    $$\boxed{f(x) = f(0) + \big(f(1) - f(0)\big)x : \ f \text{ est affine}}$$
     Sans hypothèse de continuité, le résultat est faux : la relation n'impose que la « $\mathbb{Q}$-affinité », et il existe des solutions non affines, mais leur construction demande l'axiome du choix.
- id: "mp-05-10"
