  source: "BibM@th, Compléments de topologie, exercice 16 ; Compacité, connexité par arcs (Sainte-Geneviève), exercice 11 ; Topologie (LLG), exercice 97 ; Topologie des espaces normés (Prost), exercice 37"
  page_enonce: 6
