  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [synthèse, applications lipschitziennes, normes en dimension finie, ouverts et fermés]
  noeuds: [c-uniforme, gd-equivalence, tr-ouverts]
  notions: [normes-equivalentes, ouvert]
  source: "Compacité, connexité par arcs (Sainte-Geneviève), exercice 36"
  page_enonce: 11
  page_corrige: 21
  enonce: |
    *Boule de Tchebychev.* Soit $E$ un espace vectoriel normé de dimension finie et $K$ une partie bornée non vide de $E$. Pour $c \in E$, on pose $r(c) = \sup_{x \in K} \lVert x - c \rVert$.

    **1.** Montrer que $r$ est $1$-lipschitzienne et que $r(c) \to +\infty$ lorsque $\lVert c \rVert \to +\infty$. En déduire qu'il existe une boule fermée de rayon minimal contenant $K$.

    **2.** Dans $\mathbb{R}^{2}$ muni de $\lVert \cdot \rVert_{\infty}$, avec $K = \{(-1, 0), (1, 0)\}$, déterminer toutes les boules fermées de rayon minimal contenant $K$.

    **3.** On suppose la norme euclidienne. Soit $c_{1}$ et $c_{2}$ deux centres de boules de rayon minimal $R$ contenant $K$, et $m$ leur milieu. À l'aide de l'identité du parallélogramme, montrer que 
    $$\lVert x - m \rVert^{2} \leqslant R^{2} - \tfrac{1}{4}\lVert c_{1} - c_{2} \rVert^{2} \quad (x \in K).$$
     En déduire que la boule de rayon minimal est unique.

    **4.** La norme étant toujours euclidienne, soit $f : E \to E$ une isométrie, c'est-à-dire une application telle que $\lVert f(x) - f(y) \rVert = \lVert x - y \rVert$ pour tous $x$, $y$, qui vérifie $f(K) = K$. Montrer que $f$ fixe le centre de la boule de rayon minimal.
  corrige: |
    **1.** Pour $x \in K$, $\lVert x - c \rVert \leqslant \lVert x - c' \rVert + \lVert c' - c \rVert \leqslant r(c') + \lVert c - c' \rVert$ : $r(c) \leqslant r(c') + \lVert c - c' \rVert$, et l'on échange $c$ et $c'$. Pour un $x_{0} \in K$, $r(c) \geqslant \lVert c \rVert - \lVert x_{0} \rVert \to +\infty$. Par l'exercice 42, $r$ atteint un minimum $R$ en un point $c_{0}$ : la boule $B_{f}(c_{0}, R)$ contient $K$, et toute boule fermée $B_{f}(c, \rho)$ contenant $K$ vérifie $\rho \geqslant r(c) \geqslant R$. 
    $$\boxed{\text{Il existe une boule fermée de rayon minimal contenant } K}$$

    **2.** Pour tout $c$, $r(c) \geqslant \dfrac{1}{2}\lVert (1, 0) - (-1, 0) \rVert_{\infty} = 1$. Si $c = (s, t)$ avec $s \neq 0$, l'un des écarts $|s \pm 1|$ dépasse $1$ ; si $s = 0$, $r(c) = \mathop{\displaystyle \max}(1, |t|)$. 
    $$\boxed{\text{Les boules minimales sont les } B_{f}\big((0, t), 1\big), \ t \in [-1, 1]}$$
     Les carrés de demi-côté $1$ centrés sur le segment vertical $\{0\} \times [-1, 1]$ contiennent tous les deux points : il y a une infinité de boules minimales.

    **3.** L'identité du parallélogramme (exercice 8 de la feuille du chapitre 4), appliquée à $x - c_{1}$ et $x - c_{2}$, de somme $2(x - m)$ et de différence $c_{2} - c_{1}$, donne 
    $$4\lVert x - m \rVert^{2} = 2\lVert x - c_{1} \rVert^{2} + 2\lVert x - c_{2} \rVert^{2} - \lVert c_{1} - c_{2} \rVert^{2} \leqslant 4R^{2} - \lVert c_{1} - c_{2} \rVert^{2}.$$
     Donc $r(m)^{2} \leqslant R^{2} - \dfrac{1}{4}\lVert c_{1} - c_{2} \rVert^{2}$, et la minimalité $r(m) \geqslant R$ impose $c_{1} = c_{2}$. 
    $$\boxed{\text{En norme euclidienne, la boule minimale est unique}}$$

    **4.** Soit $c$ le centre de la boule minimale. Une isométrie envoie $B_{f}(c, R)$ dans $B_{f}\big(f(c), R\big)$, d'où 
    $$K = f(K) \subset B_{f}\big(f(c), R\big) ;$$
     cette boule est aussi minimale, et par unicité $f(c) = c$. 
    $$\boxed{f(c) = c}$$
     C'est un argument classique pour trouver un point fixe commun à un groupe d'isométries qui laisse une partie bornée invariante : le centre de la boule minimale est déterminé par $K$ seul, donc respecté par toute symétrie de $K$.

