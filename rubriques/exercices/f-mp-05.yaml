  source: "BibM@th, Compléments de topologie, exercice 12 ; Topologie des espaces normés (Prost), exercice 34 ; Compacité, connexité par arcs (Sainte-Geneviève), exercice 3 ; Topologie (LLG), exercice 84"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    *Compacts emboîtés.* Soit $(K_{n})$ une suite décroissante de compacts non vides de $E$, et $K = \bigcap_{n} K_{n}$.

    **1.** Montrer que $K$ est compact et non vide.

    **2.** Montrer que tout ouvert $U$ contenant $K$ contient l'un des $K_{n}$.

    **3.** Soit $f : E \to F$ continue. Montrer que $f(K) = \bigcap_{n} f(K_{n})$.
  corrige: |
    **1.** La partie $K$ est une intersection de fermés contenue dans le compact $K_{0}$ : elle est compacte (proposition 10). Pour tout $n$, choisissons $x_{n} \in K_{n} \subset K_{0}$, et extrayons $x_{\varphi(n)} \to x$. Pour $p$ fixé, $x_{\varphi(n)} \in K_{\varphi(n)} \subset K_{p}$ dès que $\varphi(n) \geqslant p$ ; comme $K_{p}$ est fermé, $x \in K_{p}$. Donc $x \in K$. 
    $$\boxed{K \text{ est un compact non vide}}$$

    **2.** Sinon, pour tout $n$, il existe $x_{n} \in K_{n} \setminus U$. Comme en 1, une suite extraite converge vers un $x \in K$ ; mais les $x_{n}$ sont dans le fermé $E \setminus U$, donc $x \notin U$, ce qui contredit $K \subset U$. 
    $$\boxed{\exists n, \ K_{n} \subset U}$$

    **3.** L'inclusion $f(K) \subset \mathop{\displaystyle \bigcap} f(K_{n})$ est claire. Soit $y \in \mathop{\displaystyle \bigcap} f(K_{n})$. Les parties $L_{n} = K_{n} \cap f^{-1}(\{y\})$ sont des compacts (intersection d'un compact et d'un fermé) non vides et décroissants : par la question 1, leur intersection contient un point $x$, qui est dans $K$ et vérifie $f(x) = y$. 
    $$\boxed{f\Big(\bigcap_{n} K_{n}\Big) = \bigcap_{n} f(K_{n})}$$
     Sans compacité, l'égalité tombe en défaut : avec $K_{n} = [n, +\infty[$, fermés non bornés, l'intersection est vide, alors que pour $f$ constante, l'intersection des $f(K_{n})$ est un singleton.
