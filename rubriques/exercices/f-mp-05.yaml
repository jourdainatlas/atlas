  enonce: |
    Soit $K$ un compact non vide de $E$ et $f : K \to K$ telle que $\lVert f(x) - f(y) \rVert < \lVert x - y \rVert$ pour tous $x \neq y$.

    **1.** Montrer que $f$ admet un unique point fixe $a$. On pourra étudier $x \mapsto \lVert f(x) - x \rVert$.

    **2.** Soit $x_{0} \in K$ et $x_{n+1} = f(x_{n})$. Montrer que la suite $\big(\lVert x_{n} - a \rVert\big)$ converge vers un réel $\ell$, puis que toute valeur d'adhérence $b$ de $(x_{n})$ vérifie $\lVert b - a \rVert = \ell$ et $\lVert f(b) - a \rVert = \ell$. En déduire que $x_{n} \xrightarrow[n \to +\infty]{} a$.

    **3.** Montrer par un exemple que $f$ n'est pas nécessairement $k$-lipschitzienne avec $k < 1$, et que le résultat de la question 1 est faux si $K$ est seulement fermée.
  corrige: |
    **1.** La fonction continue $\varphi : x \mapsto \lVert f(x) - x \rVert$ atteint sur $K$ son minimum en un point $a$. Si $f(a) \neq a$, alors $\varphi\big(f(a)\big) = \lVert f(f(a)) - f(a) \rVert < \lVert f(a) - a \rVert = \varphi(a)$, ce qui contredit la minimalité. Si $a$ et $b$ sont deux points fixes distincts, $\lVert a - b \rVert = \lVert f(a) - f(b) \rVert < \lVert a - b \rVert$. 
    $$\boxed{f \text{ admet un unique point fixe } a}$$

    **2.** La suite $d_{n} = \lVert x_{n} - a \rVert$ vérifie $d_{n+1} = \lVert f(x_{n}) - f(a) \rVert \leqslant d_{n}$ : elle décroît et converge vers $\ell \geqslant 0$. Si $x_{\varphi(n)} \to b$, alors $\lVert b - a \rVert = \mathop{\displaystyle \lim} d_{\varphi(n)} = \ell$, et $x_{\varphi(n)+1} = f(x_{\varphi(n)}) \to f(b)$, d'où $\lVert f(b) - a \rVert = \mathop{\displaystyle \lim} d_{\varphi(n)+1} = \ell$. Si $b \neq a$, on aurait $\ell = \lVert f(b) - f(a) \rVert < \lVert b - a \rVert = \ell$. Donc $b = a$ : la suite a pour seule valeur d'adhérence $a$ dans le compact $K$, et elle converge (proposition 10). 
    $$\boxed{x_{n} \xrightarrow[n \to +\infty]{} a}$$

    **3.** La fonction $f(x) = x - \dfrac{x^{2}}{2}$ envoie $[0, 1]$ dans $[0, \dfrac{1}{2}]$, et $|f(x) - f(y)| = |x - y|\,\big(1 - \dfrac{x + y}{2}\big) < |x - y|$ pour $x \neq y$ ; le quotient tend vers $1$ quand $x$, $y \to 0$, donc aucune constante $k < 1$ ne convient. Sur le fermé $\mathbb{R}$, la fonction $f(x) = \sqrt{1 + x^{2}}$ vérifie $|f(x) - f(y)| = \dfrac{|x + y|}{f(x) + f(y)}|x - y| < |x - y|$, et n'a pas de point fixe puisque $f(x) > |x|$. 
    $$\boxed{\text{La compacité est indispensable}}$$
