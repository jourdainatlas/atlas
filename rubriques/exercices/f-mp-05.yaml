  page_corrige: 10
  enonce: |
    Soit $K$ un compact de $E$ et $f : K \to \mathbb{C}^{*}$ une application lipschitzienne. Montrer que $\frac{1}{f}$ est lipschitzienne, et que l'hypothèse de compacité ne peut pas être supprimée.
  corrige: |
    La fonction continue $|f|$ atteint sur $K$ un minimum $m$, strictement positif puisque $f$ ne s'annule pas (si $K$ est vide, il n'y a rien à montrer). Si $f$ est $k$-lipschitzienne, 
    $$\Big|\frac{1}{f(x)} - \frac{1}{f(y)}\Big| = \frac{|f(y) - f(x)|}{|f(x)|\,|f(y)|} \leqslant \frac{k}{m^{2}}\lVert x - y \rVert.$$

    $$\boxed{\frac{1}{f} \text{ est } \frac{k}{m^{2}}\text{-lipschitzienne}}$$
     Sur $]0, 1]$, la fonction $x \mapsto x$ est lipschitzienne et ne s'annule pas, mais $x \mapsto \dfrac{1}{x}$ n'est pas lipschitzienne : sans compacité, $|f|$ peut s'approcher de $0$.
- id: "mp-05-29"
  feuille: "f-mp-05"
  numero: 29
  partie: "Applications continues sur une partie compacte"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [continuité sur un compact, applications lipschitziennes, compacité]
  noeuds: [c-heine, tr-compacts, c-uniforme]
  notions: [compact]
  source: "BibM@th, Compléments de topologie, exercice 15"
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Soit $K$ un compact de $E$ et $f : K \to F$ *localement lipschitzienne* : pour tout $x \in K$, il existe $r > 0$ et $k \geqslant 0$ tels que $f$ soit $k$-lipschitzienne sur $K \cap B(x, r)$. Montrer que $f$ est lipschitzienne sur $K$. On pourra raisonner par l'absurde avec des suites, après avoir remarqué que $f$ est bornée.
  corrige: |
    Une fonction localement lipschitzienne est continue ; sur le compact $K$, $\lVert f \rVert$ est donc majorée par un réel $M$. Supposons $f$ non lipschitzienne : il existe, pour tout $n$, des points $x_{n} \neq y_{n}$ de $K$ tels que 
    $$\lVert f(x_{n}) - f(y_{n}) \rVert > n\lVert x_{n} - y_{n} \rVert.$$
     Le membre de gauche est majoré par $2M$, donc $\lVert x_{n} - y_{n} \rVert < \dfrac{2M}{n} \to 0$. On extrait $x_{\varphi(n)} \to x \in K$, et alors $y_{\varphi(n)} \to x$. Soit $r$ et $k$ associés à $x$. Pour $n$ assez grand, $x_{\varphi(n)}$ et $y_{\varphi(n)}$ sont dans $B(x, r)$, et 
    $$\varphi(n)\lVert x_{\varphi(n)} - y_{\varphi(n)} \rVert < \lVert f(x_{\varphi(n)}) - f(y_{\varphi(n)}) \rVert \leqslant k\lVert x_{\varphi(n)} - y_{\varphi(n)} \rVert,$$
     d'où $\varphi(n) < k$ pour $n$ grand : contradiction. 
    $$\boxed{f \text{ est lipschitzienne sur } K}$$
- id: "mp-05-30"
  feuille: "f-mp-05"
  numero: 30
  partie: "Applications continues sur une partie compacte"
  etoiles: 2
  types: [Démonstration]
