  enonce: |
    *Pas de logarithme continu sur $\mathbb{C}^{*}$.* On suppose qu'il existe $f : \mathbb{C}^{*} \to \mathbb{C}$ continue telle que $\exp\big(f(z)\big) = z$ pour tout $z \in \mathbb{C}^{*}$.

    **1.** Montrer que $g : t \mapsto \frac{1}{2\mathrm{i}\pi}\big(f(\mathrm{e}^{\mathrm{i} t}) - \mathrm{i} t\big)$ est une fonction continue de $\mathbb{R}$ dans $\mathbb{Z}$.

    **2.** En déduire que $g$ est constante, puis aboutir à une contradiction en comparant $g(0)$ et $g(2\pi)$.

    **3.** Existe-t-il une fonction continue $\theta : \mathbb{U} \to \mathbb{R}$ telle que $z = \mathrm{e}^{\mathrm{i}\theta(z)}$ pour tout $z \in \mathbb{U}$ ?
  corrige: |
    **1.** La fonction $g$ est continue, comme composée et différence de fonctions continues. Comme $\exp\big(f(\mathrm{e}^{\mathrm{i} t})\big) = \mathrm{e}^{\mathrm{i} t} = \exp(\mathrm{i} t)$, on a $\exp\big(f(\mathrm{e}^{\mathrm{i} t}) - \mathrm{i} t\big) = 1$, donc $f(\mathrm{e}^{\mathrm{i} t}) - \mathrm{i} t \in 2\mathrm{i}\pi\mathbb{Z}$ (chapitre 4 de MPSI) : $g$ est à valeurs dans $\mathbb{Z}$.

    **2.** L'image de l'intervalle $\mathbb{R}$ par $g$ est un intervalle contenu dans $\mathbb{Z}$ (théorème 11), donc un singleton : $g$ est constante. Or $g(2\pi) = \dfrac{f(1) - 2\mathrm{i}\pi}{2\mathrm{i}\pi} = g(0) - 1$. 
    $$\boxed{\text{Il n'existe pas de logarithme continu sur } \mathbb{C}^{*}}$$

    **3.** Le même argument, appliqué à $t \mapsto \dfrac{1}{2\pi}\big(\theta(\mathrm{e}^{\mathrm{i} t}) - t\big)$, montre qu'il n'existe pas d'argument continu sur $\mathbb{U}$. On peut en revanche en définir un sur $\mathbb{U} \setminus \{-1\}$, en choisissant l'argument dans $]-\pi, \pi[$ : c'est le fait de faire le tour complet du cercle qui crée l'obstruction.
- id: "mp-05-56"
  feuille: "f-mp-05"
  numero: 56
