  enonce: |
    Soit $A$ une partie de $\mathbb{R}^{n}$ telle que toute fonction continue de $A$ dans $\mathbb{R}$ soit bornée. Montrer que $A$ est compacte. On pourra montrer que $A$ est bornée, puis, si $a \in \overline{A} \setminus A$, considérer $x \mapsto \frac{1}{\lVert x - a \rVert}$.
  corrige: |
    La fonction continue $x \mapsto \lVert x \rVert$ est bornée sur $A$ : $A$ est bornée. Si $a \in \overline{A} \setminus A$, la fonction $x \mapsto \dfrac{1}{\lVert x - a \rVert}$ est continue sur $A$, et non bornée, puisque des points de $A$ s'approchent de $a$ : c'est exclu. Donc $A$ est fermée et bornée dans $\mathbb{R}^{n}$, donc compacte (proposition 13). 
    $$\boxed{A \text{ est compacte}}$$
     La réciproque est le théorème 6 : en dimension finie, les compacts sont exactement les parties sur lesquelles toute fonction continue réelle est bornée.
