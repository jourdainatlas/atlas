  enonce: |
    Montrer que l'application $f \mapsto \min_{[0, 1]} f$ est $1$-lipschitzienne sur $\mathcal{C}([0, 1], \mathbb{R})$ muni de $\lVert \cdot \rVert_{\infty}$.
  corrige: |
    Pour $t \in [0, 1]$, $f(t) \geqslant g(t) - \lVert f - g \rVert_{\infty} \geqslant \mathop{\displaystyle \min} g - \lVert f - g \rVert_{\infty}$, d'où $\mathop{\displaystyle \min} f \geqslant \mathop{\displaystyle \min} g - \lVert f - g \rVert_{\infty}$ ; on échange $f$ et $g$. 
    $$\boxed{\big|\min f - \min g\big| \leqslant \lVert f - g \rVert_{\infty}}$$
- id: "mp-05-08"
  feuille: "f-mp-05"
  numero: 8
  partie: "Limites et continuité"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [limites et continuité, ouverts et fermés]
  noeuds: [c-uniforme, tr-ouverts]
  notions: [continuite, ouvert]
  source: "BibM@th, Topologie des espaces vectoriels normés, exercices 8 et 33"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $A$ et $B$ deux fermés non vides et disjoints de $E$.

    **1.** Montrer que $d(x, A) + d(x, B) > 0$ pour tout $x \in E$.

    **2.** En déduire une application continue $\varphi : E \to [0, 1]$ égale à $0$ sur $A$ et à $1$ sur $B$.

    **3.** En déduire deux ouverts disjoints $U \supset A$ et $V \supset B$.
  corrige: |
    **1.** Si $d(x, A) + d(x, B) = 0$, les deux distances sont nulles, et $x \in \overline{A} \cap \overline{B} = A \cap B$ (proposition 6) : c'est impossible.

    **2.** On pose 
    $$\boxed{\varphi(x) = \frac{d(x, A)}{d(x, A) + d(x, B)}}$$
     C'est un quotient de fonctions continues (proposition 6), dont le dénominateur ne s'annule pas ; il est à valeurs dans $[0, 1]$, nul sur $A$ et égal à $1$ sur $B$.

    **3.** Les parties $U = \varphi^{-1}(]-\infty, \dfrac{1}{2}[)$ et $V = \varphi^{-1}(]\dfrac{1}{2}, +\infty[)$ sont des ouverts disjoints (théorème 2), qui contiennent respectivement $A$ et $B$. 
    $$\boxed{\text{Deux fermés disjoints ont des voisinages ouverts disjoints}}$$
     On ne peut pas, en général, séparer $A$ et $B$ par des boules de rayon fixe : la distance entre deux fermés disjoints peut être nulle (exercice 27).
- id: "mp-05-09"
  feuille: "f-mp-05"
  numero: 9
