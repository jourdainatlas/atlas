  page_enonce: 8
  page_corrige: 16
  enonce: |
    Deux parties $A$ et $B$ d'espaces normés sont dites *homéomorphes* s'il existe une bijection continue $A \to B$ dont la réciproque est continue.

    **1.** Montrer que $\mathbb{R}^{2} \setminus \{0\}$ est connexe par arcs.

    **2.** Montrer que $\mathbb{R}$ et $\mathbb{R}^{2}$ ne sont pas homéomorphes. On pourra retirer un point.

    **3.** Montrer que $[0, 1]$ et le cercle unité $\mathbb{U}$ de $\mathbb{C}$ ne sont pas homéomorphes.

    **4.** Montrer qu'il n'existe pas de bijection continue de $\mathbb{C}$ sur $\mathbb{R}$.
  corrige: |
    **1.** Si le segment $[a, b]$ ne passe pas par $0$, il convient. Sinon, $b$ est un multiple négatif de $a$, et l'on passe par le point $c$ obtenu en tournant $a$ d'un quart de tour : les segments $[a, c]$ et $[c, b]$ évitent $0$.

    **2.** Soit $h : \mathbb{R}^{2} \to \mathbb{R}$ un homéomorphisme. Sa restriction à $\mathbb{R}^{2} \setminus \{0\}$ est une bijection continue sur $\mathbb{R} \setminus \{h(0)\}$. L'image d'un connexe par arcs serait connexe par arcs (théorème 11), donc un intervalle : c'est faux.

    **3.** Si $h : [0, 1] \to \mathbb{U}$ était un homéomorphisme, $h^{-1}$ enverrait continûment le cercle privé de $h(\dfrac{1}{2})$, connexe par arcs puisque c'est un arc de cercle, sur $[0, 1] \setminus \{\dfrac{1}{2}\}$, qui n'est pas un intervalle.

    **4.** Si $f : \mathbb{C} \to \mathbb{R}$ était une bijection continue, $f$ enverrait $\mathbb{C} \setminus \{0\}$, connexe par arcs par la question 1, sur $\mathbb{R} \setminus \{f(0)\}$. 
    $$\boxed{\mathbb{R} \not\simeq \mathbb{R}^{2}, \qquad [0, 1] \not\simeq \mathbb{U}, \qquad \text{aucune bijection continue } \mathbb{C} \to \mathbb{R}}$$
     Retirer un point est un invariant simple : le nombre de composantes connexes par arcs obtenues distingue ces espaces.
- id: "mp-05-49"
  feuille: "f-mp-05"
  numero: 49
  partie: "Connexité par arcs"
  etoiles: 2
  types: [Démonstration]
