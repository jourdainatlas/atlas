  enonce: |
    On munit $\mathbb{R}[X]$ de la norme $N_{\infty}\big(\sum a_{k}X^{k}\big) = \max_{k} |a_{k}|$. Soit $c \in \mathbb{R}$ et $\varphi_{c} : P \mapsto P(c)$.

    **1.** Montrer que $\varphi_{c}$ n'est pas continue si $|c| \geqslant 1$.

    **2.** Pour $|c| < 1$, montrer que $\varphi_{c}$ est continue et que $|\mkern-1.5mu|\mkern-1.5mu|\varphi_{c}|\mkern-1.5mu|\mkern-1.5mu| = \frac{1}{1 - |c|}$. Cette norme est-elle atteinte ?

    **3.** Sur $\mathbb{R}_{n}[X]$ muni de la même norme, $\varphi_{c}$ est-elle continue pour tout $c$ ?
  corrige: |
    **1.** Soit $s = 1$ si $c \geqslant 0$ et $s = -1$ sinon, et $P_{n} = \mathop{\displaystyle \sum_{k=0}^{n}} s^{k}X^{k}$. Alors $N_{\infty}(P_{n}) = 1$ et, si $|c| \geqslant 1$, 
    $$P_{n}(c) = \sum_{k=0}^{n} |c|^{k} \geqslant n + 1 :$$
     $\varphi_{c}$ n'est pas continue.

    **2.** Pour $|c| < 1$ et $P$ de degré $d$, 
    $$|P(c)| \leqslant N_{\infty}(P)\sum_{k=0}^{d} |c|^{k} < \frac{N_{\infty}(P)}{1 - |c|} \quad (P \neq 0).$$
     La suite $(P_{n})$ de la question 1 donne $\dfrac{|P_{n}(c)|}{N_{\infty}(P_{n})} = \mathop{\displaystyle \sum_{k=0}^{n}} |c|^{k} \xrightarrow[n \to +\infty]{} \dfrac{1}{1 - |c|}$. 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|\varphi_{c}|\mkern-1.5mu|\mkern-1.5mu| = \frac{1}{1 - |c|}, \ \text{ non atteinte}}$$
     L'inégalité stricte pour chaque $P$ non nul montre que la borne supérieure n'est pas atteinte : la somme $\mathop{\displaystyle \sum} |c|^{k}$ s'arrête toujours au degré de $P$.

    **3.** L'espace $\mathbb{R}_{n}[X]$ est de dimension finie : toute forme linéaire y est continue (proposition 14), et la question 2 montre que $|\mkern-1.5mu|\mkern-1.5mu|\varphi_{c}|\mkern-1.5mu|\mkern-1.5mu| = \mathop{\displaystyle \sum_{k=0}^{n}} |c|^{k}$, atteinte en $P_{n}$. 
    $$\boxed{\text{Sur } \mathbb{R}_{n}[X], \ \varphi_{c} \text{ est continue pour tout } c}$$
- id: "mp-05-12"
  feuille: "f-mp-05"
  numero: 12
  partie: "Applications linéaires et multilinéaires continues"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [applications linéaires continues]
  noeuds: [gd-normes]
  notions: [norme-subordonnee]
  source: "BibM@th, Topologie des espaces vectoriels normés, exercices 46 et 48"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** Sur $\mathbb{R}[X]$, on pose $N(P) = \sum_{k \geqslant 0} |P^{(k)}(0)|$. Montrer que $N$ est une norme pour laquelle la dérivation $D : P \mapsto P'$ est continue, alors qu'elle ne l'est pas pour $P \mapsto \sup_{[0, 1]} |P|$.

    **2.** Soit $E = \mathcal{C}^{\infty}([0, 1], \mathbb{R})$. Montrer que la dérivation $f \mapsto f'$ n'est continue pour aucune norme sur $E$. On pourra considérer les fonctions $x \mapsto \mathrm{e}^{ax}$.
  corrige: |
    **1.** On a $N(P) = \mathop{\displaystyle \sum_{k}} k!\,|a_{k}|$ : c'est une norme à poids strictement positifs (exercice 34 de la feuille du chapitre 4). Comme $P'^{(k)}(0) = P^{(k+1)}(0)$, 
    $$N(P') = \sum_{k \geqslant 1} |P^{(k)}(0)| = N(P) - |P(0)| \leqslant N(P),$$
     et $D$ est continue, de norme $1$ (atteinte en $P = X$). Pour la norme $\mathop{\displaystyle \sup_{[0, 1]}} |P|$, $D$ n'est pas continue : c'est l'exemple du cours avec les $X^{n}$.

    **2.** Supposons $D$ continue pour une norme $N$, de norme subordonnée $C$. La fonction $e_{a} : x \mapsto \mathrm{e}^{ax}$ vérifie $D(e_{a}) = ae_{a}$, donc $|a|\,N(e_{a}) \leqslant C\,N(e_{a})$, et $|a| \leqslant C$ pour tout réel $a$ : c'est absurde. 
    $$\boxed{\text{La dérivation n'est continue pour aucune norme sur } \mathcal{C}^{\infty}([0, 1], \mathbb{R})}$$
     L'argument est général : un endomorphisme continu a toutes ses valeurs propres de module au plus $|\mkern-1.5mu|\mkern-1.5mu|u|\mkern-1.5mu|\mkern-1.5mu|$, et la dérivation a pour valeurs propres tous les réels.
- id: "mp-05-13"
  feuille: "f-mp-05"
  numero: 13
  partie: "Applications linéaires et multilinéaires continues"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [applications linéaires continues, norme subordonnée, bornes atteintes]
  noeuds: [gd-normes, tr-compacts]
  notions: [norme-subordonnee]
  source: "BibM@th, Topologie des espaces vectoriels normés, exercices 52, 54, 56 et 57 ; Topologie des espaces normés (Prost), exercices 24 et 26"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Montrer que les applications linéaires suivantes sont continues et calculer leur norme subordonnée.

    **1.** La trace, sur $\mathcal{M}_{n}(\mathbb{R})$ muni de la norme subordonnée $|\mkern-1.5mu|\mkern-1.5mu|\cdot|\mkern-1.5mu|\mkern-1.5mu|_{\infty}$ (maximum des sommes de lignes).

    **2.** L'endomorphisme $L$ de $\mathcal{C}([0, 1], \mathbb{R})$, muni de $\lVert \cdot \rVert_{\infty}$, défini par $L(f)(t) = \int_{0}^{1} (t + u)f(u)\,\mathrm{d} u$.

    **3.** Sur l'espace $\ell^{\infty}$ des suites réelles bornées, muni de $\lVert \cdot \rVert_{\infty}$, l'opérateur de différence $\Delta$ et l'opérateur de Cesàro $C$ : 
    $$\Delta(u) = (u_{n+1} - u_{n})_{n \in \mathbb{N}}, \qquad C(u) = \Big(\frac{u_{0} + \cdots + u_{n}}{n + 1}\Big)_{n \in \mathbb{N}}.$$
  corrige: |
    **1.** On a $|\operatorname{tr} A| \leqslant \mathop{\displaystyle \sum_{i}} |a_{ii}| \leqslant \mathop{\displaystyle \sum_{i}}\mathop{\displaystyle \sum_{j}} |a_{ij}| \leqslant n|\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|_{\infty}$, avec égalité pour $A = I_{n}$ ($\operatorname{tr} I_{n} = n$, $|\mkern-1.5mu|\mkern-1.5mu|I_{n}|\mkern-1.5mu|\mkern-1.5mu|_{\infty} = 1$). 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|\operatorname{tr}|\mkern-1.5mu|\mkern-1.5mu| = n}$$

    **2.** La fonction $L(f) : t \mapsto t\mathop{\displaystyle \int_{0}^{1}} f + \mathop{\displaystyle \int_{0}^{1}} uf(u)\,\mathrm{d} u$ est affine, donc continue, et 
    $$|L(f)(t)| \leqslant \lVert f \rVert_{\infty}\int_{0}^{1} (t + u)\,\mathrm{d} u = \Big(t + \frac{1}{2}\Big)\lVert f \rVert_{\infty} \leqslant \frac{3}{2}\lVert f \rVert_{\infty},$$
     avec égalité pour $f = 1$ et $t = 1$. 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|L|\mkern-1.5mu|\mkern-1.5mu| = \frac{3}{2}}$$

    **3.** On a $|u_{n+1} - u_{n}| \leqslant 2\lVert u \rVert_{\infty}$, avec égalité pour $u = \big((-1)^{n}\big)$ ; la moyenne de termes de module au plus $\lVert u \rVert_{\infty}$ est de module au plus $\lVert u \rVert_{\infty}$, avec égalité pour la suite constante égale à $1$. 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|\Delta|\mkern-1.5mu|\mkern-1.5mu| = 2, \qquad |\mkern-1.5mu|\mkern-1.5mu|C|\mkern-1.5mu|\mkern-1.5mu| = 1}$$
- id: "mp-05-14"
  feuille: "f-mp-05"
  numero: 14
  partie: "Applications linéaires et multilinéaires continues"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [applications linéaires continues, bornes atteintes]
  noeuds: [gd-normes, tr-compacts]
  notions: [norme-subordonnee, valeur-propre]
  source: "BibM@th, Topologie des espaces vectoriels normés, exercice 59 ; Topologie (LLG), exercice 67"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **1.** Sur $E = \mathcal{C}([0, 1], \mathbb{R})$ muni de $\lVert \cdot \rVert_{1}$, on pose $\varphi(f)(x) = \int_{0}^{x} f$. Montrer que $\varphi$ est un endomorphisme continu de $E$, que $|\mkern-1.5mu|\mkern-1.5mu|\varphi|\mkern-1.5mu|\mkern-1.5mu| = 1$, et que cette norme n'est atteinte en aucune fonction non nulle. L'endomorphisme $\varphi$ est-il injectif ? surjectif ? A-t-il des valeurs propres ?

    **2.** Sur $\mathcal{C}([-1, 1], \mathbb{R})$ muni de $\lVert \cdot \rVert_{\infty}$, on pose $\psi(f) = \int_{0}^{1} f - \int_{-1}^{0} f$. Montrer que $\psi$ est continue, calculer $|\mkern-1.5mu|\mkern-1.5mu|\psi|\mkern-1.5mu|\mkern-1.5mu|$, et montrer qu'il n'existe aucune $f$ de norme $1$ telle que $|\psi(f)| = |\mkern-1.5mu|\mkern-1.5mu|\psi|\mkern-1.5mu|\mkern-1.5mu|$.
  corrige: |
    **1.** La fonction $\varphi(f)$ est de classe $\mathcal{C}^{1}$, donc dans $E$. En notant $F(x) = \mathop{\displaystyle \int_{0}^{x}} |f|$, une intégration par parties donne 
    $$\int_{0}^{1} F = F(1) - \int_{0}^{1} t|f(t)|\,\mathrm{d} t = \int_{0}^{1} (1 - t)|f(t)|\,\mathrm{d} t,$$
     d'où 
    $$\lVert \varphi(f) \rVert_{1} \leqslant \int_{0}^{1} F = \int_{0}^{1} (1 - t)|f(t)|\,\mathrm{d} t \leqslant \lVert f \rVert_{1}.$$
     La seconde inégalité est stricte si $f$ n'est pas nulle : l'intégrale de la fonction continue et positive $t \mapsto t|f(t)|$ est alors strictement positive. Pour $f_{n} = \mathop{\displaystyle \max}\big(0, 2n(1 - nt)\big)$, positive, d'intégrale $1$ et nulle hors de $[0, \dfrac{1}{n}]$, la première inégalité est une égalité et $\mathop{\displaystyle \int_{0}^{1}}(1 - t)f_{n} \geqslant 1 - \dfrac{1}{n}$. 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|\varphi|\mkern-1.5mu|\mkern-1.5mu| = 1, \ \text{ non atteinte}}$$
     L'endomorphisme $\varphi$ est injectif, puisque $\varphi(f)' = f$, et non surjectif, puisque $\varphi(f)(0) = 0$. Si $\varphi(f) = \lambda f$ avec $\lambda \neq 0$, alors $f = \dfrac{1}{\lambda}\varphi(f)$ est de classe $\mathcal{C}^{1}$, vérifie $\lambda f' = f$ et $f(0) = 0$, donc $f = 0$ (chapitre 6 de MPSI). 
    $$\boxed{\varphi \text{ est injectif, non surjectif, et n'a aucune valeur propre}}$$

    **2.** On a $|\psi(f)| \leqslant \mathop{\displaystyle \int_{-1}^{1}} |f| \leqslant 2\lVert f \rVert_{\infty}$. Les fonctions $f_{n}(t) = \mathop{\displaystyle \max}\big(-1, \mathop{\displaystyle \min}(1, nt)\big)$ sont de norme $1$, et $\psi(f_{n}) = 2\big(1 - \dfrac{1}{2n}\big) = 2 - \dfrac{1}{n}$. 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|\psi|\mkern-1.5mu|\mkern-1.5mu| = 2}$$
     Si $\lVert f \rVert_{\infty} = 1$ et $\psi(f) = 2$, alors $\mathop{\displaystyle \int_{0}^{1}}(1 - f) + \mathop{\displaystyle \int_{-1}^{0}}(1 + f) = 0$, avec deux intégrandes continues et positives : $f = 1$ sur $[0, 1]$ et $f = -1$ sur $[-1, 0]$, ce qui est contradictoire en $0$. Le cas $\psi(f) = -2$ est symétrique. La « fonction optimale » serait le signe, qui n'est pas continu.
- id: "mp-05-15"
  feuille: "f-mp-05"
  numero: 15
  partie: "Applications linéaires et multilinéaires continues"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [applications linéaires continues]
  noeuds: [gd-normes]
  notions: [norme-subordonnee]
  source: "BibM@th, Topologie des espaces vectoriels normés, exercice 61 ; Topologie des espaces normés (Prost), exercice 23"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $u$ une forme linéaire sur $\mathcal{C}([a, b], \mathbb{R})$, *positive* au sens où $u(f) \geqslant 0$ dès que $f \geqslant 0$.

    **1.** Montrer que $|u(f)| \leqslant u(|f|)$ pour toute $f$.

    **2.** En déduire que $u$ est continue pour $\lVert \cdot \rVert_{\infty}$ et que $|\mkern-1.5mu|\mkern-1.5mu|u|\mkern-1.5mu|\mkern-1.5mu| = u(\mathbf{1})$, où $\mathbf{1}$ est la fonction constante égale à $1$.

    **3.** La forme linéaire positive $f \mapsto f(a)$ est-elle continue pour $\lVert \cdot \rVert_{1}$ ?
  corrige: |
    **1.** Les fonctions $|f| - f$ et $|f| + f$ sont positives, donc $u(|f|) - u(f) \geqslant 0$ et $u(|f|) + u(f) \geqslant 0$. 
    $$\boxed{|u(f)| \leqslant u(|f|)}$$

    **2.** La fonction $\lVert f \rVert_{\infty}\mathbf{1} - |f|$ est positive, d'où $u(|f|) \leqslant \lVert f \rVert_{\infty}u(\mathbf{1})$, et $|u(f)| \leqslant u(\mathbf{1})\lVert f \rVert_{\infty}$, avec égalité pour $f = \mathbf{1}$. 
    $$\boxed{u \text{ est continue et } |\mkern-1.5mu|\mkern-1.5mu|u|\mkern-1.5mu|\mkern-1.5mu| = u(\mathbf{1})}$$

    **3.** Les fonctions triangulaires de hauteur $1$ en $a$ et de support $[a, a + \dfrac{1}{n}]$ ont une norme $\lVert \cdot \rVert_{1}$ égale à $\dfrac{1}{2n}$, et une valeur $1$ en $a$ : la forme $f \mapsto f(a)$ n'est pas continue pour $\lVert \cdot \rVert_{1}$. La positivité donne la continuité pour $\lVert \cdot \rVert_{\infty}$ seulement.
- id: "mp-05-16"
  feuille: "f-mp-05"
  numero: 16
  partie: "Applications linéaires et multilinéaires continues"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [applications linéaires continues, ouverts et fermés]
  noeuds: [gd-normes, tr-ouverts]
  notions: [norme-subordonnee, ouvert]
  source: "Topologie (LLG), exercices 62, 63 et 65 ; Topologie des espaces normés (Prost), exercice 22"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Soit $\varphi$ une forme linéaire non nulle sur $E$.

    **1.** Montrer que $\varphi$ est continue si et seulement si $\mathrm{Ker}\, \varphi$ est fermé. Pour le sens réciproque, on pourra supposer que $\varphi$ n'est pas continue, choisir une suite $(x_{n})$ de vecteurs de norme $1$ telle que $|\varphi(x_{n})| \geqslant n$, et un vecteur $a$ tel que $\varphi(a) = 1$, puis considérer $a - \frac{x_{n}}{\varphi(x_{n})}$.

    **2.** On suppose $\varphi$ continue, et l'on fixe $x_{0}$ tel que $\varphi(x_{0}) \neq 0$. Montrer que $|\mkern-1.5mu|\mkern-1.5mu|\varphi|\mkern-1.5mu|\mkern-1.5mu| = \dfrac{|\varphi(x_{0})|}{d(x_{0}, \mathrm{Ker}\,\varphi)}$.
  corrige: |
    **1.** Si $\varphi$ est continue, $\mathrm{Ker}\,\varphi = \varphi^{-1}(\{0\})$ est fermé (théorème 2). Réciproquement, supposons $\mathrm{Ker}\,\varphi$ fermé et $\varphi$ non continue. Par le théorème 3, il existe pour tout $n$ un vecteur $x_{n}$ de norme $1$ tel que $|\varphi(x_{n})| \geqslant n$. Soit $a$ tel que $\varphi(a) = 1$, et $z_{n} = a - \dfrac{x_{n}}{\varphi(x_{n})}$ : alors $\varphi(z_{n}) = 0$ et $\lVert z_{n} - a \rVert \leqslant \dfrac{1}{n}$. Ainsi $a$ est limite d'une suite du fermé $\mathrm{Ker}\,\varphi$, donc $\varphi(a) = 0$ : contradiction. 
    $$\boxed{\varphi \text{ continue} \iff \mathrm{Ker}\,\varphi \text{ fermé}}$$
     Avec l'exercice 35 de la feuille du chapitre 4 : le noyau d'une forme linéaire non continue est dense.

    **2.** Notons $\delta = d(x_{0}, \mathrm{Ker}\,\varphi)$, strictement positif puisque le noyau est fermé et ne contient pas $x_{0}$. Pour $y \in \mathrm{Ker}\,\varphi$, $|\varphi(x_{0})| = |\varphi(x_{0} - y)| \leqslant |\mkern-1.5mu|\mkern-1.5mu|\varphi|\mkern-1.5mu|\mkern-1.5mu|\,\lVert x_{0} - y \rVert$, d'où $|\varphi(x_{0})| \leqslant |\mkern-1.5mu|\mkern-1.5mu|\varphi|\mkern-1.5mu|\mkern-1.5mu|\,\delta$. Réciproquement, soit $x \notin \mathrm{Ker}\,\varphi$ et $\lambda = \dfrac{\varphi(x)}{\varphi(x_{0})}$ : le vecteur $y = x_{0} - \dfrac{x}{\lambda}$ est dans le noyau, et $x = \lambda(x_{0} - y)$, d'où $\lVert x \rVert \geqslant |\lambda|\,\delta$, c'est-à-dire $|\varphi(x)| \leqslant \dfrac{|\varphi(x_{0})|}{\delta}\lVert x \rVert$. 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|\varphi|\mkern-1.5mu|\mkern-1.5mu| = \frac{|\varphi(x_{0})|}{d(x_{0}, \mathrm{Ker}\,\varphi)}}$$
- id: "mp-05-17"
  feuille: "f-mp-05"
  numero: 17
  partie: "Applications linéaires et multilinéaires continues"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [applications linéaires continues, norme subordonnée, normes en dimension finie]
  noeuds: [gd-normes, gd-equivalence]
  notions: [norme-subordonnee, normes-equivalentes]
  source: "BibM@th, Topologie des espaces vectoriels normés, exercice 55"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Soit $N_{1}$ et $N_{2}$ deux normes équivalentes sur $E$. Montrer qu'elles définissent le même ensemble $\mathcal{L}_{c}(E)$ d'endomorphismes continus, et que les normes subordonnées associées sont équivalentes sur $\mathcal{L}_{c}(E)$.
  corrige: |
    Soit $\alpha N_{1} \leqslant N_{2} \leqslant \beta N_{1}$. Si $u$ est continu pour $N_{1}$, 
    $$N_{2}(u(x)) \leqslant \beta N_{1}(u(x)) \leqslant \beta|\mkern-1.5mu|\mkern-1.5mu|u|\mkern-1.5mu|\mkern-1.5mu|_{1}N_{1}(x) \leqslant \frac{\beta}{\alpha}|\mkern-1.5mu|\mkern-1.5mu|u|\mkern-1.5mu|\mkern-1.5mu|_{1}N_{2}(x) :$$
     $u$ est continu pour $N_{2}$, et $|\mkern-1.5mu|\mkern-1.5mu|u|\mkern-1.5mu|\mkern-1.5mu|_{2} \leqslant \dfrac{\beta}{\alpha}|\mkern-1.5mu|\mkern-1.5mu|u|\mkern-1.5mu|\mkern-1.5mu|_{1}$. Par symétrie, $|\mkern-1.5mu|\mkern-1.5mu|u|\mkern-1.5mu|\mkern-1.5mu|_{1} \leqslant \dfrac{\beta}{\alpha}|\mkern-1.5mu|\mkern-1.5mu|u|\mkern-1.5mu|\mkern-1.5mu|_{2}$. 
    $$\boxed{\tfrac{\alpha}{\beta}|\mkern-1.5mu|\mkern-1.5mu|\cdot|\mkern-1.5mu|\mkern-1.5mu|_{1} \leqslant |\mkern-1.5mu|\mkern-1.5mu|\cdot|\mkern-1.5mu|\mkern-1.5mu|_{2} \leqslant \tfrac{\beta}{\alpha}|\mkern-1.5mu|\mkern-1.5mu|\cdot|\mkern-1.5mu|\mkern-1.5mu|_{1}}$$
- id: "mp-05-18"
  feuille: "f-mp-05"
  numero: 18
  partie: "Parties compactes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [compacts, compacité]
  noeuds: [tr-compacts, ar-bw]
  notions: [compact]
  source: "BibM@th, Compléments de topologie, exercice 1"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Les parties suivantes de $\mathbb{R}^{2}$ sont-elles compactes ? 
    $$A = \{x^{2} + y^{4} = 1\}, \qquad B = \{x^{2} + y^{5} = 2\}, \qquad C = \{x^{2} + xy + y^{2} \leqslant 1\},$$

    $$D = \{x^{2} + 8xy + y^{2} \leqslant 1\}, \qquad G = \{y^{2} = x(1 - 2x)\}.$$
  corrige: |
    Toutes ces parties sont fermées, comme images réciproques d'un fermé par une fonction polynomiale (théorème 2) ; dans $\mathbb{R}^{2}$, elles sont donc compactes si et seulement si elles sont bornées (proposition 12).

    • Sur $A$, $x^{2} \leqslant 1$ et $y^{4} \leqslant 1$ : $A$ est bornée.

    • Sur $B$, les points $\big(\sqrt{2 + t^{5}}, -t\big)$, pour $t \geqslant 0$, ne sont pas bornés.

    • Comme $xy \geqslant -\dfrac{x^{2} + y^{2}}{2}$, on a $x^{2} + xy + y^{2} \geqslant \dfrac{x^{2} + y^{2}}{2}$ : sur $C$, $x^{2} + y^{2} \leqslant 2$.

    • La droite $y = -x$ est contenue dans $D$, puisque $x^{2} - 8x^{2} + x^{2} = -6x^{2} \leqslant 1$.

    • Sur $G$, $x(1 - 2x) \geqslant 0$ impose $x \in [0, \dfrac{1}{2}]$, puis $y^{2} \leqslant \dfrac{1}{8}$, maximum de $x(1 - 2x)$ atteint en $x = \dfrac{1}{4}$.

    $$\boxed{A, \ C, \ G \text{ sont compactes ; } B \text{ et } D \text{ ne le sont pas}}$$
     La forme quadratique $x^{2} + 8xy + y^{2}$ n'est pas définie positive : c'est elle qui permet à $D$ de s'étendre à l'infini.
- id: "mp-05-19"
  feuille: "f-mp-05"
  numero: 19
  partie: "Parties compactes"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [compacts, compacité]
  noeuds: [tr-compacts, ar-bw]
  notions: [compact]
  source: "BibM@th, Compléments de topologie, exercice 7 ; Compacité, connexité par arcs (Sainte-Geneviève), exercice 4 ; Topologie des espaces normés (Prost), exercice 32"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Soit $(x_{n})$ une suite de $E$ qui converge vers $x$. Montrer, en revenant à la définition, que la partie $K = \{x_{n} \mid n \in \mathbb{N}\} \cup \{x\}$ est compacte.
  corrige: |
    Soit $(y_{k})$ une suite de $K$. Si l'un des points de $K$ est pris une infinité de fois, on en extrait une suite constante. Sinon, $y_{k} = x_{m_{k}}$ pour tout $k$ à partir d'un certain rang, et chaque indice $m$ n'est atteint qu'un nombre fini de fois : la suite $(m_{k})$ n'est pas majorée, et l'on en extrait une suite strictement croissante $(m_{\varphi(k)})$. La suite $(y_{\varphi(k)}) = (x_{m_{\varphi(k)}})$ est alors extraite de $(x_{n})$, donc converge vers $x \in K$. 
    $$\boxed{K = \{x_{n} \mid n \in \mathbb{N}\} \cup \{x\} \text{ est compacte}}$$
- id: "mp-05-20"
  feuille: "f-mp-05"
  numero: 20
  partie: "Parties compactes"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [compacts, compacité, ouverts et fermés]
  noeuds: [tr-compacts, ar-bw, tr-ouverts]
  notions: [compact, ouvert]
  source: "BibM@th, Compléments de topologie, exercices 3 et 10 ; Topologie (LLG), exercice 82 ; Topologie des espaces normés (Prost), exercice 30"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Soit $A$ et $B$ deux parties non vides de $E$, et $A + B = \{a + b \mid a \in A, \ b \in B\}$.

    **1.** Montrer que si $A$ et $B$ sont compactes, $A + B$ est compacte.

    **2.** Montrer que si $A$ est fermée et $B$ compacte, $A + B$ est fermée.

    **3.** Rappeler pourquoi la somme de deux fermés n'est pas toujours fermée (exercice 37 de la feuille du chapitre 4).
  corrige: |
    **1.** La partie $A \times B$ est compacte (proposition 11), et l'addition $(a, b) \mapsto a + b$ est continue : $A + B$ en est l'image, donc est compacte (théorème 5).

    **2.** Soit $z_{n} = a_{n} + b_{n}$ une suite convergente, de limite $z$, avec $a_{n} \in A$ et $b_{n} \in B$. On extrait $b_{\varphi(n)} \to b \in B$ ; alors 
    $$a_{\varphi(n)} = z_{\varphi(n)} - b_{\varphi(n)} \xrightarrow[n \to +\infty]{} z - b,$$
     qui est dans $A$ puisque $A$ est fermée. Donc $z = (z - b) + b \in A + B$. 
    $$\boxed{A \text{ fermée, } B \text{ compacte} \implies A + B \text{ fermée}}$$

    **3.** L'hyperbole $\{xy = 1\}$ et l'axe $\mathbb{R} \times \{0\}$ sont fermés, mais leur somme $\mathbb{R} \times \mathbb{R}^{*}$ ne l'est pas. La démonstration de la question 2 échoue parce que les $b_{n}$ peuvent partir à l'infini.
- id: "mp-05-21"
