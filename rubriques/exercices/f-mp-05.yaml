  enonce: |
    Soit $E$ de dimension finie.

    **1.** Soit $u \in \mathcal{L}(E)$ et $v \in \mathrm{GL}(E)$. Montrer qu'il existe $A \geqslant 0$ tel que $\lVert u(x) \rVert \leqslant A\lVert v(x) \rVert$ pour tout $x \in E$.

    **2.** Soit $f \in \mathcal{L}(E)$. Montrer que $\mathrm{Ker}\, f = \mathrm{Ker}\, f^{2}$ si et seulement s'il existe $C > 0$ tel que 
    $$\forall x \in E, \quad \lVert f(x) \rVert \leqslant C\lVert f^{2}(x) \rVert.$$
     On pourra utiliser la décomposition $E = \mathrm{Ker}\, f \oplus \mathrm{Im}\, f$, valable lorsque $\mathrm{Ker}\, f = \mathrm{Ker}\, f^{2}$.
  corrige: |
    **1.** L'endomorphisme $u \circ v^{-1}$ est continu (proposition 14), et 
    $$\lVert u(x) \rVert = \lVert (u \circ v^{-1})(v(x)) \rVert \leqslant |\mkern-1.5mu|\mkern-1.5mu|u \circ v^{-1}|\mkern-1.5mu|\mkern-1.5mu|\,\lVert v(x) \rVert.$$

    $$\boxed{A = |\mkern-1.5mu|\mkern-1.5mu|u \circ v^{-1}|\mkern-1.5mu|\mkern-1.5mu| \text{ convient}}$$

    **2.** Si l'inégalité a lieu et $f^{2}(x) = 0$, alors $f(x) = 0$ : $\mathrm{Ker}\, f^{2} \subset \mathrm{Ker}\, f$, et l'autre inclusion est toujours vraie. Réciproquement, si $\mathrm{Ker}\, f = \mathrm{Ker}\, f^{2}$, alors $\mathrm{Ker}\, f \cap \mathrm{Im}\, f = \{0\}$ (si $y = f(x)$ et $f(y) = 0$, alors $x \in \mathrm{Ker}\, f^{2} = \mathrm{Ker}\, f$, et $y = 0$), et par le théorème du rang $E = \mathrm{Ker}\, f \oplus \mathrm{Im}\, f$. La restriction $g$ de $f$ à $\mathrm{Im}\, f$ est un endomorphisme injectif, donc bijectif, de $\mathrm{Im}\, f$. Pour tout $x$, $f^{2}(x) = g\big(f(x)\big)$, d'où 
    $$\lVert f(x) \rVert = \lVert g^{-1}\big(f^{2}(x)\big) \rVert \leqslant |\mkern-1.5mu|\mkern-1.5mu|g^{-1}|\mkern-1.5mu|\mkern-1.5mu|\,\lVert f^{2}(x) \rVert.$$

    $$\boxed{\mathrm{Ker}\, f = \mathrm{Ker}\, f^{2} \iff \exists C > 0, \ \lVert f(x) \rVert \leqslant C\lVert f^{2}(x) \rVert}$$
