  source: "Exo7 (fic00146), exercice 3"
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Soit $1 < p < +\infty$ et $f$, $g \in L^{p}$ réelles. Montrer que $N(t) = \int|f + tg|^{p}\,\mathrm{d}\mu$ est dérivable sur $\mathbb{R}$, et que 
    $$N'(0) = p\int|f|^{p-2}f\,g\,\mathrm{d}\mu,$$
     en convenant que $|f|^{p-2}f = 0$ là où $f = 0$. On pourra utiliser l'inégalité $|a + b|^{p-1} \leqslant 2^{p-1}(|a|^{p-1} + |b|^{p-1})$ pour dominer les taux d'accroissement.
  corrige: |
    $u \mapsto |u|^{p}$ est de classe $C^{1}$ sur $\mathbb{R}$ pour $p > 1$, de dérivée $p|u|^{p-2}u$. Pour $|t| \leqslant T$, 
    $$\Big|\frac{\partial}{\partial t}|f + tg|^{p}\Big| = p|f + tg|^{p-1}|g| \leqslant p(|f| + T|g|)^{p-1}|g|,$$
     fonction intégrable par Hölder, puisque $(|f| + T|g|)^{p-1} \in L^{q}$, avec $(p - 1)q = p$. Le théorème de dérivation sous le signe somme (chapitre 5, th. 2) donne la dérivabilité sur $]-T, T[$, pour tout $T$, et la formule. C'est la « dérivée directionnelle » de $\lVert \cdot \rVert_{p}^{p}$, qui identifie le gradient de la norme à l'élément $|f|^{p-2}f$ de $L^{q}$.
- id: "l3-in-08-21"
  feuille: "f-l3-in-08"
  numero: 21
  partie: "Compléments"
  etoiles: 2
