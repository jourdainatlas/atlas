  enonce: |
    *Inégalité de Landau.*

    **1.** Soit $f : \mathbb{R} \to \mathbb{R}$ intégrable. Montrer qu'il existe une suite $(R_{n})$ telle que $2n \leqslant R_{n} \leqslant 2n + 1$ et $f(R_{n}) \to 0$.

    **2.** Si de plus $f$ est dérivable, montrer qu'il existe une suite $(S_{n})$ telle que $R_{n} < S_{n} < R_{n+1}$ et $f(S_{n})f'(S_{n}) \to 0$, en appliquant le théorème des accroissements finis à $f^{2}$. De même, il existe $T_{n} \to -\infty$ telle que $f(T_{n})f'(T_{n}) \to 0$.

    **3.** Soit $f : \mathbb{R} \to \mathbb{R}$ deux fois dérivable, intégrable, avec $f''$ bornée. Montrer que $f' \in \mathcal{L}^{2}(\mathbb{R})$ et que $\int_{\mathbb{R}}(f')^{2} \leqslant \lVert f'' \rVert_{\infty}\int_{\mathbb{R}}|f|$. On pourra commencer par calculer $\int_{T_{n}}^{S_{n}}(f')^{2}$ lorsque $f$ est de classe $C^{2}$.
  corrige: |
    **1.** $\varepsilon_{n} = \int_{2n}^{2n+1}|f| \to 0$, comme queue d'une intégrale convergente (feuille 4, exercice 18). Si $|f| > \varepsilon_{n} + \frac{1}{n}$ sur tout $[2n, 2n + 1]$, on aurait $\varepsilon_{n} > \varepsilon_{n} + \frac{1}{n}$ : il existe donc $R_{n} \in [2n, 2n + 1]$ tel que $|f(R_{n})| \leqslant \varepsilon_{n} + \frac{1}{n} \to 0$.

    **2.** Par les accroissements finis appliqués à $f^{2}$ sur $[R_{n}, R_{n+1}]$, il existe $S_{n}$ tel que 
    $$f(R_{n+1})^{2} - f(R_{n})^{2} = 2f(S_{n})f'(S_{n})(R_{n+1} - R_{n}).$$
     Comme $R_{n+1} - R_{n} \geqslant 1$, $|f(S_{n})f'(S_{n})| \leqslant \frac{1}{2}|f(R_{n+1})^{2} - f(R_{n})^{2}| \to 0$. On construit $T_{n}$ de même en $-\infty$, avec $T_{n+1} < T_{n}$.

    **3.** $f'$ est dérivable de dérivée bornée, donc lipschitzienne, et $ff'$ est dérivable de dérivée $(f')^{2} + ff''$, bornée sur tout segment. Par la feuille 4, exercice 25 (3), qui ne demande pas la continuité de la dérivée, 
    $$\int_{T_{n}}^{S_{n}}(f')^{2} = \big[ff'\big]_{T_{n}}^{S_{n}} - \int_{T_{n}}^{S_{n}}ff'' \leqslant |f(S_{n})f'(S_{n})| + |f(T_{n})f'(T_{n})| + \lVert f'' \rVert_{\infty}\int_{\mathbb{R}}|f|.$$
     Les intervalles $[T_{n}, S_{n}]$ croissent vers $\mathbb{R}$ ; par convergence monotone, $\int_{\mathbb{R}}(f')^{2} \leqslant \lVert f'' \rVert_{\infty}\int_{\mathbb{R}}|f|$. Pour $f(x) = \mathrm{e}^{-x^{2}}$, on trouve numériquement $1{,}253 \leqslant 2\sqrt{\pi} \approx 3{,}545$.
- id: "l3-in-08-08"
  feuille: "f-l3-in-08"
  numero: 8
  partie: "Les espaces $L^{p}$"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [les espaces L^p]
  noeuds: [lp-completude, lp-inclusions, lp-densite]
  notions: [espace-Lp]
  source: "Lyon 1 (TD07 2020), exercices 2, 4, 5, 6 et 7"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **1.** Soit $f : \Omega \to \overline{\mathbb{R}}$ mesurable et $A = \{M \in [0, +\infty] ; |f| \leqslant M \text{ p.p.}\}$. Montrer que $A$ est non vide et admet un plus petit élément, et que c'est $\lVert f \rVert_{\infty}$.

    **2.** On note $f \sim g$ si $f = g$ presque partout, pour des fonctions à valeurs dans $\overline{\mathbb{R}}$, non nécessairement mesurables. Montrer que : si $f \sim f_{1}$ et $g \sim g_{1}$, alors $f + tg \sim f_{1} + tg_{1}$ (là où ces sommes ont un sens) et $fg \sim f_{1}g_{1}$ ; si $f \sim g$, alors $\Phi \circ f \sim \Phi \circ g$ pour toute $\Phi : \overline{\mathbb{R}} \to \overline{\mathbb{R}}$ ; sur $\mathbb{R}^{n}$, $f \sim g$ entraîne $\tau_{h}f \sim \tau_{h}g$, où $\tau_{h}f(x) = f(x - h)$.

    **3.** Sur $\mathbb{R}^{n}$ muni de la tribu de Lebesgue, montrer que toute classe de fonctions mesurables contient un représentant borélien.

    **4.** Donner un sens aux expressions « $f \in L^{p}$, $f \geqslant 0$ » et « $f \in L^{p}$, $\lVert f \rVert_{p} = 0 \Rightarrow f = 0$ ». Donner un sens aux affirmations suivantes, puis les prouver ou les réfuter : si $f \in L^{p}$, $f$ est mesurable ; si $f \in L^{p}$ avec $p < +\infty$, $f$ est finie presque partout ; si $f \in L^{1}$, $\mu(\{|f| > t\}) \leqslant \frac{\lVert f \rVert_{1}}{t}$ pour $t > 0$.
  corrige: |
    **1.** $+\infty \in A$. Si $m = \inf A$ et si $M_{k} \in A$ décroît vers $m$, alors $\{|f| > m\} = \bigcup_{k}\{|f| > M_{k}\}$ est réunion dénombrable de parties négligeables : $m \in A$. C'est la définition de $\lVert f \rVert_{\infty}$.

    **2.** Dans chaque cas, l'ensemble où les deux fonctions diffèrent est contenu dans une réunion finie d'ensembles où les données diffèrent, donc dans une partie négligeable. Ainsi $\{\Phi \circ f \neq \Phi \circ g\} \subset \{f \neq g\}$, et, pour les translations, $\{\tau_{h}f \neq \tau_{h}g\} = h + \{f \neq g\}$ est contenu dans $h + N$, négligeable par invariance de $\lambda$ par translation. *Le piège* est de parler de « l'ensemble où $f \neq g$ » comme d'un ensemble mesurable : pour des fonctions non mesurables, il est seulement contenu dans une partie négligeable.

    **3.** Si $f \geqslant 0$ est mesurable au sens de Lebesgue, elle a un représentant borélien (chapitre 3, prop. 6). Pour $f$ quelconque, on prend des représentants boréliens $g_{1}$ de $f^{+}$ et $g_{2}$ de $f^{-}$, et l'on pose $g = g_{1} - g_{2}$ hors de $\{g_{1} > 0, g_{2} > 0\}$, négligeable, et $g = 0$ sur cet ensemble. Il en est de même sur un borélien $B$ de $\mathbb{R}^{n}$, en prolongeant par $0$.

    **4.** L'expression « $f \geqslant 0$ » signifie qu'un représentant, donc tous, est positif presque partout ; « $\lVert f \rVert_{p} = 0 \Rightarrow f = 0$ » signifie que la classe est la classe nulle : c'est la séparation de la norme sur $L^{p}$. Les trois affirmations sont vraies si on les entend pour un représentant mesurable : un élément de $L^{p}$ est une classe de fonctions mesurables, dont chaque représentant mesurable est fini presque partout puisque $|f|^{p}$ est intégrable, et l'inégalité de Markov ne dépend pas du représentant. En revanche, une fonction égale presque partout à une fonction mesurable n'est mesurable que si la tribu est complète.
