  source: "Lyon 1 (TD07 2020), exercice 15"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Soit $p_{1}$, …, $p_{k} \in [1, +\infty]$ tels que $\sum_{j}\frac{1}{p_{j}} = 1$. Montrer que $\lVert f_{1}\cdots f_{k} \rVert_{1} \leqslant \lVert f_{1} \rVert_{p_{1}}\cdots\lVert f_{k} \rVert_{p_{k}}$ pour toutes $f_{j}$ mesurables.

    **2.** Soit $p > 1$ et $r \in ]1, p[$. Montrer que, pour $f$, $g$ mesurables positives, $\lVert fg \rVert_{p/r} \leqslant \lVert f \rVert_{p}\lVert g \rVert_{p/(r-1)}$.
  corrige: |
    **1.** Par récurrence sur $k$, le cas $k = 2$ étant l'inégalité de Hölder. Si $p_{1} < +\infty$, soit $q_{1}$ son conjugué ; Hölder donne $\lVert f_{1}\cdots f_{k} \rVert_{1} \leqslant \lVert f_{1} \rVert_{p_{1}}\lVert f_{2}\cdots f_{k} \rVert_{q_{1}}$, et $\lVert f_{2}\cdots f_{k} \rVert_{q_{1}}^{q_{1}} = \lVert |f_{2}|^{q_{1}}\cdots|f_{k}|^{q_{1}} \rVert_{1}$. Les exposants $\frac{p_{j}}{q_{1}}$, $j \geqslant 2$, vérifient $\sum_{j \geqslant 2}\frac{q_{1}}{p_{j}} = q_{1}\big(1 - \frac{1}{p_{1}}\big) = 1$, et l'hypothèse de récurrence conclut. Si tous les $p_{j}$ valent $+\infty$ sauf un, l'inégalité est immédiate.

    **2.** Par Hölder avec les exposants conjugués $r$ et $\frac{r}{r - 1}$, 
    $$\int(fg)^{p/r} \leqslant \Big(\int f^{p}\Big)^{1/r}\Big(\int g^{\frac{p}{r - 1}}\Big)^{\frac{r - 1}{r}},$$
     et l'on élève à la puissance $\frac{r}{p}$. C'est le cas $k = 2$ de la question 1, sous la forme $\frac{r}{p} = \frac{1}{p} + \frac{r - 1}{p}$.
- id: "l3-in-08-04"
  feuille: "f-l3-in-08"
