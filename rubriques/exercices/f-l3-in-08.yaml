  enonce: |
    Montrer que les fonctions étagées de $L^{\infty}$ sont denses dans $L^{\infty}$. Les fonctions étagées nulles hors d'une partie de mesure finie sont-elles denses dans $L^{\infty}(\mathbb{R})$ ? Comparer avec la proposition 3 du cours.
  corrige: |
    Soit $f \in L^{\infty}$ et $M = \lVert f \rVert_{\infty}$ ; quitte à changer de représentant, $|f| \leqslant M$ partout. Les fonctions étagées $\varphi_{k}$ du théorème d'approximation (chapitre 3, th. 1), appliqué à $f^{+}$ et à $f^{-}$, vérifient $|f - \varphi_{k}| \leqslant 2^{-k}$ partout dès que $k \geqslant M$, puisque la convergence est uniforme là où la fonction est bornée. Donc $\lVert f - \varphi_{k} \rVert_{\infty} \to 0$. En revanche, sur $\mathbb{R}$, si $\varphi$ est nulle hors d'une partie $A$ de mesure finie, $\lVert 1 - \varphi \rVert_{\infty} \geqslant 1$, puisque $\mathbb{R} \setminus A$ est de mesure positive : les étagées à support de mesure finie ne sont pas denses dans $L^{\infty}(\mathbb{R})$. La proposition 3 du cours exige $p < +\infty$.
- id: "l3-in-08-17"
  feuille: "f-l3-in-08"
