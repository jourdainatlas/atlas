  enonce: |
    *Inégalité de Hardy.* Soit $1 < p < +\infty$ et $I = ]0, +\infty[$. Pour $f \in L^{p}(I)$, on pose $F(x) = \int_{0}^{x}f(t)\,\mathrm{d} t$.

    **1.** Justifier que $F$ est bien définie. Si $f$ est de classe $C^{1}$ à support compact dans $I$, montrer, à l'aide d'une intégration par parties, que 
    $$\int_{0}^{+\infty}\frac{|F(x)|^{p}}{x^{p}}\,\mathrm{d} x \leqslant \Big(\frac{p}{p - 1}\Big)^{p}\int_{0}^{+\infty}|f(x)|^{p}\,\mathrm{d} x.$$

    **2.** Montrer que cette inégalité reste vraie pour toute $f \in L^{p}(I)$. On admettra que les fonctions de classe $C^{1}$ à support compact dans $I$ sont denses dans $L^{p}(I)$ (feuille 9).
  corrige: |
    **1.** Par Hölder sur $[0, x]$, $\int_{0}^{x}|f| \leqslant x^{1/q}\lVert f \rVert_{p}$ : $F$ est définie, et $|F(x)| \leqslant x^{1/q}\lVert f \rVert_{p}$. Si $f$ est de classe $C^{1}$ à support dans $[\alpha, \beta] \subset I$, $F$ est nulle sur $]0, \alpha]$ et constante sur $[\beta, +\infty[$, de sorte que $I_{F} = \int_{0}^{+\infty}\frac{|F|^{p}}{x^{p}}$ est finie. Comme $u \mapsto |u|^{p}$ est de classe $C^{1}$, de dérivée $p|u|^{p-2}u$, une intégration par parties sur $[\alpha, A]$, puis $A \to +\infty$, donne, les termes de bord étant nuls à la limite, 
    $$I_{F} = \Big[\frac{|F|^{p}x^{1-p}}{1 - p}\Big]_{0}^{+\infty} + \frac{p}{p - 1}\int_{0}^{+\infty}\frac{|F|^{p-2}F f}{x^{p-1}} \leqslant \frac{p}{p - 1}\int_{0}^{+\infty}\Big(\frac{|F|}{x}\Big)^{p-1}|f| \leqslant \frac{p}{p - 1}I_{F}^{1/q}\lVert f \rVert_{p},$$
     par Hölder, puisque $(p - 1)q = p$. Si $I_{F} > 0$, on divise par $I_{F}^{1/q}$ : $I_{F}^{1/p} \leqslant \frac{p}{p - 1}\lVert f \rVert_{p}$, ce qu'il fallait.

    **2.** Soit $f_{k}$ de classe $C^{1}$ à support compact, avec $f_{k} \to f$ dans $L^{p}$. Par Hölder sur $[0, x]$, $F_{k}(x) \to F(x)$ pour tout $x$, et le lemme de Fatou donne 
    $$\int\frac{|F|^{p}}{x^{p}} \leqslant \liminf_{k}\int\frac{|F_{k}|^{p}}{x^{p}} \leqslant \Big(\frac{p}{p - 1}\Big)^{p}\lim_{k}\lVert f_{k} \rVert_{p}^{p} = \Big(\frac{p}{p - 1}\Big)^{p}\lVert f \rVert_{p}^{p}.$$
     La constante est optimale (ce que l'on ne demande pas) : l'opérateur $f \mapsto \frac{F}{x}$, la moyenne de $f$ sur $[0, x]$, est continu sur $L^{p}$ pour $p > 1$, mais pas pour $p = 1$.
