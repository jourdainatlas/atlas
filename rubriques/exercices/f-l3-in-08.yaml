  enonce: |
    *La « norme » $\lVert f \rVert_{p}$ quand $p \to 0$.* Soit $P$ une probabilité et $f$ mesurable, positive et intégrable. On pose encore $\lVert f \rVert_{p} = \big(\int f^{p}\,\mathrm{d} P\big)^{1/p}$ pour $p \in ]0, 1[$.

    **1.** Si $P(\{f > 0\}) < 1$, montrer à l'aide de l'inégalité de Hölder que $\lim_{p \to 0^{+}}\lVert f \rVert_{p} = 0$.

    **2.** Montrer que $\lim_{p \to 0^{+}}\int f^{p}\,\mathrm{d} P = P(\{f > 0\})$.

    **3.** Montrer que $\frac{|x^{p} - 1|}{p} \leqslant x + |\ln x|$ pour $p \in ]0, 1[$ et $x > 0$.

    **4.** On suppose désormais $f > 0$ et $\ln f$ intégrable. Montrer que $\lim_{p \to 0^{+}}\int\frac{f^{p} - 1}{p}\,\mathrm{d} P = \int\ln f\,\mathrm{d} P$, puis que 
    $$\lim_{p \to 0^{+}}\lVert f \rVert_{p} = \exp\Big(\int\ln f\,\mathrm{d} P\Big).$$
     Comparer avec l'inégalité entre moyennes arithmétique et géométrique.
  corrige: |
    **1.** Hölder avec les exposants $\frac{1}{p}$ et $\frac{1}{1 - p}$ : $\int f^{p} = \int f^{p}\chi_{\{f > 0\}} \leqslant \big(\int f\big)^{p}P(\{f > 0\})^{1-p}$, d'où $\lVert f \rVert_{p} \leqslant \int f\cdot P(\{f > 0\})^{\frac{1 - p}{p}} \to 0$, puisque $P(\{f > 0\}) < 1$.

    **2.** $f^{p} \to \chi_{\{f > 0\}}$ presque partout, avec $f^{p} \leqslant 1 + f$, intégrable : convergence dominée.

    **3.** Pour $x \geqslant 1$, par convexité de $t \mapsto x^{t}$, la pente $\frac{x^{p} - 1}{p}$ est inférieure à $\frac{x^{1} - 1}{1} \leqslant x$. Pour $0 < x < 1$, $\frac{1 - x^{p}}{p} = \frac{1 - \mathrm{e}^{-p|\ln x|}}{p} \leqslant |\ln x|$.

    **4.** Par la question 3 et la convergence dominée, $I_{p} = \int\frac{f^{p} - 1}{p} \to \int\ln f$, puisque $\frac{x^{p} - 1}{p} \to \ln x$. Ensuite $\ln\lVert f \rVert_{p} = \frac{1}{p}\ln(1 + pI_{p})$, qui tend vers $\int\ln f$, puisque $\ln(1 + u) \sim u$ : 
    $$\boxed{\lVert f \rVert_{p} \to \exp\big(\int\ln f\,\mathrm{d} P\big)}.$$
     Comme $\lVert f \rVert_{p} \leqslant \lVert f \rVert_{1}$ pour $p < 1$ (Jensen, $t \mapsto t^{p}$ étant concave), on obtient $\exp\int\ln f \leqslant \int f$ : c'est l'inégalité entre moyennes géométrique et arithmétique, que l'exercice 8 de la feuille 4 obtenait par Jensen.

    ![Figure](documents/figures/260d70f8ed3ca1f6.svg)

    Pour $f(x) = x + \frac{1}{2}$ sur $[0, 1]$, $p \mapsto \lVert f \rVert_{p}$ (ardoise) est croissante ; elle vaut la moyenne arithmétique $1$ en $p = 1$ (ocre), tend vers la moyenne géométrique $\exp\int\ln f \approx 0{,}956$ en $0$ (carmin), et vers $\sup f = 1{,}5$ en $+\infty$.
- id: "l3-in-08-15"
  feuille: "f-l3-in-08"
  numero: 15
  partie: "Convergences"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [convergences dans L^p]
  noeuds: [lp-completude]
