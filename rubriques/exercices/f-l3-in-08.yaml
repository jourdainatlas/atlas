  enonce: |
    Soit $U$ un ouvert non vide de $\mathbb{R}^{n}$, muni de la mesure de Lebesgue. Montrer que $\lVert f \rVert_{\infty} = \sup_{U}|f|$ pour toute $f$ continue sur $U$. Est-ce vrai pour une fonction continue sur un fermé, comme $\{0\} \cup [1, 2]$ ?
  corrige: |
    $|f| \leqslant \sup_{U}|f|$ partout, donc $\lVert f \rVert_{\infty} \leqslant \sup_{U}|f|$. Si $|f(x_{0})| > \lVert f \rVert_{\infty}$, par continuité $|f| > \lVert f \rVert_{\infty}$ sur une boule $B \subset U$, de mesure positive : absurde. D'où l'égalité. L'argument utilise que tout ouvert non vide de $U$ est de mesure positive. Sur $\{0\} \cup [1, 2]$, la fonction égale à $1$ en $0$ et à $0$ ailleurs est continue, de borne supérieure $1$, mais $\lVert f \rVert_{\infty} = 0$ : le point isolé est négligeable.
- id: "l3-in-08-10"
  feuille: "f-l3-in-08"
  numero: 10
