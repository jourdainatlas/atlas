  enonce: |
    **1.** Soit $P$ une probabilité sur $\Omega$, et $f$, $g : \Omega \to ]0, +\infty[$ mesurables telles que $fg \geqslant 1$. Montrer, par l'inégalité de Cauchy-Schwarz, que $\int f\,\mathrm{d} P\int g\,\mathrm{d} P \geqslant 1$.

    **2.** En déduire que $\big(\sum_{j = 1}^{n}a_{j}\big)\big(\sum_{j = 1}^{n}\frac{1}{a_{j}}\big) \geqslant n^{2}$ pour tous $a_{1}$, …, $a_{n} > 0$. Quel est le cas d'égalité ?
  corrige: |
    **1.** $1 \leqslant \sqrt{fg}$, donc, par Cauchy-Schwarz, $1 = \int 1\,\mathrm{d} P \leqslant \int\sqrt{f}\sqrt{g}\,\mathrm{d} P \leqslant \big(\int f\,\mathrm{d} P\big)^{1/2}\big(\int g\,\mathrm{d} P\big)^{1/2}$.

    **2.** Avec la probabilité uniforme sur $\{1, \dots, n\}$, $f(j) = a_{j}$ et $g(j) = \frac{1}{a_{j}}$ : $\frac{1}{n}\sum a_{j}\cdot\frac{1}{n}\sum\frac{1}{a_{j}} \geqslant 1$. L'égalité impose l'égalité dans Cauchy-Schwarz, $\sqrt{f}$ proportionnelle à $\sqrt{g}$, donc $a_{j}^{2}$ constant : 
    $$\boxed{\text{égalité si et seulement si les } a_{j} \text{ sont égaux}}.$$
