- id: "l3-in-08-01"
  feuille: "f-l3-in-08"
  numero: 1
  partie: "Inégalités"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [inégalités de Hölder et Minkowski]
  noeuds: [lp-holder, lp-minkowski, lp-young]
  notions: [inegalite-holder, inegalite-minkowski]
  source: "Lyon 1 (TD07 2020), exercice 1 ; Exo7 (fic00146), exercice 1"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Retrouver l'inégalité de Young $ab \leqslant \frac{a^{p}}{p} + \frac{b^{q}}{q}$ ($a$, $b \geqslant 0$, $1 < p < +\infty$) en étudiant $a \mapsto \frac{a^{p}}{p} + \frac{b^{q}}{q} - ab$.

    **2.** Soit $f \in \mathcal{L}^{p}$ et $g \in \mathcal{L}^{q}$. Montrer que, pour tout $\lambda > 0$, $\int|fg|\,\mathrm{d}\mu \leqslant \frac{\lambda^{p}}{p}\int|f|^{p}\,\mathrm{d}\mu + \frac{\lambda^{-q}}{q}\int|g|^{q}\,\mathrm{d}\mu$, et retrouver l'inégalité de Hölder en optimisant en $\lambda$. Est-elle vraie pour $p = 1$, $q = +\infty$ ?

    **3.** Soit $1 \leqslant p < p' < +\infty$ et $f \in \mathcal{L}^{p} \cap \mathcal{L}^{p'}$. Montrer que $f \in \mathcal{L}^{r}$ pour tout $r \in [p, p']$.
  corrige: |
    **1.** À $b$ fixé, $\theta(a) = \frac{a^{p}}{p} + \frac{b^{q}}{q} - ab$ a pour dérivée $a^{p-1} - b$, négative puis positive : son minimum est atteint en $a_{0} = b^{1/(p-1)} = b^{q/p}$, et vaut $\frac{b^{q}}{p} + \frac{b^{q}}{q} - b^{q/p + 1} = 0$, puisque $\frac{q}{p} + 1 = q$. Donc $\theta \geqslant 0$, avec égalité si et seulement si $a^{p} = b^{q}$.

    ![Figure](documents/figures/1a94cffb7f463acd.svg)

    Pour $p = 3$, $a = 1{,}2$ et $b = 1$ : l'aire sous la courbe $y = x^{p-1}$ jusqu'à $a$ (ardoise) vaut $\frac{a^{p}}{p}$, celle à gauche de la courbe jusqu'à $b$ (ocre) vaut $\frac{b^{q}}{q}$, puisque la réciproque de $x^{p-1}$ est $y^{q-1}$. Ensemble, elles recouvrent le rectangle $[0, a] \times [0, b]$ (carmin), d'aire $ab$ : c'est l'inégalité de Young, avec égalité lorsque le coin $(a, b)$ est sur la courbe.

    **2.** On applique l'inégalité de Young à $\lambda|f(x)|$ et $\lambda^{-1}|g(x)|$, puis on intègre. Si $\lVert f \rVert_{p}$ et $\lVert g \rVert_{q}$ sont non nuls, le choix $\lambda = \lVert g \rVert_{q}^{1/p}\lVert f \rVert_{p}^{-1/q}$ rend les deux termes égaux, à $\frac{1}{p}\lVert f \rVert_{p}\lVert g \rVert_{q}$ et $\frac{1}{q}\lVert f \rVert_{p}\lVert g \rVert_{q}$, d'où l'inégalité de Hölder ; si l'une des normes est nulle, $fg = 0$ presque partout. Pour $p = 1$, $q = +\infty$, l'inégalité est vraie, directement : $|fg| \leqslant \lVert g \rVert_{\infty}|f|$ presque partout.

    **3.** Pour $r \in [p, p']$, $|f|^{r} \leqslant |f|^{p}$ là où $|f| \leqslant 1$ et $|f|^{r} \leqslant |f|^{p'}$ là où $|f| > 1$ : $|f|^{r} \leqslant |f|^{p} + |f|^{p'}$, intégrable. L'exercice 4 précisera la norme.
- id: "l3-in-08-02"
  feuille: "f-l3-in-08"
  numero: 2
  partie: "Inégalités"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [inégalités de Hölder et Minkowski]
  noeuds: [lp-holder, lp-minkowski, lp-young]
  notions: [inegalite-holder, inegalite-minkowski]
  source: "Lyon 1 (TD07 2020), exercices 13 et 14"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    *Cas d'égalité.* Soit $1 < p < +\infty$.

    **1.** Soit $f \in \mathcal{L}^{p}$ et $g \in \mathcal{L}^{q}$, positives et non nulles presque partout. En examinant la démonstration de l'inégalité de Hölder, montrer que $\int fg = \lVert f \rVert_{p}\lVert g \rVert_{q}$ si et seulement s'il existe $C > 0$ tel que $f^{p} = Cg^{q}$ presque partout. Que devient cette condition si l'on ne suppose plus $f$, $g$ positives, l'égalité portant sur $\int|fg|$ ?

    **2.** En déduire que, pour $f$, $g \in \mathcal{L}^{p}$ non nulles, $\lVert f + g \rVert_{p} = \lVert f \rVert_{p} + \lVert g \rVert_{p}$ si et seulement s'il existe $C > 0$ tel que $f = Cg$ presque partout. Que devient cette condition pour $p = 1$ ?
  corrige: |
    **1.** Si $\int fg = \lVert f \rVert_{p}\lVert g \rVert_{q}$, les fonctions $a = \frac{f}{\lVert f \rVert_{p}}$ et $b = \frac{g}{\lVert g \rVert_{q}}$ vérifient $\int\big(\frac{a^{p}}{p} + \frac{b^{q}}{q} - ab\big) = \frac{1}{p} + \frac{1}{q} - 1 = 0$. L'intégrande est positif, donc nul presque partout, et le cas d'égalité de Young donne $a^{p} = b^{q}$ presque partout, soit $f^{p} = Cg^{q}$ avec $C = \frac{\lVert f \rVert_{p}^{p}}{\lVert g \rVert_{q}^{q}}$. La réciproque est un calcul direct. Sans hypothèse de signe, le même raisonnement appliqué à $|f|$ et $|g|$ donne : $\int|fg| = \lVert f \rVert_{p}\lVert g \rVert_{q}$ si et seulement si $|f|^{p} = C|g|^{q}$ presque partout ; pour avoir $\int fg = \lVert f \rVert_{p}\lVert g \rVert_{q}$ avec $f$, $g$ réelles, il faut de plus $fg \geqslant 0$ presque partout.

    **2.** La démonstration de Minkowski écrit 
    $$\int|f + g|^{p} \leqslant \int|f||f + g|^{p-1} + \int|g||f + g|^{p-1} \leqslant (\lVert f \rVert_{p} + \lVert g \rVert_{p})\lVert f + g \rVert_{p}^{p-1}.$$
     L'égalité impose l'égalité dans les deux inégalités. La première demande $|f + g| = |f| + |g|$ presque partout, c'est-à-dire que $f$ et $g$ ont presque partout le même signe, ou le même argument dans le cas complexe ; la seconde, par la question 1 avec $|f + g|^{p-1} \in L^{q}$, demande $|f|^{p} = C_{1}|f + g|^{p}$ et $|g|^{p} = C_{2}|f + g|^{p}$. Donc $|f| = c|g|$ avec $c > 0$, et, avec l'égalité des signes, $f = cg$ presque partout. La réciproque est immédiate. Pour $p = 1$, la seconde condition disparaît : $\lVert f + g \rVert_{1} = \lVert f \rVert_{1} + \lVert g \rVert_{1}$ si et seulement si $f$ et $g$ ont presque partout le même signe là où elles sont toutes deux non nulles, ce qui n'impose plus la proportionnalité.
- id: "l3-in-08-03"
  feuille: "f-l3-in-08"
  numero: 3
  partie: "Inégalités"
  etoiles: 1
