  noeuds: [lp-dual, lp-radon-nikodym]
  notions: [espace-Lp]
  source: "Exo7 (fic00149), exercice 2"
  page_enonce: 5
  page_corrige: 9
  enonce: |
    *$L^{\infty}$ n'est pas séparable.*

    **1.** Soit $E$ un espace de Banach. On suppose qu'il existe une famille non dénombrable $(O_{i})_{i \in I}$ d'ouverts non vides deux à deux disjoints de $E$. Montrer que $E$ n'est pas séparable.

    **2.** Pour $a \in \mathbb{R}^{n}$, soit $f_{a} = \chi_{B(a, 1)}$ et $O_{a} = \{f \in L^{\infty}(\mathbb{R}^{n}) ; \lVert f - f_{a} \rVert_{\infty} < \frac{1}{2}\}$. Montrer que les $O_{a}$ sont deux à deux disjoints, et conclure.

    **3.** Montrer au contraire que $L^{p}(\mathbb{R}^{n})$ est séparable pour $1 \leqslant p < +\infty$, à l'aide des combinaisons linéaires à coefficients rationnels d'indicatrices de pavés à sommets rationnels.
  corrige: |
    **1.** Si $D$ est une partie dénombrable dense, chaque ouvert $O_{i}$ contient un point $d_{i}$ de $D$, et $i \mapsto d_{i}$ est injective, les $O_{i}$ étant disjoints : $I$ serait dénombrable.

    **2.** Pour $a \neq b$, $B(a, 1) \,\triangle\, B(b, 1)$ contient un ouvert non vide, donc est de mesure positive, et $\lVert f_{a} - f_{b} \rVert_{\infty} = 1$. Si $f \in O_{a} \cap O_{b}$, $\lVert f_{a} - f_{b} \rVert_{\infty} < \frac{1}{2} + \frac{1}{2}$ : absurde. $\mathbb{R}^{n}$ n'étant pas dénombrable, $L^{\infty}(\mathbb{R}^{n})$ n'est pas séparable.

    **3.** Les étagées à support de mesure finie sont denses (cours, prop. 3). Pour $A$ de mesure finie et $\varepsilon > 0$, il existe un ouvert $U \supset A$ avec $\lambda(U \setminus A) < \varepsilon$ (chapitre 2, prop. 11) ; $U$ est réunion dénombrable de cubes dyadiques disjoints (chapitre 1, prop. 9), et une réunion finie $V$ de ces cubes vérifie $\lambda(U \setminus V) < \varepsilon$. Alors $\lVert \chi_{A} - \chi_{V} \rVert_{p}^{p} = \lambda(A \,\triangle\, V) < 2\varepsilon$. Les combinaisons à coefficients rationnels (ou de partie réelle et imaginaire rationnelles) d'indicatrices de cubes dyadiques forment une famille dénombrable dense.
- id: "l3-in-08-22"
  feuille: "f-l3-in-08"
  numero: 22
  partie: "Compléments"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [compléments sur L^p]
  noeuds: [lp-dual, lp-radon-nikodym]
  notions: [espace-Lp]
  source: "Exo7 (fic00149), exercice 3"
  page_enonce: 6
  page_corrige: 9
  enonce: |
    *Une variante de la démonstration du théorème de Radon-Nikodym.* Soit $\mu$ et $\nu$ deux mesures finies sur $(\Omega, \mathcal{T})$, avec $\nu \ll \mu$. On pose $\alpha = \mu + 2\nu$ et $\omega = 2\mu + \nu$.

    **1.** Montrer que $\varphi(f) = \int f\,\mathrm{d}\omega$ définit une forme linéaire continue sur $L^{2}(\Omega, \alpha)$.

    **2.** En déduire qu'il existe $g \in L^{2}(\alpha)$ réelle telle que $\int f(2g - 1)\,\mathrm{d}\nu = \int f(2 - g)\,\mathrm{d}\mu$ pour toute $f \in L^{2}(\alpha)$.

    **3.** Montrer que les ensembles $S_{1}^{l} = \{g < \frac{1}{2} - \frac{1}{l}\}$ et $S_{2}^{l} = \{g > 2 + \frac{1}{l}\}$, $l \geqslant 1$, sont de mesure nulle pour $\mu$ et pour $\nu$. En déduire que l'on peut choisir $\frac{1}{2} \leqslant g \leqslant 2$, et que $Z = \{g = \frac{1}{2}\}$ est $\mu$-négligeable.

    **4.** Montrer que $h = \frac{2 - g}{2g - 1}$ est bien définie presque partout, positive, intégrable pour $\mu$, et que $\int F\,\mathrm{d}\nu = \int Fh\,\mathrm{d}\mu$ pour toute $F$ mesurable positive.
  corrige: |
    **1.** $\omega \leqslant 2\alpha$, donc $\big|\int f\,\mathrm{d}\omega\big| \leqslant 2\int|f|\,\mathrm{d}\alpha \leqslant 2\alpha(\Omega)^{1/2}\lVert f \rVert_{L^{2}(\alpha)}$ ; $\varphi$ est bien définie sur les classes, une partie $\alpha$-négligeable étant $\omega$-négligeable.

    **2.** Par la proposition 5 du cours, il existe $g \in L^{2}(\alpha)$ tel que $\int f\,\mathrm{d}\omega = \int fg\,\mathrm{d}\alpha$ pour toute $f$ ; comme $\varphi$ est réelle sur les fonctions réelles, on peut prendre $g$ réelle. En développant $\omega$ et $\alpha$, $2\int f\,\mathrm{d}\mu + \int f\,\mathrm{d}\nu = \int fg\,\mathrm{d}\mu + 2\int fg\,\mathrm{d}\nu$, soit l'identité annoncée.

    **3.** Avec $f = \chi_{S_{1}^{l}}$, qui est dans $L^{2}(\alpha)$ puisque $\alpha$ est finie, on a 
    $$\int_{S_{1}^{l}}(2g - 1)\,\mathrm{d}\nu \leqslant -\frac{2}{l}\nu(S_{1}^{l}) \leqslant 0, \qquad \int_{S_{1}^{l}}(2 - g)\,\mathrm{d}\mu \geqslant \frac{3}{2}\mu(S_{1}^{l}) \geqslant 0,$$
     et ces deux intégrales sont égales : les deux sont nuls, donc $\mu(S_{1}^{l}) = \nu(S_{1}^{l}) = 0$. De même pour $S_{2}^{l}$, avec les signes échangés. En réunissant sur $l$, $\frac{1}{2} \leqslant g \leqslant 2$ $(\mu + \nu)$-presque partout, et l'on modifie $g$ sur une partie négligeable. Avec $f = \chi_{Z}$, le membre de gauche est nul et celui de droite vaut $\frac{3}{2}\mu(Z)$ : $\mu(Z) = 0$, puis $\nu(Z) = 0$ puisque $\nu \ll \mu$. C'est le seul endroit où sert l'absolue continuité.

    **4.** $h$ est définie et positive hors de $Z$. Soit $F$ mesurable bornée positive, $E_{k} = \{2g - 1 \geqslant \frac{1}{k}\}$ et $f_{k} = \frac{F\chi_{E_{k}}}{2g - 1}$, bornée, donc dans $L^{2}(\alpha)$. L'identité de la question 2 donne $\int_{E_{k}}F\,\mathrm{d}\nu = \int_{E_{k}}Fh\,\mathrm{d}\mu$. Les $E_{k}$ croissent vers $\Omega \setminus Z$, de complémentaire négligeable pour $\mu$ et $\nu$ ; par convergence monotone, $\int F\,\mathrm{d}\nu = \int Fh\,\mathrm{d}\mu$, puis, en remplaçant $F$ par $\min(F, N)$, pour toute $F$ positive. Avec $F = 1$, $\int h\,\mathrm{d}\mu = \nu(\Omega) < +\infty$ : $h \in L^{1}(\mu)$. Le cours obtient le même résultat avec la seule mesure $\rho = \mu + \nu$ ; le choix de deux mesures auxiliaires ne fait que décaler les bornes de $g$.

