  enonce: |
    *Les espaces $\ell^{p}$.*

    **1.** Montrer que, pour la mesure de comptage, l'égalité presque partout est l'égalité, et que $\ell^{p}$ s'identifie à l'espace des suites $(a_{n})$ telles que $\sum|a_{n}|^{p} < +\infty$, de norme $\big(\sum|a_{n}|^{p}\big)^{1/p}$ ; et $\ell^{\infty}$ à celui des suites bornées, de norme $\sup|a_{n}|$.

    **2.** À l'aide des suites $(n^{-\alpha})$, montrer que l'inclusion $\ell^{p} \subset \ell^{r}$, pour $p < r$, est stricte.

    **3.** Soit $(a_{n}) \in \ell^{p}$ avec $p < +\infty$. Montrer que $\lVert a \rVert_{s} \to \lVert a \rVert_{r}$ quand $s \to r$, pour $r > p$, et que $\lVert a \rVert_{s} \to \lVert a \rVert_{\infty}$ quand $s \to +\infty$. Pour une suite quelconque et $1 \leqslant r < +\infty$, montrer que $\lim_{s \to r^{+}}\lVert a \rVert_{s} = \lVert a \rVert_{r}$, dans $[0, +\infty]$.
  corrige: |
    **1.** Pour la mesure de comptage, seule la partie vide est négligeable : l'égalité presque partout est l'égalité, chaque classe a un seul élément, et $\int|a|^{p}\,\mathrm{d}\mu = \sum|a_{n}|^{p}$ ; de même $\lVert a \rVert_{\infty} = \sup|a_{n}|$, puisque $|a_{n}| \leqslant M$ « presque partout » signifie pour tout $n$.

    **2.** $(n^{-\alpha})_{n \geqslant 1} \in \ell^{p}$ si et seulement si $\alpha p > 1$ : pour $p < r$, $(n^{-1/p})$ est dans $\ell^{r}$ et pas dans $\ell^{p}$.

    **3.** Pour $s$ dans un compact de $[p, +\infty[$, $|a_{n}|^{s} \leqslant |a_{n}|^{p}\max(1, \lVert a \rVert_{\infty})^{s}$, terme général d'une série convergente indépendante de $s$ : par convergence dominée pour la mesure de comptage, $\sum|a_{n}|^{s} \to \sum|a_{n}|^{r}$ quand $s \to r$, d'où $\lVert a \rVert_{s} \to \lVert a \rVert_{r}$. Ensuite $\lVert a \rVert_{\infty} \leqslant \lVert a \rVert_{s}$ et $\lVert a \rVert_{s}^{s} \leqslant \lVert a \rVert_{\infty}^{s-p}\lVert a \rVert_{p}^{p}$, soit $\lVert a \rVert_{\infty} \leqslant \lVert a \rVert_{s} \leqslant \lVert a \rVert_{\infty}^{1 - p/s}\lVert a \rVert_{p}^{p/s} \to \lVert a \rVert_{\infty}$. Enfin, pour une suite quelconque, $s \mapsto \lVert a \rVert_{s}$ décroît (cours, prop. 2 (ii)). Si $a \in \ell^{r}$, ce qui précède, appliqué avec $p = r$, donne la limite. Sinon, le lemme de Fatou donne $\liminf_{s \to r^{+}}\sum|a_{n}|^{s} \geqslant \sum|a_{n}|^{r} = +\infty$, et $\lVert a \rVert_{s} \to +\infty = \lVert a \rVert_{r}$.
- id: "l3-in-08-12"
