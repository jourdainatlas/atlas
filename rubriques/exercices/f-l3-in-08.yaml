  source: "Lyon 1 (TD07 2020), exercice 8 ; Exo7 (fic00148), exercices 1 (2) et 3 (1)"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Pour quelles valeurs de $p \in [1, +\infty]$ a-t-on $f \in L^{p}(U)$ dans les cas suivants ?

    **1.** $U = ]0, 1]$ et $f(x) = x^{-a}$, $a \in \mathbb{R}$ ; $U = \mathbb{R}$ et $f = \chi_{\mathbb{Q}}$ ; $U = ]0, +\infty[$ et $f(x) = \frac{\sin x}{x}$.

    **2.** $U = \{x \in \mathbb{R}^{n} ; |x| \geqslant 1\}$ et $f(x) = \frac{\sin|x|}{|x|^{a}}$, $a \in \mathbb{R}$ ; $U = \mathbb{R}^{n}$ et $f(x) = (1 + |x|^{2})^{-\alpha}$ ; $U = \mathbb{R}^{n}$ et $f(x) = |x|^{-\beta}\mathrm{e}^{-|x|^{2}/2}$.

    **3.** Pour $1 \leqslant r < s \leqslant +\infty$, en déduire une fonction de $L^{r}(\mathbb{R}^{n})$ qui n'est pas dans $L^{s}(\mathbb{R}^{n})$, et une fonction de $L^{s}(\mathbb{R}^{n})$ qui n'est pas dans $L^{r}(\mathbb{R}^{n})$. Sur la boule unité, montrer de même que l'inclusion $L^{s} \subset L^{r}$ est stricte.
  corrige: |
    **1.** $x^{-a} \in L^{p}(]0, 1])$ pour $p < +\infty$ si et seulement si $ap < 1$, et pour $p = \infty$ si et seulement si $a \leqslant 0$ : 
    $$\boxed{p \in [1, \frac{1}{a}[ \text{ si } 0 < a < 1, \text{ aucun si } a \geqslant 1, \text{ tous si } a \leqslant 0}.$$
     $\chi_{\mathbb{Q}}$ est nulle presque partout : tous les $p$. $\frac{\sin x}{x}$ est bornée, et, pour $p > 1$, $\big|\frac{\sin x}{x}\big|^{p} \leqslant \min(1, x^{-p})$, intégrable ; elle n'est pas intégrable (feuille 5, exercice 16) : $\boxed{p \in ]1, +\infty]}$.

    **2.** Par la formule des fonctions radiales (chapitre 6, prop. 4), 
    $$\int_{|x| \geqslant 1}\frac{|\sin|x||^{p}}{|x|^{ap}}\,\mathrm{d} x = nv_{n}\int_{1}^{+\infty}|\sin r|^{p}r^{n-1-ap}\,\mathrm{d} r.$$
     Sur chaque période, $|\sin r|^{p}$ a une moyenne $c_{p} > 0$, et l'intégrale est finie si et seulement si $ap > n$ : 
    $$\boxed{p \in ]\frac{n}{a}, +\infty] \text{ si } a > 0},$$
     seulement $p = \infty$ si $a = 0$, aucun si $a < 0$. De même, $(1 + |x|^{2})^{-\alpha} \in L^{p}$ si et seulement si $2\alpha p > n$ (ou $\alpha \geqslant 0$ pour $p = \infty$), et $|x|^{-\beta}\mathrm{e}^{-|x|^{2}/2} \in L^{p}$ si et seulement si $\beta p < n$ (ou $\beta \leqslant 0$ pour $p = \infty$) : la première fonction décide à l'infini, la seconde en $0$.

    **3.** Pour $r < s < +\infty$, $|x|^{-n/s}\mathrm{e}^{-|x|^{2}/2}$ est dans $L^{r}$ mais pas dans $L^{s}$, et $(1 + |x|^{2})^{-n/(2r)}$ est dans $L^{s}$ mais pas dans $L^{r}$ ; pour $s = \infty$, on prend l'exposant $\frac{n}{2r}$ à la place de $\frac{n}{s}$, et la fonction $1$. Sur la boule unité, $|x|^{-n/s}$ est dans $L^{r}$ mais pas dans $L^{s}$ : les deux phénomènes, singularité locale et décroissance lente, empêchent toute inclusion entre les $L^{p}(\mathbb{R}^{n})$.
