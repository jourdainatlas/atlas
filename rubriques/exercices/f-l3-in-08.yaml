  source: "Lyon 1 (TD07 2020), exercice 12 ; Exo7 (fic00146), exercice 2"
  page_enonce: 4
  page_corrige: 6
  enonce: |
    **1.** Soit $1 \leqslant p \leqslant +\infty$. Si $f_{n} \to f$ dans $L^{p}$ et $f_{n} \to g$ presque partout, quelle relation y a-t-il entre $f$ et $g$ ?

    **2.** *Complétude de $L^{\infty}$.* Soit $(f_{n})$ une suite de Cauchy de $L^{\infty}$. On pose $A_{k} = \{|f_{k}| > \lVert f_{k} \rVert_{\infty}\}$ et $B_{m, n} = \{|f_{m} - f_{n}| > \lVert f_{m} - f_{n} \rVert_{\infty}\}$. Montrer que $E = \bigcup_{k}A_{k} \cup \bigcup_{m, n}B_{m, n}$ est négligeable, que $(f_{n})$ converge uniformément sur $\Omega \setminus E$ vers une fonction $f$, et conclure.

    **3.** Montrer, sur un exemple, qu'une suite convergente dans $L^{p}$, $p < +\infty$, peut ne converger presque partout que le long d'une sous-suite.
  corrige: |
    **1.** Une sous-suite de $(f_{n})$ converge presque partout vers $f$ (cours, th. 2) ; elle converge aussi vers $g$ : $\boxed{f = g \text{ p.p.}}$.

    **2.** $A_{k}$ est négligeable par l'exercice 8, question 1, et de même $B_{m, n}$ ; $E$, réunion dénombrable, l'est aussi. Hors de $E$, $|f_{m} - f_{n}| \leqslant \lVert f_{m} - f_{n} \rVert_{\infty}$ : la suite est uniformément de Cauchy sur $\Omega \setminus E$, donc converge uniformément vers une fonction $f$, que l'on prolonge par $0$ sur $E$. Elle est mesurable, bornée sur $\Omega \setminus E$, et $\lVert f_{n} - f \rVert_{\infty} \leqslant \sup_{\Omega \setminus E}|f_{n} - f| \to 0$ : $L^{\infty}$ est complet, et la convergence a lieu presque partout pour la suite entière.

    **3.** Les indicatrices $\chi_{A_{n}}$ de la « machine à écrire » de l'exercice 17 tendent vers $0$ dans tout $L^{p}$, $p < +\infty$, puisque $\lVert \chi_{A_{n}} \rVert_{p}^{p} = \frac{1}{2m + 1}$, sans converger en aucun point.
