  page_corrige: 5
  enonce: |
    On suppose $\mu$ finie.

    **1.** Retrouver $\lVert f \rVert_{p} \leqslant \mu(\Omega)^{1/p - 1/r}\lVert f \rVert_{r}$ pour $1 \leqslant p \leqslant r \leqslant +\infty$, à l'aide de l'inégalité de Hölder. En déduire $L^{\infty} \subset L^{p_{2}} \subset L^{p_{1}} \subset L^{1}$ pour $p_{1} \leqslant p_{2}$, et que $L^{\infty} \subset \bigcap_{p \geqslant 1}L^{p}$. L'inclusion est-elle une égalité ?

    **2.** Soit $f \in L^{p}$ avec $p > 1$. Montrer que $r \mapsto \lVert f \rVert_{r}$ est continue sur $[1, p]$.

    **3.** Soit $f \in L^{\infty}$. Montrer que $p \mapsto \lVert f \rVert_{p}$ est continue sur $[1, +\infty]$.
  corrige: |
    **1.** Hölder appliqué à $|f|^{p}\cdot 1$, avec les exposants $\frac{r}{p}$ et son conjugué, donne 
    $$\int|f|^{p} \leqslant \Big(\int|f|^{r}\Big)^{p/r}\mu(\Omega)^{1 - p/r},$$
     puis on élève à la puissance $\frac{1}{p}$. Les inclusions en découlent. L'inclusion $L^{\infty} \subset \bigcap_{p}L^{p}$ est stricte : sur $]0, 1]$, $\ln x$ est dans tous les $L^{p}$, puisque $|\ln x|^{p}$ est intégrable, mais n'est pas bornée.

    **2.** Pour $r \in [1, p]$, $|f|^{r} \leqslant 1 + |f|^{p}$, intégrable puisque $\mu$ est finie, et $r \mapsto |f|^{r}$ est continue presque partout (là où $f$ est finie) : par convergence dominée, $r \mapsto \int|f|^{r}$ est continue, et aussi $r \mapsto \lVert f \rVert_{r}$.

    **3.** Sur $[1, R]$, la domination par $\max(1, \lVert f \rVert_{\infty})^{R}$ donne la continuité ; en $+\infty$, c'est la proposition 2 (iii) du cours.
- id: "l3-in-08-13"
  feuille: "f-l3-in-08"
  numero: 13
  partie: "Les espaces $L^{p}$"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [les espaces L^p, théorème de Radon-Nikodym]
  noeuds: [lp-completude, lp-inclusions, lp-densite, lp-radon-nikodym]
  notions: [espace-Lp, absolument-continue, derivee-radon-nikodym, mesure-densite]
  source: "Lyon 1 (TD07 2020), exercice 11"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $I = [0, +\infty[$, $1 \leqslant p \leqslant +\infty$, $f \in L^{p}(I)$ et $F(x) = \int_{0}^{x}f(t)\,\mathrm{d} t$.

    **1.** Donner un sens à cette définition, et montrer que $F$ est bien définie.

    **2.** Si $p = +\infty$, montrer que $F$ est lipschitzienne ; si $1 < p < +\infty$, qu'elle est höldérienne : il existe $C$ et $\alpha \in ]0, 1[$, que l'on déterminera, tels que $|F(x) - F(y)| \leqslant C|x - y|^{\alpha}$.

    **3.** Si $p = 1$, montrer que $F$ est continue, et même *absolument continue* : pour tout $\varepsilon > 0$, il existe $\delta > 0$ tel que, si $a_{1} < b_{1} \leqslant a_{2} < b_{2} \leqslant \dots \leqslant a_{n} < b_{n}$ et $\sum(b_{j} - a_{j}) < \delta$, alors $\sum|F(b_{j}) - F(a_{j})| < \varepsilon$.
  corrige: |
    **1.** $F(x) = \int_{[0, x]}f\,\mathrm{d}\lambda$ ne dépend pas du représentant de $f$, et $f \in L^{1}([0, x])$ par la question 1 de l'exercice 12.

    **2.** $|F(x) - F(y)| \leqslant \int_{[y, x]}|f|$, et Hölder sur $[y, x]$ donne $|F(x) - F(y)| \leqslant \lVert f \rVert_{p}|x - y|^{1/q}$. Pour $p = \infty$, $F$ est $\lVert f \rVert_{\infty}$-lipschitzienne ; pour $1 < p < +\infty$, elle est höldérienne d'exposant $\boxed{\alpha = 1 - \frac{1}{p}}$, avec $C = \lVert f \rVert_{p}$.

    **3.** Soit $\eta$ associé à $\varepsilon$ par la continuité absolue de l'intégrale (chapitre 4, prop. 8 (ii)). Si $\sum(b_{j} - a_{j}) < \eta$, la réunion des $[a_{j}, b_{j}]$ est de mesure $< \eta$, et $\sum|F(b_{j}) - F(a_{j})| \leqslant \int_{\bigcup[a_{j}, b_{j}]}|f| < \varepsilon$. Le cas $n = 1$ donne l'uniforme continuité. La propriété est plus forte que la continuité uniforme : elle contrôle la somme des variations sur une famille d'intervalles disjoints.
