  notions: [inegalite-holder, inegalite-minkowski]
  source: "Lyon 1 (TD07 2020), exercice 17 ; Exo7 (fic00148), exercice 3 (2) (interpolation)"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    *Interpolation.* Soit $1 \leqslant p_{0} < p < p_{1} \leqslant +\infty$.

    **1.** Montrer qu'il existe un unique $\theta \in ]0, 1[$ tel que $\frac{1}{p} = \frac{\theta}{p_{0}} + \frac{1 - \theta}{p_{1}}$.

    **2.** Montrer que $\lVert f \rVert_{p} \leqslant \lVert f \rVert_{p_{0}}^{\theta}\lVert f \rVert_{p_{1}}^{1-\theta}$ pour toute $f$ mesurable. Interpréter en termes de convexité de $\frac{1}{p} \mapsto \ln\lVert f \rVert_{p}$.

    **3.** Sur $\mathbb{R}^{n}$, avec $p_{1} < +\infty$, montrer que $L^{p_{0}} \cap L^{p_{1}}$, muni de la norme $\lVert f \rVert_{p_{0}} + \lVert f \rVert_{p_{1}}$, est un espace de Banach.
  corrige: |
    **1.** $s \mapsto \frac{s}{p_{0}} + \frac{1 - s}{p_{1}}$ est affine, strictement décroissante, de $\frac{1}{p_{1}}$ à $\frac{1}{p_{0}}$ sur $[0, 1]$ : $\theta = \frac{1/p - 1/p_{1}}{1/p_{0} - 1/p_{1}}$.

    **2.** Si $p_{1} < +\infty$, on écrit $|f|^{p} = |f|^{\theta p}|f|^{(1-\theta)p}$ et l'on applique Hölder avec les exposants $\frac{p_{0}}{\theta p}$ et $\frac{p_{1}}{(1 - \theta)p}$, dont les inverses ont pour somme $1$ : 
    $$\int|f|^{p} \leqslant \Big(\int|f|^{p_{0}}\Big)^{\frac{\theta p}{p_{0}}}\Big(\int|f|^{p_{1}}\Big)^{\frac{(1-\theta)p}{p_{1}}},$$
     puis on élève à la puissance $\frac{1}{p}$. Si $p_{1} = +\infty$, $\theta = \frac{p_{0}}{p}$ et $\int|f|^{p} \leqslant \lVert f \rVert_{\infty}^{p - p_{0}}\int|f|^{p_{0}}$. L'inégalité dit que $s \mapsto \ln\lVert f \rVert_{1/s}$ est convexe : sur le segment $[\frac{1}{p_{1}}, \frac{1}{p_{0}}]$, son graphe est sous la corde.

    ![Figure](documents/figures/466d8484c6ece8c2.svg)

    Pour $f = 3\chi_{[0, 1]} + \chi_{]1, 5]}$, $\ln\lVert f \rVert_{1/s} = s\ln(3^{1/s} + 4)$ (ardoise) est convexe, sous la corde entre $s = 0$ et $s = 1$ (tirets ocre). Quand $s \to 0$, c'est-à-dire $p \to +\infty$, elle tend vers $\ln\lVert f \rVert_{\infty} = \ln 3$ (carmin).

    **3.** $N(f) = \lVert f \rVert_{p_{0}} + \lVert f \rVert_{p_{1}}$ est une norme sur $L^{p_{0}} \cap L^{p_{1}}$. Si $(f_{n})$ est de Cauchy pour $N$, elle l'est dans $L^{p_{0}}$ et dans $L^{p_{1}}$, qui sont complets (cours, th. 2) : $f_{n} \to f$ dans $L^{p_{0}}$ et $f_{n} \to g$ dans $L^{p_{1}}$. Une sous-suite converge presque partout vers $f$, et une sous-suite de celle-ci vers $g$ : $f = g$ presque partout, et $N(f_{n} - f) \to 0$.
