  enonce: |
    *Convergence en mesure.* On dit que $(f_{n})$ converge vers $f$ *en mesure* si, pour tout $\varepsilon > 0$, $\mu(\{|f_{n} - f| > \varepsilon\}) \to 0$.

    **1.** Montrer que la convergence dans $L^{p}$, $1 \leqslant p < +\infty$, entraîne la convergence en mesure. Si $\mu$ est finie, montrer que la convergence presque partout entraîne la convergence en mesure. Ces deux résultats subsistent-ils si $p = +\infty$, ou si $\mu$ est infinie ?

    **2.** Si $f_{n} \to f$ en mesure, montrer qu'il existe une sous-suite telle que $\mu(\{|f_{n_{k}} - f| > \frac{1}{k}\}) < \frac{1}{k^{2}}$, puis que $f_{n_{k}} \to f$ presque partout.

    **3.** *La « machine à écrire ».* Sur $[0, 1]$, pour $n \geqslant 1$, soit $m$ l'entier tel que $m^{2} \leqslant n < (m + 1)^{2}$, $A_{n} = \big[\frac{n - m^{2}}{2m + 1}, \frac{n + 1 - m^{2}}{2m + 1}\big]$ et $f_{n} = \sqrt{m}\,\chi_{A_{n}}$. Montrer que $f_{n} \to 0$ dans $L^{1}$, qu'il n'existe pas de fonction $g$ intégrable telle que $|f_{n}| \leqslant g$ pour tout $n$, et que $(f_{n}(x))$ ne tend vers $0$ en aucun point.
  corrige: |
    **1.** Par Markov, $\mu(\{|f_{n} - f| > \varepsilon\}) \leqslant \varepsilon^{-p}\lVert f_{n} - f \rVert_{p}^{p} \to 0$. Si $\mu$ est finie et $f_{n} \to f$ presque partout, $\chi_{\{|f_{n} - f| > \varepsilon\}} \to 0$ presque partout, dominé par $1$, intégrable : la convergence en mesure suit par convergence dominée. Pour $p = \infty$, la convergence dans $L^{\infty}$ est uniforme hors d'une partie négligeable, et entraîne la convergence en mesure. Si $\mu$ est infinie, la convergence presque partout ne suffit pas : $\chi_{[n, n+1]} \to 0$ partout, mais $\lambda(\{\chi_{[n, n+1]} > \frac{1}{2}\}) = 1$.

    **2.** On choisit $n_{1} < n_{2} < \dots$ tels que $\mu(E_{k}) < \frac{1}{k^{2}}$, où $E_{k} = \{|f_{n_{k}} - f| > \frac{1}{k}\}$. Comme $\sum\mu(E_{k}) < +\infty$, le lemme de Borel-Cantelli (chapitre 1, prop. 17) montre que presque tout $x$ n'appartient qu'à un nombre fini des $E_{k}$ : pour un tel $x$, $|f_{n_{k}}(x) - f(x)| \leqslant \frac{1}{k}$ pour $k$ grand.

    **3.** Pour $m$ fixé, les $2m + 1$ valeurs $n = m^{2}, \dots, m^{2} + 2m$ donnent des intervalles $A_{n}$ de longueur $\frac{1}{2m + 1}$ qui recouvrent $[0, 1]$. Ainsi $\int f_{n} = \frac{\sqrt{m}}{2m + 1} \to 0$. Mais, pour tout $x$ et tout $m$, il existe $n$ tel que $x \in A_{n}$, et $f_{n}(x) = \sqrt{m} \geqslant 1$ : $(f_{n}(x))$ ne tend vers $0$ en aucun point, et une majorante $g$ vérifierait $g \geqslant \sqrt{m}$ partout pour tout $m$, donc $g = +\infty$. La convergence dans $L^{1}$ n'entraîne la convergence presque partout que pour une sous-suite, et la réciproque du théorème de convergence dominée est fausse.

    ![Figure](documents/figures/c377c584aec6b80f.svg)

    Les supports $A_{n}$ des fonctions $f_{1}$ à $f_{15}$, une ligne par fonction : pour chaque $m$ (couleur), les $2m + 1$ intervalles balaient $[0, 1]$ de gauche à droite, comme le chariot d'une machine à écrire. Leur longueur tend vers $0$, mais chaque point est touché une fois à chaque passage.
- id: "l3-in-08-18"
  feuille: "f-l3-in-08"
  numero: 18
  partie: "Convergences"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [convergences dans L^p]
  noeuds: [lp-completude]
  notions: [espace-Lp]
  source: "Féjoz (exosIntegration), exercice 5.2 ; Bibmath (F. Bayart), «~Intégrale de Lebesgue~», exercice 5"
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Soit $(f_{n})$ une suite de fonctions intégrables qui converge presque partout vers une fonction intégrable $f$.

    **1.** Montrer que, si $\lVert f_{n} - f \rVert_{1} \to 0$, alors $\int f_{n} \to \int f$ et $\lVert f_{n} \rVert_{1} \to \lVert f \rVert_{1}$.

    **2.** *Lemme de Scheffé.* On suppose $\lVert f_{n} \rVert_{1} \to \lVert f \rVert_{1}$. Montrer que $\lVert f_{n} - f \rVert_{1} \to 0$, en appliquant le lemme de Fatou à $|f| + |f_{n}| - |f_{n} - f|$. Si les $f_{n}$ sont positives et $\int f_{n} \to \int f$, retrouver ce résultat par convergence dominée appliquée à $\min(f, f_{n})$.

    **3.** Montrer que l'hypothèse $\int f_{n} \to \int f$ ne suffit pas, à l'aide de $f_{n} = \chi_{[n, n+1]} - \chi_{[n+1, n+2]}$, puis de $f_{n} = n\chi_{]0, 1/n[} - n\chi_{]-1/n, 0[}$. Cette dernière suite converge-t-elle dans $L^{p}$, $1 \leqslant p < +\infty$ ?
  corrige: |
    **1.** $\big|\int f_{n} - \int f\big| \leqslant \lVert f_{n} - f \rVert_{1}$ et $\big|\lVert f_{n} \rVert_{1} - \lVert f \rVert_{1}\big| \leqslant \lVert f_{n} - f \rVert_{1}$.

    **2.** $h_{n} = |f| + |f_{n}| - |f_{n} - f| \geqslant 0$ tend presque partout vers $2|f|$. Par Fatou, 
    $$2\int|f| \leqslant \liminf_{n}\int h_{n} = 2\int|f| - \limsup_{n}\int|f_{n} - f|,$$
     d'où $\limsup\lVert f_{n} - f \rVert_{1} \leqslant 0$. Si les $f_{n}$ sont positives, $g_{n} = \min(f, f_{n}) \to f$ presque partout, dominée par $f$, et $|f_{n} - f| = f + f_{n} - 2g_{n}$ a une intégrale qui tend vers $\int f + \int f - 2\int f = 0$.

    **3.** Pour $f_{n} = \chi_{[n, n+1]} - \chi_{[n+1, n+2]}$, $f_{n} \to 0$ partout, $\int f_{n} = 0$, mais $\lVert f_{n} \rVert_{1} = 2$. Pour $f_{n} = n\chi_{]0, 1/n[} - n\chi_{]-1/n, 0[}$, de même, $f_{n} \to 0$ partout et $\int f_{n} = 0$, mais $\lVert f_{n} \rVert_{p}^{p} = 2n^{p-1}$ : $(f_{n})$ ne converge dans aucun $L^{p}$, $p \geqslant 1$. L'hypothèse de Scheffé porte sur les intégrales des valeurs absolues, qui empêchent les compensations.
- id: "l3-in-08-19"
  feuille: "f-l3-in-08"
  numero: 19
  partie: "Convergences"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [convergences dans L^p, densité]
  noeuds: [lp-completude, lp-densite]
  notions: [espace-Lp]
  source: "Exo7 (fic00148), exercices 4 et 5"
  page_enonce: 5
  page_corrige: 8
  enonce: |
    On dit que $(f_{n})$ converge *faiblement* vers $f$ dans $L^{2}$ si $\int f_{n}\overline{g} \to \int f\overline{g}$ pour toute $g \in L^{2}$. Sur $[0, +\infty[$, soit $g_{n} = \frac{1}{\sqrt{n}}\chi_{[n, 2n]}$ et $h_{n} = \sqrt{n}\,\chi_{[n, n + 1/n]}$.

    **1.** Montrer que la convergence dans $L^{2}$ entraîne la convergence faible.

    **2.** Montrer que $(g_{n})$ et $(h_{n})$ convergent faiblement vers $0$ dans $L^{2}$, mais pas dans $L^{2}$. On pourra d'abord traiter le cas où $g$ est bornée à support borné, puis utiliser la densité (proposition 3 du cours).

    **3.** Montrer que $g_{n} \to 0$ dans $L^{p}$ pour $p > 2$, et que $h_{n} \to 0$ dans $L^{p}$ pour $p < 2$. Interpréter : la masse de $g_{n}$ s'étale, celle de $h_{n}$ se concentre.
  corrige: |
    **1.** $\big|\int(f_{n} - f)\overline{g}\big| \leqslant \lVert f_{n} - f \rVert_{2}\lVert g \rVert_{2}$, par Cauchy-Schwarz.

    **2.** $\lVert g_{n} \rVert_{2} = \lVert h_{n} \rVert_{2} = 1$ : ni l'une ni l'autre ne tend vers $0$ dans $L^{2}$, et une limite dans $L^{2}$ serait aussi limite faible, donc nulle. Si $g$ est bornée et nulle hors de $[0, A]$, $\int g_{n}\overline{g} = 0$ pour $n > A$, et de même pour $h_{n}$. Pour $g \in L^{2}$ quelconque et $\varepsilon > 0$, la proposition 3 du cours fournit une fonction étagée $\varphi$, nulle hors d'une partie de mesure finie, avec $\lVert g - \varphi \rVert_{2} < \varepsilon$, et, par convergence dominée, $\lVert \varphi - \varphi\chi_{[0, A]} \rVert_{2} < \varepsilon$ pour $A$ grand. Avec $\tilde{g} = \varphi\chi_{[0, A]}$, bornée à support borné, $\big|\int g_{n}\overline{g}\big| \leqslant \big|\int g_{n}\overline{\tilde{g}}\big| + 2\varepsilon$, qui est $\leqslant 2\varepsilon$ pour $n$ grand.

    **3.** $\lVert g_{n} \rVert_{p}^{p} = n^{1 - p/2} \to 0$ si et seulement si $p > 2$, et $\lVert h_{n} \rVert_{p}^{p} = n^{p/2 - 1} \to 0$ si et seulement si $p < 2$. La masse de $g_{n}$ s'étale et part à l'infini, ce que seules voient les normes d'exposant $p > 2$, sensibles aux grandes valeurs ; celle de $h_{n}$ se concentre sur un intervalle minuscule, ce que seules voient les normes d'exposant $p < 2$.

    ![Figure](documents/figures/a0ebd8225347510e.svg)

    Les fonctions $g_{n} = \frac{1}{\sqrt{n}}\chi_{[n, 2n]}$ pour $n = 1$, $2$, $4$, $8$ (ardoise) s'aplatissent et s'élargissent, et $h_{4}$, $h_{8}$ (ocre) s'amincissent en grandissant ; toutes ont une norme $L^{2}$ égale à $1$, et partent vers l'infini, ce qui les rend faiblement nulles.
- id: "l3-in-08-20"
