  noeuds: [fo-plancherel, me-produit-scalaire]
  notions: [produit-convolution, transformee-fourier, produit-scalaire]
  source: "TD 4 « Transformation de Fourier » (préparation à l'agrégation), exercice 7"
  page_enonce: 2
  page_corrige: 5
  enonce: |
    **Translatés denses dans $L^{2}(\mathbb{R})$.** Soit $f \in L^{2}(\mathbb{R})$, $\tau_{x}f(t) = f(t + x)$, et $V$ le sous-espace engendré par les $\tau_{x}f$, $x \in \mathbb{R}$.

    **1.** On suppose que $\mathcal{F} f = 0$ sur un ensemble de mesure strictement positive. Montrer qu'il existe $g \neq 0$ orthogonale à tous les $\tau_{x}f$. En déduire que si $V$ est dense dans $L^{2}(\mathbb{R})$, alors $\mathcal{F} f \neq 0$ presque partout.

    **2.** Réciproquement, on suppose $\mathcal{F} f \neq 0$ presque partout, et l'on se donne $g$ orthogonale à $V$. Montrer que la transformée de Fourier de la fonction intégrable $\mathcal{F} f \, \overline{\mathcal{F} g}$ est nulle, et conclure que $V$ est dense dans $L^{2}(\mathbb{R})$.

    **3.** Comparer avec le cas du cercle (feuille 5, exercice 15) et avec le cas de $L^{1}(\mathbb{R})$ (feuille 7, exercice 7).
  corrige: |
    Rappelons que $\mathcal{F}(\tau_{x}f)(\xi) = \mathrm{e}^{\mathrm{i} x\xi}\mathcal{F} f(\xi)$.

    $\triangleright$ *1.* Soit $E$ de mesure strictement positive où $\mathcal{F} f = 0$, et $E' \subset E$ borné de mesure strictement positive. La fonction $\mathbf{1}_{E'}$ est dans $L^{2}$ ; par le théorème 3, il existe $g \in L^{2}$, non nulle, telle que $\mathcal{F} g = \mathbf{1}_{E'}$. Pour tout $x$, 
    $$\langle \tau_{x}f, g \rangle = \frac{1}{2\pi}\int_{\mathbb{R}} \mathrm{e}^{\mathrm{i} x\xi}\mathcal{F} f(\xi)\mathbf{1}_{E'}(\xi) \, \mathrm{d}\xi = 0 ,$$
     puisque $\mathcal{F} f = 0$ sur $E'$. Donc $g \in V^{\perp} \setminus \{0\}$, et $V$ n'est pas dense (chapitre 2, prop. 7). Par contraposée, si $V$ est dense, $\mathcal{F} f \neq 0$ presque partout.

    $\triangleright$ *2.* Soit $g \in V^{\perp}$. La fonction $h = \mathcal{F} f\,\overline{\mathcal{F} g}$ est intégrable (Cauchy-Schwarz), et pour tout $x$, 
    $$0 = \langle \tau_{x}f, g \rangle = \frac{1}{2\pi}\int_{\mathbb{R}} h(\xi)\mathrm{e}^{\mathrm{i} x\xi} \, \mathrm{d}\xi = \frac{1}{2\pi}\hat{h}(-x) .$$
     Ainsi $\hat{h} = 0$, et par injectivité (chapitre 7, prop. 10), $h = 0$ presque partout. Comme $\mathcal{F} f \neq 0$ presque partout, $\mathcal{F} g = 0$ presque partout, donc $g = 0$. Ainsi $V^{\perp} = \{0\}$ et $V$ est dense.

    $\triangleright$ *3.* Sur le cercle, le spectre est discret et la condition devient « $c_{n}(f) \neq 0$ pour tout $n$ » (feuille 5, exercice 15) : « presque partout » pour la mesure de comptage, c'est « partout ». Dans $L^{1}(\mathbb{R})$, la condition nécessaire est « $\hat{f}$ ne s'annule pas » (feuille 7, exercice 7), mais sa suffisance est le théorème taubérien de Wiener, bien plus difficile : la structure hilbertienne de $L^{2}$ simplifie tout.
