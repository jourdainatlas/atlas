  enonce: |
    **Le cas d'égalité dans l'inégalité de Heisenberg.** Soit $f$ vérifiant les hypothèses du théorème 6 du cours, non nulle.

    **1.** Rappeler les deux étapes de la démonstration du cours : l'identité $\mathop{\displaystyle \int_{\mathbb{R}}} |f|^{2} = -2\operatorname{Re}\mathop{\displaystyle \int_{\mathbb{R}}} t f'(t)\overline{f(t)} \, \mathrm{d} t$, puis l'inégalité de Cauchy-Schwarz.

    **2.** Montrer qu'il y a égalité dans l'inégalité de Heisenberg si et seulement si $f(t) = C\mathrm{e}^{-ct^{2}}$, avec $C \in \mathbb{C}^{*}$ et $c > 0$.

    **3.** Vérifier directement l'égalité pour $f(t) = \mathrm{e}^{-t^{2}/2}$.

    **4.** On suppose $\mathop{\displaystyle \int_{\mathbb{R}}} |f|^{2} = 1$. Montrer que 
    $$\Big( \int_{\mathbb{R}} t^{2}|f(t)|^{2} \, \mathrm{d} t \Big)^{1/2} \Big( \int_{\mathbb{R}} w^{2}|\hat{f}(w)|^{2} \, \mathrm{d} w \Big)^{1/2} \geq \frac{\sqrt{2\pi}}{2} ,$$
     et que, si l'on remplace $\hat{f}$ par la transformée normalisée $\dfrac{1}{\sqrt{2\pi}}\hat{f}$ (qui est une isométrie de $L^{2}$), la borne devient $\dfrac{1}{2}$.
  corrige: |
    $\triangleright$ *1.* Par intégration par parties sur $[-A, A]$, puis $A \to +\infty$ (les termes de bord tendent vers $0$ sous les hypothèses du cours), $\mathop{\displaystyle \int} |f|^{2} = -\mathop{\displaystyle \int} t\,(|f|^{2})' = -2\operatorname{Re}\mathop{\displaystyle \int} t f'\overline{f}$. Cauchy-Schwarz donne alors $\big(\mathop{\displaystyle \int} |f|^{2}\big)^{2} \leq 4\mathop{\displaystyle \int} |tf|^{2}\mathop{\displaystyle \int} |f'|^{2}$, et Plancherel, avec $\widehat{f'}(y) = \mathrm{i} y\hat{f}(y)$ (chapitre 7, prop. 12), donne $\mathop{\displaystyle \int} |f'|^{2} = \dfrac{1}{2\pi}\mathop{\displaystyle \int} |y\hat{f}|^{2}$. On obtient l'inégalité du théorème 6.

    $\triangleright$ *2.* L'inégalité résulte de deux majorations : $|\operatorname{Re} z| \leq |z|$ pour $z = \mathop{\displaystyle \int} t f'\overline{f}$, puis $|z| \leq \lVert tf \rVert_{2}\lVert f' \rVert_{2}$. L'égalité dans Cauchy-Schwarz impose $f' = \lambda\,tf$ pour une constante $\lambda \in \mathbb{C}$ (les deux fonctions sont non nulles). Alors $z = \lambda\mathop{\displaystyle \int} t^{2}|f|^{2}$, et l'égalité $\operatorname{Re} z = -|z|$ impose $\lambda$ réel négatif. L'équation différentielle $f' = \lambda tf$ donne $f(t) = C\mathrm{e}^{\lambda t^{2}/2}$, soit $f(t) = C\mathrm{e}^{-ct^{2}}$ avec $c = -\lambda/2 > 0$. Réciproquement, pour une telle gaussienne, les deux majorations sont des égalités.

    $\triangleright$ *3.* Pour $f(t) = \mathrm{e}^{-t^{2}/2}$, $\hat{f}(y) = \sqrt{2\pi}\,\mathrm{e}^{-y^{2}/2}$ (chapitre 7, prop. 13), et, avec $\mathop{\displaystyle \int} \mathrm{e}^{-t^{2}} = \sqrt{\pi}$ et $\mathop{\displaystyle \int} t^{2}\mathrm{e}^{-t^{2}} = \dfrac{\sqrt{\pi}}{2}$, 
    $$\frac{\pi}{2}\Big( \int |f|^{2} \Big)^{2} = \frac{\pi}{2} \cdot \pi = \frac{\pi^{2}}{2} , \qquad \Big( \int |tf|^{2} \Big)\Big( \int |y\hat{f}|^{2} \Big) = \frac{\sqrt{\pi}}{2} \cdot 2\pi\frac{\sqrt{\pi}}{2} = \frac{\pi^{2}}{2} :$$
     il y a égalité.

    $\triangleright$ *4.* Si $\mathop{\displaystyle \int} |f|^{2} = 1$, le théorème 6 donne $\lVert tf \rVert_{2}^{2}\,\lVert w\hat{f} \rVert_{2}^{2} \geq \dfrac{\pi}{2}$, d'où $\lVert tf \rVert_{2}\,\lVert w\hat{f} \rVert_{2} \geq \sqrt{\pi/2} = \dfrac{\sqrt{2\pi}}{2}$. Avec la transformée normalisée $\dfrac{1}{\sqrt{2\pi}}\hat{f}$, qui conserve la norme $L^{2}$, le second facteur est divisé par $\sqrt{2\pi}$, et la borne devient $\dfrac{1}{2}$ : c'est la forme $\Delta x \, \Delta p \geq \dfrac{1}{2}$ de la mécanique quantique (en unités où $\hbar = 1$), $|f|^{2}$ et $|\dfrac{1}{\sqrt{2\pi}}\hat{f}|^{2}$ étant les densités de probabilité de la position et de l'impulsion.

    1.5em

    ![Figure](documents/figures/8275718ebe0dd1b4.svg)

    Pour $c = \dfrac{1}{4}$ (couleurs claires), la gaussienne est large et sa transformée étroite ; pour $c = 2$ (couleurs foncées), c'est l'inverse. Le produit des largeurs reste constant : les gaussiennes réalisent l'égalité dans l'inégalité de Heisenberg, pour toute valeur de $c$.

