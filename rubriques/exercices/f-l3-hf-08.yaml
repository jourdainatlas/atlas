- id: "l3-hf-08-01"
  feuille: "f-l3-hf-08"
  numero: 1
  partie: "Formule de Plancherel"
  etoiles: 1
  types: [Calcul]
  mots_cles: [formule de Plancherel]
  noeuds: [fo-plancherel]
  notions: [transformee-fourier]
  source: "Mathovore, Contrôle L3 « espaces de Hilbert, projection et Parseval », exercice 5 (c) ; Bordeaux 2015-2016, TD 5, exercice 7 (b)"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    À l'aide de la formule de Plancherel, et des transformées de $\mathrm{e}^{-|x|}$ et de $T(x) = \mathop{\displaystyle \max}(2 - |x|, 0)$ calculées au chapitre 7 (feuille 7, exercices 2 et 3), calculer 
    $$\int_{\mathbb{R}} \frac{\mathrm{d}\xi}{(1 + \xi^{2})^{2}} \qquad \text{et} \qquad \int_{0}^{+\infty} \frac{\sin^{4} t}{t^{4}} \, \mathrm{d} t .$$
  corrige: |
    La fonction $\mathrm{e}^{-|x|}$ est dans $L^{1} \cap L^{2}$, de transformée $\dfrac{2}{1 + \xi^{2}}$. Par Plancherel (cours, th. 1), 
    $$\int_{\mathbb{R}} \frac{4}{(1 + \xi^{2})^{2}} \, \mathrm{d}\xi = 2\pi \int_{\mathbb{R}} \mathrm{e}^{-2|x|} \, \mathrm{d} x = 2\pi , \qquad \text{d'où} \qquad \boxed{\int_{\mathbb{R}} \frac{\mathrm{d}\xi}{(1 + \xi^{2})^{2}} = \frac{\pi}{2} .}$$
     De même, $T \in L^{1} \cap L^{2}$ a pour transformée $\dfrac{4\sin^{2}\xi}{\xi^{2}}$, et $\mathop{\displaystyle \int} T^{2} = \dfrac{16}{3}$ : 
    $$\int_{\mathbb{R}} \frac{16\sin^{4}\xi}{\xi^{4}} \, \mathrm{d}\xi = 2\pi \cdot \frac{16}{3} , \qquad \text{d'où} \qquad \boxed{\int_{0}^{+\infty} \frac{\sin^{4} t}{t^{4}} \, \mathrm{d} t = \frac{\pi}{3} .}$$
     On retrouve les valeurs obtenues au chapitre 7 par le théorème d'inversion : la formule de Plancherel pour $f$ est le théorème d'inversion pour $f * \check{f}$ en $0$, où $\check{f}(x) = \overline{f(-x)}$.
- id: "l3-hf-08-02"
  feuille: "f-l3-hf-08"
  numero: 2
  partie: "Formule de Plancherel"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [formule de Plancherel]
  noeuds: [fo-plancherel, tg-arctan]
  notions: [transformee-fourier, arc-tangente, cosinus-sinus]
  source: "TD 4 « Transformation de Fourier » (préparation à l'agrégation), exercice 3"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **Transformée par troncature.**

    **1.** Soit $f \in L^{2}(\mathbb{R})$. Montrer que la suite des fonctions $\xi \mapsto \mathop{\displaystyle \int_{-n}^{n}} f(x)\mathrm{e}^{-\mathrm{i} x\xi} \, \mathrm{d} x$ converge vers $\mathcal{F} f$ dans $L^{2}(\mathbb{R})$.

    **2.** Soit $f(x) = \arctan(1/x)$ pour $x \neq 0$. Vérifier que $f \in L^{2}(\mathbb{R})$ et $f \notin L^{1}(\mathbb{R})$.

    **3.** En déduire que $\mathcal{F} f(\xi) = \dfrac{\mathrm{i}\pi}{\xi}\big(\mathrm{e}^{-|\xi|} - 1\big)$ pour presque tout $\xi$. On pourra intégrer par parties et utiliser $\mathop{\displaystyle \int_{0}^{+\infty}} \dfrac{\cos(x\xi)}{1 + x^{2}} \, \mathrm{d} x = \dfrac{\pi}{2}\mathrm{e}^{-|\xi|}$ (chapitre 7).
  corrige: |
    $\triangleright$ *1.* La fonction $f_{n} = f\mathbf{1}_{[-n, n]}$ est dans $L^{1} \cap L^{2}$ (Cauchy-Schwarz sur $[-n, n]$), et l'intégrale de l'énoncé est $\hat{f}_{n} = \mathcal{F} f_{n}$. Par convergence dominée, $\lVert f - f_{n} \rVert_{2}^{2} = \mathop{\displaystyle \int_{|x| > n}} |f|^{2} \to 0$, et la continuité de $\mathcal{F}$ (th. 2) donne $\lVert \mathcal{F} f_{n} - \mathcal{F} f \rVert_{2} = \sqrt{2\pi}\lVert f_{n} - f \rVert_{2} \to 0$.

    $\triangleright$ *2.* On a $|f| \leq \dfrac{\pi}{2}$ et $|f(x)| \leq \dfrac{1}{|x|}$ (car $\arctan u \leq u$ pour $u \geq 0$) : $f$ est de carré intégrable. Mais $\arctan(1/x) \sim \dfrac{1}{x}$ en $+\infty$ : $f$ n'est pas intégrable.

    $\triangleright$ *3.* La fonction $f$ est impaire, donc $\hat{f}_{n}(\xi) = -2\mathrm{i}\mathop{\displaystyle \int_{0}^{n}} \arctan(1/x)\sin(x\xi) \, \mathrm{d} x$. Pour $\xi \neq 0$, une intégration par parties, avec $\big(\arctan(1/x)\big)' = -\dfrac{1}{1 + x^{2}}$ et $\arctan(1/x) \to \dfrac{\pi}{2}$ en $0^{+}$, donne 
    $$\int_{0}^{n} \arctan\frac{1}{x}\sin(x\xi) \, \mathrm{d} x = \frac{\pi}{2\xi} - \frac{\arctan(1/n)\cos(n\xi)}{\xi} - \frac{1}{\xi}\int_{0}^{n} \frac{\cos(x\xi)}{1 + x^{2}} \, \mathrm{d} x \longrightarrow \frac{\pi}{2\xi}\big(1 - \mathrm{e}^{-|\xi|}\big) .$$
     Ainsi $\hat{f}_{n}(\xi) \to \dfrac{\mathrm{i}\pi}{\xi}(\mathrm{e}^{-|\xi|} - 1)$ pour tout $\xi \neq 0$. D'autre part, $\hat{f}_{n} \to \mathcal{F} f$ dans $L^{2}$, donc une sous-suite converge presque partout vers $\mathcal{F} f$. Les deux limites coïncident : 
    $$\boxed{\mathcal{F} f(\xi) = \frac{\mathrm{i}\pi}{\xi}\big(\mathrm{e}^{-|\xi|} - 1\big) \qquad \text{pour presque tout } \xi .}$$
     Cette valeur a été vérifiée numériquement en $\xi = 1{,}3$.

    1.5em

    ![Figure](documents/figures/79901aff9fdc073c.svg)

    La fonction $f$ (bleu) saute de $-\pi$ en $0$ et décroît en $\dfrac{1}{x}$ : elle est de carré intégrable sans être intégrable. Sa transformée, imaginaire pure (orange), saute aussi de $-2\pi$ en $0$, reflet de la décroissance en $\dfrac{1}{x}$ de $f$.
- id: "l3-hf-08-03"
  feuille: "f-l3-hf-08"
  numero: 3
  partie: "Convolution dans $L^{2}$"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [convolution dans L²]
  noeuds: [fo-plancherel, me-produit-scalaire]
  notions: [produit-convolution, transformee-fourier, produit-scalaire]
  source: "Bordeaux 2015-2016, TD 6, exercice 5 ; TD 4 « Transformation de Fourier », exercice 5"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **Convolution et produit.**

    **1.** Soit $f \in L^{1}(\mathbb{R})$ et $g \in L^{2}(\mathbb{R})$. Montrer que $f * g \in L^{2}(\mathbb{R})$, avec $\lVert f * g \rVert_{2} \leq \lVert f \rVert_{1}\lVert g \rVert_{2}$. Parmi les formules $\widehat{f * g} = \hat{f}\,\mathcal{F} g$ et $\mathcal{F}(f * g) = \hat{f}\,\mathcal{F} g$, laquelle a un sens en général ? La démontrer.

    **2.** Soit $u, v \in L^{2}(\mathbb{R})$. Montrer que, pour tout $x \in \mathbb{R}$, 
    $$u * v(x) = \frac{1}{2\pi} \int_{\mathbb{R}} \mathcal{F} u(\xi) \, \mathcal{F} v(\xi) \, \mathrm{e}^{\mathrm{i} x\xi} \, \mathrm{d}\xi .$$

    **3.** Soit $f, g \in L^{2}(\mathbb{R})$. Parmi les formules $\mathcal{F} f * \mathcal{F} g = \mathcal{F}(fg)$ et $\mathcal{F} f * \mathcal{F} g = 2\pi\,\widehat{fg}$, laquelle a un sens en général ? La démontrer.

    **4.** Pour $a > 0$, on note $f_{a}(x) = \dfrac{\sin(ax)}{\pi x}$. Vérifier que $f_{a} \in L^{2}(\mathbb{R}) \setminus L^{1}(\mathbb{R})$ et que $\mathcal{F} f_{a} = \mathbf{1}_{[-a, a]}$. Calculer $f_{a} * f_{b}$ pour $a, b > 0$.

    **5.** En déduire que l'équation $f * f = f$ a une infinité de solutions dans $L^{2}(\mathbb{R})$. Comparer avec le cas de $L^{1}(\mathbb{R})$ (feuille 7, exercice 5).
  corrige: |
    $\triangleright$ *1.* Par Cauchy-Schwarz pour la mesure $|f(t)|\,\mathrm{d} t$, $|f * g(x)|^{2} \leq \lVert f \rVert_{1}\mathop{\displaystyle \int} |f(t)| \, |g(x - t)|^{2} \, \mathrm{d} t$ ; en intégrant en $x$ (Tonelli), $\lVert f * g \rVert_{2}^{2} \leq \lVert f \rVert_{1}^{2}\lVert g \rVert_{2}^{2}$.

    La fonction $f * g$ est dans $L^{2}$, mais pas forcément dans $L^{1}$ : seule la formule $\mathcal{F}(f * g) = \hat{f}\,\mathcal{F} g$ a un sens en général. Si $g \in L^{1} \cap L^{2}$, $f * g \in L^{1} \cap L^{2}$ et l'égalité est celle du chapitre 7 (feuille 7, exercice 3). Les deux membres dépendent continûment de $g \in L^{2}$ : $\lVert \mathcal{F}(f * g) \rVert_{2} = \sqrt{2\pi}\lVert f * g \rVert_{2} \leq \sqrt{2\pi}\lVert f \rVert_{1}\lVert g \rVert_{2}$ et $\lVert \hat{f}\,\mathcal{F} g \rVert_{2} \leq \lVert f \rVert_{1}\sqrt{2\pi}\lVert g \rVert_{2}$. Par densité de $L^{1} \cap L^{2}$, l'égalité vaut pour toute $g \in L^{2}$.

    $\triangleright$ *2.* Fixons $x$ et posons $w(t) = v(x - t)$. On a $\mathcal{F} w(\xi) = \mathrm{e}^{-\mathrm{i} x\xi}\mathcal{F} v(-\xi)$ (translation et réflexion), puis $\mathcal{F}\overline{w}(\xi) = \overline{\mathcal{F} w(-\xi)} = \overline{\mathrm{e}^{\mathrm{i} x\xi}\mathcal{F} v(\xi)}$. La formule de Plancherel polarisée donne 
    $$u * v(x) = \int_{\mathbb{R}} u\,w = \int_{\mathbb{R}} u\,\overline{\overline{w}} = \frac{1}{2\pi}\int_{\mathbb{R}} \mathcal{F} u \, \overline{\mathcal{F}\overline{w}} = \frac{1}{2\pi}\int_{\mathbb{R}} \mathcal{F} u(\xi) \, \mathcal{F} v(\xi) \, \mathrm{e}^{\mathrm{i} x\xi} \, \mathrm{d}\xi .$$
     Le produit $\mathcal{F} u \, \mathcal{F} v$ est intégrable (Cauchy-Schwarz) : $u * v$ est la « transformée inverse » de $\mathcal{F} u \, \mathcal{F} v$.

    $\triangleright$ *3.* Le produit $fg$ est intégrable (Cauchy-Schwarz) mais pas forcément de carré intégrable ; la convolée $\mathcal{F} f * \mathcal{F} g$ est définie en tout point (prop. 2). C'est donc $\mathcal{F} f * \mathcal{F} g = 2\pi\,\widehat{fg}$ qui a un sens. Pour $\xi \in \mathbb{R}$, notons $z(x) = \overline{g(x)}\mathrm{e}^{\mathrm{i} x\xi}$, de transformée $\mathcal{F} z(\eta) = \mathcal{F}\overline{g}(\eta - \xi) = \overline{\mathcal{F} g(\xi - \eta)}$. Par Plancherel polarisé, 
    $$\widehat{fg}(\xi) = \int_{\mathbb{R}} f(x)g(x)\mathrm{e}^{-\mathrm{i} x\xi} \, \mathrm{d} x = \int_{\mathbb{R}} f\,\overline{z} = \frac{1}{2\pi}\int_{\mathbb{R}} \mathcal{F} f(\eta) \, \mathcal{F} g(\xi - \eta) \, \mathrm{d}\eta = \frac{1}{2\pi}\,\mathcal{F} f * \mathcal{F} g(\xi) .$$

    $\triangleright$ *4.* On a $|f_{a}(x)| \leq \mathop{\displaystyle \min}\big(\dfrac{a}{\pi}, \dfrac{1}{\pi|x|}\big)$ : $f_{a} \in L^{2}$. Elle n'est pas intégrable (feuille 7, exercice 1). Par l'exercice 2 (question 1), $\mathcal{F} f_{a}$ est la limite dans $L^{2}$ de 
    $$\int_{-n}^{n} \frac{\sin(ax)}{\pi x}\mathrm{e}^{-\mathrm{i} x\xi} \, \mathrm{d} x = \frac{1}{\pi}\int_{0}^{n} \frac{\sin((a + \xi)x) + \sin((a - \xi)x)}{x} \, \mathrm{d} x \longrightarrow \frac{1}{2}\big(\operatorname{sgn}(a + \xi) + \operatorname{sgn}(a - \xi)\big) ,$$
     par l'intégrale de Dirichlet $\mathop{\displaystyle \int_{0}^{+\infty}} \dfrac{\sin(cx)}{x} \, \mathrm{d} x = \dfrac{\pi}{2}\operatorname{sgn} c$ (feuille 6, exercice 1). La limite vaut $1$ pour $|\xi| < a$ et $0$ pour $|\xi| > a$ : $\mathcal{F} f_{a} = \mathbf{1}_{[-a, a]}$. Par la question 2, avec $c = \mathop{\displaystyle \min}(a, b)$, 
    $$f_{a} * f_{b}(x) = \frac{1}{2\pi}\int_{-c}^{c} \mathrm{e}^{\mathrm{i} x\xi} \, \mathrm{d}\xi = \frac{\sin(cx)}{\pi x} , \qquad \text{soit} \qquad \boxed{f_{a} * f_{b} = f_{\min(a, b)} .}$$

    $\triangleright$ *5.* En particulier $f_{a} * f_{a} = f_{a}$ pour tout $a > 0$ : 
    $$\boxed{\text{l'équation } f * f = f \text{ a une infinité de solutions dans } L^{2} ;}$$
     ce sont les fonctions dont la transformée est l'indicatrice d'un ensemble (ici un intervalle), alors que dans $L^{1}$ la seule solution est $0$ : la transformée d'une fonction intégrable est continue et tend vers $0$, ce qui interdit l'indicatrice.

    1.5em

    ![Figure](documents/figures/56cccd76cea1a36f.svg)

    Les fonctions $f_{1}$ (bleu) et $f_{2}$ (orange) ont pour spectres $[-1, 1]$ et $[-2, 2]$ ; leur convolée est $f_{1}$, la plus « basse en fréquence » des deux, comme le produit des indicatrices $\mathbf{1}_{[-1, 1]}\mathbf{1}_{[-2, 2]} = \mathbf{1}_{[-1, 1]}$.
- id: "l3-hf-08-04"
  feuille: "f-l3-hf-08"
  numero: 4
  partie: "Convolution dans $L^{2}$"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [convolution dans L², projection orthogonale]
  noeuds: [fo-plancherel, me-produit-scalaire]
  notions: [produit-convolution, transformee-fourier, projection-orthogonale, produit-scalaire]
  source: "Bordeaux 2015-2016, TD 6, exercice 6"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **Un filtre passe-bas.** Pour $f \in L^{2}(\mathbb{R})$, on pose 
    $$Pf(x) = \frac{1}{\pi} \int_{\mathbb{R}} f(x - y) \frac{\sin y}{y} \, \mathrm{d} y .$$

    **1.** Justifier que $Pf$ est bien définie et continue.

    **2.** Montrer que $Pf \in L^{2}(\mathbb{R})$ et que $\mathcal{F}(Pf) = \mathbf{1}_{[-1, 1]} \mathcal{F} f$ (exercice 3).

    **3.** En déduire que $\lVert Pf \rVert_{2} \leq \lVert f \rVert_{2}$ et que $P \circ P = P$.

    **4.** Montrer que $P$ est la projection orthogonale de $L^{2}(\mathbb{R})$ sur le sous-espace des fonctions dont la transformée est nulle hors de $[-1, 1]$.

    **5.** Calculer $P\mathbf{1}_{[-1, 1]}$ à l'aide de la fonction $\operatorname{Si}(x) = \mathop{\displaystyle \int_{0}^{x}} \dfrac{\sin t}{t} \, \mathrm{d} t$.
  corrige: |
    $\triangleright$ *1.* On a $Pf = f * f_{1}$ avec $f_{1}(y) = \dfrac{\sin y}{\pi y} \in L^{2}$ (exercice 3). La convolée de deux fonctions de $L^{2}$ est définie partout et continue (cours, prop. 2).

    $\triangleright$ *2.* Soit $(f_{k})$ une suite de $L^{1} \cap L^{2}$ qui converge vers $f$ dans $L^{2}$. Par l'exercice 3 (question 1, avec $f_{k} \in L^{1}$ et $f_{1} \in L^{2}$), $Pf_{k} = f_{k} * f_{1} \in L^{2}$ et $\mathcal{F}(Pf_{k}) = \hat{f}_{k}\,\mathcal{F} f_{1} = \mathbf{1}_{[-1, 1]}\mathcal{F} f_{k}$. Par Plancherel, 
    $$\lVert Pf_{k} - Pf_{m} \rVert_{2} = \frac{1}{\sqrt{2\pi}}\lVert \mathbf{1}_{[-1, 1]}(\mathcal{F} f_{k} - \mathcal{F} f_{m}) \rVert_{2} \leq \lVert f_{k} - f_{m} \rVert_{2} ,$$
     donc $(Pf_{k})$ est de Cauchy dans $L^{2}$, et converge vers une fonction $p$ telle que $\mathcal{F} p = \mathbf{1}_{[-1, 1]}\mathcal{F} f$ (continuité de $\mathcal{F}$). D'autre part, par Cauchy-Schwarz, $|Pf_{k}(x) - Pf(x)| \leq \lVert f_{k} - f \rVert_{2}\lVert f_{1} \rVert_{2}$ : $Pf_{k} \to Pf$ uniformément. Une sous-suite converge presque partout vers $p$, donc $Pf = p$ presque partout : $Pf \in L^{2}$ et $\mathcal{F}(Pf) = \mathbf{1}_{[-1, 1]}\mathcal{F} f$.

    $\triangleright$ *3.* Par Plancherel, 
    $$\lVert Pf \rVert_{2}^{2} = \frac{1}{2\pi}\int_{-1}^{1} |\mathcal{F} f|^{2} \leq \frac{1}{2\pi}\int_{\mathbb{R}} |\mathcal{F} f|^{2} = \lVert f \rVert_{2}^{2} .$$
     Et $\mathcal{F}(P(Pf)) = \mathbf{1}_{[-1, 1]}^{2}\mathcal{F} f = \mathcal{F}(Pf)$, d'où $P \circ P = P$ par injectivité de $\mathcal{F}$.

    $\triangleright$ *4.* Pour $f, g \in L^{2}$, Plancherel polarisé donne $\langle Pf, g \rangle = \dfrac{1}{2\pi}\mathop{\displaystyle \int} \mathbf{1}_{[-1, 1]}\mathcal{F} f\,\overline{\mathcal{F} g} = \langle f, Pg \rangle$ : $P$ est autoadjoint, et c'est un projecteur. Par la feuille 4 (exercice 14), $P$ est la projection orthogonale sur son image, qui est l'ensemble $E$ des $f$ telles que $\mathcal{F} f = 0$ presque partout hors de $[-1, 1]$ : si $f \in E$, $\mathcal{F}(Pf) = \mathcal{F} f$ et $Pf = f$ ; inversement, $\mathcal{F}(Pf)$ est nulle hors de $[-1, 1]$. Les éléments de $E$ sont les signaux « à bande limitée » du théorème de Shannon (cours, th. 7) : $P$ est un filtre passe-bas idéal.

    $\triangleright$ *5.* Par le changement de variable $u = x - y$, 
    $$P\mathbf{1}_{[-1, 1]}(x) = \frac{1}{\pi}\int_{-1}^{1} \frac{\sin(x - y)}{x - y} \, \mathrm{d} y = \boxed{\frac{1}{\pi}\big( \operatorname{Si}(x + 1) - \operatorname{Si}(x - 1) \big) .}$$
     En $0$, $P\mathbf{1}_{[-1, 1]}(0) = \dfrac{2\operatorname{Si}(1)}{\pi} \approx 0{,}602$.

    1.5em

    ![Figure](documents/figures/775fb0de0990cc49.svg)

    Le filtre $P$ supprime les fréquences au-delà de $1$ : le créneau (rouge) devient une fonction lisse et étalée (orange), qui oscille et ne vaut plus que $0{,}60$ en son centre. Les hautes fréquences portaient les bords nets du créneau.
- id: "l3-hf-08-05"
  feuille: "f-l3-hf-08"
  numero: 5
  partie: "Convolution dans $L^{2}$"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [convolution dans L²]
  noeuds: [fo-plancherel, me-produit-scalaire]
  notions: [produit-convolution, transformee-fourier, produit-scalaire]
  source: "Bordeaux 2015-2016, examen final, exercice 4"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **Approximation de l'unité, côté Fourier.** Soit $g \in L^{2}(\mathbb{R})$.

    **1.** Soit $(f_{n})$ une suite de $L^{1} \cap L^{2}(\mathbb{R})$ telle que (P1) la suite $(\lVert \hat{f}_{n} \rVert_{\infty})$ est bornée, et (P2) $\hat{f}_{n}$ converge simplement vers $1$ sur $\mathbb{R}$. Prouver que $f_{n} * g \to g$ dans $L^{2}(\mathbb{R})$. On utilisera $\mathcal{F}(f_{n} * g) = \hat{f}_{n} \, \mathcal{F} g$ (exercice 3).

    **2.** Soit $(f_{n})$ une suite de $L^{1} \cap L^{2}(\mathbb{R})$ telle que $f_{n} \geq 0$, $\mathop{\displaystyle \int_{\mathbb{R}}} f_{n} = 1$, et $\mathop{\displaystyle \int_{-\delta}^{\delta}} f_{n} \to 1$ pour tout $\delta > 0$. Montrer que $(f_{n})$ vérifie (P1) et (P2). Pour (P2), on vérifiera que 
    $$|\hat{f}_{n}(y) - 1| \leq \int_{-\delta}^{\delta} f_{n}(t)\,|\mathrm{e}^{-\mathrm{i} yt} - 1| \, \mathrm{d} t + \int_{|t| \geq \delta} 2f_{n}(t) \, \mathrm{d} t .$$
  corrige: |
    $\triangleright$ *1.* Par l'exercice 3, $\mathcal{F}(f_{n} * g) - \mathcal{F} g = (\hat{f}_{n} - 1)\mathcal{F} g$, et par Plancherel 
    $$\lVert f_{n} * g - g \rVert_{2}^{2} = \frac{1}{2\pi}\int_{\mathbb{R}} |\hat{f}_{n}(\xi) - 1|^{2} \, |\mathcal{F} g(\xi)|^{2} \, \mathrm{d}\xi .$$
     L'intégrande tend vers $0$ en tout point (P2) et est majoré par $(M + 1)^{2}|\mathcal{F} g|^{2}$, intégrable, où $M$ borne $\lVert \hat{f}_{n} \rVert_{\infty}$ (P1). Par convergence dominée, $f_{n} * g \to g$ dans $L^{2}$.

    $\triangleright$ *2.* (P1) : $|\hat{f}_{n}(y)| \leq \mathop{\displaystyle \int} f_{n} = 1$.

    (P2) : comme $\mathop{\displaystyle \int} f_{n} = 1$, $\hat{f}_{n}(y) - 1 = \mathop{\displaystyle \int} f_{n}(t)(\mathrm{e}^{-\mathrm{i} yt} - 1) \, \mathrm{d} t$, d'où l'inégalité de l'énoncé, en séparant $|t| < \delta$ et $|t| \geq \delta$ et en majorant $|\mathrm{e}^{-\mathrm{i} yt} - 1| \leq 2$ dans le second cas. Comme $|\mathrm{e}^{-\mathrm{i} yt} - 1| \leq |yt| \leq |y|\delta$ pour $|t| < \delta$, 
    $$|\hat{f}_{n}(y) - 1| \leq |y|\delta + 2\Big( 1 - \int_{-\delta}^{\delta} f_{n} \Big) , \qquad \text{donc} \qquad \limsup_{n} |\hat{f}_{n}(y) - 1| \leq |y|\delta .$$
     Ceci vaut pour tout $\delta > 0$ : $\hat{f}_{n}(y) \to 1$. On retrouve la proposition 6 du cours par une démonstration « côté Fourier » : convoler par $f_{n}$, c'est multiplier le spectre par $\hat{f}_{n}$, qui tend vers $1$.
- id: "l3-hf-08-06"
  feuille: "f-l3-hf-08"
  numero: 6
  partie: "Convolution dans $L^{2}$"
  etoiles: 3
  types: [Démonstration]
