  page_enonce: 6
  page_corrige: 14
  enonce: |
    *(Racines simples d'un polynôme.)*

    **1.** Pour $a = (a_{0}, \dots, a_{n}) \in \mathbb{R}^{n + 1}$, on pose $P_{a}(X) = a_{0} + a_{1}X + \cdots + a_{n}X^{n}$. Soit $b \in \mathbb{R}^{n + 1}$ et $x_{b}$ une racine simple de $P_{b}$. Montrer qu'il existe un voisinage ouvert $U$ de $b$ dans $\mathbb{R}^{n + 1}$ et un voisinage ouvert $V$ de $x_{b}$ dans $\mathbb{R}$ tels que, pour tout $a \in U$, $P_{a}$ ait une unique racine dans $V$.

    **2.** Soit $F(x, y) = y^{n} + a_{n - 1}(x)y^{n - 1} + \cdots + a_{1}(x)y + a_{0}(x)$, où les fonctions $a_{j}$ sont de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$. On suppose que, pour un $x_{0} \in \mathbb{R}$, le polynôme $y \mapsto F(x_{0}, y)$ a une racine simple $y_{0}$. Démontrer que, pour $x$ voisin de $x_{0}$, $F(x, \cdot)$ possède une racine $y(x)$ proche de $y_{0}$, et que $x \mapsto y(x)$ est de classe $\mathcal{C}^{1}$.
  corrige: |
    Une racine simple est une racine où la dérivée par rapport à l'inconnue ne s'annule pas : c'est exactement l'hypothèse du théorème des fonctions implicites.

    **1.** $\Phi(a, x) = P_{a}(x)$ est polynomiale en $(a, x) \in \mathbb{R}^{n + 1} \times \mathbb{R}$, $\Phi(b, x_{b}) = 0$ et $\dfrac{\partial \Phi}{\partial x}(b, x_{b}) = P_{b}'(x_{b}) \neq 0$. Le théorème des fonctions implicites donne des ouverts $U \ni b$, $V \ni x_{b}$ et $\xi : U \to V$ de classe $\mathcal{C}^{1}$ tels que, pour $(a, x) \in U \times V$, $P_{a}(x) = 0 \iff x = \xi(a)$ : 
    $$\boxed{P_{a} \text{ a une unique racine } \xi(a) \text{ dans } V}\text{.}$$

    **2.** Même raisonnement avec $F$, de classe $\mathcal{C}^{1}$ en $(x, y)$, et $\dfrac{\partial F}{\partial y}(x_{0}, y_{0}) \neq 0$ (racine simple) : 
    $$\boxed{x \mapsto y(x) \text{ existe et est de classe } \mathcal{C}^{1}}\text{.}$$

    *Piège.* Une racine double peut disparaître par perturbation : $X^{2} + \varepsilon$ n'a pas de racine réelle pour $\varepsilon > 0$. L'hypothèse de simplicité est indispensable.
