  page_enonce: 6
  page_corrige: 15
  enonce: |
    *(Le tore.)* Soit $f : \mathbb{R}^{2} \to \mathbb{R}^{3}$, $f(\theta, \varphi) = \Big(\cos\theta\big(1 + \tfrac{1}{2}\cos\varphi\big),\ \sin\theta\big(1 + \tfrac{1}{2}\cos\varphi\big),\ \tfrac{1}{2}\sin\varphi\Big)$, et $T = f(\mathbb{R}^{2})$.

    **1.** Soit $R_{\theta}$ la rotation d'angle $\theta$ autour de l'axe $(Oz)$ et $C = \big\{\big(1 + \tfrac{1}{2}\cos\varphi, 0, \tfrac{1}{2}\sin\varphi\big) \,;\, \varphi \in \mathbb{R}\big\}$. Montrer que $T = \bigcup_{\theta \in \mathbb{R}}R_{\theta}(C)$. Dessiner $T$.

    **2.** Montrer que $f(\theta, \varphi) = f(\theta', \varphi')$ si et seulement s'il existe $(k, l) \in \mathbb{Z}^{2}$ tel que $\theta = \theta' + 2k\pi$ et $\varphi = \varphi' + 2l\pi$.

    **3.** Montrer que, pour tout ouvert $U \subset \mathbb{R}^{2}$, $f(U)$ est un ouvert de $T$.

    **4.** Montrer que $T$ est une sous-variété de $\mathbb{R}^{3}$.
  corrige: |
    On décrit le tore comme surface de révolution, puis par une équation, ce qui permet d'appliquer le critère de la partie.

    **1.** $f(\theta, \varphi) = R_{\theta}\big(f(0, \varphi)\big)$ et $f(0, \varphi) \in C$ : T = __(C). Le cercle $C$, de centre $(1, 0, 0)$ et de rayon $\frac{1}{2}$ dans le plan $y = 0$, tourne autour de l'axe $(Oz)$, qu'il ne rencontre pas.

    **2.** La distance à l'axe de $f(\theta, \varphi)$ est $r = 1 + \frac{1}{2}\cos\varphi \geqslant \frac{1}{2} > 0$, et sa cote est $\frac{1}{2}\sin\varphi$. Si $f(\theta, \varphi) = f(\theta', \varphi')$, les deux points ont même $r$ et même projection sur le plan $(xOy)$, donc $(\cos\theta, \sin\theta) = (\cos\theta', \sin\theta')$ et $\theta \equiv \theta' \pmod{2\pi}$ ; puis $\cos\varphi = \cos\varphi'$ et $\sin\varphi = \sin\varphi'$, donc $\varphi \equiv \varphi' \pmod{2\pi}$. La réciproque est claire. 
    $$\boxed{f(\theta, \varphi) = f(\theta', \varphi') \iff (\theta, \varphi) \equiv (\theta', \varphi') \pmod{2\pi\mathbb{Z}^{2}}}\text{.}$$

    **3.** Soit $U$ ouvert et $\tilde{U} = U + 2\pi\mathbb{Z}^{2}$, ouvert, avec $f(\tilde{U}) = f(U)$. L'ensemble $K = [0, 2\pi]^{2} \setminus \tilde{U}$ est compact et $f(K) = T \setminus f(U)$ par la question 2. Comme $f(K)$ est compact, donc fermé, 
    $$\boxed{f(U) = T \setminus f(K) \text{ est un ouvert de } T}\text{.}$$

    **4.** $T$ est l'ensemble des points vérifiant $\big(\sqrt{x^{2} + y^{2}} - 1\big)^{2} + z^{2} = \frac{1}{4}$ : un tel point s'écrit $\sqrt{x^{2} + y^{2}} - 1 = \frac{1}{2}\cos\varphi$, $z = \frac{1}{2}\sin\varphi$, et l'on retrouve $f(\theta, \varphi)$. La fonction $g(x, y, z) = (r - 1)^{2} + z^{2} - \frac{1}{4}$, avec $r = \sqrt{x^{2} + y^{2}}$, est de classe $\mathcal{C}^{1}$ hors de l'axe $(Oz)$, qui ne rencontre pas $T$, et 
    $$\nabla g = \Big(\frac{2(r - 1)x}{r}, \frac{2(r - 1)y}{r}, 2z\Big),$$
     qui ne s'annule que si $z = 0$ et $r = 1$, où $g = -\frac{1}{4} \neq 0$. 
    $$\boxed{T \text{ est une sous-variété de dimension } 2 \text{ de } \mathbb{R}^{3}}\text{.}$$

    ![Figure](documents/figures/d15b3c08074a1925.svg)

    La section du tore par le plan $y = 0$ est formée de deux cercles de rayon $\frac{1}{2}$ centrés en $(\pm 1, 0, 0)$ ; l'angle $\varphi$ repère le point sur le cercle $C$, l'angle $\theta$ la rotation autour de l'axe $(Oz)$. Les points où le gradient de $g$ s'annulerait sont sur le cercle des centres, qui n'est pas sur le tore.
