  enonce: |
    Soit $E$ l'espace vectoriel des matrices symétriques réelles d'ordre $n$ et $f : \mathcal{M}_{n}(\mathbb{R}) \to E$, $f(A) = {}^{t}AA$.

    **1.** Montrer que $\mathrm{d} f(A)\cdot X = {}^{t}AX + {}^{t}XA$.

    **2.** Soit $A \in \mathrm{O}_{n}(\mathbb{R})$, $S \in E$ et $X = \frac{1}{2}AS$. Montrer que $\mathrm{d} f(A)\cdot X = S$. En déduire que $\mathrm{O}_{n}(\mathbb{R})$ est une sous-variété de $\mathcal{M}_{n}(\mathbb{R})$ de dimension $\dfrac{n(n - 1)}{2}$, dont l'espace tangent en $I_{n}$ est $\{X \in \mathcal{M}_{n}(\mathbb{R}) \,;\, {}^{t}X = -X\}$.
  corrige: |
    $\mathrm{O}_{n}(\mathbb{R}) = f^{-1}(I_{n})$, et on montre que la différentielle de $f$, vue comme application à valeurs dans $E$, est surjective.

    **1.** ${}^{t}(A + X)(A + X) - {}^{t}AA = {}^{t}AX + {}^{t}XA + {}^{t}XX$, et $\lVert {}^{t}XX \rVert = O(\lVert X \rVert^{2})$ : d f(A) X = ^tAX + ^tXA, qui est bien symétrique.

    **2.** Pour $A \in \mathrm{O}_{n}(\mathbb{R})$ et $S \in E$, ${}^{t}A\big(\frac{1}{2}AS\big) + {}^{t}\big(\frac{1}{2}AS\big)A = \frac{1}{2}S + \frac{1}{2}{}^{t}S{}^{t}AA = \frac{1}{2}S + \frac{1}{2}S$, donc d f(A) X = S. Ainsi $\mathrm{d} f(A) : \mathcal{M}_{n}(\mathbb{R}) \to E$ est surjective en tout point de $\mathrm{O}_{n}(\mathbb{R}) = \{A \,;\, f(A) - I_{n} = 0\}$, et, $E$ étant de dimension $\frac{n(n + 1)}{2}$, 
    $$\boxed{\mathrm{O}_{n}(\mathbb{R}) \text{ est une sous-variété de dimension } n^{2} - \frac{n(n + 1)}{2} = \frac{n(n - 1)}{2}}\text{.}$$
     Son espace tangent en $I_{n}$ est 
    $$\boxed{\mathrm{Ker}\,\mathrm{d} f(I_{n}) = \{X \,;\, X + {}^{t}X = 0\}},$$
     l'espace des matrices antisymétriques, de dimension $\frac{n(n - 1)}{2}$ comme il se doit.

    *Remarque.* Le chapitre 2 (exercice 16) a montré que $e^{tX}$ est orthogonale lorsque $X$ est antisymétrique : les matrices antisymétriques sont les vitesses des courbes tracées sur $\mathrm{O}_{n}(\mathbb{R})$ et passant par $I_{n}$.
- id: "l3-cd-03-32"
  feuille: "f-l3-cd-03"
  numero: 32
  partie: "Hyperplan tangent, sous-variétés"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [sous-variétés et hyperplan tangent, sous-variétés, difféomorphismes]
  noeuds: [gd-sous-varietes, gd-tangent-sm, gd-inversion-locale]
  notions: [espace-tangent-sv, diffeomorphisme]
  page_enonce: 7
  page_corrige: 17
  enonce: |
    Soit $E$ un espace vectoriel de dimension finie, $a \in E$ et $f : E \to E$ un $\mathcal{C}^{1}$-difféomorphisme. On suppose que $f^{n} = \mathrm{Id}$ pour un entier $n \geqslant 1$ et que $f(a) = a$. On pose $A = \mathrm{d} f(a)$ et, pour $x \in E$, 
    $$u(x) = \sum_{p = 1}^{n}A^{-p}f^{p}(x).$$

    **1.** Montrer que $u$ est un difféomorphisme local en $a$ et que $u \circ f = A \circ u$.

    **2.** Soit $F$ l'ensemble des points fixes de $f$. Montrer que $F$ est une sous-variété de $E$ au voisinage de $a$.

    **3.** Soit $g : \mathbb{R}^{2} \to \mathbb{R}^{2}$, $g(x, y) = (x, y + y^{3} - x^{2})$. Montrer que $g$ est un $\mathcal{C}^{1}$-difféomorphisme de $\mathbb{R}^{2}$. En déduire que la conclusion de la question 2 peut être fausse si l'on supprime l'hypothèse $f^{n} = \mathrm{Id}$.
  corrige: |
    L'application $u$ « linéarise » $f$ au voisinage de $a$ : dans la carte $u$, $f$ devient l'application linéaire $A$, dont les points fixes forment un sous-espace.

    **1.** Par la règle de la chaîne et $f(a) = a$, $\mathrm{d}(f^{p})(a) = A^{p}$ ; en particulier $A^{n} = \mathrm{d}(f^{n})(a) = \mathrm{Id}$, et $A$ est inversible. Alors $\mathrm{d} u(a) = \sum_{p = 1}^{n}A^{-p}A^{p} = n\,\mathrm{Id}$ est inversible, et u est un difféomorphisme local en a. Ensuite, 
    $$u \circ f = \sum_{p = 1}^{n}A^{-p}f^{p + 1} = A\sum_{q = 2}^{n + 1}A^{-q}f^{q} = A\,u,$$
     car le terme $q = n + 1$, égal à $A^{-n - 1}f^{n + 1} = A^{-1}f$, est le terme $q = 1$ manquant. u f = A u.

    **2.** Soit $V$ un voisinage ouvert de $a$ sur lequel $u$ est un difféomorphisme, et $V' = V \cap f^{-1}(V)$, voisinage ouvert de $a$. Pour $x \in V'$ : si $f(x) = x$, alors $Au(x) = u(f(x)) = u(x)$ ; réciproquement, si $Au(x) = u(x)$, alors $u(f(x)) = u(x)$ avec $x$, $f(x) \in V$, donc $f(x) = x$. Ainsi $u(F \cap V') = u(V') \cap \mathrm{Ker}\,(A - \mathrm{Id})$, et, après un changement de base linéaire envoyant $\mathrm{Ker}\,(A - \mathrm{Id})$ sur $\mathbb{R}^{d} \times \{0\}$, 
    $$\boxed{F \text{ est une sous-variété au voisinage de } a}\text{,}$$
     de dimension $d = \dim\mathrm{Ker}\,(A - \mathrm{Id})$.

    **3.** $g$ est bijective : $y \mapsto y + y^{3}$ est une bijection strictement croissante de $\mathbb{R}$, donc $g(x, y) = (u, v)$ équivaut à $x = u$ et $y + y^{3} = v + u^{2}$. Son jacobien $1 + 3y^{2}$ ne s'annule pas : par la proposition 7 du cours, 
    $$\boxed{g \text{ est un } \mathcal{C}^{1}\text{-difféomorphisme}}\text{.}$$
     Ses points fixes forment la courbe $\{y^{3} = x^{2}\}$, qui a un point de rebroussement en $0$. Ce n'est pas une sous-variété au voisinage de $0$ : sinon, il existerait une courbe $\gamma = (\gamma_{1}, \gamma_{2})$ de classe $\mathcal{C}^{1}$, avec $\gamma(0) = 0$ et $\gamma'(0) \neq 0$, paramétrant $F$ près de $0$. Comme $\gamma_{2} = \gamma_{1}^{2/3} \geqslant 0$ a un minimum en $0$, $\gamma_{2}'(0) = 0$, donc $\gamma_{1}'(0) \neq 0$ ; mais alors $\gamma_{1}(t)^{2} \sim \gamma_{1}'(0)^{2}t^{2}$, tandis que $\gamma_{2}(t)^{3} = o(t^{3})$, ce qui contredit $\gamma_{1}^{2} = \gamma_{2}^{3}$. 
    $$\boxed{\text{La conclusion de la question 2 tombe en défaut sans l'hypothèse } f^{n} = \mathrm{Id}}\text{.}$$

    ![Figure](documents/figures/c82bf1eb198cc490.svg)

    Les deux arcs $y = |x|^{2/3}$ arrivent en $0$ tangents à l'axe des ordonnées, de part et d'autre : la courbe n'a pas de demi-tangentes opposées, et aucune paramétrisation régulière ne la décrit en $0$.
- id: "l3-cd-03-33"
  feuille: "f-l3-cd-03"
  numero: 33
  partie: "Exercice de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [synthèse]
  noeuds: [gd-inversion-locale]
  notions: []
  page_enonce: 7
  page_corrige: 18
  enonce: |
    On considère l'équation différentielle 
    $$(\ast) \qquad x''(t) - x(t)^{3} = g(t), \qquad x(0) = x(1) = 0,$$
     où $g : [0, 1] \to \mathbb{R}$ est continue. Soit $F = \mathcal{C}([0, 1], \mathbb{R})$ muni de $\lVert \cdot \rVert_{\infty}$ et $E = \{\varphi \in \mathcal{C}^{2}([0, 1], \mathbb{R}) \,;\, \varphi(0) = \varphi(1) = 0\}$ muni de $\lVert \varphi \rVert_{E} = |\varphi'(0)| + \lVert \varphi'' \rVert_{\infty}$. On admet que $E$ est un espace de Banach.

    **1.** Montrer que $\lVert \varphi \rVert_{\infty} \leqslant \lVert \varphi \rVert_{E}$ pour tout $\varphi \in E$.

    **2.** Soit $\Phi : E \to F$ définie par $\Phi(\varphi) = \varphi'' - \varphi^{3}$. Montrer que $\Phi$ est de classe $\mathcal{C}^{1}$ sur $E$ et calculer $\mathrm{d}\Phi(\varphi)\cdot h$ pour $\varphi$, $h \in E$.

    **3.** Montrer qu'il existe $\varepsilon > 0$ tel que, pour toute fonction $g$ vérifiant $\lVert g \rVert_{\infty} < \varepsilon$, l'équation $(\ast)$ admette une solution.
  corrige: |
    On résout l'équation non linéaire comme une petite perturbation de l'équation linéaire $x'' = g$, par le théorème d'inversion locale dans l'espace de Banach $E$ (cours, th. 1).

    **1.** Comme $\varphi(0) = 0$, $\varphi(t) = \int_{0}^{t}\varphi'(s)\,\mathrm{d} s$ et $\varphi'(s) = \varphi'(0) + \int_{0}^{s}\varphi''$, donc $|\varphi'(s)| \leqslant |\varphi'(0)| + \lVert \varphi'' \rVert_{\infty} = \lVert \varphi \rVert_{E}$ et 
    $$\boxed{\lVert \varphi \rVert_{\infty} \leqslant \lVert \varphi \rVert_{E}}\text{.}$$

    **2.** $\Phi = L - N$, avec $L(\varphi) = \varphi''$, linéaire et continue ($\lVert \varphi'' \rVert_{\infty} \leqslant \lVert \varphi \rVert_{E}$), et $N(\varphi) = \varphi^{3}$. On a 
    $$N(\varphi + h) - N(\varphi) - 3\varphi^{2}h = 3\varphi h^{2} + h^{3}, \qquad \lVert 3\varphi h^{2} + h^{3} \rVert_{\infty} \leqslant \big(3\lVert \varphi \rVert_{E} + \lVert h \rVert_{E}\big)\lVert h \rVert_{E}^{2},$$
     par la question 1. Donc $N$ est différentiable, $\mathrm{d} N(\varphi)\cdot h = 3\varphi^{2}h$, et 
    $$\boxed{\mathrm{d}\Phi(\varphi)\cdot h = h'' - 3\varphi^{2}h}.$$
     De plus $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} N(\varphi) - \mathrm{d} N(\psi)|\mkern-1.5mu|\mkern-1.5mu| \leqslant 3\lVert \varphi^{2} - \psi^{2} \rVert_{\infty} \leqslant 3\lVert \varphi - \psi \rVert_{E}\big(\lVert \varphi \rVert_{E} + \lVert \psi \rVert_{E}\big)$ : est de classe C^1.

    **3.** En $\varphi = 0$, $\mathrm{d}\Phi(0) = L : h \mapsto h''$. C'est un isomorphisme de $E$ sur $F$ : pour $k \in F$, l'unique $h \in E$ tel que $h'' = k$ est 
    $$h(t) = \int_{0}^{t}(t - s)k(s)\,\mathrm{d} s - t\int_{0}^{1}(1 - s)k(s)\,\mathrm{d} s,$$
     et $\lVert h \rVert_{E} = |h'(0)| + \lVert k \rVert_{\infty} \leqslant 2\lVert k \rVert_{\infty}$, de sorte que $L^{-1}$ est continue. Par le théorème d'inversion locale, $\Phi$ envoie un voisinage de $0$ dans $E$ sur un voisinage de $\Phi(0) = 0$ dans $F$, qui contient une boule $B(0, \varepsilon)$. Pour $\lVert g \rVert_{\infty} < \varepsilon$, il existe $\varphi \in E$ tel que $\Phi(\varphi) = g$ : est solution de (), et c'est l'unique solution proche de $0$.

    *Remarque.* Le choix de la norme $\lVert \cdot \rVert_{E}$ est essentiel : avec $\lVert \cdot \rVert_{\infty}$ sur $E$, l'application $h \mapsto h''$ ne serait pas continue (chapitre 2, exercice 8). Les chapitres 6 et 7 du cours traitent les problèmes de Cauchy, où les conditions portent sur un seul instant ; ce problème aux limites, où elles portent sur les deux extrémités, échappe à leurs méthodes, et c'est l'inversion locale qui le résout.

