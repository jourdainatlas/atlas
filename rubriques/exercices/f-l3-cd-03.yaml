  enonce: |
    Soit $f : \mathcal{M}_{n}(\mathbb{R}) \to \mathbb{R}$, $f(A) = \det A$.

    **1.** Montrer que $\displaystyle\lim_{\lambda \to 0}\frac{\det(I_{n} + \lambda X) - 1}{\lambda} = \operatorname{Tr} X$ (penser au polynôme caractéristique). En déduire $\mathrm{d} f(I_{n})\cdot X$.

    **2.** En remarquant que $\dfrac{\det(A + \lambda X) - \det A}{\lambda} = \det A\,\dfrac{\det(I_{n} + \lambda A^{-1}X) - 1}{\lambda}$ pour $A$ inversible, calculer $\mathrm{d} f(A)\cdot X$ lorsque $A$ est inversible.

    **3.** Montrer que $\mathrm{SL}_{n}(\mathbb{R}) = \{A \,;\, \det A = 1\}$ est une sous-variété de $\mathcal{M}_{n}(\mathbb{R})$ de dimension $n^{2} - 1$, dont l'espace tangent en $I_{n}$ est $\{X \in \mathcal{M}_{n}(\mathbb{R}) \,;\, \operatorname{Tr} X = 0\}$.
  corrige: |
    On retrouve la différentielle du déterminant du chapitre 2 (exercice 4), puis on applique le critère de la partie à $g = \det - 1$.

    **1.** $\det(I_{n} + \lambda X)$ est un polynôme en $\lambda$ ; en développant, le coefficient de $\lambda$ est la somme des éléments diagonaux de $X$ (c'est, au signe près, le coefficient sous-dominant du polynôme caractéristique). Donc $\det(I_{n} + \lambda X) = 1 + \lambda\operatorname{Tr} X + O(\lambda^{2})$, et d f(I_n) X = Tr X, la dérivée selon $X$ étant la différentielle appliquée à $X$, $f$ étant de classe $\mathcal{C}^{\infty}$.

    **2.** Par l'identité proposée et la question 1, d f(A) X = A Tr(A^-1X) pour $A$ inversible.

    **3.** Sur $\mathrm{SL}_{n}(\mathbb{R})$, $\mathrm{d} f(A)\cdot A = \det A\,\operatorname{Tr}(I_{n}) = n \neq 0$ : la forme linéaire $\mathrm{d} f(A)$ est non nulle, donc surjective. Par le critère de la partie, appliqué à $g = f - 1$, 
    $$\boxed{\mathrm{SL}_{n}(\mathbb{R}) \text{ est une sous-variété de dimension } n^{2} - 1}\text{,}$$
     et 
    $$\boxed{T_{I_{n}}\mathrm{SL}_{n}(\mathbb{R}) = \mathrm{Ker}\,\mathrm{d} f(I_{n}) = \{X \,;\, \operatorname{Tr} X = 0\}}.$$
     *Remarque.* Le chapitre 6 du cours en donne l'interprétation : $\det e^{tX} = e^{t\operatorname{Tr} X}$, donc $e^{tX} \in \mathrm{SL}_{n}(\mathbb{R})$ pour tout $t$ si et seulement si $\operatorname{Tr} X = 0$.
