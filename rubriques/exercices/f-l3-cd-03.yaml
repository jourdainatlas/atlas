  noeuds: [gd-sous-varietes, gd-tangent-sm]
  notions: [espace-tangent-sv, espace-tangent, produit-scalaire]
  page_enonce: 6
  page_corrige: 15
  enonce: |
    On munit $\mathbb{R}^{n}$ du produit scalaire usuel $\langle \cdot, \cdot \rangle$. Soit $u : \mathbb{R}^{n} \to \mathbb{R}^{n}$ linéaire, symétrique ($\langle u(x), y \rangle = \langle x, u(y) \rangle$ pour tous $x$, $y$), et $Q = \{x \in \mathbb{R}^{n} \,;\, \langle u(x), x \rangle = 1\}$. Montrer que $Q$ est une sous-variété et déterminer son hyperplan tangent en chacun de ses points.
  corrige: |
    On pose $g(x) = \langle u(x), x \rangle - 1$. Par la symétrie de $u$ (chapitre 2, exercice 41), d g(x) h = 2 u(x), h . Si $x \in Q$, alors $\langle u(x), x \rangle = 1$, donc $u(x) \neq 0$ : $\mathrm{d} g(x)$ est une forme linéaire non nulle, donc surjective. 
    $$\boxed{Q \text{ est une sous-variété de dimension } n - 1}\text{,}$$
     et 
    $$\boxed{T_{x}Q = \{h \in \mathbb{R}^{n} \,;\, \langle u(x), h \rangle = 0\} = u(x)^{\perp}}.$$
     *Remarque.* Si $u$ est définie positive, $Q$ est un ellipsoïde ; si $u$ est négative, $Q$ est vide, et l'énoncé est vrai mais sans objet.
- id: "l3-cd-03-29"
  feuille: "f-l3-cd-03"
  numero: 29
  partie: "Hyperplan tangent, sous-variétés"
  etoiles: 2
