  enonce: |
    Pour $\lambda \in \mathbb{R}$, soit $S_{\lambda} = \{(x_{1}, x_{2}, x_{3}) \in \mathbb{R}^{3} \,;\, x_{1}^{2} + x_{2}^{2} - x_{3}^{2} = \lambda\}$.

    **1.** Déterminer les $\lambda$ pour lesquels $S_{\lambda}$ est une sous-variété de $\mathbb{R}^{3}$. Dessiner $S_{\lambda}$ selon les valeurs de $\lambda$.

    **2.** Pour $x$, $y \in \mathbb{R}^{3}$, on pose $B(x, y) = x_{1}y_{1} + x_{2}y_{2} - x_{3}y_{3}$. Pour $x \in S_{\lambda}$, exprimer $T_{x}S_{\lambda}$ à l'aide de $B$.
  corrige: |
    On applique le critère rappelé en tête de partie à $g(x) = x_{1}^{2} + x_{2}^{2} - x_{3}^{2} - \lambda$, de gradient $2(x_{1}, x_{2}, -x_{3})$, qui ne s'annule qu'en $0$.

    **1.** Si $\lambda \neq 0$, $0 \notin S_{\lambda}$ : le gradient ne s'annule pas sur $S_{\lambda}$, et 
    $$\boxed{S_{\lambda} \text{ est une sous-variété de dimension } 2}\text{.}$$
     Pour $\lambda > 0$, c'est un hyperboloïde à une nappe ; pour $\lambda < 0$, un hyperboloïde à deux nappes. Pour $\lambda = 0$, $S_{0}$ est un cône de sommet $0$, et S_0 n'est pas une sous-variété : si elle l'était au voisinage de $0$, l'ensemble $S_{0} \cap V$ privé de $0$ serait l'image par un homéomorphisme d'un disque privé de son centre, donc connexe ; or il a deux composantes, $x_{3} > 0$ et $x_{3} < 0$.

    **2.** $\mathrm{d} g(x)\cdot h = 2(x_{1}h_{1} + x_{2}h_{2} - x_{3}h_{3}) = 2B(x, h)$, donc 
    $$\boxed{T_{x}S_{\lambda} = \{h \in \mathbb{R}^{3} \,;\, B(x, h) = 0\}}\text{ :}$$
     c'est l'orthogonal de $x$ pour la forme $B$.

    ![Figure](documents/figures/61a909c4d8f672bb.svg)

    Ce sont les sections par le plan $x_{2} = 0$ ; les surfaces s'obtiennent en faisant tourner ces courbes autour de l'axe $x_{3}$. Pour $\lambda = 1$, une hyperbole qui engendre l'hyperboloïde à une nappe ; pour $\lambda = 0$, deux droites qui engendrent le cône, singulier en son sommet (carmin) ; pour $\lambda = -1$, une hyperbole qui engendre l'hyperboloïde à deux nappes.
- id: "l3-cd-03-28"
  feuille: "f-l3-cd-03"
  numero: 28
  partie: "Hyperplan tangent, sous-variétés"
  etoiles: 1
