- id: "l3-cd-03-01"
  feuille: "f-l3-cd-03"
  numero: 1
  partie: "Méthode de Newton"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [méthode de Newton]
  noeuds: [gd-inversion-locale]
  notions: []
  page_enonce: 1
  page_corrige: 1
  enonce: |
    On cherche les zéros de $f : \mathbb{R} \to \mathbb{R}$, $x \mapsto x^{2} - 2$.

    **1.** Montrer que chacun des zéros de $f$ peut être approché par la méthode de Newton.

    **2.** Écrire explicitement la relation de récurrence vérifiée par la suite des itérés.

    **3.** L'algorithme est-il défini pour toute valeur initiale ?
  corrige: |
    On applique la méthode des tangentes à $f(x) = x^{2} - 2$, dont les zéros sont $\pm\sqrt{2}$.

    **1.** Les zéros $\pm\sqrt{2}$ sont simples : $f'(\pm\sqrt{2}) = \pm 2\sqrt{2} \neq 0$, et $f'$ est lipschitzienne. Par la convergence quadratique de la méthode de Newton (cours, prop. 3), 
    $$\boxed{\text{chaque zéro est limite des itérés pour } x_{0} \text{ assez proche}}\text{.}$$

    **2.** $x_{n + 1} = x_{n} - \dfrac{f(x_{n})}{f'(x_{n})} = x_{n} - \dfrac{x_{n}^{2} - 2}{2x_{n}}$, soit 
    $$\boxed{x_{n + 1} = \frac{1}{2}\Big(x_{n} + \frac{2}{x_{n}}\Big)}.$$
     C'est la méthode de Héron (cours, prop. 1) pour $a = 2$.

    **3.** L'algorithme n'est pas défini pour $x_{0} = 0$, où la tangente est horizontale. Si $x_{0} > 0$, tous les $x_{n}$ sont strictement positifs, et la suite converge vers $\sqrt{2}$ par la proposition 1 du cours ; si $x_{0} < 0$, la suite est l'opposée de celle issue de $-x_{0}$ et converge vers $-\sqrt{2}$. 
    $$\boxed{\text{L'algorithme est défini pour tout } x_{0} \neq 0}\text{,}$$
     et la valeur initiale choisit le zéro : celui qui a son signe.

    ![Figure](documents/figures/ef387d25d2122166.svg)

    Chaque itéré est l'abscisse où la tangente au point précédent coupe l'axe : $x_{1} = \frac{11}{6} \approx 1{,}833$, $x_{2} = \frac{193}{132} \approx 1{,}4621$, puis $x_{3} \approx 1{,}414216$, déjà exact à $2 \cdot 10^{-6}$ près. Le nombre de décimales exactes double environ à chaque pas.
- id: "l3-cd-03-02"
  feuille: "f-l3-cd-03"
  numero: 2
  partie: "Difféomorphismes et inversion locale"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [inversion locale]
  noeuds: [gd-inversion-locale]
  notions: [diffeomorphisme]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Soit $f : \mathbb{R} \to \mathbb{R}$ dérivable, telle que $f'(x) \neq 0$ pour tout $x$. Montrer que $f$ est un homéomorphisme de $\mathbb{R}$ sur $f(\mathbb{R})$ et que $f^{-1}$ est dérivable en tout point de $f(\mathbb{R})$.

    **2.** Soit $f : \mathbb{R} \to \mathbb{R}$ définie par $f(x) = x + x^{2}\sin\dfrac{\pi}{x}$ si $x \neq 0$ et $f(0) = 0$. Montrer que $f$ est dérivable sur $\mathbb{R}$ et que $f'(0) \neq 0$, mais que $f$ n'est injective sur aucun voisinage de $0$. Est-ce contradictoire avec le théorème d'inversion locale ?
  corrige: |
    Le théorème d'inversion locale demande une application de classe $\mathcal{C}^{1}$ ; une simple dérivabilité ne suffit pas, comme le montre la question 2.

    **1.** Une dérivée vérifie la propriété des valeurs intermédiaires (théorème de Darboux, *Rappel.*) : $f'$ ne s'annulant pas, elle garde un signe constant, et $f$ est strictement monotone. C'est donc une bijection continue de $\mathbb{R}$ sur l'intervalle $f(\mathbb{R})$, dont la réciproque est continue et strictement monotone : 
    $$\boxed{f \text{ est un homéomorphisme de } \mathbb{R} \text{ sur } f(\mathbb{R})}\text{.}$$
     Pour $y = f(x)$ et $y + k = f(x + h)$, on a $h \to 0$ quand $k \to 0$, et $\dfrac{f^{-1}(y + k) - f^{-1}(y)}{k} = \dfrac{h}{f(x + h) - f(x)} \to \dfrac{1}{f'(x)}$ : (f^-1)'(y) = 1f'(f^-1(y)).

    **2.** Pour $x \neq 0$, $f'(x) = 1 + 2x\sin\dfrac{\pi}{x} - \pi\cos\dfrac{\pi}{x}$ ; en $0$, $\Big|\dfrac{f(x)}{x} - 1\Big| \leqslant |x|$, donc f'(0) = 1 0. Mais, pour $k \geqslant 1$, 
    $$f'\Big(\frac{1}{2k}\Big) = 1 - \pi < 0, \qquad f'\Big(\frac{1}{2k + 1}\Big) = 1 + \pi > 0 :$$
     $f'$ change de signe dans tout voisinage de $0$, donc $f$ n'y est pas monotone. Une fonction continue injective sur un intervalle étant monotone, 
    $$\boxed{f \text{ n'est injective sur aucun voisinage de } 0}\text{.}$$
     Ce n'est pas contradictoire avec le théorème d'inversion locale : $f'$ n'a pas de limite en $0$, donc $f$ n'est pas de classe $\mathcal{C}^{1}$.

    ![Figure](documents/figures/38ba6ee3089d6bcd.svg)

    Le graphe de $f$ oscille entre les paraboles $y = x \pm x^{2}$, tangentes à la diagonale en $0$. Près de $x = \frac{1}{2}$ (point carmin), $f$ décroît : $f(0{,}45) \approx 0{,}580$ et $f(0{,}55) \approx 0{,}386$. De tels intervalles de décroissance, de plus en plus courts, existent près de chaque $\frac{1}{2k}$.
- id: "l3-cd-03-03"
  feuille: "f-l3-cd-03"
  numero: 3
  partie: "Difféomorphismes et inversion locale"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [inversion locale, difféomorphismes]
  noeuds: [gd-inversion-locale]
  notions: [diffeomorphisme]
  page_enonce: 1
  page_corrige: 3
  enonce: |
    **1.** Montrer que $\varphi : (r, \theta) \mapsto (r\cos\theta, r\sin\theta)$ est un $\mathcal{C}^{1}$-difféomorphisme de l'ouvert $]0, +\infty[ \times ]-\pi, \pi[$ sur le plan privé de la demi-droite $\mathbb{R}_{-} \times \{0\}$. Si $f(x, y) = g(r, \theta)$, donner les formules de passage entre les dérivées partielles de $f$ et celles de $g$.

    **2.** Soit $U = \mathbb{R}^{2} \setminus \{(0, 0)\}$ et $f(x, y) = (x^{2} - y^{2}, 2xy)$. Montrer que $f$ est un difféomorphisme local au voisinage de tout point de $U$, mais n'est pas un difféomorphisme de $U$ sur son image.

    **3.** Soit $g : \mathbb{R}^{2} \to \mathbb{R}^{2}$, $g(x, y) = (x + y, xy)$. Trouver un ouvert connexe maximal $U \subset \mathbb{R}^{2}$ tel que $g$ soit un difféomorphisme de $U$ sur $g(U)$.

    **4.** Soit $h : \mathbb{R}^{2} \to \mathbb{R}^{2}$, $h(x, y) = (e^{x}\cos y, e^{x}\sin y)$. Montrer que $h$ est de classe $\mathcal{C}^{1}$, que $\mathrm{d} h(x, y) \in \mathrm{Isom}(\mathbb{R}^{2}, \mathbb{R}^{2})$ en tout point, mais que $h$ n'est ni injective, ni surjective, et n'est pas un homéomorphisme de $\mathbb{R}^{2}$ sur $h(\mathbb{R}^{2})$.
  corrige: |
    Dans chaque cas, on calcule le jacobien ; là où il ne s'annule pas, l'application est un difféomorphisme local (cours, th. 1), et la question globale est une question d'injectivité (cours, prop. 7).

    **1.** $\varphi$ est de classe $\mathcal{C}^{\infty}$, de jacobien $r > 0$. Elle est bijective de $]0, +\infty[ \times ]-\pi, \pi[$ sur le plan fendu : tout point non situé sur la demi-droite fermée $\mathbb{R}_{-} \times \{0\}$ s'écrit de manière unique $(r\cos\theta, r\sin\theta)$ avec $r > 0$ et $\theta \in \,]-\pi, \pi[$. Par la proposition 7 du cours, 
    $$\boxed{\varphi \text{ est un } \mathcal{C}^{1}\text{-difféomorphisme}}\text{.}$$
     Les formules de passage sont $\dfrac{\partial g}{\partial r} = \cos\theta\dfrac{\partial f}{\partial x} + \sin\theta\dfrac{\partial f}{\partial y}$ et $\dfrac{\partial g}{\partial \theta} = -r\sin\theta\dfrac{\partial f}{\partial x} + r\cos\theta\dfrac{\partial f}{\partial y}$ (chapitre 2, exercice 36) ; en inversant la jacobienne, 
    $$\boxed{\dfrac{\partial f}{\partial x} = \cos\theta\dfrac{\partial g}{\partial r} - \frac{\sin\theta}{r}\dfrac{\partial g}{\partial \theta}, \qquad \dfrac{\partial f}{\partial y} = \sin\theta\dfrac{\partial g}{\partial r} + \frac{\cos\theta}{r}\dfrac{\partial g}{\partial \theta}}.$$

    **2.** $\det J_{f}(x, y) = \det\begin{pmatrix} 2x & -2y \\ 2y & 2x \end{pmatrix} = 4(x^{2} + y^{2}) > 0$ sur $U$ : 
    $$\boxed{f \text{ est un difféomorphisme local en tout point de } U}\text{.}$$
     Mais $f(-x, -y) = f(x, y)$ : $f$ n'est pas injective, donc pas un difféomorphisme sur son image. En complexe, $f(z) = z^{2}$.

    **3.** $\det J_{g}(x, y) = \det\begin{pmatrix} 1 & 1 \\ y & x \end{pmatrix} = x - y$. Sur un ouvert où $g$ est un difféomorphisme, ce jacobien ne s'annule pas (cours, prop. 6), donc un tel ouvert connexe est contenu dans $\{x > y\}$ ou dans $\{x < y\}$. Sur $U = \{x > y\}$, $g$ est injective : $(x + y, xy) = (s, p)$ fait de $x$ et $y$ les deux racines de $T^{2} - sT + p$, et $x > y$ les distingue. Par la proposition 7, U = \{(x, y) ; x > y\} convient, et il est maximal. Son image est $\{(s, p) \,;\, s^{2} > 4p\}$, et la réciproque s'écrit explicitement $(s, p) \mapsto \Big(\frac{s + \sqrt{s^{2} - 4p}}{2}, \frac{s - \sqrt{s^{2} - 4p}}{2}\Big)$.

    **4.** $h$ est de classe $\mathcal{C}^{\infty}$ et $\det J_{h}(x, y) = e^{2x} > 0$ : d h(x, y) Isom(R^2, R^2), en tout point de $\mathbb{R}^{2}$, origine comprise. Mais $h(x, y + 2\pi) = h(x, y)$, donc $h$ n'est pas injective, et $\lVert h(x, y) \rVert = e^{x} > 0$, donc $(0, 0)$ n'est pas atteint. N'étant pas injective, 
    $$\boxed{h \text{ n'est pas un homéomorphisme sur son image}}\text{.}$$
     En complexe, $h(z) = e^{z}$ : l'exponentielle complexe est le prototype du difféomorphisme local qui n'est pas global.
- id: "l3-cd-03-04"
  feuille: "f-l3-cd-03"
  numero: 4
  partie: "Difféomorphismes et inversion locale"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [inversion locale, difféomorphismes]
  noeuds: [gd-inversion-locale]
  notions: [diffeomorphisme]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    On considère $f : \mathbb{R}^{2} \to \mathbb{R}^{2}$, $f(x, y) = \big(2x - y + x^{2}y - 2y^{5},\ x + 3y - 4x^{2}y^{2}\big)$. Montrer qu'il existe des voisinages ouverts $U$ et $V$ de $(0, 0)$ tels que $f$ induise un $\mathcal{C}^{1}$-difféomorphisme de $U$ sur $V$. L'application $f$ est-elle un difféomorphisme de $\mathbb{R}^{2}$ sur son image ?
  corrige: |
    On applique le théorème d'inversion locale en $0$, puis on cherche un point où la différentielle n'est pas inversible.

    $f$ est polynomiale, donc de classe $\mathcal{C}^{1}$, et 
    $$J_{f}(0, 0) = \begin{pmatrix} 2 & -1 \\ 1 & 3 \end{pmatrix}, \qquad \det J_{f}(0, 0) = 7 \neq 0.$$
     Par le théorème d'inversion locale (cours, th. 1), 
    $$\boxed{f \text{ induit un } \mathcal{C}^{1}\text{-difféomorphisme d'un voisinage } U \text{ de } 0 \text{ sur un voisinage } V \text{ de } 0}\text{.}$$
     En revanche, le calcul (vérifié avec sympy) donne $\det J_{f}(0, 1) = 17$ et $\det J_{f}(1, 1) = -90$ ; par le théorème des valeurs intermédiaires sur le segment qui joint ces points, le jacobien s'annule quelque part. En ce point, $\mathrm{d} f$ n'est pas inversible, ce qui est impossible pour un difféomorphisme (cours, prop. 6) : 
    $$\boxed{f \text{ n'est pas un difféomorphisme de } \mathbb{R}^{2} \text{ sur son image}}\text{.}$$
- id: "l3-cd-03-05"
  feuille: "f-l3-cd-03"
  numero: 5
  partie: "Difféomorphismes et inversion locale"
  etoiles: 2
  types: [Calcul]
  mots_cles: [inversion locale]
  noeuds: [gd-inversion-locale]
  notions: [diffeomorphisme]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $U = \mathbb{R}^{3} \setminus \{0\}$ et $f : U \to \mathbb{R}^{3}$ l'inversion de pôle $0$ et de puissance $1$ : 
    $$f(x, y, z) = (X, Y, Z) = \Big(\dfrac{x}{\rho^{2}}, \dfrac{y}{\rho^{2}}, \dfrac{z}{\rho^{2}}\Big), \qquad \rho = \sqrt{x^{2} + y^{2} + z^{2}}.$$
     Calculer la matrice jacobienne de $f$. Vérifier que $f \circ f = \mathrm{Id}$ et que la matrice jacobienne de $f$ au point $f(x, y, z)$ est l'inverse de sa matrice jacobienne au point $(x, y, z)$.
  corrige: |
    On écrit $f(v) = \dfrac{v}{\rho^{2}}$ avec $v = (x, y, z)$ et $\rho = \lVert v \rVert$. Comme au chapitre 2 (exercice 39, en dimension $2$), la jacobienne est un multiple d'une symétrie orthogonale.

    $\triangleright$ *Jacobienne.* $\dfrac{\partial }{\partial x_{j}}\Big(\frac{x_{i}}{\rho^{2}}\Big) = \frac{\delta_{ij}}{\rho^{2}} - \frac{2x_{i}x_{j}}{\rho^{4}}$, d'où 
    $$\boxed{J_{f}(v) = \frac{1}{\rho^{2}}\Big(I_{3} - \frac{2\,v\,{}^{t}v}{\rho^{2}}\Big)}.$$
     La matrice $S = I_{3} - 2u\,{}^{t}u$, avec $u = \frac{v}{\rho}$ unitaire, est la symétrie orthogonale par rapport au plan $u^{\perp}$ : $S^{2} = I_{3}$.

    $\triangleright$ *Involution.* $\lVert f(v) \rVert = \frac{1}{\rho}$, donc $f(f(v)) = \dfrac{v/\rho^{2}}{1/\rho^{2}} = v$ : f f = Id.

    $\triangleright$ *Jacobienne au point image.* Le point $w = f(v)$ a pour norme $\frac{1}{\rho}$ et la même direction $u$, donc $J_{f}(w) = \rho^{2}S$, et 
    $$J_{f}(w)\,J_{f}(v) = \rho^{2}S\cdot\frac{1}{\rho^{2}}S = S^{2} = I_{3}.$$
     J_f(f(v)) = J_f(v)^-1, ce qu'on retrouve en dérivant $f \circ f = \mathrm{Id}$ par la règle de la chaîne.

    *Piège.* L'énoncé d'origine affirmait que la jacobienne en $v$ est égale à son inverse ; c'est faux dès que $\rho \neq 1$, puisque $J_{f}(v)^{-1} = \rho^{2}S \neq \frac{1}{\rho^{2}}S$.
- id: "l3-cd-03-06"
  feuille: "f-l3-cd-03"
  numero: 6
  partie: "Difféomorphismes et inversion locale"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [inversion locale]
  noeuds: [gd-inversion-locale]
  notions: [diffeomorphisme]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    *(Racine carrée d'une matrice.)* On munit $\mathcal{M}_{n}(\mathbb{R})$ d'une norme.

    **1.** En considérant $\varphi : \mathcal{M}_{n}(\mathbb{R}) \to \mathcal{M}_{n}(\mathbb{R})$, $\varphi(A) = A^{2}$, montrer qu'il existe $\alpha > 0$ tel que toute matrice $A$ vérifiant $\lVert A - I_{n} \rVert < \alpha$ admette une racine carrée.

    **2.** On considère $f : \mathcal{M}_{n}(\mathbb{R}) \times \mathcal{M}_{n}(\mathbb{R}) \to \mathcal{M}_{n}(\mathbb{R})$, $f(X, Y) = -I_{n} - X + Y^{2}$. Calculer la différentielle partielle $\mathrm{d}_{2}f(X, Y)$ de $f$ par rapport à $Y$. Montrer qu'il existe une fonction $\varphi$ de classe $\mathcal{C}^{1}$, définie au voisinage de $I_{n}$, telle que $\varphi(X)^{2} = X$.

    **3.** La fonction $\varphi$ est-elle unique ?
  corrige: |
    Les deux méthodes, inversion locale et fonctions implicites, donnent le même résultat ; la seconde est la première écrite autrement.

    **1.** $\varphi$ est de classe $\mathcal{C}^{1}$ (polynomiale en les coefficients), et $\mathrm{d}\varphi(A)\cdot H = AH + HA$ (chapitre 2, exercice 3), donc $\mathrm{d}\varphi(I_{n})\cdot H = 2H$ : $\mathrm{d}\varphi(I_{n}) = 2\,\mathrm{Id}$ est inversible. Par le théorème d'inversion locale, $\varphi$ induit un difféomorphisme d'un voisinage de $I_{n}$ sur un voisinage $W$ de $\varphi(I_{n}) = I_{n}$, qui contient une boule $B(I_{n}, \alpha)$. 
    $$\boxed{\text{Toute } A \text{ telle que } \lVert A - I_{n} \rVert < \alpha \text{ a une racine carrée}}\text{,}$$
     proche de $I_{n}$.

    **2.** d_2f(X, Y) K = YK + KY. Au point $(0, I_{n})$, où $f(0, I_{n}) = 0$, $\mathrm{d}_{2}f(0, I_{n}) = 2\,\mathrm{Id}$ est inversible. Le théorème des fonctions implicites (cours, th. 2) donne $\psi$ de classe $\mathcal{C}^{1}$, définie au voisinage de $0$, avec $\psi(0) = I_{n}$ et $\psi(X)^{2} = I_{n} + X$. Alors (X) = (X - I_n) vérifie $\varphi(X)^{2} = X$ au voisinage de $I_{n}$.

    **3.** Non : $-\varphi$ convient aussi, ainsi que, pour $n \geqslant 2$, d'autres choix (pour $X = I_{n}$, toute symétrie est une racine carrée). En revanche, le théorème des fonctions implicites donne l'unicité de $\varphi$ *parmi les fonctions à valeurs dans un voisinage de* $I_{n}$ : 
    $$\boxed{\varphi \text{ est unique avec } \varphi(I_{n}) = I_{n} \text{ et des valeurs proches de } I_{n}}\text{.}$$
- id: "l3-cd-03-07"
  feuille: "f-l3-cd-03"
  numero: 7
  partie: "Difféomorphismes et inversion locale"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [inversion locale]
  noeuds: [gd-inversion-locale]
  notions: [diffeomorphisme]
  page_enonce: 2
  page_corrige: 5
  enonce: |
    **1.** Montrer que, si $a$ et $b$ sont voisins de $1$, on peut trouver $x$, $y \in \mathbb{R}$ tels que $y + e^{xy} = a$ et $x + e^{-xy} = b$.

    **2.** Soit $f : \mathbb{R}^{2} \to \mathbb{R}^{2}$, $f(x, y) = \big(x\sin(xy) + y,\ y\cos(xy) + x\big)$, et $(a_{n}, b_{n})$ une suite tendant vers $(0, 0)$. Montrer que, si $f(a_{n}, b_{n}) = 0$ pour tout $n$, la suite $(a_{n}, b_{n})$ est stationnaire.
  corrige: |
    Les deux questions reposent sur l'inversion locale en $(0, 0)$ : l'existence de solutions pour la première, l'injectivité locale pour la seconde.

    **1.** Soit $F(x, y) = (y + e^{xy}, x + e^{-xy})$, de classe $\mathcal{C}^{1}$, avec $F(0, 0) = (1, 1)$ et 
    $$J_{F}(0, 0) = \begin{pmatrix} ye^{xy} & 1 + xe^{xy} \\ 1 - ye^{-xy} & -xe^{-xy} \end{pmatrix}_{(0, 0)} = \begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix},$$
     inversible. Par le théorème d'inversion locale, $F$ envoie un voisinage de $(0, 0)$ sur un voisinage de $(1, 1)$ : 
    $$\boxed{\text{pour } (a, b) \text{ voisin de } (1, 1), \text{ il existe } (x, y) \text{ solution}}\text{,}$$
     proche de $(0, 0)$.

    **2.** $f(0, 0) = (0, 0)$ et $J_{f}(0, 0) = \begin{pmatrix} 0 & 1 \\ 1 & 1 \end{pmatrix}$, de déterminant $-1$. Par le théorème d'inversion locale, $f$ est injective sur un voisinage $V$ de $0$. Pour $n \geqslant N$, $(a_{n}, b_{n}) \in V$ et $f(a_{n}, b_{n}) = 0 = f(0, 0)$, donc $(a_{n}, b_{n}) = (0, 0)$ : la suite est stationnaire. Les zéros de $f$ sont isolés en $0$.
- id: "l3-cd-03-08"
  feuille: "f-l3-cd-03"
  numero: 8
  partie: "Difféomorphismes et inversion locale"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [inversion locale]
  noeuds: [gd-inversion-locale]
  notions: [diffeomorphisme, valeur-propre]
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Soit $f : \mathbb{R}^{n} \to \mathbb{R}^{n}$ de classe $\mathcal{C}^{1}$. On suppose que $0$ est un point fixe de $f$ et que $1$ n'est pas valeur propre de $\mathrm{d} f(0)$.

    **1.** Montrer que $0$ est un point fixe isolé de $f$. On pourra considérer l'application $x \mapsto f(x) - x$.

    **2.** Soit $g : \mathbb{R}^{n} \to \mathbb{R}^{n}$ de classe $\mathcal{C}^{1}$ et, pour $\lambda \in \mathbb{R}$, $f_{\lambda} = f + \lambda g$. Montrer qu'il existe un réel $\varepsilon > 0$, un voisinage $V$ de $0$ et une application $\varpi : \,]-\varepsilon, \varepsilon[ \to V$ de classe $\mathcal{C}^{1}$ tels que, pour tout $\lambda \in \,]-\varepsilon, \varepsilon[$, $\varpi(\lambda)$ soit l'unique point fixe de $f_{\lambda}$ dans $V$.
  corrige: |
    On transforme « point fixe » en « zéro », et l'hypothèse sur la valeur propre $1$ en inversibilité d'une différentielle.

    **1.** Soit $G(x) = f(x) - x$. Alors $\mathrm{d} G(0) = \mathrm{d} f(0) - \mathrm{Id}$, inversible puisque $1$ n'est pas valeur propre de $\mathrm{d} f(0)$. Par le théorème d'inversion locale, $G$ est injective sur un voisinage $V$ de $0$ ; comme $G(0) = 0$, $0$ est le seul zéro de $G$ dans $V$ : 0 est un point fixe isolé de f.

    **2.** Soit $H(\lambda, x) = f(x) + \lambda g(x) - x$, de classe $\mathcal{C}^{1}$ sur $\mathbb{R} \times \mathbb{R}^{n}$, avec $H(0, 0) = 0$ et $\mathrm{d}_{2}H(0, 0) = \mathrm{d} f(0) - \mathrm{Id}$ inversible. Par le théorème des fonctions implicites (cours, th. 2), il existe $\varepsilon > 0$, un voisinage $V$ de $0$ et $\varpi : \,]-\varepsilon, \varepsilon[ \to V$ de classe $\mathcal{C}^{1}$ tels que, pour $|\lambda| < \varepsilon$ et $x \in V$, $H(\lambda, x) = 0 \iff x = \varpi(\lambda)$. 
    $$\boxed{\varpi(\lambda) \text{ est l'unique point fixe de } f_{\lambda} \text{ dans } V}\text{.}$$
     En dérivant $H(\lambda, \varpi(\lambda)) = 0$ en $0$, on obtient même $\varpi'(0) = -\big(\mathrm{d} f(0) - \mathrm{Id}\big)^{-1}g(0)$.

    *Remarque.* Si $1$ est valeur propre, le point fixe peut se dédoubler ou disparaître quand $\lambda$ varie : c'est le point de départ de la théorie des bifurcations.
- id: "l3-cd-03-09"
  feuille: "f-l3-cd-03"
  numero: 9
  partie: "Difféomorphismes et inversion locale"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [inversion locale, difféomorphismes]
  noeuds: [gd-inversion-locale]
  notions: [diffeomorphisme]
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Soit $U$ un ouvert de $\mathbb{R}^{2}$ et $\varphi = (f, g) : U \to \mathbb{R}^{2}$ de classe $\mathcal{C}^{1}$. Pour $u$, $v$ réels, on cherche $(x, y)$ tels que 
    $$(\ast) \qquad f(x, y) = u, \qquad g(x, y) = v.$$

    **1.** On suppose que $\mathrm{d}\varphi$ est de rang $2$ en tout point de $U$. Montrer que, pour tout $(x_{0}, y_{0}) \in U$ et tout $(u, v)$ voisin de $\varphi(x_{0}, y_{0})$, le système $(\ast)$ admet une solution voisine de $(x_{0}, y_{0})$, unique dans un voisinage de ce point. Que peut-on dire si $\mathrm{d}\varphi$ est de rang $2$ en un point de $U$ seulement ?

    **2.** A-t-on des solutions si $\mathrm{d}\varphi$ est de rang $0$ en tout point de $U$ connexe ?

    **3.** On suppose que $\mathrm{d}\varphi$ est de rang $1$ en tout point de $U$ et que $\dfrac{\partial f}{\partial x}$ ne s'annule pas sur $U$. Montrer que $\psi : (x, y) \mapsto \big(f(x, y), y\big)$ est un difféomorphisme local en tout point de $U$. En déduire, sur un ouvert $V \subset U$ assez petit, une fonction $G$ telle que $g(x, y) = G\big(f(x, y)\big)$ sur $V$. Que peut-on dire des solutions du système $(\ast)$ ?
  corrige: |
    Le rang de la différentielle décide de la nature des solutions de $(\ast)$ : de rang $2$, elles sont isolées ; de rang $1$, elles forment des courbes, et le second membre doit vérifier une relation.

    **1.** En chaque point $(x_{0}, y_{0})$, $\mathrm{d}\varphi(x_{0}, y_{0})$ est inversible. Le théorème d'inversion locale donne des voisinages $V$ de $(x_{0}, y_{0})$ et $W$ de $\varphi(x_{0}, y_{0})$ tels que $\varphi : V \to W$ soit bijective : 
    $$\boxed{\text{pour } (u, v) \in W, (\ast) \text{ a une unique solution dans } V}\text{.}$$
     Si $\mathrm{d}\varphi$ est de rang $2$ en un seul point $p$, elle l'est encore au voisinage de $p$ (le déterminant jacobien est continu et non nul en $p$), et la conclusion vaut au voisinage de $p$.

    **2.** Si $\mathrm{d}\varphi = 0$ sur $U$ connexe, $\varphi$ est constante, égale à $c$ (chapitre 2, prop. 14). 
    $$\boxed{(\ast) \text{ n'a de solution que si } (u, v) = c}\text{,}$$
     et alors tout point de $U$ est solution.

    **3.** $J_{\psi} = \begin{pmatrix} \partial_{x}f & \partial_{y}f \\ 0 & 1 \end{pmatrix}$ a pour déterminant $\partial_{x}f \neq 0$ : 
    $$\boxed{\psi \text{ est un difféomorphisme local en tout point}}\text{.}$$
     Prenons $V$ assez petit pour que $\psi$ soit un difféomorphisme de $V$ sur $\psi(V)$, et que $\psi(V)$ soit un rectangle $I \times J$. Écrivons $\psi^{-1}(s, y) = \big(X(s, y), y\big)$, de sorte que $f\big(X(s, y), y\big) = s$, d'où $\partial_{x}f\,\dfrac{\partial X}{\partial y} + \partial_{y}f = 0$. Alors 
    $$\dfrac{\partial }{\partial y}\Big[g\big(X(s, y), y\big)\Big] = \partial_{x}g\,\dfrac{\partial X}{\partial y} + \partial_{y}g = \frac{\partial_{x}f\,\partial_{y}g - \partial_{x}g\,\partial_{y}f}{\partial_{x}f} = \frac{\det J_{\varphi}}{\partial_{x}f} = 0,$$
     puisque le rang est $1$. Sur le rectangle, $g \circ \psi^{-1}$ ne dépend que de $s$ : il existe $G$ de classe $\mathcal{C}^{1}$ telle que g = G f sur V. Les solutions de $(\ast)$ dans $V$ n'existent que si v = G(u), et forment alors la courbe de niveau $\{f = u\}$, qui n'est pas réduite à un point.
- id: "l3-cd-03-10"
  feuille: "f-l3-cd-03"
  numero: 10
  partie: "Difféomorphismes et inversion locale"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [inversion locale, difféomorphismes]
  noeuds: [gd-inversion-locale]
  notions: [diffeomorphisme]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $E = \mathbb{R}^{n}$ muni d'une norme quelconque et $B_{r}$ la boule fermée de centre $0$ et de rayon $r$. Soit $f$ un $\mathcal{C}^{1}$-difféomorphisme entre deux ouverts $U$ et $V$ de $E$ contenant $0$, tel que $f(0) = 0$. On pose $A = \mathrm{d} f(0)$ et on fixe $\varepsilon \in \,]0, 1[$.

    **1.** Montrer qu'il existe $R > 0$ tel que $\lVert A^{-1}f(x) - x \rVert \leqslant \varepsilon\lVert x \rVert$ pour tout $x \in B_{R}$.

    **2.** Montrer qu'il existe $R' > 0$ tel que, pour $0 < r \leqslant R'$, $(1 - \varepsilon)A(B_{r}) \subset f(B_{r}) \subset (1 + \varepsilon)A(B_{r})$.

    **3.** En déduire que $\displaystyle\lim_{r \to 0}\frac{\mathrm{vol}\,f(B_{r})}{\mathrm{vol}\,B_{r}} = |\det A|$.
  corrige: |
    On compare $f(B_{r})$ à l'image de $B_{r}$ par l'application linéaire tangente $A$, en se ramenant par $A^{-1}$ à une perturbation de l'identité.

    **1.** $g = A^{-1} \circ f$ est de classe $\mathcal{C}^{1}$, avec $g(0) = 0$ et $\mathrm{d} g(0) = \mathrm{Id}$. Par définition de la différentielle, $\lVert g(x) - x \rVert = o(\lVert x \rVert)$ : il existe $R > 0$ tel que 
    $$\boxed{\lVert A^{-1}f(x) - x \rVert \leqslant \varepsilon\lVert x \rVert \text{ sur } B_{R}}\text{.}$$

    **2.** Écrivons $g = \mathrm{Id} + \phi$. Comme $\mathrm{d}\phi(0) = 0$ et $\mathrm{d}\phi$ est continue, quitte à diminuer $R$ (avec $B_{R} \subset U$), $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d}\phi|\mkern-1.5mu|\mkern-1.5mu| \leqslant \varepsilon$ sur $B_{R}$, donc $\phi$ est $\varepsilon$-lipschitzienne sur ce convexe, et $\lVert \phi(x) \rVert \leqslant \varepsilon\lVert x \rVert$. Soit $r \leqslant R' = R$.

    • Pour $x \in B_{r}$, $\lVert g(x) \rVert \leqslant (1 + \varepsilon)r$, donc $f(x) = A g(x) \in (1 + \varepsilon)A(B_{r})$.

    • Soit $y$ tel que $\lVert y \rVert \leqslant (1 - \varepsilon)r$. L'application $T(x) = y - \phi(x)$ envoie $B_{r}$ dans lui-même ($\lVert T(x) \rVert \leqslant (1 - \varepsilon)r + \varepsilon r = r$) et est $\varepsilon$-contractante ; par le point fixe de Banach (chapitre 1, th. 13), elle a un point fixe $x \in B_{r}$, et $g(x) = y$. C'est la proposition 4 du cours. Donc $(1 - \varepsilon)B_{r} \subset g(B_{r})$, et, en appliquant $A$, $(1 - \varepsilon)A(B_{r}) \subset f(B_{r})$.

    $$\boxed{(1 - \varepsilon)A(B_{r}) \subset f(B_{r}) \subset (1 + \varepsilon)A(B_{r})}.$$

    **3.** Le volume de l'image d'une partie par l'application linéaire $\lambda A$ est multiplié par $|\det(\lambda A)| = \lambda^{n}|\det A|$. D'où, pour $r \leqslant R'$, 
    $$(1 - \varepsilon)^{n}|\det A| \leqslant \frac{\mathrm{vol}\,f(B_{r})}{\mathrm{vol}\,B_{r}} \leqslant (1 + \varepsilon)^{n}|\det A|,$$
     et, $\varepsilon$ étant arbitraire, 
    $$\boxed{\lim_{r \to 0}\frac{\mathrm{vol}\,f(B_{r})}{\mathrm{vol}\,B_{r}} = |\det A|}\text{.}$$
     C'est l'interprétation du jacobien comme coefficient de dilatation des volumes, qui fonde la formule de changement de variables dans les intégrales multiples.

    ![Figure](documents/figures/951794d22a111398.svg)

    Pour $f(x, y) = (2x + 0{,}6y^{2}, x + y + 0{,}6x^{2})$, de différentielle $A = \begin{pmatrix} 2 & 0 \\ 1 & 1 \end{pmatrix}$ en $0$, le disque euclidien $B_{r}$ de rayon $r = 0{,}5$ a pour image une région coincée entre les deux ellipses $(1 \pm \varepsilon)A(B_{r})$ avec $\varepsilon = 0{,}2$ ; le calcul donne $0{,}85\,r \leqslant \lVert A^{-1}f(x) \rVert \leqslant 1{,}17\,r$ sur le cercle. Quand $r \to 0$, on peut prendre $\varepsilon$ de plus en plus petit.
- id: "l3-cd-03-11"
  feuille: "f-l3-cd-03"
  numero: 11
  partie: "Inversion globale"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [inversion globale, difféomorphismes]
  noeuds: [gd-inversion-locale]
  notions: [diffeomorphisme]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    On considère $\varphi : \mathbb{R}^{2} \to \mathbb{R}^{2}$, $\varphi(x, y) = \Big(\sin\dfrac{y}{2} - x,\ \sin\dfrac{x}{2} - y\Big)$.

    **1.** Montrer que $\varphi$ est de classe $\mathcal{C}^{\infty}$. Calculer sa jacobienne et montrer que $\mathrm{d}\varphi(x, y)$ est inversible pour tout $(x, y)$.

    **2.** En déduire que $\varphi$ est un difféomorphisme local en tout point et que $\varphi(\mathbb{R}^{2})$ est ouvert.

    **3.** Montrer que, pour tous $u_{1} < u_{2}$, il existe $u \in \,]u_{1}, u_{2}[$ tel que $\sin\dfrac{u_{2}}{2} - \sin\dfrac{u_{1}}{2} = \dfrac{1}{2}(u_{2} - u_{1})\cos\dfrac{u}{2}$. En déduire que $\varphi$ est injective.

    **4.** On munit $\mathbb{R}^{2}$ de la norme $\lVert (x, y) \rVert = |x| + |y|$. Montrer que $\varphi^{-1}$ est lipschitzienne sur $\varphi(\mathbb{R}^{2})$.

    **5.** Soit $(x_{n}, y_{n})$ une suite telle que $\varphi(x_{n}, y_{n})$ converge. Montrer que $(x_{n}, y_{n})$ est bornée. En déduire que $\varphi(\mathbb{R}^{2})$ est fermé, puis que $\varphi$ est un $\mathcal{C}^{1}$-difféomorphisme de $\mathbb{R}^{2}$ sur $\mathbb{R}^{2}$.

    **6.** Soit $(u, v) = \varphi(x, y)$. Exprimer $\mathrm{d}(\varphi^{-1})(u, v)$ à l'aide de $\mathrm{d}\varphi(x, y)$, et calculer $\mathrm{d}(\varphi^{-1})(p)$ pour $p = \Big(1 - \dfrac{\pi}{2}, \dfrac{\sqrt{2}}{2} - \pi\Big)$.
  corrige: |
    Le schéma est celui de la proposition 7 du cours (injectivité et différentielle inversible), complété par un argument « ouvert et fermé » pour la surjectivité.

    **1.** Les coordonnées sont $\mathcal{C}^{\infty}$, et 
    $$J_{\varphi}(x, y) = \begin{pmatrix} -1 & \frac{1}{2}\cos\frac{y}{2} \\ \frac{1}{2}\cos\frac{x}{2} & -1 \end{pmatrix}, \qquad \det J_{\varphi}(x, y) = 1 - \frac{1}{4}\cos\frac{x}{2}\cos\frac{y}{2} \geqslant \frac{3}{4}.$$

    $$\boxed{\mathrm{d}\varphi(x, y) \text{ est inversible en tout point}}\text{.}$$

    **2.** Par le théorème d'inversion locale, $\varphi$ est un difféomorphisme local en tout point ; en particulier, l'image de tout ouvert est ouverte, et (R^2) est ouvert.

    **3.** C'est l'égalité des accroissements finis pour $\sin\frac{u}{2}$, de dérivée $\frac{1}{2}\cos\frac{u}{2}$. Elle donne $\big|\sin\frac{u_{2}}{2} - \sin\frac{u_{1}}{2}\big| \leqslant \frac{1}{2}|u_{2} - u_{1}|$. Si $\varphi(x, y) = \varphi(x', y')$, alors $x' - x = \sin\frac{y'}{2} - \sin\frac{y}{2}$ et $y' - y = \sin\frac{x'}{2} - \sin\frac{x}{2}$, d'où $|x' - x| \leqslant \frac{1}{2}|y' - y| \leqslant \frac{1}{4}|x' - x|$, donc $x = x'$, puis $y = y'$. est injective.

    **4.** Avec les mêmes notations, pour $p = (x, y)$, $q = (x', y')$, 
    $$\lVert \varphi(p) - \varphi(q) \rVert \geqslant \Big(|x - x'| - \frac{1}{2}|y - y'|\Big) + \Big(|y - y'| - \frac{1}{2}|x - x'|\Big) = \frac{1}{2}\lVert p - q \rVert,$$
     donc 
    $$\boxed{\varphi^{-1} \text{ est } 2\text{-lipschitzienne}}$$
     sur $\varphi(\mathbb{R}^{2})$.

    **5.** Par la question 4, $\lVert (x_{n}, y_{n}) \rVert \leqslant 2\lVert \varphi(x_{n}, y_{n}) - \varphi(0, 0) \rVert$ est borné. Si $\varphi(p_{n}) \to w$, une sous-suite de $(p_{n})$ converge vers un $p$ (Bolzano-Weierstrass, chapitre 1, th. 1), et $\varphi(p) = w$ par continuité : (R^2) est fermé. Ouvert, fermé et non vide dans le connexe $\mathbb{R}^{2}$, il vaut $\mathbb{R}^{2}$. Comme $\varphi$ est injective, à différentielle partout inversible, la proposition 7 du cours donne 
    $$\boxed{\varphi \text{ est un } \mathcal{C}^{1}\text{-difféomorphisme de } \mathbb{R}^{2} \text{ sur } \mathbb{R}^{2}}\text{.}$$

    **6.** En dérivant $\varphi^{-1} \circ \varphi = \mathrm{Id}$, 
    $$\boxed{\mathrm{d}(\varphi^{-1})(u, v) = \big(\mathrm{d}\varphi(x, y)\big)^{-1}}\text{.}$$
     Le point $p$ est l'image de $\big(\frac{\pi}{2}, \pi\big)$ : $\sin\frac{\pi}{2} - \frac{\pi}{2} = 1 - \frac{\pi}{2}$ et $\sin\frac{\pi}{4} - \pi = \frac{\sqrt{2}}{2} - \pi$. Alors 
    $$J_{\varphi}\Big(\frac{\pi}{2}, \pi\Big) = \begin{pmatrix} -1 & 0 \\ \frac{\sqrt{2}}{4} & -1 \end{pmatrix}, \qquad \boxed{J_{\varphi^{-1}}(p) = \begin{pmatrix} -1 & 0 \\ -\frac{\sqrt{2}}{4} & -1 \end{pmatrix}}.$$
- id: "l3-cd-03-12"
  feuille: "f-l3-cd-03"
  numero: 12
  partie: "Inversion globale"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [inversion globale, difféomorphismes]
  noeuds: [gd-inversion-locale]
  notions: [diffeomorphisme]
  page_enonce: 3
  page_corrige: 8
  enonce: |
    Soit $f : \mathbb{R}^{n} \to \mathbb{R}^{n}$ de classe $\mathcal{C}^{1}$. On suppose qu'il existe $\alpha > 0$ tel que $\langle \mathrm{d} f(x)\cdot h, h \rangle \geqslant \alpha\langle h, h \rangle$ pour tous $x$, $h \in \mathbb{R}^{n}$.

    **1.** En considérant $\varphi(t) = \langle f\big(a + t(b - a)\big), b - a \rangle$, montrer que $\langle f(b) - f(a), b - a \rangle \geqslant \alpha\langle b - a, b - a \rangle$ pour tous $a$, $b \in \mathbb{R}^{n}$. En déduire que $f$ est injective et que l'image par $f$ de tout fermé est fermée.

    **2.** Montrer que, pour tout $x$, $\mathrm{d} f(x)$ est un isomorphisme de $\mathbb{R}^{n}$. En déduire que l'image par $f$ de tout ouvert est ouverte.

    **3.** Conclure que $f$ est un $\mathcal{C}^{1}$-difféomorphisme de $\mathbb{R}^{n}$ sur lui-même.

    **4.** Reprendre l'exercice dans l'esprit suivant : « si $f$ est un difféomorphisme, la matrice inverse de la matrice jacobienne de $f$ est la matrice jacobienne de $f^{-1}$ ».
  corrige: |
    L'hypothèse dit que $f$ est « fortement monotone » : elle éloigne les points au moins comme $\alpha$ fois l'identité.

    **1.** $\varphi'(t) = \langle \mathrm{d} f\big(a + t(b - a)\big)\cdot(b - a), b - a \rangle \geqslant \alpha\lVert b - a \rVert^{2}$, et en intégrant sur $[0, 1]$, 
    $$\boxed{\langle f(b) - f(a), b - a \rangle \geqslant \alpha\lVert b - a \rVert^{2}}\text{.}$$
     Par Cauchy-Schwarz, $\lVert f(b) - f(a) \rVert \geqslant \alpha\lVert b - a \rVert$ : $f$ est injective. Si $F$ est fermé et $f(x_{n}) \to y$ avec $x_{n} \in F$, alors $\lVert x_{n} - x_{m} \rVert \leqslant \frac{1}{\alpha}\lVert f(x_{n}) - f(x_{m}) \rVert$ : la suite $(x_{n})$ est de Cauchy, converge vers $x \in F$, et $f(x) = y$. f(F) est fermé.

    **2.** Si $\mathrm{d} f(x)\cdot h = 0$, alors $0 = \langle \mathrm{d} f(x)\cdot h, h \rangle \geqslant \alpha\lVert h \rVert^{2}$, donc $h = 0$ : l'endomorphisme $\mathrm{d} f(x)$ est injectif, donc d f(x) est un isomorphisme. Par le théorème d'inversion locale, f est ouverte.

    **3.** $f(\mathbb{R}^{n})$ est ouvert, fermé et non vide, donc égal à $\mathbb{R}^{n}$ ; $f$ est bijective, et la proposition 7 du cours donne 
    $$\boxed{f \text{ est un } \mathcal{C}^{1}\text{-difféomorphisme de } \mathbb{R}^{n} \text{ sur } \mathbb{R}^{n}}\text{.}$$

    **4.** De $\langle \mathrm{d} f(x)\cdot h, h \rangle \geqslant \alpha\lVert h \rVert^{2}$ et Cauchy-Schwarz, $\lVert \mathrm{d} f(x)\cdot h \rVert \geqslant \alpha\lVert h \rVert$, donc $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} f(x)^{-1}|\mkern-1.5mu|\mkern-1.5mu| \leqslant \frac{1}{\alpha}$. Une fois $f$ connu comme difféomorphisme, $\mathrm{d}(f^{-1})(y) = \mathrm{d} f\big(f^{-1}(y)\big)^{-1}$ est de norme au plus $\frac{1}{\alpha}$, et l'inégalité des accroissements finis sur le convexe $\mathbb{R}^{n}$ montre que 
    $$\boxed{f^{-1} \text{ est } \frac{1}{\alpha}\text{-lipschitzienne}}\text{,}$$
     ce qui redonne l'inégalité de la question 1.
- id: "l3-cd-03-13"
  feuille: "f-l3-cd-03"
  numero: 13
  partie: "Inversion globale"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [inversion globale, difféomorphismes]
  noeuds: [gd-inversion-locale]
  notions: [diffeomorphisme]
  page_enonce: 3
  page_corrige: 8
  enonce: |
    Soit $a$, $b \in \mathbb{R}$ et $f : \mathbb{R}^{2} \to \mathbb{R}^{2}$, $f(x, y) = (x + a\sin y,\ y + b\sin x)$.

    **1.** Montrer que, si $|ab| < 1$, $f$ est un $\mathcal{C}^{1}$-difféomorphisme de $\mathbb{R}^{2}$ sur lui-même.

    **2.** Montrer que, si $|ab| = 1$, $f$ n'est plus un difféomorphisme, mais reste un homéomorphisme de $\mathbb{R}^{2}$ sur lui-même.
  corrige: |
    On ramène l'équation $f(x, y) = (u, v)$ à une équation d'une seule variable, à laquelle on applique le point fixe ou la monotonie.

    **1.** $\det J_{f}(x, y) = \det\begin{pmatrix} 1 & a\cos y \\ b\cos x & 1 \end{pmatrix} = 1 - ab\cos x\cos y \geqslant 1 - |ab| > 0$. Résolvons $f(x, y) = (u, v)$ : $x = u - a\sin y$, et $y$ doit être un point fixe de $T(y) = v - b\sin(u - a\sin y)$. Comme $|T'(y)| = |ab\cos(u - a\sin y)\cos y| \leqslant |ab| < 1$, $T$ est contractante sur $\mathbb{R}$ complet et a un unique point fixe (chapitre 1, th. 13) : $f$ est bijective. Par la proposition 7 du cours, 
    $$\boxed{f \text{ est un } \mathcal{C}^{1}\text{-difféomorphisme de } \mathbb{R}^{2}}\text{.}$$

    **2.** Si $|ab| = 1$, $\det J_{f}$ s'annule là où $ab\cos x\cos y = 1$, par exemple en $(0, 0)$ si $ab = 1$, en $(0, \pi)$ si $ab = -1$ : f n'est pas un difféomorphisme (cours, prop. 6).

    $\triangleright$ *Bijectivité.* La fonction $D(y) = T(y) - y$ a pour dérivée $ab\cos(u - a\sin y)\cos y - 1 \leqslant 0$, qui ne s'annule qu'en des points isolés ; $D$ est donc strictement décroissante, et tend vers $\mp\infty$ en $\pm\infty$ puisque $T$ est bornée. Elle s'annule une seule fois : $f$ est bijective.

    $\triangleright$ *Continuité de la réciproque.* $\lVert f(p) - p \rVert \leqslant |a| + |b|$, donc l'image réciproque d'une partie bornée est bornée. Si $F$ est fermé et $f(p_{n}) \to w$ avec $p_{n} \in F$, la suite $(p_{n})$ est bornée, une sous-suite converge vers $p \in F$, et $f(p) = w$ : $f$ est fermée, donc $f^{-1}$ est continue. f est un homéomorphisme de R^2.
- id: "l3-cd-03-14"
  feuille: "f-l3-cd-03"
  numero: 14
  partie: "Inversion globale"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [inversion globale, difféomorphismes]
  noeuds: [gd-inversion-locale]
  notions: [diffeomorphisme]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Soit $f : \mathbb{R}^{n} \to \mathbb{R}^{n}$ de classe $\mathcal{C}^{1}$ telle que, pour une constante $k > 0$, 
    $$\lVert f(x) - f(y) \rVert \geqslant k\lVert x - y \rVert \qquad \text{pour tous } x, y \in \mathbb{R}^{n}.$$
     On va montrer que $f$ est un $\mathcal{C}^{1}$-difféomorphisme de $\mathbb{R}^{n}$ sur lui-même.

    **1.** Montrer que $f$ est injective et que $f(\mathbb{R}^{n})$ est fermé dans $\mathbb{R}^{n}$.

    **2.** Montrer que $\mathrm{d} f(x)$ est inversible pour tout $x \in \mathbb{R}^{n}$.

    **3.** En déduire que $f(\mathbb{R}^{n})$ est ouvert et fermé dans $\mathbb{R}^{n}$, et conclure.
  corrige: |
    C'est le même schéma qu'aux exercices 11 et 12, sous une hypothèse plus faible : $f$ éloigne les points, sans condition sur la direction.

    **1.** $f(x) = f(y)$ entraîne $k\lVert x - y \rVert \leqslant 0$ : $f$ est injective. Si $f(x_{n}) \to w$, l'inégalité montre que $(x_{n})$ est de Cauchy, donc converge vers $x$, et $f(x) = w$ : f(R^n) est fermé.

    **2.** Pour $h \in \mathbb{R}^{n}$ et $t \neq 0$, $\lVert f(x + th) - f(x) \rVert \geqslant k|t|\,\lVert h \rVert$ ; en divisant par $|t|$ et en faisant $t \to 0$, $\lVert \mathrm{d} f(x)\cdot h \rVert \geqslant k\lVert h \rVert$. Donc $\mathrm{d} f(x)$ est injective, inversible.

    **3.** Par le théorème d'inversion locale, $f(\mathbb{R}^{n})$ est ouvert ; il est fermé et non vide, donc égal à $\mathbb{R}^{n}$ connexe. $f$ est bijective, à différentielle partout inversible : par la proposition 7 du cours, 
    $$\boxed{f \text{ est un } \mathcal{C}^{1}\text{-difféomorphisme de } \mathbb{R}^{n} \text{ sur lui-même}}\text{.}$$
- id: "l3-cd-03-15"
  feuille: "f-l3-cd-03"
  numero: 15
  partie: "Inversion globale"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [inversion globale]
  noeuds: [gd-inversion-locale]
  notions: [diffeomorphisme]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Soit $G$ un ouvert borné de $\mathbb{R}^{n}$ et $f : \overline{G} \to \mathbb{R}^{n}$ une application continue sur $\overline{G}$, de classe $\mathcal{C}^{1}$ sur $G$, telle que $\mathrm{d} f(x)$ soit inversible pour tout $x \in G$. Montrer que $x \mapsto \lVert f(x) \rVert$ atteint son maximum sur $\overline{G}$ en un point du bord $\partial G = \overline{G} \setminus G$.
  corrige: |
    C'est un « principe du maximum » : une application ouverte ne peut pas atteindre un maximum de norme à l'intérieur.

    $\overline{G}$ est fermé et borné, donc compact, et $x \mapsto \lVert f(x) \rVert$, continue, y atteint son maximum $M$ en un point $x_{0}$ (chapitre 1, th. 3). Supposons $x_{0} \in G$. Par le théorème d'inversion locale, $f(G)$ contient une boule $B\big(f(x_{0}), \delta\big)$. Si $f(x_{0}) \neq 0$, le point $\big(1 + \frac{\delta}{2M}\big)f(x_{0})$ est dans cette boule et de norme $M + \frac{\delta}{2} > M$ ; si $f(x_{0}) = 0$, alors $M = 0$, et la boule $B(0, \delta) \subset f(G)$ contient des points de norme $\frac{\delta}{2} > M$. Dans les deux cas, c'est une contradiction. Le maximum est atteint sur G, qui est non vide puisque $G$ est un ouvert borné non vide de $\mathbb{R}^{n}$.
