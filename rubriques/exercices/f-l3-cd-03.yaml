  mots_cles: [inversion globale, difféomorphismes]
  noeuds: [gd-inversion-locale]
  notions: [diffeomorphisme, fonction-convexe]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Soit $E$ un espace vectoriel normé de dimension finie, $\Omega$ un ouvert convexe de $E$ et $f : \Omega \to E$ de classe $\mathcal{C}^{1}$ telle que $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} f(x)|\mkern-1.5mu|\mkern-1.5mu| \leqslant c$ pour tout $x \in \Omega$, où $0 \leqslant c < 1$. Montrer que $\mathrm{Id} - f$ est un $\mathcal{C}^{1}$-difféomorphisme de $\Omega$ sur son image.
  corrige: |
    On reconnaît une perturbation de l'identité (cours, prop. 4), qu'on traite par la proposition 7.

    $\triangleright$ *Différentielle inversible.* $\mathrm{d}(\mathrm{Id} - f)(x) = \mathrm{Id} - \mathrm{d} f(x)$ avec $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} f(x)|\mkern-1.5mu|\mkern-1.5mu| \leqslant c < 1$ : c'est un isomorphisme (série de Neumann, chapitre 1, th. 12).

    $\triangleright$ *Injectivité.* Sur le convexe $\Omega$, $f$ est $c$-lipschitzienne (chapitre 2, prop. 14), donc 
    $$\lVert (x - f(x)) - (y - f(y)) \rVert \geqslant \lVert x - y \rVert - c\lVert x - y \rVert = (1 - c)\lVert x - y \rVert.$$
     Par la proposition 7 du cours, 
    $$\boxed{\mathrm{Id} - f \text{ est un } \mathcal{C}^{1}\text{-difféomorphisme de } \Omega \text{ sur son image}}\text{,}$$
     qui est ouverte, et sa réciproque est $\frac{1}{1 - c}$-lipschitzienne.

    *Piège.* L'énoncé d'origine ne supposait $\Omega$ que connexe ; l'injectivité peut alors tomber en défaut. Sur l'anneau fendu $\Omega = \{re^{\mathrm{i}\theta} \,;\, 1 < r < 2,\ -\pi < \theta < \pi\}$, l'application $g(re^{\mathrm{i}\theta}) = re^{1{,}2\,\mathrm{i}\theta}$ s'écrit $\mathrm{Id} - f$ avec $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} f|\mkern-1.5mu|\mkern-1.5mu| \leqslant 0{,}76$ (calcul numérique), et elle n'est pas injective, puisque l'angle $1{,}2\,\theta$ parcourt un intervalle de longueur $2{,}4\pi > 2\pi$.
- id: "l3-cd-03-17"
  feuille: "f-l3-cd-03"
  numero: 17
  partie: "Fonctions implicites"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [fonctions implicites, espace tangent]
  noeuds: [gd-submersions, gd-tangent-sm]
  notions: [espace-tangent]
  page_enonce: 4
  page_corrige: 10
  enonce: |
    **1.** Montrer que la relation 
    $$(\ast) \qquad x^{3} + y^{3} - 2xy = 0$$
     définit implicitement, au voisinage de $1$, une unique fonction $\varphi$ telle que $\varphi(1) = 1$ et $x^{3} + \varphi(x)^{3} - 2x\varphi(x) = 0$.

    **2.** Calculer $\varphi'(1)$.

    **3.** Montrer que, si $P \neq (0, 0)$ est un point de la courbe $C$ d'équation $(\ast)$, alors, au voisinage de $P$, l'équation $(\ast)$ se résout en $x$ ou en $y$.

    **4.** Montrer que $C$ a une tangente en tout point $P \neq (0, 0)$.
  corrige: |
    On pose $F(x, y) = x^{3} + y^{3} - 2xy$, de gradient $\nabla F = (3x^{2} - 2y,\ 3y^{2} - 2x)$. La courbe $C$ est un folium de Descartes.

    **1.** $F(1, 1) = 0$ et $\dfrac{\partial F}{\partial y}(1, 1) = 1 \neq 0$. Par le théorème des fonctions implicites (cours, th. 2), il existe des intervalles ouverts $I \ni 1$, $J \ni 1$ et une unique $\varphi : I \to J$, de classe $\mathcal{C}^{1}$, telle que, pour $(x, y) \in I \times J$, F(x, y) = 0 y = (x).

    **2.** En dérivant $F\big(x, \varphi(x)\big) = 0$ : $\varphi'(1) = -\dfrac{\partial_{x}F(1, 1)}{\partial_{y}F(1, 1)} = -\dfrac{1}{1}$, soit '(1) = -1. La tangente en $(1, 1)$ est la droite $x + y = 2$.

    **3.** Le gradient s'annule si $3x^{2} = 2y$ et $3y^{2} = 2x$. Alors $x$, $y \geqslant 0$ et $9x^{4} = 4y^{2} = \frac{8x}{3}$, donc $x = 0$ ou $x = \frac{2}{3}$ ; le point $\big(\frac{2}{3}, \frac{2}{3}\big)$ n'est pas sur $C$ ($F = \frac{16}{27} - \frac{8}{9} \neq 0$). Le seul point de $C$ où le gradient s'annule est $(0, 0)$. En $P \neq (0, 0)$ sur $C$, l'une des dérivées partielles est non nulle : si $\partial_{y}F(P) \neq 0$, () se résout en y, sinon $\partial_{x}F(P) \neq 0$ et elle se résout en $x$.

    **4.** En $P \neq (0, 0)$, $P$ est un point régulier, et le théorème de l'hyperplan tangent (cours, th. 3) donne une tangente orthogonale à F(P). Les tangentes sont verticales là où $\partial_{y}F = 0$, en $\big(\frac{2}{3}2^{2/3}, \frac{2}{3}2^{1/3}\big) \approx (1{,}058 \,;\, 0{,}840)$, et horizontales au point symétrique.

    ![Figure](documents/figures/d7c12a994a2e0b34.svg)

    Le folium a une boucle dans le premier quadrant et deux branches infinies. À l'origine, deux branches se croisent : aucune description comme graphe n'est possible, ce qui explique l'exclusion du point $(0, 0)$. Au point où la tangente est verticale, la courbe n'est pas un graphe $y = \varphi(x)$, mais elle est un graphe $x = \psi(y)$.
- id: "l3-cd-03-18"
  feuille: "f-l3-cd-03"
  numero: 18
  partie: "Fonctions implicites"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [fonctions implicites]
  noeuds: [gd-submersions]
  notions: []
  page_enonce: 4
  page_corrige: 10
  enonce: |
    **1.** Montrer que la relation $e^{x - y} = 1 + x + y$ définit implicitement, au voisinage de $0$, une fonction $\varphi$ de classe $\mathcal{C}^{\infty}$ telle que $\varphi(0) = 0$ et $e^{x - \varphi(x)} = 1 + x + \varphi(x)$.

    **2.** Calculer $\varphi'(x)$ puis $\varphi''(x)$.

    **3.** En déduire que $\displaystyle\lim_{x \to 0}\frac{\varphi(x)}{x^{2}} = \frac{1}{4}$.
  corrige: |
    On pose $F(x, y) = e^{x - y} - 1 - x - y$, de classe $\mathcal{C}^{\infty}$.

    **1.** $F(0, 0) = 0$ et $\dfrac{\partial F}{\partial y} = -e^{x - y} - 1 < 0$ partout. Le théorème des fonctions implicites donne $\varphi$ de classe $\mathcal{C}^{1}$ au voisinage de $0$, avec $\varphi(0) = 0$. La formule $\varphi' = -\dfrac{\partial_{x}F}{\partial_{y}F}\big(x, \varphi(x)\big)$ exprime $\varphi'$ comme fonction $\mathcal{C}^{\infty}$ de $x$ et $\varphi(x)$ : si $\varphi$ est de classe $\mathcal{C}^{k}$, $\varphi'$ l'est aussi, donc $\varphi$ est de classe $\mathcal{C}^{k + 1}$, et par récurrence est de classe C^.

    **2.** Avec $u = x - \varphi(x)$, 
    $$\varphi'(x) = \frac{e^{u} - 1}{e^{u} + 1} = \boxed{\operatorname{th}\frac{x - \varphi(x)}{2}}, \qquad \boxed{\varphi''(x) = \frac{1}{2}\big(1 - \varphi'(x)^{2}\big)\big(1 - \varphi'(x)\big)},$$
     la seconde formule venant de $\operatorname{th}' = 1 - \operatorname{th}^{2}$ et de $u' = 1 - \varphi'$.

    **3.** $\varphi(0) = 0$, $\varphi'(0) = \operatorname{th} 0 = 0$ et $\varphi''(0) = \frac{1}{2}$. Par la formule de Taylor-Young à l'ordre $2$ (*Rappel.* ; chapitre 4, prop. 4), $\varphi(x) = \frac{1}{4}x^{2} + o(x^{2})$, d'où 
    $$\boxed{\lim_{x \to 0}\frac{\varphi(x)}{x^{2}} = \frac{1}{4}}\text{.}$$

    ![Figure](documents/figures/1f6dcf0ad3349902.svg)

    Dans les coordonnées $u = x - y$, $s = x + y$, la courbe est le graphe $s = e^{u} - 1$, tourné de $45^{\circ}$ : c'est ainsi qu'on l'a tracée. Près de l'origine, elle est tangente à l'axe des abscisses et suit la parabole $y = \frac{x^{2}}{4}$, dont elle s'écarte au troisième ordre ($\varphi = \frac{x^{2}}{4} - \frac{x^{3}}{24} + \cdots$, calcul sympy).
- id: "l3-cd-03-19"
  feuille: "f-l3-cd-03"
  numero: 19
  partie: "Fonctions implicites"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [fonctions implicites]
  noeuds: [gd-submersions]
  notions: []
  page_enonce: 4
  page_corrige: 11
  enonce: |
    Montrer que l'équation $\cos(x + y) = 1 + x + 2y$ définit implicitement, au voisinage de $(0, 0)$, une fonction $\varphi$ de classe $\mathcal{C}^{1}$ telle que $\varphi(0) = 0$ et $\cos\big(x + \varphi(x)\big) = 1 + x + 2\varphi(x)$. Calculer $\varphi'(0)$.
  corrige: |
    Avec $F(x, y) = \cos(x + y) - 1 - x - 2y$ : $F(0, 0) = 0$ et $\dfrac{\partial F}{\partial y} = -\sin(x + y) - 2$ vaut $-2 \neq 0$ en $(0, 0)$. Le théorème des fonctions implicites donne $\varphi$, et 
    $$\varphi'(0) = -\frac{\partial_{x}F(0, 0)}{\partial_{y}F(0, 0)} = -\frac{-\sin 0 - 1}{-2}, \qquad \boxed{\varphi'(0) = -\frac{1}{2}}.$$
     *Remarque.* $\partial_{y}F \leqslant -1$ partout : le théorème s'applique en tout point de la courbe, qui est donc globalement le graphe d'une fonction de $x$.
- id: "l3-cd-03-20"
  feuille: "f-l3-cd-03"
  numero: 20
  partie: "Fonctions implicites"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [fonctions implicites]
  noeuds: [gd-submersions]
  notions: []
  page_enonce: 5
  page_corrige: 11
  enonce: |
    **1.** Soit $F(x, y) = x^{2} + y^{2} - 1$. Démontrer que, pour $x$ suffisamment proche de $0$, il existe un unique $y = y(x) > 0$ tel que $F(x, y) = 0$. Vérifier, sans résolution explicite, que $y'(x) = -\dfrac{x}{y}$.

    **2.** Montrer que l'équation $e^{x} + e^{y} + x + y - 2 = 0$ définit, au voisinage de l'origine, une fonction implicite $\varphi$ de $x$, dont on calculera le développement limité à l'ordre $3$ en $0$.
  corrige: |
    **1.** $F(0, 1) = 0$ et $\dfrac{\partial F}{\partial y}(0, 1) = 2 \neq 0$ : il existe une unique fonction $y$ de classe $\mathcal{C}^{1}$, à valeurs près de $1$, donc positives, telle que $F(x, y(x)) = 0$. En dérivant $x^{2} + y(x)^{2} = 1$ : $2x + 2yy' = 0$, d'où y'(x) = -xy. On reconnaît $y = \sqrt{1 - x^{2}}$, mais le calcul n'en a pas besoin.

    **2.** $F(x, y) = e^{x} + e^{y} + x + y - 2$ vérifie $F(0, 0) = 0$ et $\dfrac{\partial F}{\partial y} = e^{y} + 1 > 0$ : $\varphi$ existe, de classe $\mathcal{C}^{\infty}$ (même argument qu'à l'exercice 18). Posons $\varphi(x) = a_{1}x + a_{2}x^{2} + a_{3}x^{3} + o(x^{3})$. Le développement 
    $$e^{x} + e^{\varphi} + x + \varphi - 2 = (2 + 2a_{1})x + \Big(\frac{1}{2} + \frac{a_{1}^{2}}{2} + 2a_{2}\Big)x^{2} + \Big(\frac{1}{6} + a_{1}a_{2} + \frac{a_{1}^{3}}{6} + 2a_{3}\Big)x^{3} + o(x^{3})$$
     doit être nul, d'où $a_{1} = -1$, $a_{2} = -\frac{1}{2}$, $a_{3} = -\frac{1}{4}$ (vérifié avec sympy) : 
    $$\boxed{\varphi(x) = -x - \frac{x^{2}}{2} - \frac{x^{3}}{4} + o(x^{3})}.$$
     *Vérification.* L'équation est symétrique en $x$ et $y$, donc $\varphi \circ \varphi = \mathrm{Id}$ ; le développement le confirme jusqu'à l'ordre $3$.

    ![Figure](documents/figures/300128c5db994b36.svg)

    La courbe est symétrique par rapport à la première bissectrice et décroissante : c'est le graphe d'une involution. Le développement limité d'ordre $3$ la suit de près autour de l'origine, alors que la tangente $y = -x$ s'en écarte dès qu'on s'éloigne de $0$.
- id: "l3-cd-03-21"
  feuille: "f-l3-cd-03"
  numero: 21
  partie: "Fonctions implicites"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fonctions implicites]
  noeuds: [gd-submersions]
  notions: []
  page_enonce: 5
  page_corrige: 12
  enonce: |
    Donner l'allure de $C = \{(x, y) \in \mathbb{R}^{2} \,;\, x^{4} + y^{3} - y^{2} + x - y = 0\}$ au voisinage des points $(0, 0)$ et $(-1, 0)$.
  corrige: |
    On calcule en chaque point le gradient de $F(x, y) = x^{4} + y^{3} - y^{2} + x - y$, puis la dérivée seconde de la fonction implicite pour connaître la position de la courbe par rapport à sa tangente.

    $\triangleright$ *En $(0, 0)$.* $\nabla F = (4x^{3} + 1, 3y^{2} - 2y - 1) = (1, -1)$ : la courbe est, au voisinage, le graphe d'une fonction $y = \varphi(x)$ avec $\varphi'(0) = 1$. En dérivant deux fois $F(x, \varphi(x)) = 0$, on obtient $\varphi''(0) = -2$ (sympy). 
    $$\boxed{\text{Tangente } y = x, \text{ courbe en dessous}}\text{.}$$

    $\triangleright$ *En $(-1, 0)$.* Ce point est sur $C$ ($1 + 0 - 0 - 1 - 0 = 0$), et $\nabla F(-1, 0) = (-3, -1)$ : $y = \psi(x)$ avec $\psi'(-1) = -3$ et $\psi''(-1) = -6$. 
    $$\boxed{\text{Tangente } y = -3(x + 1), \text{ courbe en dessous}}\text{.}$$

    ![Figure](documents/figures/ca0735b49a7dac85.svg)

    Aux deux points, le gradient a ses deux coordonnées non nulles : la courbe est localement un graphe aussi bien en $x$ qu'en $y$. Le tracé, obtenu numériquement, confirme les tangentes de pentes $1$ et $-3$, et la concavité des deux arcs.
- id: "l3-cd-03-22"
  feuille: "f-l3-cd-03"
  numero: 22
  partie: "Fonctions implicites"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonctions implicites]
  noeuds: [gd-submersions]
  notions: []
  page_enonce: 5
  page_corrige: 13
  enonce: |
    On considère le système de deux équations à trois inconnues 
    $$\left\{ \begin{array}{l} x^{2} + y^{2} - z^{2} = 1 \\ x^{3} - y^{3} + z^{3} = 1. \end{array} \right.$$

    **1.** Vérifier que $(2, -1, -2)$ est solution.

    **2.** Montrer qu'il existe deux fonctions $\varphi$ et $\psi$ de classe $\mathcal{C}^{1}$, définies au voisinage de $-2$, telles que, pour tout $z$ dans ce voisinage, $\big(\varphi(z), \psi(z), z\big)$ soit solution du système, avec $\varphi(-2) = 2$ et $\psi(-2) = -1$.

    **3.** Calculer $\varphi'(z)$ et $\psi'(z)$ en fonction de $\varphi(z)$, $\psi(z)$ et $z$, puis $\varphi'(-2)$ et $\psi'(-2)$.
  corrige: |
    On applique le théorème des fonctions implicites (cours, prop. 8) aux inconnues $(x, y)$, la variable $z$ jouant le rôle de paramètre.

    **1.** $4 + 1 - 4 = 1$ et $8 + 1 - 8 = 1$ : (2, -1, -2) est solution.

    **2.** Avec $f(x, y, z) = (x^{2} + y^{2} - z^{2} - 1, x^{3} - y^{3} + z^{3} - 1)$, le bloc jacobien en $(x, y)$ est 
    $$J_{(x, y)}f = \begin{pmatrix} 2x & 2y \\ 3x^{2} & -3y^{2} \end{pmatrix}, \qquad \det = -6xy(x + y),$$
     qui vaut $12 \neq 0$ en $(2, -1, -2)$. Le théorème donne 
    $$\boxed{\varphi, \psi \text{ de classe } \mathcal{C}^{1} \text{ au voisinage de } -2}\text{.}$$

    **3.** En dérivant le système : $2\varphi\varphi' + 2\psi\psi' = 2z$ et $3\varphi^{2}\varphi' - 3\psi^{2}\psi' = -3z^{2}$. En résolvant ce système linéaire, 
    $$\boxed{\varphi'(z) = \frac{z(\psi - z)}{\varphi(\varphi + \psi)}, \qquad \psi'(z) = \frac{z(\varphi + z)}{\psi(\varphi + \psi)}},$$
     d'où, en $z = -2$, '(-2) = -1, '(-2) = 0.
- id: "l3-cd-03-23"
  feuille: "f-l3-cd-03"
  numero: 23
  partie: "Fonctions implicites"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fonctions implicites]
  noeuds: [gd-submersions]
  notions: []
  page_enonce: 5
  page_corrige: 13
  enonce: |
    On considère le système de trois équations à quatre inconnues 
    $$\left\{ \begin{array}{l} x + y + z + t = 0 \\ x^{2} + y^{2} + z^{2} + t^{2} = 2 \\ x^{3} + y^{3} + z^{3} + t^{3} = 0. \end{array} \right.$$

    **1.** Vérifier que $(0, -1, 1, 0)$ est solution.

    **2.** Donner un énoncé précis du fait que, au voisinage de ce point, les solutions sont de la forme $\big(x(t), y(t), z(t), t\big)$, avec $x$, $y$, $z$ de classe $\mathcal{C}^{1}$.

    **3.** Calculer $x'(t)$, $y'(t)$, $z'(t)$ en fonction de $x(t)$, $y(t)$, $z(t)$ et $t$, puis la dérivée en $0$ de $t \mapsto \big(x(t), y(t), z(t)\big)$.
  corrige: |
    Même méthode, avec trois inconnues $(x, y, z)$ et le paramètre $t$.

    **1.** $0 - 1 + 1 + 0 = 0$, $0 + 1 + 1 + 0 = 2$, $0 - 1 + 1 + 0 = 0$ : (0, -1, 1, 0) est solution.

    **2.** Le bloc jacobien en $(x, y, z)$ est une matrice de Vandermonde : 
    $$\begin{pmatrix} 1 & 1 & 1 \\ 2x & 2y & 2z \\ 3x^{2} & 3y^{2} & 3z^{2} \end{pmatrix}, \qquad \det = 6(y - x)(z - x)(z - y),$$
     qui vaut $6 \cdot (-1) \cdot 1 \cdot 2 = -12 \neq 0$ au point considéré. *Énoncé précis* : il existe un intervalle ouvert $I \ni 0$, un voisinage ouvert $W$ de $(0, -1, 1)$ et une application $t \mapsto \big(x(t), y(t), z(t)\big)$ de classe $\mathcal{C}^{1}$ de $I$ dans $W$ telle que, pour $(t, (x, y, z)) \in I \times W$, $(x, y, z, t)$ est solution si et seulement si $(x, y, z) = \big(x(t), y(t), z(t)\big)$.

    **3.** En dérivant, $x' + y' + z' = -1$, $xx' + yy' + zz' = -t$, $x^{2}x' + y^{2}y' + z^{2}z' = -t^{2}$. Ce système de Vandermonde se résout par les formules de Lagrange : 
    $$\boxed{x' = -\frac{(t - y)(t - z)}{(x - y)(x - z)}, \quad y' = -\frac{(t - x)(t - z)}{(y - x)(y - z)}, \quad z' = -\frac{(t - x)(t - y)}{(z - x)(z - y)}}.$$
     En $t = 0$, $(x, y, z) = (0, -1, 1)$ : (x'(0), y'(0), z'(0)) = (-1, 0, 0) (vérifié avec sympy).
- id: "l3-cd-03-24"
  feuille: "f-l3-cd-03"
  numero: 24
  partie: "Fonctions implicites"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [fonctions implicites]
  noeuds: [gd-submersions]
  notions: []
  page_enonce: 5
  page_corrige: 13
  enonce: |
    Soit $f : \mathbb{R}^{3} \to \mathbb{R}^{2}$, $f(x, y, z) = (x^{2} - y^{2} + z^{2} - 1,\ xyz - 1)$, et $(x_{0}, y_{0}, z_{0}) \in \mathbb{R}^{3}$ tel que $f(x_{0}, y_{0}, z_{0}) = (0, 0)$. Montrer qu'il existe un intervalle ouvert $I$ contenant $x_{0}$ et une application $\varphi : I \to \mathbb{R}^{2}$ de classe $\mathcal{C}^{1}$ tels que $\varphi(x_{0}) = (y_{0}, z_{0})$ et $f\big(x, \varphi(x)\big) = (0, 0)$ pour tout $x \in I$.
  corrige: |
    Le bloc jacobien de $f$ en $(y, z)$ est 
    $$\begin{pmatrix} -2y & 2z \\ xz & xy \end{pmatrix}, \qquad \det = -2x(y^{2} + z^{2}).$$
     En un point solution, $x_{0}y_{0}z_{0} = 1$, donc $x_{0} \neq 0$ et $y_{0}^{2} + z_{0}^{2} > 0$ : le déterminant est non nul. Le théorème des fonctions implicites (cours, prop. 8) donne 
    $$\boxed{I \text{ et } \varphi \text{ de classe } \mathcal{C}^{1}}\text{,}$$
     et même l'unicité de $\varphi(x)$ au voisinage de $(y_{0}, z_{0})$.
- id: "l3-cd-03-25"
  feuille: "f-l3-cd-03"
  numero: 25
  partie: "Fonctions implicites"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [fonctions implicites]
  noeuds: [gd-submersions]
  notions: []
  page_enonce: 5
  page_corrige: 14
  enonce: |
    On considère le système 
    $$\left\{ \begin{array}{l} x^{2} + y^{2} - 2z^{2} = 0 \\ x^{2} + 2y^{2} + z^{2} = 4. \end{array} \right.$$
     Montrer que, pour $x$ proche de $0$, il existe des fonctions positives $y(x)$ et $z(x)$ de classe $\mathcal{C}^{1}$ telles que $\big(x, y(x), z(x)\big)$ soit solution du système. Déterminer $y'$ en fonction de $x$ et $y$, et $z'$ en fonction de $x$ et $z$.
  corrige: |
    En $x = 0$, le système donne $y^{2} = 2z^{2}$ et $2y^{2} + z^{2} = 4$, d'où $z^{2} = \frac{4}{5}$, $y^{2} = \frac{8}{5}$ ; on part de $(y_{0}, z_{0}) = \big(\frac{2\sqrt{2}}{\sqrt{5}}, \frac{2}{\sqrt{5}}\big)$. Le bloc jacobien en $(y, z)$ est $\begin{pmatrix} 2y & -4z \\ 4y & 2z \end{pmatrix}$, de déterminant $20yz > 0$ : le théorème des fonctions implicites donne $y(x)$, $z(x)$ de classe $\mathcal{C}^{1}$, à valeurs proches de $y_{0}$ et $z_{0}$, donc positives. En dérivant, $x + yy' - 2zz' = 0$ et $x + 2yy' + zz' = 0$, d'où 
    $$\boxed{y' = -\frac{3x}{5y}, \qquad z' = \frac{x}{5z}}.$$
     En intégrant, $5y^{2} + 3x^{2}$ et $5z^{2} - x^{2}$ sont constants, ce que l'on retrouve directement en combinant les deux équations.
- id: "l3-cd-03-26"
  feuille: "f-l3-cd-03"
  numero: 26
  partie: "Fonctions implicites"
  etoiles: 2
