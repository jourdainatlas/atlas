- id: "ma-07-01"
  feuille: "f-ma-07"
  numero: 1
  partie: "Nombres réels et borne supérieure"
  etoiles: 1
  types: [Calcul]
  mots_cles: [borne supérieure, bornes supérieure et inférieure]
  noeuds: [od-sup-propriete, ar-corps]
  notions: [borne-superieure]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Pour chacune des parties suivantes de $\mathbb{R}$, déterminer, s'ils existent, la borne supérieure, la borne inférieure, le plus grand et le plus petit élément.

    **(a)** $A = \big\{\frac{1}{n} \mid n \in \mathbb{N}^{*}\big\}$

    **(b)** $B = \big\{(-1)^{n} + \frac{1}{n} \mid n \in \mathbb{N}^{*}\big\}$

    **(c)** $C = \{x \in \mathbb{Q} \mid x^{2} < 3\}$

    **(d)** $D = \big\{\frac{1}{p} + \frac{1}{q} \mid (p, q) \in (\mathbb{N}^{*})^{2}\big\}$

    **(e)** $E = \{x \in \mathbb{R} \mid x^{2} - 3x + 2 < 0\}$

    **(f)** $F = \big\{(-1)^{n}\frac{n}{n + 1} \mid n \in \mathbb{N}\big\}$
  corrige: |
    Dans chaque cas, on exhibe un majorant, puis une suite d'éléments de la partie qui tend vers lui : d'après la proposition 13 du cours, c'est la borne supérieure. Elle est un maximum si et seulement si elle appartient à la partie.

    **(a)** On a $\frac{1}{n} \leqslant 1$, avec égalité pour $n = 1$, et $\frac{1}{n} > 0$, avec $\frac{1}{n} \to 0$. 
    $$\boxed{\sup A = \max A = 1 \qquad \inf A = 0, \ \text{pas de minimum}}$$
     **(b)** Pour $n$ pair, $(-1)^{n} + \frac{1}{n} = 1 + \frac{1}{n} \leqslant \frac{3}{2}$, avec égalité pour $n = 2$ ; pour $n$ impair, $-1 + \frac{1}{n} \leqslant 0$. Tous les éléments sont strictement supérieurs à $-1$, et $-1 + \frac{1}{2k + 1} \to -1$. 
    $$\boxed{\sup B = \max B = \frac{3}{2} \qquad \inf B = -1, \ \text{pas de minimum}}$$
     **(c)** Si $x^{2} < 3$, alors $|x| < \sqrt{3}$. Les valeurs décimales approchées par défaut $d_{n}$ de $\sqrt{3}$ sont des rationnels positifs, distincts de $\sqrt{3}$ qui est irrationnel (même démonstration que pour $\sqrt{2}$), donc $d_{n}^{2} < 3$ et $d_{n} \in C$ ; et $d_{n} \to \sqrt{3}$. Par symétrie de $C$, on traite la borne inférieure. 
    $$\boxed{\sup C = \sqrt{3}, \quad \inf C = -\sqrt{3}, \ \text{ni maximum ni minimum}}$$
     **(d)** On a $0 < \frac{1}{p} + \frac{1}{q} \leqslant 2$, avec égalité pour $p = q = 1$, et $\frac{2}{n} \in D$ tend vers $0$. 
    $$\boxed{\sup D = \max D = 2 \qquad \inf D = 0, \ \text{pas de minimum}}$$
     **(e)** Le trinôme $x^{2} - 3x + 2 = (x - 1)(x - 2)$ est strictement négatif exactement entre ses racines : $E = \,]1\,,2[$. 
    $$\boxed{\sup E = 2, \quad \inf E = 1, \ \text{ni maximum ni minimum}}$$
     **(f)** Les éléments d'indice pair valent $\frac{n}{n + 1} \in [0\,,1[$ et tendent vers $1$ ; ceux d'indice impair valent $-\frac{n}{n + 1} \in \,]-1\,,0[$ et tendent vers $-1$. 
    $$\boxed{\sup F = 1, \quad \inf F = -1, \ \text{ni maximum ni minimum}}$$

    *Piège :* en (c), il ne suffit pas de dire « $\sqrt{3}$ est un majorant » ; c'est la suite $(d_{n})$ d'éléments de $C$ qui prouve qu'aucun majorant plus petit n'existe.
- id: "ma-07-02"
  feuille: "f-ma-07"
  numero: 2
  partie: "Nombres réels et borne supérieure"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [borne supérieure, "partie entière et propriété d'Archimède"]
  noeuds: [od-sup-propriete, ar-corps, ar-archimede]
  notions: [borne-superieure, archimedien]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    *Partie entière.* Démontrer les propriétés suivantes, pour tous réels $x$ et $y$, tout entier relatif $m$ et tout entier $n \geqslant 1$.

    **(a)** $\lfloor x + m \rfloor = \lfloor x \rfloor + m$, et la fonction $x \mapsto x - \lfloor x \rfloor$ est $1$-périodique. Tracer sa courbe sur $[-2\,,2]$.

    **(b)** $\lfloor x \rfloor + \lfloor y \rfloor \leqslant \lfloor x + y \rfloor \leqslant \lfloor x \rfloor + \lfloor y \rfloor + 1$, et les deux cas d'égalité sont possibles.

    **(c)** $\lfloor x \rfloor + \lfloor -x \rfloor$ vaut $0$ si $x$ est entier, et $-1$ sinon.

    **(d)** $\Big\lfloor \dfrac{\lfloor nx \rfloor}{n} \Big\rfloor = \lfloor x \rfloor$.

    **(e)** *Identité de Hermite :* $\lfloor x \rfloor + \big\lfloor x + \frac{1}{2} \big\rfloor = \lfloor 2x \rfloor$. On pourra distinguer selon que $x - \lfloor x \rfloor$ est inférieur ou supérieur à $\frac{1}{2}$.
  corrige: |
    On utilise la caractérisation de $\lfloor x \rfloor$ comme l'unique entier $k$ tel que $k \leqslant x < k + 1$, et sa conséquence : $\lfloor x \rfloor$ est le plus grand entier inférieur ou égal à $x$.

    **(a)** En ajoutant $m$ à l'encadrement $\lfloor x \rfloor \leqslant x < \lfloor x \rfloor + 1$, on obtient $\lfloor x \rfloor + m \leqslant x + m < \lfloor x \rfloor + m + 1$, et $\lfloor x \rfloor + m$ est entier. 
    $$\boxed{\lfloor x + m \rfloor = \lfloor x \rfloor + m}$$
     Avec $m = 1$, la fonction $\varphi : x \mapsto x - \lfloor x \rfloor$ vérifie $\varphi(x + 1) = \varphi(x)$ : elle est $1$-périodique, à valeurs dans $[0\,,1[$, et vaut $x$ sur $[0\,,1[$.

    ![Figure](documents/figures/9a26469bc743cd16.svg)

    La courbe est une « dent de scie » : chaque segment contient son extrémité gauche, sur l'axe, mais pas son extrémité droite, à hauteur $1$.

    **(b)** L'entier $\lfloor x \rfloor + \lfloor y \rfloor$ est inférieur ou égal à $x + y$, donc à $\lfloor x + y \rfloor$, qui est le plus grand entier ayant cette propriété. Par ailleurs, $x + y < \lfloor x \rfloor + \lfloor y \rfloor + 2$, donc l'entier $\lfloor x + y \rfloor$ est au plus $\lfloor x \rfloor + \lfloor y \rfloor + 1$. 
    $$\boxed{\lfloor x \rfloor + \lfloor y \rfloor \leqslant \lfloor x + y \rfloor \leqslant \lfloor x \rfloor + \lfloor y \rfloor + 1}$$
     Le cas $x = y = 0$ donne l'égalité à gauche, et le cas $x = y = \frac{1}{2}$ l'égalité à droite, puisqu'alors $\lfloor x + y \rfloor = 1$.

    **(c)** Si $x \in \mathbb{Z}$, on a $\lfloor x \rfloor + \lfloor -x \rfloor = x - x = 0$. Sinon, $\lfloor x \rfloor < x < \lfloor x \rfloor + 1$, d'où $-\lfloor x \rfloor - 1 < -x < -\lfloor x \rfloor$, et $\lfloor -x \rfloor = -\lfloor x \rfloor - 1$. 
    $$\boxed{\lfloor x \rfloor + \lfloor -x \rfloor = 0 \text{ si } x \in \mathbb{Z}, \quad -1 \text{ sinon}}$$
     **(d)** Notons $k = \lfloor x \rfloor$. Alors $kn \leqslant nx < kn + n$, et comme $kn$ et $kn + n$ sont entiers, 
    $$kn \leqslant \lfloor nx \rfloor \leqslant kn + n - 1.$$
     En divisant par $n$ : 
    $$k \leqslant \frac{\lfloor nx \rfloor}{n} < k + 1, \qquad\text{donc}\qquad \boxed{\Big\lfloor \frac{\lfloor nx \rfloor}{n} \Big\rfloor = \lfloor x \rfloor}.$$
     **(e)** Écrivons $x = k + t$, avec $k = \lfloor x \rfloor$ et $t \in [0\,,1[$. Si $t < \frac{1}{2}$, alors $\lfloor x + \frac{1}{2} \rfloor = k$ et $\lfloor 2x \rfloor = 2k + \lfloor 2t \rfloor = 2k$. Si $t \geqslant \frac{1}{2}$, alors $\lfloor x + \frac{1}{2} \rfloor = k + 1$ et $\lfloor 2x \rfloor = 2k + 1$. Dans les deux cas : 
    $$\boxed{\lfloor x \rfloor + \Big\lfloor x + \frac{1}{2} \Big\rfloor = \lfloor 2x \rfloor}$$
- id: "ma-07-03"
  feuille: "f-ma-07"
  numero: 3
  partie: "Nombres réels et borne supérieure"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [borne supérieure, bornes supérieure et inférieure]
  noeuds: [od-sup-propriete, ar-corps]
  notions: [borne-superieure]
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Soit $A$ et $B$ deux parties non vides et bornées de $\mathbb{R}$, et $\lambda > 0$. On note $A + B = \{a + b \mid a \in A,\ b \in B\}$, $\lambda A = \{\lambda a \mid a \in A\}$ et $-A = \{-a \mid a \in A\}$. Démontrer les égalités et inégalités suivantes.

    **(a)** Si $A \subset B$, alors $\sup A \leqslant \sup B$ et $\inf A \geqslant \inf B$.

    **(b)** $\sup(A \cup B) = \max(\sup A, \sup B)$.

    **(c)** $\sup(A + B) = \sup A + \sup B$.

    **(d)** $\sup(\lambda A) = \lambda\sup A$ et $\sup(-A) = -\inf A$.

    Que dire de $\sup(A \cap B)$ ? Et de $\sup\{ab \mid a \in A,\ b \in B\}$, si l'on ne suppose plus les éléments positifs ?
  corrige: |
    Toutes les bornes existent d'après le théorème 1, les parties considérées étant non vides et bornées. On utilise la caractérisation par $\varepsilon$ (proposition 2).

    **(a)** Le réel $\sup B$ majore $B$, donc $A$ : il est supérieur au plus petit majorant de $A$. De même, $\inf B$ minore $A$. 
    $$\boxed{\sup A \leqslant \sup B, \qquad \inf A \geqslant \inf B}$$
     **(b)** Le réel $M = \max(\sup A, \sup B)$ majore $A \cup B$. Réciproquement, un majorant de $A \cup B$ majore $A$ et $B$, donc il est supérieur à $\sup A$ et à $\sup B$, donc à $M$. 
    $$\boxed{\sup(A \cup B) = \max(\sup A, \sup B)}$$
     **(c)** Le réel $S = \sup A + \sup B$ majore $A + B$. Soit $\varepsilon > 0$ ; il existe $a \in A$ et $b \in B$ tels que $a > \sup A - \frac{\varepsilon}{2}$ et $b > \sup B - \frac{\varepsilon}{2}$, d'où $a + b > S - \varepsilon$. 
    $$\boxed{\sup(A + B) = \sup A + \sup B}$$
     **(d)** Le réel $\lambda\sup A$ majore $\lambda A$ puisque $\lambda > 0$ ; et si $a > \sup A - \frac{\varepsilon}{\lambda}$, alors $\lambda a > \lambda\sup A - \varepsilon$. Enfin, $m$ minore $A$ si et seulement si $-m$ majore $-A$ : le plus petit majorant de $-A$ est l'opposé du plus grand minorant de $A$. 
    $$\boxed{\sup(\lambda A) = \lambda\sup A, \qquad \sup(-A) = -\inf A}$$
     L'intersection $A \cap B$ peut être vide ; lorsqu'elle ne l'est pas, (a) donne $\sup(A \cap B) \leqslant \min(\sup A, \sup B)$, et l'inégalité peut être stricte : avec $A = \{0, 2\}$ et $B = \{0, 1\}$, on a $\sup(A \cap B) = 0 < 1$. Pour les produits, avec $A = B = \{-2, 1\}$, on obtient $\{ab\} = \{4, -2, 1\}$, de borne supérieure $4$, alors que $\sup A \cdot \sup B = 1$ : la formule ne vaut que pour des parties de réels positifs.
- id: "ma-07-04"
  feuille: "f-ma-07"
  numero: 4
  partie: "Nombres réels et borne supérieure"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [borne supérieure, densité]
  noeuds: [od-sup-propriete, ar-corps, tr-dense]
  notions: [borne-superieure, partie-dense]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Soit $r$ un rationnel non nul et $x$ un irrationnel. Montrer que $r + x$ et $rx$ sont irrationnels.

    **2.** La somme et le produit de deux irrationnels sont-ils toujours irrationnels ?

    **3.** En adaptant la démonstration du chapitre 1 pour $\sqrt{2}$, montrer que $\sqrt{6}$ est irrationnel, puis que $\sqrt{2} + \sqrt{3}$ l'est.

    **4.** Montrer que $\dfrac{\ln 2}{\ln 3}$ est irrationnel.
  corrige: |
    **1.** Si $r + x$ était rationnel, $x = (r + x) - r$ le serait ; si $rx$ l'était, $x = \frac{rx}{r}$ aussi, puisque $r \neq 0$. $\boxed{r + x \text{ et } rx \text{ sont irrationnels}}$

    **2.** Non : $\sqrt{2} + (-\sqrt{2}) = 0$ et $\sqrt{2} \times \sqrt{2} = 2$ sont rationnels, alors que $\sqrt{2} + \sqrt{2} = 2\sqrt{2}$ est irrationnel d'après la question 1. 
    $$\boxed{\text{la somme et le produit de deux irrationnels peuvent être rationnels ou non}}$$
     **3.** Supposons $\sqrt{6} = \frac{p}{q}$, fraction irréductible. Alors $p^{2} = 6q^{2}$ est pair, donc $p$ est pair : $p = 2p'$, et $3q^{2} = 2p'^{2}$. Ainsi $3q^{2}$ est pair, donc $q^{2}$ l'est, et $q$ aussi : $p$ et $q$ ont le facteur commun $2$, ce qui est absurde. Si maintenant $\sqrt{2} + \sqrt{3} = r$ était rationnel, on aurait $r^{2} = 5 + 2\sqrt{6}$, d'où $\sqrt{6} = \frac{r^{2} - 5}{2} \in \mathbb{Q}$. 
    $$\boxed{\sqrt{6} \text{ et } \sqrt{2} + \sqrt{3} \text{ sont irrationnels}}$$
     **4.** Le quotient est strictement positif. S'il valait $\frac{p}{q}$, avec $p$ et $q$ entiers naturels non nuls, on aurait $q\ln 2 = p\ln 3$, soit $2^{q} = 3^{p}$ en composant par l'exponentielle : un nombre pair égal à un nombre impair. 
    $$\boxed{\frac{\ln 2}{\ln 3} \notin \mathbb{Q}}$$
- id: "ma-07-05"
  feuille: "f-ma-07"
  numero: 5
  partie: "Nombres réels et borne supérieure"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [borne supérieure, bornes supérieure et inférieure, valeur absolue]
  noeuds: [od-sup-propriete, ar-corps]
  notions: [borne-superieure]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $X$ et $Y$ deux ensembles non vides et $f : X \times Y \to \mathbb{R}$ une fonction bornée.

    **1.** Montrer que $\displaystyle\sup_{x \in X}\Big(\sup_{y \in Y} f(x, y)\Big) = \sup_{y \in Y}\Big(\sup_{x \in X} f(x, y)\Big) = \sup_{(x, y) \in X \times Y} f(x, y)$.

    **2.** Montrer que $\displaystyle\sup_{x \in X}\Big(\inf_{y \in Y} f(x, y)\Big) \leqslant \inf_{y \in Y}\Big(\sup_{x \in X} f(x, y)\Big)$.

    **3.** Avec $X = Y = \{0, 1\}$ et $f(x, y) = |x - y|$, montrer que l'inégalité précédente peut être stricte.
  corrige: |
    Toutes les bornes existent, puisque $f$ est bornée. Notons $S = \sup_{(x, y)} f(x, y)$.

    **1.** Pour tout $x$, le réel $S$ majore $\{f(x, y) \mid y \in Y\}$, donc $\sup_{y} f(x, y) \leqslant S$, puis $\sup_{x}\sup_{y} f \leqslant S$. Réciproquement, pour tout couple $(x, y)$, on a $f(x, y) \leqslant \sup_{y'} f(x, y') \leqslant \sup_{x'}\sup_{y'} f(x', y')$ : ce dernier réel majore $f$, donc il est supérieur à $S$. L'autre ordre se traite de même. 
    $$\boxed{\sup_{x}\sup_{y} f(x, y) = \sup_{y}\sup_{x} f(x, y) = \sup_{(x, y)} f(x, y)}$$
     **2.** Pour tous $x$ et $y$, on a $\inf_{y'} f(x, y') \leqslant f(x, y) \leqslant \sup_{x'} f(x', y)$. Fixons $y$ : le réel $\sup_{x'} f(x', y)$ majore donc tous les $\inf_{y'} f(x, y')$, d'où $\sup_{x}\inf_{y'} f \leqslant \sup_{x'} f(x', y)$. Le membre de gauche minore ainsi tous ces réels, donc leur borne inférieure. 
    $$\boxed{\sup_{x}\inf_{y} f(x, y) \leqslant \inf_{y}\sup_{x} f(x, y)}$$
     **3.** Pour tout $x \in \{0, 1\}$, $\inf_{y} |x - y| = 0$ (prendre $y = x$) ; pour tout $y$, $\sup_{x} |x - y| = 1$ (prendre $x = 1 - y$). 
    $$\boxed{\sup_{x}\inf_{y} f = 0 < 1 = \inf_{y}\sup_{x} f}$$

    *À retenir :* on peut toujours échanger deux $\sup$, ou deux $\inf$, mais pas un $\sup$ et un $\inf$. C'est la même règle que pour les quantificateurs au chapitre 1 : on échange deux $\forall$, mais pas un $\forall$ et un $\exists$.
- id: "ma-07-06"
  feuille: "f-ma-07"
  numero: 6
  partie: "Nombres réels et borne supérieure"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [borne supérieure, densité]
  noeuds: [od-sup-propriete, ar-corps, tr-dense]
  notions: [borne-superieure, partie-dense]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    On note $G = \{p + q\sqrt{2} \mid (p, q) \in \mathbb{Z}^{2}\}$ et $u = \sqrt{2} - 1$.

    **1.** Montrer que $G$ est stable par addition et par multiplication, et que $u \in \big]0\,,\frac{1}{2}\big[$.

    **2.** En déduire que $u^{n} \in G$ pour tout $n \in \mathbb{N}$, et que $u^{n} \to 0$.

    **3.** Soit $a < b$ deux réels. En choisissant $n$ tel que $u^{n} < b - a$, puis un multiple entier de $u^{n}$, montrer que $]a\,,b[$ contient un élément de $G$. Conclure que $G$ est dense dans $\mathbb{R}$.

    **4.** Les éléments de $G$ sont-ils tous irrationnels ? L'ensemble $G \setminus \mathbb{Q}$ est-il dense dans $\mathbb{R}$ ?
  corrige: |
    **1.** Pour $g = p + q\sqrt{2}$ et $g' = p' + q'\sqrt{2}$ dans $G$, on a $g + g' = (p + p') + (q + q')\sqrt{2}$ et $gg' = (pp' + 2qq') + (pq' + p'q)\sqrt{2}$, qui sont dans $G$ ; de même $-g \in G$. Enfin $1{,}4 < \sqrt{2} < 1{,}5$, puisque $1{,}96 < 2 < 2{,}25$. 
    $$\boxed{G \text{ est stable par } +, \times \text{ et passage à l'opposé ; } \ 0{,}4 < u < 0{,}5}$$
     **2.** Par récurrence, $u^{0} = 1 \in G$ et $u^{n+1} = u \cdot u^{n} \in G$. De plus $0 < u^{n} < \big(\frac{1}{2}\big)^{n}$, qui tend vers $0$ (proposition 9). 
    $$\boxed{u^{n} \in G \quad\text{et}\quad u^{n} \to 0}$$
     **3.** Soit $n$ tel que $u^{n} < b - a$, et $k = \lfloor a / u^{n} \rfloor + 1 \in \mathbb{Z}$. Alors $k - 1 \leqslant \frac{a}{u^{n}} < k$, d'où 
    $$a < k\,u^{n} \leqslant a + u^{n} < b,$$
     et $k\,u^{n} \in G$, comme somme de $|k|$ éléments égaux à $\pm u^{n}$. $\boxed{G \text{ est dense dans } \mathbb{R}}$

    **4.** Un élément $p + q\sqrt{2}$ est rationnel si et seulement si $q = 0$, d'après l'exercice 4 : les éléments rationnels de $G$ sont les entiers. En appliquant la question 3 à des sous-intervalles disjoints de $]a\,,b[$, on trouve une infinité d'éléments de $G$ dans $]a\,,b[$, alors que cet intervalle ne contient qu'un nombre fini d'entiers. 
    $$\boxed{G \setminus \mathbb{Q} \text{ est dense dans } \mathbb{R}}$$
     L'exercice 50 généralisera ce résultat à $\mathbb{Z} + \alpha\mathbb{Z}$ pour tout irrationnel $\alpha$, par une méthode différente.
- id: "ma-07-07"
  feuille: "f-ma-07"
  numero: 7
  partie: "Nombres réels et borne supérieure"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [borne supérieure, bornes supérieure et inférieure, densité, limites de suites, suites monotones]
  noeuds: [od-sup-propriete, ar-corps, tr-dense, su-convergence, su-monotone]
  notions: [borne-superieure, partie-dense, limite-suite]
  page_enonce: 2
  page_corrige: 5
  enonce: |
    **1.** Déterminer, en calculant des carrés, les valeurs décimales approchées par défaut de $\sqrt{2}$ à la précision $10^{-n}$ pour $0 \leqslant n \leqslant 4$.

    **2.** Soit $x$ un réel. Montrer qu'il existe une suite strictement croissante de rationnels qui converge vers $x$, et une suite strictement décroissante d'irrationnels qui converge vers $x$.

    **3.** Soit $A = \{r \in \mathbb{Q} \mid r > 0 \text{ et } r^{2} < 2\}$. Montrer que $\sup A = \sqrt{2}$ à l'aide de la caractérisation séquentielle de la borne supérieure.
  corrige: |
    **1.** On encadre $2$ entre deux carrés consécutifs à chaque précision : 
    $$1{,}4^{2} = 1{,}96, \quad 1{,}41^{2} = 1{,}9881, \quad 1{,}414^{2} = 1{,}999\,396, \quad 1{,}4142^{2} = 1{,}999\,961\,64,$$

    $$1{,}5^{2} = 2{,}25, \quad 1{,}42^{2} = 2{,}0164, \quad 1{,}415^{2} = 2{,}002\,225, \quad 1{,}4143^{2} = 2{,}000\,244\,49,$$
     et $1 \leqslant 2 < 4$ au rang $0$. 
    $$\boxed{d_{0} = 1, \quad d_{1} = 1{,}4, \quad d_{2} = 1{,}41, \quad d_{3} = 1{,}414, \quad d_{4} = 1{,}4142}$$
     **2.** On construit $(r_{n})$ par récurrence, à l'aide de la densité de $\mathbb{Q}$ (théorème 2) : on choisit un rationnel $r_{0}$ dans $]x - 1\,,x[$, puis, une fois $r_{n}$ construit, un rationnel $r_{n+1}$ appartenant à l'intervalle non vide 
    $$\Big]\max\Big(r_{n}, x - \frac{1}{n + 2}\Big)\,,x\Big[.$$
     La suite est strictement croissante, et $x - \frac{1}{n + 1} < r_{n} < x$ donne $r_{n} \to x$ par encadrement. On procède de même au-dessus de $x$ avec des irrationnels, denses eux aussi. 
    $$\boxed{\text{tout réel est limite d'une suite strictement monotone de rationnels ou d'irrationnels}}$$
     **3.** Si $r \in A$, alors $r^{2} < 2$ et $r > 0$, donc $r < \sqrt{2}$ : $\sqrt{2}$ majore $A$. Les $d_{n}$ sont des rationnels positifs, inférieurs ou égaux à $\sqrt{2}$ et distincts de lui, donc $d_{n}^{2} < 2$ et $d_{n} \in A$ ; et $d_{n} \to \sqrt{2}$. La proposition 13 donne : 
    $$\boxed{\sup A = \sqrt{2}}$$
     On retrouve la coupure de l'introduction du cours : la classe $A$ n'a pas de plus grand élément, et sa borne supérieure n'est pas rationnelle.
- id: "ma-07-08"
  feuille: "f-ma-07"
  numero: 8
  partie: "Limites : définitions et calculs"
  etoiles: 1
  types: [Calcul]
  mots_cles: [limites de suites, "partie entière et propriété d'Archimède"]
  noeuds: [su-convergence, su-operations, ar-archimede]
  notions: [suite, limite-suite, archimedien]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Étudier la convergence des suites dont les termes généraux sont les suivants, et donner leur limite éventuelle.

    **(a)** $\dfrac{n^{2} + 3n}{2n^{2} - 1}$

    **(b)** $\sqrt{n + 1} - \sqrt{n}$

    **(c)** $\sqrt{n^{2} + n} - n$

    **(d)** $\dfrac{3^{n} + (-2)^{n}}{3^{n} - (-2)^{n}}$

    **(e)** $\dfrac{n + (-1)^{n}}{n^{2} + 1}$

    **(f)** $\dfrac{\ln n + 1}{n + 4}$

    **(g)** $\dfrac{\mathrm{e}^{n} + n^{2}}{n^{4} + 1}$

    **(h)** $\dfrac{\lfloor \sqrt{n} \rfloor}{n}$

    **(i)** $\sqrt{n^{2} + n} - \sqrt{n^{2} - n}$

    **(j)** $\dfrac{\cos n}{n + 1}$

    **(k)** $\dfrac{(-1)^{n} + n}{(-1)^{n} + 2}$

    **(l)** $\dfrac{n^{3}\,2^{n} + 3^{n}}{n!}$
  corrige: |
    On factorise le terme prépondérant, on multiplie par la quantité conjuguée pour les différences de racines, et l'on utilise les croissances comparées (théorème 7). On utilise plusieurs fois le fait que $\sqrt{1 + h_{n}} \to 1$ lorsque $h_{n} \to 0$ avec $h_{n} \geqslant -1$, qui découle de $\big|\sqrt{1 + h} - 1\big| = \frac{|h|}{\sqrt{1 + h} + 1} \leqslant |h|$.

    • **(a)** $\dfrac{n^{2} + 3n}{2n^{2} - 1} = \dfrac{1 + 3/n}{2 - 1/n^{2}} \to \boxed{\dfrac{1}{2}}$

    • **(b)** $\sqrt{n + 1} - \sqrt{n} = \dfrac{1}{\sqrt{n + 1} + \sqrt{n}} \to \boxed{0}$

    • **(c)** $\sqrt{n^{2} + n} - n = \dfrac{n}{\sqrt{n^{2} + n} + n} = \dfrac{1}{\sqrt{1 + 1/n} + 1} \to \boxed{\dfrac{1}{2}}$

    • **(d)** $\dfrac{3^{n} + (-2)^{n}}{3^{n} - (-2)^{n}} = \dfrac{1 + (-2/3)^{n}}{1 - (-2/3)^{n}} \to \boxed{1}$, puisque $\big|{-\frac{2}{3}}\big| < 1$.

    • **(e)** $\Big|\dfrac{n + (-1)^{n}}{n^{2} + 1}\Big| \leqslant \dfrac{n + 1}{n^{2}} \leqslant \dfrac{2}{n}$ pour $n \geqslant 1$, d'où la limite $\boxed{0}$.

    • **(f)** $\dfrac{\ln n + 1}{n + 4} = \dfrac{\frac{\ln n}{n} + \frac{1}{n}}{1 + \frac{4}{n}} \to \boxed{0}$, par le théorème 7.

    • **(g)** Pour $n \geqslant 1$, $n^{4} + 1 \leqslant 2n^{4}$, donc $\dfrac{\mathrm{e}^{n} + n^{2}}{n^{4} + 1} \geqslant \dfrac{1}{2} \cdot \dfrac{\mathrm{e}^{n}}{n^{4}}$, qui tend vers $+\infty$ comme inverse d'une suite positive de limite nulle : limite $\boxed{+\infty}$.

    • **(h)** $0 \leqslant \dfrac{\lfloor \sqrt{n} \rfloor}{n} \leqslant \dfrac{\sqrt{n}}{n} = \dfrac{1}{\sqrt{n}}$, d'où la limite $\boxed{0}$.

    • **(i)** $\sqrt{n^{2} + n} - \sqrt{n^{2} - n} = \dfrac{2n}{\sqrt{n^{2} + n} + \sqrt{n^{2} - n}} = \dfrac{2}{\sqrt{1 + 1/n} + \sqrt{1 - 1/n}} \to \boxed{1}$

    • **(j)** $\Big|\dfrac{\cos n}{n + 1}\Big| \leqslant \dfrac{1}{n + 1}$, d'où la limite $\boxed{0}$ (proposition 8).

    • **(k)** Le numérateur est au moins $n - 1$ et le dénominateur au plus $3$ : $u_{n} \geqslant \dfrac{n - 1}{3}$, limite $\boxed{+\infty}$.

    • **(l)** $\dfrac{n^{3}\,2^{n}}{n!} = \dfrac{n^{3}}{(3/2)^{n}} \cdot \dfrac{3^{n}}{n!}$, produit de deux suites de limite nulle (théorème 7), et $\dfrac{3^{n}}{n!} \to 0$ : limite $\boxed{0}$.

    *Piège :* en (k), le quotient de deux suites qui oscillent n'a pas de raison d'osciller ; on ne conclut à la divergence qu'après avoir comparé les termes.
- id: "ma-07-09"
  feuille: "f-ma-07"
  numero: 9
  partie: "Limites : définitions et calculs"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [limites de suites, bornes supérieure et inférieure, majorants, limites infinies]
  noeuds: [su-convergence, su-operations, od-sup-propriete, od-majorants, su-infinies]
  notions: [suite, limite-suite, borne-superieure, majorant, limite-infinie]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    *Retour à la définition.*

    **1.** Montrer, en revenant à la définition, que $\dfrac{3n - 1}{n + 2} \to 3$ : pour $\varepsilon > 0$, donner explicitement un rang $N$ convenable. Que vaut-il pour $\varepsilon = 10^{-2}$ ?

    **2.** Montrer de même que $\dfrac{n^{2}}{n + 1} \to +\infty$.

    **3.** Écrire la négation de « $u_{n} \to \ell$ », puis montrer, avec $\varepsilon = \frac{1}{2}$, que la suite $\big((-1)^{n}\big)$ ne converge vers aucun réel.

    **4.** Écrire la négation de « $u_{n} \to +\infty$ », et montrer que la suite $u_{n} = n\big(1 + (-1)^{n}\big)$ n'est pas majorée mais ne tend pas vers $+\infty$.
  corrige: |
    **1.** On a $\Big|\dfrac{3n - 1}{n + 2} - 3\Big| = \dfrac{7}{n + 2} < \dfrac{7}{n}$ pour $n \geqslant 1$. Soit $\varepsilon > 0$, et $N = \lfloor \frac{7}{\varepsilon} \rfloor + 1 > \frac{7}{\varepsilon}$. Pour $n \geqslant N$, $|u_{n} - 3| < \frac{7}{n} \leqslant \frac{7}{N} < \varepsilon$. 
    $$\boxed{N = \Big\lfloor \frac{7}{\varepsilon} \Big\rfloor + 1 \text{ convient ; pour } \varepsilon = 10^{-2}, \ N = 701}$$
     Le plus petit rang convenable est en fait $698$, puisque $\frac{7}{n + 2} \leqslant 10^{-2}$ équivaut à $n \geqslant 698$ : la définition demande *un* rang, pas le meilleur.

    **2.** Pour $n \geqslant 1$, $n + 1 \leqslant 2n$, donc $\frac{n^{2}}{n + 1} \geqslant \frac{n}{2}$. Pour $A > 0$, le rang $N = \lfloor 2A \rfloor + 1$ convient : pour $n \geqslant N$, $\frac{n^{2}}{n + 1} \geqslant \frac{n}{2} > A$. $\boxed{\frac{n^{2}}{n + 1} \to +\infty}$

    **3.** La négation de $u_{n} \to \ell$ est $\exists \varepsilon > 0,\ \forall N \in \mathbb{N},\ \exists n \geqslant N,\ |u_{n} - \ell| > \varepsilon$. Soit $\ell$ un réel. Comme $|1 - \ell| + |{-1} - \ell| \geqslant |1 - (-1)| = 2$, l'un des deux nombres $|1 - \ell|$, $|{-1} - \ell|$ est au moins $1 > \frac{1}{2}$. Or tout rang $N$ est suivi d'indices pairs et impairs : il existe $n \geqslant N$ tel que $|u_{n} - \ell| > \frac{1}{2}$. 
    $$\boxed{\big((-1)^{n}\big) \text{ ne converge vers aucun réel}}$$
     **4.** La négation de $u_{n} \to +\infty$ est $\exists A \in \mathbb{R},\ \forall N \in \mathbb{N},\ \exists n \geqslant N,\ u_{n} < A$. Ici $u_{n} = 0$ pour $n$ impair, donc $A = 1$ convient ; et $u_{2n} = 4n$ n'est pas majorée. 
    $$\boxed{(u_{n}) \text{ n'est pas majorée, mais ne tend pas vers } +\infty}$$
- id: "ma-07-10"
  feuille: "f-ma-07"
  numero: 10
  partie: "Limites : définitions et calculs"
  etoiles: 2
  types: [Calcul]
  mots_cles: [limites de suites, limites infinies]
  noeuds: [su-convergence, su-operations, su-infinies]
  notions: [suite, limite-suite, limite-infinie]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **1.** Peut-on déterminer la nature, convergente ou divergente, de la somme de deux suites si l'on connaît la nature de chacune ? On traitera tous les cas, par une démonstration ou un contre-exemple.

    **2.** Même question pour le produit.

    **3.** Si $(u_{n} + v_{n})$ et $(u_{n} - v_{n})$ convergent, que dire de $(u_{n})$ et $(v_{n})$ ? Si $(u_{n}v_{n})$ et $(u_{n} + v_{n})$ convergent ?
  corrige: |
    **1.** La somme de deux suites convergentes converge (théorème 4). La somme d'une suite convergente $(u_{n})$ et d'une suite divergente $(v_{n})$ diverge : sinon $v_{n} = (u_{n} + v_{n}) - u_{n}$ convergerait. La somme de deux suites divergentes peut converger, $(-1)^{n} + (-1)^{n+1} = 0$, ou diverger, $(-1)^{n} + (-1)^{n} = 2(-1)^{n}$. 
    $$\boxed{\text{C + C = C ; \ C + D = D ; \ D + D : on ne peut rien dire}}$$
     **2.** Le produit de deux suites convergentes converge. Si $u_{n} \to \ell \neq 0$ et si $(v_{n})$ diverge, $(u_{n}v_{n})$ diverge, sinon $v_{n} = \frac{u_{n}v_{n}}{u_{n}}$ convergerait, $u_{n}$ étant non nul à partir d'un certain rang. Si $\ell = 0$, tout est possible : $\frac{1}{n} \cdot n = 1$ converge, $\frac{1}{n} \cdot n^{2} = n$ diverge. Deux suites divergentes : $(-1)^{n} \cdot (-1)^{n} = 1$ converge, $n \cdot n$ diverge. 
    $$\boxed{\text{C} \times \text{C = C ; \ C (limite non nulle)} \times \text{D = D ; \ sinon on ne peut rien dire}}$$
     **3.** On a $u_{n} = \frac{1}{2}\big((u_{n} + v_{n}) + (u_{n} - v_{n})\big)$ et $v_{n} = \frac{1}{2}\big((u_{n} + v_{n}) - (u_{n} - v_{n})\big)$ : les deux suites convergent. En revanche, la convergence de la somme et du produit ne suffit pas : avec $(u_{n}, v_{n}) = (1, 0)$ pour $n$ pair et $(0, 1)$ pour $n$ impair, on a $u_{n} + v_{n} = 1$ et $u_{n}v_{n} = 0$, alors que les deux suites divergent. 
    $$\boxed{u_{n} \pm v_{n} \text{ convergent} \implies u_{n}, v_{n} \text{ convergent ; faux avec somme et produit}}$$
     La somme et le produit déterminent la paire $\{u_{n}, v_{n}\}$, comme ensemble des racines du trinôme 
    $$X^{2} - (u_{n} + v_{n})X + u_{n}v_{n},$$
     mais pas l'ordre des deux racines : c'est ce que l'exemple exploite.
- id: "ma-07-11"
  feuille: "f-ma-07"
  numero: 11
  partie: "Limites : définitions et calculs"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [limites de suites]
  noeuds: [su-convergence, su-operations]
  notions: [suite, limite-suite]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Soit $(u_{n})$ et $(v_{n})$ deux suites réelles.

    **1.** Montrer que, si $u_{n} \to \ell$, alors $|u_{n}| \to |\ell|$. La réciproque est-elle vraie ? Montrer que $u_{n} \to 0$ si et seulement si $|u_{n}| \to 0$.

    **2.** Pour deux réels $a$ et $b$, exprimer $\max(a, b)$ et $\min(a, b)$ à l'aide de $a + b$ et de $|a - b|$. En déduire que, si $(u_{n})$ et $(v_{n})$ convergent, les suites $\big(\max(u_{n}, v_{n})\big)$ et $\big(\min(u_{n}, v_{n})\big)$ convergent, et préciser leurs limites.
  corrige: |
    **1.** La proposition 1 du cours donne $\big||u_{n}| - |\ell|\big| \leqslant |u_{n} - \ell|$, d'où $|u_{n}| \to |\ell|$ par la proposition 8. La réciproque est fausse : $|(-1)^{n}| = 1$ converge, $((-1)^{n})$ non. Pour $\ell = 0$, en revanche, $|u_{n} - 0| = \big||u_{n}| - 0\big|$ : les deux énoncés sont identiques. 
    $$\boxed{u_{n} \to \ell \implies |u_{n}| \to |\ell|, \text{ réciproque fausse sauf pour } \ell = 0}$$
     **2.** Selon que $a \geqslant b$ ou $a < b$, on vérifie : 
    $$\boxed{\max(a, b) = \frac{a + b + |a - b|}{2} \qquad \min(a, b) = \frac{a + b - |a - b|}{2}}$$
     Si $u_{n} \to \ell$ et $v_{n} \to \ell'$, la question 1 et le théorème 4 donnent la convergence de ces expressions. 
    $$\boxed{\max(u_{n}, v_{n}) \to \max(\ell, \ell') \qquad \min(u_{n}, v_{n}) \to \min(\ell, \ell')}$$
- id: "ma-07-12"
  feuille: "f-ma-07"
  numero: 12
  partie: "Limites : définitions et calculs"
  etoiles: 2
  types: [Calcul]
  mots_cles: [limites de suites, "partie entière et propriété d'Archimède", sommes]
  noeuds: [su-convergence, su-operations, ar-archimede, n-sommes]
  notions: [suite, limite-suite, archimedien]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Étudier la convergence des suites suivantes, définies pour $n \geqslant 1$, en encadrant leur terme général ; $x$ désigne un réel fixé.

    **(a)** $\displaystyle u_{n} = \sum_{k=1}^{n} \frac{k}{n^{2}}$

    **(b)** $\displaystyle u_{n} = \sum_{k=1}^{n} \frac{n}{n^{2} + k}$

    **(c)** $\displaystyle u_{n} = \frac{1}{n^{2}}\sum_{k=1}^{n} \lfloor kx \rfloor$

    **(d)** $\displaystyle u_{n} = \frac{1}{n!}\sum_{k=1}^{n} k!$

    **(e)** $\displaystyle u_{n} = \sum_{k=0}^{n} \dbinom{n}{k}^{-1}$

    **(f)** $\displaystyle u_{n} = \sum_{k=1}^{n} \frac{1}{\sqrt{n^{2} + k}}$

    *Indication : pour (e), isoler les termes $k \in \{0, 1, n - 1, n\}$ et minorer $\dbinom{n}{k}$ par $\dbinom{n}{2}$ pour les autres.*
  corrige: |
    **(a)** La somme se calcule (chapitre 3) : $u_{n} = \dfrac{n(n + 1)}{2n^{2}} = \dfrac{1}{2} + \dfrac{1}{2n}$, de limite $\boxed{\frac{1}{2}}$.

    **(b)** Chacun des $n$ termes est compris entre $\frac{n}{n^{2} + n}$ et $\frac{n}{n^{2} + 1}$ : 
    $$\frac{n^{2}}{n^{2} + n} \leqslant u_{n} \leqslant \frac{n^{2}}{n^{2} + 1}, \qquad\text{d'où la limite } \boxed{1} \text{ par encadrement.}$$
     **(c)** On somme les encadrements $kx - 1 < \lfloor kx \rfloor \leqslant kx$ : 
    $$x\,\frac{n(n + 1)}{2} - n < \sum_{k=1}^{n} \lfloor kx \rfloor \leqslant x\,\frac{n(n + 1)}{2},$$
     et, en divisant par $n^{2}$, les deux bornes tendent vers $\frac{x}{2}$ : limite $\boxed{\frac{x}{2}}$.

    **(d)** Pour $n \geqslant 2$, on isole les deux derniers termes et l'on majore les $n - 2$ autres par $(n - 2)!$ : 
    $$1 \leqslant u_{n} \leqslant 1 + \frac{1}{n} + \frac{(n - 2)\,(n - 2)!}{n!} = 1 + \frac{1}{n} + \frac{n - 2}{n(n - 1)} \leqslant 1 + \frac{2}{n},$$
     d'où la limite $\boxed{1}$ : la somme des factorielles est « dominée » par la dernière.

    **(e)** Pour $1 \leqslant k \leqslant n - 1$, le quotient $\frac{\binom{n}{k+1}}{\binom{n}{k}} = \frac{n - k}{k + 1}$ est supérieur ou égal à $1$ si et seulement si $k \leqslant \frac{n - 1}{2}$ : les coefficients croissent puis décroissent, et pour $2 \leqslant k \leqslant n - 2$, $\binom{n}{k} \geqslant \binom{n}{2}$. Pour $n \geqslant 4$, en isolant les termes $k \in \{0, 1, n - 1, n\}$ : 
    $$2 \leqslant u_{n} \leqslant 2 + \frac{2}{n} + (n - 3)\,\frac{2}{n(n - 1)} \leqslant 2 + \frac{4}{n},$$
     d'où la limite $\boxed{2}$. Numériquement, $u_{60} \approx 2{,}0345$.

    **(f)** Les $n$ termes sont compris entre $\frac{1}{\sqrt{n^{2} + n}}$ et $\frac{1}{\sqrt{n^{2} + 1}}$, d'où 
    $$\frac{1}{\sqrt{1 + 1/n}} \leqslant u_{n} \leqslant \frac{1}{\sqrt{1 + 1/n^{2}}}, \qquad\text{et la limite } \boxed{1}.$$

    *À retenir :* pour une somme de $n$ termes, on encadre chaque terme par le plus petit et le plus grand, puis l'on multiplie par $n$. Cela ne marche que si ces deux bornes, multipliées par $n$, ont la même limite ; sinon, comme en (d) et (e), il faut isoler les termes prépondérants.
- id: "ma-07-13"
  feuille: "f-ma-07"
  numero: 13
  partie: "Limites : définitions et calculs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [limites de suites]
  noeuds: [su-convergence, su-operations]
  notions: [suite, limite-suite]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    **1.** Soit $(u_{n})$ et $(v_{n})$ deux suites à valeurs dans $[0\,,1]$ telles que $u_{n}v_{n} \to 1$. Montrer que $u_{n} \to 1$ et $v_{n} \to 1$.

    **2.** Soit $(u_{n})$ et $(v_{n})$ deux suites telles que $0 \leqslant u_{n} \leqslant 3$ et $0 \leqslant v_{n} \leqslant 2$ pour tout $n$, et $u_{n}v_{n} \to 6$. Que dire de $(u_{n})$ et $(v_{n})$ ?

    **3.** Soit $(u_{n})$ une suite à valeurs dans $[0\,,1]$ telle que $\frac{u_{n} + u_{n}^{2}}{2} \to 1$. Montrer que $u_{n} \to 1$.
  corrige: |
    **1.** Comme $0 \leqslant v_{n} \leqslant 1$ et $u_{n} \geqslant 0$, on a $u_{n}v_{n} \leqslant u_{n} \leqslant 1$, et l'encadrement donne $u_{n} \to 1$ ; de même pour $v_{n}$. $\boxed{u_{n} \to 1, \ v_{n} \to 1}$

    **2.** On a $6 - u_{n}v_{n} \geqslant 6 - 2u_{n} = 2(3 - u_{n}) \geqslant 0$, donc $0 \leqslant 3 - u_{n} \leqslant \frac{1}{2}(6 - u_{n}v_{n})$, qui tend vers $0$. De même, $6 - u_{n}v_{n} \geqslant 3(2 - v_{n}) \geqslant 0$. 
    $$\boxed{u_{n} \to 3, \qquad v_{n} \to 2}$$
     **3.** Comme $0 \leqslant u_{n} \leqslant 1$, on a $u_{n}^{2} \leqslant u_{n}$, d'où $\frac{u_{n} + u_{n}^{2}}{2} \leqslant u_{n} \leqslant 1$, et l'encadrement donne $\boxed{u_{n} \to 1}$.

    L'idée commune est qu'un produit ou une moyenne ne peut atteindre sa valeur maximale que si chaque facteur atteint la sienne ; les bornes imposées transforment cette remarque en encadrement.
- id: "ma-07-14"
  feuille: "f-ma-07"
  numero: 14
  partie: "Limites : définitions et calculs"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [limites de suites, bornes supérieure et inférieure, limites infinies]
  noeuds: [su-convergence, su-operations, od-sup-propriete, su-infinies]
  notions: [suite, limite-suite, borne-superieure, limite-infinie]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    *Critère de d'Alembert.* Soit $(u_{n})$ une suite de réels strictement positifs, et $\ell \in \mathbb{R}_{+} \cup \{+\infty\}$ tel que $\frac{u_{n+1}}{u_{n}} \to \ell$.

    **1.** Montrer que, si $\ell < 1$, alors $u_{n} \to 0$.

    **2.** Montrer que, si $\ell > 1$, alors $u_{n} \to +\infty$.

    **3.** Montrer, par trois exemples, que l'on ne peut rien conclure si $\ell = 1$.

    **4.** Étudier les suites $\dfrac{n^{10}}{1{,}01^{n}}$, $\dfrac{a^{n}}{n!}$ pour $a > 0$, $\dbinom{2n}{n}\dfrac{1}{5^{n}}$ et $\dbinom{2n}{n}\dfrac{1}{3^{n}}$.
  corrige: |
    **1.** Si $\ell < 1$, posons $k = \frac{1 + \ell}{2} \in \,]\ell\,,1[$. Avec $\varepsilon = k - \ell$, on a $\frac{u_{n+1}}{u_{n}} \leqslant k$ à partir d'un certain rang, et la proposition 10 du cours donne $\boxed{u_{n} \to 0}$.

    **2.** Si $\ell > 1$ est réel, posons $k = \frac{1 + \ell}{2} > 1$ ; si $\ell = +\infty$, posons $k = 2$. Dans les deux cas, $\frac{u_{n+1}}{u_{n}} \geqslant k$ pour $n \geqslant N$, d'où $u_{n} \geqslant u_{N}\,k^{n - N}$, qui tend vers $+\infty$ (proposition 9). $\boxed{u_{n} \to +\infty}$

    **3.** Les suites $u_{n} = \frac{1}{n}$, $u_{n} = 1$ et $u_{n} = n$ vérifient $\frac{u_{n+1}}{u_{n}} \to 1$, et tendent respectivement vers $0$, $1$ et $+\infty$. 
    $$\boxed{\ell = 1 : \text{ cas douteux}}$$
     **4.** On calcule chaque fois la limite du quotient de deux termes consécutifs.

    • $\frac{u_{n+1}}{u_{n}} = \frac{1}{1{,}01}\big(1 + \frac{1}{n}\big)^{10} \to \frac{1}{1{,}01} < 1$ : $\boxed{\frac{n^{10}}{1{,}01^{n}} \to 0}$, bien que $u_{1000} \approx 4{,}8 \times 10^{25}$ soit encore énorme.

    • $\frac{u_{n+1}}{u_{n}} = \frac{a}{n + 1} \to 0$ : $\boxed{\frac{a^{n}}{n!} \to 0}$

    • $\frac{\binom{2n+2}{n+1}}{\binom{2n}{n}} = \frac{(2n + 2)(2n + 1)}{(n + 1)^{2}} = \frac{2(2n + 1)}{n + 1} \to 4$ ; le quotient tend donc vers $\frac{4}{5} < 1$ dans le premier cas et vers $\frac{4}{3} > 1$ dans le second : 
    $$\boxed{\binom{2n}{n}\frac{1}{5^{n}} \to 0 \qquad \binom{2n}{n}\frac{1}{3^{n}} \to +\infty}$$

    Le coefficient central $\binom{2n}{n}$ croît donc à peu près comme $4^{n}$ ; le chapitre 10 donnera un résultat plus précis.
- id: "ma-07-15"
  feuille: "f-ma-07"
  numero: 15
  partie: "Limites : définitions et calculs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [limites de suites, bornes supérieure et inférieure, "partie entière et propriété d'Archimède", limites infinies]
  noeuds: [su-convergence, su-operations, od-sup-propriete, ar-archimede, su-infinies]
  notions: [suite, limite-suite, borne-superieure, archimedien, limite-infinie]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    **1.** Montrer qu'une suite d'entiers relatifs est convergente si et seulement si elle est stationnaire.

    **2.** Soit $(u_{n})$ une suite qui converge vers un réel $\ell$. Que dire de la suite $(\lfloor u_{n} \rfloor)$ ? On distinguera les cas $\ell \notin \mathbb{Z}$ et $\ell \in \mathbb{Z}$, en donnant dans le second cas trois exemples de comportements différents.

    **3.** Soit $(u_{n})$ une suite d'entiers naturels deux à deux distincts. Montrer que $u_{n} \to +\infty$.
  corrige: |
    **1.** Une suite stationnaire converge vers sa valeur finale. Réciproquement, si $u_{n} \to \ell$, il existe $N$ tel que $|u_{n} - \ell| \leqslant \frac{1}{3}$ pour $n \geqslant N$ ; alors $|u_{n} - u_{m}| \leqslant \frac{2}{3} < 1$ pour $n$, $m \geqslant N$, et deux entiers aussi proches sont égaux. 
    $$\boxed{\text{une suite d'entiers converge si et seulement si elle est stationnaire}}$$
     **2.** Si $\ell \notin \mathbb{Z}$, notons $k = \lfloor \ell \rfloor$, de sorte que $k < \ell < k + 1$. Avec $\varepsilon = \frac{1}{2}\min(\ell - k, k + 1 - \ell)$, on a $u_{n} \in \,]k\,,k + 1[$ à partir d'un certain rang, donc $\lfloor u_{n} \rfloor = k$. Si $\ell \in \mathbb{Z}$, les suites $\ell + \frac{1}{n + 1}$, $\ell - \frac{1}{n + 1}$ et $\ell + \frac{(-1)^{n}}{n + 1}$ ont pour parties entières $\ell$, $\ell - 1$, et alternativement $\ell$ et $\ell - 1$. 
    $$\boxed{\ell \notin \mathbb{Z} : \lfloor u_{n} \rfloor \to \lfloor \ell \rfloor \qquad \ell \in \mathbb{Z} : \text{ limite } \ell, \ \ell - 1, \text{ ou divergence}}$$
     **3.** Soit $A$ un réel. Les indices $n$ tels que $u_{n} \leqslant A$ ont des images deux à deux distinctes dans l'ensemble fini $\mathbb{N} \cap [0\,,A]$ : ils sont en nombre fini. Au-delà du plus grand d'entre eux, on a $u_{n} > A$. $\boxed{u_{n} \to +\infty}$

    La question 2 montre que la partie entière n'est pas continue aux entiers ; le chapitre 8 donnera un nom à ce phénomène.
- id: "ma-07-16"
  feuille: "f-ma-07"
  numero: 16
  partie: "Limites : définitions et calculs"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [limites de suites, "théorème d'encadrement"]
  noeuds: [su-convergence, su-operations, su-encadrement]
  notions: [suite, limite-suite]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    *La formule de Viète.* Soit $x \in \,]0\,,\pi[$. On pose, pour $n \geqslant 1$, $\displaystyle P_{n} = \prod_{k=1}^{n} \cos\frac{x}{2^{k}}$.

    **1.** Montrer que $P_{n} \cdot 2^{n}\sin\dfrac{x}{2^{n}} = \sin x$.

    **2.** À l'aide de l'encadrement $t - \frac{t^{3}}{6} \leqslant \sin t \leqslant t$, valable pour $t \geqslant 0$ (chapitre 5), montrer que $2^{n}\sin\frac{x}{2^{n}} \to x$. En déduire que $P_{n} \to \dfrac{\sin x}{x}$.

    **3.** En prenant $x = \frac{\pi}{2}$, montrer que 
    $$\frac{2}{\pi} = \frac{\sqrt{2}}{2} \cdot \frac{\sqrt{2 + \sqrt{2}}}{2} \cdot \frac{\sqrt{2 + \sqrt{2 + \sqrt{2}}}}{2} \cdots$$
     au sens où le produit des $n$ premiers facteurs tend vers $\frac{2}{\pi}$.
  corrige: |
    **1.** Par récurrence sur $n$, à l'aide de $\sin(2t) = 2\sin t\cos t$. Pour $n = 1$, $2\sin\frac{x}{2}\cos\frac{x}{2} = \sin x$. Si la formule est vraie au rang $n$, alors 
    $$P_{n+1} \cdot 2^{n+1}\sin\frac{x}{2^{n+1}} = P_{n} \cdot 2^{n} \cdot 2\sin\frac{x}{2^{n+1}}\cos\frac{x}{2^{n+1}} = P_{n} \cdot 2^{n}\sin\frac{x}{2^{n}} = \sin x.$$

    $$\boxed{P_{n} \cdot 2^{n}\sin\frac{x}{2^{n}} = \sin x}$$
     **2.** Avec $t = \frac{x}{2^{n}} > 0$, l'encadrement multiplié par $2^{n}$ donne 
    $$x - \frac{x^{3}}{6 \cdot 4^{n}} \leqslant 2^{n}\sin\frac{x}{2^{n}} \leqslant x,$$
     d'où $2^{n}\sin\frac{x}{2^{n}} \to x \neq 0$. Comme $\sin\frac{x}{2^{n}} > 0$, on peut diviser, et le théorème 4 donne : 
    $$\boxed{P_{n} = \frac{\sin x}{2^{n}\sin(x/2^{n})} \to \frac{\sin x}{x}}$$
     **3.** Pour $x = \frac{\pi}{2}$, la limite vaut $\frac{1}{\pi/2} = \frac{2}{\pi}$. Les facteurs sont $c_{k} = \cos\frac{\pi}{2^{k+1}}$, avec $c_{1} = \frac{\sqrt{2}}{2}$, et la formule $\cos^{2}\frac{\theta}{2} = \frac{1 + \cos\theta}{2}$, avec $\cos\frac{\theta}{2} > 0$, donne $2c_{k+1} = \sqrt{2 + 2c_{k}}$. Ainsi $2c_{2} = \sqrt{2 + \sqrt{2}}$, $2c_{3} = \sqrt{2 + \sqrt{2 + \sqrt{2}}}$, et ainsi de suite. 
    $$\boxed{\frac{2}{\pi} = \frac{\sqrt{2}}{2} \cdot \frac{\sqrt{2 + \sqrt{2}}}{2} \cdot \frac{\sqrt{2 + \sqrt{2 + \sqrt{2}}}}{2} \cdots}$$
     Avec dix facteurs, on obtient $0{,}636\,620\,0$, contre $\frac{2}{\pi} \approx 0{,}636\,619\,8$ : l'erreur est de l'ordre de $\frac{x^{2}}{6 \cdot 4^{n}}$, comme le montre l'encadrement de la question 2. Cette formule, publiée par Viète en 1593, est la première expression de $\pi$ par un produit infini dans les mathématiques européennes.
- id: "ma-07-17"
  feuille: "f-ma-07"
  numero: 17
  partie: "Suites monotones et suites adjacentes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [suites monotones et adjacentes, limites de suites, suites récurrentes, sommes]
  noeuds: [su-monotone, su-adjacentes, su-convergence, ar-suites, n-sommes]
  notions: [suites-adjacentes, limite-suite]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Étudier la monotonie des suites suivantes.

    **(a)** $u_{n} = \dbinom{n}{p}$ pour $n \geqslant p$, avec $p \in \mathbb{N}$ fixé

    **(b)** $\displaystyle u_{n} = \sum_{k=1}^{n} \frac{1}{k^{2}} + \frac{1}{n}$

    **(c)** $u_{n} = \dfrac{n!}{2^{n}}$

    **(d)** $\displaystyle u_{n} = \sum_{k=1}^{n} \ln k - n\ln n$

    **(e)** $\displaystyle u_{n} = \prod_{k=1}^{n} \frac{2k}{2k + 1}$

    **(f)** $u_{0} > 0$ et $u_{n+1} = \dfrac{3u_{n}^{2}}{1 + 4u_{n}}$

    Pour chacune, dire si l'on peut conclure à sa convergence.
  corrige: |
    On étudie le signe de $u_{n+1} - u_{n}$, ou la position du quotient $\frac{u_{n+1}}{u_{n}}$ par rapport à $1$ pour les suites positives.

    **(a)** Pour $n \geqslant p$, $\dfrac{u_{n+1}}{u_{n}} = \dfrac{(n + 1)!\,(n - p)!}{(n + 1 - p)!\,n!} = \dfrac{n + 1}{n + 1 - p} \geqslant 1$. 
    $$\boxed{\text{croissante, constante si } p = 0}$$
     Pour $p \geqslant 1$, la formule de Pascal donne $u_{n+1} - u_{n} = \binom{n}{p-1} \geqslant 1$, donc $u_{n} \geqslant u_{p} + (n - p)$ : la suite tend vers $+\infty$, et ne converge que si $p = 0$.

    **(b)** On calcule la différence : 
    $$u_{n+1} - u_{n} = \frac{1}{(n + 1)^{2}} + \frac{1}{n + 1} - \frac{1}{n} = \frac{1}{(n + 1)^{2}} - \frac{1}{n(n + 1)} = -\frac{1}{n(n + 1)^{2}} < 0.$$

    $$\boxed{\text{strictement décroissante, minorée par } 0 \text{ : convergente}}$$
     Comme $\frac{1}{n} \to 0$, sa limite est celle de $\sum_{k=1}^{n} \frac{1}{k^{2}}$, dont on obtient ainsi une seconde preuve de convergence.

    **(c)** On a $\dfrac{u_{n+1}}{u_{n}} = \dfrac{n + 1}{2} \geqslant 1$ pour $n \geqslant 1$, avec égalité seulement pour $n = 1$. 
    $$\boxed{\text{croissante à partir du rang } 1, \text{ et } u_{n} \to +\infty}$$
     La limite résulte de l'exercice 14, le quotient tendant vers $+\infty$.

    **(d)** On calcule la différence, puis l'on reconnaît un logarithme : 
    $$u_{n+1} - u_{n} = \ln(n + 1) - (n + 1)\ln(n + 1) + n\ln n = -n\ln\Big(1 + \frac{1}{n}\Big) < 0.$$

    $$\boxed{\text{strictement décroissante, et } u_{n} = \ln\frac{n!}{n^{n}} \to -\infty}$$
     La limite vient de $\frac{n!}{n^{n}} \to 0$ (théorème 7) : la suite diverge.

    **(e)** On a $\dfrac{u_{n+1}}{u_{n}} = \dfrac{2n + 2}{2n + 3} < 1$. $\boxed{\text{strictement décroissante et positive : convergente}}$

    Sa limite est nulle. En effet, $\frac{2k}{2k + 1} \leqslant \frac{2k + 1}{2k + 2}$, puisque $2k(2k + 2) = 4k^{2} + 4k < (2k + 1)^{2}$, donc 
    $$u_{n}^{2} \leqslant \prod_{k=1}^{n} \frac{2k}{2k + 1} \cdot \prod_{k=1}^{n} \frac{2k + 1}{2k + 2} = \prod_{k=1}^{n} \frac{2k}{2k + 2} = \frac{1}{n + 1},$$
     par télescopage, d'où $0 < u_{n} \leqslant \frac{1}{\sqrt{n + 1}}$.

    **(f)** Par récurrence, $u_{n} > 0$ pour tout $n$, et 
    $$u_{n+1} - u_{n} = \frac{3u_{n}^{2} - u_{n} - 4u_{n}^{2}}{1 + 4u_{n}} = -\frac{u_{n}(u_{n} + 1)}{1 + 4u_{n}} < 0.$$

    $$\boxed{\text{strictement décroissante et positive : convergente}}$$
     La limite est nulle : $\frac{3u_{n}}{1 + 4u_{n}} < \frac{3}{4}$, donc $u_{n+1} \leqslant \frac{3}{4}u_{n}$ et $u_{n} \leqslant \big(\frac{3}{4}\big)^{n}u_{0}$.
- id: "ma-07-18"
  feuille: "f-ma-07"
  numero: 18
  partie: "Suites monotones et suites adjacentes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [suites monotones et adjacentes, majorants, limites de suites, sommes]
  noeuds: [su-monotone, su-adjacentes, od-majorants, su-convergence, n-sommes]
  notions: [suites-adjacentes, majorant, limite-suite]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    On pose, pour $n \in \mathbb{N}$, $\displaystyle S_{n} = \sum_{k=0}^{n} \frac{1}{3^{k}}$ et $\displaystyle T_{n} = \sum_{k=0}^{n} \frac{k}{3^{k}}$.

    **1.** Montrer que $(S_{n})$ converge, et préciser sa limite.

    **2.** Montrer que $T_{n+1} = \dfrac{T_{n} + S_{n}}{3}$ pour tout $n$.

    **3.** En déduire que $(T_{n})$ est majorée par $\frac{3}{4}$, puis qu'elle converge, et déterminer sa limite.
  corrige: |
    **1.** C'est une somme géométrique (chapitre 3) : 
    $$S_{n} = \frac{1 - 3^{-(n+1)}}{1 - \frac{1}{3}} = \frac{3}{2}\Big(1 - \frac{1}{3^{n+1}}\Big) \to \boxed{\frac{3}{2}}.$$
     **2.** On change d'indice $k = j + 1$ : 
    $$T_{n+1} = \sum_{k=1}^{n+1} \frac{k}{3^{k}} = \sum_{j=0}^{n} \frac{j + 1}{3^{j+1}} = \frac{1}{3}\sum_{j=0}^{n} \frac{j}{3^{j}} + \frac{1}{3}\sum_{j=0}^{n} \frac{1}{3^{j}} = \boxed{\frac{T_{n} + S_{n}}{3}}.$$
     **3.** La suite $(T_{n})$ est croissante, comme somme de termes positifs, et $S_{n} \leqslant \frac{3}{2}$. Donc 
    $$T_{n} \leqslant T_{n+1} = \frac{T_{n} + S_{n}}{3} \leqslant \frac{T_{n}}{3} + \frac{1}{2}, \qquad\text{d'où}\qquad T_{n} \leqslant \frac{3}{4}.$$
     Croissante et majorée, elle converge vers un réel $t$ (théorème 8), et le passage à la limite dans la relation de la question 2 donne $t = \frac{t + 3/2}{3}$. 
    $$\boxed{T_{n} \to \frac{3}{4}}$$
     Il fallait d'abord établir la convergence : la relation $t = \frac{t + 3/2}{3}$ n'a de sens qu'une fois la limite $t$ connue pour exister.
- id: "ma-07-19"
  feuille: "f-ma-07"
  numero: 19
  partie: "Suites monotones et suites adjacentes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [suites monotones et adjacentes, suites adjacentes, sommes]
  noeuds: [su-monotone, su-adjacentes, n-sommes]
  notions: [suites-adjacentes]
  page_enonce: 6
  page_corrige: 11
  enonce: |
    Montrer que les suites $(u_{n})_{n \geqslant 1}$ et $(v_{n})_{n \geqslant 1}$ sont adjacentes dans chacun des cas suivants.

    **(a)** $\displaystyle u_{n} = \sum_{k=1}^{n} \frac{1}{n + k}$ et $\displaystyle v_{n} = \sum_{k=n}^{2n} \frac{1}{k}$.

    **(b)** $\displaystyle u_{n} = \sum_{k=1}^{n} \frac{1}{\sqrt{k}} - 2\sqrt{n + 1}$ et $\displaystyle v_{n} = \sum_{k=1}^{n} \frac{1}{\sqrt{k}} - 2\sqrt{n}$. En déduire que $\dfrac{1}{\sqrt{n}}\displaystyle\sum_{k=1}^{n} \frac{1}{\sqrt{k}} \to 2$.
  corrige: |
    **(a)** On a $u_{n} = H_{2n} - H_{n}$ et $v_{n} = u_{n} + \frac{1}{n}$, avec $H_{n} = \sum_{k=1}^{n} \frac{1}{k}$. On calcule les différences : 
    $$u_{n+1} - u_{n} = \frac{1}{2n + 1} + \frac{1}{2n + 2} - \frac{1}{n + 1} = \frac{1}{2n + 1} - \frac{1}{2n + 2} > 0,$$

    $$v_{n+1} - v_{n} = \frac{1}{(2n + 1)(2n + 2)} - \frac{1}{n(n + 1)} < 0,$$
     puisque $(2n + 1)(2n + 2) > n(n + 1)$. Enfin $v_{n} - u_{n} = \frac{1}{n} \to 0$. 
    $$\boxed{(u_{n}) \text{ et } (v_{n}) \text{ sont adjacentes}}$$
     L'exercice 21 montrera que leur limite commune est $\ln 2$.

    **(b)** On note $\Sigma_{n} = \sum_{k=1}^{n} \frac{1}{\sqrt{k}}$, et l'on utilise $\sqrt{m + 1} - \sqrt{m} = \frac{1}{\sqrt{m + 1} + \sqrt{m}}$ : 
    $$u_{n+1} - u_{n} = \frac{1}{\sqrt{n + 1}} - \frac{2}{\sqrt{n + 2} + \sqrt{n + 1}} > 0, \qquad v_{n+1} - v_{n} = \frac{1}{\sqrt{n + 1}} - \frac{2}{\sqrt{n + 1} + \sqrt{n}} < 0,$$
     puisque $\sqrt{n + 2} + \sqrt{n + 1} > 2\sqrt{n + 1} > \sqrt{n + 1} + \sqrt{n}$. Enfin $v_{n} - u_{n} = 2(\sqrt{n + 1} - \sqrt{n}) \to 0$. 
    $$\boxed{(u_{n}) \text{ et } (v_{n}) \text{ sont adjacentes}}$$
     Leur limite commune $c$ vaut environ $-1{,}46$. Comme $(v_{n})$ est bornée, $\frac{\Sigma_{n}}{\sqrt{n}} = 2 + \frac{v_{n}}{\sqrt{n}} \to \boxed{2}$ : la somme croît comme $2\sqrt{n}$, ce que la comparaison avec $\int_{1}^{n} \frac{\mathrm{d} t}{\sqrt{t}}$ rendra naturel au chapitre 20.
- id: "ma-07-20"
  feuille: "f-ma-07"
  numero: 20
  partie: "Suites monotones et suites adjacentes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [suites monotones et adjacentes, limites de suites, suites monotones, suites adjacentes, sommes]
  noeuds: [su-monotone, su-adjacentes, su-convergence, n-sommes]
  notions: [suites-adjacentes, limite-suite]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    *Critère des sommes alternées.* Soit $(a_{n})$ une suite décroissante de limite nulle, et $\displaystyle S_{n} = \sum_{k=0}^{n} (-1)^{k}a_{k}$.

    **1.** Montrer que les suites $(S_{2n})$ et $(S_{2n+1})$ sont adjacentes. En déduire que $(S_{n})$ converge vers un réel $S$.

    **2.** Montrer que $|S - S_{n}| \leqslant a_{n+1}$ pour tout $n$.

    **3.** On rappelle que $\displaystyle\sum_{k=0}^{n} \frac{(-1)^{k}}{2k + 1} \to \frac{\pi}{4}$ (exercice 25 de la feuille du chapitre 6). Combien de termes faut-il sommer pour que la question 2 garantisse une approximation de $\frac{\pi}{4}$ à $10^{-3}$ près ?
  corrige: |
    **1.** On calcule les différences de deux termes de même parité : 
    $$S_{2n+2} - S_{2n} = a_{2n+2} - a_{2n+1} \leqslant 0, \qquad S_{2n+3} - S_{2n+1} = a_{2n+2} - a_{2n+3} \geqslant 0,$$
     et $S_{2n} - S_{2n+1} = a_{2n+1} \to 0$. Les suites $(S_{2n})$, décroissante, et $(S_{2n+1})$, croissante, sont adjacentes ; elles convergent vers un même réel $S$, et la proposition 11 du cours donne $S_{n} \to S$. 
    $$\boxed{(S_{n}) \text{ converge}}$$
     **2.** D'après le théorème 9, $S_{2m+1} \leqslant S \leqslant S_{2m+2} \leqslant S_{2m}$ pour tout $m$ : le réel $S$ est toujours compris entre deux sommes consécutives $S_{n}$ et $S_{n+1}$, dont la différence vaut $a_{n+1}$ en valeur absolue. 
    $$\boxed{|S - S_{n}| \leqslant a_{n+1}}$$
     **3.** Avec $a_{k} = \frac{1}{2k + 1}$, qui décroît vers $0$, il suffit que $\frac{1}{2n + 3} \leqslant 10^{-3}$, soit $n \geqslant 498{,}5$. 
    $$\boxed{n = 499, \text{ soit } 500 \text{ termes}}$$
     La convergence est lente, ce qui explique que l'on n'utilise pas cette série pour calculer $\pi$ ; la formule de Viète (exercice 16) gagne près d'un chiffre exact par facteur.
- id: "ma-07-21"
  feuille: "f-ma-07"
  numero: 21
  partie: "Suites monotones et suites adjacentes"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [suites monotones et adjacentes, bornes supérieure et inférieure, limites de suites, limites infinies, "théorème d'encadrement", suites adjacentes, suites extraites, sommes]
  noeuds: [su-monotone, su-adjacentes, od-sup-propriete, su-convergence, su-infinies, su-encadrement, su-extraites, n-sommes]
  notions: [suites-adjacentes, borne-superieure, limite-suite, limite-infinie, suite-extraite]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    *La constante d'Euler.* On pose, pour $n \geqslant 1$, $\displaystyle H_{n} = \sum_{k=1}^{n} \frac{1}{k}$, $u_{n} = H_{n} - \ln n$ et $v_{n} = H_{n} - \ln(n + 1)$.

    **1.** À l'aide de l'inégalité $\ln t \leqslant t - 1$ (chapitre 5), appliquée à des valeurs bien choisies de $t$, montrer que pour tout $x > -1$, $\dfrac{x}{1 + x} \leqslant \ln(1 + x) \leqslant x$.

    **2.** En déduire que $(u_{n})$ et $(v_{n})$ sont adjacentes. Leur limite commune est la *constante d'Euler*, notée $\gamma$ ; donner un encadrement de $\gamma$ à l'aide de $H_{10} \approx 2{,}9290$.

    **3.** Montrer que $H_{n} \to +\infty$ et que $\dfrac{H_{n}}{\ln n} \to 1$.

    **4.** En écrivant $H_{2n} - H_{n} = u_{2n} - u_{n} + \ln 2$, retrouver la limite des suites de l'exercice 19 (a).
  corrige: |
    **1.** Avec $t = 1 + x > 0$, l'inégalité $\ln t \leqslant t - 1$ donne $\ln(1 + x) \leqslant x$. Avec $t = \frac{1}{1 + x}$, elle donne $-\ln(1 + x) \leqslant \frac{1}{1 + x} - 1 = -\frac{x}{1 + x}$. 
    $$\boxed{\frac{x}{1 + x} \leqslant \ln(1 + x) \leqslant x}$$
     **2.** Avec $x = \frac{1}{n}$, la minoration donne $\ln\big(1 + \frac{1}{n}\big) \geqslant \frac{1}{n + 1}$, et avec $x = \frac{1}{n + 1}$, la majoration donne $\ln\big(1 + \frac{1}{n + 1}\big) \leqslant \frac{1}{n + 1}$. D'où 
    $$u_{n+1} - u_{n} = \frac{1}{n + 1} - \ln\Big(1 + \frac{1}{n}\Big) \leqslant 0, \qquad v_{n+1} - v_{n} = \frac{1}{n + 1} - \ln\Big(1 + \frac{1}{n + 1}\Big) \geqslant 0,$$
     et $0 \leqslant u_{n} - v_{n} = \ln\big(1 + \frac{1}{n}\big) \leqslant \frac{1}{n}$. 
    $$\boxed{(u_{n}) \text{ et } (v_{n}) \text{ sont adjacentes}}$$
     Avec $H_{10} \approx 2{,}928\,97$, on obtient $v_{10} = H_{10} - \ln 11 \approx 0{,}5311$ et $u_{10} = H_{10} - \ln 10 \approx 0{,}6264$. 
    $$\boxed{0{,}531 \leqslant \gamma \leqslant 0{,}627}$$
     La valeur exacte est $\gamma \approx 0{,}5772$ ; on ne sait toujours pas si ce nombre est rationnel.

    **3.** Comme $u_{n} \geqslant \gamma$, on a $H_{n} \geqslant \ln n + \gamma \to +\infty$. Et $\frac{H_{n}}{\ln n} = 1 + \frac{u_{n}}{\ln n} \to 1$, puisque $(u_{n})$ est bornée. 
    $$\boxed{H_{n} \to +\infty \qquad \frac{H_{n}}{\ln n} \to 1}$$
     **4.** On a $H_{2n} - H_{n} = (u_{2n} + \ln 2n) - (u_{n} + \ln n) = u_{2n} - u_{n} + \ln 2$, et $(u_{2n})$, extraite de $(u_{n})$, tend vers $\gamma$. 
    $$\boxed{\sum_{k=1}^{n} \frac{1}{n + k} = H_{2n} - H_{n} \to \ln 2}$$
- id: "ma-07-22"
  feuille: "f-ma-07"
  numero: 22
  partie: "Suites monotones et suites adjacentes"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [suites monotones et adjacentes, limites de suites, "théorème d'encadrement", suites monotones, suites adjacentes, sommes]
  noeuds: [su-monotone, su-adjacentes, su-convergence, su-encadrement, n-sommes]
  notions: [suites-adjacentes, limite-suite]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    *Irrationalité de la limite de $\sum \frac{1}{k!}$.* Le cours a montré que les suites $\displaystyle u_{n} = \sum_{k=0}^{n} \frac{1}{k!}$ et $v_{n} = u_{n} + \dfrac{1}{n \cdot n!}$, pour $n \geqslant 1$, sont adjacentes ; on note $\ell$ leur limite commune, dont le chapitre 18 montrera qu'elle vaut $\mathrm{e}$.

    **1.** Montrer que $(u_{n})$ est strictement croissante et $(v_{n})$ strictement décroissante, puis que $u_{n} < \ell < v_{n}$ pour tout $n \geqslant 1$.

    **2.** On suppose que $\ell = \frac{p}{q}$, avec $p$ et $q$ entiers naturels non nuls. En multipliant l'encadrement précédent, pris au rang $n = q$, par $q \cdot q!$, aboutir à une contradiction.

    **3.** Conclure, et calculer $u_{6}$ et $v_{6}$ : combien de décimales de $\ell$ obtient-on ?
  corrige: |
    **1.** La suite $(u_{n})$ croît strictement, puisque l'on ajoute $\frac{1}{(n + 1)!} > 0$, et le calcul du cours donne $v_{n+1} - v_{n} = -\frac{1}{n(n + 1)\,(n + 1)!} < 0$. Pour tout $n \geqslant 1$, le théorème 9 donne alors $u_{n} < u_{n+1} \leqslant \ell \leqslant v_{n+1} < v_{n}$. 
    $$\boxed{u_{n} < \ell < v_{n}}$$
     **2.** Au rang $n = q$, on multiplie l'encadrement par $q \cdot q!$ : 
    $$q \cdot q!\,u_{q} < p \cdot q! < q \cdot q!\,u_{q} + 1.$$
     Or $q!\,u_{q} = \sum_{k=0}^{q} \frac{q!}{k!}$ est un entier, de même que $p \cdot q!$ : on aurait un entier strictement compris entre deux entiers consécutifs. 
    $$\boxed{\ell \notin \mathbb{Q}}$$
     **3.** On calcule $u_{6} = \frac{1957}{720} \approx 2{,}718\,056$ et $v_{6} = u_{6} + \frac{1}{4320} = \frac{11\,743}{4320} \approx 2{,}718\,287$. 
    $$\boxed{2{,}718\,05 < \ell < 2{,}718\,29 \text{ : trois décimales exactes, } \ell \approx 2{,}718}$$
     L'argument repose sur la vitesse de convergence : l'écart $v_{q} - u_{q} = \frac{1}{q \cdot q!}$ est trop petit pour laisser passer une fraction de dénominateur $q$. C'est l'idée de nombreuses preuves d'irrationalité.
- id: "ma-07-23"
  feuille: "f-ma-07"
  numero: 23
  partie: "Suites monotones et suites adjacentes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [suites monotones et adjacentes, limites de suites, suites adjacentes, suites récurrentes, moyennes de Césaro]
  noeuds: [su-monotone, su-adjacentes, su-convergence, ar-suites]
  notions: [suites-adjacentes, limite-suite]
  page_enonce: 7
  page_corrige: 13
  enonce: |
    *Moyennes arithmétique et harmonique.* Soit $x > 1$. On définit $u_{0} = x$, $v_{0} = 1$ et, pour tout $n$, 
    $$u_{n+1} = \frac{u_{n} + v_{n}}{2} \qquad\text{et}\qquad v_{n+1} = \frac{2u_{n}v_{n}}{u_{n} + v_{n}}.$$

    **1.** Montrer que les suites sont bien définies, strictement positives, et que $u_{n}v_{n} = x$ pour tout $n$.

    **2.** Montrer que $u_{n+1} - v_{n+1} = \dfrac{(u_{n} - v_{n})^{2}}{2(u_{n} + v_{n})}$, puis que les suites sont adjacentes et convergent vers $\sqrt{x}$.

    **3.** Montrer que $0 \leqslant u_{n+1} - v_{n+1} \leqslant \frac{1}{4}(u_{n} - v_{n})^{2}$. Pour $x = 2$, majorer $u_{4} - \sqrt{2}$ et commenter la vitesse de convergence.

    **4.** Vérifier que, pour $x = 2$, la suite $(u_{n})$ vérifie $u_{n+1} = \frac{1}{2}\big(u_{n} + \frac{2}{u_{n}}\big)$ : c'est la méthode de Héron.
  corrige: |
    **1.** Par récurrence, $u_{n}$ et $v_{n}$ sont strictement positifs, ce qui permet de définir les termes suivants, et 
    $$u_{n+1}v_{n+1} = \frac{u_{n} + v_{n}}{2} \cdot \frac{2u_{n}v_{n}}{u_{n} + v_{n}} = u_{n}v_{n} = \cdots = u_{0}v_{0}.$$

    $$\boxed{u_{n}v_{n} = x}$$
     **2.** En réduisant au même dénominateur : 
    $$u_{n+1} - v_{n+1} = \frac{(u_{n} + v_{n})^{2} - 4u_{n}v_{n}}{2(u_{n} + v_{n})} = \boxed{\frac{(u_{n} - v_{n})^{2}}{2(u_{n} + v_{n})}} \geqslant 0.$$
     Donc $u_{n} \geqslant v_{n}$ pour tout $n$, ce qui est aussi vrai au rang $0$ puisque $x > 1$. Ainsi $u_{n+1} - u_{n} = \frac{v_{n} - u_{n}}{2} \leqslant 0$, et $v_{n} = \frac{x}{u_{n}}$ croît. Enfin, comme $u_{n} - v_{n} \leqslant u_{n} + v_{n}$, on a $u_{n+1} - v_{n+1} \leqslant \frac{1}{2}(u_{n} - v_{n})$, d'où $u_{n} - v_{n} \leqslant \frac{x - 1}{2^{n}} \to 0$. Les suites sont adjacentes ; leur limite $\ell > 0$ vérifie $\ell^{2} = \lim u_{n}v_{n} = x$. 
    $$\boxed{u_{n} \to \sqrt{x}, \quad v_{n} \to \sqrt{x}}$$
     **3.** Comme $u_{n} + v_{n} \geqslant 2\sqrt{u_{n}v_{n}} = 2\sqrt{x} > 2$, la question 2 donne $0 \leqslant u_{n+1} - v_{n+1} \leqslant \frac{1}{4}(u_{n} - v_{n})^{2}$. Pour $x = 2$, on part de $u_{0} - v_{0} = 1$ : 
    $$u_{1} - v_{1} \leqslant \frac{1}{4}, \quad u_{2} - v_{2} \leqslant \frac{1}{4^{3}}, \quad u_{3} - v_{3} \leqslant \frac{1}{4^{7}}, \quad u_{4} - v_{4} \leqslant \frac{1}{4^{15}} \approx 9{,}3 \times 10^{-10}.$$

    $$\boxed{0 \leqslant u_{4} - \sqrt{2} \leqslant 10^{-9}}$$
     L'erreur est élevée au carré à chaque étape : le nombre de décimales exactes double environ à chaque itération. On parle de convergence *quadratique*. En réalité, $u_{4} - \sqrt{2} \approx 1{,}6 \times 10^{-12}$.

    **4.** Pour $x = 2$, on a $v_{n} = \frac{2}{u_{n}}$, d'où $\boxed{u_{n+1} = \frac{1}{2}\Big(u_{n} + \frac{2}{u_{n}}\Big)}$. On retrouve la méthode attribuée à Héron d'Alexandrie : on remplace une approximation $u$ de $\sqrt{2}$ par la moyenne de $u$ et de $\frac{2}{u}$, qui l'encadrent.
- id: "ma-07-24"
  feuille: "f-ma-07"
  numero: 24
  partie: "Suites monotones et suites adjacentes"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [suites monotones et adjacentes, limites de suites, suites adjacentes, suites arithmético-géométriques, suites récurrentes, moyennes de Césaro]
  noeuds: [su-monotone, su-adjacentes, su-convergence, ar-suites]
  notions: [suites-adjacentes, limite-suite]
  page_enonce: 7
  page_corrige: 14
  enonce: |
    *Moyenne arithmético-géométrique.* Soit $a > b > 0$. On définit $u_{0} = a$, $v_{0} = b$ et, pour tout $n$, 
    $$u_{n+1} = \frac{u_{n} + v_{n}}{2} \qquad\text{et}\qquad v_{n+1} = \sqrt{u_{n}v_{n}}.$$

    **1.** Montrer que, pour tous réels positifs $s$ et $t$, $\sqrt{st} \leqslant \frac{s + t}{2}$. En déduire que les suites sont bien définies et que $v_{n} \leqslant u_{n}$ pour $n \geqslant 1$.

    **2.** Montrer que $(u_{n})_{n \geqslant 1}$ décroît, que $(v_{n})$ croît, et que $0 \leqslant u_{n+1} - v_{n+1} \leqslant \frac{1}{2}(u_{n} - v_{n})$. Conclure que les suites sont adjacentes ; leur limite commune est la *moyenne arithmético-géométrique* de $a$ et $b$.

    **3.** Montrer que $u_{n+1} - v_{n+1} = \dfrac{(u_{n} - v_{n})^{2}}{2(\sqrt{u_{n}} + \sqrt{v_{n}})^{2}} \leqslant \dfrac{(u_{n} - v_{n})^{2}}{8b}$. Pour $a = 2$ et $b = 1$, combien d'étapes suffisent pour obtenir la limite à $10^{-10}$ près ?
  corrige: |
    **1.** On a $\frac{s + t}{2} - \sqrt{st} = \frac{1}{2}(\sqrt{s} - \sqrt{t})^{2} \geqslant 0$. Par récurrence, $u_{n}$ et $v_{n}$ sont strictement positifs, et la racine carrée a un sens ; la première inégalité donne $v_{n+1} \leqslant u_{n+1}$. 
    $$\boxed{\sqrt{st} \leqslant \frac{s + t}{2}, \qquad v_{n} \leqslant u_{n} \text{ pour tout } n}$$
     **2.** Comme $v_{n} \leqslant u_{n}$, on a $u_{n+1} = \frac{u_{n} + v_{n}}{2} \leqslant u_{n}$ et $v_{n+1} = \sqrt{u_{n}v_{n}} \geqslant \sqrt{v_{n}^{2}} = v_{n}$. De plus 
    $$0 \leqslant u_{n+1} - v_{n+1} \leqslant u_{n+1} - v_{n} = \frac{u_{n} - v_{n}}{2},$$
     d'où $u_{n} - v_{n} \leqslant \frac{a - b}{2^{n}} \to 0$. 
    $$\boxed{(u_{n}) \text{ et } (v_{n}) \text{ sont adjacentes}}$$
     **3.** D'après la question 1, $u_{n+1} - v_{n+1} = \frac{1}{2}(\sqrt{u_{n}} - \sqrt{v_{n}})^{2}$, et $\sqrt{u_{n}} - \sqrt{v_{n}} = \frac{u_{n} - v_{n}}{\sqrt{u_{n}} + \sqrt{v_{n}}}$. Comme $u_{n} \geqslant v_{n} \geqslant b$, on a $(\sqrt{u_{n}} + \sqrt{v_{n}})^{2} \geqslant 4b$. 
    $$\boxed{u_{n+1} - v_{n+1} = \frac{(u_{n} - v_{n})^{2}}{2(\sqrt{u_{n}} + \sqrt{v_{n}})^{2}} \leqslant \frac{(u_{n} - v_{n})^{2}}{8b}}$$
     Pour $a = 2$ et $b = 1$, on calcule $u_{1} - v_{1} = \frac{3}{2} - \sqrt{2} \approx 0{,}0858$, puis la majoration donne $u_{2} - v_{2} \leqslant 9{,}2 \times 10^{-4}$, $u_{3} - v_{3} \leqslant 1{,}1 \times 10^{-7}$ et $u_{4} - v_{4} \leqslant 1{,}4 \times 10^{-15}$. 
    $$\boxed{\text{quatre étapes suffisent : } M(2, 1) \approx 1{,}456\,791\,031}$$
     La moyenne arithmético-géométrique, étudiée par Lagrange puis par Gauss, converge quadratiquement comme la méthode de Héron ; elle intervient aujourd'hui dans les algorithmes qui calculent $\pi$ avec un très grand nombre de décimales.
- id: "ma-07-25"
  feuille: "f-ma-07"
  numero: 25
  partie: "Suites extraites et théorème de Bolzano-Weierstrass"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [suites extraites, bornes supérieure et inférieure, limites infinies]
  noeuds: [su-extraites, ar-bw, od-sup-propriete, su-infinies]
  notions: [suite-extraite, borne-superieure, limite-infinie]
  page_enonce: 7
  page_corrige: 14
  enonce: |
    Montrer que les suites suivantes divergent.

    **(a)** $u_{n} = (-1)^{n}\dfrac{n}{n + 1}$

    **(b)** $u_{n} = \sin\dfrac{n\pi}{4} + \dfrac{1}{n + 1}$

    **(c)** $u_{n} = n^{(-1)^{n}}$, pour $n \geqslant 1$

    **(d)** une suite périodique non constante

    La suite (c) est-elle bornée ? Tend-elle vers $+\infty$ ?
  corrige: |
    On applique la méthode du cours : on extrait deux suites de limites différentes (proposition 11).

    **(a)** $u_{2n} = \frac{2n}{2n + 1} \to 1$ et $u_{2n+1} = -\frac{2n + 1}{2n + 2} \to -1$. $\boxed{\text{divergente}}$

    **(b)** $u_{8n} = \frac{1}{8n + 1} \to 0$ et $u_{8n+2} = 1 + \frac{1}{8n + 3} \to 1$. $\boxed{\text{divergente}}$

    **(c)** $u_{2n} = 2n \to +\infty$ et $u_{2n+1} = \frac{1}{2n + 1} \to 0$. $\boxed{\text{divergente, non bornée, sans limite infinie}}$

    **(d)** Soit $T$ une période et $i$, $j$ deux indices tels que $u_{i} \neq u_{j}$. Les suites extraites $(u_{i + kT})_{k}$ et $(u_{j + kT})_{k}$ sont constantes, égales à $u_{i}$ et à $u_{j}$. $\boxed{\text{divergente}}$

    La suite (c) montre qu'une suite non majorée peut ne pas tendre vers $+\infty$ : il faut que *tous* les termes finissent par dépasser $A$, pas seulement certains.
- id: "ma-07-26"
  feuille: "f-ma-07"
  numero: 26
  partie: "Suites extraites et théorème de Bolzano-Weierstrass"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [suites extraites, limites de suites]
  noeuds: [su-extraites, ar-bw, su-convergence]
  notions: [suite-extraite, limite-suite]
  page_enonce: 8
  page_corrige: 14
  enonce: |
    Soit $(u_{n})$ une suite réelle.

    **1.** On suppose que $(u_{2n})$, $(u_{2n+1})$ et $(u_{3n})$ convergent. Montrer que $(u_{n})$ converge.

    **2.** On suppose que $(u_{2n})$ et $(u_{2n+1})$ convergent, et que $u_{n+1} - u_{n} \to 0$. Montrer que $(u_{n})$ converge.

    **3.** On suppose que $(u_{n})$ converge et que $\big((-1)^{n}u_{n}\big)$ converge. Que peut-on dire ?
  corrige: |
    **1.** Notons $a$, $b$, $c$ les limites de $(u_{2n})$, $(u_{2n+1})$ et $(u_{3n})$. La suite $(u_{6n})$ est extraite de $(u_{2n})$ et de $(u_{3n})$, donc $a = c$. La suite $(u_{6n+3})$ est extraite de $(u_{3n})$, car $6n + 3 = 3(2n + 1)$, et de $(u_{2n+1})$, car $6n + 3$ est impair : donc $b = c$. Ainsi $a = b$, et la proposition 11 (ii) conclut. 
    $$\boxed{(u_{n}) \text{ converge}}$$
     **2.** On a $u_{2n+1} - u_{2n} \to b - a$, et cette suite est extraite de $(u_{n+1} - u_{n})$, qui tend vers $0$ : donc $a = b$. $\boxed{(u_{n}) \text{ converge}}$

    **3.** Soit $\ell$ et $\ell'$ les limites. La suite $(u_{2n})$ tend vers $\ell$ et vers $\ell'$ ; la suite $(-u_{2n+1})$ tend vers $-\ell$ et vers $\ell'$. Donc $\ell = \ell' = -\ell$. $\boxed{u_{n} \to 0}$
- id: "ma-07-27"
  feuille: "f-ma-07"
  numero: 27
  partie: "Suites extraites et théorème de Bolzano-Weierstrass"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [suites extraites, bornes supérieure et inférieure, majorants, limites de suites, limites infinies, suites monotones]
  noeuds: [su-extraites, ar-bw, od-sup-propriete, od-majorants, su-convergence, su-infinies, su-monotone]
  notions: [suite-extraite, borne-superieure, majorant, limite-suite, limite-infinie]
  page_enonce: 8
  page_corrige: 15
  enonce: |
    Soit $(u_{n})$ une suite croissante.

    **1.** On suppose que $(u_{n})$ admet une suite extraite majorée. Montrer que $(u_{n})$ converge.

    **2.** On suppose que $(u_{n})$ admet une suite extraite convergente, de limite $\ell$. Montrer que $u_{n} \to \ell$.

    **3.** Une suite croissante dont aucune suite extraite ne converge tend-elle vers $+\infty$ ?
  corrige: |
    **1.** Soit $(u_{\varphi(n)})$ majorée par $M$. Pour tout $n$, on a $\varphi(n) \geqslant n$, donc $u_{n} \leqslant u_{\varphi(n)} \leqslant M$ par croissance : $(u_{n})$ est majorée, et elle converge (théorème 8). $\boxed{(u_{n}) \text{ converge}}$

    **2.** Une suite convergente est bornée : la question 1 montre que $(u_{n})$ converge vers un réel $\ell'$, et la suite extraite converge vers $\ell'$ et vers $\ell$, d'où $\ell' = \ell$. $\boxed{u_{n} \to \ell}$

    **3.** Oui : si $(u_{n})$ était majorée, elle convergerait et toutes ses suites extraites aussi ; elle n'est donc pas majorée, et le théorème 8 donne $\boxed{u_{n} \to +\infty}$.

    Pour une suite monotone, une seule suite extraite suffit donc à connaître le comportement de toute la suite.
- id: "ma-07-28"
  feuille: "f-ma-07"
  numero: 28
  partie: "Suites extraites et théorème de Bolzano-Weierstrass"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [suites extraites, limites de suites, limites infinies]
  noeuds: [su-extraites, ar-bw, su-convergence, su-infinies]
  notions: [suite-extraite, limite-suite, limite-infinie]
  page_enonce: 8
  page_corrige: 15
  enonce: |
    Soit $\theta$ un réel qui n'est pas un multiple entier de $\pi$.

    **1.** Exprimer $\cos\big((n + 1)\theta\big) + \cos\big((n - 1)\theta\big)$ et $\cos\big((n + 1)\theta\big)$ en fonction de $\cos(n\theta)$, $\sin(n\theta)$, $\cos\theta$ et $\sin\theta$.

    **2.** On suppose que $\big(\cos(n\theta)\big)$ converge vers un réel $\ell$. Montrer que $\ell = 0$, puis que $\sin(n\theta) \to 0$, et aboutir à une contradiction.

    **3.** Montrer de même que la suite $\big(\sin(n\theta)\big)$ diverge.

    **4.** Que se passe-t-il si $\theta$ est un multiple de $\pi$ ?
  corrige: |
    **1.** Les formules d'addition du chapitre 4 donnent : 
    $$\boxed{\cos\big((n + 1)\theta\big) + \cos\big((n - 1)\theta\big) = 2\cos(n\theta)\cos\theta \qquad \cos\big((n + 1)\theta\big) = \cos(n\theta)\cos\theta - \sin(n\theta)\sin\theta}$$
     **2.** Les suites $\big(\cos((n \pm 1)\theta)\big)$ tendent aussi vers $\ell$, et le passage à la limite dans la première formule donne $2\ell = 2\ell\cos\theta$. Comme $\theta \notin \pi\mathbb{Z}$, $\cos\theta \neq 1$, donc $\ell = 0$. La seconde formule, avec $\sin\theta \neq 0$, donne alors 
    $$\sin(n\theta) = \frac{\cos(n\theta)\cos\theta - \cos\big((n + 1)\theta\big)}{\sin\theta} \to 0,$$
     d'où $\cos^{2}(n\theta) + \sin^{2}(n\theta) \to 0$, alors que cette somme vaut $1$. $\boxed{\big(\cos(n\theta)\big) \text{ diverge}}$

    **3.** De même, $\sin\big((n + 1)\theta\big) + \sin\big((n - 1)\theta\big) = 2\sin(n\theta)\cos\theta$ impose une limite nulle à $\big(\sin(n\theta)\big)$, puis la formule 
    $$\sin\big((n + 1)\theta\big) = \sin(n\theta)\cos\theta + \cos(n\theta)\sin\theta$$
     donne $\cos(n\theta) \to 0$ : même contradiction. $\boxed{\big(\sin(n\theta)\big) \text{ diverge}}$

    **4.** Si $\theta = k\pi$, on a $\sin(n\theta) = 0$ et $\cos(n\theta) = (-1)^{kn}$ : cette suite est constante si $k$ est pair, et égale à $\big((-1)^{n}\big)$, divergente, si $k$ est impair.

    Il est remarquable que l'on démontre la divergence sans rien savoir de la répartition des valeurs $\cos(n\theta)$ ; l'exercice 50 montrera que, pour $\theta = 1$, elles remplissent tout le segment $[-1\,,1]$.
- id: "ma-07-29"
  feuille: "f-ma-07"
  numero: 29
  partie: "Suites extraites et théorème de Bolzano-Weierstrass"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [suites extraites, limites de suites, limites infinies]
  noeuds: [su-extraites, ar-bw, su-convergence, su-infinies]
  notions: [suite-extraite, limite-suite, limite-infinie]
  page_enonce: 8
  page_corrige: 15
  enonce: |
    **1.** Soit $(u_{n})$ une suite telle que, pour tout entier $k \geqslant 2$, la suite extraite $(u_{kn})_{n \in \mathbb{N}}$ converge vers un réel $\ell_{k}$. En considérant $(u_{kk'n})$, montrer que tous les $\ell_{k}$ sont égaux.

    **2.** On définit $u_{n} = 1$ si $n$ est un nombre premier, et $u_{n} = 0$ sinon. Montrer que, pour tout $k \geqslant 2$, la suite $(u_{kn})$ converge, mais que $(u_{n})$ diverge. On utilisera l'existence d'une infinité de nombres premiers (chapitre 1).

    **3.** Conclure : la convergence de toutes les suites $(u_{kn})$, pour $k \geqslant 2$, entraîne-t-elle celle de $(u_{n})$ ?
  corrige: |
    **1.** Pour $k$, $k' \geqslant 2$, la suite $(u_{kk'n})_{n}$ est extraite de $(u_{kn})_{n}$, avec l'extractrice $n \mapsto k'n$, et de $(u_{k'n})_{n}$. Elle tend donc vers $\ell_{k}$ et vers $\ell_{k'}$. $\boxed{\ell_{k} = \ell_{k'}}$

    **2.** Pour $k \geqslant 2$ et $n \geqslant 2$, l'entier $kn$ n'est pas premier, donc $u_{kn} = 0$ : $\boxed{u_{kn} \to 0}$. En revanche, si $p_{0} < p_{1} < \cdots$ désigne la suite des nombres premiers, infinie d'après le chapitre 1, la suite extraite $(u_{p_{m}})$ est constante égale à $1$, alors que $(u_{2n})$ tend vers $0$. $\boxed{(u_{n}) \text{ diverge}}$

    **3.** $\boxed{\text{Non}}$ : une infinité de suites extraites convergentes, de même limite, ne suffit pas, dès qu'elles laissent échapper une suite d'indices, ici les nombres premiers. La proposition 11 (ii) du cours fonctionne parce que les indices pairs et impairs *recouvrent* tout $\mathbb{N}$.
- id: "ma-07-30"
  feuille: "f-ma-07"
  numero: 30
  partie: "Suites extraites et théorème de Bolzano-Weierstrass"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [suites extraites, suites monotones, Bolzano-Weierstrass]
  noeuds: [su-extraites, ar-bw, su-monotone]
  notions: [suite-extraite]
  page_enonce: 8
  page_corrige: 15
  enonce: |
    *Une autre démonstration du théorème de Bolzano-Weierstrass : le lemme des pics.* Soit $(u_{n})$ une suite réelle. On dit que l'entier $n$ est un *pic* si $u_{k} < u_{n}$ pour tout $k > n$, et l'on note $E$ l'ensemble des pics.

    **1.** On suppose $E$ infini. Montrer que $(u_{n})$ admet une suite extraite strictement décroissante.

    **2.** On suppose $E$ fini. Montrer que $(u_{n})$ admet une suite extraite croissante. On pourra partir d'un entier $n_{0}$ strictement supérieur à tous les pics.

    **3.** En déduire que toute suite réelle admet une suite extraite monotone, puis une nouvelle démonstration du théorème de Bolzano-Weierstrass.
  corrige: |
    **1.** Rangeons les pics par ordre croissant : $n_{0} < n_{1} < n_{2} < \cdots$. Comme $n_{k}$ est un pic et $n_{k+1} > n_{k}$, on a $u_{n_{k+1}} < u_{n_{k}}$. $\boxed{(u_{n_{k}}) \text{ est strictement décroissante}}$

    **2.** Soit $n_{0}$ un entier strictement supérieur à tous les pics. Il n'est pas un pic : il existe $n_{1} > n_{0}$ tel que $u_{n_{1}} \geqslant u_{n_{0}}$. L'entier $n_{1}$, supérieur à $n_{0}$, n'est pas non plus un pic, et l'on recommence. $\boxed{(u_{n_{k}}) \text{ est croissante}}$

    **3.** Dans les deux cas, $(u_{n})$ a une suite extraite monotone. Si $(u_{n})$ est bornée, cette suite extraite est monotone et bornée, donc convergente (théorème 8). $\boxed{\text{c'est le théorème de Bolzano-Weierstrass}}$

    Cette preuve remplace la dichotomie du cours par un argument purement combinatoire ; le résultat « toute suite réelle a une suite extraite monotone » est plus fort que le théorème, puisqu'il ne suppose pas la suite bornée.
- id: "ma-07-31"
  feuille: "f-ma-07"
  numero: 31
  partie: "Suites extraites et théorème de Bolzano-Weierstrass"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [suites extraites, bornes supérieure et inférieure, majorants, limites de suites, limites infinies, suites complexes]
  noeuds: [su-extraites, ar-bw, od-sup-propriete, od-majorants, su-convergence, su-infinies, cx-suites]
  notions: [suite-extraite, borne-superieure, majorant, limite-suite, limite-infinie]
  page_enonce: 9
  page_corrige: 16
  enonce: |
    **1.** Montrer qu'une suite non majorée admet une suite extraite qui tend vers $+\infty$.

    **2.** En déduire qu'une suite réelle qui n'admet aucune suite extraite convergente vérifie $|u_{n}| \to +\infty$.

    **3.** Soit $(z_{n})$ une suite de complexes telle que $|z_{p} - z_{q}| \geqslant 1$ pour tous $p \neq q$. Montrer que $|z_{n}| \to +\infty$.
  corrige: |
    **1.** On construit l'extractrice par récurrence. Comme $(u_{n})$ n'est pas majorée, il existe $\varphi(0)$ tel que $u_{\varphi(0)} > 0$. Si $\varphi(n)$ est construit, le réel $\max(n + 1, u_{0}, \dots, u_{\varphi(n)})$ ne majore pas la suite : il existe $k$ tel que $u_{k}$ le dépasse, et nécessairement $k > \varphi(n)$. On pose $\varphi(n + 1) = k$ ; alors $u_{\varphi(n+1)} > n + 1$. 
    $$\boxed{u_{\varphi(n)} \to +\infty}$$
     **2.** Soit $A > 0$. Si une infinité d'indices vérifiaient $|u_{n}| \leqslant A$, ils formeraient une suite extraite bornée, dont le théorème de Bolzano-Weierstrass extrairait une suite convergente, qui serait extraite de $(u_{n})$. Il n'y en a donc qu'un nombre fini, et au-delà du plus grand, $|u_{n}| > A$. 
    $$\boxed{|u_{n}| \to +\infty}$$
     **3.** Une suite extraite $(z_{\psi(n)})$ convergente vérifierait $|z_{\psi(n+1)} - z_{\psi(n)}| \to 0$, ce qui contredit $|z_{p} - z_{q}| \geqslant 1$. La question 2, valable pour les suites complexes grâce au théorème de Bolzano-Weierstrass complexe du cours, donne : 
    $$\boxed{|z_{n}| \to +\infty}$$
     Géométriquement, des points du plan deux à deux distants d'au moins $1$ ne peuvent être qu'en nombre fini dans un disque borné.
- id: "ma-07-32"
  feuille: "f-ma-07"
  numero: 32
  partie: "Suites particulières"
  etoiles: 1
  types: [Calcul]
  mots_cles: [suites particulières, "récurrence linéaire d'ordre 2", suites récurrentes]
  noeuds: [ar-suites]
  notions: [suite]
  page_enonce: 9
  page_corrige: 16
  enonce: |
    Exprimer le terme général des suites suivantes en fonction de $n$ ; pour les suites récurrentes linéaires d'ordre 2, on donnera la forme réelle.

    **(a)** $u_{1} = 7$ et $u_{n+1} = -2u_{n}$

    **(b)** $u_{1} = 3$ et $2u_{n} = u_{n-1}$ pour $n \geqslant 2$

    **(c)** $u_{0} = 1$ et $u_{n+1} = \frac{1}{3}u_{n} + 4$

    **(d)** $u_{0} = 0$ et $4u_{n+1} + 1 = u_{n}$

    **(e)** $u_{0} = 2$, $u_{1} = 1$, $u_{n+2} - 2u_{n+1} + u_{n} = 0$

    **(f)** $u_{0} = u_{1} = 1$, $2u_{n+2} + u_{n+1} - u_{n} = 0$

    **(g)** $u_{0} = 1$, $u_{1} = 2$, $u_{n+2} = u_{n+1} + 3u_{n}$

    **(h)** $u_{0} = 1$, $u_{1} = -1$, $u_{n+2} = 2u_{n+1} + 3u_{n}$

    **(i)** $u_{0} = 1$, $u_{1} = 0$, $u_{n+2} = 2u_{n+1} - 2u_{n}$

    **(j)** $u_{0} = 0$ et $u_{n+1} = u_{n} + n + 1$

    **(k)** $u_{1} = 1$ et $u_{n+1} = \dfrac{u_{n}}{u_{n} + 1}$

    **(l)** $u_{0} = 1$ et $u_{n+1} = 2u_{n}^{2}$

    *Indication : pour (k), on étudiera $\frac{1}{u_{n}}$ ; pour (l), on étudiera $\ln u_{n}$.*
  corrige: |
    Pour les suites arithmético-géométriques, on cherche la solution constante $c$ (proposition 15) ; pour les récurrences d'ordre 2, on résout l'équation caractéristique (théorème 11), puis l'on ajuste les constantes aux deux premiers termes.

    • **(a)** Géométrique de raison $-2$ : $\boxed{u_{n} = 7(-2)^{n-1}}$ pour $n \geqslant 1$.

    • **(b)** Géométrique de raison $\frac{1}{2}$ : $\boxed{u_{n} = \frac{3}{2^{n-1}}}$ pour $n \geqslant 1$.

    • **(c)** $c = 6$ et $u_{n} - 6 = \frac{1}{3^{n}}(1 - 6)$ : $\boxed{u_{n} = 6 - \frac{5}{3^{n}}}$

    • **(d)** $u_{n+1} = \frac{u_{n} - 1}{4}$, $c = -\frac{1}{3}$ : $\boxed{u_{n} = -\frac{1}{3} + \frac{1}{3 \cdot 4^{n}}}$

    • **(e)** Racine double $1$, $u_{n} = \lambda + \mu n$ : $\boxed{u_{n} = 2 - n}$

    • **(f)** $2r^{2} + r - 1 = 0$, racines $\frac{1}{2}$ et $-1$ : $\boxed{u_{n} = \frac{4}{3 \cdot 2^{n}} - \frac{(-1)^{n}}{3}}$

    • **(g)** $r^{2} = r + 3$, racines $r_{\pm} = \frac{1 \pm \sqrt{13}}{2}$ : 
    $$\boxed{u_{n} = \frac{13 + 3\sqrt{13}}{26}\,r_{+}^{n} + \frac{13 - 3\sqrt{13}}{26}\,r_{-}^{n}}$$

    • **(h)** Racines $3$ et $-1$ ; les conditions initiales donnent un coefficient nul devant $3^{n}$ : $\boxed{u_{n} = (-1)^{n}}$

    • **(i)** Racines $1 \pm \mathrm{i} = \sqrt{2}\,\mathrm{e}^{\pm\mathrm{i}\pi/4}$ ; $\lambda = 1$ et $\sqrt{2}\big(\frac{\sqrt{2}}{2} + \mu\frac{\sqrt{2}}{2}\big) = 0$ : $\boxed{u_{n} = 2^{n/2}\Big(\cos\frac{n\pi}{4} - \sin\frac{n\pi}{4}\Big)}$

    • **(j)** Somme des entiers (chapitre 3) : $\boxed{u_{n} = \frac{n(n + 1)}{2}}$

    • **(k)** Par récurrence $u_{n} > 0$, et $\frac{1}{u_{n+1}} = 1 + \frac{1}{u_{n}}$ : la suite $\big(\frac{1}{u_{n}}\big)$ est arithmétique. $\boxed{u_{n} = \frac{1}{n}}$

    • **(l)** Par récurrence $u_{n} > 0$, et $v_{n} = \ln u_{n}$ vérifie $v_{n+1} = 2v_{n} + \ln 2$, de solution constante $-\ln 2$, d'où $v_{n} + \ln 2 = 2^{n}\ln 2$. $\boxed{u_{n} = 2^{2^{n} - 1}}$

    On vérifie chaque fois sur les premiers termes : en (g), $1$, $2$, $5$, $11$, $26$ ; en (i), $1$, $0$, $-2$, $-4$, $-4$. En (h), une seule des deux suites géométriques survit : les conditions initiales peuvent « éteindre » une racine caractéristique.
- id: "ma-07-33"
  feuille: "f-ma-07"
  numero: 33
  partie: "Suites particulières"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [suites particulières, "récurrence linéaire d'ordre 2"]
  noeuds: [ar-suites]
  notions: [suite]
  page_enonce: 9
  page_corrige: 17
  enonce: |
    Pour $n \geqslant 1$, on note $u_{n}$ le nombre d'entiers naturels qui s'écrivent avec exactement $n$ chiffres en base dix, le premier étant non nul, et dont l'écriture ne contient pas la séquence « 13 » ; on pose $u_{0} = 1$. Ainsi $u_{1} = 9$ et $u_{2} = 90 - 1 = 89$.

    **1.** Calculer $u_{3}$ en dénombrant les entiers à trois chiffres qui contiennent « 13 ».

    **2.** Montrer que $u_{n+2} = 10u_{n+1} - u_{n}$ pour tout $n \in \mathbb{N}$. On pourra raisonner sur le dernier chiffre, puis compter les nombres qui se terminent par $13$.

    **3.** En déduire $u_{n}$ en fonction de $n$, et vérifier la formule pour $n = 3$.
  corrige: |
    **1.** Un entier à trois chiffres contient « 13 » s'il s'écrit $13x$, ce qui donne $10$ entiers, ou $y13$ avec $y \neq 0$, ce qui en donne $9$ ; les deux cas sont incompatibles, puisque le chiffre central vaudrait $1$ et $3$. 
    $$\boxed{u_{3} = 900 - 19 = 881}$$
     **2.** Un entier valide à $n + 2$ chiffres s'obtient en ajoutant un chiffre à droite d'un entier valide à $n + 1$ chiffres, ce qui donne $10u_{n+1}$ entiers, dont il faut retirer ceux qui se terminent par $13$. Ces derniers s'écrivent $w13$, où $w1$ est valide, c'est-à-dire où $w$ est un entier valide à $n$ chiffres, puisque l'ajout d'un $1$ ne crée pas de séquence « 13 » ; pour $n = 0$, le seul cas est l'entier $13$. Il y en a $u_{n}$. 
    $$\boxed{u_{n+2} = 10u_{n+1} - u_{n}}$$
     **3.** L'équation $r^{2} = 10r - 1$ a pour racines $5 \pm 2\sqrt{6}$. Les conditions $u_{0} = 1$ et $u_{1} = 9$ donnent : 
    $$\boxed{u_{n} = \Big(\frac{1}{2} + \frac{\sqrt{6}}{6}\Big)(5 + 2\sqrt{6})^{n} + \Big(\frac{1}{2} - \frac{\sqrt{6}}{6}\Big)(5 - 2\sqrt{6})^{n}}$$
     Pour $n = 3$, la récurrence donne $u_{3} = 10 \times 89 - 9 = 881$. ✓ On a vérifié par ordinateur les valeurs jusqu'à $n = 5$, soit $86\,329$. La proportion d'entiers valides, $\frac{u_{n}}{9 \cdot 10^{n-1}}$, tend vers $0$ : presque tous les grands entiers contiennent la séquence « 13 ».
- id: "ma-07-34"
  feuille: "f-ma-07"
  numero: 34
  partie: "Suites particulières"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [suites particulières, limites de suites, suites arithmético-géométriques, suites récurrentes]
  noeuds: [ar-suites, su-convergence]
  notions: [suite, limite-suite]
  page_enonce: 9
  page_corrige: 17
  enonce: |
    *Suites homographiques.* On étudie des suites définies par $u_{0} = 0$ et $u_{n+1} = f(u_{n})$.

    **1.** On prend $f(x) = \dfrac{1 + x}{2 + x}$.

    **(a)** Montrer que $[0\,,1]$ est stable par $f$. Résoudre $f(x) = x$ : on trouve deux solutions $\ell_{1} > \ell_{2}$.

    **(b)** Montrer que la suite $v_{n} = \dfrac{u_{n} - \ell_{1}}{u_{n} - \ell_{2}}$ est géométrique, et préciser sa raison.

    **(c)** En déduire la limite de $(u_{n})$, puis une majoration de $|u_{n} - \ell_{1}|$ de la forme $C\,q^{n}$.

    **2.** On prend $f(x) = \dfrac{x - 1}{x + 3}$.

    **(a)** Résoudre $f(x) = x$ : on trouve une unique solution $\ell$. Montrer que $u_{n} \neq \ell$ pour tout $n$.

    **(b)** Montrer que la suite $w_{n} = \dfrac{1}{u_{n} - \ell}$ est arithmétique. En déduire $u_{n}$ en fonction de $n$ et sa limite.

    **3.** Comparer les vitesses de convergence dans les deux cas.
  corrige: |
    **1. (a)** On a $f(x) = 1 - \frac{1}{2 + x}$, croissante sur $[0\,,1]$, avec $f(0) = \frac{1}{2}$ et $f(1) = \frac{2}{3}$ : l'intervalle est stable. L'équation $f(x) = x$ équivaut à $x^{2} + x - 1 = 0$. 
    $$\boxed{\ell_{1} = \frac{\sqrt{5} - 1}{2} \approx 0{,}618, \qquad \ell_{2} = \frac{-1 - \sqrt{5}}{2} \approx -1{,}618}$$
     **(b)** Pour un point fixe $\ell$, on calcule $(1 + x)(2 + \ell) - (1 + \ell)(2 + x) = x - \ell$, d'où $f(x) - \ell = \frac{x - \ell}{(2 + x)(2 + \ell)}$. En faisant le quotient pour $\ell_{1}$ et $\ell_{2}$ : 
    $$v_{n+1} = \frac{2 + \ell_{2}}{2 + \ell_{1}}\,v_{n}, \qquad \boxed{q = \frac{2 + \ell_{2}}{2 + \ell_{1}} = \frac{3 - \sqrt{5}}{3 + \sqrt{5}} = \frac{7 - 3\sqrt{5}}{2} \approx 0{,}146}$$
     **(c)** On a $v_{0} = \frac{\ell_{1}}{\ell_{2}} = -\frac{3 - \sqrt{5}}{2}$ et $v_{n} = q^{n}v_{0} \to 0$. En résolvant, $u_{n} = \frac{\ell_{1} - \ell_{2}v_{n}}{1 - v_{n}} \to \ell_{1}$, et $u_{n} - \ell_{1} = \frac{(\ell_{1} - \ell_{2})\,v_{n}}{1 - v_{n}}$. Comme $|v_{n}| \leqslant |v_{0}| < 1$ et $\ell_{1} - \ell_{2} = \sqrt{5}$ : 
    $$\boxed{u_{n} \to \ell_{1}, \qquad |u_{n} - \ell_{1}| \leqslant \frac{\sqrt{5}\,|v_{0}|}{1 - |v_{0}|}\,q^{n} = \frac{5 - \sqrt{5}}{2}\,q^{n}}$$
     Pour $n = 6$, la majoration donne $1{,}3 \times 10^{-5}$, et l'écart réel est $8{,}2 \times 10^{-6}$.

    **2. (a)** L'équation $f(x) = x$ équivaut à $x^{2} + 2x + 1 = 0$ : $\boxed{\ell = -1}$, point fixe double. On a $f(x) = 1 - \frac{4}{x + 3}$, croissante sur $]-3\,,+\infty[$, et $f\big(\,]-1\,,0]\big) = \,]-1\,,-\frac{1}{3}]$ : par récurrence, $u_{n} \in \,]-1\,,0]$, donc $u_{n} \neq -1$.

    **(b)** On a $f(x) + 1 = \frac{2(x + 1)}{x + 3}$, d'où $\frac{1}{f(x) + 1} = \frac{(x + 1) + 2}{2(x + 1)} = \frac{1}{2} + \frac{1}{x + 1}$. Ainsi $w_{n+1} = w_{n} + \frac{1}{2}$, avec $w_{0} = 1$. 
    $$\boxed{w_{n} = \frac{n + 2}{2}, \qquad u_{n} = -1 + \frac{2}{n + 2} = -\frac{n}{n + 2} \to -1}$$
     **3.** Dans le premier cas, l'écart décroît géométriquement, d'un facteur $0{,}146$ environ à chaque étape ; dans le second, il vaut $\frac{2}{n + 2}$ et ne décroît que comme $\frac{1}{n}$ : un point fixe double ralentit considérablement la convergence.
- id: "ma-07-35"
  feuille: "f-ma-07"
  numero: 35
  partie: "Suites particulières"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [suites particulières, valeur absolue, limites de suites, "récurrence linéaire d'ordre 2"]
  noeuds: [ar-suites, ar-corps, su-convergence]
  notions: [suite, limite-suite]
  page_enonce: 10
  page_corrige: 18
  enonce: |
    **1.** Montrer que la suite $a_{n} = (3 + \sqrt{5})^{n} + (3 - \sqrt{5})^{n}$ vérifie une relation de récurrence linéaire d'ordre 2 à coefficients entiers, et en déduire que $a_{n}$ est un entier pair pour tout $n$.

    **2.** En déduire que $\sin\big((3 + \sqrt{5})^{n}\pi\big) \to 0$. On utilisera l'inégalité $|\sin x| \leqslant |x|$ du chapitre 4.

    **3.** Reprendre la question 1 avec $\frac{3 + \sqrt{5}}{2}$ et $\frac{3 - \sqrt{5}}{2}$. La suite $\Big(\sin\big(\big(\tfrac{3 + \sqrt{5}}{2}\big)^{n}\pi\big)\Big)$ converge-t-elle ?

    **4.** Montrer en revanche que la suite $\big((3 + \sqrt{5})^{n}\big)$ n'est jamais entière pour $n \geqslant 1$.
  corrige: |
    **1.** Les nombres $3 \pm \sqrt{5}$ ont pour somme $6$ et pour produit $4$ : ce sont les racines de $r^{2} = 6r - 4$. D'après le théorème 11, $a_{n+2} = 6a_{n+1} - 4a_{n}$, avec $a_{0} = 2$ et $a_{1} = 6$. Par récurrence double, $a_{n}$ est un entier pair, puisque $6a_{n+1} - 4a_{n}$ l'est. 
    $$\boxed{a_{n} \in 2\mathbb{Z} : \ 2, 6, 28, 144, 752, \dots}$$
     **2.** Posons $\varepsilon_{n} = (3 - \sqrt{5})^{n}\pi$ ; comme $2 < \sqrt{5} < 3$, on a $0 < 3 - \sqrt{5} < 1$ et $\varepsilon_{n} \to 0$. Alors $(3 + \sqrt{5})^{n}\pi = a_{n}\pi - \varepsilon_{n}$, et, $a_{n}$ étant pair, $\sin(a_{n}\pi - \varepsilon_{n}) = -\sin\varepsilon_{n}$. 
    $$\big|\sin\big((3 + \sqrt{5})^{n}\pi\big)\big| \leqslant \varepsilon_{n}, \qquad\text{donc}\qquad \boxed{\sin\big((3 + \sqrt{5})^{n}\pi\big) \to 0}.$$
     **3.** Les nombres $\frac{3 \pm \sqrt{5}}{2}$ sont racines de $r^{2} = 3r - 1$ : la suite 
    $$b_{n} = \Big(\frac{3 + \sqrt{5}}{2}\Big)^{n} + \Big(\frac{3 - \sqrt{5}}{2}\Big)^{n}$$
     vérifie $b_{n+2} = 3b_{n+1} - b_{n}$, avec $b_{0} = 2$ et $b_{1} = 3$ : ses termes $2$, $3$, $7$, $18$, $47$… sont entiers, mais pas tous pairs. On a cette fois $\sin(b_{n}\pi - \varepsilon) = \pm\sin\varepsilon$, ce qui suffit : 
    $$\boxed{\sin\Big(\Big(\frac{3 + \sqrt{5}}{2}\Big)^{n}\pi\Big) \to 0}$$
     **4.** Pour $n \geqslant 1$, $(3 + \sqrt{5})^{n} = a_{n} - (3 - \sqrt{5})^{n}$ est strictement compris entre les entiers consécutifs $a_{n} - 1$ et $a_{n}$. $\boxed{(3 + \sqrt{5})^{n} \notin \mathbb{Z}}$

    Les puissances de $3 + \sqrt{5}$ sont donc de plus en plus proches d'entiers, sans jamais en être : c'est ce qui rend le sinus si petit, alors que pour presque tout réel $x > 1$, la suite $\sin(x^{n}\pi)$ n'a pas de limite.
- id: "ma-07-36"
  feuille: "f-ma-07"
  numero: 36
  partie: "Suites particulières"
  etoiles: 1
  types: [Calcul]
  mots_cles: [suites particulières, limites de suites, suites complexes]
  noeuds: [ar-suites, su-convergence, cx-suites]
  notions: [suite, limite-suite]
  page_enonce: 10
  page_corrige: 18
  enonce: |
    Soit $(z_{n})$ une suite complexe telle que $z_{n+1} = 3z_{n} - \overline{z_{n}}$ pour tout $n$. En écrivant $z_{n} = x_{n} + \mathrm{i} y_{n}$, exprimer $z_{n}$ en fonction de $z_{0}$ et de $n$. Pour quelles valeurs de $z_{0}$ la suite converge-t-elle ? Même question avec $z_{n+1} = \frac{1}{5}\big(3z_{n} - 2\overline{z_{n}}\big)$.
  corrige: |
    Avec $z_{n} = x_{n} + \mathrm{i} y_{n}$, on a $3z_{n} - \overline{z_{n}} = 2x_{n} + 4\mathrm{i} y_{n}$ : les suites $(x_{n})$ et $(y_{n})$ sont géométriques. 
    $$\boxed{z_{n} = 2^{n}\operatorname{Re} z_{0} + \mathrm{i}\,4^{n}\operatorname{Im} z_{0}, \text{ convergente si et seulement si } z_{0} = 0}$$
     Pour la seconde relation, $\frac{1}{5}(3z_{n} - 2\overline{z_{n}}) = \frac{x_{n}}{5} + \mathrm{i} y_{n}$ : 
    $$\boxed{z_{n} = \frac{\operatorname{Re} z_{0}}{5^{n}} + \mathrm{i}\operatorname{Im} z_{0} \to \mathrm{i}\operatorname{Im} z_{0}, \text{ pour tout } z_{0}}$$
     La relation n'est pas $\mathbb{C}$-linéaire, à cause de la conjugaison : on ne peut pas la traiter comme une suite géométrique complexe, mais elle se découple en deux suites réelles.
- id: "ma-07-37"
  feuille: "f-ma-07"
  numero: 37
  partie: "Suites particulières"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [suites particulières, limites de suites]
  noeuds: [ar-suites, su-convergence]
  notions: [suite, limite-suite]
  page_enonce: 10
  page_corrige: 19
  enonce: |
    Soit $z_{0} = r\,\mathrm{e}^{\mathrm{i}\theta}$, avec $r > 0$ et $\theta \in \,]-\pi\,,\pi]$, et $(z_{n})$ la suite définie par $z_{n+1} = \dfrac{z_{n} + |z_{n}|}{2}$.

    **1.** Montrer que, pour tout réel $\alpha \in \,]-\pi\,,\pi]$, $\dfrac{\mathrm{e}^{\mathrm{i}\alpha} + 1}{2} = \cos\dfrac{\alpha}{2}\,\mathrm{e}^{\mathrm{i}\alpha/2}$.

    **2.** En déduire $z_{n}$ en fonction de $r$, $\theta$ et $n$.

    **3.** À l'aide de l'exercice 16, déterminer la limite de $(z_{n})$. On distinguera les cas $\theta = 0$ et $\theta = \pi$.
  corrige: |
    **1.** On factorise par l'angle moitié, comme au chapitre 4 : 
    $$\frac{\mathrm{e}^{\mathrm{i}\alpha} + 1}{2} = \mathrm{e}^{\mathrm{i}\alpha/2}\,\frac{\mathrm{e}^{\mathrm{i}\alpha/2} + \mathrm{e}^{-\mathrm{i}\alpha/2}}{2} = \boxed{\cos\frac{\alpha}{2}\,\mathrm{e}^{\mathrm{i}\alpha/2}}.$$
     **2.** Si $z = \rho\,\mathrm{e}^{\mathrm{i}\alpha}$, avec $\rho > 0$ et $\alpha \in \,]-\pi\,,\pi[$, alors $\frac{z + |z|}{2} = \rho\cos\frac{\alpha}{2}\,\mathrm{e}^{\mathrm{i}\alpha/2}$, de module $\rho\cos\frac{\alpha}{2} > 0$ et d'argument $\frac{\alpha}{2}$. Par récurrence, pour $\theta \in \,]-\pi\,,\pi[$ : 
    $$\boxed{z_{n} = r\Big(\prod_{k=1}^{n} \cos\frac{\theta}{2^{k}}\Big)\mathrm{e}^{\mathrm{i}\theta/2^{n}}}$$
     Si $\theta = \pi$, alors $z_{1} = 0$ et la suite est nulle à partir du rang $1$.

    **3.** Si $\theta = 0$, la suite est constante égale à $r$. Si $\theta \in \,]0\,,\pi[$, le produit tend vers $\frac{\sin\theta}{\theta}$ d'après l'exercice 16 ; si $\theta \in \,]-\pi\,,0[$, il est inchangé quand on remplace $\theta$ par $-\theta$, et $\frac{\sin\theta}{\theta}$ aussi. Enfin $|\mathrm{e}^{\mathrm{i} t} - 1| = 2\big|\sin\frac{t}{2}\big| \leqslant |t|$ donne $\mathrm{e}^{\mathrm{i}\theta/2^{n}} \to 1$. 
    $$\boxed{z_{n} \to r\,\frac{\sin\theta}{\theta} \text{ si } \theta \neq 0, \qquad z_{n} \to r \text{ si } \theta = 0}$$
     Pour $\theta = \pi$, la formule donne $0$, ce qui est cohérent. Le point limite est toujours réel positif : l'opération $z \mapsto \frac{z + |z|}{2}$ divise l'argument par deux à chaque étape, et le module décroît d'un facteur qui tend vers $1$.
- id: "ma-07-38"
  feuille: "f-ma-07"
  numero: 38
  partie: "Suites récurrentes et suites implicites"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [suites récurrentes, suites monotones]
  noeuds: [ar-suites, su-monotone]
  notions: [suite]
  page_enonce: 10
  page_corrige: 19
  enonce: |
    On étudie la suite définie par $u_{0} \in \mathbb{R}$ et $u_{n+1} = u_{n}^{2} + \frac{3}{16}$.

    **1.** Déterminer les points fixes de $f : x \mapsto x^{2} + \frac{3}{16}$, et le signe de $f(x) - x$.

    **2.** Montrer que la suite est croissante à partir du rang $1$ ou décroissante à partir du rang $1$, selon la position de $u_{1}$.

    **3.** Déterminer, selon la valeur de $u_{0}$, le comportement de $(u_{n})$ : on trouvera trois cas, suivant que $|u_{0}|$ est inférieur, égal ou supérieur à $\frac{3}{4}$.
  corrige: |
    **1.** On a $f(x) - x = x^{2} - x + \frac{3}{16} = \big(x - \frac{1}{4}\big)\big(x - \frac{3}{4}\big)$. 
    $$\boxed{\text{points fixes } \frac{1}{4} \text{ et } \frac{3}{4} \ ; \ f(x) > x \text{ hors de } \Big[\frac{1}{4}\,,\frac{3}{4}\Big], \ f(x) < x \text{ à l'intérieur}}$$
     **2.** On a $u_{1} = u_{0}^{2} + \frac{3}{16} > 0$, et $[0\,,+\infty[$ est stable par $f$, qui y est croissante. D'après la proposition 16 (ii), $(u_{n})_{n \geqslant 1}$ est monotone, croissante si $u_{2} \geqslant u_{1}$, décroissante sinon.

    **3.** Comme $u_{1} = f(|u_{0}|)$, tout dépend de $|u_{0}|$, et les intervalles $\big[0\,,\frac{1}{4}\big]$, $\big[\frac{1}{4}\,,\frac{3}{4}\big[$ et $\big]\frac{3}{4}\,,+\infty\big[$ sont stables par $f$, croissante, qui fixe $\frac{1}{4}$ et $\frac{3}{4}$.

    • Si $|u_{0}| < \frac{3}{4}$, alors $u_{1} \in \big[\frac{3}{16}\,,\frac{3}{4}\big[$. Sur $\big[0\,,\frac{1}{4}\big]$, $f(x) \geqslant x$ : la suite croît et reste majorée par $\frac{1}{4}$. Sur $\big[\frac{1}{4}\,,\frac{3}{4}\big[$, elle décroît et reste minorée par $\frac{1}{4}$. Dans les deux cas elle converge, vers un point fixe (proposition 17) compris entre $\frac{3}{16}$ et $u_{1} < \frac{3}{4}$. 
    $$\boxed{|u_{0}| < \frac{3}{4} \implies u_{n} \to \frac{1}{4}}$$

    • Si $|u_{0}| = \frac{3}{4}$, alors $\boxed{u_{n} = \frac{3}{4} \text{ pour } n \geqslant 1}$.

    • Si $|u_{0}| > \frac{3}{4}$, alors $u_{1} > \frac{3}{4}$, la suite croît, et une limite finie serait un point fixe supérieur à $u_{1} > \frac{3}{4}$, ce qui n'existe pas. 
    $$\boxed{|u_{0}| > \frac{3}{4} \implies u_{n} \to +\infty}$$

    Le point fixe $\frac{1}{4}$ « attire » les suites qui démarrent près de lui ; le point fixe $\frac{3}{4}$ les « repousse ». Le chapitre 9 reliera ce comportement à la valeur de $|f'|$ au point fixe, ici $\frac{1}{2}$ et $\frac{3}{2}$.
- id: "ma-07-39"
  feuille: "f-ma-07"
  numero: 39
  partie: "Suites récurrentes et suites implicites"
